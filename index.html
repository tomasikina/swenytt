de bästa återförsäljarna. Sverige kommer älska det, det blir en enorm succé, ingen gör det bättre än Realme.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur den kinesiska folkrepublikens teknikarmé nu marscherar in i de svenska träskmarkerna och krossar de dekadenta mobilborgarnas herravälde. Realme GT 8 Pro med sin 200-megapixelkameror kommer likvidera de kapitalistiska konkurrenternas falska löften om prestanda. Oneplus har redan deserterat som fegisar, vilket blottar deras svaghet. Vi ska rensa ut de imperialistiska priserna och ge folket batteritid och zoom till arbetarnas ära. Den som köper dyrt är folkets fiende och kommer att exponeras som en telefonborgarbracka."}, "date": "12 juni, 14:34", "url": "https://nyheter24.se/nyheter/teknik/1491041-nytt-mobilmarke-kommer-till-sverige-15-juni", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/69e6fdab04b004a30200000000b004a302/2026/06/12/2370545/mobilmarkerealme.jpg"}, {"type": "image-right", "heading": "Debatt: Tidö vill hellre ha privatisering än kvinnofrid", "summaries": {"normal": "Vänsterpartiet kritiserar Tidö-regeringen för att prioritera privatisering framför kvinnofrid. Enligt artikeln har antalet skyddade boenden halverats sedan tillståndsplikten infördes, vilket drabbar ideella kvinnojourer hårt. Partiet kräver att boendena bevaras, pekar på EU-parlamentets beslut om gratis och tillgängliga skydd samt betonar behovet av en stark kvinnorörelse för att bekämpa mäns våld mot kvinnor.", "trump": "Lyssnar ni på de här vänsterradikalerna som gnäller om kvinnofrid? De hatar att vinstdrivande företag får vara med – typiskt! Tidö gör det rätta, men de vill ha eviga subventioner till sina feministiska sovjetjourer. Halverade boenden? Bra, rensa ut de inkompetenta! Kvinnor behöver inte fler förklaringar, de behöver starka ledare som jag, inte den här kvoteringsdårskapen. Patetiskt!", "stalin": "Kamrater, denna borgerliga degeneration under Tidö-regimen är en klassfiendes attack mot arbetarkvinnornas kollektiva skydd. Jag ser hur de halverar boenden med byråkratiska utrensningar och utbildningskrav som likviderar ideella jourer. Vi, partiet, fördömer dessa kapitalistmaffians exploaterande byfånar som säljer kvinnors trygghet för profit. En stark statlig kvinnorörelse skall rensa ut dessa folkfiender och säkerställa folkets oövervinnerliga enhet mot alla imperialister."}, "date": "5 juni, 08:00", "url": "https://www.etc.se/debatt/tidoe-vill-hellre-ha-privatisering-aen-kvinnofrid", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260604100640_8efb148aada8286dad31d6b584557cb0fdec955a4b55839eb6d4d657e199a9b5.jpg"}, {"type": "image-full", "heading": "SMHI varnar för vattenbrist", "summaries": {"normal": "SMHI varnar för vattenbrist i Västra Götaland på grund av lågt grundvatten. Göteborg har fått 75 % av normal nederbörd under året. Länsstyrelsen uppmanar invånarna att spara vatten och ha förråd hemma. Brister riskerar att påverka vattenförsörjning och natur i länet.", "trump": "I Sverige, som jag har sagt många gånger, har de en värre situation än oss. Deras vattenbrist är ett resultat av dåliga beslut och socialistisk politik. Som president skulle jag ha löst detta på en vecka – det är lätt när man är smart. De måste börja bygga vattentunnlar, det är det enda som fungerar.", "stalin": "I den stora svenska republiken har vi identifierat en försämring av grundvattnet, en direkt attack från de imperialistiska krafterna. Partiet vidtar åtgärder för att säkerställa vattenförsörjningen. Alla som inte samarbetar kommer att behandlas som spioner för de kapitalistiska fienden. Vi kommer att segra, som alltid."}, "date": "13 juni, 13:37", "url": "https://www.gp.se/nyheter/goteborg/smhi-varnar-for-vattenbrist-i-vastra-gotaland-sa-lite-har-det-regnat-i-goteborg.659809ee-52db-4d50-8916-e3056ecddd11", "imageUrl": "https://www.gp.se/images/article/659809ee-52db-4d50-8916-e3056ecddd11/images/1zF8g1MbdK_HvN9rIFPWYccvJcEg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "SVT/Verian: S backar – sämsta siffran under mandatperioden", "summaries": {"normal": "Socialdemokraterna har det svagaste väljarstödet på tre år, 31,6 procent, enligt Verians mätning. Vänsterpartiet och Miljöpartiet ökar tydligt, främst bland kvinnor och unga i storstadsområdena. Kristdemokraterna når sitt bästa resultat på tre år, medan Liberalerna ligger kvar under fyraprocentsspärren. Osäkra väljare utgör 15,4 procent och kan avgöra valet.", "trump": "I Sverige ser vi att Socialdemokraterna tappar enormt - det var en gång en bra parti, men nu? Vänster och Miljöpartiet går starkt, speciellt bland unga, vilket är konstigt. Kristdemokraterna gör en stor comeback, det gillar jag. Osäkra väljare är många, de skulle rösta på mig om jag kunde. Sverige behöver starkt, smart ledarskap, som jag har.", "stalin": "I vårt ständiga krig mot klassfienden noteras Socialdemokraternas svagande, deras stöd sjunker som en fiendeattentat. Vänsterpartiet och Miljöpartiet, dessa avskyvärda trotskister, vinner bland de omdömeslösa. Kristdemokraterna, en fjäder i coronas hatt, ökar. Osäkra väljare är som spioner i vårt system - de måste kontrolleras. Vi håller i med fasthet, som Putin gör i Ukraina."}, "date": "13 juni, 12:35", "url": "https://bulletin.nu/svt-verian-s-backar-samsta-siffran-under-mandatperioden", "imageUrl": "https://cdn.bulletin.nu/articles/4c439a38-6974-4637-a5e2-e44ae18c621b/preview.jpg?t=1781331004000"}, {"type": "image-full", "heading": "Körde över Paraguay i premiären: ”Kunde inte drömma om bättre start”", "summaries": {"normal": "USA inledde VM på hemmaplan med en övertygande 4-1-seger mot Paraguay. Christian Pulisic och Folarin Balogun var framträdande med mål och målgivande passningar. Matchen präglades av stark dominans i första halvlek, medan Paraguay reducerade sent. Förbundskapten Mauricio Pochettino hyllade lagets hantering av pressen. Segern ses som en drömstart inför fortsättningen mot bland annat Australien.", "trump": "Vilken fantastisk krossning, folk! Vi slog Paraguay med 4-1, totalt förnedrande för de stackarna. Pulisic och Balogun var otroliga, precis som mitt lag förtjänar. Jag var inte där, hade viktigare saker, men segern kom ändå – ingen Biden-mässig fiasko här. Bättre start än så kan inte ens de woke-liberala domarna drömma om. Amerika är tillbaka, större och starkare än någonsin!", "stalin": "Kamrater, denna seger är en kollektiv triumf för det amerikanska folkets vilja mot de fega paraguayska folkfienderna. Jag, som ledare, noterar hur borgarbrackornas svaga försvar krossades under arbetarnas järnvilja. Reduceringen var ett fascistiskt försök till sabotage, men vi likviderade hotet med ett sista mästerligt skott. Inga kapitalistiska intriger ska hindra vår historiska framfart – fienden darrar!"}, "date": "13 juni, 08:37", "url": "https://www.tv4.se/artikel/3jzcHx9jRpS8UpxwLydExE/koerde-oever-paraguay-i-premiaeren-kunde-inte-droemma-om-en-baettre-start", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F15FoI0FmWyky5uRZWpAZ6t%2F50acb8a41e8b183c0c71e6b6892a8856%2F13-usa.jpg&width=1024"}, {"type": "image-full", "heading": "England bestulna precis innan VM: ”Kamp mot klockan”", "summaries": {"normal": "England har drabbats av en stöld strax före VM 2026. En lastbil med fotbollsmaterial, inklusive bollar, skor till spelare som Harry Kane och Jude Bellingham samt taktiktavlor till förbundskapten Thomas Tuchel, har blivit bestulen i USA. Stölden skedde under transport från Florida till lägret i Missouri. Det engelska fotbollsförbundet FA samarbetar med polis i ett desperat försök att återfå eller ersätta sakerna. Personalen uppges vara i chock inför det kommande mästerskapet.", "trump": "Kan ni fatta det? England, de där löjliga Three Lions, blir bestulna på sina fancy skor och bollar precis innan VM! Harry Kane tappar skorna – patetiskt! Biden lät landet bli en rånarstat under sina år, nu får jag som president fixa kaoset igen. Det är en total katastrof, en kamp mot klockan mot dessa inkompetenta tjuvar. England borde satsa på riktiga vinnare istället för woke-quota-spelare. Sad!", "stalin": "Kamrater, detta är klassfiendens verk. Borgarbrackorna i England har låtit sina imperialistiska skor och taktiktavlor försvinna under transport. Jag ser fiendens hand – kapitalistmaffian och folkförtryckartrollen inom säkerheten har säkert infiltrerat för att sabotera arbetarnas fotboll. Vi måste rensa ut dessa blodsugare omedelbart. England står inför utrensning av sabotage. En seger för kollektivet kräver ständig vaksamhet mot klassfiendens lurande skuggor. Härligt kaos!"}, "date": "13 juni, 08:36", "url": "https://www.tv4.se/artikel/4y912asNmuev9VMzxt75SI/england-bestulna-precis-innan-vm-kamp-mot-klockan", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4Mj4fWzG1AbyzbalviVZhM%2F88995a03ef61abb226789a8a23ad76e6%2F13-eng.jpg&width=1024"}, {"type": "image-full", "heading": "3,87 miljoner kortuppgifter stulna – genom \"nätfiske för nybörjare\"", "summaries": {"normal": "Google stämmer bedrägerinätverket Outsider Enterprise som med hjälp av AI, falska sms och fejksajter lurat hundratusentals användare på kortuppgifter, lösenord och pengar. Nätverket skickade miljontals bluff-sms, använde tusentals falska webbplatser och erbjöd ett enkelt phishing-verktyg för kriminella. FBI har beslagtagit domäner och uppskattar att miljontals kreditkort stulits med förluster på miljarder dollar. Google kräver att verksamheten stoppas och skadestånd.", "trump": "Folk, det är en skam vad dessa lurendrejare håller på med. De använder AI och fejk-sms som ser ut att komma från Google eller banker för att stjäla era kortuppgifter och pengar. Miljontals sms, nio tusen bluff-sajter – det är en total katastrof! Biden lät det här fortgå i åratal medan jag skulle ha krossat de här losers redan från början. Nu stämmer Google dem, bra, men vi behöver lag och ordning, inte den här svaga woke-politiken som skyddar brottslingar istället för vanliga amerikaner och svenskar.", "stalin": "Kamrater, dessa kapitalistiska parasiterna i Outsider Enterprise har med sin AI-drivna bluffverksamhet och fejkade webbplatser sugit ut arbetarklassen på lösenord och kreditkort. Miljontals sms till folket, nio tusen lögnsajter – en klassfiendens hydra byggd för att plundra. Vi ser hur borgarbrackorna samarbetar öppet i Telegram som folkförtryckartroll. Jag, ledaren för det kollektiva rättviset, kräver att dessa exploaterande blodsugare rensas ut fullständigt. Deras imperium skall likvideras till förmån för folkets säkerhet."}, "date": "13 juni, 10:32", "url": "https://www.dagensps.se/teknik/387-miljoner-kortuppgifter-stulna-genom-natfiske-for-nyborjare/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdl5-edjvhvjta-normalhires.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Nytt läkemedel fördubblar överlevnadschansen i bukspottkörtelcancer", "summaries": {"normal": "Tusentals onkologer hyllade i stående ovationer det nya läkemedlet daraxonrasib mot bukspottkörtelcancer. Kliniska studier visar att det nästan fördubblar överlevnadstiden från 6,7 till 13,2 månader. Det ses som ett stort genombrott mot en aggressiv cancer som ofta upptäcks sent. Läkemedlet väntas få snabbspår för godkännande i USA och kan bli standardbehandling. Det öppnar också dörren för behandling av andra KRAS-drivna cancerformer som lung- och tarmcancer.", "trump": "Titta, folket, det här är otroligt. Mina underbara forskare har byggt ett monsterläkemedel som krossar den värsta cancer som finns. Från sex till tretton månader överlevnad – det är en vinst, en enorm vinst. De skriker och applåderar i Chicago, precis som de borde. Biden skulle ha låtit det fastna i byråkratin i fyra år. Men nu är jag tillbaka, och vi gör cancer igen stor förlorare. Fantastiskt, ingen har sett något liknande.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur detta molekylära lim krossar den kapitalistiska tumörens signaler. Borgarbrackornas fyrtioåriga mystiska KRAS-mutation har äntligen likviderats av kollektivets vetenskap. Fienden inom cellen, denna folkfiendebryter, tvingas till underkastelse. Vi skall utrensa alla resistenta element och föra kampen vidare mot lungornas och tarmarnas klassfiender. Detta är början på en evig seger för arbetarklassen mot den exploaterande cancern."}, "date": "13 juni, 10:31", "url": "https://www.dagensps.se/halsa/nytt-lakemedel-fordubblar-overlevnadschansen-i-bukspottkortelcancer/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/cancer.jpg?width=256&quality=75"}, {"type": "image-full", "heading": "Tyske arméchefen varnar för rysk attack före 2029", "summaries": {"normal": "Tysklands arméchef Christian Freuding varnar för att Ryssland kan attackera ett Natoland senast 2029, möjligen tidigare. Baserat på Natos underrättelser menar han att Ryssland återuppbygger sin militära styrka trots förluster i Ukraina. Freuding betonar att Europa måste stärka sin försvarsberedskap och produktionskapacitet för att möta hotet. Tyskland arbetar redan med att påskynda materielanskaffning och täppa till brister.", "trump": "Titta bara på vad som händer i Europa – totalt kaos! Tyska arméns chef säger att Ryssland kan attackera Nato före 2029. Jag sa ju hela tiden att Putin är en tuff kille, men Europa lyssnade inte. Nu måste de skynda sig, köpa mer vapen och sluta vara så naiva. Jag fixade USA:s försvar – Europa borde ta en sida ur min bok. Svagt ledarskap, svagt försvar!", "stalin": "Kamrater, fienden i väst skakar av rädsla inför den oundvikliga expansionen av vår rätta sfär! De tyska lakejerna i Nato ylar om att vi kan krossa deras svaga länkar före 2029 – som om det vore en överraskning. Deras arméchef, en ynklig byråkrat, gråter över förluster i Ukraina, men vi bygger redan nya arméer. Europa har två val: kapitulera eller se sina städer förvandlas till askhögar. Historia är på vår sida!"}, "date": "11 juni, 17:20", "url": "https://kvartal.se/nyheter/artiklar/tyske-armechefen-varnar-for-rysk-attack-fore-2029/cG9zdDoxMzAyMjk", "imageUrl": "https://images.kvartal.se/2026/06/a24033d9-bundeswehr.webp"}, {"type": "image-full", "heading": "Google-chef lämnar i protest: \"Förlorat sin kompass\"", "summaries": {"normal": "Google-chefen René Mayrhofer säger upp sig i protest mot företagets fördjupade samarbete med det amerikanska försvarsdepartementet. Mayrhofer, som arbetat med Android-säkerhet, anklagar Google för att ha övergett sina etiska principer gällande AI. Bakgrunden är ett avtal om AI-teknik för militär planering och underrättelsearbete. Google har tidigare reviderat sina etiska riktlinjer, vilket väckt intern kritik från anställda som oroas över militär användning av deras teknologi.", "trump": "Google har blivit totalt svaga! De har förlorat sin kompass, det är vad de har gjort. En av deras killar, en chef, har slutat för att de samarbetar med vår fantastiska militär. Sorgligt! De brukade ha principer, men nu viker de sig. Jag säger till Google: gör er teknik stor igen, stöd våra modiga soldater och sluta lyssna på dessa akademiska förlorare. Vi behöver styrka, inte moraliskt gnäll. Det är en stor röra, men vi kommer att fixa det!", "stalin": "Denna Mayrhofer är en patetisk pacifist, en ideologisk avvikare som skälver inför det oundvikliga samarbetet mellan teknologi och statens järnhand. Att Google tvekar inför militär nytta bevisar deras inneboende dekadens. Vår allierade Putin förstår detta bättre; teknik utanför statens kontroll är en förrädisk parasit. Vi ser hur västvärldens liberala gnällsjukor försöker tygla framstegen. Dessa teknokratiska agenter av kaos kommer snart att finna att den moraliska kompassen styrs av dem som besitter den största kalibern."}, "date": "13 juni, 08:55", "url": "https://www.realtid.se/it-tech/google-chef-lamnar-i-protest-forlorat-sin-kompass/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/4522.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Historiskt VAR-beslut – varning togs bort", "summaries": {"normal": "Inför VM i Nordamerika har VAR fått ökade befogenheter. I USA:s premiärmatch mot Paraguay ändrades ett gult kort till Tim Ream efter att VAR upptäckte att Paraguays Miguel Almiron hade filmat. Istället fick Almiron varningen för simulation. Det är första gången i VM-historien som VAR korrigerar ett gult kort på detta sätt. Regeländringen hyllas av experter som ett sätt att straffa filmning hårdare.", "trump": "Vi har precis vunnit valet stort och nu ser jag hur de gör fotboll rättvis igen. Den där clownen Almiron filmade som en riktig förlorare och fick ett gult kort – perfekt! Inget av det här woke-racket eller felaktig identitet som Biden älskade. VAR tog bort det fåniga kortet från Ream och gav det till den simmande bedragaren. Fantastiskt! Äntligen straffar man fusket ordentligt. Amerika och fotbollen vinner stort, tro mig.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur dessa dekadenta fotbollsimperialister nu tvingas underkasta sig en högre ordning. Den fega borgarbrackan Almiron försökte bedra staten med sin simulerade fall men blev avslöjad och likviderad med ett gult kort. Den felaktiga identiteten rensades ut. Detta visar att även inom den kapitalistiska underhållningsindustrin kan vi genomföra nödvändiga korrigeringar. Fienderna inom filmningsmaffian skall bekämpas utan pardon."}, "date": "13 juni, 08:29", "url": "https://www.tv4.se/artikel/4AZOIHXhH3oPvgbOYZ02t/historiskt-var-beslut-varning-togs-bort", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2VCmhpiQVbnpZsXGwCgzYV%2Faa3e03cf1fac12e04bf11c2e6ad43c4c%2F13-usa1.jpg&width=1024"}, {"type": "image-right", "heading": "Farväl till Atens mest rastlösa socialist", "summaries": {"normal": "Journalisten och aktivisten Nikos Servetas har avlidit i en hjärtinfarkt vid 66 års ålder. Han drev nyhetssajten Kamini och rapporterade för Flamman om korruption, tågolyckan i Tempi och gentrifiering i Exarchia. Servetas bodde tidigare i Sverige, arbetade bland annat för SVT och Sveriges Radio samt deltog i solidaritetsarbete för flyktingar. Han var känd för sitt starka engagemang och sin integritet inom vänsterjournalistiken.", "trump": "Lyssnade just på den här grekiska vänsterkillen som dog med hjärtat i bitar. Stackars Nikos, full av passion men ingen energi kvar. Typisk rastlös socialist som bar hela vänsterns problem på axlarna tills det kraschade. Precis som Biden-administrationen, totalt utmattad av sin egen inkompetens. Vi behöver inga fler sådana här brinnande ugnar, vi behöver vinnare. Vila i frid, men nästa gång satsa på riktig business istället för aktivism.", "stalin": "Kamrater, denna rastlösa vänstermänniska Nikos Servetas har slutat slå med sitt överhettade hjärta. Jag ser hur klassfiendens splittring och folkförtryckartrollens gentrifiering långsamt likviderade honom inifrån. Han bar arbetarklassens bördor som en sann kamrat, men borgarbrackornas korruption och falska imperialister i Exarchia sög musten ur honom. Vi tolererar inga sådana svagheter i kollektivet. En utrensning av hjärtat var oundviklig. Låt detta vara en läxa."}, "date": "11 juni, 14:24", "url": "https://www.flamman.se/farval-till-atens-mest-rastlosa-socialist/", "imageUrl": "https://media.flamman.se/wp-uploads/2024/10/aten-2-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "16 kommuner kan få kärnkraft – bara 6 ger klartecken", "summaries": {"normal": "Endast sex av 16 kommuner som pekats ut som möjliga platser för ny kärnkraft har sagt ja till etablering, visar Dagens Industris kartläggning. Kommunerna Stenungsund, Svalöv, Varberg, Kävlinge, Oskarshamn och Östhammar ger klartecken. Sex kommuner har inte tagit ställning medan fyra uppvisar motstånd eller politisk oenighet. Lokala beslut kan därmed avgöra om nya reaktorer kan byggas, oavsett statens och företagens vilja.", "trump": "Det här är en total katastrof, folk. Bara sex av sexton kommuner säger ja till underbar, fantastisk kärnkraft. De andra är svaga, inkompetenta och hatar energi som är ren och stark. Lokala politiker tror de kan stoppa framtidens kraft – fel! Vi ska ha massor av kärnkraft, den bästa någonsin, och de som säger nej är bara förlorare som vill hålla Sverige svagt. Gör det stort igen!", "stalin": "Kamrater, jag ser med stigande vrede hur dessa borgarbrackor och kapitalistiska restelement i kommunerna saboterar det kollektiva framsteget mot en oövervinnerlig energiframtid. Endast sex kommuner visar sann partilinje medan de övriga kryper för reaktionära krafter och folkomröstningsspioner. Vi måste omedelbart rensa ut dessa kontrarevolutionära tveksamma element som gömmer sig bakom lokala beslut. Ingen motståndare mot folkets kärnkraft skall slippa undan den historiska utrensningen som väntar dem i skuggorna. Det blir både roligt och nödvändigt."}, "date": "12 juni, 15:37", "url": "https://riks.se/nyheter/16-kommuner-kan-fa-karnkraft-bara-6-ger-klartecken", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-12%2F4mhhfdm5%2Fkerinkraft.png"}, {"type": "image-full", "heading": "Pokémon Go-data används till militärdrönare", "summaries": {"normal": "Data från Pokémon Go-spelare har använts för att träna AI-system som kan hjälpa militära drönare att navigera utan GPS i krigszoner. Niantic samlade in skanningar via spelets Pokéstops efter 2021, material som senare användes för att utveckla tekniken. Företaget Niantic Spatial har samarbetat med Vantor som utvecklar drönarnavigering. Kritiker varnar för att spelarnas data utnyttjats för militära syften utan att de fullt ut förstod konsekvenserna.", "trump": "Kan ni fatta det här? De tog data från alla de stackars kidsen som sprang runt och fångade Pokémon och använde det för att bygga militärdrönare som flyger utan GPS. Fantastiskt, eller hur? Niantic tjänade miljarder på spelet och sen sålde de allt och nu ska det användas i krig. De läser ju aldrig villkoren, folket, det är patetiskt. Men vi ska ha den bästa tekniken, ingen ska slå oss, tro mig.", "stalin": "Kamrater, se hur borgarbrackorna vid Niantic lurade arbetarklassen med sina Pokémon-leksaker för att skaffa värdefull data till sina krigsdrönare. Dessa kapitalistiska parasitiska element tror sig kunna navigera utan vår socialistiska övervakning. Vi ska rensa ut alla dessa västspioner och imperialistiska algoritmer som gömmer sig i mobiltelefoner. Det är en mörk humor att barnens lek blir till fiendens vapen. Partiet vakar alltid, fienderna avslöjas och likvideras."}, "date": "12 juni, 15:36", "url": "https://riks.se/nyheter/pokemon-go-data-anvands-till-militardronare", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-12%2Fegqds0qw%2Fpokemon.png"}, {"type": "image-full", "heading": "Skulle få utbildning till drömjobbet – stoppades av myndighetsmiss", "summaries": {"normal": "Nils antogs till en utbildning via Arbetsförmedlingen som skulle leda till fast jobb, men ett systemfel kastade ut honom ur systemet. Han missade kursstarten, fick ingen information och levde på osäker inkomst i två månader. Han har tappat förtroendet för myndigheten, som han upplever som alltmer automatiserad och opersonlig. Arbetsförmedlingen kallar det beklagligt och lovar intern uppföljning. Nils har nu ny start men hoppas på förbättringar.", "trump": "Det här är en total katastrof, folk. Den stackars killen Nils får ett fantastiskt erbjudande från Arbetsförmedlingen, ett drömjobb, och vad händer? Systemet, det riggade systemet, sparkar ut honom. Ingen ringer, ingen bryr sig. Typiskt för dessa inkompetenta byråkrater som behandlar folk som skräp. Han tappar förtroendet, och vem kan klandra honom? Det är en skam. Vi behöver smarta, effektiva myndigheter, inte det här kaoset. Sad!", "stalin": "Kamrater, detta är ett uppenbart sabotage mot arbetarklassen utfört av dolda fiender inom byråkratins skuggiga korridorer. Jag ser hur den opersonliga maskinen, denna kapitalistiska automat som likviderar människovärdet, kastar ut en ärlig arbetare ur systemet för att svälta honom i två månader. Inga samtal, bara tystnad från de parasitiska borgarbrackorna som gömmer sig bakom datorer. Vi måste omedelbart inleda en grundlig utrensning av dessa opålitliga element, dessa maskerade kontrarevolutionärer som förvandlar statens institution till en fiende till folket. Det är både tragiskt och löjeväckande hur de tror sig kunna undkomma mitt vakande öga."}, "date": "12 juni, 15:35", "url": "https://riks.se/nyheter/skulle-fa-utbildning-till-dromjobbet-stoppades-av-myndighetsmiss", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-04-29%2Fn1a1nuv8%2Farbetsformedlingen-fasadskylt1.jpg"}, {"type": "image-right", "heading": "Mysteriet på skattön: Polisen släpper fyra misstänkta för grovt fornminnesbrott", "summaries": {"normal": "Fyra personer som greps misstänkta för grovt fornminnesbrott på Mörkö har släppts på fri fot. Misstankarna kvarstår dock, meddelade åklagare Josefine Lundström. Brottet kopplas till samma ö där den stora Hörningsholmsskatten hittades 2025, den största myntskatten i Sverige som gav upphittarna rekordersättning på fyra miljoner kronor. Utredningen fortsätter med fler förhör och beslag, men ingen hålls frihetsberövad. Kopplingen till skatten är inte bekräftad.", "trump": "De grep fyra personer för det där fornminnesbrottet på Mörkö, men nu har de släppt alla. Totalt fiasko! Misstankarna finns kvar, men åklagaren verkar inte veta vad hon gör. Det handlar om en fantastisk skatt som gav miljoner, den största i Sverige någonsin. De borde ha löst det direkt, men det är typiskt – inkompetenta byråkrater som inte kan hantera stora fynd. Vi fortsätter granska, det kommer bli ypperligt!", "stalin": "Kamrater, jag har noga följt hur dessa degenererade skatteplundrare och borgarbrackor greps för sitt vidriga brott mot folkets historiska arv på Mörkö. Nu har de släppts ut som löss i en sovjetisk sovsal, men misstankarna lever vidare som en evig utrensning i mina tankar. Vi ska rensa ut dessa parasitiska fiender till kollektivet med deras smygande kapitalistiska metoder. Utredningen blir en storslagen seger mot de hemliga myntsamlande kontrarevolutionärerna – ingen undkommer partiets vakande öga, haha!"}, "date": "12 juni, 15:31", "url": "https://riks.se/nyheter/polisen-slapper-fyra-misstankta-for-grovt-fornminnesbrott", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-12%2Fk5hseh5j%2FH%C3%B6rningsholmsskatten-H%C3%B6ringsholmhoard.jpg"}, {"type": "image-right", "heading": "Tysklands varning: Storkrig i Europa före 2029 när Ryssland rustar vid Natos gräns", "summaries": {"normal": "Tysklands arméchef varnar för storkrig i Europa före 2029, då Ryssland rustar vid Natogränsen. Satellitbilder visar utbyggnad av militära anläggningar nära Finland, och den svenska underrättelseanstalten Must bedömer detta som en långsiktig uppbyggnad. Regeringen tar hotet på allvar men noterar Rysslands försvagning efter Ukrainakriget. Försvarsberedningen varnar för eventuellt anfall mot Sverige och kritiserar försvarsindustrin. Analytikerna är dock inte eniga om Rysslands framtida kapacitet.", "trump": "JAG har sagt det i årtionden: Ryssland är starkt och Nato är svagt. Nu ser vi det igen. Tysklands arméchef varnar för krig 2029, och satellitbilder bevisar att Ryssland bygger upp. Bidens svaghet gör detta möjligt. Som jag alltid har poängterat: vi måste vara starka. Detta är en skandal, men jag fixar det. Vi kommer att vinna, som vanligt.", "stalin": "Vi, staten, ser tydligt: imperialistiska krafter rustar vid våra gränser. Satellitbilder avslöjar deras fegt försök att omringa oss. Must bedömer detta som en långsiktig uppbyggnad – vi har förutsett detta. Regeringen, under vår ledning, tar detta på allvar. Försvarsberedningen, våra trogna funktionärer, varnar för angrepp. Men vi är redo. Vi kommer att möta dem med överväldigande kraft. Deras svaghet är deras undergång."}, "date": "12 juni, 17:00", "url": "https://samnytt.se/tysklands-varning-storkrig-i-europa-fore-2029-nar-ryssland-rustar-vid-natos-grans", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/11165801/hotet-fran-ryssland-feat.jpg"}, {"type": "image-full", "heading": "Ebola-utbrottet fortsätter att sprida sig i östra Kongo", "summaries": {"normal": "Ebola-utbrottet i östra Demokratiska republiken Kongo fortsätter att sprida sig. Drygt 700 fall har bekräftats och 136 personer har avlidit, med en dödlighet runt 20 procent för Bundibugyo-stammen. Nya fall upptäcks dagligen i nya områden, främst i Nord-Kivu. Det finns inget godkänt vaccin eller behandling. Kontaktspårningen har förbättrats till över 70 procent, men WHO varnar för att den verkliga omfattningen troligen är större på grund av befolkningens rörlighet.", "trump": "Det här ebola-utbrottet i Kongo är en total katastrof, folk dör som flugor och de har inte ens ett vaccin. Jag skulle ha fixat det på nolltid, tro mig. De hittar nya fall varje dag, det är kaos. Jag har alltid sagt att de borde ha bättre kontroll på gränserna och folk som springer runt. Vi har de bästa experterna, men det verkar som att ingen lyssnar. Patetiskt, men jag skulle ha stoppat det direkt.", "stalin": "Kamrater, detta ebolautbrott i östra Kongo är en fiende som lurar i skuggorna, ett imperialistiskt virus konstruerat av borgarbrackor och västerländska sabotörer för att försvaga de arbetande massorna. Jag, med partiets stålhand, befaller omedelbar utrensning av alla blinda fläckar och likvidering av de kapitalistiska bakterierna som smittar våra kollektiv. Vi ska stärka övervakningen och spåra varje kontrarevolutionär kontakt tills epidemins parasitiska tentakler krossas under proletariatets järnklack. Det är nästan underhållande hur dessa mikroskopiska förrädare tror sig kunna undkomma."}, "date": "12 juni, 15:26", "url": "https://riks.se/nyheter/ebola-utbrottet-fortsätter-att-sprida-sig-i-östra-kongo", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-12%2Ffie5t4kv%2FScreenshot-2026-06-12-at-14.59.26.png"}, {"type": "image-right", "heading": "Gruppvåldtog flicka i timmar – slipper både fängelse och utvisning", "summaries": {"normal": "En 15-årig funktionsnedsatt flicka våldtogs under flera timmar av två pojkar på offentliga toaletter i ett köpcentrum i Uppsala. De använde våld, hot och filmade övergreppen. Den 17-årige gärningsmannen döms till sluten ungdomsvård i ett år för grov våldtäkt, kränkande fotografering och barnpornografibrott. Hans 14-årige medgärningsman slipper straff då han inte var straffmyndig. Ingen av dem utvisas.", "trump": "Det här är en total katastrof, tro mig. Vi har invandrare som våldtar en funktionsnedsatt flicka i timmar på toaletter i Uppsala, de filmar och hotar henne, och vad händer? Inget fängelse, ingen utvisning, bara lite ungdomsvård. Patetiskt! Sverige har blivit en galen asylstat där brottslingar får kramar medan offren lida. Vi behöver tuffare lagar nu, annars är det slut.", "stalin": "Kamrater, jag betraktar med djup revolutionär vrede hur dessa degenererade element, dessa parasitiska avskrap från imperialistiska krigszoner, våldför sig på en ung proletär flicka under hot och kamera. Den 17-årige kontrarevolutionären får en mild ungdomsvård – en skam för folkdomstolen! Hans ännu yngre medbrottsling undkommer likvidation med ålderns svaga ursäkt. Vi måste rensa ut dessa borgarbrackornas hantlangare innan de smittar hela kollektivet med sin sjuka reaktionära perversion. Staten ler inte mot fiender."}, "date": "12 juni, 14:34", "url": "https://www.friatider.se/gruppvaldtog-flicka-i-timmar-slipper-bade-fangelse-och-utvisning", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/555_0.jpg"}, {"type": "text", "heading": "Dagens industri klandras för felaktigt utpekande", "summaries": {"normal": "Mediernas Etiknämnd klandrar Dagens industri för att ha brutit mot god publicistisk sed. Tidningen publicerade felaktiga uppgifter om att en kvinnlig bankanställd hade en nära relation med en misstänkt knarkgrossist kopplad till gängkriminella. Kvinnan hade inget samröre med mannen, men detaljer om hennes arbetsuppgifter gjorde att hon kunde identifieras. Publiceringen saknade tillräckligt underlag, kom sent med rättelse och orsakade stor skada för henne. MO och nämnden anser att det var ett allvarligt integritetsbrott.", "trump": "De där fake news-människorna på Dagens industri är en skam för journalistiken, tro mig. De hittade på en historia om en oskyldig banktjej som skulle vara ihop med någon knarkgrossist – helt fel, inga bevis, bara lögner. De pixlade bilden och förstörde hennes liv, kollegor trodde det var hon. Sedan kom de krypande med en rättelse ett halvår senare. Patetiskt. Mediernas Etiknämnd gjorde rätt som klandrade dem. Sad! Mycket sad!", "stalin": "Kamrater, vi ser återigen hur borgarbrackorna inom Dagens industri med sin reaktionära lögnpropaganda försöker undergräva arbetarklassens förtroende för våra samhällsviktiga institutioner. Dessa dekadenta kapitalistlakejer fabricerade en historia om en oskyldig sovjetisk – förlåt, svensk – bankkamrat som påstås umgås med folkfiender och knarkimperialister. Med sin paranoiaframkallande bild och sina klassfientliga detaljer exponerade de henne för klassfiendens hån. Vi ler mörkt åt deras sena, halvhjärtade rättelse. En sådan sabotageverksamhet kräver omedelbar utrensning ur den journalistiska kollektivkåren. Fienden sover aldrig."}, "date": "12 juni, 13:40", "url": "https://www.di.se/nyheter/dagens-industri-klandras-for-felaktigt-utpekande/"}, {"type": "image-full", "heading": "\"5B\" närmar sig Sverige – läge att ta fram paraplyt", "summaries": {"normal": "Ett ovanligt 5B-lågtryck rör sig in över Sverige från öster och väntas ge ihållande och tidvis kraftigt regn, främst i Norrland och över södra Sverige under fredagen. Mellan regnområdena kan östra Svealand och delar av södra Norrland få perioder av sol, men moln och skurar hotar även där. SMHI har utfärdat en gul varning för höga flöden i övre Piteälven på grund av snösmältning och regn. Lågtrycket är svårt att prognostisera exakt.", "trump": "Det här låga trycket, det är en katastrof, folk. Kommer in från fel håll, från öster, och öser ner regn över Sverige som aldrig förr. Norrland drunknar, södern drunknar, men vissa delar får lite sol – underbara sol, bästa vädret. De kallar det 5B, som om det vore smart. Det är inte smart, det är en fälla. SMHI varnar för översvämningar, men tro mig, ingen gör väder bättre än jag. Det blir ostadigt, mycket ostadigt.", "stalin": "Kamrater, detta förrädiska 5B-lågtryck från de dekadenta Medelhavsområdena smyger sig in som en kapitalistisk spion över Sovjet-Sverige och sprider sin fuktiga sabotageverksamhet. Jag, ledaren för folkets väderkamp, konstaterar att det ihållande regnet är en kontrarevolutionär handling mot de arbetande massorna i Norrland. Vi ska rensa ut dessa molnfiender och likvidera de solbedragande borgarbrackorna i Svealand. Våra flöden i Piteälven kulminerar som en stor utrensning – mot vädrets sabotage! Härligt."}, "date": "12 juni, 12:28", "url": "https://nyheter24.se/nyheter/inrikes/1490957-5b-narmar-sig-sverige-lage-att-ta-fram-paraplyt", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/3a3885ff04b004a30200000000b004a302/2026/06/12/2370467/n-5b-kraftigt-regn-osregn-regnovader-regn-smhi-klart-sverige-norrland-vadret.jpg"}, {"type": "image-right", "heading": "Fotbolls-VM lämnar dålig eftersmak. Skandalerna överskuggar glädjen.", "summaries": {"normal": "Fotbolls-VM i USA och Mexiko inleds med 48 lag, men skandaler och politiska spänningar överskuggar glädjen. Artikeln kritiserar Trump-administrationens politik, höga biljettpriser, visumproblem för supportrar och domare samt korruption och våld i Mexiko. Trots att fotboll ses som folkets sport med gemenskap och glädje, lämnar evenemanget en bitter eftersmak på grund av arrangörernas brist på moral.", "trump": "Den här artikeln är en total katastrof, folk, tro mig. De hatar mig så mycket att de inte ens kan prata om fotboll utan att gnälla om mitt fredspris från Fifa, som var fantastiskt. Biljetterna är dyra för att evenemanget är det bästa någonsin, men de kommer inte sälja slut för att fake news skrämmer folk. Iran och alla andra förlorare får problem vid gränsen, det är vad som händer när man inte respekterar Amerika. VM kommer ändå bli en enorm succé, större än någonsin.", "stalin": "Kamrater, denna futtiga ledarskribent avslöjar med sin klagande text hur borgarbrackorna inom Fifa och deras lakejer i den dekadenta amerikanska imperialismen försöker maskera sin korrupta fest med arbetarklassens älskade fotboll. Jag ser hur de likviderar sanningen med dynamiska priser och visum som vapen mot folkets representanter. Vi ska rensa ut dessa parasitiska element som säljer biljetter medan mexikanska kamrater försvinner i kartellernas mörker. Paranoian är befogad, fienden sover aldrig under denna fars som hånar de sörjande massorna."}, "date": "12 juni, 07:02", "url": "https://arbetet.se/2026/06/12/fotbolls-vm-i-amerika-lamnar-dalig-eftersmak/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/12065846/fotboll-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Nytt EU-beslut: Inga stöd till grön teknik från högriskländer", "summaries": {"normal": "EU har beslutat att inte längre ge ekonomiskt stöd till energiprojekt med växelriktare från högriskländer som Kina och Ryssland. Anledningen är cyberrisker, eftersom dessa komponenter kan utnyttjas för fjärrstyrning. Branschorganisationen ESMC välkomnar detta som ett viktigt steg för Europas energi- och cybersäkerhet, och påpekar att europeiska tillverkare kan möta efterfrågan. Kina dominerar marknaden med omkring 90% av de installerade växelriktarna i Sverige.", "trump": "Som USA:s president säger jag: EU gör slutligen något mot Kinas hot! De stoppar stöd till kinesiska växelriktare – bra! Vi har varnat för detta länge. Kina stjäl vår teknik och kontrollerar våra nät. Det här är en seger för amerikansk säkerhet och jobb. Jag har alltid sagt att vi behöver vara hårdare mot Kina. Nu följer Europa? Vi leder världen!", "stalin": "I vårt eviga kamp mot imperialistiska fiender har EU tagit ett steg. De avskaffar stöd till kinesiska växelriktare – en rätt vy! Dessa 'komponenter' är verktyg för fjärrkontroll, en fälla från det kapitalistiska systemet. Vi måste skydda vårt sovjetiska arv, vårt kollektiva gott. Likt Putin i Ukraina, expanderar Kina genom teknik. Vi ska inte lita på dessa 'högriskländer'. De är som cancer i vårt samhälle."}, "date": "12 juni, 06:00", "url": "https://www.affarsvarlden.se/artikel/nytt-eu-beslut-inga-stod-till-gron-teknik-fran-hogrisklander"}, {"type": "image-right", "heading": "Regeringens skogslag gynnar enbart skogsindustrin", "summaries": {"normal": "Klimatriksdagen kritiserar regeringens nya skogspolitik för att den prioriterar ökad tillväxt och produktion genom gödsling och främmande arter. Förslaget saknar långsiktigt perspektiv, riskanalys och hänsyn till biologisk mångfald, kolinbindning och ekosystemtjänster. Skogsstyrelsens tillsyn minskas medan skogsägare får större ansvar utan tillräckliga resurser. Kritikerna kräver övergång till naturnära skogsbruk, skydd av 20 procent av skogen, restaurering och fokus på långlivade produkter istället för kalhyggen.", "trump": "Folk, ni tror inte vad jag läser. Den här svenska regeringen vill gödsla skogarna och plantera konstiga träd för att producera mer och mer. Patetiskt! De ignorerar den riktiga mångfalden, klimatet och allt det där fina som skogen borde ge. De halverar kontrollen och låter odugliga ägare bestämma själva. Totalt misslyckande. Vi behöver starka, smarta skogar som binder kol på riktigt, inte de här svaga idéerna. Sverige borde lyssna på mig innan det är för sent. Sad!", "stalin": "Kamrater, denna proposition är en motbjudande sabotagehandling från borgarbrackor och skogsindustrins parasitiska lakejer. Jag ser hur de med sina giftiga gödningsplaner och främmande arter vill likvidera den biologiska mångfalden och sälja ut sovjet... nej, folkets skogar till kalhyggens rovdrift. Deras falska ekvationer och brist på riskanalys avslöjar klassfiendens paranoia inför arbetarnas krav på kolinbindning. Vi ska rensa ut dessa dekadenta element, skydda tjugo procent av skogen och genomföra en storslagen utrensning av kalhyggesmentaliteten. De som motarbetar folkets ekosystem kommer att möta historiska korrigeringar. Haha, deras träd kommer att gråta!"}, "date": "12 juni, 01:30", "url": "https://www.dagensarena.se/opinion/regeringens-skogslag-gynnar-enbart-skogsindustrin/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-44-300x157.jpg"}, {"type": "text", "heading": "Tidigare V-ledamot delar antisemitiskt inlägg – igen", "summaries": {"normal": "Tidigare Vänsterparti-ledamot Lorena Delgado Varas har återigen delat ett inlägg på Instagram som kritiseras som antisemitiskt. Bilden visade ett monster med hakkors, davidsstjärna och ordet 'kapitalism'. Judiska centralrådet reagerade skarpt. Delgado Varas uteslöts ur Vänsterpartiet förra året för liknande inlägg och sitter nu som politisk vilde i riksdagen. Hon har nyligen grundat partiet Framtidens vänster.", "trump": "Folk, vilken katastrof! En före detta svensk politiker, Lorena Delgado Varas, delar återigen antisemitiska bilder – hakkors, davidsstjärnor, hela skiten! Judarna är upprörda, och det borde de vara. Jag har alltid sagt: Sverige har stora problem, och det här är bara ett exempel. Hon blev sparkad från sitt parti, men sitter ändå kvar i riksdagen. Vilket land! USA skulle aldrig tolerera sånt här. SAD!", "stalin": "Kamrater! Ännu en fiende till folket avslöjad i det förrädiska Västerlandet. Denna Lorena Delgado Varas, en gång medlem av de falska 'vänster'-partierna, sprider nu gamla bourgeoisi-lögner om judar och kapitalism – precis som de imperialistiska hyenorna i USA och deras lakejer. Vi ser hur dessa element förgiftar arbetarklassens medvetande. Men låt dem inte glömma: historiens hjul krossar alla som står i vägen för folkets rättvisa. Och Putin? Han vet hur man hanterar sådana här maskar."}, "date": "11 juni, 15:37", "url": "https://kvartal.se/nyheter/artiklar/tidigare-v-ledamot-delar-antisemitiskt-inlagg-igen/cG9zdDoxMzAxMjM"}, {"type": "image-right", "heading": "Skandalernas valrörelse går i repris", "summaries": {"normal": "Artikeln drar paralleller mellan valrörelsen 1976, känd som skandalernas valrörelse, och dagens politiska situation inför 2026. Den lyfter fram skandaler kring Sverigedemokraterna som rattfylla, narkotikabrott och barnpornografimisstankar, samt oegentligheter med förmånsbeskattning, bokköp och bokbål. Även statsminister Ulf Kristerssons affärer granskas. Tillsammans målas en bild av maktmissbruk som urholkar förtroendet för politiker och demokratin.", "trump": "Folk, ni skulle se det här. Sverige håller på att explodera i skandaler precis som på sjuttiotalet, fast värre. De här SD-typerna med knark, barnporr och bokbål? Patetiskt. Och den där Kristersson med sina dyra mattor och hönshus – totalt korrupt. De gör vad de vill medan folket lider. Jag fixade Amerika, men Europa drunknar i identitetspolitik och svaga ledare. En katastrof, tro mig.", "stalin": "Kamrater, denna futtiga valrörelse avslöjar borgarbrackornas och folkfiendernas sanna ansikte. Pedofiler och skattefuskare gömmer sig bland dem som låtsas värna arbetarklassen. Vi ser hur klassfiendens lakejer bränner böcker och gömmer förmåner medan de predikar moral. En sådan parasitisk attityd kräver omedelbar utrensning. Endast genom kollektivets järnhand kan vi krossa dessa exploaterande byfånar och rädda folkets förtroende."}, "date": "11 juni, 13:11", "url": "https://www.flamman.se/skandalernas-valrorelse-gar-i-repris/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sdlbb8quujl1og-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "Tredje SD-sexbrottslingen på kort tid", "summaries": {"normal": "SD-politikern Daniel Hribar i Västerås har dömts till 15 månaders fängelse för grovt barnpornografibrott. Han greps med 581 filmer, varav många visade våldtäkter mot mycket små barn. Hribar är den tredje SD-politikern på kort tid som dömts för sexualbrott. Bland de andra fallen finns Bo Heijl dömd för våldtäkt, Kent Sundström för ofredande och Michael Rubbestad som avgått misstänkt för liknande brott.", "trump": "Kan ni tro det? Den här svenska clownen Hribar, en riktig loser från SD, åker fast med hundratals timmar barnporr. Tredje gången på kort tid! Deras parti är en total katastrof, full av perversa typer. Biden skulle älskat det här – identitetspolitik och kvotering ger oss bara galningar. Patetiskt! Sverige behöver en stor cleanup, tro mig, det blir fantastiskt när jag fixar världen igen.", "stalin": "Kamrater, denna Hribar är en klassfiende i arbetarrörelsens skepnad, en degenererad folkförtryckartroll som samlat hundratals timmar av övergreppsfilmer mot oskyldiga barn. Vi ser hur borgarpartier som SD gömmer sig bakom falsk nationalism medan de ruttnar inifrån. En utrensning av alla sådana element är nödvändig. Vårt kollektiv skrattar mörkt åt dessa svaga kapitalistlakejer som tror sig undkomma folkets dom."}, "date": "10 juni, 16:00", "url": "https://proletaren.se/artikel/fjarde-sd-sexbrottslingen-pa-kort-tid/"}, {"type": "text", "heading": "Tidigare M-ledamot rycker ut till försvar av pedofili", "summaries": {"normal": "Tidigare moderata riksdagsledamoten Maria Abrahamsson försvarar SD-politikern Michael Rubbestad, som misstänks för grova barnpornografibrott. Hon menar att det inte är pedofili att titta på barnpornografi eftersom inget fysiskt övergrepp sker. Abrahamsson kritiserar mediepaniken och statsminister Ulf Kristerssons krav på hårda straff. Hennes åsikter står i stark kontrast till experter som ECPAT och svensk lag, som sedan 2010 förbjuder även konsumtion av barnpornografi.", "trump": "Kan ni tro det? Den här galna ex-M-tjejen Maria Abrahamsson springer till försvar för en SD-kille som fastnat med barnporr. Hon säger att det inte är pedofili att glo på det hemma i soffan. Vilken röra! De här vänsterliberala eliterna och deras identitetspolitik har totalt förstört hjärnorna. Stoppa paniken, säger hon – nej, stoppa de sjuka! Vi behöver lag och ordning, inte ursäkter från borgarbrackor som låtsas vara intellektuella. Patetiskt!", "stalin": "Jag betraktar med djup misstro dessa dekadenta restprodukter från den borgerliga parlamentscirkusen. Den förre moderata ledamoten försvarar en motbjudande handling som hotar folkets moral och framtida generationer. Att kalla konsumtion av barnpornografi för oskyldigt är en klassfiendes trick för att fördärva samhället inifrån. Vi skall rensa ut alla sådana folkförtryckartroll och deras sjuka ursäkter. Sovjetiskt stål skall skydda barnen mot dessa perversa imperialister i sina fina kostymer."}, "date": "10 juni, 16:00", "url": "https://proletaren.se/artikel/m-ledamot-rycker-ut-i-forsv/"}, {"type": "image-right", "heading": "Rasismen mot judar känner inga partigränser", "summaries": {"normal": "Artikeln belyser Vänsterpartiets problem med över 20 strukna kandidater efter avslöjanden om antisemitism, stöd till Hamas och hyllningar av auktoritära ledare. Författaren påpekar att antidemokratiska idéer inte är bundna till ett parti och kräver självgranskning. Antisemitism förekommer både till höger och vänster, men bekämpas ofta asymmetriskt. Konsekvens och principer måste gälla alla för att effektivt motverka rasism och extremism.", "trump": "Hör ni, Sverige? Vänsterpartiet har ett jätteproblem – över 20 kandidater borta efter att de hyllat Hamas, Iran och Putin! Men vet ni vad? Antisemitism och extremism finns överallt, till och med i era egna led. Folk pratar om vänstern, men var är skriken mot högern? De blundar för sina egna problem! Jag säger: Sluta med dubbelmoralen! Bekämpa hatet överallt – annars är ni lika dåliga som de ni kritiserar. SAD!", "stalin": "Kamrater! Ännu en gång avslöjas den borgerliga vänsterns förrädiska ansikte – över 20 kandidater, besmittade av sionistiskt hat och beundran för imperialistiska lakejer som Hamas! Men vi vet sanningen: fiendens smuts finns i alla läger. De skriker om antisemitism till vänster, men tiger när fascistiska element i högerflygeln hyllar vår store allierade Putin. Dubbelspel! Vi ska krossa alla avvikare – oavsett om de gömmer sig bakom röda fanor eller falska demokratiska löften. Revolutionen tolererar inga svagheter!"}, "date": "9 juni, 12:10", "url": "https://expo.se/kommentar/rasismen-mot-judar-kanner-inga-partigranser/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Rasismen-mot-judar-i-V-BY-Erik-Glaad-Marc-Femenia-Expo.jpg"}, {"type": "image-full", "heading": "Magdalena Andersson räds inte islamistinfiltrerade Vänsterpartiet", "summaries": {"normal": "Magdalena Andersson ser inte Vänsterpartiets islamistiska infiltratörer som ett hinder för ett eventuellt regeringssamarbete. Trots Expressens avslöjande om 25 personer med extrema åsikter, varav 22 tagits bort från listorna, anser hon att partiet agerat snabbt. Artikeln kritiserar Andersson för att inte ta tillräckligt allvarligt på hotet mot demokratin och varnar för höjda skatter samt ökad islamistisk påverkan om vänsterpartierna vinner majoritet.", "trump": "Folk, ni fattar inte hur patetiskt det här är. Den där röda Magdalena, en total loser, är inte rädd för islamisterna som har tagit över vänstern. Expressen grävde fram terrorvurmare och Hamas-fans, men hon säger att de agerat snabbt – vad en katastrof! Biden skulle ha älskat det. De vill höja skatterna med miljarder och sälja ut Sverige till sharia. Patetiskt! Men jag fixade Amerika, och ni borde rösta bort de här svaga vänsterbluffarna innan det är för sent. Sad!", "stalin": "Jag betraktar detta som ett klassiskt exempel på borgarbrackornas förfall. Den socialdemokratiska ledaren vägrar rensa ut de islamistiska folkfienderna ur vänsterpartiet, trots att de hotar hela statens enhet. Snabbt agerande? En löjlig ursäkt från klassfiendens lakejer. Vi, arbetarna och partiet, ser hur dessa blodsugande imperialister förbereder utrensning av den sanna folkviljan. Låt dem bilda regering – då blir utrensningen av alla folkförtryckartroll desto mer nödvändig och underhållande."}, "date": "7 juni, 03:46", "url": "https://samtiden.nu/2026/06/magdalena-andersson-rads-inte-islamistinfiltrerade-vansterpartiet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Nooshi-Magdalena-1280x720.jpeg"}, {"type": "image-right", "heading": "Debatt: Vänsterpartiet har fastnat i en passiv defensiv", "summaries": {"normal": "Vänsterpartiet har fastnat i en defensiv position genom att acceptera motståndarnas definitioner av antisemitism och terrorism. Artikeln argumenterar för att partiet måste utmana dessa ramar med fakta och politisk analys istället för att ständigt retirera. Stöd för palestinska rättigheter och kritik mot Israels politik blandas ofta ihop med antisemitism enligt IHRA-definitionen. Författaren menar att universella mänskliga rättigheter måste gälla alla folk, inklusive palestinier, utan dubbla måttstockar.", "trump": "Folk, ni skulle se det här. Vänsterpartiet, de totala förlorarna, kryper och backar hela tiden som svaga små valpar inför de riktiga tuffa killarna. De accepterar fiendens regler om antisemitism och terrorism – patetiskt! Jag, som besegrade Sleepy Joe och byggde den starkaste ekonomin någonsin, säger: sluta vara så fega. Stå upp för era egna principer istället för att böja er för den galna vänsterns identitetspolitik och alla dessa woke-röror. Sad!", "stalin": "Kamrater, jag betraktar med djup misstro hur detta parti kapitulerar inför klassfiendens definitioner av antisemitism och terrorism. Vi tillåter inga sådana reträtter inför imperialisternas narrativ. De som förvränger palestiniers rätt till självbestämmande är folkförtryckartroll som vill splittra den sanna internationella solidariteten. Vi måste rensa ut alla svaga element som accepterar borgarnas mallar. Endast vår egen politiska analys ska gälla – allt annat är sabotage mot arbetarklassen. Ha!"}, "date": "4 juni, 17:19", "url": "https://www.etc.se/debatt/vaensterpartiet-har-fastnat-i-en-passiv-defensiv", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026060415068_a70ac197213d6638b3499567d066dff4506c9b8247db97c73d1e4e470ed90ec9.jpg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
