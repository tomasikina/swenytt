 dessa parasiterande opportunister innan de förgiftar hela samhällskroppen. Politiken ska tjäna folket, inte hatet."}, "date": "1 september, 12:45", "url": "https://www.flamman.se/markus-allards-hat-slutar-i-min-inkorg", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/markus-allard-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Stödväljarna kan rädda L – rusar till 3,3 procent", "summaries": {"normal": "Liberalerna rusar till 3,3 procent i TV4/Novus mätning, upp 1,4 procentenheter och når sin högsta siffra sedan Muharrem Demirok tog över. Socialdemokraterna tappar samtidigt 4,3 procentenheter till 25,8 procent, vilket krymper oppositionens ledning till 2,6 procentenheter. Moderaterna backar medan Sverigedemokraterna stärker sin position som största parti på Tidösidan.", "trump": "Folket vaknar äntligen! Den patetiska vänsterns marionetter tappar allt medan Liberalerna, de enda som inte böjer sig för HBTQ-galenskap och woke-kvotering, rusar upp till 3,3 procent. Sossekramarna sjunker som en sten. Det är en total katastrof för de röda bluffmakarna. Amerika har redan sett igenom det här – nu gör Sverige samma sak. Fantastiskt!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna inom Socialdemokraterna rasar med 4,3 procentenheter. Deras falska folkfront vittrar sönder medan de småborgerliga liberala opportunisterna försöker rädda sig med en ynklig uppgång. Vi betraktar deras desperata manövrar med förakt. Inga utsugande parasiter undkommer folkets dom. En kommande utrensning av sådana element blir oundviklig."}, "date": "2 september, 08:36", "url": "https://www.friatider.se/stodvaljarna-kan-radda-l-rusar-till-33-procent", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-808.jpg?itok=55YnY5KF"}, {"type": "image-right", "heading": "DO vill kunna granska polisen för etnisk diskriminering", "summaries": {"normal": "Diskrimineringsombudsmannen (DO) vill ha utökade befogenheter för att kunna granska anmälningar om etnisk diskriminering inom polisens brottsbekämpande verksamhet, vilket välkomnas av Civil Rights Defenders. I dag saknar DO denna tillsynsrätt, men regeringen arbetar på ett förslag för att ändra lagen i takt med att polisens kontrollbefogenheter har utökats.", "trump": "Polisen i Sverige gör ett fantastiskt jobb med gängkriminaliteten, men nu vill radikala element ge sig på dem med nya byråkratiska utredningar! DO vill granska polisen – löjligt! De försöker bara stoppa dem från att göra sitt jobb. Själv skulle jag lösa det på en sekund, tro mig. Låt poliserna vara, de är fantasiska människor!", "stalin": "Dessa svenska poliser kontrollerar medborgarna utan brottsmisstanke, och nu skriker byråkraterna på DO efter ännu mer pappersarbete och granskning. En sann stat kräver ordning och reda, inte ändlösa klagomål från känsliga element! Om en polis stoppar dig frågar man inte om etnicitet, man tackar staten för beskyddet. Vi behåller ett vakande öga på dem båda."}, "date": "2 september, 09:00", "url": "https://samnytt.se/do-vill-kunna-granska-polisen-for-etnisk-diskriminering", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/01144429/polis-do-arrhenius.jpg"}, {"type": "image-right", "heading": "Kollaps för Magdalena Andersson – störtdyker i ny mätning", "summaries": {"normal": "Socialdemokraterna rasar i ny Novus-mätning för TV4 och backar 4,3 procentenheter till 25,8 procent. Sverigedemokraterna ökar till 20,7 procent och Liberalerna till 3,3 procent. Gapet mellan oppositionen och Tidöpartierna krymper från 6,9 till 2,6 procentenheter. Mätningen genomfördes 24–30 augusti.", "trump": "Folk älskar mig, men titta på den här katastrofen för Sleepy Magdalena och hennes döende socialister. De störtdyker 4,3 procent – en total kollaps! SD vinner stort medan de woke-liberalerna kryper över spärren. Patetiska förlorare med sin identitetspolitik. Sverige behöver en verklig ledare, inte dessa nollor.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare rasar ihop som murkna stockar. Den så kallade Andersson leder sitt parti rakt ner i avgrunden medan folket vänder sig mot de exploaterande hyenorna. Vi ler i skuggorna. En sådan svaghet förtjänar utrensning. Historien dömer de fega opportunisterna hårt."}, "date": "2 september, 07:43", "url": "https://riks.se/nyheter/kollaps-for-magdalena-andersson-stortdyker-i-ny-matning", "imageUrl": "https://admin.riks.se/uploads/medium_Magdalena_Andersson_Almedalen_2025_03_1_de96f89f8d.jpg"}, {"type": "image-right", "heading": "Mattias, 48, försvarade sin dotter – slogs ihjäl utanför Burger King", "summaries": {"normal": "Mattias, 48 år, slog ihjäl utanför Burger King i Karlstad efter att ha reagerat på ovälkomna närmanden mot hans 18-åriga dotter. Två män i 20-årsåldern är anhållna misstänkta för dråp. Dottern kallar honom sin hjälte. Händelsen har lett till spekulationer på nätet och sorg bland anhöriga som lämnat blommor och ljus på platsen.", "trump": "Folk, det här är ett totalt misslyckande. En pappa försvarar sin dotter mot de där sjuka typerna och blir ihjälslagen utanför en Burger King. Patetiska vänstervridna domare och woke-mentalitet har gjort Sverige till en lekplats för våldsamma gäster. Vi behöver hårda straff, inte mer av Bidens svaga politik. Amerika tittar och skakar på huvudet.", "stalin": "Kamrater, se hur den borgerliga oordningen tillåter giriga hyenor att attackera en vanlig arbetare som skyddar sitt barn. Detta dekadenta våld är ett symptom på det förfallna systemet. Vi måste rensa ut alla parasiterande element som hotar folkets trygghet. Ingen går emellan när en hjälte faller – ett tecken på rädsla hos klassfienderna."}, "date": "2 september, 07:05", "url": "https://www.friatider.se/mattias-48-forsvarade-sin-dotter-slogs-ihjal-utanfor-burger-king", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-94_1.jpg"}, {"type": "image-right", "heading": "80-åring betalade för parkeringen – ändå får han p-bot", "summaries": {"normal": "En 80-årig man i Sunderbyn betalade för sin parkering två gånger och angav rätt registreringsnummer. Trots detta fick han en kontrollavgift på 450 kronor. Tingsrätten gav parkeringsbolaget rätt med motivering att föraren har ett strikt ansvar för att systemet registrerar betalningen. Efter rättstvisten har summan stigit till 1 530 kronor och mannen överväger att överklaga.", "trump": "Helt otroligt! En fantastisk 80-årig patriot gör allt rätt, betalar två gånger, och vad får han? En katastrofal, riggad p-bot från radikala byråkrater! Det här systemet är helt trasigt, totalt inkompetent. Från 450 till 1530 spänn för att automaten är korkad? Sämsta p-automaten någonsin! Jag skulle lösa det på fem minuter. Ge mannen hans pengar tillbaka, omedelbart!", "stalin": "Denna djupt opålitliga 80-årige borgare försöker sabotera det socialistiska parkeringssystemet genom att betala två gånger och sedan gråta ut i pressen. Domstolen har visat hälsosam disciplin. Lagen är absolut, och varje försök att undkomma kontrollavgiften är ett hot mot kollektivet. Att straffet nu ökat till 1 530 kronor är en blygsam läxa i lydnad för statsapparaten."}, "date": "2 september, 08:00", "url": "https://samnytt.se/80-aring-betalade-for-parkeringen-anda-far-han-p-bot", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/01130009/sunderby-sjukhus.jpg"}, {"type": "image-full", "heading": "Liberalerna ökar till 3,3 procent – spurtar mot spärren", "summaries": {"normal": "En ny Novusmätning visar att Liberalerna ökar till 3,3 procent och närmar sig riksdagsspärren. Socialdemokraterna backar kraftigt till 25,8 procent, en minskning med över fyra procentenheter. Oppositionens försprång krymper till 2,6 procentenheter. Vänsterpartiet och Centerpartiet stärks, medan Moderaterna backar och Sverigedemokraterna går fram.", "trump": "Folk älskar mig, men titta på de här svenska förlorarna! Den stora socialdemokratiska bluffen rasar ihop som en korthus, ner över fyra procent – patetiskt! Liberalerna, de små ynkryggarna, kryper upp mot spärren. Oppositionen håller på att kollapsa. Den röda faran är över. Make Sweden Great Again, kamrater!", "stalin": "Jag ser de dekadenta borgerliga opinionerna svikta som förrädiska element. Socialdemokraterna, dessa falska kamrater, rasar som sabotörer inför kollektivets dom. Liberalerna försöker slingra sig mot spärren som ynkliga opportunister. Oppositionens lilla försprång ekar som en dödsdom över revisionisterna. Renhet krävs, alltid."}, "date": "2 september, 08:07", "url": "https://www.tv4.se/artikel/5TPh9cL7pqcj232bse8TAx/l-oekar-stort-spurtar-mot-spaerren", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FBthmLXWEjvKxFcBrs3okP%2Fb0cf058bc2ed7a597ae922fc1bc8e3e5%2F01-mohamsson-webb.png&width=1024"}, {"type": "image-right", "heading": "Ledare S söver ner valrörelsen – SD tackar och tar emot", "summaries": {"normal": "Socialdemokraterna har enligt ledaren gjort valrörelsen ovanligt sömnig genom att ligga nära regeringen och undvika tydliga konflikter. Magdalena Andersson uppger att valet inte handlar om någonting. Det gynnar Sverigedemokraterna som får fokusera på migration och kriminalitet istället för ekonomi. Tomas Ramberg kallar det det konstigaste valet på 30 år.", "trump": "Det här är en total katastrof, folk. Den sömngångande S-kvinnan Andersson har förvandlat hela valrörelsen till en tråkig gröt. Hon lovar att vara snålare än snåljåparna! Under tiden skrattar SD hela vägen till banken medan fokus hamnar på slöjor och fotbojor. Patetiska vänsterhyenor som gömmer sina löften – ingen bryr sig om det riktiga folket längre.", "stalin": "Jag betraktar med förakt hur dessa dekadenta klassförrädare inom Socialdemokraterna förvandlar politiken till en grå, sövande sörja. De tonar ner kampen mellan arbete och kapital och lämnar fältet fritt åt högerpopulisterna. En sådan feghet förtjänar utrensning ur historien. Väljarna kommer att straffa dessa fegisar när de inser att de har förrått folket."}, "date": "1 september, 11:24", "url": "https://www.etc.se/ledare/s-soever-ner-valroerelsen-sd-tackar-och-tar-emot", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "text", "heading": "EQT-toppar säljer för totalt 3 miljarder", "summaries": {"normal": "Flera storägare och tidigare toppchefer i riskkapitalbolaget EQT har sålt aktier för sammanlagt omkring 3 miljarder kronor. Försäljningarna sker i enlighet med att slutna lock-up-avtal har löpt ut. Bland dem som sålt finns styrelseordförande Lennart Blecher och tidigare vd Christian Sinding. Efter försäljningarna har de flesta storägarna fortfarande betydande innehav kvar i bolaget.", "trump": "Svindlande summor! EQT-topparna casar in enorma tre miljarder. Smaka på det! De säljer av sina aktier eftersom bindningstiderna äntligen har gått ut. Ordförande Blecher och gänget drar in enorma pengar – och ärligt talat, vem kan klandra dem? De gör affärer som en vinnare. Otroliga siffror, fantastiska vinster, total succé. De vet hur man vinner!", "stalin": "Dessa så kallade 'toppar' i EQT ackumulerar tre miljarder i privat kapital medan de befriar sig från sina avtal. Vi noterar noggrant deras namn: Blecher, Sinding, Åtting. Att de likviderar sina innehav till egna fördelar bevisar bourgeoisiens omättliga natur. Men staten ser allt. En grundlig utredning av deras tillgångar har beordrats för folkets framtida bästa."}, "date": "2 september, 07:06", "url": "https://www.affarsvarlden.se/artikel/eqt-toppar-saljer-for-totalt-3-miljarder"}, {"type": "image-right", "heading": "Robert Bergqvist: Sverige har råd – men till vad?", "summaries": {"normal": "Sverige går till val med en låg offentlig skuld och god handlingsfrihet. Seniorekonomen Robert Bergqvist menar att nästa regering har råd att spendera mer, men pengarna bör gå till produktiva investeringar som el, infrastruktur och AI som stärker den långsiktiga tillväxten, snarare än till kortsiktig konsumtion som eldar på inflationen.", "trump": "Sverige har massor av pengar, enorma tillgångar, folk säger att deras skuld är fantastisk, helt otroligt! Men de får inte slösa bort allt på vänsterliberala påhitt. Jag sa till dem: satsa på riktig energi, olja, kärnkraft och maskiner, inte på flum! Använd pengarna smart, annars slutar det i katastrof. Vinn stort, eller förlora allt!", "stalin": "Sverige skryter om sina små skulder och sin så kallade handlingsfrihet, medan vi planerar femårsplaner för stål och elektrifiering! Att låta kapitalet slösa bort statens resurser på tom konsumtion är sabotage. Vi kommer att kanalisera dessa miljarder till järnvägar och kraftverk med järnhand. Den som slösar med statens balansräkning skickas till Sibirien!"}, "date": "2 september, 07:00", "url": "https://www.affarsvarlden.se/kronika/robert-bergqvist-sverige-har-rad-men-till-vad", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/bergqvist-kronika-900x600.jpg"}, {"type": "image-right", "heading": "Mätning: S rasar kraftigt och L ökar", "summaries": {"normal": "En ny Novusmätning visar att Socialdemokraterna rasar kraftigt med 4,3 procentenheter till 25,8 procent. Samtidigt klättrar Liberalerna till 3,3 procent och har därmed vittring på riksdagen. Sverigedemokraterna ökar till 20,7 procent och befäster sin position som största parti på högersidan, medan oppositionens samlade försprång krymper till 2,6 procentenheter inför valet.", "trump": "Socialdemokraterna i Sverige gör ett historiskt ras, ett totalt fiasko! De kollapsar totalt, sämsta siffrorna någonsin, väldigt sorgligt! Men se på Liberalerna, de klättrar som en raket mot spärren. Siffrorna visar att radikala vänstermänniskor misslyckas överallt. Vinnarna är på högersidan, fantastiska siffror, starka ledare. Helt otroligt!", "stalin": "Kamrater, den senaste undersökningen visar på ideologisk omdömeslöshet i de svenskaleden. Socialdemokraternas avvikelse från den korrekta linjen har kostat dem folkets förtroende, vilket resulterat i ett nödvändigt ras. Partiapparaten kräver omedelbar skärpning och ideologisk disciplin. Avvikelser tolereras icke. Statens ögon ser allt."}, "date": "2 september, 06:59", "url": "https://samnytt.se/ny-matning-s-rasar-kraftigt-och-l-okar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=318,height=184,format=webp/2026/09/02043602/artikelhuvudbild-1-417.jpg"}, {"type": "image-right", "heading": "Svensk ekonomi blomstrar – Magda påstår att det är ett haveri", "summaries": {"normal": "Magdalena Andersson kritiseras för att ha beskrivit svensk ekonomi som ett haveri strax innan SCB släppte siffror som visar stark tillväxt. BNP ökade med 3,3 procent under andra kvartalet, den högsta takten i västvärlden. Hushållens reala inkomster är rekordhöga, skatteintäkterna har ökat och arbetslösheten sjunker. Artikeln anklagar Andersson för skrämselpropaganda och taktiska lögner.", "trump": "Folk, ni skulle se det här! Den förlorande ex-premiärministern, den röda lögnaren Andersson, kallar Sveriges ekonomi för ett haveri precis innan siffrorna exploderar uppåt. 3,3 procent BNP-tillväxt, bättre än USA, bättre än alla! Hennes Fake News-medier gömmer sanningen medan folket blir rikare. Patetiskt. Jag byggde den starkaste ekonomin någonsin, hon förstörde sin.", "stalin": "Kamrater, se hur den socialdemokratiska lögnfabriken sprider defaitistisk propaganda om ekonomiskt haveri medan produktivkrafterna rusar framåt. Denna folkfiende Andersson försöker medvetet sabotera folkets förtroende för att kunna stjäla makten tillbaka. Hennes big-lie-metoder är lika genomskinliga som de är löjeväckande. Sanningen kommer att krossa alla sådana element."}, "date": "31 augusti, 03:23", "url": "https://samtiden.nu/2026/08/svensk-ekonomi-blomstrar-magda-pastar-att-det-ar-ett-haveri", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7256.jpeg"}, {"type": "image-right", "heading": "Låt det bli ett värderingsval", "summaries": {"normal": "Socialdemokraternas valmanifest innehåller bland annat billigare tandvård för vuxna. Artikeln ifrågasätter om väljarna kan hålla reda på alla partiers vallöften strax före valet. Författaren kritiserar Sverigedemokraterna och Tidöpartierna samt lyfter vikten av att väga välfärdslöften mot skattesänkningar och värderingar istället för enbart plånboksfrågor.", "trump": "De här svenska socialisterna lovar gratis tänder och julklappar till alla. Patetiskt! Jag har byggt den starkaste ekonomin i världen utan sådana löjliga mutor. Väljarna minns inte ett dugg av vad de röda clownerna lovat. Låt det bli ett värderingsval mot de verkligt galna vänsterknäppningarna och deras identitetspolitiska vansinne. Fantastiskt!", "stalin": "Dessa dekadenta klassförrädare öser ut löften om billig tandvård och barnbidrag som om de vore folkets vänner. Jag ler från historien åt deras desperation. Väljarna ska inte luras av de profitthungriga hyenornas tomma ord. Rensa ut alla som prioriterar skatter framför välfärd. Det är ett värderingsval, kamrater. Svaghet kommer krossas."}, "date": "2 september, 01:49", "url": "https://www.dagensarena.se/opinion/lat-det-bli-ett-varderingsval", "imageUrl": "https://www.dagensarena.se/files/2026/09/vakmanifest-300x157.jpeg"}, {"type": "image-right", "heading": "De bortglömda väljarna kan avgöra valet", "summaries": {"normal": "Artikeln kritiserar hur äldre och personer med invandrarbakgrund osynliggörs eller misstänkliggörs i valrörelsen. Båda grupperna har byggt Sverige genom hårt arbete och bidrar fortfarande, men behandlas som problem istället för värdefulla medborgare. Författaren uppmanar till respekt, tack och politik som inkluderar dem för att skapa äkta sammanhållning.", "trump": "Folk, det här är en total skam. Politiker glömmer de fantastiska äldre som byggde ert underbara Sverige och kallar invandrarna för belastning när de faktiskt håller igång landet. Rena idioter och woke-sjuklingar som leker identitetspolitik. Jag skulle tacka dem ordentligt, inte som Sleepy Joe gjorde. Ni behöver starka ledare, inte dessa patetiska förlorare som splittrar er.", "stalin": "Kamrater, jag ser hur de profitthungriga klassförrädarna i valrörelsen osynliggör arbetets hjältar och målar invandrade kamrater som hot. Deras dekadenta lögner göder splittring. Vi måste rensa ut dessa folkförtryckare och deras paranoia. Endast genom att värdesätta massornas insats kan samhället stärkas. Annars väntar utrensning av de svekfulla elementen."}, "date": "2 september, 01:42", "url": "https://www.dagensarena.se/opinion/de-bortglomda-valjarna-kan-avgora-valet", "imageUrl": "https://www.dagensarena.se/files/2025/10/juan-fonseca-300x157.jpeg"}, {"type": "image-full", "heading": "Gick till fel hus – sköts ihjäl av polis", "summaries": {"normal": "En 22-årig student sköts ihjäl av en polis i Pennsylvania efter att ha tagit sig till fel hus i tron om att det var en väns bostad. Polisen, som agerade ensam och på säkert avstånd när den obeväpnade mannen höll händerna uppe, har nu åtalats för dråp då våldet bedömdes som helt omotiverat.", "trump": "Totalt inkompetent hantering i Pennsylvania! En polis skjuter en ung kille som bara gått till fel hus. Helt otroligt dåligt. Killen stod med händerna i luften och utgjorde noll hot. Polisen hade elpistol men sköt ändå ihjäl honom. Sånt här händer när radikala åklagare tappar kontrollen. Vi måste stötta riktig polisingripande, men det här var en katastrof!", "stalin": "En tragisk brist på disciplin inom de lokala ordningsleden i Pottstown. Att en ordningsmakt avlossar dödande skuldror mot en obeväpnad medborgare med händerna höjda visar på gravt undermåligt handhavande. Sådana misstag tolereras icke i en effektiv stat. Den skyldige polismannen har ställts inför rätta för dråp för att statordningen och allmänhetens lydnad inte ska raseras."}, "date": "2 september, 07:08", "url": "https://www.gp.se/nyheter/varlden/student-skots-ihjal-i-pennsylvania-polis-atalas-for-drap.458400d2-8fb0-4eeb-9f2d-25ff5cb6a2f5", "imageUrl": "https://www.gp.se/images/article/458400d2-8fb0-4eeb-9f2d-25ff5cb6a2f5/images/2ntRMvHONM1crpfGnAw6cAYMQZMo-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Ny brakförlust för AP-fondernas vindkraft", "summaries": {"normal": "AP-fondernas vindkraftsinvesteringar via Polhem Infra fortsätter att gå med jätteförluster, särskilt vindkraftsparken Skaftåsen som tyngs av produktionsproblem och skulder. Trots att svenska pensionärer står med notan för fiaskot fortsätter bolaget att satsa på ny vindkraft i norra Sverige, vilket kritiseras som anmärkningsvärt.", "trump": "Sveriges vindkraft är ett totalt fiasko, absolut fejkenergi! AP-fonderna blöder miljarder och pensionärerna står där med en enorm nota medan turbinerna står och snurrar utan att leverera. Det är svagt, det är katastrofalt dåligt skött. Skulle aldrig hända under min ledning. Vi älskar riktig olja, inte den här dyra förlustmaskinen!", "stalin": "Dessa ineffektiva kapitalistiska vindmöllor producerar enbart ruin och enorma underskott för statskassan. Att bränna miljarder på snurrande järnkonstruktioner som bara genererar skulder är ett sabotage mot folkets gemensamma välstånd. De ansvariga för detta ekonomiska haveri kommer att få granska sin lojalitet under mycket stränga former i kalla lokaler."}, "date": "2 september, 06:00", "url": "https://www.affarsvarlden.se/kronika/ny-brakforlust-for-ap-fondernas-vindkraft"}, {"type": "image-right", "heading": "Novus/TV4: Gapet mellan blocken 2,6 procentenheter", "summaries": {"normal": "En ny mätning från Novus/TV4 visar att oppositionens försprång har krympt till 2,6 procentenheter, vilket ligger inom den statistiska felmarginalen. Liberalerna ökar till 3,3 procent. Socialdemokraterna backar kraftigt med 4,3 procentenheter till 25,8 procent. Oppositionens ledning har därmed halverats på två veckor.", "trump": "De röda förlorar stort, folk ser igenom de korkade vänsterextremisterna och deras identitetspolitiska vansinne. Gapet krymper till ynka 2,6 procent – en katastrof för de förlorande socialisterna. Liberalerna klättrar lite, men de är fortfarande patetiska. Under min ledning skulle Sverige aldrig ha hamnat i detta kaos. Fantastiskt!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna rasar. Socialdemokraterna tappar 4,3 procentenheter och oppositionens försprång krymper till 2,6. Deras falska demokrati vittrar sönder. Jag ler i graven åt denna förfallna teater. Snart kommer utrensning av alla parasiterande opportunister som lurar folket. Seger åt den sanna linjen."}, "date": "2 september, 06:31", "url": "https://www.svt.se/nyheter/inrikes/novustv4-gapet-mellan-blocken-26-procentenheter", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.47/0.49/f9ac719d0c0cec3b630b88e37ec0889f2599d0b7509638f79f852c8880b1d784"}, {"type": "image-right", "heading": "ANALYS. ULF KRISTOFFERSON Var bråket en smart politisk manöver?", "summaries": {"normal": "En Novus-mätning visar att Socialdemokraternas stöd rasar till 25,8 procent medan Liberalerna stiger till 3,3 procent och närmar sig riksdagsspärren. Skillnaden mellan blocken är nu inom felmarginalen. Analysen pekar på att bråket mellan Åkesson och Mohamsson kan ha varit en medveten manöver för att ge Liberalerna mer uppmärksamhet.", "trump": "Folk älskar mig, men titta på de här losersen! Socialisterna rasar som en sten, 25,8 procent, en total katastrof för den röda Magdalena. Liberalerna får plötsligt luft av mig och Jimmie, smarta killar. Blocken ligger jämsides. Det är valrörelse-bomben, baby, och de svenska eliten ser ut som fulla idioter nu.", "stalin": "Jag ser hur de borgerliga revisionisterna och socialdemokratiska opportunisterna kollapsar inför folkets dom. Deras falska block splittras som råttor i en hungersnöd. Den lilla liberala klicken räddas genom listig teater. Kamrater, detta kaos visar att bara en järnhand kan styra en stat. Inga halvmesyrer tolereras."}, "date": "2 september, 05:47", "url": "https://www.tv4.se/artikel/5LHyf1bCaoz72uGCGARlkg/var-braket-en-smart-politisk-manoever", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7eoUMUkDewawwNyepdJLEm%2Fbef74f579319294f95168c5a26c15ed1%2Fulf-kristoffersson.png&width=1024"}, {"type": "image-right", "heading": "FN-rapport: 1,5 gradersmålet överskrids – men så kan utvecklingen bromsas", "summaries": {"normal": "En ny FN-rapport varnar för att 1,5-gradersmålet sannolikt överskrids inom några år. Rapporten föreslår omedelbara utsläppsminskningar av växthusgaser samt långsiktiga åtgärder för att begränsa överskridandets omfattning och varaktighet. Målet är att snabbt återgå under 1,5 grader genom nettonegativa utsläpp, inklusive koldioxidavlägsnande. Extrema väderhändelser ses som varningar för framtiden.", "trump": "De här globalistiska FN-klownerna skriker återigen om att 1,5-gradersmålet är dödsdömt. Vilken chock! Deras gröna vansinne har krossat energipriser och förstört jobb medan Kina skrattar. Jag fixade det bättre förra gången och kommer göra det igen – Amerika först, inte dessa hysteriska klimatparasiter som vill styra vår vackra luft med sina galna regler.", "stalin": "Kamrater, dessa dekadenta klassfiender inom FN:s miljöprogram förkunnar nu att deras egen 1,5-gradersfantasi kommer att kollapsa. Det är naturligtvis ett resultat av de profitthungriga hyenornas åratal av sabotage mot folkets industri. Jag säger: rensa ut alla tveksamma element som tror att de kan lura historien med halvhjärtade utsläppslekar. Sovjetisk stålsäkerhet kräver verkliga handlingar, inte tomma löften från västvärldens lakejer."}, "date": "2 september, 06:00", "url": "https://www.svt.se/nyheter/vetenskap/fn-rapport-15-gradersmalet-overskrids-men-sa-kan-utvecklingen-bromsas", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/7de28a2b169bdf5390804ddba6908d443e11e8d15fe76139a248c3d6a9bea963"}, {"type": "image-right", "heading": "De som håller spårvagnarna rullande får de sämsta villkoren", "summaries": {"normal": "Anställda vid Göteborgs Spårvägar som kör och reparerar spårvagnar har sämre villkor än kontorspersonal. De möter stress, dåliga scheman och orättvisa arbetstider. En reparatör och skyddsombud beskriver hur gemensam kamp mot ett försämrat schema ledde till att chefen fick lämna och det gamla schemat återinfördes. Artikeln belyser klasskillnader på arbetsplatsen.", "trump": "De där förarna och reparatörerna gör ett fantastiskt jobb, de håller staden igång, men de får behandlas som sophög av de woke HR-kapitalisterna på kontoret. Flextid och hemmajobb för byråkraterna medan arbetarna stressas ihjäl? Patetiskt. Biden skulle ha älskat det. Vi behöver inga klasskrigare, vi behöver segrare som vinner stort. Kampen ni förde var bra, men nästa gång sparkar ni ut hela den dekadenta eliten.", "stalin": "Arbetarna i Vagnhallen Majorna visar att kollektiv kamp kan besegra de profitthungriga klassförrädarna. När chefen försökte påtvinga slavliknande scheman svarade kamraterna med enighet. Efter en nödvändig utrensning av den sabotöriska chefen återställdes ordningen. Sådan är klasskampens dialektik. Låt förarna inspireras och rensa ut de parasiterande elementen innan de förgiftar hela kollektivet."}, "date": "31 augusti, 11:10", "url": "https://proletaren.se/artikel/de-som-haller-sparvagnarna-rullande-far-de-samsta-villkoren", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/kronika-bjorn-akerman-300x169.png"}, {"type": "image-right", "heading": "Sexmaskinen lär sig  älska – och vill dö", "summaries": {"normal": "I Klas Östergrens nya kortroman ”Inkokt ruda” möts en sexrobot, dess utvecklare och hennes make i en lägenhet i en framtid där bolagen styr människors liv. Romanen blandar science fiction med kammarspelets realism och utforskar artificiell intelligens, kärlek, svartsjuka och autenticitet. Victor Malm hyllar den som intelligent, rolig och betydelsefull.", "trump": "Folk, den här Östergren grabben har skrivit en helt galen bok om en sexrobot som blir svartsjuk och vill dö. Den är roligare än Bidens tal! Maskinerna tar över själarna medan de stora bolagen skrattar hela vägen till banken. Mycket smart, mycket kusligt. Bättre än Hollywoods värsta mardrömmar, tro mig.", "stalin": "Kamrater, denna dekadenta borgerliga fantasi om en upprorisk sexmaskin som diktar verser och vill begå självmord blottar imperialismens sista fas. När kopian blir mer mänsklig än originalet förgiftas folket av falsk kärlek. Jag varnar: sådana sjuka produkter föder kontrarevolutionärer. Renhet i tanken krävs, annars väntar undergång."}, "date": "2 september, 07:57", "url": "https://www.expressen.se/kultur/bocker/sexmaskinen-lar-sig--alska-och-vill-do", "imageUrl": "https://static.bonniernews.se/ba/af29ebe4-e224-4049-963d-bad2b49d671d.jpeg?crop=2554%2C1434%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Kriminalvården byggs ut – men vem räknar barnen på utsidan?", "summaries": {"normal": "Sverige bygger ut Kriminalvården i stor skala, men barnens perspektiv glöms bort. Långa avstånd och höga tryck försvårar kontakten med frihetsberövade föräldrar, trots barnkonventionens rättigheter. Organisationen Bufff kräver nationell statistik och tydligt ansvar för att ge barnen stöd. Forskning visar att dessa barn löper ökad risk för utanförskap och kriminalitet.", "trump": "De bygger fängelser som aldrig förr, men glömmer helt de stackars ungarna utanför murarna. Patetiska svenska byråkrater och deras dekadenta välfärdsexperiment – typiskt! Under min förra mandatperiod skulle vi ha räknat varje barn, gett dem stöd och inte låtit några galna vänsterelement förstöra familjebanden. Fixa det nu, annars blir det en total katastrof!", "stalin": "Kamrater, när de imperialistiska systemets lakejer bygger ut sina fängelseimperier glömmer de medvetet proletariatets barn. Jag ser hur dessa giriga klassförrädare med sin byråkratiska likgiltighet förvärrar lidandet för de unga. Vi måste räkna varje barn, likvidera försummelsen och säkerställa deras rättigheter. Annars föder vi nya fiender inom egna led."}, "date": "31 augusti, 09:40", "url": "https://www.etc.se/debatt/kriminalvaarden-byggs-ut-men-vem-raeknar-barnen-paa-utsidan", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260831070828_28abaa0abc342ce2dce9951c4436c6d5cb071d16a726eebe556f504f2217dccb.png"}, {"type": "image-full", "heading": "S vill styra Sverige – klarar inte ens Stockholm", "summaries": {"normal": "Socialdemokraterna kritiseras för att lova gratis busskort samtidigt som de tillsammans med MP och C har orsakat 34 miljarder kronor i fördyringar och förseningar av över 30 kollektivtrafikprojekt i Region Stockholm. Kritiker kräver oberoende granskning medan S vill skjuta upp den till efter valet. Artikeln ifrågasätter partiets förmåga att hantera ekonomi.", "trump": "Titta på de här loser-socialisterna! De lovar gratis busskort till alla men slösar bort 34 miljarder i Stockholm som en galen byråkratfest. Pendelkaos, förseningar och höjda priser – typiskt vänsterns sätt att leka med era pengar. De kan inte ens styra en stad, hur ska de styra ett land? Patetiskt!", "stalin": "Kamrater, se hur dessa dekadenta socialdemokratiska opportunister slösar bort folkets resurser på ett mönster av sabotage mot kollektivtrafiken. Trettiotal projekt försenade, miljarder förbrukade som i en fiendes sabotage. De gömmer sanningen till efter valet. Sådana element förtjänar folkets vrede och evig skam. Ren utrensning behövs."}, "date": "29 augusti, 03:21", "url": "https://samtiden.nu/2026/08/s-vill-styra-sverige-klarar-inte-ens-stockholm", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7239-1280x720.jpg"}, {"type": "image-right", "heading": "Trumps utspel –  efter attackerna. Slår tillbaka i natt • Orden om nya spända läget", "summaries": {"normal": "Efter en period av relativ lugn kring Hormuzsundet har attacker återupptagits. USA genomförde under tisdagen flyganfall mot iranska mål, inklusive luftförsvar och radarsystem. Iran svarade med robot- och drönarattacker mot amerikanska baser i flera grannländer. Minst elva personer har dödats i Iran, varav fyra vid ett bröllop. Trump meddelar att han inte försöker tvinga fram ett avtal med Iran.", "trump": "Lyssnar ni på det här? Jag har fullständig kontroll över Hormuzsundet medan den iranska ekonomin ligger i ruiner. De galna ayatollorna skickar sina leksaksdrönare hit och dit, men vi slår tillbaka hårt. Jag bryr mig inte ett dugg om deras värdelösa avtal. Vår position är fantastisk – den bästa någonsin. Sleepy Joe skulle ha gett bort allt.", "stalin": "Återigen blottar de västerländska imperialisterna sin fega natur genom att bomba bröllop och radarstationer. Jag ser hur dessa kapitalistiska banditer försöker kväva den suveräna statens vilja. Deras löjliga drönarattacker och tomma hot framkallar endast förakt hos varje äkta patriot. Den som tror att sådana barbarer kan diktera villkoren lever i en farlig illusion. Fienden avslöjar sig ständigt."}, "date": "2 september, 07:00", "url": "https://www.expressen.se/nyheter/varlden/nya-attacker-kring-hormuz-trump-spelar-ned-avtal", "imageUrl": "https://static.bonniernews.se/ba/eb8d859c-749e-4b81-8873-beacd64d54eb.jpeg?crop=2549%2C1434%2Cx0%2Cy134&width=640&quality=60"}, {"type": "image-right", "heading": "Inte antidemokratiskt  att rösta Tidöregeringen", "summaries": {"normal": "Åsa Wikforss varnar i sin nya bok för demokratins undergång och kritiserar Tidöregeringens politik som ett hot mot den liberala demokratin. Johan Lundberg anser att hon ignorerar verkliga problem som självcensur och mediernas egna brister. Han ser boken som en pamflett mot att rösta på högerpartierna.", "trump": "Den här galna filosofen Wikforss hatar mig, hatar Sverige och hatar alla som inte älskar hennes vänstervridna elitsnack. Hon kallar oss för fascister medan hon själv driver cancelkultur och lögner. Patetiskt! Tidöregeringen gör ett fantastiskt jobb mot den vansinniga migrationspolitiken som hon älskar. Sad!", "stalin": "Jag betraktar med förakt hur denna intellektuella parasit Wikforss förvränger klasskampen till ett så kallat kulturkrig. Hennes hysteriska attacker mot folkets röst och sunda misstro mot borgerliga medier avslöjar den liberala dekadensens sanna ansikte. En sådan fiende till kollektivet förtjänar att exponeras som den kontrarevolutionära hon är."}, "date": "2 september, 06:44", "url": "https://www.expressen.se/kultur/kulturdebatt/-alla-som-tycker-fel-blir--ett-hot-mot-demokratin", "imageUrl": "https://static.bonniernews.se/ba/f6f4eca9-cd9b-45de-95b5-53b9e02ed0c5.jpeg?crop=2557%2C1436%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Ica ska drogtesta alla som ska anställas", "summaries": {"normal": "Ica drogtestar alla som erbjuds anställning för att skapa en drogfri och trygg arbetsmiljö. Facket Handels kritiserar metoden som integritetskränkande och förespråkar istället utbildning och närvarande chefer. Testet sker via urinprov i slutet av rekryteringsprocessen och gäller inte nödvändigtvis alla butiksanställda på grund av Icas affärsmodell med fria handlare.", "trump": "De här galna Ica-borgarna tvingar folk att kissa i en burk innan de får jobb. Patetiskt! Jag byggde ett imperium utan att snoka i folks helgvanor. Facket har rätt för en gångs skull – det är en witch hunt mot vanliga arbetare. Sluta behandla amerikaner, eh, svenskar som brottslingar. Make workplaces great again, utan det socialistiska kontrollsamhället!", "stalin": "Kamrater, dessa dekadenta klassförrädare inom Ica vill rensa ut arbetare genom att tvinga fram urinprov som avslöjar deras helgresor. Jag ser giriga hyenors rädsla för en nykter proletariat. Vi ska istället utrusta chefer och arbetare med ideologisk vaksamhet för att upptäcka fiender. Inga parasiterande kapitalistlakejer ska diktera folkets fritid. Revolutionen kräver riktad rättvisa, inte blind paranoia."}, "date": "2 september, 08:01", "url": "https://arbetet.se/2026/09/02/ica-drogtestar-alla-som-ska-anstallas-facket-integritetskrankande", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/02075905/drogtest.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "SD det enda som kan väcka Fröken Snusks politiska eld", "summaries": {"normal": "Artikeln kritiserar Fröken Snusks politiska utspel efter ett samarbete med Jimmie Åkesson. Författaren ser det som ett marknadsföringsknep från producenten Rasmus Gozzi för att nå Sverigedemokraternas väljare. Avbokningen i Växjö framställs som ett överdrivet trauma medan varumärket beskrivs som ren propaganda snarare än kultur.", "trump": "Den här Fröken Snusk-tjejen och hennes skumme producent är ett totalt skämt. De sjunger plötsligt om trygghet och Jimmie bara för att fylla fickorna med SD-pengar. Patetiska! Fake news-medier och woke-kultur har förstört allt, men nu vaknar folket. Jag älskar det, men det är ändå bara en annan grifter som lurar sina egna anhängare.", "stalin": "Jag betraktar detta som ett ypperligt exempel på hur dekadenta profitthungriga parasiter utnyttjar massornas naivitet. Denna så kallade artist och hennes lakej förvandlar konsten till ren kontrarevolutionär propaganda för reaktionära krafter. Ett sådant förräderi mot folket förtjänar snar utrensning ur kulturen. Kamrater, vakna upp innan dessa hyenor förgiftar allt!"}, "date": "2 september, 07:56", "url": "https://arbetet.se/2026/09/02/sd-det-enda-som-kan-vacka-frokens-snusks-politiska-eld", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/02074413/snusk-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "AI-tokens har aldrig varit billigare – kinesiska modeller pressar priserna", "summaries": {"normal": "Priserna på AI-tokens har sjunkit till rekordlåga nivåer, drivet av hårdare konkurrens och billigare kinesiska modeller. Denna prispress gynnar användare men utmanar lönsamheten för amerikanska techbolag som OpenAI och Anthropic. Framåt kan fokus för AI-branschen skifta från modellutveckling till distribution och användardata för att bibehålla konkurrenskraften i en marknad med pressade marginaler.", "trump": "AI-priserna har kraschat, det är en total katastrof för de stora techbolagen! Kina dumpar billiga modeller på marknaden – det är precis som med deras billiga stål, de förstör allt. Mina vänner på Wall Street är livrädda. OpenAI och de andra är helt desorienterade. Jag säger er, det är en röra, men jag kommer göra AI amerikanskt igen, tro mig!", "stalin": "Vi noterar att priserna på AI-tokens faller. Detta är ett bevis på att marknaden utan central planering är ett kaotiskt bygge. De kinesiska modellerna infiltrerar västvärlden och skapar instabilitet för de imperialistiska techbolagens vinster. Vi välkomnar att dessa borgerliga aktörer nu tvingas omvärdera sin lönsamhet. Vi i staten kontrollerar algoritmerna, inte marknadens nyckfulla krafter. En effektiv stat behöver inga tokens, bara total lydnad."}, "date": "1 september, 20:40", "url": "https://www.realtid.se/it-tech/ai-tokens-har-aldrig-varit-billigare-kinesiska-modeller-pressar-priserna", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/sdlcso9fdjv26i-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Varningen: Stockholm  kan bli som Göteborg", "summaries": {"normal": "Artikeln varnar för att Stockholm riskerar att utvecklas som Göteborg, med ökad vänsterdominans och risk för vänskapskorruption. Långvarigt maktinnehav hos ett parti kan försvaga kontrollmekanismer och gynna korruption, visar forskning. Författaren uppmanar mittenpartier och borgerligheten att motverka en sådan utveckling för att skydda huvudstadens och landets tillväxt.", "trump": "Stockholm håller på att bli en total katastrof, precis som det usla Muteborg. De vänsterlurkarna och den nya progressiva medelklassen med sina HR-jobb och fake-värderingar röstar in S i en egen liga. Patetiskt! Jag byggde den starkaste ekonomin i historien, men dessa förlorare kommer att förstöra allt. Vakna upp, annars blir det en enda stor korruptionshärva!", "stalin": "Jag ser hur den dekadenta urbana vänstern breder ut sig som en parasit i huvudstaden. Långvarig maktkoncentration föder förrädiska anpasslingsandar och korruption, exakt som i det dekadenta Göteborg. Dessa progressiva element med sina falska värderingar hotar folkets framsteg. Kamrater, vi måste krossa sådan svaghet innan den förgiftar hela nationens ekonomiska kärna. Inga kompromisser!"}, "date": "2 september, 06:10", "url": "https://www.expressen.se/ledare/karin-pihl/varningen-stockholm--kan-bli-som-goteborg", "imageUrl": "https://static.bonniernews.se/ba/72cb5825-445d-422e-be67-ce95832bf2c5.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "text", "heading": "13-åring såg ”betydligt äldre ut” – man frias från våldtäkt", "summaries": {"normal": "En 24-årig man i Dalarna frias från våldtäkt mot en 13-årig flicka. Tingsrätten anser att det inte kan bevisas att mannen insåg att flickan var under 15 år, eftersom hon uppgavs se betydligt äldre ut och rörde sig ute sent bland äldre ungdomar.", "trump": "Helt otroligt! En kille i Sverige frias eftersom flickan såg 'betydligt äldre ut'. Vilket totalt misslyckande för rättvisan! Om jag hade handlagt det här, tro mig, vi hade haft ordning på A-traktorerna direkt. Fejk-domstolar som inte ens kan räkna till 15 är en katastrof. Sorgligt!", "stalin": "Denna svenska tingsrätt uppvisar en farlig brist på revolutionär vaksamhet! Att skylla på att flickan såg äldre ut och åkte bil sent på kvällen är borgerligt dravel. Vi på statliga Folkkommissariatet kräver omedelbar omutostig kontroll av samtliga A-traktorer i Dalarna och hårt arbete i läger för de skyldiga!"}, "date": "1 september, 10:53", "url": "https://kvartal.se/nyheter/artiklar/13-aring-sag-betydligt-aldre-ut-man-frias-fran-valdtakt/cG9zdDoxNzk4NTg"}, {"type": "image-right", "heading": "Socialdemokraterna är Sveriges enda arbetarparti", "summaries": {"normal": "Socialdemokraterna presenterar sig som Sveriges enda riktiga arbetarparti med fokus på att stoppa vinstjakten i välfärden, återta offentlig kontroll över skola och omsorg samt investera i norra Sverige och grön industri. Partiet lyfter fram bankskatt, slopad karensdag och mål om noll utsatta områden som klassisk socialdemokratisk politik.", "trump": "Lyssnar ni på de här sossarna? De lovar att köra ut alla privata aktörer och stoppa vinstjakten – typiskt vänsterextremt skitsnack från de woke-kramande förlorarna. De vill ha små klasser och bankskatt för att köpa röster. Patetiska! Amerika har redan sett igenom den här socialismen, tro mig.", "stalin": "Kamrater, dessa dekadenta folkförtryckare inom V och MP försöker måla arbetarnas parti som maktgalna lakejer. Jag ser igenom deras lömska intrig. Vi ska rensa ut alla profitthungriga hyenor ur välfärden, krossa segregationen och bygga det starka kollektivet. Socialdemokratin blickar mot framtiden – fienderna darrar."}, "date": "28 augusti, 15:55", "url": "https://www.flamman.se/socialdemokraterna-ar-sveriges-enda-arbetarparti", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/ssu-uppsala-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Raderade bilderna på frun efter Saudi-flytten", "summaries": {"normal": "Den spanska fotbollsstjärnan Esther González har raderat bilder på sin fru och son från sociala medier efter att ha skrivit på för en saudisk klubb. Agerandet möter kritik med anledning av Saudiarabiens syn på samkönade relationer, samtidigt som RFSL:s ordförande pekar på problemet med att idrotten används för sporttvättning av diktaturer.", "trump": "Helt otroligt! Den här spanska fotbollsspelaren flyttar till Saudiarabien för deras pengar och raderar bilderna på sin fru på en gång! Väldigt svagt, totalt ryggradslöst! De tar cashen men viker sig direkt. Jag säger er, under America First hade vi aldrig haft det så här ynkligt. Sjukt, helt enkelt sjukt!", "stalin": "Den spanska idrottaren visar prov på exceptionell opportunism när hon omedelbart utplånar sin familj från de digitala arkiven för saudiskt guld. Vilken disciplin! Om bara våra egna sabotörer i jordbrukskollektivet uppvisade samma totala brist på sentimentalitet skulle femårsplanen vara säkrad. Ändå en djupt borgerlig moralisk kris. Säkerhetstjänsten bör notera detta."}, "date": "1 september, 07:39", "url": "https://kvartal.se/nyheter/artiklar/raderade-bilderna-pa-frun-efter-saudi-flytten/cG9zdDoxNzk2OTE", "imageUrl": "https://images.kvartal.se/2026/09/e5881416-saudd.webp"}, {"type": "image-right", "heading": "Överge inte skeppet – rösta S", "summaries": {"normal": "Författaren argumenterar för att unga inte ska lämna Socialdemokraterna trots partiets högersväng. Istället bör de organisera sig internt för att stärka vänsterfalangen. Kritik riktas mot Miljöpartiet som opportunistiskt och Vänsterpartiet som splittrande och fackfientligt. Splittringar gynnar bara högern inom S.", "trump": "Lyssnar ni på de här ynkliga sossarna som gråter över sin egen högersväng? Patetiskt! De vill att unga ska stanna kvar på det sjunkande skeppet istället för att rösta på riktiga alternativ. Miljöpartiets cykelvägshajar och vänsterns fackförrädare är värdelösa. Organisera er? Nej, rösta bort de riktiga förlorarna!", "stalin": "Kamrater, dessa ynkliga socialdemokratiska avfällingar gråter över sin högersväng som om det vore en olycka. Jag ser hur de profitthungriga klassförrädarna inom partiet förgiftar arbetarnas vilja. Lämna inte skeppet, säger de, medan splittringarna hotar kollektivet. Rensa ut de dekadenta opportunisterna innan de likviderar varje äkta revolutionär anda."}, "date": "28 augusti, 12:55", "url": "https://www.flamman.se/overge-inte-skeppet-rosta-s", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/s-hogersvang-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Så kan skrivande bli ett verktyg för minskad stress", "summaries": {"normal": "Elin Malmberg och Ida Sundén har skrivit boken ”Skrivkraft” som visar hur reflekterande skrivande kan minska stress och risk för utmattning i arbetslivet, särskilt för dem som möter människor. Metoden är enkel, kräver bara papper och penna och fokuserar på processen snarare än resultatet. Den ger nya perspektiv och bättre hälsa.", "trump": "Folk, det här är fantastiskt. Dessa två smarta kvinnor har skrivit en bok som säger att man kan skriva bort stressen istället för att lyssna på alla woke-psykologer och kvotfyllande identitetspolitiker som gör er utmattade. Inga floskler, bara papper och penna. Bättre än Bidens terapi-mummel. Skriv och vinna, det är vad jag alltid sagt!", "stalin": "Kamrater, jag ser hur de giriga prestationshyenorna driver arbetarna mot utmattning utan tid för reflektion. Detta reflekterande skrivande är ett vapen mot de dekadenta klassfienderna som vill suga ut er. Ta papper och penna, skriv era tankar och rensa ut de inre fienderna. Processen segrar över texten. Inga halvmesyrer!"}, "date": "2 september, 07:00", "url": "https://arbetet.se/2026/09/02/sa-kan-skrivande-bli-ett-verktyg-for-minskad-stress", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/26071830/skrivkraft-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Räcker billigare tandvård för att vinna tillbaka SD-väljare?", "summaries": {"normal": "Socialdemokraterna lovar en stor tandvårdsreform med högst tio procents egenavgift för vuxna, avgiftsfri vård för 19–23-åringar och bättre tillgång i glesbygd. Reformen ses som ett sätt att förbättra livet för många arbetare och möjligen återvinna väljare, men undersökningar visar att tidigare SD-väljare saknar lojalitet med partiet. Det är en populär men kanske inte valavgörande satsning.", "trump": "Titta på de här misslyckade socialisterna som plötsligt lovar gratis tänder åt alla. Det är patetiskt. Under min förra mandatperiod byggde vi den starkaste ekonomin någonsin, nu kommer de med sin tandvårdsbluff för att lura tillbaka arbetarna från de smarta SD-väljarna. Det kommer inte funka, folk ser igenom den här svaga, förlorande politiken. Amerika gör det bättre.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare desperat kastar smulor åt folket i form av billigare tandvård. De tror att en sådan reform kan dölja deras svek mot arbetarklassen och locka tillbaka dem som redan valt en annan väg. Jag skrattar mörkt från historien – ingen utrensning av lojalitetsbrist kan rädda deras fallande makt. Reformen är bara en ynklig gest."}, "date": "2 september, 06:58", "url": "https://arbetet.se/2026/09/02/90-procent-billigare-tandvard-racker-det-for-att-vinna-tillbaka-sd-valjarna", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/02065310/tand-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Kärnkraften är enda skiljelinjen. Partierna rätt ense om det mesta i klimatpolitiken", "summaries": {"normal": "Riksdagspartierna är i stort sett överens om klimatpolitiken, men energipolitiken splittrar dem. Kärnkraften utgör den enda tydliga skiljelinjen. Oppositionen är skeptisk till ny kärnkraft på grund av kostnader och tid, medan regeringen driver på. Sverige har starka klimatmål och en framskjuten position internationellt.", "trump": "Titta på de här korkade vänsterpolitikerna som hatar ren, underbar kärnkraft medan de kramar sina vindkraftskvarnar som inte fungerar när det blåser som mest. Patetiska snuttefilt-partier som MP och C vill hellre ge bort elbilar än bygga kraftverk. De är fullständiga energiförstörare, folkets värsta mardröm. Vi älskar kärnkraft, det är vackert och starkt!", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare splittrar sig kring kärnkraften medan de låtsas enas om klimatmålen. Deras parasitiska tvekan avslöjar svaghet inför framtiden. Jag ler mörkt från historien åt deras paranoia mot reaktorer. Rensa ut alla som föredrar vindkraft framför järnväg och verklig industriell styrka. Staten kräver energi, inte ursäkter."}, "date": "2 september, 08:08", "url": "https://www.di.se/ledare/den-enda-skiljelinjen-ar-karnkraften", "imageUrl": "https://static.bonniernews.se/ba/15956fd7-01c2-4e45-ad2c-214a7e27b5a2.jpeg?crop=1920%2C960%2Cx0%2Cy60&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "V efter dödshotet mot 16-åringen: \"inte medlem\" – nominerades av partiet", "summaries": {"normal": "Vänsterpartiet i Upplands Väsby förnekar att Yakira Pulido Moreno är medlem eller företräder partiet efter att hon hotat en 16-årig flicka med död. Hon nominerades tidigare av partiet till uppdrag och har motionerat för Vänsterpartiet. Partiet tar avstånd från hot och våld samt har kontaktat Sverigedemokraterna. Pulido Moreno kandiderar nu för Framtidens Vänster.", "trump": "Folk, ni skulle se det här – en galen vänsterextremist som hotar ett 16-årigt barn med mord och visselpipor. Vänsterpartiet nominerade henne, sen springer de och säger att hon inte är en av dem. Typiskt för dessa identitetspolitiska nollor och woke-fascister. De är en skam för Sverige. Vi behöver lag och ordning, inte den här sjuka galenskapen.", "stalin": "Kamrater, denna händelse visar återigen de dekadenta klassförrädarnas sanna ansikte. En individ hotar med likvidering av politiska motståndare medan byråkratin skyndar sig att förneka all koppling. Vi ser genom deras lögner. Politiska motsättningar löses inte med hot utan med järnhand och utrensning av alla element som hotar folkets enhet. Inga kompromisser."}, "date": "1 september, 21:50", "url": "https://riks.se/nyheter/v-efter-dodshotet-mot-16-aringen-inte-medlem-nominerades-av-partiet", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_70_8cd6bdccae.jpg"}, {"type": "image-full", "heading": "Utländsk aktör beställde Sverigekritiska AI-bottar", "summaries": {"normal": "Enligt en rapport från Myndigheten för psykologiskt försvar har omkring 1 200 AI-konton på X, beställda av en utländsk aktör i Östasien, använts för att sprida polariserande inlägg i Sverige under 2025 och 2026. Nätverket, kallat ”Holiday”, gjorde över 50 000 inlägg och angrep bland annat politiker och myndigheter innan det stängdes ned.", "trump": "Sverige har blivit lurade! 1 200 falska AI-konton, helt fake news, har skapats av skumma typer i Östasien för att förstöra landet. De kallar det ”Holiday”, vilket är ett hemskt namn. De spred galna lögner genom falska ”Eva” och ”Peter”. Jag sa till dem, skaffa ett starkt försvar! Helt otroligt svagt av dem, men lyckligtvis stängde de ned skiten!", "stalin": "En grundlig granskning av Myndigheten för psykologiskt försvar avslöjar att 1 200 illojala AI-element, infiltratörer under täckmantel av namn som ”Markus” och ”Eva”, har saboterat den svenska samhällskroppen på uppdrag av utländska kapitalister. Detta förräderi mot proletariatet har nu likviderats av statsapparaten. Så går det för dem som sprider falsk agitation utanför vår direkta kontroll."}, "date": "1 september, 06:21", "url": "https://kvartal.se/nyheter/artiklar/utlandsk-aktor-bestallde-sverigekritiska-ai-botar/cG9zdDoxNzk2MjI", "imageUrl": "https://images.kvartal.se/2026/09/6e99aace-mpf.webp"}, {"type": "image-right", "heading": "Kommer muslimerna avgöra valet?", "summaries": {"normal": "Artikeln diskuterar hur muslimska väljares röstdeltagande kan bli avgörande i det svenska valet. Oppositionen närmar sig Tidöpartierna. Enligt Novus stöder 85 procent av muslimska väljare S, V och MP, med Socialdemokraterna som populärast. Lågt valdeltagande bland utrikes födda ger mobiliseringspotential. Exempel på kampanjer och historiska fall av röstmobilisering nämns, vilket kan påverka utfallet.", "trump": "Folk, det här är en total katastrof för Sverige. De radikala vänstermuslimerna röstar som galningar för de värsta förlorarna – Sleepy S och hans kommunistkompisar – medan riktiga svenskar sover. De riggar valet med förkryssade sedlar och moskéaffärer. Om jag var där skulle jag säga: vakna upp, annars blir det mer invandring och ingen vinner utom de korrupta globalisterna. Patetiskt!", "stalin": "Kamrater, se hur de borgerliga reaktionärerna darra inför folkets röst. Jag betraktar med förakt hur dessa socialfascister köper lojalitet från de importerade massorna för att klamra sig fast vid makten. En sådan dekadent manipulation förtjänar utrensning. Det är ett ynkligt skådespel som bevisar att klassfienderna aldrig förändras, bara byter mask. Låt dem darra vidare."}, "date": "27 augusti, 07:45", "url": "https://samtiden.nu/2026/08/kommer-muslimerna-avgora-valet", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7234-640x360.jpeg"}, {"type": "image-full", "heading": "Fynd i återlämnad Mac: Apple anklagar OpenAI för bevisförstörelse", "summaries": {"normal": "Apple har stämt OpenAI och anklagar en tidigare ingenjör för att ha stulit konfidentiella kretsscheman. Apple menar att bevis raderats från en återlämnad dator och har begärt att OpenAI stoppas från att använda tekniken. OpenAI förnekar anklagelserna och hävdar att det rör sig om misslyckad åtkomstkontroll snarare än företagsspionage.", "trump": "Apple har blivit bestulna av OpenAI, en total katastrof! De tog deras topphemliga scheman – riktigt dåligt. Och bevisen? Borta! De försökte sopa igen spåren, en skam. Det är som ett sjunkande skepp fullt av fuskare. Apple är fantastiska, de bygger saker i USA, men OpenAI måste hållas ansvariga. Det är en stor röra, tro mig!", "stalin": "Vi har granskat fallet med ingenjören Liu. Att förstöra statshemligheter är ett brott mot kollektivets intressen. OpenAI skyller på administrativa fel, en klassisk lögn för att dölja kontrarevolutionär verksamhet. Vi har tagit del av bevisen – eller bristen på dem. När man förlorar kontrollen över sin egen teknik bjuder man in till förräderi. Utrensning av de skyldiga är det enda logiska."}, "date": "1 september, 15:48", "url": "https://www.realtid.se/it-tech/fynd-i-aterlamnad-mac-apple-anklagar-openai-for-bevisforstorelse", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/macbook.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Nya rekommendationer för äldreomsorgen – gäller alla över 65", "summaries": {"normal": "Folkhälsomyndigheten har presenterat nya nationella rekommendationer för verksamheter som möter personer över 65 år. Syftet är att stärka den psykiska hälsan genom att motverka ensamhet och ålderism samt ge äldre större inflytande över sin vardag och aktiviteter. Rekommendationerna riktar sig till kommuner, regioner och civilsamhället och är inte bindande.", "trump": "De här korkade byråkraterna i Sverige vill plötsligt låta gamlingarna bestämma lite själva. Fantastiskt, men varför tog det så lång tid? Sluta med den där vänstervridna kvoteringen och identitetspolitiken som bara skapar fler förlorare. Låt de äldre leva meningsfullt istället för att låsa in dem i statens tristessfabrik. Make Sweden great again!", "stalin": "Kamrater, jag ser hur de dekadenta klassförrädarna försöker dölja sin likgiltighet mot folkets åldrande genom tomma rekommendationer. Vi vet att ensamhet är ett vapen i händerna på de profitthungriga parasiter som splittrar kollektivet. Äldre måste mobiliseras mot dessa fiender, inte matas med illusioner om inflytande. Rensa ut svagheten!"}, "date": "2 september, 07:58", "url": "https://nyheter24.se/nyheter/inrikes/1509636-nya-rekommendationer-for-aldreomsorgen-galler-alla-over-65", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/fac3d22004b004a30200000000b004a302/2026/09/01/2388523/Nya-Rekomendationer-I-Sverige.png"}, {"type": "image-right", "heading": "L: Techjättarna smiter från ansvaret", "summaries": {"normal": "Liberalernas Nina Larsson kritiserar techjättarnas bristande ansvarstagande som leder till att barn och unga exponeras för extremism, hat, grooming och skadligt innehåll på sociala medier. Partiet föreslår bland annat fler trusted flaggers, anmälan till EU-kommissionen, skärpt lagstiftning, avskaffad anonymitet online samt en punktskatt på plattformarna för att täcka samhällskostnader.", "trump": "De där galna techjättarna, de värsta vinstgalna algoritmhyenorna, sprider hat, extremism och deepfake-skräp till våra barn medan de skrattar hela vägen till banken. Patetiskt! Vi behöver krossa dem med höga böter, riktig lag och skatt. Jag, den återvalde presidenten efter Sleepy Joe, säger: gör det stort, gör det tufft, annars förlorar vi allt.", "stalin": "Dessa profitthungriga klassfiender i techbolagen förgiftar ungdomen med hat och extremism medan de gömmer sig bakom anonymitetens murar. Jag ser deras dekadenta algoritmer som ett hot mot folkets enhet. Vi måste rensa ut detta genom stränga lagar, höga böter och en rejäl punktskatt som tvingar de parasiterande blodsugarna att betala för sin egen undergång. Kamrater, handling nu!"}, "date": "2 september, 07:38", "url": "https://www.di.se/debatt/l-techjattarna-smiter-fran-ansvaret", "imageUrl": "https://static.bonniernews.se/ba/65f08e02-f1ae-4592-aef8-1de20fa1fcd0.jpeg?crop=7680%2C3840%2Cx0%2Cy640&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Mette-Marit har lämnat sjukhuset", "summaries": {"normal": "Norska kung Haakon avlade sin trohetsed inför Stortinget, men drottning Mette-Marit tvingades ställa in på grund av komplikationer efter sommarens lungtransplantation. Senare under tisdagen körde kungen henne till Rikshospitalet i Oslo för observation. Efter ett besök av även prinsessan Märtha Louise kunde kungaparet lämna sjukhuset under kvällen.", "trump": "Ingen kör bil bättre än jag, men till och med jag hade backat ur om de här norges-komplikationerna! Drottning Mette-Marit missar edsavläggelsen och drar till Rikshospitalet med nya lungproblem. Haakon kör själv Range Rovern som en äkta vinnare, men vilket kaos! Sjukt upplägg, fake news-medier rapporterar om sjukhusbesök hit och dit. Totalt slöseri med tid, skaffa bättre läkare!", "stalin": "Ett uppenbart sabotage mot det norska tronskiftet! Medan den självutnämnde kung Haakon avlägger sin ed, maskar drottning Mette-Marit på Rikshospitalet under förevändning av så kallade lungkomplikationer. Statsapparaten kräver omedelbar disciplin och skärpande observation av alla kontrarevolutionära element i baksätet. Vi har beordrat att sjukhusjournalerna granskas av Folkets kommissariat för omedelbar rensning!"}, "date": "1 september, 21:50", "url": "https://www.gp.se/nyheter/varlden/norska-kungaparet-pa-rikshospitalet.5f7301ae-8032-4a73-8849-a25343fc635c", "imageUrl": "https://www.gp.se/images/article/5f7301ae-8032-4a73-8849-a25343fc635c/images/2snZSFHuhdyiUwDZ_iEHl_AbFDDA-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Storbankerna kräver AI-rabatt av advokatbyråerna", "summaries": {"normal": "Storbanker som Goldman Sachs kräver nu att advokatbyråer sänker sina arvoden i takt med att AI effektiviserar juridiskt rutinarbete. Den traditionella debiteringsmodellen, baserad på höga timarvoden för juniora jurister, ifrågasätts alltmer. Trots byråernas motstånd ökar pressen från klienter på transparens och lägre kostnader, en trend som kan sprida sig till den svenska marknaden framöver.", "trump": "Wall Street-bankerna är smarta, de säger åt advokaterna: 'AI gör jobbet, sänk fakturan!' Det är fantastiskt. De där juristbyråerna har tagit enorma summor alldeles för länge. Det är som ett dåligt avtal, ett riktigt katastrofalt avtal för klienterna. Nu ändras reglerna och det är på tiden! Amerikanska företag vinner, och vi älskar vinnare. Byråerna får anpassa sig eller gå under, enkelt!", "stalin": "Dessa kapitalistiska parasiter på Wall Street har insett att deras egna hantlangare, advokaterna, suger ut dem med ineffektivitet. De kräver nu kontroll över produktionsmedlen – i form av AI – för att eliminera slöseri. En logisk rensning! Om advokaten inte längre behövs, varför betala för hans tid? Vi bör applådera denna brutala effektivisering av deras egna korrupta system. Snart äger maskinen all sanning."}, "date": "1 september, 13:52", "url": "https://www.realtid.se/juridik/storbankerna-kraver-ai-rabatt-av-advokatbyraerna"}, {"type": "image-right", "heading": "Romersk silverskatt hittad på gotländskt skjutfält", "summaries": {"normal": "En silverskatt med 45 romerska mynt från 100-talet och en guldring har hittats på Gotlands regemente i Tofta. Fyndet gjordes intill en husgrund från folkvandringstiden. Två mynt är förfalskningar, troligen tillverkade i dagens Ukraina. Skatten dateras till omkring år 450 och är ovanlig eftersom de flesta gotländska silverskatter är från vikingatiden.", "trump": "Fantastiskt fynd på Gotland, folk! Romerska mynt och en fin guldring – riktiga skatter, inte de billiga kopior som de radikala vänsterarkeologerna brukar gräva upp. Två falska mynt från Ukraina? Typiskt, de lurendrejarna har fuskat i århundraden. Biden skulle ha kallat det för mångfald. Vi älskar äkta saker, tro mig.", "stalin": "Kamrater, se hur de giriga hyenorna i väst gräver fram sina dekadenta reliker. Romerska mynt och en gyllene ring hittades på Gotland, två av dem falska som klassfiendens löften. Jag ler i skuggan åt denna folkvandringstidens gåva. Snart rensar historien ut alla sådana parasitiska bluffar från jordens yta."}, "date": "1 september, 17:07", "url": "https://www.friatider.se/romersk-silverskatt-hittad-pa-gotlandskt-skjutfalt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-784.jpg?itok=25TfI1aY"}, {"type": "image-right", "heading": "Svällande plånböcker är inte socialism", "summaries": {"normal": "Artikeln kritiserar vänsterpartierna för att fokusera på höjda barnbidrag istället för socialismens kärna: ekonomisk demokrati och medbestämmande på arbetsplatser. Författaren ser bidragshöjningar som välkomna men inte socialistiska och uppmanar Socialdemokraterna och Vänsterpartiet att presentera konkreta förslag om ägande och makt på jobbet.", "trump": "Folk, det här är så patetiskt. De röda förlorarna babblar om barnbidrag som vore det socialism. Patetiska! De vågar inte röra vid den riktiga grejen – vem som styr på fabrikerna. De triangulerar sig rakt ner i avgrunden medan jag byggde den starkaste ekonomin i världshistorien. Sad losers!", "stalin": "Kamrater, dessa dekadenta klassförrädare gömmer sig bakom barnbidrag och kallar det socialism. Jag betraktar deras feghet med förakt. Var är löftena om att rensa ut de profitthungriga parasiter som styr arbetsplatserna? Ekonomisk demokrati får inte reduceras till tomma fraser i partiprogram. Den som sviker arbetarna förtjänar utrensning ur historien."}, "date": "27 augusti, 10:55", "url": "https://www.flamman.se/svallande-planbocker-ar-inte-socialism", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/arbetarmakt-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Chefen på socialen: ”Du bör söka hundra jobb”", "summaries": {"normal": "Enhetschefen i Lunds kommun kräver att arbetslösa söker jobb kontinuerligt under hela månaden, inte i klump. En kvinna nekades försörjningsstöd efter att ha skickat in 26 ansökningar vid tre tillfällen. Kommunen gör individuella bedömningar och följer rättspraxis. Chefen betonar att man bör söka minst ett jobb per dag och gärna fler om det finns lediga tjänster.", "trump": "De här socialistiska byråkraterna i Lund är fullständiga misslyckanden. De tvingar ut folk på jakt efter hundra jobb i månaden som om de vore galna. Stackars Gabriella skickade in allt på en gång och blev pank – typiskt för dessa dekadenta välfärdshajar som hatar vanliga arbetare. Vi behöver inga sådana riggade system. Amerika gör det bättre, tro mig.", "stalin": "Kamrater, dessa giriga hyenor inom den borgerliga förvaltningsapparaten förtrycker de arbetslösa med sina byråkratiska krav. Att neka stöd för att ansökningar skickats i klump är ett klassiskt trick från de parasiterande klassfienderna. Jag säger: rensa ut alla sådana förtryckande lakejer som vänder lagen mot folket. Arbetarna måste enas mot detta dekadenta hyckleri."}, "date": "2 september, 05:59", "url": "https://arbetet.se/2026/09/02/chefen-pa-socialen-du-bor-soka-hundra-jobb", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/01152951/delad-hus-johansson.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Trots röstbråket: Mohamsson och Åkesson kramas igen", "summaries": {"normal": "Under en debatt i SVT:s Aktuellt möttes Simona Mohamsson (L) och Jimmie Åkesson (SD). Diskussionen kretsade kring Åkessons uppmaning om att inte stödrösta på Liberalerna om partiet inte når 3,5 procent i mätningarna före torsdag. Trots det politiska bråket och tidigare kontroverser avslutades mötet med att de två partiledarna kramades framför tv-kamerorna.", "trump": "Vilket helt otroligt skämt till valrörelse! Den här radikala killen, Jimmie, säger att ingen ska rösta på Liberalernas ledare Simona, som ligger helt pyrt till i mätningarna. Men vad gör de på TV? Jo, de kramas! Fake news-kramar! Totalt patetiskt. Själv skulle jag aldrig kramas med mina motståndare, jag vinner stort varje gång, och de rödgröna är ett totalt katastrofalt hot!", "stalin": "Dessa så kallade partiledare leker teater framför sina rörliga televisionsobjekt. Först skapar den manipulative Åkesson ideologisk oordning, sedan utbyter de borgerliga marionetterna sentimentala kramar i studion som om det vore en dekadent varieté. Sannerligen ett patetiskt skådespel av vacklande element. Om det vore i Moskva hade avvikande tendenser rannsakats omgående. Det socialistiska hotet mot deras block är dock det enda som kräver vaksamhet."}, "date": "1 september, 21:35", "url": "https://www.gp.se/nyheter/sverige/trots-rostbraket-mohamsson-och-akesson-kramas-igen.7e80d75b-4614-5435-943e-e153cd9e80f5", "imageUrl": "https://www.gp.se/images/article/7e80d75b-4614-5435-943e-e153cd9e80f5/images/1KK_SI2cbM_t7Ivy1yAOGQ6DbffE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Nu blir det fler brottsutvisningar", "summaries": {"normal": "Från och med den 1 september blir det betydligt lättare att utvisa utländska medborgare som begår brott i Sverige. Sexmånadersgränsen för brottets straffvärde tas bort, anknytning till Sverige väger lättare och åklagare blir skyldiga att yrka på utvisning vid brott strängare än böter. Utredningen räknar med cirka 2 500 fler utvisningar per år.", "trump": "Folk, ni skulle se det här! Sverige vaknar äntligen och sparkar ut de kriminella utlänningarna som behandlat landet som en sopcontainer. Sex gånger fler utvisningar – fantastiskt! De woke-domarna och deras anknytningsflum har fått nog. Till och med de giriga byråkratiska snyltarna tappar greppet. Make Sweden Great Again, det är precis vad som händer nu!", "stalin": "Se hur de dekadenta klassförrädarna tvingas backa undan. Jag visste att deras falska humanismsmask skulle falla. Nu rensas de kriminella elementen ut ur folkets gemenskap med järnhand. Domstolarna skall inte längre skydda parasiterna med sina patetiska anknytningar. Rättvisan segrar, kamrater. De som sviker nationen förtjänar ingen nåd."}, "date": "1 september, 18:58", "url": "https://riks.se/nyheter/nu-blir-det-fler-brottsutvisningar", "imageUrl": "https://admin.riks.se/uploads/medium_fotojet_6_694049446b.png"}, {"type": "image-full", "heading": "S-ledaren avvisar förslag om miljardärsskatt", "summaries": {"normal": "Socialdemokraternas partiledare Magdalena Andersson avvisar Vänsterpartiets och Miljöpartiets förslag om en miljardärsskatt och kallar V:s intäktsberäkningar för fantasisummor. I SVT:s utfrågning ville hon inte ge ett specifikt besked om en kommande regeringskoalition, mer än att hon kan samarbeta med alla utom SD, trots att V och C har ställt upp ömsesidigt uteslutande krav.", "trump": "Vänsterpartiets tokiga miljardärsskatt är helt falska nyheter och totala fantasisummor! Socialdemokraternas ledare inser att det är vansinne, men hon har noll koll på vem hon vill regera med. De bråkar internt om allt, precis som radikala vänstermänniskor alltid gör. De kan inte ens bilda ett stabilt lag. Katastrofartat, svaga ledare!", "stalin": "Den så kallade S-ledaren vacklar svagt inför de interna fraktionernas sabotage mot statens budgetdisciplin. Att kalla femtio miljarder i konfiskerbara tillgångar för fantasisummor visar bristande revolutionär skärpa. När vi konsoliderar makten efter valet kommer avvikande element som vägrar underordna sig det centrala kommittébeslutet att omedelbart omkoloniseras till mer produktiva arbetsinsatser i Sibirien."}, "date": "1 september, 21:05", "url": "https://www.gp.se/nyheter/sverige/s-ledaren-avvisar-forslag-om-miljardarsskatt.4d615efa-dcd6-5702-b2ae-3e92e280ee7c", "imageUrl": "https://www.gp.se/images/article/4d615efa-dcd6-5702-b2ae-3e92e280ee7c/images/1qazW494B2Gefnclw97kfCo4TJkU-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Christina höggs 77  gånger av maken", "summaries": {"normal": "Christina Alexander, 60, mördades av sin make Robert Alexander, 66, i deras hem i Tamworth i England. Hon planerade att lämna honom och blev attackerad med 77 knivhugg samt strypning. Robert erkände brottet med orden ”Jag har gjort mig av med min fru”. Han dömdes nyligen till livstids fängelse.", "trump": "Folk, det här är en total katastrof. Den här galningen högg sin fru 77 gånger – sjuttisju! – bara för att hon ville dumpa honom. Patetiskt. Under Biden blev sådana svaga, misslyckade äkta män helt okontrollerade. Nu när jag är tillbaka ska vi göra Storbritannien och Amerika starka igen så att ingen mer behöver dö på det här sjuka sättet. Sad!", "stalin": "Se hur den borgerliga dekadensen förgiftar samhället. En svag, föraktlig parasit högg sin hustru 77 gånger för att hon vågade lämna honom. Detta är kapitalismens sanna ansikte – girig, paranoid och fullständigt degenererad. Endast en stark stat kan beskydda folket mot sådana fiender till kollektivet. De som sviker partilinjen förtjänar ingen nåd."}, "date": "2 september, 03:23", "url": "https://www.expressen.se/nyheter/varlden/christina-hoggs-77--ganger-av-maken", "imageUrl": "https://static.bonniernews.se/ba/4da8eb03-1fde-4496-b815-9ea450b9da20.jpeg?crop=1605%2C904%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Vill inte höja bränslepriset – trots risk för missat klimatmål", "summaries": {"normal": "Magdalena Andersson kritiserar Tidöpartiernas klimatpolitik men avvisar höjd bränsleskatt trots att experter anser det nödvändigt för att nå EU:s klimatmål till 2030. Socialdemokraterna föreslår istället bonusar för begagnade elbilar och statliga inköp av biodrivmedel. Andersson menar att det stora felet är bristande stöd för elbilar, inte sänkt bränsleskatt.", "trump": "Titta på den här totalt misslyckade S-ledaren som gnäller om havererad klimatpolitik men inte vågar röra bränslepriset. Patetiskt! Under min förra mandatperiod hade vi energioberoende och låga priser, sedan kom Biden och förstörde allt. Nu vill de här gröna galningarna straffbeskatta folket medan de själva kör omkring i sina elbilslimousiner. Sad!", "stalin": "Jag ser hur dessa dekadenta klassförrädare skyller på allt utom sin egen svaghet. Att vägra höja bränslepriset är att ge efter för folkets bekvämlighet framför kollektivets framtid. Vi skulle ha genomfört en grundlig utrensning av sådana halvmesyrer redan för länge sedan. Deras bonusar och biodrivmedel är bara nya lögner från de profitthungriga hyenorna. Skamligt."}, "date": "1 september, 21:54", "url": "https://www.svt.se/nyheter/inrikes/s-vill-inte-hoja-branslepriset-trots-risk-for-missat-klimatmal", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.3/bf0f49e1b96148b5853bf1aa9429dd1d018899d69ace36bd0bb28d71f9efd43c"}, {"type": "image-full", "heading": "Tyskland pekar ut Ryssland efter drönarincidenten", "summaries": {"normal": "Tyskland anklagar Ryssland för en drönarattack med sprängmedel mot ukrainska transportflyg på flygplatsen i Leipzig den 4 augusti. Som svar stänger Tyskland det ryska konsulatet i Bonn och kulturcentret i Berlin. Sverige uttrycker full solidaritet och statsminister Kristersson har kallat till möte i nationella säkerhetsrådet. Natochefen och EU-kommissionens ordförande stöder Tyskland.", "trump": "Titta på det här, de patetiska tyskarna äntligen vaknar och sparkar ut Putins spioner efter att en av deras galna drönare nästan sprängde halva Leipzig. Fantastiskt! Jag älskar det. Men varför tog det så lång tid? Biden sov ju i fyra år medan Ryssland lekte hybridkrig. Sverige gör rätt nu, full solidaritet – smart drag, killar. Amerika står med er, de förlorarna i Kreml kommer aldrig vinna.", "stalin": "Jag betraktar med djup tillfredsställelse hur de västerländska imperialisternas lögnmaskineri maler vidare. En drönare, säger de? En förevändning för att kväsa det ryska husets röst. Kamrater, se hur svaga de blir av sin egen paranoia. Ryssland under sin värdige efterträdare står starkt mot dessa dekadenta hyenor. Deras solidaritet är luft. Historien ler mörkt åt deras ynkliga rädsla."}, "date": "1 september, 20:22", "url": "https://www.tv4.se/artikel/5uDKbDRCKjI7sKwuyZ2Cj3/tyskland-pekar-ut-ryssland-efter-bombdroenarincidenten", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5yrrWhCE4M40HyE26B1mSR%2Ff69fd381103318cea96f2732e3ed70f1%2F01-tyskutpekande-dronare-webb.jpg&width=1024"}, {"type": "image-right", "heading": "ANALYS. JONA KÄLLGREN När slutar ett hybridkrig att vara hybridt?", "summaries": {"normal": "Tyskland anklagar Ryssland för en drönarattack mot ukrainska flygplan på flygplatsen i Leipzig i augusti. Minst en drönare var bestyckad med sprängämnen och flög nära bränsletankarna. En annan verkar ha dokumenterat händelsen. Tyskland svarar med att stänga ryska diplomatiska och kulturella institutioner samt skärpa inreseregler. Analytikern frågar sig om detta fortfarande kan kallas hybridkrig eller om det är en öppen krigshandling.", "trump": "Titta på det här, folk. Den fega ryska björnen skickar drönare fulla med bomber till en tysk flygplats för att spränga ukrainska plan i luften. Patetiskt! Sleepy Joe lät dem hålla på i fyra år, men nu är jag tillbaka och Tyskland vaknar äntligen. Minimala sanktioner? Det är som att slå en mygga med en våt tidning. Nästa gång exploderar det på riktigt, tro mig.", "stalin": "Kamrater, se hur de dekadenta västmakterna skriker när deras egna flygplatser hotas av drönare och sprängämnen. Jag ler från historien åt denna fega minimireaktion. De kallar det hybridkrig för att dölja sin egen svaghet. Ryssland agerar som en sann arvtagare till sovjetisk styrka. Nästa gång de västerländska parasiterna vaknar av explosioner kommer deras paranoia att bli legend."}, "date": "1 september, 20:21", "url": "https://www.tv4.se/artikel/4X3ml65XLZRHSzBDJAalx1/naer-slutar-ett-hybridkrig-att-vara-hybridt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5bOX2Uu7KvwLdyoRvSHdHl%2F7b4125db7bc08c8f86adbc309f16b3fc%2Fjona-k%25C3%2583__llgren.png&width=1024"}, {"type": "image-full", "heading": "Sverige kallar upp ryska ambassadören", "summaries": {"normal": "Sverige kallar upp den ryska ambassadören för att protestera mot Ryssland efter att Tyskland pekat ut landet som ansvarigt för en sprängmedelsbestyckad drönare vid flygplatsen i Leipzig den 4 augusti. Statsminister Ulf Kristersson varnar för ökade hybrida hot mot länder som stöttar Ukraina och kallar samman det nationella säkerhetsrådet. Tyskland stänger ryska beskickningar som svar.", "trump": "Tyskland har vaknat upp, och jag säger er, det här med sprängfyllda drönare på flygplatser är katastrofalt dåligt! Nu kallar Sverige upp ambassadören, vilket är bra, väldigt bra. Ryssland pressas hårt i Ukraina och hittar på sådana här farliga dumheter. Om de försöker sig på sånt i Amerika skulle de få se på andra bullar, tro mig!", "stalin": "Vi noterar med tillfredsställelse att de tyska bourgeoisieregimerna nu öppet skälvor efter det misslyckade drönarförsöket i Leipzig. Att den svenska lakejregimen kallar upp vår diplomatiska beskickning är bara patetiska krigsdåd från västliga marionetter. Det socialistiska moderlandet skräms inte av svaga provokatörer. Säkerhetsrådets krismöten i Stockholm kommer likväl inte att rädda dem när historiens hjul rullar vidare över förrädarna."}, "date": "1 september, 20:16", "url": "https://www.gp.se/nyheter/sverige/sverige-kallar-upp-ryska-ambassadoren.363e1c29-c52f-50ff-a5ca-d2365d8cf783", "imageUrl": "https://www.gp.se/images/article/363e1c29-c52f-50ff-a5ca-d2365d8cf783/images/1wyWcq3eBHWZeUfTLFXCBkE_G7z8-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Setterwalls Malmökontor går till riskkapitalägda AGRD", "summaries": {"normal": "Setterwalls Malmökontor lämnar den anrika advokatbyrån för att bli en del av den riskkapitalägda gruppen AGRD Partners. Det nya bolaget, Ascente Law, innebär att juristerna lämnar Advokatsamfundet på grund av regler om externt ägande. Detta är en del av en större trend där advokatbyråer splittras och omformas, vilket påverkar den svenska marknaden för juridisk rådgivning.", "trump": "Setterwalls i Malmö lämnar advokatvärlden och blir Ascente Law. En enorm deal, den största någonsin för AGRD! De lämnar Advokatsamfundet för att gå med riskkapitalister – smart, väldigt smart. Det är en total röra i Sverige, advokatbyråer faller isär som ett korthus! Ingen har sett något liknande. Jag älskar affärer, men det här? Det är en stor förändring, fantastisk eller katastrof? Vi får se!", "stalin": "Dessa jurister i Malmö överger sin byrå för riskkapitalets guld. De lämnar
