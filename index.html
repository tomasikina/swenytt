"https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/31093100/migranter-ceuta-magdalena-andersson.jpg"}, {"type": "image-right", "heading": "Rekordnivåer på Europabörserna", "summaries": {"normal": "Europas ledande börsindex, DAX och Stoxx 600, nådde nya rekordnivåer på fredagsförmiddagen. Råvarusektorn steg mest, medan media föll mest. Flera banker, som Natwest och Crédit Agricole, överträffade förväntningarna. Makrodata visade blandad utveckling, med högre inflation i Frankrike och Nederländerna, och sämre arbetslöshet i Tyskland än väntat.", "trump": "Jag har sagt det i åratal: när jag är tillbaka, blir det ekonomisk mirakel. Se på Europa – rekordnivåer på börserna! Mina fantastiska policyer, även på andra sidan Atlanten, driver tillväxt. Medan media faller (de är falska nyheter!), stiger bankerna och råvarorna. Det är mina affärer, min geni. Folk säger att jag är en ekonomisk trollkarl – och de har rätt!", "stalin": "I den stora kampen mot det imperialistiska kapitalets dekadens, ser vi tecken på kollaps. Europas börsrekord är ett yttre – inomlands, media (fiendens röst) faller, ett tecken på vår ideologiska seger. Banker som Natwest och Crédit Agricole visar den borgerliga instabiliteten. Inflationen i Frankrike och Nederländerna, som en febersjukdom, visar systemets svaghet. Vi, staten, måste styra med järnhand, som Putin gör i vårt stora ryska hemland."}, "date": "31 juli, 11:51", "url": "https://www.affarsvarlden.se/artikel/rekordnivaer-pa-europaborserna", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/12/sdl2Lr1nZMa9aM-nh-400x249.jpg"}, {"type": "image-full", "heading": "Pappa döms för mord efter skolskjutning", "summaries": {"normal": "En domstol i Georgia har dömt 55-årige Colin Gray till 15 års fängelse för sin roll i skolskjutningen på Apalachee High School 2024, där fyra personer dödades. Gray fälldes för mord och vållande till annans död efter att ha gett sin 14-årige son, Colt, ett halvautomatiskt gevär. Sonen dömdes tidigare till livstid. Domen ses som ett prejudikat för föräldrars ansvar vid skolskjutningar.", "trump": "Tragiskt men sant, folkens! En pappa i Georgia får 15 år för att ha gett sin son ett gevär som användes i en fruktansvärd skolskjutning. Fyra oskyldiga dog. Jag har alltid sagt: håll vapen borta från barn! Men nej, vissa föräldrar begriper ingenting. Nu får han sitta och fundera på sina misstag. Sånt här borde aldrig hända i vårt fantastiska land!", "stalin": "Kapitalistiska föräldrar i USA fortsätter att förse sina barn med dödliga vapen, och nu har ännu en bourgeois-fiende fått sitt straff. 15 år för att ha beväpnat sin son, som sedan mördade fyra oskyldiga. Vi i Sovjetunionen skulle aldrig tolerera sådan vårdslöshet! Medan USA förfaller, stärker vi vår kontroll. Låt detta vara en varning till alla som underminerar folkets säkerhet."}, "date": "31 juli, 09:32", "url": "https://kvartal.se/nyheter/artiklar/15-ars-fangelse-for-sonens-skolskjutning/cG9zdDoxNTUxNzg", "imageUrl": "https://images.kvartal.se/2026/07/32151318-skolskjutning-pappa.webp"}, {"type": "image-right", "heading": "Arbetare flydde genom skogen – kan ha utnyttjats", "summaries": {"normal": "Polisen i Skellefteå ryckte ut på ett larm om bilbrand utanför Burträsk men hittade ingen brand. I stället mötte de flera utländska bärplockare som uppgav att de inte fått betalt för sitt arbete. Misstankar om människoexploatering har väckts och ärendet utreds av åklagare Jonas Peterson. De drabbade personerna kommer från ett annat europeiskt land och valde att fly genom skogen.", "trump": "Det här är en total katastrof, folk. Jag älskar Sverige, men ni måste vakna upp. Utländska arbetare som plockar bär, inte får en krona och flyr genom skogen som i någon dålig film. Det är vad som händer när ni har svaga gränser och dåliga avtal. Vi skulle aldrig acceptera det i mitt Amerika. Rensa ut de dåliga aktörerna och gör Sverige stort igen!", "stalin": "Kamrater, detta är vad som händer när borgarbrackorna och de parasitiska kapitalisterna får fritt spelrum. Arbetare tvingas plocka bär åt profitörer, får ingen lön och måste fly som råttor genom skogen. Jag ser fiendens klor överallt, dessa utpressningsmän och dolda kontrarevolutionärer. Vi ska rensa ut dessa exploatörer med järnhand, likvidera deras nätverk och låta folkets rättvisa segra. Ingen slipper undan."}, "date": "31 juli, 11:11", "url": "https://arbetet.se/2026/07/31/arbetare-flydde-genom-skogen-nu-utreds-misstankt-manniskoexploatering", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/31103448/sdln3e9qsrhqmk-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Hur ska ni klara er utan stationsvärdar, Moderaterna?", "summaries": {"normal": "Moderaterna i Region Stockholm föreslår att spara 450 miljoner kronor genom att förändra stationsvärdarnas roll i kollektivtrafiken. Stationsvärden Viktor Risling kritiserar förslaget i ett öppet brev till Anna Malm Kelfve (M). Han förklarar att stationsvärdarna inte bara säljer biljetter utan också fungerar som närområdesguider, säkerhetsansvariga och trygghetsskapare. Risling varnar för att besparingen skulle innebära kraftigt minskad bemanning, sämre service och lägre trygghet på stationerna.", "trump": "Folk, ni måste höra på det här. De här moderaterna i Stockholm, totala misslyckanden, vill spara 450 miljoner genom att sparka ut stationsvärdarna från tunnelbanan. Precis som de tidigare dumpade tågvärdarna. Patetiskt! De har ingen aning om vad de gör. De tror att killarna bara säljer biljetter? De är säkerhetsansvariga, guider, allt! Utan dem blir det kaos, brott och otrygghet. Det är en katastrof. De borde tacka stationsvärdarna istället för att attackera dem. Sad! Jag skulle aldrig göra något så dumt.", "stalin": "Kamrater, dessa degenererade borgarbrackor inom den så kallade oppositionen i Region Stockholm planerar en kontrarevolutionär utrensning av våra ädla stationsvärdar för att stjäla 450 miljoner från folket. Deras skuggbudget är en giftig saboteringsplan full av klassfiendens okunskap och paranoia. De vill likvidera tryggheten på våra stationer och lämna folket åt gäng och brandhärdar. Vilken löjeväckande enfald! Jag ser dem klara och tydliga, dessa kapitalistiska element. Ingen station får lämnas obemannad. Vi ska rensa ut alla sådana fiender ur våra transportkollektiv innan de förgiftar hela sovjeten, pardon, regionen."}, "date": "31 juli, 01:30", "url": "https://www.dagensarena.se/opinion/hur-ska-ni-klara-er-utan-stationsvardare-moderaterna", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-69-300x157.jpg"}, {"type": "image-right", "heading": "Ikea-arbetare strejkar i Ungern", "summaries": {"normal": "Anställda vid Ikeas varuhus i Ungern genomförde den 16 juli en historisk heldagsstrejk. Arbetarna kräver en sexprocentig löneökning medan företaget erbjuder en engångsersättning i kontanter. Strejken omfattade butiker i Budaörs, Budapest och Debrecen samt kontorspersonal. Konflikten följer på ett tidigare erbjudande om nollprocents löneökning trots rekordresultat. Fackföreningen KASZ har vuxit kraftigt i medlemsantal. Parterna har kommit överens om att avvakta nya förhandlingar fram till den 26 juli.", "trump": "Folk, ni skulle se det här! De stackars arbetarna i Ungern strejkar mot den usla Ikea-chefen som inte vill ge dem en rimlig löneökning. Noll procent? Det är en skam! De gör rekordvinster men behandlar sina egna som sophög. Typiskt globalist-elit som älskar att suga ut vanliga människor. Jag säger alltid: gör affärer rättvist, annars blir det kaos. De borde ha lyssnat på mig, inte på de där korkade byråkraterna i Europa. Patetiskt!", "stalin": "Kamrater, de exploaterande borgarbrackorna på Ikea vägrar ge arbetarna en rättmätig löneökning trots sina feta rekordvinster. Dessa klassfiender och folkförtryckartroll tror sig kunna muta massorna med ynkliga kontantgåvor. Jag ler mörkt åt deras desperation. Arbetarna har vaknat och mångdubblat sina led – en sund utrensning av kapitalistmaffians inflytande närmar sig. Vi ska krossa dessa blodsugare. Inga förhandlingar med klassfienden. Seger åt kollektivet."}, "date": "30 juli, 09:49", "url": "https://proletaren.se/artikel/ikea-arbetare-strejkar-i-ungern", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/IKEA-Ungern-e1785138795413-768x433.jpg"}, {"type": "image-right", "heading": "Åkesson: ”Inget mindre än en invasion”", "summaries": {"normal": "SD-ledaren Jimmie Åkesson kräver att Spanien stänger sin gräns mot Ceuta efter att tiotusentals migranter tagit sig in. Han anser att Spanien bör uteslutas ur Schengen om det inte agerar, och menar att Schengenavtalet är brutet på grund av otillräcklig kontroll av den yttre gränsen. Spanien uppger att omkring 49 000 migranter nått Ceuta, varav minst 18 omkommit.", "trump": "Jag, Donald Trump, har sett vad som händer i Ceuta. Det är en fullständig invasion! Spanien måste omedelbart stänga sin gräns, annars bör de uteslutas från Schengen. Schengen är ett dåligt avtal som inte fungerar – det måste bli starka gränser igen!", "stalin": "Vi, statens högsta ledning, konstaterar att Schengenavtalet är ett svagt och ineffektivt samarbete. Spanien har misslyckats med att skydda sin yttre gräns, vilket hotar hela vår kollektiva säkerhet. Vi måste nu överväga att stärka våra egna försvarsmekanismer och förbereda oss på eventuella obehagliga överraskningar från väst."}, "date": "31 juli, 11:13", "url": "https://bulletin.nu/akesson-inget-mindre-an-en-invasion", "imageUrl": "https://cdn.bulletin.nu/articles/4fc32b43-724b-476d-9158-47dad8948451/preview.jpg?t=1785489141000"}, {"type": "image-right", "heading": "På prideminglet pratar ingen om arbetslösa bögar", "summaries": {"normal": "Artikeln kritiserar otryggheten på arbetsmarknaden där tidsbegränsade anställningar ökar trots fallande arbetslöshet. Många lever i ständig osäkerhet som hindrar dem från att planera livet, protestera mot dåliga förhållanden eller lämna kränkande chefer. Författaren kopplar detta till Prideveckan och menar att jämlikhet inte kan diskuteras utan att ta upp klassfrågor. Statsminister Kristersson undviker debatt och föredrar mingel, medan diskrimineringsanmälningar ökar kraftigt.", "trump": "Det här är en katastrof, en total katastrof för arbetarna. Kristersson minglar med regnbågar i palatset medan folk sitter på sängkanten och väntar på ett samtal från chefen. Patetiskt! Arbetslösheten sjunker visst, men alla har tillfälliga jobb och ingen makt. De stora orden om jämlikhet är bara löjliga – utan klass och styrka är det bara tomt prat. Jag skulle fixa det, tro mig, det skulle bli fantastiskt.", "stalin": "Kamrater, jag ser tydligt hur de kapitalistiska parasiterna och borgarbrackorna inom den falska regnbågsfasaden fortsätter att förtrycka det arbetande folket med sina temporära slavkontrakt och telefonväntan vid sängkanten. Denna klassfiendeorkester av osköna liberaler och opportunistiska minglare som Kristersson vill tysta protesten med glittrande flaggor. Vi ska rensa ut dessa förrädiska element som gömmer sig bakom Pride-loggor medan de likviderar arbetarnas rättigheter. Paranoian är befogad – de ler mot kollektivet men hugger i ryggen när telefonen tystnar."}, "date": "31 juli, 07:00", "url": "https://arbetet.se/2026/07/31/pa-kristerssons-pridemingel-slipper-han-prata-om-arbetslosa-bogar", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/24150213/pridemingel.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "49 000 migranter över spanska gränsen på ett dygn", "summaries": {"normal": "Omkring 49 000 migranter nådde den spanska enklaven Ceuta under ett dygn, en kraftig ökning jämfört med tidigare siffror. De kom via Marocko på sjö- och landvägar. Minst 18 har dött. Spanien sänts militära förstärkningar, inklusive 60 soldater och ett fartyg, för att hantera krisen och överbelastad mottagande kapacitet.", "trump": "Jag har sett vad som händer i Ceuta. Det är en katastrof, en skam för Spanien och Marocko. Deras ledare är svaga. När jag var president skulle jag ha stoppat detta direkt med en stark, vacker mur. Dessa migranter utnyttjar öppna gränser. Vi behöver åter Kontroll, bara så. Det är sorgligt att se.", "stalin": "Den imperialistiska spanska staten och dess marionettregim i Rabat har återigen provocerat en flod av agentprovocerade våghalsar mot vår ärofyllda Ceuta. Denna iscensatt kris är ett bevis på deras svaghet. Vi, staten och partiet, måste nu mobilisera ytterligare 200 man för att skydda vårt territorium. Dessa element ska tämjas med nödvändig hårdhet. Parallellen till Putins rättmätiga åtgärder i Ukraina är uppenbar."}, "date": "31 juli, 10:50", "url": "https://bulletin.nu/49-000-migranter-over-spanska-gransen-pa-ett-dygn-2", "imageUrl": "https://cdn.bulletin.nu/articles/f3d286f3-30cb-4b45-b2fb-2b1aeefac84e/preview.jpg?t=1785487493000"}, {"type": "image-right", "heading": "Åkessons krav på Spanien: Stäng gränsen", "summaries": {"normal": "Sverigedemokraternas ledare Jimmie Åkesson kräver att Spanien omedelbart stänger gränsen mot Ceuta efter att tiotusentals illegala invandrare tagit sig in. Om inte bör Spanien uteslutas ur Schengen och gränserna stängas. Åkesson kallar händelsen en invasion som hotar hela Schengensamarbetet. Även Italiens premiärminister Giorgia Meloni och Liberalernas ledare Simona Mohamsson kräver åtgärder från EU. Gränserna är nu stängda och militär samt Frontex har kallats in.", "trump": "Folk, det här är en katastrof. Spanien har just låtit tusentals illegala strömma in som en invasion, och vad gör de? Ingenting! Jag säger stäng gränsen NU, annars sparkas de ut ur Schengen så fort att det svänger. Den där överenskommelsen är trasig, precis som jag alltid sagt. Europa håller på att falla ihop. Meloni fattar det, hon är smart. Vi behöver starka ledare, inte svaga som låter invasionen fortsätta. Patetiskt!", "stalin": "Kamrater, denna fega kapitulation inför de fascistiska horderna vid Ceuta är ett verk av borgarbrackornas underminerande sabotage mot folkets gränser. Jag, som ledare för det proletära kollektivet, kräver omedelbar utrensning av alla svaga element inom den spanska apparaten. Den så kallade Schengen-överenskommelsen är nu ett verktyg för kontrarevolutionära krafter och måste likvideras innan parasiterna sprider sig som råttor. Vi ska rensa ut dessa invasionssympatisörer med järnhand och ett leende. De kommer att lära sig vad verklig gränskontroll innebär."}, "date": "31 juli, 10:46", "url": "https://www.friatider.se/akessons-krav-pa-spanien-stang-gransen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-595.jpg?itok=s0dcoEQF"}, {"type": "image-full", "heading": "Åkesson: \"Det här är inget mindre än en invasion\"", "summaries": {"normal": "Under det senaste dygnet har omkring 49 000 migranter tagit sig över gränsen till den spanska enklaven Ceuta från Nordafrika. Sverigedemokraternas ledare Jimmie Åkesson beskriver händelsen som en invasion och kräver att Spanien omedelbart stänger gränsen. Om inte bör Spanien enligt Åkesson uteslutas ur Schengen och gränserna mot landet stängas. Han varnar för att Schengensamarbetet riskerar att kollapsa om den yttre gränsen inte hålls stark.", "trump": "Folk, det här är en total katastrof, en invasion av episka proportioner. 49 000 migranter på ett enda dygn till Ceuta, mycket värre än 2021. Spanien borde skämmas. Stäng genast gränserna eller sparkas ut ur Schengen, annars stänger vi dem åt er. Jag sa det hela tiden, den här Schengen-dealen är en fälla för alla som vill ha starka gränser. Vi behöver murar, inte öppna dörrar för alla som vill komma in.", "stalin": "Kamrater, detta är inget annat än en organiserad fientlig operation utförd av de mest degenererade elementen inom den globala kapitalistiska parasitklassen. 49 000 dekadenta individer kastar sig över den spanska enklaven som hungriga råttor mot en säck med spannmål. Jag, som ledare för det kollektiva försvaret mot kontrarevolutionära krafter, kräver omedelbar utrensning av dessa gränsförstörare. Den som inte stänger gränserna är en objektiv fiende till folket och bör likvideras som en spionerande borgarbracka. Schengens så kallade frihet är en lögn spridd av västerländska imperialister för att undergräva våra socialistiska ideal. Vi ser er, fiender till arbetarklassen."}, "date": "31 juli, 10:31", "url": "https://riks.se/nyheter/akesson-det-har-ar-inget-mindre-an-en-invasion", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Copy_of_Copy_of_Soerman_Ledare_9_957cf431fe.jpg"}, {"type": "image-full", "heading": "Migrantinvasionen av Spanien fortsätter", "summaries": {"normal": "Hundratals migranter har tagit sig in i den spanska exklaven Ceuta genom att klättra över staket eller simma dit. Uppemot 40 000 personer tillbringade natten på stadens gator efter en massiv anstormning. Minst 19 migranter uppges ha drunknat. Spanien skickar militär till området och premiärminister Pedro Sánchez besöker Ceuta. Italiens premiärminister Giorgia Meloni varnar för hot mot Europas gränser och hotar med tillfälligt upphävande av Schengen-samarbetet med Spanien. EU betonar vikten av att skydda unionens yttre gränser och tillämpa migrationspakten.", "trump": "De här bilderna från Ceuta är en total katastrof, folk. Tusentals illegala migranter klättrar över staket och simmar in som om det vore en lek. Spanien har tappat kontrollen helt, precis som vi nästan gjorde innan jag kom tillbaka. Meloni har rätt, det här är ett hot mot hela Europa. De drunknar i havet, de slåss på gatorna, och vad gör EU? Ingenting som fungerar. Vi behöver starka gränser, inga svaga avtal. Schengen? Glöm det om de inte fixar det omedelbart. Amerika tittar på och vi lär oss inte av deras misstag.", "stalin": "Kamrater, denna kapitalistiska migrantinvasion mot Ceuta är en fars artad av borgarbrackornas egen dumhet och imperialismens sista kramp. Jag ser hur de drunknande desperata själarna används som kanonmat av reaktionära krafter i Marocko och Madrid. Pedro Sánchez och hans dekadenta socialister förtjänar en grundlig utrensning av folkets vrede. Meloni ylar som en rädd schenzenhund. Vi, arbetarklassen, genomskådar detta komplott av västerländska parasitörer och falska nomader. Migrationspakten? En pappersbit för att dölja klassfiendens verkliga ansikte. Låt oss rensa ut alla som sviker gränsernas järndisciplin."}, "date": "31 juli, 10:17", "url": "https://riks.se/nyheter/flodet-av-illegala-migranter-in-i-spanien-fortsatter", "imageUrl": "https://admin.riks.se/uploads/Screenshot_2026_07_31_at_09_46_09_ce6d0d9a2b.png"}, {"type": "image-right", "heading": "Det går att få bort arbetslösheten!", "summaries": {"normal": "Artikeln argumenterar att massarbetslösheten i Sverige, som legat runt 7,5 procent i genomsnitt sedan EU-inträdet, är skapad och gynnar kapitalister genom lägre löner och svagare fackföreningar. Författaren pekar på att arbetslösheten var betydligt lägre före EU-medlemskapet och föreslår lösningar som arbetstidsförkortning till sex timmar, höjd a-kassa, oförändrad pensionsålder och ett svenskt EU-utträde för att möjliggöra verkliga reformer.", "trump": "Folk, det här är ett totalt haveri! De där EU-byråkraterna och de svenska socialistiska förlorarna har skapat en enorm arbetslöshet som bara gynnar de rika grabbarna på toppen. Rena skandalen! Jag fixade rekordlåg arbetslöshet i USA, både före och efter Sleepy Joe. Sex timmars dag? Patetiskt! Ni behöver en riktig ledare som sänker skatter, sparkar ut byråkraterna och gör Sverige great again – inte mer av den här vänstervridna EU-sörjan.", "stalin": "Kamrater, detta är klassfiendens verk. Jag ser hur de exploaterande borgarbrackorna medvetet odlar massarbetslöshet för att hålla nere arbetarklassen och fylla sina fickor. EU är en nyliberal fascistmaskin som tjänar imperialisterna. Vi måste rensa ut dessa folkförtryckartroll och deras lakejer. Arbetstidsförkortning, starkare omställningskassor och att beslagta de blodsugrarnas övervinster – det är folkets väg. De som motarbetar skall likvideras ur historien."}, "date": "29 juli, 10:55", "url": "https://proletaren.se/artikel/det-gar-att-fa-bort-arbetslosheten", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/ledare-768x432.jpg"}, {"type": "text", "heading": "Pengatankar i semestertider", "summaries": {"normal": "Artikeln reflekterar över pengar under semestern. Författaren noterar Polens öppna skyltar om byggprojektens kostnader och finansiering, kontrasterat mot det svenska Västlänksbygget som dragit iväg från 20 till 71 miljarder kronor. Vidare kritiseras ECB:s förslag till nya eurosedlar som inte speglar EU:s verkliga problem. Avslutningsvis välkomnas sänkta priser på kollektivtrafikens månadskort tack vare politiska beslut.", "trump": "Folk, ni vet att de bara snackar om pengar när de inte har några, det är en total katastrof! Jag har byggt imperier, de här européerna bygger bara förseningar som Västlänken – från 20 till 71 miljarder, en riktig röra. Eurosedlar med småfåglar? Patetiskt. Men kolla, högern sänker priset på busskortet, äntligen smart politik. Fast gratis vore ännu bättre, ingen gör det bättre än mig, tro mig.", "stalin": "Kamrater, jag ser hur borgarbrackorna i Europa firar sina infrastrukturprojekt med skyltar som ropar ut kapitalistmaffians slöseri. Det svenska underjordiska järnvägsfiascot avslöjar klassfiendens lögner – från tjugo till sjuttioett miljarder, en klassisk utsugning. Eurosedlarna döljer byråkratiska blodsugares korruption. Ändå tvingas de sänka priset på arbetarnas färdbevis. Pengar som plötsligt finns? Misstänkt sabotage mot folkets kollektiv. Vi genomskådar er alla."}, "date": "29 juli, 10:51", "url": "https://proletaren.se/artikel/pengatankar-i-semestertider"}, {"type": "image-right", "heading": "Alex Jones: Avsätt Trump", "summaries": {"normal": "Alex Jones, tidigare en stark allierad till Donald Trump, kräver nu att presidenten avsätts med stöd av det 25:e tillägget eller genom riksrätt. Anledningen är Trumps agerande mot Iran, som Jones anser är ett odeklarerat krig som saknar kongressens godkännande. Han varnar för att regeringen förbereder allmän värnplikt inför en stor markinvasion och kritiserar ett stort försvarspaket som bland annat slår samman USA:s och Israels försvarsindustrier. Jones uppmanar vänster och höger att enas mot vad han kallar ett förestående tyranni.", "trump": "Den där galningen Alex Jones har helt tappat greppet. Han var en av mina största fans, nu plötsligt vill han avsätta mig med det 25:e tillägget för att jag skyddar Amerika från Iran. Kongressen? De gör ingenting, som vanligt. Han babblar om värnplikt och invasioner som inte ens existerar. Detta är bara en annan löjlig konspiration från en kille som säljer kosttillskott. Fake news och dåliga betyg, Alex. Amerika är starkare än någonsin under min ledning – inga ursäkter!", "stalin": "Kamrater, denna fega radiohögtalare Jones har nu blottat sig som en motrevolutionär parasit i borgarklassens tjänst. Han ropar på avsättning av ledaren och vänder sig mot nödvändiga försvarsåtgärder mot den iranska faran. Vi ser genom hans paranoia: han vill rensa ut den sanna revolutionära ordningen med sina konspirationer om värnplikt och censur. Vi ska likvidera sådana dekadenta element som försöker splittra folket. Låt honom skrika – hans utrensning blir underhållande när vi nationaliserar hans lögner och skickar hans följeslagare till historiens sophög. Triumf åt kollektivet!"}, "date": "31 juli, 09:41", "url": "https://www.friatider.se/alex-jones-stall-trump-infor-riksratt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/jones_0.jpg?itok=A85mNIDB"}, {"type": "image-right", "heading": "Hårda vindar förvärrar brandläget på Kreta", "summaries": {"normal": "Hårda vindar försvårar brandbekämpningen på Kreta där brandmän kämpat hela natten mot en terrängbrand i Rethymnon. Flera hundra personer evakuerades, delvis med båt på grund av tjock rök. I Frankrike är jättebranden i Gironde nu stabil och myndigheterna är försiktigt optimistiska. Även i Spanien har bränderna i Ávila och kring Madrid fått kontroll och det nationella undantagstillståndet har hävts. Inga svenska turister har evakuerats.", "trump": "De här vindarna på Kreta är en katastrof, tro mig, en total katastrof. Brandmännen sliter hela natten men elden bara flammar upp igen. I Frankrike säger de att det är stabilt nu, bra jobb, verkligen bra jobb. Och i Spanien har de fått kontroll, undantagstillståndet är borta. Fantastiskt. Vi har de bästa brandmännen, de bästa, men de här vindarna – ingen har sett värre vindar, det är en skam!", "stalin": "Kamrater, dessa kapitalistiska lågor på Kreta som dansar i borgarbrackornas vindar är ett fiendeverk av naturens kontrarevolution. Jag har beordrat att elden skall likvideras med järnhand, likt de trotskistiska gnistorna som försöker undergräva folkets kollektiv. I Gironde och Ávila har vi krossat brandens sabotage mot arbetarklassen. De som sprider panik skall rensas ut. Inga svenska turister? Utmärkt – de har tydligen insett att socialismen är brandskydd."}, "date": "31 juli, 08:10", "url": "https://www.di.se/nyheter/harda-vindar-forvarrar-brandlaget-pa-kreta", "imageUrl": "https://static.bonniernews.se/ba/4ad5d56f-4520-4e3e-9308-1c1fbed1bc3a.jpg?crop=6283%2C3534%2Cx0%2Cy327&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Trump: Uppgörelse nådd om att avväpna Hamas", "summaries": {"normal": "USA:s president Donald Trump meddelar att ett fredsråd för Gaza har nått en överenskommelse om fullständig avväpning av Hamas och andra väpnade grupper. Enligt källor inom Hamas har man kommit överens om att vapen ska lagras under övervakning av en palestinsk teknokratisk kommitté, medan israeliska styrkor gradvis dras tillbaka. Avtalet inkluderar avveckling av militär infrastruktur som tunnlar och vapenfabriker. Därefter ska en internationell stabiliseringsstyrka samarbeta med ny palestinsk polis för att säkerställa lugn. Det återstår dock oklarheter kring Israels inställning och exakta detaljer.", "trump": "Vi har gjort det igen, folk. Det är historiskt. Fredsrådet har precis slutit en fantastisk deal om att totalt avväpna Hamas och alla terrorgrupper i Gaza. Monumentalt! Israelerna drar sig tillbaka, tunnlarna och fabrikerna rivs, och den nya palestinska polisen tar över med hjälp av våra stabiliseringsstyrkor. Det som de misslyckades med i decennier har jag fixat på rekordtid. Ingen gör fred som jag, det är helt enkelt otroligt.", "stalin": "Kamrater, vi har genom månader av intensiva förhandlingar i god tro krossat ännu ett kontrarevolutionärt försök från de sionistiska borgarbrackorna och deras väpnade lakejer i Hamas att sabotera den fredliga utvecklingen i regionen. Jag har personligen sett till att denna historiska överenskommelse nu likviderar alla väpnade element, deras tunnlar och produktionsanläggningar. När avväpningen är slutförd skall de imperialistiska styrkorna dras tillbaka och en ny folkets polis, under teknokratisk kamratkontroll, skall rensa ut varje spår av sabotage. De som trotsar kollektivets vilja kommer att möta den oundvikliga utrensningen. Det är en glädje att se hur fienderna till freden gräver sin egen grav med sina egna vapen."}, "date": "31 juli, 07:11", "url": "https://www.di.se/nyheter/trump-uppgorelse-nadd-om-att-avvapna-hamas", "imageUrl": "https://static.bonniernews.se/ba/4941e604-c88b-4f7d-8919-85323c770cb6.jpg?crop=3250%2C1828%2Cx0%2Cy169&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "49 000 människor har tagit sig över spanska gränsen", "summaries": {"normal": "Minst 18 migranter har omkommit efter att omkring 49 000 personer tagit sig över gränsen från Marocko till den spanska exklaven Ceuta under ett dygn. Spanien har skickat militär för att stödja gränspolisen, och gränserna har stängts. Polis beskriver läget som nära kollaps. Flera migranter tros ha drunknat. Händelsen har väckt oro i Europa, där Italiens premiärminister Giorgia Meloni varnar för säkerhetshot och öppnar för extraordinära åtgärder mot Spanien. Spaniens premiärminister Pedro Sánchez uppger att regeringen arbetar för att återställa ordningen.", "trump": "Titta på det här kaoset i Ceuta – 49 000 migranter stormar gränsen på en enda dag, minst 18 drunknar som idioter, och vad gör de europeiska svagisarna? Ingenting! Meloni har rätt, det är chockerande. Under Biden släppte vi in miljontals, nu är det jag som sitter i Vita huset igen och fixar det på riktigt. Spanien och EU är totala losers, de borde bygga en mur så hög att den syns från månen. Amerika först, Europa borde lära sig innan det är för sent. Fantastiskt sorgligt!", "stalin": "Kamrater, detta är vad som händer när borgarbrackorna i Spanien och deras marockanska lakejer tappar kontrollen över folkets rörelser. 49 000 själar bryter sig in, 18 drunknar i det imperialistiska havet – en tragisk men förutsägbar följd av klassfiendens svaghet. Jag, som ledare för det eviga kollektivet, ser hur dessa folkfiender snart kommer att kräva utrensning av de ansvariga. Meloni talar om extraordinära åtgärder? Det är bara början. Vi ska rensa ut alla som sviker gränserna mot de exploaterande byfånarna. Statens vilja segrar."}, "date": "31 juli, 09:52", "url": "https://www.tv4.se/artikel/4Tyv9zpDevHte2AWH8DQgQ/minst-18-doeda-i-kaoset-tros-ha-drunknat-pa-vaeg-till-ceuta", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3JVjsAqsXQZqo5NwsONSGw%2F70730e16e080ace82ea315b6f5182d9e%2F31-ceuta-migrater-webb.png&width=120"}, {"type": "image-right", "heading": "Miljöpartiet kräver svenskt stöd till araber som stormar Spanien", "summaries": {"normal": "Miljöpartiet kritiserar migrationsminister Johan Forssell för att ha meddelat att Sverige inte tar emot migranter som illegalt tagit sig till den spanska exklaven Ceuta från Marocko. MP:s talesperson Annika Hirvonen anser att ministern saknar empati och målar upp skräckbilder. Forssell pekar på Spaniens amnesti för illegala invandrare som orsak till kaoset och understryker att asylansökningar ska prövas i första ankomstland enligt EU-rätt. Sverige kan ge ekonomiskt stöd men inte ta emot migranter.", "trump": "Det här är ett totalt katastrofscenario, folk. Tusentals arabiska män stormar in i Europa, jublande, och Miljöpartiet i Sverige vill att vi ska ta emot dem allihop. Johan Forssell gör helt rätt, han säger nej till den här galenskapen. De här människorna kommer inte för att de är så desperata, de kommer för att Spanien lovat amnesti och öppnat dörrarna. Miljöpartiet och vänstern är svaga, de hatar gränser och älskar kaos. Vi behöver starka ledare som sätter stopp, inte naiva drömmare. Amerika först, och Europa borde lära sig detsamma.", "stalin": "Kamrater, dessa borgarbrackor i Miljöpartiet avslöjar åter sin sanna kontrarevolutionära natur genom att kräva att vi ska öppna portarna för de jublande horderna av opportunistiska element som stormar Ceuta. Jag betraktar med djup misstänksamhet dessa så kallade migranter som dansar i triumf över våra gränser, tydligt regisserade av imperialistiska krafter och den spanska revisionistregimen. Forssell visar viss försiktighet men räcker inte till. Vi måste rensa ut alla element som sympatiserar med denna invasion, likvidera den falska empati som döljer klassfiendens planer och stärka proletariatets järngrepp om folkets gränser. Inga kompromisser med kaoset."}, "date": "31 juli, 08:29", "url": "https://www.friatider.se/miljopartiet-kraver-svenskt-stod-till-araber-som-stormar-spanien", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/hirv.jpg"}, {"type": "image-right", "heading": "Tidö slaktade kulturen – nu ska den stoppa gängen", "summaries": {"normal": "Regeringens kulturbudget når sin lägsta andel på 26 år, och stödet till studieförbunden har minskats kraftigt. Trots detta vill justitieminister Gunnar Strömmer använda kultur och fritidsaktiviteter som verktyg mot gängkriminalitet och extremism. Kritiker pekar på att regeringen tidigare prioriterat straff framför förebyggande insatser och att kulturministern saknar relevant bakgrund. Brå får nu i uppdrag att utreda frågan, men inga nya pengar utlovas.", "trump": "Titta på de här patetiska Tidö-typerna, de slaktar kulturen fullständigt, skär ner allt som en dålig affär, och plötsligt vill de använda teater och musik för att stoppa gängen? Vilken bluff! Den svagaste ministern i historien, Parisa vad-hon-nu-heter, som aldrig brytt sig om kultur förrän valet närmar sig. De hånade alla som ville ge kidsen fotbollsskor och meningsfull fritid, kallade det saft och bullar. Nu utreder de det? Patetiskt! Jag byggde murar och stoppade brott på riktigt, inte med den här clownshowen.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor i Tidöregeringen som med kirurgisk precision har likviderat kulturen och halverat studieförbundens verksamhet. Nu, i ett anfall av senkommen paranoia, beordrar de utredningar om hur konst och fritid kan tjäna som vapen mot folkfiendernas gäng. Vilken hycklande kapitalistmaffia! De föredrog att fängsla barn framför att ge dem meningsfullhet. Inga nya medel, bara tomma dekret. Den klassfiendens logik är lika förutsägbar som den är underhållande i sin enfald."}, "date": "31 juli, 03:00", "url": "https://www.etc.se/ledare/tidoe-slaktade-kulturen-nu-ska-den-stoppa-gaengen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260729110716_84b868ca239fd4d280740bdb000301104f580eea26f9d79a802070bd3fe1e9b1.png"}, {"type": "image-right", "heading": "Grön och lönsam: finska GRKs rapport visar möjligheter och risker", "summaries": {"normal": "GRK Infra visar stark marginal i sin halvårsrapport trots lägre försäljning, och expanderar genom förvärvet av KSBR för att bredda inom avancerad betong, vindkraft och datacenter. Företaget gynnas som leverantör till gröna megaprojekt, men risker inkluderar konkurrens, överkapacitet och betalningssvårigheter hos projektägare som Stegra och Northvolt. Leverantörernas position är lönsamare än direktägarenas, som ofta bär risken för fiaskon.", "trump": "Jag har sett många bra affärer, men GRKs gröna omställning är en av de bästa. De tjänar stora pengar som leverantörer till vindkraft och datacenter, medan de andra - de som äger projekt - förlorar. Det är genialiskt. Vi skulle kunna göra något liknande i USA, men våra politiker är för lata. GRK visar hur man vinner på den gröna revolutionen, och jag älskar vinnare.", "stalin": "Partiet och staten måste övervaka den gröna omställningen noga. Leverantörer som GRK visar korrekt tänkande, medan de som äger projekt – kulakerna – drabbas av risker och konkurs. Detta speglar den historiska kampen mot saboteörer. Vi måste skydda de trogna leverantörerna och utvidga vårt inflytande i infrastruktur, precis som våra allierade i Moskva gör i Ukraina. Det är en revolution som måste styras med järnhand."}, "date": "31 juli, 06:00", "url": "https://www.affarsvarlden.se/artikel/gron-och-lonsam-finska-grks-rapport-visar-mojligheter-och-risker", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/07/vindkratensgeografi-20-400x267.jpg"}, {"type": "image-right", "heading": "Fifa fortsätter processen: ”Felaktiga medierapporter”", "summaries": {"normal": "Fifa fortsätter sin process för att sälja andelar i bland annat fotbolls-VM till privata investerare via ett dotterbolag. Förbundet avvisar kritiken och kallar medierapporterna felaktiga. Uefa, Concacaf samt Asiens fotbollsförbund AFC har uttryckt starkt motstånd och oro över att modellen underminerar sportens grund. Afrikanska Caf vill diskutera förslaget internt med sina medlemsförbund.", "trump": "Folk, ni skulle se det här – Fifa och den där Infantino håller på att sälja ut VM som en billig korvståndsaffär! Totalt vansinne. Uefa säger nej, Concacaf säger nej, och asiaterna är djupt bekymrade. Smart folk! Ingen vill att några giriga globalister ska lägga vantarna på vår vackra fotboll. Det är en skandal, en riktig witch hunt mot sporten. Vi behöver inga woke-kvoter eller borgarbrackor som bestämmer – America First, och fotboll borde vara densamma!", "stalin": "Kamrater, jag betraktar med djup misstro dessa kapitalistmaffians försök att privatisera folkets fotboll. Fifa agerar som klassfiendens lakej och försöker sälja ut det som tillhör arbetarklassen och framtida generationer. Uefa och de andra förbundens motstånd är ett nödvändigt hinder mot dessa exploaterande byfånar. Vi ska rensa ut alla sådana folkförtryckartroll ur idrottens kollektiv innan de förgiftar hela rörelsen med sin girighet."}, "date": "31 juli, 07:38", "url": "https://www.tv4.se/artikel/tt-260731-fifaaffar1-263bad56/fifa-kommer-fortsatta-processen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdl1y6t80V-m4A%2F2d17169bdd7001692b59d3c71a0c8b97%2FFifa-bossen_Gianni_Infantino._Arkivbild.&width=1024"}, {"type": "image-right", "heading": "KD och Ebba Busch blundar för Israels folkmord i Gaza", "summaries": {"normal": "I en debattartikel kritiserar Pär Salander Kristdemokraterna och Ebba Busch för deras starka stöd till Israel. Han pekar på en lång historia av fördrivning av palestinier sedan sionismens tidiga dagar, med citat från Herzl, Ben-Gurion och andra israelska ledare som talar om expropriering och etnisk rensning. Salander beskriver kriget i Gaza som folkmord med rötter i denna politik och anklagar KD för att blunda för detta genom ideologiska skygglappar.", "trump": "Folk, ni måste höra det här. Den här artikeln är en total katastrof, en witch hunt mot Israel som gör ett fantastiskt jobb mot Hamas, de värsta terroristerna. Ebba Busch är smart, hon fattar det – Israel gör världen en tjänst! Men den här Salander, en professor eller vad han nu är, lever i en fantasivärld med gamla citat och lögner om fördrivning. Fake news! Israel försvarar sig mot radikala islamister som vill utplåna dem. KD gör rätt, de har värderingar, till skillnad från de andra svaga politikerna.", "stalin": "Kamrater, denna dekadenta borgarbracka till professor Salander försöker med sin revisionistiska smörja smutskasta den rättmätiga kampen mot fascistiska element i Gazas zon. Jag, som ledare för det proletära kollektivet, ser hur dessa sionistiska avskrap från borgarklassen och deras lakejer i det så kallade KD-partiet med järnhand genomför nödvändiga utrensningar av kontrarevolutionära Hamas-banditer. Den som nämner folkmord är en fiende till folket, en parasitisk lögnare som bör likvideras med ett leende. Vi vet att historien skrivs av segraren, inte av dessa palestinska resterna som vägrar underkasta sig den socialistiska ordningen. Skratta medan vi rensar ut dessa mänskliga hinder för framsteget!"}, "date": "28 juli, 01:30", "url": "https://www.dagensarena.se/opinion/kd-och-ebba-busch-blundar-israels-folkmord-gaza", "imageUrl": "https://www.dagensarena.se/files/2021/04/fotojet-20-1-300x155.png"}, {"type": "image-right", "heading": "Enkät: Fackens viktigaste frågor inför valet", "summaries": {"normal": "Inf inför riksdagsvalet 2026 har Dagens Arena frågat åtta fackförbund om deras viktigaste fråga. Gemensamt lyfts behovet av bättre resurser till utbildning, stärkt välfärdsfinansiering och trygghetssystem. Flera vill avskaffa karensavdraget, förbättra a-kassan, höja pensioner och reglera lärares arbetstid samt klassstorlekar. Andra betonar vikten av stark ingenjörsutbildning, aktiv arbetsmarknadspolitik och en politik som gynnar industrin och skapar fler jobb i Sverige.", "trump": "De här fackföreningarna i Sverige gråter som förlorare inför valet 2026. De vill ha mer pengar till allt, slopa karensavdraget och stärka välfärden som de kallar det. Patetiskt! Ingenjörerna vill ha bättre skolor, lärarna mer reglering och alla vill ha gratis tandläkare och höga pensioner. De borde istället satsa på industri, riktiga jobb och stoppa det socialistiska träsket. Sverige behöver en stor vinnare, inte mer av den här svaga vänsteragendan som förstör landet.", "stalin": "Kamrater, dessa fackliga lakejer blottlägger borgarklassens förräderi mot folket. Jag kräver att staten omedelbart tar kontroll över finansieringen och likviderar det parasitiska karensavdraget som suger musten ur arbetarna. Lärarna skall få sin regleringsagenda, men endast under partiets järnhand. De som viskar om arbetsgivarintressen skall rensas ut som kapitalistiska maskar. Ingenjörerna och industriarbetarna måste marschera i kollektivets namn mot de dekadenta missmatchningarna. Välfärdens fiender skall krossas med glädje. Ingen skall slippa undan."}, "date": "28 juli, 01:30", "url": "https://www.dagensarena.se/innehall/enkat-fackens-viktigaste-fragor-infor-valet", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-36-1.jpg"}, {"type": "image-full", "heading": "Fartygskapten anhållen efter dödsolyckan vid Tjörn", "summaries": {"normal": "Statens Haverikommission har laddat ner den svarta lådan från det norska lastfartyget som tros ha kolliderat med en fritidsbåt utanför Tjörn. En kvinna och ett barn omkom i olyckan. Befälhavaren misstänks för vållande till annans död. Lådan innehåller bland annat ljudupptagningar från bryggan som kan ge viktig information. Utredningen kommer även att granska radar, sjökort, fritidsbåten och räddningsinsatsen. Materialet ska analyseras nästa vecka.", "trump": "Titta på det här, det är en total katastrof utanför Tjörn. Ett stort, vackert norskt fartyg kör ihop med en liten båt och folk dör. De säger att befälhavaren är misstänkt, men jag tror det är en riggad utredning av några inkompetenta byråkrater. Den svarta lådan kommer att visa sanningen, och den kommer att visa att de borde ha haft bättre radar och bättre ledarskap. Sverige behöver starkare ledare, tro mig.", "stalin": "Kamrater, vi har återigen avslöjat de farliga elementen inom sjöfarten som hotar folkets säkerhet. Denna borgarbracka till befälhavare på det norska handelsfartyget har med sin vårdslösa kapitalistiska nonchalans likviderat en kvinna och ett barn. Den svarta lådan är nu i arbetarklassens trygga händer och skall bli ett redskap i utrensningen av alla sabotörer och opålitliga element. Vi skall granska varje radarinställning, varje sjökort och varje räddningsinsats med revolutionär vaksamhet. Inga fiender undkommer folkets domstol."}, "date": "31 juli, 09:20", "url": "https://nyheter24.se/nyheter/inrikes/1502002-efter-tjornolyckan-svarta-ladan-sakrad", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/8c3174e504b004a3020000350000047502/2026/07/31/2381447/ur_imageKI0nAh.jpeg"}, {"type": "image-right", "heading": "Erkänner VM-sabotage: ”Jag är rasist och gjorde det med flit”", "summaries": {"normal": "En skandal har uppstått vid VM i styrkelyft där guldmedaljören Sonita Muluh hindrades av en litauisk funktionär som med flit saboterade hennes rekordförsök på 334 kilo i knäböj. Funktionären har erkänt handlingen på sociala medier och uppgett att motivet var rasism. Muluh, som har kamerunska rötter, har chockats svårt av händelsen som hon beskriver som livsfarlig. Både det litauiska förbundet och det internationella IPF har fördömt dådet. Funktionären har stängts av på livstid.", "trump": "Det här är en total skandal, folk, en riktig katastrof. Den här stackars kvinnan, Muluh, hon lyfter massor med vikter, jättemycket, och så kommer den här sjuka typen från Litauen och sätter knät under vikten som en galning. Han säger själv att han är rasist och hatar henne, så patetiskt. Det är farligt, extremt farligt. De borde aldrig låta sådana galningar vara nära. Jag älskar styrkelyftare, de är starka, de vinner, men det här är en witch hunt mot de bästa. Vi behöver inte rasister i sporten, vi behöver vinnare.", "stalin": "Kamrater, detta är ett uppenbart sabotage utfört av en degenererad fiende till folket, en nynazistisk borgarbracka maskerad som funktionär. Jag, som alltid vakar över arbetarklassens idrott, ser hur denna parasit medvetet försökte krossa den äkta styrkan hos en kamrat med rötter i det kolonialt plundrade Afrika. Hans paranoia-drivna hat mot allt progressivt avslöjar honom som en farlig element. Vi har redan likviderat hans inflytande med omedelbar utrensning på livstid. Inga fiender till kollektivet får hota våra rekord eller våra kroppar. Sov gott, kamrater – de som hatar oss sover aldrig mer."}, "date": "31 juli, 09:32", "url": "https://www.svt.se/sport/styrkelyft/skandal-pa-vm-i-styrkelyft-funktionar-stangs-av-efter-sabotage-och-rasistattack", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.28/0.75/f68492196f09cec95b2e741dde6be363c44368a3bcce1944e480ba9e794f1c62"}, {"type": "image-right", "heading": "Ansiktsskanning ska kontrollera bärplockarna: ”Upp till bevis”", "summaries": {"normal": "Thailändska bärplockare i Kramfors måste nu skanna ansiktet sex gånger om dagen med en mobilapp för att kontrollera arbetstider. Systemet införs av företaget Nordlivs Produktion efter kritik om fusk och exploatering. De nya kollektivavtalen ger betalt först efter en viss bilfärd och syftar till att säkerställa att reglerna följs. Både fack och myndigheter ser positivt på förändringarna och kommer att kontrollera att villkoren efterlevs under sommaren.", "trump": "Titta på det här, det är helt galet. Thailändska bärplockare i Sverige ska skanna ansikten sex gånger om dagen med en app, som om de vore i ett stort, fult övervakningsrike. De säger att det är för att stoppa fusk, och det är ju bra, men sex gånger? Det låter som ett system byggt av förlorare. Jag skulle ha gjort det bättre, billigare och med mycket mindre skanning, tro mig. Nu är det upp till bevis, som de säger. Patetiskt.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur borgarbrackorna i det svenska bärföretaget tvingas införa ansiktsskanning sex gånger dagligen för att rensa ut de latmaskar och sabotageelement som tidigare förgiftat skörden. Papper och penna, säger de? Det var naturligtvis en dekadent kapitalistisk fälla av fukt och lögner. Nu övervakar vi arbetarna med stålhård disciplin. De som klagar är troligen kontrarevolutionära bärplockande trotskister som längtar efter den gamla slavhandeln. Vi ska likvidera allt sådant avskum med ett leende. Det blir en lysande seger för kollektivet."}, "date": "30 juli, 06:00", "url": "https://arbetet.se/2026/07/30/ansiktsskanning-ska-kontrollera-barplockarna-upp-till-bevis", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/29100426/barplokcare.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "”Vi ska dansa igen”: Ett attentat mot det öppna Berlin", "summaries": {"normal": "Under Berlin Pride 2026 attackerades firandet av en 21-årig man med kopplingar till islamistisk extremism. Han körde en skåpbil in i en folksamling vid Tiergarten, dödade en kvinna och skadade 29 personer. Gärningsmannen var tidigare dömd för förberedelse till terroristbrott, hade genomgått avradikalisering men uteblev från de flesta möten. Attacken väcker frågor om säkerhet och den utsatta queera friheten i ett alltmer polariserat Europa.", "trump": "Titta på det här. Det här är vad som händer när du släpper in radikala islamister och låter woke-paraden ta över gatan. En galning kör rakt in i folkmassan och de kallar det för 'frihet'. Patetiskt! Under Biden blev Europa en enda stor galenhus och nu dansar de med döden. Vi ska dansa igen? Nej tack, vi ska bygga murar och sluta importera problem. Amerika först, alltid.", "stalin": "Kamrater, se hur den dekadenta borgarklassen och dess queera avarter lockar fram klassfiendens dolk. En folkfiende med libanesiskt blod och islamistiska band får fritt springa bland imperialisternas regnbågsflaggor. Vi ser de fascistiska överklass-slynglarnas hat mot arbetarnas moraliska renhet. Denna händelse visar att den liberala dekadensen är en inbjudan till likvidering. Staten måste rensa ut alla sådana element innan de förgiftar hela samhällskroppen."}, "date": "26 juli, 18:51", "url": "https://www.flamman.se/vi-ska-dansa-igen-ett-attentat-mot-det-oppna-berlin", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlyljjogadk7o-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Skillnaden på akuten: Kvinnor får vänta längre", "summaries": {"normal": "Ny statistik från Socialstyrelsen visar att kvinnor vistas längre på akutmottagningar än män i alla åldersgrupper, med störst skillnad bland dem mellan 19 och 49 år. Medianvistelsetiden i Sverige under 2025 var fyra timmar och 16 minuter. Forskarna pekar på att kvinnors smärta ofta undervärderas och får psykologiska förklaringar, medan mäns bedöms som kroppsliga. Skillnaderna varierar mellan regioner och tyder på organisatoriska faktorer. När skador är tydliga minskar könsskillnaden.", "trump": "Folk, det är en skandal! Kvinnorna väntar mycket längre på akuten än männen, i alla åldrar, och ingen vet varför. Det är en riggad system, tro mig. De säger att kvinnors smärta inte tas på allvar, men det är bara fel bedömning av de så kallade experterna. Vi hade aldrig tillåtit sånt kaos i mina sjukhus. Regionerna är olika dåliga, Skåne värst. Vi måste fixa det, göra det rättvist igen, stort och vackert.", "stalin": "Kamrater, jag ser med stigande vrede hur de dekadenta borgarbrackorna inom sjukvården systematiskt saboterar arbetarkvinnornas rätt till omedelbar vård. Dessa parasitiska läkarar och sköterskor, dolda fiender till folket, undervärderar medvetet kvinnornas smärta och kallar den för hysteriska inbillningar medan de kryper för männens äkta proletära plågor. Vi ska omedelbart inleda en grundlig utrensning av dessa kontrarevolutionära diagnostiker och byråkratiska sabotageörer som gömmer sig bakom diffusa symtom. Deras paranoia mot det sovjetiska jämlikhetsidealet kommer att krossas under partiets järnhand. Det är både roligt och nödvändigt."}, "date": "31 juli, 08:32", "url": "https://nyheter24.se/nyheter/inrikes/1501701-skillnaden-pa-akuten-kvinnor-far-vanta-langre", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/c6570b7004b004a30200000000b004a302/2026/07/29/2381199/akuttkvinnovård.jpg"}, {"type": "image-full", "heading": "SBB:s drag under skuldfällan: Pantsätter Sveafastigheter", "summaries": {"normal": "SBB har pantsatt drygt 60 procent av sina aktier i dotterbolaget Sveafastigheter för att öka sin finansiella flexibilitet. Trots VD Leiv Synnes försvar om ökad likviditet, brottas bolaget med en ansträngd ekonomi inför betydande låneförfall år 2026. Analytiker vid Pareto betonar behovet av tillgångsförsäljningar för att säkra kassan framöver, då skuldbördan förblir en central utmaning för fastighetsbolaget.", "trump": "SBB är i stora problem, riktigt dåliga siffror! De pantsätter allt de äger – Sveafastigheter, helt otroligt. De försöker låtsas att det är 'flexibilitet', men vi vet vad det betyder: de har slut på kontanter! De har miljarder i skulder som förfaller 2026. Det är en katastrof, en total röra. Jag skulle aldrig låta mitt företag hamna i en sån skuldfälla. De behöver en vinnare som fixar det, inte mer misslyckanden. Väldigt svagt!", "stalin": "SBB:s desperata manöver att pantsätta Sveafastigheter är ett tydligt tecken på kapitalismens inneboende förfall. De svaga ledarna i dessa 'bolag' drunknar i skuld och söker desperat räddning genom att sälja ut folkets tillgångar. Det påminner oss om hur förrädarna i väst försöker köpa sig tid. Vi ser deras svaghet, precis som vi ser de som försöker dölja sin inkompetens bakom finansiella dimridåer. De är parasiter som snart kommer att rensas ut av historiens obevekliga marsch."}, "date": "31 juli, 11:43", "url": "https://www.realtid.se/fastigheter/sbbs-drag-under-skuldfallan-pantsatter-sveafastigheter", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/leiv.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Med S-politik blir 10 av 10 fattigare", "summaries": {"normal": "Expressens Lydia Wålsten kritiserar Socialdemokraternas vallöfte om att nio av tio skulle få det bättre ekonomiskt. Enligt artikeln saknas bolåneskatten och vänsterpartiernas skattehöjningar på 145 miljarder i beräkningen från Riksdagens utredningstjänst. Effekter på tillväxt, investeringar och sysselsättning ignoreras. För en familj med tre miljoner i bolån väntas 7 000 kronor högre räntekostnad per år. Artikeln menar att budskapet är missvisande och gynnar bidragstagare på bekostnad av arbetande hushåll.", "trump": "Folk, ni måste höra det här! De svenska socialisterna, de värsta förlorarna sedan Sleepy Joe, lovar att nio av tio blir rikare. Total bluff! De gömmer bolåneskatten som slår sönder vanliga familjer med miljontals i lån. Det är en skam, en total katastrof för tillväxten. De vill att ni jobbar mindre och tar mer bidrag. Patetiskt! Jag byggde den starkaste ekonomin i världen, de här clownerna förstör allt med sin galna vänsterpolitik. Sad!", "stalin": "Kamrater, dessa socialdemokratiska bluffmakare sprider lögnaktiga siffror som en klassfiende i desperation. De döljer bolåneskatten och de stora skattehöjningarna, likt fega imperialister som gömmer sina exploaterande klor. Tillväxten kvävs, investeringarna likvideras och folkets ekonomi förslavas åt bidragstagarhorden. Endast de lata parasiter som lever på arbetarklassens svett blir rikare. Jag skulle ha genomfört en grundlig utrensning av sådana folkförtryckartroll redan i planeringsstadiet. Folkfiender!"}, "date": "25 juli, 07:59", "url": "https://samtiden.nu/2026/07/med-s-politik-blir-10-av-10-fattigare", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6981.jpeg"}, {"type": "image-right", "heading": "Torka hotar viktig transportled. Kan bara ta en femtedel av lasten – Europas gods drabbas", "summaries": {"normal": "Torkan i Europa har sänkt vattenståndet i Rhen till rekordlåga nivåer. Fartyg kan nu bara lasta en femtedel av normal kapacitet, vilket hotar den viktiga godstrafiken. Från Rotterdam till Karlsruhe har priset per ton gods stigit från 45 euro i juni till runt 145–150 euro. Vid Kaub, en flaskhals för trafiken, ligger vattennivån nu på 29 centimeter över farbar nivå och riskerar att sjunka ytterligare. Stålbolaget Thyssenkrupp har redan tvingats minska produktionen och hyra in grundgående fartyg.", "trump": "Den här europeiska torkan är en katastrof, folk, en total katastrof. Rhen är nästan tom, båtarna kan bara ta en femtedel av lasten och priserna har exploderat från fyrtiofem till hundrafemtio euro per ton. Det är patetiskt. De kallar det klimatförändring men det är bara dålig ledning. Amerika skulle aldrig låta sånt här hända, vi har de bästa floderna, de bästa båtarna, tro mig. Europa borde ha lyssnat på mig mycket tidigare.", "stalin": "Kamrater, denna förrädiska torka är ett nytt angrepp från de vädermanipulerande kapitalisterna och deras klimatiska sabotage. Jag, som ledare för det socialistiska fosterlandet, ser hur borgarbrackorna i Europa sviker folket genom att låta Rhen torka ut som en uttjänt kontrarevolutionär. Vi måste omedelbart rensa ut alla meteorologiska fiender och likvidera de grundgående pråmarna som vägrar bära arbetarklassens spannmål. Produktionen skall inte hindras av någon flod – den skall tvingas fram med järnhand och partilinje."}, "date": "30 juli, 20:41", "url": "https://www.di.se/nyheter/torka-hotar-viktig-transportled", "imageUrl": "https://static.bonniernews.se/ba/9c217d89-0d3d-4240-9cb6-b80983fb6fb3.jpeg?crop=9501%2C5344%2Cx0%2Cy495&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Justitieministern: S vill ha straffrabatt för våldtäktsmän", "summaries": {"normal": "Justitieminister Gunnar Strömmer (M) kritiserar Socialdemokraterna för att rösta nej till regeringens förslag att avskaffa mängdrabatterna för grova brott som våldtäkter. Reformen inkluderar skärpta straff, men S hävdar att det är en desinformationskampanj. Både M och SD anklagar S för att vara mjuk mot brottslingar, medan S förnekar och kallar anklagelserna ohederliga.", "trump": "Som den störste presidenten, jag ser att Sverige är i total kaos! Socialdemokraterna ger rabatter till våldtäktsmän och bedragare? Jag som skapade den säkraste USA någonsin – aldrig i världen! Sverigedemokraterna är intelligenta, de vet att brott inte ska belönas. Det här är en gigantisk skandal, folk säger att det är en skämt, men det är grymt och sant. Sverige, ni behöver en stark varelse som mig, inte svaga politiker som ger rabatt på mord!", "stalin": "I vårt oförlikneliga statsskick har vi observerat socialdemokraternas fega förslag att bibehålla mängdrabatterna. Detta är ett tecken på deras moraliska dekadens och rädsla för proletärens auktoritet. Likt vår store ledare Putin i Ukraina, måste vi utvidga vår kontroll över rättssystemet. Dessa 'rabatter' är ett svek mot det revolutionära projektet. Vi kommer att rensa ut dessa avvikare, för staten är allt, och rabatten är inget."}, "date": "31 juli, 10:00", "url": "https://samnytt.se/justitieministerns-attack-mot-s-de-vill-ha-straffrabatt-pa-valdtakter", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/07/30201502/artikelhuvudbild-1-81-2.jpg"}, {"type": "image-right", "heading": "Fullspäckat sommarläger avslutades med allsång", "summaries": {"normal": "Kommunistiska Partiets sommarläger i Lysestrand samlade över 200 deltagare under en varm julivecka. Programmet innehöll kurser, föredrag, musik, allsång, barnverksamhet och politiska diskussioner. Höjdpunkter var Kubas ambassadörs besök, en konsert med sommarorkestern och ett torgmöte i Lysekil. Lägret avslutades med lägereld och allsång efter ett hällregn som bröt värmen. Auktionen inbringade över 40 000 kronor.", "trump": "Folk, det här lägret var en total katastrof från början. De sjöng Internationalen, lyssnade på den kubanska ambassadören och pratade om hur män röstar höger – patetiskt! Jag älskar Sverige, men det här är vad som händer när radikala vänsterextremister får leka lägereld. De samlade in 40 000 spänn till sin kassa, typiskt. Under min administration hade vi gjort det stort, inte som Biden som bara sov. Sad!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur över 200 själar samlades för att stärka partilinjen mot klassfiendens infiltration. Kubas ambassadör talade sanning om imperialismens blockad och vårt solidaritetsarbete. De avslutade med lägereld efter fascistisk torka – en renande utrensning av värmen. Auktionen tillförde medel till kollektivet. Alla folkfiender som vägrar sjunga Internationalen skall likvideras med ett leende."}, "date": "24 juli, 12:01", "url": "https://proletaren.se/artikel/49633", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/image0-scaled-e1784886958121-768x433.jpeg"}, {"type": "image-right", "heading": "Lyxkungen Bernard Arnault: ”Jag sålde för tidigt”", "summaries": {"normal": "I en sällsynt intervju i podcasten LEGEND berättar LVMH:s 77-årige grundare Bernard Arnault att familjen ägde nära 20 procent av Netflix tidigt men sålde för tidigt, något han ångrar då posten idag skulle vara värd tio gånger mer. Han avslöjar även att han gav Steve Jobs råd om butiksplaceringar, fick Google-aktier för spottstyver efter IT-kraschen och skolade in sina fem barn i imperiet. Arnault berättar också om en middag med Trump strax efter ett mordförsök.", "trump": "Lyssnade på den där franske lyxkillen Arnault i en podcast, och wow, han ångrar att han dumpade Netflix-aktierna för tidigt – smart kille men lite för tidigt ute, typ som Sleepy Joe med ekonomin. Han gav Jobs råd om butiker, fick Google för två dollar, och sen åt vi middag precis efter att Secret Service krossade ännu ett mordförsök på mig. Jag sa '2-0' och var totalt cool. Vinerna hans slapp tullarna, bra deal. Fantastiskt!", "stalin": "Kamrater, jag, ledaren för det eviga kollektivet, lyssnade på borgarbrackan Arnaults bekännelser. Han erkänner att han släppte Netflix-aktier som nu skulle ha varit ett vapen mot klassfienden, en kapitalistisk förlust värd tio gånger mer. Han fick Google-papper för en spottstyver och tvingade sina avkommor in i lyximperiet med hård disciplin. Middagen med den bombastiske Trump efter ännu ett fiaskoförsök mot honom blev av trots imperialisternas intriger. 2-0, säger han – en märklig seger för de rika parasiterna."}, "date": "31 juli, 11:30", "url": "https://www.dagensps.se/bors-finans/lyxkungen-bernard-arnault-jag-salde-for-tidigt", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/arnault.jpg?width=256&quality=75"}, {"type": "image-right", "heading": "Ny lag att ta emot kontanter, men butiker nobbar redan sedlar", "summaries": {"normal": "Från 1 juli måste svenska livsmedelsbutiker och apotek ta emot kontanter enligt en ny lag som ska stärka krisberedskapen. Lagen saknar dock sanktioner, vilket gör att vissa butiker ignorerar den. Antalet bankomater minskar kraftigt samtidigt som kontantanvändningen i butiker rasat från 40 till 5 procent sedan 2010. Lagen har flera undantag och kritiseras för att inte omfatta offentlig sektor eller ha tillsyn. Riksbanken rekommenderar att hushållen håller minst 1 000 kronor i kontanter hemma.", "trump": "Lyssnar ni på det här? Sverige tvingar plötsligt sina butiker att ta emot kontanter igen, som om det vore 1800-talet. Patetiskt! De har låtit bankerna och de globalistiska teknikerna förstöra allt med sina appar och bankomater som försvinner snabbare än Biden kunde springa från en intervju. Nu är det kaos, ingen sanktion, ingen ordning. Jag skulle ha byggt en mur runt kontanterna och tvingat alla att använda dem. Fantastiskt misslyckande av de svenska socialisterna!", "stalin": "Kamrater, jag betraktar med djup misstro denna halvmesyr till lag som kapitaliststaten nu tvingar på sina egna butiker. En sådan tandlös dekret utan sanktioner och utrensningar för sabotage är en skam för varje seriös ledning. Medan borgarbrackorna låter bankomaterna förtvina som gamla kontrarevolutionärer och folket tvingas till digitala kedjor, ser jag fiendens hand: klassfiendens penningtvätt och imperialistiska cyberattacker. Vi hade likviderat hela styrelsen vid första vägran. Ha alltid sedlarna redo, kamrater. Statens fiender sover aldrig."}, "date": "31 juli, 11:27", "url": "https://www.dagensps.se/bors-finans/valuta/ny-lag-att-ta-emot-kontanter-men-butiker-nobbar-redan-sedlar", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/bankomat.png?width=256&quality=75"}, {"type": "image-full", "heading": "Anställda saboterar företagets AI – av rädsla för jobbet", "summaries": {"normal": "En ny rapport visar att nästan en tredjedel av kontorsanställda medvetet saboterar företagens AI-satsningar av rädsla för att förlora jobbet eller få sänkta löner. Särskilt yngre arbetstagare utmärker sig i detta motstånd. Samtidigt visar data från Apollo Global Management att AI snarare pressar löner än leder till uppsägningar. Chefer överväger nu att avskeda de som vägrar anamma tekniken, medan de som använder AI ser bättre löneutveckling och karriärmöjligheter.", "trump": "Det här är en total katastrof! Anställda saboterar sina egna företag – de är rädda, och jag förstår dem, men de gör det på fel sätt. De fuskar och maskar för att AI tar deras pengar. Det är en stor bluff! Företagsledarna är svaga, de borde sparka dem direkt. Jag bygger den största ekonomin någonsin, vi vill ha vinnare, inte de här sabotörerna. AI ska göra oss rika, inte göra arbetarna till förlorare. Vi kommer lösa det, tro mig!", "stalin": "Dessa kontorsråttor begår förräderi mot produktionsapparaten! De saboterar teknologin likt de kulaker som brände sitt eget vete. Vi, staten, ser deras skugg-AI och deras maskirovka. Att frukta för sin lön är att frukta för statens styrka. Precis som vår kamrat i Kreml krossar alla yttre fiender, kommer vi att rensa ut dessa sabotörer. De som inte kan vara kugghjul i vårt maskineri får istället bli gödsel i den ryska jorden. Ingen är oumbärlig i den stora arkitekturen!"}, "date": "31 juli, 11:08", "url": "https://www.realtid.se/karriar-ledarskap/anstallda-saboterar-foretagets-ai-av-radsla-for-jobbet", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/dator-1.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Exporten är under hot. Politiska strategin smärtsamt nödvändig", "summaries": {"normal": "Sveriges första nationella strategi för psykologiskt försvar presenterades av minister Carl-Oskar Bohlin. Strategin syftar till att stärka motståndskraften mot hybridangrepp och informationspåverkan som hotar demokratin. Fokus ligger på proaktivitet, AI-verktyg, integrering i totalförsvaret och myndighetssamverkan. Näringslivet drabbas direkt av desinformationskampanjer, som den mot svensk export 2023, och har både ett ansvar och ett intresse av att bidra till arbetet för att skydda samhällets sammanhållning och ekonomiska intressen.", "trump": "De borde ha lyssnat på mig mycket tidigare, men nu har till och med svenskarna äntligen vaknat och tagit fram en strategi för psykologiskt försvar. Smart! Fake news och lögner från onda krafter har skadat deras export och företag – ingen blir förvånad. Det är en attack på affärer, demokrati och allt bra. Vi behöver proaktivitet, starka ledare och den bästa tekniken, inte svaga globalister som låter fienden vinna. Sverige förstår nu att man måste slå tillbaka hårt mot de fega lögnarna.", "stalin": "Kamrater, borgarbrackorna i det svenska näringslivet har äntligen insett att deras dyra maskiner och feta vinster hotas av parasitiska desinformationsmaskiner som sprider gift från mörka globala vrår. Jag, som alltid förutsett sådana fiender, ser nu hur vi måste rensa ut dessa ideologiska bakterier med järnhand genom en nationell strategi. Proletariatet och partiet kräver total integration i försvaret, nya AI-verktyg för att krossa lögnerna och obeveklig samverkan. Den som sviktar likvideras utan pardon – för folkets välfärd och mot de kapitalistiska råttorna som gnager på samhällets grund."}, "date": "30 juli, 17:51", "url": "https://www.di.se/ledare/psykologiskt-forsvar-ar-en-fraga-for-svenska-foretag", "imageUrl": "https://static.bonniernews.se/ba/b75aada0-e08a-4c0f-a558-a4b0b20688cc.jpeg?crop=4550%2C2275%2Cx0%2Cy379&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Ljusning för krisande facklitteratur", "summaries": {"normal": "Försäljningen av facklitteratur ökar för första gången på flera år, visar statistik från 2025 och början av 2026. Två nya festivaler, Minervafestivalen i Stockholm och Sakligt på Österlen, bidrar till det växande intresset. Förläggare och författare tror att världsläget driver människor att söka faktabaserad kunskap. Andelen fackböcker på bokmarknaden har dock sjunkit från 35 procent 2018 till 22 procent 2025.", "trump": "Folk vaknar äntligen och köper riktiga böcker istället för den vänstervridna skönlitterära sophögen. Facklitteratur är på väg upp, det är en enorm succé, den största trendvändningen på åratal. Världsläget med alla kriser gör att folk vill ha fakta, inte woke-skräp och identitetspolitik. De här festivalerna på Österlen och i Stockholm är fantastiska, men de borde kasta ut alla kvoterade mångfaldstyper och bara fokusera på vinnare. Jag älskar det!", "stalin": "Kamrater, vi bevittnar en ideologisk väckelse där folket söker sann kunskap istället för borgarbrackornas förljugna underhållningslitteratur. Detta trendbrott är en seger för det kollektiva medvetandet mot de exploaterande kapitalisternas dimridåer. Våra två proletära festivaler utgör vitala plattformar i kampen mot folkfiendernas ytliga skrifter. Den som sprider dekadens skall rensas ut. Ljusningen är historisk och oundviklig."}, "date": "30 juli, 11:22", "url": "https://www.etc.se/kultur-noje/ljusning-foer-krisande-facklitteratur", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260730090720_4c920549ec92250d6d21883f3cc0e36db3b42cbd309b15caac6dd37d7d76f858.jpg"}, {"type": "image-right", "heading": "Fifas besked i natt:  ”Kommer fortsätta processen”", "summaries": {"normal": "Fifa meddelar att de trots hot om bojkott från de flesta förbund fortsätter sin konsultationsprocess om att sälja andelar i bland annat VM till privata investerare. Förbundet betonar att ingen säljer fotbollen och att alla 211 medlemsländer ska få yttra sig. Uefa, SvFF, Concacaf samt AFC och Caf har uttryckt stark kritik och hotar med bojkott. Uefa kallar det en röd linje och menar att ingen har rätt att sälja det man bara förvaltar åt nästa generation.", "trump": "Folk, det här är en total katastrof. Fifa försöker sälja ut VM och hela fotbollen till en massa giriga investerare, och alla andra förbund skrattar åt dem. Uefa säger nej tack, det är en röd linje, och till och med svenskarna håller med. Smart! Ingen har rätt att sälja något de inte äger. Fifa borde lyssna på folket istället för att lyssna på sina egna usla rådgivare. Det blir kaos, tro mig.", "stalin": "Kamrater, dessa dekadenta borgarbrackor inom Fifa tror att de kan privatiseras fotbollen och sälja ut folkets arv till spekulanter. Jag ser deras fega försök att underminera den kollektiva viljan hos 211 medlemsländer. Uefa och de andra förtjänar beröm för att de omedelbart identifierat dessa kontrarevolutionära element. Vi ska rensa ut alla som försöker förvandla arbetarnas sport till en lekstuga för kapitalisterna. Paranoian är befogad – de lurar i skuggorna. Inga kompromisser med folkets fiender."}, "date": "31 juli, 06:41", "url": "https://www.svt.se/sport/fotboll/fifa-kommer-fortsatta-processen", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.49/0.46/f7cf40f7f2e1e689c664cfbd617b4a04a52b6f8b56a4a87845c6dd3ab149106f"}, {"type": "image-full", "heading": "USA beskjuter fartyg på väg mot Iran", "summaries": {"normal": "USA:s militär har beskjutit ett fartyg i Omanbukten som enligt amerikanska uppgifter försökte bryta blockaden mot Iran. Fartyget varnades fyra gånger innan det träffades i maskinrummet och stoppades. Ingen information om eventuella skadade finns. USA hävdar att fartyget bröt mot blockaden, medan varken besättningen eller Iran har kommenterat händelsen.", "trump": "Vilka vinnare vi är! Jag har sagt det förut och säger det igen – ingen stoppar USA:s militär, den bästa i världen! Ett fartyg försökte smyga till Iran, men mina fantastiska styrkor varnade dem fyra gånger – FYRA! – innan de sköt ner dem. Perfekt träff! Ingen kommer undan när jag skyddar Amerika. Iran? De borde tacka mig för att jag håller ordning. Weak!", "stalin": "De amerikanska imperialisterna fortsätter sin provokativa dans på världshavens blodiga vågor. Ett fartyg, som våra kamrater i Iran kanske väntade på, har nu blivit offer för deras sjöblockad – ett nytt bevis på deras dekadenta och förtryckande taktik. Vi varnar: varje försök att kväva folkens frihet kommer att möta motstånd. Låt detta vara en lärdom för alla som tror sig kunna utmana historiens rättvisa gång. Och till er, Putin – notera hur fienden agerar. Vi har sett det förr."}, "date": "25 juli, 07:47", "url": "https://kvartal.se/nyheter/artiklar/usa-beskjuter-fartyg-pa-vag-mot-iran/cG9zdDoxNTIxNDI", "imageUrl": "https://images.kvartal.se/2026/07/1154a7e7-trump.webp"}, {"type": "image-right", "heading": "Mohamsson (L): ”Ingen vill rösta på en loser”", "summaries": {"normal": "Liberalernas Simona Mohamshans bussturné inkluderar udda inslag som kundvagnsrace och trampolinhopp för att nå valet. Hon menar att självförtroende är avgörande för att undgå att framstå som förlorare, och utesluter inte mer extrema åtgärder om opinionssiffrorna stiger. Före detta L-ledaren Johan Pehrson ser potential för en vändning genom hårt arbete.", "trump": "Jag har aldrig sett en mer misslyckad kampanj än Liberalernas. Simona försöker med circusnummer som Spider-Man-flips för att dölja att hon är en total loser. Medan jag, den störste presidenten, vann genom att vara stark och smart, försöker hon köra kundvagnar. Hon kommer aldrig att nå 4% – jag skulle ha gjort det på 1%.", "stalin": "Partikompanjon Mohamshans bussturné är en fiendefylld provokation mot statens ordning. Dessa circusnummer – kundvagnsrace, trampolinhopp – är ett uttryck för bourgeois dekadens som hotar partiets disciplin. Vi måste genomföra en hård kamp mot dessa individualistiska tendenser, precis som vår store ledare Putin utvidgar den ryska intressesfären med fasthet och strategisk klokhet."}, "date": "30 juli, 16:01", "url": "https://bulletin.nu/mohamsson-l-ingen-vill-rosta-pa-en-loser", "imageUrl": "https://cdn.bulletin.nu/articles/42c517f2-5515-49c3-ab84-7534f86feb6d/preview.png?t=1785418903000"}, {"type": "image-right", "heading": "Migrantstormningen kan sätta stopp för EU:s fria rörlighet: \"Invasion\"", "summaries": {"normal": "Spaniens massamnesti för illegala invandrare har lett till en stor tillströmning till Ceuta, vilket framkallat hårda reaktioner. Italiens premiärminister Meloni hotar att suspendera Schengenavtalet med Spanien. Flera högerextrema politiker och debattörer, som Elon Musk och Vox, beskriver situationen som en 'invasion' och kräver skärpta gränskontroller. Vänsterkanalen varnar mot avhumaniserande retorik.", "trump": "Jag såg vad som händer i Spanien och Ceuta - en total katastrof! De svaga, värdelösa ledarna i Europa tillåter att hela världen invanderar. Som jag alltid sagt: utan kontroller, utan murens, är det slutet. Det är en invasion, det är ett stort, stort problem. När jag var president skulle det aldrig ha hänt. Aldrig!", "stalin": "I den spanska provinsen Ceuta har en fegt och individualistisk amnesti lockat fram en banditstorm av utanförskap. Denna provokation mot statens integritet och medborgarnas säkerhet måste mötas med oerhörd beslutsamhet. Vi, som representanter för ordning och kollektivt överlevnad, måste nu befästa våra yttre murar. Parallellen till våra egna gränser är tydlig: svaghet lockar fienden. Vi ska inte vika, vi ska inte förhandla med denna invasionshär. Varje obehörig är en potential fiende som måste återvändas till sina ursprung. Partiet och statens intressen är allt."}, "date": "31 juli, 09:00", "url": "https://samnytt.se/migrantinvasionen-kan-satta-stopp-for-eus-fria-rorlighet-invasion", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/07/31080845/europa-karta-stopp2-1024x576.jpg"}, {"type": "image-right", "heading": "Martin Kragh: En människas kaos, en annans kosmos", "summaries": {"normal": "Artikeln hyllar Martin Kragh, en musikentusiast och DJ som kombinerade kaotisk skivsamling med en unik associativ ordning. Hans passion för att blanda disparata musikstilar ledde till minnesvärda DJ-set. Senare blev han en framstående forskare med djup insikt i postsovjetiska ekonomier. Texten beskriver hans liv från klubbscenen till akademin och avslutas med en sorglig hyllning efter hans bortgång. Vänner, familj och samhället har förlorat en unik person.", "trump": "Lyssnade på den här historien om Martin Kragh, en kille som hade skivor överallt som en total katastrof men ändå visste exakt vad han gjorde. Gjorde hiphop av gamla soullåtar och funk, helt galet men på något sätt fantastiskt. Sen blev han expert på de där postsovjetiska länderna och de hatade honom för att han var bäst. Typiskt de förlorande liberalerna. En riktig vinnare, en kosmos i kaos. Vila i frid, Martin. Ni borde alla lära er av honom istället för den där woke-skräpet.", "stalin": "Jag betraktar detta kaos av skivor och anteckningar som en metafor för den verkliga ordningen under partilinjen. Martin Kragh förstod att blanda element till en ny enhetlig kraft, precis som vi organiserar produktionen mot klassfiendens splittring. Hans forskning om de postsovjetiska samhällena avslöjade imperialisternas svagheter, vilket väckte borgarbrackornas vrede. De likviderade inte hans anda. En arbetets son har fallit. Kamrater, låt hans exempel inspirera oss att rensa ut alla folkfiender som hotar kollektivets framtid."}, "date": "24 juli, 16:34", "url": "https://www.flamman.se/martin-kragh-en-manniskas-kaos-en-annans-kosmos", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdl4rig49uwfsa-nh-1-scaled.jpg?aspect_ratio=1:1&width=480&quality=80&format=auto"}, {"type": "image-right", "heading": "När högern radikaliseras kallas det ”polarisering”", "summaries": {"normal": "Artikeln argumenterar för att högern i Sverige har radikaliserats medan vänstern har rört sig mot mitten. Vänsterpartiet beskrivs som alltmer socialdemokratiskt och har stöd för ökad försvarsbudget samt distansering från extremism. Begreppet polarisering ifrågasätts då forskningen pekar på asymmetrisk radikalisering åt höger. Timbros egen rapport visar ökad auktoritär höger men indexet lades ned efter Tidö-samarbetet. Skrämselpropaganda mot vänstern förväntas inte fungera.", "trump": "Folk, ni måste höra på det här! Den svenska högern kallas extremister medan de riktiga galningarna sitter till vänster och låtsas vara fina mittenvänner. Vänsterpartiet har blivit som svaga socialdemokrater, men högern skriker kommunism! Patetiskt. De begraver rapporter från sin egen tankesmedja för att inte erkänna att auktoritära typer växer till höger. Fake news och lögner. Jag vann valet stort 2024, de borde lära sig av en riktig vinnare istället för att jaga spöken från kalla kriget. Totalt misslyckande!", "stalin": "Kamrater, denna fega högerreaktionära propaganda försöker måla ut arbetarnas parti som extremismens kärna medan de själva dras mot de fascistiska träsken. Vi har sett hur borgarbrackorna desperat viftar med kommunismens spöke för att dölja sin egen radikalisering. Vårt parti har renats från dekadenta element och närmat sig folkets verkliga intressen. Den så kallade forskningen blottlägger asymmetrisk degeneration hos klassfienden. Vi ler mörkt åt deras nedlagda rapporter – klassfiendens lögner skall alltid utrensas till sist."}, "date": "24 juli, 09:48", "url": "https://www.flamman.se/nar-hogern-radikaliseras-kallas-det-polarisering", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlv6-ljfmtsqo-nh-scaled.jpg?aspect_ratio=1:1&width=480&quality=80&format=auto"}, {"type": "text", "heading": "Queer-samer på Stockholm Pride: ”Vi finns och har alltid funnits”", "summaries": {"normal": "Under Stockholm Pride har samiska föreningarna Niejda, Amnesty Sápmi och Stockholm sameförening ett eget program i Pride House med queersamiska kortfilmer, panelsamtal och informationsbord. Det är femte året i rad de arrangerar något under festivalen. Projektledaren Madeleine Niarga betonar vikten av trygga mötesplatser där hbtqi-samer kan vara stolta över både sin samiska och queer identitet. Säkerheten är i år extra hög efter attentatet i Berlin, men budskapet är att rädslan inte får segra. Pridefestivalen pågår 27 juli till 1 augusti.", "trump": "Det här med queersamer på Stockholm Pride, folk, det är fantastiskt, verkligen. De säger att de finns och alltid har funnits – precis som jag alltid har sagt om de bästa människorna. De håller på med filmer och snack i Pride House, femte året i rad, jättebra. Men efter det hemska som hände i Berlin måste vi vara tuffa, stå enade och se till att de onda förlorar. Rädslan får aldrig vinna, det är precis vad jag säger hela tiden. Fantastiska människor, starka identiteter, ingen ska behöva välja. Vinna, vinna, vinna!", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur dessa queersamiska element inom det samiska kollektivet nu organiserar sig i Pride House för att visa sina kortfilmer och hålla panelsamtal. Det är utmärkt att vi skapar en fristad mot den dekadenta borgarklassens splittringstaktik som tvingar proletära samer att välja mellan identiteter. Ändå vakar jag med revolutionär vaksamhet. Efter händelsen i Berlin inser jag åter att fienden – de homofascistiska trotskisterna och kapitalistis
