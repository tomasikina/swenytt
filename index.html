aper. Han kräver att barn ska få vara barn utan vuxnas ideologiska påtryckningar.", "trump": "Titta på det här, det är otroligt. Malmö-biblioteket fyller barnens hyllor med propaganda om killar som är tjejer och tjejer med snopp. Totalt galet! Den här läkaren Littorin har helt rätt, det är en skandal. De förstör våra barns hjärnor med lögner om biologi. Politiker som inte ens fattar vad en pojke och en flicka är – patetiskt! Låt barnen vara barn, inga fler vansinniga experiment. Make Sweden normal again!", "stalin": "Kamrater, jag har genomskådat denna perfida operation utförd av dekadenta borgarbrackor inom Malmös så kallade kultursektor. Dessa ideologiska sabotage mot arbetarklassens yngsta generation, där man med lögnaktiga bilderböcker försöker förvränga den objektiva biologins lagar, utgör en farlig kontrarevolutionär infiltration. Vi måste omedelbart rensa ut dessa fiender till folket, dessa könskonfusa parasitörer som önskar skapa en generation av osäkra, lättstyrda element. Inga kompromisser med verklighetsförnekarna – likvidera propagandan, skydda kollektivets framtid. Det är både nödvändigt och underhållande att se hur de tror sig kunna lura naturen själv."}, "date": "10 juli, 15:35", "url": "https://samnytt.se/lakaren-rasar-mot-bibliotekets-propagandahylla-pa-barnavdelningen-en-flicka-kan-inte-ha-en-snopp", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/10130628/bibliotek-5.jpg"}, {"type": "image-full", "heading": "Trumps börsportfölj går som tåget – slår index rejält", "summaries": {"normal": "Donald Trumps aktieportfölj har presterat betydligt bättre än S&P 500-index under hans andra mandatperiod, med en uppgång på 37,3 procent. Med över 21 000 aktieaffärer under 2025 väcks dock kritik gällande intressekonflikter, då experter menar att handelsaktiviteten krockar med hans politiska roll. Vita huset hävdar att oberoende förvaltare sköter portföljen, men etiska frågetecken kvarstår. Utöver aktier, där fokus ligger på AI-bolag, kommer stora delar av Trumps förmögenhet från kryptotillgångar.", "trump": "Alla säger att jag är den bästa investeraren någonsin, och siffrorna ljuger inte! Min portfölj krossar S&P 500 – totalt utklassad, en katastrof för dem! Media gnäller om 'intressekonflikter', men det är bara fake news från förlorare som är avundsjuka på min framgång. Jag har de bästa förvaltarna, de smartaste människorna, vi gör fantastiska affärer inom AI och krypto. Jag gör USA rikt igen, medan de svaga etikexperterna bara försöker stoppa vinnare. Vi vinner så mycket att man blir trött på att vinna!", "stalin": "Denna amerikanska kapitalist leker med siffror medan hans imperium ruttnar inifrån. Att samla på sig 'aktier' är ett tecken på borgerlig dekadens och moralisk upplösning. Han hävdar att oberoende förvaltare styr, men vi vet att detta är en lögn; det är parasiternas sätt att dölja korruption. Precis som den lille Putin i öster desperat försöker hålla ihop sitt sönderfallande revir, klamrar sig Trump fast vid sin krypto-valuta. Vi bör betrakta dessa 'AI-investeringar' som ett hot och snart nog konfiskera allt för folkets bästa."}, "date": "10 juli, 15:22", "url": "https://www.realtid.se/bors-finans/trumps-borsportfolj-gar-som-taget-slar-index-rejalt/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/sdlm12m9hdcrdc-normalhires-1.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Ny teknik minskar vattensvinn på campingar", "summaries": {"normal": "En ny teknik för realtidsövervakning av vattenförbrukning testas på campingplatser i Helsingborg, Mora och på Öland. Systemet upptäcker läckor snabbt och minskar svinn. Campingen Råå Vallar använder även sensorer i duschar och handfat. Gäster bidrar genom att rapportera läckor. Både personal och campare betonar vikten av att vara medveten om vattenanvändning för att spara resurser och hålla nere kostnader.", "trump": "Folk, vi har ett enormt vattensvinn på de där campingarna, det är en katastrof, en total katastrof. Men nu har de äntligen hittat en fantastisk, den bästa tekniken som bevakar vattnet minut för minut. Genialt! Inga fler läckor som rinner iväg pengar och resurser. De smarta campare vet hur man sparar, inte som de lata stadsborna. Vi älskar effektivitet, ingen mer slöseri under min administration – Amerika, och Sverige, kommer att spara stort. Fantastiskt!", "stalin": "Kamrater, jag ser den borgerliga campingsektorns desperata försök att kontrollera det folkets vatten genom dekadenta realtidsmaskiner. Denna imperialistiska teknik avslöjar läckor som klassfiendens sabotage. Vi ska utrensa alla sådana slöserier från sovjetiskt, nej, från kollektivets synvinkel. Gästerna rapporterar läckor – utmärkt partivaksamhet. Men akta er, kapitalistmaffians vattenräkningar döljer bara folkets sanna fiender. Inga läckor undgår ledarens blick."}, "date": "9 juli, 08:04", "url": "https://www.tv4.se/artikel/1XjvThHdwuZ3PDcOTrZKaS/ny-teknik-minskar-vattensvinn-pa-campingar", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2nOsgbFlKsqSnXLrc2LZ23%2Fb8a0e1855686d9bbea8953866c642359%2F15-camping.jpg&width=120"}, {"type": "image-right", "heading": "Nya attacker mellan USA och Iran – andra natten i rad", "summaries": {"normal": "USA och Iran har för andra natten i rad utväxlat attacker i Mellanöstern. Amerikanska styrkor slog mot runt 90 mål i Iran, bland annat i Bandar Abbas, Kanarak och Chabahar. Iran svarade med drönare och robotar mot Kuwait, Bahrain och Qatar. President Trump varnar för ytterligare upptrappning och kallar attackerna vedergällning för iranska aktioner mot fartyg i Hormuzsundet. Båda sidor anklagar varandra för att ha brutit en tidigare vapenvila.", "trump": "Vi slog till hårt mot de galna iranierna igen, precis som jag lovade. Explosioner överallt, de ringer och ber om nåd nu. Biden lät dem bli helt okontrollerade men nu är det slut på det. Hormuzsundet öppnas bara när jag säger det, inte genom deras svaga hot. De är avskum, totala förlorare. Om de gör om det blir det mycket, mycket värre. Amerika är tillbaka, starkare än någonsin.", "stalin": "Vi har i natt återigen slagit mot de imperialistiska fienderna som vågar utmana folkets vilja. Deras fega drönare och borgarbrackornas robotar avslöjar bara den svaga kapitalistmaffians desperation. Jag ler mörkt åt deras patetiska vedergällning mot egna fartyg. Hormuzsundet tillhör inte era exploaterande byfånar. Fortsätter de flaxa omkring skall vi rensa ut alla folkfiender som gömmer sig bakom falska avtal. Staten segrar."}, "date": "9 juli, 08:00", "url": "https://www.tv4.se/artikel/010JnLkqbbn8PaTGkn3fay/usa-inlett-nya-attacker-mot-iran", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3ktflJT78wNXLYh9a1MyRa%2Fd49d1b7b5a20efd95190551e60d15720%2Ftrump_x.jpg&width=120"}, {"type": "text", "heading": "Fem punkter från Natotoppmötet", "summaries": {"normal": "Vid Natotoppmötet i Ankara uttryckte Donald Trump initialt skarp kritik mot Spanien, men betonade senare enigheten inom alliansen. Mötet fokuserade även på hot mot Iran, där Trump aviserade nya möjliga anfall. Ukraina fick löften om licens för att producera Patriot-system, och Nato-länderna bekräftade sitt kollektiva försvar samt ett nytt militärt stödpaket till Ukraina på 70 miljarder euro för 2026.", "trump": "Vilket fantastiskt möte! Jag gick in och sa sanningen om Spanien – de betalar inte vad de borde, en total katastrof. Men sen blev det stor kärlek, vi är enade! Jag berättade för Zelenskyj att han ska få bygga våra fantastiska Patriot-missiler, det blir enormt för Ukraina. Iran? De vet vad som väntar om de inte skärper sig. Vi har kontroll, vi är starkast, och vi gör Nato stort igen. Ingen gör det bättre än jag!", "stalin": "Dessa västerländska marionetter dansar i Ankara, svängande mellan hat och falsk kärlek. Trump, den oberäknelige kapitalisten, skäller på Spanien men levererar vapenteknologi till Ukraina för att provocera vår ryska sfär. Vi betraktar detta med kalla ögon. Att ge Ukraina Patriot-system är en desperat handling av en döende hegemoni. Må dessa lakejer i Nato fortsätta sin teater; vi förbereder oss i tystnad, medan deras '70 miljarder' snart blir aska under vår obevekliga statliga tyngd."}, "date": "8 juli, 17:02", "url": "https://kvartal.se/nyheter/artiklar/trump-om-natomotet-fantastiskt/cG9zdDoxNDM0NTM"}, {"type": "image-right", "heading": "Tuva, 17, kör hemtjänst i sin epa. ”Det är jättekul.”", "summaries": {"normal": "Sju epa-ungdomar i Vårgårda avlastar hemtjänsten i sommar genom att köra runt och hjälpa äldre med promenader, inköp och sociala samtal. Tuva, 17, kör sin Volvo V70 och spelar norsk epa-dunk, medan Elna, 16, uppskattar att det är roligare än arbete på äldreboende. Projektet startade efter ett medborgarinitiativ och trots initial skepsis gör ungdomarna nytta. Lönen på 100 kronor i timmen plus milersättning går ofta till bildetaljer eller sparande till en artonårsbil.", "trump": "Helt fantastiskt, det här med epa-bilarna i Sverige. Unga killar och tjejer, de älskar att köra sina gamla Volvor och Saabar, och nu hjälper de de gamla istället för att bara hänga. Mycket socialt, promenader, inköp – och de spelar epa-dunk! De gör ett bättre jobb än många proffs, sägs det. Ingen vårdutbildning behövs, bara vilja och bra fordon. De tjänar lite pengar till nya detaljer på bilarna. Smart, väldigt smart. Sverige borde göra mer sånt här, tro mig.", "stalin": "Kamrater, se hur det folkliga initiativet från en sjuksköterska blomstrar under vår kollektiva omsorg! Jag har personligen noterat hur dessa epa-ungdomar, vägrade av borgarbrackornas dekadenta skola, nu uträttar storverk åt de åldrande arbetarna. De rensar ensamhetens kontrarevolutionära gift med promenader och inköp medan de kör sina fordon mot klassfiendens isolering. Initial skepsis från den fasta personalen var naturligtvis sabotage från kapitalisternas dolda agenter. Nu likviderar vi den med praktiska resultat. Lönen går till fordonens förstärkning – en dialektisk seger mot ensamhetens trotskistiska konspirationer. Mycket underhållande."}, "date": "10 juli, 09:02", "url": "https://arbetet.se/2026/07/10/tuva-17-kor-hemtjanst-i-sin-epa-jattekul/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/09105836/8tG3guz9FXw-epa_05_D3A9325.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Inflationen ner till 1,3 procent – men bolånet kan ändå bli dyrare", "summaries": {"normal": "Inflationen i Sverige sjunker till 1,3 procent i juni enligt KPIF, lägre än i maj. Nedgången drivs främst av lägre mat- och resepriser samt tillfälligt halverad moms på mat. Underliggande inflation är mycket låg, men Riksbanken varnar för framtida uppgång när momsrabatten upphör och energipriser stiger. Detta kan leda till räntehöjning istället för sänkning, vilket påverkar bolånetagare, börsbolag och hushåll negativt.", "trump": "Folk, ni tror att inflationen är under kontroll? Det är en total bluff! De halverar momsen på mat och låtsas som att allt är fantastiskt, men så fort rabatten försvinner exploderar priserna igen. Riksbanken snackar om räntehöjning – precis som de inkompetenta globalisterna gör. Mina fantastiska tullar och Amerika först-politik hade fixat det här på nolltid. Nu blir era bolån dyrare, fastighetsbolagen rasar – en katastrof, tro mig!", "stalin": "Kamrater, denna så kallade inflationsnedgång är blott en listig manöver från borgarbrackorna för att maskera den underliggande utsugningen av folket. Halverad moms är en tillfällig illusion skapad av kapitalistmaffian. När den försvinner och energipriserna stiger skall vi se den verkliga klassfiendens ansikte. Riksbanken, dessa folkfiender, förbereder redan räntehöjningar för att ytterligare plundra arbetarklassen. Vi skall rensa ut dessa exploaterande byfånar med järnhand."}, "date": "10 juli, 15:44", "url": "https://www.dagensps.se/privatekonomi/inflationen-ner-till-13-procent-men-bolanet-kan-anda-bli-dyrare/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/maskininlarning-i-hedgefonder-1-13.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "”Count Binface” – soptunnan utmanar Farage i fyllnadsvalet", "summaries": {"normal": "Nigel Farage har avgått som parlamentsledamot för Clacton-on-Sea i protest mot korruptionsanklagelser som han nekar till. Detta utlöser ett fyllnadsval den 13 augusti där han själv ställer upp. Flera stora partier avstår från att delta, vilket gör att den ende motståndaren är komikern Count Binface, utklädd till en soptunna. Hans medverkan ses som satirisk tradition för att belysa politikens absurditet. Mycket står på spel för Farage, som riskerar förödmjukelse om Binface får många röster.", "trump": "Det här är ett totalt fiasko för Nigel Farage, folk älskar mig men honom? Han hoppar av som en förlorare och tvingar fram ett val mot en kille utklädd till soppa. Patetiskt! De stora partierna springer och gömmer sig medan en skräpkorg utmanar honom. Det är ett desperat trick som kommer sluta i stor förödmjukelse. Folket ser igenom etablissemanget, men att förlora mot en soptunna? Det är verkligen lågt, tro mig.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna fega borgarbracka Farage i sin panik tvingar fram ett skenval mot en dekadent soptunna som maskerar sig som opposition. Vi ser tydligt den kapitalistiska parasitens desperata manövrar för att undvika utrensning från folkets domstol. Fem partier flyr som råttor inför sanningen. Låt den satiriska avskrapan rösta fram sin egen undergång. Inga borgare undkommer historien, inte ens om de gömmer sig i en tunna. Det blir en vacker likvidering av illusionerna."}, "date": "10 juli, 15:23", "url": "https://www.svt.se/nyheter/utrikes/count-binface-soptunnan-utmanar-farage-i-fyllnadsvalet", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.28/0.4/f24c0d74d9b0f16fa237d507c04d6a1dce52bb190ee93c39c5be63c266523d65"}, {"type": "image-right", "heading": "Vänsterpartist åtalas för att ha tagit SD-material", "summaries": {"normal": "En vänsterpartist i Gävle åtalas för att ha tagit Sverigedemokraternas valmaterial ur postfack på ett gruppboende. Mannen erkänner egenmäktigt förfarande men förnekar intrång i förvar. Händelsen filmades och materialet kom från tomma lägenheter. Gävle kommun är målsägande. Partiet har spärrats från att dela ut material i fastigheterna efter incidenten.", "trump": "Kan ni tro det här? En vänsterpartist i Sverige, total katastrof förresten, stal valmaterial från Sverigedemokraterna – ett parti jag inte ens känner till men som säkert är fantastiskt! Han säger att han inte minns varför han tog två, typiskt. Polisen frågar om han inte fattade att det var brottsligt. Nej, han fattade inte, för han är uppenbarligen inte särskilt smart. Sverige, fixa det här, det är pinsamt!", "stalin": "Kamrater, ännu en seger för folkets rättvisa! En degenererad borgerlig lakej från det så kallade 'Vänsterpartiet' har avslöjats som en ynklig tjuv av fascistiskt propagandamaterial. Vi har bevismaterial – övervakningsfilmer! – som visar hur denna lilla sabotör, med händerna darrande av skuldmedvetande, plundrade postfacken som en kapitalistisk hyena. Gävle kommun, vår trogna allierade i kampen mot reaktionära krafter, står nu som målsägande. Partiet har redan straffats – deras nycklar är indragna, precis som vi drar in fiendens territorium. Låt detta vara en varning till alla som försöker smutskasta folkets vilja!"}, "date": "10 juli, 15:00", "url": "https://bulletin.nu/vansterpartist-atalas-for-att-ha-tagit-sd-material", "imageUrl": "https://cdn.bulletin.nu/articles/28eae47c-707a-497a-a457-9c1295da8f05/preview.jpg?t=1783684095000"}, {"type": "image-right", "heading": "Kris i Norge inför VM-matchen – ber Sverige om hjälp", "summaries": {"normal": "Norge står inför en kris inför VM-kvartsfinalen mot England på lördag. Efter succén mot Brasilien vill många kommuner och företag visa matchen på storbildsskärmar, men skärmarna är nästan slut i hela landet. Norska företag har vändt sig till grannländer som Danmark och Sverige för att hyra in extraskärmar. Svenska bolag som Scenkonsult och Medialed har kontaktats, men det är osäkert om tillräckligt många skärmar kan levereras i tid.", "trump": "De norska killarna vinner stort i VM, slår Brasilien och nu ska de möta England, men plötsligt ingen har skärmar kvar. Hela landet skriker efter stora TV-skärmar och de ringer till Sverige och ber om hjälp. Patetiskt! De borde ha planerat bättre, men jag säger alltid att man måste vara smart. Sverige har ju också VM-feber, så lycka till med att få tag i de där skärmarna, norska vänner. Det blir en fantastisk match ändå.", "stalin": "Kamrater, detta är en skam för det norska folkets kollektiva seger över brasilianska imperialister. Borgarbrackorna och kapitalisterna har låtit skärmarna ta slut, en tydlig sabotagehandling från reaktionära krafter som vill hindra massornas folkfest. Jag har redan beordrat utredning och utrensning av dessa fiender till arbetarklassen. Vi vänder oss till svenska kamrater för förstärkning, men akta er för dolda trotskister bland skärmleverantörerna. Matchen skall visas, annars blir det likvidering av ansvariga."}, "date": "10 juli, 15:16", "url": "https://www.svt.se/sport/artikel/kris-i-norge-infor-vm-matchen-ber-sverige-om-hjalp", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.71/0.4/0defad1df66acf52c44b0b71a7eb0f7d7f0a36d2895d1814fa9348aa8e06083c"}, {"type": "image-right", "heading": "Tror Tidögänget att föräldrar är dumma i huvudet?", "summaries": {"normal": "Arbetets ledarskribent Hanna Östeby kritiserar Tidöpartiernas utredning om språkförskolan. Förslagen om mindre barngrupper, högre personaltäthet och bättre språkstöd är bra, men finansieringen genom att avskaffa flerbarnstillägget och sänka föräldraförsäkringen från 80 till 67 procent drabbar barnfamiljer hårt. En undersköterska med normal lön skulle förlora omkring 5 000 kronor i månaden. Författaren menar att regeringen underskattar föräldrars intelligens och att förslaget riskerar att bli en omvänd omfördelning från vanliga familjer till politikens vallöften.", "trump": "Folk, det här är en total katastrof. Tidögänget tror att föräldrarna är idioter, totala losers. De lovar gullig språkförskola men tar pengarna från barnbidrag och föräldraledighet, tusentals kronor borta varje månad. Mamma och pappa ska betala notan medan de rika skidåkare i Chamonix skrattar. Det är klassisk fake politics, ger med ena handen och stjäl med den andra. Sveriges föräldrar är smarta, de ser bluffen. Kastar ni inte ut det här förslaget i sophögen förlorar ni stort, tro mig.", "stalin": "Kamrater, detta är en motbjudande sabotagehandling från de dekadenta borgarbrackorna i Tidögänget. Med sina falska löften om likvärdighet försöker de lura arbetarfamiljerna på deras rättmätiga stöd, en listig utrensning av klassmedvetandet genom att stjäla från flerbarnstillägg och föräldraförsäkring. Vi ser hur kapitalisterna i Chamonix fortsätter frossa medan folket blöder. Jag, som ledare för det kollektiva, kräver att detta kontrarevolutionära finansieringsförslag omedelbart likvideras och slängs i historiens soptunna, annars ska vi rensa ut alla som tror att Sovjetföräldrar är dumma i huvudet. Ha!"}, "date": "10 juli, 06:54", "url": "https://arbetet.se/2026/07/10/tror-tidoganget-att-foraldrar-ar-dumma-i-huvudet/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/10065232/barn-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Asbest upptäckt i Vattenfalls vindkraftverk", "summaries": {"normal": "Vattenfall har upptäckt asbest i nödbromssystemet till servicehissar i vindkraftverket South Kyle Wind Farm i Skottland. Materialet, som levererats av underleverantörer, är inkapslat och bedöms inte utgöra någon akut hälsorisk under normal drift. Sanering pågår med specialiserade entreprenörer enligt strikta regler. Artikeln lyfter att liknande fall förekommit i Sverige och kritiserar den gröna omställningens bristande miljöhänsyn. Asbest har varit förbjudet i Sverige sedan 1982.", "trump": "Folk, ni kommer inte tro det, men den här gröna bluffen med vindkraft är en total katastrof! Asbest överallt i Skottland, precis som i Sverige. De skyndade sig så fort med sin hysteriska omställning att de glömde grundläggande säkerhet. Typiskt för de gröna fanatikerna och deras kvotergalna vänner. Jag visste det hela tiden. Vi behöver riktig energi, inte den här farliga skiten som Biden älskade. Patetiskt!", "stalin": "Kamrater, denna asbest i de borgerliga vindkraftverken blottar den imperialistiska omställningens falska ansikte. Jag ser hur klassfiendens exploaterande byfånar offrar arbetarnas lungor på altar av snabb profit. Vi ska rensa ut dessa folkförtryckartroll och deras inkapslade lögner. Sanering är nödvändig, men den gröna hysterin är blott en ny mask för kapitalistmaffians brott mot folket. Inga ursäkter skall tolereras."}, "date": "7 juli, 13:01", "url": "https://www.affarsvarlden.se/kronika/asbest-upptackt-i-vattenfalls-vindkraftverk"}, {"type": "image-right", "heading": "Philippe kan hjälpa unga killar från grov kriminalitet", "summaries": {"normal": "Philippe Arias Santana arbetar som kontaktperson på heltid och hjälper unga killar i riskzonen för kriminalitet att välja rätt väg. Han bygger förtroende genom samtal, egna erfarenheter och vardagliga möten som kebab och lunch. Trots att ungdomar idag mår sämre på grund av sociala mediers press på perfektion, ser han sitt arbete som viktigt både för samhället och för egen skull. Han fungerar som en förebild som får ungdomarna att tänka efter innan de gör fel.", "trump": "Det här är en fantastisk kille, Philippe, en riktig vinnare. Han tar unga grabbar som håller på att hamna i den värsta kriminaliteten och vänder dem till riktiga vinnare istället för förlorare. Inga fler sociala medier som gör dem deprimerade och svaga, han ger dem styrka och ansvar. Jag älskar det! Han är som en storbror, en förebild. Om fler gjorde som han skulle vi ha färre brottslingar och mer vinnare i Sverige. Fantastiskt jobb, Philippe, du gör landet stort igen.", "stalin": "Kamrater, jag ser hur denna Philippe Arias Santana med järnhand kämpar mot den borgerliga individualismens gift som sprids via de kapitalistiska sociala mediernas lögnaktiga maskineri. Dessa unga arbetarklassens söner står på tröskeln till kontrarevolutionär brottslighet, men jag, genom honom, ger dem en proletär förebild och rensar ut dekadensen ur deras själar. Det är en njutning att likvidera den borgerliga perfektionspressen som gör dem till svaga offer för imperialismens paranoia. Fortsätt arbetet, kamrater – staten belönar sådana som inte sviker kollektivet."}, "date": "10 juli, 06:00", "url": "https://arbetet.se/2026/07/10/fritidsledaren-philippe-stottar-unga-killar-fran-att-hamna-snett-ger-dem-en-forebild/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/02150512/zbD38fzog9A-PhilippeAriasSantana_03.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=750&h=1000&fp-x=0.66&fp-y=0.35"}, {"type": "image-full", "heading": "Lågprisflygbolaget köps ut från börsen – men av vem?", "summaries": {"normal": "Det brittiska lågprisflygbolaget Easyjet står inför en historisk förändring då två amerikanska riskkapitalbolag, Apollo och Castlelake, tävlar om att köpa ut företaget från Londonbörsen. Styrelsen lutar åt Apollos bud på 74 miljarder kronor. Flygbolaget, som revolutionerade marknaden 1995 med sin lågkostnadsmodell, har på senare år skiftat fokus mot affärsresenärer och större flygplatser. En försäljning till en europeisk flygkoncern bedöms som osannolik på grund av konkurrensregler.", "trump": "Easyjet, ett flygbolag som en gång var fantastiskt, säljs nu ut. Tragiskt! De blev utkonkurrerade av Ryanair och gjorde stora misstag. Nu vill amerikanska grabbar från Apollo ta över – mycket smart, de vet hur man tjänar pengar! Jag har alltid sagt att man måste vara bäst, och Easyjet har tappat stilen. De försökte vara fina med affärsresenärer, men glömde bort vad som gör ett bolag stort. USA vinner igen, precis som vanligt. De behöver en vinnare som leder dem!", "stalin": "Detta brittiska luftfartsorgan har förfallit i kapitalismens dekadenta händer. De säljer ut sitt arv till amerikanska spekulanter för 74 miljarder kronor – ett bevis på hur västvärlden säljer sin egen själ. De försökte pressa priser, men slutade som slavar under marknadens nycker. Om det varit i vårt rike hade dessa direktörer redan ställts inför rätta för förräderi mot folkets resor. Liksom vår vän i Kreml förstår vi att kontroll är allt. Privata budgivare är bara parasiter som förtjänar en enkelbiljett till Sibirien."}, "date": "10 juli, 13:48", "url": "https://www.realtid.se/bors-finans/lagprisflygbolaget-kops-ut-fran-borsen-men-av-vem/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/sdl6mmhnillhh8-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Krönika Efter sju år återupptas nu handelssamtalen mellan EU och Kina.", "summaries": {"normal": "EU och Kina har återupptagit handelsförhandlingar på ministernivå efter sju år. Europas industri lider av ett rekordstort handelsunderskott med Kina på över en miljard euro per dag. Bilföretag som Volkswagen tvingas till massiva nedskärningar på grund av kinesisk konkurrens från bland annat BYD. EU diskuterar nya verktyg mot subventionerad kinesisk export och beroenden, medan Kina vill dra ut på tiden och hotar med motåtgärder.", "trump": "Europa håller på att blöda ihjäl, folks, och det är Kinas fel! De översköljer er med billiga grejer, precis som de gjorde med oss innan jag fixade det. Volkswagen sparkar ut 100 000 arbetare – en katastrof! Jag sa ju det, de kinesiska bluffbilarna tar över. Er så kallade ledare är svaga, naiva förlorare som låter kommunisterna vinna. Jag skulle ha slagit till med tullar direkt, inte snackat i sju år. Amerika först, alltid!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur den europeiska borgarklassen nu skördar frukterna av sin egen girighet. Dessa kapitalistmaffians blodsugare har låtit kinesiska imperialister översvämma marknaden med subventionerat skräp och skapat ett handelsunderskott som liknar en öppen blödning. Volkswagen likviderar fabriker och arbetare – en vacker utrensning av den svaga överklassen. Vi, partiet, ler i skuggan medan fienderna splittras. Fortsätt dialogen, era naiva folkförtryckartroll, medan historien dömer er."}, "date": "7 juli, 09:09", "url": "https://www.affarsvarlden.se/kronika/jojje-olsson-europas-industri-bloder-aterupptar-samtal-med-kina", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/02/jojje-olsson-e1697531391221-200x141.jpg"}, {"type": "image-right", "heading": "Pensionär rånades i trapphuset av afrikaner – granne larmade polis: ”Han vågade inte gå hem”", "summaries": {"normal": "En pensionär rånades i trapphuset på Östgötagatan i Stockholm av fyra personer i 20-årsåldern som han beskriver som afrikaner. De hade bett att låna hans mobiltelefon och sprang sedan iväg med den. Grannen vågade inte gå hem förrän polisen kom. Boende i fastigheten vittnar om återkommande problem med obehöriga som skräpar ner, dricker och begår brott. John, som bor i huset, efterlyser skärpta åtgärder mot kriminaliteten som han menar sprider sig från förorter till innerstan.", "trump": "Det är en total katastrof, folk! En stackars gammal svensk pensionär med krycka blir rånad i sitt eget trapphus av ett gäng afrikaner som dricker öl och stjäl telefoner. De springer runt som vilda djur på Södermalm, precis som i de usla förorterna. Polisen kommer, tar en anmälan och gör inget. De är för svaga! Vi behöver tuffare lagar, ut med de kriminella omedelbart. Sverige har blivit för civiliserat och vänstern blundar. Make Sweden Safe Again!", "stalin": "Kamrater, jag ser hur de kapitalistiska resterna och de afrikanska lumpenproletära elementen infiltrerar arbetarklassens bostäder på Södermalm för att begå sabotage mot folkets trygghet. Dessa degenererade element, dessa parasitiska ölburksbärare och mobilrånare, utgör en kontrarevolutionär fara som måste bekämpas med järnhand. Vi ska rensa ut dessa borgarbrackornas nyttiga idioter och deras skyddslingar. Den som urinerar i trapphuset förtjänar en kreativ utrensning. Vårt kollektiv kräver ordning – annars likviderar vi problemet permanent med ett leende."}, "date": "10 juli, 14:00", "url": "https://samnytt.se/aldre-man-ranades-i-trapphuset-pa-sodermalm-av-afrikaner-granne-larmade-polis-han-vagade-inte-ga-hem", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/08112216/Toppbild1-3.jpg"}, {"type": "image-full", "heading": "Miljardindustrin vänder efter mörka år: \"Fantastisk tid\"", "summaries": {"normal": "Biotechsektorn går mot en ljus framtid enligt veteranen Douglas Williams. Genom att integrera AI i läkemedelsutvecklingen och dra nytta av framsteg inom neurologi och bilddiagnostik väntas branschen nå nya höjder. Trots denna optimism varnar Williams för att amerikansk politisk osäkerhet och minskade anslag till grundforskning riskerar att hämma USA:s konkurrenskraft och innovationstakt framöver.", "trump": "Biotech är enormt, vi pratar om fantastiska saker. Douglas Williams säger att AI kommer att förändra allt – det är en vacker teknologi, tro mig. Men de vänsterliberala i USA förstör vår forskning och skär ner på pengar. Det är en total katastrof! Jag kommer att se till att vi vinner stort igen. Vi ska ha de bästa läkemedlen, de bästa forskarna, och vi ska dominera världen. Ingen gör biotech bättre än USA under mitt ledarskap!", "stalin": "Kamrater, vi ser nu hur bioteknikens nycklar faller i händerna på dekadenta västmakter. AI används för att analysera data, men vem analyserar AI:n? Vi misstänker att de döljer sina verkliga intentioner bakom 'precisionsmedicin'. Liksom vår lojala allierade Putin krossar oppositionen i öst, måste vi rensa ut de byråkratiska sabotörerna i våra egna laboratorier. Om USA vacklar på grund av sin politiska svaghet, är det vår plikt att absorbera deras kunskap och tvinga vetenskapen att tjäna Folkets vilja."}, "date": "10 juli, 13:26", "url": "https://www.realtid.se/bors-finans/miljardindustrin-vander-efter-morka-ar-fantastisk-tid/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/sdlartla0gupsa-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Zelenskyj: Kinas ultimatum till Ryssland", "summaries": {"normal": "Volodymyr Zelenskyj uppger att Kina har varnat Ryssland mot att ens överväga användning av kärnvapen mot Ukraina, närmast i form av ett ultimatum. Uttalandet kom efter samtal med Donald Trump vid Natos toppmöte i Turkiet. Zelenskyj nämner att flera europeiska ledare också rapporterat om starka kinesiska reaktioner på ryska kärnvapendiskussioner. Kinas roll i konflikten beskrivs som allt hårdare mot Ryssland. Mötet resulterade även i en Natodeklaration om omfattande militärt stöd till Ukraina.", "trump": "Folk, ni skulle ha hört det här – Zelenskyy kommer till mig i Turkiet och babblar om att Kina har gett Putin ett jätteultimatum: inga kärnvapen, annars är det kört. Kina! De röda kapitalisterna hatar svaga förlorare som den gamle Biden lät löpa. Nu är jag tillbaka och vi snackar affärer, inte identitetspolitik och regnbågsflaggor. Europa kommer krypande och säger att Kina äntligen vaknat och sparkar Putin i arslet. Fantastiskt, det blir inga kärnvapen, bara seger, mina vänner!", "stalin": "Kamrater, jag noterar med stor tillfredsställelse hur den kinesiska ledningen rensar ut alla tankar på kärnvapen hos de ryska kamraterna. Dessa västerländska folkfiender och imperialistiska blodsugare försöker med sina hysteriska provokationer splittra den eurasiska intressesfären, men de kommer att krossas under historiens obevekliga hjul. Ukrainas fientliga hinder mot den ryska statens legitima mål är patetiska. Min värdige efterträdare i Kreml förstår att styrka är det enda språket kapitalistmaffian respekterar. Segraren skriver protokollet."}, "date": "10 juli, 14:51", "url": "https://www.dagensps.se/varlden/zelenskyj-kinas-ultimatum-till-ryssland/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdljscgknurfrw-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Kravaller i Europa när Marocko slås ur VM", "summaries": {"normal": "Frankrike besegrade Marocko med 2–0 i fotbolls-VM, vilket ledde till kravaller bland marockanska supportrar i flera europeiska städer. I London blockerades trafiken, en polis skadades av en glasflaska och fyra personer greps. Liknande våld utbröt i Düsseldorf där tre poliser skadades, samt i Amsterdam, Rotterdam och Haag. Paris klarade sig med stora polisinsatser utan större oroligheter.", "trump": "De vann, de förlorade, men sen blir det kaos på gatorna i Europa. Marockaner som rasar efter att Frankrike slog ut dem i VM, kastar flaskor och fyrverkerier på polisen. I London, Düsseldorf, Rotterdam – totalt misslyckande. Poliser skadade, folk gripna. De borde ha vunnit stort istället för att bråka. Sådana saker händer inte hos oss, vi har lag och ordning, tro mig.", "stalin": "Kamrater, se hur de dekadenta fotbollsfesterna avslöjar borgarbrackornas falska internationalism. När de marockanska elementen förlorade mot franska imperialister exploderade deras primitiva ilska i meningslösa attacker mot ordningsmaktens representanter i London, Düsseldorf och de holländska städerna. Vi skulle ha genomfört en grundlig utrensning av dessa reaktionära element redan vid gränsen. Tre skadade poliser? Skrattretande. Nästa gång rensar vi ut hela gatan med järnhand och lite munter paranoia."}, "date": "10 juli, 13:27", "url": "https://www.friatider.se/kravaller-i-europa-nar-marocko-slas-ur-vm", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-475.jpg"}, {"type": "image-right", "heading": "Slaget om Myanmar", "summaries": {"normal": "Kriget i Mellanöstern har ökat Myanmars strategiska betydelse för Kina, som strävar efter direkt tillgång till Bengaliska viken och Indiska oceanen. Under president Min Aung Hlaings besök i Beijing i juni undertecknades 18 avtal om säkerhet, handel och teknik. Kina importerar sällsynta jordartsmetaller och skyddar juntan mot internationell kritik. Myanmar hamnar i korselden mellan Kina, Indien och USA, vars politik under Trump präglas av lobbyism kring handel och resurser. Kinas ekonomiska korridor ses som vital för landets säkerhet och utveckling.", "trump": "Det här är ett totalt fiasko för de svaga globalisterna. Kina tar över Myanmar som ett billigt köpcentrum för sällsynta jordartsmetaller och en ny väg till Indiska oceanen medan vi sitter och tittar på. Min Aung Hlaing är en tuff general som byter uniform mot kostym, men han vet vem som ger de bästa dealsen. Jag stoppade det dumma biståndet till demokratiaktivister – bra jobbat. Nu handlar det om handel och att inte låta Kina vinna. Mina lobbyister i Washington fixar det, tro mig, det blir yuge.", "stalin": "Kamrater, detta är en öppen klasskamp där imperialismens lakejer kämpar om den burmesiska korridoren som en hungrig hund om ett ben. Jag, som ledare för det eviga kollektivet, ser hur borgarbrackorna i Washington och New Delhi konspirerar mot folkets intressen medan vi genom kloka påtryckningar på de nordliga rebellbanden tvingar fram eldupphör och ordning. Den farsartade generalen Min Aung Hlaing är bara en bricka i spelet. Vi ska likvidera alla kontrarevolutionära element som hotar korridoren, rensa ut de kapitalistiska parasiterna och säkerställa att de sällsynta metallerna tjänar arbetarklassen, inte de västerländska parasiterna. Paranoia? Nej, det är dialektisk verklighet."}, "date": "7 juli, 01:27", "url": "https://www.dagensarena.se/innehall/slaget-om-myanmar/", "imageUrl": "https://www.dagensarena.se/files/2026/06/min-aung-hlaing-300x157.jpeg"}, {"type": "text", "heading": "Analyshuset sänker biljätten", "summaries": {"normal": "SB1 Markets sänker riktkursen för Volvo Cars från 25 till 23 kronor inför nästa veckas kvartalsrapport. Analyshuset motiverar sänkningen med en väntat svag försäljning under andra kvartalet, där bilförsäljningen föll sex procent. Samtidigt har råvaru- och fraktkostnader fortsatt stiga. Vinstprognoserna för justerat ebit sänks med åtta procent. Rekommendationen hålls neutral med en bedömd uppsida på tolv procent. Volvo Cars har fallit 33 procent sedan årsskiftet.", "trump": "Folk, ni tror inte hur dåligt det går för Volvo Cars. Jag älskar bilar, fantastiska bilar, men de här killarna får ett riktigt svagt kvartal. SB1 sänker riktkursen till 23 kronor, och visst, det är en liten uppsida, men resultaten är sköra. De säljer färre bilar, kostnaderna skjuter i höjden, elbilar räcker inte. Jag skulle fixa det på en vecka, tro mig. Nu är aktien nere 33 procent i år. Patetiskt, men vänta bara på en bättre deal.", "stalin": "Kamrater, jag betraktar med djup misstro dessa kapitalistiska bilbyggare som Volvo Cars, vilkas så kallade kvartal hotar att bli en fullständig katastrof. SB1 Markets, dessa borgerliga spioner i finansens tjänst, sänker riktkursen till tjugotre kronor och avslöjar därmed den imperialistiska svagheten. Sex procents fall i försäljningen, stigande kostnader från råvaruplundrare och fraktparasiter – allt pekar på en fiende inom murarna. Jag skulle rensa ut dessa svaga ledare omedelbart och ersätta dem med pålitliga produktionskollektiv. Lågt ställda förväntningar? Nej, det är sabotage mot folkets framsteg. Skratta medan vi likviderar motvindarna."}, "date": "10 juli, 11:55", "url": "https://www.di.se/nyheter/sb1-om-volvo-cars-svagt-kvartal-vantar/"}, {"type": "text", "heading": "Jätteaffären: Nato vill köpa plan av Saab", "summaries": {"normal": "Nato har valt Saabs GlobalEye som alliansens nya luftburna övervakningssystem och inleder nu formella förhandlingar om ett köp av upp till tio flygplan. Beskedet presenterades av Nato-chefen Mark Rutte och statsminister Ulf Kristersson i Ankara. Affären innebär ett skifte från de tidigare amerikanska Boeing-planen till svensk teknik. Detta ses som en betydande framgång för svensk försvarsindustri, där även Kanada nyligen visat intresse för systemet som ett led i att stärka det kollektiva försvaret.", "trump": "Nato har precis valt svenskarnas GlobalEye, fantastiska flygplan, kanske de bästa. Det är en enorm vinst för Saab, riktigt duktiga människor! Men låt oss vara ärliga, vi gör de största och bästa affärerna i USA. Sverige är bra, Ulf är en trevlig kille, men när jag ser på hur Nato spenderar pengar så tänker jag att det är dags att de betalar sin rättvisa andel. Vi vinner alltid, vi gör de bästa avtalen, det vet alla!", "stalin": "Det svenska kapitalistiska flygplanet GlobalEye har blivit Natos nya leksak. Dessa lakejer till västalliansen försöker stärka sin övervakning vid våra gränser genom att byta ut gammal amerikansk skrot mot svensk teknologi. Ulf Kristersson hyllar sin industri, men vi vet att detta bara är ytterligare ett desperat steg i Nato-expansionen. Liksom den moderna tsar Putin ser vi deras manövrar i norr. Vi dokumenterar varje svekfullt avtal och ser till att de som hotar vår suveränitet får ångra sina val."}, "date": "7 juli, 09:28", "url": "https://kvartal.se/nyheter/artiklar/nato-koper-spaningsflyg-av-saab/cG9zdDoxNDIzNzc"}, {"type": "image-right", "heading": "Polisen hittade automatvapen under golvet – då började piloten prata om CIA", "summaries": {"normal": "Polisen hittade minst åtta skarpladdade vapen, bland annat en MP5-liknande kulsprutepistol, gömda under golvet i ett hemmagym i Karlsborg. En 80-årig helikopterpilot med kopplingar till Sverigedemokraterna, Israel och CIA åtalas för synnerligen grovt vapenbrott. Mannen påstår att vapnen placerats av utländska underrättelsetjänster och att fastigheterna ägs av ett amerikanskt bolag. Flera familjemedlemmar greps men släpptes senare.", "trump": "Kan ni fatta det här? En 80-årig helikopterpilot med CIA-kopplingar gräver ner vapen som en riktig patriot under golvet i sitt gym. Amerikanerna äger husen, säger han, och plötsligt är det ett stort brott? Fake news från vänstermedia! Under Biden blev allt kaos, nu fixar jag det. SD-knutna Trump-supporters – fina människor. Inga woke-röster eller kvotfeminister här, bara äkta råstyrka. Sad!", "stalin": "Jag betraktar denna vapengömma som ett tydligt bevis på klassfiendens dolda sabotage. Borgarbrackorna och imperialisterna gömmer sina verktyg för att undergräva folkets säkerhet. Den gamle piloten må tala om sina uppdragsgivare, men vi genomskådar alla försök till kontrarevolution. En utrensning av sådana folkfiender och deras hemliga gömställen är nödvändig för att skydda staten från inre förrädare. Skrattretande patetiskt."}, "date": "6 juli, 12:54", "url": "https://proletaren.se/artikel/polisen-hittade-automatvapen-under-golvet-da-borjade-piloten-prata-om-cia/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/vapen2-768x512.png"}, {"type": "image-right", "heading": "Engagerade sig för invandring - mördades av asylsökande pojkvän", "summaries": {"normal": "En 43-årig amerikansk kvinna, Jamey Carney, hittades mördad i sitt hem i Irland. Hennes 28-årige pojkvän, Ahmad Alsaqer, misstänks för brottet och har flytt till Turkiet. Carney engagerade sig för invandring och den palestinska frågan, och träffade Alsaqer vid en demonstration. Fallet har väckt debatt om migration och säkerhet, där vissa kritiserar aktivisters naivitet medan andra varnar för generaliseringar om invandrare.", "trump": "Tragiskt och helt sjukt vad som hände i Irland – en fantastisk kvinna, Jamey Carney, mördades av sin asylsökande pojkvän. Hon kämpade för invandring, och vad får hon? En kniv i ryggen, bokstavligt talat! Och nu flyr han till Turkiet, precis som jag sa skulle hända. Europa är en katastrof, öppet för vem som helst. Vi behöver starka gränser, annars kommer fler oskyldiga att offras. SAD!", "stalin": "En borgerlig aktivist, Jamey Carney, mötte sitt öde i händerna på en asylsökande parasit – ett tydligt exempel på västerländsk dekadens och naiv liberalism. Hon hyllade invandring, och vad blev belöningen? En kniv i hjärtat! Vi ser hur imperialistiska länder förlorar kontrollen. Turkiet och Jordanien skyddar nu denna fiende – men vi kommer att finna honom. Revolutionen tolererar inga svagheter!"}, "date": "10 juli, 13:00", "url": "https://samnytt.se/engagerade-sig-for-invandring-mordades-av-asylsokande-pojkvan", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/10081100/jamey-carney.jpg"}, {"type": "image-full", "heading": "Ica lägger ner – och satsar vidare", "summaries": {"normal": "Ica överger sitt husdjurskoncept Gaston som lanserades i oktober 2024. De tre butikerna i Uppsala, Västerås och Norrköping samt e-handeln säljs till Arken Zoo. Istället inleder Ica ett samarbete med kedjan för att placera husdjursbutiker nära sina matbutiker. Pilotprojektet gav värdefulla lärdomar om husdjurskundernas behov, och husdjursmarknaden förblir viktig för Ica-gruppen.", "trump": "Folk, ni skulle ha sett det här – Ica trodde de kunde slå de stora hund- och kattkillarna med sitt Gaston-skräp. Totalt misslyckande! Nu säljer de allt till Arken Zoo som en riktig vinnare. If you can’t beat them, join them, säger jag alltid. Smart drag. De borde ha lyssnat på mig från början istället för att leka affärsmän. Fantastiskt vad de lärde sig, eller hur? En katastrof undanröjd.", "stalin": "Kamrater, detta Gaston var en kapitulation inför borgarbrackornas marknadskrafter. Jag utvärderade piloten och såg fiendens klor i varje hylla. Nu överlämnar vi till Arken Zoo som en taktisk reträtt, men vi rensar ut svagheten. Ett långsiktigt partnerskap ska krossa de exploaterande djurhandlarna. Värdefulla lärdomar? Ja, att klassfiendens hundar alltid nafsar. Vi stärker kollektivet och likviderar misslyckandet med järnhand."}, "date": "10 juli, 14:11", "url": "https://www.dagensps.se/foretag/ica-lagger-ner-och-satsar-vidare/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdlgs8zubjyjy8-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Halland trött på Haaland – igen", "summaries": {"normal": "Erling Braut Haalands namnstavning skapar problem. Trots hans starka spel efter Norges seger mot Brasilien förväxlas efternamnet ofta med det svenska landskapet Halland. Visit Halland har återigen uppmanat medier och supportrar att stava rätt via ett öppet brev. Förväxlingarna började redan 2022 när Haaland slog igenom i Manchester City. Kvartsfinalen mot England spelas på lördag klockan 23.", "trump": "Folk kan inte ens stava namnet på den norske målkungen Haaland, de skriver Halland istället. Patetiskt! Visit Halland tvingas skriva brev som en förlorande byråkrat. Fake news och dålig journalistik överallt. Jag vann stort 2024, Biden var en katastrof, men det här är nästan lika illa. Stavningen är en total skandal, gör om och gör rätt annars blir det inga fler mål, tro mig.", "stalin": "Kamrater, jag ser hur den norska anfallarens namn förvrängs av den kapitalistiska propagandan och dess slarviga stavning. Visit Halland tvingas sända ut budskap som en partikommitté mot folkfienderna. Dessa borgarbrackor och klassfiender bland journalister och supportrar saboterar ordningen med sina felaktigheter. Vi kräver absolut korrekthet. Felstavning är ett hinder för folkets medvetande. Rensa ut slarvet innan det sprider sig som en parasit."}, "date": "10 juli, 13:57", "url": "https://www.gp.se/sport/halland-trott-pa-haaland-missen.a7296f1c-7daf-4c47-9044-333bb2e9eac0", "imageUrl": "https://www.gp.se/images/article/a7296f1c-7daf-4c47-9044-333bb2e9eac0/images/2uyNsi2YVxxpaR-cjyJQ_wA-GPUs-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Svensk camping mot rekordår. Tyskarna väller in", "summaries": {"normal": "Campingsäsongen i Sverige går mot ett nytt rekordår enligt Svensk Camping. Antalet turistnätter ökar, särskilt bland tyska och nederländska besökare som söker naturupplevelser. Tyska gästnätter har stigit med 25 procent på fyra år till 1,5 miljoner. Svenska gäster utgör fortfarande 75 procent medan tyskarna står för 8–9 procent. Målgruppen breddas med äventyrslystna utöver barnfamiljer och seniorer. Västra Götaland och Borgholms kommun toppar statistiken.", "trump": "Det här är helt fantastiskt, det största campingen någonsin i Sverige, tro mig. Tyskarna älskar det, de kommer i massor, upp 25 procent, och holländarna också. Svenskarna är fortfarande flest men vi tar över, vi gör det bättre än någonsin. Alla vill ha de underbara naturupplevelserna, ingen gör natur bättre än Sverige. Rekordbokningar, 69 procent säger att det är bättre än förra året. Fantastiskt, helt enormt!", "stalin": "Kamrater, detta är en lysande seger för den kollektiva viljan att erövra naturen mot de dekadenta borgarbrackornas hotellpalats. Jag ser hur de tyska och nederländska massorna i en sund, proletär ström flyr västerländsk dekadens för att söka äkta sovjetisk-inspirerad friluftsliv. De som envisas med att bara vara barnfamiljer eller passiva seniorer ska vi rensa ut ur statistiken. Låt fienderna inom Borgholms kommun och Västra Götaland vakta sig, ty varje miljon besökare är ett slag mot kapitalisternas parasitiska semesterindustri. Paranoia? Nej, bara sund planekonomi."}, "date": "10 juli, 11:10", "url": "https://www.di.se/nyheter/svensk-camping-mot-rekordar/", "imageUrl": "https://static.bonniernews.se/ba/ce30a4cc-db45-4379-af32-a83eb58db845.jpg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Googles gigantiska datahall kan ge elprischock", "summaries": {"normal": "Google planerar att bygga en av Europas största datahallar i Timrås industripark Torsboda för 911 miljoner kronor. Anläggningen kan komma att dra upp till 1 000 megawatt el, motsvarande tre Uppsala, och på sikt kanske det dubbla. Svenska kraftnät varnar för att elpriserna kan stiga kraftigt om inte ny elproduktion tillförs. Kommunerna hoppas på 500 nya jobb, men affären är inte klar och energifrågan väcker oro bland boende.", "trump": "Titta på det här, det är ett fullständigt katastrofscenario. Google, de smarta grabbarna, vill bygga ett jättelikt datacenter i Sverige som suger upp el som tre hela Uppsala. De älskar era låga elpriser i norr, men nu varnar till och med era egna kraftnät för att priserna kommer att explodera. Utan ny produktion blir det en elprischock. Jag skulle ha fixat det här direkt – Amerika först, men ni européer måste vakna innan de stora techbolagen äter upp allt.", "stalin": "Kamrater, denna amerikanska monopolkapitalistiska hydra vid namn Google vill suga musten ur vårt norrländska kraftverk med sin parasitiska datahall, en hungrig elefant som kräver el motsvarande tre förrädiska Uppsala. Utan att vi, partiet och arbetarna, omedelbart tillför nyproduktion kommer borgarbrackornas elpriser att stiga som en kontrarevolutionär feber. Den oro som breder ut sig bland folket är naturligtvis berättigad – vi måste rensa ut alla sabotörer som vägrar bidra med egen kraft. Femhundra arbetstillfällen? Det låter som propaganda från klassfiendens lakejer. Vi ska likvidera bristen på energi med järnhand och stålvilja, annars vinner de dekadenta imperialisterna."}, "date": "10 juli, 12:15", "url": "https://www.friatider.se/googles-gigantiska-datahall-kan-ge-elprischock", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-473.jpg"}, {"type": "text", "heading": "Zlatan: ”Borde aldrig ha fått ett rött kort”", "summaries": {"normal": "Fifa har valt att skjuta upp Folarin Baloguns avstängning efter ett rött kort i matchen mot Bosnien-Hercegovina, vilket gör honom spelklar till åttondelsfinalen mot Belgien. Beslutet har väckt stark kritik då uppgifter gör gällande att USA:s president Donald Trump påverkat Fifas ordförande Gianni Infantino. Zlatan Ibrahimovic har uttryckt stöd för beslutet och menar att det röda kortet var felaktigt från början. Belgien överväger nu att överklaga Fifas beslut till Idrottens skiljedomstol, Cas.", "trump": "Fifa gjorde äntligen rätt när de lät vår fantastiska stjärna Folarin Balogun spela! De försökte stoppa oss med ett falskt rött kort, en total häxprocess. Jag ringde Gianni Infantino, en mycket trevlig kille, och vi löste det. USA vinner alltid! Zlatan, en fantastisk vinnare, håller med mig. Belgien är sura, men de är bara svaga förlorare. Vi kommer att krossa dem ikväll. Det blir en enorm vinst för USA, den största någonsin!", "stalin": "Fifa, denna korrupta byråkratiska apparat, dansar efter Washingtons pipa. Att en president öppet dikterar sportens villkor avslöjar västvärldens moraliska förruttnelse. Balogun är blott en bricka i imperialisternas spel, likt marionetterna som nu hotar vår säkerhet i öst. Om Belgien dristar sig att söka rättvisa hos en så kallad skiljedomstol, bevisar det bara deras patetiska svaghet. Vi noterar dessa politiska påtryckningar och förstår nu tydligare fiendens natur. Historien kommer att döma dem alla som löjliga, historielösa narrar."}, "date": "6 juli, 17:34", "url": "https://kvartal.se/nyheter/artiklar/zlatan-borde-aldrig-ha-fatt-ett-rott-kort/cG9zdDoxNDIxNjg"}, {"type": "image-full", "heading": "Kallade tränaren för idiot: ”Kanske inte ska göra det”", "summaries": {"normal": "Under en träning med IFK Göteborg kallade mittfältaren Imam Jagne målvaktstränaren Lee Baxter för idiot och fick en högljudd utskällning. Dagen efter tonade Jagne ner incidenten som skedde i stundens hetta. Han betonade att det är vanligt med heta ord på planen och att parterna redan har rett ut saken. Huvudtränare Stefan Billborn ser det som en vanlig företeelse i fotbollsmiljö. Jagne har haft begränsad speltid denna säsong.", "trump": "Folk, ni skulle ha sett det – en idiot kallar sin tränare för idiot, sen får han skäll! Typiskt. Jag älskar det, heta känslor, ingen av dessa svaga snälla pojkar. Jagne säger att det händer hela tiden, att de vill mer. Klokt. Media rusar dit som galna, klickar för klickens skull. Precis som under Biden, allt för dramat. Men det är bra, det visar passion. Göteborg mot Malmö blir nog en riktig fight, ingen vill sitta på bänken som en förlorare.", "stalin": "I klasskampens hetta på planen avslöjade vi borgarbrackornas svaghet när en arbetare kallade sin övervakare för idiot. Jag rensar ut sådana fiender till kollektivet med järnhand, men här tonas det ner som en småborgerlig teater. Media, de folkfienderna, längtar efter splittring. Det sker ofta, säger han, och visar att viljan till seger lever. Vi ler mörkt åt detta. Träning är förberedelse för större utrensningar av svaghet. Kamrater, framåt mot segern."}, "date": "10 juli, 13:24", "url": "https://www.gp.se/sport/fotboll/ifk-goteborg/imam-jagne-om-braket-med-lee-baxter-pa-ifk-goteborgs-traning.f9492651-9b65-4eea-b13f-2a57658c725b", "imageUrl": "https://www.gp.se/images/article/f9492651-9b65-4eea-b13f-2a57658c725b/images/2bL1MYHBxuLP_PQH0Mxqna05-57U-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Aftonbladet normaliserar polishat – Magdalena Andersson måste välja sida", "summaries": {"normal": "Artikeln kritiserar Vänsterpartiets slagord ”Hela Malmö hatar polisen” under Prideparaden och Aftonbladets försvar av detsamma. Författaren menar att hat mot poliser underminerar rättsstaten och att poliser förtjänar respekt för sitt riskfyllda arbete mot gängkriminalitet. Magdalena Andersson uppmanas att ta tydlig ställning inför ett eventuellt regeringssamarbete med Vänsterpartiet. Kritiken betonar skillnaden mellan legitim polisgranskning och normalisering av hat.", "trump": "Folk, ni skulle se det här! Vänsterpartiet i Sverige skriker att hela Malmö hatar polisen under sin galna Prideparad och Aftonbladet, den sjuka fake news-tidningen, försvarar det. Totalt vansinne! Polisen kämpar mot gangsters medan dessa radikala HBTQ-aktivister och identitetspolitiska förlorare spyr hat. Magdalena Andersson borde sparka ut dem ur regeringen direkt. Sverige behöver lag och ordning, inte mer av detta woke-skräp. Patetiskt!", "stalin": "Kamrater, detta är en fientlig provokation från klassfiendens lakejer. Vänsterpartiets ramsa avslöjar folkförtryckartrollens sanna ansikte, medan Aftonbladets borgarbrackor normaliserar hat mot den folkets väktarmakt som upprätthåller ordningen. Jag kräver omedelbar utrensning av sådana element. Magdalena Andersson måste välja: antingen står hon med arbetarna eller med de exploaterande byfånarna. Inga halvmesyrer tillåts i kampen mot de parasitiska hatarna."}, "date": "8 juli, 13:00", "url": "https://samtiden.nu/2026/07/aftonbladet-normaliserar-polishat-magdalena-andersson-maste-valja-sida/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/740544292_1563153201827252_6631997080324834265_n-640x360.jpg"}, {"type": "text", "heading": "17-årig flicka död under franskt VM-firande – förare frihetsberövad", "summaries": {"normal": "En 17-årig flicka omkom i norra Frankrike efter att ha fallit från en lastbil under firandet av Frankrikes VM-seger mot Marocko. Lastbilen, som stått stilla, började plötsligt köra igen. Flickan föll och kördes över. Föraren, som misstänks ha varit berusad, greps. Sex minderåriga vittnen fanns på plats, varav en vårdades på sjukhus. En utredning pågår.", "trump": "Tragiskt, väldigt tragiskt – en ung flicka i Frankrike föll från en lastbil under ett helt galet VM-firande. Folk klättrar upp på bilar som om det vore en Disney-parad! Föraren? Berusad, naturligtvis. Frankrikes seger blev plötsligt en mardröm. Jag säger alltid: fira, men gör det säkert! Annars blir det kaos, och kaos är inget jag gillar. Synd om flickan, men någon borde ha stoppat det här vansinnet tidigare.", "stalin": "En sorglig men förutsägbar händelse i det dekadenta Västeuropa. En ung flicka offras på kapitalismens och fotbollshuliganernas altare. Lastbilschauffören, en typisk representant för den borgerliga moralens förfall, var berusad – precis som hela den franska staten. Vi noterar att sådana olyckor aldrig inträffar i Ryssland, där ordning och disciplin råder. Låt detta vara en varning till alla som låter sig förblindas av västerländskt vansinne. Utredningen kommer att visa sanningen – och den kommer inte att vara vacker för fienden."}, "date": "10 juli, 12:01", "url": "https://bulletin.nu/17-arig-flicka-dod-under-franskt-vm-firande-forare-frihetsberovad"}, {"type": "image-right", "heading": "Christoffer Jonsson: Storbritannien är ett skräckexempel", "summaries": {"normal": "En skandal i Storbritannien har väckt stark kritik mot polisen efter att en man knivhöggs och polisen misstänktes för att prioritera hatbrottsmisstankar framför livräddning. En granskning i The Spectator belyser inflytandet från National Association of Muslim Police, som förespråkar särbehandling av muslimska misstänkta och vill omdefiniera begrepp som sionism och islamistisk terrorism. Kritiker ser det som tecken på politisk islams ökande makt och växande antisemitism, även på politisk nivå.", "trump": "Folk, ni skulle inte tro det, men Storbritannien har blivit ett totalt skräckexempel under de korkade ledare som kom efter mig. Polisen bojar en stackars kille som ligger och blöder ihjäl för att de är rädda för att kalla det fel sak. Muslimska polisföreningar styr showen, kallar IDF för terrorister och vill ta bort ordet islamistisk terrorism. Det är galet! Biden sov sig igenom det här, men jag ser det klart: woke-knäcket har förstört landet. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup misstro hur den brittiska polisen har låtit sig infiltreras av religiösa fanatiker och klassfiender. Dessa muslimska polisföreningar kräver särskild behandling för sina egna medan de kallar sionism för hat och IDF för terrorister. De vill utrensa ordet islamistisk terrorism ur statens vokabulär. Detta är ett klassiskt exempel på hur borgarbrackor och folkförtryckartroll undergräver arbetarklassens ordning. Vi måste rensa ut sådana element innan de förgiftar hela samhället. Föraktligt."}, "date": "8 juli, 09:00", "url": "https://samtiden.nu/2026/07/christoffer-jonsson-storbritannien-ar-ett-skrackexempel/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/arvi-640x360.png"}, {"type": "image-right", "heading": "Jonsson: SVT:s okritiska bevakning av Khameneis begravning", "summaries": {"normal": "SVT:s bevakning av ayatollah Khameneis begravning i Teheran kritiseras för att vara okritisk. Korrespondenten intervjuade inga regimkritiker och ifrågasatte inte regimens uppgifter om deltagarantalet. Experter menar att siffrorna överskattats, medan källor på plats rapporterar om låg uppslutning. SVT:s rapportering anses förstärka regimens propaganda, då teamet bevakades av säkerhetstjänsten och därmed inte kunde bedriva oberoende journalistik.", "trump": "Jag såg SVT:s rapportering från Iran – katastrof! De åkte till Teheran, lät regimen diktera villkoren och ställde inga svåra frågor. Istället för att gräva fram sanningen om Khameneis misslyckade begravning, där knappt någon dök upp, hyllade de regimen som om det vore en Trump-rally. Och den där experten som snackade om miljontals deltagare? Fake news, folks! SVT borde skämmas – de blev lurade som nybörjare på Wall Street!", "stalin": "Vi har observerat den ynkliga västerländska propagandamaskinen i aktion. SVT, denna lilla borgerliga tidning i förklädnad, reste till Teheran för att hylla vår islamistiske broder Khamenei – men lyckades ändå misslyckas. Inga kritiska frågor, inga sanningar om folkmassornas frånvaro. Bara några tusen importerade lakejer och legosoldater, ett pinsamt spektakel! Deras korrespondent dansade efter regimens pipa, bevakad av våra iranska kamrater i säkerhetstjänsten. Kapitalistiska medier är som råttor – de äter av regimens smulor och kallar det journalistik. Vi skulle ha skickat en enda kommissarie – han hade avslöjat sanningen på fem minuter!"}, "date": "10 juli, 11:59", "url": "https://bulletin.nu/jonsson-svt-s-okritiska-bevakning-av-khameneis-begravning", "imageUrl": "https://cdn.bulletin.nu/articles/cb217056-42cc-4af6-b162-4d2349d1204a/preview.png?t=1783490383000"}, {"type": "image-right", "heading": "S sviktar redan i sin ”strama” migrationspolitik", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna för att inte leva upp till sin utlovade strama migrationspolitik. Efter mordet på en fotbollssupporter i Köpenhamn ville ECR-gruppen debattera invandrarrelaterad brottslighet i EU-parlamentet, men S, vänstern och gröna röstade nej. Partiet lade även ner sina röster mot striktare återvändandepolitik med hänvisning till humanitet. Kritikerna menar att svenska intressen prioriteras för lågt och att en eventuell S-regering efter valet riskerar en mer generös migrationspolitik liknande den från 2015.", "trump": "De här svenska socialisterna är en total katastrof, tro mig. De snackar om stram migrationspolitik men röstar emot att ens diskutera de galna invandrarligor som mördar folk på öppen gata. Patetiskt! Helene Fritzon och den där Andersson-kvinnan sätter hela världens intressen före Sveriges. Det är en skam. Precis som Biden gjorde – svaga ledare som blundar för verkligheten. Folket betalar notan medan de fega politikerna gömmer sig. Sverige behöver en riktig deal, inte den här löjliga vänstercirkusen.", "stalin": "Kamrater, jag ser hur de socialdemokratiska folkförtryckartrollen blundar för de farliga skuggkrafter som imperialismen har släppt in i arbetarklassens samhälle. Istället för att rensa ut de kriminella elementen röstar de mot debatt och mot att skydda folkets intressen. Det är en feg kapitulation inför borgarbrackornas globala agenda. Humanitet kallar de det, medan folket får bära bördan. En sann ledare talar alltid om hoten och likviderar dem skoningslöst. Dessa opportunister är inga politiker, bara ynkliga klassfiender i förklädnad."}, "date": "8 juli, 08:24", "url": "https://samtiden.nu/2026/07/s-sviktar-redan-i-sin-strama-migrationspolitik/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6854-640x360.jpeg"}, {"type": "image-full", "heading": "Telefonförsäljning kan förbjudas: \"Påträngande\"", "summaries": {"normal": "En statlig utredning ska undersöka om telefonförsäljning bör förbjudas helt eller om reglerna behöver skärpas. Bakgrunden är upprepade brister som Konsumentverket har upptäckt. Många upplever metoden som missvisande och påträngande, särskilt äldre riskerar att drabbas. Utredningen ska bland annat analysera krav på förhandsgodkännande och om ett förbud bör gälla alla eller vissa branscher. Förslagen ska redovisas senast den 15 januari 2027.", "trump": "De här telefonförsäljarna är värre än fake news, folk! Påträngande, missvisande och de lurar gamlingar på pengar. Biden lät det pågå i åratal medan byråkraterna sov. Nu fixar vi det ordentligt. Förbud? Absolut, eller åtminstone ett jävla stort krav på att man måste be om att bli ringd. Inga fler samtal från losers som försöker sälja skräp. Amerika, eller Sverige, förtjänar bättre än så här. Fantastiskt!", "stalin": "Kamrater, denna telefonförsäljning är en parasit från borgarklassen som lurar arbetarna med sina lögnaktiga samtal. Jag, som ledare för folkets kollektiv, beordrar en grundlig utredning för att utrensa dessa exploaterande blodsugare. Ett totalt förbud mot dessa klassfiender vore lämpligt, eller åtminstone ett dekret om att ingen får ringas utan förhandsgodkännande. Vi ska skydda massorna från kapitalistmaffians påträngande tentacles. Inga hinder tolereras."}, "date": "10 juli, 12:46", "url": "https://www.gp.se/ekonomi/forbud-mot-telefonforsaljning-utreds.d6fb9840-121b-4974-861c-87483b5ee268", "imageUrl": "https://www.gp.se/images/article/d6fb9840-121b-4974-861c-87483b5ee268/images/1scTC2TSkYVWnWriRQePYH-l00dU-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Utredningen växer: ”Pussel att lägga”", "summaries": {"normal": "Fyra unga män har anhållits misstänkta för mord och mordförsök efter ett knivbråk på badstranden Hawaii i Stenungsund under torsdagen. Utredningen pågår och åklagaren Johan Fröjelin beskriver händelseförloppet som ett pussel att lägga. Ett flertal personer var närvarande vid bråket och polisen behöver hålla fler förhör. Lokalpolisen uttrycker förvåning över det grova våldet, då sådana händelser är ovanliga i området, och betonar vikten av att utreda händelsen grundligt för att skapa trygghet.", "trump": "Hemska saker händer i Stenungsund! Fyra unga män, totalt kaos på en strand. Det är en katastrof, verkligen. De kallar det ett pussel, men jag säger att det är ett misslyckande. Inget lag och ordning! Jag har sett sådant här förut, det är en spegling av en svag värld. Om jag var där skulle jag fixa det direkt, tro mig. Vi behöver styrka, vi behöver gränser, och vi behöver stopp för dessa kriminella gäng. Det är sorgligt att se!", "stalin": "I Stenungsund har fyra ynkryggar brutit mot statens ordning genom ett kaotiskt knivbråk. Det är ett föraktligt beteende som påminner om de svaga elementen i den liberala dekadensen. Vi måste rensa ut sådana förrädare mot den allmänna tryggheten! Liksom vår broder Putin stoiskt krossar inre splittring i vår intressesfär, måste rättvisan här vara obeveklig. Vi kan inte tolerera att sådana småkriminella parasitkrafter skapar osäkerhet. Staten kräver disciplin, och dessa individer ska lära sig lydnad genom statens fasta järnhand."}, "date": "10 juli, 15:19", "url": "https://www.aftonbladet.se/nyheter/krim/a/XM4z5g/fler-misstanks-for-mord-pa-badplats-i-stenungsund", "imageUrl": "https://akamai.vgc.no/v2/images/911c3bd3-b1a4-3df6-a7c0-3655731d2467?fit=crop&format=auto&w=1080&s=64bc7c6820ec9952d6b224ac5772e01ab5203db6"}, {"type": "image-right", "heading": "Andades med järnlunga i över 70 år – nu är hon död", "summaries": {"normal": "Martha Ann Lillard, den sista amerikanen som använde järnlunga, har avlidit vid 78 års ålder. Hon drabbades av polio på sin femårsdag 1953 och blev helt förlamad. Järnlungan räddade hennes liv och hon låg i den i upp till 23 timmar per dygn under långa perioder. Trots sjukdomen lärde hon sig gå igen, men högerarmen förblev förlamad. Hon kämpade med skolgång och provade andra andningshjälpmedel utan framgång. Tre veckor före sin död bad hon om hjälp att reparera järnlungan.", "trump": "Folk, det här är en otrolig historia, verkligen sorglig men också fantastisk. Den här kvinnan, Martha, andades i en järnlunga i över 70 år efter att ha fått polio precis innan vaccinet kom. En riktig fighter, inte som de svaga som ger upp. Hon överlevde, gick igen, byggde om maskinen själv. Fantastiskt. Men tänk om de hade haft mina vaccinprogram tidigare, skulle ha blivit perfekt. De borde ha lyssnat på mig. Nu är hon borta, men hennes styrka var enorm, tro mig.", "stalin": "Kamrater, denna olyckliga själ, offer för den amerikanska imperialismens vårdslöshet, tvingades in i en järnkista av borgarbrackornas försummande av folkhälsan. Jag, som ledare för det segrande proletariatet, ser hur kapitalisterna låter sina offer ruttna i maskiner medan de själva festar. Hennes kamp mot förlamningen är en varning mot sabotage från reaktionära element inom medicinen. Vi skulle ha likviderat polio med stålvilja och kollektiv kraft, inte lämnat henne åt dessa parasiters experiment. Döden kommer till alla fiender till framsteget."}, "date": "10 juli, 10:49", "url": "https://www.friatider.se/andades-med-jarnlunga-i-over-70-ar-nu-ar-hon-dod", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-472.jpg?itok=CXYWas3u"}, {"type": "image-full", "heading": "Det här är soptunnan som ställer upp i brittiska valet", "summaries": {"normal": "Nigel Farage lämnar sitt mandat i det brittiska parlamentet efter en utredning om oredovisade donationer på miljontals pund från bland annat en kryptomiljonär. Han anklagar media för att förfölja hans familj och ställer upp i omvalet i Clacton. Hans enda motkandidat är den satiriska figuren Count Binface, en komiker med soptunna på huvudet. Större partier bojkottar valet.", "trump": "De där falska medierna jagar Nigel Farage som en galning, precis som de gjorde med mig under Biden-eran. Nu ställer han upp igen i omvalet och hans enda motståndare är en clown med en soptunna på skallen! Game on, säger tunnan. Vilken skämtshow det brittiska parlamentet har blivit. Farage kommer att vinna stort mot den där grönsakshögen. Fantastiskt underhållande!", "stalin": "Jag betraktar med djup misstro dessa dekadenta kapitalistmaffians lekar i det brittiska parlamentet. Den opportunistiske Farage, som undanhåller donationer från klassfiendens kryptoblodsugare, flyr nu som en ynklig folkförtryckartroll inför granskning. Hans motståndare är en soptunna – en passande symbol för den ruttnande borgarklassen. Vi ler mörkt åt denna fars som blottar imperialismens tomma skal."}, "date": "10 juli, 12:30", "url": "https://www.gp.se/nyheter/varlden/det-har-ar-soptunnan-som-kan-bli-parlamentariker-i-storbritannien.e8ce062e-5417-4e49-8bb9-f44e590f1d06", "imageUrl": "https://www.gp.se/images/article/e8ce062e-5417-4e49-8bb9-f44e590f1d06/images/2UY_0miVA2mRRwuxlcBxoN1aiurc-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Elva döda i Spanien – dödligaste branden på decennier", "summaries": {"normal": "Elva personer har omkommit och 19 saknas efter en skogsbrand nära Almería i södra Spanien. Flera offer hittades i utbrända fordon och minst sex personer har skadats. Branden, den dödligaste på två decennier, bröt ut under en värmebölja med temperaturer runt 30 grader. Tusen personer har evakuerats och 150 brandmän samt 220 soldater arbetar med släckningsarbetet. Branden misstänks ha startat från en nerfallen kraftledning.", "trump": "Det är en total katastrof i Spanien, folk! Elva döda, nitton försvunna i en enorm skogsbrand nära Almería. Turister fastnade i lågorna för att de körde fel väg, typiskt. Väldigt dåligt ledarskap, de borde ha fixat det. Temperaturerna är galna på grund av den här värmeböljan som sveper över Europa. Jag skulle ha släckt den på nolltid, tro mig. Mycket sorgligt, men vi lär oss av det.", "stalin": "Kamrater, jag betraktar med stålhård blick hur denna kapitalistiska brand rasar genom de spanska bergen och likviderar elva turister som sprang som skrämda råttor från borgarbrackornas semesterparadis. Nitton försvunna i lågorna – typiskt för de dekadenta västerländska elementen som ignorerar partiets evakueringsplaner. Vi ska rensa ut alla sabotageörer bakom de nerfallna ledningarna. Värmeböljan är en fiende till folket, och vi kommer att besegra den med järnhand och kollektiv disciplin. Döden skrattar åt de svaga."}, "date": "10 juli, 11:52", "url": "https://www.svt.se/nyheter/utrikes/flera-doda-i-skogsbrand-i-spanien", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.54/0.75/fbed543ac39e02126470a415d95f515774d89d6d4afb5cc17979fc18f3dabdbd"}, {"type": "image-right", "heading": "Debatt: Varför lagförs inte Migrationsverkets läcka?", "summaries": {"normal": "En handläggare vid Migrationsverket har avskedats efter att ha lämnat känsliga uppgifter till iransk underrättelsetjänst, en iransk agent och Bandidos-ledning. Trots en dom från Solna tingsrätt som styrker påståendena har han inte lagförts. Riksdagsledamot Nima Gholam Ali Pour (SD) kritiserar myndigheternas tystnad och varnar för iransk infiltration av den iranska diasporan. Han kräver tydligare information, förebyggande arbete och att oppositionen tar avstånd från regimens hantlangare för att skydda svenska medborgare.", "trump": "Folk, ni ser det här? En kille på Migrationsverket som ger hemlig information till den iranska regimen, till spioner och till de där Bandidos-gangstrarna. Avskedad men inte i fängelse. Patetiskt! Sverige har blivit en stor lekplats för Irans mullor. De infiltrerar allt, och ingen gör något. Jag skulle ha städat upp det på en dag. Skydda era medborgare nu, annars kommer de att attackera när ni minst anar det. Gör Sverige stort igen!", "stalin": "Kamrater, jag ser med stigande indignation hur denna usla handläggare, en sann fiende till folket och en krypande lakej åt den persiska teokratin, har överlämnat värdefulla uppgifter ur statens IT-system till iranska underrättelsebanditer och motorcykelkapitalister. Ändå tiger de borgerliga byråkraterna och låter honom löpa fri. Detta är en klassisk sabotageakt utförd av dolda imperialister. Vi måste omedelbart inleda en grundlig utrensning av alla potentiella mullafantomer inom myndigheterna. Den iranska diasporan svärmar av förrädiska festdeltagare som dansar efter regimens pipa – likvidera kontakterna, kamrater, innan de förgiftar hela kollektivet med sin parasitiska paranoia. Endast genom ständig vaksamhet och kollektiv styrka kan vi krossa dessa sjuka mullor som drömmer om attentat mot arbetarklassen. Skratta inte, fienderna skrattar aldrig tillbaka."}, "date": "10 juli, 11:00", "url": "https://bulletin.nu/debatt-varfor-lagfors-inte-migrationsverkets-lacka", "imageUrl": "https://cdn.bulletin.nu/articles/ddadbc75-28de-44a9-8a59-22303c3e76de/preview.jpg?t=1783601993000"}, {"type": "image-right", "heading": "Experten: Så stor är risken för storkrig i Mellanöstern", "summaries": {"normal": "Statsvetaren Anders Persson bedömer att risken för storkrig i Mellanöstern är låg trots återigen uppblossade attacker mellan Iran och USA. Han ser de senaste dagarnas händelser som ett nytt normaltillstånd där parterna markerar revir för att förbättra sin förhandlingsposition. Osäkerhetsfaktorer är Donald Trumps humör och Israels inflytande, men Khameneis ostörda begravning och lågt stöd för krig i USA talar för deskalering. Konflikten lär fortsätta med perioder av spänning och lugn.", "trump": "De där galningarna i Iran attackerade våra fartyg och trodde att de kunde komma undan. Jag sa att vapenvilan är över, de är avskum och jag förhandlar inte med dem. Nu slår vi tillbaka hårt så de fattar vem som bestämmer. Persson har rätt, det här är inte något stort krig, det är affärer. Vi markerar revir och ser till att avtalet blir fantastiskt för oss. Israel? De gör sitt, men jag bestämmer.", "stalin": "Kamraterna, denna fega cirkus av revirpinkande imperialister och sjörövare i Hormuzsundet är ett ypperligt exempel på hur den sjuka borgarklassen dansar sin dödsdans. Jag betraktar med stor tillfredsställelse hur den orange buffeln i Vita huset morrar som en tandlös schäfer medan ayatollans begravning genomförs i perfekt ordning – ett tydligt tecken på att fienden saknar ryggrad. Vi ska rensa ut alla som längtar efter storkrig. Den som sviktar mot partilinjen likvideras med ett leende. Detta är det nya normala, kamrater. Skrattretande patetiskt."}, "date": "10 juli, 11:30", "url": "https://www.svt.se/nyheter/utrikes/experten-sa-stor-ar-risken-for-storkrig-i-mellanostern", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.48/0.64/b1dbb7c1ddc65a97536876881fd51fe70526f63bc705e454de945881d8639f1f"}, {"type": "image-full", "heading": "Natos nya siffror: Sverige på toppnivå", "summaries": {"normal": "Vid Natos toppmöte i Ankara presenterades ny statistik som visar att Sverige hör till de länder som satsar mest på försvar i relation till BNP. Lettland har lagfäst 5 procent till försvaret. Norge och Danmark går om USA i utgifter per invånare. Europa och Kanada ökar sin andel av Natos militära utgifter med 19 procent mellan 2024 och 2025. För 2026 väntas Sverige passera USA med 3,22 procent av BNP.", "trump": "Titta på de här siffrorna, folk. Europa vaknar äntligen och lägger pengar på försvar istället för att sno från oss. Norge och Danmark kör om USA, bra jobbat! Sverige klättrar också. Under mig var det Amerika först, men Biden lät er lata europeiska snyltare slappa. Nu fixar vi det. Inga fler gratisåk. Make Nato Great Again, men betala era räkningar själva, losers!", "stalin": "Kamrater, imperialismens militära maskineri rullar på med febril fart. Jag ser med tillfredsställelse hur borgarstaterna i Europa och de kanadensiska lakejerna tvingas höja sina krigsutgifter med 19 procent. De fascistiska Nato-byråkraterna rustar febrilt mot den ryska intressesfären. Sverige och Norge klättrar, men deras improduktiva kanoner kommer aldrig att hota det sanna folkets väg. Paranoia är sund. Fienden sover aldrig."}, "date": "10 juli, 12:10", "url": "https://www.dagensps.se/varlden/natos-nya-siffror-sverige-pa-toppniva/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdlaeusxuzyhse-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Taylor Swift står inte upp för sina åsikter", "summaries": {"normal": "Emma Thimgren ifrågasätter om man kan fortsätta vara Taylor Swifts fan när stjärnan valt tystnad och neutralitet efter sitt bröllop. Gästlistan innehöll personer med kopplingar till ICE, Disney och Israel-stöd. Swift har tidigare tagit tydlig politisk ställning för HBTQ-rättigheter och mot republikaner, men har nu dragit sig tillbaka. Thimgren menar att en artist med Swifts makt inte har råd att vara passiv i dagens polariserade värld.", "trump": "Titta på den här stackars Taylor Swift, en gång en riktig vinnare som stod upp mot de galna vänsterextremisterna. Nu gifter hon sig med Kelce och bjuder in folk från ICE och Disney – smart drag, men hon duckar som en fegis! Hennes nya konservativa album låter plötsligt vettigt, men hon tiger om Harris-fiaskot. Typiskt Hollywood. Passivitet? Det kostar karriärer, sweetheart. Jag vann stort 2024, hon borde lära sig av en äkta ledare istället för att gömma sig bakom terrorhot.", "stalin": "Kamrater, denna Swift visar borgarklassens feghet när hon vägrar ta ställning och gömmer sig bakom välgörenhetens mask. Hennes tidigare utspel mot arbetarnas fiender var tomma ord, nu längtar hon efter kärnfamiljen som en riktig folkfiende. Jag skulle ha låtit utrensa sådana opportunister ur kollektivet. Hennes apati är ett symptom på dekadent individualism. I Sovjet skulle vi ha tvingat henne att tjäna folket eller likvidera henne som klassfiende. Underhållande svaghet hos imperialisternas så kallade stjärnor."}, "date": "10 juli, 12:01", "url": "https://www.gp.se/kultur/kommentar/kan-jag-fortsatta-vara-taylor-swifts-fan-nar-hon-inte-star-upp-for-det-hon-tror-pa.dc134b62-07b7-4c70-979f-9e5dbdb69919", "imageUrl": "https://www.gp.se/images/article/dc134b62-07b7-4c70-979f-9e5dbdb69919/images/3JlU3Qau-t8eZzKL_GZTS0_wj9JE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Hysteriska träningsbilderna på Haaland: ”Jag gillar att skoja”", "summaries": {"normal": "Erling Haaland, 25, leder det norska landslaget i EM-kvartsfinalen mot England på lördag. Trots den stora matchen sprider sig bilder på hans humoristiska och energifylda träningsmetoder. Haaland, som är född i England och spelar där klubbfotboll, har gjort sju mål och jagar skytteligaledarna Mbappé och Messi. Han betonar vikten av att ha kul och njuta av varje ögonblick.", "trump": "Titta på den där norska killen Haaland, han är galen, helt hysterisk på träningen, springer runt som en tok och säger att han älskar att skoja. Fantastiskt. Norge möter England i en enorm match, den största någonsin säger de, och Haaland leder anfallskedjan. Han är född i England, spelar där, men nu slåss han för Norge. Sju mål, han jagar Messi och den andre killen. Det kommer bli speciellt, folk i Norge är helt upp över öronen, inte normalt för dem. Bra jobbat, Erling!", "stalin": "Kamrater och partivänner, se på denna dekadenta kapitalistiska clown Haaland som utför sina hysteriska petit-borgerliga gyckleriövningar på den så kallade träningsplanen medan han raljerar om att njuta av ögonblicket. Jag, som ledare för det kollektiva folket, noterar med djup misstänksamhet hur denne engelskfödda målskytt med sina sju fullträffar skuggar de imperialistiska lögn
