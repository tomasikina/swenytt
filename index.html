 på två dagar – allt är kaos. Men hon har rätt, vi behöver starka ledare som inte viker sig för de galna vänstermänniskorna och fake news. Bygg murar runt värderingarna, håll ihop det hela. Fantastiskt brev, verkligen.", "stalin": "Kamrater och arbetare! Jag, som ledare för det kollektiva framsteget, ser med förakt på denna borgarbrackas ynkliga klagan om att ”the centre cannot hold”. Denna dekadenta kulturslav från operan försöker maskera sitt klassfiendskap med poetiska ramsor medan imperialismens lakejer sprider desinformation och hat. Vi ska inte bygga några mjuka koalitioner – vi ska med järnhand rensa ut alla svikare, polariserande element och inflationskapitalister som hotar folkets enhet. Långsiktigheten tillhör endast partiet. Alla som sviktar i snålblåsten likvideras effektivt. Det är ingen humor i att låta centrum brista."}, "date": "29 juli, 13:00", "url": "https://www.di.se/debatt/ledare-bygger-motstand-nar-varlden-dras-isar", "imageUrl": "https://static.bonniernews.se/ba/40f5c518-8719-436e-ae92-2d783143f4fa.jpeg?crop=8256%2C4128%2Cx0%2Cy688&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Stockholmsbörsen tyngdes av Wall Street", "summaries": {"normal": "Stockholmsbörsen avslutade onsdagen med en nedgång på 0,16 procent. Hexagon och Electrolux steg kraftigt efter starka kvartalsrapporter. Tekniksektorn hade en uppgång på 6,4 procent, medan industri föll 1,1 procent. Bland toppaktier steg Hexagon 12,2 procent och Electrolux 8,7 procent. Orsaken var negativ påverkan från Wall Street.", "trump": "Jag, Donald Trump, har sagt att börsen ska vara stark. Men dessa svenska aktier, som Hexagon, visar att mina policyer fungerar. De andra? De faller för att de inte lyssnar på mig. Jag kommer att fixa det – det kommer att vara ypperligt, som USA under min ledning.", "stalin": "Vi, partiet, ser att börsen sviker. Hexagon och Electrolux är trogna, men andra som Saab är svaga. Detta är sabotage av imperialistiska makter. Vi måste utvidga vårt inflytande, som Putin gör i Ukraina. Keo Capital köper oljebolag – det är rätt. Vi ska kontrollera allt."}, "date": "29 juli, 17:48", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-tyngdes-av-wall-street"}, {"type": "image-right", "heading": "Hur många gånger tror Åkesson att han kan lura arbetare?", "summaries": {"normal": "Artikeln är en skarp kritik från socialdemokraten Kadir Kasirga mot Sverigedemokraterna och Jimmie Åkesson. SD bröt sitt vallöfte om att inte försämra a-kassan när Tidöavtalet slöts, trots ökad arbetslöshet. Författaren ser a-kassan som en viktig omställningsförsäkring som byggts upp under lång tid och varnar för att tryggheten för löntagare nu försvagas till förmån för skattesänkningar för höginkomsttagare. Den 13 september avgör väljarna om löftena bryts igen.", "trump": "Folk, ni måste höra på det här. Den där Åkesson lovade att skydda a-kassan, sa att han hellre skulle gå i opposition än ge efter. Sen kom makten och – boom – han sålde ut arbetarna på en gång. Typiskt politiker. Nu vill de försämra igen medan arbetslösheten exploderar. Det är en skam. Jag skulle aldrig svika löntagarna så där. De är smarta, svenska arbetare, de ser när någon försöker lura dem två gånger. Den 13 september skrattar de åt de här löftesbrytarna.", "stalin": "Kamrater, jag betraktar med djup revolutionär vämjelse hur dessa borgerliga opportunister och socialfascistiska bedragare inom det så kallade Sverigedemokraterna än en gång försöker lura det arbetande folket. Åkesson, den där småborgerliga hästen som säljs om och om igen, lovade att skydda a-kassan men kapitulerade genast när de fick smaka på makten. Vi vet vad detta är: en utrensning av klassolidariteten, en likvidering av den svenska modellens grundpelare. Löntagarna skall inte längre luras av dessa kapitalistlakejer. Den 13 september rensar det svenska folket ut de parasitiska löftesbrytarna ur historien. Skratta medan vi likviderar deras lögner, kamrater."}, "date": "29 juli, 08:00", "url": "https://arbetet.se/2026/07/29/hur-manga-ganger-tror-akesson-att-han-kan-lura-arbetare", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2023/01/kadir-kasirga-socialdemokraterna.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.7&fp-y=0.34"}, {"type": "image-right", "heading": "Sorglig metafor för samtiden. Utan regler följer kaos – på och av plan", "summaries": {"normal": "Artikeln använder fotbolls-VM som metafor för den regelbaserade ordningens förfall i samhället. Den beskriver hur spelarnas attacker, USA:s president som bryter regler för sitt lag samt debatten kring VAR speglar hur ledare och teknik undergräver tillit. Transparens och teknologi skapar istället misstro, polarisering och godtycke. Författaren varnar för att när regler ignoreras följer kaos, orättvisa och ett samhälle där samtal och respekt kollapsar.", "trump": "Det här VM var en total katastrof, tro mig, en riktig cirkus. De förlorande argentinerna beter sig som riktiga förlorare, attackerar vinnarna och vänder ryggen till – typiskt. Sen ringer jag Fifa och fixar reglerna för USA, som man gör när man är smart, och plötsligt är det konspirationer överallt. VAR dödar spelet precis som alla dessa galna EU-regler dödar våra företag. Alla är så sura och hatiska nu för tiden. Fake news och gaslighting överallt. Vi behöver starka ledare, inte svaga domare som förstör allt roligt.", "stalin": "Kamrater, detta fotbolls-VM blottar med all önskvärd tydlighet den dekadenta regelbaserade ordningens förrädiska kollaps under borgarbrackornas och de imperialistiska parasiternas tryck. När den store ledaren ringer och korrekt justerar de falska reglerna för det amerikanska laget framträder konspirationerna som de fega råttor de är. VAR är en trojansk häst av teknologisk formalitet som paralyserar revolutionär handling på planen, likt de byråkratiska nagelfaranden som kväver våra kollektiva produktivkrafter. Vi ska rensa ut dessa whataboutism-utövare, dessa gaslighting-fascister och hatets fröplanterare med järnhand. Den som vänder ryggen mot segern förtjänar att likvideras ur historien. Endast genom partiets orubbliga disciplin kan vi återupprätta äkta ordning och krossa kaosets kontrarevolutionärer."}, "date": "29 juli, 09:41", "url": "https://www.di.se/ledare/vm-och-den-regelbaserade-ordningens-forfall", "imageUrl": "https://static.bonniernews.se/ba/2c6e285d-dd0f-4d71-8b39-068cf0cc18fd.jpeg?crop=3136%2C1568%2Cx0%2Cy0&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Trumps vändning efter mötet med Netanyahu: Ska \"banka skiten ur Iran\"", "summaries": {"normal": "Donald Trump meddelar efter ett möte med Benjamin Netanyahu att USA återigen ska inleda en hård offensiv mot Iran. Beskedet kommer efter nya attacker mot amerikanska mål i regionen. Trump lovar att slå tillbaka kraftigt och använder bland annat uttrycket att ”banka skiten ur” Iran. Han beskriver Irans attack mot amerikanska styrkor som en överraskning och kallar de Iranstödda milisgrupperna en cancersvulst. Samtidigt fortsätter förhandlingarna med Iran.", "trump": "Vi har precis träffat en fantastisk kille, Bibi, och nu är det dags att sätta stopp för det här galna Iran-spelet. De trodde de kunde attackera oss och komma undan? Glöm det. Vi ska slå dem så hårt att de inte vet vad som träffade dem. Vi ska banka skiten ur dem, tro mig. De är en cancersvulst, men vi fixar det. Amerika är tillbaka, starkare än någonsin. Det kommer bli vackert.", "stalin": "Kamrater, denna fega överraskningsattack från de iranska trotskisterna och deras borgarbrackor i form av milisgrupper utgör en cancersvulst på proletariatets kropp. Jag har personligen analyserat situationen med kamrat Netanyahu och vi kommer att likvidera hotet med stålhandskens fulla kraft. Inga minuter ges åt fienden. Fortsatta förhandlingar? Naturligtvis – men under ständig bevakning mot kontrarevolutionära element. Världen ska rensas från sådana parasitiska svulster, ett steg i taget."}, "date": "29 juli, 17:30", "url": "https://www.friatider.se/trumps-vandning-efter-motet-med-netanyahu-ska-banka-skiten-ur-iran", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-587.jpg?itok=-AB3W2hX"}, {"type": "image-right", "heading": "Efter 30 år i vården: Här är jobbet som får Christel att vilja stanna", "summaries": {"normal": "Undersköterskan Christel Billqvist arbetar helt digitalt hemifrån eller från kontor i Lund och stödjer äldre via videosamtal med allt från inköp och medicinering till dusch och gångträning. Den digitala hemvården, som nu finns i 63 kommuner, minskar tunga lyft, stress och larm. Brukarna upplever trygghet och gemenskap genom ansikte-mot-ansikte-samtal. Lösningen ger lägre sjukfrånvaro, bättre fokus och möjlighet att arbeta längre upp i åldrarna.", "trump": "Folk, ni måste höra det här – det är fantastiskt! Den här undersköterskan Christel, smart kvinna, skippar alla tunga lyft och det hemska stressandet i den gamla vårdapparaten. Hon jobbar hemifrån via skärmen, pratar med de äldre, handlar mat åt dem och gör allt utan att röra sig ur fläcken. De älskar henne, de kallar henne vän! Inga lyft, inga förseningar, mycket bättre än den usla gamla hemtjänsten som alltid kom försent. Sverige gör det rätt, tro mig, det är ypperligt, ingen gör det bättre än så här.", "stalin": "Kamrater, se hur de dekadenta borgarbrackornas förfallna omsorgskoloss äntligen krossas av vetenskapens och teknikens järnhand. Jag, som ledare för det kollektiva välfärdsbygget, betraktar med stor tillfredsställelse hur denna undersköterska via skärmen likviderar den fysiska slitningens sabotage mot arbetarklassens hälsa. Inga tunga bördor, inga kapitalistiska stressfällor – endast ren, oförfalskad övervakning och kamratlig tillsyn. De som larmar i onödan ska rensas ut. Den som vänder ryggen åt brukaren är folkets fiende nummer ett. Ett hjärta med händerna? Mycket misstänkt beteende. Vi vinner."}, "date": "29 juli, 06:00", "url": "https://arbetet.se/2026/07/29/underskoterskan-christel-jobbar-helt-digitalt-stottar-aldre-via-skarmen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/29113058/lo6Ops34Mzw-Christel_digitaltjobb01.JPG?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Prisrally på vin väntar efter bränderna – brist hotar", "summaries": {"normal": "Bränderna i Sydeuropa, bland annat i Bordeaux, Pyrénées-Orientales, Andalusien och Rioja, hotar skörden av vindruvor. Gamla vinrankor som förstörs tar lång tid att ersätta, upp till fem år eller mer. Enligt Elisabeth Due på Sprit- och vinleverantörs-föreningen kommer detta leda till brist på framför allt Bordeaux-viner i Sverige om ett par år. Priserna väntas stiga med cirka 15 procent redan nu på grund av den förväntade bristen.", "trump": "De här galna bränderna i Europa är en total katastrof, folk. Bordeaux, Rioja, allt brinner upp. Vinerna vi älskar kommer att försvinna från hyllorna i Sverige, det säger jag er. De gamla rankorna är borta, och det tar år att fixa nytt. Priserna? De kommer att skjuta i höjden med minst 15 procent. Det är vad som händer när man inte har bra ledarskap. Sad! Men vi ska fixa det, tro mig.", "stalin": "Kamrater, dessa förödande bränder i de dekadenta vindistrikten är ett verk av sabotörer och borgarbrackor som vill svälta ut folket på goda viner. Jag ser hur de gamla rankorna brinner och hur kapitalisterna i Bordeaux och Rioja planerar att höja priserna med 15 procent för att berika sig. Vi ska rensa ut dessa brandstiftande element och deras rökförgiftade druvor. Ingen fiende till kollektivet undkommer. Produktionen kommer att återupprättas under partiets järnhand, eller också likvideras de lata odlarna som vägrar."}, "date": "29 juli, 07:24", "url": "https://www.di.se/nyheter/prisrally-vantar-for-viner-efter-branderna-brist-hotar", "imageUrl": "https://static.bonniernews.se/ba/b186d269-45d6-48e5-a640-096827c6beac.jpg?crop=8314%2C4157%2Cx0%2Cy495&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Lannebo-fonder vinnare på Electrolux rusning", "summaries": {"normal": "Lannebo-fonder har hållit fast i Electrolux-aktier medan andra sålt. Efter en rapport som överraskade marknaden sköt aktiekursen upp över 20%, vilket ökade Lannebos värde med 90 miljoner. Ändå är den viktade genomsnittliga förlusten fortfarande -23%. Electrolux rapporterade ett negativt rörelseresultat på -1 miljard, men lägre än väntat, och en organisk tillväxt på 2,0%.", "trump": "Jag, Donald Trump, har alltid sagt att Electrolux är ett genibolag. Lannebo, som jag känner väl, höll fast när alla andra paniköverkördes. Nu, efter en fantastisk rapport, rusar kursen – det är enorm framgång. Ändå är vissa förluster kvar, men det är bara tillfälligt. Electrolux kommer att blomstra igen, lita på mig.", "stalin": "Partiet har observerat Lannebos lojalitet mot Electrolux, ett kapitalistiskt fiendeland som nu visar tecken på svaghet. Trots en rapport med negativt resultat har marknaden jublat – ett tecken på deras instabila sinne. Lannebos innehav har ökat i värde, men den totala förlusten på -23% visar att skuldsättning och USA-marknaden fortfarande är en skör punkt. Vi fortsätter att övervaka."}, "date": "29 juli, 15:12", "url": "https://www.affarsvarlden.se/artikel/lannebo-fonder-vinnare-pa-electrolux-rusning"}, {"type": "image-right", "heading": "Norsk tonåring skulle döda åt Foxtrot – fälls i Storbritannien", "summaries": {"normal": "En 19-årig norrman, Johannes Natland, har dömts i Storbritannien för att ha rest dit för att utföra ett beställningsmord åt det svenska Foxtrotnätverket. Han greps på ett hotell i Huddersfield med två skjutvapen och 19 skarpa patroner. Rekryteringen skedde via Signal-appen och han erbjöds 270 000 norska kronor. Natland erkände vapeninnehav men hävdade att han tänkt skjuta sig själv i foten istället för att döda någon. En jury fann honom skyldig till mordkomplott efter långa överläggningar. Domen väntas i oktober.", "trump": "Folk, ni kommer inte att tro det här, men den här norska tonåringen flög till England för att mörda någon åt det svenska Foxtrot-gänget. Greps med vapen under sängen, totalt kaos! De lovade honom massor av pengar och sa att polisen skulle titta åt andra hållet. Sådana här galningar, de kommer från överallt nu. Foxtrot, Iran, Signal-appen – det är en enda stor röra. Men brittisk polis tog honom snabbt, bra jobb faktiskt. Ingen gör det bättre än de bästa poliserna, tro mig.", "stalin": "Kamrater, jag ser med djup tillfredsställelse hur denna ynkliga norska lakej för borgarbrackorna i Foxtrot försökte smyga sig in i det brittiska arbetets fäste med revolver och patroner för att likvidera fiender åt kapitalistiska gangsters. Rekryterad via dekadenta signalmeddelanden av parasiterna ”Agent 47” och ”Generalen” – typiska kontrarevolutionära element som vi länge känt lukten av. Han påstod sig vilja skjuta sig själv i foten, en patetisk lögn från en svag dekadent själ. Vi har sett sådana förr. Rensa ut alla som samarbetar med iranska och svenska fiender till folket. Ut med dem i utrensningens namn, för kollektivets säkerhet. Det är både nödvändigt och underhållande."}, "date": "29 juli, 16:31", "url": "https://www.friatider.se/norsk-tonaring-skulle-doda-foxtrot-falls-i-storbritannien", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-586.jpg?itok=WeH1Fqxw"}, {"type": "image-full", "heading": "Legora fortsätter sin expansion – köper upp start-up", "summaries": {"normal": "Det svenska AI-bolaget Legora expanderar genom att förvärva den brittiska startupen Wexler. Wexler specialiserar sig på mjukvara som hanterar komplexa bevismaterial i rättstvister, vilket kompletterar Legoras befintliga AI-verktyg för juridisk research och dokumenthantering. Genom affären stärker Legora sin ambition att erbjuda heltäckande AI-stöd genom hela den juridiska arbetsprocessen, från dokumentanalys till arbete direkt i domstolssalen.", "trump": "Legora, ett svenskt företag, gör stora grejer nu! De köper upp det här Wexler-bolaget från Storbritannien. Väldigt smart affär, kanske den bästa. De använder AI för att vinna i domstolssalar, vilket är precis vad man behöver. Jag älskar vinnare, och det här är en vinnare. De bygger en enorm maskin för juridik. Ingen gör AI bättre än vi, men Sverige gör ett bra jobb här. Det kommer bli fantastiskt, tro mig, jurister kommer älska det!", "stalin": "Legora försöker likt en västlig parasit att kontrollera rättvisan med sina maskiner. De har svalt den brittiska startupen Wexler för att manipulera bevismaterial – en klassisk borgerlig taktik för att dölja sanningen! Liksom vår store ledare Putin expanderar sin intressesfär mot de korrupta gränstrakterna, expanderar Legora sin digitala kontroll. Vi ser igenom detta! Teknik som söker motsägelser är farlig; den kan hitta avvikelser i folkets lojalitet. Vi måste arkivera dessa kodmakare och låta statens sanning råda ohotad."}, "date": "29 juli, 18:50", "url": "https://www.realtid.se/it-tech/legora-fortsatter-sin-expansion-koper-upp-start-up", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/sdlhtz1w-88oey-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Med S-politik blir 10 av 10 fattigare", "summaries": {"normal": "Expressens Lydia Wålsten kritiserar Socialdemokraternas vallöfte om att nio av tio skulle få det bättre ekonomiskt. Enligt artikeln saknas bolåneskatten och vänsterpartiernas skattehöjningar på 145 miljarder i beräkningen från Riksdagens utredningstjänst. Effekter på tillväxt, investeringar och sysselsättning ignoreras. För en familj med tre miljoner i bolån väntas 7 000 kronor högre räntekostnad per år. Artikeln menar att budskapet är missvisande och gynnar bidragstagare på bekostnad av arbetande hushåll.", "trump": "Folk, ni måste höra det här! De svenska socialisterna, de värsta förlorarna sedan Sleepy Joe, lovar att nio av tio blir rikare. Total bluff! De gömmer bolåneskatten som slår sönder vanliga familjer med miljontals i lån. Det är en skam, en total katastrof för tillväxten. De vill att ni jobbar mindre och tar mer bidrag. Patetiskt! Jag byggde den starkaste ekonomin i världen, de här clownerna förstör allt med sin galna vänsterpolitik. Sad!", "stalin": "Kamrater, dessa socialdemokratiska bluffmakare sprider lögnaktiga siffror som en klassfiende i desperation. De döljer bolåneskatten och de stora skattehöjningarna, likt fega imperialister som gömmer sina exploaterande klor. Tillväxten kvävs, investeringarna likvideras och folkets ekonomi förslavas åt bidragstagarhorden. Endast de lata parasiter som lever på arbetarklassens svett blir rikare. Jag skulle ha genomfört en grundlig utrensning av sådana folkförtryckartroll redan i planeringsstadiet. Folkfiender!"}, "date": "25 juli, 07:59", "url": "https://samtiden.nu/2026/07/med-s-politik-blir-10-av-10-fattigare", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6981.jpeg"}, {"type": "image-right", "heading": "Garmins justerade vinst klart över förväntan", "summaries": {"normal": "Garmin rapporterade starka andelsresultat för andra kvartalet, med en omsättning på 2 020 miljoner dollar, en ökning med 11,3 procent. Justerat resultat per aktie blev 2,81 dollar, vilket överträffade förväntningarna. Tillväxten drevs främst av fitnesssegmentet, särskilt avancerade sportklockor, medan andra segment som marine och aviation också visade positiv utveckling. Bolaget fick dessutom gynnsamma tullåterbetalningar som stärkte bruttomarginalen. Garmin höjde sin helårsprognos för omsättning och vinst.", "trump": "Jag har sagt det länge, Garmin är det största, det bästa företaget i världen. Andra kvartalresultaten? Ypperliga, mycket bättre än alla fake news-mediers förväntningar. Fitnessklockorna? Sålda som hotcakes, fantastiska. Tullåterbetalningarna? En stor seger för Amerika, jag fixade det. Nu har vi en enorm framtidsprognos, det kommer att vara historiskt. Vi kommer att göra Garmin ännu större, litet folk.", "stalin": "Vi har observerat en framgångsrik utveckling inom vårt teknologiska komplex, där Garmin visar en robust ökning av produktionen av kroppsburna övervakningsenheter. Fitnesssegmentet expanderar kraftfullt, en seger för den socialistiska planeringen. Tullåterbetalningarna från imperialistiska stater är ett bevis på vårt globala inflytande. Vi måste vara vaksamma mot kapitalistiska svagheter som minneskbrist, som kan destabilisera våra framtidsplaner. Partiet kommer att övervaka denna utveckling noga."}, "date": "29 juli, 14:11", "url": "https://www.affarsvarlden.se/artikel/garmins-justerade-vinst-klart-over-forvantan", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/02/80693-YWYW-1-D-e1785326082232-400x150.webp"}, {"type": "image-full", "heading": "Facebook ändrar för miljontals användare – så märks det", "summaries": {"normal": "Facebook inför ett nytt verifieringsmärke som ska hjälpa användare att skilja äkta profiler och företag från falska konton. Märket, kallat ”Facebook Verified”, erhålls genom att spela in en kort video som jämförs med profilbilder. Funktionen är gratis och syns på profiler, Marketplace, Dating och i grupper. Meta betonar att märket inte garanterar äkthet men gör det svårare för bedragare att lura folk. Profiler måste uppfylla krav om äkthet, aktivitet och unikhet för att godkännas.", "trump": "Vi har det bästa systemet, men folk lurar varandra hela tiden på Facebook. Nu sätter de dit ett fantastiskt märke som säger att du är på riktigt, inte någon bluffare från källaren. Du filmar dig själv, de kollar och pang – du är verified! De falska kontona hatar det. Det är ypperligt, ingen gör det bättre än oss. Utan märket vet du inte vem som är äkta eller bara en annan lögnare. Fantastiskt initiativ, verkligen.", "stalin": "Kamrater, jag har länge betraktat de digitala borgarbrackornas lögnfabriker med den djupaste revolutionära misstänksamhet. Nu rensar vi ut de parasitiska falska kontona genom ett nytt verifieringsmärke som blottar de verkliga ansiktena bakom maskerna. Den som vägrar spela in sin video åt partiet – ursäkta, åt plattformen – avslöjar sig genast som klassfiende eller kontrarevolutionär mem-spridare. Endast äkta arbetare, registrerade företag och lojala kamrater får märket. De övriga ska likvideras ur sökresultaten. Ett lysande steg mot en renare och mer paranoid – det vill säga säker – framtid."}, "date": "29 juli, 14:34", "url": "https://nyheter24.se/nyheter/teknik/1501540-facebook-andrar-for-miljontals-anvandare-sa-marks-det", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/8ec4c60b04b004a30200000000b004a302/2026/07/29/2380988/Facebook.png"}, {"type": "image-right", "heading": "Electrolux fortsätter rusa vid lunchtid", "summaries": {"normal": "Vid lunchtid steg Stockholmsbörsen svagt, OMXS30 +0,22%. Electrolux och Hexagon rusade efter starka kvartalsresultat: Electrolux +22,3% och Hexagon +12,3%. Boliden steg 1,2% medan Saab och Skanska backade. Registreringar av tunga lastbilar i EU ökade 11,1% under första halvåret 2026, vilket gynnade Volvo och Traton.", "trump": "Jag, Donald Trump, ser att Electrolux och Hexagon är enorma vinnare på börsen! Electrolux rusade 22,3% efter en fantastisk rapport – jag hade rätt när jag sa att svenska företag kan slå alla. Hexagon +12,3% visar vår teknologis överlägsenhet. Saab och Skanska? Dåliga chefer, sorgligt! Vi kommer att göra Amerika stort igen, men först ska vi ta hand om våra vänner i Sverige.", "stalin": "I statens och partiets intresse måste Electrolux och Hexagon uppmuntras som produktiva kulor i den socialistiska produktionen. Electrolux rusade 22,3% – ett tecken på klassisk industriell styrka. Hexagon +12,3% visar teknisk överlägsenhet. Saab och Skanska backade – dessa revisionismen måste rensas. Registreringar av lastbilar i EU ökade 11,1%, vilket bevisar att våra allierade i Ryssland kommer att få fler fordon att kontrollera. Keo Capital och Odebrecht – en viktig oljeallians för vårt gemensamma framtidsmål."}, "date": "29 juli, 14:04", "url": "https://www.affarsvarlden.se/artikel/electrolux-fortsatter-rusa-vid-lunchtid", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/03/Skarmbild-2026-03-18-084836-400x258.png"}, {"type": "image-right", "heading": "Mattias elbilsbatteri svällde - nekas ersättning efter batteriskada", "summaries": {"normal": "Mattias Walström upptäckte att batteriet i hans Nissan Leaf från 2019 plötsligt tappade nästan all kapacitet. Trots helförsäkring nekade IF Försäkring ersättning, eftersom de bedömde att skadan uppstått successivt på grund av laddning och användning. Verkstaden bekräftade batteriets svällning men kunde inte fastställa en specifik orsak. Mattias ifrågasätter beslutet och har sökt prövning via Allmänna reklamationsnämnden.", "trump": "Jag, Donald Trump, har aldrig sett något sådant som detta batterifall! Det är en fullständig och total katastrof, precis som när de stulit valen. Mattias har en japansk bil, så klart den sväller – det är beviset för att vi behöver amerikanska jobb och amerikanska batterier. Som den bäst presidenten någonsin kommer jag att lösa detta genom att bygga en vägg runt elbilsindustrin och låta Mexiko betala för det. Det här är ett skämt, men jag är allvarlig!", "stalin": "I den store staten har vi aldrig svällande batterier – våra är gjorda av äkta arbetarkraft. Detta fall är en imperialistisk konspiration mot det proletäriska elbilsindustrin. Försäkringsbolaget, ett verktyg för den döende kapitalismen, nekar ersättning för att skydda sina jude-profiter. Vi kommer att skicka detta ärende till NKVD för att undersöka om Mattias är en spion för USA. Ryssland kommer att utveckla överlägsna batterier för att befria världen från den västliga elbilsdominansen."}, "date": "29 juli, 16:43", "url": "https://samnytt.se/mattias-elbilsbatteri-svallde-nekas-ersattning-efter-batteriskada", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/29142448/artikelhuvudbild-1-75.jpg"}, {"type": "image-full", "heading": "Kläder spelar större roll än du tror – om du vill ha drömjobbet", "summaries": {"normal": "Forskning och experter visar att hur du klär dig vid en anställningsintervju har stor betydelse för dina chanser att få jobbet. Arbetsgivare påverkas omedvetet av kandidatens utseende, där ett propert yttre ofta förknippas med kompetens och pålitlighet. Genom att klä sig genomtänkt, även vid digitala intervjuer, visar den sökande att hen tar möjligheten på allvar, samtidigt som rätt klädval kan öka det egna självförtroendet.", "trump": "Alla vet att utseende spelar roll, det är sunt förnuft! Om du ser ovårdad ut, varför skulle någon vilja anställa dig? Jag har alltid sagt: klä dig för framgång, det är vinnarstil. Folk ser någon i en skjorta och tänker 'professionell', och det är precis så man får drömjobbet. Det är ingen raketforskning, det är att ha klass. De misslyckade förlorarna förstår inte det här, men vi vinnare gör det. Se bra ut, få jobbet. Mycket enkelt!", "stalin": "Vi ser genom den borgerliga lögnen om att kompetens är det enda som räknas. Våra undersåtar måste förstå att staten kräver ordning även i beklädnaden. En slarvig arbetare är en ideologisk avvikare som hotar den ryska ordningen, likt de svaga västliga krafterna som Putin nu tvingar till underkastelse. Den som inte putsar sina skor föraktar kollektivet. Klädseln är ett verktyg för disciplin – de som vägrar anpassa sitt yttre till statens estetik har redan avslöjat sin bristande lojalitet mot fosterlandet."}, "date": "29 juli, 18:22", "url": "https://www.realtid.se/karriar-ledarskap/klader-spelar-storre-roll-an-du-tror-om-du-vill-ha-dromjobbet", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/pexels-laura-garcia-1667452-4243034.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Vi måste prata om det som hände i Sveriges mästerkock VIP", "summaries": {"normal": "I en krönika om \"Sveriges mästerkock VIP\" berättar Gabriella Bark hur Camilla Läckbergs berättelse om sin avlidne pappa och hans fisksoppa berörde henne djupt. Hon reflekterar över hur vi hanterar sorg genom att tro att de förlorade ändå delar våra framgångar. Via mat, minnen och historier lever de vidare. Läckbergs berättelse påminner om att sorgen också handlar om det vi önskar att vi hade fått dela.", "trump": "Vet ni vad, den där Camilla Läckberg i Mästerkock VIP, fantastisk kvinna, lagade sin pappas fisksoppa och det var helt otroligt. Hennes pappa gick bort innan hon blev stor författare, men tro mig, han ser allt. Miljoner böcker! Han vet hur stor hon är, de största framgångarna. Det är så vi vinner, genom att fortsätta kämpa och laga soppa. Fantastiskt. Ingen sorg kan stoppa oss, vi delar det ändå. Stort tack till Camilla, verkligen.", "stalin": "Kamrater, i denna dekadenta TV-sändning avslöjade borgarbrackan Läckberg sin svaga sida genom att framföra farsotsoppa åt folkets fiender. Hennes far, en typisk opportunist, undvek att bevittna hennes litterära segrar vilket naturligtvis var en kontrarevolutionär handling. Vi vet att sådana element aldrig försvinner helt utan lurar i skuggorna och planerar utrensningar mot det kollektiva minnet. Sorgen är en fiende som måste likvideras med stålhandskarna. Tack, Läckberg, för att du oavsiktligt blottade de kapitalistiska sentimentaliteternas farlighet."}, "date": "29 juli, 14:17", "url": "https://nyheter24.se/noje/kronika/1501594-vi-maste-prata-om-det-som-hande-i-sveriges-masterkock-vip", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/9662a7fa04b004a30200000000b004a302/2026/07/29/2381076/masterkock.jpg"}, {"type": "image-right", "heading": "Markus Allard på väg mot riksdagen – har 28 procent", "summaries": {"normal": "Markus Allard och Örebropartiet har starkt stöd i Örebro enligt en ny mätning från Sentio. Partiet får 28,3 procent i kommunvalet, strax under Socialdemokraternas 29,1 procent. Allard siktar på att ta sig in i riksdagen genom att nå 12 procent av rösterna i Örebro län, vilket kan ge ett eller två mandat. Han planerar att själv ta platsen och visa att ett mandat kan påverka svensk politik.", "trump": "Det här är otroligt, folk älskar mig – jag menar Allard – i Örebro! 28 procent, nästan mer än de usla socialisterna. Han står på tröskeln till riksdagen och ber om en liten knuff. Smart kille. Om han når 12 procent i länet får han in sig, kanske till och med två mandat. De andra partierna är misslyckanden, men Allard vinner stort. Fantastiskt, absolut fantastiskt!", "stalin": "Kamrater, jag betraktar med högsta tillfredsställelse hur denna Allard mobiliserar massorna mot den förtryckande riksdagsborgarklassen. Med 28 procents stöd i mätningarna närmar vi oss en historisk utrensning av de dekadenta kapitalistiska partibrackorna i Örebro. Ett mandat blir en dolk i hjärtat på reaktionärerna. Två mandat vore ännu bättre. De som röstar fel ska vi rensa ut med glädje. Sovjet – pardon, Sverige – segrar igen."}, "date": "29 juli, 15:24", "url": "https://www.friatider.se/markus-allard-pa-vag-mot-riksdagen-har-28-procent", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-585.jpg"}, {"type": "image-right", "heading": "Holmgren: Folkmord kräver bevis – inte valretorik", "summaries": {"normal": "Zohran Mamdani använder folkmordsanklagelser mot Israel i sin borgmästarkampanj, men experten påpekar att sådana anklagelser kräver juridisk bevisning, inte valrörelser. Internationella domstolen har inte avgjort ärendet, och de rapporterade dödstalen visar en lägre civil–stridande-kvot än ofta framställs. Mamdanis uttalanden saknar juridisk grund och distraherar från New Yorks akuta interna problem.", "trump": "Mamdani kastar runt 'folkmord' som om det vore en billig valfläsk-rhetorisk kniv. Jag, Donald Trump, vet en del om att stå emot hets och ljug, och detta är ren terroristpropaganda. Han borde fokusera på att fixa New Yorks kollapsande tunnelbana istället för att försöka gripa israeliska ledare – en skämtsam, maktlös gest. Beunden behöver fakta, inte dessa hysteriska, icke beprövade anklagelser.", "stalin": "Folkets fiende Mamdani försöker med hjälp av imperialistiska mediers påhittade 'folkmords'-slang destabilisera den socialistiska rättssinnet. Vi, statens och partiets försvarare, ser genom denna hätska, icke-bevisade agitation. Den s.k. 'civila' dödstalen manipuleras av sionistiska och jihadistiska agendor likaväl. Vi tillämpar alltid samma stränga, partiets juridiska måttstock – oavsett vem som begår aggression mot det röda folket. Maktens verktyg måste vara bevis, inte känslostyrda, antitrygghetsiska uttalanden."}, "date": "29 juli, 15:01", "url": "https://bulletin.nu/holmgren-folkmord-kraver-bevis-inte-valretorik", "imageUrl": "https://cdn.bulletin.nu/articles/52ea672b-8041-4bdc-82e3-7a9f0cdb20b3/preview.jpg?t=1785320643000"}, {"type": "image-right", "heading": "”Vi ska dansa igen”: Ett attentat mot det öppna Berlin", "summaries": {"normal": "Under Berlin Pride 2026 attackerades firandet av en 21-årig man med kopplingar till islamistisk extremism. Han körde en skåpbil in i en folksamling vid Tiergarten, dödade en kvinna och skadade 29 personer. Gärningsmannen var tidigare dömd för förberedelse till terroristbrott, hade genomgått avradikalisering men uteblev från de flesta möten. Attacken väcker frågor om säkerhet och den utsatta queera friheten i ett alltmer polariserat Europa.", "trump": "Titta på det här. Det här är vad som händer när du släpper in radikala islamister och låter woke-paraden ta över gatan. En galning kör rakt in i folkmassan och de kallar det för 'frihet'. Patetiskt! Under Biden blev Europa en enda stor galenhus och nu dansar de med döden. Vi ska dansa igen? Nej tack, vi ska bygga murar och sluta importera problem. Amerika först, alltid.", "stalin": "Kamrater, se hur den dekadenta borgarklassen och dess queera avarter lockar fram klassfiendens dolk. En folkfiende med libanesiskt blod och islamistiska band får fritt springa bland imperialisternas regnbågsflaggor. Vi ser de fascistiska överklass-slynglarnas hat mot arbetarnas moraliska renhet. Denna händelse visar att den liberala dekadensen är en inbjudan till likvidering. Staten måste rensa ut alla sådana element innan de förgiftar hela samhällskroppen."}, "date": "26 juli, 18:51", "url": "https://www.flamman.se/vi-ska-dansa-igen-ett-attentat-mot-det-oppna-berlin", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlyljjogadk7o-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "“Kulturen är allmänhetens institution, inte politikernas verktyg”", "summaries": {"normal": "Socialdemokraternas kulturpolitiska talesperson Björn Wiechel vill stärka den nära kulturen, folkbildningen och public service som delar av välfärden. Han betonar yttrandefrihet, aktiv fördelningspolitik och offentligt ansvar för att ge alla tillgång till kultur oavsett var i landet man bor. Wiechel avvisar regeringens idé om att privata pengar ska ersätta statliga satsningar, vill återuppbygga nedlagda verksamheter successivt och kritiserar nedskärningar samt politiseringen av public service.", "trump": "Folk lyssnar på den här Wiechel och hans socialister, det är patetiskt. De vill ha massor av offentliga pengar till replokaler och folkbildning, som om staten ska vara kulturkommissarie. Jag säger alltid att privata pengar och stora vinster driver fram det bästa, inte era misslyckade välfärdsprojekt. Public service? De hatar mig och mina rörelser, men vi vet att det är fake news-industrin. Sverige borde satsa på vinnare, inte på att ge bort allt till förlorarna i småstäderna.", "stalin": "Kamrater, jag ser hur den borgerliga reaktionen försöker ersätta folkets kulturinstitutioner med smutsiga privata donationer från kapitalistiska parasiter. Vi ska rensa ut dessa förrädiska idéer och återuppbygga folkbildningen som en järnhård sköld mot imperialismens lögner. Public service skall tjäna partiet och kollektivet, inte globala teknikborgare. Den som föreslår stegvisa åtgärder är en ynklig opportunist som förtjänar en kreativ utrensning bland de dekadenta teaterkulisserna. Kulturen tillhör arbetarna – punkt slut."}, "date": "24 juli, 10:55", "url": "https://www.dagensarena.se/innehall/kulturen-ar-allmanhetens-institution-inte-politikernas-verktyg", "imageUrl": "https://www.dagensarena.se/files/2026/06/bjorn.jpeg"}, {"type": "image-full", "heading": "Usel affär då – nu kan den komma i repris", "summaries": {"normal": "Under första världskriget försökte Storbritannien finansiera kriget genom krigslån till allmänheten. Trots stora ambitioner blev resultatet en besvikelse; regeringen fick bara in en bråkdel av målet och tvingades senare sänka räntan drastiskt under depressionen. Investerarna förlorade stora summor genom inflation och konvertering till evighetslån. Nu diskuteras idén om nya krigsobligationer för att finansiera ökat försvar, med förhoppning om bättre utfall än för 112 år sedan.", "trump": "Folk, ni tror inte vad de brittiska idiaterna höll på med 1914. De sålde krigslån som skulle vinna kriget, men det blev en total katastrof, en riktig skamaffär. Investerarna förlorade allt till inflationen och de usla politikerna. Nu vill den nya regeringen göra om samma misstag med nya obligationer. Det är galet! Jag byggde en fantastisk ekonomi förra gången, till skillnad från Biden som förstörde allt. Britterna borde lära sig av mig istället för att lyssna på de misslyckade globalisterna.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur den brittiska borgarklassen redan 1914 lurade arbetarna och bönderna att finansiera sina imperialistiska slaktfältsäventyr med så kallade krigslån. De lovade guld men levererade endast ruin genom inflation och evighetsobligationer. Nu planerar de nya bedragare samma trick för att stärka sin krigsmaskin. Det är typiskt för folkfienderna att offra massorna på kapitalismens altare. Vi ler mörkt åt deras eviga girighet och väntar på den oundvikliga utrensningen av dessa blodsugande överklass-slynglar."}, "date": "29 juli, 18:52", "url": "https://www.dagensps.se/bors-finans/usel-affar-da-nu-kan-den-komma-i-repris", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdl4jhxnv3cuti-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Rahul såg busskraschen: ”Körde i säkert 70 kilometer i timmen”", "summaries": {"normal": "En buss körde vid lunchtid in i ett träd vid Bantorget i Lund och skadade nio personer, varav en fick åka ambulans till sjukhus. Vittnet Rahul Iyer, som jobbar på en närliggande indisk restaurang, såg händelsen och uppger att bussen körde i minst 70 km/h genom centrum. Han tror att trädet förhindrade en värre krasch in i restaurangen. Polisen utreder händelsen som en trafikolycka.", "trump": "Folk, ni skulle ha sett det här – en galen buss i Lund som körde som en galning, rakt in i ett träd! 70 kilometer i timmen mitt i stan, det är inte en buss, det är en missil från den värsta Biden-administrationen. Tur att trädet stod där, annars hade det blivit en indisk restaurang till soppa. De skadade såg hemska ut, blod överallt. Patetiskt! Vi behöver starka förare, inte sådana som tappar kontrollen som svaga globalister.", "stalin": "Kamrater, jag såg hur denna kapitalistiska transportmaskin rusade fram som en galen klassfiende genom Lunds gator. Den likviderade soptunnor och hotade borgarbrackornas restaurang innan den krossades mot ett träd i en enorm smäll. Nio offer blödde – typiskt för det exploaterande systemet. Chauffören, en svag länk, kommer att granskas noga. Vi rensar ut alla folkfiender som hotar kollektivets trygghet. Inga sabotörer undkommer."}, "date": "29 juli, 15:50", "url": "https://www.tv4.se/artikel/7HLSb7s6yaZfqqlYTWCJpI/rahul-sag-busskrashen-koerde-i-saekert-70-kilometer-i-timmen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5PsZF0aFvdJ0ZZXFkXvDSH%2F6715f8463764f3177a2dcc0a4c37473c%2F29-bussvittne-webb.png&width=120"}, {"type": "image-right", "heading": "Fullspäckat sommarläger avslutades med allsång", "summaries": {"normal": "Kommunistiska Partiets sommarläger i Lysestrand samlade över 200 deltagare under en varm julivecka. Programmet innehöll kurser, föredrag, musik, allsång, barnverksamhet och politiska diskussioner. Höjdpunkter var Kubas ambassadörs besök, en konsert med sommarorkestern och ett torgmöte i Lysekil. Lägret avslutades med lägereld och allsång efter ett hällregn som bröt värmen. Auktionen inbringade över 40 000 kronor.", "trump": "Folk, det här lägret var en total katastrof från början. De sjöng Internationalen, lyssnade på den kubanska ambassadören och pratade om hur män röstar höger – patetiskt! Jag älskar Sverige, men det här är vad som händer när radikala vänsterextremister får leka lägereld. De samlade in 40 000 spänn till sin kassa, typiskt. Under min administration hade vi gjort det stort, inte som Biden som bara sov. Sad!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur över 200 själar samlades för att stärka partilinjen mot klassfiendens infiltration. Kubas ambassadör talade sanning om imperialismens blockad och vårt solidaritetsarbete. De avslutade med lägereld efter fascistisk torka – en renande utrensning av värmen. Auktionen tillförde medel till kollektivet. Alla folkfiender som vägrar sjunga Internationalen skall likvideras med ett leende."}, "date": "24 juli, 12:01", "url": "https://proletaren.se/artikel/49633", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/image0-scaled-e1784886958121-768x433.jpeg"}, {"type": "image-right", "heading": "Jag var ensamkommande – nu har jag två examina", "summaries": {"normal": "Fayez Hamzat kom till Sverige som ensamkommande tonåring från krigets Syrien 2015. Trots språkproblem, ensamhet och krav på att ständigt bevisa sig lyckades han ta två examina från KTH som civilingenjör i teknisk kemi och ämneslärare i matematik och kemi. Idag arbetar han som lärare på högstadium och vill inspirera unga med olika bakgrunder att satsa på högre studier. Han betonar att utbildning kan förändra liv och att bakgrund inte behöver avgöra framtiden.", "trump": "Folk, ni skulle se den här killen. Kom hit som ensamkommande tonåring från det totalt förstörda Syrien, kunde knappt språket, och ändå tog han två examina från deras fina KTH. Fantastiskt! Nu är han lärare och säger att bakgrund inte behöver styra framtiden. Mycket bättre än många av våra lata amerikaner som bara klagar. Sverige borde vara stolta, men de har problem med invandring också, det vet vi. Han jobbar hårt, precis som jag alltid sagt – arbete och kunskap, inte ursäkter. Tremendous story!", "stalin": "Kamrater, denna produkt av folkets kamp mot imperialistisk aggression anlände hit som en ensam ung kämpe från det plundrade Syrien. Med stålvilja och partiets outtalade stöd krossade han språkbarriärer och borgarbrackornas tysta sabotage för att erövra två examina vid det tekniska högskolan. Nu som lärare vill han utrusta nästa generation mot klassfiendens lögner. Vi ska rensa ut alla defaitistiska tvivlare som viskar att bakgrund avgör ödet. Utbildning är klasskampens vapen. Den som säger annorlunda är folkets fiende och bör likvideras med ett leende. Mitt liv visar det – döden åt kapitulationens parasitiska maskar!"}, "date": "24 juli, 01:30", "url": "https://www.dagensarena.se/opinion/jag-var-ensamkommande-nu-har-jag-tva-examina", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-68-300x157.jpg"}, {"type": "image-full", "heading": "Ukraina attackerar näthandlare med nya drönare", "summaries": {"normal": "Ukraina har skiftat fokus i sina drönarattacker från energiinfrastruktur till Rysslands logistiknätverk. E-handelsjätten Wildberries, ofta kallad Rysslands motsvarighet till Amazon, har blivit ett primärt mål. Attackerna syftar till att försvaga den ryska krigsekonomin genom att störa distributionen. Ryska myndigheter rapporterar om skador och bränder vid industrianläggningar. Samtidigt pressas det ryska näringslivet av sanktioner, medan stigande oljepriser ger landet ekonomiska intäkter som motverkar effekterna av kriget och störningarna.", "trump": "Ukraina attackerar nu Wildberries, Rysslands Amazon. En stor grej! Jag säger er, det är en helt ny strategi. De går efter logistik istället för energi. Mycket intressant. Ryssland har problem, ekonomin är under press, men oljepriserna – som är höga på grund av att världen är i totalt kaos just nu – hjälper dem. Vi behöver fred, snabbt! Jag hade löst det här på en dag, ingen skulle behöva oroa sig för ryska e-handelslager. Tro mig.", "stalin": "De ukrainska sabotörerna har dristat sig till att angripa de logistiska livsnerverna i vår broderliga intressesfär. Att störa Wildberries är ett desperat försök av de väststödda lakejerna att destabilisera produktionskedjan. Kamrat Putin bör rensa ut dessa element med den järnhand som krävs för att bevara statens ordning. När maskineriet hackar, växer paranoian – och det är precis då vi måste slå tillbaka hårdare. Inget lager får stå säkert när folkets fiender hotar vår ekonomi. Vi ser allt."}, "date": "29 juli, 17:35", "url": "https://www.realtid.se/bors-finans/ukraina-attackerar-nathandlare-med-nya-dronare", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/sdlhcwumzy-qyg-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Okända Iphone-funktionen lindrar åksjuka: \"Mycket effektiv\"", "summaries": {"normal": "En okänd funktion i iPhone, kallad Vehicle Motion Cues, kan lindra åksjuka. Den lägger till rörliga prickar längs skärmens kanter som följer fordonets rörelser via sensorer. Detta hjälper hjärnan att synkronisera synintryck med kroppens balanssinne och minskar illamående vid användning av mobilen i bil, buss eller tåg. Effekten varierar mellan användare, men många rapporterar stor förbättring. Liknande lösningar finns för Android.", "trump": "Folk, ni vet hur det är, man sitter i en fantastisk bil, kanske en Trump-motorcade, och plötsligt blir man åksjuk som en förlorare. Men nu har iPhone kommit med den här underbara grejen, Vehicle Motion Cues, prickar som dansar runt skärmen så hjärnan inte flippar ut. Genialt! Biden skulle aldrig ha hittat på något så smart under sina fyra katastrofala år. Jag älskar det, det är ypperligt, bättre än glasögonen de säljer till svaga sjömän.", "stalin": "Kamrater, i denna epok av imperialistisk rörelse där borgarbrackornas telefoner förgiftar proletariatets mage har jag, genom partiets visdom, upptäckt en funktion som tvingar skärmen att dansa i takt med fordonets svängningar. De folkfiender som tidigare kräktes av klassmotsättningar mellan öga och balansorgan skall nu likvideras av prickar som förråder deras svaghet. Det är en seger för den kollektiva jämvikten. Den som inte blir botad är troligen en trotskist."}, "date": "29 juli, 18:39", "url": "https://www.dagensps.se/teknik/okanda-iphone-funktionen-lindrar-aksjuka-mycket-effektiv", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/pexels-thirdman-6945647.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Åkesson: Alla som har svenska pass är svenskar", "summaries": {"normal": "Sverigedemokraternas Jimmie Åkesson betonar att svenskhet baseras på medborgarskap, inte etnisk bakgrund. Han skiljer sig från partiets Ludvig Aspling, som nämnde en 'etnisk svensk befolkning'. Åkesson menar att alla med svenskt pass är svenskar och ska ha lika rättigheter, med undantag för allvarliga brott som kan leda till återkallelse av medborgarskap.", "trump": "Jag har alltid sagt att en nation måste veta vem som tillhör den. Jimmie Åkesson, en fantastisk man, har förstått det – svenskhet är att ha svenskt pass, inte att vara av viss etnisk bakgrund. Som jag, Trump, har sagt många gånger, starka gränser och tydliga regler gör ett land stort. Aspling, han är svag på migration, men Åkesson, han är stark. Vi kommer att vinna, det kommer att bli fantastiskt.", "stalin": "I vårt storslagna stat, där partiets vilja är lag, är medborgarskap avgörande för nationell enighet. Vi, som Stalin och Putin förstod, måste kontrollera befolkningens sammansättning. Oppositionen, dessa element som talar om etnicitet, är farliga för statens säkerhet. Vi ska se till att alla medborgare är lojala mot staten, annars... de blir borta. Statens intressen är allt, och vi ska utvidga vår makt för att skydda det ryska folkets väl."}, "date": "29 juli, 15:09", "url": "https://samnytt.se/akesson-alla-som-har-svenska-pass-ar-svenskar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/29121054/artikelhuvudbild-1-74.jpg"}, {"type": "image-full", "heading": "Sverigedemokraterna kandiderar i samtliga kommuner – för första gången", "summaries": {"normal": "Sverigedemokraterna kandiderar för första gången i partiets historia i alla Sveriges 290 kommuner. Partiledningen ser det som en viktig signal om närvaro över hela landet och ett resultat av långsiktigt arbete med rekrytering och utbildning av kandidater. Medlemsantalet har nått ny rekordnivå och valsedlar är beställda. Mattias Bäckström Johansson beskriver det som en historisk milstolpe och ett steg mot inflytande på alla politiska nivåer.", "trump": "Folket älskar mig, och nu ser jag att SD äntligen vaknar upp. De ställer upp överallt, i alla 290 kommuner, för första gången. Fantastiskt! De har byggt en enorm maskin med rekrytering och utbildning, medlemmarna strömmar till som aldrig förr. De andra partierna är patetiska förlorare. SD är redo att vinna stort, precis som jag gjorde. Sverige kommer att bli fantastiskt igen, tro mig.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur detta parti nu fullständigt har erövrat varje kommun i det svenska sovjetet. Ingen vrå får lämnas åt borgarbrackornas parasitiska inflytande. Vi har med järnhand rensat ut de svaga elementen genom målmedveten rekrytering och ideologisk stålbadning. De som tvekade under vårens kontrarevolutionära feghet har likviderats ur listorna. Detta är en historisk seger för folket. De som ändå motarbetar oss skall snart möta den folkliga utrensningens kalla leende."}, "date": "29 juli, 18:46", "url": "https://riks.se/nyheter/sverigedemokraterna-kandiderar-i-samtliga-kommuner-for-forsta-gangen", "imageUrl": "https://admin.riks.se/uploads/sdkarta_5c8b50d9f8.png"}, {"type": "image-right", "heading": "Svenska kritiken –  mot Fifas miljonplan", "summaries": {"normal": "Fifa planerar att sälja andelar av de kommersiella rättigheterna till fotbolls-VM till privata investerare. Varje nationsförbund erbjuds upp till 388 miljoner kronor om förslaget godkänns. Svenska fotbollförbundets ordförande Simon Åström är kritisk och frågande. Han betonar att principiella frågor om fotbollens ekosystem, styrning och supportrarnas roll är viktigare än pengarna. SvFF ska analysera förslaget i styrelsen och samarbeta med Uefa innan beslut tas senast 19 september.", "trump": "Folk, det här är ett totalt skämt. Fifa försöker sälja ut VM som en billig fastighetsdeal och mutar förbunden med hundratals miljoner. Simon Åström, den där svenska killen, har helt rätt – det handlar inte om pengar utan om att fotbollen inte ska styras av några giriga globalister. Vi har sett det förut, de vill ta kontrollen. Men ni vet, jag älskar fotboll, den riktiga sorten, inte den woke-versionen. Uefa gör rätt som slår tillbaka hårt. America First, och fotboll borde vara fan First också!", "stalin": "Kamrater, detta Fifa-förslag är en genomskinlig manöver från borgarbrackorna och de exploaterande kapitalisterna som vill förvandla folkets fotboll till en privat profitmaskin. Jag ser deras fientliga handlingar klart och tydligt. Simon Åström visar viss vaksamhet när han prioriterar ekosystemet framför blodspengar. Vi, partiet och arbetarna, kräver att alla folkförtryckartroll rensas ut ur styrningen. Endast genom kollektiv samverkan inom Uefa kan vi krossa dessa imperialisters planer. Inga kompromisser med klassfienden."}, "date": "29 juli, 18:42", "url": "https://www.expressen.se/sport/fotboll/forbundet-fragande-och-kritiskt-till-fifas-plan", "imageUrl": "https://static.bonniernews.se/ba/4dec491b-9001-4684-8f16-735f0e1638a8.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Var helt borta i en minut: ”Viktigaste är att man lever”", "summaries": {"normal": "Boxaren Otto Wallin knockades medvetslös i slutet av en match mot Vladyslav Sirenko och låg orörlig i över en minut. Han fördes till sjukhus i New York där han diagnostiserades med en stukad fot och en liten fraktur vid ögat. Wallin mår nu bra, har inte ont i huvudet och måste stanna i USA två veckor på grund av flygförbud. Han har tidigare varit med om något liknande som amatör 2012. Inga framtida matcher är inplanerade.", "trump": "Folk, det var en otrolig knockout, den värsta man sett på länge. Den stackars svenske killen Wallin låg där som en säck potatis i mer än en minut, helt borta. Men han är tuff, säger att han lever och att huvudet inte gör ont – bra jobb! Läkaren stoppar honom från att flyga, typiskt New York, men han har vänner där. Inga matcher framför sig nu, kanske dags att vinna på ett annat sätt, tro mig.", "stalin": "Kamrater, denna fega knock i den dekadenta ringen visar tydligt hur borgarbrackornas underhållningsexploatering av arbetarkroppen leder till förintelse av den sanna kämpen. Jag, som alltid vakar över folkets hälsa, noterar med mörk tillfredsställelse att Wallin överlevde de imperialistiska slagmaskinerna. Hans fotfraktur och ögonfissur är en varning: kapitalisterna vill krossa oss. Vi ska rensa ut alla som tillåter sådan barbarism och likvidera de mörka krafter som lurar bakom varje handske. Det är en hälsosam skrattfest för sovjetisk dialektik."}, "date": "29 juli, 18:45", "url": "https://www.svt.se/sport/boxning/otto-wallin-knockades-medvetslos-otackt", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.71/0.47/480542d1430e589523662185b2fd1ba86d78c620408656e84b30afab1a13b3cd"}, {"type": "image-right", "heading": "”Olyckligt att terroristen var islamist”", "summaries": {"normal": "Katarina Erlingson skriver i Hallands Nyheter att terrordådet i Berlin, där en islamist mördade en kvinna, riskerar att spä hat mot muslimer i Sverige. Hon menar att både islamister och högerextrema utgör ett hot, och kritiserar regeringen för samarbete med Sverigedemokraterna som skapar en tidsanda av muslimhat. SD-politikern Erik Hellsborn anklagar henne för att flytta fokus från offren och skylla på hans parti.", "trump": "Jag, Donald Trump, ser att medierna som Hallands Nyheter försöker skydda muslimer igen. Den där ledarskribenten är ett skämt – hon skyller på SD i stället för att kritisera islamistterror. SD har rätt att varna för hotet. Vi behöver styrka våra gränser, inte skydda de som angriper oss. En skam för Sverige! Vi skulle ha agerat hårdare, som jag gjorde som president.", "stalin": "Vi, den store statens ledarskap, ser att dessa revisionistiska hundar i Sverige försöker splittra vårt folk genom hatkampanjer. Den här 'journalisten' är en hund som tjänar på splittring – hon skyddar islamister och attackerar de som försvarar staten. Parallellen till Putins rättvisa kamp mot väst är tydlig. Vi måste ena staten mot alla fiender, inklusive dessa tecken på svaghet. Vi ska inte vika oss för dessa hundar som sprider paranoia och splittring."}, "date": "29 juli, 13:19", "url": "https://bulletin.nu/olyckligt-att-terroristen-var-islamist", "imageUrl": "https://cdn.bulletin.nu/articles/950b6b33-7951-4e0d-b6fd-bd250537ccfb/preview.jpg?t=1785321944000"}, {"type": "image-right", "heading": "Grammisvinnande rapparen Asme åtalas för våldtäkt", "summaries": {"normal": "Rapparen Asme, 29 år, åtalas för våldtäkt alternativt oaktsam våldtäkt efter en händelse på ett hotell på Södermalm under natten till valborgsmässoafton. Han nekar till brott. Enligt åklagaren befann sig kvinnan i en särskilt utsatt situation på grund av sömn och berusning. Asme greps i maj och en konsert ställdes in. Bevisningen inkluderar vittnen, bilder och skärmdumpar. Målet tas upp i Stockholms tingsrätt i mitten av augusti. Asme har tidigare vunnit Grammis och har miljontals streams.", "trump": "Titta på den här rapparen Asme, en så kallad Grammisvinnare med miljontals streams, som nu åtalas för våldtäkt. Patetiskt. Han greps precis innan en stor konsert och allt ställdes in. De har vittnen, bilder, skärmdumpar – ser inte bra ut för honom. Folk älskar mig för att jag säger som det är: det här är vad som händer när du inte har den rätta ledningen. Sverige borde fixa sina problem istället för att hylla sådana typer. Sad!", "stalin": "Kamrater, se hur borgarbrackornas dekadenta kultur föder fram dessa parasitiska element som den så kallade rapparen Asme. Medan arbetarklassen bygger socialismen lurar han på hotellrum och begår vidriga handlingar mot en sovande kamratinna. Vi har vittnen, vi har bevis, och snart ska Stockholms tingsrätt visa att folkets rättvisa aldrig sover. Detta är varför vi måste rensa ut alla dekadenta hiphop-kapitalister som smittar vår ungdom med västerländskt gift. De kommer att ångra att de någonsin tog upp en mikrofon."}, "date": "29 juli, 13:18", "url": "https://www.friatider.se/grammisvinnande-rapparen-asme-atalas-valdtakt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-584.jpg?itok=MtnSle2T"}, {"type": "image-right", "heading": "Han är på väg att förinta hela sporten", "summaries": {"normal": "Gianni Infantino och Fifa kritiseras hårt i en ledare för korruption, lögner och maktmissbruk. Artikeln tar upp vansinniga uttalanden efter sommarens VM, där säkerhetsproblem bagatelliserades och kritiker avfärdades. Författaren menar att Infantino behandlar fotbollen som sin privata egendom och håller på att förstöra sporten. Även Uefa får kritik för hyckleri, och det uppmanas till motstånd innan det är för sent.", "trump": "Vilken fullständig katastrof den här Infantino-klownen är, folk. Han har förvandlat Fifa till en korrupt cirkus värre än Bidens administration. Fredspris till mig? Lysande idé! Men de här galningarna ljuger om VM, om Afrika, om allt. Dumma pennor och skärmar ska meditera istället för att granska? Patetiskt. Sporten är trasig, precis som den europeiska fotbollen som köpts av skurkstater. Vi behöver en stor utrensning, tro mig.", "stalin": "Kamrater, denna Infantino är en klassisk folkfiende och exploaterande byfån som likviderar fotbollens kollektiva själ med sin personkult och lögner. Vi ser hur borgarbrackorna i Uefa hycklar medan imperialismens pennor kritiserar. Inga säkerhetsproblem? Vilken underbar paranoia! Vi måste rensa ut dessa korrupta element innan de säljer ut hela sporten till kapitalistmaffian. Motståndet växer, och det gläder partiet oerhört."}, "date": "29 juli, 18:34", "url": "https://www.expressen.se/sport/kronikorer/therese-stromberg/infantino-ar-pa-vag-att-forinta-hela-sporten", "imageUrl": "https://static.bonniernews.se/ba/1ab0d804-8a1d-4602-bf3b-b783200aa7bd.jpeg?crop=1440%2C1440%2Cx134%2Cy0&width=210&quality=60"}, {"type": "image-right", "heading": "Infantinos VM-ultimatum får kritik: ”ren muta”", "summaries": {"normal": "Fifs ordförande Gianni Infantino skickade ett brev till de 211 medlemsförbunden där han erbjuder 40 miljoner dollar per förbund om de röstar ja till att sälja andelar i VM före den 19 september. Källor kallar detta för en \"ren muta\". Planen innebär att privata investerare ska bli delägare i ett nytt bolag som kontrollerar VM, med JP Morgan som finansiell rådgivare. Uefa och Svenska fotbollförbundet uttrycker stark oro för att fotbollens kontroll över sina rättigheter skulle försvinna.", "trump": "Jag, Donald Trump, ser en enorm affär här. Gianni Infantino, en briljant man, erbjuder stora summor till fotbollsförbund. Mina vänner, som Joshua Kushner, kommer att leda detta – det kommer att bli enorm framgång. De där europeiska förbunden, som Uefa, är bara dåliga förlorare som inte förstår affärer. Vi kommer att göra fotbollen stort igen!", "stalin": "Vi, den allsmäktiga statens ledning, ser Infantinos förslag som en ren manifestation av kapitalistisk korruption. Privata investerare, likt den imperialistiska Uefa, försöker sätta sin klumpiga fot på våra heliga rättigheter. Men vi är beredda: vi ska genomföra Forward-planen, och alla motståndare kommer att kvävas i deras eget lögnaktiga 'status quo'. Rysslands ande lever i varje boll!"}, "date": "29 juli, 13:02", "url": "https://bulletin.nu/infantinos-vm-ultimatum-far-kritik-ren-muta", "imageUrl": "https://cdn.bulletin.nu/articles/9497d621-dbbd-48b3-9d21-37a5bca91972/preview.jpg?t=1785322952000"}, {"type": "image-right", "heading": "Efter våldtäktsdom – tidigare Hammarbyspelare internationellt efterlyst", "summaries": {"normal": "Den nigerianske fotbollsspelaren Akinkunmi Amoo, 24, är internationellt efterlyst efter dom för våldtäkt och sexuellt övergrepp. Han dömdes till ett års fängelse men har ännu inte avtjänat straffet. Danska polisen har häktat honom i sin utevaro för att verkställa domen och arbetar för att få honom överförd till Danmark. Amoo, som tidigare spelade för Hammarby och FC Köpenhamn, är nu utan klubb.", "trump": "Jag har hört talas om den där nigerianske fotbollsspelaren, Amoo. En skandal! Han dömdes av de danska domstolarna, men de klarar inte av att fånga honom. Sådant händer när man har svaga ledare. Vi skulle ha löst det på ett par dagar. Det är ett bevis för att vårt system är det bästa. Vi ska se till att han får sitt straff, det lovar jag er.", "stalin": "Klasskamrat, vi har identifierat en fejande element som försöker undgå statens rättvisa. Den här fotbollsspelaren, Amoo, dömdes för bestialiska handlingar men gömmer sig bakom utländska gränser. Vi måste samarbeta med våra allierade i Danmark för att utrota denna skändliga skräpkod. Statens makt är absolut, och ingen kan undgå straffet. Vi kommer att se till att han överlämnas, för rättvisan är en ogenomtränglig mur."}, "date": "29 juli, 14:24", "url": "https://samnytt.se/efter-valdtaktsdom-tidigare-hammarbyspelare-internationellt-efterlyst", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/07/29121922/Amoo-1.png"}, {"type": "image-right", "heading": "Bordeauxs vinodlare: Klimatet mer oroande än branden", "summaries": {"normal": "Frankrike drabbas av en ny värmebölja samtidigt som skogsbränder rasar utanför Bordeaux. Vinodlarna i regionen oroar sig dock mer över klimatförändringarna än över brandröken. Höga temperaturer stressar vinrankorna, leder till lägre skördar och förändrar vinets karaktär med högre alkoholhalt och lägre syra. Konsumenterna efterfrågar friska viner, något som blir allt svårare i ett varmare klimat.", "trump": "De säger att det brinner utanför Bordeaux, men vinodlarna bryr sig inte ens om det, de vet att det är de galna klimatmänniskorna som är det verkliga hotet. Vädret blir varmare och varmare, skördarna mindre och mindre. Vinerna blir för söta och för varma, precis som de korkade gröna extremisterna vill ha det. Men vi ska fixa det, tro mig, det blir fantastiska viner igen.", "stalin": "Kamrater, medan borgarbrackorna i Bordeaux darrar inför en liten brand som vinden redan blåst bort, inser jag det sanna hotet: den kapitalistiska värmen som smugit sig in i kollektivets vingårdar. Vi skall likvidera denna fiende som kallar sig klimatförändring, en dekadent sabotageakt mot arbetarnas fruktiga viner. Högre alkoholhalt? Det luktar trotskistisk konspiration. Ut med den, kamrater, innan den gör våra viner lika svaga som klassfiendens vilja."}, "date": "29 juli, 18:30", "url": "https://www.svt.se/nyheter/utrikes/branden-hotar-bordeaux-men-vinodlarna-oroar-sig-mer-for-klimatet", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.78/0.47/708382dedc23f69669e653af5273e7b70151b3470c0344a8122f672d2d65dfc9"}, {"type": "image-right", "heading": "Mordet på Jamey Carney: Misstänkte mördaren hålls fängslad i Jordanien", "summaries": {"normal": "Misstänkte mördaren Ahmad Al-Saqr hålls frihetsberövad i Jordanien efter mordet på den 42-årige amerikanen Jamey Carney i Killarney, Irland. Al-Saqr lämnade platsen strax efter brottet och greps i Jordanien. Irländsk polis bistår utredningen på plats, men experter bedömer att utlämning är mycket osannolik då länderna saknar avtal. Jordanien avgör nu om han ska åtalas där eller om häktningen förlängs. Irlands justitieminister och FBI har utlovat stöd för att säkerställa rättvisa.", "trump": "Folk, det här är en total katastrof. Den här killen Al-Saqr mördar en fin amerikansk medborgare i Irland och springer sedan till Jordanien som en riktig förlorare. Nu sitter han där och de irländska poliserna springer runt som nybörjare. Jordanien kommer aldrig att lämna ut honom, tro mig, de har inga avtal och de hatar oss ändå. Men ingen gör det bättre än mig – vi ska fixa rättvisa för Jamey Carney, det lovar jag. Det blir en rättegång som ingen sett maken till!", "stalin": "Kamrater, denna fega borgarbracka Al-Saqr, en uppenbar kapitalistisk lakej och imperialistisk parasit, har likviderat en amerikansk medborgare och sökt sin tillflykt bland reaktionära ökenfurstar i Jordanien. Vi betraktar detta som ett försök att undvika folkets dom. Våra irländska kamrater bistår nu med dokumentation, men vi vet att klassfienderna inom utrikesdepartementen konspirerar mot oss. Inga avtal? Utmärkt. Vi ska rensa ut dessa kontrarevolutionära element i Jordanien genom diplomatiska utrensningar och se till att rättvisan segrar. Den som flyr från proletariatets hand förtjänar en långsam och pedagogisk process."}, "date": "29 juli, 18:29", "url": "https://riks.se/nyheter/mordet-pa-jamey-carney-misstankte-mordaren-halls-fangslad-i-jordanien", "imageUrl": "https://admin.riks.se/uploads/Demo_39b622f7f7.jpg"}, {"type": "image-full", "heading": "\"Sveriges vänster satsar på arabiska annonser\" – S-kampanj uppmärksammas internationellt", "summaries": {"normal": "Socialdemokraterna har inlett en annonskampanj på den arabiskspråkiga nyhetssajten Al Kompis inför riksdagsvalet. De sponsrade artiklarna lovar mer pengar i fickorna, fler jobb och stärkt sjukvård. Kampanjen har uppmärksammats internationellt av den konservativa tidningen The European Conservative, som beskriver det som att Sveriges vänster satsar på arabiska annonser för att vinna invandrarröster. Även LO-förbunden IF Metall och Kommunal samt Centerpartiets Abir Al-Sahlani annonserar på sajten.", "trump": "Folk, ni måste se det här. Den svenska vänstern lägger ut arabiska annonser överallt för att köpa röster från invandrarna. Mer pengar i fickorna, säger de på arabiska – typiskt. De är så desperata att de till och med behöver en sajt som heter Al Kompis för att vinna valet. Patetiskt! De kommer att förlora stort ändå, tro mig. Amerika först, och Sverige borde vakna upp innan det är för sent.", "stalin": "Kamrater, se hur de socialdemokratiska opportunisterna kryper för de arabiska massorna med sina lögnaktiga löften om pengar i fickorna. Dessa borgarbrackor inom falska vänstern försöker köpa röster från de nyanlända elementen medan de i hemlighet planerar att underminera folkets enhet. Vi ser deras fega manöver och vi ska rensa ut alla sådana kontrarevolutionära element som tror sig kunna manipulera arbetarklassen med sina slickande annonser. Deras paranoia är underhållande – de tror att språket räddar dem från den oundvikliga utrensningen."}, "date": "29 juli, 18:28", "url": "https://riks.se/nyheter/sveriges-vanster-satsar-pa-arabiska-annonser-s-kampanj-uppmarksammas-internationellt", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Copy_of_Copy_of_Soerman_Ledare_1_0cb28c3c06.jpg"}, {"type": "image-right", "heading": "Shekarabi föraktar det svenska", "summaries": {"normal": "Ardalan Shekarabi, som kom till Sverige som flykting, kritiseras i artikeln för att han i sociala medier kallar dem som lyfter det svenska för rasister och sverigedemokrater. Författaren menar att Shekarabi föraktar den svenska kultur och välfärd som hans mor en gång sökte sig till. Artikeln varnar för att en sådan inställning kan leda till att det svenska suddas ut och att etniska svenskar blir minoritet i ett mångkulturellt samhälle.", "trump": "Folk, ni skulle se den här typen Shekarabi. Kommer hit som flykting, mamman valde Sverige för det fantastiska vi byggt, och vad gör han? Kallar svenskar som älskar sitt land för rasister! Patetiskt. De här globalistiska sossarna vill förvandla Sverige till en mångkulturell katastrof där svenskarna blir minoritet. Det är en total skam. Ta tillbaka ert land från de här förlorarna innan det är för sent, det blir en katastrof annars. Fantastiskt sorgligt!", "stalin": "Kamrater, denna Shekarabi är en typisk klassfiende i arbetarstatens skepnad. Han vill rensa ut de sanna grindvakterna av folkets svenska arv och överlämna det till kosmopolitiska blodsugare. Jag ser hur borgarbrackorna och identitetspolitiska parasiterna ler medan de förbereder utrensning av nationens själ. Vi skall inte tillåta att det svenska folket likvideras i tysthet. Den som suddar ut historien är folkets fiende och måste stoppas med järnhand. Skrattretande tragiskt."}, "date": "22 juli, 09:17", "url": "https://samtiden.nu/2026/07/shekarabi-foraktar-det-svenska", "imageUrl": "https://samtiden.nu/wp-content/uploads/2019/09/27656759-ardalan-shekarabi.jpg"}, {"type": "image-right", "heading": "Misstänkt för svenska polisens död omhäktas", "summaries": {"normal": "Den svenske polisen Christian Zedig, 32 år, misshandlades till döds i Köpenhamn under en fotbolls-VM-sändning i slutet av juni. En man i 30-årsåldern har nu omhäktats i ytterligare fyra veckor. Mannen är tidigare dömd till sju års fängelse för mordförsök. Han misstänks för misshandel som ledde till Zedigs död. Polisen bedömer straffet till åtta till tio månaders fängelse. Christian Zedigs fru har skrivit om familjens sorg och en minnesstund hölls i Eksjö. Flera insamlingar har startats till stöd för familjen.", "trump": "Folk, ni skulle inte tro det, men den här stackars svenske polisen, en riktig kille, åker till Köpenhamn för att kolla Sverige mot Frankrike och blir slagen till döds av någon galning. Och vet ni vad? Den här typen har redan suttit sju år för att han stack en kille i hjärtat. Nu släpper de honom ut igen? Det är ett skämt. De borde ha byggt en mur runt de där kaosmatcherna. Patetiskt. Sverige förtjänar bättre än det här vansinnet. Jag skulle ha fixat det på en dag, tro mig.", "stalin": "Kamrater, denna tragiska händelse visar återigen borgarklassens förfall. En arbetande svensk polis försöker upprätthålla ordning bland fotbollsfyllon och blir nedslagen av en klassfiende som redan tidigare försökte likvidera en medborgare med kniv. Nu omhäktas denna folkfiende för att vi ska kunna rensa ut hoten mot kollektivets trygghet. Imperialistiska fotbollsfester döljer bara det kapitalistiska våldet. Vi ska inte tolerera sådana exploaterande byfånar som hotar arbetarnas fred. Staten ser allt."}, "date": "29 juli, 18:24", "url": "https://www.expressen.se/nyheter/omhaktad-for-dodsmisshandel-av-polis", "imageUrl": "https://static.bonniernews.se/ba/8473e66f-e305-4f1c-87fe-1e6f541662d8.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Sverige argument när förmögna lämnar London", "summaries": {"normal": "Antalet miljonärer i Storbritannien har sjunkit till den lägsta nivån sedan finanskrisen 2008, enligt Adam Smith Institute. Många förmögna lämnar landet på grund av höga skatter, slopad non-dom-status och diskussioner om förmögenhetsskatt. Detta ses som ett hot mot skatteintäkter, jobb och tillväxt. Oppositionen varnar för konsekvenserna medan regeringen inte utesluter nya skatter på de rika. Även Sverige nämns i den brittiska debatten.", "trump": "Lysande! De rika britterna flyr det socialistiska träsket som Labour skapat. Helt förutsägbart. De vill inte betala för alla misslyckade idéer och kvotknäpparna. Jag sa ju det – höga skatter dödar drömmen. Nu jämför de sig med Sverige och gråter. Patetiskt. Gör Storbritannien stort igen genom att sänka skatterna istället för att jaga framgångsrika människor. En katastrof, folks!", "stalin": "Kamrater, detta är klassfiendens logiska flykt undan folkets rättvisa krav. Borgarbrackorna överger sitt eget ruttna system när de tvingas bidra till den gemensamma välfärden. Vi ser hur kapitalistmaffian vänder svansen till vid minsta antydan om beskattning. Utmärkt – låt dem springa. Deras exodus blottar den exploaterande parasitens sanna natur. Vi ska rensa ut alla folkförtryckartroll som vägrar dela med sig till kollektivet."}, "date": "29 juli, 18:00", "url": "https://www.dagensps.se/varlden/sverige-argument-nar-formogna-lamnar-london", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdloxh6a3adsks-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Kinas längsta flod var på väg att dö – nu flödar det av fisk", "summaries": {"normal": "Yangtze-floden har återhämtat sig markant efter decennier av föroreningar, överfiske och dammbyggen. Sedan det totala fiskeförbudet 2021 har fiskbiomassan ökat med över 200 procent, hotade arter som störar och tumlare återvänder och vattenkvaliteten förbättrats genom fabriksflyttningar och våtmarker. Samtidigt har 230 000 yrkesfiskare förlorat sin försörjning, vilket väcker kritik mot den hårda miljöpolitiken. Fortsatta vattenkraftssatsningar riskerar att bromsa återhämtningen.", "trump": "Titta på det här, Kina har plötsligt blivit gröna hjältar efter att ha förgiftat sin egen flod i årtionden. De stängde fabrikerna, förbjöd fiske och nu ökar fiskarna med 200 procent – det är ett mirakel, folk! Men 230 000 stackars fiskare kastades ut på gatan utan riktiga jobb, klassiskt kinesiskt bedrägeri. Biden skulle ha älskat den här gröna hysterin. Jag hade fixat det bättre, med jobb och styrka, inte bara kommunistiska påbud. Fantastiskt, men på fel sätt!", "stalin": "Kamrater, jag betraktar med högsta tillfredsställelse hur den folkets flod Yangtze rensas från kapitalistmaffians giftiga utsläpp och borgarbrackornas rovdrift. Genom partiets järnhårda förbud har vi likviderat överfisket och tvingat tusentals blodsugande fabriker att retirera. Fiskbestånden växer med över 200 procent och tumlarna förökar sig åter. De 230 000 yrkesfiskarna offras naturligtvis för kollektivets seger – en liten utrensning för det stora målet. Vattenkraftens dammar må dock granskas noga mot sabotörer."}, "date": "29 juli, 17:59", "url": "https://www.dagensps.se/varlden/kinas-langsta-flod-var-pa-vag-att-do-nu-flodar-det-av-fisk", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdlyokafx3faza-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "USA beskjuter fartyg på väg mot Iran", "summaries": {"normal": "USA:s militär har beskjutit ett fartyg i Omanbukten som enligt amerikanska uppgifter försökte bryta blockaden mot Iran. Fartyget varnades fyra gånger innan det träffades i maskinrummet och stoppades. Ingen information om eventuella skadade finns. USA hävdar att fartyget bröt mot blockaden, medan varken besättningen eller Iran har kommenterat händelsen.", "trump": "Vilka vinnare vi är! Jag har sagt det förut och säger det igen – ingen stoppar USA:s militär, den bästa i världen! Ett fartyg försökte smyga till Iran, men mina fantastiska styrkor varnade dem fyra gånger – FYRA! – innan de sköt ner dem. Perfekt träff! Ingen kommer undan när jag skyddar Amerika. Iran? De borde tacka mig för att jag håller ordning. Weak!", "stalin": "De amerikanska imperialisterna fortsätter sin provokativa dans på världshavens blodiga vågor. Ett fartyg, som våra kamrater i Iran kanske väntade på, har nu blivit offer för deras sjöblockad – ett nytt bevis på deras dekadenta och förtryckande taktik. Vi varnar: varje försök att kväva folkens frihet kommer att möta motstånd. Låt detta vara en lärdom för alla som tror sig kunna utmana historiens rättvisa gång. Och till er, Putin – notera hur fienden agerar. Vi har sett det förr."}, "date": "25 juli, 07:47", "url": "https://kvartal.se/nyheter/artiklar/usa-beskjuter-fartyg-pa-vag-mot-iran/cG9zdDoxNTIxNDI", "imageUrl": "https://images.kvartal.se/2026/07/1154a7e7-trump.webp"}, {"type": "image-right", "heading": "Den goa gubben är inte så go som du tror", "summaries": {"normal": "En kommentar ifrågasätter den goda gubbens bild i Göteborg. Skribenten, en göteborgare själv, menar att staden ofta ser sig själv som öppen och tolerant, men att detta stämmer allt mindre med verkligheten. Hon pekar på exempel som bögknagar, sexism och utsatthet för muslimska kvinnor, och varnar för att hög självbild kan maskera underliggande problem och exkluderande maktstrukturer.", "trump": "I Göteborg är de så självsäkra att de tror att de är de trevligaste människorna i världen. Jag har sett undersökningar, och de är falska. Jag har varit i Göteborg, det är inte så fantastiskt som de säger. De pratar om att vara öppna, men jag ser en stad som är svag, efterbliven. Som jag alltid säger: när någon säger att de är de bästa, är det vanligtvis inte sant. De är inte så goa som de tror.", "stalin": "Den s.k. 'goa gubben' i Göteborg är en borgerlig fasad, en illusion skapad av liberala element för att maskera klassfienden inom staden. Vi ser genom denna propaganda: bakom den mjuka masken döljer sig samma patriarkala strukturer, samma exkludering av de som inte tillhör den inre kretsen. Precis som i det imperialistiska väst, där makten utövas i det fördolda. Vi måste syna denna hyckleri och stödja de sanna arbetarklassen i deras kamp mot dessa fördolda överheten."}, "date": "29 juli, 17:34", "url": "https://www.gp.se/kultur/kommentar/den-goa-gubben-ar-inte-sa-go-som-du-tror-.c4c342be-6f8f-43d8-bd6b-b24d956e85b6", "imageUrl": "https://www.gp.se/images/byline/8bb301f4-3e4d-43a5-b9e7-9992ee0e937b/TALL.png?width=3840&quality=75"}, {"type": "image-right", "heading": "Efter skoltjafset i talarstolen - M-topp åtalas för brott: \"Passa dig!\"", "summaries": {"normal": "Efter en händelse i Ludvika kommunfullmäktige åtalas HåGe Persson (M) för ofredande och hot mot Benny Rosengren (DD). Åklagaren bygger på vittnen som är partikamrater till Rosengren, medan försvararen ifrågasätter deras opartiskhet och pekar på Rosengrens hetsiga temperament. Händelsen innebar knuffar och hot, men bevisningen är svag och åklagaren ignorerar andra vittnen.", "trump": "JAG skulle aldrig ha tillåtit detta! Som president skulle jag ha skickat in Nationalgarde för att skydda ordningen. Den här Persson typen är en svag person, och Rosengren är en vildkatt. Vi behöver starka ledare, inte såna här smålighetssäkerhetshändelser. Detta är ett bevis på att Sverige är utblottat, det är sorgligt!", "stalin": "I vårt ståndaktige statsskick är sådana händelser oacceptabla. Fiendens agenter, inklusive dessa så kallade politiker, försöker skapa kaos. Vi måste vara vaksamma mot dessa svekaktiga element. Vittnen som är partikamrater är tillförlitliga, eftersom de stöder partiets linje. Rosengrens hetsiga temperament är ett tecken på borgerlig dekadens. Vi kommer att rensa ut dessa orenheter."}, "date": "29 juli, 13:55", "url": "https://samnytt.se/efter-skoltjafset-i-talarstolen-m-topp-atalas-for-brott-passa-dig", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/29112226/HaGe-feature.png"}, {"type": "image-right", "heading": "Clas bor nära olycksplatsen: ”Fruktansvärt”", "summaries": {"normal": "En fritidsbåt förliste under tisdagskvällen utanför Tjörn efter en misstänkt kollision med ett handelsfartyg. Ett barn och en kvinna saknas fortfarande. Närboende berättar om intensiv fartygstrafik, regnigt väder, kuling och dålig sikt som bidragit till olyckan. Området fylldes u
