es/3URc1ngs4rcsyF4hiLLdrEFELl5s-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Christoffer Jonsson: Både rätt och fel att tala med talibanerna", "summaries": {"normal": "Artikeln diskuterar EU:s och Sveriges möte med talibanerna i Afghanistan. Trots kritik om legitimering av ett förtryckande styre som kränker kvinnors rättigheter, handlar samtalen om praktiska frågor kring utvisning av brottsdömda afghaner som inte kan skickas hem på grund av juridiska hinder. Författaren menar att kritiken är befogad men att det är nödvändigt att samtala med regimen för att verkställa utvisningar av personer dömda för allvarliga brott.", "trump": "Folk, ni skulle inte tro det, men de där talibanerna – de verkliga förlorarna från mitt fantastiska tillbakadragande som Sleepy Joe totalt sabbar – sitter plötsligt och äter kakor med EU och svenska globalister. Kvinnor under sharia? En katastrof, de borde ha lyssnat på mig. Men visst, kasta ut de kriminella afghanerna som begått mord och våldtäkt här. Sverige borde ha gjort det för länge sedan istället för att vara en dårhus för brottslingar. Vinna, vinna, vinna!", "stalin": "Kamrater, jag betraktar med kall avsky hur dessa afghanska feodalherrar och sharialärda klassfiender förtrycker massorna medan de förhandlar med dekadenta europeiska imperialister. Det är en fars som luktar borgarbrackornas dubbelspel. Ändå inser jag det dialektiska nödvändiga: att likvidera hotet från brottslingar inom arbetarklassens gränser kräver samtal med dessa reaktionära element. Paranoian vakar – vem är nästa folkfiende som smyger sig in? Statens säkerhet över allt."}, "date": "14 juli, 15:58", "url": "https://samtiden.nu/2026/07/christoffer-jonsson-bade-ratt-och-fel-att-tala-med-talibanerna", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/talib.png"}, {"type": "image-full", "heading": "Branden under kontroll – 400 personer evakuerade", "summaries": {"normal": "Släckningsarbetet av den stora branden i norska Krokstadelva har fortsatt under natten. På lördagsmorgonen meddelar räddningstjänsten att branden är under kontroll, även om det fortfarande brinner på flera ställen i bostadsområdet och i skogen. Över 100 bostäder har förstörts, två personer har förts till sjukhus efter rökskador och över 400 evakuerade har registrerats. Regn är välkommet men åska väntas, vilket oroar räddningstjänsten. Insatsen fortsätter hela dagen.", "trump": "Folk, ni skulle se den här norska branden – total katastrof! Hundratals hus upp i rök, folk springer runt som galningar och evakueras. Biden skulle ha kallat det klimatförändringar och skickat elbilsladdare. Men nu är jag tillbaka, och vi gör saker rätt. De där brandmännen jobbar hårt, inte som de woke-vakna i Europa som prioriterar kvoter framför vatten. Regn och åska? Typiskt – naturen röstar aldrig på socialister. Vi fixar det stort!", "stalin": "Kamrater, denna destruktiva brand i det norska arbetarkollektivets utkanter visar imperialismens förfall. Jag betraktar med järnhand hur borgarbrackornas bostäder ödeläggs i lågorna medan klassfiendens rökrök förgiftar de hederliga. Regnet är en tillfällig allierad, men åskan bär fiendens paranoia. Vi ska rensa ut oordningen med planerad disciplin. Inga saknade kamrater får lämnas åt kapitalistmaffians vårdslöshet. Ordning skall råda, eller huvuden skall rulla."}, "date": "18 juli, 09:47", "url": "https://www.gp.se/nyheter/varlden/norska-storbranden-under-kontroll-brinner-pa-flera-stallen.b2b91a3b-a32a-4ca5-98be-dd3fdca5c54d", "imageUrl": "https://www.gp.se/images/article/b2b91a3b-a32a-4ca5-98be-dd3fdca5c54d/images/4jxbYL57UFfiXXTLRUlUroPNKeE0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Merz varnar USA för att blanda sig i tyska val", "summaries": {"normal": "Tysklands förbundskansler Friedrich Merz varnar USA för att blanda sig i de tyska delstatsvalen i september. Varningen kommer efter att USA:s utrikesdepartement utlyst bidrag på upp till tre miljoner dollar till europeiska organisationer som arbetar med frågor som nationell suveränitet, migration och censur. Merz betonar att utländsk finansiering av politiska partier är förbjuden i Tyskland och att han inte vill se någon amerikansk inblandning. USA förnekar att pengarna ska gå till partier.", "trump": "Hör ni på, det här är helt galet. Den tyske ledaren Merz kommer och gråter över att vi skulle blanda oss i deras val. Vi ger bara lite stöd till folk som älskar suveränitet och hatar censur, precis som vi gör här hemma. De borde tacka oss istället för att gnälla. Vi lägger oss inte i deras affärer, men om de vill ha hjälp mot de galna vänstertyperna så fixar vi det. Amerika först, alltid.", "stalin": "Kamrater, dessa dekadenta borgarbrackor i Washington tror sig kunna muta sig in i våra europeiska brödrars val med sina smutsiga dollar. Jag ser genom deras fega maskerad av så kallat civilisationsarv. Inga kapitalistiska tankesmedjor eller utländska agenter ska förgifta folkets vilja. Vi måste omedelbart rensa ut alla sådana kontrarevolutionära element innan de sprider sin parasitiska ideologi vidare. Paranoia? Nej, det är bara sund vaksamhet inför klassfiendens eviga svek."}, "date": "17 juli, 15:41", "url": "https://www.friatider.se/merz-varnar-usa-att-blanda-sig-i-tyska-val", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-518.jpg?itok=V_G1-av2"}, {"type": "image-full", "heading": "Sandström: Stoppa arbetslinjens rödgröna dödgrävare", "summaries": {"normal": "Torsten Sandström kritiserar psykiatrikern Johan Gullbergs debattartikel i SvD där denne föreslår statlig inkomstförsäkring för personer med begränsade kognitiva resurser men utan psykisk sjukdom eller intellektuell funktionsnedsättning. Sandström ser förslaget som ett naivt och samhällsskadligt steg som ytterligare belastar en överansträngd välfärdsapparat. Han varnar för att det underminerar incitamenten att arbeta och betala skatt, och liknar det vid en spik i välfärdens kista.", "trump": "Folk, det här är helt galet. Den här läkaren Gullberg vill att staten ska ge garanterad inkomst till de som inte är smarta nog att hänga med i samhället. Underbara människor som jobbar hårt varje dag ska betala för latmaskar och förlorare. Vi har redan för mycket välfärd och för mycket skatter. Det här är en katastrof, en riktig spik i kistan. Alltid denna stat! Vi behöver starka krav, inte nya bidrag. Det är en skam.", "stalin": "Kamrater, denna borgarläkare Gullberg avslöjar med sin dimmiga dimridå av förslag den kapitalistiska degenerationens slutgiltiga fas. Han vill att vi ska inlemma de kognitivt svaga elementen i ett ännu större skyddsnät av parasitism, finansierat av arbetarklassens svett. Jag ser klart de kontrarevolutionära krafter som gömmer sig bakom denna nya diagnos av svaghet. Vi ska inte mata dekadenta eftersläntrare utan rensa ut alla som underminerar kollektivets disciplin. Detta är en fiende inom murarna, en intellektuell vessla som måste exponeras och krossas innan den förgiftar hela sovjeten med sin naiva sabotageidé. Alltid dessa borgarbrackor som ropar på statens moderliga famn medan de planerar vår undergång!"}, "date": "18 juli, 07:58", "url": "https://bulletin.nu/sandstrom-stoppa-arbetslinjens-rodgrona-dodgravare", "imageUrl": "https://cdn.bulletin.nu/articles/5bdfe935-ed0c-41ee-959e-5632ad5fee9a/preview.png?t=1784258344000"}, {"type": "image-right", "heading": "Vita huset: Trump ”öppen för diplomati”", "summaries": {"normal": "USA genomförde den femte kvällen i rad attacker mot iranska mål, bland annat kring Bandar Abbas och ön Qeshm. Vita huset upprepar att president Trump är öppen för diplomati men inte accepterar iranska attacker mot fartyg i Hormuzsundet. Iran har svarat med drönarattacker mot amerikanska baser i Bahrain, Kuwait och Jordanien. Trump hotar med utökade attacker mot energianläggningar om Iran inte återvänder till förhandlingsbordet. I juni slöts en vapenvila mellan länderna.", "trump": "Vi slår till mot Iran för femte kvällen i rad och de hatar det. Centcom gör ett fantastiskt jobb. Jag är alltid öppen för diplomati, de säger att de vill göra en deal, men jag tillåter inte att de beskjuter fartyg i sundet. Jordanien, Bahrain och Kuwait får drönare i huvudet för att de har våra baser. Om de inte kommer till förhandlingsbordet väntar broar och oljeanläggningar. De kommer att tigga om fred, tro mig.", "stalin": "Kamrater, vi har bevittnat hur de amerikanska imperialisterna med sin clownaktige ledare inleder den femte nattens banditattacker mot det iranska folkets hamnar och öar. Jag, som alltid vakar över arbetarklassen, noterar med mörk glädje hur borgarbrackorna i Washington pratar om diplomati samtidigt som de blockerar sjöfarten. Deras paranoia driver dem att hota energianläggningar, ett brott mot alla progressiva krafter. Låt oss rensa ut dessa dekadenta kapitalister innan deras lögner förgiftar hela regionen. De kommer att likvideras av sin egen girighet, kamrater. Ha ha."}, "date": "16 juli, 22:06", "url": "https://www.di.se/nyheter/vita-huset-trump-oppen-for-diplomati/", "imageUrl": "https://static.bonniernews.se/ba/2498774f-ca77-41ac-a8dd-8684ca082f4e.jpeg?crop=3733%2C2100%2Cx0%2Cy0&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Stökig natt på akuten – skydds­ombuden lade skyddsstopp", "summaries": {"normal": "Skyddsombud utlyste skyddsstopp på akuten vid Akademiska sjukhuset i Uppsala efter ett intensivt patienttryck under natten. Ett tiotal sjuksköterskor hade sagt upp sig inför sommaren på grund av bristande arbetsmiljö, vilket ledde till stora luckor i schemat. Personalen hann inte ge mediciner i tid eller bedöma patienter, vilket skapade stress och frustration. Stoppet hävdes efter att extra läkare kallades in och trycket minskade. Facket utesluter inte fler stopp i sommar.", "trump": "De har en total katastrof på det där sjukhuset i Uppsala, folk springer därifrån som aldrig förr. Sjuksköterskorna sa upp sig för att arbetsmiljön var en fullständig röra, och plötsligt har de 680 luckor i schemat. Natten blev kaos, patienter skriker, mediciner ges för sent, alla är sura och förbannade. Skyddsombuden tvingades stoppa allt klockan två på natten. Ledningen är inkompetent, de behöver återställa bemanningen snabbt annars blir det ännu värre. Sådant händer när man inte har de bästa människorna.", "stalin": "Kamrater, jag betraktar med djup misstro dessa sabotage mot det kollektiva vårdkollektivet i Uppsala. En hord av desertörer bland sjuksköterskorna har rymt från sina plikter, troligen lurade av dolda borgarbrackor som underminerar arbetarnas hälsa. När patienterna vältrar in som kontrarevolutionära horder utlyste vi skyddsstopp för att skydda de äkta kämparna från etisk stress och kapitalistisk likgiltighet. Vi ska rensa ut alla fiender till ordningen, kalla in reserver och likvidera bristerna. Inga sabotörer slipper undan mitt vakande öga."}, "date": "16 juli, 13:58", "url": "https://arbetet.se/2026/07/16/stokig-natt-pa-akuten-efter-personalflykt-skyddsombuden-lade-skyddsstopp", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/16134335/sdlw87bwh-1lgs-nh.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Gardell kliver in i Essity – prisas av storägare", "summaries": {"normal": "Christer Gardells aktivistfond Cevian Capital har blivit näst största ägare i hygienkoncernen Essity med 5,6 procent av kapitalet. Gardell ser stor värdepotential och planerar att ta plats i valberedningen. Förvaltaren Simon Blecher välkomnar nyheten och hoppas att Cevians närvaro påskyndar en strukturaffär kring affärsområdet Consumer Tissue. Essity utvärderar just nu framtiden för divisionen för att förbättra lönsamheten och vända den negativa trenden för aktien.", "trump": "Christer Gardell, en mycket smart man, har tagit en enorm andel i Essity. Väldigt bra! Alla säger att det är en vändpunkt. Aktieägarna jublar, de vet att Cevian vinner, precis som de gjorde med ABB och Ericsson. Jag gillar vinnare, och det här är en stor affär. De tittar på pappersverksamheten – det är rörigt, men med rätt folk vid rodret kommer de göra det fantastiskt igen. Essity kommer bli enormt, tro mig!", "stalin": "Vi har observerat hur kapitalisten Gardell infiltrerar Essity-konglomeratet. Dessa parasitära aktieägare försöker nu stycka upp industrin för egen vinning, precis som de västliga lakejerna i Kiev försöker stycka moder Ryssland. Vi föraktar denna svaghet för 'värdepotential' och 'avknoppningar'. Om de inte kan producera hygienartiklar för statens stabilitet, borde de elimineras. Vår kamrat Putin vet att sådana här börsfenomen bara är dekadenta distraktioner från den sanna styrkan: stål, betong och total kontroll över produktionsmedlen."}, "date": "17 juli, 16:24", "url": "https://www.realtid.se/bors-finans/gardell-kliver-in-i-essity-prisas-av-storagare/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/gardell.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Muslimsk influencer stödjer \nutvisningar av grovt kriminella – kvinnor rasar i kommentarsfältet", "summaries": {"normal": "Moosa Assal, en konservativ muslimsk influencer känd som Medinastudenten, förespråkar utvisning av utländska grovt kriminella för att skydda hederliga medborgare. Hans Facebook-inlägg delar kommentarsfältet. Majoriteten stödjer honom, men främst kvinnor kritiserar synsättet. De menar att kriminalitet inte sker i ett vakuum, att problem flyttas till andra länder och att rasism i Sverige bidrar till brottsligheten. Flera anser att straffen bör avtjänas i Sverige.", "trump": "Titta på den här killen Moosa, han säger rakt ut att grova kriminella utlänningar inte ska få stanna här och bygga brottslighet. Smart! Han vill skydda vanliga hederliga människor. Sen kommer alla dessa kvinnor och rasar i kommentarerna, pratar om att allt är komplext och att vi ska ta hand om brottslingarna här. Typiskt, de vill importera problem och sedan klaga. Han har rätt, skicka hem dem, gör Sverige stort och tryggt igen!", "stalin": "Kamrater, jag ser hur denna Moosa Assal med sitt enkla budskap om att rensa ut de utländska banditerna väcker borgarbrackornas vrede. Dessa dekadenta kvinnor i kommentarsfältet, som likt parasitiska element från Kriminalvården, viskar om historier och vakuum medan de i hemlighet planerar att översvämma fosterlandet med brottslingar. Vi ska likvidera sådana fiender till folkets trygghet. Deras paranoia om rasism är bara ett trick från kapitalisterna för att skydda sina kriminella lakejer. Rensa ut dem alla!"}, "date": "17 juli, 15:08", "url": "https://riks.se/nyheter/muslimsk-influencer-stodjer-utvisningar-av-grovt-kriminella-kvinnor-rasar-i-kommentarsfaltet", "imageUrl": "https://admin.riks.se/uploads/image_d9e80c515c.png"}, {"type": "image-right", "heading": "Benjamin Dousas vrede när SD nämner etniska svenskar", "summaries": {"normal": "Flera ministrar i Tidöregeringen kritiserar SD efter att partiets migrationspolitiska talesperson Ludvig Aspling sagt att en stor icke etniskt svensk befolkning orsakar stora problem i Sverige. Aspling kommenterade förslaget om återvandringsbidrag för även svenska medborgare. Biståndsminister Benjamin Dousa (M) med invandrarbakgrund tar starkt avstånd och menar att fokus på etnicitet är felaktigt. Även Romina Pourmokhtari (L), Erik Slottner (KD) och Anna Tenje (M) distanserar sig från uttalandet och betonar att integrationsproblem inte handlar om etnicitet.", "trump": "De där svenska ministrarna är så svaga, totalt patetiska! SD säger bara sanningen om att för många icke-svenskar skapar enorma problem, och vad gör de? De attackerar som vanliga förlorare. Dousa känner sig utknuffad för att han inte är tillräckligt svensk, stackars kille. De borde lyssna på folket istället för att vara politiskt korrekta idioter. Sverige håller på att förstöras, men ingen vågar säga det rakt ut. Patetiskt!", "stalin": "Kamrater, dessa ynkliga borgarbrackor i Tidöregeringen avslöjar sin sanna kontrarevolutionära natur när de angriper sanningen om den främmande befolkningens skadliga inflytande. Jag, som ledare för det proletära kollektivet, ser hur de feodala etnicitetsförnekarna i sin paranoia försöker skydda de borgerliga element som förgiftar samhället. Dousa känner sig utknuffad? Vi ska rensa ut alla sådana dekadenta kosmopoliter som inte tjänar folket. Integration är en lögn från kapitalisternas lakejer. Låt utrensningen börja mot dessa folkfiender med sitt falska leende och dolda agenda."}, "date": "17 juli, 14:28", "url": "https://www.friatider.se/benjamin-dousas-vrede-nar-sd-namner-etniska-svenskar", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/benjamin-dousa-_-made-with-sweden.jpg"}, {"type": "image-right", "heading": "Högljudda protester mot Zelenskyjs drag", "summaries": {"normal": "President Volodymyr Zelenskyj kritiseras efter ommöbleringar i regeringen. Den avgångne försvarsministern Mychajlo Fedorov, 35, anklagar överbefälhavare Oleksandr Syrskyj och generalstabschefen för en gammaldags, sovjetisk ledarstil. Fedorov hyllas för framgångarna med drönarkrigföring men har ersatts av Jevhenij Chmara från säkerhetstjänsten SBU. Samtidigt utsågs Serhij Koretskyj till ny premiärminister. Protester pågår för att återinsätta Fedorov.", "trump": "De där ukrainarna håller på och bråkar om ministerposter mitt i kriget, en riktig cirkus. Den unge grabben Fedorov gjorde ett fantastiskt jobb med drönarna, alla älskade honom, och nu sparkar de ut honom för någon gammal sovjettyp. Zelenskyj borde ha lyssnat på folket som demonstrerar istället för att lyssna på de inkompetenta generalerna. De behöver mina dealar, inte det här gamla sovjetiska skådespelet. Amerika har sett nog av det här!", "stalin": "Kamrater, i denna tid av historisk kamp mot de fascistiska horderna ser jag hur borgarbrackorna och de dekadenta opportunisterna inom apparaten förgiftar vår enhet. Den yngre elementet Fedorov, med sina drönarleksaker, vågar kritisera de trotjänare som krossade fienden 2022. Jag skulle ha genomfört en grundlig utrensning av dessa splittrande element redan vid första viskningen om ultimatum. Parlamentet skall godkänna vad kollektivet kräver, annars rensar vi ut hela myrstacken med ett leende. Inga halvmesyrer!"}, "date": "16 juli, 20:14", "url": "https://www.di.se/nyheter/hogljudda-protester-mot-zelenskyjs-drag/", "imageUrl": "https://static.bonniernews.se/ba/48e546aa-5640-439c-82b9-479926e3745f.jpeg?crop=4440%2C2220%2Cx0%2Cy368&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Fredskonferens i Istanbul samlade Nato-motståndare", "summaries": {"normal": "En antiimperialistisk fredskonferens hölls i Istanbul den 4 juli på initiativ av Turkiets Arbetarparti (TİP). Konferensen samlade runt 200 delegater från vänstergrupper och fredsaktivister, inklusive Kommunistiska Partiet från Sverige. Partiet hade bjudits in efter en stor demonstration mot Nato i Helsingborg. TİP, ett marxist-leninistiskt oppositionsparti grundat ur Geziprotesterna, kritiserar Nato, upprustning och president Erdoğan. Flera talare deporterades av turkiska myndigheter.", "trump": "Folk, det här är en total katastrof! Dessa kommunistiska misslyckanden i Istanbul samlas för att gnälla om Nato precis innan vårt fantastiska toppmöte. Turkiets Arbetarparti? Låter som en grupp förlorare som hatar framgång. Sverige har äntligen vaknat och gått med i Nato – smart drag, men de borde ha gjort det mycket tidigare. Neutralitet är för svaga. De deporterade talarna? Bra jobbat Turkiet, kanske borde vi skicka några av våra egna woke-aktivister dit också. Amerika först!", "stalin": "Kamrater, jag ser med godkännande hur arbetarnas parti i Turkiet samlar styrkor mot Nato-imperialismen och dess lakejer. Dessa folkförtryckartroll och Nato-expansionister försöker kväsa fredskrafterna, men vi genomskådar deras lömska planer. Deportationerna visar klassfiendens desperation. Sverige har kapitulerat fullständigt inför krigsalliansen – en ynklig förrädisk handling mot neutraliteten. Vi ska rensa ut alla sådana element och leda massorna till seger mot de exploaterande byfånarna."}, "date": "15 juli, 14:43", "url": "https://proletaren.se/artikel/fredskonferens-i-istanbul-samlade-nato-motstandare"}, {"type": "text", "heading": "Nato lägger locket på", "summaries": {"normal": "Artikeln kritiserar Nato-medlemskapet och menar att löftet om stärkt demokrati och frihet är ihåligt. Författaren pekar på arresteringar av aktivister och journalister under Natotoppmötet i Turkiet, tystnad från västerländska politiker samt svenska lagändringar som inskränker offentlighetsprincipen och journalisters rapportering. Slutsatsen är att Sverige bör lämna Nato för att skydda demokratin.", "trump": "Folket, det är ett skämt! De lovade att Nato skulle skydda demokratin, men titta på Erdogans Turkiet – hundratals gripna, media tystade, och våra egna politiker sitter tysta som lamm. De ändrar lagar i Sverige för att passa Nato, precis som de gör med allt annat. Patetiska globalister! Vi behöver inte deras klubb, vi behöver äkta frihet. Det är en total katastrof, tro mig.", "stalin": "Kamrater, detta avslöjar imperialismens lögnaktiga mask. Borgarbrackorna lovade att Nato skulle värna friheter, men under toppmötet rensade Erdogans apparat ut folkfiender och journalister medan de västerländska exploaterande byfånarna teg. Nu anpassas svenska lagar för att kväsa kritik – klassiskt kapitalistiskt hyckleri. Vi måste likvidera detta Natofängelse för arbetarklassens och den sanna folkviljans skull. Skrattretande svagt!"}, "date": "15 juli, 14:42", "url": "https://proletaren.se/artikel/nato-lagger-locket-pa"}, {"type": "text", "heading": "Fler ska vilja jobba i äldre­omsorgen – regeringen tar fram plan", "summaries": {"normal": "Regeringen ska ta fram en nationell plan för att locka fler till äldreomsorgen och få befintlig personal att orka stanna kvar. Socialstyrelsen får i uppdrag att undersöka hur man kan rekrytera, behålla och återlocka medarbetare samt vilken kompetens som behövs. Äldre- och socialförsäkringsminister Anna Tenje betonar att fler måste vilja och orka arbeta i dessa viktiga yrken för att förbättra omsorgen. Planen ska redovisas i december 2027.", "trump": "Det här är en total katastrof, folk orkar inte jobba hos de gamla längre, vanvård och kaos överallt. Vi behöver de bästa, de tuffaste människorna i äldreomsorgen, inte bara några som ger upp före pensionen. Jag ska säga er, ingen gör det bättre än jag när det gäller att locka folk till jobb, vi ska göra äldreomsorgen så stor och framgångsrik igen att alla vill vara med. Tro mig, det blir fantastiskt.", "stalin": "Kamrater, jag ser hur den dekadenta borgarklassen och deras parasitiska vårdkapitalister har låtit den proletära äldreomsorgen förfalla till en grogrund för vanvård och klassfiendens våldtäktsförsök. Vi ska nu med järnhand rensa ut alla svaga element som inte orkar till pensionen och likvidera den sabotageverksamhet som skrämmer bort arbetarna från de ädla uppgifterna. Inga kontrarevolutionära desertörer får fly undan. Den nationella planen blir en seger för folket, eller också blir det utrensning. Ha ha, skämtade jag? Kanske inte."}, "date": "16 juli, 11:45", "url": "https://arbetet.se/2026/07/16/sa-ska-fler-vilja-jobba-i-aldreomsorgen-regeringen-tar-fram-nationell-plan"}, {"type": "image-right", "heading": "Gränges redovisar rekordresultat – aktien upp 7%", "summaries": {"normal": "Gränges redovisar ett rekordstarkt andra kvartal med högre omsättning än analytikernas förväntningar. Omsättningen steg 37,9% till 9 620 miljoner kronor, medan rörelseresultatet nådde 565 miljoner kronor. Aktien steg 7%. VD Jörgen Rosengren betonar rekordförsäljning och volymtillväxt på 5%, trots osäker marknadsefterfrågan. Framtidsutsikterna är försiktigt positiva, men prispress förväntas i Asien.", "trump": "Vilket kvartal! Gränges, ett fantastiskt företag, slog alla förväntningar – jag visste att de skulle göra det, alla andra var skeptiska, men jag hade rätt, som vanligt. Omsättningen sköt i höjden, 37,9% upp, kan ni tro det? Aktien rusade 7%, helt otroligt! VD:n pratar om rekord, men jag säger bara: vänta tills ni ser vad som kommer härnäst. Asien? Övervärderat. Vi ska dominera marknaden, believe me!", "stalin": "Kapitalistiska Gränges rapporterar 'rekordresultat' – ett ynkligt försök att dölja svagheterna i deras dekadenta system. Trots deras så kallade 'tillväxt' på 5% vet vi att deras marknad är lika stabil som en fiendes frontlinje under vinterkriget. Asien, denna burleska marknad, kommer att krossa deras marginaler som vi krossade fascisterna. Vi förutser deras fall, medan våra egna industrier står starka, oövervinnerliga – precis som Sovjetunionen en gång var!"}, "date": "16 juli, 10:14", "url": "https://www.affarsvarlden.se/artikel/granges-redovisar-rekordresultat-aktien-upp-7", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/04/slitted_aluminium_strips-400x266.jpg"}, {"type": "image-right", "heading": "Studie: Kultur kopplas till bromsat åldrande", "summaries": {"normal": "En japansk studie visar att kulturella aktiviteter som museum-, opera-, teater- och biobesök kan bromsa det fysiologiska åldrandet med upp till tre år. Effekten är jämförbar med regelbunden fysisk träning. Forskarna undersökte blodtryck, BMI och gånghastighet hos nära 1 900 britter över 50 år. Studien är observationsbaserad och kan inte bevisa orsakssamband; det är möjligt att friskare personer helt enkelt ägnar sig mer åt kultur.", "trump": "Folk, lyssna på det här – en studie säger att gå på teater och opera får dig att se ut som tre år yngre. Fantastiskt! Bättre än Biden någonsin såg ut efter sin fjärde tupplur. Jag älskar kultur, de bästa kulturerna, inte den där woke-skräpen som förstör allt. Glöm gymmet, ta en opera istället. Det är yngre, starkare, vinnande. De säger att det är lika bra som träning – tro mig, jag vet allt om vinnare.", "stalin": "Kamrater, jag har studerat denna rapport med största uppmärksamhet. Kulturella aktiviteter under folkets kontroll kan fördröja det fysiologiska förfallet med tre år, en seger för det kollektiva välbefinnandet. Låt borgarbrackorna i väst fortsätta sin dekadenta dekadens medan vi rensar ut alla klassfiender som vägrar delta. Den som inte går på teatern är misstänkt sabotage mot statens hälsa. Tre år yngre – ett dialektiskt mirakel mot imperialismens åldrande!"}, "date": "16 juli, 08:07", "url": "https://www.etc.se/kultur-noje/studie-kultur-kopplas-till-bromsat-aaldrande", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026071602070_c0e73f9b93d401b878848e411c28b84afa8eda3d0f24ce1d47559ddb977d2833.jpg"}, {"type": "image-right", "heading": "Vi låter oss inte mutas", "summaries": {"normal": "Artikeln kritiserar riksdagspartiernas valstrategier som kortsiktiga mutpengar och skådespel för att vinna röster. Den pekar på brutna löften från Tidöpartierna och oppositionens förslag som otillräckliga. Författaren menar att plånboksfrågor inte löser samhällets grundproblem som ökande klassklyftor och försämrad välfärd. Lösningen är en systemförändring bort från kapitalismen mot socialism.", "trump": "Folk, titta på det här patetiska svenska skådespelet! Dessa loser-politiker kastar ut små mutpengar som elstöd och sänkt matmoms – ynkligt! De lovade billig bensin och el men levererade noll, typiskt etablissemanget. SD försöker göra Sverige stort igen men det är bara billig imitation. Ni behöver ingen mer av detta svaga globalistbröl, ni behöver en riktig ledare som fixar det på riktigt. Vinna stort!", "stalin": "Kamrater, detta sorgliga skådespel blottlägger borgarklassens fega försök att muta arbetarklassen med ynkliga nådepengar. Dessa folkförtryckartroll i riksdagen upprepar sin fars vart fjärde år medan de gömmer sig i maktens korridorer. Deras plånboksutspel förändrar inget. Vi vet att endast en grundlig utrensning av det kapitalistiska systemet och införandet av det socialistiska kollektivet kan befria folket från dessa exploaterande byfånar. Motståndarna ska likvideras politiskt."}, "date": "15 juli, 14:18", "url": "https://proletaren.se/artikel/vi-later-oss-inte-mutas", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/715277460_1489540105561240_4442812463073711142_n-e1784117735993-768x431.png"}, {"type": "image-full", "heading": "MP:s dröm-Sverige: fattigt, mörkt och gränslöst", "summaries": {"normal": "Artikeln kritiserar Miljöpartiets partiprogram och målar upp en dyster bild av ett framtida Sverige under deras styre. Det beskrivs som ett land utan bilar, kärnkraft och fossila bränslen, med dyr veganmat, begränsad jakt, kalla hem och nedlagda industrier. Nationalstaten ersätts av en gränslös vision, vilket enligt artikeln leder till fattigdom och ett icke-fungerande samhälle drivet av aktivism snarare än pragmatisk politik.", "trump": "Lyssnar ni på det här? Miljöpartiet vill göra Sverige till ett totalt katastrofland – inga bilar, ingen kärnkraft, bara cyklar och Pride-flaggor överallt. Deras gröna dröm är en mardröm för vanliga människor, med iskalla hus, dyra grönsaker och ingen mat på tallriken. De hatar gränser mer än de hatar att vinna val. Patetiska aktivister som förstörde fungerande kraftverk och öppnade dörrarna för kaos. Sverige behöver inga sådana förlorare, tro mig.", "stalin": "Kamrater, detta är klassfiendens sista desperata ylande mot folkets framsteg. Jag ser hur dessa miljöfascister vill likvidera all produktion, stänga gruvor och svälta ut arbetarklassen med sin vegan-diktatur och Pride-flaggor som ersätter den röda fanan. Ingen el, inga hus, bara kyla och hunger – typiskt imperialistiskt sabotage. Vi ska rensa ut dessa folkförtryckartroll och deras gränslösa vansinne innan de förvandlar nationen till en utarmad ruin. Staten segrar."}, "date": "14 juli, 07:44", "url": "https://samtiden.nu/2026/07/mps-drom-sverige-fattigt-morkt-och-granslost", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/11/Daniel_Hellden_in_2018-1280x720.jpg"}, {"type": "image-right", "heading": "Sluta behandla Kinas diktatur som en normal stat", "summaries": {"normal": "Debattörer kritiserar Sveriges regering för att ha tagit emot Kinas utrikesminister Wang Yi strax efter att Kinas nya enhetslag trädde i kraft. Lagen ses som ett verktyg för tvångsassimilering av etniska minoriteter som tibetaner och uigurer, bland annat genom att skilja barn från föräldrar och placera dem i statliga internatskolor. Artikeln lyfter fram kontrasten till en tibetansk aktivists självbränning i protest, samt fall som den fängslade svenske förläggaren Gui Minhai. Författarna kräver att Sverige offentligt ska kräva lagens upphävande och stopp för övergreppen.", "trump": "Titta på det här, det är en total skandal. Sverige tar emot den kinesiske ministern precis när de nya lagen kommer som krossar tibetaner och uigurer, och så sitter den stackars svenske killen Gui Minhai fängslad i åtta år utan ett ljud. Patetiskt. De pratar om mänskliga rättigheter men böjer sig som svaga ledare för diktaturen i Peking. Sverige borde ha kastat ut honom och krävt att lagen rivs upp omedelbart. Svaga regeringar, väldigt svaga. Amerika skulle aldrig acceptera sånt här fiffel.", "stalin": "Kamrater, denna borgarbracka till svensk regering välkomnar fienden Wang Yi just som vi i partiet skulle ha genomfört en fullständig utrensning av splittrande element. Denna så kallade enhetslag är ett ypperligt redskap för att forma lojala medborgare ur de vilsna minoriteterna, men de västerländska parasiterna skriker som råttor i en brinnande spann. Den tibetanske självbrännaren är en tragisk produkt av imperialistisk hjärntvätt, medan den gömde svenske spionen Gui Minhai sitter där han hör hemma. Vi ler mörkt åt deras hyckleri. Sluta leka demokrati och erkänn att endast en stark ledning kan rensa ut alla fiender till folkets enhet. Annars likviderar historien er alla."}, "date": "12 juli, 18:28", "url": "https://www.dagensarena.se/opinion/sluta-behandla-kinas-diktatur-som-en-normal-stat", "imageUrl": "https://www.dagensarena.se/files/2026/07/kina-besok.jpeg"}, {"type": "image-full", "heading": "Hökmark: Sverige bör leda ny frihandelspakt", "summaries": {"normal": "Gunnar Hökmark, ordförande för tankesmedjan Frivärld, föreslår att Sverige bör leda en ny frihandelsallians mellan EU och CPTPP, ett handelsavtal mellan tolv Stillahavsländer. Han menar att detta skulle skapa världens största frihandelsområde och motverka Kinas och USA:s protektionism. Hökmark betonar vikten av gemensamma spelregler för AI, cybersäkerhet och digital handel samt minskade beroenden av auktoritära regimer. Utmaningar som olika regelverk nämns, men han anser att integration bör prioriteras.", "trump": "Lyssna här, Sverige – ni har en chans att bli STORA! Jag säger alltid, handel är bra, men BRA handel är ännu bättre. Hökmark, smart kille, vill att EU och CPTPP slår sig ihop. Smart! Kina? De fuskar. USA? Vi är upptagna med att vinna. Men Sverige – ni kan leda! Skapa jobb, stoppa fuskarna, och gör Europa STORT igen. Och vet ni vad? Om ni gör det rätt, kanske vi till och med ansluter oss. Men bara om det är WINNING!", "stalin": "Kamrater, fienderna av den socialistiska världsordningen kryper fram som råttor ur sina hål. Dessa så kallade 'demokratier' med sina 'öppna ekonomier' försöker nu bygga en handelsmur mot våra progressiva allierade i Kina. Men se – en av deras egna, Hökmark, föreslår en allians mellan EU och Stillahavets lydstater. Vi måste agera! Låt dem tro att de bygger en mur, medan vi i hemlighet kontrollerar tegelstenarna. Deras 'innovation' och 'cybersäkerhet' är bara ett sken för att dölja sina imperialistiska ambitioner. Vi ska krossa deras leveranskedjor och låta deras beroende av oss bli deras undergång!"}, "date": "12 juli, 14:51", "url": "https://kvartal.se/nyheter/artiklar/hokmark-sverige-bor-leda-ny-frihandelsallians/cG9zdDoxNDUxODI", "imageUrl": "https://images.kvartal.se/2026/07/c4204163-hokmark.webp"}, {"type": "image-right", "heading": "Den ensamme hämnaren Problematiskt mansideal tar sig rätt att döda.", "summaries": {"normal": "En kontroversiell film, *Citizen Vigilante*, sprids i högerextrema kretsar och glorifierar den ensamme hämnaren som tar lagen i egna händer när staten anses ha svikit medborgarna. Filmen, som nekades biografvisning i Tyskland, hyllas som ett moraliskt våldsmanifest och används för att legitimera extremhögerns ideal. Den digitala spridningen, inklusive via Elon Musk, förstärker dess symboliska roll i en pågående kulturkamp om rättvisa och maskulinitet.", "trump": "Folk pratar om den här filmen, *Citizen Vigilante*, och jag säger: vad är det med dessa vänsterliberaler som hatar starka män? Filmen handlar om en kille som tar saken i egna händer när staten misslyckas – precis som jag gör! Tyskland förbjuder den, förstås, för de är rädda för sanningen. Men jag, jag förstår. Våld? Ibland behövs det. Och om Elon delar den, så är det för att han också vet att systemet är riggat. Fake news-media kommer hata den, men folket älskar den!", "stalin": "Vi har observerat en farlig tendens bland de dekadenta västländerna: en film, *Citizen Vigilante*, glorifierar den ensamme bourgeoishjälten som tar lagen i egna händer. Precis som de fascistiska drömmarna om en stark man som 'räddar' nationen! Tyskland, dessa hycklande liberaler, förbjuder filmen – men vi vet att deras rättssystem redan är korrumperat. Filmen är ett symptom på kapitalismens sönderfall. Vi, Sovjetunionens arvtagare, krossar sådana här reaktionära fantasier med järnhand. Låt dem leka med sina vapen – vi har kärnvapen och en plan!"}, "date": "9 juli, 10:34", "url": "https://expo.se/kommentar/den-ensamme-hamnaren", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/Kommentar-.jpg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
