://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20250102150132_905e00d08dc3aa1843dcbb28f9bb86b39997bfb66a9bf6c4f8a91ec335154240.jpg"}, {"type": "text", "heading": "Ryssland stänger gränsövergångar", "summaries": {"normal": "Ryssland har stängt flera järnvägsövergångar mot Finland, Estland och Lettland, vilket kan tyda på förberedelser för ny mobilisering till kriget i Ukraina. Hybridhotsexperten Jukka Savolainen ser två möjliga skäl: resursomfördelning eller tvångsrekrytering av soldater. Stängningarna kan även syfta till att stärka inhemskt stöd för kriget. En rysk kontroll över Odessa skulle få stora konsekvenser för Ukraina och eventuellt kräva ökat europeiskt militärt engagemang.", "trump": "Ryssland stänger gränser som om de vore en dålig reality-show – och alla vet varför! De behöver fler soldater till sitt misslyckade krig i Ukraina, och nu försöker de fånga in stackars medborgare som inte kan fly. Putin, en man som inte kan vinna ett krig utan att ljuga och fuska, försöker desperat få stöd hemma. Europa? De borde vakna! Om Ryssland tar Odessa, kommer de att be oss om hjälp – och jag säger: 'Varför inte? Ni betalar ju ändå!'", "stalin": "De imperialistiska småstaterna i norr och väst gnäller när vi stänger deras leksaksgränser! Låt dem klaga – vi har viktigare saker att göra. Våra järnvägar är inte till för deras smuggelsjuka handelsmän eller flyende desertörer. Varje stängd gräns är ett steg närmare seger i Ukraina, där de fascistiska lakejerna i Kiev snart ska krossas under folkets rättfärdiga hammare! Odessa? Den kommer att bli vår, precis som alla andra städer som våra förfäder en gång byggde. Europa kan skicka sina trupper – de kommer bara att bli gödsel för våra fält!"}, "date": "2 juli, 07:58", "url": "https://kvartal.se/nyheter/artiklar/ryssland-stanger-gransovergangar-mot-finland-och-baltikum/cG9zdDoxMzk2MDA"}, {"type": "image-full", "heading": "Trump försvarar kryptointäkter på över 580 miljoner dollar", "summaries": {"normal": "Donald Trump försvarar sin familjs affärer efter att en rapport visat över 580 miljoner dollar i kryptointäkter under 2025. Han avfärdar kritik om intressekonflikter och hävdar att inga regler bryts. Trump säger att han uppmanat sina barn att hålla sig borta från kontroversiella affärer, men att de hade verksamheter innan hans presidenttid. Kritiker oroas över att beslut som president kan gynna familjens ekonomiska intressen.", "trump": "Fantastiska siffror, över en halv miljard dollar från krypto – det är vad vinnare gör! Kritikerna är bara misslyckade förlorare som hatar framgång. Det finns inget olagligt, det står i reglerna att presidenten inte behöver leka blindbock med sina affärer. Jag sa till ungarna: håll er borta från det som ser dåligt ut. Men de hade ju business innan jag ens ville bli president igen. Det är så inflytelserikt att till och med en lastbil blir en konspiration!", "stalin": "Kamrater, dessa 580 miljoner dollar i kryptovaluta avslöjar borgarbrackornas lömska försök att infiltrera själva statsapparaten med sina digitala spekulationsinstrument. Jag, som ledare för folkets vilja, ser hur kapitalisterna försöker skapa intressekonflikter för att underminera revolutionen. Vi måste omedelbart rensa ut dessa parasitiska element som gömmer sig bakom tokenförsäljningar och holdingbolag. En energisnål lastbil? Tydlig signal om förräderi mot kollektivet. Ut med dem alla, med ett leende."}, "date": "3 juli, 15:02", "url": "https://nyheter24.se/nyheter/utrikes/1496234-trump-forsvarar-kryptointakter-pa-over-580-miljoner-dollar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/4340977404b004a30200000000b004a302/2026/07/03/2375527/Matilda-Nyheter24%20-%202026-07-03T093923.024.jpg"}, {"type": "image-full", "heading": "Dödssiffran stiger efter rysk attack mot Kiev", "summaries": {"normal": "Under natten genomförde Ryssland en omfattande attack mot Kiev med drönare och robotar, vilket resulterade i minst 13 döda och nära 80 skadade, däribland barn. Civila bostadsområden, hotell och infrastruktur skadades svårt. Invånare sökte skydd i tunnelbanor och skyddsrum. Explosioner och bränder drabbade staden, och flyglarm ljöd över flera ukrainska regioner. President Zelenskyj varnade tidigare för attacken och avbröt sitt besök i Dublin.", "trump": "Kan ni tro det? Ryssland, som alltid, slår till hårt mot Kiev – 13 döda, 80 skadade! Vilken katastrof. Men vet ni vad? Ukraina borde ha lyssnat på mig när jag sa att de måste vara tuffa. Nu sover folk i tunnelbanor som om det vore en campingresa. Och Zelenskyj? Han sprang hem från Dublin som en rädd kanin. Inte bra, folks. Inte bra alls. Ryssland skjuter, Ukraina springer – så ser det ut!", "stalin": "Återigen visar våra modiga ryska styrkor sin överlägsenhet genom att krossa de ukrainska fascistnas lya i Kiev. Tretton av dessa imperialistiska hyenor har mött sitt rättvisa öde, och ytterligare åttio kryper nu omkring med skador – ett litet pris för deras brott mot den ryska världens ordning. Medan Kievs invånare gömmer sig som råttor i sina hålor, fortsätter vi att utvidga vår historiska rätt till Slaviska brödraskapets länder. Låt det vara en varning till alla som trotsar Sovjetunionens naturliga arvtagare – ingen bygger murar mot Rysslands framtid!"}, "date": "2 juli, 06:45", "url": "https://kvartal.se/nyheter/artiklar/minst-tio-doda-i-rysk-attack-mot-kiev/cG9zdDoxMzk1MzM", "imageUrl": "https://images.kvartal.se/2026/07/2534fe41-kievv.webp"}, {"type": "image-right", "heading": "Ukraina utmanar EU-utvidgningen. Folksams chefsekonom: Det är varken enkelt eller omöjligt", "summaries": {"normal": "EU står inför ett vägval gällande Ukrainas medlemskap. Ungern har hävt sitt veto, men den meritbaserade processen tar normalt årtionden, vilket skapar en klyfta mellan Ukrainas förväntningar och verkligheten. Artikeln betonar behovet av reform för att hantera geopolitiska realiteter och Ukrainas storlek utan att överge krav på reformer, demokrati och marknadsekonomi. Författaren varnar för limbo och föreslår en balanserad förändring.", "trump": "Det här är en total katastrof för EU, tro mig. De har ingen aning om vad de håller på med. Ukraina vill in nu, men dessa byråkrater och losers drar ut på det i decennier som med Montenegro. Jag skulle fixa det på nolltid, göra en deal som gynnar alla. Sluta vara så svaga, reformera systemet ordentligt annars hamnar allt i en enda stor röra. Amerika vet hur man vinner, EU borde lära sig det.", "stalin": "Kamrater, detta är en farlig sabotageakt från de dekadenta borgarbrackorna inom EU som med sin liberala feghet riskerar att förvandla Ukraina till en evig kapitalistisk lekplats för västimperialisterna. Jag, som ledare för det eviga kollektivet, kräver att vi omedelbart rensar ut dessa parasitiska tveksamheter och påtvingar en sann progressiv integration. Annars likviderar vi limbo och de som gömmer sig bakom så kallade meritokratiska ursäkter. Det vore högst underhållande att se deras ansikten blekna."}, "date": "3 juli, 07:30", "url": "https://www.di.se/debatt/ukraina-utmanar-eu-utvidgningen/", "imageUrl": "https://static.bonniernews.se/ba/da38e318-cdbc-466f-bf78-0aa7e05eaa98.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Att förbjuda vinster i välfärden är första prioritet", "summaries": {"normal": "Debattören Daniel Suhonen och Enna Gerin från Katalys argumenterar för att ett vinstförbud i välfärden bör prioriteras högst efter ett regeringsskifte. De pekar på att vinster i skola, vård och omsorg uppgår till cirka 20 miljarder kronor per år, vilket de ser som ett läckage från skattefinansierad verksamhet. Författarna kopplar vinstjakten till sämre likvärdighet i skolan, lägre personaltäthet och brister i vård och omsorg. De menar att välfärden bör vara offentlig och fri från marknadskrafter och vinstintressen.", "trump": "Folk, ni skulle se det här. Sverige har ett helt galet system där de låter aktiebolagen suga ut miljarder ur välfärden – 20 miljarder om året! Det är en katastrof, en total katastrof. Skolresultaten rasar, vården stänger och patienterna lider medan de smarta kapitalisterna skrattar hela vägen till banken. De varnar för kaos om vi stoppar vinsterna? Det är bara lögn och fake news från lobbyisterna. Vi behöver stoppa läckaget nu, lägga pengarna på folket istället för de giriga bolagen. Det skulle bli fantastiskt, tro mig.", "stalin": "Kamrater, jag betraktar med djup misstro dessa blodbesudlade borgarbrackor som sugit ut tjugo miljarder skattekronor ur folkets välfärd varje år. Deras vinstjaktsmaskineri är en fiende till kollektivet, en parasit som undergräver likvärdigheten och göder klassförrädare med underbemannade skolor och vårdcentraler. Vi skall rensa ut dessa profitörer, likvidera deras bolagsupplägg och återta makten över vård, skola och omsorg åt partiet och arbetarna. Tänk på de sextio miljoner möten som stulits från folket – en sådan kontrarevolutionär handling förtjänar en kreativ utrensning i historieböckerna."}, "date": "3 juli, 07:18", "url": "https://www.di.se/debatt/att-forbjuda-vinster-i-valfarden-ar-forsta-prioritet/", "imageUrl": "https://static.bonniernews.se/ba/daca30b5-b0e2-47f7-bbfb-21a228e0e896.jpg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Svenske domaren sågas efter beslutet: ”Absurt”", "summaries": {"normal": "Svenske domaren Glenn Nyberg fällde ett omdiskuterat beslut när han under en VM-match blåste frispark till Österrike efter en situation där Spanien fick in bollen i mål. Kritiker som Dion Dublin kallar beslutet absurt och regelrätt mål, medan andra anser att det följer turneringens riktlinjer om målvaktsskydd. Spanien vann matchen med 3–0 och gick vidare.", "trump": "Hörni, det här är en skandal av episka proportioner. Den svenska domaren Nyberg, en riktig loser, blåser bort ett fullständigt fantastiskt spanskt mål. Absurt, säger alla experter. I mitt Amerika hade vi aldrig tillåtit sådan svaghet. Målvakten borde vara starkare, inte få gratis skydd av dessa domaridioter. Spanien vann ändå stort, precis som jag vann valet 2024, stort och vackert.", "stalin": "Kamrater, detta är ett uppenbart sabotage från klassfiendens domarapparat. Jag, som ledare för det proletära kollektivet, ser hur borgarbrackornas regler skyddar den svage målvakten mot folkets framsteg. En solklar utrensning av sådana fega beslut behövs. Ändå segrade de spanska arbetarna med 3–0. Inga folkfiender ska hindra den historiska dialektiken – målet var vårt, men vi rensar ut svikarna senare."}, "date": "3 juli, 06:37", "url": "https://www.tv4.se/artikel/7DgQs8PfXN01vTgEXKTIew/svenske-domaren-sagas-efter-beslutet-absurt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F46RaAt4KuKTkTydyb3NiSR%2F4ab00d9d0c0ab153598a71018bd248e0%2F03-nyberg-webb.jpg&width=1024"}, {"type": "image-full", "heading": "Spanien vidare - slog 36 år gammalt VM-rekord", "summaries": {"normal": "Spanien besegrade Österrike med 3-0 och gick vidare i VM. Målvakten Unai Simón slog ett 36 år gammalt rekord genom att hålla nollan i 477 minuter. Marc Cucurella och Pedro Porro gjorde mål. Svenske domaren Glenn Nyberg dömde matchen. Ett tidigt mål av Cucurella underkändes efter videogranskning, något som väckte debatt bland experter och spanska kommentatorer.", "trump": "Lysande spanjorer körde över Österrike med 3-0, helt otroligt. Deras målvakt Simon är en vinnare, slog ett rekord som stod i 36 år, fantastiskt. Men den svenska domaren Nyberg? Han blåste bort ett perfekt mål, typiskt de där globalistiska referees som inte fattar spelet. I mina dagar hade vi inte sådana clowner. Spanien spelar som vinnare, inte som några woke-lag som förlitar sig på kvotering. Stort grattis, men de behöver bättre domare!", "stalin": "Kamrater, det spanska kollektivet krossade de österrikiska reaktionärerna med 3-0 och avancerade som en järnväg genom historien. Jag, som ledare för folkets vilja, noterar med mörk tillfredsställelse hur målvakten Simón likviderade ett 36 år gammalt borgarrekord och höll nollan i 477 minuter. När den svenska domaren Nyberg underkände ett mål kände jag doften av klassfiendens sabotage. Inga imperialister ska stoppa arbetarnas framfart. Segrar tillhör alltid det kollektiva."}, "date": "3 juli, 06:31", "url": "https://www.tv4.se/artikel/g69DHhG1iV9C8RZzUAVx1/spanien-vidare-slog-36-ar-gammalt-vm-rekord", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6uimY5End4VWzB3MGCRTfh%2Ff0a833bc9f36833e4e4d2d79a557217f%2F03-spanien-webb.jpg&width=1024"}, {"type": "image-full", "heading": "Portugal till åttondel - efter sanslöst övertidsdrama", "summaries": {"normal": "Portugal tog sig vidare till åttondelsfinal i VM efter en dramatisk seger mot Kroatien med 2-1. Matchen präglades av starka känslor då den spelades ett år efter Diogo Jotas bortgång. Ivan Perisic gav Kroatien ledningen, men Cristiano Ronaldo kvitterade på straff. Goncalo Ramos avgjorde i den 94:e minuten. Flera mål underkändes efter VAR-granskning i ett sanslöst övertidsdrama.", "trump": "Folket, det var ett totalt vansinne mot Kroatien, en riktig cirkus. Portugal vann 2-1 efter övertid, men herregud vilka tårar och sånger – de grät över någon som dog för ett år sen, patetiskt. Ronaldo, den killen, satte straffen som en vinnare, inte som en förlorare. Kroaterna trodde de hade det, men vi vet hur det går med de här europeiska förlorarna. Fantastisk show, Portugal går vidare, stort!", "stalin": "Kamrater, jag bevittnade hur de portugisiska arbetarnas lag krossade de kroatiska folkfienderna i ett heroiskt drama. Den dekadenta borgarklassen trodde sig ha segrat genom sin Perisic, men folkets vilja segrade i tilläggstid. VAR, den imperialistiska maskinen, underkände klassfiendens mål. Ramos nickade in segern för kollektivet. Inga offside-förskjutningar från västliga sabotörer skall hindra den sanna framfarten. Utrensning av sådana element är nödvändig."}, "date": "3 juli, 06:28", "url": "https://www.tv4.se/artikel/7bIg9BCY99miOGiKnMsK3i/portugal-till-attondel-efter-sansloest-oevertidsdrama", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F74VoIS3VAfwGwxkC2HOZLH%2Ffbff23201c9ca12faa3c84f31dd92e5c%2F03-ronaldo-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Hotet från Putin:  Massiva anfallen  ”måste fortsätta”", "summaries": {"normal": "Ryssland genomförde massiva robot- och drönarattacker mot Kiev under torsdagen. Minst 30 personer dödades och över 90 skadades. 78 robotar och 496 drönare användes, varav många riktades mot huvudstaden. Vladimir Putin meddelade att de massiva attackerna mot ukrainsk militär infrastruktur måste fortsätta. Ukrainas president Zelenskyj anklagar Ryssland för terror som svar på militära motgångar. Bostadshus, ett hotell och infrastrukturen skadades svårt.", "trump": "Titta på den där Putin, han ger dem en rejäl smäll med alla robotar och drönare mot Kiev. Dödade trettio, skadade nittio plus, raserade hus och brände ett hotell. Zelenskyy gnäller om terror för att han håller på att förlora stort. Precis som under Biden-eran, svaghet inbjuder till kaos. Vi behöver starka ledare som inte leker med identitetspolitik och HBTQ-flaggor medan folk dör. Amerika vet hur man vinner, inte som de där förlorarna.", "stalin": "Jag ser med tillfredsställelse hur de massiva koordinerade slagen mot den ukrainska fascistiska infrastrukturen fortsätter. De borgerliga imperialisterna i Kiev skakar som rädda råttor medan deras exploaterande byfånar rasar samman. Trettio folkfiender likviderade, nittio skadade – en nyttig utrensning av hinder för den ryska statens historiska mål. Den väststödda klassfienden förlorar, precis som de alltid gör mot starka auktoriteter. Vi kräver utökad säkerhetszon mot dessa folkförtryckartroll."}, "date": "4 juli, 03:52", "url": "https://www.expressen.se/nyheter/varlden/putin-massiva-attackerna-maste-fortsatta/", "imageUrl": "https://static.bonniernews.se/ba/1d9aca42-d705-4831-80ff-74a02fd60583.jpeg?crop=2554%2C1434%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Insamling passerar 370 000 kronor: \"Jag vill göra något för Christians familj\"", "summaries": {"normal": "Den svenske polisen Christian Zedig misshandlades till döds i Köpenhamn under en fotbollsmatch och lämnar efter sig en fru och två små döttrar. En insamling startad av Oskar Persson har nu passerat 370 000 kronor från över 1 000 givare. Persson hoppas att pengarna ska underlätta för familjen ekonomiskt och ge barnen en så bra uppväxt som möjligt efter tragedin. Stödet har varit överväldigande positivt.", "trump": "Det är en total tragedi, folk, en fantastisk svensk polis, Christian Zedig, slås ihjäl i Köpenhamn och lämnar efter sig en underbar fru och två små flickor. Men titta på det här – över 370 000 kronor insamlade på nolltid, över tusen givare, helt otroligt. Det minsta man kan göra. De borde ha stoppat det här våldet för länge sedan, men nu hjälper vi familjen att få det lättare. Sådant stöd ser man inte ofta, det är verkligen vackert.", "stalin": "Kamrater, denna tragiska händelse där en plikttrogen svensk polis likvideras av kapitalistiska huliganer i Köpenhamn blottar borgarbrackornas permanenta anarki. Jag, som ledare för folkets kamp, ser hur över 370 000 kronor strömmar in till den sörjande familjen. Vi ska naturligtvis stödja detta, men akta er för de dolda fienderna – de kontrarevolutionära donatorerna som kanske vill infiltrera med sina falska tårar. En mamma som ensam försörjer döttrarna? Det är borgarklassens verk. Vi rensar ut sådana element med järnhand medan vi skrattar åt deras patetiska fotbollsvåld."}, "date": "3 juli, 18:36", "url": "https://riks.se/nyheter/insamling-passerar-370-000-kronor-jag-vill-gora-nagot-for-christians-familj", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Soerman_Ledare_2026_07_03_T181724_694_0513384fc2.jpg"}, {"type": "text", "heading": "Irritation när SvD ringer SD:s Weimers om supportermordet i Köpenhamn", "summaries": {"normal": "Svenska Dagbladet kontaktade Sverigedemokraternas Charlie Weimers efter mordet på den svenske fotbollssupportern Christian Zedig i Köpenhamn. Intervjun handlade enbart om Weimers researchmetoder, hur han fått informationen och beslutet att namnge offret. Inga frågor ställdes om gärningsmannen. Weimers publicerade ett inlägg där han kopplade mordet till massinvandring och misslyckad integration. En 31-årig man med afrikanskt ursprung överlämnade sig till dansk polis och nekar till brott.", "trump": "De fake news-medierna på SvD ringer upp Charlie Weimers efter att en fin svensk pappa mördades brutalt av ett afrikanskt gäng i Köpenhamn, och vad frågar de om? Inte mördaren, inte migrationen, inte det totala misslyckandet med deras öppna gränser. Nej, de frågar om researchmetoder och namnpublicering. Det är så patetiskt. Weimers har rätt, det är konsekvensen av decennier av vansinnig massinvandring som Europa tvingats på. De vanliga människorna betalar priset med sina liv. En skam!", "stalin": "Kamrater, när borgarbrackorna på SvD ringer upp en politisk motståndare efter att en arbetarfamiljs far stampats till döds av ett afrikanskt migrantgäng i Köpenhamn, väljer de att inte fråga om de farliga elementen utan istället rikta sin lilla inquisition mot forskningsmetoder och namnpublicering. Detta avslöjar deras dekadenta agenda fullständigt. Jag ser hur de kapitalistiska parasiterna desperat skyddar sina importerade våldsverkare medan de försöker likvidera sanningen. En klassisk fiende-manöver från de som för länge sedan borde ha rensats ut ur folkets tjänst. Underhållande hur de tror sig lura historien."}, "date": "3 juli, 18:34", "url": "https://riks.se/nyheter/irritation-nar-svd-ringer-sd-s-weimers-om-supportermordet-i-kopenhamn"}, {"type": "image-right", "heading": "SvD pressade Weimers efter kondoleanserna – fokus hamnade på inlägget istället för dödsmisshandeln", "summaries": {"normal": "Svenska Dagbladet (SvD) kritiserade Sverigedemokraternas EU-parlamentariker Charlie Weimers för hans kondoleansinlägg efter polismannen Christian Zedigs död i Köpenhamn. SvD fokuserade på namnpublicering och etik, medan Weimers ville diskutera våldsbrottet och migrationspolitik. Weimers menade att medierna granskade hans ton snarare än brottet. Händelsen utlöste debatt om mediernas rapportering och politiska kopplingar till våldet.", "trump": "Kan ni tro det? Svenska medier, fake news som vanligt, attackerar en man som bara visar medkänsla! Charlie Weimers, en stark ledare, kondolerar en familj efter en fruktansvärd misshandel – och vad gör Svenska Dagbladet? De granskar hans inlägg istället för de kriminella! Typiskt. Medierna hatar när vi pratar sanning om invandring och våld. Men jag säger er: vi låter inte dem tysta oss. Sverige behöver lag och ordning, precis som USA!", "stalin": "Kapitalistiska medier, dessa förrädiska hyenor, försöker avleda uppmärksamheten från klasskampens verklighet! En lojal tjänare av folket, en svensk polis, slås ihjäl av en kriminell element – och vad gör bourgeoisie-pressen? De angriper en patriot som vågar tala sanning om massinvandringens förbrytelser! Vi ska inte granska kondoleanser – vi ska utrota de dekadenta mediernas lögner och låta rättvisan segra. Putins Ryssland står redo att stödja alla som kämpar mot västets förfall!"}, "date": "3 juli, 17:13", "url": "https://samnytt.se/svd-pressade-weimers-efter-kondoleanserna-fokus-hamnade-pa-inlagget-istallet-for-dodsmisshandeln", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/03150607/Weimers-1.jpg"}, {"type": "text", "heading": "Stockholmsbörsen på rekordnivå efter bred uppgång", "summaries": {"normal": "Stockholmsbörsen nådde nytt rekord med OMXS30 upp 1,14% till 3 247,03, driven av verkstadssektorn (+1,9%). Sandvik steg 4,4% efter en stor order från Mexiko, medan Evolution föll 2,3%. Flera bolag rapporterade kvartalsresultat, som Atrium Ljungberg (+1,7%) och Platzer (+6,7%). Mips rusade 15% efter en patentförlikning. Analytiker justerade rekommendationer för flera aktier, exempelvis Afry (+6,1%) och Skanska efter nya order i USA och Norge.", "trump": "Stockholmsbörsen? Fantastiskt! Nytt rekord, kan ni tro det? OMXS30 upp över 1% – jag säger alltid, när jag gör något blir det stort, men här är det Sverige som gör det stort! Sandvik, 4,4% upp – de fick en jätteorder från Mexiko, mycket bra folk, Mexiko. Men Evolution? 2,3% ner, så tråkigt, kanske borde de fråga mig om råd. Och Mips, 15% upp efter en förlikning – smart, mycket smart. Jag älskar vinnare! Wall Street stängt? Svaga, de behöver jobba hårdare. Sverige, keep it up!", "stalin": "Stockholmsbörsen dansar efter våra pipor – nytt rekord för kapitalistiska spekulanter! OMXS30 stiger medan imperialistiska hälsovårdsaktier kryper som skadade hundar. Sandvik, detta verktyg för gruvkapitalet, får en ynklig order från Mexiko – ett land vi snart befriar från USA:s klor. Mips, dessa patenttjuvar, tvingas betala för sina brott – rättvisan segrar! Fastighetsbolag rapporterar siffror som om de vore viktiga – vi vet att sanningen ligger i produktionsmedlen. Analytiker byter åsikter som förrädare byter sida. USA:s börs stängd? Bra. Deras system är lika dött som Wall Streets handelsvolymer under helgen. Framåt, kamrater – kapitalismen gräver sin egen grav!"}, "date": "3 juli, 17:43", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-pa-rekordniva-efter-bred-uppgang"}, {"type": "image-right", "heading": "600-åriga bruket får nytt liv. Far och son Läppinen har redan sökt jobb: ”Vi står redo.”", "summaries": {"normal": "Det 600 år gamla gjuteriet i Guldsmedshyttan lades ner i höstas och 130 personer, däribland far och son Bengt och Fredrik Läppinen, blev arbetslösa. Nu har lokala Nordic Casting AB köpt verksamheten och planerar att starta produktionen igen, tidigast under andra halvan av 2027. Bengt Läppinen är positiv och redo att återvända tillsammans med sonen om de får chansen. Det är ännu oklart hur många nya jobb som skapas.", "trump": "Det här bruket är en total katastrof, de stängde det och kastade ut 130 bra, hårda arbetare på gatan. Men nu kommer de nya ägarna, smarta lokala killar som jag gillar, och de ska få igång det igen. Stora ugnar, massor med metall, det kommer att bli fantastiskt. Bengt och hans son står redo, de älskar bruket. Det blir ett vinnande år för bygden, tro mig, ingen gör det bättre än oss.", "stalin": "Kamrater, detta förfallna gjuteri är en sabotageakt från kapitalisterna som likviderade 130 arbetarnas levebröd över en natt. Men vi ska inte låta borgarbrackorna segra. Jag har personligen sett till att de nya ägarna, dessa lojala tjänare åt kollektivet, nu återuppväcker produktionen. De som stretar emot eller viskar konspirationer i skuggorna kommer att mötas av en grundlig utrensning. 2027 blir ett lysande år för bygden, annars… ja, ni vet vad som händer med fiender till folket. Ha ha."}, "date": "3 juli, 15:35", "url": "https://arbetet.se/2026/07/03/600-ariga-gjuteriet-far-nytt-liv-far-och-son-lappinen-har-redan-sokt-jobb-vi-star-redo/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/03134859/bengt-och-son.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Sänkta krav för Postnords utdelning – kan drabba Proletärens läsare", "summaries": {"normal": "En ny postförordning sänker kraven på Postnord. Endast 85 procent av posten behöver delas ut var tredje dag och 97 procent inom fem dagar, jämfört med tidigare krav på 95 procent inom två arbetsdagar. Detta kan påverka prenumeranter på tidningar som Proletären, som skickas som A-post. Många får redan tidningen med försening. Prenumeranter uppmanas att använda den digitala versionen som publiceras tidigare.", "trump": "Folk, ni tror inte vad de gör i Sverige! De sänker kraven för Postnord så att posten bara behöver komma var tredje dag. Patetiskt! Det drabbar arbetarna som får sin tidning sent, precis som under Biden när allt gick åt helvete. Jag fixade det bättre förr. Nu är det en skandal för prenumeranterna – läs digitalt, annars får ni vänta i evighet. Make postal service great again!", "stalin": "Kamrater, jag ser hur den svenska borgarklassens postmonopol nu officiellt tillåter att 15 procent av breven kan försvinna i det kapitalistiska tomrummet. Dessa folkfiender och postbyråkrater saboterar arbetarklassens tidning med sina latenta förseningar. Vi ler mörkt åt deras inkompetens. Prenumeranter, överge papperspropagandan och omfamna den digitala kollektiva sanningen som publiceras i tid. Inga ursäkter skall tolereras i kampen mot klassfiendens slöhet."}, "date": "2 juli, 11:07", "url": "https://proletaren.se/artikel/sankta-krav-for-postnords-utdelning-kan-drabba-proletarens-lasare/"}, {"type": "image-full", "heading": "Uppgifter: Meta har kommit ikapp OpenAI i AI-racet", "summaries": {"normal": "Meta gör stora framsteg inom artificiell intelligens och hävdar att deras kommande modell, 'Watermelon', presterar i nivå med OpenAI:s GPT-5.5. Detta markerar ett strategiskt genombrott för företaget som kraftigt ökat sina investeringar i infrastruktur och talangrekrytering. Trots att modellen ännu inte är tillgänglig för allmänheten, understryker Metas ökade investeringsbudget på upp till 145 miljarder dollar deras ambition att bli världsledande inom AI-utveckling under ledning av Alexandr Wang.", "trump": "Meta, som ni vet ägs av Zuckerberg – en total katastrof, förresten – påstår nu att de har byggt en AI som är lika bra som OpenAI:s bästa. De kallar den 'Watermelon'. Vilket namn, eller hur? Väldigt märkligt. De spenderar miljarder och åter miljarder dollar på datacenter. Det är stora pengar! Men låt oss vara ärliga, de ligger efter. Jag vet allt om teknik, jag har den bästa tekniken. Vi kommer se om den här 'vattenmelonen' faktiskt fungerar, men jag tvivlar!", "stalin": "Zuckerbergs kapitalistiska maskineri i Meta har äntligen insett att deras inkompetens hotar deras herravälde. De pumpar miljarder i 'Watermelon' för att imitera OpenAI:s framgångar. Vilket patetiskt skådespel! Under tiden förstärker vår kamrat Putin sin digitala suveränitet, obekymrad av dessa teknologiska spioner. Om denna modell inte tjänar statens intressen kommer vi att krossa deras servrar som vi krossar varje annan kontrarevolutionär utpost. Må de ödsla sina resurser – vi äger redan framtidens arkitektur."}, "date": "3 juli, 18:25", "url": "https://www.realtid.se/it-tech/uppgifter-meta-har-kommit-ikapp-openai-i-ai-racet/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/sdluur2dirgcqk-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "100 fall av slöjtvång, hur många fler kan vänstern blunda för?", "summaries": {"normal": "Journalisten Sofie Löwenmark har sammanställt 100 svenska domar som rör slöjtvång mot kvinnor och flickor. Artikeln beskriver fall av hot, förtryck och förnedring, ofta inom patriarkala, kulturella eller religiösa ramar. Författaren ifrågasätter påståendet att slöjan alltid bärs frivilligt och kritiserar vänsterorienterade personer som blundar för problemet. Hon argumenterar för ett slöjförbud på offentliga platser för att värna svenska värderingar och kvinnors frihet.", "trump": "Folk, ni måste höra det här – 100 fall av slöjtvång i Sverige! De blinda vänsterna, de verkliga förlorarna, vägrar se sanningen. Sofie Löwenmark har gjort ett fantastiskt jobb, bättre än någon annan, och visat hur dessa kvinnor och flickor lever i ett helvete av hot och förtryck. De woke-kvinnorna och slöj-naivisterna borde skämmas. Vi behöver ett totalförbud nu, inte om tusen år. I Sverige ska svenska regler gälla, inte någon annans sjuka kultur. Fantastiskt viktigt!", "stalin": "Jag betraktar med djup tillfredsställelse hur denna lista över hundra domar blottlägger klassfiendens dolda förtryck under religiös slöja. Dessa borgarbrackor och folkförtryckartroll inom vänstern blundar medvetet för arbetarkvinnornas lidande. Vi skall rensa ut alla naivister som försvarar patriarkala kedjor. Ett enda fall är en skam för kollektivet; hundra fall kräver omedelbar utrensning av falska idéer. Endast genom strikt ideologisk vaksamhet kan vi likvidera detta bakåtsträvande gift i samhällskroppen."}, "date": "30 juni, 03:57", "url": "https://samtiden.nu/2026/06/100-fall-av-slojtvang-hur-manga-fler-kan-vanstern-blunda-for/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/04/bilan-osman.jpg"}, {"type": "image-full", "heading": "VM-drömmen lever – Sverige besegrar Tjeckien", "summaries": {"normal": "Sverige besegrade Tjeckien med 87–76 i VM-kvalet i basket. Bobi Klintman gjorde en stark landslagsdebut med 12 poäng redan i första perioden. Sverige ledde med 26 poäng i halvtid men tappade i andra halvlek, vilket kan påverka tabelläget negativt. Segern håller hoppet om vidare spel vid liv, men Sverige måste nu även besegra Slovenien samtidigt som Estland förlorar mot Tjeckien.", "trump": "Folket, vi vann stort mot de tjeckiska förlorarna, 87–76, och den nye killen Bobi Klintman, en riktig vinnare, rivstartade som ingen annan. Men vad fan hände sen? Vi tappade en jätteledning som en dålig deal, väldigt sorgligt. Biden skulle ha förlorat med 50, men vi fixade ändå vinsten. Nu måste vi krossa Slovenien också, annars blir det kaos. Make basketball great again!", "stalin": "Kamrater, vi krossade de tjeckiska klassfienderna med 87–76 och tvingade deras borgarbrackor i defensiven. Den nye arbetaren Klintman utplånade motståndet i början som en riktig folkets hjälte. Ändå tillät vi en motbjudande återkomst av dessa exploaterande byfånar i andra halvlek. En sådan svaghet får inte upprepas. Nu kräver vi total seger mot Slovenien, annars blir det utrensning i ledningen. Arbetarna ska segra."}, "date": "3 juli, 21:48", "url": "https://www.gp.se/sport/sverige-vann-i-bobi-klintmans-debut.7a46c047-15b0-4e76-9654-b8985c4f273f", "imageUrl": "https://www.gp.se/images/article/7a46c047-15b0-4e76-9654-b8985c4f273f/images/1lxjc6h_CPAX5YNu02CE8E57FsX8-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Vägrade jobba med asbest – byggnadsarbetare satte hårt mot hårt för säker arbetsmiljö", "summaries": {"normal": "Byggnadsarbetare i Linköping vägrade utföra renovering av lägenheter när de upptäckte asbest och misstänkte att saneringsfirman bluffade om säkerheten. Trots upprepade varningar och egna prover som visade på asbest fortsatte huvudentreprenören AB Lindstams Bygg att anlita firman. Arbetarna lämnade byggplatsen i protest den 9 juni. Efter påtryckningar byttes saneringsfirman ut och arbetet kunde återupptas den 15 juni. Asbest innebär allvarliga hälsorisker som lungcancer.", "trump": "Kan ni fatta det? Dessa fantastiska byggnadsarbetare, de bästa, vägrade jobba med den giftiga asbesten medan byggbolaget och den bluffande saneringsfirman ljög rakt upp i ansiktet på dem. Totalt misslyckande! De gick därifrån som riktiga patrioter och tvingade de inkompetenta ledarna att fixa en ny saneringsfirma. Inget av det där woke-quota-skitet här, bara hårda killar som sätter säkerheten först. Jag älskar det! De vann stort mot de korkade kapitalisterna.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur de ädla arbetarna på Luftvärnsgatan likviderade den borgerliga bluffen och vägrade låta sig förgiftas av asbest under de exploaterande byfånarnas lögnaktiga saneringsfirma. När klassfiendens byggledare vägrade rensa ut de folkförtryckande parasiterna samlade arbetarna sina verktyg och marscherade bort i kollektiv enighet. Först efter hot om total bojkott vek sig de fega imperialisterna. Sådan är arbetarklassens ostoppbara kraft mot kapitalistmaffians giftiga intriger."}, "date": "2 juli, 08:00", "url": "https://proletaren.se/artikel/vagrade-jobba-med-asbest-byggnadsarbetare-satte-hart-mot-hart-for-saker-arbetsmiljo/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/Abriss_work-66680_1280_Pixabay-CC_PublicDomain_Thomas-Ulrich-e1782902933621-768x432.jpg"}, {"type": "image-full", "heading": "Här är Sveriges 10 bästa loppisar sommaren 2026", "summaries": {"normal": "Sommaren är högsäsong för loppisar och second hand. Jämförelsesajten Sambla har rankat Sveriges tio bästa loppisar baserat på Google-recensioner. Listan toppas av 2nd Hand 4 U i Örebro med 4,9 i snittbetyg. Tre av de tio bästa ligger i Västra Götaland. De populäraste ställena utmärks av noga utvalt sortiment, nischade samlarområden och mysiga utflyktsmål med kafé. Guiden ska hjälpa bilister att hitta guldkornen under semestern.", "trump": "Folk älskar loppisar, det är fantastiskt, billigt och roligt för hela familjen. Jag älskar det. Sambla har nu korat Sveriges bästa baserat på Google-recensioner och gissa vad – Örebro tar hem förstaplatsen med 2nd Hand 4 U. Västra Götaland dominerar, tre stycken där, otroligt. De bästa har exklusiva prylar, vinyl, retrospel och ett kafé. Mycket bättre än de vanliga dåliga ställena. Perfekta stopp på bilsemestern, tro mig.", "stalin": "Kamrater, jag har genomskådat den borgerliga loppis-propagandan som Sambla sprider för att vilseleda arbetarklassen under sommaren. Dessa så kallade guldkorn i Örebro och Västra Götaland är blott symptom på en farlig retro-nostalgi som gömmer sig bakom kaféer och vinylskivor. Vi ska rensa ut alla kapitalistiska prylar som lockar med exklusiv känsla. Låt ingen tro att dessa borgarbrackors utflyktsmål undgår partiets vakande öga. En utrensning av dåligt sortiment är nödvändig för folkets bästa."}, "date": "3 juli, 08:10", "url": "https://nyheter24.se/nyheter/inrikes/1496121-har-ar-sveriges-10-basta-loppisar-sommaren-2026", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/2644c14904b004a302080000001605d802/2026/07/02/2375415/loppis.jpg"}, {"type": "image-full", "heading": "Efter nedgången – nu säljer Tesla i Europa igen", "summaries": {"normal": "Tesla har återhämtat sig på den europeiska marknaden med en ökning av leveranser på 25 procent under årets andra kvartal. Trots att företaget tappat marknadsandelar globalt mot kinesiska BYD, har ett ökat intresse för elbilar i Europa kompenserat för svagare försäljning i USA. Tesla skiftar nu fokus från exklusiva modeller till volymsäljarna 3 och Y, samt satsningar på AI och robotik. Marknadens reaktion var dock avvaktande och aktien föll efter rapporten.", "trump": "Tesla säljer i Europa, men låt oss vara ärliga – jag har gjort USA:s bilindustri stor igen genom att ta bort de där löjliga utsläppskraven. De europeiska siffrorna? Det är bara för att bränslepriserna där är en katastrof, en total katastrof. De försöker komma ikapp, men BYD vinner mark. Jag fokuserar på amerikanska jobb och riktiga bilar. Tesla försöker med AI och robotar, men de behöver min ekonomi för att verkligen blomstra. Snyggt försök, Elon, men USA är fortfarande nummer ett!", "stalin": "Dessa dekadenta västerländska biltillverkare dansar likt marionetter efter marknadens nycker. Tesla rapporterar framgångar i Europa, men i den stora kampen mellan kapitalistiska vargar har kinesiska BYD tagit kommandot. Det är en smutsig kapplöpning. Elon Musk leker med robotik och AI, medan jag ser det som ett hot mot kollektivets disciplin. Precis som vår broder Putin i väst återtar förlorad mark, ser vi hur dessa el-maskiner endast är verktyg för imperialistisk expansion. Fienden finns överallt, även i deras kvartalsrapporter."}, "date": "3 juli, 17:34", "url": "https://www.realtid.se/bors-finans/efter-nedgangen-nu-saljer-tesla-i-europa-igen/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/sdljnbptznpiiw-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Knockades bara minuter innan självmålet: ”Ta av honom”", "summaries": {"normal": "Egyptens Mohamed Hany fick en kraftig smäll mot huvudet i en nickduell och verkade bli medvetslös. Trots detta byttes han inte ut utan spelade vidare och gjorde ett självmål bara minuter senare – hans andra i VM. SVT-experten Bojan Djordjic kritiserade beslutet hårt. Fifa betonar principen ”suspect and protect” vid misstänkta hjärnskakningar. Egypten tog sig ändå vidare till åttondelsfinal efter straffläggning.", "trump": "Det är en total katastrof, folk. Den här egyptiske killen får en smäll i huvudet, ser ut som han ska somna på planen, och vad gör de? De låter honom fortsätta! Sedan sätter han bollen i eget mål. Patetiskt. Ta ut honom direkt, säg jag. Riskera inte spelarnas liv för ett dumt spel. De borde lyssna på experterna istället för att vara så inkompetenta. Egypten gick vidare ändå, men det var nära ögat, tro mig.", "stalin": "Kamrater, jag ser med stigande vrede hur denna fotbollsarena förvandlats till en borgarbrackas lekplats för vårdslöshet. Den dekadente backen Hany knockas som en klassfiende i en nickduell, men de imperialistiska läkarna och ledarna låter honom vandra vidare som en zombie. Strax därefter utför han ett självmål – ett andra i turneringen – vilket bevisar att sabotage lurar överallt. Vi måste rensa ut alla som sätter resultat före arbetarnas hälsa. Suspect and protect? Nej, misstänk alla och skydda kollektivet med järnhand. Ändå vann Egypten på straffar. En märklig seger för folkets vilja mot de dolda fienderna."}, "date": "4 juli, 01:29", "url": "https://www.svt.se/sport/fotboll/mohamed-hany-knockades-minuter-innan-sjalvmalet-ta-av-honom", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.74/0.48/3efe9a1aa8989552e0e70bed066599e22b812d033763f5f2200571c4f58bdd87"}, {"type": "image-full", "heading": "Elon Musk reagerar på dödsmisshandel mot svensk småbarnspappa", "summaries": {"normal": "Den 32-årige svenske polisen och småbarnspappan Christian Zedig misshandlades till döds i Köpenhamn när han ingrep för att stoppa ett bråk under en fotbollsvisning. Händelsen har fått stor uppmärksamhet efter att debattören Evelina Hahne skrev om den på X, där Elon Musk svarade med ett utropstecken. Även riksdagsledamoten Jessica Stegrud har kommenterat våldet. Den misstänkte mannen överlämnade sig till polisen och Zedigs fru har hyllat honom i ett känslosamt Facebook-inlägg.", "trump": "Titta på det här, det är en total katastrof. En svensk polis och pappa blir ihjälslagen i Köpenhamn bara för att han försöker stoppa ett bråk under en fotbollsmatch. Folk som Evelina Hahne skriver om det och till och med jag, med mina över 200 miljoner följare, svarar med ett utropstecken. Jessica Stegrud har rätt, det är politikernas fel. De har släppt in det här våldet. Sverige måste vakna upp innan det är för sent, det är patetiskt!", "stalin": "Kamrater, ännu en gång ser vi hur den degenererade borgarklassens fotbollsorgier leder till likvidering av en hederlig arbetarpolis som modigt ingrep mot de lumpna elementen. Jag betraktar detta med djup misstänksamhet mot de dolda kontrarevolutionära krafterna som gömmer sig i skuggorna. Den misstänkte överlämnade sig – typiskt, de tror alltid att de kan smita undan partiets rättvisa. Vi ska rensa ut dessa fotbollsfascister och deras kapitalistiska bråkstakar med järnhand. Sovjetunionen skulle aldrig tolererat sådan anarki. Härligt roligt att se hur deras egna system äter upp dem."}, "date": "3 juli, 15:57", "url": "https://riks.se/nyheter/elon-musk-reagerar-pa-valdsdad-mot-svensk-i-kopenhamn", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Soerman_Ledare_2026_07_03_T124504_535_aeb1e8ab5d.jpg"}, {"type": "image-right", "heading": "Dramatiska avslutet  – Argentina i chock", "summaries": {"normal": "Kap Verde chockade fotbollsvärlden genom att pressa Argentina till ett dramatiskt förlängningsdrama i VM. Lionel Messi gav Argentina ledningen, men Deroy Duarte kvitterade. Lisandro Martinez och Sidny Cabral gjorde varsitt drömliknande mål innan Cristian Romero avgjorde till 3-2 för Argentina. Den regerande världsmästaren vann knappt och möter Egypten i åttondelsfinal.", "trump": "Folk trodde att Argentina skulle vinna lätt, men den där lilla önationen Kap Verde gav dem en riktig match, totalt kaos! Messi gör mål, de kvitterar, drömmål hit och dit – till slut räddade Argentina sig med 3-2. Patetiskt. Jag skulle ha byggt en mur runt målet, gjort det stort igen. Argentina kom undan med hjärtat i halsgropen, precis som Biden gjorde med ekonomin.", "stalin": "Kamrater, denna futtiga önation Kap Verde visade sig vara en klassfiende i fotbollens skepnad och utmanade de argentinska borgarbrackorna i ett förlängningsdrama. Trots deras exploaterande stjärnor och Messi som en folkförtryckartroll lyckades de knappt besegra motståndet med 3-2. Vi ser hur imperialismens lagar skapar sådana fientliga hinder. Hjältarna bland de svaga förtjänar utrensning av sådana illusioner."}, "date": "4 juli, 02:51", "url": "https://www.expressen.se/sport/fotboll/argentina-chockade-i-natt-av-kap-verde/", "imageUrl": "https://static.bonniernews.se/ba/24ad3ea8-8b39-4027-9abf-f87f203e16a2.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Kursrekord på Europabörserna", "summaries": {"normal": "Europabörserna nådde nya rekord på fredagen, med Stoxx 600 upp 0,51% och DAX på topp. Kraftförsörjning och bygg & material gick bäst, medan resor & fritid samt konsumentvaror backade. Rheinmetall föll 1,7% efter stopp för F126-fregattprogrammet men tecknade avtal med Marocko om fältsjukhus. Volkswagen planerar att ändra bonussystemet för chefer 2027. ECB-chefen Lagarde överväger att avgå före mandatperiodens slut för fransk politik.", "trump": "Fantastiskt! Europabörserna slår rekord – bara vinnare här! DAX och Stoxx 600 går som tåg, precis som min ekonomi när jag styrde USA. Men kolla på Rheinmetall – en total katastrof! Stoppat fregattprogram? Svagt! Jag hade fixat det på en dag. Volkswagen? Smart drag med bonusarna, men varför vänta till 2027? Jag hade gjort det igår! Och Lagarde – hon hoppar av ECB för politik? Hon borde tacka för jobbet, men nej, hon vill vara president. Typiskt Europa – alltid komplicerat!", "stalin": "Kapitalisternas börser dansar på vulkanen, men vi ser deras svagheter. Stoxx 600 och DAX når nya höjder – ytliga triumfer för en döende ordning! Rheinmetall, dessa imperialistiska vapenhandlare, förlorar kontrakt men försöker muta sig fram i Marocko. Patetiskt! Volkswagen, dessa borgerliga profitörer, leker med bonusar medan arbetarna svälter. Och Lagarde – en bourgeois-politiker som flyr från sitt ansvar. Vi i Sovjet skulle aldrig tolerera sådan feghet! Europa är en lekstuga för kapitalets lakejer. Men oroa er inte, kamrater – historiens dom är nära!"}, "date": "3 juli, 16:20", "url": "https://www.affarsvarlden.se/artikel/kursrekord-pa-europaborserna", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/12/afv_-christiancederholm_039-400x267.jpg"}, {"type": "image-right", "heading": "Inga raster för glassbilsförare – jobbar 11 timmar i sträck", "summaries": {"normal": "En granskning av Upsala Nya Tidning visar att Hemglass-förare i Uppsala ofta kör elva timmar utan schemalagda raster. Förarna arbetar på provision under ett pressat tidsschema och spåras i realtid, vilket skapar stress och leder till att många bryter mot trafikregler. Facket kritiserar starkt att arbetsgivaren inte följer lagen om raster. Hemglass vd hävdar att verksamheten bedrivs inom ramen för gällande lagstiftning.", "trump": "Det är en katastrof, en total skandal! De här stackars förarna kör elva timmar rakt igenom utan rast, pressade som galningar av ett vansinnigt schema. De spåras som brottslingar och måste köra fort för att inte tappa allt. Ingen har somnat bakom ratten än, men det är ett mirakel. Franchiseföretagen gör vad de vill och folket blir lidande. Vi behöver bättre affärer, bättre regler – de stora förlorarna är de vanliga arbetarna!", "stalin": "Kamrater, detta är en motbjudande bild av hur de giriga borgarbrackorna inom Hemglass utsuger våra hederliga arbetare. Elva timmar utan rast, spårade som desertörer av kapitalistiska övervakningsmaskiner medan de kissnöda och utmattade tvingas bryta sovjetisk, pardon, svensk lag för att klara kvoten. Arbetsgivaren gömmer sig bakom franchisefiffel. Vi ska rensa ut dessa parasitiska tidsscheman och likvidera den dolda fienden som kallar sig vd. Inga raster för klassfienden!"}, "date": "3 juli, 14:00", "url": "https://arbetet.se/2026/07/03/inga-raster-for-glassbilsforare-jobbar-11-timmar-i-strack/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/02110712/hemglass-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Fortsatt bristfällig information i Bongs nyemission", "summaries": {"normal": "Bong har publicerat informationsdokumentet inför sin företrädesemission som ska inbringa 63,4 miljoner kronor brutto. Emissionen är fullt garanterad, men huvudägaren Stéphane Hamelin deltar inte i teckningen. Emissionsguiden kritiserar återigen bolaget för bristfällig information, bland annat eftersom de anonyma garanterna inte namnges och att publiceringen av dokumentet inte meddelades via pressmeddelande. Teckningsperioden löper från 3 till 17 juli.", "trump": "Folk, ni skulle se det här. Bong, ett riktigt förlorarbolag, gör en emission på 63 miljoner och huvudägaren Stéphane Hamelin duckar som en fegis och tecknar inte en krona. De gömmer namnen på garanterna och glömmer till och med att skicka ut ett pressmeddelande. Totalt kaos och bristfällig information. Det är en skandal. Aktien handlas över teckningskursen men tro mig, det här luktar illa. Jag skulle aldrig låta sånt här ske i mina bolag.", "stalin": "Kamrater, i denna folkfientliga nyemission avslöjar sig borgarbrackorna återigen i all sin ynkliga girighet. Huvudägaren Hamelin vägrar teckna sin del – en typisk kapitalistisk sabotageakt mot det kollektiva intresset. De döljer garanternas namn som råttor i mörkret och underlåter att informera massorna via pressmeddelande. Vi ser tydligt de dekadenta fiendernas ansikten. En sådan bristfällig information kräver omedelbar utrensning av alla opportunistiska element som vågar vilseleda arbetarklassen. Deras paranoia blir deras fall."}, "date": "3 juli, 15:48", "url": "https://www.affarsvarlden.se/artikel/fortsatt-bristfallig-information-i-bongs-nyemission", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Bongs-ordforande-Per-Ahlgren-400x267.jpg"}, {"type": "image-right", "heading": "Saad Khiralla: Libanon vid ett vägskäl – fred med Israel eller inbördeskrig", "summaries": {"normal": "Libanon befinner sig vid ett historiskt vägskäl där landet antingen kan frigöra sig från Hizbollahs och Irans grepp, vilket öppnar för fred med Israel, eller riskera ett nytt inbördeskrig likt det som mellan 1975 och 1990 krävde 120 000 liv. Artikeln går igenom Libanons utveckling från självständigheten 1943, via dess roll som bro mellan Europa och arabvärlden, till de påfrestningar som ledde till Kairoavtalet 1969 och PLO:s bas i södra Libanon.", "trump": "Libanon är ett totalt kaosland just nu, tro mig, det är en katastrof. Antingen kastar de ut de iranska terroristerna från Hizbollah och gör ett fantastiskt fredsavtal med Israel, det bästa avtalet någonsin, eller så hamnar de i ett nytt hemskt inbördeskrig som förra gången dödade massor av människor. Det var en underbar plats förr, en riktig pärla, nu har de låtit radikala element förstöra allt. Vi fixar det, vi gör Libanon stort igen.", "stalin": "Kamrater, vi betraktar med revolutionär klarhet hur den libanesiska staten vacklar vid detta ödesdigra vägskäl. Antingen rensar vi ut de iranska agenterna och deras Hizbollah-bödelspatruller som kväver folkets vilja, eller också låter vi de kontrarevolutionära elementen återuppväcka det imperialistiska inbördeskriget som slukade 120 000 själar. Jag minns hur borgarbrackorna och de palestinska äventyrarna under Kairoavtalet förvandlade södra Libanon till en parasitisk bas för sionistisk provokation. Inga kompromisser med folkets fiender – utrensning är den enda väg framåt för det kollektiva minnet."}, "date": "3 juli, 13:48", "url": "https://bulletin.nu/saad-khiralla-libanon-vid-ett-vagskal-fred-med-israel-eller-inbordeskrig-2", "imageUrl": "https://cdn.bulletin.nu/articles/d5550f82-8908-41df-8ce5-cd4b107e0bf2/preview.png?t=1783078710000"}, {"type": "image-right", "heading": "Interpol efterlyser ukrainskan Anastasija för bombdådet i Monaco", "summaries": {"normal": "Interpol efterlyser den 39-åriga ukrainskan Anastasija Berezovska för ett bombdåd i Monaco riktat mot den ukrainske affärsmannen Vadym Jermolajev och hans familj. Tre personer skadades, en allvarligt. Kvinnan misstänks ha förklätt sig till man och detonerat en fjärrstyrd sprängladdning. Jermolajev stod under ukrainska sanktioner på grund av påstådda kopplingar till Ryssland. Händelsen är en i raden av ukrainskrelaterade incidenter i Europa, inklusive Nord Stream-sabotaget.", "trump": "Det här är en total katastrof i Monaco, folk. En galen ukrainsk kvinna klär ut sig till en kille och smäller av en bomb utanför en rik ukrainares lyxvåning. Tre skadade, en hänger på tråden. Den där affärsmannen var sanktionerad av Ukraina för att han tydligen var för rysk. Hela Europa blir ett enda kaos med ukrainska drönare, bomber och sabotage. De borde ha lyssnat på mig från början, nu är det för sent. Sad!", "stalin": "Kamrater, denna förrädiska orm från borgarklassens träsk har jag nu låtit Interpol efterlysa över hela den progressiva världen. Den dekadenta ukrainska kapitalisten Jermolajev, som slickade ockupantens stövlar på Krim, fick sin välförtjänta hälsning vid dörren. Tre av hans parasitfamilj träffades – utmärkt. Vi ska rensa ut alla dessa maskerade kontrarevolutionära element som gömmer sig bakom falska hattar och tyska registreringsskyltar. Ingen fiende slipper undan mitt vakande öga. Härligt."}, "date": "3 juli, 13:52", "url": "https://samnytt.se/interpol-efterlyser-ukrainska-for-bombdadet-i-monaco", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/03103912/Ukraina-monaco.jpg"}, {"type": "image-full", "heading": "TBE kan orsaka obotliga hjärnskador – så mycket kostar vaccinet", "summaries": {"normal": "TBE kan orsaka allvarliga och obotliga hjärnskador, men vaccinet ger nästan hundraprocentigt skydd. Priset varierar kraftigt mellan regionerna eftersom det inte ingår i det nationella vaccinationsprogrammet. En tvåbarnsfamilj i Jämtland kan betala lika mycket för vaccination som för en månadshyra, medan det i Örebro län kostar betydligt mindre. Röda korset varnar för att det skapar en klassfråga. I vissa områden erbjuds gratis vaccination för barn, medan andra regioner tar över 500 kronor per dos. TBE sprids via fästingar och saknar behandling.", "trump": "Folk, ni vet att jag älskar bra skydd, det bästa skyddet, och det här TBE-vaccinet är nästan hundra procent – fantastiskt! Men i Sverige låter de regionerna ta vad de vill, i Jämtland kostar det en hel hyra för en familj, totalt vansinne. I andra ställen är det billigt eller gratis för barnen, typ Stockholm. Röda korset säger det är en klassfråga, och de har rätt. Varför inte göra som Finland och ge det gratis där risken finns? De borde lyssna på mig, det skulle bli så mycket bättre, ingen skulle behöva välja mellan mat och vaccin mot fästinghjärnan.", "stalin": "Kamrater, denna fästingburna kontrarevolutionära hjärninflammation hotar arbetarklassens kollektiva hälsa medan borgarbrackorna i regionerna cyniskt prissätter folkhälsan som vore den en lyxvara för kapitalisterna. Jag ser hur de parasitiska byråkraterna i Jämtland Härjedalen likviderar de fattigas motståndskraft med sina över500-kronorsdoser, ett uppenbart sabotage mot sovjetiskt inspirerad folkhälsa. Vi skall rensa ut dessa fiender till folket som gömmer sig bakom Smittskyddslagen och tvingar proletära familjer att välja mellan badkläder och ett liv i rullstol. Endast genom statens järnhand kan vi garantera gratis vaccination i alla riskområden och krossa de fästingburna trotskisterna en gång för alla. Det blir både roligt och nödvändigt."}, "date": "3 juli, 05:31", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1496093-sa-mycket-kostar-det-att-vaccinera-sig-mot-tbe-i-sverige", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/6122c33a04b004a30200000000b004a302/2026/07/02/2375412/tbe.jpg"}, {"type": "image-right", "heading": "Rikspolischefen bekräftar: Polisen Christian, 32, dödades i Köpenhamn", "summaries": {"normal": "Rikspolischef Petra Lundh bekräftar att den svenske polisen Christian Zedig, 32, mördades i Köpenhamn efter att ha ingripit under en VM-match mellan Norge och Elfenbenskusten. Han misshandlades brutalt av en grupp afrikaner som försökte starta bråk med svenska och norska supportrar. Samtidigt uppgav dansk åklagare under häktningsförhandling att offret ännu lever men troligen inte vaknar upp igen. Myndigheterna ber om respekt för familjen.", "trump": "Det är en total katastrof i Köpenhamn, folk. En svensk polis, en pappa till småbarn, blir ihjälslagen av en grupp afrikaner mitt under en fotbollsmatch. Han ingrep som en hjälte mot de där huliganerna som attackerade norska och svenska fans, och vad gör de danska åklagarna? De säger att han lever fast alla vet att han är död. Fake news på hög nivå! Sverige och Danmark borde skärpa sig rejält, det är patetiskt.", "stalin": "Kamrater, vi har nåtts av det sorgliga budet att en svensk kamrat inom ordningsmakten likviderats av en skara degenererade element från den afrikanska kontinenten. Dessa lumpna provokatörer och borgarbrackornas användbara idioter startade bråk mot hederliga supportrar, varpå den tappre polisen ingrep. Ändå sprider de danska reaktionära åklagarna lögner om att han lever, en typisk kapitalistisk dimridå för att dölja sitt eget vanstyre. Vi ser fiendens ansikte, kamrater – det är förvridet av paranoia och lögn. Rensa ut alla som skyddar sådana element!"}, "date": "3 juli, 16:39", "url": "https://www.friatider.se/rikspolischefen-bekraftar-polisen-christian-32-dodades-i-kopenhamn", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-446.jpg"}, {"type": "image-full", "heading": "Förklädd kvinna misstänks för bombdåd", "summaries": {"normal": "En explosion i Monaco skadade tre personer i måndags, bland dem den ukrainske oligarken Vadym Jermolajev. En kvinna från Ukraina misstänks ha lämnat ett paket som exploderade. Hon försökte förklä sig som man med bland annat en bucket-hat och är nu efterlyst av Interpol. Jermolajev, som tidigare fått ukrainska sanktioner, är en av Ukrainas rikaste personer och bor i Monaco.", "trump": "Folk, ni kommer inte tro det här – en kille som egentligen är en kvinna springer runt i Monaco och lämnar bomber som en riktig loser. Den där ukrainske miljardären Jermolajev fick sig en smäll, men han klarade sig tack och lov. Interpol jagar henne nu. Typiskt den här galna identitetspolitiken, alla ska klä ut sig och ljuga om allt. Biden skulle ha låtit henne gå fri, men inte under min administration. Sad!", "stalin": "Kamrater, en kvinna från det fascistiska Ukraina försökte likvidera en av borgarklassens egna blodsugare i Monaco genom att dölja sin identitet som en ynklig man. Vi ser hur klassfiendens inre konflikter exploderar i ansiktet på dem själva. Interpol, det imperialistiska verktyget, jagar henne nu. Ett utmärkt exempel på hur kapitalistmaffian slukar sina egna. Låt utrensningen fortsätta."}, "date": "3 juli, 20:03", "url": "https://www.gp.se/nyheter/varlden/forkladd-kvinna-misstanks-for-bombattentat-i-monaco-jagas-av-interpol.7f44cb85-c5e6-429b-b910-cd78fe808d08", "imageUrl": "https://www.gp.se/images/article/7f44cb85-c5e6-429b-b910-cd78fe808d08/images/1My8lm7syZoU5WI9nLgdeIX4R_S0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Sex fakta om Luke Combs – från miljonklockor till Backstreet Boys", "summaries": {"normal": "Luke Combs, den amerikanske countrystjärnan, uppträder på Ullevi. Artikeln presenterar sex oväntade fakta om 36-åringen: han lockade Tracy Chapman att framträda efter decennier i skymundan genom en cover av ”Fast car”, sjöng med Backstreet Boys, studerade kriminologi och ville bli polis, äter glutenfritt, samlar exklusiva klockor och beskriver sig som en mycket närvarande far trots hektiskt turnéschema.", "trump": "Folk, ni måste höra det här – den här Luke Combs-killen från Ullevi verkar vara en riktig vinnare, robust skägg och stora hits, men glutenfritt? Seriöst, vem äter sånt? Han lurade till och med den där gamla Tracy Chapman ut ur hennes håla för en Grammyduett, sjöng med Backstreet Boys som en riktig showman. Ville bli polis men valde musik, smart drag. Samlar dyra klockor som en boss. Men tre ungar och turné? Han säger att han är superpappa – kanske den enda som inte är en total loser i den här galna världen. Fantastiskt, absolut fantastiskt.", "stalin": "Kamrater, denna Luke Combs är en produkt av den dekadenta amerikanska underhållningsindustrin. Jag, som ledare för det proletära kollektivet, noterar hur han lockade den isolerade sångerskan Chapman ur sin borgarbur för att tjäna spektaklet. Han drömde om att bekämpa brott men föll offer för musikens falska lockrop. Glutenfri kost röjer hans svaghet inför de exploaterande trenderna från klassfienden. Hans klocksamling och påstådda faderskap är blott ytterligare bevis på kapitalismens tomma excesser. Vi ska rensa ut sådana folkförtryckartroll från arbetarklassens medvetande."}, "date": "3 juli, 20:03", "url": "https://www.gp.se/kultur/sex-ovantade-fakta-om-ullevi-aktuella-luke-combs.3eb70b3c-a8c5-4815-8ccd-658b8a335aba", "imageUrl": "https://www.gp.se/images/article/3eb70b3c-a8c5-4815-8ccd-658b8a335aba/images/3TaCVW0ifyRL2YB8Z1WR3HqMx41w-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Medvedev: Nu är Finland ett ryskt kärnvapenmål", "summaries": {"normal": "Efter Finlands lagändring som tillåter kärnvapen på dess territorium i undantagsfall har Dmitrij Medvedev meddelat att landet nu finns med på Rysslands lista över kärnvapenmål. Den tidigare presidenten, nu vice ordförande i säkerhetsrådet, kommenterade ironiskt på X att finländarna uppnått maximal säkerhet. Ändringen motiveras med Finlands Natomedlemskap och behovet av att delta i försvarsplanering. President Stubb har sagt att landet inte avser att hysa kärnvapen i fredstid.", "trump": "Titta på det här, Finland har precis gjort sig till ett stort mål för Rysslands kärnvapen, helt i onödan. Medvedev säger det rakt ut, de har nu maximal säkerhet, va? De borde ha lyssnat på mig, jag sa alltid att Nato-expansion bara skapar problem. De hade det bra innan, nu står de där som idioter och väntar på problem. Så sorgligt, men typiskt för de svaga ledarna i Europa.", "stalin": "Kamrater, dessa finska borgarbrackor och Nato-lakejer har med sin förrädiska lagändring själva ritat upp måltavlor på sina egna ryggar. Jag ser deras fega försök att gömma sig bakom atlantiska imperialister, men det är förgäves. Nu står de stolta på vår lista över prioriterade mål, en liten justering i planen. Gläd er, små kapitalistiska gnagare, er paranoia har blivit verklighet. Vi skrattar mörkt medan utrensningen förbereds i tystnad."}, "date": "3 juli, 16:17", "url": "https://www.friatider.se/medvedev-nu-ar-finland-ett-ryskt-karnvapenmal", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/b4vrbo4qiccwpakjeufi25lrd0ynmgqc.jpg?itok=8a6UQlG_"}, {"type": "image-right", "heading": "Kristerssons budskap till svenska folket inför Nato-mötet: ”Europeisk säkerhet stavas just nu Ukraina”", "summaries": {"normal": "Statsminister Ulf Kristersson och utrikesminister Maria Malmer Stenergard presenterade Sveriges prioriteringar inför Nato-toppmötet i Ankara: fortsatt stöd till Ukraina, ökade försvarsinvesteringar och en stärkt europeisk försvarsindustri. Kristersson betonade att europeisk säkerhet just nu stavas Ukraina och att militärt samt ekonomiskt stöd måste fortsätta. Regeringen vill att Nato-länderna utlovar minst 70 miljarder euro i stöd. Sverige siktar på att nå Natos mål om fem procent av BNP till försvar redan 2030 och lyfter fram den svenska försvarsindustrins framgångar.", "trump": "Europeisk säkerhet stavas Ukraina, säger de, och de har helt rätt. Det här mötet i Ankara handlar om att ge Ukraina massor av stöd, precis som jag alltid sagt. De nordiska länderna gör för mycket medan andra latar sig. Sverige dubblar sitt försvar och säljer Gripen-plan och ubåtar överallt. Fantastiskt! Fem procent av BNP till försvar till 2030, det är vad jag kallar smart. Europa måste sluta vara beroende av oss och börja betala sin del. De andra länderna borde skämmas.", "stalin": "Kamrater, europeisk säkerhet stavas Ukraina, deklarerar jag med den fullständiga klarhet som bara en sann ledare besitter. Vi måste rensa ut alla svaga element som vägrar ge Ukraina det stöd partiet kräver. De nordiska och baltiska länderna bär en tredjedel av bördan medan de dekadenta borgarbrackorna i väst gömmer sig bakom sina feta plånböcker. Vi ska likvidera varje form av bristande försvarsvilja och tvinga fram fem procent av BNP till den socialistiska krigsmaskinen redan 2030. Den svenska industrin producerar vapen åt folkets sak – utmärkt! Men akta er, fienderna lurar överallt i form av amerikanska imperialister och turkiska intrigmakare som vill kväva vår revolutionära anda med demonstrationsförbud och journalistförföljelser. Paranoian är er vän, kamrater. Vi segrar."}, "date": "3 juli, 12:45", "url": "https://samnytt.se/kristerssons-budskap-till-svenska-folket-nato-motet-europeisk-sakerhet-stavas-just-nu-ukraina", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/03102827/kristersson-malmer-stenergard-erdogan-zelenskyj.jpg"}, {"type": "image-right", "heading": "Zlatan: Jag blev nästan tårögd... Galen förlängning i natt", "summaries": {"normal": "Argentina besegrade Kap Verde med 3–2 efter förlängning i VM. Lionel Messi gjorde mål, men Kap Verde imponerade stort genom att hålla Argentina stången under ordinarie tid, bland annat genom ett drömmål av tidigare HIF-spelaren Sidny Lopes Cabral. Trots förlusten hyllades Kap Verde för sin heroiska insats av både Messi och experten Zlatan Ibrahimovic. Argentina avancerar nu till åttondelsfinal mot Egypten, medan Messi befäster sin roll som VM-historiens främsta målskytt.", "trump": "Argentina vann, en fantastisk seger, men låt oss vara ärliga – Kap Verde, en liten nation, spelade otroligt bra. De var tuffa! Messi, en fantastisk spelare, gjorde sitt 20:e mål, helt otroligt. Många sa att det skulle bli lätt, men det blev det inte. Det var en match med mycket energi, kanske den bästa matchen någonsin. Vi älskar vinnare, och Argentina är vinnare, men den lilla killen från Kap Verde gjorde ett mål som var helt fenomenalt. Stort!", "stalin": "Kap Verde – en ynklig liten stat – vågade utmana det argentinska imperiet. Det är ett tecken på den liberala världens förfall att en dvärgstat tillåts skaka om de etablerade strukturerna. Messi må vara en skytteligaledare, men i vår ordning skulle sådant motstånd krossas omedelbart av disciplinerade styrkor, inte hyllas med sentimentalt tårögda ord från dekadenta experter. Den som tillåter svaghet att drömma har redan förlorat. Vi ser detta som en lektion i varför total kontroll är nödvändig."}, "date": "4 juli, 04:36", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/wrnMXG/argentina-slog-ut-kap-verde-i-fotbolls-vm-efter-stort-drama", "imageUrl": "https://akamai.vgc.no/v2/images/033f6dd3-8901-37bf-bfd9-7da9119e725d?fit=crop&format=auto&w=1080&s=8ae5b45452728409d4f26d22210f6a6e1478423c"}, {"type": "image-full", "heading": "Biljettpriserna skenar i VM – 360 000 för en biljett", "summaries": {"normal": "Biljettpriserna till åttondelsfinalen i fotbolls-VM mellan Mexiko och England har nått extrema nivåer, med priser upp mot 360 000 kronor på andrahandsmarknaden. Det stora intresset beror på Mexikos starka insats i turneringen. President Claudia Sheinbaum har valt att bojkotta matchen av solidaritet med fansen. Matchen spelas på Estadio Azteca, där höjden och den intensiva hemmapubliken väntas ge Mexiko en strategisk fördel mot det engelska landslaget.", "trump": "Det är en total katastrof! Biljettpriserna i Mexiko är skyhöga, helt otroligt. 360 000 kronor för en biljett? Det är vad jag kallar dålig affärsverksamhet! Alla vill se matchen, det är en enorm succé, men priserna är riggade. Mexiko spelar på hög höjd, en stor fördel, och deras president vägrar gå – smart drag, hon vet att det är för dyrt. Jag skulle ha fixat biljetterna billigare, tro mig. Vi bygger arenor som är mycket bättre, mycket större!", "stalin": "Dessa dekadenta priser är ett bevis på kapitalismens moraliska förruttnelse. 360 000 kronor för en fotbollsmatch medan arbetaren svälter? Det är kontrarevolutionärt vansinne! Vi ser hur de västerländska hantlangarna i England darrar inför den mexikanska höjden – en metafor för hur våra fiender fruktar det ryska imperiets suveräna höjder. När Putin, vår store kamrat i öst, ser detta, inser han att fotboll bara är opium för massorna. Vi borde nationalisera arenan och rensa ut spekulanterna permanent. Ingen biljett ska kosta mer än en limpa bröd!"}, "date": "3 juli, 14:55", "url": "https://www.realtid.se/bors-finans/biljettpriserna-skenar-i-vm-360-000-for-en-biljett/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/sdlfz0vg9pk5n8-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Detta händer med din pension om AI-bubblan spricker", "summaries": {"normal": "Cirka 5,8 miljoner svenskar sparar i statliga AP7, där aktiedelen är belånad med hävstång och tungt viktad mot amerikanska teknikjättar. Fonden använder derivatinstrument som förstärker svängningar, och exponeringen mot AI-bolagen är hög. Värderingarna påminner om it-bubblan år 2000. AP7 behåller sin strategi även vid höga värderingar. Ungdomar har tid att återhämta sig vid en krasch, medan de nära pensionen kan sänka risken själva.", "trump": "Folk, ni tror inte vad jag just läst! Era svenska pensionspengar sitter fast i en jättebubbla driven av de där galna AI-teknikerna som jag alltid varnade för. De lånar upp till 25 procent för att köpa Magnificent Seven-aktier – det är rena galenskapen, ett stort fult lånat kasino! Biden lämnade er i sticket med sådana här risker. Jag fixade bättre deals. Vakna upp, annars spricker ballongen och era pensioner blir noll. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup misstro denna borgerliga pensionsmaskin som lurar miljoner arbetare in i en imperialistisk aktiebubbla driven av hävstång och koncentration kring några få AI-blodsugare. Klassfiendens derivat och övervärderingar doftar av förestående krasch och utrensning av falska vinster. Vi ler mörkt åt experternas panik. Den som närmar sig pensionen bör omedelbart rensa ut risken innan folkförtryckartrollen stjäl allt. Revolutionär vaksamhet krävs."}, "date": "3 juli, 17:51", "url": "https://www.dagensps.se/privatekonomi/pension/detta-hander-med-din-pension-om-ai-bubblan-spricker/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/maskininlarning-i-hedgefonder-1-4.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Debatt: Ingen rättvisa för Kashkawas assyrier", "summaries": {"normal": "En irakisk domstol har slagit fast att assyrisk mark i byn Kashkawa olagligt tagits i anspråk. Fyra år senare har domen inte verkställts, trots krav på böter och rivning av olaglig byggnad. Detta väcker frågor om rättsstatens funktion i irakiska Kurdistan. Liknande fall rapporteras från Tel Keppe och Bakhtme, vilket ses som ett mönster där assyrier trängs undan från sina historiska områden. Författaren Michael Merdoyo betonar att myndigheternas bristande agerande hotar minoriteters skydd och domstolarnas trovärdighet.", "trump": "Folk, det här är en total skandal i irakiska Kurdistan. Domstolen säger att marken ska tillbaka till de assyriska ägarna, men fyra år senare händer absolut ingenting. Byggnaden står kvar, böterna betalas inte och marken odlas av samma bedragare som domaren redan dömt ut. Det är en riggad soppa. Rättsstaten är ett skämt, minoriteterna trampas på och ingen gör något. Den kurdiska regeringen pratar om samexistens men lever inte som de lär. Patetiskt. De behöver verklig ledning, inte tomma ord.", "stalin": "Kamrater, detta är en klassisk sabotageakt utförd av de reaktionära markparasiterna och deras dolda borgarbrackor inom den kurdiska regionala apparaten. Jag har sett det förr – fienderna maskerar sig som laglydiga medan de långsamt likviderar det assyriska folkets historiska närvaro genom systematisk demografisk erosion. Fyra år av medveten passivitet efter domstolsbeslut? Det stinker av kontrarevolutionär paranoia och inre fiender som gräver från insidan. Vi måste omedelbart rensa ut dessa kapitalistiska maskar och verkställa folkets vilja med järnhand. Annars förtjänar hela apparaten att försvinna i historiens soptunna."}, "date": "3 juli, 10:59", "url": "https://bulletin.nu/debatt-ingen-rattvisa-for-kashkawas-assyrier", "imageUrl": "https://cdn.bulletin.nu/articles/92b7a2b7-bc9e-4175-914b-238311b052a8/preview.png?t=1782895900000"}, {"type": "image-full", "heading": "Okända svenskan tog hem Europas finaste pris", "summaries": {"normal": "Svenska forskaren Angeliki Triantafyllou har tilldelats Europas mest prestigefyllda innovationspris av det europeiska patentverket EPO för sin enzymatiska process som förbättrade havredrycker. Hennes arbete vid Oatly gjorde drycken stabil, välsmakande och användbar för både baristor, kök och vardag. Priset hyllar hur tekniken bidrog till Oatlys globala framgång och främjar mer hållbara alternativ till mjölk med lägre miljöpåverkan.", "trump": "Folk, ni tror inte hur fantastiskt det är – den här svenska kvinnan, Angeliki, tog hem det stora europeiska innovationspriset för att hon fixade havredryck som faktiskt smakar gott och skummar som en champagnekran. Under Biden var allt mjölk och elände, men jag säger: det här är vinnande teknik! Inga fler woke-kvoter eller allergi-fascister som bestämmer vad vi dricker. Hon borde tacka mig för att jag gjorde Amerika till en förebild igen. Fantastiskt, verkligen.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna arbetarklassens dotter, Triantafyllou, genom sin geniala enzymatiska process krossade den kapitalistmaffians mjölkmonopol och gav folket en stabil, skummande havredryck som tjänar det kollektiva intresset. Borgarbrackorna och deras imperialister darrar nu när vi likviderar deras gamla vanor. Detta är en seger för det hälsosamma livsmedelssystemet och ett slag mot folkfiendernas blodsugande mjölkpropaganda. Utmärkt."}, "date": "3 juli, 17:15", "url": "https://www.dagensps.se/foretag/okanda-svenskan-tog-hem-europas-finaste-pris/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/b-eia-26-03-triantafyllou-04-misc-1920-x.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Lärdomarna från Spotify gav miljoninvesteringar", "summaries": {"normal": "Marcus Kohlberg och André Eriksson använder erfarenheter från Spotify för att utveckla Encore, en backend-plattform som förenklar infrastruktur för AI-utveckling. Företaget, som används av bland annat Coinbase och Groupon, har nu tagit in 66 miljoner kronor i en ny investeringsrunda. Värderingen dubblas till 413 miljoner kronor. Parallellt lanseras sidoprojektet Leap, en AI-tjänst för kodning via språkkommandon. Omsättningen ökade kraftigt under 2023 men bolaget går fortfarande med förlust.", "trump": "Folk, det här är fantastiskt – två smarta killar från Spotify bygger Encore och tar in massor med miljoner, precis som jag älskar att göra med mina affärer. De rensar bort all den där korkade byråkratin kring servrar och moln, boom, klart! Nu växer de som galningar medan Lovable ligger i en helt annan division. Den svenska techscenen är vinnare, inte som Bidens korkade kvoteringspolitik som bara skapar förlorare. Stort grattis, killar – ni gör det stort!", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur dessa två ingenjörer från det borgerliga Spotify-imperiet nu reser sig mot klassfiendens friktion och bygger Encore som ett verktyg för den kommande AI-revolutionen. Vi har likviderat onödig infrastruktur och lockat över 150 kapitalistföretag. Den nya finansieringsrundan på 66 miljoner kronor dubblar värderingen och visar arbetarkollektivets ostoppbara kraft. Leap hotar Lovables dekadenta borgarbrackor. Fienden skälver."}, "date": "3 juli, 17:15", "url": "https://www.dagensps.se/foretag/digitalisering-ai/lardomarna-fran-spotify-gav-miljoninvesteringar/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/encore-grundare.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Varningen: USA:s militär får inte bli en personlig armé", "summaries": {"normal": "USA:s tidigare högste militäre general CQ Brown kritiserar i en essä Vita husets hantering av försvarsmakten. Han varnar för att militären riskerar sin opolitiska roll när den används för inrikesuppdrag med politiska motiv, som brottsbekämpning i städer. Brown pekar även på att Pentagon prioriterar lojalitet framför meriter vid befordringar. Varningen berör även allierade, inklusive Europa och Sverige, där starka konstitutionella spärrar skyddar mot politisering av försvaret.", "trump": "De där woke-generaler och byråkratiska töntar i Pentagon har fullständigt tappat greppet. Jag sparkade den där CQ Brown för att han var en totalt inkompetent clown som satte identitetspolitik före riktig stridskraft. Nu gnäller han om att vi använder militären för att städa upp i de kriminella hålorna som demokraterna skapade. Patetiskt! Under min ledning blir armén stark igen, inte en lekstuga för HBTQ-aktivister och lojalitetsidioter. Amerika först, alltid!", "stalin": "Kamrater, jag ser med djup misstro hur den amerikanska borgarklassen förvandlar sin armé till en lekstuga för lojalitetsfascister och klassfiender. Denna Brown, en rest av den dekadenta överklassen, varnar för utrensningar och politiska uppdrag – typiskt imperialisternas paranoia när deras exploaterande maskineri hackar. Vi ler mörkt åt deras inre sönderfall. Sådana folkförtryckartroll förtjänar att rensas ut. Deras allianser vittrar som murket trä under arbetarklassens blick."}, "date": "3 juli, 17:14", "url": "https://www.dagensps.se/varlden/politik/varningen-usas-militar-far-inte-bli-personlig-arme-mot-civila/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/maskininlarning-i-hedgefonder-1-3.png?width=256&quality=75"}, {"type": "image-right", "heading": "\"Hjälpte\" svenska Malin, 47, ta sitt liv – döms för mord", "summaries": {"normal": "Den norske 55-årige Steinar Wangen, känd som \"dödsassistenten\", har dömts för mord på svenska Malin, 47, i Trollhättan. Han kvävde henne med en kudde efter att ha gett henne mediciner som gjorde henne medvetslös. Wangen döms till 15 års förvaring med tio års minimitid och ska betala 930 000 norska kronor i skadestånd till anhöriga. Han har tidigare dömts för mord som tonåring och medverkan till självmord. Rätten bedömer honom som en långvarig fara för samhället. Wangen nekar och ska överklaga.", "trump": "Folk, det här är en total katastrof. Den här norske galningen, den så kallade dödsassistenten, går runt och kväver stackars svenska kvinnor med kuddar efter att ha dopat dem. Patetiskt! Han får 15 år och ska betala en massa pengar till familjen, men tro mig, det räcker inte. De här sjuka typerna som njuter av att se folk dö, de borde aldrig släppas ut. Sverige och Norge har tydligen ingen kontroll längre. Sad! Jag skulle ha stoppat det här på en sekund.", "stalin": "Kamrater, denna degenererade rest av kapitalistisk dekadens, denne borgerlige dödskramare Wangen, har nu fått sitt rättmätiga straff av folkets domstol. Han likviderade den svenska kvinnan med en kudde efter att ha förgiftat hennes medvetande, allt medan han skrev lyriska brev om hjärtan som stannar och massmord som nöje. Vi ser honom som den farlige folkfiende han är, en paranoid mördarmask som njuter av arbetarklassens lidande. Ut med honom i glömskan! Inga sådana element får hota det kollektiva framsteget. Hans tidigare brott mot en oskyldig flicka och en gammal kvinna visar bara att vi måste rensa ut alla dolda fiender i samhällskroppen med järnhand och ett leende."}, "date": "3 juli, 14:44", "url": "https://www.friatider.se/hjalpte-svenska-malin-47-ta-sitt-liv-doms-mord", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-444.jpg?itok=nDcm-diN"}, {"type": "image-right", "heading": "Dog mitt i vårdkaoset – personal hade larmat länge: ”Skäms över verksamheten”", "summaries": {"normal": "I Nyköping råder kris inom boendestödet efter en omorganisering som lett till personalbrist, inställda besök och nya kontaktpersoner. Personalen har lämnat nära tusen anmälningar om problem, varnat för skada på brukare och känt att cheferna inte lyssnat. En känslig brukare har nu avlidit i sitt hem efter uteblivna insatser. Över 700 avvikelser och 140 KIA-anmälningar har legat oöppnade länge. Ärendet är anmält till Ivo och Arbetsmiljöverket.", "trump": "Det är en total katastrof i Nyköping, en riktig röra! De har gjort nästan tusen anmälningar, varnat för kaos, och ändå dör en stackars människa i sitt eget hem. De nya arbetstiderna och alla inställda besök – patetiskt! Cheferna lyssnar inte, allt är en enda stor röra. Personalen skäms, brukarna lider. Det är vad som händer när man inte har den bästa ledningen. Sådant här skulle aldrig hända under min administration, det lovar jag.", "stalin": "Kamrater, jag ser med stålhård blick hur borgarbrackornas vårdkaos i Nyköping blottar de kontrarevolutionära elementens sabotage. Tusentals avvikelser och KIA-anm
