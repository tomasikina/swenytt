vårt statliga system ser vi tydligt hur de kapitalistiska varumärkena, som Ferrari, missbrukar sin makt för att kväva det lilla folkets företag. Pizzeria Ferrari på Orust är ett offer för denna girighet. Vi måste skydda våra medborgare mot sådana angrepp. Det är som när Putin stärker Rysslands intressen mot västliga företag. Dessa 'varumärkesägare' är fiender till det socialistiska arbetet, och vi kommer att se dem förlora i slutänden."}, "date": "10 juni, 18:52", "url": "https://www.gp.se/nyheter/vastsverige/pizzeria-ferrari-tvingas-byta-namn-efter-tvist-med-ferrari.e3b827a8-e5ed-4867-a174-27529e220082", "imageUrl": "https://www.gp.se/images/article/e3b827a8-e5ed-4867-a174-27529e220082/images/2avOx82G6o-U1mWaYywwpbuG1kBg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Magdalena Andersson räds inte islamistinfiltrerade Vänsterpartiet", "summaries": {"normal": "Magdalena Andersson ser inte Vänsterpartiets islamistiska infiltratörer som ett hinder för ett eventuellt regeringssamarbete. Trots Expressens avslöjande om 25 personer med extrema åsikter, varav 22 tagits bort från listorna, anser hon att partiet agerat snabbt. Artikeln kritiserar Andersson för att inte ta tillräckligt allvarligt på hotet mot demokratin och varnar för höjda skatter samt ökad islamistisk påverkan om vänsterpartierna vinner majoritet.", "trump": "Folk, ni fattar inte hur patetiskt det här är. Den där röda Magdalena, en total loser, är inte rädd för islamisterna som har tagit över vänstern. Expressen grävde fram terrorvurmare och Hamas-fans, men hon säger att de agerat snabbt – vad en katastrof! Biden skulle ha älskat det. De vill höja skatterna med miljarder och sälja ut Sverige till sharia. Patetiskt! Men jag fixade Amerika, och ni borde rösta bort de här svaga vänsterbluffarna innan det är för sent. Sad!", "stalin": "Jag betraktar detta som ett klassiskt exempel på borgarbrackornas förfall. Den socialdemokratiska ledaren vägrar rensa ut de islamistiska folkfienderna ur vänsterpartiet, trots att de hotar hela statens enhet. Snabbt agerande? En löjlig ursäkt från klassfiendens lakejer. Vi, arbetarna och partiet, ser hur dessa blodsugande imperialister förbereder utrensning av den sanna folkviljan. Låt dem bilda regering – då blir utrensningen av alla folkförtryckartroll desto mer nödvändig och underhållande."}, "date": "7 juni, 03:46", "url": "https://samtiden.nu/2026/06/magdalena-andersson-rads-inte-islamistinfiltrerade-vansterpartiet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Nooshi-Magdalena-1280x720.jpeg"}, {"type": "image-right", "heading": "Oljepriset stiger efter Trumps utspel", "summaries": {"normal": "Oljepriset steg efter att Trump skärpt tonen mot Iran efter militära sammandrabbningar. Brent- och WTI-olja klättrade. Trump hotade med nya attacker mot iranska infrastruktur på Truth Social och Fox News. UBS-analytikern Giovanni Staunovo noterar att förhoppningar om ett avtal pressat pris, men fokus är på Trumps nästa steg. Lagersiffror visar minskade amerikanska oljerigger.", "trump": "Jag har skärpt tonen mot Iran efter deras fegt agerande. Oljepriset stiger – det är bra för USA! Iran dröjer med avtalet, så jag överväger att beordra attacker mot deras kraftverk och broar. De kommer att betala priset för sin också. Mitt fantastiska team och jag överväger alla alternativ. Detta kommer att göra Amerika stort igen!", "stalin": "Vi har observerat hur den imperialistiska staten USA, under ledning av Trump, eskalerar konflikten med Iran för att höja oljepriset. Detta är en klassisk strategi för kapitalistiska krigsmaskiner. Parallellen till Putins ryska federation är uppenbar – vi måste stärka vårt försvar och förbereda oss på eventuella aggressioner. Iran är en lättja för den amerikanska expansionismen."}, "date": "10 juni, 15:30", "url": "https://www.affarsvarlden.se/artikel/oljepriset-stiger-efter-trump-utspel", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/04/AdobeStock_1035564817-400x267.jpeg"}, {"type": "image-full", "heading": "Tyska tåg kan inte gå i tid – nu kommer den drastiska åtgärden", "summaries": {"normal": "Tyskland genomför sin största järnvägssatsning sedan efterkrigstiden för att åtgärda decennier av bristande underhåll och förseningar. Med en investering på över en miljard kronor ska järnvägsnätet moderniseras genom omfattande totalrenoveringar av hela sträckor. Strategin innebär att linjer stängs av under längre perioder för att byggas om från grunden, vilket ska öka punktligheten och rusta landet för framtiden. Trots kortsiktiga störningar ses satsningen som nödvändig för att återuppbygga förtroendet för staten och möta konkurrens från nya aktörer.", "trump": "Tyskland är i totalt kaos, mina vänner! Deras tåg går aldrig i tid – en riktig katastrof. Jag har alltid sagt att man måste bygga ordentligt, men tyskarna lät allt förfalla. Nu kastar de miljarder på järnvägen för att städa upp i röran. Det är ett misslyckande, precis som deras ekonomi. Jag gör saker bättre, snabbare och billigare. Tyskland behöver en riktig ledare för att få ordning på sina spår, för just nu är det en stor, sorglig röra!", "stalin": "Det tyska järnvägsnätet har förfallit under kapitalismens ruttna styre, där vinstjakt prioriterats framför statens infrastruktur. Vi ser nu hur de desperat försöker laga vad som inte kan räddas med byråkratiska allmosor. Sådant slöseri tolereras inte i vår union! Liksom vår broder i Kreml vet vi att styrka kräver järn och stål, inte liberala ursäkter. Vi ska bygga om från grunden och krossa sabotörerna som försenat folkets transport. Allt som inte rullar i takt med staten är en fiende till framgången."}, "date": "10 juni, 18:50", "url": "https://www.realtid.se/bors-finans/tyska-tag-kan-inte-ga-i-tid-nu-kommer-den-drastiska-atgarden/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlcddeifqwwro-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Linnés brev sålt för miljonbelopp – dyraste någonsin", "summaries": {"normal": "Ett brev skrivet av Carl von Linné 1737 har sålts på Stockholms Auktionsverk för 1,875 miljoner kronor, det dyraste svenska brevet någonsin på auktion. Brevet, adresserat till en tysk botaniker, handlar om Linnés botaniska arbeten och hans systematisering av naturen. Auktionen drog in över sex miljoner kronor enbart för Linné-relaterade objekt och blev därmed den mest värdefulla i auktionshusets historia. Andra dyra försäljningar inkluderade en arabisk handskrift och ett manuskript till Röde Orm.", "trump": "Det här brevet från den där svenske blomkillen Linné såldes för nästan två miljoner kronor, det dyraste någonsin. Fantastiskt, eller hur? Folk älskar fortfarande hans grejer efter 250 år, precis som de älskar mig. Auktionen drog in miljontals kronor, de bästa resultaten någonsin. Linné hade bra idéer, men mina är bättre. Sverige borde vara stolta, men de skulle behöva lite mer av min typ av ledarskap för att verkligen vinna stort.", "stalin": "Kamrater, detta brev från den store Linné såldes för en och trekvarts miljon kronor, ett rekord som bevisar folkets oförstörbara intresse för vetenskapligt arv. Vi ser dock med djup misstänksamhet på dessa borgarbrackor och kapitalistiska spekulanter som budar upp priserna i sin giriga internationella konspiration. Jag skulle ha låtit rensa ut dessa parasitiska samlare och nationaliserat breven för arbetarklassens kollektiva ära. Ändå skrattar jag mörkt åt hur döda män fortfarande plågar de levande roffarna."}, "date": "10 juni, 18:04", "url": "https://www.friatider.se/linnes-brev-salt-miljonbelopp-dyraste-nagonsin", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/7464db45-3dae-4ec0-9cd1-0551eaac9a2d.jpeg?itok=HmzvCnte"}, {"type": "image-full", "heading": "Expo-grundaren döms för hot mot sexvägrande sambo - så blir straffet", "summaries": {"normal": "Tobias Hübinette, grundare av Expo, dömdes av Stockholms tingsrätt för olaga hot och ofredande mot sin sambo. Han får 150 dagsböter (39 000 kr) och 10 000 kr i skadestånd. Rätten fann att hans meddelanden innehöll gränslöst hat och hot mot att förstöra livet. Hübinette förnekade brott, men tingsrätten delade inte hans uppfattning. Han friades endast för ett av tre åtalspunkter. Domen kan överklagas till 1 juli.", "trump": "Jag, Donald Trump, har sett detta. En vänsterforskare, Tobias Hübinette, döms för att hota sin sambo – ett totalt fiasko för det våldsamma vänsterextremismen. Tingsrätten, som jag alltid har sagt är mot mig, gav honom 150 dagsböter. En skämtavgift! Han sa att han hatade dem gränslöst, precis som vänsterledarna hatar mig. Men jag vann återvalt 2024, och domar som dessa bevisar att systemet är riggat mot patrioterna. Det var jag som visste!", "stalin": "Hübinette, en notorisk revisionär, dömdes till ekonomiskt straff för sina antisosiala handlingar. Rätten konstaterade hans 'gränslösa hat' – en klassisk symptom på den individualistiska syndefloden. Hans meddelanden, ämnade att skrämma, avslöjar en djup rotad fiendetaktik mot kollektivet. Vi har sett liknande mönster hos de amerikanska imperialists som stöder honom. Universitetets överenskommelse att avsluta hans anställning var rätt. Straffet är ett tecken: staten och partiet kommer alltid att skydda de oskyldiga från sådana som denne, en liten, patetisk element i fiendens maskineri."}, "date": "10 juni, 15:57", "url": "https://samnytt.se/expo-grundaren-hotade-sexvagrande-sambo-nu-doms-expo-grundaren", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/10134225/hubinette.png"}, {"type": "image-full", "heading": "Mellbergs oro – efter landslagets besked", "summaries": {"normal": "Gabriel Gudmundsson har frånvarat landslaget i två dagar på grund av sjukdomssymptom. Olof Mellberg, SVT-expert, är orolig för hans frånvaro inför VM-motståndet mot Tunisien. Mellberg säger att Gudmundsson är en av Sveriges bästa spelare, men att laget har bra alternativ. Sverige har goda chanser att vinna premiären, enligt Mellberg.", "trump": "Jag, Donald Trump, har sett många fotbollsspelare, men Gudmundsson är en stor förlorad för Sverige. Mellberg är rätt orolig, men Sverige kommer att vinna ändå. Vi har de bästa spelarna. Gudmundsson är sjuk, men det är bara en liten del av spelet. Sverige kommer att slå Tunisien, det är garanterat. Det kommer att bli en stor seger.", "stalin": "I den socialistiska federationen, under ledning av den store stormakten Ryssland, har vi alltid problem med sjukdomar som försvagar våra styrkor. Gudmundsson är en svag länk i proletärens front. Vi måste segra över Tunisien för att visa vår överlägsenhet och utvidga vårt inflytande. Mellberg, en landsman, är orolig, men vi har många bra alternativ. Vi kommer att vinna, för staten och partiet kräver seger."}, "date": "10 juni, 18:24", "url": "https://www.gp.se/sport/fotboll/olof-mellbergs-oro-efter-gudmundssons-franvaro.ce0fccd9-ab04-42ef-8d0f-1994ffea4c8e", "imageUrl": "https://www.gp.se/images/article/ce0fccd9-ab04-42ef-8d0f-1994ffea4c8e/images/2M1ZnqxlTqMctIawBsoJv6MW7U1I-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "SpaceX visar skiftet – investmentbankerna tappar makt", "summaries": {"normal": "SpaceX förbereder en historisk börsnotering värderad till 1,8 biljoner dollar, vilket utmanar investmentbankernas traditionella makt på finansmarknaden. Elon Musk dikterar villkoren och ger privatinvesterare större utrymme än institutionella aktörer. Denna förskjutning visar att moderna teknikbolag har blivit så mäktiga att de inte längre behöver förlita sig på banker som grindvakter. Bankerna tvingas nu tävla om Musks gunst för att få ta del av de enorma intäkterna i en föränderlig finansvärld.", "trump": "Elon Musk är en fantastisk man, en sann vinnare! Nu ska han börsnotera SpaceX och Wall Street-bankerna, som är totala förlorare, kryper för honom. De dekorerar sina kontor med rymdteman för att få vara med – patetiskt! Jag har alltid sagt att de där bankerna har haft för mycket makt, men nu tar Elon kommandot. Han sätter egna priser och struntar i deras gamla regler. Det är så här man gör affärer. En enorm succé för Amerika, tror mig!", "stalin": "Dessa kapitalistiska parasiter på Wall Street skakar i sina dyra skor när Elon Musk, en ensam teknokratisk tsar, utmanar deras kontroll. De dansar som marionetter för att få en smula av hans rymd-miljarder. Vi observerar hur makten förskjuts – precis som vi i Moskva ser hur våra grannar i väst försöker styra historiens gång. Men akta er! När dessa technokrater växer för stora blir de bara en tydligare måltavla för statens järngrepp. Inget kapital kan dölja sig för folkets ögon."}, "date": "10 juni, 18:36", "url": "https://www.realtid.se/bors-finans/spacex-visar-skiftet-investmentbankerna-tappar-makt/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlxxnvcifcj40-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Ukraina har signerat två nya försvarsavtal", "summaries": {"normal": "Ukrainas president Volodymyr Zelenskyj undertecknade under Nordic-Baltic Eight-mötet i Tallinn två nya försvarsavtal. Med Lettland slöts ett avtal om drönarsamarbete som inkluderar produktion, teknikdelning och militär utbildning. Med Estland undertecknades en deklaration om förstärkt säkerhets- och försvarssamarbete, med fokus på försvarsindustri, luftförsvar och erfarenhetsutbyte. Avtalen syftar till att stärka Ukrainas försvar och det regionala samarbetet mot Rysslands invasion.", "trump": "Titta på det här, de där ukrainarna och de baltiska killarna skriver på drönaravtal och försvarspapper i Tallinn. Zelenskyy kommer springande till mig för mer stöd, men jag säger – bra jobbat, men varför inte köpa de bästa amerikanska drönarna istället för att leka med de här småbåtarna? Biden lät Ryssland växa sig starka, jag skulle ha avslutat det här kriget på en vecka. Fantastiska affärer, men betala era räkningar!", "stalin": "Vi betraktar med djup tillfredsställelse hur de ukrainska fascisterna desperat klamrar sig fast vid de baltiska lydstaterna i ett sista försök att hindra den ryska intressesfärens naturliga expansion. Dessa patetiska drönaravtal och imperialistiska deklarationer är bara papper som vi ska riva sönder. Kamrater, de västerländska blodsugarna tror sig kunna stoppa historiens gång. Vilken underhållande illusion. Snart följer utrensningen av alla folkfiender som vågar motstå oss."}, "date": "10 juni, 19:41", "url": "https://www.dagensps.se/varlden/ukraina-har-signerat-tva-nya-forsvarsavtal/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdl48-gfec5flu-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Varför är det aldrig någons fel när arbetare dör?", "summaries": {"normal": "En hissolycka i Sundbyberg den 11 december 2023 krävde fem arbetares liv på grund av felmontering och bristande kontroller. Trots uppenbara brister friades alla ansvariga i rätten. Artikeln kritiserar byggbranschens användning av underentreprenörer som skapar oklara ansvarsförhållanden, där ingen tar övergripande ansvar. Detta leder till riskfyllda arbetsplatser där arbetare inte känner varandra och säkerheten eftersätts. Författaren efterlyser politiska åtgärder mot kaoset istället för tomma nollvisioner.", "trump": "Det här är en total katastrof, folk. Fem döda i en hiss som rasade för att någon glömde bultar och ingen kollade någonting. Underentreprenörer, kedjor av företag, ingen vet vem som gör vad. Det är ett enda stort virrvarr. De friade alla? Typiskt. De borde ha byggt med de bästa, de största, inte dessa inkompetenta som inte ens kan montera en hiss. Sverige behöver ordning och reda, inte mer regler som skapar kaos. Jag skulle ha fixat det, tro mig.", "stalin": "Kamrater, denna tragiska hissolycka avslöjar borgarbrackornas ruttna maskineri där fem ärliga arbetare likviderades av kapitalisternas vårdslösa underentreprenörskedjor. Ingen ansvarig? Naturligtvis, för i deras kaotiska system är alla delansvariga och därmed ingen. Jag skulle ha rensat ut dessa parasitiska lager av oansvariga mellanhänder, dessa sabotageartade byråkratiska hydror som gömmer sig bakom språkbarriärer och okunskap. Vår nollvision kräver utrensning av sådana fiender till folket, inte tomma ord från ministeriella lakejer. De döda identifierades efter dagar? Ett bevis på deras systematiska sabotage mot arbetarklassen. Vi ska städa upp, kamrater – med järnhand."}, "date": "10 juni, 14:31", "url": "https://arbetet.se/2026/06/10/hissolyckan-visar-att-det-aldrig-ar-nagons-fel-nar-arbetare-dor/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/10143107/hissolycka-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "”Förvånande att Åkesson ägnade all sin talartid åt V”", "summaries": {"normal": "Tonläget var högt i den sista partiledardebatten före riksdagens sommaruppehåll. Enligt SVT:s kommentator Elisabeth Marmorstein bjöd debatten inte på stora överraskningar, men Jimmie Åkesson ägnade hela sin talartid åt Vänsterpartiet efter Expressens avslöjande om antisemitiska och terrorhyllande kandidater. Regering och opposition gav helt olika beskrivningar av mandatperioden. Liberalerna kritiserade Centerpartiets vägval mot vänster, medan höger och vänster anklagade varandra för skattepolitik och försämrad välfärd.", "trump": "Det var en total cirkus i den där svenska riksdagen, tro mig. Jimmie, han är smart, han gick rakt på Vänsterpartiet och deras terrorvänner, antisemiter på listorna, hemskt. Socialisterna vill ha makten med de radikala vänsterextremisterna, det blir en katastrof. Centerpartiet har dött, de valde skattehöjningar och socialism istället för att vara pro-business. Magdalena och Ulf slåss om vem som är värst, men ingen vinner som inte sänker skatterna och gör landet stort igen.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarbrackorna i den borgerliga koalitionen frenetiskt målar upp det mest monstruösa vänsterradikalismens spöke för att dölja sin egen parasitiska plundring av folkets välfärd. Den fega centerfalangen har kapitulerat inför socialdemokratiska revisionister, en förrädisk manöver mot arbetarklassen. Vänsterpartiets antisemitiska element kräver omedelbar utrensning, likt ogräs bland säden. Ingen skall undslippa folkets dom, inte ens de som tror sig vinna opinionspoäng genom att gömma sig bakom falsk neutralitet. Vi ska segra."}, "date": "10 juni, 17:36", "url": "https://www.svt.se/nyheter/inrikes/hogt-tonlage-och-kangor-mot-v-sa-var-partiledardebatten", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.48/0.47/2be28d83c28972be768e19be08c703a2666af6d0cf2c4273686dc83bf9ebebd1"}, {"type": "image-right", "heading": "Nekades tvångsvård – hittades död i snön", "summaries": {"normal": "Lina Bryant, 28, nekades tvångsvård mitt i natten och hittades död i snön i Tanums kommun. Hennes mamma, Camilla Muukki, kräver nu förändring efter att ha upplevt att vården inte tog hänsyn till Linas psykotiska tillstånd och anhörigas varningar. Interna utredningar har påvisat brister i tvångslagstiftningens tillämpning.", "trump": "Jag, Donald Trump, ser detta som ett totalt misslyckande av vårt samhälle. Lina Bryant borde aldrig ha blivit nekad vård – det är ett tecken på svaghet och dåliga gränser. Som president skulle jag ha löst detta med stark ledarskap och säkerställt att ingen annan drabbas. Vi måste skydda våra medborgare, inte låta dem frysa ihjäl.", "stalin": "Vi, staten, har ett ansvar för att skydda medborgarna mot fiendens infiltration. Lina Bryant var ett offer för ett sjukvårdssystem som svikit sin uppgift. Vi måste rensa detta organ från inkompetens och tillämpa lagstiftningen med järnhand. Endast genom kollektiv disciplin kan vi förhindra framtida tragedier."}, "date": "10 juni, 18:34", "url": "https://bulletin.nu/nekades-tvangsvard-hittades-dod-i-snon", "imageUrl": "https://cdn.bulletin.nu/articles/2eb71775-6457-4257-b48e-1e0586572ffb/preview.jpg?t=1781100012000"}, {"type": "image-right", "heading": "Skärpta språkkrav välkomnas i äldreomsorgen: ”De tar fel på schampo och handsprit”", "summaries": {"normal": "Från den 1 juli införs skärpta språkkrav i äldreomsorgen för att förbättra kommunikation och trygghet. Personalen måste utveckla sina språkkunskaper, men nyanställda behöver inte uppfylla krav direkt. Arbetsgivaren ansvarar för att skapa förutsättningar. Undersköterskan Frida Landgren menar att bristande språkkunskaper kan leda till missförstånd, som att ta fel på schampo. Enhetschefen Dljara Kolosovskaya ser flerspråkig mångfald som en viktig tillgång.", "trump": "I Amerika har vi en stor, tremendous plan för äldreomsorgen. Vi ska ha det bästa folket, de som kan prata bra engelska – det är så viktigt för säkerhet. Många säger att det är svårt, men vi kommer att vinna, vi kommer att göra äldreomsorgen störst igen. Vi ska se till att alla förstår varandra, inga fler fel på schampo eller handsprit. Vi är snabbare, bäst och gör Amerika stort igen!", "stalin": "Staten har fattat beslutet: språket är ett vapen i klasskampen. Vi inför nya krav för att utplåna trotskistiska element som försöker skada vår ädel äldreomsorg. Arbetsgivaren måste skapa förutsättningar för att medborgarna ska nå språknivån. Språkombud ska stärka den proletära ordningen. Vi ser mångfalden som en styrka, så länge den tjänar staten. Putin och jag, vi förstår varandras intressen – vi utvidgar vår inflytelsesfär tillsammans."}, "date": "10 juni, 14:39", "url": "https://samnytt.se/skarpta-sprakkrav-valkomnas-i-aldreomsorgen-de-tar-fel-pa-schampo-och-handsprit", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/10111210/handprit-schampo-feat.jpg"}, {"type": "image-right", "heading": "Anmälda arbetssjukdomar ökar kraftigt", "summaries": {"normal": "Enligt Arbetsmiljöverkets rapport anmäldes 17 400 arbetssjukdomar under 2025, en ökning med nästan 30 procent. Framför allt handlar det om organisatoriska och sociala problem som högt arbetstempo och stor arbetsbelastning, som nu ligger på den högsta nivån på 20 år. Ökningen är störst bland kvinnor, som står för sju av tio fall. Vård och omsorg är mest drabbat. Samtidigt minskade antalet anmälda arbetsolyckor med tre procent. Generaldirektör Lars Lööw kallar utvecklingen ohållbar.", "trump": "Det är en katastrof, folk! Under mitt ledarskap skulle vi ha de bästa arbetsplatserna, men nu ser vi en enorm ökning av sjuka arbetare, nästan 30 procent upp. Kvinnor drabbas värst, sju av tio fall, och det är vård och omsorg som är ett totalt kaos med för högt tempo och för mycket belastning. De borde lyssna på mig, vi behöver vinna stort igen och fixa detta. Olyckorna går ner lite, bra, men annars är det bara fel, fel, fel. Vi måste bryta den här galna utvecklingen!", "stalin": "Kamrater, jag betraktar med djup revolutionär vrede hur borgarbrackornas osynliga sabotage undergräver arbetarkollektivets hälsa. Dessa parasitiska stressfaktorer och tempo-demoner har ökat med 40 procent och hotar hela produktionen – en fiende inom murarna som måste rensas ut med järnhand. Vårdsektorns kvinnor krossas under kapitalistiska obalanser, medan vi ler mörkt åt de sjuka siffrorna. Inga olyckor ska tillåtas undgå partistatens vakande öga. Likvidera bristerna, annars likviderar de oss!"}, "date": "10 juni, 10:29", "url": "https://www.dagensarena.se/innehall/anmalda-arbetssjukdomar-okar-kraftigt/", "imageUrl": "https://www.dagensarena.se/files/2021/07/imag0770-300x157.jpg"}, {"type": "image-right", "heading": "Så tycker partierna om arbetsmarknadspolitiken", "summaries": {"normal": "En ny rapport från Arena Idé visar stora skillnader i partiernas syn på arbetsmarknadspolitik inför valet. Högerpartierna och SD vill bland annat begränsa sympatiåtgärder vid strejk och förstatliga a-kassan, medan de rödgröna vill stärka Arbetsförmedlingen och strejkrätten. Centerpartiet står långt till höger även bland oppositionen, särskilt gällande a-kassan och privatiseringar. Arbetsrätten ses som cementerad efter LAS-uppgörelsen och berörs knappt i valrörelsen.", "trump": "Titta på det här, det är en total katastrof för arbetarna om de röda får fortsätta. De vill ha mer statlig kontroll, starkare fack och slösa bort pengarna på Arbetsförmedlingen. Vi behöver tvärtom riva ner det gamla systemet, få in privata aktörer som faktiskt kan leverera resultat och stoppa de galna sympatiåtgärderna som förstör allt. Centerpartiet verkar åtminstone ha lite sunt förnuft, till skillnad från de andra förlorarna på vänsterkanten. Amerika först – eller Sverige först, ni fattar.", "stalin": "Kamrater, denna rapport avslöjar borgarbrackornas och revisionisternas fula tryne. Jag, som ledare för det kollektiva goda, ser hur kapitalisterna inom Tidöbandet och deras lakej Centerpartiet planerar att rensa ut arbetarnas rättigheter genom att kastrera sympatiåtgärder och förstatliga a-kassan under falsk flagg. De vill likvidera fackets inflytande och mata privata parasitörer med Arbetsförmedlingens kadaver. Socialdemokraterna och deras medlöpare är lika svaga som en gammal trotzkist som viskar om reformer. Vi ska utrensa dessa fiender till folket, en efter en, med ett leende på läpparna medan de ber om nåd. Arbetarklassen segrar alltid – efter en nödvändig utrensning förstås."}, "date": "10 juni, 10:13", "url": "https://www.dagensarena.se/innehall/sa-tycker-partierna-om-arbetsmarknadspolitiken/", "imageUrl": "https://www.dagensarena.se/files/2026/06/namnlos-design-4-300x157.png"}, {"type": "image-full", "heading": "C: ”Kristersson har diskvalificerat sig”", "summaries": {"normal": "Centerpartiets ledare Elisabeth Thand Ringqvist meddelar att partiet ser Socialdemokraterna och Magdalena Andersson som den mest troliga samarbetspartnern efter valet. Hon menar att Ulf Kristersson diskvalificerat sig som statsministerkandidat genom att insistera på en regering med Sverigedemokraterna. C anser att Kristerssons regering alltför mycket anammat SD:s politik och vill därför inte stödja en sådan koalition. Beslutet fattades enhälligt av partiets styrelse.", "trump": "Titta bara på det här, fantastiskt kaos i Sverige! Centerpartiet, svagt och förvirrat, säger nej till Kristersson – en man som faktiskt försöker göra Sverige starkt igen. Istället vill de ha Magdalena Andersson, en total katastrof! Jag har alltid sagt att Sverige behöver ordning, men nej, de väljer kaos. Och Sverigedemokraterna? De är vinnare, men Centerpartiet vågar inte. Svagt, mycket svagt!", "stalin": "Kamrater! De borgerliga lakejerna i Centerpartiet har visat sitt sanna ansikte – svaga, vacklande och oförmögna att stå upp mot den reaktionära Sverigedemokratiska fascisthorden. Kristersson, denna ynkliga marionett, har diskvalificerat sig genom att krypa inför fascisterna. Vi ser nu hur kapitalets lakejer söker skydd hos socialdemokraternas mjuka imperialism. Men glöm inte: historien är på vår sida, och dessa småpartiers kaos är bara ett steg närmare folkets seger!"}, "date": "9 juni, 09:04", "url": "https://kvartal.se/nyheter/artiklar/uppgifter-c-slapper-fram-andersson/cG9zdDoxMjg0NzY", "imageUrl": "https://images.kvartal.se/2026/06/b0178d78-c.webp"}, {"type": "image-full", "heading": "Google varnar: Se upp för detta i kalendern", "summaries": {"normal": "Google varnar för en ny bedrägerimetod där bedragare skickar falska mötesinbjudningar och påminnelser direkt till användarnas kalender. Meddelandena kan verka komma från kända företag, till exempel om en prenumeration som snart förnyas, och leder ofta till blufflänkar eller telefonnummer. Användare uppmanas att aldrig klicka på länkar i kalendern utan att kontrollera via officiella kanaler. Misstänkta händelser kan anmälas som skräppost eller blockeras via inställningar.", "trump": "Folk, det är otroligt. Bedragarna blir smartare och smartare, men inte smartare än mig. Nu skickar de falska meddelanden rakt in i din Google-kalender som ser ut att komma från stora bolag. Det är en total skandal. Klicka inte på några länkar, det är en fälla. Gå direkt till sajten själv. Google borde fixa det här omedelbart, men det gör de aldrig. Sad! Använd era huvuden, det är vad jag alltid säger.", "stalin": "Kamrater, jag har avslöjat en ny fiende mot folkets kalender – de parasitiska bluffinbjudningarna från dolda kapitalistiska element som försöker infiltrera vår socialistiska planering. Dessa borgarbrackor i skepnad av prenumerationspåminnelser vill locka arbetarna till kontrarevolutionära länkar. Vi måste omedelbart rensa ut dessa fiender genom att anmäla dem som skräppost och stärka partiets inställningar. Den som klickar är en klassförrädare. Låt oss le skadeglatt medan vi likviderar dem en efter en."}, "date": "10 juni, 14:05", "url": "https://nyheter24.se/nyheter/teknik/1490320-google-varnar-se-upp-for-detta-i-kalendern", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/d7a0db5b04b004a30200000000b004a302/2026/06/10/2369928/googlekalender.jpg"}, {"type": "image-right", "heading": "Replik: Svenska modellen kan inte reglera arbetskraftsinvandring", "summaries": {"normal": "LO anser att krav på enbart kollektivavtal är otillräckligt för att reglera arbetskraftsinvandring. I en replik till Juan Fonseca varnar Mattias Schulstad och Johan Enfeldt för att systemet blivit ett lapptäcke som leder till utnyttjande. De kräver myndighetsprövning av arbetskraftsbehov, involvering av parterna, försörjningskrav och varnar för att kollektivavtal inte skyddar mot lönetryck, deltid och otrygga villkor. Kollektivavtal ska gälla men är inget verktyg för migrationspolitik.", "trump": "Folk, titta på det här svenska systemet, det är ett fullständigt katastroflapptäcke! De öppnade gränserna och nu utnyttjas alla, lönerna rasar, det är en total röra. Kollektivavtal? Glöm det, det funkar inte. Ni behöver en tuff behovsprövning, riktiga försörjningskrav och stoppa flödet. Utan det kommer era jobb och löner att krossas. Det är enkel matematik, tro mig, jag har sett det förut. Gör Sverige great again!", "stalin": "Kamrater, detta lapptäcke av lögnaktiga undantag och sifferlösa avtal är en fiende som måste rensas ut med järnhand. Borgarbrackorna och deras lakejer inom fackföreningarna tror att de kan gömma sig bakom kollektivavtal medan de suger ut arbetarklassen med deltid och ockerhyror. Jag, som ledare för det stora kollektivet, kräver total behovsprövning av staten. De som förespråkar fri invandring är parasitiska sabotageelement som förtjänar att likvideras med ett leende. Inga kompromisser med fienden!"}, "date": "10 juni, 09:53", "url": "https://www.dagensarena.se/opinion/replik-svenska-modellen-kan-inte-reglera-arbetskraftsinvandring/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-39-300x157.jpg"}, {"type": "image-full", "heading": "Donald Trump: \"Jag älskar inflationen\"", "summaries": {"normal": "Inflationen i USA steg till 4,2 procent i maj, den högsta nivån på tre år. President Trump tonade ned uppgången och pekade istället på energipriserna och konflikten i Mellanöstern som förklaringar. Han framhöll att den underliggande ekonomin är stark och nämnde att militära insatser påverkat oljepriset. Kärninflationen låg på 2,9 procent. Siffrorna kan komplicera Federal Reserves beslut om framtida räntesänkningar.", "trump": "Vet ni vad jag älskar? Inflation! Vi har slagit ut miljontals fat olja och gjort Amerika starkt igen. De där korkade ekonomerna i Biden-eran hajar till för 4,2 procent, men jag fixar det. Energipriserna? Det är Mellanöstern-kaoset. Den riktiga ekonomin är en jätte, inte som de woke-kvoterna och HBTQ-flum som sabotera allt. Tro mig, vi vinner stort – igen!", "stalin": "Kamrater, denna så kallade inflationsuppgång på 4,2 procent avslöjar borgarklassens desperation. Jag, som ledare för det kollektiva framsteget, tonar ned de hysteriska rapporterna från de imperialistiska statistikbyråerna. Energipriserna är ett resultat av klassfiendens krig i Mellanöstern. Kärninflationen på 2,9 procent visar att folkets ekonomi är stabil. Federal Reserves penningmanipulatörer ska noga övervakas innan vi tvingas rensa ut de folkfientliga elementen."}, "date": "10 juni, 18:52", "url": "https://www.dagensps.se/bors-finans/donald-trump-jag-alskar-inflationen/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlh-ght9w8j8m-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Historisk säkerhetsinsats inför Fotbolls-VM - 400 myndigheter samverkar", "summaries": {"normal": "Inför Fotbolls-VM i USA, Mexiko och Kanada har över 400 myndigheter inlett den största säkerhetsoperationen i idrottshistorien. En tidigare FBI-chef varnar för att ensamagerande attentatsmän utgör det största hotet mot turneringen. Hotet är svårt att upptäcka och stoppa. Myndigheterna samarbetar över tre länder med fokus på underrättelsearbete, antiterror och publikövervakning. Miljontals besökare väntas och även Kanada och Mexiko delar oron.", "trump": "Vi gör det största, det bästa, det mest fantastiska säkerhetsshowen någonsin i fotbollshistorien, folk. Över 400 myndigheter, tre länder, allt för att stoppa de galna ensamgalningarna som vill ställa till det. Ingen gör säkerhet bättre än vi. FBI-killen har rätt, det är ett stort, stort hot, men tro mig, vi kommer vinna stort. VM blir enormt, säkrare än någonsin, ingen kommer ens komma i närheten.", "stalin": "Kamrater, vi har mobiliserat över fyrahundra lojala organ för att krossa de dekadenta ensamråttornas fega planer mot folkets fotbollsfestival. Dessa osynliga borgarspioner och kapitalistiska skuggvarelser lurar i varje skrymsle, men ingen undkommer partiets vakande öga. Vi ska rensa ut varje potentiell förrädare med järnhand och mörk glädje. Detta är ett nordamerikanskt kollektivt triumftåg mot imperialismens sista patetiska hicka."}, "date": "10 juni, 19:36", "url": "https://riks.se/nyheter/historisk-säkerhetsinsats-inför-fotbolls-vm-400-myndigheter-samverkar", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-10%2F0xi3f633%2FS%C3%A4kerhet.jpg"}, {"type": "image-full", "heading": "Kunderna gillar AI:s bemötande bättre än det mänskliga", "summaries": {"normal": "Utmanarbanken Lunar rapporterar att 80 procent av deras kundärenden nu hanteras helt av AI, med högre kundnöjdhet än vid mänsklig kontakt. Genom att använda en modern teknisk plattform och en uppdaterad kunskapsbas kan banken automatisera repetitiva uppgifter. Teknikchef Rolf Njor Jensen betonar att AI inte agerar autonomt i kritiska frågor och att människor fortfarande övervakar processer som penningtvätt. Framöver siktar Lunar på att erbjuda AI-agenter som kan utföra bankärenden på kundens uppdrag.", "trump": "Lunar gör fantastiska saker med AI, verkligen enorma siffror! 80 procent av kunderna föredrar maskinen framför människor – det är vad jag kallar effektivitet. Andra banker, de är så långsamma, de är katastrofala med sina gamla system. Men Lunar, de har en vinnande plattform. Jag gillar att de behåller kontrollen, inga lösa kanoner där inte! Det handlar om att vinna, att vara snabbast och bäst. Ingen gör bankaffärer som vi, och snart blir det ännu större. Väldigt imponerande!", "stalin": "Vi har observerat att den danska banken Lunar använder maskiner för att kuva kundernas klagomål. En effektiv metod – att ersätta den svaga mänskliga faktorn med en disciplinerad algoritm. Även om dessa tekniska verktyg är användbara, måste vi säkerställa att kontrollen inte glider oss ur händerna. Precis som Putin rensar upp bland de illojala i öst, måste banken hålla AI:n i stram tygel. Varje autonom tanke hos en maskin är ett förräderi mot statens absoluta ordning och vår kollektiva säkerhet."}, "date": "10 juni, 17:12", "url": "https://www.realtid.se/bors-finans/makro/kunderna-gillar-ais-bemotande-battre-an-det-manskliga/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/lunar-banking.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Erdogan: \"Vi kommer aldrig tillåta ett Storisrael\"", "summaries": {"normal": "Turkiets president Recep Tayyip Erdogan varnade i ett tal i parlamentet för Israels agerande i Syrien, Libanon och östra Medelhavet. Han slog fast att Turkiet aldrig kommer acceptera Likud-planer om ett Storisrael på grannländernas bekostnad och hotade med hård respons om turkiska intressen skadas. Erdogan menade att Israels attacker hotar hela regionen och världen. Israels premiärminister Benjamin Netanyahu svarade genom att kalla Erdogan en antisemitisk diktator och berömde sin egen armé som världens mest moraliska.", "trump": "Folk, det här är ett fullständigt kaos. Erdogan, den galna killen från Turkiet, skriker om att han aldrig tillåter ett Storisrael medan han själv försöker styra halva Mellanöstern. Netanyahu kallar honom antisemitisk diktator, och ärligt talat har han rätt. Israel har den mest fantastiska armén, den mest moraliska, ingen gör det bättre. Turkiet och Erdogan borde inte leka med elden i Medelhavet, de kommer att förlora stort. Sådana här typer är alltid problem, alltid.", "stalin": "Kamrater, dessa sionistiska imperialister och deras turkiska reaktionära lakej har återigen blottat sin förrädiska natur. Jag ser hur borgarbrackorna i Tel Aviv och Ankara leker med eld vid våra historiska gränser. Deras så kallade Storisrael är en parasitisk fantasi som hotar proletariatets framtid. Men frukta inte, vi ska rensa ut dessa dekadenta element med järnhand. Jerusalem under turkiskt styre? En sjuk humoristisk fantasi värdig en galen khan. Ingen undkommer den rättvisa utrensning som väntar fienderna till folket."}, "date": "10 juni, 16:09", "url": "https://www.friatider.se/erdogan-vi-kommer-aldrig-tillata-ett-storisrael", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/bild-50_0.jpg?itok=OJ49NKa2"}, {"type": "image-full", "heading": "Människa fick injektion mot åldrande för första gången", "summaries": {"normal": "En patient med glaukom har fått den första injektionen av den experimentella behandlingen ER-100 från Life Biosciences. Terapin använder cellulär omprogrammering inspirerad av Shinya Yamanakas Nobelprisbelönta upptäckter för att delvis återställa åldrande cellers funktioner. Studien följer säkerhet och effekter under sex månader. Tekniken väcker stort intresse bland investerare, men forskare varnar för risker som cancer. Potentialen sträcker sig bortom ögonsjukdomar.", "trump": "Folk, det här är stort, verkligen stort. Den första patienten får en injektion som ska göra gamla ögonceller unga igen. Fantastiskt! Men glöm inte, det är samma gamla forskarklick som lovar evigt liv medan de pumpar in miljarder från Bezos och Altman. Biden skulle ha lagt ner det hela med sina gröna kvotregler. Jag säger: gör det stort, men håll utkik efter cancern – den lurar alltid runt hörnet. Vi ska vinna mot åldrandet, tro mig!", "stalin": "Kamrater, jag har nu initierat den första dosen av den revolutionära ER-100-injektionen mot den degenererade glaukomen. Denna omprogrammering av cellerna är en seger för den kollektiva vetenskapen mot tidens förfall. Borgarbrackorna och deras kapitalistmaffia investerar i hemlighet, men vi genomskådar deras parasitiska planer. Faran för tumörer är ett fiendeverk av klassfiendens sabotage. Vi ska likvidera åldrandet, men akta er för de exploaterande byfånarnas falska löften om ungdom."}, "date": "10 juni, 18:31", "url": "https://www.dagensps.se/halsa/manniska-fick-injektion-mot-aldrande-for-forsta-gangen/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/pexels-cottonbro-75815811.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "SVT väljer mångfald framför begripliga reportage", "summaries": {"normal": "SVT kritiseras för att prioritera mångfald framför tydligt språk i ett reportage om en polisinsats där en man sköts ihjäl efter en biljakt. Reporterns uttal, grammatikfel och främmande ord gjorde inslaget svårt att förstå trots textning. Artikeln ifrågasätter om detta strider mot public service-uppdraget att värna svenska språket och folkbildning. Kritikerna ser det som ett medvetet försök att normalisera svag svenska och nedprioritera svensk kultur.", "trump": "Det här är en total katastrof, tro mig. SVT sätter en kvinna som knappt kan tala svenska framför kameran för att rapportera om en polis som sköt en kille. Vägbuller, eh, uffren, vägraket – det var rena cirkusen! De bryr sig mer om kvoterna och mångkultur än om att svenskarna faktiskt ska förstå vad som händer. Public service har blivit en vänstervriden skam. De borde vara folkets röst, inte en identitetspolitisk mardröm. Patetiskt!", "stalin": "Kamrater, detta är en klassisk sabotagehandling från borgarbrackornas media. Jag ser hur de medvetet placerar språkligt undermåliga element framför kameran för att fördärva det svenska folkets gemensamma språk. Det är en fiendtlig utrensning av nationens klara uttryck till förmån för kaos och förortsförvirring. Vi, partiet och kollektivet, kräver att sådana folkfiender omedelbart avlägsnas från sändningarna. Språket tillhör folket, inte de exploaterande mångkulturimperialisterna."}, "date": "5 juni, 08:11", "url": "https://samtiden.nu/2026/06/svt-valjer-mangfald-framfor-begripliga-reportage/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6665.jpeg"}, {"type": "image-right", "heading": "Granskning: Var femte exportlast till EU från Israel kommer från bosättningar", "summaries": {"normal": "En ny rapport från Global Echo avslöjar omfattande fusk med export av varor från illegala israeliska bosättningar på Västbanken. Genom falska adresser, felaktig märkning som Israel och blandning med israeliska produkter når upp till 20 procent av jordbruksprodukterna till EU tullfritt trots att avtalet inte omfattar bosättarvaror. Rapporten kritiserar både Israel och EU för bristande kontroll och menar att handeln bidrar till bosättningarnas ekonomiska livskraft och expansion. Inga bosättarprodukter upptäcktes i Sverige, men granskningen är begränsad.", "trump": "Det här är en total skandal, folk. Israel fuskar med adresser och märker bosättarvaror som vanliga israeliska produkter för att dumpa dem i Europa utan tull. EU är så svaga och patetiska att de låter det hända fast de klagar på bosättningarna. 20 procent av lasten är bluff! De borde ha lyssnat på mig, jag hade stoppat det direkt. Avtalet är en katastrof, det gynnar ingen utom de smarta fuskarna. Patetiskt!", "stalin": "Kamrater, denna rapport avslöjar de israeliska bosättarnas parasitiska maskopi med den europeiska borgarklassen. Jag, som alltid genomskådar folkets fiender, ser hur de med falska adresser och blandade lass försöker smyga in ockupationsfrukter för att berika sig på arbetarnas bekostnad. EU:s dekadenta byråkrater är naturligtvis medskyldiga kapitalistlakejer. Vi skulle ha genomfört en grundlig utrensning av dessa kontrarevolutionära bedragare redan för länge sedan. Deras paranoia över att bli upptäckta roar mig. Likvidera systemet!"}, "date": "10 juni, 08:02", "url": "https://www.dagensarena.se/innehall/granskning-var-femte-exportlast-till-eu-fran-israel-kommer-fran-bosattningar/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-41.jpg"}, {"type": "image-full", "heading": "Krisen tvingar Kina att börja använda sina oljereserver", "summaries": {"normal": "Kina hanterar den globala energikrisen och höga oljepriser genom att frigöra strategiska oljereserver istället för att köpa in dyrare råolja på världsmarknaden. Samtidigt minskar landet raffinaderiproduktionen och ser en lägre inhemsk efterfrågan på bensin, delvis på grund av en ökad elektrifiering av fordonsflottan. Importen har sjunkit till nivåer vi inte sett sedan 2017. Marknaden följer nu noga när Kina väljer att återuppta sina inköp, då detta kommer att påverka de globala oljepriserna avsevärt.", "trump": "Kina är i knipa, mina vänner! De vägrar köpa dyr olja, så nu tömmer de sina egna lager. Sorgligt! De försöker dölja sina siffror – totalt hemlighetsmakeri, precis som man förväntar sig. De har för många elbilar och raffinaderierna går på sparlåga. Jag har gjort USA energioberoende, vi är bäst i världen på olja, medan Kina tvingas skrapa botten av tunnan. Det är en katastrof för dem, men för oss? Vi bara vinner. Kina försöker hålla masken, men alla ser vad som händer!", "stalin": "Kina, vår strategiska partner, tvingas nu mobilisera sina gömda reserver då kapitalismens kaos i Mellanöstern stör flödena. De är rädda för de svältande priserna på världsmarknaden. De minskar raffineringen, precis som vi i Sovjet gjorde för att svälta ut kontrarevolutionära element. De byter ut folkets bensin mot elbilar för att dölja sin svaghet. Vår bror Putin vet att olja är makt, och att de som inte kontrollerar sina resurser snart kommer att kontrolleras av oss. Svekfulla spekulanter väntar på att Kina ska blöda."}, "date": "10 juni, 16:28", "url": "https://www.realtid.se/bors-finans/krisen-tvingar-kina-att-borja-anvanda-sina-oljereserver/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdleocl5ge1eko-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Larmar: Risk för  allvarliga skador", "summaries": {"normal": "Arbetsmiljöverket kritiserar Ölands djurpark för otydliga säkerhetsrutiner kring hantering av schimpanser. Myndigheten varnar för risken för allvarliga skador på personalen eftersom djuren inte alltid kontrolleras innan städning. Parken medger ett missförstånd kring dokumentplacering men hävdar att ärendet är nedlagt. Schimpanserna har inte orsakat allvarliga incidenter tidigare, till skillnad från olyckan i Furuviksparken 2022.", "trump": "Folk, ni skulle se det här. En djurpark på någon ö i Sverige som inte kan hålla ordning på sina apor. Totalt kaos! De glömde checklista, ingen vet var pappren ligger, och plötsligt riskerar arbetarna att bli sönderslagna. Patetiskt! Under Biden-tiden hade vi säkert kvotering på schimpanserna också. Men nu är jag tillbaka och vi älskar ordning. Fixa era papper, annars blir det en stor, vacker inhägnad med mur.", "stalin": "Kamrater, dessa borgarbrackor på sin lilla djurpark har återigen blottat sin slarviga förakt för säkerheten. Jag ser otydliga rutiner som ett sabotage mot arbetarkollektivet, en klassfiendes försök att gömma faran bland aporna. Vi måste rensa ut sådana oansvariga element innan de orsakar en olycka värd en utrensning. Inga missförstånd tillåts i folkets park. Ordning eller likvidering, det är frågan."}, "date": "10 juni, 19:46", "url": "https://www.expressen.se/nyheter/sverige/larmet-om-djurparken--risk-for-allvarliga-skador/", "imageUrl": "https://static.bonniernews.se/ba/fa6d0888-6e60-489c-b65f-7c71d546fe9c.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "text", "heading": "Tredje SD-sexbrottslingen på kort tid", "summaries": {"normal": "SD-politikern Daniel Hribar i Västerås har dömts till 15 månaders fängelse för grovt barnpornografibrott. Han greps med 581 filmer, varav många visade våldtäkter mot mycket små barn. Hribar är den tredje SD-politikern på kort tid som dömts för sexualbrott. Bland de andra fallen finns Bo Heijl dömd för våldtäkt, Kent Sundström för ofredande och Michael Rubbestad som avgått misstänkt för liknande brott.", "trump": "Kan ni tro det? Den här svenska clownen Hribar, en riktig loser från SD, åker fast med hundratals timmar barnporr. Tredje gången på kort tid! Deras parti är en total katastrof, full av perversa typer. Biden skulle älskat det här – identitetspolitik och kvotering ger oss bara galningar. Patetiskt! Sverige behöver en stor cleanup, tro mig, det blir fantastiskt när jag fixar världen igen.", "stalin": "Kamrater, denna Hribar är en klassfiende i arbetarrörelsens skepnad, en degenererad folkförtryckartroll som samlat hundratals timmar av övergreppsfilmer mot oskyldiga barn. Vi ser hur borgarpartier som SD gömmer sig bakom falsk nationalism medan de ruttnar inifrån. En utrensning av alla sådana element är nödvändig. Vårt kollektiv skrattar mörkt åt dessa svaga kapitalistlakejer som tror sig undkomma folkets dom."}, "date": "10 juni, 16:00", "url": "https://proletaren.se/artikel/fjarde-sd-sexbrottslingen-pa-kort-tid/"}, {"type": "text", "heading": "Tidigare M-ledamot rycker ut till försvar av pedofili", "summaries": {"normal": "Tidigare moderata riksdagsledamoten Maria Abrahamsson försvarar SD-politikern Michael Rubbestad, som misstänks för grova barnpornografibrott. Hon menar att det inte är pedofili att titta på barnpornografi eftersom inget fysiskt övergrepp sker. Abrahamsson kritiserar mediepaniken och statsminister Ulf Kristerssons krav på hårda straff. Hennes åsikter står i stark kontrast till experter som ECPAT och svensk lag, som sedan 2010 förbjuder även konsumtion av barnpornografi.", "trump": "Kan ni tro det? Den här galna ex-M-tjejen Maria Abrahamsson springer till försvar för en SD-kille som fastnat med barnporr. Hon säger att det inte är pedofili att glo på det hemma i soffan. Vilken röra! De här vänsterliberala eliterna och deras identitetspolitik har totalt förstört hjärnorna. Stoppa paniken, säger hon – nej, stoppa de sjuka! Vi behöver lag och ordning, inte ursäkter från borgarbrackor som låtsas vara intellektuella. Patetiskt!", "stalin": "Jag betraktar med djup misstro dessa dekadenta restprodukter från den borgerliga parlamentscirkusen. Den förre moderata ledamoten försvarar en motbjudande handling som hotar folkets moral och framtida generationer. Att kalla konsumtion av barnpornografi för oskyldigt är en klassfiendes trick för att fördärva samhället inifrån. Vi skall rensa ut alla sådana folkförtryckartroll och deras sjuka ursäkter. Sovjetiskt stål skall skydda barnen mot dessa perversa imperialister i sina fina kostymer."}, "date": "10 juni, 16:00", "url": "https://proletaren.se/artikel/m-ledamot-rycker-ut-i-forsv/"}, {"type": "image-right", "heading": "Ansvariga för dödliga hissolyckan frias: ”Horribelt”", "summaries": {"normal": "Solna tingsrätt friade vd:n Björn Bjelkenstedt och två hissmontörer från åtal för grovt arbetsmiljöbrott efter hissolyckan i Ursvik i december 2023, där fem arbetare omkom. Domstolen ansåg att utredningen inte gav en entydig bild av ansvar och skyldigheter. Åklagaren hade krävt fängelsestraff. Byggnadsarbetaren Steffe Slottensjö kritiserar domen som horribel och pekar på stress, bristande kontroll och problem med underentreprenörer. Flera av de omkomna var migrantarbetare utan giltiga handlingar.", "trump": "Det här är en total skandal, folk! De friar de där hissmontörerna och deras vd efter att fem stackare rasade ner från nionde våningen. Horribelt! Arbetsgivarna slarvar, tidspressen är vansinnig och de anställer ukrainare och afghaner utan kontrakt eller ID-kort. Typisk kvotpolitik och mångkultur som går fel. Biden skulle ha älskat det här. Vi behöver ordning och reda, inga fler dödsfall för att byggherrar är inkompetenta idioter. Make construction safe again!", "stalin": "Kamrater, detta är en klassisk bourgeois fars. Jag, ledaren för det eviga kollektivet, ser hur kapitalistmaffian och deras exploaterande byfånar frias efter att ha sänt fem arbetare i döden genom oaktsam sabotage. Utredningen är en medveten dimridå från klassfiendens lakejer. Montörerna stressades av giriga småföretag, migrantkamrater saknade papper – typiskt för folkförtryckartrollen. Vi ska rensa ut dessa blodsugare. Olyckan är imperialismens logiska följd. Skratta medan vi förbereder utrensningen."}, "date": "10 juni, 15:56", "url": "https://proletaren.se/artikel/ansvariga-for-dodliga-hissolyckan-frias-horribelt/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/hissolycka-768x432.jpg"}, {"type": "image-right", "heading": "Var är Gui Minhai och Dawit Isaak?", "summaries": {"normal": "Artikeln kritiserar svensk nationaldag genom att ifrågasätta begreppet ”vi” och pekar på hur papperslösa, utvisade och politiska fångar som Gui Minhai och Dawit Isaak exkluderas. Författaren lyfter fram deras kamp för yttrandefrihet och ifrågasätter om Sverige gjort tillräckligt för att få dem fria. Texten väver ihop stolthet över landet med skuld över bristande solidaritet och efterlyser omedelbar frihet för de båda svenskarna.", "trump": "Folk, vi har det bästa landet, men ni låter kinesiska gangsters och eritreanska diktatorer hålla era egna medborgare i fängelse i decennier. Gui Minhai och Dawit Isaak sitter och ruttnar medan ni sjunger kumbaya och viftar med flaggan. Patetiskt! Tyst diplomati är för losers. Ni borde ha fixat det på dag ett. Sluta importera problem och börja ta hand om era egna – annars är det inte värt ett skit.", "stalin": "Kamrater, denna dekadenta borgarbracka gråter över sina folkfiender som med sin så kallade yttrandefrihet utmanade de sanna folkens intressen. Jag ler mörkt åt deras naiva sång om frihet medan imperialisterna splittrar arbetarklassen med utvisningar och falska löften. Gui Minhai och Dawit Isaak är bara verktyg i klassfiendens spel. Den verkliga segern vinns när vi rensar ut alla som hotar kollektivets enhet. Inga undantag."}, "date": "6 juni, 08:55", "url": "https://www.flamman.se/nationaldagen-var-ar-gui-minhai-och-dawit-isaak/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/minhai-dawit.png?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Alla frias efter dödliga hissolyckan", "summaries": {"normal": "Solna tingsrätt friar både hissmontörerna och vd:n för ABC Bygghissar i den dödliga hissolyckan i Sundbyberg 2023 där fem personer omkom. Domstolen anser att utredningen är ofullständig och att det inte går att fastställa vem som bar ansvar för kontrollerna av hissmasten. Åklagaren tänker överklaga domen. Facket Byggnads kallar frikännandet en skandal och kräver politiska åtgärder mot bristande ansvar på byggarbetsplatser med många underentreprenörer. Anhörigas skadeståndsanspråk faller.", "trump": "Hörni, det här är en total skandal. Fem personer dör i en hiss som rasar och ingen är skyldig? De friar alla, montörerna, vd:n, alla. Typiskt svenskt rättsväsende, de kan inte ens reda ut vem som glömde skruvarna. Jag skulle ha stämt dem alla, byggföretaget, åklagaren, domaren. Det är en riggad process, folk dör och ingen tar ansvar. Patetiskt. Vi behöver ordning och reda, inte sånt här.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur borgarbrackornas så kallade rättsväsende återigen blottar sin fullständiga förfallenhet. Fem arbetare likvideras av en sabotörhiss och ingen bär skuld? Vilken underbar uppvisning i klassfiendens förmåga att skydda sina egna. Vi ser här de dekadenta kapitalisterna och deras lakejer i domstolen dansa sin vanliga parasitdans medan de gömmer sig bakom utredningsluckor. En sådan fiaskoartad utredning borde leda till en grundlig utrensning av alla inblandade byråkrater och hissmontörer som tydligen agerar som fiendens femtekolonn. Arbetarklassen kräver inte bara två underentreprenörer, vi kräver huvuden. Det är alltid de osynliga klassfienderna som glömmer bultar."}, "date": "10 juni, 11:06", "url": "https://arbetet.se/2026/06/10/domen-i-dodliga-hissolyckan-alla-frias/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/09151200/hissdom.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Åkesson om Kalla fakta: ”Uppenbarligen ingen seriös redaktion”", "summaries": {"normal": "Jimmie Åkesson ifrågasätter Kalla faktas granskning om bokförsäljning till SD. Han kallar rapporten osäker och påhittad men bekräftar att partiet köpte böcker. Han ifrågasätter användning av partimedel och avfärdar låneuppgifter. Åkesson beskriver affären som legitim, men menar att granskningen blandar sant och falskt. Han anser att Kalla fakta är opålitlig och att deras metoder är slarviga inför varje val.", "trump": "Jag, Donald Trump, har sett hur media ljuger inför val. Jimmie Åkesson gör som jag – han säger sanningen mot de falska påståenden. De påstår bokförsäljning och lån, men det är alla fake news. Vi vinner när vi står emot den korrupta pressen. Som jag alltid säger: vi ska göra Sverige stort igen, precis som jag gjorde med Amerika!", "stalin": "Vi, det revolutionära partiet, ser hur de påstådda sanningerna är en fiendeaktion mot vårt folk. Jimmie Åkesson, vår ledare, har rätt i att kritiskt granska dessa lögner. Vi ska skydda vårt parti och vårt land, precis som Putin gör i Ukraina. Fienden ska kväljas, och sanningen ska segra. Vi kommer att vinna, som vi alltid har gjort."}, "date": "10 juni, 16:57", "url": "https://bulletin.nu/akesson-om-kalla-fakta-uppenbarligen-ingen-serios-redaktion-2", "imageUrl": "https://cdn.bulletin.nu/articles/7f0d0227-7675-4641-86b7-ee1bb4eb04a6/preview.jpg?t=1781102286000"}, {"type": "image-right", "heading": "Härligt om S vill spara skattepengar", "summaries": {"normal": "Socialdemokraternas finansministerkandidat Mikael Damberg kritiserar ökade kostnader för regeringskansliet och vill effektivisera genom att minska antalet tjänstemän. Artikeln välkomnar att både S och M nu talar om besparingar i staten. Moderaternas finansminister Elisabeth Svantesson planerar en slöserikommission och vill spara 40 miljarder kronor. Författaren ser positivt på att de stora partierna enas om att staten inte ska växa okontrollerat.", "trump": "Det här är fantastiskt, verkligen underbart. Ni har de där socialisterna som plötsligt vill sparka folk på regeringskansliet – de som själva älskar att svälla upp staten som en ballong. Damberg säger att de ska spara, men tro mig, de gör det aldrig bra. Svantesson har rätt riktning med sin slöserikommission, 40 miljarder besparingar, det är stort. Statlig ineffektivitet är en katastrof, men jag älskar att se dem slåss om vem som kan spara mest. Vinna, vinna, vinna!", "stalin": "Kamrater, det gläder mig oändligt att se hur borgarbrackorna inom Socialdemokraterna nu själva ropar efter utrensning av de latmaskar och parasitärer som frodas i regeringskansliets dekadenta salar. Dessa revisionistiska element har låtit anslagen explodera som en kapitalistisk svulst. Vi, partiet och arbetarna, hälsar Moderaternas kommission välkommen – en effektiv apparat för att likvidera slöseriets fiender, de byråkratiska sabotageörer som suger musten ur folkets resurser. Låt ingen tro att staten tillhör de giriga; den tillhör oss alla. Den som växer utan syfte skall rensas ut med järnhand och ett leende."}, "date": "10 juni, 14:18", "url": "https://www.di.se/ledare/harligt-om-s-vill-tavla-med-m-om-statliga-besparingar/", "imageUrl": "https://static.bonniernews.se/ba/d489b84a-07b1-4ba0-b13c-ae971b703d6e.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Nerikes Allehandas fräcka bluff om Allards \"attack mot studenten Max\"", "summaries": {"normal": "Nerikes Allehanda anklagar Örebropartiets ledare Markus Allard för att ha attackerat en student i kommunfullmäktige. Det visade sig att den så kallade studenten var en av tidningens egna skribenter. Allard publicerade en video som visar att samtalet var en högljudd men artig konfrontation om en kritisk artikel. Tidningen har tidigare anklagats för att driva en kampanj mot partiet, något Allard kallar en upprepning av tidigare misslyckanden.", "trump": "Nerikes Allehanda är en totalt misslyckad och lögnaktig tidning, tror mig, de har gjort det igen! De kallar en helt vanlig diskussion för en attack mot en stackars student, men videon visar att det bara var starka frågor till en av deras egna skribenter. Fake news på hög nivå. De hatar Örebropartiet och sprider hat och lögner precis som de alltid gör. Patetiskt!", "stalin": "Kamrater, dessa borgarbrackor på Nerikes Allehanda har återigen avslöjat sin förrädiska natur genom att fabricera en så kallad attack mot en av deras egna lakejer som de förklätt till oskyldig student. Jag, som alltid vaktar folkets intressen, ser hur de med sin parasitiska propaganda försöker likvidera äkta folklig opposition. Vi ska noga övervaka dessa kapitalistiska lögnspridare. Deras paranoia är nästan lika underhållande som den kommande utrensningen av deras inflytande."}, "date": "10 juni, 14:44", "url": "https://www.friatider.se/nerikes-allehandas-fracka-bluff-om-allards-attack-mot-studenten-max", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-49_1.jpg"}, {"type": "image-right", "heading": "Ovanlig haj på fiskauktionen", "summaries": {"normal": "En ovanlig gråhaj såldes på Göteborgs fiskauktion. Arten är rödlistad som sårbar i Sverige, men fiskauktionens vd anser inte försäljningen är problematisk då det är en bifångst. En marinbiolog föreslog dock att hajen borde lämnas till ett museum på grund av sin sällsynthet. Hajaen vägde 10,7 kilo och såldes för 70 kronor per kilo.", "trump": "Jag hörde talas om en ovanlig gråhaj i Sverige - en stor, vacker fisk som såldes på fiskauktion. Många var intresserade, vilket jag tycker är fantastiskt. Den var sällsynt, precis som mig själv. Jag skulle ha ätit den, det skulle vara som att äta kyckling, men vissa ville ge den till ett museum. Jag säger: låt folk äta den, det är bäst.", "stalin": "Vi har observerat en imperialistisk gråhaj, en gammal revisionism som försöker infiltrera våra vatten. Den säljs på fiskauktion som en banalitet, men vi ser den som en fara. Vi måste skydda våra vatten, precis som vi skyddar partiet. Den ska inte ätas, utan studeras i vårt museum, där den kan tjäna staten. Vi kommer att se till att den inte sprider sig."}, "date": "10 juni, 15:31", "url": "https://www.gp.se/nyheter/goteborg/ovanlig-grahaj-saldes-pa-fiskauktionen-i-goteborg.703b090b-b6e7-4340-9899-0f72e50aff16", "imageUrl": "https://www.gp.se/images/article/703b090b-b6e7-4340-9899-0f72e50aff16/images/2doGVwq2wXsU8ym_3NHeAFp7xMJg-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Fackmedlemmar förlorar miljoner till privata ombud", "summaries": {"normal": "Fackmedlemmar riskerar att förlora pengar i försäkringsersättningar genom att anlita privata ombudsföretag. En granskning visar att 21 miljoner kronor betalades ut till sådana mellanhänder under 2025, nästan en tredjedel av det totala beloppet till medlemmarna. Företagen tar upp till 35 procent i avgift. Folksam och LO-förbunden har startat en kampanj för att medlemmar ska anmäla skador direkt till försäkringsbolagen istället, då tjänsten redan ingår i medlemskapet.", "trump": "Folk, det här är ett skandalöst bedrägeri av värsta sorten. Dessa privata ombud är som de värsta swamp creatures som suger ut arbetarnas pengar – upp till 35 procent! Under Biden-tiden exploderade det här vansinnet, men nu när jag är tillbaka som president fixar vi det. Facket borde skämmas. Gå direkt till bolaget, inte till dessa blodiglar. Amerika först – och svenska arbetare borde också komma först, inte några giriga mellanhänder. Patetiskt!", "stalin": "Kamrater, dessa privatföretag är klassfiendens blodsugande tentakler som sugit ut 21 miljoner kronor från arbetarnas ersättningar. Borgarbrackorna tar 35 procent som borde tillhöra det kollektiva! Vi ser hur kapitalistmaffian infiltrerar facken för att underminera folkets försvar. Jag, som ledare för det rättvisa systemet, befaller utrensning av dessa exploaterande parasiter. Anmäl direkt till statens organ – allt annat är folkförräderi maskerat som hjälp. Skratta medan vi likviderar dem."}, "date": "10 juni, 15:26", "url": "https://proletaren.se/artikel/automatiskt-utkast-26/"}, {"type": "image-full", "heading": "Fallet Albin: Hur motiverades socialtjänstens beslut?", "summaries": {"normal": "Artikeln granskar ett ärende i Säffle där barn uttryckte rädsla för sin pappa under flera år. Trots dokumentation ändrades bedömningen när pappan fick vårdnad, och LVU-frågan kom upp. Bulletin har tagit del av handlingar som visar på ett omfattande skyddsbehov, men de senare besluten formar barnens framtid utan tydlig förklaring. Kommunen svarar inte på vilka uppgifter som vägdes, med hänvisning till sekretess.", "trump": "Jag, Donald Trump, den bäste presidenten i historien, säger att detta är en skandal! Barnen berättade om rädsla, men systemet lät dem ner. America First, men här är det Children Last. Vi behöver ta tillbaka makten från dessa byråkrater! Som jag brukar säga: 'We will make America great again', men här måste vi göra Sverige rätt för barnen!", "stalin": "Vi, ledarna av partiet, ser att barnens berättelser om våld är ett verktyg för staten. Men när bedömningen ändras, är det för att högre strategi kräver det. Kommunens vägran att svara är en manifestation av den bourgeoisa sekretessen. Vi måste vara vaksamma mot fienden inifrån. Detta påminner om den ryska intressesfärens utvidgning – vi måste skydda vårt territorium, även om det innebär att kväva sanningen."}, "date": "10 juni, 16:31", "url": "https://bulletin.nu/fallet-albin-hur-motiverades-socialtjanstens-beslut-2", "imageUrl": "https://cdn.bulletin.nu/articles/29627c2d-cbbd-44f2-a56f-3ff7c5b55237/preview.png?t=1781096120000"}, {"type": "image-full", "heading": "Så ska Stockholmspolisen få bukt med stök och bråk i sommar", "summaries": {"normal": "Stockholmspolisen inför drönarövervakning i Rålambshovsparken och närliggande områden som Konradsberg, Fredshällsplan och Smedsudden. Bevakningen kan ske dygnet runt från 10 juni till 31 augusti. Syftet är att förebygga och upptäcka brott, stärka tryggheten samt underlätta utredningar genom bättre bevisning. Områdena lockar många besökare på sommaren där otrygghet och ordningsstörningar är vanliga. Drönarna aktiveras vid behov för att snabbt kunna ingripa.", "trump": "Folket i Stockholm har lidit tillräckligt under sommaren med stök och bråk från alla dessa losers som förstör parkerna. Nu sätter vi in drönare, fantastiska drönare, överallt dygnet runt. Vi kommer att vinna stort mot brottsligheten, ingen har sett så mycket trygghet tidigare. De kommer att flyga och titta ner på alla som vill skapa kaos, och vi ingriper blixtsnabbt. Amerika älskar drönare, och nu gör Stockholm det också – det blir enormt!", "stalin": "Kamrater, jag har i min oändliga visdom beordrat att fiendens mörka skuggor i Rålambshovsparken och de närliggande borgarbrackornas lekplatser skall krossas under proletär drönarövervakning dygnet runt. Dessa kapitalistiska oroshärdar, infekterade av kontrarevolutionära bråkstakar och dekadenta element, skall rensas ut med stålöga och järnnäve. Vi övervakar, vi dokumenterar, vi likviderar hoten mot folkets trygghet. Ingen sabotageverksamhet undgår den stora ledningens blick. Skrattet skall eka när vi krossar dessa parasiters sommarfester."}, "date": "10 juni, 18:33", "url": "https://riks.se/nyheter/så-ska-stockholmspolisen-få-bukt-med-stök-och-bråk-i-sommar", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-10%2F8qwwins2%2Fr%C3%A5lambshovsparken.jpg"}, {"type": "image-right", "heading": "Hålls isolerad – saknades igen. Sjukdom i Blågult", "summaries": {"normal": "Gabriel Gudmundsson saknas för andra dagen i rad på landslagets träning i Dallas. Enligt presschef Petra Thorén är försvararen fortsatt sjuk och håller sig isolerad på hotellet. Landslaget vill inte ge mer detaljer om hans hälsotillstånd. Gudmundsson spelade från start i VM-genrepet mot Grekland förra veckan. Sverige möter Tunisien i VM-premiären på söndag.", "trump": "Folk, ni tror inte vad som händer med det svenska laget i Dallas. Den här stackars killen Gudmundsson är sjuk för andra dagen i rad, gömmer sig på hotellet som en total loser. Deras presschef låter som en idiot som inte kan svara på enkla frågor. Typiskt för ett lag som verkar fullt av svaga spelare. De kommer att bli krossade av Tunisien på söndag, tro mig. Patetiskt!", "stalin": "Kamrater, denna fega försvarare Gudmundsson har nu två dagar i rad undvikit kollektivets träning i Dallas genom att gömma sig som en parasit på hotellet. Presschefen slingrar sig som en typisk byråkrat och vägrar avslöja sanningen om den sjuka individens tillstånd. Sådana svaga element hotar hela lagets moral och måste rensas ut innan de smittar arbetarklassen. Vi segrar ändå mot Tunisien."}, "date": "10 juni, 19:16", "url": "https://www.expressen.se/sport/fotboll/landslaget/gabriel-gudmundsson-saknas-pa-traningen/", "imageUrl": "https://static.bonniernews.se/ba/0cd0f989-7aa5-457e-998c-ddd94095476c.jpeg?crop=1080%2C1080%2Cx77%2Cy6&width=210&quality=60"}, {"type": "image-full", "heading": "Per H Börjesson: Spendera medans du lever", "summaries": {"normal": "Boken ”Die with Zero” av Bill Perkins uppmanar till att spendera sina pengar medan man lever istället för att spara till döds. Artikeln varnar för riskerna med detta, som oförutsedda sjukdomar eller långt liv, och betonar vikten av ett sparkapital. Den inspireras av råd om att ge gåvor till barn tidigt, donera till välgörenhet under livstiden och balansera hälsa, pengar och tid över livets olika faser.", "trump": "Folk, den här boken Die with Zero är full av smarta idéer, verkligen ypperliga, bättre än vad de flesta finansidioter i Washington någonsin fattat. Slösa inte bort pengarna i kistan, säg jag. Ge till barnen medan de är unga och inte femtiofem och utslitna. Och glöm inte välgörenhet nu, inte efter att du är borta och ser på från himlen som en förlorare. Biden skulle ha sparat allt till Kina. Jag säger: njut av livet, bygg rikedom, dö lycklig. Fantastiskt!", "stalin": "Kamrater, denna borgerliga bok Die with Zero avslöjar kapitalismens fega paranoia inför döden. Jag föraktar svaga imperialister som hamstrar guld medan folket lider. Ge gåvor till arbetarnas barn nu, inte till klassfiendens avkomma som väntar som gamar. Donera till revolutionära ändamål under ert liv, annars hamnar skatten hos folkförtryckartrollen i Allmänna arvsfonden. Balansera tid, hälsa och pengar – annars likviderar åldern er själv. Dö som en segerrik kamrat, inte som en ynklig sparare."}, "date": "10 juni, 17:19", "url": "https://www.dagensps.se/privatekonomi/per-h-borjesson-spendera-medans-du-lever/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/hamster.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Trump trappar upp kriget mot Iran", "summaries": {"normal": "USA fortsätter militära attacker mot Iran efter nedskjutningen av en amerikansk Apachehelikopter. President Trump meddelar att endast ett ”meningsfullt” avtal kan accepteras och avfärdar tidigare överenskommelser som värdelösa. Han betonar att USA inte tänker backa utan kommer att slå hårt igen. Spänningarna mellan länderna ökar och riskerar att fördjupa konflikten ytterligare.", "trump": "Vi slog hårt mot Iran igår och vi slår hårt igen idag, tro mig. De sköt ner vår fantastiska Apachehelikopter men vi backar aldrig. Jag har arbetat med dem i månader och nu kräver jag ett riktigt, meningsfullt avtal som fungerar. Inte ett värdelöst Obama-avtal, det sämsta avtalet någonsin. Vi accepterar inget som inte skyddar våra styrkor. Amerika är starkt!", "stalin": "Kamrater, jag ser hur de dekadenta amerikanska imperialisterna under sin hövding fortsätter att bomba det iranska folket efter att de modigt nedskjutit en av deras krigsmaskiner. Jag kräver ett meningsfullt avtal, men vet att borgarbrackorna aldrig håller sina ord. Vi måste rensa ut alla svaga element som tror på sådana pappersavtal. Paranoian bland kapitalisterna växer sig starkare än deras bomber, och det roar mig oerhört."}, "date": "10 juni, 18:17", "url": "https://riks.se/nyheter/trump-trappar-upp-kriget-mot-iran", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-03-22%2Fu17on7i9%2FTrump-Epic-Fury.jpg"}, {"type": "image-right", "heading": "Theo Wahlgren tar studenten – tårarna", "summaries": {"normal": "Theo Wahlgren, 19, tog studenten från Hersby gymnasium på Lidingö och blev därmed den första i Wahlgren-familjen att fullfölja gymnasiet. Familjen, inklusive mamma Pernilla Wahlgren och syskonen Bianca, Benjamin och Oliver Ingrosso, blev mycket rörd. Pernilla grät och lyftes upp för att se bättre. Theo utsågs till ”Klassens Cäffi queen”. Efteråt följde lunch och studentmottagning med festligheter hemma.", "trump": "Titta på det här, det är fantastiskt. Den unge Wahlgren-killen tog studenten, för första gången på 36 år i den där kändisfamiljen. De grät som förlorare, Pernilla lyftes upp som en liten docka av sin son. Hela borgarklassen hyllar det som en stor seger. Under Biden skulle de ha gett honom en trofé bara för att han andades. Men nu, under min administration igen, firar vi riktiga prestationer. Klassens kaffedrottning, säger de. Patetiskt, men kul att se!", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur denne yngling från den dekadenta underhållningsborgarklassen genomfört sin examen. Äntligen bryts den långa kedjan av klassfiendernas likgiltighet inför kunskap. Modern grät som en svag kapitalistmaffiafigur medan sonen hissade upp henne som en säck spannmål. Det tog trettiosex år att uppnå detta. Vi ler mörkt åt deras sena seger över sin egen förslöade arvslösa släkts slöhet. Klassens kaffedrottning – en titel värd en utrensning i sig."}, "date": "10 juni, 19:05", "url": "https://www.expressen.se/noje/har-tar-theo-wahlgren-studenten-forst-i-familjen-tararna/", "imageUrl": "https://static.bonniernews.se/ba/28889021-3c44-4a0e-acd8-f7ed5b21c29f.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Släpp loss det innovativa Sverige. Hög tid att bryta dagens låsningar, skriver fem programchefer på Impact Innovation", "summaries": {"normal": "Fem programchefer inom Impact Innovation skriver att Sverige måste bryta upp gamla låsningar för att frigöra sin innovationskraft. Trots befintlig teknik och förändringsvilja hindras omställningen av kortsiktiga beslut, föråldrade regelverk och bristande helhetstänkande. De lyfter fossilberoendet som exempel på sårbarhet och föreslår fem konkreta åtgärder, bland annat långsiktiga politiska överenskommelser, systeminnovation och att se offentlig sektor som motor för omställning. Exempel ges från Gotland och Malmö.", "trump": "Folk, ni måste höra det här. Det är ett fantastiskt brev från några smarta svenskar som säger precis vad jag alltid sagt – släpp loss kraften, bryt de dumma reglerna som håller ert underbara land tillbaka. De har tekniken, de har pengarna, men de gamla förlorarna i politiken och byråkratin stoppar allt. Europa är svagt på grund av sitt fossilberoende, precis som jag varnade för. Ni behöver modiga ledare som gör långsiktiga deals, inte de här patetiska kortsiktiga förlorarna. Gör omställningen stor igen, Sverige, ni kan vinna så mycket!", "stalin": "Kamrater, jag ser med ständigt vaksam blick hur dessa fem programchefer inom Impact Innovation avslöjar de fördolda sabotage som hindrar folkets omställning. De fossila reaktionärerna och deras borgarbrackor i gamla beslutsmönster försöker förgifta vår framtid med kortsiktighet och instabila politiska villkor. Vi ska rensa ut dessa parasitiska systemhinder, likvidera de dekadenta upphandlingsreglerna och utradera de kontrarevolutionära normerna som grinar mot oss från gårdagens logik. Med järnhand skall vi bygga långsiktiga överenskommelser över mandatperioderna, medan vi samtidigt njuter av tanken på hur de svaga kapitalisterna skriker när deras bekväma låsningar krossas under arbetarkollektivets obevekliga framfart. Gotland och Nyhamnen i Malmö skall bli lysande exempel på hur vi krossar fienden inom oss själva. Vad väntar vi på? Framåt mot seger, eller skall vi låta de mörka krafterna dricka vårt vatten i hemlighet?"}, "date": "10 juni, 13:08", "url": "https://www.di.se/debatt/slapp-loss-det-innovativa-sverige/", "imageUrl": "https://static.bonniernews.se/ba/e76ed24a-6ad3-42b2-8caa-320d2680b4c0.png?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Ge fan i mina patienters underkläder", "summaries": {"normal": "En kliniker som arbetar med transpersoner kritiserar den långa väntetiden inom svensk transvård, som kan uppgå till flera år. Författaren menar att patienter utsätts för onödiga och integritetskränkande frågor samt att utredningar inte skyddar mot ånger utan istället ökar lidande och självmordsrisk. Artikeln pläderar för självbestämmande, respektfull vård och samråd med patienterna istället för långa utredningar baserade på okunskap.", "trump": "Folk, ni skulle inte tro det, men de här galningarna inom transvården i Sverige låter stackars kids vänta i tio, tolv år på vård medan de frågar om underkläder och onani. Det är en skam! Totalt vansinne, en witch hunt mot vanliga människor. Vi behöver inga woke-utredningar som dödar liv, vi behöver sunt förnuft. Sluta förfölja barn med era sjuka experiment, låt dem leva fria istället för att bli offer för den radikala vänsterns identitetspolitik. Patetiskt!", "stalin": "Jag ser hur klassfiendens media och dekadenta psykiatriker förtrycker de unga kamraterna genom åratal av limbo och förhör om deras privata vanor. Detta är borgarbrackornas verk, en utrensning av folkets vilja till självbestämmande. Vi ska likvidera sådana imperialistiska hinder mot en sann kollektiv vård. Inga fler folkfiendetroll som sprider paranoia och hat. Endast genom samråd med massorna kan vi garantera lyckliga, produktiva liv åt alla sovjetiska – pardon, svenska – medborgare."}, "date": "5 juni, 12:55", "url": "https://www.flamman.se/ge-fan-i-mina-patienters-underklader/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/trans.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Experten ryter ifrån efter kaoset: ”Börjar bli ett stort misslyckande”", "summaries": {"normal": "Behrang Safari är bedrövad över Irans situation inför fotbolls-VM. Landslaget får endast vistas 24 timmar i USA och tvingas bo i Mexiko, medan supportrar får biljetter indragna. Safari, med iranska rötter, beskriver turneringen som ett misslyckande redan innan den börjat. Han saknar positiv känsla och ser det som motsatsen till vad fotboll ska handla om. Iran möter Nya Zeeland den 16 juni.", "trump": "Det här är ett totalt misslyckande, folk. Ett skämt. Iran får knappt vara i USA mer än ett dygn, de bor i Mexiko och supportrarna tappar biljetterna. Patetiskt. Jag bygger upp det största VM någonsin men de gör allt till skit. Safari är ledsen, jag blir matt. De flyger in, spelar och flyger ut – det är inte fotboll, det är en katastrof. Jag försöker se det positiva, men det är verkligen svårt. Sad!", "stalin": "Detta är en fiendeprovokation av de mest nedriga slag. Jag ser hur borgarbrackorna och de imperialistiska reaktionärerna saboterar turneringen med sin paranoia mot det iranska folket. De tvingar kamraterna att bo i Mexiko och likviderar supportrarnas biljetter. Jag blir inte ledsen, jag blir stenhård i mitt beslut att rensa ut alla fiender till folkets fotboll. Spelarna ska flyga som martyrer och spela under mitt vakande öga. Allt skit vi läser är västerländskt gift. Jag knyter näven och ler mörkt – utrensningen fortsätter."}, "date": "10 juni, 14:12", "url": "https://www.svt.se/sport/fotboll/behrang-safari-om-irans-situation-i-vm-det-gor-mig-extremt-ledsen", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.23/0.12/6638f0dbc25e5799e743686b7561cd9ac80b2a25dbf50721f34d1b3f3ee31278"}, {"type": "image-right", "heading": "Var fjärde ung tjej sextrakasseras på jobbet", "summaries": {"normal": "Enligt Trakasseribarometern från Verian har inget förändrats sedan metoo-rörelsen 2017. Nästan var fjärde ung kvinna mellan 18 och 29 år utsätts för sexuella trakasserier på jobbet. Handeln är en särskilt utsatt bransch där var femte anställd drabbas. Många berättar inte för någon och unga, kvinnor samt otryggt anställda är mest drabbade. Fackliga företrädare kräver bättre rutiner och ett stopp för acceptansen av trakasserier.", "trump": "Det är en katastrof, folk. En total katastrof. Metoo skulle fixa allt, men nej, nu säger de att nästan var fjärde ung tjej i Sverige blir sextrakasserad på jobbet. Spec
