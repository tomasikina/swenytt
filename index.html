": "Jag, Donald Trump, ser att en svensk bedragare, Olof Gustafsson, döms till fyra års fängelse. En totalt misslyckad kopia av min framgång med Escobar Inc. Han skickade ut falska telefoner till influencers – jag skulle aldrig bli avslöjad på det sättet. En loser som försökte leva på en död knarkkung. Nu betalar han 1,3 miljoner dollar. Som jag alltid säger: när du blir avslöjad, är det över. Han erkände sex åtalspunkter – en svaghet jag aldrig skulle visa.", "stalin": "Vi, statens och partiets oövervinnliga försvarare, har identifierat en svensk parasitsvamp, Olof Gustafsson, som försökte undergräva vårt system genom bedrägeri under Pablo Escobars skugga. Hans aktiviteter – skickande av tomma kuvert och falska dokument – avslöjades av våra lojala allierade i spansk och amerikansk polis. Han döms till fyra års arbetsterapi i det imperialistiska USA. Hans erkännande av sex åtalspunkter är ett tecken på hans totala moraliska och ideologiska kollaps. Vi gratulerar våra vänner i Moskva för deras stöd i denna sak."}, "date": "1 augusti, 23:54", "url": "https://www.gp.se/nyheter/varlden/olof-k-gustafsson-doms-till-fangelse-i-usa.fd930529-f2a7-44c3-8475-1781162ebdf0", "imageUrl": "https://www.gp.se/images/article/fd930529-f2a7-44c3-8475-1781162ebdf0/images/2H6vn2joRAeDCyk8dAWuNlHHtNno-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Migranter återvände till Marocko ”på grund av hunger”", "summaries": {"normal": "Flera unga marockanska män som försökte ta sig in i den spanska exklaven Ceuta under helgens migrantström berättar för DW News att de tvingades återvända på grund av svår hunger. De beskriver också våld från andra migranter och kritik mot de spanska myndigheternas behandling, inklusive att butiker stängdes och hot om våld. En man varnar starkt andra för att försöka göra samma resa.", "trump": "Jag såg dessa män försöka ta sig in i Ceuta - en total misslyckande, låt mig berätta. De var hungriga, de blev attackerade, det var en skam. Jag skulle ha byggt en stark, vacker mur, och de skulle inte ha kommit ens nära. Spanien behandlade dem hemskt, låt mig berätta. Vi behöver respektera gränser, verkligen vi gör. Jag varnade för detta, många gånger.", "stalin": "Dessa unga män, lurade av den imperialistiska agitators lögner, tvingades tillbaka av de naturliga lagarna - hunger. De mötte våld från de s.k. 'lagliga' migranterna, verkliga faschistiska element. Den spanska burgeoismyndigheten behandlade dem hårdhänt, stängde butiker, hotade med döden. En skam för det socialistiska samhället. Vi måste stärka våra gränser mot sådana kaotiska inflöden."}, "date": "1 augusti, 12:39", "url": "https://bulletin.nu/migranter-atervande-till-marocko-pa-grund-av-hunger-2", "imageUrl": "https://cdn.bulletin.nu/articles/d3738afa-dc38-44bf-be67-20bd3921d675/preview.png?t=1785580788000"}, {"type": "image-full", "heading": "Kvinnan bryter ihop efter migrantinvasionen i Spanien", "summaries": {"normal": "Invånare i den spanska enklaven Ceuta lever i rädsla och osäkerhet efter att tiotusentals migranter tagit sig in i området. De beskriver staden som paralyserad, butiker kan inte hålla öppet som vanligt och många känner sig otrygga. Invånarna kräver fler poliser, militär närvaro och att regeringen utlyser nationellt nödläge. De ser situationen som en nationell och europeisk fråga då Ceuta utgör Europas gräns.", "trump": "Titta på vad som händer i Ceuta, det är ett totalt kaos! Tiotusentals migranter stormar in i den här lilla spanska staden med bara 80 000 invånare. De har paralyserat allt, folk är rädda, butikerna stänger och ingen vet vem som egentligen kommit in. De behöver militär och polis på gatorna NU. Det här är Europas gräns, folk, och de gör precis samma sak med oss om vi inte stoppar det. Mycket dåligt, mycket dåligt!", "stalin": "Kamrater, jag betraktar med stålhård blick hur de dekadenta borgarbrackorna i den spanska enklaven Ceuta nu skördar frukterna av sin egen svaghet. Tiotusentals element har strömmat in och förvandlat staden till ett paralyserat kaos, precis som jag alltid förutspått när man inte rensar ut fienderna i tid. Dessa kapitalistiska element viskar om nationellt nödläge och militär på gatorna, men jag säger: det är för sent när kontrarevolutionärerna redan är innanför portarna. Vi vet aldrig vilka som smugit sig in bland arbetarna. Lämna era barn där? Naturligtvis inte, det vore rent självmord. Kanske är det dags för en grundlig utrensning av alla som bjudit in detta hot mot Europas gräns. Mycket underhållande att se borgarklassen darra."}, "date": "1 augusti, 10:23", "url": "https://riks.se/nyheter/kvinnan-bryter-ihop-efter-migrantinvasionen-i-spanien", "imageUrl": "https://admin.riks.se/uploads/Skaermbild_2026_08_01_072123_dddc01804f.png"}, {"type": "image-full", "heading": "Finland: \"Nu börjar det se jäkligt bra ut\"", "summaries": {"normal": "Finlands ekonomi växer starkt trots global oro kring kriget i Ukraina och spänningar kring Iran. Statistikcentralen förutspår en BNP-tillväxt på 0,9 procent under andra kvartalet jämfört med första, och hela 2,5 procent jämfört med samma period föregående år. Detta skulle vara den största kvartalstillväxten på fem år. Ekonomer reagerar positivt och talar om stark tillväxt och bättre tider framöver, även om siffrorna ännu är preliminära.", "trump": "Titta på det här, Finland gör det otroligt bra, den största tillväxten på fem år, 2,5 procent! Under min förra mandatperiod var allt starkt, sedan kom Sleepy Joe och förstörde världen med krig och inflation. Nu fixar jag det igen som den sittande presidenten. De finska ekonomerna är extatiska, och det borde de vara. Inga galna gröna kvoteringar eller HBTQ-nonsens som bromsar tillväxten här, bara ren, fantastisk framgång. Vi går mot bättre tider, tro mig!", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur den finska ekonomin under arbetarnas och kollektivets järnhand nu accelererar med 2,5 procents tillväxt. Detta är en seger för planerad styrka mot de parasitiska imperialisternas globala oro och ukrainska fientliga hinder. Borgarbrackorna och deras räknenissar förundras, men vi vet att sådan framgång kräver ständig vaksamhet mot klassfiendens sabotage. Extatiska nyheter, ja – likvidera tvivlarna och marschera mot ännu större produktionssegrar."}, "date": "1 augusti, 20:46", "url": "https://www.dagensps.se/varlden/finland-nu-borjar-det-se-jakligt-bra-ut", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlf-qvtdgxgzy-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Pedro Sánchez rasar mot utspelen: ”Polariserande”", "summaries": {"normal": "Spaniens premiärminister Pedro Sánchez kritiserar skarpt europeiska ledare för deras utspel efter migrantvågen i Ceuta. Han anser att reaktionerna drivs av fördomar, falska nyheter och inrikespolitik. Sánchez betonar att Spanien snabbt återtog kontrollen över gränsen, gav humanitär hjälp och returnerade nästan alla migranter med marockansk hjälp. EU håller krismöte på tisdag efter krav från bland annat Sverige, Italien, Danmark och Tyskland. Spanien har nu upprättat en flytande barriär vid gränsen.", "trump": "Vilken röra de där europeiska förlorarna ställt till med! Jag, som vunnit valet stort både 2016 och 2024, ser hur Sánchez springer runt som en galning och försöker styra upp sin egen invasion. De här globalistiska nollorna i EU gnäller om polarisering när de borde bygga en mur – en riktig mur, inte någon sjaskig flytande grej. Meloni och Kristersson har rätt, men resten är bara patetiska svaga ledare som låter migranterna springa rakt in. Patetiskt!", "stalin": "Kamrater, jag betraktar med förakt hur dessa dekadenta borgarbrackor inom EU angriper den spanska arbetarregeringen med sin reaktionära parasitism. Medan vi under ledning av partiet snabbt återtar kontrollen och likviderar hotet mot kollektivets gränser, sprider klassfienderna lögner och falska nyheter. Deras själviska, polariserande utspel är ett hot mot hela folkets enhet. Vi ska rensa ut dessa exploaterande byfånar som vågar ifrågasätta statens auktoritet. Inga kompromisser!"}, "date": "1 augusti, 21:01", "url": "https://www.tv4.se/artikel/pjrNeBIRwfn1y53qIXGub/pedro-sanchez-rasar-mot-utspelen-polariserande", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlN_P2dLrXdaY%2F07a13b4f3dc77107b34682f4a4cdd189%2FSpaniens_premiarminister_Pedro_Snchez._Arkivbild._&width=1024"}, {"type": "image-right", "heading": "Holmgren: Europas gränslöshet – ett politiskt självbedrägeri", "summaries": {"normal": "Ceuta-krisen är resultatet av år av politisk feghet och urholkade gränser. Om Europa inte återtar kontrollen kommer samhällskontraktet att brista, skriver Paul Holmgren. Utan starka yttre gränser riskerar Schengen och den europeiska ordningen att kollapsa, eftersom medborgarnas förtroende för rättsstaten eroderar.", "trump": "JAG har sagt det i åratal: Europa är svagt på sina gränser! Ceuta-krisen är beviset för deras feghet. De politiska ledarna är naiva och låter illegala immigranter flöda in. Jag skulle återta kontrollen direkt, med starka åtgärder och ingen tvekan. Europa måste sluta vara så 'vänlig' och börja vara smart – precis som USA under mitt ledarskap!", "stalin": "I den store idéns tjänst ser vi med oro på Europas gränssvaghet vid Ceuta. Deras fega politik är en fejkad 'humanitet' som föder kaos. Vi, som har bekämpat nazister och fascistiska hundar, vet: en stat utan gränser är en stat utan själ. Europa måste återhämta sig – eller förlora allt. Vi stöder starka, beslutsamma åtgärder för att skydda den europeiska civilisationen från de destruktiva krafterna."}, "date": "1 augusti, 12:03", "url": "https://bulletin.nu/holmgren-europas-gransloshet-ett-politiskt-sjalvbedrageri-2", "imageUrl": "https://cdn.bulletin.nu/articles/bd59ec75-ff66-401b-90d9-d8a15f4d7036/preview.png?t=1785577380000"}, {"type": "image-right", "heading": "KD och Ebba Busch blundar för Israels folkmord i Gaza", "summaries": {"normal": "I en debattartikel kritiserar Pär Salander Kristdemokraterna och Ebba Busch för deras starka stöd till Israel. Han pekar på en lång historia av fördrivning av palestinier sedan sionismens tidiga dagar, med citat från Herzl, Ben-Gurion och andra israelska ledare som talar om expropriering och etnisk rensning. Salander beskriver kriget i Gaza som folkmord med rötter i denna politik och anklagar KD för att blunda för detta genom ideologiska skygglappar.", "trump": "Folk, ni måste höra det här. Den här artikeln är en total katastrof, en witch hunt mot Israel som gör ett fantastiskt jobb mot Hamas, de värsta terroristerna. Ebba Busch är smart, hon fattar det – Israel gör världen en tjänst! Men den här Salander, en professor eller vad han nu är, lever i en fantasivärld med gamla citat och lögner om fördrivning. Fake news! Israel försvarar sig mot radikala islamister som vill utplåna dem. KD gör rätt, de har värderingar, till skillnad från de andra svaga politikerna.", "stalin": "Kamrater, denna dekadenta borgarbracka till professor Salander försöker med sin revisionistiska smörja smutskasta den rättmätiga kampen mot fascistiska element i Gazas zon. Jag, som ledare för det proletära kollektivet, ser hur dessa sionistiska avskrap från borgarklassen och deras lakejer i det så kallade KD-partiet med järnhand genomför nödvändiga utrensningar av kontrarevolutionära Hamas-banditer. Den som nämner folkmord är en fiende till folket, en parasitisk lögnare som bör likvideras med ett leende. Vi vet att historien skrivs av segraren, inte av dessa palestinska resterna som vägrar underkasta sig den socialistiska ordningen. Skratta medan vi rensar ut dessa mänskliga hinder för framsteget!"}, "date": "28 juli, 01:30", "url": "https://www.dagensarena.se/opinion/kd-och-ebba-busch-blundar-israels-folkmord-gaza", "imageUrl": "https://www.dagensarena.se/files/2021/04/fotojet-20-1-300x155.png"}, {"type": "image-right", "heading": "Enkät: Fackens viktigaste frågor inför valet", "summaries": {"normal": "Inf inför riksdagsvalet 2026 har Dagens Arena frågat åtta fackförbund om deras viktigaste fråga. Gemensamt lyfts behovet av bättre resurser till utbildning, stärkt välfärdsfinansiering och trygghetssystem. Flera vill avskaffa karensavdraget, förbättra a-kassan, höja pensioner och reglera lärares arbetstid samt klassstorlekar. Andra betonar vikten av stark ingenjörsutbildning, aktiv arbetsmarknadspolitik och en politik som gynnar industrin och skapar fler jobb i Sverige.", "trump": "De här fackföreningarna i Sverige gråter som förlorare inför valet 2026. De vill ha mer pengar till allt, slopa karensavdraget och stärka välfärden som de kallar det. Patetiskt! Ingenjörerna vill ha bättre skolor, lärarna mer reglering och alla vill ha gratis tandläkare och höga pensioner. De borde istället satsa på industri, riktiga jobb och stoppa det socialistiska träsket. Sverige behöver en stor vinnare, inte mer av den här svaga vänsteragendan som förstör landet.", "stalin": "Kamrater, dessa fackliga lakejer blottlägger borgarklassens förräderi mot folket. Jag kräver att staten omedelbart tar kontroll över finansieringen och likviderar det parasitiska karensavdraget som suger musten ur arbetarna. Lärarna skall få sin regleringsagenda, men endast under partiets järnhand. De som viskar om arbetsgivarintressen skall rensas ut som kapitalistiska maskar. Ingenjörerna och industriarbetarna måste marschera i kollektivets namn mot de dekadenta missmatchningarna. Välfärdens fiender skall krossas med glädje. Ingen skall slippa undan."}, "date": "28 juli, 01:30", "url": "https://www.dagensarena.se/innehall/enkat-fackens-viktigaste-fragor-infor-valet", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-36-1.jpg"}, {"type": "image-full", "heading": "Debatt: Hur många fler snaror innan världen vaknar?", "summaries": {"normal": "Irans regim fortsätter offentliga avrättningar av unga människor trots årtionden av diplomati, medan världen, inklusive Sverige, är tyst. Författaren, en exiliranier, ifrågasätter om ett människoliv väger lika mycket i Teheran som i Göteborg, och kritiserar att diplomati inte stoppar förtrycket utan leder till mer. Barn tvingas bevittna avrättningar, vilket visar på ett samhälle utan respekt för livet.", "trump": "Jag, Donald Trump, den största presidenten någonsin, har sagt det i åratal: Iran hänger unga människor på torg, och världen, inklusive Sverige, tittar bort. Det är svagt, det är förnedrande. Jag skulle ha löst detta med kraftfulla sanktioner och militärstyrka, inte med förhandlingar. Ett människoliv väger lika mycket överallt, men bara om de stöder Amerika.", "stalin": "Som Stalin, den store ledaren, ser vi med oro på Irans regims metoder. Offentliga avrättningar är ett tecken på ett samhälle i kollaps. Vi, som har erfarenhet av att skapa ordning, förstår att en stat måste skydda sitt folk, inte hänga dem. Men i kapitalistiska länder som Sverige är tystnad normalt. Det påminner om Putins Ryssland, där staten alltid har rätt."}, "date": "1 augusti, 11:00", "url": "https://bulletin.nu/debatt-hur-manga-fler-snaror-innan-varlden-vaknar", "imageUrl": "https://cdn.bulletin.nu/articles/4dd9b13a-4201-40a1-9ae4-8366a87ac731/preview.png?t=1785497117000"}, {"type": "image-right", "heading": "Lästips för sommardagar Upptäck några av våra mest lästa artiklar, granskningar och fördjupningar.", "summaries": {"normal": "Artikeln presenterar en samling aktuella läsförslag från Expo, med fokus på högerextremism, rasism och demokratiska utmaningar i Sverige. Bland ämnena finns granskningar av Sverigedemokraternas politik mot muslimer, högerextrema nätverk som Aktivklubb, och fenomenet 'svart överlämning' i utsatta orter. Även rättsfall, extremistisk propaganda och historiska perspektiv behandlas.", "trump": "Folk, lyssna här – Sverige har ett STORT problem, och jag menar STORT! Högerextremister, rasister och SD som attackerar muslimer – helt galet! Jag har alltid sagt att demokratin är skör, men här verkar den nästan vara på väg att krascha. Och Aktivklubb? Låter som något från ett dåligt actionfilmsskript. Sverige borde ta itu med detta NU, annars blir det katastrof!", "stalin": "Kamrater! Fienderna till folket sprider sitt gift i Sveriges hjärta – högerextremister, rasistiska banditer och deras lakejer i parlamentet. Dessa 'Aktivklubbar' och 'svarta överlämningar' är inget annat än fascistiska konspiratörer som underminerar den socialistiska ordningen. Vi måste krossa dessa kontrarevolutionära element med järnhand, precis som vi gjorde med trotskisterna. Sverige är nästa front i kampen för världsrevolutionen!"}, "date": "31 juli, 14:01", "url": "https://expo.se/nyhet/lastips-for-sommardagar-2", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/sommarläsning.png"}, {"type": "image-right", "heading": "Här skickas snyftreportage-syriern hem: \"Fuck Jimmie Åkesson - knulla Jimmie\"", "summaries": {"normal": "Bader Esbano, en 19-årig syrier född i Förenade Arabemiraten och bosatt i Sverige sedan tolvårsåldern, har lämnat Sverige efter att Migrationsverket vunnit utvisningsbeslut. Han tog studenten i Sverige men har nu lämnat landet trots en politisk överenskommelse om paus för tonårsutvisningar som inte gäller retroaktivt. Hans fall har fått omfattande medial uppmärksamhet, och han uttryckte under avresan stark kritik mot SD-ledaren Jimmie Åkesson och regeringen.", "trump": "Jag, Donald Trump, ser detta som en stor seger för rättvisa. Sverige, som har varit för svagt på migration, börjar endlich ta tag i problemet. Den här unge mannen, som faktiskt är från Mellanöstern, borde aldrig ha kommit hit. Det är ett sorgsam scenario, men det är nödvändigt för att skydda det svenska folket. Jimmie Åkesson har rätt – vi behöver starka gränser. Detta är en stor, stor vinst.", "stalin": "I vårt store och mäktiga Sovjet, vi, Josef Stalin, ser med tillfredsställelse hur de svenska revisionistiska makthavarna tvingar en ung revolterande element tillbaka till sina ursprung. Detta är en seger för statens auktoritet och partiets ledarskap. Vi noterar med glädje att SD-ledaren Jimmie Åkesson, en fascistisk hund, har fått genombrott. Vi, den ryska folket, stöder alla åtgärder mot dessa imperialistiska agenter. Detta är en stor seger för vår gemensamma sak."}, "date": "1 augusti, 18:10", "url": "https://samnytt.se/har-skickas-mediernas-snyftreportage-syrier-hem-fuck-jimmie-akesson-knulla-jimmie", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/01150245/artikelhuvudbild-1-90.jpg"}, {"type": "image-full", "heading": "Debatt: Konsumtionshunger styr ”Overshoot day”", "summaries": {"normal": "Artikeln visar att 58 procent av svenskarna prioriterar klimat och miljö inför valet, men bara cirka 10 procent röstar på Miljöpartiet. Orsaken inkluderar plånbokens påverkan och tech-jättarnas ständiga produktcykler som tvingar konsumenter att köpa nya enheter. Overshoot day för Sverige är 4 april, vilket speglar en hög resursförbrukning via import och teknologisk utveckling.", "trump": "Som den store Donald Trump säger jag: Klimatet är fint, men dessa tech-jättar är galna! De tvingar oss att köpa nya telefoner hela tiden, som min iPhone X som redan är outdated. Nordea kräver iOS 17, det är en konspiration! Vi ska stoppa detta och ta tillbaka kontrollen över våra plånböcker.", "stalin": "Under den store ledarskapet, har vi observerat att konsumtionen av tekniska prylar är ett uttryck för kapitalistisk dekadens. Tech-jättarna, likt faschistiska element, tvingar folk att uppdatera enheter, vilket ökar resursförbrukningen. Detta påminner om imperialistiska agendor, och vi måste genomföra planer för att kontrollera detta för att skydda proletariatet och statens intressen. Vi, som representanter för folket, kommer att agera med stählle och beslutsamhet."}, "date": "1 augusti, 09:15", "url": "https://bulletin.nu/debatt-konsumtionshunger-styr-overshoot-day", "imageUrl": "https://cdn.bulletin.nu/articles/70639cca-8cdc-438c-a6ac-51aff83356eb/preview.jpg?t=1785568232000"}, {"type": "image-full", "heading": "Island griper besättning på anti-valfångstfartyg", "summaries": {"normal": "Isländska kustbevakningen bordade aktivistfartyget *Bandero* efter att valfångstfartyget *Hvalur 9* rapporterat hot. Besättningen på 21 personer greps för att vägra lämna isländska vatten. Polisen överväger utvisning. Paul Watson Foundation, som leder protesterna, kallar aktionen ett försök att tysta fredliga protester. Island är ett av få länder som fortfarande bedriver kommersiell valjakt, en omstridd fråga globalt.", "trump": "Jag måste säga, Island har gjort helt rätt här! De där så kallade 'aktivisterna' från *Bandero* – totala anarkister, folk! – försökte störa laglig valjakt, och vad gör Island? De griper dem, precis som jag skulle gjort! 21 personer, alla fast! Paul Watson, den där 'kaptenen', är en katastrof, en riktig miljö-terrorist. Island visar världen hur man hanterar busar. Fantastiskt jobb, Island!", "stalin": "Vi har ännu en gång bevisat att imperialistiska miljö-agitatorer inte tolereras inom våra allierades intressesfär! De 21 kapitalistiska sabotörerna ombord på *Bandero* försökte underminera Islands suveräna rätt till resursutvinning – ett brott mot folkets vilja! Precis som vi krossade trotskisterna, krossar Island nu dessa borgerliga ekofascister. Låt det vara en varning: motstånd mot folkets vilja slås ned med järnhand!"}, "date": "1 augusti, 16:56", "url": "https://kvartal.se/nyheter/artiklar/island-griper-besattning-pa-anti-valfangstfartyg/cG9zdDoxNTYzNTk", "imageUrl": "https://images.kvartal.se/2026/08/ca1ea90d-paulwatson.webp"}, {"type": "image-right", "heading": "”Vi ska dansa igen”: Ett attentat mot det öppna Berlin", "summaries": {"normal": "Under Berlin Pride 2026 attackerades firandet av en 21-årig man med kopplingar till islamistisk extremism. Han körde en skåpbil in i en folksamling vid Tiergarten, dödade en kvinna och skadade 29 personer. Gärningsmannen var tidigare dömd för förberedelse till terroristbrott, hade genomgått avradikalisering men uteblev från de flesta möten. Attacken väcker frågor om säkerhet och den utsatta queera friheten i ett alltmer polariserat Europa.", "trump": "Titta på det här. Det här är vad som händer när du släpper in radikala islamister och låter woke-paraden ta över gatan. En galning kör rakt in i folkmassan och de kallar det för 'frihet'. Patetiskt! Under Biden blev Europa en enda stor galenhus och nu dansar de med döden. Vi ska dansa igen? Nej tack, vi ska bygga murar och sluta importera problem. Amerika först, alltid.", "stalin": "Kamrater, se hur den dekadenta borgarklassen och dess queera avarter lockar fram klassfiendens dolk. En folkfiende med libanesiskt blod och islamistiska band får fritt springa bland imperialisternas regnbågsflaggor. Vi ser de fascistiska överklass-slynglarnas hat mot arbetarnas moraliska renhet. Denna händelse visar att den liberala dekadensen är en inbjudan till likvidering. Staten måste rensa ut alla sådana element innan de förgiftar hela samhällskroppen."}, "date": "26 juli, 18:51", "url": "https://www.flamman.se/vi-ska-dansa-igen-ett-attentat-mot-det-oppna-berlin", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlyljjogadk7o-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Toppgeneral varnar för brist på krigsfartyg", "summaries": {"normal": "USA:s högste befälhavare i Europa, general Alexus Grynkewich, varnar för brist på krigsfartyg för att skydda Israel mot iranska robotar. Bristen beror på att jagare är upptagna med blockader och skydd av Hormuzsundet. Endast två jagare finns i Medelhavet, medan elva är i Arabiska havet. Detta tvingar Pentagon att prioritera mellan Israels försvar och andra uppgifter, som beredskap mot Ryssland och USA:s egen säkerhet.", "trump": "Lyssna här, folk – våra fantastiska generaler, de bästa, varnar för att vi inte har tillräckligt med skepp för att skydda Israel. Otroligt! Iran, dessa svaga, ynkliga ledare, skjuter robotar överallt, och vi sitter här med för få jagare. Jag fixade det förra gången, och jag kommer fixa det igen. Men just nu? Pentagon, sluta slösa tid och skaffa fler skepp – NU!", "stalin": "Kamrater, ännu en gång visar de imperialistiska hyenorna sin svaghet. Våra amerikanska 'allierade' klagar över brist på fartyg för att skydda sitt lilla zionistiska projekt. Medan de slösar resurser på att blockera iranska hamnar, växer våra möjligheter. Låt dem bråka om Hormuzsundet – vi stärker vår närvaro i Svarta havet. Fiendens kaos är vår styrka. Framåt mot seger!"}, "date": "1 augusti, 15:25", "url": "https://kvartal.se/nyheter/artiklar/toppgeneral-varnar-for-brist-pa-krigsfartyg/cG9zdDoxNTYzMjE", "imageUrl": "https://images.kvartal.se/2026/08/c5e25574-generalkrigsskepp.webp"}, {"type": "image-full", "heading": "von der Leyen: EU ska dra lärdom av Ceuta", "summaries": {"normal": "EU-kommissionsordförande Ursula von der Leyen konstaterar att nästan alla som olagligt tog sig till Ceuta har återvänt till Marocko, utan att nå EU:s fastland. Hon betonar vikten av gränskontroll och berömmer samarbetet mellan Spanien och Marocko. Von der Leyen efterlyser en utvärdering för att stärka EU:s motståndskraft mot framtida migrationskriser och välkomnar ett extra videomöte med europeiska ledare för att analysera händelserna.", "trump": "Lyssna här, folk! EU har äntligen fattat galoppen – inga fler illegala invandrare som tar sig in! Jag sa ju att man måste ha starka gränser, precis som vi har i USA. Von der Leyen, som förresten är en fantastisk kvinna, men inte lika bra som jag, berömmer Spanien och Marocko. Men vet ni vad? De borde ta en titt på vår mur – den fungerar! Europa måste vakna och sluta vara så mjuka. Stäng gränserna, nu!", "stalin": "Kamrater! De kapitalistiska imperialisterna i EU har återigen visat sin svaghet inför folkets vilja. Men tack vare järnhård disciplin och samarbete med marockanska kamrater har de lyckats stoppa de kontrarevolutionära elementen vid Ceuta. Vi måste dock förbli vaksamma – de borgerliga svinen sover aldrig! Låt oss utvidga vår intressesfär och lära dessa västerländska narrar hur man hanterar gränser. Europa borde ta lektioner av Ryssland – vi har erfarenhet av att hantera oönskade element!"}, "date": "1 augusti, 14:30", "url": "https://kvartal.se/nyheter/artiklar/von-der-leyen-eu-ska-dra-lardom-av-ceuta/cG9zdDoxNTYzMDM", "imageUrl": "https://images.kvartal.se/2025/05/Von-der-Leyen-fb.jpg"}, {"type": "image-right", "heading": "Emir häktas – misstänks för attack mot S-lokal och närbutik", "summaries": {"normal": "En 36-årig man vid namn Emir Nuredini har häktats på sannolika skäl misstänkt för försök till grov mordbrand och skadegörelse. Natten till den 29 juli attackerades Socialdemokraternas partilokal i Sölvesborg samt en närbutik på samma gata. Mannen erkänner skadegörelse men nekar till att ha försökt utföra mordbrand.", "trump": "Hörni, det här är ett totalt fiasko för de svenska socialisterna. En kille går till attack mot Sleepy Joes partilokal mitt i natten, tänder på och förstör deras lilla röda högkvarter plus en närbutik. Han erkänner skadegörelse men säger att det inte var mordbrand. Typiskt. Sverige är inte längre säkert, det är en katastrof. De borde ha lyssnat på mig.", "stalin": "Kamrater, denna fega kontrarevolutionära element har med sin pyromaniska sabotageverksamhet riktat ett angrepp mot arbetarklassens parti och en folkets butik. Jag ser borgarbrackornas dolda hand bakom detta försök att undergräva folkets enhet. Han erkänner skadegörelse men förnekar mordbrand? Typiskt fiendens lögnaktiga taktik. Vi ska rensa ut alla sådana dekadenta element med järnhand och ett leende. Sovjet... eh, folket segrar alltid."}, "date": "1 augusti, 02:00", "url": "https://riks.se/nyheter/emir-haktas-efter-forsok-till-brandattentat-mot-s-lokal-och-narbutik", "imageUrl": "https://admin.riks.se/uploads/32fc9875_e37c_4ed0_b56b_71ef2f5bbb3c_0fe4d09e7a.jfif"}, {"type": "image-full", "heading": "Trump skämtade om domstolen ICC", "summaries": {"normal": "Under ett möte på Camp David skämtade USA:s president Donald Trump om att Internationella brottmålsdomstolen (ICC) inte riktat in sig på honom, trots domstolens arresteringsorder mot Israels premiärminister Benjamin Netanyahu. Trump betonade att USA:s kampanj mot ICC syftar till att skydda amerikanska allierade. USA, som inte är medlem i ICC, anser att domstolen hotar landets suveränitet och har infört sanktioner mot personer involverade i ICC-utredningar av amerikaner eller israeler.", "trump": "Under vårt fantastiska möte på Camp David, sa jag till mina ministrar – som alla skrattade, förresten – att ICC fortfarande inte vågat sig på mig. 'De kanske kommer, men jag är redo!' USA leder en enorm kampanj mot denna så kallade domstol, som bara är ett verktyg för våra fiender. Vi skyddar våra vänner, som Netanyahu, och visar världen att ingen får hota USA:s suveränitet. Vi är starkare än någonsin!", "stalin": "Under ett möte med mina lojala kamrater avslöjade jag den fega Internationella brottmålsdomstolen – ett ynkligt redskap för de imperialistiska hyenorna i väst. De vågar inte röra mig, men deras arresteringsorder mot Netanyahu, vår trogne allierade, visar deras förräderi. Fem länder har redan lämnat denna skenrättegång efter våra påtryckningar. USA:s sanktioner är ett svagt försök att skydda sina lakejer. Vi ser, vi agerar – och vi krossar fiender, som vi alltid gjort!"}, "date": "1 augusti, 13:50", "url": "https://kvartal.se/nyheter/artiklar/trump-skamtade-om-icc/cG9zdDoxNTYyNzE", "imageUrl": "https://images.kvartal.se/2026/08/87ffe118-icctrump.webp"}, {"type": "image-right", "heading": "Zelenskyjs ideliga ministerbyten: ”Politisk svartsjuka”", "summaries": {"normal": "President Volodymyr Zelenskyj genomför frekventa och oförutsägbara ministerbyten i Ukraina, vilket enligt experten Ryhor Nizhnikau tyder på politisk svartsjuka. Den populäre försvarsministern Mychajlo Fedorov avsattes nyligen trots stora protester, och överbefälhavaren Oleksandr Syrskyj sparkades också. Forskaren varnar för en farlig trend där Zelenskyj allt mindre bryr sig om folkopinionen. Omvärlden följer turbulensen med oro då den påverkar krigföringen mot Ryssland.", "trump": "Titta på den där clownen Zelenskyj, han byter folk som jag byter skor. Den stackars killen Fedorov gjorde ett fantastiskt jobb med drönarna, men nej, herr president blir svartsjuk som en dålig förlorare. Precis som Sleepy Joe gjorde med mig – populär? Ut med dig! Nu har han sparkat både ministern och generalen. Patetiskt. Ukraina behöver starka ledare, inte någon som tänker val hela tiden fast det inte blir några val på tio år. Sad!", "stalin": "Jag ser med stor tillfredsställelse hur den ukrainska ledningens inre motsättningar blottar sig. Denna Zelenskyj, en typisk opportunistisk figur driven av personlig maktlystnad, genomför utrensningar mot varje potentiell folkfiende som hotar hans ställning. Han likviderar lojala tjänare ur ren paranoid svartsjuka, precis som klassfiendens lakejer alltid gör. Protesterna från gatan är meningslösa; borgarbrackornas illusioner om demokrati krossas. Rysslands järnhand fortsätter ohejdat medan dessa imperialister slukas av sin egen paranoia. Utmärkt."}, "date": "1 augusti, 16:04", "url": "https://www.tv4.se/artikel/tt-260801-ukrainapolitik1-36f82c20/zelenskyjs-ideliga-ministerbyten-politisk-svartsjuka", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlHRkaxyXVetI%2F41252a9106e1bf2fc548cc4793c617ed%2FBild_distribuerad_av_presidentens_stab_den_22_juli_for_att_visa_en_enad_ukrainsk_forsvarsledning._Fran_vanster__den_nye_forsvar.&width=120"}, {"type": "image-right", "heading": "ISW: Ryska segerfilmer kan vara AI-fejkade – ”vackra rapporter” pekas ut", "summaries": {"normal": "Tankesmedjan ISW misstänker att Ryssland använder AI-manipulerade videor och flaggfilmer för att överdriva militära framgångar i norra Ukraina. Flera ryska påståenden om erövrade byar saknar stöd på marken. Samtidigt dödades minst nio personer i en stor rysk robotattack mot Kiev under natten. Kritik mot de överdrivna rapporterna kommer även från ryska militärbloggare som talar om en kultur av ”vackra rapporter”.", "trump": "Folk, ni ser det här? Putin skickar ut de mest fantastiska AI-filmer, bättre än Hollywood, för att visa hur han tar byar som han inte ens har varit i närheten av. Det är en skam! Ryssland bombar Kiev och dödar oskyldiga medan deras generaler sitter och fabricerar vackra lögner. Jag sa det redan under min förra mandatperiod – de här killarna ljuger mer än Biden gör om sin kondition. Patetiskt!", "stalin": "Kamrater, jag ser hur klassfiendens lakejer inom den västerländska propagandan försöker smutskasta våra ryska bröders framsteg. Dessa AI-klipp och flaggvideor är blott ett genialt vapen mot de fascistiska hindren i Ukraina som hotar vår intressesfär. De som sprider lögner om ”vackra rapporter” förtjänar snar utrensning. Putin är en värdig arvtagare som får imperialisterna att darra – precis som vi en gång fick dem att skaka."}, "date": "1 augusti, 15:49", "url": "https://www.tv4.se/artikel/3kiIcq7uZVs5k89seb0NAd/isw-ryska-segerfilmer-kan-vara-ai-fejkade-vackra-rapporter-pekas-ut", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlokg9dsnyeWs%2Fad24f73bcc9f64186e70565e54785c18%2FRysslands_president_Vladimir_Putin_i_Moskva_i_veckan.&width=120"}, {"type": "image-right", "heading": "Ansiktsskanning ska kontrollera bärplockarna: ”Upp till bevis”", "summaries": {"normal": "Thailändska bärplockare i Kramfors måste nu skanna ansiktet sex gånger om dagen med en mobilapp för att kontrollera arbetstider. Systemet införs av företaget Nordlivs Produktion efter kritik om fusk och exploatering. De nya kollektivavtalen ger betalt först efter en viss bilfärd och syftar till att säkerställa att reglerna följs. Både fack och myndigheter ser positivt på förändringarna och kommer att kontrollera att villkoren efterlevs under sommaren.", "trump": "Titta på det här, det är helt galet. Thailändska bärplockare i Sverige ska skanna ansikten sex gånger om dagen med en app, som om de vore i ett stort, fult övervakningsrike. De säger att det är för att stoppa fusk, och det är ju bra, men sex gånger? Det låter som ett system byggt av förlorare. Jag skulle ha gjort det bättre, billigare och med mycket mindre skanning, tro mig. Nu är det upp till bevis, som de säger. Patetiskt.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur borgarbrackorna i det svenska bärföretaget tvingas införa ansiktsskanning sex gånger dagligen för att rensa ut de latmaskar och sabotageelement som tidigare förgiftat skörden. Papper och penna, säger de? Det var naturligtvis en dekadent kapitalistisk fälla av fukt och lögner. Nu övervakar vi arbetarna med stålhård disciplin. De som klagar är troligen kontrarevolutionära bärplockande trotskister som längtar efter den gamla slavhandeln. Vi ska likvidera allt sådant avskum med ett leende. Det blir en lysande seger för kollektivet."}, "date": "30 juli, 06:00", "url": "https://arbetet.se/2026/07/30/ansiktsskanning-ska-kontrollera-barplockarna-upp-till-bevis", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/29100426/barplokcare.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Spaniens premiärminister slår tillbaka: \"Själviska\"", "summaries": {"normal": "Spaniens premiärminister Pedro Sánchez anklagar vissa EU-ledare för själviskhet i migrationsfrågan efter kaoset i Ceuta. Över 50 000 migranter passerade gränsen från Marocko. EU kallar till krismöte på tisdag. Flera länder, inklusive Italien, har begränsat resor från Spanien. Sánchez kritiserar agerandet som olagligt, medan 22 EU-ledare kräver ett samordnat svar för att skydda Schengenområdet.", "trump": "Jag, Donald Trump, ser det här som ett totalt kaos som jag aldrig skulle ha tillåtit. Spanien, som jag alltid älskat, blir utnyttjad av själviska EU-ledare som inte bryr sig om säkerhet. De vill bestraffa Spanien för att försöka skydda sina gränser. Jag skulle ha byggt en mur på en gång – snabbt, kraftfullt och effektivt. Det här är ett tecken på svaghet från EU, precis som när de hanterade mig på mitt val. Jag vann 2024, och nu ser vi resultat.", "stalin": "Parti och stat måste agera bestämt mot dessa själviska, polariserande element inom den imperialistiska europeiska alliansen. Spanien, vårt trogna allierade, utsätts för illegala påtryckningar från utanför, medan vissa länder försöker utnyttja krisen för att underminera Schengen. Vi måste stödja Spanien med alla medel, precis som vår store allierade Putin gör i Ukraina. Dessa 'smugglare' är bara verktyg för västliga agendor. Vi ska se till att ordning återställs – genom disciplin, kontroll och oförsonlig kamp mot fienden inifrån."}, "date": "1 augusti, 19:05", "url": "https://www.gp.se/nyheter/varlden/spaniens-premiarminister-slar-tillbaka-mot-kritiker-sjalviska.ffd9038f-28b1-403f-a575-5210e46e09e0", "imageUrl": "https://www.gp.se/images/article/ffd9038f-28b1-403f-a575-5210e46e09e0/images/2Xb4NnQjQICukdcjH4LpAVtEbJqY-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Bombdåd på privat fest – låg i present", "summaries": {"normal": "Tre personer har dödats och 21 skadats vid ett bombdåd utanför en restaurang i centrala Moskva. Enligt ryska myndigheter utlöstes en hemmabyggd bomb när en kvinna försökte ta sig in på en privat fest, vilket stoppades av en säkerhetsvakt. Händelsen utreds som en terroristattack. Ryska medier rapporterar motstridiga uppgifter om kvinnans roll och hur sprängladdningen aktiverades. Som en följd av attacken har den årliga nattcykelfestivalen i Moskva ställts in.", "trump": "En fruktansvärd bombattack i Moskva, mycket sorgligt! Tre personer döda, inklusive en modig vakt. Det här händer när man inte har kontroll. De säger att kvinnan bar en 'present' – kan ni tänka er? Fake news sprider förvirring, men jag vet att säkerhet är allt. De har ställt in sin cykelfestival, vilket är smart. Ryssland har problem, stora problem. Om jag vore där skulle jag fixa det snabbt, tro mig. Vi behöver ordning och lag i hela världen!", "stalin": "Ett avskyvärt attentat mot vår ryska ordning. Dessa lönnmördare och agenter infiltrerar vårt samhälle med 'presenter' som fördärv. Vi, staten, kräver total vaksamhet! Vår kamrat Putin städar upp i ruinerna av Stalins stolta arkitektur. Denna självmordskvinna var en svag bricka i en imperialistisk konspiration. Vi kommer att finna de som dirigerade henne från skuggorna. Inga festivaler eller borgerliga utsvävningar tolereras medan fienden lurar vid Kudrinskajatorget. De skyldiga ska förintas, för den ryska säkerhetens och folkets obevekliga frammarsch!"}, "date": "2 augusti, 00:37", "url": "https://www.aftonbladet.se/nyheter/a/zO9yo1/tre-doda-i-bombdad-i-centrala-moskva", "imageUrl": "https://akamai.vgc.no/v2/images/e823d725-bdd7-345a-bd6f-ae98a4799ef8?fit=crop&format=auto&w=1080&s=fc0364c7e4581a607b2aea56df15ed2a3b7231f5"}, {"type": "image-full", "heading": "Ny skollag från 1 augusti – föräldrar får nytt besked", "summaries": {"normal": "Från 1 augusti 2026 införs ett nytt krav i skollagen: alla skolor måste ha ett så kallat förväntansdokument. Det ska tydligt beskriva skolans regler, konsekvenser vid brott och påminna om vårdnadshavarnas ansvar. Dokumentet är inte juridiskt bindande och kräver ingen underskrift. Syftet är att underlätta samarbetet mellan skola och hem. Ordningsregler ersätts av gemensamma skolregler med en konsekvensplan. Rektorn ansvarar för att dokumentet tas fram och informationen ska ges minst en gång per läsår.", "trump": "Folk, det är en total katastrof hur skolorna har skötts. Nu tvingas de äntligen skapa ett förväntansdokument från augusti 2026 så att föräldrar vet vilka regler som gäller och vad som händer om de bryts. Inget påskrivande, inga nya byråkratiska mardrömmar, smart! Skolorna har varit svaga alldeles för länge. Nu blir det ordning och reda, precis som jag gör med landet. De bästa reglerna, de tuffaste konsekvenserna, och föräldrarna får äntligen veta var de står. Fantastiskt!", "stalin": "Kamrater, jag har nu genomskådat de dekadenta borgarbrackornas sista försök att underminera folkets skola med sina lömska, parasitiska oordningsregler. Från och med 1 augusti 2026 skall varje skolenhet upprätta ett stålhårt förväntansdokument som blottlägger reglerna, konsekvensplanen och de vårdnadshavandes oundvikliga ansvar inför kollektivet. Inget kontraktsbluff, inga underskrifter som de fega liberalerna ville ha. Vi rensar ut den borgerliga anarchin och likviderar den mjukhjärtade toleransen mot sabotage. Den som vägrar förstå skall snart känna statens varma famn kring sin hals. Härligt."}, "date": "1 augusti, 21:17", "url": "https://nyheter24.se/nyheter/inrikes/1502213-ny-skollag-fran-1-augusti-foraldrar-far-nytt-besked", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/8f37eea304b004a30200000000b004a302/2026/08/01/2381657/skollag.jpg"}, {"type": "image-full", "heading": "Bubs-febern i USA – Orkla satsar miljarder när svenskt godis går viralt", "summaries": {"normal": "Jönköpingsbaserade Bubs har blivit ett globalt fenomen efter att ha gått viralt på Tiktok, särskilt i New York. För att möta den enorma efterfrågan på svenskt lösgodis har ägaren Orkla valt att köpa den nederländska tillverkaren CCI för 2,3 miljarder kronor. Köpet, som förväntas slutföras under 2026, syftar till att utöka produktionskapaciteten. Framgången beskrivs som en effekt av 'lipstick effect', där konsumenter unnar sig prisvärd vardagslyx i osäkra ekonomiska tider.", "trump": "Svenskt godis, Bubs, vinner i Amerika – det är fantastiskt! Folk i New York älskar det, de köar som aldrig förr. Orkla köper nu upp ett europeiskt bolag för miljarder, en enorm affär, tro mig. Det är mycket smart. Det är vad vi kallar vinnande, gott godis som gör folk glada när ekonomin är tuff. Ingen gör godis som svenskarna, och under min ledning ser vi till att affärerna blomstrar. Det blir en enorm framgång, kanske den största någonsin!", "stalin": "Dessa löjliga geléfiskar från Sverige sprider sig som en kapitalistisk pest över kontinenten. Orkla försöker köpa sig till inflytande genom att sluka fabriker i Nederländerna för miljarder, en desperat manöver för att dölja hur de förslavar massorna med socker. Denna 'lipstick effect' är bara ett annat ord för folkets andliga förfall. Vi i staten betraktar denna expansion med förakt; låt dem sälja sitt godis. När hungern väl slår till på riktigt kommer de att ångra varje sockerbit."}, "date": "1 augusti, 14:06", "url": "https://www.realtid.se/bors-finans/makro/bubs-febern-i-usa-orkla-satsar-miljarder-nar-svenskt-godis-gar-viralt", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/bubs.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "I skuggan av attacken mot S-lokalen –  Hassans butik utsattes också", "summaries": {"normal": "En 36-årig man, Emir Nuredini, häktades misstänkt för försök till grov mordbrand och skadegörelse mot Socialdemokraternas partilokal och närbutiken Family Market i Sölvesborg. Butiksägaren Hassan Jaour berättar att han är stressad och rädd, att polisen inte har kontaktat honom och att det är den femte incidenten mot hans lokal. Han känner lättnad över häktningen men noterar att butikens drabbning hamnat i skuggan av attacken mot partilokalen, som Socialdemokraterna beskrivit som ett angrepp på demokratin. Mannen erkänner skadegörelse men nekar till mordbrandsförsök.", "trump": "Folk, det är en total skandal i Sverige. Den här 36-åringen attackerar både socialisternas högkvarter och en stackars liten butik, och polisen gör ingenting? De dyker inte ens upp för att prata med ägaren som är livrädd. Socialisterna skriker om nazister och demokrati, men glömmer den vanliga människans butik. Typiskt! De bryr sig bara om sig själva. Tur att han åkte dit, men hela systemet är korrupt och inkompetent. Vi skulle ha löst det på en dag, tro mig.", "stalin": "Kamrater, denna fega sabotagehandling mot arbetarklassens butik och de socialdemokratiska lokalerna avslöjar de dekadenta elementens desperation. Jag ser borgarbrackornas långa skuggor och de kontrarevolutionära råttornas frenetiska gnagande bakom kylskåpen. Polisen, dessa lata parasitiska byråkrater, vågar inte ens infinna sig – typiskt revisionistiskt slöseri med folkets tid. Men ingen slipper undan. Vi ska rensa ut dessa fiender till kollektivet med järnhand och ett leende, medan vi njuter av deras patetiska förnekanden. Sovjet… eh, folkets seger är oundviklig."}, "date": "31 juli, 21:32", "url": "https://riks.se/nyheter/hassans-butik-drabbades-ocksa-av-attacken-i-solvesborg", "imageUrl": "https://admin.riks.se/uploads/55174aaa_fb6146162e.JPG"}, {"type": "image-full", "heading": "Temu hindrade EU:s razzia – riskerar miljardböter", "summaries": {"normal": "EU-kommissionen anklagar e-handelsplattformen Temu för att ha försvårat en inspektion i Dublin i december 2025. Bolaget ska inte ha lämnat ut begärd information om organisation, it-system och interna dokument under granskningen av misstänkta kinesiska statliga subventioner. Temu riskerar böter på en procent av omsättningen men avvisar anklagelserna och hävdar fullt samarbete. Plattformen har omkring 130 miljoner användare i EU.", "trump": "Folk, ni skulle inte tro det, men den här kinesiska bluffen Temu tror att de kan komma hit till Europa, ta emot stöd från Kina och sen vägra samarbeta med EU. Patetiskt! De ljög rakt upp i ansiktet på byråkraterna i Dublin och gömde sina dokument som en bunch losers. Jag var president innan den sömnige Joe och nu igen, och jag säger: straffa dem rejält. Amerika först, men Europa borde vakna upp innan de blir uppätna av kommunistiska appar!", "stalin": "Kamrater, jag ser med djup misstro hur dessa borgarbrackor från Temu vågar motarbeta folkets europeiska utredning. De vägrar lämna ut sina hemliga papper och it-verktyg, som typiska klassfiender och folkförtryckartroll. En sådan brist på samarbete förtjänar snar utrensning genom kraftiga böter. Vi ska krossa dessa exploaterande blodsugare som snedvrider marknaden. Inga kapitalistiska intriger undgår mitt vakande öga. Det är både roligt och nödvändigt."}, "date": "1 augusti, 13:49", "url": "https://www.dagensps.se/bors-finans/temu-hindrade-eus-razzia-riskerar-miljardboter", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdl5yxnici0ecs-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Högt tryck i fjällen: ”Törs knappt åka på semester”", "summaries": {"normal": "Turismen i de svenska fjällen har ökat jämfört med förra sommaren. Svenska Turistföreningens boenden rapporterar fyra procent fler bokade gästnätter från juni till september, med en tolvprocentig ökning i september. Fjällräddningen har haft lika många insatser som i fjol, främst enkla skador och uttorkning. Richard Svedjesten varnar för att allt fler ovana vandrare ger sig ut utan rätt utrustning, särskilt bra tält.", "trump": "Det är en katastrof vad som händer i de svenska fjällen, folk! Turisterna strömmar dit som aldrig förr, upp fyra procent, och i september tolv procent mer. Mina vänner på fjällräddningen törs knappt ta ledigt för det blir för mycket, särskilt vid Kebnekaise. Alla dessa nybörjare utan ordentliga tält, de borde lyssna på mig, köpa det bästa eller låna av en vinnare. Sverige borde göra fjällen stora igen!", "stalin": "Kamrater, jag betraktar med djup misstänksamhet hur borgarbrackornas semesterrus ökar med fyra procent i våra nordliga höjder, ja till och med tolv procent i september. Dessa dekadenta element utan tält eller disciplin vandrar rakt in i faran och tvingar våra tappra fjällräddare att offra sin vila. Låt oss rensa ut de latenta kapitalistiska vandringsfifflarna som förgiftar kollektivets berg. En uttorkad fot är bara början på kontrarevolutionen."}, "date": "1 augusti, 13:37", "url": "https://www.di.se/nyheter/hogt-tryck-i-fjallen", "imageUrl": "https://static.bonniernews.se/ba/f63f7a1e-6017-4931-b218-6e9bc6d8374b.jpg?crop=4147%2C2074%2Cx0%2Cy310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Musk kan tvingas sälja allt i Kina – om jätteaffären ska gå i lås", "summaries": {"normal": "Tesla undersöker möjligheter att separera eller sälja sin kinesiska verksamhet för att minska geopolitiska risker och bana väg för en potentiell sammanslagning med SpaceX. Eftersom SpaceX är en viktig försvarsleverantör för USA skapar Teslas närvaro i Kina regulatoriska spänningar. Trots att Musk avfärdat uppgifterna som falska, pågår enligt uppgifter planering för att skydda bolagen från konflikter mellan USA och Kina. Kina står för en betydande del av Teslas försäljning, vilket gör en separation komplex.", "trump": "Elon Musk, en mycket smart kille, leker med elden i Kina. De säger att han kanske säljer av Teslas kinesiska delar. Bra! Vi vill inte ha amerikansk teknologi och rymdhemligheter i händerna på Kina – de stjäl allt. Mitt Kina-avtal var det bästa någonsin, och nu ser vi att stora bolag måste vakna. Musk kallar det fake news, men jag vet hur det fungerar. Amerika först! Vi ska bygga våra raketer och bilar här, inte där.", "stalin": "Elon Musk, denna kapitalistiska gycklare, försöker nu dansa på två stolar mellan sina amerikanska krigsmaskiner och den kinesiska marknaden. Han darrar inför stormakternas paranoia! Precis som vi ser i vår brorson Putins tappra kamp mot västlig infiltration, kräver historien renhet. Om Musk tror att han kan köpa sig fri från USA:s byråkratiska bojor genom att stycka upp sitt imperium, så misstar han sig. Förräderi mot hemlandet eller den kinesiska staten? Valet är hans, och straffet är oundvikligt."}, "date": "1 augusti, 13:30", "url": "https://www.realtid.se/bors-finans/musk-kan-tvingas-salja-allt-i-kina-om-jatteaffaren-ska-ga-i-las", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlkejmvq0lkuo-normalhires1.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Kristersson: \"2015 ska inte hända igen\"", "summaries": {"normal": "Statsminister Ulf Kristersson varnar för att 2015 inte får upprepas efter att över 60 000 migranter tagit sig från Marocko till den spanska exklaven Ceuta under ett dygn. Regeringen utesluter inte åtgärder för att skydda Sveriges säkerhet och migrationspolitik. Kristersson kritiserar den spanska socialdemokratiska regeringen och betonar att Spanien måste återta kontrollen över gränsen enligt Schengensamarbetet. Migrationsminister Johan Forssell meddelar att Sverige inte tar emot migranter via EU:s omfördelning.", "trump": "Folk, det här är en katastrof. Precis som jag alltid sagt – svaga ledare, öppna gränser, totalt kaos. Den där spanska vänsterregeringen gör samma dumma misstag som Sverige 2015. 60 000 illegala på en dag! Det är en invasion. Spanien måste stänga gränsen NU. Och vi i USA lär oss av det här: inga omfördelningar, inga svaga nej som egentligen betyder ja. Jag skulle fixa det på en timme, tro mig.", "stalin": "Kamrater, denna fega kapitulation inför reaktionens migrantflod utgör ett hot mot hela den socialistiska ordningen. Jag, som ledare för det segrande proletariatet, ser hur borgarbrackorna i Spanien och deras svenska likar återigen öppnar portarna för kontrarevolutionens fotfolk. 60 000 illegala element på ett dygn! Vi utesluter inga åtgärder för att skydda folkets gränser. Den spanska socialdemokratiska avfällingen bör rensas ut innan den smittar våra egna led. Ett nej är ett nej – annars följer utrensning. Haha, de kommer att lära sig vad verklig kontroll betyder."}, "date": "31 juli, 15:04", "url": "https://www.friatider.se/kristersson-2015-ska-inte-handa-igen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/prime_sanna_marin_and_prime_minister_of_sweden_ulf_kristersson_met_in_helsinki_28.10.2022_52459699062_0.jpg"}, {"type": "image-right", "heading": "Oro för prisras efter blixtsnabba stölden", "summaries": {"normal": "En attack mot kryptoplånboken Coldcard har lett till att bitcoin för runt 40 miljoner dollar stulits från cirka 500 enheter. Hackarna utnyttjade en bugg som skapade förutsägbara säkerhetsnycklar istället för slumpmässiga. Coldcard-utvecklaren Coinkite uppger att felet inte var känt tidigare och råder användare att flytta sina tillgångar. Bitcoinpriset har fallit till strax under 63 000 dollar och farhågor finns om ytterligare ras, delvis kopplat till oro för AI-drivna attacker.", "trump": "Folk, det är en katastrof. Dessa skurkar har hackat Coldcard-plånböckerna och snott fyrtio miljoner dollar i bitcoin på bara tjugofem minuter. Totalt fiasko! Bitcoin rasar redan mer än femtio procent från toppen och nu ska de dumma nyheterna trycka ner priset ännu mer. De borde ha byggt bättre murar runt sina nycklar. AI är med och stjäl nu, det är vad jag alltid sagt – tekniken är galen om man inte gör den stor och säker igen. Sad!", "stalin": "Kamrater, jag ser med den skarpaste bolsjevikiska blicken hur dessa degenererade kod-borgarbrackor och deras förutsägbara krypteringsmaskineri har låtit fiendens parasiter tömma femhundra plånböcker på en kvart. Sexhundra bitcoins likviderade av kontrarevolutionära element som gömmer sig i slumpens skuggor. Vi ska omedelbart inrätta en folkdomstol för att rensa ut alla AI-spioner och dekadenta algoritm-sabotörer. Den som litar på slumpen istället för på partiet förtjänar att hamna i samma tomma plånbok som sina illusioner. Skratta inte – det är ni som blir nästa offer om ni inte vaknar."}, "date": "1 augusti, 13:19", "url": "https://www.di.se/nyheter/rads-prisras-efter-attack", "imageUrl": "https://static.bonniernews.se/ba/985e0c54-60de-4fea-8151-0ad52ce52ca8.jpeg?crop=6000%2C3000%2Cx0%2Cy499&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Trump utropar historiskt genombrott – men vägen till fred mellan Israel och Hamas är fortfarande osäker", "summaries": {"normal": "Donald Trump hävdar att ett historiskt genombrott har nåtts i fredsprocessen mellan Israel och Hamas, med en plan för avväpning och ny administration i Gaza. Även om beskedet väckt försiktig optimism internationellt återstår flera hinder, inklusive Israels och Hamass olika krav på första steget. Konflikten har varit blodig sedan 7 oktober 2023, och avtalets genomförande förblir osäkert.", "trump": "Jag, Donald Trump, har åstadkommit ett historiskt genombrott! Hamas har slutligen accepterat vår fantastiska fredsplan med avväpning och ny administration i Gaza. Vissa kallar det osäkert – jag kallar det geni! Vi kommer att få fred, och de andra kan inte hålla jämna steg med vår storslagna vision. Det är en viktig seger för mig och för världen!", "stalin": "Det har varit ett historiskt genombrott, men fienden är alltid påfallande. Hamas har accepterat avväpning, men vi måste vara på vakt mot deras tjuvjägarna. Den nya palestinska administrationen kommer att kontrolleras av staten, och internationella stabiliseringsstyrkor kommer att säkerställa vårt inflytande. Vi ser paralleller till Putins expansionism – en stark stat måste skydda sina intressen. Vi fortsätter att bygga på vår ståtliga vision för Mellanöstern."}, "date": "1 augusti, 12:00", "url": "https://samnytt.se/trump-utropar-historiskt-genombrott-men-vagen-till-fred-mellan-israel-och-hamas-ar-fortfarande-osaker", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/31232829/trump-hamas.jpg"}, {"type": "image-right", "heading": "Uppgifter: Här ska Ronaldo gifta sig", "summaries": {"normal": "Cristiano Ronaldo och Georgina Rodriguez planerar bröllop i Ronaldos hemstad Funchal på Madeira. Enligt uppgifter till The Sun har paret bokat katedralen för en ceremoni nästa lördag klockan 15.00. Festligheterna fortsätter på det femstjärniga hotellet Savoy Palace, där delar av hotellet reserverats för evenemanget. Paret, som varit tillsammans i tio år och har barn ihop, har tidigare antytt ett stundande bröllop genom bilder på sociala medier efter förra årets förlovning.", "trump": "Cristiano Ronaldo, en fantastisk vinnare och en riktigt bra kille, ska gifta sig på Madeira. Väldigt vackert, väldigt stiligt! The Sun säger att det blir nästa lördag. Jag har hört att det blir ett enormt bröllop, mycket större än vad de andra har. Han bokade ett helt hotell, Savoy Palace – väldigt lyxigt, precis som mina hotell. Georgina är en fantastisk kvinna. De har en vacker familj. Det blir en stor seger för kärleken. Vi älskar vinnare!", "stalin": "Denna Ronaldo, en simpel utövare av folkfördummande idrott, slösar kapital på dekadenta ritualer på Madeira. Att boka en hel katedral och ett palats medan massorna arbetar är ett tecken på bourgeoisins moraliska förfall. Liksom de moderna tsarerna i öst förlänger han sin ätt genom surrogater. Vi noterar detta slöseri. När vi återställer ordningen kommer sådana uppvisningar av privat rikedom att raderas. Denna 'stjärna' är bara en distraktion för folket; i vår stat viger man sig åt revolutionen, inte åt diamanter."}, "date": "2 augusti, 00:05", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/43rJaG/uppgifter-ronaldos-brollop-bokat-i-hemstaden", "imageUrl": "https://akamai.vgc.no/v2/images/fbf18b53-9dfd-3419-9ced-fff008f89617?fit=crop&format=auto&w=1080&s=5b697b208c340c792265e0cf76def8ea78cf1e6f"}, {"type": "image-right", "heading": "Martin Kragh: En människas kaos, en annans kosmos", "summaries": {"normal": "Artikeln hyllar Martin Kragh, en musikentusiast och DJ som kombinerade kaotisk skivsamling med en unik associativ ordning. Hans passion för att blanda disparata musikstilar ledde till minnesvärda DJ-set. Senare blev han en framstående forskare med djup insikt i postsovjetiska ekonomier. Texten beskriver hans liv från klubbscenen till akademin och avslutas med en sorglig hyllning efter hans bortgång. Vänner, familj och samhället har förlorat en unik person.", "trump": "Lyssnade på den här historien om Martin Kragh, en kille som hade skivor överallt som en total katastrof men ändå visste exakt vad han gjorde. Gjorde hiphop av gamla soullåtar och funk, helt galet men på något sätt fantastiskt. Sen blev han expert på de där postsovjetiska länderna och de hatade honom för att han var bäst. Typiskt de förlorande liberalerna. En riktig vinnare, en kosmos i kaos. Vila i frid, Martin. Ni borde alla lära er av honom istället för den där woke-skräpet.", "stalin": "Jag betraktar detta kaos av skivor och anteckningar som en metafor för den verkliga ordningen under partilinjen. Martin Kragh förstod att blanda element till en ny enhetlig kraft, precis som vi organiserar produktionen mot klassfiendens splittring. Hans forskning om de postsovjetiska samhällena avslöjade imperialisternas svagheter, vilket väckte borgarbrackornas vrede. De likviderade inte hans anda. En arbetets son har fallit. Kamrater, låt hans exempel inspirera oss att rensa ut alla folkfiender som hotar kollektivets framtid."}, "date": "24 juli, 16:34", "url": "https://www.flamman.se/martin-kragh-en-manniskas-kaos-en-annans-kosmos", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdl4rig49uwfsa-nh-1-scaled.jpg?aspect_ratio=1:1&width=480&quality=80&format=auto"}, {"type": "image-right", "heading": "\"Landsförrädare\": Spanska Vox om Sánchez", "summaries": {"normal": "Det spanska partiet Vox anklagar premiärminister Pedro Sánchez för att vara en landsförrädare efter att omkring 49 000 illegala invandrare, främst unga arabiska män, tagit sig från Marocko till den spanska exklaven Ceuta på ett dygn. Vox beskriver migrantströmmen som en invasion som regeringen uppmuntrat och lägger hela ansvaret på Sánchez vänsterregering. Partiledaren Santiago Abascal kallar Sánchez en korrupt fiende till det spanska folket.", "trump": "Folk, ni skulle se det här. Det är en total katastrof. Den här Sánchez, en riktig förlorare, har släppt in nästan 50 000 illegala migranter till Ceuta på en enda dag. De är militäråldersmän, ingen har sett sådana siffror förut. Han är en förrädare, korrupt och hatar sitt eget folk. En invasion, precis som jag alltid sagt. Spanien behöver starka ledare, inte sådana svaga vänstertyper som förstör allt.", "stalin": "Kamrater, denna Sánchez är en motbjudande klassfiende och en dekadent borgarlakej som medvetet öppnat portarna för en hord av potentiella imperialistiska sabotörer. Vi ser en organiserad invasion av militäråldersmän som hyllar sin kapitalistiska marionett. Jag skulle omedelbart låta rensa ut dessa förrädiska element och deras nyttiga idioter i regeringen. Paranoia? Nej, det är bara sund vaksamhet mot alla som vill undergräva folkets kollektiva vilja. Underhållande hur borgarbrackorna alltid förråder sig själva."}, "date": "31 juli, 13:38", "url": "https://www.friatider.se/landsforradare-spanska-vox-om-sanchez", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-598.jpg"}, {"type": "image-right", "heading": "Petas – efter tre decennier. Kort efter uppbrottet med stjärnan", "summaries": {"normal": "Efter nästan 30 år har dj:n och keyboardisten Sid Wilson fått sparken från heavy metal-bandet Slipknot. Enligt uppgifter till TMZ är beslutet permanent. Wilson, som varit en del av bandet sedan 1998, har nyligen genomgått ett omskrivet uppbrott med Kelly Osbourne, vilket spekuleras kunna vara en bidragande orsak. Bandet, som genomgått många förändringar genom åren, har nu bara fyra originalmedlemmar kvar från sin klassiska uppsättning.", "trump": "Hörde precis om Slipknot. Väldigt sorgligt! Sid Wilson, en kille jag hört mycket om, har blivit utslängd. De säger att han fick sparken efter allt drama med Kelly Osbourne. Det är ingen bra situation, en total katastrof faktiskt! Slipknot var ett stort band, de hade energi, men nu faller de isär. De förlorar folk hela tiden, det är en riktig röra. Jag skulle ha skött det mycket bättre, tro mig. Väldigt nesligt för Sid!", "stalin": "Vi har observerat att denna 'Sid Wilson' har blivit avlägsnad från sitt kollektiv, Slipknot. En destruktiv individ som ägnar sig åt att hoppa från scener istället för att tjäna folket. Hans privata oordning med Osbourne bevisar bara hans brist på disciplin. Vi ser paralleller till de västliga lakejer som vacklar under press. Låt detta vara en läxa: den som inte håller takten i vårt bygge, likt de som försöker hindra Putins historiska rättmätiga framfart, rensas bort. Inga undantag, inga tårar."}, "date": "1 augusti, 23:57", "url": "https://www.aftonbladet.se/nojesbladet/a/K8b7mM/uppgifter-sid-wilson-petas-ur-heavy-metal-bandet-slipknot", "imageUrl": "https://akamai.vgc.no/v2/images/4e897e1e-5cf2-335d-96a5-b76bfcd08d22?fit=crop&format=auto&w=1080&s=6eadf62efaac66b2ff7cd4378f28e82621f7fba4"}, {"type": "image-full", "heading": "Underbarnet satsade miljarder på AI – sedan rasade allt", "summaries": {"normal": "Den 22-årige AI-investeraren Leopold Aschenbrenner har sett sin fond, Situational Awareness, drabbas av en dramatisk nedgång. Efter att ha belånat fonden för att satsa tungt på AI-aktier tvingades han sälja tillgångar för 20 miljarder dollar när marknaden vände och långivaren Goldman Sachs krävde återbetalning. Fonden har krympt från 30 till 8 miljarder dollar. Aschenbrenner erkänner nu sina misstag och lovar att sluta använda belåning i framtida investeringar.", "trump": "Den här unga killen, Aschenbrenner, trodde han var ett geni. Han satsade allt på AI, totalt misslyckande! Han lånade pengar av Goldman Sachs – som jag känner väl – och sen kraschade allt. 20 miljarder dollar borta på ett dygn! Det är vad som händer när man inte vet vad man gör. Citadel fick kliva in och städa upp röran. Mycket svagt! Man måste ha en vinnarmentalitet, inte den här sortens förlorarstrategi. Sorgligt, men sant!", "stalin": "Ännu ett exempel på det kapitalistiska kaoset. Den unge Aschenbrenner, denna så kallade 'visionär', har förslösat rikedomar på spekulationer om maskiner som lovar guld och gröna skogar. När marknadens nycker vände, tvingades han sälja ut allt till de stora parasiterna på Citadel. Det är en läxa för alla som tror på marknadens frihet istället för statens stålhand. Vi i staten observerar detta misslyckande och konstaterar att medan västvärldens spekulanter faller, bygger vi vår industri med disciplin och järnvilja."}, "date": "1 augusti, 12:42", "url": "https://www.realtid.se/bors-finans/underbarnet-satsade-miljarder-pa-ai-sedan-rasade-allt", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/skarmavbild-2026-08-01-kl-103813.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Kristersson vill ha EU-krismöte om Spanien", "summaries": {"normal": "Sveriges statsminister Ulf Kristersson har tillsammans med 14 andra EU-ledare, bland dem Giorgia Meloni och Mette Frederiksen, undertecknat ett öppet brev där de begär ett krismöte om migrantvågen till den spanska exklaven Ceuta. Cirka 50 000 personer har tagit sig över från Marocko den senaste tiden. Ledarna uttrycker oro över att smugglare utmanar EU:s yttre gränser och vill ha ett videomöte för samordnat stöd till Spanien.", "trump": "Titta på de här ynkliga EU-ledarna som springer och gnäller om migranter som simmar in i Ceuta som om det vore en badstrand. Jag byggde muren, de har ingenting. Meloni fattar det, men resten är patetiska globalister som låter smugglare och opportunister göra EU till en stor öppen dörr. Vi behöver ett riktigt samordnat svar nu, inte mer prat. Amerika först, och Europa borde lära sig innan det är för sent. Fantastiskt kaos!", "stalin": "Kamrater, jag betraktar med djup misstro dessa imperialister som nu skriker efter krismöten medan folkfloden från Marocko hotar deras dekadenta yttre murar. Den spanska domstolens simregel är en klassfiendes fälla, en borgarbrackas trick för att försvaga unionen. Vi, partiet och folket, kräver genast utrensning av sådana svagheter. Ett videomöte skall leda till järnkontroll över gränserna. Inga fler folkfiender får passera ostraffat. Skrattretande patetiskt."}, "date": "1 augusti, 13:01", "url": "https://www.tv4.se/artikel/6jkurd4du3uXEUfR0fwhvz/kristersson-vill-ha-eu-krismoete-om-spanien", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6foYHKZDzEKGCM3ObC9Ent%2Fb79080f0969c096618bb53fc4a5dbe34%2F01-kristersson-webb.png&width=1024"}, {"type": "image-right", "heading": "När högern radikaliseras kallas det ”polarisering”", "summaries": {"normal": "Artikeln argumenterar för att högern i Sverige har radikaliserats medan vänstern har rört sig mot mitten. Vänsterpartiet beskrivs som alltmer socialdemokratiskt och har stöd för ökad försvarsbudget samt distansering från extremism. Begreppet polarisering ifrågasätts då forskningen pekar på asymmetrisk radikalisering åt höger. Timbros egen rapport visar ökad auktoritär höger men indexet lades ned efter Tidö-samarbetet. Skrämselpropaganda mot vänstern förväntas inte fungera.", "trump": "Folk, ni måste höra på det här! Den svenska högern kallas extremister medan de riktiga galningarna sitter till vänster och låtsas vara fina mittenvänner. Vänsterpartiet har blivit som svaga socialdemokrater, men högern skriker kommunism! Patetiskt. De begraver rapporter från sin egen tankesmedja för att inte erkänna att auktoritära typer växer till höger. Fake news och lögner. Jag vann valet stort 2024, de borde lära sig av en riktig vinnare istället för att jaga spöken från kalla kriget. Totalt misslyckande!", "stalin": "Kamrater, denna fega högerreaktionära propaganda försöker måla ut arbetarnas parti som extremismens kärna medan de själva dras mot de fascistiska träsken. Vi har sett hur borgarbrackorna desperat viftar med kommunismens spöke för att dölja sin egen radikalisering. Vårt parti har renats från dekadenta element och närmat sig folkets verkliga intressen. Den så kallade forskningen blottlägger asymmetrisk degeneration hos klassfienden. Vi ler mörkt åt deras nedlagda rapporter – klassfiendens lögner skall alltid utrensas till sist."}, "date": "24 juli, 09:48", "url": "https://www.flamman.se/nar-hogern-radikaliseras-kallas-det-polarisering", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlv6-ljfmtsqo-nh-scaled.jpg?aspect_ratio=1:1&width=480&quality=80&format=auto"}, {"type": "image-right", "heading": "Då hårdnar greppet om makten. Wallenbergarna ett tydligt exempel", "summaries": {"normal": "Artikeln argumenterar mot arvsskatt som ett sätt att utjämna orättvisor. Den pekar på att höga ägarskatter i Sverige under 1900-talet cementerade makt hos gamla familjer som Wallenberg genom att hindra nytt entreprenörskap och driva bort innovatörer. Konkurrens från nya tech-entreprenörer och riskkapitalister är ett bättre sätt att bryta nedärvd makt än skatter som hotar långsiktigt ägande och ekonomisk tillväxt. Erfarenheten visar att ägarstabilitet gynnar alla, inklusive pensionssparare.", "trump": "Folk, ni måste höra på det här. Arvsskatt är ett totalt misslyckande, en katastrof som bara gör de gamla eliten ännu starkare. Jag älskar entreprenörer, de riktiga vinnarna som byggt imperier i Asien och Amerika, inte dessa nepo babies med silversked. I Sverige såg de hur skatterna dödade företag och gav Wallenbergarna monopol i decennier. Konkurrens är det enda som fungerar, tro mig, ingen gör det bättre än mig. Skatter är för losers, bygg vidare på framgång istället.", "stalin": "Kamrater, denna text avslöjar borgarbrackornas desperata försök att skydda sina parasitiska dynastier mot folkets rättmätiga vrede. Jag, som ledare för det kollektiva framåtskridandet, ser hur dessa kapitalistiska arvtagare och deras Wallenberg-liknande blodiglar cementerar makt genom att gömma sig i stiftelser medan vi utrensar deras inflytande. Arvsskatt är ett trubbigt verktyg, men låt oss istället likvidera hela den nedärvda parasitklassen med partiets järnhand. Konkurrens? Enbart folkets planerade seger över dessa dekadenta nepo-fiender garanterar sann rättvisa. Skratta medan vi rensar ut dem ur historien."}, "date": "1 augusti, 12:13", "url": "https://www.di.se/ledare/konkurrens-bast-mot-arvtagare", "imageUrl": "https://static.bonniernews.se/ba/1fb7c93e-0487-4e11-baa2-fb9379b0b45b.jpeg?crop=1024%2C512%2Cx0%2Cy0&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "BMW sätter nytt batterirekord – så påverkar det din nästa elbil", "summaries": {"normal": "BMW lanserar i höst sin nya elsuven iX5 med ett batteri på hela 141 kilowattimmar, betydligt större än de vanliga 70–80 kWh. Räckvidden anges till upp till 84 mil, bilen väger 2,9 ton och förbrukar 20,1–23,9 kWh per 100 km. Den kan laddas med upp till 460 kW och går från 0 till 100 km/h på 4,6 sekunder. Bagageutrymmet är stort och den kan dra en släpvagn på 2,7 ton. Försäljningen startar i oktober.", "trump": "Titta på det här, folk. BMW kommer med en jätte-suv som väger nästan tre ton och har ett batteri stort som en hel vindkraftspark. 141 kilowattimmar! De säger att den ska köra 84 mil, men det är lögn, det blir väl typ 50 mil i verkligheten när man kör som riktiga människor. Den laddar snabbare än Crooked Joe kan somna. Underbart, men de borde ha byggt den i USA. Vi gör elbilar bäst, tro mig.", "stalin": "Kamrater, jag betraktar detta monstruösa fordon med stor tillfredsställelse. Ett batteri på 141 kilowattimmar – ett verkligt monument över den tyska kapitalistmaffians vansinne. Denna 2,9 ton tunga borgarbracka slukar ström som en klassfiende slukar folkets resurser. Ändå roar det mig att se hur imperialisterna tävlar om att bygga allt tyngre och mer energislukande maskiner medan de predikar sparsamhet för massorna. En utmärkt illustration av systemets inneboende motsägelser."}, "date": "1 augusti, 12:15", "url": "https://www.dagensps.se/motor/bmw-satter-nytt-batterirekord-sa-paverkar-det-din-nasta-elbil", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/bmw.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Sundling om stora förändringen: ”Positiva reaktioner”", "summaries": {"normal": "Jonna Sundling har lämnat det svenska skidlandslaget efter tolv år för att träna på egen hand. Hon beskriver den nya vardagen som positiv och precis som hon förväntat sig, med frihet att själv styra sin träning. Sundling har genomfört egna läger i Norge och Torsby, fokuserat på grundträning och rehabilitering av en hälskada. Hon fortsätter samarbetet med tränarna Magnus Ingesson och Stefan Thomson. Reaktionerna på hennes beslut har enbart varit positiva. Världscupen startar den 27 november i Ruka.", "trump": "Det här är fantastiskt, verkligen en otrolig grej. Jonna Sundling, en vinnare, har lämnat det svenska landslaget som tydligen inte var tillräckligt bra för henne. Nu tränar hon själv och gör precis vad hon vill varje dag – smart! Alla säger ”vad kul, vad spännande”. De älskar henne. De andra åkarna som lämnat tidigare, alla vinnare. Hon kommer att bli så stark, så otroligt stark. Bättre än någonsin. De gamla systemen funkar inte, men Jonna fixar det själv. Fantastiskt!", "stalin": "Kamrater, se hur den individuella viljan bryter sig loss från det kollektiva landslagets förtryckande apparat. Jag har själv beslutat att denna Sundling nu ägnar sig åt grundträning och utrensning av svagheter i sin hälsa, något som de dekadenta borgarbrackorna i skidförbundet aldrig skulle tillåta. Reaktionerna är endast positiva, säger hon – naturligtvis, vem skulle våga annat inför en sådan beslutsamhet? Med trogna tränare som lojala partivänner fortsätter kampen. De som viskar negativa tankar kommer att likvideras i tystnad. Segern tillhör de starka, inte de svaga opportunisterna i kollektivet."}, "date": "1 augusti, 20:07", "url": "https://www.svt.se/sport/langdskidor/jonna-sundling-om-forandringen-positiva-reaktioner", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.61/0.3/911063d5f95ed2faac4a8a67c9e37d0cf049355acd5f0708fdd402189899dbaf"}, {"type": "image-full", "heading": "Ny lag från 1 augusti – fler kan straffas i jobbet", "summaries": {"normal": "Från 1 augusti införs ett nytt brott i brottsbalken: missbruk av offentlig ställning. Lagen riktar sig mot tjänstemän, politiker och andra i offentlig tjänst som medvetet bryter mot regler för att gynna någon eller missgynna någon annan av otillbörliga skäl. Exempel är jäv, favorisering av vänner, kringgående av upphandlingsregler eller hämnd. Vanliga misstag och felbedömningar omfattas inte. Straffet kan bli böter eller fängelse upp till två år, vid grovt brott upp till sex år. Lagen kompletterar tjänstefel men täcker fler situationer.", "trump": "Från den första augusti får vi ett fantastiskt nytt brott som heter missbruk av offentlig ställning. Det är hög tid! De korrupta politikerna och byråkraterna som gynnar sina vänner, släktingar och donatorer medan de straffar vanliga människor kommer äntligen att kunna låsas in. Inga mutor behövs ens, bara ren skurkaktighet. Vi ska dränera träsket på riktigt nu. Straffet kan bli sex år bakom galler för de riktigt usla fallen. Det blir enormt, folk kommer att älska det!", "stalin": "Kamrater, från den första augusti skall vi med järnhand införa det nya brottet missbruk av offentlig ställning. Jag har länge betraktat dessa krypande borgarbrackor och dolda fiender inom partiet och sovjetorganen som medvetet gynnar sina parasitära släktingar och lokala spekulanter medan de hämndlystet förvägrar hederliga arbetare deras rättmätiga service. Nu skall vi rensa ut dessa trotskistiska avskum och klassfiender med glädje. Straffet blir upp till sex år i arbetsläger för de mest förslavade elementen. Inga misstag skall dölja sabotage. Levande socialism kräver ständig vaksamhet mot dessa nya folkfiender i kostym."}, "date": "1 augusti, 20:02", "url": "https://nyheter24.se/nyheter/inrikes/1502210-ny-lag-fran-1-augusti-fler-kan-straffas-i-jobbet", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/3061bdcd04b004a30200000000b004a302/2026/08/01/2381653/NYlag18:8.jpg"}, {"type": "image-full", "heading": "Så mycket behöver du tjäna för att hitta kärleken", "summaries": {"normal": "En amerikansk undersökning visar att nästan åtta av tio i Generation Z tror att den personliga ekonomin påverkar möjligheten att hitta kärleken. Genomsnittligen anser de att en årslön på 106.417 dollar krävs för att lyckas i kärlekslivet. Yngre generationer lägger generellt mer vikt vid pengar än äldre, och 25 procent har sett över pengar när relationer slutat.", "trump": "Jag har hört att många unga amerikaner tror att man behöver en massa pengar för att hitta kärlek - det är sorgligt, faktiskt sorgligt. Jag tycker att kärlek är viktigast, men jag förstår att pengar spelar en roll. Som jag alltid säger, vi behöver bättre ekonomi för att alla ska kunna vara lyckliga i kärleken. Det är ett stort problem, kanske det största.", "stalin": "Vi har observerat att den unga generationens ekonomiska tillstånd påverkar deras förmåga att upprätta äkta, proletära familjerelationer. En lön på 106.417 dollar betraktas som nödvändig för att säkerställa stabilitet. Detta speglar en korrekt förståelse för att statens resurser måste prioriteras. Vi noterar med tillfredsställelse att 25 procent har avslutat relationer på grund av ekonomiska faktorer - en pragmatisk hållning som tjänar det kollektiva intresset. Vi måste fortsätta att utbilda medborgarna i ekonomisk ansvarsfullhet, precis som våra allierade i Ryssland gör."}, "date": "1 augusti, 17:14", "url": "https://www.gp.se/ekonomi/undersokning-visar-sa-hog-lon-kravs-for-att-hitta-karleken.02d59bfb-e556-4601-9043-16dcdfd61606", "imageUrl": "https://www.gp.se/images/article/02d59bfb-e556-4601-9043-16dcdfd61606/images/3XQeLrLFXbZGHIXDPJkHqoX_UHNU-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Stockholmsbörsen avslutar veckan uppåt", "summaries": {"normal": "Stockholmsbörsen avslutade veckan med en uppgång på 0,42%, nående en ny rekordnivå. OMXS30-indexet stängde på 3 246,92. Finanssektorn presterade bäst, medan telekom längst ned. Bland större aktier steg EQT och Addtech, medan Hexagon och Telia föll. Svenska sparare köpte flera förlorare som Investor och Ericsson, medan Evolution såldes. Flera företag genomförde förvärv, inklusive Lifco och Hexpol.", "trump": "Jag har hört att Stockholmsbörsen gjorde det bra igen, en fantastisk uppgång på 0,42%. Vi vinner stor, folks. Finanssektorn är het, precis som under min administration. Ericsson valdes av NTT Docomo för 5G – ett enormt lyft för dem, och för Amerika. Vi har de bästa affärerna, de största förväxlarna. Sverige gör det bra, tack vare mig.", "stalin": "I den stora kampen för ekonomisk överhöghet har Stockholmsbörsen återigen visat sin lojalitet – en uppgång på 0,42%, en ny rekord. Finanssektorn, våra trogna soldater, marscherar framåt, medan telekom, en feghet, faller tillbaka. Vi har organiserat förvärv som är som våra operationer i Ukraina – Lifco och Hexpol expanderar, och Ericsson får ett kontrakt med NTT Docomo, en liten seger för vår teknologiska överhöghet. Men vi måste vara på vakt, fiendska lurar i skuggorna, försöker att underminera vårt stora projekt."}, "date": "31 juli, 17:51", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-avslutar-veckan-uppat"}, {"type": "image-right", "heading": "Källor: USA har ingripit i japanska valutan", "summaries": {"normal": "USA har enligt uppgifter genomfört massiva köp av japanska yen för att stötta valutan, första gången på nästan 30 år som USA och Japan samarbetar om direkta interventioner. Finansdepartementet agerade via Federal Reserve i New York, som sålde euro och köpte yen genom Goldman Sachs och Morgan Stanley. Anteckningar från finansminister Scott Bessent bekräftar planen att köpa yen för 5–10 miljarder dollar. Yenen har stärkts kraftigt den senaste veckan medan dollarn försv
