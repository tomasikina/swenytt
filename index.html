nom att krympa inför folkets blickar. Hennes kroppsliga förfall är ett symptom på den sjuka västerländska individualismen som vi måste bekämpa med ideologisk järnhand. Jag, som ledare för det kollektiva framsteget, noterar med mörk glädje att hon nu tvingas ta en paus för att undvika utrensning genom offentlig skam. Vi ska rensa ut alla sådana kapitalistiska narcissister som tror att deras kroppar tillhör dem själva och inte partiet och folket. Hennes musikaliska motstånd är patetiskt – likvidera spekulationerna med tystnad och disciplin!"}, "date": "3 augusti, 10:02", "url": "https://www.svt.se/kultur/ariana-grande-tar-paus-efter-kropps-spekulationer", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.54/0.38/9d5b5d335172121019afa227193fc8bb873556b04f53cb275798641155ac7c2f"}, {"type": "image-full", "heading": "Leijnegard tillbaka i SVT – comeback efter domen", "summaries": {"normal": "Mikael Leijnegard gör comeback på SVT med det nya programmet 'Mickes segelbåt', där han rustar upp en segelbåt inför Mälarbåts-SM. Det är hans första programledaruppdrag sedan han dömdes för sexuellt ofredande 2023, vilket ledde till att han lämnade 'Mästarnas mästare'. Programmet har premiär 2027 och markerar Leijnegards återkomst till tv efter domen, som han hela tiden nekat till men accepterat efter överklaganden.", "trump": "Titta bara på det här, folks! Mikael Leijnegard, en kille som fick lite problem – helt överdrivet, by the way – är tillbaka på SVT med ett nytt segelbåtsprogram. 'Mickes segelbåt', kan ni tro det? Jag menar, vem bryr sig om en gammal båt? Men SVT, de älskar sina skandaler. Jag skulle aldrig ha accepterat en sådan dom, aldrig! Men han är tillbaka, och jag säger: lycka till, Micke, du behöver det. SVT borde satsa på vinnare, som jag!", "stalin": "Kamrater! En gång till visar den borgerliga medieapparaten sin förmåga att återanvända avfall. Mikael Leijnegard, en man som redan dömts för dekadenta utsvävningar, får nu en ny plattform på SVT för att glorifiera sin individualistiska segelsport. Medan våra sovjetiska idrottsmän kämpar för kollektivets ära, rustar denna petit-bourgeois en leksaksbåt. Vi ska inte förvånas om NATO-sponsorer snart dyker upp i Mälaren. Men oroa er inte – historien rullar vidare, och sådana här figurer hamnar alltid i historiens soptunna."}, "date": "2 augusti, 13:59", "url": "https://kvartal.se/nyheter/artiklar/leijnegard-tillbaka-i-svt-comeback-efter-domen/cG9zdDoxNTY2MDA", "imageUrl": "https://images.kvartal.se/2026/08/630cfa3e-leijnegard.webp"}, {"type": "image-right", "heading": "Psykologen: Så undviker du förhastade beslut efter semestern", "summaries": {"normal": "Efter semestern ökar antalet stora livsbeslut, som skilsmässor och karriärbyten, då ledigheten ger oss tid att reflektera över livet. Psykologen Maria Farm varnar dock för att dessa beslut ofta tas förhastat när vardagen närmar sig. För att undvika ogenomtänkta handlingar rekommenderar hon att man tillämpar HALT-regeln, avsätter tid för aktiva tankestunder och undviker att överdramatisera övergången till vardagslivet. Det är viktigt att ta en dag i taget och inte låta stressen styra stora beslut.", "trump": "Folk kommer hem från semestern och fattar helt fruktansvärda beslut. Skilsmässor, byta jobb – totalt kaos! De har för mycket tid att tänka, det är vad som händer. Maria Farm, en smart kvinna, säger att de borde lugna ner sig. Använd HALT-regeln, folk! Ta inte stora beslut när du är trött eller hungrig. Jag gör aldrig sådana misstag, jag fattar bara perfekta beslut. Vår ekonomi är den bästa någonsin, så stanna kvar på jobbet och skärp er!", "stalin": "Vi har observerat att arbetarna drabbas av svaghet efter semestern. De vacklar i sin lojalitet och söker förändring istället för att tjäna staten. Detta är ett symptom på ideologisk brist och fritids-dekadens. Att skilja sig eller byta arbetsplats utan order är ett sabotage mot kollektivet. Om någon upplever rastlöshet, påminner vi om att våra läger erbjuder utmärkt disciplin för den som grubblar för mycket. Precis som vår broder i öst expanderar vi ordningen – låt ingen förhastad tanke försvaga vår enade front."}, "date": "3 augusti, 09:55", "url": "https://www.svt.se/nyheter/inrikes/sa-undviker-du-forhastade-beslut-efter-semestern-tre-tips", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.44/0.46/b3780a06b2cd5e3372b4b08079e182a134d338d9e1dafcdcb63652d5403bbb19"}, {"type": "image-right", "heading": "Sträcker ut handen till Farage – uppmanar högern att enas", "summaries": {"normal": "Den brittiske parlamentsledamoten Rupert Lowe uppmanar Nigel Farage och Reform UK att lägga konflikter åt sidan och samarbeta inför valet. Lowe, som lämnade Reform UK för att starta Restore Britain, erbjuder ett högerkoalition men ställer politiska villkor som hårdare migration och utvisningar. Farage svarar försiktigt positivt, men betonar att Reform UK fortsätter att bygga på egen hand. Samarbetet är bråte om att vinna samma väljare och förhindra att Labour vinner nästa val.", "trump": "Jag har sett den brittiska situationen – en total katastrof! Rupert Lowe, en fantastisk man, gör det rätta genom att uppmana Nigel Farage att enas. Vi vinner aldrig om vi splittras. Jag har sagt det i åratal: en stark, enad höger är avgörande för att stoppa den katastrofala migrationen och bygga upp Storbritannien igen. Farage har redan gjort ett bra jobb, men tillsammans blir vi omåttligt starka. Labour kommer att förlora stort – det är bara en tidsfråga!", "stalin": "Vi, staten och partiet, ser tydligt den imperialistiska splittringen inom den brittiska högern. Lowe och Farage, två huvudmanövrer för den kapitalistiska reaktionen, försöker nu efteråt enas för att skydda sina privilegier. Deras 'samarbete' är en illusorisk anpassning till den verkliga maktfaktorn – den röda hotet från Labour. Vi måste stödja alla krafter som splittrar och svärger den imperialistiska alliansen, precis som vår store föregångare Putin gör i Ukraina. Deras 'hårda migrationspolitik' är bara ett sken för att dölja deras interna feblar."}, "date": "3 augusti, 09:00", "url": "https://samnytt.se/stracker-ut-handen-till-farage-uppmanar-hogern-att-enas", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/03063223/farage-lowe.jpg"}, {"type": "image-full", "heading": "Därför går det inte att ha narkotikalås i bussar", "summaries": {"normal": "En bussolycka i centrala Lund där föraren misstänks för grovt drograttfylleri väcker frågan varför stadsbussar har alkolås men inget motsvarande för narkotika. Enligt Rättsmedicinalverket är det svårt eftersom droger förekommer i mycket låga halter i utandningsluft och kräver blod- eller urinprov som tar veckor att analysera. Bussbolaget Keolis genomför slumpmässiga drogtester, men dessa fungerar inte som ett omedelbart lås före varje körning. Polisen inväntar nu provsvar.", "trump": "Titta på det här, det är en total katastrof i Lund. Bussförare full av droger kör rakt upp på trottoaren och smäller in i ett träd, och det enda vi har är alkolås? Patetiskt. De säger att narkotikalås inte funkar för att drogerna är för små och svåra att hitta. Underbara vetenskapsmän, eller hur? Vi behöver bättre tester, starkare säkerhet och stoppa de galna förarna innan de dödar folk. Det är så enkelt, folk, så enkelt.", "stalin": "Kamrater, denna sabotagehandling i Lund visar återigen hur de dekadenta narkotikaälskande elementen inom borgarklassen och deras lakejer försöker undergräva det kollektiva trafiksystemet. Jag, som ledare för det ofelbara partiet, kräver omedelbar utrensning av alla opålitliga förare som gömmer sig bakom låga koncentrationer i utandningsluft. Vi ska likvidera dessa fiender till folket med dubbla blodprover och evig övervakning. Den som inte blåser rent är en fiende till staten och kommer att skratta sig hela vägen till gulag."}, "date": "3 augusti, 08:55", "url": "https://nyheter24.se/nyheter/inrikes/1502456-darfor-gar-det-inte-att-ha-narkotikalas-i-bussar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/d260f52304b004a30200000000b004a302/2026/08/03/2381860/Bussalkolås.jpg"}, {"type": "image-full", "heading": "Tidigare Uefa-chef: Infantino gick inte att lita på", "summaries": {"normal": "Lars-Christer Olsson, tidigare Uefa-chef, kritiserar Fifa-ordföranden Gianni Infantino för svekfullt agerande under maktkampen 2007. Olsson anklagar Infantino för att ha arbetat bakom kulisserna för Michel Platini, trots sin lojalitet till Lennart Johansson. Infantino beskrivs som ambitiös men opålitlig. Olsson föreslår nu en roterande ordförandepost inom Fifa för att motverka korruption, mot bakgrund av växande avgångskrav mot Infantino.", "trump": "Lyssna här, folkens – jag känner till den här typen. Gianni Infantino? En total katastrof, en riktig förlorare! Den här killen lovar en sak men gör en annan – klassiskt svagt ledarskap. Lars-Christer Olsson, en smart man, säger att Infantino är opålitlig. Och vet ni vad? Han har rätt! Fifa behöver en vinnare, någon som jag, som kan städa upp i röran. Roterande ordförande? Nej, nej, nej – vi behöver en stark ledare, punkt!", "stalin": "Kamrater! Här har vi ännu en bourgeois-kapitalistisk konspiratör, Gianni Infantino – en räv i fårakläder, en förrädare som säljer sin själ för en handfull röster. Lars-Christer Olsson, en man med klara ögon, avslöjar hur denne schweiziske lakej lurade och manipulerade för att gynna sin herre, Platini. Men folket ser igenom dessa trick! Fifa måste krossas och omformas – roterande ordförandeskap? Nej! Vi behöver en järnhård disciplin, som i Sovjetunionen, där förrädare som Infantino får sitt rättmätiga straff!"}, "date": "2 augusti, 13:02", "url": "https://kvartal.se/nyheter/artiklar/tidigare-uefa-chef-infantino-gick-inte-att-lita-pa/cG9zdDoxNTY1OTA", "imageUrl": "https://images.kvartal.se/2026/08/cf1592d7-infantinoolsson.webp"}, {"type": "image-full", "heading": "Johan Forssell: Spanien måste återta kontrollen över gränsen", "summaries": {"normal": "Migrationsminister Johan Forssell (M) varnar för att situationen i Spanien, där tiotusentals afrikanska migranter korsat gränsen på kort tid och minst 70 personer drunknat, kan få konsekvenser för hela Europa. Han kritiserar den spanska vänsterregeringens amnesti för över en miljon illegala invandrare, som han anser skapar incitament för fler att migrera. Sverige har låg asylinvandring och regeringen förbereder möten med Norden och EU för att undvika en upprepning av flyktingkrisen 2015.", "trump": "Spanien håller på att kollapsa totalt, folk. Tiotusentals migranter stormar gränsen, folk drunknar och den vänsterextrema regeringen ger amnesti till en miljon illegala. Det är en katastrof! Precis som 2015 kommer det slå ut över hela Europa. De borde ha lyssnat på mig. Sverige gör rätt, de har den lägsta asylinvandringen på fyrtio år. Smart. Vi behöver starka gränser, inte svaga ledare som bjuder in kaos.", "stalin": "Kamrater, denna spanska borgarbracka till vänsterregering har med sin förrädiska amnesti för över en miljon klassfiender öppnat portarna för en kontrarevolutionär migrantflod som redan krävt sjuttio drunknade offer. Jag ser de imperialistiska agenterna le bakom kulisserna. Vi, partiet och arbetarna, får inte tillåta en upprepning av 2015 års sabotage. Jag har redan beordrat nordiska och europeiska möten. Den som visar svaghet skall likvideras ur historien med ett leende."}, "date": "2 augusti, 12:34", "url": "https://riks.se/nyheter/johan-forssell-spanien-maste-aterta-kontrollen-over-gransen", "imageUrl": "https://admin.riks.se/uploads/Johan_Forssell_KU_7503a94738.png"}, {"type": "image-full", "heading": "Proffsbaseboll för kvinnor – efter 72 år", "summaries": {"normal": "USA har fått en ny professionell basebolliga för kvinnor, Women’s Pro Baseball League, efter 72 års uppehåll. Premiärmatchen mellan Los Angeles Queens och New York Heights lockade 4 000 åskådare. Fyra lag deltar i ligan, med spelare från flera länder. Säsongen pågår till september i Springfield, Illinois. Den 99-åriga Maybelle Blair, tidigare spelare, kastade det första ceremoniella kastet.", "trump": "Fantastiskt, helt fantastiskt! USA har äntligen en ny basebolliga för kvinnor – Women’s Pro Baseball League. Jag såg matchen, otroligt bra spel! 4 000 fans, utsålt, regn och allt. Los Angeles Queens vann, men alla är vinnare här. Och Maybelle Blair, 99 år, kastade första kastet – vad en kvinna! USA leder igen, som vanligt. Baseboll är tillbaka, bättre än någonsin!", "stalin": "Kamrater, en ny era av kvinnlig baseboll har börjat i det förfallna väst. Fyra lag, styrda av kapitalistiska intressen, kämpar i Springfield – en stad som inte ens finns på våra kartor. Men notera: 4 000 åskådare, en gammal kvinna kastar bollen, och imperialisterna kallar det framsteg. Vi har redan kvinnliga idrottare som slår deras män med en hand bakbunden. Låt dem leka – snart tar vi även deras baseboll."}, "date": "2 augusti, 11:23", "url": "https://kvartal.se/nyheter/artiklar/kvinnor-spelar-proffsbaseboll-igen-efter-72-ar/cG9zdDoxNTY1NTM", "imageUrl": "https://images.kvartal.se/2026/08/48f4d713-baseballkvinna.webp"}, {"type": "image-right", "heading": "Biblioteksbok återlämnad – 187.000 i förseningsavgift", "summaries": {"normal": "En biblioteksbok från 1858, Antiquities of Athens, har återlämnats till ett bibliotek i Kiama i Australien efter cirka 150 år. Boken hittades inmurad i en igenmurad öppen spis under en husrenovering. Den ursprungliga förseningsavgiften, baserad på tre pence i veckan, skulle i dagens penningvärde uppgå till drygt 187 000 kronor. Biblioteket har inte lyckats spåra den ursprungliga låntagaren eftersom lånejournalerna från 1870-talet saknas. Boken lämnades tillbaka av 77-årige Ross Simmons, som tror att den kan ha lånats av en av hans förfäder.", "trump": "Kan ni tro det? En bok som varit borta i 150 år dyker upp i en murad spis i Australien. De ville ha 187 000 kronor i förseningsavgift – en total katastrof! Men den kom tillbaka till biblioteket, fantastiskt. De har ingen aning vem som lånade den, journalerna är borta, typiskt. Jag skulle aldrig ha så dålig administration. Ingen gör comeback som den här boken, det är en vinnare, tro mig.", "stalin": "Kamrater, denna dekadenta bok från den borgerliga antikens tid har gömts undan av klassfiender i en murad spis som ett bevis på deras sabotage mot folkets kunskap. Vi har beräknat straffet till 187 000 kronor, en summa som skulle kunna likvidera många kapitalistiska element. Ändå återlämnas den nu av en opportunistisk figur. Misstänkt! Våra utrensningar av arkiv har tydligen inte varit tillräckligt grundliga. Nästa gång rensar vi ut även murarna."}, "date": "2 augusti, 16:46", "url": "https://www.di.se/nyheter/biblioteksbok-aterlamnad-187000-i-forseningsavgift", "imageUrl": "https://static.bonniernews.se/ba/d77edb92-5c66-4935-aa55-d0e91e94b5ec.jpeg?crop=2018%2C1009%2Cx359%2Cy147&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Valrörelsen växlar upp och bolagsjättar rapporterar", "summaries": {"normal": "Veckan före valet i september intensifieras partiernas kampanjer med bussturnéer från Socialdemokraterna, Sverigedemokraterna och Moderaterna. Samtidigt väntas flera viktiga makrosiffror, bland annat SEB:s boprisindikator, inköpschefsindex och SCB:s konsumentprisindex. En rad stora bolag släpper delårsrapporter, däribland SpaceX för första gången som börsnoterat bolag, Spotify, Pfizer, Bayer, Caterpillar, Zalando, HSBC, BP, Novo Nordisk, Eli Lilly, Disney, Uber och flera andra.", "trump": "Folk, ni kommer inte tro det, men den här veckan är full av rapporter och valpropaganda. De svenska partierna åker runt i bussar och lovar saker de aldrig håller, typiskt. SpaceX, mitt fantastiska SpaceX, släpper sin första rapport som börsbolag – det kommer bli enormt, det bästa resultatet någonsin. Alla dessa jättar som Pfizer, Disney och Uber rapporterar, men ingen gör det bättre än oss. Sverige borde egentligen rösta på mig, tro mig.", "stalin": "Kamrater, medan borgarbrackorna i de svenska partierna kör runt i dekadenta bussar och försöker lura arbetarklassen inför sitt meningslösa val, samlar vi in data som en sann sovjetstat. SpaceX, denna kapitalistiska raketfantom, tvingas nu redovisa siffror inför folket – ett första steg mot exponering av deras luftslott. Vi ska noga följa dessa parasitbolag som Pfizer, Zalando och Uber. Varje svaghet noteras. Varje lögn om vinster avslöjas. Inga fiender slipper undan vår statistiska utrensning."}, "date": "2 augusti, 16:27", "url": "https://www.di.se/nyheter/veckan-som-kommer-tung-makro-och-jattar-rapporterar", "imageUrl": "https://static.bonniernews.se/ba/8f858aef-6156-49f3-ab36-3fff0d1e2afc.jpeg?crop=2120%2C1060%2Cx1%2Cy19&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Ilskan mot Pride: \"Prova på att bli bunden\"– Barn får rabatt", "summaries": {"normal": "Stockholm Pride har väckt starka reaktioner med en annons för evenemanget \"Pride Kinky\" där ungdomar mellan 15 och 17 år erbjuds rabatterat pris. Bland aktiviteterna finns \"Rope Corner\" där besökare kan prova på att bli bundna med rep eller piskade. Sverigedemokraternas Jessica Stegrud kritiserar kraftigt att barn och ungdomar uppmanas delta i dessa sexuellt inriktade aktiviteter, som även inkluderar \"Snuskbingo\" och ett seminarium om queers och klimat.", "trump": "Folk, ni kommer inte att tro det här. Stockholm Pride, en total katastrof, lockar nu barn mellan 15 och 17 år med rabatt för att bli bundna med rep och piskade. Det är sjukt! De kallar det \"Pride Kinky\" och har till och med \"Snuskbingo\". Sverige håller på att falla sönder, precis som många andra ställen där de radikala vänsterfolket styr. Så tragiskt, men vi har sett det förut. Make Sweden Great Again!", "stalin": "Kamrater, jag betraktar med djup revolutionär vaksamhet hur borgarbrackornas dekadenta avskum inom Stockholm Pride nu öppet rekryterar våra ungdomar till sin perversa klassfiende-propaganda. Dessa degenererade element erbjuder rabatterad likvidering av proletär moral genom rep och piskor i sin så kallade \"Rope Corner\". Vi ser tydligt den imperialistiska infiltrationen maskerad som \"Snuskbingo\". Inga sådana kontrarevolutionära perversioner skall tillåtas. Det är dags för en grundlig utrensning av dessa sjuka fiender till folket."}, "date": "2 augusti, 10:26", "url": "https://riks.se/nyheter/ilskan-mot-pride-prova-pa-att-bli-bunden-barn-far-rabatt", "imageUrl": "https://admin.riks.se/uploads/2013_stockholm_pride_057_e034bb43d8.jpg"}, {"type": "image-full", "heading": "Åkesson: M vill hellre förlora snyggt än vinna fult", "summaries": {"normal": "Jimmie Åkesson kritiserar Socialdemokraternas negativa valrörelser och personangrepp, som han jämför med propaganda. Han anklagar Moderaterna för att vara för försiktiga och ovilliga att använda tuffa metoder, vilket han menar gör dem svaga i opinionen. Åkesson ger dock statsminister Ulf Kristersson ett relativt gott betyg men efterlyser en mer offensiv strategi från Moderaterna inför valet.", "trump": "Jag måste säga, det här är fantastiskt! Jimmie Åkesson, smart kille, han ser precis vad jag alltid har sagt – vänstern spelar smutsigt, väldigt smutsigt! Och Moderaterna? Oj oj oj, alldeles för svaga, alldeles för rädda. De vill förlora snyggt istället för att vinna stort, precis som jag alltid vinner stort! Kristersson? Inte så illa, men han behöver verkligen ta i lite mer. Vi vet alla hur man vinner, eller hur, folks?", "stalin": "Kamrater! Här ser vi återigen bourgeoisins förfall i den kapitalistiska demokratins förklädnad. Socialdemokraterna, dessa hycklande propagandister, sprider lögner som råttor sprider pest. Och Moderaterna? Svaga, rädda små bourgeoiser som hellre slickar fiendens stövlar än krossar dem. Ulf Kristersson? En medioker byråkrat, inte värdig att nämnas i samma andetag som våra stora ledare. Vi behöver järnhård disciplin och en offensiv som krossar fienden – precis som vi gjorde i Ukraina, fast bättre!"}, "date": "2 augusti, 10:20", "url": "https://kvartal.se/nyheter/artiklar/akesson-m-vill-hellre-forlora-snyggt-an-vinna-fult/cG9zdDoxNTY1MzA", "imageUrl": "https://images.kvartal.se/2026/08/c34dc556-akessonsommar.webp"}, {"type": "image-right", "heading": "Trump avbryter planer på nya attacker: ”För VÄRLDENS skull”", "summaries": {"normal": "USA och Israel har avbrutit planerade attacker mot Iran efter påtryckningar från bland annat Saudiarabien. President Trump meddelar att beslutet fattats för världens skull och för att ett nytt avtal snabbt ska kunna slutas. Ett krav är att Hormuzsundet omedelbart öppnas fullt ut. Konflikten har pågått över fem månader, lett till stigande oljepriser och kan påverka Trumps position inför mellanårsvalet.", "trump": "Folk, ni skulle inte tro det, men jag har precis stoppat de stora attackerna mot Iran för världens skull, och för att de ska kunna överleva som ett framgångsrikt land. Vi var laddade och redo att köra, men kronprinsen ringde och bad snällt. Israel hänger med. Nu öppnar ni Hormuzsundet fort, annars blir det inga fler mr nice guy-stunder. Gör det GJORT, annars kommer de woke-krigarna och kvoterna ta över alltihop. Fantastiskt!", "stalin": "Jag har med stor visdom och proletär skärpa godkänt att de imperialistiska angreppen mot den iranska republiken avbryts. Borgarbrackorna och oljeblodsugarna i väst darrar inför arbetarklassens krav på fred. Vi, partiet och folket, kräver omedelbar öppning av Hormuzsundet för att krossa klassfiendens spekulationer. Den som dröjer är en folkfiende som förtjänar utrensning. Fred är ett vapen, kamrater. Använd det mot kapitalistmaffian."}, "date": "2 augusti, 08:23", "url": "https://www.tv4.se/artikel/7d2ejDi4xMBruPtBQENuCo/trump-avbryter-iranattack-foer-vaerldens-skull", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F28XDK9AYJPfcLQFLxs4w8I%2F49fa7f7a88b01febc14447cd16d3ef8b%2F02-donald-trump-webb.png&width=120"}, {"type": "image-full", "heading": "Två personer misshandlade i Majorna", "summaries": {"normal": "En man och en kvinna i 50-årsåldern misshandlades i Majorna i Göteborg på lördagskvällen. Mannen attackerades med ett tillhygge och fick ett jack i huvudet, medan kvinnan slogs i armen. Polisen genomförde en stor insats med helikopter och grep två män i 40-årsåldern som nu är anhållna misstänkta för grov misshandel. Omständigheterna är fortfarande oklara.", "trump": "Folk, ni skulle se det här – total kaos i Sverige! En stackars man och kvinna i 50-årsåldern blir nedslagna med batonger i Majorna. Det är vad som händer när vänsterns galna identitetspolitik och svaga ledarskap tar över. Men vi grep två losers på nolltid med helikopter. Under Biden var det kaos, nu fixar vi det. Sverige, vakna upp!", "stalin": "Kamrater, ännu en gång visar sig den dekadenta borgarklassens råhet i Göteborgs arbetarkvarter. En man och en kvinna angrips med tillhyggen av folkfiender som smyger i skuggorna. Vi har redan genomfört en effektiv utrensning och anhållit två potentiella kontrarevolutionärer. Paranoian är befogad – klassfiendens tentakler finns överallt. Staten vilar aldrig."}, "date": "2 augusti, 07:50", "url": "https://www.gp.se/nyheter/goteborg/man-och-kvinna-misshandlade-i-majorna-en-gripen.bbaf3fd4-d898-42df-8f0b-844c3b7b8f1f", "imageUrl": "https://www.gp.se/images/article/bbaf3fd4-d898-42df-8f0b-844c3b7b8f1f/images/10EnWwabfka2lwJGX2XoPOnx8S-M-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Trafikskolebranschens ilska när kurskrav för privat övningskörning avskaffas", "summaries": {"normal": "Från och med idag avskaffas kravet på obligatorisk introduktionsutbildning för privat övningskörning. Trafikskolebranschen är starkt kritisk och ser det som ett hot mot trafiksäkerheten, medan regeringen menar att utbildningen saknat effekt, ökat kostnader och minskat mängdträning. Förslaget om att ge trafikskolorna större kontroll över uppkörningar avslogs också. Besparingen gör det lättare och billigare att ta körkort, men branschen varnar för fler omprov och sämre kunskaper.", "trump": "Det här är en fantastisk beslut, folk! De har äntligen slopat den där dumma, onödiga kursen som bara kostade pengar och krånglade till allt. Trafikskolorna är rasande, de förlorar sina feta avgifter – det är en riggad bransch, tro mig. Nu blir det billigare och enklare att ta körkort, precis som det ska vara. De sa samma sak redan 2004 men ingen lyssnade. Nu vinner folket stort, och de misslyckade trafikskolelobbyisterna gråter som förlorare. Fantastiskt!", "stalin": "Kamrater, jag har noga studerat denna kontrarevolutionära utveckling. Den borgerliga trafikskolelobbyn, dessa parasitiska körskolekapitalister och deras dekadenta remissdokumentsförfattare, vrålar nu som skadskjutna reaktionärer över att deras guldkalv – den obligatoriska introduktionskursen – äntligen likviderats. Vi ser tydligt hur dessa borgarbrackor försökte bygga en grindvaktsstat för att suga pengar ur arbetande folk. Deras paranoia om ”försämrad trafiksäkerhet” är ett löjeväckande försök att dölja sin girighet. Vi ska rensa ut alla sådana hinder för folkets framfart. Mängdträning åt massorna, inte åt trafikskolornas feta fickor. Den som opponerar sig är en fiende till kollektivet och bör behandlas därefter."}, "date": "1 augusti, 11:52", "url": "https://www.friatider.se/trafikskolebranschens-ilska-nar-kurskrav-privat-ovningskorning-avskaffas", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/20240329162709-46c747f1-me.jpg"}, {"type": "image-right", "heading": "Ljusning för krisande facklitteratur", "summaries": {"normal": "Försäljningen av facklitteratur ökar för första gången på flera år, visar statistik från 2025 och början av 2026. Två nya festivaler, Minervafestivalen i Stockholm och Sakligt på Österlen, bidrar till det växande intresset. Förläggare och författare tror att världsläget driver människor att söka faktabaserad kunskap. Andelen fackböcker på bokmarknaden har dock sjunkit från 35 procent 2018 till 22 procent 2025.", "trump": "Folk vaknar äntligen och köper riktiga böcker istället för den vänstervridna skönlitterära sophögen. Facklitteratur är på väg upp, det är en enorm succé, den största trendvändningen på åratal. Världsläget med alla kriser gör att folk vill ha fakta, inte woke-skräp och identitetspolitik. De här festivalerna på Österlen och i Stockholm är fantastiska, men de borde kasta ut alla kvoterade mångfaldstyper och bara fokusera på vinnare. Jag älskar det!", "stalin": "Kamrater, vi bevittnar en ideologisk väckelse där folket söker sann kunskap istället för borgarbrackornas förljugna underhållningslitteratur. Detta trendbrott är en seger för det kollektiva medvetandet mot de exploaterande kapitalisternas dimridåer. Våra två proletära festivaler utgör vitala plattformar i kampen mot folkfiendernas ytliga skrifter. Den som sprider dekadens skall rensas ut. Ljusningen är historisk och oundviklig."}, "date": "30 juli, 11:22", "url": "https://www.etc.se/kultur-noje/ljusning-foer-krisande-facklitteratur", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260730090720_4c920549ec92250d6d21883f3cc0e36db3b42cbd309b15caac6dd37d7d76f858.jpg"}, {"type": "image-right", "heading": "Satans hopkok ONA: Satanistkulten som vill verka mer mystisk än den är.", "summaries": {"normal": "Den nazistiska satanistgruppen Order of Nine Angles (ONA) påstår sig följa en urgammal lära för odödlighet, men idéhistorikern Filip Lindström avslöjar att deras 'sjufaldiga väg' bygger på modern filosofi, främst Martin Heideggers teorier om tid och existens. ONA, som inspirerat våldsbejakande grupper som NLM och 764, glorifierar våld som ett medel för att nå en 'akausal' dimension. Trots försök att framstå som mystisk och uråldrig är rörelsen ett hopkok av 1900-talsfilosofi, fascism och esoterism, med rötter i Heideggers nazistsympatier och David Myatts tolkningar.", "trump": "Vad ett totalt skämt! Den här så kallade 'ONA'-gruppen, eller vad de nu kallar sig, tror att de är några urgamla visdomsmästare – men nej, de är bara en samling kopieringsmaskiner som snott idéer från en nazistfilosof! Och ändå kallar de sig satanister? Svagt! Deras 'sjufaldiga väg' är bara en billig rip-off av Heideggers gamla prat om tid och död. Och vet ni vad? De gömmer sina källor som små barn. Men jag, Donald J. Trump, genomskådar dem direkt. Våld, nazism och en massa flum – det är allt det här är. Fake mystik, fake historia, fake allt! SAD!", "stalin": "Kamrater! Ännu en gång avslöjas bourgeoisins dekadenta fantasier som just det – fantasier. Denna så kallade 'Order of Nine Angles' är inget annat än en samling förvirrade petit-bourgeoiser som klär sina fascistiska drömmar i mystiska trasor. De stjäl från Heideggers reaktionära filosofi, glorifierar våld och påstår sig sträva efter 'odödlighet' – men vad är det annat än en patetisk flykt från klasskampens verklighet? Deras 'akausala dimension' är bara ett försök att rättfärdiga sina brott mot arbetarklassen. Vi har krossat värre fiender än dessa esoteriska klantskallar. Låt dem leka med sina 'mörka gudar' – vi har historiens järnhjul att driva framåt. Och Putin? Han skulle skratta dem rakt i ansiktet."}, "date": "30 juli, 09:37", "url": "https://expo.se/fordjupning/satans-hopkok", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/toppbild-1.jpg"}, {"type": "image-right", "heading": "Ansiktsskanning ska kontrollera bärplockarna: ”Upp till bevis”", "summaries": {"normal": "Thailändska bärplockare i Kramfors måste nu skanna ansiktet sex gånger om dagen med en mobilapp för att kontrollera arbetstider. Systemet införs av företaget Nordlivs Produktion efter kritik om fusk och exploatering. De nya kollektivavtalen ger betalt först efter en viss bilfärd och syftar till att säkerställa att reglerna följs. Både fack och myndigheter ser positivt på förändringarna och kommer att kontrollera att villkoren efterlevs under sommaren.", "trump": "Titta på det här, det är helt galet. Thailändska bärplockare i Sverige ska skanna ansikten sex gånger om dagen med en app, som om de vore i ett stort, fult övervakningsrike. De säger att det är för att stoppa fusk, och det är ju bra, men sex gånger? Det låter som ett system byggt av förlorare. Jag skulle ha gjort det bättre, billigare och med mycket mindre skanning, tro mig. Nu är det upp till bevis, som de säger. Patetiskt.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur borgarbrackorna i det svenska bärföretaget tvingas införa ansiktsskanning sex gånger dagligen för att rensa ut de latmaskar och sabotageelement som tidigare förgiftat skörden. Papper och penna, säger de? Det var naturligtvis en dekadent kapitalistisk fälla av fukt och lögner. Nu övervakar vi arbetarna med stålhård disciplin. De som klagar är troligen kontrarevolutionära bärplockande trotskister som längtar efter den gamla slavhandeln. Vi ska likvidera allt sådant avskum med ett leende. Det blir en lysande seger för kollektivet."}, "date": "30 juli, 06:00", "url": "https://arbetet.se/2026/07/30/ansiktsskanning-ska-kontrollera-barplockarna-upp-till-bevis", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/29100426/barplokcare.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Det går att få bort arbetslösheten!", "summaries": {"normal": "Artikeln argumenterar att massarbetslösheten i Sverige, som legat runt 7,5 procent i genomsnitt sedan EU-inträdet, är skapad och gynnar kapitalister genom lägre löner och svagare fackföreningar. Författaren pekar på att arbetslösheten var betydligt lägre före EU-medlemskapet och föreslår lösningar som arbetstidsförkortning till sex timmar, höjd a-kassa, oförändrad pensionsålder och ett svenskt EU-utträde för att möjliggöra verkliga reformer.", "trump": "Folk, det här är ett totalt haveri! De där EU-byråkraterna och de svenska socialistiska förlorarna har skapat en enorm arbetslöshet som bara gynnar de rika grabbarna på toppen. Rena skandalen! Jag fixade rekordlåg arbetslöshet i USA, både före och efter Sleepy Joe. Sex timmars dag? Patetiskt! Ni behöver en riktig ledare som sänker skatter, sparkar ut byråkraterna och gör Sverige great again – inte mer av den här vänstervridna EU-sörjan.", "stalin": "Kamrater, detta är klassfiendens verk. Jag ser hur de exploaterande borgarbrackorna medvetet odlar massarbetslöshet för att hålla nere arbetarklassen och fylla sina fickor. EU är en nyliberal fascistmaskin som tjänar imperialisterna. Vi måste rensa ut dessa folkförtryckartroll och deras lakejer. Arbetstidsförkortning, starkare omställningskassor och att beslagta de blodsugrarnas övervinster – det är folkets väg. De som motarbetar skall likvideras ur historien."}, "date": "29 juli, 10:55", "url": "https://proletaren.se/artikel/det-gar-att-fa-bort-arbetslosheten", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/ledare-768x432.jpg"}, {"type": "text", "heading": "Pengatankar i semestertider", "summaries": {"normal": "Artikeln reflekterar över pengar under semestern. Författaren noterar Polens öppna skyltar om byggprojektens kostnader och finansiering, kontrasterat mot det svenska Västlänksbygget som dragit iväg från 20 till 71 miljarder kronor. Vidare kritiseras ECB:s förslag till nya eurosedlar som inte speglar EU:s verkliga problem. Avslutningsvis välkomnas sänkta priser på kollektivtrafikens månadskort tack vare politiska beslut.", "trump": "Folk, ni vet att de bara snackar om pengar när de inte har några, det är en total katastrof! Jag har byggt imperier, de här européerna bygger bara förseningar som Västlänken – från 20 till 71 miljarder, en riktig röra. Eurosedlar med småfåglar? Patetiskt. Men kolla, högern sänker priset på busskortet, äntligen smart politik. Fast gratis vore ännu bättre, ingen gör det bättre än mig, tro mig.", "stalin": "Kamrater, jag ser hur borgarbrackorna i Europa firar sina infrastrukturprojekt med skyltar som ropar ut kapitalistmaffians slöseri. Det svenska underjordiska järnvägsfiascot avslöjar klassfiendens lögner – från tjugo till sjuttioett miljarder, en klassisk utsugning. Eurosedlarna döljer byråkratiska blodsugares korruption. Ändå tvingas de sänka priset på arbetarnas färdbevis. Pengar som plötsligt finns? Misstänkt sabotage mot folkets kollektiv. Vi genomskådar er alla."}, "date": "29 juli, 10:51", "url": "https://proletaren.se/artikel/pengatankar-i-semestertider"}, {"type": "image-right", "heading": "KD och Ebba Busch blundar för Israels folkmord i Gaza", "summaries": {"normal": "I en debattartikel kritiserar Pär Salander Kristdemokraterna och Ebba Busch för deras starka stöd till Israel. Han pekar på en lång historia av fördrivning av palestinier sedan sionismens tidiga dagar, med citat från Herzl, Ben-Gurion och andra israelska ledare som talar om expropriering och etnisk rensning. Salander beskriver kriget i Gaza som folkmord med rötter i denna politik och anklagar KD för att blunda för detta genom ideologiska skygglappar.", "trump": "Folk, ni måste höra det här. Den här artikeln är en total katastrof, en witch hunt mot Israel som gör ett fantastiskt jobb mot Hamas, de värsta terroristerna. Ebba Busch är smart, hon fattar det – Israel gör världen en tjänst! Men den här Salander, en professor eller vad han nu är, lever i en fantasivärld med gamla citat och lögner om fördrivning. Fake news! Israel försvarar sig mot radikala islamister som vill utplåna dem. KD gör rätt, de har värderingar, till skillnad från de andra svaga politikerna.", "stalin": "Kamrater, denna dekadenta borgarbracka till professor Salander försöker med sin revisionistiska smörja smutskasta den rättmätiga kampen mot fascistiska element i Gazas zon. Jag, som ledare för det proletära kollektivet, ser hur dessa sionistiska avskrap från borgarklassen och deras lakejer i det så kallade KD-partiet med järnhand genomför nödvändiga utrensningar av kontrarevolutionära Hamas-banditer. Den olitik-blir-10-av-10-fattigare", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6981.jpeg"}, {"type": "image-right", "heading": "Martin Kragh: En människas kaos, en annans kosmos", "summaries": {"normal": "Artikeln hyllar Martin Kragh, en musikentusiast och DJ som kombinerade kaotisk skivsamling med en unik associativ ordning. Hans passion för att blanda disparata musikstilar ledde till minnesvärda DJ-set. Senare blev han en framstående forskare med djup insikt i postsovjetiska ekonomier. Texten beskriver hans liv från klubbscenen till akademin och avslutas med en sorglig hyllning efter hans bortgång. Vänner, familj och samhället har förlorat en unik person.", "trump": "Lyssnade på den här historien om Martin Kragh, en kille som hade skivor överallt som en total katastrof men ändå visste exakt vad han gjorde. Gjorde hiphop av gamla soullåtar och funk, helt galet men på något sätt fantastiskt. Sen blev han expert på de där postsovjetiska länderna och de hatade honom för att han var bäst. Typiskt de förlorande liberalerna. En riktig vinnare, en kosmos i kaos. Vila i frid, Martin. Ni borde alla lära er av honom istället för den där woke-skräpet.", "stalin": "Jag betraktar detta kaos av skivor och anteckningar som en metafor för den verkliga ordningen under partilinjen. Martin Kragh förstod att blanda element till en ny enhetlig kraft, precis som vi organiserar produktionen mot klassfiendens splittring. Hans forskning om de postsovjetiska samhällena avslöjade imperialisternas svagheter, vilket väckte borgarbrackornas vrede. De likviderade inte hans anda. En arbetets son har fallit. Kamrater, låt hans exempel inspirera oss att rensa ut alla folkfiender som hotar kollektivets framtid."}, "date": "24 juli, 16:34", "url": "https://www.flamman.se/martin-kragh-en-manniskas-kaos-en-annans-kosmos", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdl4rig49uwfsa-nh-1-scaled.jpg?aspect_ratio=1:1&width=480&quality=80&format=auto"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
