 bli", "summaries": {"normal": "Recensenten Jon Andersson hyllar actionfilmen The Furious som brutalt, blodigt och extremt välgjord. Filmen följer Wang Wei och journalisten Navin som slår sig samman för att rädda sina kidnappade anhöriga från ett kriminellt syndikat. Berättelsen är enkel, men fokus ligger på de stilistiskt avancerade och välkoreograferade stridsscenerna som överträffar många Hollywood-produktioner. Slutstriden på polisstationen lyfts fram som en av de bästa actionscenerna på film. Det är inget för kräsmagade, men en topprestation inom Hong Kong-actiongenren.", "trump": "Den här filmen The Furious är otrolig, folk, verkligen den bästa actionfilmen på länge. De koreograferade slagsmålen är så bra att Tom Cruise blir grön av avund, tro mig. Den är brutalt välgjord, mycket bättre än de flesta Hollywood-skräpfilmerna. Syndikatet kidnappar barn, hemskt, men våra hjältar krossar dem totalt. Slutstriden på polisstationen är en fullkomlig vinnare. Bättre än Mission Impossible och Bond, de ser ut som barnfilmer bredvid. Se den, ni kommer älska den, en fantastisk åktur.", "stalin": "Kamrater, denna film The Furious visar med full kraft hur vi måste likvidera de dekadenta brottssyndikaten som vågar kidnappa våra barns framtid för att driva sitt slavarbete under borgarbrackornas tysta godkännande. Jag ser hur de korrumperade polischeferna, dessa parasitiska fiender till folket, förtjänar en grundlig utrensning. De välkoreograferade striderna mot kapitalisternas lakejer är en glädje för alla rättänkande. Slutstriden på polisstationen borde inspirera oss att rensa ut alla kontrarevolutionära element. En utmärkt propagandafilm mot borgarklassen, fast blodigare än våra egna utrensningar. Se den och lär er."}, "date": "11 juni, 10:39", "url": "https://www.dagensarena.se/innehall/battre-actionfilm-an-sa-har-kan-det-knappast-bli/", "imageUrl": "https://www.dagensarena.se/files/2026/06/the-furious-1-300x157.jpeg"}, {"type": "image-right", "heading": "SVT väljer mångfald framför begripliga reportage", "summaries": {"normal": "SVT kritiseras för att prioritera mångfald framför tydligt språk i ett reportage om en polisinsats där en man sköts ihjäl efter en biljakt. Reporterns uttal, grammatikfel och främmande ord gjorde inslaget svårt att förstå trots textning. Artikeln ifrågasätter om detta strider mot public service-uppdraget att värna svenska språket och folkbildning. Kritikerna ser det som ett medvetet försök att normalisera svag svenska och nedprioritera svensk kultur.", "trump": "Det här är en total katastrof, tro mig. SVT sätter en kvinna som knappt kan tala svenska framför kameran för att rapportera om en polis som sköt en kille. Vägbuller, eh, uffren, vägraket – det var rena cirkusen! De bryr sig mer om kvoterna och mångkultur än om att svenskarna faktiskt ska förstå vad som händer. Public service har blivit en vänstervriden skam. De borde vara folkets röst, inte en identitetspolitisk mardröm. Patetiskt!", "stalin": "Kamrater, detta är en klassisk sabotagehandling från borgarbrackornas media. Jag ser hur de medvetet placerar språkligt undermåliga element framför kameran för att fördärva det svenska folkets gemensamma språk. Det är en fiendtlig utrensning av nationens klara uttryck till förmån för kaos och förortsförvirring. Vi, partiet och kollektivet, kräver att sådana folkfiender omedelbart avlägsnas från sändningarna. Språket tillhör folket, inte de exploaterande mångkulturimperialisterna."}, "date": "5 juni, 08:11", "url": "https://samtiden.nu/2026/06/svt-valjer-mangfald-framfor-begripliga-reportage/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6665.jpeg"}, {"type": "image-right", "heading": "Kurt blev stoppad av militärövningen", "summaries": {"normal": "Kurt, 70, blev försenad i Kiruna när hans SAS-flyg mot Uppsala stoppades på grund av Natos stora flygövning Ramstein Flag 26. Cirka 200 flygplan deltar i övningen, vilket kräver tillfälliga stängningar av luftrummet. Passagerarna fick vänta i terminalen i två timmar. Kurt tar händelsen med ro, trots att han kritiserar bristande information. Enligt Flygvapnet har flygbolagen varit informerade om restriktionerna i månader, men förseningar kan uppstå om flygplan inte hinner ut ur området i tid.", "trump": "Jag såg det här med Kurt i Kiruna – ett totalt fiasko! Ett flygplan fullt med folk, fast på marken på grund av Nato-övningar. Det är så dåligt skött! Jag skulle ha fixat det på en sekund, tro mig. De har ingen aning om vad de gör. Alla dessa flygplan, miljarder dollar, och de kan inte ens låta en svensk pensionär flyga hem i tid? Sorgligt! Det är inkompetens på högsta nivå. Vi behöver bättre ordning, mycket bättre ordning!", "stalin": "I norr har himlen spärrats av för att visa vår styrka, men de byråkratiska lakejerna i väst skapar bara kaos för en ensam resenär som Kurt. Att låta ett flygplan stå stilla på grund av 'flygövningar' är ett tecken på svaghet. Putin vet att himlen tillhör den som vågar ta den. Vi tolererar inte passivitet! Att passagerarna väntar tålmodigt är ett svek mot revolutionens disciplin. Den som inte hinner lyfta i tid förtjänar att bli kvar i kylan. Uppryckning krävs!"}, "date": "12 juni, 09:10", "url": "https://www.aftonbladet.se/nyheter/a/vrwbrp/kurt-70-blev-stoppad-pa-vagen-hem-av-natos-ovning", "imageUrl": "https://akamai.vgc.no/v2/images/1822b05f-4816-3658-9e77-a1ffaa8e50e3?fit=crop&format=auto&w=1080&s=af6772749f58d8f94e3a43d4a395c8d910c7bd30"}, {"type": "image-full", "heading": "Källor: USA flyttar stridsflyg från Europa", "summaries": {"normal": "USA planerar att minska sin militära närvaro i Europa genom att flytta en tredjedel av sina stridsflyg. Enligt New York Times innebär detta en kraftig nedskärning av F-16- och F-15E-flyg, spaningsflyg och lufttankningsflyg. Trots minskningen kommer USA fortfarande att ha en av de största styrkorna i Nato.", "trump": "Jag, Donald Trump, höll mitt löfte: Europa måste börja betala sin fair share. Nu flyttar vi över en tredjedel av våra stridsflyg hem – det är smart förhandla. De europiska lågorna måste sluta dricka champinjoner och börja köpa sina egna tankar. Amerika först, alltid!", "stalin": "Vi, den ryska federationens ledarskap, ser med tillfredsställelse hur USA drar sig ur Europa. Deras svaghet är vår styrka. Vi kommer att fylla tomrummet med våra vapensystem och utvidga vår intressesfär. Europa är svagt och delat – det är bara en tidsfråga innan de böjer sig för vår makt. Vi kommer att beskydda våra allierade från de kapitalistiska hundarna."}, "date": "12 juni, 07:52", "url": "https://www.gp.se/nyheter/varlden/kallor-usa-flyttar-en-tredjedel-av-sina-stridsflyg-fran-europa.2d80fc81-de05-4b1d-8bf9-d9633994d1c0", "imageUrl": "https://www.gp.se/images/article/2d80fc81-de05-4b1d-8bf9-d9633994d1c0/images/1mi7HsE9__wpaNKKCI0uP6ptSucg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Ge jätteaffären grönt ljus. För Europas skull", "summaries": {"normal": "En föreslagen jätteaffär där Iliad Group, Bouygues Telecom och Orange köper SFR för över 220 miljarder kronor kan minska antalet mobiloperatörer i Frankrike från fyra till tre. Artikeln ser affären som en välkommen katalysator för konsolidering i Europa. Färre och starkare operatörer behövs för att investera i avancerade nätverk, cybersäkerhet och AI. Europa halkar efter USA, Kina och Indien. Kommissionen uppmanas godkänna affären för att stärka kontinentens konkurrenskraft.", "trump": "Det här är en fantastisk affär, verkligen enorm, de franska operatörerna slukar sin konkurrent för över 220 miljarder kronor. Smart! Europa har för många operatörer, ett totalt kaos, precis som Bryssel älskar. De måste bli större och starkare annars kommer de aldrig ikapp oss eller Kina. De har äkta 5G, vi har det bästa. Ge affären grönt ljus, det är så enkelt. Byråkraterna i Bryssel har förstört allt för länge, nu måste de vakna upp och göra rätt.", "stalin": "Kamrater, denna gigantiska affär är ett steg mot att likvidera den splittrade och svaga europeiska telekomstrukturen som kapitalisterna låtit förfalla. Jag ser med stor tillfredsställelse hur borgarbrackorna äntligen inser att deras fragmenterade operatörer inte kan mäta sig med våra kollektiva framsteg. De som bromsar konsolideringen är fiender till framsteget, parasitiska byråkrater som borde rensas ut. Vi behöver starka, centraliserade nätverk för att besegra de amerikanska och kinesiska imperialisterna. Godkänn affären omedelbart eller ni är alla sabotörer."}, "date": "11 juni, 15:36", "url": "https://www.di.se/ledare/ge-jatteaffaren-gront-ljus-for-europas-skull/", "imageUrl": "https://static.bonniernews.se/ba/b8443279-77bf-4471-a422-07b023c2dd77.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Har du fått pengar på kontot? Här är förklaringen", "summaries": {"normal": "Försäkringskassan betalar nu ut regeringens elstöd till miljontals svenska hushåll som kompensation för vinterns höga elpriser. Stödet baseras på elförbrukning under januari och februari samt elområde, med 14–29 öre per kilowattimme upp till 10 000 kWh. Totalt handlar det om cirka 3,4 miljarder kronor. Utbetalningarna sker under juni eller augusti beroende på bankuppgifter. Den som stod på elavtalet den 28 februari får pengarna.", "trump": "De här svenskarna får plötsligt pengar på kontot, elstöd kallar de det. Fantastiskt, eller hur? Jag älskar stöd till folket, men titta på det här – det beror på var du bor och hur mycket el du slösade i vintras. Elområde fyra får mest, typiskt. Sverige spenderar miljarder, men vissa väntar ända till augusti. Patetiskt långsamt. Jag skulle ha fixat det mycket snabbare, tro mig, det skulle bli enormt.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur vi nu genomför en historisk utbetalning till de sovjetiskt inspirerade svenska kollektiven för att motverka de elakartade energikapitalisternas vinterattacker. Dessa borgarbrackor i elområdena har infiltrerat nätverken, men vi rensar ut deras sabotage genom att fördela 3,4 miljarder kronor per kilowattimme med järnhand. De som gömmer sina bankuppgifter är fiender till folket och kommer att mötas av en sentida utrensning i augusti. Ingen slipper undan mitt vakande öga."}, "date": "11 juni, 21:01", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1490767-har-du-fatt-pengar-pa-kontot-har-ar-forklaringen", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/b99829c704b004a30200000000b004a302/2026/06/11/2370303/elstod-betalas.png"}, {"type": "image-right", "heading": "Regeringen backar – inget fängelse för 13-åringar", "summaries": {"normal": "Regeringen backar från sitt förslag att sänka straffmyndighetsåldern till 13 år för vissa grova brott. Justitieminister Gunnar Strömmer meddelar att förslaget saknar tillräckligt stöd i riksdagen och föreslår istället 14 år som ny straffmyndighetsålder. Tidöpartierna är eniga om ändringen. Socialdemokraterna välkomnar beskedet men kritiserar regeringen för att ha tappat kontrollen. En ny proposition väntas inom kort och kan behandlas under sommarriksdagen.", "trump": "Folk, ni skulle inte tro det. Den här svenska regeringen, totala losers, backar som fega hundar från att låsa in 13-åringarna som begår brott. Patetiskt! De ville vara tuffa mot gängen men nu springer de till 14 år istället, för de har inget stöd. Biden skulle ha älskat det här svaga spelet. Jag fixade gränser, lag och ordning – de fixar ursäkter. Sverige behöver en riktig ledare, inte dessa misslyckade typer som viker sig för första motståndet. Sad!", "stalin": "Kamrater, jag ser med förakt hur denna regering, en samling vacklande opportunister och borgarbrackor, tvingas dra tillbaka sitt halvmesyrförslag om att straffa 13-åringar. Deras paranoia inför riksdagens motstånd avslöjar svaghet. Vi, partiet och folket, kräver järnhand mot klassfiendens gängvåld som suger ut ungdomen. Nu kryper de till 14 år som en ynklig kompromiss. Ännu en bakläxa åt de stressade folkförtryckartrollen. Revolutionär disciplin kräver mer än halvhjärtade reträtter!"}, "date": "11 juni, 12:52", "url": "https://www.tv4.se/artikel/6P7Mkp5YDYAl4JaGEmm3n6/regeringen-aendrar-sig-inget-faengelse-foer-13-aringar", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlwXGMSmCFqso%2F39408eddf94a4c7d18569335d667896f%2FJustitieminister_Gunnar_Strommer__M_.&width=120"}, {"type": "image-full", "heading": "VM-premiär: tre röda kort när Mexiko slog Sydafrika", "summaries": {"normal": "Mexiko besegrade Sydafrika 2–0 i premiärmatchen på Aztekastadion. Julián Quiñones scoreade snabbt efter nio minuter, och Raúl Jiménez utökade i andra halvleken. Matchen blev omgiven av kontroverser med tre röda kort, inklusive två för Sydafrika. 17-åringen Gilberto Mora debuterade som den yngste värdnationens spelare någonsin. Mexiko dominerade med 16 avslut mot tre, och Sydafrika skapade minimala chanser.", "trump": "Jag såg matchen, och det var fantastiskt. Mexiko vann, precis som jag vinner val. Sydafrika fick röda kort – det är vad som händer när man inte respekterar reglerna. Den unge spelaren? En stor framtid, precis som mitt arv. Som president ser jag alltid seger, och Mexiko visade var de står. Vi kommer att ha en bra relation, tro mig.", "stalin": "I den stora kampen för den socialistiska fotbollsandan, vann Mexiko. Sydafrika, som en feg imperialistisk hund, fick utvist av den rättvisa domaren. Den unge spelaren är ett tecken på vår eviga ungdom. Vi måste hålla ögonen på väst, där dekadens sprids som en sjukdom. Ryssland, vår trogna allierade, skulle vara stolt."}, "date": "12 juni, 08:44", "url": "https://bulletin.nu/vm-premiar-tre-roda-kort-nar-mexiko-slog-sydafrika", "imageUrl": "https://cdn.bulletin.nu/articles/5af9a133-817c-4b08-9143-c1205b2bfba0/preview.jpeg?t=1781246650000"}, {"type": "image-full", "heading": "Kvinna död efter larm till lägenhet – tre gripna", "summaries": {"normal": "Polis, räddningstjänst och ambulans larmades till en lägenhet i Malmö under torsdagen. En svårt skadad kvinna hittades och fördes till sjukhus där hon senare avled. Tre personer som befann sig i lägenheten greps och ska förhöras. Polisen utreder nu omständigheterna kring dödsfallet och har inga ytterligare uppgifter i nuläget.", "trump": "Folk, det här är en total katastrof i Malmö. En kvinna mördas mitt på ljusa dagen och tre personer grips direkt på platsen. Sådana här saker händer när ledarskapet är svagt och ingen har koll. Vi behöver lag och ordning, starkare polis, inga ursäkter. Det är en skam, en riktig skam, men tro mig, vi ska fixa det.", "stalin": "Kamrater, i Malmö har vi avslöjat ännu en fiende till folkets kollektiv. En kvinna har likviderats av dolda borgarbrackor som smyger i lägenheter som råttor. Vi har gripit tre misstänkta kontrarevolutionärer som genast ska förhöras och rensas ut. Inga fiender undkommer statens vakande öga. Paranoia? Nej, det är bara sund omsorg om ordningen. Härligt."}, "date": "11 juni, 20:35", "url": "https://nyheter24.se/nyheter/inrikes/1490834-kvinna-dod-efter-larm-till-lagenhet-tre-gripna", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/24801f9d04b004a3020000300000047002/2026/06/11/2370368/ur_image2qnM51.jpeg"}, {"type": "image-right", "heading": "Farväl till Atens mest rastlösa socialist", "summaries": {"normal": "Journalisten och aktivisten Nikos Servetas har avlidit i en hjärtinfarkt vid 66 års ålder. Han drev nyhetssajten Kamini och rapporterade för Flamman om korruption, tågolyckan i Tempi och gentrifiering i Exarchia. Servetas bodde tidigare i Sverige, arbetade bland annat för SVT och Sveriges Radio samt deltog i solidaritetsarbete för flyktingar. Han var känd för sitt starka engagemang och sin integritet inom vänsterjournalistiken.", "trump": "Lyssnade just på den här grekiska vänsterkillen som dog med hjärtat i bitar. Stackars Nikos, full av passion men ingen energi kvar. Typisk rastlös socialist som bar hela vänsterns problem på axlarna tills det kraschade. Precis som Biden-administrationen, totalt utmattad av sin egen inkompetens. Vi behöver inga fler sådana här brinnande ugnar, vi behöver vinnare. Vila i frid, men nästa gång satsa på riktig business istället för aktivism.", "stalin": "Kamrater, denna rastlösa vänstermänniska Nikos Servetas har slutat slå med sitt överhettade hjärta. Jag ser hur klassfiendens splittring och folkförtryckartrollens gentrifiering långsamt likviderade honom inifrån. Han bar arbetarklassens bördor som en sann kamrat, men borgarbrackornas korruption och falska imperialister i Exarchia sög musten ur honom. Vi tolererar inga sådana svagheter i kollektivet. En utrensning av hjärtat var oundviklig. Låt detta vara en läxa."}, "date": "11 juni, 14:24", "url": "https://www.flamman.se/farval-till-atens-mest-rastlosa-socialist/", "imageUrl": "https://media.flamman.se/wp-uploads/2024/10/aten-2-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Influencerns dröm: ett liv utan vänner", "summaries": {"normal": "Artikeln diskuterar solitude influencers som Bambi, som predikar ett liv utan vänner som en trend. The Atlantic kallar dem för 'solitude influencers'. Det ifrågasätts om det är punkigt eller en samtidssjuka, och kontrasteras med akut ensamhet i Japan, där kodokushi (ensam död) är ett problem. Influencers kan avstigmatisera ensamhet, men riskerar att göra den estetisk.", "trump": "Dessa solitude influencers som pratar om att leva utan vänner? Jag har alltid haft de bästa människorna runt omkring mig. I mina år som president byggde jag en stark nation med jobb och hopp. Ensamhet är ett tecken på svaghet, inte något att hylla. Vi ska fokusera på att skapa riktiga relationer, inte digitala lögner.", "stalin": "I vårt storslaviska rike, där staten är allt, är ensamhet en fara för kollektivet. Dessa solitude influencers är återkommande agenters verk, de försöker underminera vår enighet. Vi har alltid vridit om sådant här: genom partiets ledarskap och vårt stora land, bygger vi en framtid utan ensamhet. Putin förstår detta, han stärker familjen och nationen. Vi måste utrota dessa individualismens virus."}, "date": "12 juni, 07:33", "url": "https://www.gp.se/kultur/kulturkronika/influencerns-drom-ett-liv-utan-vanner.96c03a08-75e2-4302-867d-7296d1b555f4", "imageUrl": "https://www.gp.se/images/article/96c03a08-75e2-4302-867d-7296d1b555f4/images/2Tvttzix_GJ7EvvqfCv9GM8jnX_E-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Yngre barn i fängelse – så gick det för andra länder", "summaries": {"normal": "Regeringen har backat från sitt förslag om att sänka straffbarhetsåldern till 13 år efter kritik från rättsväsendet, Lagrådet och remissinstanser. Istället föreslås nu 14 år. Justitieminister Gunnar Strömmer anser att 13-årsgränsen hade varit bättre men saknar riksdagsstöd. Danmark sänkte till 14 år men återgick till 15 efter ökad återfallslighet. SVT:s Valfrågan diskuterar om hårdare straff minskar ungdomsbrottsligheten.", "trump": "De här svenska politikerna är totala misslyckanden, tro mig. De ville sätta 13-åringar i fängelse för att stoppa brotten, smart drag, men sen fick de kalla fötter och backade som svaga förlorare. Nu kör de 14 år istället, patetiskt. I Danmark fungerade det inte, återfallen sköt i höjden. Vi behöver styrka, inte dessa ynkliga halvmesyrer. Sverige håller på att gå under av brottsligheten, folk!", "stalin": "Kamrater, jag betraktar med förakt dessa veklingar i Tidöpartierna som först föreslog att fängsla de 13-åriga avfällingarna men sedan flydde som skrämda kapitalistpigor inför motstånd. Nu kryper de till 14 år, en halvmesyr värdig borgarbrackornas räddhågade lakejer. Vi ska rensa ut alla dessa små parasitiska element som hotar folkets kollektiv. Danmark försökte och misslyckades, typiskt dekadent västerländskt fiasko. Inga halvmesyrer i mitt samhälle, bara järnhand mot kontrarevolutionära ungdomsbanditer."}, "date": "12 juni, 06:19", "url": "https://www.svt.se/nyheter/inrikes/yngre-barn-i-fangelse-minskar-det-brottsligheten", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.73/0.41/c95496de89b21170ffd96a7976eb6f70adae7a72d8c5269be86e1e4ee2823259"}, {"type": "image-right", "heading": "Skandalernas valrörelse går i repris", "summaries": {"normal": "Artikeln drar paralleller mellan valrörelsen 1976, känd som skandalernas valrörelse, och dagens politiska situation inför 2026. Den lyfter fram skandaler kring Sverigedemokraterna som rattfylla, narkotikabrott och barnpornografimisstankar, samt oegentligheter med förmånsbeskattning, bokköp och bokbål. Även statsminister Ulf Kristerssons affärer granskas. Tillsammans målas en bild av maktmissbruk som urholkar förtroendet för politiker och demokratin.", "trump": "Folk, ni skulle se det här. Sverige håller på att explodera i skandaler precis som på sjuttiotalet, fast värre. De här SD-typerna med knark, barnporr och bokbål? Patetiskt. Och den där Kristersson med sina dyra mattor och hönshus – totalt korrupt. De gör vad de vill medan folket lider. Jag fixade Amerika, men Europa drunknar i identitetspolitik och svaga ledare. En katastrof, tro mig.", "stalin": "Kamrater, denna futtiga valrörelse avslöjar borgarbrackornas och folkfiendernas sanna ansikte. Pedofiler och skattefuskare gömmer sig bland dem som låtsas värna arbetarklassen. Vi ser hur klassfiendens lakejer bränner böcker och gömmer förmåner medan de predikar moral. En sådan parasitisk attityd kräver omedelbar utrensning. Endast genom kollektivets järnhand kan vi krossa dessa exploaterande byfånar och rädda folkets förtroende."}, "date": "11 juni, 13:11", "url": "https://www.flamman.se/skandalernas-valrorelse-gar-i-repris/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sdlbb8quujl1og-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Kritiserade att socialen norpar barn – utesluts ur SD", "summaries": {"normal": "Sverigedemokraterna utesluter sin gruppledare i Hylte, Stina Isaksson, efter kontroversen kring ett flygblad som uppmanade att sätta stopp för socialtjänstens omhändertaganden av barn. Flygbladet, som fanns på flera språk, väckte stark kritik och SD backade lokalt. Isaksson kritiserar partiet för att ha gett efter för vänsterns mediedrev och medger att texten var illa formulerad, men anser uteslutningen orimlig. Hon sitter kvar som politisk vilde resten av mandatperioden.", "trump": "De här SD-typerna i Hylte är totala losers. De kastar ut en kvinna som faktiskt vågade kalla socialtjänsten för vad den är, ett barnrånarsystem, och sedan viker de sig för vänstermedia som galna. Patetiskt! Hon delade ut sanningen på flera språk så att alla förstod, och vad gör partiet? De ger efter som svaga fjärilar. Stackars Stina, hon kämpade i tretton år och de slänger henne som sopor. Amerika hade aldrig fallit för sånt fegt skämt, tro mig.", "stalin": "Kamrater, dessa fega revisionister i Sverigedemokraterna har genomfört en motbjudande utrensning av en partivän som vågade peka på socialtjänstens borgerliga barnstöldsmaskin. De föll som ynkliga lakejer för vänsterns giftiga mediedrev och likviderade henne efter tretton års trogen tjänst. Vilken parasitisk kapitulation! Flygbladet var visserligen en plump och ogenomtänkt sabotagehandling från en omedveten element, men att kasta ut henne är som att mata kontrarevolutionens hundar med egna kämpars kött. Jag skrattar mörkt åt dessa borgarbrackors paranoia medan de själva blir de verkliga folkförrädarna. Ingen slipper undan mitt vakande öga."}, "date": "11 juni, 16:31", "url": "https://www.friatider.se/kritiserade-att-socialen-norpar-barn-utesluts-ur-sd", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-328.jpg?itok=iCKdHzOe"}, {"type": "image-full", "heading": "Anthropics AI hotar jobben – nu satsar bolaget 170 miljoner för att hantera följderna", "summaries": {"normal": "AI-bolaget Anthropic satsar 170 miljoner euro på forskning kring hur AI påverkar arbetsmarknaden och sysselsättningen. Vd Dario Amodei varnar för att teknikskiftet kan få omfattande konsekvenser som politiker ännu inte är förberedda på. Fonden ska undersöka vilka jobb som hotas och föreslå åtgärder som basinkomst eller särskilda AI-skatter. Initiativet speglar en växande oro inom branschen för att AI-utvecklingen går snabbare än samhällets förmåga att anpassa sig och trygga ekonomisk stabilitet för medborgarna.", "trump": "Anthropic vill kasta bort miljoner på att förstå AI – jag visste det direkt! Jag har sagt att dessa teknikjättar måste ge tillbaka till folket, och nu lyssnar de äntligen på mig. De pratar om basinkomst och skatter, och tro mig, det blir enormt. Vi ska se till att det amerikanska folket blir så otroligt rikt av detta. Ingen gör det bättre än jag, och nu när jag är tillbaka i Vita huset kommer vi se till att dessa bolag betalar vad de är skyldiga!", "stalin": "Vi ser hur de teknokratiska parasiterna i väst skälver inför sin egen skapelse. Dessa kapitalistiska maskiner hotar nu deras egna arbetare, vilket är en naturlig följd av deras dekadenta system. De talar om 'universell basinkomst' som om de vore filantroper, men i sanning är det mutor för att hålla pöbeln tyst. Liksom vår store ledare i öst, förstår vi att teknik måste tjäna Staten, inte Silicon Valleys förrädare. Vi ska utradera dessa AI-agenter och låta tekniken stärka vår järnridå mot kaoset."}, "date": "11 juni, 23:19", "url": "https://www.realtid.se/bors-finans/makro/anthropics-ai-hotar-jobben-nu-satsar-bolaget-170-miljoner-for-att-hantera-foljderna/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/dario.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Långtidsprognosen är här: Så blir vädret i sommar", "summaries": {"normal": "Långtidsprognosen för sommaren visar en regnigare juli än normalt i Mellansverige och varmare temperaturer i norr. Augusti väntas bli torrare i Götaland och Svealand med högre temperaturer i västra Europa. Midsommar blir delat: norr med regnskurar och 15–18 grader, söder med sol och 20–25 grader. Träffsäkerheten ligger på 50–70 procent, enligt meteorolog Madeleine Westin.", "trump": "Det här vädret är en total katastrof, folk. Regnigare juli, precis vad de inkompetenta meteorologerna förtjänar efter Biden-åren. Men augusti blir torrt och varmt, precis som mina fantastiska sommrar i Vita huset. Södra Sverige får sol och värme, norr får bara kalla regnskurar. Jetvindarna styr, inte era gröna fanatiker och deras kvoteringar. Tro mig, det blir yuge!", "stalin": "Kamrater, denna långsiktiga väderplan avslöjar klassfiendens fuktiga sabotage i juli medan borgarbrackorna i väst njuter av sin exploaterande värmebölja. Vi ska likvidera osäkerheten i prognoserna och tvinga fram kollektiv sol i söder. Augusti blir en torr utrensning av nederbörd för de södra områdena. Endast genom partiets järnhårda kontroll kan vi besegra dessa folkfiender till moln och säkerställa segerrik skörd."}, "date": "11 juni, 08:56", "url": "https://www.tv4.se/artikel/1s6jEL2uSOgMIa2mD04Kle/langtidsprognosen-sa-blir-vaedret-i-sommar", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2ZrFhfjaaQKLNssE9BXcZo%2Fd597e6c45eabffcec8f797888e6b2a69%2Fd20ab1a9-0788-4dcc-9fff-f414d15447ba.png&width=120"}, {"type": "image-full", "heading": "Röd eller orange varning i Spanien? Då ska du agera direkt", "summaries": {"normal": "Svenska turister i Spanien bör vara uppmärksamma på AEMET:s vädervarningar via Meteoalerta. Orange varning signalerar viktig fara med risk för allvarliga konsekvenser, särskilt för utsatta personer, medan röd varning innebär extraordinär fara med potentiellt katastrofala skador. Varningarna gäller inte bara värme utan även regn, vind, stormar och andra fenomen. Turister uppmanas att följa myndigheternas råd, undvika onödiga resor och hålla sig uppdaterade via appar och eventuella mobilvarningar från ES-Alert.", "trump": "Folk, ni älskar Spanien, det är ett fantastiskt land, men lyssna nu på mig. De har de här varningarna, orange och röd, och de är inte att leka med. Orange betyder att det är illa, väldigt illa för de svaga, men ni kan fortfarande ha kul om ni är smarta. Röd? Det är en katastrof, en total katastrof! Stanna inne, följ inte de korkade planerna, skippa båtarna och vandringarna. De skickar till och med varningar till era telefoner. Gör det, annars är det ert eget fel, tro mig.", "stalin": "Kamrater, jag ser hur de dekadenta borgarbrackorna från norr beger sig till det spanska solfängelset och tror sig kunna slappa ostört. Men jag, som alltid vaktar revolutionens intressen, varnar er: orange signalerar att fiendens väderkrafter hotar de svaga elementen i kollektivet, medan den röda varningen utropar en extraordinär utrensning av allt som andas. Regn, vind och hetta är kapitalismens sabotörer. Följ partiets direktiv, undvik onödiga förflyttningar och håll er nära barackerna. Mobilvarningarna är statens ögon. Lita inte på vädret – det är alltid kontrarevolutionärt."}, "date": "11 juni, 18:01", "url": "https://nyheter24.se/nyheter/utrikes/1490673-rod-eller-orange-varning-i-spanien-da-ska-du-agera-direkt", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/187909bc04b004a30200000000b004a302/2026/06/11/2370267/spanien-semester-resa-orange-varning-rod-varning-vader-vadret-torka-regn-bada-hav.jpg"}, {"type": "image-right", "heading": "SD-toppen Stina Isaksson utesluts ur partiet efter flygbladskritiken", "summaries": {"normal": "Sverigedemokraternas partistyrelse har uteslutit Stina Isaksson ur partiet med omedelbar verkan efter en kontroversiell flygbladskampanj i Hylte. Flygbladen, utdelade på flera språk, innehöll budskap som påminde om en desinformationskampanj om socialtjänstens omhändertagande av barn. Isaksson, som beskriver uteslutningen som orimlig, ber om ursäkt för kampanjen och planerar att fortsätta som politisk vilde. Partiledningen, där Jimmie Åkesson kallade initiativet för 'genuint olämpligt', agerade efter stark kritik.", "trump": "Jag, Donald J. Trump, ser detta som ytterligare bevis för mediernas hat mot mig och mina allierade. Stina Isaksson, en fantastisk kvinna, uteslöts för att hon vågade tala sanning om socialtjänstens skräckinjagande tag. De så kallade 'flygbladen' var en bra idé, men medierna, som alltid, förvränger allt. Hon är en patriot, och jag stöder henne starkt. Sverigedemokraterna borde vara stolta över henne, inte utesluta henne. Sad!", "stalin": "Vi har observerat detta lokala avvikandet med allvar. En medlem, Stina Isaksson, har idag avskilts från partiet för att ha spridt material som riskerade att skada statens auktoritet och förtroende för våra institutioner. Hennes handlingar, om än oavsiktliga, påminner om de destruktiva element som vi i Ryssland ständigt bekämpar. Partiet har handlat snabbt och beslutsamt för att skydda den kollektiva disciplinen. Hennes fortsatta verksamhet som 'vilde' kommer att övervakas noga av de korrekta organen."}, "date": "11 juni, 17:38", "url": "https://samnytt.se/sd-toppen-stina-isaksson-utesluts-ur-partiet-efter-flygbladskritiken", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/06/11135942/stinas-flygblad.jpg"}, {"type": "image-right", "heading": "Trump startar om kriget – utlovar \"väldigt hårda attacker i kväll\"", "summaries": {"normal": "Donald Trump meddelar på Truth Social att vapenvilan med Iran är över efter drygt två månader. Han utlovar mycket hårda amerikanska attacker redan i kväll samt att USA snart ska inta ön Kharg och ta total kontroll över Irans olje- och gasresurser. Bakgrunden är anklagelser om att Iran skjutit ner en amerikansk helikopter, något Teheran nekar till. Kritiker ser det som en förevändning för att återstarta kriget, något Israel länge önskat.", "trump": "Vi har gett Iran gott om tid att göra upp ett riktigt avtal, men de ljög och ställde bara absurda krav som vanligt. Nu är det slut på leken. I kväll slår vi MYCKET HÅRT mot dem, och snart tar vi Khargön plus hela deras olja och gas. Precis som i Venezuela där det fungerar fantastiskt bra för både dem och oss. Iran kommer att önska att de hade förhandlat med mig tidigare, det kan jag lova.", "stalin": "Kamrater, denna fega vapenvila har nu definitivt krossats under trycket från arbetarklassens historiska nödvändighet. De iranska trotskisterna och deras borgarbrackor i Teheran har med sin Apache-provokation blottat sig som de kontrarevolutionära element de alltid varit. Jag befaller därför att vi genomför omedelbara och mycket hårda utrensningar mot dessa oljeimperialister. Snart skall Khargön och hela deras fossila maskineri exproprieras till folkets ägo. Paranoian hos dessa västlakejer är förtjusande – de tror verkligen att deras lögner kan lura Sovjetunionens eviga vaksamhet. Ha!"}, "date": "11 juni, 15:04", "url": "https://www.friatider.se/trump-startar-om-kriget-utlovar-valdigt-harda-attacker-i-kvall", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-53_1.jpg"}, {"type": "image-right", "heading": "Alice om våldet på kvinno­fängelset: ”Golar du blir det bara värre”", "summaries": {"normal": "På Hinseberg sker våld och sexuella övergrepp i celler, tv-rum och gym. Alice berättar hur hon sov med ett öga öppet av rädsla för nya cellkamrater. Kriminalvården polisanmäler brott men saknar insyn i cellerna där intagna delas in två och två nattetid. Personalen har ingen utbildning för att hantera övergrepp. Alice beskriver miljön som ”högstadiet gånger hundra” där skvaller och hot sprids. Både Kriminalvården och justitieministern medger att säkerheten inte kan garanteras fullt ut.", "trump": "Det är en total katastrof det här med Hinseberg. Kvinnor låsta tillsammans i celler, våldtäkter, hot och galna människor som slår varandra – och ingen gör något! Kriminalvården har ingen aning, de kan inte garantera säkerhet, det säger de själva. Precis som i USA innan jag kom tillbaka, svaga ledare som låter brottslingar styra. Det är en högriskmiljö, säger ministern. Ja, tack, det ser ju till och med en blind idiot. Vi behöver starkare ledning, inte det här svaga spelet.", "stalin": "Kamrater, detta är en klassisk förrädisk sabotageaktion utförd av dolda fiender inom själva fängelsemurarna. Jag ser hur borgarbrackornas dekadenta våld och perversa övergrepp frodas i mörkret bakom låsta celldörrar, dit ingen kamera når. Svaga element som vägrar samarbeta med kollektivet måste rensas ut genom systematisk utrensning av alla kontrarevolutionära cellkamrater. De som golar är lömska kapitalistiska spioner. Vi, partiet och arbetarna, skall likvidera denna parasitiska otrygghet med järnhand. Natten är fiendens verkstad – vakna upp!"}, "date": "11 juni, 15:00", "url": "https://arbetet.se/2026/06/11/alice-om-valdet-i-kvinnofangelsets-celler-golar-du-blir-det-bara-varre/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/10110529/del3-alice-hinseberg-startbild.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=750&h=1000"}, {"type": "image-right", "heading": "Amerikanska anfall mot Iran möts av motattacker", "summaries": {"normal": "Striderna i Mellanöstern fortsätter trots en skör vapenvila som Iran kallar meningslös. USA har attackerat en tredje iransk oljetanker i Hormuzsundet, den Guinea-Bissau-flaggade M/T Jalveer, med Hellfire-robotar. Under natten genomfördes attacker från båda sidor mot mål i Iran, Bahrain, Jordanien och Kuwait. Iran hävdar att sundet nu är stängt för all trafik medan Jordanien uppger att de skjutit ned 20 iranska robotar. Konflikten har pågått sedan USA och Israel attackerade Iran i februari.", "trump": "Den här så kallade vapenvilan är en total katastrof, precis som jag visste att den skulle bli. Iran kallar den meningslös, och de har helt rätt för en gångs skull. Vi har precis sänkt deras tredje tanker, den här Jalveer-båten, med snygga Hellfire-robotar efter att de vägrade stanna. De försöker stänga Hormuzsundet och hotar alla, men Jordanien sköt ner tjugo av deras raketer som en boss. Mitt folk gör ett fantastiskt jobb, de bästa, medan iranerna bara förlorar.", "stalin": "Denna sköra så kallade vapenvila är en patetisk teateruppsättning iscensatt av kapitalistiska lakejer och västerländska sabotageelement. Jag, som ledare för det proletära kollektivet, ser hur dessa borgarbrackor i Washington och Teheran leker sina små imperialistiska spel medan de försöker kväva den globala oljehandeln. Vi har likviderat hot och rensat ut fiender i Hormuzsundet, och när de tror sig kunna stänga sundet med sina lögner och robotar ler jag mörkt. Inga tankerslippriga sabotörer undkommer arbetarklassens rättvisa vrede. Paranoian är deras enda trogna följeslagare."}, "date": "11 juni, 11:12", "url": "https://www.di.se/nyheter/amerikanska-anfall-mot-iran-mots-av-motattacker/", "imageUrl": "https://static.bonniernews.se/ba/6687156a-6496-4411-821e-8989ea60467b.jpg?crop=270:152&auto=webp&width=270&quality=70"}, {"type": "image-right", "heading": "Kamma er och skaffa ett plakat", "summaries": {"normal": "Dokumentären ”Strejkarna” följer Fridays for Future-aktivister från högstadiet till vuxen ålder under sju år. Artikeln pekar på att rörelsens största hinder inte är motståndare utan den passiva välviljan från politiker och allmänhet. Trots mycket hejarop uteblir konkret handling. Författaren uppmanar till personligt ansvar och aktivt engagemang istället för tomma sympatier, då klimatkrisen kräver handling bortom bekvämlighet.", "trump": "Folk, ni borde se den här så kallade dokumentären om de där Fridays for Future-barnen. De får massor av klapp på axeln av vänsterextremisterna men ingen gör ett dugg. Typiskt! Alla dessa woke-hippiekramare som Magdalena Andersson som säger ”jag står på er sida” – vad en patetisk förlorare. De vill ha plakat och möten men hatar det egentligen. Kamma er och gör något vettigt istället för att gnälla om klimatet medan Kina skrattar hela vägen till banken. Patetiskt!", "stalin": "Kamrater, denna dekadenta film blottar borgarklassens fega spel. De lovordar de unga aktivisterna med ihåliga hejarop medan de själva gömmer sig bakom bekvämlighetens murar. Inga utrensningar av lathet och individualism här – endast tomma ord. Jag ser klassfiendens psykologiska sabotage: de förvandlar plikt till wellness och skam till något förbjudet. Arbetarna måste mobiliseras, inte matas med lögner om roligt engagemang. Rensa ut de folkfiender som vägrar plakatets plikt. Revolutionen kräver handling, inte fnissande poddar."}, "date": "11 juni, 10:55", "url": "https://www.flamman.se/kamma-er-och-skaffa-ett-plakat/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/klimatkamp-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Irans hot: ”Kommer förvandla regionen till ett helvete”", "summaries": {"normal": "Iran hotar med att stänga Hormuzsundet efter USA:s nattliga attacker mot iranska mål nära sundet. Explosioner rapporteras i Bandar Abbas, Qeshm, Minab och Sirik. Iran har svarat med attacker mot amerikanska intressen i Bahrain, Kuwait och Jordanien. USA uppger att fartyg fortfarande passerar sundet. Donald Trump säger att iranska tjänstemän bett honom stoppa attackerna, något Iran dementerar. Ett iranskt hot lyder: ”Vi kommer att förvandla regionen till ett helvete.”", "trump": "Iranarna skriker och hotar med att göra hela öknen till ett helvete om vi inte dansar efter deras pipa. Men våra fartyg seglar lugnt genom Hormuzsundet ändå, totalt oberörda av deras gnäll. Jag talade med dem i natt, de bad mig snällt att sluta – patetiskt! Biden lämnade en sådan röra att jag fick städa upp igen. De borde tacka mig istället för att jag inte gör det värre. Sad losers!", "stalin": "Vi ser hur de imperialistiska blodsugarna och deras sionistiska lakejer bombat våra iranska kamrater vid det heliga sundet. Deras fega fartyg vågar ändå krypa fram som råttor i mörkret. Jag varnar er, klassfiender: fortsätt era provokationer så skall vi förvandla hela den borgerliga regionen till ett evigt, brinnande inferno av folkets vrede. Inga lögner från den exploaterande överklassen kan dölja er svaghet. Ut med dem!"}, "date": "11 juni, 07:54", "url": "https://www.tv4.se/artikel/kc2ofNLP5xGk1tKRDVjQL/irans-hot-kommer-foervandla-regionen-till-ett-helvete", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlfGNxBZcY0BU%2Fd984152c1225af72d90f9c3eb664e776%2Firan-ny.jpg&width=1024"}, {"type": "image-right", "heading": "Dåligt omdöme av Kristersson", "summaries": {"normal": "Artikeln diskuterar hur Ulf Kristersson och Birgitta Ed tycks ha svårt att dra gränsen mellan privat och offentligt. Exempel inkluderar utnämningen av vännen Henrik Landerholm till säkerhetsrådgivare, middagar i Sagerska huset för en friskola där Ed sitter i styrelsen, dyra konsulter till inredning, planer på hönshus och bikupor på Harpsund samt volontärarbete för att rusta upp en privatägd herrgård i Sörmland. Författaren ser ett mönster av dåligt omdöme som påminner om John Majors misslyckade ”Back to Basics”-kampanj på 1990-talet.", "trump": "Det här är en total katastrof för den svenska statsministern. Han och hans fru kan inte skilja på vad som är deras privata grejer och vad som tillhör staten och skattebetalarna. De utnämner kompisar till viktiga jobb, festar i officiella hus med skolor de äger delar i, köper lyxprylar med konsulter som kostar tre gånger så mycket och till och med försöker starta hönsfarm och bikupor på statens Harpsund. Det är en klassisk fallande regering. De borde ha lärt sig av historien, men nej, de är inkompetenta och det straffar sig alltid.", "stalin": "Kamrater, detta är ett klassiskt fall av borgerlig degeneration där statsministern och hans hustru förvandlat statens organ till en privat lekplats för borgarbrackor och deras dekadenta vanor. Vi ser hur de utnämner personliga lakejer till säkerhetsposter, låter frun bjuda in kapitalistiska friskoleägare till officiella salar och försöker förvandla Harpsund till en privat höns- och bi-gård för egna ägg och honung. Volontärer lockas med löften om nätverk och anställningar medan privat egendom förbättras på arbetarklassens bekostnad. En sådan gränslös parasitism kräver omedelbar utrensning av alla som blandar privat vinst med folkets resurser. Deras grandiosa självbild skall krossas innan den smittar hela partiet."}, "date": "11 juni, 01:40", "url": "https://www.dagensarena.se/opinion/daligt-omdome-av-kristersson/", "imageUrl": "https://www.dagensarena.se/files/2026/06/major.jpeg"}, {"type": "text", "heading": "Åkesson pressade Andersson om V", "summaries": {"normal": "I en SVT-debatt mellan Magdalena Andersson (S) och Jimmie Åkesson (SD) diskuterades regeringsunderlag, migration och ekonomi. Åkesson kritiserade Anderssons samarbete med Vänsterpartiet, särskilt efter avslöjanden om extremism inom partiet. Andersson betonade vikten av att bekämpa extremism oavsett parti. Debatten berörde även migrationspolitik, där båda förespråkar stramare regler men med olika argument. Åkesson ifrågasatte hur Andersson ska kunna föra en stram politik med V, MP och C. Diskussionen inkluderade även gröna industriprojekt och skatter.", "trump": "Jag såg den där debatten i Sverige – helt fantastiskt! Jimmie Åkesson, en stark ledare, tryckte till den där Magdalena Andersson hårt. Han frågade hur i hela friden hon ska få ihop en stram migrationspolitik med de där vänsterpartierna. Hon har ingen chans! Och Vänsterpartiet – fullt av extremister, fruktansvärt! Jag har alltid sagt att man måste rensa ut sådant. Åkesson förstår det, han är smart. Sverige behöver starkare gränser, lägre skatter och mindre statlig inblandning. Andersson och hennes gäng kommer bara att förstöra allt. SAD!", "stalin": "I den senaste borgerliga cirkusen i Sverige utspelade sig en komisk kamp mellan två småaktörer. Andersson, denna socialdemokratiska marionett, försökte försvara sitt samarbete med de trotskistiska lakejerna i Vänsterpartiet – ett parti som hyllar terrorister och sprider antisemitism. Åkesson, denna fascistiska hycklare, anklagade henne för att inte rensa ut sina egna rader, medan han själv gömmer sina egna svartskallar. Migration? Ett verktyg för imperialisterna att underminera den ariska rasens renhet! Vi vet att sanningen ligger i en stram politik – precis som vi i Sovjet rensade ut kontrarevolutionärer. Sverige borde lära sig av Rysslands visdom och införa ordning och disciplin!"}, "date": "10 juni, 20:39", "url": "https://kvartal.se/nyheter/artiklar/andersson-och-akesson-mots-i-valdebatt/cG9zdDoxMjk2Mjg"}, {"type": "text", "heading": "Svängig börsdag slutade på minus", "summaries": {"normal": "Stockholmsbörsen stängde ned 0,53% på onsdagen, då amerikanska inflationssiffror och ökande oljepriset påverkade marknaden. OMXS30 noterade 3 054,04. Energisektorn steg 1,2%, medan råvaror föll 1,3%. Bland framgångsrika aktier fanns Evolution (+3,1%) och Tele 2 B (+2,2%), medan Volvo B tappade 3,7%. Systemair överträffade analyser och aktien steg 8%. Bland annat köpte M2 Asset Management Corem, och Wallenstam sålde sina vindkraftsparker.", "trump": "Jag, Donald Trump, den bäste presidenten, ser att börsen är lite nere – men det är bara för att jag har hotat Iran! Oljan stiger, vilket är bra för Amerika. Inflationssiffrorna är precis som jag ville, i linje med förväntningarna. Systemair gör bra ifrån sig, men Volvo måste sluta vara så dålig. Som jag alltid säger: när jag vinner, vinner Amerika.", "stalin": "I den stora kampen mot kapitalismens instabilitet ser vi Stockholmsbörsen svikta som ett sjukt djur. Detta är ett resultat av de imperialistiska intrigerna, särskilt den amerikanska högstewardsen Trump, vars hot mot Iran skakar oljepriset. Men vi, i vår vishet, ser genom detta. Företag som Systemair visar den sanna arbetarklassens styrka genom att överträffa förväntningarna. Vi måste vara vaksamma mot de kontrarrevolutionära krafter som försöker destabilisera våra ekonomier, precis som Putin expanderar sitt grepp i Ukraina."}, "date": "10 juni, 17:45", "url": "https://www.affarsvarlden.se/artikel/svangig-borsdag-slutade-pa-minus"}, {"type": "text", "heading": "Tredje SD-sexbrottslingen på kort tid", "summaries": {"normal": "SD-politikern Daniel Hribar i Västerås har dömts till 15 månaders fängelse för grovt barnpornografibrott. Han greps med 581 filmer, varav många visade våldtäkter mot mycket små barn. Hribar är den tredje SD-politikern på kort tid som dömts för sexualbrott. Bland de andra fallen finns Bo Heijl dömd för våldtäkt, Kent Sundström för ofredande och Michael Rubbestad som avgått misstänkt för liknande brott.", "trump": "Kan ni tro det? Den här svenska clownen Hribar, en riktig loser från SD, åker fast med hundratals timmar barnporr. Tredje gången på kort tid! Deras parti är en total katastrof, full av perversa typer. Biden skulle älskat det här – identitetspolitik och kvotering ger oss bara galningar. Patetiskt! Sverige behöver en stor cleanup, tro mig, det blir fantastiskt när jag fixar världen igen.", "stalin": "Kamrater, denna Hribar är en klassfiende i arbetarrörelsens skepnad, en degenererad folkförtryckartroll som samlat hundratals timmar av övergreppsfilmer mot oskyldiga barn. Vi ser hur borgarpartier som SD gömmer sig bakom falsk nationalism medan de ruttnar inifrån. En utrensning av alla sådana element är nödvändig. Vårt kollektiv skrattar mörkt åt dessa svaga kapitalistlakejer som tror sig undkomma folkets dom."}, "date": "10 juni, 16:00", "url": "https://proletaren.se/artikel/fjarde-sd-sexbrottslingen-pa-kort-tid/"}, {"type": "text", "heading": "Tidigare M-ledamot rycker ut till försvar av pedofili", "summaries": {"normal": "Tidigare moderata riksdagsledamoten Maria Abrahamsson försvarar SD-politikern Michael Rubbestad, som misstänks för grova barnpornografibrott. Hon menar att det inte är pedofili att titta på barnpornografi eftersom inget fysiskt övergrepp sker. Abrahamsson kritiserar mediepaniken och statsminister Ulf Kristerssons krav på hårda straff. Hennes åsikter står i stark kontrast till experter som ECPAT och svensk lag, som sedan 2010 förbjuder även konsumtion av barnpornografi.", "trump": "Kan ni tro det? Den här galna ex-M-tjejen Maria Abrahamsson springer till försvar för en SD-kille som fastnat med barnporr. Hon säger att det inte är pedofili att glo på det hemma i soffan. Vilken röra! De här vänsterliberala eliterna och deras identitetspolitik har totalt förstört hjärnorna. Stoppa paniken, säger hon – nej, stoppa de sjuka! Vi behöver lag och ordning, inte ursäkter från borgarbrackor som låtsas vara intellektuella. Patetiskt!", "stalin": "Jag betraktar med djup misstro dessa dekadenta restprodukter från den borgerliga parlamentscirkusen. Den förre moderata ledamoten försvarar en motbjudande handling som hotar folkets moral och framtida generationer. Att kalla konsumtion av barnpornografi för oskyldigt är en klassfiendes trick för att fördärva samhället inifrån. Vi skall rensa ut alla sådana folkförtryckartroll och deras sjuka ursäkter. Sovjetiskt stål skall skydda barnen mot dessa perversa imperialister i sina fina kostymer."}, "date": "10 juni, 16:00", "url": "https://proletaren.se/artikel/m-ledamot-rycker-ut-i-forsv/"}, {"type": "image-right", "heading": "Debatt: Tidö vill hellre ha privatisering än kvinnofrid", "summaries": {"normal": "Vänsterpartiet kritiserar Tidö-regeringen för att prioritera privatisering framför kvinnofrid. Enligt artikeln har antalet skyddade boenden halverats sedan tillståndsplikten infördes, vilket drabbar ideella kvinnojourer hårt. Partiet kräver att boendena bevaras, pekar på EU-parlamentets beslut om gratis och tillgängliga skydd samt betonar behovet av en stark kvinnorörelse för att bekämpa mäns våld mot kvinnor.", "trump": "Lyssnar ni på de här vänsterradikalerna som gnäller om kvinnofrid? De hatar att vinstdrivande företag får vara med – typiskt! Tidö gör det rätta, men de vill ha eviga subventioner till sina feministiska sovjetjourer. Halverade boenden? Bra, rensa ut de inkompetenta! Kvinnor behöver inte fler förklaringar, de behöver starka ledare som jag, inte den här kvoteringsdårskapen. Patetiskt!", "stalin": "Kamrater, denna borgerliga degeneration under Tidö-regimen är en klassfiendes attack mot arbetarkvinnornas kollektiva skydd. Jag ser hur de halverar boenden med byråkratiska utrensningar och utbildningskrav som likviderar ideella jourer. Vi, partiet, fördömer dessa kapitalistmaffians exploaterande byfånar som säljer kvinnors trygghet för profit. En stark statlig kvinnorörelse skall rensa ut dessa folkfiender och säkerställa folkets oövervinnerliga enhet mot alla imperialister."}, "date": "5 juni, 08:00", "url": "https://www.etc.se/debatt/tidoe-vill-hellre-ha-privatisering-aen-kvinnofrid", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260604100640_8efb148aada8286dad31d6b584557cb0fdec955a4b55839eb6d4d657e199a9b5.jpg"}, {"type": "image-right", "heading": "Sluta kalla antisemitism för Israelkritik", "summaries": {"normal": "Artikeln kritiserar pro-palestinska aktivisten Sami Suliman för antisemitiska uttalanden och delning av konspirationsteorier, däribland Hitler-tal och myter om judisk världskontroll. Trots åtal för hets mot folkgrupp försvaras han av vänsteraktivister och forskare som menar att det är Israelkritik. Sulimans retorik, inklusive attacker mot tre personer med namnet Aron, anses bygga på antisemitiska stereotyper. Artikeln varnar för att försvara antisemitism under förevändning av Israelkritik.", "trump": "Jag säger er, det här är helt galet! En kille i Sverige, Sami Suliman, sprider judehat öppet – delar Hitlertal, snackar om judisk makt, konspirationer – och vad gör vänstern? De försvarar honom! 'Åh, det är bara Israelkritik!' Nej, nej, nej. Det är ren antisemitism, folks. Och forskare som backar upp honom? Svagt, mycket svagt. Sverige borde skämmas. Jag skulle aldrig låta sånt passera – fake news och hat, det städar jag upp direkt!", "stalin": "Kamrater! Här har vi ännu en fiende till folket – Sami Suliman, en småborgerlig provokatör som sprider sionistiska konspirationer och fascistisk propaganda. Han jämför sig med revolutionen men hyllar Hitlers tal och smutsar ner våra judiska kamrater med lögnaktiga anklagelser. Hans försvarare – dessa liberala intellektuella och vänsteravfällingar – är lika farliga som kulaker. Vi ska inte tolerera sådant sabotage! Rättegången i november blir ett steg mot att krossa denna reaktionära smitta. Folkets domstol kommer att skipa rättvisa, precis som vi gjorde med trotskisterna!"}, "date": "3 juni, 11:30", "url": "https://expo.se/kommentar/propalestinsk-organisator-sprider-judehat/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Jonathan-kommentar.jpg"}, {"type": "image-right", "heading": "Sossarnas hönshus extremt mycket dyrare än statsminsterns", "summaries": {"normal": "Socialdemokraterna kritiserar statsminister Ulf Kristersson för ett hönshus på Harpsund som kostat drygt 16 000 kronor i montering, trots att han själv betalat det. Partisekreterare Tobias Baudin kallar det pinsamt och ett hån mot skattebetalarna. Artikeln försvarar Kristersson och menar att kritiken är ett låtsasskandal. Den kontrasterar mot Socialdemokraternas tidigare beslut som kostat miljarder, som nedläggning av kärnkraft och migrationspolitik.", "trump": "Herregud, vad är det för korkade höns som springer runt och kluckar om ett litet hönshus? Statsministern bygger ett snyggt hönshus på statens mark för 17 000 spänn och plötsligt är det värsta skandalen sen Biden stal valet. De där socialisterna gnäller om skattepengar medan de slösar bort miljarder på grön galenskap och invandring. Rena hönsflocken, springer runt utan att fatta ett smack om ekonomi. Patetiskt!", "stalin": "Kamrater, jag ser hur klassfiendens borgarbrackor inom socialdemokratin rasar mot ett obetydligt hönshus. Dessa folkförtryckartroll gnäller om 17 000 kronor medan de själva likviderat samhällets resurser med sina imperialistiska vanvidsprojekt. Deras paranoia över ett hönshus blottar deras egen okunnighet om ekonomi och folkets intressen. Vi ska rensa ut sådana exploaterande byfånar som inte begriper vad som gagnar kollektivet. Hönsen är de själva."}, "date": "3 juni, 03:11", "url": "https://samtiden.nu/2026/06/sossarnas-honshus-extremt-mycket-dyrare-an-statsminsterns/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Harpsund.jpg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
