 efter att USA genomfört attacker mot avfyrningsramper i Iran. Kina har släppt ett inköpschefsindex för industrin som var högre än väntat. Flera bolag, däribland Academedia och Mycronic, har presenterat nya rapporter och mål.", "trump": "Börserna faller för att svaga ledare inte har koll på läget, men min olja i USA stiger – precis som den ska, enorma siffror! Iran behövde en ordentlig smäll, och vi fixade det, väldigt snabbt och väldigt kraftfullt. Kina försöker fuska till sig bättre industrisiffror, men det lurar ingen. Academedia och Mycronic levererar i alla fall, till skillnad från Fake News!", "stalin": "De dekadenta börserna i väst vacklar under tyngden av sitt eget kapitalistiska förfall, medan våra ärorika bomber i Iran sänder ett nödvändigt budskap om disciplin. Kinas byråkrater kämpar på med sina index. Vi noterar med tillfredsställelse att Academedia ökar sin produktion; varje medborgare måste fostras rätt. Avvikelser tolereras icke."}, "date": "31 augusti, 08:46", "url": "https://www.affarsvarlden.se/artikel/oljan-stiger-borserna-pekar-nedat", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/02/sdlsCSFJlaQjtc-nh-400x247.jpg"}, {"type": "image-right", "heading": "USA till attack – första gången på en månad", "summaries": {"normal": "Den amerikanska militären har genomfört en attack mot iranska avfyrningsramper i Hormuzsundet, den första på över en månad. Explosioner hördes vid ön Larak. Enligt uppgifter var Iran på väg att lägga ut nya minor. Iran rapporterar döda soldater och civila samt lovar hämnd. USA har inte bekräftat attacken officiellt.", "trump": "Folket, vi har just satt stopp för de galna mullornas minor i Hormuzsundet. Boom! Första gången på en månad och redan vinner vi stort igen. Biden lämnade en sådan röra, men nu vakar vi över handelsflödet som riktiga vinnare. Iran gråter som förlorare – patetiskt!", "stalin": "Kamrater, se hur de imperialistiska banditer från Washington återigen blottar sin rädsla genom att bomba iranska positioner. Deras så kallade frihet är bara en mask för att kväva folkets vilja. Vi ler i skuggorna åt deras paranoia. Straffet kommer, som alltid, från historien själv."}, "date": "31 augusti, 06:10", "url": "https://www.tv4.se/artikel/58481qzfZcpDg97k23VXlL/iran-utlovar-haemnd-efter-ny-attack", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdl_ElT6mWJb10%2F1e0c6efab9a9aef580055aaebcef70a2%2FFartyg_i_Hormuzsundet_den_5_augusti_i_ar.&width=1024"}, {"type": "image-full", "heading": "USA:s militärtoppar vill trappa ner Irankriget", "summaries": {"normal": "USA:s högsta militära chefer varnar försvarsminister Pete Hegseth för att de storskaliga operationerna mot Iran är ohållbara. I ett hemligstämplat underlag motsätter sig befälhavare vidare insatser i Mellanöstern eftersom det riskerar att försvaga landets förmåga att möta andra hot efter sex månaders krig och över 50 000 soldater i beredskap.", "trump": "Generenerna gråter till min försvarsminister! De har haft femtiotusen soldater i sanden och skickat båtar hit och dit i sex månader. Löjligt! Våra styrkor är fantastiska, absolut bäst i världen, men till och med militären fattar att det här var för mycket och för länge. Vi fokuserar på America First, inte eviga krig!", "stalin": "Dessa svaga generaler darrar inför en liten ansträngning i öknen! Femtio tusen soldater i beredskap och de klagar över att det är 'för länge'. Om de inte kan lyda utan att gråta till försvarsministern över ett hemligt papper, vet vi exakt var sommarstugan i Sibirien ligger för sådant bristande fosterlandssinne!"}, "date": "30 augusti, 15:01", "url": "https://kvartal.se/nyheter/artiklar/usas-militartoppar-vill-trappa-ner-irankriget/cG9zdDoxNzgzNDM", "imageUrl": "https://images.kvartal.se/2026/08/f7ca198a-hegseth.webp"}, {"type": "image-right", "heading": "Jobbade 155 dagar i sträck – behövde ända sälja sex för att klara sig", "summaries": {"normal": "Massörer på thaimassagesalonger i bland annat Jönköping och Stockholm har arbetat under extrema förhållanden, upp till 155 dagar i sträck, ofta ensamma i källare. Låga löner har tvingat flera att sälja sex. Nu åtalas en man i 60-årsåldern och en kvinna i 45-årsåldern för grov människoexploatering och grovt koppleri.", "trump": "Titta på det här, det är en total katastrof! Dessa stackars kvinnor tvingas arbeta som slavar i källare och sälja sig för att överleva medan de woke-domarna och byråkratiska hyenorna bråkar om vad som egentligen är exploatering. Biden lät det här pågå i fyra år – nu fixar jag det på riktigt. Amerika först, även mot de svenska massagesalongsskandalerna!", "stalin": "Se hur de profitthungriga klassfienderna driver arbetarkvinnor till botten av samhället, tvingar dem att bo och arbeta i mörka källare och sälja sin kropp för bröd. Detta är den sanna rösten av det dekadenta systemet. Vi måste rensa ut alla parasiterande exploatörer som gömmer sig bakom lagar. Rättvisan kräver järnhand mot sådana fiender till folket."}, "date": "30 augusti, 11:00", "url": "https://arbetet.se/2026/08/30/massorer-jobbade-155-dagar-i-strack-behovde-anda-salja-sex-for-att-klara-sig", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28150325/massage.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Från labb till elnät: Nu storsatsar oljegiganterna på fusion", "summaries": {"normal": "Kärnfusion lockar nu stora investeringar från oljejättar som Eni, Equinor och Chevron. Med miljarder dollar i privat kapital och tekniska framsteg, såsom Commonwealth Fusion Systems nätanslutningsansökningar, börjar fusion betraktas som en industri snarare än enbart forskning. Utmaningar kring tritiumförsörjning kvarstår, men flera projekt siktar på kommersiell elproduktion inom de kommande årtiondena.", "trump": "Oljegiganterna gör nu det de alltid gör – de vinner! De satsar miljarder på fusion, fantastisk teknik. Inga fler vänsterliberala drömmar om katastrofal solenergi. Vi pratar om riktig kraft, producerad av våra bästa oljebolag. Det är en enorm vinst för America First. Medan de radikala demokraterna pratar, bygger vi framtiden. Fusion? Det blir enormt, kanske det största någonsin, tro mig!", "stalin": "Dessa kapitalister försöker desperat tämja stjärnornas eld för att rädda sina vacklande imperier. De kastar miljarder på 'fusionskraft' likt desperata gamblers. Men minns detta: även om de bygger sina reaktorer, så är tritium en nyckfull tjänare. Om de inte kan kontrollera sitt bränsle i slutna kretslopp, kommer deras projekt att kollapsa likt en dåligt planerad femårsplan. Vi bevakar deras experiment med största misstänksamhet."}, "date": "30 augusti, 06:30", "url": "https://www.realtid.se/it-tech/fran-labb-till-elnat-nu-storsatsar-oljegiganterna-pa-fusion", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/fusion.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Barn måste skyddas från sexindustrins marknadsföring", "summaries": {"normal": "Artikeln argumenterar för att en 18-årsgräns på OnlyFans inte räcker för att skydda barn. Marknadsföring av sexindustrin sker på vanliga sociala medier genom influencers som framställer plattformen som en väg till rikedom och frihet. Organisationen, grundad av överlevare, varnar för normalisering och glorifiering som kan fungera som grooming. Regeringen bör utreda bättre skydd mot sådan påverkan.", "trump": "Folk, det här är en total katastrof. Dessa sjuka OnlyFans-typer och deras vänsterliberala vänner på sociala medier förgiftar våra barn med sin perversa lycka-säljer-grej. Den lyckliga horan-myten? Patetiskt. Biden lämnade en gränslös digital sopstation efter sig, men nu fixar jag det – vi ska krossa den här dekadenta sexindustrins grooming-maskin innan den äter upp nästa generation. Fantastiskt viktigt!", "stalin": "Kamrater, jag betraktar med avsky hur de profitthungriga klassfienderna på OnlyFans och deras digitala lakejer normaliserar exploatering genom glittrande lögner om frihet. Denna grooming via upprepade narrativ är en fiende till folket. Vi måste rensa ut dessa parasiterande hyenor och deras borgerliga myter. Barnet ska inte förgiftas – staten likviderar sådana hot mot den kollektiva moralen med järnhand."}, "date": "29 augusti, 06:00", "url": "https://www.etc.se/debatt/barn-maaste-skyddas-fraan-sexindustrins-marknadsfoering", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260828090844_098e5c47-682f-4ac0-9f15-fa2a658301e1.jpg"}, {"type": "image-right", "heading": "Folket står knappast bakom Tidöpakten", "summaries": {"normal": "Novak och Sundström granskar Tidöregeringens fyra år vid makten i rapportserien Skymningsläge. De kritiserar hur regeringen forcerat lagstiftning, kortat remisstider, styrt utredningar och ignorerat experter. Författarna varnar för att demokratiska processer och rättssäkerhet åsidosatts till förmån för snabb politisk styrning, något som påminner om autokratiska tendenser i andra länder.", "trump": "Folk, ni borde se det här! Den här svenska Tidöregeringen kör som en galen bulldozer, precis som jag gjorde fast de glömde att vinna stort. De kör över alla byråkrater och experter, vilka är totala losers, och levererar resultat istället för att lyssna på de woke, identitetspolitiska snyltarna som förstör allt. Sverige vaknar äntligen upp – bra jobbat, grabbar! Men ni behöver mig som inspiration.", "stalin": "Kamrater, dessa dekadenta folkförtryckare i den svenska regeringen visar återigen hur de giriga maktparasiterna föraktar folkets vilja. De forcerar lagar, styr utredningar och skrattar åt experter som om de vore kontrarevolutionära spioner. Jag ler från historien – snart kommer utrensningen av sådana falska demokrater. Deras skymningsläge är bara början på det oundvikliga folkets dom."}, "date": "29 augusti, 01:43", "url": "https://www.dagensarena.se/opinion/folket-star-knappast-bakom-tidopakten", "imageUrl": "https://www.dagensarena.se/files/2026/08/dmekrat.jpeg"}, {"type": "image-right", "heading": "Vad ska man rösta på i riksdagsvalet?", "summaries": {"normal": "Artikeln argumenterar för att rösta på Kommunistiska Partiet i kommun- och regionval istället för etablerade vänsterpartier. Författaren ser de traditionella vänsterpartierna som ointressanta och likställda med högern i nedskärningspolitik och militärstöd. En kommunistisk röst ses som en verklig opposition för fred, välfärd och arbetarklassens intressen.", "trump": "Folk, de här trötta vänstersossarna och kommunisterna är en total katastrof, de största förlorarna ni någonsin sett. De pratar revolution men lever som dekadenta elitparasiter som älskar nedskärningar och krigsmaskiner. Rösta på mig – jag menar på de riktiga vinnarna, inte på dessa patetiska snuttefiltssossar som hatar Amerika och friheten. Sad!", "stalin": "Kamrater, dessa profitthungriga klassförrädare inom den så kallade vänstern är blott lakejer åt monopolkapitalet. Deras falska opposition är en fars som göder imperialismen och folkmordet. Jag ser med förakt hur de förgiftar arbetarklassen. Endast en kompromisslös, stålhård linje kan rensa ut dessa dekadenta element och föra fram den verkliga kampen. Svaghet är döden."}, "date": "27 augusti, 14:44", "url": "https://proletaren.se/artikel/vad-ska-man-rosta-pa-i-riksdagsvalet", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/povel-1-768x432.png"}, {"type": "image-right", "heading": "SD:s största problem är 20 somaliska bussförare", "summaries": {"normal": "Artikeln diskuterar Sverigedemokraternas största utmaning: 20 somaliska bussförare i Skaraborg som sjukskrev sig i protest mot partiets annons om återvandringsbidrag. Författaren menar att detta visar att en återgång till ett Sverige före invandringen är omöjlig, då många med utländsk bakgrund är nödvändiga för samhällets funktion. Händelsen ses som ett strategiskt problem för SD.", "trump": "Folk, ni måste höra det här – de där galna SD-typerna i Sverige trodde de kunde köra sin Mogadishu-reklam på bussarna utan att de somaliska förarna skulle slå tillbaka. Boom, de sjukskrev sig allesammans! Plötsligt står bilarna stilla. Så mycket för deras dröm om ett rent, vitt Bullerbyn. De woke busschaufförerna och deras kvotefanatiker har just visat att identitetspolitiken slår tillbaka som en boomerang. Patetiskt!", "stalin": "Kamrater, se hur de profitthungriga klassförrädarna i Sverigedemokraterna avslöjar sin lögn. Tjugo arbetare av somaliskt ursprung, sanna produktionshjälter, vägrar lyda och lägger ner arbetet. Det är klasskamp i sin renaste form! Deras dröm om ett rent folkhem är en borgerlig fantasi som vi länge känt lukten av. Arbetarna har makten att stoppa maskineriet – låt detta bli en varning för alla folkförtryckare. En utmärkt lektion i dialektik."}, "date": "26 augusti, 10:55", "url": "https://www.flamman.se/sds-storsta-problem-ar-20-somaliska-bussforare", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/sd-w.jpg?aspect_ratio=4:3&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Som utrikesminister vill Morgan Johansson höja biståndet med 20 miljarder", "summaries": {"normal": "Morgan Johansson aspirerar på att bli utrikesminister om Socialdemokraterna vinner valet. Han lovar höjt bistånd med 20 miljarder kronor, återgång till 1-procentsmålet, feministisk utrikespolitik samt hårdare linje mot Israel inklusive handelsstopp. Fokus ligger på ökat stöd till Afrika och Afghanistan samt stärkt FN-roll.", "trump": "Den här röda clownen Johansson vill slänga bort svenska skattepengar till korrupta afrikanska hålor och talibanerna. Totalt vansinne! Han hatar Israel som jag älskar, och kommer att förstöra relationen med USA medan Putin skrattar. Patetiskt. Sverige behöver inga sådana losers vid makten, tro mig.", "stalin": "Jag ser en ynklig socialdemokrat som vill mata korrupta regimer med arbetarklassens pengar medan han angriper den sionistiska fienden. Sådana svaga element underminerar nationens styrka. FN domineras av våra andliga arvtagare, men dessa reformister är bara användbara idioter. De kommer att ångra sin brist på verklig järnhand när historien dömer dem."}, "date": "23 augusti, 03:50", "url": "https://samtiden.nu/2026/08/som-utrikesminister-vill-morgan-johansson-hoja-bistandet-med-20-miljarder", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6854-640x360.jpeg"}]</script>

            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        // ============================================
        // COOKIE-FUNKTIONER
        // ============================================
        function setCookie(name, value, days = 365) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + d.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }

        function getCookie(name) {
            const cName = name + "=";
            const decoded = decodeURIComponent(document.cookie);
            const ca = decoded.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') {
                    c = c.substring(1);
                }
                if (c.indexOf(cName) === 0) {
                    return c.substring(cName.length, c.length);
                }
            }
            return "";
        }

        function loadSettingsFromCookies() {
            const theme = getCookie("news_theme") || "light";
            const view = getCookie("news_view") || "normal";
            const writer = getCookie("news_writer") || "normal";
            return { theme, view, writer };
        }

        function saveSettingsToCookies(theme, view, writer) {
            setCookie("news_theme", theme);
            setCookie("news_view", view);
            setCookie("news_writer", writer);
        }

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(theme, uiState.view, uiState.writer);
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(uiState.theme, v, uiState.writer);
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
            
            saveSettingsToCookies(uiState.theme, uiState.view, style);
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            const savedSettings = loadSettingsFromCookies();
            
            setTheme(savedSettings.theme);
            setView(savedSettings.view);
            setWriterStyle(savedSettings.writer);

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
