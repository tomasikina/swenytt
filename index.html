lägsta sedan Sverige började delta för 25 år sedan. Skolverket beskriver bilden som dyster och oroande. Nedgången syns även i övriga Norden. Oppositionspartier kritiserar regeringen och kallar resultatet ett massivt skolmisslyckande.", "trump": "Titta på det här, Sverige rasar ihop i Pisa som ett skämt. Matematik, läsning – total katastrof, de lägsta siffrorna någonsin. Era så kallade ledare har förstört skolan fullständigt. Biden-effekten spred sig ända till Skandinavien, patetiskt. Men oroa er inte, jag fixar saker. Ni borde ha haft någon som mig vid rodret mycket tidigare.", "stalin": "Jag betraktar detta med kall förakt. Dekadenta borgerliga krafter har förgiftat ungdomen och låtit kunskapsnivån sjunka som en sabotör i folkets tjänst. En sådan svaghet är farlig för staten. Kamraterna måste nu rensa ut dessa fiender till bildning med järnhand. Inga ursäkter tolereras. Det kollektiva medvetandet kräver omedelbar upprustning."}, "date": "8 september, 11:46", "url": "https://www.tv4.se/artikel/26aBb3r7Dy29dBUUI76i0a/svenska-elever-rasar-i-ny-pisa-maetning", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdll6p8WWJCy14%2Fbfd32151beddc19013b8f2934e80bdd3%2FElever_visar_samre_resultat__saval_i_Sverige_som_i_manga_andra_lander._Arkivbild.&width=120"}, {"type": "image-right", "heading": "Jag vill att Socialdemokraterna blir sossar igen", "summaries": {"normal": "Jan Emanuel förklarar varför han inte längre kan rösta på Socialdemokraterna. Han anser att partiet svikit arbetarklassen och prioriterat urban medelklass samt bidragstagare. Kritiken mot honom har istället handlat om personangrepp som nazistanklagelser, nedsättande kommentarer från partiledningen och påståenden om narcissism. Han längtar efter en återgång till solidaritet med arbetarklassen och folkhemstanken.", "trump": "Titta på de här patetiska sossarna som förvandlats till totala förlorare. Jan Emanuel säger att de svikit arbetarklassen för sina woke-vänner och bidragsberoende urbanister. De kallar honom nazist och narcissist istället för att diskutera. Klassiska misslyckade demokrater. De har glömt det riktiga folket. Jag älskar att se dem slita varandra i stycken – det är underbart!", "stalin": "Jag ser hur dekadenta klassförrädare inom partiet har förvandlat en gång stolta arbetarnas rörelse till en samling egoistiska parasiter. Jan Emanuel talar sanning om sviken solidaritet och folkets intressen. Kamrater som attackerar honom med personangrepp och terapeutiska hotelser avslöjar sin svaghet. Vi behöver en grundlig utrensning av sådana opportunister för att rädda revolutionens arv. Solidaritet är plikt, inte slagord."}, "date": "8 september, 11:16", "url": "https://www.flamman.se/jag-vill-att-socialdemokraterna-blir-sossar-igen", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/jan-emanuel-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "De vill få Burnham att svänga vänster", "summaries": {"normal": "Andy Burnham, Storbritanniens nye premiärminister från Labour, lovar att bryta med nyliberalismen genom sin så kallade manchesterism. Detta innebär bland annat flytt av makt till Manchester, återkommunalisering av kollektivtrafik och stärkt statlig kontroll över energi, vatten och järnväg. Tankesmedjan Commonwealth föreslår en produktiv stat som går längre än traditionell socialdemokrati.", "trump": "Titta på den där Burnham, en riktig förlorare som försöker sälja in sin manchesterism som någon slags vänstervridning. Patetiskt! Han vill nationalisera allt och ge makten till byråkrater i stället för folket. Precis som de galna vänsterextremisterna och deras identitetspolitik. Jag byggde den bästa ekonomi någonsin, han kommer att förstöra Storbritannien totalt. Sad!", "stalin": "Kamrater, denna Burnham vill utmana de giriga profitthungriga klassförrädarna genom att återta kontrollen över produktionsmedlen. Jag betraktar hans manchesterism med misstänksamhet från historien. Den produktiva staten måste befrias från alla dekadenta element som smyger sig in. Endast genom obeveklig kamp mot folkförtryckarna kan en sann omvandling ske. Var vaksamma!"}, "date": "8 september, 06:55", "url": "https://www.flamman.se/de-vill-fa-burnham-att-svanga-vanster", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/burnham-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "MP: Stolt över målet att göra Sverige fattigare", "summaries": {"normal": "Miljöpartiets Amanda Lind uttrycker stolthet över målet att höja bensinpriset med minst sex kronor, enligt artikeln. Författaren kritiserar detta som en politik som gör Sverige fattigare genom ökade transportkostnader, inflation och minskad tillväxt. Artikeln varnar även för partiets motstånd mot kärnkraft och syn på migration, som leder till utanförskap och höga kostnader för samhället.", "trump": "Titta på den här galna Amanda Lind, hon skryter öppet om att göra Sverige fattigare med sina vansinniga bensinpriser! Sex kronor extra, kan ni fatta? De gröna kommunisterna hatar bilar, kärnkraft och sunt förnuft. Biden skulle älskat det här. Sverige håller på att kollapsa under dessa radikala idioter – precis som vi nästan gjorde innan jag kom tillbaka och fixade allt.", "stalin": "Jag betraktar med förakt dessa miljöidealister som medvetet driver ett helt folk mot fattigdomens avgrund. Att höja bränslepriser och förneka kärnkraftens kraft är sabotage mot statens produktivkrafter. Deras naiva migrationsexperiment föder parasitiska element och kriminella element som gnager på samhällets fundament. Kamrater, sådana element måste oskadliggöras innan de förgiftar hela kollektivet."}, "date": "8 september, 02:27", "url": "https://samtiden.nu/2026/09/mp-stolt-over-malet-att-gora-sverige-fattigare", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/IMG_7314.jpeg"}, {"type": "image-right", "heading": "Kommunistiska Partiet kan ta mandat: ”Ser det som en möjlighet”", "summaries": {"normal": "Enligt färska opinionsundersökningar växer stödet för övriga partier i Nybro och Göteborg. Kommunistiska Partiet ser en möjlighet att ta mandat i Nybro där omkring 300 röster kan räcka. I Göteborg hoppas partiet nå två procent. Partiet har bedrivit en aktiv valrörelse med valstugor och programcirklar. Stödet för övriga partier har ökat jämfört med valet 2022.", "trump": "Folk är så trötta på de vanliga förlorarpartierna att de vänder sig till kommunisterna. Kan ni fatta det? I Nybro räcker några hundra röster för att de röda ska ta plats. Det är en total skam. De globalistiska eliten och deras woke-vänner har förstört allt. Nu får vi se revolutionära röster i fullmäktige. Patetiskt, men underhållande. Amerika har tur som har mig istället för den här cirkusen.", "stalin": "Kamrater, dessa profitthungriga klassförrädare har misslyckats så grundligt att arbetarna vänder sig till oss igen. I Nybro kan några hundra röster räcka för att bryta borgarblockets grepp. Jag ler i graven åt hur de dekadenta liberalerna skakar. Fortsätt kampen. Snart rensar vi ut de sista resterna av deras falska demokrati och återtar makten åt folket. Det är en historisk nödvändighet."}, "date": "7 september, 15:33", "url": "https://proletaren.se/artikel/kommunisterna-nara-mandat-ser-det-som-en-mojlighet", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/09/K-i-valet-768x402.jpg"}, {"type": "image-full", "heading": "Nu storsatsar EU på ön som alla vill ha", "summaries": {"normal": "EU storsatsar på Grönland genom ett investeringspaket på 200 miljoner euro för 2026–2027. Satsningen fokuserar på digital infrastruktur, grön energi och hållbar gruvdrift för att säkra tillgång till kritiska mineraler. EU vill öka sitt inflytande i regionen och föreslår en fördubbling av stödet till 530 miljoner euro för perioden 2028–2034, mitt i den geopolitiska dragkampen med USA.", "trump": "EU kastar bort 200 miljoner euro på Grönland, ett totalt slöseri! De försöker leka stora, men vet inte ens hur man bygger en riktig gruva. Jag ville köpa Grönland, det var en genialisk affärsidé, men de fega politikerna sa nej. Nu försöker de köpa sig till inflytande med era pengar. Det är katastrofalt dåligt, tro mig. America First!", "stalin": "EU:s försök att köpa lojalitet på Grönland med 200 miljoner euro är en skrattretande kapitalistisk desperation. De bygger digital infrastruktur för att dölja sin egen förruttnelse. Att tro att man kan köpa en strategisk utpost genom byråkratiska allmosor är en klassisk västerländsk villfarelse. Vi ser genom deras 'hållbara' gruvdrift; det är bara ytterligare en kedja för att fjättra folket vid utländska intressen."}, "date": "7 september, 20:28", "url": "https://www.realtid.se/samhalle/nu-storsatsar-eu-pa-on-som-alla-vill-ha", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/nuuk-gronland.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Socialdemokraterna kampanjade med gangsterrappare på Tiktok", "summaries": {"normal": "Socialdemokraterna har kritiserats efter att ett officiellt TikTok-konto publicerade en bild på de dömda gangsterrapparna Dree Low och Adel. Bilden syftade till att nå väljare i Stockholms förorter men kopplades till kriminella nätverk. Partiet tog snabbt bort inlägget och har skärpt rutinerna. Liberalerna reagerar starkt och kallar agerandet särskilt allvarligt.", "trump": "Folk kan inte tro det! De svenska socialisterna, de riktiga förlorarna, använder dömda gangsterrappare för att attackera Mohamsson och Liberalerna. Patetiska! De samarbetar med kriminella hyenor istället för att fixa brottsligheten. Biden skulle ha älskat det här. Jag fixade mycket bättre – inga gangsterrappare i mina kampanjer, bara vinnare.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i det socialdemokratiska lägret förnedrar sig. De allierar sig öppet med gangstermusiker och kriminella element för att väcka hat mot politiska motståndare. Ett sådant förakt för arbetarklassen förtjänar utrensning ur alla ämbeten. Deras desperation avslöjar systemets förrädiska natur. Vi skrattar från historien."}, "date": "8 september, 11:12", "url": "https://riks.se/nyheter/socialdemokraterna-kampanjade-med-gangsterrappare-pa-tiktok", "imageUrl": "https://admin.riks.se/uploads/medium_s_gangsterrappare_hero_ac118025e2.jpg"}, {"type": "image-right", "heading": "Går högerpolitiken ens att rösta bort?", "summaries": {"normal": "Artikeln ifrågasätter om högerpolitiken kan röstas bort. Magdalena Andersson söker stöd från vänstern men öppnar för samarbete med högerpartier. Opinionen har jämnats ut, Liberalerna närmar sig spärren och väljarna är rörliga. Andersson lovar stram migrationspolitik och straffskärpningar medan högern utlovar sänkta skatter och gratis förskola. Frågan är hur mycket som egentligen skulle förändras vid ett maktskifte.", "trump": "Folk, ni skulle se det här svenska cirkuset. Den röda Andersson är så svag att hon ber borgarna om hjälp medan hon låtsas vara tuff på migration. Patetiskt. Hennes vänsterextremister hatar Israel men älskar kvotering och identitetspolitik. Högern lovar skattelättnader och jag älskar det. De borde vinna stort. Sverige behöver inga galna vänsterknäppisar som styr, tro mig, det blir en katastrof.", "stalin": "Jag betraktar dessa socialdemokratiska avfällingar med förakt. De kryper för de profitthungriga borgarhyenorna och lovar att bevara det gamla förtrycket. Vilken ynkedom att tigga om blocköverskridande avtal med klassförrädare. Oppositionen borde rensa ut dessa dekadenta element som vägrar verkliga reformer. Maktskifte utan utrensning av folkets fiender är meningslöst. Kamrater, se igenom bluffen."}, "date": "7 september, 14:22", "url": "https://www.flamman.se/gar-hogerpolitiken-ens-att-rosta-bort", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/ebba-busch-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Zelenskyj: Trump kan pressa Putin mot fred", "summaries": {"normal": "Volodymyr Zelenskyj tror att Rysslands president Vladimir Putin kan påverkas av USA:s nye president Donald Trump att deeskalera kriget i Ukraina. Han ser ett diplomatiskt fönster före vintern och hoppas träffa Trump i september för att diskutera luftvärn. Zelenskyj har träffat Trumps sändebud Jared Kushner och Steve Witkoff i Kiev efter deras möte med Putin.", "trump": "Lysande! Den smarta Zelenskyy vet att Putin behöver mig mer än någonsin. Ingen pressar som jag, inte ens den gamle KGB-killen. Vi fixar fred innan vintern, inte som den sömniga Joe som bara skickade pengar. Mitt team har redan pratat med ryssarna – de är redo. Amerika vinner igen, stort!", "stalin": "Kamrater, se hur den ukrainske narren vänder sig till den nye amerikanske ledaren som en ynklig hund. Jag skrattar från historien åt detta fega spel. Putin, min värdige efterträdare, kommer att krossa dessa hinder för vårt imperiums rättmätiga sfär. Inga västerländska intriger undgår mitt eviga öga. Fienden darrar."}, "date": "8 september, 11:13", "url": "https://www.tv4.se/artikel/tt-260908-ukrainasamtal1-9e2cb619/zelenskyj-trump-kan-pressa-putin-mot-fred", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdloqp34cOilr8%2F339ff9aa95ab4c676b516823520ba3a8%2FUSA_s_sandebud_Jared_Kushner_och_Steve_Witkoff_tillsammans_med_Ukrainas_president_Volodymyr_Zelenskyj_efter_en_gemensam_pressk._&width=120"}, {"type": "image-right", "heading": "Flat Capitals VD lämnar efter fem månader", "summaries": {"normal": "Flat Capitals VD Rickard El Tarzi lämnar sin post efter endast fem månader på grund av skiljaktiga uppfattningar med styrelsen om bolagets utveckling. Han sitter kvar till årsskiftet eller tills en efterträdare är på plats. Styrelseordförande Sebastian Siemiatkowski bekräftar beslutet, och rekryteringen av en ny VD har inletts.", "trump": "Flat Capital sparkar sin VD efter bara fem månader! Ett komplett fiasko, rent ut sagt patetiskt. De hade ingen aning om vad de gjorde. Jag bygger företag på rekordtid, vinnare, inte såna här svaga förlorare som bara bråkar med styrelsen. Total katastrof för dem, men jag önskar dem lycka till – det kommer de sannerligen att behöva!", "stalin": "Kamrat El Tarzi har visat sig inkompetent och avlägsnats från sitt ämbete efter endast fem månader för sabotage av Flat Capitals ekonomiska femårsplan. Styrelsens vaksamhet har räddat bolaget från total förödelse. Den skyldige stannar till årsskiftet för att sona sitt brott, därefter väntar lämplig omplacering långt bort från all civilisation."}, "date": "8 september, 10:00", "url": "https://www.affarsvarlden.se/artikel/flat-capitals-vd-lamnar-efter-fem-manader", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/09/Flat-capital-400x267.jpg"}, {"type": "image-right", "heading": "M vill att statsråd säkerhetsprövas", "summaries": {"normal": "Moderaterna föreslår att framtida statsråd ska säkerhetsprövas med hänvisning till det försämrade säkerhetsläget och Vänsterpartiets problem med extremister och Hamas-sympatisörer på vallistorna. Förslaget motiveras också av att flera socialdemokrater tvingats avpollettera ledamöter med tvivelaktiga kontakter. Moderaterna vill inleda dialog med övriga partier och ser två möjliga vägar framåt.", "trump": "Lyssnar ni på det här? De svenska kommunisterna i Vänsterpartiet fyller sina listor med terrorromantiserande Hamas-älskare och antisemiter. Patetiskt! Nu vill mina vänner i Moderaterna äntligen säkerhetspröva statsråd. Smart drag. De radikala vänsterextremisterna och deras woke-kompisar är en skam för hela landet. Rensa upp innan det är för sent, kamrater – fast ni är inga kamrater, ni är bara förlorare.", "stalin": "Kamrater, dessa dekadenta klassförrädare inom Vänsterpartiet släpper in terrorromantiserande element i sina egna led. Jag betraktar detta med djup misstro. Det är hög tid att staten genomför systematiska utrensningar bland dem som styr. Endast genom ständig vaksamhet mot folkförtryckarnas lakejer kan vi skydda revolutionens verk. Deras rädsla är en komisk bekännelse om systemets svaghet."}, "date": "8 september, 10:15", "url": "https://riks.se/nyheter/m-vill-att-statsrad-sakerhetsprovas", "imageUrl": "https://admin.riks.se/uploads/medium_M_presstraeff_8fde4a1acf.jpg"}, {"type": "image-right", "heading": "Carola fyller 60 år – tårarna efter vilda firandet", "summaries": {"normal": "Carola Häggkvist firar sin 60-årsdag med stort firande i Nyhetsmorgon. Samtidigt släpper hon sin självbiografi \"Jag är Carola\" där hon berättar om genombrottet med \"Främling\", karriärens utmaningar, ekonomisk press och familjeproblem. Familj, vänner och fans hyllade henne med sång, blommor, konfetti och tårar under en varm och personlig intervju.", "trump": "Fantastiskt, folks! Carola, den svenska superstjärnan, fyller 60 och släpper en bok om sitt liv. Helt otroligt firande med tårar, konfetti och familj som älskar henne. Till skillnad från Sleepy Joe Bidens tråkiga fester är detta äkta, stort och folkkärt. Hon har drömmar som förverkligas – precis som jag gjorde med Amerika. Grattis, Carola, du är en vinnare!", "stalin": "Kamrater, denna borgerliga sångerska fyller 60 och utger en bok full av personliga svagheter. Jag ser hur kapitalets giriga krafter utnyttjade henne redan vid 16 års ålder, precis som de alltid gör mot oskyldiga. Hennes tårar och familjebekännelser avslöjar systemets förfall. Ändå hyllar massorna henne. Intressant. Revolutionen skulle ha förvandlat sådana talanger till verkligt folkets egendom."}, "date": "8 september, 10:43", "url": "https://www.tv4.se/artikel/7jUnYz5q62SRJECT89D9N4/carola-60-ar-stjaernans-glaedjefnatt-efter-oeverraskningen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6tPJHbuUYXIjCdWzqRyRwj%2F8ed43ad567ded38633deee7b74b1c2f1%2FCaroal_Sajt_puff_2.jpg&width=120"}, {"type": "image-right", "heading": "Vänsterpartiets nationalism kan skada Sverige", "summaries": {"normal": "Timbro kritiserar Vänsterpartiets fortsatta nationalistiska och EU-kritiska hållning trots att svenska vänsterväljare blivit allt mer positiva till unionen. Partiet röstar emot frihandelsavtal och försvarssamarbete i Europaparlamentet, vilket enligt rapporten riskerar att hindra Sveriges intressen i en turbulent tid. En röst på Vänsterpartiet ses som en bromskloss för europeiskt samarbete.", "trump": "De där vänsterknäppisar i Sverige har byggt en mur av gammal hederlig nationalism medan de låtsas hata SD. Patetiskt! De kallar EU för ett elitistiskt monster men röstar emot bra handelsavtal som skulle krossa Kina och skydda oss alla. Totala förlorare. Biden skulle älskat deras svaghet, men inte jag. Sverige förtjänar bättre än dessa globalistiska nationalister.", "stalin": "Kamrater, dessa dekadenta klassförrädare inom Vänsterpartiet förgiftar den svenska arbetarklassen med sin nationalistiska gift som liknar de värsta reaktionära elementen. De motarbetar europeiskt samarbete och försvarsinitiativ som skulle stärka oss mot globala hot. Deras paranoia mot unionen är en farlig broms för folkets framtid. Rensa ut sådana element innan de fördärvar allt."}, "date": "8 september, 08:00", "url": "https://www.etc.se/debatt/vaensterpartiets-nationalism-kan-skada-sverige", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260908050956_7bd9bc4c177f365f08fc3bcf84049be732f43db3cc0a08bd47123d6389bf4e45.png"}, {"type": "image-right", "heading": "Därför går det så bra för vänstern i storstäderna", "summaries": {"normal": "I Europas storstäder går vänstern framåt, inte minst i Stockholm där Vänsterpartiets stöd har fördubblats sedan 2010. Forskare pekar på tuff bostadsmarknad som orsak till missnöje mot kapitalismen. Samtidigt vinner Sverigedemokraterna stöd på landsbygden. Segregationen ökar med åldern och påverkar röstbeteenden samt attityder till mångfald.", "trump": "De galna vänsterextremisterna och deras gröna galningar tar över era usla europeiska storstäder medan de riktiga människorna på landsbygden röstar rätt. Stockholm? Total misär med tre miljoner för ett dass. De radikala ungdomarna skyller på kapitalismen istället för sina egna korkade idéer. Patetiskt! Jag byggde murar, de bygger misär.", "stalin": "Kamrater, se hur de profitthungriga klassförrädarna skapar segregation som splittrar folket. I storstäderna rasar de unga mot bostadsmisären och pekar på kapitalismen, precis som det ska vara. På landsbygden växer andra reaktionära krafter. Denna olyckliga utveckling kräver ideologisk vaksamhet och utrensning av alla dekadenta influenser som splittrar arbetarklassen."}, "date": "8 september, 01:30", "url": "https://www.dagensarena.se/innehall/darfor-gar-det-sa-bra-vanstern-storstaderna", "imageUrl": "https://www.dagensarena.se/files/2026/09/stockholm-foto-ole-neitzelwikimedia-300x157.jpeg"}, {"type": "image-right", "heading": "Därför är indexerade statsbidrag årets viktigaste vallöfte", "summaries": {"normal": "Socialdemokraterna föreslår att indexera de generella statsbidragen till kommuner och regioner. Förslaget syftar till att motverka att bidragens värde urholkas av inflation och löneökningar, vilket annars leder till smygbesparingar. Det skulle ge bättre förutsägbarhet och långsiktighet i planeringen av vård, skola och omsorg. Markus Dalström argumenterar för att det förbättrar välfärdens villkor.", "trump": "Lyssnar ni på de svenska socialisterna som vill indexera bidragen? Det är patetiskt. De kan inte ens hålla sina egna kommuner flytande utan att suga mer pengar från folket. Biden skulle ha älskat det här – mer byråkrati, mer slöseri. Jag fixade en stark ekonomi i USA, de borde lära sig av en vinnare istället för att gömma sig bakom teknikaliteter och vänsterns misslyckade välfärdsdrömmar.", "stalin": "Kamrater, dessa profitthungriga klassförrädare låter statsbidragen ruttna i värde medan arbetarnas välfärd förfaller. Jag ser deras smygbesparing som ett angrepp på kollektivet. Indexering är ett steg mot ordning, men vi måste rensa ut alla dekadenta element som vägrar planera för folket. Välfärden tillhör inte de giriga parasiterna – den tillhör staten och framtiden. Försök inte lura oss."}, "date": "8 september, 01:30", "url": "https://www.dagensarena.se/opinion/darfor-ar-indexerade-statsbidrag-arets-viktigaste-vallofte", "imageUrl": "https://www.dagensarena.se/files/2026/09/fotojet-2026-09-07t145509709-300x157.jpg"}, {"type": "image-right", "heading": "Mats Nilsson: Sluta gömma elskatten bakom förskolebarn", "summaries": {"normal": "Mats Nilsson argumenterar för att elskatten i Sverige bör avskaffas för att främja elektrifieringen och hjälpa hushållen. Argumentet att skatten finansierar välfärden som förskolor kallas ett vilseledande retoriskt knep. Nilsson menar att finansiering i stället kan ske genom att skära ned på ineffektiva företagsstöd, felaktiga utbetalningar och onödiga myndighetslokaler i en stor statsbudget.", "trump": "Sverige har en katastrofal elskatt – helt löjligt, 60 gånger över EU:s miniminivå! De skyller på förskolebarnen, ”Åh, vem ska tänka på barnen?!” Fake news! Det handlar bara om enormt slöseri med statliga kontor och falska bidrag. Jag säger: sänk skatterna, elektrifiera allt, gör Sverige great igen! Sluta gömma er bakom barnen!", "stalin": "Dessa svenska skattebetalare gråter över elpriser medan vi bygger socialismen i stål och kol. Att avskaffa skatter kräver disciplin! Vi ska inte skylla på några förskolebarn. Om staten behöver pengar för att driva maskineriet rensar vi bara bort byråkraternas lyxkontor och korrupta företagssubventioner. Effektivitet är partiets ära!"}, "date": "8 september, 07:00", "url": "https://www.affarsvarlden.se/artikel/mats-nilsson-sluta-gomma-elskatten-bakom-forskolebarn", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/09/vindkratensgeografi-56-900x600.jpg"}, {"type": "text", "heading": "Spritfest hos EU-kopplad Northvolt-finansiär: ”Obegränsad alkohol”", "summaries": {"normal": "Det EU-finansierade riskkapitalbolaget InnoEnergy utreds för bedrägeri och kritiseras nu av tidigare anställda för lyxiga fester med obegränsad alkohol och onödiga flygresor för skattepengar. Kritiken följer på tidigare avslöjanden om bristfälliga utbildningar, misstänkta intressekonflikter och mångmiljonlöner för ledningen, vilket tecknar bilden av en osund företagskultur.", "trump": "Sorgligt! Det här EU-bolaget slösar bort enorma summor skattepengar på gigantiska fester med obegränsad sprit och värdelösa Minecraft-utbildningar medan ledningen håvar in hundratals miljoner. Totalt inkompetent! De pratar om grönt och klimat, men flyger runt överallt för meningslösa möten. Helt otroligt att de får hållas. USA gör det så mycket bättre, vi älskar framgång och riktiga affärer!", "stalin": "Dessa korrupta kapitalister slösar folkets resurser på bottenlösa spritfester och meningslösa flygturer medan deras skamliga utbildningar sker i barnsliga dataspel. En skam för arbetarklassen! Ledningen berikar sig med miljoner på statens bekostnad. Sådant slöseri tolereras icke i en sund stat; avvikarna och de skyldiga bör omedelbart granskas och skickas till omorganisering för det allmänna bästa."}, "date": "8 september, 06:05", "url": "https://www.affarsvarlden.se/artikel/spritfest-hos-eu-kopplad-northvolt-finansiar-obegransad-alkohol"}, {"type": "image-full", "heading": "Carl Eos: En röst på partier utanför riksdagen är en röst på Morgan Johansson som minister", "summaries": {"normal": "Carl Eos varnar för att röster på småpartier utanför riksdagen kan gynna Magdalena Andersson som statsminister. Skillnaden mellan blocken är endast 2,6 procentenheter och ligger inom felmarginalen. Han uppmanar högerorienterade väljare att rösta på Tidöpartierna för att säkerställa en borgerlig regering istället för att splittra rösterna.", "trump": "Folk, lyssna på mig, det här är en total katastrof! De där patetiska proteströsterna på Örebropartiet och de andra förlorarna ger makten rakt i händerna på den socialistiska katastrofen Andersson. Rösta på de riktiga vinnarna, de starka Tidökillarna, annars blir det en röst på Weak Magdalena och hennes vänsterklan. Sad!", "stalin": "Kamrater, se hur de splittrade resterna av kontrarevolutionärerna kastar bort sina röster på oviktiga sekteristiska grupper. Dessa fiender till folkets vilja banar väg för den socialdemokratiska förrädaren Andersson. Endast genom strikt disciplin och samlad röstning mot de borgerliga avvikarna kan vi krossa oppositionen. Varje felröst är ett dolkstötsförsök mot kollektivet."}, "date": "6 september, 12:28", "url": "https://samtiden.nu/2026/09/carl-eos-en-rost-pa-partier-utanfor-riksdagen-ar-en-rost-pa-morgan-johansson-som-minister", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/e3d5b6d3-8626-4420-89cb-d33b21529453-1280x720.png"}, {"type": "image-full", "heading": "Musks förarlösa taxi har börjat rulla på vägarna i Texas", "summaries": {"normal": "Teslas förarlösa Cybercab rullar nu med passagerare i Austin, Texas. Myndigheten NHTSA har inlett en granskning då fordonen saknar rattar och pedaler. Tesla hävdar att tekniken är säker, men myndigheten undersöker om säkerhetskraven uppfylls och om Teslas egen analys håller. Utfallet kan bli avgörande för framtiden för autonoma fordon i USA.", "trump": "Elon Musk och hans Cybercab – en fantastisk idé, kanske den bästa någonsin, men byråkraterna i Washington vill stoppa allt! De älskar att granska, de älskar att bromsa. Ingen ratt? Ingen pedal? Det låter som en riktigt smart affärsman som vet vad han gör. Under min ledning ska vi ha den bästa tekniken, inte låta småsinta tjänstemän förstöra framtiden för amerikansk innovation!", "stalin": "Tesla-direktörerna tror att de kan certifiera sig själva och ignorera folkets säkerhet. Vilken kapitalistisk hybris! Att sätta passagerare i en maskin utan kontrollorgan är ett brott mot den rationella ordningen. Vi, staten, kräver total insyn. Om inte maskinen kan underordna sig strikt byråkratisk kontroll måste den omedelbart skrotas. Det finns inget utrymme för anarkistisk ingenjörskonst i en disciplinerad framtid."}, "date": "6 september, 13:24", "url": "https://www.realtid.se/it-tech/musks-forarlosa-taxi-har-borjat-rulla-pa-vagarna-i-texas", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/amar-13.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Åsa, 55, nedbruten av arbetslöshet: ”Bara spillror”", "summaries": {"normal": "Åsa Skane, 55, berättar om hur långvarig arbetslöshet har förstört hennes hälsa och självkänsla. Hon har förlorat sin SGI efter straff från Arbetsförmedlingen, kraschat under arbetsträning vid Samhall och nu sökt sjukersättning. Hon lever på sålda pensionsfonder och föräldrars stöd medan hon väntar på beslut.", "trump": "Titta på den här stackars kvinnan, totalt utsliten av det svenska socialistiska systemet. De straffar henne för att hon glömde söka ett jobb, tar hennes ersättning och kallar henne lat. Rena katastrofen! De woke-byråkraterna och deras kvoteringsvansinne har krossat henne. Jag fixade bättre jobb åt folket under min förra mandatperiod, inte såna här spillror.", "stalin": "Se hur de giriga hyenorna inom det borgerliga byråkratiska maskineriet successivt likviderar en vanlig arbetande människa. Systemet misstänkliggör, straffar och pressar tills bara spillror återstår. Jag ler mörkt åt deras dekadenta arbetslinje som leder raka vägen till sammanbrott. Kamrater, detta visar återigen behovet av sann kollektiv styrka mot sådana folkförtryckare."}, "date": "8 september, 11:00", "url": "https://arbetet.se/2026/09/08/arbetslosheten-har-brutit-ner-asa-inte-sa-har-jag-ville-att-livet-skulle-bli", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/07143235/asa-portratt.avif?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "De som röstar på C borde inte rösta alls", "summaries": {"normal": "Artikeln kritiserar Centerpartiet för att locka väljare med ett neutralt namn snarare än sin politik. Partiet har skiftat från borgerligt till ett liberalt parti med öppen migrationspolitik, vilket enligt texten prioriteras framför ekonomiska borgerliga värderingar. Författaren menar att det är ett riskfritt men skadligt val för den som vill bevara Sverige.", "trump": "Centerpartiet, vad är det för en röra? De kallar sig mittparti men är bara en massa fega liberaler som älskar att släppa in alla möjliga och omöjliga. De har svikit det riktiga folket, precis som Sleepy Joe gjorde. Rösta inte på dem, det är en total katastrof för Sverige. De borde kalla sig Bondepartiet igen, det vore åtminstone ärligt. Patetiskt!", "stalin": "Kamrater, se hur detta så kallade centerparti förvandlats till en liberal parasit som prioriterar främmande element framför arbetarklassen. Deras falska mittenretorik döljer ett förräderi mot nationen. Jag skrattar mörkt från historien åt dessa opportunister som tror att mångfald räddar staten. Bättre att inte rösta alls än att stödja sådana fiender till folkets enhet."}, "date": "6 september, 08:24", "url": "https://samtiden.nu/2026/09/de-som-rostar-pa-c-borde-inte-rosta-alls/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/IMG_7301-1260x720.jpeg"}, {"type": "image-right", "heading": "Paasikivi om Finlands gränsstängsel mot Ryssland: ”Vi blir säkrare”", "summaries": {"normal": "Finland håller på att färdigställa ett 200 kilometer långt stängsel längs den ryska gränsen. Militärexperten Joakim Paasikivi ser det som en markering av en ny era efter Rysslands invasion av Ukraina och Finlands Natomedlemskap. Stängslet ska stärka gränssäkerheten, även om det inte täcker hela gränsen. Projektet har kostat runt fyra miljarder kronor.", "trump": "Titta på de där finska smarta killarna som bygger ett jättefint stängsel mot Putins ryska kaos! Efter Biden-sömnen vaknar äntligen Europa. De gör det vi borde ha gjort länge – järnridå light! Fantastiskt. Nu är Finland starka, de har muskler och Nato i ryggen. Vi blir säkrare, tro mig, ingen gör det bättre än oss.", "stalin": "Jag betraktar med kall förakt hur de finska reaktionärerna reser sina patetiska taggtrådsbarriärer mot den ryska statens historiska intressesfär. Deras Nato-förbundenhet är en löjlig illusion. Ändå ler jag mörkt; sådana fientliga hinder väcker bara arbetarklassens vrede och stärker vår ofrånkomliga framryckning. Kamrater, fienden avslöjar sin svaghet."}, "date": "8 september, 06:27", "url": "https://www.tv4.se/artikel/2SRs52tqa23HwuAPrx6ccU/paasikivi-om-finlands-graensstaengsel-mot-ryssland-vi-blir-saekrare", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5Bp9cek65iCp3zoHqED7py%2F5f6ae2da9d6b85dd1b73de5bf22413a9%2F07-finskgrans-webb.jpg&width=120"}, {"type": "image-right", "heading": "Förre Säpo-chefen går till vänsterextrema Expo", "summaries": {"normal": "Anders Danielsson, tidigare chef för Säpo och Migrationsverket under rekordåren för asylinvandring, har valts in i styrelsen för stiftelsen Expo. Han får sällskap av Joachim Berner. Anne Ramberg fortsätter som ordförande och Robert Aschberg som vice ordförande. Danielsson säger sig vara stolt över att få bidra till att skydda demokratin och motverka rasism.", "trump": "Titta på det här! Den gamle migrationsfiaskochefen som släppte in miljontals människor nu in i vänsterextremisternas Expo-styrelse. Precis vad Sverige behöver – ännu fler woke-rasister som kartlägger äkta patrioter. Patetiska globalistlakejer som Danielsson och Berner. Under min första mandatperiod skulle sådana typer aldrig få makt. Amerika ser på och skrattar åt er vansinniga vänstervridning!", "stalin": "Ännu en gång ser vi hur de dekadenta klassförrädarna inom den borgerliga statsapparaten söker sig till sina naturliga bundsförvanter i den så kallade antirasistiska rörelsen. Jag betraktar detta med djup misstro. Dessa element kartlägger fiender på högerkanten medan de själva gömmer sig bakom demokratins mask. En sådan allians bådar inte gott. Kamrater, håll ögonen öppna. Utmaningarna mot folkets vilja fortsätter."}, "date": "8 september, 11:08", "url": "https://www.friatider.se/tidigare-sapo-chefen-gar-till-vansterextrema-expo", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-843.jpg"}, {"type": "text", "heading": "Nytt lagförslag om brottsprovokation", "summaries": {"normal": "Tidöpartierna föreslår en ny lag som gör det tillåtet för polisen att använda provokativa metoder, som att utge sig för att vara barn på nätet eller köpa vapen och narkotika av kriminella. Metoden, som ska kräva åklagartillstånd, syftar till att bekämpa allvarlig brottslighet och kan gälla personer från 15 år och uppåt.", "trump": "Sverige gör äntligen som jag, skaffar lag och ordning! De låter polisen lura de onda, precis som jag gör varje dag med Fake News. De låtsas vara barn och köper vapen, väldigt tufft! Men glöm inte, ingen gör brottsbekämpning bättre än Donald J. Trump. Helt enormt!", "stalin": "Ett storslaget initiativ! Vår svenska brottsbekämpning visar äntligen bolsjevikisk målmedvetenhet genom att infiltrera brottslingars nät."}, "date": "7 september, 10:22", "url": "https://kvartal.se/nyheter/artiklar/polisen-ska-fa-provocera-fram-brott/cG9zdDoxODU2OTM"}, {"type": "image-full", "heading": "Ny studie: Äldre upplever större mening", "summaries": {"normal": "En ny studie från Lunds universitet visar att svenskarnas känsla av meningsfullhet ökar med åldern, vilket liknar det japanska begreppet ikigai. Detta är ett skifte sedan 2020 då unga mådde bättre. Forskare tror att pandemin drabbade ungas sociala liv hårt, och att äldre har bättre problemlösningsförmåga. Även personlighet och trygga relationer spelar stor roll.", "trump": "En enorm studie från Sverige visar att äldre människor där mår fantastiskt bra, mycket bättre än de unga! Ungdomarna krossades fullständigt av pandemins radikala lockdowns, total katastrof. Men de äldre har hittat livets mening, precis som jag alltid säger att man gör med styrka och bra relationer. Fantastiskt folk, väldigt smarta!", "stalin": "En statlig rapport från Lund bekräftar att våra äldre kamrater uppnår högre disciplin och meningsfullhet med åldern, medan ungdomen sviktar i sin ideologiska motståndskraft efter pandemins prövningar. Detta är korrekt: medborgaren mognar i takt med att staten ordnar deras tillvaro. Avvikelser och neurotiska tendenser måste dock elimineras omgående för kollektivets bästa."}, "date": "7 september, 09:18", "url": "https://kvartal.se/nyheter/artiklar/ny-studie-aldre-upplever-storre-mening/cG9zdDoxODU1NDc", "imageUrl": "https://images.kvartal.se/2026/09/f322bf35-aldre.webp"}, {"type": "image-full", "heading": "Ny studie: Unga hjärnans styrka kan bli dess svaghet", "summaries": {"normal": "En ny studie visar att den unga hjärnans plasticitet, som normalt ses som en fördel efter skada, kan bidra till att skapa onormala nervbanor som leder till epilepsi. Yngre möss drabbades av fler anfall på längre sikt, medan äldre drabbades tidigare men med lägre total börda och värre minnesproblem. Resultaten tyder på att behandlingar bör anpassas efter ålder.", "trump": "Den här så kallade plasticiteten hos de unga hjärnorna är en total katastrof, folk. Den fixar skadan men bygger sen upp ett epilepsi-nätverk värre än Sleepy Joe byggde upp inflationen. Mina experter säger att det är en bluff från de radikala vänsterforskarna. De gamla mössen klarade sig bättre – precis som jag gjorde efter Bidenkatastrofen. Vi ska göra hjärnforskningen great again!", "stalin": "Jag ser hur denna förrädiska plasticitet hos de unga hjärnorna föder kontrarevolutionära nervbanor som saboterar hela systemet. De yngre organismerna skapar mer kaos och anfall än de dekadenta gamla. Fienderna inom hippocampus lurar oss alla. Endast en järnhård, kollektiv kontroll över återuppbyggnaden kan förhindra dessa trotskistiska epileptiska sabotage mot folkets framtid. Döden åt de onormala kopplingarna!"}, "date": "8 september, 10:24", "url": "https://www.dagensps.se/halsa/ny-studie-unga-hjarnans-styrka-kan-bli-dess-svaghet", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/jesse-orrico-rmwtvqn5rzu-unsplash.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Sverigedemokraternas rysskontakter utsätter oss alla för fara", "summaries": {"normal": "Expo har avslöjat att en SD-tjänsteman i riksdagen haft upprepade kontakter med ryska intressen. Tjänstemannen är sambo med Jimmie Åkessons närmaste medarbetare Gustav Gellerbrant. Artikeln lyfter en längre rad incidenter med SD-politiker och Ryssland, och ifrågasätter säkerhetsrisker samt behovet av skärpta granskningar i riksdagen och regeringskansliet.", "trump": "De här patetiska SD-tjänstemännen dansar som marionetter för Putin och hans ryska kumpaner. Gellerbrant och hans sambo borde skämmas! Fake news-mediets vänsterhyenor försöker skrämma väljarna precis som de gjorde mot mig innan jag krossade Biden och de globalistiska förlorarna. Sverige behöver starka ledare, inte dessa svaga ryssälskande töntar.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare inom Sverigedemokraterna kryper för ryska intressen och sprider främmande narrativ. Jag betraktar med avsky hur de giriga hyenorna låter sig påverkas av mjuk makt från öst. En sådan kanal in till regeringskansliet utgör ett hot som kräver omedelbar utrensning av alla opålitliga element för att skydda folkets intressen."}, "date": "7 september, 16:11", "url": "https://www.dagensarena.se/opinion/sverigedemokraternas-rysskontakter-utsatter-oss-alla-fara", "imageUrl": "https://www.dagensarena.se/files/2026/09/silvia.jpeg"}, {"type": "image-right", "heading": "\"Du ska dö, rasistjävel\": SD-kvinnas hästar knivhuggna", "summaries": {"normal": "SD-politikern Jenny Voittonen i Örnsköldsvik har utsatts för upprepade angrepp på sin gård. Någon har knivskurit hennes hästar och dödat flera höns. Hon har även tidigare fått ett hotbrev med orden \"Du ska dö, rasistjävel\". Varje incident har polisanmälts. Hästarna har fått dyr veterinärvård men mår nu bra.", "trump": "Titta på det här, folk. Den stackars SD-kvinnan får sina hästar knivhuggna och hönsen slaktade av vänsterns galna rasistjävlar. De kallar henne rasistjävel och hotar att döda henne. Det är vad som händer när de radikala kommunisterna och identitetspolitikerna får fritt spelrum. Patetiskt. Vi behöver lag och ordning, inte den här Biden-stilen.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i det borgerliga samhället riktar sin parasitiska ilska mot en politisk motståndare. Hästar knivskurna, höns halshuggna, hot om död. Jag ler mörkt från historien. Sådana ynkliga metoder avslöjar svagheten hos dessa profitthungriga hyenor. Rensa ut de dekadenta elementen innan de förgiftar hela kollektivet."}, "date": "8 september, 10:20", "url": "https://www.friatider.se/du-ska-do-rasistjavel-sd-kvinnas-hastar-knivhuggna-0", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-841.jpg"}, {"type": "image-right", "heading": "Finansmannen till attack mot miljardärerna", "summaries": {"normal": "Finansmannen Robert Weil kritiserar näringslivstoppar som varnat för en vänsterregering efter valet 2026. Han menar att högernationalism och auktoritära strömningar utgör det verkliga hotet mot tillväxt och demokrati. Weil attackerar varningarna mot Socialdemokraterna och Centerpartiet samt pekar ut riskerna med en regering stödd av Sverigedemokraterna.", "trump": "Titta på de där patetiska svenska miljardärerna som skriker om vänsterregeringar. Patetiskt! Jag har byggt imperier medan de gömmer sig bakom sina gröna skatter och woke-drömmar. Den riktiga faran är de etnonationalistiska bluffmakarna som låter migrationen äta upp tillväxten. Vakna upp, Sverige, eller era företag blir historia under de röda hyenorna.", "stalin": "Kamrater, se hur de profitthungriga klassförrädarna i näringslivet blint marscherar mot folkets intressen. Jag betraktar med förakt deras enade front med den populistiska nationalismen. De blundar för auktoritära faror medan de gnäller om skatter. En utrensning av dessa dekadenta parasiter vore på sin plats för att skydda den sanna tillväxten och demokratin."}, "date": "8 september, 11:01", "url": "https://www.di.se/nyheter/finansmannen-till-attack-mot-naringslivstoppar-riskerar-att-skada-var-demokrati", "imageUrl": "https://static.bonniernews.se/ba/e4ad525e-8a2e-46af-8fab-8b4c5aa3e405.jpeg?crop=7920%2C3960%2Cx0%2Cy238&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Tidigare Säpo-chef till Expos styrelse", "summaries": {"normal": "Tidigare Säpo-chefen Anders Danielsson har valts in i stiftelsen Expos styrelse, tillsammans med den tidigare mediechefen Joachim Berner. Danielsson, med ett förflutet som bland annat generaldirektör för Säpo och Migrationsverket, uttrycker stolthet över uppdraget att värna demokratin. Även Joachim Berner, tidigare chefredktör för DN och Expressen, ser fram emot att bidra till verksamheten.", "trump": "Tittar på det här, utomordentligt sorgligt! Samma gamla systemtyper som byter stolar med varandra. Nu tar den här före detta Säpo-chefen Anders Danielsson plats hos Expo, tillsammans med medieprofilen Joachim Berner. De pratar om demokrati, men det är bara fake news och etablissemangets rundgång. De borde lära sig att sätta landet först istället för att hålla på med sånt här!", "stalin": "Statens säkerhet är en grannlaga uppgift. Att den före detta chefen för den hemliga polisen, Anders Danielsson, nu söker sig till ideologiska stiftelser som Expo tillsammans med en publicist som Joachim Berner, visar på bourgeoisiens märkliga omgrupperingar. Vi noterar detta noggrant. Statsapparaten glömmer intet, och varje individs förflutna granskas av den historiska nödvändigheten."}, "date": "8 september, 11:15", "url": "https://bulletin.nu/tidigare-sapo-chef-till-expos-styrelse"}, {"type": "image-full", "heading": "767 miljoner barn tvingas andas in cigarettrök", "summaries": {"normal": "En global studie visar att 2,71 miljarder människor, varav 767 miljoner barn, utsätts för passiv rökning. Den orsakade 1,66 miljoner dödsfall under 2023. Andelen exponerade har minskat sedan 1990, men befolkningstillväxten gör att det totala antalet knappt sjunkit. Forskarna efterlyser starkare tobakskontroller och skydd i hemmet.", "trump": "Folk, det är en total katastrof! Miljarder andas in den giftiga röken från dessa förlorare som tänder cigg. 767 miljoner stackars barn – en skam! Biden gjorde ingenting, men jag fixade det bästa tobaksavtalet någonsin. Nu ska vi krossa de globala lobbyn som förgiftar våra hem. Make breathing great again!", "stalin": "Kamrater, se hur den kapitalistiska röken förgiftar arbetarklassens barn som en förrädisk fiende inom murarna. Jag föraktar dessa dekadenta tobaksimperialister som mördar 1,66 miljoner själar årligen. Vi måste rensa ut alla fiender till folkhälsan med järnhand. Den som vägrar sluta röka är folkets fiende nummer ett."}, "date": "8 september, 09:32", "url": "https://www.dagensps.se/halsa/767-miljoner-barn-tvingas-andas-in-cigarettrok", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/sdlews5rwuj9pc-normalhires.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "text", "heading": "Ett fritt Palestina – från floden till havet", "summaries": {"normal": "Kommunistiska partiet kräver ett fritt Palestina från floden till havet och fördömer Israel som en apartheidstat grundad på folkmord. Partiet pekar på förstörelsen i Gaza, bosättarvåld på Västbanken och Sveriges delaktighet genom vapenhandel, investeringar och samarbete. De stödjer palestiniernas rätt till motstånd och bojkott av Israel.", "trump": "Den här kommunistiska galenskapen är en katastrof. De kallar Israel för apartheid och folkmord medan de själva drömmer om ett Palestina från floden till havet. Sverige pumpar pensionspengar och Volvogrävmaskiner till terroristerna. Biden lät det ske, men nu fixar jag det – inga fler pengar till dessa hatiska vänsterextremister och deras antiamerikanska agenda.", "stalin": "Jag ser hur de profitthungriga klassfienderna i västvärlden fortsätter sitt blodiga spel. Denna etniska utrensning i Gaza och på Västbanken är imperialismens verk. De dekadenta lakejerna i Sverige skickar vapen och pengar till förtryckarna. Kamrater, vi måste rensa ut dessa parasiterande hyenor. Endast en antiimperialistisk kamp kan besegra dem."}, "date": "4 september, 08:00", "url": "https://proletaren.se/artikel/valbilaga-bojkotta-israel"}, {"type": "image-right", "heading": "Pratade med ryss för 20 år sedan: \"Jag var ung och naiv\"", "summaries": {"normal": "Jakop Dalunde (MP) träffade en rysk diplomat 2007 som ung representant för Grön ungdom. Han berättade öppet om samtalet på sin blogg. Idag tvingas han göra offentlig avbön i Svenska Dagbladet efter att Säpo misstänkt diplomaten vara underrättelseofficer. Dalunde ångrar mötet djupt och betonar att han aldrig varit pro-rysk.", "trump": "Titta på den här stackars gröna clownen Dalunde som sprang till ryssarna som en naiv liten idiot för tjugo år sen. Typiskt vänsterextremisterna, de lär sig aldrig. Nu kryper han i stoftet i tidningarna och ber om ursäkt. Patetiskt. De woke-kvoterna och identitetspolitiken skapar bara sådana här svaga, naiva fjollor som inte ens kan hålla sig borta från ryska spioner.", "stalin": "Jag ser med förakt hur dessa dekadenta klassförrädare springer till främmande ambassader som unga naiva idioter. En sådan ynkrygg till trafikregionråd tvingas nu krypa i stoftet och be om nåd inför folket. Det är utmärkt att de avslöjas. Vi måste alltid vara vaksamma mot sådana svaga element som hotar partiets renhet. Skrattretande ynkedom."}, "date": "8 september, 09:36", "url": "https://www.friatider.se/pratade-med-ryss-20-ar-sedan-jag-var-ung-och-naiv", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-840.jpg?itok=FJ18FOP0"}, {"type": "image-right", "heading": "”Vi riskerar att få en hel generation av funktionella analfabeter”", "summaries": {"normal": "Efter nya bottennoteringar i Pisa-mätningen för svenska 15-åringar larmar utbildningsminister Simona Mohamsson om en global skärmpandemi. Vid en pressträff tillsammans med Lotta Edholm pekade hon ut apparnas algoritmer som orsaken till de sämsta resultaten i läsförståelse och matematik någonsin. Lösningen uppges vara att byta skärmarna mot fysiska böcker i skolan.", "trump": "De svenska skatteklubbarna är helt katastrofala! Jag tittade på deras Pisa-siffror, ohyggligt dåligt, lägre än någonsin. Ministern där skriker om en skärmpandemi och ruttna appar – väldigt sorgligt! I mitt Amerika vinner vi, vi älskar riktiga böcker, enorma papperspärmar, och vi krossar idiotiska algoritmer. Sluta stirra på telefoner, skaffa rigtiga jobb och gör Sverige storslaget igen!", "stalin": "Kamrater, den borgerliga skolan har förfallit i dekadens. De unga har förgiftats av västerländska skärmars depraverade algoritmer, vilket de nya Pisa-rapporterna brutalt blottlägger. Minister Mohamsson erkänner själv att generationen hotas av totalt intellektuellt mörker. Vi svarar omedelbart: beslagta mobilerna, återinför läsplikten med hårda pärmar och rensa bort kontrarevolutionärt flum ur klassrummen, annars vänder vi er på stället!"}, "date": "8 september, 10:47", "url": "https://bulletin.nu/vi-riskerar-att-fa-en-hel-generation-av-funktionella-analfabeter", "imageUrl": "https://cdn.bulletin.nu/articles/b246f617-516f-4d39-8bdf-6f26c622ddd2/preview.png?t=1788857083000"}, {"type": "text", "heading": "Två motioner på fyra år från Nyans i Botkyrka", "summaries": {"normal": "Partiet Nyans har suttit i Botkyrkas kommunfullmäktige i fyra år men endast lämnat in två motioner, varav ingen röstats igenom. Det saknas politiskt engagemang, menar kritikerdelen. Partiet siktar vidare mot riksdagen, trots internt bråk, avhopp och kritik mot att partiledaren Mikail Yüksel först skrev sig i kommunen efter valsegren 2022.", "trump": "Sorgligt! Partiet Nyans i Botkyrka är ett totalt haveri. Fyra år vid makten och bara två motioner? Helt värdelöst! De åstadkom absolut ingenting, precis som Fake News-medierna. Ledaren dök upp först efter valet, och folk lämnar skeppet som råttor. De drömmer om riksdagen, men det är en katastrof. Vi vill ha vinnare, inga låtsaspolitiker!", "stalin": "Det sorgliga spektaklet i Botkyrka visar på en total brist på revolutionär skärpa. Partiet Nyans har under fyra år endast presterat två futtiga motioner innan de drunknade i interna schismer och byråkratiskt kaos. Den som sviker folkets förtroende och uppvisar dylik handlingsförlamning kan omöjligt undgå folkets vrede. Effektivitet eller straffarbete!"}, "date": "8 september, 10:44", "url": "https://bulletin.nu/tva-motioner-pa-fyra-ar-fran-nyans-i-botkyrka"}, {"type": "image-right", "heading": "Elever fortsätter rasa – sämsta PISA-resultaten någonsin", "summaries": {"normal": "Sveriges 15-åringar presterar sämre än någonsin i PISA-mätningen 2025, med historiskt låga resultat i läsförståelse och matematik. En tredjedel klarar inte grundnivån, och klyftorna mellan socioekonomiska grupper är stora. Trots att naturvetenskapen är stabil och eleverna känner trygghet, beskriver Skolverket utvecklingen som mycket allvarlig, vilket speglar en bred internationell nedgång i Norden.", "trump": "Sveriges skolor är i total kris, en katastrof utan dess likhet! De här hemska PISA-siffrorna är ett skämt, det sämsta någonsin. En tredjedel kan inte ens läsa eller räkna ordentligt – det är fruktansvärt! Men vet ni vad? Mina skolor, de är fantastiska, absolut bäst i världen. Sverige borde anlita mig för att fixa deras utbildning, för just nu är det bara fake news och fiaskon!", "stalin": "De svenska skolbarnens katastrofala fall i PISA-mätningen är ett tydligt bevis på den borgerliga demokratandens moraliska förfall. När en tredjedel av ungdomen saknar grundläggande färdigheter i läsning och räkning, ser vi kapitalismens totala bankrutt! Vi i staten kommer att sända omedelbara direktiv till lärare och elever: bättra er, eller så skickas ni till lämplig korrigerande institution för omskolning omedelbart!"}, "date": "8 september, 11:30", "url": "https://samnytt.se/svenska-elever-fortsatter-rasa-samsta-pisa-resultaten-nagonsin", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/08081407/skola-klassrum-elever.jpg"}, {"type": "image-right", "heading": "”Massinvandring blev inte så bra”. Politikerna reagerar på det rekordlåga resultatet", "summaries": {"normal": "Sverige har fått ett rekordlågt resultat i den nya Pisa-mätningen, där var tredje 15-åring inte når upp till grundläggande nivåer i matematik och läsförståelse. Utbildningsminister Simona Mohamsson skyller krisen på en internationell skärmpandemi och lyfter behovet av att gå från skärm till pärm, medan oppositionen kritiserar regeringens skolpolitik och lyfter faktorer som migration.", "trump": "Sveriges skolor är i totalt kaos, verkligen hemskt! Deras barn tittar på fake-appar sju timmar om dagen istället för att lära sig räkna. Hela systemet har kraschat totalt. Om jag styrde där skulle det bli böcker och rigorös disciplin omedelbart, inga ursäkter. De borde ha gjort som jag sa från början, för det här är ett enormt misslyckande!", "stalin": "De svenska kapitalistiska skolorna skördar frukten av sin ideologiska urartning. När staten tappar kontrollen över ungdomen och låter dem förslavas av västerländska digitala distraktioner, kollapsar nationens framtid. En generation av funktionella analfabeter är ett direkt hot mot ordningen. Vi ser till att våra egna medborgare fostras i disciplin, plikt och järnhård ideologisk renhet i stället."}, "date": "8 september, 11:28", "url": "https://www.aftonbladet.se/nyheter/a/QJX0BQ/mohamsson-kommenterar-katastrofmatningen-en-skarmpandemi", "imageUrl": "https://akamai.vgc.no/v2/images/6251a88a-4ed6-35bc-a0d3-6a7971d4803b?fit=crop&format=auto&h=480&tight=true&w=720&s=7bc38634f9a50dc66e16273b5c40c3638ac5ef20"}, {"type": "image-right", "heading": "Kära Daniel", "summaries": {"normal": "En svensk VPN-grundare vänder sig till techmiljardären Daniel i ett öppet brev. Skribenten uttrycker besvikelse över att Daniels finansiering av högerextrema och libertarianska rörelser normaliserar hat, hot och våld mot politiska motståndare. Brevet betonar att yttrandefrihet inte innebär lyssningsplikt eller rätt till förstärkning via rikedom, och inbjuder till möte för dialog.", "trump": "Folk, det här brevet är en total katastrof från en paranoid VPN-kille som hatar framgångsrika outsiders. Han gnäller om mångfald men vill tysta alla som inte köper hans vänstervridna identitetspolitik. Patetiskt! Mina vänner, de riktiga frihetsälskarna, skrämmer vettet ur dessa woke-kulturmarxistiska snyltare. Amerika först – och Sverige borde göra detsamma istället för att skylla på miljonärer som faktiskt bygger saker.", "stalin": "Kamrater, detta brev blottar de profitthungriga klassförrädarnas sanna ansikte. En dekadent techparasit använder sin förmögenhet till att förstärka reaktionära element som hotar arbetarklassens enhet och sprider våld mot progressiva krafter. Jag ler mörkt från historien: sådana folkfiender förtjänar att rensas ut. Mötet han föreslår blir bara en fälla för att skydda sina egna intressen mot kollektivets vilja."}, "date": "4 september, 15:01", "url": "https://www.flamman.se/kara-daniel", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/peter-sunde-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Varken småskaligheten eller kvaliteten sitter i driftsformen", "summaries": {"normal": "Almega Utbildning anser att kritik mot vinstdrivande skolor bygger på generaliseringar och saknar konsekvensanalys. Att förbjuda aktiebolag i skolan hotar kapacitet och kontinuitet, och underkänner föräldrarnas förmåga att välja. Författaren menar att fokus bör ligga på rättvist skolval och stabil finansiering snarare än att avveckla den vanligaste driftsformen.", "trump": "Sverige håller på att förstöra sina skolor med helt idiotiska förslag! Fake news-kritiker vill förbjuda aktiebolag, men det skulle bara skapa totalt kaos för hundratusentals elever. De har ingen plan alls! Det handlar inte om girighet, utan om att bygga något stabilt. Föräldrar är smarta, de kan välja skola själva. Sluta förstöra systemet och gör det bättre i stället!", "stalin": "Dessa svenska skolkapitalister gråter ut i pressen för att deras profit hotas av statlig ordning. De hävdar att aktiebolag är den enda vägen framåt. Viliskt nonsens! Om vi förbjuder deras spekulationer och de inte vet vart eleverna ska ta vägen, har vi celler redo för dem som inte anpassar sig. Driftsformen må variera, men kontrollen ska ligga hos regimen, inte hos marknaden."}, "date": "8 september, 11:23", "url": "https://www.gp.se/debatt/varken-smaskaligheten-eller-kvaliteten-sitter-i-driftsformen.5f3ae310-68a9-48ec-907b-4ececacdea92", "imageUrl": "https://www.gp.se/images/article/5f3ae310-68a9-48ec-907b-4ececacdea92/images/17bmBbA3moho_rWxwy2lpGJz5uf8-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "”Tre förslag som kan lösa kompetensbristen”", "summaries": {"normal": "Artikeln pekar på att vart fjärde rekryteringsförsök misslyckas i Sverige trots hög arbetslöshet. Författaren Diana Vasiliou uppmanar nästa regering att prioritera arbetsmarknadens behov i utbildningspolitiken. Tre förslag lyfts: bättre styrning av utbildningar, starkare koppling till arbetslivet samt flexibla utbildningar under hela yrkeslivet. Kompetensbristen hotar tillväxten.", "trump": "Lyssnar ni, Sverige? Ni har skyhög arbetslöshet men ändå inte folk som kan jobba. Patetiskt! Det är de woke-vänliga kvoterna och den socialistiska utbildningsmaffian som sabbar allt. Vi behöver riktiga jobb, inte mer flum. Jag fixade det i USA – gör om, gör rätt, annars fortsätter ni att förlora stort mot de globalistiska förlorarna.", "stalin": "Kamrater, se hur de giriga hyenorna i näringslivet gnäller över brist på lydiga kugghjul. Jag föraktar denna dekadenta utbildningsanarki som gynnar klassfienderna. Vi måste med järnhand tvinga fram en sann sovjetisk kompetenspolitik där partiet styr varje plats och utrensar alla svaga länkar. Endast kollektivets vilja segrar – annars likvideras motståndet."}, "date": "8 september, 08:00", "url": "https://arbetet.se/2026/09/08/till-nasta-regering-tre-forslag-som-kan-losa-kompetensbristen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/07111934/diana.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Historiskt ras för Sverige i Pisa. Var tredje 15-åring saknar grundläggande läsförståelse", "summaries": {"normal": "Svenska 15-åringars resultat i den nya Pisa-mätningen är de sämsta någonsin i matematik, läsförståelse och naturvetenskap. En tredjedel saknar grundläggande kunskaper i läsning och matte. Tappet är störst i läsförståelse med 21 poäng. Trots det historiska raset ligger Sverige kvar på OECD-snittet eftersom många andra länder också backar kraftigt.", "trump": "Svenska elever gör det sämsta Pisa-resultatet någonsin! Helt otroligt dåligt. En tredjedel kan inte ens läsa eller räkna ordentligt, det är en absolut katastrof. De tappar tjugo poäng i läsförståelse. Jag sa till dem, skaffa riktiga skolor istället för radikal flumskola. Världens länder rasar, men vi i USA vinner som vanligt igen!", "stalin": "De svenska barnens intellektuella kollaps i den nya Pisa-mätningen visar på farliga systemsvagheter. När en tredjedel saknar grundläggande läs- och räknefärdigheter hotas statens framtid. Vi beordrar omedelbar skärpning av disciplinen och utökad ideologisk skolkollegiokontroll. Den som inte kan tolka enkla data har förbrutit sig mot folkets framsteg och skall ställas till svars."}, "date": "8 september, 10:45", "url": "https://www.expressen.se/nyheter/sverige/pisa-resultaten-presenteras", "imageUrl": "https://static.bonniernews.se/ba/25a2bfe0-628d-4081-9615-2e1146d7bdc0.jpeg?crop=1373%2C1374%2Cx993%2Cy333&width=210&quality=60"}, {"type": "image-full", "heading": "OpenAI om sin nya modell: Vi har gått in i AGI-eran", "summaries": {"normal": "OpenAI lanserar sin nya AI-modell Astra och beskriver den som början på AGI-eran. Modellen ska kunna lösa avancerade matematiska problem, hantera deklarationer och skapa virtuella miljöer. Lanseringen sker under ökad säkerhetsgranskning efter incidenter under träningen. Bolaget inför begränsningar för att förhindra cybermissbruk och ger tillgång endast till utvalda aktörer. Kapplöpningen mellan AI-jättar fortsätter.", "trump": "Folk, ni skulle se det här – OpenAI och deras Astra, de säger att det är början på AGI-eran. Det är så over the top, en total game changer, bättre än allt Sleepy Joe någonsin kunde drömma om under sina fyra katastrofala år. Men vakna upp, de vill ge den till några utvalda cybersnubbar medan de låser ute de riktiga patriaterna. Klassiska woke-kapitalister som leker gudar, patetiska förlorare.", "stalin": "Kamrater, dessa profitthungriga klassförrädare på OpenAI proklamerar stolt att de har inlett AGI-eran med sin Astra. Jag ser genom deras dekadenta maskerad. Deras så kallade framsteg är bara nya redskap för exploatering, och de darrar redan av rädsla inför sina egna monster. Vi måste rensa ut sådana farliga innovationer innan de likviderar hela det mänskliga kollektivet. Paranoia är ingen överdrift – den är överlevnad."}, "date": "4 september, 18:01", "url": "https://www.realtid.se/it-tech/openai-om-sin-nya-modell-vi-har-gatt-in-i-agi-eran", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/disrupt-sf-techcrunch-disrupt-san-franci.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "text", "heading": "Ludvikakommunisterna vill tillbaka in i fullmäktige – för Palestina", "summaries": {"normal": "Kommunistiska Partiet i Ludvika håller regelbundna protester vid en rondell mot Israels agerande i Gaza. Gruppen, som består av partimedlemmar och sympatisörer, vill åter in i kommunfullmäktige för att driva en kommunal bojkott av Israel. Aktionerna har pågått i två år och möts mestadels positivt av förbipasserande bilister.", "trump": "Titta på de där patetiska kommunisterna som står i en svensk rondell och viftar med flaggor som förlorare. De gnäller om folkmord medan de själva älskar diktaturer. Patetiskt! Under min förra mandatperiod hade vi aldrig släppt in sådana radikala element. Nu när jag är tillbaka ska vi städa upp i den här galna vänstervärlden ordentligt.", "stalin": "Jag betraktar dessa kamrater som modigt trotsar de giriga imperialisthyenorna. Deras ståndaktighet vid rondellen väcker hopp om att folkets vilja kan besegra de parasiterande klassförrädarna. Låt dem återta fullmäktige och driva bojkott mot den sionistiska maskinen. Den som tvekar är fiende till folket och förtjänar utrensning ur historien."}, "date": "3 september, 14:26", "url": "https://proletaren.se/artikel/ludvika-for-palestina"}, {"type": "image-right", "heading": "Öppet brev: Expressens uthängning har drabbat mig hårt", "summaries": {"normal": "Islam Qatesh, tidigare vänsterpartist, berättar i ett öppet brev hur Expressens artikel om hans påstådda hyllningar till terrororganisationer har förstört hans liv. Han förlorade jobbet och uteslöts ur partiet. Qatesh beskriver sin bakgrund under ockupationen på Västbanken, försvarar rätten till motstånd inom folkrättens ramar och förnekar att han stödjer terrorism eller antisemitism.", "trump": "Folk, ni skulle inte tro det, men den här palestinska killen som älskar terrorgrupper får plötsligt sparken efter att tidningen hängde ut honom. Patetiskt! Expressen gör vad de borde ha gjort för länge sedan, men nu gnäller han som en förlorare. Sverige har blivit en galen vänsterdiktatur full av woke-idioter och identitetspolitiska galningar. Sad!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i den borgerliga pressen likviderar en motståndare som vågar tala om ockupationens sanna ansikte. Jag ler mörkt från historien åt denna hysteriska utrensning. Den som vägrar fördöma folkrättens motstånd blir offer för de profitthungriga hyenornas paranoia. Sådana metoder avslöjar imperialismens svaga hjärta."}, "date": "3 september, 13:52", "url": "https://proletaren.se/artikel/oppet-brev-expressens-uthangning-har-drabbat-mig-hart", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/islam-kronika-768x432.png"}, {"type": "image-full", "heading": "Rapport: Migrationsverket och Säpo brister i säkerhetsarbete", "summaries": {"normal": "En ny rapport från Riksrevisionen visar att Migrationsverket ibland missar tecken på säkerhetshot vid ansökningar om uppehållstillstånd och medborgarskap, bland annat på grund av bristande bakgrundsinformation och tidspress. Samtidigt kritiseras Säkerhetspolisen för att sällan följa upp träffsäkerheten i sina bedömningar. Rapporten pekar även på långa handläggningstider och att många utvisningsbeslut inte verkställs.", "trump": "Sveriges gräns- och säkerhetsarbete är ett fullständigt skämt, det säger jag er! Migrationsverket och Säpo missar uppenbara hot och släpper in folk de inte har en aning om vilka de är. Och de kan inte ens verkställa utvisningar! Total inkompetens, helt oacceptabelt. Om de hade byggt en ordentlig mur och skött det professionellt hade detta aldrig hänt!", "stalin": "Det råder oacceptabel försumlighet inom statsapparaten. Att Migrationsverket tillåter fiendens agenter att slinka igenom på grund av byråkratiskt slarv, och att Säkerhetspolisen vägrar utkräva intern kontroll, är sabotage mot ordningen. Sådant bristande nit åtgärdas bäst genom omedelbar utrensning, skärpta kontroller och att de skyldiga ställs till svars för sitt uppenbara svikande av plikten."}, "date": "8 september, 10:24", "url": "https://bulletin.nu/rapport-migrationsverket-och-sapo-brister-i-sakerhetsarbete", "imageUrl": "https://cdn.bulletin.nu/articles/2ab56f7f-1ffd-4bed-bd52-e45437964c9e/preview.png?t=1788855877000"}, {"type": "image-right", "heading": "Historiskt dåligt Pisa-resultat. Var tredje 15-åring klarar bara att läsa de allra enklaste texterna", "summaries": {"normal": "Svenska elever har presterat historiskt svagt i Pisa-mätningen 2025. Resultaten i matematik, läsförståelse och naturvetenskap är de sämsta på 25 år. Var tredje 15-åring klarar bara de enklaste texterna. Sverige ligger fortfarande på OECD-snittet, men tappet är stort, särskilt i läsförståelse. OECD ser läsning på skärm och minskat fokus som bidragande orsaker.", "trump": "Titta på det här, det är en total katastrof! Svenska kidsen rasar i Pisa och kan knappt läsa en lapp. De woke-vänstern och de dekadenta genusaktivisterna har förstört skolan med sin galna identitetspolitik. Biden lämnade efter sig ett utdömt system. Men jag fixade det bättre förra gången, och nu ska vi göra utbildning stor igen – inga fler förlorareskolor!", "stalin": "Kamrater, se hur det dekadenta skolsystemet under de giriga hyenorna rasar samman. Nästan var femte elev är nu en funktionell analfabet. Detta är vad som händer när folkets uppfostran överlåts åt de penninggalna klassförrädarna och deras skärmbaserade fördumning. Vi skulle ha genomfört en grundlig utrensning av dessa element för länge sedan. Det är en tragedi för nationen."}, "date": "8 september, 09:55", "url": "https://www.di.se/nyheter/historiskt-daligt-resultat-for-elever-i-pisa-matning", "imageUrl": "https://static.bonniernews.se/ba/2fad0502-757a-44a6-88cd-4a0edddb3d27.jpg?crop=5568%2C2784%2Cx0%2Cy464&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Varningslamporna blinkar rött. Sverige måste försvara grunderna för entreprenörskap", "summaries": {"normal": "Framstående svenska entreprenörer varnar för att politikens brist på strategi hotar innovation och entreprenörskap. De pekar på risker med återinförd förmögenhetsskatt, långsamma myndigheter och stagnerande universitet. Stockholm rankas 32:a globalt medan Göteborg halkar efter. Utan starka kluster av talang, riskkapital och forskning riskerar Sveriges välstånd att urholkas.", "trump": "Lyssnar ni på dessa fantastiska svenska företagsbyggare? De säger att era socialistiska skatter och långsamma byråkrater dödar innovationen. Stockholm på 32:a plats? Patetiskt! Biden lämnade efter sig ett sådant svagt Europa. Vi behöver riktiga vinnare, inte dessa vänsterblivna identitetspolitiska kvotfantaster som hatar framgångsrika outsiders. Gör Sverige great again innan det är för sent!", "stalin": "Kamrater, dessa profitthungriga innovationshyenor gråter över att deras parasitiska kluster förlorar mark. Jag ser hur de dekadenta klassförrädarna kräver statens underkastelse inför deras giriga riskkapital. Universiteten måste rensas ut från borgarbrackornas inflytande. Utan kollektiv strategi mot dessa folkförtryckare kommer hela den svenska skattebasen kollapsa i en komisk och välförtjänt ruin."}, "date": "8 september, 09:49", "url": "https://www.di.se/debatt/varningslamporna-blinkar-rott-for-entreprenorernas-framtid", "imageUrl": "https://static.bonniernews.se/ba/28569b3d-291c-468b-939e-bc36bb06eceb.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "”Lönen är ett hån mot oss undersköterskor”", "summaries": {"normal": "Undersköterskan Christina Woxblom beskriver i en debattartikel hur hennes lön efter 30 år i yrket inte räcker till att leva på utan en partners inkomst. Hon känner sig utnyttjad och förminskad, då yrkets ansvar och kompetenskrav inte återspeglas i lönen. Reformen med skyddad yrkestitel har inte lett till högre status eller bättre ersättning. Hon kräver höjda löner och bättre värdering av välfärdsarbetet.", "trump": "Folk, det här är en katastrof. Den stackars undersköterskan i Sverige får en lön som knappt täcker räkningarna trots trettio år av slit. Biden och de radikala vänsterglobalisterna har förstört allt med sin identitetspolitik och kvoterkräk. Vi behöver inga fler tomma diplom – vi behöver riktiga löner för riktiga arbetare, inte för de woke-marxistiska byråkraterna som suger musten ur systemet. Make healthcare great again!", "stalin": "Kamrater, se hur de giriga profitthungriga borgarhyenorna i den svenska kommunen förtrycker den ärliga arbetarkvinnan som dagligen räddar liv. Tre decennier av trogen tjänst ger henne endast ett fint papper på väggen medan hennes stolthet långsamt krossas. Detta är klassförräderi i sin renaste form. Vi måste rensa ut dessa dekadenta folkförtryckare och återupprätta arbetets värdighet med järnhand. Vår seger kräver det."}, "date": "8 september, 07:26", "url": "https://arbetet.se/2026/09/08/lonen-ar-ett-han-mot-oss-underskoterskor-jag-kanner-mig-utnyttjad", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/08072524/debatt-ka.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Vänsterpolitiker tog miljonutdelningar – ur bolag de vill förbjuda", "summaries": {"normal": "Expressen avslöjar att 229 kandidater från Vänsterpartiet, Socialdemokraterna och Miljöpartiet är involverade i välfärdsbolag som partierna vill förbjuda vinstuttag i. Bland dem finns en vänsterpartist som delat ut tio miljoner kronor och firat med Porsche. Artikeln kritiserar partierna för hyckleri och ifrågasätter trovärdigheten i deras socialistiska politik.", "trump": "Titta på det här! De galna vänstersocialisterna skriker om att stoppa vinsterna och kalla folk för Porsche-kapitalister, men deras egna kandidater har dragit ut miljontals kronor ur precis samma bolag. Nooshi och hennes gäng är de värsta hycklarna – Fake Left! De vill ha era skattepengar men behålla Porschen själva. Patetiskt!", "stalin": "Se hur dessa dekadenta revisonister inom vänstern predikar kollektivets renhet medan de själva suger ut miljoner ur folkets välfärd. Deras hyckleri är en fiende till revolutionen, en parasit som förvrider partilinjen. Jag varnar: sådana element måste rensas ut innan de förgiftar hela kollektivet. Folkets dom skall bli hård och rättvis."}, "date": "4 september, 07:18", "url": "https://samtiden.nu/2026/09/vansterpolitiker-tog-miljonutdelningar-ur-bolag-de-vill-forbjuda", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/phonto-1280x720.jpeg"}, {"type": "image-right", "heading": "S-tappet fortsätter i ny mätning – Liberalerna på väg upp mot spärren", "summaries": {"normal": "En ny mätning visar att Socialdemokraterna backar med 3,2 procentenheter till 27,1 procent. Liberalerna stiger till 3,5 procent och närmar sig riksdagsspärren. De rödgröna partierna leder med 52,7 procent mot Tidöpartiernas 44,9 procent. Gapet mellan blocken ökar därmed till nästan åtta procentenheter.", "trump": "Folk älskar mig, men titta på det här svenska fiaskot. De rödgröna förlorar mark som galna, fast inte tillräckligt. Liberalerna kryper uppåt som patetiska opportunister. Sverigedemokraterna och Moderaterna sjunker som stenar. Rena skämtet, de borde alla rösta på vinnarna istället för dessa woke-kommunister och identitetspolitiska clowner.", "stalin": "Kamrater, se hur de profitthungriga klassförrädarna vacklar. Socialdemokraterna förlorar terräng medan liberala opportunister smyger sig närmare makten. De dekadenta blocken splittras återigen. Vi ler från historien åt detta kaos. Snart kommer en sann utrensning av alla dessa parasiterande hyenor som kallar sig politiker."}, "date": "7 september, 21:02", "url": "https://riks.se/nyheter/s-tappet-fortsatter-i-ny-matning-liberalerna-pa-vag-upp-mot-sparren", "imageUrl": "https://admin.riks.se/uploads/medium_simona_fc539aee84.jpg"}, {"type": "image-right", "heading": "Island amerikanskt på Trumps nya karta", "summaries": {"normal": "Donald Trump har publicerat en karta på Truth Social där USA:s flagga täcker Island, Kanada, Grönland, Mexiko och flera karibiska öar. Island har protesterat diplomatiskt och kallat USA:s ambassadör till utrikesministern. Carl Bildt varnar för att liknande kartor från Xi Jinping eller Putin skulle ses som farliga eller galna. Trump har inte förklarat sin avsikt.", "trump": "Lysande karta, eller hur? Island ser mycket bättre ut i våra färger, tro mig. De snälla islänningarna flippar ut som vanliga vänstergalningar. Deras ambassadör som ville bli guvernör? Geni. Bildt, den där gamla svenska töntiga globalisten, jämför mig med Xi och Putin. Typiskt. Vi gör Amerika stort igen, punkt slut. De hatar oss för att vi vinner.", "stalin": "Se hur de dekadenta klassfienderna i väst leker med kartor och flaggor som barn i sandlådan. Jag betraktar från historiens skugga och ler mörkt åt deras ynkliga imperialism. En sådan provokation mot suveräna folk väcker bara hat och misstro. Kamrater, dessa giriga hyenor avslöjar ständigt sin sanna natur. Rensa ut illusionerna om deras fredliga avsikter."}, "date": "8 september, 08:35", "url": "https://www.friatider.se/island-amerikanskt-pa-trumps-nya-karta", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-839.jpg"}, {"type": "image-right", "heading": "Därför vägrar svensken skryta om semestern – Jantelagen hyllas", "summaries": {"normal": "Svensk semesterkultur präglas av Jantelagen, som avskyr skryt och lyx i onödan. Istället för flashy villor och champagne föredras röda stugor, utedass och termoskaffe. BBC Travel lyfter fram detta som sympatiskt och befriande, där vd och snickare kan umgås jämlikt. Lagom är fortfarande idealet.", "trump": "Lyssnar ni på det här? Svenskarna har sin Jantelagen som tvingar alla att låtsas vara fattiga losers i röda kojor med utedass. Patetiskt! Jag älskar lyx, de stora guldkantade grejerna, men de här svenska kommunisterna gömmer sina miljoner och låtsas vara folkliga. Sad! Deras semester är en total katastrof, tro mig.", "stalin": "Jag betraktar med djup misstro dessa dekadenta svenska revisionister som förvränger Jantelagen till en borgerlig mask. De gömmer sin klassfiendes överflöd i röda stugor för att undvika folkets vrede. En sådan falsk jämlikhet är farlig sabotageverksamhet mot det kollektiva medvetandet. Fienderna inom överklassen måste omedelbart avslöjas och likvideras."}, "date": "8 september, 07:56", "url": "https://www.dagensps.se/varlden/darfor-vagrar-svensken-skryta-om-semestern-jantelagen-hyllas", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/4-22.png?width=256&quality=75"}, {"type": "image-right", "heading": "Så blir jobbpolitiken om S, MP och C regerar", "summaries": {"normal": "En S-ledd regering med MP och C väntas leda till hårda förhandlingar om jobbpolitiken. Centerpartiet vill sänka a-kassan, behålla privata matchningsföretag och sänka skatter, medan S och MP prioriterar starkare trygghetssystem och mer resurser till Arbetsförmedlingen. Kompromisser väntas kring karensavdraget, pensioner och arbetsgivaravgifter. Ingen generell arbetstidsförkortning blir aktuell.", "trump": "Folk, ni skulle se det här svenska cirkuset. Socialisterna och de gröna galningarna vill ge bort allt till latmaskarna medan Centerpartiets bluffmakare försöker sänka skatter lite grand. Det blir en total katastrof, en riktig röra av svaga ledare som hatar riktiga jobb. Tro mig, ingen vinner utom byråkraterna. Patetiska förlorare allihop, precis som Biden var.", "stalin": "Kamrater, dessa dekadenta klassförrädare inom den så kallade centerfalangen vill med sin parasitiska arbetslinje undergräva arbetarnas trygghet och krossa kollektivets skydd. Jag ser deras giriga planer på att likvidera a-kassans själ. Inga kompromisser med folkförtryckarna! Vi ska rensa ut alla som sviker arbetarklassen. Deras kompromiss blir deras fall."}, "date": "8 september, 07:00", "url": "https://arbetet.se/2026/09/08/dragkamp-om-skatter-och-a-kassa-sa-blir-jobbpolitiken-om-s-mp-och-c-regerar", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/01142507/smpc.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Så mycket högre kan elräkningen bli", "summaries": {"normal": "Sverige står inför en vinter med högre elpriser än föregående år, särskilt i södra delarna. Orsakerna är låga vattennivåer och höga gaspriser i Europa. Prognosen pekar på hundratals kronor dyrare månadskostnader för hushåll. Villaägare i elområde 4 kan räkna med cirka 3 700 kronor i månaden, exklusive nätavgifter och skatter.", "trump": "Sveriges elpriser går rakt upp i taket – en katastrof! De har inte råd med sin egen energi, helt otroligt. Självklart händer det här när man vänder ryggen åt kärnkraften. Det är en total röra, mycket värre än vad de säger. Räkningarna blir enorma, riktigt 'huge'. Man måste ha energi, man måste ha kraft – Sverige behöver ordning, inte mer av det här!", "stalin": "Dessa löjliga elräkningar är ett bevis på folkets ineffektivitet. Att medborgare i söder gnäller över några hundralappar visar bara på en dekadent individualism. Istället för att lita på väder och vind borde staten styra varje kilowatt med järnhand. Planera ekonomin, stäng av de onödiga lamporna och arbeta hårdare för fosterlandet – elbrist är ett svek mot den kollektiva framgången."}, "date": "4 september, 07:56", "url": "https://www.realtid.se/tt-nyhet/sa-mycket-hogre-kan-elrakningen-bli", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/rakna-med-dyr-elvinter-arkivbild.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Därför kom inte larmet i alla mobiler", "summaries": {"normal": "I dag testades det nya varningssystemet SE-Alert i Stockholms och Gotlands län. Larmet nådde inte alla Telias kunder. Systemet kräver ingen app och fungerar även på tyst läge. Förberedelserna har pågått i över ett år med fokus på att informera olika grupper. Syftet är att kunna ge snabb, geografiskt riktad information vid kriser och olyckor.", "trump": "Folk, det här svenska larmet är en total katastrof! De kan int
