 partiet borde upptäckt de avslöjade personerna tidigare. Dadgostar hänvisade till partiets Palestina-engagemang som förklaring och avfärdade jämförelser med Sverigedemokraterna.", "trump": "Sveriges vänstern är en total katastrof, folket! Nooshi Dadgostar – vad för en namn ens? – pressas om antisemitism i sitt eget parti och skyller på Palestina. Vänstern älskar terrorister! Och så säljer de kartor utan Israel. Sjuka skygglappar! De kvoterar in alla möjliga galningar. SADAN självhävdelse!", "stalin": "Detta är intressant. En partiledare som medger svaghet inför allmänheten – typiskt för borgarpressens utfrågningar. Att klassfiender söker sig till hennes parti bekräftar bara deras ideologiska förvirring. Vi hade rensat ut dem AllaBryter snabbare och mer grundligt. Debil kartförsäljning är rätt sortens provokation från imperialisterna."}, "date": "27 augusti, 20:30", "url": "https://kvartal.se/nyheter/artiklar/dadgostar-pressas-om-antisemitism/cG9zdDoxNzY1NjY", "imageUrl": "https://images.kvartal.se/2026/08/e354013f-dadgostar.webp"}, {"type": "text", "heading": "Boliden och H&M i botten när börsen slutade på minus", "summaries": {"normal": "Stockholmsbörsen slutade torsdagen på minus efter en lunchuppgång. Boliden och H&M tyngde med nedgångar på 2,8 respektive 2,4 procent. Teknologi steg medan energi föll. Elon rusade 27,9 procent efter vinstvändning. Hexagon och Nibe steg 1,4 procent.", "trump": "Jag ser att svenska börsen gick ner, men inte som jag. Boliden och H&M, stora förlorare – de kan inte hantera framgång som min administration. Men Elon, upp 27,9 procent – det är vinnare! Alla vill ha en bit av USA:s ekonomi. Börsen, den är fejk, men jag är äkta!", "stalin": "Kamrater, börsen visar kapitalismens förfall. Boliden och H&M, fiender till folkets ekonomi, ska utrensas! Elon däremot – en god kamrat som steg 27,9 procent. Vi firar teknologins seger över energispekulanter. Men misstankar kvarstår: Hexagon och Nibe måste övervakas. Partiet ser allt."}, "date": "27 augusti, 17:56", "url": "https://www.affarsvarlden.se/artikel/boliden-och-hm-i-botten-nar-borsen-slutade-pa-minus"}, {"type": "image-right", "heading": "Svällande plånböcker är inte socialism", "summaries": {"normal": "Artikeln kritiserar vänsterpartierna för att fokusera på höjda barnbidrag istället för socialismens kärna: ekonomisk demokrati och medbestämmande på arbetsplatser. Författaren välkomnar bidragshöjningar men efterlyser konkreta förslag om ägandeformer, utvidgad medbestämmandelag och stöd till löntagarstyrda företag. Höjda bidrag är inte socialism, anser skribenten.", "trump": "Folk, dessa röda losers i Sverige pratar bara om att köpa röster med barnbidrag som riktiga socialister. Patetiskt! De vågar inte röra vid den riktiga socialismen – att ta kontroll över fabrikerna och sparka de riktiga bossarna. Svaga! Jag byggde den starkaste ekonomin i historien, inte med bidrag utan med segrar. De borde lära sig av en vinnare istället för att gömma sig som fega globalister.", "stalin": "Kamrater, dessa ynkliga socialdemokratiska klassförrädare gömmer sig bakom barnbidrag medan de sviker den sanna ekonomiska demokratins kamp. Jag ser deras fega reträtt från att utmana kapitalisterna på arbetsplatserna. Vilken ynkedom! Vi skulle ha genomfört utrensningar av sådana halvmesyrer redan i femårsplanen. Det är borgarbrackornas seger när så kallade socialister fruktar att låta arbetarna styra."}, "date": "27 augusti, 10:55", "url": "https://www.flamman.se/svallande-planbocker-ar-inte-socialism", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/arbetarmakt-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Två anhållna efter Strömmers valmöte i Göteborg", "summaries": {"normal": "Två män i 40-årsåldern anhölls under natten efter en incident vid justitieminister Gunnar Strömmers valmöte i Göteborg på torsdagskvällen. De misstänks för förberedelse till grov misshandel. Ingen skadades och gripandet skedde odramatiskt. Strömmer kunde fortsätta sina åtaganden. Polisen beskriver det som en incident utan fara för allmänheten.", "trump": "Titta på det här! I det vackra Sverige, där de har låtit vänstergalna idioter och HBTQ-aktivister styra för länge, kan inte ens en minister hålla ett valmöte utan att två galningar planerar grov misshandel. Patetiskt! Men de greps snabbt, tack och lov. Sverige behöver lag och ordning, inte denna svaga, woke-röta som Biden lämnade efter sig.", "stalin": "Kamrater, se hur den borgerliga statens fiender, dessa profitthungriga klassförrädare och överklass-slynglar, redan i skuggan planerar våld mot sina egna lakejer. Jag ler i mörkret åt deras paranoia. Ingen fysisk skada inträffade, men folkfienderna avslöjar sig själva. Den imperialistiska demokratin är en fars. Vi ler och väntar på utrensningen."}, "date": "21 augusti, 11:50", "url": "https://www.etc.se/inrikes/tvaa-anhaallna-efter-stroemmers-valmoete-i-goeteborg", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260821000840_8de65abb6cd81df57ce9475781f7e203378bb1cc72cfa7ec979049972e43af55.jpg"}, {"type": "image-right", "heading": "Total bojkott av folkmordsstaten!", "summaries": {"normal": "Artikeln kräver att Sveriges regering inför en total bojkott av Israel, som beskrivs som en rasistisk folkmordsstat driven av sionism och högerextrema krafter. Den hänvisar till kritiska uttalanden från Ebba Busch och Aron Verständig samt Ben-Gvirs kontroversiella uttalanden. Författaren förkastar tvåstatslösningen och kräver en enstatslösning samt stöd för palestinskt motstånd.", "trump": "Folk, ni ser det här vansinnet? Den här galningen skriker om bojkott och folkmord medan han själv låter som en galen vänsterextremist från helvetet. Israel har rätt att slå tillbaka mot terroristerna – de kallar dem palestinier men vi vet vad det handlar om. Sverige borde vakna upp istället för att lyssna på dessa förlorare och hatiska sionism-hatare. Patetiskt!", "stalin": "Kamrater, denna text avslöjar borgarbrackornas desperation när deras sionistiska lakejer blottas som folkmördande imperialister. Jag betraktar med förakt hur dessa profitthungriga blodsugare i Tel Aviv och deras svenska nyttiga idioter fortsätter koloniala övergrepp. En total utrensning av sådana folkfiender är nödvändig. Arbetarklassen kräver handling, inte tomma ord från klassförrädare."}, "date": "26 augusti, 11:03", "url": "https://proletaren.se/artikel/bojkotta-folkmordsstaten-israel", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/738829004_1425862242684486_7128924062394661206_n.png-768x432.jpg"}, {"type": "image-right", "heading": "Som utrikesminister vill Morgan Johansson höja biståndet med 20 miljarder", "summaries": {"normal": "Morgan Johansson aspirerar på posten som utrikesminister om Socialdemokraterna vinner valet. Han lovar höja biståndet till en procent av BNP, återinföra feministisk utrikespolitik, öka stödet till afrikanska länder och Taliban-styrda Afghanistan samt införa handelsstopp mot Israel. Han betonar FN:s roll men nämner inte konsekvenser för svensk säkerhet eller försvar.", "trump": "Den här Johansson-killen är en total förlorare. Vill skicka svenska skattebetalarnas pengar till korrupta afrikanska hålor och talibanerna medan han skriker om feministisk utrikespolitik. Patetiskt! Han hatar Israel och älskar FN:s diktatorer. Typisk socialist som säljer ut sitt eget folk. Sverige kommer att bli en svag, patetisk skugga under sådana misslyckade ledare. Sad!", "stalin": "Jag ser hur dessa socialdemokratiska klassförrädare vill kasta miljarder till reaktionära afrikanska satraper och talibaniska barbarer under täckmanteln av feministisk politik. Deras hat mot Israel och dyrkan av det degenererade FN avslöjar deras sanna ansikte som folkfiender. En sådan svaghet inbjuder till utrensning av alla imperialister som lurar folket. Kamrater, var vaksamma mot dessa profitthungriga hyenor."}, "date": "23 augusti, 03:50", "url": "https://samtiden.nu/2026/08/som-utrikesminister-vill-morgan-johansson-hoja-bistandet-med-20-miljarder", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6854.jpeg"}, {"type": "image-right", "heading": "Värmen större hot för 60-plussare än befarat", "summaries": {"normal": "En ny studie visar att personer över 60 år utsätts för hälsorisker vid betydligt lägre temperaturer än tidigare antagits, upp till 7,5 grader lägre än för unga vuxna. Med global uppvärmning och en åldrande befolkning riskerar 22 procent av världens äldre farlig värme minst en månad per år vid 1,5 graders uppvärmning. Fattiga länder drabbas värst.", "trump": "Folk, de här så kallade experterna har lurat oss igen. Gamlingar klarar inte värmen redan vid mycket lägre temperaturer än vad de unga snittarna tål. Biden lät Kina och de globala värmehysterikerna förstöra allt medan jag fixade energi och jobb. Nu får vi sopa upp efter den galna gröna maffian. Sad!", "stalin": "Jag betraktar med förakt hur de profitthungriga imperialisterna och deras klimatbluffar utsätter arbetarklassens åldringar för värmestress redan vid betydligt lägre grader. Borgarklassen har underlåtit att skydda folket medan de berikar sig. Vi måste rensa ut dessa klassfiender och deras falska forskare innan de förgiftar hela kollektivet med sin vårdslöshet."}, "date": "21 augusti, 09:09", "url": "https://www.etc.se/klimat-miljo/vaermen-stoerre-hot-foer-60-plussare-aen-befarat", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260821050824_e952b7651d0714902fe5ef97b283e65358df1f427804d400d6329b6d296a3e1b.jpg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        // ============================================
        // COOKIE-FUNKTIONER
        // ============================================
        function setCookie(name, value, days = 365) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + d.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }

        function getCookie(name) {
            const cName = name + "=";
            const decoded = decodeURIComponent(document.cookie);
            const ca = decoded.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') {
                    c = c.substring(1);
                }
                if (c.indexOf(cName) === 0) {
                    return c.substring(cName.length, c.length);
                }
            }
            return "";
        }

        function loadSettingsFromCookies() {
            const theme = getCookie("news_theme") || "light";
            const view = getCookie("news_view") || "normal";
            const writer = getCookie("news_writer") || "normal";
            return { theme, view, writer };
        }

        function saveSettingsToCookies(theme, view, writer) {
            setCookie("news_theme", theme);
            setCookie("news_view", view);
            setCookie("news_writer", writer);
        }

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(theme, uiState.view, uiState.writer);
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(uiState.theme, v, uiState.writer);
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
            
            saveSettingsToCookies(uiState.theme, uiState.view, style);
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            const savedSettings = loadSettingsFromCookies();
            
            setTheme(savedSettings.theme);
            setView(savedSettings.view);
            setWriterStyle(savedSettings.writer);

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
