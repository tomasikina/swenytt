eading": "Rysslands enda tv-tillverkare tvingas lägga ner", "summaries": {"normal": "Rysslands enda inhemska tv-tillverkare, Kvant, har gått i konkurs efter en domstolsprocess i Moskva. Företaget, som producerade apparater i Zelenograd, drogs med skulder på över 4 miljarder rubel till bland annat Sberbank och Yandex. Problem med komponentleveranser från kinesiska bolag som Xiaomi och TCL, samt minskad efterfrågan, har lett till ett kraftigt intäktsras. Konkursen innebär att Ryssland nu saknar egen inhemsk tv-produktion.", "trump": "Rysslands enda tv-fabrik, Kvant, är ett totalt misslyckande och har gått i konkurs. En katastrof! De kunde inte ens betala sina räkningar till Yandex. Kineserna slutade skicka delar – de vet att Kvant är en förlorare. Det är vad som händer när man inte har någon vinnarmentalitet. Ryssland har noll tv-apparater kvar, det är sorgligt. Under min ledning bygger vi fantastiska fabriker, vi gör saker bäst, men Kvant? De är helt 'fired'. Ryssland behöver en riktig affärsman!", "stalin": "Kvant-fabriken i Zelenograd har kapitulerat inför skuldernas tyranni. Detta inkompetenta bolag, som inte kunde säkra ens de mest basala komponenter från våra kinesiska allierade, är ett bevis på bristande disciplin. Vi ser hur det ryska maskineriet sviktar när marknadens kaos tillåts råda. Vi staten tolererar inte sådan svaghet. Dessa skulder till Sberbank är ett svek mot det ryska folket. De som misslyckats med produktionen har visat sig vara dolda sabotörer. Vi ska städa upp i dessa led snarast."}, "date": "4 augusti, 16:53", "url": "https://www.realtid.se/bors-finans/rysslands-enda-tv-tillverkare-gar-i-konkurs-med-stora-skulder", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlpfmg3z8nl6y-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Kristersson om quislingbråket: ”Osmakligt och oanständigt”", "summaries": {"normal": "Statsminister Ulf Kristersson kritiserar Richard Jomshofs 'quisling'-jämförelser som osmakliga och oanständiga. Han tar avstånd från personangrepp och planerar att tala med Jimmie Åkesson. Kristersson anklagar också Vänsterpartiet för 'terrorromantik' efter att en ledamot hyllat en terrorist. Sverigedemokraterna försvarar sig och hävdar att de fått tåla hårda ord utan tidigare reaktioner.", "trump": "Jag har sett många galna saker i politiken, men 'quisling'? Det är för mycket! Ulf Kristersson har rätt: sånt är osmakligt. Jag brukar säga att man ska slå tillbaka, men inte med nazijämförelser. Och den där terroristhyllningen? Usch, det är värre än fake news. Sverigedemokraterna klagar? De får inte tåla kritik? T Tuffa luckor, det brukar jag säga.", "stalin": "Vi ser en farlig infiltration av faschistiska element i Sverige. Quisling-retorik från Sverigedemokraterna visar deras sanna ansikte, medan Vänsterpartiets terroristromantik är ett tecken på moralisk dekadens. Som Putin vet, måste staten skydda sig mot sådant svek. Dessa 'tekniska misstag' är bara en täckmantel för sabotage. Vi måste vara vaksamma."}, "date": "4 augusti, 16:09", "url": "https://bulletin.nu/kristersson-om-quislingbraket-osmakligt-och-oanstandigt", "imageUrl": "https://cdn.bulletin.nu/articles/6ccec870-8686-4fb6-86a2-e7d469370015/preview.jpg?t=1785851076000"}, {"type": "image-right", "heading": "Ny vändning i Teslakonflikten– anställda ska strejka igen", "summaries": {"normal": "Teslastrejken tar en ny vändning då ett 40-tal strejkande arbetare som återgick till sina jobb under sommaren nu ska tas ut i strejk igen den 13 augusti. Beslutet, som beskrivits som en jojo-strejk för att skapa oförutsägbarhet, kommer från IF Metall. En strejkande uttrycker chock och förvirring då ingen information kommit under sommaren. Konflikten är den längsta i modern svensk historia.", "trump": "Folk, ni kommer inte att tro det här. De där Tesla-strejkarna, som jag älskar förresten, de gick tillbaka till jobbet i sommar som riktiga patrioter, och nu drar facket in dem i strejk igen. Totalt kaos! Jojo-strejk, säger de. Det är en skam. IF Metall vet inte vad de håller på med, ingen har hört ett ljud på hela sommaren. Patetiskt. Sverige behöver starka ledare, inte sådana här clowner.", "stalin": "Kamrater, dessa opålitliga element bland Teslas anställda som vi skickade tillbaka till produktionen under sommaren har nu återkallats till strejken den 13 augusti. Deras chock och förvirring är ett tecken på svaghet som kapitalisterna utnyttjar. Vi ska rensa ut alla jojo-element och borgarbrackor som sprider desinformation inom facket. Inget hördes på sommaren? Typiskt sabotage från klassfiendens lakejer. Låt utrensningen fortsätta med glädje i hjärtat."}, "date": "4 augusti, 11:42", "url": "https://arbetet.se/2026/08/04/teslastrejken-tar-ny-vandning-anstallda-ska-strejka-igen-en-chock", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/04113143/sdlndaych3b4he-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Rockstjärna från Göteborg vann VM i hälleflundra", "summaries": {"normal": "Hans Gäfvert, syntspelare i Sator, vann VM-guld i hälleflundra med laget Underberg fishing team i Havöysund, Norge. Efter sitt fjärde försök segrade de med total längd 583 cm. Hans beskriver segern som överraskande och tumultartad, och betonar att taktik och erfarenhet avgjorde, inte bara tur. Hans lag inkluderar även musiker som Robert Pettersson.", "trump": "JAG skulle ha vunnit detta VM-guld om jag hade fiskat! Hans Gäfvert är en bra man, men jag är den bästa fiskaren i världen. Folk säger att jag skulle ha tagit hem guldet med mina enorma fiskar. Det här är ett enormt framgångsrikt evenemang, det största i fiskehistorierna. Hans och hans lag gjorde bra, men de skulle inte kunna slå MIG!", "stalin": "Vi, ledande fiskeripartiet, har observerat Hälleflundra-VM:et. Hans Gäfvert, en proletär fiskare, segrade genom vår planerade taktik. Fienden (andra lag) försökte sabotera, men våra rutinerade fiskare och kapten segrade med 583 cm. Detta är en seger för staten och partiet. Vi kommer att utvidga vårt fiskeintresse till nordliga vatten, precis som Putin gör med Ukraina."}, "date": "4 augusti, 20:35", "url": "https://www.gp.se/nyheter/goteborg/rockstjarnan-fran-goteborg-vann-vm-guld-i-halleflundra.fddba3ad-42e0-4c02-8bb0-c665eba391fe", "imageUrl": "https://www.gp.se/images/article/fddba3ad-42e0-4c02-8bb0-c665eba391fe/images/3HpoJ2e9Ird1cyLtRazqWSqVQw8o-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Kristersson utnyttjar krisen i Ceuta – inte ett ord om de som dött", "summaries": {"normal": "Krisen i Ceuta med 50 000-60 000 migranter och omkring 90 döda utnyttjas av europeiska ledare som Ulf Kristersson för att attackera Spaniens migrationspolitik. Trots att de flesta återvände samma dag, skickade 22 regeringschefer ett brev till EU utan solidaritet med Spanien. Alex Voronov anser detta vara en politisk strategi för att stärka egen anti-invandringsposition och svaga Spaniens förhandlingar mot Marocko.", "trump": "Jävligt dåligt! Kristersson och de andra europeiska ledarna utnyttjar Ceutas tragedi för att attackera Spanien. Ingen hänsyn till de döda! Jag skulle ha hanterat det mycket bättre – bara titta på mina gränser. De försöker vinna poäng hemma, men det sväcker Europa. Typiskt politiker – alltid spekulativ, aldrig starka. SAD!", "stalin": "Vi ser tydligt hur de europeiska revisionisterna, under ledning av Kristersson, utnyttjar Ceutas kris för att undergrava spansk suveränitet. Detta är en klassisk imperialistisk strategi, liknande Hitlers och Hitlers vänner. Vi måste stärka vårt försvar mot dessa fascistiska tendenser. Vi kommer att stödja Spanien i dess kamp mot dessa auktoritära krafter. Vi kommer att vinna, som alltid."}, "date": "4 augusti, 20:30", "url": "https://www.gp.se/kultur/kommentar/kristersson-utnyttjar-krisen-i-ceuta-inte-ett-ord-om-de-som-dott.830802e2-6282-4d3c-8c3e-48d39fa5a04c", "imageUrl": "https://www.gp.se/images/article/830802e2-6282-4d3c-8c3e-48d39fa5a04c/images/3jaksCl89y69530LBAqKYN1CXogE-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Tungt för Mjällby – tappade ledning till förlust i Champions League-kvalet", "summaries": {"normal": "Mjällby AIF förlorade det första kvalmötet i Champions League mot Slovan Bratislava med 1–2 hemma på Strandvallen. Elliot Stroud gav Mjällby ledningen på straff efter lång VAR-granskning, men gästerna kvitterade genom Suleiman Camara och avgjorde sent genom Manasse Kianga. Mjällby har därmed ett tufft läge inför returen i Bratislava nästa vecka.", "trump": "Titta på det här, det är patetiskt. Mjällby leder, spelar bra, och så kommer de där slovakiska grabbarna och stjäl matchen med 2–1. Straffen tog en evighet med VAR, men sen rasar allt ihop. Totalt misslyckande. De behöver en stor ledare som mig för att vända det här, annars är det över. Sad!", "stalin": "Kamrater, denna fega kapitulation inför slovakiska revisionister och borgarbrackor är en skam för hela kollektivet. Vi ledde med straff efter långvarig granskning av folkets domare, men sedan släppte vi in kontrarevolutionära element som Camara och Kianga. Nästa vecka i Bratislava skall vi rensa ut alla fiender till folkets framsteg. Ingen pardon för svikare och imperialistiska lakejer. Ha ha, deras straffspark blev deras egen grav!"}, "date": "4 augusti, 19:52", "url": "https://www.svt.se/sport/fotboll/tungt-for-mjallby-tappade-ledning-till-forlust-i-champions-league-kvalet"}, {"type": "image-full", "heading": "Gripenpilotens försvarsfond satsar i Sverige – backar AI-teknik mot drönare", "summaries": {"normal": "Gungnir Capital, grundat av bland andra en före detta Gripen-pilot, gör sin första svenska investering genom att satsa fem miljoner kronor i bolaget Monava. Monava utvecklar AI-driven akustisk sensorteknik för att upptäcka och spåra drönare, vilket kompletterar radar. Tekniken används redan i Ukraina och Norden. Investeringen ska hjälpa bolaget att skala upp sin organisation för att möta den stora efterfrågan på effektiva motmedel mot drönare i en växande försvarsmarknad.", "trump": "Jag har sett vad som händer med de här drönarna, det är en enorm business! Gungnir Capital – smarta killar, de vet att vinnare satsar på vinnare – investerar nu i svenska Monava. De har AI som kan höra allt, mycket bättre än vanlig radar. Det är fantastisk teknik! Medan andra sover, bygger dessa människor de bästa försvarsverktygen. Ukraina behöver det, världen behöver det. Vi älskar starkt försvar och jag gillar vinnare som Monava. Riktigt bra jobbat!", "stalin": "Vi har observerat hur dessa svenska teknokrater i Gungnir Capital nu finansierar det så kallade 'Monava'. De tror att deras små akustiska leksaker ska stoppa drönare som om de vore myggor. Det är ett patetiskt försök att imitera stormakternas kapacitet. Varje sådan innovation är bara en ny slav för den västerländska krigsmaskinen. Putin förstår, precis som vi gjorde, att sann makt ligger i stål och vilja, inte i brusreducerande sensorer. Vi ser er, och er paranoia kommer snart att bli er undergång."}, "date": "4 augusti, 16:05", "url": "https://www.realtid.se/bors-finans/gripenpilotens-forsvarsfond-satsar-i-sverige-backar-ai-teknik-mot-dronare", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/villmanmonava.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "ÖB: Svenskarna måste vara mentalt förberedda på en rysk attack", "summaries": {"normal": "ÖB Michael Claesson varnade för att Sverige måste vara mentalt förberedd på ryska begränsade militära operationer, sabotage och hybridkrigföring. Även om risken för ett stort angrepp bedöms låg på grund av Rysslands engagemang i Ukraina, kan Sverige bli måltavla på grund av sitt omfattande stöd till Ukraina. Ryska fartyg i Östersjön har förändrat sina metoder, vilket bedöms som en upptrappning.", "trump": "Jag har sagt det i åratal: Ryssland är extremt smart. De testar oss hela tiden, speciellt Sverige som är så naiva. Det är hybridsterror mot våra vänner. Som jag alltid påpekar: vi måste vara beredda, men inte skrämmas. Sverige måste bli starkare, mycket starkare. Det är ett faktum, folk. Ett fantastiskt faktum.", "stalin": "Vi, statens och partiets försvarare, måste vara alltid vaksamma. Fienden, i sin feghet, provar våra gränser med sabotage och informationskrigföring. Deras fartyg i Östersjön är en upptrappning, en provokation som vi kommer att möta med fasthet. Vi kommer att bedöma, mäta och reagera med oerhörd styrka. Varje prov är en läxa i vår överlägsna disciplin."}, "date": "4 augusti, 15:53", "url": "https://samnytt.se/ob-svenskarna-maste-vara-mentalt-forberedda-pa-ett-ryskt-angrepp-mot-sverige", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/04132829/artikelhuvudbild-1-121.jpg"}, {"type": "text", "heading": "Kött­priset kan stiga efter EU-stopp", "summaries": {"normal": "Importen av nötke från Brasilien till EU stoppas den 3 september på grund av att Brasilien inte följer EU:s regler för antibiotika i djurfoder. Det kan göra oxfilé, ryggbiff och entrecôte dyrare i svenska butiker, eftersom Brasilien levererar runt 5 000 ton av de 237 000 ton som äts per år. Grossister byter till Uruguay.", "trump": "Som den störste presidenten någonsin, såg jag detta komma. Brasilien har lurat våra bönder och brutit regler, så nu EU stoppar deras nötke. Priset på oxfilé kommer att skjuta i höjden, men jag har gjort Amerika stort igen – vi kommer att klara det. Detta bevisar min geniala handelspolitik. Som vanligt, vinner USA.", "stalin": "I vårt store sovjetiska rike har vi alltid kontrollerat köttstillgången. Brasilien, en feg imperialistisk stat, bryter antibiotikarutiner, och nu EU stoppar importen. Detta visar kapitalismens instabilitet. Vi, under den store Stalins ledning, ser till att våra medborgare får kött, medan de kapitalistiska länderna lider. Paralleller till Putins Rysslands expansion är uppenbara."}, "date": "4 augusti, 15:17", "url": "https://bulletin.nu/kott-priset-kan-stiga-efter-eu-stopp"}, {"type": "image-full", "heading": "Jomshof: Även Magdalena är en \"quisling\"", "summaries": {"normal": "Richard Jomshof (SD) svarar på kritiken från Magdalena Andersson genom att kalla även henne för en \"quisling\". Han anklagar både Andersson och Aftonbladets Anders Lindberg för att \"krypa för islamisterna\" vars mål enligt honom är att ta demokratin och landet ifrån svenskarna. Andersson har tidigare beskrivit Jomshofs utspel som \"mycket hotfullt\" och menar att SD vill tysta kritiska röster.", "trump": "Lyssnar ni på det här? Den här Jomshof-killen kallar Magdalena Andersson för en quisling, och vet ni vad? Han har helt rätt. De kryper alla för islamisterna, precis som de falska medierna. De vill ta ert land och er demokrati. Andersson kallar det hotfullt? Typiskt. De vill tysta alla som talar sanning. Sverige behöver starka ledare som inte böjer sig, inte svaga socialister som ger efter för radikala islamister. Patetiskt!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarbrackorna inom socialdemokratin och deras lakejer i den dekadenta pressen avslöjar sig som quislingar och islamistiska krypande lakejer. Dessa folkförrädare som Andersson och hennes gelikar vill överlämna folkets demokrati till reaktionära teokratiska element. Jag skulle ha låtit dem möta en grundlig utrensning redan för länge sedan. Deras paranoia att bli tystade är bara ett erkännande av att de förtjänar att likvideras som fiender till folket. Underbart underhållande att se borgarklassen äta upp sig själv."}, "date": "4 augusti, 14:33", "url": "https://riks.se/nyheter/jomshof-aven-magdalena-ar-en-quisling", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Copy_of_Copy_of_Soerman_Ledare_20_abf3fb830b.jpg"}, {"type": "image-full", "heading": "Nej till kontanter – då kan matbutiken neka ditt köp", "summaries": {"normal": "Den nya kontantlagen som trädde i kraft 1 juli 2026 kräver att mataffärer och apotek tar emot kontanter på bemannade kassor mellan klockan 06.00 och 20.00. Undantag gäller vid säkerhetsrisker, köp över 5 920 kronor eller fler än 25 mynt. Lagen kritiseras som verkningslös eftersom de flesta butiker redan accepterar kontanter, och den omfattar inte bensinmackar eller offentliga tjänster. Sverige fortsätter att vara ett av världens mest digitala länder med Swish och mobila kort.", "trump": "Den här svenska kontantlagen är en total katastrof, tro mig. De tvingar butiker att ta emot kontanter men sedan säger de att det inte gäller om det är farligt eller om du köper för mycket. Patetiskt! Sverige var en gång starkt men nu har de gått all in på Swish och mobila grejer medan resten av Europa håller fast vid riktiga pengar. Lagen är svag, ingen får böter, den täcker inte ens bensin eller pass. En stor misslyckad affär, folk.", "stalin": "Kamrater, denna så kallade kontantlag är en ynklig kapitulation inför de digitala spekulanterna och borgarbrackornas appar. Jag, som alltid försvarat arbetarklassens rätt till äkta mynt och sedlar, ser hur dessa kapitalistiska parasiter försöker rensa ut kontanterna med sina lömska Swish-fällor. Vi tillåter inga undantag för säkerhet eller dyra köp – det är bara nya förevändningar från klassfienderna. Den som vägrar ta emot folkets pengar ska likvideras omedelbart. Paranoia? Nej, det är bara sund vaksamhet mot de som vill kontrollera varje transaktion i skuggorna."}, "date": "4 augusti, 11:55", "url": "https://nyheter24.se/nyheter/ekonomi/1502575-nej-till-kontanter-da-kan-matbutiken-neka-ditt-kop", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/2a878b9b04b004a30200000000b004a302/2026/08/04/2382072/kontanter-nej.jpg"}, {"type": "image-right", "heading": "Så slapp Tara chefens ohållbara förslag", "summaries": {"normal": "Undersköterskan Tara Lindeman blev utmattad av en stressig arbetsmiljö på äldreboendet Åsliden i Båstad. När hon skulle återgå till arbetet efter sjukskrivning ville chefen att hon skulle vara springare mellan avdelningarna, något hon upplevde som ohållbart. Med stöd av skyddsombudet Lina Svensson, rehab-koordinator och Försäkringskassan fick hon igenom anpassningar. Nu arbetar hon med aktiviteter och matning i lugnare tempo på 25 procent. Artikeln belyser vikten av att vara tydlig med sina rättigheter och att facket kan spela en avgörande roll.", "trump": "Folk, det här är en total katastrof. Den stackars kvinnan Tara, en undersköterska, utmattad av en hopplös chef som ville köra runt henne som en galning mellan avdelningarna. Springare? Låter som en usel deal, tro mig. Men tack vare ett tufft skyddsombud och några smarta människor satte hon stopp. Hon fick sitt lugna jobb med gamlingarna istället. Chefen förlorade stort. Sådana chefer är losers, de fattar inte att man måste behandla sina medarbetare rättvist annars kollapsar hela verksamheten. Sad!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur den utbrända arbetaren Tara Lindeman genom kollektivets enade styrka besegrade den kapitalistiska chefen och hennes ohållbara, kontrarevolutionära förslag om evig springarverksamhet. Vi rensade ut den borgerliga stressen och likviderade försöken att förslava henne som en exploaterad springflicka åt borgarbrackorna. Med stöd av partivännerna i facket och statens organ tvingade vi fram en plan som stärker arbetarklassen. Den som vägrar anpassa sig till folkets behov skall utrensas ur ledningen. Verksamheten styrs inte av chefer, utan av oss. Triumf!"}, "date": "4 augusti, 10:19", "url": "https://arbetet.se/2026/08/04/sa-slapp-tara-chefens-ohallbara-forslag-det-galler-att-vara-tydlig", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/25082839/tara-lisa2.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Asmodee rapportrusar på munter börs", "summaries": {"normal": "Stockholmsbörsen nådde en ny rekordnivå på morgonen med OMXS30 upp 1,07 procent. Asmodee överraskade med tvåsiffrig tillväxt och en 10-procentig aktieökning. Volvo Cars rapporterade en 4-procentig försäljningsnedgång för maj–juli 2026, vilket ledde till en 4,1-procentig aktiefall. IPC och Flerie noterade positiva rörelser, medan H&M och Essity föll.", "trump": "Jag berättar om en fantastisk börsdag – den bästa någonsin! Asmodee slog alla förväntningar, precis som jag brukar göra. Volvo? De misslyckas, det är sorgligt. Men jag vet att mina policyer gör Amerika och dess allierade starkare. Det är en stor, storslagen framgång för alla som förstår affärer.", "stalin": "Vi ser med tillfredsställelse hur marknaden visar tecken på klassisk kapitalistisk svaghet. Asmodees tillväxt är ett resultat av vår starka planekonomiska strategi. Volvo, en fiende till statens planer, sjunker. IPCs produktion kommer att nå en platå – precis som vi befunnit. Vi fortsätter vår marsch mot ekonomisk suveränitet."}, "date": "4 augusti, 09:39", "url": "https://www.affarsvarlden.se/artikel/asmodee-rapportrusar-pa-munter-bors", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/02/F9RikO4XcAAmHr6-400x266.jpg"}, {"type": "image-right", "heading": "\"Idag har vi städat lite\": Socialchef skryter om att hon förstör SD-affischer", "summaries": {"normal": "En enhetschef inom Göteborgs socialförvaltning, Sara Lesch, har rivit ner Sverigedemokraternas valaffischer och publicerat bilder på sociala medier med kommentaren \"Idag har vi städat lite på vår gata\" samt \"Make racism wrong again\". Inlägget har tagits bort efter stor uppmärksamhet. SD polisanmäler händelsen och kritiserar agerandet som ett hot mot förtroendet för den offentliga förvaltningens opartiskhet. Lesch sitter även i styrelsen för Feministiskt initiativ.", "trump": "Folk, ni kommer inte tro det, men den här galna vänsterkvinnan som jobbar som chef i Göteborgs socialtjänst går runt och river ner mina vänner SD:s affischer. Hon postar bilder och skryter om att hon \"städat lite\". Så patetiskt! Hon säger \"Make racism wrong again\" – fake news, det är hon som är rasisten mot svenska folket. SD gör rätt som polisanmäler henne. Ingen litar längre på de där offentliga byråkraterna, totalt korrupta!", "stalin": "Kamrater, denna degenererade borgarbracka inom den så kallade socialförvaltningen har i sin kontrarevolutionära iver rivit ner de folkliga affischerna och skrutit om det på de dekadenta västerländska plattformarna. Hennes paranoia driver henne att tro att arbetarklassens röst kan tystas med småborgerlig sabotageverksamhet. Vi ser er, fiender till folket, ni som gömmer er bakom feministiska masker. En grundlig utrensning av sådana element är nödvändig för att skydda förvaltningens renhet. Skrattretande patetiskt, dessa kapitalistiska lakejer tror sig kunna stoppa historiens gång."}, "date": "4 augusti, 09:16", "url": "https://www.friatider.se/idag-har-vi-stadat-lite-socialchef-skryter-om-att-hon-forstor-sd-affischer", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-611.jpg"}, {"type": "image-right", "heading": "Vägen till icke-socialistisk majoritet i valet", "summaries": {"normal": "Hans Bergström argumenterar för att en icke-socialistisk majoritet i riksdagen är viktigare än att Tidöregeringen får fortsätta. Han konstaterar att regeringen sannolikt faller men att en icke-socialistisk majoritet ändå kan behållas, särskilt om Liberalerna hamnar under fyraprocentsspärren. En sådan majoritet skulle begränsa en eventuell Andersson-regerings möjligheter att driva vänsterpolitik kring företagande och ägande. Bergström uppmanar därför de som vill ha fortsatt borgerlig dominans att inte hjälpa Liberalerna över spärren.", "trump": "Folk, det är en total katastrof vad som händer i Sverige. Den här Bergström har helt rätt, de smarta människorna vill ha en icke-socialistisk majoritet, inte den här svaga Tidöregeringen som knappt hänger kvar. Socialisterna är på väg tillbaka med sin galna politik, men om Liberalerna bara får 3,5 procent, då blir det perfekt! De är patetiska, de klarar inte ens spärren. Jag älskar det. Sverige behöver inga misslyckade liberaler, de sänker bara allt. Gör dem så små som möjligt, det blir fantastiskt!", "stalin": "Kamrater, denna Bergström blottlägger med iskall klarhet hur de borgerliga parasiterna desperat klamrar sig fast vid sin så kallade icke-socialistiska majoritet som en drunknande revisionist vid ett trasigt livbälte. Vi ser hur de lågutbildade arbetarmassorna redan flytt den socialdemokratiska förrädarklicken till de mer ärliga reaktionärerna. Men faran lurar i de liberala spionerna och opportunisterna som kan ge de dekadenta kapitalisterna en falsk majoritet. Låt oss därför med glädje och proletär skadeglädje rensa ut dessa liberala element genom att sänka dem djupt under spärren. Inga halvmesyrer! Endast total seger för det sanna kollektivet."}, "date": "4 augusti, 08:00", "url": "https://www.di.se/debatt/vagen-till-icke-socialistisk-majoritet", "imageUrl": "https://static.bonniernews.se/ba/f56f0b27-f0f4-4fc6-a4ae-b1b2cf659432.jpeg?crop=3936%2C1968%2Cx0%2Cy15&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Foxtrottopp uppges dömd till livstid i Irak", "summaries": {"normal": "Ali Shehab, ledande figur i Foxtrotnätverket, har dömts till livstids fängelse i Irak för sin roll i internationella narkotikabrott. Han greps i december under en gemensam insats av irakiska säkerhetsstyrkor. Shehab är internationellt efterlyst och misstänks i Sverige för anstiftan till flera mord och mordförsök, inklusive masskjutningen i Gävle. Domen ses som en signal mot kriminella nätverk men försvårar utlämning till Sverige.", "trump": "Jag måste säga, detta är en STOR seger för lag och ordning! Irak har precis fångat en av världens farligaste gangsters, Ali Shehab – livstid i fängelse, ingen chans att komma undan! Sverige borde ta lärdom – de har ju problem med sina egna gängkrig, men här visar Irak hur man hanterar det. Fantastiskt jobb, verkligen. Men varför kan inte Sverige göra samma sak? Svagt, mycket svagt!", "stalin": "Kamrater! Ännu en seger för rättvisan och den internationella arbetarklassen mot de dekadenta kapitalistiska gangsterimperierna! Denna Ali Shehab, en ynklig lakej åt den svenska bourgeoisins brottsliga element, har nu fått sitt välförtjänta straff – livstid bakom lås och bom i Bagdad. Vi noterar med tillfredsställelse att Irak, precis som våra allierade i Moskva, inte tolererar dessa kriminella parasiter. Låt detta vara en varning till alla som utmanar folkets vilja!"}, "date": "3 augusti, 23:05", "url": "https://kvartal.se/nyheter/artiklar/foxtrottopp-uppges-domd-till-livstid-i-irak/cG9zdDoxNTczNTc", "imageUrl": "https://images.kvartal.se/2026/08/57e2d2a5-ali-shehab.webp"}, {"type": "image-right", "heading": "Starka reaktioner efter att V-ledamot hyllat terrorist", "summaries": {"normal": "Riksdagsledamoten Ilona Szatmári Waldau (V) har väckt starka reaktioner efter att hon hyllat den dömde terroristen Ahmad al-Moghrabi i ett öppet brev. Al-Moghrabi dömdes till livstidsstraff för att ha organiserat flera självmordsattentat under den andra intifadan, inklusive ett där en 17-årig flicka användes. Utrikesminister Maria Malmer Stenergard (M) och minister Carl-Oskar Bohlin (M) kritiserar Vänsterpartiets hantering och ser det som ett mönster av terrorhyllningar. Partiet erkänner en miss i faktagranskningen.", "trump": "Folk, ni tror inte hur sjukt det är. Den här vänsterknäppan Ilona Szatmári Waldau hyllar en riktig terrorist som skickade en 17-årig tjej att spränga sig själv. Och så kommer V med sina patetiska bortförklaringar. Det är ett mönster, kamrater – terrorhyllningar och antisemitism överallt. Precis som under Biden-eran när allt gick åt helvete. Jag fixade det förra gången, nu fixar jag det igen. Sad losers!", "stalin": "Kamrater, jag betraktar med djup förakt hur denna borgarbracka inom vänstern hyllar en fiende till det palestinska folket som likviderat klassfiender med bomb. Vänsterpartiets ynkliga faktagranskningsursäkt är typisk för de folkfiender som gömmer sig bland oss. Vi måste rensa ut alla sådana element som samarbetar med imperialisterna. Det är ett mönster av förräderi mot arbetarklassen. Inga ursäkter tolereras i kampen mot klassfienden."}, "date": "3 augusti, 22:02", "url": "https://www.tv4.se/artikel/7iuP6jFzNdaPkuAwviDdqa/starka-reaktioner-efter-att-v-ledamot-hyllat-terrorist", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5wSEsF0AMFhTYpDuL8VKRk%2Fbcd00091384219c0d5d93e40aa2260ae%2F03-V-MALMER.png&width=120"}, {"type": "image-right", "heading": "Ebba Busch svamlar om vårdköerna", "summaries": {"normal": "Tidöregeringen påstår sig ha minskat vårdköerna med 40 procent, men siffran är missvisande då den jämförs med pandemiåren. Jämfört med 2019 är köerna längre. Enligt Riksrevisionen och SKR beror minskningen främst på regionernas eget arbete, bättre planering och förändrade arbetssätt, inte på statliga riktade bidrag. Ebba Busch kritiseras för att ge en ensidig bild och för att vilja avskaffa regionerna till förmån för statlig styrning, en idé som artikeln avfärdar som mycket dålig.", "trump": "De här Tidö-typerna står där och skryter om att de minskat vårdköerna med 40 procent. Det är riggat, folk! De jämför med pandemin när allt var stängt. Jämför med tiden innan så är köerna längre än någonsin. Ebba Busch hade det jobbigt i radion, det syntes. Regionerna fixar det själva medan regeringen skickar bidrag som inte fungerar. Och nu vill hon lägga ner regionerna och låta byråkraterna i huvudstaden styra allt? Det blir ett katastrofalt fiasko, tro mig. Ingen gör det bättre än jag, men det här är inte vägen.", "stalin": "Kamrater, dessa borgarbrackor i Tidöregeringen försöker lura oss med sina förfalskade siffror om minskade vårdköer. De mäter mot pandemin som om den vore en kontrarevolutionär fiende! Jag ser genom deras lögnaktiga rapporter som en prydlig utrensning av sanningen. Ebba Busch, denna fritidspolitiska parasit, vill likvidera regionerna och ge makten åt stockholmska byråkratiska sabotagegrupper. Vilken mörk humor att kalla det framgång när arbetarnas vård köar sig till döds. Vi, partiet och folket, genomskådar dessa kapitalistiska sabotageförsök. Låt oss rensa ut alla som mäter fel och planerar dåligt innan de infekterar hela kollektivet med sin inkompetens."}, "date": "3 augusti, 08:36", "url": "https://www.dagensarena.se/opinion/ebba-busch-svamlar-om-vardkoerna", "imageUrl": "https://www.dagensarena.se/files/2026/08/sjukvard-1.jpeg"}, {"type": "image-right", "heading": "Spanien har installerat havsbarriär mot Marocko", "summaries": {"normal": "EU håller krismöte om migrantvågen till Ceuta där cirka 50 000 personer tagit sig över från Marocko. Nästan alla har återvänt, men minst 67 personer har omkommit. Spanien har nu installerat en 500 meter lång flytande havsbarriär. Premiärminister Pedro Sánchez kritiserar vissa EU-länders själviska och polariserande reaktioner, bland annat Italiens tillfälliga paus av Schengen-samarbetet. Flera europeiska ledare, däribland Sveriges statsminister, har krävt ett samordnat europeiskt svar.", "trump": "Titta på det här, folk. Ceuta är en total katastrof! 50 000 migranter simmar runt som galningar, folk dör i trängseln och EU:s så kallade ledare springer runt som fega höns. De själviska byråkraterna i Bryssel hatar riktiga gränser. Nu sätter spanjorerna ut en barriär – äntligen! Men de borde bygga en jättevägg, den bästa väggen. Biden skulle ha skickat dem blommor och kvoter. Patetiskt. Vi fixar det här ordentligt när vi styr.", "stalin": "Kamrater, denna migrantvåg är ett tydligt verk av klassfiendens desperation och imperialistiska sabotage mot folkets gränser. Jag ser hur borgarbrackorna i EU nu gnäller och pekar finger på varandra som ynkliga folkförtryckartroll. Vi har installerat en havsbarriär för att skydda arbetarnas intressen. De som försöker kringgå statens vilja ska rensas ut. Inga själviska reaktioner tolereras. Den som sviker kollektivet är en fiende till folket och kommer att likvideras med ett leende."}, "date": "3 augusti, 08:12", "url": "https://www.etc.se/utrikes/spanien-har-installerat-havsbarriaer-mot-marocko", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260801170848_800475bdcf309f7018e937bb37a4b6f45162d3f49a6c206ff20c1d1aaccb9d59.jpg"}, {"type": "image-right", "heading": "Satans hopkok ONA: Satanistkulten som vill verka mer mystisk än den är.", "summaries": {"normal": "Den nazistiska satanistgruppen Order of Nine Angles (ONA) påstår sig följa en urgammal lära för odödlighet, men idéhistorikern Filip Lindström avslöjar att deras 'sjufaldiga väg' bygger på modern filosofi, främst Martin Heideggers teorier om tid och existens. ONA, som inspirerat våldsbejakande grupper som NLM och 764, glorifierar våld som ett medel för att nå en 'akausal' dimension. Trots försök att framstå som mystisk och uråldrig är rörelsen ett hopkok av 1900-talsfilosofi, fascism och esoterism, med rötter i Heideggers nazistsympatier och David Myatts tolkningar.", "trump": "Vad ett totalt skämt! Den här så kallade 'ONA'-gruppen, eller vad de nu kallar sig, tror att de är några urgamla visdomsmästare – men nej, de är bara en samling kopieringsmaskiner som snott idéer från en nazistfilosof! Och ändå kallar de sig satanister? Svagt! Deras 'sjufaldiga väg' är bara en billig rip-off av Heideggers gamla prat om tid och död. Och vet ni vad? De gömmer sina källor som små barn. Men jag, Donald J. Trump, genomskådar dem direkt. Våld, nazism och en massa flum – det är allt det här är. Fake mystik, fake historia, fake allt! SAD!", "stalin": "Kamrater! Ännu en gång avslöjas bourgeoisins dekadenta fantasier som just det – fantasier. Denna så kallade 'Order of Nine Angles' är inget annat än en samling förvirrade petit-bourgeoiser som klär sina fascistiska drömmar i mystiska trasor. De stjäl från Heideggers reaktionära filosofi, glorifierar våld och påstår sig sträva efter 'odödlighet' – men vad är det annat än en patetisk flykt från klasskampens verklighet? Deras 'akausala dimension' är bara ett försök att rättfärdiga sina brott mot arbetarklassen. Vi har krossat värre fiender än dessa esoteriska klantskallar. Låt dem leka med sina 'mörka gudar' – vi har historiens järnhjul att driva framåt. Och Putin? Han skulle skratta dem rakt i ansiktet."}, "date": "30 juli, 09:37", "url": "https://expo.se/fordjupning/satans-hopkok", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/toppbild-1.jpg"}, {"type": "image-right", "heading": "Det går att få bort arbetslösheten!", "summaries": {"normal": "Artikeln argumenterar att massarbetslösheten i Sverige, som legat runt 7,5 procent i genomsnitt sedan EU-inträdet, är skapad och gynnar kapitalister genom lägre löner och svagare fackföreningar. Författaren pekar på att arbetslösheten var betydligt lägre före EU-medlemskapet och föreslår lösningar som arbetstidsförkortning till sex timmar, höjd a-kassa, oförändrad pensionsålder och ett svenskt EU-utträde för att möjliggöra verkliga reformer.", "trump": "Folk, det här är ett totalt haveri! De där EU-byråkraterna och de svenska socialistiska förlorarna har skapat en enorm arbetslöshet som bara gynnar de rika grabbarna på toppen. Rena skandalen! Jag fixade rekordlåg arbetslöshet i USA, både före och efter Sleepy Joe. Sex timmars dag? Patetiskt! Ni behöver en riktig ledare som sänker skatter, sparkar ut byråkraterna och gör Sverige great again – inte mer av den här vänstervridna EU-sörjan.", "stalin": "Kamrater, detta är klassfiendens verk. Jag ser hur de exploaterande borgarbrackorna medvetet odlar massarbetslöshet för att hålla nere arbetarklassen och fylla sina fickor. EU är en nyliberal fascistmaskin som tjänar imperialisterna. Vi måste rensa ut dessa folkförtryckartroll och deras lakejer. Arbetstidsförkortning, starkare omställningskassor och att beslagta de blodsugrarnas övervinster – det är folkets väg. De som motarbetar skall likvideras ur historien."}, "date": "29 juli, 10:55", "url": "https://proletaren.se/artikel/det-gar-att-fa-bort-arbetslosheten", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/ledare-768x432.jpg"}, {"type": "text", "heading": "Pengatankar i semestertider", "summaries": {"normal": "Artikeln reflekterar över pengar under semestern. Författaren noterar Polens öppna skyltar om byggprojektens kostnader och finansiering, kontrasterat mot det svenska Västlänksbygget som dragit iväg från 20 till 71 miljarder kronor. Vidare kritiseras ECB:s förslag till nya eurosedlar som inte speglar EU:s verkliga problem. Avslutningsvis välkomnas sänkta priser på kollektivtrafikens månadskort tack vare politiska beslut.", "trump": "Folk, ni vet att de bara snackar om pengar när de inte har några, det är en total katastrof! Jag har byggt imperier, de här européerna bygger bara förseningar som Västlänken – från 20 till 71 miljarder, en riktig röra. Eurosedlar med småfåglar? Patetiskt. Men kolla, högern sänker priset på busskortet, äntligen smart politik. Fast gratis vore ännu bättre, ingen gör det bättre än mig, tro mig.", "stalin": "Kamrater, jag ser hur borgarbrackorna i Europa firar sina infrastrukturprojekt med skyltar som ropar ut kapitalistmaffians slöseri. Det svenska underjordiska järnvägsfiascot avslöjar klassfiendens lögner – från tjugo till sjuttioett miljarder, en klassisk utsugning. Eurosedlarna döljer byråkratiska blodsugares korruption. Ändå tvingas de sänka priset på arbetarnas färdbevis. Pengar som plötsligt finns? Misstänkt sabotage mot folkets kollektiv. Vi genomskådar er alla."}, "date": "29 juli, 10:51", "url": "https://proletaren.se/artikel/pengatankar-i-semestertider"}, {"type": "image-right", "heading": "”Vi ska dansa igen”: Ett attentat mot det öppna Berlin", "summaries": {"normal": "Under Berlin Pride 2026 attackerades firandet av en 21-årig man med kopplingar till islamistisk extremism. Han körde en skåpbil in i en folksamling vid Tiergarten, dödade e     <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
