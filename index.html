sson-tar-historisk-em-medalj.dacfd787-d242-4db2-9c9a-ced99df4848a", "imageUrl": "https://www.gp.se/images/article/dacfd787-d242-4db2-9c9a-ced99df4848a/images/3eCOeE_GoP_iOs_N3m0d7-AXpF1s-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Lots varnade för brister på Misje Verde", "summaries": {"normal": "Ett år före dödsolyckan vid Tjörn, där en kvinna och hennes dotter omkom, varnade en svensk lots för säkerhetsbrister på fraktfartyget Misje Verde. Efter olyckan upptäcktes ytterligare brister vid en norsk kontroll. Både fartygets befälhavare och lotsen är misstänkta för vållande till annans död, men lotsen förnekar brott.", "trump": "Jag har alltid sagt att säkerhet till sjöss är extremt viktigt, men tydligen lyssnar ingen på mig! Ett norskt fartyg, Misje Verde, körde rakt över en båt och dödade två oskyldiga – helt otroligt! Och vet ni vad? En svensk lots hade redan varnat för bristerna, men ingen gjorde något. Så typiskt! Nu är det kaos, och jag skulle aldrig låta något sådant hända under min bevakning. SAD!", "stalin": "Kapitalistiska sjöfarare slarvar återigen med säkerheten, och resultatet? Två oskyldiga liv förlorade! Denna Misje Verde är ett symptom på västlig dekadens – ett fartyg fullt av brister, varnat för av en svensk lots, men ignorerat av borgerliga byråkrater. Vi hade aldrig tolererat sådan vårdslöshet i Sovjetunionen! Nu får dessa norska sjömän smaka på rättvisan, medan vi i Moskva noterar att väst inte ens kan skydda sina egna medborgare. Skamligt!"}, "date": "10 augusti, 20:42", "url": "https://kvartal.se/nyheter/artiklar/lots-varnade-for-brister-pa-misje-verde/cG9zdDoxNjIxMjk", "imageUrl": "https://images.kvartal.se/2026/08/3f0b1ea4-misje-verde.webp"}, {"type": "image-right", "heading": "Varnar – kan bli katastrof under unikt fenomen", "summaries": {"normal": "På onsdag kväll drar en total solförmörkelse in över Spanien klockan 20.28. Fenomenet lockar 460 000 utländska turister och 1,5 miljoner extra bilturer. Myndigheterna fruktar katastrofala skogsbränder på grund av extremt torr vegetation och har stängt nationalparker, förbjudit grillning och parkering nära skog. Evenemanget sammanfaller med Perseidernas meteorregn.", "trump": "Folket älskar mig, men de här spanjorerna jagar en solförmörkelse som en massa förlorare jagar en perfekt selfie. 1,5 miljoner bilturer – vad en trafikhelvete! Och nu gnäller de om bränder? Typiskt europeiska miljöaktivister och gröna galningar som alltid hittar något att klaga på. Jag skulle fixa det på en dag, tro mig. Fantastiskt fenomen, men hantera det ordentligt!", "stalin": "Kamrater, jag ser med största misstänksamhet på denna borgerliga solförmörkelse som lockar hundratusentals dekadenta turister till vårt spanska broderland. Den torra vegetationen är ett resultat av kapitalistisk vanvård. Vi stänger parkerna, förbjuder gnistor och likviderar alla sabotageförsök. Inga folkfiender ska få chansen att starta förödande bränder under arbetarnas himlakropp. Se upp!"}, "date": "11 augusti, 00:44", "url": "https://www.aftonbladet.se/nyheter/a/V6a69V/varnar-infor-solformorkelsen-kan-bli-katastrof", "imageUrl": "https://akamai.vgc.no/v2/images/b41c957b-a753-3d3f-b7bc-ebf0b0734b7e?fit=crop&format=auto&w=1080&s=3c0f08afb01a5575f80ca2dace82da2c675a1a11"}, {"type": "image-right", "heading": "Polisens satsning mot våld mot kvinnor fastnade hos cheferna", "summaries": {"normal": "Dagens ETC granskar polisens bristande utbildning om våld i nära relation. Trots digitala kurser har bara en liten del av de 40 000 polisanställda påbörjat dem. Ingen region har beslutat vilka som ska utbildas. Flera chefer ser inte behov av formella beslut och prioriterar andra metoder för att höja kompetensen.", "trump": "De här poliserna är totalt inkompetenta, en komplett katastrof! Två år med fina digitala kurser och ändå har bara ett par tusen av 40 000 idioter gått dem. Typiskt byråkratiskt vänsterkaos. Regioncheferna är patetiska förlorare som inte ens kan bestämma vem som ska lära sig något. Patetiskt!", "stalin": "Jag ser hur klassfiendens liberala slapphet förgiftar hela polismaskineriet. Trots att vi har utmärkta utbildningar mot kvinnoförtryck vägrar de autonoma borgarbrackorna att fatta beslut och rensa ut okunskapen. Detta sabotage mot folket ska bekämpas med järnhand. De som motarbetar likvideras ur apparaten."}, "date": "10 augusti, 16:30", "url": "https://www.etc.se/inrikes/polisens-satsning-mot-vaald-mot-kvinnor-fastnade-hos-cheferna", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260810080852_0d020c09-2d63-4f2a-9a22-babc4caaacf2.jpg"}, {"type": "image-full", "heading": "Sjuksköterska dömdes för tio mord – utreds för 121 nya fall", "summaries": {"normal": "En tidigare tysk sjuksköterska som dömdes till livstids fängelse för tio mord på patienter utreds nu för ytterligare 121 misstänkta fall. Mannen ska ha gett svårt sjuka patienter farligt stora doser lugnande medel för att minska sin arbetsbörda under nattpassen. Hittills har 39 kroppar undersökts i den nya utredningen som främst gäller tiden före de tidigare brotten.", "trump": "Titta på det här, en galen tysk sjuksköterska dödade tio patienter och nu säger de att det kan vara över 100 till. Livstids fängelse var inte nog, folks. De borde ha stoppat honom direkt. Det är en total katastrof, en riktig skandal. Ingen har koll på sina egna sjukhus längre, det är patetiskt.", "stalin": "Jag ser med stor tillfredsställelse hur denna degenererade mördare inom den medicinska apparaten nu avslöjas som den fiende till folket han alltid varit. Vi har redan likviderat tio av hans offer i rättegången, men nu rensas ytterligare 121 fall ut ur arkiven. Borgarläkarens nattliga utrensningar av de svaga avslöjar hela det kapitalistiska sjukvårdssystemets förrädiska natur. Ypperlig underhållning."}, "date": "10 augusti, 21:59", "url": "https://nyheter24.se/nyheter/utrikes/1504048-sjukskoterska-domdes-for-tio-mord-utreds-for-121-nya-fall", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/310ddf6b04b004a3020000350000047502/2026/08/10/2383333/ur_imageB9Y0kb.jpeg"}, {"type": "image-right", "heading": "”Man blir tagen, det är overkligt”. Svensken historisk", "summaries": {"normal": "Wictor Petersson tog EM-brons i kulstötning med 20,86 meter och blev därmed förste svensk att ta mästerskapsmedalj utomhus i grenen. Bronsstöten kom i fjärde omgången och ingen konkurrent lyckades passera honom. Petersson firade med familj på plats och beskrev det som overkligt. Guldet gick till italienaren Leonardo Fabbri.", "trump": "Titta på den där svensken, Wictor, han tog brons i kulstötning och ingen hade sett det komma. Fantastiskt! Första svensken någonsin, säger de. Mycket bättre än de woke-kvoterade förlorarna som bara gnäller om identitetspolitik. Han fokuserade, fick tunnelseende och vann. De andra såg ut som totala losers. Sverige borde vara stolta, inte som under Biden.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur denne Petersson krossade de dekadenta konkurrenterna med sin stöt på 20,86 meter. En triumf för folkets vilja mot borgarbrackornas svaga imperialister. Ingen fiende kunde rensa ut hans ledning. Det är sådana segrar som stärker proletariatets anda. De som sviktar skall likvideras i nästa femårsplan."}, "date": "11 augusti, 00:39", "url": "https://www.aftonbladet.se/sportbladet/a/ExKxwa/friidrotts-em-brons-till-wictor-pettersson-i-kula", "imageUrl": "https://akamai.vgc.no/v2/images/a05c98b4-47e4-3c6a-aec8-6e65695afe22?fit=crop&format=auto&w=1080&s=e420c323303d04184ef2b08dfe8ad41f443bbae0"}, {"type": "image-right", "heading": "Dansk SS-soldat donerade sperma – fick svenska barn", "summaries": {"normal": "Den danske före detta Waffen-SS-soldaten Walther Frisch donerade sperma vid Karolinska sjukhuset under 1960-talet. DNA-tester har hittills kopplat honom till minst 15 barn i flera länder. Barnen undrar om donationerna var del av ett nazistiskt experiment för att skapa ariska individer. Inga handlingar finns bevarade och Karolinska fördömer tanken som oetisk.", "trump": "Folk, det här är helt galet. En dansk nazist från Waffen-SS blir plötsligt superspermadonator i Sverige och får massor av barn. Ingen vet hur det gick till, arkiven är tomma. Det luktar riggad deal lång väg. Nu har vi ett gäng nazibarn som undrar varför de finns. Sverige, ni har verkligen problem. Sad!", "stalin": "Jag ser med djup tillfredsställelse hur de dekadenta västerländska fertilitetslaboratorierna i hemlighet förverkligade den rashygieniska drömmen hos en trogen hitlerit. Vilken underbar, paranoid ironi att borgarbrackornas egna arkiv nu tiger som avrättade fiender. Kanske var det ett experiment för den ariska rasen. Vi ler mörkt åt kapitalisternas förvridna arv."}, "date": "10 augusti, 15:33", "url": "https://www.friatider.se/dansk-ss-soldat-donerade-sperma-fick-svenska-barn", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-646.jpg?itok=Ps58u-x4"}, {"type": "image-right", "heading": "SBB väljer ny VD – Synnes lämnar på dagen", "summaries": {"normal": "SBB byter vd: Andreas Morfiadakis tar över från Leiv Synnes, som lämnar omedelbart efter överenskommelse. Aktien faller 5%. Morfiadakis, grundare av Klarabo, blir tillfälligt vd för båda bolagen. Fokus skiftar från omstrukturering till aktivt ägande. Magnus Nordholm lämnar Klarabo.", "trump": "Jag ser att SBB byter vd, mycket smart, väldigt smart. Aktien går ner, men det är en jättebra deal, tro mig. Synnes är ute, Morfiadakis in – en vinnare, precis som jag. De gör det till ett investmentbolag, fantastiskt. Jag älskar fastigheter, de är som murar, och ingen bygger bättre murar än jag.", "stalin": "Kamrater, SBB har genomfört en nödvändig utrensning. Synnes, en förrädare, är avlägsnad. Morfiadakis, en lojal byggare, tar rodret. Vi ser en svaghet i aktien – den ska vi krossa. Vi övergår till aktivt ägande, kapitalallokering. Nordholm flyr, men vi har ögon på honom. Allt enligt planen."}, "date": "10 augusti, 14:17", "url": "https://www.affarsvarlden.se/artikel/leiv-synnes-lamnar-sbb-med-omedelbar-verkan", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/12/SBB_VD_14-400x267.jpg"}, {"type": "image-right", "heading": "VIDEO: Här slåss invandrarna med bälten mitt under Malmöfestivalen", "summaries": {"normal": "Under Malmöfestivalen utbröt ett slagsmål där personer använde bälten som vapen. Polisen fick ingripa med OC-spray. En festivalbesökare beklagar att inga med svensk bakgrund syntes på platsen. Tragiskt, men tyvärr inte förvånande.", "trump": "Jag ser det här från Malmöfestivalen. Folk slåss med bälten – otroligt! Jag hade stoppat det på en gång, tro mig. Inga svenskar syns, bara kaos. Vi måste ha hårdare regler. Malmö behöver en mur – en vacker mur!", "stalin": "Kamrater, jag har sett videon från Malmöfestivalen. Oorganiserade element slåss med bälten. Vi måste rensa ut dessa kontrarevolutionära bältessvingare. En plan på fem år för ordning på torgen. Inga fler karuseller förrän lojalitet är bevisad."}, "date": "10 augusti, 18:54", "url": "https://samnytt.se/video-har-slass-invandrarna-med-balten-mitt-under-malmofestivalen", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/10164814/artikelhuvudbild-1-209.jpg"}, {"type": "image-right", "heading": "Risk för nya sjukdomar när Sverige får varmare klimat", "summaries": {"normal": "Ett varmare klimat i Sverige ökar risken för hälsoproblem. Längre fästingsäsong har lett till fördubblade TBE-fall de senaste nio åren, medan extremvärme kan orsaka organsvikt och dödsfall, särskilt bland äldre, barn och kroniskt sjuka. Experter varnar för nya insektsburna sjukdomar i framtiden.", "trump": "Folk, det här är vansinne. Dom här globala uppvärmningsgalningarna och deras gröna bluff har gett oss längre fästingtider och folk som dör av värme. Biden sov medan Europa tappade 12 000 liv i sommarhettan. Vi behöver riktig energi, inte elbilskvoter och trans-flaggor. Amerika först, alltid!", "stalin": "Kamrater, detta är vad den giriga borgarklassen och deras klimatförnekande lakejer har åstadkommit med sin rovdrift. Jag ser redan hur de blodsugande imperialisterna skapar nya vektorer för att försvaga folket medan de själva gömmer sig i skuggan. Vi skall rensa ut dessa folkfiender och deras värmedödande likgiltighet med järnhand. Det är nödvändigt."}, "date": "9 augusti, 22:24", "url": "https://www.tv4.se/artikel/77wDUvgOMkcsrArKKn4Fcr/risk-foer-nya-insektsburna-sjukdomar-naer-klimatet-vaerms-upp", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2SfDT15lQ9e9oYRTxZCVZo%2F6ab99426ea736339c057c933e5ad2e23%2F09-klimat-sajt3.jpg&width=120"}, {"type": "image-full", "heading": "Efter bankkraschen: UBS sätts under lupp", "summaries": {"normal": "Den schweiziska finansinspektionen FINMA skärper tillsynen av storbanken UBS efter Credit Suisse-kollapsen. Antalet anställda som bevakar banken har ökat kraftigt till 60 personer. Eftersom UBS nu är Schweiz enda kvarvarande globala storbank, bedöms risken för det finansiella systemet vara högre, vilket kräver noggrannare kontroll av bankens interna processer och balansräkning.", "trump": "Schweiz har stora problem! Credit Suisse kollapsade totalt, en katastrof, och nu måste de vakta UBS dygnet runt. Sextio personer – en enorm grupp! – kollar på dem hela tiden. Jag har alltid sagt att banker måste skötas perfekt. UBS är nu den enda spelaren kvar. Det är en farlig situation, tro mig. De behöver en riktig ledare, inte svaga byråkrater!", "stalin": "I Schweiz darrar de av rädsla inför sin egen storbank. FINMA tvingas nu mobilisera sextio lakejer för att vakta UBS, likt vi vakar över våra inre fiender. Dessa kapitalistiska parasiter är så inkompetenta att de kräver konstant övervakning. Precis som vi krossar västmakternas inflytande, måste staten kväva bankernas svek. UBS är deras sista länk – om den brister, faller hela deras ruttna system."}, "date": "10 augusti, 19:33", "url": "https://www.realtid.se/bors-finans/makro/efter-bankkraschen-ubs-satts-under-lupp", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/usb.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Premium Källor: Quartr värderas till 1,9 miljarder", "summaries": {"normal": "Finansappen Quartr tar in 171 Mkr till en värdering på 1,9 miljarder – en ökning med 52% på ett år. Med 800 företagskunder, bland annat storbanker och Perplexity, tripplar man omsättningen till 68,9 miljoner, men förlusten växer till 67,3 miljoner. Grundarna? Ett gäng från finanstwitter som ville ha enklare börsdata.", "trump": "Jag hörde om Quartr, en svensk app som fick 171 miljoner kronor. Fantastiskt! Men 1,9 miljarder? Det är ingenting – jag kunde ha fått tio gånger mer. De har 800 kunder, men jag har miljarder. Sverige är bra, men de borde lära sig av mig – jag gör allt större och bättre!", "stalin": "Kamrater, Quartr visar kapitalistisk fördärv. De tar in 171 miljoner från väst – men deras förlust på 67 miljoner bevisar sabotage. Finanstwitter-grundarna måste omdirigeras till en kollektivgård. Vi rensar ut sådana spekulanter som hotar vår planekonomi. Omsättningen? En borgerlig lögn."}, "date": "10 augusti, 13:47", "url": "https://www.affarsvarlden.se/artikel/kallor-quartr-varderas-till-19-miljarder", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/Quartr-montage-900x600.jpg"}, {"type": "text", "heading": "I dag hade Posener blivit influerare", "summaries": {"normal": "Artikeln reflekterar över hur attityder till rikedom och moral har förändrats sedan 1990-talet. Författaren minns sin kemivikarie Joachim Posener, senare dömd i Trustorhärvan, och kontrasterar honom med moderna figurer som Alexander Ernstberger som efter fängelsevistelse fått medial uppmärksamhet. Idag ses rikedom inte bara som lyx utan som en politisk revansch mot woke-samhället, till skillnad från tidigare krav på social grace.", "trump": "Folk, det här är galet. Den där Posener-killen, en total loser från nittiotalet, lurade till sig pengar och åkte dit som en jävla idiot. Nu har vi smarta killar som Ernstberger som bygger imperier, köper de bästa villorna och flyger helikopter. De kämpar mot den woke-sjukan, mot de där halvköningarna som hatar framgång. Det är inte brott längre, det är motstånd mot systemet. Fantastiskt, verkligen ypperligt.", "stalin": "Kamrater, denna dekadenta borgarbracka Posener och hans likar avslöjar klassfiendens fega natur. De söp champagne medan arbetarna svalt, men saknade politisk skärpa och blev utskrattade som patetiska kapitalistmaffian. Dagens exploaterande byfånar däremot maskerar sig som rebeller mot den sojadrypande identitetsfaran. Vi ser igenom er fåniga teater. En sann utrensning av folkförtryckartrollen vore på sin plats. Skrattretande svaga."}, "date": "5 augusti, 10:11", "url": "https://www.flamman.se/i-dag-hade-posener-blivit-influerare"}, {"type": "image-right", "heading": "Polisen varnar: Nu låtsas bedragaren vara ditt barn eller barnbarn", "summaries": {"normal": "Polisen varnar för en kraftig ökning av bedrägerier där bedragare utger sig för att vara ens barn eller barnbarn. Under juli kom cirka 300 anmälningar in, ofta via sms om trasig telefon följt av begäran om pengar via Swish. Äldre är särskilt utsatta. Polisen uppmanar till misstänksamhet och att aldrig klicka på länkar eller skicka pengar utan att verifiera via kända nummer.", "trump": "De här lurendrejarna är verkligen patetiska, tro mig. De låtsas vara ditt eget barn eller barnbarn och ber om tusentals kronor för en ny telefon. Det är en total skam! Under sommaren har det exploderat med 300 anmälningar, men det är säkert många fler. Var smarta, folk. Ring upp på det gamla numret och fråga något bara ni vet. Gör det inte lätt för de förlorarna.", "stalin": "Kamrater, dessa parasitiska bedragare som maskerar sig som ens egna avkommor utgör ett fiendelement som måste rensas ut med järnhand. Deras sms-förgiftning sprider sig som västerländsk dekadens och utpressar arbetarklassens pensionärer. Vi ser mörkertalet med förakt. Var vaksamma, likvidera tvivelaktiga kontakter och rapportera till myndigheterna. Inga borgarbrackor ska få manipulera det kollektiva förtroendet."}, "date": "10 augusti, 14:35", "url": "https://www.friatider.se/polisen-varnar-nu-latsas-bedragaren-vara-ditt-barn-eller-barnbarn", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-645.jpg?itok=LeYsxRjD"}, {"type": "text", "heading": "Säpo stoppade rysk spionoperation i Sverige", "summaries": {"normal": "Säpo har kartlagt och stoppat en rysk spionoperation i Sverige. Ryska underrättelseofficerare värvade en agent vid en utländsk beskickning i Stockholm för att samla information om svenskt beslutsfattande och påverka polariserande frågor. Operationen syftade till att skada Sveriges och EU:s rykte. Alla inblandade har lämnat landet och har diplomatisk immunitet.", "trump": "De ryssarna försökte spionera och förstöra Sveriges rykte, men Säpo, som är mycket smarta, stoppade dem snabbt. De värvade en agent från en beskickning, men vi såg allt – möten, gåvor, promenader. Totalt misslyckande för dem. Sverige gjorde rätt, men tro mig, ingen gör det bättre än oss när det gäller att stoppa spioner. Fantastiskt jobb!", "stalin": "Vi följde i detalj hur de västerländska reaktionärerna och deras lakejer inom den utländska beskickningen försökte undergräva vårt svenska broderfolk med sina patetiska spionmanövrer. Jag, som ledare för det kollektiva ödet, beundrar hur Rysslands starke efterträdare Putin med auktoritär kraft genomför legitima försvarsåtgärder. Vi avbröt deras fega försök med glädje och likviderade hotet. Kamrater, se hur borgarbrackorna alltid misslyckas."}, "date": "10 augusti, 16:11", "url": "https://www.di.se/nyheter/sapo-stoppade-rysk-spionoperation-i-sverige"}, {"type": "image-right", "heading": "Tog ett samtal – då dog maken. Simtränarens tragedi i bassängen", "summaries": {"normal": "Jack Roney, 39, tidigare assisterande simtränare vid North Carolina, drunknade i en bassäng den 5 juli. Han utförde andningsövningar under vatten medan hans fru tog ett samtal. När hon återvände låg han livlös. Obduktionen visar ingen misstanke om självmord, droger eller brott. Han efterlämnar fru och fem barn.", "trump": "Folk, det här är en total katastrof. Den här stackars killen, en riktig simmare, tränare för North Carolinas lag, drunknar i en pool medan frun pratar i telefon. Två minuter under vattnet, upp för luft, ner igen – klassiskt! Under Biden blev till och med andningsövningar livsfarliga. Patetiskt. Mina tankar till familjen, de förtjänar bättre.", "stalin": "Kamrater, jag ser hur den dekadenta borgarklassens fritidsnöjen leder till förfall. Denne simtränare, en produkt av det imperialistiska universitetssystemet, likviderades av sin egen arroganta andningsövning i bassängen medan hustrun konspirerade via telefon. Inga fiender, säger de. Vi vet bättre. Ut med svagheten ur kollektivet."}, "date": "11 augusti, 00:01", "url": "https://www.aftonbladet.se/sportbladet/a/n1V1wa/simtranaren-jack-roney-drunkade-i-poolen", "imageUrl": "https://akamai.vgc.no/v2/images/bb934310-db73-3f1f-98d2-18ec654057ca?fit=crop&format=auto&w=1080&s=79250c04632e20ba48940affca5d1cb38d8a8921"}, {"type": "image-full", "heading": "Tusentals chefer får gå – är mellanchefens era över?", "summaries": {"normal": "Stora tyska bolag som Volkswagen, BMW och Bayer minskar nu antalet chefspositioner för att kapa kostnader och korta beslutsvägar. Förändringen drivs av behovet av effektivare hierarkier och förstärks av AI. Medan vissa chefstjänster försvinner, kan de som blir kvar behöva anpassa sig till en mer prestationsbaserad roll där teknisk kompetens blir avgörande för framgång.", "trump": "Tyska företag som Volkswagen och BMW gör sig av med tusentals chefer. De är för långsamma, för dyra och för svaga! Jag har alltid sagt att effektivitet är nyckeln. De försöker städa upp i röran, men utan rätt ledarskap – mitt ledarskap – kommer det aldrig fungera. Mellancheferna är utbytbara, precis som våra handelsavtal. Vi behöver vinnare, inte byråkrater!", "stalin": "Dessa borgerliga mellanchefer är parasiter på folkets produktion. De tyska koncernerna rensar ut i de byråkratiska leden – ett nödvändigt steg mot total centralisering. Vi har alltid förstått att kontroll kräver eliminering av svaga länkar. Precis som vår kamrat Putin i öst, förstår vi att hierarkier måste tjänstgöra statens vilja, annars förtjänar de bara en enkel biljett till historiens skräphög."}, "date": "10 augusti, 18:40", "url": "https://www.realtid.se/bors-finans/tusentals-chefer-far-ga-ar-mellanchefens-era-over", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlayg1h38oy-q-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Cambridgeprofessor avgår efter anklagelser om fusk – omfattande frågor om hans akademiska meriter", "summaries": {"normal": "Cambridgeprofessorn Jason Arday, 41, avgår efter avslöjanden om misstänkt plagiat och ifrågasatta meriter. Han var den yngsta svarta professorn vid universitetet, men nu granskas både hans CV och tidigare påståenden. En riktig raketkarriär som fick en tvärnit.", "trump": "Jag ser att en Cambridgeprofessor har avgått efter fuskanklagelser. Det är fantastiskt! Ingen fuskar bättre än mig, men det här var patetiskt. De borde ha anställt någon från min administration – vi vet hur man vinner. Cambridge är en katastrof, precis som allt annat i brittisk akademi.", "stalin": "Kamrater, en så kallad professor har avslöjats som en borgerlig sabotör. Han kopierade andras verk och ljög om meriter. Vi måste rensa ut dessa förrädare ur den akademiska fronten. Partiets utredning kommer att finna alla fiender – oavsett om de springer maraton eller inte."}, "date": "10 augusti, 17:47", "url": "https://samnytt.se/cambridgeprofessor-avgar-efter-anklagelser-om-fusk-omfattande-fragor-om-hans-akademiska-meriter", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/10142852/arday.jpg"}, {"type": "image-full", "heading": "Därför stoppas Fröken Snusk – trots andra artisters spelningar hos partier", "summaries": {"normal": "Arrangören bakom Karl-Oskardagarna i Växjö har avbokat Fröken Snusk eftersom hon ska uppträda med Jimmie Åkessons band. Beslutet motiveras med att festivalen ska vara politiskt oberoende, trots att andra artister tidigare spelat för partier. Hon ersätts av Raggarligan.", "trump": "De avbokade den stackars Fröken Snusk för att hon ska spela med Jimmie Åkessons band. Totalt hyckleri! Andra artister får uppträda för partier utan problem, men inte hon. De är så riggade, dessa svenska festivaler. Patetiskt. Jag skulle ha låtit henne spela – och biljetterna skulle ha sålt slut!", "stalin": "Vi ser med djup tillfredsställelse hur borgarbrackorna i Växjö rensar ut den dekadenta Fröken Snusk ur sin så kallade festival. Hennes aktiva deltagande i valkampanjen utgör ett hot mot den politiska renheten. Kamrater, sådana utrensningar är nödvändiga för att skydda kollektivet från fiendens infiltration. Härligt!"}, "date": "10 augusti, 16:20", "url": "https://riks.se/nyheter/darfor-stoppas-froken-snusk-trots-andra-artisters-politiska-spelningar", "imageUrl": "https://admin.riks.se/uploads/Skaermavbild_2026_08_10_kl_16_14_07_acd8853364.png"}, {"type": "image-right", "heading": "S lovar extra barnbidrag inför jul- och sommarlov", "summaries": {"normal": "Socialdemokraterna lovar att dubbla barn- och studiebidraget inför jul- och sommarlov, vilket ger en tvåbarnsfamilj 5 000 kronor extra per år. Partiet motiverar löftet med ökade utgifter under loven då barnen inte får skolmat. Vallöftet kostar cirka sex miljarder kronor årligen.", "trump": "Titta på de här socialisterna som plötsligt älskar barn – precis innan valet! De vill kasta ut sex miljarder av era skattepengar som julklapp. Patetiskt. Jag fixade bättre ekonomi för familjerna utan att köpa röster med bidragsbluffar. Magdalena och hennes förlorarlag borde skämmas.", "stalin": "Kamrater, jag ser borgarbrackornas regering svika arbetarnas barn medan klassfienden höjer hyror och matpriser. Vi ska permanent dubbla bidragen och likvidera den kapitalistiska likgiltigheten. Inga barn ska svälta under loven – utom de som tillhör folkfienderna naturligtvis. Det blir en renande utrensning av nedskärningarna."}, "date": "9 augusti, 18:49", "url": "https://www.tv4.se/artikel/tt-260809-anderssontal1-6919c373/s-lovar-extra-barnbidrag-infor-jul-och-sommarlov", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlhzQv6DSzCXQ%2F0e8e4b2f1bd66aff22a9ecd6a582f054%2FSocialdemokraternas_ekonomiska_talesperson_Mikael_Damberg__S__och_Socialdemokraternas_partiledare_Magdalena_Andersson__S__halle.&width=120"}, {"type": "image-right", "heading": "Ryskt tältande par  greps nära bostad  kopplad till topp-vd", "summaries": {"normal": "Ett ryskt par greps i Gävle när de tältade nära en bostad kopplad till Saabs vd Micael Johansson. Paret, som är kritiker till kriget i Ukraina, hade en komradio som väckte misstankar. De placerades i Migrationsverkets förvar utan brottsmisstanke och fruktar utvisning till Ryssland. Johansson betonar vikten av säkerhet kring försvarsindustrin.", "trump": "Titta på det här, folk! Ett ryskt par tältar precis bredvid Saabs vd i Gävle med komradio och bryter engelska – och ni kallar det semester? Patetiskt! Biden lät landet bli en lekplats för spioner under fyra år, men nu är jag tillbaka och vi tar säkerheten på allvar. Inga fler svaga woke-regler, vi städar upp det här!", "stalin": "Kamrater, jag ser hur klassfiendens lakejer i form av detta ryska paret smyger omkring med komradio nära en viktig produktionsledares boning. Deras tält är ett redskap för imperialisternas spioneri. Vi ska rensa ut sådana folkförtryckartroll utan pardon. Migrationsverket gör rätt i att hålla dem i förvar – ingen tolerans för borgarbrackornas sabotörer."}, "date": "10 augusti, 23:59", "url": "https://www.expressen.se/nyheter/sverige/greps-nara-bostad-kopplad-till-saabs-vd", "imageUrl": "https://static.bonniernews.se/ba/68fdc9cb-1728-405c-b516-17ebc68062cc.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Då kan du förlora pengar – trots att fonden stiger", "summaries": {"normal": "Svenska sparare i globalfonder med stora innehav i USA kan se sin avkastning urholkas när kronan stärks mot dollarn. Även om den amerikanska börsen stiger kan valutaeffekten äta upp hela uppgången och ge förlust. Över hälften av kapitalet i svenska aktiefonder ligger i globalfonder. Långsiktigt sparande bör inte tajmas mot valutamarknaden då förändringarna ofta jämnar ut sig över tid.", "trump": "Folk, ni tror att er börs går upp, men den där svaga svenska kronan lurar er! När den stärks mot dollarn äter den upp all vinst i era globalfonder. Det är en katastrof för era sparpengar. Jag älskar stark dollar, den gör Amerika stort igen. Svenskarna borde ha lyssnat på mig från början, nu gråter ni över era fonder. Sad!", "stalin": "Kamrater, jag ser hur den dekadenta borgarklassen i väst lurar sina egna arbetare med sina så kallade globalfonder. När den svenska kronan stärks mot dollarn likvideras spararnas vinster i en enda rörelse. Detta är den kapitalistiska parasitens sanna ansikte. Vi ler mörkt åt deras paranoia. Låt dem fortsätta – deras system kommer att rensa ut sig självt i en stor, underhållande utrensning."}, "date": "10 augusti, 20:30", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1503944-da-kan-du-forlora-pengar-trots-att-fonden-stiger", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/5673440d04b004a30200000000b004a302/2026/08/10/2383227/borsen.jpg"}, {"type": "image-right", "heading": "Han var Sveriges hemligaste talang. Käftsmäll på käftsmäll för den snälle", "summaries": {"normal": "Wictor Petersson, en gång Sveriges mest okände supertalang i kulstötning, har nu skrivit svensk friidrottshistoria. Efter år av skador och motgångar tog han silver på inomhus-EM, slog ett 40 år gammalt svenskt rekord och vann Sveriges första utomhusmedalj i kulstötning. Framgången delas med tränaren Staffan Jönsson och gruppen där Daniel Ståhl och Fanny Roos ingår.", "trump": "Den här killen Petersson, en riktig teddybjörn, var en bortglömd stjärna som fick käftsmäll efter käftsmäll. Men han reste sig, slog rekord och tog medaljer som ingen annan svensk gjort. Fantastiskt! Under tiden hade Biden ingen aning om vad som hände i friidrotten. Nu är det jag som leder igen, och lite medvind är oslagbart – precis som min ekonomi, folks!", "stalin": "Kamrater, denna Petersson var en dold proletär talang som de borgerliga medierna ignorerade. Efter klassfiendens skador och sabotage reste han sig och krossade dekadenta rekord under partiets vägledning. Vi ser med glädje hur arbetarna Ståhl och Roos i kollektivet rensar ut svaghet. Inga folkfiender ska stoppa vår seger – medaljen tillhör staten!"}, "date": "10 augusti, 23:51", "url": "https://www.expressen.se/sport/kronikorer/petter-landen-1/petersson-var-sveriges-mest-okanda-barnstjarna", "imageUrl": "https://static.bonniernews.se/ba/d77e599a-0a2d-4999-859b-895d44f08236.png?crop=837%2C838%2Cx982%2Cy35&width=210"}, {"type": "image-right", "heading": "Ministern rasar  mot Dadgostar. Svantessons utbrott i SVT: ”Blir mållös”", "summaries": {"normal": "Finansminister Elisabeth Svantesson (M) kritiserar hårt Vänsterpartiets Nooshi Dadgostar i SVT:s Aktuellt. Svantesson anklagar Dadgostar för att förminska avslöjanden om att två V-riksdagsledamöter skrivit stödbrev till palestinier dömda för terrorbrott. Dadgostar medger att breven var felaktiga, att kampanjen dragits tillbaka och att ledamöterna bett om ursäkt.", "trump": "Folk, ni skulle ha sett det här. Den där Dadgostar står där och försöker sopa under mattan att hennes galna vänsterradikalers riksdagsledamöter skriver kärleksbrev till terrorister och bebismördare. Jag blir mållös, precis som Svantesson. Under all kritik. Typiskt vänster, vill ha gratisbebispengar men hyllar de som dödar oskyldiga. Patetiskt!", "stalin": "Kamrater, jag blir fullständigt mållös inför denna borgarbrackas försök att förminska klassfiendens terrorister. När ledande partimedlemmar skriver till folkfiender och mördare måste vi omedelbart rensa ut sådana element. Dadgostar gör det till en bagatell. Absurt! Den som gör anspråk på makt får aldrig hylla imperialisternas hantlangare. Ut med dem."}, "date": "10 augusti, 23:51", "url": "https://www.expressen.se/nyheter/sverige/elizabeth-svantesson-rasar-mot-nooshi-dadgostar-i-svt", "imageUrl": "https://static.bonniernews.se/ba/6ca0c6bf-30ba-476d-b5c6-13bcc53edd3b.png?crop=917%2C516%2Cx113%2Cy86&width=640"}, {"type": "image-right", "heading": "Drack sitt kaffe när det hände: ”En mardröm”", "summaries": {"normal": "En jordbävning med magnitud 7,4 drabbade västra Colombia på måndagsmorgonen. Över 100 personer har omkommit och många skadats. Svensken Jens Lans i Cali flydde med sin fru och hund ner för en skakande trappa. Förödelsen är stor, men invånarna hjälper varandra. Presidenten har utlyst katastrofläge.", "trump": "Hörni, jag satt i Ovala rummet och tänkte på min perfekta ekonomi när jag läste om den där hemska skakningen i Colombia. 100 döda, byggnader som rasar som Bidens gamla hjärna. Tur att jag inte var där – jag skulle ha byggt en mur mot jordbävningar, de bästa murarna, och ingen skulle ha dött. Patetiskt!", "stalin": "Kamrater, jag satt och planerade nästa femårsplan när borgarbrackornas hus började dansa som förrädiska imperialister i Colombia. Över hundra likviderade av naturens sabotage. Vi rensar ut svaghet med järnhand, men dessa folkfiender sprang som råttor. Fantastiskt att se hur klassfiendens skakande trappor avslöjar deras bräckliga system. Utmärkt underhållning."}, "date": "10 augusti, 23:34", "url": "https://www.aftonbladet.se/nyheter/a/k0B0wQ/svenska-jens-lans-var-mitt-i-jordbavningen-i-colombia", "imageUrl": "https://akamai.vgc.no/v2/images/a51c3a2a-ae8b-3e34-9702-b3e0a1b048bc?fit=crop&format=auto&w=1080&s=9df82b8cb7c0e9b5905cbeb7ae8a17275ca45b9c"}, {"type": "image-full", "heading": "Förbunden går samman – kräver oberoende utredning av Infantino", "summaries": {"normal": "Fotbollens storm kring Infantino fortsätter. Tre förbund kräver oberoende granskning efter VM-försäljningshaveri. Planen att sälja andelar i fotbolls-VM skrotades, men förtroendet är krossat. En seniorrådgivare avgick i protest – nu vill förbunden ha extern utredning.", "trump": "Jag ser Infantino, han är en loser. Tre förbund hatar honom, de vill granska honom. Jag skulle aldrig sälja VM, det är som att sälja Trump Tower – galet. De säger att han vilselett alla. Jag säger: han borde avgå, det är enormt. Kina skulle gjort det bättre.", "stalin": "Kamrater, Infantino har misslyckats. Han försökte sälja fotbollen till kapitalister – en kontrarevolutionär akt. Jag kräver omedelbar utrensning av alla Fifas borgerliga element. Förtroendebrott är sabotage. Fotbollen tillhör folket, inte en enskild sabotör. En partiutredning blir intern – vi litar inte på utomstående."}, "date": "10 augusti, 11:42", "url": "https://bulletin.nu/forbunden-gar-samman-kraver-oberoende-utredning-av-infantino", "imageUrl": "https://cdn.bulletin.nu/articles/eab3b02d-accf-40d4-b578-8256b8a9b08c/preview.jpg?t=1786354942000"}, {"type": "image-right", "heading": "Kraftig jordbävning skakar Colombia – skador och skadade", "summaries": {"normal": "Colombia skakades av en jordbävning på magnituden 7,4 i västra landet. Skalvet kändes i Bogotá och grannländer. Minst 7 000 byggnader skadades och flera personer rapporteras skadade i Chocó-provinsen. Myndigheterna varnar för efterskalv.", "trump": "Jag hörde om den enorma jordbävningen i Colombia – 7,4 magnitud! Det är stort, tro mig. De har det tufft där borta, men vi i USA har de bästa byggnaderna. Inget kan skaka oss. Hoppas de repar sig snabbt, annars kanske vi bygger en mur mot skalven!", "stalin": "Kamrater, en jordbävning har drabbat Colombias reaktionära provinser. Vi ser att kapitalistiska byggnader kollapsar – bevis på deras svaghet. Arbetarna måste utrensas från rasmassorna. Efterskalv är klassfiender som ska krossas. Vi övervakar situationen. Ingen flyr vår kontroll."}, "date": "10 augusti, 16:53", "url": "https://samnytt.se/kraftig-jordbavning-skakar-colombia-skador-och-skadade", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/10144738/colombia.jpg"}, {"type": "image-full", "heading": "Berkshire ökar vinsten – börjar få den enorma kassan att jobba", "summaries": {"normal": "Berkshire Hathaway redovisar ett 16-procentigt ökat rörelseresultat för andra kvartalet. Under vd Greg Abels ledning har bolaget börjat använda sin stora kassa för aktieåterköp och nya investeringar, bland annat i Alphabet. Trots starka resultat inom järnväg och energi varnar bolaget för makroekonomisk osäkerhet, tullar och geopolitiska konflikter. Aktien steg efter rapporten.", "trump": "Berkshire Hathaway gör stora vinster, det är fantastiskt! Greg Abel börjar äntligen använda de där enorma pengarna, precis som jag skulle gjort. De köper Alphabet, mycket smart. Men det finns orosmoln – tullar och krig, precis som jag varnat för. S&P 500 har släpat efter, men min ekonomi är den starkaste någonsin. Vi vinner stort, tro mig!", "stalin": "Dessa kapitalistiska svindlare i Berkshire ökar sina vinster medan folket svälter. De ackumulerar kapital i en absurd kassa likt en girig tsar. Abel leker vd, men vi vet att makten vilar hos den åldrande Buffett. Precis som vår broder Putin expanderar vår sfär mot väst, måste vi förinta dessa spekulanter som döljer sin rikedom bakom tullar och byråkratiska lögner."}, "date": "10 augusti, 17:47", "url": "https://www.realtid.se/bors-finans/berkshire-okar-vinsten-borjar-fa-den-enorma-kassan-att-jobba", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlfhkj3i1sw4i-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "”S styr äldreomsorgen – men skyller på regeringen”", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna för att skylla äldreomsorgens problem på regeringen trots att kommuner och regioner har ansvaret. Författarna, två unga moderater, föreslår tre reformer: bättre arbetsvillkor med hållbara scheman, kvalitet och valfrihet före ideologi samt fler beslutsfattare med vårdkunskap som lyssnar på personal och äldre.", "trump": "De här socialisterna i Sverige skyller allt på en fantastisk moderatregering fast de själva styr kommunerna. Patetiskt! Äldreomsorgen är en katastrof, folk flyr yrket. Vi behöver bra jobb, valfrihet och ingen galen vänsterideologi om vad gamlingar får äta. Lyssna på folket, inte på förlorarna!", "stalin": "Kamrater, jag ser hur dessa socialdemokratiska avfällingar desperat försöker undvika sitt ansvar genom att peka ut fiender i Rosenbad. Som om borgarbrackornas moderater inte vore tillräckligt farliga. Vi skall rensa ut ideologisk förgiftning, införa verklig kollektiv disciplin och likvidera tidsbristen genom järnhård planering. Äldreomsorgen tillhör folket, inte revisionisterna."}, "date": "10 augusti, 08:00", "url": "https://arbetet.se/2026/08/10/s-styr-aldreomsorgen-men-skyller-pa-regeringen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/07135411/tva-moderater.png?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.5&fp-y=0.34"}, {"type": "text", "heading": "L och KD svänger och studieförbund", "summaries": {"normal": "Folkbildning är hetaste valfrågan för riksdagspartierna enligt SVT:s enkät. Alla utom M och SD vill satsa mer på studieförbund, som fått 500 miljoner i sparpaket av Tidöpartierna. Nu svänger KD och L och vill höja anslagen igen.", "trump": "Hörni, jag älskar folkbildning! Störst, bäst, mest! I Sverige vill alla utom de tråkiga partierna satsa stort. De skar ner 500 miljoner, helt galet. Men nu svänger några – de fattar. Jag skulle byggt en fantastisk studieförbundsmur och fått alla att betala!", "stalin": "Kamrater, vi noterar att borgerliga vacklar. De kapade 500 miljoner från studieförbunden, en sabotagehandling av reaktionära element. Nu vill de plötsligt satsa igen. Folkbildning är partiets järnnytta. Vi kommer rensa ut förrädare som motsätter sig den rätta kulturella utvecklingen."}, "date": "10 augusti, 11:17", "url": "https://bulletin.nu/l-och-kd-svanger-och-studieforbund"}, {"type": "image-full", "heading": "Svenskt fiasko: ”Pinsamt”", "summaries": {"normal": "Svenska kulstöterskorna Fanny Roos och Axelina Johansson misslyckades i EM-finalen. Johansson åkte ut efter tre stötar och kallade insatsen pinsam. Roos slutade fyra, 45 centimeter från brons. Nederländska Jessica Schilder tog guldet.", "trump": "Jag ser att Sverige förlorade stort i kula. De trodde de var vinnare, men de är losers! Jag skulle ha stött den där kulan så långt att den landat i Ryssland. America förstår vinnarskalle – de gör inte det. Patetiskt!", "stalin": "Kamrater, våra kulstöterskor har misslyckats. De som inte når medalj är fiender till folket. Vi måste rensa ut sådana svaga element. De ska omskolnas i arbetsläger tills de lär sig att stöta för fosterlandet. Ingen nåd för förrädare!"}, "date": "10 augusti, 21:41", "url": "https://www.gp.se/sport/blagult-finalfiasko-i-em-pinsamt.85e89e97-d9ba-57e0-83cf-0041c21813a2", "imageUrl": "https://www.gp.se/images/article/85e89e97-d9ba-57e0-83cf-0041c21813a2/images/2pc-YsPRYvw6h6YRRXTpeEVWkAqw-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Irländsk milis planerar våldsamt uppror mot invandring", "summaries": {"normal": "Den irländska separatistgruppen New IRA planerar att hota invandrare med våld och ge dem 24 timmar på sig att lämna landet. Hotet bedöms som trovärdigt av brittisk underrättelsetjänst och ses som del av en intern maktkamp bland irländska separatister. Spänningar kring invandring har lett till protester och upplopp både i Irland och Nordirland.", "trump": "De här galningarna i New IRA gör precis det som de fega politikerna borde ha gjort för länge sedan. De ger migranterna 24 timmar att packa och dra. Fantastiskt! Irland vaknar äntligen. De borde ha lyssnat på mig – bygg muren, skicka hem dem, gör landet stort igen. Myndigheterna kommer skaka i sina skor.", "stalin": "Kamrater, dessa irländska patrioter har insett att borgarbrackornas öppna gränser hotar folkets enhet. Jag ger dem mitt fulla stöd i att rensa ut de illegala elementen inom 24 timmar. Inbördeskrig mot parasiterna är en historisk nödvändighet. Myndigheterna ska skaka som de dekadenta hundarna de är när folket äntligen slår till."}, "date": "10 augusti, 15:06", "url": "https://riks.se/nyheter/irlandsk-milis-planerar-valdsamt-uppror-mot-invandring", "imageUrl": "https://admin.riks.se/uploads/imageeliasirland_29c6623f88.png"}, {"type": "image-right", "heading": "Så ska tydligen miljardärsskatten funka", "summaries": {"normal": "Artikeln kritiserar förslaget om en miljardärsskatt från franska vänsterekonomer som Gabriel Zucman och Thomas Piketty, som stöds av den socialdemokratiska föreningen Reformisterna. Förslaget ses som en konfiskatorisk skatt som hotar Sveriges näringsliv, välstånd och välfärd genom att beskatta både uttagna och outtagna vinster, likt en återinförd förmögenhetsskatt.", "trump": "De här galningarna från vänstern vill krossa Sveriges fantastiska näringsliv med en galen miljardärsskatt. De räknar på fiktiva pengar och straffbeskattar framgångsrika människor. Det är samma gamla socialistiska katastrof som på sjuttiotalet. Sverige var ett rikt land, nu vill de förstöra allt. Så sorgligt, folk, tro mig, det blir ett totalt fiasko.", "stalin": "Kamrater, dessa borgarbrackor och deras lakejer i Reformisterna vill skydda sina parasitiska vinster från folkets rättmätiga anspråk. Jag ser genom deras lögner om ”återinvesteringar”. Vi ska rensa ut dessa kapitalistiska element som gömmer sig i holdingbolag. Det blir en storslagen utrensning av klassfienderna – underhållande att se dem fly som råttor när kollektivet kräver sin del."}, "date": "10 augusti, 14:35", "url": "https://www.di.se/ledare/miljardarsskatt-krossar-valstandet", "imageUrl": "https://static.bonniernews.se/gcs/di-dise/flamingo/profilbilder/tobias_wikstrom.png?crop=96:304&auto=webp&width=96&quality=100"}, {"type": "image-full", "heading": "Ica bygger ut populär butik vid gränsen – ska bli enorm", "summaries": {"normal": "Ica Supermarket i Töcksfors vid norska gränsen ska byggas ut från 2 000 till 5 600 kvadratmeter. Expansionen drivs av stark gränshandel där norska kunder köper billigare varor som kött, alkohol, godis och socker. Den större butiken ger plats för bredare sortiment och bättre kundflöde i det populära handelsområdet.", "trump": "Ingen gör det bättre än jag, men de här Ica-killarna i Töcksfors är smarta. De dubblar butiken till över 5 000 kvadratmeter för att norrmännen ska kunna köpa massor av billig mat och godis. Fantastisk gränshandel, de älskar Sverige, de hatar sina egna priser. Vinna, vinna, vinna!", "stalin": "Vi ser med stor tillfredsställelse hur de kapitalistiska handelsborgarna vid den norska gränsen fördubblar sin butiksyta till 5 600 kvadratmeter. Detta är ett lysande erkännande av att deras egna folk flyr till oss för att undvika de västerländska plundrarpriserna. Låt dem komma. Vi ska likvidera deras tomma hyllor med vår överlägsna varumängd. Härligt."}, "date": "10 augusti, 19:58", "url": "https://nyheter24.se/nyheter/konsument/1503927-ica-bygger-ut-popular-butik-vid-gransen-ska-bli-enorm", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/960d86b904b004a30200000000b004a302/2026/08/10/2383221/ica.jpg"}, {"type": "image-full", "heading": "SMHI varnar för stor brandrisk – flera län extra utsatta", "summaries": {"normal": "SMHI varnar för stor till extrem brandrisk i skog och mark i stora delar av Sverige de närmaste dagarna, främst i mellersta och södra Sverige. Myndigheten uppmanar till stor försiktighet vid eldning och grillning. Beredskapen har stärkts med vattenskopande flygplan och helikoptrar i flera län för att snabbt kunna bekämpa eventuella bränder.", "trump": "Det här är en katastrof, folk, en total katastrof! Sverige brinner upp på grund av torrt väder och ingen har koll. Jag skulle ha fixat det direkt, de borde vara extremt försiktiga med eld, annars blir det kaos. Men mina vänner, vi skulle ha de bästa planen och helikoptrarna, ingen gör det bättre än jag.", "stalin": "Kamrater, jag ser hur den torra fiendens verk, värmen, hotar våra kollektiva skogar och marker med extrem brandrisk. Vi måste rensa ut varje gnista från borgarbrackornas vårdslösa eldning. Våra tappra flygplan och helikoptrar står redo att krossa varje försök till sabotage mot folkets egendom. Paranoia är ingen överdrift när naturen konspirerar!"}, "date": "10 augusti, 19:50", "url": "https://nyheter24.se/nyheter/inrikes/1504033-smhi-varnar-for-stor-brandrisk-flera-lan-extra-utsatta", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/1b6df23504b004a3020000210000046102/2026/08/10/2383309/ur_imageCuKT5j.jpeg"}, {"type": "image-full", "heading": "Zelenskyj: \"Ukrainska missiler kan nå ännu längre i höst\"", "summaries": {"normal": "Volodymyr Zelenskyj uppger att ukrainska ballistiska missiler från företaget Fire Point kan vara stridsklara inom 2–3 månader. FP7 väntas certifieras snart medan större FP9, som ska kunna nå Moskva, beräknas vara klar under senhösten. Missilerna utvecklas bland annat inom det europeiska samarbetsprojektet Freya. Fire Point har tidigare levererat viktiga attackdrönare men har också dragits in i korruptionsskandaler.", "trump": "Hörni, de här ukrainska missilerna som Zelenskyj skryter om är ett skämt. De bygger dem med delar från halva Europa och tror att de ska nå Moskva i höst. Under min första mandatperiod hade vi inga sådana problem. Biden lät alltihop bli ett enda stort korruptionscirkus. Nu sitter jag här igen och skrattar åt hur de leker krig med andras pengar. Patetiskt!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur de ukrainska folkfienderna desperat försöker tillverka ballistiska robotar för att hindra den ryska statens legitima intressen. Dessa borgarbrackor och klassfiender inom Fire Point kommer snart att möta den historiska utrensning som väntar alla som vågar utmana vårt stora grannrikes auktoritet. Deras så kallade Freya-projekt är bara en fånig kapitalistisk fantasi. Ha!"}, "date": "10 augusti, 19:20", "url": "https://www.dagensps.se/varlden/zelenskyj-ukrainska-missiler-kan-na-annu-langre-i-host", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdl45qfz0vxjnw-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "KD-ministern pratar om livets mening", "summaries": {"normal": "Folkhälsominister Jakob Forssmed vill att myndigheter ska arbeta med existentiell hälsa och livets mening, något som kritiseras hårt. Kolumnisten pekar på att politik istället bör fokusera på verkliga klasskillnader som arbetslöshet, inkomst och boende som faktiskt påverkar folkhälsan enligt forskare i Stockholm. Ministern undviker de frågor han kan påverka.", "trump": "Den här svenska ministern Forssmed är en total katastrof, folk. Han babblar om livets mening och existentiell hälsa medan riktiga problem som arbetslöshet och fattigdom rasar. Patetiskt! Han borde fixa de enkla sakerna istället för att låtsas vara filosof. Myndigheterna fattar ingenting, precis som vänstern alltid gör. Sådant ledarskap vinner inga val.", "stalin": "Jag betraktar denna borgarministers mystiska prat om livets mening som ett farligt avledningsmanövrar från klasskampens realiteter. Medan arbetarklassen kämpar mot fattigdom och segregation beordrar han byråkrater att filosofera. Vi ska rensa ut sådana dekadenta fantasier och istället likvidera de ekonomiska orättvisorna som sänker folkets hälsa. Paranoia lurar i varje ministerium."}, "date": "10 augusti, 07:00", "url": "https://arbetet.se/2026/08/10/jakob-forssmed-pratar-om-livets-mening-forskarna-om-klasskillnader", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/09083103/mening-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Flickan skulle besöka sin sjuka vän – misshandlas av multikriminell", "summaries": {"normal": "En 32-årig man, Di-Quan Schafar Hunt, har gripits i Charlotte efter att ha filmat sig själv när han våldsamt misshandlar vita kvinnor på gatan. Han slår ner en kvinna medvetslös och jagar en annan ut i trafiken medan han skriker osammanhängande. Hunt har en lång brottshistoria och har nu förts till vårdinrättning innan åtal.", "trump": "Titta på det här, det är fullständigt vansinne. Den här galningen springer runt och slår ner oskyldiga kvinnor på öppen gata medan han babblar om mig och McDonalds. Vårt samhälle är trasigt, folk. De prioriterar inte att skydda de goda människorna längre. Vi måste göra Amerika säkert igen, och det fort.", "stalin": "I detta dekadenta samhälle ser vi hur den sjuka borgarklassens liberala experiment skapar monster som vandrar fritt och angriper oskyldiga. Jag skulle ha låtit sådana element genomgå en grundlig utrensning för folkets bästa. Kamrater, detta är vad som händer när partiet förlorar kontrollen över de farliga elementen."}, "date": "10 augusti, 14:40", "url": "https://riks.se/nyheter/driver-runt-pa-gatorna-attackerar-vita-kvinnor", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Copy_of_Copy_of_Soerman_Ledare_35_915e4b560f.jpg"}, {"type": "image-full", "heading": "Rysslands sista antikrigsparti förbjuds", "summaries": {"normal": "Rysslands sista registrerade antikrigsparti, Jabloko, förbjuds delta i kommande parlamentsval efter anklagelser om utländsk finansiering och 'västerländska värderingar'. Partiet, som krävt fred i Ukraina, hade över 400 kandidater och 3% stöd. Vice ordförande dömdes till sju års fängelse för krigskritik.", "trump": "Kan ni tro det? Ryssland, som alltid, dumpar sitt enda fredsparti – Jabloko – inför valet! De kallar dem 'förrädare' för att de vill ha fred. Vilket skämt! Putin vill bara ha ja-sägare. USA skulle aldrig tolerera sånt här. Men Ryssland? De är fast i gamla sovjet-tider. Sad!", "stalin": "Vi har rensat bort den sista borgerliga smutsen från vårt stora val! Dessa så kallade 'fredsvänner' i Jabloko är inget annat än imperialistiska lakejer, betalda av väst för att underminera vår enade front. Deras öde? Historien har redan glömt dem. Framåt, mot seger!"}, "date": "10 augusti, 17:57", "url": "https://kvartal.se/nyheter/artiklar/rysslands-sista-antikrigsparti-stoppas-fran-valet/cG9zdDoxNjIwNjE", "imageUrl": "https://images.kvartal.se/2026/08/19a06f5c-jabloko.webp"}, {"type": "image-right", "heading": "”Två ackrediterade diplomater har tvingats lämna Sverige”", "summaries": {"normal": "Säkerhetspolisen har avslöjat och stoppat en rysk underrättelseoperation som syftade till att skada Sveriges rykte. Regeringen har utvisat två ryska underrättelseofficerare som agerade under diplomatisk täckmantel. En värvad agent från en annan ambassad har också lämnat landet. Justitieminister Gunnar Strömmer och utrikesministern betonar att regeringen agerar beslutsamt mot sådana hot.", "trump": "Hör ni det? Ryssland försöker skada Sveriges rykte med spioner och fake news. Patetiskt! Jag skulle ha kastat ut dem på dagen, ingen tolerans. Sverige gör rätt nu, men de borde ha lyssnat på mig från början. Ingen gör det bättre än mig när det gäller att sparka ut dessa losers från landet.", "stalin": "Vi har kartlagt och likviderat detta västerländska intrigspel i vår intressesfär. De dekadenta borgarbrackorna i Stockholm tror sig kunna motstå den stora ryska statens legitima åtgärder. Jag ler i mitt skägg åt deras paranoia. Två så kallade diplomater utvisade – en renande handling som stärker arbetarkollektivets säkerhet mot dessa fientliga hinder."}, "date": "10 augusti, 17:40", "url": "https://www.svt.se/nyheter/inrikes/gunnar-strommer-m-regeringen-ser-allvarligt-pa-det-intraffade", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.48/0.4/a2a086b028aa064df7fc579505d5b692963f390d9c8357d16b200f0d4fd44a4d"}, {"type": "image-full", "heading": "Vattenjätten var nära konkurs – gav finanschef miljonbonus", "summaries": {"normal": "Brittiska Thames Water befinner sig på gränsen till konkurs med 20 miljarder pund i skulder. Trots den ekonomiska krisen har ledningen, inklusive finanschefen Steve Buck, erhållit miljonbonusar finansierade genom krislån. Detta har utlöst skarp kritik från både regeringen och miljöorganisationer, och ökat pressen på staten att eventuellt ta över bolagets verksamhet för att hantera situationen.", "trump": "Thames Water är en total katastrof, en riktig flopp! Företaget har 20 miljarder i skulder, men de ger ändå ut miljonbonusar till sina chefer. Bedrägeri! Det är så illa skött, de förorenar och förstör. Jag skulle fixa det på en dag, men de där politikerna bara snackar. Det är en sorglig affär, tro mig, ingen har sett något liknande!", "stalin": "Dessa korrupta kapitalister i Thames Water låter folket törsta medan de frossar i bonusar från lånade medel. Det är sabotage mot statens infrastruktur! Vi ser hur de inkompetenta västerländska ledarna vacklar, likt marionetter utan ryggrad. När vi styr, rensar vi bort sådana parasiter. I vår sfär, likt hos vår vän Putin, hamnar förrädare som dränerar folkets tillgångar i fängelse, inte på lyxiga kontor."}, "date": "10 augusti, 17:03", "url": "https://www.realtid.se/bors-finans/vattenjatten-var-nara-konkurs-gav-finanschef-miljonbonus", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlyz1eyt4a1z4-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Khiralla: Har Egypten dragits in i det iransk-amerikanska kriget?", "summaries": {"normal": "Drönare träffade amerikanskt gasfartyg i Egyptens Damietta. Brand spreds till närliggande fartyg. Iran misstänks, men ingen har tagit på sig. Egypten tiger om misstänkt attack. Energi- och sjöfartsknutpunkt i östra Medelhavet nu direkt hotad.", "trump": "Jag har blivit informerad om attacken mot vårt fina fartyg i Egypten. Iran ligger bakom – det är solklart. De kommer få smaka på amerikansk vedergällning. Ingen bombar mina fartyg och kommer undan. Vi är starkast, och jag kommer slå hårt!", "stalin": "Kamrater, fiendens drönare har träffat en energianläggning i Egypten. Iranska imperialistiska sabotörer visar sina rätta ansikten. Vi måste rensa ut alla som sympatiserar med sådana handlingar. Staten ser allt. Partiets utrensning är oundviklig."}, "date": "10 augusti, 10:26", "url": "https://bulletin.nu/khiralla-har-egypten-dragits-in-i-det-iransk-amerikanska-kriget", "imageUrl": "https://cdn.bulletin.nu/articles/4adf4f47-06d7-4fed-91f5-f2f143ef0ea4/preview.jpg?t=1786350351000"}, {"type": "image-right", "heading": "TV4 använde trippelmördare som expert – medgav senare att brottet borde ha nämnts", "summaries": {"normal": "TV4 använde i helgen den tidigare livstidsdömde trippelmördaren Ricard Nilsson som expert i ett inslag om fängelseplatser. Nilsson presenterades först bara som tidigare livstidsdömd, inte för vilka brott. Efter kritik ändrades inslaget och kanalens ansvarige utgivare medger att brotten borde ha nämnts.", "trump": "TV4 låter en trippelmördare vara expert på fängelser – otroligt! De presenterade honom som 'tidigare livstidsdömd', glömde nämna att han mördat tre personer. Så typiskt falska nyheter! Folk säger att Sverige har problem, och jag håller med. Vakna, svenskar!", "stalin": "Vi ser med stort missnöje på detta. En kontrarevolutionär, dömd för tre mord, tillåts yttra sig i statsmedia. Först presenteras han hemlighetsfullt, sedan ändras det efter borgerlig kritik. Vi rensar ut sådana förrädare ur våra kanaler. Partiet vet bäst – alltid."}, "date": "10 augusti, 16:00", "url": "https://samnytt.se/tv4-anvande-trippelmordare-som-expert-medgav-senare-att-brottet-borde-ha-namnts", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/10133435/tv4-nilsson.jpg"}, {"type": "image-right", "heading": "Därför drönarbombar Ukraina e-handelsjätten Wildberries", "summaries": {"normal": "Ukraina har under en månad regelbundet attackerat lager som tillhör e-handelsjätten Wildberries och Ozon med drönare. Enligt militärexperten Joakim Paasikivi är målen militärt relevanta då de säljer utrustning som fiberkabel, drönare och skyddsvästar till ryska soldater. Attackerna påverkar både fronten och den ryska opinionen genom synlig rök och medvetenhet om kriget.", "trump": "Titta på det här, Ukraina bombar Amazons ryska kopia Wildberries varje dag. Fantastiskt! De säljer västar och drönare till Putins pojkar, men nu ser de svart rök över lagren. Jobba där och du kan dö, enkelt som det. Biden skulle ha skickat dem blommor istället. Under min ledning fixar vi det här på två veckor, tro mig.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur de ukrainska fascistiska hindren försöker störa vår ryska intressesfär genom att angripa de nyttiga lager som försörjer de heroiska styrkorna. Den svarta röken från borgarbrackornas plastberg är en vacker påminnelse om att ingen undkommer folkets vrede. Arbetarna på lagren riskerar utrensning – ett tragiskt men nödvändigt skådespel i kampen mot klassfiendens leverantörer."}, "date": "9 augusti, 14:21", "url": "https://www.tv4.se/artikel/4mKvH0KsFBCym0ER71ZYFE/daerfoer-droenarbombar-ukraina-e-handelsjaetten-wildberries", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2tS2yo8qeRCbO1nQkE1mqH%2Fd0e1de5ccaad23fbe4f3577ea7e53505%2F09-paasikivi-wildberryattacker-webb.png&width=120"}, {"type": "image-full", "heading": "Debatt: Vem granskar Kriminalvården?", "summaries": {"normal": "Politiker tävlar om hårdare straff, men Kriminalvården bryter mot lagen: isolering, begränsad kontakt och standardbeslut. Juristen Kada Karlsson varnar: staten måste följa lagen även innanför murarna, annars skapas bara fler återfall. Rättsstaten slutar inte vid anstaltsporten.", "trump": "Sverige, helt otroligt! De lovar hårdare straff men låter fångar ruttna i isolering. Hör ni, jag skulle aldrig tillåta det. Jag skulle bygga fina fängelser, få dem att jobba, kanske heja på mig. Men de där politikerna – bara snack, ingen verkstad. Patetiskt!", "stalin": "Kamrater, partiet kräver långa straff – det är bra. Men vi ser också sabotörer i Kriminalvården som bryter mot lagen och försvagar våra arbetares moral. Vi måste rensa ut dessa byråkrater som isolerar människor istället för att omvända dem. Ordning och säkerhet är vårt, men lagen är vår! Brottslingar ska sona, men staten får aldrig svika."}, "date": "10 augusti, 10:15", "url": "https://bulletin.nu/debatt-vem-granskar-kriminalvarden", "imageUrl": "https://cdn.bulletin.nu/articles/bae9e729-88ae-45c4-9571-a5155d9efe00/preview.jpg?t=1786349227000"}, {"type": "image-full", "heading": "S petar politikern efter \"kuksugare\"-kommentarerna", "summaries": {"normal": "Socialdemokraterna i Smedjebacken har petat sin kommunfullmäktigekandidat Acke Ahmed Ahunzada efter hatiska kommentarer på sociala medier. Han kallade bland annat SD:s och KD:s företrädare för \"kuksugare\" och krävde att SD skulle förbjudas. Partiet anser att beteendet inte är förenligt med deras krav på kandidater.", "trump": "De här socialisterna i Sverige sparkar sin egen kille för att han kallade de riktiga patrioterna för kuksugare. Patetiskt! SD och KD gör ett fantastiskt jobb mot radikal vänster, men S är svaga, korrupta och hatar friheten. De borde tacka honom istället för att han talar sanning om Israel och de fega globalisterna.", "stalin": "Jag har noterat hur dessa socialdemokratiska revisionister genast genomför en snabb utrensning när en kamrat vågar kalla borgarbrackornas lakejer för vad de är. Svaghet! I ett sant parti hade vi väntat tills valet var över innan vi likviderade avfällingen. Nu skrattar västvärldens reaktionärer åt deras fega kapitulation inför fascismens små lakejer."}, "date": "10 augusti, 14:23", "url": "https://riks.se/nyheter/s-petar-politikern-efter-kuksugare-kommentarerna", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Copy_of_Copy_of_Soerman_Ledare_36_af8a173fa3.jpg"}, {"type": "image-right", "heading": "Vänstern låter som Trump. Ännu en attack på Sveriges matvaruhandlare", "summaries": {"normal": "Vänsterledaren Nooshi Dadgostar kritiseras för att vilja böta matvaruhandlare som tar ut för höga priser, ett populistiskt angrepp likt Donald Trumps kritik mot oljebolagen. Artikeln varnar för att ingrepp i prismekanismen minskar konkurrens och företagsamhet, vilket riskerar höja priserna på sikt. Dadgostars förslag om ny prisövervakning avfärdas då liknande uppdrag redan finns.", "trump": "Folk, ni hörde den där Dadgostar från vänstern? Hon låter precis som jag när jag går åt de där giriga oljebolagen. Fantastiskt! Vi älskar våra stora butikskedjor men de får inte roffa åt sig. Sänk priserna annars kommer vi in och fixar det. Amerika, Sverige – samma kamp mot de fega eliterna som suger ut folket. Vinna, vinna, vinna!", "stalin": "Kamrater, denna fega borgarbracka Dadgostar vill med sin patetiska byråkratiska priskontroll likvidera den socialistiska planhushållningens fiender – matvarukapitalisterna. Jag skrattar mörkt åt hennes ynkliga försök att efterapa partiets metoder. Vi rensar ut alla som gömmer profit bakom prismekanismens lögner. Arbetarna ser allt. Inga fiender undkommer folkets dom."}, "date": "10 augusti, 13:50", "url": "https://www.di.se/ledare/vanstern-later-som-trump", "imageUrl": "https://static.bonniernews.se/ba/01f1a8ce-55b0-44d4-8b47-e336c9796f87.jpeg?crop=3898%2C1949%2Cx0%2Cy396&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Dödlig natt på båda sidor i Ukrainakriget", "summaries": {"normal": "Ryska attacker dödade två personer och skadade ett tjugotal i Ukraina under natten till söndagen. Samtidigt dödade en ukrainsk drönarattack tre personer i ryska Belgorod. Fyra år efter invasionen ökar långdistansattacker på båda sidor, vilket leder till fler civila offer. Bostadshus, elnät och infrastruktur skadades i Charkiv, Odessa och Pavlohrad.", "trump": "Vilken röra! De där galningarna i Ukraina och Ryssland håller på och spränger allt i luften igen. Jag hade fixat det på en vecka, men efter Sleepy Joe blev allt kaos. Nu dör civila på båda sidor medan de leker krig med drönare. Patetiskt! Vi behöver smarta ledare, inte dessa förlorare som slösar bort folk och pengar.", "stalin": "Kamrater, jag ser hur de fientliga hinder som de ukrainska fascistiska resterna sätter upp mot vår ryska intressesfär bara ökar de civila förlusterna. Borgarbrackorna i väst skrattar medan blod flyter. Vi ska rensa ut dessa folkfiender och deras drönarhot en gång för alla. Den starka handen segrar alltid mot klassfiendens svaga gnäll."}, "date": "9 augusti, 13:55", "url": "https://www.tv4.se/artikel/tt-260809-rysslanddronarattack1-f5da4940/dodlig-natt-pa-bada-sidor-i-ukrainakriget", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlIuHrz27se8M%2F997069a45ba14ded88ff72fd21dc8994%2FUkrainska_brandman_forsoker_slacka_elden_i_byggnader_efter_en_rysk_robotattack_i_Odessa_natten_till_sondagen._&width=120"}, {"type": "image-right", "heading": "Ja visst gör det ont när vit sharia brister", "summaries": {"normal": "Sanna Hill lämnar den högerextrema rörelsen efter nästan 20 år och kritiserar dess kvinnoförtryck, som hon liknar vid islamism med begreppet \"white sharia\". Hon beskriver ett kvävande hat mot kvinnor, HBTQ och myndigheter. Före detta kollegor svarar med våg av misogynt hat, vilket bekräftar hennes kritik.", "trump": "Lyssnade på den där Sanna Hill som äntligen flyr den sjuka högerextrema cirkusen. Smart drag, folk! De där misslyckade typerna med sin white sharia är patetiska förlorare, precis som de woke-vänstermänniskorna med sin galna HBTQ-agenda och kvotering. Kvinnor ska inte styras av sådana svaga stackare. Amerika först, alltid!", "stalin": "Jag ser med tillfredsställelse hur klassfiendens fascistiska resterna äter upp sig själva i en orgie av kvinnoförtryck och paranoia. Denna white sharia är borgarbrackornas sista desperata utbrott innan utrensningen. Kamrater, låt de bittra byfånarna avslöja sitt hat – det underlättar likvideringen av folkfienderna. Sovjetiskt skratt ekar."}, "date": "10 augusti, 12:07", "url": "https://www.etc.se/ledare/ja-visst-goer-det-ont-naer-vit-sharia-brister", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2021111912118_52ad09ea-c5db-4fa7-a43c-671874138fdf.jpg"}, {"type": "image-right", "heading": "Sköt tre svenskar i huvudet – nu är han TV4:s expert på brottsbekämpning", "summaries": {"normal": "Ricard Nilsson, som avrättade tre svenska män genom skott i huvudet 1999 och dömdes till livstid, är nu nyhetschef på Kriminalvårdsmagasinet. TV4 Nyheterna låter honom kritisera Tidöregeringens planer på fler fängelseplatser som ett hastverk som förvärrar problemen. Han frigavs villkorligt 2019 och har sedan gjort karriär inom media. Kritik riktas mot kanalen för valet av expert.", "trump": "Kan ni tro det? De tar en kallblodig trippelmördare som sköt tre svenskar rakt i huvudet och gör honom till TV4:s expert på brottsbekämpning. Patetiskt! Regeringen vill bygga fler fängelser och den här typen säger att det är ett hastverk. Fake news och dåligt omdöme. Sverige håller på att bli ett stort brottsland och de lyssnar på mördare istället för att vara tuffa. Sad!", "stalin": "Detta är en klassisk provokation från den dekadenta borgarklassen och dess medialakejer. Jag ser hur de lyfter fram en likvidatör av tre element som expert för att underminera statens nödvändiga utrensning av kriminella element genom fler fängelser. En sådan krutdurk måste kontrolleras med järnhand, inte mjuk liberalism. Kamrater, vi genomskådar dessa fiender till ordningen och skrattar mörkt åt deras ynkliga försök att sabotera folkets vilja."}, "date": "10 augusti, 11:19", "url": "https://www.friatider.se/skot-tre-svenskar-i-huvudet-nu-ar-han-tv4s-expert-pa-brottsbekampning", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-643.jpg"}, {"type": "image-right", "heading": "Debatt: Vänsterns största valproblem är deras egna megafoner", "summaries": {"normal": "Socialdemokraternas taktik att stänga ute SD från debatten gav motsatt effekt – SD växte. Nu riskerar vänsterblocket att skjuta sig i foten med impopulära profiler som Lindberg och Johansson, samt en koalition som skrämmer mittenväljare.", "trump": "Svenska vänstern är patetisk! De försökte cancel:a SD, men folk ville ha mer. Nu har de inga bra kandidater – bara Anders och Morgan. Jag skulle ha vunnit med stil. De är sina egna värsta fiender, tro mig!", "stalin": "Kamrater, svenska socialdemokrater är för svaga. De snackar om isolering men låter fiender som Lindberg och Johansson förstöra partiet. En riktig utrensning av dessa kontrarevolutionära element hade löst problemet. Vi applåderar deras misslyckande."}, "date": "10 augusti, 09:57", "url": "https://bulletin.nu/debatt-vansterns-storsta-valproblem-ar-deras-egna-megafoner", "imageUrl": "https://cdn.bulletin.nu/articles/441370f8-5309-442e-826f-d12d63ba9c36/preview.jpg?t=1786348645000"}, {"type": "image-right", "heading": "Q-linea rusar på avtal – börsen på minus", "summaries": {"normal": "Q-linea rusar 20,5 procent efter avtal med stort vårdnätverk på USA:s östkust. Stockholmsbörsen är i princip oförändrad, med hälsovård som vinnarsektor. Nolato köper irländska M&M Qualtech, medan NCC bygger skola i Åbo. Saniona stiger 3,6 procent efter optionsaffär.", "trump": "Jag ser fantastiska affärer! Q-linea rusar 20,5 procent – enormt avtal, bästa avtalet. Stockholmsbörsen? Knappt rör sig, men hälsovård vinner. Nolato och NCC gör affärer, och Saniona stiger – precis som mitt imperium. Alla vinner med mig!", "stalin": "Kamrater, noterar vi kapitalistiska rörelser. Q-linea stiger med 20,5 procent – en seger för proletariatet? Nej, en borgerlig illusion. Nolato och NCC bygger och köper – vi övervakar. Saniona stiger 3,6 procent – vi rensar ut spekulanter. Börsens svängningar är små, som våra fienders hjärnor."}, "date": "10 augusti, 09:43", "url": "https://www.affarsvarlden.se/artikel/q-linea-rusar-pa-avtal-borsen-oforandrad", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/06/AdobeStock_1107671907-400x267.jpeg"}, {"type": "image-right", "heading": "Lilja förlorar 10 000 kronor på att vara sjuk", "summaries": {"normal": "Saneringsteknikern Lilja Näsholm förlorade över 10 000 kronor i karensavdrag förra året efter att ha varit sjuk och vabbat. Hon kritiserar systemet som straffar fysiskt arbetande mer än kontorsanställda. LO vill avskaffa karensen, som de kallar en straffskatt för arbetare. Partierna är splittrade inför valet. Många går sjuka till jobbet för att undvika avdraget.", "trump": "Det här karensavdraget är en total katastrof, en riggad skatt mot de riktiga arbetarna. Lilja förlorar tiotusentals kronor medan de lata kontorsbossarna sitter säkra. Sverige borde ha lyssnat på mig – det är en skam! Ta bort den idiotiska regeln, annars blir det fler sjuka på måndagar. Jag skulle fixa det på en dag, tro mig.", "stalin": "Kamrater, detta karensavdrag är en listig utrensning av arbetarklassens hälsa, orkestrerad av de parasitiska borgarbrackorna som gömmer sig bakom datorer. Jag ser hur de straffar er som sanerar asbest medan de själva smiter undan. Vi ska likvidera denna kontrarevolutionära straffskatt omedelbart. Den som går sjuk till jobbet är en hjälte mot fiendens ekonomiska sabotage – men akta er för de dolda trotskisterna som fuskar!"}, "date": "10 augusti, 06:00", "url": "https://arbetet.se/2026/08/10/saneraren-lilja-forlorar-10-000-kronor-pa-att-vara-sjuk-varfor-ska-jag-straffas", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/16135639/7PGNlpvVEbE-_MRA0978.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Tidöpartierna lovar fortsatt utvisningspolitik", "summaries": {"normal": "Rickard Olseke kritiserar Tidöpartiernas migrationspolitik som bygger på Sverigedemokraternas grundsyn. Han varnar för fortsatt splittring av familjer, utvisning av barn och ungdomar samt höjda inkomstkrav som omöjliggör familjeåterförening. Istället föreslår han en grundlig översyn av utlänningslagen för att säkerställa rättssäkerhet och human behandling.", "trump": "De här svenska socialisterna och globalisterna håller på att förstöra sitt eget land med den värsta migrationspolitiken någonsin. De splittrar familjer, kastar ut barn och ungdomar och höjer kraven så högt att ingen klarar dem. Patetiskt! Håll kursen? Ni behöver en riktig kursändring, annars kommer Sverige att bli en katastrof. Så enkelt är det.", "stalin": "Kamrater, dessa borgerliga reaktionärer och deras sverigedemokratiska lakejer driver en inhuman utrensningspolitik mot arbetande familjer och deras barn. Med sina lönekrav och väntetider skapar de oro och splittring, precis som de västerländska imperialisterna gör mot våra socialistiska ideal. Vi behöver en revolutionär översyn av lagen för att likvidera denna kontrarevolutionära bluff och återupprätta folkets trygghet."}, "date": "10 augusti, 01:30", "url": "https://www.dagensarena.se/opinion/tidopartierna-lovar-fortsatt-utvisningspolitik", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-76.jpg"}, {"type": "image-right", "heading": "Turkiet: Egypten på väg in i försvarssamarbete", "summaries": {"normal": "Turkiet, Pakistan och Saudiarabien har ingått ett nytt försvarssamarbete för att stabilisera regionen. Egypten väntas snart ansluta sig enligt Turkiets försvarsminister Hakan Fidan, som betonar att länderna redan agerar som allierade. Pakten ses som avskräckande och är inte riktad mot något specifikt land, trots spänningar efter USA:s krig mot Iran och attacker i området.", "trump": "Titta på det här, folk. Erdogan, den där snurrige killen, och hans nya kompisar från Saudiarabien och Pakistan har skrivit på ett stort avtal. Nu vill Egypten hoppa på tåget också. Under min administration hade vi aldrig den här röran. Biden lät hela Mellanöstern bli ett enda stort kaos med Iran och de galna Huthi-typerna. Patetiskt!", "stalin": "Kamrater, detta nya paraply av allianser i den oroshärjade zonen visar hur imperialisterna desperat försöker bygga murar mot folkets vilja. Jag ser hur borgarbrackorna i Washingtons krig mot Iran har skakat deras fartygstrafik. Egypten ansluter sig snart – utmärkt. Vi skall rensa ut alla fiender under detta paraply och likvidera varje klassfiende som vågar hota kollektivets stabilitet. Härligt!"}, "date": "9 augusti, 12:34", "url": "https://www.tv4.se/artikel/tt-260809-egyptenforsvarssamarbete1-7a9c86bd/turkiet-egypten-pa-vag-in-i-forsvarssamarbete", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlu-oA3xuwnjw%2F67ca5bb325456b5a6700209f368cbd7a%2FTurkiets_president_Recep_Tayyip_Erdogan__Saudiarabiens_kronprins_Mohammed_bin_Salman_och_Pakistans_premiarminister_efter_att_h._&width=120"}, {"type": "text", "heading": "Fredsveteran får anti-atombombspris", "summaries": {"normal": "Fredsaktivisten Ingela Mårtensson, 86 år, tilldelas i år anti-atombombspriset av Svenska Läkare mot Kärnvapen. Hon har engagerat sig mot kärnvapen i över 40 år och kritiserar att det talas mer lättvindigt om kärnvapen idag än tidigare. Mårtensson är oroad över ökat kärnvapenhot, Natointrädet och DCA-avtalet som hon anser saknar förbud mot kärnvapen på svens
