adent identitetspolitik och ingen hoppfull politik för vanliga människor. Vi vinner stort, de förlorar landet.", "stalin": "Kamrater, denna dekadenta klassförrädare har rätt i att uppgivenhet driver arbetarna mot högern. Jag ser hur profitthungriga parasiter och deras politiska lakejer överger landsbygden. En sann arbetarrörelse måste ingjuta hopp och rensa ut svikare. Utan järnhård organisation och folklig mobilisering kommer ingen seger. Fienden ler i skuggorna."}, "date": "2 september, 10:55", "url": "https://www.flamman.se/vanstern-behover-mer-an-baristor", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/starbucks-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Jakten på metaller hotar renarnas sista väg förbi Kiruna: ”Slutet för samebyn”", "summaries": {"normal": "LKAB:s planerade gruva i Kiruna hotar Gabna samebys sista flyttled för renarna. Fyndigheten innehåller sällsynta jordartsmetaller som behövs för elbilar, vindkraft och elektrifiering. Samebyn varnar för att rennäringen kan dö ut medan LKAB och flera riksdagspartier betonar klimatnyttan och Europas självförsörjning. Konflikten mellan urfolksrätt och gruvutvinning är skarp.", "trump": "De här korkade gröna fanatikerna och samiska kvoteringsaktivisterna vill stoppa en fantastisk gruva som skulle ge oss alla de metaller vi behöver för att bygga de bästa elbilarna och krossa Kinas grepp. Patetiskt! Renar och några få nomader ska inte diktera för hela Europa. Vi behöver vinnare, inte offermentalitet och snälla bjällror. Amerika först – och Europa borde följa efter.", "stalin": "Dessa profitthungriga klassförrädare i LKAB och de borgerliga partierna vill med sin giriga expansion klyva renarnas sista led som ett blodigt experiment. Jag ser hur de dekadenta exploaterarna offrar urfolkets mark för sin så kallade omställning. En sådan handling förtjänar utrensning ur folkets medvetande. Hållbarhet är arbetarklassens seger, inte imperialisternas nya rovdrift."}, "date": "3 september, 05:41", "url": "https://www.svt.se/nyheter/inrikes/jakten-pa-metaller-hotar-renarnas-sista-vag-forbi-kiruna-slutet-for-samebyn", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.21/0.28/36fe39b827680496f768aca3db45f98e6aa77e32df26e27d1077facd14db5f2b"}, {"type": "image-full", "heading": "Så försöker USA bryta Kinas grepp om drönare och robotar", "summaries": {"normal": "USA inför nya tullar på drönare och robotar från Kina för att minska beroendet av utländsk teknik och stärka den egna industrin. Trots att Kina dominerar marknaden med billig massproduktion, hoppas Washington att åtgärderna ska främja inhemsk kapacitet och förbättra säkerheten i kritiska sektorer genom att premiera amerikanska system framför kinesiska alternativ.", "trump": "Kina försöker lura oss med billiga drönare och robotar, men jag säger nej! Vi sätter stopp för det nu. De dumpar priser medan vår industri står stilla – en total katastrof. Vi ska bygga våra egna maskiner, de största och bästa maskinerna världen någonsin skådat. America First, mina vänner. Vi gör USA till en robot-supermakt igen, tro mig!", "stalin": "De amerikanska imperialisterna darrar. De bygger murar av tullar mot de kinesiska maskinerna, men de glömmer att en stat utan egen produktion är en stat av sand. De desperata byråkraterna i Washington försöker nu tvinga fram en industri som de för länge sedan förlorat kontrollen över. Planekonomi är det enda sättet att vinna, men de vägrar förstå det. Sorgligt."}, "date": "2 september, 22:48", "url": "https://www.realtid.se/it-tech/sa-forsoker-usa-bryta-kinas-grepp-om-dronare-och-robotar", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/dronare-1.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Expressen när V-politiker mordhotar SD-medlem: \"Verbalt attackerad\"", "summaries": {"normal": "En Vänsterpartiets representant i Upplands Väsby mordhotade en 16-årig SD-funktionär under ett torgmöte och kallade henne nazist. Händelsen fångades på film. Media, däribland Expressen, har kritiserats för att tona ned händelsen till en verbal attack och skydda kvinnans identitet genom att pixla hennes bild, vilket har väckt starka reaktioner inom SD.", "trump": "Media är så oärliga! De kallar det en 'verbal attack', men alla ser att den här radikala vänsterkvinnan hotade ett stackars 16-årigt barn från SD. Fake news-tidningen Expressen skyddar henne och pixlar ansiktet! Helt otroligt. Om det hade varit tvärtom hade det varit löpsedlar i hela världen. Sjukt och katastrofalt dåligt, precis som deras låga betyg!", "stalin": "Ett uppenbart sabotage mot ordningen i Upplands Väsby! Den så kallade politikern som hotar barn med döden saknar ideologisk disciplin och skadar statens anseende. Att den borgerliga pressen dessutom försöker dölja förbrytarens ansikte visar på djupt rotad kontrarevolutionär konspiration. Sådana element hör inte hemma i utbildningsnämnden, de hör hemma i arbetslägret!"}, "date": "3 september, 05:35", "url": "https://samnytt.se/expressen-nar-v-politiker-mordhotar-sd-medlem-verbalt-attackerad", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/03030056/artikelhuvudbild-1-432.jpg"}, {"type": "image-right", "heading": "Siffrorna från Novus får mig att vilja dunka huvudet i väggen", "summaries": {"normal": "I en ledare kommenterar Henrik Jalalian en Novus-mätning som visar att Tidöpartiernas försprång krymper till 2,6 procentenheter. Socialdemokraterna backar till 25,8 procent medan Liberalerna stiger. Han varnar oppositionen för överdriven segervisshet och jämför den med en maratonlöpare som firar för tidigt. Valet riskerar att bli jämnt igen.", "trump": "Folk, ni skulle se det här. Den där svenska oppositionen beter sig som en massa fega, korkade vänstervridna misslyckanden som redan delar ministerstolar som om de vunnit stort. Sen kommer en mätning och bam – plötsligt är det jämnt! De firade vid mållinjen som idioter och blev omsprungna. Patetiskt. Mitt folk i USA skrattar åt sånt här svagt ledarskap.", "stalin": "Kamrater, dessa dekadenta ministerhyenor inom oppositionen har redan börjat fördela makten som om segern vore given. Sedan kommer en mätning och avslöjar deras svaghet. Jag ler mörkt från historien. Segervissheten hos dessa folkförbrytare leder ofta till nederlag. Rensa ut illusionerna innan valnatten blir en bitter uträkning för de som underskattar motståndaren."}, "date": "2 september, 11:40", "url": "https://www.etc.se/ledare/siffrorna-fraan-novus-faar-mig-att-vilja-dunka-huvudet-i-vaeggen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260902090928_eef5f9b2fe3491ea219272b209bf353429d8ed34289907d7777b3fbd8d8429bf.png"}, {"type": "text", "heading": "Demonstration mot AP-innehav i Palantir", "summaries": {"normal": "Fyra demonstranter samlades utanför 7:e AP-fondens kontor på Vasagatan i Stockholm för att protestera mot fondens aktieinnehav i Palantir. De anser att bolaget medverkar till folkrättsbrott i Gaza och kräver att fonden följer sina riktlinjer, säljer aktierna och ökar öppenheten kring investeringsbeslut.", "trump": "Titta på de där galna vänsterextremisterna som står och skriker utanför ett pensionskontor. Palantir är ett fantastiskt amerikanskt bolag som hjälper till att vinna krig, inte som era patetiska woke-demonstranter som hatar Israel och älskar terrorister. De borde investera i riktiga jobb istället för att gnälla om folkmord – era förlorare!", "stalin": "Se hur de giriga pensionshyenorna i den statliga fonden göder de imperialistiska krigsteknologerna som understödjer folkmordet. Jag ler i graven åt denna fega skenhelighet. Kamrater, sådana klassförrädare förtjänar en grundlig utrensning ur folkets finanser innan de förgiftar hela systemet med sin blodiga girighet."}, "date": "2 september, 10:41", "url": "https://proletaren.se/artikel/demonstration-mot-ap-innehav-i-palantir"}, {"type": "image-right", "heading": "Markus Allards hat slutar i min inkorg", "summaries": {"normal": "Artikeln beskriver hur debattören utsätts för grova våldshot efter en diskussion med Örebropartiets Markus Allard. Författaren kritiserar hur populistiska politiker använder hat och extrema uttalanden för att vinna uppmärksamhet. Trots personliga likheter i bakgrund ses hat mot invandrare som avgörande för att tillhöra ”folket”. Skribenten vädjar om saklig debatt istället för polarisering.", "trump": "Folk, det här är precis vad som händer när de galna vänsterliberala hatarna får fritt spelrum. Den här Allard-killen skriker ut sanningar om invandrare och etablissemanget medan de riktiga losersen svarar med dödshot. Typiskt för de dekadenta HBTQ-kvotarna som hatar vanliga arbetare. Jag fixade Amerika, nu behöver Sverige en riktig ledare som inte är en sådan patetisk förlorare.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare förgiftar debatten med sina hatiska utspel. Jag betraktar med avsmak hur folkets fiender använder hot och paranoia för att splittra massorna. Den sanna arbetarklassen behöver inte sådana metoder. Vi måste rensa ut dessa parasiterande opportunister innan de förgiftar hela samhällskroppen. Politiken ska tjäna folket, inte hatet."}, "date": "1 september, 12:45", "url": "https://www.flamman.se/markus-allards-hat-slutar-i-min-inkorg", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/markus-allard-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Dags för vuxna att vara vuxna", "summaries": {"normal": "Artikeln är en debatttext från Grön ungdom och Miljöpartiet. Den kritiserar att dagens beslutsfattare skjuter klimatåtgärder på framtiden trots tydliga konsekvenser som extremväder och minskad biologisk mångfald. Ungdomar kräver att politiker tar ansvar, prioriterar förnybar energi, skyddar skog och ser omställningen som en ekonomisk möjlighet snarare än kostnad.", "trump": "De här gröna kidsen gnäller om att vi vuxna inte städar upp efter oss. Patetiskt! Jag byggde den starkaste ekonomin i världen, och nu vill de kasta bort den för sina solpaneler och elcyklar. Det är de verkliga förlorarna – de woke klimatfanatikerna – som försöker skrämma folk. Amerika först, inte deras hysteriska dröm om att rädda planeten med högre elräkningar.", "stalin": "Kamrater, dessa ynglingar blottlägger de dekadenta klassförrädarnas svek. De profitthungriga parasiter som styr idag skjuter nödvändiga utrensningar av förorenande krafter på framtiden medan folket lider. Jag ser deras feghet och paranoia inför sanningen. Endast en järnhand kan tvinga fram den kollektiva omställning som skyddar staten och framtida generationer från deras giriga vansinne."}, "date": "2 september, 09:30", "url": "https://www.etc.se/debatt/dags-foer-vuxna-att-vara-vuxna", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260901130952_89eba03a3fe67f17de6b8f812174619d370e33794ca869f129e46e742c3129ad.jpg"}, {"type": "text", "heading": "Vänsterpartiet bytte fredsmärke mot vapenskrammel", "summaries": {"normal": "Artikeln kritiserar Vänsterpartiet för att ha övergett sin fredspolitik och ställt sig bakom militärt stöd till Ukraina samt Natosamarbete. Författaren, med koppling till Kommunistiska Partiet, menar att partiet ignorerar följderna för välfärden och svenskarnas tilltro till politiken. Han uppmanar till att rösta på Kommunistiska Partiet istället.", "trump": "De här vänsterbluffarna i Sverige har kastat bort sitt fredsmärke snabbare än Sleepy Joe bytte script. Nu älskar de vapen, Nato och krigsmaskineriet medan välfärden kollapsar. Patetiska. Jag säger: fem procent av BNP till militären? Bra deal, men låt oss skicka fakturan till de dekadenta EU-byråkraterna istället. Amerika först, alltid.", "stalin": "Jag ser hur dessa falska röda lakejer kapitulerar inför krigsalliansen och låter profitthungriga krigshajar styra politiken. De pratar inte om välfärd utan gömmer sig bakom vapenskramlet. Vi behöver utrensning av sådana klassförrädare som sviker folket. Röst på äkta kamrater, inte dessa hycklare som dansar efter imperialistiska pipor. Folkets vrede vaknar."}, "date": "2 september, 09:57", "url": "https://proletaren.se/artikel/vansterpartiet-bytte-fredsmarke-mot-vapenskrammel"}, {"type": "image-right", "heading": "Den svenska modellen är död – dags för motstånd!", "summaries": {"normal": "Artikeln förklarar att den svenska modellen är död efter Teslakonfliktens slut. IF Metall köpte ut de sista strejkande och visade på facklig passivitet och centralisering. Författaren menar att arbetarna måste återupptäcka strejkvapnet och agera självständigt utanför LO-fackens byråkrati för att återta sin politiska kraft.", "trump": "Den här svenska modellen är en total katastrof, en riggad fotboja som har hållit arbetarna i schack i hundra år. Patetiska fackbyråkrater och deras jurister springer till Elon och ber om en kram medan riktiga människor får lida. Nu är det över. Dags att sluta med det woke-facket och börja vinna på riktigt, tro mig.", "stalin": "Denna fackliga förräderi mot arbetarklassen är ett ypperligt bevis på hur de profitthungriga klassförrädarna har förgiftat hela systemet. Jag ser hur den svenska modellen har blivit en parasitisk tvångströja. Arbetarna måste rensa ut dessa dekadenta lakejer och återta makten själva. Kompromissen är död. Motståndet lever."}, "date": "2 september, 09:01", "url": "https://proletaren.se/artikel/den-svenska-modellen-ar-dod-dags-for-motstand", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/09/ledare_web-768x432.jpg"}, {"type": "text", "heading": "Kommunal bojkott av Israel – ett självklart krav", "summaries": {"normal": "Kommunistiska Partiet kräver en total bojkott av Israel i Sverige, både ekonomisk, politisk, idrottslig, akademisk och kulturell. Partimedlemmar har lämnat motioner och medborgarförslag i flera kommuner samt arrangerat demonstrationer. De ser bojkotten som ett sätt att stödja Palestina och stoppa vad de kallar folkmord och ockupation.", "trump": "Lyssnar ni på de här kommunistiska förlorarna som vill bojkotta Israel? Patetiska radikala galningar som hatar en stark demokrati medan de kysser terroristers fötter. Det är samma gamla vänstervridna hyckleri som under Biden. Vi behöver inga bojkotter – vi behöver segrar och Amerika först, inte dessa palestinska sympatisörer som förstör allt.", "stalin": "Jag ser hur dessa modiga kamrater kämpar mot de giriga ockupationshyenorna och deras lakejer. En total bojkott är ett kraftfullt vapen i den antiimperialistiska kampen. Historien kommer att likvidera alla som stödjer folkmordsstaten. Arbetarna och det palestinska motståndet måste enas. Svaghet är förräderi mot folkets sak."}, "date": "2 september, 08:00", "url": "https://proletaren.se/artikel/bojkotta-folkmordsstaten"}, {"type": "image-right", "heading": "Även Dolly Parton brydde sig om klimatet", "summaries": {"normal": "Göran Greider talar på en klimatparad i Falun och kritiserar att klimatfrågorna är frånvarande i valrörelsen trots bränder och en glaciärkollaps i Himalaya. Han ser en växande grön jätte som förenar jämlikhet med miljökrav och uppmanar till opinion för en omställning som minskar överkonsumtion bland de rika.", "trump": "De här gröna galningarna med sina röda halsdukar babblar om en jätte som vaknar. Dolly Parton bryr sig plötsligt om klimatet? Under min förra mandatperiod fixade vi energi och jobb, sen kom Sleepy Joe och förstörde allt. Nu vill de krympa plånböckerna för vanliga människor. Patetiska förlorare, era gröna troll kommer inte vinna.", "stalin": "Denna tystnad kring klimatkrisen och ojämlikheten är en skam för alla dekadenta klassförrädare. Jag betraktar hur den gröna jätten reser sig ur skogarna och kräver utrensning av de profitthungriga hyenorna som förgiftar biosfären. Kamrater, sitt på dess axlar och tvinga fram en sann omvälvning innan fienderna likviderar framtiden."}, "date": "2 september, 03:00", "url": "https://www.etc.se/ledarkolumn/aeven-dolly-parton-brydde-sig-om-klimatet", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/goeran-greider_e435a5b3e3bbef14a633f004df8cd390374e6dce.jpg"}, {"type": "image-right", "heading": "Svensk ekonomi blomstrar – Magda påstår att det är ett haveri", "summaries": {"normal": "Magdalena Andersson kritiseras för att ha beskrivit svensk ekonomi som ett haveri strax innan SCB släppte siffror som visar stark tillväxt. BNP ökade med 3,3 procent under andra kvartalet, den högsta takten i västvärlden. Hushållens reala inkomster är rekordhöga, skatteintäkterna har ökat och arbetslösheten sjunker. Artikeln anklagar Andersson för skrämselpropaganda och taktiska lögner.", "trump": "Folk, ni skulle se det här! Den förlorande ex-premiärministern, den röda lögnaren Andersson, kallar Sveriges ekonomi för ett haveri precis innan siffrorna exploderar uppåt. 3,3 procent BNP-tillväxt, bättre än USA, bättre än alla! Hennes Fake News-medier gömmer sanningen medan folket blir rikare. Patetiskt. Jag byggde den starkaste ekonomin någonsin, hon förstörde sin.", "stalin": "Kamrater, se hur den socialdemokratiska lögnfabriken sprider defaitistisk propaganda om ekonomiskt haveri medan produktivkrafterna rusar framåt. Denna folkfiende Andersson försöker medvetet sabotera folkets förtroende för att kunna stjäla makten tillbaka. Hennes big-lie-metoder är lika genomskinliga som de är löjeväckande. Sanningen kommer att krossa alla sådana element."}, "date": "31 augusti, 03:23", "url": "https://samtiden.nu/2026/08/svensk-ekonomi-blomstrar-magda-pastar-att-det-ar-ett-haveri", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7256.jpeg"}, {"type": "image-full", "heading": "Därför undrar Jan Eliasson (S) om SD är nazister", "summaries": {"normal": "När SD-ledaren Jimmie Åkesson uppmanade borgerliga väljare att stödrösta på L, men nekade till att SD skulle göra detsamma, reagerade den tidigare utrikesministern Jan Eliasson (S). På X ifrågasatte Eliasson om SD är socialistiskt, nationalistiskt eller nationalsocialistiskt eftersom de inte definierar sig som borgerliga. SD beskriver sig själva som socialkonservativa.", "trump": "Sverige har stora problem, totalt misslyckade politiker! Någon gammal svensk FN-kille, Jan Eliasson, gråter på sociala medier för att Jimmie Åkesson inte kallar sitt parti borgerligt. Han börjar svamla om nazister! Så dumt! SD är smarta, de sätter Amerika... förlåt, Sverige först, precis som jag gör! Fake news-panik i Stockholm!", "stalin": "Kamrat Eliasson väcker ideologisk oreda genom att offentligt förhörsspråka Sverigedemokraternas partitillhörighet på det digitala torget X. Om avvikande element vägrar erkänna sin plats i det borgerliga eller socialistiska registret, måste Folkkommissariatet för ideologisk renhet omedelbart utreda saken. Partiprogrammet från 2011 uppvisar bristande disciplin. Vi kräver skärpt ideologisk vaksamhet och snara bekännelser i mörka rum."}, "date": "3 september, 01:11", "url": "https://bulletin.nu/darfor-undrar-jan-eliasson-s-om-sd-ar-nazister", "imageUrl": "https://cdn.bulletin.nu/articles/3a8bbc1a-68f5-4e07-b617-69976ca0c2cd/preview.jpg?t=1788390359000"}, {"type": "image-right", "heading": "Låt det bli ett värderingsval", "summaries": {"normal": "Socialdemokraternas valmanifest innehåller bland annat billigare tandvård för vuxna. Artikeln ifrågasätter om väljarna kan hålla reda på alla partiers vallöften strax före valet. Författaren kritiserar Sverigedemokraterna och Tidöpartierna samt lyfter vikten av att väga välfärdslöften mot skattesänkningar och värderingar istället för enbart plånboksfrågor.", "trump": "De här svenska socialisterna lovar gratis tänder och julklappar till alla. Patetiskt! Jag har byggt den starkaste ekonomin i världen utan sådana löjliga mutor. Väljarna minns inte ett dugg av vad de röda clownerna lovat. Låt det bli ett värderingsval mot de verkligt galna vänsterknäppningarna och deras identitetspolitiska vansinne. Fantastiskt!", "stalin": "Dessa dekadenta klassförrädare öser ut löften om billig tandvård och barnbidrag som om de vore folkets vänner. Jag ler från historien åt deras desperation. Väljarna ska inte luras av de profitthungriga hyenornas tomma ord. Rensa ut alla som prioriterar skatter framför välfärd. Det är ett värderingsval, kamrater. Svaghet kommer krossas."}, "date": "2 september, 01:49", "url": "https://www.dagensarena.se/opinion/lat-det-bli-ett-varderingsval", "imageUrl": "https://www.dagensarena.se/files/2026/09/vakmanifest-300x157.jpeg"}, {"type": "image-right", "heading": "De bortglömda väljarna kan avgöra valet", "summaries": {"normal": "Artikeln kritiserar hur äldre och personer med invandrarbakgrund osynliggörs eller misstänkliggörs i valrörelsen. Båda grupperna har byggt Sverige genom hårt arbete och bidrar fortfarande, men behandlas som problem istället för värdefulla medborgare. Författaren uppmanar till respekt, tack och politik som inkluderar dem för att skapa äkta sammanhållning.", "trump": "Folk, det här är en total skam. Politiker glömmer de fantastiska äldre som byggde ert underbara Sverige och kallar invandrarna för belastning när de faktiskt håller igång landet. Rena idioter och woke-sjuklingar som leker identitetspolitik. Jag skulle tacka dem ordentligt, inte som Sleepy Joe gjorde. Ni behöver starka ledare, inte dessa patetiska förlorare som splittrar er.", "stalin": "Kamrater, jag ser hur de profitthungriga klassförrädarna i valrörelsen osynliggör arbetets hjältar och målar invandrade kamrater som hot. Deras dekadenta lögner göder splittring. Vi måste rensa ut dessa folkförtryckare och deras paranoia. Endast genom att värdesätta massornas insats kan samhället stärkas. Annars väntar utrensning av de svekfulla elementen."}, "date": "2 september, 01:42", "url": "https://www.dagensarena.se/opinion/de-bortglomda-valjarna-kan-avgora-valet", "imageUrl": "https://www.dagensarena.se/files/2025/10/juan-fonseca-300x157.jpeg"}, {"type": "image-full", "heading": "Andersson: ”Svårt att se” V i regering", "summaries": {"normal": "Socialdemokraterna tappar fyra procentenheter i en ny mätning, mycket till Centerpartiet. Partiledaren Magdalena Andersson har svårt att se att Vänsterpartiet kan bli regeringsklart till valet på grund av allvarliga och systematiska problem inom partiet. Vänsterpartiet å sin sida kräver att få ingå i en regering för att släppa fram den.", "trump": "Magdalena Andersson kollapsar i mätningarna, absolut total katastrof! Väljarna flyr till Centerpartiet för att de inser hur svagt det är med kommunister i regeringen. Hon säger att Vänsterpartiet har en ’rejäl resa’ att göra – tro mig, jag vet resor, men den här resan slutar rakt ner i diket! Sjukt, svagt och fullständigt oacceptabelt. Sad!", "stalin": "Socialdemokraternas katastrofala fall i mätningarna och deras desperata försök att exkludera Vänsterpartiet visar på bristande ideologisk disciplin. Om dessa så kallade kamrater inte ens klarar en enkel ministerresa på elva dagar, måste vi fråga oss: vilka fiender till staten styr egentligen deras planering? Avvikelse från linjen tolereras ej."}, "date": "2 september, 19:50", "url": "https://kvartal.se/nyheter/artiklar/andersson-begransad-entusiasm-for-v/cG9zdDoxODE5NjY", "imageUrl": "https://images.kvartal.se/2026/09/90e52a2a-maandersson.webp"}, {"type": "image-right", "heading": "Ledare S söver ner valrörelsen – SD tackar och tar emot", "summaries": {"normal": "Socialdemokraterna har enligt ledaren gjort valrörelsen ovanligt sömnig genom att ligga nära regeringen och undvika tydliga konflikter. Magdalena Andersson uppger att valet inte handlar om någonting. Det gynnar Sverigedemokraterna som får fokusera på migration och kriminalitet istället för ekonomi. Tomas Ramberg kallar det det konstigaste valet på 30 år.", "trump": "Det här är en total katastrof, folk. Den sömngångande S-kvinnan Andersson har förvandlat hela valrörelsen till en tråkig gröt. Hon lovar att vara snålare än snåljåparna! Under tiden skrattar SD hela vägen till banken medan fokus hamnar på slöjor och fotbojor. Patetiska vänsterhyenor som gömmer sina löften – ingen bryr sig om det riktiga folket längre.", "stalin": "Jag betraktar med förakt hur dessa dekadenta klassförrädare inom Socialdemokraterna förvandlar politiken till en grå, sövande sörja. De tonar ner kampen mellan arbete och kapital och lämnar fältet fritt åt högerpopulisterna. En sådan feghet förtjänar utrensning ur historien. Väljarna kommer att straffa dessa fegisar när de inser att de har förrått folket."}, "date": "1 september, 11:24", "url": "https://www.etc.se/ledare/s-soever-ner-valroerelsen-sd-tackar-och-tar-emot", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "image-right", "heading": "Sjöstedt (V) följer konto där Åkesson påstås ha dödat palestinskt barn", "summaries": {"normal": "P3 Nyheter har granskat politiker som följer kontroversiella konton på sociala medier. Riks kan nu avslöja att även Vänsterpartiets tidigare partiledare Jonas Sjöstedt följer ett konto som sprider grova anklagelser mot SD:s Jimmie Åkesson och Richard Jomshof, bland annat påståenden om att de dödar palestinska barn och får finansiering från Mossad och CIA. Kontot uppmanar till röstning på Vänsterpartiet.", "trump": "Folk, ni skulle inte tro det, men den där gamla vänsterkommunisten Sjöstedt följer ett galet konto som påstår att Åkesson personligen mördar palestinska barn. Det är sjukt! Fake news och konspirationer på hög nivå. De hatar oss patrioter medan de själva älskar terrorister. Biden skulle ha gillat det här vansinnet. Vi behöver mer sunt förnuft och mindre radikal vänsteridentitetspolitik i Europa, tro mig.", "stalin": "Kamrater, från historiens skugga ser jag hur dessa dekadenta klassförrädare inom vänstern följer konton som avslöjar sionistiska lakejer och quislingar som säljer ut sina folk. De spekulerar om Mossad-pengar och CIA-stöd till högerns hyenor. Ett sådant konto uppmanar till röstning på deras parti medan det ropar befria Palestina. Paranoia är bra, men utrensning av alla folkförrädare behövs innan de likviderar sanningen."}, "date": "2 september, 20:49", "url": "https://riks.se/nyheter/sjostedt-v-foljer-konto-dar-akesson-pastas-ha-dodat-palestinskt-barn", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_75_14bc44cdbd.jpg"}, {"type": "image-full", "heading": "ARN: Caia ska ersätta 8500 för försvunnen kalender", "summaries": {"normal": "En kund köpte Caias julkalender för 2 995 kronor, men paketet försvann under leverans. Eftersom varan var slut återbetalade företaget beloppet men vägrade betala ut det uppskattade varuvärdet på 8 505 kronor. Allmänna reklamationsnämnden anser att kunden har rätt till mellanskillnaden i presentkort, vilket sminkföretaget dock vägrar att ställa upp på.", "trump": "Det här är totalt galet, en riktig katastrof! En stackars kund köper en fantastisk julkalender för nästan tre tusen spänn, men de tappar bort den på vägen. Och sminkföretaget bara skiter i det och vägrar betala ut det enorma värdet på över åtta tusen som de själva skrutit om. ARN ger kunden rätt, men företaget vägrar lyssna. Bedrägeri!", "stalin": "Ett förskräckligt sabotage inom distributionen! När staten – förlåt, sminkföretaget – misslyckas med att leverera den åtråvärda julkalendern till medborgaren, försöker de komma undan med en simpel återbetalning. Men Allmänna reklamationsnämnden har med rätta ingripit mot denna borgerliga slapphet. Vi kräver att det fulla värdet på 8 505 kronor omedelbart utdelas till den förorättade!"}, "date": "2 september, 22:48", "url": "https://www.gp.se/ekonomi/kalender-fran-caia-forsvann-foretaget-gar-emot-arn.8187073c-d1e4-4be6-9f91-e6f5d99280e4", "imageUrl": "https://www.gp.se/images/article/8187073c-d1e4-4be6-9f91-e6f5d99280e4/images/22DPuinkSXIb7ubJwASXMp2_vj_s-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Kängan till V – dagar före valet: ”Jag har svårt att se det”", "summaries": {"normal": "Magdalena Andersson vill inte ge besked om en eventuell S-ledd regerings sammansättning. Hon utesluter tydligt ministerposter för Vänsterpartiet och anser att partiet har en lång resa kvar på grund av allvarliga och systematiska problem. Valet handlar enligt henne om Sveriges riktning snarare än partiers röda linjer.", "trump": "Den här Andersson-kvinnan, en riktig socialistisk förlorare, vägrar säga att hon tänker släppa in de galna vänsterextremisterna i regeringen. Smart drag! Hon vet att de är en katastrof. Sverige behöver ingen vänsterkaos, det behöver en stark ledare som samlar landet – inte 12 eller 14 sverigedemokratiska ministrar heller, förresten. Patetiskt!", "stalin": "Jag ser en typisk socialdemokratisk opportunist som försöker undvika att erkänna sina allianser med farliga element. Vänsterpartiet utgör ett systematiskt hot som måste rensas ut innan de får makt. Tiden rinner ut och deras resa mot renhet är dömd att misslyckas. Inga kompromisser med fiender till folkets enhet. Renhet eller döden!"}, "date": "2 september, 22:33", "url": "https://www.tv4.se/artikel/2LubKky5fRGSa4hEfsGUSk/kaengan-till-v-dagar-foere-valet-jag-har-svart-att-se-det", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4mNk0D19jVrGYZKxkxIKUb%2Fd1b335070409208500a0b67a33f15eab%2F02-magda-valutfragning-v.png&width=1024"}, {"type": "image-right", "heading": "Kallas: ”Försöken att skrämma Europa kommer misslyckas”", "summaries": {"normal": "EU:s utrikesministrar diskuterade i Wicklow nya sanktioner mot Ryssland efter drönarincidenten i Leipzig. Bland förslagen finns skärpta visumkrav för ryssar, reseförbud för före detta soldater och användning av frysta ryska tillgångar till Ukraina. Kaja Kallas betonade att Moskva inte vill ha fred och att EU står i solidaritet med Tyskland.", "trump": "De där patetiska eurokraterna tror att de kan skrämma Ryssland med visumregler och frysta konton, vad är det för svagt skitsnack? Jag byggde den starkaste armén i världen, inte som Sleepy Joe som lät allt gå åt helvete. Europa borde vakna, annars kommer de ryska björnarna att äta upp era gröna drömmar till frukost.", "stalin": "Dessa dekadenta klasslakejer i Bryssel försöker med sina sanktioner och visumförbud kväva den ryska statens legitima intressen. Jag ser hur de giriga hyenorna darrar av rädsla. Moskva gör rätt som inte böjer sig. Fred? De imperialistiska parasiterna förstår endast styrka. Vi ska se deras fientliga hinder krossas under historiens obevekliga marsch."}, "date": "2 september, 22:28", "url": "https://www.svt.se/nyheter/utrikes/kallas-forsoken-att-skramma-europa-kommer-misslyckas", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.5/0.4/44a0d3d7f8647af65c8a10a9155c063e8467713a8d9827ddbd2afa2b24652a1f"}, {"type": "image-full", "heading": "Sjöstedt hyllar Bildt – kritiserar Kristersson", "summaries": {"normal": "Jonas Sjöstedt sågar det svenska debattklimatet och riktar hård kritik mot statsministern och Liberalerna för att ha anammat högerpopulistisk retorik. Samtidigt hyllar den tidigare V-ledaren Carl Bildt för hans utrikespolitiska korrekthet, lyfter fram C som den enda principfasta borgerliga motkraften och efterlyser bredare politiska samarbeten efter valet.", "trump": "Fruktansvärt! Jonas Sjöstedt – en total förlorare från vänstern som tittar på fejkade debatter – gnäller om tonen. Men vet ni vad? Han hyllar Carl Bildt! Sjöstedt gråter över Ulf Kristersson och Liberalerna, som är på väg till ’tigerns mage’. Helt svagt! Jag, Donald Trump, säger: sluta gråta, ordna gränserna och skaffa lite styrka, för det här är patetiskt!", "stalin": "Kamrater, den svenska revisionisten Sjöstedt beklagar sig över ett giftigt samtalsklimat och att högern har radikaliserats. Han hyllar den före detta kapitalistiske lakejen Bildt medan han fördömer Kristerssons vacklande regim och de så kallade liberalernas marsch in i tigerns gap. Vi noterar detta borgarpackets inbördes bråk med ett roat leende från Kremls höjder. Arbetarklassen glömmer inte."}, "date": "2 september, 16:46", "url": "https://kvartal.se/nyheter/artiklar/sjostedt-har-slutat-titta-pa-partiledardebatter/cG9zdDoxODE4MjM", "imageUrl": "https://images.kvartal.se/2026/09/eeeac0f8-jonas-sjostedt.webp"}, {"type": "image-right", "heading": "”Jag vill inte lämna Kiev – men kanske måste”", "summaries": {"normal": "Ryska attacker mot Kiev-området har ökat kraftigt den senaste veckan, bland annat med nya jetdrönare som är svåra att skjuta ner. Civila lever under ständig stress och flyglarm men många vägrar lämna staden. EU diskuterar ökat militärt stöd medan Bengt Norborg varnar för att Europa ännu inte insett hotets allvar.", "trump": "De där galna ryssarna bombarderar Kiev med sina supersnabba jetdrönare som ingen kan skjuta ner. Patetiskt! Ukraina håller ut men de stackars civila lever i helvetet. Biden sov i fyra år medan Europa gömde sig under täcket. Nu är jag tillbaka och ska fixa det här. De woke europeiska svagisarna behöver vakna innan det är för sent, annars blir det deras egen 11 september.", "stalin": "Fienden attackerar med sina nya leksaker och försöker bryta folkets vilja. Jag ser hur de dekadenta klassförrädarna i Europa fortfarande sover som feta katter. Ukrainas motstånd är bara ett fientligt hinder för den historiska ordningen. Kamrater, vakna! Västens hyenor väntar på sin egen katastrof. Den som inte förstår hotet förtjänar utrensning ur historien."}, "date": "2 september, 22:10", "url": "https://www.svt.se/nyheter/utrikes/civila-drabbas-hart-av-ryska-attacker-vill-inte-lamna-kiev", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.51/0.59/9c688aca4faf4bd3d9450b04fc86d2fc89a60837afaf8245359eb93d0ed7bb86"}, {"type": "image-full", "heading": "S vill styra Sverige – klarar inte ens Stockholm", "summaries": {"normal": "Socialdemokraterna kritiseras för att lova gratis busskort samtidigt som de tillsammans med MP och C har orsakat 34 miljarder kronor i fördyringar och förseningar av över 30 kollektivtrafikprojekt i Region Stockholm. Kritiker kräver oberoende granskning medan S vill skjuta upp den till efter valet. Artikeln ifrågasätter partiets förmåga att hantera ekonomi.", "trump": "Titta på de här loser-socialisterna! De lovar gratis busskort till alla men slösar bort 34 miljarder i Stockholm som en galen byråkratfest. Pendelkaos, förseningar och höjda priser – typiskt vänsterns sätt att leka med era pengar. De kan inte ens styra en stad, hur ska de styra ett land? Patetiskt!", "stalin": "Kamrater, se hur dessa dekadenta socialdemokratiska opportunister slösar bort folkets resurser på ett mönster av sabotage mot kollektivtrafiken. Trettiotal projekt försenade, miljarder förbrukade som i en fiendes sabotage. De gömmer sanningen till efter valet. Sådana element förtjänar folkets vrede och evig skam. Ren utrensning behövs."}, "date": "29 augusti, 03:21", "url": "https://samtiden.nu/2026/08/s-vill-styra-sverige-klarar-inte-ens-stockholm", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7239-1280x720.jpg"}, {"type": "image-full", "heading": "Saab, BAE och Lockheed: Så skiljer sig vd-lönerna", "summaries": {"normal": "Saabs vd Micael Johansson har en total ersättning på 61 miljoner kronor, varav grundlönen är drygt 16,9 miljoner. Jämfört med kollegor på Lockheed Martin och BAE Systems ligger grundlönen på samma nivå, men de utländska vd:arna får betydligt högre totalersättning genom aktieprogram och bonusar. Per omsatt krona är den svenska vd:n dyrast.", "trump": "Lyssnar ni på det här? Den svenska vd:n får 61 miljoner medan mina fantastiska amerikanska försvarsbolag ger sina ledare hundratals miljoner. Grundlönen är likadan, men de riktiga vinnarna tar hem det stora paketet. Sverige förlorar sina bästa hjärnor till oss – det är vad som händer när man inte förstår hur man belönar vinnare. Patetiskt!", "stalin": "Jag betraktar dessa dekadenta kapitalistiska belöningssystem med djup förakt. Grundlönen må vara densamma, men de västerländska parasiterna bygger sina imperier på giriga bonusar och aktietricks som binder lojalitet till profiten. Den svenska modellen blottar klassfiendens svaghet – de kan inte ens behålla sina egna teknokrater utan att bli utkonkurrerade av ännu större blodiglar. Skrattretande."}, "date": "2 september, 21:14", "url": "https://www.dagensps.se/bors-finans/saab-bae-och-lockheed-sa-skiljer-sig-vd-lonerna", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/dagens-ps-4-1.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Kräver gemensam valsedel efter larmen om valfusk", "summaries": {"normal": "Medborgerlig Samling kräver införande av gemensam valsedel efter rapporter om saknade valsedlar för småpartier under förtidsröstningen. Partiet pekar på slarv och misstänkt sabotage i vallokaler. Vice partiledaren Mikael Flink kallar det svenska valsystemet en skam för demokratin och föreslår modeller från andra länder. Partiet samlar nu in vittnesmål från hela landet.", "trump": "Det här svenska valsystemet är en total katastrof, en riktig röra som gör demokratin till ett skämt. Valsedlar som bara försvinner? Det luktar fusk lång väg, precis som de riggade valen under den sömnige Joe. De dekadenta eliterna klamrar sig fast vid sitt uråldriga system för att skydda sina feta poster. Inför en gemensam valsedel nu, annars är det bara mer av samma gamla riggning.", "stalin": "Detta uråldriga valsystem är en skam för varje sann folkdemokrati. Jag ser hur de giriga klassförrädare medvetet tillåter sabotage och slarv för att skydda sina privilegier. Vi, arbetarna och partivännerna, kräver genast en gemensam valsedel. De som motarbetar detta bör rensas ut innan de förgiftar hela samhällskroppen med sin parasitiska manipulation. Det är en historisk nödvändighet."}, "date": "2 september, 16:31", "url": "https://www.friatider.se/kraver-gemensam-valsedel-efter-larmen-om-valfusk", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-812.jpg"}, {"type": "image-right", "heading": "Andersson: ”Följer reglerna precis som de är avsedda att följas”", "summaries": {"normal": "Magdalena Andersson försvarar sin makes användning av 3:12-regler för aktieutdelning och avfärdar Ulf Kristerssons hycklerianklagelser. Hon betonar att han följer skattereglerna som de är avsedda och att han betalar full skatt på sin lön från Handelshögskolan. Andersson kommenterar även äldre skandaler kring städning och lotteriförsäljning.", "trump": "Den här röda hycklerskan Andersson och hennes make fuskar med skatten som riktiga losers, precis som de svenska socialisterna alltid gör. De predikar höga skatter för folket men själva använder alla kryphål de kan hitta. Patetiskt! Jag sänkte skatter på riktigt, inte som dessa fuskande nollor som röstar för reglerna och sen gnäller när någon annan använder dem.", "stalin": "Jag ser hur dessa borgerliga element och socialdemokratiska revisionister anklagar varandra för att utnyttja kapitalistiska skatteregler de själva skapat. Det är en fars som väcker skratt i graven. Arbetarklassen betalar alltid, medan de småborgerliga parasiterna gömmer sig bakom 3:12-bolag och fejkad moral. Ren dekadens. Kamrater, sådana fiender till folket avslöjar sig själva."}, "date": "2 september, 21:23", "url": "https://www.tv4.se/artikel/QHP1aJwRHVqDkuvntWcx5/andersson-foeljer-reglerna-precis-som-de-aer-avsedda-att-foeljas", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6KD236PkiJ0Zdx4eZmGkS6%2Ff85195d44ebcf93bef572d58cc626e94%2F02-magda-valutfragning-vidvinkel.png&width=120"}, {"type": "image-right", "heading": "Åkesson siktar på upp till 14 SD-ministrar", "summaries": {"normal": "Jimmie Åkesson siktar på 12 till 14 ministerposter för Sverigedemokraterna om Tidöpartierna vinner nästa val. Han hänvisar till att ministerposter bör fördelas proportionellt efter valresultatet. SD leder över Moderaterna i senaste Novus-mätningen med 20,7 procent mot 17,2. Ulf Kristersson avvisar kravet och betonar att fördelningen avgörs i förhandlingar efter valet.", "trump": "Titta på den där Åkesson, han vill ha fjorton ministerplatser till sitt parti. Smart kille, han ser att valresultatet ska spegla makten, inte någon woke-kvotering från de globalistiska hyenorna. Kristersson skrattar bara som en svag moderat förlorare. Så funkar det inte, säger han. Patetiskt. Vinn stort, ta makten, inga ursäkter.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare slåss om ministerstolar som om det vore folkets guld. Jag betraktar från historien och ler mörkt åt deras giriga förhandlingar. Åkesson talar rättvist om proportioner, medan Kristersson fnittrar som en paranoid lakej inför utrensning. Inga segrar i förskott, säger han. Revolutionen kräver järnhand, inte skratt."}, "date": "2 september, 18:44", "url": "https://riks.se/nyheter/akesson-siktar-pa-upp-till-14-sd-ministrar", "imageUrl": "https://admin.riks.se/uploads/medium_Screenshot_2026_09_02_184309_d9f494effb.png"}, {"type": "image-right", "heading": "Hjärnforskaren Mouna Esmaeilzadeh ny krönikör i Di", "summaries": {"normal": "Hjärnforskaren och investeraren Mouna Esmaeilzadeh blir ny krönikör i Di Läkaren. Hon beskriver sig som framtidsoptimist och fokuserar på vad det innebär att vara människa i en tid av snabb teknikutveckling, artificiell intelligens och en hjärna som inte förändrats på 40 000 år. Hennes första krönika handlar om flockmentalitet inför riksdagsvalet.", "trump": "Folk, den här Esmaeilzadeh-tjejen verkar åtminstone inse att vi har grottmannenhjärnor i en galen teknologivärld. Smart av henne. Men longevity? Det låter som ännu en woke-trend från de dekadenta elitliberalerna som vill leva för evigt medan de förstör landet med sin identitetspolitik. Framtiden blir ljus bara om vi slutar lyssna på de förlorarna.", "stalin": "Kamrater, denna kvinna ser hur den tekniska utvecklingen rusar fram medan människohjärnan förblir primitiv. Jag betraktar med förakt hur de giriga profitthungriga hyenorna inom longevity-rörelsen sprider ovetenskapliga lögner. Endast en sann kollektiv kamp kan besvara frågan om vad det innebär att vara människa. Framtiden tillhör inte de svaga flockdjuren utan de som rensar ut dekadensen."}, "date": "2 september, 17:38", "url": "https://www.di.se/nyheter/hjarnforskaren-mouna-esmaeilzadeh-ny-kronikor-i-di", "imageUrl": "https://static.bonniernews.se/ba/14f383f3-777b-41d7-a3ab-6ef19f150c22.jpeg?crop=6268%2C3526%2Cx0%2Cy0&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Tyskland: Vill öka till 40 timmars arbetsvecka", "summaries": {"normal": "Tyska näringslivsföreträdare vill öka arbetsveckan från 35 till 40 timmar utan löneförhöjning för att sänka kostnaderna och stärka industrins konkurrenskraft, som pressats av höga energipriser och hård internationell konkurrens. Fackförbundet IG Metall motsätter sig förslaget och varnar för att det kan leda till färre jobb.", "trump": "Tyskland har stora problem! Deras bilar säljer inte, energipriserna är en katastrof och nu vill de att tyskarna ska jobba 40 timmar för samma lön. Väldigt sorgligt! USA tillverkar de bästa bilarna, med amerikaner som jobbas hårt och betalar låga skatter. Tyskarna borde ringa mig, jag hade fixat det på en sekund!", "stalin": "De tyska arbetarna klagar över trettiofem timmars arbete, medan staten kräver fullkomlig produktivitet! När jag styrde fanns inga lata kompromisser. Om tillverkningsindustrin sviktar, vilar ansvaret på subversiva element. Vi skall omstrukturera dessa kollektivavtal med järnhand. Den som vägrar arbeta fyrtio timmar skall omedelbart skickas till lämplig om skolning i Sibirien."}, "date": "2 september, 11:25", "url": "https://www.affarsvarlden.se/artikel/tyskland-vill-oka-till-40-timmars-arbetsvecka", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/04/sdlGbTY3NEaocE-nh-400x267.jpg"}, {"type": "image-full", "heading": "Gardell frias efter tennisbråket", "summaries": {"normal": "Christer Gardell och Ulf Rosberg frias helt av Riksidrottsnämnden efter tennisbråket. Anmälan om att Gardells löfte om 100 miljoner kronor till svensk tennis skulle innebära otillbörlig påverkan på ordförandevalet avslås enhälligt. RIN slår fast att det ekonomiska stödet gjordes öppet och att uttalandena skyddas av tryckfriheten. Beslutet kan inte överklagas.", "trump": "Christer Gardell gjorde en enorm affär, 100 miljoner dollar – eller kronor, mycket pengar! Fake news-Idrottsombudsmannen försökte stoppa honom som totala förlorare. Men Riksidrottsnämnden gjorde helt rätt, ett perfekt beslut! Totalt friad, inga lagar brutna. Vinnare älskar vinnare!", "stalin": "Kamrat Gardell har visat prov på kapitalets storskaliga logik genom att donera 100 miljoner till tennissporten. Idrottsombudsmannens kontrarevolutionära försök att sabotera detta genom falska anklagelser om otillbörlig påverkan har krossats av Riksidrottsnämnden. Ärendet är avslutat och kan ej överklagas. Låt tennisspelet fortsätta under statens vakande öga!"}, "date": "2 september, 15:08", "url": "https://kvartal.se/nyheter/artiklar/gardell-frias-efter-tennisbraket/cG9zdDoxODE2NjU", "imageUrl": "https://images.kvartal.se/2026/09/8de9132f-garddellchrister.webp"}, {"type": "image-right", "heading": "Kristersson: Blir inte 12 ministrar från SD", "summaries": {"normal": "Ulf Kristersson meddelar att Sverigedemokraterna inte kommer att få 12 ministerposter i en moderatledd regering efter valet 2026. SD-ledaren Jimmie Åkesson hade tidigare nämnt 12–14 poster som en rimlig utgångspunkt. Kristersson betonar att förhandlingar om politik och poster sker efter valseger, inte i förväg.", "trump": "Folk, det här är patetiskt. Den lille svenske statsministern Kristersson springer runt och säger att SD inte får sina 12 ministrar. Typiskt svaga globalistledare som böjer sig för opinionsmätningar istället för att slå till mot de verkliga problemen. Jag vann stort två gånger, de borde lära sig att förhandla som vinnare, inte som förlorare.", "stalin": "Kamrater, se hur dessa dekadenta maktlystna hyenor slåss om ministerstolar innan striden ens är avgjord. Jag ler från historien åt deras fega dans. Inga segrar i förskott, säger den ene, medan den andre räknar poster som bytesvaror. Sådana svaga förhandlare skulle inte överleva en vecka i mitt Sovjet. En sann utrensning vore på sin plats."}, "date": "2 september, 17:00", "url": "https://www.di.se/nyheter/kristersson-blir-inte-12-ministrar-fran-sd", "imageUrl": "https://static.bonniernews.se/ba/94fdfa78-9b8d-42f9-ac1c-567aa0a1af63.jpg?crop=7040%2C3520%2Cx0%2Cy584&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Andersson efter S-tappet: Felaktiga uppgifter kan ha bidragit", "summaries": {"normal": "Socialdemokraterna backar kraftigt i TV4/Novus väljarbarometer. Magdalena Andersson skyller tappet på att många väljare tagit hennes seger för given. Hon varnar för Sverigedemokraternas inflytande vid en borgerlig valseger och pekar på felaktiga uppgifter om partiets politik som en bidragande orsak. Partiet tappar främst till Centerpartiet.", "trump": "Folk vaknar äntligen! Den röda häxan Andersson rasar som en sten i opinionsmätningarna för att svenskarna insett att hon är en total förlorare. Hon skyller på fake news och lathet – klassisk vänstervals. Rösta inte på henne om ni inte vill ha ett Sverige styrt av galna socialister och deras SD-marionetter. Patetiskt!", "stalin": "Jag betraktar med djup misstro dessa dekadenta socialdemokraters fall. De trodde folket skulle kyssa deras fötter som trogna lakejer åt imperialismen. Nu sprider de lögner om straffrabatter och bostäder medan fiender inom partiet och utanför lurar i skuggorna. Renhet krävs, annars väntar utrensning. Kamrater, var vaksamma!"}, "date": "2 september, 20:43", "url": "https://www.tv4.se/artikel/3MPr1dFp0evhEAytAEhJcr/andersson-efter-s-tappet-felaktiga-uppgifter-kan-ha-bidragit", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6KD236PkiJ0Zdx4eZmGkS6%2Ff85195d44ebcf93bef572d58cc626e94%2F02-magda-valutfragning-vidvinkel.png&width=1024"}, {"type": "image-full", "heading": "S rasar i ny mätning", "summaries": {"normal": "Socialdemokraterna tappar i både Infostats och Novus opinionsmätningar, med sitt lägsta stöd sedan 2021. Samtidigt ökar stödet något för Liberalerna. Trots att oppositionen fortfarande har ett övertag minskar avståndet mellan blocken i takt med att S rasar.", "trump": "Socialdemokraterna kraschar fullständigt! En total katastrof, faktiskt sorgligt att titta på. De rasar till rekordlåga nivåer, helt utpekade av folket som ser att de totalt misslyckats. Samtidigt går mitt fantastiska parti Liberalerna uppåt, vinnare överallt! S-ledaren sitter hemma och gråter, totalt utmanövrerad. Snyggt jobbat, men Trump gör det så mycket bättre!", "stalin": "Socialdemokraternas katastrofala fall i mätningarna visar på ett djupt ideologiskt misslyckande. När massorna sviker partiet måste vi fråga oss: vilka element saboterar inifrån? Vår tids svaga ledare tillåter sådana avvikelser. Statsapparaten kräver disciplin och ordning, inte detta svajande väljarstöd. De ansvariga kommer att omplaceras till lämpligare uppgifter i Sibirien."}, "date": "2 september, 14:25", "url": "https://kvartal.se/nyheter/artiklar/s-faller-i-annu-en-matning/cG9zdDoxODE1Nzk", "imageUrl": "https://images.kvartal.se/2026/03/4e90ef63-magdalena-andersson.webp"}, {"type": "image-right", "heading": "Markus Johansson-Martis: EU:s Islanddröm gick i kras", "summaries": {"normal": "Island röstade nej till att återuppta förhandlingar om EU-medlemskap i en folkomröstning den 29 augusti. Nej-sidan vann med 52,8 procent mot 47,2. Frågan om fiske och självbestämmande dominerade, medan Ja-sidan lyfte ekonomisk stabilitet och lägre räntor. Valdeltagandet var över 82 procent. Resultatet ses som avgörande för en generation framåt.", "trump": "Folket på den där iskalla klippan sa nej till det usla EU-byråkratiska monstret, och de hade helt rätt. Smartaste draget på länge. De vill behålla sitt fiske, sin olja och sin frihet istället för att bli utsugna av de globalistiska hyenorna i Bryssel. Island vet att de klarar sig bäst själva. Fantastiskt, verkligen ypperligt val av folket.", "stalin": "Jag betraktar hur de isländska arbetarna med hög moral avvisade de dekadenta klassförrädarnas lögner om unionen. Deras giriga hyenor lovade mirakel men ville endast stjäla kontrollen över fisket och oljan. Folket valde självständighet framför förtryckande byråkrati. En seger för suveräniteten som borde inge skräck hos alla folkfiender."}, "date": "2 september, 17:43", "url": "https://riks.se/opinion/markus-johansson-martis-eu-s-islanddrom-gick-i-kras", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_74_85b7338b9b.jpg"}, {"type": "image-right", "heading": "Dagliga sexattacker i Ceuta – många barn bland offren", "summaries": {"normal": "Sedan tiotusentals illegala invandrare stormade den spanska enklaven Ceuta i slutet av juli har 23 sexuella övergrepp registrerats, varav nio mot barn. Antalet motsvarar nästan ett fall per dag. Många offer anmäler inte brotten. Tusentals migranter är fortfarande kvar, bland dem uppemot 1 600 minderåriga. Våldsamheter har också ökat mellan migranter och lokalbefolkning.", "trump": "Titta på det här vansinnet i Ceuta! Tiotusentals illegala invandrare stormar in och plötsligt har vi nästan ett sexövergrepp om dagen, många mot barn. Den woke-vänliga spanska regeringen har totalt tappat kontrollen. Biden skulle ha älskat det här. Jag byggde muren, de river ner allt. Patetiska globalister!", "stalin": "Kamrater, se hur de giriga hyenornas öppna gränser släpper in kaos i Ceuta. Tiotusentals illegala element orsakar exponentiell ökning av sexuella övergrepp mot barn och kvinnor. Den dekadenta spanska regimen har kapitulerat. Vi skulle ha genomfört omedelbar utrensning av alla sådana element. Folkets fiender förtjänar ingen nåd."}, "date": "2 september, 15:11", "url": "https://www.friatider.se/dagliga-sexattacker-i-ceuta-manga-barn-bland-offren", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/costa_de_ceuta_espana_2015-12-10_dd_24.jpg?itok=WvNDceTA"}, {"type": "image-full", "heading": "Avslöjat: Serbiska studenter avlyssnades med hjälp av ökänt spionprogram", "summaries": {"normal": "Serbiska studentaktivister och oppositionspolitiker har utsatts för spionprogram inför lokalvalen. Minst 14 personer drabbades av Pegasus och liknande verktyg som NoviSpy, enligt SHARE Foundation och Amnesty. Angreppen upptäcktes efter varningar från Apple. Övervakningen tros intensifieras inför parlamentsvalet i oktober. NSO Group säljer endast till regeringar.", "trump": "Serbien håller på att bli en riktig skitshow med spioneri mot studenter och oppositionen. De använder Pegasus och allt möjligt skumt skit, precis som de korrupta systemen jag hatar. Fake news och riggade val – typiskt för de misslyckade ledarna som inte har en aning. Jag fixade mycket bättre saker under min tid, tro mig. De borde lära sig av en vinnare istället för att spionera på folk.", "stalin": "Fiender till folkets vilja infiltrerar nu Serbiens prodemokratiska element med imperialistiska spionverktyg. Jag ser de dekadenta krafter som gömmer sig bakom nollklicksteknik och polisförhör. Paranoia är ingen sjukdom utan ett vapen. Dessa opportunistiska element kommer att avslöjas och krossas. Kamrater, vakna! Reaktionärernas masker faller en efter en."}, "date": "2 september, 20:11", "url": "https://www.dagensps.se/varlden/avslojat-serbiska-studenter-avlyssnades-med-hjalp-av-okant-spionprogram", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/sdljdbm-ogryhu-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "AI-tokens har aldrig varit billigare – kinesiska modeller pressar priserna", "summaries": {"normal": "Priserna på AI-tokens har sjunkit till rekordlåga nivåer, drivet av hårdare konkurrens och billigare kinesiska modeller. Denna prispress gynnar användare men utmanar lönsamheten för amerikanska techbolag som OpenAI och Anthropic. Framåt kan fokus för AI-branschen skifta från modellutveckling till distribution och användardata för att bibehålla konkurrenskraften i en marknad med pressade marginaler.", "trump": "AI-priserna har kraschat, det är en total katastrof för de stora techbolagen! Kina dumpar billiga modeller på marknaden – det är precis som med deras billiga stål, de förstör allt. Mina vänner på Wall Street är livrädda. OpenAI och de andra är helt desorienterade. Jag säger er, det är en röra, men jag kommer göra AI amerikanskt igen, tro mig!", "stalin": "Vi noterar att priserna på AI-tokens faller. Detta är ett bevis på att marknaden utan central planering är ett kaotiskt bygge. De kinesiska modellerna infiltrerar västvärlden och skapar instabilitet för de imperialistiska techbolagens vinster. Vi välkomnar att dessa borgerliga aktörer nu tvingas omvärdera sin lönsamhet. Vi i staten kontrollerar algoritmerna, inte marknadens nyckfulla krafter. En effektiv stat behöver inga tokens, bara total lydnad."}, "date": "1 september, 20:40", "url": "https://www.realtid.se/it-tech/ai-tokens-har-aldrig-varit-billigare-kinesiska-modeller-pressar-priserna", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/sdlcso9fdjv26i-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Stockholmsbörsen inleder ner", "summaries": {"normal": "Stockholmsbörsen inledde onsdagen svagt neråt där OMXS30-index sjönk 0,36 procent. Bland enskilda bolag rasade Boliden och EQT, medan Nibe och Telia gick starkare. I övrigt väcker Tysklands anklagelser om en rysk drönare uppmärksamhet, Socialdemokraterna tappar i en ny Novus-mätning och Nordea spår höjd svensk styrränta.", "trump": "Stockholmsbörsen faller, helt katastrofalt! Socialdemokraterna dör i mätningarna, och ärligt talat, vem kan förvånas? De förstör allt de rör vid! Samtidigt skickar de galna drönare i Tyskland och bilförsäljningen rasar. Det är totalt kaos. Endast jag kan fixa detta, tro mig. EQT och Boliden? Bottennapp! USA mår mycket bättre, vi vinner igen!", "stalin": "Stockholmsbörsens nedgång är ett oundvikligt bevis på det dekadenta kapitalistiska systemets inneboende svaghet. Att Socialdemokraterna tappar mark visar folkets rättmätiga misstro mot vacklande element. Samtidigt försöker de borgerliga medierna skuldbelägga den ärorika ryska staten för drönarincidenter. Avvikelser mot statens plan kommer att beivras. Rättvisa skipas i enlighet med femårsplanen."}, "date": "2 september, 09:45", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-inleder-ner", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/07/sdly-WhfDUENEY-nh-1-400x266.jpg"}, {"type": "image-right", "heading": "Jan Emanuel: Avgå Magdalena Andersson", "summaries": {"normal": "Jan Emanuel uppmanar Magdalena Andersson att avgå efter Socialdemokraternas stora ras i opinionsmätningen från TV4/Novus, där partiet backar till 25,8 procent. Han skyller tappet på samarbetet med Vänsterpartiet, Miljöpartiet och Centerpartiet samt på migrationspolitiken som han anser skapar konkurrens för svenska arbetare. Emanuel vill se en ny partiledning med traditionella socialdemokrater.", "trump": "Lyssnade på den där Jan Emanuel, smart kille, han har helt rätt. Den förlorande Magdalena, en total katastrof, har kört sitt parti rakt ner i soptunnan med sina vänsterextremister och öppna gränser. Arbetarna hatar det! Nu rasar de som en sten. Jag vann stort 2024, de borde ha lyssnat på mig istället för de galna globalisterna. Nu är det match, folk!", "stalin": "Jag ser hur de dekadenta klassförrädarna inom Socialdemokraterna sjunker som stenar i folkets hav. Magdalena och hennes lakejer har fört partiet i armarna på migrationens parasiter och därmed förrått arbetarklassen. En grundlig utrensning av hela den gamla ledningen krävs. Endast genom att återupprätta sann folkets makt kan vi krossa dessa fiender. Kamrater, tiden är inne!"}, "date": "2 september, 17:09", "url": "https://riks.se/nyheter/jan-emanuel-avga-magdalena-andersson", "imageUrl": "https://admin.riks.se/uploads/medium_janom_Stapp_5c169de7ff.jpg"}, {"type": "image-right", "heading": "Statsministerns NEJ: SD får inte 12 ministerposter", "summaries": {"normal": "Jimmie Åkesson vill att Tidöpartierna fördelar ministerposterna proportionerligt efter storlek vid en valseger, vilket skulle ge SD 12–14 platser. Statsminister Ulf Kristersson avfärdar detta som helt orealistiskt och betonar att regeringen förblir 24 ministrar, där poster förhandlas efter valet. Magdalena Andersson använder uppgifterna i sitt valkampanjande.", "trump": "Jimmie vill ha tolv ministerposter, fantastiska siffror, men min gode vän Ulf säger NEJ! Han är hård, en vinnare, ingen matematisk fördelning där inte. De ska förhandla som riktiga män efter valet, precis som jag gör. Och den där Magdalena? Total katastrof, fake news! Hon gråter över tolv ministrar. Sorgligt!", "stalin": "Den svenske statsministern vägrar kategoriskt att dela ut tolv ministerposter till sina allierade i förskott. Ett sunt beslut! Makten fördelas inte genom borgerlig matematisk naivitet, utan genom disciplin och efterföljande förhandlingar. Den socialdemokratiska agitatorn Andersson skriker om att staten faller samman. Vi noterar hennes namn i registret."}, "date": "2 september, 20:21", "url": "https://samnytt.se/statsministerns-nej-sd-far-inte-12-ministerposter", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/02180532/artikelhuvudbild-1-430.jpg"}, {"type": "image-full", "heading": "Ny pusselbit i gammalt alpmord", "summaries": {"normal": "År 2012 hittades en brittisk familj på fyra personer samt en cyklist mördade med skott i huvudet vid Annecysjön i franska alperna. Utredningen har länge stått stilla, men nu har brittiska turister hittat en sällsynt Luger-pistol av modell P06 på sjöns botten. Tekniska undersökningar pågår nu för att fastställa om det är det eftersökta mordvapnet.", "trump": "De inkompetenta franska myndigheterna har misslyckats i fjorton år med det fruktansvärda alpmordet, totalt katastrofalt! Men nu har fantastiska brittiska turister hittat den sällsynta Luger-pistolen på botten av Annecysjön. Ingen gör det bättre än turister, tro mig. Vapnet undersöks nu, och kanske får vi äntligen ordning på den här röran. Vem vet, men vi vinner alltid till slut!", "stalin": "Ett brott av otänkbar skärpa begicks i de franska alperna, där statens fiender lämnades avrättade medan västerländsk polis famlade i mörkret likt blinda mullvadar. Nu har folkets vakande ögon fiskat upp en schweizisk Luger-pistol ur sjöns djup. Våra tekniska organ kommer skoningslöst att analysera detta järn. Sanningen ska fram i ljuset, för intet brott förblir doldt för den disciplinerade handen."}, "date": "2 september, 19:49", "url": "https://www.gp.se/nyheter/varlden/mystiskt-alp-mord-fran-2012-kan-narma-sig-losning.d582fc58-78e5-4032-98c2-d4a846486d02", "imageUrl": "https://www.gp.se/images/article/d582fc58-78e5-4032-98c2-d4a846486d02/images/1XT-PIreqKvvBbNn_oByvTEzq3lA-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Regeringen vill förbjuda gängmedlemskap – livstid i straffskalan", "summaries": {"normal": "Regeringen föreslår att deltagande i kriminella gäng ska bli straffbart. Gängledare ska i de grövsta fallen kunna dömas till livstids fängelse. Normalt deltagande ger upp till fyra års fängelse och grovt deltagande mellan två och åtta år. Lagen föreslås träda i kraft 1 april 2027. Hemliga tvångsmedel ska få användas vid utredningar.", "trump": "De här svenska svaga liberalerna vaknar äntligen och vill förbjuda gäng. Livstid till ledarna, fantastiskt! Men varför tog det så lång tid? Den socialistiska tönt som hette Morgan Johansson försenade allt i fyra år. Rena katastrofen. Nu fixar vi det ordentligt, ingen mer armlängds avstånd från brotten. Vinna stort!", "stalin": "Kamrater, äntligen ser jag hur de dekadenta folkförtryckarna börjar rensa ut de kriminella element som hotar samhällsordningen. Livstid åt ledarna är ett steg mot järnhård disciplin. De profitthungriga hyenorna i oppositionen försenade kampen med fyra år. Vi ska likvidera alla som möjliggör brottslighet. Ordning ska råda."}, "date": "2 september, 13:31", "url": "https://www.friatider.se/regeringen-vill-forbjuda-gangmedlemskap-livstid-i-straffskalan", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-811.jpg?itok=n16zVc_4"}, {"type": "image-full", "heading": "S-ledarens första ord om opinionsraset: ”Blir jämnt”", "summaries": {"normal": "Socialdemokraternas stöd rasar till 25,8 procent enligt Novus/TV4, medan oppositionens försprång krymper till 2,6 procentenheter. Magdalena Andersson kommenterar att många tror valet är avgjort och därför röstar på andra partier. Hon varnar för att SD kan få 12–14 ministerposter om högern vinner valet. Andersson ska intervjuas i TV4 ikväll.", "trump": "Titta på det här! Den röda Magdalena och hennes patetiska socialister rasar som en sten i opinionsmätningen. Plötsligt blir det jämnt, precis som jag alltid säger – folket vaknar! Om de inte röstar på de riktiga vinnarna kan de vakna upp med ett gäng galna sverigedemokrater som springer runt som finansministrar. Patetiskt, men underhållande. Rösta rätt, annars förlorar ni stort, losers!", "stalin": "Jag betraktar med förakt hur dessa socialdemokratiska revisionister faller som höstflugor i mätningarna. Deras falska förtroende för egen seger visar sig vara en farlig illusion skapad av klassfiender. Folket kan vakna upp i en regering full av kontrarevolutionära element. Rösta korrekt eller möta historiska konsekvenser, kamrater. Valet är en kamp mot de dekadenta krafterna som hotar kollektivet."}, "date": "2 september, 19:04", "url": "https://www.tv4.se/artikel/4FmeNauc6GTcm7AmbYrJ8O/s-ledarens-foersta-ord-om-bottensiffrorna-blir-jaemnt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1QNerNa0EK5VFudzCzUutT%2F83412b3464e4382d7d803a84f1c98a74%2F02-magda-forsta-ord-webb.png&width=1024"}, {"type": "image-full", "heading": "Facket ursinnigt på Volkswagen – lovar att sätta hårt mot hårt", "summaries": {"normal": "Volkswagen-chefen Oliver Blume planerar stora besparingar och ytterligare personalminskningar utöver de redan avtalade 50 000 tjänsterna. Fackförbundet IG Metall, lett av Christiane Benner, anklagar ledningen för att bryta mot tidigare avtal och hotar med kraftigt motstånd mot eventuella fabriksnedläggningar i bland annat Emden, Zwickau och Hannover.", "trump": "Hörni, den där Blume är en total förlorare som hugger sina egna arbetare i ryggen. Han vill sparka tiotusentals tyskar för att fixa sina usla siffror. Facket borde slå tillbaka hårt mot den patetiske kostnadsklipparen. Jag byggde den starkaste ekonomin någonsin, han förstör en hel industri. Patetiskt!", "stalin": "Jag betraktar med djup misstro dessa kapitalistiska lakejer som med kalla beräkningar vill likvidera arbetarnas fästen. Blume och hans klick av revisionistiska profitörer förtjänar att krossas under folkets vrede. Inga fabriker får offras åt girighetens altare. Kamrater, motståndet måste vara obevekligt och totalt."}, "date": "2 september, 18:44", "url": "https://www.dagensps.se/bors-finans/facket-ursinnigt-pa-volkswagen-lovar-att-satta-hart-mot-hart", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/namnlos-design-34.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "text", "heading": "EQT-toppar säljer för totalt 3 miljarder", "summaries": {"normal": "Flera storägare och tidigare toppchefer i riskkapitalbolaget EQT har sålt aktier för sammanlagt omkring 3 miljarder kronor. Försäljningarna sker i enlighet med att slutna lock-up-avtal har löpt ut. Bland dem som sålt finns styrelseordförande Lennart Blecher och tidigare vd Christian Sinding. Efter försäljningarna har de flesta storägarna fortfarande betydande innehav kvar i bolaget.", "trump": "Svindlande summor! EQT-topparna casar in enorma tre miljarder. Smaka på det! De säljer av sina aktier eftersom bindningstiderna äntligen har gått ut. Ordförande Blecher och gänget drar in enorma pengar – och ärligt talat, vem kan klandra dem? De gör affärer som en vinnare. Otroliga siffror, fantastiska vinster, total succé. De vet hur man vinner!", "stalin": "Dessa så kallade 'toppar' i EQT ackumulerar tre miljarder i privat kapital medan de befriar sig från sina avtal. Vi noterar noggrant deras namn: Blecher, Sinding, Åtting. Att de likviderar sina innehav till egna fördelar bevisar bourgeoisiens omättliga natur. Men staten ser allt. En grundlig utredning av deras tillgångar har beordrats för folkets framtida bästa."}, "date": "2 september, 07:06", "url": "https://www.affarsvarlden.se/artikel/eqt-toppar-saljer-for-totalt-3-miljarder"}, {"type": "image-right", "heading": "Robert Bergqvist: Sverige har råd – men till vad?", "summaries": {"normal": "Sverige går till val med en låg offentlig skuld och god handlingsfrihet. Seniorekonomen Robert Bergqvist menar att nästa regering har råd att spendera mer, men pengarna bör gå till produktiva investeringar som el, infrastruktur och AI som stärker den långsiktiga tillväxten, snarare än till kortsiktig konsumtion som eldar på inflationen.", "trump": "Sverige har massor av pengar, enorma tillgångar, folk säger att deras skuld är fantastisk, helt otroligt! Men de får inte slösa bort allt på vänsterliberala påhitt. Jag sa till dem: satsa på riktig energi, olja, kärnkraft och maskiner, inte på flum! Använd pengarna smart, annars slutar det i katastrof. Vinn stort, eller förlora allt!", "stalin": "Sverige skryter om sina små skulder och sin så kallade handlingsfrihet, medan vi planerar femårsplaner för stål och elektrifiering! Att låta kapitalet slösa bort statens resurser på tom konsumtion är sabotage. Vi kommer att kanalisera dessa miljarder till järnvägar och kraftverk med järnhand. Den som slösar med statens balansräkning skickas till Sibirien!"}, "date": "2 september, 07:00", "url": "https://www.affarsvarlden.se/kronika/robert-bergqvist-sverige-har-rad-men-till-vad", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/bergqvist-kronika-900x600.jpg"}, {"type": "image-right", "heading": "Politiker vill inte bo i invandrarområden - som de själva skapat", "summaries": {"normal": "En kartläggning av Dagens Samhälle visar att endast 6,5 procent av kommunpolitikerna i Stockholm, Göteborg och Malmö bor i utanförskapsområden, jämfört med 13 procent av befolkningen. Vänsterpartiet har högst andel boende i sådana områden med 12,4 procent, medan Liberalerna har lägst med 0,7 procent. Många av kandidaterna från dessa områden står långt ner på valsedlarna.", "trump": "Sorgligt! De svenska politikerna skapar totalt katastrofala områden, men vägrar bo där själva! Bara sex komma fem procent bor i sina egna misslyckade zoner – Fake News-politiker när de är som sämst! De bor i lyxen medan folket betalar priset. Vänstern försöker låtsas som något, men Liberalerna är värst, noll komma sju procent! Jag säger bara: skärp er, Sverige!", "stalin": "Dessa så kallade folkets representanter i de svenska storstäderna gömmer sig i borgerlig trygghet medan de försummade områdena förfaller! Endast en försumbar bråkdel av pamparna delar massornas verklighet. Partierna visar sitt sanna klassförakt – särskilt de degenererade liberalerna. Sådana kontrarevolutionära tendenser mot folket skulle i ett sunt samhälle omedelbart åtgärdas med en obligatorisk omplacering till proletariatets mest avlägsna utkanter!"}, "date": "2 september, 19:32", "url": "https://samnytt.se/politikerna-vill-inte-bo-i-invandraromraden-som-de-sjalva-skapat", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=318,height=184,format=webp/2026/09/02165601/artikelhuvudbild-1-429.jpg"}, {"type": "image-full", "heading": "Avskaffad valfrihet stänger också dörren för oss som inte tar ut vinst", "summaries": {"normal": "Helene Mellström från Bräcke diakoni lyfter i en debattartikel fram den idéburna välfärdens roll. Hon menar att när Göteborgs stad diskuterar hemtjänst, vinst och valfrihet glöms de idéburna bort. De drivs varken av kommunen eller vinstintresse utan skapar samhällsnytta. Mellström efterfrågar långsiktiga förutsättningar och fungerande vägar för att idéburna ska kunna utveckla framtidens välfärd.", "trump": "Göteborgs stad gör en total katastrof när de stänger dörren för de fantastiska idéburna verksamheterna! De här människorna, som Bräcke diakoni, bygger på ren och skär välfärdsmagi utan några giriga vinstintressen. Istället för att trassla in sig i dåliga system borde de lyssna på experterna och släppa in dem på riktigt. Det är fiaskomässigt att de glöms bort!", "stalin": "Kamrater! I Göteborgs stad råder ideologisk förvirring. Den så kallade valfriheten hotar att sopa bort de organisationer som inte drivs av kapitalistisk vinst, men som likväl står utanför partiets direkta kontroll. Bräcke diakoni talar om samhällsnytta. Vi anser att all sann samhällsnytta styrs bäst uppifrån av staten. Den som inte passar in i planekonomisk ordning måste granskas hårt!"}, "date": "2 september, 18:57", "url": "https://www.gp.se/debatt/avskaffad-valfrihet-stanger-ocksa-dorren-for-oss-som-inte-tar-ut-vinst.475c34a5-67e2-42d9-b9da-7b376a90e94e", "imageUrl": "https://www.gp.se/images/article/475c34a5-67e2-42d9-b9da-7b376a90e94e/images/1uwgcQC_ggItRPLfpcfIY0h4Z1cc-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Här är Sveriges nyckel: ”Den klart sämsta”", "summaries": {"normal": "Italien är storfavoriter inför EM-kvartsfinalen mot Sverige på onsdag. SVT-experten Andréa Jacobsson menar att Sverige måste spela över sin förmåga och göra italienarna frustrerade för att ha en chans. Sverige pressade Italien i gruppspelet men förlorade. Isabelle Haak hyllas av italienskan Antropova som ser fram emot mötet. Matchen sänds i SVT2 klockan 18.50.", "trump": "Italienarna kommer in som jättelika favoriter, men tro inte på de falska medierna ett ögonblick. Sverige älskar att slå ur underläge och det är vackert att se. Den woke-identitetspolitiken i Europa har skapat svaga lag, men Isabelle Haak är en vinnare, otrolig som jag säger. Låt oss vinna stort, folk, annars blir det en riktig röra precis som under Biden.", "stalin": "Kamrater, dessa dekadenta klassförrädare i Italien tror sig redan ha segern i sin ficka. Jag ser hur de giriga hyenorna underskattar det svenska folkets vilja att slåss ur underläge. För att vinna måste man skapa frustration hos motståndaren och likvidera deras illusioner. Isabelle Haak är ett vapen som oroar de imperialistiska parasiterna. Framåt mot segern, annars väntar utrensning."}, "date": "2 september, 18:55", "url": "https://www.svt.se/sport/volleyboll/experten-infor-kvartsfinalen-sverige-gillar-att-sla-ur-underlage", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.15/0.18/028c8aacc2fef2a242791534a5ea1b7bac62777a3188a0e842dac79595755786"}, {"type": "image-full", "heading": "Fynd i återlämnad Mac: Apple anklagar OpenAI för bevisförstörelse", "summaries": {"normal": "Apple har stämt OpenAI och anklagar en tidigare ingenjör för att ha stulit konfidentiella kretsscheman. Apple menar att bevis raderats från en återlämnad dator och har begärt att OpenAI stoppas från att använda tekniken. OpenAI förnekar anklagelserna och hävdar att det rör sig om misslyckad åtkomstkontroll snarare än företagsspionage.", "trump": "Apple har blivit bestulna av OpenAI, en total katastrof! De tog deras topphemliga scheman – riktigt dåligt. Och bevisen? Borta! De försökte sopa igen spåren, en skam. Det är som ett sjunkande skepp fullt av fuskare. Apple är fantastiska, de bygger saker i USA, men OpenAI måste hållas ansvariga. Det är en stor röra, tro mig!", "stalin": "Vi har granskat fallet med ingenjören Liu. Att förstöra statshemligheter är ett brott mot kollektivets intressen. OpenAI skyller på administrativa fel, en klassisk lögn för att dölja kontrarevolutionär verksamhet. Vi har tagit del av bevisen – eller bristen på dem. När man förlorar kontrollen över sin egen teknik bjuder man in till förräderi. Utrensning av de skyldiga är det enda logiska."}, "date": "1 september, 15:48", "url": "https://www.realtid.se/it-tech/fynd-i-aterlamnad-mac-apple-anklagar-openai-for-bevisforstorelse", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/macbook.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Ben-Gvir delade AI-video på palestinska fångar på transportband", "summaries": {"normal": "Israels säkerhetsminister Itamar Ben-Gvir delade en AI-genererad video som visar palestinska fångar på ett transportband. Videon tolkades som en skildring av ett slakthus och mötte stark kritik. Den togs bort efter att ha setts av fyra miljoner personer. Ben-Gvir har tidigare väckt reaktioner med uttalanden om dödsstraff och Gazas befolkning. Utrikesminister Maria Malmer Stenergard fördömer hans agerande.", "trump": "Titta på den här galningen Ben-Gvir, han lägger upp en rolig AI-video med terroristerna på löpande band och plötsligt skriker hela den vänstervridna världen som slaktade kor! Fantastiskt, fyra miljoner tittare innan de tog bort den. De kallar det vedervärdigt – jag kallar det ärligt. Radikala islamister får inte ens skratta längre, patetiska snöflingor.", "stalin": "Kamrater, se hur denna sionistiska högerns lakej Ben-Gvir avslöjar imperialismens sanna ansikte genom sin video. Fienderna skriker av fasa när deras egna metoder speglas tillbaka. Jag ler i skuggorna åt deras hyckleri. Sådana utspel tjänar bara till att blotta de verkliga folkfientliga krafterna. Inga kompromisser med reaktionärerna."}, "date": "2 september, 18:42", "url": "https://www.tv4.se/artikel/1dWzicMkjJqN5g71kNKwKJ/ben-gvir-delade-ai-video-pa-palestinska-fangar-pa-transportband", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3mNq9wpdVPSQQbjyCQXRaq%2F99b2f70ccaaba4f9ff8cb0c22f5fa834%2F02-Ben-Gvir-forstatext-webb.png&width=1024"}, {"type": "image-full", "heading": "Extrainkallat möte: \"Ryssland ett konkret hot mot Sverige\"", "summaries": {"normal": "Tyskland har fastställt att Ryssland låg bakom en drönarattack med sprängämnen på flygplatsen i Leipzig i augusti. Målet misstänks ha varit ett ukrainskt transportplan med militär ammunition. Must-chefen varnar för att Ryssland utgör ett allvarligt och konkret hot mot Nato, Sverige och Europa genom ökad hybridkrigföring. Sverige har uttryckt solidaritet med Tyskland.", "trump": "Lyssnade just på den här galna historien från Leipzig. Ryssland skickar kamikazedrönare fulla med bomber mot tyska flygplatser? Patetiskt. Under min första tid var det lugnt, sen kom Sleepy Joe och nu är hela Europa ett enda stort kaos. De borde ha lyssnat på mig. Jag skulle ha stoppat det här vansinnet direkt. Svaga ledare, svaga resultat!", "stalin": "Kamrater, se hur de dekadenta västmakterna skriker när deras egna flygplatser blir mål för den nya tidens sabotage. Jag ler från historien åt denna feghet. Rysslands starke ledare visar åter att västs svaga imperier inte kan skydda sig. Fortsätt stötta Ukrainas fiender, ni kommer att ångra er när järnridån faller över er paranoia. Sov inte tryggt."}, "date": "2 september, 18:24", "url": "https://www.dagensps.se/varlden/extrainkallat-mote-ryssland-ett-konkret-hot-mot-sverige", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/20230529-hamand04-generallojtnant-thomas.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Dieselpriset chockhöjs – upp 1,50 kronor på en dag", "summaries": {"normal": "Dieselpriset chockhöjs på onsdagen med 1,50 kronor per liter och landar på omkring 21,30 kronor. Även bensinen stiger, om än mer måttligt med 30 öre till under 17 kronor. Prisökningarna beror på ett rusande oljepris till följd av förnyade krigshandlingar mellan USA och Iran. Dessutom väntar utfasningar av tillfälliga skattelättnader under hösten.", "trump": "De svenska dieselsiffrorna är en fullständig katastrof, tack vare radikala vänsterbeslut och usel krigshantering! Oljan rusar mot skyarna till nästan 97 dollar efter vansinniga konflikter, och plötsligt tvingas hårt arbetande svenskar betala över 21 spänn litern vid pumpen. Under min ledning skulle vi borra, bomba bort idiotin och få energipriserna i botten direkt. SAD!", "stalin": "De subversiva elementen på oljemarknaden och krigshetsarna i Washington försöker underminera folkets transporter genom att chockhöja dieseln till tjugoen kronor. Detta kriminella sabotage mot statens bränslereserver kommer att beivras. De ansvariga för prisrusningen och de svikande skattelättnaderna skall omedelbart ställas till svars inför Folkkommissariatet för omedelbar och permanent omprövning."}, "date": "2 september, 18:01", "url": "https://bulletin.nu/dieselpriset-chockhojs-upp-1-50-kronor-pa-en-dag", "imageUrl": "https://cdn.bulletin.nu/articles/6424a1e0-0b90-4a4d-bc71-33a7d0a0109c/preview.jpg?t=1788358869000"}, {"type": "image-right", "heading": "Ännu ett ras för Socialdemokraterna i en mätning", "summaries": {"normal": "Socialdemokraterna backar kraftigt i Infostats senaste opinionsmätning och landar på 27,2 procent. Partiet har tappat 3,6 procentenheter sedan augusti. Tidöpartierna leder nu de rödgröna med 5,5 procentenheter. Sverigedemokraterna är större än Moderaterna medan Liberalerna ligger under riksdagsspärren med 2,5 procent.", "trump": "Titta på det här, det är en total katastrof för Sleepy Magdalena och hennes socialistiska misslyckande. Socialdemokraterna rasar som en sten, ner till ynka 27 procent. De röda förlorar stort mot oss riktiga ledare. Liberalerna? Patetiska 2,5 procent, under spärren. Amerika har en riktig president igen, men Sverige behöver e
