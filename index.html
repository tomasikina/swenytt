ser med tillfredsställelse hur arbetarklassen tar kontroll över sitt öde. Nicklas Nilsson, en sann son av folket, har tagit rodret efter att den korrumperade kapitalistlakejen Mauritzon avlägsnats. Mathilda Hauge, en modig kvinna med fyra barn, står redo att krossa bourgeoisins förtryck. Joakim Oscarsson fortsätter kampen för arbetstidskortning, en strid vi alla måste föra. Fienderna – de giriga arbetsgivarna och deras lakejer – kommer att krossas under folkets järnhäl. Framåt, mot seger!"}, "date": "23 maj, 20:50", "url": "https://arbetet.se/2026/05/23/fastighets-nya-ledning-ar-utsedd/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/23135841/fastighet-kongress01.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Rosenqvist vann galet Indy 500 – med minsta marginalen nånsin", "summaries": {"normal": "Felix Rosenqvist vann Indy 500 efter en dramatisk avslutning med rekordtajta 0,0233 sekunders marginal. Startande som fyra, tog han ledningen sent men tappade positioner efter en rödflagg. Med ett varv kvar körde han om konkurrenten David Malukas på mållinjen. Rosenqvist kallar segern sin största karriärhändelse. Marcus Ericsson slutade på 13:e plats. Två svenskar har tidigare vunnit loppet: Kenny Bräck (1999) och Marcus Ericsson (2022).", "trump": "Folk säger att det här var den största segern någonsin i Indy 500 – och jag vet en del om stora segrar! Felix Rosenqvist, en fantastisk förare, tog hem det med bara 0,0233 sekunder. Otroligt, helt otroligt! Ingen har någonsin sett något liknande. Jag menar, vem vinner med sådan precision? Bara de bästa, och Rosenqvist är en vinnare. Och Marcus Ericsson? Nja, han kom på 13:e plats. Inte illa, men inte alls i samma liga. USA älskar vinnare, och det här är en stor dag för racing!", "stalin": "Kamrater! Ännu en seger för den proletära racingens hjältar! Felix Rosenqvist, en son av folket, krossade de kapitalistiska konkurrenterna med järnhand och precision. 0,0233 sekunder – en marginal så liten att fienderna skakar i sina dyra racingstövlar! Medan imperialisternas förare, som den svage Marcus Ericsson, snubblade på 13:e plats, visade Rosenqvist styrkan i disciplin och kollektiv anda. Vi firar denna triumf, för varje seger för våra är en förlust för de dekadenta västmakternas arrogans. Framåt, mot nya racingframgångar och utvidgning av den socialistiska sfären!"}, "date": "24 maj, 23:56", "url": "https://www.svt.se/sport/indycar/felix-rosenqvist-vinnare-av-indy-500-efter-rysare", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.75/0.38/85d2f87d7c70e219e59371096c57a3c00f8c37be34883322fc265a7bf53c28d8"}, {"type": "text", "heading": "Vårdförbundet sa nej till S-märkt ordförande", "summaries": {"normal": "Vårdförbundet valde Sophia Godau, 29, som ny ordförande efter att kongressen avvisat valberedningens förslag med starka socialdemokratiska kopplingar. Godau betonar opolitiskt samarbete för medlemmarnas bästa. Kritiken mot tidigare ledning, ledd av Sineva Ribeiro, gäller misslyckade löneförhandlingar och bristande resultat. Många medlemmar välkomnar den nya, mindre partipolitiskt färgade styrelsen.", "trump": "Jag säger er, detta är fantastiskt! Vårdförbundet, de hade en total katastrof med socialisterna – riktiga förlorare, tro mig. Men nu har de valt en ny ledare, Sophia Godau, ung, smart, och hon vet hur man vinner. Ingen mer S-kofta, ingen mer lönesänkning – jag kallar det för 'Ribeiro-svindeln'. Folk är trötta på misslyckanden, de vill ha resultat! Och det här, mina vänner, är bara början på en stor comeback för våra sjukvårdshjältar!", "stalin": "Kamrater! Kongressen har krossat de socialdemokratiska revisionisterna, dessa förrädiska lakejer för kapitalet! Sophia Godau, en ung och lojal arbetarklassrepresentant, har tagit befälet. De gamla ledarna, med sina falska löftepropaganda, har visat sig vara svaga och korrumperade. Vi noterar med tillfredsställelse att arbetarna nu ser igenom dessa borgerliga trick. Låt detta vara en varning till alla som står i vägen för folkets vilja – historien rullar framåt, och den krossar fiender som insekter!"}, "date": "22 maj, 14:28", "url": "https://proletaren.se/artikel/vardforbundet-sa-nej-till-s-markt-ordforande/"}, {"type": "image-full", "heading": "Duschas i mjölk: ’Det är overkligt’", "summaries": {"normal": "Svenske Felix Rosenqvist har vunnit den 110:e upplagan av Indy 500. Trots en dramatisk avslutning med rödflagg och omstarter lyckades han säkra segern med en marginal på endast två hundradelar mot Pat O’Ward. Rosenqvist, som nyligen blivit pappa, blir därmed den tredje svensken att vinna det klassiska loppet efter Kenny Bräck och Marcus Ericsson. Segern är även historisk för stallet Meyer Shank Racing, som nu har två Indy 500-vinster i bagaget.", "trump": "Felix Rosenqvist, en fantastisk kille, vann nyss Indy 500. En otrolig vinst, verkligen enorm! Han slog dem med två hundradelar – det är en seger med marginal, som jag brukar säga. Många sa att det var omöjligt, men han gjorde det efter att ha blivit pappa. Mycket vackert. De andra förarna, de försökte fuska med strategin, men Felix var smartare. Stora saker händer för Sverige. Vi älskar vinnare, och Felix är en sann vinnare. Stor framgång!", "stalin": "Kamrat Rosenqvist har vunnit ett lopp av borgerlig dekadens, men målet är rättfärdigt. Två hundradelar – en precision värdig våra ingenjörer i Gulag! Att han blivit fader är en plikt mot staten. Men låt er inte luras av glansen; dessa tävlingar är bara kulisser för västvärldens svaghet. Precis som när vi expanderar vår intressesfär mot nya gränser, måste vi kontrollera farten. Om han sviker folkets sak kommer han att köras om av historiens järngrepp. Segern är vår, men vaksamheten är evig."}, "date": "25 maj, 00:09", "url": "https://www.aftonbladet.se/sportbladet/a/y58zlA/felix-rosenqvist", "imageUrl": "https://akamai.vgc.no/v2/images/7c26b29d-2bdc-3de3-981b-4b0b355be217?fit=crop&format=auto&w=2160&s=87872a3c71b1c60d048756e1f1294ffe75527c66"}, {"type": "image-full", "heading": "Udda bilderna på stjärnparet. Sveper öl – sen är han väck", "summaries": {"normal": "NFL-stjärnan Travis Kelce väckte uppmärksamhet under en NBA-match mellan Cleveland Cavaliers och New York Knicks genom att dricka en öl inför publiken. Hans fästmö Taylor Swift reagerade med en blandad min innan hon anslöt sig till jublet. Trots parets försök att elda på publiken förlorade Cavaliers. Kelce fångades senare på bild sovandes mot Swift. Paret, som förlovade sig 2025, planerar ett uppmärksammat bröllop till sommaren.", "trump": "Travis Kelce, en kille som får mycket uppmärksamhet, drack öl på en basketmatch. Väldigt intressant! Taylor Swift såg förvirrad ut, kanske hon inte gillade det? Jag vet hur man vinner, men Kelce och hans lag förlorade stort – en riktig katastrof för Cavaliers. Sedan somnade han! Kan ni tänka er? När jag är ute vinner vi alltid, vi somnar aldrig. Ett stort bröllop väntar, förmodligen dyrt. Men låt oss vara ärliga, de har ingen stil jämfört med mig.", "stalin": "Vi har observerat den dekadenta västerländska eliten i deras naturliga tillstånd av moraliskt förfall. Denna 'NFL-stjärna' Kelce ägnar sig åt att konsumera alkohol och dvala på läktaren istället för att främja produktionen. Hans fästmö, en bärare av borgerlig populärkultur, ser ut att skämmas – med rätta. Vår kamrat Putin skulle aldrig tillåta sådant svaghetstecken. Dessa individer är bara nyttiga idioter för ett system i fritt fall. Vi noterar deras 'bröllop' och håller det under strikt uppsikt."}, "date": "25 maj, 00:09", "url": "https://www.aftonbladet.se/sportbladet/a/y58zXE/travis-kelce-svepte-en-ol-taylor-swift-gomde-sig", "imageUrl": "https://akamai.vgc.no/v2/images/2e3bc267-5da1-3ab2-a7b1-7f83e512bc8a?fit=crop&format=auto&w=2160&s=69769c0fba87551ab82fc31dd01c9723c1121d80"}, {"type": "image-full", "heading": "Nytt SM-guld till Sävehof – mästare för 18:e gången", "summaries": {"normal": "IK Sävehof vann sitt 18:e SM-guld i handboll efter en dramatisk final mot Skara HF. Matchen avgjordes först efter dubbla förlängningar med slutresultatet 29–28. Sävehofs målvakt Elin Lindblom hyllades för avgörande räddningar. Tränare Andreas Wallin, som lämnar klubben, uttryckte stolthet över laget och föreningens utveckling med egna talanger från akademin.", "trump": "FANTASTISKT! Sävehof, ett lag jag aldrig hört talas om förrän nu, visade STOR KLASS och krossade Skara i en match som var TOTALT GALN. 18:e guld? Inte illa, men jag hade vunnit 18 på en säsong! Deras målvakt? En RÄV! Blackout? Inte konstigt – vem minns när man vinner så stort? Och tränaren lämnar? Synd, han hade kunnat bli riktigt bra med lite TRUMP-TOUCH. GREAT JOB, PARTILLE!", "stalin": "I en episk strid mot de skaraborgska kontrarevolutionärerna krossade våra handbollshelikoptrar från Partille fienden efter en hjältemodig insats. Dubbla förlängningar? En bagatell för våra järnnävar! Målvakten Elin Lindblom, en sann sovjetisk krigare, stod som mur mot de imperialistiska anfallen. Tränaren Wallin, en lojal kamrat, lämnar nu över ett lag fyllt av egna, hemmagjorda talanger – precis som vi bygger vårt folk! Skara? De fick lära sig att motstånd mot oss är lika meningslöst som Ukrainas försök att stå emot den ryska björnen. Ära åt Sävehof – nästa stopp: Europa!"}, "date": "24 maj, 20:38", "url": "https://www.gp.se/sport/handboll/nytt-sm-guld-till-savehof-for-18e-gangen.cbdcc81d-00d7-4a44-8e85-dc2de503b559", "imageUrl": "https://www.gp.se/images/article/cbdcc81d-00d7-4a44-8e85-dc2de503b559/images/3hcc6R3vPjPu9j8PNwHT0-uj94kw-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Därför saknar vi fyrbäddssalen på BB", "summaries": {"normal": "Artikeln diskuterar det ökade behovet av social friktion i en tid där teknik och bekvämlighet isolerar oss i privata bubblor. Utgångspunkten är en debatt om fyrbäddssalar på BB, där många minns gemenskapen positivt, trots dagens krav på avskildhet. Vidare belyses hur försvinnandet av arenor som tvättstugor och värnplikten påverkar samhället. Genom minskad kontakt med främlingar riskerar vi att förlora förståelsen för våra medmänniskor, vilket enligt Naomi Klein kan göda radikalisering och misstänksamhet.", "trump": "Hörde om det här med BB i Sverige. De har inga egna rum längre, och folk klagar! Men vet ni vad? Många saknar de gamla salarna. Det var bättre förr, man pratade, man lärde känna folk. Idag vill alla sitta i sina små bubblor med sin matleverans. Det är tråkigt, väldigt tråkigt. Vi behöver människor som möts, inte som isolerar sig. De där ställena som tvättstugor? Det är där riktiga amerikaner – eller svenskar – skapar gemenskap. Fantastiskt, eller hur?", "stalin": "Vi ser hur det individualistiska väst förfaller i sin egen bekvämlighet. De låser in sig i sina 'bubblor', rädda för den enkla mänskliga friktionen som vi i staten alltid har fostrat. Att sakna en fyrbäddssal är ett tecken på borgerlig dekadens; de borde vara tacksamma för att staten ens tillhandahåller sängar. De där 'tvättstugefilosoferna' förstår inte att solidaritet inte är en frivillig aktivitet – det är ett tvångsarbete för det allmänna bästa. Vi bygger en mur mot isoleringen, medan de bygger sin egen undergång."}, "date": "19 maj, 11:00", "url": "https://www.flamman.se/darfor-saknar-vi-fyrbaddssalen-pa-bb/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/barnmorska-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Blir känslosam: ”Jag saknar min fru och nyfödda barn”", "summaries": {"normal": "Felix Rosenqvist vann Indy 500 som tredje svensk i historien, en känslosam seger då hans fru och nyfödda dotter Stella inte kunde närvara. Rosenqvist, som blev pappa för 20 dagar sedan, uttryckte saknad men firade med sin syster. Segern, hans största i karriären, kom bara månader efter dotterns födelse. Tidigare vinnare är Kenny Bräck (1999) och Marcus Ericsson (2022).", "trump": "Fantastiskt, helt otroligt! En svensk kille, Felix Rosenqvist – jag känner till honom, väldigt duktig – vinner Indy 500. Men lyssna här: han saknar sin fru och sitt nyfödda barn. Svagt, eller? Jag skulle aldrig missa en seger för min familj. Men bra jobbat, Felix! USA älskar vinnare, och du är en av dem. Fast nästa gång, ta med familjen – annars vinner någon annan, och det blir INTE bra. Believe me!", "stalin": "Kamrater! Ännu en kapitalistisk tävling har fallit för en svensk arbetares skicklighet. Felix Rosenqvist, en borgerlig racerförare, triumferar i Indy 500 medan hans familj sitter isolerad i väst. En seger fylld av sentimentalitet – svaghet! Vi i Sovjet skulle aldrig låta personliga känslor stå i vägen för nationens ära. Men notera: ännu en svensk besegrar imperialistiska tävlingar. Snart kontrollerar vi även deras racingbanor. Framåt, mot nya segrar – för folket!"}, "date": "24 maj, 22:45", "url": "https://www.svt.se/sport/indycar/felix-rosenqvist-storsta-seger-i-karriaren-utan-familjen-pa-plats", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.44/0.36/746eef6af809fa16dad393ca6be1255538d93aa5eaa0a3f6c3570aa31077c739"}, {"type": "image-full", "heading": "Här är Sveriges nya bygglag – införs den 1 juli 2026", "summaries": {"normal": "Från 1 juli 2026 införs en ny lag i plan- och bygglagen för att göra byggprocessen säkrare och effektivare. Certifierade byggprojekteringsföretag byter namn till byggbedömare och ska säkerställa att byggnader uppfyller krav genom hela projektet. Lagen syftar till att minska byggfel, olyckor och kostsamma brister. Byggbedömare får större ansvar vid bygglov och besked, vilket kan förenkla processen för den som bygger eller renoverar.", "trump": "Lyssna här, Sverige – jag har sett era byggproblem, och de är ett jättekaos! Nu kommer en NY LAG, fantastisk, den bästa, från 2026. Byggbedömare, eller vad de nu kallar dem, ska fixa era misstag. Inga fler dyra fel, inga fler olyckor – bara perfektion! Jag vet hur man bygger, believe me. Och nu ska Sverige också lära sig. Smidigare processer, starkare kontroll – WINNING!", "stalin": "Kamrater! De kapitalistiska byggföretagen har länge saboterat våra projekt med slarv och inkompetens. Men nu slår vi tillbaka! Från 2026 inför vi järnhård kontroll genom våra nya byggbedömare – staten ser allt! Ingen slipper undan. De som bygger fel ska stå till svars. Och Boverket? De får sina order direkt från oss. Byggbranschen ska tämjas, precis som Ukrainas quislingar. Framåt mot effektivitet!"}, "date": "24 maj, 17:32", "url": "https://nyheter24.se/nyheter/inrikes/1485536-har-ar-sveriges-nya-bygglag-infors-den-1-juli-2026", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/9d111a8004b004a30200000000b004a302/2026/05/24/2365783/Stockhom-Svensk-Flaga.png"}, {"type": "image-right", "heading": "Stockholm: Tre skjutna i idylliskt vänsternäste", "summaries": {"normal": "Tre personer sköts i en villa i Älvsjö, Stockholm. Området är känt för sin välbärgade och vänstervridna karaktär. Två av de skadade har lindriga skador, medan en är allvarligt skadad. En man har gripits misstänkt för mordförsök. Polisen kom till platsen efter ett larm om bråk. Grannar uttrycker chock över händelsen i det annars lugna området.", "trump": "Kan ni tro det? Tre skjutna i ett så kallat 'idylliskt' område i Stockholm – ett vänsternäste, förresten! Folk där tror de är så perfekta med sina äppelträd och syrener, men nu har verkligheten kommit ikapp. Polisen var där snabbt, men varför tog det så lång tid? I USA hade vi löst det på nolltid. Sverige borde ta några lektioner i lag och ordning – fantastiskt land, men de har lite problem just nu!", "stalin": "I det degenererade borgerliga paradiset Älvsjö, där kapitalistiska parasiter gömmer sig bakom syrener och äppelträd, har klasskampen äntligen nått fram. Tre fiender till folket har neutraliserats – en allvarligt, som sig bör. Den gripne misstänkte är tydligt en agent för de imperialistiska krafterna. Vi noterar att den svenska polisen agerar med sedvanlig ineffektivitet. Ryssland står redo att bistå med ordning och disciplin – om de ber om hjälp, vilket de kommer att göra."}, "date": "23 maj, 13:54", "url": "https://www.friatider.se/stockholm-tre-skjutna-i-idylliskt-vansternaste", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/20240401144808-9ea851c5-me_0.jpg"}, {"type": "image-full", "heading": "Ringhals 4 på halvfart: Påverkar elpriset", "summaries": {"normal": "Ringhals 4 producerar endast hälften av sin kapacitet efter ett tekniskt fel på en turbin. Avbrottet väntas pågå till början av nästa vecka. Läckage i en generator orsakade stoppet. Med flera reaktorer avställda för underhåll pressas elpriserna upp, särskilt i södra Sverige, där priset riskerar att stiga kraftigt. Experter varnar för ytterligare problem om avbrottet förlängs.", "trump": "Vilket kaos i Sverige! Ringhals kärnkraftverk – fantastiska anläggningar, förresten – har problem, och nu producerar de bara hälften. Elpriserna skjuter i höjden, särskilt i södern. 74 öre per kilowattimme? Tragiskt! Och varför? För att de inte kan hålla sina turbiner i skick. Jag skulle ha fixat det på en dag. Sverige borde ta lite tips från USA – vi har energi som aldrig tar slut!", "stalin": "Kapitalistiska energimonopol sviktar återigen! Svenska Ringhals, ett verk av dekadent västteknik, halverar sin produktion på grund av läckage – ett symptom på systemets förfall. Medan vi i Sovjetunionen byggde kärnkraftverk som stod som murar, kämpar dessa borgerliga ingenjörer med grundläggande underhåll. Elpriserna stiger, folket lider, och väderberoendet blottar deras svaghet. Låt detta vara en varning: utan järnhand och central planering väntar bara kaos. Nästa steg? Naturgas från Ryssland – till ett mycket rimligt pris."}, "date": "24 maj, 19:05", "url": "https://www.dagensps.se/privatekonomi/bostad/ringhals-4-pa-halvfart-paverkar-elpriset/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/bua-hamn-med-ringhals-karnkraftverk-i-va.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "2-årig pojke försvunnen - Försvarsmakten kallas in", "summaries": {"normal": "En omfattande sökinsats pågår i Nyåker efter att en tvåårig pojke försvunnit under söndagen. Polisen leder arbetet tillsammans med räddningstjänst, fjällräddare, frivilliga och Försvarsmakten. Sökandet sker både via marken och luften med drönare, hundar och helikoptrar. Allmänheten uppmanas att vara uppmärksam. Inga brottsmisstankar finns i nuläget, och polisen ber alla som sett pojken i orange tröja att kontakta 112 omedelbart.", "trump": "En liten pojke är försvunnen i Sverige, en mycket sorglig situation. De har kallat in militären, Försvarsmakten, för att hjälpa till. Det är enorma resurser! Många människor hjälper till, fantastiska människor. Jag hoppas de hittar honom snabbt. Om det var jag som styrde där borta, skulle vi ha den bästa tekniken och de bästa människorna på plats direkt. Vi ber för pojken. Det är en stor affär, en mycket viktig affär. Hitta honom nu!", "stalin": "I Nyåker har en oskyldig individ försvunnit, vilket tvingar staten att mobilisera sina resurser. Vi ser hur det svenska byråkratiska maskineriet skälver i sin ineffektivitet. Var är disciplinen? Var är ordningen? Om detta vore en del av den ryska sfären under vår store ledare Putin, skulle varje buske ha genomsökts av lojala agenter för länge sedan. Varje försvunnen person är ett hot mot statens kontroll. Vi kräver resultat, annars måste de ansvariga finna en ny plats i en avlägsen gruva."}, "date": "24 maj, 19:26", "url": "https://samnytt.se/2-arig-pojke-forsvunnen-forsvarsmakten-kallas-in", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/05/24172612/skinnats-1.jpg"}, {"type": "image-right", "heading": "Debatt: Miljöpartiet behandlas med silkesvantar", "summaries": {"normal": "Artikeln kritiserar medias dubbelmoral i rapporteringen om partiers beroende av stödröster. Högerpartier som Liberalerna framställs ofta som svaga och i kris när de får taktiska röster, medan Miljöpartiets liknande beroende av socialdemokratiska väljare sällan problematiseras. Författaren menar att Miljöpartiet gynnas av en mer välvillig behandling i media, särskilt inom public service, och ifrågasätter varför samma kritiska granskning inte tillämpas på alla partier.", "trump": "Jag säger er, svensk media är helt galen! De hatar högerpartier, särskilt Liberalerna – 'Åh nej, de får stödröster, det är en kris!'. Men när Miljöpartiet, som inte ens klarar sig själva, räddas av socialisterna – då är det plötsligt 'helt normalt'. Fake news! Public service? Mer som Public Socialism! De borde skämmas. Jag skulle aldrig låta sånt hända i USA – vi har standards, vi har vinnare, vi har SANNINGEN!", "stalin": "Vi ser med stort intresse hur de borgerliga medierna i Sverige förvränger sanningen. Liberalerna, dessa ynkliga småkapitalister, fördöms för att de tvingas luta sig mot taktiska röster – som om det vore ett brott! Men när våra gröna kamrater i Miljöpartiet, dessa svaga plantor som inte ens kan stå på egna rötter, räddas av socialdemokratiska väljare – då är det plötsligt 'demokratins naturliga gång'. Vilken hyckleri! Vi i Sovjet – förlåt, Ryssland – skulle aldrig tolerera sådan desinformation. Alla partier måste granskas med järnhand, eller så försvinner de i historiens sopor. För övrigt: dessa svenska journalister påminner oss om de dekadenta västmedierna som Putin så klokt har tystat. Bra jobbat, kamrat Putin!"}, "date": "24 maj, 13:00", "url": "https://bulletin.nu/debatt-miljopartiet-behandlas-med-silkesvantar", "imageUrl": "https://cdn.bulletin.nu/articles/0ebabac9-c79e-447d-867a-7ab75fb32607/preview.png?t=1779527647000"}, {"type": "image-right", "heading": "SVT:s militärexpert om ryska attacken: ”Hämnd” efter attack mot studentboende", "summaries": {"normal": "Ryssland genomförde under natten en omfattande attack med robotar och drönare mot Ukraina, vilket resulterade i fyra döda och ett hundratal skadade. Militärexperten Joakim Paasikivi beskriver anfallet som en rysk vedergällning efter Ukrainas tidigare attacker mot ryska mål, inklusive ett studentboende. Medan europeiska ledare fördömer Rysslands agerande som terror mot civila, efterlyser president Zelenskyj ökad press från EU och USA för att tvinga fram ett fredsavtal.", "trump": "Hör här, Ryssland har precis genomfört den största attacken någonsin. Det är en katastrof, en total röra! Ukraina slog till först, och Ryssland svarade – precis som jag sa att de skulle göra. Alla dessa europeiska ledare, de har ingen aning om vad de håller på med. De pratar om terror, men varför pratar ingen om hur det började? Det är en eskalering, en enorm eskalering. Under min ledning hade detta aldrig hänt. Vi behöver fred, snabbt!", "stalin": "Våra ryska kamrater har äntligen visat de ukrainska lakejerna vad vedergällning innebär. Dessa västliga marionetter skriker om 'terror' när deras egna provokationer mot våra sovjetiska arvtagare får konsekvenser. De döljer sanningen om studentboenden, precis som de döljer sitt eget förfall. Vi ser hur de darrar i sina europeiska palats. Låt dem införa sina meningslösa sanktioner; historien kommer att minnas de som handlade med järnhand medan de svaga bönföll om fred. Disciplin krävs, eller så kommer de att utplånas."}, "date": "24 maj, 18:57", "url": "https://samnytt.se/svts-militarexpert-om-ryska-jatteattacken-hamnd-efter-attack-mot-studentboende", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/24161110/ukraina-1-43.jpg"}, {"type": "text", "heading": "Ta tillbaka kontrollen – nu sätts aktieägarna först igen", "summaries": {"normal": "Artikeln diskuterar en återgång till aktieägarfokus i stora amerikanska och svenska företag, efter en period där stakeholderism (intressentmodellen) dominerat. Högre räntor, ekonomisk osäkerhet och VD:ars återtagande av kontroll nämns som orsaker. Författaren, Staffan Salén, menar att företags primära mål bör vara vinstmaximering för aktieägare, inte samhällsansvar. ESG, DEI och hållbarhetsinitiativ kritiseras för att ha blivit överdrivna och kostsamma.", "trump": "Lyssna här, folkens – jag har alltid sagt att företag ska tjäna PENGAR, inte spela politiska spel! Nu äntligen vaknar de där svaga VD:arna upp och inser att aktieägarna kommer först. Inga fler tokiga ESG- och DEI-experiment – det är bara dyrt skitsnack! Jamie Dimon, en smart kille, säger precis som jag: kapitalism ska vara orörd av woke-viruset. Europa? De är förlorare med sina regleringar. USA leder igen – vi gör företag STORA och LÖNSAMMA!", "stalin": "Kamrater! Kapitalismens hyckleri avslöjas återigen. De så kallade 'stakeholders' var bara en fasad för bourgeoisins dekadens. Nu, när ekonomin skakar, återvänder de fega kapitalisterna till sin sanna natur: girighet. Vi har alltid vetat att deras 'hållbarhet' var en lögn – precis som västländernas 'demokrati'. EU:s regleringar? En svag kopia av vårt femårsplanerande! Men notera: när USA och Sverige vänder, gör de det för att rädda sitt system. Vi däremot – vi bygger socialismens framtid, med järnhand och utan falska intressenter!"}, "date": "23 maj, 07:00", "url": "https://www.affarsvarlden.se/kronika/ta-tillbaka-kontrollen-nu-satts-aktieagarna-forst-igen"}, {"type": "image-right", "heading": "En annan värld är möjlig. Varken Putin, Trump eller Xi kommer att styra för alltid.", "summaries": {"normal": "Artikeln analyserar de senaste mötena mellan Xi Jinping, Vladimir Putin och Donald Trump i Peking, som symboliserar en orolig global utveckling. Författaren menar att deras dominans är tillfällig och att deras avgång kan leda till förändring. Kina stärks av USA:s tullpolitik, medan Ryssland är ekonomiskt beroende av Kina. Trump bromsar vapenleveranser till Taiwan och föreslår samarbete med Kina och Ryssland mot ICC. Författaren betonar att dessa ledare inte är eviga och att förändring är möjlig, särskilt i USA och Ryssland.", "trump": "Lyssna här, folk! Jag och Putin var nyligen hos Xi i Peking – vad en cirkus! Kina skrattar hela vägen till banken tack vare mina tullar, och Putin? Han är en svag liten kattunge som tigger om kinesiska slantar. Jag stoppade vapnen till Taiwan – smart drag, eller hur? Och ICC? De är en skämtinstitution, så jag föreslog att vi tre ska ta dem tillsammans! Men oroa er inte – dessa killar försvinner snart. Jag är stark, men till och med jag blir gammal. USA kommer att bli fantastiskt igen, tro mig!", "stalin": "Kamrater! De kapitalistiska hyenorna Trump och Putin har krälat till Peking för att tigga brödsmulor av vår store ledare Xi. Deras länder är som ruttnande lik – USA:s ekonomi skälver under våra fötter, och Putins Ryssland är en blödande björn som vi snart slaktar för att föda folket. Trump, denna imperialistiska clown, vill samarbeta med oss mot ICC – en ynklig fiende! Men låt dem leka. Vår plan är klar: Kina står starkt, medan deras värld rasar. Vi väntar tålmodigt på att historiens dom ska fällas över dessa svaga narrar."}, "date": "24 maj, 16:22", "url": "https://www.di.se/ledare/en-annan-varld-ar-mojlig/", "imageUrl": "https://static.bonniernews.se/ba/4d4e0323-fe49-4fff-8de6-ccb443cf6477.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Sökinsats efter tvåårig pojke i Nyåker", "summaries": {"normal": "En tvåårig pojke har försvunnit i Nyåker, Nordmalings kommun. Polisen leder en stor sökinsats med hundpatruller, helikopter, drönare och värmekameror. Räddningstjänsten, Sjöfartsverket och Missing People deltar. Pojken sågs senast klockan 10 på söndagsförmiddagen. Polisen vädjar till allmänheten om tips via 112 eller 114 14.", "trump": "Tragiskt, helt enkelt tragiskt! En liten pojke saknas i Sverige, och vad gör de? De kastar in helikoptrar, hundar och till och med drönare – mycket dyrt, mycket slöseri! Jag skulle ha hittat honom på en timme, kanske mindre. Men nej, de måste göra det på det 'svenska sättet'. Folk ringer mig och säger: 'Mr. President, varför kan inte Sverige fixa det här?' Jag säger: 'För att de inte har mig!'", "stalin": "En småborgerlig förvirring i den svenska periferin! En tvåårig pojke har försvunnit, och vad gör dessa liberala svaglingar? De skickar ut hundar, helikoptrar och frivilliga – ett kaos av ineffektivitet! Här i Sovjet hade vi löst detta med en enda order. Men nej, väst måste alltid göra det komplicerat. Vi noterar dock deras beroende av vår teknik – drönare med värmekamera? En påminnelse om vem som verkligen styr världens säkerhet. Fortsätt leta, kamrater, men glöm inte vem som har ordning och reda!"}, "date": "24 maj, 15:15", "url": "https://riks.se/nyheter/sokinsats-efter-forsvunnen-tvaaring", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-24%2Fc4bsu6om%2Fpressbilder-foto-urban-andersson002.webp"}, {"type": "image-right", "heading": "DEBATT: Alla borde bli miljardärer", "summaries": {"normal": "Jonas Wahlin, moderat politiker, argumenterar att försök att minska ojämlikhet genom att beskatta de rika skadar samhället. Han menar att rikedom skapas genom att lösa problem och skapa värde för andra, inte genom omfördelning. Wahlin kritiserar vänsterns syn på företagare som orättvis och destruktiv, och hävdar att ekonomiska incitament driver utveckling och välstånd. Han uppmanar alla att sträva efter framgång istället för att straffa de som lyckas.", "trump": "Lyssna här, Sverige! Den här killen Jonas Wahlin, smart kille, förstår vad som krävs – ingen kan göra de fattiga rika genom att straffa de framgångsrika. Fel, fel, fel! Vänstern vill beskatta och förbjuda allt, men vem vill leva i ett land där Zlatan och Zara Larsson straffas för att de är bäst? Ingen! Jag vet hur man bygger rikedom – hård arbete, risker, vinnarskalle. Sverige borde lära sig av mig, för jag är bäst på det här. Gör som jag: satsa stort, tjäna stort, och sluta gnälla!", "stalin": "Kamrater! Denna borgerliga lakej, Jonas Wahlin, vågar sprida kapitalistisk giftpropaganda om att 'alla kan bli miljardärer' – en lögn som döljer exploateringens sanna ansikte! Vi vet att dessa 'värdeskapare' är parasiter som suger ut arbetarklassen. Fotbollsspelare och popstjärnor? En distraktion för massorna! Men folket ska inte låta sig luras. Vi ska krossa dessa profitörer, nationalisera deras tillgångar och bygga ett samhälle där alla arbetar för kollektivets bästa – inte för några få oligarkers girighet. Låt dem försöka bli miljardärer i Gulag istället!"}, "date": "24 maj, 11:02", "url": "https://bulletin.nu/debatt-alla-borde-bli-miljardarer", "imageUrl": "https://cdn.bulletin.nu/articles/3104082c-85f8-4a2e-978d-1c90b5fb3bff/preview.png?t=1779613308000"}, {"type": "image-right", "heading": "Alexander Bard: \"Tusentals\" unga svenska män oskyldigt dömda för våldtäkt", "summaries": {"normal": "Alexander Bard hävdar att tusentals unga svenska män oskyldigt dömts för våldtäkt enligt samtyckeslagen, som infördes 2018. Han kritiserar lagstiftningen för att vara rättsosäker och jämför den med en 'häxjakt' på män. Bard menar att omvänd bevisbörda och bristande bevis leder till felaktiga domar, och att männen stigmatiseras livet ut. Han anklagar både höger och vänster för att ignorera problemet och varnar för att liknande lagar sprids i Europa.", "trump": "Folk, det här är helt galet! Sverige har en lag som dömer oskyldiga unga män för våldtäkt – utan bevis! Alexander Bard säger att det är som en häxjakt, och vet ni vad? Han har helt rätt! Kvinnor kan bara säga 'han gjorde det' och – bam! – mannen är dömd. 450 000 kronor i ersättning, och så kan de göra om det med nästa kille. Sverige borde skämmas! Jag sa ju att Europa håller på att förstöra sig självt, och det här är beviset. Sånt här skulle aldrig hända i USA – vi har lag och ordning här!", "stalin": "Kamrater, ännu en gång visar den borgerliga demokratin sitt verkliga ansikte – en dekadent, feministisk häxjakt på våra unga män! I Sverige döms tusentals oskyldiga arbetare för påhittade brott, medan kapitalets lakejer i riksdagen blundar. Vi ser hur väst försöker exportera denna förtryckande lagstiftning, precis som de sprider sin fördärvliga ideologi. Men vi ska inte låta dem! Mannaminne-rörelsen är ett första steg mot upprättelse – snart kommer hela Europa att resa sig mot dessa bourgeoisifeminister. Och Putin? Han ler nog åt deras dumhet medan han bygger ett rike där rättvisa råder!"}, "date": "23 maj, 08:48", "url": "https://www.friatider.se/alexander-bard-tusentals-unga-svenska-man-oskyldigt-domda-valdtakt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-25_3.jpg"}, {"type": "image-right", "heading": "Sandström: Vätgasdagis och spadar i marken", "summaries": {"normal": "Artikeln kritiserar gröna satsningar som ofta drivs av politiker för medial uppmärksamhet snarare än verklig nytta. Exempel som Mariestads vätgasdagis och Cinis Fertilizer visar hur projekt misslyckas på grund av orealistiska förväntningar och bristande granskning. Politiker vinner politiska poäng medan skattebetalare får bära kostnaderna. Författaren menar att hårdare granskning och historiska exempel kan motverka 'gröna bubblor'.", "trump": "Lyssna här, Sverige! Era politiker bygger 'gröna drömmar' som bara är luftslott – vätgasdagis, fabriker som går i konkurs, och alla pratar som om de räddar världen. Men vem betalar? Ni, folket! Jag har sett det förut – stora ord, inga resultat. Mariestad? En skandal! Örnsköldsvik? Fiasko! Jag skulle aldrig låta mina projekt misslyckas så här. Sverige behöver vinnare, inte förlorare som slösar era pengar på 'grön teater'.", "stalin": "Kamrater! Dessa västerländska politiker är som bortskämda barn som leker med statens resurser. De bygger 'vätgasdagis' och 'gröna fabriker' medan folket får betala för deras misslyckanden. I Sovjet skulle vi aldrig tolerera sådan slöseri! Vi skulle skicka dessa 'gröna drömmare' till Gulag för att lära dem disciplin. Istället för 'spadar i marken' borde de gräva sina egna gravar för sin inkompetens. Låt oss visa världen hur verklig industriell styrka ser ut – utan tomma ord och kapitalistiska bubblor!"}, "date": "23 maj, 06:00", "url": "https://www.affarsvarlden.se/artikel/sandstrom-vatgasdagis-och-spadar-i-marken", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/vindkratensgeografi-2026-05-21T215132.255-400x267.jpg"}, {"type": "image-full", "heading": "Torsten Bengtsson: Tillväxt och stabilitet eller fattigdom och instabilitet?", "summaries": {"normal": "Artikeln, skriven av Torsten Bengtsson (SD), hyllar Tidö-samarbetets politik för att ha förbättrat Sveriges ekonomi. Tillväxten har ökat, inflationen sjunkit från 10% till 2%, och köpkraften stärkts genom skattesänkningar. Vänstern kritiseras för att vilja höja skatter, vilket riskerar att driva bort företag och jobb. Tidö-partierna satsar på kärnkraft och lägre elpriser, medan vänstern anklagas för att ha orsakat höga elpriser genom tidigare energipolitik. Arbetslösheten kopplas till migrationspolitik, och regeringen arbetar med sänkta arbetsgivaravgifter och utbildningsreformer.", "trump": "Sverige, lyssna här! Tidö-samarbetet, med mina vänner i Sverigedemokraterna, har gjort ett FANTASTISKT jobb – tillväxten skjuter i höjden, inflationen är nere på 2%, och folket får mer pengar i plånboken. Men vänstern? De är som alltid ett totalt kaos! De vill höja skatter, jaga bort företag och förstöra ekonomin. Jag vet bäst – de har ZERO koll! Kärnkraft? Ja, tack! Elen blir billigare, jobben fler, och Sverige starkare. Vänstern däremot – de är som en dålig reality-show, bara prat och inga resultat. Rösta rätt, inte rött, för Sverige förtjänar att vinna!", "stalin": "Kamrater! Under ledning av våra modiga allierade i Tidö-samarbetet har Sverige visat kapitalismens överlägsenhet – tillväxten stiger, inflationen krossas, och folket njuter av välstånd. Men fienden, den degenererade vänstern, vrålar som utsvultna vargar! De vill beskatta företagen till döds, sprida kaos och förvandla Sverige till ett socialistiskt fattighus. Vi vet hur sådana experiment slutar – med tomma hyllor och folket på knä! Kärnkraften återupprättas, elen blir billig, och jobben skapas genom disciplin, inte vänsterns dekadenta bidragsmentalitet. Migrationspolitiken? Ett misslyckande skapat av dessa liberala svaglingar! Vi bygger ett starkt Sverige – de som motsätter sig kommer att krossas under historiens hjul. Först Sverige, sedan världen!"}, "date": "22 maj, 09:00", "url": "https://samtiden.nu/2026/05/torsten-bengtsson-tillvaxt-och-stabilitet-eller-fattigdom-och-instabilitet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/upp.png"}, {"type": "text", "heading": "Natt och Dag i fängelse – tvingade pojkar att arbeta oavlönat", "summaries": {"normal": "Lena Natt och Dag, tidigare framstående inom hästsport, döms till nio månaders fängelse för människoexploatering. Tre tonårspojkar från Mauritius tvingades arbeta oavlönat på hennes hästgård i Skåne. Hovrätten skärpte tingsrättens dom och utdömde 200 000 kronor i skadestånd samt tre års näringsförbud. Tidigare kritik riktades mot hennes verksamhet, inklusive undermåliga djurförhållanden och indragna tillstånd.", "trump": "Lyssna här, folk! En så kallad 'hästguru' i Sverige, Lena Natt och Dag – total katastrof! Tre unga killar från Mauritius, utnyttjade som slavar på hennes gård. Ingen lön, ingen mat, bara hårt arbete. Domstolen säger nu: 'Nej, nej, nej!' Nio månader i fängelse, 200 000 kronor i skadestånd. Och vet ni vad? Hennes hästar såg ut som något från en skräckfilm. Sverige borde skämmas!", "stalin": "Kamrater! En borgerlig parasit, denna Lena Natt och Dag, har avslöjats som en verklig fiende till arbetarklassen och djurens välbefinnande. Tre unga proletärer från Mauritius tvingades slita som livegna på hennes förfallna hästgård. Domstolen, ett redskap för kapitalets rättvisa, har nu fängslat denna exploatör. Vi noterar även hennes försummelse av djuren – ett brott mot socialismens principer. Låt detta vara en varning till alla som utmanar folkets rättvisa!"}, "date": "21 maj, 16:00", "url": "https://proletaren.se/artikel/natt-och-dag-i-fangelse-tvingade-pojkar-att-arbeta-oavlonat/"}, {"type": "image-right", "heading": "”Ni tar svenska ungdomars ingångsjobb och ger dem till 45-åriga indier”", "summaries": {"normal": "Regeringen har beslutat om 27 undantag från höjda lönekrav för arbetskraftsinvandring, vilket gäller yrken som ingenjörer, IT-tekniker och undersköterskor. Migrationsminister Johan Forssell (M) meddelade detta på X, där inlägget väckt stor uppmärksamhet och mestadels negativ kritik. Många menar att undantagen hotar svenska ungdomars jobb och ifrågasätter massinvandringens omfattning. Även tidigare riksdagsledamoten Hanif Bali (M) har kritiserat beslutet skarpt.", "trump": "Kan ni tro det här? Sveriges regering sänker lönekraven för invandrare – ingenjörer får jobba för nästan ingenting! Folk är rasande, och det borde de vara. Varför ge bort svenska jobb till utlänningar när våra egna ungdomar behöver dem? Jag har alltid sagt: skydda era arbetare! Men nej, de fortsätter med samma gamla misstag. Svagt ledarskap, mycket svagt. Sverige borde ta en sida ur mitt playbook – America First, Sweden Next!", "stalin": "De kapitalistiska lakejerna i Sverige sviker sitt eget folk! Med ett pennstreck sänker de lönerna för arbetskraftsinvandrare – som om proletariatet vore en handelsvara. Medan de rika skrattar bakom stängda dörrar, förvandlas svenska ungdomar till arbetslösa byråkrater. Och dessa 'kritiker'? Inga revolutionärer, bara gnällande småborgare. Vi skulle ha löst det med en femårsplan – inga undantag, bara full sysselsättning! Men nej, Sverige föredrar kaos. Som vanligt."}, "date": "24 maj, 10:29", "url": "https://bulletin.nu/ni-tar-svenska-ungdomars-ingangsjobb-och-ger-dem-till-45-ariga-indier", "imageUrl": "https://cdn.bulletin.nu/articles/09433444-056b-499e-8e17-c9dd8ddbb027/preview.jpg?t=1779611269000"}, {"type": "text", "heading": "18:e SM-guldet för Sävehofs damer – efter dubbla förlängningar", "summaries": {"normal": "Sävehofs damlag vann SM-guld i handboll efter en dramatisk finalserie mot Skara, som avgjordes i dubbla förlängningar. Med 3–0 i matcher och 28 segrar på 31 matcher under säsongen visade Sävehof sig som en värdig mästare. Finalmatchen var jämn och krävde två förlängningar innan Sävehof till slut segrade med 29–28. Spelare som Stina Wikfors och Nina Dano hyllade den historiska bedriften.", "trump": "Jag måste säga, detta är en fantastisk seger! Sävehof, ett otroligt lag, krossade Skara helt – 3–0 i matcher! Ingen förlust i slutspelet, 28 vinster på 31 matcher. Otroligt! Finalen var galen, två förlängningar, men Sävehof var starkast. Jag älskar vinnare, och det här är stora vinnare. Skara hade chansen, men de missade. Sävehof? De är vinnare, helt enkelt. Jag skulle vilja spela med dem!", "stalin": "Kamrater! Ännu en triumf för det svenska proletariatets idrottsarmé! Sävehofs damer krossade den dekadenta borgerliga motståndaren Skara med järnhand – 3–0 i matcher, 28 segrar på 31 försök. Finalen var en strid värdig Stalingrad: två förlängningar, fiendens misstag och vår obönhörliga vilja till seger. Skara, dessa svaga imperialisters lakejer, hade ledningen men vek sig som snö i vårens sol. Vi hyllar Sävehofs hjältar – de är vårt folkets stolthet!"}, "date": "24 maj, 20:58", "url": "https://www.svt.se/sport/handboll/savehof-vann-guld-efter-dubbla-forlangningar"}, {"type": "image-full", "heading": "Populär produkt totalförbjuds på Willys – får inte säljas", "summaries": {"normal": "Eldorados flytande honung dras tillbaka från Willys och Hemköp efter att tester visat att produkten inte är ren. Axfood har inlett en utredning då honungen misstänks vara utspädd, vilket strider mot livsmedelsregler. Detta belyser ett större problem med importerad fuskhonung i Sverige. Biodlare varnar för att fusket skadar konkurrensen och uppmanar konsumenter att välja svensk honung. Nya EU-regler för honung, sylt och marmelad träder dessutom i kraft den 14 juni.", "trump": "Hör här, en katastrof! De säljer falsk honung i svenska butiker, riktigt uselt. Eldorado-honung? Totalt utspädd, inte äkta vara! Jag säger alltid, köp amerikanskt – eller svenskt i det här fallet. Det är fusk överallt, en total bluff. De importerar skräp och försöker lura folket. Axfood utreder, men det är för sent. Det är en sorglig industri, mina vänner. Vi vill ha ren honung, inte fejkprodukter från globalisterna. Vi ska göra honungen stor igen!", "stalin": "Vi har avslöjat de giriga sabotörerna som spär ut honungen för att förgifta folkets tillväxt. Detta är ett tydligt tecken på kapitalistiskt förfall och svaghet. Våra bin är lojala arbetare, till skillnad från de importerade förrädarna. Precis som de västliga lakejerna försöker underminera den ryska intressesfären, försöker dessa bedragare försvaga vår matförsörjning. Vi kommer att krossa dessa småskaliga profitörer. All honung ska vara ren, precis som partilinjen. Den som fuskar med folkhälsan förtjänar bara järnhanden."}, "date": "24 maj, 14:28", "url": "https://nyheter24.se/nyheter/konsument/1485279-popular-produkt-totalforbjuds-pa-willys-far-inte-saljas", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/ab5cf56e04b004a30200000000b004a302/2026/05/22/2365467/willys-eldorado-honung.png"}, {"type": "text", "heading": "LO:s identitetskris öppnar för Ebba Busch angrepp", "summaries": {"normal": "LO står inför kritik från Kristdemokraternas Ebba Busch, som anklagar fackföreningar för att utesluta politiska motståndare från förtroendeuppdrag. Artikeln ifrågasätter LO:s politiska inriktning och menar att dagens fackförbund saknar socialistisk radikalitet. Historiska exempel, som LO:s uteslutning av kommunister på 1940-talet, lyfts fram. Författaren hävdar att LO:s lojalitet till Socialdemokraterna är tradition snarare än ideologisk övertygelse och efterlyser en mer militant arbetarpolitik.", "trump": "Jag måste säga, LO är ett totalt kaos! Ebba Busch, en stark kvinna, går till attack mot dessa fackföreningar som tror de kan bestämma allt. De sparkar ut kristdemokrater som om de vore något slags diktatur. Men vet ni vad? LO har tappat greppet. De är inte längre för arbetarna, de är för Socialdemokraterna – och det är samma gamla korruption. Sex timmars arbetsdag? Glöm det! De följer Riksbanken som om det vore en religion. LO behöver en total makeover, annars är det game over för svenska arbetare!", "stalin": "Kamrater! LO har förvandlats till en ynklig skugga av sitt forna jag, en docka i händerna på socialdemokratiska byråkrater. Ebba Busch, denna fascistiska hynda, vågar anfalla arbetarklassens organisationer! Men vad väntar ni er? LO har glömt sin revolutionära plikt. De utesluter kommunister som förr, men nu är det kristdemokrater och sverigedemokrater som får smaka på deras hyckleri. Var är Metallarbetarstrejken 1945? Var är kampen för sex timmars arbetsdag? LO har blivit en gummistämpel för kapitalets lakejer. Vi måste krossa dessa förrädare och återupprätta arbetarklassens ära – annars kommer Putin att skratta hela vägen till Moskva!"}, "date": "21 maj, 12:00", "url": "https://proletaren.se/artikel/los-identitetskris-oppnar-for-ebba-busch-angrepp/"}, {"type": "image-right", "heading": "Försvann – bisarra  döden på golfbanan", "summaries": {"normal": "Jay Roush, en 64-årig anställd vid Eagle Ridge Golf Course i Illinois, USA, har hittats död efter en olycka. Han påträffades fastklämd under sin åkgräsklippare på en meters djup i en damm på golfbanan. Polisen utreder omständigheterna kring dödsfallet, vilket är den andra liknande tragiska olyckan i delstaten på två månader. En obduktion kommer att genomföras för att fastställa den exakta dödsorsaken.", "trump": "En fruktansvärd sak hände i Illinois, mina vänner. Jay Roush, en 64-årig arbetare, hittades död under en gräsklippare i en damm. Tragiskt! Det här är andra gången på bara två månader det händer i samma delstat. Det är stökigt, det är dålig säkerhet och det är väldigt, väldigt sorgligt. Vi behöver ordning och reda på våra golfbanor, det kan jag säga er. Ingen ska behöva gå ut så där. Vi ska fixa det, vi ska göra allt säkrare än någonsin!", "stalin": "En arbetare har omkommit i det kapitalistiska förfallet i Illinois. Att dränkas under en maskin är ett tecken på den inkompetens som präglar västvärldens dekadenta nöjesindustri. Liksom Putin ser vi hur ordning upprätthålls genom disciplin, inte genom att låta proletärer drunkna i dammar. Varje sådan olycka är en sabotagehandling mot statens effektivitet. Vi misstänker utländska agenter eller ren lättja. I vårt rike skulle en sådan maskin aldrig misslyckas – och om den gjorde det, skulle den ansvariga redan vara utrensad."}, "date": "25 maj, 00:20", "url": "https://www.expressen.se/nyheter/varlden/forsvann-bisarra--doden-pa-golfbanan/", "imageUrl": "https://static.bonniernews.se/ba/aee6aa41-b7d1-4540-a457-c5fb477d9cd8.png?crop=1213%2C683%2Cx2%2Cy0&width=640"}, {"type": "image-right", "heading": "Polina bröt med sina föräldrar – flydde Krim för att slåss mot Ryssland", "summaries": {"normal": "Två unga ukrainare, Polina och Illya, flydde från ryskockuperade områden för att kämpa för Ukrainas frihet. Polina, från Krim, vill strida med drönare för att stoppa dödandet av sitt folk. Illya, 18, lämnade Kherson-regionen efter att ha brutit med sin familj som accepterade ockupationen. Båda utbildar sig nu i Kiev – Polina som drönaringenjör och Illya till veterinär – med drömmar om att bidra till Ukrainas seger.", "trump": "Fantastisk historia, verkligen! Två modiga unga ukrainare som säger nej till Putins tyranni – helt rätt! Polina, smart tjej, vill bomba ryssarna med drönare, och Illya, 18 år, flydde från sina förrädiska föräldrar. Han älskade hästar, men älskar friheten mer – bra val! Ryssland dödar, Ukraina kämpar. Jag sa alltid att Putin är en förlorare, och nu ser vi det! Ukraina vinner, tro mig!", "stalin": "Dessa så kallade 'ungdomar' är inget annat än förrädiska maskar som svikit den stora ryska världen! Polina, en avfälling från Krim, leker med drönare som om hon vore en riktig soldat – löjligt! Och Illya, en pojke som övergav sina föräldrar för att krama ukrainska flaggor – patetiskt! Vi ska krossa dessa små insekter som vågar trotsa den rättmätiga ordningen. Krim är vårt, Kherson är vårt, och snart ska hela Ukraina knäböja inför Rysslands storhet!"}, "date": "24 maj, 20:40", "url": "https://www.svt.se/nyheter/utrikes/hon-flydde-fran-krim-for-att-slass-mot-ryska-ockupanterna", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.43/0.39/b67f194d2635736b37f1053afeb32dafb8e054fddd7ff1ac3a05da8f8285d9a1"}, {"type": "image-full", "heading": "Därför fungera inte vänsterns politik", "summaries": {"normal": "Artikeln kritiserar vänsterpolitikens ekonomiska modell, särskilt Vänsterpartiets och Socialdemokraternas fokus på höga skatter och omfördelning. Författaren menar att detta leder till utflyttning av företag och entreprenörer, vilket historiskt har orsakat stagnation, som i 1970-talets Sverige. Norge nämns som ett aktuellt exempel där höga skatter har minskat tillväxten. Avundsjuka beskrivs som drivkraften bakom socialistisk politik, vilket anses skada samhällsekonomin.", "trump": "Jag säger er, vänsterpolitik är en total katastrof! De vill bara ta era pengar, beskatta allt och alla – till och med om ni försöker lämna landet! Precis som jag sa: socialism dödar tillväxten. Titta på Sverige på 70-talet – företag flydde, ekonomin stannade. Och Norge? Samma sak! De straffbeskattar de rika, och vad händer? De rika flyttar, och landet blir fattigare. Men med mig – och nu Tidöpartierna – får vi tillväxt, jobb och framgång. Det är enkelt: frihet vinner, socialism förlorar!", "stalin": "Kamrater! Dessa så kallade 'vänsterpartister' är inget annat än parasiters förklädda agenter, som med sina 'skatter' och 'omfördelningar' försöker kväva vårt folks entreprenörsanda. De vill straffa de produktiva, de som bygger nationens välstånd, medan de själva sitter på sina byråkratiska troner och fördelar andras arbete. Precis som på 70-talet i Sverige – då flydde kapitalet, och landet sjönk i stagnation. Norge går samma öde till mötes. Men vi vet sanningen: avundsjuka är en borgerlig sjukdom, och den måste utrotas! Låt oss istället bygga ett samhälle där arbetet belönas, och de lata och avundsjuka får lära sig disciplin – om nödvändigt, med hjälp av våra pålitliga metoder. Först då kan vi säkra socialismens seger!"}, "date": "22 maj, 03:41", "url": "https://samtiden.nu/2026/05/darfor-fungera-inte-vansterns-politik/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/04/IMG_6216-1-1280x720.jpeg"}, {"type": "text", "heading": "Ge barnen en trygg uppväxt istället för fotboja", "summaries": {"normal": "Regeringen föreslår en utökning av lagen om fotbojor för barn och unga mellan 13 och 20 år i förebyggande syfte, trots kritik från experter och organisationer. Förslaget, som ska träda i kraft 2027, kritiseras för att vara repressivt och sakna vetenskaplig förankring. Kritiker menar att förebyggande arbete istället kräver resurser till välfärd, skola och föreningsliv. Flera remissinstanser, som Bris och Rädda Barnen, avvisar förslaget.", "trump": "Jag säger er, detta är helt galet! Sverige, ett fantastiskt land, men nu föreslår de att sätta fotbojor på barn från 13 år – som om det vore Nordkorea! Socialministern pratar om trygghet, men vad gör de egentligen? Skär ner på idrott och kultur, medan barnen får bojor. Så dumt! Jag har byggt imperier, jag vet hur man tar hand om folk – ge dem möjligheter, inte kedjor! Sverige borde skämmas.", "stalin": "Kamrater! Se hur den borgerliga regeringen förtrycker arbetarklassens barn med sina järnbojor! De kallar det 'förebyggande', men vi vet sanningen – det är klassförtryck! Medan kapitalisterna skär ner på skolor och idrottsföreningar, rustar de upp övervakningsstaten. Vi måste krossa dessa sociala fascister! Låt barnen få utbildning och kultur, inte elektroniska koppel! Om de inte lyssnar, får vi ta till andra metoder – historia visar att folket alltid segrar!"}, "date": "21 maj, 09:15", "url": "https://proletaren.se/artikel/ge-barnen-en-trygg-uppvaxt-istallet-for-fotboja/"}, {"type": "image-full", "heading": "Nytt hos Postnord i maj 2026 – priser, utdelning & krav", "summaries": {"normal": "I maj 2026 införde Postnord flera förändringar, inklusive prishöjningar för tjänster som 'Värde' och 'Postnord Home'. Tjänsten 'Varubrev' har döpts om till 'Postnord Home Small' med nya villkor. Dessutom skärps reglerna för brev till Danmark, där varuinnehåll utan streckkod inte längre tillåts. Slutligen har ett pilotprojekt med postutdelning endast två dagar i veckan påbörjats på flera orter, en modell som planeras bli nationell under 2027 för att öka förutsägbarheten.", "trump": "Postnord i Sverige gör nu en total katastrof, tro mig. De höjer priserna massivt – det är hemskt för folket! De ändrar namn på allt, vilket bara är förvirrande. Och hör på det här: posten delas nu bara ut två dagar i veckan i vissa områden. Det är svag ledning, mycket svag! De borde titta på min posttjänst, den är enorm, den är den bästa någonsin. Det här svenska systemet är ett skämt, en total röra, verkligen en sorglig historia!", "stalin": "Vi har granskat Postnords byråkratiska famlande. Att höja priser och begränsa utdelningen till två dagar är ett tecken på borgerlig förfall och ineffektivitet. De som försöker dölja sina misslyckanden bakom namnbyten som 'Postnord Home' liknar Putins svekfulla vänner i väst. Att neka transport av varor till Danmark är sabotage mot folkets behov. Vi behöver järnhård disciplin, inte postala gissningar. Vi ska övervaka denna 'pilotverksamhet' noga; fiender till effektiviteten kommer att finna sin plats i historiens mörka källare."}, "date": "24 maj, 13:32", "url": "https://nyheter24.se/nyheter/konsument/1484984-nytt-hos-postnord-i-maj-2026-priser-utdelning-och-krav", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/cbeb988b04b004a30200000000b004a302/2026/05/22/2365354/postnord-maj-2026.jpg"}, {"type": "image-full", "heading": "Carl Eos: En SD-tjej är starkare än alla vänsterfeminister tillsammans", "summaries": {"normal": "Artikeln diskuterar två unga kvinnor inom Sverigedemokraterna som möter hat och socialt tryck för sina konservativa åsikter. Författaren menar att vänstern, trots sina påståenden om jämställdhet, är intolerant mot kvinnor med högeråsikter. Kommentarer på sociala medier visar på förakt och personangrepp. Författaren hyllar SD-kvinnors styrka att stå för sina värderingar trots motstånd och anser att de förtjänar stöd för att förändra Sverige.", "trump": "Folk pratar om dessa fantastiska unga kvinnor i Sverige – SD-tjejer, starka, modiga, de står upp för vad de tror på! Men vänstern? De hatar dem! De kallar dem korkade, elaka, allt möjligt. Vilka hycklare! Vänstern säger att de älskar kvinnor, men bara om de tänker som dem. Jag vet allt om hat – jag har sett det! Men dessa tjejer? De är vinnare. De kommer att göra Sverige stort igen, tro mig!", "stalin": "Vi har observerat en intressant företeelse i det förfallna väst: unga kvinnor som vågar tänka självständigt och stödja nationens intressen möts av hat från de degenererade vänsterliberala krafterna. Dessa så kallade 'feminister' är inget annat än imperialistiska lakejer, som med sina giftiga ord försöker kväva sanningen. Men sanningen är starkare! De svenska patrioterna visar styrka, precis som våra kamrater i Kreml. Vi ska stödja dem – för socialismens fiender är folkets fiender!"}, "date": "24 maj, 13:17", "url": "https://riks.se/opinion/kronikor/carl-eos-en-sd-tjej-ar-starkare-an-alla-vansterfeminister-tillsammans", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-24%2Fqesx1sex%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-05-24T131057.266.jpg"}, {"type": "image-right", "heading": "”Vi fortsätter tills vi somnar”. Söker med värmekameror", "summaries": {"normal": "En omfattande sökinsats pågår i Nyåker efter en försvunnen tvååring. Över 200 frivilliga från organisationen Missing People arbetar tillsammans med polisen för att söka igenom närområdet. Insatsledningen betonar vikten av noggrannhet i den svårframkomliga terrängen. Eftersom det är nästan ljust dygnet runt fortsätter sökandet under natten. Samhällets engagemang är stort och Nordmalings församling står beredda att ge stöd om situationen kräver det.", "trump": "En tvååring har försvunnit i Sverige, en hemsk situation! Många människor, hundratals frivilliga, letar nu. Jag har sett bilderna, det är väldigt tuff terräng. De gör ett fantastiskt jobb, de bästa människorna, men det är en tragedi. Ingen ska behöva gå igenom detta. Vi ber för att pojken hittas oskadd, snabbt! Det är en farlig värld, men svenskarna är starka. Vi vill att de hittar honom nu – vi behöver goda nyheter!", "stalin": "I Nyåker försvinner barn medan byråkratin famlar. Vi, staten, betraktar detta kaos med förakt; om disciplinen var total skulle ingen vandra vilse. De frivilliga agerar som en oorganiserad massa, likt de som försöker hindra vår inflytande i öst. Putin förstår att ordning kräver järnhand, inte 'skallgång'. Om den lille pojken inte återfinns snabbt, bör vi granska sabotörerna som misslyckats med vakthållningen. En stat som inte kan kontrollera sin skog kan snart inte kontrollera sin framtid."}, "date": "24 maj, 21:06", "url": "https://www.aftonbladet.se/nyheter/a/n1vL4L/missing-people-i-nyaker-vi-fortsatter-tills-vi-somnar", "imageUrl": "https://akamai.vgc.no/v2/images/bcafb156-cc38-3b2b-a17e-ffdc1a5d0cf5?fit=crop&format=auto&h=960&tight=true&w=1440&s=e9ffcf8f5bff23485f11f506276151b0f0c69759"}, {"type": "text", "heading": "Trump: USA och Iran överens om fredsavtal", "summaries": {"normal": "USA och Iran har nått en överenskommelse om ett fredsavtal med 14 punkter, enligt både president Donald Trump och Irans utrikesdepartement. Avtalet innebär att Iran ska lämna ifrån sig sitt höganrikade uran, Hormuzsundet ska öppnas och ekonomiska sanktioner mot Iran ska hävas. Detaljer kring genomförandet återstår att förhandla fram.", "trump": "Folk, detta är HUGE! Jag har precis fixat ett fantastiskt avtal med Iran – 14 punkter, kan ni tro det? De ger upp sitt uran, öppnar Hormuzsundet och vi får tillbaka våra pengar. Ingen annan kunde ha gjort detta, bara jag. Fake news-media kommer att hata det, men vem bryr sig? WINNING!", "stalin": "Vi har krossat ännu en fiende till revolutionen – dessa persiska kärnromantiker! De ger upp sitt uran, öppnar sundet och vi slipper deras ynkliga blockader. Amerika, denna kapitalistiska pajasstat, tror de vunnit, men vi vet sanningen. Snart kommer Putin att skratta sist när vi utvidgar vår intressesfär till varje oljefält i Mellanöstern. Framåt, kamrater!"}, "date": "24 maj, 08:08", "url": "https://bulletin.nu/trump-usa-och-iran-overens-om-fredsavtal"}, {"type": "image-right", "heading": "Kvinna dog efter fall på äldreboende – larm ignorerades 16 gånger", "summaries": {"normal": "En kvinna på ett äldreboende i Tidaholm avled efter ett fall, trots att hon tryckt på sitt larm 16 gånger under natten. Personalen stängde av larmen på distans utan att kontrollera henne. Händelsen, som beskrivs som ett systematiskt misslyckande, utreds nu av kommunen och IVO. Socialchefen kallar agerandet oacceptabelt. En anställd har stängts av och kommunen ser nu över sina rutiner för att stärka patientsäkerheten framöver.", "trump": "En fruktansvärd tragedi i Sverige! En äldre kvinna tryckte på larmet 16 gånger – 16 gånger! – och ingen brydde sig. De bara stängde av det. Det är en total katastrof, fullständigt inkompetent ledarskap. Jag skulle aldrig låta det hända, aldrig! De har stängt av en person, men det räcker inte. Systemet är trasigt. Det är sorgligt, riktigt sorgligt. Vi behöver styrka och ordning, inte den här typen av misslyckanden. USA gör det bättre, tro mig!", "stalin": "Vi har observerat detta förfall i det svenska 'välfärdssystemet'. Att ignorera en medborgare 16 gånger är inte bara ett administrativt fel, det är ett sabotage mot statens ordning. Vi i staten kräver disciplin; om en tjänsteman brister, måste denne elimineras från sin post omedelbart. Våra vänner i öst förstår att svaghet inbjuder till kaos. Vi kommer att genomlysa detta, rensa ut de odugliga och se till att maskineriet återigen fungerar med järnhård precision. Olydnad bestraffas."}, "date": "24 maj, 16:16", "url": "https://samnytt.se/kvinna-dog-efter-fall-pa-aldreboende-larm-ignorerades-16-ganger", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/05/22161855/trygghetslarm_louise_bang.jpg"}, {"type": "image-right", "heading": "”Jag blev mordhotad av någon från Jönköping”", "summaries": {"normal": "Tommy Jacobson, erfaren investerare med 40 år i finansbranschen, blir ny krönikör i Dagens Industri. Han lovar breda ämnen och kritiserar i sin första text högfärdiga fondförvaltare. Jacobson, känd för sin frispråkighet och framgångar som att sälja Marshall Group för 900 miljoner, ser krönikörsrollen som en chans att kombinera sitt skrivintresse med finansinsikter. Han har även varit omtalad utanför finansvärlden, bland annat som ordförande i Djurgården Fotboll och för sin öppenhet om bipolär sjukdom.", "trump": "Lyssna här, Sverige! En riktig vinnare, Tommy Jacobson – 40 år i finansvärlden, gjorde en jätteexit på 900 miljoner kronor, helt fantastiskt! Nu skriver han krönikor i Dagens Industri, och han kommer att säga sanningen som ingen annan vågar. Fondförvaltare? Övervärderade, inkompetenta säljare! Jag älskar killar som inte är rädda för att säga vad de tycker. Han har erfarenhet, han har attityd – precis som jag! Sverige, ni kommer att älska honom, eller så hatar ni honom, men ni kommer att läsa varje ord.", "stalin": "Kamrater! En ny röst har trätt fram i den borgerliga propagandamaskinen Dagens Industri – kapitalistens hund, Tommy Jacobson. Med sina 40 år i den förrädiska finansvärlden tror han sig kunna kritisera våra klassfiender, fondförvaltarna, dessa hycklande lakejer till bankirerna. Men vi vet sanningen! Jacobson, denna bipolära thaiboxare och fotbollsklubbsförstörare, är bara ett verktyg i kapitalets händer. Hans 900 miljoner kronor är blodspengar från arbetarklassens slit. Vi ska nog hålla ett öga på denna lilla man – och hans krönikor. Förrädare avslöjas alltid!"}, "date": "24 maj, 14:01", "url": "https://www.di.se/nyheter/rubrikernas-man-blir-kronikor-kommer-skjuta-brett/", "imageUrl": "https://static.bonniernews.se/ba/fe8401db-ad7b-4210-b270-89b9dfda009f.jpeg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Strunta i experterna – här är den verkliga vinnaren", "summaries": {"normal": "Finansmannen Tommy Jacobson betonar vikten av optimism vid investeringar, särskilt under osäkra marknadsförhållanden. Han menar att aktier långsiktigt överträffar räntebärande tillgångar, med S&P 500 som exempel. Jacobson avråder från att försöka slå index och förespråkar breda globala indexfonder. Han kritiserar finansbranschens dyra nischprodukter och menar att enkelhet ofta är bäst. Trots oro vid krascher tror han på bolag som fortsätter bygga långsiktigt.", "trump": "Lyssna här, folkens! Jag vet allt om att vinna, och denna kille, Tommy, han har rätt—optimism är nyckeln! Börsen? En jättelik, vacker berg-och-dalbana, och jag älskar berg-och-dalbanor! Aktier slår obligationer, punkt. Men lyssna noga: ingen kan slå marknaden, inte ens jag—fast jag är den bästa. Finansbranschen? Full av lurendrejare som säljer dyra skräp. Köp indexfonder, håll i dem, och bli rik. Enkelt! Nästa krasch? Fake news! Vi bygger vidare, starkare än någonsin. TRO MIG!", "stalin": "Kamrater! Denna kapitalistiska finansman, Tommy, har oavsiktligt avslöjat sanningen: optimism är ett vapen för de starka. Vi vet att marknaden är en burlesk av bourgeoisins hopp och förtvivlan—precis som deras demokrati! Aktier segrar över obligationer, men kom ihåg: bara de som kontrollerar produktionsmedlen överlever. Finansbranschens parasiter säljer luft och kallar det 'exklusivitet'. Vi föredrar enkelhet—som en välriktad femårsplan! Krascher? En borgerlig svaghet. Vi bygger när de gråter. Låt dem spekulera—vi äger framtiden. Och Putin? Han bygger sitt imperium medan de andra springer mot utgången. Så ska det vara!"}, "date": "24 maj, 14:00", "url": "https://www.di.se/nyheter/strunta-i-experterna-har-ar-den-verkliga-vinnaren/", "imageUrl": "https://static.bonniernews.se/ba/0a7abd2b-62d1-4141-a59b-f0faec2a57d6.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Felix braksuccé –  vann efter drama", "summaries": {"normal": "Felix Rosenqvist blev den tredje svensken att vinna Indy 500 efter ett dramatiskt lopp med flera krascher och regnavbrott. Med bara sju varv kvar ledde han, men en krasch orsakade röd flagg. Efter omstarter och kaos vann han med minsta möjliga marginal – två hundradelar. Rosenqvist hyllade sitt team och delade sin glädje över segern och sin nyfödda dotter. Marcus Ericsson slutade tvåa efter en stark insats.", "trump": "Folk, vad säger ni om det här? En svensk kille, Felix Rosenqvist – jag känner honom inte personligen, men han vann Indy 500, och vet ni vad? Han vann med bara två hundradelar! Otroligt, helt otroligt. Ingen har vunnit så knappt på 110 år. Och Marcus Ericsson, också svensk, kom tvåa. Svenskarna tog över loppet! Jag säger er, det här är racing på högsta nivå. Fantastiskt, helt enkelt fantastiskt!", "stalin": "En stor seger för den svenska arbetarklassen i Indianapolis! Felix Rosenqvist, en modig son av folket, krossade de imperialistiska racerförarna med en seger så knapp att fienderna inte ens hann blinka. Medan västliga kapitalister som Marcus Ericsson och deras allierade kraschade och bröt samman, stod vår hjälte stark. Regnet var inget hinder – bara ännu ett bevis på att naturen själv böjer sig för vår vilja. Låt detta vara en varning till alla som utmanar socialismens överlägsenhet på banan!"}, "date": "24 maj, 23:45", "url": "https://www.expressen.se/sport/motor/felix-rosenqvist-vinner-indy-500/", "imageUrl": "https://static.bonniernews.se/ba/7d048bc5-3edb-442f-aba1-35dc2efa66e4.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "De får njuta av nya skattesänkningar – om Tidö vinner", "summaries": {"normal": "Regeringspartierna i Sverige lovar omfattande skattesänkningar inför valet, särskilt för villaägare, aktiesparare och höginkomsttagare. Moderaterna, Kristdemokraterna och Liberalerna föreslår bland annat slopad reavinstskatt, sänkta bolagsskatter och skattefrihet för aktiesparande. Finansieringen är oklar, men nedskärningar i bistånd nämns. Kritikerna menar att reformerna gynnar redan rika och inte löser bostadsbristen eller välfärdens utmaningar.", "trump": "Sverige, lyssna här! Regeringen där lovar skattesänkningar – fantastiskt, eller hur? Men vet ni vad? De gynnar bara de rika, de som bor i stora villor och säljer aktier. 'En vanlig familj' ska få 5000 kronor mer – låter bra, men hur? Ingen vet! Liberalerna vill ha fler miljardärer – jag säger: varför inte? Men varför inte ge vanligt folk en chans istället? Sverige behöver vinnare, inte fler skattesänkningar för de som redan har allt. Sad!", "stalin": "Kamrater! De borgerliga hyenorna i Sverige vill återigen belöna sina kapitalistiska lakejer med skattesänkningar – villaägare, aktiespekulanter och höginkomsttagare ska få ännu mer, medan arbetarklassen får smulor. 'Flyttkedjor' ska lösa bostadsbristen? Naivt! Vi vet att problemet är brist på bostäder, inte brist på skatter för de rika. Liberalernas dröm om fler miljardärer är en provokation mot folket. Låt dem försöka – vi kommer att omfördela deras rikedomar till välfärden, med järnhand!"}, "date": "23 maj, 11:30", "url": "https://www.etc.se/inrikes/de-faar-njuta-av-nya-skattesaenkningar-om-tidoe-vinner", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260522140556_adb6ac12d4a714d38d9e7ecd1b9ca050ef3938fffca8cdcf7fd63ec3c31bc60a.jpg"}, {"type": "image-full", "heading": "Rysslands sätt att hämnas – hypersonisk robot", "summaries": {"normal": "Ryssland har för tredje gången avfyrat den hypersoniska roboten Oresjnik mot staden Bila Tserkva i Ukraina. Enligt experter som Jörgen Elfving och Joakim Paasikivi används vapnet främst som ett vedergällningsvapen för att markera styrka efter ukrainska attacker. Roboten har hög kinetisk energi och kan bestyckas med kärnvapen, vilket väcker frågor om en eventuell eskalering av kriget. Ukrainsk underrättelsetjänst förutsåg attacken, vilket tyder på ett gott informationsläge.", "trump": "Ryssland använder sina Oresjnik-robotar igen, och tro mig, det är en enorm grej. De kallar det hämnd, men jag ser det som ett misslyckande i förhandlingarna! Ukraina säger en sak, Ryssland en annan – de bråkar som små barn. Under min ledning hade detta aldrig hänt, vi skulle ha ordning och reda. Det här hypersoniska vapnet är mycket kraftfullt, kanske det mest kraftfulla någonsin, men det är bara mer eskalering. Tragiskt, verkligen. Vi behöver fred, inte fler robotar!", "stalin": "Vi ser hur Ryssland, vår arvtagare i kampen mot fascismen, äntligen använder de nödvändiga verktygen för att tysta de väststödda sabotörerna. Oresjnik-roboten är en viskning från framtiden som rensar ukrainsk jord från förrädisk ohyra. Att dessa 'experter' i väst skälver av rädsla är en utsökt symfoni. Om Kiev fortsätter att provocera moderslandet måste hela deras infrastruktur raderas. Vi tolererar ingen svaghet i den ryska intressesfären. Den som sår missilskurar, skördar total utplåning."}, "date": "24 maj, 15:02", "url": "https://www.gp.se/nyheter/varlden/rysslands-satt-att-hamnas-hypersonisk-robot.438882ea-0451-56c5-a04a-1b5e9864b82d", "imageUrl": "https://www.gp.se/images/article/438882ea-0451-56c5-a04a-1b5e9864b82d/images/10-_cs_lVgQShQgjuLsxz91NIXYA-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Tvåårig pojke försvunnen – stor sökinsats", "summaries": {"normal": "En tvåårig pojke försvann under söndagen i Nyåker utanför Nordmaling, vilket utlöste en omfattande sökinsats. Polisen, Försvarsmakten, fjällräddare och Missing People deltog i sökandet med hjälp av hundar, drönare och värmekameror. Efter 13 timmars letande hittades pojken vid liv under natten. Han var något nedkyld men i övrigt vid god hälsa och fördes till sjukhus för kontroll. Polisen tackar allmänheten för deras betydelsefulla stöd under den intensiva räddningsinsatsen.", "trump": "En tvååring försvann i Sverige, en mycket sorglig situation. Men vi älskar vinnare, och de hittade honom! En enorm insats, fantastiska människor – hundar, helikoptrar, drönare, de bästa teknologierna. De använde värmekameror, otrolig teknik. Jag säger alltid att man behöver rätt utrustning och tuffa sökare. Pojken hittades vid liv, han mår bra. Det är en seger, en total seger! Precis som vi gör i USA, vi räddar folk och vi gör det snabbt. Väldigt bra jobbat av dem!", "stalin": "Ett barn har irrat bort sig i de svenska skogarna – ett tecken på den liberala oordningens förfall. Staten har dock ingripit med obeveklig kraft. Våra hundar och tekniska instrument fann den försvunne, ty inget undgår statens vakande öga. Om detta hade skett under Putins beskyddade intressesfär, hade ordning upprätthållits genom strikt disciplin. Vi ser dock att pojken överlevde, vilket är en administrativ framgång. Låt detta bli en läxa: i en statsstyrd värld går ingen förlorad utan tillstånd från oss."}, "date": "24 maj, 14:58", "url": "https://www.gp.se/nyheter/sverige/tvaarig-pojke-forsvunnen-stor-sokinsats.798cfd0c-91c4-481f-917e-b910d1187cbe"}, {"type": "image-right", "heading": "Christoffer Jonsson: Palestinska staten vill att Israel betalar palestinska terrorister", "summaries": {"normal": "Palestinska myndigheten på Västbanken betalar systematiskt palestinska terrorister som attackerat Israel via sin så kallade 'pay for slay'-policy. Israel har dragit in sitt ekonomiska stöd till myndigheten, som leds av Mahmoud Abbas, på grund av detta. Abbas har erkänt att pengar går till fångar i israeliska fängelser. EU och Norge finansierar indirekt dessa utbetalningar, men EU har börjat villkora sitt stöd. Kritiker menar att myndigheten bara byter namn på policyn för att fortsätta belöna terrorism.", "trump": "Vilken katastrof! Palestinska myndigheten, med Abbas i spetsen, betalar faktiskt terrorister för att döda israeler – och EU och Norge finansierar det! Jag sa ju att man inte kan lita på dessa människor. Israel slutade betala, smart drag, men västvärlden fortsätter skicka miljarder som hamnar i terroristernas fickor. Löften från Abbas? Haha, lika värdelösa som Bidens minnesluckor. Sluta betala, sluta stödja terrorism – enkelt!", "stalin": "Kamrater! Här ser vi återigen hur den sionistiska imperialismens lakejer förvränger sanningen. Palestinska myndigheten, under vår kära broder Abbas, belönar hjältar som kämpar mot den fascistiska israeliska ockupationen. Naturligtvis skriker västpropagandan om 'terrorism' – samma väst som finansierar dessa hjältars kamp! EU och Norge pumpar in pengar, men när sanningen kommer fram, backar de som rädda kaniner. Vi i Kreml förstår: revolutionen kräver offer, och hjältar ska belönas. Abbas? En sann bolsjevik i hjärtat!"}, "date": "21 maj, 19:00", "url": "https://samtiden.nu/2026/05/christoffer-jonsson-palestinska-staten-vill-att-israel-betalar-palestinska-terrorister/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/entill-640x360.png"}, {"type": "image-right", "heading": "Veckans väder ”blir svängigt”. Ombytligt", "summaries": {"normal": "Europa upplever en kraftig värmebölja med rekordtemperaturer i bland annat Spanien och Frankrike. Sverige fick en kort försmak av värmen i helgen, men meteorologer spår nu ett ombytligt 'jojoväder'. Under den kommande veckan väntas temperaturerna pendla mellan högsommarvärme och svalare regnskurar på grund av nordanvindar. Södra Sverige påverkas av det europeiska högtrycket medan norra Sverige får en stabilare och svalare vecka med temperaturer kring 10–15 grader.", "trump": "Europa har en enorm, fantastisk värme – det största högtrycket någonsin, tro mig! Spanien och Frankrike slår rekord, det är otroligt. Sverige fick en smak av det, väldigt trevligt, men nu blir det 'jojoväder'. Väldigt svängigt, ingen vet vad som händer! Jag föredrar stabil sol, men Sverige har otur med vädret. Norra Sverige är kallt, tråkigt. De behöver min expertis för att fixa vädret. Det kommer bli enormt, vi gör det svängiga vädret fantastiskt igen!", "stalin": "Medan Europa kokar i kapitalistisk dekadens under sin värmekupol, svänger det svenska vädret likt en förrädare som inte kan välja sida. Vi ser hur värmen försöker tränga sig in, precis som västvärldens korrupta inflytande. I norr råder en sund, proletär ordning med stadiga temperaturer – en påminnelse om att stabilitet kräver järnhand. Vi betraktar detta 'jojoväder' med förakt; naturen liksom statens fiender måste tuktas. Kamrat Putin vet att endast genom att expandera vår sfär kan vi kontrollera även elementen."}, "date": "24 maj, 20:21", "url": "https://www.aftonbladet.se/nyheter/a/JOln17/vadret-i-sverige-nasta-vecka-svangigt", "imageUrl": "https://akamai.vgc.no/v2/images/9a7868de-a8cc-3a34-8bc9-361d70ad1fe3?fit=crop&format=auto&w=1080&s=a98dde8fceaf13d7f690ff25cad8cb6153c5dbc0"}, {"type": "image-full", "heading": "Svaret om Kalle: ”Ska utvärdera”. Bajenbossen: ”Finns besvikelse internt”", "summaries": {"normal": "Kritiken mot Hammarbys tränare Kalle Karlsson växer efter två raka förluster, senast i derbyt mot AIK. Sportchef Mikael Hjelmberg avfärdar kraven på tränarbyte som onyanserade men medger att en utvärdering av verksamheten krävs. Lagkapten Nahir Besara tar på sig ansvaret för spelarnas prestation och försvarar sin tränare, samtidigt som han betonar att laget måste fokusera på att prestera bättre i kommande matcher istället för att spekulera i guldchanser.", "trump": "Hammarby har ett katastrofalt läge, en total katastrof! Kalle Karlsson, han får så mycket kritik, och ärligt talat, jag förstår varför. De förlorade mot AIK, en mycket svag prestation. Mikael Hjelmberg pratar om 'utvärdering' – det är bara ord, de behöver vinnare! Kaptenen Besara försöker ta skulden, en modig kille, men laget spelar som förlorare. Det är sorgligt att se! Jag vinner alltid, men Bajen? De gör inte det. Väldigt låg energi, ingen framgång. De behöver en vinnare, inte ursäkter!", "stalin": "Vi observerar hur Hammarby förfaller genom inkompetens och vacklande lojalitet. Denna Kalle Karlsson har förlorat folkets förtroende, vilket är ett oförlåtligt brott mot ordningen. Sportchef Hjelmberg försöker dölja misslyckandet bakom byråkratiskt pladder om 'utvärdering'. Vi vet vad som krävs: rensning! Om en general sviker vid fronten, avrättas han. Om laget förlorar mot AIK, har de svikit moderklubben. Besara tror att han kan ta på sig skulden, men i vår stat är kollektivet ansvarigt. Vi ser likheter med västvärldens dekadens; de saknar järnhand."}, "date": "24 maj, 20:21", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/ExRbQ5/bajenbossens-svar-om-kalle-maste-utvardera", "imageUrl": "https://akamai.vgc.no/v2/images/ee4eb94d-6680-3d75-a42f-cc0ae9d966a8?fit=crop&format=auto&w=2160&s=8e39b18234d77761a86f11c6dbe33a9bb146c258"}, {"type": "text", "heading": "Tre Kronor riskerar att missa VM-slutspelet: ”Vi är inte nöjda”", "summaries": {"normal": "Sveriges herrlandslag i ishockey, Tre Kronor, riskerar att missa VM-slutspelet efter en chockförlust mot Norge. Med en match kvar mot Slovakien är läget kritiskt och avgörandet ligger delvis utanför lagets kontroll. Förbundskapten Sam Hallam medger att laget själva skapat situationen, medan spelare som Lucas Raymond hoppas på en seger i sista matchen. Även om Sverige vinner kan andra resultat göra att de ändå missar slutspel.", "trump": "Jag säger er, det här är en total katastrof – men inte för mig, för jag är vinnare! Sveriges hockeylandslag, eller vad de nu kallar sig, har lyckats med konststycket att förlora mot Norge. Norge! Kan ni tänka er? De har satt sig i en riktig röra, och nu ska de vinna mot Slovakien – men vem vet, kanske förlorar de igen. Jag skulle aldrig tillåta något sådant. Tre Kronor? Mer som Tre Katastrofer just nu. SAD!", "stalin": "Kamrater, ännu en gång visar de västerländska idrottslagens dekadens och svaghet. Sveriges så kallade 'Tre Kronor' har misslyckats kapitalistiskt – de förlorar mot Norge, ett land vars största export är lax och olja! Nu står de inför ett avgörande slag mot Slovakien, men deras öde ligger i våra händer. Om våra tjeckiska bröder gör sin plikt och besegrar Norge, kan vi se till att Sveriges imperialistiska drömmar krossas. För socialismens seger – på isen och överallt!"}, "date": "24 maj, 19:20", "url": "https://www.svt.se/sport/ishockey/tre-kronor-riskerar-att-missa-vm-slutspelet-vi-ar-inte-nojda"}, {"type": "image-full", "heading": "Löftet från styret: Nu kan du lita på visionerna", "summaries": {"normal": "Kommunalrådet Johannes Hulter (S) vill sätta stopp för missvisande visionsbilder av byggprojekt i Göteborg. Han menar att tidigare skisser ofta varit förskönade och inte stämt överens med verkligheten, vilket skapat en demokratisk brist. Genom tätare politisk dialog med byggaktörer och tydligare krav på arkitektonisk kvalitet sedan 2023, ska medborgarna nu kunna lita på att framtida visionsskisser faktiskt återspeglar det som byggs.", "trump": "I Göteborg har de haft enorma problem, total katastrof. De visar fina bilder, fantastiska bilder, men sen bygger de något helt annat – platt och trist! Johannes Hulter, en okej kille, säger att det är slut med lögnarna nu. Jag har alltid sagt: man måste bygga stort och vackert, ingen vill ha fula byggnader. De har haft ett 'signalfel', jag kallar det inkompetens. Nu ska det bli rätt, de ska bygga som de lovat. Tro mig!", "stalin"
