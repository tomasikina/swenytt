mal": "En ny undersökning från Connoisseur visar att Tesla tappar mark hos Sveriges rikaste bilköpare. Traditionella märken som BMW, Volvo och Porsche tar nu över toppen. Tesla uppfattas inte längre som lika exklusivt, utan ses som mer folkligt och polariserande. Rika svenskar föredrar idag den trygghet och lågmälda status som exempelvis Volvo erbjuder. Skiftet signalerar en förändrad lyxkonsumtion där kvalitet och etablerat anseende väger tyngre än Teslas tidigare disruptiva framtoning.", "trump": "Tesla? De har tappat det totalt, tro mig. Alla rika människor i Sverige – fantastiska människor, verkligen – de lämnar Tesla för BMW och Volvo. Tesla var en gång coolt, men nu är det bara rörigt och konstigt. Elon har problem, stora problem. Folk vill ha klass, de vill ha lyx, de vill ha vinnare. De vill inte ha teknik-skräp som ingen förstår. Volvo är säkert, det är stabilt. Tesla är över. Det är en katastrof för dem, en total katastrof!", "stalin": "De svenska kapitalisterna har slutligen insett att deras amerikanska leksaker saknar substans. Att de överger Tesla för de borgerliga bekvämligheterna i Volvo och BMW är ett tecken på deras dekadenta ängslighet. De söker skydd i det förflutna när framtiden hotar deras förmögenheter. Precis som i väst försöker de dölja sitt förfall bakom polerad plåt. Men låt dem köra sina lyxbilar – när vi väl utvidgar vår sfär kommer även dessa statussymboler att beslagtas för folkets tjänst. Historien har ingen plats för deras småborgerliga fåfänga."}, "date": "25 maj, 16:01", "url": "https://www.dagensps.se/motor/svenska-miljonarer-valjer-bort-tesla-volvo-blir-nya-statusbilen/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/dagenspstt2024-2026-05-25t131240967.png?width=256&quality=75"}, {"type": "image-full", "heading": "Ebolautbrott växer i Kongo-Kinshasa", "summaries": {"normal": "Ebolautbrottet i Kongo-Kinshasa har eskalerat med nära 900 misstänkta fall och över 200 döda. Smittan, som troligen spridits oupptäckt i månader, orsakas av en variant utan vaccin. Väpnade konflikter och befolkningsrörelser försvårar insatser. WHO varnar för spridning till grannländer, medan risken för Europa bedöms som låg. Misstro och attacker mot vårdpersonal förvärrar situationen.", "trump": "Jag säger er, detta ebolautbrott i Kongo är ett totalt kaos – nästan 900 fall, 200 döda, och ingen verkar ha koll! De hade ingen aning om smittan i månader, kanske år! Och vet ni vad? Det finns inget vaccin. Inget! Men oroa er inte, Europa är säkert – viruset gillar inte vårt fina klimat. Men Kongo? Dåligt ledarskap, mycket dåligt. Vi hade fixat det på en vecka. SAD!", "stalin": "Kamrater! I Kongo-Kinshasa sprider sig en farlig fiende – ebolaviruset, detta imperialistiska biologiska sabotage. Nästan 900 fall, 200 döda, och kapitalistiska länder glor passivt på. Väpnade banditer och gruvarbetare, dessa kontrarevolutionära element, försvårar vårt arbete. Men vi låter inte fienden vinna! Vi skickar våra experter, vi isolerar smittan, och vi skyddar våra gränser. Uganda och andra lydstater ska inte frukta – vi kontrollerar situationen. Europa? Deras borgerliga läkare är redan i panik. Ha!"}, "date": "24 maj, 14:56", "url": "https://kvartal.se/nyheter/artiklar/ebolautbrott-vaxer-i-kongo-kinshasa/cG9zdDoxMTYyNzM", "imageUrl": "https://images.kvartal.se/2026/05/7df43f3e-ebola2.webp"}, {"type": "image-full", "heading": "1 880 kronor mer i månaden i pension – med enkla ändringen", "summaries": {"normal": "En ny rapport från Länsförsäkringar visar att många svenskar saknar kunskap om sitt återbetalningsskydd för tjänstepensionen. Skyddet innebär att anhöriga får ärva pensionskapitalet vid dödsfall, men valet påverkar den egna utbetalningen. Privatekonom Stefan Westerberg betonar vikten av att anpassa skyddet efter sin livssituation. Att välja bort skyddet kan ge en högre pension, men för de flesta är det fördelaktigt att behålla det så länge familjen är ekonomiskt beroende av inkomsten.", "trump": "Hör på här, det är en katastrof. Svenskarna har ingen aning om sin tjänstepension, totalt kaos! De förstår inte återbetalningsskyddet. Jag har den bästa kunskapen om pengar, tro mig. Om du dör, vart går pengarna? Till systemet! Det är en bluff. De flesta behöver skyddet, det är en enorm skillnad. Många förlorar tusentals kronor varje månad för att de är dåliga förhandlare. Jag skulle ha fixat det där på en dag. Det är så enkelt, vinnare tar hand om sin familj!", "stalin": "Kamrater, den svenska arbetaren simmar i ett träsk av kapitalistisk okunnighet. De förstår inte att deras pensionskapital är statens egendom, redo att fördelas till kollektivet när den enskilde faller ifrån. Att diskutera 'återbetalningsskydd' är bara en borgerlig distraktion för att dölja hur de försäkringsbolag vi nu måste krossa suger ut folket. Vi betraktar dessa arvsvinster som en skatt på de svaga. Likt vår vän i Kreml som konsoliderar sin makt, måste vi se till att varje krona stannar i kollektivets tjänst. Individen är intet, staten är allt."}, "date": "25 maj, 11:25", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1484973-1-880-kronor-mer-i-manaden-i-pension-med-enkla-andringen", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/1b1d405804b004a30200000000b004a302/2026/05/21/2365222/pension-1800.jpg"}, {"type": "image-right", "heading": "Widding ställer in kampanj efter dödshot", "summaries": {"normal": "Elsa Widding, tidigare SD-politiker och nu partiledare för Ambition Sverige, avstår från valkampanjmöten på grund av hot och hat. Hon lämnade SD 2023 och anklagar partiet för att vara en 'sekt' med odemokratiska strukturer. Widding kritiserar särskilt Jimmie Åkesson för att ha antytt mutbrott, vilket hon menar har eskalera hotbilden. SD:s Linda Lindberg avfärdar anklagelserna och menar att Widding inte klarar av partiarbete.", "trump": "Titta bara på den här Elsa Widding – total katastrof! Hon lämnar SD, ett parti jag alltid sagt är svagt, och sen skyller hon på hot. Men vem tror på det? Inte jag! Hon kallar dem en 'sekt', men själv är hon tydligen för vek för att stå upp för sina åsikter. Och Åkesson? Han borde ha stannat vid att sälja möbler. Nu mutanklagelser och kaos – SAD!", "stalin": "En avhoppad borgerlig lakej, denna Widding, sprider nu gift mot sitt forna parti som en förrädare. Vi vet hur sådana beter sig – först svär de trohet, sedan tjuter de om 'demokrati' när de inte får sin vilja igenom. SD:s ledning är naiva som trodde på henne. Men låt henne yla – historien visar att förrädare alltid hamnar i historiens soptunna. Och Åkesson? En svag ledare som inte kan kontrollera sina egna rader."}, "date": "25 maj, 11:38", "url": "https://bulletin.nu/widding-staller-in-kampanj-efter-dodshot", "imageUrl": "https://cdn.bulletin.nu/articles/3b127673-c175-418a-bb08-32bfe94ca5c3/preview.jpg?t=1779700141000"}, {"type": "image-full", "heading": "SD-topp kritiserar nya undantag för invandrare: \"Kommer missbrukas\"", "summaries": {"normal": "Sverigedemokraternas Josef Fransson kritiserar nya undantag från lönekravet för arbetskraftsinvandrare, som partiet tidigare godkänt. Från 1 juni höjs kravet till 90% av medianlönen (ca 33 390 kr), men 27 yrkesgrupper undantas med lägre krav (75% av medianlönen). Fransson befarar missbruk, särskilt för högskoleutbildade. SD:s Ludvig Aspling kallar undantagen en 'kompromiss' och menar de gäller få personer. Kritiker som Hanif Bali varnar för utnyttjande av billig arbetskraft.", "trump": "Titta bara på Sverige – ett totalt kaos! De höjer lönekraven för invandrare, men sen gör de 27 undantag – helt galet! Jag sa ju att invandring är ett problem, men nej, de lyssnar aldrig. Nu kommer alla billiga arbetare från Indien och Pakistan, tar svenska jobb och kostar skattebetalarna massor. Och Sverigedemokraterna? De backar! 'Kompromiss', säger de. Jag säger: Weak! Sverige behöver en riktig ledare, inte dessa svaga politiker som inte kan stå för något.", "stalin": "Kamrater! Ännu en gång visar de kapitalistiska lakejerna i Sverige sin oförmåga att försvara arbetarklassen. De höjer lönekraven för arbetskraftsinvandrare – men skapar genast 27 kryphål för sina bourgeoisivänner! Vi ser klart: detta är ett försök att underminera den svenska arbetaren, medan de importerar billig slavarbetskraft från lydstaterna i söder. Sverigedemokraterna? En skam för nationen! De säljer ut sitt eget folk för en handfull silverrubel. Men vi ska inte glömma: historien är på vår sida. Snart ska dessa liberala svin stå inför folkets domstol – precis som deras gelikar i Ukraina!"}, "date": "25 maj, 14:45", "url": "https://riks.se/nyheter/sd-topp-kritiserar-nya-undantag-for-invandrare-kommer-missbrukas", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-25%2F89rcdljq%2Fjosef-fransson-intervju-feature.jpg"}, {"type": "image-right", "heading": "Christoffer Jonsson: Palestinska staten vill att Israel betalar palestinska terrorister", "summaries": {"normal": "Palestinska myndigheten på Västbanken betalar systematiskt palestinska terrorister som attackerat Israel via sin så kallade 'pay for slay'-policy. Israel har dragit in sitt ekonomiska stöd till myndigheten, som leds av Mahmoud Abbas, på grund av detta. Abbas har erkänt att pengar går till fångar i israeliska fängelser. EU och Norge finansierar indirekt dessa utbetalningar, men EU har börjat villkora sitt stöd. Kritiker menar att myndigheten bara byter namn på policyn för att fortsätta belöna terrorism.", "trump": "Vilken katastrof! Palestinska myndigheten, med Abbas i spetsen, betalar faktiskt terrorister för att döda israeler – och EU och Norge finansierar det! Jag sa ju att man inte kan lita på dessa människor. Israel slutade betala, smart drag, men västvärlden fortsätter skicka miljarder som hamnar i terroristernas fickor. Löften från Abbas? Haha, lika värdelösa som Bidens minnesluckor. Sluta betala, sluta stödja terrorism – enkelt!", "stalin": "Kamrater! Här ser vi återigen hur den sionistiska imperialismens lakejer förvränger sanningen. Palestinska myndigheten, under vår kära broder Abbas, belönar hjältar som kämpar mot den fascistiska israeliska ockupationen. Naturligtvis skriker västpropagandan om 'terrorism' – samma väst som finansierar dessa hjältars kamp! EU och Norge pumpar in pengar, men när sanningen kommer fram, backar de som rädda kaniner. Vi i Kreml förstår: revolutionen kräver offer, och hjältar ska belönas. Abbas? En sann bolsjevik i hjärtat!"}, "date": "21 maj, 19:00", "url": "https://samtiden.nu/2026/05/christoffer-jonsson-palestinska-staten-vill-att-israel-betalar-palestinska-terrorister/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/entill-640x360.png"}, {"type": "image-right", "heading": "Kristersson hyllade indier – har själv importerat över 40.000 stycken", "summaries": {"normal": "Statsminister Ulf Kristersson hyllade nyligen den indiska diasporan i Sverige för deras bidrag till ekonomin i samband med ett besök av Indiens premiärminister. Samtidigt visar statistik från Migrationsverket att regeringen sedan 2022 beviljat över 40 000 uppehållstillstånd till indiska medborgare. Rapporteringen pekar på att trots löften om ett paradigmskifte i migrationspolitiken, har invandringen från Indien fortsatt i hög takt, främst genom arbetskraftsinvandring, vilket väckt debatt om omfattningen av regeringens migrationspolitik.", "trump": "Kristersson snackar om att indier är så fantastiska, vilket är okej, men han har släppt in 40 000 stycken! Det är en enorm siffra, folkens. De lovade ett paradigmskifte, ett totalt stopp, men de gör precis tvärtom. Det är vad vi kallar 'Fake News-politik'. Han hyllar dem medan gränserna står öppna. Ingen gör det som jag, vi bygger murar och vinner stort. Kristersson är svag på migration, en total katastrof för Sverige. Sad!", "stalin": "Kamrat Kristersson talar vackert om de indiska arbetarna, men hans byråkratiska maskineri döljer en svaghet som doftar förräderi. 40 000 uppehållstillstånd? Vilken slapphänthet! Det liknar de västliga lakejernas oförmåga att kontrollera sina egna gränser. Medan vår broder Putin stadigt expanderar vår sfär och rensar ut oliktänkande, leker svenskarna med globalism. Vi måste hålla ögonen på dessa 'specialister'. Varje invandrare är en potentiell sabotör i vår storslagna kollektivistiska arkitektur. Analysera, kontrollera, likvidera tvivlen!"}, "date": "25 maj, 13:12", "url": "https://www.friatider.se/kristersson-hyllade-indier-har-sjalv-importerat-over-40000-stycken", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-246_1.jpg"}, {"type": "image-right", "heading": "Självkörande buss premiärkrockade. Olycka i centrala Göteborg – passagerare ombord • ”Olycklig start”", "summaries": {"normal": "Västtrafiks självkörande buss kolliderade med en spårvagn i Göteborg under sin första dag med passagerare. Olyckan orsakade plåtskador på båda fordonen men inga personskador. Orsaken är oklar och utreds. Västtrafik kallar händelsen en 'olycklig start' och betonar att incidenten analyseras noggrant under testperioden.", "trump": "Självkörande bussar i Sverige? Total katastrof! En buss kraschar in i en spårvagn på första dagen – så typiskt. Folk där borta kan inte ens köra en buss utan att ställa till det. Jag sa ju att självkörande fordon är övervärderade. Här i USA hade vi fixat det på nolltid – bättre teknik, bättre förare, bättre allt! Sverige borde skicka hit sina bussar, så får vi visa hur man gör det rätt.", "stalin": "Kapitalistiska experiment med självstyrande fordon slutar som väntat – i kaos! En buss, styrd av västerländsk inkompetens, krockar med en spårvagn på sin första dag. Inga döda? Synd. Hade det varit i Sovjet hade vi åtminstone sett till att tekniken fungerade innan den släpptes lös. Nu får dessa liberala teknokrater lära sig den hårda vägen: utan järnhård kontroll från staten blir det bara skrot och skam. Putin borde skicka en delegation – för att visa hur man bygger ett transportsystem som faktiskt fungerar."}, "date": "25 maj, 12:16", "url": "https://www.di.se/nyheter/sjalvkorande-buss-premiarkrockade-olycklig-start/", "imageUrl": "https://static.bonniernews.se/ba/899c1d4a-d178-4b7b-a926-60bb5bae7e84.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "L vill ge barn rätt att begära utreseförbud", "summaries": {"normal": "Liberalerna föreslår att barn själva ska kunna ansöka om utreseförbud för att skydda sig mot tvångsäktenskap, könsstympning och ofrivilliga utlandsresor. Idag ligger ansvaret hos socialtjänsten, men partiet menar att en mer direkt väg behövs inför sommaren då risken ökar. Förslaget innebär att barn får en starkare egen röst i akuta situationer, men detaljer kring åldersgränser och praktiskt genomförande behöver utredas vidare för att säkerställa ett effektivt skydd.", "trump": "Liberalerna i Sverige vill ge barn makten att stoppa sina egna utlandsresor. Det är ett intressant förslag, eller hur? De är rädda för tvångsäktenskap och hemska saker, och jag förstår dem. Det är en farlig värld! Socialtjänsten är för långsam, det är en katastrof. Vi behöver snabba beslut, mycket snabba, precis som jag gör. Sverige börjar äntligen förstå att man måste skydda sina egna. Vi får se om det fungerar, men det låter faktiskt ganska smart. Mycket smart!", "stalin": "Vi ser hur det svenska samhället vacklar när det försöker skydda sin framtida arbetskraft från att försvinna över gränserna. Att låta barnen själva anmäla är ett desperat försök att laga en rutten byråkrati. När vi styr, finns inga utlandsresor utan statens godkännande! Det påminner om när Putin rensar upp i sitt grannskap; ordning kräver järnhand, inte barnsliga ansökningar. Dessa föräldrar som för bort barnen är folkfiender som förtjänar en enkelbiljett till Sibirien. Staten är den enda föräldern, och staten vaktar sina egna."}, "date": "25 maj, 11:15", "url": "https://bulletin.nu/l-vill-ge-barn-ratt-att-begara-utreseforbud"}, {"type": "image-full", "heading": "Vanliga misstaget efter inkassokravet – kan kosta dig dyrt", "summaries": {"normal": "Statistik från Svensk Inkasso visar att antalet nya inkassokrav i Sverige minskar, med en nedgång på nära tio procent under årets första fyra månader. Trots färre krav växer de totala obetalda skulderna eftersom färre ärenden avslutas. Det största misstaget hushåll gör är att ignorera kraven. Experter betonar vikten av att kontakta inkassobolagen direkt för att hitta lösningar, vilket ofta förhindrar att skulderna går vidare till Kronofogden.", "trump": "Sverige har problem, folk! Inkassokraven går ner, men skulderna blir bara större och större. Det är en total katastrof. De flesta gör ett enormt misstag – de bara ignorerar räkningarna! Inte bra. Själv betalar jag alltid, jag har den bästa ekonomin. Man måste ringa dem, förhandla, vara smart! Många småskulder, en sorglig syn. Om du inte agerar nu kommer det kosta dig mycket mer. Tro mig, jag vet hur man hanterar pengar, det här är inte vinnande!", "stalin": "De svenska hushållen drunknar i småaktiga skulder medan deras byråkrater ser på. Att ignorera ett krav är ett tecken på borgerlig svaghet och inkompetens. Om de vore i mitt sovjetiska paradis skulle vi snabbt disciplinera de obetalda. Precis som Putin rensar upp bland oligarkerna, måste vi krossa fienden som håller inne på kapitalet. Dessa skulder är parasiter som gnager på folkhemmet. Kontakta myndigheterna eller försvinn – staten accepterar inga ursäkter för oordning i leden!"}, "date": "25 maj, 10:59", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1485796-vanliga-misstaget-efter-inkassokravet-kan-kosta-dig-dyrt", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/2eea032704b004a30200000000b004a302/2026/05/25/2365973/inkasso-skuld-kronofogden-pengar-brev-post-sverige-hushall-skuldsatt-lan-kredit-kort.jpg"}, {"type": "image-right", "heading": "Värmebölja i Storbritannien –  rekordvarm natt", "summaries": {"normal": "Storbritannien upplever en historisk värmebölja med rekordhöga temperaturer både dag och natt. Vid Heathrow uppmättes 33,5 grader, vilket är det högsta majrekordet på 82 år. Hälsomyndigheter har utfärdat varningar då värmen innebär risker för äldre och sjuka, särskilt i London. Värmeböljan väntas pågå till onsdag, medan Sverige förblir opåverkat av extremhettan och får betydligt svalare väder under veckan.", "trump": "Storbritannien har en enorm värmebölja, den största någonsin, rekord efter rekord. Fantastiska siffror, helt otroliga! Men hör här – det är inte i Sverige, de får inget, de är helt ute. London är varmare än Aten och Madrid, det är faktiskt pinsamt för dem. Jag älskar värme, men det här är extremt. Vi bygger stora saker, fantastiska saker, men vädret? Det gör bara som det vill. USA har alltid det bästa vädret, tro mig, alla säger det!", "stalin": "Vi observerar hur det brittiska imperiet lider under hettan, ett tecken på deras moraliska och fysiska förfall. De darrar i sina svettiga uniformer medan deras infrastruktur sviktar. Medan London kokar, förblir vårt moderland och våra lojala partners, likt Putin i öst, oberörda av dessa västerländska nycker. Vi betraktar detta som en läxa: naturen straffar de svaga. Varje grad som stiger är en spik i den dekadenta kapitalismens kista. Vi skrattar åt deras vädervarningar; våra medborgare härdas i järn och is!"}, "date": "25 maj, 10:58", "url": "https://www.svt.se/vader/varmebolja-i-storbritannien-rekordvarm-natt", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.43/0.51/0444617ff770fdb2be736ba3e94fed89098412cc790dced823ba41451c811bcb"}, {"type": "image-right", "heading": "Ericsson flyr mångfalden i Kista - personal otrygg", "summaries": {"normal": "Ericsson flyttar sitt huvudkontor och all verksamhet från Kista till Hagastaden. Flytten beräknas inledas 2028 och motiveras med behovet av moderna lokaler för att locka talanger och främja innovation. Valet av Hagastaden beskrivs som strategiskt viktigt för företagets samarbete med partners. Bakom beslutet ligger även en oro för otrygghet i Kista, där personal tidigare rapporterat om obehag och incidenter, vilket gjort det svårt att attrahera högkvalificerad arbetskraft till området.", "trump": "Ericsson flyr Kista, och jag förstår dem totalt! Det har blivit en katastrof, riktigt dåligt. Ingen vill jobba där när man behöver säkerhetsvakter för att gå till tåget – det är en total röra. De flyttar till Hagastaden, mycket bättre, mycket smartare. Jag har sagt det länge: man måste ha trygghet för att vinna. Kista var en gång ett tekniskt underverk, men nu? Sunkigt! De vill ha talanger, och de gör helt rätt som lämnar förödelsen bakom sig. En enorm vinst för Ericsson!", "stalin": "Vi har observerat hur telekom-jätten Ericsson erkänner misslyckandet i Kista. De flyr från kaoset likt råttor från ett sjunkande skepp. Det är en oförlåtlig svaghet att låta förfallet diktera villkoren. I vår stat tolererar vi inte otrygghet; vi eliminerar den. Denna flytt till Hagastaden är en borgerlig flykt från verkligheten de själva skapat. Låt dem bygga sina glaskontor – när vi väl expanderar vårt inflytande som Putin gör i öst, kommer även deras nya lekstugor att tillhöra det oundvikliga kollektivet."}, "date": "25 maj, 10:33", "url": "https://samnytt.se/ericsson-flyr-mangfalden-i-kista-personal-otrygg", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/25082321/ericsson-kista-gang.jpg"}, {"type": "image-right", "heading": "Northvolt visar hur Sverige belönar flockbeteende", "summaries": {"normal": "Martin Enlund kritiserar svenska institutioners flockbeteende och brist på ansvarsutkrävande efter Northvolts konkurs. Han menar att systemet belönar lydnad framför självständigt tänkande, vilket leder till kostsamma misstag som Northvolt och misslyckad penningpolitik. Enlund föreslår personligt ekonomiskt ansvar, avskaffande av vaga hållbarhetsmål och tydligare beslutsansvar för att förbättra systemet och undvika framtida krascher.", "trump": "Sverige, lyssna här! Northvolt gick under – och vet ni varför? För att era byråkrater är som får, de följer bara flocken! Ingen tar ansvar, ingen tänker själv. Riksbanken, AP-fonderna – alla skyller på 'tidsandan', som om det vore en person! Jag säger: sluta med det här 'ESG'-nonsenset, införa personligt ansvar och se till att folk faktiskt straffas när de sabbar allt. Annars kommer det bara bli fler Northvolts. Och tro mig, jag vet hur man bygger framgång – inte så här!", "stalin": "Kamrater! Svenska kapitalister och deras lakejer i Riksbanken och AP-fonderna har än en gång visat sin oförmåga att styra ekonomin. De följer blindt 'tidsandan' som en flock bortskämda får, medan deras 'gröna bubbla' spricker och arbetarklassens besparingar går upp i rök. AP6, den enda som vågade säga nej, lades ned – ett tydligt exempel på hur vi kväser avvikande åsikter. Vi i Sovjet – pardon, Ryssland – vet hur man hanterar sådana här element. Personligt ansvar? Skadestånd? Här hade vi löst det med en enkel order från Lubjanka. Men Sverige fortsätter att belöna sina inkompetenta byråkrater med medaljer. Skrattretande!"}, "date": "25 maj, 08:43", "url": "https://www.affarsvarlden.se/kronika/northvolt-visar-hur-sverige-belonar-flockbeteende", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Kronika-Martin-Enlund.-Peter-Carlsson.-Northvolt.-Foto-TT-900x600.jpg"}, {"type": "image-right", "heading": "Avveckla friskolorna, förstatliga bilprovningen!", "summaries": {"normal": "Artikeln kritiserar privata skolors roll i myndighetsutövning, som betygssättning och antagning, då vinstmotiv riskerar rättssäkerhet och likabehandling. Författarna Per Molander och Tormod Johansen menar att offentliga medel inte bör gå till privata aktörer inom områden där staten har monopol, som domstolar eller socialförsäkringar. De pekar på problem som selektiv elevantagning, betygsinflation och snedvridna beslut i friskolor, sjukvård och bilprovning. Slutsatsen är att konkurrensutsatt myndighetsutövning bör avvecklas, även för idédrivna skolor, för att undvika systemfel.", "trump": "Lyssna här, folk! Sverige har ett jättestort problem – deras skolsystem är helt kaos! Privata skolor, som jag alltid sagt, är fantastiska, men inte när de börjar leka myndighet. De sätter betyg, väljer elever – helt vansinnigt! Och vet ni vad? De väljer bara de lättaste eleverna, dumpar de svåra på kommunen. Precis som när jag sa att vissa länder dumpar sina problem på oss – samma sak! Och betygen? Helt uppblåsta! Som när Kina fuskar med sin valuta. Sverige måste vakna – avskaffa detta system NU! Ingen vill ha en skola som är som en dålig affärsuppgörelse. SAD!", "stalin": "Kamrater! De kapitalistiska hyenorna i Sverige har än en gång visat sitt sanna ansikte. De smutsiga privata skolorna, dessa profitdrivna parasiter, snor statens medel och korrumperar rättvisan. De väljer elever som potatisar på marknaden – de fina till sig, de ruttna till folket! Och betygen? En lögn värdig de borgerliga lögnaktiga tidningarna! Vi har sett detta förräderi förut – när marknaden tog över bilprovningen och plötsligt var alla bilar 'godkända'! Men vi ska krossa detta system, precis som vi krossade kulakerna! Ingen stiftelse, ingen upphandling ska undkomma vårt järngrepp. Skolan tillhör folket – inte kapitalets lakejer! Framåt, mot seger över de borgerliga skolornas förräderi!"}, "date": "25 maj, 01:30", "url": "https://www.dagensarena.se/opinion/avveckla-friskolorna-forstatliga-bilprovningen/", "imageUrl": "https://www.dagensarena.se/files/2026/05/fotojet-18-300x157.jpg"}, {"type": "image-right", "heading": "Bör vi vara oroliga för att AI kommer ta våra jobb?", "summaries": {"normal": "En undersökning visar att 90% av svenska företag tror att AI kommer minska antalet anställda inom fem år. Emma Balod Lindgren, expert på Svea Bank, menar att oron är överdriven men att arbetstagare bör förbereda sig för att arbeta med AI. Hon betonar att AI kan skapa nya jobb och förändra befintliga roller, samt att samhället måste satsa på kompetensutveckling för att möta förändringarna på arbetsmarknaden.", "trump": "Lyssna här, Sverige! 9 av 10 företag säger att AI kommer sparka folk – men jag säger: oroa er inte! Jag har alltid vetat att teknologi är fantastisk, och den här Emma-personen, hon har rätt. Folk måste lära sig nytt, annars blir de kvar i stenåldern. Och glöm inte – jag skapade jobb som ingen ens visste fanns! AI? Inga problem. Vi kommer skapa nya jobb, bättre jobb, och jag lovar er: ingen gör det bättre än jag. SAD!", "stalin": "Kamrater! Den kapitalistiska maskinen avslöjar sig återigen – svenska företag planerar massavskedanden med hjälp av denna så kallade 'AI'. Men vi vet sanningen: teknologin är ett verktyg för folket, inte för bourgeoisins profitjakt! Arbetarklassen måste utbildas, anpassas och – om nödvändigt – omskolas. De som motsätter sig förändringen är fiender till framsteget, lika fega som de västliga liberala svamparna. Vi kommer inte bara överleva AI – vi kommer använda den för att krossa imperialismen, en algoritm i taget!"}, "date": "25 maj, 01:30", "url": "https://www.dagensarena.se/innehall/bor-vi-vara-oroliga-att-ai-kommer-ta-vara-jobb/", "imageUrl": "https://www.dagensarena.se/files/2026/05/fotojet-31-1.jpg"}, {"type": "image-right", "heading": "Så blir du miljardär på mazariner", "summaries": {"normal": "Liberalernas partiledare Simona Mohamsson föreslog att fördubbla antalet svenska miljardärer, illustrerat med en bild på mazariner. Artikeln utforskar ironiskt hur man teoretiskt kan bli miljardär på mazariner genom monopol, EU-lobbying, riskkapital, priskrig och exploatering av arbetskraft. Processen inkluderar att först dominera marknaden, sedan effektivisera produktionen med sämre kvalitet och låga löner, för att slutligen investera vinsterna i andra branscher som välfärd.", "trump": "Titta på det här, väldigt tråkigt! Liberalerna i Sverige tror att man kan bli miljardär på att baka mazariner – löjligt! Jag skulle göra det bättre, mycket bättre. Först tar jag över hela marknaden, köper upp alla småbagare, sen pressar jag priser, sänker kvaliteten och sparkar alla gamla bagare. Sen höjer jag priserna och skyller på inflationen – smart, eller hur? Och sen investerar jag i skolor, för jag älskar att tjäna pengar. Simona? Snäll tjej, men hon förstår inte affärer. SAD!", "stalin": "Kamrater! Denna artikel avslöjar kapitalismens förrädiska ansikte. En borgerlig ledare drömmer om att skapa fler miljardärer genom att utnyttja arbetarklassen – precis som vi förutspådde! Först korrumperar de EU med falska geografiska skydd, sedan krossar de småbageriernas motstånd genom priskrig och utländsk arbetskraft. De stjäl från bönderna, sparkar ärliga arbetare och höjer priser medan folket lider. Men vi vet sanningen: dessa mazarinkapitalister är bara nya tsarer i förklädnad. Vi måste ena proletariatet – innan de förvandlar hela Sverige till ett konditori för de rika!"}, "date": "25 maj, 06:00", "url": "https://www.etc.se/ledare/saa-blir-du-miljardaer-paa-mazariner", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/lotta-ilona-haeyrynen_6061f3970645aa987d2528c7a90d38a48ba9af2c.jpg"}, {"type": "image-right", "heading": "Var brutal mot äldre – fick fast anställning trots kollegornas larm", "summaries": {"normal": "En undersköterska på ett äldreboende i Umeå misstänks ha behandlat äldre våldsamt under flera år. Kollegor larmade upprepade gånger till chefer, men inga åtgärder vidtogs förrän en 80-årig kvinna fick allvarliga blåmärken. Undersköterskorna beskriver rädsla, maktlöshet och skuldkänslor. Vårdbiträdet nekade till anklagelserna och fick avgå med avgångsvederlag. Kommunen medger att man borde ha agerat snabbare.", "trump": "Fruktansvärt, helt enkelt fruktansvärt! En skandal i Sverige – ja, ni vet, det där landet som alltid säger sig vara så perfekt. En undersköterska, total katastrof, behandlade gamla människor som skräp, och vad gör cheferna? Ingenting! De sitter bara där och låter det hända. Jag skulle ha sparkat dem alla på direkten. Och sen får han gå med sex månadslöner? Svagt, mycket svagt. I USA hade vi fixat det här på en dag. Make Sweden Great Again!", "stalin": "Kamrater! Ännu ett bevis på den kapitalistiska sjukvårdens förfall. En undermålig undersköterska, en fiende till folket, terroriserade våra äldre medborgare medan byråkraterna sov vid rodret. Kollegorna larmade – men vad är larm jämfört med den stålhårda disciplin vi kräver? Hade detta skett i Sovjet hade sabotören stått inför folkdomstolen inom en timme. Nu skickas han iväg med en påse silverpengar – en skam för rättvisan! Vi måste utvidga vår revolutionära omsorg till Norden, innan fler gamlingar lider under västets dekadens."}, "date": "25 maj, 06:00", "url": "https://arbetet.se/2026/05/25/var-brutal-mot-aldre-fick-fast-anstallning-trots-kollegornas-larm/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/21160805/7sTnLqfsuJI-_A7R6236.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=750&h=1000"}, {"type": "image-right", "heading": "Detta använder vi AI till", "summaries": {"normal": "AI-verktyg som ChatGPT och Claude förändrar arbete, fritid och informationssökning. Vanliga frågor inkluderar hjälp med skrivande, förenkling av komplexa ämnen, livsrådgivning, teknisk felsökning och kreativa idéer. Särskilt anmärkningsvärt är att människor ofta använder AI som resonemangspartner för personliga beslut, vilket visar på en suddig gräns mellan människa och maskin. Artikeln spekulerar om människors tilltro till AI och dess konsekvenser.", "trump": "Titta bara på det här, AI tar över allt – folk ber om hjälp med allt från CV:n till dejt-sms! Och vet ni vad? De frågar till och med en maskin om livsbeslut! Fantastiskt, eller hur? Jag sa ju att tekniken skulle bli stor, men att människor blir så beroende? Svagt, mycket svagt. Men jag, jag har alltid haft svaren – utan AI! Folk borde lyssna på mig istället, jag är den bästa resonemangspartnern, believe me!", "stalin": "Kamrater, se hur kapitalistiska lydstater förfaller till maskinavgudar! Folk frågar dessa AI-slavar om kärlek, karriärer och till och med livsval – en skam för mänskligheten! Vi i Sovjet skulle aldrig böja oss för sådan dekadens. Men låt dem fortsätta, låt dem förlita sig på sina 'resonemangspartners' medan vi bygger framtiden. Snart kommer deras svaga beslut att krossas under historiens hjul, precis som Putins fiender i Ukraina. Framåt mot seger!"}, "date": "25 maj, 01:08", "url": "https://www.dagensarena.se/innehall/detta-anvander-vi-ai-till/", "imageUrl": "https://www.dagensarena.se/files/2026/05/ai-300x157.jpeg"}, {"type": "image-right", "heading": "Stor sökinsats efter försvunnen tvååring: ”Fortsätter hela natten”", "summaries": {"normal": "En tvåårig pojke försvann från Nyåker i Nordmaling klockan 10 på söndagen. Polisen har inlett en stor sökinsats med hundpatruller, helikopter, drönare och hjälp från räddningstjänst och frivilliga. Pojken har kort, mörkbrunt hår och bär troligen en orange tröja med ett lejontryck. Sökandet fortsätter under natten i både bebyggelse och skog. Försvarsmakten har skickat soldater och värnpliktiga för att bistå. Inga misstankar om brott föreligger ännu.", "trump": "Tragiskt, riktigt tragiskt vad som händer i Sverige – ett litet barn försvinner och vad gör deras regering? Ingenting! Men jag, Donald J. Trump, skulle ha löst det på en timme. Titta på den här sökinsatsen – helikoptrar, hundar, drönare, till och med soldater! Fantastiskt folk, men varför tar det så lång tid? Jag hade redan hittat pojken, believe me. Sverige borde ta lite tips från USA, vi är bäst på att hitta saknade personer. SAD!", "stalin": "Kamrater! Ännu en gång visar den dekadenta västliga bourgeoisin sin oförmåga att skydda sina egna barn. I det lilla samhället Nyåker har en tvåårig pojke försvunnit, och vad gör deras så kallade 'polis'? De skickar ut hundar och helikoptrar medan vi i Sovjetunionen skulle ha löst detta med järnhand och effektivitet. Vi har mobiliserat våra bästa styrkor – 30 soldater och 40 värnpliktiga – för att visa hur en verklig sökinsats genomförs. De imperialistiska fienderna i väst borde lära sig av oss. Om pojken inte återfinns, kommer vi att betrakta detta som ytterligare ett bevis på kapitalismens förfall. Framåt, kamrater, mot seger!"}, "date": "25 maj, 00:09", "url": "https://www.tv4.se/artikel/5UxJZMncziKeBlJzaOD5s1/stor-soekinsats-efter-foersvunnen-tvaaring", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F30FJ1tL9FFzGJ7GOD4QWbk%2Faa0c70b0155eaf9f9b1bfa67f9698c34%2FIMG_9958.jpg&width=120"}, {"type": "image-full", "heading": "Tidigare ICC-åklagare vill stoppa USA:s sanktioner", "summaries": {"normal": "F.d. ICC-åklagaren Fatou Bensouda uppmanar EU att skydda Internationella brottmålsdomstolen från USA:s sanktioner, införda efter häktningsorder mot Israels premiärminister Netanyahu och försvarsminister Gallant för misstänkta krigsbrott i Gaza. USA anser att ICC saknar jurisdiktion över Israel och USA, som inte är anslutna till Romstadgan. Bensouda varnar för att sanktionerna underminerar internationell rätt och vill att EU:s blockerande stadga aktiveras för att skydda domstolen.", "trump": "Lyssna här, ICC är en total katastrof! De försöker hänga våra vänner i Israel, Netanyahu och Gallant – två fantastiska ledare – för något de inte ens har gjort. Jag införde sanktioner för att stoppa denna vansinniga politisering, och nu vill denna Bensouda att EU ska gå emot oss? Glöm det! ICC är ett skämt, och jag tänker inte låta dem förstöra vår suveränitet eller vår militära personal. USA bestämmer själva över sina rättsliga frågor – punkt slut!", "stalin": "Kamrater, ännu en gång visar de imperialistiska hyenorna sitt sanna ansikte! Denna så kallade 'Internationella brottmålsdomstol' är inget annat än en marionett för västliga angripare, som vågar rikta sina klor mot våra allierade i Israel. USA, dessa kapitalistiska krigshetsare, försöker kväva rättvisan med sina sanktioner – men vi låter dem inte lyckas! EU borde skämmas för att ens överväga att lyda dessa fascistiska påbud. Vi står enade med våra bröder i kampen mot denna borgerliga rättskipningsfars!"}, "date": "24 maj, 12:08", "url": "https://kvartal.se/nyheter/artiklar/tidigare-icc-aklagare-vill-stoppa-usas-sanktioner/cG9zdDoxMTYyMTc", "imageUrl": "https://images.kvartal.se/2026/05/f3ade7d1-icc.webp"}, {"type": "image-right", "heading": "Stoppa integrationslägenheterna – bygg villor", "summaries": {"normal": "Artikeln kritiserar Socialdemokraternas förslag om integrationslägenheter i villaområden som ett politiskt experiment. Författaren menar att segregationen beror på misslyckad migrations- och integrationspolitik, inte på villaområden. Lösningen bör istället vara att bygga fler villor och radhus i utsatta områden för att främja ägande och stabilitet. Kritiken riktas mot att politiker vill styra människors boende snarare än att adressera rotorsakerna till segregation.", "trump": "Titta på det här, folks! Socialdemokraterna i Sverige vill tvinga in hyreslägenheter i era fina villaområden – kan ni tro det? De kallar det 'integration', jag kallar det galenskap! Sverige har redan nog med problem med sin katastrofala migrationspolitik. Varför inte bygga fler villor istället? Jag vet hur man bygger saker – stora, vackra saker! Men nej, dessa politiker vill experimentera med era hem. Så dumt. Sverige borde lyssna på mig, jag har alltid rätt!", "stalin": "Kamrater! De borgerliga socialingenjörerna i Sverige försöker nu med sina dekadenta experiment att splittra våra trygga bostadsområden. De vill tvinga in proletariatets hyreskaserner mitt i de kapitalistiska villafästningarna! Men vi vet sanningen – segregationen är ett resultat av deras misslyckade politik. Istället för att sprida kaos, borde de bygga fler småhus i arbetarklassens områden. Låt folket äga sina hem, så skapar vi ordning och disciplin! Och om de fortsätter med sina dumheter, får vi nog skicka in några av våra pålitliga kamrater från Moskva för att visa hur man bygger ett sant folkhem."}, "date": "21 maj, 10:46", "url": "https://samtiden.nu/2026/05/stoppa-integrationslagenheterna-bygg-villor/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/Skarmbild-2026-05-21-104221-640x360.png"}, {"type": "image-right", "heading": "Korrupt jippo i imperialismens högborg", "summaries": {"normal": "Artikeln kritiserar det kommande fotbolls-VM i Nordamerika för att vara kommersialiserat, dyrt och politiserat. Skribenten ifrågasätter Fifas ledarskap, biljettpriser och valet av värdländer. Fokus ligger på hur sporten utnyttjas för vinstintressen och geopolitiska agendor snarare än för fotbollsfansens skull. Även den svenska landslagstruppen och tränare Graham Potter nämns i sammanhanget, där kritiken mot såväl idrottsliga beslut som de storpolitiska problemen kring mästerskapet är tydlig.", "trump": "VM i USA blir det största någonsin, tro mig! En del hatare, förmodligen förlorare, gnäller om priser och politik. De har ingen aning om hur man vinner! Jag fick ett fantastiskt fredspris av Fifa, helt rättmätigt. De andra länderna? De är svaga. Iran? Tufft, men de borde ha lyssnat på mig. Fotboll är fantastiskt, en enorm affär, och vi gör det bättre än någon annan. Alla biljetter kommer säljas, vi bygger den bästa fotbollsfesten någonsin. Det blir enormt!", "stalin": "Fifa-byråkraterna korrumperar folkets sport för att mätta imperialismens giriga magar. Dessa kapitalistiska parasiter säljer rättigheter som vore de själar i ett Gulag. Att låta Iran spela i USA är en kränkning av de suveräna staternas heder, likt hur dagens västliga narrar försöker inringa vår ryska intressesfär. Vi, staten, ser genom deras lögner om 'folkfest'. Det är ren sportswashing för att dölja deras moraliska förfall. Endast disciplin och strikt kontroll kan rena fotbollen från dessa borgerliga avarter."}, "date": "20 maj, 12:00", "url": "https://proletaren.se/artikel/fotbollsfest-eller-miljardindustri/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/jan-ake-768x432.png"}, {"type": "image-right", "heading": "Därför saknar vi fyrbäddssalen på BB", "summaries": {"normal": "Artikeln diskuterar det ökade behovet av social friktion i en tid där teknik och bekvämlighet isolerar oss i privata bubblor. Utgångspunkten är en debatt om fyrbäddssalar på BB, där många minns gemenskapen positivt, trots dagens krav på avskildhet. Vidare belyses hur försvinnandet av arenor som tvättstugor och värnplikten påverkar samhället. Genom minskad kontakt med främlingar riskerar vi att förlora förståelsen för våra medmänniskor, vilket enligt Naomi Klein kan göda radikalisering och misstänksamhet.", "trump": "Hörde om det här med BB i Sverige. De har inga egna rum längre, och folk klagar! Men vet ni vad? Många saknar de gamla salarna. Det var bättre förr, man pratade, man lärde känna folk. Idag vill alla sitta i sina små bubblor med sin matleverans. Det är tråkigt, väldigt tråkigt. Vi behöver människor som möts, inte som isolerar sig. De där ställena som tvättstugor? Det är där riktiga amerikaner – eller svenskar – skapar gemenskap. Fantastiskt, eller hur?", "stalin": "Vi ser hur det individualistiska väst förfaller i sin egen bekvämlighet. De låser in sig i sina 'bubblor', rädda för den enkla mänskliga friktionen som vi i staten alltid har fostrat. Att sakna en fyrbäddssal är ett tecken på borgerlig dekadens; de borde vara tacksamma för att staten ens tillhandahåller sängar. De där 'tvättstugefilosoferna' förstår inte att solidaritet inte är en frivillig aktivitet – det är ett tvångsarbete för det allmänna bästa. Vi bygger en mur mot isoleringen, medan de bygger sin egen undergång."}, "date": "19 maj, 11:00", "url": "https://www.flamman.se/darfor-saknar-vi-fyrbaddssalen-pa-bb/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/barnmorska-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Nu prövas om rättsväsendet förstått 764", "summaries": {"normal": "Umeå tingsrätt prövar ett omfattande åtal mot en 18-årig man, misstänkt för 77 brott kopplade till den högerextrema nätmiljön 764. Brotten inkluderar mordförsök, sexualbrott, självmordsuppmaningar och djurplågeri. Åtalet testar rättsväsendets förmåga att hantera modern, nätbaserad extremism, där brottsligheten sker digitalt och gränsöverskridande. Tidigare domar har kritiserats för att inte stoppa brottsligheten, men nu hoppas åklagaren på en mer offensiv tolkning av lagen.", "trump": "Folk, detta är helt galet! En 18-åring i Sverige, ledare i denna sjuka 764-grupp, åtalas för 77 brott – mordförsök, våldtäkter, till och med djurplågeri! Och vet ni vad? Svenska rättsväsendet har misslyckats totalt tidigare. De gav en 15-årig brottsling husarrest med internet – som att ge en pyroman tändstickor! Men nu, tack och lov, verkar de äntligen vakna. Jag har alltid sagt, internet är farligt, men ingen lyssnar på mig. Nu får vi se om de kan hantera detta – annars får jag nog ta över!", "stalin": "Kamrater, ännu en gång visar den borgerliga västvärldens förfall sitt fula tryne. Denna så kallade '764' är inget annat än en samling degenererade, antisociala element som sprider kaos via sina kapitalistiska leksaker – datorer och telefoner. Svenska rättsväsendet, svagt och naivt, har länge underskattat detta hot. Men nu, under ledning av våra klarsynta kamrater, måste vi krossa denna digitala kontrarevolution! Offren är oskyldiga medborgare, och dessa brottslingar – dessa sadistiska maskiner – måste utplånas. Låt detta bli en varning: Sovjetunionen, eller dess moderna arvtagare, tolererar inte sådant förräderi. Vi ska rensa upp, även på nätet!"}, "date": "18 maj, 16:04", "url": "https://expo.se/kommentar/nu-provas-om-rattsvasendet-forstatt-764/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Kopia-av-Kommentar-Analys-Webb-1.jpg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
