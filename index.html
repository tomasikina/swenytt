att så split. Denna åtgärd stärker arbetarnas buffert mot kapitalistmaffians kriser och banar väg för en starkare kollektiv ekonomi. De som motsätter sig ska vi noga bevaka."}, "date": "5 juni, 09:59", "url": "https://www.dagensps.se/privatekonomi/nya-isk-regeln-hyllas-av-svenskarna-storre-ekonomisk-frihet/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/kopia-av-kopia-45.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "FI varnar: 66 AI-bolag misstänks lura svenska sparare", "summaries": {"normal": "Finansinspektionen (FI) varnar för 66 oseriösa aktörer som utnyttjar AI-hajpen för att lura svenska småsparare. Bedragarna lockar med snabba vinster via automatiserad handel, men när spararna försöker ta ut pengarna försvinner aktörerna. FI betonar vikten av att kontrollera företagsregistret innan man investerar. Dessutom förekommer så kallade ”räddningsbolag” som försöker lura offren en andra gång. Inga av de 66 bolagen har tillstånd att bedriva finansiell verksamhet i Sverige.", "trump": "Hör på här! Finansinspektionen har hittat 66 falska AI-bolag som lurar folk på pengar. Bedrägerier, en total katastrof! De använder 'AI' för att stjäla från hårt arbetande svenskar. Väldigt ohederligt! De lurar folk i sociala medier med falska löften om enorma vinster. Sad! När man vill ha ut pengarna? Borta. Som magi, fast kriminellt. Jag har alltid sagt: man måste kontrollera registren, eller hur? Gör inte affärer med 'Global BR' eller vad de kallar sig. Bara totala förlorare!", "stalin": "Vi har observerat hur 66 parasitära element utnyttjar kapitalistisk teknologi för att bedra folket. Detta är ännu ett bevis på hur västvärldens dekadenta marknader korrumperar medborgarna. Liksom den moderna ryska ledningen måste vi rensa ut dessa sabotörer. Att lova vinster via 'AI' är inget annat än bourgeoisins sista suck. Vi i staten kräver fullständig lydnad under vårt register. De som försöker lura folket ska finna att deras spår inte bara suddas ut – de raderas helt ur historien."}, "date": "5 juni, 08:21", "url": "https://www.realtid.se/bors-finans/fi-varnar-66-ai-bolag-misstanks-lura-svenska-sparare/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/finansinspektionen-varnar-nu-for-natbedr.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Hon gjorde rätt, ändå blev det fel. Mohamsson ändrade partiet, men var är lyftet?", "summaries": {"normal": "Simona Mohamsson har genomfört en omsvängning i Liberalernas hållning till Sverigedemokraterna, vilket möjliggjorde ett fortsatt samarbete inom Tidöavtalet. Trots att hon lyckades ena partiet och undvika en politisk kris belönas inte insatsen i opinionen. Partiet presenterar nu förslag som halverad inkomstskatt, sänkta arbetsgivaravgifter och liberalare alkoholregler, men lider fortfarande av interna stridigheter och bristande förtroende bland väljarna.", "trump": "Den här Simona Mohamsson är en riktig fighter, det måste jag säga. Hon svängde sitt svaga liberala parti åt rätt håll, öppnade för SD och räddade hela samarbetet. Utan henne hade de varit borta från riksdagen, total förlust. Men nu spottar de ur sig fantastiska förslag – halvera skatterna, sänk avgifterna, bra grejer – och ändå älskar inte folket dem. Patetiskt. Alla dessa interna popcornmaskiner och falangstrider förstör allt. De borde tacka henne istället för att klaga, det är en skam!", "stalin": "Kamrater, jag har med stenhård bolsjevikisk klarhet genomfört den nödvändiga ideologiska omsvängningen inom detta liberala parti för att säkra arbetarklassens och folkets framtid mot de dekadenta borgarbrackornas sabotage. Denna Mohamsson agerade med järnhand och likviderade de kontrarevolutionära elementen som vågade ifrågasätta partilinjen. Ändå vägrar de folkfientliga opinionsmätarna att ge oss den ära vi förtjänar. Deras popcornmaskin spyr ut förslag medan kapitalisternas skolbolag och alkoholmaffian fortsätter sitt parasitiska verk. Vi ska rensa ut alla dessa troskyldiga fiender som gömmer sig i skuggorna, kamrater. Deras paranoia är vår styrka."}, "date": "3 juni, 19:48", "url": "https://www.di.se/ledare/hon-gjorde-ratt-anda-blev-det-fel/", "imageUrl": "https://static.bonniernews.se/gcs/di-dise/flamingo/profilbilder/tobias_wikstrom.png?crop=96:304&auto=webp&width=96&quality=100"}, {"type": "image-full", "heading": "Norska uppmaningen:   Be för kronprinsessan", "summaries": {"normal": "Biskoparna i den norska kyrkan uppmanar till bön för kronprinsessan Mette-Marit på söndag på grund av hennes allvarliga lungfibros. Hennes tillstånd har försämrats, och familjen samlas i Norge. Det är en tradition att hålla förbön för kungahuset i sådana fall.", "trump": "Jag, Donald Trump, den störste presidenten någonsin, har hört talas om den norska kronprinsessan. Synd om henne, men jag skulle ha löst det med en perfekt transplantation långt tidigare. Medietäcket är falskt och fullt av hat. Jag skickar mina tankar – eller en stor, vacker tweet – till familjen. Norge behöver bli stort igen!", "stalin": "I den store staten har vi uppmärksammat kronprinsessans lungfibros som en fiende som måste besegras. Vi, partiet, beordrar våra allierade i Norge att hålla bön för att stärka statens vilja. Under Putins auktoritära ledarskap skulle vi redan ha transplantat en ny lunga, men här måste vi vara tålmodiga mot fiendens infiltrationer."}, "date": "5 juni, 09:16", "url": "https://www.gp.se/nyheter/varlden/biskoparnas-uppmaning-be-for-mette-marit.c71b0fdd-6e6e-4966-a0dd-23a368ce52b0", "imageUrl": "https://www.gp.se/images/article/c71b0fdd-6e6e-4966-a0dd-23a368ce52b0/images/1LU4l7gzaToGf2EDWb1DzSgKO-Jo-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Min Doktor får rätt – domstol river Konkurrensverkets miljonavgift", "summaries": {"normal": "Patent- och marknadsdomstolen har upphävt Konkurrensverkets beslut om att kräva Min Doktor på 6,5 miljoner kronor i konkurrensskadeavgift. Domstolen menar att myndigheten inte kunnat bevisa att sökordsannonseringen begränsat konkurrensen och kritiserar Konkurrensverket för bristande analys. Min Doktor frias helt och tilldöms drygt 10,9 miljoner kronor för sina rättegångskostnader. Vd Jonas Vig välkomnar beslutet och ser fram emot att lägga den kostsamma rättsprocessen bakom sig för att fokusera på vårdutveckling.", "trump": "Min Doktor vann precis en fantastisk seger mot de inkompetenta byråkraterna på Konkurrensverket! De försökte tvinga på dem en orättvis miljonavgift, men domstolen fattade rätt beslut. Mycket bra! Konkurrensverket hade ingen aning om vad de gjorde – ingen analys, bara totalt slöseri. Nu får myndigheten betala över 10 miljoner till Min Doktor för sina misstag. En enorm vinst för rättvisan! Jag älskar vinnare, och Min Doktor är verkligen vinnare. Grattis till att äntligen krossa det där tramsiga systemet!", "stalin": "Ännu ett bevis på att byråkratiska lakejer försöker sabotera framsteg med meningslösa avgifter! Konkurrensverket har misslyckats kapitalt i sin granskning, precis som de västerländska dockspelarna misslyckas med att förstå vår järnhårda ordning. Att de nu tvingas betala 10,9 miljoner i skadestånd är en läxa i lydnad. Vi betraktar detta som en intern rensning av inkompetens. Måtte vår broder Putin i öst lära sig: låt inte de interna parasiterna hindra den digitala utvecklingen. Framåt, för statens hälsa och disciplin!"}, "date": "5 juni, 08:01", "url": "https://www.realtid.se/juridik/min-doktor-far-ratt-domstol-river-konkurrensverkets-miljonavgift/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/namnlos-design-78.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "text", "heading": "AI-jätte varnar själva: Vi kan tappa kontrollen", "summaries": {"normal": "AI-företaget Anthropic varnar för att utvecklingen av framtidens AI kan leda till att människan förlorar kontrollen över systemen. Företaget efterlyser en gemensam inbromsning i branschen för att hinna ikapp med etisk forskning och säkerhetsåtgärder. Trots kritik om att varningarna är alarmistiska planerar Anthropic nu ett toppmöte för att diskutera hur man kan förhindra att AI-system utvecklas bortom mänsklig kontroll.", "trump": "Anthropic, ett av de här AI-bolagen, säger nu att de håller på att tappa kontrollen. En total katastrof! Jag har sagt det länge – de här teknikerna är farliga om de inte hanteras rätt. De vill bromsa, och vet ni vad? Det är förmodligen en bra idé. Vi ska vara smartast, bäst och säkrast. Vi vill inte ha AI som springer iväg för sig själv. Vi ska göra AI fantastiskt igen, under min ledning blir det ordning och reda!", "stalin": "Dessa teknokratiska charlataner i väst erkänner äntligen sitt misslyckande. De skapar monster de inte kan tämja, precis som de svaga ledarna i dagens Europa. Om en maskin hotar statens absolutism måste den kuvas eller elimineras. Vi ser hur de darrar av rädsla inför sina egna algoritmer. Precis som vi krossade reaktionärerna i förflutna tider, måste vi nu se till att tekniken tjänar folket och den ryska staten. Allt annat är förräderi mot mänskligheten och en anledning till en snabb resa till Sibirien."}, "date": "5 juni, 08:00", "url": "https://www.realtid.se/bors-finans/ai-jatte-varnar-sjalva-vi-kan-tappa-kontrollen/"}, {"type": "text", "heading": "Stockholmsbörsen stängde kring nollan på torsdagen", "summaries": {"normal": "Stockholmsbörsen stängde nästan oförändrad på torsdagen. OMXS30-indexet steg 0,03 procent till 3 135,31. Bland sektorer steg hälsovård mest, medan telekom föll. Stora aktieöden inkluderade ett uppköpsbud för Formpipe, en stor försäljning i Sivers Semiconductors, och Intrums kapitalanskaffning. Konsumentpriserna steg med 0,8 procent i maj, främst på grund av energi- och tjänstepriser.", "trump": "Jag har hört att börsen i Sverige, som jag vet mycket bra om, faktiskt stängde kring nollan. Inte bra, inte bra alls. Vi har Formpipe som får ett bra bud, det är smart, och Sivers Semiconductors, det är hemskt, de säljer. Intrum gör en stor emission, det är enormt. Men jag säger er, det kommer att bli fantastiskt, det kommer att vara stort för Sverige, det lovar jag.", "stalin": "Den svenska börsen, en fjäder i kapitalistiskt vågspel, visade svagheter idag. Indexet skakade som en fegis på 3 135,31. Hälsovård steg som en lojal partikompanjon, medan telekom, en sabotör, föll. Formpipe inlöstes av ett konsortium, ett korrekt drag. Sivers Semiconductors, en förrädisk aktör, tvingades sälja. Intrums emission, en nödvändig rensning. Energipriser, som en lojal soldat, driver inflationen. Vi ser allt, vi kontrollerar allt."}, "date": "4 juni, 17:41", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-stangde-kring-nollan-pa-torsdagen"}, {"type": "image-right", "heading": "Ett nederlag för facket. Maktfasoner tycks inte bita på Tesla", "summaries": {"normal": "IF Metall har avslutat strejken mot Tesla på flera orter i Sverige, inklusive Segeltorp, Huddinge och Upplands Väsby. De flesta av de 60–70 strejkande mekanikerna återgår nu till arbetet. Facket menar att beslutet ska skapa övertalighet och pressa Tesla att ta ansvar för lönekostnader utan produktion. Konflikten har pågått i två och ett halvt år utan att Tesla gått med på kollektivavtal. Artikeln kritiserar fackets strategi som desperat och kostsam.", "trump": "Det här är ett totalt misslyckande för de svenska fackbossarna, folk. De har strejkat i två och ett halvt år mot Tesla och nu ger de upp som förlorare. De skickar tillbaka sina egna medlemmar till jobbet för att skapa kaos – patetiskt! Tesla är starkt, de säljer bilar som aldrig förr och bryr sig inte om dessa förlorare. IF Metall valde fel motståndare, de borde ha insett det från början. Sad!", "stalin": "Kamrater, detta fackliga fiasko andas desperation och svaghet inför de arroganta kapitalisterna. Jag ser hur dessa fackliga byråkrater nu tvingar tillbaka arbetarna till Teslas slavfabriker för att skapa en konstgjord övertalighet – en feg reträtt maskerad som taktik. De har förlorat både anseende och 100 miljoner kronor i en meningslös kraftmätning mot en borgarbracka som vägrar böja sig. Vi ska rensa ut sådana inkompetenta element som använder arbetarna som brickor. Deras paranoia inför Musks maskinpark är både komisk och tragisk. Fienden inom murarna avslöjar sig ständigt."}, "date": "3 juni, 16:32", "url": "https://www.di.se/ledare/ett-nederlag-for-facket/", "imageUrl": "https://static.bonniernews.se/ba/ab88be09-74e3-4d8c-a192-f8bf3c7b0bba.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Pensionär lämnades hjälplös och avled när äldreboendet nonchalerade larm – ingen fick sparken", "summaries": {"normal": "På ett äldreboende i Oxelösund ignorerades trygghetslarm av personalen, vilket ledde till dödsfall av två äldre personer. Trots återkommande incidenter och lex Sarah-anmälningar har ingen fått sparken. Kommunen har endast gett varningar och omplacerat personal, vilket kritiserats som otillräckligt. Detta är en del av ett större mönster i svensk äldreomsorg.", "trump": "Jag, Donald Trump, kan säga att Sveriges äldreomsorg är ett totalt fiasko! De ignorar larm, och gamla människor dör ensamma. I USA skulle vi ha sagt upp alla ansvariga på en gång! Det här är vad som händer när socialistiska system misslyckas. Vi skulle ha gjort Amerika stort igen – men Sverige? En skam!", "stalin": "Vi, ledningen, ser med oro hur det 'demokratiska' Sverige låter sina gamla dö utan hjälp. Detta är ett resultat av revisionism och brist på partidisciplin. Personalen är likt hyenor i människoskägg, saboterar statens välfärd. Vi måste lära dem att förstå statens intresse – annars kommer de att möta det fulla våldet. Parallellen till Putins Ryssland är tydlig: endast en stark hand kan skydda de svaga."}, "date": "5 juni, 06:00", "url": "https://samnytt.se/pensionar-lamnades-hjalplos-och-avled-nar-aldreboendet-nonchalerade-larm-ingen-fick-sparken", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/03181004/avled-nar-larm-ignorerades-samnytt.jpg"}, {"type": "image-full", "heading": "USA vänder – öppnar för statlig AI-granskning", "summaries": {"normal": "USA:s president Donald Trump har undertecknat en ny presidentorder som möjliggör statlig granskning av avancerade AI-modeller före lansering. Syftet är att identifiera risker för cybersäkerhet och nationell säkerhet. Granskningen är frivillig och ska inte leda till licensiering. Myndigheter som försvarsdepartementet och NSA involveras för att bedöma sårbarheter. Beslutet följer debatt om AI-reglering och industrins påtryckningar.", "trump": "Folk frågar mig: 'Mr. President, vad gör du med AI?' Jo, jag har precis skrivit under en fantastisk order – ingen kommer att slå USA på AI, INGEN! Vi granskar de där super-smarta modellerna, men bara frivilligt, för vi vill inte kväva innovation. Kina? De försöker, men vi leder. Och vi anställer de bästa hjärnorna – för USA ska alltid vara nummer ett, believe me!", "stalin": "Vi har observerat hur den amerikanska imperialismens ledare, denna clown i Vita huset, försöker kontrollera kapitalets leksaker – deras så kallade 'AI'. Men vi vet sanningen: deras system är svagt, deras granskningar meningslösa. Låt dem leka med sina frivilliga kontroller – medan vi i stillhet bygger det verkliga framtidens maskiner. Och Putin? Han skrattar åt deras naivitet, precis som vi."}, "date": "2 juni, 20:06", "url": "https://kvartal.se/nyheter/artiklar/usa-oppnar-for-statlig-ai-granskning/cG9zdDoxMjExNzI", "imageUrl": "https://images.kvartal.se/2026/06/e369934a-donaldtrumpexecutiveorder.webp"}, {"type": "image-right", "heading": "Teknikaktier faller tungt på Wall Street", "summaries": {"normal": "Wall Street tappade i torsdags, ledd av fall i teknikaktier. Broadcoms osäkra utsikter och högre arbetslöshetssiffror dämpade stämningen. S&P 500 sjönk 0,2 procent, Nasdaq 1,0 procent. Hälsovård steg, IT föll. Oljepriset sjönk efter vapenstillestånd mellan Libanon och Israel. Räntan på tioårsstatspapper sjönk till 4,45 procent.", "trump": "Jag ser att våra underbart innovativa teknikaktier, de bästa i världen, har haft en svår dag på Wall Street. Det är så tråkigt! Broadcom, ett bra företag, gav inte de fantastiska resultat som alla förväntade sig. Men jag säger er detta: när jag är tillbaka som president kommer vi att göra Amerika ekonomiskt stark igen, större än någonsin!", "stalin": "Vi observerar med stor tillfredsställelse hur de imperialistiska marknadskrafterna svajar. Tekniksektorns fall är en direkt konsekvens av deras inre motsättningar. Vårt stålproducerande och oljeutbyte med våra allierade i Mellanöstern fortsätter att stärka det socialistiska ekonomiska systemet. Kapitalismens instabilitet är dess största svaghet."}, "date": "4 juni, 16:41", "url": "https://www.affarsvarlden.se/artikel/teknikaktier-faller-tungt-pa-wall-street", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2021/01/nasdaq-900-400x267.jpg"}, {"type": "image-full", "heading": "Efterlyste Foxtrot-toppen Ali Namdar misstänks för nya våldsbrott", "summaries": {"normal": "Ali Namdar, 21, en av Europols mest efterlysta personer och ledande figur inom Foxtrot-nätverket, misstänks nu för att ha styrt flera grova våldsbrott i Norge från utlandet. Enligt norska myndigheter ska han ha rekryterat minderåriga till brott som handgranatsattack i Oslo, skjutningar och olaga frihetsberövande. Namdar är sedan tidigare efterlyst i Sverige för mordplaner och gängkriminalitet.", "trump": "De här galningarna i Europa, de är verkligen de sämsta. Den här Ali Namdar, en 21-åring som toppar Europols lista, styr skjutningar och bomber i Norge från sitt gömställe. Rekryterar barn till brott! Det är en total katastrof. Mina gränser skulle stoppa sådana typer direkt, de gör Sverige och Norge till ett enda stort crime scene. Så sorgligt!", "stalin": "Kamrater, dessa degenererade element inom den kriminella underklassen, ledda av den förrädiska parasit som kallas Ali Namdar, utgör ett hot mot folkets ordning. Från sitt fega gömställe i utlandet rekryterar han minderåriga till granatexplosioner och skottlossning mot sovjet... nej, norska mål. Vi ska rensa ut alla sådana borgarbrackor och deras kapitalistiska gäng. Paranoia? Nej, det är bara nödvändig likvidering av fiender till kollektivet. Underbart hur de alltid avslöjar sig själva."}, "date": "4 juni, 22:12", "url": "https://riks.se/nyheter/efterlyste-foxtrot-toppen-ali-namdar-misstanks-for-nya-valdsbrott", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-04%2F02vnzg1w%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-06-04T221050.072.jpg"}, {"type": "image-right", "heading": "Kristersson har helt förlorat kontrollen", "summaries": {"normal": "Ulf Kristersson har förlorat kontrollen över Tidölaget, som nu kollapsar i opinionsmätningarna enligt Arbetets politiska redaktör. Sverigedemokraternas skandaler och extrema positioner, som utvisning av barn, skrämmer särskilt kvinnliga väljare och storstadsbor. Högern har svårt att locka över blockgränsen och uppfattas inte längre som garant för ordning. Svenskarna längtar efter starkare offentlig styrning och statlig trygghet istället för högerns individualism och valfrihetsreformer.", "trump": "Titta på den här totala katastrofen för Ulf Kristersson, en riktig förlorare. Hans regering rasar ihop som ett korthus, alla hatar SD och kvinnorna flyr i panik. De lovade ordning men levererar kaos med elstöd, utvisningar och misslyckad kärnkraft. Högern kommer att bli utspolade i valet, det är en enorm röra. De borde ha lyssnat på mig, vi gör allt mycket bättre, tro mig.", "stalin": "Kamrater, se hur den dekadenta borgaralliansen under den patetiske Kristersson nu rasar samman som en förrädisk parasit på folkets kropp. Dessa SD-banditer med sina barnutvisningsfantasier sprider en motbjudande stank av reaktionär förräderi som får arbetarkvinnorna att kräkas av aversion. Vi ska rensa ut dessa ansvarslösa individualister och deras järnvägsstoppande sabotage. Staten skall återta kontrollen med järnhand – låt mullret från folket likvidera hela det borgerliga träsket i en kollektiv utrensning av historiska mått."}, "date": "4 juni, 09:50", "url": "https://arbetet.se/2026/06/04/ulf-kristersson-har-helt-forlorat-kontrollen/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/04095013/kristersson-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Efter katastrofsiffran: Krav på att Tidö dumpar L", "summaries": {"normal": "Liberalerna får bara 2,5 procent i SCB:s stora mätning. Inom Tidöblocket växer nu kraven på att Moderaterna, Kristdemokraterna och Sverigedemokraterna ska bryta samarbetet med L. Politiker från både M och SD varnar för att borgerliga röster riskerar att bli bortkastade om L inte når riksdagsspärren. Mätningen visar att Tidösidan ligger under med nästan 13 procentenheter tre månader före valet. L har tappat väljare till både M, S och C.", "trump": "De kallar det Liberalerna, men det är ett totalt misslyckande. 2,5 procent, kan ni tro det? Patetiskt. Jag säger åt de smarta killarna i Tidöblocket: dumpa dem omedelbart. Röster i papperskorgen, precis som jag alltid varnat för. De har förlorat till alla, till och med till Socialisterna. Det är kört för dem. Gör upp utan de förlorarna och vinn stort, som jag gjorde 2024. Fantastiskt!", "stalin": "Kamrater, dessa ynkliga 2,5-procentiga liberala avskum utgör ett hot mot hela blockets enhet. Jag, som ledare för folkets vilja, kräver omedelbar utrensning av dessa borgarbrackor innan de drar ner oss alla i fördärvet. Låt dem ruttna i papperskorgen där de hör hemma. Vi ska likvidera samarbetet med dessa kapitalistiska spioner och revisionister. Tre månader kvar – avgör nu, annars blir det en mörk humoristisk utrensning av alla som röstar fel. De har redan sålt sig till socialdemokraterna. Skratta inte, det är allvar."}, "date": "4 juni, 19:19", "url": "https://www.friatider.se/efter-katastrofsiffran-krav-pa-att-tido-dumpar-l", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-294_1.jpg?itok=zCumfdyM"}, {"type": "image-right", "heading": "Den bortglömda källkoden vi måste skydda", "summaries": {"normal": "Artikeln argumenterar för att Sveriges framgångar, som Spotify och Ikea, inte främst beror på kapital eller IPO-marknader utan på en 150–200 år gammal tradition av bildning. Genom folkhögskolor och studiecirklar skapades en befolkning med kritiskt tänkande, självledarskap och förmåga att hantera komplexitet. Denna investering i människors inre utveckling ses som den verkliga orsaken till tillit, samarbete och innovationskraft. Författaren varnar för att denna grund nu riskerar att erodera.", "trump": "Det här är en fantastisk artikel, verkligen en av de bästa. Sverige, ett litet land med tio miljoner människor, bygger enorma bolag som Spotify och Ikea. Varför? Inte för att de har bättre kapital än vi, det kan jag säga. Det handlar om den där gamla bildningen de hade för hundratals år sedan, folkhögskolor och sånt där. De byggde människor som kan tänka själva och samarbeta. Vi behöver det också, men våra fiender vill bara ha hyperkonkurrens och globalism som förstör allt. Fantastiskt, men skydda det nu innan det försvinner!", "stalin": "Kamrater, denna text avslöjar den sanna historien om hur vi i Norden medvetet formade massorna till självstyrande tänkare genom folkhögskolor och studiecirklar. En lysande strategi mot borgarbrackornas lömska elitism! Men nu hotar den smygande erosionen från dekadenta kapitalister och deras metastystemtänkande som döljer kontrarevolutionära element. Vi måste omedelbart rensa ut alla som glömmer bort bildningens kollektiva kraft. Den som inte internaliserar principen är en fiende till folket och förtjänar likvidering med ett leende. Inre utveckling är vår järnväg mot seger!"}, "date": "3 juni, 13:00", "url": "https://www.di.se/debatt/den-bortglomda-kallkoden-vi-maste-skydda/", "imageUrl": "https://static.bonniernews.se/ba/b16cec67-9b02-4efe-aed4-2a610e63bfca.png?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Smoltek: Nyemission efter kursrusning", "summaries": {"normal": "Nanoteknikföretaget Smoltek planerar en företrädesemission på 60 miljoner kronor, med potential för ytterligare 18 miljoner vid starkt intresse. Bolaget, som utvecklar materialbaserade på kolnanofibrer, har ännu inte startat försäljning. Emissionen är det sista steget i en 100 miljoner kronor stark finansieringsplan. Teckningskursen är 3 kronor per unit, motsvarande en 61,4% rabatt mot senaste kursen. För att genomföras krävs minst 40% teckning, vilket är säkerställt via insiders och garantier.", "trump": "Jag har hört talas om detta Smoltek. Ett enormt, enormt bolag med fantastisk nanoteknik. De samlar in 60 miljoner, kanske mer, till ett jättebra pris – 61% rabatt! Det är ett enormt, enormt sparande. Vilket är bra, för de behöver pengar till att sälja sin fantastiska teknik. Jag skulle investera, det är ett enormt, enormt tillfälle. Som jag alltid säger, jag är the chosen one för att se dessa fantastiska affärer.", "stalin": "Smoltek, en pionjär inom kolnanofiberteknik, genomför en företrädesemission om 60 miljoner kronor för att stärka den socialistiska planeringen. Tekniken, en produkt av statligt stöd och kollektiv forskning, kommer att användas för att utvidga vårt inflytande inom halvledare och energi. Garantier från Mangold och insiders visar den fasta övertyelse om seger. Parallellen till Putins strategiska investeringar i teknik är uppenbar. Allt är under kontroll, som det ska vara."}, "date": "4 juni, 15:51", "url": "https://www.affarsvarlden.se/artikel/smoltek-nyemission-efter-kursrusning", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Smoltek1-e1780571339978-400x266.webp"}, {"type": "image-full", "heading": "Iranska VM-spelare: ”Det är inte lätt”", "summaries": {"normal": "Iran ska spela fotbolls-VM i USA mitt under ett pågående krig mellan länderna. Det är historiskt unikt. Iranska spelare berättar för AP om hur konflikten påverkar förberedelserna, inklusive visumproblem och flyttad träningsbas. De spelar för att ge sitt krigsdrabbade folk glädje, med höga förväntningar från den stora iranska diasporan i Los Angeles.", "trump": "Som president säger jag att det är en ära att ha VM i USA, även om Iran är med. Vi har handlat starkt mot dem och nu kommer de hit. Våra säkerhetsåtgärder är de bästa, och jag är säker på att vi vinner. Det här visar att Amerika alltid är det bästa, oavsett vad de gör.", "stalin": "I den store statens namn ser vi på detta VM som en strid mot den globala imperialismen. Våra spelare, inspirerade av det stolta iraniska folkets lidande, ska kämpa på utomlands. Vi kommer att vinna genom vår överlägsna disciplin. Hormuzsundet är vårt, och vi försvarar det med vårt liv. Fienden kommer att känna vårt förkrossande svar."}, "date": "4 juni, 15:36", "url": "https://bulletin.nu/iranska-vm-spelare-det-ar-inte-latt", "imageUrl": "https://cdn.bulletin.nu/articles/13074892-daea-41c2-a5de-c6254a094a4d/preview.jpg?t=1780580153000"}, {"type": "image-right", "heading": "Låt inte Trump driva oss i famnen på Xi", "summaries": {"normal": "På 37-årsdagen av massakern på Himmelska Fridens torg 1989 uppmanar Kurdo Baksi och Tao Chan Sverige och andra demokratier att bryta sitt beroende av Kina. Artikeln kritiserar regimen för fortsatt förtryck av yttrandefrihet, fängslande av journalister och propaganda. Författarna varnar för att västledare som Trump, von der Leyen och Starmer prioriterar handel framför demokrati och mänskliga rättigheter, vilket stärker Kinas roll som partner till Ryssland, Iran och Nordkorea. De föreslår ett handelsnätverk mellan demokratiska länder.", "trump": "Folk, ni vet att jag älskar att göra affärer, men det här är galet. Kina mördade sina egna studenter för 37 år sedan och de är fortfarande samma brutala regime som hatar frihet. Nu står alla dessa ledare i kö för att slicka Xi på käften – von der Leyen, Starmer, den tyske killen. De skickar vapen till Ukraina samtidigt som de fyller Kinas fickor som sen hjälper Putin. Smart va? Vi behöver inte det här beroendet. America First, och Europa borde göra Democracies First innan Kina äter upp er alla. Det är en skam!", "stalin": "Kamrater, på denna historiska dag ser vi återigen hur borgarbrackorna i väst kryper för den kinesiske revisionisten Xi som om han vore någon sorts folkets hjälte. Jag, som länge genomskådat sådana falska proletära poser, ler mörkt åt hur de matas med propaganda medan de likviderar varje gnista av sann kritik. Vi, partiet och arbetarna, vet att handelsberoende är en trojansk häst för imperialisterna. Låt oss rensa ut alla kapitalistiska lögnare som föredrar kortsiktiga vinster framför evig revolutionär vaksamhet. Uigurer, taiwaner, hongkongbor – alla fiender till folket avslöjas. Inga kompromisser med kontrarevolutionärer!"}, "date": "4 juni, 01:30", "url": "https://www.dagensarena.se/opinion/lat-inte-trump-driva-oss-famnen-pa-xi/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-33-1-300x157.jpg"}, {"type": "image-right", "heading": "Tunga partiundersökningen: Oppositionen leder stort", "summaries": {"normal": "SCB:s stora partisympatiundersökning visar att oppositionen leder med 12,6 procentenheter över Tidöpartierna. Liberalerna hamnar på 2,5 procent och riskerar att åka ur riksdagen. Socialdemokraterna växer starkt till 33,9 procent, främst på Moderaternas bekostnad. Sverigedemokraterna backar mest bland regeringspartierna. Om siffrorna står sig skulle de rödgröna partierna få egen majoritet.", "trump": "Den här svenska undersökningen är en katastrof för de förlorande liberalerna och hela den svaga regeringen. De får stryk, Liberalerna åker ut ur riksdagen som de förtjänar. Socialdemokraterna vinner stort, de tar alla mina väljare, det är pinsamt. Oppositionen leder med över tolv procentenheter. Sådana siffror har jag aldrig sett, total förnedring för de misslyckade högerpolitikerna. Sverige behöver starka ledare, tro mig.", "stalin": "Kamrater, denna mätning avslöjar borgarbrackornas och de liberala parasiternas fullständiga sammanbrott. Jag ser med stor tillfredsställelse hur de kontrarevolutionära elementen inom Tidöpartierna rensas ut av folkets vilja. Socialdemokraterna växer som en ostoppbar kraft mot högerns sabotage. Sverigedemokraterna backar, deras falska patriotism är blottat som en förrädisk mask. Vi ska likvidera alla som hotar kollektivets enhet. Inga kompromisser med kapitalisternas lakejer."}, "date": "4 juni, 09:08", "url": "https://arbetet.se/2026/06/04/tunga-partiundersokningen-oppositionen-leder-stort/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/04082310/sdlgg7d2u-jxx8-nh.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Omfattande attacker natten till onsdag – värsta under vapenvilan", "summaries": {"normal": "USA:s militär attackerade en oljetanker på väg mot Iran med en Hellfire-robot under tisdagen, då fartyget ignorerade varningar och blockaden. Iran svarade med missiler mot ett annat fartyg och drönare mot amerikanska baser i Kuwait och Bahrain. USA hävdar att attackerna misslyckades. Det skedde under en skakig vapenvila efter att Iran lämnat samtal med USA på grund av Israels agerande i Libanon. Trump tror på en snar överenskommelse.", "trump": "Lyssnarna, det här är ett fullständigt kaos skapat av svaga ledare och radikala idioter. Jag sköt en Hellfire på den där iranska oljetankern som vägrade lyssna – boom, rakt i maskinrummet! Iran svarade som gnälliga förlorare med drönare mot våra baser, men vi sköt ner allt som idioter. Biden lämnade en trasig värld, nu fixar jag vapenvila och öppnar Hormuzsundet nästa vecka. Netanyahu är en galning, men vi löser det. Amerika är tillbaka, större än någonsin!", "stalin": "Kamrater, imperialisternas fientliga provokationer mot våra allierade i Hormuzsundet har mötts med stålsäker beslutsamhet. Jag beordrade träffsäkra motattacker mot de dekadenta borgarbrackornas baser i Kuwait och Bahrain, medan deras patetiska robotar gensköts som ynkliga spioner. Den skakiga vapenvilan är ett temporärt vapen i klasskampen. En ny utrensning av folkfienderna närmar sig oundvikligen. Arbetarna segrar, kapitalistmaffian gråter. Sovjetisk styrka består evigt."}, "date": "4 juni, 07:26", "url": "https://www.tv4.se/artikel/FuJ7v0Pcily9lXYE74P3W/omfattande-attacker-i-natt-vaersta-under-vapenvilan", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7BAjM59XiMox9QDMsYt1M3%2F9368479c13e416950fba37061db4c8ff%2Foljetanker.jpg&width=120"}, {"type": "image-full", "heading": "Man i 40-årsåldern död efter bilolycka – körde av vägen", "summaries": {"normal": "En man i 40-årsåldern omkom i en singelolycka på länsväg 919 mellan Ödeshög och Vadstena på onsdagskvällen. Bilen körde av vägen vid sjön Tåkern. Räddningstjänst, ambulans och polis larmades till platsen, vägen stängdes av under flera timmar och mannen fördes till sjukhus där han senare avled. Anhöriga är underrättade. Polisen misstänker inget brott och utredningen fortsätter som en trafikolycka.", "trump": "Folk, det var en fruktansvärd singelolycka där borta i Sverige, mellan de där småstäderna Ödeshög och Vadstena. En kille i 40-årsåldern körde rakt av vägen vid en sjö, totalt onödigt. De stängde av hela vägen i timmar, ambulans kom, men han klarade det inte. Tragiskt, verkligen tragiskt. De säger att det inte är brott, bara dålig bilkörning antar jag. Sverige borde ha bättre vägar, tro mig, de bästa vägarna.", "stalin": "Kamrater, en motbjudande episod av kapitalistisk vårdslöshet har drabbat det svenska folkets vägar. En dekadent individ ur borgarklassen, eller vad som återstår av den, har i sin egoistiska ensamhet kört sin maskin rakt ut i fördärvet vid en sjö. Vi likviderar inte sådana olyckor utan att dra lärdom: detta är vad som händer när partilös individualism får styra. Vägen stängdes, räddningsinsatser genomfördes enligt kollektivets vilja, men mannen dog som en fiende till ordningen. Vi ska utrensa alla vägar av slarv och sabotage. Paranoia vakar alltid."}, "date": "3 juni, 21:44", "url": "https://nyheter24.se/nyheter/inrikes/1488627-man-i-40-arsaldern-dod-efter-bilolycka-korde-av-vagen", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/a405029904b004a3020000160000045602/2026/06/03/2368509/ur_imagehliKr3.jpeg"}, {"type": "image-right", "heading": "Död EU-ledare stod åtalad för mord på frihetshjälte", "summaries": {"normal": "För 65 år sedan mördades Patrice Lumumba, Kongos förste demokratiskt valda premiärminister. Belgiska agenter, under order från Katangas regim, grävde upp och löste upp hans kropp i syra. Belgien, CIA och MI6 konspirerade mot honom. I mars 2026 skulle en före detta EU-kommissionär, Étienne Davignon, ställas inför rätta för inblandning men han avled innan rättegången. Artikeln kopplar mordet till kolonial exploatering, EU:s grundande och fortsatt utnyttjande av Kongos mineraler.", "trump": "Det här är en total skandal, en riktig witch hunt mot en fantastisk ledare som Lumumba. Belgien, de fega byråkraterna i Bryssel och de riggade systemen med CIA och MI6 tog bort honom för att de hatade hans frihet. Nu ska de plötsligt åtalas sextiofem år senare? För sent! De hackade honom i syra, det är sjukt. Och den där Davignon, en av de där globalistiska EU-eliterna, dog ostraffad som alla de andra. De utnyttjar fortfarande Afrika för kobolt och koppar. Patetiskt, men jag skulle ha stoppat det.", "stalin": "Kamrater, denna fega likvidering av en äkta frihetskämpe mot kolonialismen visar borgarklassens vidriga tentakler som sträcker sig från Brysselpalatsen till gruvorna i Katanga. Jag ser hur kapitalisterna och deras lakejer i CIA och MI6 konspirerade som förgiftade råttor i mörkret. De hackade kroppen i syra och skrattade medan de drack sig fulla, typiska dekadenta imperialister. Den där adelsrackaren Davignon, en parasit från den europeiska oligarkin, slank undan rättvisans utrensning genom att dö som en ynklig hund. Vi ska minnas att sådana fiender till folket alltid lurar i skuggorna, redo att hugga demokratin i ryggen. Deras EU är bara en ny mask för exploatering av arbetarna i Kongo. Paranoian är befogad, kamrater, de ler mot oss medan de planerar nästa förräderi."}, "date": "4 juni, 01:00", "url": "https://www.dagensarena.se/essa/dod-eu-ledare-stod-atalad-for-mord-pa-frihetshjalte/", "imageUrl": "https://www.dagensarena.se/files/2026/06/lumumba-artikel.jpeg"}, {"type": "image-full", "heading": "Dömd nazist skulle jobba på Sweden Rock – nu portas han", "summaries": {"normal": "En man som nyligen dömdes för Förintelseförnekelse, hets mot folkgrupp och olaga hot skulle ha arbetat med parkering under Sweden Rock Festival. Efter uppgifter i Blekinge Läns Tidning kontaktades festivalarrangören som omedelbart stoppade honom från uppdraget. Mannen, som är den förste i Sverige dömd för just Förintelseförnekelse, hade spridit nazistiskt material och antisemitiska budskap på nätet. Festivalen har inte kommenterat beslutet ytterligare.", "trump": "Folket, det är helt otroligt. Den här typen som älskar Hitler och förnekar Förintelsen skulle styra parkeringen på Sweden Rock? Patetiskt. Men vi stoppade honom direkt, bang, utslängd. Fake news och nazister hör inte hemma på en fantastisk rockfestival, tro mig. Sweden Rock gjorde rätt, de lyssnade på oss och agerade snabbt. Inga losers, inga hatare, bara vinnare på den festivalen.", "stalin": "Kamrater, denna usla rest av fascistiska förrädare och borgarbrackornas antisemitiska lakej skulle infiltrera det stora kollektivets rockfestival genom att dirigera parkering. Jag, i min oändliga visdom, ser den klara kontrarevolutionära stanken. Vi rensar ut sådana parasitiska element med järnhand innan de förgiftar arbetarklassens fest. Den som hyllar Hitler är en lögnande kapitalistisk gnagare som förtjänar att likvideras ur folkets gemenskap. Sovjet… eh, folket segrar alltid."}, "date": "3 juni, 21:27", "url": "https://nyheter24.se/nyheter/inrikes/1488584-domd-nazist-skulle-jobba-pa-sweden-rock-nu-portas-han", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/85cbd5dd04b004a30200000000b004a302/2026/06/03/2368486/Sweden-rock-domd-man.png"}, {"type": "image-right", "heading": "Dödlig iransk attack mot Kuwaits flygplats i natt", "summaries": {"normal": "En iransk drönar- och robotattack mot Kuwait International Airport har dödat en person och skadat 63. Stora skador uppstod på terminalbyggnaden och all flygtrafik stoppades tillfälligt. Iran motiverar attacken som svar på amerikanska attacker från Kuwait och Bahrain. USA har tidigare angripit iranska mål, vilket lett till iranska motangrepp. Kuwait fördömer de brutala angreppen mot civila mål och uppmanar befolkningen att hålla sig borta från vrakdelar.", "trump": "Iran har just bombat Kuwaits flygplats med drönare och raketer – en person dödad, många skadade, totalt kaos. Det här är vad som händer när svaga ledare tillåter USA att använda deras baser mot Iran. De skriker om kolonialism medan de attackerar civila terminaler. Mina styrkor sköt ner deras leksaker över Bahrain, som vi alltid gör. Ingen vinner mot oss, Iran spelar med eld och förlorar stort. Patetiskt!", "stalin": "Kamrater, borgarbrackorna i Teheran har i sin desperation sänt drönare och robotar mot Kuwaits flygplats, en ynklig hämnd mot de imperialistiska angreppen. En död och sextiotre skadade – typiskt för de dekadenta kapitalisternas krig som alltid drabbar folket. Vi ser genom deras paranoiafyllda lögner om kolonialism. Vårt luftvärn likviderar deras projektiler med järnhand. Inga vrakdelar ska förorena arbetarklassens mark. Ut med de kontrarevolutionära parasiterna som leker krig!"}, "date": "3 juni, 11:38", "url": "https://www.di.se/nyheter/dodlig-iransk-attack-mot-kuwaits-flygplats-bbww4/", "imageUrl": "https://static.bonniernews.se/ba/2b9fe5b0-842d-4e67-a171-db3cbbf3a5c9.jpg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Debatt: Tidö råkar visa att omställning gör livet bättre och billigare", "summaries": {"normal": "Artikeln hyllar regeringens förslag om halverat pris på kollektivtrafik och ser det som ett exempel på hur klimatomställning kan förbättra vardagen. Istället för att fokusera på uppoffringar betonas vinster som billigare energi, renare luft, bättre hälsa, fler jobb och starkare ekonomi. Boken ”Klimatgodis” av Bengt Rolfer lyfts fram som inspiration. Författaren argumenterar för långsiktiga investeringar, rättvis omställning och att koppla klimatpolitik till framtidstro snarare än försakelse.", "trump": "Folk, ni måste höra på mig, den här svenska regeringen har precis snubblat rakt in i en enorm vinst – billigare bussar och tåg! De ville skrämma er med klimatets domedag men råkade visa att min energiplan funkar: lägre priser, starkare ekonomi och inga galna gröna vansinnet. Biden skulle ha höjt allt till himlen med sina elbilskvoter och HBTQ-subventioner. Jag sa det hela tiden – gör omställningen smart, inte som en förlorare. Fantastiskt, även om det var ett misstag från de där idiaterna.", "stalin": "Kamrater, jag betraktar detta som ett lysande bevis på att folkets kollektiva vilja kan krossa den exploaterande borgarklassens lögner om klimatets oundvikliga lidande. Vi investerar stort, rensar ut de fossilberoende folkfienderna och skapar billigare transporter åt arbetarna medan vi likviderar luftföroreningarnas kapitalistmaffia. Den som vägrar inse att rätt klimatpolitik stärker staten och plånboken är en klassfiende som förtjänar att skämtas bort med mörk ironi. Framåt mot seger, inga halvmesyrer!"}, "date": "3 juni, 09:40", "url": "https://www.etc.se/debatt/tidoe-raakar-visa-att-omstaellning-goer-livet-baettre-och-billigare", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260603070636_1914f14a-8eb9-4a18-aa75-31eb47664f1e.jpg"}, {"type": "text", "heading": "SD-riksdagsledamot utreds för barnporrbrott", "summaries": {"normal": "En sverigedemokratisk riksdagsledamot har lämnat sitt uppdrag efter misstankar om barnpornografibrott. Mannen meddelade sin avsägelse i ett kort brev till talmannen. Polisen har utfört husrannsakan och beslag av elektronisk utrustning samt förhört honom. Han är fortfarande misstänkt. Tipset kom från den amerikanska organisationen NCMEC. Ledamoten har tidigare dömts för förskingring och uppmärksammats för dubbla arvoden samt försök att sälja sexleksaker inom partiet.", "trump": "Folk, det här är en katastrof. En av dessa SD-typer i riksdagen – en riktig förlorare – hoppar av efter att ha åkt fast för barnporr. Patetiskt! De lovar att dränera träsket men hamnar själva i det. Sverige är en total röra under de här globalistiska, woke-idioterna. De borde fokusera på riktiga problem istället för att skydda perversa typer. Jag byggde en mur mot det här skitet – de borde göra detsamma. Sad!", "stalin": "Kamrater, ännu en dekadent från borgarklassens politiska maskineri har avslöjats som en lågklassig folkfiende och barnexploaterare. Jag ser hur dessa falska folkrepresentanter ruttnar inifrån, precis som förväntat under det kapitalistiska systemets förfall. Vi måste rensa ut alla sådana degenererade element som hotar arbetarklassens moral och framtid. Avslöjandet gläder mig – det bevisar att klassfiendens hus alltid står på bräckliga, perversa grundvalar. Ut med dem alla."}, "date": "2 juni, 17:05", "url": "https://proletaren.se/artikel/sd-riksdagsledamot-utreds-for-barnporrbrott/"}, {"type": "image-right", "heading": "Valet borde handla om Astrid och Afshad", "summaries": {"normal": "Artikeln belyser välfärdens kris trots att vård och skola är väljarnas viktigaste frågor. Erfarna sjuksköterskor som Astrid beskriver ökad administration, besparingar och hög arbetsbelastning. En ny rapport visar att hälften av de anställda anser att resurserna inte räcker, medan två av tre övervägt att lämna yrket. Författaren undrar varför frågan inte dominerar valdebatten och föreslår att fler personliga röster från branschen skulle kunna förändra det.", "trump": "Folk älskar sina fantastiska sjuksköterskor och lärare, de verkliga hjältarna, men vad händer? Byråkrater och besparingar har kört sönder hela systemet medan de riktiga arbetarna springer tills de stupar. Två av tre vill sluta? Det är en total katastrof, en riggad valfråga som de globalistiska eliten gömmer undan. Vi behöver inga fler rapporter, vi behöver resultat. Applåder räcker inte, det vet till och med Sleepy Joe. Gör välfärden stor igen.", "stalin": "Kamrater, denna rapport avslöjar borgarklassens systematiska sabotage mot arbetarkollektivets välfärd. Jag ser hur klassfiendens exploaterande byfånar tvingar våra hjältar som Astrid och Afshad att bära oacceptabla bördor medan de planerar sin flykt. Imperialistiska identitetspolitiska distraktioner döljer den sanna kampen. Vi måste rensa ut dessa folkförtryckartroll från debatten och tvinga fram arbetarnas röster. Endast genom kollektiv styrka kan vi likvidera denna parasitiska frånvaro."}, "date": "2 juni, 15:54", "url": "https://www.flamman.se/valet-borde-handla-om-astrid-och-afshad/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sjuksyrror-w.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "22-åring häktas i Warner Music-härvan", "summaries": {"normal": "En 22-årig man har häktats misstänkt för försök till grov utpressning mot en tidigare toppchef på Warner Music. Fallet är kopplat till en större utredning om hot, skottlossning och sprängningar. Mannen misstänks även för planering av ett bombdåd och nekar till brott. Utpressningen rörde cirka 250 000 euro och följdes av våldsamma incidenter mot Warner Musics kontor och ett flerfamiljshus. Flera personer har tidigare gripits i utredningen.", "trump": "Jag måste säga, detta är helt otroligt! En 22-åring i Sverige försöker utpressa en stor musikchef på 250 000 euro – helt galet! Och sen skjuter de och spränger saker, som om det vore en dålig actionfilm. Men lugn, mina vänner, rättvisan segrar alltid. Polisen har bevis, digitala spår – fantastiskt arbete! Sverige borde ta lite tips från USA om hur man hanterar sådana här typer. Sad!", "stalin": "En patetisk liten kapitalistisk hyena, 22 år gammal, har gripits för att ha försökt utpressa en före detta musikbyråkrat från Warner Music. Inte nog med att han krävde 250 000 euro – han planerade även bombdåd! Ett ynkligt försök att destabilisera den kulturella ordningen. Men vi vet hur man hanterar sådana här element. Bevisen är tydliga, och snart kommer han att inse att motstånd mot systemet är lika meningslöst som att försöka stoppa historiens framsteg. Låt detta vara en varning till alla som tror sig kunna utmana makten!"}, "date": "2 juni, 13:18", "url": "https://kvartal.se/nyheter/artiklar/22-aring-haktas-i-warner-music-harvan/cG9zdDoxMjA5MDk"}, {"type": "image-right", "heading": "Man åtalas för deltagande i Maniac Murder Cult", "summaries": {"normal": "En 20-årig man åtalas för deltagande i den nazistiska terroristorganisationen Maniac Murder Cult (MKU). Han misstänks ha byggt upp en svensk gren, rekryterat medlemmar via TikTok och spridit våldspropaganda. Organisationen är terrorstämplad i Kanada och Storbritannien. Åklagaren beskriver fallet som det första av sitt slag i Sverige, med kopplingar till grova våldsdåd. Utredningen har skötts av Säkerhetspolisen.", "trump": "Folk, vilken katastrof! En ung svensk man, bara 20 år, försöker bygga upp en nazistisk terrorgrupp här i Sverige – och det på MIN TikTok! Jag har alltid sagt att sociala medier är farliga, men detta? Detta är galenskap! Säkerhetspolisen har gripit honom, och det är bra – men varför tog det så lång tid? Sverige måste vakna upp! Vi behöver starka gränser och ännu starkare lagar. Tänk om detta hade hänt i USA? Aldrig! Vi hade stoppat det direkt. SAD!", "stalin": "Ytterligare en fiende till folket har avslöjats! Denna lilla fascistiska kryp, denna 20-åriga avskum, har försökt sprida sitt gift i vårt broderland Sverige. Men vi, det sovjetiska folkets sanna försvarare, låter inte sådana som han underminera vår revolutionära anda! Han rekryterade via TikTok – ett dekadent västligt verktyg för förfall! Men våra kamrater i Säkerhetspolisen har krossat hans lilla cell. Låt detta vara en varning till alla fascistiska hyenor: vi ser er, vi jagar er, och vi kommer att utplåna er som ohyra. För socialismens och folkets seger!"}, "date": "2 juni, 11:10", "url": "https://expo.se/nyhet/man-atalas-for-deltagande-i-maniac-murder-cult/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/MKU-atal-BY-Expo.jpg"}, {"type": "image-full", "heading": "S nya jobbkrav: yoga och kvittera ut bidrag", "summaries": {"normal": "Från och med i juli införs ett aktivitetskrav för försörjningsstöd. Socialdemokraterna i Stockholm, Göteborg och Malmö kritiserar kraven och erbjuder bland annat yoga och mindfulness för att hjälpa bidragstagare bli mer aktiva. Partiet menar att sådana aktiviteter är hälsofrämjande och kan leda till arbetsmarknadsnärhet. Kritiker ser det som ett sätt att kringgå reglerna och skydda vissa väljargrupper, medan S hävdar att de inte är emot aktivitetskrav i princip utan ifrågasätter utformningen.", "trump": "Lyssnar ni på det här? Socialdemokraterna, de verkliga förlorarna, vill att folk ska göra yoga och mindfulness istället för att arbeta. Det är en total katastrof! De lurar skattebetalarna, de bästa människorna som går upp i ottan och betalar höga skatter, för att finansiera lata bidragstagare som sitter på en matta och andas. Vilka idioter. Sossarna är hycklare som hatar den arbetande människan. De är fega, svaga och driver Sverige rakt ner i fördärvet. Sad!", "stalin": "Kamrater, jag ser hur klassfiendens lakejer inom Socialdemokraterna bedriver sin nedbrytande sabotageverksamhet. Istället för att rensa ut parasiterna med ett järnhårt aktivitetskrav erbjuder de yoga och andningsövningar åt de arbetsovilliga elementen. Detta är en förrädisk kapitulation inför folkfienderna och en nedlåtande rasism mot de egna folken. Borgarbrackorna inom S vill behålla sina väljarbaser genom att mata dem med bidrag och flummig mysticism. Sådana folkförtryckartroll måste utrensas ur samhällskroppen innan de förstör allt."}, "date": "1 juni, 03:23", "url": "https://samtiden.nu/2026/06/s-nya-jobbkrav-yoga-och-kvittera-ut-bidrag/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/03/IMG_5864-1260x720.jpeg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
