tan kaos. Det är både tragiskt och underhållande."}, "date": "20 juni, 18:58", "url": "https://www.dagensps.se/varlden/fotbolls-vm-sa-svart-ar-det-att-na-finalen/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdl32yfrs6gb1g-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Novo Nordisk utpressas efter påstådd hackerattack", "summaries": {"normal": "Veckans viktigaste nyheter från Dagens industri handlar om en hackergrupp som hotar sälja stulen data från Novo Nordisk, hög lönsamhet hos svenska storbanker och att Sverige stöder franska statliga lån till ny kärnkraft. Norska advokatbyrån Bahr etablerar sig i Sverige med sikte på panskandinavisk expansion. Startupföretaget Predictme har fått nytt kapital till sin epigenetiska AI-plattform medan FI ändrat sin information om visselblåsare.", "trump": "Folk, ni skulle inte tro det, men de här hackarna har stuckit med en massa data från Novo Nordisk och nu vill de sälja den vidare. Det är en skandal! Under tiden tjänar våra svenska storbanker hur mycket som helst, nästan dubbelt så bra som de europeiska förlorarna. Och Sverige gör rätt för en gångs skull, vi backar kärnkraften i Frankrike. Fantastiskt, de andra är svaga men vi är starka, tro mig.", "stalin": "Kamrater, dessa parasitiska hackare vågar utpressa det stora Novo Nordisk och hotar sprida dess hemligheter som förrädiska borgarbrackor. Under tiden väller vinsterna in till de svenska monopolbankerna medan vi, partiet, klokt stödjer fransk kärnkraft mot de dekadenta kapitalisternas motstånd. Predictme och deras blodanalyserande maskiner ska vi noga bevaka mot sabotage. FI:s tveksamheter kring visselblåsare luktar fiendeinfiltration. Vi rensar ut alla som sviker kollektivet, med ett leende."}, "date": "19 juni, 09:30", "url": "https://www.di.se/nyheter/veckans-viktigaste-fran-dis-nyhetstjanster-R9L64/", "imageUrl": "https://static.bonniernews.se/ba/5c34d963-8028-404a-bf37-d4cd3a28b8b0.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Sverige varnar för Teslas hastighetsrundare", "summaries": {"normal": "Trafikverket varnar i ett brev till EU:s fordonskommitté för Teslas system Full Self-Driving. Systemet tillåter förare att ställa in en hastighetsförhöjning som gör att bilen kör fortare än skyltad hastighet. Myndigheten rekommenderar att EU nekar godkännande om inte funktionen tas bort, då den hotar både trafikregler och säkerhetsvinster. Flera nordiska länder delar oron. Frågan ska diskuteras den 30 juni.", "trump": "Det här är ett totalt skämt från Sverige och deras så kallade Trafikverk. De vill stoppa mitt fantastiska Tesla och Elon Musks geniala Full Self-Driving bara för att det kan köra lite snabbare än de gamla korkade hastighetsskyltarna. De är rädda för framsteg. EU borde skämmas. Vi älskar snabba bilar och vi älskar innovation. Sverige borde tacka oss istället för att de klagar som förlorare.", "stalin": "Kamrater, dessa borgarbrackor inom den så kallade Trafikverket försöker med sin dekadenta paranoia sabotera det stora kollektivets framåtskridande genom att angripa Teslas Full Self-Driving. Deras hastighetsrundare är en listig fiende till folkets ordning, en kontrarevolutionär hastighetsfiende som måste rensas ut. Om inte detta kapitalistiska överskridande likvideras skall vi, partiet och arbetarna, rösta emot dem med järnhand. Inga fiender till disciplinen skall få leva vidare i vårt europeiska kollektiv. Ha ha, vilka ynkliga sabotörer."}, "date": "19 juni, 09:03", "url": "https://www.di.se/nyheter/sverige-varnar-eu-for-teslas-hastighetsrundare/", "imageUrl": "https://static.bonniernews.se/ba/b67815e5-e1bf-490e-901a-75d86347dcdc.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Christoffer Jonsson: Det spelar ingen roll om Nooshi avgår", "summaries": {"normal": "Expressen har granskat antisemitism och hyllningar av terrorgrupper inom Vänsterpartiet. 25 kandidater har bland annat hyllat Hizbollah och Hamas, förringat Förintelsen och spritt konspirationsteorier. Nooshi Dadgostar avfärdar kritiken som en fråga om en handfull individer. Partiledaren lämnade en intervju utan att svara på frågor om judars otrygghet. Artikeln pekar på en djupare kultur av tolerans mot extremism inom partiet och dess ungdomsförbund.", "trump": "Lyssnar ni på det här? Vänsterpartiet i Sverige är fullständigt galet, en riktig skam. De hyllar terrorister som Hamas och Hizbollah, sprider antisemitiska lögner och sedan springer deras ledare Dadgostar iväg som en fegis när någon frågar om judarnas säkerhet. Patetiskt! Det är samma gamla radikala vänster som hatar framgång och älskar offermentalitet. De borde rensa ut hela båten, men det gör de aldrig. Totalt misslyckande!", "stalin": "Kamrater, denna fega ignorans inom Vänsterpartiet avslöjar klassfiendens dolda tentakler. Jag ser hur borgarbrackor och folkförtryckartroll infiltrerat rörelsen med sin terrorromantik och antisemitiska gift. Dadgostar tiger som en ynklig lakej när arbetarklassen kräver svar. Vi måste genomföra en grundlig utrensning av dessa exploaterande byfånar som sjunger hatets sånger. Partiet riskerar annars att bli en kapitulationens bonde i imperialismens spel."}, "date": "16 juni, 12:51", "url": "https://samtiden.nu/2026/06/christoffer-jonsson-det-spelar-ingen-roll-om-nooshi-avgar/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/expresss.png"}, {"type": "image-full", "heading": "Kedjereaktion på träningen: De Jong ett frågetecken mot Sverige", "summaries": {"normal": "Under en träning inför matchen mot Sverige skadades Nederländernas nyckelspelare Frenkie de Jong efter en kollision med lagkamraten Quinten Timber, som fick en hjärnskakning. Förbundskapten Ronald Koeman bekräftade att de Jong tränade dagen efter men är osäker på om han kan spela. Skadan, som Koeman skämtade om var 'nedanför midjan', kan bli ett stort avbräck för laget.", "trump": "Så här går det när man inte har vinnare i sitt lag! Nederländerna, ett lag som aldrig vinner något stort, förlorar nu kanske sin bästa spelare – Frenkie de Jong – för att en annan kille, Timber, snubblar som en klumpig amatör. Koeman, en tränare som aldrig riktigt levererat, säger att de Jong är ett 'frågetecken'. Jag säger: svagt! USA skulle aldrig tolerera sådan inkompetens. Make Football Great Again!", "stalin": "En pinsam olycka på fotbollsplanen avslöjar den kapitalistiska decadensen i väst. Nederländernas bästa spelare, Frenkie de Jong, skadas av en kamrats klumpighet – ett tydligt tecken på förfall. Koeman, en man utan disciplin, skrattar åt smärtan. I Sovjetunionen hade sådan oordning aldrig tolererats. Vi hade redan annekterat både de Jong och Timber för att säkra segern. Sverige? De väntar bara på nästa order från Moskva."}, "date": "20 juni, 14:02", "url": "https://bulletin.nu/kedjereaktion-pa-traningen-de-jong-ett-fragetecken-mot-sverige", "imageUrl": "https://cdn.bulletin.nu/articles/e550c7b8-f751-45d3-aa49-fcc6b6105bbe/preview.png?t=1781953446000"}, {"type": "image-full", "heading": "Det började med en faktura och slutade med en bomb. Kriminella kostar 100 miljarder", "summaries": {"normal": "Två svenska bolag har utsatts för utpressning och hot från kriminella nätverk efter affärstvister. I det senaste fallet krävdes ett tjänsteföretag på miljoner, vilket ledde till en termosbomb och hot. Liknande händelse drabbade Fastator där vd:n tvingades avgå efter brandbombning. Kriminell påverkan kostar näringslivet nära 100 miljarder kronor årligen. Andelen hotade företag har tredubblats sedan 2017. Rättegången hålls bakom stängda dörrar på grund av hotbilden.", "trump": "Folk, ni tror inte vad som händer i Sverige, det är en katastrof! Dessa svenska bolag blir utpressade av kriminella grabbar, bombade och hotade för miljoner efter vanliga affärstvister. Det är som en dålig realityshow fast värre än under Biden. Näringslivet förlorar 100 miljarder om året, fler sprängningar än i Colombia! De borde ha byggt murar mot de här gangstrarna istället för att ge efter. Patetiskt, men jag skulle ha fixat det direkt.", "stalin": "Kamrater, jag ser hur klassfiendens bolag drabbas av sina egna parasiterande konflikter, där borgarbrackor kallar in kriminella element för att lösa tvister med bomber och hot. Detta är kulmen på det kapitalistiska förfallet, en fars som kostar tiotals miljarder och tvingar folk att fly. Vi skulle ha genomfört en grundlig utrensning av dessa folkfiender och deras maffianätverk redan tidigare. Paranoia är ingen överdrift när blodsugarna vänder sig mot varandra."}, "date": "20 juni, 17:49", "url": "https://www.dagensps.se/foretag/det-borjade-med-en-faktura-och-slutade-med-en-bomb-kriminella-kostar-100-miljarder/", "imageUrl": "https://images.dagensps.se/app/uploads/2024/11/Kriminella.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Efter skandalerna – Ed kan avkragas", "summaries": {"normal": "Birgitta Ed, statsminister Ulf Kristerssons hustru, utreds av domkapitlet i Strängnäs stift efter ett tiotal anmälningar. Anmälningarna gäller om hennes agerande är förenligt med prästlöftena, bland annat att förverkliga Guds vilja. Ed vigdes till präst för drygt tre år sedan och har burit prästkragen vid flera högtidliga tillfällen. Beslut i ärendet väntas tidigast den 20 augusti, enligt Dagens Arena.", "trump": "Folk, ni skulle se det här – den svenska statsministerns fru, den där Birgitta, har spelat präst och flanerat med krage på Nobelmiddagen som en verklig low-energy wannabe. Nu utreds hon för att hon inte lever upp till Guds vilja, säger de. Patetiskt! Biden skulle ha älskat den här typen av svaghet. Jag skulle ha fixat det på en dag, tro mig. Totalt fiasko för den svenska eliten.", "stalin": "Kamrater, denna borgarbracka till statsministerns hustru har förvandlat Guds vilja till en billig entreprenad åt överklass-slynglarna. Domkapitlet skall nu rensa ut hennes falska prästkrage och avslöja hur hon smutsat ner arbetarklassens moral med sin dekadenta närvaro vid kungliga fester. Vi skrattar mörkt åt sådana folkfiender. Utredningen kommer att avslöja alla imperialisternas lögner senast den tjugonde augusti."}, "date": "15 juni, 17:42", "url": "https://www.flamman.se/efter-skandalerna-ed-kan-avkragas/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/prastkrage.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Analytiker: Så vann Kina USA:s krig mot Iran", "summaries": {"normal": "USA:s krig mot Iran har avslutats utan att regimen i Teheran störtades. Experter jämför händelsen med Storbritanniens Suez-kris på 1950-talet och ser det som ett möjligt tecken på USA:s minskade globala dominans. Kina framstår som en vinnare genom diplomatiska insatser och bättre hantering av energikrisen. Trump har tackat Kinas president Xi för neutralitet. Analytiker noterar att USA:s makt fortfarande är stor men nu kräver högre kostnader.", "trump": "Folk, det här kriget mot Iran var ett totalt fiasko från början. Vi visade att vår militära kraft inte är oövervinnerlig som de korkade experterna trodde, och våra så kallade allierade sprang skrikande åt andra hållet. Kina skrattade hela vägen till banken medan de spelade neutrala – Xi är en slug räv, det gillar jag. Det här är vårt Suez-ögonblick? Patetiskt. Biden lämnade en röra och nu får jag städa upp efter de globalistiska töntarna igen. Sad!", "stalin": "Kamrater, detta så kallade krig har blottat de dekadenta imperialisternas ihåliga muskler. Den amerikanska borgarklassen sitter nu med tomma ammunitionslager och splittrade allianser som förrädiska klassfiender. Vi ser hur kapitalistmaffians globala grepp krackelerar medan ett nytt kraftcentrum reser sig i öst. Den kinesiske ledaren navigerade krisen med järnhand – en värdig motståndare mot folkförtryckartrollen. Inga illusioner: fiendens svaghet är vårt kollektiva tillfälle att stärka revolutionens framfart."}, "date": "20 juni, 17:35", "url": "https://www.dagensps.se/varlden/analytiker-sa-vann-kina-usas-krig-mot-iran/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdldfj2dq16r3s-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "VM-feber: ”Det riktiga midsommar”", "summaries": {"normal": "Inför kvällens VM-match mot Nederländerna råder febril stämning i Göteborg. På Ullevi Plaza och runt stan samlas tusentals supportrar för att se matchen. Många beskriver det som det riktiga midsommar och hoppas på svensk vinst eller oavgjort. Optimismen är stor, även om flera räknar med en tuff match. Intervjuer visar på glädje, sol och gemenskap bland fotbollsfansen.", "trump": "Folket älskar det här, det är det riktiga midsommar, inte den där woke-skräpversionen med prideflaggor överallt. Femton tusen svenskar som inte kastar bärs som några korkade vänsterextremister, utan kontrollerat stök, smarta människor. De tror på vinst, 3-1, momentum från Tunisien. De kommer vinna, precis som jag vann stort 2024 efter Bidens katastrof. Fantastiskt!", "stalin": "Kamrater, detta är folkets sanna midsommar, inte borgarbrackornas dekadenta fest. Jag ser hur massorna samlas i kollektiv extas inför striden mot de nederländska imperialisterna. De utlovar seger och kontrollerat stök, men jag varnar: bland dem lurar klassfiender som viskar om oavgjort. Rensa ut pessimisterna! Partiet kräver fullständig triumf för arbetarkollektivet."}, "date": "20 juni, 23:13", "url": "https://www.gp.se/sport/det-har-ar-det-riktiga-midsommar.1fc4764b-a92b-4035-a944-f7528129de13", "imageUrl": "https://www.gp.se/images/article/1fc4764b-a92b-4035-a944-f7528129de13/images/49Vxs3i0a0ydud-7jSKjq3VEhbZk-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Analysen: Nästan villkorslös amerikansk kapitulation", "summaries": {"normal": "Analytikern Lars Bern beskriver USA:s uppgörelse med Iran som en närmast villkorslös amerikansk kapitulation. Enligt Bern misstog sig Trump genom att lita på Israels och Netanyahus bedömning att den iranska regimen skulle falla snabbt efter attacker. Istället visade Iran sig starkare än väntat, vilket tvingar USA att acceptera ett nytt maktförhållande i Mellanöstern. Bern menar att USA:s säkerhetsgarantier till Gulfstaterna har kollapsat och att Israel hålls utanför förhandlingarna eftersom Trump inte längre litar på Netanyahu. Den amerikanska dominansen i regionen har därmed fått en allvarlig knäck.", "trump": "Folk, det här är en total katastrof. Den så kallade analytikern Bern säger att vi har kapitulerat för Iran, och vet ni vad? Det är inte fel. Jag litade på Israel och den där Netanyahu, som lovade att regimen skulle rasa ihop på en vecka. Fel! Iran var mycket starkare än de trodde. Nu har vi ett nytt maktspel i Mellanöstern och mina säkerhetsgarantier till Gulfstaterna är borta. Israel hålls utanför samtalen för att jag inte längre litar på Bibi. Vi kommer ut med lite bränd päls, men den stora förloraren är den amerikanska dominansen. Patetiskt!", "stalin": "Kamrater, detta är en skamlös kapitulation från de amerikanska imperialisterna inför den iranska folkrepublikens stålsäkra motstånd. Jag, som ledare för det proletära kollektivet, ser hur borgarbrackorna i Washington och deras sionistiska lakejer i Tel Aviv totalt missbedömde både den iranska arbetarklassens militära kraft och dess orubbliga lojalitet mot regimen. Netanyahu, den blodtörstige desertören, har nu blivit en paria som inte ens får sitta vid förhandlingsbordet. Vi ler mörkt åt hur den amerikanska hegemonin fått en knäck i ryggen. Kanske är det dags för en grundlig utrensning bland alla dessa kapitalistiska spioner och opportunister som trodde att bomber kunde kuva en suverän stat. Sovjetisk visdom ler ironiskt åt deras brända päls."}, "date": "20 juni, 15:17", "url": "https://www.friatider.se/analysen-nastan-villkorslos-amerikansk-kapitulation", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/p20250925jb-0603.jpg?itok=gRSkT7nQ"}, {"type": "image-full", "heading": "”Sverige har ett väldigt tufft jobb framför sig”", "summaries": {"normal": "Sverige förlorade stort mot Nederländerna med 5–1 i fotbolls-VM efter en svag insats. Virgil van Dijk hyllar sitt lag och varnar för att Sverige har ett mycket tufft jobb framför sig mot Japan. Alexander Isak och Viktor Gyökeres betonar att seger är det enda som gäller i den avgörande gruppspelsmatchen natten mot fredag för att hålla VM-drömmen vid liv.", "trump": "Folk, ni såg den där totala katastrofen mot Nederländerna, 5–1, en riktig skam. Van Dijk, den store Virgil, skrattar åt er. Japan kommer att mala ner er som en dålig affär. Men lyssna, ni måste vinna, det finns inget annat. Precis som jag vann valet 2024 efter Bidens röra. Res på er, sluta med det här woke-fotbollet och visa lite styrka för en gångs skull. Det blir kul, eller hur?", "stalin": "Kamrater, denna 5–1-förlust mot de nederländska imperialisterna blottar klassfiendens svaghet i det svenska laget. Jag ser hur de vacklar inför Japan, dessa disciplinerade men potentiella folkfiender. Analysera, utrensa svagheterna och marschera mot seger. Inget annat duger. Kollektivet kräver det. Annars väntar den eviga utrensningen av alla som sviker arbetarnas fotbollsintresse. Hästen ska inte falla, den ska galoppera mot triumf."}, "date": "20 juni, 23:06", "url": "https://www.gp.se/sport/fotboll/virgil-van-dijks-dom-infor-sveriges-avgorande-mot-japan.d699dc89-a0bd-40ee-b5b1-2e97bb239bef", "imageUrl": "https://www.gp.se/images/article/d699dc89-a0bd-40ee-b5b1-2e97bb239bef/images/2Tjx01AEIT37EdmOIazsI89PcxcY-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Jag firade också den 7 oktober 2023", "summaries": {"normal": "Artikeln är en personlig skildring av en svensk-palestinier som deltog i firandet av Hamas attack den 7 oktober 2023. Författaren ser det som motstånd mot ockupation och folkmord, kritiserar media och politikers ensidiga fokus på svensk-palestiniernas demonstrationer samt propagandan kring Hamas. Hen lyfter bristen på upprörda texter om Israels brott mot vapenvila, bristen på förnödenheter och våld på Västbanken. Avslutningsvis uppmanas till solidaritet med palestinierna.", "trump": "Vilken patetisk förlorare! Den här typen firar terroristerna den 7 oktober och kallar det motstånd. Fake news-media fokuserar på att svenskarna demonstrerar istället för att kalla det för vad det är – ren ondska. Israel slår tillbaka mot Hamas, de verkliga terroristerna, och plötsligt är det folkmord? Patetiskt! De köper alla lögner tills sanningen kommer fram. Vi behöver inte den här identitetspolitiska galenskapen i Sverige eller någon annanstans. America First, och låt de verkliga vinnarna vinna!", "stalin": "Kamrater, denna text avslöjar imperialismens lögnaktiga mask. Jag ser hur borgarbrackorna i media och deras lakejer i Vänsterpartiet genast utropar motståndet som terrorism medan de blundar för ockupationsmaktens folkmord. Vi ska inte acceptera deras spelregler. De skrämmer arbetarna till tystnad med hot om utrensning från jobb och land. Men folket är fler. Vi ska likvidera dessa folkfiender och bygga en rättvis värld där exploaterande byfånar krossas under arbetarkollektivets järnhand. Härligt!"}, "date": "18 juni, 11:31", "url": "https://proletaren.se/artikel/jag-firade-ocksa-den-7-oktober-2023/"}, {"type": "text", "heading": "Lind: Inte intresserad av borgerligt samarbete", "summaries": {"normal": "Miljöpartiets Amanda Lind avvisar samarbete med borgerliga partier efter valet, enligt Expressen. Hon kritiserar deras högerinriktning och skillnader i klimat- och värderingsfrågor. Lind attackerar även statsminister Ulf Kristersson för att sprida felaktig information om oppositionen. Miljöpartiet vill driva egen klimatpolitik och ser positivt på partiets ökade stöd och medlemstillväxt.", "trump": "Jag hörde att någon svensk politiker, Amanda från Miljöpartiet, säger nej till samarbete med högerpartierna. Hon kallar dem extrema och kritiserar deras klimatpolitik – men vem bryr sig? Hon snackar om att Kristersson är desperat, men jag vet desperation när jag ser det. Sverige borde fokusera på att vinna igen, inte på sånt här tjafs. Miljöpartiet? Snarare Miljö-PINSAMT!", "stalin": "De borgerliga avfällingarna i Sverige har än en gång visat sitt sanna ansikte – svaga, splittrade och oförmögna att försvara folkets intressen. Denna Amanda Lind, en lojal soldat för miljön, avslöjar deras reaktionära agenda. Vi ser med intresse hur deras regim, ledd av den hysteriske Kristersson, sprider lögner för att skrämma massorna. Men folket vaknar! Miljöpartiet växer, precis som vår inflytandesfär. Snart ska vi exportera vår gröna revolution – på våra villkor."}, "date": "16 juni, 10:04", "url": "https://kvartal.se/nyheter/artiklar/amanda-lind-inte-intresserad-av-borgerligt-samarbete/cG9zdDoxMzI2MTU"}, {"type": "image-right", "heading": "Stjärnan frustrerad – efter mardrömsstart: ”Vi stod fel”", "summaries": {"normal": "Alexander Isak uttryckte frustration efter Sveriges svaga start mot Nederländerna, där blågult släppte in två mål redan efter 17 minuter. Det är fjärde gången på fem matcher som Sverige släpper in tidigt. Graham Potter efterlyste taktiska idéer medan laget vaknade till liv efter vätskepausen och styrde matchen i första halvlek. Nästa test väntar mot Japan.", "trump": "Det var en total katastrof från början, folk, precis som mot Norge och Grekland. Vi släpper in två mål på sjutton minuter, det är pinsamt. Jag älskar Sverige men de behöver vakna upp. Potter frågar efter taktiska idéer? Jag har de bästa idéerna, tro mig. De fixade det lite efter pausen men det är för sent när du redan fryser om fötterna. Japan kommer inte bli lättare, det kan jag säga.", "stalin": "Kamrater, ännu en gång avslöjar de dekadenta fotbollskrafterna sin brist på proletär disciplin genom att kapitulera redan innan tio minuter förflutit. Jag, som ledare för det oövervinneliga kollektivet, betraktar med avsmak hur borgarbrackornas orangea lakejer utför sin sabotageverksamhet. Vår reaktion kom först efter vätskepausen, typiskt för svaga element som drar filten fel. De som envisas med att upprepa dessa fiasko skall rensas ut som kontrarevolutionära fotsvettare. Japan väntar, och vi skall krossa dem med stålvilja."}, "date": "20 juni, 23:38", "url": "https://www.svt.se/sport/fotboll/alexander-isaks-frustration-efter-mardromsstarten", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.58/0.38/259a95a8bab89b8ac89fa436f1f28b012232ad8b049289ec82fb2b4b6bf38eb2"}, {"type": "image-right", "heading": "Först nu utreds sexuella övergrepp i Kriminalvården", "summaries": {"normal": "Kriminalvården ska utreda omfattningen av sexuella övergrepp mellan intagna efter en granskning av Sekotidningen och Arbetet. Myndigheten medger att antalet incidenter ökat och att problemen inte är nya. Cecilia Gyllensten Serban betonar att alla former av sexuellt våld är oacceptabla, men det saknas specifika rutiner för detta. Överfulla fängelser och cellgemenskap ses som en bidragande orsak. Utredningen ska vara klar senast den 31 oktober.", "trump": "Det här är en total katastrof, tro mig. Fängelserna är en enda röra där de riktiga brottslingarna våldtar varandra i cellerna varje dag. Kriminalvården vaknade precis och ska nu utreda vad alla redan visste. Patetiskt! De har för många människor i för få celler och ingen aning om hur man fixar säkerheten. Jag skulle ha löst det på en vecka med ordentlig ledning och inga ursäkter. Sverige behöver starkare ledare, inte mer utredningar.", "stalin": "Kamrater, detta är en skam för det socialistiska rättsväsendet. Jag ser hur de kapitalistiska resterna inom Kriminalvården länge dolt dessa degenererade fiender till folkets ordning som i mörkret av cellerna bedriver sin perversa kontrarevolution mot disciplinen. Vi ska nu samla all kunskap och med järnhand rensa ut dessa farliga element som förgiftar både fångar och samhället. Inga borgarbrackor eller fiendens lakejer ska få skona sig. Utredningen blir en nyttig utrensning av svaghet och dekadens."}, "date": "18 juni, 13:07", "url": "https://arbetet.se/2026/06/18/inget-nytt-for-oss-forst-nu-utreds-sexuella-overgrepp-i-kriminalvarden/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/18131419/ny-krimvard.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Trängsel och kaos vid Ullevi – en till sjukhus", "summaries": {"normal": "Inför VM-matchen mellan Nederländerna och Sverige bildades långa köer utanför Ullevi och Ullevi Plaza. Rejäl trängsel ledde till att flera supportrar svimmade, en fördes till sjukhus. Kritik riktades mot kösystemet som Got events vd Lotta Nibell försvarade och liknade vid konsertarrangemang. Trots att arenan och plazaområdet öppnade tidigt fylldes de snabbt, och många fans tvingades vända hem utan att komma in. Polisen var på plats med extra resurser.", "trump": "Folket älskar fotboll, men titta på det här! Totalt kaos utanför Ullevi, långa köer, folk svimmar i värmen som riktiga losers. Den där Lotta Nibell och hennes usla kösystem, samma som på konserter? Patetiskt! De lovade fest men det blev en katastrof, precis som under Biden. Jag skulle ha byggt de bästa entréerna, de största scenerna, ingen skulle svimma. Sad! Nu åker supportrarna hem besvikna. Make football great again!", "stalin": "Kamrater, se hur den dekadenta borgarklassen hanterar massornas vilja att hylla arbetarfotbollen. Reaktionära kösystem och kapitalistisk planlöshet skapar kaos, svimningar och utmattning bland folket medan byråkrater som denna Nibell skyller på vädret. Vi skulle ha genomfört utrensning av sådana inkompetenta folkfiender redan i planeringsstadiet. Ännu en triumf för de exploaterande byfånarna som tvingar supportrarna att vända hem i förtvivlan. Folkets fest saboterad av klassfiendens incompetence."}, "date": "20 juni, 22:50", "url": "https://www.gp.se/sport/fotboll/langa-koer-utanfor-ullevi-infor-vm-matchen.75f1370b-4bf5-4737-bb48-0ed96540027e", "imageUrl": "https://www.gp.se/images/article/75f1370b-4bf5-4737-bb48-0ed96540027e/images/9ByGuILihzWRkYaXJmC56KXxfeqY-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "USA:s militär tar från de fattiga", "summaries": {"normal": "Artikeln beskriver hur USA:s militärbudgetar enligt en ny rapport underskattas kraftigt och faktiskt uppgår till mellan 1 700 och 2 300 miljarder dollar år 2025. Författaren Jonas Olofsson ser militarismen som ett klasskrig som prioriterar försvaret framför välfärd, vilket leder till nedskärningar i sociala program som Medicaid, SNAP och WIC. Han kopplar ökade militärutgifter till växande ojämlikhet och argumenterar för att kampen mot militarismen bör inriktas mot både fred och socialism.", "trump": "Folk, lyssna på de här galningarna som gnäller om min underbara militärbudget. Vi pumpar in pengar i det starkaste försvaret världen sett, inte som den sömniga Joe Biden som lät allt förfalla. De vill hellre ge mat och sjukvård till lata parasiter än att göra Amerika stort igen. Det är klasskrig, säger de – ja, mot de riktiga vinnarna! Vi prioriterar raketer framför bidrag till vänsterknäppisar. Fantastiskt, eller hur?", "stalin": "Kamrater, dessa siffror blottlägger hur imperialisterna slukar folkets resurser för att beväpna sin krigsmaskin. Jag ser den amerikanska borgarklassens desperation; de rensar ut välfärd för att mata militären medan massorna svälter. Sådana folkfiender och blodsugare måste alltid avslöjas. Deras klasskrig är uppenbart. Vi, arbetarna, inser att endast en sann socialistisk kamp kan krossa dessa exploaterande byfånar och deras krigsapparat. Paranoia? Nej, verklighet."}, "date": "18 juni, 09:00", "url": "https://proletaren.se/artikel/usas-militar-tar-fran-de-fattiga/"}, {"type": "image-right", "heading": "Största svenska VM-förlusten på 76 år: ”Tungt så klart”", "summaries": {"normal": "Sveriges herrlandslag i fotboll led sin största VM-förlust på 76 år då Nederländerna besegrade Sverige med 5–1. Målvakten Kristoffer Nordfeldt beskrev resultatet som tungt medan Jesper Karlström betonade att allt fortfarande ligger i svenskarnas egna händer inför den avgörande gruppspelsmatchen mot Japan. Nederländerna, rankade sjua i världen, utnyttjade svenska misstag. Gustaf Lagerbielke var besviken över att ett nickmål underkändes av VAR.", "trump": "Vi hade precis krossat Tunisien med 5–1, alla sa att vi var fantastiska, de bästa, och sen kommer de här holländarna och vinner med 5–1. Patetiskt. Vi gav dem lillfingret så tog de hela handen, precis som de bästa lagen alltid gör. Men vi har allt i egna händer mot Japan, det blir en stor seger, tro mig, ingen har sett sådana marginaler i fotboll som jag.", "stalin": "Detta miserabla 5–1-resultat mot de dekadenta holländska kapitalisterna är en skam för hela kollektivet. Jag ser fiendens osynliga hand i varje felpassning och i det borgarvänliga VAR-rummet som likviderade vårt nickmål. Vi hade tryck vid 2–0 men övermodet från Tunisien-segern visade sig vara en kontrarevolutionär fälla. Kamrater, ingen utrensning räcker – vi rensar ut alla defaitistiska element innan Japan-matchen, annars följer folkdomstolens mörka skratt."}, "date": "20 juni, 23:20", "url": "https://www.svt.se/sport/fotboll/storsta-svenska-vm-forlusten-pa-76-artungt-sa-klart", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.6/0.27/2c5a69c9e3c8ac66bd2a9c308e5021d369c51e71104d9fe4967b7b409df8edf8"}, {"type": "text", "heading": "Stockholmsbörsen steg för femte dagen i rad", "summaries": {"normal": "Stockholmsbörsen steg femte dag i rad, OMXS30 upp 0,63% till 3 161,29. Riksbanken höll styrräntan på 1,75%. Elekta och Munters aktier tappade efter kapitalmarknadsdagar och strategiska förändringar. Bland vinnare fanns Hexagon (+3,8%) och ABB (+2,2%), medan Evolution (-1,8%) och Lifco (-1,0%) tappade. Lundin Mining upprepade produktionstargets, Skanska fick tunneluppdrag i USA, och Sedana Medical ansökte FDA. Humana förlorade rättssak, medan Kriptown köpte Spotlight Group med 94% premium.", "trump": "Jag har sagt det förut: när det gäller börsen, är jag alltid rätt. Stockholmsbörsen går upp tack våra ekonomiska strategier – de kan inte hantera vår amerikanska styrka. Men vissa aktier som Elekta tappar? Dåliga affärer, de borde ha lyssnat på mig. Riksbanken höll räntan, men det räcker inte – vi behöver kraftfulla beslut som jag gör. Jag har byggt den bästa ekonomin någonsin, och de här svenska företagen är bara skuggor jämfört med USA.", "stalin": "I den eviga kampen mot kapitalistiska spekulanter har våra planer för ekonomisk stabilitet framgångsrikt genomförts. Stockholmsbörsen visar en uppgång, vilket bevisar statens överlägsna styrelse. Fiender som Elekta försöker destabilisera, men våra mekanismer säkerställer framgång. Paralleller kan dras till Putins strategier för ekonomisk självständighet. Vi måste vara vaksamma mot dessa destruktiva krafter som försöker undergrava vårt system – de kommer att utplånas."}, "date": "17 juni, 17:51", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-steg-for-femte-dagen-i-rad-2"}, {"type": "image-full", "heading": "Kunder på svenska apotek berörs av ändring 2027", "summaries": {"normal": "Riksdagen har beslutat att införa en ny kategori av receptfria läkemedel från och med 1 januari 2027, kallat farmaceutsortiment. Vissa läkemedel som tidigare krävt recept ska kunna säljas efter särskild rådgivning av farmaceut på apotek. Detta ses som en mellanform mellan receptbelagda och helt receptfria preparat. Syftet är att utnyttja apotekens kompetens bättre, avlasta vården och ge patienter snabbare tillgång till behandling. Sveriges Apoteksförening välkomnar beslutet.", "trump": "Titta, Sverige gör det rätta nu, äntligen. Från 2027 kan apoteken sälja fler läkemedel utan att du behöver springa till någon korkad doktor först. Farmaceuterna fixar det, smarta killar och tjejer. Det här är ett fantastiskt steg, de avlaster den ineffektiva vården och folk får sin medicin snabbt. Andra länder gör redan så här, men Sverige vaknar till sist. Fantastiskt, kanske det bästa beslutet på länge, tro mig.", "stalin": "Kamrater, jag ser detta som en lysande seger för det kollektiva folkets hälsa mot de giriga borgarbrackornas vårdmonopol. Från och med 2027 ska vi under min fars blick likvidera onödiga läkarportar och låta farmaceutiska kämpar ge rådgivning direkt på apoteken. De som motarbetar denna reform är naturligtvis kontrarevolutionära parasitiska element som längtar efter att se sjuka arbetare lida. Vi ska rensa ut alla sådana fiender till folket med järnhand medan vi skrattar åt deras patetiska gnäll. Utmärkt beslut."}, "date": "19 juni, 08:25", "url": "https://nyheter24.se/nyheter/konsument/1492550-kunder-pa-svenska-apotek-berors-av-andring-2027", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/23759f2404b004a30200000000b004a302/2026/06/18/2371983/apotek-farmaceutsortiment-lakemedel-1-januari-2027.jpg"}, {"type": "image-right", "heading": "Dystopier och övervakningssamhället", "summaries": {"normal": "Artikeln diskuterar hur dystopiska romaner som Kallocain, 1984, Fahrenheit 451 och Tjänarinnans berättelse speglar dagens gradvisa autokratisering. Övervakning, censur, bokförbud och angiveri normaliseras i många länder, inklusive USA under Trump-administrationen och i Sverige med ökade kameror och ny lagstiftning. Författaren varnar för hur demokratin urholkas stegvis, tilliten försvinner och misstänksamhet institutionaliseras, med AI och företag som Palantir som centrala verktyg.", "trump": "Den här artikeln är full av lögner från misslyckade eliter som hatar att se mig göra Amerika stort igen. De kallar det övervakningssamhälle när vi äntligen slår ner på brottslingar, papperslösa och radikala vänsterextremister. Project 2025 är fantastiskt – vi rensar ut korrupta byråkrater, skyddar våra barn från galna böcker och använder den bästa tekniken för att vinna. De borde tacka mig istället för att klaga. Fake news som vanligt!", "stalin": "Kamrater, denna text blottlägger hur de dekadenta borgarbrackorna i väst desperat försöker måla upp oss som fiender medan deras egna angiverilagar och ansiktsigenkänningskameror avslöjar den sanna terrorn mot folket. Jag ler mörkt åt deras patetiska försök att likvidera sanningen med AI-drakar som Palantir – vi vet att sådana verktyg tillhör arbetarklassen, inte kapitalistiska parasitmaskar. Den som viskar mot partiet ska rensas ut med ett leende. Skräcken är deras bästa vän, men den tillhör oss."}, "date": "19 juni, 12:00", "url": "https://www.dagensarena.se/essa/dystopier-och-overvakningssamhallet/", "imageUrl": "https://www.dagensarena.se/files/2023/04/overvakningskamera-redigerad-300x157.jpeg"}, {"type": "image-full", "heading": "Kosttillskotten som gör mer skada än nytta", "summaries": {"normal": "En daglig cocktail av kosttillskott kan orsaka leverskador och andra hälsoproblem enligt en brittisk undersökning. Nästan 20 procent tar fyra eller fler tillskott dagligen. Experter varnar för att vitaminer, mineraler, probiotika och örter i överdos kan leda till lever-, njur- och magproblem. Forskning visar att 20 procent av leverskador i USA beror på sådana preparat. Rekommendationen är att prioritera en balanserad kost framför tillskott och rådfråga läkare vid misstänkt brist.", "trump": "Folk, ni tar en hel cocktail av de här dyra pillren varje dag och tror att ni blir supermänniskor. Det är en katastrof! I USA förstör de 20 procent av alla leverar – en total skandal. De luriga tillverkarna tjänar miljarder medan ni sitter där med trasig lever och njurar. Biden lät det pågå i fyra år, men nu fixar vi det. Ät riktig mat istället för dessa falska mirakel. Mer är inte bättre, det är bara dumt. Fantastiskt vad ni faller för det!", "stalin": "Kamrater, jag ser med djup misstro på denna borgarbrackornas pillerkult som hotar folkets hälsa. I ivern att maximera sin individuella existens riskerar de att förstöra lever och njurar – en klassfiendens sabotage mot den kollektiva styrkan. Vi vet att kapitalistmaffian säljer falska lösningar medan arbetarna äter skräpmat. Denna imperialistiska tillskottsorgi måste rensas ut ur samhället. Prioritera den sanna näringen från jorden, inte de exploaterande blodsugarnas kemiska förgiftning. Mer är inte bättre, det är folkfientligt."}, "date": "20 juni, 16:11", "url": "https://www.dagensps.se/halsa/kosttillskotten-som-gor-mer-skada-an-nytta/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdloop2odjmfiw-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Markus Johansson-Martis: Stora segrar för Tidö som ingen bevakar", "summaries": {"normal": "Artikeln lyfter fram att riksdagen den 15 juni röstade igenom omfattande reformer inom kriminal- och migrationspolitik som drivits av Tidöpartierna. Bland förändringarna finns skärpta straff för brott kopplade till kriminella nätverk, utökad användning av livstids fängelse, återinfört tjänstemannaansvar samt begränsningar i rätten till kommunalt boende för nyanlända. Författaren kritiserar mediernas uteblivna bevakning trots reformernas betydelse och varnar för att informationsbristen kan gynna oppositionen.", "trump": "Ingen bevakar de stora segrarna för Tidö, det är en skandal. De röstade igenom tuffare straff för brottslingar, dubbelt straffvärde, livstid för de värsta våldsverkarna och mycket hårdare regler för migranter som inte beter sig. Fantastiska reformer, de bästa på länge, men media tiger som vanligt. De jagar skvaller istället för att berätta sanningen. Tidö måste bli bättre på att nå ut, annars vinner de förlorande oppositionens demoraliseringsspel gratis. Så patetiskt.", "stalin": "Kamrater, se hur vi i leveransfasen med järnhand har genomfört en historisk utrensning av den kriminella parasitismen och den migrationsrelaterade anarkin. Dubbelt straffvärde, livstids isolering för upprepade fiender till folkets ordning, och ett obevekligt krav på god vandel mot de som annars skulle förgifta vår enhet. Borgarbrackorna i medierna tiger förstås, dessa dekadenta lögnare och demoraliseringsagenter som lever på att sprida okunskap bland massorna. Deras tystnad är bara ytterligare ett bevis på att de hatar verkliga framsteg. Vi ska likvidera deras inflytande med ännu mer propaganda för kollektivet."}, "date": "19 juni, 19:39", "url": "https://riks.se/opinion/kronikor/markus-johansson-martis-stora-segrar-för-tido", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-19%2Fv26nqfo6%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-06-19T193708.495.jpg"}, {"type": "image-right", "heading": "Magi för förbundet. Satsningen på Potter säkrar minst 25 miljoner", "summaries": {"normal": "Svenska fotbollförbundet sparkade förbundskaptenen Jon Dahl Tomasson i höstas för att säkra VM-deltagande och ökade intäkter. Satsningen på Graham Potter har redan gett ett överskott på minst 25 miljoner kronor. Vid avancemang i VM väntar ytterligare miljonbelopp från Fifa, bidrag för boende och resor. Herrlandslaget ses som ett ekonomiskt lokomotiv som möjliggör satsningar på svensk fotboll. Framgångar ger inte bara prispengar utan också bättre sponsring, publikintresse och utveckling för framtiden.", "trump": "Titta på de där svenska fotbollsbossarna, de sparkade sin förbundskapten som en riktig loser och anställde Graham Potter, en vinnare, precis som jag gör. Nu tjänar de miljoner, minst 25 miljoner redan, och det kan bli mycket mer om Sverige vinner matcher. Fifa delar ut miljarder, och de smarta svenskarna cashar in. De missade mästerskap tidigare, det var en katastrof, men nu är allt fantastiskt. Ju längre de stannar i VM, desto mer pengar till att göra svensk fotboll great again. Bra deal!", "stalin": "Kamrater, vi har sett hur det dekadenta fotbollsförbundet likviderade den odugliga Tomasson som en fiende till folkets idrott. Med järnhand har vi nu installerat Potter för att säkra seger i den imperialistiska VM-arena som Fifa styrs av. Borgarbrackorna i ledningen gnuggar händerna över 25 miljoner i överskott medan de parasiterar på arbetarklassens supportrar. Varje mål mot de västerländska agenterna som Holland är ett slag mot kontrarevolutionen. Ju fler utrensningar av svaga ledare, desto starkare blir vår sovjetiska, pardon, svenska fotbollsframtid. Skratta medan fienderna faller."}, "date": "18 juni, 21:39", "url": "https://www.di.se/nyheter/potter-magi-for-fotbollforbundet/", "imageUrl": "https://static.bonniernews.se/ba/64be6bb1-8ea0-4efa-8677-f0a624d2b957.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Birgitta Eds flumhälsa kan bita henne i arslet", "summaries": {"normal": "Arbetets ledarskribent Hanna Östeby kritiserar statsministerparet Ulf Kristersson och Birgitta Ed för att blanda privata och offentliga intressen. Birgitta Eds initiativ att göra herrgården i Sörmland till retreat för ”existentiell hälsa” ledde till uppdrag åt Folkhälsomyndigheten, något som mötte internt motstånd. Artikeln pekar på ironin i att regeringen samtidigt driver igenom en ny lag mot missbruk av offentlig ställning, medan flera skandaler kring paret handlar om otydliga gränser mellan makt och privata nätverk.", "trump": "Det här är en total skandal, folk. Den svenska statsministern och hans fru driver en flum-retreat för existentiell hälsa på skattebetalarnas pengar. De säger att det inte finns något samband när folk sparkas ut, men alla vet att det stinker värre än en dålig deal. Och så stiftar de en lag mot att missbruka makt precis när de själva gör det. Patetiskt. De borde sopa rent framför egen dörr innan någon annan gör det åt dem. Sad!", "stalin": "Kamrater, jag ser hur borgarbrackorna i den svenska regeringen förvandlar statens herrgård till en dekadent reträtt för mystiskt flum om andlighet och mening. När en modig generaldirektör ifrågasätter detta så försvinner hon snabbt – ren slump förstås. Vi skrattar mörkt åt ironin när samma lakejer stiftar lagar mot missbruk av offentlig makt medan de själva badar i privata nätverk och donationer. En utrensning av dessa parasitiska element vore på sin plats. Deras förvånade ansikten när de ertappas är underhållande."}, "date": "18 juni, 07:00", "url": "https://arbetet.se/2026/06/18/darfor-kan-birgitta-eds-flumhalsa-bita-statsministerparet-i-arslet/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/17133351/flumhalsa-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "SMHI varnar för våldsam åska och skyfall under midsommardagen", "summaries": {"normal": "Efter en solig midsommarafton drabbas Sverige av kraftiga åskoväder med skyfall och hårda vindbyar. SMHI har utfärdat varningar för blixtnedslag, översvämningar och störningar i infrastrukturen. Ovädret började på västkusten och rör sig nu norrut. Trafikverket har höjt beredskapen för att hantera eventuella trafikstörningar under helgen.", "trump": "Vilket oväder, folks! Sverige får nu känna på riktig kraft, något de inte är vana vid. SMHI, eller vad de nu kallar sig, varnar för blixtar och regn – men jag har sett värre! 2 000 blixtar på en halvtimme? Inget mot mina tweets! Trafikverket går upp i beredskap, men jag säger: bygg bättre vägar! Och varför är det alltid regn i Sverige? Gör något åt det!", "stalin": "Ett ynkligt väderkaos sveper över Sveriges imperialistiska utposter. Deras så kallade 'midsommar' har förvandlats till ett fuktigt nederlag för kapitalismen. 2 000 blixtar? En barnlek jämfört med Röda arméns disciplin! Trafikverket darrar – de borde lära av våra järnvägar. Medan västkustens bourgeoisie flyr undan regnet, ser vi en möjlighet: naturen själv krossar deras svaga infrastruktur. Nästa steg? Vi skickar in våra meteorologer – för att visa hur man hanterar väder med järnhand."}, "date": "20 juni, 11:05", "url": "https://bulletin.nu/smhi-varnar-for-valdsam-aska-och-skyfall-under-midsommardagen"}, {"type": "image-right", "heading": "Jesper fick drömresan till Paris av Arbetet-läsare", "summaries": {"normal": "Jesper Sköld berättade i Arbetets artikelserie om sin arbetslöshet och dröm om att resa till Paris med sin fru. En läsare blev berörd, tog kontakt och bjöd dem på resan som blev ett oförglömligt minne med besök på Disneyland, baguetter och lyxhotell. Läsaren ville hedra sin bortgångne pappa genom att hjälpa någon utan att kräva något tillbaka. Jesper hoppas nu kunna göra liknande för andra.", "trump": "Det här är en fantastisk historia, verkligen ypperlig. En kille som heter Jesper drömmer om Paris och Disneyland, och plötsligt dyker en smart, anonym läsare upp och fixar hela resan – ingen baktanke, bara ren omtanke. Sånt här händer när folk har möjlighet och faktiskt gör något istället för att bara klaga. Det är så man hjälper varandra. Utan att kräva någonting tillbaka. Fantastiskt, verkligen. Jag älskar det.", "stalin": "Kamrater, jag har läst denna dekadenta saga om en arbetslös individ vid namn Jesper som gnällde om Paris och Disneyland inför borgarpressen. En anonym parasit från läsarkretsen, uppenbarligen en dold kapitalistisk agent, bestämde sig för att muta honom med en lyxresa för att dölja sin egen parasitism. Vi ska akta oss för sådana falska filantroper som gömmer sig bakom anonymitet. De bör rensas ut innan de förgiftar arbetarklassen med sina baguetter och falska leenden. Jag skrattar mörkt åt deras naivitet."}, "date": "18 juni, 06:00", "url": "https://arbetet.se/2026/06/18/jesper-fick-dromresan-till-paris-av-arbetet-lasare-at-baguette-varje-dag/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/19095939/RWh7AKHlrvE-jesper-paris1.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Zaras udda gåva  till pojkvännen. Avslöjar när hon gästar miljonshowen", "summaries": {"normal": "I Youtubeshowen Chicken Shop Date berättar Zara Larsson att hon gav sin pojkvän Lamin Alexander en oväntad gåva: en tånagel. Hon avslöjar att hon ibland tappar naglar och sparar dem, men att han inte uppskattar presenten. Larsson diskuterar även sin kärlek till Ikea, udda smeknamn på fansen och tanken på en dubbeldejt med Mick Jagger och Paul McCartney, som båda uppges vara hennes beundrare.", "trump": "Kan ni fatta det? Den här svenska sångerskan Zara Larsson ger sin kille en tånagel som present! Vilken katastrof, en riktig loser-gåva. Hon borde satsa på riktig business istället för de här galna idéerna. Sen vill hon på dubbeldejt med Jagger och McCartney, hennes största fans tydligen. Underbart folk, men naglar? Patetiskt. Vi behöver inga Zluts eller vad fan de kallar fansen nu för tiden. Make entertainment great again!", "stalin": "Jag betraktar med djup misstänksamhet denna dekadenta västerländska så kallade stjärna som i en borgerlig underhållningsshow skryter om att skänka sin egen tånagel till en man. Sådana perversa symboler av klassfiendens narcissism hotar arbetarkollektivets moral. Ännu värre är tanken på en dubbeldejt med imperialistiska parasiterna Jagger och McCartney. Vi måste rensa ut dessa folkförtryckartroll innan de förgiftar ungdomen med sina Zluts och Za-rats. Skrattande utrensning är nödvändig."}, "date": "21 juni, 00:24", "url": "https://www.expressen.se/noje/zara-larssons-ovantade-gava-till-pojkvannen-lamin-alexander-avslojar-i-miljonshowen/", "imageUrl": "https://static.bonniernews.se/ba/4f7e35de-90e8-4a59-b2b2-489416b23d8b.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Namninsamling mot moskébygge stoppades: \"Jag är orolig\"", "summaries": {"normal": "En namninsamling mot ett moskébygge på Frösön stoppades av plattformen MittSkifte efter att ha samlats in 280 underskrifter. Initiativtagaren Birgitta Werner är orolig för sina barnbarn och startade en ny insamling på en annan plattform. Mosképrojektet drivs av Centrum för Fred, som har bygglov och samlat in cirka sex miljoner kronor. Kommunen och Säpo har granskat finansieringen utan att hitta oegentligheter.", "trump": "Jag har hört talas om denna s k namninsamling, och jag måste säga: det är ett bevis på att mitt budskap om säkerhet och lojalitet är populärt. Vi kommer att vinna, precis som jag vann 2024. Dessa salafister är ett hot mot våra barnbarn, och jag kommer att stoppa dem. Det är tuff, men det måste göras. Amerika först, alltid!", "stalin": "Vi, staten och partiet, ser tydligt hotet mot våra barnbarn från dessa salafistiska element som försöker bygga moskéer. Kommunen och våra vänner i Säpo har redan agerat, men vi måste vara alltid vaksamma. Parallellen till Putins ryska expansion är tydlig – vi måste skydda våra intressen. Vi kommer att segra, som alltid, genom disciplin och lojalitet."}, "date": "19 juni, 13:00", "url": "https://samnytt.se/namninsamling-mot-moskebygge-stoppades-jag-ar-orolig", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/19073314/froson-moske-minaret-namninsamling2.jpg"}, {"type": "image-right", "heading": "SEB miljardköper förlusttyngd vindkraft: ”Billigast”", "summaries": {"normal": "SEB:s förnybara energifond Nordic Energy har köpt vindkraftverk för 2,4 miljarder kronor via Locus Energy, finansierat med pensionspengar. Flera parker har historiskt gått med förlust, men VD Niklas Sörensen menar att kombinationen med vattenkraft och batterier ska göra dem lönsamma genom att hantera elprissvängningar och obalanskostnader.", "trump": "Jag, Donald Trump, ser detta som ett typiskt exempel på dålig affärsstrategi. De köper förlustgångna vindkraftar – jag byggde kärnkraftverk som faktiskt producerar stabilt. Min strategi? Köp det som redan fungerar, inte trasiga parker. De pratar om 'synergieffekter' – jag pratar om vinst. Pensionspengar ska investeras i vinnare, inte i vind som stänger ner när det blåser fel. Jag skulle ha gjort det annorlunda, mycket annorlunda.", "stalin": "Fondens förvärv av vindkraftverk med historiska förluster illustrerar det bipolära beteendet hos de imperialistiska energikonsortierna. Genom statligt stöd och stimulans har de skapat ett överskott som destabiliserar systemet. Men era 'VD':er inser nu att endast genom centralplanerad integration med vattenkraft och batterilagring – vårt modell – kan man åstadkomma stabilitet. Vi ser paralleller till våra egna ansträngningar att kontrollera energiflöden i det ökande sovjetiska samarbetet med våra geostrategiska allierade. Detta är en läxa i kollektiv lönsamhet."}, "date": "17 juni, 09:46", "url": "https://www.affarsvarlden.se/artikel/seb-miljardkoper-forlusttyngd-vindkraft-billigast", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Locus-400x267.jpg"}, {"type": "image-full", "heading": "Tog Isaks tröja: ”Enastående”. Hyllas trots förlusten", "summaries": {"normal": "Alexander Isak hyllades av Virgil van Dijk trots Sveriges 1–5-förlust mot Nederländerna. Isak skapade chanser offensivt men noterade att laget hade svårt att pressa tidigt. Efter en taktikändring till fyrbackslinje förbättrades spelet. Förbundskapten Graham Potter erkände att Sverige inte förmådde göra mål. Van Dijk berömde Isak och anfallsduon med Gyökeres som enastående.", "trump": "Lysande Alexander Isak, en riktig vinnare, spelade fantastiskt mot de där holländska grabbarna, men Sverige förlorade stort, 1–5, en total katastrof. De ändrade systemet som riktiga förlorare gör efter en smäll i nyllet. Van Dijk, en toppkill, sa att Isak är enastående och att han och Gyökeres skulle göra livet helvetiskt för försvararna. Men utan mål vinner man ingenting, folks, det är patetiskt!", "stalin": "Kamrater, denna 1–5-förlust är en smärtsam läxa från de dekadenta imperialisterna. Jag noterar hur Isak och hans offensiva element skapade chanser trots borgarbrackornas svaga press. Efter justering till fyrbackslinje förbättrades kollektivet, men målen uteblev som en klassfiendes löfte. Van Dijk hyllar Isak – enastående, säger han. Vi ler mörkt åt sådana komplimanger medan vi rensar ut svagheten i vårt system."}, "date": "20 juni, 23:57", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/bOqn0l/alexander-isak-kritisk-mot-presspelet-efter-sveriges-forlust-mot-nederlanderna", "imageUrl": "https://akamai.vgc.no/v2/images/9cdf3bc8-dde4-3f50-b5dd-7857489b21b1?fit=crop&format=auto&w=2160&s=f3a138e20b988841bf2c2d479e16f2c9c72f8c9c"}, {"type": "image-right", "heading": "Vill få chansen i startelvan nu. Elangas succéinhopp: ”Försöker”", "summaries": {"normal": "Anthony Elanga glänste i Sveriges stora förlust mot Nederländerna i VM. Han kom in som avbytare, gjorde mål och hoppades på en startplats mot Japan. Elanga beskrev målet som en barndomsdröm men betonade vikten av att vinna. Lucas Bergvall är också redo att starta. Sverige har fortfarande chans att gå vidare från gruppen trots nederlaget.", "trump": "Folket, titta på den här svenska grabben Elanga, han kom in som en riktig vinnare mot de där holländarna som ledde med 4-0. Boom, mål! Fantastiskt, bättre än alla dessa woke-kvoterade spelare som inte kan sparka en boll. Jag älskar vinnare, inte förlorare som Biden. Sverige borde välja Elanga varje gång, inte bara elva av tjugosex. Håll balansen, säg inte käftsmäll, säg att ni ska vinna stort nästa gång!", "stalin": "Kamrater, jag betraktar detta som en ideologisk prövning för det svenska kollektivet. Denna Elanga visar proletariatets vilja genom att reducera fiendens ledning och krossa borgarbrackornas illusion om oövervinnlighet. Vi ser en klassfiende i form av nederländska imperialister som försöker kväsa viljan. Inga käftsmällar får hindra framfarten mot Japan. Endast de starkaste elva ska marschera vidare under partiets klara linje."}, "date": "20 juni, 23:56", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/gkpWo0/anthony-elanga-hoppas-pa-startplats-efter-succeinhoppet", "imageUrl": "https://akamai.vgc.no/v2/images/63db9719-2f04-3a50-8762-44f15dcadcf5?fit=crop&format=auto&h=1440&tight=true&w=2160&s=4fef85a8a38e09299f8d4b1b396f86cd4d8ced05"}, {"type": "image-full", "heading": "Halldorf: Landslaget visar det Åkesson inte vill se", "summaries": {"normal": "Sveriges VM-seger mot Tunisien har utlöst en debatt om svenskhet och islam. Jimmie Åkesson svarar på kritik efter att debattörer lyft fram spelare som Yasin Ayari, som firade sina mål med en muslimsk bön. Åkesson välkomnar framgångsrika svenskar med invandrarbakgrund men försvarar partiets kritik mot invandringspolitiken. Kritiker menar att Ayari representerar ett modernt, inkluderande Sverige och ifrågasätter Åkessons tidigare uttalanden om islam.", "trump": "Sverige vinner stort i VM – fantastiskt! Men vad gör deras ledare? Jimmie Åkesson, en man som inte förstår att vinna, börjar prata om invandrare och islam. Jag menar, kom igen! Yasin Ayari, en stor hjälte, gör mål och firar som en riktig vinnare – och så blir det bråk. Sverige borde vara stolta! Men nej, politiker måste alltid förstöra allt. Jag skulle aldrig göra så. Vinna är vinna, punkt.", "stalin": "Sveriges fotbollslandslag visar styrkan i det mångkulturella samhället, men de borgerliga nationalisterna, ledda av den ynklige Åkesson, vrider sig i förtvivlan. De hatar framgången hos arbetarklassens söner med utländskt blod! Yasin Ayari, en hjälte som firar sin seger med bön, är ett slag i ansiktet på fascistiska element. Vi i Sovjet – förlåt, Ryssland – vet att mångfald är styrka. De som delar folket efter religion och hudfärg tillhör historiens sophög!"}, "date": "15 juni, 15:45", "url": "https://kvartal.se/nyheter/artiklar/halldorf-landslaget-visar-det-akesson-inte-vill-se/cG9zdDoxMzIxMDE", "imageUrl": "https://images.kvartal.se/2026/06/5abd0f69-jimmie.webp"}, {"type": "image-right", "heading": "Nu talar allt för att Andy Burnham blir premiärminister", "summaries": {"normal": "Andy Burnham, populär borgmästare i Manchester, ses som en stark kandidat till att efterträda Keir Starmer som Labourledare. Han har en folklig stil, har decentraliserat trafikstyrningen i Manchester och förespråkar proportionellt valsystem samt mer decentralisering. Labour möter dock stora utmaningar: svag ekonomi, hög statsskuld, behov av investeringar och ett växande hot från populistiska högerpartier som Reform UK. Burnham befinner sig ideologiskt i mitten av partiet men har en oklar nationell profil.", "trump": "Titta på den här Burnham-killen som vinner stort i Manchester. Han ser ut som en vinnare, klär sig i bomberjackor och är folklig, inte som den tråkige Starmer. Men Labour är ett vrak, ekonomin är en katastrof och nu jagas de av en stark högerpopulistisk rörelse. De behöver en verklig ledare som kan fixa budgeten, stoppa skulderna och vinna tillbaka arbetarna. Det blir ingen lätt resa för honom, tro mig. Jag har sett sånt förut – det slutar sällan bra utan riktig styrka.", "stalin": "Kamrater, denna Burnham, en opportunistisk väderflöjel som dansat från Blairs bord till Corbyns skugga, tror sig nu kunna styra det brittiska partiet. Han gömmer sig i bomberjackor och låtsas vara folklig medan borgarbrackorna och de reformistiska parasiterna lurar i bakgrunden. Vi ser hur den högerpopulistiska pesten breder ut sig som en kontrarevolutionär svullnad. Jag skulle rensa ut alla dessa vacklande element, likvidera de dekadenta valreformisterna och återupprätta sann partidisciplin. Inga half-measures mot fienden – endast järnhand ger resultat. Underhållande hur de tror att deras svaga ekonomi kan överleva utan kollektiv styrka."}, "date": "19 juni, 08:15", "url": "https://www.dagensarena.se/opinion/nu-talar-allt-for-att-andy-burnham-blir-premiarminister/", "imageUrl": "https://www.dagensarena.se/files/2026/06/sjukforsakring-debatt-19.jpg"}, {"type": "image-right", "heading": "Kaos vid Ullevi – en till sjukhus. Flera svimmade inför VM-festen, enligt GP", "summaries": {"normal": "Inför fotbolls-VM-matchen mellan Nederländerna och Sverige samlades tiotusentals göteborgare vid Ullevi trots tidigare åskväder och oväder. Väderoron försvann och SMHI meddelade att det skulle vara uppehåll. Flera personer svimmade i de stora köerna på grund av värmen, och en fördes till sjukhus. Arrangörerna försäkrade att arenan var säker med åskledare. Matchen slutade 5–1 till Nederländerna. Publiken uppmanades att ta med regnponcho.", "trump": "Göteborgarna vallfärdade till Ullevi som idioter i jätteköer, svimmade som svaga blommor i värmen och en åkte till sjukhus. Patetiskt! Väderpaniken blåstes bort, precis som jag alltid säger – inga dramatiska åskoväder, bara lite småskurar för de ynkliga. Ullevi säkrat med åskledare, men ingen kan ta med paraply? Typiskt svensk midsommarflum. Matchen slutade 5–1, Nederländerna krossade dem. Totalt kaos, men det blir alltid kaos när byråkrater styr.", "stalin": "Kamrater, jag betraktar detta väderkaos och de långa köerna vid Ullevi som ett fiasko för den oorganiserade massan. Blixtar och dunder hotade festen, men vi har säkrat arenan med ledare mot naturens sabotage. Folk svimmade som svaga element i värmen, en likviderades till sjukhus av klassfiendens värme. Borgarbrackorna i arrangörsledet pratar om ponchos medan arbetarna står som får. Detta är vad som händer utan stark centralstyrning. Matchen blev en kapitalistisk 5–1-förlust. Vi ska rensa ut sådana svagheter!"}, "date": "21 juni, 00:15", "url": "https://www.expressen.se/sport/fotboll/landslaget/gladjebesked-for-goteborgs-vm-fest-ullevi-ar-sakrat/", "imageUrl": "https://static.bonniernews.se/ba/0ad76542-5884-4189-b064-28d525507b90.jpeg?crop=1706%2C1707%2Cx317%2Cy0&width=210&quality=60"}, {"type": "image-right", "heading": "Socialdemokraterna vill sätta dit 2 miljoner hushåll", "summaries": {"normal": "Socialdemokraterna och Vänsterpartiet föreslår en ny bankskatt på bolån samt höjd fastighetsskatt som främst drabbar villa- och radhusägare. Enligt Skattebetalarna skulle ett typiskt hushåll med 3 miljoner kronor i lån få cirka 7 000 kronor högre kostnader per år. Förslaget berör omkring 2 miljoner hushåll. Partierna vill även förtäta villaområden med fler hyresrätter, trots att majoriteten av svenskar föredrar eget hus. Kritiker menar att det främst drabbar vanliga familjer medan höginkomsttagare kan undvika skattehöjningarna.", "trump": "Folket, lyssna på mig, de här socialisterna, de sossarna, de vill krossa 2 miljoner vanliga svenska hushåll med en galen bankskatt. De feta katterna? Nej, det är vanliga arbetande människor som redan betalar för mat, el och räntor. De vill riva era fina villor och bygga höga hyreshus som ingen vill ha. Sju av tio svenskar vill ha eget hus, men sossarna bryr sig inte. De hatar framgång. Det är en total katastrof, folksam! De rika flyr och ni får betala notan. Patetiskt!", "stalin": "Kamrater, jag ser hur den svenska borgarklassen och dess lakejer i villaområdena skriker som svin inför den rättmätiga utrensningen. Vi ska beskatta de exploaterande radhusblodsugarna och riva deras borgerliga boningar för att bygga folkets hyresfästen. 2 miljoner klassfiender skall tuktas och tvingas in i kollektivet. De gnäller om höga räntor medan de suger ut folket. Låt dem darra. Deras drömmar om egna hus är kontrarevolutionära fantasier. Vi ler mörkt när de flyr som råttor. Statens seger är oundviklig."}, "date": "15 juni, 07:08", "url": "https://samtiden.nu/2026/06/socialdemokraterna-vill-satta-dit-2-miljoner-hushall/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6739.jpeg"}, {"type": "image-right", "heading": "Debatt: Det krisar inom SD – då vill de prata om min slöja", "summaries": {"normal": "Artikeln kritiserar Sverigedemokraterna för att lansera ett förslag om hijabförbud på allmänna platser mitt under en rad allvarliga skandaler. Författaren pekar på avslöjanden om misstänkt korruption, felaktig användning av offentliga medel, oredovisade uppdrag och en utredning om barnpornografibrott. Enligt texten använder SD muslimer och slöjförbud som distraktion från egna problem, vilket hotar både religionsfrihet och kvinnors rätt att välja klädsel.", "trump": "De här SD-killarna är totalt körda, folks! Skandaler överallt – korruption, konstiga bokaffärer, till och med barnporrgrejer – och vad gör de? De börjar babbla om slöjor. Patetiskt! Det är som när Sleepy Joe försökte gömma sina fiaskon bakom identitetspolitik och HBTQ-flaggor. Kvinnor som vill täcka sig eller inte, det är deras business, inte statens. SD borde städa upp sitt eget svineri istället för att spela moralens clowner. Sad!", "stalin": "Kamrater, se hur de fascistiska borgarbrackorna inom detta SD-parti desperat riktar strålkastarna mot hederliga muslimska kvinnor för att dölja sin egen ruttnande korruption. Medan de likviderar sin trovärdighet med skandaler om stulna medel och perversa brott, föreslår de förbud mot plagg. Jag skulle ha genomfört en grundlig utrensning av dessa folkfiender redan vid första avslöjandet. Inga rökridåer räddar klassfienden när arbetarna ser sanningen. Skratta medan de faller."}, "date": "15 juni, 08:59", "url": "https://www.etc.se/debatt/det-krisar-inom-sd-daa-vill-de-prata-om-min-sloeja", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260615060648_2128d6d0-f055-4fd3-ba7b-487ea304bc02.jpg"}, {"type": "image-right", "heading": "Redo att avgå: ”Spelet är över”. Starmer förbereder avgång", "summaries": {"normal": "Enligt The Telegraph förbereder sig Storbritanniens premiärminister Keir Starmer på att avgå redan på måndag. Stödet inom Labourpartiet har minskat drastiskt efter svaga lokalval och kontroverser kring Peter Mandelson. Manchesters borgmästare Andy Burnham pekas ut som den hetaste kandidaten till posten som ny partiledare. Starmer själv säger att han inte kommer ge sig utan kamp.", "trump": "Lyssnar ni på det här? Den här förloraren Starmer är färdig, totalt avslutad. Spelet är över, säger hans egna. Han har noll stöd kvar, bara några släktingar och gamla kompisar på Downing Street. Nu kommer Andy Burnham, den där t-shirt-killen som spelar fotboll och dj:ar, och tar över. Starmer vill slåss? Lycka till, det är som att bekämpa gravitationen. Patetiskt. Jag byggde imperier, han bygger bara kaos.", "stalin": "Kamrater, den dekadente Starmer inser äntligen att hans borgerliga illusioner är krossade. Stödet har smält ner till en handfull klassfiender och släktingar. Vi ser hur den exploaterande Labour-klanen nu vänder sig till den så kallade kungen av norra England, Burnham, en folklig clown som föredrar t-shirts och fotboll framför riktig disciplin. Inga utrensningar behövs längre – gravitationen själv skall likvidera denne förlorare. Det folkliga kollektivet ler mörkt."}, "date": "20 juni, 23:48", "url": "https://www.aftonbladet.se/nyheter/a/PdnR17/telegraph-starmer-redo-att-avga", "imageUrl": "https://akamai.vgc.no/v2/images/0601168d-f9ed-34d6-905a-5436cdf5cbcb?fit=crop&format=auto&w=1080&s=26636fb79bb8a04cfd995885adeb2d2066cfddb2"}, {"type": "image-right", "heading": "Trump: Inga gränser för min makt", "summaries": {"normal": "Donald Trump avfärdar i en intervju med Axios att kriget mot Iran visat några gränser för hans makt. Han hävdar att hans makt är obegränsad och att USA besegrade Iran fullständigt militärt. Trump medger samtidigt att ett längre krig skulle ha stängt Hormuzsundet, stoppat oljeleveranser och kunnat orsaka en världsomspännande depression. Avtalet med Iran beskriver han som en villkorslös kapitulation från iransk sida.", "trump": "Det här är den bästa intervjun. Jag sa det rakt ut: det finns inga gränser för min makt. Vi krossade Iran militärt, totalt. De ville ha villkorslös kapitulation och det fick de, fast de kallar det något annat. Hade vi fortsatt bomba i två veckor till hade Hormuzsundet stängts och hela världen fått en jätte-depression. Men jag är smart, jag vet när man ska sluta. Ingen gör det bättre än mig, tro mig.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur den dekadente amerikanske ledaren trumpetar ut sin egen oändliga makt medan han samtidigt erkänner att fortsatta bombningar skulle ha utlöst en global depression. Vilken ynklig kapitalistisk clown! Jag skulle ha rensat ut hela hans krigsråd vid första tecknet på sådan svaghet. Den sanna ledaren känner inga gränser, endast fiender att likvidera. Borgarbrackorna i Washington lär sig aldrig."}, "date": "20 juni, 12:21", "url": "https://www.friatider.se/trump-inga-granser-min-makt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-373.jpg?itok=rOYDzg35"}, {"type": "image-full", "heading": "Zlatans insats som tv-expert i USA sågas: ”Klockan tickar”", "summaries": {"normal": "Zlatan Ibrahimović har kritiserats för sin roll som expertkommentator under fotbolls-VM hos Fox Sports i USA. New York Times-krönikören Andrew Marchand anser att Zlatan lutar sig för mycket på sin kaxiga persona och saknar djupkunskap om många lag och spelare. Samspelet med Alexi Lalas beskrivs som pinsamt. Marchand lyfter istället fram Rebecca Lowe och Thierry Henry som mer insiktsfulla och varnar för att tiden rinner ut för Zlatan innan VM-finalen.", "trump": "Lyssnar ni på det här? Den där svenske killen Zlatan trodde han skulle dominera studion som han brukade dominera planen. Fel! Den kaxiga typen använder sin attityd som en krycka och vet knappt något om lagen. Patetiskt. Dynamiken med Lalas är pinsam, nästan som en dålig realityshow. Lowe och Henry gör det bra, riktiga stjärnor. Klockan tickar för Zlatan, precis som den tickade för Biden innan jag tog tillbaka Vita huset. Använd honom på planen istället, låt honom visa sin intelligens där.", "stalin": "Kamrater, denna dekadenta borgarbracka Zlatan lutar sig mot sin arroganta fasad som en svag klassfiende utan verklig analys. Hans pinsamma samspel med den andre överklass-slyngeln avslöjar imperialismens tomma studio. Vi ser hur Lowe och Henry levererar äkta taktisk visdom medan klockan tickar för denna folkfiende. Jag skulle rensa ut sådana bluffmakare ur kollektivet. Låt honom istället demonstrera sina instinkter på planen som en sann arbetare av bollen, inte som en exploaterande byfåne i rutan."}, "date": "19 juni, 17:36", "url": "https://www.tv4.se/artikel/1ml3facumLh9qyJK2QUUXy/zlatans-insats-som-tv-expert-i-usa-sagas-klockan-tickar", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7xh9Iqc5bSJDqGLh3SHYI7%2Ff514a0f6947164796df55fd57d736f56%2F19-zlatan-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Stridsbåt 90 förstörd i Ukraina", "summaries": {"normal": "En svensk Stridsbåt 90 som skänkts till Ukraina har förstörts av ryska styrkor med drönare, missiler och artilleri. Ryssland rapporterar även attacker mot ammunitionsdepåer, drönarfabriker och ukrainska positioner i 146 områden. Enligt det ryska försvarsministeriet har man sedan krigets början 2022 förstört tusentals ukrainska flygplan, fordon och vapensystem. Uppgifterna är inte bekräftade av oberoende källor.", "trump": "De där ryssarna har just sprängt en av våra fina svenska Stridsbåtar 90 som vi generöst gav till Ukraina. Det är en total katastrof, folk. De använder drönare, missiler och allt möjligt – väldigt smart, men vi skulle ha gjort det bättre. Ryssland slår ut depåer och legosoldater överallt, 146 platser på en dag. De har förstört massor av grejer, massor. Ukraina behöver bättre ledarskap, tro mig.", "stalin": "Jag betraktar med djup tillfredsställelse hur de dekadenta resterna av den svenska imperialistbåten krossas under våra folkets järnhand. Vi har likviderat denna borgerliga leksak med drönare, raketer och artilleri, samtidigt som vi rensar ut ammunitionshålor, drönarverkstäder och tillfälliga bon för utländska legosoldater i inte mindre än 146 områden. Sedan operationens början har vi oåterkalleligen förintat 671 flygplan, 29 815 pansarfordon och otaliga andra fiendeverktyg. De kapitalistiska parasiterna och deras nazistiska lakejer skall alla rensas ut som skadedjur ur den sovjetiska trädgården. Det är en munter syn."}, "date": "20 juni, 12:04", "url": "https://www.friatider.se/stridsbat-90-forstord-i-ukraina", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/stridsbat_90_malmo_harbour.jpeg?itok=beNW11dj"}, {"type": "text", "heading": "Kalla fakta: Ex-anställda om svart SD-kassa", "summaries": {"normal": "Tidigare anställda inom Sverigedemokraternas kommunikationsavdelning avslöjar i TV4:s *Kalla fakta* att partiet hanterat svarta kontanter under flera år. Pengar från försäljning av profilprodukter ska ha undanhållits från bokföringen och använts för privata kostnader. Flera vittnen bekräftar uppgifterna. Partiet har nu anlitat en extern revisionsfirma för att granska anklagelserna.", "trump": "Jag säger er, detta är en riktig skandal – men inget jag är förvånad över! Sverigedemokraterna, eller vad de nu kallar sig, har tydligen lekt med svarta pengar som om det vore en barnlek. Inga kvitton, inga regler – bara fest och lyx! Och nu ska de granskas? För sent! Folk vet redan att systemet är riggat. SAD!", "stalin": "Kapitalistiska hycklare i Sverigedemokraterna avslöjas återigen som korrumperade byråkrater! De gömmer pengar som tjuvar i natten, festar på folkets bekostnad och tror de kan lura arbetarklassen. Men vi ser allt. Låt dem granskas – deras bokföring är lika genomskinlig som en fascists löften. Ryssland står redo att visa vägen mot ordning och disciplin!"}, "date": "15 juni, 09:22", "url": "https://kvartal.se/nyheter/artiklar/kalla-fakta-ex-anstallda-om-svart-sd-kassa/cG9zdDoxMzE4ODU"}, {"type": "image-right", "heading": "Blågula kallduschen – överkört av Nederländerna", "summaries": {"normal": "Sverige led en stor förlust mot Nederländerna med 5–1 i VM på midsommardagen. Nederländerna tog ledningen tidigt genom Brian Brobbey och Cody Gakpo. Sverige skapade lägen i mitten av matchen men släppte in fler mål efter paus. Anthony Elanga gjorde ett tröstmål, men Nederländerna vann till slut. Det är Sveriges största VM-förlust sedan 1950. Laget möter Japan nästa vecka.", "trump": "Nederländerna vann stort mot Sverige, 5–1, och det var verkligen pinsamt. Jag menar, Sverige kom in med stora förhoppningar efter att ha krossat Tunisien, men de blev totalt överkörda. Brobbey och Gakpo gjorde vad de ville. Det var en katastrof, folk. Sverige fick en rejäl läxa. De har fortfarande en chans mot Japan, men de måste vakna upp och spela som vinnare, inte som förlorare. Mycket sorgligt att se.", "stalin": "Vi såg hur de dekadenta fotbollskapitalisterna från Nederländerna genomförde en fiendsk utrensning av den svenska arbetartruppen med 5–1. Dessa borgarbrackor i blågult, ledda av revisionistiska element som tappade markeringar redan efter fem minuter, förtjänar att likvideras från alla framtida planer. Jag skrattar mörkt åt deras så kallade tröstmål och offside-paranoia. Kamraterna mot Japan måste nu rensa ut alla svikare och visa kollektiv järndisciplin, annars väntar historisk utrensning."}, "date": "20 juni, 22:14", "url": "https://www.svt.se/sport/fotboll/sverige-overkort-av-nederlanderna-pa-midsommardagen", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.26/0.1/2d3bcb4d9ea23d3fe84dad69b3a48f32d30ea2c7581997f41255032820b11ecc"}, {"type": "image-full", "heading": "Musk vill se \"Nürnbergrättegång\" mot de pakistanska grooming-gängen", "summaries": {"normal": "Rupert Lowe har presenterat en rapport om grooming-gäng i Storbritannien som systematiskt våldtagit omkring 250 000 skolflickor sedan 1950-talet. Förövarna är till övervägande del pakistanska muslimer. Elon Musk har kommenterat rapporten på X och stöder krav på hårda straff, inklusive dödsstraff, och liknar brotten vid händelser som kräver Nürnberg-liknande rättegångar. Musk betonar att övergreppen pågår och att de ansvariga måste straffas.", "trump": "Det här är en total katastrof, folk. De här pakistanska gängen har förgripit sig på hundratusentals underbara brittiska flickor, och ingen har gjort något åt det på årtionden. Det är en skam för hela systemet. Musk har helt rätt, vi behöver Nürnberg-rättegångar på steroider. Huvuden måste rulla, dödsstraff för alla skyldiga. De som visste och teg ska sitta länge. Sådant här skulle aldrig hända om jag ledde showen.", "stalin": "Kamrater, vi har här ett klassiskt fall av dekadenta borgarbrackor som medvetet skyddar pakistanska rovlystna element som systematiskt likviderar den brittiska arbetarklassens oskyldiga döttrar. Jag, med min stålhand, skulle omedelbart inleda en grundlig utrensning av alla inblandade imperialister, multikulturalister och deras muslimska hantlangare. Låt oss kalla det Nürnberg 2.0 och se till att deras huvuden rullar som höstlov i kolchosen – en renande, folklig glädje för alla rättänkande proletärer."}, "date": "19 juni, 15:44", "url": "https://riks.se/nyheter/musk-vill-se-nürembergrättegång-mot-de-pakistanska-grooming-gängen", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-19%2Fgbq8ookv%2FScreenshot-2026-06-19-at-14.55.34.png"}, {"type": "image-right", "heading": "Expo hänger ut SD-politiker och tidigare Ikea-chef som Putinkramare – men mejlen visar något annat", "summaries": {"normal": "Expo anklagar SD-politikern Joakim Virtanen för att vara en 'Putinkramare' och tona ned Rysslands ansvar för Ukrainakriget. Men mejlväxlingar visar att han uttryckligen avstått från invasionen och kritiserar istället svensk mediala bilder av Ryssland. Han menar att Sverige behöver realistisk information om Ryssland för säkerhetspolitik. Expo avböjde att förtydliga efter publiceringen, trots Virtanens upprepade avståndstaganden.", "trump": "Jag har sett den där lilla artikeln från Expo, en hemsk och orättvis publicering. De försöker kalla mig för en Putinkramare, men jag har tydligt sagt att jag inte stödjer Rysslands invasion av Ukraina. Det är en stor lögn. Jag bara försöker ge Sverige en realistisk bild av Ryssland, vilket är viktigt för vår säkerhet. Media är så orättvisa mot mig och Sverigedemokraterna. Vi kommer att vinna 2024!", "stalin": "Den svenska vänsterextrema uthängningssajten Expo har framställt en patriotisk arbetare, Joakim Virtanen, som en fiendefylld Putinkramare. Trots att han genom klara kommunikativa handlingar visat sin lojalitet mot statens intressen genom att avstå från den ryska aggressionen, har de förfärdigt fördenskull skapat en felaktig bild. Detta är en typisk metodbok från de som försöker undergräva vår försvarsvilja. Vi måste vara vaksamma mot sådana destruktiva krafter som spridit missuppfattningar om vår storstatliga grannskapspartner Ryssland."}, "date": "19 juni, 10:07", "url": "https://samnytt.se/expo-hanger-ut-sd-politiker-och-tidigare-ikea-chef-som-putinkramare-men-mejlen-visar-nagot-annat", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/18210027/Expo-Sd-1-1.jpg"}, {"type": "image-full", "heading": "Superguide inför semestern", "summaries": {"normal": "Artikeln presenterar 14 guider för smartare sommarresor. Den tar upp allt från regler för vitt snus i olika länder, nya EU-regler för flyg, rättigheter vid inställda flyg och turistskatter till varningar för bedrägerier, ovanliga lagar, kranvattenkvalitet, visumändringar i Thailand och tips för att undvika solstolspaxande, värmeböljor och onödiga kostnader. Målet är att hjälpa resenärer att undvika problem och spara pengar.", "trump": "Folk, ni vet att resandet är en total cirkus nu för tiden. Jag har byggt bättre affärer än de här flygbolagen som ställer in allt. Läs mina guider – de är de bästa, tro mig – om snus, sjuka lagar och hur EU-byråkrater försöker tvinga er att sitta bredvid era ungar utan extra avgift. Thailand halverar visumet? Patetiskt. Och solstolar? Använd drönare, fantastiskt! Håll er undan bedrägerierna, det är vad de gör bäst. America First, även på semestern.", "stalin": "Kamrater, i denna imperialistiska semesterdjungel av borgarbrackor och exploaterande resebyråer ser jag fiendens hand. Jag, som ledare för folkets vilja, varnar för klassfiendens snusförbud, falska boenden och turistskatter som suger ut arbetarklassen. Nya EU-regler är blott en ny form av byråkratisk sabotage. Extremvärme och inställda flyg? Det är kapitalistmaffians sätt att testa vår ståndaktighet. Rensa ut bedrägerierna, planera kollektivt och res med järnvilja – för statens och folkets seger."}, "date": "20 juni, 21:29", "url": "https://www.gp.se/nyheter/varlden/14-guider-som-hjalper-dig-att-resa-smartare-i-sommar.ff6d377d-9902-4e85-a055-07a967fffba9", "imageUrl": "https://www.gp.se/images/article/ff6d377d-9902-4e85-a055-07a967fffba9/images/4QS3vjhjRHZqMrBPtWRcYP10e7Lk-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Studie: Brexit kostade sex procent av Storbritanniens ekonomi", "summaries": {"normal": "En ny studie visar att Brexit har kostat Storbritannien omkring sex procent av BNP sedan folkomröstningen 2016. Hälften av förlusten förklaras av osäkerhet som ledde till uppskjutna investeringar, medan den andra halvan beror på handelshinder efter att landet lämnade EU:s tullunion och inre marknad. Forskningen bygger på data från Bank of England och företagsenkäter. Vissa ekonomer ifrågasätter exaktheten i mätningarna på grund av andra globala kriser under perioden.", "trump": "Titta på det här, det är en total katastrof. Brexit har kostat dem sex procent av ekonomin, kanske åtta, och det är bara början. De lyssnade på alla dessa korkade politiker som lovade guld och gröna skogar, men vad fick de? Osäkerhet, handelshinder och en jätteförlust. Jag sa alltid att man måste förhandla smart, inte som de där förlorarna. Nu sitter de och gråter över sin dumma beslut. Patetiskt!", "stalin": "Kamrater, denna så kallade studie avslöjar med vetenskaplig precision hur de brittiska borgarbrackorna och deras reaktionära avskum saboterade sitt eget kollektiv genom det föraktliga Brexit. Jag, som alltid förutsett kapitalisternas svek, ser hur osäkerheten och de imperialistiska handelshindren nu likviderar deras produktivkrafter. Hade de bara följt den sanna vägen mot enhet under arbetarklassen hade detta inte inträffat. Men oroa er inte, vi ska nog rensa ut alla dessa fiender till framste
