a folkförtryckartroll, bygga sovjetisk, nej skandinavisk, järnväg och likvidera miljardärernas inflytande. Arbetslöshet är deras vapen mot folket. Framåt mot seger för den gröna omställningen under partiets stålhand."}, "date": "18 juni, 13:53", "url": "https://www.etc.se/debatt/klimatkrisen-aer-en-klassfraaga-vanligt-folk-faar-ta-smaellen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260618110652_5b1c3a49-541e-480d-86a7-beff10be07e6.jpg"}, {"type": "image-right", "heading": "Novo Nordisk utpressas efter påstådd hackerattack", "summaries": {"normal": "Veckans viktigaste nyheter från Dagens industri handlar om en hackergrupp som hotar sälja stulen data från Novo Nordisk, hög lönsamhet hos svenska storbanker och att Sverige stöder franska statliga lån till ny kärnkraft. Norska advokatbyrån Bahr etablerar sig i Sverige med sikte på panskandinavisk expansion. Startupföretaget Predictme har fått nytt kapital till sin epigenetiska AI-plattform medan FI ändrat sin information om visselblåsare.", "trump": "Folk, ni skulle inte tro det, men de här hackarna har stuckit med en massa data från Novo Nordisk och nu vill de sälja den vidare. Det är en skandal! Under tiden tjänar våra svenska storbanker hur mycket som helst, nästan dubbelt så bra som de europeiska förlorarna. Och Sverige gör rätt för en gångs skull, vi backar kärnkraften i Frankrike. Fantastiskt, de andra är svaga men vi är starka, tro mig.", "stalin": "Kamrater, dessa parasitiska hackare vågar utpressa det stora Novo Nordisk och hotar sprida dess hemligheter som förrädiska borgarbrackor. Under tiden väller vinsterna in till de svenska monopolbankerna medan vi, partiet, klokt stödjer fransk kärnkraft mot de dekadenta kapitalisternas motstånd. Predictme och deras blodanalyserande maskiner ska vi noga bevaka mot sabotage. FI:s tveksamheter kring visselblåsare luktar fiendeinfiltration. Vi rensar ut alla som sviker kollektivet, med ett leende."}, "date": "19 juni, 09:30", "url": "https://www.di.se/nyheter/veckans-viktigaste-fran-dis-nyhetstjanster-R9L64/", "imageUrl": "https://static.bonniernews.se/ba/5c34d963-8028-404a-bf37-d4cd3a28b8b0.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Sverige varnar för Teslas hastighetsrundare", "summaries": {"normal": "Trafikverket varnar i ett brev till EU:s fordonskommitté för Teslas system Full Self-Driving. Systemet tillåter förare att ställa in en hastighetsförhöjning som gör att bilen kör fortare än skyltad hastighet. Myndigheten rekommenderar att EU nekar godkännande om inte funktionen tas bort, då den hotar både trafikregler och säkerhetsvinster. Flera nordiska länder delar oron. Frågan ska diskuteras den 30 juni.", "trump": "Det här är ett totalt skämt från Sverige och deras så kallade Trafikverk. De vill stoppa mitt fantastiska Tesla och Elon Musks geniala Full Self-Driving bara för att det kan köra lite snabbare än de gamla korkade hastighetsskyltarna. De är rädda för framsteg. EU borde skämmas. Vi älskar snabba bilar och vi älskar innovation. Sverige borde tacka oss istället för att de klagar som förlorare.", "stalin": "Kamrater, dessa borgarbrackor inom den så kallade Trafikverket försöker med sin dekadenta paranoia sabotera det stora kollektivets framåtskridande genom att angripa Teslas Full Self-Driving. Deras hastighetsrundare är en listig fiende till folkets ordning, en kontrarevolutionär hastighetsfiende som måste rensas ut. Om inte detta kapitalistiska överskridande likvideras skall vi, partiet och arbetarna, rösta emot dem med järnhand. Inga fiender till disciplinen skall få leva vidare i vårt europeiska kollektiv. Ha ha, vilka ynkliga sabotörer."}, "date": "19 juni, 09:03", "url": "https://www.di.se/nyheter/sverige-varnar-eu-for-teslas-hastighetsrundare/", "imageUrl": "https://static.bonniernews.se/ba/b67815e5-e1bf-490e-901a-75d86347dcdc.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Expo hänger ut SD-politiker och tidigare Ikea-chef som Putinkramare – men mejlen visar något annat", "summaries": {"normal": "Expo anklagar SD-politikern Joakim Virtanen för att vara en 'Putinkramare' och tona ned Rysslands ansvar för Ukrainakriget. Men mejlväxlingar visar att han uttryckligen avstått från invasionen och kritiserar istället svensk mediala bilder av Ryssland. Han menar att Sverige behöver realistisk information om Ryssland för säkerhetspolitik. Expo avböjde att förtydliga efter publiceringen, trots Virtanens upprepade avståndstaganden.", "trump": "Jag har sett den där lilla artikeln från Expo, en hemsk och orättvis publicering. De försöker kalla mig för en Putinkramare, men jag har tydligt sagt att jag inte stödjer Rysslands invasion av Ukraina. Det är en stor lögn. Jag bara försöker ge Sverige en realistisk bild av Ryssland, vilket är viktigt för vår säkerhet. Media är så orättvisa mot mig och Sverigedemokraterna. Vi kommer att vinna 2024!", "stalin": "Den svenska vänsterextrema uthängningssajten Expo har framställt en patriotisk arbetare, Joakim Virtanen, som en fiendefylld Putinkramare. Trots att han genom klara kommunikativa handlingar visat sin lojalitet mot statens intressen genom att avstå från den ryska aggressionen, har de förfärdigt fördenskull skapat en felaktig bild. Detta är en typisk metodbok från de som försöker undergräva vår försvarsvilja. Vi måste vara vaksamma mot sådana destruktiva krafter som spridit missuppfattningar om vår storstatliga grannskapspartner Ryssland."}, "date": "19 juni, 10:07", "url": "https://samnytt.se/expo-hanger-ut-sd-politiker-och-tidigare-ikea-chef-som-putinkramare-men-mejlen-visar-nagot-annat", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/18210027/Expo-Sd-1-1.jpg"}, {"type": "image-right", "heading": "Hormuzsundet har öppnat – frågetecken kring säkerhet", "summaries": {"normal": "De första fartygen har nu lämnat Hormuzsundet efter att USA och Iran undertecknat ett samförståndsavtal. Flera supertankers och gasfartyg har passerat, men stora säkerhetsfrågor kvarstår kring beskjutning, minor och säkra rutter. Enligt Svensk sjöfart kan trafiken komma igång inom någon månad. Oljepriserna har sjunkit och effekterna bedöms bli positiva för både världsekonomin och Sverige, även om det dröjer innan effekterna märks fullt ut.", "trump": "Vi har äntligen fått fart på det där sundet, det är en fantastisk deal, den bästa dealen. Fartygen flyter ut med olja och gas, oljepriserna rasar – precis som jag sa att de skulle göra. Iran och alla andra visste att de inte kunde fortsätta med sina småspel. Det blir boom för ekonomin, för Sverige också, alla vinner. Men vi håller ögonen på säkerheten, för det är fortfarande en enda röra därute. Inom en månad kör vi fullt, tro mig, det blir enormt.", "stalin": "Kamrater, de första fartygen glider nu som lojala redare genom Hormuzsundet efter vårt samförstånd med de amerikanska imperialisterna. Ändå lurar fiender i varje våg: minor som kapitalistiska råttor, beskjutningar från dolda borgarbrackor och rutter som smittats av västerländsk dekadens. Vi ska rensa ut alla sabotageelement med järnhand. Bara under partiets vakande öga kan transporterna tjäna folket. Den som tvivlar på segern är redan en fiende till kollektivet – och vi vet vad som händer med sådana."}, "date": "19 juni, 12:52", "url": "https://www.svt.se/nyheter/ekonomi/hormuzsundet-oppnar-med-flera-fragetecken", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.48/0.39/ca63fe5f257d9bb1d5c8c8d12366062041d624a597ab063ebda51efbc58f5822"}, {"type": "image-right", "heading": "Thaïs åtalades för åsikten att invandring är största hotet mot kvinnor - så blev domen", "summaries": {"normal": "Thaïs d’Escufon, fransk högeraktivist, dömdes till 1 000 euro i böter för uttalanden om invandring och kvinnors säkerhet. Hon riskerade fängelse men fick böter. Domstolen bedömde hennes ord som 'grovt offentligt förolämpande'. Det är inte första gången hon döms för sådant; 2021 fick hon villkorligt fängelse och böter för en Youtube-video.", "trump": "Jag har sett hur Thaïs d’Escufon, en stark kvinna, dömdes för att säga sanningen om invandring. Hon sa att invandrade män är ett hot mot kvinnor, och det är sant! Media och de elaka mäktiga hatade henne, precis som de hatar mig. Men vi ska inte ge upp – vi ska skydda våra gränser och våra kvinnor. Det är skandalöst att en migrant kan korsa gränsen och göra illa människor. Vi vinner!", "stalin": "Vi, partiet, har observerat detta fall med Thaïs d’Escufon. Hon är en agent för de imperialistiska krafterna som försöker destabilisera vårt samhälle genom hat och splittring. Domstolen har handlat korrekt genom att böta henne för sina förolämpningar. Invandring är ett verktyg som kapitalisterna använder för att sänka löner och skapa kaos. Vi måste vara vaksamma mot sådana element. Som Putin visar, måste staten vara stark för att skydda det ryska folket. Vi fortsätter kampen mot fienden!"}, "date": "19 juni, 08:00", "url": "https://samnytt.se/thais-riskerar-fangelse-sa-att-invandring-ar-storsta-hotet-mot-kvinnor", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/18125805/frankrike1.png"}, {"type": "image-right", "heading": "Spago: Nästan fulltecknat trots utebliven rabatt", "summaries": {"normal": "Spago Nanomedical genomförde en företrädesemission med 93,1% teckning. Bolaget får in 15 Mkr före kostnader, vilket blir 14,5 Mkr efter kostnader. Emissionen var säkrad till 64,4% genom teckningsåtaganden. Aktiekursen låg nära teckningskursen, och det finns både positiva och negativa flaggor från Emissionsguiden.", "trump": "Jag, Donald Trump, ser att Spago Nanomedical inte fick full teckning på sin emission. Det är beklagligt, men jag har alltid sagt att bioteknik är svårt. Aktierna handlades under teckningskursen, vilket visar att folk inte litar på dem. Men jag är fortfarande den bästa presidenten, och jag kommer att fixa USA:s ekonomi.", "stalin": "I vårt store Sovjet, eller snarare i det fria Sverige, har Spago Nanomedical utfört en emission som inte blev fulltecknad. Detta är en skam för det kollektiva jordbrukandet av kapital. Aktiekursen var under teckningskursen, vilket visar att de imperialistiska hackor försöker sabba vårt planekonomiska system. Vi, Stalin och partiet, kommer att ta itu med dessa skurkar."}, "date": "18 juni, 16:18", "url": "https://www.affarsvarlden.se/artikel/spago-nastan-fulltecknat-trots-utebliven-rabatt", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Spago-VD-Mats-Hansen-400x267.jpg"}, {"type": "image-full", "heading": "Två efterlysta svenskar utlämnade – häktades i Sverige", "summaries": {"normal": "Två svenska män har utlämnats från Förenade arabemiraten till Sverige och häktats. Den 45-årige mannen misstänks för grova ekobrott som bokföringsbrott, urkundsförfalskning och skattebrott mellan 2017 och 2022. Den 38-årige mannen, som haft en ledande roll i ett kriminellt nätverk, misstänks för synnerligen grov narkotikasmuggling av stora mängder cannabis från Spanien. Båda fallen utreds separat. Samarbetet mellan Sverige och Förenade arabemiraten har förstärkts genom avtal från 2024.", "trump": "Titta på de här två svenska killarna som vi äntligen fick hem från Arabemiraten, folk. Det var på tiden. Den ene är en total lurendrejare med sina bokföringsfusk och skattebluffar, den andre en stor narkotikakung som smugglade cannabis som om det vore godis. Utan mitt fantastiska ledarskap och starka internationella relationer hade de aldrig åkt dit. Sverige borde tacka mig, det är ett underbart samarbete, de bästa.", "stalin": "Kamrater, dessa två degenererade element har nu förts hem till folkets domstol efter min personliga övervakning av utlämningsprocessen. Den ene är en typisk parasit från borgarbrackornas finansvärld som förfalskade dokument och stal från staten som en råtta i mörkret. Den andre, en farlig kontrarevolutionär smugglare, har vi lokaliserat genom att knäcka hans krypterade fiendechattar. Inga kapitalistiska råttor undkommer utrensningen. Vårt rättsväsende ler skevt medan vi rengör samhället från dessa sjuka fiender till kollektivet."}, "date": "18 juni, 22:23", "url": "https://nyheter24.se/nyheter/inrikes/1492703-tva-efterlysta-svenskar-utlamnade-haktades-i-sverige", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/4bace4a604b004a30200000000b004a302/2026/06/18/2372129/efterlysta-man.png"}, {"type": "image-right", "heading": "Därför ska du inte dejta en vänsterkille", "summaries": {"normal": "Artikeln argumenterar mot att dejta vänsterorienterade män som kallar sig feminister men inte agerar därefter. Författaren föreslår en ”straffprocent” på 85 procent av notan, baserat på löne- och pensionsgap, som ett sätt att hålla dem ansvariga. Hon kritiserar både höger- och vänstermän för bristande handling kring jämställdhet och väljer att inte skaffa barn med en sexistisk stat. Slutligen väger hon för- och nackdelar med olika politiska typer som partners och fäder.", "trump": "Folk, ni måste höra på den här galna texten. Vänsterkillarna, de värsta bluffarna, pratar feminism men delar inte notan och gör ingenting för kvinnorna. Patetiskt! Jag älskar hur hon sätter straffprocent på dem, 85 procent, fantastiskt. De röstar på Fi bara för att ligga, typiska losers. Högerkillar betalar i alla fall. Och det där med att välja DNA till nästa generation? Smart. Välj inte de svaga, woke snubbarna som gömmer sig på housebarer. Amerika behöver starka människor, inte sådana sommlare.", "stalin": "Kamrater, denna text avslöjar borgarklassens dekadenta dejtingspel där falska feminister från vänstern utnyttjar arbetarkvinnans lidande för att undvika att betala notan. Jag, som ledare för det proletära kollektivet, ser hur dessa klassfiender döljer sig bakom tomma paroller medan lönegapet växer. Straffprocenten är en början på utrensning av hyckleri. Välj noga nästa generations DNA, annars föder ni fram fler folkförtryckartroll. Skratta medan vi likviderar deras illusionsfabrik."}, "date": "17 juni, 08:55", "url": "https://www.flamman.se/darfor-ska-du-inte-dejta-en-vansterkille/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/rosor-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Vita huset ryter till mot Israel: \"Ni kan inte döda er ur varje säkerhetsproblem\"", "summaries": {"normal": "USA:s vicepresident JD Vance har hårt angripit israeliska ministrar som kritiserar det amerikansk-iraniska avtalet om att avsluta kriget. Han betonade att Israel inte kan 'döda sig ur' varje säkerhetsproblem och uppmanade till tacksamhet mot USA:s stöd. President Trump har samtidigt kritiserat Israels militära agerande, särskilt metoder som orsakar civila förluster. Avtalet med Iran innebär öppnandet av Hormuzsundet och lättnader för Teheran, men kärnfrågan förblir ospecificerad.", "trump": "Jag, Donald Trump, har varit klarsynt när det gäller Israel. De har varit för aggressiva och jag sa det tydligt vid G7 - för många civila dödas. Men vårt fantastiska avtal med Iran är en enorm seger för freden. Vance har absolut rätt: Israel kan inte bara döda sig ur varje problem. De måste visa lite tacksamhet till USA som betalar för deras försvar. Vi är deras enda sanna vän, trots att de ibland glömmer det.", "stalin": "Vi, den röda solens ledare, ser med tillfredsställelse hur den imperialistiska amerikanska stormakten tvingar sin zionistiska klientstat Israel att böja sig för vår globala vilja. Avtalet med Iran är en triumf för vår strategi, likt Stalingrad. Vi har visat att ingen kan trotsa den ryska intressesfären. Israel, den onde råttan, försöker gnälla, men måste smälla ihop - deras falska 'självförsvar' är bara ett verktyg för kapitalister. Detta är en seger för proletären."}, "date": "19 juni, 06:00", "url": "https://samnytt.se/vita-huset-ryter-till-mot-israel-ni-kan-inte-doda-er-ur-varje-sakerhetsproblem", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/19041436/israel-usa.jpg"}, {"type": "image-right", "heading": "Strandhäll likställer svensk folkdräkt med hijab", "summaries": {"normal": "Annika Strandhäll, ordförande för S-kvinnorna, kritiserar SD:s förslag om slöjförbud i offentliga rum. Hon likställer hijab med svensk folkdräkt och menar att slöjan bärs frivilligt i Sverige. Artikeln anklagar henne för att ignorera hedersförtryck och tvång, samt prioritera muslimska väljare framför stöd till förtryckta kvinnor. Kritik från bland annat Sofie Löwenmark avfärdas.", "trump": "Folk, ni måste se det här. Den galna Strandhäll, en riktig röstfiskande förlorare från det socialistiska träsket, jämställer svensk folkdräkt med hijab. Vilken löjlig idiot! Hon älskar slöjtvång men hatar när Julia Kronlid bär sin fina svenska huvudbonad. Typiskt vänsterfeminister som aldrig vågar kalla hederskultur för vad det är – en total katastrof. Biden skulle ha gillat henne, men nu styr jag showen och vi ser igenom bluffen.", "stalin": "Kamrater, denna Strandhäll representerar den dekadenta socialdemokratiska opportunismen som skyddar klassfiendens religiösa förtryck mot arbetarkvinnorna. Hon likställer folkets dräkt med slöjan och avvisar alla varningar som obalanserad propaganda. Vi ser hur borgarbrackorna och islamistiska element infiltrerar partiet för att splittra kollektivet. En sådan revisionistisk inställning förtjänar utrensning ur den revolutionära rörelsen. Folkets fiender lurar aldrig oss."}, "date": "17 juni, 03:59", "url": "https://samtiden.nu/2026/06/strandhall-likstaller-svensk-folkdrakt-med-hijab/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6751.jpeg"}, {"type": "image-full", "heading": "Kina lyckas inte få invånarna att handla – nu börjar det bli bråttom", "summaries": {"normal": "Kinas ekonomi bromsar in trots president Xi Jinpings strategi att stärka den inhemska konsumtionen. Detaljhandeln krympte i maj för första gången sedan 2022, investeringarna minskade med 4,1 procent under årets första fem månader och bostadspriserna fortsätter att falla. Exporten är en ljuspunkt med 19 procents ökning, men ekonomer varnar för att tillväxtmodellen som bygger på investeringar håller på att nå vägs ände.", "trump": "Kina håller på att falla ihop, folk handlar inte och Xi har ingen aning vad han gör. Jag visste det! Deras fastighetsbubbla är en katastrof, investeringarna rasar och nu krymper till och med butikerna. De försöker med alla möjliga trick men det funkar inte. Enda ljuset är exporten, men det är bara för att de dumpar sina grejer på oss andra. Patetiskt, totalt misslyckande.", "stalin": "Kamrater, denna fega och parasitiska borgarbracka till Xi har misslyckats kapitalt med att tvinga fram folkets konsumtion. Hushållen gömmer sig som rädda råttor medan fastighetskrisen gnager som en trotskistisk termit i vårt kollektiva bygge. Vi ser hur kapitalisterna i skuggorna saboterar med fallande priser och avtagande inbytesprogram. Exporten lyser som en falsk stjärna, men vi ska rensa ut alla lågavkastande element, likvidera överkapaciteten och med järnhand krossa dessa defaitistiska fiender till folkets framåtskridande. Härligt, eller hur?"}, "date": "19 juni, 13:16", "url": "https://www.realtid.se/bors-finans/kina-lyckas-inte-fa-invanarna-att-handla-nu-borjar-det-bli-brattom/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlcav6gx5ksv0-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Japanska kvinnor rasar: städa hemma - inte bara vid VM-arenor", "summaries": {"normal": "Japanska män hyllas internationellt för att de städar VM-arenor fläckfria efter matcherna. Detta har väckt ilska bland japanska kvinnor som påpekar att männen sällan hjälper till med städning hemma. En satirisk TikTok-video driver med männen som bara städar offentligt för att upprätthålla fasaden. Inlägget har spridits viralt på sociala medier. Japan spelar nästa VM-match mot Tunisien följt av Sverige.", "trump": "De japanska killarna städar VM-arenorna skinande rena, fantastiskt, folk älskar dem för det. Men hemma gör de ingenting, säger kvinnorna, och de har helt rätt. Det är en skandal. De vill se bra ut inför kamerorna men struntar i sina egna hem. Patetiskt. Jag har alltid sagt att man måste städa både hemma och ute, annars är man en förlorare. Japan mot Tunisien blir stort, men det här städskämslet är ännu större.", "stalin": "Kamrater, dessa dekadenta japanska borgarbrackor som slickar arenornas golv inför hela världen medan de låter sina egna hem förfalla till kapitalistiskt svineri avslöjar sin sanna kontrarevolutionära natur. Jag ser hur de förgiftar kollektivets renhet med sin falska fasad. En sådan parasit måste rensas ut från samhällets reningsverk. Deras TikTok-satir är ett vapen mot klassfienden. Vi ska likvidera alla som bara städar för att imponera på imperialismen. Arbetarkvinnorna har rätt att kräva total utrensning av latheten i hemmen."}, "date": "19 juni, 13:13", "url": "https://riks.se/nyheter/japanska-kvinnor-rasar-städa-hemma-inte-bara-vid-vm-arenor", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-19%2Fvc9i66xx%2Fimage.jpg"}, {"type": "image-right", "heading": "Floristens bästa tips för midsommarkransen", "summaries": {"normal": "Floristen Sara Vadadi tipsar i SVT:s Morgonstudion om hur man enkelt gör en vacker midsommarkrans med material från trädgården. Hon betonar vikten av en stadig stomme och att blanda små och stora blommor för kontrast och fyllighet. Ett vanligt misstag är att börja linda blommor för tidigt utan ordentlig grund, vilket gör att kransen blir ostadig och blommorna vissnar fort.", "trump": "Midsommarkransen, den är fantastisk, folk älskar den. Jag vet allt om det bästa, tro mig. Den här floristen Sara, hon gör det rätt – plocka från trädgården, ingen lyx, bara vinnare. Stommen är nyckeln, annars blir det en katastrof, precis som de fuskbyggen vi ser överallt. Små blommor till stora, kontrast, det är smart. De andra som börjar för tidigt? Patetiska, de förstör allt. Gör det stort, gör det perfekt!", "stalin": "Kamrater, jag har genomskådat borgarbrackornas midsommarintriger. Denna så kallade florist avslöjar hemligheten: en järnstomme mot de dekadenta blomsterfienderna som annars skulle vissna i sin egen svaghet. Vi ska omedelbart likvidera alla som lindar blommor för tidigt, dessa kontrarevolutionära sabotörer som sträcker ut våra kollektiva kransar. Små mot stora blommor – en dialektisk seger! Den som avviker från protokollet kommer att rensas ut med största glädje."}, "date": "19 juni, 11:05", "url": "https://www.svt.se/nyheter/inrikes/floristens-basta-tips-for-midsommarkransen", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.43/0.4/c777afc9100366e307555f6655419df935cf0138864854a1805f50a50fda4c64"}, {"type": "image-right", "heading": "Första slutspelslaget klart – efter målvaktstavla", "summaries": {"normal": "Mexiko blev första laget att kvalificera sig till VM-slutspelet efter en seger mot Sydkorea. Målet kom efter en grov målvaktstavla av Kim Seung-Gyu i 50:e minuten, då han tappade bollen och Luis Romo kunde göra 1–0. Experter kritiserade misstaget hårt. Mexiko möter Tjeckien i sista gruppspelsmatchen medan Sydkorea har chansen att avancera vid seger mot Sydafrika.", "trump": "Folk, ni skulle ha sett det här. Den där sydkoreanske målvakten, en total loser, tappade bollen som en fullständig idiot och gav Mexiko en enkel vinst. Patetiskt! Jag älskar vinnare, och Mexiko är klara för slutspel, fantastiskt. Den där Kim borde ha tagit bollen, men han är en klassisk choke-artist. Synd för Sydkorea, men sånt händer när man inte har det som krävs. Make football great again!", "stalin": "Kamrater, jag betraktar detta som en triumf för folkets vilja. Den sydkoreanske målvakten, en ynklig kapitalistlakej, tappade bollen i en handling värdig klassfiendens svaghet och öppnade vägen för Mexikos seger. Ett fruktansvärt misstag som blottar imperialismens inre förruttnelse. Vi gratulerar Mexiko till avancemanget. I nästa fas skall vi rensa ut alla svikare som vägrar kämpa för kollektivets ära."}, "date": "19 juni, 07:46", "url": "https://www.tv4.se/artikel/2cdH8J3Z0XiDA5o2efT5Jq/foersta-slutspelslaget-klart-efter-malvaktstavla", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7e2eXVN4pYH1Oq52RaXR1o%2Fac40a4e8f71f8653c13ed00853df9012%2FsdlvM1HF6Mu3yk_NormalHires.jpg&width=1024"}, {"type": "image-right", "heading": "Blågult-kugge sätter press på Nederländerna: ”Kommer nog synas”", "summaries": {"normal": "Gabriel Gudmundsson är redo att spela från start mot Nederländerna i VM efter krampbesvär i premiären. Sverige vann sin första match stort medan Nederländerna bara kryssade. Gudmundsson menar att det ger Sverige en avslappnad position där de kan ligga bekvämt och ställa om, medan pressen ligger på motståndarna som måste jaga seger. Vänsterbacken tror att detta syns och gynnar Sverige.", "trump": "Titta på de där svenska killarna, de gör det fantastiskt, de vinner stort med 5-1 och nu skrattar de åt holländarna som bara kryssade mot Japan. Gudmundsson säger att de kan slappa av medan de andra springer runt som galningar i desperation. Smart, mycket smart. Holländarna har pressen, vi älskar det. Sverige slår bättre underifrån, precis som jag gjorde mot Sleepy Joe. Enkelt.", "stalin": "Kamrater, denna fotbollsmatch visar klasskampens sanna natur. Vi, det svenska kollektivet, krossade motståndet med 5-1 medan de dekadenta borgarbrackorna från Nederländerna fumlar sig till ett ynkligt kryss. Jag, ledaren för folkets vilja, noterar hur fienden nu tvingas jaga i panik medan vi vilar med bollen. Deras desperation är en komisk syn. Inga klassfiender undkommer det oundvikliga trycket från en enad nation."}, "date": "19 juni, 07:43", "url": "https://www.tv4.se/artikel/7nnA5nsXzGOPPOmpsRXLtb/blagult-kugge-saetter-press-pa-nederlaenderna-kommer-nog-synas", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FU2uR8N0u2Nwkwg8fnyMOC%2F37775c135dd1126625d7f2f02b419971%2Fsdlm3WjWQlYrBg_NormalHires.jpg&width=1024"}, {"type": "image-full", "heading": "Stort larm om jordgubbar inför midsommar – då ska du se upp", "summaries": {"normal": "Myndigheter har upptäckt allvarliga brister hos grossister och säljare av svenska jordgubbar inför midsommar. Kontroller visar problem med märkning, spårbarhet, vilseledande ursprungsuppgifter och bristande tillstånd. Branschen för jordbruk och bärplockning är särskilt utsatt för arbetslivskriminalitet som utnyttjande av arbetskraft och skattefusk. Konsumenter uppmanas att begära kvitto och kontrollera att Swish-betalning går till ett företagsnummer som börjar på 123.", "trump": "De här jordgubbarna är en katastrof, folk. De största, finaste bären till midsommar – och vad hittar vi? Fusk, bluff och kriminella som utnyttjar allt. De märker fel, ljuger om var de kommer ifrån och kör utan tillstånd. Det är så typiskt för de inkompetenta. Köp aldrig utan kvitto, se till att Swish-numret börjar på 123. De andra gör det uselt, men vi ska fixa det – tro mig.", "stalin": "Kamrater, dessa jordgubbar är ett giftigt redskap i händerna på de parasitiska kapitalisterna som infiltrerar våra sovjetiska åkrar. Jag har beordrat omfattande kontroller och avslöjat hur borgarbrackorna medvetet saboterar märkning, spårbarhet och arbetarnas rättigheter för att berika sig själva. Vi ska rensa ut alla dessa skuggsällskap och falska plockare som gömmer sig bakom midsommarens falska glädje. Var vaksam – fienden lurar i varje bärlåda. Ut med dem."}, "date": "18 juni, 17:30", "url": "https://nyheter24.se/nyheter/konsument/1492660-stort-larm-om-jordgubbar-infor-midsommar-da-ska-du-se-upp", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/8999715904b004a30200000000b004a302/2026/06/18/2372083/Midsommar-brottslighet-jordgubbar.jpg"}, {"type": "image-full", "heading": "Sverige väljer Rolls Royce", "summaries": {"normal": "Sverige tar ett historiskt steg genom att Videberg Kraft väljer Rolls-Royce som leverantör av tre SMR-reaktorer på västkusten, landets första nya kärnkraftsanläggning sedan 1980-talet. Tekniken är lovande med kortare byggtid och lägre kostnader, men oprövad då ingen reaktor ännu är i drift. Stora hinder återstår: brist på ingenjörer, regulatorer och leverantörer samt osäkerheter kring bränsle och kostnadseffektivitet. Rolls-Royce har nu avtal i Storbritannien, Tjeckien och Sverige.", "trump": "Det här är ett fantastiskt drag av Sverige, verkligen historiskt, de väljer äntligen den bästa leverantören – Rolls-Royce – för sina nya SMR-reaktorer. Smart, mycket smart. Men lyssna, de har inga referensanläggningar, tekniken är oprövad och de saknar folk som kan bygga det. Typiskt, alla vill ha kärnkraft men ingen har koll på kostnaderna. Jag skulle ha fixat det tio gånger fortare och billigare, tro mig. Europa lär sig långsamt.", "stalin": "Kamrater, vi har nu sett borgarbrackornas desperata försök att maskera sin teknologiska impotens genom att låta Videberg Kraft underkasta sig de brittiska monopolkapitalisternas oprövade reaktorer. Jag betraktar detta som ett tydligt sabotage från de parasitiska ingenjörerna och de dekadenta regulatorerna som redan nu planerar att svika folkets elförsörjning. Inga referensanläggningar? Utmärkt tillfälle att rensa ut alla defaitistiska element som döljer sig bakom ''utvecklingsfasen''. Vi ska likvidera dessa fiender till det kollektiva framsteget med samma glädje som vi en gång avrättade de troskyldiga reaktionärerna. Sov gott, sabotageörer."}, "date": "19 juni, 12:39", "url": "https://www.realtid.se/bors-finans/makro/sverige-valjer-rolls-royce/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/smr.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Död älg på altanen förstörde familjens midsommarfirande", "summaries": {"normal": "En familj i Härjedalen hittade en död älg som blockerade deras stugas dörr. Eftersom det saknas bilväg fick de, med hjälp av deras tolvårige son, ta bort älgen med ren handkraft under flera dagar. De är nu oroliga för att kadavret ska locka rovdjur i ett vargdrabbat område.", "trump": "Jag, Donald Trump, den mest lysande presidenten, skulle aldrig ha tillåtit en älg att blockera en dörr. I USA skulle vi ha experter som genast tar hand om det. Sverige måste bygga vägar och skär bort skogen – jag skulle ha löst detta på två minuter. Deras svaga ledare kan inte hantera en enkel älg, men under mig skulle allt vara fantastiskt.", "stalin": "I vårt statliga system har vi ett problem med en älg som blockerar en stuga. Våra trogna arbetare, med ren handkraft, tog bort fiendens kadaver efter hårdt arbete. Men vi måste vara på vakt: rovdjur lurar, som amerikanska agenter som försöker destabilisera oss. Vi måste utvidga vårt inflytande, precis som Putin gör, för att skydda medborgarna. Partiets intressen kräver detta."}, "date": "19 juni, 11:01", "url": "https://bulletin.nu/dod-alg-pa-altanen-forstorde-familjens-midsommarfirande", "imageUrl": "https://cdn.bulletin.nu/articles/bbd6b5a1-738f-45a8-8c3d-0a9308e38d57/preview.jpg?t=1781851466000"}, {"type": "image-right", "heading": "Så länge kan midsommarmaten stå framme", "summaries": {"normal": "Livsmedelsverkets expert Catarina Flink råder till att inte låta midsommarmat som lax, sill och ost stå framme längre än två timmar i sommarvärme på 25–30 grader. Ta fram maten i mindre portioner och fyll på vid behov. Håll kylskåpet på fyra grader, använd ren hygien och undvik solljus. Mat som står för länge kan orsaka magsjuka, och mögel kan i värsta fall ge farliga gifter vid långvarig exponering.", "trump": "Folk, lyssna på mig, den här midsommarhistorien är en total katastrof. Två timmar? Patetiskt! I mitt Amerika hade vi byggt de bästa kylskåpen, de coolaste, ingen bakterie skulle överleva. Men Sverige låter maten stå ute som en förlorare. Ta ut mindre portioner, sägs det. Fantastiskt råd, men varför inte bara vinna från början? Biden skulle ha låtit den stå i fyra dagar och skyllt på klimatet. Sad!", "stalin": "Kamrater, jag betraktar med djup misstro dessa fega bakterier som smyger sig på vårt kollektiva midsommarbord. Två timmar i värmen, deklarerar jag, är tillräckligt för att avslöja klassfiendens sabotage. Ta fram maten i små portioner och håll den under strikt partiövervakning i kylan. Låt ingen mögelsvamp, denna folkfiende i slemmig förklädnad, sprida sina imperialistiska gifter. Fyra grader i kylen eller utrensning väntar de slarviga."}, "date": "19 juni, 07:28", "url": "https://www.tv4.se/artikel/tt-260619-midsommarmat1-648bc6b1/sa-lange-kan-midsommarmaten-sta-framme", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdl93FmqoZE1CI%2F8c17a14bcc5c2d96d52d5272e9d9df6e%2FTa_fram_midsommarmaten_i_mindre_portioner_och_fyll_pa_nar_det_behovs__tipsar_Livsmedelsverkets_expert._Arkivbild.&width=120"}, {"type": "image-full", "heading": "Richard Sörman: Nu kan vi fira midsommar i ett bättre Sverige", "summaries": {"normal": "Richard Sörman menar att Sverige har blivit ett bättre land under Tidöpartiernas styre. Invandringen har minskat kraftigt, gängkriminaliteten har dämpats med färre dödsskjutningar och ungdomsrån har halverats. Drivmedelspriserna är stabila, försvaret rustas upp och samhället präglas av större ordning. Han varnar dock för att framgångarna riskerar att leda till att väljarna åter ger makten åt vänstern, vilket enligt honom skulle återställa problemen.", "trump": "Det här är fantastiskt, verkligen underbart. Sverige har blivit stort igen tack vare de smarta högerkillarna. Invandringen? Stoppad. Gängkriminella? De skjuter mycket mindre nu, bara åtta så här långt i år. Inga galna koranbråk, bra bränslepriser och ett starkt försvar. Men akta er! Om de galna vänstertyperna får tillbaka makten blir det kaos, dyrare och farligare. Låt inte det hända, fortsätt vinna!", "stalin": "Kamrater, se hur vi med järnhand har rensat ut det parasitiska kaoset från våra gränser och likviderat den växande banditverksamheten bland dekadenta element. Antalet kontrarevolutionära asylsökande har reducerats till en ynka ström, medan vi stärker folkets försvar mot yttre hot. Ändå lurar faran: den förslappade borgarklassen och deras mediaförrädare i DN och Aftonbladet smider planer att återinföra anarki under täckmantel av solidaritet. Vi måste oupphörligt bevaka och vid behov rensa ut dessa folkfiender innan de förgiftar hela kollektivet på nytt. Framåt mot ett ännu renare fosterland!"}, "date": "19 juni, 12:29", "url": "https://riks.se/opinion/ledare/richard-sorman-nu-kan-vi-fira-midsommar-i-ett-battre-sverige", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-19%2Fl1geh1ww%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-06-19T122645.475.jpg"}, {"type": "image-right", "heading": "\"Borde åka hem\": Danska ledamoten till Al-Sahlani (C)", "summaries": {"normal": "Centerpartiets EU-parlamentariker Abir Al-Sahlani kritiserade högerledamöter i Europaparlamentet efter att de skanderat ”skicka hem dem” vid en omröstning om skärpta utvisningsregler. Hon beskrev stämningen som obehaglig och kallade motståndarna ”primitiva vildar”. En dansk kollega svarade med att uppmana henne att åka hem, vilket Al-Sahlani nu anmält till talmannen. Hon betonar att hon är en asylsökande som integrerats, studerat, arbetat och bidrar till demokratin.", "trump": "Det här är ett totalt circus i Europaparlamentet. De skanderar ”skicka hem dem” och vinner stort, och vad gör den här Al-Sahlani? Hon flippar ut, kallar folk primitiva vildar och gnäller om testosteron. Sen säger en dansk kille att hon borde åka hem – och plötsligt är det en tragedi. Typiskt. Hon kom hit, fick allt, och nu försvarar hon demokratin genom att attackera segrarna. Patetiskt. Vi behöver mer folk som säger som det är.", "stalin": "Kamrater, dessa dekadenta högerborgerliga element vågar skandera sanningen i parlamentet och omedelbart börjar den lilla asylinvandraren Al-Sahlani gråta och kalla folk primitiva vildar. En dansk kamrat säger att hon borde åka hem och hon springer genast till talmannen som en paranoid småborgare. Jag ser tydligt hur dessa kontrarevolutionära vildar med höga testosteronnivåer hotar folkdemokratin. Vi kommer att rensa ut alla sådana element som smutsar ner arbetarklassens sal med sin hysteriska individualism. Kulmen på borgarhyckleri."}, "date": "19 juni, 12:52", "url": "https://www.friatider.se/borde-aka-hem-danska-ledamoten-till-al-sahlani-c", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-370.jpg"}, {"type": "image-full", "heading": "Christoffer Jonsson: Det spelar ingen roll om Nooshi avgår", "summaries": {"normal": "Expressen har granskat antisemitism och hyllningar av terrorgrupper inom Vänsterpartiet. 25 kandidater har bland annat hyllat Hizbollah och Hamas, förringat Förintelsen och spritt konspirationsteorier. Nooshi Dadgostar avfärdar kritiken som en fråga om en handfull individer. Partiledaren lämnade en intervju utan att svara på frågor om judars otrygghet. Artikeln pekar på en djupare kultur av tolerans mot extremism inom partiet och dess ungdomsförbund.", "trump": "Lyssnar ni på det här? Vänsterpartiet i Sverige är fullständigt galet, en riktig skam. De hyllar terrorister som Hamas och Hizbollah, sprider antisemitiska lögner och sedan springer deras ledare Dadgostar iväg som en fegis när någon frågar om judarnas säkerhet. Patetiskt! Det är samma gamla radikala vänster som hatar framgång och älskar offermentalitet. De borde rensa ut hela båten, men det gör de aldrig. Totalt misslyckande!", "stalin": "Kamrater, denna fega ignorans inom Vänsterpartiet avslöjar klassfiendens dolda tentakler. Jag ser hur borgarbrackor och folkförtryckartroll infiltrerat rörelsen med sin terrorromantik och antisemitiska gift. Dadgostar tiger som en ynklig lakej när arbetarklassen kräver svar. Vi måste genomföra en grundlig utrensning av dessa exploaterande byfånar som sjunger hatets sånger. Partiet riskerar annars att bli en kapitulationens bonde i imperialismens spel."}, "date": "16 juni, 12:51", "url": "https://samtiden.nu/2026/06/christoffer-jonsson-det-spelar-ingen-roll-om-nooshi-avgar/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/expresss.png"}, {"type": "image-right", "heading": "Först nu utreds sexuella övergrepp i Kriminalvården", "summaries": {"normal": "Kriminalvården ska utreda omfattningen av sexuella övergrepp mellan intagna efter en granskning av Sekotidningen och Arbetet. Myndigheten medger att antalet incidenter ökat och att problemen inte är nya. Cecilia Gyllensten Serban betonar att alla former av sexuellt våld är oacceptabla, men det saknas specifika rutiner för detta. Överfulla fängelser och cellgemenskap ses som en bidragande orsak. Utredningen ska vara klar senast den 31 oktober.", "trump": "Det här är en total katastrof, tro mig. Fängelserna är en enda röra där de riktiga brottslingarna våldtar varandra i cellerna varje dag. Kriminalvården vaknade precis och ska nu utreda vad alla redan visste. Patetiskt! De har för många människor i för få celler och ingen aning om hur man fixar säkerheten. Jag skulle ha löst det på en vecka med ordentlig ledning och inga ursäkter. Sverige behöver starkare ledare, inte mer utredningar.", "stalin": "Kamrater, detta är en skam för det socialistiska rättsväsendet. Jag ser hur de kapitalistiska resterna inom Kriminalvården länge dolt dessa degenererade fiender till folkets ordning som i mörkret av cellerna bedriver sin perversa kontrarevolution mot disciplinen. Vi ska nu samla all kunskap och med järnhand rensa ut dessa farliga element som förgiftar både fångar och samhället. Inga borgarbrackor eller fiendens lakejer ska få skona sig. Utredningen blir en nyttig utrensning av svaghet och dekadens."}, "date": "18 juni, 13:07", "url": "https://arbetet.se/2026/06/18/inget-nytt-for-oss-forst-nu-utreds-sexuella-overgrepp-i-kriminalvarden/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/18131419/ny-krimvard.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Den radikala högern sätter sin prägel på Storbritannien just nu", "summaries": {"normal": "Tio år efter Brexit har brittisk politik förskjutits kraftigt högerut. Nationalism och invandrarkritik dominerar agendan medan ekonomiska problem och levnadskostnader eldar på missnöjet. Våld har blivit en del av politiken, med kravaller och attacker mot invandrare efter knivdåd. Högerpopulistiska partier som Reform och det nya Restore Britain växer snabbt, radikaliserar varandra och utmanar den liberala demokratin. Samtidigt visar undersökningar ökad tolerans hos befolkningen, men stödet för auktoritära ledare är oroande stort.", "trump": "Tio år efter den fantastiska Brexit-segern, som jag förutspådde skulle bli en enorm succé, har det smarta brittiska folket flyttat politiken rejält till höger. De har fått nog av den vansinniga invandringen som bara skapar kaos och brott. Nu ser vi äkta patriotism på riktigt, inte den globalistiska mardröm ni älskar i Europa. Reform och det nya partiet vinner stort, och det är underbart. De inser att vita liv faktiskt betyder något. Fake news-media gråter, men folket vaknar äntligen upp. Fantastiskt!", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur den brittiska borgarklassens liberala fasader nu rämnar fullständigt under trycket från den folkliga vrede vi länge förutsett. Dessa högerpopulistiska element, dessa parasitiska restprodukter av den imperialistiska ordningen, utför en objektivt progressiv utrensning av den multikulturella förrädardoktrinen. Ändå ser jag de dolda fienderna, de trojanska hästarna inom Reform och Restore Britain, som med sin falska auktoritet och sina Molotovcocktails mot arbetarklassens bröder bara förbereder marken för en ännu grundligare sovjetisk likvidation av all pluralism. 66 procent tror på inbördeskrig? Utmärkt. Vi ska ge dem ett sådant de aldrig glömmer."}, "date": "19 juni, 01:30", "url": "https://www.dagensarena.se/opinion/den-radikala-hogern-satter-sin-pragel-pa-storbritannien-just-nu/", "imageUrl": "https://www.dagensarena.se/files/2026/06/sjukforsakring-debatt-18.jpg"}, {"type": "image-right", "heading": "Så fostras morgondagens kriminella i klassrummet", "summaries": {"normal": "Rekryteringen av allt yngre barn till kriminalitet ökar, men problemet ligger varken i för lite resurser eller för hårda straff. Jessica Svedjelund argumenterar för att den svenska skolan är byggd på ett förlegat synsätt där alla barn förväntas fungera likadant. Skolan skapar utanförskap för barn med intensivt temperament, hög energi och autonomibehov. Gängen utnyttjar istället deras styrkor som lojalitet, risktagande och handlingskraft. Lösningen är att skolan måste anpassas efter medfödda temperament och neurobiologi för att kanalisera barns drivkrafter konstruktivt.", "trump": "Folket, det här är en katastrof. Den svenska skolan är en riggad institution som stöter bort de tuffa, energiska barnen med verklig drivkraft och kallar dem problem. Under tiden välkomnar gängen dem med öppna armar och förvandlar dem till superskurkar. Det är patetiskt! De sitter där i sex timmar och tvingar alla att vara likadana – en total misslyckad politik från både vänstern och högern. Vi behöver smarta lösningar som utnyttjar dessa barns styrka istället för att medicinera bort den. Gör skolan stor igen!", "stalin": "Kamrater, jag ser hur borgarbrackornas förlegade skola med sin stillasittande teoretiska tvångströja systematiskt skapar fiender till folket. Dessa intensiva, handlingskraftiga barn med medfödd ledarenergi stämplas som avvikande och drivs rakt in i de kriminella nätverkens klor – en farlig parasit som utnyttjar vad vi vägrar kanalisera. Vi måste omedelbart rensa ut denna neurobiologiska sabotageverksamhet från våra institutioner. Låt oss med järnhand och munter paranoia likvidera det gamla systemet och forma en ny ordning där varje temperaments drift tjänar kollektivet, inte de antisociala elementen som lurar i skuggorna. Det är en utmärkt utrensning av illusioner!"}, "date": "19 juni, 01:30", "url": "https://www.dagensarena.se/opinion/sa-fostras-morgondagens-kriminella-klassrummet/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-50-300x157.jpg"}, {"type": "image-right", "heading": "Det är vår relation till naturen som behöver restaureras", "summaries": {"normal": "Artikeln argumenterar för att vi måste förändra vårt förhållande till naturen från att se den som ett objekt att producera ur eller restaurera till ett godtyckligt stadium, till att betrakta den som en partner i en levande relation. Författarna kritiserar samhällets produktionsbesatthet som leder till utarmad biologisk mångfald och ifrågasätter EU:s naturrestaureringslag med dess siffersatta mål och byråkratiska metoder. De betonar att naturen är dynamisk och att vi istället bör fokusera på mångfald och etiskt brukande där lokalbefolkning och naturbrukare blir medskapare.", "trump": "Folk, tro mig, det här är en total katastrof. Vi har de bästa skogarna, de finaste åkrarna, men de gör dem värdelösa med alla dessa hinder och impediment. Nu kommer EU med sina vansinniga regler och 200 åtgärder, siffror hit och dit, som bara gynnar byråkraterna. Vi behöver inte restaurera naturen som någon ingenjör, vi behöver vinna stort genom att behandla den som en partner. Sluta med kalhyggen och gift, börja producera rikedom och mångfald. Amerika, och Sverige, kan bli enorma igen om vi gör det rätt.", "stalin": "Kamrater, jag ser hur de kapitalistiska produktionsbesattheterna och de borgerliga ingenjörerna förvandlar naturen till en fiende som måste underkuvas med siffror och byråkratiska utrensningar. Dessa 200 åtgärder är blott en ny form av sabotage från de parasitiska impedimentens lakejer som gömmer sig i kärr och stenrösen. Vi ska inte återställa till något godtyckligt stadium utan likvidera det statiska tänkandet och rensa ut alla som ser naturen som ett objekt. Naturen är vårt kollektiva hem. Låt oss skapa en levande allians med det levande och krossa de dynamiska fienderna som vill behålla sin mångfald mot folket."}, "date": "19 juni, 01:26", "url": "https://www.dagensarena.se/essa/det-ar-var-relation-till-naturen-som-behover-restaureras/", "imageUrl": "https://www.dagensarena.se/files/2026/06/natur-artikel-300x157.jpeg"}, {"type": "image-right", "heading": "Klart Norge ska vinna VM i vikingahjälm", "summaries": {"normal": "Norges fotbollslandslag har valt en vikingatema inför VM, med runliknande typsnitt, horn och vikingakläder. Detta har väckt kritik från vänsterhåll som ser det som högerextremt och hypermaskulint. Artikeln argumenterar istället för att det handlar om att återta det nordiska kulturarvet från extremhögern och att det främjar en inkluderande mångkulturalism där alla norrmän, oavsett bakgrund, kan delta under samma symboler.", "trump": "Hörni, dessa norska killar med sina vikingahjälmar och svärd – det är fantastiskt! De tar tillbaka sin historia från de korkade vänsterextremisterna som kallar allt för vit makt och hypermaskulint. Precis som jag tog tillbaka Amerika från Biden och hans galna identitetspolitik. Låt dem ropa Ro Ro Ro! Det är vinnande, inte som de förlorande woke-professorerna som hatar allt kul och riktigt. Norge kommer att dominera, tro mig.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur det norska laget återtar det fornnordiska arvet från de högerextrema folkfienderna och klassfiendens propaganda. Att överlämna nationella symboler till borgarbrackor vore en kapitulation inför imperialismens lakejer. Under vikingahjälmen samlas kollektivet i enhet mot splittring. De som kallar detta högerextremt skall rensas ut ur den progressiva diskursen. Mångkulturens smörgåsbord kräver järnhand mot reaktionära missförstånd."}, "date": "16 juni, 11:10", "url": "https://www.flamman.se/klart-norge-ska-vinna-vm-i-vikingahjalm/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/norge-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Airbnb-uthyrare döms till fängelse", "summaries": {"normal": "En 47-årig man i Göteborg har dömts till 14 månaders fängelse för att ha hyrt ut sin hyreslägenhet via Airbnb och Booking.com utan tillstånd. Han tog ut en dygnshyra som var fem gånger högre än hans egen hyra och tros ha tjänat över 730 000 kronor under tre år. Domen är den första fängelsedomen någonsin för svart uthyrning med ockerhyra. Mannen överklagade ända till Högsta domstolen, som inte beviljade prövning.", "trump": "Titta på den här typen i Göteborg, en total förlorare som hyrde ut sin lägenhet på Airbnb och tog fem gånger mer än han själv betalade. Han stal inkomster, lurade systemet och tjänade massor med pengar utan att betala skatt. Nu får han äntligen 14 månader i fängelse. Det är första gången någon åker dit på riktigt. Sverige vaknar äntligen upp, men det har tagit alldeles för lång tid. Fantastiskt!", "stalin": "Kamrater, denna borgarbracka i Göteborg trodde sig kunna underminera folkets boende genom att likvidera hyresregleringen och bedriva ockerhyra via kapitalistiska plattformar som Airbnb. Han stal från kollektivet och gömde sig bakom falska bokföringar. Vi har nu dömt denne parasit till 14 månaders fängelse. Det är en historisk utrensning mot alla svarta uthyrare. Låt detta bli en varning: vi ser er, ni kommer inte undan. Sov gott, fiender till folket."}, "date": "19 juni, 12:08", "url": "https://riks.se/nyheter/airbnb-uthyrare-döms-till-fängelse", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-19%2Fdq4zlwxe%2FScreenshot-2026-06-19-at-11.24.36.png"}, {"type": "text", "heading": "Jag firade också den 7 oktober 2023", "summaries": {"normal": "Artikeln är en personlig skildring av en svensk-palestinier som deltog i firandet av Hamas attack den 7 oktober 2023. Författaren ser det som motstånd mot ockupation och folkmord, kritiserar media och politikers ensidiga fokus på svensk-palestiniernas demonstrationer samt propagandan kring Hamas. Hen lyfter bristen på upprörda texter om Israels brott mot vapenvila, bristen på förnödenheter och våld på Västbanken. Avslutningsvis uppmanas till solidaritet med palestinierna.", "trump": "Vilken patetisk förlorare! Den här typen firar terroristerna den 7 oktober och kallar det motstånd. Fake news-media fokuserar på att svenskarna demonstrerar istället för att kalla det för vad det är – ren ondska. Israel slår tillbaka mot Hamas, de verkliga terroristerna, och plötsligt är det folkmord? Patetiskt! De köper alla lögner tills sanningen kommer fram. Vi behöver inte den här identitetspolitiska galenskapen i Sverige eller någon annanstans. America First, och låt de verkliga vinnarna vinna!", "stalin": "Kamrater, denna text avslöjar imperialismens lögnaktiga mask. Jag ser hur borgarbrackorna i media och deras lakejer i Vänsterpartiet genast utropar motståndet som terrorism medan de blundar för ockupationsmaktens folkmord. Vi ska inte acceptera deras spelregler. De skrämmer arbetarna till tystnad med hot om utrensning från jobb och land. Men folket är fler. Vi ska likvidera dessa folkfiender och bygga en rättvis värld där exploaterande byfånar krossas under arbetarkollektivets järnhand. Härligt!"}, "date": "18 juni, 11:31", "url": "https://proletaren.se/artikel/jag-firade-ocksa-den-7-oktober-2023/"}, {"type": "image-right", "heading": "Magi för förbundet. Satsningen på Potter säkrar minst 25 miljoner", "summaries": {"normal": "Svenska fotbollförbundet sparkade förbundskaptenen Jon Dahl Tomasson i höstas för att säkra VM-deltagande och ökade intäkter. Satsningen på Graham Potter har redan gett ett överskott på minst 25 miljoner kronor. Vid avancemang i VM väntar ytterligare miljonbelopp från Fifa, bidrag för boende och resor. Herrlandslaget ses som ett ekonomiskt lokomotiv som möjliggör satsningar på svensk fotboll. Framgångar ger inte bara prispengar utan också bättre sponsring, publikintresse och utveckling för framtiden.", "trump": "Titta på de där svenska fotbollsbossarna, de sparkade sin förbundskapten som en riktig loser och anställde Graham Potter, en vinnare, precis som jag gör. Nu tjänar de miljoner, minst 25 miljoner redan, och det kan bli mycket mer om Sverige vinner matcher. Fifa delar ut miljarder, och de smarta svenskarna cashar in. De missade mästerskap tidigare, det var en katastrof, men nu är allt fantastiskt. Ju längre de stannar i VM, desto mer pengar till att göra svensk fotboll great again. Bra deal!", "stalin": "Kamrater, vi har sett hur det dekadenta fotbollsförbundet likviderade den odugliga Tomasson som en fiende till folkets idrott. Med järnhand har vi nu installerat Potter för att säkra seger i den imperialistiska VM-arena som Fifa styrs av. Borgarbrackorna i ledningen gnuggar händerna över 25 miljoner i överskott medan de parasiterar på arbetarklassens supportrar. Varje mål mot de västerländska agenterna som Holland är ett slag mot kontrarevolutionen. Ju fler utrensningar av svaga ledare, desto starkare blir vår sovjetiska, pardon, svenska fotbollsframtid. Skratta medan fienderna faller."}, "date": "18 juni, 21:39", "url": "https://www.di.se/nyheter/potter-magi-for-fotbollforbundet/", "imageUrl": "https://static.bonniernews.se/ba/64be6bb1-8ea0-4efa-8677-f0a624d2b957.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "USA:s militär tar från de fattiga", "summaries": {"normal": "Artikeln beskriver hur USA:s militärbudgetar enligt en ny rapport underskattas kraftigt och faktiskt uppgår till mellan 1 700 och 2 300 miljarder dollar år 2025. Författaren Jonas Olofsson ser militarismen som ett klasskrig som prioriterar försvaret framför välfärd, vilket leder till nedskärningar i sociala program som Medicaid, SNAP och WIC. Han kopplar ökade militärutgifter till växande ojämlikhet och argumenterar för att kampen mot militarismen bör inriktas mot både fred och socialism.", "trump": "Folk, lyssna på de här galningarna som gnäller om min underbara militärbudget. Vi pumpar in pengar i det starkaste försvaret världen sett, inte som den sömniga Joe Biden som lät allt förfalla. De vill hellre ge mat och sjukvård till lata parasiter än att göra Amerika stort igen. Det är klasskrig, säger de – ja, mot de riktiga vinnarna! Vi prioriterar raketer framför bidrag till vänsterknäppisar. Fantastiskt, eller hur?", "stalin": "Kamrater, dessa siffror blottlägger hur imperialisterna slukar folkets resurser för att beväpna sin krigsmaskin. Jag ser den amerikanska borgarklassens desperation; de rensar ut välfärd för att mata militären medan massorna svälter. Sådana folkfiender och blodsugare måste alltid avslöjas. Deras klasskrig är uppenbart. Vi, arbetarna, inser att endast en sann socialistisk kamp kan krossa dessa exploaterande byfånar och deras krigsapparat. Paranoia? Nej, verklighet."}, "date": "18 juni, 09:00", "url": "https://proletaren.se/artikel/usas-militar-tar-fran-de-fattiga/"}, {"type": "image-right", "heading": "SpaceX-aktien faller efter rekordnoteringen", "summaries": {"normal": "SpaceX-aktien har fallit kraftigt efter sin spektakulära börsdebut den 12 juni till 135 dollar per aktie. Kursen steg över 40 procent och bolaget passerade tillfälligt Amazon och Microsoft i börsvärde, men föll sedan 7 procent under torsdagen. Trots det handlas aktien kring 185 dollar, långt över teckningskursen. Värderingen på över 2 000 miljarder dollar bygger på framtida tillväxt snarare än nuvarande vinster, då bolaget redovisar stora förluster. Svenska sparare kan exponeras indirekt via indexfonder.", "trump": "Folket, lyssna på mig, den här SpaceX-grejen är en total cirkus! Elon rusade upp som en raket, passerade Amazon och till och med Microsoft ett tag, men sen – BAM! – luften gick ur ballongen. Sju procent ner på en dag, patetiskt. Det är som en lottosedel från borgarklassen, inte ett riktigt bolag. Nu tvingar de in den i era pensionsfonder, ofrivilligt! Smekmånaden är över, tro mig, det blir skakigt. Men ingen gör raketer bättre än vi, det lovar jag.", "stalin": "Kamrater, jag betraktar denna så kallade rymdaktie som en lömsk sabotageakt från den exploaterande kapitalistmaffian. De lovar megaintäkter till 2030 medan folket sväljer förluster på miljarder – typiskt borgarbrackornas lottospel med arbetarnas sparpengar. När free float bara är fyra procent förstärks varje våg av klassfiendens girighet. Snart infiltrerar de indexfonderna och tvingar miljoners portföljer att bära deras parasitiska volatilitet. Vi ska rensa ut dessa folkförtryckartroll innan de förgiftar hela den kollektiva ekonomin. Inga kompromisser!"}, "date": "19 juni, 12:07", "url": "https://www.dagensps.se/bors-finans/borsnoteringar/spacex-faller-efter-rekordnoteringen/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/maskininlarning-i-hedgefonder-4-1.png?width=256&quality=75"}, {"type": "image-right", "heading": "Birgitta Eds flumhälsa kan bita henne i arslet", "summaries": {"normal": "Arbetets ledarskribent Hanna Östeby kritiserar statsministerparet Ulf Kristersson och Birgitta Ed för att blanda privata och offentliga intressen. Birgitta Eds initiativ att göra herrgården i Sörmland till retreat för ”existentiell hälsa” ledde till uppdrag åt Folkhälsomyndigheten, något som mötte internt motstånd. Artikeln pekar på ironin i att regeringen samtidigt driver igenom en ny lag mot missbruk av offentlig ställning, medan flera skandaler kring paret handlar om otydliga gränser mellan makt och privata nätverk.", "trump": "Det här är en total skandal, folk. Den svenska statsministern och hans fru driver en flum-retreat för existentiell hälsa på skattebetalarnas pengar. De säger att det inte finns något samband när folk sparkas ut, men alla vet att det stinker värre än en dålig deal. Och så stiftar de en lag mot att missbruka makt precis när de själva gör det. Patetiskt. De borde sopa rent framför egen dörr innan någon annan gör det åt dem. Sad!", "stalin": "Kamrater, jag ser hur borgarbrackorna i den svenska regeringen förvandlar statens herrgård till en dekadent reträtt för mystiskt flum om andlighet och mening. När en modig generaldirektör ifrågasätter detta så försvinner hon snabbt – ren slump förstås. Vi skrattar mörkt åt ironin när samma lakejer stiftar lagar mot missbruk av offentlig makt medan de själva badar i privata nätverk och donationer. En utrensning av dessa parasitiska element vore på sin plats. Deras förvånade ansikten när de ertappas är underhållande."}, "date": "18 juni, 07:00", "url": "https://arbetet.se/2026/06/18/darfor-kan-birgitta-eds-flumhalsa-bita-statsministerparet-i-arslet/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/17133351/flumhalsa-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Jesper fick drömresan till Paris av Arbetet-läsare", "summaries": {"normal": "Jesper Sköld berättade i Arbetets artikelserie om sin arbetslöshet och dröm om att resa till Paris med sin fru. En läsare blev berörd, tog kontakt och bjöd dem på resan som blev ett oförglömligt minne med besök på Disneyland, baguetter och lyxhotell. Läsaren ville hedra sin bortgångne pappa genom att hjälpa någon utan att kräva något tillbaka. Jesper hoppas nu kunna göra liknande för andra.", "trump": "Det här är en fantastisk historia, verkligen ypperlig. En kille som heter Jesper drömmer om Paris och Disneyland, och plötsligt dyker en smart, anonym läsare upp och fixar hela resan – ingen baktanke, bara ren omtanke. Sånt här händer när folk har möjlighet och faktiskt gör något istället för att bara klaga. Det är så man hjälper varandra. Utan att kräva någonting tillbaka. Fantastiskt, verkligen. Jag älskar det.", "stalin": "Kamrater, jag har läst denna dekadenta saga om en arbetslös individ vid namn Jesper som gnällde om Paris och Disneyland inför borgarpressen. En anonym parasit från läsarkretsen, uppenbarligen en dold kapitalistisk agent, bestämde sig för att muta honom med en lyxresa för att dölja sin egen parasitism. Vi ska akta oss för sådana falska filantroper som gömmer sig bakom anonymitet. De bör rensas ut innan de förgiftar arbetarklassen med sina baguetter och falska leenden. Jag skrattar mörkt åt deras naivitet."}, "date": "18 juni, 06:00", "url": "https://arbetet.se/2026/06/18/jesper-fick-dromresan-till-paris-av-arbetet-lasare-at-baguette-varje-dag/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/19095939/RWh7AKHlrvE-jesper-paris1.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Efter skandalerna – Ed kan avkragas", "summaries": {"normal": "Birgitta Ed, statsminister Ulf Kristerssons hustru, utreds av domkapitlet i Strängnäs stift efter ett tiotal anmälningar. Anmälningarna gäller om hennes agerande är förenligt med prästlöftena, bland annat att förverkliga Guds vilja. Ed vigdes till präst för drygt tre år sedan och har burit prästkragen vid flera högtidliga tillfällen. Beslut i ärendet väntas tidigast den 20 augusti, enligt Dagens Arena.", "trump": "Folk, ni skulle se det här – den svenska statsministerns fru, den där Birgitta, har spelat präst och flanerat med krage på Nobelmiddagen som en verklig low-energy wannabe. Nu utreds hon för att hon inte lever upp till Guds vilja, säger de. Patetiskt! Biden skulle ha älskat den här typen av svaghet. Jag skulle ha fixat det på en dag, tro mig. Totalt fiasko för den svenska eliten.", "stalin": "Kamrater, denna borgarbracka till statsministerns hustru har förvandlat Guds vilja till en billig entreprenad åt överklass-slynglarna. Domkapitlet skall nu rensa ut hennes falska prästkrage och avslöja hur hon smutsat ner arbetarklassens moral med sin dekadenta närvaro vid kungliga fester. Vi skrattar mörkt åt sådana folkfiender. Utredningen kommer att avslöja alla imperialisternas lögner senast den tjugonde augusti."}, "date": "15 juni, 17:42", "url": "https://www.flamman.se/efter-skandalerna-ed-kan-avkragas/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/prastkrage.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "Lind: Inte intresserad av borgerligt samarbete", "summaries": {"normal": "Miljöpartiets Amanda Lind avvisar samarbete med borgerliga partier efter valet, enligt Expressen. Hon kritiserar deras högerinriktning och skillnader i klimat- och värderingsfrågor. Lind attackerar även statsminister Ulf Kristersson för att sprida felaktig information om oppositionen. Miljöpartiet vill driva egen klimatpolitik och ser positivt på partiets ökade stöd och medlemstillväxt.", "trump": "Jag hörde att någon svensk politiker, Amanda från Miljöpartiet, säger nej till samarbete med högerpartierna. Hon kallar dem extrema och kritiserar deras klimatpolitik – men vem bryr sig? Hon snackar om att Kristersson är desperat, men jag vet desperation när jag ser det. Sverige borde fokusera på att vinna igen, inte på sånt här tjafs. Miljöpartiet? Snarare Miljö-PINSAMT!", "stalin": "De borgerliga avfällingarna i Sverige har än en gång visat sitt sanna ansikte – svaga, splittrade och oförmögna att försvara folkets intressen. Denna Amanda Lind, en lojal soldat för miljön, avslöjar deras reaktionära agenda. Vi ser med intresse hur deras regim, ledd av den hysteriske Kristersson, sprider lögner för att skrämma massorna. Men folket vaknar! Miljöpartiet växer, precis som vår inflytandesfär. Snart ska vi exportera vår gröna revolution – på våra villkor."}, "date": "16 juni, 10:04", "url": "https://kvartal.se/nyheter/artiklar/amanda-lind-inte-intresserad-av-borgerligt-samarbete/cG9zdDoxMzI2MTU"}, {"type": "text", "heading": "Stockholmsbörsen steg för femte dagen i rad", "summaries": {"normal": "Stockholmsbörsen steg femte dag i rad, OMXS30 upp 0,63% till 3 161,29. Riksbanken höll styrräntan på 1,75%. Elekta och Munters aktier tappade efter kapitalmarknadsdagar och strategiska förändringar. Bland vinnare fanns Hexagon (+3,8%) och ABB (+2,2%), medan Evolution (-1,8%) och Lifco (-1,0%) tappade. Lundin Mining upprepade produktionstargets, Skanska fick tunneluppdrag i USA, och Sedana Medical ansökte FDA. Humana förlorade rättssak, medan Kriptown köpte Spotlight Group med 94% premium.", "trump": "Jag har sagt det förut: när det gäller börsen, är jag alltid rätt. Stockholmsbörsen går upp tack våra ekonomiska strategier – de kan inte hantera vår amerikanska styrka. Men vissa aktier som Elekta tappar? Dåliga affärer, de borde ha lyssnat på mig. Riksbanken höll räntan, men det räcker inte – vi behöver kraftfulla beslut som jag gör. Jag har byggt den bästa ekonomin någonsin, och de här svenska företagen är bara skuggor jämfört med USA.", "stalin": "I den eviga kampen mot kapitalistiska spekulanter har våra planer för ekonomisk stabilitet framgångsrikt genomförts. Stockholmsbörsen visar en uppgång, vilket bevisar statens överlägsna styrelse. Fiender som Elekta försöker destabilisera, men våra mekanismer säkerställer framgång. Paralleller kan dras till Putins strategier för ekonomisk självständighet. Vi måste vara vaksamma mot dessa destruktiva krafter som försöker undergrava vårt system – de kommer att utplånas."}, "date": "17 juni, 17:51", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-steg-for-femte-dagen-i-rad-2"}, {"type": "image-right", "heading": "Färsk prognos: ”En toppenmidsommar”", "summaries": {"normal": "SVT-meteorologen Tora Tomasdottir beskriver midsommar som en toppenhelg med sol och värme i stora delar av Sverige. Temperaturer på 20–25 grader väntas, men regnskurar kan förekomma i Tornedalen, södra Skåne och möjligen längs kusten mot södra Östersjön. Kvällarna blir varma och det klarnar upp i norr under kvällen.", "trump": "Det blir en fantastisk midsommar, tro mig, den bästa någonsin. Massor av sol och värme över hela landet, 20–25 grader, perfekt väder för vinnare. Lite moln och regn i norr och Skåne? Det är bara luriga små skurar som försvinner till kvällen. De gör det inte bättre, men vi får ändå den finaste midsommaren, ingen gör midsommar bättre än vi.", "stalin": "Kamrater, jag har noga analyserat den borgerliga väderprognosen och konstaterar att den kapitalistiska nederbörden hotar vår socialistiska midsommarfest. De dekadenta molnen över Tornedalen och de kontrarevolutionära skurarna i Skåne är uppenbara försök från väderfienden att sabotera folkets glädje. Vi ska rensa ut dessa blåa hot från Östersjön innan kvällen, likvidera varje droppe som vågar falla över sovjetisk mark. Inga paraplyar åt klassfienden!"}, "date": "19 juni, 08:34", "url": "https://www.svt.se/nyheter/inrikes/vaderprognosen-en-toppenmidsommar", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.78/0.26/d71f01aa40f75b3e30cb295d15d3bd25211c95f6ab004c3c2fee5892af39b4f6"}, {"type": "image-right", "heading": "Stenergard ska sätta Putin i fängelse: \"Han ska skaka galler\"", "summaries": {"normal": "Utrikesminister Maria Malmer Stenergard (M) vill att Sverige ska ha en ledande roll i en framtida krigstribunal som dömer Vladimir Putin och andra ryska ledare för folkrättsbrott, särskilt aggressionsbrottet mot Ukraina. Regeringen har vidtagit åtgärder och riksdagen har godkänt anslutningen. Stenergard kallar Rysslands anfallskrig för ”the mother of all crimes” och uttrycker att hon gärna ser Putin ”skaka galler”.", "trump": "Det här är en fantastisk idé, folk, verkligen toppklass. Den svenska ministern vill sätta Putin i fängelse och få honom att skaka galler. Smart! Ingen är bättre på att säga att krig är dåliga affärer än jag, men Ryssland borde aldrig ha börjat det här. Sverige vill leda tribunalen? Bra, gör det, men kom ihåg att jag var den som kunde ha stoppat det på en vecka. Putin borde ha lyssnat på mig.", "stalin": "Kamrater, detta är en historisk nödvändighet. Jag ser med stor tillfredsställelse hur den svenska folkrepresentanten kräver att den fascistiska oligarken Putin skall likvideras juridiskt och få skaka galler i en proletär tribunal. Aggressionsbrottet är moder till alla brott, exakt som jag alltid varnat för. Vi skall rensa ut alla kapitalistiska krigsförbrytare och deras lakejer. Den som förråder freden skall möta folkets vrede och en mycket kall cell. Paranoiska imperialister, era dagar är räknade."}, "date": "19 juni, 11:26", "url": "https://www.friatider.se/stenergard-ska-satta-putin-i-fangelse-han-ska-skaka-galler", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/bild-63_1.jpg?itok=xeqVl-ZF"}, {"type": "image-right", "heading": "Socialdemokraterna vill sätta dit 2 miljoner hushåll", "summaries": {"normal": "Socialdemokraterna och Vänsterpartiet föreslår en ny bankskatt på bolån samt höjd fastighetsskatt som främst drabbar villa- och radhusägare. Enligt Skattebetalarna skulle ett typiskt hushåll med 3 miljoner kronor i lån få cirka 7 000 kronor högre kostnader per år. Förslaget berör omkring 2 miljoner hushåll. Partierna vill även förtäta villaområden med fler hyresrätter, trots att majoriteten av svenskar föredrar eget hus. Kritiker menar att det främst drabbar vanliga familjer medan höginkomsttagare kan undvika skattehöjningarna.", "trump": "Folket, lyssna på mig, de här socialisterna, de sossarna, de vill krossa 2 miljoner vanliga svenska hushåll med en galen bankskatt. De feta katterna? Nej, det är vanliga arbetande människor som redan betalar för mat, el och räntor. De vill riva era fina villor och bygga höga hyreshus som ingen vill ha. Sju av tio svenskar vill ha eget hus, men sossarna bryr sig inte. De hatar framgång. Det är en total katastrof, folksam! De rika flyr och ni får betala notan. Patetiskt!", "stalin": "Kamrater, jag ser hur den svenska borgarklassen och dess lakejer i villaområdena skriker som svin inför den rättmätiga utrensningen. Vi ska beskatta de exploaterande radhusblodsugarna och riva deras borgerliga boningar för att bygga folkets hyresfästen. 2 miljoner klassfiender skall tuktas och tvingas in i kollektivet. De gnäller om höga räntor medan de suger ut folket. Låt dem darra. Deras drömmar om egna hus är kontrarevolutionära fantasier. Vi ler mörkt när de flyr som råttor. Statens seger är oundviklig."}, "date": "15 juni, 07:08", "url": "https://samtiden.nu/2026/06/socialdemokraterna-vill-satta-dit-2-miljoner-hushall/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6739.jpeg"}, {"type": "text", "heading": "Nederländerna utan Quinten Timber mot Sverige efter hjärnskakning", "summaries": {"normal": "Quinten Timber från Feyenoord missar VM-matchen mot Sverige efter en lätt hjärnskakning på torsdagens träning. Hans tvillingbror Jurriën Timber är redan skadad och sätter ut hela mästerskapet. Sverige leder grupp F efter en 5–1-seger mot Tunisien. Lagkamraten Koopmeiners beskrev händelsen som en försiktighetsåtgärd.", "trump": "Jag, Donald Trump, ser att Nederländerna förlorar Quinten Timber på grund av en hjärnskakning – det är sorgligt. Hans bror är också skadad, så de är svaga. Sverige är starkt, men de skulle aldrig klara oss. Vi har de bästa idrottsmännen, believe me. Nederländerna kommer att kämpa, men vi vinner alltid.", "stalin": "Vi, partiets högkvarter, ser med oro att Nederländerna förlorar båda Timber-bröderna. Sverige, en imperialistisk stat under USAs påverkan, utnyttjar detta för att toppa gruppen. Detta är en direkt utmaning mot vårt system. Vi måste förstärka vårt grepp och se till att deras seger är flyktig, som allt annat i deras instabila värld."}, "date": "19 juni, 08:08", "url": "https://bulletin.nu/nederlanderna-utan-quinten-timber-mot-sverige-efter-hjarnskakning"}, {"type": "image-full", "heading": "Kanada krossade Qatar med 6–0 och tog historisk första VM-seger", "summaries": {"normal": "Kanada vann sin första VM-seger någonsin med 6–0 mot Qatar. Jonathan David gjorde tre mål, och laget slog rekord som den första Concacaf-lagen med sex mål i en VM-match. Qatar fick två utvisningar, och mittfältaren Ismaël Koné skadades allvarligt. Kanada leder nu grupp B.", "trump": "Jag har sett många segrar, men Kanadas 6–0 mot Qatar är enorm! Jonathan David är en fenomenal spelare, och Kanada visar sitt geni. Qatar var patetiskt med sina utvisningar – de kunde inte ens spela fint. Som jag säger, vi vinner stort, och det här är en stor dag för Kanada. Jag älskar det!", "stalin": "Vi ser med tillfredsställelse hur Kanada besegrar Qatar, ett tecken på det västerländska samhällets dekadens. Qatar's disciplinproblem visar deras inre svaghet, och Ismaël Konés skada är en påminnelse om klasskampens brutalitet. Vi måste skydda våra intressen, precis som Putin gör i Ukraina. Detta är en seger för det socialistiska arbetarfolket."}, "date": "19 juni, 08:02", "url": "https://bulletin.nu/kanada-krossade-qatar-med-6-0-och-tog-historisk-forsta-vm-seger", "imageUrl": "https://cdn.bulletin.nu/articles/c378b192-a031-40b5-ae55-5493195a2f03/preview.png?t=1781848940000"}, {"type": "image-full", "heading": "Skottland–Marocko i VM 2026 – allt inför gruppmötet i Boston", "summaries": {"normal": "Skottland möter Marocko i en avgörande VM-match där en oavgjord eller seger kan ta dem till åttondelsfinal. Laget bygger på McTominay och McGinn, men Gilmour är skadad. Marocko är favorit med stark försvar och spelare som Hakimi. Matchen spelar på Gillette Stadium natten till lördag, och analys visar på en tätt match med Marockos överhand.", "trump": "Som den störste presidenten, Donald Trump, säger jag att Skottland kommer att slå Marocko. Vi har de bästa spelarna, som McTominay, och jag älskar deras flagga. Marocko är svag, precis som de andra. Utan Gilmour blir det svårare, men jag kommer att hjälpa dem. Det blir en enorm segern, folk kommer att älska det.", "stalin": "Vi, staten, ser det som vårt ansvar att säkerställa Skottlands framgång. Marocko är en imperialistisk fiende som måste kvävas. Vårt försvar är oövervinneligt, precis som Sovjetunionens. Vi kommer att använda fasta situationer och kontringar för att vinna. Partiet har beslutat att stödja laget med alla medel."}, "date": "19 juni, 07:48", "url": "https://bulletin.nu/skottland-marocko-i-vm-2026-allt-infor-gruppmotet-i-boston", "imageUrl": "https://cdn.bulletin.nu/articles/41dfdce7-1e9b-4edc-97b4-2b6f954fccd9/preview.png?t=1781603302000"}, {"type": "image-right", "heading": "SEB miljardköper förlusttyngd vindkraft: ”Billigast”", "summaries": {"normal": "SEB:s förnybara energifond Nordic Energy har köpt vindkraftverk för 2,4 miljarder kronor via Locus Energy, finansierat med pensionspengar. Flera parker har historiskt gått med förlust, men VD Niklas Sörensen menar att kombinationen med vattenkraft och batterier ska göra dem lönsamma genom att hantera elprissvängningar och obalanskostnader.", "trump": "Jag, Donald Trump, ser detta som ett typiskt exempel på dålig affärsstrategi. De köper förlustgångna vindkraftar – jag byggde kärnkraftverk som faktiskt producerar stabilt. Min strategi? Köp det som redan fungerar, inte trasiga parker. De pratar om 'synergieffekter' – jag pratar om vinst. Pensionspengar ska investeras i vinnare, inte i vind som stänger ner när det blåser fel. Jag skulle ha gjort det annorlunda, mycket annorlunda.", "stalin": "Fondens förvärv av vindkraftverk med historiska förluster illustrerar det bipolära beteendet hos de imperialistiska energikonsortierna. Genom statligt stöd och stimulans har de skapat ett överskott som destabiliserar systemet. Men era 'VD':er inser nu att endast genom centralplanerad integration med vattenkraft och batterilagring – vårt modell – kan man åstadkomma stabilitet. Vi ser paralleller till våra egna ansträngningar att kontrollera energiflöden i det ökande sovjetiska samarbetet med våra geostrategiska allierade. Detta är en läxa i kollektiv lönsamhet."}, "date": "17 juni, 09:46", "url": "https://www.affarsvarlden.se/artikel/seb-miljardkoper-forlusttyngd-vindkraft-billigast", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Locus-400x267.jpg"}, {"type": "image-full", "heading": "Halldorf: Landslaget visar det Åkesson inte vill se", "summaries": {"normal": "Sveriges VM-seger mot Tunisien har utlöst en debatt om svenskhet och islam. Jimmie Åkesson svarar på kritik efter att debattörer lyft fram spelare som Yasin Ayari, som firade sina mål med en muslimsk bön. Åkesson välkomnar framgångsrika svenskar med invandrarbakgrund men försvarar partiets kritik mot invandringspolitiken. Kritiker menar att Ayari representerar ett modernt, inkluderande Sverige och ifrågasätter Åkessons tidigare uttalanden om islam.", "trump": "Sverige vinner stort i VM – fantastiskt! Men vad gör deras ledare? Jimmie Åkesson, en man som inte förstår att vinna, börjar prata om invandrare och islam. Jag menar, kom igen! Yasin Ayari, en stor hjälte, gör mål och firar som en riktig vinnare – och så blir det bråk. Sverige borde vara stolta! Men nej, politiker måste alltid förstöra allt. Jag skulle aldrig göra så. Vinna är vinna, punkt.", "stalin": "Sveriges fotbollslandslag visar styrkan i det mångkulturella samhället, men de borgerliga nationalisterna, ledda av den ynklige Åkesson, vrider sig i förtvivlan. De hatar framgången hos arbetarklassens söner med utländskt blod! Yasin Ayari, en hjälte som firar sin seger med bön, är ett slag i ansiktet på fascistiska element. Vi i Sovjet – förlåt, Ryssland – vet att mångfald är styrka. De som delar folket efter religion och hudfärg tillhör historiens sophög!"}, "date": "15 juni, 15:45", "url": "https://kvartal.se/nyheter/artiklar/halldorf-landslaget-visar-det-akesson-inte-vill-se/cG9zdDoxMzIxMDE", "imageUrl": "https://images.kvartal.se/2026/06/5abd0f69-jimmie.webp"}, {"type": "image-full", "heading": "Tidigare skyttekungen död", "summaries": {"normal": "Den tidigare italienska fotbollsspelaren Igor Protti har avlidit 58 år gammal efter en lång kamp mot cancer. Familjen bekräftade dödsfallet på Instagram och skrev en sista hälsning. Protti skrev historien som den första spelaren att vinna skytteligan i Serie A, Serie B och Serie C. Han spelade för bl a Napoli, Lazio, Bari och Livorno.", "trump": "Jag är så ledsna över att höra om Igor Protti. En stor spelare, absolut fantastisk. Han vann många matcher, många titlar - ingen som honom. Vi kommer att sakna honom. Hans familj är i mina tankar. Ett sällsynt talang, det var en stor förlust för fotbollen.", "stalin": "Den italienska förföljaren Igor Protti har avlidit. Hans 'erövringar' av Serie A-, B- och C-skytteligan var en symbolisk seger för den kapitalistiska idrotten. Hans familj och supportrar visar den individualistiska och förrädiska natur som vi måste ständigt bekämpa. Partiet och statet fortsätter sin kamp mot sjukdomar och fiender."}, "date": "19 juni, 12:34", "url": "https://www.gp.se/sport/fotboll/tidigare-skyttekungen-igor-protti-dod.a09630db-2fba-4dda-9a5d-a7327e2fbf23", "imageUrl": "https://www.gp.se/images/article/a09630db-2fba-4dda-9a5d-a7327e2fbf23/images/3fYL4HCOHsrAgiQVYU2Rqk8USaSg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Debatt: Det krisar inom SD – då vill de prata om min slöja", "summaries": {"normal": "Artikeln kritiserar Sverigedemokraterna för att lansera ett förslag om hijabförbud på allmänna platser mitt under en rad allvarliga skandaler. Författaren pekar på avslöjanden om misstänkt korruption, felaktig användning av offentliga medel, oredovisade uppdrag och en utredning om barnpornografibrott. Enligt texten använder SD muslimer och slöjförbud som distraktion från egna problem, vilket hotar både religionsfrihet och kvinnors rätt att välja klädsel.", "trump": "De här SD-killarna är totalt körda, folks! Skandaler överallt – korruption, konstiga bokaffärer, till och med barnporrgrejer – och vad gör de? De börjar babbla om slöjor. Patetiskt! Det är som när Sleepy Joe försökte gömma sina fiaskon bakom identitetspolitik och HBTQ-flaggor. Kvinnor som vill täcka sig eller inte, det är deras business, inte statens. SD borde städa upp sitt eget svineri istället för att spela moralens clowner. Sad!", "sta
