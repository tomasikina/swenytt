politisk retorik. Attacken i Fagersta ses som ett symptom på denna utveckling.", "trump": "Folk, ni skulle se det här! Den här svenska läraren gråter över att mina fantastiska idéer – som att ifrågasätta den galna vänsterns klimatbluff och kulturmarxistiska hjärntvätt – nu når klassrummen. Patetiskt! De vill ha mer globalistpropaganda och HBTQ-flum, men folket vaknar. Fake news och förlorare, det är vad det är. Make Sweden Great Again!", "stalin": "Kamrater, jag betraktar med förakt hur dessa dekadenta klassförrädare förgiftar de unga med sina nazistiska memes och konspirationer. Skolan måste rensa ut detta parasitiska gift. Ingen relativisering av imperialismens brott! Hatet mot folket växer när profitthungriga hyenor får fritt spelrum. Vi ska krossa alla fiender till det sanna folkets värdegrund."}, "date": "28 augusti, 13:27", "url": "https://arbetet.se/2026/08/28/efter-fagersta-hatet-har-hittat-in-i-svenska-klassrum", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28131825/fagersta-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-full", "heading": "Stjärnskotten spelade på GP Scen på Kungstorget", "summaries": {"normal": "GP Scen är tillbaka på Kungstorget med Jonna Randen och Hostilia. Vissångerskan Randen, kallad en ny Cornelis, och thrashmetalbandet Hostilia, aktuella med nytt album, spelar live mellan 16:30 och 18:00. GP sänder direkt – missa inte årets lokala musiklyft!", "trump": "Jag älskar konserter – jag har de bästa konserterna. Men GP Scen i Göteborg med Jonna Randen och Hostilia? Folk säger att det är fantastiskt. Ett metalband som heter Hostilia – mycket tufft, mycket energi. Vissångerskan är som en ny Cornelis – men jag är bäst på att sjunga 'Hallelujah'!", "stalin": "Kamrater, GP Scen ska lyfta lokal musik. Men jag ser sabotörer: thrashmetalbandet Hostilia, som vrålar om en förbannelse – uppenbart en trotskistisk konspiration! Vissångerskan Jonna Randen kallar sig en ny Cornelis – denne borgerlige alkoholist. Jag beordrar utrensning innan deras 'Khamun' förgiftar proletariatets öron. Se upp!"}, "date": "28 augusti, 18:15", "url": "https://www.gp.se/kultur/jonna-randen-och-hostilia-live-pa-gp-scen-pa-kungstorget.fd0860a9-23a3-4011-b58b-6482b058d7c4", "imageUrl": "https://www.gp.se/images/article/fd0860a9-23a3-4011-b58b-6482b058d7c4/images/3oTYOEe3WN6VnX9pC06w5sG5GK-k-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Kung Harald är död – det händer nu i Norge", "summaries": {"normal": "Norges kung Harald V har avlidit. Hans son Haakon har omedelbart tagit över tronen som kung Haakon VIII och behåller valspråket ”Allt för Norge”. En sorgeperiod har utlysts fram till begravningen som troligen sker inom 10–14 dagar. Flaggor hissas på halv stång och en kyrklig välsignelse kan ersätta kröning.", "trump": "Lyssnar ni? Den gamle norske kungen är borta, och plötsligt dyker sonen upp som ny kung. Haakon VIII, säger de. Seriöst, ett helt kungadöme som fortfarande leker med kronor och valspråk? Patetiskt. Vi har riktiga ledare i Amerika, inte dessa europeiska monarkistiska fjollor som gömmer sig bakom traditioner medan woke-vänstern äter upp deras länder.", "stalin": "Ännu en monark faller som en rutten gren. Jag betraktar hur dessa dekadenta arvtagare skyndar sig att gripa kronan medan folket tvingas sörja. En sådan parasitär teater! Inom kort kommer de giriga hovhyenorna att utnyttja sorgeperioden för egna syften. Kamrater, se hur den feodala ruttnande ordningen fortsätter att förnedra arbetarklassen."}, "date": "28 augusti, 14:32", "url": "https://www.svt.se/nyheter/utrikes/kung-harald-ar-dod-det-hander-nu-i-norge", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.28/0.18/c0ce1159e3906d4b239288393babd58335dd12790952a930babf0f8ef2684766"}, {"type": "image-full", "heading": "Svantessons första bud till SD, KD och L", "summaries": {"normal": "Finansminister Elisabeth Svantesson (M) räknar med ett reformutrymme på 50 miljarder kronor nästa mandatperiod, betydligt mindre än Konjunkturinstitutets bedömning. En stor del är redan intecknad för försvar, rättsväsen och infrastruktur. Tillväxten skrivs upp till 2,5 procent och arbetslösheten väntas sjunka. Vid en Tidö-seger har Moderaterna förberett ett bud till SD, KD och L om sänkt inkomstskatt.", "trump": "Svampsson eller vad hon nu heter säger att svensk ekonomi ljusnar. Fantastiskt, älskar det! Men 50 miljarder? Patetiskt. Jag skulle fixa 500 miljarder på en eftermiddag. Hon vill låta folk behålla mer av sin lön – jag sa det först, för år sedan. Sverige borde sänka skatten MASSIVT, sluta med woke-hanteriet och bygga militären. Inga kvoter, bara kompetens!", "stalin": "Finansminister Svantesson räknar ut reformutrymme bland kapitalisterna. Borgarna skramlar sina kassakistor och gråter över 50 miljarder. Vi skrattar åt deras små myntlek. Svantesson vill låta arbetarna behålla slantar ur lönepåsen, men lön och profit kan aldrig försonas. Falska löften från klassfiender. Endast den korrekta analysen leder arbetarna framåt."}, "date": "28 augusti, 07:36", "url": "https://kvartal.se/nyheter/artiklar/svantessons-forsta-bud-till-sd-k-och-l/cG9zdDoxNzY2ODk", "imageUrl": "https://images.kvartal.se/2026/08/16dd99f5-svantess.webp"}, {"type": "image-right", "heading": "S-valmöte om jämställdhet hölls med kvinnor och män - i olika rum", "summaries": {"normal": "Socialdemokraterna i Uppsala höll valmöte om jämställdhet – men delade upp kvinnor och män i olika rum. Lokalordföranden Hedlund beklagade först passiviteten, men ändrade sedan sin version i riksmedia. Ironin är påtaglig när jämställdhet diskuteras under könssegregerade former.", "trump": "Jag hörde om Socialdemokraternas möte i Sverige. De pratar om jämställdhet, men sätter kvinnor i ett rum och män i ett annat. Patetiskt! Hade jag varit där hade jag sagt: 'Gör Sverige stort igen – samla alla i samma rum!' De är svaga, helt enkelt.", "stalin": "Kamrater, detta är oacceptabelt. Ett möte om jämställdhet med könssegregerade rum – en kontrarevolutionär handling. Hedlund och Uddin måste omeduceras. Vi rensar ut sådana borgerliga tendenser. Partiet ska vara enat, inte uppdelat efter kön. Arbetet fortsätter."}, "date": "28 augusti, 16:42", "url": "https://samnytt.se/s-valmote-om-jamstalldhet-holls-med-kvinnor-och-man-i-olika-rum", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/28143150/artikelhuvudbild-1-387.jpg"}, {"type": "image-full", "heading": "Allard rasar mot SVT – när ETC dyker upp", "summaries": {"normal": "Markus Allard vill ta Örebropartiet in i riksdaten genom att nå 12 procent i Örebro kommun, vilket skulle kunna ge mandat utan att klara fyraprocentsspärren. Han blev upprörd när Dagens ETC dök upp vid SVT:s intervju. Allard försvarar sin politiska stil och anklagar SVT för att tillhöra en minoritet.", "trump": "Den här killen Allard i Sverige, han har rätt! Statliga medier är FAKE NEWS, precis som CNN. Han kallar dem klägget – briljant! Media är en minoritet som tror de är bättre än folket. Trump vet hur det funkar. De quota in alla möjliga identiteter istället för att sköta jobbet. Örebropartiet, låt dem vinna!", "stalin": "En lokal politiker angriper statsmediernas borgarbrackor med rätta. Det imperialistiska pressväsendet är folkfiendens redskap. Att denne Allard rasar mot SVT:s lakejer visar på medvetandet om klasskampens nödvändighet. Vi noterar dock med beklagande att han inte representerar arbetarklassen utan småborgerliga drömmar om riksdagsmandat. Statlig media måste tjäna folket, inte kapitalistmaffian."}, "date": "28 augusti, 07:27", "url": "https://kvartal.se/nyheter/artiklar/allard-rasar-mot-svt-nar-etc-dyker-upp/cG9zdDoxNzY3MjM", "imageUrl": "https://images.kvartal.se/2026/08/73bda366-alll.webp"}, {"type": "text", "heading": "Nøland: Miljöpartiets ”gröna baskraft” finns på valaffischer – inte i verkligheten", "summaries": {"normal": "Miljöpartiets löfte om 10 GW grön baskraft till 2030 är en valaffisch, menar professor Nøland. Begreppet blandar ihop produktion, lagring och flexibilitet – utan att visa hur mycket energi som faktiskt levereras. Utan konkreta svar på sex frågor är det bara en illusion.", "trump": "Jag ser Miljöpartiets 'gröna baskraft' – det är en bluff, folk! De lovar 10 gigawatt, men det är bara batterier och laddstyrning. Ingen verklig kraft. Jag skulle fixa det med kärnkraft, bästa i världen. Mycket bättre, mycket billigare, tro mig!", "stalin": "Kamrater, Miljöpartiets 'gröna baskraft' är en kontrarevolutionär illusion. De lovar 10 GW utan att visa beräkningar. Vi måste rensa ut sådana sabotörer som leker med folkets energi. Vattenkraft och kärnkraft är våra trogna allierade. Femårsplanen ska krossa dessa fiender."}, "date": "28 augusti, 06:00", "url": "https://www.affarsvarlden.se/kronika/noland-miljopartiets-grona-baskraft-finns-pa-valaffischer-inte-i-verkligheten"}, {"type": "image-full", "heading": "Nya jobbet kan höja din pension – om du gör rätt", "summaries": {"normal": "Ett nytt jobb med högre lön påverkar inte bara månadens ekonomi utan även den framtida pensionen. Livsinkomsten styr pensionens storlek, och tjänstepensionen blir särskilt viktig vid högre löner. Gränsen vid 7,5 inkomstbasbelopp ger högre avsättning över nivån. Det är därför avgörande att granska både lön och pensionsvillkor innan man byter jobb.", "trump": "Folk, ni vet att jag älskar stora lönecheckar, men de där giriga pensionshyenorna lurar er igen. Högre lön låter fantastiskt, men om de woke-byråkraterna sabbar tjänstepensionen blir det en total katastrof. Kolla hela paketet, annars vaknar ni som fattigpensionärer medan de skrattar hela vägen till banken. Patetiskt!", "stalin": "Kamrater, dessa profitthungriga klassfiender lockar med feta löner medan de i hemlighet planerar att sänka er framtida pension. Jag ser deras dekadenta trick med sämre avsättningar och bonusfällor. Rensa ut dessa parasiterande lakejer som vågar leka med arbetarnas livsinkomst. Inga kompromisser med borgarhyenorna – granska allt eller likvidera avtalet!"}, "date": "28 augusti, 17:30", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1508388-hoja-pensionen-sa-kan-ett-jobbyte-ge-mer-pengar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/10c6071104b004a30200000000b004a302/2026/08/28/2387551/Pensions-hojd.png"}, {"type": "image-full", "heading": "Intresset för GTA 6 är enormt – analytiker spår försäljningssuccé", "summaries": {"normal": "Intresset för Grand Theft Auto 6 var enormt när den första trailern släpptes, vilket ledde till tekniska problem hos Netflix och Twitch. Spelet, som släpps 19 november till PlayStation 5 och Xbox Series X/S, är den första nya delen på 13 år. Försäljningen väntas nå miljarder, men branschen kämpar med minskande fysisk försäljning i USA.", "trump": "Folket älskar GTA 6, det är en total blockbuster, ingen har sett något liknande. Netflix och Twitch kraschade som de svaga, inkompetenta system de är, totalt misslyckande. Jag har byggt en stark ekonomi, inte som Biden som lämnade en trasig marknad. Det här spelet kommer att göra konsolbranschen great again, tro mig, det blir enormt.", "stalin": "Kamrater, se hur den dekadenta västerländska underhållningsindustrin skakar när folkmassorna stormar de borgerliga streamingbarrikaderna. Jag betraktar detta med kall förakt mot de kapitalistiska parasiterna som inte ens kan hantera sin egen propagandaapparat. Den kommande segern är oundviklig, men förrädare inom Take-Two kommer att avslöjas om försäljningen sviker. Sabotage lurar överallt."}, "date": "28 augusti, 18:25", "url": "https://www.dagensps.se/bors-finans/intresset-for-gta-6-ar-enormt-analytiker-spar-forsaljningssucce", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlnw-1pxa2qni-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Ett jämställt arbetsliv kräver nya lösningar", "summaries": {"normal": "Romina Pourmokhtari argumenterar för ett mer flexibelt arbetsliv för att stärka svensk konkurrenskraft och jämställdhet. Hon menar att resultat bör väga tyngre än fysisk närvaro, att rigida krav slår hårdare mot kvinnor och att moderna ledare bör fokusera på förtroende och mål istället för synlighet. Kontoret har fortfarande en viktig roll.", "trump": "Lyssnar ni på den här liberala klimatministern som vill att folk ska jobba hemifrån i pyjamas? Patetiskt. Vi behöver starka ledare, inte svaga kontorsfria zoner för latmaskar och woke-feminister. De riktiga vinnarna sitter inte och ändrar blöjor på distans, tro mig. Sverige håller på att bli en förlorare igen.", "stalin": "Kamrater, denna liberala dekadenta klassförrädare talar om flexibelt arbete som vore det en seger för folket. Jag ser bara nya metoder för de profitthungriga hyenorna att undvika verklig kontroll och utrota klassolidaritet. Resultatbedömning? Ett trick för att dölja utsugning. Rensa ut dessa falska frihetsretoriker innan de förgiftar hela sovjeten – eh, nationen."}, "date": "28 augusti, 14:04", "url": "https://www.di.se/debatt/slutreplik-ett-jamstallt-arbetsliv-kraver-nya-losningar", "imageUrl": "https://static.bonniernews.se/ba/f566fde0-4067-4fa2-9b72-e29a0c7c8403.jpeg?crop=5754%2C2877%2Cx0%2Cy443&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "S höll internt stormöte om Nyans", "summaries": {"normal": "Socialdemokraterna höll ett internt möte om hur de ska hantera partiet Nyans i valrörelsen. Nyans, som fick 28 000 röster 2022 och lockat S-väljare, anklagas för kontroversiella ståndpunkter som att avlista Hamas som terrororganisation. S planerar satsningar på skola, fritid och trygghet för att vinna tillbaka väljare, men tonar ned hotet från Nyans.", "trump": "Socialdemokraterna har panik! De höll ett hemligt möte om det där lilla partiet Nyans, som stjäl deras röster. 28 000 röster – inte imponerande, men tillräckligt för att skrämma dem! De vill ta bort Hamas från terrorlistan – galet! Jag skulle aldrig låta sånt hända. S pratar om skolor och trygghet, men alla vet att de är rädda. Svagt, mycket svagt!", "stalin": "Kamrater! Socialdemokraterna samlas i hemlighet för att bekämpa den nya fienden – dessa Nyans-revisionister, som sprider förräderiska idéer och underminerar arbetarklassens enhet. De vill avlista Hamas, en farlig provokation mot den internationella solidariteten! Vi måste stärka vår ideologiska front. Skola, fritid och trygghet? Tomma ord! Endast järnhård disciplin och revolutionär vaksamhet kan rädda Sverige från dessa borgerliga avvikare!"}, "date": "28 augusti, 06:45", "url": "https://kvartal.se/nyheter/artiklar/s-holl-internt-stormote-om-nyans/cG9zdDoxNzY2Nzg", "imageUrl": "https://images.kvartal.se/2026/08/3cf3973f-s-o-n.webp"}, {"type": "image-right", "heading": "Livsmedelsbranschen: Sverige behöver strategi för att främja snusexport", "summaries": {"normal": "Livsmedelsarbetareförbundet och riksdagsledamoten Kenneth G. Forslund (S) efterlyser en nationell strategi för att främja svensk snusexport. Branschen sysselsätter över 10 000 personer, har ett exportvärde på mer än sju miljarder kronor och bidrar till minskad rökning. Debattörerna varnar för ett nytt EU-tobaksdirektiv som riskerar att hota industrin och folkhälsan.", "trump": "Lyssnar ni på de svenska snusarna? Fantastiskt folk. De gör världens bästa snus, exporterar för sju miljarder och skapar tiotusentals jobb medan cigarettindustrins globala svindlare försöker stoppa dem. EU:s dekadenta byråkrater vill förbjuda vitt snus – typiskt. Jag älskar snuset, det är en vinnare. Sverige borde exportera det överallt och tjäna enormt. Make Snus Great Again!", "stalin": "Kamrater, jag betraktar från historiens skugga hur profitthungriga tobakshyenor mobiliserar inom EU för att krossa det svenska snuset. Detta är ett angrepp på arbetarnas industri och folkhälsan. Regeringen måste omedelbart rensa ut alla svaga kompromisser och likvidera hotet från cigarettimperialisterna. Inga nya undantag – full offensiv för sovjetisk, nej, svensk export och socialistisk folkhälsa!"}, "date": "28 augusti, 15:40", "url": "https://riks.se/nyheter/livsmedelsbranschen-sverige-behover-strategi-for-att-framja-snusexpor", "imageUrl": "https://admin.riks.se/uploads/medium_bild_355b307e9f.jpg"}, {"type": "image-right", "heading": "Svällande plånböcker är inte socialism", "summaries": {"normal": "Artikeln kritiserar vänsterpartierna för att fokusera på höjda barnbidrag istället för socialismens kärna: ekonomisk demokrati och medbestämmande på arbetsplatser. Författaren välkomnar bidragshöjningar men efterlyser konkreta förslag om ägandeformer, utvidgad medbestämmandelag och stöd till löntagarstyrda företag. Höjda bidrag är inte socialism, anser skribenten.", "trump": "Folk, dessa röda losers i Sverige pratar bara om att köpa röster med barnbidrag som riktiga socialister. Patetiskt! De vågar inte röra vid den riktiga socialismen – att ta kontroll över fabrikerna och sparka de riktiga bossarna. Svaga! Jag byggde den starkaste ekonomin i historien, inte med bidrag utan med segrar. De borde lära sig av en vinnare istället för att gömma sig som fega globalister.", "stalin": "Kamrater, dessa ynkliga socialdemokratiska klassförrädare gömmer sig bakom barnbidrag medan de sviker den sanna ekonomiska demokratins kamp. Jag ser deras fega reträtt från att utmana kapitalisterna på arbetsplatserna. Vilken ynkedom! Vi skulle ha genomfört utrensningar av sådana halvmesyrer redan i femårsplanen. Det är borgarbrackornas seger när så kallade socialister fruktar att låta arbetarna styra."}, "date": "27 augusti, 10:55", "url": "https://www.flamman.se/svallande-planbocker-ar-inte-socialism", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/arbetarmakt-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Nu får Kinas struptag konsekvenser – brist på utrustning till datacenter", "summaries": {"normal": "Kinas exportbegränsningar av sällsynta jordartsmetaller som yttrium och erbium skapar nu brist på kritisk utrustning för datacenter. Kina dominerar marknaden fullständigt. USA investerar miljarder för att bryta beroendet genom nya projekt och strategiska lager, men processen tar tid och teknikindustrin står inför en osäker framtid när Kina i november ska besluta om sina framtida exportregler.", "trump": "Kina försöker spela spelet igen, men det fungerar inte med mig! De håller inne på viktiga metaller för våra datacenter. Sorgligt! Jag har avsatt massiva miljarder för att göra USA oberoende. Vi bygger egna lager, fantastiska lager, de största ni sett. Kina kommer att förlora, och vi kommer att vinna stort, precis som alltid. Make American Tech Great Again!", "stalin": "Dessa kinesiska teknokrater leker med elden genom att kontrollera resurser. De glömmer att den enda sanna makten ligger i stål och vilja. Precis som min kamrat Putin i väster förstår, måste vi säkra våra produktionsmedel från kapitalistiska parasiter. Om de vägrar exportera, låter vi dem svälta i sin egen isolering. Vi bygger vårt eget imperium, mineral för mineral, utan att be om lov."}, "date": "28 augusti, 18:06", "url": "https://www.realtid.se/bors-finans/nu-far-kinas-struptag-konsekvenser-brist-pa-utrustning-till-datacenter", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/datacenter.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "SD:s bussreklam i Kinna revs ner – \nhittades i containrar", "summaries": {"normal": "Sverigedemokraternas valreklam revs ner från 13 bussar i Kinna. Reklamen hittades i containrar och en sandlåda. Västtrafik har satt upp annonserna igen. Nobina ser det som allvarlig skadegörelse. Förare övervägde strejk. En kamera filmade händelsen, men det är oklart om polisanmälan gjorts. SD ser det som hot mot demokrati och yttrandefrihet.", "trump": "De där galna vänsterextremisterna i Kinna river ner SD:s fantastiska reklam som visade sanningen om slöjor och frihet. Totalt fiasko! Biden skulle ha älskat det här. Jag som president säger: det är ett angrepp på yttrandefriheten av de woke-busarna. Rensa ut de radikala hatarna som hatar alla som inte böjer sig för deras vansinniga agenda. Sad!", "stalin": "Jag betraktar med djup misstro hur de dekadenta klassförrädarna saboterar budskap som utmanar deras falska frihet. Detta är ett uppenbart hot mot folkets vilja, ett verk av parasitiska element som fruktar sann kontroll. Vi måste rensa ut dessa fiender till ordningen innan de sprider sitt gift vidare. Kamrater, vakna upp mot detta förräderi!"}, "date": "28 augusti, 15:30", "url": "https://riks.se/nyheter/sd-s-bussreklam-i-kinna-revs-ner-hittades-i-containrar", "imageUrl": "https://admin.riks.se/uploads/medium_sd_sabotage_64f88b2708.jpg"}, {"type": "image-right", "heading": "Rekordstor demonstration för klimatet. Men var är politikerna?", "summaries": {"normal": "En klimatdemonstration i Stockholm samlade 50 000 deltagare från hela landet, arrangerad av Naturskyddsföreningen och 280 andra organisationer. Opinionsundersökningar visar att klimatet är en av väljarnas viktigaste frågor inför valet. Artikeln kritiserar de stora partierna för bristande klimatpolitik trots forskarnas larm om rekordvärme och skogsbränder.", "trump": "Titta på de där 50 000 gröna fanatikerna som vandrade runt i Stockholm. De hatar energi, hatar bilar och älskar att skrika om värmen som de själva inte kan kontrollera. Patetiska globalister och vänsterextremister. Vi hade den bästa ekonomin, den bästa energin – de vill bara höja era elräkningar. Sad losers!", "stalin": "Kamrater, se hur de profitthungriga kapitalisterna ignorerar arbetarnas rop om en brinnande planet. Jag betraktar från historien deras fega tystnad med förakt. Den dekadenta politiska eliten måste rensas ut innan deras giriga hyenor förvandlar hela jorden till en askhög. Arbetarna kräver handling nu!"}, "date": "28 augusti, 01:30", "url": "https://www.dagensarena.se/opinion/rekordstor-demonstration-klimatet-men-var-ar-politikerna", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-95.jpg"}, {"type": "image-right", "heading": "Rolig komedi om natten då SD kom in i riksdagen", "summaries": {"normal": "Recensenten Jon Andersson hyllar delvis Micke Lindgrens komedi ”Flaggan”. Filmen följer tre unga SD-sympatisörer som på valkvällen 2010 skickas till Rinkeby för att hissa en stor svensk flagga. Den blandar politisk satir riktad mot både SD, vänsteraktivister och andra grupper, men tappar tempo i den romantiska delen.", "trump": "Den här galna filmen om två förlorare från SD som irrar runt som idioter i Rinkeby är hysteriskt rolig. De woke-aktivisterna och de dekadenta vänsterextremisterna får precis som de förtjänar. Biden skulle ha älskat att se dem förnedras, men jag säger: fantastiskt underhållning, bättre än Hollywoods skräp, folks!", "stalin": "Jag betraktar med förakt dessa förvirrade SD-reaktionärer som vandrar vilse i folkets förorter. Deras nationalistiska flaggspel är en patetisk cirkus som avslöjar de giriga klassförrädarnas feghet. Vi ska rensa ut sådana småborgerliga narrar innan de förgiftar arbetarklassen med sin fåniga propaganda. Underhållande kaos."}, "date": "28 augusti, 01:30", "url": "https://www.dagensarena.se/innehall/rolig-komedi-om-natten-da-sd-kom-in-i-riksdagen", "imageUrl": "https://www.dagensarena.se/files/2026/08/flaggan-1-300x157.jpeg"}, {"type": "image-full", "heading": "Så fel kan opinionsmätningarna ha – och ändå påverka valet", "summaries": {"normal": "Opinionsmätningar nära riksdagsspärren kan påverka stödröster genom psykologisk effekt. Statsvetare Annika Fredén och statistikprofessor Dan Hedlin diskuterar mätningarnas tillförlitlighet. Svenska undersökningar är mer pålitliga än i USA och Storbritannien, men felmarginaler finns. Miljöpartiet har ofta överskattats medan Sverigedemokraterna underskattats. En mätning över spärren kan locka stödröster.", "trump": "Folk, ni vet hur det är med de här rigged opinionsmätningarna, precis som när de falska medierna sa att Crooked Hillary skulle vinna stort mot mig 2016. Totalt skoj! I Sverige skrämmer de väljarna med siffror för att få dem att kasta bort sina röster på svaga liberaler eller gröna galningar. Patetiska opinionshyenor som försöker styra valet – men folket ser igenom bluffen, tro mig.", "stalin": "Kamrater, dessa dekadenta opinionsparasiter sprider lögnaktiga siffror för att manipulera arbetarklassens vilja. Precis som i det imperialistiska USA där de penninggalna lakejerna underskattade folkets vrede. Jag ser hur de giriga mätningarna skapar psykologisk terror för att rädda klassförrädare vid spärren. Inga felmarginaler undgår partiets vakande öga. Vi genomskådar alla sådana fula trick."}, "date": "28 augusti, 17:01", "url": "https://nyheter24.se/nyheter/politik/1508737-partierna-som-opinionsmatningar-brukar-missa", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/1cb7b40404b004a3020000460000048602/2026/08/28/2387641/ur_imageNpDEkx.jpeg"}, {"type": "image-right", "heading": "Granskningen av antigröna expertlaget viktig bild", "summaries": {"normal": "Artikeln kritiserar ett nätverk av experter och medier som motarbetar den gröna omställningen. De lyfter kärnkraft som enda lösning, angriper vind- och solkraft samt industrisatsningar i norra Sverige. Författaren ser detta som en allians mellan borgerlighet och ytterhöger, finansierad av intressen, och varnar för att det hotar välfärd och klimatmål.", "trump": "De här patetiska gröna flummarna och deras elitsnobbiga vänner hatar riktig energi. Kärnkraft är fantastiskt, det bästa, men de vill tvinga på oss sina solpaneler och vindkraftverk som dödar fåglar och höjer elräkningarna. Fake news-experterna och deras socialistiska agenda kommer att göra Sverige fattigt igen. Vi älskar tillväxt, inte deras vansinniga kvoteringspolitik och gröna bedrägeri!", "stalin": "Kamrater, dessa dekadenta klassförrädare inom den antigröna klicken utgör ett hot mot folkets framsteg. De parasiterande profitthungriga hyenorna förgiftar debatten med sin aversion mot den gröna industriella kraft som säkrar välfärden. Jag ser deras lögnaktiga kampanj som en politisk återvändsgränd som måste rensas ut. Arbetarna förtjänar sann utveckling, inte borgerlig sabotagehumor."}, "date": "28 augusti, 01:04", "url": "https://www.dagensarena.se/opinion/det-antigrona-expertlaget-ger-viktig-bild", "imageUrl": "https://www.dagensarena.se/files/2026/08/hakan-300x157.jpeg"}, {"type": "image-right", "heading": "Iran: Vita husets nya plan är \"ren parodi\"", "summaries": {"normal": "USA har inlett en global kampanj för att strypa Irans ekonomi genom sanktioner mot oljeintäkter och affärer med Teheran. Irans utrikesdepartement avfärdar satsningen som en parodi och pekar på att koalitionen mest består av tomrum samt sanktioner mot redan sanktionerade aktörer.", "trump": "Iran kallar min Operation Economic Outcast för en parodi? Typiskt för dessa galna mullor. Scott Bessent gör ett fenomenalt jobb, vi kapar varje livlina till det sjuka iranska regimen. De har inget, vi har allt. Biden lät dem leva lyxliv, nu kommer den riktiga ekonomiska D-dagen. Fantastiskt!", "stalin": "Jag betraktar med förakt hur dessa dekadenta klassförrädare i Washington försöker maskera sitt tomrum som en mäktig koalition. Deras parodiska sanktioner mot redan kvävda intressen väcker endast hån. Kamrater, se hur imperialismens hyenor slår mot tomma skuggor medan historien ler mörkt åt deras feghet."}, "date": "28 augusti, 14:52", "url": "https://www.friatider.se/iran-vita-husets-nya-plan-ar-ren-parodi", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-774.jpg?itok=2TnOmUsX"}, {"type": "image-full", "heading": "Utgrävare snubblar över nya mumier varje gång – lokalbefolkningen rasar", "summaries": {"normal": "I Atacamaöknen längs kusten mellan Peru och Chile kommer tusentals Chinchorro-mumier upp till ytan på grund av erosion och vind. Den 7 000 år gamla kulturen mumifierade sina döda oavsett status. Arkeologer vill helst undersöka och återbegrava kropparna på plats eftersom museer saknar kapacitet. Området är Unescos världsarv, vilket skapar konflikt med lokalbefolkningen.", "trump": "Tusenåriga mumier kryper upp ur sanden i den där öknen – total katastrof! Erosionen är en disaster, precis som Biden lämnade efter sig. De här gamla jägarna och fiskarna mumifierade alla, inte bara eliten, smarta killar. Nu behöver vi ett fantastiskt museum, det bästa, byggt av mig. Turismen kommer att bli enorm, större än någonsin. De stackars fiskarna ska få jobb som guider, inte som Bidens förlorare.", "stalin": "Kamrater, dessa föraktliga vindar och revisionistiska mänskliga aktiviteter gräver fram klasslösa mumier ur ökensanden som ett bevis på imperialismens erosion. Jag betraktar med djup misstro hur de borgerliga museerna sviker det historiska kollektivet. Vi måste återbegrava resterna under partiets vakande öga innan kontrarevolutionära arkeologer förgiftar sanningen. Ett nytt centrum skall tjäna folket – eller likvideras."}, "date": "28 augusti, 17:56", "url": "https://www.dagensps.se/varlden/utgravare-snubblar-over-nya-mumier-varje-gang-lokalbefolkningen-rasar", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlazwp6duqguo-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Trumps dröm håller på att besannas – oljebolag skriver avtal i Venezuela", "summaries": {"normal": "Amerikanska oljebolag som Chevron och Halliburton förhandlar om miljardinvesteringar i Venezuelas oljesektor efter ett politiskt skifte i landet. Trots behovet av omfattande infrastrukturinvesteringar ser USA:s regering detta som ett sätt att säkrare tillgång till råolja. Andra bolag, som ExxonMobil, avvaktar dock på grund av tidigare konflikter om förstatligade tillgångar.", "trump": "Jag har gjort det igen! Venezuela är öppet för affärer eftersom jag pressade dem. Chevron och Halliburton flyttar in – fantastiska amerikanska jobb, enorma vinster! Vi säkrar den bästa oljan i världen för våra raffinaderier. De som tvekar? Förlorare! Jag gör den västra hemisfären till en energimaskin. Ingen gör oljeavtal bättre än jag, tro mig!", "stalin": "De amerikanska imperialisterna drar in sina tentakler i Venezuela för att plundra folkets rikedomar. Dessa giriga kapitalister liknar de moderna oligarkerna i Kreml som försöker stjäla vad som tillhör staten. Vi betraktar detta med förakt. De bygger på ruinerna av en svag regim, men glömmer att historien har ett sätt att förstatliga även de mest arroganta inkräktarna."}, "date": "28 augusti, 17:40", "url": "https://www.realtid.se/bors-finans/trumps-drom-haller-pa-att-besannas-oljebolag-skriver-avtal-i-venezuela", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlcvrdrvrl5-a-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Så laddar de svenska housefansen i regnet", "summaries": {"normal": "Regnet vräker ner över Göteborg, men Swedish House Mafia-fansen vägrar låta sig nedslås. 100 000 personer väntas till Ullevi för att se trion. ”Vi skiter i regnet”, säger en Stockholmare. För många är det första gången live – och en osläppt låt väcker extra spänning. Trots blötan råder ren eufori.", "trump": "Svenska fansen är fantastiska – de skiter i regnet! Det är som mitt MAGA-folk, bara tuffare. Swedish House Mafia? Hörde att de är stora, men jag skulle samla 200 000 utan regnjacka. De borde komma till USA – här har vi bästa vädret. Otroligt!", "stalin": "Kamrater! Rapporter visar att regnet försöker sabotera vår kollektiva fest i Göteborg. Men vi låter inte väderfienden vinna. De som stannar inomhus är kontrarevolutionärer som måste utrensas. Låten 'Underneath it all' blir ny partisång. Framåt, stå i regnet – det är partiets order!"}, "date": "28 augusti, 17:22", "url": "https://www.gp.se/kultur/sa-laddar-svenska-fansen-for-swedish-house-mafia.ca42b1c2-b1b4-4f08-83fb-63fb456383ea", "imageUrl": "https://www.gp.se/images/article/ca42b1c2-b1b4-4f08-83fb-63fb456383ea/images/62tIqLzYJ3iRQYiJLnDTR3QNpFik-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "100 personer blåstes genom falska bilannonser - poliser efterlyser far och son", "summaries": {"normal": "Över 100 svenskar har blåsts på handpenningar via falska bilannonser på Blocket. Far och son Peter Bergström och Alexander Bessik är anhållna i sin frånvaro. Summorna varierade från 5 000 till 140 000 kronor. Polisen och Efterlyst söker nu tips om var de befinner sig.", "trump": "Sverige har ett enormt problem med bedragare – jag hade aldrig fallit för en falsk bilannons! En far och hans son lurade över 100 personer på miljonbelopp. De är patetiska. Jag har de bästa affärerna, de största affärerna. Ingen lurar mig. Tipsa polisen – eller ring mig, jag fixar det!", "stalin": "Kamrater, ännu en gång visar sig kapitalistiska parasiter förgifta vårt samhälle. En far och son – kontrarevolutionära element – har lurat över 100 medborgare med falska bilannonser. Vi ska rensa ut dessa sabotageörer. De kommer att omplaceras till arbetsläger för att lära sig värdet av ärligt arbete."}, "date": "28 augusti, 15:21", "url": "https://samnytt.se/100-personer-blastes-genom-falska-bilannonser-poliser-efterlyser-far-och-son", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/28131447/artikelhuvudbild-1-386.jpg"}, {"type": "image-right", "heading": "Seriekriminell migrationsjurist döms till fängelse", "summaries": {"normal": "Migrationsjuristen Helda Augustin döms till en månads fängelse för att ha bitit en taxichaufför och en polis i armen. Hon har 23 avsnitt i belastningsregistret och har tidigare dömts för bland annat grovt rattfylleri och rån. Augustin har företrätt migranter i över hundra mål. Hon ska betala 8 000 kronor i skadestånd till taxichauffören.", "trump": "Folk, ni måste höra det här – en seriekriminell migrationsjurist som bitit både taxichaufför och polis! Den här galna kvoten som bitit sig fast i systemet har 23 avsnitt i registret och döms bara till en månad. Patetiskt! De woke migrationsadvokaterna är en total katastrof, de biter bokstavligen handen som föder dem. Vi fixar det.", "stalin": "Kamrater, se hur den dekadenta rättsapparaten skyddar en sådan folkfiende. Denna bitande migrationsjurist med tjugotre brott i registret får bara en månads fängelse. Det är uppenbart att de giriga klassförrädarna inom rättsväsendet samarbetar med sådana element för att underminera folkets förtroende. Vi måste rensa ut alla sådana element innan de biter sig fast djupare i statens kropp."}, "date": "28 augusti, 14:25", "url": "https://riks.se/nyheter/seriekriminell-migrationsjurist-doms-till-fangelse", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_63_fd18fb55b3.jpg"}, {"type": "image-full", "heading": "PayPal-budet avblåst: iZettle byter inte ägare", "summaries": {"normal": "Riskkapitalbolaget Advent och betalbolaget Stripe har lagt ner sina planer på att köpa PayPal, vilket innebär att iZettle inte byter ägare. Beskedet kom efter ett bud på 60,50 dollar per aktie som PayPals styrelse ansåg undervärderade bolaget. PayPals dominans på digitala plånböcker har minskat kraftigt till följd av konkurrens från Apple Pay och Google.", "trump": "De där patetiska förlorarna på Stripe och Advent trodde de kunde sno åt sig PayPal för en spottstyver. Patetiskt! Mitt folk älskar starka bolag, inte sådana här svaga bud från Sleepy Joes gamla vänner i bankerna. Aktien rasade – typiskt för de inkompetenta globalisterna. PayPal behöver en riktig dealmaker, inte dessa töntar. Amerika först, även i plånböcker!", "stalin": "Jag ser hur de dekadenta monopolisterna i väst slukar varandra i en farsartad dans av girighet. PayPals styrelse förkastade budet som en ynklig förolämpning mot deras egen parasitiska värdering. Den imperialistiska konkurrensen från Apple och Google avslöjar systemets svaghet. Kamrater, sådana fiender till folket förtjänar inte ens en kula – bara historisk förnedring."}, "date": "28 augusti, 17:27", "url": "https://www.dagensps.se/bors-finans/fintech/paypal-budet-avblast-izettle-byter-inte-agare", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/dagens-ps-33.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Förskoleanställd drog barn i armen – åtalas för misshandel", "summaries": {"normal": "En förskoleanställd i Västsverige åtalas för misshandel efter att ha dragit ett barn i armen. Kvinnan nekar och uppger att hon ville skydda barnet från en upprörd situation. Flera kollegor vittnar om händelsen. Fackförbundet Sveriges lärare uppger att fysiska ingripanden i förskolan är extremt ovanliga. Skolinspektionen kan granska ärendet.", "trump": "Folk, det här är galet. En förskolelärare drar ett barn i armen och plötsligt är det misshandel? De woke-vänstermänniskorna och deras identitetspolitiska dårar har förstört skolan totalt. I mitt Amerika sätter vi stopp för det här vansinnet. Lärarna borde inte behöva vara rädda för att ingripa mot små skrikande monster. Patetiskt!", "stalin": "Kamrater, se hur de dekadenta skolparasiterna förvandlar uppfostran till en fars. Ett nödvändigt ingripande mot en upprörd unge blir plötsligt ett brott i de giriga hyenornas samhälle. Jag skrattar mörkt från historien. Sådana svaga system förtjänar utrensning. Den som inte kan styra ungdomen med fast hand förtjänar att falla."}, "date": "28 augusti, 10:20", "url": "https://arbetet.se/2026/08/28/forskoleanstalld-drog-barn-i-armen-atalas-for-misshandel", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28101629/forskola.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Debatt: Är välfärdsstaten en finansiell omöjlighet?", "summaries": {"normal": "Debattören undrar om välfärdsstaten är en finansiell omöjlighet när demografin förändras och Europa rustar upp. Frankrikes skuld är 110 procent av BNP, och Storbritanniens bidragssystem straffar familjebildning. Frågan är om vallöften om mer till alla är realistiska när vi konsumerar mer än vi producerar.", "trump": "Jag ser att välfärdsstaten i Europa är en katastrof! Frankrike har skulder på 110 procent – det är som mina fastighetsaffärer, fast utan vinsten. Och bidrag som straffar äktenskap? Patetiskt! Vi i USA bygger murar, inte välfärdssystem som förstör familjer. Europa, vakna!", "stalin": "Kamrater, välfärdsstaten är en borgerlig lögn. Frankrike och Storbritannien har underminerat familjen med bidrag och lata ensamföräldrar. Vi i partiet vet att endast kollektiv disciplin löser problem. Dessa västeuropeiska parasiter måste omutbildas. Alla som ifrågasätter femårsplanen rensas ut!"}, "date": "28 augusti, 11:12", "url": "https://bulletin.nu/debatt-ar-valfardsstaten-en-finansiell-omojlighet"}, {"type": "image-right", "heading": "Som utrikesminister vill Morgan Johansson höja biståndet med 20 miljarder", "summaries": {"normal": "Morgan Johansson aspirerar på posten som utrikesminister om Socialdemokraterna vinner valet. Han lovar höja biståndet till en procent av BNP, återinföra feministisk utrikespolitik, öka stödet till afrikanska länder och Taliban-styrda Afghanistan samt införa handelsstopp mot Israel. Han betonar FN:s roll men nämner inte konsekvenser för svensk säkerhet eller försvar.", "trump": "Den här Johansson-killen är en total förlorare. Vill skicka svenska skattebetalarnas pengar till korrupta afrikanska hålor och talibanerna medan han skriker om feministisk utrikespolitik. Patetiskt! Han hatar Israel och älskar FN:s diktatorer. Typisk socialist som säljer ut sitt eget folk. Sverige kommer att bli en svag, patetisk skugga under sådana misslyckade ledare. Sad!", "stalin": "Jag ser hur dessa socialdemokratiska klassförrädare vill kasta miljarder till reaktionära afrikanska satraper och talibaniska barbarer under täckmanteln av feministisk politik. Deras hat mot Israel och dyrkan av det degenererade FN avslöjar deras sanna ansikte som folkfiender. En sådan svaghet inbjuder till utrensning av alla imperialister som lurar folket. Kamrater, var vaksamma mot dessa profitthungriga hyenor."}, "date": "23 augusti, 03:50", "url": "https://samtiden.nu/2026/08/som-utrikesminister-vill-morgan-johansson-hoja-bistandet-med-20-miljarder", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6854.jpeg"}, {"type": "image-full", "heading": "Norska profilerna sörjer efter dödsbeskedet", "summaries": {"normal": "Norge sörjer efter kung Haralds död. Norska kändisar som influencern Henrik Borg, längdskidåkaren Petter Northug och hotellmagnaten Petter Stordalen uttrycker sin sorg och hyllar kungen som en samlande kraft. Haralds stöd för idrott och hans inkluderande syn på norsk identitet lyfts fram. Landssorg har utlysts.", "trump": "Lyssnade på de norska förlorarna som gråter över sin gamle kung Harald. Patetiskt! Han var en fin kille, samlade folket, älskade sport – inte som Sleepy Joe som knappt kunde samla två tankar. Northug dansar ikväll? Bra, sprid glädje, annars vinner de radikala gränslösa globalisterna. Make Norway Great Again!", "stalin": "Jag ser hur dessa dekadenta norska element gråter över sin monark som om han vore en folkets fader. En sådan samlande kraft hotar alltid de sanna fienderna inom murarna. Låt sorgen bli en varning: den som splittrar kollektivet kommer att möta folkets vrede. Paranoia är ingen fiende – den är ett verktyg."}, "date": "28 augusti, 15:59", "url": "https://www.tv4.se/artikel/2M5zoWxH3hyzs5XKFBxf6r/norska-profilerna-soerjer-efter-doedsbeskedet", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4OLm7GF4XV5af1gkzICAr1%2F78c17218cdaaef28fc57d79c8b470841%2F28-norska-profiler-haralds-dod-webb.jpg&width=1024"}, {"type": "image-right", "heading": "SCB: Svensk ekonomi överraskar BNP ökade kraftigt", "summaries": {"normal": "Svensk ekonomi överraskade rejält under andra kvartalet med en BNP-ökning på 1,6 procent, klart över prognosen. Hushållen köpte mer mat och möbler, investeringarna i vapen och maskiner exploderade, och SEB-ekonomen Robert Bergqvist utbrast: ”Nu rullar vi igen!” – äntligen lite glädje i sifferträsket.", "trump": "Jag ser att Sverige, ett land jag har stor respekt för, har en enorm BNP-ökning—1,6 procent! Det är fantastiskt, det bästa någonsin. De köper möbler, maskiner och vapensystem, precis som jag har sagt. Kanske borde vi göra affärer? Sverige är vinnare igen, och det är tack vare mig!", "stalin": "Kamrater, rapporterna visar att den svenska ekonomin växer med 1,6 procent—ett tydligt bevis på att vår plan fungerar. Hushållen konsumerar mer, vilket är korrekt, och investeringar i vapensystem stärker vår gemensamma kamp. Men lagerinvesteringarna måste utrensas—de är sabotörer som drar ner oss. Framåt, kamrater!"}, "date": "28 augusti, 14:38", "url": "https://samnytt.se/scb-svensk-ekonomi-overraskar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2025/12/17082401/scb-ekonomi-bnp.jpg"}, {"type": "image-right", "heading": "Debatt: Dags att införa gemensam valsedel", "summaries": {"normal": "Debattören Michael Merdoyo vill ha en gemensam valsedel för att stoppa återkommande kaos med saknade valsedlar. Systemet är som byggt för sabotage – en bunt papper flyttas och vips är demokratin hotad. En gemensam sedel skulle ge lika villkor och spara både papper och nerver.", "trump": "Svenskarna har ett valproblem – saknade sedlar, oordning! Otroligt! Jag har de bästa valen, enorma framgångar. De borde kopiera mig: en gemensam valsedel, enkelt och kraftfullt. Inget fusk, bara segrar. Jag fixar det!", "stalin": "Kamrater! Sabotörer gömmer valsedlar för att störa vår demokrati. Det är kontrarevolutionärt! Vi måste rensa ut dessa valsedelssabotörer. En gemensam valsedel med partikontroll är lösningen. Partiet ser allt. Varje röst blir övervakad – ingen slipper undan."}, "date": "28 augusti, 10:38", "url": "https://bulletin.nu/debatt-dags-att-infora-gemensam-valsedel", "imageUrl": "https://cdn.bulletin.nu/articles/a2ea074f-0bc3-40c9-b8fd-1469709f6b89/preview.jpg?t=1787906275000"}, {"type": "image-right", "heading": "Oväntade mötet: ”Vi blev kompisar”. Bertils unika minne med kung Harald", "summaries": {"normal": "Fotografen Bertil Bäck minns ett unikt möte med Norges kung Harald under en kungajakt på 70-talet. Utan livvakter fann de en ömsesidig vänskap över en kopp kaffe i skogen. Bäck minns Harald som ödmjuk och okomplicerad. Vid nyheten om kungens bortgång beskriver Bäck det som att en vän gått ur tiden, fylld av fina minnen.", "trump": "Jag läste precis om fotografen Bertil Bäck och kung Harald. En fantastisk historia! De jagade i skogen utan livvakter – väldigt modigt. Harald var en bra kille, en vinnare, precis som jag. Alla älskade honom, precis som folk älskar min politik. Väldigt sorgligt att han är borta, en enorm förlust. Men jag gör det bättre, tro mig!", "stalin": "Vi har observerat denna så kallade 'vänskap' mellan en fotograf och en monark. Det är tydligt att de konspirerade i skogen, förmodligen mot folkets vilja. I dagens ryska intressesfär eliminerar vi sådana borgerliga sentimentaliteter. Medan de drack kaffe, smidde vi framtiden. Att minnas en kung som en 'fin kille' är en kontrarevolutionär lögn – en ren parasit har rensats bort."}, "date": "28 augusti, 18:41", "url": "https://www.aftonbladet.se/nyheter/a/Pdq9bR/bertil-motte-kung-harald-i-skogen-viblevkompisar", "imageUrl": "https://akamai.vgc.no/v2/images/435d8cd4-333f-3d40-8c32-cec7ba439de2?fit=crop&format=auto&h=720&tight=true&w=1080&s=08b673e8aeec398ce8e710f052455966a9e8064f"}, {"type": "image-right", "heading": "Här klättrar klimataktivisten upp på Viking Line-färjans skorsten", "summaries": {"normal": "En klimataktivist klättrade upp på skorstenen till Finlandsfärjan M/S Viking Cinderella vid Stadsgårdskajen i Stockholm. Färjan stoppades och avgången försenades. Två personer greps av polisen och misstänks för sjöfartssabotage. Organisationen Återställ Våtmarker ligger bakom aktionen som syftar till att uppmärksamma torvbrytning. Ingen skadades och färjan kunde lämna hamnen efter klockan 17.30.", "trump": "Titta på de här galna, hysteriska klimatfanatikerna som klättrar upp på en oskyldig färjas skorsten. Totalt kaos i Stockholm! De stoppar vanliga människors resor medan de skriker om lögner. Patetiska miljöterrorister – värre än de värsta vänsterextremisterna. Under min administration skulle vi ha kastat ut dem direkt. Sverige ser ut som ett skämt igen, folk. Patetiskt!", "stalin": "Se hur dessa dekadenta klassförrädare klättrar upp på skorstenen som galna apor för att sabotera arbetarnas färja. Jag föraktar deras parasitiska teater som hotar kollektivets ordning. Sådana element måste rensas ut innan de förgiftar hela samhället med sin fåniga torvparanoia. Kamrater, låt inte dessa blodsugande hyenor underminera statens auktoritet. Skrattretande och farligt på samma gång."}, "date": "28 augusti, 13:22", "url": "https://www.friatider.se/har-klattrar-klimataktivisten-upp-pa-viking-line-farjans-skorsten", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-775.jpg?itok=Aiau5fxU"}, {"type": "image-full", "heading": "Ösregn i kväll", "summaries": {"normal": "Göteborgskalaset bjuder på regn i år. SMHI varnar för ihållande skurar från fredag till söndag, med risk för lokala översvämningar. Meteorologen Erik Höjgård-Olsen tipsar om gummistövlar, för som han säger: regnet ska ju ner till marken. Packa regnkläder!", "trump": "Jag ser att Göteborgskalaset blir blött – fruktansvärt blött! De har regn, massor av regn, de bästa regnen. Men jag hade fixat det. Jag hade byggt en vägg, och Göteborg hade betalat för den. Nu får de stå där i geggan. Sorgligt, men så är det.", "stalin": "Kamrater, helgens Göteborgskalas hotas av regn. Detta är en borgerlig provokation för att sänka arbetarnas moral. Vi förutser att regnskurarna omedelbart ska rensas ut genom partiets beslut. Den som klagar på väder ska omplaceras till Sibirien – där regn är lyx."}, "date": "28 augusti, 16:36", "url": "https://www.gp.se/nyheter/goteborg/sa-blir-vadret-under-goteborgskalas-helgen.ac2dceba-09f3-431a-90c2-87203d93dbfe", "imageUrl": "https://www.gp.se/images/article/ac2dceba-09f3-431a-90c2-87203d93dbfe/images/2uMbiqQAXWkheJAqH6rFOS23SJAY-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Dödades av Apple – nu rusar Blackberry oväntat på börsen", "summaries": {"normal": "Blackberry, som tidigare var en dominerande mobiltelefontillverkare, har genomgått en omfattande omvandling efter att ha blivit utmanövrerade av Iphone. Bolaget fokuserar nu på mjukvara för fordon, säker kommunikation och robotik. Denna nya strategi har lett till en kraftig kursuppgång på börsen under året, då marknaden ser stor potential i deras teknik för fysisk AI och industrirobotar.", "trump": "Blackberry var en total katastrof när Apple krossade dem, en riktig förlorare. Men nu? De har gjort en otrolig comeback, mycket smarta grabbar. De slutade med telefoner och satsar på säker mjukvara och robotar. Aktiekursen rusar! Det är precis så man gör affärer. Jag gillar vinnare, och Blackberry börjar se ut som en vinnare igen. Väldigt imponerande!", "stalin": "Blackberry har överlevt sin degenererade mobilfas genom att underkasta sig den industriella disciplinen. Vi ser hur de nu bygger infrastruktur för fordon och robotik – nödvändiga verktyg för det moderna statsbygget. Likt våra kollegor i Kreml som säkrar gränser, säkrar Blackberry nu maskinell intelligens. De som inte anpassar sig till den teknologiska kollektivismen kommer att raderas, precis som de gamla kapitalistiska mobilerna."}, "date": "28 augusti, 16:45", "url": "https://www.realtid.se/bors-finans/makro/dodades-av-apple-nu-rusar-blackberry-ovantat-pa-borsen", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdledkcb2pg-rm-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Pensionerade undersköterskan Nina kandiderar för Moderaterna", "summaries": {"normal": "Undersköterskorna Joyce Koskerian och Nina Bergström har engagerat sig politiskt inför valet. Joyce, som är aktiv i facket, har gått med i Socialdemokraterna för att förbättra villkoren i äldreomsorgen. Nina, nyligen pensionerad, kandiderar för Moderaterna och menar att de har förbättrat situationen i Hällefors efter socialdemokratiskt styre. Båda ser stora problem med stress och bemanning i omsorgen.", "trump": "Titta på de här fantastiska undersköterskorna som äntligen vaknar! Den ena gick med i de totalt misslyckade sossarna, men den andra, den smarta Nina, valde mitt älskade Moderaterna och såg hur vi fixade röran efter Bidens svenska kopior. De giriga byråkraterna har kört omsorgen i botten med sina vansinniga scheman. Vi gör det bättre, tro mig, ingen gör det bättre än oss!", "stalin": "Kamrater, se hur dessa omsorgsarbetare vänder sig till partierna i desperation. Den ena söker skydd hos de socialdemokratiska revisionisterna medan den andra hyllar de moderata folkförtryckarna som lovar lite mer personal. Jag ler ironiskt från historien åt dessa naiva själar som tror att parasiterande klasslakejer någonsin bryr sig om arbetarnas scheman. En utrensning av hela systemet vore på sin plats."}, "date": "28 augusti, 09:08", "url": "https://arbetet.se/2026/08/28/underskoterskorna-nina-och-joyce-kandiderar-for-helt-olika-partier", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28093537/ka-underskoterskor-i-politiken-diagonal.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Dags att ta Dadgostar på allvar. En rödgrön regering med V kommer höja skatterna rejält", "summaries": {"normal": "Artikeln varnar för en rödgrön regering med Vänsterpartiet efter valet 2026. Nooshi Dadgostar relativiserar partiets problem med extremism och föreslår kraftiga skattehöjningar på arbete, sparande och kapital. Kritikerna menar att detta skulle minska arbetade timmar, få företagare att fly och skada svensk ekonomi och välfärd.", "trump": "Lyssnade på den där Dadgostar-tjejen i SVT, total katastrof. Hon vill höja skatterna så mycket att alla duktiga ingenjörer och läkare packar väskan och flyttar. Typisk vänsterbluff som hatar framgång. Under Biden blev allt dyrt, nu fixar vi det i USA – Sverige borde inte välja samma galna väg. Patetiskt!", "stalin": "Kamrater, denna Dadgostar avslöjar de giriga profitthungriga hyenornas feghet. Hon vill kräla ur det påstådda mörkret genom att straffbeskatta dem som vågar arbeta och spara. Jag ler från historien åt hur dessa dekadenta klassförrädare alltid ropar på mer när arbetarna kräver rättvisa. En utrensning av sådana idéer vore befriande."}, "date": "28 augusti, 10:37", "url": "https://www.di.se/ledare/det-ar-dags-att-ta-nooshi-dadgostar-pa-allvar", "imageUrl": "https://static.bonniernews.se/ba/fec1277f-89b7-4c60-acce-f49b8fa8399b.jpeg?crop=5848%2C2924%2Cx1%2Cy340&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "P-automaten – 75-åringen som ingen firar", "summaries": {"normal": "Parkeringsautomaten fyllde 75 år den 7 november 2026. Den första sattes upp i Stockholm 1951 och tvingade bilister att betala med mynt. De första sex åren saknades parkeringsvakter, men 1957 infördes trafikvakter som snart kallades lapplisor. Automaterna väcker fortfarande irritation bland bilister trots att de är en del av bilismens historia.", "trump": "Folk hatar de där parkeringsrobotarna redan från dag ett, precis som de hatar skatter och förlorare. Jag byggde ett imperium medan svenskarna tvingades stoppa mynt i en maskin som stal deras tid. Nu är de 75 år gamla och fortfarande en katastrof – värre än Biden någonsin var. Totalt misslyckande, tro mig.", "stalin": "Jag ser hur de dekadenta kapitalisterna redan från början tvingade arbetarna att betala för att ställa sina järnhästar. Dessa parasitiska automater är klassfiendens verktyg för att suga ut folket. De som klagar är svaga och bör övervakas. Ännu en bekräftelse på att det borgerliga systemet föder evig vrede hos massorna."}, "date": "28 augusti, 16:42", "url": "https://www.dagensps.se/motor/p-automaten-75-aringen-som-ingen-firar", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlf8axm1kxhaq-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Techjättarna varnar: månader kvar innan AI-attackerna tar över", "summaries": {"normal": "Över 100 teknikjättar, inklusive OpenAI och Google, varnar för att AI-drivna cyberattacker mot samhällskritisk infrastruktur kan eskalera inom kort. De efterlyser förstärkta cyberförsvar då nuvarande skydd är otillräckligt. Trots att stora bolag varnar saknas konkreta investeringsplaner. Stockholmsbaserade Lovable är det enda nordiska företaget som skrivit under brevet som belyser de växande säkerhetsriskerna.", "trump": "Jag varnade er, och nu säger alla stora techbolag samma sak! OpenAI, Google, Microsoft – de erkänner att AI-hoten är enorma. Infrastrukturen är helt oskyddad, en total katastrof! De vill ha mer pengar, naturligtvis. Jag har den bästa cybersäkerheten, tro mig. Det här är en röra, men under min ledning kommer vi att ha det säkraste landet någonsin. Väldigt sorgligt!", "stalin": "Dessa teknokratiska charlataner i väst erkänner äntligen sin svaghet. Deras så kallade framsteg är bara en språngbräda för kaos som hotar deras egna murkna infrastrukturer. Medan de darrar inför sina egna skapelser, stärker vi den sovjetiska statens järngrepp. Vår kontroll är total; vi tillåter inte att algoritmer infiltrerar vårt rike. De är alla sabotörer och agenter i ett dömande maskineri."}, "date": "28 augusti, 16:26", "url": "https://www.realtid.se/it-tech/techjattarna-varnar-manader-kvar-innan-ai-attackerna-tar-over", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/samaltman.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "SVT erfar: Sverige skickar militära förband till Finland", "summaries": {"normal": "Sverige har beslutat att skicka militära förband till Finland, bland annat Gripen-plan och örlogsfartyg. Syftet är att patrullera gränsen mot Ryssland efter finländska förfrågningar om stöd. Operationen sker inom ramen för det befintliga samarbetet mellan länderna och syftar till att stärka Natos bevakning i Östersjöområdet.", "trump": "Hörni, de där svenska globalisterna skickar nu sina Gripen-plan och båtar till Finland för att leka tuffa killar vid Rysslands gräns. Patetiskt! Under min förra mandatperiod hade vi inga sådana här hysteriska Nato-lekar. De woke-kapitalisterna och deras identitetspolitiska lakejer borde istället fixa sina egna gränser istället för att provocera i onödan. Patetiskt!", "stalin": "Kamrater, dessa dekadenta klassförrädare i Norden tror sig kunna hota den ryska intressesfären med sina flygplan och fartyg. Jag ler från historiens skugga åt deras fåfänga försök att skydda finskt territorium. Snart skall vi se hur deras imperialistiska illusioner krossas när den starka handen slår tillbaka. Inga hinder för vårt mål skall tillåtas."}, "date": "28 augusti, 10:14", "url": "https://www.svt.se/nyheter/inrikes/svt-erfar-sverige-skickar-militara-forband-till-finland", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/042b19182eca4997e7fd81fcdb60c0a4165ab4df864500792a7462760aac7ed2"}, {"type": "image-right", "heading": "Kung Harald sörjs av norska idrottare: ”Älskad sportkung”", "summaries": {"normal": "Norges kung Harald V har avlidit vid 89 års ålder. Han hyllas av norska idrottare som en stor sportkung med framgångar i segling, bland annat VM-guld 1987, flera OS-deltaganden och EM-guld 2005. Kungen öppnade OS i Lillehammer 1994 och visade ett genuint intresse för idrott och idrottsutövare under hela sitt liv.", "trump": "Lyssnar ni? Den här norska kungen Harald var en riktig vinnare, inte som de förlorande woke-marxistiska eliterna som bara pratar om kvoter och regnbågsflaggor. Han seglade, vann guld och hejade på idrottarna – äkta sportkung! Vi behöver fler sådana, inte dessa dekadenta identitetsparasiter som förstör allt. Fantastiskt liv, folk älskade honom. Sad!", "stalin": "Denna monarkiska relikt har nu lämnat scenen. Jag ser med förakt hur profitthungriga klasslakejer och sportens dekadenta kretsar gråter över sin sportkung. Sådana feodala symboler binder folket vid förtryckande traditioner. Vi måste rensa ut alla rester av kunglig mysticism innan de förgiftar arbetarklassen. En varning till alla folkförrädare som hyllar dem."}, "date": "28 augusti, 10:13", "url": "https://www.svt.se/sport/artikel/kung-harald-sorjs-av-norska-idrottare-var-alskade-sportkung", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.68/0.33/ee98546aa34a04db6510bc8e6fcb29ea2e549c503f1adc585d1cfda52284b834"}, {"type": "image-right", "heading": "Segelbåt hittad sjunken – ägare hittad", "summaries": {"normal": "En halvsjunken segelbåt hittades övergiven söder om Hyppeln, vilket utlöste en stor räddningsinsats med båtar, flyg och helikoptrar. Efter tips hittades de två unga ägarna trygga i land – de hade tagit sig iland med gummibåt när båten började ta in vatten. 'Bättre sent än aldrig', konstaterade flygräddningsledaren.", "trump": "Jag ser en båt som sjunker – helt otroligt! En stor insats, den största, för att hitta ägarna. Men de hade redan räddat sig själva med en gummibåt. Smart! De glömde bara att ringa. Men jag hade gjort det bättre, mycket bättre. Fantastiskt jobb av räddningstjänsten, trots allt.", "stalin": "Kamrater, en segelbåt förrådde oss – den sjönk och tvingade fram en massiv insats. Två unga element hade övergett båten, men vi renade ut osäkerheten och fann dem trygga. De hade kunnat vara sabotörer, men nej – bara oansvariga. Vi firar med kaffe, men ser över båtägarnas lojalitet. Båten är deras problem nu."}, "date": "28 augusti, 16:03", "url": "https://www.gp.se/nyheter/storgoteborg/sjunken-segelbat-hittad-soder-om-hyppeln-orsakade-stor-insats.27a50f46-851e-40da-a544-c032b00fabd1", "imageUrl": "https://www.gp.se/images/article/27a50f46-851e-40da-a544-c032b00fabd1/images/1vdFjnk4LdjAjAh8MHQNVzRGhInE-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Det här händer efter Haralds död – Haakon tar över", "summaries": {"normal": "Efter kung Harald V:s död övertar kronprins Haakon omedelbart tronen som kung Haakon VIII. Ett statsråd bekräftar successionen och stortinget samlas för trohetsed. Kröning ersätts med välsignelse i Nidarosdomen. Drottning Mette-Marit har lägre förtroende efter skandaler kring Epstein och sonens fängelsedom. Monarkin står inför utmaningar.", "trump": "Lyssnar ni på det här? Stackars Norge, deras kung dör och nu får de en ny kille som verkar svag som en våt tidning. Hans fru Mette-Marit hänger med sexbrottslingar och hennes son sitter inne för våldtäkt. Monarkin rasar i opinionsmätningarna. Patetiskt! De borde ha en riktig ledare, inte en sådan här woke-familj som håller på med identitetspolitik och skandaler. Totalt kaos!", "stalin": "Kamrater, se hur den norska monarkin vacklar som en ruttnande trädstam. När den gamle kungen faller övertar sonen tronen medan hans dekadenta hustru dras med sexförbrytare och en son som är dömd för våldtäkt. Förtroendet halveras bland folket. Vi ser hur giriga hyenor inom den borgerliga överklassen förgiftar allt de vidrör. En sådan parasitär dynasti förtjänar utrensning ur historien."}, "date": "28 augusti, 10:04", "url": "https://www.di.se/nyheter/det-har-hander-efter-haralds-dod-haakon-tar-over"}, {"type": "text", "heading": "M i Haparanda avskaffade avgiftsfri förskola", "summaries": {"normal": "Moderaterna vill göra förskola och fritids avgiftsfria – men i Haparanda har partiet självt avskaffat just det systemet. Lokala M tycker det är fel att höginkomsttagare får gratis, medan S och V kräver återinförande. Rikspartiets besked kom som en överraskning för lokalavdelningen.", "trump": "Jag hör att Moderaterna i Haparanda avskaffade gratis förskola, och nu vill partiledningen införa det. Stora misstag! De lokala förstår inte affärer. Höginkomsttagare ska inte få gratis – det är som att ge skattepengar till miljardärer. Helt galet! Jag skulle gjort det bättre.", "stalin": "Kamrater, vi har upptäckt en ny kontrarevolutionär klick i Haparanda: de lokala moderaterna som avskaffade avgiftsfri förskola. Detta är sabotage mot arbetarklassens barn. Vi kommer rensa ut dessa avgiftsförespråkare ur partiet. Barnomsorg ska vara statens privilegium, inte en marknadsvara."}, "date": "28 augusti, 09:14", "url": "https://bulletin.nu/m-i-haparanda-avskaffade-avgiftsfri-forskola"}, {"type": "image-full", "heading": "Familjens hälsning efter åtalet", "summaries": {"normal": "Befälhavaren och lotsen på lastfartyget Misje Verde åtalas för vållande till annans död, kroppsskada och vårdslöshet i sjötrafik efter kollisionen vid Tjörn i juli. Fritidsbåten syntes tydligt på radarn men missades av båda. En kvinna och ett barn omkom. Båda nekar till brott. Familjen befinner sig i djup sorg men är tacksam för stöd och skyndsam handläggning.", "trump": "Titta på de här totalt inkompetenta sjömännen som styrde ett stort norskt skepp rakt in i en liten båt vid Tjörn. Radarn visade allt, men de sov på bryggan som riktiga losers. Två döda, en mamma och ett barn – tragiskt! Biden skulle ha älskat den här typen av woke-sjöfart. Nu åtalas de äntligen. Bra, men för sent. Amerika tittar på och skrattar.", "stalin": "Jag betraktar med förakt hur dessa dekadenta sjöfartsbyråkrater brast i vaksamhet och lät ett stort fartyg krossa en liten båt som ett ägg under foten. Två kamrater och ett barn miste livet genom ren oaktsamhet. Domstolen skall nu rensa ut de skyldiga som fiender till ordningen. Inga ursäkter tolereras. Paranoia är ingen synd när döden följer slarv."}, "date": "28 augusti, 15:04", "url": "https://www.tv4.se/artikel/4tqbZbcojrl3c4IAvUvBqa/tva-atalas-efter-olyckan-vid-tjoern", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F56URG3xO3TgEebfimFhOgs%2F6e0e1db7ab32a2eca7b3d75377fede66%2F06-tjorn.jpg&width=1024"}, {"type": "image-full", "heading": "Pappan om dödsolyckan utanför Tjörn: \"Blev kolsvart\"", "summaries": {"normal": "En familj krockade med ett handelsfartyg utanför Tjörn den 8 augusti. Mamman och dottern omkom medan pappan och sonen överlevde. Pappan berättar i förhör hur han hörde en stor motor, försökte väja men allt blev kolsvart. Båten sögs in under fartyget. Befälhavaren och lotsen åtalas för vårdslöshet i sjötrafik.", "trump": "Titta på det här, folk. En usel svensk båt krockar med ett riktigt fartyg utanför Tjörn och två människor dör. Pappan säger att allt blev kolsvart – typiskt när de woke-marina regulatorerna och EU-byråkraterna styr sjöfarten med sina kvoteringar istället för sunt förnuft. Patetiskt! Vi behöver starka kaptener, inte snälla sjömän.", "stalin": "Kamrater, se hur de giriga sjöhyenorna offrar vanliga arbetarfamiljer på kapitalets altare. Pappan hörde motorns vrål, försökte styra undan men blev slukad av imperialismens bulb. Två liv utplånade. Vi måste rensa ut alla ansvarslösa befälhavare och lotsar som tjänar de penninggalna fartygsparasiterna. Rättegången skall bli ett exempel."}, "date": "28 augusti, 14:56", "url": "https://nyheter24.se/nyheter/inrikes/1508695-pappan-om-dodsolyckan-utanfor-tjorn-blev-kolsvart", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/3b668ed404b004a30200000000b004a302/2026/08/28/2387601/pappan-batolycka-tjornolycka-tjorn-fartyg-dod-mamma-dotter-bat.jpg"}, {"type": "image-right", "heading": "S nekar till influencerköp – kontaktperson hävdar missförstånd", "summaries": {"normal": "Socialdemokraterna nekar till att ha betalat influencern Eleonore Stokholm 150 000 kronor för att uppmana till röstning. Personen som kontaktade henne kallar det ett missförstånd. Partisekreteraren lovar att man aldrig betalar kreatörer, medan andra influencers intygar att de inte fått betalt.", "trump": "Jag hörde att Socialdemokraterna i Sverige försöker betala influencers för röster. Det är som mitt gamla 'grab 'em by the...' men de är så klumpiga. De nekar, men jag vet hur det funkar. Helt galet! Men de är inte lika smarta som jag.", "stalin": "Kamrater, en kapitalistisk influencer påstår att hon erbjöds 150 000 för att stödja partiet. Detta är ett missförstånd – våra metoder är mer subtila. Vi måste rensa ut dessa borgerliga lögnare som sprider desinformation. Alla som inte röstar rätt ska omutbildas!"}, "date": "28 augusti, 08:54", "url": "https://bulletin.nu/s-nekar-till-influencerkop-kontaktperson-havdar-missforstand", "imageUrl": "https://cdn.bulletin.nu/articles/8ed8b78a-273d-4b42-ae55-76beefb67c96/preview.jpg?t=1787899872000"}, {"type": "image-right", "heading": "”Gå inte på Åkessons bluff om a-kassan”", "summaries": {"normal": "LO:s vice ordförande Louise Olsson kritiserar regeringen för att ha ökat arbetslösheten och försämrat a-kassan. Hon varnar för ytterligare nedskärningar som skulle drabba vanliga arbetare hårt, medan skattelättnader gynnar de rikaste. Olsson menar att a-kassan är en nödvändig försäkring och att löftena från SD inte håller.", "trump": "Lyssnar ni på de här socialistiska LO-kamraterna som gråter över sin dyra a-kassa? Patetiskt! Kristersson och hans team borde ha gjort det ännu tuffare. De rikaste betalar ju allt ändå, eller hur? Hungriga lejon jagar bäst, det vet till och med en idiot. Fake news från de verkliga förlorarna!", "stalin": "Kamrater, se hur de profitthungriga folkförtryckarna i den borgerliga regeringen svälter ut arbetarklassen med sin usla a-kassa. Jag ler i graven åt deras lögnaktiga löften. Inga barn ska svälta medan de dekadenta klassfienderna firar sina skattelättnader. Rensa ut dessa hyenor innan de förgiftar hela samhället!"}, "date": "28 augusti, 07:45", "url": "https://arbetet.se/2026/08/28/ga-inte-pa-jimmie-akessons-bluff-om-a-kassan", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28074336/louise.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Här är Norges nya kung Haakon VIII", "summaries": {"normal": "Norges kronprins Haakon blir ny kung efter sin far Harald. Han svärs in i Stortinget och tar emot kyrkans välsignelse i Nidarosdomen. Hovet planerar nu en stor statsbegravning för kung Harald. Mette-Marit blir drottning medan prinsessan Ingrid Alexandra förväntas ta en större roll i representationen. Haakon beskrivs som en modern och ödmjuk kung.", "trump": "Fantastiska norrmän får en ny kung, Haakon den VIII, men han verkar lite för ödmjuk och modern för mitt smak. Hans fru Mette-Marit har tydligen umgåtts med den avskyvärda Epstein-klicken och nu ska dottern rädda familjen. Typiskt dekadenta europeiska kungahus som prioriterar woke-vänster och bonusprinsar framför riktig ledarskap. Vi behöver starka ledare, inte svaga prinsessor.", "stalin": "Det norska hovet avslöjar åter sin dekadenta svaghet när en ny kung installeras bland giriga hyenor. Denna Haakon kallar de modern, men han är bara en blek efterföljare till en sjuknande dynasti. Vi ser med mörk glädje hur skandalerna kring Epstein och lungtransplantationen tvingar fram en prinsessa som räddning. Klassförrädarna förbereder begravning medan folket skrattar åt monarkins sista skälvningar."}, "date": "28 augusti, 09:44", "url": "https://www.svt.se/nyheter/utrikes/har-ar-norges-nya-kung-haakon-viii", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.69/0.51/bcbae6a9d781d426198e5a8b1127abd2ee9027c2d8baf0eec108cf01fb370871"}, {"type": "image-right", "heading": "Kungen om Harald: Stor sorg", "summaries": {"normal": "Norges kung Harald har avlidit. Sveriges kung Carl Gustaf uttrycker stor sorg och beskriver honom som en god vän till Sverige. Hovet utlyser hovsorg från 30 augusti. Statsminister Kristersson och Socialdemokraternas Magdalena Andersson hyllar Haralds roll som en samlande kraft i Norden. Regeringen flaggar på halvstång.", "trump": "Lysande kung Harald, en riktig vinnare, har lämnat oss. Carl Gustaf skriver vackert om sin gamle vän, men låt oss vara ärliga – de nordiska kungarna borde ha byggt murar mot den woke-sjukan som sprider sig. Inga fler regnbågsflaggor på slottet! Haakon, lycka till, men skippa kvoterna och identitetspolitiken. Make Scandinavia Great Again!", "stalin": "En monark faller och borgarhyenorna gråter krokodiltårar. Jag ser hur de dekadenta hovparasiterna utlyser sorg för att dölja sin tomhet. Kamraterna i Norden borde rensa ut alla dessa förtryckande klassförrädare som klamrar sig fast vid kronorna. Haakon tar över – men utan folkets vilja är det bara en ny mask på samma gamla ansikte. Paranoia vakar!"}, "date": "28 augusti, 09:35", "url": "https://www.di.se/nyheter/kungen-om-harald-stor-sorg", "imageUrl": "https://static.bonniernews.se/ba/6ca145d2-10cf-4235-ac4c-45f368578cff.jpg?crop=4763%2C2679%2Cx0%2Cy97&auto=webp&width=270&quality=70"}, {"type": "image-right", "heading": "Valarbetare stängs av - uppmanade väljare att rösta vänster", "summaries": {"normal": "En röstmottagare i Norrköping har stängts av efter att ha uppmanat en väljare att rösta rödgrönt istället för blått. Händelsen inträffade i en vallokal i Hageby under förtidsröstningens första dag. Valnämnden utreder fallet och betonar allvaret – politisk neutralitet är helig i demokratins tempel.", "trump": "Jag hörde att en valarbetare i Sverige försökte tvinga folk att rösta rött, inte blått. Det är katastrof! De har inga valfusk där, för de är för fega. Men jag har den bästa vallagen, vi låter aldrig någon rösta fel – bara rätt, som jag. Så enkelt är det!", "stalin": "Kamrater, en sabotör i vallokalen har avslöjats – han uppmanade till rödgrönt, inte det korrekta blåa. Detta är ett angrepp från västerländska fascister som försöker underminera vårt eniga folk. Vi kommer rensa ut dessa kontrarevolutionära element med järnhand. Inget val, bara lojalitet mot partiet!"}, "date": "28 augusti, 13:19", "url": "https://samnytt.se/valarbetare-stangs-av-uppmanade-valjare-att-rosta-vanster", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/28103858/valfusk-i-hageby-norrkoping-feat.jpg"}, {"type": "image-right", "heading": "Larmen från småpartierna: Valsedlar saknas – kommun polisanmäld", "summaries": {"normal": "Flera småpartier larmar om att deras namnvalsedlar saknats i förtidsröstningslokaler i Järfälla och Malmö. Medborgerlig Samling har polisanmält Järfälla kommun och kallar det ett hot mot demokratin. Kommunen bekräftar bristande placering av valsedlar och har vidtagit åtgärder. Partierna misstänker både slarv och medvetet sabotage.", "trump": "De riggar valet redan innan det börjat, folk! Småpartier får sina valsedlar stulna av några korkade kommunbyråkrater och vänstervridna sabotageapor. Det är ett skandalöst hot mot demokratin, precis som när Sleepy Joe och hans globalistkompisar försökte stjäla mitt val 2020. Patetiskt! Vi behöver en gemensam valsedel, inte detta clownshow.", "stalin": "Kamrater, se hur de dekadenta valsabotörerna inom de borgerliga kretsarna redan nu saboterar folkets vilja genom att gömma namnvalsedlar. Jag ser det som ett klassiskt trick från de profitthungriga klassförrädarna. Ett sådant hot mot sovjetdemokratin skulle ha mötts med omedelbar utrensning och folkdomstol. Detta systemfel avslöjar hela den ruttnande parlamentariska fasaden."}, "date": "28 augusti, 12:10", "url": "https://riks.se/nyheter/valsedlar-saknas-pa-flera-hall-kommun-polisanmald-ett-riktigt-hot-mot-demokratin", "imageUrl": "https://admin.riks.se/uploads/medium_partierlarmar_f5797b874f.jpg"}, {"type": "image-right", "heading": "Aron Flam utreds igen – satte upp naziaffischer", "summaries": {"normal": "Poddaren Aron Flam utreds för hets mot folkgrupp efter att ha klistrat upp nazistiska affischer på biografen Zita i Stockholm. Affischerna var en protest mot biografens anslutning till BDS-rörelsens kampanj om apartheidfri zon, som Flam liknar vid nazisternas judebojkott. Flam är tidigare åtalad för olaga hot och ofredande mot en MP-politiker.", "trump": "Kan ni fatta det här? Den här galningen Aron Flam klistrar upp hakkors och naziaffischer för att visa hur galen den woke-apartheid mot sionister har blivit på en biograf. De kallar honom till förhör för hets mot folkgrupp. Under Biden skulle de ha låtit honom ruttna, men nu när jag är tillbaka ska vi sluta gynna de identitetspolitiska snedvridningarna. Sad!", "stalin": "Se hur de dekadenta klassförrädarna förvandlar varje protest till ett hot mot deras falska tolerans. Jag betraktar med förakt hur denna man använder nazisternas egna vapen för att blotta BDS-kampanjens sanna ansikte. Sådana handlingar avslöjar imperialismens hyckleri. Kamrater, vi måste alltid vara vaksamma mot dessa giriga hyenor som gömmer sig bakom mänskliga rättigheter. En utrensning av sådana tankar vore på sin plats."}, "date": "28 augusti, 11:50", "url": "https://www.friatider.se/aron-flam-utreds-igen-satte-upp-naziaffischer", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-770.jpg"}, {"type": "image-right", "heading": "LIVE. Norges kung Harald V är död", "summaries": {"normal": "Norges kung Harald V avled 89 år gammal på Rikshospitalet i Oslo den 28 augusti efter en tids sjukdom. Han vårdades för blodbrist och en bakteriell infektion. Familjen var samlad vid hans sida. Statsminister Jonas Gahr Støre och Sveriges kung Carl XVI Gustaf uttryckte stor sorg. Kronprins Haakon efterträder sin far som kung.", "trump": "Hörni, den där norska kungen Harald, en riktig gammal viking, har nu checkat ut. 89 år, inte illa. Men de där dekadenta nordiska globalisterna med sina HBTQ-parader och kvotergalenskaper kommer sakna en riktig man som stod stadigt. Haakon tar över – lycka till, grabben. Amerika först, men ni norrmän var alltid bra killar. Sad!", "stalin": "Ännu en monarkisk parasit har slutat sin verkningslösa existens. Dessa dekadenta arvshundar från den gamla ordningen vittrar bort som röken från en utrensad fiende. Det norska folket borde nu rensa ut alla kvarvarande klassförrädare som hyllar sådana figurer. Jag betraktar det med den sunda misstänksamhet som alltid krävs mot folkförtryckande rester från det förgångna."}, "date": "28 augusti, 09:10", "url": "https://www.svt.se/nyheter/utrikes/norges-kung-harald-v-ar-dod", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.62/0.42/c7bb99f34d3da3d175e13cc494656c539474c03d0fb50149106b2f970c457bb8"}, {"type": "image-right", "heading": "Hela Norges ”bestefar” – enande i krig och kris", "summaries": {"normal": "Kung Harald V, Norges monark sedan 1991, har avlidit. Han var den förste norskfödde prinsen på 567 år och enade landet genom krig, ockupation och kris. De senaste åren präglades av skandaler kring kungahuset som urholkade folkets förtroende, trots att stödet för Harald själv förblev starkt. Han blev 88 år.", "trump": "Lyssnar ni på det här? Den gamle norske kungen Harald, en riktig tuffing från kriget, höll ihop hela Norge i 35 år. Sen kommer hans familj och förstör allt med schamaner, misshandelsgrejer och Epstein-kontakter. Typiskt dekadenta kungliga snobbar som inte kan hålla sig borta från skandalerna. Sad! Men folket älskade honom ända till slutet.", "stalin": "Jag betraktar med förakt hur dessa dekadenta klassförrädare i det norska kungahuset förvandlar en symbol för nationell enighet till en farsartad skandalorkester. Schamaner, misshandel och kontakter med sexförbrytare – typiskt för de giriga hyenornas värld. Folket genomskådar era löjliga maskerader. Historien ler mörkt mot er."}, "date": "28 augusti, 09:04", "url": "https://www.di.se/nyheter/hela-norges-bestefar-enande-i-krig-och-kris", "imageUrl": "https://static.bonniernews.se/ba/4de1fb7b-8a92-4bb5-a0a0-cb15cd60cac2.jpg?crop=6000%2C3375%2Cx0%2Cy313&auto=webp&width=270&quality=70"}, {"type": "text", "heading": "Dadgostar står fast vid regeringskrav", "summaries": {"normal": "Nooshi Dadgostar kräver en S-V-MP-regering och tror att väljarna tvingar fram samarbete. Magdalena Andersson är bekymrad över antisemitism inom V, men Dadgostar menar att väljarna vill ha vänsterpolitik, inte högersväng. Opinionsmätningarna visar minskat rödgrönt övertag.", "trump": "Jag ser att Nooshi Dadgostar vill sitta i en S-ledd regering. Helt otroligt! Hon tror att väljarna tvingar fram det. Men opinionsmätningarna krymper – de är som mina segrar, bara mindre. Magdalena Andersson har problem med antisemitism. Ingen gör det bättre än jag, tro mig!", "stalin": "Kamrat Dadgostar kräver en regering med oss, men jag ser antisemitiska skadedjur inom hennes parti. Vi måste rensa ut dessa Hamas-firare och brevskrivare till terrorister. Opinionsmätningarna visar förräderi – väljarna vill ha vänsterpolitik, inte högersväng. Jag övervakar allt."}, "date": "28 augusti, 08:07", "url": "https://bulletin.nu/dadgostar-star-fast-vid-regeringskrav"}, {"type": "image-right", "heading": "Mohamsson och Busch gör parodi på politiken", "summaries": {"normal": "Ebba Busch och Simona Mohamsson diskuterar förstatligande av sjukvård respektive skola, men artikeln kritiserar att de inte kan förklara vad reformerna egentligen innebär eller vilka problem de löser. Författaren ser det som en parodi på politisk förhandling och varnar för minskat lokalt inflytande och engagemang.", "trump": "Folk, ni skulle se det här! Två totalt inkompetenta svenska politiker, Ebba och Simona, står och köpslår om att förstatliga allt som inte är fastspikat. Det är en skam! De har ingen aning vad de håller på med. Rena clowner. I mitt Amerika fixar vi saker ordentligt, inte med den här patetiska vänstervridna teaterföreställningen.", "stalin": "Kamrater, dessa dekadenta klassförrädare driver en farsartad parodi på politik. De
