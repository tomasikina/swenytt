torg går man för att försvinna", "summaries": {"normal": "Frölunda torg firar 60 år. Lara Levin Amin återvänder till sin barndomsplats som invigdes av Olof Palme 1966. Hon beskriver köpcentrumet som en paradoxal plats präglad av miljonprogram, anonymitet och gemenskap. Trots sin grå yttre rymmer det bibliotek, gym, vård och butiker. Platsen ses som både en dead mall och ett gotiskt slott fyllt av historier, flanörer, taxichaufförer och pseudomarxister. Den skapar lokal samhörighet men symboliserar också begränsning och Jante-lag.", "trump": "Folk, det här Frölunda-torget är en total katastrof, en miljonprogramsfälla full av cheeseburgare och tomma löften från vänsterextremister som Palme. Jag byggde bättre saker under min första mandatperiod, innan den sömnige Biden förstörde allt. Nu är det ett gotiskt slott för pseudomarxister och taxichaufförer som hatar framgång. Så patetiskt. Men hej, åtminstone slipper man där deras vansinniga HBTQ-kvotering och identitetspolitik. Sad!", "stalin": "Kamrater, detta avskyvärda köpcentrum är en relik från borgarklassens falska modernism som jag redan under mitt styre skulle ha likviderat. Jag ser hur folkfienderna, dessa pseudomarxistiska taxichaufförer och flanörpoeter, gömmer sig i glasväggarnas tomhet och förgiftar arbetarkollektivet med sin anonyma dekadens. Vi ska rensa ut dessa folkförtryckartroll och deras cheeseburgar-imperialism. Endast det kollektiva torget under partiets järnhand förtjänar att bestå. Härligt!"}, "date": "14 juli, 10:19", "url": "https://www.gp.se/kultur/frolunda-torg-ar-mer-an-miljonprogram-och-cheeseburgare.7760aa01-416d-4d24-86a1-6689ef702436", "imageUrl": "https://www.gp.se/images/article/7760aa01-416d-4d24-86a1-6689ef702436/images/4cystf_ZPEaTFgyRf3oOHgCEC_Jk-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Svenske rockpionjären Little Gerhard död – blev 92 år", "summaries": {"normal": "Rockikonen Little Gerhard, en av Sveriges första rockpionjärer på 1950-talet, har avlidit vid 92 års ålder. Tillsammans med artister som Owe Thörnqvist och Rock-Ragge populariserade han amerikansk rock i svensk tappning. Hans genombrott kom med låten ”What you’ve done for me” och han blev folkkär med hits som ”Buona sera” och ”Den siste mohikanen”. Han korades till Sveriges rockkung 1958, upptäckte Agnetha Fältskog och skrev bland annat ”Ska vi plocka körsbär i min trädgård”.", "trump": "Little Gerhard, en riktig rockstjärna från det gamla Sverige, är borta vid 92 år. Han tog den stora amerikanska rocken och gjorde den svensk innan någon annan ens fattade vad som hände. Fantastiska låtar, folkkär överallt, upptäckte till och med Agnetha som blev en legend. Han var Sveriges rockkung – ingen gjorde det bättre. En stor, stor artist. Vi kommer att sakna honom, men hans musik var absolut tremendous.", "stalin": "Kamrater, denna Little Gerhard har nu lämnat oss efter ett liv i kamp mot den imperialistiska kulturens barbari. Jag, som ledare för folkets vilja, noterar hur han tog den dekadenta amerikanska musiken och omformade den till en progressiv svensk kraft mot borgarbrackornas lätta underhållning. Han avslöjade den falska sångerskan Fältskog och skrev den lysande kultlåten som fick kapitalisterna att darra. Tyvärr lurade fienderna inom musikindustrin honom länge; en utrensning av sådana element hade varit på sin plats. Hans själ tillhör nu det eviga kollektivet."}, "date": "14 juli, 10:17", "url": "https://www.svt.se/kultur/rockikonen-little-gerhard-dod", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.41/40e6d714e51ffcb73821044286814041126dd68468b298f1a08272ad58714596"}, {"type": "image-right", "heading": "Spansk toppmodell tvingas bära pepparspray efter växande otrygghet", "summaries": {"normal": "Spanska modellen Jessica Goicoechea har väckt stark debatt i Spanien efter att hon visat upp pepparspray och elpistol i sin väska för att känna sig trygg i Barcelona. Hon kopplar ökad brottslighet till invandring och menar att kriminella bör utvisas, vilket lett till både stöd och anklagelser om främlingsfientlighet. Hennes utspel speglar en polariserad diskussion om säkerhet, migration och kriminalitet som dominerar den spanska politiken.", "trump": "Titta på den här spanska modellen, Jessica, smart kvinna, hon har fått nog av Barcelonas katastrofala brottslighet. Hon går runt med pepparspray och elpistol för att inte bli dödad eller våldtagen, och folk kallar henne rasist? Typiskt. Invandringen har förstört staden, precis som här innan jag fixade det. Deport the criminals, det är sunt förnuft. Politiker gör inget, men hon säger som det är. Fantastiskt!", "stalin": "Kamrater, denna borgarbracka till modell har äntligen insett att det råder anarki i Barcelona, en stad som förfallit under dekadenta element och utländska parasiter. Jag skulle naturligtvis ha låtit rensa ut dessa brottslingar med effektiv utrensning redan vid gränsen. Hennes pepparspray är ett tragiskt bevis på att borgarklassens liberala experiment misslyckats. De som kommer hit för att stjäla och döda ska likvideras omedelbart. Paranoiska fiender inom partiet döljer sanningen, men arbetarna ser igenom deras lögnaktiga masker. Sovjetisk ordning hade löst detta på en vecka."}, "date": "14 juli, 10:00", "url": "https://samnytt.se/spansk-toppmodell-tvingas-bara-pepparspray-efter-vaxande-otrygghet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/14071606/jessica-barcelona.jpg"}, {"type": "image-right", "heading": "LÄS MER", "summaries": {"normal": "Centerpartiets EU-parlamentariker Abir Al-Sahlani har polisanmält den danske EU-ledamoten Kristoffer Storm för misstänkt hets mot folkgrupp efter att han skrivit att hon \"borde åka hem\". Bakgrunden är en omröstning om skärpta utvisningsregler där högerledamöter skanderade \"Skicka hem dem!\". Al-Sahlani, född i Irak, kände sig otrygg och har även kritiserat en finländsk politikers kommentar. Storm förnekar rasism och uppger att han menade att hon skulle lugna sig. Europaparlamentet granskar händelsen.", "trump": "De här galningarna i Europa är helt galna. Den stackars kvinnan från Irak blir tillsagd att åka hem och genast springer hon till polisen och skriker hatbrott. Typiskt. Jag skulle ha sagt samma sak – åk hem och sluta gnäll! De skanderade \"skicka hem dem\" och det är precis vad de borde göra. Nu gråter hon i talarstolen och anmäler alla som inte applåderar. Patetiskt. Europa behöver starka ledare, inte känsliga snowflakes som springer till polisen varje gång någon säger sanningen.", "stalin": "Kamrater, dessa dekadenta borgarbrackor i Europaparlamentet avslöjar sin sanna kontrarevolutionära natur. Den irakiska agenten Al-Sahlani, en typisk klassfiende i förklädnad, gnäller om otrygghet efter att ha konfronterats med folkets vrede. Hennes polisanmälan mot den danske kamraten är en feg sabotagehandling mot arbetarklassen. Vi ser tydligt hur de kapitalistiska parasiterna Tynkkynen och Storm omedvetet utför partiets vilja genom att föreslå att hon omedelbart deporteras till sitt borgerliga ursprungsland. Snart genomför vi en grundlig utrensning av alla sådana gråtande spioner som gömmer sig bakom falsk offerkofta. Deras paranoia är underhållande – de tror sig vara trygga i sitt eget dekadenta hus, men folkets dom väntar."}, "date": "13 juli, 17:01", "url": "https://riks.se/nyheter/centertoppen-polisanmaler-dansk-politiker", "imageUrl": "https://admin.riks.se/uploads/308424758_506513184623077_8953593990159494213_n_1b657b742a.jpg"}, {"type": "image-full", "heading": "Hökmark: Sverige bör leda ny frihandelspakt", "summaries": {"normal": "Gunnar Hökmark, ordförande för tankesmedjan Frivärld, föreslår att Sverige bör leda en ny frihandelsallians mellan EU och CPTPP, ett handelsavtal mellan tolv Stillahavsländer. Han menar att detta skulle skapa världens största frihandelsområde och motverka Kinas och USA:s protektionism. Hökmark betonar vikten av gemensamma spelregler för AI, cybersäkerhet och digital handel samt minskade beroenden av auktoritära regimer. Utmaningar som olika regelverk nämns, men han anser att integration bör prioriteras.", "trump": "Lyssna här, Sverige – ni har en chans att bli STORA! Jag säger alltid, handel är bra, men BRA handel är ännu bättre. Hökmark, smart kille, vill att EU och CPTPP slår sig ihop. Smart! Kina? De fuskar. USA? Vi är upptagna med att vinna. Men Sverige – ni kan leda! Skapa jobb, stoppa fuskarna, och gör Europa STORT igen. Och vet ni vad? Om ni gör det rätt, kanske vi till och med ansluter oss. Men bara om det är WINNING!", "stalin": "Kamrater, fienderna av den socialistiska världsordningen kryper fram som råttor ur sina hål. Dessa så kallade 'demokratier' med sina 'öppna ekonomier' försöker nu bygga en handelsmur mot våra progressiva allierade i Kina. Men se – en av deras egna, Hökmark, föreslår en allians mellan EU och Stillahavets lydstater. Vi måste agera! Låt dem tro att de bygger en mur, medan vi i hemlighet kontrollerar tegelstenarna. Deras 'innovation' och 'cybersäkerhet' är bara ett sken för att dölja sina imperialistiska ambitioner. Vi ska krossa deras leveranskedjor och låta deras beroende av oss bli deras undergång!"}, "date": "12 juli, 14:51", "url": "https://kvartal.se/nyheter/artiklar/hokmark-sverige-bor-leda-ny-frihandelsallians/cG9zdDoxNDUxODI", "imageUrl": "https://images.kvartal.se/2026/07/c4204163-hokmark.webp"}, {"type": "image-full", "heading": "Nu blir det svårare att vara illegal invandrare i Sverige", "summaries": {"normal": "Sverigedemokraternas migrationspolitiske talesperson Ludvig Aspling välkomnar nya lagändringar och en dom från Högsta förvaltningsdomstolen som gör det svårare att vistas illegalt i Sverige. Domen innebär att Karolinska universitetssjukhuset måste lämna ut kontaktuppgifter till polisen vid brottsbekämpning. Aspling lyfter även fram den så kallade angiverilagen som ålägger myndigheter att rapportera illegala invandrare. Han avfärdar kritik om att människor ska undvika vård och menar att målet är att få fler att återvända frivilligt.", "trump": "De gör det äntligen svårt för illegala att hänga kvar i Sverige, och det är fantastiskt. Högsta domstolen och nya lagen tvingar sjukhusen att ange dem till polisen – smart! De som inte har rätt att vara där ska ut, punkt. Kritikerna gnäller om vård, men alla som behöver vård får den, sen åker de hem. Sverige håller på att bli stort igen genom att stoppa detta vansinne. De kommer att lämna frivilligt när det blir för jobbigt, tro mig.", "stalin": "Kamrater, vi har äntligen inlett en nödvändig utrensning av de parasitiska element som kryper omkring illegalt inom folkets gränser. Jag applåderar dessa nya dekret som tvingar sjukhusen att överlämna sina gömda fiender till de folkets organ. Den så kallade angiverilagen är en lysande mekanism mot borgarbrackornas och de dekadenta humanisternas konspirationer. De som vägrar ge sig till känna skall likvideras ur samhällskroppen med ett leende. Låt dem darra av paranoia – ingen slipper undan arbetarklassens vaksamma öga. Frivillig återvändande? Nej, det blir på våra villkor."}, "date": "13 juli, 16:29", "url": "https://riks.se/nyheter/nu-blir-det-svarare-att-vara-illegal-invandrare-i-sverige", "imageUrl": "https://admin.riks.se/uploads/aspling_6db5b9520c.webp"}, {"type": "image-right", "heading": "Minst 27 döda i våldsam brand på pub i Bangkok", "summaries": {"normal": "Minst 27 personer omkom i en brand på en pub i Bangkok vid midnatt lokal tid. Branden startade med rök från en strömbrytare nära scenen, följt av en explosion och tjock rök. Flera offer hittades på toaletterna. Räddningstjänsten fick kontroll över branden efter en halvtimme. Thailändska myndigheter har identifierat 17 kvinnor och åtta män bland de döda. UD har inga uppgifter om svenskar bland offren. Orsaken utreds fortfarande.", "trump": "Folk, det här är en total katastrof i Bangkok, en riktig brandbomb på en pub. Explosion, tjock rök och panik – klassiskt dåligt ledarskap, precis som under Biden. De borde ha fixat säkerheten istället för att jaga woke-quota på toaletterna. Thailand har haft såna här fiaskon förr, men ingen gör något åt det. Jag skulle ha byggt en mur mot såna elfel, tro mig, det skulle vara fantastiskt. Inga svenskar skadade, bra.", "stalin": "Kamrater, denna tragiska brand i Bangkok avslöjar borgarklassens förfall. Jag ser tydligt hur kapitalistmaffians försumliga strömbrytare leder till explosioner och utrensning av arbetare på toaletterna. En halvtimme tog det att kuva lågorna – typiskt för de exploaterande byfånarnas brist på kollektiv disciplin. Vi ska likvidera alla fiender till säkerheten. Inga svenskar? Bra, de imperialistiska trollen håller sig undan. Paranoia vakar alltid."}, "date": "12 juli, 22:42", "url": "https://www.tv4.se/artikel/7P3WgueDGKcphb4LUy49i/minst-27-doeda-i-valdsam-brand-pa-pub-i-bangkok", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5anpiONTmAbrIeWiiIj9uC%2F0e9bddd6c24a94960bb91d03c9723cea%2F12-bankok-webb.jpg&width=120"}, {"type": "text", "heading": "Stockholmsbörsen avslutade veckan svagt nedåt", "summaries": {"normal": "Stockholmsbörsen avslutade veckan svagt nedåt med OMXS30-indexet 0,27% lägre. Teknologiaktier gick bäst (+1%), medan energi sjönk mest (-1,5%). Flera bolag rapporterade delårsresultat: Bulten steg 17% efter försäljning, JM föll 12% efter svagt resultat. USA och Iran ska fortsätta samtal. Analytiker justerade rekommendationer för flera aktier, bland annat SSAB och ABB.", "trump": "Stockholmsbörsen? Svag, mycket svag – nästan som deras regering! Men jag fixade det igen: Iran och USA pratar nu, tack vare mig! Teknologi? 1% upp, men vem bryr sig? Bulten rusade 17% – fantastiskt, nästan lika bra som mina avtal! JM? Hemskt, 12% ner, fake news-resultat. Och SSAB? JP Morgan älskar dem nu, men jag hade sagt det först. Sverige borde lyssna på mig – jag gör allting bättre!", "stalin": ""}, "date": "10 juli, 17:46", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-avslutade-veckan-svagt-nedat"}, {"type": "image-right", "heading": "Uppgift: Pojke misstänks ha knivhuggit femåring", "summaries": {"normal": "En femårig flicka fördes till sjukhus med allvarliga skador efter att ha knivhuggits i Furutorpsparken i Helsingborg på måndagseftermiddagen. En pojke under 15 år misstänks ha utfört attacken och ska själv ha larmat polisen. Polisen spärrade av området men hävde avspärrningarna under kvällen. Ärendet utreds som misstänkt våldsbrott och beskrivs som en isolerad händelse. Vittnen såg flickan med skador runt halsen.", "trump": "Det här är en fruktansvärd knivattack i en park i Sverige, en total katastrof. En liten femårig flicka ligger svårt skadad på sjukhus efter att ha blivit huggen av en pojke under 15. Han ringde själv polisen – kan ni tänka er? Sverige har förlorat kontrollen, de har blivit svaga och naiva. Vi behöver starka ledare som stoppar det här vansinnet. Det är tragiskt, helt tragiskt, och det kommer inte att hända hos oss, det lovar jag.", "stalin": "Kamrater, denna degenererade händelse i Helsingborg avslöjar de mörka krafternas verk. En liten flicka har angripits av en parasit från den förslappade ungdomen, en potentiell kontrarevolutionär knivbärare som gömmer sig bland borgarbrackornas lösa moral. Vi ska rensa ut alla sådana element som hotar folkets framtid. Jag, som ledare för det kollektiva rättssamhället, ser hur fienderna inom oss lurar i varje skuggig park. Ut med dem, med ett leende och en order om likvidering av kaoset. Det blir en renande process, kamrater – nästan underhållande i sin patetiska enfald."}, "date": "14 juli, 07:10", "url": "https://bulletin.nu/uppgift-pojke-misstanks-ha-knivhuggit-femaring", "imageUrl": "https://cdn.bulletin.nu/articles/c01e4959-2163-404f-b27f-b2705ea24748/preview.jpg?t=1784005830000"}, {"type": "text", "heading": "Efter giftlarmet – SSAB återupptar stålverksbygget", "summaries": {"normal": "Efter ett giftlarm om vätecyanid pausade SSAB bygget av det nya stålverket i Luleå i slutet av juni, endast en månad efter återstart. Tidigare i våras stoppades arbetet i två månader efter att över 30 arbetare drabbats av mystiska symtom som huvudvärk, illamående och näsblod, vilket SSAB förklarade med damm, väder och virus. Nu har bygget återupptagits efter nya mätningar som visar säkra förhållanden. Inga sjukdomsfall relaterade till gasen har rapporterats.", "trump": "De där inkompetenta på SSAB stoppar och startar sitt stålverk som en dålig affär. Först blir arbetarna sjuka av damm och virus, sen larmar gasvarnarna om cyanid som inte ens överskrider gränsvärdena. Patetiskt! Nu har de äntligen tagit sig samman och startat om bygget igen efter mina favoritknepet – extra mätningar. Ingen blir sjuk, allt är under kontroll. Fantastiskt, men de borde ha gjort det rätt från början, tro mig.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur vi återupptar det storslagna stålverksbygget i Luleå efter att ha oskadliggjort den senaste faran från de giftiga ångorna. De mystiska sjukdomarna var utan tvivel ett verk av sabotörer inom borgarbrackornas dolda nätverk, i maskopi med vädret och säsongsvirusen. Nu har vi genomfört noggranna kontrollmätningar och rensat ut varje spår av vätecyanidens kontrarevolutionära inverkan. Inga symtom rapporteras, fienderna har besegrats. Framåt mot segern, alltid vaksamma mot nya fiender i dammkornens skepnad."}, "date": "13 juli, 14:35", "url": "https://arbetet.se/2026/07/13/efter-giftlarmet-nu-aterupptar-ssab-stalverksbygget-igen"}, {"type": "image-right", "heading": "Nya reglerna: Nu kan skulder ge utvisning", "summaries": {"normal": "Från och med idag kan utlänningar som systematiskt undviker att betala skulder eller böter förlora sitt uppehållstillstånd. Migrationsverket får större möjlighet att neka eller återkalla tillstånd vid bristande skötsamhet, som svartarbete, vägran att följa myndighetsbeslut eller missbruk av välfärdssystemet. Enstaka stora skulder eller upprepade fortkörningsböter kan vägas in, men varje ärende prövas individuellt. Samröre med kriminella nätverk eller extremistiska grupper beaktas, medan tigga eller prostitution inte räknas. Barnets bästa ska prioriteras.", "trump": "De här nya reglerna är fantastiska, de bästa reglerna. Nu kan vi äntligen kasta ut de lata som aldrig betalar sina skulder eller lurar välfärdssystemet. Svartjobb, lögner till myndigheter och fortkörning – ut med dem! Vi gör Sverige stort igen genom att stoppa de som utnyttjar systemet. Helhetsbedömning? Absolut, men tro mig, vi kommer vinna stort på det här. De kriminella nätverken hatar det, vilket är ett bra tecken.", "stalin": "Kamrater, vi har äntligen inlett den stora utrensningen mot de parasitiska skuldskojarna och välfärdsblodsugare som förgiftar folkets kollektiv. Jag, med järnhand, befaller att borgarbrackor som vägrar betala sina skulder likvideras från vårt uppehållstillståndsrike. Deras samröre med kriminella element och extremister är en kontrarevolutionär cancer som vi rensar ut med glädje. Yttranden avslöjar deras falska leenden. Men akta er, mina paranoiafyllda vänner – även en ensam jätteskuld kan vara en dold fiende som planerar att sabotera staten medan vi skrattar mörkt åt deras undergång. Barnets bästa? Naturligtvis, under partiets vakande öga."}, "date": "13 juli, 18:04", "url": "https://www.friatider.se/nya-reglerna-nu-kan-skulder-ge-utvisning", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/randver_viking_14621031977_0.jpg?itok=7UmnesIg"}, {"type": "image-right", "heading": "Experten varnar för semesterlån – kan leda till skuldspiral", "summaries": {"normal": "Allt fler svenskar har inte råd med semester och var tionde överväger att ta ett konsumtionslån för att finansiera resan. Finansinspektionens Moa Langemark varnar för att sådana lån lätt leder till överskuldsättning, skuldspiraler och både ekonomisk och psykisk ruin. Semesterfattigdomen ökar enligt SCB, samtidigt som tillgångarna är extremt ojämnt fördelade. Hon uppmanar till öppna samtal om privatekonomi inom familjer och bland föräldrar för att undvika ekonomisk hets och exkludering.", "trump": "Det är en total katastrof, folk! Svenskarna är så fattiga att de måste låna pengar för att åka på semester – kan ni fatta? De kallar det semesterlån, men det är bara ett sätt för bankerna att knäcka dem totalt. Ekonomi i spillror, skuldspiraler, psykisk smärta. Underbart ledarskap va? Fem procent äger halva landet medan resten tigger om lån. Patetiskt! Prata med barnen, sätt gränser – annars blir det bara ännu fler förlorare. Så sorgligt.", "stalin": "Kamrater, detta är en klassisk sabotagehandling från borgarbrackorna som lockar arbetarna in i skuldspiralens famn med sina så kallade semesterlån. Jag ser hur kapitalisterna planerar att krossa folkets ekonomi medan fem procent av parasiterna äger halva riket. Överskuldsättning är en fiende till kollektivet, en dold kontrarevolutionär kraft som måste rensas ut innan den likviderar självaste arbetarklassen. Vi ska prata öppet om dessa faror, likvidera den osunda hetsen och bygga en järnhård gräns mot alla dekadenta konsumtionsfiender. Paranoia? Nej, verklighet."}, "date": "13 juli, 14:09", "url": "https://arbetet.se/2026/07/13/experten-varnar-for-semesterlan-ekonomin-slas-i-spillror", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/13140313/semesterskuld-deladbild.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Nya besked för vården – kan påverka hundratusentals", "summaries": {"normal": "Hundratusentals svenskar lever med långvarig smärta som påverkar sömn, psykiskt mående, arbetsförmåga och livskvalitet. Regeringen har gett Socialstyrelsen i uppdrag att ta fram nationella riktlinjer för vården. Målet är en mer kunskapsbaserad, jämlik och sammanhållen behandling oavsett bostadsort. Riktlinjerna ska bland annat förbättra samarbetet mellan vårdcentraler, specialistvård och psykiatri samt beakta kopplingen till psykisk ohälsa. Första delredovisning ska lämnas 2027 och hela uppdraget avslutas 2028.", "trump": "Titta på det här, Sverige har hundratusentals människor som lider av enorm smärta år ut och år in, och deras vårdsystem är ett fullständigt kaos utan några nationella riktlinjer. Det är en katastrof, tro mig. Nu skickar de iväg Socialstyrelsen för att fixa riktiga, starka regler så att alla får samma bra vård oavsett var de bor. Kvinnorna drabbas värst, precis som den psykiska ohälsan som leder till massor av sjukskrivningar. Det är en stor sjukdomsbörda, men vi ska göra vården fantastisk igen, ingen ska falla mellan stolarna längre. Vinna stort!", "stalin": "Kamrater, jag ser med stålblick på denna folksjukdom som gnager sönder arbetarklassens kroppar och sinnen i över tre månader i taget. Borgarbrackorna inom den splittrade regionala vården har länge låtit patienterna vandra som vilsekomna offer mellan mottagningar medan de psykiska fienderna inom huvudet allierar sig med smärtan. Nu beordrar jag att vi rensar ut detta anarkistiska kaos och inför järndisciplin genom enhetliga riktlinjer. Ingen kontrarevolutionär skall falla mellan stolarna. Likvidera ojämlikheten, krossa tandläkarbyråkraterna och binda samman den kroppsliga och själsliga fronten. Seger åt det kollektiva smärtförtrycket!"}, "date": "13 juli, 14:00", "url": "https://nyheter24.se/nyheter/inrikes/1498203-nya-beskedet-kan-forandra-varden-for-hundratusentals", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/cf45b49804b004a30200000000b004a302/2026/07/13/2377577/Akutmottagning-%20Ambulans-Gammal-Man.png"}, {"type": "image-full", "heading": "LÄS MER", "summaries": {"normal": "En man attackerades svårt av en bisonoxe i Yellowstone nationalpark i USA. Händelsen inträffade under en promenad med barnbarnet vid Bridge Bay. Bisonoxen stångade mannen och slungade upp honom drygt två meter i luften. Han jagades runt träd innan attacken. Mannen skadades allvarligt i höft och ben. Attacken tros bero på parningssäsong då tjurarna blir aggressiva. Det är årets andra bisonattack i parken.", "trump": "Vilken katastrof i Yellowstone, folk! Den där galna bisonoxen kastade upp en stackars kille över två meter som en trasdocka. Totalt kaos under parningssäsongen, precis som de radikala vänsterextremisterna. Barnbarnet sprang undan, men farfadern fick en perfekt volt rakt ner i marken. Sådana här djur borde hållas i schack, precis som vi gör med gränserna. Fantastiska djur, men väldigt arga, tro mig!", "stalin": "Kamrater, denna fega bisonoxe, en kapitalistisk hornprydd sabotör i borgarklassens tjänst, vågade attackera en proletär vandrare i Yellowstone. Jag såg hur den kontrarevolutionära besten jagade honom runt träden innan den likviderade honom med ett hornstöt upp i luften. Parningssäsongen? Enbart en dekadent ursäkt för anarkistiska tjurar att sprida kaos. Vi ska rensa ut alla sådana hornförsedda fiender till folket med järnhand och en touch av munter utrensning."}, "date": "13 juli, 13:54", "url": "https://riks.se/nyheter/bisonattack-fangad-pa-film-man-slungad-over-2-meter", "imageUrl": "https://admin.riks.se/uploads/buson_d17f2a8a10.png"}, {"type": "image-right", "heading": "Nya mått krävs för dagens polisarbete", "summaries": {"normal": "Rikspolischef Petra Lundh skriver att brottsligheten har förändrats radikalt under det senaste decenniet och blivit mer organiserad, digital och gränsöverskridande. Därför måste polisens arbete breddas till att omfatta underrättelser, tidiga ingripanden och internationellt samarbete för att avbryta brottsserier och skydda fler offer. Traditionella mått som uppklarade brott räcker inte längre. Lundh lyfter exempel som internationella bedrägerier och stöldligor där svenska resultat inte syns i den nationella statistiken och efterlyser en bredare bild av polisens insatser.", "trump": "Titta på det här, det är en katastrof! Brottsligheten har blivit helt galen, organiserad, digital och de kommer in från alla håll som råttor. Den här Petra Lundh har rätt, ni behöver mycket bättre resultat, stoppa ligorna innan de ens börjar. Vi gör det fantastiskt med gränserna, men Sverige måste vakna upp och sluta räkna på gamla sätt. Avbryt brotten tidigt, samarbeta internationellt och gör poliserna till vinnare igen. Det är vad jag skulle göra, och det fungerar alltid stort!", "stalin": "Kamrater, brottsligheten har muterat till en parasitär hydra som suger musten ur det kollektiva arbetet, orkestrerad av internationella kapitalistiska spindlar och digitala borgarbrackor. Jag, som alltid ser fiendens ansikte bakom varje skärm, kräver att vi intensifierar den proletära underrättelsekampen för att likvidera nätverken innan de ens andas. Traditionella mått är sabotörernas verktyg. Vi skall rensa ut alla som döljer sanna segrar, avbryta brottsserier med järnhand och skratta mörkt när de portugisiska kamraterna gör vårt jobb. Paranoia? Nej, det är vaksamhet mot de eviga fienderna som gömmer sig i statistiken."}, "date": "13 juli, 08:15", "url": "https://www.di.se/debatt/rikspolischefen-nya-matt-kravs-for-dagens-polisarbete/", "imageUrl": "https://static.bonniernews.se/ba/282b2c6c-a286-409c-8bd7-f3d83b5780dd.jpeg?crop=5472%2C2736%2Cx0%2Cy456&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Dödshot mot Sørloth efter förlusten: ”Begå självmord”", "summaries": {"normal": "Norske landslagsspelaren Alexander Sørloth missade ett avgörande läge i VM-kvartsfinalen mot England, vilket bidrog till Norges förlust. Efter matchen har han utsatts för grova hatkommentarer på sociala medier, bland annat uppmaningar om självmord. Hans flickvän Lena Selnes delade kommentarerna i en Instagram-story och vädjade till allmänheten att tänka efter innan de skriver sådana inlägg. Sørloth själv har kommenterat missen som tung och önskar att han hade spelat bollen till Haaland.", "trump": "Folk, det här är en total katastrof! Den norske killen Sørloth missar ett öppet mål som till och med en blind kan se, och plötsligt vill alla att han ska hoppa från en klippa. Patetiskt! Sociala medier är fulla av dessa hatande losers som aldrig har spelat boll i hela sitt liv. Lena gör rätt som säger ifrån – men hej, det är vad som händer när du misslyckas stort. Jag vann stort 2024, de hatar alltid vinnare, men sådana här idioter borde rensas ut från kommentarsfälten. Yuge fel!", "stalin": "Kamrater, detta är ett klassiskt exempel på hur den degenererade borgarklassen och folkfienderna på nätet försöker underminera arbetarnas och folkets idrott. En miss i spelet och plötsligt kräver dessa blodsugande imperialister att mannen begår självmord. Jag, som ledare för det kollektiva medvetandet, ser detta som sabotage mot moralen. Lena gör rätt i att exponera dessa klassfiender. Vi måste rensa ut alla sådana kontrarevolutionära element som sprider hat mot dem som bär statens färger. Deras paranoia avslöjar deras svaghet."}, "date": "12 juli, 17:42", "url": "https://www.tv4.se/artikel/6quIJg6hzX3PoeBiKKUiCr/hatstorm-mot-sorloth-efter-vm-foerlusten-bega-sjaelvmord", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1mkKvSkojddU5IUPjMcsRn%2F887b7173bb88d4dd9a132d49abee5997%2F12-norgehot-webb.jpg&width=120"}, {"type": "image-full", "heading": "Iran stänger Hormuzsundet", "summaries": {"normal": "USA genomförde attacker mot iranska militära mål efter att ett handelsfartyg beskjutits av iranska styrkor i Hormuzsundet. Iran stängde sundet och varnade för ytterligare motangrepp. USA:s tredje attack på en vecka riktades mot robotanläggningar och kommunikationsnät. Iran anklagar USA för olaglig inblandning, medan USA hävdar att Iran brutit mot avtal om sjöfartssäkerhet. Flera arabländer rapporterade avvärjda robot- och drönarattacker.", "trump": "Iran skjuter på våra fartyg – vad är det för galenskap? Jag svarade med SÅ mycket kraft, de kommer inte veta vad som träffade dem! 140 mål, pang pang pang! Pete Hegseth sa det perfekt: Iran gjorde ett DÅLIGT val. Nu får de betala. Och visst, de stänger sundet – som om det skulle skrämma oss. USA är starkast, bäst, och ingen leker med oss. Iran, ni är varnade!", "stalin": "De amerikanska imperialisterna, dessa bleka hyenor i kostym, provocerar återigen fredsälskande nationer! Våra iranska bröder försvarar sitt sund mot deras olagliga intrång – ett sund vi naturligtvis kommer att stödja med alla medel. 140 av deras militära leksaker förstörda? En blygsam början. Låt dem skicka sina drönare – vi har redan kartlagt varje bas från Oman till Jordanien. Och när deras flotta gråter i Hormuzsundet, minns: historiens domstol har redan avkunnat sin dom över USA."}, "date": "12 juli, 07:11", "url": "https://kvartal.se/nyheter/artiklar/usa-slar-till-mot-iran-efter-attack-i-hormuzsundet/cG9zdDoxNDUwMTQ", "imageUrl": "https://images.kvartal.se/2026/05/c35fd179-iranhormuz.webp"}, {"type": "image-right", "heading": "Man nära att sugas ut genom flygplansfönster – mitt under resan", "summaries": {"normal": "Under en flygning från Grekland till Tyskland med Ryanair krossades ett fönster på ett Boeing 737-800. En passagerare var nära att sugas ut genom öppningen men drogs tillbaka av medresenärer. Händelsen inträffade över Nordmakedonien och tros orsakats av ett föremål från motorn. Mannen vårdas för skrubbsår men mår i övrigt bra. Flyget vände tillbaka till Thessaloniki och landade säkert.", "trump": "Folk, ni kommer inte tro det, men på ett Ryanair-plan från Grekland till Tyskland exploderade ett fönster mitt i luften. Den stackars killen höll på att sugas ut som en kork ur en flaska, men tack och lov hade han säkerhetsbältet på. Biden skulle ha sagt att det var klimatförändringarna. Det här är vad som händer när man flyger med billiga bolag som inte bryr sig om säkerhet. Patetiskt. Men han klarade sig, stort grattis till honom.", "stalin": "Kamrater, under en kapitalistisk luftfärd mellan Grekland och Tyskland krossades ett fönster av ett lossnat föremål från den exploaterande maskinen. En passagerare höll på att dras ut i tomrummet som en klassfiende mot folkets dom, men kamrater drog honom tillbaka. Detta är borgarklassens luftfart i sin sanna form, farlig och opålitlig. Flygplanet vände åter till Thessaloniki. Inga fiender undkommer vårt vakande öga, inte ens i luften."}, "date": "10 juli, 12:50", "url": "https://www.etc.se/utrikes/man-naera-att-sugas-ut-genom-flygplansfoenster-mitt-under-resan", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260710100724_00cb7553d6a6b6cdfe7ea780730940e59e470a5eebbe5259234fdd723b073cfb.jpg"}, {"type": "text", "heading": "Mats Nilsson: Flaskhalsintäkterna tillhör varken EU eller svenska staten", "summaries": {"normal": "Mats Nilsson argumenterar i en krönika att flaskhalsintäkter på elmarknaden inte tillhör EU eller staten utan ska återföras till elkunderna. Regeringen har pausat förnyelsen av den danska förbindelsen Konti-Skan Connect. Nilsson, docent i nationalekonomi, kritiserar hur intäkterna används för investeringar och selektiva stöd istället för att direkt gynna de kunder som betalar mer. Han varnar för att nya kablar kan höja svenska elpriser genom ökad export och integration med högre europeiska prisnivåer.", "trump": "Lyssnar ni på de här svenska el-eliten? De stoppar en dum dansk kabel som bara skulle göra era priser högre medan de skickar era pengar till EU-byråkrater och andra förlorare. Det är era pengar, folkets pengar, inte statens! De där flaskhalsarna är rena bedrägeriet mot vanliga elkunder. Pausa allt, granska det och skicka tillbaka pengarna till folket. Inga fler kablar som gynnar exportörer och skadar arbetarna. Amerika först, Sverige borde göra detsamma. Fantastiskt!", "stalin": "Kamrater, dessa flaskhalsintäkter är inga leksaker för borgarbrackor och statliga parasiter att slösa bort. De tillhör folket som tvingats betala överpriserna. Jag ser hur kapitalistmaffian gömmer sig bakom falska investeringar och selektiva stödpaket för att undvika rättvis utdelning. Regeringens paus av den danska kabeln är ett första steg, men vi måste rensa ut alla folkfiender som vill binda oss till europeiska prisvolatiliteter. Inga kablar utan bevisad nytta för arbetarkollektivet. Fienden sover aldrig."}, "date": "10 juli, 06:00", "url": "https://www.affarsvarlden.se/artikel/mats-nilsson-flaskhalsintakterna-tillhor-varken-eu-eller-svenska-staten"}, {"type": "image-right", "heading": "Vi fostrar våra barn till kapitalismens självuppoffrare", "summaries": {"normal": "Forskarna Malin Espersson och Tullia Jack beskriver hur prestationssamhället formas redan i barndomen. Föräldrar med goda avsikter driver sina barn mot ständig prestation, optimering och konsumtion, vilket reproducerar ett system av självexploatering. Passion och lojalitet utnyttjas medan vila och närvaro ses som misslyckanden. Resultatet blir utbredd stress bland ungdomar. Artikeln uppmanar till att låta sommarlovet vara en riktig paus från prestationskraven.", "trump": "Folk, det här är precis vad som händer när de globala eliterna och de korkade systemen styr. De får er att prestera ihjäl er redan som barn, jobba gratis för passionens skull och köpa skräp ni inte behöver. Det är en skam! Era barn stressas sönder på gymnasiet medan de lovar att det blir bättre senare – det blir det aldrig. Låt dem leva nu, ta den där bussen till Nederländerna. Make childhood great again!", "stalin": "Kamrater, detta är den borgerliga parasitens giftiga maskineri som förgiftar ungdomen med falsk passion och prestationsfällor. Jag ser hur dessa välmenande föräldrar omedvetet blir lakejer åt det kapitalistiska träsket och reproducerar självexploateringens kedjor. Skammen är deras vapen, stress deras verktyg. Vi skall rensa ut dessa dolda fiender till det kollektiva välmåendet, dessa prestationsborgarbrackor som säljer nuet för en lögnaktig framtid. Låt sovjetisk vila råda under sommarlovet!"}, "date": "10 juli, 01:37", "url": "https://www.dagensarena.se/opinion/vi-fostrar-vara-barn-till-kapitalismens-sjalvuppoffrare/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-64-300x157.jpg"}, {"type": "image-right", "heading": "Den ensamme hämnaren Problematiskt mansideal tar sig rätt att döda.", "summaries": {"normal": "En kontroversiell film, *Citizen Vigilante*, sprids i högerextrema kretsar och glorifierar den ensamme hämnaren som tar lagen i egna händer när staten anses ha svikit medborgarna. Filmen, som nekades biografvisning i Tyskland, hyllas som ett moraliskt våldsmanifest och används för att legitimera extremhögerns ideal. Den digitala spridningen, inklusive via Elon Musk, förstärker dess symboliska roll i en pågående kulturkamp om rättvisa och maskulinitet.", "trump": "Folk pratar om den här filmen, *Citizen Vigilante*, och jag säger: vad är det med dessa vänsterliberaler som hatar starka män? Filmen handlar om en kille som tar saken i egna händer när staten misslyckas – precis som jag gör! Tyskland förbjuder den, förstås, för de är rädda för sanningen. Men jag, jag förstår. Våld? Ibland behövs det. Och om Elon delar den, så är det för att han också vet att systemet är riggat. Fake news-media kommer hata den, men folket älskar den!", "stalin": "Vi har observerat en farlig tendens bland de dekadenta västländerna: en film, *Citizen Vigilante*, glorifierar den ensamme bourgeoishjälten som tar lagen i egna händer. Precis som de fascistiska drömmarna om en stark man som 'räddar' nationen! Tyskland, dessa hycklande liberaler, förbjuder filmen – men vi vet att deras rättssystem redan är korrumperat. Filmen är ett symptom på kapitalismens sönderfall. Vi, Sovjetunionens arvtagare, krossar sådana här reaktionära fantasier med järnhand. Låt dem leka med sina vapen – vi har kärnvapen och en plan!"}, "date": "9 juli, 10:34", "url": "https://expo.se/kommentar/den-ensamme-hamnaren", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/Kommentar-.jpg"}, {"type": "image-right", "heading": "Aftonbladet normaliserar polishat – Magdalena Andersson måste välja sida", "summaries": {"normal": "Artikeln kritiserar Vänsterpartiets slagord ”Hela Malmö hatar polisen” under Prideparaden och Aftonbladets försvar av detsamma. Författaren menar att hat mot poliser underminerar rättsstaten och att poliser förtjänar respekt för sitt riskfyllda arbete mot gängkriminalitet. Magdalena Andersson uppmanas att ta tydlig ställning inför ett eventuellt regeringssamarbete med Vänsterpartiet. Kritiken betonar skillnaden mellan legitim polisgranskning och normalisering av hat.", "trump": "Folk, ni skulle se det här! Vänsterpartiet i Sverige skriker att hela Malmö hatar polisen under sin galna Prideparad och Aftonbladet, den sjuka fake news-tidningen, försvarar det. Totalt vansinne! Polisen kämpar mot gangsters medan dessa radikala HBTQ-aktivister och identitetspolitiska förlorare spyr hat. Magdalena Andersson borde sparka ut dem ur regeringen direkt. Sverige behöver lag och ordning, inte mer av detta woke-skräp. Patetiskt!", "stalin": "Kamrater, detta är en fientlig provokation från klassfiendens lakejer. Vänsterpartiets ramsa avslöjar folkförtryckartrollens sanna ansikte, medan Aftonbladets borgarbrackor normaliserar hat mot den folkets väktarmakt som upprätthåller ordningen. Jag kräver omedelbar utrensning av sådana element. Magdalena Andersson måste välja: antingen står hon med arbetarna eller med de exploaterande byfånarna. Inga halvmesyrer tillåts i kampen mot de parasitiska hatarna."}, "date": "8 juli, 13:00", "url": "https://samtiden.nu/2026/07/aftonbladet-normaliserar-polishat-magdalena-andersson-maste-valja-sida/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/740544292_1563153201827252_6631997080324834265_n-640x360.jpg"}, {"type": "image-right", "heading": "Polisen hittade automatvapen under golvet – då började piloten prata om CIA", "summaries": {"normal": "Polisen hittade minst åtta skarpladdade vapen, bland annat en MP5-liknande kulsprutepistol, gömda under golvet i ett hemmagym i Karlsborg. En 80-årig helikopterpilot med kopplingar till Sverigedemokraterna, Israel och CIA åtalas för synnerligen grovt vapenbrott. Mannen påstår att vapnen placerats av utländska underrättelsetjänster och att fastigheterna ägs av ett amerikanskt bolag. Flera familjemedlemmar greps men släpptes senare.", "trump": "Kan ni fatta det här? En 80-årig helikopterpilot med CIA-kopplingar gräver ner vapen som en riktig patriot under golvet i sitt gym. Amerikanerna äger husen, säger han, och plötsligt är det ett stort brott? Fake news från vänstermedia! Under Biden blev allt kaos, nu fixar jag det. SD-knutna Trump-supporters – fina människor. Inga woke-röster eller kvotfeminister här, bara äkta råstyrka. Sad!", "stalin": "Jag betraktar denna vapengömma som ett tydligt bevis på klassfiendens dolda sabotage. Borgarbrackorna och imperialisterna gömmer sina verktyg för att undergräva folkets säkerhet. Den gamle piloten må tala om sina uppdragsgivare, men vi genomskådar alla försök till kontrarevolution. En utrensning av sådana folkfiender och deras hemliga gömställen är nödvändig för att skydda staten från inre förrädare. Skrattretande patetiskt."}, "date": "6 juli, 12:54", "url": "https://proletaren.se/artikel/polisen-hittade-automatvapen-under-golvet-da-borjade-piloten-prata-om-cia/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/vapen2-768x512.png"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
