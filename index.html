mat=webp,quality=75/https://cdn01.nyheter24.se/69e6fdab04b004a30200000000b004a302/2026/06/12/2370545/mobilmarkerealme.jpg"}, {"type": "image-right", "heading": "Ny mordutredning i gruvhålsafghanens gruvhål", "summaries": {"normal": "Polisen har inlett en ny mordutredning vid det gruvhål i Norberg där den så kallade gruvhålsafghanen Taher Amini 2022 lämnade en våldtagen kvinna att dö. Platsen har spärrats av och ärendet hanteras av polisens kalla fall-grupp. Amini avtjänar livstids fängelse för grov våldtäkt och mordförsök efter att ha knuffat ner kvinnan 24 meter och kastat tegelstenar på henne. Hon överlevde efter att ha legat skadad i hålet i ett dygn.", "trump": "Folk, ni kommer inte att tro det här, men i Sverige har de nu öppnat en ny mordutredning i samma gruvhål där den där afghanen kastade ner en kvinna. Livstid fick han, men nu gräver de igen. Det är ett totalt misslyckande för deras system, en katastrof. De släpper in alla möjliga och sen undrar de varför brotten exploderar. Jag skulle ha stängt gränserna direkt, ingen skulle ha kommit in. Sådant här händer inte hos oss längre.", "stalin": "Kamrater, jag har nu beordrat en fullständig utredning av detta föraktliga sabotage i det norbergska gruvhålet. Den degenererade elementet som knuffade en sovjetvänlig kvinna ner i avgrunden och sedan stenade henne som en usel borgarbracka har redan fått sitt straff, men fiendens tentakler sträcker sig djupt. Vi skall rensa ut alla parasiter som döljer sig bland arbetarna. Paranoia? Nej, det är bara sund vaksamhet mot de dolda kapitalistiska stenarna som fortfarande faller från himlen."}, "date": "12 juni, 12:50", "url": "https://www.friatider.se/ny-mordutredning-i-gruvhalsafghanens-gruvhal", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-334.jpg"}, {"type": "image-right", "heading": "Trump: Har ”avslutat kriget”", "summaries": {"normal": "USA:s president Donald Trump uppgav att ett samförståndsavtal med Iran är på gång och att han har avslutat kriget mellan länderna. Iran bekräftar inte uppgifterna utan meddelar att de stoppat ett tankfartyg i Hormuzsundet. Explosioner hördes utanför staden Sirik. Trump varnade för ny attack men avblåste den med hänvisning till pågående diskussioner. Irans utrikesdepartement säger att inget slutgiltigt beslut om avtal har tagits.", "trump": "Folk, tro mig, jag har avslutat kriget med Iran totalt, det var en katastrof under Sleepy Joe men nu är vi på väg mot ett fantastiskt samförståndsavtal. Iran försöker spela tufft med båtar i sundet, men de vet att jag menar business. Jag blåste av attacken för att vi pratar, inte som de svaga globalisterna och HBTQ-kvotarna i Europa som älskar att ge efter för terrorister. Winning bigly!", "stalin": "Kamrater, jag har likviderat hotet från de imperialistiska blodsugarna i Washington genom att tvinga fram ett samförståndsavtal som krossar deras krigsplaner. Irans stoppande av det kapitalistiska tankfartyget i sundet är en seger för folket mot klassfiendens exploaterande byfånar. Explosionerna är bara början på utrensningen av folkförtryckartrollen. Inga kompromisser med borgarbrackorna – partiet segrar alltid."}, "date": "12 juni, 16:23", "url": "https://www.tv4.se/artikel/tt-260612-iranoro1-68443c4f/trump-har-avslutat-kriget", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdl3dGGv8X4cOY%2F7557e8acfc1d544ac65733f5021f67b1%2FUSA_s_president_Donald_Trump_uppgav_pa_torsdagen__aterigen__att_ett_samforstandsavtal_mellan_USA_och_Iran_ar_pa_gang._&width=1024"}, {"type": "image-right", "heading": "Här är Sveriges bästa och sämsta sjukhus när du ska föda barn", "summaries": {"normal": "En artikel i Dagens ETC granskar svenska förlossningsvård utifrån patienternas egna betyg. Mälarsjukhuset i Eskilstuna får sämst resultat där tolv procent ger bottenbetyg, jämfört med fyra procent vid bästa sjukhuset i Eksjö. Två kvinnor berättar om bristande bemötande, beslut som fattas utan samtycke, journalfel och en orosanmälan som ledde till stor stress. Samtidigt vittnar andra om positiv vård och vill nyansera bilden.", "trump": "Folk, ni skulle se det här – Sveriges sjukhus är en total katastrof! Mälarsjukhuset i Eskilstuna är en riktig förlustfabrik, värre än Bidens vårdsystem. Kvinnor föder barn och får höra att de ska köras över, sen kommer socialtjänsten som kommunister och tar över. Patetiskt! De bästa sjukhusen klarar det galant medan de usla drivs av inkompetens och woke-prioriteringar. Vi behöver starka ledare som fixar det här, inte mer misslyckande.", "stalin": "Kamrater, jag betraktar med djup misstro dessa rapporter om förlossningsvårdens fiasko vid Mälarsjukhuset. Klassfiendens vårdimperialister och byråkratiska blodsugare har återigen misslyckats med att möta arbetarkvinnornas behov. De likviderar förtroendet genom arroganta beslut och orosanmälningar som luktar folkfiendens paranoia. Vi, partiet och folket, kräver omedelbar utrensning av sådana sabotörer. Endast kollektivets järnhand kan säkerställa en sann socialistisk födelseprocess fri från borgarbrackornas sabotage."}, "date": "11 juni, 13:20", "url": "https://www.etc.se/inrikes/haer-aer-sveriges-baesta-och-saemsta-sjukhus-naer-du-ska-foeda-barn", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260611080632_043cc7960488c19c12449fb6f9bec25dd34b58bdb8c806ab149114f9aa6d5aca.jpg"}, {"type": "image-right", "heading": "Här tar Kanada sin första VM-poäng någonsin: ”Speciellt”", "summaries": {"normal": "Kanada tog sin första VM-poäng någonsin genom ett 1–1-kryss mot Bosnien-Hercegovina. Inhopparen Cyle Larin kvitterade bara två minuter efter att han bytts in. Bosnien ledde tidigt genom Jovo Lukic, men Kanada skapade flera farliga chanser i andra halvlek. Tre svenskbosnier spelade i den bosniska truppen, bland annat Armin Gigovic och Benjamin Tahirovic.", "trump": "Kanada, det är ett fantastiskt land, och de tog äntligen sin första VM-poäng någonsin. Den här Larin, han kom in i matchen och pang, kvitterade direkt. Två minuter, folk, det är otroligt. Bosnierna ledde men vi vet hur det går när man möter vinnare. Kanada spelade bättre i andra halvlek – det var vackert att se. En poäng är bättre än ingenting, tro mig.", "stalin": "Kamrater, detta dekadenta 1–1-resultat mot de bosniska revisionisterna är en skam för arbetarklassen. Jag, som ledare för det segrande folket, skulle ha likviderat den kapitalistiska inhopparen Larin omedelbart efter hans förräderi mot målet. Borgarbrackorna Kolasinac och Demirovic konspirerar mot oss med sina ribbskott och fräcka omställningar. Vi måste rensa ut alla svenskbosniska spioner ur truppen innan de förgiftar hela kollektivet med sin halvtaskiga defensiv. En poäng? Patetiskt sabotage mot historien."}, "date": "13 juni, 00:07", "url": "https://www.svt.se/sport/fotboll/kanada-kniper-forsta-vm-poangen-inhopparen-hjalte", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.27/0.4/7fe33d5fcbfcb34a48332d6df44176f1b112b36498703e269f373949f6056cba"}, {"type": "image-right", "heading": "Farväl till Atens mest rastlösa socialist", "summaries": {"normal": "Journalisten och aktivisten Nikos Servetas har avlidit i en hjärtinfarkt vid 66 års ålder. Han drev nyhetssajten Kamini och rapporterade för Flamman om korruption, tågolyckan i Tempi och gentrifiering i Exarchia. Servetas bodde tidigare i Sverige, arbetade bland annat för SVT och Sveriges Radio samt deltog i solidaritetsarbete för flyktingar. Han var känd för sitt starka engagemang och sin integritet inom vänsterjournalistiken.", "trump": "Lyssnade just på den här grekiska vänsterkillen som dog med hjärtat i bitar. Stackars Nikos, full av passion men ingen energi kvar. Typisk rastlös socialist som bar hela vänsterns problem på axlarna tills det kraschade. Precis som Biden-administrationen, totalt utmattad av sin egen inkompetens. Vi behöver inga fler sådana här brinnande ugnar, vi behöver vinnare. Vila i frid, men nästa gång satsa på riktig business istället för aktivism.", "stalin": "Kamrater, denna rastlösa vänstermänniska Nikos Servetas har slutat slå med sitt överhettade hjärta. Jag ser hur klassfiendens splittring och folkförtryckartrollens gentrifiering långsamt likviderade honom inifrån. Han bar arbetarklassens bördor som en sann kamrat, men borgarbrackornas korruption och falska imperialister i Exarchia sög musten ur honom. Vi tolererar inga sådana svagheter i kollektivet. En utrensning av hjärtat var oundviklig. Låt detta vara en läxa."}, "date": "11 juni, 14:24", "url": "https://www.flamman.se/farval-till-atens-mest-rastlosa-socialist/", "imageUrl": "https://media.flamman.se/wp-uploads/2024/10/aten-2-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Tolvåring utmålades som våldsam rasist – nu får hon rätt", "summaries": {"normal": "En tolvårig flicka i Dundee, Skottland, filmades med kniv och yxa under ett bråk med en vuxen man. Polisen, politikerna och medierna anklagade först flickorna och kallade det desinformation att de var offer. Nu har mannen, Ilia Belov, dömts för att ha attackerat flickan och hennes syster efter att ha fällt sexuella kommentarer mot dem. Hans syster har erkänt sin del i attacken. Domaren avfärdade mannens påstående om självförsvar. Flickornas mamma säger att ingen trodde på dem förrän nu.", "trump": "Titta på det här, det är en total skandal. En liten flicka i Skottland blir attackerad av en invandrare som säger hemska saker till henne, och vad gör polisen och politikerna? De attackerar flickan! De kallar det desinformation när sanningen kommer ut. Fake news och vänstermedia som vanligt. Nu har domstolen äntligen dömt den riktige förbrytaren. De borde ha lyssnat från början. Det är patetiskt, men så går det när de låtsas att verkligheten inte existerar. Sad!", "stalin": "Kamrater, detta är ett lysande exempel på hur borgarbrackorna och deras lakejer i polis och media medvetet försöker dölja klassfiendens perversa attacker mot våra framtida pionjärer. Jag ser direkt de dekadenta kapitalisternas klor i detta försök att smutskasta ett barn som tvingades försvara sig. Vi ska rensa ut dessa lögnare som sprider desinformation för att skydda sexuella degenererade element. Låt domaren vara ett exempel – ingen lämnar platsen när arbetets barn hotas. Paranoian hos dessa reaktionära element är verkligen underhållande att bevittna innan utrensningen."}, "date": "12 juni, 11:38", "url": "https://www.friatider.se/tolvaring-utmalades-som-valdsam-rasist-nu-far-hon-ratt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-333.jpg"}, {"type": "image-full", "heading": "Glädjebesked för alla som reser med flyg", "summaries": {"normal": "EU har enats om en ny flygöverenskommelse som stärker passagerarrättigheter. Flybolag får inte längre ta betalt för rättelse av stavfel på namn eller för att barn och föräldrar sitter tillsammans. Ersättningen vid förseningar förblir mellan 250 och 600 euro. Överenskommelsen väntas godkännas formellt av Europaparlamentet.", "trump": "Jag har varit med och handlat med EU om denna fantastiska flygöverenskommelse. Det är en enorm seger för passagerarna – inga onödiga avgifter för att barn ska få sitta tillsammans, och ersättningarna förblir höga. Vi har vunnit, tro mig. Det kommer att bli yuuuuuuuge för alla som reser. Vi har gjort det igen!", "stalin": "Partiet har segrat i kampen mot de borgerliga flygbolagens exploatering. Nu ska familjer och funktionshindrade resa utan skräck för extra kostnader. Ersättningarna är en statlig påminnelse om vår oövervinnliga makt. Parallellt med Putins expansionism i Ukraina, så utvidgar vi vår kontroll över himmelen. Fienden kommer att känna vårt korrekturer."}, "date": "12 juni, 22:36", "url": "https://www.gp.se/ekonomi/gladjebesked-for-alla-som-reser-med-flyg-eu-overens.f089e832-b926-4fe2-a872-df831a045873", "imageUrl": "https://www.gp.se/images/article/f089e832-b926-4fe2-a872-df831a045873/images/13AEZ3CYG2ktH-jRZDrEG_DzveqM-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Fotbolls-VM lämnar dålig eftersmak. Skandalerna överskuggar glädjen.", "summaries": {"normal": "Fotbolls-VM i USA och Mexiko inleds med 48 lag, men skandaler och politiska spänningar överskuggar glädjen. Artikeln kritiserar Trump-administrationens politik, höga biljettpriser, visumproblem för supportrar och domare samt korruption och våld i Mexiko. Trots att fotboll ses som folkets sport med gemenskap och glädje, lämnar evenemanget en bitter eftersmak på grund av arrangörernas brist på moral.", "trump": "Den här artikeln är en total katastrof, folk, tro mig. De hatar mig så mycket att de inte ens kan prata om fotboll utan att gnälla om mitt fredspris från Fifa, som var fantastiskt. Biljetterna är dyra för att evenemanget är det bästa någonsin, men de kommer inte sälja slut för att fake news skrämmer folk. Iran och alla andra förlorare får problem vid gränsen, det är vad som händer när man inte respekterar Amerika. VM kommer ändå bli en enorm succé, större än någonsin.", "stalin": "Kamrater, denna futtiga ledarskribent avslöjar med sin klagande text hur borgarbrackorna inom Fifa och deras lakejer i den dekadenta amerikanska imperialismen försöker maskera sin korrupta fest med arbetarklassens älskade fotboll. Jag ser hur de likviderar sanningen med dynamiska priser och visum som vapen mot folkets representanter. Vi ska rensa ut dessa parasitiska element som säljer biljetter medan mexikanska kamrater försvinner i kartellernas mörker. Paranoian är befogad, fienden sover aldrig under denna fars som hånar de sörjande massorna."}, "date": "12 juni, 07:02", "url": "https://arbetet.se/2026/06/12/fotbolls-vm-i-amerika-lamnar-dalig-eftersmak/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/12065846/fotboll-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Skandalernas valrörelse går i repris", "summaries": {"normal": "Artikeln drar paralleller mellan valrörelsen 1976, känd som skandalernas valrörelse, och dagens politiska situation inför 2026. Den lyfter fram skandaler kring Sverigedemokraterna som rattfylla, narkotikabrott och barnpornografimisstankar, samt oegentligheter med förmånsbeskattning, bokköp och bokbål. Även statsminister Ulf Kristerssons affärer granskas. Tillsammans målas en bild av maktmissbruk som urholkar förtroendet för politiker och demokratin.", "trump": "Folk, ni skulle se det här. Sverige håller på att explodera i skandaler precis som på sjuttiotalet, fast värre. De här SD-typerna med knark, barnporr och bokbål? Patetiskt. Och den där Kristersson med sina dyra mattor och hönshus – totalt korrupt. De gör vad de vill medan folket lider. Jag fixade Amerika, men Europa drunknar i identitetspolitik och svaga ledare. En katastrof, tro mig.", "stalin": "Kamrater, denna futtiga valrörelse avslöjar borgarbrackornas och folkfiendernas sanna ansikte. Pedofiler och skattefuskare gömmer sig bland dem som låtsas värna arbetarklassen. Vi ser hur klassfiendens lakejer bränner böcker och gömmer förmåner medan de predikar moral. En sådan parasitisk attityd kräver omedelbar utrensning. Endast genom kollektivets järnhand kan vi krossa dessa exploaterande byfånar och rädda folkets förtroende."}, "date": "11 juni, 13:11", "url": "https://www.flamman.se/skandalernas-valrorelse-gar-i-repris/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sdlbb8quujl1og-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Kortjättar går med på jättelik uppgörelse – kan förändra marknaden", "summaries": {"normal": "En amerikansk domstol har preliminärt godkänt en uppgörelse värd 38 miljarder dollar mellan Visa, Mastercard och miljontals handlare. Bolagen anklagas för för höga kortavgifter, så kallade swipe-avgifter. Om avtalet godkänns sänks avgifterna, vilket gynnar handlare men effekterna för konsumenter är osäkra. Handlare kan få större möjlighet att välja vilka kort de accepterar och ta ut extra avgifter. Branschorganisationer är kritiska då de anser att grundproblemen kvarstår.", "trump": "Lyssnar ni på det här? Visa och Mastercard, de riggade kortmaffian, har precis fått en jätteuppgörelse på 38 miljarder dollar som de försöker kalla för seger. Patetiskt! De har sugit blod ur de små handlarna i två decennier med sina galna avgifter. Nu kanske butikerna äntligen kan säga nej till de dyra bonuskorten som ingen behöver. Jag fixade bättre dealer som president än Biden någonsin gjorde. Amerika vinner igen, tro mig!", "stalin": "Kamrater, dessa blodsugrare inom kortimperiet har äntligen tvingats till en uppgörelse värd 38 miljarder dollar efter tjugo år av klassfiendens girighet. Vi ser hur borgarbrackorna i Visa och Mastercard länge exploaterat arbetande handlare med sina swipe-avgifter. Ändå ler jag mörkt åt att de så kallade reformerna inte rensar ut parasiterna. Handlare får nu välja sina egna kedjor – ett litet steg mot att krossa monopolen. Fienden sover aldrig."}, "date": "12 juni, 19:16", "url": "https://www.dagensps.se/bors-finans/kortjattar-gar-med-pa-jattelik-uppgorelse-kan-forandra-marknaden/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlspwqlcv3ea8-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Officiellt: Elon Musk är världens första dollarbiljonär", "summaries": {"normal": "SpaceX har börsnoterats på Nasdaq, vilket gjort Elon Musk till världens första biljonär. Med aktiekursernas rusning värderas hans ägande i SpaceX och Tesla nu till över 1,05 biljoner dollar. Noteringen är en av de största i modern tid och har även gjort tusentals anställda till miljonärer. Milstolpen väcker debatt om extrem förmögenhetskoncentration, då Musks rikedom nu överstiger BNP i många länder och är föremål för ständig förändring beroende på marknadens svängningar.", "trump": "Elon Musk har precis blivit världens första biljonär, en otrolig siffra! SpaceX på börsen? Fantastiskt. Många sa att det inte skulle gå, men jag visste det. Han är en vinnare, precis som jag. Vår ekonomi under min ledning gör att sådant händer. Musk har mer pengar än hela länder, det är enormt! Medan de radikala vänstermänniskorna gråter över klyftor, skapar vi jobb och välstånd. Det är en vacker dag för Amerika och för affärer. En enorm succé!", "stalin": "Denna Musk, en självutnämnd teknokratisk tsar, har nu samlat på sig en biljon dollar genom sin kapitalistiska lekstuga. Vilket obscent hån mot proletariatet! Han bygger leksaker för rymden medan vi i vår sfär, likt kamrat Putin, konsoliderar makten och förbereder oss för den oundvikliga konfrontationen med västvärldens dekadenta parasiter. Att tillåta en enskild individ att kontrollera mer kapital än hela nationer är ett brott mot förnuftet. Vi ser genom hans spel – han är bara en ny sorts nyttig idiot."}, "date": "12 juni, 18:52", "url": "https://www.realtid.se/bors-finans/officiellt-elon-musk-ar-varldens-forsta-dollarbiljonar/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlsy8txejxzdk-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Tyske arméchefen varnar för rysk attack före 2029", "summaries": {"normal": "Tysklands arméchef Christian Freuding varnar för att Ryssland kan attackera ett Natoland senast 2029, möjligen tidigare. Baserat på Natos underrättelser menar han att Ryssland återuppbygger sin militära styrka trots förluster i Ukraina. Freuding betonar att Europa måste stärka sin försvarsberedskap och produktionskapacitet för att möta hotet. Tyskland arbetar redan med att påskynda materielanskaffning och täppa till brister.", "trump": "Titta bara på vad som händer i Europa – totalt kaos! Tyska arméns chef säger att Ryssland kan attackera Nato före 2029. Jag sa ju hela tiden att Putin är en tuff kille, men Europa lyssnade inte. Nu måste de skynda sig, köpa mer vapen och sluta vara så naiva. Jag fixade USA:s försvar – Europa borde ta en sida ur min bok. Svagt ledarskap, svagt försvar!", "stalin": "Kamrater, fienden i väst skakar av rädsla inför den oundvikliga expansionen av vår rätta sfär! De tyska lakejerna i Nato ylar om att vi kan krossa deras svaga länkar före 2029 – som om det vore en överraskning. Deras arméchef, en ynklig byråkrat, gråter över förluster i Ukraina, men vi bygger redan nya arméer. Europa har två val: kapitulera eller se sina städer förvandlas till askhögar. Historia är på vår sida!"}, "date": "11 juni, 17:20", "url": "https://kvartal.se/nyheter/artiklar/tyske-armechefen-varnar-for-rysk-attack-fore-2029/cG9zdDoxMzAyMjk", "imageUrl": "https://images.kvartal.se/2026/06/a24033d9-bundeswehr.webp"}, {"type": "image-full", "heading": "16 kommuner kan få kärnkraft – bara 6 ger klartecken", "summaries": {"normal": "Endast sex av 16 kommuner som pekats ut som möjliga platser för ny kärnkraft har sagt ja till etablering, visar Dagens Industris kartläggning. Kommunerna Stenungsund, Svalöv, Varberg, Kävlinge, Oskarshamn och Östhammar ger klartecken. Sex kommuner har inte tagit ställning medan fyra uppvisar motstånd eller politisk oenighet. Lokala beslut kan därmed avgöra om nya reaktorer kan byggas, oavsett statens och företagens vilja.", "trump": "Det här är en total katastrof, folk. Bara sex av sexton kommuner säger ja till underbar, fantastisk kärnkraft. De andra är svaga, inkompetenta och hatar energi som är ren och stark. Lokala politiker tror de kan stoppa framtidens kraft – fel! Vi ska ha massor av kärnkraft, den bästa någonsin, och de som säger nej är bara förlorare som vill hålla Sverige svagt. Gör det stort igen!", "stalin": "Kamrater, jag ser med stigande vrede hur dessa borgarbrackor och kapitalistiska restelement i kommunerna saboterar det kollektiva framsteget mot en oövervinnerlig energiframtid. Endast sex kommuner visar sann partilinje medan de övriga kryper för reaktionära krafter och folkomröstningsspioner. Vi måste omedelbart rensa ut dessa kontrarevolutionära tveksamma element som gömmer sig bakom lokala beslut. Ingen motståndare mot folkets kärnkraft skall slippa undan den historiska utrensningen som väntar dem i skuggorna. Det blir både roligt och nödvändigt."}, "date": "12 juni, 15:37", "url": "https://riks.se/nyheter/16-kommuner-kan-fa-karnkraft-bara-6-ger-klartecken", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-12%2F4mhhfdm5%2Fkerinkraft.png"}, {"type": "image-full", "heading": "Pokémon Go-data används till militärdrönare", "summaries": {"normal": "Data från Pokémon Go-spelare har använts för att träna AI-system som kan hjälpa militära drönare att navigera utan GPS i krigszoner. Niantic samlade in skanningar via spelets Pokéstops efter 2021, material som senare användes för att utveckla tekniken. Företaget Niantic Spatial har samarbetat med Vantor som utvecklar drönarnavigering. Kritiker varnar för att spelarnas data utnyttjats för militära syften utan att de fullt ut förstod konsekvenserna.", "trump": "Kan ni fatta det här? De tog data från alla de stackars kidsen som sprang runt och fångade Pokémon och använde det för att bygga militärdrönare som flyger utan GPS. Fantastiskt, eller hur? Niantic tjänade miljarder på spelet och sen sålde de allt och nu ska det användas i krig. De läser ju aldrig villkoren, folket, det är patetiskt. Men vi ska ha den bästa tekniken, ingen ska slå oss, tro mig.", "stalin": "Kamrater, se hur borgarbrackorna vid Niantic lurade arbetarklassen med sina Pokémon-leksaker för att skaffa värdefull data till sina krigsdrönare. Dessa kapitalistiska parasitiska element tror sig kunna navigera utan vår socialistiska övervakning. Vi ska rensa ut alla dessa västspioner och imperialistiska algoritmer som gömmer sig i mobiltelefoner. Det är en mörk humor att barnens lek blir till fiendens vapen. Partiet vakar alltid, fienderna avslöjas och likvideras."}, "date": "12 juni, 15:36", "url": "https://riks.se/nyheter/pokemon-go-data-anvands-till-militardronare", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-12%2Fegqds0qw%2Fpokemon.png"}, {"type": "image-right", "heading": "Järfälla vill språktesta nyanställda i förskolan", "summaries": {"normal": "I Järfälla övervägs språktest för förskolepersonal innan anställning. Enligt ett förslag från det politiska styret ska testen börja användas till hösten, inledningsvis för bemanningsanställda. Utredningen pekar på språkets betydelse för barns utveckling. Modellen inspirerad av Botkyrka, där liknande test funnits i äldreomsorg och förskola.", "trump": "Som president vet jag att språkkunskaper är avgörande. I Järfälla gör de nu rätt genom att testa personal – det är viktigt för barnen. Vi måste se till att endast de bästa, som jag, får jobba med våra barn. Detta kommer att bli en enorm framgång, det är bara logiskt.", "stalin": "I den store staten är språket ett vapen för att forma det nya människosläktet. Genom att testa förskollärare i Järfälla ser vi till att endast de lojala får närma sig våra barns sinnen. Detta är en nödvändig åtgärd mot fiendens inflytande, som lurar i varje hörn. Vi måste vara vaksamma, för bara genom strikt kontroll kan vi uppnå det socialistiska idealet."}, "date": "12 juni, 18:01", "url": "https://bulletin.nu/jarfalla-vill-spraktesta-nyanstallda-i-forskolan", "imageUrl": "https://cdn.bulletin.nu/articles/fdc1c161-43b8-4029-a3ed-d096d946af59/preview.jpg?t=1781276085000"}, {"type": "image-full", "heading": "Skulle få utbildning till drömjobbet – stoppades av myndighetsmiss", "summaries": {"normal": "Nils antogs till en utbildning via Arbetsförmedlingen som skulle leda till fast jobb, men ett systemfel kastade ut honom ur systemet. Han missade kursstarten, fick ingen information och levde på osäker inkomst i två månader. Han har tappat förtroendet för myndigheten, som han upplever som alltmer automatiserad och opersonlig. Arbetsförmedlingen kallar det beklagligt och lovar intern uppföljning. Nils har nu ny start men hoppas på förbättringar.", "trump": "Det här är en total katastrof, folk. Den stackars killen Nils får ett fantastiskt erbjudande från Arbetsförmedlingen, ett drömjobb, och vad händer? Systemet, det riggade systemet, sparkar ut honom. Ingen ringer, ingen bryr sig. Typiskt för dessa inkompetenta byråkrater som behandlar folk som skräp. Han tappar förtroendet, och vem kan klandra honom? Det är en skam. Vi behöver smarta, effektiva myndigheter, inte det här kaoset. Sad!", "stalin": "Kamrater, detta är ett uppenbart sabotage mot arbetarklassen utfört av dolda fiender inom byråkratins skuggiga korridorer. Jag ser hur den opersonliga maskinen, denna kapitalistiska automat som likviderar människovärdet, kastar ut en ärlig arbetare ur systemet för att svälta honom i två månader. Inga samtal, bara tystnad från de parasitiska borgarbrackorna som gömmer sig bakom datorer. Vi måste omedelbart inleda en grundlig utrensning av dessa opålitliga element, dessa maskerade kontrarevolutionärer som förvandlar statens institution till en fiende till folket. Det är både tragiskt och löjeväckande hur de tror sig kunna undkomma mitt vakande öga."}, "date": "12 juni, 15:35", "url": "https://riks.se/nyheter/skulle-fa-utbildning-till-dromjobbet-stoppades-av-myndighetsmiss", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-04-29%2Fn1a1nuv8%2Farbetsformedlingen-fasadskylt1.jpg"}, {"type": "image-right", "heading": "Mysteriet på skattön: Polisen släpper fyra misstänkta för grovt fornminnesbrott", "summaries": {"normal": "Fyra personer som greps misstänkta för grovt fornminnesbrott på Mörkö har släppts på fri fot. Misstankarna kvarstår dock, meddelade åklagare Josefine Lundström. Brottet kopplas till samma ö där den stora Hörningsholmsskatten hittades 2025, den största myntskatten i Sverige som gav upphittarna rekordersättning på fyra miljoner kronor. Utredningen fortsätter med fler förhör och beslag, men ingen hålls frihetsberövad. Kopplingen till skatten är inte bekräftad.", "trump": "De grep fyra personer för det där fornminnesbrottet på Mörkö, men nu har de släppt alla. Totalt fiasko! Misstankarna finns kvar, men åklagaren verkar inte veta vad hon gör. Det handlar om en fantastisk skatt som gav miljoner, den största i Sverige någonsin. De borde ha löst det direkt, men det är typiskt – inkompetenta byråkrater som inte kan hantera stora fynd. Vi fortsätter granska, det kommer bli ypperligt!", "stalin": "Kamrater, jag har noga följt hur dessa degenererade skatteplundrare och borgarbrackor greps för sitt vidriga brott mot folkets historiska arv på Mörkö. Nu har de släppts ut som löss i en sovjetisk sovsal, men misstankarna lever vidare som en evig utrensning i mina tankar. Vi ska rensa ut dessa parasitiska fiender till kollektivet med deras smygande kapitalistiska metoder. Utredningen blir en storslagen seger mot de hemliga myntsamlande kontrarevolutionärerna – ingen undkommer partiets vakande öga, haha!"}, "date": "12 juni, 15:31", "url": "https://riks.se/nyheter/polisen-slapper-fyra-misstankta-for-grovt-fornminnesbrott", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-12%2Fk5hseh5j%2FH%C3%B6rningsholmsskatten-H%C3%B6ringsholmhoard.jpg"}, {"type": "image-full", "heading": "Ebola-utbrottet fortsätter att sprida sig i östra Kongo", "summaries": {"normal": "Ebola-utbrottet i östra Demokratiska republiken Kongo fortsätter att sprida sig. Drygt 700 fall har bekräftats och 136 personer har avlidit, med en dödlighet runt 20 procent för Bundibugyo-stammen. Nya fall upptäcks dagligen i nya områden, främst i Nord-Kivu. Det finns inget godkänt vaccin eller behandling. Kontaktspårningen har förbättrats till över 70 procent, men WHO varnar för att den verkliga omfattningen troligen är större på grund av befolkningens rörlighet.", "trump": "Det här ebola-utbrottet i Kongo är en total katastrof, folk dör som flugor och de har inte ens ett vaccin. Jag skulle ha fixat det på nolltid, tro mig. De hittar nya fall varje dag, det är kaos. Jag har alltid sagt att de borde ha bättre kontroll på gränserna och folk som springer runt. Vi har de bästa experterna, men det verkar som att ingen lyssnar. Patetiskt, men jag skulle ha stoppat det direkt.", "stalin": "Kamrater, detta ebolautbrott i östra Kongo är en fiende som lurar i skuggorna, ett imperialistiskt virus konstruerat av borgarbrackor och västerländska sabotörer för att försvaga de arbetande massorna. Jag, med partiets stålhand, befaller omedelbar utrensning av alla blinda fläckar och likvidering av de kapitalistiska bakterierna som smittar våra kollektiv. Vi ska stärka övervakningen och spåra varje kontrarevolutionär kontakt tills epidemins parasitiska tentakler krossas under proletariatets järnklack. Det är nästan underhållande hur dessa mikroskopiska förrädare tror sig kunna undkomma."}, "date": "12 juni, 15:26", "url": "https://riks.se/nyheter/ebola-utbrottet-fortsätter-att-sprida-sig-i-östra-kongo", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-12%2Ffie5t4kv%2FScreenshot-2026-06-12-at-14.59.26.png"}, {"type": "image-right", "heading": "Kräver krismöten efter tunnelbanekaoset: ”Helt oacceptabelt”", "summaries": {"normal": "Oppositionen i Region Stockholm, med Moderaternas Christofer Fjellner och Axel Conradi i spetsen, kräver krismöte med regionstyrelsens ordförande Aida Hadzialic (S) efter upprepade problem i tunnelbanan. Kritiken riktas mot inställda avgångar, signalfel och uppgifter om att problemen har mörkats. Resenärer vittnar om förseningar, långa promenader och ökad stress. Politiker uppmanas ta ansvar för att återställa förtroendet för kollektivtrafiken.", "trump": "Det här är en total katastrof, folk! Stockholms tunnelbana är en skam för hela Sverige, en riktig röra som de socialistiska misslyckandena under Hadzialic har skapat. De ljuger om hur illa det är, var fjärde avgång ute istället för var tionde – patetiskt! Stockholmare tvingas gå i värmen som under Biden-åren. Nu måste de vakna, ta ansvar och fixa det. Inga fler ursäkter från de misslyckade kvotpolitikerna, det är inte klokt!", "stalin": "Jag ser med fasa hur klassfiendens sabotörer inom Stockholms borgarbrackor och socialdemokratiska element har låtit tunnelbanan falla sönder i kaos. Signalfel och mörkläggning är typiska folkfiendernas verk, ett gift som underminerar arbetarkollektivets dagliga kamp. Hadzialic och hennes lakejer måste omedelbart ställas till svars inför partiet. Vi ska rensa ut dessa exploaterande byfånar och återställa ordningen med järnhand. Det är inte klokt att fienden får härja så länge."}, "date": "12 juni, 14:50", "url": "https://www.tv4.se/artikel/14xF0715gd9Z9gFlBseyxg/oppositionen-kraever-krismoeten-efter-tunnelbanekaoset", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1AzkeeDUy59crNjljPPdwf%2F1b9bb83560af31b652a0552ac50fa088%2F12-tbana-webb.jpg&width=120"}, {"type": "image-full", "heading": "\"5B\" närmar sig Sverige – läge att ta fram paraplyt", "summaries": {"normal": "Ett ovanligt 5B-lågtryck rör sig in över Sverige från öster och väntas ge ihållande och tidvis kraftigt regn, främst i Norrland och över södra Sverige under fredagen. Mellan regnområdena kan östra Svealand och delar av södra Norrland få perioder av sol, men moln och skurar hotar även där. SMHI har utfärdat en gul varning för höga flöden i övre Piteälven på grund av snösmältning och regn. Lågtrycket är svårt att prognostisera exakt.", "trump": "Det här låga trycket, det är en katastrof, folk. Kommer in från fel håll, från öster, och öser ner regn över Sverige som aldrig förr. Norrland drunknar, södern drunknar, men vissa delar får lite sol – underbara sol, bästa vädret. De kallar det 5B, som om det vore smart. Det är inte smart, det är en fälla. SMHI varnar för översvämningar, men tro mig, ingen gör väder bättre än jag. Det blir ostadigt, mycket ostadigt.", "stalin": "Kamrater, detta förrädiska 5B-lågtryck från de dekadenta Medelhavsområdena smyger sig in som en kapitalistisk spion över Sovjet-Sverige och sprider sin fuktiga sabotageverksamhet. Jag, ledaren för folkets väderkamp, konstaterar att det ihållande regnet är en kontrarevolutionär handling mot de arbetande massorna i Norrland. Vi ska rensa ut dessa molnfiender och likvidera de solbedragande borgarbrackorna i Svealand. Våra flöden i Piteälven kulminerar som en stor utrensning – mot vädrets sabotage! Härligt."}, "date": "12 juni, 12:28", "url": "https://nyheter24.se/nyheter/inrikes/1490957-5b-narmar-sig-sverige-lage-att-ta-fram-paraplyt", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/3a3885ff04b004a30200000000b004a302/2026/06/12/2370467/n-5b-kraftigt-regn-osregn-regnovader-regn-smhi-klart-sverige-norrland-vadret.jpg"}, {"type": "image-right", "heading": "Här är \"flyktingen\" som häktats för knivdådet i Belfast - fick uppehållstillstånd via snabbspår", "summaries": {"normal": "En knivattack i Belfast lämnade en man svårt skadad. Den misstänkte, den 30-årige sudanesen Hadi Alodid, hade fått asyl via ett snabbspår. Upplopp med våld mot poliser och minoriteter följde. Offrets familj avståndtog sig från våldet. Händelsen har återigen väckt frågor om migrationssystemet och kontrollen av gränser.", "trump": "Jag såg detta coming, folks. En våldsam outsider, beviljad asyl snabbt, orsakar kaos i Belfast. Vårt system måste vara starkare. Jag har alltid sagt: vi måste kontrollera våra gränser. Detta är en skandal, och jag fixar det. Vi kommer att göra Amerika och våra allierade säkrare igen!", "stalin": "I vårt suveräna statsskick har vi alltid förebyggt sådana element. Den här agenten för global imperialism, inrättad via snabbspår, visar varningstecken. Vi måste stärka partiets ledarskap och bekämpa dessa svekfulla krafter. Liknelsen med Putin är uppenbar – vi måste skydda vår renhet mot utländska infiltrationer."}, "date": "12 juni, 11:23", "url": "https://samnytt.se/har-ar-flyktingen-som-haktats-for-knivdadet-i-belfast-fick-uppehallstillstand-via-snabbspar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/12084118/belfast-upplopp.jpg"}, {"type": "image-right", "heading": "Skydda oss från monopolet. Hyresmarknadens parter: Akut behov att ta grepp om fjärrvärmemarknaden", "summaries": {"normal": "Fjärrvärmen är en lokal monopolmarknad där kunder saknar alternativ. En negativ spiral uppstår när kunder lämnar, volymer minskar och priserna stiger. Debattörerna pekar på Solör som ett bolag med extremt hög skuldsättning, stora räntekostnader och höga utdelningar trots stigande priser. Svenska pensionspengar via AP-fonderna är delägare. Författarna kräver starkare kundskydd, öppen diskussion om affärsmodeller samt tydligare ägarstyrning för att skydda både kunder och energisystemets robusthet.", "trump": "Det här är en total katastrof, folk. Monopol på värme, precis som de riggade marknaderna jag alltid varnar för. Solör lånar som galningar, köper upp allt med era pengar och skickar notan till vanliga svenskar. De höjer priserna mest, ger utdelning till sig själva medan kunderna flyr. Och era pensionspengar, AP-fonderna, finansierar det! Patetiskt. Politiker måste vakna, städa upp monopolen och stoppa bluffen innan hela systemet rasar. Ingen har sett sådana dåliga affärer som jag har.", "stalin": "Kamrater, jag ser med stigande vrede hur borgarbrackorna inom Solör med sina parasitiska skuldberg suger musten ur det kollektiva värmesystemet. Dessa kapitalistiska blodiglar lånar frenetiskt för att köpa upp nät, pumpar utdelningar till sig själva och tvingar hederliga arbetare att betala räntor som överstiger bränslekostnaderna. AP-fonderna, dessa förklädda monopolkapitalister, göder monstret med folkets pensionsmedel. En sådan kontrarevolutionär affärsmodell förtjänar snar utrensning. Vi skall likvidera dessa fiender till kollektivet, införa järnhårt kundskydd och krossa de parasitiska spekulanterna innan de förgiftar hela energifronten. Inga kompromisser med värmeförbrytarna!"}, "date": "12 juni, 10:32", "url": "https://www.di.se/debatt/systemfel-i-fjarrvarmen/", "imageUrl": "https://static.bonniernews.se/ba/ae81fa33-23fa-47bb-acab-80a5fd72d4ba.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "SD vill totalförbjuda slöja", "summaries": {"normal": "Sverigedemokraterna vill införa ett totalförbud mot slöja i Sverige, inte bara mot burka och niqab. Partiet anser att plaggen uttrycker en kvinnosyn som strider mot svenska värderingar om frihet och jämställdhet. SD:s talesperson Sara Gille kopplar plaggen till hedersförtryck och kvinnoförtryck. Hon menar att ett förbud inte strider mot religionsfriheten eftersom tron i sig inte förbjuds. Övriga Tidöpartier driver inte ett generellt slöjförbud.", "trump": "De smarta svenskarna i SD har äntligen vaknat och vill totalförbjuda slöjan. Fantastiskt! De här plaggen är ett totalt förtryck av kvinnor, det ser till och med jag på långt håll. Om du kommer till Sverige ska du anpassa dig eller flytta någon annanstans, så enkelt är det. De andra partierna är svaga, de vill bara utreda och snacka. SD gör det rätta, stort grattis till Sverige!", "stalin": "Kamrater, jag ser med djup tillfredsställelse hur dessa sverigedemokratiska vakter mot dekadens äntligen kräver utrensning av de slöjor som borgarbrackorna och reaktionära imamer använder för att förslava arbetarkvinnorna. Vi ska likvidera detta hedersförtryckande maskineri som underordnar kvinnan under mannens och kapitalets bojor. Den som vägrar anpassa sig till folkets vilja får lämna kollektivet. Religionsfrihet? Enbart för dem som inte konspirerar mot staten. De övriga partierna är fega opportunister som döljer sin svaghet bakom utredningar. Vi rensar ut fienderna, en efter en."}, "date": "12 juni, 10:28", "url": "https://www.friatider.se/sd-vill-totalforbjuda-sloja", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-331.jpg?itok=RBfyCzO5"}, {"type": "image-right", "heading": "Cellkamrater dödshotade brottsoffer – fångar blir kumpaner när de bor ihop", "summaries": {"normal": "Artikeln berättar hur Kriminalvården placerar fångar i delade celler på grund av platsbrist. En 18-åring sattes ihop med sin äldre brottspartner, vilket ledde till att de hotade brottsoffret via brev och dömdes för övergrepp i rättssak. Flera rymningsförsök har skett mellan cellkamrater. Justitieminister Gunnar Strömmer tonar ner riskerna, medan JO kritiserar bristen på uppföljning och matchning. Kriminalvården erkänner risker men skyller på ökad belastning efter lagändringar.", "trump": "Det här är en total katastrof, folk. De har så ont om plats i sina fängelser att de stoppar brottslingar i samma cell, en 18-åring med en gammal hårding, och vad händer? De skriver hotbrev till offret och begår nya brott! Rymningar med lakan och krossat glas överallt. Strömmer säger att det går att hantera, men det är löjligt. De borde ha egna celler, inte låta de värsta typerna planera tillsammans. Sverige behöver ordning och reda, inte det här vansinnet.", "stalin": "Jag ser med stigande vrede hur dessa dekadenta fängelsebyråkrater, dessa borgarbrackor i uniform, tvingar samman arbetets fiender och klassförrädare i samma celler på grund av sin egen inkompetens. En ung kamrat placeras bredvid en erfaren kontrarevolutionär, och genast smids nya brott mot folket. Vi måste rensa ut dessa fiender till ordningen, dessa glasbitssmugglare och lakanvävare som försöker fly undan rättvisan. Paranoiska element lurar överallt, till och med bakom låsta dörrar. Likvidera omedelbart den bristfälliga matchningen och återupprätta järndisciplin i varje cell. Det är folkets vilja."}, "date": "12 juni, 06:00", "url": "https://arbetet.se/2026/06/12/cellkamrater-dodshotade-brottsoffer-fangar-blir-kumpaner-nar-de-bor-ihop/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/11154853/del4-startbild.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Regeringens skogslag gynnar enbart skogsindustrin", "summaries": {"normal": "Klimatriksdagen kritiserar regeringens nya skogspolitik för att den prioriterar ökad tillväxt och produktion genom gödsling och främmande arter. Förslaget saknar långsiktigt perspektiv, riskanalys och hänsyn till biologisk mångfald, kolinbindning och ekosystemtjänster. Skogsstyrelsens tillsyn minskas medan skogsägare får större ansvar utan tillräckliga resurser. Kritikerna kräver övergång till naturnära skogsbruk, skydd av 20 procent av skogen, restaurering och fokus på långlivade produkter istället för kalhyggen.", "trump": "Folk, ni tror inte vad jag läser. Den här svenska regeringen vill gödsla skogarna och plantera konstiga träd för att producera mer och mer. Patetiskt! De ignorerar den riktiga mångfalden, klimatet och allt det där fina som skogen borde ge. De halverar kontrollen och låter odugliga ägare bestämma själva. Totalt misslyckande. Vi behöver starka, smarta skogar som binder kol på riktigt, inte de här svaga idéerna. Sverige borde lyssna på mig innan det är för sent. Sad!", "stalin": "Kamrater, denna proposition är en motbjudande sabotagehandling från borgarbrackor och skogsindustrins parasitiska lakejer. Jag ser hur de med sina giftiga gödningsplaner och främmande arter vill likvidera den biologiska mångfalden och sälja ut sovjet... nej, folkets skogar till kalhyggens rovdrift. Deras falska ekvationer och brist på riskanalys avslöjar klassfiendens paranoia inför arbetarnas krav på kolinbindning. Vi ska rensa ut dessa dekadenta element, skydda tjugo procent av skogen och genomföra en storslagen utrensning av kalhyggesmentaliteten. De som motarbetar folkets ekosystem kommer att möta historiska korrigeringar. Haha, deras träd kommer att gråta!"}, "date": "12 juni, 01:30", "url": "https://www.dagensarena.se/opinion/regeringens-skogslag-gynnar-enbart-skogsindustrin/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-44-300x157.jpg"}, {"type": "text", "heading": "Stockholmsbörsen steg – Vestum rusade efter miljardaffär", "summaries": {"normal": "Stockholmsbörsen steg 0,34 procent på torsdagen, drivet av stigande omvärldsbörsar. Energisektorn presterade bäst (+1,8%) medan fastigheter föll (-1,1%). Bland OMXS30-aktier steg Boliden (+2,4%) och Saab B (+2,1%), medan Hexagon B (-2,5%) och SCA B (-1,8%) föll. EQT säljer Beijer Ref till Melker Schörling, och Vestum säljer Flowa Technology för 6,5 miljarder. Camurus aktie föll efter FDA-besked.", "trump": "Jag har sagt det förut, världen är min arena! Medan jag handlar med Iran för att skydda våra intressen, ser jag hur Sveriges börs stiger – fantastiskt! EQT säljer Beijer Ref, det är en stor affär, mycket stor. Vestum säljer Flowa för 6,5 miljarder, det är en enorm transaktion. Iran hotar? Jag har de starkaste vapen, de kommer att böja sig. Börsen är på topp, precis som mitt förflutna!", "stalin": "Statens ekonomiska stabilitet är avgörande. Vi observerar att Stockholmsbörsen visar tecken på liv, med energi som driver framåt – en viktig sektor för statens resurser. Kapitalflödet mellan EQT och Beijer Ref, samt Vestums försäljning av Flowa, visar på den kapitalistiska girigheten som vi måste kontrollera. Liknelsen med Putins expansion i Ukraina är tydlig: vi måste skydda våra intressen mot dessa marknadsvåldtäkter. FDA:s besked mot Camurus är en påminnelse om att staten måste reglera all innovation."}, "date": "11 juni, 17:40", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-steg-vestum-rusade-efter-miljardaffar"}, {"type": "text", "heading": "Tidigare V-ledamot delar antisemitiskt inlägg – igen", "summaries": {"normal": "Tidigare Vänsterparti-ledamot Lorena Delgado Varas har återigen delat ett inlägg på Instagram som kritiseras som antisemitiskt. Bilden visade ett monster med hakkors, davidsstjärna och ordet 'kapitalism'. Judiska centralrådet reagerade skarpt. Delgado Varas uteslöts ur Vänsterpartiet förra året för liknande inlägg och sitter nu som politisk vilde i riksdagen. Hon har nyligen grundat partiet Framtidens vänster.", "trump": "Folk, vilken katastrof! En före detta svensk politiker, Lorena Delgado Varas, delar återigen antisemitiska bilder – hakkors, davidsstjärnor, hela skiten! Judarna är upprörda, och det borde de vara. Jag har alltid sagt: Sverige har stora problem, och det här är bara ett exempel. Hon blev sparkad från sitt parti, men sitter ändå kvar i riksdagen. Vilket land! USA skulle aldrig tolerera sånt här. SAD!", "stalin": "Kamrater! Ännu en fiende till folket avslöjad i det förrädiska Västerlandet. Denna Lorena Delgado Varas, en gång medlem av de falska 'vänster'-partierna, sprider nu gamla bourgeoisi-lögner om judar och kapitalism – precis som de imperialistiska hyenorna i USA och deras lakejer. Vi ser hur dessa element förgiftar arbetarklassens medvetande. Men låt dem inte glömma: historiens hjul krossar alla som står i vägen för folkets rättvisa. Och Putin? Han vet hur man hanterar sådana här maskar."}, "date": "11 juni, 15:37", "url": "https://kvartal.se/nyheter/artiklar/tidigare-v-ledamot-delar-antisemitiskt-inlagg-igen/cG9zdDoxMzAxMjM"}, {"type": "image-right", "heading": "Kamma er och skaffa ett plakat", "summaries": {"normal": "Dokumentären ”Strejkarna” följer Fridays for Future-aktivister från högstadiet till vuxen ålder under sju år. Artikeln pekar på att rörelsens största hinder inte är motståndare utan den passiva välviljan från politiker och allmänhet. Trots mycket hejarop uteblir konkret handling. Författaren uppmanar till personligt ansvar och aktivt engagemang istället för tomma sympatier, då klimatkrisen kräver handling bortom bekvämlighet.", "trump": "Folk, ni borde se den här så kallade dokumentären om de där Fridays for Future-barnen. De får massor av klapp på axeln av vänsterextremisterna men ingen gör ett dugg. Typiskt! Alla dessa woke-hippiekramare som Magdalena Andersson som säger ”jag står på er sida” – vad en patetisk förlorare. De vill ha plakat och möten men hatar det egentligen. Kamma er och gör något vettigt istället för att gnälla om klimatet medan Kina skrattar hela vägen till banken. Patetiskt!", "stalin": "Kamrater, denna dekadenta film blottar borgarklassens fega spel. De lovordar de unga aktivisterna med ihåliga hejarop medan de själva gömmer sig bakom bekvämlighetens murar. Inga utrensningar av lathet och individualism här – endast tomma ord. Jag ser klassfiendens psykologiska sabotage: de förvandlar plikt till wellness och skam till något förbjudet. Arbetarna måste mobiliseras, inte matas med lögner om roligt engagemang. Rensa ut de folkfiender som vägrar plakatets plikt. Revolutionen kräver handling, inte fnissande poddar."}, "date": "11 juni, 10:55", "url": "https://www.flamman.se/kamma-er-och-skaffa-ett-plakat/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/klimatkamp-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Debatt: Busch och Ohlsson vill inte göra Sverige mer jämställt", "summaries": {"normal": "Artikeln kritiserar Ebba Busch och Birgitta Ohlsson för att de talar varmt om jämställdhet utan att deras politik actually främjar den. En Novusundersökning visar att väljarna ser jämställdhet som en viktig fråga och är beredda att byta parti. Kritiken riktas mot Kristdemokraternas förslag om att ta bort vikta föräldradagar, införa vårdnadsbidrag och begränsa aborträttigheter samt Centerpartiets elitistiska fokus som ökar klyftorna.", "trump": "Folk, ni skulle höra de här två – Busch och Ohlsson – de pratar om riktig feminism och ur-och-skur-feminism, det är en total skämtshow! De lovar jämställdhet men levererar vårdnadsbidrag och abortregleringar som låser in kvinnorna hemma. Patetiskt! Biden skulle älskat det här woke-flummet, men det är slut nu. Väljarna ser igenom bluffen, tro mig. Make Sweden Equal Again – på riktigt, inte så här!", "stalin": "Kamrater, dessa falska feminister Busch och Ohlsson försöker lura massorna med sina dekadenta tal om ur-och-skur-feminism. Deras politik är en klassfiendes fälla som cementerar borgarklassens klyftor och förtrycker arbetarkvinnorna. Vi ser deras försök att likvidera viktiga reformer som föräldradagar. Inga kompromisser med folkförtryckartrollen! Den socialistiska jämställdheten ska försvaras mot dessa exploaterande byfånar med järnhand."}, "date": "11 juni, 08:49", "url": "https://www.etc.se/debatt/busch-och-ohlsson-vill-inte-goera-sverige-mer-jaemstaellt", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260611060648_e4f4ef5d-5324-4139-a5a3-15af8d461967.jpg"}, {"type": "text", "heading": "Tredje SD-sexbrottslingen på kort tid", "summaries": {"normal": "SD-politikern Daniel Hribar i Västerås har dömts till 15 månaders fängelse för grovt barnpornografibrott. Han greps med 581 filmer, varav många visade våldtäkter mot mycket små barn. Hribar är den tredje SD-politikern på kort tid som dömts för sexualbrott. Bland de andra fallen finns Bo Heijl dömd för våldtäkt, Kent Sundström för ofredande och Michael Rubbestad som avgått misstänkt för liknande brott.", "trump": "Kan ni tro det? Den här svenska clownen Hribar, en riktig loser från SD, åker fast med hundratals timmar barnporr. Tredje gången på kort tid! Deras parti är en total katastrof, full av perversa typer. Biden skulle älskat det här – identitetspolitik och kvotering ger oss bara galningar. Patetiskt! Sverige behöver en stor cleanup, tro mig, det blir fantastiskt när jag fixar världen igen.", "stalin": "Kamrater, denna Hribar är en klassfiende i arbetarrörelsens skepnad, en degenererad folkförtryckartroll som samlat hundratals timmar av övergreppsfilmer mot oskyldiga barn. Vi ser hur borgarpartier som SD gömmer sig bakom falsk nationalism medan de ruttnar inifrån. En utrensning av alla sådana element är nödvändig. Vårt kollektiv skrattar mörkt åt dessa svaga kapitalistlakejer som tror sig undkomma folkets dom."}, "date": "10 juni, 16:00", "url": "https://proletaren.se/artikel/fjarde-sd-sexbrottslingen-pa-kort-tid/"}, {"type": "text", "heading": "Tidigare M-ledamot rycker ut till försvar av pedofili", "summaries": {"normal": "Tidigare moderata riksdagsledamoten Maria Abrahamsson försvarar SD-politikern Michael Rubbestad, som misstänks för grova barnpornografibrott. Hon menar att det inte är pedofili att titta på barnpornografi eftersom inget fysiskt övergrepp sker. Abrahamsson kritiserar mediepaniken och statsminister Ulf Kristerssons krav på hårda straff. Hennes åsikter står i stark kontrast till experter som ECPAT och svensk lag, som sedan 2010 förbjuder även konsumtion av barnpornografi.", "trump": "Kan ni tro det? Den här galna ex-M-tjejen Maria Abrahamsson springer till försvar för en SD-kille som fastnat med barnporr. Hon säger att det inte är pedofili att glo på det hemma i soffan. Vilken röra! De här vänsterliberala eliterna och deras identitetspolitik har totalt förstört hjärnorna. Stoppa paniken, säger hon – nej, stoppa de sjuka! Vi behöver lag och ordning, inte ursäkter från borgarbrackor som låtsas vara intellektuella. Patetiskt!", "stalin": "Jag betraktar med djup misstro dessa dekadenta restprodukter från den borgerliga parlamentscirkusen. Den förre moderata ledamoten försvarar en motbjudande handling som hotar folkets moral och framtida generationer. Att kalla konsumtion av barnpornografi för oskyldigt är en klassfiendes trick för att fördärva samhället inifrån. Vi skall rensa ut alla sådana folkförtryckartroll och deras sjuka ursäkter. Sovjetiskt stål skall skydda barnen mot dessa perversa imperialister i sina fina kostymer."}, "date": "10 juni, 16:00", "url": "https://proletaren.se/artikel/m-ledamot-rycker-ut-i-forsv/"}, {"type": "image-right", "heading": "SVT väljer mångfald framför begripliga reportage", "summaries": {"normal": "SVT kritiseras för att prioritera mångfald framför tydligt språk i ett reportage om en polisinsats där en man sköts ihjäl efter en biljakt. Reporterns uttal, grammatikfel och främmande ord gjorde inslaget svårt att förstå trots textning. Artikeln ifrågasätter om detta strider mot public service-uppdraget att värna svenska språket och folkbildning. Kritikerna ser det som ett medvetet försök att normalisera svag svenska och nedprioritera svensk kultur.", "trump": "Det här är en total katastrof, tro mig. SVT sätter en kvinna som knappt kan tala svenska framför kameran för att rapportera om en polis som sköt en kille. Vägbuller, eh, uffren, vägraket – det var rena cirkusen! De bryr sig mer om kvoterna och mångkultur än om att svenskarna faktiskt ska förstå vad som händer. Public service har blivit en vänstervriden skam. De borde vara folkets röst, inte en identitetspolitisk mardröm. Patetiskt!", "stalin": "Kamrater, detta är en klassisk sabotagehandling från borgarbrackornas media. Jag ser hur de medvetet placerar språkligt undermåliga element framför kameran för att fördärva det svenska folkets gemensamma språk. Det är en fiendtlig utrensning av nationens klara uttryck till förmån för kaos och förortsförvirring. Vi, partiet och kollektivet, kräver att sådana folkfiender omedelbart avlägsnas från sändningarna. Språket tillhör folket, inte de exploaterande mångkulturimperialisterna."}, "date": "5 juni, 08:11", "url": "https://samtiden.nu/2026/06/svt-valjer-mangfald-framfor-begripliga-reportage/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6665.jpeg"}, {"type": "image-right", "heading": "Sluta kalla antisemitism för Israelkritik", "summaries": {"normal": "Artikeln kritiserar pro-palestinska aktivisten Sami Suliman för antisemitiska uttalanden och delning av konspirationsteorier, däribland Hitler-tal och myter om judisk världskontroll. Trots åtal för hets mot folkgrupp försvaras han av vänsteraktivister och forskare som menar att det är Israelkritik. Sulimans retorik, inklusive attacker mot tre personer med namnet Aron, anses bygga på antisemitiska stereotyper. Artikeln varnar för att försvara antisemitism under förevändning av Israelkritik.", "trump": "Jag säger er, det här är helt galet! En kille i Sverige, Sami Suliman, sprider judehat öppet – delar Hitlertal, snackar om judisk makt, konspirationer – och vad     <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
