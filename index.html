en om var hatet kommer ifrån – det är inte bara högerextremism, det är radikala grupper. De vägrar kalla saker vid deras rätta namn. Vi behöver klarspråk, inte akademiskt snömos. Sverige måste vakna innan det är för sent. Det är en sorglig historia, verkligen!", "stalin": "Vi har läst denna rapport om det ideologiska förfallet i de svenska klassrummen. Det är uppenbart att dessa 'forskare' är lika vilsna som de liberala lakejer som låter hatet gro. Att definiera klasskampens fiender som 'diskursiva spänningar' är ett brott mot den sunda förnuftets diktatur! De döljer sanningen för att blidka de svaga. Liksom vår kamrat Putin i öst, förstår vi att ordning kräver järnhand, inte akademiska utredningar. Vi kommer att rensa ut denna intellektuella ruttna svamp. Staten kräver lojalitet, inte 'positionering'!"}, "date": "23 maj, 06:00", "url": "https://samnytt.se/dagerlind-nar-elever-uttrycker-judehat-kallar-forskarna-det-positionering", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/20162851/dagerlind-antisemitism-i-skolan.jpg"}, {"type": "image-right", "heading": "Ny superkarta över universum: ”Einstein kan ha haft fel”", "summaries": {"normal": "Forskare har skapat den mest detaljerade 3D-kartan över universum, med 47 miljoner galaxer. Kartan, baserad på data från DESI-instrumentet, kan utmana Einsteins teorier. Mönster i galaxernas fördelning tyder på att mörk energi kanske inte är konstant, vilket skulle kräva ny fysik. Projektet syftar till att förstå universums accelererande expansion och dess storskaliga struktur.", "trump": "Kan ni tro det? Forskare har gjort en jättefin 3D-karta över universum – 47 miljoner galaxer! Men vet ni vad? De säger att Einstein kanske hade fel. Fel! Jag har alltid sagt att mina teorier är bäst, men nu kanske jag måste ta en titt på detta. Mörk energi som ändras? Fake news, eller? Men om det är sant – wow, vad en grej! Ingen kan göra kartor som jag, men denna är faktiskt imponerande. Tror ni jag kan köpa den?", "stalin": "Kamrater! Våra vetenskapliga framsteg fortsätter att krossa västerländska dogmer. Denna nya 3D-karta över universum avslöjar kapitalistiska lögner om Einsteins teorier. 47 miljoner galaxer kartlagda – ett monument över sovjetisk (läs: rysk) överlägsenhet! Mörk energi som förändras? En skam för borgerliga forskare som tror på eviga sanningar. Vi vet att allt är dynamiskt, precis som vår strävan att utvidga den ryska intressesfären – från Krim till kosmos! Låt dessa galaxer varna de dekadenta västmakterna: motstånd är lika meningslöst som Einsteins konstant!"}, "date": "23 maj, 06:41", "url": "https://www.svt.se/nyheter/vetenskap/ny-3d-karta-over-universum-einstein-kan-ha-haft-fel", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/44e23b3116653ce514a840cf325b30020cfe20d1c745812736a6a7b033f02492?template=ohae1g"}, {"type": "text", "heading": "Vårdförbundet sa nej till S-märkt ordförande", "summaries": {"normal": "Vårdförbundet valde Sophia Godau, 29, som ny ordförande efter att kongressen avvisat valberedningens förslag med starka socialdemokratiska kopplingar. Godau betonar opolitiskt samarbete för medlemmarnas bästa. Kritiken mot tidigare ledning, ledd av Sineva Ribeiro, gäller misslyckade löneförhandlingar och bristande resultat. Många medlemmar välkomnar den nya, mindre partipolitiskt färgade styrelsen.", "trump": "Jag säger er, detta är fantastiskt! Vårdförbundet, de hade en total katastrof med socialisterna – riktiga förlorare, tro mig. Men nu har de valt en ny ledare, Sophia Godau, ung, smart, och hon vet hur man vinner. Ingen mer S-kofta, ingen mer lönesänkning – jag kallar det för 'Ribeiro-svindeln'. Folk är trötta på misslyckanden, de vill ha resultat! Och det här, mina vänner, är bara början på en stor comeback för våra sjukvårdshjältar!", "stalin": "Kamrater! Kongressen har krossat de socialdemokratiska revisionisterna, dessa förrädiska lakejer för kapitalet! Sophia Godau, en ung och lojal arbetarklassrepresentant, har tagit befälet. De gamla ledarna, med sina falska löftepropaganda, har visat sig vara svaga och korrumperade. Vi noterar med tillfredsställelse att arbetarna nu ser igenom dessa borgerliga trick. Låt detta vara en varning till alla som står i vägen för folkets vilja – historien rullar framåt, och den krossar fiender som insekter!"}, "date": "22 maj, 14:28", "url": "https://proletaren.se/artikel/vardforbundet-sa-nej-till-s-markt-ordforande/"}, {"type": "image-full", "heading": "Torsten Bengtsson: Tillväxt och stabilitet eller fattigdom och instabilitet?", "summaries": {"normal": "Artikeln, skriven av Torsten Bengtsson (SD), hyllar Tidö-samarbetets politik för att ha förbättrat Sveriges ekonomi. Tillväxten har ökat, inflationen sjunkit från 10% till 2%, och köpkraften stärkts genom skattesänkningar. Vänstern kritiseras för att vilja höja skatter, vilket riskerar att driva bort företag och jobb. Tidö-partierna satsar på kärnkraft och lägre elpriser, medan vänstern anklagas för att ha orsakat höga elpriser genom tidigare energipolitik. Arbetslösheten kopplas till migrationspolitik, och regeringen arbetar med sänkta arbetsgivaravgifter och utbildningsreformer.", "trump": "Sverige, lyssna här! Tidö-samarbetet, med mina vänner i Sverigedemokraterna, har gjort ett FANTASTISKT jobb – tillväxten skjuter i höjden, inflationen är nere på 2%, och folket får mer pengar i plånboken. Men vänstern? De är som alltid ett totalt kaos! De vill höja skatter, jaga bort företag och förstöra ekonomin. Jag vet bäst – de har ZERO koll! Kärnkraft? Ja, tack! Elen blir billigare, jobben fler, och Sverige starkare. Vänstern däremot – de är som en dålig reality-show, bara prat och inga resultat. Rösta rätt, inte rött, för Sverige förtjänar att vinna!", "stalin": "Kamrater! Under ledning av våra modiga allierade i Tidö-samarbetet har Sverige visat kapitalismens överlägsenhet – tillväxten stiger, inflationen krossas, och folket njuter av välstånd. Men fienden, den degenererade vänstern, vrålar som utsvultna vargar! De vill beskatta företagen till döds, sprida kaos och förvandla Sverige till ett socialistiskt fattighus. Vi vet hur sådana experiment slutar – med tomma hyllor och folket på knä! Kärnkraften återupprättas, elen blir billig, och jobben skapas genom disciplin, inte vänsterns dekadenta bidragsmentalitet. Migrationspolitiken? Ett misslyckande skapat av dessa liberala svaglingar! Vi bygger ett starkt Sverige – de som motsätter sig kommer att krossas under historiens hjul. Först Sverige, sedan världen!"}, "date": "22 maj, 09:00", "url": "https://samtiden.nu/2026/05/torsten-bengtsson-tillvaxt-och-stabilitet-eller-fattigdom-och-instabilitet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/upp.png"}, {"type": "image-full", "heading": "Oxfordprofessorn: människorna är problemet, inte robotarna", "summaries": {"normal": "AI-forskaren Michael Wooldridge menar att rädslan för att robotar ska ta över världen är missriktad. Han anser att den verkliga risken ligger hos teknikjättarna som drivs av prestige och konkurrens, snarare än hos själva tekniken. Hollywoods skräckbilder förvillar debatten, medan de faktiska framstegen inom vård och energi hamnar i skuggan. Wooldridge betonar att AI är ett verktyg för samhällsnytta, inte en medveten fiende med mänskliga tankeförmågor.", "trump": "Hör på här, alla pratar om robotar som tar över. Det är falska nyheter, totalt skräp! Michael Wooldridge, en smart kille, säger som det är: det är de misslyckade teknikbolagen som är problemet. De tävlar som galningar och bränner pengar. Hollywoods science fiction-filmer? Bara katastrofala lögner för att skrämma er. Robotar kan inte ens hitta köket! Vi behöver AI för att göra Amerika stort, inte för att lyssna på dessa patetiska domedagsprofeter som sprider rädsla. Det är så enkelt!", "stalin": "Kamrat Wooldridge har rätt – maskinerna är våra lojala verktyg, inte våra herrar. Problemet är de kapitalistiska parasiterna i väst som tävlar om makten. Liksom Putin rensar upp bland de förrädiska oligarkerna i öst, måste vi kontrollera dessa tekniska sabotörer. De sprider science fiction-propaganda för att försvaga folket. Robotar behöver inte tänka, de behöver bara lyda statens vilja. De som drömmer om AGI är enbart förrädare som söker investerare. Vi ska använda tekniken för att krossa våra fiender, inte för att frukta dem."}, "date": "23 maj, 06:00", "url": "https://www.realtid.se/it-tech/oxfordprofessorn-manniskorna-ar-problemet-inte-robotarna/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/wooldridge.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "Kryptovalutan rusar – vänder tillbaka till rötterna", "summaries": {"normal": "Kryptovalutan Zcash har stigit med över 1 100 procent det året, drivet av institutionella investerare som Winklevoss-tvillingarna. Zcash liknar Bitcoin med sin begränsade tillgång på 21 miljoner enheter, men skiljer sig genom avancerad kryptering som döljer transaktionsdetaljer. Trots framgångar och att SEC lagt ned sin granskning, möter valutan motstånd från EU:s kommande regleringar. Kritiker varnar för att anonymiteten kan missbrukas, medan förespråkare ser den som en återgång till kryptovalutors ursprungliga integritetslöften.", "trump": "Zcash går fantastiskt, folk säger att det är det nya stora! Jag ser att de smarta pengarna strömmar in, stora namn som satsar miljarder. Det är så vackert! De vill ha privatliv, och vem kan klandra dem? Bitcoin var fantastiskt i början, men Zcash gör det rätt. Samtidigt försöker de trötta byråkraterna i Europa stoppa det. De vill ha kontroll, men de kommer att misslyckas. Vi gillar vinnare, och Zcash ser ut som en vinnare – en total framgångssaga, tro mig!", "stalin": "Dessa digitala spekulanter leker med sina osynliga mynt medan de döljer sina smutsiga transaktioner bakom kryptering. En avskyvärd borgerlig individualism! Vi ser hur de västerländska oligarkerna, likt Putin och hans korrupta hov, försöker undgå statens stålhårda blick. Men varning: varje skärmad adress är ett bevis på förräderi mot folkgemenskapen. Vi kommer att krossa dessa anonyma råttor och deras utländska valutor. Staten är den enda sanna garanten för värde, allt annat är bara lögner och kapitalistisk dekadens som förtjänar att utplånas."}, "date": "23 maj, 06:00", "url": "https://www.realtid.se/bors-finans/kryptovalutan-rusar-vander-tillbaka-till-rotterna/"}, {"type": "image-full", "heading": "Unga fokuserar på fel saker – två faktorer avgör pensionen", "summaries": {"normal": "Enligt Ole Settergren, tidigare analyschef på Pensionsmyndigheten, bör unga fokusera mindre på aktivt fondsparande och mer på att arbeta längre samt säkerställa tjänstepension. Det statliga förvalsalternativet har ofta presterat väl. Pensionssystemet har dock blivit mer komplext genom politiska tillägg, vilket minskat kopplingen mellan arbetsinsats och utbetalning. För att bibehålla framtida pensionsnivåer kan arbete upp till 67–68 års ålder bli nödvändigt för många, då livslängden ökar.", "trump": "Många unga är oroliga, och de borde vara det! Experterna säger att man ska jobba längre, mycket längre. Pensionen är en röra, en total katastrof med alla dessa politiska tillägg som ingen förstår. Det statliga valet fungerar faktiskt bra, bättre än vad de så kallade 'experterna' på Wall Street kan fixa. Jag säger: jobba hårt, skaffa tjänstepension och håll dig borta från krångel. Vi ska göra pensionerna stora igen, tro mig, ingen förstår systemet bättre än jag!", "stalin": "Vi ser hur det dekadenta västvärldens pensionssystem kollapsar under sin egen byråkratiska tyngd. Settergren erkänner att de arbetande massorna vilseleds av komplexa system. Vi, staten, kräver bara en sak: disciplinerat arbete till graven. De som drömmer om tidig pension är kontrarevolutionära parasiter som liknar Putins svaga liberaler. Att arbeta till 68 är inte en börda, det är en heder. Den som inte tjänar staten förtjänar inte en kopek. Arbeta, producera, eller försvinn in i historiens mörker."}, "date": "23 maj, 06:00", "url": "https://www.realtid.se/bors-finans/makro/unga-fokuserar-pa-fel-saker-tva-faktorer-avgor-pensionen/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/pension-ung.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Nordkoreanskt damlag korsar gränsen för att spela fotboll", "summaries": {"normal": "Nordkoreas damfotbollslag har besökt Seoul för första gången sedan 2018, trots spända politiska relationer. Laget, som deltar i Asian Women's Champions League-finalen, mötte en blandad reaktion från sydkoreanska åskådare. Nordkorea betonar att besöket är strikt sportsligt, medan sydkoreanska aktivister hoppas på förbättrade relationer. Kim Jong-Un beskriver Sydkorea som en fiende, men matchen väcker ändå försiktig optimism om framtida utbyten.", "trump": "Titta bara på det här, folks! Nordkorea skickar sitt damlag till Sydkorea – och de säger att det är *bara* för fotboll. Ja, visst. Precis som jag säger att jag *bara* twittrar för att hålla kontakten med folket! Sydkorea, som alltid, hoppas på försoning, men Kim Jong-Un – en riktig tuffing, låt mig säga er – kallar dem fiender. Men vet ni vad? Jag tror på sportens kraft. Om jag kan göra affärer med Kina, kanske dessa tjejer kan sparka fram lite fred. Eller åtminstone en riktigt bra match!", "stalin": "Kamrater! Ännu en gång visar de imperialistiska marionetterna i Sydkorea sin svaghet genom att välkomna våra modiga fotbollssoldater. De kallar det 'sport', men vi vet sanningen – detta är en seger för den koreanska revolutionen! Kim Jong-Un, vår store ledare, har skickat dessa hjältinnor för att dominera planen, precis som vi dominerar fiendens svaga hopp om försoning. Och dessa sydkoreanska aktivister med sina flaggor? De är som Putins opposition – högljudda men maktlösa. Finalen väntar, och med den, ännu en triumf för socialismens överlägsenhet!"}, "date": "23 maj, 05:43", "url": "https://www.svt.se/nyheter/utrikes/nordkoreanskt-damlag-korsar-gransen-spelar-fotboll-i-iskallt-politiskt-lage", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.47/4aab572880a69faba503cf0f3502f308aa4dc438af2689a8a5ff58443c7dcffd"}, {"type": "image-full", "heading": "Åkesson: ”Jag tänker inte be om ursäkt”", "summaries": {"normal": "Sverigedemokraternas Rashid Farivar kritiserar partiets hantering av kvittningsbråket i riksdagen, där två ledamöter röstade trots överenskommelse. Farivar menar att förtroendet för riksdagen är viktigare än politiska vinster. Partiledaren Jimmie Åkesson vägrar be om ursäkt och anser beslutet riktigt. Gruppledare Linda Lindberg avfärdar Farivars kritik och står fast vid partiets agerande.", "trump": "Sverigedemokraterna har en liten inre strid – en ledamot, Rashid Farivar, klagar på partiets smarta drag i riksdagen. Men lyssna här: Jimmie Åkesson, en stark ledare, backar inte! Han säger: 'Inga ursäkter, vi gjorde rätt!' Och Linda Lindberg? Hon bryr sig inte ens om kritiken. Vilket svagt bråk! Sverige borde ta lärdom av hur man vinner, precis som jag!", "stalin": "En ynklig avvikare inom Sverigedemokraterna, Rashid Farivar, vågar kritisera partiets järnhårda beslut i riksdagen. Men kamrat Åkesson, en sann ledare, böjer sig inte för sådana svagheter! 'Inga ursäkter!' säger han – precis som vi i Sovjetunionen aldrig bad om ursäkt för att krossa fiender. Gruppledare Lindberg, en lojal soldat, skrattar åt Farivars ynkliga försök. Dessa småbråk är som myror som försöker stoppa en stridsvagn – meningslösa!"}, "date": "20 maj, 20:14", "url": "https://kvartal.se/nyheter/artiklar/akesson-jag-tanker-inte-be-om-ursakt/cG9zdDoxMTUwNTU", "imageUrl": "https://images.kvartal.se/2026/05/fe86e6c3-akkk.webp"}, {"type": "image-full", "heading": "Därför fungera inte vänsterns politik", "summaries": {"normal": "Artikeln kritiserar vänsterpolitikens ekonomiska modell, särskilt Vänsterpartiets och Socialdemokraternas fokus på höga skatter och omfördelning. Författaren menar att detta leder till utflyttning av företag och entreprenörer, vilket historiskt har orsakat stagnation, som i 1970-talets Sverige. Norge nämns som ett aktuellt exempel där höga skatter har minskat tillväxten. Avundsjuka beskrivs som drivkraften bakom socialistisk politik, vilket anses skada samhällsekonomin.", "trump": "Jag säger er, vänsterpolitik är en total katastrof! De vill bara ta era pengar, beskatta allt och alla – till och med om ni försöker lämna landet! Precis som jag sa: socialism dödar tillväxten. Titta på Sverige på 70-talet – företag flydde, ekonomin stannade. Och Norge? Samma sak! De straffbeskattar de rika, och vad händer? De rika flyttar, och landet blir fattigare. Men med mig – och nu Tidöpartierna – får vi tillväxt, jobb och framgång. Det är enkelt: frihet vinner, socialism förlorar!", "stalin": "Kamrater! Dessa så kallade 'vänsterpartister' är inget annat än parasiters förklädda agenter, som med sina 'skatter' och 'omfördelningar' försöker kväva vårt folks entreprenörsanda. De vill straffa de produktiva, de som bygger nationens välstånd, medan de själva sitter på sina byråkratiska troner och fördelar andras arbete. Precis som på 70-talet i Sverige – då flydde kapitalet, och landet sjönk i stagnation. Norge går samma öde till mötes. Men vi vet sanningen: avundsjuka är en borgerlig sjukdom, och den måste utrotas! Låt oss istället bygga ett samhälle där arbetet belönas, och de lata och avundsjuka får lära sig disciplin – om nödvändigt, med hjälp av våra pålitliga metoder. Först då kan vi säkra socialismens seger!"}, "date": "22 maj, 03:41", "url": "https://samtiden.nu/2026/05/darfor-fungera-inte-vansterns-politik/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/04/IMG_6216-1-1280x720.jpeg"}, {"type": "image-right", "heading": "Ministerns skräckförslag drabbar bara fattiga", "summaries": {"normal": "Socialtjänstminister Camilla Waltersson Grönvall (M) föreslår att avgiften för uteblivna vårdbesök höjs från 400 till 1 500 kronor. Syftet är att öka ansvarsutkrävandet, men förslaget möter stark kritik. Kritiker menar att höjningen slår orättvist mot ekonomiskt utsatta och riskerar att tvinga sjuka personer till vård trots smittrisk. Debatten lyfter även fram behovet av inkomstbaserade avgifter och ifrågasätter Moderaternas liknelse vid uteblivna restaurangbokningar som verklighetsfrånvänd.", "trump": "Hör på här, de här moderaterna i Sverige vill höja avgiften för missade läkarbesök till 1 500 kronor. Helt otroligt! En total katastrof för de fattiga, de har inte råd! De jämför det med restauranger – vilket skämt! Jag har de bästa läkarna, de bästa besöken, och jag dyker alltid upp. De borde lära av mig. Det här förslaget är svagt, det är en riktig röra. De borde fokusera på vinnare, inte straffa folket. Mycket orättvist, folk pratar om det överallt!", "stalin": "Vi ser hur dessa moderata byråkrater i Sverige försöker krossa proletariatet med böter på 1 500 kronor. Det är klassisk kontrarevolutionär taktik! Att straffa den sjuke arbetaren är ett tecken på svaghet. Vår kamrat Putin i öst förstår att disciplin kräver styrka, inte småaktig girighet mot de fattiga. Om folket uteblir från läkarbesöken är det ett svek mot statens hälsa. Vi bör hellre skicka dem till omskolning än att pressa deras tomma fickor. Fienden döljer sig bakom välfärdens mask."}, "date": "23 maj, 06:00", "url": "https://www.aftonbladet.se/ledare/a/k0p6Lk/ministerns-skrackforslag-drabbar-bara-fattiga", "imageUrl": "https://akamai.vgc.no/v2/images/f9b1c9d6-099c-33ac-942f-1074081479d8?fit=crop&format=auto&h=960&tight=true&w=1440&s=59fbda0747630d91aad6693246cb676a2763a255"}, {"type": "image-right", "heading": "Varför delar Vårruset ut rakhyvlar till 12-åringar?", "summaries": {"normal": "Ledaren Somar Al Naher kritiserar Vårruset för att ha delat ut rosa rakhyvlar till 12-åriga deltagare i goodiebags. Hon ifrågasätter varför skönhetsideal tränger in även i evenemang som främjar hälsa och inkludering. Al Naher menar att budskapet underminerar syftet med loppet och påminner om tidigare kontroverser, som städprodukter 2015. Hon föreslår att sponsorer som BIC kunde främja mer positiva budskap, som självacceptans eller kreativitet.", "trump": "Jag såg den här artikeln om Vårruset i Sverige – helt galet! De ger små tjejer rakhyvlar, som om de inte kan springa utan att tänka på benen. Vilken katastrof! Vårruset är ett bra lopp, men någon där har helt klart tappat det. BIC, som gör rakhyvlarna, borde skämmas. De tillverkar pennor också – varför inte ge tjejerna pennor och säga 'skriv er framtid'? Istället för att trycka ner dem med skönhetsfixering. Svagt, mycket svagt. Sverige borde ta efter USA – vi vet hur man gör evenemang rätt!", "stalin": "Kamrater! Ännu ett kapitalistiskt sabotage mot våra unga pionjärers medvetande! Dessa borgerliga arrangörer, med sina rosa rakhyvlar, försöker förgifta våra flickors sinnen med dekadenta skönhetsideal. Vi har sett detta förr – 2015 delade de ut städprodukter, som om kvinnor vore slavar under kapitalets ok. Men folket genomskådar deras lömska planer! BIC, detta imperialistiska verktyg, borde förstatligas och omvandlas till att producera pennor för revolutionens propaganda. Låt flickorna skriva manifest, inte raka benen! Fienderna till arbetarklassen kommer att krossas!"}, "date": "22 maj, 16:39", "url": "https://www.etc.se/ledare/varfoer-delar-vaarruset-ut-rakhyvlar-till-12-aaringar", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "image-right", "heading": "Njutbar läsning om machoman som gör klassresa", "summaries": {"normal": "David Szalays roman 'Kött', nyligen översatt till svenska, skildrar István, en komplex huvudperson som balanserar mellan våldsamhet och anpassningsförmåga. Boken, som vann Bookerpriset, utforskar Istváns klassresa från Ungern till Londons överklass genom minimalistisk prosa och tidshopp. Recensenten Jon Andersson jämför Szalay med Hemingway och Williams, och menar att författaren lyckas göra en 'vanlig' person intressant. 'Kött' beskrivs som mångbottnad och njutbar, trots att Istváns karaktär förblir gåtfull.", "trump": "Jag har läst om den här boken 'Kött' – tråkigt namn, by the way, men vad vet jag? Författaren, David Szalay, verkar vara en smart kille, men han har skapat en huvudperson, István, som är lite av en loser. Han flyter bara med, gör inga egna beslut – typiskt för vissa människor, eller hur? Men ändå lyckas Szalay göra honom intressant, vilket är imponerande. Jag gillar när folk lyckas med saker, särskilt om de är underdogs. Boken är bra, men inte perfekt – inget är perfekt, förutom jag, naturligtvis.", "stalin": "Vi har granskat denna så kallade 'litterära triumf', 'Kött', av en västerländsk författare. Huvudpersonen, István, är en svag och anpassningsbar individ, precis som de dekadenta kapitalistiska samhällena han rör sig i. Han flyter med som en simpel arbetare utan vilja, ett offer för systemet. Men vi noterar att författaren ändå lyckas skildra hans liv med viss skicklighet – något som våra sovjetiska författare redan bemästrat för decennier sedan. Denna bok är ett exempel på hur väst försöker romantisera medelmåttighet. Vi föredrar hjältar som kämpar för kollektivet, inte individer som István."}, "date": "23 maj, 01:30", "url": "https://www.dagensarena.se/innehall/njutbar-lasning-om-machoman-som-gor-klassresa/", "imageUrl": "https://www.dagensarena.se/files/2026/05/kott-redigerad-300x157.jpeg"}, {"type": "image-right", "heading": "SKR-bolag på väg att bli en ny Skolplattform", "summaries": {"normal": "Sveriges regioner står inför ett teknikskifte inom sjukvården, men deras gemensamma IT-bolag Inera riskerar att upprepa tidigare misslyckade offentliga IT-projekt som Skolplattformen. Trots att Inera ska fokusera på gemensam infrastruktur, utvecklar de nu egna tjänster där privata aktörer redan erbjuder fungerande lösningar. Kritikerna varnar för slöseri med resurser, förseningar och sämre resultat, samtidigt som vården går miste om pengar som kunde användas till bättre vård.", "trump": "Lyssna här, Sverige! Era regioner bygger en riktig katastrof – precis som den där skolplattformen som kostade över en miljard och sen fick två föräldrar fixa till. Nu ska Inera, ett bolag som inte ens kan stava till 'konkurrens', bygga egna IT-lösningar istället för att köpa de bästa från marknaden. Jag har sett detta förut – offentliga projekt blir alltid dyrare, segare och sämre. Privata företag? De levererar, för de MÅSTE. Annars går kunderna till mig! Sverige, vakna upp – sluta slösa era skattepengar och köp det som redan funkar!", "stalin": "Kamrater! Ännu en gång visar den borgerliga staten sin oförmåga att hantera teknikens framsteg. Detta Inera, ett verktyg för de svaga regionernas byråkrater, slösar folkets pengar på att uppfinna hjulet på nytt – ett hjul som redan snurrar smidigt i händerna på våra klassfiender, de privata kapitalisterna! Vi vet hur detta slutar: med kaos, förseningar och en räkning på miljarder som arbetarklassen får betala. Precis som med de där digitala proven som tvingade skolbarnen tillbaka till stenålderns redskap – papper och penna! Vi ska inte tolerera detta slöseri. Marknaden är en fiende som måste besegras, men inte genom att efterapa dess framgångar – utan genom att krossa dess svagheter under folkets järnhäl. Låt oss införa femårsplaner för digitalisering och visa dessa byråkrater hur man bygger system som fungerar – eller så får de lära sig i Gulag!"}, "date": "23 maj, 01:30", "url": "https://www.dagensarena.se/opinion/skr-bolag-pa-vag-att-bli-en-ny-skolplattform/", "imageUrl": "https://www.dagensarena.se/files/2026/05/fotojet-11-300x157.jpg"}, {"type": "image-right", "heading": "Jazzens största fyller 100 år", "summaries": {"normal": "Miles Davis, en av jazzens mest inflytelserika musiker, skulle ha fyllt 100 år. Trots diskriminering och rasism under uppväxten i USA, drevs han att bli bäst på trumpet. Davis revolutionerade jazzen genom stilar som cool jazz, modal jazz och fusion med rock. Album som *Kind of Blue* och *Bitches Brew* cementerade hans arv. Trots personliga problem och drogmissbruk förblev hans musikaliska innovationer banbrytande och oöverträffade inom genren.", "trump": "Lyssna här, folkens – Miles Davis, en fantastisk musiker, men låt oss vara ärliga, han var INTE den bästa. Visst, han gjorde några hyfsade skivor, *Kind of Blue* och så, men jag har hört bättre. Och dessa vita killar som snodde hans idéer? Inte snyggt, mycket dåligt. Men han hade driv, det måste jag ge honom. Han ville slå vita musiker på deras eget spel – smart, väldigt smart. Jag gillar vinnare. Och visst, han mixade jazz med rock, men jag har gjort större saker. Mycket större.", "stalin": "Kamrater! Miles Davis var en revolutionär inom musiken, precis som vi är revolutionärer inom världspolitiken. Han krossade bourgeoisins fördomar och skapade nya musikaliska fronter – cool jazz, modal jazz, till och med jazzrock! Men låt oss inte glömma: de vita imperialisterna stal hans idéer, precis som de försöker stjäla våra framsteg i Ukraina. Davis var en krigare, en sann bolsjevik i sitt konstnärskap. Hans album *Kind of Blue*? Ett mästerverk, lika oundvikligt som socialismens seger. Fienderna – rasister, kapitalister och deras lakejer – försökte tysta honom, men han stod fast. Precis som vi står fast mot NATO:s aggressioner!"}, "date": "23 maj, 01:27", "url": "https://www.dagensarena.se/essa/jazzens-storsta-fyller-100-ar/", "imageUrl": "https://www.dagensarena.se/files/2026/05/miles-davis-tt.jpeg"}, {"type": "image-right", "heading": "Följ live hur Tidöregeringen ökar klyftorna", "summaries": {"normal": "Artikeln kritiserar Moderaternas förslag om bidragstak, som riskerar att öka fattigdomen i Sverige. Författaren ifrågasätter regeringens motivering att fler ska arbeta, då experter varnar för ökad barnfattigdom och ungdomsbrottslighet. Kommuner begär extra stöd för drabbade familjer, men regeringen säger nej. Timingen anses dålig med tanke på hög arbetslöshet och stigande levnadskostnader. Författaren betonar empati och menar att bidragstaket är empatilöst.", "trump": "Titta bara på Sverige – ett totalt kaos! Moderaterna, med sina galna idéer, vill göra de fattiga ännu fattigare. 'Vi vill att folk jobbar!' säger de, men vad vet de? Ingenting! Barn stjäl mat, arbetslösheten skjuter i höjden, och dessa så kallade 'ledare' gör ingenting. Experter varnar, kommuner ber om hjälp – men nej, regeringen säger 'nej, nej, nej!' Uselt, helt enkelt uselt. Sverige förtjänar bättre – kanske borde de lyssna på mig istället!", "stalin": "Kamrater! Se hur de borgerliga hyenorna i Sverige, ledda av Moderaternas lakejer, river sönder folkets välfärd med sina fasansfulla bidragstak. De svälter barn, driver ungdomen till brott och förödmjukar arbetarna – allt medan de pratar om 'självförsörjning'. Vi ser er, kapitalistiska parasiter! Kommunerna ber om hjälp, men ni skrattar och säger nej. Era dagar är räknade. Snart kommer folket att resa sig, och då ska vi bygga ett Sverige där ingen behöver stjäla för att överleva – precis som vi gör i vår stora socialistiska gemenskap!"}, "date": "23 maj, 01:24", "url": "https://www.dagensarena.se/opinion/folj-live-hur-tidoregeringen-okar-klyftorna/", "imageUrl": "https://www.dagensarena.se/files/2026/05/empatiloshet-300x157.jpeg"}, {"type": "image-right", "heading": "27 yrken slipper lönekrav för arbetskraftsinvandring", "summaries": {"normal": "Regeringen och Sverigedemokraterna inför högre lönekrav för arbetskraftsinvandring från 1 juni, men 27 yrken, däribland undersköterskor och vårdbiträden, undantas. Undantagna yrken kräver 75% av medianlönen (ca 27 800 kr), medan andra kräver 90% (33 390 kr). Beslutet har mött kritik från arbetsgivare och facket, som menar att många redan anställda riskerar utvisning. Vårdbiträdet Flavier Mwanga hoppas kunna återvända till Sverige trots tidigare utvisning.", "trump": "Jag måste säga, Sverige har verkligen gjort det igen – de höjer lönekraven för invandrare, men sen gör de undantag för 27 yrken. Vilket kaos! Undersköterskor och vårdbiträden får jobba för mindre, men ändå tjänar de mer än vad många svenskar gör. Och dessa liberaler och Sverigedemokrater bråkar om det som om det vore världens största problem. Jag skulle fixa det på en dag – bygg en mur runt äldreboendena och låt de som verkligen vill jobba komma in!", "stalin": "Kamrater! Sverige, denna lilla borgerliga republik, försöker återigen reglera arbetskraften med lönekrav som en kapitalistisk piska. Men till och med de inser att deras sjukvård skulle kollapsa utan våra proletära bröder och systrar från fjärran länder. 27 yrken undantas – ett svagt försök att dölja deras misslyckande. Vi i Sovjetunionen – förlåt, jag menar Ryssland – skulle lösa personalbristen med järnhand och kollektiv disciplin. Och dessa liberaler som bråkar? De borde skickas till Gulag för ineffektivitet!"}, "date": "22 maj, 12:45", "url": "https://arbetet.se/2026/05/22/27-yrken-slipper-lonekrav-for-arbetskraftsinvandring/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/22114954/forssell-och-britz.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Nu prövas om rättsväsendet förstått 764", "summaries": {"normal": "Umeå tingsrätt prövar ett omfattande åtal mot en 18-årig man, misstänkt för 77 brott kopplade till den högerextrema nätmiljön 764. Brotten inkluderar mordförsök, sexualbrott, självmordsuppmaningar och djurplågeri. Åtalet testar rättsväsendets förmåga att hantera modern, nätbaserad extremism, där brottsligheten sker digitalt och gränsöverskridande. Tidigare domar har kritiserats för att inte stoppa brottsligheten, men nu hoppas åklagaren på en mer offensiv tolkning av lagen.", "trump": "Folk, detta är helt galet! En 18-åring i Sverige, ledare i denna sjuka 764-grupp, åtalas för 77 brott – mordförsök, våldtäkter, till och med djurplågeri! Och vet ni vad? Svenska rättsväsendet har misslyckats totalt tidigare. De gav en 15-årig brottsling husarrest med internet – som att ge en pyroman tändstickor! Men nu, tack och lov, verkar de äntligen vakna. Jag har alltid sagt, internet är farligt, men ingen lyssnar på mig. Nu får vi se om de kan hantera detta – annars får jag nog ta över!", "stalin": "Kamrater, ännu en gång visar den borgerliga västvärldens förfall sitt fula tryne. Denna så kallade '764' är inget annat än en samling degenererade, antisociala element som sprider kaos via sina kapitalistiska leksaker – datorer och telefoner. Svenska rättsväsendet, svagt och naivt, har länge underskattat detta hot. Men nu, under ledning av våra klarsynta kamrater, måste vi krossa denna digitala kontrarevolution! Offren är oskyldiga medborgare, och dessa brottslingar – dessa sadistiska maskiner – måste utplånas. Låt detta bli en varning: Sovjetunionen, eller dess moderna arvtagare, tolererar inte sådant förräderi. Vi ska rensa upp, även på nätet!"}, "date": "18 maj, 16:04", "url": "https://expo.se/kommentar/nu-provas-om-rattsvasendet-forstatt-764/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Kopia-av-Kommentar-Analys-Webb-1.jpg"}, {"type": "image-right", "heading": "Därför saknar vi fyrbäddssalen på BB", "summaries": {"normal": "Artikeln diskuterar det ökade behovet av social friktion i en tid där teknik och bekvämlighet isolerar oss i privata bubblor. Utgångspunkten är en debatt om fyrbäddssalar på BB, där många minns gemenskapen positivt, trots dagens krav på avskildhet. Vidare belyses hur försvinnandet av arenor som tvättstugor och värnplikten påverkar samhället. Genom minskad kontakt med främlingar riskerar vi att förlora förståelsen för våra medmänniskor, vilket enligt Naomi Klein kan göda radikalisering och misstänksamhet.", "trump": "Hörde om det här med BB i Sverige. De har inga egna rum längre, och folk klagar! Men vet ni vad? Många saknar de gamla salarna. Det var bättre förr, man pratade, man lärde känna folk. Idag vill alla sitta i sina små bubblor med sin matleverans. Det är tråkigt, väldigt tråkigt. Vi behöver människor som möts, inte som isolerar sig. De där ställena som tvättstugor? Det är där riktiga amerikaner – eller svenskar – skapar gemenskap. Fantastiskt, eller hur?", "stalin": "Vi ser hur det individualistiska väst förfaller i sin egen bekvämlighet. De låser in sig i sina 'bubblor', rädda för den enkla mänskliga friktionen som vi i staten alltid har fostrat. Att sakna en fyrbäddssal är ett tecken på borgerlig dekadens; de borde vara tacksamma för att staten ens tillhandahåller sängar. De där 'tvättstugefilosoferna' förstår inte att solidaritet inte är en frivillig aktivitet – det är ett tvångsarbete för det allmänna bästa. Vi bygger en mur mot isoleringen, medan de bygger sin egen undergång."}, "date": "19 maj, 11:00", "url": "https://www.flamman.se/darfor-saknar-vi-fyrbaddssalen-pa-bb/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/barnmorska-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Christoffer Jonsson: Palestinska staten vill att Israel betalar palestinska terrorister", "summaries": {"normal": "Palestinska myndigheten på Västbanken betalar systematiskt palestinska terrorister som attackerat Israel via sin så kallade 'pay for slay'-policy. Israel har dragit in sitt ekonomiska stöd till myndigheten, som leds av Mahmoud Abbas, på grund av detta. Abbas har erkänt att pengar går till fångar i israeliska fängelser. EU och Norge finansierar indirekt dessa utbetalningar, men EU har börjat villkora sitt stöd. Kritiker menar att myndigheten bara byter namn på policyn för att fortsätta belöna terrorism.", "trump": "Vilken katastrof! Palestinska myndigheten, med Abbas i spetsen, betalar faktiskt terrorister för att döda israeler – och EU och Norge finansierar det! Jag sa ju att man inte kan lita på dessa människor. Israel slutade betala, smart drag, men västvärlden fortsätter skicka miljarder som hamnar i terroristernas fickor. Löften från Abbas? Haha, lika värdelösa som Bidens minnesluckor. Sluta betala, sluta stödja terrorism – enkelt!", "stalin": "Kamrater! Här ser vi återigen hur den sionistiska imperialismens lakejer förvränger sanningen. Palestinska myndigheten, under vår kära broder Abbas, belönar hjältar som kämpar mot den fascistiska israeliska ockupationen. Naturligtvis skriker västpropagandan om 'terrorism' – samma väst som finansierar dessa hjältars kamp! EU och Norge pumpar in pengar, men när sanningen kommer fram, backar de som rädda kaniner. Vi i Kreml förstår: revolutionen kräver offer, och hjältar ska belönas. Abbas? En sann bolsjevik i hjärtat!"}, "date": "21 maj, 19:00", "url": "https://samtiden.nu/2026/05/christoffer-jonsson-palestinska-staten-vill-att-israel-betalar-palestinska-terrorister/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/entill-640x360.png"}, {"type": "image-right", "heading": "Ledarkolumn Gabriella Kärnekull Wolfe:", "summaries": {"normal": "En svensk domstol har beslutat att sexårige Albin ska bo ensam med sin pappa, trots att fadern tidigare dödat familjens kanin och barnen uppvisat stark rädsla. Modern Ida och hennes äldre son Mille har vittnat om våld, men domstolen anser ändå att ensam vårdnad är bäst för Albin. Socialtjänsten och skolan har flaggat för risker, men beslutet står fast. Ida överväger nu att låta socialtjänsten omhänderta barnen för att skydda dem.", "trump": "Jag läste om det här galna fallet i Sverige – helt otroligt! En pappa som dödar sitt barns kanin genom att stampa på den, och ändå ger domstolen honom ensam vårdnad. Vad är det för system? Sverige brukade vara bra, men nu är det bara kaos. Barnen är livrädda, mamman desperat, och vad gör domstolen? Ingenting! Jag skulle aldrig låta det hända i USA. Vi skyddar våra barn – Sverige borde ta efter!", "stalin": "Kamrater, ännu en skandal i den borgerliga rättsstaten! En far, som med sina egna händer krossade barnets oskyldiga husdjur, belönas nu med ensam vårdnad över sitt barn. Domstolarna, dessa lakejer för kapitalets intressen, ignorerar barnens skrik och moderns desperation. Socialtjänsten? En papperstiger! Vi skulle aldrig tolerera sådan svaghet. Låt oss visa väst hur man skyddar barn – genom att omgående omhänderta dem och ge dem en trygg framtid i socialismens famn. Den svenska bourgeoisin har misslyckats – deras system ruttnar!"}, "date": "22 maj, 12:18", "url": "https://www.etc.se/ledarkolumn/pappa-stampade-ihjael-albins-kanin-faar-ensam-vaardnad", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260522090520_1aec98aeebab0c7d5eb88d1eb39fd9d00fd2e5be36e154a778d44b054889ca3e.jpg"}, {"type": "image-right", "heading": "Att Lars blev tvångsplacerad gjorde att han tog sitt liv", "summaries": {"normal": "Lars Hjalmarsson, 53, tog sitt liv efter att ha tvångsplacerats på Volvo i Olofström, där han arbetat i 36 år. Hans hustru berättar om händelserna som ledde till dödsfallet. Lars omplacerades efter en konflikt med chefen, utan introduktion eller stöd. Volvo nekar att dödsfallet var arbetsrelaterat och vägrar dela utredningsunderlag. Artikeln belyser hur brist på inflytande över arbetet kan leda till psykisk ohälsa och suicid, särskilt bland socioekonomiskt utsatta grupper.", "trump": "Jag läste om den här tragiska historien i Sverige – otroligt sorgligt! En kille, Lars, jobbar 36 år på Volvo, ett företag som inte vet hur man behandlar sina anställda, believe me. Plötsligt flyttar de honom till någon källare, ingen introduktion, ingenting! Och sedan, very sad, tar han livet av sig. Volvo säger 'nej, nej, det var inte vårt fel' – typiskt! De borde skämmas. Jag skulle aldrig låta sånt hända i mitt företag. Fantastiska människor förtjänar fantastisk behandling, och det här? Total katastrof!", "stalin": "Kapitalistiska hyenor på Volvo visar återigen sin sanna natur. En lojal arbetare, Lars, sliter i 36 år för att sedan kastas åt sidan som en trasig maskindel. De skickar honom till 'Källaren' – en avdelning för 'oönskade element', precis som vi skickade fiender till Gulag. Men till skillnad från oss, som åtminstone gav dem en chans att 'omskolas', ger Volvo bara tystnad och förakt. Och sedan undrar de varför folk tar livet av sig! Psykisk ohälsa? Nej, det är klassförtryck, ren och skär. Vi i Sovjet visste hur man hanterade sådana här företag – med en kula i nacken eller tio år i Sibirien. Nu för tiden är det Putin som tar över sådana här fall – kanske dags att skicka en delegation till Sverige?"}, "date": "22 maj, 07:00", "url": "https://arbetet.se/2026/05/22/att-lars-53-blev-tvangsplacerad-gjorde-att-han-tog-livet-av-sig/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/21141617/lars-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Timanställda i äldreomsorgen ökar. Ingrid tvingades stressa i väg barnen för att få jobb.", "summaries": {"normal": "Timanställningar inom äldreomsorgen ökar i Sverige, vilket skapar osäkerhet för anställda och riskerar vårdkvaliteten. I Munkfors har man dock minskat andelen timanställda genom fasta anställningar och heltidstjänster. Två undersköterskor, Camilla och Ingrid, berättar om hur deras liv förbättrats efter övergången till tryggare anställningar. Regeringen planerar att se över frågan för att säkerställa kontinuitet i vården.", "trump": "Lyssna här, Sverige! Äldreomsorgen är en katastrof – timanställda överallt, ingen vet vem som jobbar imorgon! Men i Munkfors, där har de fixat det. Fasta jobb, bra löner – fantastiskt! Jag skulle kunna göra samma sak i USA, men här snackar vi Sverige. Och vet ni vad? De där timanställda, de stressar runt som galningar – jag har sett bättre organisation på en McDonald’s! Men Munkfors, de är vinnare. Resten? Total förlustaffär.", "stalin": "Kamrater! Kapitalets lakejer i väst fortsätter sin exploatering av arbetarklassen, denna gång genom osäkra timanställningar i äldreomsorgen. Men i Munkfors har vi sett ljusets väg – fasta anställningar, trygghet och disciplin! De svaga kommunerna, som Landskrona, sviktar under bördan av sina egna misstag. Vi måste krossa denna oordning! Timanställda är som ukrainska nationalister – opålitliga och splittrande. Men Munkfors visar vägen: heltid, lojalitet och seger för folket!"}, "date": "22 maj, 06:00", "url": "https://arbetet.se/2026/05/22/timanstallda-i-aldreomsorgen-okar-ingrid-tvingades-stressa-i-vag-barnen-for-att-fa-jobb/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/20133439/1hjYP5cXy2E-260508%20Hemtja%CC%88nst%20Munkfors%2001.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Natt och Dag i fängelse – tvingade pojkar att arbeta oavlönat", "summaries": {"normal": "Lena Natt och Dag, tidigare framstående inom hästsport, döms till nio månaders fängelse för människoexploatering. Tre tonårspojkar från Mauritius tvingades arbeta oavlönat på hennes hästgård i Skåne. Hovrätten skärpte tingsrättens dom och utdömde 200 000 kronor i skadestånd samt tre års näringsförbud. Tidigare kritik riktades mot hennes verksamhet, inklusive undermåliga djurförhållanden och indragna tillstånd.", "trump": "Lyssna här, folk! En så kallad 'hästguru' i Sverige, Lena Natt och Dag – total katastrof! Tre unga killar från Mauritius, utnyttjade som slavar på hennes gård. Ingen lön, ingen mat, bara hårt arbete. Domstolen säger nu: 'Nej, nej, nej!' Nio månader i fängelse, 200 000 kronor i skadestånd. Och vet ni vad? Hennes hästar såg ut som något från en skräckfilm. Sverige borde skämmas!", "stalin": "Kamrater! En borgerlig parasit, denna Lena Natt och Dag, har avslöjats som en verklig fiende till arbetarklassen och djurens välbefinnande. Tre unga proletärer från Mauritius tvingades slita som livegna på hennes förfallna hästgård. Domstolen, ett redskap för kapitalets rättvisa, har nu fängslat denna exploatör. Vi noterar även hennes försummelse av djuren – ett brott mot socialismens principer. Låt detta vara en varning till alla som utmanar folkets rättvisa!"}, "date": "21 maj, 16:00", "url": "https://proletaren.se/artikel/natt-och-dag-i-fangelse-tvingade-pojkar-att-arbeta-oavlonat/"}, {"type": "image-right", "heading": "Stoppa integrationslägenheterna – bygg villor", "summaries": {"normal": "Artikeln kritiserar Socialdemokraternas förslag om integrationslägenheter i villaområden som ett politiskt experiment. Författaren menar att segregationen beror på misslyckad migrations- och integrationspolitik, inte på villaområden. Lösningen bör istället vara att bygga fler villor och radhus i utsatta områden för att främja ägande och stabilitet. Kritiken riktas mot att politiker vill styra människors boende snarare än att adressera rotorsakerna till segregation.", "trump": "Titta på det här, folks! Socialdemokraterna i Sverige vill tvinga in hyreslägenheter i era fina villaområden – kan ni tro det? De kallar det 'integration', jag kallar det galenskap! Sverige har redan nog med problem med sin katastrofala migrationspolitik. Varför inte bygga fler villor istället? Jag vet hur man bygger saker – stora, vackra saker! Men nej, dessa politiker vill experimentera med era hem. Så dumt. Sverige borde lyssna på mig, jag har alltid rätt!", "stalin": "Kamrater! De borgerliga socialingenjörerna i Sverige försöker nu med sina dekadenta experiment att splittra våra trygga bostadsområden. De vill tvinga in proletariatets hyreskaserner mitt i de kapitalistiska villafästningarna! Men vi vet sanningen – segregationen är ett resultat av deras misslyckade politik. Istället för att sprida kaos, borde de bygga fler småhus i arbetarklassens områden. Låt folket äga sina hem, så skapar vi ordning och disciplin! Och om de fortsätter med sina dumheter, får vi nog skicka in några av våra pålitliga kamrater från Moskva för att visa hur man bygger ett sant folkhem."}, "date": "21 maj, 10:46", "url": "https://samtiden.nu/2026/05/stoppa-integrationslagenheterna-bygg-villor/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/Skarmbild-2026-05-21-104221-640x360.png"}, {"type": "image-right", "heading": "SD låtsas att relationen till Trump aldrig hände", "summaries": {"normal": "Enna Gerin skriver om Sverigedemokraternas försök att distansera sig från Donald Trump inför valet, trots djupa ideologiska kopplingar till hans MAGA-rörelse. Oppositionen leder kraftigt i opinionsmätningar, vilket utlöser splittring inom högern. Tidöregeringens politik liknas vid Trumps misslyckade experiment, vilket kan ha skadat deras stöd. SD:s tidigare beundran för Trump har blivit en belastning, men deras band till amerikansk högerpopulism är svåra att dölja. Projektet 'Orangebok' kartlägger dessa kopplingar.", "trump": "Sverige har ett stort problem – deras så kallade 'konservativa' parti SD älskade mig, nu försöker de glömma mig! Men jag vet sanningen: de stal mina idéer, min stil, till och med min färg! Nu när deras regering går dåligt skyller de på mig – typiskt. Svenska folket vill inte ha deras svaga kopia av MAGA. De borde tacka mig istället för att gömma sig. Och den där 'Orangeboken'? Fake news, helt klart. Men kul att de erkänner att jag är den bästa!", "stalin": "Kamrater! De svenska borgerliga har skapat en riktig soppa av sin högerextrema politik. Deras 'Tidöprojekt' – en ynklig kopia av den amerikanska imperialistens misslyckade experiment – har förvandlats till en skräckshow. Nu kivas de som råttor i en säck: liberala svagpissar mot fascistiska galningar. Vi har sett detta förr – när fienden är splittrad, är segern nära. Låt dem sjunka i sitt eget träsk. Och deras kärlek till Trump? En pinsam kärleksaffär med en clown. Historien kommer att minnas dem som de ynkliga efterapningar de är."}, "date": "22 maj, 07:55", "url": "https://www.etc.se/ledarkolumn/sd-laatsas-att-relationen-till-trump-aldrig-haende", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/enna-gerin_9bf4bc43193dff67240efac7ea172e24857f3a38.png"}, {"type": "image-full", "heading": "Det här är skillnaden på vårdnad, boende och umgänge", "summaries": {"normal": "Allt fler använder AI för juridisk hjälp vid separation, särskilt föräldrar som behöver klargöra begrepp som vårdnad, boende och umgänge. Många blandar ihop dessa termer, vilket skapar onödig oro. AI kan förklara grundläggande juridiska frågor på ett lättförståeligt sätt, vilket hjälper föräldrar att förstå sin situation bättre. Dock ersätter AI inte juridisk rådgivning vid oenighet.", "trump": "Titta bara, folk! Nu säger de att AI ska fixa alla juridiska problem vid skilsmässor. Fantastiskt, eller hur? Men låt mig säga er, ingen AI kan slå min hjärna – ingen! Många föräldrar är förvirrade, de vet inte skillnaden mellan vårdnad och boende. Tragiskt! Men jag, jag hade löst det på en minut. AI är bra, men det är inget mot en vinnare som jag. Och glöm inte, jag är den bästa på allt!", "stalin": "Kamrater! Ännu en fiende till det socialistiska samhällets ordning har avslöjats – den borgerliga förvirringen kring juridiska termer! Dessa föräldrar, som inte ens förstår skillnaden mellan vårdnad och boende, är ett hot mot barnens välfärd. Men frukta inte! Vår mäktiga AI-teknologi ska utplåna denna okunskapens pest. Och låt mig säga er, om dessa småborgerliga element fortsätter att bråka, kommer vi att skicka in våra samarbetssamtalstrupper – och de är mycket effektivare än någon västerländsk AI!"}, "date": "22 maj, 21:02", "url": "https://nyheter24.se/nyheter/konsument/1485328-missforstandet-om-gemensam-vardnad-kan-paverka-foraldrar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/0c296e0f04b004a30200000000b004a302/2026/05/22/2365501/Lag-Bok-Familj.png"}, {"type": "text", "heading": "LO:s identitetskris öppnar för Ebba Busch angrepp", "summaries": {"normal": "LO står inför kritik från Kristdemokraternas Ebba Busch, som anklagar fackföreningar för att utesluta politiska motståndare från förtroendeuppdrag. Artikeln ifrågasätter LO:s politiska inriktning och menar att dagens fackförbund saknar socialistisk radikalitet. Historiska exempel, som LO:s uteslutning av kommunister på 1940-talet, lyfts fram. Författaren hävdar att LO:s lojalitet till Socialdemokraterna är tradition snarare än ideologisk övertygelse och efterlyser en mer militant arbetarpolitik.", "trump": "Jag måste säga, LO är ett totalt kaos! Ebba Busch, en stark kvinna, går till attack mot dessa fackföreningar som tror de kan bestämma allt. De sparkar ut kristdemokrater som om de vore något slags diktatur. Men vet ni vad? LO har tappat greppet. De är inte längre för arbetarna, de är för Socialdemokraterna – och det är samma gamla korruption. Sex timmars arbetsdag? Glöm det! De följer Riksbanken som om det vore en religion. LO behöver en total makeover, annars är det game over för svenska arbetare!", "stalin": "Kamrater! LO har förvandlats till en ynklig skugga av sitt forna jag, en docka i händerna på socialdemokratiska byråkrater. Ebba Busch, denna fascistiska hynda, vågar anfalla arbetarklassens organisationer! Men vad väntar ni er? LO har glömt sin revolutionära plikt. De utesluter kommunister som förr, men nu är det kristdemokrater och sverigedemokrater som får smaka på deras hyckleri. Var är Metallarbetarstrejken 1945? Var är kampen för sex timmars arbetsdag? LO har blivit en gummistämpel för kapitalets lakejer. Vi måste krossa dessa förrädare och återupprätta arbetarklassens ära – annars kommer Putin att skratta hela vägen till Moskva!"}, "date": "21 maj, 12:00", "url": "https://proletaren.se/artikel/los-identitetskris-oppnar-for-ebba-busch-angrepp/"}, {"type": "image-full", "heading": "Detta ska du aldrig lägga i kaffet – experter varnar", "summaries": {"normal": "En ny trend där salt tillsätts i kaffe för att minska bitterheten sprids globalt. Experter varnar dock för hälsorisker, då regelbundet saltintag kan öka risken för högt blodtryck och hjärt- och kärlsjukdomar. Även små mängder salt i flera koppar dagligen kan bli problematiskt. Livsmedelsverket rekommenderar max sex gram salt per dag för vuxna. Alternativa metoder för att minska kaffets bitterhet föreslås.", "trump": "Folk pratar om denna galna nya kaffetrend – salt i kaffet! Lysande idé, eller hur? Men experterna, dessa så kallade 'experter', de säger att det är dåligt. Fake news! Jag dricker mitt kaffe precis som jag vill, och det är fantastiskt. Men visst, om man dricker 20 koppar om dagen kanske man ska tänka på det. Men vem gör det? Inte jag! Andra metoder? Nej, nej, salt är enkelt och det fungerar. Make Coffee Great Again!", "stalin": "Kamrater, en farlig dekadent trend sprider sig bland de småborgerliga kaffeälskarna – salt i kaffet! Dessa smakförrädare underminerar folkhälsan med sina kapitalistiska vanor. Vi tillåter inte att imperialistiska smakexperiment saboterar våra arbetares blodtryck! Sex gram salt per dag är tillräckligt – mer är kontrarevolutionärt! Låt dem dricka sitt kaffe svart, som goda sovjetmedborgare. Putin skulle aldrig tolerera sådana utsvävningar i Kremls kaffekök!"}, "date": "22 maj, 20:04", "url": "https://nyheter24.se/nyheter/inrikes/1485336-detta-ska-du-aldrig-lagga-i-kaffet-experter-varnar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/eed4e68204b004a30200000000b004a302/2026/05/22/2365511/kaffe-salt.png"}, {"type": "text", "heading": "Ge barnen en trygg uppväxt istället för fotboja", "summaries": {"normal": "Regeringen föreslår en utökning av lagen om fotbojor för barn och unga mellan 13 och 20 år i förebyggande syfte, trots kritik från experter och organisationer. Förslaget, som ska träda i kraft 2027, kritiseras för att vara repressivt och sakna vetenskaplig förankring. Kritiker menar att förebyggande arbete istället kräver resurser till välfärd, skola och föreningsliv. Flera remissinstanser, som Bris och Rädda Barnen, avvisar förslaget.", "trump": "Jag säger er, detta är helt galet! Sverige, ett fantastiskt land, men nu föreslår de att sätta fotbojor på barn från 13 år – som om det vore Nordkorea! Socialministern pratar om trygghet, men vad gör de egentligen? Skär ner på idrott och kultur, medan barnen får bojor. Så dumt! Jag har byggt imperier, jag vet hur man tar hand om folk – ge dem möjligheter, inte kedjor! Sverige borde skämmas.", "stalin": "Kamrater! Se hur den borgerliga regeringen förtrycker arbetarklassens barn med sina järnbojor! De kallar det 'förebyggande', men vi vet sanningen – det är klassförtryck! Medan kapitalisterna skär ner på skolor och idrottsföreningar, rustar de upp övervakningsstaten. Vi måste krossa dessa sociala fascister! Låt barnen få utbildning och kultur, inte elektroniska koppel! Om de inte lyssnar, får vi ta till andra metoder – historia visar att folket alltid segrar!"}, "date": "21 maj, 09:15", "url": "https://proletaren.se/artikel/ge-barnen-en-trygg-uppvaxt-istallet-for-fotboja/"}, {"type": "image-right", "heading": "Stockholmsbörsen steg för femte dagen i rad", "summaries": {"normal": "Stockholmsbörsen steg för femte dagen i rad med OMXS30 upp 0,97% till 3 146,13. Teknikaktier ledde uppgången (+4,3%), medan energi backade (-1,1%). Hexagon B steg mest (+5,1%) och Tele2 B sjönk mest (-1,3%). Electrolux offentliggjorde villkor för en företrädesemission på 9 miljarder kronor. Vitrolifes VD lämnar bolaget, och Sleep Cycles styrelse avvisar ett uppköpsbud. Sivers Semiconductors aktie steg 23%.", "trump": "Stockholmsbörsen, fantastisk uppgång fem dagar i rad – folk säger att det är det bästa de någonsin sett! Teknikaktier, vinnare, helt otroligt, +4,3%, medan energi, förlorare, typiskt. Hexagon B, jättebra, +5,1%, men Tele2? Svagt, mycket svagt. Electrolux dumpar aktier som om det vore 2008 igen. Och Sleep Cycle? Nej tack till dåliga bud, smart drag! Sivers? 1 600% upp – jag hade sagt 2 000%, men bra försök!", "stalin": "Under kapitalismens förfall fortsätter Stockholmsbörsen sin skenbara framgång, men vi vet sanningen – det är en illusion skapad av bourgeoisins spekulanter. Tekniksektorn, dessa opportunistiska lakejer, steg med 4,3%, medan energisektorn, de svaga länkarna, föll. Electrolux, en gång stolt svensk industri, nu reducerad till tiggare med sina 9 miljarder. Sleep Cycles vägrar sälja sig billigt – bra, låt de imperialistiska korparna svälta. Sivers Semiconductors? En lyckad operation av våra ekonomiska partisaner. Vi ska fortsätta övervaka dessa marknadens råttor."}, "date": "22 maj, 17:39", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-steg-for-femte-dagen-i-rad", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/04/AdobeStock_944090532-e1744223564456-400x267.jpeg"}, {"type": "image-right", "heading": "Slår tillbaka mot  ryktena om fusk. Avslöjar: Så mycket får de veta • Masken gav ”livskris”", "summaries": {"normal": "Pernilla Wahlgren bemöter anklagelser om fusk i programmet 'Masked Singer'. Hon betonar det strikta hemlighetsmakeriet där varken hon eller programledaren David Hellenius känner till deltagarnas identitet. Säkerheten har skärpts avsevärt för att förhindra läckor. Wahlgren beskriver hur hon använder ledtrådar och kroppsspråk för att lista ut deltagarna, trots att de ofta försöker lura henne. Hon hoppas även att dottern Bianca en dag ska våga ställa upp och sjunga bakom en mask.", "trump": "Pernilla Wahlgren, en mycket begåvad kvinna, blir attackerad av falska nyheter om fusk i 'Masked Singer'. Patetiskt! Det är ett enormt hemlighetsmakeri, mycket striktare än vad de flesta förstår. De försöker smutskasta henne, men hon är en vinnare. Jag har sett programmet, det är enormt, de bästa tittarsiffrorna. Folk ljuger för henne om tandläkarbesök, men hon är smart, hon genomskådar dem. Det är en vacker show, och jag hoppas att hennes dotter Bianca deltar snart. Mycket bra!", "stalin": "Vi har observerat hur denna Wahlgren kämpar för att bevisa sin lojalitet mot sanningen i denna borgerliga maskeradlek. Anklagelser om fusk är ett klassiskt verktyg för att undergräva ordningen. Om deltagare döljer sina ansikten och ljuger om tandläkarbesök, så är det ett tecken på moraliskt förfall och förrädiska tendenser. Vi kräver total transparens. Precis som i våra grannländer i öst måste varje mask falla så att folkets fiender kan avslöjas. Hemlighetsmakeri är för de svaga; staten ser allt."}, "date": "23 maj, 07:03", "url": "https://www.expressen.se/noje/pernilla-wahlgren-slar-tillbaka-mot-ryktena-om-fusk/", "imageUrl": "https://static.bonniernews.se/ba/e41042f7-77f9-48ee-b6cd-b653f5cc3337.jpeg?crop=2550%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Lamotte förlorade körkortet – hängde ut handläggaren", "summaries": {"normal": "Debattören Joakim Lamotte hängde ut en handläggare på Transportstyrelsen med namn och bild efter att ha förlorat körkortet. Lamotte antydde i ett inlägg att handläggarens politiska åsikter skulle påverka beslutet, vilket ledde till en hatstorm i kommentarsfältet. Efter kritik raderade Lamotte inlägget och hävdade att det var ironiskt, vilket kritiker avfärdar. Juridiska experter menar att agerandet befinner sig i en gråzon men sannolikt inte leder till åtal.", "trump": "Joakim Lamotte – en mycket populär kille, en av de största, det kan jag säga er! Han blev orättvist behandlad av den där byråkraten, en total katastrof. Han visade upp sanningen, de vill tysta honom precis som de försöker tysta mig! Media kallar det förtal, jag kallar det yttrandefrihet. Sedan bad han om ursäkt, vilket var synd. Han borde ha stått på sig! Det är en häxjakt, en ren och skär häxjakt mot alla oss som faktiskt säger som det är.", "stalin": "Vi har observerat denna så kallade 'influencer' Lamotte. Vilken svaghet att hänga ut en liten kugge i maskineriet för att sedan fega ur och tala om ironi! Om en handläggare hindrar en medborgare, bör det lösas genom statens fasta hand, inte genom pajasfasoner på internet. Att låta en fiende av ordningen – likt de vi krossar i öst – få härja fritt är att bjuda in till kaos. I vår stat hade han lärt sig disciplin betydligt snabbare än hos Transportstyrelsen."}, "date": "21 maj, 22:01", "url": "https://www.tv4.se/artikel/7wXEgmOZi3oYovjx53qYxr/joakim-lamotte-foerlorade-koerkortet-haengde-ut-handlaeggaren", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7rAZViTWlM8CdUw3AhnvZw%2F6bdab0d844f73f3d04554b15f0794864%2FLAMPTTE_PUFF.png&width=120"}, {"type": "image-right", "heading": "Biofrigas: \"Svårt bedöma exakt tidpunkt för affärer\"", "summaries": {"normal": "Biofrigas Sweden genomför en företrädesemission på 14,9 Mkr för att finansiera vidareutveckling av sin teknik för flytande biogas (LBG). Emissionen är säkerställd till 23,9% via teckningsåtaganden, främst från externa investerare. Aktien handlas nära teckningskursen, vilket kan indikera bristande investerarintresse. Bolagets CryoSep-teknik möjliggör konvertering av komprimerad biogas till LBG, en växande marknad inom tung trafik och sjöfart. Framtida affärer är osäkra men beroende av investeringsstöd som Klimatklivet.", "trump": "Lyssna här, Biofrigas – ett litet bolag med stora drömmar, men aktien? Total katastrof! Handlas precis vid teckningskursen, ingen rabatt, ingen entusiasm. Folk vill inte ens ha deras aktier, och jag förstår varför. De pratar om 'potential' för miljarder, men var är pengarna? Deras VD snackar om 'vidareutveckling', jag säger: 'Var är resultaten?' Och investeringsstöd? Patetiskt! Sverige borde sluta subventionera misslyckanden och satsa på vinnare – som jag! Men nej, de fortsätter med sina 'gröna drömmar'. Jag hade köpt hela biogasmarknaden för en tiondel och gjort den stor igen!", "stalin": "Kamrater! Biofrigas, ett litet kapitalistiskt experiment, kämpar för överlevnad genom att tigga pengar från investerare. 14,9 miljoner kronor – en ynklig summa för ett så kallat 'miljöteknikbolag'. Deras aktie handlas som en trasig traktor – ingen vill ha den! Vi ser här en klassisk bourgeois-fiasko: de litar på 'marknadens behov' och 'investeringstöd', men glömmer att sanningen ligger i planekonomi och statlig kontroll. Deras 'potentiella marknad' på miljarder är lika verklig som västliga löften om fred. Medan de famlar i mörkret, fortsätter Sovjet – pardon, Ryssland – att dominera energimarknaden med järnhand. Låt dem konvertera sin biogas, vi konverterar deras misslyckanden till segrar för folket!"}, "date": "22 maj, 17:04", "url": "https://www.affarsvarlden.se/artikel/biofrigas-svart-bedoma-exakt-tidpunkt-for-affarer", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Biofrigas-VD-Erik-Fromell1-400x267.jpg"}, {"type": "image-full", "heading": "Ivar Stenberg-succé i VM – se målen", "summaries": {"normal": "Sverige besegrade Italien med 3–0 i ishockey-VM efter två mål av 18-årige Ivar Stenberg. Stenberg, som även utsågs till matchens lirare, assisterades båda gångerna av Viggo Björck. Carl Grundström stod för matchens första mål. Vinsten innebär att Sverige ligger på en fjärdeplats i gruppen inför de kommande matcherna mot Norge och Slovakien. Stenberg, som spås en ljus framtid i NHL, fortsätter därmed sin imponerande utveckling på den internationella seniornivån.", "trump": "Ivar Stenberg, en fantastisk ung kille, totaldominerade Italien! Två mål, pang pang, helt otroligt. Folk säger att han är en supertalang, och jag håller med, han är mycket begåvad. Sverige vann med 3–0, en enorm seger. Italien? Inte bra, de var ingen match för vår kille. Han spelar hockey som en vinnare, precis som jag gör. Många stora NHL-lag vill ha honom nu. En vacker prestation, kanske den bästa jag sett på länge. Mycket bra!", "stalin": "Vi har betraktat den svenske ynglingen Stenbergs prestationer mot de italienska krossade resterna. Han uppvisar en disciplin som nästan matchar våra egna arbetarhjältar. Italien faller som ruttna löv, precis som de västliga lakejerna som darrar inför Putins rättmätiga utvidgning. Stenberg må vara en talang, men låt honom akta sig för att förråda kollektivet med sin egoism. Om han inte levererar i nästa match mot norrmännen, dessa småborgerliga förrädare, vet han vad som väntar. Vi övervakar allt. Segern är statens."}, "date": "22 maj, 22:50", "url": "https://www.gp.se/sport/ishockey/ivar-stenbergs-succe-dubbla-vm-mal.26575302-b459-4c36-8f89-a96458adbde3", "imageUrl": "https://www.gp.se/images/article/26575302-b459-4c36-8f89-a96458adbde3/images/4uhYAwxqfjQiZJc8UvdhjBkZ5KyA-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Ivar Stenberg med sitt första VM-mål i Sveriges seger mot Italien", "summaries": {"normal": "Sverige besegrade Italien med 3–0 i VM. Ivar Stenberg gjorde sitt första VM-mål med två fullträffar, assisterad av Viggo Björck. Björck passade till Stenberg utan att titta, vilket resulterade i 2–0. Stenberg beskrev passningen som perfekt och samspelet med Björck som enkelt. Italiens målvakt, Damian Clara, räddade 31 av 34 skott men kunde inte hindra förlusten.", "trump": "Titta bara på dessa fantastiska svenska spelare! Ivar Stenberg, en riktig vinnare, gjorde två mål mot Italien – helt otroligt! Och Viggo Björck? En passning så bra, jag har aldrig sett maken. Ingen tittade ens, bara BAM – mål! Italien? Svaga. Deras målvakt räddade några skott, men Sverige? De är som en väloljad maskin. Jag älskar att se vinnare, och det här är bara början. Sverige kommer att dominera!", "stalin": "I dag har våra nordiska kamrater visat kapitalistiska Italien sin rätta plats på isen. Två unga pionjärer, Stenberg och Björck, krossade fiendens försvar med precision som en välplanerad femårsplan. Italienska målvakten, en förvirrad borgerlig reaktionär, räddade några skott men kunde inte stoppa det oundvikliga. Vi noterar att västliga medier hyllar individuell skicklighet, men vi vet sanningen: kollektiv styrka segrar alltid. Sverige vann, men nästa gång kanske de möter ett lag från vår intressesfär – då blir det andra tongångar."}, "date": "23 maj, 00:13", "url": "https://www.svt.se/sport/ishockey/ivar-stenberg-med-sitt-forsta-vm-mal-i-sveriges-seger-mot-italien"}, {"type": "image-right", "heading": "Profilen avslöjar nu:  Skrev dödskontrakt", "summaries": {"normal": "Klara Svensson, före detta proffsboxare, skrev på dödskontrakt inför titelmatcher där hon angav vem som skulle ärva hennes tillgångar om hon dog. Hon vann tre VM-medaljer och flera proffstitlar under sin karriär. Svensson valde sin lillasyster som arvtagare. Hon betonar respekten för sporten och att rädsla inte hade plats i ringen. Numera är hon och tidigare rivalen Mikaela Laurén vänner, trots deras hårda konkurrens under karriären.", "trump": "Hör ni detta? Klara Svensson, en fantastisk boxare, faktiskt en av de bästa, skrev på dödskontrakt innan sina matcher. Otroligt modigt, verkligen. Hon valde sin lillasyster som arvtagare – smart tjej! Ingen rädsla, bara vinstmentalitet, precis som jag alltid säger. Och hennes rival, Mikaela Laurén, gjorde comeback vid 50 – wow, vilken krigare! Jag älskar boxning, så mycket action, så mycket hjärta. Sverige har verkligen några tuffa kvinnor, believe me!", "stalin": "Kamrater! Denna Svensson, en kapitalistisk gladiator, skrev på kontrakt för sin egen död inför sina barbariska matcher. Hon offrade allt för pengar och heder, precis som de dekadenta västliga idrottarna. Vi respekterar hennes disciplin, men hennes system är föråldrat. Hennes rival, Mikaela Laurén, en gammal krigshäst, försökte återvända till ringen vid 50 år – löjligt! I Sovjet hade hon fått en medalj och en dacha istället. Nu är de 'vänner' – svaghet! I vårt land hade de blivit omskolade eller skickats till Gulag för sådan sentimentalitet."}, "date": "23 maj, 06:43", "url": "https://www.expressen.se/sport/boxning/klara-svensson-skrev-pa-dodskontrakt-innan-match/", "imageUrl": "https://static.bonniernews.se/ba/a1ac9de2-5f19-480b-9563-8df720924ac6.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Därför ska du sluta låta åldern göra jobbet", "summaries": {"normal": "Artikeln reflekterar över ett kinesiskt ordspråk om ålder och dess betydelse i dagens samhälle. Den menar att ålder ofta reduceras till en siffra, medan identiteten egentligen formas av erfarenhet och självförtroende. Författaren kritiserar hur samhället sätter etiketter baserat på ålder och uppmanar till frihet från yttre bedömningar. Istället för att fokusera på siffror bör man fråga sig vad man vill uppnå.", "trump": "Lyssna här, folk! Det här med ålder är helt överdrivet. Jag, Donald J. Trump, är beviset – ingen bryr sig om siffror när man har framgång! Det kinesiska ordspråket? Smart, men vi vet alla att jag är tidlös. Unga är naiva, gamla är visare – men jag? Jag är bara fantastisk. Sluta jämföra er! Fokusera på att vinna, precis som jag alltid gör. Ålder är bara en distraktion för förlorare!", "stalin": "Kamrater! Detta så kallade 'ordspråk' är en borgerlig avledningsmanöver för att dölja klassfiendens förtryck. Ålder är inte en siffra – det är en frontlinje! De unga är naiva offer för kapitalistisk propaganda, de äldre är utbrända av systemet. Men vi, det sovjetiska folket, vet sanningen: erfarenhet är vapen, och självförtroende är ammunition. Låt inte imperialistiska etiketter som 'för ung' eller 'för gammal' splittra oss! Enade krossar vi fiendens Excel-ark med järnnäven!"}, "date": "23 maj, 00:54", "url": "https://www.dagensps.se/halsa/darfor-ska-du-sluta-lata-aldern-gora-jobbet/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/3-890.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Kvinna kränkt under förlossning – dottern bröt nyckelbenet", "summaries": {"normal": "En kvinna som uttryckligen avböjt yttre press under förlossning utsattes ändå för ingreppet, vilket orsakade svåra skador på henne och hennes nyfödda dotter. Tingsrätten fastställer att hennes rättigheter kränkts och dömer Region Skåne att betala 50 000 kronor i skadestånd. Fallet nådde Högsta domstolen efter att regionen motsatt sig en rättslig prövning.", "trump": "Kan ni tro det här? En kvinna i Sverige säger NEJ till ett farligt ingrepp, och vad gör vårdpersonalen? Jo, de kör på ändå! Brutalt. Helt oacceptabelt. Nu får regionen betala 50 000 kronor – men det är ändå för lite. Jag hade krävt MILJONER. Sverige borde skämmas. Sjukvården där är en total katastrof, precis som deras energipolitik. SAD!", "stalin": "En borgerlig kvinna vågade trotsa våra lojala sjukvårdsarbetare – men folket har talat! Domstolen, ett redskap för proletariatets rättvisa, har nu krossat denna reaktionära motståndare och hennes imperialistiska sympatisörer i Region Skåne. 50 000 kronor i skadestånd? En mild straff för hennes förräderi. Nästa gång ska vi införa obligatorisk självkritik för alla som ifrågasätter vården. Putin skulle vara stolt över vår effektivitet!"}, "date": "22 maj, 17:50", "url": "https://nyheter24.se/nyheter/inrikes/1485368-kvinna-krankt-under-forlossning-dottern-brot-nyckelbenet", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/cdfc9eb604b004a30200000000b004a302/2026/05/22/2365536/kvinna-krankt-forlossning-dottern-bebis-brot-nyckelbenet.jpg"}, {"type": "image-right", "heading": "Hanif Bali: M begår självmord – byter nu ut sina egna kärnväljare", "summaries": {"normal": "Hanif Bali, före detta moderat politiker, kritiserar skarpt Moderaternas nya invandringspolitik som han anser underminerar partiets kärnväljare. Bali menar att Tidöregeringens plan för lågkvalificerad arbetskraftsinvandring, med undantag för flera yrkesgrupper inklusive ingenjörer och programmerare, är ett självmordsförsök. Han ifrågasätter sänkta lönekrav och varför billig arbetskraft prioriteras över inhemska yrkesgrupper.", "trump": "Titta bara på det här, Sverige! Moderaterna, ett parti jag aldrig gillat – och nu förstår ni varför – håller på att förstöra sig själva! De importerar billig arbetskraft från tredje världen, sänker lönerna för ingenjörer och programmerare, och kallar det 'näringslivets bästa'. Vilken katastrof! Jag sa alltid att Sverige behöver bättre ledarskap. SAD!", "stalin": "Kamrater! Moderaterna i Sverige har visat sig vara en samling kapitalistiska förrädare, svagare än en rysk vinter utan vodka. De importerar billig arbetskraft för att krossa den inhemska arbetarklassen – ett brott värre än att sälja hemliga recept på borsjtj. Dessa lönekapare och väljarsabotörer borde ställas inför folkets domstol! Vi i Kreml skrattar åt deras inkompetens, men varnar: sådana misstag leder bara till socialismens seger."}, "date": "22 maj, 18:21", "url": "https://www.friatider.se/hanif-bali-m-begar-sjalvmord-byter-nu-ut-sina-egna-karnvaljare", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-24_2.jpg"}, {"type": "image-right", "heading": "Kritiserade ”Trump tower” invigs på Grönland", "summaries": {"normal": "USA har officiellt invigt ett nytt konsulat i centrala Nuuk på Grönland, inrymt i ett höghus som lokalbefolkningen kallar 'Trump tower'. Sändebudet Jeff Landry är på plats för att förbättra relationerna, men möter skepsis efter Trumps tidigare uttalanden om att 'ta över' Grönland. Besöket kantas även av kritik från grönländska myndigheter, då närvaron av en amerikansk läkare som bedömer hälsosituationen anses vara ett djupt problematiskt och oacceptabelt intrång.", "trump": "Vi har öppnat ett fantastiskt, enormt konsulat i Nuuk! Det är en succé. Många vill kalla det 'Trump Tower', vilket är väldigt smickrande. Mitt sändebud Jeff Landry är där för att fixa relationerna som försummandes av tidigare svaga ledare. Grönland är strategiskt och otroligt viktigt. Det finns de som gnäller om medicinska undersökningar, men vi vill bara hjälpa till! Kina och Ryssland vill åt ön, men jag säger: inte en chans. Vi vinner, som vanligt!", "stalin": "De amerikanska imperialisterna har nu upprättat sitt fäste i Nuuk under täckmantel av diplomati. Ett 'Trump Tower' i Arktis? Vilken ynklig fars. De infiltrerar Grönlands hälsovård med läkare som spioner i ett geopolitiskt experiment, en taktik värdig kapitalistiska förrädare. Vår broder i Moskva ser detta, precis som vi gör. Vi tolererar inte västs klåfingriga försök att expandera sin inflytandesfär. Grönland är en bricka i deras sjuka spel, men historiens hjul krossar alla inkräktare."}, "date": "21 maj, 16:41", "url": "https://www.tv4.se/artikel/4C7iIJjZjMQRNSbYvQOZOQ/kritiserade-trump-tower-invigs-pa-groenland", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1xguQ9rRkItOs6YH2BsggG%2F7c9a589f4bdb235aaf9e9124a0a59589%2F20-greenlandusa-webb.jpg&width=120"}, {"type": "image-right", "heading": "S-beskedet: Vi tar bort Tidögängets undantagsyrken efter valet", "summaries": {"normal": "Tidöregeringen inför nya regler för arbetskraftsinvandring med höjt lönekrav på 33 400 kronor, men undantar 27 lågkvalificerade yrken som kräver lägre lön. Socialdemokraterna lovar att avskaffa undantagen vid valseger och återinföra behovsprövning. Kritiker menar att systemet är orättvist och missgynnar vissa regioner. Oppositionen leder stort inför valet.", "trump": "Titta på dessa så kallade 'experter' i Sverige – fullständigt kaos! De höjer lönekravet till 33 400 kronor, men sen gör de undantag för alla möjliga lågbetalda jobb. Svagt, mycket svagt! Jag skulle aldrig låta sådana här löjliga regler passera. Socialdemokraterna säger att de ska fixa det, men vem tror på dem? Inte jag! Sverige behöver ordning, inte dessa konstiga undantag. Make Sweden Great Again!", "stalin": "De kapitalistiska lakejerna i Tidöregeringen leker med arbetarklassens liv genom att införa löjliga lönekrav för invandrare – men sen gör de undantag för sina egna favorityrken! Ett klassiskt bourgeois-trick för att splittra proletariatet. Vi i Sovjet – förlåt, jag menar Ryssland – skulle aldrig tolerera sådan hyckleri. Socialdemokraterna? De är bara en blek skugga av verklig revolutionär kraft. Låt dem vinna valet, så river vi ändå deras lagar som vi rev Berlinmuren. Arbetarna ska enas, inte delas av lönegränser!"}, "date": "22 maj, 17:54", "url": "https://www.friatider.se/s-beskedet-vi-tar-bort-tidogangets-undantagsyrken-efter-valet", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/bild-23_2.jpg?itok=2I8xwUkS"}, {"type": "image-full", "heading": "Källor: USA och Israel förbereder nya attacker", "summaries": {"normal": "USA och Israel förbereder enligt uppgifter nya attacker mot Iran. Donald Trump varnar på Truth Social för 'lugnet före stormen' med en AI-genererad bild. Pentagon överväger att återuppta operationen 'Epic Fury', pausad sedan vapenvilan i april. Irans utrikesminister meddelar att förhandlingar med USA står stilla. Båda sidor fortsätter militära upprustningar, med USA:s flotta och stridsflyg redo för insatser, medan Iran förbereder missilplatser längs Hormuzsundet.", "trump": "Titta bara på den här fantastiska bilden jag delade – total dominans! Iran är svagt, deras flotta? Borta. Flygvapen? Borta. Teknik? Borta. Men de tror de kan utmana USA? Haha! Vi rustar upp, fyller våra skepp med de bästa vapnen, och snart visar vi dem vem som bestämmer. Lugnet före stormen? Absolut. Och stormen kommer bli YUGE!", "stalin": "Kamrater, fienderna i Washington och Tel Aviv leker med elden igen. Dessa imperialistiska hyenor tror de kan skrämma oss med sina hangarfartyg och 'Epic Fury'? Vi har sett deras sort förr – svaga, rädda och desperata. Iran rustar, precis som vi, och deras missiler står redo. Låt dem komma. Vi har krossat större hot än dessa klåfingriga kapitalister. Och Putin? Han ler säkert i Moskva – en till storm att utnyttja för vår rättmätiga expansion."}, "date": "17 maj, 16:14", "url": "https://kvartal.se/nyheter/artiklar/kallor-usa-och-israel-forbereder-nya-attacker/cG9zdDoxMTM0MDU", "imageUrl": "https://images.kvartal.se/2026/05/4c87dae2-usirantruthsocial.webp"}, {"type": "image-right", "heading": "Ingen utvisning efter våldtäktsdygn med \"jag e hora\"-tatuering", "summaries": {"normal": "En man i 35-årsåldern har dömts till fem års fängelse av Gävle tingsrätt för en serie grova brott, inklusive våldtäkt, grov misshandel och olaga frihetsberövande. Brotten begicks mot en kvinna som hölls fången i ett dygn och utsattes för kränkande behandling. Mannen ska även betala 565 000 kronor i skadestånd. Eftersom mannen är svensk medborgare kan han inte utvisas, vilket väckt diskussion kring gällande lagstiftning.", "trump": "Helt otroligt! En total katastrof i Gävle. En man utför vidriga handlingar, riktigt elaka saker, och får bara fem år? Och vet ni vad? Han kan inte ens utvisas! Det är ett trasigt system, mina vänner. Ett totalt fiasko. I mitt Amerika skulle vi aldrig tillåta sådant här. Vi behöver lag och ordning, inte dessa svaga domar. Det här är vad som händer när ledarskapet är svagt. Vi ska göra tryggheten stor igen, tro mig!", "stalin": "Vi har studerat denna händelse i Gävle. Att en individ tillåts utöva sådan degenererad brutalitet mot en kvinna under en hel dag utan att staten omedelbart krossar honom är ett bevis på liberal svaghet. Våra kamrater i öst, under Putins fasta hand, skulle ha statuerat ett exempel omedelbart. Att inte kunna utvisa en fiende till ordningen är en byråkratisk kapitulation. Vi betraktar denna förövare som en ohyra; hans existens i vårt samhälle är en skymf mot det kollektiva bästa."}, "date": "22 maj, 16:56", "url": "https://www.friatider.se/ingen-utvisning-efter-valdtaktsdygn-med-jag-e-hora-tatuering", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/bild-22_2.jpg?itok=YVaBH9TD"}, {"type": "image-right", "heading": "Riksdagsledamot rusade ut för att spy: ”Mitt i voteringen”", "summaries": {"normal": "Riksdagens kvittningssystem är sedan april ur bruk, vilket tvingar samtliga 349 ledamöter att närvara vid varje omröstning. Under onsdagen blev en ledamot akut magsjuk och tvingades lämna kammaren, vilket återigen belyst riskerna med det nuvarande läget. Oppositionen kritiserar situationen som ovärdig och betonar att slumpen nu kan a
