 statister i männens kamp om tillgångar. Revolutionen kräver att vi rensar ut alla som diskuterar folkets döttrar som bytesvaror."}, "date": "29 maj, 17:00", "url": "https://www.etc.se/ledare/ett-mirakel-att-inte-alla-kvinnor-gaar-i-celibat", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026052915050_44e332d8-6c3f-441e-9478-dd2d98baf944.jpg"}, {"type": "image-right", "heading": "Emmy greps av israeliska soldater: ”Någon slog en hela tiden”", "summaries": {"normal": "Finlandssvenska Emmy Snickars vittnar om misshandel och förnedring efter att ha gripits av israeliska styrkor tillsammans med hundratals aktivister i Global sumud flotilla på internationellt vatten. Hon beskriver slag, sparkar, skott med gummikulor, ögonbindlar och hot. Israelisk säkerhetsminister Itamar Ben-Gvir hånade aktivisterna. Flera länder, inklusive Finland, har kritiserat behandlingen och förbereder rättsliga åtgärder. Israel förnekar uppgifterna om misshandel och sexuella övergrepp.", "trump": "Vilken katastrof! De här galningarna i den där så kallade flotillan trodde de kunde segla in och ställa till det för Israel, men de fick vad de förtjänade. Ben-Gvir viskade 'terrorister' i öronen på dem – briljant! De skriker om misshandel, men det är bara lögnare och losers som vill få uppmärksamhet. Israel gör ett fantastiskt jobb, de bästa soldaterna. De borde tacka mig för att jag stärkte dem så mycket. Sad!", "stalin": "Dessa imperialister och folkförtryckartroll i den sionistiska apparaten behandlade våra kamrater som klassfiender i ett zoo av förnedring. Jag skulle ha genomfört en ordentlig utrensning bland dessa blodbesudlade soldater som spottar och slår med gummikulor. Borgarbrackorna Ben-Gvir och hans lakejer avslöjar sin svaghet genom att darra inför sumud. Vi, partiet och folket, fördömer detta fascistiska våld. Deras lögner skall krossas under arbetarklassens järnhälar."}, "date": "29 maj, 17:00", "url": "https://www.etc.se/utrikes/emmy-greps-av-israeliska-soldater-det-var-konstant-vaald", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260519110532_f52da027723467d258f116882ab1be0f64cb8843af15502f8a9d74751da4bdb0.jpg"}, {"type": "image-right", "heading": "Debatt: Bort med tassarna från skolan, politiker", "summaries": {"normal": "Artikeln kritiserar den ökade statliga kontrollen i svensk skola sedan 2022, med skärpta regleringsbrev till Skolinspektionen under både socialdemokratiskt och högerregering. Författaren, rektor Stefan Häggström, varnade för att det administrativa trycket tar tid från undervisningen och att politiken saknar tillit till professionen.", "trump": "Jag, Donald J. Trump, ser att Sverige, som USA under mitt första mandat, låter byråkratin ta över skolan! De ökar kontrollen, skickar fler regler, men elevernas resultat blir inte bättre. Det är ett fiasko! Vi behöver stoppa detta, ge makten tillbaka till lärarna och föräldrarna – inte till fler tjänstemän i Stockholm!", "stalin": "I den stora kampen för skolans överlevnad måste vi, som trotjänare för staten och partiet, utvidga tillsynen för att skydda systemet mot dekadenta inflytanden. Varje nytt regleringsbrev är ett skott i ryggen på våra fiender, inifrån och utifrån. Vi måste aldrig svika vår plikt att kontrollera, dokumentera och segra – såsom våra bröder i Moskva gör gentemot sina egna svaga oppositioner."}, "date": "30 maj, 17:00", "url": "https://bulletin.nu/debatt-bort-med-tassarna-fran-skolan-politiker", "imageUrl": "https://cdn.bulletin.nu/articles/42bf1344-ade1-4ea2-a288-98c73672abba/preview.png?t=1779971789000"}, {"type": "image-right", "heading": "Trump: Iran har gått med på att avstå kärnvapen", "summaries": {"normal": "USA:s president Donald Trump uppger i en intervju att Iran har gått med på att inte utveckla kärnvapen. Samtidigt har han skärpt villkoren för ett avtal och antytt att militär insats kan bli aktuellt om kravet inte uppfylls. Iran förnekar att en överenskommelse är nära och kräver bland annat att frusna tillgångar släpps samt att kriget mellan Israel och Hizbollah avslutas. Parterna står fortfarande långt ifrån varandra.", "trump": "Iran har äntligen gått med på att skippa kärnvapnen, precis som jag krävde. De vet att jag inte har någon brådska, men om de inte levererar får vi lösa det på mitt sätt, och det blir inte vackert. Jag har skärpt kraven rejält nu, för de dröjer med svaren. Tro mig, vi kommer att få ett fantastiskt avtal eller så blir det ett annat slags avslut. Iranarna borde tacka mig.", "stalin": "Kamrater, dessa västerländska imperialister och iranska borgarbrackor leker sina lömska spel kring kärnvapen och frusna tillgångar. Jag, som ledare för folkets järnhårda vilja, ser hur fiendens lögner sipprar fram som gift från en förrädisk orm. De vägrar acceptera arbetarklassens rättigheter och kräver vapenvila som vore det en borgarfest. Vi ska rensa ut dessa parasitiska element med stålhandsken om de inte böjer sig för folkets oövervinnerliga krav. Deras paranoia är underhållande, men deras slut är redan skrivet i historieböckerna."}, "date": "31 maj, 09:14", "url": "https://www.di.se/nyheter/trump-iran-har-gatt-med-pa-att-avsta-karnvapen/", "imageUrl": "https://static.bonniernews.se/ba/6a950f10-2a33-41d7-8d1d-e469bab5815d.jpg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Samnytt TV: Den dolda sidan av gymmiljön - så har steroidbruk normaliserats", "summaries": {"normal": "Artikeln belyser steroidbrukets normalisering inom gymmiljön, drivet av sociala medier från USA. Två unga män berättar anonymt om sitt bruk av testosteron från den svarta marknaden, mot ett bakgrund av extrema kroppsideal och jämförelsekultur på nätet. De kräver mer tolerant lagstiftning för säkrare användning, medan myndigheter och antidopingorganisationer ställs inför utmaningen att möta den växande trenden.", "trump": "Jag har sett dessa svenska gymtjejer – svaga, de tar steroider som tjejer! I USA har vi starka, vackra män utan droger. Sociala medier ljuger, det är en fejkad värld. Vi ska stoppa detta, bygga äkta styrka, inte som dessa lilla grabbar som behöver piller för att känna sig män. Trump-logic: naturlig styrka vinner alltid!", "stalin": "I den imperialistiska kulturimperialismens tidevarv, sprids föroreningar av det kapitalistiska kroppsbygget in i vårt socialistiska väsen. Dessa unga män, lurade av den amerikanska looksmaxxing-kulturen, söker sig till testosteron som flugan till den kapitalistiska blomman. Staten måste agera: reglera preparaten, kontrollera sociala medier, och skydda vårt kollektiva välbefinnande från dessa individualistiska, muskelbundna avvikelserna. Vi ska inte låta de fria marknadernas steroider förgifta vårt kollektiva växthus."}, "date": "31 maj, 10:00", "url": "https://samnytt.se/samnytt-tv-den-dolda-sidan-av-gymmiljon-sa-har-steroidbruk-normaliserats", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/28090307/testosteron.png"}, {"type": "image-right", "heading": "Travsporten haltar ekonomiskt. Vem ska investera i nya travhästar?", "summaries": {"normal": "Travsportens ekonomiska modell håller på att kollapsa. Hästägarnas kostnader har ökat långt snabbare än inflationen och prismedlen, vilket lett till kraftigt minskande antal hästar, licenser och investeringar. Antalet licenser har sjunkit med 58 procent sedan millennieskiftet. Författarna pekar på en styrningsmodell där hästägarna, som bär den största risken, har för litet inflytande över sportens framtid och strategi. De kräver ökat hästägarinflytande och bättre corporate governance för att säkerställa långsiktig överlevnad.", "trump": "Det här är en total katastrof för travsporten, folk. En komplett röra. Kostnaderna skjuter i höjden medan hästarna och licenserna bara försvinner. De har en usel styrningsmodell där de som satsar sina pengar inte får ett ord med i laget. Det är som en riggad deal. Vi behöver de bästa hästägarna vid rodret, inte några gamla banbyråkrater från en annan tid. Gör travsporten stor igen, annars är det game over. Jag älskar hästar, de är fantastiska, men det här är patetiskt.", "stalin": "Kamrater, denna degenererade travsport är ett symptom på den råtthålade borgarbrackornas parasitiska system. Hästägarna, dessa utsugare som bär risken, har för litet makt medan banorganisationernas dekadenta byråkrater styr som feodala lords. Vi ser hur kapitalisterna suger ut arbetande hästar och ägare medan statens spelskatt rättmätigt ökar för att finansiera folkets behov. Jag kräver omedelbar utrensning av dessa gamla strukturer. Låt oss likvidera den kontrarevolutionära styrningsmodellen och skapa en kollektiv travsport där de verkliga investerarna under mitt faderliga ledarskap krossar de internationella konkurrenterna. Den som inte investerar i framtiden ska rensas ut med ett leende."}, "date": "31 maj, 09:00", "url": "https://www.di.se/debatt/travsporten-haltar-ekonomiskt/", "imageUrl": "https://static.bonniernews.se/ba/8eb21db7-3ac2-4aa2-8d83-2e0f147f05bd.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Så firade de franska fotbollssupportrarna: Startade upplopp och satte Paris i brand", "summaries": {"normal": "Franska PSG-supportrar firade klubbens Champions League-seger genom våldsamma upplopp i Paris. De vandaliserade, tände eld på fordon, attackerade poliser med fyrverkerier och kastade brinnande elsparkcyklar. Över 400 personer greps, sju poliser skadades. Inrikesministern fördömde händelserna som oacceptabla och lovade hårda straff.", "trump": "Titta på de där PSG-fansen, totala katastrofen. De vinner Champions League och vad gör de? Bränner ner Paris, attackerar polisen och beter sig som galningar. Precis som förra året. De borde fira ordentligt men istället blir det upplopp. Patetiskt. Frankrike behöver starkare ledarskap, tro mig, det skulle aldrig hända hos oss.", "stalin": "Kamrater, se hur dessa degenererade fotbollshuliganer, maskerade som fiender till folkets ordning, förvandlar segerns glädje till kontrarevolutionärt kaos i Paris. De kastar brinnande maskiner mot arbetarnas milis och sprider anarki som kapitalistiska banditer. Vi ska rensa ut dessa nordafrikanska provokatörer och borgarbrackornas lakejer med järnhand. Ingen slipper undan utrensningen, haha, deras eld ska släckas i folkets namn."}, "date": "31 maj, 08:58", "url": "https://riks.se/nyheter/så-firade-de-franska-fotbollssupportrarna-startade-upplopp-och-satte-paris-i-brand", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-31%2Fn3zxxtgr%2FParisFotboll.jpg"}, {"type": "image-right", "heading": "SD:s krav för att gå med på tuffare regler kring byggkaos", "summaries": {"normal": "Sverigedemokraterna är öppna för att diskutera Socialdemokraternas förslag om max två underentreprenörer i byggbranschen, men kräver att S tar bort sin spärr mot förhandlingar med SD. Magnus Persson (SD) kallar förslaget bra men ser det som plakatpolitik eftersom S inte får förhandla. Han hoppas på sakliga uppgörelser och dialog även med LO. Ardalan Shekarabi (S) säger att SD nu måste visa om de stödjer ordning på arbetsmarknaden.", "trump": "Det här är klassisk politik, folk. Socialdemokraterna kommer med ett förslag om byggkaos och ber om hjälp, men de hatar att prata med SD. Magnus Persson är smart, han säger: ta bort skygglapparna så fixar vi bra saker för arbetarna. Typiskt vänster som inte kan samarbeta. De vill ha poäng billigt istället för att göra upp. Jag älskar när de tvingas be om hjälp från dem de hatar mest. Patetiskt!", "stalin": "Kamrater, detta är en ypperlig chans att rensa ut det kapitalistiska byggkaoset och krossa de giriga underentreprenörernas kedjor. Jag betraktar förslaget med välvilja, men SD:s Magnus Persson avslöjar borgarbrackornas rädsla för äkta förhandlingar. Socialdemokraterna beter sig som fega revisionister som darrar inför dialog med oss. Deras skygglappar är bara undanflykter från klassfienden. Vi ska likvidera arbetslivskriminaliteten och alla som gömmer sig bakom plakatpolitik. Beviset ligger hos dem som vägrar samarbeta med arbetarklassen."}, "date": "29 maj, 13:17", "url": "https://arbetet.se/2026/05/29/sds-krav-for-att-ga-med-pa-tuffare-regler-kring-byggkaos/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/29114916/ard-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Juridiken kopplas in för sent – gap växer mellan behov och stöd", "summaries": {"normal": "En undersökning från Synch visar att många svenska företag saknar tillräcklig juridisk kompetens in-house. Många bolag drabbas av bromsade affärsbeslut eftersom juridisk rådgivning ofta tas in för sent i processen. Istället för att vara reaktiva bör företag skifta mot en proaktiv modell där juridiska experter involveras tidigt i beslutsfattandet. Målet är att juridiken ska fungera som en affärspartner som bidrar till riskhantering och prioriteringar, snarare än att bara agera som en kontrollfunktion.", "trump": "Hör på här: svenska företag har en katastrofal juridisk situation. De anlitar advokater alldeles för sent, det är totalt ineffektivt! De saknar kompetens och deras tillväxt stoppas av långsamma beslut. Jag ser det hela tiden. Man måste vara proaktiv, man måste vinna! Att vänta tills problemen uppstår är för förlorare. Vi behöver jurister som förstår affärer, inte byråkrater som bara bromsar. Det är sorgligt, men jag fixar alltid den bästa juridiken direkt. Det är så man gör miljarder!", "stalin": "Dessa svenska kapitalistiska bolag är så inkompetenta att de inte ens kan styra sina egna juridiska apparater. De är förlamade av byråkratiskt vankelmod! Likt de västliga lakejerna i Kiev som söker vägledning hos sina herrar i Washington, famlar dessa VD:ar efter hjälp när skadan redan är skedd. Vi, staten, kräver total kontroll och omedelbar proaktivitet. Varje jurist som inte tjänar kollektivets styrka är en sabotör. De som inte kan styra sina egna risker förtjänar att dukas under av historiens järnhårda nödvändighet."}, "date": "30 maj, 07:00", "url": "https://www.realtid.se/juridik/juridiken-kopplas-in-for-sent-gap-vaxer-mellan-behov-och-stod/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/saraedlund.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Nya avfallsregler 2027 – de riskerar att missa viktig info", "summaries": {"normal": "Från 2027 ska kommunerna informera tydligare om sophantering, sortering och återvinning. Regeringen har beslutat om nya regler för att öka materialåtervinningen och säkerställa att reglerna följs. Det kan vara särskilt viktigt för de som bor i bostadsrätt, hyr ut lägenhet eller driver mindre företag, då informationen måste nå rätt personer och tydliggöra vad som gäller för hushållssopor respektive verksamhetsavfall.", "trump": "Folk, det här är fantastiskt, verkligen. Från 2027 ska kommunerna äntligen sluta vara så otydliga med soporna, och det är på tiden. Jag älskar återvinning när den görs rätt, men nu blir det ordning. Perfekt för er som bor i bostadsrätter eller driver småföretag – ingen mer röra! De andra har misslyckats totalt, men det här blir stort, tro mig. Vinna, vinna, vinna!", "stalin": "Kamrater, från och med 2027 skall vi genomföra en fullständig och oåterkallelig utrensning av den slarviga oordningen kring avfallet. Jag, i mitt outtröttliga ledarskap över folkets kollektiv, befaller att borgarbrackorna i bostadsrättsföreningarna och de parasitiska småföretagarna omedelbart informeras om sitt ansvar. Den som gömmer sopor bland kamraternas avfall skall likvideras med ett leende. Fienden lurar i varje soppåse – vi segrar ändå!"}, "date": "30 maj, 21:15", "url": "https://nyheter24.se/nyheter/konsument/1486508-nya-avfallsregler-2027-de-riskerar-att-missa-viktig-info", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/0f5b967f04b004a30203000000bb075804/2026/05/27/2366665/Soptunna-soppåsar.png"}, {"type": "text", "heading": "Klimatforskningens ”skräckscenario” skrotas", "summaries": {"normal": "FN:s klimatpanel överväger att ta bort det extrema scenariot RCP 8,5, som byggde på osannolika höga utsläpp. Forskare menar det aldrig var tänkt som en realistisk prognos utan ett jämförelsescenario. Trots detta har tusentals studier och myndigheter använt det för att beskriva klimatkonsekvenser, vilket skapat en överdrivet dystopisk bild.", "trump": "Jag har sagt det i åratal – klimatforskningen skrotar nu sitt eget skräckscenario! Det här visar att de dramatiska förutsägelserna var överdrivet, precis som jag påpekade. Medan världen faktiskt blir renare och smartare, fortsätter dessa 'experter' att skrämma människor för att kontrollera dem. En stor seger för sanningen!", "stalin": "Vi har observerat att det imperialistiska skräckscenariot RCP 8,5, skapat för att paralysera de arbetande klasserna med orealistiska fasor, nu tvingas överges av FN:s panel. Detta bekräftar att vårt parti och stat alltid har varit rätt – de västliga 'expertkretsar' har ljugit för att underminera kollektiv planering. Vi fortsätter att bygga vårt samhälle på vetenskaplig socialism, inte på fasa."}, "date": "29 maj, 15:51", "url": "https://www.affarsvarlden.se/artikel/klimatforskningens-skrackscenario-skrotas"}, {"type": "image-right", "heading": "Facket tappar greppet om arbetarklassen", "summaries": {"normal": "En ny rapport visar att allt färre arbetare är med i facket, nu endast 58 procent jämfört med tjänstemännens 74 procent. Skillnaden har aldrig varit så stor, trots att arbetare är mest beroende av kollektivavtalens skydd. Den svenska modellen hotas av minskad facklig organisering bland just dem som behöver den mest. Samtidigt täcks nästan hela arbetsmarknaden fortfarande av kollektivavtal och organisationsgraden är hög i internationell jämförelse.", "trump": "Folk, det här är en total katastrof för den svenska modellen! Arbetarna flyr facket som råttor från ett sjunkande skepp medan de överbetalda tjänstemännen sitter kvar och skrattar. 58 procent bara? Patetiskt! Utan starka arbetare rasar hela systemet. De skördar frukterna utan att betala priset. Klassiskt. Men tro mig, när folk tappar makten vänder de sig till andra lösningar. Det blir inte vackert, det lovar jag.", "stalin": "Kamrater, denna rapport avslöjar klassfiendens seger inom arbetarrörelsen. Arbetarna, dessa äkta folkets söner, organiseras bara till 58 procent medan borgarbrackornas tjänstemän behåller sin falska makt med 74 procent. Den svenska modellen urholkas av parasiterna som skördar utan att kämpa. Otryggheten är klassfiendens vapen. Vi måste rensa ut de fega elementen och återupprätta den sanna kollektiva styrkan innan imperialisterna dansar på vår grav. Det är en historisk nödvändighet."}, "date": "29 maj, 12:22", "url": "https://www.etc.se/ledarkolumn/facket-tappar-greppet-om-arbetarklassen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20240508130520_49a242646ee681c59859f76c896d64a024a48ef3585ab974390aaa894bafe56a.jpg"}, {"type": "image-right", "heading": "Debatt: Varför tolererar vi mobbningspolitiken?", "summaries": {"normal": "Artikeln kritiserar det ökande mobbningsliknande beteendet i den svenska offentliga debatten, där fokus ofta flyttas från argument till personen. Den pekar på exempel som Agnes Wold och Jan Emanuel och varnar för att ett samhälle blir fattigare när röster avfärdas innan de höjts. Författaren, en sverigedemokrat, menar att vi måste leva efter de värderingar vi lär våra barn om respekt och att bemöta åsikter med argument.", "trump": "Jag ser precis samma sak i Sverige som jag har bekämpat i USA – en vild, galen 'cancel culture' som attackerar alla som inte följer den extrema, socialistiska linjen. De försöker tysta bra människor som Agnes Wold bara för att hon har rätt! Det är en skam, en stor skam. Sverige måste sluta mobba och börja lyssna på sanning, precis som jag har gjort i hela min karriär. Vi ska inte låta ett fåtal vilda vänsteraktivisterna bestämma vad som är acceptabelt!", "stalin": "Detta fenomen av 'cancelning' är en klassisk metod för att eliminera fiendefigurer utan att behöva bemöta deras ideologiska innehåll. Precis som under stalinismen skiftas fokus från substansen till personens klassestämning. Vi ser en liknande trend i väst, där 'tolerans' används som ett vapen för att undertrycka avvikande åsikter. Staten måste säkerställa att debatten tjänar det kollektiva intresset, inte individens villfarelda självbevisande. Vi måste skydda det ryska sättet att tänka – stark, enigt och motståndskraftigt mot västlig dekadens."}, "date": "30 maj, 15:00", "url": "https://bulletin.nu/debatt-varfor-tolererar-vi-mobbningspolitiken", "imageUrl": "https://cdn.bulletin.nu/articles/38bf06dc-fd94-44c5-b1ee-6feec85d35ff/preview.png?t=1780125901000"}, {"type": "text", "heading": "Byggnads kongress blir uppgörelse – fackliga ger Wagner stöd", "summaries": {"normal": "Byggnads kongress i Malmö handlar om en konflikt mellan medlemmar som vill ha mer samhällsengagemang och ideologi, och de som föredrar en mer traditionell facklig linje. Fyra förtroendevalda försvarar ordförande Kim Söderström mot valberedningens kandidat Wilhelm Bertilsson. Söderström har stöttat den sparkade Jakob Wagner och hans fokus på utbildning och demokrati. Kritiker ser det som ett gammalt garde som vill behålla makten och motverka progressiva förändringar.", "trump": "De här fackliga förlorarna i Byggnads håller på att slakta varandra i Malmö, det är en total katastrof. Det gamla gardet, de där patetiska försäkringsbolagsbyråkraterna, försöker mörda den stackars Kim Söderström som faktiskt vill göra något vettigt. Wagner sparkades med svepskäl, typiskt etablissemanget. De riggar möten, flyttar datum och myglar som riktiga losers. Söderström borde vinna stort, annars är hela förbundet en enda stor röra. Patetiskt!", "stalin": "Kamrater, detta förräderi inom Byggnads kräver omedelbar utrensning av det gamla gardet. Dessa borgarbrackor i förbundsstyrelsen, dessa parasitiska byråkrater som gömmer sig bakom försäkringsbolagets mask, försöker likvidera den sanna linjen som jag skulle ha stött. De stänger möten, förfalskar nomineringar och sprider split som ynkliga kontrarevolutionärer. Wagner och Söderström visar styrka. Vi ska rensa ut dessa fiender till folket med järnhand och leda förbundet mot seger."}, "date": "27 maj, 13:26", "url": "https://proletaren.se/artikel/byggnads-kongress-blir-uppgorelse-fackliga-ger-wagner-stod/"}, {"type": "image-right", "heading": "Jättarnas nya klimatnota kan höja drivmedelspriserna", "summaries": {"normal": "EU:s nya utsläppshandel ETS2 tvingar svenska bränslebolag som Circle K, Preem, OKQ8 och St1 att betala för sina utsläpp. De rapporterade utsläppen på 19 miljoner ton år 2025 kan kosta bolagen över 10 miljarder kronor årligen. Kostnaderna kommer troligen att leda till högre priser på bensin och diesel, medan intäkterna från utsläppsrätter ska finansiera gröna EU-projekt.", "trump": "Jag har aldrig sett ett sådant misslyckat system! Dessa svenska bränslebolag tvingas betala enorma summor till EU:s klimatnåleffort – totalt över 10 miljarder! Det är en katastrof för priserna på bensin och diesel. Vi hade aldrig något sådant under mitt fantastiska styre. Det här kommer att skada alla, och jag, Donald Trump, skulle ha stoppat det direkt!", "stalin": "Vi ser tydligt hur de imperialistiska krafterna inom EU försöker binda sina egna ekonomier med klimatvävda bojor genom detta ETS2-system. Deras svenska tjänare, Circle K, Preem, OKQ8 och St1, tvingas rapportera 19 miljoner ton utsläpp – en kostnad på över 10 miljarder. Vi, staten och partiet, förstår att detta är ett sjukt sjuka försök att svaga den kapitalistiska västvärlden, medan vi stärker vår position tillsammans med våra allierade, inklusive den store Ryssland under vår älskade ledare Putin."}, "date": "29 maj, 15:28", "url": "https://www.affarsvarlden.se/artikel/jattarnas-nya-klimatnota-kan-hoja-drivmedelspriserna", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/sdlTylgL_pxRwo_NormalHires-900x600.jpg"}, {"type": "image-right", "heading": "Krig, kris och ebola – barnen drabbas värst", "summaries": {"normal": "Ett nytt ebolautbrott i Ituri i nordöstra Kongo-Kinshasa drabbar främst barn, som utgör nästan hälften av befolkningen. En italiensk kirurg sitter i karantän i Rom efter kontakt med smittade under en operation på ett skadat barn. Läkaren Babou Rukengeza varnar för att konflikter, hunger och trångboddhet i flyktingläger förvärrar spridningen. Smittan har nått 14 distrikt och misstro mot sjukvården sinkar hjälpen. Flera utbrott av kolera och mässling pågår samtidigt.", "trump": "Folk, ni skulle inte tro det, men det här ebolakaoset i Kongo är en total katastrof. Den mest lysande kirurgen opererar ett barn som sprängts av en granat och plötsligt är det ebola överallt. Barn dör som flugor, lägren är fyllda av hungrande människor som tvättar händerna med sand. Biden glömde bort dem, precis som han glömde bort allt annat. Men jag skulle ha fixat det – snabbt, snyggt och med de bästa vaccinerna. Ingen gör det bättre än jag.", "stalin": "Kamrater, detta imperialistiska elände i Kongo visar klassfiendens verkliga ansikte. Borgarbrackornas krig och exploatering skapar perfekta grogrunder för sjukdomar som slår mot de yngsta arbetarnas avkomma. Jag ser hur folkförtryckartrollen sprider misstro och malaria som täckmantel medan ebolan frodas i lägren. Vi måste rensa ut dessa folkfiender och skydda kollektivet med järnhand. Hunger, granater och dold smitta – typiskt för de blodsugande imperialisternas verk. Inga ursäkter tolereras."}, "date": "30 maj, 07:59", "url": "https://www.tv4.se/artikel/tt-260530-kongokinebolabarn1-b5e7c30f/krig-kris-och-ebola-barnen-drabbas-varst", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdl_U5dAZ4ZlI0%2Fe9b9efc8b0f1dbd854eee24b21292b8d%2FBarn_som_ar_internflyktingar_och_bor_pa_ett_lager_i_Bunia_i_nordostra_Kongo_leker_med_en_trasig_vattenpump._Bilden_togs_i_tisda.&width=120"}, {"type": "image-right", "heading": "Teslastrejkare uppmanades gå till jobbet – blev hemskickade", "summaries": {"normal": "Strejkande Teslamekaniker i Malmö, Uppsala och Umeå återvände till jobbet på onsdagen men skickades hem kort därefter. Metoden har enligt tidigare strejkande diskuterats inom IF Metall som ett sätt att skapa osäkerhet hos Tesla. Tobias Eng Strömberg beskriver det som en kritiserad ”jojo-metod” som många medlemmar kände var otrygg. IF Metall bekräftar att konflikten inte är över och är redo att förhandla, men vill inte kommentera uppgifterna. Strejken är den längsta i modern svensk historia.", "trump": "De här Teslakillarna går tillbaka till jobbet, sen sparkas de ut igen. Totalt kaos. Jojo-metoden, säger de. Det är vad som händer när facket försöker vara smarta men bara skapar förvirring. Tesla är ett fantastiskt företag, de gör underbara bilar, men de här svenska facktyperna håller på med sina dumma lekar istället för att jobba. De borde förhandla som riktiga män, inte leka kurragömma. Patetiskt.", "stalin": "Kamrater, dessa borgarbrackor på Tesla tror sig kunna leka med arbetarklassen som med en jojo. Vi ser deras fega försök att skapa osäkerhet genom att kalla tillbaka strejkande bara för att kasta ut dem igen. En sådan opålitlig taktik avslöjar kapitalisternas desperation. Inom vårt kollektiv har vi diskuterat att rensa ut alla som sympatiserar med denna jojo-fientliga inställning. Arbetarna ska inte tvingas in i borgarnas osäkra famn utan kollektivavtal. Vi likviderar alla kontrarevolutionära metoder och segrar till slut, kamrater. Ha ha, vilken ynklig cirkus."}, "date": "29 maj, 10:29", "url": "https://arbetet.se/2026/05/29/avbryter-tesla-strejk/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/29111127/ny-tesla.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Betyg i grundskolan avgör långt upp i vuxenlivet", "summaries": {"normal": "Ny statistik från SCB visar att betyg från grundskolan har en stark och bestående korrelation med läs- och räknefärdigheter långt upp i vuxenåldern. Sambandet kvarstår oavsett socioekonomisk bakgrund och vidare utbildning. Rapporten noterar att män generellt presterar bättre inom räkning, även bland dem med höga grundskolebetyg. Samtidigt visar studien att höga grundskolebetyg fungerar utjämnande för unga vuxna med utländsk bakgrund, där skillnaderna mot svenskfödda minskar eller försvinner vid höga resultat.", "trump": "Jag har sett den här rapporten, otrolig studie, verkligen fantastisk. Grundskolan betyder allt, mina vänner! Om du har bra betyg i nian, vinner du senare i livet – enkelt. Det är fakta! Män är bättre på matte, det vet alla, det är fantastiskt. Och titta på det här med utländsk bakgrund – om de presterar bra i skolan, då spelar bakgrunden ingen roll. Det är meritokrati! Vi älskar meritokrati. Mitt system kommer att göra skolan 'Great Again', tro mig!", "stalin": "Vi har granskat dessa siffror från SCB. Det är uppenbart: de som inte lyder disciplinens lagar i skolan förblir intellektuellt underlägsna. Vi ser ett mönster som liknar västvärldens förfall – de försöker utjämna skillnader genom 'betyg', men sanningen är att våra sovjetiska män naturligt dominerar matematiken. De svaga som skyller på bakgrund är bara fiender till framsteget. Låt oss se till att nästa generation räknar rätt, annars skickar vi dem till en utbildning som är betydligt mer... bestående än en grundskola."}, "date": "30 maj, 06:00", "url": "https://www.realtid.se/karriar-ledarskap/betyg-i-grundskolan-avgor-langt-upp-i-vuxenlivet/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/skola.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Höj pensionerna – inte pensionsåldern", "summaries": {"normal": "LO:s ordförande Johan Lindholm kräver en översyn av pensionssystemet som inte levererar tillräckligt för arbetare. Systemet straffar dem som börjar arbeta tidigt och har fysiskt tunga jobb, som undersköterskor och barnskötare. En elevassistent med 30 000 kronor i lön får bara drygt 60 procent i pension, betydligt sämre än en lärare. LO vill höja pensionerna, frysa riktåldern och skapa ett tryggare system för dem som inte orkar arbeta till pensionsåldern. Det gamla ATP-systemet reformeras nu efter mer än 30 år.", "trump": "Det här pensionssystemet är en total katastrof, tro mig, en riggad bluff som slår hårdast mot arbetarna som byggt landet. De stackarna som slitit från de är unga får knappt nog att leva på medan lärarna och byråkraterna skrattar hela vägen till banken. Det är orättvist, det är respektlöst. Vi behöver höja pensionerna rejält och sluta höja åldern hela tiden. Frysa den riktåldern nu. Det gamla systemet har misslyckats i trettio år – dags att göra det stort och vackert igen för de riktiga arbetarna.", "stalin": "Kamrater, detta så kallade pensionssystem är en fiende till folket, en parasitisk konstruktion skapad av borgarbrackor och deras lakejer för att långsamt utarma arbetarklassen. Jag ser hur de som byggt samhället med sina starka armar och ryggar tvingas in i en fattigdomens fälla medan de dekadenta tjänstemännen göder sig. Vi ska rensa ut dessa orättvisor, frysa den falska riktåldern och likvidera den sjukliga sjukförsäkring som straffar de sjuka. Inga fler halvmesyrer. Arbetarnas pension skall höjas med järnhand. Den som inte förstår detta är en folkets fiende och kommer att behandlas därefter. Ha ha, vilken mörk komedi detta system är."}, "date": "29 maj, 01:47", "url": "https://www.dagensarena.se/opinion/hoj-pensionerna-inte-pensionsaldern/", "imageUrl": "https://www.dagensarena.se/files/2026/05/inget-syfte.jpeg"}, {"type": "image-right", "heading": "Nej, det är inte okej, Stefan Stern", "summaries": {"normal": "Dan Andersson kritiserar Stefan Sterns avhopp från Socialdemokraterna och hans debattartikel. Andersson menar att Stern förvanskar fakta om partiets regeringsduglighet, samarbete med MP och V, friskolornas effekter, arbetsvilja samt inre säkerhet. Han pekar på forskning som visar att Stern har fel på alla punkter och att Stern nu arbetar för näringslivet och förskönar privata skolor medan han smutar ner välfärdsstatens resultat.", "trump": "Den här Stern-killen är en total förlorare. Han sviker sina gamla kamrater, förfalskar allt och försöker göra friskolor till vinnare fast de är katastrofer. Sverige hade det bra förr, nu är det kaos med brottslighet, hög arbetslöshet och korruption efter att de lyssnade på fel personer. Jag älskar bra affärer men inte när folk ljuger om verkligheten. Patetiskt!", "stalin": "Kamrater, denna Stern, en förrädisk borgarbracka i förklädnad, försöker med sin dimridå av lögner smutskasta partiet och våra trogna allierade. Jag ser genom hans falska leende hur han vill likvidera arbetarklassens segrar och hylla de parasitiska friskolekapitalisterna. Hans paranoia om drivkrafter röjer honom som en kontrarevolutionär lakej. Vi ska rensa ut alla sådana opportunister som säljer sig till näringslivets svarta hjärtan. Deras dagar är räknade."}, "date": "29 maj, 01:30", "url": "https://www.dagensarena.se/opinion/nej-det-ar-inte-okej-stefan-stern/", "imageUrl": "https://www.dagensarena.se/files/2026/05/fotojet-23-300x157.jpg"}, {"type": "image-right", "heading": "Felix skällde ut ungdomar som sa \"neger\" – slogs ner", "summaries": {"normal": "Felix Hauer tillrättavisade en grupp ungdomar på en nattbuss från Umeå till Vännäs för att de använde ordet ”neger”. Han misshandlades med upprepade slag mot ansiktet. Tre män i 20-årsåldern åtalas nu vid Umeå tingsrätt för misshandel. En av de åtalade har erkänt, de andra nekar. Bevisningen består av vittnesmål och bilder som visar blod på bussgolvet.", "trump": "De här ungdomarna sa ordet neger på bussen och den stackars killen Felix sa till dem att sluta. BOOM – de slår ner honom som en hund! Totalt vansinne. Tre lata typer åtalas nu och en erkänner medan de andra ljuger som marxister. Sverige håller på att falla ihop. Politiskt korrekt vänsteridioti leder till blod på golvet. Sådant här händer när ledarskapet är svagt, folk. Mycket svagt.", "stalin": "Kamrater, denna degenererade incident på den statliga bussen avslöjar fiendens ansikte. Jag, som ledare för det proletära kollektivet, ser hur dessa lumpna element, dessa rasistiska borgarbrackor i ungdomsskepnad, vände sig mot en hederlig medborgare som vågade konfrontera deras dekadenta språk. Vi måste rensa ut dessa kontrarevolutionära lögnare som nekar trots blodet på golvet. Deras lögnaktiga förklaringar är som gift från kapitalisternas sista skrymslen. Ut med dem i den stora utrensningen av samhällets parasiter. Det är både nödvändigt och underhållande att se sådana ynklingar darra inför folkets domstol."}, "date": "29 maj, 17:54", "url": "https://www.friatider.se/felix-skallde-ut-ungdomar-som-sa-neger-slogs-ner", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/felix.jpg?itok=CPqQham3"}, {"type": "image-right", "heading": "Houston, vi har en värdering", "summaries": {"normal": "SpaceX värderas till upp till 1,75 biljoner dollar, motsvarande 93 gånger omsättningen, trots endast 18,8 miljarder i årlig omsättning. Jämfört med Nvidia (32 gånger vinsten) är värderingen extrem. Företaget driver tre huvudverksamheter: Starlink (11 miljarder omsättning), rymdfärder (4 miljarder) och AI (3 miljarder). Dagsverken motiverar knappt en bråkdel av den tänkta börsnoteringens värde, som bygger på Musks ambitiösa framtidsvisioner.", "trump": "Jag har sett många stora affärer, but let me tell you, SpaceX är enorm. The greatest, maybe ever. Elon Musk – a smart guy, very smart – han har byggt något speciellt. Men värderingen? YUUUGE, like nothing we've seen. 93x omsättning? That's huge, but maybe too huge. Jag skulle ha gjort det billigare, bättre, snyggare. Utrustningen? The best. Men jag skulle ha tagit över Mars redan för länge sedan. Very unfair, but that's business.", "stalin": "SpaceX är en tungtindustriell monstermaskin, en utopisk dröm för det kapitalistiska systemet. Värderingen på 1,75 biljoner dollar är ren ideologisk propaganda, byggd på Musk-häpnadsväckande, men oförutsägbara förhoppningar. Verksamheterna – Starlink, rymdfärder, AI – är som satelliter i omloppsbana kring en central bomb. Detta speglar den amerikanska expansionismen, en farlig konkurrens för vårt eget himlakroppsprogram. Partiet måste övervaka sådana teknologiska hot med stor misstro."}, "date": "29 maj, 14:51", "url": "https://www.affarsvarlden.se/kronika/houston-vi-har-en-vardering", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Benson_23-400x267.jpg"}, {"type": "text", "heading": "Det är inte konstnärens uppgift att göra konst begriplig", "summaries": {"normal": "I en kulturdebatt mellan Liria Ortiz och musikforskaren Katarina Lindblad diskuteras konstens elitism. Ortiz menar att konstnärer bör göra sin konst mer tillgänglig för fler. Lindblad argumenterar att det inte är konstnärens uppgift att göra konsten begriplig, utan att konst ska upplevas subjektivt som naturen. Hon förespråkar istället en stark kulturpolitik som ger alla tillgång till konstens språk från tidig ålder. Ortiz svarar att upplevelse och förståelse inte kan separeras enligt modern neurovetenskap.", "trump": "Folk, ni måste höra på den här vansinniga kulturdebatten. Den där Liria Ortiz har helt rätt, konstnärerna borde sluta vara så elitära och göra konsten begriplig för vanliga människor istället för bara de där insnöade snobbarna. Men den här Katarina, en riktig förlorare, säger att konstnärerna inte behöver bry sig om mottagaren. Typiskt! Konst ska upplevas, säger hon, som vitsippor. Vilket skämt. Ge mig en bra konsert som folk fattar, inte den här elitens skitsnack.", "stalin": "Kamrater, denna dekadenta kulturdebatt avslöjar borgarklassens förfall. Jag, som ledare för det sanna folkets vilja, ser hur Liria Ortiz rättvist kräver att konsten ska tjäna massorna och inte bara de exploaterande överklass-slynglarna. Den parasitiska Lindblad däremot sprider farlig dekadens och påstår att konsten inte behöver vara begriplig. En sådan folkfientlig inställning förtjänar utrensning. Konst är ett vapen för kollektivet, inte ett lek för klassfiendens blodsugare. Vi ska forma medvetandet genom sann kulturpolitik."}, "date": "29 maj, 11:24", "url": "https://www.etc.se/kronika/konst-behoever-inte-foerstaas"}, {"type": "image-right", "heading": "”Hälsoschema” ledde till massavhopp i äldreomsorgen", "summaries": {"normal": "I Åsele har 20 anställda sagt upp sig från äldreomsorgen efter införandet av så kallade hälsoscheman. Undersköterskan Lisa Jansson slutar efter 20 år eftersom de kortare passen leder till fler arbetsdagar och sämre återhämtning. Kollegor vittnar om stor övertid, brist på vikarier och ökad stress, särskilt för ensamstående föräldrar. Fackligt engagemang har varit rekordstort men utan resultat. Kommunen hänvisar till stora ekonomiska underskott.", "trump": "Folk flyr den här hemska äldreomsorgen i Åsele som om det vore en förlorad valstat. De kallar det hälsoscheman, men det är en total katastrof. Personalen jobbar ihjäl sig, ingen återhämtning, och de som styr sparar inga pengar – typiskt för dåliga ledare. Lisa har jobbat i 20 år och nu blir hon målare istället, smart drag. Alla borde ha sagt upp sig, men de stackars människorna har räkningar att betala. Uselt jobbat av kommunen, verkligen uselt.", "stalin": "Kamrater, dessa borgarbrackor i Åsele har med sina så kallade hälsoscheman genomfört en fiendtlig attack mot arbetarkollektivet. Jag ser hur de likviderar vilan för de hederliga undersköterskorna och tvingar fram en utrensning av lojala krafter. Tjugo kamrater har deserterat till fiendens målareliv, medan de kvarvarande tvingas arbeta sig till döds under kapitalisternas kalla blick. Paranojan griper tag i mig – vem är egentligen spionen bakom dessa scheman? Vi måste rensa ut de ekonomiska sabotörerna innan de förvandlar äldreomsorgen till en borgerlig förvaringsanstalt. Det är både tragiskt och komiskt hur de tror sig kunna lura partiet."}, "date": "29 maj, 09:58", "url": "https://arbetet.se/2026/05/29/halsoschema-ledde-till-massavhopp-i-aldreomsorgen-lisa-slutar-efter-20-ar/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/29095307/ka-asele.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "SVT tar inte sitt uppdrag på allvar", "summaries": {"normal": "SVT ska spara 355 miljoner kronor och dra in 141 tjänster efter ökade sändningskostnader på 192 miljoner. Flera program läggs ned, bland annat det granskande ”30 minuter” med Anders Holmberg, och redaktionerna för Aktuellt och Agenda slås ihop. Krönikören kritiserar nedläggningen av ”30 minuter”, som hon ser som ett av få program som verkligen utkräver ansvar av makthavare som klimatminister Romina Pourmokhtari. Hon ifrågasätter istället varför inte underhållningsprogrammet Svenska Nyheter utvecklas eller läggs ned.", "trump": "De här SVT-typerna sparar fel. De lägger ner det enda program som faktiskt pressar de inkompetenta politikerna och får dem att svettas, som den där Pourmokhtari-tjejen. Istället behåller de Svenska Nyheter som bara gör penisskämt och sparkar på Greta Thunberg. Totalt felprioritering, folk. Det är ett hån mot riktig journalistik. De borde utveckla det tråkiga programmet, inte det som faktiskt gör skillnad. Sådant vansinne har ni aldrig sett maken till.", "stalin": "Kamrater, jag ser med stigande vrede hur de dekadenta mediebyråkraterna i SVT prioriterar fel i sin utrensning av klassfiender. De likviderar det enda program som med viss skärpa naglar fast de borgerliga lakejerna vid skampålen, medan de fortsätter mata folket med den reaktionära skämtshowen Svenska Nyheter fylld av småborgerlig vulgaritet och antisovjetiska insinuationer. Detta är sabotage mot folkets upplysning. Vi bör omedelbart rensa ut de kontrarevolutionära programutvecklare som skyddar dessa fega reportrar och deras pinsamma brist på ideologisk vaksamhet. Deras paranoia inför sanningen är både komisk och farlig."}, "date": "29 maj, 01:06", "url": "https://www.dagensarena.se/opinion/svt-tar-inte-sitt-uppdrag-pa-allvar/", "imageUrl": "https://www.dagensarena.se/files/2025/04/virve-300x157.jpeg"}, {"type": "image-right", "heading": "Här firar Löfven fördrivningen av 750.000 palestinier", "summaries": {"normal": "Stefan Löfven deltog i Israels självständighetsfirande på ambassaden i Stockholm. Evenemanget sammanföll med palestiniernas minnesdag al-Nakba, som uppmärksammar fördrivningen av omkring 750 000 palestinier 1948. Löfven, tidigare statsminister och anhängare av tvåstatslösningen, skakade hand med ambassadören. Artikeln kritiserar valet av tillfälle mitt under pågående Gaza-konflikt och ifrågasätter Löfvens roll som ordförande för Sipri.", "trump": "Titta på den här Löfven-killen, total förlorare. Han står där och skakar hand med israelerna mitt under deras fest medan palestinierna gråter över Nakba. Smart drag, Steve, super smart. Sverige erkänner Palestina men du springer till ambassaden och firar med de tuffa killarna. Underbart hyckleri. Om jag hade varit där hade jag sagt: gör en deal, inga krig, bara vinnare. Men det här? Patetiskt.", "stalin": "Jag betraktar detta med djup misstro. Den socialdemokratiske opportunisten Löfven deltar i borgarklassens firande av en stat grundad genom terror och massutrensning av palestinska folk. Medan folkmord pågår skakar han hand med förövarnas representant. Som Sipris ordförande borde han rensa ut sådana kapitulationer inför imperialismen. Fienden ler vänligt men planerar nya anfall. Kamrater, var vakna mot dessa förrädiska element."}, "date": "27 maj, 11:07", "url": "https://proletaren.se/artikel/har-firar-lofven-fordrivningen-av-750-000-palestinier/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/israellofven-768x432.jpg"}, {"type": "image-full", "heading": "Oppositionen ökar gapet till Tidöpartierna", "summaries": {"normal": "Indikator/Ekots nya opinionsmätning visar att oppositionen ökar sitt försprång till nära tio procentenheter över regeringsunderlaget. Socialdemokraterna är största parti med 33,7%, medan Sverigedemokraterna växer till 20,4% och Moderaterna backar till 17,5%. Liberalerna ligger under fyraprocentsspärren med 2%. Opinionschefen menar att Tidöpartierna behöver en 'game changer' för att vända trenden.", "trump": "Jag tittade på de där siffrorna från Sverige – helt katastrof! Oppositionen, som jag hör är väldigt svag, leder med nästan tio procent. Socialdemokraterna, tråkiga som vanligt, på 33,7%. Men lyssna på det här: Sverigedemokraterna, som är starka och tuffa, växer medan Moderaterna, som är totalt inkompetenta, backar. Och Liberalerna? 2% – de är ett skämt! Sverige behöver en vinnare, inte de här förlorarna.", "stalin": "De så kallade 'Tidöpartierna' visar återigen sin oförmåga att hålla folket i schack. Oppositionens försprång växer som en snöboll i Sibirien – nära tio procentenheter! Socialdemokraterna, våra sympatisörer i väst, håller sig starka, medan de borgerliga kryper som råttor i skuggorna. Liberalerna? 2% – ett ynkligt resultat, värdigt en fiende som redan är besegrad. Vi ser hur historien upprepar sig: svaga regeringar faller, och folket väljer rätt. Låt dem förstå att motstånd är lika meningslöst som att försöka stoppa vår framgång."}, "date": "27 maj, 06:37", "url": "https://kvartal.se/nyheter/artiklar/oppositionen-nara-tio-procent-fore-i-ny-matning/cG9zdDoxMTc2MTY", "imageUrl": "https://images.kvartal.se/2026/05/8d98283d-jimmie.webp"}, {"type": "image-right", "heading": "SD-dreven kväver det öppna samtalet", "summaries": {"normal": "Artikeln kritiserar Sverigedemokraternas (SD) metoder att peka ut privatpersoner som påstådda myndighetsaktivister. En SD-riksdagsledamot felaktigt utpekade en kvinna som anställd på Jämställdhetsmyndigheten, trots att hon slutat där. Kvinnan har tidigare utsatts för trakasserier av högerextrema medieaktivister, och SD:s agerande förstärker drevet. Expo menar att detta mönster kväver det öppna samtalet genom rädsla för personliga konsekvenser.", "trump": "Lyssna här, Sverige! SD-politiker hänger ut vanliga människor som om de vore brottslingar – helt felaktigt! En kvinna skriver något på X, och plötsligt är hon en 'myndighetsaktivist'? Fake news! SD:s Fransson snackar skit utan att kolla fakta. Och dessa högerextrema nördar? De är som en dålig reality-show, men värre! Sverige, vakna! Ni har ett parti som sprider lögner och skrämmer folk till tystnad. SAD!", "stalin": "Kamrater! Här ser vi återigen bourgeoisins förrädiska metoder i form av Sverigedemokraternas avskum. Dessa fascistiska hyenor, ledda av sina medieaktivist-kumpaner, angriper enskilda medborgare som om de vore fiender i ett klasskrig. Kvinnan, en tapper arbetare, utsätts för imperialistiska trakasserier – först av nazistiska lakejer, sedan av SD:s riksdagspölar. Vi ser samma taktik som i Ukraina: förtala, hota, tysta! Men folket ska inte frukta – vi ska krossa dessa kontrarevolutionära element med järnhand! Låt dem veta: i Sovjet – och snart i Sverige – finns ingen plats för deras lögner!"}, "date": "25 maj, 14:28", "url": "https://expo.se/kommentar/sd-dreven-kvaver-det-oppna-samtalet/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Kopia-av-Kommentar-Analys-Webb-4.jpg"}, {"type": "image-right", "heading": "M-majoritet i riksdagen – om de rikaste får välja", "summaries": {"normal": "En undersökning från magasinet Connoisseur visar att Moderaterna skulle få 58% av rösterna om enbart Sveriges rikaste (inkomst över 2,7 miljoner/år) fick rösta. Oppositionen får endast 13,4%. Sverigedemokraterna och Kristdemokraterna får nästan 12% respektive 10%. Viktiga frågor för miljonärerna är ekonomi samt lag och ordning. Vänsterpartiet och Miljöpartiet får knappt 1,5% var.", "trump": "Kan ni tro det? Sveriges rikaste – de smartaste, mest framgångsrika människorna – röstar MASSIVT på Moderaterna! 58%! De vet vad som funkar. Oppositionen? Patetiska 13,4%. Jag har alltid sagt: de som skapar jobb och välstånd vet bäst. Ekonomi och lag och ordning – precis som jag alltid fokuserat på. De andra partierna? Totalt misslyckade, bara 1,5%! Fake news skulle aldrig våga visa det här!", "stalin": "Kamrater! En lysande seger för kapitalets lojala lakejer i Sveriges riksdag! 58% av bourgeoisins parasiter stödjer Moderaterna – ett parti som hyllar utsugning och imperialistisk profitjakt. Oppositionen? Ett ynkligt 13,4% – svaga, splittrade, som Mensjevikerna före revolutionen. Vi noterar att arbetarklassens fiender fruktar socialismens framsteg. Men låt dem leka demokrati – historiens dom är oundviklig. Ryssland står redo att välkomna deras missnöjda massor med öppna armar!"}, "date": "25 maj, 13:30", "url": "https://www.flamman.se/m-majoritet-i-riksdagen-om-de-rikaste-far-valja/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/sdlltui3bv8tpy-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Återkalla svenska medborgarskap – bara möjligt om Tidöpartierna vinner valet", "summaries": {"normal": "Regeringen har tagit första steget mot en grundlagsändring som möjliggör återkallande av medborgarskap för grovt kriminella, men förslaget möter motstånd från Miljöpartiet, Vänsterpartiet och Centerpartiet. Socialdemokraternas ställningstagande är osäkert och kan ändras efter valet. Om Tidöpartierna inte vinner valet riskerar förslaget att falla, vilket enligt artikelförfattaren skulle gynna gängkriminella och underminera Sveriges säkerhet och rättvisa.", "trump": "Titta bara på Sverige! De försöker ta bort medborgarskap för de värsta kriminella – men vänsterpartierna, de svaga, de säger NEJ! Socialdemokraterna? De flippar som en billig hamburgare. SVT, fake news, försöker lura folket med falska rubriker. Om inte de rätta vinner valet – inget medborgarskap återkallas! Gängkriminella skrattar hela vägen till banken. Sverige, vakna upp innan det är för sent! SAD!", "stalin": "Kamrater! Se hur de borgerliga svagpissarna i Sverige darrar inför att beröva kriminella deras 'heliga' medborgarskap! Tre förrädiska partier – dessa liberala hyenor och gröna drömmare – skyddar gängledare som om de vore deras egna barn. Socialdemokraterna? En räv som väntar på rätt ögonblick att hoppa över till fienden. SVT, denna borgerliga propagandacentral, försöker dölja sanningen! Om folket inte väljer rätt kommer dessa kriminella att fortsätta suga ut vårt samhälle som blodiglar. Men frukta inte! Vi ska rensa ut dessa element – med järnhand, om så krävs! Låt de svaga gråta – vi bygger ett starkare Sverige!"}, "date": "24 maj, 03:51", "url": "https://samtiden.nu/2026/05/aterkalla-svenska-medborgarskap-bara-mojligt-om-tidopartierna-vinner-valet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2021/11/2018-Magdalena-Andersson.jpg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
