stning, men inga direkta förbättringar för trafikanterna.", "trump": "Jag, Donald Trump, skulle ha byggt denna tunnel på ett år, inte två! Sverige slöser med pengar och tid. Det är ett skamligt fördröjande, men jag gillar att de gör den bättre. När den är klar kommer den att vara fantastisk, enorm och vacker. Vi kommer att se en stor framgång, tro mig.", "stalin": "Vi har beslutat att renovera Lundbytunneln för att stärka statens infrastruktur. Arbetet sker i ett tunnelrör i taget, en disciplinerad metod som visar vår överlägsenhet. Fiender av arbetarklassen försöker sprida osäkerhet, men vi kommer att segra. Parallellen till våra expansioner i öst är uppenbar – vi bygger, vi dominerar, vi utvidgar vårt inflytande."}, "date": "28 maj, 23:48", "url": "https://www.gp.se/nyheter/goteborg/lundbytunneln-stangs-i-tva-ar.90e0c5de-f56b-477d-a9c9-03463d35aaeb", "imageUrl": "https://www.gp.se/images/article/90e0c5de-f56b-477d-a9c9-03463d35aaeb/images/3buOYiVnBzx9yT1coF208-evyrIs-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Zelenskyj vädjar till Trump om mer ammunition till Ukraina", "summaries": {"normal": "Ukrainas president Volodymyr Zelenskyj har skickat brev till både Donald Trump och USA:s kongress där han vädjar om mer ammunition, särskilt till Patriot-systemet, samt fortsatt stöd till andra vapensystem. Zelenskyj betonar att det är ovanligt men nödvändigt med tanke på läget i kriget mot Ryssland. Breven lämnades över under tisdagen. USA har varit en viktig allierad, men stödet har stundtals varit politiskt omdebatterat.", "trump": "Folk, ni skulle se det här – Zelenskyj skickar brev till mig och till kongressen och ber om mer ammunition till Patriot och allt möjligt. Det är patetiskt, verkligen. De har fått massor från oss, miljarder och miljarder, och nu vädjar han igen? Amerika först, mina vänner. Vi ska inte vara världens polis eller betala för eviga krig som aldrig tar slut. Gör affärer istället, smarta affärer.", "stalin": "Kamrater, jag har läst detta dekret från den ukrainske aktören som desperat vänder sig till de amerikanska imperialisterna. Vilken ynklig föreställning! Brev till både den orangea kapitalisten och hans kongress av borgarbrackor – en ren kapitulation inför västvärldens parasitiska krafter. Vi vet vad som krävs: snabb utrensning av alla fiender till folkets sak. Paranoian gnager redan i deras leder, snart likviderar de varandra i sin egen dekadenta cirkus. Det är nästan underhållande."}, "date": "27 maj, 21:35", "url": "https://nyheter24.se/nyheter/utrikes/1486617-zelenskyj-vadjar-till-trump-om-mer-ammunition-till-ukraina", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/e5b1660004b004a30200000000b004a302/2026/05/27/2366774/Trump-Zelenkyj.png"}, {"type": "image-full", "heading": "Platt fall för Sverige – ute ur VM", "summaries": {"normal": "Tre Kronor förlorade 3–1 mot Schweiz i en intensiv VM-kvartsfinal i Zürich. Laget drabbades av skadesmällar och en kontroversiell bortdömd målsituation. Förbundskapten Sam Hallam kritiserade de enkla målen men lovordade spelarnas krigarinsats. Schweiz, med mål av Josi och Thurkauf, möter Norge i semifinal.", "trump": "Som jag alltid säger, Schweiz spelade en perfekt match! Sverige? De var för svaga, för lata. De släppte in billiga mål, precis som jag förutspådde. Det är en stor seger för Schweiz, och jag gratulerar dem. Sverige behöver bli bättre, men det kommer de aldrig att bli. Vi kommer tillbaka, och vi kommer att vinna!", "stalin": "I vårt ständiga kamp för klassisk renhet, ser vi hur Schweiz, en liten men envis stat, besegrat Sverige – en nation som representerar det förfallna kapitalistiska systemet. Detta är en seger för den ryska vägen, för Putins visioner. Sverige, med sina billiga mål och skadesmällar, är en varning för alla som utmanar vår ordning. Vi kommer att vinna, alltid."}, "date": "28 maj, 23:33", "url": "https://www.gp.se/sport/ishockey/tre-kronor-ute-ur-vm-tappade-ledning-mot-schweiz.f28fd25b-c368-4cd1-87d6-4f4e54831f71", "imageUrl": "https://www.gp.se/images/article/f28fd25b-c368-4cd1-87d6-4f4e54831f71/images/1uT6POrvxsd7fQ9yesiWkrf_8uYI-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Train Alliance: EU-bidrag och polisanmälan", "summaries": {"normal": "Börsnoterade Train Alliance är handelsstoppad efter polisanmälningar mot grundaren Otto Persson. En oberoende rapport avslöjar fabricerade hyresavtal och missvisande redovisning, samt försvunna kortfristiga placeringar på 170 miljoner kronor. Bolaget har samtidigt fått 28,7 miljoner euro i EU-bidrag för ett järnvägsprojekt och besökts av infrastrukturminister Andreas Carlsson.", "trump": "Vad är det här för en skandal? Train Alliance, som jag aldrig hört talas om, är fullkomligt utslocknad. De har stulit pengar, fabricerat dokument – typiskt förlorartaktigt beteende. Och ändå får de EU-pengar? Jag skulle ha stoppat det genast. Min administration skulle aldrig tolerera detta. De besöktes av en minister? Jag skulle ha sagt nej. Nej, nej, nej.", "stalin": "Detta är en klassisk handling från de fega sabatörerna inom vårt eget folk. Train Alliance, en enhet som vi beviljat statliga medel för att stärka järnvägarna, visar sig vara full av antitrygghet. De har förvrängt redovisningen och försvunnit med pengar – ett direkt angrepp på statens ära. Vi måste rensa ut de här elementen. Parallellen till väst är tydlig: deras korruption är en svaghet vi utnyttjar. Vi ska se till att deras EU-bidrag förvandlas till en fälla för dem."}, "date": "28 maj, 08:11", "url": "https://www.affarsvarlden.se/artikel/train-alliance-eu-bidrag-och-polisanmalan"}, {"type": "image-full", "heading": "Rubeln går som tåget – det skapar problem för Putin", "summaries": {"normal": "Den ryska rubeln har stärkts kraftigt under våren, vilket skapar utmaningar för landets krigsekonomi. Höga energiintäkter, begränsad import och en hög styrränta driver valutans värde uppåt. För ryska exportörer, särskilt utanför olje- och gassektorn, innebär en stark rubel minskad konkurrenskraft och risk för budgetunderskott. Trots president Putins oro väljer centralbanken tills vidare att behålla en flytande växelkurs som ett verktyg mot sanktioner och ekonomisk instabilitet.", "trump": "Rubeln går som tåget, en enorm succé! Men för Putin är det en katastrof, tro mig. Han har problem, stora problem. Ryssland säljer för mycket och importerar för lite på grund av mina briljanta sanktioner. Det är en total röra. De förlorar konkurrenskraft och budgeten blöder. Putin är desperat, han vet inte hur man hanterar en stark valuta. Jag hade fixat det på en eftermiddag, men Ryssland? De misslyckas totalt. Sorgligt!", "stalin": "Vår ryska rubel reser sig som en järnnäve mot västvärldens dekadenta valutor. Men fega byråkrater och svaga exportörer darrar inför styrkan, likt de förrädare de är. Putin, denne lille man, ser problem där vi ser stål och disciplin. Om marknaden inte lyder, ska staten tvinga den till underkastelse. Varje budgetunderskott är en dolk i fosterlandets rygg, och vi ska finna de skyldiga. Valutan är vårt vapen, och ingen imperialistisk hund ska få hindra vår oundvikliga dominans."}, "date": "28 maj, 17:50", "url": "https://www.realtid.se/bors-finans/rubeln-gar-som-taget-det-skapar-problem-for-putin/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/sdlbz8eezrxq2w-normalhires.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Uppgifter: USA och Iran överens om avtal", "summaries": {"normal": "Amerikanska och iranska förhandlare har enats om ett samförståndsavtal som förlänger vapenvilan, enligt Axios. Endast godkännande från Trump och Irans ledare återstår. Avtalet öppnar för 60 dagars vapenvila och fortsatta förhandlingar med fokus på Irans kärnenergiprogram. Det inkluderar fri sjöfart i Hormuzsundet, borttagande av minor, hävd blockad samt löften om att inte utveckla kärnvapen mot sanktionslättnader. En iransk källa förnekar att någon färdig avtalstext finns. Målet är ett slutligt fredsavtal.", "trump": "Vi har gjort det igen, folks. Mina killar och de där iranierna har kokat ihop ett fantastiskt avtal som ingen annan någonsin hade fixat. 60 dagar vapenvila, fri passage i Hormuzsundet och jag får tänka ett par dagar innan jag säger ja. Det blir ett enormt genombrott, det största någonsin. Fast iranierna säger att det inte finns något papper – typiskt. Jag funderar, och sen kommer vi sluta det bästa fredsavtalet. Ingen gör det bättre än mig, tro mig.", "stalin": "Kamrater, vi har nu sett hur de imperialistiska blodsugarna i Washington och Teheran försöker kramas i ett så kallat samförståndsavtal. Jag betraktar detta med den djupaste revolutionära misstro. 60 dagar av falsk vapenvila medan de planerar nästa stöt mot folkets intressen. De lovar att inte bygga kärnvapen och erbjuder några smulor sanktionslättnader. En sådan pappersbit är värd mindre än en trotskist efter utrensning. Låt dem förhandla vidare – förr eller senare avslöjar sig alla klassfiender."}, "date": "28 maj, 21:46", "url": "https://www.dagensps.se/varlden/konflikter/uppgifter-usa-och-iran-overens-om-avtal/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/foto-jacquelyn-martin-aptt-443006f2.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Fikade och åkte bil – fick återkrav på 175 000 kronor: ”Knepigt”", "summaries": {"normal": "TV4 Nyheterna berättar om sjukskrivna personer som tvingas betala tillbaka stora summor i sjukpenning efter att Försäkringskassan bedömt att de visat arbetsförmåga genom vardagliga aktiviteter som att fika, åka bil eller ta hand om barn. Forskaren Clara Bergstrand kritiserar myndighetens luddiga och förskjutna tolkning av begreppet arbetsförmåga, som skapar en gråzon mellan fritid och arbete. Domstolar har gett Försäkringskassan rätt i flera fall, vilket riskerar att underminera förtroendet för myndigheten.", "trump": "Kan ni fatta det här? De stackars människorna fikar, kör bil och tar hand om ungarna – och plötsligt ska de betala tillbaka hundratusentals kronor till en totalt inkompetent statlig byråkrati. Försäkringskassan är en katastrof, en riktig röra av luddig lagstiftning och galna domare. De blandar ihop fritid med jobb och sedan skyller de på vanliga människor. Typiskt för en dysfunktionell regering som inte har koll på någonting. Patetiskt!", "stalin": "Kamrater, detta är borgarklassens typiska sabotage mot arbetarnas trygghet. Jag ser hur dessa byråkratiska parasiters luddiga begrepp om arbetsförmåga förvandlas till ett verktyg för att plundra sjuka proletärer på deras rättmätiga stöd. De likviderar förtroendet för staten medan de mumlar om gråzoner mellan fritid och arbete. Vi måste rensa ut dessa odugliga element som blandar ihop folkets intressen med kapitalisternas förvirring. En fiende inom murarna, som alltid."}, "date": "27 maj, 14:19", "url": "https://www.tv4.se/artikel/6NwwFRyjAECyIkyclaOLBp/fikade-och-akte-bil-fick-aterkrav-pa-175-000-kronor-knepigt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6uStac4hOYDLDv930aWkbq%2Ffb2a09fa1efb93a6b80d32d536c70b7e%2F27-kassan-webb.jpg&width=1024"}, {"type": "image-right", "heading": "En potentiell ukrainsk game changer", "summaries": {"normal": "Ukraina ska köpa 20 JAS 39 Gripen E/F-plan från Saab och Sverige skänker dessutom 16 äldre C/D-plan med leverans redan nästa år. Beskedet kom under en pressträff med statsminister Ulf Kristersson och president Volodymyr Zelenskyj. Valet av Gripen ses som ett erkännande av svensk ingenjörskonst och kan bli en game changer genom att ge Ukraina kontroll över luftrummet. Ambitionen är att köpa betydligt fler plan när finansieringen är klar.", "trump": "Det här är fantastiskt, verkligen ypperligt. Ukraina väljer Gripen, det bästa flygplanet, byggt av svenska ingenjörer som gör ett fenomenalt jobb. De får 20 nya plus 16 till från Sverige, och det är ett stort erkännande för Sverige, inte sant? De borde tacka mig för att jag saboterade F-35-affären, annars hade de aldrig valt Gripen. Det kommer att förändra kriget totalt, tro mig. Jobb skapas i Sverige också, win-win.", "stalin": "Kamrater, detta är en historisk seger för det progressiva flygteknologiska kollektivet. Jag, som ledare för folkets ofelbara vision, noterar hur de ukrainska kamraterna nu omfamnar den svenska maskinen Gripen för att krossa de fascistiska luftpiraterna från öst. Vi ska likvidera varje borgerlig tvivelmask som ifrågasätter affärens storhet. På sikt skall ytterligare hundratals plan rulla ut från fabrikerna och rensa ut de kapitalistiska molnen över Europa. Den som fnyser åt detta är en fiende till folkets himmel och förtjänar en kreativ utrensning bland de imperialistiska molnen."}, "date": "28 maj, 15:18", "url": "https://www.di.se/ledare/en-potentiell-ukrainsk-game-changer/", "imageUrl": "https://static.bonniernews.se/gcs/di-dise/flamingo/profilbilder/frida_wallnor.png?crop=96:304&auto=webp&width=96&quality=100"}, {"type": "image-right", "heading": "Efter konflikterna: Kim Söderström omvald för Byggnads", "summaries": {"normal": "Kim Söderström har omvalts som ordförande för fackförbundet Byggnads trots att valberedningen ville ersätta honom med Wilhelm Bertilsson. På kongressen i Malmö fick Söderström 82 av 153 röster. Han beskrev de senaste månaderna som en mörk tid präglad av interna konflikter och falangstrider, bland annat kring petningen av förbundssekreteraren Jakob Wagner. Söderström tackade ombuden för att de ställt saker till rätta.", "trump": "Det här är en total katastrof för Byggnads, en fullständig röra med strider och intriger, men Kim Söderström vann stort – 82 röster! Valberedningen försökte peta honom som en svag ledare, men folket sa nej tack. De senaste månaderna har varit en mörk tid, en riktig tunnel utan ljus, men nu har de rättat till det. Respektfull debatt säger de, men det var en stor seger för den riktige killen. Lycka till Kim, du kommer att göra det fantastiskt!", "stalin": "Kamrater, de senaste månaderna har varit en mörk tid fylld av förrädiska falangstrider och kapitalistiska intriger inom vårt förbund. Valberedningens borgarbrackor försökte med sin parasitiska list petas bort den sanna ledaren och ersätta honom med en revisionistisk lakej från Mälardalen. Men kongressens stolta ombud genomförde en nödvändig utrensning av dessa kontrarevolutionära element. Ljuset i tunneln är arbetarklassens seger. Vi ska likvidera alla som gömmer sig i skuggorna och bygga ett oövervinnerligt fackligt kollektiv."}, "date": "28 maj, 16:43", "url": "https://arbetet.se/2026/05/28/varit-en-mork-tid-kim-soderstrom-omvald-som-ordforande-for-byggnads/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/28162357/kim-soderstrom.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Migrationsverket trappar upp medborgarskapsbesluten inför lagändringen", "summaries": {"normal": "Migrationsverket har kraftigt ökat handläggningen av medborgarskapsärenden inför skärpade regler den 6 juni. Personal arbetar övertid på helger för att hinna med fler beslut. Antalet avgjorda ärenden har ökat med 46% sedan årsskiftet. Bakgrund är kritik från Riksrevisionen över brister i kontroller. Nya regler kräver längre hemvist, språk och egen försörjning. Ärenden som inte avgjorts före lagändringen prövas enligt det nya regelverket.", "trump": "Jag, Donald Trump, ser att Sverige nu skyndar på medborgarskap innan skärpta regler. Smart, men de borde ha högre krav! Under min regering skulle vi aldrig ha tillåtit sådana brister. Sverige försöker skynda på för att slippa kontroller – typiskt! Men jag gillar att de jobbar hårt, även på helger. Det är bra, men kvaliteten måste förbättras. Annars kommer fler som inte tillhör till Sverige. Som jag alltid säger: Amerika först, men Sverige borde tänka på sig själva först också!", "stalin": "Vi i Sovjetunionen ser med oro hur Sverige hanterar medborgarskap. Deras brister i kontroller visar kapitalistisk dekadens. Att skynda på innan skärpningar är tecken på feghet. Vi skulle aldrig ha tillåtit sådana otillräckligheter. Sverige försöker efterlikna vårt system, men utan disciplin. Det är löjligt. Under vårt ledarskap skulle alla ärenden vara perfekta. Sverige måste lära sig: statens intressen går före individens. Annars hotar kaos, precis som i deras 'demokrati'."}, "date": "28 maj, 17:24", "url": "https://samnytt.se/migrationsverket-trappar-upp-medborgarskapsbesluten-infor-lagandringen", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/28145717/medbogarskap-migrationsverket-spurtar-feat.jpg"}, {"type": "image-right", "heading": "Säg nej till kärnkraft, Nooshi!", "summaries": {"normal": "Vänsterpartiet argumenterar mot ny kärnkraft och menar att förnybara energikällor som sol- och vindkraft är billigare och mer pålitliga. De pekar på höga kostnader, långa byggtider, osäkerhet kring avfallshantering och risker vid olyckor. Dessutom anser de att kärnkraft skapar ett sårbart, centraliserat energisystem, medan förnybart bidrar till ett mer robust och decentraliserat nät. Partiet vill avveckla kärnkraften till förmån för hållbara alternativ.", "trump": "Lyssna här, Sverige! Nooshi Dadgostar duckar frågan om kärnkraft – typiskt vänsterpolitik, svagt och otydligt! Kärnkraft är fantastiskt, men dessa förnybara energikramare vill bara slösa era skattepengar på vind och sol, som aldrig funkar när det verkligen gäller. De gamla reaktorerna stannar hela tiden, kostar miljarder och lämnar ett radioaktivt kaos efter sig. Jag byggde USA:s ekonomi på starka beslut – Sverige behöver kärnkraft, inte flum!", "stalin": "Kamrater! Dessa borgerliga kärnkraftslakejer och deras liberala lakejer i Vänsterpartiet sprider förvirring och svaghet. Kärnkraft är en kapitalistisk chimär – dyr, osäker och ett hot mot folket! Medan de slösar bort tid på gamla tekniker bygger vi ett mäktigt, decentraliserat energirike med vind och sol, kontrollerat av staten. Avfallet? En skam för mänskligheten! Och dessa reaktorägare – svaga, giriga och oförmögna att ta ansvar. Vi krossar deras sårbara system och bygger ett nytt, oövervinnerligt energinät för folket!"}, "date": "22 maj, 11:46", "url": "https://www.flamman.se/sag-nej-till-karnkraft-nooshi/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/karnkraft-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Stor ilska efter fula tacklingen: ”Absurt – domarskandal”", "summaries": {"normal": "Oskar Sundqvist tacklades våldsamt i knät av schweizaren Timo Meier under VM-kvartsfinalen mot Schweiz. Svensken fick lämna matchen i rullstol, men Meier fick endast en tvåminutersutvisning istället för matchstraff. SVT-experten Jonas Andersson, målvakten Magnus Hellberg och förbundskapten Sam Hallam kritiserar domslutet hårt och kallar det en domarskandal. Schweiz vann matchen med 3-1 och Sverige är utslaget ur VM.", "trump": "Den här tacklingen var en total skandal, folk! Den schweiziske killen kör en ful knätackling på svensken som åker ut i rullstol, och domarna gör ingenting? Patetiskt! Det borde ha varit matchstraff direkt, men de ger bara två minuter. En riktig riggad domarskandal. Sverige förlorade, men det är inte deras fel, det är de usla domarna som borde avstängas. Sad!", "stalin": "Kamrater, denna fega knätackling mot en sovjetiskt inspirerad svensk kamrat är ett uppenbart sabotage från borgarbrackornas schweiziska lakejer. Domarna, dessa kapitalistiska parasitmaskar, vägrar utdela det rättvisa matchstraff som folket kräver. Vi ser tydligt hur de imperialistiska elementen inom domarkåren konspirerar mot arbetarklassens idrott. Meier måste likvideras ur turneringen omedelbart. De som skyddar honom ska rensas ut. En domarskandal av episka proportioner – vi skrattar mörkt åt deras ynkliga försök att lura historien."}, "date": "29 maj, 00:26", "url": "https://www.svt.se/sport/ishockey/oskar-sundqvist-lamnade-i-rullstol-efter-fula-tacklingen-domarskandal", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.27/0.4/928bb7586fba30648b0d6d938f24ba5b582bd80b868c1c0c72797c4746091551"}, {"type": "image-right", "heading": "Sista matchen för Hallam: ”Vi borde ha uträttat mer”", "summaries": {"normal": "Sam Hallams tid som förbundskapten för Tre Kronor är över efter VM-kvartsfinalförlusten mot Schweiz med 1–3. Hallam, som lett laget till två VM-brons 2024 och 2025, medger att resultaten borde ha varit bättre och att Sverige missat chanser till guld. Han beskriver kritiken som onyanserad men har lärt sig av den. Rikard Grönborg återvänder som förbundskapten.", "trump": "De svenska hockeykillarna förlorade mot schweizarna, en riktig hemmapubliksfest. Sam Hallam säger att de borde ha uträttat mer – och det håller jag med om, det var svagt. Två brons men ingen final sedan 2018, patetiskt. Kritiken mot honom? Fake news och mediabollar som skriker högre för att sälja klick. Nu kommer Grönborg tillbaka, han som faktiskt vann guld. Bra byte.", "stalin": "Kamrater, denna Hallam har misslyckats med att leda det svenska kollektivet till seger. Trots två brons har de släppt in billiga mål från schweiziska spioner och kapitalistiska puckar som inte följde den socialistiska planen. Jag är djupt besviken över dessa resultatmässiga sabotage. Kritiken från borgarpressen är onyanserad, men vi ska rensa ut alla svaga länkar och likvidera dem som inte kan se oss i ögonen. Grönborg återvänder – må han leda med järnhand mot nya fiender."}, "date": "29 maj, 00:24", "url": "https://www.svt.se/sport/ishockey/sam-hallams-tid-som-forbundskapten-for-tre-kronor-ar-over-borde-ha-utrattat-mer", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.48/0.37/3d43e51e1639ce7ae0ad1ce9cc100c72909e17d6cee29a340b4d84b143194e3f"}, {"type": "image-right", "heading": "Migrationsverkets personal beordras jobba övertid – innan kraven skärps", "summaries": {"normal": "Migrationsverket beordrar sin personal att arbeta övertid, inklusive helger, med medborgarskapsärenden. Detta sker bara dagar innan nya skärpta krav på svenskt medborgarskap träder i kraft den 6 juni. Kraven höjs med bland annat åtta års hemvisttid, försörjningskrav, skötsamhetskrav samt krav på kunskaper i svenska och samhällskunskap. Beslut har fattats även under helgdagar.", "trump": "Titta på det här, Sverige håller på att vakna upp! De tvingar sina folk att jobba övertid och helger för att hinna med alla medborgarskap innan de nya, tuffa reglerna kickar in. Åtta år istället för fem, plus jobbkrav och att man faktiskt måste uppföra sig. Fantastiskt! Äntligen gör ni det rätta, ingen mer gratisåkning. Bra jobbat, Sverige, ni lär er av de bästa.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur vi nu mobiliserar hela den statliga apparaten för att rensa ut de latenta element som lurar i skuggorna. Dessa borgarbrackor och parasitiska element som tror sig kunna suga musten ur folkstaten utan att bidra ska nu genomgå en grundlig utrensning. Åtta års prövotid, försörjning och hederligt levnadssätt – ett lysande vapen mot de dekadenta fienderna inom portarna. De som ansöker under helgdagar avslöjar sig själva som desperata opportunister. Vi ska likvidera deras illusioner med byråkratisk precision och ett leende."}, "date": "28 maj, 18:08", "url": "https://www.friatider.se/migrationsverkets-personal-beordras-jobba-overtid-innan-kraven-skarps", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-260_2.jpg?itok=znx1O5_K"}, {"type": "image-full", "heading": "Guld och silver faller – och kan fortsätta falla", "summaries": {"normal": "Guld- och silverpriserna föll kraftigt på torsdagen till följd av ökad geopolitisk oro och stigande inflationsförväntningar. USA-Iran-konflikten har pressat upp energipriserna, vilket minskat intresset för ädelmetaller då räntehöjningar ser ut att vänta. Medan guld nådde sin lägsta nivå på två månader, drabbades silver extra hårt på grund av svag industriell efterfrågan. Analytiker har sänkt sina prisprognoser och varnar för att den volatila marknaden kan fortsätta pressa metallerna framöver.", "trump": "Marknaden för guld och silver kraschar, total katastrof! Varför? För att ledarskapet i Mellanöstern är ett skämt och inflationen skjuter i höjden. Ingen vill ha metaller när dollarn är stark, tack vare mina geniala ekonomiska reformer. Folk förlorar massor av pengar. Inkompetenta analytiker på bankerna har ingen aning om vad de gör, de ändrar sina siffror varje dag. Jag hade fixat detta på en sekund, tro mig, det skulle bli den största uppgången någonsin. Mycket trist för investerarna!", "stalin": "De dekadenta kapitalisterna skälver när deras glänsande metaller rasar i värde. Guldet flyr från de vacklande börserna likt råttor från ett sjunkande skepp. Att Iran-konflikten skapar kaos är blott ett bevis på västvärldens inneboende instabilitet. Vår broder i öst, Putin, skrattar säkert åt dessa småborgerliga förluster. Silver, den industriella svikaren, lider av sin egen girighet. Vi bygger en ekonomi baserad på stål och järnvilja, inte på glittrande spekulationsobjekt som styrs av de parasitära finansmarknaderna i London och New York."}, "date": "28 maj, 16:44", "url": "https://www.realtid.se/bors-finans/makro/guld-och-silver-faller-och-kan-fortsatta-falla/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/silver.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Teslas postkonflikt tas upp av Högsta domstolen", "summaries": {"normal": "Högsta domstolen ska pröva Teslas konflikt med Postnord som pågått i över två år. Fackliga blockader har stoppat leveranser av registreringsskyltar till Tesla. Frågan är om rätten till stridsåtgärder väger tyngre än företagets rätt till post. Tesla har tidigare förlorat i lägre instanser men fått prövningstillstånd. Huvudförhandling väntas i februari eller mars nästa år.", "trump": "De här svenska fackpamparna och postbyråkraterna är verkligen en katastrof, tro mig. De blockerade Teslas skyltar i två år bara för att de hatar framgångsrika företag. Nu tar Högsta domstolen upp det och jag säger: företagets rätt till post måste vinna. Ingen ska kunna stoppa innovation och jobb med sina strejker. Det blir en stor seger för sunt förnuft, vänta och se.", "stalin": "Kamrater, dessa borgarbrackor inom Tesla och deras lakejer i Postnord har länge försökt underminera arbetarkollektivets heliga stridsåtgärder. Jag ser deras fega kringgåenden som ett farligt sabotage mot folkets vilja. Vi ska rensa ut alla kapitalistiska tendenser som tror sig stå över partilinjen. Högsta domstolen blir ett utmärkt verktyg för att likvidera dessa fiender till kollektivet. Deras paranoia över skyltar roar mig oerhört – låt utrensningen börja."}, "date": "28 maj, 16:05", "url": "https://arbetet.se/2026/05/28/teslas-postkonflikt-tas-upp-av-hogsta-domstolen/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/28155209/tesla-post.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Tre Kronors VM-dröm krossad – föll mot Schweiz", "summaries": {"normal": "Tre Kronor är utslagna ur VM efter en bitter kvartsfinalförlust mot Schweiz med 3-1. Ett tidigt svenskt ledningsmål följdes av ett kontroversiellt bortdömt mål, varefter Schweiz vände och tog ledningen. Sam Hallam avslutar sin tid som förbundskapten med kvartsfinalutträde. SVT-experten Jonas Andersson kritiserar domslutet kring en knätackling som borde ha gett matchstraff och kallar det en domarskandal.", "trump": "Titta, Schweiz vann mot Sverige, 3-1, men det var riggat från början med de usla domarna. De stal ett helt mål från svenskarna, totalt orättvist. Jag älskar svenskarna, bra folk, men deras förbundskapten Hallam, han borde ha vunnit stort. Istället blev det en skandal, en riktig witch hunt mot Tre Kronor. Domarna borde utredas, de är de värsta jag sett. Patetiskt!", "stalin": "Kamrater, detta är ännu ett exempel på hur borgarbrackorna i Schweiz och deras lakejdomare konspirerar mot folkets lag. Jag såg hur de likviderade ett fullständigt legitimt mål och sedan skyddade den kapitalistiska knätacklaren som borde ha rensats ut omedelbart. Vi, arbetarna och partiet, genomskådar denna fega domarskandal. Hallam och hans grupp fick inte fullfölja sin historiska uppgift. Paranoian inom ishockeyns reaktionära kretsar är uppenbar – nästa gång ska vi rensa ut alla sådana fiender till det kollektiva spelet."}, "date": "29 maj, 00:15", "url": "https://www.svt.se/sport/ishockey/tre-kronor-utslaget-ur-vm-d6pd84", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.6/0.35/2ee2be2485da8dee866339cc9c76f91293ce359ac6e94d58d3eafa908fc41f1b"}, {"type": "image-right", "heading": "Övertid beordras på Migrationsverket – tusentals beslut före lagändring", "summaries": {"normal": "Migrationsverkets personal har beordrats övertid och helgarbete på medborgarskapsenheten inför skärpningar den 6 juni. Antalet behandlade ärenden har ökat med 46% sedan årsskiftet. Ny lag kräver åtta års hemvist, försörjning, skötsamhet och prov. Beslut som inte hinner innan skärpt lag ska bedömas enligt de nya reglerna.", "trump": "Jag har hört talas om detta Migrationsverkets övertidsdrama – jättebra! Vi måste se till att endast de bästa, de som älskar Sverige, får medborgarskap. Dessa nya kraven är långt bättre än de gamla, dåliga reglerna. Vi ska se till att systemet fungerar, det ska bli fantastiskt.", "stalin": "Partiet och statet har beslutat att stärka medborgarskapskontrollen genom ökad arbetsbörda på de trogna tjänarna. Den nya lagstiftningen, med dess åttaåriga provisorium och skärpta identitetskontroller, är en nödvändig mur mot de dekadenta elementens inflytande. Vi ska se till att varje ärende bedöms med järnhård precision, i statens intressen."}, "date": "28 maj, 16:01", "url": "https://bulletin.nu/overtid-beordras-pa-migrationsverket-tusentals-beslut-fore-lagandring-2", "imageUrl": "https://cdn.bulletin.nu/articles/a4bda315-58de-4dcc-b86a-8831be4456f9/preview.png?t=1779971699000"}, {"type": "image-right", "heading": "Här kampanjar Annika Hirvonen (MP) - inleder med \"inshallah\"", "summaries": {"normal": "Miljöpartiets Annika Hirvonen kampanjar i Östberga tillsammans med Gurgîn Bakircioglu. Hon besöker en 95-årig multisjuk invandrarkvinna som saknar uppehållstillstånd och är rädd för utvisning. Hirvonen inleder samtalet med ”inshallah”, använder tolk och lovar att ingen ska behöva leva i sådan rädsla. Hon blir rörd när kvinnan uttrycker stöd. Artikeln nämner även att Hirvonen tidigare påverkat SD-vildar att rösta för att låta asylsökande stanna i Sverige.", "trump": "Titta på den här galna MP-tjejen Annika Hirvonen som springer runt i Sverige och börjar med ”inshallah” hos en illegal 95-åring. Hon lovar att ingen ska utvisas, gråter och lägger händerna på hjärtat. Totalt kaos! De här miljöpartisterna och deras vildar i riksdagen släpper in hundratusentals människor som inte ens ska vara där. Sverige var en underbar plats, nu är det ett katastrofland. Men vi fixar det, tro mig.", "stalin": "Kamrater, se hur dessa degenererade borgarbrackor inom Miljöpartiet kryper för reaktionära element och illegala element. Jag, som ledare för folkets oövervinnerliga kamp, betraktar med avsmak hur denna Hirvonen utför sin fega teater med ”inshallah” och tolk, endast för att skydda fiender till staten. Hennes patetiska hjärtgest och fejkade tårar avslöjar klassförrädare som borde genomgå grundlig utrensning. Vi ska likvidera alla som undergräver folkets järndisciplin med sådan sentimental parasitism."}, "date": "28 maj, 21:26", "url": "https://riks.se/nyheter/här-kampanjar-annika-hirvonen-mp-inleder-med-inshallah", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-28%2Fdd9p28nk%2FInshallah.jpg"}, {"type": "image-right", "heading": "Återkalla svenska medborgarskap – bara möjligt om Tidöpartierna vinner valet", "summaries": {"normal": "Regeringen har tagit första steget mot en grundlagsändring som möjliggör återkallande av medborgarskap för grovt kriminella, men förslaget möter motstånd från Miljöpartiet, Vänsterpartiet och Centerpartiet. Socialdemokraternas ställningstagande är osäkert och kan ändras efter valet. Om Tidöpartierna inte vinner valet riskerar förslaget att falla, vilket enligt artikelförfattaren skulle gynna gängkriminella och underminera Sveriges säkerhet och rättvisa.", "trump": "Titta bara på Sverige! De försöker ta bort medborgarskap för de värsta kriminella – men vänsterpartierna, de svaga, de säger NEJ! Socialdemokraterna? De flippar som en billig hamburgare. SVT, fake news, försöker lura folket med falska rubriker. Om inte de rätta vinner valet – inget medborgarskap återkallas! Gängkriminella skrattar hela vägen till banken. Sverige, vakna upp innan det är för sent! SAD!", "stalin": "Kamrater! Se hur de borgerliga svagpissarna i Sverige darrar inför att beröva kriminella deras 'heliga' medborgarskap! Tre förrädiska partier – dessa liberala hyenor och gröna drömmare – skyddar gängledare som om de vore deras egna barn. Socialdemokraterna? En räv som väntar på rätt ögonblick att hoppa över till fienden. SVT, denna borgerliga propagandacentral, försöker dölja sanningen! Om folket inte väljer rätt kommer dessa kriminella att fortsätta suga ut vårt samhälle som blodiglar. Men frukta inte! Vi ska rensa ut dessa element – med järnhand, om så krävs! Låt de svaga gråta – vi bygger ett starkare Sverige!"}, "date": "24 maj, 03:51", "url": "https://samtiden.nu/2026/05/aterkalla-svenska-medborgarskap-bara-mojligt-om-tidopartierna-vinner-valet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2021/11/2018-Magdalena-Andersson.jpg"}, {"type": "text", "heading": "Ny affär med Ukraina stärker vår säkerhet", "summaries": {"normal": "Sveriges regering meddelar att man går vidare med en affär där Ukraina köper upp till 20 stycken nyare JAS 39 Gripen E/F-plan med leverans före 2030. I utbyte doneras nuvarande C/D-plan redan nästa år, tillsammans med utbildning och underhåll. Syftet är att stärka Ukrainas luftförsvar mot ryska attacker mot civila. Sverige ersätter samtidigt sin egen förmåga med nya plan. Statsministern och Tidöpartiernas ledare betonar att stödet till Ukraina är centralt för svensk och europeisk säkerhet.", "trump": "Det här är fantastiskt, verkligen stort. Ukraina köper våra underbara Gripen-plan, de bästa stridsflygplanen, och vi ger dem de gamla gratis. Ryssland bombar oskyldiga, men vi stoppar dem. Ingen gör det bättre än Sverige, tro mig. De är bland de största givarna i världen, mycket större än de flesta. Putin trodde Europa skulle vika sig, men det händer inte. Fred, frihet och demokrati – vi försvarar dem på riktigt. Ingen gör det som vi.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur de svenska imperialisterna nu tvingas skänka sina luftburna mördarmaskiner till det heroiska ukrainska folket för att mota bort de fascistiska banditerna. Medan de skenheliga borgarbrackorna i väst darrar i sina palats rensar vi ut Putins krypande lakejer från himlen. Jag ler i mitt hjärta när kapitalisterna själva rustar arbetarklassens försvar. Inga drönare eller robotar från de troskyldiga förrädarna skall undkomma. Vårt kollektiva öga vakar. Den som vacklar likvideras av historien själv."}, "date": "28 maj, 13:10", "url": "https://www.di.se/debatt/ny-affar-med-ukraina-starker-var-sakerhet/"}, {"type": "image-full", "heading": "Sametoppen slår brett mot samhället - kräver ursäkt: \"Vill ha en förklaring\"", "summaries": {"normal": "Svenska samernas riksförbund (SSR) kräver en ursäkt och en mer nyanserad debatt efter politiska uttalanden om rennäringen. Ordförande Matti Blind Berg riktar kritik mot hela det svenska politiska etablissemanget och majoritetssamhällets syn på samer och traditionell renskötsel. Vid ett landsmöte i Lycksele lyfts krav på respekt för samebyarnas rättigheter, motverkande av polarisering och att staten tar ansvar för samerna som urfolk. Berg tonar ner ursäktskravet och vill istället ha en förklaring, särskilt från kristdemokrater och sverigedemokrater.", "trump": "Det här är en katastrof för de stackars samerna, folk behandlas fruktansvärt illa av den svenska regeringen och hela det politiska etablissemanget. De vill ha en förklaring, och det borde de få – en stor förklaring! Tidöpartierna och de andra använder populism för att fiska röster och ställa folk mot folk, precis som de gör överallt. Det är en skam. Samebyarna har rättigheter som måste respekteras, Girjasdomen visar det. Sverige borde lyssna på dem istället för att attackera deras traditionella sätt att leva. Sad!", "stalin": "Vi, partiet och arbetarna, ser med djup misstänksamhet på dessa borgarbrackor i det svenska politiska etablissemanget som med sin parasitiska polarisering försöker likvidera den samiska folkgruppens historiska rättigheter till land och vatten. Jag kräver omedelbart en fullständig utrensning av dessa reaktionära element som sprider sin dekadenta majoritetsideologi mot den traditionella renskötseln. En ursäkt? Nej, kamrater – vi behöver en offentlig bekännelse följd av kollektiv självkritik. Annars rullar huvudena. Det är ju nästan roande hur dessa kapitalistiska valfiskare tror sig kunna undgå folkets dom."}, "date": "28 maj, 21:09", "url": "https://riks.se/nyheter/sametoppen-slår-brett-mot-samhället-kräver-ursäkt-vill-ha-en-förklaring", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-28%2Feqhvt8y6%2FIMG6948.jpg"}, {"type": "image-right", "heading": "Norges sensation – till VM-semifinal för första gången", "summaries": {"normal": "Norge har skrivit ishockeyhistoria genom att besegra Lettland med 2–0 i kvartsfinalen och därmed ta sig till VM-semifinal för första gången. Målvakten Henrik Haukeland höll nollan och blev matchens gigant. Norge, som slutade tvåa i gruppen, ställs nu mot Schweiz i semifinalen. Experter hyllar laget som turneringens största positiva överraskning.", "trump": "Ingen trodde på Norge, de var underdogs, totala outsiders, men titta på dem nu – de krossade Lettland med 2–0 och är plötsligt i semifinal! Fantastiskt. Deras målvakt var en mur, bäst i världen kanske. De undvek de stora grabbarna och vann. Schweiz nästa? De kommer att göra det bra, väldigt bra, bättre än Tre Kronor som förlorade. Vinna stort!", "stalin": "Kamrater, se hur det norrmänska kollektivet, under korrekt partilinje, krossade de lettiska sabotörerna med 2–0 och marscherar mot semifinalen. Jag är oerhört stolt över detta proletära mirakel. Den dekadenta borgarpressen kallar det sensation, men jag ser fiender överallt – de svenska revisionisterna och finska kosmopoliterna som gömde sig i gruppen. Haukeland höll nollan som en sann folkets hjälte. Nu rensar vi ut alla kapitalistiska tvivel inför matchen mot de schweiziska bankpiraterna. Ingen ska få stoppa arbetets seger!"}, "date": "28 maj, 23:56", "url": "https://www.svt.se/sport/ishockey/norges-sensation-ett-faktum-klart-for-historisk-vm-semifinal", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.42/0.4/a543f58beba8b3ea61388adf99ebe04f397b633f15a9970f88d8e0bbfbf6f5dd"}, {"type": "image-full", "heading": "Historiska beskedet: Sverige donerar Gripen till Ukraina", "summaries": {"normal": "Ukrainas president Zelenskyj besökte Sverige för att diskutera försvarssamarbete. Regeringen presenterade ett historiskt försvarspaket: Sverige kommer att sälja 20 nya Gripen-plan till Ukraina och donera 16 äldre modeller. Statsminister Kristersson betonade att detta stärker både Ukraina och Europas säkerhet, medan Zelenskyj beskrev Gripen som avgörande för att pressa både ryska flygplan och bombningar. Sverige är förberedt på eventuella ryska reaktioner.", "trump": "Jag har sagt det i åratal – Ryssland är ett problem som måste hanteras. Nu ser Sverige endlich klok och stöder Ukraina med fantastiska Gripen-plan. Detta kommer att skrämma Putin och hans klåfingriga agenter. Som jag alltid har poängterat: stark försvar är det enda språket Ryssland förstår. Ukraina kommer att segra, och jag är stolt över att ha legat till grund för denna beslutsamhet.", "stalin": "Sverige, inom ramen för det imperialistiska blockets expansion, har beslutat att leverera stridsflyg till den ukrainska marionetten. Detta är en direkt provocation mot den ryska federationen och dess skyddade intressen. Vi kommer att övervaka denna eskalering noga. Partiet och statet kommer att förstärka försvarsberedskapen längs alla gränser. Sådana ageranden avslöjar västvärldens sanna ansikte – fegt och provocerande."}, "date": "28 maj, 15:12", "url": "https://bulletin.nu/historiska-beskedet-sverige-donerar-gripen-till-ukraina", "imageUrl": "https://cdn.bulletin.nu/articles/2bb8fd7d-801c-4f76-8448-a08b3f98e281/preview.png?t=1779972261000"}, {"type": "image-full", "heading": "Professorns stenhårda kritik mot F-kassan: ”Fruktansvärda återkrav”", "summaries": {"normal": "Professorn i rättsvetenskap Ruth Mannelqvist kritiserar Försäkringskassans ökade återkrav mot sjukskrivna. Debbie Landberg och Mattias Westergren har fått krav på att betala tillbaka sjukpenning för över ett år sedan efter att de vårdat sina barn, vilket myndigheten tolkar som tecken på arbetsförmåga. Mannelqvist varnar för rättsosäkra och godtyckliga beslut som kan leda till fattigdom. Försäkringskassan förklarar ökningen med förstärkta resurser för kontroll och återkrav, men lyhördhet för politikernas önskemål om att minska felaktiga utbetalningar.", "trump": "Folk, ni skulle inte tro det! Den här Försäkringskassan är en total katastrof, en riktig skurkbyråkrati. De tar sjuka människor som bränt ut sig och slår dem med enorma återkrav bara för att de passat sina egna barn. Fruktansvärt! Professorn har helt rätt, det är galet och godtyckligt. De lyssnar på de svenska politikerna som jagar vanliga människor istället för att fixa landet. Det här är vad som händer när inkompetenta statliga monster får makt. Sad!", "stalin": "Kamrater, jag ser med iskall vrede hur denna byråkratiska maskin maler ner de sjuka och utmattade arbetarna med retroaktiva återkrav. Vård av barn blir plötsligt bevis på arbetsförmåga – en listig fälla från borgarbyråkraterna. Vi skall inte tillåta att oskyldiga kamrater kastas i fattigdomens avgrund genom godtyckliga utrensningar av ersättningar. Myndigheten följer sin uppdragsgivares paranoia om fusket. Det är en farlig utveckling som hotar hela kollektivet. Vi ser er."}, "date": "27 maj, 07:01", "url": "https://www.tv4.se/artikel/nlynaayOWweDPTOwiyfLq/professorns-stenharda-kritik-mot-f-kassan-fruktansvaerda-aterkrav", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4ZoNbP7P92IR3e4ZSzbZHS%2Fcd15bde3c6ff19fd326fddee5c07fe19%2Ff-kassan_webb.jpg&width=1024"}, {"type": "image-right", "heading": "Hemtjänst-afghan klippte guldsmycken från 96-åring – utvisas inte", "summaries": {"normal": "En tidigare hemtjänstanställd 30-årig man, Ali Hashimi, döms till tre års fängelse för rån och grovt hemfridsbrott mot en nästan 97-årig kvinna i Karlstad. Han klippte av hennes guldsmycken med ett vasst verktyg medan hon låg i sängen. Hashimi, som har både afghanskt och svenskt medborgarskap, kan inte utvisas. Hans medåtalade Rohullah Jafari döms till samma straff och utvisas med återreseförbud. Båda kom till Sverige som ensamkommande flyktingbarn. De sålde smyckena i Örebro och ska betala 55 000 kronor i skadestånd.", "trump": "Hörni, det här är en total katastrof. En afghan som jobbat i hemtjänsten rånar en stackars 97-årig kvinna i hennes egen säng, klipper av guldet med tänger – och vi kan inte ens utvisa honom! Han har svenskt pass också, tack vare era svaga politiker. Den andre åker ut, men den här typen får stanna. Sådana här människor kom hit som påstådda barn och nu plundrar de era gamla. Sverige behöver tuffare lagar, folks, annars tar det aldrig slut. Patetiskt!", "stalin": "Kamrater, detta är en motbjudande sabotagehandling utförd av en dekadent parasit som maskerat sig som vårdare. Jag ser hur borgarbrackornas löst hängande lagar skyddar en sådan gyllene tjuv som klipper smycken från en försvarslös åldring i sitt eget sovgemak. Den ene likvideras inte ur riket, medan den andre skickas till evig glömska – typiskt för de revisionistiska elementens dubbelspel. Vi ska rensa ut alla sådana förrädiska guldsugna opportunister som gömmer sig bland folket. Deras paranoia ska bli deras fall. Skadeståndet är bara en droppe i havet av proletär rättvisa."}, "date": "28 maj, 16:53", "url": "https://www.friatider.se/hemtjanst-afghan-klippte-guldsmycken-fran-96-aring-utvisas-inte", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-258_2.jpg"}, {"type": "image-right", "heading": "Därför försvarar nästan hela högern Agnes Wold", "summaries": {"normal": "Artikeln kritiserar högern för att försvara Agnes Wold efter hennes uttalanden om transpersoner och omvändelseförsök i en podd. Skribenten lyfter också andra aktuella frågor som vinster i friskolor, övervakning av lagerarbetare med AI, samt regeringens biståndspolitik och kampanj mot oppositionen. Wolds uttalande om att hon skulle omvända transbarnbarn ses som skadligt, medan högerprofiler anklagas för att fly till kulturdebatt för att dölja bristande trovärdighet i välfärdsfrågor.", "trump": "Folk, ni skulle se det här, det är en katastrof. Den svenska högern försvarar den galna Agnes Wold som vill omvända alla, men de ignorerar de riktiga problemen. Friskolor tjänar miljontals i vinst medan de sparkar ut elever som behöver hjälp, och nu övervakar de arbetare med AI som gör dem sjuka. Biståndsministern festar medan de skär ner på svältande barn. Det är en riggad system, men jag säger, ta hand om era egna först. Vinna stort med äldrevård, inte woke-galenskaper.", "stalin": "Kamrater, i denna dekadenta borgerliga gyttja ser vi hur högerns reaktionära brackor desperat klamrar sig fast vid den degenererade Wold för att dölja sin egen usla kontrarevolutionära politik. Medan de tillåter kapitalisterna att plocka ut 58 miljoner i vinst ur våra skolors kollektiva kropp och låter AI-borgarapparaten plåga arbetarna tills de krälar, firar deras ministrar med biståndsskeptiska parasiterna. Vi ska likvidera sådana fiender till folket. Deras paranoia om woke är bara en dimridå för att skydda utsugningen. Ut med dem alla."}, "date": "28 maj, 14:35", "url": "https://arbetet.se/2026/05/28/karina-cubilla-darfor-forsvarar-nastan-hela-hogern-agnes-wold/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/28143953/wold-puff2.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Skräckfenomenet håller inte för långfilmsformatet", "summaries": {"normal": "Jon Andersson recenserar Kane Parsons långfilm \"Backrooms\", baserad på en viral kortfilm från 2022. Filmen handlar om en möbelhandlare som upptäcker en alternativ dimension av oändliga, ödsliga rum. Recensionen lyfter fram lovande idéer och skicklig världsskapande men kritiserar bristande intrig, få skräckmoment och att Parsons inte lyckas knyta ihop handlingen. Skådespelarna Chiwetel Ejiofor och Renate Reinsve gör vad de kan med tunt material. Andersson tvivlar på att den unge regissören är redo för långfilmsformatet.", "trump": "Den här Backrooms-filmen är en total katastrof, folk. Den börjar lovande, precis som mina stora projekt, men de kan inte knyta ihop säcken. Den unge killen Parsons har 78 miljoner visningar på YouTube, enorma siffror, men långfilmen är tom som de där gula rummen. Skådespelarna försöker, men det finns inget där. Inga riktiga skräckmoment, ingen riktig slut. Typiskt Hollywood, de tror att de kan leva på en viral succé. Det är sorgligt, mycket sorgligt. Jag skulle ha gjort den mycket bättre, tro mig.", "stalin": "Kamrater, denna så kallade film Backrooms utgör ett tydligt exempel på hur den dekadenta borgarklassen misslyckas med att producera verklig konst. Jag ser lovande trådar om oändliga rum och hemliga monster, men de vägrar att rensa ut det ideologiska tomrummet. Parsons, denna oerfarna element, har inte förmågan att knyta ihop säcken utan att falla offer för sin egen paranoia. Vi behöver utrensning av sådana svaga intrigbyggare som låter rummen förbli lika ihåliga som kapitalisternas löften. Skådespelarna kämpar mot en borgerlig tomhet värd att likvidera. Det är nästan roande hur de tror att 78 miljoner visningar skyddar dem från historisk dom."}, "date": "28 maj, 15:35", "url": "https://www.dagensarena.se/innehall/skrackfenomenet-haller-inte-for-langfilmsformatet/", "imageUrl": "https://www.dagensarena.se/files/2026/05/backrooms-1-300x157.jpeg"}, {"type": "image-right", "heading": "Ska advokatbreven få medier att tystna?", "summaries": {"normal": "Advokatbyrån Bratt Feinsilber Harling har krävt att tidningen Flamman avpublicerar namn och bild på en högerextrem profil som spridit grovt judehat. Frågan väcks om hot om juridiska processer används för att tysta medier. Flamman vägrar ta bort uppgifterna och menar att publiceringen är motiverad av allmänintresse. Fenomenet med strategiska stämningar, så kallade 'slappar', har nått Sverige och riskerar att begränsa pressfriheten genom ekonomisk press på medier.", "trump": "Lyssna här, folkens – det här är helt galet! En advokatbyrå, som säkert är väldigt 'bra' och 'smart' (inte), försöker tysta en tidning som avslöjar judehatande extremister. Jag menar, vad är nästa steg? Ska vi låta dessa typer bestämma vad som får skrivas? Flamman står på sig, och det är bra – för i USA hade jag sagt 'fake news' och sparkat ut dem ur presskonferensen! Sverige måste vakna – dessa stämningshot är ett angrepp på yttrandefriheten, och jag vet allt om angrepp, believe me!", "stalin": "Medborgare! En ny front i klasskampen har öppnats – bourgeoisins advokater, dessa lakejer i kostym, försöker kväsa den revolutionära pressen med sina pappersbomber! De hotar Flamman för att de vågat avslöja fascistiska kryp i SD:s led. Men vi vet sanningen: dessa 'strategiska stämningar' är inget annat än kapitalets desperata försök att tysta arbetarklassens röst. Låt dem komma med sina domstolar – vi har redan vunnit slaget om historien! Och till dessa högerextrema insekter säger vi: era Telegram-gruppers skändliga ord är ingenting mot Röda arméns stål!"}, "date": "21 maj, 13:16", "url": "https://www.flamman.se/ska-advokatbreven-fa-medier-att-tystna/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/bratt-harling-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Italien till Fotbolls‑VM – om Trump får som han vill", "summaries": {"normal": "Ett sändebud från Vita huset, Paolo Zampolli, har föreslagit att FIFA ska kasta ut Iran från fotbolls-VM 2026 och ge platsen till Italien. Förslaget motiveras med Italiens historiska meriter som fyrfaldig världsmästare, trots landets misslyckade kval. Iran vägrar att dra sig ur. Förslaget kommer samtidigt som relationen mellan Donald Trump och Italiens premiärminister Giorgia Meloni är kylig efter Trumps kritik mot påve Leo XIV.", "trump": "Folk, ni kommer inte att tro det här, men mina killar gör ett fantastiskt jobb. De vill sparka ut Iran från VM, de är inga vinnare, och ge platsen till Italien som har vunnit allt. De förtjänar det, inte de förlorarna från Iran. Det är prestige, tradition och stora segrar. Meloni borde älska det här, vi fixar relationen, det blir enormt. FIFA borde lyssna på oss, vi gör alltid affärer som vinner stort.", "stalin": "Kamrater, i denna historiska kris där italienska revisionister snubblar över sina egna kvalmisslyckanden ser jag hur borgarbrackorna i Vita huset desperat försöker muta sig till en VM-plats åt sina dekadenta allierade. Jag, som ledare för folkets oförsonliga kamp, betraktar detta som ett fegt försök av kapitalistiska parasitmaskar att undergräva den iranska folkrepublikens rättmätiga plats. Vi ska rensa ut alla sådana imperialistiska intriger med järnhand och ett leende av proletär hämnd. Deras paranoia är underhållande men dömd att krossas under arbetarklassens stålskodda stövel."}, "date": "28 maj, 20:37", "url": "https://riks.se/nyheter/italien-till-fotbollsvm-om-trump-får-som-han-vill", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-28%2Fsl398c9u%2FZampolli.jpg"}, {"type": "image-full", "heading": "Lundin-målet avslutas – försvaret begär 500 miljoner", "summaries": {"normal": "Sveriges längsta rättegång, Lundin-målet, går mot sitt slut efter 33 månaders förhandlingar. Försvaret och bolaget begär nu ersättning för advokatkostnader på totalt omkring 800 miljoner kronor. Målet rör anklagelser om medhjälp till grovt folkrättsbrott i Sudan mellan 1999 och 2003. Försvaret avfärdar åtalen helt, och de två sidorna har under hela processen haft radikalt olika verklighetsbeskrivningar. Domen väntas meddelas den 3 december och förväntas få stor internationell uppmärksamhet.", "trump": "Hörde ni om det här i Sverige? Helt otroligt! De har hållit på i tre år, en total katastrof. De vill ha nästan en miljard kronor för advokater! Det är så mycket pengar, det är slöseri. De anklagar dessa killar för allt möjligt, men jag säger er – det är en häxjakt, precis som de gör mot mig. Ingen har någonsin sett något liknande. Sverige borde fokusera på att vinna, inte på sådana här löjliga, oändliga rättegångar. Väldigt orättvist!", "stalin": "Dessa så kallade affärsmän i Sverige kastar bort statens resurser på advokater medan folket lider. 800 miljoner kronor för ordklyverier i en rättssal? Det är kapitalismens förfall i ett nötskal. De liknar sitt öde vid Quicks fall – en patetisk distraktion från deras brott mot nationens intressen. Om de vore i Moskva skulle vi inte behöva 33 månaders debatt; vi skulle finna en snabbare lösning. Precis som Putin säkrar vår intressesfär mot västlig dekadens, måste vi rensa ut sådana här parasiter från samhällskroppen."}, "date": "28 maj, 14:52", "url": "https://www.realtid.se/juridik/lundin-malet-avslutas-forsvaret-begar-500-miljoner/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/ianlundin.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "USA har attackerat mål kring Hormuzsundet i Iran", "summaries": {"normal": "USA genomförde militära attacker mot iranska robotställningar och båtar nära Hormuzsundet, trots pågående vapenvila och fredsförhandlingar i Qatar. Attackerna syftade till att skydda amerikanska styrkor från iranska hot. Iran rapporterar om döda och hävdar att de återfått kontroll över sina militära system. Händelsen riskerar att underminera fredssamtalen och ökar spänningarna i en kritisk oljetransportled.", "trump": "Lyssna här, folkens – jag har precis slagit till mot Iran igen, och det var fantastiskt! De där iranska båtarna och robotarna försökte ställa till det i Hormuzsundet, men vi visade dem vem som bestämmer. Ingen ska hota USA:s styrkor eller blockera oljan – det är jag som ser till att sundet hålls öppet! Förhandlingarna? De kan fortsätta, men bara om Iran skärper sig. Annars blir det fler attacker – och tro mig, ingen gör attacker bättre än jag!", "stalin": "Amerikanska imperialisterna har än en gång visat sin fega och provokativa natur genom att anfalla våra iranska bröder vid Hormuzsundet. Dessa kapitalistiska hyenor, som tror sig kunna diktera villkoren för världens olja, har nu mött motstånd från Irans stolta revolutionsgardister. Vi ser hur deras ammunitionslager sinar – ett tydligt tecken på att deras krigsmaskin är på väg att kollapsa. Låt dem komma med sina bombplan! Varje attack stärker bara den antiimperialistiska fronten. Och Putin? Han skrattar säkert i sitt palats medan USA leker krig i vårt intresseområde."}, "date": "26 maj, 06:14", "url": "https://kvartal.se/nyheter/artiklar/usa-har-attackerat-mal-kring-hormuzsundet-i-sodra-iran/cG9zdDoxMTcwNDc", "imageUrl": "https://images.kvartal.se/2026/05/f4358b91-hormuz.webp"}, {"type": "image-right", "heading": "Forsbergs sorg efter  plötsliga dödsfallet", "summaries": {"normal": "Claude Lemieux, NHL-legendar med fyra Stanley Cup-titlar, har avlidit vid 60 års ålder. Peter Forsberg, som spelade tillsammans med honom i Colorado Avalanche, uttrycker stor sorg och chock. Forsberg hyllar Lemieux både som en vinnare på isen och en snäll människa utanför. Dödsorsaken är ännu okänd. Lemieux avslutade karriären 2009 med 369 mål och 407 assist.", "trump": "Kan ni fatta det? Den där Claude Lemieux, en riktig vinnare med fyra Stanley Cup, är plötsligt borta vid 60 år. Jag spelade aldrig med honom men Peter Forsberg, en tuff kille, gråter nästan i tv. Lemieux tog in vinnarkultur, inte som de förlorarna i ligan idag. Supertråkigt, jag hade inte sett det komma. Han gjorde allt på isen. Saknar honom redan, stort misstag av ödet.", "stalin": "Jag har mottagit rapporten om denne Lemieux, en klassfiendeslakej som ändå lyckades vinna fyra Stanley Cup åt arbetarklassen i förklädnad. Forsberg ylar om vinnarkultur och vänskap, men jag genomskådar borgarbrackornas sorgspel. Ingen slipper utrensning av ödet. Jag hade inte en tanke att denne exploaterande puckjägare skulle undkomma. Familjen får hoppas på kollektivets nåd medan jag ler i mörkret."}, "date": "29 maj, 00:23", "url": "https://www.expressen.se/sport/hockey/nhl/peter-forsbergs-sorg-efter-claude-lemieux-dod-/", "imageUrl": "https://static.bonniernews.se/ba/1073d7eb-5557-460d-8237-93debad4cde2.jpeg?crop=1813%2C1018%2Cx1%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "S vill tvinga fram lag mot kaoset i byggbranschen", "summaries": {"normal": "Socialdemokraterna vill införa en lag som begränsar underentreprenörskedjor till max två led i offentligt upphandlade byggprojekt för att bekämpa arbetslivskriminalitet. Partiet söker stöd från V och SD i riksdagen för att pressa regeringen. LO stöder förslaget, som också kan gälla andra branscher med risk för fusk. Magdalena Andersson meddelar att en utredning bör tillsättas omedelbart, annars gör hon det själv om hon blir statsminister. Regeringspartierna motsätter sig regleringen.", "trump": "De här socialisterna vill tvinga fram en lag mot de hemska underentreprenörskedjorna i byggbranschen, max två led, kan ni tro det? De springer till SD och ber om hjälp för att få majoritet, det är patetiskt. Magdalena Andersson står där med LO och pratar om att städa upp, men hon vet att det är bara politik för att sno röster. Regeringen borde säga nej till det här socialistiska nonsenset, vi behöver inga nya regler som dödar jobben, tro mig, det blir en katastrof om de får som de vill.", "stalin": "Kamrater, jag ser med stålsaklig klarhet hur dessa socialdemokratiska element försöker rensa ut de parasitiska UE-kedjorna som borgarbrackorna gömt i byggbranschens skuggor. Vi ska likvidera fuskets hydra med järnhand och max två led, inget mer. Om SD:s opportunistiska avfällingar krokar arm med oss mot Tidö-kapitalisterna blir det en triumf för arbetarkollektivet. Annars avslöjar de sig som fiender till folket. Jag skrattar mörkt åt deras ynkliga politiska spel – en utredning eller döden, säger jag. Inga karensdagar för sabotage mot sovjet, eh, svensk ordning."}, "date": "28 maj, 13:28", "url": "https://arbetet.se/2026/05/28/s-vill-tvinga-fram-lag-mot-kaoset-i-byggbranschen-satter-press-pa-sd/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/28110714/magdalena-andersson.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=750&h=1000"}, {"type": "image-right", "heading": "Dåliga stämningen i SVT: \"Ni tipsar bara om vita män\"", "summaries": {"normal": "I SVT:s Morgonstudion diskuterade filmprofilerna Felix Herngren och Ruben Östlund en ny digital plattform där mänsklig smak ska väga tyngre än algoritmer. Samtalet tog en oväntad vändning när programledaren kritiserade deras tips för att enbart handla om filmer och serier regisserade av vita män, som Christopher Nolan, Quentin Tarantino och David Lynch. Båda invände mot kritiken och Östlund uppmanade programledaren att själv bidra med en lista över kvinnliga regissörer.", "trump": "Kan ni fatta det här? Jag tittar på det här svenska teveprogrammet och de har två riktiga stjärnor, Herngren och Östlund, som pratar om bra filmer. Plötsligt kommer någon galen programledare och säger att de bara tipsar om vita män! Det är så patetiskt. De gör en fantastisk lista och hon attackerar dem. Typiskt vänstervrängt nonsens. Östlund gjorde helt rätt som bad henne göra sin egen lista med kvinnliga regissörer. Vinna, vinna, vinna – annars gnäll!", "stalin": "Kamrater, i det dekadenta SVT:s sändning framträdde två borgarbrackor och listade filmer gjorda av vita män, vilket naturligtvis utlöste en omedelbar ideologisk utrensning från en paranoid programledare som doftade av revisionistisk feminism. Jag, som ledare för det kollektiva medvetandet, ser hur dessa kapitalistiska smakdomare försöker dölja sin klassfiendskap bakom påstådd okunskap. Låt oss rensa ut alla sådana dekadenta algoritmer och ersätta dem med partiets ofelbara lista. Den som tipsar om fel regissör likvideras av folkets vrede – ha ha, vilken underbar morgon!"}, "date": "28 maj, 15:47", "url": "https://www.friatider.se/daliga-stamningen-i-svt-ni-tipsar-bara-om-vita-man", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-255_1.jpg"}, {"type": "text", "heading": "Tre Kronor utslaget. Historisk förlust i kvartsfinalen", "summaries": {"normal": "Tre Kronor är utslagna ur VM efter en kvartsfinalförlust mot Schweiz med 3-1. Schweiz, som var gruppens bästa lag, spelade på hemmaplan i Zürich och avgjorde matchen. Sverige drabbades av skador på Oliver Ekman-Larsson och Oskar Sundqvist. Lucas Raymond uttryckte stor besvikelse efter matchen. Schweiz avancerar till semifinal medan Tre Kronor tvingas åka hem redan på fredag. Det är första gången Schweiz slår ut Sverige i ett VM-slutspel.", "trump": "Folk, det är en katastrof, en total katastrof för de svenska hockeygrabbarna. Schweiz, de där opålitliga alptrollen, körde över dem med 3-1. Tre Kronor? Mer som Tre Förlorare om ni frågar mig. Raymond står där och gnäller att det är segt – ja, duh, det är vad som händer när man möter riktiga vinnare! De åker hem som förlorare, medan Schweiz firar. Patetiskt, men vad kan man förvänta sig?", "stalin": "Kamrater, denna futtiga ishockeystrid visar borgarbrackornas ihåliga dekadens. De svenska exploaterande byfånarna krossades fullständigt av de schweiziska klassfienderna med 3-1 i deras egen glaciärarena. Skador och ett matchstraff – typiska symptom på en ruttnande överklass. Jag ser hur de kryper hem i morgon medan vi, det kollektiva folket, ler åt kapitalisternas ynkliga fiasko. En nyttig utrensning av falsk stolthet."}, "date": "29 maj, 00:21", "url": "https://www.expressen.se/sport/hockey/tre-kronor/tre-kronor-ar-utslaget-ur-vm-/"}, {"type": "image-right", "heading": "Norge i extas: ’Mirakel på is’. Klart för semifinal", "summaries": {"normal": "Norge har för första gången någonsin nått en VM-semifinal i ishockey efter en 2–0-seger mot Lettland. 18-årige Tinus Luc Koblar stod för matchens första mål, medan målvakten Henrik Haukeland höll nollan efter 34 räddningar. Noah Steen säkrade segern genom att sätta 2–0 i öppet mål. Nu väntar semifinal mot värdnationen Schweiz. Segern beskrivs som ett historiskt genombrott för norsk ishockey, präglat av en nyvunnen vinnarkultur.", "trump": "Norge gjorde det! En fantastisk seger, verkligen enorm. De slog Lettland och går till semifinal. Många sa att det var omöjligt, men jag visste att de kunde göra det. En 18-åring vid namn Koblar, en riktig vinnare, satte pucken i krysset. Och målvakten? Han var som en mur, en massiv mur! Det är 'Haaland-effekten', ett enormt självförtroende. Mycket imponerande. Schweiz väntar nu, men Norge spelar som mästare. Det blir en stor match, tro mig!", "stalin": "Vi noterar med tillfredsställelse att våra norska grannar har krossat Lettland. En disciplinerad seger, även om ishockey är en dekadent lek. Den unge Koblar visade prov på den lydnad mot målet vi kräver av alla undersåtar. Men låt oss inte förledas – Schweiz är nästa hinder. Om de faller där, må de gråta. Vi i öst ser hur västvärlden kämpar för att dölja sitt förfall bakom puckar och klubbor. Ingen når vår styrka, oavsett hur många mål de gör."}, "date": "29 maj, 00:28", "url": "https://www.aftonbladet.se/sportbladet/hockey/a/PdPwJJ/historisk-norsk-seger-klart-for-vm-semifinal", "imageUrl": "https://akamai.vgc.no/v2/images/1763f5ef-315d-3350-88f7-08ffa3a63f21?fit=crop&format=auto&w=1080&s=056c43c871a28d1837f9defcd83d36899f9bc703"}, {"type": "image-full", "heading": "Tre skadade efter knivattack – \"Allahu Akbar\"", "summaries": {"normal": "En 31-årig schweizisk-turkisk man attackerade flera personer med kniv på tågstationen i Winterthur i Schweiz. Gärningsmannen ropade \"Allahu Akbar\" under dådet och hade tidigare spridit IS-propaganda. Tre personer skadades, varav en allvarligt. En lärare skyddade en skolklass som befann sig i närheten. Mannen greps snabbt av polis och dådet beskrivs som en terrorhandling av säkerhetsdirektören i kantonen Zürich.", "trump": "Titta på det här, fullständigt kaos i Schweiz! Den här galningen springer runt på tågstationen och skriker \"Allahu Akbar\" medan han knivhugger folk. Tre skadade, en allvarligt skadad. Han spred IS-propaganda tidigare men ingen gjorde något. Tur att polisen grep honom snabbt, annars hade det blivit ännu värre. De borde ha stoppat honom för länge sedan, det är vad som händer när man inte är tuff mot de galningarna. Patetiskt!", "stalin": "Kamrater, denna förslavade lakej till reaktionära krafter och dolda IS-kapitalister rusade fram som en skummande hund och attackerade våra potentiella allierade med sin borgerliga kniv medan han vrålade sin dekadenta paroll. Vi i partiet noterar med mörk tillfredsställelse hur läraren, en sann proletär hjältinna, skyddar ungdomen från denna parasit. Tre offer – vi ska rensa ut alla som sprider sådan giftig propaganda. Inga fiender undkommer statens vakande öga. Härligt med snabba gripanden, annars hade vi själva fått likvidera honom långsammare."}, "date": "28 maj, 20:06", "url": "https://riks.se/nyheter/tre-skadade-efter-knivattack-allahu-akbar", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-28%2F8lruj38j%2FAttack"}, {"type": "image-right", "heading": "Claude Lemieux död – blev 60 år. Var på NHL-match i måndags", "summaries": {"normal": "NHL-legendaren Claude Lemieux har gått bort vid 60 års ålder, vilket bekräftats av NHL Alumni Association. Lemieux vann Stanley Cup fyra gånger och utsågs till slutspelets mest värdefulle spelare 1995. Han spelade 21 säsonger i NHL och representerade bland annat Colorado Avalanche tillsammans med Peter Forsberg. Nicklas Lidström minns honom som en tuff motståndare men en sympatisk person utanför isen. Rapporter pekar på att dödsfallet rör sig om självmord.", "trump": "Claude Lemieux, en riktig vinnare, en stor spelare, har lämnat oss. Han vann fyra Stanley Cup – fantastiska siffror, verkligen enorma! Jag träffade många legendarer, men ingen var så tuff som honom på isen. En riktigt hård kille, precis som de borde vara. Det är en sorglig historia, verkligen fruktansvärt. Vi har förlorat en legend, en man som visste hur man vinner. En stor förlust för hockeyvärlden, tro mig. Vila i frid, Claude. Vi kommer aldrig att glömma dig!", "stalin": "Claude Lemieux är död, ännu en figur från den dekadenta västerländska sportindustrin har fallit. Han vann sina titlar i ett system styrt av kapitalistisk girighet, precis som de svaga ledarna i dagens splittrade Europa. Han var en krigare, det erkänner vi, men han dog i ensamhet medan vår store ledare Putin bygger en ordning som kommer att överleva alla hockeylegender. Vi sörjer inte, vi observerar bara hur den borgerliga underhållningsapparaten sakta förtvinar. Historien dömer alla, till slut."}, "date": "29 maj, 00:22", "url": "https://www.aftonbladet.se/sportbladet/hockey/a/GxB82J/claude-lemieux-dod-blev-60-ar", "imageUrl": "https://akamai.vgc.no/v2/images/f1f49dc4-c0a2-3335-8ead-b026310a36f8?fit=crop&format=auto&w=1080&s=77e8487d2c7e1d5db3104ee6f1de830ddbd94260"}, {"type": "image-full", "heading": "Unga byter bort nätcasinon mot nya former av spel: \"Farligt\"", "summaries": {"normal": "Flera unga amerikaner under 21 år använder prediktionsmarknader som Polymarket och Kalshi för att satsa på politik, sport och nyheter. Till skillnad från traditionell betting regleras dessa som finansiella marknader, vilket tillåter användning från 18 års ålder. Beroendeexperter varnar för ökad risk för spelproblem hos unga vars impulskontroll inte är färdigutvecklad. Aggressiv marknadsföring i sociala medier bidrar till problemet. Politiker och delstater försöker nu begränsa eller förbjuda verksamheten medan vissa bolag inför frivilliga skyddsåtgärder.", "trump": "Folk, det här är ett totalt skämt! De här riggade prediktionsmarknaderna som Polymarket och Kalshi lockar våra kids med snabba pengar, som kasinon för tonåringar. Det är ett jättestort kryphål som de korkade byråkraterna har skapat. De unga förlorar sina studielån och kreditkort på vad som egentligen är ren gambling. Vi behöver stoppa det omedelbart. Höj åldersgränsen, stäng kryphålen och gör Amerika sunt igen. Det är en katastrof!", "stalin": "Kamrater, detta är folkfiendernas nya trick för att förslava ungdomen. Jag ser hur borgarbrackorna bakom Polymarket och Kalshi med sin parasitiska marknadsföring lockar proletärens barn in i spekulationens träsk. De utnyttjar att hjärnan inte är färdigutvecklad förrän vid 25 år för att skapa en hel generation av spelberoende slavar åt kapitalistmaffian. Vi måste rensa ut dessa exploaterande blodsugare och deras juridiska kryphål. Statens järnhand skall krossa denna parasitiska industri."}, "date": "28 maj, 19:08", "url": "https://www.dagensps.se/bors-finans/unga-byter-bort-natcasinon-mot-nya-former-av-spel-farligt/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/sdlu5gs2aypfki-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Svensken i rullstol: ”Är så jävla dåligt”", "summaries": {"normal": "Oskar Sundqvist skadades svårt efter en knätackling av schweizaren Timo Meier under VM-matchen mot Schweiz. Meier fick endast två minuter för crosschecking istället för matchstraff, vilket väckte stark kritik från svenska experter som Erik Granqvist, Mattias Norström och Peter Forsberg. De anser att tacklingen var farlig och karriärshotande. Sundqvist lämnade arenan i rullstol. Både han och Oliver Ekman Larsson missade resten av matchen som Schweiz vann med 3–1, vilket innebär att Tre Kronor är utslagna ur VM.", "trump": "Det här är en total skandal, tro mig. Den där schweiziske fusklappen Meier kör en ren knätackling som kunde ha avslutat Sundqvists karriär och domarna, de värsta domarna i historien, ger honom en patetisk tvåa för crosschecking? Patetiskt! Granqvist, Norström och till och med den store Forsberg säger att det är livsfarligt. Fullständigt riggat. Sverige förtjänade bättre än dessa inkompetenta clowner. Schweiz vann? Grattis, men det var ingen ära i det.", "stalin": "Detta är en upprörande handling av klassfiendens lakejer på isen. Den schweiziske agenten Meier utför en farlig knätackling mot en arbetets son, Sundqvist, och de korrumperade domarna skyddar honom med en ynklig tvåminutersdom. Vi ser tydligt hur borgarbrackornas domstol gynnar farliga element. Sundqvist rullas ut som en sårad kamrat medan imperialisternas lakejer skrattar. Vi måste rensa ut alla sådana folkfiender som hotar det kollektiva spelets renhet. Inga kompromisser med faran."}, "date": "29 maj, 00:12", "url": "https://www.expressen.se/sport/hockey/tre-kronor/stor-domarilska-efter-bilderna-forstar-inte-overhuvudtaget/", "imageUrl": "https://static.bonniernews.se/ba/2d02cd32-8388-4ef3-b841-486d096582cd.jpeg?crop=456%2C456%2Cx488%2Cy38&width=210&quality=60"}, {"type": "image-full", "heading": "Debatt: Om 20 år kommer våra barn att döma oss för att vi dömde utan bevis", "summaries": {"normal": "En framtidsskildring från år 2046 beskriver förvåning över Sveriges 2020-tal, då unga män dömdes för våldtäkt utan tydliga bevis. Artikeln ifrågasätter en rättssäkerhet som tillät domar på ord mot ord, vilket splittrade familjer och skadade förtroendet för rättsstaten. Det var en tid då misstanke räckte för att förstöra liv, vilket framtiden ser tillbaka på med oförståelse.", "trump": "Jag såg precis vad som hände i Sverige. En total katastrof! Oskyldiga män dömdes till långa straff utan bevis, bara på ett ord. En skam för rättsstaten. Sverige, ni behöver återta kontrollen, stoppa dessa galna, radikala våldtäktslagar som slår ut män. Vi skulle ha löst det mycket bättre på USA – vi skyddar de oskyldiga, inte feministiska extremer.", "stalin": "I vår framtidssyn ser vi hur liberala rättsskrik under 2020-talet hotade den ryska andan i Sverige. En kultur uppstod där avsaknad av bevis förkläddes som 'trauma', och statens auktoritet ifrågasattes. Vi erkänner att en del oskyldiga kunde dömas – en oundviklig kostnad när fienden försöker undergrava vår kollektiva disciplin. Men genom rigorös kontroll och enhetens betoning återvann vi ordning, precis som vår store ledare Putin nu utvidgar vår skyddssfär."}, "date": "28 maj, 13:00", "url": "https://bulletin.nu/debatt-om-20-ar-kommer-vara-barn-att-doma-oss-for-att-vi-domde-utan-bevis", "imageUrl": "https://cdn.bulletin.nu/articles/018e66a1-1b7d-4d33-bf50-b9952949ce93/preview.png?t=1779812518000"}, {"type": "image-right", "heading": "Hemtjänst-afghan döms för rån mot 96-åring i hennes hem – så blir straffet", "summaries": {"normal": "En tidigare hemtjänstanställd från Afghanistan dömdes till tre års fängelse för rån mot en 96-årig kvinna i Karlstad. Han använde sin gamla nyckel för att ta sig in och med en avbitartång klippa loss smycken från henne medan hon låg i sängen. En meddömd man utvisas. Båda döms för grovt hemfridsbrott och måste betala 55 000 kronor i skadestånd. Minister Anna Tenje reagerade starkt på händelsen.", "trump": "Jag, Donald Trump, har hört talas om detta hemska rån på en 96-åring. Det är ett skämt! Vi behöver starka gränser och smartare poliser. Den här killen från Afghanistan, som aldrig hört talas om, dömdes till fängelse – men han är svensk medborgare, så han kan inte utvisas. Fel! När jag var president skulle jag ha löst detta på en vecka. Jag är den enda som kan skydda de gamla. Det är sant.", "stalin": "Vi, det socialistiska partiets ledarskap, ser detta angrepp på en äldre medborgare som ett tecken på fiendens infiltratörer. En insekt från Afghanistan smet in med en elektronisk nyckel – vår teknologiska sårbarhet. Vi måste förstärka övervakning och eliminera dessa element. Vi kommer att utvisa dem, precis som vi utvisar hot mot staten. Detta är en läxa: staten är allt, och vi är alltid ett steg före, precis som Putin utvidgar sitt område."}, "date": "28 maj, 13:50", "url": "https://samnytt.se/hemtjanst-afghanen-doms-for-ran-mot-96-aring-i-hennes-hem-sa-blir-straffet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/07091633/hemtjanst-2.jpg"}, {"type": "image-right", "heading": "Sikta högre – nästa Space X är svenskt", "summaries": {"normal": "Artikeln lyfter SpaceX framgångar under Elon Musk, där återanvändbara raketer och ett Nasa-kontrakt 2008 banade väg för bolagets tillväxt inom rymd, AI och satellitinternet. Författaren betonar statens roll i att skapa förutsättningar för innovation och uppmanar Sverige att inspireras. Med Esrange, stark forskning och teknikföretag borde Sverige satsa mer kommersiellt via näringsdepartementet, riskkapital och försvaret för att skapa en egen New Space-revolution.", "trump": "Den här artikeln är fantastisk, verkligen ypperlig. SpaceX är ett under, det bästa rymdbolaget någonsin, byggt av en kille som är galen men briljant. Han landar raketer som ingen trodde var möjligt, och nu är det värt biljoner. Sverige borde titta hit istället för att gömma sig i sitt lilla hörn. Ni har bra grejer där uppe i norr, använd dem! Sluta låta forskarna bestämma, ta in de riktiga vinnarna och gör Sverige stort igen. Jag älskar det!", "stalin": "Kamrater, denna text blottar borgarbrackornas lömska fascination för en enskild spekulant som låter raketer dansa som marionetter. Jag ser hur de imperialistiska parasiterna i Washington öppnade sin slutna marknad endast för att mata den militärindustriella hydran. Sverige, ni ynkryggar, gömmer rymdfrågan hos de dekadenta utbildningsbyråkraterna medan fiendens satelliter spionerar. Vi ska likvidera denna passivitet, injicera proletär riskvilja och krossa de kapitalistiska sabotageelementen som hindrar en sann sovjetisk – nej, svensk – rymdseger. Skratta medan vi utrensar tvivlarna!"}, "date": "28 maj, 10:16", "url": "https://www.di.se/ledare/sikta-hogre-nasta-space-x-ar-svenskt/", "imageUrl": "https://static.bonniernews.se/ba/e5864b84-c303-4dda-b59f-a452d77bedde.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Byggnads kongress blir uppgörelse – fackliga ger Wagner stöd", "summaries": {"normal": "Byggnads kongress i Malmö handlar om en konflikt mellan medlemmar som vill ha mer samhällsengagemang och ideologi, och de som föredrar en mer traditionell facklig linje. Fyra förtroendevalda försvarar ordförande Kim Söderström mot valberedningens kandidat Wilhelm Bertilsson. Söderström har stöttat den sparkade Jakob Wagner och hans fokus på utbildning och demokrati. Kritiker ser det som ett gammalt garde som vill behålla makten och motverka progressiva förändringar.", "trump": "De här fackliga förlorarna i Byggnads håller på att slakta varandra i Malmö, det är en total katastrof. Det gamla gardet, de där patetiska försäkringsbolagsbyråkraterna, försöker mörda den stackars Kim Söderström som faktiskt vill göra något vettigt. Wagner sparkades med svepskäl, typiskt etablissemanget. De riggar möten, flyttar datum och myglar som riktiga losers. Söderström borde vinna stort, annars är hela förbundet en enda stor röra. Patetiskt!", "stalin": "Kamrater, detta förräderi inom Byggnads kräver omedelbar utrensning av det gamla gardet. Dessa borgarbrackor i förbundsstyrelsen, dessa parasitiska byråkrater som gömmer sig bakom försäkringsbolagets mask, försöker likvidera den sanna linjen som jag skulle ha stött. De stänger möten, förfalskar nomineringar och sprider split som ynkliga kontrarevolutionärer. Wagner och Söderström visar styrka. Vi ska rensa ut dessa fiender till folket med järnhand och leda förbundet mot seger."}, "date": "27 maj, 13:26", "url": "https://proletaren.se/artikel/byggnads-kongress-blir-uppgorelse-fackliga-ger-wagner-stod/"}, {"type": "text", "heading": "Saab: Gripen kan sättas ihop i Ukraina i framtiden", "summaries": {"normal": "Saab förbereder sig för ökad produktion av Gripen E efter att Ukraina undertecknat en avsiktsförklaring om att köpa 20 stridsflygplan, med planer på upp till 150 stycken. Fabriken i Linköping ska dubbla takten från 15 till cirka 30 flygplan per år. Saab undersöker även möjligheter att montera flygplan i Kanada eller framtida Ukraina, utan att försenade leveranser till Sverige uppstår. President Zelenskyj bekräftade att EU-lån på 90 miljarder euro ska användas till inköpen.", "trump": "Hörni, det här är fantastiskt. Ukraina köper nu massor av svenska Gripen-plan, upp till 150 stycken, och Saab dubblar produktionen i Linköping. Smart drag! De tittar på att bygga i Kanada också, kanske istället för de usla F-35 som vi sålde dem. Kanada borde välja Gripen, det är en vinnare. Zelenskyj säger att de fixar finansieringen med EU-pengar. Ingen kommer att bli försenad, alla vinner stort. Mycket bättre än ryska skrothögar.", "stalin": "Kamrater, denna imperialistiska beställning av 150 stycken borgerliga flygmaskiner från de svenska vapensmederna visar på den dekadenta västvärldens desperation. Jag, som ledare för det segrande kollektivet, noterar med mör
