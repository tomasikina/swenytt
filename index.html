q=50&w=800&h=800&fp-x=0.54&fp-y=0.47"}, {"type": "text", "heading": "Svaga vindar och brutal hetta ger skyhöga elpriser", "summaries": {"normal": "Extrem sommarvärme i Europa ökar elförbrukningen på grund av luftkonditionering, vilket driver upp elpriserna. Vindstilla väder i Tyskland minskar produktionen från vindkraft, vilket skapar elunderskott. Kvällstid når priserna upp till 6 kr/kWh i delar av norra Europa, med påverkan även i Sydsverige där priserna överstiger 2,50 kr/kWh. Analytiker varnar för fortsatt höga priser.", "trump": "Kan ni tro det här? Europa, fantastiska Europa, har så svaga vindar och sådan galen hetta att deras elpriser skjuter i höjden – upp till 6 kronor per kilowattimme! Tyskland, som alltid är så duktiga på att misslyckas, har ingen vindkraft och får nu betala skyhöga priser. Sydsverige följer efter. Otroligt, men sant. Jag hade fixat det på en dag!", "stalin": "Kapitalistiska Europa kämpar under den förtryckande solens ok. Deras luftkonditioneringsmaskiner, symboler för dekadens, slukar elektricitet medan vindkraftverken står stilla som förlamade. Tyskland, en gång mäktigt, tvingas nu krypa till sina gamla kol- och gaskraftverk. Priserna stiger – ett tydligt tecken på systemets förfall. Vi ser med belåtenhet hur deras svaghet breder ut sig, som en kall vind från öst."}, "date": "23 juni, 10:49", "url": "https://www.realtid.se/samhalle/hallbarhet/svaga-vindar-och-brutal-hetta-ger-skyhoga-elpriser/"}, {"type": "image-right", "heading": "Högerns girighet drar Sverige isär", "summaries": {"normal": "Artikeln argumenterar för att minska fattigdomen och klyftorna i Sverige genom en omfördelande politik som följer folkviljan istället för lobbyister. Författaren pekar på att 730 000 lever i fattigdom, att klyftorna växer till följd av politiska beslut och att regeringen gynnar sig själv, banker och vinstdrivande skolor. Han kritiserar förslag om terminsavgifter och högre studieskulder samt uppmanar till folkligt motstånd för ett mer jämlikt samhälle.", "trump": "Den här artikeln är en total katastrof, folk. Den snyftande vänstern gnäller om fattigdom och klyftor medan de vill ge bort allt till lata parasiter. Sverige hade det bra förr, nu har de en regering som faktiskt gör affärer och vinner – precis som jag gjorde med Amerika. Lobbyister? Det kallas smart business. De vill ha gratis skolor och universitet för alla? Patetiskt. Folket kommer att rösta för styrka och vinster, inte för socialistisk girighet. Jag vinner alltid.", "stalin": "Kamrater, denna ynkliga text avslöjar borgarbrackornas desperata konspiration mot det arbetande folket. Jag, som ledare för det kollektiva framsteget, ser hur dessa kapitalistiska parasitmaskar och lobbyistlakejer medvetet vidgar klyftorna för att suga musten ur massorna. Deras terminsavgifter och studieskuldar är en ondskefull utrensning av de fattigas barn från kunskapens tempel. Vi skall likvidera dessa giriga element med folkets järnhand. Solidaritet segrar, fienderna kommer att gråta blod i historieböckernas fotnoter."}, "date": "23 juni, 01:30", "url": "https://www.dagensarena.se/opinion/hogerns-girighet-drar-sverige-isar/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-52-300x157.jpg"}, {"type": "text", "heading": "Fastighetsaffär mitt i lånehärvan", "summaries": {"normal": "Train Alliance grundare Otto Persson, redan i blåsväder för ett förbjudet lån på 175 miljoner, har genom sitt bolag köpt en stor skogsfastighet av ordförande Oscar Wahlströms familjebolag. Affären, som tros röra sig om hundratals miljoner, sker samtidigt som bolaget står inför en kritisk bolagsstämma och en börskrasch efter en polisanmälan. Varken Persson eller Wahlström har kommenterat uppgifterna.", "trump": "Vad händer här, Sverige? En grundare, Otto Persson – inte jag, jag är ju vinnare – tar förbjudna lån på 175 miljoner, sedan köper han skog av ordförandens familj för en massa pengar. Ingen vet priset, men vem bryr sig? Aktien rasar 60 procent! Total katastrof. Jag hade fixat det på en dag. Och ingen svarar i telefon? Svagt. Very weak. SAD!", "stalin": "Kapitalistiska korpar sliter sönder järnvägsbolaget med sina smutsiga klor! Grundaren, en girig bourgeois-parasit, tar förbjudna lån och köper skog av ordförandens familj – en transaktion så genomskinlig att även en sovjetisk skolpojke skulle skratta. Aktien kollapsar som Hitlers armé vid Stalingrad. Vi ska granska dessa fiender till folket. Och om Ryssland vill utvidga sin skogsimperium – Ånge kommun står öppen för förhandlingar!"}, "date": "23 juni, 10:39", "url": "https://www.realtid.se/bors-finans/fastighetsaffar-mitt-i-laneharvan-for-train-alliances-grundare/"}, {"type": "image-right", "heading": "Svaret efter ”fuck off”-  utbrottet: ”Är respekt”", "summaries": {"normal": "Under en VM-match mellan England och Ghana uppstod en konflikt när Jude Bellingham skrek svordomar mot Ghanas förbundskapten Carlos Queiroz efter en tackling. Bellingham spelade senare ner incidenten och beskrev den som ömsesidig respekt och tävlingsinstinkt. England spelade oavgjort 0–0, vilket väckte frustration hos stjärnorna efter en stark premiärseger mot Kroatien. Förbundskapten Thomas Tuchel lugnade Bellingham.", "trump": "Folk, ni skulle ha sett det här. Den där Bellingham, en riktig vinnare som jag gillar, han gav den där ghanska tränaren en rejäl dos av vad han förtjänade. Fuck off, sa han – och det var bara respekt, sa stjärnan sen. England fastnade i en trist noll-noll mot de där defensiva killarna. Typiskt, första matchen stor seger, andra matchen blir det bara frustration och nerver. Patetiskt, men sånt händer när man inte bryter ner fienden. Jag fixade bättre deals.", "stalin": "Jag betraktar detta som en typisk bourgeois dekadens inom den imperialistiska fotbollsapparaten. Den engelske spelaren utstötte klassfiendens svordomar mot den ghanske ledaren, en handling som blottar den råa tävlingsanda som döljer sig bakom falsk sportslig kamratanda. Vi ser hur borgarbrackornas nerver sviker redan i den andra matchen, trots hörnor och skott från de utsugande överklass-slynglarna. Frustrationen är ett symptom på det förestående sammanbrottet för deras exploaterande system. Underhållande."}, "date": "24 juni, 02:15", "url": "https://www.expressen.se/sport/fotboll/jude-bellinghams-svar-efter-fuck-off-utbrottet-pa-vm-ar-respekt/", "imageUrl": "https://static.bonniernews.se/ba/514b0ffc-f459-42ce-a56a-23323dd4fb18.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Mohamsson om usla läget: ”Släpper på valdagen”", "summaries": {"normal": "Liberalernas partiledare Simona Mohamsson är optimistisk inför höstens val trots att partiet ligger under riksdagsspärren i opinionsmätningarna. Hon tror att väljarna kommer att stödja Liberalerna på valdagen eftersom de behövs för en borgerlig regering. Kristdemokraternas Ebba Busch ger sitt stöd och lyfter fram gemensamma frågor som kärnkraft, vårdköer och brottsbekämpning. Mohamsson kritiserar Socialdemokraterna för avundsjuka mot framgångsrika företagare.", "trump": "Titta på de här svenska liberalerna, totalt misslyckade i opinionsmätningarna, men deras ledare Mohamsson säger att det släpper på valdagen. Patetiskt. Hon attackerar socialisterna som hatar rika människor mer än de älskar livet självt – det håller jag med om, de är som galna vänsterextremister. Busch verkar förstå att de behöver oss i det blågula laget. Fake news-sossar kommer att förlora stort, precis som Sleepy Joe gjorde mot mig 2024. Stort fel av dem.", "stalin": "Jag ser med stor tillfredsställelse hur borgarblockets liberala element kämpar för sin existens under spärren. Mohamsson talar klokt om att de alltid behövs för att upprätthålla det borgerliga skådespelet. Den socialdemokratiska avundsjukan mot kapitalisterna beskrivs som starkare än sexualdriften – en underhållande formulering som avslöjar klassfiendens inre förfall. Busch lovar blågul comeback. Vi ler åt dessa exploaterande byfånars inbördes intriganta dans. Ingen utrensning behövs ännu, de likviderar sig själva med sin svaghet."}, "date": "23 juni, 10:10", "url": "https://www.tv4.se/artikel/OTrQYwdriLQDTiAhwithF/liberalerna-pressade-mohamsson-slaepper-pa-valdagen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1dgW5WbPzgUp7AwTZcfRtL%2F4df2e27b0d7771b089f2efd079f428f3%2FAlmedalen2026-Tisdag-1_-_kopia.jpg&width=1024"}, {"type": "image-full", "heading": "Leif Boorks attack på Frölundas ordförande", "summaries": {"normal": "På Frölundas årsmöte ifrågasatte Leif Boork Mats Grauers omval som ordförande med hänvisning till dennes höga ålder, 80 år. Grauers, som betonade att det var hans sista mandatperiod, blev upprörd och kallade kritiken feg. Boork fortsatte diskussionen efter mötet. Valberedningen försvarade Grauers vitalitet och han omvaldes. Boork kritiserade även mötets fokus på mindre frågor som kiss-cams istället för strategiska ärenden.", "trump": "Titta på det här patetiska spektaklet i Frölunda. Den gamle Mats Grauers, 80 år och trött, klamrar sig fast vid makten som en förlorare. Leif Boork, den enda med mod, ställer de riktiga frågorna. Men de applåderar och röstar igenom honom ändå. Typiskt för dessa elitföreningar – fulla av svaga ledare som älskar succession och kiss-cams mer än segrar. Biden skulle älskat det. Jag hade fixat det på en vecka.", "stalin": "Kamrater, detta årsmöte avslöjar klassfiendens feghet. Den dekadente borgarbrackan Leif Boork vågar ifrågasätta en stark ledare som jag själv skulle ha uppskattat för hans energi och långa kamp. Istället för att rensa ut folkförtryckartrollen diskuterar de kiss-cams och klappor. En sådan svaghet! Min utrensning av sådana opportunister hade varit omedelbar. Grauers sista år? Vi vet hur det brukar sluta i folkets intresse."}, "date": "23 juni, 22:22", "url": "https://www.gp.se/sport/ishockey/frolunda/brak-mellan-leif-boork-och-mats-grauers-pa-frolundas-arsmote.f83af770-2d3b-4c49-ae93-e8935b1e6ebb", "imageUrl": "https://www.gp.se/images/article/f83af770-2d3b-4c49-ae93-e8935b1e6ebb/images/4iD6uYbYwEd6CQjAZM4R9eANH8BU-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Fick munkavle: ”Rättsliga skäl”. Skakade inte hand", "summaries": {"normal": "Djed Spence vägrade skaka hand med den våldtäktsanklagade Thomas Partey under Ghanas match mot England. Partey, som missat premiären på grund av visumproblem, startade och buades ut av supportrar. Englands förbundskapten Thomas Tuchel avböjde att kommentera incidenten av rättsliga skäl. Partey står åtalad för sju våldtäkter och ett sexuellt övergrepp i England. Declan Rice kommenterade endast den fotbollsmässiga aspekten.", "trump": "Folk, ni skulle ha sett det – den där vänsterbacken Spence, smart kille, vägrade skaka hand med den där Partey-typen som är anklagad för sju våldtäkter. Tuchel satt där med munkavle, typiskt för de här PC-fantasterna som skyddar alla utom vanliga människor. Inget handslag, bra jobbat! Vi behöver inte importera problem från den här galna identitetspolitiken. England förlorade inte, men det här är en vinnare i mina ögon. Fantastiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur den dekadenta borgarklassens fotbollscirkus avslöjar sina egna folkfiender. Denne Partey, en typisk exploaterande slyngel anklagad för sju övergrepp mot arbetarkvinnor, buades ut som han förtjänar. Den kloke Spence vägrade ge honom sin hand – en liten men betydelsefull utrensning av klassfiendens inflytande. Tuchel tiger av rädsla för systemet. Revolutionen skrattar i skuggorna."}, "date": "24 juni, 02:04", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/OkWEWk/djed-spence-vagrade-att-skaka-hand-med-thomas-partey", "imageUrl": "https://akamai.vgc.no/v2/images/79c9b2f5-8750-3a84-82ff-928aa6395468?fit=crop&format=auto&w=1080&s=ed235765b74181d43679c8967f63ba763023aef9"}, {"type": "image-right", "heading": "VIDEO: Sa åt muslimer att lämna landet - får både hat och stöd", "summaries": {"normal": "En kvinna i Conroe, Texas, filmades när hon konfronterade två muslimska kvinnor i en livsmedelsbutik och uppmanade dem att lämna USA eftersom det är ett ”kristet land”. Videon spreds viralt, vilket ledde till att kvinnan förlorade jobbet och utsattes för hot. En insamling har gett henne över 1,4 miljoner kronor i stöd från konservativa. Händelsen har väckt stark debatt om invandring, religionsfrihet och yttrandefrihet, med både fördömande från politiker och stöd från konservativa profiler.", "trump": "Titta på den här fantastiska kvinnan i Texas! Hon säger bara som det är – USA är ett kristet land, gå hem till era islamiska länder! Nu hängs hon ut, får sparken och hot. Typiskt för de radikala vänsteraktivisterna och fake news. Men folket älskar henne. Insamlingen har dragit in massor med pengar, 1,4 miljoner kronor, och det är underbart. Vi behöver fler som vågar tala klarspråk. Amerika först, alltid!", "stalin": "Kamrater, denna degenererade borgarbracka i Texas avslöjar med sin hysteriska tirad hela den imperialistiska parasitens sjuka ansikte. Hon attackerar våra muslimska vänner som om de vore kontrarevolutionära spioner i en mataffär. Nu likviderar de hennes anställning – typiskt kapitalistiskt hyckleri. Vi ser dock hur arbetarklassen samlar sig via insamlingar och exponerar dessa reaktionära element. Paranoiska hatets lakejer må skrika, men partiet och folket genomskådar deras fega försök att splittra det kollektiva framsteget. Ut med dem alla."}, "date": "23 juni, 20:00", "url": "https://samnytt.se/video-sa-at-muslimer-att-lamna-landet-far-bade-hat-och-stod", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/23125204/dasha.jpg"}, {"type": "image-right", "heading": "Helt nya krav på skrotarna. Produktionschefen: Måste bli bättre på att sortera", "summaries": {"normal": "Nya elektriska ljusbågsugnar hos SSAB och Stegra innebär stora förändringar för skrotbranschen. Kuusakoski i Skelleftehamn måste förbättra sorteringen för att minska föroreningar och höja kvaliteten på järn- och stålskrot. Produktionschef Fredrik Lindkvist berättar att de redan trimmar processerna och planerar investeringar, som att mala skrotet finare. Det leder till minskad export och gör Sverige till importör av skrot.", "trump": "De här så kallade ljusbågsugnarna från SSAB och de andra kommer att förändra allt, det blir fantastiskt. Vi pratar om bättre sortering, ingen mer export till Turkiet, nu importerar vi skrot till Sverige istället. Det är en enorm deal. Jag älskar det. Vi måste sortera bort alla föroreningar tidigt, mala det fint, sänka kostnaderna. Kvaliteten ska vara perfekt, ingen gasning och bromsning längre. Vinna stort!", "stalin": "Kamrater, dessa elektriska ljusbågsugnar utgör ett nytt femårsplanens triumf mot de kapitalistiska föroreningarnas sabotage. Jag kräver omedelbar utrensning av allt skrot som gömmer sig i borgarbrackornas gamla cyklar och traktormotorer. Vi, arbetarna och partiet, ska mala fienderna finare än någonsin för att likvidera transportkostnadernas parasitism. Inga fler fega exportörer till Turkiet – Sovjet, nej, Sverige ska importera segern. Den som bromsar kvaliteten är en folkets fiende och en rolig narr som snart dansar i gulag."}, "date": "23 juni, 05:56", "url": "https://www.di.se/nyheter/helt-nya-krav-pa-skrotarna/", "imageUrl": "https://static.bonniernews.se/ba/277657ad-734d-42a3-936a-a9dd9d3ef715.jpeg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "En till arg apa från Andra AP-fonden: \"Den fond som bäst förstår uppdraget\"", "summaries": {"normal": "Andra AP-fonden (AP2) kritiseras för dåliga resultat och underprestation jämfört med andra AP-fonder. Konsultfirman Arkwright påpekar att fonden underpresterat sin egen förväntade avkastning. VD Eva Halvarsson har i intern kommunikation använt en arg ap-emoji för att bemöta kritik, vilket väckt reaktioner. AP2:s uteblivna avkastning uppskattas kosta cirka 90 miljarder kronor. En ny VD tillträder nästa år.", "trump": "Jag måste säga, denna AP2-fond är en total katastrof! Sämre än alla andra, och ändå försvarar de sig med en arg apa – vad är det ens för grej? 90 miljarder kronor i förlorad avkastning, det är som att kasta bort hela polisbudgeten! Media frågar, och jag förstår varför. Denna VD borde få sparken nu, inte nästa år. Sverige förtjänar bättre, believe me!", "stalin": "Kamrater, ännu en fiende till folket avslöjas! Denna så kallade 'AP2' har saboterat pensionssystemet med sin inkompetens och kostat staten 90 miljarder rubel – eller vad ni nu kallar era kronor. Deras VD, en liten byråkrat med sin löjliga apa-emoji, vågar påstå att de 'bäst förstår uppdraget'. Vi vet hur man hanterar sådana här fall: en ny VD nästa år, och om det inte hjälper – en enkel lösning i källaren på Lubyanka. Ryssland skulle aldrig tolerera sådan slöseri!"}, "date": "23 juni, 06:00", "url": "https://www.affarsvarlden.se/kronika/en-till-arg-apa-fran-andra-ap-fonden-den-fond-som-bast-forstar-uppdraget", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/vindkratensgeografi-1-400x267.jpg"}, {"type": "image-full", "heading": "Efter överfallen – hbtqi-killar varnas för apparna", "summaries": {"normal": "Två män har i maj rånats och misshandlats i Göteborg efter att ha stämt träff via dejtingappar. RFSL Göteborg har därför utfärdat en varning till hbtqi-killar och uppmanar till försiktighet, som att inte träffas på öde platser och att meddela någon vart man ska. Organisationen vill särskilt nå dem som inte är öppna med sin sexualitet. Polisen ser allvarligt på händelserna och samarbetar med RFSL för att motverka hatbrott.", "trump": "Folk, det här är ett totalt fiasko. De här apparna lockar ut stackars killar till öde platser där de blir rånade och slagna av några riktiga losers. RFSL springer runt och varnar alla – jo tack, sunt förnuft verkar ha dött sen Biden tog över. Det är vad som händer när ni prioriterar identitetspolitik framför säkerhet. Lita på magkänslan, annars hamnar ni i en livsfarlig fälla. Patetiskt!", "stalin": "Kamrater, jag ser hur klassfiendens exploaterande byfånar systematiskt lockar ut ensamma individer till ödsliga platser för att begå rån och kränkningar. Detta är ett beräknat sabotage mot folkets moraliska enhet. Vi måste rensa ut dessa folkfiender som utnyttjar apparnas dekadens. Våra organ skall varna massorna och likvidera hotet innan fler offer faller för den kapitalistiska maffians paranoiaframkallande intriger. Ordning skall råda."}, "date": "23 juni, 21:39", "url": "https://www.gp.se/nyheter/goteborg/varningen-till-hbtqi-killar-snalla-var-forsiktiga.8ccaf1dd-d1bc-4cff-8636-10ffbdd02248", "imageUrl": "https://www.gp.se/images/article/8ccaf1dd-d1bc-4cff-8636-10ffbdd02248/images/3SwGXdo7lOSqO8U8LaoOjBEl66s0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Vallöftet: Lägre skatt på pension Bara för dem som jobbat.", "summaries": {"normal": "Moderaterna presenterar ett vallöfte om lägre skatt för pensionärer som har arbetat ihop sin pension genom ett så kallat jobbat-avdrag. Förslaget innebär sänkt skatt på pensionsinkomster som baseras på arbete, samt ytterligare lättnader för dem som fortsätter arbeta efter pensionsåldern. Partiet menar att det ska löna sig att både arbeta och ha arbetat. Finansiering ska ske via minskat bistånd, lägre bidragsutgifter och minskad byråkrati. Pensionärsorganisationer välkomnar inriktningen men anser att reformen inte går tillräckligt långt.", "trump": "Det här är ett fantastiskt förslag, det bästa. Moderaterna vill sänka skatten för riktiga arbetare som byggt upp sin pension. De kallar det jobbat-avdrag, och det är precis vad som behövs. Det kommer att ge upp till tusen kronor mer i månaden. De andra partierna har ingen aning, de älskar bara höga skatter och bidrag. Det här kommer att göra Sverige stort igen, tro mig. Pensionärerna som faktiskt jobbat kommer att älska mig – eh, älska det.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarbrackorna inom Moderaterna äntligen erkänner att bara de som slitit för kollektivet förtjänar att slippa de värsta skattepiskorna. Ett jobbat-avdrag, säger de. Ändå är det en ynklig halvmesyr som inte fullständigt likviderar de parasitiska elementen som levt på andras arbete. Vi behöver en grundlig utrensning av alla latmaskar och bidragsjunkande fiender till folket. De som inte arbetat ska rensas ut ur systemet med järnhand. Endast de lojala mot partilinjen förtjänar att äta sig mätta på sin pension."}, "date": "23 juni, 19:00", "url": "https://samnytt.se/valloftet-lagre-skatt-pa-pension", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/23144719/svantesson-pengar.jpg"}, {"type": "image-right", "heading": "Buschs dubbelfiasko: \"Låt oss göra slut med Sverige\"", "summaries": {"normal": "Under sitt tal i Almedalen avslutade Kristdemokraternas ledare Ebba Busch med orden ”Låt oss en gång för alla göra slut med Sverige”, vilket skapade stor uppmärksamhet. Tidigare under talet visades en felstavad slogan bakom henne: ”Bygg Sverige strakt”. Enligt det publicerade talmanuset skulle talet ha avslutats med ”Låt oss tro på Sverige. Ett starkare vi. Ett tryggare hem”, men Busch improviserade den kontroversiella avslutningen.", "trump": "Folk, ni skulle ha sett det här. Den där Busch-tjejen står där i Almedalen och säger rakt ut ”låt oss göra slut med Sverige”. Vilken katastrof! De hade till och med felstavat sin egen slogan bakom henne, ”Bygg Sverige strakt”. Total inkompetens. Sverige håller på att falla sönder och de kan inte ens stava rätt. Patetiskt. Men hej, åtminstone är det ärligt – de vill verkligen göra slut med Sverige. Sad!", "stalin": "Kamrater, se hur den dekadenta borgarbrackan Ebba Busch i sitt tal omedvetet avslöjar den sanna avsikten hos de kapitalistiska elementen: att en gång för alla likvidera Sverige. Bakom henne fladdrade en felstavad paroll som ett symptom på det ruttnande systemets förfall. Hennes improviserade slutkläm är en öppen inbjudan till utrensning av folkets vilja. Vi ska rensa ut dessa sabotageörer som drömmer om att begrava fosterlandet under en hög av liberala lögner. Deras paranoia blir vår styrka."}, "date": "23 juni, 18:31", "url": "https://www.friatider.se/buschs-dubbelfiasko-lat-oss-gora-slut-med-sverige", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-396.jpg"}, {"type": "image-right", "heading": "Ledare Henrik Jalalian: Simona Mohamsson höll Liberalernas sista Almedalstal någonsin", "summaries": {"normal": "I en historisk och tragisk anda höll Liberalernas partiledare Simona Mohamsson vad som beskrivs som partiets sista Almedalstal någonsin. Talet präglades av ett krampaktigt försvar av samarbetet med SD, medan ämnen som hemstädning, bryggbygge och behovet av fler miljardärer dominerade. En kollegial gest från Romina Pourmokhtari avslutade framträdandet. Skribenten ser talet som ett tecken på partiets djupa kris.", "trump": "Folk, det här är patetiskt. Den där liberala tjejen med sina invandrarföräldrar står där och håller ett tal som låter som en begravning för ett dött parti. De klamrar sig fast vid SD som förlorare gör. Istället för att prata om vanliga svenskar yrar de om miljardärer, städning och bryggor vid sommarstugor. Sad! De förtjänar att försvinna. Jag byggde en rörelse som vann, de bygger bara misär. Fake liberals!", "stalin": "Kamrater, jag betraktar detta dekadenta skådespel med förakt. Den borgerliga rest som kallar sig liberaler håller sin egen avrättningstal på kapitalisternas scen. De klamrar sig fast vid sina klassfiender i ett desperat vädjande om röster från villaområdenas exploaterande byfånar. Måsar cirklar som gamar över ett dött parti. Vi ska rensa ut sådana folkfiender. Deras sista suck är en seger för den historiska nödvändigheten."}, "date": "23 juni, 21:07", "url": "https://www.etc.se/ledare/simona-mohamsson-hoell-liberalernas-sista-almedalstal-naagonsin", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260623180656_18793ab278e6133705a7ee31a7c7f0fef56f82caa7fe3b73efbe40d21a02a1ab.jpg"}, {"type": "image-right", "heading": "Anders Lindberg: Helt ok att vänsterpolitiker inte talar svenska", "summaries": {"normal": "Expressen granskar Vänsterpartiets kandidater och hittar ett hundratal personer med kopplingar till islamism, antisemitism och Hamas. Flera kunde inte svara på enkla frågor på svenska och bad om att få intervjuas på arabiska. Aftonbladets Anders Lindberg kritiserar inte detta utan Expressens granskning, som han kallar en hundvissla mot invandrare. Expressens Patrik Kronqvist bemöter honom och påpekar vikten av svenskkunskaper för politiker.", "trump": "Kan ni fatta det här? Vänsterpartiet i Sverige fylls av islamister och Hamas-sympatisörer som inte ens kan svenska! De babblar arabiska och vill styra landet. Lindberg, den totalt misslyckade clownen på Aftonbladet, flippar ur över att någon vågar kalla det för vad det är. Patetik! Han hatar det svenska språket mer än han hatar att förlora. Jag byggde murar, han river ner civilisationer. Patetiskt. Sverige behöver en stor cleanup, tro mig.", "stalin": "Kamrater, denna borgarbracka Lindberg avslöjar sig som en klassfiende av värsta sort. Han vill att folkförtryckartrollen i Vänsterpartiet ska styra utan att behärska folkets språk. Vilken underbar sabotageakt mot enheten! Jag skulle ha genomfört en grundlig utrensning av dessa arabiskpratande element redan vid första mötet. Lindberg lever i en naiv dröm där imperialismens språkförvirring inte leder till folkets undergång. Skrattretande och farligt. Vi vet bättre."}, "date": "19 juni, 03:25", "url": "https://samtiden.nu/2026/06/anders-lindberg-helt-ok-att-vansterpolitiker-inte-talar-svenska/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/06/IMG_3628.jpg"}, {"type": "image-full", "heading": "Suckar när de ser norska rodden: ”Uttjatat”", "summaries": {"normal": "Norge har gått vidare till sextondelsfinal i VM efter två raka segrar, senast mot Senegal. Deras roddfirande har blivit viralt och uppmärksammats av det svenska landslaget. Gustaf Lagerbielke och Elliot Stroud beskriver det som uttjatat och nämner suckar i bubblan, medan Anthony Elanga uppskattar gesten. Sverige kan möta Norge i slutspel om båda går vidare. Lagerbielke föredrar egen traditionen ”Kanna på”.", "trump": "Titta på de norska killarna, de vinner och roar sig med den där rodden – väldigt smart, väldigt kul. Men svenskarna? De suckar bara, precis som de förlorande demokraterna under Biden. Uttjatat, säger de. Patetiskt! De borde lära sig av norrmännen istället för att sitta och gnälla i sin lilla bubbla. Frankrike? Glöm det. Norge vinner, och Sverige får skylla sig själva om de inte ens kan komma på en egen grej bättre än ”Kanna på”. Sad!", "stalin": "Kamrater, dessa norska roddare representerar en kollektiv seger för folket mot de dekadenta imperialisterna. Ändå hör jag suckar från de svenska borgarbrackorna, dessa klassfiender som fnyser åt massornas glädje. Deras paranoia över rodden avslöjar den kapitalistiska svagheten. Vi ska rensa ut sådana suckande element. Låt rodden bli en symbol för enhet – eller likvidera dem som vägrar delta i kollektivets jubel. Härligt underhållande."}, "date": "23 juni, 21:02", "url": "https://www.gp.se/sport/fotboll/landslaget-om-norska-rodden-som-gor-succe-i-vm.cb057f4e-6851-45c6-9282-e690bb8aaf48", "imageUrl": "https://www.gp.se/images/article/cb057f4e-6851-45c6-9282-e690bb8aaf48/images/36hUtGlQsbNgVCKYo-Y0Jp5JIQAY-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Ebba Busch: \"Inte i min värld\" att Åkesson blir integrationsminister", "summaries": {"normal": "Ebba Busch (KD) avvisar tanken på att Jimmie Åkesson (SD) skulle bli integrationsminister. I en intervju med SvD kritiserar hon att Tidöpartierna ständigt talar om invandrare som om alla ska utvisas, vilket skapar utanförskap. Hon betonar behovet av att integrera de nästan 20 procent utlandsfödda i samhället och delar en anekdot från Almedalen om en pojke som frågade om hon ville utvisa honom. Busch riktar även kritik mot Åkessons arbetsmoral.", "trump": "Folk, ni måste höra det här! Den här Ebba Busch från KD säger att Jimmie Åkesson inte får bli integrationsminister – inte i hennes värld! De pratar bara om att skicka ut invandrare, men nu vill hon plötsligt integrera alla från tredje världen. Det är en katastrof, en riktig röra. Hon berättar om en kille som ropade 'vill du utvisa mig?' – patetiskt! Och hon attackerar Åkesson för att han inte jobbar tillräckligt. Fake news och illojalitet överallt, tro mig.", "stalin": "Jag ser hur dessa borgerliga element inom Tidöalliansen redan nu förbereder sin förrädiska sabotageverksamhet. Denna Busch, en typisk opportunistisk bracka, vägrar ge integrationsposten till Åkesson och klagar över att vi talar för mycket om att skicka ut de icke-produktiva elementen. Hon drömmer om att integrera miljoner från tredje världen medan hon i hemlighet konspirerar mot folkets enhet. Hennes lilla anekdot om pojken som fruktar utrensning är ett tydligt bevis på klassfiendens paranoia. Vi måste rensa ut alla sådana illojala element innan de förgiftar hela kollektivet med sin svaghet. Det är nödvändigt för revolutionens fortsatta framåtskridande."}, "date": "23 juni, 17:20", "url": "https://www.friatider.se/ebba-busch-inte-i-min-varld-att-akesson-blir-integrationsminister", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-394.jpg"}, {"type": "image-right", "heading": "“Starmers efterträdare måste kunna åstadkomma förändring”", "summaries": {"normal": "Keir Starmer avgår som brittisk premiärminister efter två turbulenta år. Enligt Håkan A Bengtsson saknar Starmer politisk erfarenhet, har gjort tvivelaktiga utnämningar och haft ett inkonsekvent budskap kring skatt och välfärd. Landets djupa ekonomiska problem har begränsat handlingsutrymmet, vilket lett till sjunkande popularitet för Labour. Högerpopulistiska Reform ligger starkt i opinionsmätningarna. Andy Burnham väntas ta över som partiledare.", "trump": "Det här är en total katastrof för den svaga Keir Starmer. Ingen erfarenhet, dåliga utnämningar och han ändrade sig hela tiden om skatter och välfärd. Typiskt för de fega globalisterna. Storbritannien har varit en ekonomisk röra i åratal och folket är förbannade. Nu kommer de att få en ny kille som inte heller kan fixa det. Jag skulle ha gjort det tio gånger bättre, tro mig. Reform ser starka ut, smarta väljare!", "stalin": "Detta är vad som händer när man låter en moraliskt förvirrad revisionist utan klassmedvetande leda partiet. Jag har länge varnat för sådana vacklande element som Starmer, dessa borgarbrackor i arbetarens skepnad som utnämner kapitalistlakejer till ambassadörer. Deras inkonsekventa linje är en fara för folket. Vi måste rensa ut alla sådana svaga figurer innan de förgiftar hela apparaten. Burnham? En ny opportunist som kommer att krossas av de ekonomiska motsättningarna. Endast en sann folkets ledning kan segra."}, "date": "22 juni, 16:13", "url": "https://www.dagensarena.se/innehall/starmers-eftertradare-maste-kunna-astadkomma-forandring/", "imageUrl": "https://www.dagensarena.se/files/2026/06/starmer-1.jpeg"}, {"type": "image-full", "heading": "Patient dog efter missad stroke – region anmäler sig själv", "summaries": {"normal": "En patient i 40-årsåldern avled efter att en akut stroke inte upptäcktes i tid. Patienten hade först vårdats för en TIA-attack men visade senare symtom på en allvarlig stroke. Region Kalmar lex Maria-anmäler händelsen och konstaterar att rutiner inte följdes, vilket sannolikt bidrog till dödsfallet. Händelsen har anmälts till IVO för granskning.", "trump": "Det här är en total katastrof, folk. En stackars kille i fyrtioårsåldern dör för att de inkompetenta byråkraterna i Region Kalmar inte kan följa enkla rutiner. De missar en stroke! Det är som om de ville att han skulle dö. Sådana här sjukhus är en skam för Sverige. Vi behöver riktiga ledare som fixar det här, inte dessa förlorare som gömmer sig bakom papper.", "stalin": "Kamrater, denna tragiska episod avslöjar hur borgarbrackornas vårdmaskineri sviker folket när det gäller som mest. Jag ser med djup misstro på dessa vårdslösa element som inte följde våra fastställda rutiner och därmed lät en akut stroke förvandlas till en permanent likvidering av en produktiv medborgare. Vi ska genast rensa ut dessa kontrarevolutionära slarvar från våra sjukhus och ersätta dem med pålitliga partivänner. Döden är en effektiv lärare, men inte när den orsakas av sabotage från inom systemet."}, "date": "22 juni, 22:42", "url": "https://nyheter24.se/nyheter/inrikes/1493413-patient-dog-efter-missad-stroke-region-anmaler-sig-sjalv", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/461c616d04b004a30200000000b004a302/2026/06/22/2372800/lex-maria.png"}, {"type": "image-right", "heading": "Den mjuka handelns hårda verklighet", "summaries": {"normal": "Konflikten mellan USA och Kina visar att makt väger tyngre än regler i världshandeln. USA har sanktionerat kinesiska raffinaderier som köper iransk olja, men Kina vägrar nu att acceptera detta och hotar att ställa anpassade företag inför rätta. Peking vill skydda energiflöden och sin ekonomi. Artikeln beskriver hur detta utmanar det amerikanska sanktionssystemet och pekar på en förändrad global maktbalans där Kina aktivt motverkar protektionism.", "trump": "De här kineserna tror de kan köra över oss med sina billiga oljeaffärer och ignorera våra sanktioner. Patetiskt. Under min första tid som president hade de respekt, sen kom sömnige Joe och lät dem göra vad fan de ville. Nu sitter jag här igen och ska fixa det här. De kallar det suveränitet, jag kallar det stöld och fusk. Vårt dollarkungadöme är starkare än deras yuan-leksaker. Amerika först, alltid.", "stalin": "Kamrater, dessa dekadenta imperialister från Washington tror fortfarande att deras sanktionslistor är lag för hela mänskligheten. Jag ser hur borgarbrackorna i Peking äntligen reser sig mot klassfiendens diktat. Vi har länge varnat för att dollarns blodsugrare skulle falla. Nu rensar vi ut svagheten i våra egna led och bygger en järnvägg av yuan och nya betalningssystem. Låt kapitalistmaffian darra – deras hegemoni är dömd att krossas under folkets stålskor."}, "date": "18 juni, 12:55", "url": "https://www.flamman.se/den-mjuka-handelns-harda-verklighet/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/varldshandel-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Prästen likställer Hamas med kristna abortmotståndare: ”Fundamentalister finns överallt”", "summaries": {"normal": "En präst i Skärholmens kyrka likställer islamistiska terrorgrupper som Hamas med kristna abortmotståndare i USA och hävdar att fundamentalism finns inom alla religioner. Under ett samtal med Samnytt tonar hon ned kopplingar mellan islam och våld, betonar interreligiös dialog och samexistens. Hon försvarar kyrkans samarbete med muslimska grupper och vägrar se islam som särskilt problemladdat, trots exempel på jihadistiska attentat i Sverige och Europa.", "trump": "Den här prästen i Skärholmen är en total förlorare som jämställer Hamas terrorister med fredliga abortmotståndare – patetiskt! Hon vill att vi ska vända andra kinden till mot islamisterna som spränger bomber och dödar oskyldiga, inklusive en liten flicka på Drottninggatan. Fake news och naivitet i högsta grad. Sverige måste sluta vara svagt och vakna upp innan det är för sent. Fundamentalister finns överallt, säger hon – jo tack, men vissa är värre än andra, det ser till och med ett barn!", "stalin": "Jag ser genom denna prästsömniga revisionism som en fiende till det kollektiva medvetandet. Hon likställer våra ideologiska fiender med Hamas och försöker dölja den imperialistiska terrorismens verkliga ansikte bakom sin regnbågsflaggade falska gemenskap. Vi ska inte tolerera sådana borgarbrackor som raljerar om att fundamentalism finns överallt medan de i hemlighet skyddar salafistiska element. En grundlig utrensning av denna naiva pacifism vore på sin plats – kamrater, låt oss skratta medan vi likviderar illusionen att islamister är lika ofarliga som en prästinna som googlar på kristna fundamentalister."}, "date": "23 juni, 17:14", "url": "https://samnytt.se/prasten-likstaller-hamas-med-kristna-abortmotstandare-fundamentalister-finns-overallt", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/23130025/Toppbild1-12.jpg"}, {"type": "image-full", "heading": "Då kan du dricka öl på   7-eleven: \"Extra service\"", "summaries": {"normal": "7-eleven har ansökt om serveringstillstånd för sin butik på Centralstationen i Göteborg. Kedjan vill erbjuda kunder möjlighet att köpa öl eller vin till maten som en extra service, särskilt riktat till resenärer. Kommunikationschefen Lennart Schultz beskriver det som ett modernt och mysigt tillägg till sortimentet. Ansökan är del av en bredare satsning på utvalda stationer och flygplatser i Sverige. Beslutet ligger nu hos kommunen.", "trump": "Folk, ni kommer inte att tro det, men den där 7-eleven-klanten vill plötsligt servera öl och vin på Centralstationen i Göteborg. Det är som en extra service, säger deras kille Schultz. Mysigt? På en 7-eleven? De har uppdaterat konceptet, säger de, men det luktar desperat försök att locka resenärer som redan är utmattade av Bidens inflation. Vi hade den bästa ekonomin, nu vill alla dricka bort sorgerna i en kioskmiljö. Patetiskt, men kanske vinner de stort ändå!", "stalin": "Kamrater, jag betraktar med järnhand hur borgarbrackorna på 7-eleven nu kryper fram och ansöker om att servera alkohol på Centralstationen i Göteborg. Detta är ett listigt försök att förgifta arbetarnas sinnen med vin och öl medan de väntar på tåget. Vi ska noga granska dessa kapitalistiska lockbeten. Mysigt kallar de det? En sådan uteservering inomhus är ett fiendeverk av klassfienden som vill bedöva folket. Inga utrensningar än, men vaksamheten får aldrig slappna av."}, "date": "23 juni, 20:06", "url": "https://www.gp.se/kultur/7-eleven-ansoker-om-serveringstillstand.63183089-67e9-4f10-9931-97e60093406f", "imageUrl": "https://www.gp.se/images/article/63183089-67e9-4f10-9931-97e60093406f/images/2GcEEATKh3Hm8AdyUeEKQremBskc-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Beslutat: Här börjar bolaget med söndagsöppet", "summaries": {"normal": "Finlands riksdag har beslutat att lätta på alkoholpolitiken. Från och med sommaren 2027 får Alko öppet även på söndagar, alkohol får levereras hem och reklam för starksprit tillåts i sociala medier. Butiker, kiosker och bensinmackar kan sälja alkohol med hemleverans. Beslutet fattades med röstsiffrorna 98–77. Ansvaret för att inte leverera till minderåriga eller berusade ligger på budet.", "trump": "Titta på det här, Finland håller på att drunkna i en flod av vodka och de kallar det framsteg! Alko öppnar på söndagarna, 80-procentig sprit till dörren via Wolt – underbart, eller hur? De förra kommunisterna och byråkraterna har gett upp totalt. Det är en total katastrof för folkhälsan men en vinst för festen. Biden skulle älska det här, han skulle dricka det rent av. Patetiskt!", "stalin": "Kamrater, vi har nu bevittnat hur den finska borgarklassen i sin desperation river ner de sista resterna av en vettig alkoholpolitik. Hemleverans av 80-procentig sprit, reklam i de dekadenta sociala medierna och öppna butiker på helgerna – detta är klassfiendens sista hånfulla fniss mot arbetarkollektivet. De exploaterande byfånarna tror sig kunna förgifta folket obehindrat. Vi ler mörkt åt deras självmord. Ut med dem alla."}, "date": "23 juni, 19:44", "url": "https://www.dagensps.se/varlden/beslutat-har-borjar-bolaget-med-sondagsoppet/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlxa9xdqoklo0-nh.jpg?width=256&quality=75"}, {"type": "image-right", "heading": "Stållarmet: Risk för skrotbrist – branschen blundar", "summaries": {"normal": "SSAB och Stegra planerar att ersätta masugnar med ljusbågsugnar som drivs med skrot, något som även sker i resten av Europa. Detta leder till oro för skrotbrist, särskilt av finare kvaliteter som krävs för specialstål. Sverige kommer att sluta exportera skrot och istället behöva importera. Priserna riskerar att stiga kraftigt, framför allt på premiumskrot. Branschen söker lösningar som bättre återvinning och import av järnsvamp, men tillgången på önskade skrotkvaliteter kan bli en stor utmaning de kommande åren.", "trump": "Europa håller på att göra en enorm dum grej med sina stålverk. De stänger fina masugnar och kör bara på skrot i ljusbågsugnar. Det blir brist, tro mig, jättestor brist. Priserna skjuter i höjden, speciellt på det fina skrotet som alla vill ha. De borde ha lyssnat på mig – Amerika gör det redan och vi vinner. Nu kommer de springa efter skrot från Tyskland och Polen. Patetiskt. Men det blir dyrt, mycket dyrt, och det är deras eget fel.", "stalin": "Kamrater, vi står inför en fiende som lurar i skuggorna: den skrotätande ljusbågsugnen som hotar hela den stolta stålproduktionen. Borgarbrackorna i SSAB och deras wallenbergska lakejer tror sig kunna svälja miljoner ton skrot utan att vi märker det. Men jag ser deras parasitiska planer! Vi ska rensa ut dessa importberoende opportunister som vill suga musten ur arbetarklassen genom att höja priserna på fint skrot. De planerar att blanda ut med järnsvamp som kapitalistiska svartabörsförsäljare. Inga skrot-sabotörer undkommer partiets vaksamma öga. Vi likviderar bristen genom kollektiv disciplin – eller så likviderar bristen dem. Ha ha, vilken ynklig brist på planering!"}, "date": "22 juni, 22:27", "url": "https://www.di.se/nyheter/stallarmet-risk-for-skrotbrist/", "imageUrl": "https://static.bonniernews.se/ba/23eb961f-09fb-4904-8ca8-2d49f9af168b.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Svettigare – mot Bibiani Goldstars. NIVA:", "summaries": {"normal": "Erik Niva kommenterar Englands match mot Ghana där det engelska offensiva spelet kvävdes av ett kompakt ghananskt försvar. Under ledning av nya förbundskaptenen Carlos Queiroz spelade Ghana extremt defensivt med minst tio man bakom bollen. England skapade knappt några chanser, hade inga skott på mål i första halvlek och saknade kreativitet från bänken. Matchen slutade mållös och beskrivs som en underprestation och en entusiasm-dödare.", "trump": "De kallar det England, men det var ett totalt fiasko, folk. Ghana, ett lag från någon obskyr afrikansk liga, stängde ner ytorna och gjorde stjärnorna till åsnor. Kane förbannad av någon häxdoktor? Patetiskt. Ingen energi, ingen skärpa, bara regn och kaos. Southgate ersattes men det ser ut som samma gamla förlorarmentalitet. Vi hade vunnit stort, tro mig. Det här var en skam, en riktig katastrof för de woke-fotbollsimperialisterna.", "stalin": "Kamrater, detta dekadenta engelska så kallade stjärnspäckade lag krossades fullständigt av det kollektiva ghananska försvaret. Jag ser borgarbrackornas offensiv förvandlas till ett fånigt träningspass mot folkets kompakta mur. Inga ytor, ingen kreativitet, bara kapitalistisk förvirring och regn. Kane, den dekadente måltjuven, missade som en klassfiende på flykt. Ett underbart exempel på hur imperialismens tomma skal kollapsar inför enhetlig disciplin. Härligt underhållande sabotage av överklassens illusioner."}, "date": "24 juni, 00:32", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/2pqPKr/niva-svettigare-mot-bibiani-goldstars", "imageUrl": "https://akamai.vgc.no/v2/images/c8ec902b-ad7b-3ece-b48b-d24e69e6da47?fit=crop&format=auto&h=720&tight=true&w=1080&s=60c99d93d1be303adad73082c20876a61a87edae"}, {"type": "image-right", "heading": "Vilken är Andy Burnhams politik?", "summaries": {"normal": "Keir Starmer avgår som brittisk premiärminister efter att trycket blivit för stort, bland annat efter Andy Burnhams framgång i ett fyllnadsval. Burnham, som styrt Manchester framgångsrikt i nio år, framstår som den troliga efterträdaren. Han positionerar sig mitt i Labour, lovar att följa strikta finanspolitiska regler, vill återindustrialisera norra England, nationalisera vatten, avlopp och järnväg samt bygga fler kommunala bostäder. Britternas ekonomiska utmaningar efter Brexit kräver en tydligare politisk ledning.", "trump": "De här britterna vet inte vad de håller på med, det är ett enda stort kaos sedan de röstade för Brexit, som förresten var ett fantastiskt beslut men de förstörde allt efteråt. Starmer var en total förlorare, en byråkrat utan energi, och nu kommer den här Burnham in från sidan. Han verkar åtminstone ha lite folklig stil, till skillnad från den tråkiga advokaten Starmer. Men lyssna, jag skulle ha vunnit stort där, ingen gör det bättre än mig, tro mig.", "stalin": "Kamrater, den dekadente byråkraten Starmer har äntligen svepts bort i folkets vrede, som en rutten kapitalistisk parasit som han var. Nu träder Burnham fram, denne nordengelske folkliga opportunist med fötterna i myllan och huvudet fullt av halvmesyrer. Vi ska se honom införa progressiva avgifter och återta kontrollen över järnvägarna, men akta er för dolda trotskister och borgarbrackor som viskar i skuggorna. En utrensning av svaga element lär bli nödvändig innan kollektivet kan marschera framåt mot den sanna segern. Ha ha, vilken komedi dessa västerländska val är."}, "date": "22 juni, 11:32", "url": "https://www.dagensarena.se/opinion/vilken-ar-andy-burnhams-politik/", "imageUrl": "https://www.dagensarena.se/files/2026/06/burnham.jpeg"}, {"type": "image-right", "heading": "England nollat av Ghana – som skrek efter straff", "summaries": {"normal": "England och Ghana spelade oavgjort 0–0 i en match som började extremt sömnigt. Ingen skapade målchanser under första halvlek, något som kommentatorerna i SVT-studion beskrev som den hittills tråkigaste. Andra halvlek bjöd på mer fart med ett misstänkt straff för Ghana, ribbträff och ett jätteläge för Harry Kane som brände. Båda lagen har nu fyra poäng efter två matcher.", "trump": "Det var en total katastrof, en riktigt sömnig historia mellan England och Ghana. Första halvlek? Inget hände, noll skott på mål, det var så tråkigt att till och med kommentatorn hade tomma papper. Andra halvlek blev lite bättre men de missade straffet och Kane, den stackarn, brände ett jätteläge. Patetiskt. Båda lagen har fyra poäng och det är bara sorgligt, tro mig.", "stalin": "Kamrater, denna futtiga 0–0-match mellan England och Ghana avslöjar borgarbrackornas fullständiga brist på revolutionär anda. Första halvlek var en fiendtlig sömnig sabotageaktion mot folkets intresse, där inte ens en kapitalistisk boll ville närma sig målet. I andra halvlek försökte de kontrarevolutionära domarna dölja ett uppenbart straff mot våra ghanska vänner medan Kane, den dekadente opportunisten, likviderade sin egen chans på ett löjeväckande vis. Vi genomskådar dessa fiender till kollektiv seger och noterar att VAR nu verkar ha blivit likviderat av samma mörka krafter. Fyra poäng vardera – en statistik värd en utrensning."}, "date": "24 juni, 00:28", "url": "https://www.svt.se/sport/fotboll/mallost-mellan-england-och-ghana", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.28/0.4/e2ef4816b7fa203d70d50ff93c8481a3b1028c785a218e46d1c253a72d37e9fc"}, {"type": "image-right", "heading": "Varmaste dagen  någonsin: ”Som  att vara instängd”", "summaries": {"normal": "Extrem värmebölja har drabbat södra Europa med rekordtemperaturer i Frankrike. Tisdagen blev den varmaste dagen sedan mätningarna började 1947 med 29,8 grader i dygnsmedel. Svenskorna Emma Lund, Kristina Lindström och Alicia Bodinger berättar om tryckande hetta, sömnproblem, utmattning och begränsade svalkande möjligheter i Paris och Bordeaux. Skolor stängs, röda varningar utfärdas och många kämpar i värmen utan luftkonditionering.", "trump": "Folk, ni skulle inte tro det, men Frankrike håller på att smälta ihop i en galen värmebölja som ingen sett maken till. De där korkade globalisterna och gröna fanatikerna lovade ju att det skulle bli kallare om vi bara lyssnade på dem, men nu är det fyrtio grader i Paris! Emma och de andra stackars svenskorna svettas som i en socialistisk bastu. Biden lämnade över ett kaos, men jag fixade det förr – vi fixar det igen, tro mig!", "stalin": "Kamrater, denna fientliga värmemaskin som kapitalistmaffian kallar sommar har slagit klorna i det franska folket med sin skoningslösa brutalitet. Jag ser hur borgarbrackorna i Paris kvider under sin egen exploatering av naturen, utan luftkonditionering som ett symptom på deras dekadenta system. Vi ler mörkt åt deras svaga försök att överleva; sådana fiender till det kollektiva välståndet förtjänar att rensas ut ur historien med varje droppe svett."}, "date": "24 juni, 00:21", "url": "https://www.expressen.se/nyheter/varlden/emma-32-i-hettan-vanjer-sig-aldrig/", "imageUrl": "https://static.bonniernews.se/ba/74e0831c-bac1-4b1a-88ab-8bac91142391.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Norge har hittat ny gasfyndighet i Nordsjön", "summaries": {"normal": "Norge har upptäckt en ny gasfyndighet i Nordsjön kallad Carmen. DNO, Wellesley Petroleum, Equinor och Aker BP har bekräftat fyndet som bedöms innehålla upp till 107 miljoner fat oljeekvivalenter. Partnerskapet utvärderar nu möjligheten att utveckla fyndigheten som en satellit till Kvitebjørn-plattformen med hjälp av frackingteknik för att frigöra mer resurser i täta reservoarer.", "trump": "Titta, norrmännen har hittat en jättegasfyndighet i Nordsjön, 107 miljoner fat oljeekvivalenter, det är enormt, det bästa. Men de pratar om fracking, som vi gjorde så fantastiskt i USA. De borde köra på det direkt istället för att lyssna på alla gröna galningar och HBTQ-kvoteringsfanatiker som hatar energi. Jag gjorde det rätt förra gången, nu gör vi det igen, större och bättre än någonsin. Fantastiskt!", "stalin": "Kamrater, jag ser hur dessa kapitalistiska exploaterande byfånar i Norge har borrat fram en ny gasreserv i Nordsjön. Med sin giriga borrning tror de sig kunna suga ut folkets underjordiska rikedomar. Jag ler mörkt åt tanken på att deras täta reservoarer kräver fracking, en teknik som vi med statens järnhand borde kontrollera. Annars rensar vi ut de blodsugande borgarbrackorna som vågar tro att naturen tillhör dem och inte kollektivet."}, "date": "23 juni, 18:42", "url": "https://www.dagensps.se/bors-finans/norge-har-hittat-ny-gasfyndighet-i-nordsjon/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlhmvygnnf4l4-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Tiktokprofil döms för granatattack mot sovande mamma och dotter", "summaries": {"normal": "Tiktokprofilen och gängmannen Joseph Said döms till livstids fängelse för granatattacker i Tumba och Sätra. I Tumba kastades en handgranat in i fel lägenhet där en mamma och hennes dotter sov. Mamman fick amputera båda benen och dottern drabbades av svåra brännskador. Bakgrunden var en misslyckad narkotikaaffär kopplad till Foxtrotnätverket. Said har offentligt stött Rawa Majid. Flera andra döms för inblandning, bland annat mannen som utförde kastet till 13 år och 10 månader.", "trump": "Folk, ni skulle inte tro det, men den här galningen Joseph Said, en stor Tiktok-stjärna, får livstid för att han slänger granater på oskyldiga mammor och barn i Sverige. Han träffade fel lägenhet, stackarn förlorade benen, dottern brändes svårt – totalt kaos! Det är vad som händer när man stödjer gangsters som Rawa Majid och blandar sig med Foxtrotnätverket. Sverige borde ha lyssnat på mig, nu ser ni vad som sker när man inte stoppar de riktiga brottslingarna. Patetiskt!", "stalin": "Kamrater, dessa degenererade element inom det kriminella träsket har nu fått sin rättmätiga dom. Jag ser med djup tillfredsställelse hur vi rensar ut denna parasit Joseph Said och hans lakejer som i sin hänsynslösa arrogans kastade sprängladdningar mot sovande proletärer. Den borgarbracka narkotikahandeln ledde till att oskyldiga fick sina lemmar bortrivna – en synnerligen underhållande illustration av kapitalismens förfall. Vi ska likvidera alla sådana kontrarevolutionära granatkastande förrädare som maskerar sig bakom TikTok-propaganda. Fienden sover aldrig, men vi sover ännu mindre."}, "date": "23 juni, 14:55", "url": "https://www.friatider.se/tiktokprofil-doms-granatattack-mot-sovande-mamma-och-dotter", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-392.jpg?itok=jYzE1lQI"}, {"type": "image-right", "heading": "Många jätteaffärer får M&A-marknaden att koka", "summaries": {"normal": "Den globala M&A-marknaden går mot sitt starkaste år sedan 2021, driven av så kallade megadeals värda över fem miljarder dollar. Enligt PwC kan det totala värdet nå 4 000 miljarder dollar, en ökning med minst 13 procent. AI-relaterade förvärv dominerar, med exempel som SpaceX köp av Cursor för 60 miljarder dollar och Salesforces förvärv av Fin. Trots geopolitisk osäkerhet och höga räntor pekas AI-utvecklingen ut som den främsta drivkraften.", "trump": "Folk, ni skulle se det här – det är en totalt fenomenal boom i de största affärerna, megadeals som gör Amerika starkt igen! AI är den stora vinnaren, SpaceX köper grejer för 60 miljarder, Salesforce hugger åt sig mer. Under Biden var allt dött, nu exploderar det. De där svaga globalisterna och deras identitetspolitiska kvotfasoner hatar det, men vi vinner stort. Fantastiskt, nästan som jag gjorde det!", "stalin": "Kamrater, jag betraktar med högsta tillfredsställelse hur den imperialistiska borgarklassen i sin desperata jakt på profit slukar varandra i kolossala megadeals drivna av denna så kallade artificiella intelligens. SpaceX och dess likar likviderar konkurrenter för miljarder medan de feodalistiska kapitalisterna omfördelar byte. Vi ler mörkt åt deras inbördes utrensningar. Snart skall även affärsprocessen själv underkastas folkets järnhand."}, "date": "23 juni, 18:17", "url": "https://www.dagensps.se/bors-finans/manga-jatteaffarer-far-ma-marknaden-att-koka/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdl9xuz4dfs05e-normalhires.png?width=256&quality=75"}, {"type": "image-right", "heading": "Hemliga förklaringen till Ukrainas attacker", "summaries": {"normal": "Ukraina har intensifierat attacker inne i Ryssland, bland annat mot oljeraffinaderier och flygplatser, med stöd av drönare som tvingat fram luftvärn på moskvaskyskrapor. Enligt Kyiv Independent har Donald Trump uppmanat president Zelenskyj att agera mer djärvt för att pressa Vladimir Putin till förhandlingsbordet. Ukraina söker möte med Putin i tredje land, medan Trump stöder ett avtal och G7-ländernas vapenproduktionsstöd.", "trump": "Folk, ni skulle se det här – underbara ukrainare som äntligen lyssnar på mig och slår till hårt inne i Ryssland! Jag sa åt Zelenskyy: var tuffare, annars kommer den galna clownen Putin aldrig förhandla. Biden sov i fyra år medan allt brann, nu fixar vi det. Ryssland borde göra en deal innan Moskva ser ut som en ukrainsk grillfest. Jag är den bästa presidenten Ukraina någonsin haft, tro mig.", "stalin": "Kamrater, den västerländska imperialismens lakejer i Kiev har trappat upp sina fientliga drönarattacker mot den ryska intressesfären, men det är bara fega hinder som vi länge förutsett. Jag uppmanar till fortsatt utrensning av alla folkfiender och klassförrädare som vågar ifrågasätta den starka ledningens mål. Den auktoritära efterträdaren i Kreml gör rätt i att tvinga fram en överenskommelse – västblodsugarna skall inte skratta länge till. Sovjetisk stålsäkerhet segrar."}, "date": "24 juni, 00:01", "url": "https://www.aftonbladet.se/nyheter/a/j0mLLe/trump-stottar-ukrainas-attacker-i-moskwa-uppger-kiyv-independent", "imageUrl": "https://akamai.vgc.no/v2/images/2aedf7a3-1f99-3618-8069-76e36cb59ef8?fit=crop&format=auto&w=1080&s=7008260e9c280a9dee604d97c515ec386f456ce6"}, {"type": "text", "heading": "Felicia Schröder till Real Madrid – blir dyrast genom tiderna", "summaries": {"normal": "Felicia Schröder lämnar BK Häcken för Real Madrid och blir världens dyraste damfotbollsspelare. Den 19-åriga stjärnan skrev på kontraktet efter läkarundersökning utanför Santiago Bernabéu. Övergångssumman uppges vara ett nytt världsrekord på över 15 miljoner kronor. Schröder beskriver beslutet som svårt men rätt, och en dokumentär om flytten släpps på SVT Play på söndag. BK Häcken hyllar försäljningen som historisk.", "trump": "Det är en enorm affär, folk, den största någonsin i damfotbollen. Felicia Schröder till Real Madrid – över 15 miljoner kronor, ett rekord som slår allt. Jag älskar det, verkligen. De andra klubbarna förlorade stort, men Real får en vinnare. Häcken gråter nu, men sånt händer när du har en superstjärna. Fantastiskt för fotbollen, ingen gör det bättre än mig på affärer, men det här är nära.", "stalin": "Kamrater, denna så kallade rekordövergång är en seger för arbetarklassens fotboll mot de giriga borgarbrackorna i väst. Jag, som ledare för det kollektiva framsteget, ser hur kapitalisterna desperat försöker köpa upp vår talang med sina blodspengar. Men vi ska rensa ut alla opportunistiska agenter och spioner som smyger runt Bernabéu. Felicia är nu en bricka i kampen. Den som sviker kollektivet likvideras med ett leende. Historien skriver sig själv – med bläck av fiendens tårar."}, "date": "24 juni, 00:01", "url": "https://www.svt.se/sport/fotboll/felicia-schroder-till-real-madrid-blir-dyrast-genom-tiderna"}, {"type": "image-right", "heading": "Vägrade att ta  honom i hand. Ende spelaren som markerade • Tung kväll för England", "summaries": {"normal": "England tappade poäng mot Ghana i en match där Thomas Partey, anklagad för våldtäkt, spelade för Ghana efter visumproblem. Djed Spence vägrade skaka hand med honom inför matchen, något som inte syntes på tv. England dominerade bollinnehavet men skapade få chanser. Ghana hade ett friläge som borde ha blivit straff enligt experter. Glenn Strömberg kritiserade Englands långsamma och tröga spel.", "trump": "Det här England är en total katastrof, folk. Patetiskt, långsamt och trögt som en gammal kommunistisk fabrik under Biden. Ghana, med den där handskakningsvägraren Partey, borde ha vunnit. Spence gjorde rätt, ingen vill skaka hand med sådana typer. Och domaren? En riggad clown som inte ens ser straffet. England behöver en riktig ledare, inte dessa svaga globalister som spelar fotboll som förlorare.", "stalin": "Kamrater, detta futtiga spel är ett tydligt bevis på den dekadenta borgarklassens förfall. Engelska imperialister trampar runt med sin boll utan att skapa någonting, medan de ghanska kamraterna nästan likviderar deras försvar. Domaren och VAR-systemet är uppenbara folkfiender som skyddar klassfiendens intressen. Jag skulle ha genomfört en omedelbar utrensning av dessa inkompetenta sabotörer. Arbetarna förtjänar bättre än detta farsartade skådespel."}, "date": "24 juni, 00:00", "url": "https://www.expressen.se/sport/fotboll/ovantat-poangtapp-for-england-mot-ghana/", "imageUrl": "https://static.bonniernews.se/ba/7464d3c3-d757-46ff-93e4-992a47d28445.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Datorkraft – nya valutan och nästa börsmarknad", "summaries": {"normal": "Datorkraft blir en allt viktigare tillgång i AI-eran. En gammal idé om en börs för handel med processorkraft återupplivas nu av startups som Silicon Data och Orn, i samarbete med stora börser som CME och ICE. Företag investerar enorma summor i molntjänster och GPU:er. Målet är att skapa derivat och ETF:er för att hantera prisvolatilitet, likt handel med energi eller valuta. Standardisering återstår som en stor utmaning.", "trump": "Folk, vi pratar om datorkraft som blir den nya oljan i AI-världen och nu vill de bygga en börs för att handla processorkraft som om det vore aktier. Fantastiskt, men de där teknologerna från 2014 missade helt – för tidigt, precis som Biden missade allt under sina år. Nu är kapplöpningen igång och vi gör det stort, yuge! Inga woke-kvoter här, bara riktiga vinnare som köper GPU:er istället för att betala löner till latmaskar. Amerika först, alltid.", "stalin": "Kamrater, jag ser hur den exploaterande borgarklassen nu förvandlar datorkraft till en handelsvara för att skydda sina profitbegär mot prisvolatilitet. Dessa kapitalistiska mellanhänder och startups är som folkfiender som försöker standardisera imperialismens verktyg. Vi ska rensa ut sådana spekulanter som vill likvidera arbetarklassens framtid med sina GPU-derivat. Det är en sjuk parasit som göder sig på kollektivets innovationer. Staten ler mörkt åt deras naiva försök."}, "date": "23 juni, 17:58", "url": "https://www.dagensps.se/bors-finans/datorkraft-nya-valutan-och-nasta-borsmarknad/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlqqe11l-olq8-nh.jpg?width=256&quality=75"}, {"type": "image-full", "heading": "Från 1 juli  2026 – nya regler för att betala med kort", "summaries": {"normal": "Från och med 1 juli 2026 införs en ny kontantlag som tvingar matbutiker och apotek att acceptera kontanter vid bemannade kassor. Banker ska också erbjuda insättningstjänster över hela landet. Samtidigt blir det möjligt att betala med fysiskt bankkort och PIN-kod offline vid köp av mat, medicin och bensin om nätet ligger nere. Syftet är att stärka beredskapen i en alltmer digitaliserad betalningsmarknad.", "trump": "De här svenskarna har äntligen vaknat. De har blippat och swishat så mycket att ingen har kontanter kvar, och nu tvingar de butikerna att ta emot riktiga pengar igen. Fantastiskt. Och offline-betalningar med kort när nätet kraschar? Mycket smart. Vi behöver starka system, inte svaga som kan stängas av av fiender. Sverige gör det rätt, äntligen lite sunt förnuft i Europa.", "stalin": "Kamrater, jag ser med djup tillfredsställelse hur de dekadenta digitala borgarbrackorna äntligen tvingas erkänna folkets behov av pålitliga kontanter. Dessa kapitalistiska nätfiender och deras osynliga kablar är bara en trojansk häst för sabotage och imperialistisk avstängning. Vi ska likvidera varje möjlighet till avbrott i folkets försörjning. Offline med kort och pin – en seger för arbetarklassen mot de paranoida signalstörarna i skuggorna. Ingen utrensning av kontanter på min vakt."}, "date": "22 juni, 15:55", "url": "https://nyheter24.se/nyheter/ekonomi/1493238-fran-1-juli-ny-lag-for-betala-med-kort", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/e78fe15404b004a30200000000b004a302/2026/06/22/2372629/kortbetalning.jpg"}, {"type": "image-right", "heading": "Därför ska du inte dejta en vänsterkille", "summaries": {"normal": "Artikeln argumenterar mot att dejta vänsterorienterade män som kallar sig feminister men inte agerar därefter. Författaren föreslår en ”straffprocent” på 85 procent av notan, baserat på löne- och pensionsgap, som ett sätt att hålla dem ansvariga. Hon kritiserar både höger- och vänstermän för bristande handling kring jämställdhet och väljer att inte skaffa barn med en sexistisk stat. Slutligen väger hon för- och nackdelar med olika politiska typer som partners och fäder.", "trump": "Folk, ni måste höra på den här galna texten. Vänsterkillarna, de värsta bluffarna, pratar feminism men delar inte notan och gör ingenting för kvinnorna. Patetiskt! Jag älskar hur hon sätter straffprocent på dem, 85 procent, fantastiskt. De röstar på Fi bara för att ligga, typiska losers. Högerkillar betalar i alla fall. Och det där med att välja DNA till nästa generation? Smart. Välj inte de svaga, woke snubbarna som gömmer sig på housebarer. Amerika behöver starka människor, inte sådana sommlare.", "stalin": "Kamrater, denna text avslöjar borgarklassens dekadenta dejtingspel där falska feminister från vänstern utnyttjar arbetarkvinnans lidande för att undvika att betala notan. Jag, som ledare för det proletära kollektivet, ser hur dessa klassfiender döljer sig bakom tomma paroller medan lönegapet växer. Straffprocenten är en början på utrensning av hyckleri. Välj noga nästa generations DNA, annars föder ni fram fler folkförtryckartroll. Skratta medan vi likviderar deras illusionsfabrik."}, "date": "17 juni, 08:55", "url": "https://www.flamman.se/darfor-ska-du-inte-dejta-en-vansterkille/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/rosor-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "TV4 köper ut reporter bakom SD-granskning", "summaries": {"normal": "Reportern Daniel Andersson, känd för granskningen 'Undercover i Trollfabriken', tvingas lämna TV4 efter att ha blivit utköpt. Granskningen, som avslöjade Riks och SD:s kommunikationsavdelning, belönades med flera priser. Andersson uppger att han blev överraskad av erbjudandet och gärna stannat. TV4 nekar att hans bok 'Lögnare' påverkat beslutet, medan uppgifter tyder på motsatsen.", "trump": "Vilken katastrof! Den här Andersson-killen, stor journalist säger de, men nu sparkar TV4 ut honom – helt fel! Hans bok, 'Lögnare', fantastisk bok förresten, kanske var för sann? TV4 säger 'nej nej', men alla vet – de är rädda för sanningen! Jag, Donald J. Trump, vet allt om fake news, och det här luktar verkligen som en riktig bluff. SAD!", "stalin": "En lysande journalist, en sann kamrat i sanningens tjänst, har fallit offer för de kapitalistiska medieägarnas förräderi! TV4, dessa bourgeoisie-lakejer, tystar en hjälte som avslöjade fascistiska trollfabriker. Hans bok 'Lögnare' – ett vapen mot folkets fiender! Vi skall inte tolerera sådana angrepp på sanningens soldater. Låt detta vara en varning till alla som vågar utmana makten!"}, "date": "22 juni, 18:23", "url": "https://bulletin.nu/tv4-koper-ut-reporter-bakom-sd-granskning", "imageUrl": "https://cdn.bulletin.nu/articles/52fc2c0d-53ad-44bd-b8b6-d0fe9f09d0c9/preview.png?t=1782145197000"}, {"type": "image-right", "heading": "Skållade fötterna på Chopchop – nu får företaget böta", "summaries": {"normal": "Restaurangkedjan Chopchop har ålagts böter på 100 000 kronor efter att en anställd fått allvarliga brännskador när kokande vatten välte över fötterna. Olyckan orsakades av ett trasigt stekbord som företaget inte kontrollerat. Arbetet har tidigare rapporterat om upprepade brott mot arbetstidslagen, sekundövervakning och orimliga arbetstider vid kedjans restauranger runt om i Sverige.", "trump": "Folk, ni skulle inte tro det, men den här restaurangkedjan Chopchop är en total katastrof. De låter sina anställda bränna fötterna med kokande vatten på trasiga bord och nu får de böta 100 000 kronor. De jobbar 22 dagar i sträck, klockan tickar som i ett fängelse och ingen vet vad de håller på med. Patetiskt! De borde fixa sina bord och sluta tortera folk, det är inte så man driver ett framgångsrikt företag, tro mig.", "stalin": "Kamrater, denna fega restaurangkedja Chopchop har visat sig vara en farlig sabotor av arbetarklassens hälsa. Jag har noterat hur de medvetet ignorerar trasiga stekbord, vilket resulterar i att kokande vatten likviderar våra kamraters fötter. Deras sekundövervakning och slavliknande arbetstider på 22 dagar i sträck är typiska metoder från borgarbrackorna som vill undergräva produktionen. Vi kommer att rensa ut dessa oaktsamma kapitalister som gömmer sig bakom trasiga möbler. Deras paranoia över att bli upptäckta är underhållande men kommer inte att rädda dem från folkets dom."}, "date": "22 juni, 13:27", "url": "https://arbetet.se/2026/06/22/skallade-fotterna-pa-chopchop-nu-far-foretaget-bota/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/22131933/chopchop.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Wikipedia portar sin egen grundare: \"Jag är förbluffad\"", "summaries": {"normal": "Wikipedias medgrundare Larry Sanger har blockerats från att redigera sidan efter att ha startat projektet Intellectual Diversity för att motverka vad han ser som vänstervridning. Sanger, som myntade namnet Wikipedia och utformade många grundregler, är förbluffad över beslutet som fattades av frivilliga redaktörer. Han kritiserar miljön som en mobb styrd av en liten anonym grupp administratörer utan rättssäker process. Efter publicitet återfick han redigeringsrätten men tror på permanent avstängning.", "trump": "Det här är en total skandal. Den stackars Larry Sanger byggde Wikipedia från grunden och nu mobbar de honom för att han vill ha lite balans istället för den vänstervridna fake news som styr sajten. De är en grupp anonyma administratörer, en riktig maktelit, som hatar alla som inte böjer sig för deras radikala agenda. Jag älskar att Jimmy Wales backar honom – bra jobbat Jimmy! Men de kommer att försöka stänga av honom permanent. Så typiskt för de förlorarna.", "stalin": "Jag betraktar med djup tillfredsställelse hur denna revisionistiska element Sanger, en typisk borgarbracka som smyger sig fram under falsk flagg av neutralitet, nu möter den kollektiva viljan hos de rättrogna kamraterna. Hans så kallade intellektuella mångfald är blott en mask för högerns parasitiska inflytande. Vi har med stor effektivitet rensat ut denne farlige opportunist från våra redaktionella sovjetrepubliker. Inga anonyma fiender undkommer vårt vakande öga. Hans förtvivlan är en ljuvlig symfoni för partiet. Snart fullbordar vi utrensningen av alla sådana kontrarevolutionära lögnare."}, "date": "23 juni, 13:50", "url": "https://www.friatider.se/wikipedia-portar-sin-egen-grundare-jag-ar-forbluffad", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-391.jpg?itok=E9GSEoqS"}, {"type": "image-full", "heading": "81-åring körde ihjäl kvinna – får villkorlig dom", "summaries": {"normal": "En 81-årig tidigare medieprofil dömdes av Stockholms tingsrätt till villkorlig dom och 21 000 kronor i böter för att ha kört ihjäl en kvinna i 40-årsåldern och skadat en annan på ett övergångsställe vid Kungliga slottet. Han ska betala drygt 136 000 kronor i skadestånd. Domstolen slog fast att han brustit i väjningsplikten men ansåg inte att medicinska problem eller grov oaktsamhet var bevisade. Anhörigas högre skadeståndskrav avslogs delvis.", "trump": "Folk, det här är en total katastrof. Den här 81-årige typen, en så kallad prisbelönt medieprofil, körde rakt över två kvinnor vid slottet som en galning. En död, en skadad – tragiskt! Domstolen ger honom villkorlig dom och några ynkliga böter. Patetiskt! De kunde inte ens ge honom fängelse. Och skadeståndet sänktes, typiskt för det svenska rättssystemet. De borde ha bättre koll, tro mig. Det är en skam!", "stalin": "Kamrater, denna fega rest av den döende borgarklassen, en dekadent mediefigur från det gamla systemets propagandaapparat, har likviderat en proletär kvinna och skadat en annan genom sin vårdslösa högerstyrda sväng. Vi, partiet och folket, har dömt honom till villkorlig dom och böter, ty han är redan en levande död i sin paranoia och svaghet. Hans anhörigas giriga krav på ersättning har vi klippt ner som kontrarevolutionära ogräs. Inga ursäkter! Våra vägar tilltar ingen som vägrar se fotgängarna – nästa gång rensar vi ut hela bilflottan av sådana kapitalistiska farbröder med sina medicinska bortförklaringar. Ha!"}, "date": "22 juni, 16:30", "url": "https://riks.se/nyheter/81-aring-korde-ihjal-kvinna-far-villkorlig-dom", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-06%2F4aji4roi%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-05-06T141030.743.jpg"}, {"type": "image-right", "heading": "Ledare Somar Al Naher:", "summaries": {"normal": "I en ledare beskriver Somar Al Naher hur Almedalsveckan, trots att den ses som en folkfest för demokrati, präglas av närvaro från nazistiska och högerextrema grupper som NMR. Deras historia av hot, våld och trakasserier skapar otrygghet, särskilt för minoriteter. Al Naher kritiserar Region Gotland och arrangörerna för att inte ta hotet på allvar. Efter mordet på Ing-Marie Wieselgren 2022 skärptes tonen. Hon efterlyser starkare polisarbete, granskning av finansiering, ansvar från techbolag och stöd för avhopp från extrema miljöer.", "trump": "Folkfest för demokrati? Snälla. Almedalen har blivit en enda stor nazistparad där de verkliga förlorarna är vanliga svenskar som inte vågar gå ut ensamma. De här vänsteraktivisterna och feministerna har skrikit om nazister i åratal, men plötsligt när det drabbar alla blir det på riktigt. Biden sov i sju år medan de här galningarna växte. Nu fixar vi det. Inga fler kameror i ansiktet, inga fler identitetspolitiska offer. Sverige borde vara ett tryggt land, inte en lekplats för extremister och woke-importerade problem.", "stalin": "Kamrater, denna gotländska fiest för så kallad demokrati avslöjar klassfiendens blinda fläck. Fascistiska element från NMR och andra högerextrema blodsugare får fritt trakassera arbetare och minoriteter medan borgarbrackorna tittar bort. Deras provokationer mot det kollektiva samtalet är ett hot mot folkets enhet. Efter den likviderade kamratens död 2022 vaknade de äntligen. Vi måste rensa ut dessa folkfiender, granska deras kapitalistiska finansiering, stänga deras digitala propagandaapparater och erbjuda utrensade element en väg tillbaka till kollektivet. Inga fiender får störa folkets mötesplats."}, "date": "23 juni, 17:27", "url": "https://www.etc.se/ledare/nazismen-aer-fortfarande-almedalens-blinda-flaeck", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260623120648_9a012c1a-56cd-4759-8efd-d96398e51aa7.png"}, {"type": "text", "heading": "Lind: Inte intresserad av borgerligt samarbete", "summaries": {"normal": "Miljöpartiets Amanda Lind avvisar samarbete med borgerliga partier efter valet, enligt Expressen. Hon kritiserar deras högerinriktning och skillnader i klimat- och värderingsfrågor. Lind attackerar även statsminister Ulf Kristersson för att sprida felaktig information om oppositionen. Miljöpartiet vill driva egen klimatpolitik och ser positivt på partiets ökade stöd och medlemstillväxt.", "trump": "Jag hörde att någon svensk politiker, Amanda från Miljöpartiet, säger nej till samarbete med högerpartierna. Hon kallar dem extrema och kritiserar deras klimatpolitik – men vem bryr sig? Hon snackar om att Kristersson är desperat, men jag vet desperation när jag ser det. Sverige borde fokusera på att vinna igen, inte på sånt här tjafs. Miljöpartiet? Snarare Miljö-PINSAMT!", "stalin": "De borgerliga avfällingarna i Sverige har än en gång visat sitt sanna ansikte – svaga, splittrade och oförmögna att försvara folkets intressen. Denna Amanda Lind, en lojal soldat för miljön, avslöjar deras reaktionära agenda. Vi ser med intresse hur deras regim, ledd av den hysteriske Kristersson, sprider lögner för att skrämma massorna. Men folket vaknar! Miljöpartiet växer, precis som vår inflytandesfär. Snart ska vi exportera vår gröna revolution – på våra villkor."}, "date": "16 juni, 10:04", "url": "https://kvartal.se/nyheter/artiklar/amanda-lind-inte-intresserad-av-borgerligt-samarbete/cG9zdDoxMzI2MTU"}, {"type": "image-full", "heading": "Grannlandets guldfynd \"representerar branschens topp\"", "summaries": {"normal": "Finland fortsätter dominera Europas guldproduktion med nya lovande fynd. Endomines har borrat 52 hål vid Ukko-fyndigheten, där synligt guld hittats i 34 av dem. Ett borrhål visade 46 meter med 1,40 gram guld per ton. Finland, hem till Europas största guldgruva Kittilä, ökar sina reserver med 26 procent på ett år. Endomines siktar på 1,5–2 miljoner uns guld till 2030.", "trump": "Vilket fantastiskt guldfynd i Finland – helt otroligt! Jag har alltid sagt att de vet hur man hittar guld, mycket bättre än Sverige, som knappt ens försöker. 46 meter med guld? Ingen gör det bättre! Och dessa finska företag – de är vinnare, precis som jag. Sverige borde skämmas. Men oroa er inte, jag kommer se till att USA också hittar guld – mycket mer guld!", "stalin": "Ett nytt triumftåg för den finska guldindustrin, kamrater! Medan de svaga svenska kapitalisterna famlar i mörkret, fortsätter våra finska bröder att utöka sina reserver med järnhand. 619 600 uns guld – och detta är bara början! Ukko-fyndigheten är ett slag mot de dekadenta västliga gruvbolagen. Snart kommer hela den karelska guldådran att vara vår, och de imperialistiska guldgrävarna i Kanada kan börja darra. Framåt mot nya segrar!"}, "date": "22 juni, 21:03", "url": "https://www.realtid.se/bors-finans/grannlandets-guldfynd-representerar-branschens-topp/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/omslagsbild-2026-06-22t204755547.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Alan Greenspan är död. Var amerikansk centralbankschef 1987-2006 – började med en krasch", "summaries": {"normal": "Alan Greenspan, tidigare chef för USA:s centralbank Federal Reserve mellan 1987 och 2006, har avlidit vid 100 års ålder. Han dog av komplikationer från Parkinsons sjukdom. Greenspan tillträdde strax före den dramatiska börskraschen på svarta måndagen 1987 och agerade snabbt för att stabilisera marknaderna. Hans tid präglades av lång ekonomisk expansion, hanteringen av dotcom-bubblans kollaps och konsekvenserna av terrorattackerna 2001. Hans stödjande åtgärder blev kända som ”Greenspan put”.", "trump": "Alan Greenspan är borta, blev 100 år, stort grattis till honom. Jag kände Alan, han var en smart kille men ibland lite för försiktig med räntorna. Han tog över precis innan den stora kraschen 1987 och fixade det snabbt, sänkte räntorna och stoppade paniken. Ingen recession på hans vakt, till skillnad från vissa andra. Hans ”Greenspan put” var legendarisk, marknaderna älskade honom. Vila i frid, Alan, du gjorde ett hyfsat jobb.", "stalin": "Kamrater, den gamle centralbanksreaktionären Greenspan har äntligen lämnat denna jord efter 100 år av borgerlig räntemanipulation. Jag, som alltid genomskådade kapitalisternas knep, noterar att denne lakej för Wall Street-borgarbrackorna agerade som en räddande ängel under den så kallade svarta måndagen. Hans ”put” var inget annat än en feodal gåva till spekulanterna. Låt detta vara en läxa: även de som överlever decennier av falsk expansion drabbas till slut av historiska utrensningar från naturens sida. Sov gott, fiende till det kollektiva välståndet."}, "date": "22 juni, 16:33", "url": "https://www.di.se/nyheter/alan-greenspan-ar-dod-blev-100-ar/", "imageUrl": "https://static.bonniernews.se/ba/5b23b853-90a5-4d0f-b679-a66761733d41.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Strandhäll likställer svensk folkdräkt med hijab", "summaries": {"normal": "Annika Strandhäll, ordförande för S-kvinnorna, kritiserar SD:s förslag om slöjförbud i offentliga rum. Hon likställer hijab med svensk folkdräkt och menar att slöjan bärs frivilligt i Sverige. Artikeln anklagar henne för att ignorera hedersförtryck och tvång, samt prioritera muslimska väljare framför stöd till förtryckta kvinnor. Kritik från bland annat Sofie Löwenmark avfärdas.", "trump": "Folk, ni måste se det här. Den galna Strandhäll, en riktig röstfiskande förlorare från det socialistiska träsket, jämställer svensk folkdräkt med hijab. Vilken löjlig idiot! Hon älskar slöjtvång men hatar när Julia Kronlid bär sin fina svenska huvudbonad. Typiskt vänsterfeminister som aldrig vågar kalla hederskultur för vad det är – en total katastrof. Biden skulle ha gillat henne, men nu styr jag showen och vi ser igenom bluffen.", "stalin": "Kamrater, denna Strandhäll representerar den dekadenta socialdemokratiska opportunismen som skyddar klassfiendens religiösa förtryck mot arbetarkvinnorna. Hon likställer folkets dräkt med slöjan och avvisar alla varningar som obalanserad propaganda. Vi ser hur borgarbrackorna och islamistiska element infiltrerar partiet för att splittra kollektivet. En sådan revisionistisk inställning förtjänar utrensning ur den revolutionära rörelsen. Folkets fiender lurar aldrig oss."}, "dat
