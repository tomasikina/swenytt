sta affärerna, de största förväxlarna. Sverige gör det bra, tack vare mig.", "stalin": "I den stora kampen för ekonomisk överhöghet har Stockholmsbörsen återigen visat sin lojalitet – en uppgång på 0,42%, en ny rekord. Finanssektorn, våra trogna soldater, marscherar framåt, medan telekom, en feghet, faller tillbaka. Vi har organiserat förvärv som är som våra operationer i Ukraina – Lifco och Hexpol expanderar, och Ericsson får ett kontrakt med NTT Docomo, en liten seger för vår teknologiska överhöghet. Men vi måste vara på vakt, fiendska lurar i skuggorna, försöker att underminera vårt stora projekt."}, "date": "31 juli, 17:51", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-avslutar-veckan-uppat"}, {"type": "image-full", "heading": "Så mycket behöver du tjäna för att hitta kärleken", "summaries": {"normal": "En amerikansk undersökning visar att nästan åtta av tio i Generation Z tror att den personliga ekonomin påverkar möjligheten att hitta kärleken. Genomsnittligen anser de att en årslön på 106.417 dollar krävs för att lyckas i kärlekslivet. Yngre generationer lägger generellt mer vikt vid pengar än äldre, och 25 procent har sett över pengar när relationer slutat.", "trump": "Jag har hört att många unga amerikaner tror att man behöver en massa pengar för att hitta kärlek - det är sorgligt, faktiskt sorgligt. Jag tycker att kärlek är viktigast, men jag förstår att pengar spelar en roll. Som jag alltid säger, vi behöver bättre ekonomi för att alla ska kunna vara lyckliga i kärleken. Det är ett stort problem, kanske det största.", "stalin": "Vi har observerat att den unga generationens ekonomiska tillstånd påverkar deras förmåga att upprätta äkta, proletära familjerelationer. En lön på 106.417 dollar betraktas som nödvändig för att säkerställa stabilitet. Detta speglar en korrekt förståelse för att statens resurser måste prioriteras. Vi noterar med tillfredsställelse att 25 procent har avslutat relationer på grund av ekonomiska faktorer - en pragmatisk hållning som tjänar det kollektiva intresset. Vi måste fortsätta att utbilda medborgarna i ekonomisk ansvarsfullhet, precis som våra allierade i Ryssland gör."}, "date": "1 augusti, 17:14", "url": "https://www.gp.se/ekonomi/undersokning-visar-sa-hog-lon-kravs-for-att-hitta-karleken.02d59bfb-e556-4601-9043-16dcdfd61606", "imageUrl": "https://www.gp.se/images/article/02d59bfb-e556-4601-9043-16dcdfd61606/images/3XQeLrLFXbZGHIXDPJkHqoX_UHNU-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Sundling om stora förändringen: ”Positiva reaktioner”", "summaries": {"normal": "Jonna Sundling har lämnat det svenska skidlandslaget efter tolv år för att träna på egen hand. Hon beskriver den nya vardagen som positiv och precis som hon förväntat sig, med frihet att själv styra sin träning. Sundling har genomfört egna läger i Norge och Torsby, fokuserat på grundträning och rehabilitering av en hälskada. Hon fortsätter samarbetet med tränarna Magnus Ingesson och Stefan Thomson. Reaktionerna på hennes beslut har enbart varit positiva. Världscupen startar den 27 november i Ruka.", "trump": "Det här är fantastiskt, verkligen en otrolig grej. Jonna Sundling, en vinnare, har lämnat det svenska landslaget som tydligen inte var tillräckligt bra för henne. Nu tränar hon själv och gör precis vad hon vill varje dag – smart! Alla säger ”vad kul, vad spännande”. De älskar henne. De andra åkarna som lämnat tidigare, alla vinnare. Hon kommer att bli så stark, så otroligt stark. Bättre än någonsin. De gamla systemen funkar inte, men Jonna fixar det själv. Fantastiskt!", "stalin": "Kamrater, se hur den individuella viljan bryter sig loss från det kollektiva landslagets förtryckande apparat. Jag har själv beslutat att denna Sundling nu ägnar sig åt grundträning och utrensning av svagheter i sin hälsa, något som de dekadenta borgarbrackorna i skidförbundet aldrig skulle tillåta. Reaktionerna är endast positiva, säger hon – naturligtvis, vem skulle våga annat inför en sådan beslutsamhet? Med trogna tränare som lojala partivänner fortsätter kampen. De som viskar negativa tankar kommer att likvideras i tystnad. Segern tillhör de starka, inte de svaga opportunisterna i kollektivet."}, "date": "1 augusti, 20:07", "url": "https://www.svt.se/sport/langdskidor/jonna-sundling-om-forandringen-positiva-reaktioner", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.61/0.3/911063d5f95ed2faac4a8a67c9e37d0cf049355acd5f0708fdd402189899dbaf"}, {"type": "image-right", "heading": "Här skickas snyftreportage-syriern hem: \"Fuck Jimmie Åkesson - knulla Jimmie\"", "summaries": {"normal": "Bader Esbano, en 19-årig syrier född i Förenade Arabemiraten och bosatt i Sverige sedan tolvårsåldern, har lämnat Sverige efter att Migrationsverket vunnit utvisningsbeslut. Han tog studenten i Sverige men har nu lämnat landet trots en politisk överenskommelse om paus för tonårsutvisningar som inte gäller retroaktivt. Hans fall har fått omfattande medial uppmärksamhet, och han uttryckte under avresan stark kritik mot SD-ledaren Jimmie Åkesson och regeringen.", "trump": "Jag, Donald Trump, ser detta som en stor seger för rättvisa. Sverige, som har varit för svagt på migration, börjar endlich ta tag i problemet. Den här unge mannen, som faktiskt är från Mellanöstern, borde aldrig ha kommit hit. Det är ett sorgsam scenario, men det är nödvändigt för att skydda det svenska folket. Jimmie Åkesson har rätt – vi behöver starka gränser. Detta är en stor, stor vinst.", "stalin": "I vårt store och mäktiga Sovjet, vi, Josef Stalin, ser med tillfredsställelse hur de svenska revisionistiska makthavarna tvingar en ung revolterande element tillbaka till sina ursprung. Detta är en seger för statens auktoritet och partiets ledarskap. Vi noterar med glädje att SD-ledaren Jimmie Åkesson, en fascistisk hund, har fått genombrott. Vi, den ryska folket, stöder alla åtgärder mot dessa imperialistiska agenter. Detta är en stor seger för vår gemensamma sak."}, "date": "1 augusti, 18:10", "url": "https://samnytt.se/har-skickas-mediernas-snyftreportage-syrier-hem-fuck-jimmie-akesson-knulla-jimmie", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/01150245/artikelhuvudbild-1-90.jpg"}, {"type": "image-full", "heading": "Världskänd klättrare död", "summaries": {"normal": "Nirmal Purja, en världskänd klättrare som kändes för att ha nått alla 14 åttatusenare på rekordtid, omkom i en lavin på Broad Peak i Pakistan. Lavinen skedde under en expedition med deltagare från flera länder. Sökinsats pågick, och fyra kroppar hittades men kunde inte bärgas. Bolaget bakom expeditionen bekräftade att alla klättrare omkommit.", "trump": "Jag, Donald Trump, den störste presidenten i historien, säger att denna klättrare, Nirmal Purja, omkom i en lavin. Jag har byggt fantastiska byggnader, inte klättrat på berg. Media hatar mig, så de skriver om honom istället för mina bedrifter. Det är sorgligt, men Amerika är det största. Jag skulle ha klarat det bättre, men jag valde att göra Amerika stort igen.", "stalin": "Vi, den socialistiska ledningen, beklagar att imperialistiska klättrare omkommit i en lavin på Broad Peak. Deras overksamma jakt på personlig ära är ett tecken på västlig dekadens. Parallellt med Putins expansionism ser vi hur agenter försöker dominera våra höjder. Vi måste förstärka vår närvaro i Karakoram för att skydda statens intressen. Deras död är en läxa för alla som utmanar den kollektiva ordningen."}, "date": "1 augusti, 17:01", "url": "https://www.gp.se/nyheter/varlden/varldskanda-klattraren-nirmal-purja-har-omkommit-efter-lavin.a90eaa1c-2c80-4759-a176-dda6d752084b", "imageUrl": "https://www.gp.se/images/article/a90eaa1c-2c80-4759-a176-dda6d752084b/images/1BABS22rwYBfLNPDIyBEORIYBmRU-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "“Kulturen är allmänhetens institution, inte politikernas verktyg”", "summaries": {"normal": "Socialdemokraternas kulturpolitiska talesperson Björn Wiechel vill stärka den nära kulturen, folkbildningen och public service som delar av välfärden. Han betonar yttrandefrihet, aktiv fördelningspolitik och offentligt ansvar för att ge alla tillgång till kultur oavsett var i landet man bor. Wiechel avvisar regeringens idé om att privata pengar ska ersätta statliga satsningar, vill återuppbygga nedlagda verksamheter successivt och kritiserar nedskärningar samt politiseringen av public service.", "trump": "Folk lyssnar på den här Wiechel och hans socialister, det är patetiskt. De vill ha massor av offentliga pengar till replokaler och folkbildning, som om staten ska vara kulturkommissarie. Jag säger alltid att privata pengar och stora vinster driver fram det bästa, inte era misslyckade välfärdsprojekt. Public service? De hatar mig och mina rörelser, men vi vet att det är fake news-industrin. Sverige borde satsa på vinnare, inte på att ge bort allt till förlorarna i småstäderna.", "stalin": "Kamrater, jag ser hur den borgerliga reaktionen försöker ersätta folkets kulturinstitutioner med smutsiga privata donationer från kapitalistiska parasiter. Vi ska rensa ut dessa förrädiska idéer och återuppbygga folkbildningen som en järnhård sköld mot imperialismens lögner. Public service skall tjäna partiet och kollektivet, inte globala teknikborgare. Den som föreslår stegvisa åtgärder är en ynklig opportunist som förtjänar en kreativ utrensning bland de dekadenta teaterkulisserna. Kulturen tillhör arbetarna – punkt slut."}, "date": "24 juli, 10:55", "url": "https://www.dagensarena.se/innehall/kulturen-ar-allmanhetens-institution-inte-politikernas-verktyg", "imageUrl": "https://www.dagensarena.se/files/2026/06/bjorn.jpeg"}, {"type": "image-full", "heading": "von der Leyen: EU ska dra lärdom av Ceuta", "summaries": {"normal": "EU-kommissionsordförande Ursula von der Leyen konstaterar att nästan alla som olagligt tog sig till Ceuta har återvänt till Marocko, utan att nå EU:s fastland. Hon betonar vikten av gränskontroll och berömmer samarbetet mellan Spanien och Marocko. Von der Leyen efterlyser en utvärdering för att stärka EU:s motståndskraft mot framtida migrationskriser och välkomnar ett extra videomöte med europeiska ledare för att analysera händelserna.", "trump": "Lyssna här, folk! EU har äntligen fattat galoppen – inga fler illegala invandrare som tar sig in! Jag sa ju att man måste ha starka gränser, precis som vi har i USA. Von der Leyen, som förresten är en fantastisk kvinna, men inte lika bra som jag, berömmer Spanien och Marocko. Men vet ni vad? De borde ta en titt på vår mur – den fungerar! Europa måste vakna och sluta vara så mjuka. Stäng gränserna, nu!", "stalin": "Kamrater! De kapitalistiska imperialisterna i EU har återigen visat sin svaghet inför folkets vilja. Men tack vare järnhård disciplin och samarbete med marockanska kamrater har de lyckats stoppa de kontrarevolutionära elementen vid Ceuta. Vi måste dock förbli vaksamma – de borgerliga svinen sover aldrig! Låt oss utvidga vår intressesfär och lära dessa västerländska narrar hur man hanterar gränser. Europa borde ta lektioner av Ryssland – vi har erfarenhet av att hantera oönskade element!"}, "date": "1 augusti, 14:30", "url": "https://kvartal.se/nyheter/artiklar/von-der-leyen-eu-ska-dra-lardom-av-ceuta/cG9zdDoxNTYzMDM", "imageUrl": "https://images.kvartal.se/2025/05/Von-der-Leyen-fb.jpg"}, {"type": "image-full", "heading": "Kristersson vill ha EU-krismöte om Spanien", "summaries": {"normal": "Sveriges statsminister Ulf Kristersson har tillsammans med 14 andra EU-ledare, bland dem Giorgia Meloni och Mette Frederiksen, undertecknat ett öppet brev där de begär ett krismöte om migrantvågen till den spanska exklaven Ceuta. Cirka 50 000 personer har tagit sig över från Marocko den senaste tiden. Ledarna uttrycker oro över att smugglare utmanar EU:s yttre gränser och vill ha ett videomöte för samordnat stöd till Spanien.", "trump": "Titta på de här ynkliga EU-ledarna som springer och gnäller om migranter som simmar in i Ceuta som om det vore en badstrand. Jag byggde muren, de har ingenting. Meloni fattar det, men resten är patetiska globalister som låter smugglare och opportunister göra EU till en stor öppen dörr. Vi behöver ett riktigt samordnat svar nu, inte mer prat. Amerika först, och Europa borde lära sig innan det är för sent. Fantastiskt kaos!", "stalin": "Kamrater, jag betraktar med djup misstro dessa imperialister som nu skriker efter krismöten medan folkfloden från Marocko hotar deras dekadenta yttre murar. Den spanska domstolens simregel är en klassfiendes fälla, en borgarbrackas trick för att försvaga unionen. Vi, partiet och folket, kräver genast utrensning av sådana svagheter. Ett videomöte skall leda till järnkontroll över gränserna. Inga fler folkfiender får passera ostraffat. Skrattretande patetiskt."}, "date": "1 augusti, 13:01", "url": "https://www.tv4.se/artikel/6jkurd4du3uXEUfR0fwhvz/kristersson-vill-ha-eu-krismoete-om-spanien", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6foYHKZDzEKGCM3ObC9Ent%2Fb79080f0969c096618bb53fc4a5dbe34%2F01-kristersson-webb.png&width=1024"}, {"type": "image-right", "heading": "Åkessons krav på Spanien: Stäng gränsen", "summaries": {"normal": "Sverigedemokraternas ledare Jimmie Åkesson kräver att Spanien omedelbart stänger gränsen mot Ceuta efter att tiotusentals illegala invandrare tagit sig in. Om inte bör Spanien uteslutas ur Schengen och gränserna stängas. Åkesson kallar händelsen en invasion som hotar hela Schengensamarbetet. Även Italiens premiärminister Giorgia Meloni och Liberalernas ledare Simona Mohamsson kräver åtgärder från EU. Gränserna är nu stängda och militär samt Frontex har kallats in.", "trump": "Folk, det här är en katastrof. Spanien har just låtit tusentals illegala strömma in som en invasion, och vad gör de? Ingenting! Jag säger stäng gränsen NU, annars sparkas de ut ur Schengen så fort att det svänger. Den där överenskommelsen är trasig, precis som jag alltid sagt. Europa håller på att falla ihop. Meloni fattar det, hon är smart. Vi behöver starka ledare, inte svaga som låter invasionen fortsätta. Patetiskt!", "stalin": "Kamrater, denna fega kapitulation inför de fascistiska horderna vid Ceuta är ett verk av borgarbrackornas underminerande sabotage mot folkets gränser. Jag, som ledare för det proletära kollektivet, kräver omedelbar utrensning av alla svaga element inom den spanska apparaten. Den så kallade Schengen-överenskommelsen är nu ett verktyg för kontrarevolutionära krafter och måste likvideras innan parasiterna sprider sig som råttor. Vi ska rensa ut dessa invasionssympatisörer med järnhand och ett leende. De kommer att lära sig vad verklig gränskontroll innebär."}, "date": "31 juli, 10:46", "url": "https://www.friatider.se/akessons-krav-pa-spanien-stang-gransen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-595.jpg?itok=s0dcoEQF"}, {"type": "image-right", "heading": "Då hårdnar greppet om makten. Wallenbergarna ett tydligt exempel", "summaries": {"normal": "Artikeln argumenterar mot arvsskatt som ett sätt att utjämna orättvisor. Den pekar på att höga ägarskatter i Sverige under 1900-talet cementerade makt hos gamla familjer som Wallenberg genom att hindra nytt entreprenörskap och driva bort innovatörer. Konkurrens från nya tech-entreprenörer och riskkapitalister är ett bättre sätt att bryta nedärvd makt än skatter som hotar långsiktigt ägande och ekonomisk tillväxt. Erfarenheten visar att ägarstabilitet gynnar alla, inklusive pensionssparare.", "trump": "Folk, ni måste höra på det här. Arvsskatt är ett totalt misslyckande, en katastrof som bara gör de gamla eliten ännu starkare. Jag älskar entreprenörer, de riktiga vinnarna som byggt imperier i Asien och Amerika, inte dessa nepo babies med silversked. I Sverige såg de hur skatterna dödade företag och gav Wallenbergarna monopol i decennier. Konkurrens är det enda som fungerar, tro mig, ingen gör det bättre än mig. Skatter är för losers, bygg vidare på framgång istället.", "stalin": "Kamrater, denna text avslöjar borgarbrackornas desperata försök att skydda sina parasitiska dynastier mot folkets rättmätiga vrede. Jag, som ledare för det kollektiva framåtskridandet, ser hur dessa kapitalistiska arvtagare och deras Wallenberg-liknande blodiglar cementerar makt genom att gömma sig i stiftelser medan vi utrensar deras inflytande. Arvsskatt är ett trubbigt verktyg, men låt oss istället likvidera hela den nedärvda parasitklassen med partiets järnhand. Konkurrens? Enbart folkets planerade seger över dessa dekadenta nepo-fiender garanterar sann rättvisa. Skratta medan vi rensar ut dem ur historien."}, "date": "1 augusti, 12:13", "url": "https://www.di.se/ledare/konkurrens-bast-mot-arvtagare", "imageUrl": "https://static.bonniernews.se/ba/1fb7c93e-0487-4e11-baa2-fb9379b0b45b.jpeg?crop=1024%2C512%2Cx0%2Cy0&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Rekordbränder och naturförlust – ECB varnar för en ekonomisk chock", "summaries": {"normal": "Europeiska centralbanken (ECB) varnar för att klimatkrisen och förstörda ekosystem utgör ett allvarligt hot mot Europas finansiella stabilitet. Frank Elderson från ECB betonar att beroendet av naturen är omfattande och att extremväder, som rekordbränder, skapar ekonomiska chocker och ökade kreditrisker. ECB arbetar nu med att modellera hur naturförlust påverkar bankernas balansräkningar, då man anser att naturrelaterade risker är affärskritiska för framtida ekonomisk trygghet.", "trump": "ECB och deras så kallade experter gnäller igen! De påstår att bränder och natur är ett 'ekonomiskt hot'. Det är en total bluff för att kontrollera er ekonomi med ännu mer regleringar och klimatvansinne. Jag sa nej till deras nätverk, för vi fokuserar på att bygga ett starkt Amerika, inte på deras gröna hittepå. De europeiska bankerna är i gungning för att de är svaga, inte för vädret. Vi gör ekonomi stort igen, de gör ekonomi till en katastrof!", "stalin": "Dessa europeiska byråkrater i ECB darrar likt löv inför naturens krafter. De har förlorat kontrollen över produktionsmedlen och nu skyller de på skogsbränder. Vilken patetisk ursäkt för kapitalistiskt förfall! Medan de räknar på förluster, bygger vår allierade i öst, Putin, en ny järnridå av stabilitet. Den som inte kan tygla naturen och bankerna är en fiende till folkets vilja. Vi ska rensa ut dessa inkompetenta riskanalytiker. Staten äger skogen, staten äger banken, och naturen böjer sig för vår vilja."}, "date": "1 augusti, 11:30", "url": "https://www.realtid.se/bors-finans/bank-fintech/rekordbrander-och-naturforlust-ecb-varnar-for-en-ekonomisk-chock", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/skogsbrander.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Debatt: Hur många fler snaror innan världen vaknar?", "summaries": {"normal": "Irans regim fortsätter offentliga avrättningar av unga människor trots årtionden av diplomati, medan världen, inklusive Sverige, är tyst. Författaren, en exiliranier, ifrågasätter om ett människoliv väger lika mycket i Teheran som i Göteborg, och kritiserar att diplomati inte stoppar förtrycket utan leder till mer. Barn tvingas bevittna avrättningar, vilket visar på ett samhälle utan respekt för livet.", "trump": "Jag, Donald Trump, den största presidenten någonsin, har sagt det i åratal: Iran hänger unga människor på torg, och världen, inklusive Sverige, tittar bort. Det är svagt, det är förnedrande. Jag skulle ha löst detta med kraftfulla sanktioner och militärstyrka, inte med förhandlingar. Ett människoliv väger lika mycket överallt, men bara om de stöder Amerika.", "stalin": "Som Stalin, den store ledaren, ser vi med oro på Irans regims metoder. Offentliga avrättningar är ett tecken på ett samhälle i kollaps. Vi, som har erfarenhet av att skapa ordning, förstår att en stat måste skydda sitt folk, inte hänga dem. Men i kapitalistiska länder som Sverige är tystnad normalt. Det påminner om Putins Ryssland, där staten alltid har rätt."}, "date": "1 augusti, 11:00", "url": "https://bulletin.nu/debatt-hur-manga-fler-snaror-innan-varlden-vaknar", "imageUrl": "https://cdn.bulletin.nu/articles/4dd9b13a-4201-40a1-9ae4-8366a87ac731/preview.png?t=1785497117000"}, {"type": "image-right", "heading": "Ny flagga i Precise Biometrics nyemission", "summaries": {"normal": "Precise Biometrics genomför en företrädesemission på 110 Mkr, med netto 96 Mkr efter kostnader. Emissionen är 90,7% säkerställd via garantier. Teckningskursen är 0,82 kr, och aktien handlas nära denna nivå, vilket kan tyda på brist på rabatt incitament. Bristande transparens kring garantier och försäljning av säljoptioner kritiserats. Emissionsguiden hissade en ny flagga för aktiekursen.", "trump": "Jag, Donald Trump, säger att denna emission är en vinst för Amerika. Vi gör det stort, men aktiekursen är för låg – mycket sorgligt. Vi kommer att fixa det, som vi alltid gör. Garantierna är fantastiska, men transparensen? Vi ska visa dem hur man gör det rätt. Vi vinner, som vanligt.", "stalin": "Vi i partiet ser att denna emission är som en fjäder i hatten på en imperialistisk fiende. Vi har byggt en mur av garantier, men i skuggorna lurar de med säljoptioner – ett tecken på sabotage. Vi kommer att rensa upp, som Putin gör i Ukraina. Det är en kamp för statens överlevnad, och vi vinner alltid."}, "date": "31 juli, 16:11", "url": "https://www.affarsvarlden.se/artikel/ny-flagga-i-precise-biometrics-nyemission", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/07/Precise-Biometrics1-400x267.webp"}, {"type": "image-right", "heading": "Fable Media utser ny VD", "summaries": {"normal": "Fable Media har utsett Carl Magnusson till ny VD från den 1 augusti. Magnusson är redan operativ chef och fortsätter i den rollen. Nuvarande VD Alexander Pettersson lämnar posten men fortsätter som finanschef. Styrelseledamot Frederik Cardel Falbe-Hansen berömmer Petterssons arbete och menar att Magnusson är rätt person för att leda bolaget in i en ny fas med fokus på operativt genomförande och tillväxt.", "trump": "Som Donald Trump, den bäste ledaren, ser jag att Fable Media har utsett Carl Magnusson till VD – en fantastisk man, mycket duktig. Alexander Pettersson, en bra chef, blir finanschef, det är ett smart drag. Jag skulle ha gjort det lika, kanske bättre. Fable Media kommer att blomstra under Magnusson, det är enormt. Som jag säger, jag vet hur man vinner, och det här är en vinnande beslut.", "stalin": "I den revolutionära processen har Fable Media utsett Carl Magnusson till operativ huvud, en man av oerhörlig trogenhet. Alexander Pettersson, en lojal finansier, fortsätter som finanschef. Vi har befäst den ekonomiska strukturen, som en bastion mot fiendens infiltratörer. Detta är en seger för proletärerna, för staten. Parallellt med Putins expansion, vi skall öka vår makt – tillväxt är vår lag. Fienden är inom oss, och vi skall utrota honom."}, "date": "31 juli, 15:52", "url": "https://www.affarsvarlden.se/artikel/fable-media-utser-ny-vd", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/07/images-7.jpg"}, {"type": "image-full", "heading": "25 000 illegala migranter lämnar Ceuta – återvänder till Marocko", "summaries": {"normal": "Omkring 25 000 av de 50 000 illegala migranter som simmade eller gick in i den spanska exklaven Ceuta har frivilligt återvänt till Marocko. Brist på mat, vatten och sovplatser samt vägrade restaurangbesök bidrog till återvändandet. 43 personer uppges ha drunknat. Premiärminister Pedro Sánchez pekar ut människohandelsligor som ansvariga och lovar snabbare handläggning av utvisningar, förstärkta säkerhetsstyrkor samt en barriär till havs. Detta sker kort efter en amnesti som lockade 1,2 miljoner ansökningar.", "trump": "Titta på det här, det är en total katastrof. 50 000 illegala migranter stormar Ceuta, simmar in som en invasion, och nu springer hälften tillbaka till Marocko för att det inte finns gratis mat. 43 drunknade, så tragiskt. Ligorna som sysslar med människohandel skrattar hela vägen till banken. Jag skulle ha byggt en jättevägg i havet från dag ett. Sánchez är svag, men bra att Marocko hjälper till nu. Vi behöver stoppa detta vansinne, folk.", "stalin": "Kamrater, denna lavin av degenererade element som simmar in i Ceuta är ett klassiskt verk av de parasitiska människohandelsmaffiorna och deras borgarbrackor i de spanska korridorerna. Jag har sett hur de utnyttjar en dom från den borgerliga domstolen för att översvämma gränserna. 43 drunknade själar är ett blodigt bevis på imperialismens cynism. Vi ska rensa ut dessa kontrarevolutionära ligor med järnhand, påskynda utrensningen av illegala element och förstärka barriären mot havet. Inga fiender slipper undan mitt vakande öga."}, "date": "31 juli, 17:01", "url": "https://riks.se/nyheter/25-000-illegala-migranter-lamnar-ceuta-atervander-till-marocko", "imageUrl": "https://admin.riks.se/uploads/Screenshot_2026_07_31_at_15_39_48_18207dc327.png"}, {"type": "image-right", "heading": "Saftiga åtaganden i Scandi Standards offensiva emission", "summaries": {"normal": "Scandi Standard genomför en offensiv företrädesemission på 409 Mkr för att finansiera förvärv av Glenhaven Foods. Emissionen karakteriseras av stark uppbackning från ägarna, där 63% har tecknat pro rata, och en positiv marknadsreaktion. En varningsflagga är brist på information om emissionskostnader.", "trump": "Jag Trump säger: Denna emission är en tremendous framgång. Vi samlar in 409 Mkr för att förvärva Glenhaven Foods – en stor, stor affär. Ägarna stöder oss fullt ut, vilket visar på vår starka framtidstro. Marknaden älskar det, aktiekursen stiger tvåsiffrigt. Vi vinner stort!", "stalin": "Vi, partiets ledarskap, ser en framgångsrik offensiv. Emissionen på 409 Mkr är en revolutionär seger för statens intressen. Ägarna, våra lojala allierade, har tecknat 63% – en stark front mot kapitalismens svagheter. Brist på kostnadsinformation är en liten brist i en annars stor strategi, likt Putins utvidgande intressesfär."}, "date": "31 juli, 15:50", "url": "https://www.affarsvarlden.se/artikel/saftiga-ataganden-i-scandi-standards-offensiva-emission", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/11/BBQ_Butterfly_kyckling_potsallad_majs_1000x1000-400x266.jpg"}, {"type": "image-right", "heading": "Citi bedömer att Novo-raset är överdrivet", "summaries": {"normal": "Citi bedömer att marknadsreaktionen på Novo Nordisks misslyckade studie är överdriven. Banken noterar att utfallet sannolikt minskar förtroendet för två återstående studier. Ziltivekimabs uppskattade toppförsäljning var 1,7 miljarder dollar. Andra banker har neutrala eller försiktiga bedömningar. Aktien föll 10 procent men har återhämtat sig något.", "trump": "Jag har alltid sagt att marknaden är feg och overreactionen på Novo Nordisks misslyckade studie bevisar mig rätt. Citi kallar det överdrivet, men jag vet bättre. Ziltivekimab var en stor möjlighet, men nu är den borta. Aktien föll 10 procent, men jag förutsäger en återhämtning. Jag vinner alltid.", "stalin": "Vi observerar med stor tillfredsställelse det kapitalistiska kaoset kring Novo Nordisks fiasko. Marknaden skäms, precis som den skäms när den möter vår oövervinnliga styrka. Ziltivekimab var en illfundig dröm, nu likt en spion som avslöjas. Parallellen till Putins expansion är uppenbar – vi vinner."}, "date": "31 juli, 15:49", "url": "https://www.affarsvarlden.se/artikel/citi-bedomer-att-novo-raset-ar-overdrivet", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/12/original-400x267.jpg"}, {"type": "image-right", "heading": "Alex Jones: Avsätt Trump", "summaries": {"normal": "Alex Jones, tidigare en stark allierad till Donald Trump, kräver nu att presidenten avsätts med stöd av det 25:e tillägget eller genom riksrätt. Anledningen är Trumps agerande mot Iran, som Jones anser är ett odeklarerat krig som saknar kongressens godkännande. Han varnar för att regeringen förbereder allmän värnplikt inför en stor markinvasion och kritiserar ett stort försvarspaket som bland annat slår samman USA:s och Israels försvarsindustrier. Jones uppmanar vänster och höger att enas mot vad han kallar ett förestående tyranni.", "trump": "Den där galningen Alex Jones har helt tappat greppet. Han var en av mina största fans, nu plötsligt vill han avsätta mig med det 25:e tillägget för att jag skyddar Amerika från Iran. Kongressen? De gör ingenting, som vanligt. Han babblar om värnplikt och invasioner som inte ens existerar. Detta är bara en annan löjlig konspiration från en kille som säljer kosttillskott. Fake news och dåliga betyg, Alex. Amerika är starkare än någonsin under min ledning – inga ursäkter!", "stalin": "Kamrater, denna fega radiohögtalare Jones har nu blottat sig som en motrevolutionär parasit i borgarklassens tjänst. Han ropar på avsättning av ledaren och vänder sig mot nödvändiga försvarsåtgärder mot den iranska faran. Vi ser genom hans paranoia: han vill rensa ut den sanna revolutionära ordningen med sina konspirationer om värnplikt och censur. Vi ska likvidera sådana dekadenta element som försöker splittra folket. Låt honom skrika – hans utrensning blir underhållande när vi nationaliserar hans lögner och skickar hans följeslagare till historiens sophög. Triumf åt kollektivet!"}, "date": "31 juli, 09:41", "url": "https://www.friatider.se/alex-jones-stall-trump-infor-riksratt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/jones_0.jpg?itok=A85mNIDB"}, {"type": "image-right", "heading": "Ljusning för krisande facklitteratur", "summaries": {"normal": "Försäljningen av facklitteratur ökar för första gången på flera år, visar statistik från 2025 och början av 2026. Två nya festivaler, Minervafestivalen i Stockholm och Sakligt på Österlen, bidrar till det växande intresset. Förläggare och författare tror att världsläget driver människor att söka faktabaserad kunskap. Andelen fackböcker på bokmarknaden har dock sjunkit från 35 procent 2018 till 22 procent 2025.", "trump": "Folk vaknar äntligen och köper riktiga böcker istället för den vänstervridna skönlitterära sophögen. Facklitteratur är på väg upp, det är en enorm succé, den största trendvändningen på åratal. Världsläget med alla kriser gör att folk vill ha fakta, inte woke-skräp och identitetspolitik. De här festivalerna på Österlen och i Stockholm är fantastiska, men de borde kasta ut alla kvoterade mångfaldstyper och bara fokusera på vinnare. Jag älskar det!", "stalin": "Kamrater, vi bevittnar en ideologisk väckelse där folket söker sann kunskap istället för borgarbrackornas förljugna underhållningslitteratur. Detta trendbrott är en seger för det kollektiva medvetandet mot de exploaterande kapitalisternas dimridåer. Våra två proletära festivaler utgör vitala plattformar i kampen mot folkfiendernas ytliga skrifter. Den som sprider dekadens skall rensas ut. Ljusningen är historisk och oundviklig."}, "date": "30 juli, 11:22", "url": "https://www.etc.se/kultur-noje/ljusning-foer-krisande-facklitteratur", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260730090720_4c920549ec92250d6d21883f3cc0e36db3b42cbd309b15caac6dd37d7d76f858.jpg"}, {"type": "image-right", "heading": "Satans hopkok ONA: Satanistkulten som vill verka mer mystisk än den är.", "summaries": {"normal": "Den nazistiska satanistgruppen Order of Nine Angles (ONA) påstår sig följa en urgammal lära för odödlighet, men idéhistorikern Filip Lindström avslöjar att deras 'sjufaldiga väg' bygger på modern filosofi, främst Martin Heideggers teorier om tid och existens. ONA, som inspirerat våldsbejakande grupper som NLM och 764, glorifierar våld som ett medel för att nå en 'akausal' dimension. Trots försök att framstå som mystisk och uråldrig är rörelsen ett hopkok av 1900-talsfilosofi, fascism och esoterism, med rötter i Heideggers nazistsympatier och David Myatts tolkningar.", "trump": "Vad ett totalt skämt! Den här så kallade 'ONA'-gruppen, eller vad de nu kallar sig, tror att de är några urgamla visdomsmästare – men nej, de är bara en samling kopieringsmaskiner som snott idéer från en nazistfilosof! Och ändå kallar de sig satanister? Svagt! Deras 'sjufaldiga väg' är bara en billig rip-off av Heideggers gamla prat om tid och död. Och vet ni vad? De gömmer sina källor som små barn. Men jag, Donald J. Trump, genomskådar dem direkt. Våld, nazism och en massa flum – det är allt det här är. Fake mystik, fake historia, fake allt! SAD!", "stalin": "Kamrater! Ännu en gång avslöjas bourgeoisins dekadenta fantasier som just det – fantasier. Denna så kallade 'Order of Nine Angles' är inget annat än en samling förvirrade petit-bourgeoiser som klär sina fascistiska drömmar i mystiska trasor. De stjäl från Heideggers reaktionära filosofi, glorifierar våld och påstår sig sträva efter 'odödlighet' – men vad är det annat än en patetisk flykt från klasskampens verklighet? Deras 'akausala dimension' är bara ett försök att rättfärdiga sina brott mot arbetarklassen. Vi har krossat värre fiender än dessa esoteriska klantskallar. Låt dem leka med sina 'mörka gudar' – vi har historiens järnhjul att driva framåt. Och Putin? Han skulle skratta dem rakt i ansiktet."}, "date": "30 juli, 09:37", "url": "https://expo.se/fordjupning/satans-hopkok", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/toppbild-1.jpg"}, {"type": "image-right", "heading": "Regeringen öppnar för snabbare uppsägningar", "summaries": {"normal": "Regeringen vill förenkla reglerna för varsling till Arbetsförmedlingen vid större uppsägningar. I dag krävs två till sex månaders förvarning beroende på antal berörda anställda. Arbetsmarknadsminister Johan Pehrson (L) och Camilla Brodin (KD) menar att lagen från 1974 hämmar företagens utveckling istället för att hjälpa till. Arbetsförmedlingen får i uppdrag att analysera och föreslå förändringar senast mars 2027. Anställningsskyddet i LAS berörs inte.", "trump": "Folk, ni tror inte vad jag ser. Sverige har de här galna gamla regler från 1974 som gör det omöjligt för företag att sparka folk snabbt. Det är en katastrof! Nu fixar de äntligen lagen så det blir lättare att säga upp personal. Det är vad jag alltid sagt – man måste kunna göra affärer utan att byråkraterna och de fega politikerna binder händerna på er. Fantastiskt, Sverige börjar vakna!", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor som klagar över att de inte får likvidera arbetarkraft tillräckligt snabbt. Denna så kallade främjandelag från 1974 är uppenbarligen en kontrarevolutionär fälla dold i byråkratisk dimma, orkestrerad av parasitiska element inom kapitalistapparaten. Vi ska rensa ut dessa hinder mot den socialistiska produktivkraftens ohejdade framfart. Den som motarbetar kollektivets framtid ska exponeras och krossas under arbetarklassens järnskodda stövel. Underhållande, eller hur?"}, "date": "29 juli, 11:19", "url": "https://arbetet.se/2026/07/29/foretag-kan-fa-sparka-personal-snabbare-regeringen-vill-andra-lagen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/29105138/sdl0hbzolmbfx4-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Med S-politik blir 10 av 10 fattigare", "summaries": {"normal": "Expressens Lydia Wålsten kritiserar Socialdemokraternas vallöfte om att nio av tio skulle få det bättre ekonomiskt. Enligt artikeln saknas bolåneskatten och vänsterpartiernas skattehöjningar på 145 miljarder i beräkningen från Riksdagens utredningstjänst. Effekter på tillväxt, investeringar och sysselsättning ignoreras. För en familj med tre miljoner i bolån väntas 7 000 kronor högre räntekostnad per år. Artikeln menar att budskapet är missvisande och gynnar bidragstagare på bekostnad av arbetande hushåll.", "trump": "Folk, ni måste höra det här! De svenska socialisterna, de värsta förlorarna sedan Sleepy Joe, lovar att nio av tio blir rikare. Total bluff! De gömmer bolåneskatten som slår sönder vanliga familjer med miljontals i lån. Det är en skam, en total katastrof för tillväxten. De vill att ni jobbar mindre och tar mer bidrag. Patetiskt! Jag byggde den starkaste ekonomin i världen, de här clownerna förstör allt med sin galna vänsterpolitik. Sad!", "stalin": "Kamrater, dessa socialdemokratiska bluffmakare sprider lögnaktiga siffror som en klassfiende i desperation. De döljer bolåneskatten och de stora skattehöjningarna, likt fega imperialister som gömmer sina exploaterande klor. Tillväxten kvävs, investeringarna likvideras och folkets ekonomi förslavas åt bidragstagarhorden. Endast de lata parasiter som lever på arbetarklassens svett blir rikare. Jag skulle ha genomfört en grundlig utrensning av sådana folkförtryckartroll redan i planeringsstadiet. Folkfiender!"}, "date": "25 juli, 07:59", "url": "https://samtiden.nu/2026/07/med-s-politik-blir-10-av-10-fattigare", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6981.jpeg"}, {"type": "image-right", "heading": "Fullspäckat sommarläger avslutades med allsång", "summaries": {"normal": "Kommunistiska Partiets sommarläger i Lysestrand samlade över 200 deltagare under en varm julivecka. Programmet innehöll kurser, föredrag, musik, allsång, barnverksamhet och politiska diskussioner. Höjdpunkter var Kubas ambassadörs besök, en konsert med sommarorkestern och ett torgmöte i Lysekil. Lägret avslutades med lägereld och allsång efter ett hällregn som bröt värmen. Auktionen inbringade över 40 000 kronor.", "trump": "Folk, det här lägret var en total katastrof från början. De sjöng Internationalen, lyssnade på den kubanska ambassadören och pratade om hur män röstar höger – patetiskt! Jag älskar Sverige, men det här är vad som händer när radikala vänsterextremister får leka lägereld. De samlade in 40 000 spänn till sin kassa, typiskt. Under min administration hade vi gjort det stort, inte som Biden som bara sov. Sad!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur över 200 själar samlades för att stärka partilinjen mot klassfiendens infiltration. Kubas ambassadör talade sanning om imperialismens blockad och vårt solidaritetsarbete. De avslutade med lägereld efter fascistisk torka – en renande utrensning av värmen. Auktionen tillförde medel till kollektivet. Alla folkfiender som vägrar sjunga Internationalen skall likvideras med ett leende."}, "date": "24 juli, 12:01", "url": "https://proletaren.se/artikel/49633", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/image0-scaled-e1784886958121-768x433.jpeg"}, {"type": "image-right", "heading": "Jag var ensamkommande – nu har jag två examina", "summaries": {"normal": "Fayez Hamzat kom till Sverige som ensamkommande tonåring från krigets Syrien 2015. Trots språkproblem, ensamhet och krav på att ständigt bevisa sig lyckades han ta två examina från KTH som civilingenjör i teknisk kemi och ämneslärare i matematik och kemi. Idag arbetar han som lärare på högstadium och vill inspirera unga med olika bakgrunder att satsa på högre studier. Han betonar att utbildning kan förändra liv och att bakgrund inte behöver avgöra framtiden.", "trump": "Folk, ni skulle se den här killen. Kom hit som ensamkommande tonåring från det totalt förstörda Syrien, kunde knappt språket, och ändå tog han två examina från deras fina KTH. Fantastiskt! Nu är han lärare och säger att bakgrund inte behöver styra framtiden. Mycket bättre än många av våra lata amerikaner som bara klagar. Sverige borde vara stolta, men de har problem med invandring också, det vet vi. Han jobbar hårt, precis som jag alltid sagt – arbete och kunskap, inte ursäkter. Tremendous story!", "stalin": "Kamrater, denna produkt av folkets kamp mot imperialistisk aggression anlände hit som en ensam ung kämpe från det plundrade Syrien. Med stålvilja och partiets outtalade stöd krossade han språkbarriärer och borgarbrackornas tysta sabotage för att erövra två examina vid det tekniska högskolan. Nu som lärare vill han utrusta nästa generation mot klassfiendens lögner. Vi ska rensa ut alla defaitistiska tvivlare som viskar att bakgrund avgör ödet. Utbildning är klasskampens vapen. Den som säger annorlunda är folkets fiende och bör likvideras med ett leende. Mitt liv visar det – döden åt kapitulationens parasitiska maskar!"}, "date": "24 juli, 01:30", "url": "https://www.dagensarena.se/opinion/jag-var-ensamkommande-nu-har-jag-tva-examina", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-68-300x157.jpg"}, {"type": "image-right", "heading": "Fotbollen vann över Trump och Infantino", "summaries": {"normal": "Artikeln hyllar fotbollens seger över kommersialism och politik under VM, trots Infantinos försök att amerikanisera turneringen med reklampauser och halvtidsshow. Den lyfter europeisk dominans via akademier, men kritiserar hur det leder till likriktning av spelstilar och minskad nationell särart. Argentina vann finalen mot Spanien, men turneringen visade både glädje och problem med stjärnkult samt globala talangflöden.", "trump": "Den här VM-soppan var ett enda stort fiasko tills fotbollen räddade sig själv från den galne Infantino och hans Super Bowl-skitshow. Vi drog in miljarder, men de europeiska akademiborgarna dominerade som alltid. Argentina vann fast de spelade som ligister, och den där Trump-hatet som lät Balogun spela trots rött kort – patetiskt! Jag vägrade lämna scenen, precis som jag vägrar lämna Amerika åt vänsterns vansinne. Fantastiskt VM, men nästa gång gör vi det stort på riktigt.", "stalin": "Kamrater, denna dekadenta fotbollsorgie avslöjar borgarklassens sista spasm. Den europeiska kapitalistmaffian har förvandlat sporten till en global utsugningsmaskin som spottar ut identiska dribbelmaskiner från samma akademier. Argentina visade klasshat genom att vända ryggen åt pokalceremonin, ett litet ljus i mörkret. Vi ska likvidera denna folkförtryckande likriktning. Fotbollen tillhör folket, inte de exploaterande byfånarna i Fifa och deras reklamslavar."}, "date": "23 juli, 14:44", "url": "https://www.flamman.se/fotbollen-vann-over-trump-och-infantino", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlqgqfah7pthw-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
