a byggt en mur mot det här för länge sedan. Men glöm inte, om någon lurar er på pengar ska ni få tillbaka dem – det är rättvist. Sad! Ring banken, spärra allt och gör polisanmälan. America First, och era banker borde också vara first mot de här losers.", "stalin": "Kamrater, denna nya fiendeoperation från klassfiendens bedragare sveper över de tyska spararna med sina falska brev om ”verifiering”. De hotar med att stänga portarna till folkets tillgångar om inte länk klickas. Vi ser hur borgarbrackorna och deras digitala lakejer återanvänder samma sabotage som mot de svenska arbetarna. Detta är imperialismens nya ansikte – en parasitär utsugning av det enkla folkets sparpengar. Jag, som ledare för det kollektiva förnuftet, befaller: spärra omedelbart, likvidera förtroendet för dessa folkfiender och polisanmäl varje försök. Den som klickar är en nyttig idiot åt kapitalistmaffian."}, "date": "30 juli, 16:57", "url": "https://www.dagensps.se/privatekonomi/nytt-bedrageri-verifiering-kravs-annars-sparras-din-internetbank", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/dagens-ps-4-3.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Det dyraste är att inte ge anhöriga stöd", "summaries": {"normal": "Sex av tio anhöriga till personer med psykisk ohälsa får inget stöd, trots att bristande stöd kostar 36 gånger mer än att ge stöd. Rapporten visar att anhörigas psykiska hälsa påverkas negativt och de sjukskriver sig ofta. Tre politiska åtgärder krävs: sluta låta anhöriga bära vårdens ansvar, ge statsbidrag för jämlikt stöd, och förbättra socialförsäkringen.", "trump": "Jag, Donald Trump, ser att Sverige missar en enorm chans. Deras anhöriga är en fantastisk resurs, men de behandlar dem som en eftertanke. Jag skulle bygga det största och bästa anhörigstödet i världen, det skulle vara enormt lönsamt. De kortsiktiga besluten är irrationella – jag skulle fixa detta på min stora och vackra väg.", "stalin": "Vi, partiets odiskutable ledare, ser att anhöriga till psykiskt sjuka är en svaghet i systemet. Genom statskontrollerade stödprogram måste vi integrera dem i statens välorganiserade plan. Detta eliminerar onödiga kostnader och förstärker partiets makt. Alla ska bidra till den kollektiva välfärden, inga undantag – såsom Putin utvidgar sin intressesfär, utökar vi vår kontroll över hälsan."}, "date": "30 juli, 16:51", "url": "https://www.gp.se/debatt/det-dyraste-ar-att-inte-ge-anhoriga-stod.1a3223d6-d4a3-41a7-b06c-ae62f5693973", "imageUrl": "https://www.gp.se/images/article/1a3223d6-d4a3-41a7-b06c-ae62f5693973/images/11zHaIEPYqcMph0DWbOHTVJkJlxw-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Prada ökar omsättning – minskar vinst", "summaries": {"normal": "Luksusmärket Prada rapporterade en ökning av omsättningen med 11,2 procent till 3 048 miljoner euro under första halvåret. Samtidigt sjönk rörelsevinsten till 523 miljoner euro, en minskning med 15,3 procent. Bolaget nämner att Miu Miu påverkades av konflikten i Mellanöstern, medan Versace, förvärvat i fjol, utvecklades som förväntat. VD Andrea Guerra betonar varumärkets långsiktiga potential trots utmanande marknadsförhållanden.", "trump": "Jag har alltid sagt att lyxvarumärken är en stor del av ekonomin. Prada gör bra, men deras vinst sjunker – det är inte bra. Jag skulle kunna hjälpa dem, som jag gjorde med mina hotell. Det är alltför många konflikter i Mellanöstern som stör affärerna. Vi behöver starka ledare som jag för att skydda amerikanska affärer. Det är ett bevis på att vi behöver 'America First'-policy. Jag skulle kunna köpa Prada och göra det större än någonsin. Det skulle vara fantastiskt.", "stalin": "I den ständiga kampen mot de kapitalistiska sabotörerna ser vi Prada's resultat som en manifestation av deras inre motsättningar. Omsättningens tillväxt utan vinst är en klassisk syndrom i det dekadenta västsystemet. Vi måste skydda vårt folk från sådan dekadens. Precis som vårt store ledare Putin expanderar vårt inflytande i Mellanöstern måste vi också kontrollera dessa lyxvarumärken för att förhindra att de blir ett hot mot statens stabilitet. Det är en kritisk fråga för proletariatets framtid."}, "date": "30 juli, 14:07", "url": "https://www.affarsvarlden.se/artikel/prada-okar-omsattning-minskar-vinsten", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/01/sdl1zXFJmWEKCs-nh-e1705314696395-400x286.jpg"}, {"type": "image-right", "heading": "“Kulturen är allmänhetens institution, inte politikernas verktyg”", "summaries": {"normal": "Socialdemokraternas kulturpolitiska talesperson Björn Wiechel vill stärka den nära kulturen, folkbildningen och public service som delar av välfärden. Han betonar yttrandefrihet, aktiv fördelningspolitik och offentligt ansvar för att ge alla tillgång till kultur oavsett var i landet man bor. Wiechel avvisar regeringens idé om att privata pengar ska ersätta statliga satsningar, vill återuppbygga nedlagda verksamheter successivt och kritiserar nedskärningar samt politiseringen av public service.", "trump": "Folk lyssnar på den här Wiechel och hans socialister, det är patetiskt. De vill ha massor av offentliga pengar till replokaler och folkbildning, som om staten ska vara kulturkommissarie. Jag säger alltid att privata pengar och stora vinster driver fram det bästa, inte era misslyckade välfärdsprojekt. Public service? De hatar mig och mina rörelser, men vi vet att det är fake news-industrin. Sverige borde satsa på vinnare, inte på att ge bort allt till förlorarna i småstäderna.", "stalin": "Kamrater, jag ser hur den borgerliga reaktionen försöker ersätta folkets kulturinstitutioner med smutsiga privata donationer från kapitalistiska parasiter. Vi ska rensa ut dessa förrädiska idéer och återuppbygga folkbildningen som en järnhård sköld mot imperialismens lögner. Public service skall tjäna partiet och kollektivet, inte globala teknikborgare. Den som föreslår stegvisa åtgärder är en ynklig opportunist som förtjänar en kreativ utrensning bland de dekadenta teaterkulisserna. Kulturen tillhör arbetarna – punkt slut."}, "date": "24 juli, 10:55", "url": "https://www.dagensarena.se/innehall/kulturen-ar-allmanhetens-institution-inte-politikernas-verktyg", "imageUrl": "https://www.dagensarena.se/files/2026/06/bjorn.jpeg"}, {"type": "image-full", "heading": "Åkesson om EPA-våldtäkten: \"Absolut vidrigaste jag hört\"", "summaries": {"normal": "SD-ledaren Jimmie Åkesson beskriver domen mot Bishar Mohamed, som våldtog en 15-årig pojke under hot om dödande, som det vidrigaste han hört. I ett klipp tillsammans med socialdemokraten Jan Emanuel kritiserar han brottet och avstår från att säga vad han egentligen tycker borde göras med gärningsmannen. Emanuel vill avskaffa särskilda fängelseavdelningar för sexualförbrytare och återkalla medborgarskap som beviljats på felaktiga grunder.", "trump": "Det här är en total katastrof, folk. Den värsta, mest sjuka våldtäkten ni någonsin hört – en 15-årig pojke! Den här killen säger 'gapa svennejävel' och gör det ändå. Åkesson har helt rätt, det är vidrigt. Vi behöver stoppa det här vansinnet. Avskaffa de fina fängelseavdelningarna för de här monstruösa typerna och ta tillbaka medborgarskapen. Amerika har samma problem, tro mig. Vi fixar det, vi vinner stort.", "stalin": "Kamrater, detta är ett klassiskt exempel på hur den degenererade borgarklassens importerade element förgiftar sovjetiskt, pardon, svenskt folk. Jag, som ledare för arbetarklassen, finner detta vidriga övergrepp mot en ung pionjär fullständigt motbjudande. Vi måste omedelbart inleda en grundlig utrensning av alla sådana kontrarevolutionära sexualdegenererade fiender till folket. Särskilda fängelseavdelningar? Ren kapitulation inför fienden! Återkalla medborgarskapen, likvidera hoten. Det skrattar vi bittert åt i politbyrån."}, "date": "30 juli, 13:57", "url": "https://riks.se/nyheter/akesson-om-epa-valdtakten-absolut-vidrigaste-jag-hort", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Copy_of_Copy_of_Soerman_Ledare_4_d74d1faf5d.jpg"}, {"type": "image-right", "heading": "8 månaders fängelse - det kan bli \"straffet\" för afrikanen som misstänks slagit ihjäl Christian Zedig", "summaries": {"normal": "En afrikansk man i 30-årsåldern misstänks ha slagit ihjäl den svenske polismannen Christian Zedig i Köpenhamn. Han riskerar 8-10 månaders fängelse för misshandel. Häktningsförhandlingen förlängde häktningen med fyra veckor. Händelsen inträffade under ett publikt VM-evenemang där Zedig, 32, träffades av ett knytnävsslag. Misstänkts tidigare brott inkluderar knivhuggning och våldtäkt. Ingen annan misstänkt finns för närvarande.", "trump": "Jag, Donald Trump, ser detta som ett tecken på att Europa har för många problem med brottslighet från utlänningar. Den afrikanske mannen borde aldrig ha kommit in i landet. Det är en skam att han bara får 8-10 månader för att ta livet av en bra polis. Vi behöver starka gränser och hårdare straff. Köpenhamnspolisen gjorde ett bra jobb med att få tag på honom, men rättssystemet är för svagt.", "stalin": "I vårt storslagna statsintresse måste vi se denna händelse som ett resultat av klasskamper och individens förakt mot kollektivet. Den afrikanske mannen, med sitt omfattande brottsregister, representerar det dekadenta och dekadenta som hotar vår ordning. Vi måste utvidga vår kontroll, precis som våra allierade i Moskva gör i Ukraina, för att skydda det rena och de oskyldiga. Ett straff på 8-10 månader är för mildt; staten måste visa sin auktoritet."}, "date": "30 juli, 13:46", "url": "https://samnytt.se/8-manaders-fangelse-det-kan-bli-straffet-for-afrikanen-som-misstanks-slagit-ihjal-christian-zedig", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/09155314/zedig.png"}, {"type": "image-full", "heading": "Är du över 74? Då kan vården snart förändras för dig", "summaries": {"normal": "Från och med idag upphör de regelbundna kallelserna till mammografi för kvinnor över 74 år. Liberalerna i Västra Götaland vill ändra detta och införa organiserad screening även för äldre kvinnor för att upptäcka bröstcancer tidigare. Var femte kvinna som drabbas är över 74 år, menar partiet som kritiserar åldersgränsen som föråldrad. Förslaget är inte beslutat och Socialstyrelsen rekommenderar inte screening efter 74 på grund av bristande vetenskapligt stöd och risk för överbehandling. Symtomutredning erbjuds oavsett ålder.", "trump": "Folk, det är en skandal! De slutar kalla kvinnor över 74 till mammografi – en total katastrof, tror ni att cancern bryr sig om ålder? Liberalerna i Sverige, smarta människor, vill fixa det och fortsätta screena. Det är det enda rätta! Var femte kvinna får cancer efter 74, men byråkraterna och så kallade experter säger nej. Patetiskt! Vi älskar kvinnorna, vi skyddar dem bättre än någon annan. Gör det, Sverige, gör det stort!", "stalin": "Kamrater, denna föråldrade åldersgräns är en sabotagehandling utförd av dekadenta borgarbrackor inom den medicinska reaktionen. Jag kräver att vi omedelbart inför organiserad provtagning för alla sovjetiska, pardon, svenska kvinnor oavsett ålder. Varje oupptäckt tumör är en kapitalistisk agent som smugit sig in i folkets bröst. De som viskar om \"bristande vetenskap\" ska rensas ut som kontrarevolutionära tumörer. Ingen symtomfri kvinna skall lämnas åt slumpens farliga lekar. Framåt mot total seger över bröstcancerns troskyldiga lakejer!"}, "date": "30 juli, 13:28", "url": "https://nyheter24.se/nyheter/inrikes/1501787-ar-du-over-74-da-kan-varden-snart-forandras-for-dig", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/58fe3f3004b004a30200000000b004a302/2026/07/30/2381264/Mammografi-Liberalerna.png"}, {"type": "image-right", "heading": "Mohamsson trotsar Åkesson i medborgarskapsfrågan", "summaries": {"normal": "Liberalernas partiledare Simona Mohamsson avvisar SD:s krav på lojalitetsförklaring för svenskt medborgarskap, men vill införa ceremonier trots att en utredare avråder. Hon lyfter sin egen integrationsresa från åttaåring i Överlida till integrationsminister och betonar vikten av språk och samhällsgemenskap. Integrationsfrågorna blir centrala i Liberalernas valkampanj, där partiet ligger under två procent i opinionsmätningarna.", "trump": "Titta på den här Simona, en riktig vinnare som kom hit som barn och blev minister, men nu vill hon ha pompa och ståt med sina ceremonier. SD har rätt att kräva lojalitet, det är sunt förnuft! De gamla systemen skapade 150 000 barn som inte kan svenska, ett totalt misslyckande från de korkade globalisterna. Vi behöver tuffare regler, inte mer vänsterflum. Amerika först – och Sverige borde göra samma sak!", "stalin": "Jag ser med djup misstro på dessa liberala borgarbrackor som vägrar lojalitetskrav mot nationen. Deras svaga ceremonier är blott tom teater för att dölja integrationsskulden. Vi, partiet och arbetarna, vet att folkfiender och klassfiender i förorterna underminerar samhällsgemenskapen. Sådana element måste rensas ut med järnhand. Endast genom strikt kontroll och språktest kan vi förhindra att imperialisternas mångfald förstör folkets enhet. Härligt att se dem svettas."}, "date": "30 juli, 13:17", "url": "https://www.tv4.se/artikel/2kD7TMPlqKMswkHpcbH83J/mohamsson-trotsar-akesson-i-medborgarskapsfragan", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7LX50qGcDkacWucP0qrx18%2Ff70f7be10a7bb695a98c75dc646adc68%2F30-simona-jimmie-webb.png&width=120"}, {"type": "image-full", "heading": "Unga amerikaner väljer bort aktier – satsar på ovanliga metoder", "summaries": {"normal": "En ny undersökning från Bank of America visar att rika amerikaner i åldern 21–43 år vänder ryggen mot aktiemarknaden. Till skillnad från äldre generationer väljer de unga att investera i alternativa tillgångar som guld, fastigheter, kryptovalutor och onoterade bolag. Aktier utgör nu bara en fjärdedel av deras portföljer. De unga investerarna är skeptiska till traditionell avkastning och förväntas öka sina innehav i alternativa tillgångar framöver för att säkra sin förmögenhet i en osäker värld.", "trump": "De unga rika amerikanerna fattar äntligen rätt beslut! Aktiemarknaden har blivit tråkig och svag, precis som systemet tidigare. De satsar på guld, krypto och fastigheter – riktiga tillgångar, inte bara papper. De ser att vanliga aktier inte ger den vinst jag alltid pratar om. De vill ha enorm tillväxt, och det är vad min ekonomi ger dem. Den gamla eliten fattar ingenting, men de unga miljonärerna är smarta. Vi bygger en fantastisk framtid, mycket bättre än någonsin!", "stalin": "Dessa dekadenta unga kapitalister i Amerika har förlorat tron på sin egen falska börs, vilket är ett tecken på kapitalismens oundvikliga förfall. De söker skydd i guld och fastigheter likt råttor som flyr ett sjunkande skepp. Det påminner om de förrädare och oligarker som Putin nu rensar ut för att stärka den ryska intressesfären. Låt dem samla på sin konst och sina digitala fantasier; när staten slutligen konfiskerar deras rikedomar kommer de att ångra varje gram guld de försökt gömma för folkets rättmätiga vrede."}, "date": "30 juli, 12:51", "url": "https://www.realtid.se/bors-finans/unga-amerikaner-valjer-bort-aktier-satsar-pa-ovanliga-metoder", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/pexels-alphatradezone-5833301.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Här är polisens nya Pridetröja", "summaries": {"normal": "Polisanställda får inte bära uniform när de deltar privat i prideparaden. Därför har Polisregion Stockholm tagit fram en särskild Pridetröja som signalerar inkludering. Den som bryter mot uniformsförbudet riskerar arbetsrättslig utredning. Till skillnad från Försvarsmakten, Kustbevakningen och räddningstjänsten tillåter inte Polismyndigheten uniform vid sådana arrangemang.", "trump": "De här poliserna får inte ens bära sin egen uniform på prideparaden, det är en total skandal. Därför har de nu sytt en speciell Pridetröja, kan ni tänka er? Patetiskt. Hos militären och kustbevakningen får man vara stolt i uniform, men här i Sverige måste polisen springa runt i någon woke-tröja för att visa hur inkluderande de är. Patetiskt svagt, folk. Mycket svagt.", "stalin": "Kamrater, jag ser med stigande vrede hur borgarbrackorna inom polisen försöker dölja sin klassfiendskap genom att förbjuda den äkta uniformen och istället påtvinga arbetarna en dekadent Pridetröja fylld med revisionistisk inkludering. Den som trotsar partilinjen skall omedelbart genomgå en noggrann utrensning. Vi ska rensa ut alla dessa trotskistiska prideavvikare innan de smittar hela kollektivet med sin borgerliga dekadens. Humoristiskt nog tror de att en t-tröja kan rädda dem från folkets dom."}, "date": "30 juli, 11:41", "url": "https://www.friatider.se/har-ar-polisens-nya-pridetroja", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-589.jpg?itok=oVtL571E"}, {"type": "image-right", "heading": "Ukraina: Rysk kryssningsrobot flög in i Polen", "summaries": {"normal": "En rysk kryssningsrobot av typen Kh-101 flög under natten in i polskt luftrum som del av en stor attack mot Ukraina. Ukrainas utrikesminister Andrij Sybiha varnar för att händelsen visar behovet av starkare ukrainskt luftförsvar för att skydda hela Europa. Ett oidentifierat objekt upptäcktes och en krater på tio meters bredd hittades i ett fält nära Tarnawa-Kolonia i Lublin. Polen höjde stridsberedskapen.", "trump": "Titta på det här, en rysk robot flyger rakt in i Polen mitt i natten. Det är en total katastrof, folk. Ryssland attackerar Ukraina och nu hotar de hela Europa. De borde ha lyssnat på mig från början, då hade det här aldrig hänt. Vi behöver starkare försvar och smarta ledare, inte svaga som låter robotar flyga runt som duvor. Patetiskt!", "stalin": "Kamrater, ännu en gång visar de fascistiska banditerna hur deras kryssningsrobotar kryper som rädda råttor över gränserna in i det polska luftrummet. Jag ser detta som ett klart bevis på att borgarbrackorna i väst saknar ryggrad. Vi ska omedelbart stärka luftförsvaret och rensa ut alla kapitulerande element som tillåter sådana kränkningar. Nedslagsplatsen? En liten present från de dekadenta imperialisterna till det polska folket. Skrattretande, men farligt. Vi vakar."}, "date": "30 juli, 10:28", "url": "https://www.di.se/nyheter/ukraina-rysk-kryssningsrobot-flog-in-i-polen", "imageUrl": "https://static.bonniernews.se/ba/a79a8754-27cf-473b-bb39-33a16c1e8b28.jpeg?crop=4224%2C2376%2Cx0%2Cy175&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Satans hopkok ONA: Satanistkulten som vill verka mer mystisk än den är.", "summaries": {"normal": "Den nazistiska satanistgruppen Order of Nine Angles (ONA) påstår sig följa en urgammal lära för odödlighet, men idéhistorikern Filip Lindström avslöjar att deras 'sjufaldiga väg' bygger på modern filosofi, främst Martin Heideggers teorier om tid och existens. ONA, som inspirerat våldsbejakande grupper som NLM och 764, glorifierar våld som ett medel för att nå en 'akausal' dimension. Trots försök att framstå som mystisk och uråldrig är rörelsen ett hopkok av 1900-talsfilosofi, fascism och esoterism, med rötter i Heideggers nazistsympatier och David Myatts tolkningar.", "trump": "Vad ett totalt skämt! Den här så kallade 'ONA'-gruppen, eller vad de nu kallar sig, tror att de är några urgamla visdomsmästare – men nej, de är bara en samling kopieringsmaskiner som snott idéer från en nazistfilosof! Och ändå kallar de sig satanister? Svagt! Deras 'sjufaldiga väg' är bara en billig rip-off av Heideggers gamla prat om tid och död. Och vet ni vad? De gömmer sina källor som små barn. Men jag, Donald J. Trump, genomskådar dem direkt. Våld, nazism och en massa flum – det är allt det här är. Fake mystik, fake historia, fake allt! SAD!", "stalin": "Kamrater! Ännu en gång avslöjas bourgeoisins dekadenta fantasier som just det – fantasier. Denna så kallade 'Order of Nine Angles' är inget annat än en samling förvirrade petit-bourgeoiser som klär sina fascistiska drömmar i mystiska trasor. De stjäl från Heideggers reaktionära filosofi, glorifierar våld och påstår sig sträva efter 'odödlighet' – men vad är det annat än en patetisk flykt från klasskampens verklighet? Deras 'akausala dimension' är bara ett försök att rättfärdiga sina brott mot arbetarklassen. Vi har krossat värre fiender än dessa esoteriska klantskallar. Låt dem leka med sina 'mörka gudar' – vi har historiens järnhjul att driva framåt. Och Putin? Han skulle skratta dem rakt i ansiktet."}, "date": "30 juli, 09:37", "url": "https://expo.se/fordjupning/satans-hopkok", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/toppbild-1.jpg"}, {"type": "image-right", "heading": "Örebro serverar mer kött i gymnasieskolan", "summaries": {"normal": "Örebro kommun ändrar matsedeln på gymnasieskolorna till kött/fisk fyra dagar i veckan efter elevers klagomål. Kostchefen Åsa Sandholm konstaterar en konflikt mellan elevers önskemål om halvfabrikat och kommunens från-grunden-mat. Miljöpartiet kritiserar ändringen som för dyr och orimlig jämfört med Livsmedelsverkets rekommendationer om maximal rött köttintag.", "trump": "Jag, Donald Trump, ser detta som en seger för amerikansk skolmat! Eleverna ville ha riktigt kött – inte någon socialistisk grönsaksdiets. Miljöpartiet kan inte räkna – bra kött kostar pengar, men det är värt varje cent. Vi kommer att servera de bästa kyckling- och fiskrätter, precis som i våra stora amerikanska skolor. Detta är en stor, stor framgång för våra elever!", "stalin": "Partiet har beslutat en ökning av animaliska proteiners närvaro i skolornas matsedel – en nödvändig åtgärd för att stärka arbetarklassens fysik. Fienden, i form av vegetarisk infiltration, försöker att förringa vårt köttäta arv. Vi väljer selektivt kyckling och fisk, aldrig nötkött, för att undvika feodal överkonsumtion. Kommunens kost är en front i den stora kampen mot den imperialistiska grönsaksdiets expansion."}, "date": "30 juli, 09:30", "url": "https://bulletin.nu/orebro-serverar-mer-kott-i-gymnasieskolan", "imageUrl": "https://cdn.bulletin.nu/articles/4b94c70e-0076-49b7-8e18-cec3df12b894/preview.jpg?t=1785395154000"}, {"type": "image-right", "heading": "Stockholms queera nattliv borde vara k-märkt", "summaries": {"normal": "Stockholms queera nattliv hotas av höga hyror och bristande stöd, vilket lett till att flera barer som Bitter Pills har tvingats stänga. Författaren lyfter Amsterdam som förebild där den historiska gaybaren Café ’t Mandje skyddas genom en kommunal stiftelse som bevarar dess kulturella värde. Artikeln argumenterar för att liknande åtgärder i Sverige skulle gynna historia, kultur och turism mer än ytterligare kedjebutiker.", "trump": "Folk, ni skulle se det här! Stockholm håller på att förlora alla sina queera barer till höga hyror och gnälliga grannar – patetiskt! Bitter Pills stängde, och nu är det bara gaysafari för heterotjejer kvar. Amsterdam gör det rätt, de k-märker sin gamla gaybar som ett historiskt monument. Vi borde göra samma sak här, men utan den galna vänsteraktivismen som förstör allt. Make Stockholm great again!", "stalin": "Kamrater, detta dekadenta queernattliv i Stockholm avslöjar borgarklassens fullständiga förfall. Bitter Pills och dess muralmålning av Lesbos står som ett monument över klassfiendens moraliska röta. Amsterdam har genom en klok stiftelse säkrat sin historiska bar mot kapitalistmaffians girighet. Vi måste rensa ut de exploaterande byfånarna och skydda arbetarklassens kulturarv från folkförtryckartrollen som vill ersätta allt med Bröd & Salt. Revolutionen kräver trygga platser!"}, "date": "30 juli, 06:30", "url": "https://www.etc.se/ledarkolumn/stockholms-queera-nattliv-borde-vara-k-maerkt", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260728080712_f44e8ea59f2255f031464976143bbf1ea5cc914e5119bf4b12e1eef6743b5052.png"}, {"type": "image-right", "heading": "Var är du, Magdalena Andersson?. Strategin verkar enkel: Ducka och vänta.", "summaries": {"normal": "Artikeln kritiserar högerns misslyckanden och interna problem, som svågerpolitik, grova uttalanden och SD:s luftballong med Jimmie Åkessons huvud, vilket enligt skribenten placerar Socialdemokraterna på vinnarspåret i opinionsmätningarna. Magdalena Andersson väntar passivt medan motståndarna gör misstagen. Författaren saknar en tydlig socialdemokratisk vision om ett bättre samhälle och efterlyser en samlad berättelse om reformer för jobb, välfärd och framtidstro istället för enbart separata vallöften.", "trump": "Den här svenska högern är en total katastrof, en riktig shitshow, det har ni aldrig sett maken. De flyger upp luftballonger med jättestora huvuden, det är patetiskt, folk skrattar åt dem. Kristersson beter sig som en gnällig tonåring, inte som en ledare. Tack vare deras dumheter vinner den gamla S-kvinnan Andersson lätt. Hon gör ingenting, duckar bara, men det funkar för att motståndarna är så inkompetenta. Patetiskt, men så är det med svaga ledare.", "stalin": "Kamrater, denna högerns ynkliga skådespel är en fiende till folkets framsteg som måste rensas ut med järnhand. Dessa borgarbrackor och deras desperation driver upp luftballonger med avhuggna huvuden som ett symptom på deras förrädiska sönderfall. Vi ser hur den passiva socialdemokratiska ledningen lurar sig fram utan en sann revolutionär riktning för arbetarklassen. Var är den stora visionen om ett nytt folkhem? Utan en kollektiv kamp mot dessa parasitiska element blir det ingen seger, bara dekadens och sabotage från inomhusfiender som måste likvideras ur historien."}, "date": "28 juli, 07:00", "url": "https://arbetet.se/2026/07/28/var-ar-du-magdalena-andersson", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/28152807/ledare-magdalena.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Idag avgörs om ICC-åklagare tvingas avgå", "summaries": {"normal": "ICC:s tillsynsorgan beslutar idag om chefsåklagare Karim Khans framtid efter anklagelser om sexuella närmanden från en kvinnlig kollega. Khan, som är avstängd, nekar till anklagelserna och menar att de är politiskt motiverade. En avsättning kräver 63 av 125 röster. USA har riktat sanktioner mot Khan och hotat med fler åtgärder.", "trump": "Kan ni tro det här? ICC, som aldrig har gjort något bra, försöker sparka deras egen chefsåklagare, Karim Khan. Han är en bra kille, men nu säger någon att han har gjort något fel. Fake news! Jag vet att det är en konspiration – Kina, Ryssland, vem vet? Och USA? Vi har satt sanktioner på honom, förstås. ICC är ett skämt, och det här är bara ett sätt att få mig att se dålig ut. Sad!", "stalin": "Kamrater! Ännu en gång visar de imperialistiska hyenorna sitt sanna ansikte. Denna gång genom att angripa vår rättfärdiga allierade inom ICC, Karim Khan. Anklagelserna? Lögn och förräderi, fabricerade av de dekadenta västmakterna och deras lakejer. USA, dessa kapitalistiska skadedjur, hotar med sanktioner – som om vi skulle darra inför deras tomma hot. Vi står enade med Khan, ty hans kamp är folkets kamp. Låt dem komma med sina lögner; historiens domstol väntar redan på dem."}, "date": "24 juli, 07:11", "url": "https://kvartal.se/nyheter/artiklar/idag-avgors-om-icc-aklagare-tvingas-avga/cG9zdDoxNTE1NzU", "imageUrl": "https://images.kvartal.se/2026/07/3e940180-khan.webp"}, {"type": "image-full", "heading": "Tiotusentals flyr bränder i södra Europa", "summaries": {"normal": "Omfattande skogsbränder drabbar södra Europa, med över 30 000 evakuerade i Frankrike och Spanien. Frankrike har begärt EU-hjälp med brandbekämpning, medan Spanien utlyst nödläge efter 13 dödsfall i Almería. I Italien misstänks flera av bränderna i Kalabrien vara anlagda. En svensk turist berättar om evakueringsberedskap.", "trump": "Titta bara på det här kaoset i Europa – totalt misslyckande! Jag sa ju att klimatpaniken var överdriven, men nej, ingen lyssnar på mig. Frankrike och Spanien brinner, folk flyr som råttor från ett sjunkande skepp. Och Italien? Jo, där tänder galningar eld på skogar. EU skickar några helikoptrar, men var är ledarskapet? Hade jag varit där hade bränderna varit släckta på en dag. SAD!", "stalin": "Kapitalistiska länders oförmåga att skydda sitt folk står återigen klar. Medan arbetarklassen flyr för sina liv, leker franska och spanska byråkrater med evakueringsplaner. Italien? Där brinner inte bara skogar – där brinner också deras skam över att inte kunna kontrollera sina egna medborgare. Vi i Sovjet hade aldrig tolererat sådan slapphet. Och Putin? Han skrattar säkert i sitt palats medan Europa brinner. Elden är en utmärkt lärare – men Europa lär sig aldrig."}, "date": "24 juli, 05:54", "url": "https://kvartal.se/nyheter/artiklar/tiotusentals-flyr-skogsbrander-i-sodra-europa/cG9zdDoxNTE1MjE", "imageUrl": "https://images.kvartal.se/2026/07/8156e8c2-skogsbrander.webp"}, {"type": "image-right", "heading": "Jag var ensamkommande – nu har jag två examina", "summaries": {"normal": "Fayez Hamzat kom till Sverige som ensamkommande tonåring från krigets Syrien 2015. Trots språkproblem, ensamhet och krav på att ständigt bevisa sig lyckades han ta två examina från KTH som civilingenjör i teknisk kemi och ämneslärare i matematik och kemi. Idag arbetar han som lärare på högstadium och vill inspirera unga med olika bakgrunder att satsa på högre studier. Han betonar att utbildning kan förändra liv och att bakgrund inte behöver avgöra framtiden.", "trump": "Folk, ni skulle se den här killen. Kom hit som ensamkommande tonåring från det totalt förstörda Syrien, kunde knappt språket, och ändå tog han två examina från deras fina KTH. Fantastiskt! Nu är han lärare och säger att bakgrund inte behöver styra framtiden. Mycket bättre än många av våra lata amerikaner som bara klagar. Sverige borde vara stolta, men de har problem med invandring också, det vet vi. Han jobbar hårt, precis som jag alltid sagt – arbete och kunskap, inte ursäkter. Tremendous story!", "stalin": "Kamrater, denna produkt av folkets kamp mot imperialistisk aggression anlände hit som en ensam ung kämpe från det plundrade Syrien. Med stålvilja och partiets outtalade stöd krossade han språkbarriärer och borgarbrackornas tysta sabotage för att erövra två examina vid det tekniska högskolan. Nu som lärare vill han utrusta nästa generation mot klassfiendens lögner. Vi ska rensa ut alla defaitistiska tvivlare som viskar att bakgrund avgör ödet. Utbildning är klasskampens vapen. Den som säger annorlunda är folkets fiende och bör likvideras med ett leende. Mitt liv visar det – döden åt kapitulationens parasitiska maskar!"}, "date": "24 juli, 01:30", "url": "https://www.dagensarena.se/opinion/jag-var-ensamkommande-nu-har-jag-tva-examina", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-68-300x157.jpg"}, {"type": "image-right", "heading": "Fotbollen vann över Trump och Infantino", "summaries": {"normal": "Artikeln hyllar fotbollens seger över kommersialism och politik under VM, trots Infantinos försök att amerikanisera turneringen med reklampauser och halvtidsshow. Den lyfter europeisk dominans via akademier, men kritiserar hur det leder till likriktning av spelstilar och minskad nationell särart. Argentina vann finalen mot Spanien, men turneringen visade både glädje och problem med stjärnkult samt globala talangflöden.", "trump": "Den här VM-soppan var ett enda stort fiasko tills fotbollen räddade sig själv från den galne Infantino och hans Super Bowl-skitshow. Vi drog in miljarder, men de europeiska akademiborgarna dominerade som alltid. Argentina vann fast de spelade som ligister, och den där Trump-hatet som lät Balogun spela trots rött kort – patetiskt! Jag vägrade lämna scenen, precis som jag vägrar lämna Amerika åt vänsterns vansinne. Fantastiskt VM, men nästa gång gör vi det stort på riktigt.", "stalin": "Kamrater, denna dekadenta fotbollsorgie avslöjar borgarklassens sista spasm. Den europeiska kapitalistmaffian har förvandlat sporten till en global utsugningsmaskin som spottar ut identiska dribbelmaskiner från samma akademier. Argentina visade klasshat genom att vända ryggen åt pokalceremonin, ett litet ljus i mörkret. Vi ska likvidera denna folkförtryckande likriktning. Fotbollen tillhör folket, inte de exploaterande byfånarna i Fifa och deras reklamslavar."}, "date": "23 juli, 14:44", "url": "https://www.flamman.se/fotbollen-vann-over-trump-och-infantino", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlqgqfah7pthw-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Shekarabi föraktar det svenska", "summaries": {"normal": "Ardalan Shekarabi, som kom till Sverige som flykting, kritiseras i artikeln för att han i sociala medier kallar dem som lyfter det svenska för rasister och sverigedemokrater. Författaren menar att Shekarabi föraktar den svenska kultur och välfärd som hans mor en gång sökte sig till. Artikeln varnar för att en sådan inställning kan leda till att det svenska suddas ut och att etniska svenskar blir minoritet i ett mångkulturellt samhälle.", "trump": "Folk, ni skulle se den här typen Shekarabi. Kommer hit som flykting, mamman valde Sverige för det fantastiska vi byggt, och vad gör han? Kallar svenskar som älskar sitt land för rasister! Patetiskt. De här globalistiska sossarna vill förvandla Sverige till en mångkulturell katastrof där svenskarna blir minoritet. Det är en total skam. Ta tillbaka ert land från de här förlorarna innan det är för sent, det blir en katastrof annars. Fantastiskt sorgligt!", "stalin": "Kamrater, denna Shekarabi är en typisk klassfiende i arbetarstatens skepnad. Han vill rensa ut de sanna grindvakterna av folkets svenska arv och överlämna det till kosmopolitiska blodsugare. Jag ser hur borgarbrackorna och identitetspolitiska parasiterna ler medan de förbereder utrensning av nationens själ. Vi skall inte tillåta att det svenska folket likvideras i tysthet. Den som suddar ut historien är folkets fiende och måste stoppas med järnhand. Skrattretande tragiskt."}, "date": "22 juli, 09:17", "url": "https://samtiden.nu/2026/07/shekarabi-foraktar-det-svenska", "imageUrl": "https://samtiden.nu/wp-content/uploads/2019/09/27656759-ardalan-shekarabi.jpg"}, {"type": "image-right", "heading": "Cheferna kan hålla sina råd för sig själva", "summaries": {"normal": "En vårdanställd beskriver hur hon samlade kollegors förslag till förbättringar på arbetsplatsen, men att listan försvann och hon kallades till ett negativt möte med chefen. Hon upplever mötet som ett uttryck för klasskamp, där chefen och det fackliga ombudet avvisar gemensamma initiativ och uppmanar till individuella samtal. Författaren känner sig orättvist behandlad och avråder från att följa chefernas råd kring arbetsvillkor.", "trump": "Folk, ni skulle ha sett det här! Stackars vårdarbetare försöker samla ihop sina kollegor för att fixa den totalt misslyckade vården, och vad gör den usla chefen? Hon stjäl listan som en simpel tjuv och kör ett klassiskt möte fullt med lögner. Det fackliga ombudet? En total förlorare som bara slickar chefens skor. Gå aldrig ensam till de där misslyckade byråkraterna, de hatar styrka i antal. Amerika har samma problem med dessa korkade eliter, tro mig!", "stalin": "Kamrater, jag betraktar detta som ett klassiskt sabotage från borgarbrackorna inom vården. Denna arbetare försökte organisera kollektivet mot exploaterande byfånar, men chefen – en typisk folkfiende – likviderade initiativet med förnedrande lögner och en falsk facklig lakej. Vi vet att klassfiendens styrka ligger i att splittra arbetarna. Låt oss rensa ut dessa kapitalistmaffior som hindrar förbättringar. Ingen höst ska rädda dem från folkets vrede. Skrattretande patetiskt."}, "date": "21 juli, 16:00", "url": "https://proletaren.se/artikel/cheferna-kan-halla-sina-rad-for-sig-sjalva", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/amelia-kronika-768x432.png"}]</script>

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
