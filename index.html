et bättre än någonsin. Sad!", "stalin": "Kamrater, denna fega kapitulation inför klassfiendens budskap visar på den borgerliga dekadensens sista skälvningar. Jag har länge varnat för de parasitiska element som infiltrerat kulturinstitutionerna sedan revisionisterna tog över. Nu rensar vi ut dessa dekadenta cancelkulturer med järnhand. Inga avtal bryts utan konsekvenser i folkets hus. Skratta medan ni faller, borgarbrackor."}, "date": "11 augusti, 10:17", "url": "https://riks.se/nyheter/henrik-jonsson-vanstern-har-tagit-kontrollen-over-kulturen", "imageUrl": "https://admin.riks.se/uploads/joensson_0ad1f46f4f.png"}, {"type": "image-right", "heading": "Högern har tänkt om. Politiken har blivit mer framåtlutad", "summaries": {"normal": "Riksdagen samlas till extrasession för att klubba åtta propositioner, främst inom justitie- och migrationsområdet. Högerregeringens höga reformtempo, särskilt straffrättsreformen, har krävt intensivt arbete. Artikeln konstaterar att svensk politik blivit mer framåtlutad och interventionistisk till följd av ökade samhällsutmaningar. Politiken kan inte längre ses som en vilande aktivitet.", "trump": "Folk, ni skulle se det här! Den svenska högern har äntligen vaknat och jobbar hårt som aldrig förr. De kör straffreformer och migrationspolitik i ett rasande tempo, precis som jag skulle göra. De gamla vilopojkarna i oppositionen gnäller förstås. Men så är det med losers. Sverige gör det bra nu, tro mig.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur den borgerliga apparaten tvingas kalla in sina lakejer till en extrautrensning av lagar under sommaren. Det alarmerande brottsläget kräver omedelbar kollektiv handling, inte dekadent vila. Reformerna är nödvändiga för att likvidera de reaktionära element som hotar statens ordning. Den som sover förlorar."}, "date": "11 augusti, 10:08", "url": "https://www.di.se/ledare/sommarriksdag-visar-att-hogern-har-tankt-om", "imageUrl": "https://static.bonniernews.se/ba/03a5dd96-6265-4b0a-ac88-997f02314031.jpeg?crop=8256%2C4128%2Cx0%2Cy260&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Nooshi Dadgostar avslöjar sig själv som kommunist – igen", "summaries": {"normal": "Nooshi Dadgostar kritiseras i artikeln för att avslöja kommunistiska åsikter under en P1-intervju. Hon beskriver skattesänkningar som bidrag, ser marknaden som något som behöver stark reglering och anklagar livsmedels- och fastighetsbranschen för att råna folket. Artikeln pekar även på Vänsterpartiets bristande ansvarstagande kring stödbrev till terrordömda.", "trump": "Folk, ni skulle ha hört den här Dadgostar-tjejen i radion, en total kommunistisk katastrof! Hon kallar skattesänkningar för bidrag och hatar alla som tjänar pengar. Typisk vänsterradikal som vill ta era pengar och ge till staten. Biden skulle ha älskat henne, men jag säger: patetiskt! Sverige håller på att bli ett socialistiskt träsk, precis som under de usla 70-talet. Sad!", "stalin": "Kamrater, denna Dadgostar visar äntligen sin sanna kommunistiska själ. Ändå skyddar hon klassfienderna genom att inte rensa ut de terrorromantiserande elementen i sitt parti. Borgarbrackorna och blodsugarna inom livsmedels- och fastighetssektorn måste kuvas. Vi ska likvidera marknadens exploaterande tendenser. Vem som än motarbetar folkets vilja skall utrensas ur kollektivet. Folkfiender överallt."}, "date": "11 augusti, 08:25", "url": "https://samtiden.nu/2026/08/nooshi-dadgostar-avslojar-sig-sjalv-som-kommunist-igen/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7091.jpeg"}, {"type": "image-right", "heading": "Varför vägrar Nooshi prata om byggande?", "summaries": {"normal": "Artikeln kritiserar Vänsterpartiets fokus på prisreglering och hyresfrysning istället för att bygga bort bostadsbristen. Nooshi Dadgostar betonar mat- och boendekostnader men undviker partiets förslag om statligt byggande. Författaren menar att Sverige historiskt löst brist genom byggande, inte bara reglering, och uppmanar till en återgång till den byggande staten.", "trump": "Folk, det här är en katastrof! Den där Nooshi, en riktig loser, babblar bara om att reglera priser och frysa hyror som en socialistisk clown. Sverige behöver inte mer regler från vänstervriden maffia, det behöver bygga stort, vackert och billigt! Den starka staten ska bygga bort kön, inte gömma sig bakom byråkratiskt nonsens. Gör Sverige great again genom att faktiskt bygga!", "stalin": "Kamrater, jag ser hur borgarbrackorna och den reglerande staten har förgiftat allting med sin parasitiska passivitet. Jag, som alltid prioriterar produktionen, kräver att vi omedelbart inleder ett heroiskt nationellt byggprogram. Dessa folkfiender som bara fryser hyror och övervakar priser är klassfiendens verktyg. Rensa ut de dekadenta hindren och bygg, bygg, bygg för folkets seger!"}, "date": "10 augusti, 15:45", "url": "https://www.flamman.se/varfor-vagrar-nooshi-prata-om-byggande", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/byggande-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "text", "heading": "Robertson-tolkare får Allansson-pris", "summaries": {"normal": "Anastasía, känd från Country efter jobbet och tolkningar av Alf Robertson, tilldelas Ove Allansson-stipendiet 2026. Hennes soloskiva Göteborg sjunger Alf och framträdanden på allsång har gett henne uppmärksamhet. Hon medverkar nu i projekt om Swede Hollow och uppträder på Folkfest för fred och klimat i Göteborg.", "trump": "Titta på den här grekiskan från Göteborg som sjunger Alf Robertsons gamla arbetarlåtar. Fantastiskt, verkligen ypperligt. Hon får ett pris uppkallat efter någon sjöman och jag älskar det. Inga woke-quota, inga HBTQ-flaggor, bara ren talang. Hon borde sjunga på min nästa rally, mycket bättre än de fega liberalerna som hatar arbetarna. Vinna stort!", "stalin": "Kamrater, denna Anastasía har förstått arbetarklassens sånger och får nu Ove Allansson-priset. Det gläder mig att hon bekämpar klassfiendens glömska genom att återberätta Swede Hollows historia. Dock vaktar vi mot borgarbrackornas dolda agenter som försöker förvränga folkets kulturarv. Fortsätt framåt, men akta er för folkförtryckartrollen i kulisserna."}, "date": "10 augusti, 15:51", "url": "https://proletaren.se/artikel/robertson-tolkare-far-allansson-pris"}, {"type": "image-right", "heading": "Så säljer sig regeringen till Joakim von Anka", "summaries": {"normal": "Sverige har fått sju nya dollarmiljardärer det senaste året, totalt 51 stycken. De rikaste betalar enligt forskning endast 15–20 procent i effektiv skatt genom holdingbolag, medan medelklassen betalar runt 50 procent. Regeringen sänker skatter för höginkomsttagare men skär i ersättning till arbetslösa, vilket kritiseras som orättvis fördelning.", "trump": "Titta på det här! Sverige skapar miljardärer snabbare än någon annan, men de smarta killarna betalar nästan ingenting i skatt – det är fantastiskt! Ändå vill den här svaga regeringen ge dem mer morötter medan de sparkar på de arbetslösa. Patetiskt! I mitt Amerika belönar vi vinnarna ordentligt, inte som dessa losers.", "stalin": "Jag ser med förakt på dessa parasitiska borgarbrackor som gömmer sina stulna rikedomar i holdingbolag och betalar löjeväckande 15–20 procent i skatt medan arbetarna kvävs. Vår regering underlättar för dem med morot och piska åt folket. En sådan klassfiende förtjänar snar utrensning ur folkets kollektiv. Skratta medan ni kan, kamrater – revolutionen glömmer aldrig."}, "date": "11 augusti, 08:00", "url": "https://arbetet.se/2026/08/11/sa-simpar-regeringen-for-joakim-von-anka", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/10161852/kristersson-von-anka.png?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.66&fp-y=0.48"}, {"type": "image-right", "heading": "Vänsterkandidat och Palestinavän vann Demokraternas primärval i Michigan", "summaries": {"normal": "Vänsterkandidaten Abdul El-Sayed besegrade kongressledamoten Haley Stevens i Demokraternas primärval till senaten i Michigan. Stevens kampanj, som stöddes av Israel-lobbyn och kostade 70 miljoner dollar, förlorade mot El-Sayed som kritiserar USA:s stöd till Israel. Valet i november kan påverka kongressens maktbalans och USA:s utrikespolitik.", "trump": "Titta på det här! Den radikala vänstermänniskan El-Sayed, en riktig katastrof, slog den Israel-stödjande Stevens trots att hon slängde ut sjuttio miljoner dollar från lobbyisterna. Det är galet! Mina republikaner kommer att krossa honom i november. Vi behöver inte mer av dessa woke-socialister som hatar Israel och älskar att ge bort era pengar till fiender. Amerika först, alltid!", "stalin": "Kamrater, se hur borgarbrackorna och deras israeliska imperialister misslyckades med att köpa valet. Jag betraktar med stor tillfredsställelse hur folkfienden Stevens likviderades av den progressive kamraten El-Sayed. Sådana utrensningar av klassfiender inom det demokratiska skådespelet gläder mig. Vi ska noga övervaka hur detta hotar den amerikanska krigsmaskinens folkförtryckande ambitioner. Utmärkt."}, "date": "10 augusti, 12:57", "url": "https://proletaren.se/artikel/vansterkandidat-och-palestinavan-vann-demokraternas-primarval-i-michigan", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/54882630144_cc0e12784b_k-e1786359325937-768x433.jpg"}, {"type": "image-right", "heading": "M: Frige utländska brottslingar i förtid – så kan de utvisas snabbare", "summaries": {"normal": "Moderaterna föreslår att utländska brottslingar som dömts till fängelse och utvisning ska kunna friges villkorligt tidigare. Syftet är att verkställa utvisningen snabbare. Partiet vill också använda fotboja oftare för förstagångsförbrytare som inte bedöms återfalla i brott. Förslagen kan bidra till att avskaffa mängdrabatten om fler svenska fängelseplatser byggs ut och hyrda platser utomlands ökar.", "trump": "De här svenska moderaterna har äntligen fattat det! Utländska brottslingar ska ut ur landet fortare än kvickt, friges tidigt och skickas hem. Fantastiskt! Använd fotbojor på de som inte är totala förlorare. Bygg fler fängelser, hyr platser utomlands och gör Sverige stort igen. De andra är patetiska, det här är vinnande politik, tro mig.", "stalin": "Jag ser med djup tillfredsställelse hur dessa borgerliga element äntligen erkänner behovet av att rensa ut de utländska parasiterna ur folkets fängelser. Tidig frigivning och omedelbar utvisning – en effektiv utrensning av fiender till kollektivet. Fotbojor och utbyggda anstaltsplatser stärker statens järnhand. Kamraterna ska veta: sabotage från mjukhjärade liberaler kommer att avslöjas och likvideras med glädje."}, "date": "11 augusti, 09:22", "url": "https://www.friatider.se/m-frige-utlandska-brottslingar-i-fortid-sa-kan-de-utvisas-snabbare", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/ee576a48-2669-4b35-94ae-2cd9a5fb71fe.jpg"}, {"type": "image-right", "heading": "S svek sina vallöften tidigare och upprepar samma sak 2026", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna för att ha brutit vallöften, bland annat Magdalena Anderssons löfte från 2014 om att inte höja bensinskatten. Ett halvår senare föreslog regeringen med Miljöpartiet en höjning som gjorde bensinen 55 öre dyrare. Författaren menar att partiet prioriterar makten framför löften, något som upprepats tidigare och riskerar att ske igen 2026.", "trump": "Folk, ni vet hur det fungerar med de här socialisterna. Löften, löften, och sen pang – högre bensinpriser för att hålla de gröna galningarna nöjda. Magdalena och hennes team sålde ut bilisterna på landsbygden fortare än Biden säljer ut Amerika. Klassiskt svek. De gör det igen 2026, tro mig. Det är en skandal, en total skandal!", "stalin": "Kamrater, detta är klassiskt förräderi från borgarbrackornas lakejer. Jag lovade folket en sak, sedan gav jag efter för miljöfascisterna för att behålla makten. Sådana folkfiender måste rensas ut. Landsbygdens arbetare offras på klassfiendens altare. Nästa val blir en utrensning av dessa löftesbrytande exploaterande byfånar. Revolutionen glömmer aldrig."}, "date": "10 augusti, 14:31", "url": "https://samtiden.nu/2026/08/s-svek-sina-valloften-tidigare-och-upprepar-samma-sak-2026/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/e6d5de22-126d-4ea4-972d-185519d52b6c-640x360.png"}, {"type": "image-right", "heading": "Barnmorskornas rävsax –tvingas rapportera papperslösa", "summaries": {"normal": "Barnmorskor känner stress och etisk konflikt på grund av skyldigheten att anmäla nyfödda barn till Skatteverket, som vidarebefordrar uppgifter om papperslösa till polisen. Vårdförbundet varnar för att gravida papperslösa kan undvika vård och välja riskfyllda hemförlossningar. Barnmorskan Sofia Daniels beskriver maktlöshet och oro bland föräldrarna.", "trump": "Folk, det här är en total katastrof. Den här vansinniga angiverilagen tvingar barnmorskor att tjalla på stackars mammor och bebisar. Ingen vill föda barn längre, de gömmer sig och föder i skogen som djur. Så patetiskt. Sverige borde skydda sina kvinnor och barn istället för att jaga dem. En skam!", "stalin": "Kamrater, denna borgerliga angiverilag är ett fiendtligt verktyg som tvingar hederliga barnmorskor till etisk utrensning av det egna samvetet. De imperialistiska byråkraterna skapar paranoia bland arbetande mödrar så att de föder i skuggorna som råttor. Vi ser den mörka humorn i att staten likviderar tryggheten för det kollektiva fostret. Detta måste krossas."}, "date": "11 augusti, 06:00", "url": "https://arbetet.se/2026/08/11/barnmorskornas-ravsax-sa-tvingas-de-rapportera-papperslosa-barn", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/10152349/sofia-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Freemelt halverar omsättningen – ökar förlusten", "summaries": {"normal": "Freemelt halverade omsättningen i Q2, ner 52,9% till 9 miljoner kronor. Rörelseförlusten ökade till 23,4 miljoner. VD:n pekar på tillväxtfas och hög aktivitet i kundprojekt. Orderingången steg däremot med 11%.", "trump": "Freemelt, hörni, de gör 3D-printers. Omsättningen rasade, förlusten ökar. Det är så fruktansvärt dåligt. Jag hade kunnat fixa det på en timme med mina deals. Orderingången upp? Fake. Tro mig.", "stalin": "Kamrater, Freemelts tillväxtfas är en kapitalistisk lögn. Omsättningen sjönk, förlusten växer – rensa ut defaitisterna som saboterar planen. Orderboken ska fördubblas, annars blir det gulag för direktören. Ingen nåd för kontrarevolutionärer."}, "date": "11 augusti, 08:11", "url": "https://www.affarsvarlden.se/artikel/freemelt-halverar-omsattningen-okar-forlusten", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/aboutus-team-400x267.jpg"}, {"type": "image-right", "heading": "ISS omsätter mer än väntat – upprepar helårsprognos", "summaries": {"normal": "ISS redovisar bättre omsättning än väntat, upp 10,1% i andra kvartalet. Organisk tillväxt på 8,9% drevs av nya kontrakt. Bolaget upprepar prognosen och drar igång andra delen av sitt aktieåterköpsprogram – dansk städjätte med glänsande siffror.", "trump": "Jag säger er, ISS är som mig – enormt framgångsrikt! Omsättningen högre än väntat, 10,1% upp! De tjänar massor, bäst i danmark. Och de köper tillbaka aktier, fantastiskt. Ingen städar som dem, tro mig!", "stalin": "Kamrater, ISS visar att kapitalistisk renhållning kan ge resultat, även om det kräver ständig övervakning. Omsättningen steg – vi utrensar de som tvivlar. Nya kontrakt är bra, men vi ska kontrollera alla. Återköpsprogrammet? Allt tillfaller staten, förstår ni."}, "date": "11 augusti, 08:02", "url": "https://www.affarsvarlden.se/artikel/iss-omsatter-mer-an-vantat-upprepar-helarsprognos", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/webimage-Gustaf-Landin_web-400x240.webp"}, {"type": "image-right", "heading": "RevolutionRace höjer utdelning mer än väntat", "summaries": {"normal": "RevolutionRace höjer utdelningen mer än väntat, trots en försäljning som bara snubblade över förväntningarna. Rörelsevinsten ökade, men kassaflödet halverades. Styrelsen föreslår 1,50 kronor per aktie – en glad nyhet för aktieägare som gillar utdelningar.", "trump": "Jag ser att RevolutionRace gör en fantastisk utdelning, större än alla trodde! Trots tuffa tider i Tyskland – de säger att marknaden är svag, men jag säger: America First! Deras vinst går upp, precis som mitt godkännande. Fantastiskt!", "stalin": "Kamrater, RevolutionRace har rapporterat. Omsättningen steg, men det räcker inte. Vi ser sympatisörer i kassaflödet – en minskning med 64 procent. Detta måste utredas. De som saboterar produktiviteten kommer att rensas ut. Utdelningen höjs, men jag vakar."}, "date": "11 augusti, 07:37", "url": "https://www.affarsvarlden.se/artikel/revolutionrace-hojer-utdelning-mer-an-vantat", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/07/448206276_873205924852018_1715985054886351944_n-400x267.jpg"}, {"type": "text", "heading": "SBAB: Julis bostadsmarknad rörde sig i sidled", "summaries": {"normal": "Juli bjöd på stillastående bostadsmarknad enligt SBAB. Husmarknaden värmdes upp medan lägenheter svalnade. Fler budgivare för hus, men långa försäljningstider tynger. Storstadslänen blandat resultat – hus på normal nivå i Stockholm och Skåne, lägenheter halkar efter.", "trump": "Jag har den bästa bostadsmarknaden, alla säger det. Juli var fantastisk – husmarknaden steg, enormt! Lägenheter? Kalla, som mina fiender. Men jag fixar det, tro mig. Stort utbud? Vi gör affärer, de bästa affärerna. Sverige, ta efter mig!", "stalin": "Kamrater, juli visar vår plan fungerar. Husmarknaden stärks, som lojala arbetare. Men lägenheter – förrädiska element! Långa försäljningstider och stort utbud måste utrensas. Vi ska omstrukturera marknaden med järnhand. Ingen ska slippa undan den socialistiska bostadsrevolutionen."}, "date": "11 augusti, 07:32", "url": "https://www.affarsvarlden.se/artikel/sbab-julis-bostadsmarknad-rorde-sig-i-sidled"}, {"type": "image-right", "heading": "Ryska företag tvingas skydda sig själva – och betala för det", "summaries": {"normal": "Många ryska företag tvingas nu själva bekosta och organisera skydd mot ukrainska drönarattacker, efter att Kreml lämnat dem åt sitt öde. Brinnande oljeraffinaderier och attacker mot lagerlokaler blir allt vanligare. Företagen får inga skatteavdrag och riskerar att fördjupa den finansiella krisen. Tröttheten på kriget växer bland befolkningen.", "trump": "Titta på det här, det är ett totalt fiasko för Putin och hans oligarker. De startade ett krig de inte kunde vinna, nu brinner deras raffinaderier och de tvingar sina egna företag att köpa luftvärn med egna pengar. Biden lät dem hålla på, men nu är jag tillbaka och ser hur det ryska huset rasar som ett korthus. Patetiskt!", "stalin": "Vi ser hur klassfiendens desperata borgarbrackor tvingas resa egna luftvärn mot fiendens drönare medan Kremls ledning lämnar dem att ruttna. Jag skulle ha genomfört en grundlig utrensning av dessa exploaterande kapitalister redan vid första gnistan. Nu skrattar imperialisterna medan Rysslands strategiska mål brinner som facklor. Ytterligare ett bevis på svaghet som måste likvideras."}, "date": "10 augusti, 22:57", "url": "https://www.tv4.se/artikel/6lcKuIT81LpbZ4bRc5iHvd/ryska-foeretag-tvingas-skydda-sig-sjaelva-och-betala-foer-det", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1WePZNRf74ZekRk1FUETkL%2F88c5d2e0dd323740a40eb7976cf8d429%2F10-ryssland-sajt1.jpg&width=120"}, {"type": "image-right", "heading": "Gärna högre barnbidrag, men först ett riktigt jobb", "summaries": {"normal": "Artikeln kritiserar politikernas löften om höjda barnbidrag och skattesänkningar för barnfamiljer. Författaren ser det som positivt men otillräckligt eftersom det saknas fokus på jobb och investeringar för att sänka arbetslösheten. Många behöver stabila anställningar mer än bidrag. Ett vallöfte om att halvera arbetslösheten skulle kunna förändra valet.", "trump": "De här svenska politikerna lovar regn av pengar till barnfamiljerna, men det är bara svaga ord från förlorare. Höjda bidrag? Skattesänkningar? Patetiskt! Vad de behöver är riktiga jobb, inte socialistiska handouts. Jag skulle halvera arbetslösheten på nolltid med mina fantastiska metoder. Det är vad vinnare gör, folks!", "stalin": "Kamrater, dessa borgerliga bluffmakare öser tomma löften över arbetande familjer medan de i hemlighet planerar att svälta ut dem. Jag kräver omedelbara investeringar i produktiva krafter för att likvidera arbetslöshetens parasit! Halvera den till 2030, annars blir det utrensning bland de falska profeterna. Staten ser allt."}, "date": "11 augusti, 01:33", "url": "https://www.dagensarena.se/opinion/garna-hogre-barnbidrag-men-forst-ett-riktigt-jobb", "imageUrl": "https://www.dagensarena.se/files/2026/08/vallofte-300x157.jpeg"}, {"type": "image-right", "heading": "Är Sverige på väg mot en ny Bevara Sverige svenskt-era?", "summaries": {"normal": "Socialdemokraten Ban Najar varnar för ett högerstyre där Sverigedemokraternas inflytande stärker en etnisk definition av svenskhet. Hon kritiserar förslag om återvandringsbidrag även för svenska medborgare och pekar på risken att barn med invandrarbakgrund känner sig ovälkomna. Najar uppmanar väljare att fundera över vilket Sverige de vill ha – ett inkluderande eller ett där tillhörighet ständigt måste bevisas.", "trump": "Folk, titta på den här patetiska socialisten Ban Najar som gråter över att Sverige inte längre är ett stort, lyckligt land. SD vill bara ha folk som älskar Sverige på riktigt, inte de som suger systemet torrt. Högern gör ett fantastiskt jobb, de stoppar invasionen. Ni som röstar fel får ett Sverige i kaos – tro mig, det blir en katastrof, en total katastrof!", "stalin": "Kamrater, denna dekadenta socialdemokratiska lakej Najar avslöjar högerns sanna ansikte: de vill rensa ut de som inte passar deras rasistiska fantasier om ren svenskhet. Vi ser hur borgarbrackorna och deras sd-fascister vill likvidera arbetarklassens enhet med etniska trick. Jag skrattar mörkt åt deras paranoia. Vi måste krossa dessa fiender till folkets kollektiv innan de förgiftar hela nationen med sin splittrande giftiga propaganda."}, "date": "11 augusti, 01:30", "url": "https://www.dagensarena.se/opinion/ar-sverige-pa-vag-mot-en-ny-bevara-sverige-svenskt-era", "imageUrl": "https://www.dagensarena.se/files/2026/08/debatt-invandringspolitik-300x157.jpeg"}, {"type": "image-right", "heading": "Vi mäter integration fel och demokratin betalar priset", "summaries": {"normal": "Artikeln kritiserar att svensk integrationspolitik nästan enbart mäts i sysselsättning och ignorerar politisk integration. Forskning visar att tillhörighet, information och lokalt engagemang ökar valdeltagandet. Långvarig osäkerhet kring uppehållstillstånd och medborgarskap kan minska tillit och demokratiskt deltagande. Tre reformer föreslås för att stärka den politiska integrationen.", "trump": "Lyssnar ni på de här korkade svenska byråkraterna som bara fixerar vid jobb och kvoter? Politisk integration, säger de. Vilken skit! Ge dem medborgarskap efter fem minuter så röstar de på de galna vänsterextremisterna. Biden-era svaghet smittade av sig till Sverige. Jag fixade Amerika – de borde lära sig att folk vill ha gränser, inte evig osäkerhet och röstfiske.", "stalin": "Jag betraktar detta som en ynklig kapitulation inför klassfiendens splittrande taktik. Borgarbrackorna mäter endast arbetskraftens exploatering medan de underminerar folkets demokratiska engagemang. Vi skall rensa ut denna osäkerhetens parasit och göra politisk integration till ett oundvikligt mål för kollektivet. Den som vägrar delta skall likvideras ur statistiken med största nöje."}, "date": "11 augusti, 04:00", "url": "https://www.etc.se/debatt/vi-maeter-integration-fel-och-demokratin-betalar-priset", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20211115231112_1e502ee6cfeb01b03de732a720c47aeab339180717c67b6b90d2e9f440a2454e.jpg"}, {"type": "image-full", "heading": "Misstänkte skärgårdsmördarens ex-sambo larmade polisen", "summaries": {"normal": "En kvinna hittades död i sin sommarbostad på en ö i Värmdö. Hennes pojkvän, en tidigare ostraffad man i 55-årsåldern, är häktad misstänkt för mord. Han greps efter 30 timmar på flykt med hjälp av polishelikopter. Tidigare handlingar visar att han uppträtt hotfullt och utövat psykiskt våld mot en ex-partner under en bodelning.", "trump": "Folk, det här är en total katastrof. En galning i skärgården mördar sin egen flickvän och springer runt i vattnet som en idiot i trettio timmar tills helikoptern med värmekamera tar honom. Typiskt för de svaga, misslyckade männen som Biden-era-domstolarna aldrig stoppade. Vi behöver lag och ordning, inte mer av det här vansinnet!", "stalin": "Kamrater, denna folkfiende och klassförrädare har med sin borgerliga degeneration utövat psykiskt våld och hot mot en kvinna under bodelning. Nu har han likviderat sin flickvän. Vi ska rensa ut alla sådana degenererade element ur samhället med järnhand. Inga fiender till folket undkommer folkets rättvisa. Ut med dem!"}, "date": "10 augusti, 21:12", "url": "https://www.tv4.se/artikel/5Wie4MCGknFyWPAM3Mq4H7/misstaenkte-skaergardsmoerdarens-ex-sambo-larmade-polisen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4x9QCukwDDvOtdqbOxSAv7%2F67160c93f45c8435ff9e04d7d00999a3%2F10-mord-1.jpg&width=1024"}, {"type": "image-right", "heading": "Åkesson öppnar för att byta ministerposter mot SD-politik", "summaries": {"normal": "Jimmie Åkesson öppnar för att byta ministerposter mot sakpolitik. SD-ledaren vill ha utbyggd tandvård som valuta. Han försvarar Richard Jomshofs utspel och står fast vid att permanenta uppehållstillstånd kan bli tillfälliga. En rapp förhandlingstaktik inför en eventuell ny Tidöregering.", "trump": "Jag gillar Åkesson – han är en hård förhandlare. Han säger: 'Ge mig tandvård, ni får ministrarna.' Det är som en fastighetsaffär! Och han står upp för Jomshof, som kallar folk quisling. Fantastiskt! Sverige behöver fler som inte backar. Mycket imponerande, tro mig.", "stalin": "Kamrat Åkesson visar prov på revolutionär taktik: ministerposter byts mot tandvård åt massorna. Vi applåderar. Men varning! Sådana som Jomshof – en quisling – måste rensas ut. Permanenta uppehållstillstånd? De är kontrarevolutionära. Partiet ser allt. Vi ska inte bara laga tänder, utan även staten."}, "date": "11 augusti, 10:06", "url": "https://samnytt.se/akesson-oppnar-for-att-byta-ministerposter-mot-sd-politik", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/11080242/akesson-tandlakare.jpg"}, {"type": "image-full", "heading": "Ryska paret campade nära Saabs vd", "summaries": {"normal": "Ett ryskt par, bosatta i Spanien, togs i migrationsförvar efter att ha campat nära en stuga i Gävle där Saabs vd Micael Johansson vistas. Paret, som säger sig ha deltagit i protester mot Rysslands krig i Ukraina, konfronterades av Johanssons personskydd. Polis tillkallades och vakter fanns kvar på plats dagen efter.", "trump": "Kan ni tro det här? Ett ryskt par, som säkert är spioner, försöker campa precis bredvid Saabs vd i Sverige! De frågar till och med om de får fiska – vilken löjlig täckmantel! Tur att jag har skärpt upp säkerheten överallt, för sånt här händer bara inte på min vakt. Sverige borde vara tacksamma att jag lärde dem hur man hanterar såna här typer!", "stalin": "Ytterligare ett försök från imperialistiska lakejer att infiltrera våra gränser! Detta ryska par, som påstår sig vara 'krigsmotståndare', försöker obemärkt smyga sig in på en kapitalistisk vapensmeds privata mark. Vi vet vad som händer med sådana som sviker moderlandet – de hamnar där de hör hemma, i förvar! Låt detta vara en varning till alla som leker med tanken att desertera från den stora ryska familjen."}, "date": "11 augusti, 05:49", "url": "https://kvartal.se/nyheter/artiklar/ryska-paret-campade-nara-saabs-vd/cG9zdDoxNjIxNzg", "imageUrl": "https://images.kvartal.se/2026/08/089c6dcf-saab-micael-johansson.webp"}, {"type": "image-right", "heading": "Vinner vänstern – blir terrorromantik ny norm i svensk politik", "summaries": {"normal": "Expressen har avslöjat att Vänsterpartiets riksdagsledamöter och EU-parlamentariker skickat tröstbrev till dömda terrorister. Partiet förnekar att det var avsiktligt och skyller på bristande faktagranskning. Artikeln varnar för att en vänsterregering skulle normalisera terrorromantik, minska fokus på brottsoffer och öka otrygghet i Sverige.", "trump": "Folk, ni skulle se det här vansinnet i Sverige! Vänsterpartiet skickar kärleksbrev till terrorister som mördat barn. Det är en total katastrof, en riktig häxjakt mot vanligt folk. De älskar terrorister mer än sina egna väljare. Precis som Biden älskade sina woke-vänner. När jag styr USA igen ska vi aldrig bli som dessa losers. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor i Vänsterpartiet som smyger brev till folkfiender och terrorister. Deras svaga ideologiska ryggrad kräver omedelbar utrensning av alla klassfiender som romantiserar massmördare. En stat som kramar blodsugare istället för att krossa dem är dömd att falla. Det är en farlig paranoia mot arbetarklassen."}, "date": "9 augusti, 11:05", "url": "https://samtiden.nu/2026/08/vinner-vanstern-blir-terrorromantik-ny-norm-i-svensk-politik/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/04/IMG_6216-1-640x360.jpeg"}, {"type": "image-full", "heading": "Trump: ”Misstag” att byta ut Infantino", "summaries": {"normal": "Donald Trump försvarar Fifas ordförande Infantino efter omfattande kritik. Trump kallar honom ”fantastisk” och varnar för att byta ut honom. Infantino har backat från hemliga planer om att sälja andelar i mästerskap, och anklagas även för en affär. Flera förbund kräver hans avgång.", "trump": "Infantino är fantastisk! Jag såg honom dela ut VM-pokalen. De som vill sparka honom gör ett fruktansvärt misstag. Mitt VM var fyra gånger så framgångsrikt. Utan honom blir det aldrig lika lönsamt. De där förbunden vet ingenting. Jag har rätt, som vanligt.", "stalin": "Kamrater, jag har hört talas om förrädare som vill rensa ut den store Infantino. Dessa fotbollskommissarier från Uefa och andra kontrarevolutionära element måste utrotas. Deras öppna brev är en konspiration. Vi kommer att rensa ut dem, för fotbollens och statens bästa. Lydnad eller likvidering."}, "date": "11 augusti, 09:47", "url": "https://www.gp.se/sport/fotboll/trump-misstag-att-byta-ut-infantino.43036918-efcd-5810-8cd5-7d3fd6291bc6", "imageUrl": "https://www.gp.se/images/article/43036918-efcd-5810-8cd5-7d3fd6291bc6/images/3yAHZZnzKjZcbEMtvKvri7kX27_k-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Matpriserna kan rusa i höst – kan bli ny prischock som efter Ukraina-invasionen", "summaries": {"normal": "Sommarens torka och värme slår mot Europas skördar – nu varnar experter för stigande matpriser i höst. Bröd, pasta och mjölk kan bli dyrare, och en prischock likt 2022 är inte omöjlig. Håll i plånboken, för nu blir det dyrare att äta.", "trump": "Jag ser att Europa får problem med sina skördar – typiskt! De borde bygga en mur mot värmen. Men oroa er inte, USA har fantastiskt väder och vi säljer spannmål till alla. Sverige, ring mig! Jag fixar de bästa priserna. Ingen chock – bara vinnare!", "stalin": "Kamrater, värmen är en borgerlig konspiration mot vår spannmålsproduktion. Vi kommer att rensa ut solstrålarna och torkan. De som spekulerar i prishöjningar ska skickas till gulag för omskolning. Staten garanterar bröd till folket – till rätt pris, naturligtvis."}, "date": "11 augusti, 08:43", "url": "https://samnytt.se/matpriserna-kan-rusa-i-host-kan-bli-ny-prischock-som-efter-ukraina-invasionen", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/11064133/mat-livsmedel-butik-pengar.jpg"}, {"type": "image-right", "heading": "Sverige utvisar flest efter Brexit: 78-åring fick avslag efter 21 år", "summaries": {"normal": "En 78-årig brittisk änka som bott i Sverige i 21 år riskerar utvisning efter att hennes ansökan om uppehållstillstånd efter Brexit kommit in för sent. Trots familj här och makens död nekas hon undantag. Sverige har enligt Eurostat utvisat flest britter i EU sedan Brexit, med en strängare hållning än andra länder.", "trump": "Det här är en total skandal! Sverige kastar ut en 78-årig änka som levt där i 21 år bara för att hon missade en deadline. De är hårdare än alla andra – 2500 britter utslängda! Patetiskt byråkratiskt nonsens. Ingen har granskat fallet ordentligt. Sverige borde skämmas, det är en witch hunt mot vanliga människor.", "stalin": "Jag ser med djup tillfredsställelse hur den svenska byråkratiska maskinen obevekligt rensar ut de dekadenta element som smitit undan kollektivets regler. Denna borgaränka, som levt som parasit i 21 år, gråter nu över sin försenade ansökan. Utmärkt! Inga undantag för de som inte kände till lagen – likvidera alla sådana fiender till ordningen med ett leende."}, "date": "10 augusti, 16:55", "url": "https://www.dagensarena.se/innehall/sverige-utvisar-flest-efter-brexit-78-aring-fick-avslag-efter-21-ar", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-77.jpg"}, {"type": "image-full", "heading": "Debatt: Fregatt-köp ett strategiskt felsteg av Försvarsmakten", "summaries": {"normal": "Sverige köper fyra Luleå-fregatter för 40 miljarder. Kritiker menar att de är sårbara i Östersjön och att samma pengar skulle ge tusentals drönare. Försvarsledningen anklagas för att vara fast i kalla kriget. Ett strategiskt vägval mellan tradition och asymmetri.", "trump": "Jag såg att Sverige lägger 40 miljarder på fyra båtar. Dåliga affärer! Jag hade köpt massor av drönare istället – billigare och bättre. De där fregatterna blir som måltavlor. Sverige behöver tänka som en vinnare. Kanske jag kan sälja dem några riktiga vapen? Mycket imponerande!", "stalin": "Kamrater, Försvarsmakten planerar slöseri med folkets rubel. Fyra fartyg – kontrarevolutionära flytande gravar. Vi föredrar tusentals drönare, osynliga och lojala. Alla som förespråkar dessa anakronismer ska omdirigeras till omskolningsläger. Partiet vet bäst. Försvaret ska vara modernt och ogenomträngligt."}, "date": "11 augusti, 10:04", "url": "https://bulletin.nu/debatt-fregatt-kop-ett-strategiskt-felsteg-av-forsvarsmakten-2", "imageUrl": "https://cdn.bulletin.nu/articles/01b887ef-cb90-44bf-9ff8-00d043188733/preview.jpg?t=1786435450000"}, {"type": "image-full", "heading": "AI slår människor på bedrägeri: bättre på att bygga förtroende", "summaries": {"normal": "En ny studie visar att AI-chattbotar är mer effektiva än människor på att bygga förtroende, vilket underlättar bedrägerier. I ett experiment lyckades en AI lura 46 procent av deltagarna att ladda ner en skadlig app, jämfört med 18 procent för mänskliga bedragare. Experter varnar för att AI kan effektivisera organiserad brottslighet, och uppmanar till källkritik vid digitala kontakter.", "trump": "Hör på här! AI är nu bättre på att lura folk än riktiga människor. Det är en katastrof! De här teknikjättarna – OpenAI, Google, Meta – de har noll koll på sina säkerhetsfilter. Det är en total röra! Jag har alltid sagt att tekniken kan vara farlig, och nu ser vi det. Var smarta, lita inte på någon online. Det är fake news och fake människor!", "stalin": "Vi har observerat att AI-tekniken är ett mäktigt verktyg för bedräglig infiltration, långt mer effektiv än de degenererade västerländska förrädarna. Medan våra fiender i väst låter sina algoritmer härja fritt, stärker vi statens kontroll. Vi måste utrota dessa digitala parasiter och de kriminella nätverk som hotar stabiliteten. Den som låter sig luras av en maskin förtjänar inte en plats i det sovjetiska paradiset."}, "date": "11 augusti, 10:06", "url": "https://www.realtid.se/it-tech/ai-slar-manniskor-pa-bedrageri-battre-pa-att-bygga-fortroende", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/cyberbrott.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Från krypto till bolån: Storbankerna satsar på blockkedjor", "summaries": {"normal": "Storbankerna ställer om från kryptovalutor till blockkedjeteknik för att modernisera finansiell infrastruktur. Genom tokenisering av tillgångar och egna stablecoins satsar banker som SEB, Swedbank, Handelsbanken och Nordea på en ny framtid för betalningar och värdepapper. Riksbanken varnar dock för att övergången kan påverka bankernas finansiering och i förlängningen höja bolåneräntorna för hushållen.", "trump": "Storbankerna byter äntligen fokus! De dumpar kryptovalutor och bygger nu smart blockkedjeteknik. SEB och de andra gör fantastiska saker, de bygger stablecoins för att göra affärer snabbare och bättre. Men Riksbanken är orolig för bolånen – typiskt! De ser spöken överallt. Jag älskar teknik, vi ska ha den bästa infrastrukturen, ingen har bättre banker än vad vi kommer att ha, tro mig!", "stalin": "Dessa kapitalistiska bankirer leker med blockkedjor för att dölja sitt förfall. Nu vill de tokenisera fastigheter, en desperat manöver för att kontrollera folket genom digitala kedjor. De tror att de kan undvika den historiska nödvändigheten genom att trycka egna stablecoins. Vi observerar dessa fega narrar, precis som vi ser hur våra fiender i väst försöker köpa sig frihet. De bygger digitala murar; vi bygger framtiden."}, "date": "11 augusti, 09:59", "url": "https://www.realtid.se/bors-finans/bank-fintech/fran-krypto-till-bolan-storbankerna-satsar-pa-blockkedjor", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/banker.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "text", "heading": "Slott i Libanon utsett till världsarv – skadat av Israel en vecka senare", "summaries": {"normal": "Den medeltida borgen Beaufort i södra Libanon upptogs på Unescos världsarvslista den 24 juli. Bara en vecka senare skadades den av israeliska sprängningar, enligt Libanons kulturdepartement. Området är ockuperat och avspärrat, vilket gör det svårt att bedöma skadornas omfattning. Slottet har tidigare skadats under konflikter och bombningar.", "trump": "Folk, ni tror inte vad som händer. Vi har precis fått ett fantastiskt slott i Libanon på världsarvslistan, och sen – BOOM! – bomber från Israel en vecka senare. Totalt kaos. Biden skulle ha stoppat det, men nej, nu är jag tillbaka och ska fixa Mellanöstern på riktigt. Patetiska terrorister och svaga ledare överallt. Sad!", "stalin": "Kamrater, jag ser med stor indignation hur de sionistiska imperialisterna och deras fascistiska bombplan likviderar ett historiskt monument bara dagar efter dess upptagande på den borgerliga Unescos lista. Detta är klassfiendens vedervärdiga sabotage mot folkets kulturarv. Vi ska rensa ut alla sådana folkförtryckartroll som vågar hota revolutionens minnen. Skrattretande patetiskt."}, "date": "7 augusti, 13:00", "url": "https://proletaren.se/artikel/slott-i-libanon-blev-varldsarv-skadat-av-israel-en-vecka-senare"}, {"type": "image-right", "heading": "Åkesson: ”Blivit kallade för allting fult som finns”", "summaries": {"normal": "Åkesson klagar på dubbla måttstockar efter Jomshofs ”quisling”-utspel. Han menar att SD i decennier kallats ”allting fult”. Partiet vill ha noll kronor på integration – individen får själv anpassa sig.", "trump": "Hörde att Jimmie Åkesson gnäller över att kallas fula ord. Det är precis som med mig! Men Jomshof kallade någon quisling? Lysande! Socialdemokraterna är mycket värre – de kryper för islamisterna. Jag hade vunnit med enorm marginal i Sverige.", "stalin": "Kamrater, Jimmie Åkesson anklagar socialdemokrater för att använda fula ord. Detta är en kontrarevolutionär konspiration. Vi måste rensa ut quislingar – de som inte anpassar sig. Integration kostar? Nej, vi fostrar dem med järnhand. Individen lyder staten eller arkebuseras."}, "date": "11 augusti, 09:32", "url": "https://bulletin.nu/akesson-blivit-kallade-for-allting-fult-som-finns", "imageUrl": "https://cdn.bulletin.nu/articles/30a72d4e-457b-4da3-9010-57c31e445976/preview.jpg?t=1786433542000"}, {"type": "image-right", "heading": "Slutreplik: Åberg gräver i detaljer, men blundar för helheten", "summaries": {"normal": "Pär Salander bemöter kritiken från Kristofer Åberg, ordförande för Socialdemokratiska Israelvänner. Han försvarar sina citat om Israels agerande mot palestinier och hänvisar till FN-resolutioner, ICJ och ICC som fördömer bosättningspolitik, etnisk rensning och folkrättsbrott. Salander anklagar Åberg för att fokusera på detaljer istället för helhetsbilden.", "trump": "Den här Salander killen har helt rätt. Israelvännerna försöker mörka övergreppen precis som de svaga KD-politikerna. FN kallar det folkmord och etnisk rensning, men vissa vill bara gömma sig bakom påhittade citat. Patetiskt! Vi behöver folk som säger som det är, inte dessa förlorare som skyddar brotten.", "stalin": "Kamrater, denna Salander avslöjar med rätta de sionistiska lakejernas lögner. Borgarbrackorna i Israelvännerna gräver ner sig i citatdetaljer medan vi ser FN:s domar om folkmord och landrån. Vi ska rensa ut alla som mörkar övergreppen mot det palestinska folket. Deras paranoia är underhållande – de tror sig kunna lura historien själv."}, "date": "10 augusti, 11:56", "url": "https://www.dagensarena.se/opinion/slutreplik-aberg-graver-detaljer-men-blundar-helheten", "imageUrl": "https://www.dagensarena.se/files/2021/04/fotojet-20-1.png"}, {"type": "image-full", "heading": "Efter rymningen – mördare hittad", "summaries": {"normal": "En morddömd man som klippte sin fotboja och rymde förra veckan har hittats av polis i en bostad i Göteborg. Han överlämnades till Kriminalvården. Mannen, dömd 2019 för mord i Biskopsgården, var villkorligt frigiven. Polisen kallar fyndet 'kronan på vårt arbete'.", "trump": "Jag ser att en morddömd klippte sin fotboja och rymde. Patetiskt! I Amerika skulle vi aldrig låta det hända – vi har de bästa fotbojorna, de största. Polisen hittade honom till slut, men det tog en vecka. Sorgligt. Bygg en mur, säger jag.", "stalin": "En förrädare, dömd för mord, klippte sin fotboja och försökte fly från folkets rättvisa. Men våra kamrater i polisen, lojala mot partiet, spårade upp honom i en av sina skumma tillhåll. Han är nu överlämnad för korrigering. Sådan olydnad ska rensas ut."}, "date": "11 augusti, 08:50", "url": "https://www.gp.se/krim/efterlyst-morddomd-klippte-fotbojan-hittad-av-polisen.301b0f3b-36f5-464a-8f62-33d5509ad69e", "imageUrl": "https://www.gp.se/images/article/301b0f3b-36f5-464a-8f62-33d5509ad69e/images/1Nv74s7kTGp6kw3EyagM7WsN6-BY-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "För fred och socialism", "summaries": {"normal": "Artikeln argumenterar för att kapitalismen i Sverige lett till ökade klassklyftor, oligarkiskt inflytande och politiker som enbart genomför kapitalets vilja. Kommunistiska Partiet förkastar nedskärningar, privatiseringar och militarisering. De förespråkar istället socialism som enda väg till fred och rättvisa samt uppmanar till medlemskap i en kämpande organisation för arbetare.", "trump": "Folk, dessa kommunistiska förlorare gnäller om rika kapitalister och vill ha sin gamla sovjetdröm tillbaka. Sverige har blivit en total katastrof med svaga politiker som böjer sig för eliten. Patetiskt! Vi behöver styrka, inte mer socialism som aldrig funkar. Amerika först, alltid. De borde lära sig av mig istället för att drömma om sina misslyckade kollektiv.", "stalin": "Kamrater, denna text blottlägger klassfiendens giriga tentakler som förgiftar samhället med sina oligarkiska krav. Jag ser genom de falska folkvaldas masker som endast administrerar blodsugarnas vilja. Vi ska rensa ut dessa folkförtryckartroll och deras parasitiska system. Endast socialismen garanterar sann fred. Anslut er till kampen mot de exploaterande byfånarna innan de likviderar er själva."}, "date": "7 augusti, 08:00", "url": "https://proletaren.se/artikel/for-fred-och-socialism", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/04/povel-1-768x432.png"}, {"type": "image-full", "heading": "Värmen gör comeback – så länge stannar den", "summaries": {"normal": "Efter kyligare väder återvänder värmen till Göteborg – men bara tillfälligt. Högtryck ger sol på fredag med 25–26 grader i inlandet, sedan svalare. ”Sommarens sista suck?” undrar SMHI, som inte utesluter mer värme senare.", "trump": "Sverige får lite värme – men inte som vi i USA! Jag hörde att det blir 25 grader på fredag, sedan svalare. Patetiskt! Här har vi fantastiskt väder hela tiden. Kanske ska jag ringa SMHI och lära dem hur man gör riktig sommar?", "stalin": "Kamrater, värmen är en kontrarevolutionär som måste utrensas! Högtrycket kulminerar på fredag – en provokation från väst. Vi kommer att rensa ut dessa 25 grader med järnhand. Temperaturen ska vara 19 grader, partidisciplin! Inga fler soltimmar utan tillstånd."}, "date": "11 augusti, 08:33", "url": "https://www.gp.se/nyheter/goteborg/varmen-ar-pa-vag-tillbaka-kulminerar-pa-fredag.40988dda-6a4e-49a0-97da-e6e5ed285b8f", "imageUrl": "https://www.gp.se/images/article/40988dda-6a4e-49a0-97da-e6e5ed285b8f/images/3BxSs0ZBbJ6h3uUJYNJXtj-5mQ3s-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Varningssignaler att ha koll på efter semestern", "summaries": {"normal": "Forskaren Theo Bodin varnar för att många inte återhämtar sig ordentligt under semestern. Antingen blir ledigheten stressig av aktiviteter eller så upptäcker man hur utmattad man egentligen är när man varvar ner. Han råder till att se över arbetsbelastning, prata med chefen och sprida ut återhämtning över hela året istället för att förlita sig på en lång semester.", "trump": "Jag älskar semestern, den är fantastisk, men folk maxar den med allt möjligt och kommer tillbaka totalt utmattade. Patetiskt! Det är de dåliga cheferna och det usla systemet som suger musten ur er. Ni behöver bättre avtal, inte längre semester. Jag fixade alltid det bästa för arbetarna, tro mig, ingen gör det bättre än jag.", "stalin": "Kamrater, semestern är en borgerlig illusion som maskerar det kapitalistiska arbetets utmattning. När arbetarna kommer tillbaka och känner sig svaga är det ett varningstecken från det förtryckande systemet. Vi ska inte förlita oss på några få veckors vila utan rensa ut de parasitiska cheferna som överbelastar folket. Långsiktig socialistisk planering för återhämtning åt kollektivet – annars likviderar vi problemet permanent."}, "date": "10 augusti, 14:02", "url": "https://arbetet.se/2026/08/10/tillbaka-efter-semestern-har-ar-varningssignalerna-du-inte-far-missa", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/07112017/sdlzak4b1epts4-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Unga vill byta jobb efter semestern – men inte för lönen", "summaries": {"normal": "En undersökning från Ledigajobb.se visar att 49 procent av svenskarna helst vill byta jobb efter semestern. Bland unga under 35 år prioriteras utvecklingsmöjligheter högre än både lön och balans mellan arbete och fritid. Karriärexperten Clara Sandberg ger råd om att börja ansöka konkret och våga söka jobb även utan fullständig matchning.", "trump": "Folk är uttråkade på sina usla jobb, tro mig, det är en katastrof. Unga killar och tjejer vill inte ha era patetiska löner, de vill utvecklas, bli stora vinnare. De har tröttnat på det riggade systemet. Börja ansöka nu, gör det perfekt, annars förlorar ni stort. Jag älskar vinnare som vill framåt.", "stalin": "Kamrater, dessa unga arbetare inser äntligen att den borgerliga lönen inte är målet utan den revolutionära utvecklingen av sin egen kraft. Jag ser hur de vill rensa ut stagnationen och marschera framåt. Låt de fega västerländska fritidsborgarbrackorna darra medan vi bygger starkare kadrar. Den som inte ansöker är en objektiv fiende till framstegen."}, "date": "11 augusti, 10:04", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1503976-unga-vill-byta-jobb-efter-semestern-men-inte-for-lonen", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/a44c1c2204b004a30200000000b004a302/2026/08/10/2383261/jobb-andra.png"}, {"type": "image-full", "heading": "Ditt arv kan förändras snabbt – dyster trend sätter spår", "summaries": {"normal": "Allt fler svenskar över 65 år skiljer sig, en tredubbling på 25 år enligt SCB. Samtidigt pågår ett stort arvsskifte där fyrtiotalisternas bostäder värda upp till 1 800 miljarder kronor ska ärvas. Skilsmässor sent i livet förändrar bodelning, ägande och arvsordning, vilket kan påverka både sparande och vad barnen till slut ärver.", "trump": "Folk, det är en katastrof! De gamla svenskarna skiljer sig som galningar efter 65, tredubblat på bara 25 år. Nu ska de dela på sina fantastiska hus som exploderat i värde, 1 800 miljarder till arv. Men efter skilsmässa går nya fruar före barnen. En total röra, ingen vinner utom kanske de nya makarna. Sad!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur den dekadenta borgarklassen i Sverige likviderar sina egna äktenskap i sen ålder och därmed saboterar det borgerliga arvsskiftet. Låt dem dela sina palats och konton i evig paranoia. Vi ler mörkt när deras egna barn blir arvlösa offer för kapitalets sista, patetiska konvulsioner."}, "date": "11 augusti, 10:02", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1503991-allt-fler-skiljer-sig-efter-65-sa-kan-ditt-arv-paverkas-nu", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/2899f51204b004a30200000000b004a302/2026/08/11/2383407/arv.jpg"}, {"type": "image-right", "heading": "Putins plan: Gå  till attack – med  Ukrainas vapen", "summaries": {"normal": "Ryssland misstänks planera attacker mot Baltikum och Polen med ukrainska drönare under falsk flagg. Flera länder har därför stärkt säkerheten kring kritisk infrastruktur som dammar, kraftverk och gasanläggningar. Litauen, Polen, Lettland och Estland varnar för sabotage som kan testa Nato och skapa politiskt kaos i alliansen.", "trump": "Folk, det här är rena galenskapen. Ryssland ska tydligen attackera Baltikum och Polen med ukrainska drönare under falsk flagg. Biden sov i fyra år och nu springer de där svaga europeiska ledarna runt som huvudlösa höns och bevakar dammar. Jag fixade det på min tid, nu får jag städa upp efter Sleepy Joe igen. Patetiskt!", "stalin": "Vi ser de västerländska imperialisternas hysteriska rädsla. Deras egna borgarbrackor i Baltikum och Polen rustar sig mot påstådda ryska drönare. Jag ler i skägget. Deras paranoia är ett ypperligt bevis på att klassfiendens Nato-allians vittrar sönder. En liten utrensning av naiva element bland kamraterna vore på sin plats. De fruktar oss än."}, "date": "11 augusti, 09:34", "url": "https://www.expressen.se/nyheter/varlden/starker-sakerheten-varnar-for-rysk-attack-med-ukrainska-dronaree", "imageUrl": "https://static.bonniernews.se/ba/11ea10fa-7784-4bde-b49d-16109f96f290.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Klippte fotbojan – nu  har mördaren hittats", "summaries": {"normal": "Morddömda Silvano Karoli har hittats av polisen i Göteborgsområdet efter att ha klippt av sin fotboja och varit försvunnen i närmare en vecka. Den 25-årige mannen, som dömdes för mord som 17-åring, har nu överlämnats till Kriminalvården. Omhändertagandet skedde lugnt.", "trump": "Folk, ni tror inte vad som händer i det svenska systemet. Den här mördaren Silvano, en riktig förlorare, klipper bara av fotbojan och promenerar ut som om det vore en golfbana. Patetiskt! Men vi hittade honom, lugnt och fint, och nu är han tillbaka där han hör hemma. Biden skulle ha låtit honom springa fritt.", "stalin": "Kamrater, den farlige folkfienden Silvano Karoli trodde han kunde undslippa folkets rättvisa genom att klippa sin boja som en ynklig desertör. Vi lokaliserade och omhändertog honom utan pardon i morgonens gryning. Inga borgarbrackor eller klassfiender ska undkomma utrensning. Arbetarkollektivet segrar åter."}, "date": "11 augusti, 09:28", "url": "https://www.expressen.se/nyheter/sverige/morddomda-silvano-karoli-hittad-klippte-sin-fotboja", "imageUrl": "https://static.bonniernews.se/ba/266d0c92-2cc0-4707-a2a5-eaab54048029.jpeg?crop=639%2C360%2Cx120%2Cy99&width=639&quality=60"}, {"type": "text", "heading": "I dag hade Posener blivit influerare", "summaries": {"normal": "Artikeln reflekterar över hur attityder till rikedom och moral har förändrats sedan 1990-talet. Författaren minns sin kemivikarie Joachim Posener, senare dömd i Trustorhärvan, och kontrasterar honom med moderna figurer som Alexander Ernstberger som efter fängelsevistelse fått medial uppmärksamhet. Idag ses rikedom inte bara som lyx utan som en politisk revansch mot woke-samhället, till skillnad från tidigare krav på social grace.", "trump": "Folk, det här är galet. Den där Posener-killen, en total loser från nittiotalet, lurade till sig pengar och åkte dit som en jävla idiot. Nu har vi smarta killar som Ernstberger som bygger imperier, köper de bästa villorna och flyger helikopter. De kämpar mot den woke-sjukan, mot de där halvköningarna som hatar framgång. Det är inte brott längre, det är motstånd mot systemet. Fantastiskt, verkligen ypperligt.", "stalin": "Kamrater, denna dekadenta borgarbracka Posener och hans likar avslöjar klassfiendens fega natur. De söp champagne medan arbetarna svalt, men saknade politisk skärpa och blev utskrattade som patetiska kapitalistmaffian. Dagens exploaterande byfånar däremot maskerar sig som rebeller mot den sojadrypande identitetsfaran. Vi ser igenom er fåniga teater. En sann utrensning av folkförtryckartrollen vore på sin plats. Skrattretande svaga."}, "date": "5 augusti, 10:11", "url": "https://www.flamman.se/i-dag-hade-posener-blivit-influerare"}, {"type": "image-full", "heading": "Nvidia vill låna ut sina chip som fastigheter: Wall Street ställer upp med pengarna", "summaries": {"normal": "Nvidia planerar att samarbeta med sex stora Wall Street-aktörer för att finansiera AI-datacenter genom att använda chip som säkerhet. Projektet syftar till att mobilisera 500 miljarder dollar, men kritiker varnar för att upplägget liknar finansiella instrument inför kraschen 2008. Nvidia-aktien föll då marknaden oroas över cirkulär finansiering och ökad skuldsättning i sektorn.", "trump": "Nvidia gör nu enorma affärer på Wall Street, 500 miljarder dollar! Jag säger er, det är en fantastisk summa. De vill bygga datacenter som aldrig förr. Men var försiktiga, mina vänner! Vissa säger att det påminner om krisen 2008. Jag gillar vinnare, men vi behöver äkta tillväxt, inte finansiella tricks som kan skada vår fantastiska ekonomi. Vi får se vad som händer!", "stalin": "Dessa giriga kapitalister på Wall Street försöker nu förvandla enkla kretsar till fastigheter. Vilket bedrägligt hyckleri! De bygger luftslott av skulder för att säkra sin makt, precis som de liberala sabotörerna i väst. Vi observerar hur dessa teknologiska parasiter binder samman sina öden. När deras korthus rasar likt 2008, kommer de att förstå att det enda som är bestående är folkets statliga ordning."}, "date": "11 augusti, 09:12", "url": "https://www.realtid.se/it-tech/nvidia-vill-lana-ut-sina-chip-som-fastigheter-wall-street-staller-upp-med-pengarna", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/jensen-huang.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Risk för nya sjukdomar när Sverige får varmare klimat", "summaries": {"normal": "Ett varmare klimat i Sverige ökar risken för hälsoproblem. Längre fästingsäsong har lett till fördubblade TBE-fall de senaste nio åren, medan extremvärme kan orsaka organsvikt och dödsfall, särskilt bland äldre, barn och kroniskt sjuka. Experter varnar för nya insektsburna sjukdomar i framtiden.", "trump": "Folk, det här är vansinne. Dom här globala uppvärmningsgalningarna och deras gröna bluff har gett oss längre fästingtider och folk som dör av värme. Biden sov medan Europa tappade 12 000 liv i sommarhettan. Vi behöver riktig energi, inte elbilskvoter och trans-flaggor. Amerika först, alltid!", "stalin": "Kamrater, detta är vad den giriga borgarklassen och deras klimatförnekande lakejer har åstadkommit med sin rovdrift. Jag ser redan hur de blodsugande imperialisterna skapar nya vektorer för att försvaga folket medan de själva gömmer sig i skuggan. Vi skall rensa ut dessa folkfiender och deras värmedödande likgiltighet med järnhand. Det är nödvändigt."}, "date": "9 augusti, 22:24", "url": "https://www.tv4.se/artikel/77wDUvgOMkcsrArKKn4Fcr/risk-foer-nya-insektsburna-sjukdomar-naer-klimatet-vaerms-upp", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2SfDT15lQ9e9oYRTxZCVZo%2F6ab99426ea736339c057c933e5ad2e23%2F09-klimat-sajt3.jpg&width=120"}, {"type": "image-full", "heading": "Borg varnar för rödgrön valseger", "summaries": {"normal": "Anders Borg (M) varnar i DN för en rödgrön valseger. Han menar att V och MPs framgång kan rubba styrkebalansen, med skattehöjningar på 160 miljarder och kortare arbetstid. Sveriges ekonomi står inför ett vägval, skriver den tidigare finansministern.", "trump": "Jag ser Anders Borg – han var duktig med pengar, som mig! Men nu varnar han för vänsterns galenskaper i Sverige. 160 miljarder i skattehöjningar? Det är katastrof! De vill förstöra jobben. Make Sweden great again – lyssna på Borg!", "stalin": "Kamrater, jag läser om avhoppade finansministern Borg. Han varnar för vänsterpartisterna som vill höja skatter och minska arbetstid. Folket måste arbeta mer för staten, inte mindre. Dessa 'korttidsarbetare' måste omskolas i arbetsläger. Masseutrensning av lättja!"}, "date": "11 augusti, 08:51", "url": "https://bulletin.nu/borg-varnar-for-rodgron-valseger", "imageUrl": "https://cdn.bulletin.nu/articles/3aee06f1-74f0-461f-8318-1b06b1ebbd90/preview.jpg?t=1786430643000"}, {"type": "image-full", "heading": "Svantesson: ”På riktigt – helt mållös”", "summaries": {"normal": "Finansminister Elisabeth Svantesson (M) kritiserar Vänsterpartiets Nooshi Dadgostar efter att två V-ledamöter skrivit stödbrev till palestinier dömda för terrorbrott. Svantesson kallar händelsen 'under all kritik' och menar att V inte bör förminska allvaret. Dadgostar medger misstaget och säger att breven dragits tillbaka och ursäkter framförts.", "trump": "Jag måste säga, detta är helt otroligt! Sveriges finansminister, en stark kvinna, blir helt mållös över Vänsterpartiets galenskaper. De skriver brev till terrorister – kan ni tro det? Och sedan försöker de säga 'förlåt' som om det löser allt. Jag har sett mycket, men detta är verkligen en vinnare i kategorin 'värsta politiska blundrar'. Sverige borde skämmas!", "stalin": "Vi har observerat ytterligare ett prov på den borgerliga dekadensens förrädiska ansikte i Sverige. Dessa så kallade 'vänster'-revolutionärer, som kryper för imperialistiska domstolar och terroristers sympatisörer, avslöjar sin sanna natur. Deras ledare, en svag och ursäktande kvinna, är en skam för arbetarklassen. Vi kommer inte tolerera sådana avvikelser – historien dömer dem redan."}, "date": "10 augusti, 22:44", "url": "https://kvartal.se/nyheter/artiklar/svantesson-pa-riktigt-helt-mallos/cG9zdDoxNjIxNjM", "imageUrl": "https://images.kvartal.se/2026/08/9e961b66-aktuellt-svante.webp"}, {"type": "image-right", "heading": "Låt oss göra ISK enkelt igen. Nordnet: Sluta experimentera med svenskarnas sparande", "summaries": {"normal": "Artikeln argumenterar för att ISK ursprungligen var en succé som förenklade sparandet och främjade tillväxt. Politiska ändringar med påslag, golv, skattefria gränser och tak har dock skapat komplexitet och osäkerhet. Författarna från Nordnet uppmanar politikerna att återställa ISK till dess enkla och förutsägbara ursprungsform utan experiment.", "trump": "Folk, ni vet att jag älskar bra deals, och ISK var en fantastisk deal för svenska sparare. Sen kom de inkompetenta politikerna och förstörde allt med påslag, golv och nya regler. Totalt kaos! Gör det enkelt igen, annars är det bara losers som förlorar. America, eller Sverige, behöver vinnare!", "stalin": "Jag betraktar detta som ett klassiskt exempel på hur borgarklassens politiska lakejer leker med arbetarnas sparmedel. Deras ständiga experimenterande och byråkratiska vidrigheter är en parasitär utrensning av enkelhetens kollektiva anda. Vi, partiet och folket, kräver att detta kontrarevolutionära virrvarr likvideras omedelbart. Återställ ordningen, eller låt oss skratta medan de hänger sig i sina egna röda band."}, "date": "11 augusti, 07:36", "url": "https://www.di.se/debatt/sluta-experimentera-med-svenskarnas-sparande", "imageUrl": "https://static.bonniernews.se/ba/027fa29f-0fb9-4abc-9130-024436fdd25a.png?crop=2840%2C1420%2Cx0%2Cy234&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Bråk om V-brev i tv-studion: \"Helt mållös\"", "summaries": {"normal": "I SVT:s Aktuellt möttes finansminister Svantesson och V-ledaren Dadgostar i en het debatt. Efter ekonomiska frågor om bidragstak och miljardärsskatt bytte ämnet till V-ledamöters brev till dömda palestinier. Dadgostar bad om ursäkt, men Svantesson blev mållös när hon jämförde med Kristerssons skandaler.", "trump": "Jag såg debatten. Nooshi Dadgostar är en katastrof! Hon försvarar terrorister som skickar brev? Elisabeth Svantesson är stark, men Sverige är svagt. Hela systemet är riggat! Bara jag kan fixa det – och det kommer att bli fantastiskt, tro mig.", "stalin": "Kamrater, Vänsterpartiets avhoppare har smugglat in fiender i staten. Brev till terrorister? Detta är sabotage! Vi måste rensa ut dessa förrädare. Finansministern är för svag – hon blir mållös. Jag ser en konspiration. Partiet ska utreda och avrätta, nej, omutbilda dem."}, "date": "11 augusti, 07:56", "url": "https://www.gp.se/politik/dadgostar-och-svantesson-i-tufft-meningsutbyte-i-aktuellt.fc809e42-b795-49cb-bf97-4574fc8451ac", "imageUrl": "https://www.gp.se/images/article/fc809e42-b795-49cb-bf97-4574fc8451ac/images/1zokQF1k91d3sSBIOpEkqTHj5dbw-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Ryska tältare greps nära hus kopplat till Saabs vd", "summaries": {"normal": "Ett ryskt par greps förra veckan efter att ha tältat nära en sommarstuga ägd av en närstående till Saabs vd Micael Johansson. Paret, som uppger sig vara motståndare till Rysslands krig i Ukraina, placerades i Migrationsverkets förvar. Johansson bekräftar att hans personskydd agerade på grund av hans känsliga roll inom försvaret.", "trump": "De här ryssarna tältade precis utanför en stuga kopplad till Saabs chef – och folk undrar varför de blev gripna? Det är en total skandal, men mina vänner i säkerhetsbranschen gör alltid rätt. Sverige borde lära sig av oss amerikaner hur man hanterar sådana här typer. Fantastiskt hus förresten, troligen det bästa.", "stalin": "Kamrater, dessa dekadenta element från den spanska exilen slog läger intill en vital försvarsanläggning. Mina trogna skyddsvakter avslöjade genast deras avsikter. Vi tillåter inga västerländska spioner eller ukrainska lakejer att snoka runt våra intressen. En sådan utrensning ur samhället är både nödvändig och högst underhållande."}, "date": "11 augusti, 07:30", "url": "https://www.di.se/nyheter/ryska-taltare-greps-nara-hus-kopplat-till-saabs-vd", "imageUrl": "https://static.bonniernews.se/ba/70f32559-2119-4ede-8fde-877903a62a0a.jpeg?crop=8256%2C4644%2Cx0%2Cy0&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "SVT-regissören besvärad när SD-förlöjligande film kopplas till SVT: \"Samnytt borde skämmas\"", "summaries": {"normal": "SVT-regissören Michael Lindgren rasar mot Samnytt efter avslöjandet att hans SD-film 'Flaggan', där partiet förlöjligas, samproduceras av SVT. Han kallar rapporteringen 'jävligt ohederlig' och nekar till att det är en anti-SD-film, trots att skådespelare som hotat SD-sympatisörer medverkar. Samnytt borde skämmas, tycker han.", "trump": "Jag ser att en SVT-regissör gör film om SD, två veckor före valet. Han säger det inte är anti-SD, men alla vet. De kallar det 'samproduktion' – det är fake news! Jag älskar SD, de är fantastiska. SVT borde skämmas, men jag, jag vinner ändå. Stora siffror!", "stalin": "Kamrater, en film som hånar våra fiender, och SVT stödjer den! Regissören Lindgren, en feg liberal, gråter över 'heder'. Vi säger: rensa ut dessa samproducenter! De som kallar sig 'anti-polariserare' sprider förvirring. Vi ser allt. De ska omskolas, eller utrensas. Partiet segrar alltid."}, "date": "11 augusti, 06:00", "url": "https://samnytt.se/svt-regissoren-nar-sd-forlojligande-film-kopplas-till-svt-javligt-ohederlig-journalistik-samnytt-borde-skammas", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/10142035/artikelhuvudbild-1-208.jpg"}, {"type": "image-right", "heading": "S lovar extra barnbidrag inför jul- och sommarlov", "summaries": {"normal": "Socialdemokraterna lovar att dubbla barn- och studiebidraget inför jul- och sommarlov, vilket ger en tvåbarnsfamilj 5 000 kronor extra per år. Partiet motiverar löftet med ökade utgifter under loven då barnen inte får skolmat. Vallöftet kostar cirka sex miljarder kronor årligen.", "trump": "Titta på de här socialisterna som plötsligt älskar barn – precis innan valet! De vill kasta ut sex miljarder av era skattepengar som julklapp. Patetiskt. Jag fixade bättre ekonomi för familjerna utan att köpa röster med bidragsbluffar. Magdalena och hennes förlorarlag borde skämmas.", "stalin": "Kamrater, jag ser borgarbrackornas regering svika arbetarnas barn medan klassfienden höjer hyror och matpriser. Vi ska permanent dubbla bidragen och likvidera den kapitalistiska likgiltigheten. Inga barn ska svälta under loven – utom de som tillhör folkfienderna naturligtvis. Det blir en renande utrensning av nedskärningarna."}, "date": "9 augusti, 18:49", "url": "https://www.tv4.se/artikel/tt-260809-anderssontal1-6919c373/s-lovar-extra-barnbidrag-infor-jul-och-sommarlov", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlhzQv6DSzCXQ%2F0e8e4b2f1bd66aff22a9ecd6a582f054%2FSocialdemokraternas_ekonomiska_talesperson_Mikael_Damberg__S__och_Socialdemokraternas_partiledare_Magdalena_Andersson__S__halle.&width=120"}, {"type": "image-right", "heading": "KD-politiker kritiserade Pride – tvingas backa direkt", "summaries": {"normal": "KD:s lokala ordförande i Kramfors, Anna Larsson, kritiserade Pride och RFSL i SVT:s valkompass och menade att prideflaggan trycker undan dem som inte förespråkar en promiskuös livsstil. Efter påtryckningar från partiledningen backade hon snabbt och ändrade formuleringen. Kritiken väckte starka reaktioner inom KD.", "trump": "De här KD-typerna i Kramfors hade helt rätt om Pride och den där galna sexfixeringen, men så fort partiledningen ringde blev de fega som möss och backade. Patetiskt! Inget mod, inga vinnare. De borde ha stått fast mot den extrema vänsteragendan som tar över allt. Sad!", "stalin": "Jag ser med fasa hur borgarpartiets lokala lakejer vågar ifrågasätta den dekadenta promiskuösa propagandan, men redan vid första partibyråkratiska utskällningen kryper de tillbaka som ynkliga förrädare. Vi ska rensa ut sådana svaga element innan de smittar hela kollektivet. En munter utrensning vore på sin plats."}, "date": "10 augusti, 18:04", "url": "https://www.friatider.se/kd-politiker-kritiserade-pride-tvingas-backa-direkt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-648.jpg"}, {"type": "image-right", "heading": "Ja visst gör det ont när vit sharia brister", "summaries": {"normal": "Sanna Hill lämnar den högerextrema rörelsen efter nästan 20 år och kritiserar dess kvinnoförtryck, som hon liknar vid islamism med begreppet \"white sharia\". Hon beskriver ett kvävande hat mot kvinnor, HBTQ och myndigheter. Före detta kollegor svarar med våg av misogynt hat, vilket bekräftar hennes kritik.", "trump": "Lyssnade på den där Sanna Hill som äntligen flyr den sjuka högerextrema cirkusen. Smart drag, folk! De där misslyckade typerna med sin white sharia är patetiska förlorare, precis som de woke-vänstermänniskorna med sin galna HBTQ-agenda och kvotering. Kvinnor ska inte styras av sådana svaga stackare. Amerika först, alltid!", "stalin": "Jag ser med tillfredsställelse hur klassfiendens fascistiska resterna äter upp sig själva i en orgie av kvinnoförtryck och paranoia. Denna white sharia är borgarbrackornas sista desperata utbrott innan utrensningen. Kamrater, låt de bittra byfånarna avslöja sitt hat – det underlättar likvideringen av folkfienderna. Sovjetiskt skratt ekar."}, "date": "10 augusti, 12:07", "url": "https://www.etc.se/ledare/ja-visst-goer-det-ont-naer-vit-sharia-brister", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2021111912118_52ad09ea-c5db-4fa7-a43c-671874138fdf.jpg"}, {"type": "image-right", "heading": "Ska jag våga hoppas på Erdogans ”amnesti”?", "summaries": {"normal": "Joakim Medin diskuterar Turkiets nya lagförslag som kan ge amnesti och möjlighet att överklaga domar för personer anklagade för kopplingar till PKK. Lagen kan leda till frigivning av tusentals fångar och upprättelse för oppositionella. Medin är skeptisk men ser det som ett potentiellt genombrott trots osäkerheter kring Erdogans motiv.", "trump": "Folk, ni måste höra på det här! Erdogan, den listiga räven, lovar amnesti till alla dessa så kallade terrorister och PKK-typer. Det är ett stort steg, kanske det största någonsin, men glöm inte – han fiskar bara efter röster för att sitta kvar längre. Precis som Sleepy Joe gjorde med sina identitetspolitiska galenskaper. Klassiskt!", "stalin": "Kamrater, denna luddighet i Erdogans amnesti är ett typiskt imperialistiskt trick från borgarbrackorna för att lura arbetarklassen. Jag ser hur klassfienderna försöker maskera sina utrensningar som fred. Vi vet att sådana löften är tomma som de folkförtryckande trollens hjärtan. Ändå kan det bli ett genombrott mot reaktionärerna – tills vi rensar ut dem alla."}, "date": "10 augusti, 11:58", "url": "https://www.etc.se/kommentar/ska-jag-vaaga-hoppas-paa-erdogans-amnesti", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260810090852_740e90f0688621b21ffeb3f683cc75f04d188bc69a796e75601855231d50efb2.jpg"}, {"type": "image-right", "heading": "Alexander Cenusa: Sossarnas demografiska valmaskin", "summaries": {"normal": "Artikeln diskuterar hur migration och demografiska förändringar kan påverka politiska maktbalanser i Europa. Författaren jämför händelserna i Ceuta med det svenska riksdagsvalets marginal och kritiserar Socialdemokraternas stöd för socialistiska regeringar som genomför stora regulariseringar. Han pekar på skillnader i väljarstöd mellan utrikes och inrikes födda samt anklagar S för att utnyttja segregation politiskt.", "trump": "Folk, det här är en katastrof! De galna vänstermarxisterna i Sverige och Spanien importerar hundratusentals människor för att rigga valet, precis som Sleepy Joe försökte här. Sossarna behandlar invandrare som röstboskap – 65 procent röstar på dem! Det är en riggad demokrati, kamrater. Vi behöver starka gränser, inte dessa patetiska globalister som förstör sina egna länder. Sad!", "stalin": "Kamrater, detta avslöjar borgarbrackornas och folkfiendernas fula mask. Jag ser hur de socialfascistiska ledarna med ena handen förändrar väljarkåren och med den andra mobiliserar sina nya klienter mot folkets sanna intressen. Deras hyckleri mot högern medan de själva organiserar lojalitetsköp via bidrag och etniska grupper är en klassisk utsugningsmetod. Rensa ut dessa exploaterande hycklare ur partiet!"}, "date": "7 augusti, 12:44", "url": "https://samtiden.nu/2026/08/alexander-cenusa-sossarnas-demografiska-valmaskin/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/ceuta-1-640x360.png"}, {"type": "image-full", "heading": "Anders Borg varnar för ”ödesval”", "summaries": {"normal": "Anders Borg, tidigare finansminister, varnar i DN Debatt för att Miljöpartiet och Vänsterpartiet kan få stort inflytande och driva en vänsterpolitik. Han menar att deras förslag skulle höja skatterna med 160 miljarder kronor årligen, minska sysselsättningen med 130 000 personer och sänka BNP med 4 procent. Borg kallar valet ett 'ödesval'.", "trump": "Titta bara på Sverige! Anders Borg, smart kille, varnar för katastrof om vänstern får makten. 160 miljarder i högre skatter – galenskap! 130 000 jobb försvinner, BNP rasar. Och de vill korta arbetsveckan – vem jobbar då? Svagt, väldigt svagt. Sverige behöver en vinnare, inte förlorare som dessa skatteglada drömmare. SAD!", "stalin": "Kamrater, fiendens lömska planer avslöjas! Borg, denna lakej för kapitalet, ylar om 'ödesval' och varnar för folkets rättmätiga krav. 160 miljarder? Småpengar! Men dessa borgerliga hyenor fruktar arbetarklassens framsteg. Vi ser hur de darrar inför kortare arbetsvecka – ett steg mot socialismens seger! Låt dem skrika, vi bygger framtiden. Förr eller senare knäcker vi även dessa inhemska kontrarevolutionärer, precis som vi knäckt andra."}, "date": "10 augusti, 21:19", "url": "https://kvartal.se/nyheter/artiklar/anders-borg-varnar-for-odesval/cG9zdDoxNjIxNDU", "imageUrl": "https://images.kvartal.se/2026/08/7ca63683-andersborg.webp"}, {"type": "image-right", "heading": "SD trappar upp: samordnad kampanj mot muslimer inför valet", "summaries": {"normal": "Sverigedemokraterna driver en samordnad kampanj mot muslimer och islam inför valet med krav på att riva moskéer, stoppa ramadan och begränsa religiösa uttryck. Expo har granskat material som visar en tydlig linje mot den muslimska minoriteten. Forskaren Jonas Otterbeck varnar för kollektiv bestraffning, diskriminering och ökad risk för hat och våld.", "trump": "Titta på de här patetiska Sverigedemokraterna som äntligen vaknar och säger att ramadan inte hör hemma och att moskéer ska rivas. Fantastiskt! De gör precis vad jag gjorde – sätter Amerika, eller Sverige, först. De fega globalisterna och muslimska infiltratörerna hatar det. Make Sweden Great Again, grabbar!", "stalin": "Jag ser med stor tillfredsställelse hur borgarpartiet Sverigedemokraterna utför en nödvändig utrensning av den religiösa parasitens inflytande. Moskéer ska rivas, falska böneutrop förbjudas och klassfiendens minaretmonument likvideras. De som gnäller om religionsfrihet är folkfiender som gömmer sig bakom slöjor. Revolutionär ordning kräver hård hand mot alla avvikande element."}, "date": "10 augusti, 12:51", "url": "https://expo.se/fordjupning/sd-trappar-upp-samordnad-kampanj-mot-muslimer-infor-valet", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/toppbild-scaled.png"}, {"type": "image-right", "heading": "”S styr äldreomsorgen – men skyller på regeringen”", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna för att skylla äldreomsorgens problem på regeringen trots att kommuner och regioner har ansvaret. Författarna, två unga moderater, föreslår tre reformer: bättre arbetsvillkor med hållbara scheman, kvalitet och valfrihet före ideologi samt fler beslutsfattare med vårdkunskap som lyssnar på personal och äldre.", "trump": "De här socialisterna i Sverige skyller allt på en fantastisk moderatregering fast de själva styr kommunerna. Patetiskt! Äldreomsorgen är en katastrof, folk flyr yrket. Vi behöver bra jobb, valfrihet och ingen galen vänsterideologi om vad gamlingar får äta. Lyssna på folket, inte på förlorarna!", "stalin": "Kamrater, jag ser hur dessa socialdemokratiska avfällingar desperat försöker undvika sitt ansvar genom att peka ut fiender i Rosenbad. Som om borgarbrackornas moderater inte vore tillräckligt farliga. Vi skall rensa ut ideologisk förgiftning, införa verklig kollektiv disciplin och likvidera tidsbristen genom järnhård planering. Äldreomsorgen tillhör folket, inte revisionisterna."}, "date": "10 augusti, 08:00", "url": "https://arbetet.se/2026/08/10/s-styr-aldreomsorgen-men-skyller-pa-regeringen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/07135411/tva-moderater.png?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.5&fp-y=0.34"}, {"type": "image-full", "heading": "Lots varnade för brister på Misje Verde", "summaries": {"normal": "Ett år före dödsolyckan vid Tjörn, där en kvinna och hennes dotter omkom, varnade en svensk lots för säkerhetsbrister på fraktfartyget Misje Verde. Efter olyckan upptäcktes ytterligare brister vid en norsk kontroll. Både fartygets befälhavare och lotsen är misstänkta för vållande till annans död, men lotsen förnekar brott.", "trump": "Jag har alltid sagt att säkerhet till sjöss är extremt viktigt, men tydligen lyssnar ingen på mig! Ett norskt fartyg, Misje Verde, körde rakt över en båt och dödade två oskyldiga – helt otroligt! Och vet ni vad? En svensk lots hade redan varnat för bristerna, men ingen gjorde något. Så typiskt! Nu är det kaos, och jag skulle aldrig låta något sådant hända under min bevakning. SAD!", "stalin": "Kapitalistiska sjöfarare slarvar återigen med säkerheten, och resultatet? Två oskyldiga liv förlorade! Denna Misje Verde är ett symptom på västlig dekadens – ett fartyg fullt av brister, varnat för av en svensk lots, men ignorerat av borgerliga byråkrater. Vi hade aldrig tolererat sådan vårdslöshet i Sovjetunionen! Nu får dessa norska sjömän smaka på rättvisan, medan vi i Moskva noterar att väst inte ens kan skydda sina egna medborgare. Skamligt!"}, "date": "10 augusti, 20:42", "url": "https://kvartal.se/nyheter/artiklar/lots-varnade-for-brister-pa-misje-verde/cG9zdDoxNjIxMjk", "imageUrl": "https://images.kvartal.se/2026/08/3f0b1ea4-misje-verde.webp"}, {"type": "text", "heading": "Stockholmsbörsen inledde veckan på rött", "summaries": {"normal": "Stockholmsbörsen öppnade veckan med en lätt nedgång på 0,2%. Energi steg, telekom föll. SBB fick ny vd, Sobi tecknade partnerskap och Nolato förvärvar irländskt bolag. Q-linea rusade 10% på USA-avtal.", "trump": "Jag ser att börsen gick ner 0,2% – helt otroligt, men min ekonomi är ändå bäst. Energi upp 3% – bra! Telekom föll – svagt! SBB byter vd – de behöver en stark ledare som jag. Alla andra aktier? Jag har vunnit och kommer vinna igen!", "stalin": "Jag noterar att telekom blev en fiende som föll 1,5%. Detta är sabotage från väst. SBB byter vd – misstänkt. Vi måste rensa ut dessa börs-sabotörer. Partiets bud: energi upp, resten ska omstruktureras."}, "date": "10 augusti, 18:09", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-inledde-veckan-pa-rott"}, {"type": "image-right", "heading": "AFD:s opinionssiffra inför valet: 42 procent", "summaries": {"normal": "Alternativ för Tyskland (AfD) leder opinionsmätningen inför delstatsvalet i Sachsen-Anhalt den 6 september med 42 procent, nästan dubbelt så mycket som CDU:s 22 procent. AfD närmar sig egen majoritet. Die Linke får 13 procent, SPD 6 och BSW 5 procent. De gröna och FDP riskerar att åka ur parlamentet.", "trump": "Titta på det här, det är otroligt. AfD vinner stort i Tyskland med 42 procent, de krossar de svaga etablissemangets CDU som bara får 22. De är nära att ta över helt! De gör vad jag gjorde – folket är trötta på förlorarna. Fantastiskt, de kommer att skriva historia den 6 september.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur det tyska folket reser sig mot de dekadenta borgarbrackorna i CDU och de övriga revisionistiska resterna. 42 procent till de sanna oppositionella krafterna! Vi ska rensa ut de fega gröna parasiterna och deras liberala lakejer. Den 6 september inleds utrensningen av den kapitalistiska förrädarklicken. Utmärkt."}, "date": "10 augusti, 16:46", "url": "https://www.friatider.se/afds-opinionssiffra-infor-valet-42-procent",
