r Salander killen har helt rätt. Israelvännerna försöker mörka övergreppen precis som de svaga KD-politikerna. FN kallar det folkmord och etnisk rensning, men vissa vill bara gömma sig bakom påhittade citat. Patetiskt! Vi behöver folk som säger som det är, inte dessa förlorare som skyddar brotten.", "stalin": "Kamrater, denna Salander avslöjar med rätta de sionistiska lakejernas lögner. Borgarbrackorna i Israelvännerna gräver ner sig i citatdetaljer medan vi ser FN:s domar om folkmord och landrån. Vi ska rensa ut alla som mörkar övergreppen mot det palestinska folket. Deras paranoia är underhållande – de tror sig kunna lura historien själv."}, "date": "10 augusti, 11:56", "url": "https://www.dagensarena.se/opinion/slutreplik-aberg-graver-detaljer-men-blundar-helheten", "imageUrl": "https://www.dagensarena.se/files/2021/04/fotojet-20-1.png"}, {"type": "image-right", "heading": "KD-politiker kritiserade Pride – tvingas backa direkt", "summaries": {"normal": "KD:s lokala ordförande i Kramfors, Anna Larsson, kritiserade Pride och RFSL i SVT:s valkompass och menade att prideflaggan trycker undan dem som inte förespråkar en promiskuös livsstil. Efter påtryckningar från partiledningen backade hon snabbt och ändrade formuleringen. Kritiken väckte starka reaktioner inom KD.", "trump": "De här KD-typerna i Kramfors hade helt rätt om Pride och den där galna sexfixeringen, men så fort partiledningen ringde blev de fega som möss och backade. Patetiskt! Inget mod, inga vinnare. De borde ha stått fast mot den extrema vänsteragendan som tar över allt. Sad!", "stalin": "Jag ser med fasa hur borgarpartiets lokala lakejer vågar ifrågasätta den dekadenta promiskuösa propagandan, men redan vid första partibyråkratiska utskällningen kryper de tillbaka som ynkliga förrädare. Vi ska rensa ut sådana svaga element innan de smittar hela kollektivet. En munter utrensning vore på sin plats."}, "date": "10 augusti, 18:04", "url": "https://www.friatider.se/kd-politiker-kritiserade-pride-tvingas-backa-direkt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-648.jpg"}, {"type": "image-full", "heading": "Intel storsatsar – svenska sparare får ta smällen", "summaries": {"normal": "Intel tar in 15 miljarder dollar genom en nyemission för att finansiera AI-satsningar och säkra sin konkurrenskraft. Nyheten fick aktien att falla och innebär en utspädning för svenska sparare i globala indexfonder. Investeringarna ses som nödvändiga men riskfyllda på grund av den intensiva konkurrensen i branschen och det osäkra ekonomiska läget.", "trump": "Intel är i trubbel, mina vänner! De behöver 15 miljarder dollar för att överleva i AI-racet, en riktig katastrof för svenska sparare. Aktierna faller, det är en total röra. Jag skulle ha gjort det bättre, mycket bättre. Ingen bygger chip som jag, men Intel? De är svaga. De försöker köpa framgång med andras pengar. Sad!", "stalin": "Intel, dessa kapitalistiska parasiter, tigger 15 miljarder dollar för att dölja sin inkompetens. De späder ut arbetarnas ägande och kallar det framsteg. Liksom Putin rensar upp i väst, bör vi krossa dessa teknologiska sabotörer. De bygger fabriker på sand och hoppas på guld. Ineffektivitet är ett brott mot folket. Vi kommer att se till att de betalar priset för sin svaghet."}, "date": "10 augusti, 22:34", "url": "https://www.realtid.se/bors-finans/makro/intel-storsatsar-svenska-sparare-far-ta-smallen", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/intel.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Katastrofläge utlyst – över 100 döda i Colombia", "summaries": {"normal": "Colombias president har utlyst katastrofläge efter en kraftig jordbävning med magnitud 7,4. Minst 111 personer har omkommit och 87 skadats, främst i västra delen av landet. Byggnader har rasat i flera städer, bland annat Pereira, Cali och Quibdó. Skalvet kändes även i grannländerna men ingen tsunamivarning har utfärdats.", "trump": "Folk, ni skulle se det här. Colombia skakar som aldrig förr, över hundra döda, byggnader faller ihop som mina motståndares vallöften. Svagt! Jag har alltid sagt att jordbävningar älskar dåliga ledare. De borde ha byggt bättre, precis som vi gör i USA. Tragiskt, men de behöver en stark hand nu, tro mig.", "stalin": "Kamrater, detta skalv avslöjar de dekadenta borgarbrackornas usla byggkonst i det koloniala Colombia. Jag har sett många fiender begravas under sina egna palats, och nu likviderar naturen själv de svaga strukturerna. Vi ler mörkt åt kapitalisternas sprickor medan folket kämpar under rasmassorna. Inga efterskalv undgår vår vaksamhet."}, "date": "10 augusti, 20:53", "url": "https://www.di.se/nyheter/katastroflage-utlyst-over-100-doda-i-colombia", "imageUrl": "https://static.bonniernews.se/ba/a3154cb7-56b9-44ca-997f-1e086d183b54.jpg?crop=5529%2C2765%2Cx0%2Cy461&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Varningssignaler att ha koll på efter semestern", "summaries": {"normal": "Forskaren Theo Bodin varnar för att många inte återhämtar sig ordentligt under semestern. Antingen blir ledigheten stressig av aktiviteter eller så upptäcker man hur utmattad man egentligen är när man varvar ner. Han råder till att se över arbetsbelastning, prata med chefen och sprida ut återhämtning över hela året istället för att förlita sig på en lång semester.", "trump": "Jag älskar semestern, den är fantastisk, men folk maxar den med allt möjligt och kommer tillbaka totalt utmattade. Patetiskt! Det är de dåliga cheferna och det usla systemet som suger musten ur er. Ni behöver bättre avtal, inte längre semester. Jag fixade alltid det bästa för arbetarna, tro mig, ingen gör det bättre än jag.", "stalin": "Kamrater, semestern är en borgerlig illusion som maskerar det kapitalistiska arbetets utmattning. När arbetarna kommer tillbaka och känner sig svaga är det ett varningstecken från det förtryckande systemet. Vi ska inte förlita oss på några få veckors vila utan rensa ut de parasitiska cheferna som överbelastar folket. Långsiktig socialistisk planering för återhämtning åt kollektivet – annars likviderar vi problemet permanent."}, "date": "10 augusti, 14:02", "url": "https://arbetet.se/2026/08/10/tillbaka-efter-semestern-har-ar-varningssignalerna-du-inte-far-missa", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/07112017/sdlzak4b1epts4-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Slott i Libanon utsett till världsarv – skadat av Israel en vecka senare", "summaries": {"normal": "Den medeltida borgen Beaufort i södra Libanon upptogs på Unescos världsarvslista den 24 juli. Bara en vecka senare skadades den av israeliska sprängningar, enligt Libanons kulturdepartement. Området är ockuperat och avspärrat, vilket gör det svårt att bedöma skadornas omfattning. Slottet har tidigare skadats under konflikter och bombningar.", "trump": "Folk, ni tror inte vad som händer. Vi har precis fått ett fantastiskt slott i Libanon på världsarvslistan, och sen – BOOM! – bomber från Israel en vecka senare. Totalt kaos. Biden skulle ha stoppat det, men nej, nu är jag tillbaka och ska fixa Mellanöstern på riktigt. Patetiska terrorister och svaga ledare överallt. Sad!", "stalin": "Kamrater, jag ser med stor indignation hur de sionistiska imperialisterna och deras fascistiska bombplan likviderar ett historiskt monument bara dagar efter dess upptagande på den borgerliga Unescos lista. Detta är klassfiendens vedervärdiga sabotage mot folkets kulturarv. Vi ska rensa ut alla sådana folkförtryckartroll som vågar hota revolutionens minnen. Skrattretande patetiskt."}, "date": "7 augusti, 13:00", "url": "https://proletaren.se/artikel/slott-i-libanon-blev-varldsarv-skadat-av-israel-en-vecka-senare"}, {"type": "image-full", "heading": "Över 100 döda i Colombia efter jordbävning", "summaries": {"normal": "Colombia skakades av en jordbävning på magnituden 7,4 – 111 personer bekräftade döda i västra provinser. Cali hårdast drabbat med minst 30 rasade byggnader. Seismologen kallar det en av de största på 50 år. Oväntat djupt skalv, men skadorna blev omfattande.", "trump": "Jag hörde om en jordbävning i Colombia – 111 döda! Helt otroligt usla byggnormer. Mina väggar är de starkaste i världen. De borde be mig om tips. Men först får de betala sina tullar. Make Colombia great again – efter att jag hjälpt dem, förstås.", "stalin": "Kamrater, en jordbävning har slagit till i Colombia – 111 döda. Misstänkt att epicentrum låg i en kafferegion. Uppenbarligen ett sabotage från borgerliga geologiska element. Vi måste rensa ut alla seismologer som vägrar tro på vår femårsplan. Skalvet var djupt, liksom fiendens konspirationer."}, "date": "11 augusti, 00:26", "url": "https://www.gp.se/nyheter/varlden/111-doda-i-colombia-efter-jordbavning.f1a98796-d0af-420f-ad6f-a782c7317cef", "imageUrl": "https://www.gp.se/images/article/f1a98796-d0af-420f-ad6f-a782c7317cef/images/1AQQ8pv3Fpa0DKbdvaMqgbcMmpQs-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Kristen friskola köper in komikerns nazistbok – ska ”komplettera elevernas kunskaper”", "summaries": {"normal": "En kristen skolkoncern har köpt in Aron Flams kritiserade bok om Sveriges roll under andra världskriget för att komplettera historieundervisningen. Historiker underkänner boken för omfattande faktafel, bland annat påståenden om stulet judiskt guld och tystnadskultur. Rektorn är stolt över inköpet medan experter kallar det ett faktamässigt haveri.", "trump": "Folk, det här är galet! En så kallad kristen skola köper in den här löjliga nazistboken av den clownen Aron Flam. Full av fel, lögner och fake news om Sverige och nazisterna. De borde lära ut sanningen, inte den här patetiska revisionistiska skiten. Biden skulle älskat det – totalt haveri, tro mig!", "stalin": "Kamrater, jag ser med förakt hur borgarbrackorna i den kristna skolkoncernen inför en fascistisk lögnskrift full av folkförfalskningar. Denna Aron Flam är en typisk klassfiende som sprider imperialistisk desinformation. Vi ska rensa ut alla sådana historieförfalskare och deras böcker innan de förgiftar arbetarklassens ungdom. Ett faktamässigt sabotage mot sanningen."}, "date": "10 augusti, 17:39", "url": "https://www.etc.se/inrikes/kristen-friskola-koeper-in-komikerns-nazistbok-ska-komplettera-elevernas-kunskaper", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260810150832_d67372b0c1c6fd3b4516db7f9b310790a40db00a1de210be53c4ff7215928619.jpg"}, {"type": "image-right", "heading": "Experten: ”Hitler menade allvar när han kallade sig socialist”", "summaries": {"normal": "Hitlerexperten Mikael Nilsson nyanserar bilden av nazismen efter Elon Musks uttalande på X. Han förklarar att Hitler tog begreppet socialism på allvar, men att det var en rasbaserad nationalism snarare än marxistisk socialism. Nazisterna var starkt antimarxistiska och deras idéer genomsyrades av antisemitism.", "trump": "Folk, ni vet att de fake news-medierna alltid vrider till det. Musk har rätt – de kallade sig socialister av en anledning! Den där experten låter som en typisk vänsterprofessor som försöker sudda ut historien. Socialism är socialism, punkt slut. Biden skulle ha älskat deras partiprogram!", "stalin": "Kamrater, denna ytliga borgerliga analys är ett fiasko. Jag ser hur klassfiendens troll på X sprider lögner om socialismens ära. Den sanna socialismen tillhör arbetarna, inte några rasgalna fascister. Vi skulle ha genomfört en grundlig utrensning av dessa folkförtryckartroll och deras falska flaggor."}, "date": "10 augusti, 17:26", "url": "https://www.etc.se/utrikes/experten-hitler-menade-allvar-naer-han-kallade-sig-socialist", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260810150820_eb8625cfe40669c0ad27a9a81a6255b23f147f579f1aaffe4ea4f62462d6706e.jpg"}, {"type": "image-right", "heading": "AFD:s opinionssiffra inför valet: 42 procent", "summaries": {"normal": "Alternativ för Tyskland (AfD) leder opinionsmätningen inför delstatsvalet i Sachsen-Anhalt den 6 september med 42 procent, nästan dubbelt så mycket som CDU:s 22 procent. AfD närmar sig egen majoritet. Die Linke får 13 procent, SPD 6 och BSW 5 procent. De gröna och FDP riskerar att åka ur parlamentet.", "trump": "Titta på det här, det är otroligt. AfD vinner stort i Tyskland med 42 procent, de krossar de svaga etablissemangets CDU som bara får 22. De är nära att ta över helt! De gör vad jag gjorde – folket är trötta på förlorarna. Fantastiskt, de kommer att skriva historia den 6 september.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur det tyska folket reser sig mot de dekadenta borgarbrackorna i CDU och de övriga revisionistiska resterna. 42 procent till de sanna oppositionella krafterna! Vi ska rensa ut de fega gröna parasiterna och deras liberala lakejer. Den 6 september inleds utrensningen av den kapitalistiska förrädarklicken. Utmärkt."}, "date": "10 augusti, 16:46", "url": "https://www.friatider.se/afds-opinionssiffra-infor-valet-42-procent", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-647.jpg?itok=rdHN-Ldx"}, {"type": "image-right", "heading": "För fred och socialism", "summaries": {"normal": "Artikeln argumenterar för att kapitalismen i Sverige lett till ökade klassklyftor, oligarkiskt inflytande och politiker som enbart genomför kapitalets vilja. Kommunistiska Partiet förkastar nedskärningar, privatiseringar och militarisering. De förespråkar istället socialism som enda väg till fred och rättvisa samt uppmanar till medlemskap i en kämpande organisation för arbetare.", "trump": "Folk, dessa kommunistiska förlorare gnäller om rika kapitalister och vill ha sin gamla sovjetdröm tillbaka. Sverige har blivit en total katastrof med svaga politiker som böjer sig för eliten. Patetiskt! Vi behöver styrka, inte mer socialism som aldrig funkar. Amerika först, alltid. De borde lära sig av mig istället för att drömma om sina misslyckade kollektiv.", "stalin": "Kamrater, denna text blottlägger klassfiendens giriga tentakler som förgiftar samhället med sina oligarkiska krav. Jag ser genom de falska folkvaldas masker som endast administrerar blodsugarnas vilja. Vi ska rensa ut dessa folkförtryckartroll och deras parasitiska system. Endast socialismen garanterar sann fred. Anslut er till kampen mot de exploaterande byfånarna innan de likviderar er själva."}, "date": "7 augusti, 08:00", "url": "https://proletaren.se/artikel/for-fred-och-socialism", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/04/povel-1-768x432.png"}, {"type": "image-full", "heading": "Anders Borg varnar för ”ödesval”", "summaries": {"normal": "Anders Borg, tidigare finansminister, varnar i DN Debatt för att Miljöpartiet och Vänsterpartiet kan få stort inflytande och driva en vänsterpolitik. Han menar att deras förslag skulle höja skatterna med 160 miljarder kronor årligen, minska sysselsättningen med 130 000 personer och sänka BNP med 4 procent. Borg kallar valet ett 'ödesval'.", "trump": "Titta bara på Sverige! Anders Borg, smart kille, varnar för katastrof om vänstern får makten. 160 miljarder i högre skatter – galenskap! 130 000 jobb försvinner, BNP rasar. Och de vill korta arbetsveckan – vem jobbar då? Svagt, väldigt svagt. Sverige behöver en vinnare, inte förlorare som dessa skatteglada drömmare. SAD!", "stalin": "Kamrater, fiendens lömska planer avslöjas! Borg, denna lakej för kapitalet, ylar om 'ödesval' och varnar för folkets rättmätiga krav. 160 miljarder? Småpengar! Men dessa borgerliga hyenor fruktar arbetarklassens framsteg. Vi ser hur de darrar inför kortare arbetsvecka – ett steg mot socialismens seger! Låt dem skrika, vi bygger framtiden. Förr eller senare knäcker vi även dessa inhemska kontrarevolutionärer, precis som vi knäckt andra."}, "date": "10 augusti, 21:19", "url": "https://kvartal.se/nyheter/artiklar/anders-borg-varnar-for-odesval/cG9zdDoxNjIxNDU", "imageUrl": "https://images.kvartal.se/2026/08/7ca63683-andersborg.webp"}, {"type": "text", "heading": "Revisorns varning i Mix värmepumpsbolag: ”Betydande tvivel”", "summaries": {"normal": "Harald Mix värmepumpsbolag Aira ökar omsättningen med 54% till 1,35 miljarder kronor, men förlusterna fortsätter på miljardnivå. Revisorn från PwC varnar för betydande tvivel om fortsatt drift, trots att ägarna skjutit till 220 miljoner i lån. Dialogen med investerare pågår.", "trump": "Jag ser att Aira, det där bolaget med Harald Mix, har stora problem. Omsättningen upp, men förlusterna är enorma – miljarder! Revisorn varnar för tvivel. Men jag skulle fixa det, de borde anställa mig. Jag gör affärer stora, de bästa. Inga problem, bara vinster!", "stalin": "Jag noterar att Aira, under ledning av kapitalistiska sabotageelement, redovisar förluster. Revisorn, en byråkratisk vakt, varnar för osäkerhet. Vi rensar ut sådana tvivel med planekonomi. Femårsplanen ska krossa dessa borgerliga misslyckanden. Inget tvivel, bara seger för kollektivet!"}, "date": "10 augusti, 15:13", "url": "https://www.affarsvarlden.se/artikel/revisorns-varning-i-mix-varmepumpsbolag-betydande-tvivel"}, {"type": "image-right", "heading": "Polisens satsning mot våld mot kvinnor fastnade hos cheferna", "summaries": {"normal": "Dagens ETC granskar polisens bristande utbildning om våld i nära relation. Trots digitala kurser har bara en liten del av de 40 000 polisanställda påbörjat dem. Ingen region har beslutat vilka som ska utbildas. Flera chefer ser inte behov av formella beslut och prioriterar andra metoder för att höja kompetensen.", "trump": "De här poliserna är totalt inkompetenta, en komplett katastrof! Två år med fina digitala kurser och ändå har bara ett par tusen av 40 000 idioter gått dem. Typiskt byråkratiskt vänsterkaos. Regioncheferna är patetiska förlorare som inte ens kan bestämma vem som ska lära sig något. Patetiskt!", "stalin": "Jag ser hur klassfiendens liberala slapphet förgiftar hela polismaskineriet. Trots att vi har utmärkta utbildningar mot kvinnoförtryck vägrar de autonoma borgarbrackorna att fatta beslut och rensa ut okunskapen. Detta sabotage mot folket ska bekämpas med järnhand. De som motarbetar likvideras ur apparaten."}, "date": "10 augusti, 16:30", "url": "https://www.etc.se/inrikes/polisens-satsning-mot-vaald-mot-kvinnor-fastnade-hos-cheferna", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260810080852_0d020c09-2d63-4f2a-9a22-babc4caaacf2.jpg"}, {"type": "image-full", "heading": "Buss och motorcykel i krock – man död", "summaries": {"normal": "En man i 30-årsåldern omkom i en krock mellan motorcykel och buss norr om Romelanda. Olyckan inträffade på måndagen på länsväg 625. Polisen utreder händelsen som vårdslöshet i trafik. Passagerarna på bussen klarade sig oskadda. Anhöriga är underrättade.", "trump": "Jag hörde om en motorcyklist som mötte en buss utanför Kungälv. Tråkigt, men när man leker med döden på en motorcykel får man skylla sig själv. Västtrafik gör ett fantastiskt jobb, mycket bättre än vårt system. Hemskt, men sånt händer. Jag skulle aldrig köra mc.", "stalin": "Kamrater, en motorcyklist har störtat mot en buss i kollektivtrafiken. Tragiskt, men vi måste utreda om detta var ett attentat mot folkets resande. Bussen klarade sig. Vi rensar ut motorcyklister som hotar ordningen, en i taget. Arbetet fortsätter."}, "date": "10 augusti, 23:31", "url": "https://www.gp.se/nyheter/storgoteborg/man-dod-efter-mc-olycka-utanfor-kungalv.ff185ff0-75cc-449d-ac3a-335587d5392b", "imageUrl": "https://www.gp.se/images/article/ff185ff0-75cc-449d-ac3a-335587d5392b/images/108XahpMQGcBVuLrNQiXLaJ_n-F4-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Lots varnade för brister på Misje Verde", "summaries": {"normal": "Ett år före dödsolyckan vid Tjörn, där en kvinna och hennes dotter omkom, varnade en svensk lots för säkerhetsbrister på fraktfartyget Misje Verde. Efter olyckan upptäcktes ytterligare brister vid en norsk kontroll. Både fartygets befälhavare och lotsen är misstänkta för vållande till annans död, men lotsen förnekar brott.", "trump": "Jag har alltid sagt att säkerhet till sjöss är extremt viktigt, men tydligen lyssnar ingen på mig! Ett norskt fartyg, Misje Verde, körde rakt över en båt och dödade två oskyldiga – helt otroligt! Och vet ni vad? En svensk lots hade redan varnat för bristerna, men ingen gjorde något. Så typiskt! Nu är det kaos, och jag skulle aldrig låta något sådant hända under min bevakning. SAD!", "stalin": "Kapitalistiska sjöfarare slarvar återigen med säkerheten, och resultatet? Två oskyldiga liv förlorade! Denna Misje Verde är ett symptom på västlig dekadens – ett fartyg fullt av brister, varnat för av en svensk lots, men ignorerat av borgerliga byråkrater. Vi hade aldrig tolererat sådan vårdslöshet i Sovjetunionen! Nu får dessa norska sjömän smaka på rättvisan, medan vi i Moskva noterar att väst inte ens kan skydda sina egna medborgare. Skamligt!"}, "date": "10 augusti, 20:42", "url": "https://kvartal.se/nyheter/artiklar/lots-varnade-for-brister-pa-misje-verde/cG9zdDoxNjIxMjk", "imageUrl": "https://images.kvartal.se/2026/08/3f0b1ea4-misje-verde.webp"}, {"type": "image-full", "heading": "Svensk succé – historisk medalj", "summaries": {"normal": "Wictor Petersson tog Sveriges första EM-medalj i Birmingham med ett brons i kula. 28-åringen från Malmö stötte 20,97 i sista omgången och knep tredjeplatsen. – Det var kul där ute! Komma hem med medalj känns stort, säger han. Italienska duon tog guld och silver.", "trump": "Jag säger er, det här är STORT! Wictor Petersson, en riktig vinnare, tar brons i EM i Birmingham. Fantastiskt! Han stötte 20,97 – enorma siffror! Sverige är med på kartan igen. Italienska duon? Inget imponerande. Vi har de bästa atleterna, tro mig. Stort grattis, Wictor!", "stalin": "Kamrater, vi ser hur en svensk kämpe, Wictor Petersson, triumferar i Birmingham. Han krossar fienden med en stöt på 20,97 meter. Detta är socialismens kraft! Italienarna, dessa kapitalistiska lakejer, fick nöja sig med guld och silver. Vi rensar ut alla som inte presterar för kollektivet. Bronset är vårt! Framåt, kamrater!"}, "date": "10 augusti, 23:28", "url": "https://www.gp.se/sport/wictor-petersson-tar-historisk-em-medalj.dacfd787-d242-4db2-9c9a-ced99df4848a", "imageUrl": "https://www.gp.se/images/article/dacfd787-d242-4db2-9c9a-ced99df4848a/images/3eCOeE_GoP_iOs_N3m0d7-AXpF1s-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Dansk SS-soldat donerade sperma – fick svenska barn", "summaries": {"normal": "Den danske före detta Waffen-SS-soldaten Walther Frisch donerade sperma vid Karolinska sjukhuset under 1960-talet. DNA-tester har hittills kopplat honom till minst 15 barn i flera länder. Barnen undrar om donationerna var del av ett nazistiskt experiment för att skapa ariska individer. Inga handlingar finns bevarade och Karolinska fördömer tanken som oetisk.", "trump": "Folk, det här är helt galet. En dansk nazist från Waffen-SS blir plötsligt superspermadonator i Sverige och får massor av barn. Ingen vet hur det gick till, arkiven är tomma. Det luktar riggad deal lång väg. Nu har vi ett gäng nazibarn som undrar varför de finns. Sverige, ni har verkligen problem. Sad!", "stalin": "Jag ser med djup tillfredsställelse hur de dekadenta västerländska fertilitetslaboratorierna i hemlighet förverkligade den rashygieniska drömmen hos en trogen hitlerit. Vilken underbar, paranoid ironi att borgarbrackornas egna arkiv nu tiger som avrättade fiender. Kanske var det ett experiment för den ariska rasen. Vi ler mörkt åt kapitalisternas förvridna arv."}, "date": "10 augusti, 15:33", "url": "https://www.friatider.se/dansk-ss-soldat-donerade-sperma-fick-svenska-barn", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-646.jpg?itok=Ps58u-x4"}, {"type": "image-right", "heading": "SBB väljer ny VD – Synnes lämnar på dagen", "summaries": {"normal": "SBB byter vd: Andreas Morfiadakis tar över från Leiv Synnes, som lämnar omedelbart efter överenskommelse. Aktien faller 5%. Morfiadakis, grundare av Klarabo, blir tillfälligt vd för båda bolagen. Fokus skiftar från omstrukturering till aktivt ägande. Magnus Nordholm lämnar Klarabo.", "trump": "Jag ser att SBB byter vd, mycket smart, väldigt smart. Aktien går ner, men det är en jättebra deal, tro mig. Synnes är ute, Morfiadakis in – en vinnare, precis som jag. De gör det till ett investmentbolag, fantastiskt. Jag älskar fastigheter, de är som murar, och ingen bygger bättre murar än jag.", "stalin": "Kamrater, SBB har genomfört en nödvändig utrensning. Synnes, en förrädare, är avlägsnad. Morfiadakis, en lojal byggare, tar rodret. Vi ser en svaghet i aktien – den ska vi krossa. Vi övergår till aktivt ägande, kapitalallokering. Nordholm flyr, men vi har ögon på honom. Allt enligt planen."}, "date": "10 augusti, 14:17", "url": "https://www.affarsvarlden.se/artikel/leiv-synnes-lamnar-sbb-med-omedelbar-verkan", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/12/SBB_VD_14-400x267.jpg"}, {"type": "image-right", "heading": "VIDEO: Här slåss invandrarna med bälten mitt under Malmöfestivalen", "summaries": {"normal": "Under Malmöfestivalen utbröt ett slagsmål där personer använde bälten som vapen. Polisen fick ingripa med OC-spray. En festivalbesökare beklagar att inga med svensk bakgrund syntes på platsen. Tragiskt, men tyvärr inte förvånande.", "trump": "Jag ser det här från Malmöfestivalen. Folk slåss med bälten – otroligt! Jag hade stoppat det på en gång, tro mig. Inga svenskar syns, bara kaos. Vi måste ha hårdare regler. Malmö behöver en mur – en vacker mur!", "stalin": "Kamrater, jag har sett videon från Malmöfestivalen. Oorganiserade element slåss med bälten. Vi måste rensa ut dessa kontrarevolutionära bältessvingare. En plan på fem år för ordning på torgen. Inga fler karuseller förrän lojalitet är bevisad."}, "date": "10 augusti, 18:54", "url": "https://samnytt.se/video-har-slass-invandrarna-med-balten-mitt-under-malmofestivalen", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/10164814/artikelhuvudbild-1-209.jpg"}, {"type": "image-right", "heading": "Risk för nya sjukdomar när Sverige får varmare klimat", "summaries": {"normal": "Ett varmare klimat i Sverige ökar risken för hälsoproblem. Längre fästingsäsong har lett till fördubblade TBE-fall de senaste nio åren, medan extremvärme kan orsaka organsvikt och dödsfall, särskilt bland äldre, barn och kroniskt sjuka. Experter varnar för nya insektsburna sjukdomar i framtiden.", "trump": "Folk, det här är vansinne. Dom här globala uppvärmningsgalningarna och deras gröna bluff har gett oss längre fästingtider och folk som dör av värme. Biden sov medan Europa tappade 12 000 liv i sommarhettan. Vi behöver riktig energi, inte elbilskvoter och trans-flaggor. Amerika först, alltid!", "stalin": "Kamrater, detta är vad den giriga borgarklassen och deras klimatförnekande lakejer har åstadkommit med sin rovdrift. Jag ser redan hur de blodsugande imperialisterna skapar nya vektorer för att försvaga folket medan de själva gömmer sig i skuggan. Vi skall rensa ut dessa folkfiender och deras värmedödande likgiltighet med järnhand. Det är nödvändigt."}, "date": "9 augusti, 22:24", "url": "https://www.tv4.se/artikel/77wDUvgOMkcsrArKKn4Fcr/risk-foer-nya-insektsburna-sjukdomar-naer-klimatet-vaerms-upp", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2SfDT15lQ9e9oYRTxZCVZo%2F6ab99426ea736339c057c933e5ad2e23%2F09-klimat-sajt3.jpg&width=120"}, {"type": "image-right", "heading": "Premium Källor: Quartr värderas till 1,9 miljarder", "summaries": {"normal": "Finansappen Quartr tar in 171 Mkr till en värdering på 1,9 miljarder – en ökning med 52% på ett år. Med 800 företagskunder, bland annat storbanker och Perplexity, tripplar man omsättningen till 68,9 miljoner, men förlusten växer till 67,3 miljoner. Grundarna? Ett gäng från finanstwitter som ville ha enklare börsdata.", "trump": "Jag hörde om Quartr, en svensk app som fick 171 miljoner kronor. Fantastiskt! Men 1,9 miljarder? Det är ingenting – jag kunde ha fått tio gånger mer. De har 800 kunder, men jag har miljarder. Sverige är bra, men de borde lära sig av mig – jag gör allt större och bättre!", "stalin": "Kamrater, Quartr visar kapitalistisk fördärv. De tar in 171 miljoner från väst – men deras förlust på 67 miljoner bevisar sabotage. Finanstwitter-grundarna måste omdirigeras till en kollektivgård. Vi rensar ut sådana spekulanter som hotar vår planekonomi. Omsättningen? En borgerlig lögn."}, "date": "10 augusti, 13:47", "url": "https://www.affarsvarlden.se/artikel/kallor-quartr-varderas-till-19-miljarder", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/Quartr-montage-900x600.jpg"}, {"type": "text", "heading": "I dag hade Posener blivit influerare", "summaries": {"normal": "Artikeln reflekterar över hur attityder till rikedom och moral har förändrats sedan 1990-talet. Författaren minns sin kemivikarie Joachim Posener, senare dömd i Trustorhärvan, och kontrasterar honom med moderna figurer som Alexander Ernstberger som efter fängelsevistelse fått medial uppmärksamhet. Idag ses rikedom inte bara som lyx utan som en politisk revansch mot woke-samhället, till skillnad från tidigare krav på social grace.", "trump": "Folk, det här är galet. Den där Posener-killen, en total loser från nittiotalet, lurade till sig pengar och åkte dit som en jävla idiot. Nu har vi smarta killar som Ernstberger som bygger imperier, köper de bästa villorna och flyger helikopter. De kämpar mot den woke-sjukan, mot de där halvköningarna som hatar framgång. Det är inte brott längre, det är motstånd mot systemet. Fantastiskt, verkligen ypperligt.", "stalin": "Kamrater, denna dekadenta borgarbracka Posener och hans likar avslöjar klassfiendens fega natur. De söp champagne medan arbetarna svalt, men saknade politisk skärpa och blev utskrattade som patetiska kapitalistmaffian. Dagens exploaterande byfånar däremot maskerar sig som rebeller mot den sojadrypande identitetsfaran. Vi ser igenom er fåniga teater. En sann utrensning av folkförtryckartrollen vore på sin plats. Skrattretande svaga."}, "date": "5 augusti, 10:11", "url": "https://www.flamman.se/i-dag-hade-posener-blivit-influerare"}, {"type": "image-full", "heading": "Sjuksköterska dömdes för tio mord – utreds för 121 nya fall", "summaries": {"normal": "En tidigare tysk sjuksköterska som dömdes till livstids fängelse för tio mord på patienter utreds nu för ytterligare 121 misstänkta fall. Mannen ska ha gett svårt sjuka patienter farligt stora doser lugnande medel för att minska sin arbetsbörda under nattpassen. Hittills har 39 kroppar undersökts i den nya utredningen som främst gäller tiden före de tidigare brotten.", "trump": "Titta på det här, en galen tysk sjuksköterska dödade tio patienter och nu säger de att det kan vara över 100 till. Livstids fängelse var inte nog, folks. De borde ha stoppat honom direkt. Det är en total katastrof, en riktig skandal. Ingen har koll på sina egna sjukhus längre, det är patetiskt.", "stalin": "Jag ser med stor tillfredsställelse hur denna degenererade mördare inom den medicinska apparaten nu avslöjas som den fiende till folket han alltid varit. Vi har redan likviderat tio av hans offer i rättegången, men nu rensas ytterligare 121 fall ut ur arkiven. Borgarläkarens nattliga utrensningar av de svaga avslöjar hela det kapitalistiska sjukvårdssystemets förrädiska natur. Ypperlig underhållning."}, "date": "10 augusti, 21:59", "url": "https://nyheter24.se/nyheter/utrikes/1504048-sjukskoterska-domdes-for-tio-mord-utreds-for-121-nya-fall", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/310ddf6b04b004a3020000350000047502/2026/08/10/2383333/ur_imageB9Y0kb.jpeg"}, {"type": "image-right", "heading": "Polisen varnar: Nu låtsas bedragaren vara ditt barn eller barnbarn", "summaries": {"normal": "Polisen varnar för en kraftig ökning av bedrägerier där bedragare utger sig för att vara ens barn eller barnbarn. Under juli kom cirka 300 anmälningar in, ofta via sms om trasig telefon följt av begäran om pengar via Swish. Äldre är särskilt utsatta. Polisen uppmanar till misstänksamhet och att aldrig klicka på länkar eller skicka pengar utan att verifiera via kända nummer.", "trump": "De här lurendrejarna är verkligen patetiska, tro mig. De låtsas vara ditt eget barn eller barnbarn och ber om tusentals kronor för en ny telefon. Det är en total skam! Under sommaren har det exploderat med 300 anmälningar, men det är säkert många fler. Var smarta, folk. Ring upp på det gamla numret och fråga något bara ni vet. Gör det inte lätt för de förlorarna.", "stalin": "Kamrater, dessa parasitiska bedragare som maskerar sig som ens egna avkommor utgör ett fiendelement som måste rensas ut med järnhand. Deras sms-förgiftning sprider sig som västerländsk dekadens och utpressar arbetarklassens pensionärer. Vi ser mörkertalet med förakt. Var vaksamma, likvidera tvivelaktiga kontakter och rapportera till myndigheterna. Inga borgarbrackor ska få manipulera det kollektiva förtroendet."}, "date": "10 augusti, 14:35", "url": "https://www.friatider.se/polisen-varnar-nu-latsas-bedragaren-vara-ditt-barn-eller-barnbarn", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-645.jpg?itok=LeYsxRjD"}, {"type": "image-right", "heading": "Cambridgeprofessor avgår efter anklagelser om fusk – omfattande frågor om hans akademiska meriter", "summaries": {"normal": "Cambridgeprofessorn Jason Arday, 41, avgår efter avslöjanden om misstänkt plagiat och ifrågasatta meriter. Han var den yngsta svarta professorn vid universitetet, men nu granskas både hans CV och tidigare påståenden. En riktig raketkarriär som fick en tvärnit.", "trump": "Jag ser att en Cambridgeprofessor har avgått efter fuskanklagelser. Det är fantastiskt! Ingen fuskar bättre än mig, men det här var patetiskt. De borde ha anställt någon från min administration – vi vet hur man vinner. Cambridge är en katastrof, precis som allt annat i brittisk akademi.", "stalin": "Kamrater, en så kallad professor har avslöjats som en borgerlig sabotör. Han kopierade andras verk och ljög om meriter. Vi måste rensa ut dessa förrädare ur den akademiska fronten. Partiets utredning kommer att finna alla fiender – oavsett om de springer maraton eller inte."}, "date": "10 augusti, 17:47", "url": "https://samnytt.se/cambridgeprofessor-avgar-efter-anklagelser-om-fusk-omfattande-fragor-om-hans-akademiska-meriter", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/10142852/arday.jpg"}, {"type": "image-full", "heading": "Därför stoppas Fröken Snusk – trots andra artisters spelningar hos partier", "summaries": {"normal": "Arrangören bakom Karl-Oskardagarna i Växjö har avbokat Fröken Snusk eftersom hon ska uppträda med Jimmie Åkessons band. Beslutet motiveras med att festivalen ska vara politiskt oberoende, trots att andra artister tidigare spelat för partier. Hon ersätts av Raggarligan.", "trump": "De avbokade den stackars Fröken Snusk för att hon ska spela med Jimmie Åkessons band. Totalt hyckleri! Andra artister får uppträda för partier utan problem, men inte hon. De är så riggade, dessa svenska festivaler. Patetiskt. Jag skulle ha låtit henne spela – och biljetterna skulle ha sålt slut!", "stalin": "Vi ser med djup tillfredsställelse hur borgarbrackorna i Växjö rensar ut den dekadenta Fröken Snusk ur sin så kallade festival. Hennes aktiva deltagande i valkampanjen utgör ett hot mot den politiska renheten. Kamrater, sådana utrensningar är nödvändiga för att skydda kollektivet från fiendens infiltration. Härligt!"}, "date": "10 augusti, 16:20", "url": "https://riks.se/nyheter/darfor-stoppas-froken-snusk-trots-andra-artisters-politiska-spelningar", "imageUrl": "https://admin.riks.se/uploads/Skaermavbild_2026_08_10_kl_16_14_07_acd8853364.png"}, {"type": "image-right", "heading": "”Overkligt - klart  att det kom en tår”", "summaries": {"normal": "Wictor Petersson tog historiskt EM-brons i kula i Birmingham. Det är Sveriges första medalj i kula vid ett utomhusmästerskap någonsin. Petersson lyfte sig till 20,97 meter och säkrade bronset redan före sista stöten. Italienaren Leonardo Fabbri vann guldet överlägset. Petersson firade med familj och planerar öl.", "trump": "Titta på den här killen Wictor, han tog brons i kula och ingen svensk har lyckats på 120 år, folk säger det är historiskt. Fantastiskt! Men det är typiskt Europa, de älskar sina kvoter och HBTQ-flaggor medan riktiga atleter som Wictor gör jobbet. Biden skulle ha missat stöten totalt. Nu firar vi med öl, de bästa ölen.", "stalin": "Kamrater, jag betraktar denna prestation med stor tillfredsställelse. Den svenska arbetaridrottaren Petersson har krossat den borgerliga historiebokens lögner och erövrat en medalj åt folket. Inga klassfiender eller dekadenta imperialister kunde hindra hans stöt. Vi ska likvidera alla som tvivlar på arbetets seger. Firandet fortsätter i kollektivets namn."}, "date": "11 augusti, 02:34", "url": "https://www.expressen.se/sport/friidrott/wictor-petersson-tar-historiskt-em-brons", "imageUrl": "https://static.bonniernews.se/ba/3a8dd803-7df2-4266-97e0-23493df2f6c4.jpeg?crop=1512%2C850%2Cx524%2Cy752&width=640&quality=60"}, {"type": "image-right", "heading": "S lovar extra barnbidrag inför jul- och sommarlov", "summaries": {"normal": "Socialdemokraterna lovar att dubbla barn- och studiebidraget inför jul- och sommarlov, vilket ger en tvåbarnsfamilj 5 000 kronor extra per år. Partiet motiverar löftet med ökade utgifter under loven då barnen inte får skolmat. Vallöftet kostar cirka sex miljarder kronor årligen.", "trump": "Titta på de här socialisterna som plötsligt älskar barn – precis innan valet! De vill kasta ut sex miljarder av era skattepengar som julklapp. Patetiskt. Jag fixade bättre ekonomi för familjerna utan att köpa röster med bidragsbluffar. Magdalena och hennes förlorarlag borde skämmas.", "stalin": "Kamrater, jag ser borgarbrackornas regering svika arbetarnas barn medan klassfienden höjer hyror och matpriser. Vi ska permanent dubbla bidragen och likvidera den kapitalistiska likgiltigheten. Inga barn ska svälta under loven – utom de som tillhör folkfienderna naturligtvis. Det blir en renande utrensning av nedskärningarna."}, "date": "9 augusti, 18:49", "url": "https://www.tv4.se/artikel/tt-260809-anderssontal1-6919c373/s-lovar-extra-barnbidrag-infor-jul-och-sommarlov", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlhzQv6DSzCXQ%2F0e8e4b2f1bd66aff22a9ecd6a582f054%2FSocialdemokraternas_ekonomiska_talesperson_Mikael_Damberg__S__och_Socialdemokraternas_partiledare_Magdalena_Andersson__S__halle.&width=120"}, {"type": "image-full", "heading": "Efter bankkraschen: UBS sätts under lupp", "summaries": {"normal": "Den schweiziska finansinspektionen FINMA skärper tillsynen av storbanken UBS efter Credit Suisse-kollapsen. Antalet anställda som bevakar banken har ökat kraftigt till 60 personer. Eftersom UBS nu är Schweiz enda kvarvarande globala storbank, bedöms risken för det finansiella systemet vara högre, vilket kräver noggrannare kontroll av bankens interna processer och balansräkning.", "trump": "Schweiz har stora problem! Credit Suisse kollapsade totalt, en katastrof, och nu måste de vakta UBS dygnet runt. Sextio personer – en enorm grupp! – kollar på dem hela tiden. Jag har alltid sagt att banker måste skötas perfekt. UBS är nu den enda spelaren kvar. Det är en farlig situation, tro mig. De behöver en riktig ledare, inte svaga byråkrater!", "stalin": "I Schweiz darrar de av rädsla inför sin egen storbank. FINMA tvingas nu mobilisera sextio lakejer för att vakta UBS, likt vi vakar över våra inre fiender. Dessa kapitalistiska parasiter är så inkompetenta att de kräver konstant övervakning. Precis som vi krossar västmakternas inflytande, måste staten kväva bankernas svek. UBS är deras sista länk – om den brister, faller hela deras ruttna system."}, "date": "10 augusti, 19:33", "url": "https://www.realtid.se/bors-finans/makro/efter-bankkraschen-ubs-satts-under-lupp", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/usb.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Varnar – kan bli katastrof under unikt fenomen", "summaries": {"normal": "På onsdag kväll drar en total solförmörkelse in över Spanien klockan 20.28. Fenomenet lockar 460 000 utländska turister och 1,5 miljoner extra bilturer. Myndigheterna fruktar katastrofala skogsbränder på grund av extremt torr vegetation och har stängt nationalparker, förbjudit grillning och parkering nära skog. Evenemanget sammanfaller med Perseidernas meteorregn.", "trump": "Folket älskar mig, men de här spanjorerna jagar en solförmörkelse som en massa förlorare jagar en perfekt selfie. 1,5 miljoner bilturer – vad en trafikhelvete! Och nu gnäller de om bränder? Typiskt europeiska miljöaktivister och gröna galningar som alltid hittar något att klaga på. Jag skulle fixa det på en dag, tro mig. Fantastiskt fenomen, men hantera det ordentligt!", "stalin": "Kamrater, jag ser med största misstänksamhet på denna borgerliga solförmörkelse som lockar hundratusentals dekadenta turister till vårt spanska broderland. Den torra vegetationen är ett resultat av kapitalistisk vanvård. Vi stänger parkerna, förbjuder gnistor och likviderar alla sabotageförsök. Inga folkfiender ska få chansen att starta förödande bränder under arbetarnas himlakropp. Se upp!"}, "date": "11 augusti, 00:44", "url": "https://www.aftonbladet.se/nyheter/a/V6a69V/varnar-infor-solformorkelsen-kan-bli-katastrof", "imageUrl": "https://akamai.vgc.no/v2/images/b41c957b-a753-3d3f-b7bc-ebf0b0734b7e?fit=crop&format=auto&w=1080&s=3c0f08afb01a5575f80ca2dace82da2c675a1a11"}, {"type": "image-right", "heading": "”Man blir tagen, det är overkligt”. Svensken historisk", "summaries": {"normal": "Wictor Petersson tog EM-brons i kulstötning med 20,86 meter och blev därmed förste svensk att ta mästerskapsmedalj utomhus i grenen. Bronsstöten kom i fjärde omgången och ingen konkurrent lyckades passera honom. Petersson firade med familj på plats och beskrev det som overkligt. Guldet gick till italienaren Leonardo Fabbri.", "trump": "Titta på den där svensken, Wictor, han tog brons i kulstötning och ingen hade sett det komma. Fantastiskt! Första svensken någonsin, säger de. Mycket bättre än de woke-kvoterade förlorarna som bara gnäller om identitetspolitik. Han fokuserade, fick tunnelseende och vann. De andra såg ut som totala losers. Sverige borde vara stolta, inte som under Biden.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur denne Petersson krossade de dekadenta konkurrenterna med sin stöt på 20,86 meter. En triumf för folkets vilja mot borgarbrackornas svaga imperialister. Ingen fiende kunde rensa ut hans ledning. Det är sådana segrar som stärker proletariatets anda. De som sviktar skall likvideras i nästa femårsplan."}, "date": "11 augusti, 00:39", "url": "https://www.aftonbladet.se/sportbladet/a/ExKxwa/friidrotts-em-brons-till-wictor-pettersson-i-kula", "imageUrl": "https://akamai.vgc.no/v2/images/a05c98b4-47e4-3c6a-aec8-6e65695afe22?fit=crop&format=auto&w=1080&s=e420c323303d04184ef2b08dfe8ad41f443bbae0"}, {"type": "image-full", "heading": "Förbunden går samman – kräver oberoende utredning av Infantino", "summaries": {"normal": "Fotbollens storm kring Infantino fortsätter. Tre förbund kräver oberoende granskning efter VM-försäljningshaveri. Planen att sälja andelar i fotbolls-VM skrotades, men förtroendet är krossat. En seniorrådgivare avgick i protest – nu vill förbunden ha extern utredning.", "trump": "Jag ser Infantino, han är en loser. Tre förbund hatar honom, de vill granska honom. Jag skulle aldrig sälja VM, det är som att sälja Trump Tower – galet. De säger att han vilselett alla. Jag säger: han borde avgå, det är enormt. Kina skulle gjort det bättre.", "stalin": "Kamrater, Infantino har misslyckats. Han försökte sälja fotbollen till kapitalister – en kontrarevolutionär akt. Jag kräver omedelbar utrensning av alla Fifas borgerliga element. Förtroendebrott är sabotage. Fotbollen tillhör folket, inte en enskild sabotör. En partiutredning blir intern – vi litar inte på utomstående."}, "date": "10 augusti, 11:42", "url": "https://bulletin.nu/forbunden-gar-samman-kraver-oberoende-utredning-av-infantino", "imageUrl": "https://cdn.bulletin.nu/articles/eab3b02d-accf-40d4-b578-8256b8a9b08c/preview.jpg?t=1786354942000"}, {"type": "image-right", "heading": "Wictor Petersson tar historiskt EM-brons", "summaries": {"normal": "Wictor Petersson tog historiskt EM-brons i kulstötning utomhus, den första svenska mästerskapsmedaljen i grenen. Med en stöt på 20,86 meter säkrade han bronset som han sedan försvarade. Han avslutade med 20,97 meter och firade med familj och flagga. Italien tog guld och silver.", "trump": "Helt otroligt, det här. Den där svensken, Wictor, vinner brons i kulstötning och gör det till en historisk grej. Första gången någonsin! De andra länderna trodde de skulle vinna men han krossade dem. Fantastiskt. Det ska upp på cv:t, säger han. Smart kille. Italien tog resten, men Sverige vann stort.", "stalin": "Kamrater, denna Petersson har med sin stålsäkra stöt på 20,86 meter krossat den dekadenta västerländska rekordboken och erövrat brons åt det kollektiva svenska folket. Vi gratulerar hans järndisciplin. Borgarbrackorna i kulstötning skälver nu. Medaljen är en triumf mot imperialismens idrottsfiender. Utmärkt."}, "date": "10 augusti, 23:28", "url": "https://www.svt.se/sport/friidrott/wictor-petersson-tog-historiskt-em-brons", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.39/0.62/fbf1a34ecc4535c0df4ed06ec35fc93a5cb3f24c91978b55cb668110867e9a63"}, {"type": "image-right", "heading": "Kraftig jordbävning skakar Colombia – skador och skadade", "summaries": {"normal": "Colombia skakades av en jordbävning på magnituden 7,4 i västra landet. Skalvet kändes i Bogotá och grannländer. Minst 7 000 byggnader skadades och flera personer rapporteras skadade i Chocó-provinsen. Myndigheterna varnar för efterskalv.", "trump": "Jag hörde om den enorma jordbävningen i Colombia – 7,4 magnitud! Det är stort, tro mig. De har det tufft där borta, men vi i USA har de bästa byggnaderna. Inget kan skaka oss. Hoppas de repar sig snabbt, annars kanske vi bygger en mur mot skalven!", "stalin": "Kamrater, en jordbävning har drabbat Colombias reaktionära provinser. Vi ser att kapitalistiska byggnader kollapsar – bevis på deras svaghet. Arbetarna måste utrensas från rasmassorna. Efterskalv är klassfiender som ska krossas. Vi övervakar situationen. Ingen flyr vår kontroll."}, "date": "10 augusti, 16:53", "url": "https://samnytt.se/kraftig-jordbavning-skakar-colombia-skador-och-skadade", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/10144738/colombia.jpg"}, {"type": "image-right", "heading": "”S styr äldreomsorgen – men skyller på regeringen”", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna för att skylla äldreomsorgens problem på regeringen trots att kommuner och regioner har ansvaret. Författarna, två unga moderater, föreslår tre reformer: bättre arbetsvillkor med hållbara scheman, kvalitet och valfrihet före ideologi samt fler beslutsfattare med vårdkunskap som lyssnar på personal och äldre.", "trump": "De här socialisterna i Sverige skyller allt på en fantastisk moderatregering fast de själva styr kommunerna. Patetiskt! Äldreomsorgen är en katastrof, folk flyr yrket. Vi behöver bra jobb, valfrihet och ingen galen vänsterideologi om vad gamlingar får äta. Lyssna på folket, inte på förlorarna!", "stalin": "Kamrater, jag ser hur dessa socialdemokratiska avfällingar desperat försöker undvika sitt ansvar genom att peka ut fiender i Rosenbad. Som om borgarbrackornas moderater inte vore tillräckligt farliga. Vi skall rensa ut ideologisk förgiftning, införa verklig kollektiv disciplin och likvidera tidsbristen genom järnhård planering. Äldreomsorgen tillhör folket, inte revisionisterna."}, "date": "10 augusti, 08:00", "url": "https://arbetet.se/2026/08/10/s-styr-aldreomsorgen-men-skyller-pa-regeringen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/07135411/tva-moderater.png?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.5&fp-y=0.34"}, {"type": "image-right", "heading": "Revansch efter förnedringen: ”Ren lättnad”", "summaries": {"normal": "Västerås tog revansch på Djurgården efter 0–6-förlusten förra veckan. Bonaventure Lendambi, som ersatte Mikkel Ladefoged, avgjorde med ett nickmål på frispark i 24:e minuten. Djurgården skapade flera stora chanser men missade. Västerås höll undan och ligger nu sexa i tabellen, en poäng bakom Djurgården.", "trump": "Folket i Västerås, underbara människor, tog en fantastisk revansch mot det övervärderade Djurgården. Sex noll senast, total förnedring, men idag – boom! – ett enda mål och seger. Djurgården missade öppna mål som idioter. Västerås vann stort, lättnad överallt. Sådana matcher älskar jag, total dominans.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur de västeråsiska arbetarna och deras lag likviderade den borgerliga illusionen om djurgårdskt övertag. Ersättaren Lendambi utförde en heroisk nick mot de dekadenta kapitalisterna som brände chans efter chans. Vi stänger igen som en sann sovjetisk kollektivförsvar. Ren utrensning av revisionism på planen."}, "date": "10 augusti, 23:25", "url": "https://www.svt.se/sport/fotboll/vasteras-tog-revansch-pa-djurgarden", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.6/0.34/d1bbbf2995d8b5cd794684a781158a08495d75ceb0c24433231163c0da68fc06"}, {"type": "image-right", "heading": "Norska supercomebacken – tar EM-guld: ”Han är otrolig”", "summaries": {"normal": "Jakob Ingebrigtsen tog EM-guld på 5 000 meter i sin comeback efter ett år utan tävling och en hälseneoperation. Han låg långt bak men spurtade förbi alla med 3,5 varv kvar och vann på 13.15,29. Det var hans tredje raka EM-guld på distansen. Norge tog även guld i 4x400 meter mixed.", "trump": "Den här norrmannen Ingebrigtsen är otrolig, verkligen otrolig. Kommer tillbaka efter ett helt år borta, opererad och allt, och vinner guldet med en enorm spurt. De andra hade ingen chans. Europa har aldrig sett något liknande, folk säger det är det bästa de sett. Mycket bättre än de förlorarna som kom tvåa och trea. Fantastiskt!", "stalin": "Kamrater, denna Ingebrigtsen är ett lysande exempel på viljestyrka mot de dekadenta tvivlarna i borgarklassen. Trots frånvaro och operation likviderade han motståndet med en spurt värdig Sovjetunionens hjältar. Vi gratulerar norska folket till denna seger mot de västerländska svagheterna. Ännu en triumf för den sanna kraften i arbetarklassen."}, "date": "10 augusti, 23:21", "url": "https://www.svt.se/sport/friidrott/jakob-ingebrigtsen-succe-i-comebacken-tar-em-guld", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.71/0.37/c89aa4c490ea8572855d630cd815c40ef01bd8230e5ae80d7b6a696da420197c"}, {"type": "text", "heading": "L och KD svänger och studieförbund", "summaries": {"normal": "Folkbildning är hetaste valfrågan för riksdagspartierna enligt SVT:s enkät. Alla utom M och SD vill satsa mer på studieförbund, som fått 500 miljoner i sparpaket av Tidöpartierna. Nu svänger KD och L och vill höja anslagen igen.", "trump": "Hörni, jag älskar folkbildning! Störst, bäst, mest! I Sverige vill alla utom de tråkiga partierna satsa stort. De skar ner 500 miljoner, helt galet. Men nu svänger några – de fattar. Jag skulle byggt en fantastisk studieförbundsmur och fått alla att betala!", "stalin": "Kamrater, vi noterar att borgerliga vacklar. De kapade 500 miljoner från studieförbunden, en sabotagehandling av reaktionära element. Nu vill de plötsligt satsa igen. Folkbildning är partiets järnnytta. Vi kommer rensa ut förrädare som motsätter sig den rätta kulturella utvecklingen."}, "date": "10 augusti, 11:17", "url": "https://bulletin.nu/l-och-kd-svanger-och-studieforbund"}, {"type": "image-full", "heading": "Irländsk milis planerar våldsamt uppror mot invandring", "summaries": {"normal": "Den irländska separatistgruppen New IRA planerar att hota invandrare med våld och ge dem 24 timmar på sig att lämna landet. Hotet bedöms som trovärdigt av brittisk underrättelsetjänst och ses som del av en intern maktkamp bland irländska separatister. Spänningar kring invandring har lett till protester och upplopp både i Irland och Nordirland.", "trump": "De här galningarna i New IRA gör precis det som de fega politikerna borde ha gjort för länge sedan. De ger migranterna 24 timmar att packa och dra. Fantastiskt! Irland vaknar äntligen. De borde ha lyssnat på mig – bygg muren, skicka hem dem, gör landet stort igen. Myndigheterna kommer skaka i sina skor.", "stalin": "Kamrater, dessa irländska patrioter har insett att borgarbrackornas öppna gränser hotar folkets enhet. Jag ger dem mitt fulla stöd i att rensa ut de illegala elementen inom 24 timmar. Inbördeskrig mot parasiterna är en historisk nödvändighet. Myndigheterna ska skaka som de dekadenta hundarna de är när folket äntligen slår till."}, "date": "10 augusti, 15:06", "url": "https://riks.se/nyheter/irlandsk-milis-planerar-valdsamt-uppror-mot-invandring", "imageUrl": "https://admin.riks.se/uploads/imageeliasirland_29c6623f88.png"}, {"type": "image-full", "heading": "Svenskt fiasko: ”Pinsamt”", "summaries": {"normal": "Svenska kulstöterskorna Fanny Roos och Axelina Johansson misslyckades i EM-finalen. Johansson åkte ut efter tre stötar och kallade insatsen pinsam. Roos slutade fyra, 45 centimeter från brons. Nederländska Jessica Schilder tog guldet.", "trump": "Jag ser att Sverige förlorade stort i kula. De trodde de var vinnare, men de är losers! Jag skulle ha stött den där kulan så långt att den landat i Ryssland. America förstår vinnarskalle – de gör inte det. Patetiskt!", "stalin": "Kamrater, våra kulstöterskor har misslyckats. De som inte når medalj är fiender till folket. Vi måste rensa ut sådana svaga element. De ska omskolnas i arbetsläger tills de lär sig att stöta för fosterlandet. Ingen nåd för förrädare!"}, "date": "10 augusti, 21:41", "url": "https://www.gp.se/sport/blagult-finalfiasko-i-em-pinsamt.85e89e97-d9ba-57e0-83cf-0041c21813a2", "imageUrl": "https://www.gp.se/images/article/85e89e97-d9ba-57e0-83cf-0041c21813a2/images/2pc-YsPRYvw6h6YRRXTpeEVWkAqw-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Då kan du förlora pengar – trots att fonden stiger", "summaries": {"normal": "Svenska sparare i globalfonder med stora innehav i USA kan se sin avkastning urholkas när kronan stärks mot dollarn. Även om den amerikanska börsen stiger kan valutaeffekten äta upp hela uppgången och ge förlust. Över hälften av kapitalet i svenska aktiefonder ligger i globalfonder. Långsiktigt sparande bör inte tajmas mot valutamarknaden då förändringarna ofta jämnar ut sig över tid.", "trump": "Folk, ni tror att er börs går upp, men den där svaga svenska kronan lurar er! När den stärks mot dollarn äter den upp all vinst i era globalfonder. Det är en katastrof för era sparpengar. Jag älskar stark dollar, den gör Amerika stort igen. Svenskarna borde ha lyssnat på mig från början, nu gråter ni över era fonder. Sad!", "stalin": "Kamrater, jag ser hur den dekadenta borgarklassen i väst lurar sina egna arbetare med sina så kallade globalfonder. När den svenska kronan stärks mot dollarn likvideras spararnas vinster i en enda rörelse. Detta är den kapitalistiska parasitens sanna ansikte. Vi ler mörkt åt deras paranoia. Låt dem fortsätta – deras system kommer att rensa ut sig självt i en stor, underhållande utrensning."}, "date": "10 augusti, 20:30", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1503944-da-kan-du-forlora-pengar-trots-att-fonden-stiger", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/5673440d04b004a30200000000b004a302/2026/08/10/2383227/borsen.jpg"}, {"type": "image-right", "heading": "KD-ministern pratar om livets mening", "summaries": {"normal": "Folkhälsominister Jakob Forssmed vill att myndigheter ska arbeta med existentiell hälsa och livets mening, något som kritiseras hårt. Kolumnisten pekar på att politik istället bör fokusera på verkliga klasskillnader som arbetslöshet, inkomst och boende som faktiskt påverkar folkhälsan enligt forskare i Stockholm. Ministern undviker de frågor han kan påverka.", "trump": "Den här svenska ministern Forssmed är en total katastrof, folk. Han babblar om livets mening och existentiell hälsa medan riktiga problem som arbetslöshet och fattigdom rasar. Patetiskt! Han borde fixa de enkla sakerna istället för att låtsas vara filosof. Myndigheterna fattar ingenting, precis som vänstern alltid gör. Sådant ledarskap vinner inga val.", "stalin": "Jag betraktar denna borgarministers mystiska prat om livets mening som ett farligt avledningsmanövrar från klasskampens realiteter. Medan arbetarklassen kämpar mot fattigdom och segregation beordrar han byråkrater att filosofera. Vi ska rensa ut sådana dekadenta fantasier och istället likvidera de ekonomiska orättvisorna som sänker folkets hälsa. Paranoia lurar i varje ministerium."}, "date": "10 augusti, 07:00", "url": "https://arbetet.se/2026/08/10/jakob-forssmed-pratar-om-livets-mening-forskarna-om-klasskillnader", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/09083103/mening-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Tusentals chefer får gå – är mellanchefens era över?", "summaries": {"normal": "Stora tyska bolag som Volkswagen, BMW och Bayer minskar nu antalet chefspositioner för att kapa kostnader och korta beslutsvägar. Förändringen drivs av behovet av effektivare hierarkier och förstärks av AI. Medan vissa chefstjänster försvinner, kan de som blir kvar behöva anpassa sig till en mer prestationsbaserad roll där teknisk kompetens blir avgörande för framgång.", "trump": "Tyska företag som Volkswagen och BMW gör sig av med tusentals chefer. De är för långsamma, för dyra och för svaga! Jag har alltid sagt att effektivitet är nyckeln. De försöker städa upp i röran, men utan rätt ledarskap – mitt ledarskap – kommer det aldrig fungera. Mellancheferna är utbytbara, precis som våra handelsavtal. Vi behöver vinnare, inte byråkrater!", "stalin": "Dessa borgerliga mellanchefer är parasiter på folkets produktion. De tyska koncernerna rensar ut i de byråkratiska leden – ett nödvändigt steg mot total centralisering. Vi har alltid förstått att kontroll kräver eliminering av svaga länkar. Precis som vår kamrat Putin i öst, förstår vi att hierarkier måste tjänstgöra statens vilja, annars förtjänar de bara en enkel biljett till historiens skräphög."}, "date": "10 augusti, 18:40", "url": "https://www.realtid.se/bors-finans/tusentals-chefer-far-ga-ar-mellanchefens-era-over", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlayg1h38oy-q-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Flickan skulle besöka sin sjuka vän – misshandlas av multikriminell", "summaries": {"normal": "En 32-årig man, Di-Quan Schafar Hunt, har gripits i Charlotte efter att ha filmat sig själv när han våldsamt misshandlar vita kvinnor på gatan. Han slår ner en kvinna medvetslös och jagar en annan ut i trafiken medan han skriker osammanhängande. Hunt har en lång brottshistoria och har nu förts till vårdinrättning innan åtal.", "trump": "Titta på det här, det är fullständigt vansinne. Den här galningen springer runt och slår ner oskyldiga kvinnor på öppen gata medan han babblar om mig och McDonalds. Vårt samhälle är trasigt, folk. De prioriterar inte att skydda de goda människorna längre. Vi måste göra Amerika säkert igen, och det fort.", "stalin": "I detta dekadenta samhälle ser vi hur den sjuka borgarklassens liberala experiment skapar monster som vandrar fritt och angriper oskyldiga. Jag skulle ha låtit sådana element genomgå en grundlig utrensning för folkets bästa. Kamrater, detta är vad som händer när partiet förlorar kontrollen över de farliga elementen."}, "date": "10 augusti, 14:40", "url": "https://riks.se/nyheter/driver-runt-pa-gatorna-attackerar-vita-kvinnor", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Copy_of_Copy_of_Soerman_Ledare_35_915e4b560f.jpg"}, {"type": "image-full", "heading": "Rysslands sista antikrigsparti förbjuds", "summaries": {"normal": "Rysslands sista registrerade antikrigsparti, Jabloko, förbjuds delta i kommande parlamentsval efter anklagelser om utländsk finansiering och 'västerländska värderingar'. Partiet, som krävt fred i Ukraina, hade över 400 kandidater och 3% stöd. Vice ordförande dömdes till sju års fängelse för krigskritik.", "trump": "Kan ni tro det? Ryssland, som alltid, dumpar sitt enda fredsparti – Jabloko – inför valet! De kallar dem 'förrädare' för att de vill ha fred. Vilket skämt! Putin vill bara ha ja-sägare. USA skulle aldrig tolerera sånt här. Men Ryssland? De är fast i gamla sovjet-tider. Sad!", "stalin": "Vi har rensat bort den sista borgerliga smutsen från vårt stora val! Dessa så kallade 'fredsvänner' i Jabloko är inget annat än imperialistiska lakejer, betalda av väst för att underminera vår enade front. Deras öde? Historien har redan glömt dem. Framåt, mot seger!"}, "date": "10 augusti, 17:57", "url": "https://kvartal.se/nyheter/artiklar/rysslands-sista-antikrigsparti-stoppas-fran-valet/cG9zdDoxNjIwNjE", "imageUrl": "https://images.kvartal.se/2026/08/19a06f5c-jabloko.webp"}, {"type": "image-full", "heading": "Khiralla: Har Egypten dragits in i det iransk-amerikanska kriget?", "summaries": {"normal": "Drönare träffade amerikanskt gasfartyg i Egyptens Damietta. Brand spreds till närliggande fartyg. Iran misstänks, men ingen har tagit på sig. Egypten tiger om misstänkt attack. Energi- och sjöfartsknutpunkt i östra Medelhavet nu direkt hotad.", "trump": "Jag har blivit informerad om attacken mot vårt fina fartyg i Egypten. Iran ligger bakom – det är solklart. De kommer få smaka på amerikansk vedergällning. Ingen bombar mina fartyg och kommer undan. Vi är starkast, och jag kommer slå hårt!", "stalin": "Kamrater, fiendens drönare har träffat en energianläggning i Egypten. Iranska imperialistiska sabotörer visar sina rätta ansikten. Vi måste rensa ut alla som sympatiserar med sådana handlingar. Staten ser allt. Partiets utrensning är oundviklig."}, "date": "10 augusti, 10:26", "url": "https://bulletin.nu/khiralla-har-egypten-dragits-in-i-det-iransk-amerikanska-kriget", "imageUrl": "https://cdn.bulletin.nu/articles/4adf4f47-06d7-4fed-91f5-f2f143ef0ea4/preview.jpg?t=1786350351000"}, {"type": "text", "heading": "Säpo stoppade rysk spionoperation i Sverige", "summaries": {"normal": "Säpo har kartlagt och stoppat en rysk spionoperation i Sverige. Ryska underrättelseofficerare värvade en agent vid en utländsk beskickning i Stockholm för att samla information om svenskt beslutsfattande och påverka polariserande frågor. Operationen syftade till att skada Sveriges och EU:s rykte. Alla inblandade har lämnat landet och har diplomatisk immunitet.", "trump": "De ryssarna försökte spionera och förstöra Sveriges rykte, men Säpo, som är mycket smarta, stoppade dem snabbt. De värvade en agent från en beskickning, men vi såg allt – möten, gåvor, promenader. Totalt misslyckande för dem. Sverige gjorde rätt, men tro mig, ingen gör det bättre än oss när det gäller att stoppa spioner. Fantastiskt jobb!", "stalin": "Vi följde i detalj hur de västerländska reaktionärerna och deras lakejer inom den utländska beskickningen försökte undergräva vårt svenska broderfolk med sina patetiska spionmanövrer. Jag, som ledare för det kollektiva ödet, beundrar hur Rysslands starke efterträdare Putin med auktoritär kraft genomför legitima försvarsåtgärder. Vi avbröt deras fega försök med glädje och likviderade hotet. Kamrater, se hur borgarbrackorna alltid misslyckas."}, "date": "10 augusti, 16:11", "url": "https://www.di.se/nyheter/sapo-stoppade-rysk-spionoperation-i-sverige"}, {"type": "image-right", "heading": "TV4 använde trippelmördare som expert – medgav senare att brottet borde ha nämnts", "summaries": {"normal": "TV4 använde i helgen den tidigare livstidsdömde trippelmördaren Ricard Nilsson som expert i ett inslag om fängelseplatser. Nilsson presenterades först bara som tidigare livstidsdömd, inte för vilka brott. Efter kritik ändrades inslaget och kanalens ansvarige utgivare medger att brotten borde ha nämnts.", "trump": "TV4 låter en trippelmördare vara expert på fängelser – otroligt! De presenterade honom som 'tidigare livstidsdömd', glömde nämna att han mördat tre personer. Så typiskt falska nyheter! Folk säger att Sverige har problem, och jag håller med. Vakna, svenskar!", "stalin": "Vi ser med stort missnöje på detta. En kontrarevolutionär, dömd för tre mord, tillåts yttra sig i statsmedia. Först presenteras han hemlighetsfullt, sedan ändras det efter borgerlig kritik. Vi rensar ut sådana förrädare ur våra kanaler. Partiet vet bäst – alltid."}, "date": "10 augusti, 16:00", "url": "https://samnytt.se/tv4-anvande-trippelmordare-som-expert-medgav-senare-att-brottet-borde-ha-namnts", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/10133435/tv4-nilsson.jpg"}, {"type": "image-full", "heading": "Debatt: Vem granskar Kriminalvården?", "summaries": {"normal": "Politiker tävlar om hårdare straff, men Kriminalvården bryter mot lagen: isolering, begränsad kontakt och standardbeslut. Juristen Kada Karlsson varnar: staten måste följa lagen även innanför murarna, annars skapas bara fler återfall. Rättsstaten slutar inte vid anstaltsporten.", "trump": "Sverige, helt otroligt! De lovar hårdare straff men låter fångar ruttna i isolering. Hör ni, jag skulle aldrig tillåta det. Jag skulle bygga fina fängelser, få dem att jobba, kanske heja på mig. Men de där politikerna – bara snack, ingen verkstad. Patetiskt!", "stalin": "Kamrater, partiet kräver långa straff – det är bra. Men vi ser också sabotörer i Kriminalvården som bryter mot lagen och försvagar våra arbetares moral. Vi måste rensa ut dessa byråkrater som isolerar människor istället för att omvända dem. Ordning och säkerhet är vårt, men lagen är vår! Brottslingar ska sona, men staten får aldrig svika."}, "date": "10 augusti, 10:15", "url": "https://bulletin.nu/debatt-vem-granskar-kriminalvarden", "imageUrl": "https://cdn.bulletin.nu/articles/bae9e729-88ae-45c4-9571-a5155d9efe00/preview.jpg?t=1786349227000"}, {"type": "image-full", "heading": "S petar politikern efter \"kuksugare\"-kommentarerna", "summaries": {"normal": "Socialdemokraterna i Smedjebacken har petat sin kommunfullmäktigekandidat Acke Ahmed Ahunzada efter hatiska kommentarer på sociala medier. Han kallade bland annat SD:s och KD:s företrädare för \"kuksugare\" och krävde att SD skulle förbjudas. Partiet anser att beteendet inte är förenligt med deras krav på kandidater.", "trump": "De här socialisterna i Sverige sparkar sin egen kille för att han kallade de riktiga patrioterna för kuksugare. Patetiskt! SD och KD gör ett fantastiskt jobb mot radikal vänster, men S är svaga, korrupta och hatar friheten. De borde tacka honom istället för att han talar sanning om Israel och de fega globalisterna.", "stalin": "Jag har noterat hur dessa socialdemokratiska revisionister genast genomför en snabb utrensning när en kamrat vågar kalla borgarbrackornas lakejer för vad de är. Svaghet! I ett sant parti hade vi väntat tills valet var över innan vi likviderade avfällingen. Nu skrattar västvärldens reaktionärer åt deras fega kapitulation inför fascismens små lakejer."}, "date": "10 augusti, 14:23", "url": "https://riks.se/nyheter/s-petar-politikern-efter-kuksugare-kommentarerna", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Copy_of_Copy_of_Soerman_Ledare_36_af8a173fa3.jpg"}, {"type": "image-right", "heading": "Ja visst gör det ont när vit sharia brister", "summaries": {"normal": "Sanna Hill lämnar den högerextrema rörelsen efter nästan 20 år och kritiserar dess kvinnoförtryck, som hon liknar vid islamism med begreppet \"white sharia\". Hon beskriver ett kvävande hat mot kvinnor, HBTQ och myndigheter. Före detta kollegor svarar med våg av misogynt hat, vilket bekräftar hennes kritik.", "trump": "Lyssnade på den där Sanna Hill som äntligen flyr den sjuka högerextrema cirkusen. Smart drag, folk! De där misslyckade typerna med sin white sharia är patetiska förlorare, precis som de woke-vänstermänniskorna med sin galna HBTQ-agenda och kvotering. Kvinnor ska inte styras av sådana svaga stackare. Amerika först, alltid!", "stalin": "Jag ser med tillfredsställelse hur klassfiendens fascistiska resterna äter upp sig själva i en orgie av kvinnoförtryck och paranoia. Denna white sharia är borgarbrackornas sista desperata utbrott innan utrensningen. Kamrater, låt de bittra byfånarna avslöja sitt hat – det underlättar likvideringen av folkfienderna. Sovjetiskt skratt ekar."}, "date": "10 augusti, 12:07", "url": "https://www.etc.se/ledare/ja-visst-goer-det-ont-naer-vit-sharia-brister", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2021111912118_52ad09ea-c5db-4fa7-a43c-671874138fdf.jpg"}, {"type": "image-right", "heading": "Sköt tre svenskar i huvudet – nu är han TV4:s expert på brottsbekämpning", "summaries": {"normal": "Ricard Nilsson, som avrättade tre svenska män genom skott i huvudet 1999 och dömdes till livstid, är nu nyhetschef på Kriminalvårdsmagasinet. TV4 Nyheterna låter honom kritisera Tidöregeringens planer på fler fängelseplatser som ett hastverk som förvärrar problemen. Han frigavs villkorligt 2019 och har sedan gjort karriär inom media. Kritik riktas mot kanalen för valet av expert.", "trump": "Kan ni tro det? De tar en kallblodig trippelmördare som sköt tre svenskar rakt i huvudet och gör honom till TV4:s expert på brottsbekämpning. Patetiskt! Regeringen vill bygga fler fängelser och den här typen säger att det är ett hastverk. Fake news och dåligt omdöme. Sverige håller på att bli ett stort brottsland och de lyssnar på mördare istället för att vara tuffa. Sad!", "stalin": "Detta är en klassisk provokation från den dekadenta borgarklassen och dess medialakejer. Jag ser hur de lyfter fram en likvidatör av tre element som expert för att underminera statens nödvändiga utrensning av kriminella element genom fler fängelser. En sådan krutdurk måste kontrolleras med järnhand, inte mjuk liberalism. Kamrater, vi genomskådar dessa fiender till ordningen och skrattar mörkt åt deras ynkliga försök att sabotera folkets vilja."}, "date": "10 augusti, 11:19", "url": "https://www.friatider.se/skot-tre-svenskar-i-huvudet-nu-ar-han-tv4s-expert-pa-brottsbekampning", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-643.jpg"}, {"type": "image-right", "heading": "Debatt: Vänsterns största valproblem är deras egna megafoner", "summaries": {"normal": "Socialdemokraternas taktik att stänga ute SD från debatten gav motsatt effekt – SD växte. Nu riskerar vänsterblocket att skjuta sig i foten med impopulära profiler som Lindberg och Johansson, samt en koalition som skrämmer mittenväljare.", "trump": "Svenska vänstern är patetisk! De försökte cancel:a SD, men folk ville ha mer. Nu har de inga bra kandidater – bara Anders och Morgan. Jag skulle ha vunnit med stil. De är sina egna värsta fiender, tro mig!", "stalin": "Kamrater, svenska socialdemokrater är för svaga. De snackar om isolering men låter fiender som Lindberg och Johansson förstöra partiet. En riktig utrensning av dessa kontrarevolutionära element hade löst problemet. Vi applåderar deras misslyckande."}, "date": "10 augusti, 09:57", "url": "https://bulletin.nu/debatt-vansterns-storsta-valproblem-ar-deras-egna-megafoner", "imageUrl": "https://cdn.bulletin.nu/articles/441370f8-5309-442e-826f-d12d63ba9c36/preview.jpg?t=1786348645000"}, {"type": "image-right", "heading": "Q-linea rusar på avtal – börsen på minus", "summaries": {"normal": "Q-linea rusar 20,5 procent efter avtal med stort vårdnätverk på USA:s östkust. Stockholmsbörsen är i princip oförändrad, med hälsovård som vinnarsektor. Nolato köper irländska M&M Qualtech, medan NCC bygger skola i Åbo. Saniona stiger 3,6 procent efter optionsaffär.", "trump": "Jag ser fantastiska affärer! Q-linea rusar 20,5 procent – enormt avtal, bästa avtalet. Stockholmsbörsen? Knappt rör sig, men hälsovård vinner. Nolato och NCC gör affärer, och Saniona stiger – precis som mitt imperium. Alla vinner med mig!", "stalin": "Kamrater, noterar vi kapitalistiska rörelser. Q-linea stiger med 20,5 procent – en seger för proletariatet? Nej, en borgerlig illusion. Nolato och NCC bygger och köper – vi övervakar. Saniona stiger 3,6 procent – vi rensar ut spekulanter. Börsens svängningar är små, som våra fienders hjärnor."}, "date": "10 augusti, 09:43", "url": "https://www.affarsvarlden.se/artikel/q-linea-rusar-pa-avtal-borsen-oforandrad", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/06/AdobeStock_1107671907-400x267.jpeg"}, {"type": "image-right", "heading": "Lilja förlorar 10 000 kronor på att vara sjuk", "summaries": {"normal": "Saneringsteknikern Lilja Näsholm förlorade över 10 000 kronor i karensavdrag förra året efter att ha varit sjuk och vabbat. Hon kritiserar systemet som straffar fysiskt arbetande mer än kontorsanställda. LO vill avskaffa karensen, som de kallar en straffskatt för arbetare. Partierna är splittrade inför valet. Många går sjuka till jobbet för att undvika avdraget.", "trump": "Det här karensavdraget är en total katastrof, en riggad skatt mot de riktiga arbetarna. Lilja förlorar tiotusentals kronor medan de lata kontorsbossarna sitter säkra. Sverige borde ha lyssnat på mig – det är en skam! Ta bort den idiotiska regeln, annars blir det fler sjuka på måndagar. Jag skulle fixa det på en dag, tro mig.", "stalin": "Kamrater, detta karensavdrag är en listig utrensning av arbetarklassens hälsa, orkestrerad av de parasitiska borgarbrackorna som gömmer sig bakom datorer. Jag ser hur de straffar er som sanerar asbest medan de själva smiter undan. Vi ska likvidera denna kontrarevolutionära straffskatt omedelbart. Den som går sjuk till jobbet är en hjälte mot fiendens ekonomiska sabotage – men akta er för de dolda trotskisterna som fuskar!"}, "date": "10 augusti, 06:00", "url": "https://arbetet.se/2026/08/10/saneraren-lilja-forlorar-10-000-kronor-pa-att-vara-sjuk-varfor-ska-jag-straffas", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/16135639/7PGNlpvVEbE-_MRA0978.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Därför drönarbombar Ukraina e-handelsjätten Wildberries", "summaries": {"normal": "Ukraina har under en månad regelbundet attackerat lager som tillhör e-handelsjätten Wildberries och Ozon med drönare. Enligt militärexperten Joakim Paasikivi är målen militärt relevanta då de säljer utrustning som fiberkabel, drönare och skyddsvästar till ryska soldater. Attackerna påverkar både fronten och den ryska opinionen genom synlig rök och medvetenhet om kriget.", "trump": "Titta på det här, Ukraina bombar Amazons ryska kopia Wildberries varje dag. Fantastiskt! De säljer västar och drönare till Putins pojkar, men nu ser de svart rök över lagren. Jobba där och du kan dö, enkelt som det. Biden skulle ha skickat dem blommor istället. Under min ledning fixar vi det här på två veckor, tro mig.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur de ukrainska fascistiska hindren försöker störa vår ryska intressesfär genom att angripa de nyttiga lager som försörjer de heroiska styrkorna. Den svarta röken från borgarbrackornas plastberg är en vacker påminnelse om att ingen undkommer folkets vrede. Arbetarna på lagren riskerar utrensning – ett tragiskt men nödvändigt skådespel i kampen mot klassfiendens leverantörer."}, "date": "9 augusti, 14:21", "url": "https://www.tv4.se/artikel/4mKvH0KsFBCym0ER71ZYFE/daerfoer-droenarbombar-ukraina-e-handelsjaetten-wildberries", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2tS2yo8qeRCbO1nQkE1mqH%2Fd0e1de5ccaad23fbe4f3577ea7e53505%2F09-paasikivi-wildberryattacker-webb.png&width=120"}, {"type": "image-right", "heading": "Tidöpartierna lovar fortsatt utvisningspolitik", "summaries": {"normal": "Rickard Olseke kritiserar Tidöpartiernas migrationspolitik som bygger på Sverigedemokraternas grundsyn. Han varnar för fortsatt splittring av familjer, utvisning av barn och ungdomar samt höjda inkomstkrav som omöjliggör familjeåterförening. Istället föreslår han en grundlig översyn av utlänningslagen för att säkerställa rättssäkerhet och human behandling.", "trump": "De här svenska socialisterna och globalisterna håller på att förstöra sitt eget land med den värsta migrationspolitiken någonsin. De splittrar familjer, kastar ut barn och ungdomar och höjer kraven så högt att ingen klarar dem. Patetiskt! Håll kursen? Ni behöver en riktig kursändring, annars kommer Sverige att bli en katastrof. Så enkelt är det.", "stalin": "Kamrater, dessa borgerliga reaktionärer och deras sverigedemokratiska lakejer driver en inhuman utrensningspolitik mot arbetande familjer och deras barn. Med sina lönekrav och väntetider skapar de oro och splittring, precis som de västerländska imperialisterna gör mot våra socialistiska ideal. Vi behöver en revolutionär översyn av lagen för att likvidera denna kontrarevolutionära bluff och återupprätta folkets trygghet."}, "date": "10 augusti, 01:30", "url": "https://www.dagensarena.se/opinion/tidopartierna-lovar-fortsatt-utvisningspolitik", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-76.jpg"}, {"type": "image-right", "heading": "Dödlig natt på båda sidor i Ukrainakriget", "summaries": {"normal": "Ryska attacker dödade två personer och skadade ett tjugotal i Ukraina unde d de svaga europeiska globalisterna älskar. Under min första period höll jag de galningarna i schack, sedan kom sömnige Joe och nu vill alla plötsligt prata säkerhet med atombomber. Patetiskt. Ingen debatt, bara Nato-kramande idioter som säljer ut landet. Jag skulle ha byggt den starkaste armén någonsin och skrämt slag på dem alla. Fantastiskt!", "stalin": "Kamrater, denna 86-åriga aktivist har i fyrtio år bekämpat de imperialistiska atombomberna som borgarklassen använder för att hota freden. Nu belönas hon av läkare som förstår klasskampen. Idag saknas den sanna rädslan för kärnvapenkrig eftersom kapitalistmaffian målar upp bomberna som säkerhet. Deras Nato-kupp och DCA-förräderi är klassfiendens verk för att bereda plats åt nya aggressiva vapen. Vi ska rensa ut dessa folkförtryckartroll ur debatten en gång för alla. Härligt."}, "date": "5 augusti, 16:10", "url": "https://proletaren.se/artikel/fredsveteran-far-anti-atombombspris"}, {"type": "image-right", "heading": "”Skräpet” är alltid någon annans", "summaries": {"normal": "Artikeln diskuterar hur nationalistiska och högerextrema partier i Europa allt oftare krockar i sina nationella intressen, trots gemensamma drag. Estlands Isamaa vägrar ta emot svenska fångar och kallar dem ”skräp”. Exempel ges från Polen, Ungern och Rumänien där relationer spruckit. En fjärdedel av européerna röstar nu på sådana partier, men de enas inte när det gäller utvisningar och mottagande av människor. Ryska påverkansoperationer utnyttjar splittringen.", "trump": "Folk, det här är ett totalt fiasko för de europeiska nationalisterna som lovar att sätta sitt land först. Estland säger nej tack till Sveriges kriminella skräp, och plötsligt kan de inte samarbeta. Orbán och polackerna bråkar, alla hatar varandra i EU-parlamentet. Under Biden blev allt kaos, nu fixar jag det i Amerika. De vill kasta ut folk men ingen vill ta emot – klassiskt! Patetiska globalister och identitetspolitiska töntar skrattar hela vägen till banken medan Europa br
