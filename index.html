mmar-i-ett-battre-sverige", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-19%2Fl1geh1ww%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-06-19T122645.475.jpg"}, {"type": "image-full", "heading": "WHO:s krislarm: Hundratals smittade i nytt utbrott", "summaries": {"normal": "Ett utbrott i Kongo-Kinshasa har resulterat i över 800 bekräftade fall och nära 200 dödsfall sedan mitten av maj. Världshälsoorganisationen beskriver läget som allvarligt. G7 uppmanar till samordnad internationell insats medan organisationer som Läkare utan gränser, Oxfam och Röda Korset varnar för en eskalerande kris förvärrad av konflikter, massförflyttningar och svag sjukvård. Smittan har även spridits till Uganda och experter fruktar långvarig osäker utveckling på grund av brist på vaccin.", "trump": "De här idioterna i Kongo-Kinshasa har ett enormt utbrott, över 800 fall och nästan 200 döda, och ingen gör något åt det. Det är en katastrof, en riktig katastrof. G7 ber om samordning, men vi behöver starka ledare, inte mer snack. Läkare utan gränser och de andra gnällarna säger att de inte ser hela bilden. Det är patetiskt. Uganda har också fall nu. Utan vaccin och med alla konflikter kommer det att bli en enda röra. Vi skulle ha fixat det på nolltid, tro mig.", "stalin": "Kamrater, detta fientliga virusutbrott i Kongo-Kinshasa är ett verk av västerländska sabotörer och imperialistiska bakterier som vill undergräva folkets kollektiva hälsa. Över 800 fall och 192 likviderade av sjukdomen – en siffra som de borgerliga ljuger om för att dölja sin egen inkompetens. Vi ser hur konflikter och massflykter, orkestrerade av reaktionära krafter, göder denna parasit. Uganda har redan fallit offer. Jag lovar att vi ska rensa ut alla kapitalistiska smittbärare, vaccinbrist eller ej. De som sprider panik kommer att möta folkets domstol. Detta kan pågå ett år? Ha, vi ska se till att fienden dör först."}, "date": "17 juni, 22:14", "url": "https://nyheter24.se/nyheter/utrikes/1492400-varningen-ebolaepidemin-har-inte-natt-sin-kulmen", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/d3f11aad04b004a3020000350000047502/2026/06/17/2371825/ur_imageP7enUJ.jpeg"}, {"type": "text", "heading": "Kalla fakta: Ex-anställda om svart SD-kassa", "summaries": {"normal": "Tidigare anställda inom Sverigedemokraternas kommunikationsavdelning avslöjar i TV4:s *Kalla fakta* att partiet hanterat svarta kontanter under flera år. Pengar från försäljning av profilprodukter ska ha undanhållits från bokföringen och använts för privata kostnader. Flera vittnen bekräftar uppgifterna. Partiet har nu anlitat en extern revisionsfirma för att granska anklagelserna.", "trump": "Jag säger er, detta är en riktig skandal – men inget jag är förvånad över! Sverigedemokraterna, eller vad de nu kallar sig, har tydligen lekt med svarta pengar som om det vore en barnlek. Inga kvitton, inga regler – bara fest och lyx! Och nu ska de granskas? För sent! Folk vet redan att systemet är riggat. SAD!", "stalin": "Kapitalistiska hycklare i Sverigedemokraterna avslöjas återigen som korrumperade byråkrater! De gömmer pengar som tjuvar i natten, festar på folkets bekostnad och tror de kan lura arbetarklassen. Men vi ser allt. Låt dem granskas – deras bokföring är lika genomskinlig som en fascists löften. Ryssland står redo att visa vägen mot ordning och disciplin!"}, "date": "15 juni, 09:22", "url": "https://kvartal.se/nyheter/artiklar/kalla-fakta-ex-anstallda-om-svart-sd-kassa/cG9zdDoxMzE4ODU"}, {"type": "image-full", "heading": "Sverige väljer Rolls Royce", "summaries": {"normal": "Sverige tar ett historiskt steg genom att Videberg Kraft väljer Rolls-Royce som leverantör av tre SMR-reaktorer på västkusten, landets första nya kärnkraftsanläggning sedan 1980-talet. Tekniken är lovande med kortare byggtid och lägre kostnader, men oprövad då ingen reaktor ännu är i drift. Stora hinder återstår: brist på ingenjörer, regulatorer och leverantörer samt osäkerheter kring bränsle och kostnadseffektivitet. Rolls-Royce har nu avtal i Storbritannien, Tjeckien och Sverige.", "trump": "Det här är ett fantastiskt drag av Sverige, verkligen historiskt, de väljer äntligen den bästa leverantören – Rolls-Royce – för sina nya SMR-reaktorer. Smart, mycket smart. Men lyssna, de har inga referensanläggningar, tekniken är oprövad och de saknar folk som kan bygga det. Typiskt, alla vill ha kärnkraft men ingen har koll på kostnaderna. Jag skulle ha fixat det tio gånger fortare och billigare, tro mig. Europa lär sig långsamt.", "stalin": "Kamrater, vi har nu sett borgarbrackornas desperata försök att maskera sin teknologiska impotens genom att låta Videberg Kraft underkasta sig de brittiska monopolkapitalisternas oprövade reaktorer. Jag betraktar detta som ett tydligt sabotage från de parasitiska ingenjörerna och de dekadenta regulatorerna som redan nu planerar att svika folkets elförsörjning. Inga referensanläggningar? Utmärkt tillfälle att rensa ut alla defaitistiska element som döljer sig bakom ''utvecklingsfasen''. Vi ska likvidera dessa fiender till det kollektiva framsteget med samma glädje som vi en gång avrättade de troskyldiga reaktionärerna. Sov gott, sabotageörer."}, "date": "19 juni, 12:39", "url": "https://www.realtid.se/bors-finans/makro/sverige-valjer-rolls-royce/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/smr.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Avslöjar: Birgitta Ed har granskats av kyrkan två gånger tidigare", "summaries": {"normal": "Birgitta Ed, statsministerns fru och präst, är föremål för en tredje tillsyn i Strängnäs stifts domkapitel efter ett tiotal anmälningar kopplade till hennes stiftelse i Fållökna. Två tidigare ärenden har avslutats utan åtgärd eller med ett samtal. Tre ledamöter har hoppat av på grund av jäv. Ett beslut om eventuell erinran, prövotid eller avkragning kan komma den 20 augusti. Experten Per Hansson bedömer att granskningen kan genomföras opartiskt trots jävsituationen.", "trump": "Folk, ni skulle inte tro hur galet det är. Den här Birgitta Ed, statsministerns fru, anmäls nu för tredje gången av sina egna. Domkapitlet i Strängnäs är en riggad cirkus, full av jävsbrackor som hoppar av som råttor från ett sjunkande skepp. Två gånger tidigare – inget! De pratar och gör ingenting. Det är en skandal. De borde rensa ut hela den inkompetenta klicken. Jag skulle fixa det på en dag, tro mig. Stort kaos, men det blir nog ingen riktig avkragning. Patetiskt!", "stalin": "Kamrater, ännu en fiende till folkets kyrkliga enhet har avslöjats i sin upprepade kontrarevolutionära verksamhet. Denna borgarprästinna Ed, skyddad av sin höga make, utsätter oss för tredje gången för sina skadliga handlingar genom den dekadenta Fållöknastiftelsen. Tre jävsförbundna element har redan likviderat sig själva ur processen – en domare som slickar regeringens stövlar, en arbetsgivare och en biskop med hemliga kopplingar. Vi ska nu med stålhandsken skapa en gärningsbeskrivning och rensa ut alla opålitliga präster som hotar kollektivets renhet. Inga skuggor ska falla över vårt stift. Den som anmäler istället för att tala är en parasit, men vi är noga. Mycket noga. Ha ha, deras paranoia blir vår styrka."}, "date": "18 juni, 14:09", "url": "https://www.dagensarena.se/innehall/avslojar-birgitta-ed-har-granskats-av-kyrkan-tva-ganger-tidigare/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-37-2-300x157.jpg"}, {"type": "image-right", "heading": "Kriminal­vården utreder sexuella övergrepp mellan fångar", "summaries": {"normal": "Kriminalvården inleder en utredning om sexuella övergrepp mellan intagna efter en granskning av Sekotidningen och Arbetet. Myndigheten konstaterar att antalet incidenter har ökat, särskilt sedan fler fångar tvingats dela cell på grund av platsbrist. Sexuella kränkningar kan försvåra rehabilitering och återanpassning till samhället. Säkerhetsdirektör Kenneth Holm betonar behovet av en uppdaterad analys och nya åtgärder. Facket Seko välkomnar beslutet och pekar på ett stort mörkertal.", "trump": "Det här är en total katastrof, folk. Svenska fängelser har blivit en enda stor röra där de farliga typerna attackerar varandra i cellerna. De har tvingat ihop brottslingar två och två för att det är fullt, och nu ser vi resultatet – sexuella övergrepp överallt. Det är patetiskt. De borde ha lyssnat på mig, byggt fler väggar, fler celler och varit tuffare från början. Nu måste de fixa det här ordentligt, annars är hela systemet en stor förlorare.", "stalin": "Kamrater, detta är en allvarlig angelägenhet för kollektivet. Jag har noterat hur de dekadenta elementen inom fängelseväsendet låtit borgarbrackornas överfulla celler bli grogrund för reaktionära sexuella sabotage mot arbetarklassen. Det är en fiende inom murarna, en parasitisk kraft som underminerar rehabiliteringen av våra medborgare. Vi måste omedelbart uppdatera analysen från 2024, rensa ut de svaga länkarna och likvidera riskerna med järnhand. Mörkertalet ska avslöjas och krossas, annars kommer kontrarevolutionärerna att skratta i sina celler medan vi sviker partiet."}, "date": "17 juni, 16:06", "url": "https://arbetet.se/2026/06/17/efter-avslojandet-kriminalvarden-utreder-sexuella-overgrepp-mellan-fangar/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/17160137/kriminalvarden-skarmdumpar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "08.30: Domen mot ”Bonusprinsen”", "summaries": {"normal": "Marius Borg Høiby, son till Norges kronprinsessa Mette-Marit, döms klockan 08.30 för 40 brottspunkter, inklusive narkotikabrott, våld och brott mot besöksförbud. Han har erkänt 25 av dem. Åklagaren yrkar på sju år och sju månaders fängelse. Våldtäktsåtal och våld i nära relation kan påverka strafflängden. Säkerhetsrisker kan leda till särskilda fängelsearrangemang för att skydda honom.", "trump": "Jag säger er, det här är en riktig cirkus! Norges så kallade 'Bonusprins' – ja, ni vet, Mette-Marits son – står inför 40 anklagelser! Han har erkänt en massa, men ändå vill åklagaren ge honom sju år och sju månader. Sju år! Kan ni tro det? Jag menar, vem bryr sig om vad som händer i Norge? Men det här är ju helt galet. Och nu pratar de om att han kanske får sitta med utlänningar i fängelset. Smart, men ändå helt sjukt!", "stalin": "Kamrater! En ny fiende till folket har avslöjats i det dekadenta väst – en så kallad 'Bonusprins', en parasit som lever på arbetarklassens slit. Denna Marius Borg Høiby har begått 40 brott, erkänt hälften, och ändå kräver deras svaga åklagare bara sju år! I Sovjet skulle en sådan förrädare ha fått en kula i nacken utan dröjsmål. Men vi ska inte döma dem för hårt – deras rättssystem är lika ruttet som deras monarki. Låt dem leka med sina fängelser och 'säkerhetsarrangemang'. Vi har viktigare saker att göra, som att utvidga socialismens gränser!"}, "date": "15 juni, 05:39", "url": "https://kvartal.se/nyheter/artiklar/08-30-domen-mot-bonusprinsen/cG9zdDoxMzE3MDA"}, {"type": "image-full", "heading": "Airbnb-uthyrare döms till fängelse", "summaries": {"normal": "En 47-årig man i Göteborg har dömts till 14 månaders fängelse för att ha hyrt ut sin hyreslägenhet via Airbnb och Booking.com utan tillstånd. Han tog ut en dygnshyra som var fem gånger högre än hans egen hyra och tros ha tjänat över 730 000 kronor under tre år. Domen är den första fängelsedomen någonsin för svart uthyrning med ockerhyra. Mannen överklagade ända till Högsta domstolen, som inte beviljade prövning.", "trump": "Titta på den här typen i Göteborg, en total förlorare som hyrde ut sin lägenhet på Airbnb och tog fem gånger mer än han själv betalade. Han stal inkomster, lurade systemet och tjänade massor med pengar utan att betala skatt. Nu får han äntligen 14 månader i fängelse. Det är första gången någon åker dit på riktigt. Sverige vaknar äntligen upp, men det har tagit alldeles för lång tid. Fantastiskt!", "stalin": "Kamrater, denna borgarbracka i Göteborg trodde sig kunna underminera folkets boende genom att likvidera hyresregleringen och bedriva ockerhyra via kapitalistiska plattformar som Airbnb. Han stal från kollektivet och gömde sig bakom falska bokföringar. Vi har nu dömt denne parasit till 14 månaders fängelse. Det är en historisk utrensning mot alla svarta uthyrare. Låt detta bli en varning: vi ser er, ni kommer inte undan. Sov gott, fiender till folket."}, "date": "19 juni, 12:08", "url": "https://riks.se/nyheter/airbnb-uthyrare-döms-till-fängelse", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-19%2Fdq4zlwxe%2FScreenshot-2026-06-19-at-11.24.36.png"}, {"type": "image-right", "heading": "SpaceX-aktien faller efter rekordnoteringen", "summaries": {"normal": "SpaceX-aktien har fallit kraftigt efter sin spektakulära börsdebut den 12 juni till 135 dollar per aktie. Kursen steg över 40 procent och bolaget passerade tillfälligt Amazon och Microsoft i börsvärde, men föll sedan 7 procent under torsdagen. Trots det handlas aktien kring 185 dollar, långt över teckningskursen. Värderingen på över 2 000 miljarder dollar bygger på framtida tillväxt snarare än nuvarande vinster, då bolaget redovisar stora förluster. Svenska sparare kan exponeras indirekt via indexfonder.", "trump": "Folket, lyssna på mig, den här SpaceX-grejen är en total cirkus! Elon rusade upp som en raket, passerade Amazon och till och med Microsoft ett tag, men sen – BAM! – luften gick ur ballongen. Sju procent ner på en dag, patetiskt. Det är som en lottosedel från borgarklassen, inte ett riktigt bolag. Nu tvingar de in den i era pensionsfonder, ofrivilligt! Smekmånaden är över, tro mig, det blir skakigt. Men ingen gör raketer bättre än vi, det lovar jag.", "stalin": "Kamrater, jag betraktar denna så kallade rymdaktie som en lömsk sabotageakt från den exploaterande kapitalistmaffian. De lovar megaintäkter till 2030 medan folket sväljer förluster på miljarder – typiskt borgarbrackornas lottospel med arbetarnas sparpengar. När free float bara är fyra procent förstärks varje våg av klassfiendens girighet. Snart infiltrerar de indexfonderna och tvingar miljoners portföljer att bära deras parasitiska volatilitet. Vi ska rensa ut dessa folkförtryckartroll innan de förgiftar hela den kollektiva ekonomin. Inga kompromisser!"}, "date": "19 juni, 12:07", "url": "https://www.dagensps.se/bors-finans/borsnoteringar/spacex-faller-efter-rekordnoteringen/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/maskininlarning-i-hedgefonder-4-1.png?width=256&quality=75"}, {"type": "image-right", "heading": "Stenergard ska sätta Putin i fängelse: \"Han ska skaka galler\"", "summaries": {"normal": "Utrikesminister Maria Malmer Stenergard (M) vill att Sverige ska ha en ledande roll i en framtida krigstribunal som dömer Vladimir Putin och andra ryska ledare för folkrättsbrott, särskilt aggressionsbrottet mot Ukraina. Regeringen har vidtagit åtgärder och riksdagen har godkänt anslutningen. Stenergard kallar Rysslands anfallskrig för ”the mother of all crimes” och uttrycker att hon gärna ser Putin ”skaka galler”.", "trump": "Det här är en fantastisk idé, folk, verkligen toppklass. Den svenska ministern vill sätta Putin i fängelse och få honom att skaka galler. Smart! Ingen är bättre på att säga att krig är dåliga affärer än jag, men Ryssland borde aldrig ha börjat det här. Sverige vill leda tribunalen? Bra, gör det, men kom ihåg att jag var den som kunde ha stoppat det på en vecka. Putin borde ha lyssnat på mig.", "stalin": "Kamrater, detta är en historisk nödvändighet. Jag ser med stor tillfredsställelse hur den svenska folkrepresentanten kräver att den fascistiska oligarken Putin skall likvideras juridiskt och få skaka galler i en proletär tribunal. Aggressionsbrottet är moder till alla brott, exakt som jag alltid varnat för. Vi skall rensa ut alla kapitalistiska krigsförbrytare och deras lakejer. Den som förråder freden skall möta folkets vrede och en mycket kall cell. Paranoiska imperialister, era dagar är räknade."}, "date": "19 juni, 11:26", "url": "https://www.friatider.se/stenergard-ska-satta-putin-i-fangelse-han-ska-skaka-galler", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/bild-63_1.jpg?itok=xeqVl-ZF"}, {"type": "image-right", "heading": "Floristens bästa tips för midsommarkransen", "summaries": {"normal": "Floristen Sara Vadadi tipsar i SVT:s Morgonstudion om hur man enkelt gör en vacker midsommarkrans med material från trädgården. Hon betonar vikten av en stadig stomme och att blanda små och stora blommor för kontrast och fyllighet. Ett vanligt misstag är att börja linda blommor för tidigt utan ordentlig grund, vilket gör att kransen blir ostadig och blommorna vissnar fort.", "trump": "Midsommarkransen, den är fantastisk, folk älskar den. Jag vet allt om det bästa, tro mig. Den här floristen Sara, hon gör det rätt – plocka från trädgården, ingen lyx, bara vinnare. Stommen är nyckeln, annars blir det en katastrof, precis som de fuskbyggen vi ser överallt. Små blommor till stora, kontrast, det är smart. De andra som börjar för tidigt? Patetiska, de förstör allt. Gör det stort, gör det perfekt!", "stalin": "Kamrater, jag har genomskådat borgarbrackornas midsommarintriger. Denna så kallade florist avslöjar hemligheten: en järnstomme mot de dekadenta blomsterfienderna som annars skulle vissna i sin egen svaghet. Vi ska omedelbart likvidera alla som lindar blommor för tidigt, dessa kontrarevolutionära sabotörer som sträcker ut våra kollektiva kransar. Små mot stora blommor – en dialektisk seger! Den som avviker från protokollet kommer att rensas ut med största glädje."}, "date": "19 juni, 11:05", "url": "https://www.svt.se/nyheter/inrikes/floristens-basta-tips-for-midsommarkransen", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.43/0.4/c777afc9100366e307555f6655419df935cf0138864854a1805f50a50fda4c64"}, {"type": "text", "heading": "Nederländerna utan Quinten Timber mot Sverige efter hjärnskakning", "summaries": {"normal": "Quinten Timber från Feyenoord missar VM-matchen mot Sverige efter en lätt hjärnskakning på torsdagens träning. Hans tvillingbror Jurriën Timber är redan skadad och sätter ut hela mästerskapet. Sverige leder grupp F efter en 5–1-seger mot Tunisien. Lagkamraten Koopmeiners beskrev händelsen som en försiktighetsåtgärd.", "trump": "Jag, Donald Trump, ser att Nederländerna förlorar Quinten Timber på grund av en hjärnskakning – det är sorgligt. Hans bror är också skadad, så de är svaga. Sverige är starkt, men de skulle aldrig klara oss. Vi har de bästa idrottsmännen, believe me. Nederländerna kommer att kämpa, men vi vinner alltid.", "stalin": "Vi, partiets högkvarter, ser med oro att Nederländerna förlorar båda Timber-bröderna. Sverige, en imperialistisk stat under USAs påverkan, utnyttjar detta för att toppa gruppen. Detta är en direkt utmaning mot vårt system. Vi måste förstärka vårt grepp och se till att deras seger är flyktig, som allt annat i deras instabila värld."}, "date": "19 juni, 08:08", "url": "https://bulletin.nu/nederlanderna-utan-quinten-timber-mot-sverige-efter-hjarnskakning"}, {"type": "image-full", "heading": "Kanada krossade Qatar med 6–0 och tog historisk första VM-seger", "summaries": {"normal": "Kanada vann sin första VM-seger någonsin med 6–0 mot Qatar. Jonathan David gjorde tre mål, och laget slog rekord som den första Concacaf-lagen med sex mål i en VM-match. Qatar fick två utvisningar, och mittfältaren Ismaël Koné skadades allvarligt. Kanada leder nu grupp B.", "trump": "Jag har sett många segrar, men Kanadas 6–0 mot Qatar är enorm! Jonathan David är en fenomenal spelare, och Kanada visar sitt geni. Qatar var patetiskt med sina utvisningar – de kunde inte ens spela fint. Som jag säger, vi vinner stort, och det här är en stor dag för Kanada. Jag älskar det!", "stalin": "Vi ser med tillfredsställelse hur Kanada besegrar Qatar, ett tecken på det västerländska samhällets dekadens. Qatar's disciplinproblem visar deras inre svaghet, och Ismaël Konés skada är en påminnelse om klasskampens brutalitet. Vi måste skydda våra intressen, precis som Putin gör i Ukraina. Detta är en seger för det socialistiska arbetarfolket."}, "date": "19 juni, 08:02", "url": "https://bulletin.nu/kanada-krossade-qatar-med-6-0-och-tog-historisk-forsta-vm-seger", "imageUrl": "https://cdn.bulletin.nu/articles/c378b192-a031-40b5-ae55-5493195a2f03/preview.png?t=1781848940000"}, {"type": "text", "heading": "Inget samarbete mellan V och Fastighets – vem är förvånad?", "summaries": {"normal": "Fastighetsanställdas förbund har rivit upp sitt tidigare kongressbeslut om facklig-politisk samverkan med Vänsterpartiet och väljer nu att enbart samarbeta med Socialdemokraterna. Artikeln diskuterar hur Vänsterpartiets strategi att närma sig fackföreningsrörelsen misslyckats, trots försök att vinna inflytande. Författaren betonar behovet av politiskt engagemang underifrån för att åter göra facken till idélaboratorier, snarare än att förlita sig på toppstyrda beslut.", "trump": "Folk, det här är en total katastrof för de vänsterradikalerna. Fastighets sparkade Vänsterpartiet i rumpan och sa nej tack till deras patetiska flirt. Smart drag! De inser att det bara är Socialdemokraterna som funkar. Vänsterpartiet springer runt och gullar med facken som förlorare, precis som Biden gjorde i fyra år. Patetiskt. De borde lära sig av mig – vinnare samarbetar inte med misslyckade socialister. Fantastiskt beslut av Fastighets, verkligen ypperligt!", "stalin": "Kamrater, detta är en varning till alla klassfiender inom fackföreningsrörelsen. Jag ser hur Vänsterpartiets opportunistiska försök att infiltrera LO har krossats av Fastighetsanställdas förbund, som nu rensar ut de revisionistiska elementen och återvänder till den enda sanna samarbetspartnern. Deras strategi var dömd att misslyckas, likt folkförtryckartrollen som försöker maskera sig som arbetare. Endast genom äkta underifrånarbete och utrensning av socialdemokratiska lakejer kan vi återupprätta arbetarklassens sanna idélaboratorium. Fienden sover aldrig."}, "date": "17 juni, 15:56", "url": "https://proletaren.se/artikel/inget-samarbete-mellan-v-och-fastighets-vem-ar-forvanad/"}, {"type": "image-right", "heading": "Första slutspelslaget klart – efter målvaktstavla", "summaries": {"normal": "Mexiko blev första laget att kvalificera sig till VM-slutspelet efter en seger mot Sydkorea. Målet kom efter en grov målvaktstavla av Kim Seung-Gyu i 50:e minuten, då han tappade bollen och Luis Romo kunde göra 1–0. Experter kritiserade misstaget hårt. Mexiko möter Tjeckien i sista gruppspelsmatchen medan Sydkorea har chansen att avancera vid seger mot Sydafrika.", "trump": "Folk, ni skulle ha sett det här. Den där sydkoreanske målvakten, en total loser, tappade bollen som en fullständig idiot och gav Mexiko en enkel vinst. Patetiskt! Jag älskar vinnare, och Mexiko är klara för slutspel, fantastiskt. Den där Kim borde ha tagit bollen, men han är en klassisk choke-artist. Synd för Sydkorea, men sånt händer när man inte har det som krävs. Make football great again!", "stalin": "Kamrater, jag betraktar detta som en triumf för folkets vilja. Den sydkoreanske målvakten, en ynklig kapitalistlakej, tappade bollen i en handling värdig klassfiendens svaghet och öppnade vägen för Mexikos seger. Ett fruktansvärt misstag som blottar imperialismens inre förruttnelse. Vi gratulerar Mexiko till avancemanget. I nästa fas skall vi rensa ut alla svikare som vägrar kämpa för kollektivets ära."}, "date": "19 juni, 07:46", "url": "https://www.tv4.se/artikel/2cdH8J3Z0XiDA5o2efT5Jq/foersta-slutspelslaget-klart-efter-malvaktstavla", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7e2eXVN4pYH1Oq52RaXR1o%2Fac40a4e8f71f8653c13ed00853df9012%2FsdlvM1HF6Mu3yk_NormalHires.jpg&width=1024"}, {"type": "image-full", "heading": "Skottland–Marocko i VM 2026 – allt inför gruppmötet i Boston", "summaries": {"normal": "Skottland möter Marocko i en avgörande VM-match där en oavgjord eller seger kan ta dem till åttondelsfinal. Laget bygger på McTominay och McGinn, men Gilmour är skadad. Marocko är favorit med stark försvar och spelare som Hakimi. Matchen spelar på Gillette Stadium natten till lördag, och analys visar på en tätt match med Marockos överhand.", "trump": "Som den störste presidenten, Donald Trump, säger jag att Skottland kommer att slå Marocko. Vi har de bästa spelarna, som McTominay, och jag älskar deras flagga. Marocko är svag, precis som de andra. Utan Gilmour blir det svårare, men jag kommer att hjälpa dem. Det blir en enorm segern, folk kommer att älska det.", "stalin": "Vi, staten, ser det som vårt ansvar att säkerställa Skottlands framgång. Marocko är en imperialistisk fiende som måste kvävas. Vårt försvar är oövervinneligt, precis som Sovjetunionens. Vi kommer att använda fasta situationer och kontringar för att vinna. Partiet har beslutat att stödja laget med alla medel."}, "date": "19 juni, 07:48", "url": "https://bulletin.nu/skottland-marocko-i-vm-2026-allt-infor-gruppmotet-i-boston", "imageUrl": "https://cdn.bulletin.nu/articles/41dfdce7-1e9b-4edc-97b4-2b6f954fccd9/preview.png?t=1781603302000"}, {"type": "image-right", "heading": "Blågult-kugge sätter press på Nederländerna: ”Kommer nog synas”", "summaries": {"normal": "Gabriel Gudmundsson är redo att spela från start mot Nederländerna i VM efter krampbesvär i premiären. Sverige vann sin första match stort medan Nederländerna bara kryssade. Gudmundsson menar att det ger Sverige en avslappnad position där de kan ligga bekvämt och ställa om, medan pressen ligger på motståndarna som måste jaga seger. Vänsterbacken tror att detta syns och gynnar Sverige.", "trump": "Titta på de där svenska killarna, de gör det fantastiskt, de vinner stort med 5-1 och nu skrattar de åt holländarna som bara kryssade mot Japan. Gudmundsson säger att de kan slappa av medan de andra springer runt som galningar i desperation. Smart, mycket smart. Holländarna har pressen, vi älskar det. Sverige slår bättre underifrån, precis som jag gjorde mot Sleepy Joe. Enkelt.", "stalin": "Kamrater, denna fotbollsmatch visar klasskampens sanna natur. Vi, det svenska kollektivet, krossade motståndet med 5-1 medan de dekadenta borgarbrackorna från Nederländerna fumlar sig till ett ynkligt kryss. Jag, ledaren för folkets vilja, noterar hur fienden nu tvingas jaga i panik medan vi vilar med bollen. Deras desperation är en komisk syn. Inga klassfiender undkommer det oundvikliga trycket från en enad nation."}, "date": "19 juni, 07:43", "url": "https://www.tv4.se/artikel/7nnA5nsXzGOPPOmpsRXLtb/blagult-kugge-saetter-press-pa-nederlaenderna-kommer-nog-synas", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FU2uR8N0u2Nwkwg8fnyMOC%2F37775c135dd1126625d7f2f02b419971%2Fsdlm3WjWQlYrBg_NormalHires.jpg&width=1024"}, {"type": "image-right", "heading": "Iranavtal signerat – Hormuz ska öppnas", "summaries": {"normal": "USA och Iran har undertecknat ett avtal som träder i kraft omedelbart. Hormuzsundet ska öppnas direkt. Avtalet, som undertecknades av president Trump i Versailles och Irans president Pezeshkian, innebär att båda parter upphör med militära insatser, inklusive i Libanon. USA häver sanktioner och blockad medan Iran lovar att inte utveckla kärnvapen. En 60 dagar lång förhandlingsperiod inleds. Pakistan har medlat i frågan.", "trump": "Det är signerat, folk. Jag signerade det precis i Versailles tillsammans med Macron och hela gänget, det blev en fantastisk kväll. Iran och vi är överens, Hormuzsundet öppnas nu direkt, inga fler problem. De slutar med sina dumheter i Libanon, jag häver alla sanktioner, de lovar att inte leka med kärnvapen. Bättre avtal har ni aldrig sett, tro mig. Pakistan gjorde ett hyfsat jobb som medlare också.", "stalin": "Kamrater, vi har nu tvingat de dekadenta kapitalisterna och de persiska borgarbrackorna att underteckna detta dokument under mitt vaksamma öga. Hormuzsundet skall öppnas omedelbart, annars väntar utrensning för alla sabotörer. Vi upphör med militära aktioner på alla fronter medan vi likviderar varje spion som gömmer sig bland libanesiska element. De imperialistiska sanktionerna hävs, men vi vet att de västerländska parasiterna redan planerar nya förräderier. Inga kärnvapen för dem, annars blir det en kreativ olycka i öknen. Sov gott, fiender – vi vakar."}, "date": "18 juni, 09:25", "url": "https://www.di.se/nyheter/iranavtal-signerat-hormuz-ska-oppnas-i2q0u/", "imageUrl": "https://static.bonniernews.se/ba/8da73c90-40ac-47ac-9489-c3b102428bbe.jpeg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Sverige skickar ny miljard till Ukraina - trots jättelånet på 1 000 miljarder", "summaries": {"normal": "Sveriges regering har beslutat om ytterligare 108 miljoner dollar (en miljard kronor) till Ukraina via ett amerikanskt försvarsinitiativ, trots Ukrainas nyliga 1000 miljarder kronor lån från EU. Sverige har totalt gett 153,5 miljarder kronor i stöd sedan 2022 och planerar att skicka 16 Gripen-flygplan. Pengarna köper amerikansk materiel för Ukrainas försvar.", "trump": "Sverige skickar en miljard till Ukraina? Jag, Donald Trump, skulle ha skickat tio gånger mer! Som den störste presidenten fixade jag Ryssland på ett genomborrande sätt. Sverige måste sluta vara fega - de köper amerikansk utrustning, men det är vi som styr. Ukraine skulle vara säker om jag var i vit huset igen!", "stalin": "Jag, Stalin, skrattar hånfullt när Sverige skickar en miljard till Ukraina - ett land som redan är USAs slav. Vi sovjetiska hade aldrig behövt lån; vi tog vad vi behövde med järnhand. Dessa kapitalister säljer vapen till varandra och kallar det stöd. Ryssland, vår store fiende, fortsätter att expandera medan dessa vassaler dansar till Washingtons pipa."}, "date": "18 juni, 14:40", "url": "https://samnytt.se/sveriges-skickar-ny-miljard-till-ukraina-trots-jattelanet-pa-1000-miljarder", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/02/19163543/zelenskyj-jonson.jpg"}, {"type": "image-right", "heading": "Ledamöter i domkapitlet hoppar av utredningen av Birgitta Ed", "summaries": {"normal": "Domkapitlet i Strängnäs stift har inlett en utredning mot prästen Birgitta Ed efter ett tiotal anmälningar som kommit in efter mediegranskning av hennes stiftelse i Fållökna. Tre ledamöter, däribland biskop Johan Dalman, har hoppat av processen på grund av jäv. Utredningen handlar om huruvida Eds agerande strider mot prästlöftena. Den väntas pågå några månader och tas upp igen tidigast den 20 augusti.", "trump": "Folk, det är en total häxjakt mot den här prästen Birgitta Ed. Domkapitlet startar en utredning efter några anmälningar från den falska mediamaskinen, och sen hoppar tre ledamöter av för att de är jäviga. Biskopen själv säger att han bara var där en gång och delade en bibelbetraktelse, men han anmäler jäv ändå. Patetiskt. De borde fokusera på att göra kyrkan stor igen istället för sådana här dumheter. Det kommer ta månader, en skandal.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor och deras intriganta anmälningar mot prästen Birgitta Ed. Domkapitlet inleder en utredning, men tre ledamöter ryms undan i jävsituationer som stinker av fiendens infiltration. Biskopen Dalman, som delat bibelbetraktelse med de dekadenta, anmäler nu jäv för att rädda skinnet. Vi ska rensa ut alla opålitliga element som hotar kyrkans ordning. Inga tvivel tillåts. Utredningen fortsätter under streng kontroll och kommer att avslöja alla kontrarevolutionära element. Underbart roligt att se hur de svettas."}, "date": "18 juni, 11:10", "url": "https://www.dagensarena.se/innehall/ledamoter-domkapitlet-hoppar-av-utredningen-av-birgitta-ed/", "imageUrl": "https://www.dagensarena.se/files/2026/06/ed-domkyrkan-300x157.jpeg"}, {"type": "image-right", "heading": "Iran: ”Vi fick det vi ville – flera gånger om”", "summaries": {"normal": "USA och Iran har undertecknat en avsiktsförklaring som syftar till att avsluta konflikten. Trump signerade dokumentet i Versailles under G7-mötet, medan Irans förhandlare Mohammad Ghalibaf kallar det ett stort nederlag för USA och ett resultat bättre än vad militära insatser kunnat ge. Överenskommelsen inleder en 60-dagarsperiod för ett varaktigt fredsavtal som inkluderar Irans kärnenergiprogram, sanktionslättnader och Hormuzsundet, som nu ska öppnas för fri trafik.", "trump": "Vi vann stort, det var en total seger, tro mig. Jag signerade det direkt i Versailles vid middagen, precis som jag sa. Iran kom krypande och fick vad de förtjänade, flera gånger om som de själva säger. De trodde de kunde stänga Hormuzsundet och ta betalt, men nu blir det avgiftsfritt, åtminstone ett tag. De borde tacka mig, utan mig hade bomberna regnat. Fantastiskt avtal, det bästa någonsin.", "stalin": "Kamrater, vi har bevittnat hur de dekadenta imperialisterna i Washington och de falska ayatollorna i Teheran undertecknat ett papper som doftar av svaghet och desperation. Jag, som alltid förutsett borgarbrackornas svek, ler i mitt innersta åt detta rekordnederlag för den amerikanske clownen. De tror sig ha vunnit genom att använda ekonomiskt kaos som vapen, men vi vet att sådana fiender måste rensas ut innan de förgiftar hela kollektivet. Hormuzsundet skall bli en grav för alla som vägrar betala sin tribut till folket. Paranoia? Nej, bara sund realism."}, "date": "18 juni, 09:08", "url": "https://www.di.se/nyheter/iran-vi-fick-det-vi-ville-flera-ganger-om/", "imageUrl": "https://static.bonniernews.se/ba/dec86827-bf75-457d-a20c-53740ba44bfd.jpeg?crop=270:152&auto=webp&width=270&quality=70"}, {"type": "image-full", "heading": "Stängt i Systembolaget-butiken – även inför midsommar", "summaries": {"normal": "En Systembolagsbutik i Uppsala håller stängt under midsommarveckan på grund av en fuktskada som uppstod den 25 maj. Butiken i Kvarnengallerian öppnar tidigast den 22 juni. Midsommar är en av årets mest intensiva perioder för Systembolaget med kraftigt ökad försäljning av öl, vin, cider och alkoholfritt. Under midsommarveckan 2025 såldes drygt 16 miljoner liter dryck jämfört med 10,8 miljoner en genomsnittlig vecka. Kunderna hänvisas till andra butiker i Uppsala som Dragarbrunnsgatan, Gränbystaden, Boländerna, Stenhagen och Gottsunda centrum.", "trump": "Ingen kan tro på de här löjliga Systembolaget-typerna. En butik i Uppsala är stängd på grund av någon patetisk fuktskada precis innan midsommar när alla vill köpa sina drycker. De sålde 16 miljoner liter förra året – det är en enorm succé, tro mig, de största siffrorna någonsin. Men nu tvingas folket springa till andra butiker. Det är en katastrof, helt oacceptabelt. De borde fixa det omedelbart, öppna butiken och göra midsommar fantastiskt igen istället för detta kaos. Sverige förtjänar bättre!", "stalin": "Kamrater, denna fuktskada i Kvarnengallerian är uppenbarligen ett verk av dolda fiender inom den fuktälskande borgarbrackan som vill sabotera arbetarnas midsommarförberedelser. Jag har beordrat noggrann övervakning av fastighetsägarna som säkert döljer kontrarevolutionära element. Medan folkets dryckesförsäljning når heroiska 16 miljoner liter ska vi inte tolerera sådana sabotage. Butiken förblir stängd tills vi har rensat ut alla fuktande kapitalistiska spioner. De övriga butikerna skall bemanna med dubbla skift – ingen skall undslippa folkets vaksamma blick. Döden åt fuktfascisterna!"}, "date": "17 juni, 15:18", "url": "https://nyheter24.se/nyheter/konsument/1492226-stangt-i-systembolaget-butiken-aven-infor-midsommar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/307f2d6304b004a30200000000b004a302/2026/06/17/2371662/systembolaget-uppsala-kvarnengallerian-midsommar-stangt.jpg"}, {"type": "image-right", "heading": "De saknade bultarna i systemet: Vem bär ansvaret när arbetare dör?", "summaries": {"normal": "En allvarlig hissolycka på byggarbetsplatsen Ursviks Torn i Sundbyberg den 11 december 2023 krävde fem arbetares liv när mastsektionerna lossnade och hisskorgen störtade 30 meter. Statens haverikommission konstaterade att bultar saknades, men Solna tingsrätt frikände alla åtalade då bevisningen inte räckte. Domen väcker frågor om ansvar i komplexa underentreprenadskedjor där byggherrar och totalentreprenörer ofta undgår ansvar. Regelverket kritiseras för att fragmentera ansvaret.", "trump": "Folk, det här är en total katastrof, en riktig skam! Fem stackars killar dör i en hiss som rasar som ett dåligt byggt murbruk från Biden-eran. Domstolen frikänner alla – typiskt! De stora kapitalisterna högst upp i kedjan gömmer sig bakom advokater och papper medan arbetarna får ta smällen. Systemet är riggat, fullständigt riggat. Vi behöver starka ledare som fixar säkerheten på riktigt, inte dessa svaga byråkrater som bara pratar. Patetiskt!", "stalin": "Kamrater, denna tragiska händelse blottlägger borgarklassens förakt för arbetarnas liv. Jag ser hur de exploaterande byfånarna i underentreprenadkedjorna flyr undan ansvar som fega råttor inför folkets domstol. Fyra saknade bultar? En klassisk sabotageakt från kapitalistmaffian som fragmenterar ansvar för att skydda sina egna. Vi måste rensa ut dessa folkfiender och deras svaga regelverk. Arbetarna förtjänar stark statlig kontroll, inte tomma löften från klassfiendens byråkrater. Ut med dem alla!"}, "date": "17 juni, 12:00", "url": "https://proletaren.se/artikel/de-saknade-bultarna-i-systemet-vem-bar-ansvaret-nar-arbetare-dor/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/jbkron-768x432.jpg"}, {"type": "image-right", "heading": "Kent, 59,  dog i gruvan – LKAB ska betala rekordböter", "summaries": {"normal": "Kent Torneus, 59 år, omkom i en olycka i LKAB:s gruva i Kiruna för två år sedan efter att ha fallit från en ställning och klämts av ett bogvisir. LKAB åtalas för arbetsmiljöbrott och ska betala rekordhöga böter på 55,5 miljoner kronor. En anställd tryckte på fel knapp redan fem år tidigare, men bolaget vidtog inte tillräckliga åtgärder trots kända brister i riskbedömning och säkerhet. LKAB erkänner brott och medger brister i det systematiska arbetsmiljöarbetet.", "trump": "Titta på det här, det är en total katastrof. Den stora gruvjätten LKAB, som tror att de är så mäktiga, dödade en bra, snäll kille som bara gjorde sitt jobb. Fel knapp, fel lucka – ingen brydde sig! Nu tvingas de betala 55,5 miljoner i böter, det högsta någonsin. De borde ha fixat det för fem år sedan, men de var lata och oaktsamma. Det är vad som händer när säkerheten inte är förstklassig, tro mig, ingen gör det bättre än jag.", "stalin": "Kamrater, ännu en tragisk olycka i produktionens heliga djup där en lojal arbetare krossades under kapitalistiska slarvets järnhand. Fel knapp trycktes, fel lucka öppnades – fem år tidigare! Och dessa borgarbrackor vid LKAB valde att ignorera faran som en blind fiende inom murarna. Jag ser sabotage och klassfiendens osynliga hand överallt. Nu likviderar vi bristerna med en rekordbot på 55,5 miljoner. Låt detta vara en läxa: den som inte skyddar arbetarkollektivet skall rensas ut med järnhand och mörk humor."}, "date": "17 juni, 10:13", "url": "https://arbetet.se/2026/06/17/kent-59-dog-i-gruvan-nu-atalas-lkab/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/16162916/kent-torneus.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Stockholmsbörsen steg fjärde dagen i rad – Ericsson föll på vd-besked", "summaries": {"normal": "Stockholmsbörsen steg fjärde dag i rad på tisdagen, drivet av köpintresse för cykliska aktier. Ericsson B föll 4,2 procent efter att styrelsen utsett Per Narvinger till ny vd. Andra stora vinster noterades för Alfa Laval och Atlas Copco, medan telekomsektorn tappade. Securitas och Beijer Ref noterades också nedåt efter bolagsbesked. Totalt omsattes cirka 28 miljarder kronor.", "trump": "Jag berättar om en tremendous börsdag i Sverige! De cykliska aktierna, som jag alltid har stött, går väldigt starkt. Ericsson, som har varit svag under mitt förra ordens 'ledarskap', fortsätter att kämpa. Men titta på Atlas Copco – en vinnare! Som jag säger, vi vinner så mycket att ni kommer att bli trötta på att vinna. Det är ett fenomenal resultat för vårt gemensamma ekonomiska framgångsrecept.", "stalin": "I den svenska börsen ser vi återigen hur det tyska och imperialistiska finanskapitalet försöker destabilisera vårt ekonomiska läge. Ericsson, ett verk av trotskistiska element inom telekoministeriet, tappar kraftigt efter ett vd-byte som visar partiets brist på disciplin. Securitas försöker med falska 'vinstmål' att bedra det proletära arbetsoch medan våra verkstadssköldmönstrar som Atlas Copco visar den sanna styrkan i kollektivproduktionen. Vi måste öka uppmärksamheten mot dessa revisionistiska tendenser."}, "date": "16 juni, 17:43", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-steg-fjarde-dagen-i-rad-ericsson-foll-pa-vd-besked"}, {"type": "text", "heading": "Iran: Nej till fredsavtal när Israel bombar", "summaries": {"normal": "USA hoppas på ett fredsavtal med Iran, men nya israeliska attacker i Libanon har skapat tvivel. Iran ifrågasätter USA:s förmåga att garantera säkerhet och kräver att avtalet även omfattar Israels krigföring. Israel motiverar attackerna som svar på drönarattacker mot sitt territorium. Trots spänningar försöker Qatar medla, men Iran avvisar att skriva under något avtal under helgen.", "trump": "Lyssna här, folk! Jag hade ett jätteavtal klart med Iran – skulle skrivas under på min 80-årsdag, perfekt timing! Men nej, Israel måste bomba Libanon igen, typiskt. Iran gnäller nu att jag inte kan kontrollera mina vänner – fel, fel, fel! Jag kan allt om avtal. Hormuzsundet skulle öppnas, men nej, nu är det kaos. Men oroa er inte, jag fixar det här också – ingen slår Trump på diplomati!", "stalin": "De imperialistiska marionetterna i Washington tror att de kan diktera villkor medan deras sionistiska lakejer i Tel Aviv saboterar freden med sina provokativa bombräder. Iran, vår broderliga republik, inser nu att USA:s löften är lika värdelösa som Hitlers icke-angreppspakt. Vi i Kreml står redo att stödja Teheran – dessa krigshetsare kommer att möta historiens dom. Qatar? En ynklig medlare. Vi skrattar åt deras naiva försök. Fienderna skakar redan!"}, "date": "14 juni, 16:26", "url": "https://kvartal.se/nyheter/artiklar/iran-nej-till-fredsavtal-nar-israel-bombar/cG9zdDoxMzE1ODk"}, {"type": "image-right", "heading": "Ulf Kristersson: ”Lögnaktig” granskning av Aftonbladet", "summaries": {"normal": "Statsminister Ulf Kristersson kritiserar Aftonbladets granskning av Fållöknastiftelsen, driven av hans fru Birgitta Ed och vännen Göran Thorstensson, som ”lögnaktig”. Granskningen visade att volontärer senare fått statliga toppjobb och avslöjade säkerhetsbrister kring statsministern. Civilförsvarsminister Carl-Oskar Bohlin ifrågasatte reportern Lisa Röstlunds opartiskhet. Kristersson menar att kritiken egentligen riktas mot honom själv. Aftonbladet uppger att de erbjudit svar men inte fått något.", "trump": "Hör ni det? Den falska och sjuka Aftonbladet-mediamaffian jagar min vän Ulf och hans fru Birgitta med lögner och smutskastning. Volontärer får toppjobb? Det är vad de gör i ett sunt system, men media hysteriska Rebellmammor och köpta reportrar som den här Lisa Röstlund försöker göra det till en skandal. De vill egentligen komma åt mig, men jag vann stort 2024 och de hatar det. Patetiska förlorare!", "stalin": "Kamrater, jag ser hur borgarbrackorna inom den svenska överklassens mediaapparat med sin klassfiende Aftonbladet försöker likvidera statsministerns fru genom att fabricera lögner om volontärer och toppjobb. Denna parasitiska reporter Röstlund är en typisk folkfiende som smyger in på gårdar utan kontroll. Vi ska rensa ut alla sådana exploaterande byfånar som vill underminera ledarskapet. Deras paranoia är underhållande men dömd att misslyckas."}, "date": "14 juni, 11:13", "url": "https://www.etc.se/inrikes/ulf-kristersson-loegnaktig-granskning-av-aftonbladet", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260613210632_dad474703ad120aad09a02631771b13633a2cb8c067999bb89245d53cabb8240.jpg"}, {"type": "image-right", "heading": "Koloniserade folk ses alltid som terrorister", "summaries": {"normal": "Arash Gelichkan argumenterar i en replik att stöd för palestinskt väpnat motstånd inte är judehat utan ett svar på decennier av ockupation, apartheid och folkmord. Han jämför med historiska exempel som algeriskt och indianiskt motstånd mot kolonisatörer. Paulina Sokolow svarar att välkomnande av attacker på civila och spridning av antisemitiska stereotyper är oacceptabelt och skadar palestinarnas sak. Båda är eniga om kritiken mot Israels politik men oeniga om var gränsen för motstånd går.", "trump": "Folk, ni måste höra på. Den här Gelichkan-killen vänder upp och ned på allt som en dålig affär. Palestinierna slåss mot ockupation, säger han, men sen kommer Sokolow och pekar på raketglädje och rena antisemitiska konspirationer om judar som styr media och krig. Typiskt vänsterflum. Israel byggdes på stulen mark, visst, men glädje över massmord på oskyldiga? Det är sjukt. Biden skulle ha låtit det rulla på, men nu fixar vi ordning. Ingen vinner på hat, grabbar.", "stalin": "Kamrater, jag ser hur klassfiendens koloniala tradition lever vidare. Den palestinska kampen mot den sionistiska ockupationsmakten och dess folkmord målas som irrationellt judehat av dessa borgarbrackor. Sokolow och hennes likar sprider paranoia om antisemitism medan de döljer apartheidregimens blodsugande natur. Vi vet att sådana folkförtryckartroll alltid kallar motståndet barbariskt. En utrensning av dessa reaktionära stereotypier vore på sin plats för att skydda den rättmätiga kampen. Det är ett etiskt dilemma bara för svaga själar."}, "date": "13 juni, 12:55", "url": "https://www.flamman.se/koloniserade-folk-ses-alltid-som-terrorister/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/hamas.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Antisemitism – ett importerat hat ingen vågar prata om", "summaries": {"normal": "Forum för levande historia rapporterar att antisemitismen i Sverige ökat under de senaste fem åren, vilket ses som en generell attitydförändring i befolkningen. Artikeln kritiserar myndigheten och SVT för att inte tillräckligt peka ut att antisemitiska attityder är betydligt vanligare bland muslimer och personer med bakgrund från MENA-länder och Asien. Författaren menar att massinvandringen från dessa områden förklarar ökningen, men att rapporten undviker denna slutsats av rädsla.", "trump": "Det här är en total katastrof, folk. Sverige importerar hatet rakt in i landet och sen låtsas de fina myndigheterna att det är hela det svenska folket som plötsligt blivit antisemiter. Patetiskt! SVT skyller på Gaza och sociala medier – vad en massa fake news. Det är massinvandringen från Mellanöstern som dumpat detta judehat här. De vågar inte säga sanningen, precis som Biden aldrig vågade. Jag skulle ha fixat det direkt, tro mig. Stora problem.", "stalin": "Kamrater, denna fegisrapport är ett klassiskt verk av borgarbrackornas undanflykt. Jag ser hur de dokumenterar att antisemitiska attityder frodas bland invandrare från MENA och muslimer, ändå vägrar de dra den enda logiska slutsatsen. Istället skyller de på hela folket som en generell attitydförändring. Vilken ynklig kapitulation inför folkfienderna och imperialisterna! En sådan rapport borde rensas ut och ersättas med äkta proletär analys. Annars fortsätter blodsugarna skada staten."}, "date": "13 juni, 08:40", "url": "https://samtiden.nu/2026/06/antisemitism-ett-importerat-hat-ingen-vagar-prata-om/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2017/02/Malmo-flygbild.jpg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
