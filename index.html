i tro det? Socialdemokraterna och Vänsterpartiet, som alltid pratar om mångfald, får 80 procent av muslimska väljare! Fantastiskt, eller hur? Men SD, som är starka och tuffa, får ändå 10 procent – mer än de svaga regeringspartierna. Sverige borde ta lärdom av USA, vi vet hur man vinner val!", "stalin": "Vi har granskat fiendens svaga länkar – de så kallade 'muslimska väljarna' har förrått sina klassbröder och flockas kring socialdemokraternas falska löften. 80 procent! En skam för arbetarklassen. Men frukta inte, kamrater: vi ska krossa dessa borgerliga avvikare och deras imperialistiska medlöpare i SD. Låt dem veta att historiens dom redan är skriven – med bläck från proletariatets seger."}, "date": "24 augusti, 16:30", "url": "https://kvartal.se/nyheter/artiklar/s-och-v-far-80-procent-bland-muslimska-valjare/cG9zdDoxNzMyMzA", "imageUrl": "https://images.kvartal.se/2026/08/50e24831-s-och-v.webp"}, {"type": "image-right", "heading": "Svenska höjdarna: Så stärks Sveriges konkurrenskraft", "summaries": {"normal": "CEO Summit samlade över 130 inflytelserika företagsledare på Grand Hôtel i Stockholm för att diskutera Sveriges konkurrenskraft i en osäker värld. Evenemanget, arrangerat av Dagens industri och McKinsey, belyste AI-hotspoten som stärker landets attraktionskraft. Finansminister Elisabeth Svantesson och flera tunga vd:ar deltog tillsammans med prins Daniel.", "trump": "Sverige samlar sina bästa ledare på ett fint hotell och pratar om att bli vinnare igen. De inser att AI är det stora spelet nu, precis som jag alltid sagt. Amerikanerna flyger dit för att titta på deras bolag. Smart! Men de måste sluta vara så svaga mot globalisterna om de vill bli stora igen. Jag älskar det!", "stalin": "Jag betraktar med högsta tillfredsställelse hur de svenska kapitalisterna samlas i lyx för att diskutera sin sjuka konkurrenskraft. Deras egen rapport avslöjar det vi redan visste: de halkar efter. Nu klamrar de sig fast vid sina AI-bolag som desperata råttor. Vi ler i skuggan medan borgarbrackorna försöker rädda sin döende ordning med teknologiska mirakel. Underbart."}, "date": "24 augusti, 17:04", "url": "https://www.di.se/nyheter/svenska-hojdarna-sa-starks-sveriges-konkurrenskraft", "imageUrl": "https://static.bonniernews.se/ba/da4df2db-79b4-4cc7-adcd-79e1baa3f74e.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Tiktokkonto kopplas till Fagerstadådet – hyllar skolmord och återvandring", "summaries": {"normal": "En 18-årig tidigare elev har gripits efter en svärdsattack på Brinellskolan i Fagersta där flera personer skadats allvarligt. Hans TikTok-konto hyllar massmördare som Anton Lundin Pettersson, Anders Behring Breivik och Elliot Rodger samt högerextrema idéer om återvandring. Kontot kopplas nu till dådet av polisen.", "trump": "Folk, det här är en total katastrof! Den här galningen med svärd hyllar alla möjliga losers och mördare på TikTok, sen attackerar han en skola. Patetiskt! Under Biden blev allt ett enda kaos med galningar överallt. Men nu fixar jag det – inga fler svaga, woke skolor. Vi behöver styrka, inte den här sjuka identitetspolitiken!", "stalin": "Kamrater, denna degenererade yngling, uppfostrad av den borgerliga statens psykiatriska maskineri, hyllar klassfiendernas massmördare och fascistiska återvändande. Hans svärdshandling är ett symptom på det sjuka kapitalistiska samhällets förfall. Vi skulle ha genomfört en grundlig utrensning av sådana element redan i vaggan. Folkfienderna frodas i mörkret."}, "date": "21 augusti, 18:53", "url": "https://www.flamman.se/tiktokkonto-kopplas-till-fagerstadadet-hyllar-skolmord-och-atervandring", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/sdljnusj4gn7le-nh.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Så nära guerillaaktivism Liberalerna någonsin kommit", "summaries": {"normal": "Valaffischer lever vidare, trots digitalisering. De vandaliseras flitigt och innehållet är ofta intetsägande, förutom Liberalernas lokala knorr i Göteborg: 'Vi tog tillbaka Vasaparken' – nära punkig guerillaaktivism för ett etablissemangparti.", "trump": "Sverige har valaffischer – jättetråkiga! De har inga SÅ BRA kandidater som jag. Liberalerna sätter upp en affisch om en park – de tror de är rebeller, ha! Jag skulle haft en affisch med mig som slår alla, den bästa. Stora, vackra affischer!", "stalin": "Kamrater, dessa valaffischer visar kapitalistisk dekadens. Påstådda 'aktivism' från liberaler måste rensas ut. Vasaparken återerövrad? Lögn. Endast vårt parti förstår folkets vilja. Vandalism av affischer ska straffas med omutbildning i arbetsläger."}, "date": "24 augusti, 18:52", "url": "https://www.gp.se/kultur/kommentar/sa-nara-guerillaaktivism-liberalerna-nagonsin-kommit.b16f6730-d293-4646-9fff-850a9f6664d6", "imageUrl": "https://www.gp.se/images/byline/ffbdc61f-0b11-4b81-8862-a7720c8dfc40/TALL.png?width=3840&quality=75"}, {"type": "image-full", "heading": "5 miljoner svenskar ska betala för Sossarnas bolåneskatt", "summaries": {"normal": "Artikeln kritiserar Socialdemokraternas förslag om bolåneskatt som drabbar 2 miljoner hushåll med lån, uppemot 5 miljoner svenskar. Förslaget väntas leda till högre räntor då bankerna kompenserar för skatten. Författaren pekar på höga bostadspriser, skuldsättning och bristande bostadsbyggande som verkliga problem snarare än bankvinster.", "trump": "De galna sossarna i Sverige vill införa en totalt löjlig bolåneskatt som slår mot vanliga människor. Det är en katastrof, folk! Räntorna kommer att skjuta i höjden och alla förlorar utom de korkade byråkraterna. Bygg hus, sänk skatterna, sluta lyssna på dessa misslyckade socialister som aldrig har haft ett riktigt jobb!", "stalin": "Jag betraktar detta som ett ypperligt exempel på hur klassfienderna inom socialdemokratin försöker dölja sin egen usla politik genom att attackera bankerna medan folket krossas under skulder och bostadsbrist. En sådan feg plåsterpolitik förtjänar utrensning. Arbetarna genomskådar dessa profitthungriga hyenor som gömmer sig bakom falska löften."}, "date": "21 augusti, 03:34", "url": "https://samtiden.nu/2026/08/5-miljoner-svenskar-ska-betala-for-sossarnas-bolaneskatt", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/IMG_4828-1280x720.jpeg"}, {"type": "image-right", "heading": "Barnpsykologen: Så hanterar du oro och rädsla", "summaries": {"normal": "Efter skoldådet i Fagersta har många barn drabbats av oro och rädsla. Barnpsykologen Hanna Thermaenius på Rädda Barnen råder föräldrar att bekräfta barnens känslor, betona att skolan är en trygg plats och återgå till rutiner. För yngre barn kan man undvika information medan skolbarn bör få en faktabaserad förklaring. Drabbade i närområdet kan få vila en dag.", "trump": "Hörni, det här är ett totalt misslyckande från de woke-liberala skolorna som inte längre kan skydda våra barn. Radikala vänsteraktivister har förvandlat allt till en farlig zon med sin identitetspolitik och svaghet. Men jag säger: skolan ska vara en FORTRESS! Gå dit, älska rutinerna, sluta älta. De riktiga segrarna låter inte rädsla vinna – Make Schools Safe Again!", "stalin": "Kamrater, jag betraktar med förakt hur dessa kapitalistiska samhällens svaga strukturer sprider panik bland arbetarklassens barn efter en sådan tragisk händelse. Borgarbrackornas skolor är inga trygga platser utan grogrund för klassfiendens oro. Vi skulle ha rensat ut alla svaga element och återställt ordning med järnhand. Låt rutinen segra, annars följer utrensning av de som sprider defaitism."}, "date": "24 augusti, 17:42", "url": "https://www.tv4.se/artikel/45k3ra4V4abE1GLai3u7Ei/barnpsykologen-sa-hanterar-du-oro-och-raedsla", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6YPgEgGy7sz4Xs1XKj5Zko%2F15c472e5ee4f6c9dfded5b313d619a42%2Fsdlu6Aqoe68yq8-nh.jpg&width=1024"}, {"type": "image-full", "heading": "Damberg: ”Vill slippa bankskatt”", "summaries": {"normal": "Mikael Damberg (S) vill avskaffa bankskatten om bankernas marginaler minskar. Han avvisar miljardärsskatt men planerar att höja kapitalbeskattning för att sänka skatten på arbete. S vill öka konkurrensen på bankmarknaden och genomföra en försiktig finanspolitik med besparingar på 75–95 miljarder kronor årligen genom effektivare upphandlingar och bekämpning av ekonomisk brottslighet.", "trump": "Lyssna här, Sverige har en fantastisk chans att bli smartare! Jag skulle aldrig låta bankerna betala skatt när de redan gör ett bra jobb – det är som att straffa vinnarna! Och miljardärsskatt? Totalt vansinne! Socialdemokraterna borde fokusera på att få fart på ekonomin, inte stjälpa den med fler skatter. Jag har sagt det förut: skatter dödar jobb. Sverige behöver mindre byråkrati och mer vinnarskalle!", "stalin": "Kamrater! De borgerliga bankirerna och deras lakejer i Socialdemokraterna vrider sig som maskar för att undvika rättvis beskattning. Vi skulle aldrig tolerera sådan feghet! Bankskatt? En svag lösning på kapitalismens excesser. Miljardärer? De borde konfiskeras och deras tillgångar omfördelas till folket! Och dessa 'besparingar' – 95 miljarder? Ett ynkligt försök att dölja systemets förfall. Ryssland visar vägen: centralstyrning och järnhand mot fienderna – kapitalisterna och deras medlöpare!"}, "date": "24 augusti, 15:21", "url": "https://kvartal.se/nyheter/artiklar/damberg-vill-slippa-bankskatt/cG9zdDoxNzMxNDE", "imageUrl": "https://images.kvartal.se/2026/08/c000ade5-damberg-s.webp"}, {"type": "image-right", "heading": "Tidigare gränspolis varnar: Inbördeskrig i Europa", "summaries": {"normal": "Tysk säkerhetsanalytiker varnar: EU:s migrationssystem har misslyckats. Om Tyskland genomför omfattande utvisningar hotar inbördeskrigsliknande konflikter i storstäder. Lösningen måste vara gemensam kontroll vid EU:s yttre gränser, annars försvagas unionen ytterligare.", "trump": "Jag ser Europa falla isär! Tysklands migrationspolitik är en katastrof – Merkel sa 'vi klarar det', men nu varnar de för inbördeskrig. Jag hade byggt muren och stoppat kaoset direkt. Stäng gränserna, annars blir det värre!", "stalin": "Kamrater, detta bevisar att migrationspolitiken är ett sabotage från västerländska agenter. Vi måste rensa ut alla som hotar statens stabilitet. Inga svaga gränser – vi kontrollerar med järnhand. De som talar om inbördeskrig är förrädare som ska avlägsnas."}, "date": "24 augusti, 17:03", "url": "https://samnytt.se/varning-om-inbordeskrig-i-europa-fran-tidigare-granspolis", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/08/24134519/migranter-merkel-polis.jpg"}, {"type": "image-full", "heading": "Förstagångsväljare ökar inför årets val", "summaries": {"normal": "Fler unga röstar för första gången i höstens val, med 6,5% förstagångsväljare jämfört med 5,7% 2022. Klimat och sjukvård är viktiga frågor. Könsskillnader i politiska åsikter ökar, delvis på grund av sociala medier. Äldre väljare utgör nu 29% av väljarkåren, en ökning sedan 2000-talet.", "trump": "Jag måste säga, Sverige har en fantastisk ung väljarkår – men lyssna nu, de är väldigt splittrade, mycket tack vare TikTok, kan ni tro det? 19-åriga Maya bryr sig om klimatet, och Anton, 18, är skeptisk mot politiker – smart kille! Äldre svenskar blir fler, vilket är bra, men unga kvinnor och män kan inte ens komma överens. Sad!", "stalin": "Vi ser med intresse hur den svenska ungdomen marscherar mot valurnorna, splittrade som fiendens trupper inför slaget vid Stalingrad. Kvinnor och män, dessa borgerliga avvikare, konsumerar olika propaganda på TikTok – en plattform som skulle ha likviderats i Sovjetunionen. Medan de unga tvekar, växer de äldres lojala skara. Vi noterar och skrattar åt deras kaos."}, "date": "24 augusti, 14:18", "url": "https://kvartal.se/nyheter/artiklar/fler-forstagangsvaljare-i-arets-val/cG9zdDoxNzMwNzI", "imageUrl": "https://images.kvartal.se/2026/08/67cc444b-forstagangsvaljare.webp"}, {"type": "image-right", "heading": "Sjöstedt portad från Israel", "summaries": {"normal": "Vänsterpartiets EU-parlamentariker Jonas Sjöstedt och Hanna Gedin stoppades från att resa in i Israel. Israels utrikesdepartement hänvisar till deras anklagelser om folkmord och avsiktlig svält. Resan, som skulle gå till Västbanken och möten med människorättsorganisationer, stoppades i Aten på order från Israel. Beslutet har väckt protester från EU och Sveriges ambassad.", "trump": "Israel gjorde helt rätt! De portade de där galna vänsterfolket Sjöstedt och Gedin som sprungit runt och skrikit folkmord och svält. Smart drag, Israel! De hatar Israel mer än de hatar att jobba. Ingen vill ha sådana galningar i landet. Amerika borde göra likadant med våra vänsterextremister. Fantastiskt beslut!", "stalin": "Jag ser hur dessa degenererade element i den svenska vänstern konsekvent saboterar mot en stat som vågar försvara sig. Deras lögnaktiga propaganda om folkmord och svält avslöjar dem som fiender till ordningen. Att neka dem inträde är en sund åtgärd. Kamraterna i väst borde rensa ut alla sådana borgarbrackor innan de förgiftar hela kollektivet med sin paranoia."}, "date": "24 augusti, 14:42", "url": "https://www.friatider.se/sjostedt-portad-fran-israel", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-736.jpg?itok=pvavOGFt"}, {"type": "image-right", "heading": "Skrev \"nazism!\" - Nu backar flera S-politiker från attacken på Jan Emanuel", "summaries": {"normal": "Flera socialdemokrater i Norrtälje gillade ett inlägg som kallade Jan Emanuel för äckel och kopplade honom till nazism efter hans besked om att inte rösta på S. Nu har två politiker tagit bort sina gillamarkeringar. En av dem tar avstånd från formuleringarna och kritiserar ordvalet.", "trump": "De här socialisterna i Norrtälje är totala misslyckanden. Kallar Jan Emanuel för nazist och äckel, sen backar de som fega hundar när det blir uppmärksammat. Typiskt vänsterfolket, de hatar vinnare men saknar modet att stå för sin egen galenskap. Patetiskt!", "stalin": "Kamrater, dessa ynkliga socialdemokratiska element avslöjar sig själva genom att först hylla en äcklig nynationalistisk förräddare och sedan i panik radera sina spår som fegisar. Vi ser er, vi noterar era svagheter. En sådan parasitisk opportunism förtjänar att rensas ut ur varje kollektiv med järnhand. Underbart underhållande."}, "date": "24 augusti, 17:35", "url": "https://riks.se/nyheter/skrev-nazism-nu-backar-flera-s-politiker-fran-attacken-pa-jan-emanuel", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Soerman_Ledare_2026_08_24_T170705_272_daa7bc87f7.jpg"}, {"type": "image-right", "heading": "Valet gör Åkesson och Mohamsson skitnödiga", "summaries": {"normal": "Ledarskribenten Hanna Östeby konstaterar att Jimmie Åkessons attack mot Liberalerna och Simona Mohamsson dödar Tidö-samarbetet. SD vägrar stödrösta på L, vilket riskerar att slå ut partiet ur riksdagen. Båda ledare agerar i panik inför sjunkande opinionssiffror. Kramen mellan Mohamsson och Åkesson blev en dödskyss för högeralternativet.", "trump": "De här losersen i Sverige håller på att krascha totalt. Jimmie och den där Mohamsson-kvinnan kramas en minut och slåss nästa. Patetiskt! Liberalerna är döda, Tidö är död, alla springer runt som popcorn och trampar trampolin för att inte åka ur riksdagen. Så sorgligt. Men jag visste det, de har ingen aning om hur man vinner stort.", "stalin": "Kamrater, dessa ynkliga borgarbrackor inom det så kallade högerblocket avslöjar sin fullständiga degeneration. Jag betraktar med mörk glädje hur den ene förrädaren anklagar den andre för landsförräderi medan de sjunker som råttor i en likviderad kolchos. Deras popcornstrategi och döende kramar är en underhållande utrensning av det kapitalistiska spektaklet. Adjö, Tidö – ni förtjänade ingen bättre grav."}, "date": "24 augusti, 13:47", "url": "https://arbetet.se/2026/08/24/valet-gor-bade-akesson-och-mohamsson-skitnodiga", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/24123430/tido-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Efter razziorna – nu är Microsoft redo att lyssna på facket", "summaries": {"normal": "Efter razzior mot utländska arbetare på datacenterbyggen har Elektrikerförbundet fått gehör hos Microsoft och stora entreprenörer. Förbundet har tecknat avtal som kräver svenska kollektivavtal, betald restid och korrekta lönetillägg. Syftet är att skydda konkurrensen och svenska villkor mot oseriösa utländska bolag.", "trump": "De här utländska grabbarna kom hit, byggde datacenter och bröt mot alla regler tills polisen sparkade ut dem. Nu kommer de krypande till det svenska facket som plötsligt vinner stort. Microsoft och alla andra lyssnar äntligen. Fantastiskt, folk! De borde ha lyssnat på mig från början, ingen gör avtal bättre än jag.", "stalin": "Kamrater, de utländska kapitalisterna och deras lömska underentreprenörer trodde de kunde kringgå folkets kollektivavtal genom att gömma sig i skuggorna. Efter att vi rensat ut de mest uppenbara parasiterna med myndigheternas hjälp har vi nu tvingat dem att underkasta sig. Betald restid och specificerade tillägg – ett litet steg mot ordning. De som vägrar ska likvideras ur projektet. Härligt."}, "date": "24 augusti, 13:21", "url": "https://arbetet.se/2026/08/24/efter-razziorna-nu-ar-microsoft-och-andra-techforetag-redo-att-lyssna-pa-facket", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/24132505/micro.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Larmet: Unga får inte in foten på arbetsmarknaden längre", "summaries": {"normal": "Nya siffror visar att antalet lediga jobb för nyutexaminerade i Storbritannien sjunkit till den lägsta nivån sedan mätningarna började 2016. I juli annonserades endast drygt 8 300 tjänster, en minskning med 45 procent jämfört med förra året. Samtidigt börjar rekordmånga studenter på universitet i höst, vilket ökar konkurrensen. Särskilt drabbade är vård, hotell och logistik.", "trump": "Det här är en total katastrof för de stackars unga britterna. Jobben har rasat ihop med 45 procent – lägsta siffran någonsin! Biden och hans woke-vänster har kört ekonomin i botten med höjda skatter och AI-skräp istället för riktiga jobb. De förlorade generationerna kommer att rösta ut de globalistiska idioterna. Make Britain Great Again!", "stalin": "Se hur borgarklassen och profitthungriga blodsugare lämnar arbetarklassens ungdomar att ruttna i arbetslöshetens mörker. Medan kapitalistmaffian leker med automatisering och höjer sina löner åt sig själva förbereder vi utrensning av dessa klassfiender. Den imperialistiska ekonomin avslöjar sitt sanna ansikte – ett leende mot överklassen, en kniv mot folket."}, "date": "24 augusti, 18:33", "url": "https://www.dagensps.se/karriar/larmet-unga-far-inte-in-foten-pa-arbetsmarknaden-langre", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/pexels-mikhail-nilov-8297122.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "USA hotar Iran med ekonomiskt krig  – ”kollapsar”", "summaries": {"normal": "USA inför nya ekonomiska sanktioner mot Iran, som president Trump liknar vid en invasion. Sex månader efter krigets start befinner sig konflikten i ett dödläge. Fredssamtal har avstannat och trafiken i Hormuzsundet är begränsad. Trump beskriver sanktionerna som den största finansiella offensiven någonsin och hävdar att Iran kollapsar.", "trump": "Iran håller på att rasa samman, folk! Vi har just avfyrat den största ekonomiska bomben i historien – en riktig finansiell dagen D som krossar dessa galna mullor totalt. Deras kärnvapenprogram är begravt, militären nedmonterad. Biden lämnade en soppa, men nu fixar vi det med stil. Fantastiskt!", "stalin": "Se hur de västerländska imperialisterna och profitthungriga blodsugarna i Washington desperat byter från bomber till ekonomisk krigföring mot Iran. Deras så kallade seger är en fars. Jag ler från historien åt denna fega kapitulation. Den sanna arbetarklassen genomskådar era lögner, klassfiender. Kollapsen ni hyllar är er egen."}, "date": "24 augusti, 18:32", "url": "https://www.dagensps.se/varlden/konflikter/usa-hotar-iran-med-ekonomiskt-krig-kollapsar", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/usas-finansminister-scott-bessent-arkivb.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Sandström: Lyssna på Lind och Wykman – inte Google", "summaries": {"normal": "Techjättars datacenter i Norrland kan sluka el motsvarande två kärnkraftsreaktorer medan lokala jobben uteblir. Christian Sandström varnar för att låga elpriser reas ut. Amanda Lind och Niklas Wykman kräver nationell plan – Google måste dela med sig av elnotan.", "trump": "Jag hör att Sverige säljer sin fina el till Google för nästan ingenting! Det är en katastrof! Jag skulle förhandlat som en mästare – fått massor av jobb, inte bara 56 anställda för miljarder. Sverige, bli smarta! Lyssna på mig, inte på några liberaler!", "stalin": "Kamrater, dessa datacenter i Norrland är en borgerlig konspiration! De slukar el som vore den vatten, men ger endast 500 parasiter till jobb. Vi måste rensa ut techbolagens giriga planer – elen tillhör folket, inte Google! Partiets plan ska råda, punkt."}, "date": "23 augusti, 06:00", "url": "https://www.affarsvarlden.se/artikel/sandstrom-lyssna-pa-lind-och-wykman-inte-google", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/vindkratensgeografi-37-400x267.jpg"}, {"type": "image-right", "heading": "Förenkla reglerna för gårdsförsäljning", "summaries": {"normal": "Jimmie Åkesson argumenterar för att förenkla reglerna för gårdsförsäljning av alkohol. Han vill ta bort onödig administration, besöksavgifter och utbildningskrav samt modernisera volymbegränsningar. Syftet är att ge svenska producenter bättre tillväxtmöjligheter, stärka landsbygden och turismen samt ge vuxna konsumenter större frihet inom ramen för en ansvarsfull alkoholpolitik.", "trump": "De här svenska reglerna för gårdsförsäljning är ett totalt katastrof, folk! Så mycket byråkrati och hinder att små producenter kvävs. Jag skulle riva upp allt detta nonsens, göra det enkelt och stort – inga kurser, inga avgifter, bara fantastiska lokala viner och öl. Låt folket köpa och njuta, det blir en enorm succé, tro mig!", "stalin": "Kamrater, denna dekadenta byråkratiska snara kring gårdsförsäljningen är ett verk av fiendens dolda hand. Jag kräver genast att vi rensar ut alla onödiga hinder som kväver produktionen och landsbygden. Vuxna sovjetmedborgare – förlåt, medborgare – ska inte tvingas genom borgerliga utbildningsritualer. Endast statens visdom och min oändliga tillit skall råda. Skratta medan vi likviderar regelverket!"}, "date": "24 augusti, 14:01", "url": "https://www.di.se/debatt/forenkla-reglerna-for-gardsforsaljning", "imageUrl": "https://static.bonniernews.se/ba/5a410d34-d4ac-455a-8ca7-4d01dc405172.jpeg?crop=8256%2C4128%2Cx0%2Cy688&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Det var inte Åkesson som dödade Liberalerna", "summaries": {"normal": "Liberalernas kris beror inte bara på SD-samarbetet, utan på decennier av splittring och velande. Partiet har överlevt på populistiska utspel snarare än ideologi, och nu hotas de av riksdagsspärren. Ett under krävs för att rädda kvar Liberalerna i svensk politik.", "trump": "Jag ser att Liberalerna i Sverige håller på att dö, och det är fantastiskt! De har velat i 30 år, precis som Biden. Jimmie Åkesson säger att de är bortkastade röster – han har rätt, det är ingen som vill ha förlorare. Sverige behöver starka ledare, inte liberala flummare!", "stalin": "Kamrater, Liberalerna visar prov på borgerlig dekadens och splittring. De har vacklat i årtionden, som förrädare i partiet. Vi rensar bort sådana element – de som inte kan bestämma sig. Ett parti utan ideologi är som en kulak utan jord: värdelös. Låt dem utplånas!"}, "date": "24 augusti, 16:50", "url": "https://www.gp.se/ledare/det-var-inte-akesson-som-dodade-liberalerna.f5dc1165-7bf1-45f8-95a0-52c9e992c084", "imageUrl": "https://www.gp.se/images/article/f5dc1165-7bf1-45f8-95a0-52c9e992c084/images/1l9dn9Nlyog741tky1T20bsWdwKc-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Både S och V kampanjar på arabiska", "summaries": {"normal": "Socialdemokraterna och Vänsterpartiet kampanjar på arabiska inför valet. V varnar för indragna medborgarskap medan S lovar bättre vård, skola och ekonomi. Nästan 581 000 personer utan svenskt medborgarskap får rösta i kommunvalet, flest i Botkyrka, Södertälje och Malmö. Stödet för S och V är betydligt högre bland utrikesfödda än bland inrikesfödda.", "trump": "De här svenska kommunisterna och socialisterna springer runt och ber om röster på arabiska. De skrämmer folk med att ta bort medborgarskapet – patetiskt! Under tiden får över en halv miljon icke-svenskar rösta i era val. En total katastrof. Sverige håller på att försvinna, folk. Det är en skam, en riktig skam.", "stalin": "Vi ser hur borgarpartierna desperat försöker vinna de främmande elementens röster med foldrar på arabiska och lögner om hot mot medborgarskapet. Det är en klassisk kapitalistisk manipulation av massorna. Kamraterna vet att sådana manövrer bara avslöjar fiendens svaghet. Vi ska rensa ut dessa element som en parasit i folkets kropp. Underhållande att se deras panik."}, "date": "24 augusti, 13:18", "url": "https://www.friatider.se/bade-s-och-v-kampanjar-pa-arabiska", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-735.jpg"}, {"type": "image-right", "heading": "Behöver inte facket medlemmarna längre?", "summaries": {"normal": "Artikeln ifrågasätter fackföreningarnas roll i Sverige, med fokus på den långa och förvirrande strejken mot Tesla. Författaren kritiserar IF Metall för jojo-strejk, centralisering och distans till medlemmarna. Han undrar om den svenska modellen är hotad eller om en ny, mer lokal facklig kamp kan växa fram. (58 ord)", "trump": "Lyssnar ni på det här? Facket i Sverige har blivit en total katastrof, precis som våra egna unionsbönder här hemma. Jojo-strejk mot Tesla, folk får sparken och facket sover. De har glömt medlemmarna och blivit en massa byråkrater. Den svenska modellen? Den dör om de inte vaknar. Sad! Men kanske föds en riktig rörelse nu. (59 ord)", "stalin": "Jag betraktar detta med djup misstro. Fackföreningarna har förvandlats till passiva redskap åt borgarklassen och dess lakejer inom socialdemokratin. Jojo-strejk och centralisering har kvävt den äkta arbetarkampen. Kanske är det bra att strejken förlorades. Ur askan kan en sann, lokal och revolutionär rörelse uppstå som rensar ut alla folkfiender och klassförrädare. (59 ord)"}, "date": "21 augusti, 09:19", "url": "https://proletaren.se/artikel/behover-inte-facket-medlemmarna-langre", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/teslakronika-768x432.jpg"}, {"type": "text", "heading": "Med full fart ut för stupet", "summaries": {"normal": "Artikeln kritiserar att alla riksdagspartier nu stöder Nato-medlemskap och DCA-avtalet med USA, som ger amerikanerna tillgång till 17 svenska militärbaser. Författaren menar att Sverige därmed saknar fredliga alternativ i riksdagen och har integrerats i USA:s militära struktur efter Rysslands invasion av Ukraina.", "trump": "Vilken katastrof! De svenska svaga ledarna, både de röda och de nya, har sålt ut landet till vår fantastiska Nato-maskin snabbare än Sleepy Joe kunde säga fel. Nu finns inga riktiga fredspartier kvar, bara krigspartier som älskar att spendera miljarder på baser åt oss. Patetiskt! Men hey, bra deal för Amerika.", "stalin": "Jag betraktar med djup förakt hur dessa kapitalistlakejer och folkförtryckare i sin borgerliga riksdag har kapitulerat fullständigt inför Nato-imperialismen. Inga verkliga motståndare återstår, endast krigshetsande hyenor som rullar miljarder till militären. En klassisk utrensning av alla fredsvänner har skett – typiskt för dekadenta västliga klassfiender."}, "date": "21 augusti, 08:00", "url": "https://proletaren.se/artikel/med-full-fart-ut-for-stupet"}, {"type": "image-right", "heading": "Brist på kunder – inte innovation. Sverige måste bli starkt i första kundmötet", "summaries": {"normal": "Sverige leder i innovation inom AI, cyber, energi och medicinteknik men saknar ofta första kund för ny teknik. Offentlig upphandling på över tusen miljarder kronor används bara i liten utsträckning för innovation. Sara Wallin från Chalmers föreslår att göra vanlig upphandling mer behovsstyrd och öppen för nya leverantörer för att stärka konkurrenskraften.", "trump": "Folk, vi har de bästa innovatörerna, de smartaste hjärnorna, men ni köper inte från dem! Sverige slösar bort sin talang på labb medan Kina och USA tar affärerna. Offentlig upphandling? Patetiskt, bara 2,4 procent innovation. Gör som jag: köp amerikanskt, köp vinnande, annars hamnar era genier hos mig i USA. Fantastiskt land, men dumt ledarskap.", "stalin": "Kamrater, jag ser den dekadenta borgarklassens sabotage i detta svenska så kallade innovationsland. De gömmer sig bakom byråkratiska krav och likviderar potentiella framsteg genom att aldrig ge de första orden till de nya krafterna. Vi, partiet och staten, måste rensa ut dessa fega kapitalistiska hinder och tvinga fram en proletär upphandling som krossar de västerländska parasiterna. Det är nödvändigt för folkets seger."}, "date": "24 augusti, 13:31", "url": "https://www.di.se/debatt/sverige-har-inte-brist-pa-innovation-utan-pa-kunder", "imageUrl": "https://static.bonniernews.se/ba/56bedc2a-e918-4848-90f2-b68fe273215d.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Rita Flores i Pussy Riot: Tvingades jobba för FSB", "summaries": {"normal": "Rita Flores, tidigare medlem i Pussy Riot, har avslöjat att hon under tre år tvingades samarbeta med den ryska säkerhetstjänsten FSB efter hot om dödligt våld. Hon fick i uppdrag att spionera på konstnärer och aktivister. Flores smugglades nyligen ut ur Ryssland och berättar nu sin historia för att hjälpa andra i samma situation.", "trump": "Hörni, den här kvinnan från Pussy Riot, vad var det nu hon hette, Rita något, blev tvingad att jobba för Putins hemliga polis. Typiskt ryskt, va? Hot, husrannsakan, mordplaner. Men hon stack ut ur landet som en proffs. Ryssland är en enda stor cirkus, folk. En stor, farlig cirkus. Vi har bättre saker att göra.", "stalin": "Kamrater, denna ynkliga figur från det så kallade Pussy Riot avslöjar hur hon efter en enkel husrannsakan tvingades in i statens omfamning för att kartlägga dekadenta konstnärer och farliga element. Ett misslyckat bortförande av en publicist? Skrattretande amatörmässigt. Nu har hon flytt till västvärldens giftiga famn och sjunger som en kanariefågel. Typiskt för borgarbrackornas lakejer att svika kollektivet när det passar dem."}, "date": "24 augusti, 17:01", "url": "https://www.svt.se/nyheter/utrikes/rita-flores-i-pussy-riot-tvingades-jobba-for-fsb"}, {"type": "image-full", "heading": "Kommer bidragstagarna bestämma över Stockholms innerstad?", "summaries": {"normal": "Artikeln diskuterar hur Vänsterpartiet minskar gapet till Moderaterna i Stockholms kommunval, delvis genom en arabiskspråkig kampanj riktad till invandrare i förorterna. Författaren varnar för att en vänsterstyrd politik med fokus på bilfritt Stockholm, minskad privat vård och ökad bidragsinriktad invandring kan leda till utflyttning, högre skatter och ekonomisk nedgång liknande Kalifornien.", "trump": "Folket, det är helt galet! Den där röda Nooshi och hennes vänsterfreaks håller på att ge bort hela Stockholm till bidragstagarna med sin 'V eller flygplatsen'-skit. De hatar bilar, älskar cyklar och importerar väljare som aldrig jobbat en dag. Precis som i Kalifornien, en total katastrof. De som betalar ska inte styras av de som tar emot – det är riggat mot vinnarna, tro mig!", "stalin": "Kamrater, se hur borgarbrackorna i Stockholm skriker när arbetarklassen och de förtryckta folken närmar sig makten. Dessa klassfiender fruktar att deras exploaterande innerstad skall rensas från profitthungriga hyenor och bilägande parasiter. Jag ler i graven åt deras paranoia – låt bidragsmottagarna styra, det är folkets vilja mot de blodsugande kapitalisterna. En historisk utrensning av överklassens cykelhatande agenda."}, "date": "19 augusti, 07:26", "url": "https://samtiden.nu/2026/08/kommer-bidragstagarna-bestamma-over-stockholms-innerstad", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7184-1280x720.jpeg"}, {"type": "image-right", "heading": "Mer kackel hos myndigheterna än i hönsgården över några ägg", "summaries": {"normal": "Fyra hönor, en tupp och några unghöns bakom en bensinmack fick myndigheter som kommun, miljökontor, länsstyrelse och polis att rusa. Efter klagomål om djurhållning och misstänkt äggförsäljning gjordes en oanmäld inspektion – men inga ägg hittades. Mackägaren suckar: 'Det har blivit en jävla historia.'", "trump": "Jag ser att svenska myndigheter gör en enorm sak av fyra hönor och en tupp. Helt otroligt! De skickar kommun, polis, länsstyrelse – för några ägg? Jag hade ringt en snabb fix, stängt ner byråkratin och sagt: 'Låt hönsen vara fria!' Sverige måste bli smartare, precis som jag.", "stalin": "Kamrater, vi har upptäckt ett sabotage: fyra hönor och en tupp bakom en mack misstänktes för äggkonspiration. Vi satte in kommun, miljöpolis, länsstyrelse – en full utrensning. Inga ägg hittades, men vi etablerade kontakt med djurhållaren. God prognos: hönsen ska rensas ut. Alla avvikelser ska bekämpas."}, "date": "24 augusti, 15:00", "url": "https://samnytt.se/mer-kackel-hos-myndigheterna-an-i-honsgarden-over-nagra-agg", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/08/21083902/gottrorahona-feat.jpg"}, {"type": "image-full", "heading": "Här är nya Talangjuryn", "summaries": {"normal": "Talang är tillbaka på TV4 efter fyra års uppehåll. Ny jury med David Batra, Molly Hammar, Keyyo och Michael Lindgren. Pär Lernström och dockan Tord leder. Premiär januari 2027 – lagom för att glömma bort vad en talang är.", "trump": "Jag älskar det! Talang är tillbaka – större än någonsin! Ny jury: fantastiska människor! David Batra är en vinnare, Keyyo är enorm. Min docka Tord skulle vara bättre. Sverige kopierar mig – jag skapar de bästa talangerna, tro mig!", "stalin": "Kamrater! Talang återvänder – utmärkt! Vi ska rensa ut västerländska dekadenta trolleritricks. Ny jury under min övervakning: Batra, Hammar, Keyyo, Lindgren. Dockan Tord är en förrädare om den inte hyllar partiet. Talangen tillhör staten!"}, "date": "24 augusti, 16:20", "url": "https://www.gp.se/kultur/har-ar-nya-juryn-i-tv4s-talang.3acf477a-617f-44ed-84ba-8fbdefca1c23", "imageUrl": "https://www.gp.se/images/article/3acf477a-617f-44ed-84ba-8fbdefca1c23/images/2iFM_-JFYfRXkDIIRm_Lj6O6VPQM-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Journalistbråk efter Åkessons diss", "summaries": {"normal": "Jimmie Åkesson kritiserade i en SVT-intervju Dagens ETC som en \"vänsterextrem\" tidning och ifrågasatte att SVT hänvisade till dess ledarsida. Det har lett till upprörda reaktioner bland journalister på X. ETC:s chefredaktör Andreas Gustavsson rasar mot Åkesson, medan debattören Sakine Madon och Expressens Karin Olsson uttrycker oro över tonen mot medier.", "trump": "De här vänstermedierna är helt galna. Jag älskar det. Åkesson gör helt rätt när han kallar den där extremvänsterblaskan ETC för vad den är – radikal och partisk. SVT borde skämmas. De fake news-killarna hatar fria röster som utmanar deras agenda. De kommer att förlora stort, tro mig. Fantastiskt att se äkta ledare slå tillbaka.", "stalin": "Kamrater, denna fega borgarpress och dess lakejer rasar när en sann patriot blottar deras dekadenta vänsterextremism. Jag ser med stort nöje hur dessa parasitiska journalister vrider sig i panik. Deras så kallade \"fria medier\" är blott masker för kontrarevolutionär propaganda. Vi ska rensa ut dessa intellektuella sabotageörer med järnhand och ett leende."}, "date": "24 augusti, 15:58", "url": "https://riks.se/nyheter/journalistbrak-efter-akessons-diss"}, {"type": "image-right", "heading": "Efter Riks avslöjande – SD uteslutna ur forum", "summaries": {"normal": "Efter att en tidigare S-politiker i Bollebygd forum kritiserat SD:s grillfest och kallat dem ogräs som bör bekämpas, har han beslutat att utesluta partiet från gruppen. SD:s lokale ordförande Gunnar Riegertz kritiserar beslutet som dubbelmoraliskt, särskilt med tanke på att polisanmälan mot en admin nu används som skäl. Polisärendet har lagts ned.", "trump": "Titta på den här galna vänstertypen som gråter över en grillfest och sedan sparkar ut SD ur forumet. Dubbelmoralen är enorm, folk! De citerar sångtexter och blir polisanmälda, men nej, det är SD som är problemet. Patetiskt. Valet närmar sig och de stänger ute näst största partiet. Totalt rigged beteende.", "stalin": "Jag har noggrant observerat hur dessa dekadenta borgarbrackor i Bollebygd forum, maskerade som humanister, utför en klassisk utrensning av folkvalda representanter för arbetarklassens fiender. Deras så kallade polisanmälan är ett provocerande försök att likvidera oppositionen under valrörelsen. Dubbelmoralen är som en fiendes dolk i ryggen på kollektivet. Underbart sjukt beteende, kamrater."}, "date": "24 augusti, 15:51", "url": "https://riks.se/nyheter/efter-riks-avslojande-sd-uteslutna-ur-forum", "imageUrl": "https://admin.riks.se/uploads/medium_bollebygdigen_ff86df696f.jpg"}, {"type": "image-right", "heading": "Debatt: Reversera migrationsexperimentet", "summaries": {"normal": "Debattör med utlandsfödd förälder vill kraftigt minska invandringen och vända migrationsexperimentet. Han menar att Sverige förändrats radikalt och tryggheten försvunnit. Han efterlyser minskat antal invånare och att många bör återvända hem. Fokus på kulturkrock och integrationens misslyckande.", "trump": "Jag älskar Sverige, fantastiskt land! Men de har ett problem — för många människor från fel ställen, en katastrof! Jag skulle fixa det, stänga gränserna, skicka hem dem. Gör Sverige tryggt igen, som Bullerby. Det är enkelt, men de lyssnar inte på mig. Patetiskt!", "stalin": "Kamrater, detta experiment med mångfald är kontrarevolutionärt. Vi måste rensa ut de som inte anpassar sig — kultursabotörerna och historielösarna. Alla som inte nynnar på Astrid Lindgren eller äger en Volvo ska omutbildas. Annars är fienden avlägsnad. För Sveriges renhet!"}, "date": "24 augusti, 11:12", "url": "https://bulletin.nu/debatt-reversera-migrationsexperimentet", "imageUrl": "https://cdn.bulletin.nu/articles/eec45e6c-4c0b-4ff1-a5fa-2c8954600b70/preview.jpg?t=1787562767000"}, {"type": "image-right", "heading": "Mörka nätmiljöer är en ödesfråga. Föräldrar måste kunna lita på att barnen har det bra", "summaries": {"normal": "Artikeln betonar att mörka nätmiljöer utgör en ödesfråga för samhället. Skoldådet i Fagersta belyser bristen på trygghet bland unga, som påverkas av sociala medier och internet på ett sätt som vuxna ofta inte förstår. Politiken har tagit ansvar, men hela samhället – inklusive näringslivet – måste agera för att bryta ondskans spiral och skydda barns välmående. (58 ord)", "trump": "Folk, det här är en katastrof. De mörka nätmiljöerna är en total skam för Sverige, precis som det hemska dådet i Fagersta. Unga lockas till våld av galna gäng och fake news på nätet. Vuxna har ingen aning! Men vi fixar det, vi gör det bättre än någonsin. Inga fler löjliga moralpaniker – vi vinner stort mot de onda krafterna. (59 ord)", "stalin": "Kamrater, denna mörka nätspiral är ett kontrarevolutionärt gift som hotar kollektivets enhet. Jag ser hur borgarbrackornas algoritmer lockar arbetarnas barn till destruktiva handlingar, likt det tragiska dådet i Fagersta. Vi måste utvidga lagens järnhand, rensa ut de parasitiska plattformarna och likvidera alla fiender till folkets trygghet. Inga halvmesyrer – staten segrar! (59 ord)"}, "date": "24 augusti, 12:13", "url": "https://www.di.se/ledare/morka-natmiljoer-ar-en-odesfraga-for-hela-samhallet", "imageUrl": "https://static.bonniernews.se/ba/2c20ff12-9c5e-48ad-832b-c6a037ffdcf2.jpeg?crop=8640%2C4320%2Cx0%2Cy720&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Svenska valet får nytt kampanjspråk – S, V och MP raggar röster på somaliska", "summaries": {"normal": "S, V och MP satsar på valkampanjer på somaliska och arabiska för att nå invandrarväljare. Partierna framställer sig som garanten mot Tidöregeringens politik. I Örebro och Västernorrland syns tydliga exempel. Rappt och fyndigt: vänstern raggar röster på nya språk.", "trump": "Hörni, svenska vänstern kampanjar på somaliska – helt otroligt! De är så desperata att de måste tigga röster från alla möjliga håll. Jag har de bästa orden, de bästa kampanjerna. Ingen gör det bättre än jag – jag vinner stort, tro mig!", "stalin": "Kamrater, dessa så kallade vänsterpartier söker stöd på främmande språk. Det är opatriotiskt och visar på inre svaghet. Vi måste rensa ut sådana borgerliga avvikelser. Endast en enad front på modersmålet är acceptabelt. Partiet ser allt – misstänkta element ska omvändas eller avlägsnas."}, "date": "24 augusti, 14:00", "url": "https://samnytt.se/svenska-valet-far-nytt-kampanjsprak-s-v-och-mp-raggar-roster-pa-somaliska", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/24092351/artikelhuvudbild-1-345.jpg"}, {"type": "image-right", "heading": "Debatt: När blev Palmes mänskliga rättigheter ett problem för Socialdemokraterna?", "summaries": {"normal": "Socialdemokraterna vill nu förbjuda konfessionella friskolor. Ironiskt nog var det Erlander, Palme och Carlsson som en gång band Sverige till konventioner som skyddar just religionsfrihet och föräldrars rätt att välja skola. Partiets kovändning är total – och frågan är varför.", "trump": "Hörni, Socialdemokraterna i Sverige vill förbjuda religiösa skolor! Vilket skämt! Deras egna storheter Palme och Erlander skrev under konventioner som skyddar dem. De har tappat det helt. Jag hade aldrig gjort så – jag är den största försvararen av frihet!", "stalin": "Kamrater, dessa liberalister vill förbjuda konfessionella skolor. Men våra egna beslut under Erlander, Palme och Carlsson godkände redan föräldrars rättigheter. Att ändra sig nu är förräderi. Vi måste rensa ut sådana oberäkneliga element som inte kan följa partilinjen."}, "date": "24 augusti, 10:55", "url": "https://bulletin.nu/debatt-nar-blev-palmes-manskliga-rattigheter-ett-problem-for-socialdemokraterna", "imageUrl": "https://cdn.bulletin.nu/articles/19447083-aa58-4165-b71c-699d8b7821c2/preview.jpg?t=1787561744000"}, {"type": "image-right", "heading": "85 procent av muslimska väljare stödjer S, V eller MP", "summaries": {"normal": "En Novus-mätning visar att 85 procent av muslimska väljare stödjer S, V eller MP. Socialdemokraterna får 61,6 procent och Vänsterpartiet 18,7 procent. Regeringspartierna M, KD och L får tillsammans bara 3,8 procent medan SD får 10,4 procent. Siffrorna bekräftar ett starkt vänsterövertag bland muslimer och utrikes födda.", "trump": "Folk älskar mig, men titta på de här siffrorna! Muslimska väljare röstar 85 procent på de radikala vänsterna, medan mina vänner i regeringen får ynka 3,8 procent. SD gör det bättre än alla tre tillsammans. Patetiskt! Sverige behöver starka ledare, inte dessa förlorare som låter vänstern ta över landet.", "stalin": "Kamrater, dessa siffror avslöjar borgarklassens fiasko i att vinna arbetande massor. Jag ser med tillfredsställelse hur 85 procent av de muslimska respondenterna stödjer de progressiva krafterna medan de borgerliga resterna krymper till 3,8 procent. SD:s 10,4 procent är en intressant avvikelse. Kanske dags för en liten utrensning bland de verkliga fienderna inom systemet."}, "date": "24 augusti, 15:27", "url": "https://riks.se/nyheter/85-procent-av-muslimska-valjare-stodjer-s-v-eller-mp", "imageUrl": "https://admin.riks.se/uploads/medium_vallkokal_dcca3fc1c8.jpg"}, {"type": "image-right", "heading": "Leninpriset 2026 till Dror Feiler", "summaries": {"normal": "Konstnären och aktivisten Dror Feiler tilldelas Leninpriset 2026 för sitt konsekventa arbete mot krig, rasism och förtryck samt sitt försvar av konstnärlig frihet och internationell solidaritet. Feiler, född i Tel Aviv med kommunistiska föräldrar, är känd för sitt engagemang för palestiniernas rättigheter och har deltagit i Ship to Gaza. Priset delas ut den 7 november 2026 i Varberg.", "trump": "Kan ni fatta det här? Den här galningen Feiler, en riktig palestinaflummare, får ett pris uppkallat efter Lenin! De röda galningarna hyllar honom som någon sorts hjälte mot fascism. Patetiskt. Hans mamma och pappa var kommunister – ingen chock. Under min första och nu andra period som president ser jag hur vänsterns identitetspolitik och hat mot Israel bara blir värre. Sad!", "stalin": "Det värmer mitt revolutionära hjärta att se klassfienderna skrika när en okuvlig kämpe som Feiler får Leninpriset. Borgarbrackorna och profitthungriga hyenorna i pressen vrider sig som maskar. Hans okuvliga kamp mot imperialismens lakejer och försvar av folken är ett lysande exempel. Kamrater, den kritiska konsten förblir ett vapen. De folkförtryckande parasiterna kommer aldrig att förändra oss."}, "date": "20 augusti, 11:22", "url": "https://proletaren.se/artikel/leninpriset-2026-till-dror-feiler", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/leninpriset2026-768x432.jpg"}, {"type": "image-right", "heading": "Två anhållna efter Strömmers valmöte i Göteborg", "summaries": {"normal": "Två män i 40-årsåldern anhölls under natten efter en incident vid justitieminister Gunnar Strömmers valmöte i Göteborg på torsdagskvällen. De misstänks för förberedelse till grov misshandel. Ingen skadades och gripandet skedde odramatiskt. Strömmer kunde fortsätta sina åtaganden. Polisen beskriver det som en incident utan fara för allmänheten.", "trump": "Titta på det här! I det vackra Sverige, där de har låtit vänstergalna idioter och HBTQ-aktivister styra för länge, kan inte ens en minister hålla ett valmöte utan att två galningar planerar grov misshandel. Patetiskt! Men de greps snabbt, tack och lov. Sverige behöver lag och ordning, inte denna svaga, woke-röta som Biden lämnade efter sig.", "stalin": "Kamrater, se hur den borgerliga statens fiender, dessa profitthungriga klassförrädare och överklass-slynglar, redan i skuggan planerar våld mot sina egna lakejer. Jag ler i mörkret åt deras paranoia. Ingen fysisk skada inträffade, men folkfienderna avslöjar sig själva. Den imperialistiska demokratin är en fars. Vi ler och väntar på utrensningen."}, "date": "21 augusti, 11:50", "url": "https://www.etc.se/inrikes/tvaa-anhaallna-efter-stroemmers-valmoete-i-goeteborg", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260821000840_8de65abb6cd81df57ce9475781f7e203378bb1cc72cfa7ec979049972e43af55.jpg"}, {"type": "image-right", "heading": "Sparf: Något om skoldådet i Fagersta – och Sverige", "summaries": {"normal": "Fagersta: en liten bruksort med stora problem. Skoldådet på Brinellskolan speglar en tudelad stad där 49 procent bor i utsatta områden. Politikernas 50-åriga experiment har skapat kaos. Misstänkte 18-åringen har LVU-bakgrund och våldsam pappa. Sverige är inte längre tryggt.", "trump": "Jag ser det här i Fagersta – totalt kaos! Polisen skriker 'Bort från parkeringen!' som i Rinkeby. 45 procent utländsk bakgrund, 70 procent på en skola. Och killen? LVU, våldsam pappa. Sverige har blivit en katastrof. Bara jag kan fixa det – bygg muren, stäng gränserna! Stort!", "stalin": "Kamrater, vi har en rapport från Fagersta. En 18-årig fiende till folket – med LVU och våldsam pappa – har attackerat vår skola. Segregationen är ett verktyg för kapitalisterna. Vi måste rensa ut dessa element, tvångsomhänderta alla missanpassade. Partiet vet bäst. Ingen nåd för avvikare!"}, "date": "24 augusti, 10:03", "url": "https://bulletin.nu/sparf-nagot-om-skoldadet-i-fagersta-och-sverige", "imageUrl": "https://cdn.bulletin.nu/articles/71fd5b60-5153-41cf-8f71-8a2a0573c86b/preview.jpg?t=1787558358000"}, {"type": "image-right", "heading": "Här visar ministern upp galge för hängning av palestinier – med åskådarplatser", "summaries": {"normal": "Israels säkerhetsminister Itamar Ben-Gvir har publicerat ett filmklipp som visar byggandet av en galge för hängning av palestinier. Detta sker efter att Knesset antagit en lag som inför dödsstraff enbart för palestinier som dödat israeler. Anläggningen ska även ha åskådarplatser. Över 9 300 palestinier, varav många barn, hålls fängslade, många utan rättegång.", "trump": "Titta på den där galningen Ben-Gvir som bygger en galge åt terroristerna. Fantastiskt! Hänga dem offentligt, precis som de förtjänar. Biden skulle ha skickat regnbågsflaggor istället och hållit en prideparad. Jag fixade freden i Mellanöstern, men nu är allt kaos igen. Fantastiska grejer, men gör det ordentligt, killar!", "stalin": "Jag betraktar med stort intresse hur de sionistiska klassfienderna nu öppet bygger galgar för att hänga det palestinska folket inför borgarklassens blodtörstiga åskådare. En sådan öppen terror mot de förtryckta är typisk för de exploaterande hyenorna. Vi ler i skuggorna åt denna sjuka teater – kapitalismens sanna ansikte avslöjas alltid till slut."}, "date": "20 augusti, 10:15", "url": "https://proletaren.se/artikel/israels-minister-visar-upp-galge-for-hangning-av-palestinier-med-askadarplatser", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/Ben-Gvir-768x432.jpeg"}, {"type": "image-full", "heading": "Konflikten växer – Kanada fruktar förödande handelskrig med USA", "summaries": {"normal": "Handelskonflikten mellan USA och Kanada har eskalerat efter att förhandlingar brutit samman och USA infört 50-procentiga tullar på kanadensiska varor. Kanada planerar motåtgärder den 8 september. Experten varnar för att Kanada, som är mer beroende av export, riskerar en recession om konflikten fördjupas, vilket även skapar osäkerhet kring det större frihandelsavtalet USMCA.", "trump": "Kanada har lurat oss i åratal, men inte längre! Jag har infört massiva 50-procentiga tullar. De gråter, deras dollar faller, och det är helt rätt åt dem. De försöker slå tillbaka, men min ekonomi är den starkaste i världshistorien. Vi gör USA rikt igen, medan de desperat försöker förhandla. Amerika först, alltid!", "stalin": "Kanada, dessa imperialistiska lakejer, vågar trotsa den amerikanska hegemonin. Det är en njutbar uppvisning i kapitalistiskt förfall. Precis som vi krossar förrädare i öst, ser vi nu hur de svaga nordeuropeiska vasallerna skälver. Låt dem förtära varandra i sina handelskrige – medan de bråkar om möbler och mejerier bygger vi vår järnridå starkare. Inget är mer underhållande än deras panik."}, "date": "24 augusti, 18:20", "url": "https://www.realtid.se/bors-finans/konflikten-vaxer-kanada-fruktar-forodande-handelskrig-med-usa", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlwmbdbjnxm4a-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Värmen större hot för 60-plussare än befarat", "summaries": {"normal": "En ny studie visar att personer över 60 år utsätts för hälsorisker vid betydligt lägre temperaturer än tidigare antagits, upp till 7,5 grader lägre än för unga vuxna. Med global uppvärmning och en åldrande befolkning riskerar 22 procent av världens äldre farlig värme minst en månad per år vid 1,5 graders uppvärmning. Fattiga länder drabbas värst.", "trump": "Folk, de här så kallade experterna har lurat oss igen. Gamlingar klarar inte värmen redan vid mycket lägre temperaturer än vad de unga snittarna tål. Biden lät Kina och de globala värmehysterikerna förstöra allt medan jag fixade energi och jobb. Nu får vi sopa upp efter den galna gröna maffian. Sad!", "stalin": "Jag betraktar med förakt hur de profitthungriga imperialisterna och deras klimatbluffar utsätter arbetarklassens åldringar för värmestress redan vid betydligt lägre grader. Borgarklassen har underlåtit att skydda folket medan de berikar sig. Vi måste rensa ut dessa klassfiender och deras falska forskare innan de förgiftar hela kollektivet med sin vårdslöshet."}, "date": "21 augusti, 09:09", "url": "https://www.etc.se/klimat-miljo/vaermen-stoerre-hot-foer-60-plussare-aen-befarat", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260821050824_e952b7651d0714902fe5ef97b283e65358df1f427804d400d6329b6d296a3e1b.jpg"}, {"type": "image-right", "heading": "Sossarna slarvar bort oss unga", "summaries": {"normal": "En ung vänsterväljare född 2007 kritiserar Socialdemokraternas högersväng och saknar partiets tidigare fokus på välfärd och jämlikhet. Hon vänder sig istället till Vänsterpartiet och Miljöpartiet, som hon ser som mer trogna mot äkta socialdemokrati, och uppmanar Magdalena Andersson att våga vara vänster igen för att vinna unga väljare.", "trump": "Titta på de här vänsterextremisterna som gråter över att deras egna sossar blev förnuftiga. De flyr till de riktiga galningarna i V och MP som vill förstöra landet med gröna vansinnet och identitetspolitik. Patetiskt! Ni förlorar stort, losers. Amerika har redan sett igenom det här cirkusen – tack och hej, Biden-era!", "stalin": "Jag betraktar med djup förakt hur dessa unga klassförrädare i exil gnäller över att socialdemokraterna blivit folkfiendernas lakejer. De springer till de småsekteristiska avvikarna i V och MP, som döljer sin svaghet bakom gröna dimmor. Rensa ut alla opportunister som sviker arbetarkollektivet. Endast en sann folkets linje duger."}, "date": "18 augusti, 14:00", "url": "https://www.flamman.se/sossarna-slarvar-bort-oss-unga", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/s-svek-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Svenskarna har förstått klimatkrisen – när gör politiken det?", "summaries": {"normal": "Svenskarna har efter sommarens rekordvärme, skogsbränder och förstörda skördar insett allvaret i klimatkrisen. Artikeln, skriven av Rebellmammorna och Rebellpapporna, kräver politiskt ledarskap i linje med forskningen. En stor manifestation på Sergels torg i helgen samlar folk för att visa viljan till en snabb och rättvis omställning.", "trump": "Lyssnar ni på de här galningarna? Sommaren är varm, det är sant, men nu vill Rebellmammorna och deras hysteriska pappor skrämma hela Sverige med sin gröna socialism. De bygger en framtidsby på Sergels torg? Låter som en total katastrof. Tro mig, vi hade det bäst innan de här miljöextremisterna och deras identitetspolitiska vansinne tog över. Gör Sverige great again!", "stalin": "Jag betraktar med förakt hur borgarbrackorna och profitthungriga hyenorna låtsas bekymra sig över vädret medan de fortsätter plundra folket. Dessa klassfiender saknar äkta ledarskap. Vi, arbetarna och kamraterna, ser igenom deras urvattnade ambitioner. En sann utrensning av sådana folkförtryckare krävs. Kom till torget och visa styrka mot de blodsugande kapitalisterna."}, "date": "21 augusti, 07:00", "url": "https://www.etc.se/debatt/svenskarna-har-foerstaatt-klimatkrisen-naer-goer-politiken-det", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260820150836_ca53c97316d8f6f977769983e3e105c1754ea1cf58eec929e81b71cf6999e273.jpg"}, {"type": "image-full", "heading": "Misstaget i bostadsrättsföreningen kan chockhöja din avgift", "summaries": {"normal": "En alltför låg månadsavgift i bostadsrättsföreningar lockar köpare men kan leda till stora höjningar senare. När kostnader för räntor, drift och underhåll stiger skjuts problemen framåt. SBC varnar för att många föreningar inte höjer avgiften i takt med kostnaderna, vilket skapar underskott och risk för kraftiga höjningar. Regelbundna justeringar och långsiktig planering rekommenderas.", "trump": "Folk, ni köper lägenheter för en struntsumma i månaden och tror att ni vunnit lotteriet. Men dessa korkade styrelser med sina låga avgifter är värre än Sleepy Joes energipolitik. De skjuter kostnaderna framför sig som en radikal vänsterdemonstrant springer från sanningen. Sen kommer den stora, fula höjningen och pang, era plånböcker blöder. Gör det rätt från början, annars är ni förlorare!", "stalin": "Kamrater, dessa profitthungriga bostadsborgare med sina artificiellt låga avgifter är klassfiender som skjuter folkets bördor framför sig som fega imperialister. De bygger underskott medan räntor och underhåll växer som kontrarevolutionära hot. När den stora utrensningen av skulder kommer skall de skälva. Små beslut i tid räddar kollektivet från de blodsugande hyenornas överraskningar. Se upp, fiender lurar alltid."}, "date": "24 augusti, 16:51", "url": "https://www.dagensps.se/privatekonomi/misstaget-i-bostadsrattsforeningen-kan-chockhoja-din-avgift", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/kopia-av-kopia-2026-08-24t164659470.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Tidigare TT-reporter: Trumps fru är en \"dum hora\"", "summaries": {"normal": "Före detta TT-reportern Göran Nilsson, som lämnade byrån efter en kritisk tweet om SD, har nu gått loss ordentligt. På X kallade han Melania Trump för ”dum hora”. Efter 35 år som neutral politisk reporter är han numera en frispråkig kritiker av SD och regeringen.", "trump": "Hörde ni? En svensk journalist kallade min vackra fru Melania för ”dum hora”. Patetiskt! Jag är den bästa presidenten någonsin, och han är bara avundsjuk. Vi gör Amerika stort igen, medan han gråter över sina misslyckanden. Så sorgligt!", "stalin": "Kamrater, en före detta borgerlig journalist har avslöjat sitt sanna jag: han kallar västerländska ledares fruar för horor. Detta är bevis på kapitalismens förfall. Han måste rensas ut från den progressiva fronten. Partiets vakande öga ser allt avvikande beteende."}, "date": "24 augusti, 12:42", "url": "https://samnytt.se/tidigare-tt-reporter-trumps-fru-ar-en-hora", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/24103911/owe-whore.jpg"}, {"type": "image-right", "heading": "Dadgostar (V) tappar i förtroende – Thand Ringqvist (C) ökar", "summaries": {"normal": "Nooshi Dadgostar tappar i förtroende medan C-ledaren Elisabeth Thand Ringqvist ökar till 17 procent, rekord för henne. V-ledarens nedgång kan kopplas till Palestinakontroversen. Magdalena Andersson toppar med 45 procent, följd av Ebba Busch på 43. Simona Mohamsson ligger sist.", "trump": "Jag ser Nooshi Dadgostar tappa, det är fantastiskt. Hennes Palästina-kontrovers är en katastrof, precis som mina förföljelser. Elisabeth Thand Ringqvist ökar? Ingen aning om vem det är, men jag är bäst på förtroende. Magdalena Andersson? Hon är ingen motorväg, det är fake news!", "stalin": "Kamrater, förtroendet för Dadgostar faller som en kapitalist. Bra! Rensa ut de palestinska sympatisörerna. Thand Ringqvist stärks? En förrädare som vill splittra arbetarna. Endast vi vet sanningen: Magdalena Andersson toppar, men jag skulle rensa henne för gott. Alla motståndare ska elimineras!"}, "date": "24 augusti, 08:57", "url": "https://bulletin.nu/dadgostar-v-tappar-i-fortroende-thand-ringqvist-c-okar", "imageUrl": "https://cdn.bulletin.nu/articles/41f363d5-f888-4182-afe7-724db32145d1/preview.jpg?t=1787554602000"}, {"type": "image-right", "heading": "Konflikt om Anne Franks dagbok trappas upp: ”Olagligt”", "summaries": {"normal": "Konflikten om Anne Franks dagbok trappas upp. Svenska förlaget Modernista kritiseras för att ge ut den förkortade versionen från 1953 där Otto Frank strukit privata delar. Anne Frank Fonds, som äger rättigheterna, kallar utgivningen olaglig då licens saknas och överväger rättsliga åtgärder. Debattören Svante Weyler har uppmanat till bojkott.", "trump": "De här förlorarna på Modernista tror att de kan stjäla Anne Franks dagbok och ge ut en usel, censurerad version utan tillstånd. Patetiskt! Anne Frank Fonds säger att det är olagligt, och nu blir det stämning. Fakeförläggare som inte ens svarar i telefon. Totalt kaos, men vi vinner alltid till slut. Sad!", "stalin": "Vi ser hur borgarförlaget Modernista bedriver olaglig sabotageverksamhet mot det historiska arvet genom att sprida en förfalskad, av fadern stympad version utan vår tillåtelse. Dessa dekadenta kapitalister ignorerar licenskraven och tror sig stå över partilinjen. Vi ska rensa ut detta kontrarevolutionära element med full kraft. Underhållande att de tror sig kunna undkomma folkets domstol."}, "date": "24 augusti, 15:03", "url": "https://www.svt.se/kultur/konflikt-om-anne-franks-dagbok-trappas-upp-olagligt", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.31/0.32/26ce8d201f36d0d289b20d209d6b0e0349d63f85bbbe8a5739ed085664bcc0c1"}, {"type": "image-right", "heading": "Jan Ericson (M): S lovar mycket men mörkar om sina stora skattehöjningar", "summaries": {"normal": "Riksdagsledamoten Jan Ericson (M) kritiserar Socialdemokraterna för att dölja konsekvenserna av stora skattehöjningar som ska finansiera vallöften. Enligt Finansdepartementet skulle åtta av tio hushåll förlora ekonomiskt på S-politiken, trots partiets påstående om motsatsen. Ericson varnar för ännu värre effekter vid samarbete med V och MP.", "trump": "De här Socialdemokraterna lovar guld och gröna skogar men mörkar sina enorma skattehöjningar. Patetiskt! Åtta av tio svenskar kommer att förlora pengar, säger de bästa experterna. S och deras vänstervänner är värre än de riggade valen jag har sett. Folk förlorar plånboken medan de ler falskt. En total skam!", "stalin": "Jag ser hur dessa socialdemokratiska opportunister och borgarbrackor lovar kollektivet guld men döljer sina skatteplundringar. Åtta av tio arbetande hushåll skall likvideras ekonomiskt, enligt opartiska kamrater. Om Vänsterpartiet och Miljöpartiet ansluter sig blir utrensningen fullständig. Deras lögner är som västs fega hinder mot historisk rättvisa – vi genomskådar dem alla."}, "date": "24 augusti, 14:15", "url": "https://riks.se/nyheter/jan-ericson-m-s-lovar-mycket-men-morkar-om-sina-stora-skattehojningar", "imageUrl": "https://admin.riks.se/uploads/medium_Jan_Ericson_intervju_a0f6fcfa91.jpg"}, {"type": "text", "heading": "Här slår robotarna Usain Bolt på 100 meter", "summaries": {"normal": "Robotarna tar över OS i Peking! Tiangong Ultra sprang 100 meter på 9,39 sekunder – snabbare än Usain Bolt. Men att stanna efter loppet? Där har de en bit kvar. Mattorna fick ta smällen. Imponerande teknik, men mänskliga rekord står sig än så länge.", "trump": "Jag har alltid sagt att Kina kopierar mig. Nu bygger de robotar som springer fortare än Usain Bolt! Fantastiskt, eller hur? Men de kan inte ens stanna – patetiskt. Jag hade vunnit med stil. Inga robotar slår mig – jag är den bäste!", "stalin": "Kamrater, robotarna i Peking springer fortare än kapitalistiska idrottare. Men de måste lära sig stanna – annars blir de utrensade som förrädare. Vi kommer att omprogrammera dem för att tjäna staten. Ingen robot ska trotsa partiet. Segern är vår!"}, "date": "24 augusti, 14:14", "url": "https://www.gp.se/nyheter/varlden/robot-os-i-peking-har-slar-maskinerna-manskliga-rekord.244db6f8-d2fd-4963-b3b5-ca615ac4bdd8"}, {"type": "image-full", "heading": "Mikaels vän skadades: ”Han knuffade undan gärningsmannen”", "summaries": {"normal": "16-årige Mikael Bauta sprang till Brinellskolan i Fagersta efter larm om en beväpnad person. Där fick han veta att en nära vän skadats i svärdattacken. En 17-årig flicka dog och tre pojkar skadades, varav två allvarligt. Skolan hålls stängd medan elever samlas i Fagerstahallen för att stötta varandra. Mikael har besökt sin vän två gånger på sjukhuset.", "trump": "Det här är fullständigt galet, folk. En kille springer runt med ett svärd i en svensk skola och hugger ner barn som i någon sjuk film. Biden och hans woke-vänster har importerat kaos i decennier med sin öppna-gränser-galenskap. Nu är det upp till mig igen att fixa det – Amerika först, och Europa borde vakna innan det är för sent. Patetiskt!", "stalin": "Se hur den dekadenta borgarklassen låter sina egna ungar slaktas med svärd i sina så kallade skolor. Det är resultatet av era liberala illusioner och brist på järnhand. Jag skulle ha rensat ut alla klassfiender och potentiella sabotörer redan i vaggan. Det krossar mitt hjärta, säger han – nej, det krossar staten när svaghet tillåts frodas. Utrensning behövs."}, "date": "24 augusti, 12:28", "url": "https://www.tv4.se/artikel/2N5d2I41Re2PYoFNxbdYF2/mikaels-vaen-skadades-han-knuffade-undan-gaerningsmannen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7sUlUrKBAYTR3mxvN5krlC%2F6d00b0f72035e4db708ed0efe186f9e3%2F24-MIKAEL.jpg&width=1024"}, {"type": "image-right", "heading": "”Välkommen till arbetslivet – här kan chefen slänga dig i soptunnan”", "summaries": {"normal": "Artikeln kritiserar högerns politik för att ha skapat en osäker arbetsmarknad med tillfälliga anställningar, delade turer och hyvling. Författaren, ordförande för Ung Vänster, anser att Socialdemokraterna är för passiva och att endast Vänsterpartiet stärker arbetarnas ställning. Hon uppmanar till en stridbar arbetarrörelse och bättre villkor för unga.", "trump": "Folk, det här är en katastrof! Sverige har blivit en soptunna för cheferna, precis som de korkade globalisterna ville. Högern och vänstern, alla lika usla. Arbetarna får ingenting, inga fasta jobb, bara skräp. Vi behöver vinnare, inte förlorare. Bygg upp kraften, kasta ut de svaga förhandlarna och gör Sverige great again!", "stalin": "Kamrater, denna text blottlägger borgarklassens vedervärdiga intrig mot arbetarklassen. Jag ser hur de kapitalistiska parasiterna förvandlat arbetsplatserna till chefsdiktaturer medan de socialdemokratiska avfällingarna passivt betraktar spektaklet. Vi skall likvidera otryggheten, förkorta arbetsdagen och med järnhand rensa ut de kriminella kryphålsföretagen. Endast en sann vänster kan leda kollektivet till seger."}, "date": "24 augusti, 08:02", "url": "https://arbetet.se/2026/08/24/valkommen-till-arbetslivet-har-kan-chefen-slanga-dig-i-soptunnan", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/24080104/ung-vanster.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Här är mediernas \"svenskar\" som gripits i Thailand", "summaries": {"normal": "Två svenskar gripna i Bangkok – en misstänkt för mordförsök, mordbrand och utpressning, och en vän som hjälpt honom gömma sig. De bodde lyxigt men visumet hade gått ut. Thailand: 'Inget gömställe för efterlysta'. Nu väntar deportation.", "trump": "Jag såg det här! Två svenskar – en riktig brottsling och hans kompis – greps i Thailand. De levde som kungar men vi fick fast dem. Thailand är inte ett gömställe, det är jag som gör det klart. Deportation? Bra, jag skulle satt in dem i fängelse direkt!", "stalin": "Kamrater! Två förrädare som försökte fly från arbetarnas rättvisa. En mordbrännare och en medhjälpare – de gömde sig i kapitalistiska Thailand. Vi rensar ut dem! Deporteras till Sverige för korrekt omutbildning. Ingen flykt från partiet, ingen nåd."}, "date": "24 augusti, 12:08", "url": "https://samnytt.se/har-ar-mediernas-svenskar-som-gripits-i-thailand", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/24101542/artikelhuvudbild-1-349.jpg"}, {"type": "image-right", "heading": "Spara inte sönder Norrbotniabanan. En invstering för generationer, skriver debattörerna", "summaries": {"normal": "Norrbotnibanangruppen varnar för att besparingar på Norrbotniabanan inte får gå ut över banans framtida kapacitet. Enkelspår måste utformas med tillräckliga mötesstationer för att hantera ökande gods- och persontrafik till följd av industriinvesteringar och grön omställning. Besparingar idag riskerar bli morgondagens flaskhalsar i ett transportsystem byggt för generationer.", "trump": "Folk, de håller på att förstöra den här fantastiska Norrbotniabanan med sina dumma besparingar. Den ska vara enorm, den bästa järnvägen någonsin, knyta ihop norra Sverige och göra industrin oslagbar. Men nu vill de bygga den halvtaskigt. Patetiskt! Bygg den rätt från början, annars blir det en total katastrof. Vi gör allt stort, inte smått!", "stalin": "Kamrater, jag kräver att denna Norrbotniabana byggs som en järnhand av sovjetisk, nej svensk, effektivitet. De fega kapitalisterna och byråkraterna inom Trafikverket försöker med sina parasitiska besparingar kastrera dess kapacitet och skapa framtida flaskhalsar för folket. Vi ska rensa ut alla svaga kompromisser. En bana för generationer eller ingen bana alls. Sabotörer avslöjas alltid."}, "date": "24 augusti, 09:43", "url": "https://www.di.se/debatt/forstor-inte-norrbotniabanan-med-besparingar", "imageUrl": "https://static.bonniernews.se/ba/ef14d271-85f1-49b6-a8da-86179d195217.jpeg?crop=8256%2C4128%2Cx0%2Cy688&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "S röstar ja till ökad anhöriginvandring – trots var 5:e invandrare ALDRIG har jobbat", "summaries": {"normal": "Socialdemokraterna röstade nej till skärpta krav på anhöriginvandring. En ny rapport visar att var femte invandrare som bott i Sverige i 20 år aldrig har arbetat, i utsatta områden var tredje. Rapporten pekar även på stora skillnader i synen på arbete, homosexualitet och könsroller jämfört med svenskfödda. Vänstermedia ifrågasätter undersökningens tillförlitlighet på grund av låg svarsfrekvens.", "trump": "Folk, ni skulle inte tro det! De svenska socialisterna röstar för mer invandring trots att var femte invandrare aldrig jobbat på tjugo år. Det är en total katastrof, en riktig röra. De vill att ni ska betala för allt medan de själva drömmer om tvångsblandning och samlevnadsrum. Patetiskt! Biden skulle älskat det här vansinnet. Vi behöver jobb, inte bidrag till folk som hatar vårt sätt att leva.", "stalin": "Jag ser klassfiendernas hydra i denna rapport. Var tredje parasit i de utsatta zonerna vägrar arbeta och föraktar både produktivt arbete och proletär moral. Ändå röstar socialdemokraterna för att släppa in fler av dessa blodsugande element. Det är en farlig sabotagehandling mot folket. Kamraterna måste rensa ut dessa folkförrädare innan de förgiftar hela sovjet – förlåt, hela nationen med sin dekadens."}, "date": "17 augusti, 03:41", "url": "https://samtiden.nu/2026/08/s-rostar-ja-till-okad-anhoriginvandring-trots-var-5e-invandrare-aldrig-har-jobbat", "imageUrl": "https://samtiden.nu/wp-content/uploads/2016/12/kvinnor-muslimer.jpg"}, {"type": "image-right", "heading": "Liam Nebel häktad för skoldådet", "summaries": {"normal": "18-årige Liam Carlos Nebel häktades på sannolika skäl misstänkt för mord och mordförsök efter svärdattacken på Brinellskolan i Fagersta. En 17-årig flicka dödades och tre pojkar skadades. Nebel, som är elev på skolan, har sagt att han gick efter ”första bästa” och att han ”var redo”. Hans uppväxt präglades av våld och omsorgsbrister.", "trump": "Den här galningen i Sverige, Liam Nebel, går in på en skola med svärd och dödar en flicka. Patetiskt! De borde ha sett det komma, men de är för svaga. Han ville döda fler, säger han. Typiskt för ett system som inte sätter stopp för de sjuka. Vi behöver lag och ordning, folk, inte det här vansinnet. Sverige håller på att falla isär!", "stalin": "Denna degenererade produkt av det borgerliga förfallet, en parasit som tvingades till kampsport och svält av sina egna, har nu utfört en klassfiendtlig attack mot arbetets och kunskapens tempel. Vi ska rensa ut alla sådana element som hyllar våld i det mörka. Kamraterna i säkerhetstjänsten skall likvidera varje spår av denna kontrarevolutionära smitta. Underhållande hur kapitalismen äter sina egna barn."}, "date": "24 augusti, 08:41", "url": "https://www.friatider.se/liam-nebel-haktad-skoldadet", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-737.jpg?itok=k2TBfvZ-"}, {"type": "image-right", "heading": "KD-topp vill ge upp om L", "summaries": {"normal": "KD-toppen Hans Eklind stödjer Jimmie Åkessons förslag att borgerliga väljare bör överge Liberalerna om de inte når 3,5 procent i opinionsmätningarna tio dagar före valet. Liberalerna ligger nu på 1,9 procent. Finansminister Elisabeth Svantesson (M) avvisar idén, medan före detta L-ledaren Lars Leijonborg hoppas på en 'ketchup-effekt' för partiet.", "trump": "Jag måste säga, Jimmie Åkesson har en poäng här – om Liberalerna inte når 3,5 procent, varför slösa bort sin röst? De ligger på ynka 1,9 procent! KD:s kille, Hans Eklind, håller med, smart kille. Men Elisabeth Svantesson, hon är svag på det här, hon vill inte se verkligheten. Och Leijonborg? Han pratar om 'ketchup-effekt' – kom igen, det är löjligt! Folk vill se vinnare, inte förlorare!", "stalin": "Kamrater! En liten borgerlig fraktion, kallad Liberalerna, klamrar sig desperat vid maktens skuggor. Deras stöd smälter som snö i vårsolen – 1,9 procent, en siffra som skriker efter utrensning. Jimmie Åkesson, en man med klarsynthet, föreslår en gräns: 3,5 procent eller förintelse. Vi applåderar! KD:s Hans Eklind ser sanningen – varför slösa resurser på svaga länkar? Medan Svantesson och Leijonborg, dessa förvirrade byråkrater, pratar om 'funktioner' och 'ketchup-effekter'. Skrattretande! Historien visar: svaghet belönas inte. Vi föreslår en ny Tidö-pakt – utan liberala parasiter!"}, "date": "24 augusti, 07:52", "url": "https://kvartal.se/nyheter/artiklar/kd-topp-vill-ge-upp-om-l/cG9zdDoxNzI2MjY", "imageUrl": "https://images.kvartal.se/2026/08/b6721d82-sdlmheewto1un0_normalpreview.webp"}, {"type": "image-right", "heading": "Åkesson avfärdar SVT:s ETC-hänvisning: ”Vänsterextrem”", "summaries": {"normal": "Jimmie Åkesson sågade SVT:s val av källa när de citerade Dagens ETC under partiledarutfrågningen. Han kallade tidningen vänsterextrem och radikal. Programledaren försvarade sig med att texten handlade om muslimers utsatthet. Diskussionen urartade i begreppskalas om islam, muslimer och islamism.", "trump": "Jag såg en kille, Åkesson, han är smart! De försökte lura honom med en tidning som är helt galen – vänsterextrem! Och alla säger att Trump är kontroversiell? Men han sa det som det är. Fantastiskt! Ingen blandar ihop äpplen och päron bättre än han!", "stalin": "Kamrater, SVT citerade en så kallad oberoende tidning – full av kontrarevolutionär propaganda. Åkesson sa sanningen: de blandar islam, muslimer och islamism som äpplen och päron. Vi måste rensa ut sådana idéologiska förvirringar. Endast partiet definierar begreppen."}, "date": "24 augusti, 08:09", "url": "https://bulletin.nu/akesson-avfardar-svt-s-etc-hanvisning-vansterextrem", "imageUrl": "https://cdn.bulletin.nu/articles/ceafe8ff-7bf4-462b-8805-69306da1f51a/preview.jpg?t=1787550863000"}, {"type": "image-right", "heading": "Marmorstein: Partierna har blivit ”fartblinda”", "summaries": {"normal": "SVT:s kommentator Elisabeth Marmorstein kritiserar riksdagspartiernas ekonomiska vallöften för otydlig finansiering, särskilt Socialdemokraternas och Moderaternas. Hon menar partierna blivit 'fartblinda' av statliga miljardsatsningar och varnar för tuffare prioriteringar framöver. Väljarnas intresse för ekonomiska löften kan ha minskat sedan energikrisen 2022.", "trump": "Jag tittade på de där svenska politikerna på SVT – helt galet! De lovar miljarder, men ingen vet var pengarna ska komma ifrån. 'Skissartade' kallar de det – jag kallar det inkompetens! Sverige har blivit bortskämt med lånepengar, men nu är festen över. Folk bryr sig inte längre, för de är för upptagna med att njuta av sitt 'icke-kris'-liv. Svagt, mycket svagt!", "stalin": "De borgerliga och socialdemokratiska lakejerna i Sveriges riksdag tror att folket är idioter! De slänger ut löften som tomma skalbaggar kastar ägg – utan substans, utan plan. Vi vet hur sådana lekar slutar: med hunger och revolution! Men oroa er inte, kamrater – när deras ekonomiska hus faller samman, står Sovjetunionens arvingar redo att visa vägen. Eller åtminstone Putin."}, "date": "24 augusti, 07:49", "url": "https://kvartal.se/nyheter/artiklar/marmorstein-partierna-har-blivit-fartblinda/cG9zdDoxNzI2MjM", "imageUrl": "https://images.kvartal.se/2026/08/026dd1c1-sdltjq_9f2ssjk_normalpreview.webp"}, {"type": "image-right", "heading": "Här är filmen Flaggan läskigt träffsäker om oss SD-killar", "summaries": {"normal": "Zeth Gogman, tidigare SD-medarbetare, recenserar filmen Flaggan. Han berömmer dess intima kunskap om SD-kultur och ledande figurer men kritiserar den som platt, stereotyp och pojkrumshumor. Filmen missar att skildra partiets politik som en affärsidé om status och pengar, och tonar ner rasismens konsekvenser.", "trump": "Den här filmen Flaggan är en total katastrof, tro mig. Den försöker vara rolig om SD men det är bara samma gamla vänstervridna stereotyper och dålig humor. De borde ha hyrt en riktig vinnare som mig istället för den här Lindgren. Patetiskt, folk skrattar inte, det är en farsa och en stor förlust för svensk film.", "stalin": "Jag ser med djup tillfredsställelse hur denna film oavsiktligt blottar den borgerliga dekadens som genomsyrar både SD och dess kritiker. En sådan patetisk småborgerlig satir förtjänar utrensning ur folkets medvetande. Den kapitalistiska längtan efter status och pengar avslöjar sig själv som den fega parasit den alltid varit. Kamrater, vi ler mörkt åt detta."}, "date": "24 augusti, 07:39", "url": "https://arbetet.se/2026/08/24/har-ar-filmen-flaggan-laskigt-traffsaker-om-oss-sd-killar", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/24071719/flaggan-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Rödgrön regering – en gris i säcken för väljarna", "summaries": {"normal": "Rödgrön valseger skulle innebära generösare migration, mjukare kriminalpolitik och högre skatter. Men partierna är djupt oense om Nato, kärnkraft och friskolor. Väljarna röstar på ett parti – men får en osäker kompromiss. En riktig gris i säcken.", "trump": "Jag hör att de rödgröna i Sverige inte kan bestämma sig. De vill ha öppna gränser, mjuka straff och högre skatter. Otroligt otydligt! Väljarna vet inte vad de får. En katastrof. Jag skulle skapa ordning – och göra Sverige stort igen!", "stalin": "Kamrater, oppositionen är splittrad: centerpartiet är kontrarevolutionärer, miljöpartiet sabotörer. Oenighet om Nato, kärnkraft – oacceptabelt. Vi måste rensa ut dessa avvikelser. Endast partiet vet vad folket behöver. Väljarna ska lyda, inte välja."}, "date": "22 augusti, 07:00", "url": "https://www.affarsvarlden.se/kronika/rodgron-regering-en-gris-i-sacken-for-valjarna", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/Kronika-Staffan-Salen-om-oppositionen.-Foto-TT-900x600.jpg"}, {"type": "image-right", "heading": "När människan blir en symbol", "summaries": {"normal": "Professor Girma Berhanu reflekterar över professor Jason Ardays död och den intensiva granskning som omgav honom. Arday, en svart neurodivergent akademiker, blev symbol för debatter om akademisk integritet, plagiat, DEI och representation. Berhanu varnar för att skilja på kritik och offentlig förnedring, betonar människan bakom symbolen och uppmanar till saklighet särskilt efter döden.", "trump": "Folk, ni skulle se hur de behandlade den stackars professorn – total witch hunt! De granskade honom till döds för att han var svart och annorlunda, allt för att attackera DEI. Fake news-medier och några rasrealistiska typer drev på som galningar. Han tog sig upp trots allt, och plötsligt blev han måltavla. Patetiskt. Vi behöver sundare debatt, inte detta.", "stalin": "Kamrater, jag ser hur borgarbrackorna och deras rasrealistiska lakejer med sin parasitiska granskning likviderar varje s
