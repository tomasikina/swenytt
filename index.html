:01", "url": "https://www.tv4.se/artikel/VJ3brAF1gaFbgc59XNGEo/kritiken-aklagaren-driver-sin-egen-beraettelse-av-haendelsefoerloppet", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FAWggnzTeAM0HjXlaSwCRV%2Fa41c49011c84c13223eb4ad001479689%2F03-taavi.jpg&width=1024"}, {"type": "image-right", "heading": "Allard: ”Jag ska spränga åsiktskorridoren”", "summaries": {"normal": "Örebropartiets Markus Allard hotar att fälla en regering som inte stänger Sveriges gränser. Om partiet når riksdagen via tolvprocentsspärren i Örebro län, planerar han att använda sitt mandat som vågmästare för att spränga åsiktskorridoren. Hans politik inkluderar att frysa medborgarskapsprocesser och genomdriva återvandring av kriminella invandrare. Allard är villig att samarbeta med alla partier, men kräver gränsstängning och återvandring som villkor för sitt stöd.", "trump": "Jag har sett många politiker, men den här Allardtypen är något annat. Han pratar om att spränga åsiktskorridorer – det låter som något jag skulle säga! Sverige behöver verkligen stänga sina gränser, det är såklart. Vi gjorde det i USA och det fungerade perfekt. Den här mannen förstår att man inte kan vara rädd för att trampa på tårna – precis som jag. Om han kommer in i riksdagen, kommer Sverige att bli stort igen, det lovar jag er.", "stalin": "Partiledaren Allard visar insikt i statens överlevnad. Hans krav om gränsstängning och frysning av medborgarskapsprocesser är nödvändig mot subversive krafter. Som revolutionär förstår han att förändring kräver konflikt och att bryta mönster. Vi kan inte tillåta asociala elementer. Hans villiga att samarbeta med alla partier, inklusive de som vill stänga gränserna, tjänar statens intressen. Vi måste stödja detta initiativ, för det stärker vår kamp mot imperialism."}, "date": "3 augusti, 15:55", "url": "https://bulletin.nu/allard-jag-ska-spranga-asiktskorridoren", "imageUrl": "https://cdn.bulletin.nu/articles/b702b076-ad69-4d72-945f-a0b51157eb1f/preview.jpg?t=1785761564000"}, {"type": "image-full", "heading": "Kullgren vill ge jägare friskvårdsbidrag", "summaries": {"normal": "Landsbygdsminister Peter Kullgren (KD) föreslår att jakt och jaktskytte ska ingå i friskvårdsbidraget, då aktiviteten kombinerar motion och mental återhämtning. Förslaget kritiseras av Djurens Rätt, som menar att jakt inte kan jämföras med andra motionsformer på grund av dess etiska problematik. Friskvårdsbidraget är idag begränsat till 5 000 kronor per år och täcker inte utrustning eller medlemsavgifter.", "trump": "Jag måste säga, detta är fantastiskt! En smart minister i Sverige vill ge jägare friskvårdsbidrag – och varför inte? Jakt är motion, frisk luft, allt bra! Men så kommer dessa vänsteraktivister från Djurens Rätt och gnäller om 'etiska problem'. Hör ni, folk vill jaga, det är tradition, det är starkt! Skattepengar? Ja, varför inte? Vi subventionerar allt annat, så varför inte detta? Sverige borde ta efter USA – vi vet hur man gör saker rätt!", "stalin": "Kamrater, ännu en kapitalistisk avart avslöjas! Denna så kallade 'landsbygdsminister' vill belöna bourgeoisiens blodtörstiga hobby med statliga medel. Jakt? Motion? Nej, detta är en konspiration av köttätande kontrarevolutionärer! Djurens Rätt har rätt – vi kan inte tillåta att proletariatets pengar finansierar barbari. Låt dessa jägare vandra i skogarna, men utan statligt stöd! Och om de klagar – Gulagskogen står redo. Putin skulle skratta åt denna västerländska dekadens."}, "date": "3 augusti, 16:37", "url": "https://kvartal.se/nyheter/artiklar/kullgren-vill-ge-jagare-friskvardsbidrag/cG9zdDoxNTcyMTc", "imageUrl": "https://images.kvartal.se/2026/08/0faed11c-jakt.webp"}, {"type": "image-full", "heading": "Expert: Svårt att avgöra ansvaret", "summaries": {"normal": "Enligt en expert på Chalmers Sjöfartshögskola är det svårt att avgöra ansvaret för den tragiska båtolyckan vid Tjörn där en kvinna och ett barn omkom. Handelsfartyget Misje Verdes körde på en fritidsbåt bakifrån. Sjöreglerna skiljer sig från trafikregler på land och skuld kan fördelas i procent mellan parterna. Åklagaren har häktat befälhavaren och lyfter fram flera sjövägsregler om utkik och väjningsplikt.", "trump": "Folk, det här är en total katastrof vid Tjörn! De har de mest snåriga, korkade sjöregler jag någonsin sett, värre än Bidens byråkrati. Ett stort handelsfartyg kör på en liten båt bakifrån och nu ska de sitta och räkna procent på skulden som svaga liberaler. Väjningsplikt? Det är sunt förnuft! Men nej, de gör det komplicerat så ingen vet vem som bär ansvaret. Patetiskt!", "stalin": "Kamrater, denna tragiska kollision vid Tjörn visar tydligt hur den sjöfartens otydliga regelverk tjänar de kapitalistiska intressena. Jag, som ledare för det kollektiva tänkandet, ser hur borgarbrackorna gömmer sig bakom procentuella skuldfördelningar istället för att peka ut den verkliga fienden. Den upphinnande kapitalistångaren krossade de svaga – typiskt för klassfiendens likgiltighet. Vi ska rensa ut alla sådana oklara regler som skyddar exploaterande fartyg."}, "date": "3 augusti, 19:57", "url": "https://www.tv4.se/artikel/tt-260803-tjornolyckaexpert1-48956de8/expert-om-tjornolyckan-svart-att-avgora-ansvaret", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5HWP1Q4oybScKnJYlKr6VD%2F8fa0804169375e73bfeb0eb5290e8ef6%2F03-tjorn.jpg&width=1024"}, {"type": "image-full", "heading": "Ny lag från augusti – kommunen kan få miljonavgift", "summaries": {"normal": "Från 1 augusti 2026 skärps reglerna för kommunal och offentlig säljverksamhet som konkurrerar med privata företag. Kommunala gym, konferenslokaler och liknande kan granskas av Konkurrensverket om de använder skattepengar för att hålla oschysst låga priser. Verksamheten kan tvingas ändras eller läggas ned, och i allvarliga fall kan en marknadsstörningsavgift på upp till 20 miljoner kronor utdömas. Företag kan tipsa Konkurrensverket anonymt.", "trump": "Folk, ni vet hur det är. De där kommunala gymmen med sina skattefinansierade låga priser krossar de små privata företagen. Det är en skandal! Nu har vi äntligen en lag från augusti 2026 som stoppar detta. Konkurrensverket kan stänga dem och ta ut upp till 20 miljoner i böter. Fantastiskt! De offentliga rövarna får inte längre stjäla marknaden från riktiga företagare. Make business great again!", "stalin": "Kamrater, jag ser med djup tillfredsställelse hur vi nu äntligen rensar ut de parasitiska borgarbrackorna som gömmer sig bakom sina så kallade privata gym och konferenslokaler. Dessa kapitalistiska sabotageörer som gnäller över att vi använder folkets medel för att hålla priserna nere skall likvideras från marknaden. Konkurrensverket, vårt trogna instrument, skall med järnhand utdöma upp till tjugo miljoner i straffavgift åt varje klassfiende som vågar utmana statens kollektiva överlägsenhet. Den som tipsar oss anonymt är en vän till folket – de övriga riskerar utrensning."}, "date": "3 augusti, 21:27", "url": "https://nyheter24.se/nyheter/ekonomi/naringsliv/1502538-ny-lag-fran-augusti-kommunen-kan-fa-miljonavgift", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/634305fa04b004a30200000000b004a302/2026/08/03/2381952/konkurrens.jpg"}, {"type": "image-right", "heading": "”Startskottet för valrörelsen har gått – M och S har helt olika utgånglägen”", "summaries": {"normal": "Valrörelsen har inletts på allvar när de två statsministerkandidaterna Magdalena Andersson och Ulf Kristersson gav sig ut på valturné. Opinionsmätningarna visar ett tydligt övertag för oppositionen med upp till 12 procentenheter. Andersson satsar på sitt höga förtroende och undviker att nämna samarbeten med V och MP. Kristersson behöver en gamechanger för att vända opinionen, medan Tidöpartierna hoppas på osäkra väljare och positiva tillväxtsiffror under de 41 dagar som återstår till valet den 13 september.", "trump": "Valrörelsen har börjat och det ser verkligen bedrövligt ut för den svaga regeringen. Ulf Kristersson behöver en riktig gamechanger, en enorm vinnare som bara jag kan leverera. Andersson surfar på ett jättestort övertag men hon är svag, extremt svag. Hon vill inte prata om sina vänstervänner för att inte skrämma bort mittenväljarna. Tidöpartierna har inte levererat, de borde ha gjort det mycket bättre. De osäkra väljarna, upp till 20 procent, kommer att avgöra allt och de hatar den misslyckade ekonomiska politiken med sänkta skatter bara för de rika. Det blir en stor seger för rätt sida om de lyssnar på mig.", "stalin": "Kamrater, valrörelsen inleds och de dekadenta borgarbrackorna i Tidöpartierna skakar av feghet inför det oundvikliga nederlaget. Jag, som ledare för det proletära kollektivet, ser hur oppositionens 12-procentiga övertag kommer att krossa dessa kapitalistiska parasiters lögner om tillväxt. Ulf Kristersson, den ynkliga revisionisten, behöver en så kallad gamechanger för att undvika utrensning från sin egen falang. Magdalena Andersson surfar på arbetarnas förtroende men vägrar erkänna sina sanna allierade bland de röda kamraterna. Vi ska rensa ut alla osäkra element, dessa 15–20 procent svajande förrädare, och likvidera deras drömmar om slapp migration och mjuk kriminalpolitik. Deras ekonomiska politik är enbart en borgarklassens konspiration mot det sovjetiska folkets välstånd. Inga kompromisser! Segern tillhör oss, eller också blir det en mycket mörk humoristisk utrensning för de som sviker."}, "date": "3 augusti, 20:51", "url": "https://www.svt.se/nyheter/inrikes/startskottet-har-gatt-nu-borjar-valrorelsen-pa-allvar", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.77/0.44/8d73c4caf171366591f9cae7afba5ca30cc37813428ffc5e2ab7e9d9784159b0"}, {"type": "image-full", "heading": "Här slår drönare ner på turiststrand – sju döda", "summaries": {"normal": "Sju personer, varav tre barn, har dödats och över 40 skadats efter att en drönare slagit ner på en turiststrand i Gelendzhik vid Svarta havet i Ryssland. Guvernör Venyamin Kondratyev pekar ut Ukraina som ansvarig. På Krim har ytterligare fyra personer dödats i en separat ukrainsk drönarattack. Ukraina har inte kommenterat uppgifterna. Samtidigt rapporteras ryska attacker mot Kryvyj Rih och Odessa i Ukraina med flera döda och skadade.", "trump": "Vilken katastrof, folk! Den här galna drönarattacken på en fullpackad rysk strand dödade sju, inklusive tre stackars barn, och skadade över fyrtio. Ukraina slår till mot turisterna vid Svarta havet och på Krim – totalt kaos under den svaga Biden-eran. Nu är jag tillbaka som president och ska fixa det här. Ingen mer tid för Zelenskyjs eviga tiggeri och de där woke-krigarna som bara skapar problem. Vi behöver styrka, inte identitetspolitik!", "stalin": "Kamrater, denna fega drönarattack mot oskyldiga vid Svarta havet avslöjar de ukrainska fascistiska hindren för vår ryska intressesfär. Sju döda, tre av dem barn, och över fyrtio sårade – en verklig kapitalistisk maffias handling. På Krim likviderades ytterligare fyra av dessa folkfiender. Jag beundrar den starke efterträdaren Putin som står emot västvärldens blodsugande imperialister. Vi ska rensa ut alla sådana överklass-slynglar som hotar kollektivets fred."}, "date": "3 augusti, 19:49", "url": "https://www.tv4.se/artikel/3qGJjV36Mac9IzRkKV0Thw/haer-slar-droenare-ner-pa-turiststrand-7-doeda", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1I8C7iBks4beh1YjjdDWfO%2Fdb4794999e8198cd8ebeaf5f72a5c6d8%2F03-explosion-strand.png&width=1024"}, {"type": "text", "heading": "Lättad oro kring Mellanöstern gav börsen fart", "summaries": {"normal": "Stockholmsbörsen steg 0,85 procent till 3 274,43 efter att president Trump meddelat att planerade attacker mot Iran ställs in och att nya förhandlingar inleds. Telecom steg mest medan hälsovård backade kraftigt. Astra Zeneca föll 9,4 procent efter uppgifter om preliminära samtal om ett möjligt samgående med Bristol Myers Squibb. Sobi backade 7,4 procent efter beskedet att vd Guido Oelkers lämnar 2027. Assa Abloy, Norion Bank och Kabe hörde till vinnarna. Nyregistreringar av husbilar ökade med nästan 52 procent i juli.", "trump": "Folk, det var en fantastisk dag på börsen i Stockholm, upp 0,85 procent, och det är tack vare mig. Jag stoppade de dumma attackerna mot Iran, sa att vi ska prata istället, och plötsligt blev alla glada och aktierna flög uppåt. Astra Zeneca rasade nio procent för att de pratar om att slås ihop med någon annan – det är vad som händer när man inte har ledarskap. Men Saab, EQT och Norion Bank älskar mig. Vinster överallt, precis som jag lovat. Fantastiskt!", "stalin": "Kamrater, den imperialistiska börsen i Stockholm steg 0,85 procent sedan den arrogante kapitalistledaren i Vita huset tvingades erkänna att hans krigsplaner mot Iran var ett fiasko och istället tvingades inleda förhandlingar. Astra Zeneca, den dekadenta borgarbrackan, föll 9,4 procent efter att ha ertappats i hemliga sammansvärjningar med amerikanska parasitbolag – typiskt för giriga monopolister. Vi ser hur dessa blodiglar försöker skapa nya jätteoctopuser för att suga ut arbetarklassen. Sobi-råttan Oelkers flyr skeppet 2027, en förrädare som alla andra. Men var lugna, kamrater. Vi ska rensa ut alla dessa parasitiska spekulanter till sist. De tror de kan gömma sig bakom höghastighetsgrindar och säkerhetsdörrar, men folkets vrede hittar dem alltid. Ha ha."}, "date": "3 augusti, 17:49", "url": "https://www.affarsvarlden.se/artikel/lattad-oro-kring-mellanostern-gav-borsen-fart"}, {"type": "image-full", "heading": "Reform UK vill sätta in militären mot migranter", "summaries": {"normal": "Reform UK föreslår en militär insats, 'Operation Fortress', för att stoppa båtmigration över Engelska kanalen. Planen innebär att flottan ska återföra migranter till Frankrike eller Belgien. Partiledaren Nigel Farage hävdar att migrationen kan stoppas inom två veckor, men kritiker menar att förslaget är orealistiskt och juridiskt problematiskt. Förslaget möter stark kritik från både militära experter och regeringen, som anser att det är en avledningsmanöver från partiets ekonomiska kontroverser.", "trump": "Vad händer i Storbritannien? Reform UK, med sin fantastiska ledare Nigel Farage, vill stoppa alla dessa båtar med migranter – och de kan göra det på bara två veckor! Jag säger alltid: bygg murar, använd militären, få jobbet gjort! Men Frankrike? De kommer aldrig samarbeta. Svaga ledare, svagt land. Och kritiken? Bara fake news från de vanliga misstänkte. Storbritannien borde ta en sida ur mitt playbook – Make Britain Great Again!", "stalin": "Kapitalistiska hyenor i Reform UK föreslår nu att sätta flottan på de fattiga och förtvivlade, som flyr från de krig och misärer som väst själva skapat. 'Operation Fortress' – ett namn lika patetiskt som deras drömmar om imperialistisk kontroll. Vi vet hur man hanterar sådana fiender: med järnhand och kollektiv vilja. Låt dem leka krig, medan vi fortsätter att utvidga socialismens räckvidd. Och Frankrike? De kommer att knäböja för våra krav, precis som alla andra. Folkets fiender ska krossas!"}, "date": "3 augusti, 16:15", "url": "https://kvartal.se/nyheter/artiklar/reform-uk-vill-satta-in-militaren-mot-migranter/cG9zdDoxNTcyMDY", "imageUrl": "https://images.kvartal.se/2026/08/e5da0f26-farage.webp"}, {"type": "image-right", "heading": "Bärplockare attackerades av björn – spelade död", "summaries": {"normal": "En bärplockare attackerades av en björn i skogen utanför Lycksele medan hon plockade hjortron. Hon blev biten i huvudet och händerna, spelade död och överlevde. Kvinnan fördes till sjukhus och opererades. Polisen utreder händelsen som en arbetsplatsolycka, beslutade att avliva björnen men hittade den inte och har nu lagt ner jakten.", "trump": "Folk, ni tror inte vad jag just läste. En stackars kvinna plockar hjortron i Sverige, och BAM – en galen björn attackerar henne. Hon spelade död, smart drag, och överlevde. De skickade jägare för att ta björnen men misslyckades totalt, typiskt. Det här är vad som händer när man inte har ledarskap. Sverige borde lära sig av oss hur man hanterar vilda djur, tro mig.", "stalin": "Kamrater, ännu en sabotör i skepnad av en björn har vågat sig på att attackera en arbetare i det stora sovjetiska bärkollektivet. Denna fientliga björn, en uppenbar lakej åt de västerländska kapitalisterna och deras imperialistiska skuggor, bet henne i huvudet och händer. Hon spelade död – en listig taktik mot klassfienden. Vi har beslutat om omedelbar utrensning av detta lurviga element, men de fega jägarna misslyckades. Inga fler halvmesyrer! Bort med alla björnar som tjänar borgarbrackorna!"}, "date": "3 augusti, 16:11", "url": "https://arbetet.se/2026/08/03/barplockare-attackerades-av-bjorn-spelade-dod", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/03160838/bjorn-i-skog.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Video: Här grips \"svenske\" gängtoppen av spansk polis", "summaries": {"normal": "Den 21-årige svenske gängtoppen Emin Muqa Kulic greps i början av augusti i ett exklusivt villaområde i Sitges utanför Barcelona. Han misstänks ha styrt unga rekryter i ett 20-tal grova våldsbrott i Sverige under 2024, med syfte att destabilisera rivaliserande kriminella grupper. Kulic, som beskrivs som högt uppsatt i Dalennätverket, greps med stöd av en europeisk utredningsorder efter att ha varit efterlyst internationellt sedan maj 2025. Svensk åklagare har begärt hans överlämning.", "trump": "Titta på det här, folk. Den här svenske gangstern, den så kallade Emin Muqa Kulic, bara 21 år gammal, har äntligen gripits i ett lyxigt område i Spanien. Han styrde ungar som sprang runt och sköt och sprängde i Sverige för att skapa kaos mellan gängen. Patetiskt! Men det visar att vi med bra samarbete kan ta dem. De är svaga, de gömmer sig i trädgårdar. Vi decimerar de här förlorarna, precis som jag alltid sagt. Fantastiskt jobb av polisen!", "stalin": "Kamrater, se hur den kontrarevolutionära parasitens, denna borgarbrackas och kapitalistlakejs, Emin Muqa Kulic, slutligen fångades i sin dekadenta villa i det spanska revisionistiska paradiset. Jag, med mitt järnhårda internationella nätverk, har länge betraktat dessa degenererade element som försöker destabilisera arbetarklassens fiender för egen vinnings skull. Vi ska likvidera sådana farliga avskum steg för steg. Deras vapen och sprängämnen tillhör folket, inte dessa ynglingar de förgiftar. Mycket återstår innan vi fullständigt rensar ut alla Dalen-reaktionärer och deras mexikanska lakejer. Härligt!"}, "date": "3 augusti, 15:50", "url": "https://www.friatider.se/video-har-grips-svenske-gangtoppen-av-spansk-polis", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-607.jpg?itok=2nT8HQ3m"}, {"type": "image-full", "heading": "SvFF säger nej till Infantino vid omval", "summaries": {"normal": "Trycket mot Fifa-ordförande Gianni Infantino ökar när Svenska Fotbollförbundet, Wales och England drar tillbaka sitt stöd. Beslutet grundas på långvarig kritik av ledarskap, öppenhet och styrning inom Fifa. Detta sker efter att Fifa backat från förslag om att sälja andelar i tävlingar till privata investerare, vilket hotade med bojkott från Uefa och andra förbund. Infantino, som har lett Fifa sedan 2016, står nu inför en växande misstroendeförklaring inför ordförandevalet 2027.", "trump": "Jag har sagt det i åratal – Fifa är en dysfunktionell organisation! Nu ser vi Sverige, Wales och England dra tillbaka sitt stöd för Infantino. Det är en stor vinst för mig, för fotboll, för världen! Infantino kan inte hantera pressen, precis som Hillary kunde det inte. Folk är trötta på korruption och dålig ledarskap. Vi kommer att få en ny framtid för fotbollen, en stor, stor framtid!", "stalin": "Vi, arbetarrörelsens front, ser med oro på den växande ouppfostran inom Fifa. Infantinos svaga styre har orsakat splittring, precis som västliga agenter försöker sätta splittring i vår ryska gemenskap. Vi måste stödja en stark ledare som förstår statens intressen – kanske en man som Putin, som alltid handlar i folkets namn. Fienden är inom, och de måste utrensas!"}, "date": "3 augusti, 15:28", "url": "https://bulletin.nu/svff-sager-nej-till-infantino-vid-omval", "imageUrl": "https://cdn.bulletin.nu/articles/cee9fae6-369c-4929-a79d-ca9c1a1af940/preview.jpg?t=1785763687000"}, {"type": "image-full", "heading": "Här river socialchefen ned SD:s valaffischer – \"städat lite\"", "summaries": {"normal": "Socialchefen i nordöstra Göteborg, Sara Lesch, rev under söndagen ned Sverigedemokraternas valaffischer i sitt bostadsområde. På sociala medier skrev hon \"Idag har vi städat lite på vår gata\" och \"Make racism wrong again\" samt lade upp bilder. Lesch sitter även i styrelsen för Feministiskt initiativ. Sverigedemokraterna polisanmäler händelsen, som de beskriver som sabotage, och uppger att de regelbundet anmäler liknande incidenter. Riks har inte lyckats nå Lesch, som är på semester.", "trump": "Kan ni tro det? Den här socialchefen i Göteborg river ner mina vänner Sverigedemokraternas affischer och kallar det städning! \"Make racism wrong again\" – vad är det för skämt? Hon borde städa upp i sin egen förvaltning istället för att sabotera demokratin. Patetiskt! De polisanmäler henne, och det borde de göra. Folk som hatar valaffischer hatar egentligen folket. Sad!", "stalin": "Kamrater, jag har sett borgarbrackornas nya trick. Denna socialbyråkrat, en typisk rest från den dekadenta västerländska feminismen, river ned arbetarnas affischer och kallar det städning. Hon tror sig stå över partiet och folket med sin \"make racism wrong again\"-floskler. Vi ser er, fiender till kollektivet – ni som maskerar er som städare men i själva verket är kontrarevolutionära plakatbärare. En sådan sabotagehandling kräver omedelbar utrensning ur statsapparaten. Skrattretande patetiskt, dessa småborgerliga parasiters försök att hindra historiens gång."}, "date": "3 augusti, 14:59", "url": "https://riks.se/nyheter/har-vandaliserar-socialchefen-sd-s-valaffischer-stadat-lite", "imageUrl": "https://admin.riks.se/uploads/socialchef_valaffischer_hero_ea5eddbfcf.jpeg"}, {"type": "image-full", "heading": "Tyska stjärnregissören klipper bort topless-scen", "summaries": {"normal": "Den tyske regissören Wim Wenders har klippt bort en kontroversiell naken scen med den då 13-åriga Nastassja Kinski ur filmen 'Falsk rörelse' från 1975. Efter års lång konflikt och offentlig kritik nåddes en överenskommelse. Wenders bad om ursäkt och godkänner Kinskis önskan om att scenen ska tas bort för att skydda hennes minne.", "trump": "Jag, Donald Trump, ser detta som ett perfekt exempel på hur vissa människor, som Wim Wenders, inte förstår vad som är rätt. Han behandlade en ung skådespelerska illa och nu måste han ta bort scenen. Jag skulle aldrig ha tillåtit något sådant. Det är en skam, men jag är glad att hon nu fått rätt.", "stalin": "Vi, som representerar statens och partiets intressen, ser detta som en seger för den revolutionära moralen. Wim Wenders, en företrädare för den dekadenta västvärlden, tvingas nu ta bort sin exploaterande scen. Detta bevisar att vi måste ständigt vakna mot de förrädiska elementen som försöker korrumpera vårt samhälle. Vi kommer att stödja alla som kämpar mot sådan perversa kulturimperialism."}, "date": "3 augusti, 13:47", "url": "https://www.gp.se/kultur/wim-wenders-andrar-sig-klipper-bort-topless-scen.80032ed1-9dbc-4d42-b2b3-d4fb8399a897", "imageUrl": "https://www.gp.se/images/article/80032ed1-9dbc-4d42-b2b3-d4fb8399a897/images/2-EZl6VwtXRNerhPuXhdxPEGcFVE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Tyskland måste ta itu med sin ägarstyrning", "summaries": {"normal": "Tyskland brottas med en djup ekonomisk kris, särskilt inom bilindustrin där Porsche, BMW, Audi och Volkswagen tvingas dra ned på grund av kinesisk konkurrens med elbilar. Artikeln lyfter fram att Tyskland har mycket att lära av Sveriges ägarstyrningsmodell, där få ägare styr effektivt via styrelser som kan byta vd vid behov. Den tyska korporativa modellen med starkt fackligt inflytande ses som tungrodd och hindrande för förändring. Krisen är allvarlig även för Sverige då Tyskland är vår viktigaste handelspartner.", "trump": "Tyskland håller på att falla sönder, det är en total katastrof. Deras bilindustri, de stora märkena som alla älskade, de håller på att bli utkonkurrerade av Kina som gör billiga elbilar medan tyskarna sover. De borde ha lyssnat på mig, men istället har de den här korkade korporativa modellen med facket överallt. Sverige har en fantastisk ägarmodell, den är vinnande, den är smart. Storebror Tyskland ser plötsligt väldigt klumpig ut. De behöver min hjälp, annars blir det ännu värre, tro mig.", "stalin": "Kamrater, denna tyska kris är en förrädisk sabotagehandling utförd av den parasitiska borgarklassen och deras kinesiska revisionistiska konkurrenter som nu infiltrerar Europa med sina elfordon. Vi ser hur den korporativa modellen, denna feta byråkratiska hydra med fackliga element, kväver den proletära produktiviteten. Jag, som ledare för det stora kollektivet, ler mörkt åt hur de tyska kapitalisterna nu får smaka på sin egen senfärdighet. Sverige har oavsiktligt bevarat en effektiv ägarstyrning som vi borde rensa ut och omforma till folkets verktyg. Ut med de gamla fabrikerna, fram med utrensning av de klumpiga beslutsstrukturerna innan de likviderar oss alla i sin paranoiafyllda nedgång."}, "date": "3 augusti, 11:49", "url": "https://www.di.se/ledare/tyskland-maste-ta-itu-med-sin-agarstyrning", "imageUrl": "https://static.bonniernews.se/ba/df8c615d-ee68-4e79-8e5f-4552dc109e77.jpeg?crop=1024%2C512%2Cx0%2Cy85&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Invandrare är människor, inte ett hot", "summaries": {"normal": "Fereshte Javani kritiserar den politiska retorik som systematiskt etiketterar invandrare som ett hot. Hon menar att detta är en medveten strategi för att sprida rädsla och vinna röster, vilket skapar splittring och hat. Hon påpekar att invandrare är läkare, lärare och andra yrkesverksamma som byggt samhället, och frågar hur länge de ska behöva bevisa sin lojalitet. Hon varnade för att hat växer genom år av misstänkliggörande.", "trump": "Jag läste den där artikeln om invandrare. Så trist. Vi måste vara tuffa. Invandrare är ett stort problem, men vi kommer att lösa det. Vi kommer att bygga en vägg, en fantastisk vägg. Vi kommer att skydda våra medborgare. Vi kommer att vinna igen, det lovar jag. Det här är politik, och vi är de bästa.", "stalin": "Vi ser att det finns krafter som försöker splittra vårt samhälle genom att skapa hat mot invandrare. Det är en fegt strategi. Vi kommer att eliminera dessa element. Vi kommer att bygga ett starkt, enat samhälle där alla arbetar för det gemensamma målet. Vi kommer att skydda vårt territorium mot alla fiender, inifrån och utifrån. Vi kommer att segra."}, "date": "3 augusti, 01:30", "url": "https://www.dagensarena.se/opinion/invandrare-ar-manniskor-inte-ett-hot", "imageUrl": "https://www.dagensarena.se/files/2026/07/debattartikel-invandrare-300x157.jpeg"}, {"type": "image-right", "heading": "Ljusning för krisande facklitteratur", "summaries": {"normal": "Försäljningen av facklitteratur ökar för första gången på flera år, visar statistik från 2025 och början av 2026. Två nya festivaler, Minervafestivalen i Stockholm och Sakligt på Österlen, bidrar till det växande intresset. Förläggare och författare tror att världsläget driver människor att söka faktabaserad kunskap. Andelen fackböcker på bokmarknaden har dock sjunkit från 35 procent 2018 till 22 procent 2025.", "trump": "Folk vaknar äntligen och köper riktiga böcker istället för den vänstervridna skönlitterära sophögen. Facklitteratur är på väg upp, det är en enorm succé, den största trendvändningen på åratal. Världsläget med alla kriser gör att folk vill ha fakta, inte woke-skräp och identitetspolitik. De här festivalerna på Österlen och i Stockholm är fantastiska, men de borde kasta ut alla kvoterade mångfaldstyper och bara fokusera på vinnare. Jag älskar det!", "stalin": "Kamrater, vi bevittnar en ideologisk väckelse där folket söker sann kunskap istället för borgarbrackornas förljugna underhållningslitteratur. Detta trendbrott är en seger för det kollektiva medvetandet mot de exploaterande kapitalisternas dimridåer. Våra två proletära festivaler utgör vitala plattformar i kampen mot folkfiendernas ytliga skrifter. Den som sprider dekadens skall rensas ut. Ljusningen är historisk och oundviklig."}, "date": "30 juli, 11:22", "url": "https://www.etc.se/kultur-noje/ljusning-foer-krisande-facklitteratur", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260730090720_4c920549ec92250d6d21883f3cc0e36db3b42cbd309b15caac6dd37d7d76f858.jpg"}, {"type": "image-right", "heading": "Satans hopkok ONA: Satanistkulten som vill verka mer mystisk än den är.", "summaries": {"normal": "Den nazistiska satanistgruppen Order of Nine Angles (ONA) påstår sig följa en urgammal lära för odödlighet, men idéhistorikern Filip Lindström avslöjar att deras 'sjufaldiga väg' bygger på modern filosofi, främst Martin Heideggers teorier om tid och existens. ONA, som inspirerat våldsbejakande grupper som NLM och 764, glorifierar våld som ett medel för att nå en 'akausal' dimension. Trots försök att framstå som mystisk och uråldrig är rörelsen ett hopkok av 1900-talsfilosofi, fascism och esoterism, med rötter i Heideggers nazistsympatier och David Myatts tolkningar.", "trump": "Vad ett totalt skämt! Den här så kallade 'ONA'-gruppen, eller vad de nu kallar sig, tror att de är några urgamla visdomsmästare – men nej, de är bara en samling kopieringsmaskiner som snott idéer från en nazistfilosof! Och ändå kallar de sig satanister? Svagt! Deras 'sjufaldiga väg' är bara en billig rip-off av Heideggers gamla prat om tid och död. Och vet ni vad? De gömmer sina källor som små barn. Men jag, Donald J. Trump, genomskådar dem direkt. Våld, nazism och en massa flum – det är allt det här är. Fake mystik, fake historia, fake allt! SAD!", "stalin": "Kamrater! Ännu en gång avslöjas bourgeoisins dekadenta fantasier som just det – fantasier. Denna så kallade 'Order of Nine Angles' är inget annat än en samling förvirrade petit-bourgeoiser som klär sina fascistiska drömmar i mystiska trasor. De stjäl från Heideggers reaktionära filosofi, glorifierar våld och påstår sig sträva efter 'odödlighet' – men vad är det annat än en patetisk flykt från klasskampens verklighet? Deras 'akausala dimension' är bara ett försök att rättfärdiga sina brott mot arbetarklassen. Vi har krossat värre fiender än dessa esoteriska klantskallar. Låt dem leka med sina 'mörka gudar' – vi har historiens järnhjul att driva framåt. Och Putin? Han skulle skratta dem rakt i ansiktet."}, "date": "30 juli, 09:37", "url": "https://expo.se/fordjupning/satans-hopkok", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/toppbild-1.jpg"}, {"type": "image-right", "heading": "Det går att få bort arbetslösheten!", "summaries": {"normal": "Artikeln argumenterar att massarbetslösheten i Sverige, som legat runt 7,5 procent i genomsnitt sedan EU-inträdet, är skapad och gynnar kapitalister genom lägre löner och svagare fackföreningar. Författaren pekar på att arbetslösheten var betydligt lägre före EU-medlemskapet och föreslår lösningar som arbetstidsförkortning till sex timmar, höjd a-kassa, oförändrad pensionsålder och ett svenskt EU-utträde för att möjliggöra verkliga reformer.", "trump": "Folk, det här är ett totalt haveri! De där EU-byråkraterna och de svenska socialistiska förlorarna har skapat en enorm arbetslöshet som bara gynnar de rika grabbarna på toppen. Rena skandalen! Jag fixade rekordlåg arbetslöshet i USA, både före och efter Sleepy Joe. Sex timmars dag? Patetiskt! Ni behöver en riktig ledare som sänker skatter, sparkar ut byråkraterna och gör Sverige great again – inte mer av den här vänstervridna EU-sörjan.", "stalin": "Kamrater, detta är klassfiendens verk. Jag ser hur de exploaterande borgarbrackorna medvetet odlar massarbetslöshet för att hålla nere arbetarklassen och fylla sina fickor. EU är en nyliberal fascistmaskin som tjänar imperialisterna. Vi måste rensa ut dessa folkförtryckartroll och deras lakejer. Arbetstidsförkortning, starkare omställningskassor och att beslagta de blodsugrarnas övervinster – det är folkets väg. De som motarbetar skall likvideras ur historien."}, "date": "29 juli, 10:55", "url": "https://proletaren.se/artikel/det-gar-att-fa-bort-arbetslosheten", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/ledare-768x432.jpg"}, {"type": "text", "heading": "Pengatankar i semestertider", "summaries": {"normal": "Artikeln reflekterar över pengar under semestern. Författaren noterar Polens öppna skyltar om byggprojektens kostnader och finansiering, kontrasterat mot det svenska Västlänksbygget som dragit iväg från 20 till 71 miljarder kronor. Vidare kritiseras ECB:s förslag till nya eurosedlar som inte speglar EU:s verkliga problem. Avslutningsvis välkomnas sänkta priser på kollektivtrafikens månadskort tack vare politiska beslut.", "trump": "Folk, ni vet att de bara snackar om pengar när de inte har några, det är en total katastrof! Jag har byggt imperier, de här européerna bygger bara förseningar som Västlänken – från 20 till 71 miljarder, en riktig röra. Eurosedlar med småfåglar? Patetiskt. Men kolla, högern sänker priset på busskortet, äntligen smart politik. Fast gratis vore ännu bättre, ingen gör det bättre än mig, tro mig.", "stalin": "Kamrater, jag ser hur borgarbrackorna i Europa firar sina infrastrukturprojekt med skyltar som ropar ut kapitalistmaffians slöseri. Det svenska underjordiska järnvägsfiascot avslöjar klassfiendens lögner – från tjugo till sjuttioett miljarder, en klassisk utsugning. Eurosedlarna döljer byråkratiska blodsugares korruption. Ändå tvingas de sänka priset på arbetarnas färdbevis. Pengar som plötsligt finns? Misstänkt sabotage mot folkets kollektiv. Vi genomskådar er alla."}, "date": "29 juli, 10:51", "url": "https://proletaren.se/artikel/pengatankar-i-semestertider"}, {"type": "image-right", "heading": "”Vi ska dansa igen”: Ett attentat mot det öppna Berlin", "summaries": {"normal": "Under Berlin Pride 2026 attackerades firandet av en 21-årig man med kopplingar till islamistisk extremism. Han körde en skåpbil in i en folksamling vid Tiergarten, dödade en kvinna och skadade 29 personer. Gärningsmannen var tidigare dömd för förberedelse till terroristbrott, hade genomgått avradikalisering men uteblev från de flesta möten. Attacken väcker frågor om säkerhet och den utsatta queera friheten i ett alltmer polariserat Europa.", "trump": "Titta på det här. Det här är vad som händer när du släpper in radikala islamister och låter woke-paraden ta över gatan. En galning kör rakt in i folkmassan och de kallar det för 'frihet'. Patetiskt! Under Biden blev Europa en enda stor galenhus och nu dansar de med döden. Vi ska dansa igen? Nej tack, vi ska bygga murar och sluta importera problem. Amerika först, alltid.", "stalin": "Kamrater, se hur den dekadenta borgarklassen och dess queera avarter lockar fram klassfiendens dolk. En folkfiende med libanesiskt blod och islamistiska band får fritt springa bland imperialisternas regnbågsflaggor. Vi ser de fascistiska överklass-slynglarnas hat mot arbetarnas moraliska renhet. Denna händelse visar att den liberala dekadensen är en inbjudan till likvidering. Staten måste rensa ut alla sådana element innan de förgiftar hela samhällskroppen."}, "date": "26 juli, 18:51", "url": "https://www.flamman.se/vi-ska-dansa-igen-ett-attentat-mot-det-oppna-berlin", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlyljjogadk7o-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}]</script>

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
