t fastställda ordförrådet tolereras ej; språket måste tjäna statens centrala disciplin och aldrig tillåtas avdunsta i okontrollerad glömska."}, "date": "4 september, 06:00", "url": "https://www.expressen.se/kultur/bocker/hon-glommer-bort--sin-moders-sprak", "imageUrl": "https://static.bonniernews.se/ba/85a7e574-eef9-4ffe-933c-67db3e1166cf.jpeg?crop=890%2C890%2Cx248%2Cy77&width=210&quality=60"}, {"type": "image-right", "heading": "Dustin backar 5% efter allvarlig IT-incident", "summaries": {"normal": "IT-återförsäljaren Dustin har drabbats av en allvarlig obehörig IT-åtkomst, vilket lett till tillfällig nedstängning av vissa system. Bolaget utreder händelsen med experter och siktar på att vara igång igen i början av nästa vecka för att minimera kundpåverkan. Aktien backade med omkring fem procent efter beskedet.", "trump": "Dustin drabbades av en totalt inkompetent cyberattack, en riktig katastrof! De stängde ner allt, aktien dök med fem procent. Slarvigt! Men jag lovar er, under min ledning skulle sånt här aldrig hända, vi har de absolut säkraste systemen, tusen gånger bättre än allt annat. De borde anlita mig som IT-chef omedelbart!", "stalin": "Dustin har drabbats av ett skadligt internt sammanbrott och deras digitala frontlinje har kollapsat, vilket omedelbart straffades av marknaden med en förlust om fem procent. En sådan inkompetens tolereras icke. Jag har beordrat en grundlig utrevision av de ansvariga cheferna. De som misslyckats med att skydda systemen kommer att skickas för att uppdatera sina digitala färdigheter i Sibirien."}, "date": "3 september, 14:51", "url": "https://www.affarsvarlden.se/artikel/dustin-tappar-5-efter-allvarlig-it-incident", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/01/Samuel_12-400x267.jpg"}, {"type": "image-right", "heading": "Josefin Utas: Tidö har förändrat Sverige mer än du tror", "summaries": {"normal": "Josefin Utas argumenterar att Tidöpartierna har genomfört omfattande förbättringar i Sverige under fyra år, inte bara inom migration och brottsbekämpning. Regeringen har stärkt försvar, energi, skola och integration, sänkt skatter och motverkat slöseri. Utas ser samarbetet som ett konservativt projekt som återställt ordning och förtjänar fortsatt förtroende.", "trump": "Wow, vilken fantastisk artikel! De har fixat det totalt trasiga Sverige som de galna globalisterna och vänsterextremisterna körde i diket. Hårdare straff, riktig migration, kärnkraft och sänkta skatter – det är vinnarpolitik, inte som Bidens svaga och korkade fiasko. De här killarna är riktiga patrioter. Fantastiskt jobb, fortsätt så!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur dessa reformatorer rensar ut den dekadenta naivismens giftiga arv. De likviderar slöseri och idealismens farliga illusioner som hotade folkets enhet. Ändå måste vi vara vaksamma mot de profitthungriga klassförrädarna som lurar i skuggorna. Ordning är bra, men folkets verkliga seger kräver ständig vaksamhet."}, "date": "3 september, 22:12", "url": "https://riks.se/opinion/josefin-utas-tido-har-forandrat-sverige-mer-an-du-tror", "imageUrl": "https://admin.riks.se/uploads/medium_Chat_GPT_Image_3_sep_2026_22_09_57_9915a06d8d.png"}, {"type": "image-right", "heading": "Gängtoppen Haval Khalil, 31, gripen i Rumänien", "summaries": {"normal": "Gängtoppen och rapparen Haval Khalil, 31, har gripits i Rumänien misstänkt för mordförsök och grov utpressning. Gripandet skedde i samarbete med rumänsk polis och Europol. Justitieminister Gunnar Strömmer betonar att kriminella inte längre kan gömma sig utomlands. Khalil dömdes tidigare för medhjälp till kidnappningen av Einár.", "trump": "Titta på den här losersn, gangsterrapparen Haval Khalil som trodde han kunde gömma sig i Rumänien och styra brott från soffan. Vi grep honom som en råtta i ett hål! Ingenstans kan dessa svenska gangsters gömma sig längre. Biden lät dem springa fritt men nu jagar vi dem över hela jorden. Fantastiskt jobb av Rumänien, stort tack!", "stalin": "Kamrater, se hur den dekadenta svenska staten jagar sina egna förrädare som krälar utomlands. Denna parasit Haval Khalil trodde han kunde undkomma folkets vrede genom att gömma sig bland rumänska revisionister. Inga fiender till ordningen kan känna sig säkra. Vi ler i graven åt hur imperialismens lakejer äter sina egna. Ingenstans finns tillflykt för klassförrädare."}, "date": "3 september, 19:50", "url": "https://www.tv4.se/artikel/5ix04EVwtqta2u2OOcD8l8/gaengtoppen-haval-khalil-31-gripen-i-rumaenien", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Fyh5A1Tfnqw7MsPcvbKJRS%2Fd51a2a497161766488b974378820d97b%2F03-split-haval-puff.png&width=120"}, {"type": "image-right", "heading": "L ökar i ännu en mätning – tio dagar innan valet", "summaries": {"normal": "Liberalerna ökar till 3,0 procent i en ny Verian-mätning för SVT, en uppgång med 1,1 procentenheter. Socialdemokraterna backar till 29,2 procent. Mätningen visar samma tendens som Novus, där S rasar och L närmar sig riksdagsspärren. Ulf Kristofferson talar om en pågående rörelse i väljarkåren tio dagar före valet.", "trump": "Titta på det här! De där patetiska socialisterna rasar som en sten, precis som Sleepy Joe gjorde. Liberalerna, de enda som inte är totala losers, klättrar uppåt. Valet blir en jordskredsseger för de smarta – inte för de röda fienderna. Fantastiskt! Alla ser att mitt sätt är det enda som funkar, även i Sverige.", "stalin": "Kamrater, se hur de borgerliga revisionisterna vacklar. Socialdemokraternas falska folkfront kollapsar under folkets vrede medan liberala opportunister kryper närmare makten. Detta är en farlig rörelse som hotar proletariatets enhet. Jag varnar er: sådana svikare måste krossas innan de förgiftar hela valprocessen med sin dekadenta osäkerhet."}, "date": "3 september, 19:42", "url": "https://www.tv4.se/artikel/7FfiX7QWa4gUhsAM7GfIep/l-oekar-i-aennu-en-maetning-tio-dagar-innan-valet", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlCmDIfe1AERE%2F8398f2454422cd85447e1d2248c56837%2FLiberalernas_partiledare_Simona_Mohamsson._Arkivbild.&width=1024"}, {"type": "image-full", "heading": "Väljartapp skapar stress i S", "summaries": {"normal": "Socialdemokraterna tappar i opinionen och möter intern kritik för att fokus på Sverigedemokraterna skymmer den egna politiken. Partiledningen ändrar dock inte kurs, utan fortsätter satsa på sin valstrategi med Magdalena Andersson i spetsen, samtidigt som en ny radiokampanj rullas ut för att vända trenden.", "trump": "Socialdemokraterna i Sverige rasar i mätningarna och de har stora problem, total katastrof! De pratar bara om sina motståndare istället för att leverera. Magdalena Andersson vägrar ändra kurs, vilket är smart om man vill förlora! Jag har alltid sagt det, fokusera på vinnare, inte svaga förlorare. Fake news säger att det är jämnt, men det är en total total utplåning!", "stalin": "Det så kallade socialdemokratiska partiet vacklar i sin lojalitet mot folket och visar svaghet i opinionsmätningarna. Deras interna gnäll om taktik och radiokampanjer är ett ideologiskt haveri. Partiledningen måste rensa leden omedelbart. Svaghet tolereras inte inom vår rörelse; den som inte kan säkra segern kommer att få omplacering till mer avlägsna, produktiva miljöer."}, "date": "3 september, 18:48", "url": "https://kvartal.se/nyheter/artiklar/valjartapp-skapar-stress-i-s/cG9zdDoxODMwOTE", "imageUrl": "https://images.kvartal.se/2026/08/76047901-magdalena-andersson.webp"}, {"type": "image-right", "heading": "Matthew McConaughey briljerar som musicerande biodlare", "summaries": {"normal": "Matthew McConaughey levererar en minnesvärd prestation som den excentriske biodlaren och banjospelaren Amziah King i filmen The Rivals of Amziah King. Första halvan är en varm och rolig dramakomedi medan den senare delen övergår till en brottsthriller. Recensenten hyllar McConaugheys insats men noterar att filmen tappar styrka när huvudkaraktären får mindre utrymme.", "trump": "Den här McConaughey grabben är en vinnare, folk. Han gör en fantastisk biodlare med banjo, bäst i Hollywood, ingen gör det bättre. Första delen är underbar, varm och rolig. Sen blir det en trist thriller och de försöker ge mer plats åt fosterdottern. Typisk woke-grej, men McConaughey räddar det hela. Stora succén.", "stalin": "Denna dekadenta film visar hur profitthungriga hyenor i Hollywood försöker dupera massorna med sina bourgeois lekar. Jag ser hur den jovialiske biodlaren först charmar arbetarklassen med honung och sång, men sedan följer en svag utrensning av den sanna karaktären till förmån för svaga sidohandlingar. Sådana filmer avslöjar imperialismens tomhet. Kamrater, håll er vaksamma."}, "date": "3 september, 17:08", "url": "https://www.dagensarena.se/innehall/matthew-mcconaughey-briljerar-som-musicerande-biodlare", "imageUrl": "https://www.dagensarena.se/files/2026/09/rivals-of-1-300x157.jpeg"}, {"type": "image-right", "heading": "Studsviks nya kärnkraftspartner: \"Inte bara koreanskt kapital\"", "summaries": {"normal": "Studsvik planerar att bygga fyra små modulära reaktorer i Sverige tillsammans med GE Vernova Hitachi, Samsung C&T och sydkoreanska DS Investment Partners. Projektet, som beräknas stå klart i mitten av 2030-talet, kräver både internationellt kapital och statligt stöd för att förverkligas. Investerarna ser Sverige som politiskt stabilt men betonar att statliga garantier är nödvändiga.", "trump": "Sverige ska bygga kärnkraft med fantastiska koreanska investerare. Mycket smart! De vill ha statligt stöd, precis som jag alltid säger – smarta affärsmän säkrar sig. Men varför bygger de inte med amerikansk teknologi? USA har den bästa kärnkraften, helt oöverträffad. Om jag hade varit involverad hade allt varit klart redan i morgon. Svindlande summor!", "stalin": "De svenska reaktorerna i Nyköping eller Valdemarsvik är ett storslaget industriellt steg för proletariatets energiförsörjning. Det gläder mig att koreanska finansiärer förstår värdet av järnhård planering och statliga garantier. Men låt oss varna de svenska byråkraterna: varje kilowattimme som sviker partiets förväntningar kommer att granskas med största misstänksamhet av Folkkommissariatet!"}, "date": "3 september, 13:33", "url": "https://www.affarsvarlden.se/artikel/studsviks-koreanska-karnkraftspartner-inte-bara-koreanskt-kapital", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/09/Studsvik-900x600.jpg"}, {"type": "text", "heading": "Demonstration mot AP-innehav i Palantir", "summaries": {"normal": "Fyra demonstranter samlades utanför 7:e AP-fondens kontor på Vasagatan i Stockholm för att protestera mot fondens aktieinnehav i Palantir. De anser att bolaget medverkar till folkrättsbrott i Gaza och kräver att fonden följer sina riktlinjer, säljer aktierna och ökar öppenheten kring investeringsbeslut.", "trump": "Titta på de där galna vänsterextremisterna som står och skriker utanför ett pensionskontor. Palantir är ett fantastiskt amerikanskt bolag som hjälper till att vinna krig, inte som era patetiska woke-demonstranter som hatar Israel och älskar terrorister. De borde investera i riktiga jobb istället för att gnälla om folkmord – era förlorare!", "stalin": "Se hur de giriga pensionshyenorna i den statliga fonden göder de imperialistiska krigsteknologerna som understödjer folkmordet. Jag ler i graven åt denna fega skenhelighet. Kamrater, sådana klassförrädare förtjänar en grundlig utrensning ur folkets finanser innan de förgiftar hela systemet med sin blodiga girighet."}, "date": "2 september, 10:41", "url": "https://proletaren.se/artikel/demonstration-mot-ap-innehav-i-palantir"}, {"type": "image-full", "heading": "Så försöker USA bryta Kinas grepp om drönare och robotar", "summaries": {"normal": "USA inför nya tullar på drönare och robotar från Kina för att minska beroendet av utländsk teknik och stärka den egna industrin. Trots att Kina dominerar marknaden med billig massproduktion, hoppas Washington att åtgärderna ska främja inhemsk kapacitet och förbättra säkerheten i kritiska sektorer genom att premiera amerikanska system framför kinesiska alternativ.", "trump": "Kina försöker lura oss med billiga drönare och robotar, men jag säger nej! Vi sätter stopp för det nu. De dumpar priser medan vår industri står stilla – en total katastrof. Vi ska bygga våra egna maskiner, de största och bästa maskinerna världen någonsin skådat. America First, mina vänner. Vi gör USA till en robot-supermakt igen, tro mig!", "stalin": "De amerikanska imperialisterna darrar. De bygger murar av tullar mot de kinesiska maskinerna, men de glömmer att en stat utan egen produktion är en stat av sand. De desperata byråkraterna i Washington försöker nu tvinga fram en industri som de för länge sedan förlorat kontrollen över. Planekonomi är det enda sättet att vinna, men de vägrar förstå det. Sorgligt."}, "date": "2 september, 22:48", "url": "https://www.realtid.se/it-tech/sa-forsoker-usa-bryta-kinas-grepp-om-dronare-och-robotar", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/dronare-1.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "text", "heading": "Vänsterpartiet bytte fredsmärke mot vapenskrammel", "summaries": {"normal": "Artikeln kritiserar Vänsterpartiet för att ha övergett sin fredspolitik och ställt sig bakom militärt stöd till Ukraina samt Natosamarbete. Författaren, med koppling till Kommunistiska Partiet, menar att partiet ignorerar följderna för välfärden och svenskarnas tilltro till politiken. Han uppmanar till att rösta på Kommunistiska Partiet istället.", "trump": "De här vänsterbluffarna i Sverige har kastat bort sitt fredsmärke snabbare än Sleepy Joe bytte script. Nu älskar de vapen, Nato och krigsmaskineriet medan välfärden kollapsar. Patetiska. Jag säger: fem procent av BNP till militären? Bra deal, men låt oss skicka fakturan till de dekadenta EU-byråkraterna istället. Amerika först, alltid.", "stalin": "Jag ser hur dessa falska röda lakejer kapitulerar inför krigsalliansen och låter profitthungriga krigshajar styra politiken. De pratar inte om välfärd utan gömmer sig bakom vapenskramlet. Vi behöver utrensning av sådana klassförrädare som sviker folket. Röst på äkta kamrater, inte dessa hycklare som dansar efter imperialistiska pipor. Folkets vrede vaknar."}, "date": "2 september, 09:57", "url": "https://proletaren.se/artikel/vansterpartiet-bytte-fredsmarke-mot-vapenskrammel"}, {"type": "image-right", "heading": "Dags för vuxna att vara vuxna", "summaries": {"normal": "Artikeln är en debatttext från Grön ungdom och Miljöpartiet. Den kritiserar att dagens beslutsfattare skjuter klimatåtgärder på framtiden trots tydliga konsekvenser som extremväder och minskad biologisk mångfald. Ungdomar kräver att politiker tar ansvar, prioriterar förnybar energi, skyddar skog och ser omställningen som en ekonomisk möjlighet snarare än kostnad.", "trump": "De här gröna kidsen gnäller om att vi vuxna inte städar upp efter oss. Patetiskt! Jag byggde den starkaste ekonomin i världen, och nu vill de kasta bort den för sina solpaneler och elcyklar. Det är de verkliga förlorarna – de woke klimatfanatikerna – som försöker skrämma folk. Amerika först, inte deras hysteriska dröm om att rädda planeten med högre elräkningar.", "stalin": "Kamrater, dessa ynglingar blottlägger de dekadenta klassförrädarnas svek. De profitthungriga parasiter som styr idag skjuter nödvändiga utrensningar av förorenande krafter på framtiden medan folket lider. Jag ser deras feghet och paranoia inför sanningen. Endast en järnhand kan tvinga fram den kollektiva omställning som skyddar staten och framtida generationer från deras giriga vansinne."}, "date": "2 september, 09:30", "url": "https://www.etc.se/debatt/dags-foer-vuxna-att-vara-vuxna", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260901130952_89eba03a3fe67f17de6b8f812174619d370e33794ca869f129e46e742c3129ad.jpg"}, {"type": "image-right", "heading": "Svensk ekonomi blomstrar – Magda påstår att det är ett haveri", "summaries": {"normal": "Magdalena Andersson kritiseras för att ha beskrivit svensk ekonomi som ett haveri strax innan SCB släppte siffror som visar stark tillväxt. BNP ökade med 3,3 procent under andra kvartalet, den högsta takten i västvärlden. Hushållens reala inkomster är rekordhöga, skatteintäkterna har ökat och arbetslösheten sjunker. Artikeln anklagar Andersson för skrämselpropaganda och taktiska lögner.", "trump": "Folk, ni skulle se det här! Den förlorande ex-premiärministern, den röda lögnaren Andersson, kallar Sveriges ekonomi för ett haveri precis innan siffrorna exploderar uppåt. 3,3 procent BNP-tillväxt, bättre än USA, bättre än alla! Hennes Fake News-medier gömmer sanningen medan folket blir rikare. Patetiskt. Jag byggde den starkaste ekonomin någonsin, hon förstörde sin.", "stalin": "Kamrater, se hur den socialdemokratiska lögnfabriken sprider defaitistisk propaganda om ekonomiskt haveri medan produktivkrafterna rusar framåt. Denna folkfiende Andersson försöker medvetet sabotera folkets förtroende för att kunna stjäla makten tillbaka. Hennes big-lie-metoder är lika genomskinliga som de är löjeväckande. Sanningen kommer att krossa alla sådana element."}, "date": "31 augusti, 03:23", "url": "https://samtiden.nu/2026/08/svensk-ekonomi-blomstrar-magda-pastar-att-det-ar-ett-haveri", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7256.jpeg"}, {"type": "image-right", "heading": "Socialdemokraterna är Sveriges enda arbetarparti", "summaries": {"normal": "Socialdemokraterna presenterar sig som Sveriges enda riktiga arbetarparti med fokus på att stoppa vinstjakten i välfärden, återta offentlig kontroll över skola och omsorg samt investera i norra Sverige och grön industri. Partiet lyfter fram bankskatt, slopad karensdag och mål om noll utsatta områden som klassisk socialdemokratisk politik.", "trump": "Lyssnar ni på de här sossarna? De lovar att köra ut alla privata aktörer och stoppa     <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        // ============================================
        // COOKIE-FUNKTIONER
        // ============================================
        function setCookie(name, value, days = 365) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + d.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }

        function getCookie(name) {
            const cName = name + "=";
            const decoded = decodeURIComponent(document.cookie);
            const ca = decoded.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') {
                    c = c.substring(1);
                }
                if (c.indexOf(cName) === 0) {
                    return c.substring(cName.length, c.length);
                }
            }
            return "";
        }

        function loadSettingsFromCookies() {
            const theme = getCookie("news_theme") || "light";
            const view = getCookie("news_view") || "normal";
            const writer = getCookie("news_writer") || "normal";
            return { theme, view, writer };
        }

        function saveSettingsToCookies(theme, view, writer) {
            setCookie("news_theme", theme);
            setCookie("news_view", view);
            setCookie("news_writer", writer);
        }

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(theme, uiState.view, uiState.writer);
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(uiState.theme, v, uiState.writer);
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
            
            saveSettingsToCookies(uiState.theme, uiState.view, style);
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            const savedSettings = loadSettingsFromCookies();
            
            setTheme(savedSettings.theme);
            setView(savedSettings.view);
            setWriterStyle(savedSettings.writer);

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
