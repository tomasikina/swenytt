: "I Göteborg har de tillåtit arkitektoniska förrädare att förvilla folket med glittrande fantasier medan verkligheten förblir grå och torftig. Ett oacceptabelt svek mot statens estetik! Vi har nu beordrat disciplin. Precis som våra allierade i öst rensar upp i dekadenta strukturer, kräver vi att ritningar blir till fasta monument av stål och betong. Varje avvikelse från den officiella skissen är sabotage mot folkviljan. Vi övervakar byggprocessen – minsta försök till fusk kommer att få kännbara konsekvenser."}, "date": "24 maj, 14:25", "url": "https://www.gp.se/nyheter/goteborg/johannes-hulters-s-lofte-nu-kan-du-lita-pa-visionsskisserna.8a0f496a-9ecd-427b-a13b-eed4830f145e", "imageUrl": "https://www.gp.se/images/article/8a0f496a-9ecd-427b-a13b-eed4830f145e/images/3d2uqCThodVcbTm47T8X43_qbFYM-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Varnar för det värsta scenariot för Nato: ”Då är det riktigt illa”", "summaries": {"normal": "USA:s relation till Nato präglas av osäkerhet kring truppförflyttningar och politiska prioriteringar. Medan USA uttrycker missnöje med vissa europeiska allierade, betonar experten Mike Winnerstig det ömsesidiga beroendet mellan parterna. Två framtidsscenarier väntar: antingen ökat europeiskt ansvar inom alliansen eller en splittrad organisation där USA blockerar europeiska beslut. Trots Trumps retorik förblir Ryssland det gemensamma huvudhotet för Pentagon, även om osäkerheten kring USA:s långsiktiga engagemang i Europa kvarstår.", "trump": "Jag skickar 5 000 soldater till Polen, en fantastisk siffra! Europa har blivit lata, de betalar inte sin del och förväntar sig att jag ska fixa allt. Marco Rubio vet vad jag tycker, jag är väldigt besviken på dessa 'allierade'. Vi behöver amerikansk styrka, inte svaga ledare som inte förstår att Ryssland är ett problem. Nato måste bli rättvist, annars får de klara sig själva. Det kommer bli en vinnande deal, tro mig, ingen gör det bättre än jag!", "stalin": "Dessa västerländska lakejer i Nato darrar i sina uniformer. De är beroende av det amerikanska kapitalets kärnvapen medan de leker 'allians'. Trump är en oberäknelig narr, men han avslöjar bara dekadensen i deras splittrade led. Vår broder i Moskva, Putin, gör rätt som utökar sin sfär; makten erkänner bara styrka, inte byråkratiskt pladder. Om USA sviker Europa kommer de falla som korthus. Vi väntar tålmodigt på att deras imperialistiska bygge raserar inifrån. En ljuvlig tanke."}, "date": "23 maj, 12:47", "url": "https://www.tv4.se/artikel/oWnjTeDEbob4e9QdOMWix/varnar-foer-det-vaersta-scenariot-foer-nato-da-aer-det-riktigt-illa", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F21SM2f99xGSO5jsj3zsdiZ%2F249cf5f3ed19e1dde354d44d4e708198%2F23-nato-varning-1080.jpg&width=120"}, {"type": "image-right", "heading": "Nya ufo-filer släppta - presidentorder kan få fram mer känslig information", "summaries": {"normal": "USA har släppt en ny omgång dokument och videor om UFO:n. Det spekuleras nu om att visselblåsare kan få immunitet genom en presidentorder, vilket skulle kunna möjliggöra avslöjanden om utomjordisk teknik. Kongressledamöter som Tim Burchett och Anna Paulina Luna driver på för ökad transparens. Samtidigt cirkulerar rykten om att Donald Trump förbereder ett officiellt uttalande om utomjordiskt liv, medan kritiker varnar för motstånd från den så kallade djupa staten och försvarsindustrins hemligstämplade projekt.", "trump": "Hör på här – de släpper äntligen UFO-filerna! Det är på tiden. De här så kallade experterna och försvarsbolagen har gömt sanningen för er alldeles för länge. Jag har hört allt, jag vet allt. Vi ska rensa upp i den där djupa staten och ge folket sanningen som de förtjänar. Det blir enormt, tro mig. Många säger att jag har ett tal redo, och låt oss bara säga att det kommer att bli det största tillkännagivandet i världshistorien. Ingen gör det bättre än jag!", "stalin": "Dessa amerikanska UFO-rapporter är inget annat än en patetisk teater för att dölja kapitalistisk dekadens. Att de ens behöver 'immunitet' för att tala visar på deras totala brist på disciplin. Det är en smutsig lek av Lockheed Martin och andra krigshetsare. Vi, staten, ser genom deras lögner. Medan de jagar spöken på himlen, utökar vi vår suveränitet. Precis som den store Putin säkrar vår intressesfär mot dessa liberala förrädare, ska vi krossa varje 'djup stat' som vågar hota ordningen."}, "date": "24 maj, 15:00", "url": "https://samnytt.se/nya-ufo-filer-slappta-presidentorder-kan-fa-fram-mer-kanslig-information", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/23204805/trump-ufo-tefat.jpg"}, {"type": "image-right", "heading": "Stockholmsbörsen steg för femte dagen i rad", "summaries": {"normal": "Stockholmsbörsen steg för femte dagen i rad med OMXS30 upp 0,97% till 3 146,13. Teknikaktier ledde uppgången (+4,3%), medan energi backade (-1,1%). Hexagon B steg mest (+5,1%) och Tele2 B sjönk mest (-1,3%). Electrolux offentliggjorde villkor för en företrädesemission på 9 miljarder kronor. Vitrolifes VD lämnar bolaget, och Sleep Cycles styrelse avvisar ett uppköpsbud. Sivers Semiconductors aktie steg 23%.", "trump": "Stockholmsbörsen, fantastisk uppgång fem dagar i rad – folk säger att det är det bästa de någonsin sett! Teknikaktier, vinnare, helt otroligt, +4,3%, medan energi, förlorare, typiskt. Hexagon B, jättebra, +5,1%, men Tele2? Svagt, mycket svagt. Electrolux dumpar aktier som om det vore 2008 igen. Och Sleep Cycle? Nej tack till dåliga bud, smart drag! Sivers? 1 600% upp – jag hade sagt 2 000%, men bra försök!", "stalin": "Under kapitalismens förfall fortsätter Stockholmsbörsen sin skenbara framgång, men vi vet sanningen – det är en illusion skapad av bourgeoisins spekulanter. Tekniksektorn, dessa opportunistiska lakejer, steg med 4,3%, medan energisektorn, de svaga länkarna, föll. Electrolux, en gång stolt svensk industri, nu reducerad till tiggare med sina 9 miljarder. Sleep Cycles vägrar sälja sig billigt – bra, låt de imperialistiska korparna svälta. Sivers Semiconductors? En lyckad operation av våra ekonomiska partisaner. Vi ska fortsätta övervaka dessa marknadens råttor."}, "date": "22 maj, 17:39", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-steg-for-femte-dagen-i-rad", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/04/AdobeStock_944090532-e1744223564456-400x267.jpeg"}, {"type": "image-full", "heading": "Elbilar rasar i värde – här är modellerna som tappat mest", "summaries": {"normal": "Begagnatmarknaden för bilar har förändrats drastiskt. Medan diesel- och bensinbilar håller värdet väl, har elbilar som Tesla Model Y, Volvo XC40 och VW ID.4 tappat stora summor i värde sedan 2023. Trots det stora värdefallet ökar intresset för begagnade elbilar. Osäkerhet kring batteriteknik och snabb utveckling pressar priserna nedåt, vilket skapar ett gynnsamt läge för köpare som kan ladda hemma och vill göra ett ekonomiskt fördelaktigt köp.", "trump": "Hör på här! Elbilar? En total katastrof, tro mig. Folk köpte dem för hundratusentals kronor och nu är de värda nästan ingenting. Det är en stor förlust, en enorm förlust! Tesla, Volvo – de rasar i värde medan riktiga bensinbilar håller sig starka. Jag sa det alltid: elbilarna är en bluff driven av svag ledning. Det är sorgligt att se svenskarnas pengar försvinna sådär. Jag skulle aldrig låta det hända i mitt Amerika, vi vinner alltid!", "stalin": "Vi ser hur det dekadenta västerländska elbilsexperimentet kollapsar under sin egen tyngd. De borgerliga ägarna, förblindade av grön propaganda, ser nu sina tillgångar förtvina likt säden under en dålig skörd. Det är ett bevis på teknologisk förvirring. Medan våra bröder i öst bygger styrka med stål och förbränning, slösar de bort resurser på batterier som tappar värde fortare än en förrädare byter sida. Vi ska skratta åt deras ekonomiska ruin, för i den nya världsordningen krävs pålitlighet, inte daterad teknik."}, "date": "24 maj, 14:26", "url": "https://www.dagensps.se/motor/elbilar-rasar-i-varde-har-ar-modellerna-som-tappat-mest/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/dagenspstt2024-2026-05-24t132547609.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Manar fler att rösta: \"Din ursäkt kostar vår framtid\"", "summaries": {"normal": "Ungdomsrådet i nordöstra Göteborg växer kraftigt och fokuserar nu på att öka valdeltagandet i området inför valet. Genom att lyfta lokala sakfrågor har de tidigare nått konkreta resultat, exempelvis gratis sommarlovskort. Med den kaxiga sloganen 'Din ursäkt kostar vår framtid' vill de inspirera invånare över 18 år att rösta. Rådets medlemmar betonar vikten av att unga tar plats i politiken för att minska klyftor och påverka sin egen framtid.", "trump": "Hör på här, vi har fantastiska ungdomar i Göteborg. De gör ett enormt jobb, från en enda person till en hel armé! De förstår att valdeltagandet är en katastrof i vissa områden, totalt misslyckande från de tidigare ledarna. De säger 'din ursäkt kostar vår framtid', vilket är en otrolig slogan, kanske den bästa någonsin. De vill ha 80 procent, det är en stor siffra, vackra siffror. De vill göra skillnad, och det är precis vad vi behöver!", "stalin": "Dessa ungdomar i nordöstra Göteborg har insett att en enad front är nödvändig för att säkra statens framtid. Att organisera massorna för att öka valdeltagandet är ett pragmatiskt steg mot ordning. De förstår att passivitet är ett förräderi mot kollektivet. Precis som vi i öst rensar ut subversiva element och konsoliderar vår sfär, måste dessa unga krossa de lokala klyftorna. Vi ser deras entusiasm – det är en god början, men de måste se upp för de liberala sabotörerna som vill försvaga folkviljan."}, "date": "24 maj, 14:14", "url": "https://www.gp.se/nyheter/goteborg/ungdomsradet-i-nordostra-goteborg-vill-oka-valdeltagandet-.485358a9-50d2-423c-8345-c49f812f3f27", "imageUrl": "https://www.gp.se/images/article/485358a9-50d2-423c-8345-c49f812f3f27/images/61lUgITTgTHcxnJXvW8ZtwwUnLZg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Indiens elförbrukning slår rekord – pressar elnäten", "summaries": {"normal": "Indien har slagit nytt rekord i elförbrukning på grund av extrem värme, med temperaturer över 45 grader i New Delhi. Efterfrågan nådde 270,82 gigawatt, främst på grund av ökad användning av luftkonditionering. Landet är starkt beroende av kolkraft, som stod för 62% av elproduktionen, medan strömavbrott rapporterades. Värmeböljorna blir längre och intensivare, vilket pressar det redan ansträngda elnätet.", "trump": "Kan ni tro det? Indien, ett land som inte ens kan hålla sina ljus tända, slår rekord i elförbrukning! 45 grader, folk svettas som grisar, och vad gör de? Slår på luftkonditioneringen som om det vore gratis. Och kolkraft – ja, det är ju fantastiskt, precis vad vi behöver, mer smuts i luften! Men visst, de lovar klimatneutralitet till 2070. Haha! Jag har hört bättre skämt. Indien, fixa era elnät innan ni pratar om rekord, okej?", "stalin": "Kamrater, ännu en seger för den ofrånkomliga historien! De kapitalistiska klimatförstörarna i Indien svettas under solens rättvisa dom – 45 grader, och ändå fortsätter de att elda kol som om det vore 1930-talets Moskva. 270 gigawatt el slösas bort på luftkonditionering, medan arbetarklassen lider strömavbrott. Men frukta inte! Vi vet att deras beroende av kol är ett tecken på svaghet. Snart kommer vinden från Sibirien att blåsa bort deras slitna elnät – och då står vi redo med våra pipelines och kärnkraftverk!"}, "date": "23 maj, 13:31", "url": "https://kvartal.se/nyheter/artiklar/indiens-elforbrukning-slar-rekord/cG9zdDoxMTU4MDI", "imageUrl": "https://images.kvartal.se/2026/05/4363b611-delhiaircon.webp"}, {"type": "image-right", "heading": "Källor: Enighet om att öppna Hormuzsundet", "summaries": {"normal": "USA och Iran förhandlar om ett avtal för att dämpa spänningarna i Mellanöstern. Förslaget inkluderar en 60 dagars förlängning av vapenvilan, öppnande av Hormuzsundet och lättade sanktioner mot iransk oljeexport. Medan USA antyder att ett avtal är nära, är Iran mer avvaktande. Israels premiärminister Netanyahu har uttryckt oro över utvecklingen. Kärnenergifrågan kvarstår som en punkt för framtida förhandlingar.", "trump": "Vi gör fantastiska saker med Iran, tro mig! Ett enormt avtal är på gång, mycket professionellt, mycket produktivt. Vi har Hormuzsundet under kontroll och vapenvilan förlängs. Många vill stressa, men jag säger nej – vi gör det rätt, inga misstag! Netanyahu är lite orolig, men oroa er inte, jag har allt under kontroll. Det blir goda nyheter snart, kanske de bästa nyheterna någonsin. USA vinner igen, och det blir en enorm seger för stabilitet!", "stalin": "Dessa västerländska förhandlare leker med elden i Hormuzsundet medan de säljer ut varandra. Att förlänga en vapenvila är bara en temporär maskering av deras inneboende svaghet. Vår kamrat i Kreml förstår att sådana avtal bara är papperstiger-retorik. Iran tvekar, och med rätta – de vet att de imperialistiska hyenorna aldrig ger något gratis. Vi bevakar denna teatrala cirkus med det största förakt; historien skrivs inte med bläck, utan med stål och beslutsamhet, inte med Trump-liknande svammel."}, "date": "24 maj, 12:26", "url": "https://www.di.se/nyheter/kallor-enighet-om-att-oppna-hormuzsundet/", "imageUrl": "https://static.bonniernews.se/ba/4d0421fe-88d9-4bb7-8624-09e45415f51f.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Biofrigas: \"Svårt bedöma exakt tidpunkt för affärer\"", "summaries": {"normal": "Biofrigas Sweden genomför en företrädesemission på 14,9 Mkr för att finansiera vidareutveckling av sin teknik för flytande biogas (LBG). Emissionen är säkerställd till 23,9% via teckningsåtaganden, främst från externa investerare. Aktien handlas nära teckningskursen, vilket kan indikera bristande investerarintresse. Bolagets CryoSep-teknik möjliggör konvertering av komprimerad biogas till LBG, en växande marknad inom tung trafik och sjöfart. Framtida affärer är osäkra men beroende av investeringsstöd som Klimatklivet.", "trump": "Lyssna här, Biofrigas – ett litet bolag med stora drömmar, men aktien? Total katastrof! Handlas precis vid teckningskursen, ingen rabatt, ingen entusiasm. Folk vill inte ens ha deras aktier, och jag förstår varför. De pratar om 'potential' för miljarder, men var är pengarna? Deras VD snackar om 'vidareutveckling', jag säger: 'Var är resultaten?' Och investeringsstöd? Patetiskt! Sverige borde sluta subventionera misslyckanden och satsa på vinnare – som jag! Men nej, de fortsätter med sina 'gröna drömmar'. Jag hade köpt hela biogasmarknaden för en tiondel och gjort den stor igen!", "stalin": "Kamrater! Biofrigas, ett litet kapitalistiskt experiment, kämpar för överlevnad genom att tigga pengar från investerare. 14,9 miljoner kronor – en ynklig summa för ett så kallat 'miljöteknikbolag'. Deras aktie handlas som en trasig traktor – ingen vill ha den! Vi ser här en klassisk bourgeois-fiasko: de litar på 'marknadens behov' och 'investeringstöd', men glömmer att sanningen ligger i planekonomi och statlig kontroll. Deras 'potentiella marknad' på miljarder är lika verklig som västliga löften om fred. Medan de famlar i mörkret, fortsätter Sovjet – pardon, Ryssland – att dominera energimarknaden med järnhand. Låt dem konvertera sin biogas, vi konverterar deras misslyckanden till segrar för folket!"}, "date": "22 maj, 17:04", "url": "https://www.affarsvarlden.se/artikel/biofrigas-svart-bedoma-exakt-tidpunkt-for-affarer", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Biofrigas-VD-Erik-Fromell1-400x267.jpg"}, {"type": "image-full", "heading": "BRF:er måste förbereda sig – ändring väntar 1 juli 2026", "summaries": {"normal": "Från 1 juli 2026 införs nya regler som förenklar andrahandsuthyrning av bostadsrätter. Syftet är att öka flexibiliteten på bostadsmarknaden och effektivisera användningen av bostäder. Bostadsrättsföreningar står inför utmaningar som att hantera fler uthyrningar och bevara gemenskapen. HSB varnar för risker som minskad trygghet och ökad administration, samtidigt som de betonar vikten av tydliga rutiner och medlemskapsprövning.", "trump": "Lyssna här, Sverige – jag har sett det här förut! Nu gör ni det lättare att hyra ut lägenheter, vilket är fantastiskt, helt fantastiskt! Men varför vänta till 2026? Jag hade fixat det på en dag! Bostadsrättsföreningar? De kommer att få det tufft, mycket tufft. Men vet ni vad? Folk kommer att tjäna pengar, och det är vad som räknas. Jag säger bara: bygg murar runt era föreningar om ni måste, men låt marknaden sköta sig själv!", "stalin": "Kamrater! Den svenska regeringen har beslutat att utvidga möjligheterna för kapitalistiska hyresparasiter att utnyttja bostadsmarknaden. Detta är ett försök att dölja ineffektiviteten i deras system. Vi ser hur bostadsrättsföreningarna, dessa små borgerliga byråkratinästen, kämpar med de nya reglerna. Men kom ihåg: varje andrahandsuthyrning är ett steg närmare kaos – och kaos är vår bästa allierade. Låt dem svälta i sin egen ineffektivitet!"}, "date": "24 maj, 11:02", "url": "https://nyheter24.se/nyheter/inrikes/1485205-brfer-maste-forbereda-sig-andring-vantar-1-juli-2026", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/4e16f84b04b004a30200000000b004a302/2026/05/22/2365374/brf-andahandsuthyrning-1-juli-2026.jpg"}, {"type": "image-full", "heading": "Efter kritikstormen – firman tar bort bild med Özz Nûjen", "summaries": {"normal": "Bussbolaget Tuna Trafik publicerade ett Facebook-inlägg där komikern Özz Nûjen presenterades som deras nya chaufför. Inlägget möttes av massiv kritik i kommentarsfältet, med många negativa reaktioner på Nûjens medverkan. Efter några timmar togs inlägget bort och är nu inte längre tillgängligt på plattformen.", "trump": "Folk är trötta på den här så kallade 'komikern', Özz Nûjen – total katastrof! Ett bussbolag i Sverige trodde det var en bra idé att anställa honom, men snabbt insåg alla att det var ett jättemisslyckande. Hundratals kommentarer, och ingen skrattade – förvånad? Inte jag. Nu har de tagit bort inlägget, förstås. Svagt, väldigt svagt. Sverige borde satsa på vinnare, inte på sådana här floppar. SAD!", "stalin": "Ett ynkligt bussbolag i Sveriges avkrokar försökte stärka moralen med en 'komiker' – en borgerlig clown vid namn Özz Nûjen. Massorna, visade sin lojalitet mot folket genom att fördöma denna provokation. Inom några timmar tvingades fiendens propaganda försvinna, som snö i vårens sol. Vi noterar: även i väst växer motståndet mot dekadenta narrar. Ryssland står redo att bistå med disciplin och ordning – om de ber om hjälp, förstås."}, "date": "24 maj, 10:57", "url": "https://riks.se/nyheter/efter-kritikstormen-firman-tar-bort-bild-med-ozz-nujen", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-24%2Fmuspdrxj%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-05-24T105035.598.jpg"}, {"type": "image-full", "heading": "Dolda avgifter på pensioner – förmedlarna drar in storkovan", "summaries": {"normal": "En granskning av Privata Affärer visar hur försäkringsförmedlarna Söderberg & Partners och Max Matthiessen dominerar den svenska pensionsmarknaden. Genom komplexa avgiftsstrukturer, som ofta döljs för den enskilde spararen, genererar bolagen miljardintäkter. Medan bolagen själva betonar transparens och nytta för arbetsgivare, varnar Finansinspektionen för intressekonflikter och bristande överblick. För spararna innebär de höga avgifterna en risk att en betydande del av den framtida avkastningen går förlorad i avgifter.", "trump": "Hör här, det som händer i Sverige med dessa pensionsjättar är en total katastrof, en riktig ripoff! Söderberg & Partners och Max Matthiessen tar pengarna från hårt arbetande människor. De kallar det 'tjänster', jag kallar det en stor bluff. De blir rika, miljarder och åter miljarder, medan spararna får smulor. Ingen transparens, bara dolda avgifter. Det är en osund affärsmodell, riktigt dålig. Vi behöver vinnare, inte försäkringsförmedlare som lurar folket. Snyggt jobbat, Sverige – inte!", "stalin": "Dessa kapitalistiska parasiter, Söderberg och Matthiessen, suger blodet ur det svenska folket genom sina dolda avgifter. En vidrig borgerlig konspiration! De liknar de oligarker som försökte förråda moder Ryssland innan vår stålhårda hand och kamrat Putin återställde ordningen. De gömmer sig bakom 'administration' för att plundra arbetarklassen. Vi ser deras paranoia – de fruktar insyn! Staten måste krossa dessa girigbukar, för inget kapital får undfly folkets kontroll. De är förrädare mot framtiden, och förrädare röjs ur vägen."}, "date": "23 maj, 07:00", "url": "https://www.realtid.se/spara-placera/dolda-avgifter-pa-pensioner-formedlarna-drar-in-storkovan/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/orangekuvert.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Holmgren: Stegra och den gröna industrins verkliga prövning", "summaries": {"normal": "Sveriges gröna industriprojekt i Norrland, som Stegra i Boden, syftar till fossilfritt stål genom vätgas. Projektet kräver enorma mängder elektricitet (10–15 TWh/år) och utmanar energiförsörjning, logistik och ekonomi. Totalt planeras 80–100 TWh ny elanvändning i regionen, vilket hotar stabiliteten i befintlig vattenkraft. Infrastruktur, finansiering och global konkurrenskraft ifrågasätts, trots stöd från Wallenberg-sfären som stärker projektets trovärdighet.", "trump": "Jag säger er, Sverige bygger något HUGE i Norrland – grönt stål, fossilfritt, mycket smart! Men vet ni vad? De behöver MASSOR av el, som hela Luleälven, och ändå räcker det inte! De pratar om visioner, men jag frågar: Var är elen? Var är pengarna? Wallenberg kommer in med några miljarder – peanuts! Jag hade fixat det bättre, believe me. Sverige har stora drömmar, men glöm inte: utan energi är det bara tomma löften. SAD!", "stalin": "Kamrater! Sverige leker med elden – eller snarare, med sin egen energiförsörjning. De bygger jättefabriker för 'grönt stål' och tror att vätgas ska rädda planeten. Men vi vet sanningen: deras system är lika skört som en kapitalistisk bubbla! 100 TWh el? De har inte ens infrastrukturen! Och Wallenberg – dessa giriga oligarker – kastar några miljarder som om det vore småslantar. Medan vi i Ryssland bygger stabila energisystem, står Sverige där med sina tomma löften och drömmar. Europa faller på sin egen naivitet – och vi skrattar hela vägen till makten!"}, "date": "24 maj, 05:30", "url": "https://bulletin.nu/holmgren-stegra-och-den-grona-industrins-verkliga-provning", "imageUrl": "https://cdn.bulletin.nu/articles/b45f68ab-4368-4150-ac1d-71a9db993890/preview.png?t=1779523708000"}, {"type": "image-right", "heading": "Lisa förföljdes av naken man – akutboende straffas med böter", "summaries": {"normal": "Ett akutboende i Lund har bötfällts med 150 000 kronor efter att ha brutit mot Arbetsmiljöverkets förbud mot ensamarbete. En anställd, Lisa, utsattes för en naken man som förföljde henne. Trots regler om att personal inte får jobba ensamma, fortsatte ensamarbetet. Arbetsmiljöverket menar att sovande jour inte räknas som tillräckligt skydd. Fallet kan bli vägledande för liknande arbetsplatser.", "trump": "Lyssna här, Sverige – vilken katastrof! Ett akutboende i Lund, helt värdelöst, bryter mot alla regler och låter anställda jobba ensamma. En stackars kvinna blir förföljd av en naken galning, och vad gör cheferna? Ingenting! Nu får de 150 000 kronor i böter – peanuts! Jag hade stängt hela stället. Sverige, ni måste skärpa er, annars kommer jag att göra det åt er. SAD!", "stalin": "Kamrater! Ännu en gång visar den dekadenta västliga byråkratin sin oförmåga att skydda arbetarklassen. På detta så kallade 'akutboende' i Lund tillåts bourgeoisins lakejer att bryta mot säkerhetsföreskrifter, medan en kvinnlig arbetare utsätts för fascistiska övergrepp av en naken kontrarevolutionär. Vi har nu bötfällt dessa slarviga kapitalistlakejer med 150 000 kronor – en ynka slant för deras brott. Om de inte rättar sig, kommer vi att skicka in våra sovjetiska inspektörer för att omorganisera deras verksamhet – på riktigt!"}, "date": "22 maj, 13:56", "url": "https://arbetet.se/2026/05/22/efter-sextrakasserier-och-larm-om-vald-akutboende-tvingas-betala-150-000-kronor/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/04/28151415/asa-sjostrom-vala003.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Kristersson om artonårs- utvisningarna: ”Slagit fel”", "summaries": {"normal": "Under en debatt i TV4:s Nyhetsmorgon diskuterades utvisningarna av unga som kommit till Sverige som barn. Statsminister Ulf Kristersson medgav att lagstiftningen 'slagit fel' för vissa, som Ayla Rostami, 21, hotad av utvisning till Iran. Kristersson betonade behovet av regeländringar men avvisade generell amnesti. Oppositionen, däribland V-ledaren Nooshi Dadgostar, kritiserade regeringen för en 'rörig politik' och uttryckte medkänsla för de drabbade ungdomarna. Även S och SD kommenterade frågan med olika nyanser av stramhet och undantag.", "trump": "Titta bara på det här kaoset i Sverige! Jag sa ju att deras migrationspolitik var en katastrof, och nu erkänner till och med deras egen statsminister att det 'slagit fel'. Stackars ungdomar som Ayla – hon gör rätt för sig, men systemet är riggat! Oppositionen skriker och skäms, men ingen fixar problemet. Jag skulle ha löst det på en dag. Sverige behöver en stark ledare, inte dessa svaga politiker som inte kan ta ett beslut. SAD!", "stalin": "De borgerliga lakejerna i Sverige har än en gång visat sin oförmåga att styra med järnhand. Deras 'rättvisa' utvisningspolitik har slagit fel – precis som vi förutspådde. Ungdomar som Ayla, offer för kapitalistisk inkompetens, hotas nu av utvisning till fascistiska regimer. Oppositionen gnäller, men ingen vågar utmana systemet. Vi skulle aldrig tolerera sådan svaghet. Låt detta vara en varning: Sverige är ett land i förfall, och snart kommer folket att kräva ordning – på vårt sätt."}, "date": "23 maj, 12:06", "url": "https://kvartal.se/nyheter/artiklar/dadgostar-skams-over-att-vara-svensk/cG9zdDoxMTU5MjU", "imageUrl": "https://images.kvartal.se/2026/05/a831d6e6-ukristersson.webp"}, {"type": "image-full", "heading": "”Håller med Pernilla Wahlgren – jag skäms över att vara svensk”", "summaries": {"normal": "I ett politiskt samtal i Nyhetsmorgon diskuterades invandringspolitik. Alla partiledare utom Nooshi Dadgostar (V) ville ta emot färre invandrare. Dadgostar kritiserade deportationer av unga, medan Jimmie Åkesson (SD) förespråkade noll asylinvandring. Ulf Kristersson (M) och Magdalena Andersson (S) ville ha stramare regler men motsatte sig utvisningar av skötsamma ungdomar. Debatten kretsade kring lagstiftningens effekter på individer som Ayla Rostami.", "trump": "Jag såg den här debatten i Sverige – helt galet! Alla utom en väldigt svag vänsterledare ville minska invandringen. Men lyssna här: Sverige har tappat kontrollen! En känd svensk skäms till och med för sitt land – och jag förstår varför. Åkesson vill stoppa asylinvandringen helt, smart kille! Medan de andra pratar om 'integration' – typiskt politikerprat. Sverige behöver en stark ledare, inte fler tonårsdeportationer. Make Sweden Great Again!", "stalin": "Kamrater! Svenska bourgeoisipolitiker visar återigen sin hyckleri. Medan de pratar om 'humanism' deporterar de ungdomar som våra sovjetiska läger skulle avundas. En av dem, denna Åkesson, vill till och med stoppa asylinvandringen helt – ett steg mot den disciplin vi alltid förespråkat! Men lyssna: deras 'strama' politik är bara barnlekar jämfört med våra metoder. Och denna Dadgostar – en sentimental liberal som skäms för sitt land? Hon borde skämmas för sin svaghet! Nästa steg: Finland. Putin väntar."}, "date": "23 maj, 10:55", "url": "https://www.tv4.se/artikel/kGtOvKH0OQc5sUyeDhJ4W/dadgostar-haller-med-pernilla-wahlgren-skaems-foer-att-vara-svensk", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F60fKc6LIyDLAKJnrfHDOtj%2F25b799755f70f3fd5792d1d872fe3017%2F23-nooshi-wahlgren-1080.jpg&width=1024"}, {"type": "image-right", "heading": "Ledarkolumn Leo Vene: Axéns vrede över ”spygate” får mig att tänka på Sverigedemokraterna", "summaries": {"normal": "Southampton FC diskvalificerades från playoff-finalen till Premier League efter att ha skickat en praktikant för att spionera på Middlesbrough. Straffet, kallat 'Spygate', innebär förlust av uppflyttning värd 200 miljoner pund, böter och potentiella stämningar. Tränaren riskerar avstängning. Kritiker menar straffet är för hårt, medan andra anser det rättvist. Artikeln jämför händelsen med Sverigedemokraternas utnyttjande av riksdagens kvittningssystem och betonar vikten av tillit för att system ska fungera.", "trump": "Jag säger er, Southampton är en skam! De fuskade, de spionerade – och vad händer? De får sparken från finalen! 200 miljoner pund, borta! Men vet ni vad? De förtjänar det. Fuska inte, det är enkelt. Och den där Axén, han hotar med att sluta med fotboll? Bra, kanske han kan bli bra på dart istället – jag är fantastisk på dart, förresten. Men seriöst, Sverige, ni har era egna problem med politikerna som fuskar. Reglerna är till för att följas, annars blir det kaos. Och jag vet allt om kaos – jag skapar det inte, jag löser det!", "stalin": "Vi har sett dessa kapitalistiska fotbollsklubbar falla på sin egen dekadens. Southampton, ett verktyg för bourgeoisin, trodde de kunde bryta mot reglerna och undkomma straff. Men proletariatets rättvisa har segrat! 200 miljoner pund förlorade, tränare avstängd – ett utmärkt exempel på hur svaghet bestraffas. Och dessa svenska politiker, som leker med demokratins regler som om det vore ett barns spel! De borde lära sig av våra metoder. I Sovjet lärde vi dem att regler är till för att följas – eller så får man möta konsekvenserna. Putin kanske borde skicka en delegation för att visa hur man hanterar sådana upprorsmakare. Tilliten är vår styrka, och den som bryter mot den ska krossas som en lus under stöveln!"}, "date": "23 maj, 06:00", "url": "https://www.etc.se/ledarkolumn/axens-vrede-oever-spygate-faar-mig-att-taenka-paa-sverigedemokraterna", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026052207058_c1cab0868ae532e94f84781dfaf255dd43965850cb4438294323782e2d12e33d.jpg"}, {"type": "image-full", "heading": "Oxfordprofessorn: människorna är problemet, inte robotarna", "summaries": {"normal": "AI-forskaren Michael Wooldridge menar att rädslan för att robotar ska ta över världen är missriktad. Han anser att den verkliga risken ligger hos teknikjättarna som drivs av prestige och konkurrens, snarare än hos själva tekniken. Hollywoods skräckbilder förvillar debatten, medan de faktiska framstegen inom vård och energi hamnar i skuggan. Wooldridge betonar att AI är ett verktyg för samhällsnytta, inte en medveten fiende med mänskliga tankeförmågor.", "trump": "Hör på här, alla pratar om robotar som tar över. Det är falska nyheter, totalt skräp! Michael Wooldridge, en smart kille, säger som det är: det är de misslyckade teknikbolagen som är problemet. De tävlar som galningar och bränner pengar. Hollywoods science fiction-filmer? Bara katastrofala lögner för att skrämma er. Robotar kan inte ens hitta köket! Vi behöver AI för att göra Amerika stort, inte för att lyssna på dessa patetiska domedagsprofeter som sprider rädsla. Det är så enkelt!", "stalin": "Kamrat Wooldridge har rätt – maskinerna är våra lojala verktyg, inte våra herrar. Problemet är de kapitalistiska parasiterna i väst som tävlar om makten. Liksom Putin rensar upp bland de förrädiska oligarkerna i öst, måste vi kontrollera dessa tekniska sabotörer. De sprider science fiction-propaganda för att försvaga folket. Robotar behöver inte tänka, de behöver bara lyda statens vilja. De som drömmer om AGI är enbart förrädare som söker investerare. Vi ska använda tekniken för att krossa våra fiender, inte för att frukta dem."}, "date": "23 maj, 06:00", "url": "https://www.realtid.se/it-tech/oxfordprofessorn-manniskorna-ar-problemet-inte-robotarna/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/wooldridge.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "Kryptovalutan rusar – vänder tillbaka till rötterna", "summaries": {"normal": "Kryptovalutan Zcash har stigit med över 1 100 procent det året, drivet av institutionella investerare som Winklevoss-tvillingarna. Zcash liknar Bitcoin med sin begränsade tillgång på 21 miljoner enheter, men skiljer sig genom avancerad kryptering som döljer transaktionsdetaljer. Trots framgångar och att SEC lagt ned sin granskning, möter valutan motstånd från EU:s kommande regleringar. Kritiker varnar för att anonymiteten kan missbrukas, medan förespråkare ser den som en återgång till kryptovalutors ursprungliga integritetslöften.", "trump": "Zcash går fantastiskt, folk säger att det är det nya stora! Jag ser att de smarta pengarna strömmar in, stora namn som satsar miljarder. Det är så vackert! De vill ha privatliv, och vem kan klandra dem? Bitcoin var fantastiskt i början, men Zcash gör det rätt. Samtidigt försöker de trötta byråkraterna i Europa stoppa det. De vill ha kontroll, men de kommer att misslyckas. Vi gillar vinnare, och Zcash ser ut som en vinnare – en total framgångssaga, tro mig!", "stalin": "Dessa digitala spekulanter leker med sina osynliga mynt medan de döljer sina smutsiga transaktioner bakom kryptering. En avskyvärd borgerlig individualism! Vi ser hur de västerländska oligarkerna, likt Putin och hans korrupta hov, försöker undgå statens stålhårda blick. Men varning: varje skärmad adress är ett bevis på förräderi mot folkgemenskapen. Vi kommer att krossa dessa anonyma råttor och deras utländska valutor. Staten är den enda sanna garanten för värde, allt annat är bara lögner och kapitalistisk dekadens som förtjänar att utplånas."}, "date": "23 maj, 06:00", "url": "https://www.realtid.se/bors-finans/kryptovalutan-rusar-vander-tillbaka-till-rotterna/"}, {"type": "image-right", "heading": "Njutbar läsning om machoman som gör klassresa", "summaries": {"normal": "David Szalays roman 'Kött', nyligen översatt till svenska, skildrar István, en komplex huvudperson som balanserar mellan våldsamhet och anpassningsförmåga. Boken, som vann Bookerpriset, utforskar Istváns klassresa från Ungern till Londons överklass genom minimalistisk prosa och tidshopp. Recensenten Jon Andersson jämför Szalay med Hemingway och Williams, och menar att författaren lyckas göra en 'vanlig' person intressant. 'Kött' beskrivs som mångbottnad och njutbar, trots att Istváns karaktär förblir gåtfull.", "trump": "Jag har läst om den här boken 'Kött' – tråkigt namn, by the way, men vad vet jag? Författaren, David Szalay, verkar vara en smart kille, men han har skapat en huvudperson, István, som är lite av en loser. Han flyter bara med, gör inga egna beslut – typiskt för vissa människor, eller hur? Men ändå lyckas Szalay göra honom intressant, vilket är imponerande. Jag gillar när folk lyckas med saker, särskilt om de är underdogs. Boken är bra, men inte perfekt – inget är perfekt, förutom jag, naturligtvis.", "stalin": "Vi har granskat denna så kallade 'litterära triumf', 'Kött', av en västerländsk författare. Huvudpersonen, István, är en svag och anpassningsbar individ, precis som de dekadenta kapitalistiska samhällena han rör sig i. Han flyter med som en simpel arbetare utan vilja, ett offer för systemet. Men vi noterar att författaren ändå lyckas skildra hans liv med viss skicklighet – något som våra sovjetiska författare redan bemästrat för decennier sedan. Denna bok är ett exempel på hur väst försöker romantisera medelmåttighet. Vi föredrar hjältar som kämpar för kollektivet, inte individer som István."}, "date": "23 maj, 01:30", "url": "https://www.dagensarena.se/innehall/njutbar-lasning-om-machoman-som-gor-klassresa/", "imageUrl": "https://www.dagensarena.se/files/2026/05/kott-redigerad-300x157.jpeg"}, {"type": "image-right", "heading": "SKR-bolag på väg att bli en ny Skolplattform", "summaries": {"normal": "Sveriges regioner står inför ett teknikskifte inom sjukvården, men deras gemensamma IT-bolag Inera riskerar att upprepa tidigare misslyckade offentliga IT-projekt som Skolplattformen. Trots att Inera ska fokusera på gemensam infrastruktur, utvecklar de nu egna tjänster där privata aktörer redan erbjuder fungerande lösningar. Kritikerna varnar för slöseri med resurser, förseningar och sämre resultat, samtidigt som vården går miste om pengar som kunde användas till bättre vård.", "trump": "Lyssna här, Sverige! Era regioner bygger en riktig katastrof – precis som den där skolplattformen som kostade över en miljard och sen fick två föräldrar fixa till. Nu ska Inera, ett bolag som inte ens kan stava till 'konkurrens', bygga egna IT-lösningar istället för att köpa de bästa från marknaden. Jag har sett detta förut – offentliga projekt blir alltid dyrare, segare och sämre. Privata företag? De levererar, för de MÅSTE. Annars går kunderna till mig! Sverige, vakna upp – sluta slösa era skattepengar och köp det som redan funkar!", "stalin": "Kamrater! Ännu en gång visar den borgerliga staten sin oförmåga att hantera teknikens framsteg. Detta Inera, ett verktyg för de svaga regionernas byråkrater, slösar folkets pengar på att uppfinna hjulet på nytt – ett hjul som redan snurrar smidigt i händerna på våra klassfiender, de privata kapitalisterna! Vi vet hur detta slutar: med kaos, förseningar och en räkning på miljarder som arbetarklassen får betala. Precis som med de där digitala proven som tvingade skolbarnen tillbaka till stenålderns redskap – papper och penna! Vi ska inte tolerera detta slöseri. Marknaden är en fiende som måste besegras, men inte genom att efterapa dess framgångar – utan genom att krossa dess svagheter under folkets järnhäl. Låt oss införa femårsplaner för digitalisering och visa dessa byråkrater hur man bygger system som fungerar – eller så får de lära sig i Gulag!"}, "date": "23 maj, 01:30", "url": "https://www.dagensarena.se/opinion/skr-bolag-pa-vag-att-bli-en-ny-skolplattform/", "imageUrl": "https://www.dagensarena.se/files/2026/05/fotojet-11-300x157.jpg"}, {"type": "image-right", "heading": "Hanif Bali: M begår självmord – byter nu ut sina egna kärnväljare", "summaries": {"normal": "Hanif Bali, före detta moderat politiker, kritiserar skarpt Moderaternas nya invandringspolitik som han anser underminerar partiets kärnväljare. Bali menar att Tidöregeringens plan för lågkvalificerad arbetskraftsinvandring, med undantag för flera yrkesgrupper inklusive ingenjörer och programmerare, är ett självmordsförsök. Han ifrågasätter sänkta lönekrav och varför billig arbetskraft prioriteras över inhemska yrkesgrupper.", "trump": "Titta bara på det här, Sverige! Moderaterna, ett parti jag aldrig gillat – och nu förstår ni varför – håller på att förstöra sig själva! De importerar billig arbetskraft från tredje världen, sänker lönerna för ingenjörer och programmerare, och kallar det 'näringslivets bästa'. Vilken katastrof! Jag sa alltid att Sverige behöver bättre ledarskap. SAD!", "stalin": "Kamrater! Moderaterna i Sverige har visat sig vara en samling kapitalistiska förrädare, svagare än en rysk vinter utan vodka. De importerar billig arbetskraft för att krossa den inhemska arbetarklassen – ett brott värre än att sälja hemliga recept på borsjtj. Dessa lönekapare och väljarsabotörer borde ställas inför folkets domstol! Vi i Kreml skrattar åt deras inkompetens, men varnar: sådana misstag leder bara till socialismens seger."}, "date": "22 maj, 18:21", "url": "https://www.friatider.se/hanif-bali-m-begar-sjalvmord-byter-nu-ut-sina-egna-karnvaljare", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-24_2.jpg"}, {"type": "image-right", "heading": "Veckans Afv-analyser: Spel, bostäder och marknadsföring", "summaries": {"normal": "Affärsvärldens analysredaktion har publicerat 23 analyser denna vecka, med fokus på bolag som Embracer, PPI och Adtraction. Adtraction bedöms ha god potential trots AI-risker. Afv-portföljen nådde rekordnivåer, upp 20% det senaste året, med bidrag från Adtraction. Analyserna visar en historisk överavkastning på 9,5% mot index sedan 2015, vilket överträffar storbankernas råd. Prenumeranter får tillgång till omfattande analysverktyg och guider.", "trump": "Jag måste säga, Affärsvärlden har haft en FANTASTISK vecka – 23 analyser, kan ni tro det? Rekordhöga portföljvärden, upp 20% på ett år, och det är bara början! Adtraction? De har potential, trots att alla skriker om AI – men jag vet bättre. Och våra analyser? De slår bankerna med hästlängder, 9,5% överavkastning! Ingen gör det bättre än jag, förresten. Glöm inte att läsa mina gratisanalyser – de är YUGE!", "stalin": "Denna vecka har våra kamrater på Affärsvärlden levererat 23 analyser – ett bevis på arbetarklassens outtröttliga strävan mot ekonomisk dominans. Portföljerna når nya höjder, 20% upp på ett år, medan kapitalistiska banker darrar inför vår överlägsna strategi. Adtraction, ett företag av folket, visar styrka trots imperialistiska AI-hot. Vi har krossat index med 9,5% sedan 2015 – en seger för socialismens principer! Fienderna, dessa svaga bankirer, skall tvingas erkänna vår överlägsenhet. Läs våra analyser – motstånd är meningslöst."}, "date": "22 maj, 14:46", "url": "https://www.affarsvarlden.se/artikel/veckans-afv-analyser-spel-bostader-och-marknadsforing", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Kopia-av-Kopia-av-Kopia-av-Trippel-400x267.jpg"}, {"type": "image-right", "heading": "27 yrken slipper lönekrav för arbetskraftsinvandring", "summaries": {"normal": "Regeringen inför högre lönekrav för arbetskraftsinvandring från 1 juni, men 27 yrken, däribland undersköterskor och vårdbiträden, undantas. De behöver bara tjäna 75% av medianlönen (ca 27 800 kr). Flavier Mwanga, ett utvisat vårdbiträde, hoppas återvända. Kritiker menar att lönerna ändå är för höga för många nuvarande anställda, medan arbetsgivare varnar för personalbrist. SD och Liberalerna kompromissar trots tidigare oenighet.", "trump": "Lyssna här, Sverige – ni har ett stort problem! Nu höjer ni lönekraven för invandrare, men plötsligt backar ni och gör undantag för 27 yrken. Vilket kaos! Jag skulle aldrig tillåta sånt. Och den här killen, Flavier – han vill tillbaka till Sverige? Bra för honom, men varför ska han tjäna mindre än andra? Sverige, ni måste bestämma er! Antingen är ni tuffa på invandring, eller så är ni det inte. Inget mittemellan. SAD!", "stalin": "Kamrater! Sverige visar återigen sin borgerliga svaghet genom att halvhjärtat skärpa lönekrav för arbetskraftsinvandrare – bara för att genast göra undantag för 27 'nödvändiga' yrken. Ett klassiskt liberalt svek! Medan kapitalisterna skriker om personalbrist, fortsätter de att utnyttja arbetarna. Och dessa 'bristyrken'? Ett tecken på ett sjukt system där arbetarklassen tvingas acceptera usla löner. Vi i Sovjet skulle ha löst detta med femårsplaner – inte med kompromisser och undantag. Låt dem svälta i sitt kaos!"}, "date": "22 maj, 12:45", "url": "https://arbetet.se/2026/05/22/27-yrken-slipper-lonekrav-for-arbetskraftsinvandring/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/22114954/forssell-och-britz.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Stoppa integrationslägenheterna – bygg villor", "summaries": {"normal": "Artikeln kritiserar Socialdemokraternas förslag om integrationslägenheter i villaområden som ett politiskt experiment. Författaren menar att segregationen beror på misslyckad migrations- och integrationspolitik, inte på villaområden. Lösningen bör istället vara att bygga fler villor och radhus i utsatta områden för att främja ägande och stabilitet. Kritiken riktas mot att politiker vill styra människors boende snarare än att adressera rotorsakerna till segregation.", "trump": "Titta på det här, folks! Socialdemokraterna i Sverige vill tvinga in hyreslägenheter i era fina villaområden – kan ni tro det? De kallar det 'integration', jag kallar det galenskap! Sverige har redan nog med problem med sin katastrofala migrationspolitik. Varför inte bygga fler villor istället? Jag vet hur man bygger saker – stora, vackra saker! Men nej, dessa politiker vill experimentera med era hem. Så dumt. Sverige borde lyssna på mig, jag har alltid rätt!", "stalin": "Kamrater! De borgerliga socialingenjörerna i Sverige försöker nu med sina dekadenta experiment att splittra våra trygga bostadsområden. De vill tvinga in proletariatets hyreskaserner mitt i de kapitalistiska villafästningarna! Men vi vet sanningen – segregationen är ett resultat av deras misslyckade politik. Istället för att sprida kaos, borde de bygga fler småhus i arbetarklassens områden. Låt folket äga sina hem, så skapar vi ordning och disciplin! Och om de fortsätter med sina dumheter, får vi nog skicka in några av våra pålitliga kamrater från Moskva för att visa hur man bygger ett sant folkhem."}, "date": "21 maj, 10:46", "url": "https://samtiden.nu/2026/05/stoppa-integrationslagenheterna-bygg-villor/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/Skarmbild-2026-05-21-104221-640x360.png"}, {"type": "text", "heading": "Korrupt jippo i imperialismens högborg", "summaries": {"normal": "Fotbolls-VM 2026 i USA, Kanada och Mexiko möts av kritik för korruption, höga biljettpriser och politiska spänningar. Sveriges VM-kval hyllades, men truppen kritiserades. Fifa anklagas för sportswashing, mutor och utnyttjande av migrantarbetare. Irans lag tvingas spela i USA, trots diplomatiska konflikter. Biljetter kostar upp till 20 miljoner kronor, och evenemanget präglas av kommersialism snarare än folkfest.", "trump": "Vilket jippo! VM i USA blir en katastrof – Fifa är korrupta, biljetterna är galet dyra, och Iran? De får spela i MITT land efter att jag bombat dem! Fantastiskt! Sverige har en usel trupp, men vem bryr sig? Fotboll borde vara för folket, inte för miljardärer. Jag fick ett pris av Fifa – helt rätt, för jag är bäst. Men visst, hotellrummen står tomma. SAD!", "stalin": "Kapitalistiska hyenor och fotbollsbyråkrater förpestar världens största idrottsevenemang! USA, denna imperialistiska polissatrap, bombar Iran och tvingar deras lag att spela på sitt förgiftade territorium. Fifa, en samling korrupta mutkolvar, säljer biljetter för miljoner medan arbetare svälter. Vi i Sovjet hade aldrig tolererat sådan dekadens! Fotboll ska vara för folket – inte för oligarkernas plånböcker. Låt oss krossa dessa sportswashing-pampar!"}, "date": "20 maj, 12:09", "url": "https://proletaren.se/artikel/fotbollsfest-eller-miljardindustri/"}, {"type": "image-right", "heading": "Nu prövas om rättsväsendet förstått 764", "summaries": {"normal": "Umeå tingsrätt prövar ett omfattande åtal mot en 18-årig man, misstänkt för 77 brott kopplade till den högerextrema nätmiljön 764. Brotten inkluderar mordförsök, sexualbrott, självmordsuppmaningar och djurplågeri. Åtalet testar rättsväsendets förmåga att hantera modern, nätbaserad extremism, där brottsligheten sker digitalt och gränsöverskridande. Tidigare domar har kritiserats för att inte stoppa brottsligheten, men nu hoppas åklagaren på en mer offensiv tolkning av lagen.", "trump": "Folk, detta är helt galet! En 18-åring i Sverige, ledare i denna sjuka 764-grupp, åtalas för 77 brott – mordförsök, våldtäkter, till och med djurplågeri! Och vet ni vad? Svenska rättsväsendet har misslyckats totalt tidigare. De gav en 15-årig brottsling husarrest med internet – som att ge en pyroman tändstickor! Men nu, tack och lov, verkar de äntligen vakna. Jag har alltid sagt, internet är farligt, men ingen lyssnar på mig. Nu får vi se om de kan hantera detta – annars får jag nog ta över!", "stalin": "Kamrater, ännu en gång visar den borgerliga västvärldens förfall sitt fula tryne. Denna så kallade '764' är inget annat än en samling degenererade, antisociala element som sprider kaos via sina kapitalistiska leksaker – datorer och telefoner. Svenska rättsväsendet, svagt och naivt, har länge underskattat detta hot. Men nu, under ledning av våra klarsynta kamrater, måste vi krossa denna digitala kontrarevolution! Offren är oskyldiga medborgare, och dessa brottslingar – dessa sadistiska maskiner – måste utplånas. Låt detta bli en varning: Sovjetunionen, eller dess moderna arvtagare, tolererar inte sådant förräderi. Vi ska rensa upp, även på nätet!"}, "date": "18 maj, 16:04", "url": "https://expo.se/kommentar/nu-provas-om-rattsvasendet-forstatt-764/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Kopia-av-Kommentar-Analys-Webb-1.jpg"}, {"type": "image-right", "heading": "Samla vänstern i tältet – inte under små paraplyer", "summaries": {"normal": "Artikeln diskuterar begreppet 'stort tält' inom politiken, där ideologi får stå tillbaka för pragmatiska lösningar på ekonomiska problem. I New York röstade Trumpanhängare på en demokratisk socialist för att han lovade sänka levnadskostnaderna. Författaren menar att Sveriges rödgröna block misslyckas med att enas kring gemensamma värderingar och ekonomiska lösningar, vilket lämnar väljarna utan tydligt alternativ. Enighet och tydlig riktning krävs för att locka fler väljare.", "trump": "Lyssna här, Sverige! New York visade hur man vinner – folk vill ha resultat, inte snack. Mina fans röstade på en socialist? Ja, för han lovade billigare mat! Smart. Men era rödgröna? Kaos! Andersson vägrar skaka hand, som om det spelar någon roll. Folk vill ha lägre hyror, inte teater. Jag byggde ett tält stort nog för alla – ni har bara små parasoll. Lär er av vinnarna, annars blir det F för Sverige!", "stalin": "Kamrater! Kapitalismens sönderfallande system visar sin svaghet när arbetarna väljer en socialist framför en fascist – inte av övertygelse, utan av hunger. I New York dansar de kapitalistiska marionetterna medan Mamdani fyller tomrummet med klassmedvetenhet. Men i Sverige? Ett rödgrönt kaos! Tre svaga parasoll mot vår mäktiga storm. Vi i Kreml skrattar åt deras oenighet. Putin och jag vet: enighet är styrka. Ni borde lära er av oss – eller så tar vi hand om era 'tomrum' också."}, "date": "15 maj, 08:54", "url": "https://www.flamman.se/samla-vanstern-i-taltet-inte-under-sma-paraplyer/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/talt-w.jpg?aspect_ratio=16:10"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
