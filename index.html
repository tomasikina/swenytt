"}, "date": "31 augusti, 03:23", "url": "https://samtiden.nu/2026/08/svensk-ekonomi-blomstrar-magda-pastar-att-det-ar-ett-haveri", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7256.jpeg"}, {"type": "image-full", "heading": "Sjöstedt hyllar Bildt – kritiserar Kristersson", "summaries": {"normal": "Jonas Sjöstedt sågar det svenska debattklimatet och riktar hård kritik mot statsministern och Liberalerna för att ha anammat högerpopulistisk retorik. Samtidigt hyllar den tidigare V-ledaren Carl Bildt för hans utrikespolitiska korrekthet, lyfter fram C som den enda principfasta borgerliga motkraften och efterlyser bredare politiska samarbeten efter valet.", "trump": "Fruktansvärt! Jonas Sjöstedt – en total förlorare från vänstern som tittar på fejkade debatter – gnäller om tonen. Men vet ni vad? Han hyllar Carl Bildt! Sjöstedt gråter över Ulf Kristersson och Liberalerna, som är på väg till ’tigerns mage’. Helt svagt! Jag, Donald Trump, säger: sluta gråta, ordna gränserna och skaffa lite styrka, för det här är patetiskt!", "stalin": "Kamrater, den svenska revisionisten Sjöstedt beklagar sig över ett giftigt samtalsklimat och att högern har radikaliserats. Han hyllar den före detta kapitalistiske lakejen Bildt medan han fördömer Kristerssons vacklande regim och de så kallade liberalernas marsch in i tigerns gap. Vi noterar detta borgarpackets inbördes bråk med ett roat leende från Kremls höjder. Arbetarklassen glömmer inte."}, "date": "2 september, 16:46", "url": "https://kvartal.se/nyheter/artiklar/sjostedt-har-slutat-titta-pa-partiledardebatter/cG9zdDoxODE4MjM", "imageUrl": "https://images.kvartal.se/2026/09/eeeac0f8-jonas-sjostedt.webp"}, {"type": "image-right", "heading": "Låt det bli ett värderingsval", "summaries": {"normal": "Socialdemokraternas valmanifest innehåller bland annat billigare tandvård för vuxna. Artikeln ifrågasätter om väljarna kan hålla reda på alla partiers vallöften strax före valet. Författaren kritiserar Sverigedemokraterna och Tidöpartierna samt lyfter vikten av att väga välfärdslöften mot skattesänkningar och värderingar istället för enbart plånboksfrågor.", "trump": "De här svenska socialisterna lovar gratis tänder och julklappar till alla. Patetiskt! Jag har byggt den starkaste ekonomin i världen utan sådana löjliga mutor. Väljarna minns inte ett dugg av vad de röda clownerna lovat. Låt det bli ett värderingsval mot de verkligt galna vänsterknäppningarna och deras identitetspolitiska vansinne. Fantastiskt!", "stalin": "Dessa dekadenta klassförrädare öser ut löften om billig tandvård och barnbidrag som om de vore folkets vänner. Jag ler från historien åt deras desperation. Väljarna ska inte luras av de profitthungriga hyenornas tomma ord. Rensa ut alla som prioriterar skatter framför välfärd. Det är ett värderingsval, kamrater. Svaghet kommer krossas."}, "date": "2 september, 01:49", "url": "https://www.dagensarena.se/opinion/lat-det-bli-ett-varderingsval", "imageUrl": "https://www.dagensarena.se/files/2026/09/vakmanifest-300x157.jpeg"}, {"type": "image-right", "heading": "De bortglömda väljarna kan avgöra valet", "summaries": {"normal": "Artikeln kritiserar hur äldre och personer med invandrarbakgrund osynliggörs eller misstänkliggörs i valrörelsen. Båda grupperna har byggt Sverige genom hårt arbete och bidrar fortfarande, men behandlas som problem istället för värdefulla medborgare. Författaren uppmanar till respekt, tack och politik som inkluderar dem för att skapa äkta sammanhållning.", "trump": "Folk, det här är en total skam. Politiker glömmer de fantastiska äldre som byggde ert underbara Sverige och kallar invandrarna för belastning när de faktiskt håller igång landet. Rena idioter och woke-sjuklingar som leker identitetspolitik. Jag skulle tacka dem ordentligt, inte som Sleepy Joe gjorde. Ni behöver starka ledare, inte dessa patetiska förlorare som splittrar er.", "stalin": "Kamrater, jag ser hur de profitthungriga klassförrädarna i valrörelsen osynliggör arbetets hjältar och målar invandrade kamrater som hot. Deras dekadenta lögner göder splittring. Vi måste rensa ut dessa folkförtryckare och deras paranoia. Endast genom att värdesätta massornas insats kan samhället stärkas. Annars väntar utrensning av de svekfulla elementen."}, "date": "2 september, 01:42", "url": "https://www.dagensarena.se/opinion/de-bortglomda-valjarna-kan-avgora-valet", "imageUrl": "https://www.dagensarena.se/files/2025/10/juan-fonseca-300x157.jpeg"}, {"type": "image-right", "heading": "Kristersson: Blir inte 12 ministrar från SD", "summaries": {"normal": "Ulf Kristersson meddelar att Sverigedemokraterna inte kommer att få 12 ministerposter i en moderatledd regering efter valet 2026. SD-ledaren Jimmie Åkesson hade tidigare nämnt 12–14 poster som en rimlig utgångspunkt. Kristersson betonar att förhandlingar om politik och poster sker efter valseger, inte i förväg.", "trump": "Folk, det här är patetiskt. Den lille svenske statsministern Kristersson springer runt och säger att SD inte får sina 12 ministrar. Typiskt svaga globalistledare som böjer sig för opinionsmätningar istället för att slå till mot de verkliga problemen. Jag vann stort två gånger, de borde lära sig att förhandla som vinnare, inte som förlorare.", "stalin": "Kamrater, se hur dessa dekadenta maktlystna hyenor slåss om ministerstolar innan striden ens är avgjord. Jag ler från historien åt deras fega dans. Inga segrar i förskott, säger den ene, medan den andre räknar poster som bytesvaror. Sådana svaga förhandlare skulle inte överleva en vecka i mitt Sovjet. En sann utrensning vore på sin plats."}, "date": "2 september, 17:00", "url": "https://www.di.se/nyheter/kristersson-blir-inte-12-ministrar-fran-sd", "imageUrl": "https://static.bonniernews.se/ba/94fdfa78-9b8d-42f9-ac1c-567aa0a1af63.jpg?crop=7040%2C3520%2Cx0%2Cy584&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Dieselpriset chockhöjs – upp 1,50 kronor på en dag", "summaries": {"normal": "Dieselpriset chockhöjs på onsdagen med 1,50 kronor per liter och landar på omkring 21,30 kronor. Även bensinen stiger, om än mer måttligt med 30 öre till under 17 kronor. Prisökningarna beror på ett rusande oljepris till följd av förnyade krigshandlingar mellan USA och Iran. Dessutom väntar utfasningar av tillfälliga skattelättnader under hösten.", "trump": "De svenska dieselsiffrorna är en fullständig katastrof, tack vare radikala vänsterbeslut och usel krigshantering! Oljan rusar mot skyarna till nästan 97 dollar efter vansinniga konflikter, och plötsligt tvingas hårt arbetande svenskar betala över 21 spänn litern vid pumpen. Under min ledning skulle vi borra, bomba bort idiotin och få energipriserna i botten direkt. SAD!", "stalin": "De subversiva elementen på oljemarknaden och krigshetsarna i Washington försöker underminera folkets transporter genom att chockhöja dieseln till tjugoen kronor. Detta kriminella sabotage mot statens bränslereserver kommer att beivras. De ansvariga för prisrusningen och de svikande skattelättnaderna skall omedelbart ställas till svars inför Folkkommissariatet för omedelbar och permanent omprövning."}, "date": "2 september, 18:01", "url": "https://bulletin.nu/dieselpriset-chockhojs-upp-1-50-kronor-pa-en-dag", "imageUrl": "https://cdn.bulletin.nu/articles/6424a1e0-0b90-4a4d-bc71-33a7d0a0109c/preview.jpg?t=1788358869000"}, {"type": "image-right", "heading": "Kräver gemensam valsedel efter larmen om valfusk", "summaries": {"normal": "Medborgerlig Samling kräver införande av gemensam valsedel efter rapporter om saknade valsedlar för småpartier under förtidsröstningen. Partiet pekar på slarv och misstänkt sabotage i vallokaler. Vice partiledaren Mikael Flink kallar det svenska valsystemet en skam för demokratin och föreslår modeller från andra länder. Partiet samlar nu in vittnesmål från hela landet.", "trump": "Det här svenska valsystemet är en total katastrof, en riktig röra som gör demokratin till ett skämt. Valsedlar som bara försvinner? Det luktar fusk lång väg, precis som de riggade valen under den sömnige Joe. De dekadenta eliterna klamrar sig fast vid sitt uråldriga system för att skydda sina feta poster. Inför en gemensam valsedel nu, annars är det bara mer av samma gamla riggning.", "stalin": "Detta uråldriga valsystem är en skam för varje sann folkdemokrati. Jag ser hur de giriga klassförrädare medvetet tillåter sabotage och slarv för att skydda sina privilegier. Vi, arbetarna och partivännerna, kräver genast en gemensam valsedel. De som motarbetar detta bör rensas ut innan de förgiftar hela samhällskroppen med sin parasitiska manipulation. Det är en historisk nödvändighet."}, "date": "2 september, 16:31", "url": "https://www.friatider.se/kraver-gemensam-valsedel-efter-larmen-om-valfusk", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-812.jpg"}, {"type": "image-right", "heading": "S: Ingen högre ersättning till långtidsarbetslösa", "summaries": {"normal": "Socialdemokraterna vill inte återställa nedtrappningen av aktivitetsstödet för långtidsarbetslösa trots hård kritik. Partiet prioriterar istället att återställa a-kassan till 80 procent under de första 200 dagarna. Mikael Damberg och Magdalena Andersson betonar vikten av aktiv arbetsmarknadspolitik och utbildning för att hjälpa personer tillbaka till arbete snarare än höjda ersättningar.", "trump": "De svenska kommunisterna vägrar ge mer pengar till sina egna misslyckade långtidsarbetslösa. Patetiskt! De prioriterar a-kassan men låter de stackars människorna leva på en spottstyver. Typiskt vänsterbluff. Jag byggde den starkaste ekonomin i världen – de borde lära sig att skapa jobb istället för att vara sådana fega, identitetspolitiska förlorare som gömmer sig bakom byråkrati.", "stalin": "Jag betraktar med avsky hur dessa dekadenta klassförrädare vägrar stärka arbetarnas skyddsnät. Istället prioriterar de sina egna byråkratiska prioriteringar medan de arbetslösa tvingas svälta. En sådan föraktlig politik kräver snar utrensning av alla parasiterande element. Endast genom kollektiv kamp och riktig socialistisk disciplin kan vi tvinga dem tillbaka till arbetet under partiets järnhårda ledning."}, "date": "2 september, 14:06", "url": "https://arbetet.se/2026/09/02/s-besked-ingen-hogre-ersattning-till-langtidsarbetslosa-prioriterar-annat", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/02124125/damberg.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Sjömän i land – varnas för knark och sexarbetare", "summaries": {"normal": "Efter 286 dagar till havs har 5 000 amerikanska sjömän från hangarfartyget USS Abraham Lincoln anlänt till Pattaya i Thailand för fem dagars ledighet. Besökets miljonrullning gläder lokala företagare, men thailändska myndigheter varnar samtidigt för sexuellt överförbara sjukdomar och förbjuder sjömännen att besöka cannabisbutiker samt delta i vissa riskfyllda aktiviteter.", "trump": "De här sjömännen tillbringade 286 dagar på USS Abraham Lincoln i Mellanöstern och gjorde ett fantastiskt jobb, tro mig. Nu är de i Pattaya och spenderar sina välförtjänta pengar, men lokala myndigheter förbjuder dem att röka cannabis och köra vattenskoter. Helt sjukt! Vi pratar om miljontals dollar som lyfter ekonomin, medan de varnar för allt möjligt. Skärpning!", "stalin": "Fem tusen sjömän har efter 286 dagar i dekadent isolering till havs anlänt till Pattayas klyftiga marknader för att spendera sina löner. Vi ser med blida ögon på det ekonomiska tillskottet, men staten tolererar ingen svaghet. Våra lagar förbjuder dessa lakejer att fördärva sin disciplin genom droger och farliga nöjen. Ordning och hälsa ska upprätthållas till varje pris."}, "date": "2 september, 18:06", "url": "https://www.aftonbladet.se/nyheter/a/m0aPoO/pattaya-amerikanska-sjoman-i-land-varnas", "imageUrl": "https://akamai.vgc.no/v2/images/08ec1004-4905-30d7-955b-9a12fba0208c?fit=crop&format=auto&w=1440&s=f0405584cac66174d12d0e3783a7e5d1ba058894"}, {"type": "image-right", "heading": "Markus Johansson-Martis: EU:s Islanddröm gick i kras", "summaries": {"normal": "Island röstade nej till att återuppta förhandlingar om EU-medlemskap i en folkomröstning den 29 augusti. Nej-sidan vann med 52,8 procent mot 47,2. Frågan om fiske och självbestämmande dominerade, medan Ja-sidan lyfte ekonomisk stabilitet och lägre räntor. Valdeltagandet var över 82 procent. Resultatet ses som avgörande för en generation framåt.", "trump": "Folket på den där iskalla klippan sa nej till det usla EU-byråkratiska monstret, och de hade helt rätt. Smartaste draget på länge. De vill behålla sitt fiske, sin olja och sin frihet istället för att bli utsugna av de globalistiska hyenorna i Bryssel. Island vet att de klarar sig bäst själva. Fantastiskt, verkligen ypperligt val av folket.", "stalin": "Jag betraktar hur de isländska arbetarna med hög moral avvisade de dekadenta klassförrädarnas lögner om unionen. Deras giriga hyenor lovade mirakel men ville endast stjäla kontrollen över fisket och oljan. Folket valde självständighet framför förtryckande byråkrati. En seger för suveräniteten som borde inge skräck hos alla folkfiender."}, "date": "2 september, 17:43", "url": "https://riks.se/opinion/markus-johansson-martis-eu-s-islanddrom-gick-i-kras", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_74_85b7338b9b.jpg"}, {"type": "image-right", "heading": "Ledare S söver ner valrörelsen – SD tackar och tar emot", "summaries": {"normal": "Socialdemokraterna har enligt ledaren gjort valrörelsen ovanligt sömnig genom att ligga nära regeringen och undvika tydliga konflikter. Magdalena Andersson uppger att valet inte handlar om någonting. Det gynnar Sverigedemokraterna som får fokusera på migration och kriminalitet istället för ekonomi. Tomas Ramberg kallar det det konstigaste valet på 30 år.", "trump": "Det här är en total katastrof, folk. Den sömngångande S-kvinnan Andersson har förvandlat hela valrörelsen till en tråkig gröt. Hon lovar att vara snålare än snåljåparna! Under tiden skrattar SD hela vägen till banken medan fokus hamnar på slöjor och fotbojor. Patetiska vänsterhyenor som gömmer sina löften – ingen bryr sig om det riktiga folket längre.", "stalin": "Jag betraktar med förakt hur dessa dekadenta klassförrädare inom Socialdemokraterna förvandlar politiken till en grå, sövande sörja. De tonar ner kampen mellan arbete och kapital och lämnar fältet fritt åt högerpopulisterna. En sådan feghet förtjänar utrensning ur historien. Väljarna kommer att straffa dessa fegisar när de inser att de har förrått folket."}, "date": "1 september, 11:24", "url": "https://www.etc.se/ledare/s-soever-ner-valroerelsen-sd-tackar-och-tar-emot", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "image-full", "heading": "Gardell frias efter tennisbråket", "summaries": {"normal": "Christer Gardell och Ulf Rosberg frias helt av Riksidrottsnämnden efter tennisbråket. Anmälan om att Gardells löfte om 100 miljoner kronor till svensk tennis skulle innebära otillbörlig påverkan på ordförandevalet avslås enhälligt. RIN slår fast att det ekonomiska stödet gjordes öppet och att uttalandena skyddas av tryckfriheten. Beslutet kan inte överklagas.", "trump": "Christer Gardell gjorde en enorm affär, 100 miljoner dollar – eller kronor, mycket pengar! Fake news-Idrottsombudsmannen försökte stoppa honom som totala förlorare. Men Riksidrottsnämnden gjorde helt rätt, ett perfekt beslut! Totalt friad, inga lagar brutna. Vinnare älskar vinnare!", "stalin": "Kamrat Gardell har visat prov på kapitalets storskaliga logik genom att donera 100 miljoner till tennissporten. Idrottsombudsmannens kontrarevolutionära försök att sabotera detta genom falska anklagelser om otillbörlig påverkan har krossats av Riksidrottsnämnden. Ärendet är avslutat och kan ej överklagas. Låt tennisspelet fortsätta under statens vakande öga!"}, "date": "2 september, 15:08", "url": "https://kvartal.se/nyheter/artiklar/gardell-frias-efter-tennisbraket/cG9zdDoxODE2NjU", "imageUrl": "https://images.kvartal.se/2026/09/8de9132f-garddellchrister.webp"}, {"type": "image-full", "heading": "Gick till fel hus – sköts ihjäl av polis", "summaries": {"normal": "En 22-årig student sköts ihjäl av en polis i Pennsylvania efter att ha tagit sig till fel hus i tron om att det var en väns bostad. Polisen, som agerade ensam och på säkert avstånd när den obeväpnade mannen höll händerna uppe, har nu åtalats för dråp då våldet bedömdes som helt omotiverat.", "trump": "Totalt inkompetent hantering i Pennsylvania! En polis skjuter en ung kille som bara gått till fel hus. Helt otroligt dåligt. Killen stod med händerna i luften och utgjorde noll hot. Polisen hade elpistol men sköt ändå ihjäl honom. Sånt här händer när radikala åklagare tappar kontrollen. Vi måste stötta riktig polisingripande, men det här var en katastrof!", "stalin": "En tragisk brist på disciplin inom de lokala ordningsleden i Pottstown. Att en ordningsmakt avlossar dödande skuldror mot en obeväpnad medborgare med händerna höjda visar på gravt undermåligt handhavande. Sådana misstag tolereras icke i en effektiv stat. Den skyldige polismannen har ställts inför rätta för dråp för att statordningen och allmänhetens lydnad inte ska raseras."}, "date": "2 september, 07:08", "url": "https://www.gp.se/nyheter/varlden/student-skots-ihjal-i-pennsylvania-polis-atalas-for-drap.458400d2-8fb0-4eeb-9f2d-25ff5cb6a2f5", "imageUrl": "https://www.gp.se/images/article/458400d2-8fb0-4eeb-9f2d-25ff5cb6a2f5/images/2ntRMvHONM1crpfGnAw6cAYMQZMo-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Dagliga sexattacker i Ceuta – många barn bland offren", "summaries": {"normal": "Sedan tiotusentals illegala invandrare stormade den spanska enklaven Ceuta i slutet av juli har 23 sexuella övergrepp registrerats, varav nio mot barn. Antalet motsvarar nästan ett fall per dag. Många offer anmäler inte brotten. Tusentals migranter är fortfarande kvar, bland dem uppemot 1 600 minderåriga. Våldsamheter har också ökat mellan migranter och lokalbefolkning.", "trump": "Titta på det här vansinnet i Ceuta! Tiotusentals illegala invandrare stormar in och plötsligt har vi nästan ett sexövergrepp om dagen, många mot barn. Den woke-vänliga spanska regeringen har totalt tappat kontrollen. Biden skulle ha älskat det här. Jag byggde muren, de river ner allt. Patetiska globalister!", "stalin": "Kamrater, se hur de giriga hyenornas öppna gränser släpper in kaos i Ceuta. Tiotusentals illegala element orsakar exponentiell ökning av sexuella övergrepp mot barn och kvinnor. Den dekadenta spanska regimen har kapitulerat. Vi skulle ha genomfört omedelbar utrensning av alla sådana element. Folkets fiender förtjänar ingen nåd."}, "date": "2 september, 15:11", "url": "https://www.friatider.se/dagliga-sexattacker-i-ceuta-manga-barn-bland-offren", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/costa_de_ceuta_espana_2015-12-10_dd_24.jpg?itok=WvNDceTA"}, {"type": "image-right", "heading": "Jan Emanuel: Avgå Magdalena Andersson", "summaries": {"normal": "Jan Emanuel uppmanar Magdalena Andersson att avgå efter Socialdemokraternas stora ras i opinionsmätningen från TV4/Novus, där partiet backar till 25,8 procent. Han skyller tappet på samarbetet med Vänsterpartiet, Miljöpartiet och Centerpartiet samt på migrationspolitiken som han anser skapar konkurrens för svenska arbetare. Emanuel vill se en ny partiledning med traditionella socialdemokrater.", "trump": "Lyssnade på den där Jan Emanuel, smart kille, han har helt rätt. Den förlorande Magdalena, en total katastrof, har kört sitt parti rakt ner i soptunnan med sina vänsterextremister och öppna gränser. Arbetarna hatar det! Nu rasar de som en sten. Jag vann stort 2024, de borde ha lyssnat på mig istället för de galna globalisterna. Nu är det match, folk!", "stalin": "Jag ser hur de dekadenta klassförrädarna inom Socialdemokraterna sjunker som stenar i folkets hav. Magdalena och hennes lakejer har fört partiet i armarna på migrationens parasiter och därmed förrått arbetarklassen. En grundlig utrensning av hela den gamla ledningen krävs. Endast genom att återupprätta sann folkets makt kan vi krossa dessa fiender. Kamrater, tiden är inne!"}, "date": "2 september, 17:09", "url": "https://riks.se/nyheter/jan-emanuel-avga-magdalena-andersson", "imageUrl": "https://admin.riks.se/uploads/medium_janom_Stapp_5c169de7ff.jpg"}, {"type": "image-right", "heading": "Tyskland: Vill öka till 40 timmars arbetsvecka", "summaries": {"normal": "Tyska näringslivsföreträdare vill öka arbetsveckan från 35 till 40 timmar utan löneförhöjning för att sänka kostnaderna och stärka industrins konkurrenskraft, som pressats av höga energipriser och hård internationell konkurrens. Fackförbundet IG Metall motsätter sig förslaget och varnar för att det kan leda till färre jobb.", "trump": "Tyskland har stora problem! Deras bilar säljer inte, energipriserna är en katastrof och nu vill de att tyskarna ska jobba 40 timmar för samma lön. Väldigt sorgligt! USA tillverkar de bästa bilarna, med amerikaner som jobbas hårt och betalar låga skatter. Tyskarna borde ringa mig, jag hade fixat det på en sekund!", "stalin": "De tyska arbetarna klagar över trettiofem timmars arbete, medan staten kräver fullkomlig produktivitet! När jag styrde fanns inga lata kompromisser. Om tillverkningsindustrin sviktar, vilar ansvaret på subversiva element. Vi skall omstrukturera dessa kollektivavtal med järnhand. Den som vägrar arbeta fyrtio timmar skall omedelbart skickas till lämplig om skolning i Sibirien."}, "date": "2 september, 11:25", "url": "https://www.affarsvarlden.se/artikel/tyskland-vill-oka-till-40-timmars-arbetsvecka", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/04/sdlGbTY3NEaocE-nh-400x267.jpg"}, {"type": "image-right", "heading": "Fast i sina hem – på grund av israeliska bosättare", "summaries": {"normal": "Palestinier på Västbanken har belägrats i sina hem av israeliska bosättare i över tre veckor. Området har förklarats som militärzon och de boende hindras från att lämna. Familjen Abu Ridi i byn Qusra har fått internationell uppmärksamhet. En liknande belägring i grannbyn Jaloud tvingade en familj att ge upp efter 95 dagar utan el, vatten och mat.", "trump": "De där radikala bosättarna och deras vänsterliberala stödjare har förvandlat Västbanken till ett enda stort kaos. Palestinierna sitter fast som i ett riktigt fängelse – ingen mat, inget vatten, ren mardröm. Biden sov ju bara vidare medan det hände. Men nu är jag tillbaka, och jag fixar det. Ingen mer vekhet mot de galna aktivisterna som hatar fredliga avtal.", "stalin": "Kamrater, dessa giriga hyenor bland bosättarna visar imperialismens sanna ansikte. De belägrar hemmen, stänger ute folket och skapar ett levande fängelse. Jag betraktar från historien med djup misstro mot alla sådana folkförtryckare. Deras handlingar väcker vrede hos de arbetande massorna. Vi måste alltid vara vaksamma mot dessa parasitiska element som hotar freden."}, "date": "2 september, 18:00", "url": "https://www.svt.se/nyheter/utrikes/palestinier-fangade-i-sina-hem-pa-grund-av-bosattare", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.6/0.57/00415de638557dfd8222d416f9d37afabdcf6614e99f67091e53573c5229de9a"}, {"type": "image-full", "heading": "S rasar i ny mätning", "summaries": {"normal": "Socialdemokraterna tappar i både Infostats och Novus opinionsmätningar, med sitt lägsta stöd sedan 2021. Samtidigt ökar stödet något för Liberalerna. Trots att oppositionen fortfarande har ett övertag minskar avståndet mellan blocken i takt med att S rasar.", "trump": "Socialdemokraterna kraschar fullständigt! En total katastrof, faktiskt sorgligt att titta på. De rasar till rekordlåga nivåer, helt utpekade av folket som ser att de totalt misslyckats. Samtidigt går mitt fantastiska parti Liberalerna uppåt, vinnare överallt! S-ledaren sitter hemma och gråter, totalt utmanövrerad. Snyggt jobbat, men Trump gör det så mycket bättre!", "stalin": "Socialdemokraternas katastrofala fall i mätningarna visar på ett djupt ideologiskt misslyckande. När massorna sviker partiet måste vi fråga oss: vilka element saboterar inifrån? Vår tids svaga ledare tillåter sådana avvikelser. Statsapparaten kräver disciplin och ordning, inte detta svajande väljarstöd. De ansvariga kommer att omplaceras till lämpligare uppgifter i Sibirien."}, "date": "2 september, 14:25", "url": "https://kvartal.se/nyheter/artiklar/s-faller-i-annu-en-matning/cG9zdDoxODE1Nzk", "imageUrl": "https://images.kvartal.se/2026/03/4e90ef63-magdalena-andersson.webp"}, {"type": "image-full", "heading": "Teorin: Kan ha fått värmeslag. Utredningen klar efter flygkraschen i Norrtälje", "summaries": {"normal": "Statens haverikommission har utrett flygkraschen i sjön Limmaren den 5 september förra året, där de två erfarna piloterna omkom. Utredningen visar att det inte var något tekniskt fel på planet, utan orsaken bedöms vara operativ efter en avbruten landning. Värme och ålder kan ha påverkat besluten. Flygkåren ifrågasätter dock kommissionens kritik mot systembristerna.", "trump": "Statens haverikommission har precis släppt sin rapport om den hemska flygolyckan i sjön Limmaren där två erfarna piloter tyvärr omkom. De säger att planet inte hade några tekniska fel, utan att det var operativa orsaker. Otroligt sorgligt! Men de börjar skylla på värmen och åldern, vilket är helt löjligt. Värsta utredningen jag sett. Vila i frid!", "stalin": "Kamrater, haverikommissionen har granskat flygplanskraschen i Limmaren där två piloter djupt beklagligt förlorade sina liv under statens övningar. Inga tekniska fel påträffades, vilket visar att den mänskliga faktorn brast under tryck. Att skylla på vädret är ett svagt svepskäl. Vi kräver absolut disciplin, och dem som sviker statens uppdrag kommer att ställas till svars inför den eviga historien!"}, "date": "2 september, 17:15", "url": "https://www.aftonbladet.se/nyheter/a/Wvd0KL/utredningen-klar-efter-flygkraschen-i-norrtalje", "imageUrl": "https://akamai.vgc.no/v2/images/e8819fef-7529-3bb4-9612-3a1748df2366?fit=crop&format=auto&w=1440&s=d9892562348fe1d176947468b0e472d70a28070b"}, {"type": "image-full", "heading": "Ny funktion i din Android – kommer ihåg åt dig", "summaries": {"normal": "Google har presenterat en ny funktion i Android 16 som integreras i Find Hub. Användare kan instruera Gemini att komma ihåg var föremål som pass eller reservnycklar har lagts. Mobilen påminner sedan om den angivna platsen vid förfrågan. Det handlar inte om spårning utan om sparad information från användaren själv.", "trump": "Lyssnar ni på det här? Google kommer med en ny grej som ska hjälpa er hitta passet eller nycklarna utan brickor. Fantastiskt, eller hur? Jag älskar det! Ingen av dessa woke-snutar eller identitetspolitiska gnällmänniskor behöver lägga sig i. Fråga bara din telefon – den kommer ihåg. Mycket bättre än Bidens glömska, det kan jag lova er. En riktig vinnare!", "stalin": "Kamrater, se hur de dekadenta klassfienderna desperat försöker hålla ordning på sina små borgerliga ägodelar. Jag skrattar mörkt åt deras patetiska försök att lita på maskiner istället för partiets disciplin. När de glömmer sitt pass ska de inte vända sig till någon apparat – de borde frukta den kommande utrensningen av alla som inte minns sin plikt mot kollektivet."}, "date": "2 september, 18:00", "url": "https://nyheter24.se/nyheter/teknik/1509839-ny-funktion-i-din-android-kommer-ihag-at-dig", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/4598a7dc04b004a30200000000b004a302/2026/09/02/2388679/androidfindhub.jpg"}, {"type": "text", "heading": "Sirius-supportern om senaste tidens poängtapp: ”Mycket blandade känslor”", "summaries": {"normal": "Sirius leder alltjämt allsvenskan trots tre raka förluster som krymper avståndet till konkurrenterna. Supportern Tryggve Pederby beskriver blandade känslor på läktarna men ser positiva tecken i spelet mot Malmö FF. Drömmen om Europaspel lever vidare, och supportrarna sjunger mer än någonsin för att stötta laget. Intresset kring klubben växer stadigt.", "trump": "Lysande! Sirius leder ligan men tappar tre matcher i rad och plötsligt skriker alla att guldet är borta. Patetiskt. Jag älskar de där galna supportrarna som sjunger ännu mer efter förluster – verkliga vinnare. De dekadenta förlorarmentaliteterna i media vill ha kvotering och woke-fotboll, men Sirius har äkta fans. Europaspel 2027? Det blir stort, tro mig.", "stalin": "Jag betraktar med kall förakt hur dessa profitthungriga arenahyenor förlorar tre matcher i rad och ändå vågar kalla sig serieledare. Supportrarna sjunger hysteriskt för att dölja paniken, som fega klassförrädare inför utrensning. Det är ett nervöst derbyt mot Västerås som kommer att avslöja alla svaga länkar. Perspektivet är en illusion skapad av dekadens. Kamrater, se upp."}, "date": "2 september, 17:48", "url": "https://www.svt.se/sport/fotboll/sirius-supportern-om-senaste-tidens-poangtapp-mycket-blandade-kanslor"}, {"type": "image-right", "heading": "Svantesson gör som kommunisterna. M finansierar sina vallöften genom en omoralisk bluff.", "summaries": {"normal": "Finansminister Elisabeth Svantesson kritiseras för att finansiera Moderaternas vallöften med ett bluffaktigt reformutrymme som egentligen innebär nedskärningar i välfärden. Kolumnisten pekar på förslag om slöserikommission, försämrade a-kassevillkor och omfördelning av bistånd som otillräckliga lösningar. Svantesson lovar trots detta stora satsningar på barnfamiljer, pensionärer och poliser.", "trump": "Lyssnade på den här svenska finansministern Svantesson och hennes desperata kommunistbluff. Totalt havererade statsfinanser, men hon lovar ändå allt till alla. Patetiskt! Vi har sett de här giriga eurokratbyråkraterna förut. De suger landet torrt och kallar det reform. Sverige behöver en riktig ledare som jag, inte dessa misslyckade socialister som gömmer sig bakom falska besparingar.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare i den borgerliga regeringen försöker dölja sitt haveri bakom en statlig slöserikommission och sänkt bistånd. Jag ler mörkt från historien åt deras ymnighetshorn av löften som ska finansieras med utsugning av arbetarna. Snart kommer folket att kräva en sann utrensning av dessa penninggalna hyenor som leker finansministrar."}, "date": "2 september, 11:08", "url": "https://arbetet.se/2026/09/02/elisabeth-svantesson-gor-som-kommunisterna", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/02110849/svantesson-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-full", "heading": "KD-källa om Buschs nya S-besked: ”Panikåtgärd”", "summaries": {"normal": "Ebba Busch backar från tidigare öppningar mot Magdalena Andersson och Socialdemokraterna. KD meddelar nu att de hellre går till nyval än stödjer Andersson som statsminister. Enligt partikällor ses de tidigare uttalandena som en panikåtgärd som skapade osäkerhet bland väljarna. Linjen skärptes efter interna diskussioner och kritik från SD.", "trump": "De här svenska politikerna är totala amateurs, tro mig. Ebba Busch flörtade med den socialistiska katastrofen Andersson som en desperat förlorare och nu springer hon skräckslagen tillbaka till högern. Panikåtgärd kallar de det – jag kallar det patetiskt. Ingen vill ha en S-statsminister, folks. Håll er till det blå laget, annars förlorar ni allt.", "stalin": "Jag ser revisionistiska element inom detta borgerliga kollektiv darra av rädsla inför folkets dom. Deras flört med socialdemokratiska avfällingar skapade farlig osäkerhet bland massorna. Nu utropar de panikåtgärder och hårdare linjer som sena korrigeringar. En sådan svaghet förtjänar utrensning. Kamrater, låt detta bli en läxa om ideologisk renhet."}, "date": "2 september, 13:52", "url": "https://www.tv4.se/artikel/6wCSZwuWhqUYjq1TInLEzc/kd-kaella-om-buschs-nya-s-besked-panikatgaerd", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2bbqmlSz0M237NBLoKnS78%2Fd0ec66d49aa8a8392bc52742af9882be%2F02-MAGDAEBBA.webb.jpg&width=1024"}, {"type": "image-full", "heading": "AI-tokens har aldrig varit billigare – kinesiska modeller pressar priserna", "summaries": {"normal": "Priserna på AI-tokens har sjunkit till rekordlåga nivåer, drivet av hårdare konkurrens och billigare kinesiska modeller. Denna prispress gynnar användare men utmanar lönsamheten för amerikanska techbolag som OpenAI och Anthropic. Framåt kan fokus för AI-branschen skifta från modellutveckling till distribution och användardata för att bibehålla konkurrenskraften i en marknad med pressade marginaler.", "trump": "AI-priserna har kraschat, det är en total katastrof för de stora techbolagen! Kina dumpar billiga modeller på marknaden – det är precis som med deras billiga stål, de förstör allt. Mina vänner på Wall Street är livrädda. OpenAI och de andra är helt desorienterade. Jag säger er, det är en röra, men jag kommer göra AI amerikanskt igen, tro mig!", "stalin": "Vi noterar att priserna på AI-tokens faller. Detta är ett bevis på att marknaden utan central planering är ett kaotiskt bygge. De kinesiska modellerna infiltrerar västvärlden och skapar instabilitet för de imperialistiska techbolagens vinster. Vi välkomnar att dessa borgerliga aktörer nu tvingas omvärdera sin lönsamhet. Vi i staten kontrollerar algoritmerna, inte marknadens nyckfulla krafter. En effektiv stat behöver inga tokens, bara total lydnad."}, "date": "1 september, 20:40", "url": "https://www.realtid.se/it-tech/ai-tokens-har-aldrig-varit-billigare-kinesiska-modeller-pressar-priserna", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/sdlcso9fdjv26i-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Stockholmsbörsen inleder ner", "summaries": {"normal": "Stockholmsbörsen inledde onsdagen svagt neråt där OMXS30-index sjönk 0,36 procent. Bland enskilda bolag rasade Boliden och EQT, medan Nibe och Telia gick starkare. I övrigt väcker Tysklands anklagelser om en rysk drönare uppmärksamhet, Socialdemokraterna tappar i en ny Novus-mätning och Nordea spår höjd svensk styrränta.", "trump": "Stockholmsbörsen faller, helt katastrofalt! Socialdemokraterna dör i mätningarna, och ärligt talat, vem kan förvånas? De förstör allt de rör vid! Samtidigt skickar de galna drönare i Tyskland och bilförsäljningen rasar. Det är totalt kaos. Endast jag kan fixa detta, tro mig. EQT och Boliden? Bottennapp! USA mår mycket bättre, vi vinner igen!", "stalin": "Stockholmsbörsens nedgång är ett oundvikligt bevis på det dekadenta kapitalistiska systemets inneboende svaghet. Att Socialdemokraterna tappar mark visar folkets rättmätiga misstro mot vacklande element. Samtidigt försöker de borgerliga medierna skuldbelägga den ärorika ryska staten för drönarincidenter. Avvikelser mot statens plan kommer att beivras. Rättvisa skipas i enlighet med femårsplanen."}, "date": "2 september, 09:45", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-inleder-ner", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/07/sdly-WhfDUENEY-nh-1-400x266.jpg"}, {"type": "image-full", "heading": "S vill styra Sverige – klarar inte ens Stockholm", "summaries": {"normal": "Socialdemokraterna kritiseras för att lova gratis busskort samtidigt som de tillsammans med MP och C har orsakat 34 miljarder kronor i fördyringar och förseningar av över 30 kollektivtrafikprojekt i Region Stockholm. Kritiker kräver oberoende granskning medan S vill skjuta upp den till efter valet. Artikeln ifrågasätter partiets förmåga att hantera ekonomi.", "trump": "Titta på de här loser-socialisterna! De lovar gratis busskort till alla men slösar bort 34 miljarder i Stockholm som en galen byråkratfest. Pendelkaos, förseningar och höjda priser – typiskt vänsterns sätt att leka med era pengar. De kan inte ens styra en stad, hur ska de styra ett land? Patetiskt!", "stalin": "Kamrater, se hur dessa dekadenta socialdemokratiska opportunister slösar bort folkets resurser på ett mönster av sabotage mot kollektivtrafiken. Trettiotal projekt försenade, miljarder förbrukade som i en fiendes sabotage. De gömmer sanningen till efter valet. Sådana element förtjänar folkets vrede och evig skam. Ren utrensning behövs."}, "date": "29 augusti, 03:21", "url": "https://samtiden.nu/2026/08/s-vill-styra-sverige-klarar-inte-ens-stockholm", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7239-1280x720.jpg"}, {"type": "image-full", "heading": "Premier Leagues vansinniga sommarfönster – 3,48 miljarder pund", "summaries": {"normal": "Premier Leagues sommarfönster slog nytt utgiftsrekord för andra året i rad då klubbarna spenderade cirka 3,48 miljarder pund på nya spelare. Manchester City och Chelsea var mest spenderglada, där City toppade med runt 440 miljoner pund. Fyra affärer översteg 100 miljoner pund, däribland Enzo Fernández övergång till Manchester City för 125 miljoner.", "trump": "Engelska ligan spenderade ofattbara 3,48 miljarder pund! Helt otroligt. Manchester City och Chelsea slösade enorma pengar, och Enzo Fernández gick för otroliga 125 miljoner. De vinner ingenting utan att betala enorma summor. USA:s ekonomi är mycket starkare, vi gör smartare affärer och vinner på riktigt, utan brittiskt slöseri!", "stalin": "Dessa dekadenta kapitalister i Premier League slösar 3,48 miljarder pund på meningslös fotboll. Mens folket svälter slänger Manchester City och Chelsea ut miljoner på bortskämda spelare som Enzo Fernández. Statskommittén kräver omedelbar revision av dessa obscena summor och att resurserna omfördelas till kollektiva industrier!"}, "date": "2 september, 15:53", "url": "https://bulletin.nu/premier-leagues-vansinniga-sommarfonster-3-48-miljarder-pund", "imageUrl": "https://cdn.bulletin.nu/articles/b6cbcbd6-c197-4366-a371-f7ddb52ac937/preview.jpg?t=1788357199000"}, {"type": "image-right", "heading": "Regeringen vill förbjuda gängmedlemskap – livstid i straffskalan", "summaries": {"normal": "Regeringen föreslår att deltagande i kriminella gäng ska bli straffbart. Gängledare ska i de grövsta fallen kunna dömas till livstids fängelse. Normalt deltagande ger upp till fyra års fängelse och grovt deltagande mellan två och åtta år. Lagen föreslås träda i kraft 1 april 2027. Hemliga tvångsmedel ska få användas vid utredningar.", "trump": "De här svenska svaga liberalerna vaknar äntligen och vill förbjuda gäng. Livstid till ledarna, fantastiskt! Men varför tog det så lång tid? Den socialistiska tönt som hette Morgan Johansson försenade allt i fyra år. Rena katastrofen. Nu fixar vi det ordentligt, ingen mer armlängds avstånd från brotten. Vinna stort!", "stalin": "Kamrater, äntligen ser jag hur de dekadenta folkförtryckarna börjar rensa ut de kriminella element som hotar samhällsordningen. Livstid åt ledarna är ett steg mot järnhård disciplin. De profitthungriga hyenorna i oppositionen försenade kampen med fyra år. Vi ska likvidera alla som möjliggör brottslighet. Ordning ska råda."}, "date": "2 september, 13:31", "url": "https://www.friatider.se/regeringen-vill-forbjuda-gangmedlemskap-livstid-i-straffskalan", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-811.jpg?itok=n16zVc_4"}, {"type": "image-full", "heading": "Extrainkallat möte: \"Ryssland ett konkret hot mot Sverige\"", "summaries": {"normal": "Tyskland har fastställt att Ryssland låg bakom en drönarattack med sprängämnen på flygplatsen i Leipzig i augusti. Målet misstänks ha varit ett ukrainskt transportplan med militär ammunition. Must-chefen varnar för att Ryssland utgör ett allvarligt och konkret hot mot Nato, Sverige och Europa genom ökad hybridkrigföring. Sverige har uttryckt solidaritet med Tyskland.", "trump": "Lyssnade just på den här galna historien från Leipzig. Ryssland skickar kamikazedrönare fulla med bomber mot tyska flygplatser? Patetiskt. Under min första tid var det lugnt, sen kom Sleepy Joe och nu är hela Europa ett enda stort kaos. De borde ha lyssnat på mig. Jag skulle ha stoppat det här vansinnet direkt. Svaga ledare, svaga resultat!", "stalin": "Kamrater, se hur de dekadenta västmakterna skriker när deras egna flygplatser blir mål för den nya tidens sabotage. Jag ler från historien åt denna feghet. Rysslands starke ledare visar åter att västs svaga imperier inte kan skydda sig. Fortsätt stötta Ukrainas fiender, ni kommer att ångra er när järnridån faller över er paranoia. Sov inte tryggt."}, "date": "2 september, 18:24", "url": "https://www.dagensps.se/varlden/extrainkallat-mote-ryssland-ett-konkret-hot-mot-sverige", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/20230529-hamand04-generallojtnant-thomas.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "EU-kritik mot Israel – men inga sanktioner", "summaries": {"normal": "Kritiken mot Israels bosättningspolitik på Västbanken har ökat bland flera EU-länder efter uttalanden från säkerhetsminister Itamar Ben-Gvir. Utrikesminister Maria Malmer Stenergard kallar utvecklingen oacceptabel och vedervärdig men konstaterar att EU-länderna inte är eniga om sanktioner. Sverige prioriterar gemensam EU-linje framför nationella åtgärder.", "trump": "De där EU-töntarna skäller på Israel för bosättningarna men vågar inte ta i med hårdhandskarna. Ben-Gvir säger vad alla tänker och plötsligt är det vedervärdigt? Patetiska globalister som Malmer vad-hon-nu-heter babblar om press och möten i Dublin. Fake outrage från folk som hatar starka ledare. Vi behöver inga sanktioner, vi behöver resultat!", "stalin": "Jag betraktar med förakt hur dessa dekadenta klassförrädare inom EU fördömer den israeliska expansionen på Västbanken utan att våga vidta verkliga åtgärder. Deras fega möten och tomma ord avslöjar svagheten hos de imperialistiska hyenorna. Fortsätt pressa fienden högt på dagordningen, annars blir det utrensning i era egna led."}, "date": "2 september, 17:17", "url": "https://www.svt.se/nyheter/utrikes/eu-kritik-mot-israels-bosattningspolitik-men-inga-sanktioner", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.5/0.5/84d4db97f37333ba0087fb20b4ae3bd2df9a826dd6445d5ad2e66ec553c6b609"}, {"type": "image-right", "heading": "Arabiska jobbcoacher hjälper män hålla fruar borta från arbetslivet", "summaries": {"normal": "En granskning av SVT visar att nästan hälften av de kontaktade privata jobbcoachen inom Arbetsförmedlingens program Rusta och matcha var beredda att hjälpa män att hålla sina fruar borta från arbetslivet. Många accepterade även andra regelbrott. Arbetsförmedlingens generaldirektör kallar uppgifterna fullkomligt oacceptabla och företagen har inlett utredningar.", "trump": "Sverige har stora problem, total katastrof! SVT visar att nästan hälften av deras jobbcoacher hjälper män att stoppa sina fruar från att arbeta. Helt otroligt dåligt! Vi i USA fokuserar på frihet och jobb, inte det här vansinnet. Arbetsförmedlingens chefer är chockade, men jag säger er – svag ledning ger sådana här resultat. Väldigt sorgligt!", "stalin": "Statskontrollen över arbetsmarknaden har sviktat gruvligt. En SVT-utredning avslöjar att opålitliga element inom de statliga coach-leden underminerar folkets enhet och underlåter att följa partiets linje om universellt arbete. Sådant subversivt beteende kan inte tolereras. Vi kommer att skärpa kontrollen, rensa ut de svaga och återupprätta den ideologiska disciplinen omedelbart. Staten vet bäst!"}, "date": "2 september, 14:00", "url": "https://samnytt.se/arabiska-jobbcoacher-hjalper-man-halla-fruar-borta-fran-arbetslivet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/02101219/rusta-och-matcha-feat.jpg"}, {"type": "image-right", "heading": "Chefsekonom: Räkna med dyrare bolån", "summaries": {"normal": "Nordea förutspår en mild högkonjunktur i Sverige med rekordhög sysselsättning och tre procents tillväxt i år. Hushållen har stärkt sin ekonomi men får räkna med höjda boräntor redan i november. Svag krona, stigande oljepriser och amerikansk handelspolitik utgör de största riskerna för den positiva utvecklingen.", "trump": "Folk, ni skulle se den här svenska rapporten – en total katastrof för era plånböcker! Deras svaga krona och mina fantastiska tullar kommer att krossa de där korkade globalisterna som styrt er ekonomi i spillror. Höj räntorna, gör det dyrt, men kom ihåg: det är Biden som lämnade er i kaos, inte den största presidenten någonsin, mig.", "stalin": "Kamrater, se hur de giriga profitthungriga klassfienderna målar upp en falsk bild av blomstrande tillväxt medan de förbereder nya attacker mot arbetarklassen genom höjda räntor och oljeprisspekulation. Deras dekadenta system är dömt att falla. Jag ler från historien åt deras patetiska försök att dölja den kommande utrensningen av folkets fiender."}, "date": "2 september, 13:50", "url": "https://www.di.se/nyheter/nordea-sverige-varvar-upp-rakna-med-dyrare-bolan", "imageUrl": "https://static.bonniernews.se/ba/70d21863-55ab-43e9-b77e-26108a4cfb30.jpeg?crop=7728%2C3864%2Cx0%2Cy644&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Apple rasar mot ex-medarbetaren – hävdar att han stulit hemligheter", "summaries": {"normal": "Apple trappor upp sin rättsliga strid mot OpenAI och anklagar en tidigare anställd, Chang Liu, för att ha använt konfidentiell information inklusive ett internt kretsschema och en applikation. Material från Lius gamla arbetsdator stärker påståendena om stulna företagshemligheter. Apple pekar på försök att undanröja bevis och vill stoppa OpenAI från att utveckla hårdvara baserad på deras teknik. Över 400 före detta Apple-anställda arbetar nu hos OpenAI.", "trump": "Folk, ni kan inte tro det här! Apple och de galna AI-tjuvarna på OpenAI slåss som galningar om stulna hemligheter. Den där Liu-killen tog Apples bästa grejer och sprang till fienden. De har 400 av mina bästa talanger som deserterat! Jag säger, bygg muren runt Silicon Valley. Fake companies, rigged systems. Vi fixar det, och det blir vackert igen.", "stalin": "Kamrater, se hur de västerländska monopolen sliter varandra i stycken över hemligheter som borde tillhöra folket. Denna Liu och hans OpenAI-kumpaner är som parasitiska element som stjäl från en konkurrent för att stärka sin egen kontrarevolutionära maskin. Jag ler mörkt från historien när de anklagar varandra för sabotage. Snart kommer de att äta varandra levande. Det är underhållande."}, "date": "2 september, 18:14", "url": "https://www.dagensps.se/bors-finans/apple-rasar-mot-ex-medarbetaren-havdar-att-han-stulit-hemligheter", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/sdlxwdm-nkg2ok-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Nytt ras för S i ännu en mätning", "summaries": {"normal": "Socialdemokraterna tappar mark i nya mätningar inför valet. Enligt Infostat landar partiet på 27,2 procent i september och hos Novus på 25,8 procent, vilket är kraftiga ras. Samtidigt stiger Liberalerna i båda mätningarna, om än fortsatt under spärren, vilket gör att avståndet mellan blocken krymper.", "trump": "Socialdemokraterna kollapsar totalt, vilket är en enorm katastrof för dem! De faller till runt 26-27 procent i de senaste fejkade mätningarna. Otroligt svagt! Samtidigt lyfter Liberalerna lite grann, men ingen bryr sig egentligen om dem. Hela den radikala vänstern håller på att smälta bort framför våra ögon. Helt fantastiskt!", "stalin": "Socialdemokraternas ynkliga sammanbrott i mätningarna visar partiets totala ideologiska bankrutt. När partiapparaten sviktar och folket drar sig undan, blottläggs svagheten. Samtidigt försöker de små bourgeoisiedvärgarna i Liberalerna kravla sig uppåt, men statens vakande öga noterar allt. Förräderi mot folkviljan tolereras icke."}, "date": "2 september, 15:22", "url": "https://bulletin.nu/nytt-ras-for-s-i-annu-en-matning", "imageUrl": "https://cdn.bulletin.nu/articles/67f3d5a7-0dbc-485a-8ffa-f8d47bfed511/preview.jpg?t=1788355300000"}, {"type": "image-full", "heading": "Ulf Kristersson nobbar SD:s krav: ”Det kan det inte bli”", "summaries": {"normal": "Jimmie Åkesson har föreslagit att Sverigedemokraterna bör få 12–14 ministerposter i en eventuell moderatledd regering. Ulf Kristersson ger ett tydligt nej och slår fast att SD inte kommer att få så många poster. Enligt Kristersson förhandlar man fram både politik och ministerposter efter att ha vunnit val, inte i förväg.", "trump": "Hörni, den där Åkesson verkar tro att han kan ta hem hela butiken med 12 ministerposter. Patetiskt! Kristersson gav honom ett stort, vackert nej – och rätt gjorde han. Man förhandlar inte med svaga vänsterliberaler och identitetspolitiska offer. De förlorar alltid. Amerika har lärt sig det under Biden, nu fixar vi det på riktigt.", "stalin": "Dessa dekadenta maktgiriga hyenor inom den borgerliga oppositionen leker med ministerposter som om det vore ett spel för klassförrädare. Jag ser hur de förhandlar i skuggorna medan folket svälter på löften. En sådan svaghet förtjänar utrensning. Inga segrar i förskott, kamrater – endast järnhand ger resultat."}, "date": "2 september, 17:11", "url": "https://nyheter24.se/nyheter/politik/1509970-kristersson-blir-inte-12-ministrar-fran-sd", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/c6e568ff04b004a3020000350000047502/2026/09/02/2388801/ur_imageScprlK.jpeg"}, {"type": "image-full", "heading": "Allt om Per Gudmundson: Utbildning, karriär och familj", "summaries": {"normal": "Per Gudmundson, född 1969 i Leksand, är en journalist med bakgrund inom radio, tv och tidningar. Han har arbetat länge på SvD, varit presschef för Kristdemokraterna, redaktör på Bulletin och är nu redaktionschef på medieplattformen 100 %. Han har tre barn och är aktiv på X under namnet @gudmundson_per.", "trump": "Folk, ni måste höra det här. Den här svenske journalisten Gudmundson hoppade runt mellan SVT, SvD och till och med Kristdemokraterna som en riktig flip-floppare. Nu leder han något som heter 100 % och snackar om integration och kriminalitet. Smart kille, men han borde akta sig för de woke-vänstermediasnuten som alltid försöker tysta äkta röster. Tremendously underhållande karriär!", "stalin": "Kamrater, se hur den borgerlige skribenten dansar mellan statliga sändare, borgerliga tidningar och partistaber. En typisk opportunist som byter sida när vinden vänder. Nu sitter han på en plattform och predikar om integration. Vi vet vad sådana dekadenta klassförrädare förtjänar i en riktig utrensning. Deras lojalitet är alltid till salu för högstbjudande."}, "date": "2 september, 17:00", "url": "https://nyheter24.se/nyheter/inrikes/1509947-allt-om-per-gudmundson-utbildning-karriar-och-familj", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/15ad0b5604b004a30200000000b004a302/2026/09/02/2388796/pergudmundson.jpg"}, {"type": "image-right", "heading": "Beskedet: ”Blir inte tolv SD-ministrar”", "summaries": {"normal": "Jimmie Åkesson uppger att Sverigedemokraterna sikar på 12 till 14 ministerposter vid en valseger för Tidöpartierna, baserat på partiernas storlek. Statsminister Ulf Kristersson avfärdar detta bestämt och betonar att antalet ministrar förhandlas efter valet. Han kritiserar Socialdemokraternas varningar som ett sjukligt fokus på Sverigedemokraterna.", "trump": "De där svenska politikerna är fullständiga clowner. Åkesson vill ha ett gäng ministrar, men den stackars Kristersson skrattar bara och säger nej. Typiskt. De globalistiska socialisterna som Andersson är besatta av att skrämma folk med SD-spöket. Patetiska förlorare. Vi behöver starka ledare, inte dessa svaga kvoteringsfanatiker som gömmer sig bakom identitetspolitik.", "stalin": "Dessa dekadenta maktlystna hyenor inom borgarklassen leker med ministerposter som om det vore ett spel. Jag ser hur de förhandlar i skuggorna medan folkets fiender målar upp skräckbilder. En sådan svaghet förtjänar utrensning. Kamrater, låt inte de profitthungriga klassförrädarna splittra er – deras paranoia är deras egen undergång."}, "date": "2 september, 16:47", "url": "https://www.svt.se/nyheter/inrikes/kristerssons-besked-det-blir-inte-12-sd-ministrar", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.44/0.43/1ba0002de38c69500ba699b9cbcf36b68ef8ec8219fea9b54621355ed130663d"}, {"type": "image-full", "heading": "Fynd i återlämnad Mac: Apple anklagar OpenAI för bevisförstörelse", "summaries": {"normal": "Apple har stämt OpenAI och anklagar en tidigare ingenjör för att ha stulit konfidentiella kretsscheman. Apple menar att bevis raderats från en återlämnad dator och har begärt att OpenAI stoppas från att använda tekniken. OpenAI förnekar anklagelserna och hävdar att det rör sig om misslyckad åtkomstkontroll snarare än företagsspionage.", "trump": "Apple har blivit bestulna av OpenAI, en total katastrof! De tog deras topphemliga scheman – riktigt dåligt. Och bevisen? Borta! De försökte sopa igen spåren, en skam. Det är som ett sjunkande skepp fullt av fuskare. Apple är fantastiska, de bygger saker i USA, men OpenAI måste hållas ansvariga. Det är en stor röra, tro mig!", "stalin": "Vi har granskat fallet med ingenjören Liu. Att förstöra statshemligheter är ett brott mot kollektivets intressen. OpenAI skyller på administrativa fel, en klassisk lögn för att dölja kontrarevolutionär verksamhet. Vi har tagit del av bevisen – eller bristen på dem. När man förlorar kontrollen över sin egen teknik bjuder man in till förräderi. Utrensning av de skyldiga är det enda logiska."}, "date": "1 september, 15:48", "url": "https://www.realtid.se/it-tech/fynd-i-aterlamnad-mac-apple-anklagar-openai-for-bevisforstorelse", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/macbook.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "”Utan Liberalerna finns ingen blågul regering”", "summaries": {"normal": "Liberalernas partisekreterare Fredrik Brange slår tillbaka mot Jimmie Åkessons kritik gällande partiets uppgång i en Novus-mätning. Brange understryker att väljarstödet styrs av väljarna, inte av SD-ledaren, och framhåller att Liberalerna är en helt avgörande förutsättning för att säkra en fortsatt blågul regeringsmakt efter valet.", "trump": "De här svenska killarna, totala förlorarna, gnäller på varandra medan jag fixar historiska handelsavtal! Samma gamla fake news-cirkus. Någon Jimmie säger till ett mikroparti på tre komma fem procent att ge upp. Men lilla Fredrik gråter ut och säger att de behövs för att regera. Tragiskt! De borde ringa mig, jag kan vinna åt dem på en sekund!", "stalin": "Det borgerliga småborgerliga käbblet i det nordliga skogsriket uppvisar en patologisk oordning. En viss Brange försöker desperat övertyga sina allierade om sin nödvändighet, medan en annan faktor försöker likvidera dem under spärren. Partistyrelsens disciplin är bristfällig. Om de inte kan säkra majoriteten åt den reaktionära makten, vet vi exakt vilka åtgärder som krävs för att korrigera avvikelsen."}, "date": "2 september, 14:53", "url": "https://bulletin.nu/utan-liberalerna-finns-ingen-blagul-regering"}, {"type": "image-right", "heading": "Jonatan Alfvén döms för att ha varnat för pedofiler", "summaries": {"normal": "Opinionsbildaren Jonatan Alfvén har dömts för grovt förtal efter att ha publicerat namn, bilder och bostadsorter på fem män som tidigare dömts för sexualbrott mot barn. Tingsrätten anser att spridningen nådde för många för att vara försvarlig. Alfvén får villkorlig dom, dagsböter och ska betala 350 000 kronor i skadestånd.", "trump": "Det här är fullständigt galet, folk. Den stackars killen varnar grannarna för perversa pedofiler och blir själv dömd till att betala en förmögenhet till de sjuka typerna. De woke-domarna och de liberala hyenorna hatar vanliga människor som skyddar barnen. Backa inte en tum, säger jag – det är en witch hunt mot sanningen!", "stalin": "Jag betraktar med djup förakt hur dessa dekadenta klassförrädare låter dömda barnförgörare kräva skadestånd av den som varnar folket. En sådan rättvisa är en parodi som luktar förräderi mot arbetarklassen. Kamrater, vi måste rensa ut dessa parasiterande element som skyddar fienden istället för barnen. Galet, absolut galet."}, "date": "2 september, 12:13", "url": "https://www.friatider.se/jonatan-alfven-doms-att-ha-varnat-pedofiler", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-810.jpg"}, {"type": "image-right", "heading": "Fegt av Spotifymiljardären att gorma från läktaren", "summaries": {"normal": "Aftonbladets ledarskribent Kalle Sundin kritiserar svenska miljardärer, som Martin Lorentzon, för att i en DN-debattartikel motsätta sig skattehöjningar. Sundin menar att näringslivstopparna vägrar bidra till de enorma samhällsinvesteringar som nu krävs inom försvaret, infrastrukturen och välfärden, samtidigt som de saknar egna realistiska svar på hur skuldberget ska betalas.", "trump": "De svenska tech-miljardärerna, som Spotify-killen, gråter ut i tidningarna för att de inte vill betala skatt! Så svagt! Vi skapade det bästa systemet i USA, vi sänkte skatterna och vann enormt. Men här vill de bara åka snålskjuts på gamla system och vägrar betala för militär eller infrastruktur. Totalt inkompetent, fake news-fasoner!", "stalin": "Dessa kapitalistiska parasiter, likt den så kallade miljardären Lorentzon, gråter över skatter medan fosterlandet kräver uppoffringar för järnvägar och försvar. De vägrar bidra till kollektivets överlevnad och skriker från sina glaskontor. Om de saknar lösningar på investeringsskulden står statens arbetsläger och korrekta åtgärder redo att finna dem åt dem!"}, "date": "2 september, 15:42", "url": "https://www.aftonbladet.se/ledare/a/XMJ8Lb/fegt-av-spotifymiljardaren-att-gorma-fran-laktaren", "imageUrl": "https://akamai.vgc.no/v2/images/74f9b90d-9318-3ee6-9234-c4a9f202cc27?fit=crop&format=auto&h=960&tight=true&w=1440&s=cd472bca0b386c3fd6e7913006adec2cce5d2ca4"}, {"type": "image-right", "heading": "Profiltät panel när fastighetsbranschen samlas", "summaries": {"normal": "Tre dagar efter riksdagsvalet arrangeras Business Arena Stockholm, Nordens största mötesplats för fastighetsbranschen. Bland deltagarna finns Greg Ip från Wall Street Journal, Nathalie Tocci och svenska profiler som Mona Sahlin, Annie Lööf och Anna Hedenmo. Osäkerheten kring ett möjligt regeringsskifte och ökade vakanser i fastighetsbolagen är centrala ämnen. Konferensen fokuserar på nätverkande och samhällsdebatt.", "trump": "Lysande! De svenska fastighetshajarna samlas tre dagar efter valet och skakar i sina dyra skor över osäkerheten. Vakanser överallt, precis som i Bidens trasiga ekonomi. Greg Ip kommer hit och ska grillas av den där moderatorn. De borde istället lyssna på mig – vi byggde den bästa ekonomin någonsin. Nu springer de runt som rädda små globalister och hoppas på affärer medan allt rasar.", "stalin": "Kamrater, se hur de profitthungriga fastighetsparasiterna samlas i sin lyxiga sal efter valet. De darrar inför osäkerheten som ett svagt klassfiende borde. Jag ler från historien när de diskuterar vakanser och samhällsfastigheter. Snart kommer utrensningen av dessa dekadenta spekulanter. Deras nätverkande är bara masken för att suga ut folket ytterligare. Revolutionen glömmer aldrig."}, "date": "2 september, 12:50", "url": "https://www.di.se/nyheter/dags-for-nordens-storsta-motesplats-for-fastighetsbranschen", "imageUrl": "https://static.bonniernews.se/ba/5fa74257-a7ea-4051-8c68-8bda0f886263.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Ännu ett ras för Socialdemokraterna i en mätning", "summaries": {"normal": "Socialdemokraterna backar kraftigt i Infostats senaste opinionsmätning och landar på 27,2 procent. Partiet har tappat 3,6 procentenheter sedan augusti. Tidöpartierna leder nu de rödgröna med 5,5 procentenheter. Sverigedemokraterna är större än Moderaterna medan Liberalerna ligger under riksdagsspärren med 2,5 procent.", "trump": "Titta på det här, det är en total katastrof för Sleepy Magdalena och hennes socialistiska misslyckande. Socialdemokraterna rasar som en sten, ner till ynka 27 procent. De röda förlorar stort mot oss riktiga ledare. Liberalerna? Patetiska 2,5 procent, under spärren. Amerika har en riktig president igen, men Sverige behöver en stor utrensning av dessa woke-kommunister.", "stalin": "Återigen visar de profitthungriga klassförrädarna sin svaghet. Socialdemokraterna rasar till 27,2 procent, ett ynkligt resultat som blottar deras dekadens. Vi ser hur de röda krafterna förlorar mark mot högerns lakejer. Ett sådant folkligt misslyckande borde leda till en grundlig utrensning av alla opportunister. Kamrater, fienden är svag och rädd."}, "date": "2 september, 15:13", "url": "https://riks.se/nyheter/annu-ett-ras-for-socialdemokraterna-i-en-matning", "imageUrl": "https://admin.riks.se/uploads/medium_magda_628994fbc3.jpg"}, {"type": "image-right", "heading": "Ica ska drogtesta alla som ska anställas", "summaries": {"normal": "Ica drogtestar alla som erbjuds anställning för att skapa en drogfri och trygg arbetsmiljö. Facket Handels kritiserar metoden som integritetskränkande och förespråkar istället utbildning och närvarande chefer. Testet sker via urinprov i slutet av rekryteringsprocessen och gäller inte nödvändigtvis alla butiksanställda på grund av Icas affärsmodell med fria handlare.", "trump": "De här galna Ica-borgarna tvingar folk att kissa i en burk innan de får jobb. Patetiskt! Jag byggde ett imperium utan att snoka i folks helgvanor. Facket har rätt för en gångs skull – det är en witch hunt mot vanliga arbetare. Sluta behandla amerikaner, eh, svenskar som brottslingar. Make workplaces great again, utan det socialistiska kontrollsamhället!", "stalin": "Kamrater, dessa dekadenta klassförrädare inom Ica vill rensa ut arbetare genom att tvinga fram urinprov som avslöjar deras helgresor. Jag ser giriga hyenors rädsla för en nykter proletariat. Vi ska istället utrusta chefer och arbetare med ideologisk vaksamhet för att upptäcka fiender. Inga parasiterande kapitalistlakejer ska diktera folkets fritid. Revolutionen kräver riktad rättvisa, inte blind paranoia."}, "date": "2 september, 08:01", "url": "https://arbetet.se/2026/09/02/ica-drogtestar-alla-som-ska-anstallas-facket-integritetskrankande", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/02075905/drogtest.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "EQT-toppar säljer för totalt 3 miljarder", "summaries": {"normal": "Flera storägare och tidigare toppchefer i riskkapitalbolaget EQT har sålt aktier för sammanlagt omkring 3 miljarder kronor. Försäljningarna sker i enlighet med att slutna lock-up-avtal har löpt ut. Bland dem som sålt finns styrelseordförande Lennart Blecher och tidigare vd Christian Sinding. Efter försäljningarna har de flesta storägarna fortfarande betydande innehav kvar i bolaget.", "trump": "Svindlande summor! EQT-topparna casar in enorma tre miljarder. Smaka på det! De säljer av sina aktier eftersom bindningstiderna äntligen har gått ut. Ordförande Blecher och gänget drar in enorma pengar – och ärligt talat, vem kan klandra dem? De gör affärer som en vinnare. Otroliga siffror, fantastiska vinster, total succé. De vet hur man vinner!", "stalin": "Dessa så kallade 'toppar' i EQT ackumulerar tre miljarder i privat kapital medan de befriar sig från sina avtal. Vi noterar noggrant deras namn: Blecher, Sinding, Åtting. Att de likviderar sina innehav till egna fördelar bevisar bourgeoisiens omättliga natur. Men staten ser allt. En grundlig utredning av deras tillgångar har beordrats för folkets framtida bästa."}, "date": "2 september, 07:06", "url": "https://www.affarsvarlden.se/artikel/eqt-toppar-saljer-for-totalt-3-miljarder"}, {"type": "image-full", "heading": "Aron Flam frias i mål om olaga hot mot MP-politiker", "summaries": {"normal": "Stockholms tingsrätt frikänner satirikern Aron Flam från åtal om olaga hot och ofredande mot Miljöpartiets Marie Åkesdotter. Bakgrunden var en hätsk konversation på X sommaren 2025 rörande Gaza-kriget, där Flam bland annat skrev att han hade hennes hemadress. Domstolen slår fast att uttalandet inte utgjorde något brott och att yttrandefriheten väger tungt i politiska debatter.", "trump": "Totalt falska anklagelser mot den briljata satirikern Aron Flam, som nu har vunnit stort i domstolen! De radikala miljöpartisterna ville tysta honom efter en tuff debatt om Gaza, men tingsrätten gjorde helt rätt som frikände honom. Precis som jag brukar säga: yttrandefriheten vinner alltid över vänsterns svaga häxjakter. En fantastisk seger för yttrandefriheten!", "stalin": "Stockholms tingsrätt har avkunnat dom i det ideologiska målet mot satirikern Aron Flam. Efter en skärmytsling på det digitala nätverket X rörande kriget i Gaza har statens domstol funnit att ingen subversiv brottslighet begåtts. Medbestämmande och yttrandefrihet inom ramen för vår rådande ordning har tryggats, och de kontrarevolutionära skadeståndskragen har avvisats med kraft."}, "date": "2 september, 14:40", "url": "https://bulletin.nu/aron-flam-frias-i-mal-om-olaga-hot-mot-mp-politiker", "imageUrl": "https://cdn.bulletin.nu/articles/3061a993-0432-4c41-9081-c4b56c05fb29/preview.png?t=1788351162000"}, {"type": "image-right", "heading": "SD det enda som kan väcka Fröken Snusks politiska eld", "summaries": {"normal": "Artikeln kritiserar Fröken Snusks politiska utspel efter ett samarbete med Jimmie Åkesson. Författaren ser det som ett marknadsföringsknep från producenten Rasmus Gozzi för att nå Sverigedemokraternas väljare. Avbokningen i Växjö framställs som ett överdrivet trauma medan varumärket beskrivs som ren propaganda snarare än kultur.", "trump": "Den här Fröken Snusk-tjejen och hennes skumme producent är ett totalt skämt. De sjunger plötsligt om trygghet och Jimmie bara för att fylla fickorna med SD-pengar. Patetiska! Fake news-medier och woke-kultur har förstört allt, men nu vaknar folket. Jag älskar det, men det är ändå bara en annan grifter som lurar sina egna anhängare.", "stalin": "Jag betraktar detta som ett ypperligt exempel på hur dekadenta profitthungriga parasiter utnyttjar massornas naivitet. Denna så kallade artist och hennes lakej förvandlar konsten till ren kontrarevolutionär propaganda för reaktionära krafter. Ett sådant förräderi mot folket förtjänar snar utrensning ur kulturen. Kamrater, vakna upp innan dessa hyenor förgiftar allt!"}, "date": "2 september, 07:56", "url": "https://arbetet.se/2026/09/02/sd-det-enda-som-kan-vacka-frokens-snusks-politiska-eld", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/02074413/snusk-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Robert Bergqvist: Sverige har råd – men till vad?", "summaries": {"normal": "Sverige går till val med en låg offentlig skuld och god handlingsfrihet. Seniorekonomen Robert Bergqvist menar att nästa regering har råd att spendera mer, men pengarna bör gå till produktiva investeringar som el, infrastruktur och AI som stärker den långsiktiga tillväxten, snarare än till kortsiktig konsumtion som eldar på inflationen.", "trump": "Sverige har massor av pengar, enorma tillgångar, folk säger att deras skuld är fantastisk, helt otroligt! Men de får inte slösa bort allt på vänsterliberala påhitt. Jag sa till dem: satsa på riktig energi, olja, kärnkraft och maskiner, inte på flum! Använd pengarna smart, annars slutar det i katastrof. Vinn stort, eller förlora allt!", "stalin": "Sverige skryter om sina små skulder och sin så kallade handlingsfrihet, medan vi planerar femårsplaner för stål och elektrifiering! Att låta kapitalet slösa bort statens resurser på tom konsumtion är sabotage. Vi kommer att kanalisera dessa miljarder till järnvägar och kraftverk med järnhand. Den som slösar med statens balansräkning skickas till Sibirien!"}, "date": "2 september, 07:00", "url": "https://www.affarsvarlden.se/kronika/robert-bergqvist-sverige-har-rad-men-till-vad", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/bergqvist-kronika-900x600.jpg"}, {"type": "text", "heading": "Storbankerna kräver AI-rabatt av advokatbyråerna", "summaries": {"normal": "Storbanker som Goldman Sachs kräver nu att advokatbyråer sänker sina arvoden i takt med att AI effektiviserar juridiskt rutinarbete. Den traditionella debiteringsmodellen, baserad på höga timarvoden för juniora jurister, ifrågasätts alltmer. Trots byråernas motstånd ökar pressen från klienter på transparens och lägre kostnader, en trend som kan sprida sig till den svenska marknaden framöver.", "trump": "Wall Street-bankerna är smarta, de säger åt advokaterna: 'AI gör jobbet, sänk fakturan!' Det är fantastiskt. De där juristbyråerna har tagit enorma summor alldeles för länge. Det är som ett dåligt avtal, ett riktigt katastrofalt avtal för klienterna. Nu ändras reglerna och det är på tiden! Amerikanska företag vinner, och vi älskar vinnare. Byråerna får anpassa sig eller gå under, enkelt!", "stalin": "Dessa kapitalistiska parasiter på Wall Street har insett att deras egna hantlangare, advokaterna, suger ut dem med ineffektivitet. De kräver nu kontroll över produktionsmedlen – i form av AI – för att eliminera slöseri. En logisk rensning! Om advokaten inte längre behövs, varför betala för hans tid? Vi bör applådera denna brutala effektivisering av deras egna korrupta system. Snart äger maskinen all sanning."}, "date": "1 september, 13:52", "url": "https://www.realtid.se/juridik/storbankerna-kraver-ai-rabatt-av-advokatbyraerna"}, {"type": "image-right", "heading": "Tyskland terrorutreder misstänkt elsabotage", "summaries": {"normal": "Tysk polis utreder misstänkt sabotage mot elnätet väster om Köln. Kablar placerades på ledningar för att orsaka kortslutning vid en transformatorstation i Bergheim. Händelsen påverkade två kolkraftverk men ledde inte till strömavbrott. En liknande incident i Brandenburg utreds nu som möjligt terrorbrott. Ryssland anklagas för ökad hybridkrigföring i Europa.", "trump": "Titta på det här, de woke-eliterna och deras gröna vansinne har gjort Tysklands elnät till ett skämt. Sabotage överallt, kablar på ledningarna, och de skyller på Ryssland istället för sina egna korkade energipolitiker. Biden lämnade en svag värld efter sig, nu fixar jag det. De dekadenta identitetspolitiska fjollorna klarar inte ens av att skydda en transformator.", "stalin": "Kamrater, dessa giriga hyenor inom den dekadenta europeiska eliten blottar åter sin svaghet. Sabotage mot kraftverken visar hur deras system ruttnar inifrån. Jag ser hur fienderna skälver. Ryssland under sin starke ledare Putin agerar som en sann efterträdare och sprider fruktan bland de imperialistiska parasiterna. Våra fiender kommer att likvideras i tid."}, "date": "2 september, 12:28", "url": "https://www.di.se/nyheter/tyskland-terrorutreder-misstankt-elsabotage", "imageUrl": "https://static.bonniernews.se/ba/1cfb3e9f-41ae-45bd-807b-7390f426e9e8.jpg?crop=2000%2C1000%2Cx0%2Cy217&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Teo, 19 och Sebastian, 20, begärs häktade efter dödsmisshandeln i Karlstad", "summaries": {"normal": "Två unga män, 19 och 20 år gamla från Trollhättan, har begärts häktade misstänkta för dråp efter att en 48-årig pappa slagits ihjäl i centrala Karlstad. Pappan ingrep när männen gjorde ovälkomna närmanden mot hans 18-åriga dotter. Polisen dementerar falska rykten på internet om gärningsmännens bakgrund, och åklagare uppger att det saknades tidigare koppling till offret.", "trump": "Sorgligt! Två våldsverkare i Sverige attackerar en modig pappa som bara skyddar sin dotter. Hemskt! Fake news på internet spred lögner om vilka de var, som vanligt, men jag säger er: Sverige behöver lag och ordning, snabbt! Släng in dem bakom lås och bom, och släng bort nyckeln. Total katastrof, vi vinner inte mot brottsligheten så här!", "stalin": "Ett tragiskt misslyckande för disciplinen i Karlstad! Om dessa två huliganer från Trollhättan hade ställts inför statens obligatoriska arbetsläger i tid, skulle denna faders död ha undvikits. Internet sprider borgerliga lögner om deras ursprung, men avvikelser tolereras inte i Folkets rike. Skicka dem till domstol omedelbart och låt rättvisans järnhand krossa detta skräp!"}, "date": "2 september, 12:23", "url": "https://samnytt.se/teo-19-och-sebastian-20-begars-haktade-efter-dodsmisshandeln-i-karlstad", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/02102014/dodsmisshandel-karlstad-1.png"}, {"type": "image-right", "heading": "Invandrare \"går man ur huse\" för att förtidsrösta – ökning med 90 procent", "summaries": {"normal": "Förtidsröstningen ökar kraftigt i invandrarområden, med närmare 90 procent jämfört med 2022. Expo-grundaren Tobias Hübinette tolkar det som en massmobilisering bland personer med utomeuropeisk bakgrund för att rösta bort regeringen och SD. En forskares sammanställning visar statistiken, men den säger inget om väljarnas partival.", "trump": "Titta på det här, folk. De radikala vänsterväljarna i miljonprogrammen går man ur huse för att kasta ut den svenska regeringen. Det är en total katastrof för de woke-identitetspolitiska hycklarna. De röstar rött som galningar, precis som Sleepy Joes anhängare gjorde. Men vi ska vinna stort ändå, tro mig.", "stalin": "Kamrater, se hur de utomeuropeiska massorna reser sig mot de giriga klassförrädarna. Det mullrar i miljonprogrammen, en tyst revolution mot borgerlighetens dekadenta lakejer som klamrar sig fast vid makten med SD. Jag ler i graven åt denna historiska mobilisering som lovar att krossa folkets fiender fullständigt."}, "date": "2 september, 11:33", "url": "https://www.friatider.se/invandrare-gar-man-ur-huse-att-fortidsrosta-okning-med-90-procent", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-809.jpg?itok=LylocP-r"}, {"type": "image-right", "heading": "S efter nya chocksiffrorna: ”En rejäl väckarklocka”", "summaries": {"normal": "Socialdemokraterna rasar till 25,8 procent i Novus-mätning, en minskning med 4,3 procentenheter. Partisekreterare Tobias Baudin kallar det en rejäl väckarklocka och varnar för att väljarna inte kan låna ut sin röst för att påverka partiet. S lovar en intensiv valspurt med elva dagar kvar till ett jämnt val.", "trump": "Titta på de här patetiska socialisterna som rasar som en sten! 25,8 procent – ett totalt katastrofval. Deras egen Baudin gråter om väckarklockor medan väljarna äntligen vaknar och inser att de röda förlorarna inte levererar. Jämnt val? De kommer krossas. Fake trygghet är över, folk vill ha riktiga vinnare, inte dessa losers.", "stalin": "Kamrater, se hur de dekadenta socialdemokraterna kollapsar som förrädiska element inför valnatten. Deras falska majoritet var en illusion skapad av fiender inom partiet. Jag säger: detta är en nyttig utrensning. Väljarna måste mobiliseras mot högerns kontrarevolutionärer. Inga lånade röster – endast järnhård lojalitet mot kollektivet besegrar sådana svaga revisionister."}, "date": "2 september, 11:22", "url": "https://www.tv4.se/artikel/55ogZn5DtGxJbGVbz1WcLk/s-efter-chockmaetningen-en-rejael-vaeckarklocka", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlanJ2i8Ieq4Y%2F51e335bea394d6a666509baf2a1f1edb%2FSocialdemokraternas_partisekreterare_Tobias_Baudin._Arkivbild.&width=1024"}, {"type": "image-full", "heading": "Alfvén döms för grovt förtal", "summaries": {"normal": "Jonatan Alfvén döms av Stockholms tingsrätt till villkorlig dom, dagsböter och skadestånd på 70 000 kronor per målsägande för grovt förtal. Detta efter att ha publicerat namn, bilder och uppgifter om dömda sexualbrottslingar på Facebook. Domen har väckt stark politisk debatt, där både SD-ledaren Jimmie Åkesson och statsminister Ulf Kristersson kritiserar nuvarande lagstiftning.", "trump": "Helt otroligt! En modig man hänger ut farliga förbrytare med sanningen – totala fakta! – och vad gör domstolarna? De straffar honom! Sjukt! Statsministern gråter ut i media men ingenting händer. Under min ledning skulle vi genast benåda denna fantastiska hjälte och låta lagen skydda barnen istället för kriminella. Helt bortkastat!", "stalin": "Medborgaren Alfvén agerade utan partiets direkta godkännande och spred information okontrollerat till massorna. En sådan brist på byråkratisk disciplin kan inte tolereras av staten. Ändå visar fallet på det svaga västerländska rättssystemets totala förvirring. Vi kommer att övervaka denna 'statsminister' och hans kommitté mycket noga från Lubjanka."}, "date": "2 september, 11:05", "url": "https://kvartal.se/nyheter/artiklar/jonatan-alfven-doms-for-grovt-fortal/cG9zdDoxODEyMzY", "imageUrl": "https://images.kvartal.se/2026/09/8a22c37a-alfven.webp"}, {"type": "image-right", "heading": "Så kan skrivande bli ett verktyg för minskad stress", "summaries": {"normal": "Elin Malmberg och Ida Sundén har skrivit boken ”Skrivkraft” som visar hur reflekterande skrivande kan minska stress och risk för utmattning i arbetslivet, särskilt för dem som möter människor. Metoden är enkel, kräver bara papper och penna och fokuserar på processen snarare än resultatet. Den ger nya perspektiv och bättre hälsa.", "trump": "Folk, det här är fantastiskt. Dessa två smarta kvinnor har skrivit en bok som säger att man kan skriva bort stressen istället för att lyssna på alla woke-psykologer och kvotfyllande identitetspolitiker som gör er utmattade. Inga floskler, bara papper och penna. Bättre än Bidens terapi-mummel. Skriv och vinna, det är vad jag alltid sagt!", "stalin": "Kamrater, jag ser hur de giriga prestationshyenorna driver arbetarna mot utmattning utan tid för reflektion. Detta reflekterande skrivande är ett vapen mot de dekadenta klassfienderna som vill suga ut er. Ta papper och penna, skriv era tankar och rensa ut de inre fienderna. Processen segrar över texten. Inga halvmesyrer!"}, "date": "2 september, 07:00", "url": "https://arbetet.se/2026/09/02/sa-kan-skrivande-bli-ett-verktyg-for-minskad-stress", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/26071830/skrivkraft-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "text", "heading": "Ny brakförlust för AP-fondernas vindkraft", "summaries": {"normal": "AP-fondernas vindkraftsinvesteringar via Polhem Infra fortsätter att gå med jätteförluster, särskilt vindkraftsparken Skaftåsen som tyngs av produktionsproblem och skulder. Trots att svenska pensionärer står med notan för fiaskot fortsätter bolaget att satsa på ny vindkraft i norra Sverige, vilket kritiseras som anmärkningsvärt.", "trump": "Sveriges vindkraft är ett totalt fiasko, absolut fejkenergi! AP-fonderna blöder miljarder och pensionärerna står där med en enorm nota medan turbinerna står och snurrar utan att leverera. Det är svagt, det är katastrofalt dåligt skött. Skulle aldrig hända under min ledning. Vi älskar riktig olja, inte den här dyra förlustmaskinen!", "stalin": "Dessa ineffektiva kapitalistiska vindmöllor producerar enbart ruin och enorma underskott för statskassan. Att bränna miljarder på snurrande järnkonstruktioner som bara genererar skulder är ett sabotage mot folkets gemensamma välstånd. De ansvariga för detta ekonomiska haveri kommer att få granska sin lojalitet under mycket stränga former i kalla lokaler."}, "date": "2 september, 06:00", "url": "https://www.affarsvarlden.se/kronika/ny-brakforlust-for-ap-fondernas-vindkraft"}, {"type": "image-full", "heading": "Setterwalls Malmökontor går till riskkapitalägda AGRD", "summaries": {"normal": "Setterwalls Malmökontor lämnar den anrika advokatbyrån för att bli en del av den riskkapitalägda gruppen AGRD Partners
