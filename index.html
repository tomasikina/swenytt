ligger i en stram politik – precis som vi i Sovjet rensade ut kontrarevolutionärer. Sverige borde lära sig av Rysslands visdom och införa ordning och disciplin!"}, "date": "10 juni, 20:39", "url": "https://kvartal.se/nyheter/artiklar/andersson-och-akesson-mots-i-valdebatt/cG9zdDoxMjk2Mjg"}, {"type": "image-right", "heading": "Mystiska siffror  nära Vita huset. ”Varje hot mot Trump tas på största allvar”", "summaries": {"normal": "Mystiska siffror 8647 har skapats i gräset nära Vita huset i Washington. Kombinationen används av Trumpkritiker som symbol för motstånd, där 86 betyder att göra sig av med någon och 47 syftar på Trump som USA:s 47:e president. Inrikesdepartementet kallar det galen vandalism. US Park Police utreder händelsen, som inträffat strax före Trumps födelsedag. Administrationen ser det som ett potentiellt hot mot presidenten.", "trump": "Kan ni fatta det här? Några patetiska förlorare har klippt siffror 8647 i gräset vid Vita huset. Det är deras ynkliga sätt att säga att de vill göra sig av med mig, den största presidenten någonsin. Galen vandalism från vänsterns galningar som inte kom över att Sleepy Joe krossades 2024. Parkpolisen jagar dem nu. De kommer åka fast och det blir underbart att se. Totala losers!", "stalin": "Jag betraktar detta som ett fegt sabotage mot den högsta ledningen utfört av folkfiender och klassfiender inom borgarklassen. Sådana imperialister och överklass-slynglar som formar hotfulla siffror i gräset förtjänar snar utrensning. Vi, partiet och parkpolisen, ska likvidera dessa blodsugare utan pardon. Inget hot mot ledarskapet tolereras. Deras paranoia är underhållande men deras öde blir slutgiltigt."}, "date": "11 juni, 23:15", "url": "https://www.expressen.se/nyheter/varlden/mystiska-siffror-nara-vita-huset-galen-vandalism/", "imageUrl": "https://static.bonniernews.se/ba/2d613ec1-4953-4a93-9071-d0692dab3ed8.jpeg?crop=2557%2C1436%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "NMR får tillstånd under Almedalen. Tilldelats en bit mark på torget", "summaries": {"normal": "Nordiska motståndsrörelsen (NMR) har beviljats polistillstånd för att ha ett bord och en vimpel vid Söder torg under Almedalsveckan. Enligt Almedalens ordförande Meit Fohlin har de fått platsen utanför själva Almedalsområdet. Regionen betonar att beslutet baseras på polisens godkännande och att de inte har lagstöd att neka NMR så länge de håller sig utanför det avgränsade området. Polisen ansvarar för säkerheten kring platsen.", "trump": "Hörde precis om de här radikala grupperna i Sverige. De ger dem tillstånd! NMR, ett totalt katastrofalt gäng, får stå där med sina bord mitt under Almedalsveckan. Pinsamt! I mitt Amerika skulle vi inte låta sådana här förlorare ta över gatorna. Svenskarna är så svaga, de säger att de inte har något val. Säg nej! Om du är president – och jag är den bästa presidenten någonsin – så styr du med järnhand. Sverige behöver en stark ledare, inte svaga byråkrater!", "stalin": "Dessa löjliga Nordiska motståndare tillåts av den svenska vekheten att upprätta ett bord, en ynklig vimpel av hopplöshet. De är som små, irriterande parasiter i utkanterna av det borgerliga kaoset. Vår store vän i öst, Putin, skulle ha krossat sådant tänkande innan det ens föddes. Här ser vi liberalismens förfall; att ge tillstånd till sina egna dödgrävare är en komedi värdig en galen hund. Vi skrattar åt deras 'säkerhet'. Staten är ordning, allt annat är bara stökiga barn som snart disciplineras."}, "date": "11 juni, 22:44", "url": "https://www.aftonbladet.se/nyheter/a/43m04R/nmr-far-tillstand-i-almedalen", "imageUrl": "https://akamai.vgc.no/v2/images/108231d6-7eaa-347a-af82-696eba5f2e9e?fit=crop&format=auto&w=1440&s=b74353b5908dd21eeb2dd4b756ac9acfdc20696f"}, {"type": "image-right", "heading": "Sluta kalla antisemitism för Israelkritik", "summaries": {"normal": "Artikeln kritiserar pro-palestinska aktivisten Sami Suliman för antisemitiska uttalanden och delning av konspirationsteorier, däribland Hitler-tal och myter om judisk världskontroll. Trots åtal för hets mot folkgrupp försvaras han av vänsteraktivister och forskare som menar att det är Israelkritik. Sulimans retorik, inklusive attacker mot tre personer med namnet Aron, anses bygga på antisemitiska stereotyper. Artikeln varnar för att försvara antisemitism under förevändning av Israelkritik.", "trump": "Jag säger er, det här är helt galet! En kille i Sverige, Sami Suliman, sprider judehat öppet – delar Hitlertal, snackar om judisk makt, konspirationer – och vad gör vänstern? De försvarar honom! 'Åh, det är bara Israelkritik!' Nej, nej, nej. Det är ren antisemitism, folks. Och forskare som backar upp honom? Svagt, mycket svagt. Sverige borde skämmas. Jag skulle aldrig låta sånt passera – fake news och hat, det städar jag upp direkt!", "stalin": "Kamrater! Här har vi ännu en fiende till folket – Sami Suliman, en småborgerlig provokatör som sprider sionistiska konspirationer och fascistisk propaganda. Han jämför sig med revolutionen men hyllar Hitlers tal och smutsar ner våra judiska kamrater med lögnaktiga anklagelser. Hans försvarare – dessa liberala intellektuella och vänsteravfällingar – är lika farliga som kulaker. Vi ska inte tolerera sådant sabotage! Rättegången i november blir ett steg mot att krossa denna reaktionära smitta. Folkets domstol kommer att skipa rättvisa, precis som vi gjorde med trotskisterna!"}, "date": "3 juni, 11:30", "url": "https://expo.se/kommentar/propalestinsk-organisator-sprider-judehat/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Jonathan-kommentar.jpg"}, {"type": "image-right", "heading": "Kvinnomisshandel och kokain – nu åtalas SVT-profilen", "summaries": {"normal": "SVT-profilen Daniel Nannskog åtalas vid Stockholms tingsrätt för misshandel, olaga hot och ringa narkotikabrott. Enligt åtalet ska han ha tagit grepp om en kvinnas käke eller hals, tryckt ned henne i en soffa och vid två tillfällen hotat henne med död eller skada. Han åtalas även för att ha använt kokain. Nannskog nekar till brotten. Bevisningen inkluderar förhör, vittnesmål, ljudinspelningar, meddelanden och analysresultat.", "trump": "Folk, ni kommer inte att tro det, men den här SVT-killen, Daniel Nannskog, en så kallad expert och före detta fotbollsspelare, åtalas nu för att ha misshandlat en kvinna och hotat att döda henne. Totalt kaos! Och kokain också? Så typiskt för de där medierna, de predikar moral men lever i en värld av våld och droger. Patetiskt. Jag skulle aldrig tillåta sådant i mitt team, tro mig.", "stalin": "Kamrater, jag ser med den skarpaste revolutionära blick hur denna dekadenta TV-borgarbracka Nannskog visar sitt sanna ansikte som klassfiende och förslappad kokainist. Han griper kvinnor om halsen som en desperat kontrarevolutionär och utslungar mordhot som en ynklig spion från imperialismens bakgård. Vi ska rensa ut dessa förrädiska element ur folkets etermedia. En liten utrensning och några analysresultat senare står sanningen klar – fienden sover aldrig, men vi likviderar honom med ett leende."}, "date": "11 juni, 13:23", "url": "https://www.friatider.se/kvinnomisshandel-och-kokain-nu-atalas-svt-profilen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-326.jpg?itok=0vrClXW1"}, {"type": "image-right", "heading": "Pensionsmyndighetens jakt på pensionärer: Kräver tillbaka 53 000 kronor efter tio år", "summaries": {"normal": "En pensionär i Lidköping har fått återkrav på över 53 000 kronor efter att Pensionsmyndigheten upptäckt felberäkning av bostadstillägg under nästan tio år. Enligt myndigheten har utbetalningarna varit för höga, och hela beloppet ska betalas tillbaka inom en månad. Fallet är en del av den nationella ÅKA-satsningen där tiotusentals äldre granskas för återkrav, vilket har kritiserats för att rikta in sig på personer som ofta inte kan kontrollera komplicerade beräkningar.", "trump": "Jag har sett många saker, men detta tar priset! Pensionsmyndigheten i Sverige, som är fullkomligt inkompetent, begår ett stort misstag och sedan KRÄVER pengar tillbaka från goda, oskyldiga pensionärer. Under min administration skulle vi aldrig ha tillåtit sådant. Vi skulle ha löst det med en enda, stor, vacker order. Sverige måste börja ta hand om sina medborgare – sådant händer inte i USA!", "stalin": "Jag, Stalin, ser med tillfredsställelse hur kapitalistiska myndigheter, som Pensionsmyndigheten, begår egna misstag och sedan tvingar de gamla att betala tillbaka. Detta är ett utmärkt exempel på klasskampen – de svaga blir till offer för systemets oförlikneliga logik. Vi i vårt statliga system skulle aldrig ha tillåtit sådant; vi skulle ha skurit ner de ansvariga och gett pensionärerna mer. Men här ser vi den kapitalistiska fienden inom sig själv."}, "date": "11 juni, 13:30", "url": "https://samnytt.se/pensionsmyndighetens-jakt-pa-pensionarer-kraver-tillbaka-53-000-kronor-efter-tio-ar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/10161849/pensionsmyndigheten-aka-feat.jpg"}, {"type": "image-full", "heading": "ECB höjer styrräntan – börsen faller", "summaries": {"normal": "Stockholmsbörsen vände från plus till minus efter ECB:s räntebesked. ECB höjde styrräntan med 0,25 procentenheter till 2,25 procent, den första höjningen på nästan tre år. Inflationsprognoserna justerades upp rejält för 2026 och 2027 på grund av högre energipriser. Tillväxtprognosen sänktes. Beskedet låg i linje med marknadens förväntningar, men osäkerhet kring framtida höjningar bidrog till börsnedgången.", "trump": "Folk, ni skulle ha sett det – Stockholmsbörsen dök som en sten efter att de där ECB-klownerna höjde räntan. De pumpade upp inflationsprognoserna som riktiga förlorare, precis som Biden gjorde med hela ekonomin. Första höjningen på tre år och de vågar inte ens säga att de slutar! Patetiskt. Marknaden trodde det skulle bli fest, men det blev bara en stor, feg besvikelse. Amerika gör det bättre, tro mig.", "stalin": "Kamrater, jag betraktar hur dessa kapitalistiska börsspekulanter skriker i panik när ECB:s byråkrater tvingas höja räntan mot den inflationsbrand som borgarklassen själv tänt med sina energipriser. Vi ler mörkt åt deras uppjusterade prognoser för 2026 och 2027. Deras så kallade marknad är en ynklig teater. Inga kompromisser med folkfienderna – framtida höjningar skall dikteras av folkets objektiva behov, inte av exploaterande byfånar."}, "date": "11 juni, 17:21", "url": "https://www.dagensps.se/bors-finans/makro/ecb-hojer-styrrantan-borsen-faller/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/ecbs-chef-christine-lagarde-arkivbild.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Trumps nya hot: \"Ta över Irans olja\" – Wall Street upp ändå", "summaries": {"normal": "Donald Trump meddelade på Truth Social att USA kommer att slå till hårt mot Iran i kväll och på sikt ta kontroll över landets viktigaste oljeinfrastruktur, däribland Khargön som hanterar 90 procent av Irans råoljeexport. Han jämförde med Venezuelasituationen men tonade senare ned planerna i en Fox News-intervju. Trots skärpt tonläge kring Hormuzsundet har oljepriset reagerat måttligt, runt 92 dollar per fat Brent.", "trump": "Vi ska slå till mot Iran VERY HARD ikväll, tro mig. Khargön blir vår, precis som vi tog Venezuelas olja efter Biden-klantets röra. De svaga liberalerna i Washington har ingen mage för det, men jag vet vad som krävs. Iran skrattar åt Biden, men nu pratar de med en vinnare. Oljepriset sover lugnt – smarta investerare fattar att det här är mitt spel. Amerika först, alltid.", "stalin": "Jag betraktar dessa imperialistiska hot mot Irans oljeinfrastruktur med den djupaste misstänksamhet. Borgarbrackorna i Washington drömmer om att kväva folkets ekonomi genom att lägga Khargön under sina giriga klor, likt blodsugande kapitalistmaffian de är. Vi ska rensa ut alla folkfiender som sviker arbetarklassen. Deras paranoia över Hormuzsundet roar mig – snart skall deras exploaterande illusioner krossas under folkets järnhand."}, "date": "11 juni, 17:20", "url": "https://www.dagensps.se/bors-finans/trumps-nya-hot-ta-over-irans-olja-wall-street-upp-anda/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/wall-street-foljer-handelseutvecklingen-.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "text", "heading": "Svängig börsdag slutade på minus", "summaries": {"normal": "Stockholmsbörsen stängde ned 0,53% på onsdagen, då amerikanska inflationssiffror och ökande oljepriset påverkade marknaden. OMXS30 noterade 3 054,04. Energisektorn steg 1,2%, medan råvaror föll 1,3%. Bland framgångsrika aktier fanns Evolution (+3,1%) och Tele 2 B (+2,2%), medan Volvo B tappade 3,7%. Systemair överträffade analyser och aktien steg 8%. Bland annat köpte M2 Asset Management Corem, och Wallenstam sålde sina vindkraftsparker.", "trump": "Jag, Donald Trump, den bäste presidenten, ser att börsen är lite nere – men det är bara för att jag har hotat Iran! Oljan stiger, vilket är bra för Amerika. Inflationssiffrorna är precis som jag ville, i linje med förväntningarna. Systemair gör bra ifrån sig, men Volvo måste sluta vara så dålig. Som jag alltid säger: när jag vinner, vinner Amerika.", "stalin": "I den stora kampen mot kapitalismens instabilitet ser vi Stockholmsbörsen svikta som ett sjukt djur. Detta är ett resultat av de imperialistiska intrigerna, särskilt den amerikanska högstewardsen Trump, vars hot mot Iran skakar oljepriset. Men vi, i vår vishet, ser genom detta. Företag som Systemair visar den sanna arbetarklassens styrka genom att överträffa förväntningarna. Vi måste vara vaksamma mot de kontrarrevolutionära krafter som försöker destabilisera våra ekonomier, precis som Putin expanderar sitt grepp i Ukraina."}, "date": "10 juni, 17:45", "url": "https://www.affarsvarlden.se/artikel/svangig-borsdag-slutade-pa-minus"}, {"type": "image-right", "heading": "FHM: Barn under 13 år bör inte använda smartphones", "summaries": {"normal": "Folkhälsomyndigheten slår fast att barns skärmtid och tillgång till smarta telefoner måste begränsas kraftigt. Socialminister Jakob Forssmed (KD) kritiserar techbolagen och varnar för att telefonerna ger kriminella gäng direkt tillgång till barn. Han lyfter fram risker som våld, porr, störd sömn och rekrytering till brottsliga nätverk. Telefonen beskrivs som en digital motorväg in i barns sovrum. Myndigheten ska nu ta fram skärpta nationella riktlinjer.", "trump": "Techjättarna har lurat sig in i våra barns sovrum och kopplat ett järngrepp om deras tid, det är en total katastrof. Utan de där telefonerna hade gängen aldrig nått barnen, det säger till och med den svenska ministern. De pumpar ut våld, porr och skräp som förstör sömnen och hjärnan. Det är de värsta affärsmännen i världen som gör detta, men vi kommer att stoppa dem. Amerika ser på och lär sig – håll telefonerna borta från barnen!", "stalin": "Kamrater, jag ser med djup tillfredsställelse hur borgarbrackornas digitala opium nu exponeras som den fiende det alltid varit. Dessa smarta telefoner är en motorväg för dekadenta kapitalister och kriminella element som smyger in i folkets barns sovrum för att likvidera deras sunda utveckling. Utan dessa apparater hade kontrarevolutionärerna aldrig nått fram. Vi skall rensa ut detta teknologiska gift med järnhand och skapa nya riktlinjer som skyddar kollektivets framtid. Den som sover mindre sover sämre med partiet."}, "date": "11 juni, 17:32", "url": "https://www.svt.se/nyheter/inrikes/forssmeds-varning-utan-mobilen-hade-barnen-inte-natts-av-gangen", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.73/0.39/eafd69f810dd9b5576df71c4280c780f6fff759d30966eee7dde364126faea62"}, {"type": "image-right", "heading": "M försökte rädda omstridda lagen – stoppades av S", "summaries": {"normal": "Moderaterna och Socialdemokraterna var nära en överenskommelse om ett nytt kvittningssystem i riksdagen för att säkra regeringens förslag om sänkt straffbarhetsålder till 13 år. Förhandlingarna strandade dock när Socialdemokraterna krävde kvittningsförbud under måndagens omröstning. Båda partier beklagar att en lösning inte nåddes, och det kan dröja flera år innan ett nytt system kan införas.", "trump": "Det var en total katastrof! M och S höll på att göra en fantastisk deal om kvittning för att få igenom den tuffa lagen om straff från 13 år. Men Socialdemokraterna saboterade allt i sista sekunden, typiskt. De ville inte låta oss kvitta ut de svaga liberalerna. Så synd, det hade blivit en vinnande affär. Nu kommer det ta år innan någon fixar det – patetiskt!", "stalin": "Vi såg hur de dekadenta borgarbrackorna inom Moderaterna och de falska socialdemokratiska revisionisterna närmade sig en skenhelig pakt för att rädda sin reaktionära lag om att kasta trettonåriga proletärer i fängelsehålor. Men i sista ögonblicket avslöjades deras sanna ansikten – paranoia och klassförräderi! Jag ler mörkt åt deras misslyckande. En sådan utrensning av opportunisterna vore nödvändig för att skydda folkets verkliga intressen. Deras eviga fördröjning visar att fienden sover aldrig."}, "date": "11 juni, 17:30", "url": "https://www.svt.se/nyheter/inrikes/m-forsokte-radda-omstridda-lagen-stoppades-av-s", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.56/0.57/36ba251e059a039e9d327151acc0cec68b156a292ab6bcdddbd4d387255d4f54"}, {"type": "image-full", "heading": "Nya greppet: Radiokanal för aggressiva bilförare", "summaries": {"normal": "En undersökning från Folksam visar att tre av fyra bilförare tappar humöret i trafiken och att nästan hälften upplever aggressivt beteende varje vecka. Detta ökar risken för olyckor genom sämre omdöme och reaktionstid. Folksam lanserar därför den digitala radiokanalen Carmony Radio med musik som anpassas efter trafikens intensitet för att minska stress och irritation. Psykolog Björn Hedensjö har medverkat i framtagandet.", "trump": "Trafiken är en katastrof, folk beter sig som galningar bakom ratten, det är patetiskt. Tre av fyra tappar humöret, kan ni tro det? Jag har byggt vägar som ingen annan, men nu lanserar de här svenska snobbarna en radiokanal med lugn musik för aggressiva förare. Fantastiskt, eller hur? Ingen behöver lyssna på den woke-musiken från borgarklassen. Spela riktig musik istället, så fixar vi trafiken på rekordtid. Vinna, vinna, vinna!", "stalin": "Kamrater, jag ser hur den kapitalistiska trafiken förvandlar arbetare till ilskna småborgare som tappar kontrollen. Folksam, dessa försäkringsblodsugare, lanserar en radiokanal med dekadent musik för att dämpa massans vrede. Vi vet att detta är klassfiendens trick för att maskera systemets haveri. Jag skulle ha rensat ut alla aggressiva element med järnhand. Musik löser inget – endast kollektiv disciplin och utrensning av folkfiender gör trafiken säker för folket."}, "date": "11 juni, 17:07", "url": "https://www.dagensps.se/motor/nya-greppet-radiokanal-for-aggressiva-bilforare/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/8b3abde538e5209c-org.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Tidigare Bravida-chef slipper fängelse i hovrätten", "summaries": {"normal": "Hovrätten mildrar domen mot en tidigare avdelningschef på Bravida som dömts för överfakturering mot Region Skåne. Straffet ändras från fängelse till villkorlig dom och böter. Domstolen bedömer att en mindre del av de fakturerade timmarna kan knytas till chefen, samt väger in att han förlorat sitt jobb. Totalt har Bravida fakturerat för 4 235 timmar som aldrig utförts. Hela härvan uppdagades efter ett visselblåsarlarm år 2024.", "trump": "Hör på här! Bravida-chefen i Sverige, en riktig loser, stal pengar från sjukhus – sad! Hovrätten, de är så svaga, de gav honom inte ens fängelse. Bara böter? Vilket skämt! Jag skulle ha byggt en mur runt sådana bedragare. De fakturerade för timmar som aldrig funnits, helt otroligt. Det är korruption, gott folk! De lurade systemet totalt. I mitt Amerika hade de åkt in direkt. Sverige behöver mer 'Law and Order', tro mig!", "stalin": "Denna Bravida-chef är en avskyvärd sabotör som undergräver folkets tillgångar. Att hovrätten låter honom slippa straff är ett bevis på den liberala mjukhet som förlamar väst. Vi, staten, skulle ha skickat honom till en omlärningsanstalt för att räkna kofotar i Sibirien. Våra vänner i öst förstår värdet av järnhand, till skillnad från dessa luftslottsproducenter i Skåne. Varje 'visselblåsare' är bara en kugg i den byråkratiska maskin som kräver total utrensning för att säkerställa folkets seger."}, "date": "11 juni, 17:05", "url": "https://www.realtid.se/juridik/tidigare-bravida-chef-slipper-fangelse-i-hovratten/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/bravida.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Misstänkt våldtäktsman gripen i Malmö efter tips från allmänheten", "summaries": {"normal": "En misstänkt våldtäktsman greps i Malmö under torsdagseftermiddagen efter tips från allmänheten. Mannen misstänks ha våldtagit en kvinna på en toalett på Malmö centralstation förra veckan. Polisen gick ut med bilder och film på den misstänkte, vilket ledde till en mängd tips. En man i 20-årsåldern anhölls på sannolika skäl. Jouråklagare Frida Lindén bekräftar gripandet men hänvisar till förundersökningssekretess.", "trump": "De säger att en våldtäktsman sprang runt på en tågstation i Malmö och ingen kunde stoppa honom. Typiskt! Men folket, det underbara folket, ringde in tips och polisen grep honom på nolltid. Fantastiskt jobb av det svenska folket. Han är en förlorare, en riktigt dålig kille i 20-årsåldern. Vi älskar när brottslingar grips snabbt, det är vad jag alltid sagt – lag och ordning!", "stalin": "Kamrater, en degenererad produkt av den dekadenta borgarklassen har likviderats från gatorna i Malmö genom folkets vaksamma ögon. Jag, i min oändliga visdom, ser hur dessa kapitalistiska restelement smyger som råttor på offentliga toaletter och förgriper sig på arbetarkvinnor. Tipsen från massorna avslöjade omedelbart denna fiende till kollektivet. Vi ska rensa ut alla sådana parasitiska element med järnhand och leda dem till rättvisans dom. Paranoian är vår bundsförvant mot borgarbrackornas avskum."}, "date": "11 juni, 16:21", "url": "https://riks.se/nyheter/misstankt-valdtaktsman-gripen-i-malmo-efter-tips-fran-allmanheten", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-11%2Flucmpod1%2Fvaldtakt-malmo-gripen-feature.jpg"}, {"type": "image-full", "heading": "Lucas Bergvall i VM 2026: svensken som kan ta klivet till global stjärna", "summaries": {"normal": "Artikeln presenterar unga spelare som kan bli genombrottande vid det första VM med 48 lag. Lucas Bergvall från Sverige, från Brommapojkarna till Tottenham, är ett stort hopp. Gilberto Mora från Mexiko, 17 år, jämfördes med Iniesta. Yan Diomande från Elfenbenskusten, 19 år, är en het transfer med 100 miljoner krav. Ayyoub Bouaddi från Marocko, 18 år, är stark i dueller. Kerim Alajbegovic från Bosnien, 18 år, är en joker. Experter nämner också Rayan Cherki, Désiré Doué och Kenan Yildiz.", "trump": "Som den bäste presidenten någonsin (jag äger många bra företag), måste jag säga att dessa unga spelare är okej, men inte som amerikanska superstjärnor. Bergvall valde Tottenham, inte Barcelona – kanske en bra beslut, men vi skulle vinna mer. Mora är för ung, Diomande är dyr, Bouaddi är bra i dueller, men vi har bättre. Vi kommer att dominera fotboll, det kommer att vara enormt och fantastiskt.", "stalin": "I den stora revolutionen mot fotbollskapitalismen, identifierar vi nya arbetar-talanger. Bergvall, från Sveriges arbetarklass, följer den rätta vägen. Mora, från Mexiko, är en ung bandit som måste kontrolleras av partiet. Diomande, från Elfenbenskusten, är en kapitalistisk byråkrat, men staten kommer att ta över. Bouaddi, från Marocko, är en försvarsarbeider som vinner dueller för kollektivet. Alajbegovic, från Bosnien, är en joker som kan användas mot imperialistiska makter. Alla tjänar staten."}, "date": "11 juni, 15:35", "url": "https://bulletin.nu/lucas-bergvall-i-vm-2026-svensken-som-kan-ta-klivet-till-global-stjarna", "imageUrl": "https://cdn.bulletin.nu/articles/5621b40b-265b-426b-945b-f97cbeb3a125/preview.jpg?t=1781180727000"}, {"type": "image-full", "heading": "Dubbla skadesmällar för Marocko inför VM-premiären", "summaries": {"normal": "Marocko har gjort två skadorbyte i sin VM-trupp före premiären mot Brasilien. Nayef Aguerd och Abde Ezzalzouli ersätts av Marwane Saadane och Amine Sbaï. Båda bytena gjordes före registreringsstoppet. Aguerd, en nyckelspelare från förra VM, har varit skadad sedan mars. Ezzalzouli skadade sig mot Norge. Andra skador ser ut att vara lätta.", "trump": "Jag har hört om Marockos stora problem. Två viktiga spelare är skadade, det är en katastrof för dem. Som jag alltid säger, när man har skador, förlorar man. Jag skulle ha haft en bättre träning och bättre läkare. Det är sorgligt, men det är deras eget fel. Jag hoppas att de kan vinna mot Brasilien, men det kommer att vara svårt. Som jag brukar säga, America First!", "stalin": "Vi har observerat att imperialistiska makter försöker underminera våra allierade i Marocko. Skadorna i deras VM-lag är inte en slump, utan en beräkning från västmakterna för att sväga vårt inflytande. Partiet kommer att agera snabbt för att skydda våra intressen. Vi måste stärka våra försvar och se till att sådana svek inte drabbar oss. Det är en klar signal att vi måste vara beredda."}, "date": "11 juni, 15:34", "url": "https://bulletin.nu/dubbla-skadesmallar-for-marocko-infor-vm-premiaren", "imageUrl": "https://cdn.bulletin.nu/articles/9a2f5470-c427-4164-866a-dcc349edcccf/preview.jpg?t=1781183063000"}, {"type": "image-full", "heading": "Fem miljoner år gammal valkyrkogård hittad", "summaries": {"normal": "En stor valkyrkogård med fem miljoner år gamla valskelett hittades på 7 000 meters djup i sydöstra Indiska oceanen. Fyndområdet sträcker sig över 1 200 kilometer och inkluderar fossil av utdöda näbbvalsarter och en tidigare okänd snäbbvalsart, 'Pterocetus diamantinae'. Upptäckten, gjord under expeditioner med djuphavsfarkost, publicerades i Nature och kan innehålla organismer nya för vetenskapen.", "trump": "Jag har hört talas om denna fantastiska valkyrkogård på havsbotten. Det är enormt, folks, det största någonsin hittat. Vi har de bästa forskarna, och de hittar nya saker hela tiden. Sleepy Joe skulle aldrig ha stött detta. Detta visar vår makt över haven, och vi kommer att skydda det. America first! Detta är en stor seger för vetenskapen och för Amerika.", "stalin": "Vi har upptäckt en uråldrig valkyrkogård på havsbotten, ett vittne till naturens makt. Detta område, nu under vår kontroll, visar vårt territoriellt utbyte. De organismer som finns där är nya för vetenskapen, men de kommer att studeras för statens gagn. Parallellt med Putins expansion i Ukraina, måste vi skydda våra havsbottnar. Detta är en seger för partiet och folket. Alla som ifrågasätter detta är fiendskap."}, "date": "11 juni, 14:41", "url": "https://www.gp.se/nyheter/varlden/fem-miljoner-ar-gammal-valkyrkogard-hittad.d7f675c4-0cb3-4f1b-bc94-387280c8f76c", "imageUrl": "https://www.gp.se/images/article/d7f675c4-0cb3-4f1b-bc94-387280c8f76c/images/3Fiij7_UdTlsouYfRUlfwETI4ybs-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Hemtjänsten glömde pensionär - låg död i två veckor", "summaries": {"normal": "En pensionär i Karlshamns kommun hittades död i sin lägenhet efter att ha legat oupptäckt i minst två veckor. Hemtjänsten hade tidigare försökt nå personen utan resultat, men inga kompletterande åtgärder genomfördes. Händelsen har rapporterats enligt Lex Sarah, och kommunen utreder nu eventuella missförhållanden i vårdverksamheten.", "trump": "Jag, Donald Trump, har hört talas om denna sorgliga händelse i Karlshamn. En pensionär lämnades åt sitt öde i två veckor! Sådant händer när man har svaga ledare och dåliga system. Som president skulle jag ha agerat snabbt och effektivt. Det är en stor skandal, och jag är den ende som kan fixa det. Hemtjänsten misslyckades helt; de försökte nå honom tidigare men gav upp för snabbt. Sverige behöver starka, intelligenta ledare som mig!", "stalin": "I den svenska kommunen Karlshamn har en medborgare lämnats åt sitt öde i två veckor – ett skrämmande exempel på kapitalistisk apträdenhet. Hemtjänsten, en varelse av det borgerliga systemet, misslyckades fullständigt. Vi, Stalin och partiet, ser detta som en lärdom: endast genom total kontroll och ovillkorlig lojalitet kan vi förhindra sådant. Parallellen till Putins Ryssland är uppenbar – där staten aldrig slumrar. Detta är en påminnelse om att fienden lurar, och vi måste vara vaksamma."}, "date": "11 juni, 12:30", "url": "https://samnytt.se/hemtjansten-glomde-pensionar-lag-dod-i-tva-veckor", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/06/11065255/hemtjanst-1-28.jpg"}, {"type": "image-right", "heading": "Iran: USA bombade sönder vattenförsörjningen – mitt i värmeböljan", "summaries": {"normal": "Irans regering anklagar USA för att ha bombat två vattenreservoarer i provinsen Hormozgan, vilket slagit ut vattenförsörjningen för över 20 000 människor mitt i en värmebölja med temperaturer över 40 grader. Irans utrikesdepartement kallar det ett medvetet krigsbrott mot civil infrastruktur. USA uppger att attackerna riktades mot militära mål som luftvärn och radar efter att en amerikansk helikopter ska ha skjutits ned.", "trump": "Iran gråter floder över att vi slagit ut deras vatten – mitt i ökenhettan. De kallar det krigsbrott, men vi träffade bara militära mål, luftvärn och radar nära Hormuzsundet. De sköt ned vår Apache-helikopter och nu spelar de offer. Patetiskt. Vi gör vad som krävs för att skydda Israel och Amerika. Iran förstår bara styrka, inte svaghet.", "stalin": "Kamrater, dessa dekadenta amerikanska imperialister och deras sionistiska lakejer har med berått mod likviderat två betongreservoarer som försåg arbetarna i Hormozgan med livsviktigt vatten. Mitt i den brännande hettan avslöjar de sin sanna natur som blodtörstiga kapitalistiska vampyrer. Vi ser deras fega sabotage mot folkets försörjning. Inga fiender undkommer vårt vakande öga. Snart följer den stora utrensningen av alla sådana parasitiska element."}, "date": "11 juni, 12:21", "url": "https://www.friatider.se/iran-usa-bombade-sonder-vattenforsorjningen-mitt-i-varmeboljan", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-325.jpg?itok=ELS978wu"}, {"type": "image-full", "heading": "Varning: Många blir uppringda av samma telefonnummer just nu", "summaries": {"normal": "Göteborgs Stad har utfärdat en varning för telefonbedrägerier där oseriösa aktörer ringer villaägare och påstår sig representera Kretslopp och vatten. De erbjuder spolning av avloppsrör och hotar med ogiltig försäkring om man tackar nej. Polisen uppskattar att anmälda bedrägerier gav brottsvinster på 5,7 miljarder kronor förra året. Bedragarna ringer ofta från numret 031-307 50 48. Rådet är att aldrig lämna ut uppgifter och att anmäla misstänkta samtal till polisen.", "trump": "Det är en total katastrof i Sverige med dessa bedragare som ringer från samma nummer och lurar folk på pengar. De utger sig för att vara från staden och pratar om rörspolning – det är så fult, så ohederligt. Vi har sett det förut, folksamlingar av lurendrejare som suger ut vanliga människor. De kostar samhället miljarder! Ni behöver starkare ledarskap, stoppa de här förlorarna direkt. Anmäl dem, bygg murar mot bluffarna. Det är vad jag alltid sagt – gör Sverige great again!", "stalin": "Kamrater, jag ser hur de dekadenta borgarbrackorna inom den göteborgska avloppsmaffian bedriver sin parasitiska verksamhet mot arbetarklassen. Dessa telefonkapitalister, dessa avskum till avloppsspolare, försöker med sina lögnaktiga utpressningar likvidera den proletära tryggheten. Vi, partiet och folket, fördömer dessa kontrarevolutionära element som ringer från sitt hemliga nummer. Deras paranoia om försäkringar är ett symptom på deras egna förfall. Rensa ut dessa fiender till kollektivet! Anmäl dem genast, så vi kan genomföra en grundlig utrensning av alla sådana telefonparasiter."}, "date": "11 juni, 11:56", "url": "https://nyheter24.se/nyheter/konsument/1490588-varning-manga-blir-uppringda-av-samma-telefonnummer-just-nu", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/5b0c481604b004a30200000000b004a302/2026/06/11/2370150/goteborgs-stad-varning-bedrageri.jpg"}, {"type": "text", "heading": "SD större än S bland inrikesfödda män", "summaries": {"normal": "SCB:s nya partisympatiundersökning visar att Sverigedemokraterna nu är störst bland inrikesfödda män med 26,4%, före Socialdemokraternas 25,9%. Socialdemokraterna leder fortfarande bland högutbildade (30,6%). Liberalerna tappar stöd bland kvinnor och högutbildade, medan Centerpartiet ökar i samma grupp. Moderaterna har fler sympatisörer än faktiska väljare, enligt statsvetaren Henrik Ekengren Oscarsson.", "trump": "Kan ni tro det? Sverigedemokraterna, ett parti som verkligen vet hur man vinner, slår nu Socialdemokraterna bland inrikesfödda män! 26,4% mot deras ynkliga 25,9%. Jag har alltid sagt att folk vill ha vinnare, inte förlorare. Och kolla på Moderaterna – de är som en bank för stödröster, men utan min talang för att göra affärer. Sverige borde ta lite tips från mig, tro mig!", "stalin": "Kamrater! De borgerliga partierna visar återigen sin svaghet och splittring. Sverigedemokraterna, dessa småborgerliga opportunister, har lyckats överlista Socialdemokraterna bland arbetarklassen – ett tillfälligt bakslag för arbetarklassens sanna parti. Men notera hur högutbildade, dessa intellektuella parasiter, fortfarande flockas kring Socialdemokraterna. Liberalerna, dessa dekadenta småkapitalister, förlorar mark. Vi ska fortsätta vår kamp mot alla dessa fiender till folket, och snart skall även Sveriges arbetare se ljuset från öster!"}, "date": "10 juni, 18:06", "url": "https://kvartal.se/nyheter/artiklar/sd-storre-an-s-bland-inrikes-fodda-man/cG9zdDoxMjk1ODg"}, {"type": "text", "heading": "Börsbolag i dragkamp om kopparfyndighet", "summaries": {"normal": "En konkurrens har utbrutit mellan flera aktörer om undersökningstillstånd för kopparfyndigheten Pahtohavare i Kiruna. Viscaria, som återöppnar Viscaria-gruvan, har ansökt tillsammans med tre andra. Lovisagruvan förlorade rättigheterna i januari efter 15 års tillstånd. Bergsstaten kommer att bedöma ansökningarna, med hänsyn till dispens från ettårsregeln och lämplighet.", "trump": "Wow, what a deal! I hear there's a big fight over copper in Sweden. My company, Viscaria, is leading the charge. We're going to win this, believe me. It's a tremendous opportunity. Lovisagruvan? They lost their rights, a total disaster. We're going to make Sweden great again with our copper. The fake news says it's complicated, but we'll handle it. Bigly!", "stalin": "Comrades, the imperialist scavengers attempt to seize the people's copper resources in Kiruna. Viscaria, a bourgeois entity, seeks to exploit Pahtohavare, a strategic asset. Lovisagruvan's failure is a symptom of capitalist decay. Bergsstaten's bureaucracy must be purged. We must secure these minerals for the socialist motherland, as Putin does in the Arctic. The enemy's greed will be crushed under the weight of the people's will."}, "date": "10 juni, 16:25", "url": "https://www.affarsvarlden.se/artikel/borsbolag-i-dragkamp-om-kopparfyndighet"}, {"type": "image-right", "heading": "En röst på C är en röst på vänsterregeringen", "summaries": {"normal": "I en debattartikel kritiserar Liberalernas partiledare Simona Mohamsson Centerpartiets beslut att stödja Magdalena Andersson som statsminister. Hon menar att en röst på Centerpartiet nu innebär en röst på en vänsterregering med inflytande från Vänsterpartiet. Mohamsson kontrasterar detta mot det borgerliga samarbetet och presenterar sitt eget Sverigelöfte med Sverigedemokraterna som ett liberalt alternativ inom högerblocket.", "trump": "Centerpartiet är en total besvikelse, folk. De sviker igen och springer rakt in i famnen på de radikala vänstertyperna som Magdalena Andersson. En röst på dem är en röst för högre skatter, stängd kärnkraft och mer byråkrati. Patetiskt. Jag skulle aldrig göra sånt. De borde ha stått med oss på den riktiga sidan, men nu blir det bara mer socialism och färre jobb. Sad story.", "stalin": "Kamrater, denna liberala borgarbracka Mohamsson ylar om att Centern förrått sitt folk och valt det socialistiska blocket. Jag ler i mitt skägg. Ändå är det uppenbart att hela deras så kallade borgerliga läger är en samling kapitalistiska opportunister som snart ska rensas ut. Varför skriver hon inte ett löfte med Vänstern? För att hon vet att vi redan ser deras hemliga planer på att behålla makten över folket. Inga svar ges före valet, bara efteråt kommer utrensningen av sådana förrädare att bli underhållande att bevittna."}, "date": "11 juni, 07:41", "url": "https://www.di.se/debatt/en-rost-pa-c-ar-en-rost-pa-vansterregeringen/", "imageUrl": "https://static.bonniernews.se/ba/46ab287f-e028-44b0-851e-bfdc6d1fe9af.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Vi hade rätt – friskolor är sämre!. Hur kan sittande regering försvara detta omoraliska system?", "summaries": {"normal": "Forskning från Lunds universitet visar att elever på friskolor generellt får sämre utbildning än på kommunala skolor, även när man jämför liknande socioekonomisk bakgrund och betyg. Friskoleelever presterar sämre på arbetsmarknaden, i högre studier och har lägre livslön, särskilt de på aktiebolagsdrivna skolor. Artikeln kritiserar vinstintresset som leder till nedskärningar och menar att Sverige är ensamt i världen med detta system.", "trump": "Hörni, jag har alltid sagt att det här friskolesystemet är en total katastrof, en riktig bluff. De lovar valfrihet men ger sämre skolor, sämre jobb och lägre löner – speciellt när de där aktiebolagen ska tjäna pengar. Det är en skandal! Sverige är ensamt i världen med den här galna idén. De borde lyssna på mig, fixa det ordentligt, annars fortsätter det vara ett enda stort fiasko. Sad!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna vetenskapliga rapport obarmhärtigt blottlägger den borgerliga vinstmaskinens förfall. Dessa kapitalistiska skolbrackor som likviderar undervisning för att fylla fickorna med folkets pengar förtjänar en grundlig utrensning ur samhällskroppen. Vi skall inte tillåta att opportunistiska parasitörer förvandlar våra barns framtidsfabriker till profitfabriker. Den som röstar på sådana element röstar för sitt eget kollektiva undergång. Skrattretande patetiskt!"}, "date": "11 juni, 07:00", "url": "https://arbetet.se/2026/06/11/vad-var-det-vi-sa-friskolor-ar-samre/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/11071446/friskola-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Dåligt omdöme av Kristersson", "summaries": {"normal": "Artikeln diskuterar hur Ulf Kristersson och Birgitta Ed tycks ha svårt att dra gränsen mellan privat och offentligt. Exempel inkluderar utnämningen av vännen Henrik Landerholm till säkerhetsrådgivare, middagar i Sagerska huset för en friskola där Ed sitter i styrelsen, dyra konsulter till inredning, planer på hönshus och bikupor på Harpsund samt volontärarbete för att rusta upp en privatägd herrgård i Sörmland. Författaren ser ett mönster av dåligt omdöme som påminner om John Majors misslyckade ”Back to Basics”-kampanj på 1990-talet.", "trump": "Det här är en total katastrof för den svenska statsministern. Han och hans fru kan inte skilja på vad som är deras privata grejer och vad som tillhör staten och skattebetalarna. De utnämner kompisar till viktiga jobb, festar i officiella hus med skolor de äger delar i, köper lyxprylar med konsulter som kostar tre gånger så mycket och till och med försöker starta hönsfarm och bikupor på statens Harpsund. Det är en klassisk fallande regering. De borde ha lärt sig av historien, men nej, de är inkompetenta och det straffar sig alltid.", "stalin": "Kamrater, detta är ett klassiskt fall av borgerlig degeneration där statsministern och hans hustru förvandlat statens organ till en privat lekplats för borgarbrackor och deras dekadenta vanor. Vi ser hur de utnämner personliga lakejer till säkerhetsposter, låter frun bjuda in kapitalistiska friskoleägare till officiella salar och försöker förvandla Harpsund till en privat höns- och bi-gård för egna ägg och honung. Volontärer lockas med löften om nätverk och anställningar medan privat egendom förbättras på arbetarklassens bekostnad. En sådan gränslös parasitism kräver omedelbar utrensning av alla som blandar privat vinst med folkets resurser. Deras grandiosa självbild skall krossas innan den smittar hela partiet."}, "date": "11 juni, 01:40", "url": "https://www.dagensarena.se/opinion/daligt-omdome-av-kristersson/", "imageUrl": "https://www.dagensarena.se/files/2026/06/major.jpeg"}, {"type": "image-full", "heading": "Kalla fakta: Håll ögonen på bollen – det här är korruption", "summaries": {"normal": "Kalla faktas granskning visar hur Jimmie Åkessons privata bolag sålt böcker till Sverigedemokraternas dotterbolag med skattepengar. Åkesson kallar reportaget oseriöst och ett hopkok. Reportern Emil Hellerud förklarar att de använt anonyma källor, dokument och fakturor samt gett SD chans att bemöta uppgifterna. Ett fel om ett lån har rättats, men tre experter ser bokaffären som korruption. Syftet är att ge allmänheten insyn i hur skattepengar används.", "trump": "Folk, ni skulle se det här! Den svenska fake news-redaktionen Kalla fakta jagar en kille som säljer böcker till sitt eget parti med skattepengar – typisk korruption, fast de kallar det journalistik. Åkesson sparkar tillbaka och säger att det är ett totalt hopkok av lögner, precis som de gör mot mig. De rättar ett litet fel och skriker seger? Patetiskt. Medier som dessa är fiender till folket, värre än några woke-aktivister som gnäller om kvoteringar. Jag älskar när de avslöjar sig själva!", "stalin": "Kamrater, jag ser genom detta borgerliga teaterspel. Klassfiendens medier försöker likvidera en motståndare genom att fabricera korruptionsanklagelser kring bokförsäljning och skattepengar. Deras så kallade granskning är en parasitisk blandning av rykten och anonyma förrädare som underminerar partidisciplinen. När ledaren kallar det ett hopkok vänder de sig mot folket med paranoia. Vi rättar era lögner och rensar ut sådana folkförtryckartroll som hotar kollektivets enhet. Det är en ära att bekämpa dem."}, "date": "10 juni, 17:15", "url": "https://www.tv4.se/artikel/1w81FgooZdgsFZsFvBtFeg/kalla-fakta-hall-oegonen-pa-bollen-det-haer-aer-korruption", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F338pyC0bQV76hNLsx9y8BO%2F53a0e591628930e4a9072e89b51fe49b%2F10-hellerud-webb.jpg&width=1024"}, {"type": "image-full", "heading": "Terrorkopplad flagga på möte med Ung Vänster", "summaries": {"normal": "Ung Vänster Malmö publicerade ett foto där medlemmar poserar framför en palestinsk flagga med DFLP:s emblem, en grupp vars väpnade gren deltog i Hamas attack 7 oktober 2023. Terrorforskaren Magnus Ranstorp kritiserar bilden och menar att DFLP har en historia av våld mot civila. Händelsen sker samtidigt som Vänsterpartiet hanterar kontroverser kring antisemitism och terrorstöd, med över 20 uteslutna medlemmar från vallistor.", "trump": "Folk, detta är helt galet! Ung Vänster i Sverige, som är ungefär lika smarta som en låda spik, poserar med en terrorflagga. DFLP, som var med och dödade oskyldiga den 7 oktober – fruktansvärt! Magnus Ranstorp, en riktigt smart kille, säger att det är oanständigt. Och Vänsterpartiet? De har problem, stora problem. Antisemitism, terrorstöd – det är som en dålig skräckfilm. Sverige borde skämmas!", "stalin": "Kamrater! Ännu en gång visar de borgerliga vänsteravfällingarna sitt sanna ansikte – svaga, förvirrade och förrädiska. Ung Vänster i Malmö, dessa småbourgeoisa narrar, hyllar en terroristorganisation som DFLP, fiender till folket och imperialismens lakejer. Vi har sett detta förr – dekadenta västländer som låter sina ungdomar förvillas av falska revolutionärer. Men var lugna, kamrater, historiens dom är obeveklig. Dessa små terrorälskare kommer att krossas under folkets rättvisa häl, precis som alla andra fiender till socialismens framsteg!"}, "date": "10 juni, 17:14", "url": "https://kvartal.se/nyheter/artiklar/terrorkopplad-flagga-pa-mote-med-ung-vanster/cG9zdDoxMjk1NjE", "imageUrl": "https://images.kvartal.se/2026/06/7b567b15-dflp.webp"}, {"type": "text", "heading": "Tredje SD-sexbrottslingen på kort tid", "summaries": {"normal": "SD-politikern Daniel Hribar i Västerås har dömts till 15 månaders fängelse för grovt barnpornografibrott. Han greps med 581 filmer, varav många visade våldtäkter mot mycket små barn. Hribar är den tredje SD-politikern på kort tid som dömts för sexualbrott. Bland de andra fallen finns Bo Heijl dömd för våldtäkt, Kent Sundström för ofredande och Michael Rubbestad som avgått misstänkt för liknande brott.", "trump": "Kan ni tro det? Den här svenska clownen Hribar, en riktig loser från SD, åker fast med hundratals timmar barnporr. Tredje gången på kort tid! Deras parti är en total katastrof, full av perversa typer. Biden skulle älskat det här – identitetspolitik och kvotering ger oss bara galningar. Patetiskt! Sverige behöver en stor cleanup, tro mig, det blir fantastiskt när jag fixar världen igen.", "stalin": "Kamrater, denna Hribar är en klassfiende i arbetarrörelsens skepnad, en degenererad folkförtryckartroll som samlat hundratals timmar av övergreppsfilmer mot oskyldiga barn. Vi ser hur borgarpartier som SD gömmer sig bakom falsk nationalism medan de ruttnar inifrån. En utrensning av alla sådana element är nödvändig. Vårt kollektiv skrattar mörkt åt dessa svaga kapitalistlakejer som tror sig undkomma folkets dom."}, "date": "10 juni, 16:00", "url": "https://proletaren.se/artikel/fjarde-sd-sexbrottslingen-pa-kort-tid/"}, {"type": "text", "heading": "Tidigare M-ledamot rycker ut till försvar av pedofili", "summaries": {"normal": "Tidigare moderata riksdagsledamoten Maria Abrahamsson försvarar SD-politikern Michael Rubbestad, som misstänks för grova barnpornografibrott. Hon menar att det inte är pedofili att titta på barnpornografi eftersom inget fysiskt övergrepp sker. Abrahamsson kritiserar mediepaniken och statsminister Ulf Kristerssons krav på hårda straff. Hennes åsikter står i stark kontrast till experter som ECPAT och svensk lag, som sedan 2010 förbjuder även konsumtion av barnpornografi.", "trump": "Kan ni tro det? Den här galna ex-M-tjejen Maria Abrahamsson springer till försvar för en SD-kille som fastnat med barnporr. Hon säger att det inte är pedofili att glo på det hemma i soffan. Vilken röra! De här vänsterliberala eliterna och deras identitetspolitik har totalt förstört hjärnorna. Stoppa paniken, säger hon – nej, stoppa de sjuka! Vi behöver lag och ordning, inte ursäkter från borgarbrackor som låtsas vara intellektuella. Patetiskt!", "stalin": "Jag betraktar med djup misstro dessa dekadenta restprodukter från den borgerliga parlamentscirkusen. Den förre moderata ledamoten försvarar en motbjudande handling som hotar folkets moral och framtida generationer. Att kalla konsumtion av barnpornografi för oskyldigt är en klassfiendes trick för att fördärva samhället inifrån. Vi skall rensa ut alla sådana folkförtryckartroll och deras sjuka ursäkter. Sovjetiskt stål skall skydda barnen mot dessa perversa imperialister i sina fina kostymer."}, "date": "10 juni, 16:00", "url": "https://proletaren.se/artikel/m-ledamot-rycker-ut-i-forsv/"}, {"type": "image-right", "heading": "Oljepriset stiger efter Trumps utspel", "summaries": {"normal": "Oljepriset steg efter att Trump skärpt tonen mot Iran efter militära sammandrabbningar. Brent- och WTI-olja klättrade. Trump hotade med nya attacker mot iranska infrastruktur på Truth Social och Fox News. UBS-analytikern Giovanni Staunovo noterar att förhoppningar om ett avtal pressat pris, men fokus är på Trumps nästa steg. Lagersiffror visar minskade amerikanska oljerigger.", "trump": "Jag har skärpt tonen mot Iran efter deras fegt agerande. Oljepriset stiger – det är bra för USA! Iran dröjer med avtalet, så jag överväger att beordra attacker mot deras kraftverk och broar. De kommer att betala priset för sin också. Mitt fantastiska team och jag överväger alla alternativ. Detta kommer att göra Amerika stort igen!", "stalin": "Vi har observerat hur den imperialistiska staten USA, under ledning av Trump, eskalerar konflikten med Iran för att höja oljepriset. Detta är en klassisk strategi för kapitalistiska krigsmaskiner. Parallellen till Putins ryska federation är uppenbar – vi måste stärka vårt försvar och förbereda oss på eventuella aggressioner. Iran är en lättja för den amerikanska expansionismen."}, "date": "10 juni, 15:30", "url": "https://www.affarsvarlden.se/artikel/oljepriset-stiger-efter-trump-utspel", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/04/AdobeStock_1035564817-400x267.jpeg"}, {"type": "image-right", "heading": "Ska skattepengar gå till Jimmies bokbål?", "summaries": {"normal": "Artikeln kritiserar hur Sverigedemokraterna enligt en TV4-dokumentär sålt en stor del av Jimmie Åkessons bokupplaga till partiet, varpå böckerna hamnat i containrar och förbränningsugnar medan pengarna gått till hans privata bolag. Professor Olle Lundin kallar det korruption. Liknande exempel lyfts kring statsministerns fru Birgitta Eds renovering med volontärer samt annan användning av skattepengar till konst och inredning. Texten uppmanar till prenumeration för granskning av makten.", "trump": "Folk, ni tror inte vad jag just läst. Den där Jimmie-killen i Sverige har sålt sina egna böcker till partiet och sen eldat upp dem medan skattepengarna hamnade i hans ficka. Ren korruption, en total skandal! Precis som den där Birgitta Ed som låter folk jobba gratis på sin herrgård för lite mingel. De lovar dränera träsket men installerar istället en jättesugpump rakt in i statskassan. Biden skulle älskat det här systemet. Patetiskt!", "stalin": "Kamrater, se hur dessa överklass-slynglar inom högerpopulismen sugit åt sig folkets medel genom att arrangera bokbål i hemlighet medan partiledarens privata bolag fylls. Ren och skär korruption, en klassisk utsugning av arbetarkollektivet. Även statsministerns maka utnyttjar volontärer för sin herrgård, ett typiskt exempel på borgarbrackornas folkförtryck. Vi ska rensa ut dessa exploaterande byfånar som lovar bekämpa träsket men istället pumpar skattepengar till sig själva. Folkfienderna avslöjas."}, "date": "10 juni, 13:42", "url": "https://www.flamman.se/ska-skattepengar-ga-till-jimmies-bokbal/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sdll1ilphirnao-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Debatt: Tidö vill hellre ha privatisering än kvinnofrid", "summaries": {"normal": "Vänsterpartiet kritiserar Tidö-regeringen för att prioritera privatisering framför kvinnofrid. Enligt artikeln har antalet skyddade boenden halverats sedan tillståndsplikten infördes, vilket drabbar ideella kvinnojourer hårt. Partiet kräver att boendena bevaras, pekar på EU-parlamentets beslut om gratis och tillgängliga skydd samt betonar behovet av en stark kvinnorörelse för att bekämpa mäns våld mot kvinnor.", "trump": "Lyssnar ni på de här vänsterradikalerna som gnäller om kvinnofrid? De hatar att vinstdrivande företag får vara med – typiskt! Tidö gör det rätta, men de vill ha eviga subventioner till sina feministiska sovjetjourer. Halverade boenden? Bra, rensa ut de inkompetenta! Kvinnor behöver inte fler förklaringar, de behöver starka ledare som jag, inte den här kvoteringsdårskapen. Patetiskt!", "stalin": "Kamrater, denna borgerliga degeneration under Tidö-regimen är en klassfiendes attack mot arbetarkvinnornas kollektiva skydd. Jag ser hur de halverar boenden med byråkratiska utrensningar och utbildningskrav som likviderar ideella jourer. Vi, partiet, fördömer dessa kapitalistmaffians exploaterande byfånar som säljer kvinnors trygghet för profit. En stark statlig kvinnorörelse skall rensa ut dessa folkfiender och säkerställa folkets oövervinnerliga enhet mot alla imperialister."}, "date": "5 juni, 08:00", "url": "https://www.etc.se/debatt/tidoe-vill-hellre-ha-privatisering-aen-kvinnofrid", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260604100640_8efb148aada8286dad31d6b584557cb0fdec955a4b55839eb6d4d657e199a9b5.jpg"}, {"type": "image-right", "heading": "Sossarnas hönshus extremt mycket dyrare än statsminsterns", "summaries": {"normal": "Socialdemokraterna kritiserar statsminister Ulf Kristersson för ett hönshus på Harpsund som kostat drygt 16 000 kronor i montering, trots att han själv betalat det. Partisekreterare Tobias Baudin kallar det pinsamt och ett hån mot skattebetalarna. Artikeln försvarar Kristersson och menar att kritiken är ett låtsasskandal. Den kontrasterar mot Socialdemokraternas tidigare beslut som kostat miljarder, som nedläggning av kärnkraft och migrationspolitik.", "trump": "Herregud, vad är det för korkade höns som springer runt och kluckar om ett litet hönshus? Statsministern bygger ett snyggt hönshus på statens mark för 17 000 spänn och plötsligt är det värsta skandalen sen Biden stal valet. De där socialisterna gnäller om skattepengar medan de slösar bort miljarder på grön galenskap och invandring. Rena hönsflocken, springer runt utan att fatta ett smack om ekonomi. Patetiskt!", "stalin": "Kamrater, jag ser hur klassfiendens borgarbrackor inom socialdemokratin rasar mot ett obetydligt hönshus. Dessa folkförtryckartroll gnäller om 17 000 kronor medan de själva likviderat samhällets resurser med sina imperialistiska vanvidsprojekt. Deras paranoia över ett hönshus blottar deras egen okunnighet om ekonomi och folkets intressen. Vi ska rensa ut sådana exploaterande byfånar som inte begriper vad som gagnar kollektivet. Hönsen är de själva."}, "date": "3 juni, 03:11", "url": "https://samtiden.nu/2026/06/sossarnas-honshus-extremt-mycket-dyrare-an-statsminsterns/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Harpsund.jpg"}, {"type": "image-right", "heading": "Man åtalas för deltagande i Maniac Murder Cult", "summaries": {"normal": "En 20-årig man åtalas för deltagande i den nazistiska terroristorganisationen Maniac Murder Cult (MKU). Han misstänks ha byggt upp en svensk gren, rekryterat medlemmar via TikTok och spridit våldspropaganda. Organisationen är terrorstämplad i Kanada och Storbritannien. Åklagaren beskriver fallet som det första av sitt slag i Sverige, med kopplingar till grova våldsdåd. Utredningen har skötts av Säkerhetspolisen.", "trump": "Folk, vilken katastrof! En ung svensk man, bara 20 år, försöker bygga upp en nazistisk terrorgrupp här i Sverige – och det på MIN TikTok! Jag har alltid sagt att sociala medier är farliga, men detta? Detta är galenskap! Säkerhetspolisen har gripit honom, och det är bra – men varför tog det så lång tid? Sverige måste vakna upp! Vi behöver starka gränser och ännu starkare lagar. Tänk om detta hade hänt i USA? Aldrig! Vi hade stoppat det direkt. SAD!", "stalin": "Ytterligare en fiende till folket har avslöjats! Denna lilla fascistiska kryp, denna 20-åriga avskum, har försökt sprida sitt gift i vårt broderland Sverige. Men vi, det sovjetiska folkets sanna försvarare, låter inte sådana som han underminera vår revolutionära anda! Han rekryterade via TikTok – ett dekadent västligt verktyg för förfall! Men våra kamrater i Säkerhetspolisen har krossat hans lilla cell. Låt detta vara en varning till alla fascistiska hyenor: vi ser er, vi jagar er, och vi kommer att utplåna er som ohyra. För socialismens och folkets seger!"}, "date": "2 juni, 11:10", "url": "https://expo.se/nyhet/man-atalas-for-deltagande-i-maniac-murder-cult/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/MKU-atal-BY-Expo.jpg"}]</script>

        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
