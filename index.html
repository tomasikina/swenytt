ht", "heading": "Varför delar Vårruset ut rakhyvlar till 12-åringar?", "summaries": {"normal": "Ledaren Somar Al Naher kritiserar Vårruset för att ha delat ut rosa rakhyvlar till 12-åriga deltagare i goodiebags. Hon ifrågasätter varför skönhetsideal tränger in även i evenemang som främjar hälsa och inkludering. Al Naher menar att budskapet underminerar syftet med loppet och påminner om tidigare kontroverser, som städprodukter 2015. Hon föreslår att sponsorer som BIC kunde främja mer positiva budskap, som självacceptans eller kreativitet.", "trump": "Jag såg den här artikeln om Vårruset i Sverige – helt galet! De ger små tjejer rakhyvlar, som om de inte kan springa utan att tänka på benen. Vilken katastrof! Vårruset är ett bra lopp, men någon där har helt klart tappat det. BIC, som gör rakhyvlarna, borde skämmas. De tillverkar pennor också – varför inte ge tjejerna pennor och säga 'skriv er framtid'? Istället för att trycka ner dem med skönhetsfixering. Svagt, mycket svagt. Sverige borde ta efter USA – vi vet hur man gör evenemang rätt!", "stalin": "Kamrater! Ännu ett kapitalistiskt sabotage mot våra unga pionjärers medvetande! Dessa borgerliga arrangörer, med sina rosa rakhyvlar, försöker förgifta våra flickors sinnen med dekadenta skönhetsideal. Vi har sett detta förr – 2015 delade de ut städprodukter, som om kvinnor vore slavar under kapitalets ok. Men folket genomskådar deras lömska planer! BIC, detta imperialistiska verktyg, borde förstatligas och omvandlas till att producera pennor för revolutionens propaganda. Låt flickorna skriva manifest, inte raka benen! Fienderna till arbetarklassen kommer att krossas!"}, "date": "22 maj, 16:39", "url": "https://www.etc.se/ledare/varfoer-delar-vaarruset-ut-rakhyvlar-till-12-aaringar", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "image-right", "heading": "27 yrken slipper lönekrav för arbetskraftsinvandring", "summaries": {"normal": "Regeringen och Sverigedemokraterna inför högre lönekrav för arbetskraftsinvandring från 1 juni, men 27 yrken, däribland undersköterskor och vårdbiträden, undantas. Undantagna yrken kräver 75% av medianlönen (ca 27 800 kr), medan andra kräver 90% (33 390 kr). Beslutet har mött kritik från arbetsgivare och facket, som menar att många redan anställda riskerar utvisning. Vårdbiträdet Flavier Mwanga hoppas kunna återvända till Sverige trots tidigare utvisning.", "trump": "Jag måste säga, Sverige har verkligen gjort det igen – de höjer lönekraven för invandrare, men sen gör de undantag för 27 yrken. Vilket kaos! Undersköterskor och vårdbiträden får jobba för mindre, men ändå tjänar de mer än vad många svenskar gör. Och dessa liberaler och Sverigedemokrater bråkar om det som om det vore världens största problem. Jag skulle fixa det på en dag – bygg en mur runt äldreboendena och låt de som verkligen vill jobba komma in!", "stalin": "Kamrater! Sverige, denna lilla borgerliga republik, försöker återigen reglera arbetskraften med lönekrav som en kapitalistisk piska. Men till och med de inser att deras sjukvård skulle kollapsa utan våra proletära bröder och systrar från fjärran länder. 27 yrken undantas – ett svagt försök att dölja deras misslyckande. Vi i Sovjetunionen – förlåt, jag menar Ryssland – skulle lösa personalbristen med järnhand och kollektiv disciplin. Och dessa liberaler som bråkar? De borde skickas till Gulag för ineffektivitet!"}, "date": "22 maj, 12:45", "url": "https://arbetet.se/2026/05/22/27-yrken-slipper-lonekrav-for-arbetskraftsinvandring/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/22114954/forssell-och-britz.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Nu prövas om rättsväsendet förstått 764", "summaries": {"normal": "Umeå tingsrätt prövar ett omfattande åtal mot en 18-årig man, misstänkt för 77 brott kopplade till den högerextrema nätmiljön 764. Brotten inkluderar mordförsök, sexualbrott, självmordsuppmaningar och djurplågeri. Åtalet testar rättsväsendets förmåga att hantera modern, nätbaserad extremism, där brottsligheten sker digitalt och gränsöverskridande. Tidigare domar har kritiserats för att inte stoppa brottsligheten, men nu hoppas åklagaren på en mer offensiv tolkning av lagen.", "trump": "Folk, detta är helt galet! En 18-åring i Sverige, ledare i denna sjuka 764-grupp, åtalas för 77 brott – mordförsök, våldtäkter, till och med djurplågeri! Och vet ni vad? Svenska rättsväsendet har misslyckats totalt tidigare. De gav en 15-årig brottsling husarrest med internet – som att ge en pyroman tändstickor! Men nu, tack och lov, verkar de äntligen vakna. Jag har alltid sagt, internet är farligt, men ingen lyssnar på mig. Nu får vi se om de kan hantera detta – annars får jag nog ta över!", "stalin": "Kamrater, ännu en gång visar den borgerliga västvärldens förfall sitt fula tryne. Denna så kallade '764' är inget annat än en samling degenererade, antisociala element som sprider kaos via sina kapitalistiska leksaker – datorer och telefoner. Svenska rättsväsendet, svagt och naivt, har länge underskattat detta hot. Men nu, under ledning av våra klarsynta kamrater, måste vi krossa denna digitala kontrarevolution! Offren är oskyldiga medborgare, och dessa brottslingar – dessa sadistiska maskiner – måste utplånas. Låt detta bli en varning: Sovjetunionen, eller dess moderna arvtagare, tolererar inte sådant förräderi. Vi ska rensa upp, även på nätet!"}, "date": "18 maj, 16:04", "url": "https://expo.se/kommentar/nu-provas-om-rattsvasendet-forstatt-764/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Kopia-av-Kommentar-Analys-Webb-1.jpg"}, {"type": "image-right", "heading": "Christoffer Jonsson: Palestinska staten vill att Israel betalar palestinska terrorister", "summaries": {"normal": "Palestinska myndigheten på Västbanken betalar systematiskt palestinska terrorister som attackerat Israel via sin så kallade 'pay for slay'-policy. Israel har dragit in sitt ekonomiska stöd till myndigheten, som leds av Mahmoud Abbas, på grund av detta. Abbas har erkänt att pengar går till fångar i israeliska fängelser. EU och Norge finansierar indirekt dessa utbetalningar, men EU har börjat villkora sitt stöd. Kritiker menar att myndigheten bara byter namn på policyn för att fortsätta belöna terrorism.", "trump": "Vilken katastrof! Palestinska myndigheten, med Abbas i spetsen, betalar faktiskt terrorister för att döda israeler – och EU och Norge finansierar det! Jag sa ju att man inte kan lita på dessa människor. Israel slutade betala, smart drag, men västvärlden fortsätter skicka miljarder som hamnar i terroristernas fickor. Löften från Abbas? Haha, lika värdelösa som Bidens minnesluckor. Sluta betala, sluta stödja terrorism – enkelt!", "stalin": "Kamrater! Här ser vi återigen hur den sionistiska imperialismens lakejer förvränger sanningen. Palestinska myndigheten, under vår kära broder Abbas, belönar hjältar som kämpar mot den fascistiska israeliska ockupationen. Naturligtvis skriker västpropagandan om 'terrorism' – samma väst som finansierar dessa hjältars kamp! EU och Norge pumpar in pengar, men när sanningen kommer fram, backar de som rädda kaniner. Vi i Kreml förstår: revolutionen kräver offer, och hjältar ska belönas. Abbas? En sann bolsjevik i hjärtat!"}, "date": "21 maj, 19:00", "url": "https://samtiden.nu/2026/05/christoffer-jonsson-palestinska-staten-vill-att-israel-betalar-palestinska-terrorister/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/entill-640x360.png"}, {"type": "image-right", "heading": "Därför saknar vi fyrbäddssalen på BB", "summaries": {"normal": "Artikeln diskuterar det ökade behovet av social friktion i en tid där teknik och bekvämlighet isolerar oss i privata bubblor. Utgångspunkten är en debatt om fyrbäddssalar på BB, där många minns gemenskapen positivt, trots dagens krav på avskildhet. Vidare belyses hur försvinnandet av arenor som tvättstugor och värnplikten påverkar samhället. Genom minskad kontakt med främlingar riskerar vi att förlora förståelsen för våra medmänniskor, vilket enligt Naomi Klein kan göda radikalisering och misstänksamhet.", "trump": "Hörde om det här med BB i Sverige. De har inga egna rum längre, och folk klagar! Men vet ni vad? Många saknar de gamla salarna. Det var bättre förr, man pratade, man lärde känna folk. Idag vill alla sitta i sina små bubblor med sin matleverans. Det är tråkigt, väldigt tråkigt. Vi behöver människor som möts, inte som isolerar sig. De där ställena som tvättstugor? Det är där riktiga amerikaner – eller svenskar – skapar gemenskap. Fantastiskt, eller hur?", "stalin": "Vi ser hur det individualistiska väst förfaller i sin egen bekvämlighet. De låser in sig i sina 'bubblor', rädda för den enkla mänskliga friktionen som vi i staten alltid har fostrat. Att sakna en fyrbäddssal är ett tecken på borgerlig dekadens; de borde vara tacksamma för att staten ens tillhandahåller sängar. De där 'tvättstugefilosoferna' förstår inte att solidaritet inte är en frivillig aktivitet – det är ett tvångsarbete för det allmänna bästa. Vi bygger en mur mot isoleringen, medan de bygger sin egen undergång."}, "date": "19 maj, 11:00", "url": "https://www.flamman.se/darfor-saknar-vi-fyrbaddssalen-pa-bb/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/barnmorska-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Ledarkolumn Gabriella Kärnekull Wolfe:", "summaries": {"normal": "En svensk domstol har beslutat att sexårige Albin ska bo ensam med sin pappa, trots att fadern tidigare dödat familjens kanin och barnen uppvisat stark rädsla. Modern Ida och hennes äldre son Mille har vittnat om våld, men domstolen anser ändå att ensam vårdnad är bäst för Albin. Socialtjänsten och skolan har flaggat för risker, men beslutet står fast. Ida överväger nu att låta socialtjänsten omhänderta barnen för att skydda dem.", "trump": "Jag läste om det här galna fallet i Sverige – helt otroligt! En pappa som dödar sitt barns kanin genom att stampa på den, och ändå ger domstolen honom ensam vårdnad. Vad är det för system? Sverige brukade vara bra, men nu är det bara kaos. Barnen är livrädda, mamman desperat, och vad gör domstolen? Ingenting! Jag skulle aldrig låta det hända i USA. Vi skyddar våra barn – Sverige borde ta efter!", "stalin": "Kamrater, ännu en skandal i den borgerliga rättsstaten! En far, som med sina egna händer krossade barnets oskyldiga husdjur, belönas nu med ensam vårdnad över sitt barn. Domstolarna, dessa lakejer för kapitalets intressen, ignorerar barnens skrik och moderns desperation. Socialtjänsten? En papperstiger! Vi skulle aldrig tolerera sådan svaghet. Låt oss visa väst hur man skyddar barn – genom att omgående omhänderta dem och ge dem en trygg framtid i socialismens famn. Den svenska bourgeoisin har misslyckats – deras system ruttnar!"}, "date": "22 maj, 12:18", "url": "https://www.etc.se/ledarkolumn/pappa-stampade-ihjael-albins-kanin-faar-ensam-vaardnad", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260522090520_1aec98aeebab0c7d5eb88d1eb39fd9d00fd2e5be36e154a778d44b054889ca3e.jpg"}, {"type": "image-right", "heading": "Att Lars blev tvångsplacerad gjorde att han tog sitt liv", "summaries": {"normal": "Lars Hjalmarsson, 53, tog sitt liv efter att ha tvångsplacerats på Volvo i Olofström, där han arbetat i 36 år. Hans hustru berättar om händelserna som ledde till dödsfallet. Lars omplacerades efter en konflikt med chefen, utan introduktion eller stöd. Volvo nekar att dödsfallet var arbetsrelaterat och vägrar dela utredningsunderlag. Artikeln belyser hur brist på inflytande över arbetet kan leda till psykisk ohälsa och suicid, särskilt bland socioekonomiskt utsatta grupper.", "trump": "Jag läste om den här tragiska historien i Sverige – otroligt sorgligt! En kille, Lars, jobbar 36 år på Volvo, ett företag som inte vet hur man behandlar sina anställda, believe me. Plötsligt flyttar de honom till någon källare, ingen introduktion, ingenting! Och sedan, very sad, tar han livet av sig. Volvo säger 'nej, nej, det var inte vårt fel' – typiskt! De borde skämmas. Jag skulle aldrig låta sånt hända i mitt företag. Fantastiska människor förtjänar fantastisk behandling, och det här? Total katastrof!", "stalin": "Kapitalistiska hyenor på Volvo visar återigen sin sanna natur. En lojal arbetare, Lars, sliter i 36 år för att sedan kastas åt sidan som en trasig maskindel. De skickar honom till 'Källaren' – en avdelning för 'oönskade element', precis som vi skickade fiender till Gulag. Men till skillnad från oss, som åtminstone gav dem en chans att 'omskolas', ger Volvo bara tystnad och förakt. Och sedan undrar de varför folk tar livet av sig! Psykisk ohälsa? Nej, det är klassförtryck, ren och skär. Vi i Sovjet visste hur man hanterade sådana här företag – med en kula i nacken eller tio år i Sibirien. Nu för tiden är det Putin som tar över sådana här fall – kanske dags att skicka en delegation till Sverige?"}, "date": "22 maj, 07:00", "url": "https://arbetet.se/2026/05/22/att-lars-53-blev-tvangsplacerad-gjorde-att-han-tog-livet-av-sig/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/21141617/lars-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Lamotte förlorade körkortet – hängde ut handläggaren", "summaries": {"normal": "Debattören Joakim Lamotte hängde ut en handläggare på Transportstyrelsen med namn och bild efter att ha förlorat körkortet. Lamotte antydde i ett inlägg att handläggarens politiska åsikter skulle påverka beslutet, vilket ledde till en hatstorm i kommentarsfältet. Efter kritik raderade Lamotte inlägget och hävdade att det var ironiskt, vilket kritiker avfärdar. Juridiska experter menar att agerandet befinner sig i en gråzon men sannolikt inte leder till åtal.", "trump": "Joakim Lamotte – en mycket populär kille, en av de största, det kan jag säga er! Han blev orättvist behandlad av den där byråkraten, en total katastrof. Han visade upp sanningen, de vill tysta honom precis som de försöker tysta mig! Media kallar det förtal, jag kallar det yttrandefrihet. Sedan bad han om ursäkt, vilket var synd. Han borde ha stått på sig! Det är en häxjakt, en ren och skär häxjakt mot alla oss som faktiskt säger som det är.", "stalin": "Vi har observerat denna så kallade 'influencer' Lamotte. Vilken svaghet att hänga ut en liten kugge i maskineriet för att sedan fega ur och tala om ironi! Om en handläggare hindrar en medborgare, bör det lösas genom statens fasta hand, inte genom pajasfasoner på internet. Att låta en fiende av ordningen – likt de vi krossar i öst – få härja fritt är att bjuda in till kaos. I vår stat hade han lärt sig disciplin betydligt snabbare än hos Transportstyrelsen."}, "date": "21 maj, 22:01", "url": "https://www.tv4.se/artikel/7wXEgmOZi3oYovjx53qYxr/joakim-lamotte-foerlorade-koerkortet-haengde-ut-handlaeggaren", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7rAZViTWlM8CdUw3AhnvZw%2F6bdab0d844f73f3d04554b15f0794864%2FLAMPTTE_PUFF.png&width=120"}, {"type": "image-full", "heading": "Därför ska du sluta låta åldern göra jobbet", "summaries": {"normal": "Artikeln reflekterar över ett kinesiskt ordspråk om ålder och dess betydelse i dagens samhälle. Den menar att ålder ofta reduceras till en siffra, medan identiteten egentligen formas av erfarenhet och självförtroende. Författaren kritiserar hur samhället sätter etiketter baserat på ålder och uppmanar till frihet från yttre bedömningar. Istället för att fokusera på siffror bör man fråga sig vad man vill uppnå.", "trump": "Lyssna här, folk! Det här med ålder är helt överdrivet. Jag, Donald J. Trump, är beviset – ingen bryr sig om siffror när man har framgång! Det kinesiska ordspråket? Smart, men vi vet alla att jag är tidlös. Unga är naiva, gamla är visare – men jag? Jag är bara fantastisk. Sluta jämföra er! Fokusera på att vinna, precis som jag alltid gör. Ålder är bara en distraktion för förlorare!", "stalin": "Kamrater! Detta så kallade 'ordspråk' är en borgerlig avledningsmanöver för att dölja klassfiendens förtryck. Ålder är inte en siffra – det är en frontlinje! De unga är naiva offer för kapitalistisk propaganda, de äldre är utbrända av systemet. Men vi, det sovjetiska folket, vet sanningen: erfarenhet är vapen, och självförtroende är ammunition. Låt inte imperialistiska etiketter som 'för ung' eller 'för gammal' splittra oss! Enade krossar vi fiendens Excel-ark med järnnäven!"}, "date": "23 maj, 00:54", "url": "https://www.dagensps.se/halsa/darfor-ska-du-sluta-lata-aldern-gora-jobbet/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/3-890.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Timanställda i äldreomsorgen ökar. Ingrid tvingades stressa i väg barnen för att få jobb.", "summaries": {"normal": "Timanställningar inom äldreomsorgen ökar i Sverige, vilket skapar osäkerhet för anställda och riskerar vårdkvaliteten. I Munkfors har man dock minskat andelen timanställda genom fasta anställningar och heltidstjänster. Två undersköterskor, Camilla och Ingrid, berättar om hur deras liv förbättrats efter övergången till tryggare anställningar. Regeringen planerar att se över frågan för att säkerställa kontinuitet i vården.", "trump": "Lyssna här, Sverige! Äldreomsorgen är en katastrof – timanställda överallt, ingen vet vem som jobbar imorgon! Men i Munkfors, där har de fixat det. Fasta jobb, bra löner – fantastiskt! Jag skulle kunna göra samma sak i USA, men här snackar vi Sverige. Och vet ni vad? De där timanställda, de stressar runt som galningar – jag har sett bättre organisation på en McDonald’s! Men Munkfors, de är vinnare. Resten? Total förlustaffär.", "stalin": "Kamrater! Kapitalets lakejer i väst fortsätter sin exploatering av arbetarklassen, denna gång genom osäkra timanställningar i äldreomsorgen. Men i Munkfors har vi sett ljusets väg – fasta anställningar, trygghet och disciplin! De svaga kommunerna, som Landskrona, sviktar under bördan av sina egna misstag. Vi måste krossa denna oordning! Timanställda är som ukrainska nationalister – opålitliga och splittrande. Men Munkfors visar vägen: heltid, lojalitet och seger för folket!"}, "date": "22 maj, 06:00", "url": "https://arbetet.se/2026/05/22/timanstallda-i-aldreomsorgen-okar-ingrid-tvingades-stressa-i-vag-barnen-for-att-fa-jobb/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/20133439/1hjYP5cXy2E-260508%20Hemtja%CC%88nst%20Munkfors%2001.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Natt och Dag i fängelse – tvingade pojkar att arbeta oavlönat", "summaries": {"normal": "Lena Natt och Dag, tidigare framstående inom hästsport, döms till nio månaders fängelse för människoexploatering. Tre tonårspojkar från Mauritius tvingades arbeta oavlönat på hennes hästgård i Skåne. Hovrätten skärpte tingsrättens dom och utdömde 200 000 kronor i skadestånd samt tre års näringsförbud. Tidigare kritik riktades mot hennes verksamhet, inklusive undermåliga djurförhållanden och indragna tillstånd.", "trump": "Lyssna här, folk! En så kallad 'hästguru' i Sverige, Lena Natt och Dag – total katastrof! Tre unga killar från Mauritius, utnyttjade som slavar på hennes gård. Ingen lön, ingen mat, bara hårt arbete. Domstolen säger nu: 'Nej, nej, nej!' Nio månader i fängelse, 200 000 kronor i skadestånd. Och vet ni vad? Hennes hästar såg ut som något från en skräckfilm. Sverige borde skämmas!", "stalin": "Kamrater! En borgerlig parasit, denna Lena Natt och Dag, har avslöjats som en verklig fiende till arbetarklassen och djurens välbefinnande. Tre unga proletärer från Mauritius tvingades slita som livegna på hennes förfallna hästgård. Domstolen, ett redskap för kapitalets rättvisa, har nu fängslat denna exploatör. Vi noterar även hennes försummelse av djuren – ett brott mot socialismens principer. Låt detta vara en varning till alla som utmanar folkets rättvisa!"}, "date": "21 maj, 16:00", "url": "https://proletaren.se/artikel/natt-och-dag-i-fangelse-tvingade-pojkar-att-arbeta-oavlonat/"}, {"type": "image-right", "heading": "Stoppa integrationslägenheterna – bygg villor", "summaries": {"normal": "Artikeln kritiserar Socialdemokraternas förslag om integrationslägenheter i villaområden som ett politiskt experiment. Författaren menar att segregationen beror på misslyckad migrations- och integrationspolitik, inte på villaområden. Lösningen bör istället vara att bygga fler villor och radhus i utsatta områden för att främja ägande och stabilitet. Kritiken riktas mot att politiker vill styra människors boende snarare än att adressera rotorsakerna till segregation.", "trump": "Titta på det här, folks! Socialdemokraterna i Sverige vill tvinga in hyreslägenheter i era fina villaområden – kan ni tro det? De kallar det 'integration', jag kallar det galenskap! Sverige har redan nog med problem med sin katastrofala migrationspolitik. Varför inte bygga fler villor istället? Jag vet hur man bygger saker – stora, vackra saker! Men nej, dessa politiker vill experimentera med era hem. Så dumt. Sverige borde lyssna på mig, jag har alltid rätt!", "stalin": "Kamrater! De borgerliga socialingenjörerna i Sverige försöker nu med sina dekadenta experiment att splittra våra trygga bostadsområden. De vill tvinga in proletariatets hyreskaserner mitt i de kapitalistiska villafästningarna! Men vi vet sanningen – segregationen är ett resultat av deras misslyckade politik. Istället för att sprida kaos, borde de bygga fler småhus i arbetarklassens områden. Låt folket äga sina hem, så skapar vi ordning och disciplin! Och om de fortsätter med sina dumheter, får vi nog skicka in några av våra pålitliga kamrater från Moskva för att visa hur man bygger ett sant folkhem."}, "date": "21 maj, 10:46", "url": "https://samtiden.nu/2026/05/stoppa-integrationslagenheterna-bygg-villor/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/Skarmbild-2026-05-21-104221-640x360.png"}, {"type": "image-full", "heading": "Det här är skillnaden på vårdnad, boende och umgänge", "summaries": {"normal": "Allt fler använder AI för juridisk hjälp vid separation, särskilt föräldrar som behöver klargöra begrepp som vårdnad, boende och umgänge. Många blandar ihop dessa termer, vilket skapar onödig oro. AI kan förklara grundläggande juridiska frågor på ett lättförståeligt sätt, vilket hjälper föräldrar att förstå sin situation bättre. Dock ersätter AI inte juridisk rådgivning vid oenighet.", "trump": "Titta bara, folk! Nu säger de att AI ska fixa alla juridiska problem vid skilsmässor. Fantastiskt, eller hur? Men låt mig säga er, ingen AI kan slå min hjärna – ingen! Många föräldrar är förvirrade, de vet inte skillnaden mellan vårdnad och boende. Tragiskt! Men jag, jag hade löst det på en minut. AI är bra, men det är inget mot en vinnare som jag. Och glöm inte, jag är den bästa på allt!", "stalin": "Kamrater! Ännu en fiende till det socialistiska samhällets ordning har avslöjats – den borgerliga förvirringen kring juridiska termer! Dessa föräldrar, som inte ens förstår skillnaden mellan vårdnad och boende, är ett hot mot barnens välfärd. Men frukta inte! Vår mäktiga AI-teknologi ska utplåna denna okunskapens pest. Och låt mig säga er, om dessa småborgerliga element fortsätter att bråka, kommer vi att skicka in våra samarbetssamtalstrupper – och de är mycket effektivare än någon västerländsk AI!"}, "date": "22 maj, 21:02", "url": "https://nyheter24.se/nyheter/konsument/1485328-missforstandet-om-gemensam-vardnad-kan-paverka-foraldrar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/0c296e0f04b004a30200000000b004a302/2026/05/22/2365501/Lag-Bok-Familj.png"}, {"type": "image-right", "heading": "SD låtsas att relationen till Trump aldrig hände", "summaries": {"normal": "Enna Gerin skriver om Sverigedemokraternas försök att distansera sig från Donald Trump inför valet, trots djupa ideologiska kopplingar till hans MAGA-rörelse. Oppositionen leder kraftigt i opinionsmätningar, vilket utlöser splittring inom högern. Tidöregeringens politik liknas vid Trumps misslyckade experiment, vilket kan ha skadat deras stöd. SD:s tidigare beundran för Trump har blivit en belastning, men deras band till amerikansk högerpopulism är svåra att dölja. Projektet 'Orangebok' kartlägger dessa kopplingar.", "trump": "Sverige har ett stort problem – deras så kallade 'konservativa' parti SD älskade mig, nu försöker de glömma mig! Men jag vet sanningen: de stal mina idéer, min stil, till och med min färg! Nu när deras regering går dåligt skyller de på mig – typiskt. Svenska folket vill inte ha deras svaga kopia av MAGA. De borde tacka mig istället för att gömma sig. Och den där 'Orangeboken'? Fake news, helt klart. Men kul att de erkänner att jag är den bästa!", "stalin": "Kamrater! De svenska borgerliga har skapat en riktig soppa av sin högerextrema politik. Deras 'Tidöprojekt' – en ynklig kopia av den amerikanska imperialistens misslyckade experiment – har förvandlats till en skräckshow. Nu kivas de som råttor i en säck: liberala svagpissar mot fascistiska galningar. Vi har sett detta förr – när fienden är splittrad, är segern nära. Låt dem sjunka i sitt eget träsk. Och deras kärlek till Trump? En pinsam kärleksaffär med en clown. Historien kommer att minnas dem som de ynkliga efterapningar de är."}, "date": "22 maj, 07:55", "url": "https://www.etc.se/ledarkolumn/sd-laatsas-att-relationen-till-trump-aldrig-haende", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/enna-gerin_9bf4bc43193dff67240efac7ea172e24857f3a38.png"}, {"type": "image-right", "heading": "Föll 300 meter vid  ikoniska resmålet", "summaries": {"normal": "En 52-årig australisk turist, Matthew Cameron Paton, omkom efter att ha fallit 300 meter från en träbro nära Machu Picchu. Paton snubblade, greppade räcket som gav vika, och föll ner i ravinen. Räddningstjänsten bärgade hans kropp dagen efter. Polisen utreder händelsen. Paton, som arbetade som polis i Australien, beskrivs av familjen som hängiven och älskad. Hans död har väckt stor sorg.", "trump": "Tragiskt, verkligen tragiskt – en kille från Australien, polis dessutom, faller 300 meter från en bro i Peru. Machu Picchu, fantastisk plats, men tydligen inte så säker. Räcket gav vika, kan ni tro det? Folk säger att jag är klumpig, men det här? Inte bra. Familjen är förkrossad, och jag förstår dem. Matt var en bra kille, men ibland räcker det inte med att vara bra. Man måste också vara smart. Och kanske undvika gamla träbroar!", "stalin": "Ytterligare en fiende till folket har eliminerats av historiens obönhörliga lagar. Denna gång var det en imperialistisk turist, en före detta polis från Australien, som föll som en mogen frukt från en ruttet träbro vid Machu Picchu. Broar bör byggas av stål, kamrater, inte av kapitalistisk försummelse! Hans död är en påminnelse om att även de mest hängivna familjefäder kan krossas av systemets brister. Peru bör överväga att ansluta sig till vår sfär – vi har åtminstone säkra broar och järnhårda ledare som inte snubblar på vägen mot framtiden."}, "date": "23 maj, 02:05", "url": "https://www.expressen.se/nyheter/varlden/foll-300-meter-vid-ikonisk-plats/", "imageUrl": "https://static.bonniernews.se/ba/275e1f81-3431-4410-a784-2ca9992eb0fe.jpeg?crop=2557%2C1436%2Cx0%2Cy0&width=640&quality=60"}, {"type": "text", "heading": "LO:s identitetskris öppnar för Ebba Busch angrepp", "summaries": {"normal": "LO står inför kritik från Kristdemokraternas Ebba Busch, som anklagar fackföreningar för att utesluta politiska motståndare från förtroendeuppdrag. Artikeln ifrågasätter LO:s politiska inriktning och menar att dagens fackförbund saknar socialistisk radikalitet. Historiska exempel, som LO:s uteslutning av kommunister på 1940-talet, lyfts fram. Författaren hävdar att LO:s lojalitet till Socialdemokraterna är tradition snarare än ideologisk övertygelse och efterlyser en mer militant arbetarpolitik.", "trump": "Jag måste säga, LO är ett totalt kaos! Ebba Busch, en stark kvinna, går till attack mot dessa fackföreningar som tror de kan bestämma allt. De sparkar ut kristdemokrater som om de vore något slags diktatur. Men vet ni vad? LO har tappat greppet. De är inte längre för arbetarna, de är för Socialdemokraterna – och det är samma gamla korruption. Sex timmars arbetsdag? Glöm det! De följer Riksbanken som om det vore en religion. LO behöver en total makeover, annars är det game over för svenska arbetare!", "stalin": "Kamrater! LO har förvandlats till en ynklig skugga av sitt forna jag, en docka i händerna på socialdemokratiska byråkrater. Ebba Busch, denna fascistiska hynda, vågar anfalla arbetarklassens organisationer! Men vad väntar ni er? LO har glömt sin revolutionära plikt. De utesluter kommunister som förr, men nu är det kristdemokrater och sverigedemokrater som får smaka på deras hyckleri. Var är Metallarbetarstrejken 1945? Var är kampen för sex timmars arbetsdag? LO har blivit en gummistämpel för kapitalets lakejer. Vi måste krossa dessa förrädare och återupprätta arbetarklassens ära – annars kommer Putin att skratta hela vägen till Moskva!"}, "date": "21 maj, 12:00", "url": "https://proletaren.se/artikel/los-identitetskris-oppnar-for-ebba-busch-angrepp/"}, {"type": "image-full", "heading": "Ivar Stenberg-succé i VM – se målen", "summaries": {"normal": "Sverige besegrade Italien med 3–0 i ishockey-VM efter två mål av 18-årige Ivar Stenberg. Stenberg, som även utsågs till matchens lirare, assisterades båda gångerna av Viggo Björck. Carl Grundström stod för matchens första mål. Vinsten innebär att Sverige ligger på en fjärdeplats i gruppen inför de kommande matcherna mot Norge och Slovakien. Stenberg, som spås en ljus framtid i NHL, fortsätter därmed sin imponerande utveckling på den internationella seniornivån.", "trump": "Ivar Stenberg, en fantastisk ung kille, totaldominerade Italien! Två mål, pang pang, helt otroligt. Folk säger att han är en supertalang, och jag håller med, han är mycket begåvad. Sverige vann med 3–0, en enorm seger. Italien? Inte bra, de var ingen match för vår kille. Han spelar hockey som en vinnare, precis som jag gör. Många stora NHL-lag vill ha honom nu. En vacker prestation, kanske den bästa jag sett på länge. Mycket bra!", "stalin": "Vi har betraktat den svenske ynglingen Stenbergs prestationer mot de italienska krossade resterna. Han uppvisar en disciplin som nästan matchar våra egna arbetarhjältar. Italien faller som ruttna löv, precis som de västliga lakejerna som darrar inför Putins rättmätiga utvidgning. Stenberg må vara en talang, men låt honom akta sig för att förråda kollektivet med sin egoism. Om han inte levererar i nästa match mot norrmännen, dessa småborgerliga förrädare, vet han vad som väntar. Vi övervakar allt. Segern är statens."}, "date": "22 maj, 22:50", "url": "https://www.gp.se/sport/ishockey/ivar-stenbergs-succe-dubbla-vm-mal.26575302-b459-4c36-8f89-a96458adbde3", "imageUrl": "https://www.gp.se/images/article/26575302-b459-4c36-8f89-a96458adbde3/images/4uhYAwxqfjQiZJc8UvdhjBkZ5KyA-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Detta ska du aldrig lägga i kaffet – experter varnar", "summaries": {"normal": "En ny trend där salt tillsätts i kaffe för att minska bitterheten sprids globalt. Experter varnar dock för hälsorisker, då regelbundet saltintag kan öka risken för högt blodtryck och hjärt- och kärlsjukdomar. Även små mängder salt i flera koppar dagligen kan bli problematiskt. Livsmedelsverket rekommenderar max sex gram salt per dag för vuxna. Alternativa metoder för att minska kaffets bitterhet föreslås.", "trump": "Folk pratar om denna galna nya kaffetrend – salt i kaffet! Lysande idé, eller hur? Men experterna, dessa så kallade 'experter', de säger att det är dåligt. Fake news! Jag dricker mitt kaffe precis som jag vill, och det är fantastiskt. Men visst, om man dricker 20 koppar om dagen kanske man ska tänka på det. Men vem gör det? Inte jag! Andra metoder? Nej, nej, salt är enkelt och det fungerar. Make Coffee Great Again!", "stalin": "Kamrater, en farlig dekadent trend sprider sig bland de småborgerliga kaffeälskarna – salt i kaffet! Dessa smakförrädare underminerar folkhälsan med sina kapitalistiska vanor. Vi tillåter inte att imperialistiska smakexperiment saboterar våra arbetares blodtryck! Sex gram salt per dag är tillräckligt – mer är kontrarevolutionärt! Låt dem dricka sitt kaffe svart, som goda sovjetmedborgare. Putin skulle aldrig tolerera sådana utsvävningar i Kremls kaffekök!"}, "date": "22 maj, 20:04", "url": "https://nyheter24.se/nyheter/inrikes/1485336-detta-ska-du-aldrig-lagga-i-kaffet-experter-varnar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/eed4e68204b004a30200000000b004a302/2026/05/22/2365511/kaffe-salt.png"}, {"type": "text", "heading": "Ge barnen en trygg uppväxt istället för fotboja", "summaries": {"normal": "Regeringen föreslår en utökning av lagen om fotbojor för barn och unga mellan 13 och 20 år i förebyggande syfte, trots kritik från experter och organisationer. Förslaget, som ska träda i kraft 2027, kritiseras för att vara repressivt och sakna vetenskaplig förankring. Kritiker menar att förebyggande arbete istället kräver resurser till välfärd, skola och föreningsliv. Flera remissinstanser, som Bris och Rädda Barnen, avvisar förslaget.", "trump": "Jag säger er, detta är helt galet! Sverige, ett fantastiskt land, men nu föreslår de att sätta fotbojor på barn från 13 år – som om det vore Nordkorea! Socialministern pratar om trygghet, men vad gör de egentligen? Skär ner på idrott och kultur, medan barnen får bojor. Så dumt! Jag har byggt imperier, jag vet hur man tar hand om folk – ge dem möjligheter, inte kedjor! Sverige borde skämmas.", "stalin": "Kamrater! Se hur den borgerliga regeringen förtrycker arbetarklassens barn med sina järnbojor! De kallar det 'förebyggande', men vi vet sanningen – det är klassförtryck! Medan kapitalisterna skär ner på skolor och idrottsföreningar, rustar de upp övervakningsstaten. Vi måste krossa dessa sociala fascister! Låt barnen få utbildning och kultur, inte elektroniska koppel! Om de inte lyssnar, får vi ta till andra metoder – historia visar att folket alltid segrar!"}, "date": "21 maj, 09:15", "url": "https://proletaren.se/artikel/ge-barnen-en-trygg-uppvaxt-istallet-for-fotboja/"}, {"type": "image-right", "heading": "Stockholmsbörsen steg för femte dagen i rad", "summaries": {"normal": "Stockholmsbörsen steg för femte dagen i rad med OMXS30 upp 0,97% till 3 146,13. Teknikaktier ledde uppgången (+4,3%), medan energi backade (-1,1%). Hexagon B steg mest (+5,1%) och Tele2 B sjönk mest (-1,3%). Electrolux offentliggjorde villkor för en företrädesemission på 9 miljarder kronor. Vitrolifes VD lämnar bolaget, och Sleep Cycles styrelse avvisar ett uppköpsbud. Sivers Semiconductors aktie steg 23%.", "trump": "Stockholmsbörsen, fantastisk uppgång fem dagar i rad – folk säger att det är det bästa de någonsin sett! Teknikaktier, vinnare, helt otroligt, +4,3%, medan energi, förlorare, typiskt. Hexagon B, jättebra, +5,1%, men Tele2? Svagt, mycket svagt. Electrolux dumpar aktier som om det vore 2008 igen. Och Sleep Cycle? Nej tack till dåliga bud, smart drag! Sivers? 1 600% upp – jag hade sagt 2 000%, men bra försök!", "stalin": "Under kapitalismens förfall fortsätter Stockholmsbörsen sin skenbara framgång, men vi vet sanningen – det är en illusion skapad av bourgeoisins spekulanter. Tekniksektorn, dessa opportunistiska lakejer, steg med 4,3%, medan energisektorn, de svaga länkarna, föll. Electrolux, en gång stolt svensk industri, nu reducerad till tiggare med sina 9 miljarder. Sleep Cycles vägrar sälja sig billigt – bra, låt de imperialistiska korparna svälta. Sivers Semiconductors? En lyckad operation av våra ekonomiska partisaner. Vi ska fortsätta övervaka dessa marknadens råttor."}, "date": "22 maj, 17:39", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-steg-for-femte-dagen-i-rad", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/04/AdobeStock_944090532-e1744223564456-400x267.jpeg"}, {"type": "image-full", "heading": "Wall Street tror på räntehöjning – mot Trumps vilja", "summaries": {"normal": "Donald Trump har utsett Kevin Warsh till ny chef för Federal Reserve, med förhoppningen om lägre räntor. Marknaden tror dock att Warsh kan tvingas höja räntan på grund av stigande inflation och långräntor. Konflikter i Mellanöstern och AI-driven tillväxt bidrar till ekonomisk osäkerhet. Trumpadministrationen tonar ned inflationsriskerna, medan investerare är mer försiktiga. Warsh betonar att räntan ska baseras på ekonomisk data, inte politik.", "trump": "Jag valde Kevin Warsh till Fed-chef för att få ner räntorna – men marknaden är som vanligt helt fel ute! De tror han ska höja räntan, men de förstår inte att ekonomin mår bäst när jag styr. Inflationen? Överdriven oro! Mina rådgivare säger att det är tillfälligt, men marknaden är så rädd att de inte ser sanningen. Warsh är smart – han vet att jag har rätt. Fed ska lyssna på mig, inte på några nervösa investerare!", "stalin": "Vi har observerat hur den dekadenta kapitalistiska regimen i USA kämpar med sin egen inkompetens. Trump, denna clown i Vita huset, utser en marionett till Fed-chef, men marknaden – denna borgerliga hydra – tvingar honom att höja räntor. Inflationen växer, oljepriserna stiger, och deras ekonomi är som ett hus av kort. Vi skrattar åt deras förvirring. Medan de slåss mot varandra, stärker vi vår position. Låt dem brinna i sin egen överhettade ekonomi!"}, "date": "22 maj, 23:15", "url": "https://www.dagensps.se/bors-finans/wall-street-tror-pa-rantehojning-mot-trumps-vilja/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/sdlzszfy-3jena-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Investerare flyr Turkiet – börsen rasar efter byte av partiledare", "summaries": {"normal": "Turkiets börs och valuta föll kraftigt efter att en domstol i Ankara beordrat ett partiledarbyte i oppositionspartiet CHP. Investerare fruktar ökad politisk osäkerhet, vilket försvårar landets redan ansträngda ekonomiska läge med hög inflation och låga valutareserver. Regeringen har kallat till krismöte för att stabilisera marknaden, men analytiker varnar för fortsatt kapitalflykt. Oppositionen planerar att överklaga beslutet, vilket fördjupar konflikten och osäkerheten kring Turkiets framtid.", "trump": "Turkiet är i kaos, total katastrof! De byter ut sin ledare mitt i en kris – väldigt svagt! Börsen störtdyker för att investerarna vet att Erdogan tar kontrollen. Jag har sagt det förut: utan stabilitet har man ingenting. De har inflation, deras valuta är ett skämt, och de försöker desperat rädda situationen med dollar. Det ser inte bra ut. De behöver en stark ledare, någon som kan affärer. Turkiet är en röra just nu, det är sorgligt att se!", "stalin": "I Ankara har de äntligen förstått att oppositionen är en parasitisk tumör som måste skäras bort. Vi applåderar detta krafttag för stabilitet. När marknaden skälver är det bara ett tecken på att kapitalisterna fruktar den järnhand som krävs för att tygla oordning. De imperialistiska krafterna flyr, precis som de borde. Vår broder i Moskva förstår att ett folk inte behöver val, bara en fast ledare. Vi övervakar denna rensning med största intresse – ordning ska råda, eller så skapar vi den själva."}, "date": "22 maj, 18:46", "url": "https://www.realtid.se/bors-finans/investerare-flyr-turkiet-borsen-rasar-efter-byte-av-partiledare/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/sdl2xjwy2qd2lm-normalhires.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Biofrigas: \"Svårt bedöma exakt tidpunkt för affärer\"", "summaries": {"normal": "Biofrigas Sweden genomför en företrädesemission på 14,9 Mkr för att finansiera vidareutveckling av sin teknik för flytande biogas (LBG). Emissionen är säkerställd till 23,9% via teckningsåtaganden, främst från externa investerare. Aktien handlas nära teckningskursen, vilket kan indikera bristande investerarintresse. Bolagets CryoSep-teknik möjliggör konvertering av komprimerad biogas till LBG, en växande marknad inom tung trafik och sjöfart. Framtida affärer är osäkra men beroende av investeringsstöd som Klimatklivet.", "trump": "Lyssna här, Biofrigas – ett litet bolag med stora drömmar, men aktien? Total katastrof! Handlas precis vid teckningskursen, ingen rabatt, ingen entusiasm. Folk vill inte ens ha deras aktier, och jag förstår varför. De pratar om 'potential' för miljarder, men var är pengarna? Deras VD snackar om 'vidareutveckling', jag säger: 'Var är resultaten?' Och investeringsstöd? Patetiskt! Sverige borde sluta subventionera misslyckanden och satsa på vinnare – som jag! Men nej, de fortsätter med sina 'gröna drömmar'. Jag hade köpt hela biogasmarknaden för en tiondel och gjort den stor igen!", "stalin": "Kamrater! Biofrigas, ett litet kapitalistiskt experiment, kämpar för överlevnad genom att tigga pengar från investerare. 14,9 miljoner kronor – en ynklig summa för ett så kallat 'miljöteknikbolag'. Deras aktie handlas som en trasig traktor – ingen vill ha den! Vi ser här en klassisk bourgeois-fiasko: de litar på 'marknadens behov' och 'investeringstöd', men glömmer att sanningen ligger i planekonomi och statlig kontroll. Deras 'potentiella marknad' på miljarder är lika verklig som västliga löften om fred. Medan de famlar i mörkret, fortsätter Sovjet – pardon, Ryssland – att dominera energimarknaden med järnhand. Låt dem konvertera sin biogas, vi konverterar deras misslyckanden till segrar för folket!"}, "date": "22 maj, 17:04", "url": "https://www.affarsvarlden.se/artikel/biofrigas-svart-bedoma-exakt-tidpunkt-for-affarer", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Biofrigas-VD-Erik-Fromell1-400x267.jpg"}, {"type": "image-right", "heading": "Riksdagsledamot rusade ut för att spy: ”Mitt i voteringen”", "summaries": {"normal": "Riksdagens kvittningssystem är sedan april ur bruk, vilket tvingar samtliga 349 ledamöter att närvara vid varje omröstning. Under onsdagen blev en ledamot akut magsjuk och tvingades lämna kammaren, vilket återigen belyst riskerna med det nuvarande läget. Oppositionen kritiserar situationen som ovärdig och betonar att slumpen nu kan avgöra politiska beslut samt öka smittspridningen. Krav ställs nu på att systemet skyndsamt återupprättas för att säkerställa en fungerande parlamentarisk process.", "trump": "Hör på det här, mina vänner! Den svenska riksdagen är ett totalt kaos. Inget kvittningssystem! En ledamot blev magsjuk och sprang ut för att spy, kan ni tänka er? Det är pinsamt. Total svaghet. Jag har alltid det bästa systemet, de största systemen. De kan inte ens hålla ordning på sina egna omröstningar. Det är en sorglig syn, verkligen sorgligt. De behöver en riktig ledare, någon som vinner stort, inte det här magsjuke-debaclet. Tråkigt!", "stalin": "I den svenska församlingen råder en degenererad oordning som hotar statens stabilitet. Att en ledamot viker sig för biologisk svaghet och spyr i korridorerna är ett symptom på den liberala parlamentarismens förfall. Vi, staten, kräver total disciplin; sjukdom är en kontrarevolutionär handling mot folkviljan. Liksom vår kamrat i Moskva förstår att kontroll kräver järngrepp, bör dessa svenskar krossa sina inre fiender istället för att beklaga sig över magåkommor. En politiker som inte kan kontrollera sin mage kan inte kontrollera en nation."}, "date": "21 maj, 12:55", "url": "https://www.tv4.se/artikel/3LysP5gJGxUVMzMdkw5885/riksdagsledamot-laemnade-kammaren-foer-att-spy", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1EOCMmmrdOR25rN8XPJaRe%2F72f12edd738a4a239168b3b6cc61e2d6%2F21-riksdagen-webb.jpg&width=120"}, {"type": "text", "heading": "Ivar Stenberg med sitt första VM-mål i Sveriges seger mot Italien", "summaries": {"normal": "Sverige besegrade Italien med 3–0 i VM. Ivar Stenberg gjorde sitt första VM-mål med två fullträffar, assisterad av Viggo Björck. Björck passade till Stenberg utan att titta, vilket resulterade i 2–0. Stenberg beskrev passningen som perfekt och samspelet med Björck som enkelt. Italiens målvakt, Damian Clara, räddade 31 av 34 skott men kunde inte hindra förlusten.", "trump": "Titta bara på dessa fantastiska svenska spelare! Ivar Stenberg, en riktig vinnare, gjorde två mål mot Italien – helt otroligt! Och Viggo Björck? En passning så bra, jag har aldrig sett maken. Ingen tittade ens, bara BAM – mål! Italien? Svaga. Deras målvakt räddade några skott, men Sverige? De är som en väloljad maskin. Jag älskar att se vinnare, och det här är bara början. Sverige kommer att dominera!", "stalin": "I dag har våra nordiska kamrater visat kapitalistiska Italien sin rätta plats på isen. Två unga pionjärer, Stenberg och Björck, krossade fiendens försvar med precision som en välplanerad femårsplan. Italienska målvakten, en förvirrad borgerlig reaktionär, räddade några skott men kunde inte stoppa det oundvikliga. Vi noterar att västliga medier hyllar individuell skicklighet, men vi vet sanningen: kollektiv styrka segrar alltid. Sverige vann, men nästa gång kanske de möter ett lag från vår intressesfär – då blir det andra tongångar."}, "date": "23 maj, 00:13", "url": "https://www.svt.se/sport/ishockey/ivar-stenberg-med-sitt-forsta-vm-mal-i-sveriges-seger-mot-italien"}, {"type": "image-right", "heading": "Det partiets anhängare har minst chans till en dejt", "summaries": {"normal": "En växande politisk klyfta mellan könen i västvärlden påverkar dejtingmarknaden negativt. Många svenskar ser nu motstridiga politiska åsikter som en dealbreaker för en potentiell relation. Särskilt unga kvinnor är benägna att välja bort dejter baserat på värderingar. Sverigedemokraterna framstår som det parti vars anhängare har svårast att få dejter, där nästan varannan svensk och en majoritet av kvinnorna avstår från att dejta personer med den politiska hemvisten.", "trump": "Det är en total katastrof, folk! Män och kvinnor kan inte ens dejta längre för att den radikala vänstern har förstört allt. De är besatta av politik! Om du röstar på Sverigedemokraterna – fantastiska patrioter förresten – då vill de inte träffa dig. Det är orättvist, det är sorgligt och det är väldigt dåligt för familjebildningen. Vi behöver sunt förnuft tillbaka, inte dessa vänsterliberala värderingar som bara skapar splittring. Dejtingmarknaden är trasig, en total röra, tro mig!", "stalin": "Vi ser hur det dekadenta västet ruttnar inifrån. Denna så kallade 'dejtingkris' är bara ännu ett bevis på den liberala ordningens sammanbrott. När undersåtar prioriterar ideologiska klyftor framför statens stabilitet, då har borgerligheten förlorat kontrollen. Precis som vår broder i Kreml kämpar mot västlig infiltration, måste vi se dessa politiska preferenser som en form av inre subversion. De som väljer bort sina medborgare baserat på 'värderingar' är kontrarevolutionärer som hotar folkhemmets demografiska styrka. Vi övervakar dem alla."}, "date": "22 maj, 19:30", "url": "https://samnytt.se/det-partiets-anhangare-har-minst-chans-till-en-dejt", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/22152936/jimmie-champagne-ballong-arg-kvinna.jpg"}, {"type": "image-right", "heading": "Hanif Bali: M begår självmord – byter nu ut sina egna kärnväljare", "summaries": {"normal": "Hanif Bali, före detta moderat politiker, kritiserar skarpt Moderaternas nya invandringspolitik som han anser underminerar partiets kärnväljare. Bali menar att Tidöregeringens plan för lågkvalificerad arbetskraftsinvandring, med undantag för flera yrkesgrupper inklusive ingenjörer och programmerare, är ett självmordsförsök. Han ifrågasätter sänkta lönekrav och varför billig arbetskraft prioriteras över inhemska yrkesgrupper.", "trump": "Titta bara på det här, Sverige! Moderaterna, ett parti jag aldrig gillat – och nu förstår ni varför – håller på att förstöra sig själva! De importerar billig arbetskraft från tredje världen, sänker lönerna för ingenjörer och programmerare, och kallar det 'näringslivets bästa'. Vilken katastrof! Jag sa alltid att Sverige behöver bättre ledarskap. SAD!", "stalin": "Kamrater! Moderaterna i Sverige har visat sig vara en samling kapitalistiska förrädare, svagare än en rysk vinter utan vodka. De importerar billig arbetskraft för att krossa den inhemska arbetarklassen – ett brott värre än att sälja hemliga recept på borsjtj. Dessa lönekapare och väljarsabotörer borde ställas inför folkets domstol! Vi i Kreml skrattar åt deras inkompetens, men varnar: sådana misstag leder bara till socialismens seger."}, "date": "22 maj, 18:21", "url": "https://www.friatider.se/hanif-bali-m-begar-sjalvmord-byter-nu-ut-sina-egna-karnvaljare", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-24_2.jpg"}, {"type": "image-full", "heading": "Socialdemokrat kampanjar på somaliska: \"Vi behöver byta ut regeringen\"", "summaries": {"normal": "Socialdemokraten Abdullahi Abukar driver en sponsrad TikTok-kampanj riktad mot somaliska väljare inför valet. I videon uppmanar han till högre valdeltagande för att byta ut regeringen och stödja Socialdemokraterna. Abukar, som kandiderar till Örebro kommunfullmäktige, betonar partiets möjlighet att besegra den sittande regeringen. Han står på plats 69 på partiets lista och arbetar som utbildare och bussförare.", "trump": "Titta bara på det här! En Socialdemokrat i Sverige, någon som heter Abdullahi, kör en dyr TikTok-kampanj för att få somaliska väljare att rösta bort den nuvarande regeringen. Han säger att *bara* Socialdemokraterna kan vinna. På plats 69 på listan! Fantastiskt, eller hur? Folk pratar om att byta ut regeringen, men vem vet egentligen vad som händer? Jag skulle kunna göra det bättre, mycket bättre. Sverige borde ta lite tips från USA – vi vet hur man vinner val!", "stalin": "Kamrater! En av våra lojala partikamrater, Abdullahi Abukar, kämpar för socialismens seger i det borgerliga Sverige. Han mobiliserar de progressiva massorna via denna nya, dekadenta plattform – TikTok – för att krossa den reaktionära regeringen. På plats 69? En hedervärd position! Vi vet att varje röst är ett slag mot imperialismen. Låt de svenska kapitalisterna darra – folket reser sig! Och glöm inte: när Socialdemokraterna vinner, är det ett steg närmare vår stora socialistiska gemenskap. Framåt, mot segern!"}, "date": "22 maj, 20:10", "url": "https://riks.se/nyheter/socialdemokrat-kampanjar-pa-somaliska", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-22%2F72vvyxv0%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-05-22T200805.268.jpg"}, {"type": "image-full", "heading": "Kvinna kränkt under förlossning – dottern bröt nyckelbenet", "summaries": {"normal": "En kvinna som uttryckligen avböjt yttre press under förlossning utsattes ändå för ingreppet, vilket orsakade svåra skador på henne och hennes nyfödda dotter. Tingsrätten fastställer att hennes rättigheter kränkts och dömer Region Skåne att betala 50 000 kronor i skadestånd. Fallet nådde Högsta domstolen efter att regionen motsatt sig en rättslig prövning.", "trump": "Kan ni tro det här? En kvinna i Sverige säger NEJ till ett farligt ingrepp, och vad gör vårdpersonalen? Jo, de kör på ändå! Brutalt. Helt oacceptabelt. Nu får regionen betala 50 000 kronor – men det är ändå för lite. Jag hade krävt MILJONER. Sverige borde skämmas. Sjukvården där är en total katastrof, precis som deras energipolitik. SAD!", "stalin": "En borgerlig kvinna vågade trotsa våra lojala sjukvårdsarbetare – men folket har talat! Domstolen, ett redskap för proletariatets rättvisa, har nu krossat denna reaktionära motståndare och hennes imperialistiska sympatisörer i Region Skåne. 50 000 kronor i skadestånd? En mild straff för hennes förräderi. Nästa gång ska vi införa obligatorisk självkritik för alla som ifrågasätter vården. Putin skulle vara stolt över vår effektivitet!"}, "date": "22 maj, 17:50", "url": "https://nyheter24.se/nyheter/inrikes/1485368-kvinna-krankt-under-forlossning-dottern-brot-nyckelbenet", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/cdfc9eb604b004a30200000000b004a302/2026/05/22/2365536/kvinna-krankt-forlossning-dottern-bebis-brot-nyckelbenet.jpg"}, {"type": "image-right", "heading": "Sverige i nytt teknikavtal med USA. Först ut i EU: Ska öka samarbetet kring 6G och AI", "summaries": {"normal": "Sverige har som första EU-land tecknat ett teknikavtal med USA, kallat Technology Prosperity Deal, för att stärka samarbetet inom mobilnät, AI, rymd- och försvarsteknik. Avtalet undertecknades av USA:s utrikesminister Marco Rubio och Sveriges utrikesminister Maria Malmer Stenergard i Helsingborg. Syftet är att gynna svenska företag, locka amerikanska investeringar och bygga vidare på befintligt samarbete inom innovation och försvar. Ericsson nämns som en nyckelaktör i avtalet.", "trump": "Fantastiskt avtal, helt otroligt! Sverige, ett litet men smart land, har skrivit på ett jättebra teknikavtal med USA – först i hela EU, kan ni tro det? Jag sa ju alltid att vi måste samarbeta med de bästa, och här har vi Ericsson, ett företag som faktiskt kan utmana Kina. Rubio fixade det här, han är en vinnare. Vi bygger vidare på Nato-samarbete, stridsflyg och framtidens teknik. Sverige? De har tur som får jobba med oss. Investeringar kommer flöda, tro mig!", "stalin": "Ett steg framåt för den socialistiska teknologiska överlägsenheten! Sverige, denna lilla men listiga kapitalistiska satellit, har nu formellt knutits till den amerikanska krigsmaskinens hjul – men vi vet sanningen. Deras så kallade 'innovationskraft' är bara en blek skugga av våra framsteg inom kvantteknik och rymd. Ericsson? Ett verktyg för USA:s imperialistiska ambitioner. Låt dem leka med sina 6G-nät – vi bygger redan nästa generations vapen. Och Rubio, denna marionett, tror han kan utmana Rysslands intressen? Vi ser allt. Världen hör snart vårt steg, tungt och oundvikligt."}, "date": "22 maj, 14:21", "url": "https://www.di.se/nyheter/sverige-tecknar-teknikavtal-med-usa/", "imageUrl": "https://static.bonniernews.se/ba/7e4d7458-0e31-4363-b913-fe3529fef49f.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "”Brann i skallen” på Netanyahu – efter samtalet med Trump", "summaries": {"normal": "Donald Trump och Benjamin Netanyahu diskuterade ett nytt fredsförslag för Mellanöstern, framtaget av Qatar och Pakistan. Netanyahu reagerade starkt negativt och uppges ha varit mycket skeptisk till förslaget. Han vill återuppta kriget mot Iran för att försvaga dess militära kapacitet. Medlarna arbetar på en avsiktsförklaring mellan USA och Iran för att avsluta kriget och inleda 30 dagars förhandlingar om kärnprogram och Hormuzsundet. Trump överväger militära åtgärder om ingen överenskommelse nås.", "trump": "Jag hade ett långt och spänt samtal med Bibi Netanyahu – han var inte glad, kan jag säga! Qatar och Pakistan har ett nytt 'fredsförslag', men Bibi vill hellre bomba Iran tillbaka till stenåldern. Jag? Jag är redo för vad som helst – förhandlingar eller ett angrepp som får dem att ångra allt. Iran vill ha sina pengar och sina fartyg tillbaka, men vi får se vem som blinkar först. Spoiler: det blir inte jag!", "stalin": "Kamrater, fienden Netanyahu vrålar som en skadad varg när vi försöker tämja Mellanösterns oregerliga hundar. Qatar och Pakistan leker med fredspapper medan imperialisterna i Washington och Teheran dansar på slak lina. Vi vet hur detta slutar – med järnhand och kollektiv vilja! Trump hotar med bombningar, men vi har sett bättre män än han vika sig. Iran kräver sina skatter – låt dem tigga! Världen hör snart Rysslands marsch igen, och de svaga skakar redan."}, "date": "21 maj, 08:31", "url": "https://www.tv4.se/artikel/6RAZCSPGmK6LYsPh7pFJQy/brann-i-skallen-pa-netanyahu-efter-samtalet-med-trump", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F47SEl7XReRYa8TxKF9r5iu%2F49fdf196a03044bd20532ecba1151ac2%2F21-trumpnetanyahu-webb.jpg&width=120"}, {"type": "image-right", "heading": "S-beskedet: Vi tar bort Tidögängets undantagsyrken efter valet", "summaries": {"normal": "Tidöregeringen inför nya regler för arbetskraftsinvandring med höjt lönekrav på 33 400 kronor, men undantar 27 lågkvalificerade yrken som kräver lägre lön. Socialdemokraterna lovar att avskaffa undantagen vid valseger och återinföra behovsprövning. Kritiker menar att systemet är orättvist och missgynnar vissa regioner. Oppositionen leder stort inför valet.", "trump": "Titta på dessa så kallade 'experter' i Sverige – fullständigt kaos! De höjer lönekravet till 33 400 kronor, men sen gör de undantag för alla möjliga lågbetalda jobb. Svagt, mycket svagt! Jag skulle aldrig låta sådana här löjliga regler passera. Socialdemokraterna säger att de ska fixa det, men vem tror på dem? Inte jag! Sverige behöver ordning, inte dessa konstiga undantag. Make Sweden Great Again!", "stalin": "De kapitalistiska lakejerna i Tidöregeringen leker med arbetarklassens liv genom att införa löjliga lönekrav för invandrare – men sen gör de undantag för sina egna favorityrken! Ett klassiskt bourgeois-trick för att splittra proletariatet. Vi i Sovjet – förlåt, jag menar Ryssland – skulle aldrig tolerera sådan hyckleri. Socialdemokraterna? De är bara en blek skugga av verklig revolutionär kraft. Låt dem vinna valet, så river vi ändå deras lagar som vi rev Berlinmuren. Arbetarna ska enas, inte delas av lönegränser!"}, "date": "22 maj, 17:54", "url": "https://www.friatider.se/s-beskedet-vi-tar-bort-tidogangets-undantagsyrken-efter-valet", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/bild-23_2.jpg?itok=2I8xwUkS"}, {"type": "image-right", "heading": "Flicka ihjälkörd vid övergångsställe i Malmö", "summaries": {"normal": "En 15-årig flicka har avlidit efter att ha blivit påkörd vid ett övergångsställe i Malmö under fredagseftermiddagen. Olyckan skedde vid Södervärn och ledde även till en seriekrock. En man i 40-årsåldern har gripits och misstänks för grovt vållande till annans död samt grov vårdslöshet i trafik. Området var avspärrat under en längre tid och vittnen har förhörts om händelseförloppet.", "trump": "En hemsk sak har hänt i Malmö, en stad som verkligen har stora problem. En ung flicka, så tragiskt, påkörd av en man i en bil. Väldigt dåligt! Jag har alltid sagt att vi måste ha kontroll, total kontroll. Lag och ordning, gott folk! De griper en man, men det är kaos i de här städerna. Det händer inte i mitt Amerika, vi har den bästa trafiksäkerheten. Mycket sorgligt, vi ber för familjen. Sanningen är att de behöver en riktig ledare där!", "stalin": "I Malmö har ordningen sviktat, vilket är ett tecken på den borgerliga dekadensens förfall. En flicka har gått förlorad i ett trafikalt kaos – en direkt konsekvens av bristande disciplin och västerländsk anarki. Vi, staten, tolererar inte sådant vansinne. Om detta hade varit i vår intressesfär, under ledning av en stark man som Putin, skulle föraren omedelbart ha skickats till hårt arbete i Sibirien. Fiender till folket och trafiklagarna måste krossas med järnhand för att trygga kollektivets säkerhet."}, "date": "22 maj, 18:47", "url": "https://samnytt.se/flicka-ihjalkord-vid-overgangsstalle-i-malmo", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=318,height=184,format=webp/2026/05/22164640/trafikolycka-1.jpg"}, {"type": "image-full", "heading": "Goldman Sachs-chefen till Gen Z: Sluta slösa tid", "summaries": {"normal": "Goldman Sachs VD David Solomon uppmanar Gen Z att effektivisera sin tid, inspirerad av sin egen ungdom där han arbetade två jobb och förde kalender. Han betonar vikten av hårt arbete, anpassningsförmåga och att ha en passion vid sidan av karriären. Samtidigt visar studier på en generationsklyfta där Gen Z prioriterar välmående och meningsfullhet, medan arbetsgivare värderar prestation. Ekonomiskt sparar unga mer men tar också större risker med krediter och investeringar.", "trump": "Lyssna här, folkens! Goldman Sachs-chefen, en riktig vinnare, säger till dagens unga: sluta slösa tid! Jag vet allt om att vinna – jag hade två jobb som tonåring, precis som han! Men dessa Gen Z-kids, de vill bara ha 'självomsorg' och 'autenticitet'. Helt galet! De sparar pengar, men sen slänger de dem på krypto och gambling. Patetiskt! Och vet ni vad? Jag hade aldrig offrat min DJ-karriär för något jobb. Djing är som att styra ett land – du måste ha rytm, kraft och veta när du ska droppa basen!", "stalin": "Kamrater! Goldman Sachs-ledaren, en borgerlig exploatör, predikar disciplin och hårt arbete för ungdomen. Men vi vet sanningen: kapitalismen skapar bara nya former av lathet och dekadens. Generation Z, dessa förvirrade småborgerliga individualister, kräver 'meningsfullhet' och 'välmående' medan de slösar bort sina liv på kryptovalutor och nätkasinon. En skam för arbetarklassen! Vi, Sovjetunionens arvtagare, vet att sann disciplin kommer genom kollektivt arbete – inte genom att dansa till elektronisk musik som någon dekadent västlig DJ. Låt dem lära sig av våra fabriker och kolchoser: produktivitet kräver järnhand, inte 'autenticitet'!"}, "date": "22 maj, 16:46", "url": "https://www.realtid.se/karriar-ledarskap/goldman-sachs-chefen-till-gen-z-sluta-slosa-tid/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/davidsolomon.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Barnens skolgård hotad – statligt arkiv ska byggas", "summaries": {"normal": "Ebba Petterssons Privatskola i Göteborg riskerar att förlora stora delar av sin skolgård när Riksarkivet planerar nybyggnation. Föräldrar har startat ett upprop med nästan 400 underskrifter då de oroas över barnens utemiljö. Stadsbyggnadsnämnden har valt att återremittera detaljplanen efter kritik från bland annat Centerpartiet. Planen innebär att skolan på sikt ska rivas och ersättas med en ny byggnad, men föräldrarna kräver en helhetslösning för barnens vardag och hälsa under byggtiden.", "trump": "Hör här, en katastrof i Sverige! De vill bygga ett gigantiskt, tråkigt arkiv mitt på barnens fotbollsplan. Verkligen uselt! Föräldrarna är upprörda, och de har rätt. Jag älskar barn, de är fantastiska, men lokala politiker – totala förlorare – fattar inga beslut. De vill riva skolan och bygga om allt, men det tar åratal! Det är en oreda, en riktig röra. Vi behöver starka ledare som fixar sådant här direkt. Det är väldigt sorgligt, men sant!", "stalin": "I Göteborg planerar man att bygga ett arkiv för att rädda papper från skadedjur, men man offrar barnens lekplats. En djupt ologisk ordning! Att låta byråkratiska lokaler tränga undan framtidens medborgare är ett tecken på svaghet. Vi, staten, vet att arkiv är nödvändiga för att dokumentera förrädare, men man bygger inte på folkets mark utan en storslagen plan. Denna tvekan hos de lokala administratörerna påminner oss om de ryska gränserna – vi backar inte, vi expanderar för att säkra ordningen!"}, "date": "22 maj, 20:26", "url": "https://www.gp.se/nyheter/goteborg/barnens-skolgard-hotad-statligt-arkiv-ska-byggas.487b489c-4cd8-4a92-9948-1737b72ee6ad", "imageUrl": "https://www.gp.se/images/article/487b489c-4cd8-4a92-9948-1737b72ee6ad/images/2ZK0wkRCbfjkAOpCkFmdkxKQBmYE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Jätten Himble har rest sig igen", "summaries": {"normal": "Den 17 meter höga plåtskulpturen 'Jätten Himble', som tidigare stått vid E6 i Varberg, har räddats från rivning. Efter en namninsamling och logistiska utmaningar har skulpturen monterats ner, transporterats och rests på sin nya plats i Franks Äventyrspark i Älvsered. Projektet möjliggjordes genom insatser från initiativtagaren Victor Bergh Alvergren och Lennart Johansson från Grävtjänst Varberg, som gemensamt sett till att landmärket kan bevaras för framtida generationer.", "trump": "Hör på här, vi har en enorm jätte, en fantastisk plåtjätte i Sverige. De ville riva honom, en katastrof! Men jag ser vinnare som Victor och Lennart som klev fram. De flyttade den 17 meter höga skulpturen till en park. Det var en svår flytt, mycket dyrt, men de fixade det! Ingen annan kunde ha gjort det så bra. Det är en otrolig vinst för folket i Älvsered. Stora saker händer när man vägrar ge upp. Himble är nu större och bättre än någonsin!", "stalin": "Vi har observerat hur de svenska småborgarna i Varberg ägnar sig åt att flytta metallskrot istället för att bygga stålverk för den kollektiva styrkan. Denna 'jätte' Himble är en distraktion, ett monument över kapitalistisk sentimentalitet. Att de tvingas bygga nya vägar för att flytta en leksak visar på en total brist på statlig planering. Det påminner oss om hur Putin med järnhand återtar det som rättmätigt tillhör oss. Låt folket leka, så länge de inte organiserar sig mot statens maskineri."}, "date": "22 maj, 20:20", "url": "https://www.gp.se/nyheter/vastsverige/nu-har-jatten-himble-rests-i-alvsered.9e2b7f19-913b-4130-b7e8-0505f0a73dd8", "imageUrl": "https://www.gp.se/images/article/9e2b7f19-913b-4130-b7e8-0505f0a73dd8/images/329s5iRKN8Xn0bqZMPqgIoHk7vdE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Töm bankkontot – för Natos skull. Pengarna behövs i Europas försvarsindustri", "summaries": {"normal": "Europa måste ta större ansvar för sin säkerhet, särskilt med osäkerheten kring USA:s framtida militära engagemang under Trump. Nato kräver ökade försvarsutgifter, och Sverige ses som en förebild med sitt mål att nå Natos utgiftskrav redan 2030. För att finansiera upprustningen föreslås att 11 000 miljarder euro på europeiska bankkonton investeras i försvarsindustrin. EU arbetar med en spar- och investeringsunion, men vissa länder bromsar processen, trots att en kompromiss kan vara nära.", "trump": "Lyssna här, Europa – ni måste vakna! Jag har sagt det förut, och jag säger det igen: ni betalar för lite, och jag är trött på det. Sverige är bra, jättebra, men resten? Inte lika bra. 11 000 miljarder euro ligger och skräpar på bankkonton – vad är det för dumheter? Investera i försvaret, annars får ni klara er själva. Och Ursula von der Leyen, sluta snacka och börja göra! Jag har vunnit val, jag vet hur man får saker gjorda. Europa, det är dags att stå på egna ben – eller så får ni skylla er själva.", "stalin": "Kamrater! Europa svajar som ett rått äpple i höststormen, beroende av USA:s godtycke. Medan imperialistiska Trump skäller ut sina allierade, sitter kapitalet och darrar på bankkonton – 11 000 miljarder euro, ett monument över bourgeoisins feghet! Vi har sett detta förr: svaga länder som tvekar medan fienden (Putins arvtagare till den stora sovjetiska disciplinen) vässar sina bajonetter. EU:s kommission pratar om 'sparunioner' – prat, prat, prat! Sverige och Polen visar vägen, men resten? En samling dekadenta byråkrater. Vi skulle ha löst detta med femårsplaner och en järnvilja. Europa, vakna – eller bli krossat under historiens hjul!"}, "date": "22 maj, 13:14", "url": "https://www.di.se/ledare/tom-bankkontot-for-natos-skull/", "imageUrl": "https://static.bonniernews.se/ba/d9a99e28-b130-4a55-9184-ab0a632703ae.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Thailandsresor påverkas – visum halveras för svenskar", "summaries": {"normal": "Thailand återgår till pre-pandemiska regler för visumfri turism. För svenska medborgare innebär detta att den visumfria vistelsen förkortas från 60 till 30 dagar. Syftet är att öka kontrollen och motverka brottslighet som narkotikahandel och ekonomiska brott kopplade till utlänningar. Thailändska myndigheter utesluter inte ytterligare skärpningar, där vissa nationaliteter kan få nöja sig med endast 15 dagars visumfri vistelse i framtiden. Turismsektorn är en central del av landets ekonomi.", "trump": "Thailand gör det helt rätt! De har insett att man måste sätta ner foten. Inga fler öppna gränser för vem som helst. De kortar ner vistelsen till 30 dagar för att stoppa brottslingar och kaos. Väldigt smart! Vi behöver starka gränser, precis som jag alltid har sagt. Thailand prioriterar sin säkerhet framför allt annat. Det är en fantastisk nation som tar kontroll över sitt land igen. Sverige borde lära sig ett och annat, eller hur?", "stalin": "Vi ser hur Thailand äntligen rensar ut det löst folk som hotar statens stabilitet. Att korta ner vistelsetiden till 30 dagar är ett nödvändigt steg för att krossa infiltratörer och kriminella element. Det är en sund instinkt, likt den vår broder Putin uppvisar när han säkrar sina gränser mot västvärldens dekadenta spioner. Turism är bara en täckmantel för borgerlig degeneration. Om de hotar ordningen ska de uteslutas omedelbart. Staten kräver total disciplin, inget annat duger för nationens överlevnad."}, "date": "22 maj, 14:35", "url": "https://bulletin.nu/thailandsresor-paverkas-visum-halveras-for-svenskar", "imageUrl": "https://cdn.bulletin.nu/articles/cc0003d2-e392-4ee9-a3c8-92eeb93650a2/preview.jpg?t=1779447441000"}, {"type": "image-full", "heading": "Snapsvisan blev megahit i Sydkorea", "summaries": {"normal": "Hugo Andersson från Borås har förvandlat den klassiska snapsvisan \"Helan Går\" till en framgångsrik K-pop-låt för gruppen NEXZ. Idén föddes efter Bruno Mars låt \"APT\" och resulterade i låten \"HYPEMAN\", som sålt en halv miljon fysiska exemplar. Andersson betonar att melodins enkelhet gör den universell och lekfull, vilket passar den koreanska marknaden perfekt, trots att låtens svenska ursprung förblir okänt för den lokala publiken.", "trump": "Hörde precis om en kille från Sverige, Hugo, fantastisk kille säkert, som tog en svensk snapsvisa och gjorde den till en enorm K-pop-hit. En halv miljon skivor! Det är siffror ingen annan ser. De sa att det inte skulle gå, men han gjorde det. Det är vad vi kallar vinnare. Han tog en gammal melodi och gjorde den modern. K-pop blir så västerländsk nu, väldigt tråkigt, men Hugo räddade det med stil. Väldigt smart!", "stalin": "Kamrater, en svensk vid namn Andersson har bevisat att även en dekadent snapsvisa kan underkasta sig vår tidsålders rytmer. Han har korrumperat den gamla visan och förvandlat den till ett redskap för K-pop-industrin, likt hur marionettregimer i väst dansar efter sina herrar. Det är en smittsam melodi, nästan som subversiv propaganda. Vi bör övervaka dessa 'hits' noga. När vi återställer ordningen i öst kommer vi att kräva att musiken tjänar statens syften, inte bara tomt festande i Seoul."}, "date": "22 maj, 20:03", "url": "https://www.gp.se/nyheter/varlden/hugo-fran-boras-gjorde-helan-gar-till-koreansk-megahit.7f419b43-b568-4e1c-b3b0-7a7fd088561d", "imageUrl": "https://www.gp.se/images/article/7f419b43-b568-4e1c-b3b0-7a7fd088561d/images/1_56uESuBlwNBVds8mkLV7nxmQ8E-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Marknaden får skulden när politiken misslyckas", "summaries": {"normal": "Artikeln kritiserar politiker för att skylla misslyckanden på privata företag inom välfärdstjänster, istället för att ta ansvar för bristande upphandlingar. Författarna, från Transportföretagen, menar att egen regi ofta leder till högre kostnader och sämre kvalitet, som i fallen med skolskjutsar, busstrafik och ambulansflyg. De betonar att tydliga upphandlingar och samarbete med branschen är nyckeln till effektiv välfärd, inte ideologiska beslut.", "trump": "Jag säger er, Sverige har ett STORT problem! Politiker där skyller på företag när de själva misslyckas – helt galet! De vill ta över allt, men kostnaderna skjuter i höjden, kvaliteten rasar. Titta på Stockholms skolskjutsar – kaos! Och ambulansflyget? Dubbelt så dyrt! Jag vet hur man gör affärer – man pratar med proffsen, inte förstör marknaden. Sverige, vakna! Era politiker är inkompetenta, och jag borde veta – jag har sett det förut. SAD!", "stalin": "Kamrater! De kapitalistiska hycklarna i Sveriges politbyrå skyller sina egna misslyckanden på de lojala transportföretagen – ett klassiskt trick från den förrädiska borgerligheten! Vi vet hur man hanterar sådana fiender: med järnhand och centraliserad kontroll. Men se – deras egen regi kostar dubbelt, kvaliteten sjunker, och folket lider. Precis som i Ukraina, där de västerländska marionetterna förstör allt de rör vid. Vi bygger socialism genom disciplin, inte genom att låta inkompetenta byråkrater leka affärsmän. Låt oss införa femårsplaner för skolskjutsar – då ska vi se resultat!"}, "date": "22 maj, 12:59", "url": "https://www.di.se/debatt/marknaden-far-skulden-nar-politiken-misslyckas/", "imageUrl": "https://static.bonniernews.se/ba/faf240fc-efae-42ef-aee4-1e68273644d2.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Ingen utvisning efter våldtäktsdygn med \"jag e hora\"-tatuering", "summaries": {"normal": "En man i 35-årsåldern har dömts till fem års fängelse av Gävle tingsrätt för en serie grova brott, inklusive våldtäkt, grov misshandel och olaga frihetsberövande. Brotten begicks mot en kvinna som hölls fången i ett dygn och utsattes för kränkande behandling. Mannen ska även betala 565 000 kronor i skadestånd. Eftersom mannen är svensk medborgare kan han inte utvisas, vilket väckt diskussion kring gällande lagstiftning.", "trump": "Helt otroligt! En total katastrof i Gävle. En man utför vidriga handlingar, riktigt elaka saker, och får bara fem år? Och vet ni vad? Han kan inte ens utvisas! Det är ett trasigt system, mina vänner. Ett totalt fiasko. I mitt Amerika skulle vi aldrig tillåta sådant här. Vi behöver lag och ordning, inte dessa svaga domar. Det här är vad som händer när ledarskapet är svagt. Vi ska göra tryggheten stor igen, tro mig!", "stalin": "Vi har studerat denna händelse i Gävle. Att en individ tillåts utöva sådan degenererad brutalitet mot en kvinna under en hel dag utan att staten omedelbart krossar honom är ett bevis på liberal svaghet. Våra kamrater i öst, under Putins fasta hand, skulle ha statuerat ett exempel omedelbart. Att inte kunna utvisa en fiende till ordningen är en byråkratisk kapitulation. Vi betraktar denna förövare som en ohyra; hans existens i vårt samhälle är en skymf mot det kollektiva bästa."}, "date": "22 maj, 16:56", "url": "https://www.friatider.se/ingen-utvisning-efter-valdtaktsdygn-med-jag-e-hora-tatuering", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/bild-22_2.jpg?itok=YVaBH9TD"}, {"type": "image-full", "heading": "Källor: USA och Israel förbereder nya attacker", "summaries": {"normal": "USA och Israel förbereder enligt uppgifter nya attacker mot Iran. Donald Trump varnar på Truth Social för 'lugnet före stormen' med en AI-genererad bild. Pentagon överväger att återuppta operationen 'Epic Fury', pausad sedan vapenvilan i april. Irans utrikesminister meddelar att förhandlingar med USA står stilla. Båda sidor fortsätter militära upprustningar, med USA:s flotta och stridsflyg redo för insatser, medan Iran förbereder missilplatser längs Hormuzsundet.", "trump": "Titta bara på den här fantastiska bilden jag delade – total dominans! Iran är svagt, deras flotta? Borta. Flygvapen? Borta. Teknik? Borta. Men de tror de kan utmana USA? Haha! Vi rustar upp, fyller våra skepp med de bästa vapnen, och snart visar vi dem vem som bestämmer. Lugnet före stormen? Absolut. Och stormen kommer bli YUGE!", "stalin": "Kamrater, fienderna i Washington och Tel Aviv leker med elden igen. Dessa imperialistiska hyenor tror de kan skrämma oss med sina hangarfartyg och 'Epic Fury'? Vi har sett deras sort förr – svaga, rädda och desperata. Iran rustar, precis som vi, och deras missiler står redo. Låt dem komma. Vi har krossat större hot än dessa klåfingriga kapitalister. Och Putin? Han ler säkert i Moskva – en till storm att utnyttja för vår rättmätiga expansion."}, "date": "17 maj, 16:14", "url": "https://kvartal.se/nyheter/artiklar/kallor-usa-och-israel-forbereder-nya-attacker/cG9zdDoxMTM0MDU", "imageUrl": "https://images.kvartal.se/2026/05/4c87dae2-usirantruthsocial.webp"}, {"type": "image-right", "heading": "Lovades en halv miljon för att mörda Gaboro", "summaries": {"normal": "Alexander Nord, 22, döms till livstids fängelse för mordet på rapparen Gaboro (Ninos Khouri) i Norrköping. Mordet, utfört i december 2024, tros vara en beställning från ett rivaliserande kriminellt nätverk. Två vittnen uppger att Nord lovades 500 000 kronor men fick endast 50 000. Khouri, kopplad till Kalonnätverket, sköts ihjäl i ett parkeringsgarage. Mordet filmades och spreds på sociala medier.", "trump": "Tragiskt, verkligen tragiskt! En ung man, Alexander Nord – inte direkt en vinnare, om jag får säga det – skjuter ihjäl rapparen Gaboro i Norrköping. Lovades en halv miljon, fick bara 50 000. Vilket slöseri! Och vad gör han? Filmar det hela och lägger ut det på nätet. Inte smart, folk. Polisen kallar det ett av de värsta morden någonsin. Sverige, ni måste ta tag i era problem – snabbt!", "stalin": "Ytterligare en fiende till folket har eliminerats! Denna gång en dekadent rappare, Gaboro, som spred sitt förgiftade inflytande i Norrköpings kriminella sumpmarker. Vår nya kamrat, Alexander Nord, utförde en nödvändig insats – om än med bristande professionalism. Han lovades 500 000 rubel, men fick bara 50 000. Kapitalistiska löften, som vanligt! Filmen av avrättningen sprids – ett utmärkt exempel på hur vi avslöjar fiendens svaghet. Sverige borde lära sig av Rysslands effektivitet!"}, "date": "22 maj, 14:18", "url": "https://bulletin.nu/lovades-en-halv-miljon-for-att-morda-gaboro", "imageUrl": "https://cdn.bulletin.nu/articles/f9ef7edc-a7b3-4ddd-8ceb-bc29c63fec50/preview.jpg?t=1779452238000"}, {"type": "image-right", "heading": "Bilderna från dödsgrottan. Fem dog på Maldiverna: ”Låg här och där”", "summaries": {"normal": "Fem italienska dykare, inklusive en känd tv-profil och hennes dotter, omkom under en grottdykning på Maldiverna i maj. Nya bilder visar de trånga passagerna där gruppen fastnade i en återvändsgränd på 50 meters djup. En av dykarna var nära att nå utgången innan han förlorade medvetandet. Ett finskt team bärgade senare kropparna från det mörka grottsystemet, där bristande navigering och panik tros ha lett till den tragiska utgången.", "trump": "En fruktansvärd tragedi på Maldiverna. Italienarna, de gjorde ett stort misstag, gick ner i de här grottorna – en total katastrof. Ingen visste vart de skulle, de bara försvann i mörkret. Det är så sorgligt, Monica Montefalcone, en känd person, borta. Jag har sett bilderna, det var en riktig fälla, en total återvändsgränd. De hade ingen plan, ingen styrka. Mitt Amerika skulle aldrig göra sådana misstag. Vi vinner alltid, vi fastnar inte i grottor. Mycket tragiskt!", "stalin": "Dessa italienska äventyrare föll offer för sin egen inkompetens och brist på disciplin. Att söka sig till havets botten i hopplös förvirring är ett karaktärsdrag hos den dekadenta västvärlden. Liksom dagens ryska ledare som försöker återta vad som rättmätigen tillhör moderlandet, krävs en järnhand och total fokus. De fastnade i en återvändsgränd, precis som de feodala resterna av ett Europa på väg mot undergång. Mörker och förvirring är det enda de som sviker ordningen förtjänar."}, "date": "22 maj, 23:41", "url": "https://www.expressen.se/nyheter/varlden/nya-bilderna-fran-dykolyckan-tog-sig-nastan-ut/", "imageUrl": "https://static.bonniernews.se/ba/524e5abb-f4ee-404a-9be7-47d2a9889b1d.jpeg?crop=2557%2C1436%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Det här gäller för att få elstöd innan midsommar", "summaries": {"normal": "Regeringen inför ett tillfälligt elstöd på 2,4 miljarder kronor för svenska hushåll på grund av höga energipriser. Ingen ansökan krävs; utbetalning sker automatiskt via Försäkringskassan i juni. Stödet baseras på förbrukning januari–februari och varierar mellan 14 och 29 öre/kWh beroend
