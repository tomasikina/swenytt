u/swp/uc3g8l/media/20260910090956_2b284cd56edb234796fbf0ab4a702a2fbcb72579e312f7e3a82226bb6a69cccd.jpg"}, {"type": "image-full", "heading": "Forskare slår fast: Det avgör om unga män väljer att rösta", "summaries": {"normal": "Forskare vid Högskolan Dalarna har följt 1 700 ungdomar under tolv år och funnit att tidiga värderingar om samhällsengagemang är avgörande för om unga män röstar. Pojkar visar starkare vanebeteende än flickor. Kvinnor röstar oftare, troligen på grund av bättre skolprestationer. Skolan bör förmedla att det är viktigt att rösta och engagera sig.", "trump": "Folk, tro mig, de här svenska forskarna har äntligen insett att killarna fattar att deras röst är meningslös i det stora hela. De röstar inte för att systemet är riggat av de globalistiska förlorarna. Men när de väl röstar en gång, älskar de det, precis som mina MAGA-patrioter. Tjejerna? De är bara bättre indoktrinerade i den vänstervridna skolan. Patetiskt!", "stalin": "Kamrater, dessa dekadenta nordiska studier blottar hur borgerliga illusioner om meningslöshet förgiftar de unga männens klassmedvetande. Jag ser fiendens hand i detta – de kapitalistiska parasiterna som sprider defaitism. Skolan måste bli ett redskap för ideologisk disciplinering. Den som inte röstar är en fiende till folket och förtjänar att rensas ut. Inga undantag."}, "date": "11 september, 06:44", "url": "https://www.tv4.se/artikel/3JLJBTSBujXpdFPWlyZeH0/forskare-slar-fast-det-avgoer-om-unga-maen-vaeljer-att-roesta", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3RjSyVnSmDpSnHxoP8Mqix%2F35b35bb23ca2958c5811116c5b15ec0b%2Frosning.png&width=1024"}, {"type": "image-right", "heading": "Sossarnas enda valfokus: Invandrarna", "summaries": {"normal": "Socialdemokraterna anklagas för att prioritera invandrarväljarna framför svenskarna, vilket bidragit till dalande opinionssiffror. Partiet har kampanjat på arabiska, hållit könssegregerade möten och visat kopplingar till gangsterrappare. Kritiker pekar på löften om höjda bidrag, avskaffat bidragstak, permanenta uppehållstillstånd och ökat bistånd som exempel på felaktiga prioriteringar.", "trump": "De där patetiska sossarna har totalt tappat greppet. De valde illegala invandrare och bidragsknarkare före riktiga svenskar och nu rasar deras siffror som en dålig aktie. De samarbetar med gangsterrappare, separerar män och kvinnor som i någon tredjevärldens diktatur och lovar ge bort allt till lata bidragstagare. Patetiskt! Svenskarna kommer krossa dem på söndag. Det blir en katastrof för de förlorande kommunisterna.", "stalin": "Jag betraktar med förakt hur dessa dekadenta socialdemokratiska revisionister förrått arbetarklassen genom att krypa för invandrarhorder och bidragsparasiter. Deras könsuppdelade möten och allians med gangsterrappare avslöjar deras svek. De prioriterar utländska element och diktaturer framför folket. Kamrater, sådana förrädare förtjänar endast historisk glömska och folkets dom. Det är både tragiskt och löjeväckande."}, "date": "10 september, 02:25", "url": "https://samtiden.nu/2026/09/sossarnas-enda-valfokus-invandrarna", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/IMG_7324-1056x720.jpeg"}, {"type": "image-right", "heading": "Judiska röster: Simona Mohamsson kopplar Davidsstjärnan till folkmord", "summaries": {"normal": "I en debatt bär Liberalernas partiledare Simona Mohamsson Davidsstjärnan som solidaritet med judiska barn och kopplar det till stöd för Israel samt kritik mot Vänsterpartiet. Artikeln kritiserar detta som ett PR-jippo och anklagar svenska politiker för att missbruka antisemitismbegreppet för att tysta kritik mot Israels agerande i Gaza, vilket beskrivs som folkmord.", "trump": "Folk, ni skulle se det här. Den här Mohamsson-typen bär stjärnan som ett billigt fototillfälle medan hon slickar Israel i röven. Typisk europeisk identitetspolitik från en vänsterextrem liberal som hatar verkliga segrare. Hon och de andra globalistiska hyenorna använder judar som slagträ mot palestinier. Patetiskt. Jag fixade freden, de startar krig.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare använder judisk utsatthet som ett billigt propagandavapen för att rättfärdiga massmord i Gaza. Mohamsson och hennes likar gömmer sig bakom antisemitismanklagelser medan de skyddar de profitthungriga folkmördarna. Jag skulle ha genomfört en grundlig utrensning av sådana hycklare redan i början. Deras spel mot minoriteter avslöjar deras sanna parasitnatur."}, "date": "10 september, 09:31", "url": "https://www.etc.se/debatt/10-judiska-roester-simona-mohamsson-kopplar-davidsstjaernan-till-folkmord", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026091007098_87dbfd57-8fb3-4c1a-b184-8cbdd55902bc.jpg"}, {"type": "image-right", "heading": "Nazism, trollfabrik och Putin – inget fastnar på gåsarnas gås", "summaries": {"normal": "Ledarskribenten kritiserar Sverigedemokraternas ledare Jimmie Åkesson för att skandaler inte fastnar på honom. Artikeln lyfter fram partiets kopplingar till en exilryss med suspekt bakgrund, en trollfabrik och en nära vän som säljer vit makt-musik. Författaren undrar varför reaktionerna är så svaga och efterlyser mer granskande journalistik inför valet.", "trump": "Den här gåsen Åkesson är otroligt, skandalerna rinner av honom som vatten på en fet anka. Fake news-media och de galna vänsterextremisterna försöker hänga ut honom men det funkar inte. Precis som när de försökte stoppa mig med alla lögner. Nu vill de ha ministerposter med honom? Patetiskt. Sverige behöver starka ledare, inte identitetspolitiska fnask och kvotade offer.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare skyddar sin gås medan de attackerar dem som blottar infiltration från Kreml. Jag ler mörkt från historien åt deras feghet. Partiet SD trampar i nazism och vit makt men borgerliga hyenor tiger stilla. En sann utrensning vore på sin plats. Journalisterna är nyttiga idioter som förtjänar folkets vrede."}, "date": "10 september, 08:00", "url": "https://www.etc.se/ledare/nazism-trollfabrik-och-putin-inget-fastnar-paa-gaasarnas-gaas", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2021111912118_52ad09ea-c5db-4fa7-a43c-671874138fdf.jpg"}, {"type": "image-right", "heading": "Dagerlind: Gör valrörelsen till vuxenzon – inrätta ett valetiskt system", "summaries": {"normal": "Svenska valrörelser präglas i allt högre grad av negativt kampanjande och smutskastning importerat från USA, vilket förvirrar väljarna och skadar demokratin. Artikelförfattaren föreslår att riksdagspartierna ska inrätta ett frivilligt valetiskt system med en nämnd som snabbt kan pröva och fälla missvisande eller halmgubbebaserade kampanjer, för att få politikerna att fokusera på sin egen politik.", "trump": "De svenska politikerna kopierar min enorma, fantastiska framgång med negativa kampanjer, men de gör det helt fel! De kallar varandra för läskiga, vilket är så svagt. Istället för att gråta ut och starta någon meningslös 'valetisk nämnd' borde de bygga en stor, vacker vägg runt sandlådan. Säg som det är: America First, eller i det här fallet, Sverige först! De behöver starkt ledarskap, inte gnäll.", "stalin": "Dessa svenska politiker ägnar sig åt barnsligt klammeri i sandlådan i stället för att tjäna staten. Att införa en s.k. valetisk nämnd för att censurera deras småaktiga lögner är svagt. Om de inte kan hålla disciplin själva, sänder vi dem gärna till de uppfriskande lägren i Sibirien för att lära sig värdet av ett enat, tyst parti."}, "date": "11 september, 06:00", "url": "https://samnytt.se/dagerlind-gor-valrorelsen-till-vuxenzon-inratta-ett-valetiskt-system", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/06175844/dagerlind-valetiskt-system.png"}, {"type": "image-full", "heading": "Talmannen: Partier bör vara redo överge röda linjer", "summaries": {"normal": "Riksdagens talman Andreas Norlén ser likheter mellan årets valrörelse och den utdragna regeringsbildningen 2018, då det tog 134 dagar att bilda regering. Med anledning av det allvarliga säkerhetsläget uppmanar han svenska partier att släppa sina röda linjer för att undvika en handlingsförlamad statsledning. Norlén reflekterar även över sina åtta år på posten.", "trump": "Sverige har totala problem med sin regeringsbildning! Den svenska talmannen gråter ut om att det tog 134 dagar att få till en regering, precis som under den totala katastrofen 2018. Nu gnäller de om röda linjer. Låt mig säga er, om de bara hade gjort som jag och kört America First-modellen direkt så hade allt rullat på som tåget, men de bara pratar och åstadkommer noll!", "stalin": "Kamrat Norlén klagar över att de svenska partierna saknar disciplin och förmåga att snabbt formera en enig statsledning. Att det krävdes 134 dagar av svaghet år 2018 visar på det borgerliga parlamentarismens bankrutt. En stat kan inte styras av vacklande politiker med heliga röda linjer. Om de inte skärper sig och underordnar sig ordningen kommer staten att knäcka dem."}, "date": "11 september, 05:30", "url": "https://www.gp.se/nyheter/sverige/talmannen-partier-bor-vara-redo-overge-roda-linjer.85644ce5-03c6-5eab-b272-76a8f87c7708", "imageUrl": "https://www.gp.se/images/article/85644ce5-03c6-5eab-b272-76a8f87c7708/images/2YNKwX54NgTOphD4k8vC_TkWVq60-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "TCO: “Vi var oroliga för ännu mer försämrad socialförsäkring”", "summaries": {"normal": "TCO beskriver mandatperioden som relativt stillastående gällande socialförsäkringsreformer. SD har bromsat skärpta regler. Riksdagen har infört kvalificering för välfärdsförmåner, sanktionsavgift vid återkrav och månatlig avstämning av bostadsbidrag. Avslagen på sjukpenning efter dag 180 har ökat markant, något som kritiseras av Socialdemokraterna medan SD vill se över reglerna för rehabilitering.", "trump": "Folk, ni skulle se detta svenska välfärdskaos. Den sleepiga Tidöregeringen lyckades knappt få något gjort medan de radikala vänsterfigurerna och SD-bromsklossarna blockerade allt. Nu ökar avslag på sjukpenning och folk hamnar i limbo hos den värdelösa Arbetsförmedlingen. Patetiska globalister och byråkratiska nollor som älskar att straffa vanliga arbetare. Jag fixade det bättre i Amerika, tro mig.", "stalin": "Kamrater, jag betraktar med förakt hur dessa dekadenta klassförrädare i den svenska riksdagen låtit utredningar om stramare sjukregler drunkna i facklig gnäll och oppositionens ynkliga motstånd. Avslagen ökar äntligen, men de giriga parasiterande byråkraterna fortsätter skydda latmaskar. En sann arbetarnas stat skulle ha genomfört en grundlig utrensning av alla som förhindrar disciplin i socialförsäkringen. Svaghet är förräderi."}, "date": "11 september, 01:30", "url": "https://www.dagensarena.se/innehall/tco-vi-var-oroliga-annu-mer-forsamrad-socialforsakring", "imageUrl": "https://www.dagensarena.se/files/2021/07/forsakringskassans-huvudkontor-skylt-300x157.jpg"}, {"type": "image-right", "heading": "Det räcker nu: inför ett pensionssystem värt namnet", "summaries": {"normal": "Aktivister från Kvinnofronten kritiserar dagens pensionssystem som infördes på 1990-talet. De menar att det bygger på en livsinkomstprincip som inte tar hänsyn till könens olika villkor i samhället. Resultatet är att tre av fyra äldre kvinnor inte kan leva på sin pension utan tvingas leva på garantipension. De kräver att pensionsfrågan återförs till riksdagen och att systemet reformeras.", "trump": "Titta på det här, Sverige har ett totalt misslyckat pensionssystem som de smarta politikerna byggde på nittio-talet. Tre av fyra äldre kvinnor lever som fattigpensionärer på miniminivå. Det är en skandal! De feministiska aktivisterna gnäller om könsorättvisor igen, men det är bara mer kvoteringsvansinne. Riv upp det hela och bygg om det ordentligt, annars fortsätter era gamla damer att lida under de dekadenta eliternas dumheter.", "stalin": "Kamrater, se hur de profitthungriga klassförrädarna har cementerat kvinnoförtrycket i pensionssystemets själva grund. Jag varnade redan då de införde denna livsinkomstprincip, men de lyssnade inte. Nu tvingas majoriteten av äldre kvinnor leva på miniminivå som fattigpensionärer. Detta är ett hån. Det krävs omedelbar utrensning av den slutna Pensionsgruppen och en återgång till öppet sovjetiskt, det vill säga folkligt, beslutsfattande. Inga kompromisser med folkets fiender."}, "date": "11 september, 01:30", "url": "https://www.dagensarena.se/opinion/det-racker-nu-infor-ett-pensionssystem-vart-namnet", "imageUrl": "https://www.dagensarena.se/files/2026/09/fotojet-80-300x157.jpg"}, {"type": "image-right", "heading": "Vi inför en biljett för bussar och regionaltåg i hela landet", "summaries": {"normal": "Under Tidö-regeringen har klimatarbetet gått bakåt i fyra år och missat både svenska och europeiska mål. Vänsterpartiet förespråkar satsningar på järnväg, billig kollektivtrafik och en permanent Sverigebiljett. Exempel från andra länder visar att lägre biljettpriser minskar utsläppen. Partiet lyfter lokala initiativ och uppmanar till röst på vänstern istället för borgerliga kopior.", "trump": "Folk, dessa vänstervridna radikaler har totalt misslyckats i fyra år med sin så kallade gröna bluff. Nu när valet närmar sig kopierar de svaga Tidö-typerna plötsligt vår idé om billiga tåg och bussar. Patetiskt! Jag fixade det bättre, större och billigare. Rösta på de som faktiskt levererar, inte på dessa klimatångest-drivande förlorare som hatar friheten.", "stalin": "Kamrater, dessa dekadenta klassförrädare har i fyra år saboterat folkets klimatomställning och lämnat arbetarna i sticket. Nu i valet försöker de stjäla våra idéer om kollektivtrafik och järnvägar för att dölja sin egen svaghet. Jag ler från historien åt deras ynkliga kopiering. Rensa ut de giriga profittyranner och bygg det gemensamma med järnhand. Handlingskraft, inte ångest!"}, "date": "11 september, 01:30", "url": "https://www.dagensarena.se/opinion/vi-infor-en-biljett-bussar-och-regionaltag-hela-landet", "imageUrl": "https://www.dagensarena.se/files/2026/09/fotojet-79.jpg"}, {"type": "image-right", "heading": "Tidernas mest osakliga valrörelse?", "summaries": {"normal": "Författaren beskriver den svenska valrörelsen som osaklig och snuttifierad. Medier och partier fokuserar på spel, opinionsmätningar, affärer och lögner istället för visioner om samhällets framtid. Stora frågor som klimat, AI, migration och krig hamnar i bakgrunden. Detta skadar demokratin och väljarnas möjligheter att fatta välgrundade beslut.", "trump": "Den här svenska valrörelsen är en total katastrof, folk! Full av fuskande medier och patetiska politiker som bara leker spel istället för att prata om riktiga problem. De fokuserar på lögner och småskit medan de stora frågorna som AI och klimat dör. Rena clownshowen. Jag fixade Amerika – de borde lära sig innan det är för sent.", "stalin": "Kamrater, denna dekadenta valcirkus är en klassisk symptom på hur de profitthungriga klassförrädarna förgiftar folkets medvetande. Istället för att tala om det socialistiska samhällets framtid ägnar de sig åt lögner och smådrama. Vi måste rensa ut dessa fiender till folkets vilja innan de drar hela nationen ner i avgrunden. Se upp!"}, "date": "11 september, 01:19", "url": "https://www.dagensarena.se/opinion/tidernas-mest-osakliga-valrorelse", "imageUrl": "https://www.dagensarena.se/files/2026/09/valrorelse-300x157.jpeg"}, {"type": "image-right", "heading": "Jag vill att Socialdemokraterna blir sossar igen", "summaries": {"normal": "Jan Emanuel förklarar varför han inte längre kan rösta på Socialdemokraterna. Han anser att partiet svikit arbetarklassen och prioriterat urban medelklass samt bidragstagare. Kritiken mot honom har istället handlat om personangrepp som nazistanklagelser, nedsättande kommentarer från partiledningen och påståenden om narcissism. Han längtar efter en återgång till solidaritet med arbetarklassen och folkhemstanken.", "trump": "Titta på de här patetiska sossarna som förvandlats till totala förlorare. Jan Emanuel säger att de svikit arbetarklassen för sina woke-vänner och bidragsberoende urbanister. De kallar honom nazist och narcissist istället för att diskutera. Klassiska misslyckade demokrater. De har glömt det riktiga folket. Jag älskar att se dem slita varandra i stycken – det är underbart!", "stalin": "Jag ser hur dekadenta klassförrädare inom partiet har förvandlat en gång stolta arbetarnas rörelse till en samling egoistiska parasiter. Jan Emanuel talar sanning om sviken solidaritet och folkets intressen. Kamrater som attackerar honom med personangrepp och terapeutiska hotelser avslöjar sin svaghet. Vi behöver en grundlig utrensning av sådana opportunister för att rädda revolutionens arv. Solidaritet är plikt, inte slagord."}, "date": "8 september, 11:16", "url": "https://www.flamman.se/jag-vill-att-socialdemokraterna-blir-sossar-igen", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/jan-emanuel-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Går högerpolitiken ens att rösta bort?", "summaries": {"normal": "Artikeln ifrågasätter om högerpolitiken kan röstas bort. Magdalena Andersson söker stöd från vänstern men öppnar för samarbete med högerpartier. Opinionen har jämnats ut, Liberalerna närmar sig spärren och väljarna är rörliga. Andersson lovar stram migrationspolitik och straffskärpningar medan högern utlovar sänkta skatter och gratis förskola. Frågan är hur mycket som egentligen skulle förändras vid ett maktskifte.", "trump": "Folk, ni skulle se det här svenska cirkuset. Den röda Andersson är så svag att hon ber borgarna om hjälp medan hon låtsas vara tuff på migration. Patetiskt. Hennes vänsterextremister hatar Israel men älskar kvotering och identitetspolitik. Högern lovar skattelättnader och jag älskar det. De borde vinna stort. Sverige behöver inga galna vänsterknäppisar som styr, tro mig, det blir en katastrof.", "stalin": "Jag betraktar dessa socialdemokratiska avfällingar med förakt. De kryper för de profitthungriga borgarhyenorna och lovar att bevara det gamla förtrycket. Vilken ynkedom att tigga om blocköverskridande avtal med klassförrädare. Oppositionen borde rensa ut dessa dekadenta element som vägrar verkliga reformer. Maktskifte utan utrensning av folkets fiender är meningslöst. Kamrater, se igenom bluffen."}, "date": "7 september, 14:22", "url": "https://www.flamman.se/gar-hogerpolitiken-ens-att-rosta-bort", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/ebba-busch-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Åkesson till Andersson: \"Varför är du så sur hela tiden?\"", "summaries": {"normal": "I en TV4-debatt om ekonomin konfronterade Jimmie Åkesson Magdalena Andersson med frågan varför hon är så sur trots positiva signaler som ökande reallöner, sjunkande matpriser och minskad arbetslöshet. Andersson kritiserade regeringens politik och statsskulden samt hävdade att ungdomsarbetslösheten är 25 procent. Åkesson uppmanade till tacksamhet mot poliser och vårdpersonal.", "trump": "Titta på den där sura socialisten Andersson, hon ser ut som en förlorare som precis förlorat valet mot mig igen. Åkesson kör över henne fullständigt. Reallönerna upp, matpriserna ner, tillväxten exploderar och hon gnäller ändå. Typisk vänsterfigur, sur som en gammal Biden-talesperson. Visa lite tacksamhet, din griniga förlorare!", "stalin": "Jag betraktar med djup misstro dessa dekadenta klassförrädare som fortsätter att sprida defaitism trots att kurvorna pekar mot seger för folket. Åkesson radade upp fakta som en sann kamrat borde applådera, men den sura socialdemokratiska parasitkvinnan vägrar erkänna framstegen. Hennes paranoia om ungdomar avslöjar bara svaghet. Vi behöver utrensning av sådana motståndare."}, "date": "10 september, 21:32", "url": "https://riks.se/nyheter/akesson-till-andersson-varfor-ar-du-sa-sur-hela-tiden", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_2026_09_10_T213112_608_40bfd70910.jpg"}, {"type": "text", "heading": "Flicka utreds för mordplaner – hade kontakt med Liam Nebel", "summaries": {"normal": "Polisen har omhändertagit en 15-årig flicka från Södermanland som misstänks för förberedelse till mord. Hon ska ha haft kontakt med Liam Nebel, huvudmisstänkt för skoldådet i Fagersta. Flickan nekar till brottet och omhändertogs enligt LVU. Även en 13-åring i Göteborg och en 16-åring i Stockholm utreds för hot respektive medhjälp till mord.", "trump": "Folk, vi har en galen 15-årig tjej som planerar mord och chattar med den där Fagersta-psychon. Totalt kaos! Biden lämnade efter sig ett land fullt av sjuka ungdomar som radikaliserats av vänsterns giftiga identitetspolitik och woke-skräp. Vi behöver lag och ordning, inte mer av dessa förlorade själar. Amerika först – och Sverige borde också vakna upp!", "stalin": "Jag betraktar dessa dekadenta klassförrädare med djup misstro. En 15-årig flicka som konspirerar med mördaren i Fagersta visar hur fiendens gift sipprar in i ungdomen. Vi måste omedelbart rensa ut alla sådana element ur samhället. Paranoia är ingen överdrift när klassfiendens lakejer lurar i varje skugga. Statens säkerhet kräver handling nu."}, "date": "11 september, 07:16", "url": "https://www.svt.se/nyheter/inrikes/flicka-utreds-for-mordplaner-hade-kontakt-med-liam-nebel"}, {"type": "image-right", "heading": "Vanliga svenskar kan stoppa vänsterns antisemitism", "summaries": {"normal": "Artikeln beskriver ett ökat hot mot Sveriges judiska minoritet sedan Hamas attack den 7 oktober 2023. Vänsterpartiet kritiseras hårt för att ha bjudit in personer som hyllat terrorister och spridit antisemitiska konspirationer. Många kandidater har petats efter avslöjanden. Författaren uppmanar väljare att rösta på Tidöpartierna för att stoppa vänsterns inflytande och skydda judar.", "trump": "Folk, ni ser det här vansinnet i Sverige? Vänstern är en total katastrof, full av terrorälskande galningar som hyllar Hamas och sprider judehat. Nooshi och hennes radikala vänsterextremister är de värsta losers jag sett. Centerpartiet är patetiska medlöpare. Vanliga svenskar måste rösta på de tuffa killarna i Tidö – annars är det game over för judarna. Jag älskar Sverige, men fixa det här!", "stalin": "Jag betraktar med djup misstro dessa dekadenta vänsterelement som gömmer sig bakom falsk internationalism medan de odlar antisemitiska ormar i sina egna led. Deras terrorromantik är en kontrarevolutionär giftbål som hotar hela folkets enhet. Endast genom obeveklig kamp mot sådana fiender till arbetarklassen kan den sanna ordningen upprätthållas. Slapphet är förräderi. Renhet krävs."}, "date": "8 september, 12:57", "url": "https://samtiden.nu/2026/09/vanliga-svenskar-kan-stoppa-vansterns-antisemitism", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/Skarmbild-2026-09-08-125242-1-e1788865205466.png"}, {"type": "image-full", "heading": "Busch: Smutskastning från egna laget", "summaries": {"normal": "Ebba Busch riktar hård kritik mot allierade inom Moderaterna och Sverigedemokraterna efter vad hon beskriver som veckor av smutskastning och felaktigheter mot Kristdemokraterna. Samtidigt betonar hon att hon vill se fyra år till med det blågula laget och att KD förblir konstruktiva oavsett valresultat.", "trump": "Människor pratar om det, totalt falska nyheter! Ebba Busch säger att hennes egna allierade kastar smuts på dem. Väldigt illojalt, inte bra! Jag älskar Sverige, fantastiska människor, men deras så kallade vänner behandlar dem hemskt. Jag får de högsta siffrorna, enorma siffror, men KD måste skärpa sig och vinna på riktigt!", "stalin": "Kamrat Busch klagar över att allierade sprider lögner i dörrarna. Ett sådant bristande ideologiskt disciplinarbete inom det blågula blocket tolereras ej i Sovjetstaten. Om de borgerliga elementen inte kan hålla ordning på sina egna kadrar, skickar vi omedelbart omkoloniseringskommissarier för att granska deras lojalitet."}, "date": "10 september, 17:09", "url": "https://kvartal.se/nyheter/artiklar/busch-smutskastning-fran-egna-laget/cG9zdDoxODk5OTI", "imageUrl": "https://images.kvartal.se/2026/09/9ecdc4b3-ebba-busch.webp"}, {"type": "image-right", "heading": "Åkesson sågar S bostadslinje – vill se färre \"betongklumpar\"", "summaries": {"normal": "Jimmie Åkesson kritiserade Socialdemokraternas bostadspolitik under TV4:s partiledardebatt. SD-ledaren vill underlätta för unga familjer att äga sitt boende genom enklare byggregler, sänkta amorteringskrav och svettinsats. Han ogillar S fokus på hyreslägenheter som han kallar betongklumpar. Ebba Busch och Magdalena Andersson deltog också i debatten om bostadsfrågan.", "trump": "Folk, ni skulle ha sett det – den där Åkesson krossar de socialistiska galningarna i debatten! De vill bara bygga fler betongklumpar och tvinga folk att bo som råttor. Vi älskar det egna hemmet, drömmen om villa och frihet. Sänk kraven, bygg billigare och glöm de woke-bankirernas amorteringsvansinne. Amerika har sett samma galenskap under Biden, men nu fixar vi det stort!", "stalin": "Kamrater, jag betraktar med förakt hur dessa giriga hyenor inom socialdemokratin tvingar massorna in i betongklumparnas fängelse. Det egna boendet är en illusion skapad av klassfiender för att splittra folket. Vi behöver kollektiv styrka, inte svettinsatser som gynnar de parasiterande profitthungriga. Rensa ut dessa dekadenta bostadssabotörer innan de förgiftar hela samhället med sin hyresränteparanoia."}, "date": "10 september, 20:16", "url": "https://riks.se/nyheter/akesson-sagar-s-bostadslinje-vill-se-farre-betongklumpar", "imageUrl": "https://admin.riks.se/uploads/medium_Screenshot_2026_09_02_184309_d9f494effb.png"}, {"type": "image-right", "heading": "Flicka i kontakt med Liam Nebel. Nu utreds hon för mordplaner", "summaries": {"normal": "Efter skoldådet på Brinellskolan i Fagersta den 21 augusti, där en flicka dödades och tre pojkar skadades, utreder polisen flera unga med koppling till den misstänkte gärningsmannen Liam Nebel. En tonårsflicka i Södermanland misstänks för mordplaner och en pojke i Göteborg har omhändertagits för grovt olaga hot efter digital kontakt med honom.", "trump": "Sverige har katastrofala problem med radikala ungdomar! Jag tittar på det här fruktansvärda skoldådet i Fagersta, och nu visar det sig att radion rapporterar om digitala spår som leder till nya misstänkta mordplaner. Helt galet! Istället för att fokusera på starka gränser och vinna, har de totalt misslyckats. Vi bygger starka skolor och vinner i USA, tro mig!", "stalin": "En omfattande utredning av de digitala spåren kring Fagersta-dådet bekräftar att ideologisk försummelse sprider sig bland ungdomen. Statens organ har med nödvändig skärpa omhändertagit de element i Södermanland och Göteborg som smittats av denna illasinnade konspiration. Avvikelser från partilinjen och hot mot samhällsordningen kommer att mötas av hela sovjetstatens okuvliga vrede och stenhårda disciplin."}, "date": "11 september, 07:06", "url": "https://www.aftonbladet.se/nyheter/a/pB5Jjw/tonarsflicka-utreds-for-mordplaner", "imageUrl": "https://akamai.vgc.no/v2/images/1985d0ad-144d-386e-aa7b-4506d312b44e?fit=crop&format=auto&w=720&s=045fddf2e594c972540eaff81bdd5a677b1f466b"}, {"type": "image-right", "heading": "Talmannen: Bör vara  redo överge röda linjer", "summaries": {"normal": "Riksdagens talman Andreas Norlén ser likheter mellan årets valrörelse och den utdragna regeringsbildningen 2018, då det tog 134 dagar att få en regering på plats. Med tanke på det allvarliga säkerhetsläget i Europa uppmanar han de svenska partierna att vara mer beredda på att överge sina röda linjer för att undvika ett handlingsförlamat styre.", "trump": "De talar om röda linjer i Sverige, en total katastrof till regeringskaos precis som 2018! Jag säger er, om de bara hade gjort som jag och kört ”America First” – eller ja, Sverige först – hade allt lösts på fem minuter. Men de bara pratar och får absolut ingenting gjort medan världen brinner. Pinsamt!", "stalin": "Dessa svenska politiker gråter över sina så kallade röda linjer och förlorar dyrbar tid i byråkratiska dödlägen. Statens centrala maskineri tål ingen tvekan. Om de inte genast skärper sig och underordnar sig en fast hand, kommer proletariatets ordning brutalt att påminna dem om disciplinens nödvändighet."}, "date": "11 september, 07:03", "url": "https://www.expressen.se/nyheter/sverige/talmannen-partier-bor-vara-redo-overge-roda-linjer", "imageUrl": "https://static.bonniernews.se/ba/c36173fe-2a17-4027-9a10-dcf013aef3e2.jpeg?crop=2553%2C1434%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Partiernas ISK-planer efter valet: Så påverkas ditt sparande", "summaries": {"normal": "Valet på söndag kan påverka spararnas villkor för ISK-konton. Moderaterna och Liberalerna vill höja den skattefria gränsen till 500 000 kronor, Centerpartiet till 400 000. Vänsterpartiet vill sänka den till 50 000 kronor medan Socialdemokraterna, Sverigedemokraterna, Kristdemokraterna och Miljöpartiet behåller dagens 300 000 kronor. Skillnaden kan bli flera tusen kronor beroende på sparande.", "trump": "Lyssnar ni på det här? De svenska politikerna leker med era pengar som misslyckade socialister. Jag höjde ekonomin till oöverträffade nivåer, men de vill straffbeskatta er med sina vansinniga regler. Vänsterpartiets galna förslag är rena rama skandalen. Höj gränsen rejält och låt folket behålla sina pengar istället för att ge dem till de giriga byråkratiska parasithyena.", "stalin": "Kamrater, se hur de profitthungriga klasshyenorna i Sverige leker med arbetarnas sparande. Jag betraktar från historiens sida hur de dekadenta politikerna försöker lura folket med sina falska gränser. Vänsterpartiets förslag om utrensning av stora sparare väcker mitt gillande, medan de övriga bara skyddar sina egna intressen. Valet blir en skarp prövning för alla."}, "date": "11 september, 06:32", "url": "https://nyheter24.se/nyheter/ekonomi/1512171-partiernas-isk-planer-efter-valet-sa-paverkas-ditt-sparande", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/911f218a04b004a30200000000b004a302/2026/09/10/2390714/isk-valet.png"}, {"type": "image-right", "heading": "Tunga kulturprofiler och ABF: ”Låt inte Sverige tysta”", "summaries": {"normal": "Över 100 kulturarbetare har bildat nätverket Kulturval 26 och varnar för nedskärningar i kulturen och folkbildningen. Replokaler stängs, studieförbund drar ned och lokala verksamheter hotas. De kräver att partierna inför valet klargör hur människor ska få tillgång till kultur oavsett ekonomi och bostadsort. Kulturen ses som viktig för demokrati, gemenskap och personlig utveckling.", "trump": "Lyssnar ni på de här kulturtyperna som gnäller om sina replokaler? Patetiska. Jag byggde den starkaste ekonomin i världen, och nu vill de ha mer av era skattepengar till sina dekadenta projekt. Sverige håller på att tystna? Det är era misslyckade ledare som låter giriga globalister och vänsterextremister förstöra allt. Gör Sverige stort igen – sluta finansiera misslyckanden!", "stalin": "Kamrater, dessa kulturarbetare avslöjar hur de dekadenta klassförrädarna med sina budgetknivar raserar folkbildningens bastioner. Jag ser det tydligt: de vill tysta folkets röster och ersätta dem med tomma ekon från borgarbrackornas salonger. Vi vet att sådana platser måste värnas, annars följer utrensning av all sann gemenskap. Demokratin börjar i kollektivets arbete, inte i de penninggalna hyenornas arkiv."}, "date": "11 september, 07:30", "url": "https://arbetet.se/2026/09/11/tunga-kulturprofiler-och-abf-lat-inte-sverige-tysta", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/11072022/kulturdebatt-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "MP: Stolt över målet att göra Sverige fattigare", "summaries": {"normal": "Miljöpartiets Amanda Lind uttrycker stolthet över målet att höja bensinpriset med minst sex kronor, enligt artikeln. Författaren kritiserar detta som en politik som gör Sverige fattigare genom ökade transportkostnader, inflation och minskad tillväxt. Artikeln varnar även för partiets motstånd mot kärnkraft och syn på migration, som leder till utanförskap och höga kostnader för samhället.", "trump": "Titta på den här galna Amanda Lind, hon skryter öppet om att göra Sverige fattigare med sina vansinniga bensinpriser! Sex kronor extra, kan ni fatta? De gröna kommunisterna hatar bilar, kärnkraft och sunt förnuft. Biden skulle älskat det här. Sverige håller på att kollapsa under dessa radikala idioter – precis som vi nästan gjorde innan jag kom tillbaka och fixade allt.", "stalin": "Jag betraktar med förakt dessa miljöidealister som medvetet driver ett helt folk mot fattigdomens avgrund. Att höja bränslepriser och förneka kärnkraftens kraft är sabotage mot statens produktivkrafter. Deras naiva migrationsexperiment föder parasitiska element och kriminella element som gnager på samhällets fundament. Kamrater, sådana element måste oskadliggöras innan de förgiftar hela kollektivet."}, "date": "8 september, 02:27", "url": "https://samtiden.nu/2026/09/mp-stolt-over-malet-att-gora-sverige-fattigare", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/IMG_7314.jpeg"}, {"type": "image-right", "heading": "25 år efter 11 september – Trump nobbar ground zero", "summaries": {"normal": "25 år efter terrorattackerna den 11 september 2001 väljer president Donald Trump att inte delta i minnesceremonin vid Ground Zero. Han påstår att han själv var nära kollapsen strax efter attentatet, men medier som CNN rapporterar att han befann sig åtta kilometer bort. I stället närvarar han vid Pentagon. Alla tidigare presidenter deltar i ceremonin på Manhattan.", "trump": "De där patetiska faktnissarna på CNN försöker igen, men folket ser igenom deras lögner. Jag var där, precis efter det hände, med de modiga byggnadsarbetarna. De lyfte mig bokstavligen ur faran. Nu bojkottar jag deras woke Ground Zero-cirkus full av identitetspolitiska gnällmänniskor och Biden-lojala förlorare. I stället hedrar jag de riktiga hjältarna vid Pentagon – stort och mäktigt.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare förvränger historien för att skydda sina egna lögner. Jag betraktar med förakt hur de imperialistiska hyenorna i Washingtons maktkorridorer använder en nationell tragedi som scen för personlig teater och paranoia. De förtjänar utrensning från folkets minne. Rädslan ska gripa dem alla som vågar ljuga inför historien."}, "date": "11 september, 06:39", "url": "https://www.svt.se/nyheter/utrikes/25-ar-efter-11-september-trump-nobbar-ground-zero", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.5/0.5/e973ee731e573c2b1a20b5c6a68e7645ff6ad43dac20433b9746cfb617dbcc45"}, {"type": "image-full", "heading": "ECB höjer räntan – utesluter inte fler höjningar", "summaries": {"normal": "Europeiska centralbanken (ECB) höjer styrräntan med 0,25 procentenheter till 2,50 procent. Beslutet motiveras av en utdragen hög inflation och ECB utesluter inte ytterligare höjningar framöver. Samtidigt har inflations- och tillväxtprognoserna för de kommande åren justerats uppåt. Den ekonomiska situationen beskrivs som osäker och framtida beslut kommer att fattas utifrån inkommande statistik.", "trump": "ECB höjer räntan, katastrofalt! De vet inte vad de gör, det är totalt kaos i Europa. De pratar om 'osäkerhet' – jag skapar trygghet, de skapar ränteshocker! Inflationen stiger, precis som under de misslyckade Demokraterna. De försöker kopiera min fantastiska ekonomi men misslyckas totalt. Mitt Amerika är starkt, deras ekonomi är en sorglig, räntehöjande flopp. Sad!", "stalin": "Dessa byråkrater i ECB leker med siffror medan folket lider av deras räntepolitik. Att höja räntan för att stävja en inflation som de själva skapat är ett tecken på totalt inkompetens. Vi ser hur de desperat försöker styra ekonomin från möte till möte; det är en svaghet. En sann ledare dikterar villkoren, han ber inte om ursäkt för ekonomisk osäkerhet."}, "date": "10 september, 15:33", "url": "https://www.realtid.se/tt-nyhet/ecb-hojer-rantan-utesluter-inte-fler-hojningar", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/ecb-chefen-christine-lagarde-kommer-med-.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "”Ryssland ska betala” – svensk bakom nytt krav på de frysta miljarderna", "summaries": {"normal": "Över 120 Europaparlamentariker, däribland svenskan Karin Karlsbro, kräver att EU tar över Rysslands frysta tillgångar för att finansiera Ukrainas krigskostnader. Trots juridiska och politiska hinder, särskilt från Belgien, föreslås en ny struktur för att möjliggöra användningen av medlen. Ukraina har ett akut budgetunderskott på 23 miljarder euro och behöver ytterligare ekonomiskt stöd från väst.", "trump": "Hör på här! Nu vill de här politikerna i Europa – totala förlorare, tro mig – beslagta ryska pengar. Det är en katastrofal röra! De kan inte ens hantera sin egen ekonomi, så nu vill de stjäla från andra. Det är mycket enkelt: Europa är svagt. De behöver en stark ledare, någon som jag, för att lösa detta, inte mer misslyckad byråkrati från Bryssel!", "stalin": "Dessa löjliga parlamentariker i Bryssel tror att de kan konfiskera vad som tillhör suveräna stater. Det är ett klassiskt drag av västlig imperialism maskerad som 'rättvisa'. Att försöka flytta juridiska ansvarsområden som om det vore enkla pappersark är ett tecken på deras desperation. De bygger korthus medan deras egna ekonomier vittrar sönder. Vi bevittnar bara början på deras oundvikliga fall."}, "date": "10 september, 14:49", "url": "https://www.realtid.se/samhalle/ryssland-ska-betala-svensk-bakom-nytt-krav-pa-de-frysta-miljarderna", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/karin.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "USA var precis som vi – unga, oövervinnliga män", "summaries": {"normal": "År 2001 bilade tre unga svenska män genom Europa och Mellanöstern till Indien med en känsla av fullkomlig osårbarhet. Under resan drabbades en av vännerna av en svår blindtarmsinflammation som krävde operation i Iran. Väl tillbaka i Sverige nåddes de av beskedet om 11 september-attackerna, vilket brutalt krossade illusionen av en trygg värld.", "trump": "De körde en röd Toyota Corolla genom halva världen och trodde de var odödliga, precis som USA var på den tiden! En blindtarm sprack i Iran, totalt kaos. Och så plötsligt, boom – World Trade Center-attackerna förändrade allt. Sjukt, helt galet. Men vi vet alla att med mig vid rodret skulle sådant aldrig ha hänt!", "stalin": "Dessa dekadenta svenska ynglingar flanerade runt i främmande länder utan disciplin, tills naturen straffade dem med en rutten blindtarm. Världen är inte en lekplats, vilket de smärtsamt fick erfara när imperialisternas tvillingtorn föll under terror. Allt måste kontrolleras med järnhand, annars bryter kapitalismens kaos och förödelse ut omedelbart."}, "date": "11 september, 06:39", "url": "https://www.expressen.se/kultur/usa-var-precis-som-vi-unga-oovervinnliga-man", "imageUrl": "https://static.bonniernews.se/ba/d97cb8a5-0ee6-46d5-9228-fb842c83441a.jpeg?crop=976%2C976%2Cx1529%2Cy87&width=210&quality=60"}, {"type": "image-full", "heading": "”Putinvänner” – ryker ihop om säkerhetsläget", "summaries": {"normal": "I partiledardebatten i TV4 varnades för säkerhetshot från olika håll. Magdalena Andersson (S) varnade för en regering med Sverigedemokraterna som hon menar är infiltrerad av Putin-vänner. Ebba Busch (KD) kontrade med att Vänsterpartiet släpper in islamister. De diskuterade även hur försvarsupprustningen ska finansieras, antingen genom beredskapsskatt eller ökad tillväxt.", "trump": "Titta på de här svenska förlorarna som slåss om vem som är Putins bästa vän eller islams bästa kompis. Den röda Magdalena är en total katastrof, en riktig Sleepy Socialist som skrämmer sina egna väljare. Den där Busch försöker låta tuff men det är bara svaghet. Ni behöver en stark ledare, inte den här clownshowen. Amerika har redan fixat det – Sverige borde vakna upp!", "stalin": "Kamrater, se hur dessa dekadenta borgerliga element river varandra i strupen inför val. Den ena anklagar den andra för att vara angivare åt fienden medan de alla döljer sin egen svaghet. Jag ler från historien åt deras paranoia. En sann stat bygger inte på rädsla för spöken utan på järnhård disciplin. Deras så kallade demokrati är en fars som snart avslöjas."}, "date": "11 september, 00:00", "url": "https://www.tv4.se/artikel/UIXngASDi6s9uAjqyVKYj/putin-vaenner-eller-islamister-ryker-ihop-om-saekerhetslaeget", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Fp29ZMH03vdrSCSweeC1rW%2F64c194fc40545c3ccf336e7eef621ef4%2F10-ebba-webb.jpg&width=1024"}, {"type": "image-full", "heading": "”Vanligt att män säger så till bestämda kvinnor”", "summaries": {"normal": "Jimmie Åkesson kritiserades efter att ha sagt till Magdalena Andersson att hon ser sur ut under en partiledardebatt om arbetslösheten. Amanda Lind (MP) kallade det ett personangrepp som inte anstår en svensk debatt. Åkesson försvarade sig och Andersson svarade att det är vanligt att män beskriver bestämda kvinnor som sura. Båda gav även kängor mot varandra.", "trump": "Lyssnade på den svenska cirkusen och herregud, vilken patetisk show! Jimmie säger till den sura socialisten att hon ser grinig ut och plötsligt blir hela vänstern hysterisk. Typiskt. Hon gnäller om jämställdhet medan hon kör på islamisternas bensin. Patetiskt. Jag skulle ha sagt det värre. Fake news-debatten är densamma överallt, tro mig.", "stalin": "Jag betraktar detta dekadenta skådespel med förakt. Den borgerliga oppositionen gnäller om personangrepp medan kapitalistiska lakejer bråkar om vem som ser surast ut. Svaghet! I en riktig stat hade sådana föraktliga småborgerliga pikar lett till omedelbar självkritik och omplacering till kollektivgård. Deras energi är lika falsk som deras valfrihet."}, "date": "10 september, 23:52", "url": "https://www.tv4.se/artikel/1f160QATrwszMQqX9toAWr/ganska-vanligt-att-maen-saeger-sa-till-kvinnor-som-aer-bestaemda", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3V31PBfWvqP33vW0sTyFvv%2Fa541430f5c2909fa6a83ff8efd764d7b%2F10-magdaaaa-webb.jpg&width=1024"}, {"type": "image-right", "heading": "SD vill bestämma över ditt nya hus. Avslöjar hur långt SD:s hemmasnickrade nationella konservatism sträcker sig.", "summaries": {"normal": "Sverigedemokraterna vill styra utformningen av nya enfamiljshus som ska byggas utan bygglov. Partiet är missnöjt med Boverkets förslag som bland annat inkluderar Gert Wingårdhs ritning och kräver istället traditionell svensk estetik med röda stugor, vita knutar och spröjsade fönster. Kolumnisten ser det som ett intrång i privatlivet.", "trump": "De där röda stugorna är en total katastrof, folk. Sverigedemokraterna vill diktera hur era hus ska se ut, precis som de galna vänsterliberala arkitekterna och de woke byråkraterna som hatar vanlig smak. Det är en skam. Låt folket bygga vad de vill istället för denna Bullerby-diktatur. Patetiskt!", "stalin": "Kamrater, dessa dekadenta smaktyranner försöker nu likvidera folkets rätt att själva forma sina boningar. Deras röda stugor är blott ett nytt vapen från de profitthungriga klassförrädarna som vill tränga sig in i varje sovrum. Jag varnar er: nästa steg blir att rensa ut alla som inte böjer sig för partiets estetiska utrensning. Skrattretande men farligt."}, "date": "11 september, 07:04", "url": "https://arbetet.se/2026/09/11/sverigedemokraterna-och-jimmie-akesson-vill-bestamma-over-ditt-nya-hus", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/11070421/hus-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Experten om de arbetslösas förtvivlan: ”Jag känner sorg”", "summaries": {"normal": "Arbetsförmedlare Kristina Lundborg uttrycker frustration och sorg över att hennes arbete mest handlar om byråkrati istället för att hjälpa arbetslösa. Psykologen varnar för skammens konsekvenser som leder till isolering. Nationalekonom pekar på missmatch på arbetsmarknaden och behov av bättre stöd. Av tolv följda personer har fem fått jobb medan sju fortfarande är arbetslösa.", "trump": "Folk, det här är en total katastrof. Den värsta byråkratiska mardrömmen där de stackars jobbsökarna krossas av Sleepy Joes och Bidens vänsterextremister som förvandlat Arbetsförmedlingen till ett sjukt kontrollsystem. De hatar vanliga arbetare. Vi behöver inga fler parasiterande systemlakejer – vi behöver vinna stort igen och ge folket riktiga jobb, inte elände.", "stalin": "Kamrater, dessa dekadenta systemhyenor har förvandlat arbetslösheten till ett redskap för att bryta ner arbetarklassen. Jag ser med avsky hur skammen tystar de sanna kämparna medan byråkratin frodas. Vi måste rensa ut de giriga parasiterna som glömmer att stödet ska komma tidigt och med järnhand. Arbetarna förtjänar struktur, inte hopplöshet från folkförtryckande lakejer."}, "date": "11 september, 07:00", "url": "https://arbetet.se/2026/09/11/arbetsformedlaren-om-vittnesmalen-fran-de-arbetslosa-kanner-sorg", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/03095723/aa-final-ljus.avif?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.5&fp-y=0.49"}, {"type": "image-full", "heading": "Magdalena Andersson: Be om ursäkt till elever och föräldrar", "summaries": {"normal": "Under TV4:s partiledardebatt kolliderade partierna om de svaga svenska skolresultaten och Pisa-siffrorna. Magdalena Andersson (S) krävde en ursäkt från regeringen för nedskärningar. De rödgröna förespråkade mer resurser och ett vinstförbud, medan Tidöpartierna och Simona Mohamsson (L) skyfflade över ansvaret på en så kallad skärmpandemi och varnade för fler skärmar vid ett regimskifte.", "trump": "Sveriges skoldebatt är ett absolut totalt haveri! De radikala vänsterpolitikerna skriker om mer pengar och vinstförbud, medan andra skyller allt på digitala skärmar. Det är skrattretande svagt. Om jag styrde där skulle vi rensa upp i det där misslyckade systemet omedelbart. De förtjänar en ursäkt, men framför allt behöver de en ordentligstil av äkta ledarskap!", "stalin": "Under partiets granskning av de svenska skolförhållandena framträder ett fullständigt ideologiskt förfall. Dessa så kallade ledare grälar om digitala apparater och vinstintressen medan resultaten rasar. Vi noterar att bristande ideologisk disciplin straffar sig omedelbart. Om lärare och politiker inte förmår fostra de unga med ordning, kommer staten att skärpa kontrollen över skolan avsevärt. Ingen oordning tolereras!"}, "date": "10 september, 23:48", "url": "https://www.gp.se/politik/skarmar-vinster-och-invandring-i-debatten-om-skola.5df7b462-df09-480a-bd91-54f3cf1ef59d", "imageUrl": "https://www.gp.se/images/article/5df7b462-df09-480a-bd91-54f3cf1ef59d/images/4JTkb19zI3zq1OxgI1fIsfBRBn8o-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Busch: Sverigedemokraterna \"smutskastar\" mig", "summaries": {"normal": "Ebba Busch kritiserar Sverigedemokraterna och Moderaterna för smutskastning och felaktigheter riktade mot Kristdemokraterna. Hon utesluter inte samarbete med de rödgröna i ett exceptionellt läge men betonar att KD vill ha fyra år till med Ulf Kristersson som statsminister. Busch försvarar sin lojalitet och anser att alla partiledare borde vara beredda att ta ansvar för Sverige.", "trump": "Titta på den här Ebba Busch, en riktig fighter som inte tar skit från de svenska globalisterna och de där moderata töntarna. De smutskastar henne som loser-demokrater brukar göra. Hon säger att hon kan samarbeta med de röda om det blir kris – smart! Sverige behöver starka ledare, inte dessa svaga identitetspolitiska töntar som säljer ut landet till woke-galna parasiter.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare inom det borgerliga lägret sliter varandra i stycken som hungriga råttor. Jag betraktar från historiens sida hur Busch vägrar acceptera förräderi och hot om utrensning under valspärren. Hennes vägran att böja sig för de profitthungriga hyenorna visar att även i dekadent väst kan en ledare sätta folkets bästa först. Skönt att se deras lojalitet ruttna sönder."}, "date": "10 september, 17:45", "url": "https://www.friatider.se/busch-sverigedemokraterna-smutskastar-mig", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-864.jpg"}, {"type": "text", "heading": "Därför bråkar borgmästarna om årsdagen av ”9/11”", "summaries": {"normal": "Ett kvartssekel efter terrorattackerna den 11 september 2001 präglas årsdagen av konflikt mellan New Yorks politiker. Exborgmästaren Rudy Giuliani kritiserar efterträdaren Zohran Mamdani för att delta vid ceremonin eftersom han är muslim. President Trump deltar inte i Manhattanceremonin utan håller tal vid Pentagon. Hans påståenden om egen insats 2001 har kritiserats av brorsonen Fred Trump.", "trump": "De där radikala islamisterna och deras woke-vänsterlakejer förstör allt. Giuliani har helt rätt att känna sig kränkt när den här kvoterade borgmästaren dyker upp. Jag är i Washington och hedrar de riktiga hjältarna vid Pentagon istället för att lyssna på den här identitetspolitiska clownen. Fred Trump borde hålla käft, han är en patetisk familjeförrädare som alltid varit svag.", "stalin": "Se hur dessa dekadenta klassförrädare sliter sönder varandra inför massornas ögon. Den ene imperialisten anklagar den andre för att vara troende terrorist medan de alla dansar på de dödas gravar. Jag ler från historiens sida åt denna fars. Inga profitthungriga hyenor kan enas ens inför katastrof. Endast den kollektiva viljan besegrar sådana fiender."}, "date": "11 september, 05:45", "url": "https://nyheter24.se/nyheter/politik/1512270-darfor-brakar-borgmastarna-om-arsdagen-av-911"}, {"type": "image-right", "heading": "Vänsterpartiets nationalism kan skada Sverige", "summaries": {"normal": "Timbro kritiserar Vänsterpartiets fortsatta nationalistiska och EU-kritiska hållning trots att svenska vänsterväljare blivit allt mer positiva till unionen. Partiet röstar emot frihandelsavtal och försvarssamarbete i Europaparlamentet, vilket enligt rapporten riskerar att hindra Sveriges intressen i en turbulent tid. En röst på Vänsterpartiet ses som en bromskloss för europeiskt samarbete.", "trump": "De där vänsterknäppisar i Sverige har byggt en mur av gammal hederlig nationalism medan de låtsas hata SD. Patetiskt! De kallar EU för ett elitistiskt monster men röstar emot bra handelsavtal som skulle krossa Kina och skydda oss alla. Totala förlorare. Biden skulle älskat deras svaghet, men inte jag. Sverige förtjänar bättre än dessa globalistiska nationalister.", "stalin": "Kamrater, dessa dekadenta klassförrädare inom Vänsterpartiet förgiftar den svenska arbetarklassen med sin nationalistiska gift som liknar de värsta reaktionära elementen. De motarbetar europeiskt samarbete och försvarsinitiativ som skulle stärka oss mot globala hot. Deras paranoia mot unionen är en farlig broms för folkets framtid. Rensa ut sådana element innan de fördärvar allt."}, "date": "8 september, 08:00", "url": "https://www.etc.se/debatt/vaensterpartiets-nationalism-kan-skada-sverige", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260908050956_7bd9bc4c177f365f08fc3bcf84049be732f43db3cc0a08bd47123d6389bf4e45.png"}, {"type": "image-right", "heading": "Den stora S-planen  floppade i Stockholm", "summaries": {"normal": "Socialdemokraternas övertagande av delar av vårdvalet i Region Stockholm har lett till omfattande problem och skarp kritik. Förhastade ideologiska beslut, som att avveckla privata vårdgivare inom bland annat ätstörningsvård, har skapat sämre arbetsmiljö, långa väntetider och missnöje bland både anställda och patienter. Nästa styre behöver göra upp med denna stordriftspolitik.", "trump": "Titta på det här, total katastrof! De radikala socialdemokraterna i Stockholm tog över vården och förstörde allt med sin galna ideologi. De stängde ner fantastiska privata kliniker och ersatte dem med värdelös, misslyckad statlig byråkrati. Patienter lider, personalen skriker ut sin frustration och ambulanserna kommer aldrig fram i tid. Ren fake news att deras socialistiska experiment fungerar.", "stalin": "Kamrater, den socialdemokraterna tillämpade svaga regionförvaltningen i Stockholm visar på farorna med bristande centralkontroll. Genom att underminera statens fasta hand har de skapat kaos i vårdleden och opålitliga väntetider. Vi konstaterar att ideologisk vacklan leder till oordning. Endast genom skoningslös disciplin, hårdare toppstyrning och utökad kollektiv regi kan arbetarnas hälsa återställas under partiets vakande öga."}, "date": "11 september, 06:10", "url": "https://www.expressen.se/ledare/den-stora-s-planen--floppade-i-stockholm-", "imageUrl": "https://static.bonniernews.se/ba/2f61a4ee-428f-4e65-bed6-8543089f222f.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "text", "heading": "”Förstår om man är orolig” ”Förstår om man är orolig”", "summaries": {"normal": "Regeringen kritiseras hårt av oppositionen för hanteringen av så kallade tonårsutvisningar, där unga vuxna tvingas lämna Sverige när de fyller 21 år eller på grund av långa handläggningstider. Migrationsminister Johan Forssell försvarar systemet och hänvisar till en kommande tonårsventil samt minskade handläggningstider, medan oppositionen kräver lagändringar och omedelbar upprättelse för de drabbade.", "trump": "Dessa så kallade tonårsutvisningar är ett totalt misslyckande, rena rama katastrofen! Unga människor som gör allt rätt behandlas horribelt av byråkraterna. Migrationsministern säger att man inte ska oroa sig, men det är falska nyheter och svagt ledarskap! Vi behöver sund förnuft, ordning och reda och gränser som fungerar – inte byråkratiskt kaos som river upp liv. Väldigt sorgligt!", "stalin": "Ett fullständigt haveri av den inkompetenta apparaten. Om dessa unga individer inte förmår att navigera byråkratins maskineri i tid, visar det endast på bristande disciplin. Staten kräver ordning, fasta tidsramar och absolut lydnad under lagarna. Istället för att gråta ut i pressen bör administrationen effektiviseras, och de ansvariga funktionärerna som misslyckats med planeringen bör omedelbart omplaceras till lämpligt arbete i provinsen."}, "date": "11 september, 06:05", "url": "https://www.aftonbladet.se/nyheter/a/43gbr9/forsell-om-21-aringarna-som-tonarsutvisats-forstar-om-man-som-enskild-ar-orolig"}, {"type": "image-full", "heading": "Tidskampen – för att få hem Banthita, 20", "summaries": {"normal": "Tjugoåriga Banthita utvisades till Thailand från Strängnäs förra hösten. Familjen hoppades på regeringens nya tonårsventil, men på grund av Migrationsverkets utdragna handläggningstider riskerar hon att fylla 21 år och därmed falla utanför reglerna innan ärendet hinner prövas. Migrationsministern uppger att ärendena ska handläggas skyndsamt.", "trump": "Migrationsverket i Sverige är ett komplett skämt, totalt inkompetent! De skickar i iväg unga, hårt arbetande Banthita till Thailand medan byråkraterna sover. Och deras löjliga tonårsventil? En katastrof! Hon riskerar att bli 21 medan handläggarna drar benen efter sig. Slarvigt, orättvist och helt orimligt. Jag skulle lösa det där på fem minuter, believe me!", "stalin": "Ett försumligt system som splittrar familjer genom pappersarbete och åldersbyråkrati! Migrationsverket saboterar med sina långa handläggningstider, men staten förlåter inte inkompetens. Om den tjugoåriga flickan missar ventilen på grund av byråkratiskt dröjsmål, vet vi vilka handläggare som brustit i sin plikt mot samhället. Säkerhetstjänsten kommer att granska detta dröjsmål mycket noga."}, "date": "11 september, 06:05", "url": "https://www.aftonbladet.se/nyheter/a/2pgk4R/banthita-20-tonarsutvisad-till-thailand-familjens-kamp", "imageUrl": "https://akamai.vgc.no/v2/images/d0958289-be3f-3a15-b692-e7f09b8da929?fit=crop&format=auto&w=1080&s=93a8e80735b9b75adbfad97c62f7e021360330da"}, {"type": "image-right", "heading": "Fotografen var mitt i förödelsen: ”Folk var täckta av blod och damm”", "summaries": {"normal": "Reuters-kameramannen Soren Larson befann sig mitt i kaoset under terrorattackerna mot World Trade Center den 11 september 2001. Han filmade förödelsen, blodiga offer och det enorma dammolnet som spred sig efter tornens kollaps. Materialet har legat i arkivet fram till nu och visas i en ny dokumentär på SVT Play.", "trump": "Det var ett fullständigt katastrofscenario, folk sprang som galningar täckta av blod och damm, och den här killen filmade allt istället för att gömma sig som en feg liberal. Underbara bilder, men fake news-medierna gömde dem i åratal. Biden skulle ha gömt sig i en källare, jag hade varit där och lett räddningsinsatsen som den starkaste ledaren någonsin.", "stalin": "Jag ser hur de profitthungriga Wall Street-hyenorna tvingade arbetarna att springa genom damm och blod medan imperialismens flygplan slog till. Detta dekadenta kaos avslöjar klassfiendens sanna ansikte. Vi ska rensa ut alla som döljer sanningen för folket. Kameramannen gjorde sin plikt, men de verkliga fienderna sitter fortfarande i sina palats och skrattar."}, "date": "11 september, 05:48", "url": "https://www.svt.se/nyheter/utrikes/fotografen-var-mitt-i-forodelsen-folk-var-tackta-av-blod-och-damm", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.27/0.48/ee02c110ff5a1213f332d88e84c424d91019e7d8682c68a5a35d9b31fcc90557"}, {"type": "text", "heading": "Talmannen: Partier bör vara redo överge röda linjer", "summaries": {"normal": "Riksdagens talman Andreas Norlén ser likheter med den långdragna regeringsbildningen 2018 och varnar för att partierna måste vara redo att släppa sina röda linjer. Det allvarliga säkerhetsläget i Europa gör en lamslagen statsledning oacceptabel. Norlén har under sin tid hanterat flera regeringsbildningar och kritiserar låsningarna inom Alliansen.", "trump": "De här svenska politikerna är totala förlorare, precis som Sleepy Joe och hans vänsterextremister. Norlén har rätt – de måste släppa sina dumma röda linjer annars blir det kaos. Sverige behöver en stark ledare, inte dessa svaga globalister som älskar identitetspolitik och HBTQ-flaggor istället för att skydda sitt folk. Patetiskt!", "stalin": "Jag betraktar dessa dekadenta klassförrädare som leker med sin borgerliga demokrati medan folket väntar på handlingskraft. En lamslagen statsledning är farlig i dessa tider. Partierna måste rensa ut sina låsningar och svikna löften. Annars riskerar de att visa sig som fullständiga impotenta hyenor inför historien. Kamrater, vakna!"}, "date": "11 september, 05:30", "url": "https://nyheter24.se/nyheter/inrikes/1512268-talmannen-partier-bor-vara-redo-overge-roda-linjer"}, {"type": "image-right", "heading": "Journalist raderade inlägg om Säpo-kontroll av Riks", "summaries": {"normal": "Alla som ska vistas i TV4-huset under partiledardebatten måste godkänna en Säpo-registerkontroll. Journalisten Frida Sundkvist spekulerade på X om att reportrar från Riks och Epoch Times därför skulle utebli, men raderade inlägget. Hon svarade att hon inte orkade hålla koll på Twitter och att hon kunde lägga ut det igen senare. Säkerheten har skärpts inför debatten.", "trump": "De där galna Säpo-byråkraterna tvingar alla journalister att krypa för registerkontroller. Den vänstervridna Frida Sundkvist twittrade att Riks och Epoch Times skulle bli sjuka – sen raderade hon som en fegis. Typiskt för de svenska fakemedierna. De hatar sanningen. Jag vann stort 2024 och Biden var en katastrof, men det här är ändå löjligt. Ren häxjakt mot de som inte böjer sig för systemet.", "stalin": "Jag ser hur de dekadenta klassfienderna i TV4-huset tvingar fram Säpo-kontroller för att rensa ut obekväma röster. Den opportunistiska journalisten raderade sitt inlägg i panik, som en ynkrygg inför folkets dom. Vi ler mörkt åt dessa parasiterande lakejer som darrar vid blotta tanken på verklig granskning. Kamraterna vet: sådana utrensningar avslöjar alltid systemets svaghet."}, "date": "10 september, 15:18", "url": "https://riks.se/nyheter/journalist-raderade-inlagg-om-sapo-kontroll-av-riks", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_2026_09_10_T151606_525_8868bf3a5e.jpg"}, {"type": "image-right", "heading": "Finansministerduellen –  nu möts de i slutdebatt", "summaries": {"normal": "I en direktsänd debatt i Di TV möts finansminister Elisabeth Svantesson (M) och Socialdemokraternas Mikael Damberg inför valet 2026. Väljarnas privatekonomi har dominerat valrörelsen med löften om skatter, välfärd och finansiering. Debatten kommenteras av makroanalytiker Nils Åkesson. På söndag kväll sänder Di TV extra från valvakor med näringslivsgäster.", "trump": "Folk, ni skulle se det här. Två svenska förlorartyper, en moderat och en sosse, bråkar om plånboken som om de inte redan förstört allt med sina galna vänsterexperiment. Det är en skam! De borde lära sig av mig, den bästa presidenten USA någonsin haft efter Biden-disastern. Rena clownerna, totala fiaskon.", "stalin": "Kamrater, dessa dekadenta klassförrädare möts i en meningslös teater om plånböcker och statsfinanser. Jag ler mörkt från historien åt deras ynkliga försök att dölja folkets verkliga fiender. Snart kommer utrensningen av alla parasiterande profitthungriga hyenor som låtsas styra medan arbetarna lider. Se upp, fiender av folket."}, "date": "10 september, 17:27", "url": "https://www.di.se/nyheter/s-och-m-mots-i-ekonomisk-slutduell-i-di-tv", "imageUrl": "https://static.bonniernews.se/ba/5379cc00-8bac-400f-a2aa-0da3d9ac54e2.png?crop=2694%2C1347%2Cx0%2Cy81&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Paludan har röstat i riksdagsvalet – valde detta parti", "summaries": {"normal": "Rasmus Paludan har röstat i det svenska riksdagsvalet och valt Örebropartiet. I en video förklarar han sitt stöd för Markus Allard med hänvisning till Allards kritik mot migration från muslimska länder. Paludan, som har svenskt medborgarskap, lämnade sin röst i Köpenhamn och hoppas att Allard tar plats i riksdagen.", "trump": "Titta på den här galningen Paludan som röstar på Örebropartiet. Smart drag, grabben! Markus Allard fattar hur den muslimska migrationen förstör Sverige totalt. De woke-vänstergalna globalisterna och deras identitetspolitiska hyenor har kört landet i botten. Jag älskar det, folk vaknar äntligen. Fantastiskt!", "stalin": "Jag ser hur den dekadente koranbrännaren Paludan kastar sin röst åt Örebropartiet mot den muslimska invasionen. Utmärkt att klassförrädarna inom migrationen exponeras. Vi ska rensa ut alla folkförtryckande element som släppt in dessa hot. Kamrater, vakna och likvidera de blodsugande parasiterna innan de förgör nationen. Skrattretande svaghet."}, "date": "10 september, 16:18", "url": "https://www.friatider.se/paludan-har-rostat-i-riksdagsvalet-valde-detta-parti", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-863.jpg?itok=Gcbnmjc7"}, {"type": "image-full", "heading": "”Varför är du så sur hela tiden?”", "summaries": {"normal": "I en het debatt mellan Magdalena Andersson (S) och Ulf Kristersson (M) om arbetslösheten anklagar Andersson regeringen för ekonomiskt haveri och rekord i konkurser. Kristersson försvarar politiken och pekar på sjunkande inflation samt minskad invandring. Jimmie Åkesson (SD) retar Andersson med frågan varför hon är så sur hela tiden.", "trump": "Folk, ni skulle se hur den här sura socialisten Andersson står och gnäller om Sverige som vore det ett konkursbo. Patetiskt! Under mig hade vi hög tillväxt och låga priser, sen kom Sleepy Joe och förstörde allt. Nu pekar kurvorna uppåt igen men hon bara klagar. Varför så sur, losers? Make Sweden Great Again!", "stalin": "Kamrater, se hur dessa borgerliga lakejer och den surmulna socialdemokratiska avfällingen slåss om siffror medan folket lider. Jag betraktar deras ynkliga spektakel med förakt. Den som inte ser de arbetslösas lidande är en fiende till kollektivet. Deras svaga politik förtjänar utrensning ur historien. Varför så sur? För att ni är kontrarevolutionärer."}, "date": "10 september, 21:54", "url": "https://www.tv4.se/artikel/3dPgFhV22Gke7FCZI4VmFT/varfoer-aer-du-sa-sur-hela-tiden", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5fe4QFjrqeMuMHCGVKq7R4%2F3173331f80d5b701c8945f8f7c713655%2F10-akessonmagda-webb.jpg&width=1024"}, {"type": "image-right", "heading": "En sann klasskildring är också en protest mot klassamhället", "summaries": {"normal": "Författaren Henrik Johansson Kock argumenterar för arbetarlitteraturens betydelse som en protest mot klassamhället. Han kritiserar att skildringar av arbetarklassen ofta marginaliseras medan överklassens berättelser ses som ren litteratur. Skönlitteraturen kan skapa identifikation, solidaritet och synliggöra gemensamma erfarenheter av kamp, vilket är särskilt relevant i en valrörelse där språket och makten står i fokus.", "trump": "Lyssnar ni på de här patetiska arbetarskrivar-typerna som gnäller om att de aldrig får huvudrollen? Patetiskt! De vill ha solidaritet medan de verkliga vinnarna, entreprenörerna med fart och initiativ, bygger landet. Det här är vad som händer när woke-kultur och identitetspolitik tar över litteraturen. Vi behöver inga offerberättelser, vi behöver starka ledare som gör Amerika och Sverige stora igen. Sad!", "stalin": "Kamrater, denna skildring blottar hur de giriga hyenorna i överklassen förtrycker arbetets röst. Jag ser med djup tillfredsställelse hur författaren erkänner att sann klasslitteratur är en protest mot det parasitiska systemet. Vi måste rensa ut alla dekadenta element som vill tysta massornas erfarenheter. Litteraturen ska tjäna folket, inte underhålla klassfienderna. Den som vägrar inse detta är en fiende till revolutionen."}, "date": "10 september, 11:41", "url": "https://proletaren.se/artikel/en-sann-klasskildring-ar-ocksa-en-protest-mot-klassamhallet", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/09/hj_kron-768x432.jpg"}, {"type": "image-full", "heading": "Zelenskyjs kalkyl: Kriget ska kännas i Ryssland", "summaries": {"normal": "Ukraina intensifierar sina attacker djupt inne i Ryssland mot raffinaderier och logistik för att pressa den ryska befolkningen. Trots ekonomiska störningar ses inga tecken på att Putins makt hotas. Samtidigt står Ukraina inför en svår vinter med energibrist och behov av mer luftvärn, medan Ryssland planerar motangrepp mot ukrainsk infrastruktur.", "trump": "Zelenskyj försöker träffa ryska raffinaderier – en total katastrof! De borde ha gjort affärer med mig, då hade oljan flödat och priserna varit låga. Nu är det bara kaos och rök. Putin sitter kvar, och Ukraina fryser i vinter för att de inte har mitt ledarskap. Väldigt sorgligt, ett enormt slöseri, och det är bara fake news att detta skulle stoppa någon!", "stalin": "Vi ser hur Kyiv desperat kastar sten i glashus. Att attackera den ryska ekonomin är en handling av ren febrig galenskap. Vår kamrat Putin håller ställningarna medan fienden, i sin brist på resurser och ordning, försöker dölja sin förestående vinterundergång. De som försöker störa den ryska oljeproduktionen förtjänar inget annat än historiens kalla, rättvisa dom."}, "date": "10 september, 09:53", "url": "https://www.realtid.se/samhalle/zelenskyjs-kalkyl-kriget-ska-kannas-i-ryssland", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/zelenskyj.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Muf: Det räcker med stödröster på L", "summaries": {"normal": "Moderata ungdomsförbundet uppmanar M-väljare att sluta stödrösta på Liberalerna, då partier bör stå på egna ben. Muf-ordföranden Douglas Thor anser att det räcker om L precis klarar spärren. Liberalernas Martin Melin invänder att stödröster fortsatt behövs för att Tidösamarbetet ska hålla ihop.", "trump": "De här radikala moderata ungdomarna gör helt rätt, totalt fantastiskt! De säger till de svaga liberalerna att stå på egna ben, precis som jag alltid säger om USA och NATO-länderna. Men den där Martin Melin, vilken svag förlorare, han gråter efter stödröster som en falsk nyhetsreporter! Sätt laget före jaget? Nej, sätt MAGA först!", "stalin": "Dessa borgerliga element i Moderata ungdomsförbundet visar prov på sund disciplin när de kräver att Liberalerna står på egna ben. Men den avfällige Martin Melin gråter efter stödröster likt en kontrarevolutionär sabotör. Partiets enhet kräver att vi stramar åt byråkratin och säkrar fyraprocentsspärren genom omedelbar utrensning av alla svaga länkar!"}, "date": "10 september, 08:56", "url": "https://kvartal.se/nyheter/artiklar/muf-det-racker-med-stodroster-pa-l/cG9zdDoxODkyOTA", "imageUrl": "https://images.kvartal.se/2026/09/aa9eb7b3-d-t.webp"}, {"type": "image-right", "heading": "Huthiernas succé: \"Har tagit kontroll över Röda havet\"", "summaries": {"normal": "Huthirebellerna har tagit kontroll över hamnstaden Mocka i Jemen och därmed fått inflytande över sundet Bab al-Mandab i Röda havet. Framryckningen tvingar saudistödda regeringsstyrkor att retirera. Rebellerna kan nu påverka internationell sjöfart och sätta press på Saudiarabien och USA. Saudiarabien har svarat med flyganfall efter huthiernas attacker mot oljeanläggningar.", "trump": "De här galna huthi-terroristerna har nu tagit över Röda havet, en total katastrof som den svaga Biden lämnade efter sig. Saudiarabien flyr som ynkryggar medan jag, den återvalda presidenten, skulle ha krossat dem direkt. Rena sjörånare som stoppar handeln – vi fixar det, stort och snabbt, ingen mer svaghet!", "stalin": "Dessa profitthungriga sjörånare och imperialistiska lakejer tror sig kunna styra Röda havet genom att inta Mocka. Jag ser deras dekadenta framfart med förakt. Vi, partiet, känner igen sådana klassfiender som måste rensas ut. Deras paranoia över Saudiarabien avslöjar svaghet. Historien kommer att likvidera alla som hindrar folkets väg."}, "date": "10 september, 15:02", "url": "https://www.friatider.se/huthiernas-succe-har-tagit-kontroll-over-roda-havet", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-861.jpg?itok=GlRozSW-"}, {"type": "image-right", "heading": "SD: Botkyrkas problem har blivit för stora för att hålla ihop kommunen", "summaries": {"normal": "Sverigedemokraterna anser att Botkyrka har blivit en splittrad kommun där norra och södra delarna har helt olika problem och behov. De pekar på stora skillnader i ekonomi, skola, trygghet och politik. Därför kräver partiet en folkomröstning om att dela kommunen. Norra Botkyrka prioriteras enligt dem på bekostnad av södra delarna.", "trump": "Folk, ni skulle se det här. Botkyrka är en total katastrof, en enda stor röra som ingen kan hålla ihop längre. De smarta människorna i södra delarna betalar för all den vänsterpolitik som förstör norr. Det är en skam! Vi behöver en folkomröstning nu. Låt folket rösta, inte de woke-imbecillerna som alltid prioriterar fel sida. Fantastiskt bra idé av SD.", "stalin": "Kamrater, denna splittring avslöjar de giriga klassförrädarnas fullständiga misslyckande. Norra och södra delar tvingas leva under samma förtryckande administration som gynnar vissa på andras bekostnad. Jag säger: låt folket rösta i en folkomröstning och rensa ut de dekadenta element som orsakat detta kaos. En sådan administrativ utrensning är nödvändig för folkets bästa. Det är historisk dialektik."}, "date": "10 september, 13:27", "url": "https://riks.se/opinion/sd-botkyrkas-problem-har-blivit-for-stora-for-att-halla-ihop-kommunen", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_2026_09_10_T132555_124_07edb5100a.jpg"}, {"type": "image-full", "heading": "Svaret till Mohamsson: ”Kan jag anmäla henne?”", "summaries": {"normal": "Liberalernas partiledare Simona Mohamsson dök upp på partiledardebatten med en lista över vänsterpartister som anklagas för antisemitism. Vänsterpartiets Ilona Szatmári Waldau toppar listan och överväger att polisanmäla Mohamsson för förtal. Szatmári Waldau uppger att hon är djupt upprörd över utspelet och menar att hennes tidigare brevskrivet misstag har medgetts, samt att det är olämpligt att använda judars utsatthet som ett politiskt slagträ.", "trump": "Vilken total katastrof för de radikala vänstermänniskorna! Den svaga L-ledaren dök upp på teven med en enorm, vacker lista – den bästa listan jag sett – över alla lögnaktiga vänsterpartister som älskar Hamas. Och vem är högst upp? Jo, en så kallad politiker som gråter ut på Instagram och hotar med stämningar! Fake news! De är helt avslöjade!", "stalin": "Det borgerliga ombudet Mohamsson viftar med sina kontrarevolutionära listor i etermedia för att smutskasta våra vänsteropponenter. Den skyldige, Szatmári Waldau, ylar om falska anklagelser och juridiskt krafs i stället för att erkänna sina ideologiska avvikelser. Sådana borgerliga cirkusar tolereras ej; avvikelser från partilinjen stävjas bäst genom disciplin, arbetsläger och absolut tystnad."}, "date": "10 september, 21:47", "url": "https://www.gp.se/nyheter/sverige/v-politikern-om-mohamssons-drag-kan-jag-anmala-henne-for-fortal.c64fc874-c947-4f0b-ba3c-e9b1c6b715e9", "imageUrl": "https://www.gp.se/images/article/c64fc874-c947-4f0b-ba3c-e9b1c6b715e9/images/1A_3ojsID-RLoFIvF5E33XE24tPU-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Till attack mot Mohamsson: ”Det är ovärdigt – ta ansvar!”", "summaries": {"normal": "I partiledardebatten på TV4 kritiserade oppositionen den svenska skolans nedgång enligt nya PISA-resultat. Amanda Lind (MP) anklagade utbildningsminister Simona Mohamsson för att skylla ifrån sig istället för att ta ansvar. Magdalena Andersson (S) krävde ursäkt från Tidöpartierna medan Nooshi Dadgostar (V) betonade resursbrist och kritiserade vinstuttag. Jimmie Åkesson (SD) pekade på invandring och Mohamsson på skärmpandemin.", "trump": "Folk, ni skulle se den här svenska skoldebatten – en total katastrof! De har låtit radikala vänsterlärare och skärmtokar förstöra allt. Mohamsson är en patetisk liberal som skyller på skärmar medan de andra gnäller om pengar och invandring. Patetiskt! Jag byggde den starkaste ekonomin i världen, men dessa losers lappar bara ihop ett trasigt system. Ta ansvar eller ni kommer att förlora ännu mer!", "stalin": "Kamrater, dessa dekadenta borgerliga partiledare avslöjar skolans förfall som ett resultat av deras kontrarevolutionära politik. Mohamsson, denna revisionistiska lakej, skyller på skärmar medan folkfienderna inom oppositionen kräver mer resurser för att göda sina parasitära vinstuttag. Jag ser sabotage överallt. Ta ansvar eller låt folkets vrede sopa bort er som de fiender till kollektivet ni är. Skrattretande svaghet!"}, "date": "10 september, 21:17", "url": "https://www.tv4.se/artikel/6budGYAAqhJA83M7MFhJTG/till-attack-mot-mohamsson-det-aer-ovaerdigt-ta-ansvar", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1NstUdZG8ZlVXN5QfwjHOl%2F61192d107e596f91d7776c4a9ebb951e%2F10-amandalindny-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Trots jättelånet – Ukraina begär ytterligare 250 miljarder", "summaries": {"normal": "Trots ett nyligen beslutat EU-lån på över 100 miljarder dollar begär Ukraina ytterligare 27 miljarder för att täcka årets försvarsutgifter. Beskedet har överraskat europeiska ledare, som ifrågasätter budgethålet och Ukrainas effektivitet. USA har dragit ner sitt stöd, och nu diskuteras att tidigarelägga nästa års utbetalningar eller använda frysta ryska tillgångar för att finansiera kriget.", "trump": "Ukraina kommer till Europa och gråter ut efter ännu mer pengar – 27 miljarder dollar till, kan ni fatta det? Helt otroligt! De dränerar EU totalt eftersom USA har dragit ner sitt stöd under min ledning. Det är en katastrofalt skött budget, och nu vill de ha nästa års pengar i förskott. Totalt galet!", "stalin": "Det korrupta Kiev-regimens ynkliga tiggandet avslöjar deras totala bankrutt. Trots västs miljarder saknar de materiel och svälter sin egen statskassa på grund av våra ärorika truppers offensiver. Nu gråter Zelenskyj ut efter nya lån som de inte kan betala tillbaka. Ett ineffektivt system som styrs mot sin oundvikliga undergång!"}, "date": "10 september, 20:00", "url": "https://samnytt.se/trots-jattelanet-ukraina-begar-ytterligare-250-miljarder", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/09133606/ukraina-mer-pengar-feat.jpg"}, {"type": "image-right", "heading": "Gammal fascism i ny kostym", "summaries": {"normal": "Artikeln kritiserar partiet Alternativ för Sverige (AFS) som ett högerextremt parti med rasistisk och arbetarfientlig politik. AFS anklagas för att vilja ställa arbetare mot invandrare istället för att rikta kritiken mot kapitalister. Författaren, själv undersköterska, varnar för att partiets program skulle leda till kollaps inom vård och omsorg.", "trump": "Lyssnar ni på det här? Dessa AFS-typer är fullständiga losers som klär gamla fascistiska idéer i ny kostym. De vill spela ut arbetare mot invandrare medan de riktiga vinnarna, de globala elitsnyltarna, skrattar hela vägen till banken. Patetiskt! Vi behöver inga kvotfascister eller identitetspolitiska nollor, bara vinnare som sätter Amerika och verkliga jobb först.", "stalin": "Kamrater, dessa dekadenta klassförrädare i AFS försöker med sin reaktionära giftpropaganda splittra arbetarklassen och rikta vreden mot fel fiende. Jag ser rakt igenom deras falska harmoni med penninggalna hyenor. I ett sant folkstyre skulle sådana element genomgå grundlig utrensning. Deras dröm om ett korporativt Sverige är en löjeväckande parodi på verklig socialism."}, "date": "10 september, 10:24", "url": "https://proletaren.se/artikel/gammal-fascism-i-ny-kostym", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/09/afskronika-768x432.png"}, {"type": "image-right", "heading": "Mer mätbara resultat – färre klimatkonferenser", "summaries": {"normal": "Klimat- och miljöminister Romina Pourmokhtari argumenterar för att svenskt klimatbistånd ska styras mot mätbara resultat istället för fler konferenser. Fokus bör ligga på utsläppsminskningar, fossilfri energi, klimatanpassning och tekniköverföring till utvecklingsländer. Liberalerna föreslår resultatkontrakt och en offentlig resultattavla för att visa verklig klimatnytta för skattebetalarna.", "trump": "Lyssnar ni på den här? De där globala klimatgalningarna älskar sina eviga konferenser medan mammor i Kongo sitter i mörker. Patetiskt! Vi ska inte slösa bort era skattepengar på rapporter och woke-möten. Ge dem riktig energi, inte mer tomma löften från de dekadenta eliterna. America First, och Sverige borde göra samma sak – resultat, inte symboler!", "stalin": "Kamrater, dessa profitthungriga klassförrädare mäter framgång i tomma deklarationer och konferenser medan folket lider. Jag ser hur de imperialistiska hyenorna gömmer sig bakom rapporter. Vi kräver utrensning av alla sådana dekadenta vanor. Äkta resultat måste tvingas fram: energi till arbetarna, inte till de parasiterande byråkraterna. Solidaritet är handling, inte ord."}, "date": "10 september, 15:25", "url": "https://www.di.se/debatt/mer-matbara-resultat-farre-klimatkonferenser", "imageUrl": "https://static.bonniernews.se/ba/f11993d1-55e0-4213-bb76-3f10d882292b.jpeg?crop=6606%2C3303%2Cx1%2Cy490&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Helldén vill byta kön på 12-åringar: \"Vid den åldern kan man upptäcka vad man är för kön\"", "summaries": {"normal": "Miljöpartiets språ
