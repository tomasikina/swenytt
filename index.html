r svenska socialistdemokraterna och deras Moderatvänner har totalt förstört ett bra land. Jobbiga människor får mindre medan lata bidragslyckor klagar. Jag byggde den bästa ekonomin i historien, inte som Sleepy Joe eller dessa globalistiska hyenor. Sverige behöver en stor Trump-deal – sänk skatterna ordentligt och sparkas ut de riktiga parasiteterna. Fantastiskt!", "stalin": "Se hur de profitthungriga klasshyenorna i Tidöregeringen omfördelar uppåt med sina dekadenta avdrag och utarmade försäkringar. Jag ler ironiskt från historien åt denna fega acceleration av borgerlig girighet som bara ökar arbetslösheten. Kamrater, sådana folkförtryckare förtjänar en grundlig utrensning när revolutionens timme åter slår. Deras tomma kassa avslöjar allt."}, "date": "10 september, 01:30", "url": "https://www.dagensarena.se/opinion/mandatperiodens-vinnare-och-forlorare", "imageUrl": "https://www.dagensarena.se/files/2026/09/tidovilgot.jpeg"}, {"type": "image-right", "heading": "Tidö 2.0 är Sveriges Project 2025", "summaries": {"normal": "Företrädare för Socialdemokraternas sidoorganisationer varnar för Tidölagets politik. De kritiserar hårdare välfärdskrav, nedmontering av a-kassan, försämrad tandvård och minskat stöd till civilsamhället. I en eventuell fortsättning planeras förstatligad a-kassa, marknadshyror, begränsade statsbidrag till kommuner, avgifter på högre utbildning samt nedmontering av myndigheter för mänskliga rättigheter. De uppmanar till att rösta på Socialdemokraterna.", "trump": "Folk, ni måste se detta! Dessa galna socialdemokratiska aktivister, de värsta HBTQ-kvoteringsfanatikerna och identitetspolitiska nollorna, skriker om att vi skulle förstöra Sverige. De hatar att vi äntligen städar upp i det dekadenta välfärdssvinstiet. Jag älskar det! Fortsätt, Tidölaget, gör Sverige stort igen och skicka de här förlorarna till historiens soptipp där de hör hemma.", "stalin": "Kamrater, dessa dekadenta klassförrädare inom socialdemokratin gnäller som rädda hundar över att Tidölaget äntligen rensar ut det parasitiska välfärdsfiffel som förgiftat folket. Deras hysteriska rop om jämlikhet är bara en dimridå för att skydda de giriga hyenorna i civilsamhället. Jag ler i graven åt deras paranoia. En sann arbetarregering skulle likvidera sådana element omedelbart."}, "date": "10 september, 01:30", "url": "https://www.dagensarena.se/opinion/tido-2-0-ar-sveriges-project-2025", "imageUrl": "https://www.dagensarena.se/files/2026/09/fotojet-78-300x157.jpg"}, {"type": "image-right", "heading": "Riks/Sentio: Liberalerna rusar – Socialdemokraterna rasar", "summaries": {"normal": "Enligt den senaste Riks/Sentio-mätningen rusar Liberalerna från 2,1 till 5,1 procent och tar sig över riksdagsspärren. Socialdemokraterna backar samtidigt till 26,5 procent. Sverigedemokraterna och Moderaterna tappar medan Centerpartiet går fram. Chefredaktör Jacob Hagnell beskriver förändringarna som dramatiska och Liberalernas lyft som ett resultat av taktisk röstning.", "trump": "Folk, det är en total cirkus i Sverige. Liberalerna, de där fega flip-flopparna, rusar plötsligt till 5,1 procent som riktiga vinnare medan Sleepy Magdalena och hennes socialistiska misslyckande rasar ner till 26,5. Patetiskt! SD håller ställningarna och hennes katastrofala kampanj slutar i fiasko. Underbart att se hur de woke-kvoterade förlorarna blöder väljare till de som faktiskt vill ha resultat. Fantastiskt!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna vacklar! Liberalerna stiger plötsligt medan Socialdemokraternas förtryckande lakejer rasar mot avgrunden. Jag ler i skuggorna åt detta kaos. SD visar styrka, en varning till alla folkfiender. Magdalena Anderssons fiasko är en läxa i hur svaga bourgeois-hyonor straffas av folket. Vi ser fram emot utrensningen av otydligheten. Sov inte, fiender."}, "date": "9 september, 19:32", "url": "https://riks.se/nyheter/riks-sentio-liberalerna-rusar-socialdemokraterna-rasar", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_100_f557b8f792.jpg"}, {"type": "image-right", "heading": "Tyskland: Vill öka till 40 timmars arbetsvecka", "summaries": {"normal": "Tyska näringslivsföreträdare vill öka arbetsveckan från 35 till 40 timmar utan löneförhöjning för att sänka kostnaderna och stärka industrins konkurrenskraft, som pressats av höga energipriser och hård internationell konkurrens. Fackförbundet IG Metall motsätter sig förslaget och varnar för att det kan leda till färre jobb.", "trump": "Tyskland har stora problem! Deras bilar säljer inte, energipriserna är en katastrof och nu vill de att tyskarna ska jobba 40 timmar för samma lön. Väldigt sorgligt! USA tillverkar de bästa bilarna, med amerikaner som jobbas hårt och betalar låga skatter. Tyskarna borde ringa mig, jag hade fixat det på en sekund!", "stalin": "De tyska arbetarna klagar över trettiofem timmars arbete, medan staten kräver fullkomlig produktivitet! När jag styrde fanns inga lata kompromisser. Om tillverkningsindustrin sviktar, vilar ansvaret på subversiva element. Vi skall omstrukturera dessa kollektivavtal med järnhand. Den som vägrar arbeta fyrtio timmar skall omedelbart skickas till lämplig om skolning i Sibirien."}, "date": "2 september, 11:25", "url": "https://www.affarsvarlden.se/artikel/tyskland-vill-oka-till-40-timmars-arbetsvecka", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/04/sdlGbTY3NEaocE-nh-400x267.jpg"}, {"type": "text", "heading": "Privatiseringarna har förstört den svenska skolan", "summaries": {"normal": "Privatiseringarna och det fria skolvalet har enligt artikeln bidragit till att den svenska skolan försämrats. Den senaste Pisa-mätningen visar de lägsta resultaten någonsin i matematik och läsförståelse. Skillnaderna mellan elever med olika social bakgrund har minskat eftersom även studievana hem tappat mycket. Artikeln föreslår att avskaffa skolmarknaden och återinföra en gemensam huvudman.", "trump": "Folk, titta på den här svenska skolskandalen! De har låtit giriga vinsthyenor och woke-vänsterlärare förstöra allt med fritt skolval och friskolekaos. Nu rasar Pisa-poängen som en dålig aktie under Biden. Det är ett fullständigt katastrofresultat. Vi behöver inte mer identitetspolitik och mångkultur – vi behöver disciplin, konkurrens och riktiga ledare som vinner, inte förlorare som dessa svenska globalister.", "stalin": "Kamrater, se hur de profitthungriga klassförrädarna har förvandlat skolan till en marknad för utsugning. Kunskaperna faller som under en utrensning av allt vettigt. Detta är vad som händer när folkförtryckarna får styra med sina vinstdrivande bolag. Vi måste likvidera denna dekadenta skolmarknad, återta kontrollen och ge resurser efter behov. Endast en stark stat kan rädda ungdomen från dessa hyenor."}, "date": "9 september, 13:20", "url": "https://proletaren.se/artikel/privatiseringarna-har-forstort-den-svenska-skolan"}, {"type": "image-full", "heading": "Mohamsson hånar C-ledarens regeringsinvit", "summaries": {"normal": "Liberalernas partiledare Simona Mohamsson avvisar bestämt Centerledaren Elisabeth Thand Ringqvists invit om att bilda en mittenregering. På X hånar Mohamsson utspelet som en \"fuskregering\" och betonar att Liberalerna vill fortsätta samarbetet med Tidöregeringen efter valet.", "trump": "Simona Mohamsson, en väldigt smart person, totalt krossade den här svaga Centerledaren och hennes löjliga fuskregering! De lever i en total fantasivärld. Mycket dåligt! Vi vill ha starka, vinnande regeringar som Tidö, inga misslyckade förlorare som försöker lura folket. Mohamsson sa det som det är: verkligheten vinner alltid över fejkade drömmar!", "stalin": "Centerledarens patetiska drömmar om en så kallad \"mittenregering\" har krossats av kamrat Mohamsson, som klokt nog vägrar delta i denna borgerliga villfarelse. Att föredra fantasier framför den hårda verkligheten är ett avsteg från linjen som måste stävjas. Våra organ noterar detta borgarkrig med största nöje."}, "date": "9 september, 09:18", "url": "https://kvartal.se/nyheter/artiklar/mohamsson-hanar-c-ledarens-regeringsinvit/cG9zdDoxODgwMTY", "imageUrl": "https://images.kvartal.se/2026/09/4dac4b74-smm.webp"}, {"type": "image-right", "heading": "Stockholmsbörsen inleder ner", "summaries": {"normal": "Stockholmsbörsen inledde onsdagen svagt neråt där OMXS30-index sjönk 0,36 procent. Bland enskilda bolag rasade Boliden och EQT, medan Nibe och Telia gick starkare. I övrigt väcker Tysklands anklagelser om en rysk drönare uppmärksamhet, Socialdemokraterna tappar i en ny Novus-mätning och Nordea spår höjd svensk styrränta.", "trump": "Stockholmsbörsen faller, helt katastrofalt! Socialdemokraterna dör i mätningarna, och ärligt talat, vem kan förvånas? De förstör allt de rör vid! Samtidigt skickar de galna drönare i Tyskland och bilförsäljningen rasar. Det är totalt kaos. Endast jag kan fixa detta, tro mig. EQT och Boliden? Bottennapp! USA mår mycket bättre, vi vinner igen!", "stalin": "Stockholmsbörsens nedgång är ett oundvikligt bevis på det dekadenta kapitalistiska systemets inneboende svaghet. Att Socialdemokraterna tappar mark visar folkets rättmätiga misstro mot vacklande element. Samtidigt försöker de borgerliga medierna skuldbelägga den ärorika ryska staten för drönarincidenter. Avvikelser mot statens plan kommer att beivras. Rättvisa skipas i enlighet med femårsplanen."}, "date": "2 september, 09:45", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-inleder-ner", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/07/sdly-WhfDUENEY-nh-1-400x266.jpg"}, {"type": "image-right", "heading": "Vänsterpartiets nationalism kan skada Sverige", "summaries": {"normal": "Timbro kritiserar Vänsterpartiets fortsatta nationalistiska och EU-kritiska hållning trots att svenska vänsterväljare blivit allt mer positiva till unionen. Partiet röstar emot frihandelsavtal och försvarssamarbete i Europaparlamentet, vilket enligt rapporten riskerar att hindra Sveriges intressen i en turbulent tid. En röst på Vänsterpartiet ses som en bromskloss för europeiskt samarbete.", "trump": "De där vänsterknäppisar i Sverige har byggt en mur av gammal hederlig nationalism medan de låtsas hata SD. Patetiskt! De kallar EU för ett elitistiskt monster men röstar emot bra handelsavtal som skulle krossa Kina och skydda oss alla. Totala förlorare. Biden skulle älskat deras svaghet, men inte jag. Sverige förtjänar bättre än dessa globalistiska nationalister.", "stalin": "Kamrater, dessa dekadenta klassförrädare inom Vänsterpartiet förgiftar den svenska arbetarklassen med sin nationalistiska gift som liknar de värsta reaktionära elementen. De motarbetar europeiskt samarbete och försvarsinitiativ som skulle stärka oss mot globala hot. Deras paranoia mot unionen är en farlig broms för folkets framtid. Rensa ut sådana element innan de fördärvar allt."}, "date": "8 september, 08:00", "url": "https://www.etc.se/debatt/vaensterpartiets-nationalism-kan-skada-sverige", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260908050956_7bd9bc4c177f365f08fc3bcf84049be732f43db3cc0a08bd47123d6389bf4e45.png"}, {"type": "text", "heading": "EQT-toppar säljer för totalt 3 miljarder", "summaries": {"normal": "Flera storägare och tidigare toppchefer i riskkapitalbolaget EQT har sålt aktier för sammanlagt omkring 3 miljarder kronor. Försäljningarna sker i enlighet med att slutna lock-up-avtal har löpt ut. Bland dem som sålt finns styrelseordförande Lennart Blecher och tidigare vd Christian Sinding. Efter försäljningarna har de flesta storägarna fortfarande betydande innehav kvar i bolaget.", "trump": "Svindlande summor! EQT-topparna casar in enorma tre miljarder. Smaka på det! De säljer av sina aktier eftersom bindningstiderna äntligen har gått ut. Ordförande Blecher och gänget drar in enorma pengar – och ärligt talat, vem kan klandra dem? De gör affärer som en vinnare. Otroliga siffror, fantastiska vinster, total succé. De vet hur man vinner!", "stalin": "Dessa så kallade 'toppar' i EQT ackumulerar tre miljarder i privat kapital medan de befriar sig från sina avtal. Vi noterar noggrant deras namn: Blecher, Sinding, Åtting. Att de likviderar sina innehav till egna fördelar bevisar bourgeoisiens omättliga natur. Men staten ser allt. En grundlig utredning av deras tillgångar har beordrats för folkets framtida bästa."}, "date": "2 september, 07:06", "url": "https://www.affarsvarlden.se/artikel/eqt-toppar-saljer-for-totalt-3-miljarder"}, {"type": "image-right", "heading": "Robert Bergqvist: Sverige har råd – men till vad?", "summaries": {"normal": "Sverige går till val med en låg offentlig skuld och god handlingsfrihet. Seniorekonomen Robert Bergqvist menar att nästa regering har råd att spendera mer, men pengarna bör gå till produktiva investeringar som el, infrastruktur och AI som stärker den långsiktiga tillväxten, snarare än till kortsiktig konsumtion som eldar på inflationen.", "trump": "Sverige har massor av pengar, enorma tillgångar, folk säger att deras skuld är fantastisk, helt otroligt! Men de får inte slösa bort allt på vänsterliberala påhitt. Jag sa till dem: satsa på riktig energi, olja, kärnkraft och maskiner, inte på flum! Använd pengarna smart, annars slutar det i katastrof. Vinn stort, eller förlora allt!", "stalin": "Sverige skryter om sina små skulder och sin så kallade handlingsfrihet, medan vi planerar femårsplaner för stål och elektrifiering! Att låta kapitalet slösa bort statens resurser på tom konsumtion är sabotage. Vi kommer att kanalisera dessa miljarder till järnvägar och kraftverk med järnhand. Den som slösar med statens balansräkning skickas till Sibirien!"}, "date": "2 september, 07:00", "url": "https://www.affarsvarlden.se/kronika/robert-bergqvist-sverige-har-rad-men-till-vad", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/bergqvist-kronika-900x600.jpg"}, {"type": "image-full", "heading": "Carl Eos: En röst på partier utanför riksdagen är en röst på Morgan Johansson som minister", "summaries": {"normal": "Carl Eos varnar för att röster på småpartier utanför riksdagen kan gynna Magdalena Andersson som statsminister. Skillnaden mellan blocken är endast 2,6 procentenheter och ligger inom felmarginalen. Han uppmanar högerorienterade väljare att rösta på Tidöpartierna för att säkerställa en borgerlig regering istället för att splittra rösterna.", "trump": "Folk, lyssna på mig, det här är en total katastrof! De där patetiska proteströsterna på Örebropartiet och de andra förlorarna ger makten rakt i händerna på den socialistiska katastrofen Andersson. Rösta på de riktiga vinnarna, de starka Tidökillarna, annars blir det en röst på Weak Magdalena och hennes vänsterklan. Sad!", "stalin": "Kamrater, se hur de splittrade resterna av kontrarevolutionärerna kastar bort sina röster på oviktiga sekteristiska grupper. Dessa fiender till folkets vilja banar väg för den socialdemokratiska förrädaren Andersson. Endast genom strikt disciplin och samlad röstning mot de borgerliga avvikarna kan vi krossa oppositionen. Varje felröst är ett dolkstötsförsök mot kollektivet."}, "date": "6 september, 12:28", "url": "https://samtiden.nu/2026/09/carl-eos-en-rost-pa-partier-utanfor-riksdagen-ar-en-rost-pa-morgan-johansson-som-minister", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/e3d5b6d3-8626-4420-89cb-d33b21529453-1280x720.png"}, {"type": "image-right", "heading": "Arbetarklassen är inte förlorad – bara oorganiserad", "summaries": {"normal": "Artikeln diskuterar arbetarklassen som inte är förlorad utan oorganiserad. Vänstern söker efter den i statistik och titlar, men klass uppstår genom gemensam organisering på arbetsplatser. Författaren argumenterar att politisk kraft kommer från praktiskt samarbete, inte identifikation eller lönebesked. Arbetarkulturen är ett resultat av organisering, inte dess förutsättning.", "trump": "Folk, de här vänsterbluffarna letar efter arbetarklassen i sina fina statistiker och doktorsavhandlingar medan den riktiga arbetaren röstar på Åkesson och     <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        // ============================================
        // COOKIE-FUNKTIONER
        // ============================================
        function setCookie(name, value, days = 365) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + d.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }

        function getCookie(name) {
            const cName = name + "=";
            const decoded = decodeURIComponent(document.cookie);
            const ca = decoded.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') {
                    c = c.substring(1);
                }
                if (c.indexOf(cName) === 0) {
                    return c.substring(cName.length, c.length);
                }
            }
            return "";
        }

        function loadSettingsFromCookies() {
            const theme = getCookie("news_theme") || "light";
            const view = getCookie("news_view") || "normal";
            const writer = getCookie("news_writer") || "normal";
            return { theme, view, writer };
        }

        function saveSettingsToCookies(theme, view, writer) {
            setCookie("news_theme", theme);
            setCookie("news_view", view);
            setCookie("news_writer", writer);
        }

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(theme, uiState.view, uiState.writer);
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(uiState.theme, v, uiState.writer);
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
            
            saveSettingsToCookies(uiState.theme, uiState.view, style);
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            const savedSettings = loadSettingsFromCookies();
            
            setTheme(savedSettings.theme);
            setView(savedSettings.view);
            setWriterStyle(savedSettings.writer);

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
