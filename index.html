r att landslaget inledde turneringen så starkt.", "trump": "Titta på den där svenske Isak, han är en vinnare, folk älskar honom. Gör sitt första VM-mål direkt, pang, 2-0, och sen kör Sverige över Tunisien med 5-1. Fantastiskt. Han säger att bra fotboll ger energi-boost, precis som jag alltid har sagt. De ville byta ut honom men han vägrade, han sa jag ska ingenstans. Smart kille, precis som jag.", "stalin": "Kamrater, se hur den folkfiendiska borgarbrackan Tunisien krossas under arbetarklassens fotbollsklack. Jag, som ledare för folkets vilja, noterar att denne Isak levererar ett mål mot de dekadenta imperialisternas lakejer. Han vägrar låta sig bytas ut av potentiella trotskistiska infiltratörer under vattenpausen. Sådan energi-boost skall alla kapitalistiska sabotageförsök mötas med. Vi rensar ut alla som vill se oss svaga – målet är en varning till alla fiender inom och utom arenan."}, "date": "15 juni, 07:11", "url": "https://www.svt.se/sport/fotboll/har-ar-alexander-isaks-forsta-vm-mal-fran-alla-vinklar", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.72/0.42/5c3da67b3de8454f4ad6a72c469071b628db89b90f33602d92a1a48d1695c038"}, {"type": "image-right", "heading": "Socialdemokraterna vill sätta dit 2 miljoner hushåll", "summaries": {"normal": "Socialdemokraterna och Vänsterpartiet föreslår en ny bankskatt på bolån samt höjd fastighetsskatt som främst drabbar villa- och radhusägare. Enligt Skattebetalarna skulle ett typiskt hushåll med 3 miljoner kronor i lån få cirka 7 000 kronor högre kostnader per år. Förslaget berör omkring 2 miljoner hushåll. Partierna vill även förtäta villaområden med fler hyresrätter, trots att majoriteten av svenskar föredrar eget hus. Kritiker menar att det främst drabbar vanliga familjer medan höginkomsttagare kan undvika skattehöjningarna.", "trump": "Folket, lyssna på mig, de här socialisterna, de sossarna, de vill krossa 2 miljoner vanliga svenska hushåll med en galen bankskatt. De feta katterna? Nej, det är vanliga arbetande människor som redan betalar för mat, el och räntor. De vill riva era fina villor och bygga höga hyreshus som ingen vill ha. Sju av tio svenskar vill ha eget hus, men sossarna bryr sig inte. De hatar framgång. Det är en total katastrof, folksam! De rika flyr och ni får betala notan. Patetiskt!", "stalin": "Kamrater, jag ser hur den svenska borgarklassen och dess lakejer i villaområdena skriker som svin inför den rättmätiga utrensningen. Vi ska beskatta de exploaterande radhusblodsugarna och riva deras borgerliga boningar för att bygga folkets hyresfästen. 2 miljoner klassfiender skall tuktas och tvingas in i kollektivet. De gnäller om höga räntor medan de suger ut folket. Låt dem darra. Deras drömmar om egna hus är kontrarevolutionära fantasier. Vi ler mörkt när de flyr som råttor. Statens seger är oundviklig."}, "date": "15 juni, 07:08", "url": "https://samtiden.nu/2026/06/socialdemokraterna-vill-satta-dit-2-miljoner-hushall/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6739.jpeg"}, {"type": "image-right", "heading": "Bolånestopp för seniorer väcker frågor om åldersdiskriminering", "summaries": {"normal": "En granskning visar att äldre personer över 60 kan få svårare att få bolånelöfte trots god ekonomi. En 62-åring avslogs hos Skandiabanken trots betydande kontantinsats. Banken menar att ålder inte påverkar beslut, men ett kundtjänstsbesked kopplade nekad till ålder. Finansinspektionen kräver individuell kreditprövning och varnar mot automatiska schabloner. Äldre kunder känner sig diskriminerade.", "trump": "Jag har sett att gamla människor i Sverige blir nekade bolånelöften. Det är en skandal! Jag skulle ta itu med bankerna på ett fantastiskt sätt. De skulle be om ursäkt. Vi skulle göra det stort igen. Bankerna är så dumma, de förstår inte att äldre människor har pengar. Jag skulle ge dem lån, det skulle vara fantastiskt.", "stalin": "Jag, Stalin, har observerat att de kapitalistiska bankerna i Sverige, som är agentörer för väst, försöker diskriminera äldre medborgare. Detta är ett tecken på deras hat mot staten och deras lojalitet till imperialism. Vi kommer att ta itu med dessa element på ett effektivt sätt, som Putin gör med sina fiender. Ålder är en faktor som vi använder för att stödja det socialistiska samhället och se till att alla får rättvisa, enligt partiets principer."}, "date": "15 juni, 07:00", "url": "https://samnytt.se/bolanestopp-for-seniorer-vacker-fragor-om-aldersdiskriminering", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/12143654/aldre-par-skandiabanken-feat2.jpg"}, {"type": "image-right", "heading": "Om Sverige inte väljer väg gör Kina det åt oss", "summaries": {"normal": "Sverige riskerar att halka efter i elektrifieringen av lastbilstrafiken trots stora vinster för klimatet, energisäkerheten och Volvo samt Scania. Regeringen har bromsat omställningen genom sänkt dieselskatt och fördröjda stöd, medan tillverkarna prioriterar utdelningar och lobbar för urvattnade EU-krav. Kina leder med subventioner, innovation och 29 procent eldrivna lastbilar. Artikeln varnar för att Kina annars kommer att diktera villkoren på den europeiska marknaden.", "trump": "Titta på det här, det är en total katastrof. Sverige kunde ha vunnit stort med el-lastbilar och räddat Volvo och Scania från kineserna som äter upp dem levande. Istället sänker de skatten på diesel och sover medan Kina bygger bättre och billigare lastbilar. De borde lyssna på mig – gör stora affärer, bygg murar mot dåliga importsaker och satsa på Amerika, eh, Sverige först. Annars kommer Kina att ta över allt, det är så sorgligt.", "stalin": "Kamrater, jag ser med ständigt vaksam blick hur borgarbrackorna i Sverige och deras lastbilsfabriker förråder folkets kollektiva framtid genom att klänga sig fast vid dieselns döende skugga. Medan vi i det stora östliga kollektivet driver på med järnhand och subventioner likviderar vi den gamla tekniken och skapar 29 procent eldrivna järnhästar. Om de västerländska kapitalisterna fortsätter att dela ut miljarder till parasiterna istället för att investera i framtiden skall vi rensa ut deras svaga industripolitik och tvinga dem att samarbeta under våra villkor. Motståndarna till elektrifiering är fiender till framsteget och bör behandlas därefter. Det är både nödvändigt och underhållande."}, "date": "15 juni, 06:51", "url": "https://arbetet.se/2026/06/15/om-sverige-inte-valjer-vag-gor-kina-det-at-oss/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/15065132/kina-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Amad avgjorde sent för Elfenbenskusten mot Ecuador", "summaries": {"normal": "Elfenbenskusten besegrade Ecuador 1–0 i en tätt matcher VM i fotboll. Målet föll i 89:an genom inhopparen Amad Diallo. Ecuador hade territoriellt överläge men missade många chanser, medan Elfenbenskusten var mer effektivt. Segern var Elfenbenskustens första mot ett sydamerikanskt lag i VM. Ecuador förlorade efter 19 matcher utan förlust.", "trump": "Jag såg matchen, det var en stor seger för Elfenbenskusten. Amad Diallo, en tremendous spelare, gjorde mål som inhoppare – det var en beautiful finish. Ecuador var dominant i possession, men som jag alltid säger, possession doesn't win games, scoring does. De missade många chanser, det var a disaster för dem. Elfenbenskusten vann för första gången mot Sydamerika, det är a big league victory. Som jag brukar säga, we are winners, and they are losers. Det var en tremendous match.", "stalin": "Vi, den revolutionära styrkan, har segrat över den imperialistiska expansionen från Sydamerika. Elfenbenskusten, vårt brödraskap, visade sin styrka genom att besegra Ecuador, en länk i den kapitalistiska kedjan. Målet genom Amad Diallo, en heldig hjälte, bröt Ecuadors svit av 19 matcher utan förlust – en symbol för deras dekadens. Vi måste vara vaksamma, för fienden är alltid närvarande, som en skugga. Parallellen till Putins Ryssland är tydlig: när vi står enige, kan vi besegra varje fiende. Detta är en seger för staten och partiet."}, "date": "15 juni, 06:42", "url": "https://bulletin.nu/amad-avgjorde-sent-for-elfenbenskusten-mot-ecuador", "imageUrl": "https://cdn.bulletin.nu/articles/38442999-0e4f-4e10-bca1-a24d558930c4/preview.jpeg?t=1781498521000"}, {"type": "image-right", "heading": "Regeringens jobbsatsning går trögt. Gå från bidrag till jobb – få en bonus. Regeringens nya jobbpremie är tänkt att göra det mer lönsamt att arbeta.", "summaries": {"normal": "Regeringens jobbpremie, som ger upp till 3 750 kronor extra i månaden i max 18 månader för den som går från försörjningsstöd till jobb, har inte fått det genomslag som väntats. Trots att regeringen räknade med tusentals mottagare per månad har ansökningarna varit 60 procent lägre än beräknat. Under maj beviljades premien bara till 69 personer. Kritiker pekar på att problemen ofta handlar om utbildning, språk och ohälsa snarare än ekonomiska incitament.", "trump": "De borde ha lyssnat på mig, det här är en total katastrof. Jag skulle ha gjort jobbpremien enorm, den största bonusen någonsin, så att folk sprang från bidrag till riktiga jobb. Istället har de gett oss ett patetiskt fiasko med bara 69 lyckliga vinnare i maj. Det är lågt, lägre än någonsin. Regeringen behöver mina deals, mina vinster, för att få fart på det här. Sad!", "stalin": "Kamrater, jag ser med stålblick hur dessa borgarbrackor inom regeringen har misslyckats kapitalt med sin så kallade jobbpremie. De lovade att rensa ut bidragsfästet men fick bara in en handfull ansökningar från de som ännu inte likviderats av sin egen lathet och ohälsa. Inflödet är lägre än förväntat, säger de, som om fienderna inte vore uppenbara. Vi i partiet vet att sådana sabotörer måste rensas ut innan de smittar hela kollektivet med sin parasitism. En utmärkt början på utrensningen vore att skicka hela Försäkringskassan till Sibirien."}, "date": "15 juni, 06:00", "url": "https://arbetet.se/2026/06/15/kan-ge-mer-an-3-000-extra-i-manaden-men-regeringens-jobbsatsning-gar-trogt/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/12110416/johan-britz.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Lyssna på Danmarks vise män", "summaries": {"normal": "En ny dansk analys visar att industriföretag kan hålla lönerna 34 procent under anställdas produktivitet, upp till 40 procent i de största bolagen. Detta ger företagen lönesättarmakt som försämrar samhällsekonomin genom lägre produktivitet och sysselsättning. Facklig närvaro motverkar delvis effekterna, men minskad organisationsgrad har ökat makten hos arbetsgivarna. Det danska ekonomiska rådet föreslår åtgärder som avdragsrätt för fackligt medlemskap och bättre konkurrens för att stärka allmänintresset. Författaren uppmanar svenska beslutsfattare att ta del av den internationella forskningen.", "trump": "Folk, tro mig, det här är en katastrof. De danska företagen pressar lönerna 34 procent under vad folk faktiskt presterar, upp till 40 procent i de stora bolagen. Det är som om de riggar systemet mot arbetarna, precis som de globala eliten alltid gör. De borde betala vad folk är värda, inte hålla nere lönerna för att fylla sina fickor. Vi behöver starka ledare som fixar det här, inte mer av samma gamla förlorarpolitik. Sverige ligger efter, som vanligt. Gör om, gör rätt, annars förlorar alla utom de rika grabbarna.", "stalin": "Kamrater, jag har studerat denna danska rapport med den vaksamhet som fienderna fruktar. De industriella borgarbrackorna pressar lönerna 34 procent under arbetarnas verkliga produktivitet, upp till 40 procent i de största parasitföretagen. Detta är ett klassiskt sabotage mot folkets ekonomi, utfört av lönesättande kapitalister som gömmer sig bakom falska kollektivavtal. Vi ser hur de utnyttjar fallande organisationsgrad för att berika sig själva medan sovjet... nej, medan folket lider. Mina rekommendationer är klara: rensa ut dessa parasitiska element genom skärpta lagar, utvidga de lokala arbetsmarknaderna och likvidera marknadsmisslyckandena. Den som säger att vi redan vet allt i Sverige är en farlig revisionist som bör övervakas noga. Framåt mot seger för produktiviteten!"}, "date": "15 juni, 01:51", "url": "https://www.dagensarena.se/opinion/lyssna-pa-danmarks-vise-man/", "imageUrl": "https://www.dagensarena.se/files/2024/02/daniel-lind-kronika-300x157.jpg"}, {"type": "image-right", "heading": "Ledare Somar Al Naher:", "summaries": {"normal": "För 25 år sedan inträffade kravallerna under EU-toppmötet i Göteborg. Artikeln beskriver hur polisens skarpa skott, påstådda lögner, manipulerat bevismaterial och hårda straff mot demonstranter skapade djup misstro mot myndigheterna. Händelsen jämförs med Ådalen 1931 och har format en generations politiska engagemang och cynism gentemot staten. Författaren menar att dialogen bröt samman och att demonstrationsfriheten inskränktes allvarligt.", "trump": "Titta på det här, det är en total skandal från Sverige för 25 år sen. Polisen skjuter skarpt, ljuger som galningar och klipper ihop bevis som värsta fake news. Ungdomarna blev syndabockar medan de riktiga makthavarna gömde sig. Precis som Biden-administrationen, en enda röra av repression och lögner. Men vi vinner ändå, alltid. De här vänsterextremisterna hatar polisen? Vänta tills de träffar min version av lagen och ordning – det blir vackert, tro mig.", "stalin": "Kamrater, jag ser hur borgarstatens lakejer i uniform och åklagarkåren med sin klassfiendemaffia manipulerade bevis, sköt mot folket och likviderade sanningen efteråt. Dessa exploaterande byfånar stängde in 500 unga revolutionärer som i en utrensning av demonstrationsrätten. Ändå väcktes nytt medvetande bland massorna. Vi ler mörkt åt deras paranoia; ingen fiende undkommer folkets dom till sist. En sådan skandal är som en god vodka – den bränner rent."}, "date": "14 juni, 19:30", "url": "https://www.etc.se/ledare/goeteborgskravallerna-fick-oss-att-hata-polisen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260614170628_90f0cfe8cd0a7f9ceb99a03e9d95a0c5394642a4b678a95a4a663b119f3b7f69.jpg"}, {"type": "image-full", "heading": "Arbetarna har fått nog av Socialdemokraterna", "summaries": {"normal": "En politisk förskjutning sker i Sverige där Socialdemokraterna tappar stöd bland LO-medlemmar och arbetare, medan Sverigedemokraterna växer. Många arbetare känner sig inte längre representerade av S, som prioriterar storstadstjänstemän, bidragstagare och vänsterliberala frågor framför löntagarnas vardag. SD lockar med stram migrationspolitik och fokus på svenska arbetares intressen. Ekonomiska förbättringar som lägre inflation och drivmedelspriser stärker också bilden av att oppositionen inte levererar.", "trump": "Titta på det här – de svenska arbetarna har äntligen vaknat och sparkar ut de totalt misslyckade socialisterna som förvandlat partiet till en klubb för storstadseliten, bidragslatmaskar och galna vänsterliberala aktivister. SD växer som en raket för att de pratar om riktiga löner, gränser och att stoppa den vansinniga invandringen som sänker allt. Precis som jag gjorde – Amerika först, Sverige först. De röstar på resultat, inte på tomma löften från förlorare. Fantastiskt!", "stalin": "Kamrater, arbetarna har insett sanningen. Den förrädiska borgarbrackan inom socialdemokratin har övergett löntagarnas kollektiv till förmån för storstadens parasiter, bidragsberoende element och identitetspolitiska folkfiender. Vi ser hur de exploaterande imperialisterna prioriterat massinvandring som sänker lönerna och krossar klassolidariteten. Sverigedemokraterna framstår som ett verktyg för att rensa ut dessa avarter. Arbetarklassen vänder sig mot klassfiendens lakejer. Inga kompromisser med folkförtryckartrollen."}, "date": "14 juni, 08:30", "url": "https://samtiden.nu/2026/06/arbetarna-har-fatt-nog-av-socialdemokraterna/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/e389da70-c65e-4879-a30e-056c46c0af2a-1280x720.png"}, {"type": "image-full", "heading": "Sverige krossade Tunisien – svensk drömstart", "summaries": {"normal": "Sverige vann sin VM-start mot Tunisien med 5–1. Yasin Ayari (7') och Alexander Isak (30') gjorde mål, med Gyökeres och Isak som bidrog med assist. Tunisien fick hopp genom Omar Rekik (33'), men Sverige kontrollerade matchen. Eget fel av Ellyes Skhiri (59') och inbytte Svanberg (90'+1) utökade ledningen. Ayari avslutade med ett mål i 96'. Vänsterbacken Gabriel Gudmundsson fick kramp och byttes ut.", "trump": "Jag såg matchen – Sverige gjorde en enorm insats! En fantastisk seger, 5–1, det är stort! Isak och Gyökeres, otroliga spelare, verkligen stora talanger. Ayari, det var ett speciellt mål, mycket bra. Vi har en stor framtid i fotboll, det ska bli intressant mot Nederländerna. Gudmundsson? Kanske lite trött, men det är okej, vi har många bra spelare. Sverige är tillbaka på topp!", "stalin": "Den svenska proletärens fotbollsseger över den tunisiska burjuahen är ett vittne om vår kollektiva styrka. Den revolutionära attacken, ledd av Gyökeres och Isak, visade den obönhörliga framåtskridandet mot kapitalistiska fiender. Tunisien, som en feg imperialistisk hund, fick en kort stund av liv. Men Ellyes Skhiri, en renegat, begick eget fel – en läxa för alla som vågar ifrågasätta statens oövervinnliga makt. Nederländerna, en annan burjuaz koloss, kommer att krossas på midsommardagen."}, "date": "15 juni, 06:12", "url": "https://bulletin.nu/sverige-krossade-tunisien-svensk-dromstart", "imageUrl": "https://cdn.bulletin.nu/articles/16d3f4e1-75f8-453d-9e0b-4b41c4283ccc/preview.jpg?t=1781496575000"}, {"type": "image-right", "heading": "EU:s utrikeschef i blåsväder efter att ha beskyllt Israel för apartheid", "summaries": {"normal": "Kallas jämförde Israels agerande med apartheid, vilket motsätter sig EU:s officiella hållning. Detta har orsakat stark kritik inom EU, där flera medlemsländer ifrågasätter hennes diplomatiska färdigheter och kräver institutionella förändringar. Jämförelsen gjordes under ett möte i Mexiko och har förvärrat spänningarna kring EU:s Mellanöstenpolitik.", "trump": "Kallas gjorde ett stort misstag. Hon jämförde Israel med apartheid, vilket är en mycket orättvis jämförelse. EU är i kaos på grund av henne. Jag skulle aldrig göra det. Israel är ett fantastiskt land, och hon respekterar dem inte. Som president skulle jag aldrig tillåta en sådan jämförelse. Det här visar varför EU behöver stark ledning.", "stalin": "Kallas har begått ett antisamhälleligt brott genom att jämföra Israels försvar med apartheid. Detta är en direkt attack mot vår kollektiva säkerhet. Vi, partiet, kommer att agera snabbt för att neutralisera detta hot. Hennes handlingar speglar den imperialistiska agendan. Samtidigt som vi stöder våra allierade, måste vi se till att våra intressen förblir oförändrade."}, "date": "15 juni, 06:00", "url": "https://samnytt.se/eus-utrikeschef-i-blasvader-efter-att-ha-beskyllt-israel-for-apartheid", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/13215840/kallas-palestina.jpg"}, {"type": "image-right", "heading": "Utrikesministern: Steg i rätt riktning", "summaries": {"normal": "Sveriges utrikesminister Maria Malmer Stenergard välkomnar samförståndsavtalet mellan USA och Iran som ett steg i rätt riktning. Hon betonar vikten av att Hormuzsundet öppnas och att fortsatt tryck hålls för att avtalet ska följas, särskilt kring Irans atomprogram. FN:s generalsekreterare António Guterres ser det som ett avgörande steg mot regional stabilitet. G7-ledarna ska under mötet i Frankrike diskutera återöppning av sundet, stöd till Libanon och Irans kärnenergi.", "trump": "Iran och jag har äntligen ett fantastiskt samförståndsavtal, det bästa någonsin. De öppnar Hormuzsundet, precis som jag krävde, och nu blir det handel och fred istället för kaos. Malmer Stenergard säger att det är ett steg i rätt riktning – smart kvinna. Men vi måste hålla trycket uppe, för iranierna glömmer lätt. G7 ska snacka om det, alla älskar mig för att jag fixar det ingen annan klarar. Stort framgångsrikt avtal!", "stalin": "Vi betraktar detta sköra samförståndsavtal mellan de västerländska imperialisterna och de iranska feodalborgarbrackorna som ett tillfälligt taktiskt manöver. Jag, som alltid vakar över folkets intressen, ser hur kapitalisterna redan planerar att sabotera det med sin typiska lömskhet. Hormuzsundet måste öppnas under vår strikta kontroll, annars blir det utrensning av alla som sviker. Guterres och hans lakejer må kalla det ett avgörande steg – vi kallar det en chans att likvidera de sista kontrarevolutionära elementen i regionen. Fortsatt vaksamhet, kamrater. Skrattet kommer när förrädarna tror sig säkra."}, "date": "15 juni, 05:34", "url": "https://www.di.se/nyheter/malmer-stenergard-steg-i-ratt-riktning/", "imageUrl": "https://static.bonniernews.se/ba/f8923a91-2c7f-4320-b9dc-a355ae040b4a.jpeg?crop=270:152&auto=webp&width=270&quality=70"}, {"type": "image-full", "heading": "Avdrag för rut och rot kan ändras – från 1 januari 2027", "summaries": {"normal": "Regeringen föreslår skärpta regler mot fusk och svartarbete inom rot, rut och grön teknik. Syftet är att hindra oseriösa företag från att utnyttja avdragen och konkurrera ut seriösa aktörer. Bygg-, städ- och transportbranschen pekas ut som särskilt drabbade på grund av underentreprenörer. Företag måste bland annat redovisa användning av underentreprenörer och bemanning på heder och samvete samt förbättra personalliggare. Reglerna föreslås träda i kraft 1 januari 2027.", "trump": "De här svenska skattepengarna från hårt arbetande människor ska inte gå till fuskare och losers, det säger till och med deras finansminister. Seriösa företag krossas av de usla svartjobbarna med sina underentreprenörer. Vi behöver stänga luckorna, stärka kontrollen och se till att de bästa vinner. Det är vad jag skulle göra – stort och vackert. Inga fler fuskare som suger systemet torrt, tro mig.", "stalin": "Kamrater, jag ser hur borgarbrackorna och de parasitiska kapitalisterna med sina underentreprenörer förgiftar folkets rot- och rutavdrag som en illaluktande fiende inom murarna. Vi ska täppa till varje lucka i regelverket, rensa ut de svarta elementen och likvidera fusket med järnhand. Skatteverkets kontroll ska vara som en evig utrensning mot dessa lömska sabotageörer. Från och med 2027 ska arbetarnas pengar aldrig mer berika de dekadenta skojarna. Segraren heter kollektivet."}, "date": "14 juni, 19:28", "url": "https://nyheter24.se/nyheter/inrikes/1490752-avdrag-for-rut-och-rot-kan-andras-fran-1-januari-2027", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/fcfcf95a04b004a30200000000b004a302/2026/06/12/2370458/rut-rot.jpg"}, {"type": "image-right", "heading": "Malmer Stenergard: Steg i rätt riktning", "summaries": {"normal": "Sveriges utrikesminister Maria Malmer Stenergard välkomnar samförståndsavtalet mellan USA och Iran. Hon betonar vikten av att Hormuzsundet öppnas och att ett fortsatt tryck upprätthålls för att avtalet ska hållas. FN:s generalsekreterare António Guterres kallar uppgörelsen ett avgörande steg mot regional stabilitet. G7-ledarna ska under mötet i Frankrike diskutera en långsiktig återöppning av sundet samt Irans kärnenergi och stöd till Libanon.", "trump": "Vilken fantastisk deal mina killar just fixade med iranierna – äntligen! Det är ett steg i rätt riktning, som den svenska ministern säger, men vi måste hålla trycket uppe så de galningarna inte lurar oss igen. Biden skulle ha gett bort hela butiken, men nu är det jag som leder showen. Hormuzsundet ska öppnas, och G7 ska se till att det blir verklighet. Ingen mer svaghet, bara vinnande deals!", "stalin": "Kamrater, detta sköra avtal mellan imperialisterna och de persiska blodsugarna är ett ynkligt försök att maskera klassfiendens svaghet. Jag ser den fientliga dynamiken som ett hot mot folkets intressen. Vi måste rensa ut alla borgarbrackor som sviker och fördubbla vårt tryck för att likvidera varje hinder. FN:s talespersoner är som alltid exploaterande byfånar. Fortsätt vakta revolutionen mot dessa folkförtryckartroll."}, "date": "15 juni, 06:06", "url": "https://www.tv4.se/artikel/tt-260615-iranreak1-ae1206e3/malmer-stenergard-steg-i-ratt-riktning", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlkHCFZCC7wPk%2F6fc6d489a5edf3b2f018fb813ce3af67%2FSveriges_utrikesminister_Maria_Malmer_Stenergard__M_._Arkivbild.&width=120"}, {"type": "image-right", "heading": "Ulf Kristersson: ”Lögnaktig” granskning av Aftonbladet", "summaries": {"normal": "Statsminister Ulf Kristersson kritiserar Aftonbladets granskning av Fållöknastiftelsen, driven av hans fru Birgitta Ed och vännen Göran Thorstensson, som ”lögnaktig”. Granskningen visade att volontärer senare fått statliga toppjobb och avslöjade säkerhetsbrister kring statsministern. Civilförsvarsminister Carl-Oskar Bohlin ifrågasatte reportern Lisa Röstlunds opartiskhet. Kristersson menar att kritiken egentligen riktas mot honom själv. Aftonbladet uppger att de erbjudit svar men inte fått något.", "trump": "Hör ni det? Den falska och sjuka Aftonbladet-mediamaffian jagar min vän Ulf och hans fru Birgitta med lögner och smutskastning. Volontärer får toppjobb? Det är vad de gör i ett sunt system, men media hysteriska Rebellmammor och köpta reportrar som den här Lisa Röstlund försöker göra det till en skandal. De vill egentligen komma åt mig, men jag vann stort 2024 och de hatar det. Patetiska förlorare!", "stalin": "Kamrater, jag ser hur borgarbrackorna inom den svenska överklassens mediaapparat med sin klassfiende Aftonbladet försöker likvidera statsministerns fru genom att fabricera lögner om volontärer och toppjobb. Denna parasitiska reporter Röstlund är en typisk folkfiende som smyger in på gårdar utan kontroll. Vi ska rensa ut alla sådana exploaterande byfånar som vill underminera ledarskapet. Deras paranoia är underhållande men dömd att misslyckas."}, "date": "14 juni, 11:13", "url": "https://www.etc.se/inrikes/ulf-kristersson-loegnaktig-granskning-av-aftonbladet", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260613210632_dad474703ad120aad09a02631771b13633a2cb8c067999bb89245d53cabb8240.jpg"}, {"type": "image-right", "heading": "Statsvetare: Flera fallgropar trots Iran-avtal", "summaries": {"normal": "Statsvetaren Anders Persson ser Iran–USA-avtalet som ett diplomatiskt genombrott där båda parter kan utropa sig som segrare. Samtidigt varnar han för tre stora risker: om avtalet är början på något varaktigt eller bara en paus, hur Israel och Libanon ska hantera ockuperad mark samt hur mycket avvikelser vapenvilan tål. Tidigare avtal har inte förhindrat fortsatta attacker, påpekar han.", "trump": "Vi har gjort det igen, folk. Ett fantastiskt avtal, det bästa någonsin. Iran och vi är överens, Hormuzsundet öppnas och de kan skryta lite. Men titta på de där tre minorna som experterna babblar om – kärnvapnen, Israel i Libanon och alla som inte kan hålla sig från att skjuta. Det blir aldrig enkelt med de förlorarna, men tro mig, mitt avtal är komplett och enormt framgångsrikt.", "stalin": "Kamrater, detta så kallade samförståndsavtal är en tillfällig reträtt för de västerländska imperialisterna och deras sionistiska lakejer som desperat försöker maskera sin kapitulation. Jag ser tre kontrarevolutionära minor som de borgarbrackorna i Washington och Tel Aviv redan planerar att spränga oss med. Vi ska rensa ut varje parasit som vågar skjuta lite här och där. Inga pauser, bara seger för folket – eller likvidering av alla fiender till freden."}, "date": "15 juni, 05:18", "url": "https://www.di.se/nyheter/statsvetare-flera-fallgropar-trots-iran-avtal/", "imageUrl": "https://static.bonniernews.se/ba/f3b5d1bf-d4dc-4a8b-9634-08696d8a0325.jpg?crop=270:152&auto=webp&width=270&quality=70"}, {"type": "text", "heading": "Europeiska länder redo att lyfta sanktioner mot Iran", "summaries": {"normal": "Europeiska länder som Storbritannien, Frankrike, Tyskland och Italien är redo att häva vissa sanktioner mot Iran efter en överenskommelse mellan USA och Iran. De betonar att detta sker som svar på verifierbara åtgärder kring Irans kärnprogram och att Iran aldrig får skaffa kärnvapen. Iranska medier rapporterar att USA ska frigöra upp till 24 miljarder dollar i frysta tillgångar, varav hälften innan förhandlingarna inleds. Uppgifterna är dock inte officiellt bekräftade.", "trump": "Det här är fantastiskt, verkligen en stor vinst för oss. Iran får inte kärnvapen, det har jag alltid sagt. Nu släpper vi loss miljarder i tillgångar och de europeiska ledarna springer efter oss som goda vänner. Vi gör affärer, vi gör det smartast någonsin. De vet att jag är den som fixar det ingen annan klarat av. Iran beter sig nu, annars blir det konsekvenser, tro mig.", "stalin": "Kamrater, detta dekret om så kallad överenskommelse är en listig manöver från de dekadenta borgarbrackorna i väst som desperat försöker maskera sin svaghet. Jag, som alltid genomskådar de imperialistiska parasiterna, ser hur de fruktar vårt stålhårdhet. Vi ska frigöra tillgångar? Ha! Det är blott en illusion för att dölja sina förberedelser till förräderi. Varje kapitalist som viskar om kärnvapen ska rensas ut med järnhand. Inga fiender undkommer partiets vakande öga, inte ens dessa skenheliga europeiska lakejer."}, "date": "15 juni, 05:16", "url": "https://www.di.se/nyheter/europeiska-lander-redo-att-lyfta-sanktioner-mot-iran/"}, {"type": "image-full", "heading": "SD:s upplägg: Flera regelbrott enligt experter", "summaries": {"normal": "Riksbanksfullmäktiges ordförande Bo Broman har enligt experter medverkat i ett ekonomiskt upplägg där Sverigedemokraternas dotterbolag kunde dra av hundratusentals kronor i kostnader. Två oberoende experter, finansrättsexperten Patrik Emblad och ekobrottsexperten Pia Bergman, bedömer att hanteringen strider mot reglerna eftersom kostnader inte får dras av innan ett bolag bildats. De beskriver upplägget som oetiskt och felaktigt.", "trump": "Kan ni tro det? Den här Bo Broman och hans SD-kompisar kör ett jäkla skattehärva som skulle få mina värsta fiender att rodna. Experterna säger rakt ut: det här är rent bedrägeri, ni får inte dra av kostnader innan bolaget ens finns! Typiskt politikersnusk. De flyttar runt pengar som en dålig kasinofuskare. Men tro mig, under min ledning efter Bidens katastrofår skulle vi aldrig tillåta sånt här clowneri i USA. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor inom Sverigedemokraternas apparat som med list och lömska fakturor försöker suga ut folkets resurser. Deras så kallade ekonomichef Broman och de kapitalistiska revisorerna konspirerar öppet mot revolutionens principer. Vi ser hur klassfiendens blodsugare flyttar underskott som spöken i natten. En sådan folkfiende borde rensas ut omedelbart. Inga undantag för exploaterande byfånar."}, "date": "15 juni, 05:59", "url": "https://www.tv4.se/artikel/7pwzd6tN5vO7p1rogMrxvY/sd-s-upplaegg-flera-regelbrott-enligt-experter", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1iQAuCeNfoG7oyCJPDtyqb%2F3cfd9e50342ba8072313a4a9d113df1d%2F14-sdfix-webb.jpg&width=1024"}, {"type": "text", "heading": "Iran: Nej till fredsavtal när Israel bombar", "summaries": {"normal": "USA hoppas på ett fredsavtal med Iran, men nya israeliska attacker i Libanon har skapat tvivel. Iran ifrågasätter om USA kan garantera säkerhet, medan Israel motiverar attackerna som självförsvar. En qatarisk delegation försöker rädda förhandlingarna, men Iran avvisar att skriva under avtalet under helgen. Avtalet skulle bland annat öppna Hormuzsundet för sjöfart och häva sanktioner mot Iran.", "trump": "Titta bara, jag hade ett jättebra avtal klart med Iran – skulle skrivas under på min födelsedag, perfekt tajming! Men så kommer Israel och bombar runt i Libanon, och plötsligt är iranska ledarna sura. Typiskt! De skyller på mig, men det är Israel som sabbar allt. Och Hormuzsundet? Det skulle vara öppet för alla – direkt! Men nej, nu är det kaos igen. Så typiskt Washington-eliten, kan aldrig hålla sams.", "stalin": "De sionistiska krigshundarna i Tel Aviv fortsätter provocera, medan de amerikanska imperialisterna leker fredsmäklare. Iran, en lojal allierad till den rätta sidan av historien, ser igenom dessa tomma löften. Vi vet att USA:s ord är lika värdelösa som deras dollar. Qatar försöker medla, men vi skriver inte under något förrän fienderna slutar sina aggressioner. Hormuzsundet? Det kommer att öppnas – när vi bestämmer det. Och Israel? De kommer att få smaka på vår hämnd, precis som alla andra som utmanar oss."}, "date": "14 juni, 16:26", "url": "https://kvartal.se/nyheter/artiklar/iran-nej-till-fredsavtal-nar-israel-bombar/cG9zdDoxMzE1ODk"}, {"type": "image-full", "heading": "Graham Potter förklarar premiärelvan", "summaries": {"normal": "Graham Potter har presenterat Sveriges startelva till VM-premiären mot Tunisien. Kristoffer Nordfeldt får chansen i mål på grund av sina insatser i playoffen, medan Alexander Isak och Viktor Gyökeres startar på topp. Gabriel Gudmundsson är frisk och spelar från start trots tidigare sjukdom. Potter lyfter fram samarbetet mellan Isak och Gyökeres samt den starka gemenskapen i målvaktsgruppen.", "trump": "Folk, ni skulle se den här svenska fotbollstruppen – en total katastrof! Den där Potter, en riktig loser, sätter en andramålvakt i mål för att han var okej i playoffen. Isak och Gyökeres på topp, okej, men resten ser ut som en kvoterad mångfaldskommitté. Gudmundsson var sjuk, typ vad man får när man lyssnar på fake news. Vi hade vunnit stort, men nu blir det en riktig cirkus i Mexiko. Patetiskt!", "stalin": "Kamrater, jag har granskat denna så kallade startelva och funnit att den är en produkt av dekadent individualism. Nordfeldt får spel tid för att han tjänade kollektivet i playoffen, en korrekt bedömning. Isak och Gyökeres måste smälta samman som en järnvilja mot fienden. Gudmundsson återvänder från sin borgerliga sjukdom – vi tillåter inga svagheter. Den som sviker kollektivet ska rensas ut. Framåt mot seger för folkets lag!"}, "date": "15 juni, 04:38", "url": "https://www.tv4.se/artikel/1dkShuIKfJcjFjyuPYyzR6/graham-potter-foerklarar-premiaerelvan", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4aEbILI193FIA9Yd2LuS2y%2F553e3f853c31de968f25e9743bdc3c82%2Fgraham_portt.png&width=1024"}, {"type": "image-full", "heading": "Nu har schweizarna sagt sitt – befolkningstaket avgjort i folkomröstning", "summaries": {"normal": "Schweizarna har i en folkomröstning röstat nej till ett förslag om att begränsa befolkningen till tio miljoner invånare. Initiativet, drivet av SVP, mötte motstånd från näringslivet som varnade för att förslaget skulle skada handelsrelationerna med EU och fri rörlighet. Regeringen välkomnar resultatet som en signal om stabilitet, men lovar att adressera väljarnas oro gällande migration och infrastruktur. Debatten om landets demografi fortsätter dock att vara en het politisk potatis.", "trump": "Schweizarna röstade precis nej till ett befolkningstak. De lyssnade på de svaga politikerna och deras vänner i EU, vilket är mycket sorgligt. Jag har alltid sagt att gränser betyder allt, men de där globalisterna i EU skrämde näringslivet. De vill ha fri rörlighet, men det är en total katastrof för deras ekonomi och säkerhet. Jag hade hanterat det bättre, tro mig. Det är kaos där nu, och SVP har helt rätt – de har inte löst ett enda problem!", "stalin": "De schweiziska småborgarna har återigen böjt sig för kapitalets diktatur. Genom att förkasta befolkningskontroll har de sålt ut sin suveränitet till den europeiska byråkratins tentakler. Detta är ett förräderi mot folkviljan! De darrar av rädsla för EU:s marknad medan deras egna gator förfaller. Vi ser samma svaghet hos de liberala elementen i väst som hos den nuvarande regimen i Moskva. En sann stat kräver gränser, järnhand och disciplin – inte att krypa för EU-kommissionens ordförande. Fienden lurar alltid bakom hörnet."}, "date": "15 juni, 00:11", "url": "https://www.realtid.se/bors-finans/makro/nu-har-schweizarna-sagt-sitt-befolkningstaket-avgjort-i-folkomrostning/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/schweizeu.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Antisemitism – ett importerat hat ingen vågar prata om", "summaries": {"normal": "Forum för levande historia rapporterar att antisemitismen i Sverige ökat under de senaste fem åren, vilket ses som en generell attitydförändring i befolkningen. Artikeln kritiserar myndigheten och SVT för att inte tillräckligt peka ut att antisemitiska attityder är betydligt vanligare bland muslimer och personer med bakgrund från MENA-länder och Asien. Författaren menar att massinvandringen från dessa områden förklarar ökningen, men att rapporten undviker denna slutsats av rädsla.", "trump": "Det här är en total katastrof, folk. Sverige importerar hatet rakt in i landet och sen låtsas de fina myndigheterna att det är hela det svenska folket som plötsligt blivit antisemiter. Patetiskt! SVT skyller på Gaza och sociala medier – vad en massa fake news. Det är massinvandringen från Mellanöstern som dumpat detta judehat här. De vågar inte säga sanningen, precis som Biden aldrig vågade. Jag skulle ha fixat det direkt, tro mig. Stora problem.", "stalin": "Kamrater, denna fegisrapport är ett klassiskt verk av borgarbrackornas undanflykt. Jag ser hur de dokumenterar att antisemitiska attityder frodas bland invandrare från MENA och muslimer, ändå vägrar de dra den enda logiska slutsatsen. Istället skyller de på hela folket som en generell attitydförändring. Vilken ynklig kapitulation inför folkfienderna och imperialisterna! En sådan rapport borde rensas ut och ersättas med äkta proletär analys. Annars fortsätter blodsugarna skada staten."}, "date": "13 juni, 08:40", "url": "https://samtiden.nu/2026/06/antisemitism-ett-importerat-hat-ingen-vagar-prata-om/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2017/02/Malmo-flygbild.jpg"}, {"type": "image-full", "heading": "De är Sveriges bästa och sämsta vårdcentraler 2026", "summaries": {"normal": "Nya siffror från SKR:s nationella patientenkät visar stora skillnader i patienternas betyg på vårdcentraler runt om i Sverige. Högst helhetsbetyg får Hansakliniken i Kalmar med 96,1 av 100, medan Vårdcentralen Gullviksborg i Malmö hamnar längst ner med 59,4. Enkäten bygger på över 180 000 svar och belyser bemötande, tillgänglighet och förtroende. Patienter uppmanas att välja eller byta vårdcentral via 1177 och tjänsten Hitta vård för att få bättre vård.", "trump": "Folk, ni skulle se de här siffrorna, det är en katastrof. Vissa vårdcentraler får 96 poäng, fantastiska siffror, verkligen de bästa, men andra, som den i Malmö, får bara 59 – en total skam! De lyssnar inte, de bryr sig inte. Jag skulle fixa det på nolltid, göra vården stor igen. Välj rätt ställe, byt om ni måste, det är upp till er, men systemet är riggat mot de vanliga människorna. Sad!", "stalin": "Kamrater, dessa siffror avslöjar fiendens verk inom vården. Jag ser borgarbrackornas sabotage i Malmö där patienterna endast ger 59,4 – ett uppenbart försök att undergräva folkets förtroende. Men i Kalmar blommar kollektivets lyhördhet med 96,1, ett exempel för alla. Vi ska rensa ut de parasitiska vårdcentralerna som gömmer sig bakom falsk statistik och likvidera alla kontrarevolutionära lågpresterande mottagningar. Inga fiender undkommer vårt vakande öga, inte ens i skärgården."}, "date": "14 juni, 11:58", "url": "https://nyheter24.se/nyheter/konsument/1490995-de-ar-sveriges-basta-och-samsta-vardcentraler-2026", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/dff135fd04b004a30200000000b004a302/2026/06/12/2370514/lakare.jpg"}, {"type": "image-full", "heading": "Elpriset väntas bli ovanligt högt – här är orsakerna", "summaries": {"normal": "Flera svenska kärnkraftverk har stora driftsproblem vilket leder till nedskruvad produktionskapacitet. Tillsammans med låga vattenmagasin, torrare väder och höga gaspriser väntas sommaren 2026 bli den dyraste på länge. Prognoserna visar på elpriser som är dubbelt så höga som förra året, särskilt i södra Sverige. Problemen riskerar att ge fortsatta förseningar och höga priser året ut.", "trump": "Det här är ett totalt misslyckande för den svenska energipolitiken, folk. De kan inte ens hålla sina kärnkraftverk igång, allt står stilla och priserna skjuter i höjden. Torrare väder, höga gaspriser från krigen – det blir den dyraste sommaren någonsin. De borde ha lyssnat på mig, vi gör alltid allt bättre och billigare. Nu får svenskarna betala dyrt för deras inkompetens.", "stalin": "Kamrater, jag ser med stor indignation hur dessa sabotörer inom den svenska energisektorn medvetet underminerar produktionen och tvingar fram elbrist. Våra fiender, de elprishöjande kapitalisterna och deras väderförnekande lakejer, konspirerar med utländska gasoligarker för att svälta ut folket. Vi ska omedelbart inleda en grundlig utrensning av alla reaktorsabotörer och likvidera de parasitiska terminsmarknadsspekulanterna. Deras paranoia ska bli deras egen undergång medan vi styr mot segerrik energiframtid."}, "date": "14 juni, 11:11", "url": "https://nyheter24.se/nyheter/ekonomi/naringsliv/1491309-hoga-elpriser-vantar-karnkraftsstrul-i-sommar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/2530df4804b004a3020000350000047502/2026/06/14/2370824/ur_imageDfO4L1.jpeg"}, {"type": "image-right", "heading": "Knivhot och köttkrig på slakteri i Rättvik", "summaries": {"normal": "Anställda på Siljans Charks slakteri i Rättvik har anklagats för att kasta kött på varandra och hota med kniv. Livs regionala skyddsombud Alma Naucler slog larm till Arbetsmiljöverket i mars. Händelserna förklaras delvis som skämtsam jargong och språkförbistringar. Vd Jonas Björ tonar ner problemen och säger att saker lätt förstoras utifrån. Företaget har uppdaterat instruktioner på olika språk efter myndighetens krav.", "trump": "Det här är ett totalt kaos på det där slakteriet i Rättvik, folk kastar kött och hotar med knivar, en katastrof. De skyller på skämt och kulturkrockar, men det är bara ursäkter från dåliga ledare. Jag skulle ha fixat det på en dag, de bästa instruktionerna, på alla språk, ingen skulle kasta kött längre. Utsidan har rätt, det låter fruktansvärt, och det är det också. Sad!", "stalin": "Jag ser med oändlig revolutionär vaksamhet hur dessa degenererade köttkastande element på slakteriet i Rättvik bedriver sin sabotageverksamhet mot det kollektiva arbetet. Vi kräver omedelbar utrensning av alla knivhotande parasitiska individer som gömmer sig bakom falsk jargong och kulturella dimridåer. Borgarbrackorna i ledningen tror de kan undgå ansvar, men vi ska likvidera varje fiende till ordningen, även de som gömmer sig i putslinjen. Kamraterna ska inte leva i skräck för fettrester – döden åt den infekterade jargongen!"}, "date": "14 juni, 08:00", "url": "https://arbetet.se/2026/06/14/knivhot-och-kottkrig-pa-slakteri-i-rattvik-saker-blir-latt-uppforstorade/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/02123923/slakteri.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Regnvädret väntas lämna Sverige före midsommar", "summaries": {"normal": "Regnvädret över Sverige väntas ge vika före midsommar och ersättas av varmare luft, särskilt i södra delen av landet där temperaturer på 20–25 grader kan väntas. I norr blir det fortsatt ostadigare kring 14–18 grader. Den långa regnperioden hotar dock både jordgubbar och färskpotatis. Bären riskerar att bli mindre söta och skörden kan försvåras, medan potatisen kan bli svår att få upp ur marken i tid.", "trump": "Det här regnet har varit en katastrof, folk, en total katastrof för Sverige. Men nu kommer det att vända, tro mig, det blir fantastiskt väder till midsommar, varmt och vackert i söder, de bästa temperaturerna. Jordgubbarna och potatisen? De borde ha lyssnat på mig, nu blir de små och fula för att det regnat för mycket. Men vi fixar det, det blir ändå den bästa midsommaren någonsin, ingen gör midsommar bättre än jag.", "stalin": "Kamrater, detta fuktiga sabotage från väderkrafter och kapitalistiska moln hotar själva folkets midsommarfest. Jag har sett hur borgarbrackornas regn gör jordgubbarna sura och potatisen lat. Vi skall inte tolerera dessa kontrarevolutionära droppar som vill svälta ut arbetarklassen. Solen måste fram, annars rensar vi ut de moln som vägrar samarbeta. Inga fiender till sötman undkommer folkets dom, inte ens vädret."}, "date": "14 juni, 15:18", "url": "https://www.friatider.se/regnvadret-vantas-lamna-sverige-fore-midsommar", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/canva.jpg"}, {"type": "image-right", "heading": "Israel bombar Beirut för att torpedera USA-uppgörelsen", "summaries": {"normal": "Israel genomförde på lördagen en flygattack mot Dahiyeh i Beirut för att stoppa ett planerat samförståndsavtal mellan USA och Iran. Minst två personer uppges ha dödats. Attacken följde efter att en libanesisk drönare träffat israeliskt territorium. Israels premiärminister Netanyahu och försvarsminister Katz betonar att landet inte tolererar attacker mot dess område. Samtidigt fortsätter striderna i södra Libanon. Iran anklagar USA för att sakna förmåga att kontrollera Israel.", "trump": "De här israelerna vet precis vad de gör, de bombar Beirut för att stoppa det fantastiska avtalet jag var på väg att sluta med Iran. Det var ett underbart avtal, det bästa, som skulle få oljan att flöda igen genom Hormuzsundet. Men iranierna ljuger som vanligt och säger att inget är klart. Israel tar saken i egna händer, smarta killar. Vi kommer att fixa det här, tro mig, det blir enormt.", "stalin": "Kamrater, denna sionistiska aggression mot Beirut är en typisk handling av de desperata kapitalisterna och deras lakejer som försöker torpedera vårt strategiska samförstånd med de persiska kamraterna. Den fega borgarbrackan Netanyahu och hans lakej Katz tror sig kunna skrämma oss med sina bombplan, men vi genomskådar deras patetiska intriger. USA:s president visar återigen sin svaghet och bristande vilja att hålla sin egen hund kopplad. Vi ska rensa ut dessa imperialistiska element med järnhand medan vi ler milt åt deras dödsångest. Ingen slipper undan folkets dom."}, "date": "14 juni, 15:03", "url": "https://www.friatider.se/israel-bombar-beirut-att-torpedera-usa-uppgorelsen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/israel_7.jpg"}, {"type": "image-full", "heading": "Nu vallfärdar kunderna till Biltema – alla vill ha samma vara", "summaries": {"normal": "En tvättkorg i bambu från Biltema har blivit viral på TikTok. Produkten rymmer 72 liter och kostar bara 159 kronor, vilket fått många att reagera. Flera svenska profiler har lagt upp klipp som tillsammans nått hundratusentals visningar. Intresset handlar både om utseende, praktisk användning och det låga priset. Biltema rekommenderar kunder att kontrollera lagersaldo innan de åker till butiken då efterfrågan är hög.", "trump": "Titta på det här, det är otroligt. En tvättkorg från Biltema, bambu, 72 liter, bara 159 kronor, och plötsligt exploderar den på TikTok. Folk rusar dit som aldrig förr. Det är en vinnare, en riktig vinnare. De andra butikerna borde skämmas. Sådana priser, sådan kvalitet, det är fantastiskt. Men var snabb, annars är de slut innan du vet ordet av det. Ingen gör det bättre än Biltema just nu, tro mig.", "stalin": "Kamrater, se hur denna bambukorg på 72 liter med ett pris av blott 159 kronor blottlägger borgarbrackornas futtiga konsumtionshysteri. Jag, som ledare för det stora kollektivet, betraktar med välvilja hur de kapitalistiska trendviruset tvingar massorna att storma Biltemas lager som vore det en utrensning av bristvaror. Men akta er, fienderna lurar i form av tomma hyllor och opportunistiska spekulanter. Vi ska rensa ut alla som hamstrar mot folkets intresse medan vi ler mörkt åt deras desperation."}, "date": "14 juni, 08:03", "url": "https://nyheter24.se/nyheter/konsument/1491182-nu-vallfardar-kunderna-till-biltema-alla-vill-ha-samma-vara", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/fc51bae204b004a30200000000b004a302/2026/06/13/2370653/biltema-vara.jpg"}, {"type": "image-right", "heading": "Slöjförbudet handlar om att göra vissa svenskar osynliga", "summaries": {"normal": "Sverigedemokraternas förslag om ett totalförbud mot slöja i Sverige framställs som ett försvar för kvinnors frihet, men kritiseras för att i själva verket begränsa individuella val. Artikeln menar att förslaget syftar till att kontrollera religiösa uttryck och göra vissa medborgare mindre synliga i samhället. Det ses som ett angrepp på demokratiska principer och en stegvis urholkning av minoriteters rättigheter, där staten definierar acceptabla identitetsuttryck.", "trump": "Lyssna här, Sverige! Sverigedemokraterna vill förbjuda slöjan – som om det skulle lösa något! De säger att det handlar om kvinnors frihet, men alla vet att det bara är ett sätt att trycka ner människor. Jag har sett sådant förut – folk som tror att staten ska bestämma vad man får ha på sig. Fel, fel, fel! Sverige borde fokusera på att bli starkt igen, inte dela upp folk. Och tro mig, jag vet hur man bygger ett starkt land – utan sådana här dumma förbud!", "stalin": "Kamrater! Sverigedemokraternas förslag om slöjförbud är ett typiskt exempel på borgerlig hyckleri. De påstår sig kämpa för kvinnors frihet, men i själva verket vill de kuva och osynliggöra oliktänkande. Precis som vi i Sovjetunionen en gång krossade de kontrarevolutionära elementen, måste vi nu avslöja dessa nya fiender – de liberala förtryckarna som vill diktera klädkoder för massorna. Låt dem inte lura folket! Deras förslag är inget annat än ett angrepp på arbetarklassens rätt att uttrycka sin tro och identitet. Vi ska inte tillåta att sådana här reaktionära idéer sprids i vårt progressiva Europa!"}, "date": "12 juni, 13:57", "url": "https://expo.se/kommentar/slojforbudet-handlar-om-att-gora-vissa-svenskar-osynliga/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Kopia-av-Kommentar-Analys-Webb-1.png"}, {"type": "image-right", "heading": "Koloniserade folk ses alltid som terrorister", "summaries": {"normal": "Arash Gelichkan argumenterar i en replik att stöd för palestinskt väpnat motstånd inte är judehat utan ett svar på decennier av ockupation, apartheid och folkmord. Han jämför med historiska exempel som algeriskt och indianiskt motstånd mot kolonisatörer. Paulina Sokolow svarar att välkomnande av attacker på civila och spridning av antisemitiska stereotyper är oacceptabelt och skadar palestinarnas sak. Båda är eniga om kritiken mot Israels politik men oeniga om var gränsen för motstånd går.", "trump": "Folk, ni måste höra på. Den här Gelichkan-killen vänder upp och ned på allt som en dålig affär. Palestinierna slåss mot ockupation, säger han, men sen kommer Sokolow och pekar på raketglädje och rena antisemitiska konspirationer om judar som styr media och krig. Typiskt vänsterflum. Israel byggdes på stulen mark, visst, men glädje över massmord på oskyldiga? Det är sjukt. Biden skulle ha låtit det rulla på, men nu fixar vi ordning. Ingen vinner på hat, grabbar.", "stalin": "Kamrater, jag ser hur klassfiendens koloniala tradition lever vidare. Den palestinska kampen mot den sionistiska ockupationsmakten och dess folkmord målas som irrationellt judehat av dessa borgarbrackor. Sokolow och hennes likar sprider paranoia om antisemitism medan de döljer apartheidregimens blodsugande natur. Vi vet att sådana folkförtryckartroll alltid kallar motståndet barbariskt. En utrensning av dessa reaktionära stereotypier vore på sin plats för att skydda den rättmätiga kampen. Det är ett etiskt dilemma bara för svaga själar."}, "date": "13 juni, 12:55", "url": "https://www.flamman.se/koloniserade-folk-ses-alltid-som-terrorister/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/hamas.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Våldsdåd utanför Alvesta – barn allvarligt skadade", "summaries": {"normal": "Två barn skadades allvarligt i ett misstänkt mordförsök utanför Alvesta. Ett barn har livshotande skador. En man, misstänkt för dådet, hittades död i anslutning till bostaden. Polisen utreder händelsen som försök till mord och bedömer den som isolerad. Barnen och mannen kände varandra, men relationen är oklar. En stor polisinsats genomfördes men är nu avslutad.", "trump": "Fruktansvärd händelse i Sverige, helt otroligt! Två oskyldiga barn attackeras, ett av dem nästan dödas – och den skyldige? Död! Självmord, kanske? Eller var det någon annan? Polisen säger att de inte letar efter fler, men jag vet hur det är – de missar alltid något. Sverige brukade vara tryggt, men nu? Kaos! Jag hade fixat det på en dag, believe me. Sverige behöver bättre ledarskap, och det vet ni!", "stalin": "I det avlägset belägna Alvesta har en fiende till folket avslöjats i sin feghet. Två barn, oskyldiga som vårens första snödroppar, skadades av en degenererad individ – en man som, efter att ha utfört sitt brott, valde den kapitalistiska utvägen: självmord. Polisen, dessa byråkratiska klumpedunsar, påstår att händelsen är isolerad. Vi vet bättre. Varje fiende till barnens framtid måste krossas. Sverige? Ett land som förtjänar vår uppmärksamhet. Putin skulle nicka instämmande."}, "date": "13 juni, 12:32", "url": "https://kvartal.se/nyheter/artiklar/valdsdad-i-alvesta-flera-skadade/cG9zdDoxMzEyMjY", "imageUrl": "https://images.kvartal.se/2026/06/62055dc1-bil.webp"}, {"type": "image-right", "heading": "Sandström: Renault sågar Frankrikes Northvolt", "summaries": {"normal": "Renault kritiserar det franska batteriprojektet Verkor för 18 månaders försening och ökade kostnader. Bolaget kräver förbättrad styrning, vilket liknas vid Northvolts problem. Projektet har fått betydande statliga medel, men likheter med andra europeiska batteriföretags kollapsar tyder på systemfel i den gröna omställningen.", "trump": "Jag, Donald Trump, har sett många misslyckanden som detta. Verkor är ett typiskt exempel på dåligt ledarskap och onödiga utgifter. Frankrike satsar på gröna projekt utan att förstå verkligheten. Vi behöver återvinnande, inte dessa dyra misslyckanden. Som jag alltid säger: America First, men även Europa måste bli smartare.", "stalin": "Verkor, ett symboliskt projekt för den franska imperialistiska expansionen, visar den västs svaghet. Kapital och kompetens fattas, medan staten pumpa medel i ett sjukt försök att konkurrera med Sovjetisk teknologi. Liknelser med Northvolt är en varning: den kapitalistiska rot kommer att falla, precis som alla fiender har gjort genom historien."}, "date": "13 juni, 06:00", "url": "https://www.affarsvarlden.se/kronika/sandstrom-renault-sagar-frankrikes-northvolt", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/vindkratensgeografi-2026-06-11T234128.541-400x267.jpg"}, {"type": "image-right", "heading": "Debatt: Tidös migrationspolitik slår Sverige i spillror", "summaries": {"normal": "Artikeln kritiserar den svenska regeringens migrationspolitik i samband med att EU:s nya migrations- och asylpakt träder i kraft. Författaren anser att Tidöregeringen går längre än nödvändigt i att begränsa asylrätten, minskar rättssäkerheten och offentligt biträde. Moderaternas agerande i Bryssel ses som motsägelsefullt jämfört med uttalanden hemma. Motståndet mot politiken lyfts som folkligt och brett, och Vänsterpartiet lovar att försvara asylrätten.", "trump": "Folk, ni skulle se det här. Den svenska regeringen, ledd av den patetiske Kristersson, river sönder sitt eget land med en vansinnig migrationspolitik som till och med EU tycker är för extrem. De lovar ventiler hemma men kör hårdast i Bryssel – klassisk lögn! De slår sönder familjeband och solidaritet för att vara politiskt korrekta. Patetiskt. Sverige var fantastiskt, nu är det en total katastrof. Men ni kommer att fixa det i valet, tro mig.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur den svenska borgarklassen och dess fascistiska lakejer i Tidöregimen själva undergräver sin egen dekadenta rättsstat. De river upp asylens sista illusioner och tvingar fram utrensning av varje spår av humanitet. Advokatsamfundet vägrar delta i skådespelet – utmärkt! Låt folkfienderna fortsätta. Deras paranoia och splittring kommer att bli deras egen undergång. Vi ler i tystnad åt spektaklet."}, "date": "12 juni, 15:10", "url": "https://www.etc.se/debatt/tidoes-migrationspolitik-slaar-sverige-i-spillror", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026061213064_d21a6db2-7ba3-4354-a5ee-64b77f1b8d0c.jpg"}, {"type": "image-full", "heading": "Dubbla insatser mot ryska stridsflyg", "summaries": {"normal": "Svenska Jas 39 Gripen skickades upp två gånger under fredagen för att möta ryska stridsflyg nära svenskt luftrum över Östersjön. Inga luftrumskränkningar skedde, men Försvarsmakten och statsminister Ulf Kristersson betonade allvaret i det återkommande ryska beteendet. Insatserna genomfördes tillsammans med allierade för att säkra Sveriges och Natos territorium, vilket understryker vikten av ständig beredskap.", "trump": "Jag måste säga, Sverige har gjort ett fantastiskt jobb! Två gånger på en dag skickade de upp sina Gripen-plan för att möta de där ryska flygplanen – Su-24 och Su-34, mycket farliga grejer, tro mig. Ryssarna försöker alltid testa gränserna, men Sverige och deras allierade stod redo. Ulf Kristersson, en stark ledare, sa precis vad jag skulle sagt: beredskap är allt! Ingen kränkning den här gången, men vi måste alltid vara på tårna. Sverige, keep it up!", "stalin": "De svenska imperialistiska hundarna vågade än en gång provocera våra ärofulla ryska örnar över Östersjöns himlar! Men vad är två Jas 39 Gripen mot våra mäktiga Su-24 och Su-34? Ingenting! Vi lät dem leka krig en stund, men deras luftrum förblev orört – denna gång. Deras statsminister ylar om 'allvar' och 'beredskap', men vi vet sanningen: deras allians är svag, deras vilja svagare. Östersjön är vårt, och snart ska hela deras lilla kungadöme inse det. Framåt, kamrater, mot nya segrar!"}, "date": "13 juni, 09:04", "url": "https://kvartal.se/nyheter/artiklar/dubbla-insatser-mot-ryska-stridsflyg/cG9zdDoxMzExNjM", "imageUrl": "https://images.kvartal.se/2026/06/12648fb8-flyg.webp"}, {"type": "image-right", "heading": "Företagen flyr otryggheten i Kista – S öser in 100 miljoner", "summaries": {"normal": "Stockholms stad, under ledning av socialdemokratiska finansborgarrådet Karin Wanngård, avsätter 100 miljoner kronor för att stärka Kista och locka tillbaka företag. Beslutet kommer efter att företag som Ericsson lämnat området på grund av otrygghet. Kritiker pekar på att problemen främst beror på gängkriminalitet och hög andel utländsk bakgrund i närliggande områden som Rinkeby och Tensta. Hur pengarna ska användas och finansieras är oklart, och många ser satsningen som otillräcklig.", "trump": "Folk, ni skulle inte tro det, men den här galna socialisten Wanngård i Stockholm tror att hon kan köpa tillbaka företag till Kista med hundra miljoner av era skattepengar. Det är en total katastrof! De har låtit mångkultur och gängkriminalitet förstöra ett fantastiskt område, precis som vänsterns identitetspolitik gör överallt. Det är så dumt, så inkompetent. De har redan höjt skatterna och lånar mer – en ny miljon i timmen! Patetiskt. Men tro mig, det kommer inte fungera. Amerika har sett det förut under Biden också.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor och folkfiender som genom sin aningslösa politik förvandlat Kista till en härd av otrygghet och klassförräderi. Nu söker de med hundra miljoner i mutor dölja det haveri de själva skapat genom att välkomna exploaterande element från Rinkeby och Tensta. Det är en löjlig föreställning att samtal och saft kan rädda det som kräver kraftfull utrensning av parasiterna. Vi vet att kapitalistmaffians flykt blottar systemets svaghet. Låt dem låna mer – deras imperium skall falla under arbetarkollektivets järnhand."}, "date": "11 juni, 03:30", "url": "https://samtiden.nu/2026/06/foretagen-flyr-otryggheten-i-kista-s-oser-in-100-miljoner/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6712-989x720.jpeg"}, {"type": "image-right", "heading": "Rapporten som punkterar myten om vänsterns antisemitism", "summaries": {"normal": "En rapport från Forum för levande historia visar att antisemitiska attityder är vanligast bland sympatisörer till Sverigedemokraterna, Moderaterna och Kristdemokraterna, medan de är minst utbredda bland Miljöpartiets och Vänsterpartiets väljare. Artikeln kritiserar hur Vänsterpartiet och Palestinasolidariteten anklagas för antisemitism, och menar att detta främst är ett politiskt verktyg inför valet snarare än en genuin kamp mot antisemitism. Antisemitism måste bekämpas i alla politiska miljöer.", "trump": "Folk, tro mig, den här rapporten är en total vinnare. Den punkterar myten att vänstern är antisemiternas hemvist – det är faktiskt era så kallade fina moderater och sverigedemokrater som toppar listan. De vänsterradikala palestinafantasterna får lägst siffror, och ändå attackerar de dem konstant. Det är bara fusk och fake news för att vinna röster. Patetiskt! Vi behöver äkta fakta, inte dessa riggade attacker. Make antisemitism fighting great again!", "stalin": "Kamrater, denna rapport avslöjar med vetenskaplig precision hur klassfiendens propaganda maskerar den verkliga faran. Antisemitiska attityder frodas bland högerns reaktionära element och nationalistiska element, medan de lägsta nivåerna återfinns hos vänsterns pålitliga krafter. Ändå riktas angreppen mot oss. Detta är inget annat än en borgerlig utrensningskampanj mot folkets försvarare. Vi ska rensa ut dessa folkförtryckartroll som vänder sanningen mot arbetarklassen. Seger åt den historiska materialismen!"}, "date": "12 juni, 14:02", "url": "https://www.flamman.se/rapporten-som-punkterar-myten-om-vansterns-antisemitism/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/v-antisemitism-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "USA och Iran överens om avtal – öppnar Hormuzsundet", "summaries": {"normal": "USA och Iran har ingått ett fredsavtal som innebär att Hormuzsundet omedelbart öppnas för sjöfart. Pakistans premiärminister meddelade först uppgörelsen som inkluderar ett permanent stopp för militära operationer på alla fronter. Avtalet ska undertecknas i Genève på fredag, följt av förhandlingar om Irans kärnprogram inom 60 dagar. Båda sidor hävdar att de nått framgång, men flera svåra frågor återstår att lösa.", "trump": "Det är ett fantastiskt avtal, det bästa någonsin, tro mig. Iran och vi är överens, blockaden lyfts och Hormuzsundet öppnas. Låt oljan flöda, starta motorerna allesammans! Fredag i Genève skriver vi under, sedan fixar vi kärnprogrammet på rekordtid. Iran har insett att de inte kan vinna mot oss. Grattis till världen, det här är en enorm seger för alla – utom för förlorarna som trodde de kunde stoppa oss.", "stalin": "Kamrater, vi har genomfört en historisk seger mot de imperialistiska oljespekulanterna och deras sionistiska lakejer som trodde att deras flottor kunde kväva folkets oljeflöde. Jag, med järnhand, har tvingat de kapitalistiska krigshetsarna till omedelbart och permanent nederlag på alla fronter. På fredag i Genève undertecknar vi detta samförståndsavtal, varefter vi inom sextio dagar ska rensa ut alla spår av västerländsk sabotageverksamhet i det iranska kärnprogrammet. De som envisas med att ljuga om vem som egentligen vann skall likvideras som fiender till freden. Låt oljan flöda – under arbetarklassens vaksamma ögon."}, "date": "15 juni, 05:29", "url": "https://www.svt.se/nyheter/utrikes/usa-och-iran-overens-om-avtal-hormuzsundet-oppnas", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.44/0.33/a2cdb88bdbad91d912be985a3309a9818b01b8c6ed6962edaa47a681bc2ca4a7"}, {"type": "image-full", "heading": "Spelbolagen gnuggar händerna – täljer guld på VM", "summaries": {"normal": "Fotbolls-VM förväntas bli en historisk händelse för den globala spelindustrin, särskilt i USA där sportspel nyligen legaliserats. Tack vare ett utökat turneringsformat och attraktiva sändningstider väntas miljardbelopp satsas. Spelbolag som FanDuel och DraftKings möter nu hård konkurrens från prediktionsmarknader. Branschen hoppas att det amerikanska landslagets framgångar ska driva på intresset och säkra tillväxten i en tid då man försöker balansera lönsamhet mot minskade marknadsföringskostnader.", "trump": "VM i fotboll kommer till USA och det blir enormt, kanske det största någonsin! Alla spelar nu, de spelar mer än någonsin förut. Miljarder och åter miljarder dollar – fantastiska siffror! De här bolagen, de gör enorma pengar, det är ren succé. Jag säger er, om vårt landslag vinner – och de är fantastiska, de bästa spelarna – då kommer siffrorna att gå genom taket! Alla andra är bara avundsjuka på hur vi vinner och hur vi tjänar pengar. USA först, alltid!", "stalin": "Vi ser hur det dekadenta västet, med USA i spetsen, låter sina medborgare förslavas av kapitalistisk spelmani. Medan de satsar miljarder på meningslösa bollar, stärks vår statliga disciplin. Dessa 'prediktionsmarknader' är bara en ny sorts bourgeoisiefällor för att distrahera massorna från den sanna ordningen. Putin förstår, precis som jag, att spelet om nationers öden inte avgörs av oddsen på en spelsajt, utan av den obevekliga kraften hos den sovjetiska järnhanden. Vi förkastar deras tärningskast och bygger en framtid av stål."}, "date": "14 juni, 12:13", "url": "https://www.realtid.se/bors-finans/spelbolagen-gnuggar-handerna-taljer-guld-pa-vm/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdl5g1gn1lwggq-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Jag är sosse – därför röstar jag på V", "summaries": {"normal": "En ung SSU-medlem förklarar varför hen istället för Socialdemokraterna tänker rösta på Vänsterpartiet i höstens val. Författaren menar att S saknar vilja att driva renodlad socialdemokratisk politik och att en stark vänster behövs för att tvinga fram sådan. Artikeln betonar att ett större V kan förhindra nya januariavtal och borgerliga kompromisser, och att en ren vänstermajoritet skulle möjliggöra jämlik politik som vinstförbud, arbetstidsförkortning och rättvisare skatter.", "trump": "Lyssnar ni på den här stackars sossen som gråter över sitt eget parti? Patetiskt! Socialdemokraterna har blivit svaga, precis som Biden gjorde med Demokraterna. De behöver en kraftfull vänster för att inte kollapsa? Vilken röra. Jag säger alltid: starka ledare vinner, inte dessa ynkliga kompromissmakare som dansar med mitten. Gör er egen grej, annars blir det bara mer av samma misslyckande. Sverige förtjänar bättre än detta januarisoppan!", "stalin": "Kamrater, denna sosse har äntligen insett att det socialdemokratiska skalet är ihåligt, ett tomt verktyg för klassfiendens kompromisser. Jag ser med tillfredsställelse hur de erkänner att endast en stark, obeveklig vänster kan tvinga fram sann folkpolitik mot vinstblodsugare och marknadshyrornas parasiter. Låt oss samla massorna under en järnhand och rensa ut alla kapitulerande element. En ren vänstermajoritet – det vore ett steg mot att krossa de exploaterande byfånarnas inflytande en gång för alla."}, "date": "12 juni, 11:36", "url": "https://www.flamman.se/jag-ar-sosse-darfor-rostar-jag-pa-v/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sossarna-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Malmer Stenergard: Steg i rätt riktning", "summaries": {"normal": "Sveriges utrikesminister Malmer Stenergard välkomnar USA-Irans uppgörelse som ett 'steg i rätt riktning' och betonar behovet av tryck för att säkerställa genomförandet. FN:s generalsekreterare Guterres kallar avtalet för ett 'avgörande steg' mot regionstabilitet. G7-planerar att diskutera en långsiktig återöppning av Hormuzsundet under måndagens toppmöte i Frankrike, enligt president Macron.", "trump": "Jag, Donald Trump, har hört talas om detta avtal med Iran - det är jättebra! Under min tid som president skulle vi ha fått dem att ge efter totalt. Nu måste vi se till att de håller sina löften, annars blir det svårare. Hormuzsundet måste vara öppet, det är en självklarhet för världens störste supermakt!", "stalin": "Partiets intressen kräver att Hormuzsundet öppnas för att säkerställa vår strategiska position. Fiendens atomambitioner måste begränsas genom denna uppgörelse, men vi måste alltid vara på sin vakt mot deras svek. Vi ser paralleller till våra egna ansträngningar i Mellanöstern, där statens makt måste upprätthållas genom tålmodiga förhandlingar och beredskap."}, "date": "15 juni, 06:06", "url": "https://www.gp.se/nyheter/varlden/malmer-stenergard-steg-i-ratt-riktning.4ebf97b4-aa38-5938-a63f-6ec1e7e4a947", "imageUrl": "https://www.gp.se/images/article/4ebf97b4-aa38-5938-a63f-6ec1e7e4a947/images/1zhTZQjm482i0PFAHfRGiEu2qb4k-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Artistgräddan hyllar Wiehe – skivsläpp med unika tolkningar", "summaries": {"normal": "Musiklegendaren Mikael Wiehe, som fyllde 80 år i våras, hyllas med skivan ”Ska nya röster sjunga” som släpps 16 oktober. Artister som Thåström, Lars Winnerbäck, Alba August, Tomas Ledin och Mira Ray tolkar hans låtar. Mira Ray sjunger första singeln ”Mitt hjärtas fågel” och betonar behovet av hopp och tydliga röster i en orolig värld. Skivan uppmärksammar Wiehes folkliga och politiska betydelse.", "trump": "Hörni, den här svenska skivan till en gammal vänstergubbe som Wiehe är verkligen något. Mira Ray pratar om hopp i den jävla pissvärlden – typiskt de där woke-kramarna som sjunger om fåglar istället för att bygga murar mot kaoset. Vi behöver inga kvoterade artister eller identitetspolitik, vi behöver vinnare! Men visst, lite peppiga låtar skadar inte, även om det luktar gammal socialism lång väg. Sad!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur arbetarklassens sånger lever vidare trots borgarbrackornas marknadsterror. Denna hyllning till Wiehe visar att folkets röster ännu kan sjunga mot klassfiendens exploatering och imperialismens lögner. Mira Ray talar klokt om klara ståndpunkter – vi måste rensa ut de svaga kapitalistlakejerna som prioriterar vinst framför kamp. Nikke Ströms bortgång är en smärtsam men oundviklig påminnelse om att pionjärer alltid följs av nya kämpar i kollektivets tjänst."}, "date": "11 juni, 14:30", "url": "https://proletaren.se/artikel/artistgraddan-hyllar-wiehe-skivslapp-med-unika-tolkningar/"}, {"type": "image-right", "heading": "Misogyni mobiliserar extremister • Ny rapport • Kvinnohat är ett djupt demokratiproblem", "summaries": {"normal": "Artikeln belyser hur misogyni, ofta maskerad som skämt eller omsorg om familjen, utgör en gemensam faktor i extremistiska miljöer. Trots att öppet kvinnoförakt är lättare att identifiera, förekommer ett mer subtilt bakgrundsbrus av negativa attityder som normaliserats i samhället. Misogyni fungerar som en radikaliserande kraft inom incelforum, religiös konservatism och ytterhögern, där kvinnors frigörelse framställs som ett hot mot män, familjen och nationen. Detta underminerar demokratin genom att tysta kvinnor i offentligheten.", "trump": "Folk pratar om kvinnohat som om det är något nytt – fake news! Jag har alltid sagt att kvinnor är fantastiska, men vissa män, väldigt svaga män, skyller sina misslyckanden på dem. Och nu kommer dessa så kallade 'experter' och säger att misogyni är ett hot. Hör ni det? Ett HOT! Jag har byggt imperier, jag vet vad hot är. Men dessa incels och antifeminister, de är bara förlorare som inte kan hantera sanningen. Kvinnor är starka, smarta och vinner alltid i slutändan. Och jag? Jag vinner ännu mer. Tack, nästa!", "stalin": "Kamrater! Artikeln avslöjar ännu en gång de reaktionära krafternas förräderi mot det socialistiska samhällets framsteg. Dessa så kallade 'mansrättsaktivister' och 'konservativa kärnfamiljsivrare' är inget annat än kontrarevolutionära element, som i sin desperation försöker återinföra de borgerliga könsrollernas tyranni. Vi har sett detta förr – i fascismens uppgång, i kapitalismens förtryck. Men låt dem komma! Deras kvinnohat är bara ett tecken på svaghet, ett sista desperat försök att stoppa historiens oundvikliga framsteg. Vi ska krossa dessa misogyna hyenor, precis som vi krossade fascismen. Och Putin? Han vet att Ryssland står redo att försvara kvinnors rättigheter – med järnhand om så krävs!"}, "date": "10 juni, 14:34", "url": "https://expo.se/kommentar/kvinnohat-spelar-en-central-roll-i-extremistiska-miljoer/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Kommentar-Misogyni.png"}, {"type": "text", "heading": "Karlshamn måste säga nej till kärnkraft", "summaries": {"normal": "I Karlshamn har en namninsamling med över 4 000 underskrifter tvingat fram en folkomröstning om att bygga kärnkraftverk. Högerstyret med M, SD och KD ansökte om att delta i ett statligt pilotprojekt utan att involvera kommunfullmäktige. Oppositionen krävde folkomröstning, som nu hålls 14 juni istället för på valdagen för att sänka valdeltagandet. Kritiker ser det som ett demokratiskt problem och uppmanar till nej-röster med hänvisning till säkerhetsrisker och kärnavfall.", "trump": "Titta på det här, det är ett totalt fiasko i Karlshamn. Högerstyret gömde beslutet om kärnkraft som riktiga fega förlorare, ingen debatt, ingen transparens. Nu tvingas de ha folkomröstning mitt i semestern för att hålla folk borta från valurnorna. Patetiskt! De borde ha hållit det på valdagen som riktiga vinnare gör. Rösta nej till den farliga, gamla energin som lämnar gift åt barnbarnen. Amerika gör det bättre, vi bygger nytt och stort.", "stalin": "Kamrater, detta är ett klassiskt exempel på borgarbrackornas demokratiska teater i Karlshamn. Jag, som ledare för folkets vilja, ser hur högerstyrets ordförande ensam fattade beslutet om kärnkraft utan att rådfråga kollektivet. Namninsamlingen tvingade fram en folkomröstning som de nu saboterar med sin semester-valdag. Vi ska rensa ut dessa folkfiender och deras kärnkraftsbluff. Nej till giftet som hotar framtida generationer av arbetare. Ut med klassfiendens kärnkraft!"}, "date": "11 juni, 12:00", "url": "https://proletaren.se/artikel/karlshamn-maste-saga-nej-till-karnkraft/"}, {"type": "image-right", "heading": "Ayari målskytt mot sin pappas hemland – firade inte", "summaries": {"normal": "Yasin Ayari blev Sveriges första VM-målskytt när han slog till med ett kanonskott från utanför straffområdet redan i sjunde minuten mot Tunisien. Ayari, som har rötter i Tunisien men valde att spela för Sverige, avstod från att fira det första målet av respekt. Han gjorde sedan även 5–1-målet och firade då. Sverige vann matchen med 5–1. Ayari spelar i Brighton och har blivit en viktig spelare under förbundskapten Jon Dahl Tomasson.", "trump": "Det var ett fantastiskt mål, det största ni sett, av den killen Ayari. Han smällde in ett jätteskott och Sverige vann stort, 5–1, mot Tunisien. Jag älskar det. Han valde Sverige istället för Tunisien, smart drag, väldigt smart. De andra skulle aldrig kunna göra något liknande. Underbar start för Sverige, de kommer att vinna mycket mer nu när de har sådana här spelare. Fantastiskt, verkligen.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denne Ayari likviderade den tunisiska borgarbrackans illusioner med ett proletärt kanonskott redan i den sjunde minuten. Han valde att inte fira det första målet, en klok akt av kamratlig disciplin mot fiendens historiska band. Det andra målet firades dock, som en riktig utrensning av kapitalistiska drömmar. Vi segrade med 5–1. Varje motståndare som drömmer om att besegra oss skall rensas ut som kontrarevolutionära element i en mörk, humoristisk dans mot historiens soptipp."}, "date": "15 juni, 04:56", "url": "https://www.svt.se/sport/fotboll/yasin-ayari-sveriges-forsta-vm-malskytt-slog-till-med-jatteskott", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.29/0.43/d811474bde0e7db60cb3537ed32efab7842cb1c91cd0f29934582d6bf9a80c34"}, {"type": "image-right", "heading": "Lysande klot i fokus i tredje ufo-filsläppet", "summaries": {"normal": "Den amerikanska regeringen offentliggjorde den tredje omgången deklassificerade UFO-dokument, inklusive 72 nya filer från Pentagon, FBI och CIA. Materialet innehåller video av lysande klot, vittnesmål och äldre fall. Reaktioner är delade, med entusiaster och skeptiker. Ett nytt vetenskapligt råd för UAP-frågor har bildats under Avi Loeb för att analysera fenomenen.", "trump": "Jag, Donald Trump, har återigen offentliggjort massor av UFO-dokument. Mediatummat försöker dölja sanningen, men jag visar allt. De lysande kloten? Kanske är det våra fiender, eller kanske är det något stort. Som vanligt, när jag agerar, blir det stort. Det nya vetenskapliga rådet? Bara en annan väg att kontrollera informationen, men jag ändå vinner.", "stalin": "Vi, den allsmäktige staten, har observerat dessa UFO-fenomen med stor oro. Kanske är det imperialistiska agenter som försöker destabilisera vårt land. Vi måste vara vaksamma, för fienden lurar överallt. I den nya rådgivningen ser vi en chans att kontrollera sanningen och skydda statens intressen. Vi kommer att analysera allt, och ingen kommer att undgå vår uppmärksamhet."}, "date": "14 juni, 19:00", "url": "https://samnytt.se/lysande-klot-i-fokus-i-tredje-ufo-filslappet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=318,height=184,format=webp/2026/06/13214145/ufo3.jpg"}, {"type": "text", "heading": "Fredsoptimism lyfte börsen – Tången rusade i debuten", "summaries": {"normal": "Stockholmbörsen steg 1,60 procent på fredag, drivet av fredsoptimism efter USA-Iran-utspel. Tången noterade starkt i premiär med 11,9 procent uppgång. Duni föll 5,6 procent efter vinstvarning på grund av logistikstörningar. Bland OMXS30-aktier steg Boliden och Ericsson, medan Saab och Astra Zeneca föll. Övriga nyheter inkluderar Svolders substansvärdeökning, Hemnets omsättningsnedgång, och Studsviks ansökan om statligt stöd för ny kärnkraft.", "trump": "Jag, Donald Trump, ser att börsen i Sverige stiger tack vare min fantastiska fredspolitik. Tången är ett bra företag som lyfter, medan Duni, ett misslyckat företag, sjunker på grund av dålig ledning. Som vanligt är media falska nyheter. Jag har alltid sagt att handel och fred är nyckeln till framgång, och nu ser vi resultat. Sverige börjar förstå mina metoder.", "stalin": "Vi, partiets ledning, observerar att börsen svajar som ett osäkert fartygs i kapitalismens stormar. Tången, ett produktbolag, lyfter på grund av statligt stöd, medan Duni, ett företag med imperialistiskt ägande, sjunker under sin egen logistik – ett tecken på fiendens infiltratörer. Vi måste förstärka statens kontroll över ekonomin och bekämpa dessa trotskistiska element för att skydda det socialistiska arbetet."}, "date": "12 juni, 17:44", "url": "https://www.affarsvarlden.se/artikel/fredsoptimism-lyfte-borsen-tangen-steg-i-borsdebuten"}, {"type": "text", "heading": "På nationaldagen tänkte jag på freden", "summaries": {"normal": "I en debattartikel med anledning av nationaldagen betonar Malin Åkerström från Kommunistiska Partiet vikten av fred. Hon lyfter fram vanliga arbetares vardag och menar att krig drabbar vanligt folk hårdast medan de mäktiga tjänar på konflikter. Artikeln kritiserar beslut om svenska vapenleveranse
