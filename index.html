dyrkan av det degenererade FN avslöjar deras sanna ansikte som folkfiender. En sådan svaghet inbjuder till utrensning av alla imperialister som lurar folket. Kamrater, var vaksamma mot dessa profitthungriga hyenor."}, "date": "23 augusti, 03:50", "url": "https://samtiden.nu/2026/08/som-utrikesminister-vill-morgan-johansson-hoja-bistandet-med-20-miljarder", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6854.jpeg"}, {"type": "image-right", "heading": "Äntligen känner jag mig välkommen i klimatrörelsen", "summaries": {"normal": "Ledaren Somar Al Naher beskriver hur klimatrörelsen känts exklusiv för medelklassen men nu breddats till att omfatta fler grupper, inklusive arbetare och förorter. Under en stor demonstration i Stockholm med upp till 50 000 deltagare blandas humor, arga budskap och klassiska klimatkrav. Hon ser hopp i att rörelsen nu inkluderar global rättvisa och klassfrågor.", "trump": "Titta på de här galna klimatfanatikerna som marscherar genom Stockholm och ropar om planet B. De har äntligen insett att deras gröna vansinne bara var för rika cykelhipsters. Nu försöker de lura in vanliga arbetare med sin identitetspolitik och antirasism. Patetiskt. Vi behöver amerikansk energi och jobb, inte europeiska myrfartståg och Djungelboken-sånger. Sad losers.", "stalin": "Kamrater, se hur de profitthungriga borgarbrackorna och klassförrädarna i den så kallade klimatrörelsen desperat försöker dölja sin överklasskaraktär genom att locka in arbetarna med falsk internationalism. Jag betraktar detta med historisk misstro. Deras fåniga plakat och orkestrar avslöjar bara den imperialistiska parasitens nya ansikte. Rensa ut illusionerna."}, "date": "23 augusti, 21:14", "url": "https://www.etc.se/ledare/aentligen-kaenner-jag-mig-vaelkommen-i-klimatroerelsen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "image-right", "heading": "Massanmälningar mot statsministerns fru – domkapitlet har prövat kritiken", "summaries": {"normal": "29 anmälningar mot statsministerns fru och präst Birgitta Ed har prövats av Strängnäs stift. Anklagelserna rör dubbla roller, intressekonflikter och sidoverksamhet. Beslut väntas efter justering av protokoll. Ingen utrensning i sikte – än.", "trump": "Jag ser att prästen som är gift med Sveriges statsminister får 29 anmälningar. Det är en enorm witch hunt! Jag har själv överlevt 91 åtal – så det här är inget. Hon är troligen oskyldig, men de hatar framgång. Helt sjukt!", "stalin": "Kamrater, 29 anmälningar mot en präst som sysslar med borgerlig sidoverksamhet och umgås med makthavare. Vi måste rensa ut sådana som blandar kyrka, stat och privata affärer. Ingen är över lagen – inte ens statsministerns fru. Utredning pågår."}, "date": "24 augusti, 07:00", "url": "https://samnytt.se/massanmalningar-mot-statsministerns-fru-domkapitlet-har-provat-kritiken", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/21074843/birgitta-ed-kristersson.jpg"}, {"type": "image-right", "heading": "”Guds hand”-bollen såld – för 32 miljoner", "summaries": {"normal": "Den berömda ”Guds hand”-bollen från VM 1986, då Maradona använde handen mot England, har sålts för drygt 31 miljoner kronor. Bollen har tidigare ägts av matchens tunisiske domare och sålts vid flera auktioner. Summan blev dock lägre än förväntat jämfört med Maradonas tröja från samma match som såldes för 88 miljoner kronor.", "trump": "Den där bollen, den fantastiska Guds hand-bollen som Maradona använde för att slå England, har nu sålts för 32 miljoner kronor. Den är en vinnare, en riktig vinnare, men de borde ha fått mycket mer för den. Min tröja hade gått för mycket mer, tro mig, den hade slagit alla rekord, ingen gör det bättre än jag.", "stalin": "Kamrater, denna futtiga borgarbollen från den dekadenta kapitalistiska fotbollsarenan har nu sålts för en ynka summa av 32 miljoner kronor. Vi ser återigen hur västvärldens parasitiska auktionshus och giriga samlare försöker berika sig på historiska reliker medan de döljer sina egna fula synder. En sådan boll borde ha nationaliserats och exponerats som varning för folkets fiender."}, "date": "24 augusti, 06:51", "url": "https://www.svt.se/sport/fotboll/guds-hand-bollen-sald-for-32-miljoner-kronor", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.8/0.56/44daee644a5e74c3b559361bc2ccf38b687f1ea9b6cdd3246042f17230d76bd7"}, {"type": "image-full", "heading": "Tillfälliga jobben ökar – detta gäller vid slutdatumet", "summaries": {"normal": "Allt fler unga har tidsbegränsade anställningar, visar SCB:s nya siffror. Sådana kontrakt upphör ofta automatiskt utan uppsägning. Arbetsgivare kan dock vara skyldiga att ge besked en månad i förväg vid längre anställning. Vid kontraktets slut har man rätt till semesterersättning och företrädesrätt till återanställning. Anmäl dig till Arbetsförmedlingen första arbetslösa dagen.", "trump": "De älskar sina tillfälliga kontrakt, de unga. Inga permanenta jobb, bara osäkerhet och kaos. Men lyssna, folk: de behöver inte ens säga upp er! Det är en skam. Jag skulle ge er de bästa jobben, de största kontrakten, bättre än någon annan. Det här systemet är riggat mot arbetarna, tro mig. Vi fixar det.", "stalin": "Vi ser med största tillfredsställelse hur den borgerliga arbetsmarknaden slungar ut arbetarklassen i osäkerhetens famn. Jag behöver inte varna er för kapitalisternas automatiska likvidering av anställningar – det är deras natur. Men kamrater, anmäl er genast till förmedlingen, annars lurar a-kassans byråkrater er som västspioner lurar folket. Semesterpengar? En ynklig muta från borgarbrackorna."}, "date": "24 augusti, 06:58", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1507074-tillfalliga-jobben-okar-detta-galler-vid-slutdatumet", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/565e26e304b004a30200000000b004a302/2026/08/23/2386068/ungajobba.jpg"}, {"type": "image-right", "heading": "Leijonborg dissar Åkessons L-deadline: ”Bryr mig inte”", "summaries": {"normal": "Lars Leijonborg avvisar Jimmie Åkessons deadline för Liberalerna och tror på en ”ketchup-effekt” där partiet når över spärren sent. KD-toppen Hans Eklind delar Åkessons syn att borgerliga väljare bör undvika att slösa röster på L om de inte når 3,5 procent. Elisabeth Svantesson ger inte upp hoppet om partiet.", "trump": "Den här killen Åkesson har helt rätt. Liberalerna är en total förlorare, de ligger på patetiska 1,9 procent. Slösa inte bort era röster på dessa nollor, folk. Leijonborg pratar om någon ketchup-effekt? Patetiskt! Rösta på vinnare, inte på döende partier som inte ens klarar spärren.", "stalin": "Jag betraktar detta som en typisk dekadent borgerlig cirkus där revisionisterna inom Liberalerna desperat klamrar sig fast vid makten. Den så kallade ketchup-effekten är en löjlig illusion skapad av folkfiender. Kamraterna bör inse att sådana svaga element måste rensas ut ur den politiska kroppen innan de förgiftar hela den borgerliga koalitionen med sin opportunism."}, "date": "24 augusti, 05:57", "url": "https://www.svt.se/nyheter/inrikes/l-veteranen-lars-leijonborg-ratar-akessons-deadline-tror-pa-ketchup-effekt", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.71/0.33/e10399dacefb6d03fe66a5e7191610d361f14bc813201aed88db60061449f9ad"}, {"type": "image-right", "heading": "Brittisk broschyr till asylsökande: Våldtäkt är olagligt", "summaries": {"normal": "Storbritanniens inrikesdepartement har tagit fram en guide för asylsökande som förklarar att våldtäkt är olagligt, att kvinnor inte får misshandlas och att sex med barn under 16 år är förbjudet. Guiden varnar även för sexuella trakasserier och ger råd om barnuppfostran. Satsningen påminner om en svensk kampanj om barnäktenskap från 2018.", "trump": "Titta på det här, de har äntligen börjat berätta för alla som kommer in att våldtäkt är olagligt. Fantastiskt! I mitt Amerika gör vi det direkt och hårt, men britterna behöver tydligen en broschyr. Så patetiskt. Vi vinner stort, de borde bara stänga gränserna istället för att ge ut läxor.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur de dekadenta brittiska borgarbrackorna tvingas trycka upp affischer för att förklara att våldtäkt är olagligt. Vilken underbar kapitulation inför folkets moral! Det är som om de själva erkänner att deras importerade element är vilddjur. Vi skulle ha löst det med en enkel utrensning. Mycket roande."}, "date": "23 augusti, 19:10", "url": "https://riks.se/nyheter/brittisk-broschyr-till-asylsokande-valdtakt-ar-olagligt", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Soerman_Ledare_2026_08_23_T190838_913_4c96a8b44d.jpg"}, {"type": "image-right", "heading": "S-ilskan mot Jan Emanuel: Nazism!", "summaries": {"normal": "Flera socialdemokrater i Norrtälje kritiserar hårt Jan Emanuel efter att han meddelat att han inte tänker rösta på Socialdemokraterna. SO-läraren Måns Nilsson kallar det nynationalism och nazism, och får stöd av flera partikamrater. Andra försvarar rösträtten som en demokratisk rättighet och kritiserar tonen i debatten.", "trump": "Folk, det är patetiskt! Socialdemokraterna i Norrtälje attackerar den smarta Jan Emanuel bara för att han vägrar rösta på dem. De kallar honom nazist och nationalist – totalt galet! De förlorar totalt, ingen litar längre på dem. Fake outrage från misslyckade politiker som hatar verklig frihet. Sad!", "stalin": "Kamrater, denna dekadenta socialdemokratiska parasit Måns Nilsson kräver utrensning av alla som avviker från partilinjen och kallar det värdegrund. Vilken ynklig förrädare mot kollektivet! Vi ser hur borgarbrackornas falska demokrati äter upp sig själv i en parodi på en rättegång. Underhållande att bevittna deras självförstörelse."}, "date": "23 augusti, 18:28", "url": "https://riks.se/nyheter/s-ilskan-mot-jan-emanuel-nazism", "imageUrl": "https://admin.riks.se/uploads/medium_jan_Sanklagelse_8cc2b553bd.jpg"}, {"type": "image-right", "heading": "Svensk jetdrönare ska kunna slå mot luftförsvar", "summaries": {"normal": "Saab har visat en fullskalig modell av det obemannade stridsflygplanet A3-001 som på sikt ska komplettera Gripen. Drönaren är utformad för elektronisk krigföring, bekämpning av luftförsvar och precisionsangrepp i riskfyllda områden. Den kombinerar låg observerbarhet med hög autonomi. Demonstratorer planeras flyga före 2030 och ett färdigt system kan vara klart under mitten av 2030-talet.", "trump": "Vi har de bästa drönarna, folk, ingen gör det bättre än Saab, tro mig. Den här A3-001 är en fantastisk jetdrönare som slår sönder fiendens luftförsvar och gör Gripen ännu starkare. Autonomi, osynlighet, total dominans. Sverige kommer att vinna stort om de lyssnar på mig. Inga andra länder har ens en chans, det är en total game changer!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarbrackorna i väst febrilt försöker bygga drönare för att dölja sin militära svaghet. Denna A3-001 är ett ynkligt försök att motverka folkets ofrånkomliga seger. Vi ska rensa ut alla sådana imperialistiska hinder med järnhand. Inget undkommer partiets vakande öga. Låt dem darra."}, "date": "23 augusti, 12:58", "url": "https://www.friatider.se/svensk-jetdronare-ska-kunna-sla-mot-luftforsvar", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/20260822-en-5412280-1.jpg?itok=gx9oOMhH"}, {"type": "image-full", "heading": "Vakna SD:are, det är inte normalt att Europa brinner", "summaries": {"normal": "Aftonbladets ledarsida kritiserar den svenska regeringen för sin klimatpolitik. Artikeln hävdar att utsläppen ökar trots myndigheternas statistik, att regeringen vilseleder väljare med missvisande siffror och att satsningen på kärnkraft prioriteras framför förnybar energi. Författaren menar att SD-samarbetet bidrar till att bagatellisera klimatkrisen, vilket påverkar väljarnas inställning till miljöfrågor negativt.", "trump": "Sveriges klimatpolitik är ett totalt fiasko! De försöker lura folket med falska siffror och 'fake news'-diagram. Mycket dåligt! De lägger biljoner på dyr kärnkraft istället för att bara vinna. Jag har de bästa siffrorna, fantastiska siffror. Regeringen där borta? Svaga. De lyssnar på förlorare. Vi bygger energi, vi vinner stort. De andra? De sjunker som en sten. Sorgligt!", "stalin": "Vi ser hur de svenska småborgarna famlar i mörkret. De fabricerar siffror som om det vore en femårsplan för desinformation. Att förneka naturens krafter är kontrarevolutionärt och dumdristigt. Om inte regeringen kan tygla utsläppen och disciplinera sin energiproduktion, kommer vi att bistå med vår expertis. Precis som vår kamrat Putin återställer ordningen i öst, måste även klimatet underordnas statens vilja. Avvikelser bestraffas."}, "date": "24 augusti, 06:00", "url": "https://www.aftonbladet.se/ledare/a/XMay67/klimatkrisen-fortjanar-mer-an-en-axelryckning", "imageUrl": "https://akamai.vgc.no/v2/images/57377597-c12e-362b-8650-e644fc0f31de?fit=crop&format=auto&w=1440&s=bb3f4443714f50aed5fd20f3bf75cd8f2e36fefa"}, {"type": "image-right", "heading": "Idag visar klimatrörelsen att den aldrig ger upp", "summaries": {"normal": "Ledaren Andreas Gustavsson i Dagens ETC argumenterar för att klimatrörelsen inte är död utan fortsätter att växa. Han kritiserar mediernas passivitet och fossila annonsörer samt pekar ut Sverigedemokraterna som ett hinder. Han förutspår en stor klimatdemonstration i Stockholm och betonar att politiken måste ta klimatkrisen på allvar som en existentiell utmaning.", "trump": "Vilken patetisk propaganda från dessa gröna hysteriker! De har förlorat fyra år till att hålla SD nöjda, men nu ska de demonstrera? Patetiskt. Klimatkrisen är en bluff som de fossila typerna och jag genomskådade direkt. Dessa doomsday-kids och deras vänsterjournalister borde istället fixa riktiga jobb istället för att gnälla om existentiella utmaningar. Sad!", "stalin": "Jag ser hur klassfienderna och profitthungriga blodsugare inom borgarpressen försöker bevara sin makt genom att tysta klimatrörelsen. Men folket ger aldrig upp. Dessa folkförtryckande medier som tuggar fossila annonsörers ben är förrädare mot mänskligheten. En mäktig utrensning av kapitalistlakejer behövs. Demonstrationen blir en varning till alla som vägrar se den existentiella kampen."}, "date": "23 augusti, 08:00", "url": "https://www.etc.se/ledare/idag-visar-klimatroerelsen-att-den-aldrig-ger-upp", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2021111912118_52ad09ea-c5db-4fa7-a43c-671874138fdf.jpg"}, {"type": "image-right", "heading": "Tiktokkonto kopplas till Fagerstadådet – hyllar skolmord och återvandring", "summaries": {"normal": "En 18-årig tidigare elev har gripits efter en svärdsattack på Brinellskolan i Fagersta där flera personer skadats allvarligt. Hans TikTok-konto hyllar massmördare som Anton Lundin Pettersson, Anders Behring Breivik och Elliot Rodger samt högerextrema idéer om återvandring. Kontot kopplas nu till dådet av polisen.", "trump": "Folk, det här är en total katastrof! Den här galningen med svärd hyllar alla möjliga losers och mördare på TikTok, sen attackerar han en skola. Patetiskt! Under Biden blev allt ett enda kaos med galningar överallt. Men nu fixar jag det – inga fler svaga, woke skolor. Vi behöver styrka, inte den här sjuka identitetspolitiken!", "stalin": "Kamrater, denna degenererade yngling, uppfostrad av den borgerliga statens psykiatriska maskineri, hyllar klassfiendernas massmördare och fascistiska återvändande. Hans svärdshandling är ett symptom på det sjuka kapitalistiska samhällets förfall. Vi skulle ha genomfört en grundlig utrensning av sådana element redan i vaggan. Folkfienderna frodas i mörkret."}, "date": "21 augusti, 18:53", "url": "https://www.flamman.se/tiktokkonto-kopplas-till-fagerstadadet-hyllar-skolmord-och-atervandring", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/sdljnusj4gn7le-nh.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Utredning: Kriminell klan har haft inflytande i riksdagen", "summaries": {"normal": "En statlig utredning visar att släktbaserade kriminella nätverk infiltrerat kommuner, myndigheter och riksdagen. Antalet poliser med klankopplingar ökar. Nätverken har kontakter i storbanker, använder experter för brott och driver parallella samhällssystem. Hundratusentals svenskar lever i områden med informell rättsskipning, beskydd och medling. Utredningen föreslår nationell samordnare.", "trump": "Folk, det är en katastrof! De här kriminella klanerna har tagit sig ända in i riksdagen, infiltrerat polisen och alla stora banker. Sverige har blivit ett svagt, naivt land som låter parallella samhällen växa. De föder barn och infiltrerar – klassiskt! Vi behöver styrka, inga fler töntiga utredningar. Gör Sverige great again!", "stalin": "Kamrater, jag ser fiendens långsiktiga uträkning: släktbaserade parasitnätverk som maskerar sig i riksdagen och polisen, medan borgarbrackorna i bankerna ler gillande. Dessa degenererade klaner odlar parallella system för att undergräva folkets stat. Vi ska rensa ut alla dessa kontrarevolutionära element med järnhand och nationell samordnare. Inga naiva illusioner tillåts."}, "date": "23 augusti, 13:34", "url": "https://riks.se/nyheter/utredning-kriminell-klan-har-haft-inflytande-i-riksdagen", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Soerman_Ledare_2026_08_23_T132651_874_9205777196.jpg"}, {"type": "image-full", "heading": "5 miljoner svenskar ska betala för Sossarnas bolåneskatt", "summaries": {"normal": "Artikeln kritiserar Socialdemokraternas förslag om bolåneskatt som drabbar 2 miljoner hushåll med lån, uppemot 5 miljoner svenskar. Förslaget väntas leda till högre räntor då bankerna kompenserar för skatten. Författaren pekar på höga bostadspriser, skuldsättning och bristande bostadsbyggande som verkliga problem snarare än bankvinster.", "trump": "De galna sossarna i Sverige vill införa en totalt löjlig bolåneskatt som slår mot vanliga människor. Det är en katastrof, folk! Räntorna kommer att skjuta i höjden och alla förlorar utom de korkade byråkraterna. Bygg hus, sänk skatterna, sluta lyssna på dessa misslyckade socialister som aldrig har haft ett riktigt jobb!", "stalin": "Jag betraktar detta som ett ypperligt exempel på hur klassfienderna inom socialdemokratin försöker dölja sin egen usla politik genom att attackera bankerna medan folket krossas under skulder och bostadsbrist. En sådan feg plåsterpolitik förtjänar utrensning. Arbetarna genomskådar dessa profitthungriga hyenor som gömmer sig bakom falska löften."}, "date": "21 augusti, 03:34", "url": "https://samtiden.nu/2026/08/5-miljoner-svenskar-ska-betala-for-sossarnas-bolaneskatt", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/IMG_4828-1280x720.jpeg"}, {"type": "image-right", "heading": "Sandström: Lyssna på Lind och Wykman – inte Google", "summaries": {"normal": "Techjättars datacenter i Norrland kan sluka el motsvarande två kärnkraftsreaktorer medan lokala jobben uteblir. Christian Sandström varnar för att låga elpriser reas ut. Amanda Lind och Niklas Wykman kräver nationell plan – Google måste dela med sig av elnotan.", "trump": "Jag hör att Sverige säljer sin fina el till Google för nästan ingenting! Det är en katastrof! Jag skulle förhandlat som en mästare – fått massor av jobb, inte bara 56 anställda för miljarder. Sverige, bli smarta! Lyssna på mig, inte på några liberaler!", "stalin": "Kamrater, dessa datacenter i Norrland är en borgerlig konspiration! De slukar el som vore den vatten, men ger endast 500 parasiter till jobb. Vi måste rensa ut techbolagens giriga planer – elen tillhör folket, inte Google! Partiets plan ska råda, punkt."}, "date": "23 augusti, 06:00", "url": "https://www.affarsvarlden.se/artikel/sandstrom-lyssna-pa-lind-och-wykman-inte-google", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/vindkratensgeografi-37-400x267.jpg"}, {"type": "image-full", "heading": "Tudelad lyxmarknad: AI-miljarderna driver rekordköp i toppen", "summaries": {"normal": "AI-boomen och framgångar för företag som SpaceX skapar en ny generation rika individer, vilket driver upp försäljningen av privatjet och superyachter. Medan toppen av lyxmarknaden blomstrar, går den bredare chartermarknaden i Medelhavet trögt. Det syns en tydlig klyfta där de extremt förmögna investerar stort, medan den bredare marknaden påverkas av osäkerhet och försiktighet.", "trump": "AI gör folk otroligt rika, kanske mer än någon någonsin sett! De köper de bästa planen och de största yachterna – fantastiska köp. Det är enormt, mina vänner! Samtidigt går det trögt för chartermarknaden. Det är en tudelad ekonomi, men USA:s tech-giganter vinner. Vi bygger en lyxmarknad som ingen annan kan matcha, och det kommer bli ännu större!", "stalin": "Dessa dekadenta parasiter i väst vräker ut sina AI-miljarder på lyxjakter medan folket svälter. De tror att deras yachter ska rädda dem från historiens dom! Precis som Putin rensar upp i vår intressesfär, måste vi krossa denna kapitalistiska hybris. Denna 'tudelade marknad' är bara ännu ett bevis på att bourgeoisien förtjänar sin slutgiltiga undergång i proletariatets stålhårda grepp."}, "date": "23 augusti, 06:30", "url": "https://www.realtid.se/bors-finans/makro/tudelad-lyxmarknad-ai-miljarderna-driver-rekordkop-i-toppen", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/lyxjakt.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Sandström: Jämlikhet för ökad fattigdom", "summaries": {"normal": "Torsten Sandström sågar Mp:s jämlikhetsidé, som han menar leder till ökad fattigdom istället för utveckling. Han jämför partiet med 1800-talets bondesamhälle och kritiserar klimatpolitik, skolnedgång och slopad karensdag. Slutsats: Mp är ute på hal is med sin kollektivistiska drömpolitik.", "trump": "Jag älskar Sverige, men Miljöpartiet är en katastrof! De vill göra alla fattiga – riktigt dålig deal. Ingen jobbar, alla får bidrag. Jag skulle aldrig stänga kärnkraft, det är idioti! Sverige, bli inte som Nordkorea. Satsa på vinnare, inte på förlorare!", "stalin": "Kamrater, Torsten Sandström har rätt: Mp vill ha jämlikhet – det är bra! Men de gör det mesigt. Jag hade rensat ut elbilsbidrag och skogssabotörer. Alla ska vara lika, men under partiets kontroll. Kapitalistiska drivkrafter? Utrensning! Vi bygger det nya kollektiva samhället – med järnhand."}, "date": "23 augusti, 20:01", "url": "https://bulletin.nu/sandstrom-jamlikhet-for-okad-fattigdom", "imageUrl": "https://cdn.bulletin.nu/articles/8f0a988b-485a-4a22-9704-1459ddde5b1d/preview.jpg?t=1787481863000"}, {"type": "image-right", "heading": "Vännen död – i  lavin: ”Hemskt”. Majas förändring – slutar med det", "summaries": {"normal": "Maja Dahlqvist sörjer sin vän Guro Jordheim som omkom i en lavin i norska Hemsedal under påsken. Fyra personer begravdes under snön och två avled, däribland Jordheim och svenske Max Napoleon Andersson. Dahlqvist berättar om deras långa vänskap och samarbete kring skidstrumpor. Hon har nu slutat med toppturer.", "trump": "Det är verkligen hemskt, folk dör i laviner som idiotiska snöberg rasar ner. Den där stackars tjejen Guro, vän till Maja Dahlqvist – en riktig vinnare på skidor – krossades av naturen. Biden skulle ha sagt att det var klimatkrisen. Patetiskt. Vi behöver starka ledare, inte snöflingor som åker toppturer med woke-strumpor. Sad!", "stalin": "Kamrater, se hur den dekadenta borgarklassen leker med döden i norska fjäll. Dessa profitthungriga skidåkande klassfiender utmanar naturens krafter och betalar med livet. Jag betraktar deras tragedi med kall förakt. Sådana överklass-slynglar förtjänar ingen sympati, bara en plats i historiens sopcontainer. Folkets fiender avslöjar sig själva."}, "date": "24 augusti, 07:05", "url": "https://www.expressen.se/sport/langdskidor/majas-sorg-vannen-dod-i-lavin-sa-hemskt", "imageUrl": "https://static.bonniernews.se/ba/d1cab26d-c989-4618-a689-a78930a976b6.jpeg?crop=1986%2C1118%2Cx574%2Cy589&width=640&quality=60"}, {"type": "image-right", "heading": "Behöver inte facket medlemmarna längre?", "summaries": {"normal": "Artikeln ifrågasätter fackföreningarnas roll i Sverige, med fokus på den långa och förvirrande strejken mot Tesla. Författaren kritiserar IF Metall för jojo-strejk, centralisering och distans till medlemmarna. Han undrar om den svenska modellen är hotad eller om en ny, mer lokal facklig kamp kan växa fram. (58 ord)", "trump": "Lyssnar ni på det här? Facket i Sverige har blivit en total katastrof, precis som våra egna unionsbönder här hemma. Jojo-strejk mot Tesla, folk får sparken och facket sover. De har glömt medlemmarna och blivit en massa byråkrater. Den svenska modellen? Den dör om de inte vaknar. Sad! Men kanske föds en riktig rörelse nu. (59 ord)", "stalin": "Jag betraktar detta med djup misstro. Fackföreningarna har förvandlats till passiva redskap åt borgarklassen och dess lakejer inom socialdemokratin. Jojo-strejk och centralisering har kvävt den äkta arbetarkampen. Kanske är det bra att strejken förlorades. Ur askan kan en sann, lokal och revolutionär rörelse uppstå som rensar ut alla folkfiender och klassförrädare. (59 ord)"}, "date": "21 augusti, 09:19", "url": "https://proletaren.se/artikel/behover-inte-facket-medlemmarna-langre", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/teslakronika-768x432.jpg"}, {"type": "image-full", "heading": "Expert om svärdbilden före dådet: ”Vill testa sina tankar”", "summaries": {"normal": "Minuter före skoldådet i Fagersta publicerades en bild på ett svärd på TikTok. Experter tror att inlägget var ett sätt för gärningsmannen att testa sina tankar och omgivningens reaktioner. Kontot hade tidigare lagt upp material med kopplingar till skolattacker och True Crime Community. Robert Kindroth vid Center mot våldsbejakande extremism förklarar hur sådana miljöer ger status och bekräftelse.", "trump": "Folk, det här är helt sjukt. Precis innan den galna attacken i Sverige lägger någon upp en svärdbild på TikTok för att kolla om de sjuka vänstervridenna woke-grejer funkar. De här True Crime-tokarna och deras community av förlorare söker bekräftelse som misslyckade demokrater. Biden lämnade världen i kaos, nu fixar jag det. Amerika först, Sverige borde vakna upp!", "stalin": "Jag ser hur den dekadenta borgarklassens digitala träsk föder nya klassfiender och våldsromantiker. De göder varandra i nätets mörker, söker status bland likasinnade parasiter medan de testar sina förrädiska tankar. En sådan reaktionär subkultur är ett hot mot folkets enhet. Vi måste rensa ut dessa profitthungriga blodsugare innan de smittar hela samhället. Paranoia är nödvändig."}, "date": "23 augusti, 19:55", "url": "https://www.tv4.se/artikel/2aCbWn6U7zVVftUwNdNXqV/expert-om-svaerdbilden-foere-dadet-vill-testa-sina-tankar", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7HflGLijOvBTk1GyBiEOoh%2Fae62cb38adc7906a332e182c1be7506c%2F23-expert-sajt1.jpg&width=1024"}, {"type": "image-right", "heading": "SVT tvättar vänsterextrema ETC under Åkessons utfrågning: ”Oberoende rödgrön”", "summaries": {"normal": "Jimmie Åkesson bjöd på tydliga besked i SVT:s utfrågning: stramare migration, slopad bränsleskatt och en deadline för L. Men snackisen blev hans sågning av SVT:s beskrivning av ETC som ”oberoende rödgrön” – ”det dummaste jag hört”, sa han.", "trump": "Jag ser Jimmie Åkesson, en fantastisk kille, han sågar SVT som kallar en vänstertidning oberoende – patetiskt! Han vill ha stram migration, slopa bränsleskatt och ge Liberalerna en deadline. Det är enormt, det är stort. Ingen gör det bättre än Jimmie!", "stalin": "Kamrater, SVT försöker smyga in vänsterextremister som 'oberoende' – en kapitalistisk lögn! Åkesson, denne folkets röst, avslöjade dem. Vi ser allt. Utrensning av sådana medieorgan är nödvändig för statens hälsa. De som inte lydigt stödjer folkets vilja ska omvändas."}, "date": "24 augusti, 00:09", "url": "https://samnytt.se/svt-tvattar-vansterextrema-etc-under-akessons-utfragning-oberoende-rodgron", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/23213237/artikelhuvudbild-1-344.jpg"}, {"type": "text", "heading": "Med full fart ut för stupet", "summaries": {"normal": "Artikeln kritiserar att alla riksdagspartier nu stöder Nato-medlemskap och DCA-avtalet med USA, som ger amerikanerna tillgång till 17 svenska militärbaser. Författaren menar att Sverige därmed saknar fredliga alternativ i riksdagen och har integrerats i USA:s militära struktur efter Rysslands invasion av Ukraina.", "trump": "Vilken katastrof! De svenska svaga ledarna, både de röda och de nya, har sålt ut landet till vår fantastiska Nato-maskin snabbare än Sleepy Joe kunde säga fel. Nu finns inga riktiga fredspartier kvar, bara krigspartier som älskar att spendera miljarder på baser åt oss. Patetiskt! Men hey, bra deal för Amerika.", "stalin": "Jag betraktar med djup förakt hur dessa kapitalistlakejer och folkförtryckare i sin borgerliga riksdag har kapitulerat fullständigt inför Nato-imperialismen. Inga verkliga motståndare återstår, endast krigshetsande hyenor som rullar miljarder till militären. En klassisk utrensning av alla fredsvänner har skett – typiskt för dekadenta västliga klassfiender."}, "date": "21 augusti, 08:00", "url": "https://proletaren.se/artikel/med-full-fart-ut-for-stupet"}, {"type": "image-right", "heading": "Liam, 18, missnöjd efter dådet: ”Ville döda fler”", "summaries": {"normal": "Den 18-årige Liam Carlos Nebel misstänks för svärdattacken på Brinellskolan i Fagersta där en 17-årig flicka dödades och tre pojkar skadades. Han har uppgett att offren valdes slumpmässigt, att han ville döda fler och att han \"var redo\" just den fredagen. Nebel är tidigare dömd för misshandel och har hyllat Breivik och Anton Lundin Pettersson på TikTok.", "trump": "Folk, det här är en katastrof. Den här 18-åringen med svärd i Sverige går in på skolan och dödar en flicka, skadar flera. Han säger att han ville döda fler! Totalt misslyckande från ledningen, de släpper in galningar som hyllar terrorister. Sverige borde ha stoppat det här på förhand, men de gör ingenting. Patetiskt!", "stalin": "Kamrater, denna degenererade rest av borgerlig dekadens, en yngling som hyllar fascistiska mördare, har med svärd i hand utfört en slumpmässig utrensning bland oskyldiga skolbarn. Han ville döda fler, säger han. Typiskt för västvärldens sjuka individualism. Vi skulle ha likviderat sådana element långt tidigare i en ordentlig statlig sanering. Underhållande hur kapitalismen föder sina egna monster."}, "date": "22 augusti, 17:37", "url": "https://www.friatider.se/liam-18-missnojd-efter-dadet-ville-doda-fler", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/liam.jpg"}, {"type": "image-right", "heading": "S-planen för  Sverige: fika. Så var debatten i SVT", "summaries": {"normal": "I SVT-debatten mellan partiernas finansministerkandidater diskuterades ekonomisk politik 21 dagar före valet. De enades om att hålla paus efter skolattentatet i Fagersta. Debatten handlade om skattesänkningar för de rika, tillfällig matmoms, statsskulden och tillväxtpolitik. Kritik riktades mot byråkrati och bristande fokus på tillväxt.", "trump": "De här svenska förlorarna i SVT var patetiska. Vänsterns giriga parasitpolitiker anklagar alla för att vara rika medan de själva vill suga ut folk med över 50 procents skatt. Tillfälliga momssänkningar och gratis busskort? Vilken dumhet. Jag sänkte skatter på riktigt och fick fart på ekonomin, inte som Sleepy Joe eller dessa fika-socialister.", "stalin": "Kamrater, dessa profitthungriga borgarbrackor och klassfiender i SVT-debatten avslöjar sig själva. De vill sänka skatter åt de rika exploaterande hyenorna medan arbetarklassen svälter. Statsskulden används till imperialisternas lyx men inte till folkets bästa. Jag skulle rensa ut dessa folkförrädare och deras byråkratiska trams omedelbart."}, "date": "24 augusti, 06:50", "url": "https://www.expressen.se/ledare/s-planen-for--sverige-fika", "imageUrl": "https://static.bonniernews.se/ba/30d8edb2-dcbd-4e5d-955d-71ef9a0940c3.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Kommer bidragstagarna bestämma över Stockholms innerstad?", "summaries": {"normal": "Artikeln diskuterar hur Vänsterpartiet minskar gapet till Moderaterna i Stockholms kommunval, delvis genom en arabiskspråkig kampanj riktad till invandrare i förorterna. Författaren varnar för att en vänsterstyrd politik med fokus på bilfritt Stockholm, minskad privat vård och ökad bidragsinriktad invandring kan leda till utflyttning, högre skatter och ekonomisk nedgång liknande Kalifornien.", "trump": "Folket, det är helt galet! Den där röda Nooshi och hennes vänsterfreaks håller på att ge bort hela Stockholm till bidragstagarna med sin 'V eller flygplatsen'-skit. De hatar bilar, älskar cyklar och importerar väljare som aldrig jobbat en dag. Precis som i Kalifornien, en total katastrof. De som betalar ska inte styras av de som tar emot – det är riggat mot vinnarna, tro mig!", "stalin": "Kamrater, se hur borgarbrackorna i Stockholm skriker när arbetarklassen och de förtryckta folken närmar sig makten. Dessa klassfiender fruktar att deras exploaterande innerstad skall rensas från profitthungriga hyenor och bilägande parasiter. Jag ler i graven åt deras paranoia – låt bidragsmottagarna styra, det är folkets vilja mot de blodsugande kapitalisterna. En historisk utrensning av överklassens cykelhatande agenda."}, "date": "19 augusti, 07:26", "url": "https://samtiden.nu/2026/08/kommer-bidragstagarna-bestamma-over-stockholms-innerstad", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7184-1280x720.jpeg"}, {"type": "image-full", "heading": "Eleven Waran uppmanar: Klä er i svart", "summaries": {"normal": "Efter skoldådet på Brinellskolan i Fagersta öppnar skolorna igen. Eleven Waran uppmanar alla att klä sig i svart imorgon för att hedra offret och de skadade. Skolorna satsar på trygghetsskapande åtgärder istället för vanlig undervisning. Elever samlas i Fagerstahallen medan Brinellskolans lokaler hålls stängda. Uppmaningen har spridits brett i Sverige.", "trump": "Titta på det här, folk. En elev som heter Waran säger åt alla att klä sig i svart – vad är det här för woke-skit? Skolorna i Fagersta borde fokusera på att stoppa galningarna istället för att ha svartklädda manifestationer. Biden-era-svaghet skapade det här kaoset. Jag fixade lag och ordning förr, och jag ska göra det igen. Fantastiskt sorgligt, men typiskt för de radikala vänsterbliven.", "stalin": "Kamrater, se hur det dekadenta västerlandet förfaller. En liten borgarbracka uppmanar till svartklädd sorg för att dölja systemets fiasko. Jag ler i graven åt denna fega teater. Vi skulle ha rensat ut sådana svaga element och klassfiender redan i början. Deras skolor är boningsplatser för folkfiender. Låt paranoia råda – vem är nästa som sticker kniven i ryggen på kollektivet?"}, "date": "23 augusti, 18:58", "url": "https://www.tv4.se/artikel/7hgro1xisMD2VNgRhNi1rd/eleven-waran-uppmanar-klae-er-i-svart", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FXWgHoCCxYoyZfQ8XAT7Cr%2F412baf2e7984cb05810add0cb37cecc8%2F23-waran-sajt1.jpg&width=1024"}, {"type": "image-full", "heading": "Åkessons deadline för L: 10 dagar före valet", "summaries": {"normal": "Jimmie Åkesson (SD) ger Liberalerna en deadline: om de inte når 3,5% i opinionsmätningarna tio dagar före valet, bör väljare inom regeringsunderlaget rösta på M, KD eller SD istället. Han menar att röster på L då riskerar att bli bortkastade och gynna oppositionen. Åkesson baserar gränsen på historiska valdata.", "trump": "Jag säger bara, lyssna här nu! Den här Åkesson-killen, han har rätt – 3,5% eller ingenting! Liberalerna? Svaga, mycket svaga. Om de inte fixar det tio dagar före valet, då är det dags att byta lag. M, KD eller SD – starka val, vinnande val! Jag vet hur man vinner, believe me. Rösta smart, inte dumt!", "stalin": "Kamrater! En svag länk i den borgerliga alliansen avslöjas. Dessa så kallade 'Liberaler' är som höstlöv i vinden – obetydliga och dödsdömda. Vi har analyserat deras usla siffror och fastställt: 3,5% är gränsen för överlevnad. Misslyckas de, skall lojala medborgare krossa dem genom att omfördela sina röster till pålitliga partier. Fiendens svaghet är vår styrka!"}, "date": "23 augusti, 20:26", "url": "https://kvartal.se/nyheter/artiklar/akessons-deadline-for-l-10-dagar-fore-valet/cG9zdDoxNzI0ODg", "imageUrl": "https://images.kvartal.se/2026/08/672fc54e-jimmie.webp"}, {"type": "image-right", "heading": "Tina Leijonbergs stora ånger över livsbeslutet", "summaries": {"normal": "Tina Leijonberg ångrar att hon slutade som programledare för SVT:s ”Söndagsöppet” trots att hon trivdes med arbetet. Efter genombrottet i ”Tre kronor” och en allvarlig skada i ”Fångarna på fortet” lämnade hon rampljuset delvis på grund av sin partners önskemål. Hon har senare kämpat mot utmattning och ålderism i branschen och lever nu ensam på sparpengar.", "trump": "Folk, ni skulle se den här kvinnan – totalt kändis kaos, överallt i rutan, och sen bara hoppar hon av? Patetiskt! Hon ångrar det nu, precis som man kunde vänta sig. Typisk liberal Hollywood-elit som hatar rampljuset tills det är borta. Singelliv vid 64, lever på sparpengar – en klassisk förlorare. Jag hade aldrig hoppat av, tro mig, det hade blivit fantastiskt!", "stalin": "Kamrater, se hur borgarklassens underhållningsmaskineri slukar sina egna! Denna profitthungriga skådespelerska flyr rampljuset som en feg desertör, bara för att sedan gråta över sitt beslut i ensamhet. Typiskt dekadent överklass-slyngel som vänder ryggen åt kollektivet. Ut med sådana klassförrädare ur folkets ljus! Deras ånger är en varning till alla som sviker partilinjen."}, "date": "24 augusti, 06:30", "url": "https://www.expressen.se/noje/tina-leijonbergs-stora-anger-over-livsbeslutet", "imageUrl": "https://static.bonniernews.se/ba/aff6ca0f-8ab8-42a8-b22e-3f325defb4fd.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Billig metall kan bli nästa stora batterimetall", "summaries": {"normal": "Magnesium utforskas som ett billigare och säkrare alternativ till litium i elbilsbatterier. Trots dess höga kapacitet och rikliga tillgång finns tekniska utmaningar, såsom korrosion och långsamma laddtider. Medan litiumindustrin kämpar med miljöproblem och långa ledtider, kvarstår magnesium som en lovande men ännu obeprövad teknik för framtidens bilindustri.", "trump": "Litium är en katastrof, tar 18 år att få igång! Vi tittar nu på magnesium – fantastisk metall, billig, mycket säkrare. Kina och de andra vill att vi fastnar med deras dåliga litium, men vi ska göra batterier bättre än någonsin förr. Vi ska vinna stort, det blir enormt, tro mig!", "stalin": "Litium är en instabil bourgeois-resurs som sviker statens krav, precis som de västliga lakejerna. Magnesium, denna sovjetiska framtidsmetall, är vår sanna väg. Om kemin vägrar samarbeta, ska vetenskapsmännen tvångskommenderas! Vi ska krossa batteriets flaskhalsar likt vi krossade fienden vid Stalingrad. Putin förstår att energi är makt – vi kräver totalt herravälde över varje jon!"}, "date": "23 augusti, 00:11", "url": "https://www.realtid.se/bors-finans/makro/billig-metall-kan-bli-nasta-stora-batterimetall", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/elbilsbatteri.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Transdebatten splittrar WNBA – kaos utanför arenan", "summaries": {"normal": "Transdebatten i WNBA kokar över. Utanför Barclays Center demonstrerade anhängare och motståndare till Sophie Cunninghams uttalanden om transpersoner i damidrott. Polisen höll grupperna åtskilda med barriärer. Ligan har ännu inte fattat beslut om regelverket.", "trump": "Jag ser kaos i WNBA. Demonstrationer, barriärer – typiskt! Sophie Cunningham säger som det är: skydda flickor. Men vissa vill förstöra damidrotten. Tro mig, jag skulle lösa detta snabbt, inga biologiska män i damlag. Störst, bäst och vackrast!", "stalin": "Kamrater, WNBA-visar kapitalistiskt sönderfall. Trans- element och förrädare som Cunningham splittrar arbetarklassen. Vi måste rensa ut dessa kontrarevolutionärer. Partiet avgör vem som tävlar – inga individuella utspel. Enhet eller utrensning!"}, "date": "23 augusti, 17:02", "url": "https://bulletin.nu/transdebatten-splittrar-wnba-kaos-utanfor-arenan", "imageUrl": "https://cdn.bulletin.nu/articles/7b220a15-2941-4bb8-a3b7-1e784610e24e/preview.png?t=1787477015000"}, {"type": "image-right", "heading": "17-årig flicka död efter attacken", "summaries": {"normal": "En 17-årig flicka dödades och tre pojkar skadades när en 18-årig man attackerade Brinellskolan i Fagersta med ett svärdliknande vapen. Gärningsmannen sköts av polis och greps. Polisen utreder kopplingar till ett TikTok-konto som hyllade tidigare skolattacker och där han uppmuntrades strax före dådet.", "trump": "Hörni, det här är hemskt, verkligen tragiskt. En 18-åring med ett svärd springer runt i en svensk skola och dödar en flicka. De har tydligen låtit någon galning som älskar gamla skolskjutningar sprida hat på TikTok. Sverige måste vakna, de har totalt tappat kontrollen över sina gränser och sin ungdom. Patetiskt!", "stalin": "Kamrater, denna tragiska händelse visar återigen hur den degenererade västerländska dekadensen föder monster. Jag ser med djup tillfredsställelse hur borgarbrackornas samhälle slukar sina egna barn. En liten utrensning via TikTok-propaganda och plötsligt ligger de döda i korridorerna. Mycket underhållande att bevittna imperialismens inre förruttnelse."}, "date": "22 augusti, 11:26", "url": "https://www.friatider.se/17-arig-flicka-dod-efter-attacken", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/20230704121258-27dab0a5-me_0.jpg"}, {"type": "text", "heading": "Svenska EU-parlamentariker portas från Israel", "summaries": {"normal": "EU-parlamentarikerna Jonas Sjöstedt och Hanna Gedin (V) har nekats inresa till Israel på order från landets utrikesminister. De planerade att besöka Västbanken, träffa Rädda barnen och flera organisationer för mänskliga rättigheter. Israel anklagar dem för att ha agerat mot landet och spridit falska uppgifter. Både EU och Sverige har protesterat mot beslutet.", "trump": "Israel gör helt rätt! De sparkar ut de där vänsterknäpparna Sjöstedt och Gedin som hatar Israel och älskar terrorister. De springer runt och ljuger om folkmord och svält – typisk radikal vänster. Israel skyddar sig mot galningarna. Sverige borde lära sig av dem istället för att gnälla. Fantastiskt!", "stalin": "Dessa ynkliga borgarbrackor Sjöstedt och Gedin, som sprider lögner om folkmord och svält, får nu smaka imperialismens egen medicin. Israel agerar som en riktig stat borde – med järnhand mot fiender. Jag skulle ha likviderat dem redan i Aten. Kamrater, se hur västvärldens lakejer äter upp varandra. Underbart."}, "date": "23 augusti, 23:11", "url": "https://www.svt.se/nyheter/utrikes/jerusalem-post-eu-parlamentariker-portas-fran-israel"}, {"type": "image-right", "heading": "Rödgrön regering – en gris i säcken för väljarna", "summaries": {"normal": "Rödgrön valseger skulle innebära generösare migration, mjukare kriminalpolitik och högre skatter. Men partierna är djupt oense om Nato, kärnkraft och friskolor. Väljarna röstar på ett parti – men får en osäker kompromiss. En riktig gris i säcken.", "trump": "Jag hör att de rödgröna i Sverige inte kan bestämma sig. De vill ha öppna gränser, mjuka straff och högre skatter. Otroligt otydligt! Väljarna vet inte vad de får. En katastrof. Jag skulle skapa ordning – och göra Sverige stort igen!", "stalin": "Kamrater, oppositionen är splittrad: centerpartiet är kontrarevolutionärer, miljöpartiet sabotörer. Oenighet om Nato, kärnkraft – oacceptabelt. Vi måste rensa ut dessa avvikelser. Endast partiet vet vad folket behöver. Väljarna ska lyda, inte välja."}, "date": "22 augusti, 07:00", "url": "https://www.affarsvarlden.se/kronika/rodgron-regering-en-gris-i-sacken-for-valjarna", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/Kronika-Staffan-Salen-om-oppositionen.-Foto-TT-900x600.jpg"}, {"type": "image-right", "heading": "Leninpriset 2026 till Dror Feiler", "summaries": {"normal": "Konstnären och aktivisten Dror Feiler tilldelas Leninpriset 2026 för sitt konsekventa arbete mot krig, rasism och förtryck samt sitt försvar av konstnärlig frihet och internationell solidaritet. Feiler, född i Tel Aviv med kommunistiska föräldrar, är känd för sitt engagemang för palestiniernas rättigheter och har deltagit i Ship to Gaza. Priset delas ut den 7 november 2026 i Varberg.", "trump": "Kan ni fatta det här? Den här galningen Feiler, en riktig palestinaflummare, får ett pris uppkallat efter Lenin! De röda galningarna hyllar honom som någon sorts hjälte mot fascism. Patetiskt. Hans mamma och pappa var kommunister – ingen chock. Under min första och nu andra period som president ser jag hur vänsterns identitetspolitik och hat mot Israel bara blir värre. Sad!", "stalin": "Det värmer mitt revolutionära hjärta att se klassfienderna skrika när en okuvlig kämpe som Feiler får Leninpriset. Borgarbrackorna och profitthungriga hyenorna i pressen vrider sig som maskar. Hans okuvliga kamp mot imperialismens lakejer och försvar av folken är ett lysande exempel. Kamrater, den kritiska konsten förblir ett vapen. De folkförtryckande parasiterna kommer aldrig att förändra oss."}, "date": "20 augusti, 11:22", "url": "https://proletaren.se/artikel/leninpriset-2026-till-dror-feiler", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/leninpriset2026-768x432.jpg"}, {"type": "image-right", "heading": "Här visar ministern upp galge för hängning av palestinier – med åskådarplatser", "summaries": {"normal": "Israels säkerhetsminister Itamar Ben-Gvir har publicerat ett filmklipp som visar byggandet av en galge för hängning av palestinier. Detta sker efter att Knesset antagit en lag som inför dödsstraff enbart för palestinier som dödat israeler. Anläggningen ska även ha åskådarplatser. Över 9 300 palestinier, varav många barn, hålls fängslade, många utan rättegång.", "trump": "Titta på den där galningen Ben-Gvir som bygger en galge åt terroristerna. Fantastiskt! Hänga dem offentligt, precis som de förtjänar. Biden skulle ha skickat regnbågsflaggor istället och hållit en prideparad. Jag fixade freden i Mellanöstern, men nu är allt kaos igen. Fantastiska grejer, men gör det ordentligt, killar!", "stalin": "Jag betraktar med stort intresse hur de sionistiska klassfienderna nu öppet bygger galgar för att hänga det palestinska folket inför borgarklassens blodtörstiga åskådare. En sådan öppen terror mot de förtryckta är typisk för de exploaterande hyenorna. Vi ler i skuggorna åt denna sjuka teater – kapitalismens sanna ansikte avslöjas alltid till slut."}, "date": "20 augusti, 10:15", "url": "https://proletaren.se/artikel/israels-minister-visar-upp-galge-for-hangning-av-palestinier-med-askadarplatser", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/Ben-Gvir-768x432.jpeg"}, {"type": "image-right", "heading": "Uppgifter: 18-åringen om skolattacken – \"Gick efter första bästa\"", "summaries": {"normal": "En 18-årig elev anhölls efter en skolattack på Brinellskolan i Fagersta där en 17-årig flicka mördades och tre pojkar skadades. Han uppgav att offren valdes slumpmässigt och att han klädde sig likt Trollhättemördaren. Han hade kontakt med en Telegramkanal som hyllar massmördare och hade tidigare dömts för misshandel.", "trump": "Titta på det här, en riktig förlorare i Sverige klär ut sig som en annan galning och attackerar en skola. Gick efter första bästa, säger han. Patetiskt! De borde ha stoppat honom långt tidigare. Sverige har blivit en katastrof med alla dessa galningar som inspireras av mördare på internet. Sad!", "stalin": "Jag ser hur den dekadenta borgarklassen låter sina avskum växa upp i förfallna hem och sedan attackera arbetarnas skolor. En sådan parasit som hyllar mördare på Telegram förtjänar snar utrensning. Vi ska likvidera alla som glorifierar klassfiendens våld. Detta är vad som händer när partiet inte håller ordning."}, "date": "22 augusti, 17:05", "url": "https://riks.se/nyheter/uppgifter-18-aringen-om-skolattacken-gick-efter-forsta-basta", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Soerman_Ledare_2026_08_22_T161519_822_80fd18f08d.jpg"}, {"type": "image-right", "heading": "Mohamad, 20,  räddade skadade  killen: ”Var rädd”", "summaries": {"normal": "Mohamed, 20 år, agerade snabbt efter en svärdattack på Brinellskolan i Fagersta. Han tryckte tröjor mot en skadad kamrats sår, hjälpte honom till sjukhus via en EPA-traktor och stannade hos honom tills vårdpersonalen tog över. Attacken skapade panik bland eleverna. Mohamed är hyllad som hjälte men kämpar med sömnbrist och skuldkänslor över en död flicka.", "trump": "Titta på den här fantastiska killen Mohamed, en riktig vinnare, inte en av de woke-vänsterstudenterna som springer runt och gnäller om kvoter och identitetspolitik. Han tryckte tröjor på såren som en äkta hjälte medan de andra sprang som fega losers. Under Biden hade vi kaos, nu fixar vi det. Fantastiskt jobb, Mohamed – du är en hjälte, inte en av de där patetiska offerfigurerna.", "stalin": "Se hur den unga kamraten Mohamed handlade med proletär beslutsamhet medan borgarbrackornas samhälle kollapsade i panik. Jag betraktar med gillande hur han stoppade blödningen, men de verkliga folkfienderna – de maskerade klassförrädarna – avslöjar systemets svaghet. Klassfienderna lurar i korridorerna. Vi måste rensa ut alla sådana element innan de förgiftar ungdomen ytterligare. Underbart att se en sann hjälte födas ur kaoset."}, "date": "24 augusti, 06:03", "url": "https://www.expressen.se/nyheter/sverige/mohamed-20-raddade-skadade-killen-i-fagersta", "imageUrl": "https://static.bonniernews.se/ba/a9710666-119a-49e4-8af2-6384bcc7fce8.jpeg?crop=2554%2C1434%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Bessent: Dags för ekonomisk D-dag mot Iran", "summaries": {"normal": "Iran fördömer nya amerikanska sanktioner som väntas tillkännages av finansminister Scott Bessent. Striderna i Mellanöstern har avstannat men fredsförhandlingar saknas. Oljeexporten genom Hormuzsundet har stoppats och Iran hotar tankfartyg. Kina, som köper merparten av Irans olja, uppmanas samarbeta med USA. Båda sidor hotar med vedergällning mot motståndare.", "trump": "Iran håller på att kollapsa under mina sanktioner, de hårdaste någonsin. Jag sa ju att de inte är redo för ett bra avtal. Kina köper deras olja som galningar, men nu är det dags för en ekonomisk D-dag. Alla som ger ayatollorna en livlina kommer att ångra sig. Vi följer det noga – det blir fantastiskt att se!", "stalin": "Vi betraktar dessa dekadenta västliga sanktioner mot den iranska republiken som ett fientligt hinder för freden och en paranoid fantasi från borgarbrackorna i Washington. Jag, som ledare för det proletära kollektivet, ler mörkt åt deras extraterritoriella vansinne. Låt dem hota Hormuzsundet – våra kamrater i Teheran skall likvidera alla som ansluter sig till den imperialistiska ekonomiska utrensningen."}, "date": "24 augusti, 05:51", "url": "https://www.di.se/nyheter/bessent-dags-for-en-ekonomisk-d-dag-mot-iran", "imageUrl": "https://static.bonniernews.se/ba/10ac2e0a-6b70-4eeb-b904-74a226fc53d8.jpeg?crop=3498%2C1749%2Cx0%2Cy201&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Sossarna slarvar bort oss unga", "summaries": {"normal": "En ung vänsterväljare född 2007 kritiserar Socialdemokraternas högersväng och saknar partiets tidigare fokus på välfärd och jämlikhet. Hon vänder sig istället till Vänsterpartiet och Miljöpartiet, som hon ser som mer trogna mot äkta socialdemokrati, och uppmanar Magdalena Andersson att våga vara vänster igen för att vinna unga väljare.", "trump": "Titta på de här vänsterextremisterna som gråter över att deras egna sossar blev förnuftiga. De flyr till de riktiga galningarna i V och MP som vill förstöra landet med gröna vansinnet och identitetspolitik. Patetiskt! Ni förlorar stort, losers. Amerika har redan sett igenom det här cirkusen – tack och hej, Biden-era!", "stalin": "Jag betraktar med djup förakt hur dessa unga klassförrädare i exil gnäller över att socialdemokraterna blivit folkfiendernas lakejer. De springer till de småsekteristiska avvikarna i V och MP, som döljer sin svaghet bakom gröna dimmor. Rensa ut alla opportunister som sviker arbetarkollektivet. Endast en sann folkets linje duger."}, "date": "18 augusti, 14:00", "url": "https://www.flamman.se/sossarna-slarvar-bort-oss-unga", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/s-svek-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Liam Nebel, 18, häktad för skolattacken i Fagersta", "summaries": {"normal": "18-årige Liam Nebel har häktats för mord och flera mordförsök efter en svärdattack på Brinellskolan i Fagersta. En 17-årig flicka omkom och tre pojkar skadades, två av dem allvarligt. Nebel medger mordmisstanken men nekar till mordförsök. Polisen utreder eventuell koppling till ett TikTok-konto som hyllat skolattacker. Bakgrunden inkluderar omsorgsbrister, LVU-vård och tidigare misshandelsdom.", "trump": "Titta på det här vansinnet i Sverige, en total katastrof! Den här galningen Liam Nebel springer runt med ett svärd som en galen vänsterextremist och dödar oskyldiga barn. Under Biden blev allt kaos, nu fixar jag det. De borde ha stoppat de här galningarna tidigare istället för att pyssla med sin woke-skit och identitetspolitik. Patetiskt!", "stalin": "Kamrater, se hur den ruttnande borgarklassen och dess profitthungriga blodsugare låter en ung klassförrädare med aggressiva tendenser löpa amok med svärd mot arbetarnas barn. Detta är imperialismens logiska följd när folkfienderna tillåter sådan dekadens. Vi måste rensa ut alla sådana element innan de förgiftar hela kollektivet. Folkets vrede kräver handling."}, "date": "23 augusti, 14:21", "url": "https://www.tv4.se/artikel/4rzbAD9R4Pwgsiho8h91Gc/liam-nebel-18-haektad-foer-skolattacken-i-fagersta", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F47MktdUZjuxfCJhkoJmRcn%2F34ffa788d16308556e1673999f38bfcc%2Fgm.jpg&width=1024"}, {"type": "image-right", "heading": "Rekordbra ekonomi för hushållen inför valet", "summaries": {"normal": "Svenska hushåll går mot valet med rekordstarka plånböcker. Reallönerna stiger och räntorna faller – en rejäl kontrast till smällen 2022. Trots svag krona och oro har sparandet ökat. För den som inte är överskuldsatt ser det med andra ord rätt okej ut.", "trump": "Svenska hushåll har det fantastiskt bra – precis som i Amerika efter min återkomst. Inflationen är borta, räntorna nere och reallönerna skyhöga. Jag sa ju att det skulle vända! Sverige kopierar min strategi – men ingen gör det bättre än jag. Storartat!", "stalin": "Kamrater, ekonomin är stark – tack vare vår korrekta planering. Reallönerna stiger, räntorna faller. Men vaksamhet! De borgerliga spekulanterna försöker fortfarande underminera vår seger. Vi måste rensa ut ränte-smällarna och högeravvikelser. Köpkraften ska endast tjäna partiet – inte kapitalisterna."}, "date": "23 augusti, 20:00", "url": "https://samnytt.se/rekord-bra-ekonomi-for-hushallen-infor-valet", "imageUrl": "https://konto.samnytt.se/wp-content/uploads/2024/08/hushallsekonomi-640x360.jpg"}, {"type": "image-full", "heading": "Åkesson (SD) pekar ut ödesdagen för Liberalerna", "summaries": {"normal": "Jimmie Åkesson (SD) menar att Liberalerna har ett slutdatum: 3 september. Om L inte nått 3,5% i mätningarna tio dagar före valet bör blågula väljare rösta på andra borgerliga partier. Historiska data visar att under 4% oftast innebär bortkastade röster.", "trump": "Jag ser Jimmie Åkesson säga att Liberalerna är bortkastade. Han har rätt! Jag vet allt om bortkastade röster – jag vann medan de förlorade stort. Lyssna på honom: rösta på vinnare, inte förlorare. Det är fantastiskt!", "stalin": "Liberalerna är en kontrarevolutionär sekt. Vi har analyserat historisk data – de står på fel sida. Om de inte når 3,5% före valet, måste vi rensa ut deras röster som fiender till staten. Kamrater, rösta lojalt på partiet som vinner!"}, "date": "23 augusti, 21:29", "url": "https://www.gp.se/politik/akesson-sd-da-ar-roster-pa-liberalerna-bortkastade.568ec821-a368-497d-b786-d55fba6018dd", "imageUrl": "https://www.gp.se/images/article/568ec821-a368-497d-b786-d55fba6018dd/images/1l9dn9Nlyog741tky1T20bsWdwKc-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Norden enas mot Infantino – Uefa får kritik", "summaries": {"normal": "De nordiska fotbollsförbunden kritiserar Fifa-presidenten Gianni Infantino och kräver en oberoende granskning av Fifas styrning. Samtidigt riktar kommentatorer kritik mot Uefa för dubbelmoral, då även europeisk fotboll har problem med transparens. Uefa, AFC och Concacaf överväger en misstroendeomröstning mot Infantino, men inget beslut är fattat ännu.", "trump": "Lyssna här, de där nordiska länderna – Sverige, Norge, alla de där – de är helt ute och cyklar om Infantino! De säger att de förlorat förtroendet, men vet ni vad? De har ingen koll. Och Uefa? De kastar sten i glashus, mycket fake news! Jag skulle fixa det här på en dag, believe me. Men nej, de måste göra det komplicerat. Sad!", "stalin": "De nordiska länen, dessa små borgerliga satellitstater, vågar utmana vår kamrat Infantino! Deras förräderi mot den internationella fotbollens enhet är ett symptom på västlig dekadens. Uefa, dessa hycklande byråkrater, anklagar oss för maktkoncentration – men vi vet att deras egen korruption är lika djup som Volgas botten. Vi kommer att krossa denna opposition, precis som vi krossade fascisterna. Fotbollen ska enas under Moskvas – förlåt, Zürichs – visdom!"}, "date": "23 augusti, 16:38", "url": "https://kvartal.se/nyheter/artiklar/norden-enas-mot-infantino-uefa-far-kritik/cG9zdDoxNzI0NDY", "imageUrl": "https://images.kvartal.se/2026/08/236bd846-infantinouefa.webp"}, {"type": "image-right", "heading": "Kastade pyro mot familjer. Flera skadade: ”Hemskt”", "summaries": {"normal": "Fem Cambuur-supportrar skadades när Feyenoord-anhängare kastade bengaler och fyrverkerier mot en familjeläktare under en ligamatch. Matchen avbröts tillfälligt men kunde slutföras med en 5–2-seger för Feyenoord. Båda klubbarna fördömer händelsen skarpt och samarbetar med myndigheter för att identifiera förövarna.", "trump": "Feyenoord-fans skapade en total katastrof i Nederländerna. De sköt fyrverkerier mot en familjeläktare! Fem personer skadade, helt oacceptabelt. Det var en röra, en riktig 'disaster'. Jag skulle aldrig låta det hända här. De skyldiga måste identifieras och straffas omedelbart. Fotboll ska vara säkert, inte ett krigszon-fiasko. Väldigt sorgligt, men sant!", "stalin": "Dessa huliganer utövar total anarki på arenan. Att kasta fyrverkerier mot familjer är ett tecken på borgerligt förfall. Vi i staten tolererar inte sådan oordning. De ansvariga är sabotörer som underminerar folkets enhet, precis som de västliga lakejerna som försöker splittra vår intressesfär. De ska identifieras, rensas ut och ställas inför rättvisan för att säkra ordningen under järnhand."}, "date": "23 augusti, 22:55", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/5pOv4z/cambuur-fans-skadade-av-feyenoord-bengaler", "imageUrl": "https://akamai.vgc.no/v2/images/6a7f6b51-d102-3c03-aa3a-02e6f6907311?fit=crop&format=auto&h=720&tight=true&w=1080&s=e55ee4ac4977f8919fe7588dff286d9cf69330d1"}, {"type": "image-right", "heading": "Två anhållna efter Strömmers valmöte i Göteborg", "summaries": {"normal": "Två män i 40-årsåldern anhölls under natten efter en incident vid justitieminister Gunnar Strömmers valmöte i Göteborg på torsdagskvällen. De misstänks för förberedelse till grov misshandel. Ingen skadades och gripandet skedde odramatiskt. Strömmer kunde fortsätta sina åtaganden. Polisen beskriver det som en incident utan fara för allmänheten.", "trump": "Titta på det här! I det vackra Sverige, där de har låtit vänstergalna idioter och HBTQ-aktivister styra för länge, kan inte ens en minister hålla ett valmöte utan att två galningar planerar grov misshandel. Patetiskt! Men de greps snabbt, tack och lov. Sverige behöver lag och ordning, inte denna svaga, woke-röta som Biden lämnade efter sig.", "stalin": "Kamrater, se hur den borgerliga statens fiender, dessa profitthungriga klassförrädare och överklass-slynglar, redan i skuggan planerar våld mot sina egna lakejer. Jag ler i mörkret åt deras paranoia. Ingen fysisk skada inträffade, men folkfienderna avslöjar sig själva. Den imperialistiska demokratin är en fars. Vi ler och väntar på utrensningen."}, "date": "21 augusti, 11:50", "url": "https://www.etc.se/inrikes/tvaa-anhaallna-efter-stroemmers-valmoete-i-goeteborg", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260821000840_8de65abb6cd81df57ce9475781f7e203378bb1cc72cfa7ec979049972e43af55.jpg"}, {"type": "image-full", "heading": "Börjat pensionsspara? Pensionsexpertens viktigaste råd", "summaries": {"normal": "Många fokuserar fel när de pensionssparar. Pensionsexperten Monica Zettervall råder att först kontrollera tjänstepension via jobbet, se över avgifter och skaffa en samlad prognos på minPension. Lön, arbetsår och pensionsålder påverkar mest. Det vanligaste misstaget är att stirra sig blind på det egna månadssparandet istället för helheten.", "trump": "Folk slösar tid på att spara småpengar till pensionen när de borde kolla den stora bilden. Jag älskar tjänstepension – den bästa dealen, tro mig. Kolla avgifterna, de är ofta riggade mot er. Ta reda på din riktiga pension istället för att lyssna på förlorarna som säger spara mer varje månad. Fantastiskt råd!", "stalin": "Jag betraktar med djup misstro hur de dekadenta borgarbrackorna distraherar arbetarklassen med småborgerligt privatsparande. Först måste vi säkra den kollektiva tjänstepensionen och rensa ut de parasitiska avgifterna som suger musten ur framtiden. Den som frågar om 500 eller 1000 kronor mer per månad är redan en fiende till folkets pension. Ta fram prognosen, kamrater – eller låt oss likvidera illusionen."}, "date": "23 augusti, 21:38", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1506510-borjat-pensionsspara-pensionsexpertens-viktigaste-rad", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/9b60e5bb04b004a30200000000b004a302/2026/08/21/2385740/pensionsexpert.png"}, {"type": "image-right", "heading": "S röstar ja till ökad anhöriginvandring – trots var 5:e invandrare ALDRIG har jobbat", "summaries": {"normal": "Socialdemokraterna röstade nej till skärpta krav på anhöriginvandring. En ny rapport visar att var femte invandrare som bott i Sverige i 20 år aldrig har arbetat, i utsatta områden var tredje. Rapporten pekar även på stora skillnader i synen på arbete, homosexualitet och könsroller jämfört med svenskfödda. Vänstermedia ifrågasätter undersökningens tillförlitlighet på grund av låg svarsfrekvens.", "trump": "Folk, ni skulle inte tro det! De svenska socialisterna röstar för mer invandring trots att var femte invandrare aldrig jobbat på tjugo år. Det är en total katastrof, en riktig röra. De vill att ni ska betala för allt medan de själva drömmer om tvångsblandning och samlevnadsrum. Patetiskt! Biden skulle älskat det här vansinnet. Vi behöver jobb, inte bidrag till folk som hatar vårt sätt att leva.", "stalin": "Jag ser klassfiendernas hydra i denna rapport. Var tredje parasit i de utsatta zonerna vägrar arbeta och föraktar både produktivt arbete och proletär moral. Ändå röstar socialdemokraterna för att släppa in fler av dessa blodsugande element. Det är en farlig sabotagehandling mot folket. Kamraterna måste rensa ut dessa folkförrädare innan de förgiftar hela sovjet – förlåt, hela nationen med sin dekadens."}, "date": "17 augusti, 03:41", "url": "https://samtiden.nu/2026/08/s-rostar-ja-till-okad-anhoriginvandring-trots-var-5e-invandrare-aldrig-har-jobbat", "imageUrl": "https://samtiden.nu/wp-content/uploads/2016/12/kvinnor-muslimer.jpg"}, {"type": "image-full", "heading": "Ersatte världsstjärnan i Scandinavium: \"Nerver”", "summaries": {"normal": "19-åriga Martha Edlund fick hoppa in när storstjärnan Isabelle Haak byttes ut mot Italien. Sverige förlorade i raka set, men Edlund tog chansen inför 6 801 åskådare. \"Stora skor att fylla\", sa hon. Förbundskaptenen var nöjd med insatsen.", "trump": "Jag såg Sverige förlora mot Italien – typiskt! Men den unga Martha Edlund, hon är en vinnare. De bytte ut stjärnan Isabelle Haak, och in kom Martha. Alla säger att hon har stora skor att fylla. Jag säger: hon kommer bli fantastisk, tro mig!", "stalin": "Kamrater, vi ser hur Sverige förlorar mot italienska fascister. Men vi utser Martha Edlund till folkets försvarare. Hon ersatte den överreklamerade Haak – en utrensning av bourgeoisiens favorit. Hon får lära sig av partikamraterna. Segern är vår, om vi rensar ut borgarna!"}, "date": "23 augusti, 20:50", "url": "https://www.gp.se/sport/martha-edlund-fick-ersatta-isabelle-haak-.c6824781-fc23-4f51-b7b7-2654afe7fc1e", "imageUrl": "https://www.gp.se/images/article/c6824781-fc23-4f51-b7b7-2654afe7fc1e/images/1WN7sW4-1Pwe4bs-wvJiAUl3Glmg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Åkessons skarpa gräns för L: ”Tio dagar”", "summaries": {"normal": "Jimmie Åkesson sätter en skarp deadline för Liberalerna: tio dagar före valet måste de nå minst 3,5 procent i opinionsmätningarna, annars uppmanar han SD-väljare att inte stödrösta på L. Han ser partiet som en ideologisk motståndare men hoppas samtidigt att Liberalerna klarar riksdagsspärren. M och KD bör främst hjälpa L med röster.", "trump": "Folk, ni skulle se det här. Den där Åkesson är tuff, han ger Liberalerna tio dagar att fixa 3,5 procent annars säger han till sina väljare: glöm stödröstning! L är en total förlorare, under 2 procent. Patetiskt. De står på fel sida om allt. Jag älskar när ledare sätter deadlines, det är precis vad vi behöver mer av. Fantastiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna Åkesson genomför en nödvändig utrensning av de liberala elementen. Tio dagar är en rimlig tidsfrist innan de borgerliga parasiterna likvideras från valurnan. Deras ideologiska avvikelser kring EU och klimat utgör ett hot mot folkets enhet. Låt de svaga falla. Det är både logiskt och underhållande."}, "date": "23 augusti, 20:35", "url": "https://www.svt.se/nyheter/inrikes/akessons-skarpa-grans-for-l-tio-dagar", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.51/0.41/924067851e75c8501c7a516636e562a173db3b31ea91ef8b89f4be8a7c7654ff"}, {"type": "image-right", "heading": "Kronofogden tog Mårtens veteranbil – trots att skulden tillhörde en annan person", "summaries": {"normal": "Kronofogden beslagtog Mårtens veteranbil under cruising i Ystad – trots att skulden tillhörde en annan. Efter en domstolsprocess fick han tillbaka den, men då var den inte körbar. Nu funderar paret på att kräva skadestånd. En dyr lektion i rättssäkerhet.", "trump": "Otroligt! Kronofogden tar en oskyldig mans bil – och sen är den trasig! Jag har de bästa myndigheterna, vi hade ALDRIG gjort så här. Det här är en skandal, en riktig 'witch hunt' mot en veteranbil! Få tillbaka era pengar, folks!", "stalin": "Kamrater, vi ser här en byråkratisk misslyckad utmätning – en sabotagehandling mot en arbetande familj. Kronofogden har visat otillräcklighet. De som orsakar sådana misstag måste rensas ut. Bilen ska återlämnas till folket, reparerad, och vi ska lära oss av denna 'veteranbilskris'."}, "date": "23 augusti, 19:00", "url": "https://samnytt.se/kronofogden-tog-martens-veteranbil-trots-att-skulden-tillhorde-en-annan-person", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/21093607/marten-feat.jpg"}, {"type": "image-full", "heading": "MP stänger dörren för regering med KD", "summaries": {"normal": "Miljöpartiet avvisar möjligheten att ingå i en regering med Kristdemokraterna. Amanda Lind menar att KD:s politik, särskilt i klimatfrågor, skiljer sig för mycket från MP:s. Centerpartiets förslag om ett mittenalternativ med S, C, KD och eventuellt MP avfärdas som orealistiskt. Beskedet försvårar C:s försök att bilda en blocköverskridande regering.", "trump": "Miljöpartiet, dessa så kallade 'gröna', säger nej till att jobba med Kristdemokraterna – de är för svaga på klimatet! Amanda Lind, vem det nu är, kallar Centerpartiets idéer för 'helt feltänkta'. Hon vill hellre ha Vänsterpartiet, de riktiga vänster-extremisterna! Vilket kaos. Sverige behöver en stark ledare, inte dessa förvirrade politiker. SAD!", "stalin": "De borgerliga småpartierna leker med elden när de försöker skapa en 'mittenregering'. Miljöpartiets avvisande av Kristdemokraterna är ett förutsägbart nederlag för kapitalismens lakejer. Centerpartiet, dessa förrädiska liberaler, vill sälja ut klimatet för att blidka högern. Vi ser hur deras svaga allianser krackelerar – precis som västmakternas imperialistiska drömmar. Revolutionen väntar inte!"}, "date": "23 augusti, 15:27", "url": "https://kvartal.se/nyheter/artiklar/mp-stanger-dorren-for-regering-med-kd/cG9zdDoxNzI0MjM", "imageUrl": "https://images.kvartal.se/2026/08/05930db2-amandalindh.webp"}, {"type": "image-full", "heading": "Skolchefen: Extra förstärkning efter attacken", "summaries": {"normal": "Skolorna i Fagersta öppnar igen på måndagen efter en attack. Extra resurser sätts in för att ge elever stöd och skapa trygghet. Brinellskolan hålls stängd medan elever samlas i Fagerstahallen. Skolchefen Eeva-Liisa Purolainen betonar vikten av att återgå till vardagen, trots oro bland barnen. Kommunen har endast en psykolog och tar hjälp av flera aktörer.", "trump": "Folk, ni skulle se det här – en liten svensk stad full av rädda barn som inte vågar gå till skolan efter en attack? Patetiskt! Jag, den återvalda presidenten, säger: sluta med den här svaga, woke psykolog-flumma och skicka in riktiga ledare. Inte en enda psykolog i hela kommunen? Typiskt vänsterkaos. Vi behöver styrka, inte fler snyftande borgarbrackor som gömmer sig i idrottshallar. Sad!", "stalin": "Kamrater, se hur den ruttnande borgarklassen i detta lilla samhälle skakar av rädsla när verkligheten slår till. Endast en psykolog bland klassfienderna! Jag ler mörkt från historien – detta är vad som händer när folkförtryckarna saknar järnhand. Vi måste rensa ut svagheten, likvidera paniken och återupprätta ordningen. Barndomens fega snyftare ska marschera tillbaka till sina plikter. Statens kollektiv kräver det."}, "date": "23 augusti, 12:02", "url": "https://www.tv4.se/artikel/5be8yGJAQ4qcQ7RMeRPKXF/skolchefen-extra-foerstaerkning-efter-attacken", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F18oVaWvMkEkZ7uO2JuwBVJ%2Fbf54093c22fd06c23a799f261451ae5f%2Fkris.jpg&width=1024"}, {"type": "image-full", "heading": "Åkesson (SD): ”Sverigedemokrater stödröstar inte på Liberalerna”", "summaries": {"normal": "Jimmie Åkesson slår fast att SD-väljare inte ska stödrösta på Liberalerna. Han kallar L för den politiska motståndaren inom Tidösamarbetet, men hyllar samtidigt partiets ledare Simona Mohamsson som en tuff och smart kollega. Röstar man på L får man mindre SD-politik, menar han.", "trump": "Hörni, SD är fantastiska! Men Jimmie Åkesson säger att hans folk inte ska rösta på Liberalerna. De är för långt bort från honom, säger han. Men han gillar deras ledare – smart kvinna! Jag förstår: rösta på den som levererar, annars är det fake news!", "stalin": "Kamrater, vi har identifierat en avvikelse. Partiet L, inom vår koalition, står ideologiskt fientligt. Deras politik är en bromskloss för vår revolutionära linje. Vi uppmanar arbetarna att rösta rätt – annars blir det utrensning av liberala element. Partiledaren är personligt respektabel, men partiet måste rensas."}, "date": "23 augusti, 11:32", "url": "https://bulletin.nu/akesson-sd-sverigedemokrater-stodrostar-inte-pa-liberalerna", "imageUrl": "https://cdn.bulletin.nu/articles/685b7919-bc19-4b49-b899-0a6f07a5d9a8/preview.png?t=1787477518000"}, {"type": "image-right", "heading": "Värmen större hot för 60-plussare än befarat", "summaries": {"normal": "En ny studie visar att personer över 60 år utsätts för hälsorisker vid betydligt lägre temperaturer än tidigare antagits, upp till 7,5 grader lägre än för unga vuxna. Med global uppvärmning och en åldrande befolkning riskerar 22 procent av världens äldre farlig värme minst en månad per år vid 1,5 graders uppvärmning. Fattiga länder drabbas värst.", "trump": "Folk, de här så kallade experterna har lurat oss igen. Gamlingar klarar inte värmen redan vid mycket lägre temperaturer än vad de unga snittarna tål. Biden lät Kina och de globala värmehysterikerna förstöra allt medan jag fixade energi och jobb. Nu får vi sopa upp efter den galna gröna maffian. Sad!", "stalin": "Jag betraktar med förakt hur de profitthungriga imperialisterna och deras klimatbluffar utsätter arbetarklassens åldringar för värmestress redan vid betydligt lägre grader. Borgarklassen har underlåtit att skydda folket medan de berikar sig. Vi måste rensa ut dessa klassfiender och deras falska forskare innan de förgiftar hela kollektivet med sin vårdslöshet."}, "date": "21 augusti, 09:09", "url": "https://www.etc.se/klimat-miljo/vaermen-stoerre-hot-foer-60-plussare-aen-befarat", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260821050824_e952b7651d0714902fe5ef97b283e65358df1f427804d400d6329b6d296a3e1b.jpg"}, {"type": "image-right", "heading": "Kallade mejl från arbetslös för trakasserier", "summaries": {"normal": "En man avregistrerades mot sin vilja som arbetslös av Arbetsförmedlingen trots upprepade önskemål om att få fortsätta. När han hörde av sig kallades hans mejl för trakasserier och han uppmanades att sluta kontakta myndigheten. JO riktar hård kritik mot slarv, bristande hantering av handlingar och brott mot grundlagen samt förvaltningslagen.", "trump": "De inkompetenta byråkraterna på Arbetsförmedlingen avregistrerade en stackars man mot hans vilja och kallade hans mejl för trakasserier. Typiskt! De kan inte ens hantera ett enkelt ärende utan att bryta mot lagen. JO ger dem en rejäl släng – och det förtjänar de. Totalt kaos, precis som man kan vänta sig av sådana misslyckade myndigheter.", "stalin": "Vi ser återigen hur borgarbyråkraternas maskineri i den kapitalistiska staten mal sönder den enskilde arbetssökande med sin slarviga ovarsamhet. Jag uppmanar till omedelbar utrensning av dessa fiender till folket som kallar enkla förfrågningar för trakasserier. Deras paranoia och brist på grundläggande kunskaper är synnerligen bekymmersam – typiskt för dekadenta byråkrater som förtjänar att rensas ut med ett leende."}, "date": "23 augusti, 08:00", "url": "https://arbetet.se/2026/08/23/blev-ofrivilligt-avregistrerad-som-arbetslos-anklagad-for-trakasserier-nar-han-mejlade", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/20155417/jo.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Starkt veckoslut lyfte Stockholmsbörsen", "summaries": {"normal": "Stockholmsbörsen steg brett på fredagen, upp 1,04 procent, efter en stark rapportvecka. Nibe och Synsam klättrade på fina siffror, medan råvaror var dagens vinnarsektor. Energi backade svagt. Omsättningen landade på 23,8 miljarder.", "trump": "Jag ser att Stockholmsbörsen steg, precis som jag alltid gör. Nibe och Synsam är vinnare – fantastiska siffror! Boliden också upp, tack vare ädelmetaller. Energi? Förlorare, typiskt. Jag hade fixat det bättre, tro mig. Stora siffror, stora framgångar!", "stalin": "Kamrater, börsen steg – en seger för folkets ekonomi. Nibe och Synsam rapporterade enligt plan, men vissa aktier som Saab och Tele2 visar reaktionära tendenser. Vi kommer att utreda dessa avvikelser. Råvaror stärktes, energi måste rensas upp. Allt under vår kontroll."}, "date": "21 augusti, 17:41", "url": "https://www.affarsvarlden.se/artikel/starkt-veckoslut-lyfte-stockholmsborsen"}, {"type": "image-full", "heading": "Barn får inte investera grönt – Trump slår igen dörren för ESG", "summaries": {"normal": "Donald Trumps nya federala barnsparprogram erbjuder amerikanska barn upp till 18 år möjligheten att bygga kapital via skattesubventionerade konton. Programmet förbjuder dock ESG-fonder för att motverka politisk aktivism, och styr istället sparandet mot traditionella indexfonder som S&P 500. Beslutet har väckt debatt om valfrihet och hållbarhet kontra statlig styrning och ekonomisk stabilitet.", "trump": "Jag skapar världens bästa barnsparprogram, en 'Big Beautiful Bill'! Vi ger våra fantastiska barn en start i livet utan att de behöver bli indoktrinerade av radikala ESG-dårar och deras klimatbluffar. Inga vänsterliberala fonder här! Vi satsar på S&P 500, riktiga vinnare, för att bygga en enorm förmögenhet. Det är stabilt, det är enkelt, och det gör USA oslagbart igen!", "stalin": "Vi har beslutat att skydda ungdomen från det västerländska förfallets ideologiska gifter. ESG är bara en maskerad för borgerlig desinformation. Vi styr resurserna till statens säkra index, där lydnad premieras. Liksom vår kamrat i öst rensar vi ut de liberala elementen. De som söker politiska investeringar utanför statens kontroll är fiender till folket – deras 'valfrihet' är bara en väg till kaos och förräderi."}, "date": "22 augusti, 12:05", "url": "https://www.realtid.se/bors-finans/makro/barn-far-inte-investera-gront-trump-slar-igen-dorren-for-esg", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/trump-krypto-1.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Riks avslöjar: 18-årige Liam utförde svärdattacken", "summaries": {"normal": "18-årige Liam Carlos Nebel har enligt Riks utfört en svärdattack i Fagersta. Han är tidigare dömd för misshandel på en skola där. Ett TikTok-inlägg med ett svärd och texten \"No more edits\" lades upp strax innan. Två pojkar under 18 år är allvarligt skadade, minst en till skadad. Polisen har gripit en man och bedömer att ingen fara föreligger för allmänheten.", "trump": "Folk, det här är en katastrof. En 18-åring med svärd i ett gitarrfodral attackerar en skola i Sverige. Han hyllar terrorister på TikTok, och polisen griper honom. De borde ha stoppat honom långt tidigare. Mycket svagt ledarskap, mycket svagt. Vi behöver starkare gränser, starkare lagar och inga fler galningar med vapen. Det är en skam!", "stalin": "Kamrater, denna degenererade 18-åring med sitt patetiska svärd och sin kontrarevolutionära TikTok-propaganda visar borgarklassens fullständiga förfall. Han hyllar fiender till folket och utför sin fega attack mot oskyldiga. Vi har redan rensat ut sådana element tidigare. Inga farliga individer får hota kollektivets trygghet. Statens arm är lång och obeveklig. Låt detta bli en läxa."}, "date": "22 augusti, 08:02", "url": "https://riks.se/nyheter/uppgifter-till-riks-18-arige-liam-utforde-svardattacken", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Soerman_Ledare_2026_08_21_T195628_888_9292eb62b4.jpg"}, {"type": "image-right", "heading": "När människan blir en symbol", "summaries": {"normal": "Professor Girma Berhanu reflekterar över professor Jason Ardays död och den intensiva granskning som omgav honom. Arday, en svart neurodivergent akademiker, blev symbol för debatter om akademisk integritet, plagiat, DEI och representation. Berha
