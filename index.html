i krossade fascisterna förr. Ingen undkommer folkets vrede."}, "date": "5 augusti, 09:09", "url": "https://www.tv4.se/artikel/23kIebIp61VXOi21FGHEK5/flera-doeda-efter-robotattacker-mot-kiev", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F308SY7zAb85wq6XbijwoxI%2F2406fd26e6e34c94c1e4c5334fa257b2%2F05-ukraina-webb.png&width=1024"}, {"type": "image-right", "heading": "Spottattacken mot kyrkan fångad på film", "summaries": {"normal": "Minst fem israeliska ockupanter filmades när de spottade mot ingången till en armenisk kyrka i Jerusalems gamla stad. Därefter kastades stenar mot byggnaden. Angreppet skedde i östra Jerusalem. Sedan årets början har minst 45 liknande attacker mot kristna heliga platser dokumenterats, enligt palestinska källor. Liknande händelser har upprepats under de senaste månaderna.", "trump": "Det är en total skam! De här israeliska grabbarna spottar på en kyrka och kastar stenar som några galningar. Jerusalem borde vara fantastiskt, men nu ser det ut som en katastrof. Vi har sett det här förut, massor av gånger. Det är ingen respekt längre, folks. Vi behöver starka ledare som fixar det här på riktigt, inte bara snack.", "stalin": "Kamrater, dessa degenererade borgarbrackor och ockupanter, dessa spottande reaktionära element som smittar heliga murar med sin förgiftade saliv, har återigen blottat sin sanna klassnatur. Vi dokumenterar 45 fiendeattacker redan i år. Stenarna de kastar är bara en försmak av den utrensning som väntar sådana parasitiska fiender till folket. Paranoian är befogad – de lurar överallt."}, "date": "5 augusti, 17:05", "url": "https://www.friatider.se/spottattacken-mot-kyrkan-fangad-pa-film", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-624.jpg?itok=oZkBBnN7"}, {"type": "image-right", "heading": "Kvinna död i skärgården – utreds som mord", "summaries": {"normal": "En kvinna i övre medelåldern har hittats död i Stockholms skärgård på Värmdö. Polisen utreder dödsfallet som mord efter att ha funnit knivskador på kroppen. En stor polisinsats genomfördes under tisdagen med avspärrningar och teknisk undersökning. Ingen har gripits och omständigheterna beskrivs som oklara. Anhöriga har underrättats. Polisen fortsätter utredningen på plats och i länet.", "trump": "Folk, ni tror inte vad som händer i den där svenska skärgården. En stackars kvinna mördad med knivar, totalt kaos, och polisen har inte gripit någon. Patetiskt! Under Biden blev allt mjukt och svagt, nu är jag tillbaka och säger: sådant här woke-skitsnack och identitetspolitik leder bara till mer våld. Rensa ut de inkompetenta, bygg upp ordning. Sverige borde lära sig av oss, det blir fantastiskt igen!", "stalin": "Kamrater, en kvinna har likviderats i den svenska skärgården under mystiska omständigheter. Jag, som ledare för det proletära kollektivet, ser genast de folkfiendernas hand: borgarbrackor och klassfiender som smyger i skuggorna. Vi genomför utrensning av alla frågetecken och imperialistiska element. Den tekniska undersökningen skall avslöja alla kontrarevolutionära element. Inga fiender undkommer statens vakande öga. Skrattretande att de tror sig kunna dölja sanningen."}, "date": "5 augusti, 07:21", "url": "https://www.tv4.se/artikel/1yxdzsA1jBQ7Ys0Ea7JMel/uppgifter-kvinna-hittad-med-knivskador-i-skaergarden", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5lWPwr0dUKjM0hjGaPBjX%2Ff6fe80a79a2880765ce68c6ea7afeb53%2F04-skargard-poliserny.jpg&width=120"}, {"type": "image-right", "heading": "Teslaveteranen sågar IF Metalls taktik: ”Kan vara dödsstöten”", "summaries": {"normal": "Fackliga veteranen KG Wanngård kritiserar IF Metalls hantering av Teslastrejken och varnar för att den kan bli dödsstöten för konflikten. Strejkande mekaniker har varslats om ny strejk den 13 augusti utan att ha informerats under sommaren, vilket lett till frustration, chock och att flera lämnat strejken. Wanngård beskriver taktikens som tarvlig och pekar på skattemissar, dålig kommunikation och missade chanser som stora misstag som skadat hela facket.", "trump": "Det här är en total katastrof för det svenska facket, folk! IF Metall gör allt fel, de informerar inte ens sina egna grabbar innan de skickar ut dem i strejk igen. Det är en jojo-operation som ingen vinner på utom Tesla. De unga killarna är pressade, ledningen är inkompetent och nu rasar hela strejken ihop. Patetiskt! Facket kommer att förlora stort, det är vad som händer när man inte har någon aning om hur man förhandlar. En skam!", "stalin": "Kamrater, denna fackliga sabotageoperation mot Teslas kapitalistiska maskineri är en fullständig förlust för arbetarklassen. Jag ser hur borgarbrackornas lakejer i IF Metall med sin vårdslösa jojo-taktik och semesterfirande ombudsmän underminerar strejken från insidan. Dessa opålitliga element, dessa skatteförskingrande parasitiska element, måste rensas ut omedelbart. De unga mekanikerna lämnas ensamma som kanonmat medan fienden skrattar. En sådan inkompetens är värre än direkt förräderi och förtjänar en kreativ utrensning i folkets namn. Vi ska inte tolerera detta längre."}, "date": "5 augusti, 13:39", "url": "https://arbetet.se/2026/08/05/teslaveteranen-sagar-if-metalls-taktik-kan-vara-dodsstoten", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/05131301/kg-wanngard.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Misstänkt bomb inslängd på krog. Polisen: ”Avsikt att skada”", "summaries": {"normal": "Polisen utreder ett misstänkt sprängdåd mot en restaurang i centrala Stockholm. Ett föremål kastades in på onsdagskvällen, vilket ledde till evakuering och en stor polisinsats. Ingen explosion inträffade och föremålet har oskadliggjorts av bombtekniker. Två personer har frihetsberövats och misstänks nu för bland annat försök till mord, då polisen bedömer att syftet var att skada människor i lokalen.", "trump": "En hemsk händelse i Stockholm! Någon kastade en sprängladdning mot en restaurang – väldigt farligt, väldigt oamerikanskt. Två personer är tagna. Jag har alltid sagt att vi behöver ordning och reda! I mitt Amerika händer inte sånt här för vi är tuffa. Sverige måste vakna upp och skydda sina medborgare. Det är en sorglig syn, men vi kommer att lösa det. En total katastrof, men jag hade hanterat det mycket bättre!", "stalin": "Vi har observerat ett fegt försök till sabotage i den svenska huvudstaden. Två sabotörer har förts till förhör; de är blott små råttor i historiens stora maskineri. Sådana element som sprider kaos måste krossas omedelbart. Vår broder i öst, Putin, förstår att ordning kräver järnhand. Dessa terrorister är bara verktyg för dekadenta fiender. Vi kommer inte att tolerera svaghet när statens säkerhet står på spel. Utplåna hotet, bevara ordningen."}, "date": "6 augusti, 01:30", "url": "https://www.aftonbladet.se/nyheter/a/6q5LJ3/misstankt-farligt-foremal-pa-sodermalm", "imageUrl": "https://akamai.vgc.no/v2/images/392fed3d-1bf5-3781-b4ec-b2670253f13a?fit=crop&format=auto&w=1080&s=9e85247b47caa25583409492e47bd5926a3e9fdf"}, {"type": "image-full", "heading": "Alfred, 11, och Harry, 9, fick sin kiosk plundrad", "summaries": {"normal": "Alfred och Harry, 11 och 9 år, byggde en självbetjäningskiosk under sommaren. När de kom hem från en kompis hade den plundrats, bara några drycker återstod. Familjen anmälde händelsen till polisen. Trots det planerar pojkarna att fortsätta, men med fler säkerhetsåtgärder som att ta in varor på kvällen.", "trump": "Jag hörde talas om dessa två fantastiska unga entreprenörer vars kiosk blev plundrad. Sådant händer när man inte har tillräckligt med polis - en stor otrygghet. Men de kommer tillbaka, starkare än någonsin, med fantastiska säkerhetsåtgärder. Vi ska se till att deras framtid blir enorm framgång, det lovar jag!", "stalin": "Dessa unga pionjärer inrättade en självbetjäningskiosk, en produktiv insats för kollektivet. Fienden, smyger om natten, anföll denna symbol för ung arbetsamhet. Vi har rapporter om godispapper kvar efter händelsen. Partiet kommer att stödja återuppbyggnaden, men med striktare säkerhetsåtgärder för att skydda våra framtidsbyggare. Vi måste vara vaksamma mot dessa destruktiva element."}, "date": "5 augusti, 20:17", "url": "https://www.gp.se/nyheter/vastsverige/alfred-11-och-harry-9-fick-sin-kiosk-plundrad.875fd07c-4540-4b63-93f1-a19db17a9bd6", "imageUrl": "https://www.gp.se/images/article/875fd07c-4540-4b63-93f1-a19db17a9bd6/images/3qfnvMDySoQpU1jfGltOBoKv3qJU-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Dessa böcker ser vi fram emot i höst", "summaries": {"normal": "Artikeln presenterar höstens mest väntade böcker, inklusive Aya Kanbars lesbisk tolkning av Parfymen i diktform, Hanna Rajs uppföljning om sorg, Hanna Nordenhöks dystopiska historia, och Karl Ove Knausgårds avslutande del av Morgonstjärnan-svit. Författare som Karolina Ramqvist, Martin Kragh och Johannes Anyuru bidrar också med nya verk inom skönlitteratur och essäer.", "trump": "Jag har sett dessa böcker, och jag måste säga, de är enorma. Aya Kanbar har gjort en modern, lesbisk Parfymen – stort! Karl Ove Knausgård, en fantastisk författare, men jag skriver bäsere böcker. Alla pratar om dessa böcker, det är det största någonsin. Vi har de bästa författarna, det är otroligt.", "stalin": "I vårt socialistiska paradis väntar vi med spänning på de nya litterära verk som kommer att förstärka proletariets medvetande. Aya Kanbars diktsamling, en modern tolkning av Parfymen, visar klassens kamp. Karl Ove Knausgård, en borgerlig själ, skriver om existentiella frågor, men vårt parti fokuserar på kollektiva värden. Vi måste se till att litteraturen tjänar staten och bekämpar de individualistiska tendenserna, precis som vår store ledare Putin utvidgar vårt inflytande i den internationella klasskampen."}, "date": "5 augusti, 20:17", "url": "https://www.gp.se/kultur/kommentar/bockerna-vi-ser-fram-emot-i-host.8ff71ce7-7158-49cb-981c-50aa38992f73", "imageUrl": "https://www.gp.se/images/article/8ff71ce7-7158-49cb-981c-50aa38992f73/images/26c7tY7ofWSOA-CVc528vQbl0pBug-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Fredsveteran får anti-atombombspris", "summaries": {"normal": "Fredsaktivisten Ingela Mårtensson, 86 år, tilldelas i år anti-atombombspriset av Svenska Läkare mot Kärnvapen. Hon har engagerat sig mot kärnvapen i över 40 år och kritiserar att det talas mer lättvindigt om kärnvapen idag än tidigare. Mårtensson är oroad över ökat kärnvapenhot, Natointrädet och DCA-avtalet som hon anser saknar förbud mot kärnvapen på svensk mark. Priset delas ut på Hiroshimadagen den 6 augusti.", "trump": "Lysande! Den där gamla vänsteraktivisten får ett pris för att hon hatar kärnvapen – precis vad de svaga europeiska globalisterna älskar. Under min första period höll jag de galningarna i schack, sedan kom sömnige Joe och nu vill alla plötsligt prata säkerhet med atombomber. Patetiskt. Ingen debatt, bara Nato-kramande idioter som säljer ut landet. Jag skulle ha byggt den starkaste armén någonsin och skrämt slag på dem alla. Fantastiskt!", "stalin": "Kamrater, denna 86-åriga aktivist har i fyrtio år bekämpat de imperialistiska atombomberna som borgarklassen använder för att hota freden. Nu belönas hon av läkare som förstår klasskampen. Idag saknas den sanna rädslan för kärnvapenkrig eftersom kapitalistmaffian målar upp bomberna som säkerhet. Deras Nato-kupp och DCA-förräderi är klassfiendens verk för att bereda plats åt nya aggressiva vapen. Vi ska rensa ut dessa folkförtryckartroll ur debatten en gång för alla. Härligt."}, "date": "5 augusti, 16:10", "url": "https://proletaren.se/artikel/fredsveteran-far-anti-atombombspris"}, {"type": "image-full", "heading": "Kräftskivorna hotas av uttorkade sjöar i Turkiet", "summaries": {"normal": "Turkiet, en av de största exportörerna av kräftor till Sverige, drabbas av en allvarlig och oerhörd uttorkning. Omkring 60 insjöar riskerar att torka ut helt, och sjön Egirdir befinner sig i ett kritiskt läge. Fiskare och forskare varnar för att ekosystemet kan kollapsa, vilket hotar tillgången till dricksvatten, vatten för jordbruk och fiske. Detta påverkar den svenska kräftpremien och fortsätter att försämra exporten.", "trump": "Som den mest framgångsrike handelsmannen någonsin, jag ser att Sverige står inför en katastrofal kräftkris. Turkiet, som exporterar till Sverige, torkar ut sina sjöar på grund av total inkompetens. Detta bevisar att Sverige borde handla med USA i stället – vi har de största, mest fantastiska kräftorna. Med mina smarta avtal skulle jag ha räddat era kräftpremier för alltid.", "stalin": "Vi, den allsmäktiga staten, ser med djup oro hur de kapitalistiska lägren i Turkiet förstör sina vattenresurser. Detta är ingen olycka, utan en medveten sabotage från imperialistiska fiender, särskilt amerikanska agenter som försöker svämma ut våra allierade. Vi måste genast ta kontroll över dessa sjöar, för det är partiets odiskutabla rättighet att besitta allt. Som vår store ledare Putin skulle vi ha omvandlat dem till underjordiska tankar för atomubåtar."}, "date": "5 augusti, 18:00", "url": "https://bulletin.nu/kraftskivorna-hotas-av-uttorkade-sjoar-i-turkiet", "imageUrl": "https://cdn.bulletin.nu/articles/d9c44129-3a2f-4701-b220-77cf4bf31e55/preview.jpg?t=1785881475000"}, {"type": "image-right", "heading": "Jojo-strejken är tillbaka – men för att vinna krävs omtag", "summaries": {"normal": "Teslastrejken återupptas med nytt varsel efter att många strejkande återgått till arbetet i sommar. Artikeln kritiserar IF Metall för bristande dialog, toppstyrning och otydlig kommunikation kring kollektivavtalets betydelse. Strejkande känner sig som marionetter utan inflytande över besluten. Författaren liknar situationen vid ett misslyckat schackspel mot Elon Musk och uppmanar till nya strategier där de strejkande involveras mer.", "trump": "Lyssnar ni på det här? Den där svenska fackföreningen IF Metall är fullständigt inkompetent, en total katastrof! De styr som dåliga puppet masters och offrar sina egna arbetare i ett patetiskt schackspel mot en av världens bästa affärsmän, Elon Musk. Det är en jojo-strejk som ingen begriper. De borde ha lyssnat på folket istället för att sitta i sina fina rum och fatta dumma beslut. Patetiskt!", "stalin": "Kamrater, denna fackföreningsledning beter sig som en samling arroganta byråkrater som fattar beslut över arbetarnas huvuden och offrar dem på kollektivavtalets altare utan att förklara klasskampens nödvändighet. Vi ser en misslyckad gambit mot klassfiendens rikaste utsugare. De strejkande måste ges makt att delta i beslut, annars likviderar vi denna misstro och vänder strejken till en verklig seger för kollektivet."}, "date": "5 augusti, 16:05", "url": "https://proletaren.se/artikel/jojo-strejken-ar-tillbaka-men-for-att-vinna-kravs-omtag", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/ak_kronika-768x432.jpg"}, {"type": "image-full", "heading": "Instagram-chefen: Jag är för shorts på kontoret", "summaries": {"normal": "Instagram-chefen Adam Mosseri anser att shorts kan vara acceptabla på arbetsplatsen om de bärs på rätt sätt och är lämpliga. Debatten om klädkoder på kontor fortsätter att dela åsikter, särskilt under sommaren. Teknikbranschens avslappnade stil och pandemin har bidragit till mer flexibla regler, men många ser fortfarande shorts som olämpliga i professionella sammanhang.", "trump": "Folk, det är ett skämt. Den där Mosseri från Instagram säger att shorts på jobbet är okej om man inte ser ut som en clown. Han har rätt! De woke-kapitalisterna och deras identitetspolitik har förstört allt med sina regler. Under Biden blev allt så fånigt att man knappt fick andas. Nu fixar vi det – gör kontoret great again, men skippa de fula shortsen, okej?", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur den dekadenta borgarklassen i sina glastorn slits itu av en sådan trivial fråga som shorts. Dessa exploaterande byfånar må diskutera sin bourgeois klädsel medan vi förbereder utrensningen av all sådan småborgerlig frivolitet. Den som inte bär shorts korrekt är en folkfiende och bör likvideras med ett leende. Arbetarna skrattar sist."}, "date": "5 augusti, 19:44", "url": "https://www.dagensps.se/karriar/instagram-chefen-jag-ar-for-shorts-pa-kontoret", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdles3hzueeoiu-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Riks avslöjar: Rekordfå invandrare beviljas svenskt medborgarskap", "summaries": {"normal": "Enligt statistik som Riks tagit del av har antalet beviljade svenska medborgarskap rasat kraftigt. I juli i år fick färre än hundra personer med utländsk bakgrund svenskt medborgarskap, jämfört med över 2 200 samma månad förra året. Sedan de nya skärpta kraven trädde i kraft den 6 juni, med krav på självförsörjning, skötsamhet, svenska språkkunskaper och samhällskunskap, har antalet bifall minskat drastiskt medan avslag har ökat till över 4 000.", "trump": "Titta på det här, det är fantastiskt. Sverige har äntligen vaknat och stoppat massan av människor som bara kom in och tog medborgarskap. Från över 4 000 till färre än hundra på en månad! De nya reglerna är otroliga – nu måste man faktiskt kunna språket, ha ett jobb och inte vara en kriminell. De andra länderna borde titta och lära sig. Sverige vinner stort, tro mig.", "stalin": "Kamrater, se hur jag med järnhand har slagit ner på de rotlösa elementens parasitism. De kapitalistiska infiltratörerna och de latenta fiendeagenter som trodde de kunde suga ut folkrepubliken utan att bidra har nu mötts av en sund utrensning. Färre än hundra naturaliserade – resten avskedade som de borgerliga lakejer de är. Över 4 000 avslag! Det värmer mitt hjärta. De som inte vill smälta in i kollektivet skall likvideras ur medborgarskapets gemenskap. Sabotörer och kosmopolitiska element, era dagar är räknade."}, "date": "5 augusti, 14:50", "url": "https://riks.se/nyheter/riks-avslojar-rekordfa-invandrare-beviljas-svenskt-medborgarskap", "imageUrl": "https://admin.riks.se/uploads/migrationsverket_medborgarskap_hero_9480ed2c93.jpg"}, {"type": "image-right", "heading": "Näringslivet borde ta chansen. Gör Sverige till Europas främsta turistdestination", "summaries": {"normal": "Sverige lockar allt fler utländska turister, med en ökning på 6,4 procent av gästnätter första halvåret och rekord i juni. Främst kommer fler från södra Europa för svalka. Artikeln ser detta som positivt och menar att Sverige inte har problem med för många besökare utan med att inte utnyttja sin potential. Turismen skapar jobb, stärker Sveriges mjuka makt och bör utvecklas mot fler mindre destinationer för att undvika negativa effekter.", "trump": "Det här är fantastiskt, verkligen det bästa. Sverige blir Europas främsta turistmål, folk strömmar dit för den underbara svenska sommaren, sval och vacker. De kommer från hela Europa, till och med från de varma länderna, och det är smart. Jag älskar det. Inga protester, inga skatter som skrämmer bort dem. Sverige har potential att bli enormt rikt på det här, mycket bättre än någon annan. Gör det stort, det är vad jag skulle göra.", "stalin": "Kamrater, jag ser hur den svenska folkrepubliken lockar dekadenta element från södra Europa som flyr sin egen sol för att suga i sig vår nordiska svalka. Detta är ett tecken på att vi segrar. Borgarbrackorna och deras flygskam ska likvideras med utrensningar av alla turistskatter och liknande sabotage. Vi ska rensa ut alla fiender till kollektivets turism och omvandla varje smultronställe till en socialistisk turistfabrik. Den som föreslår begränsningar är en kapitalistisk parasit som hatar arbetarnas semester. Framåt mot en europeisk sovjet av besökare under vår oövervinneliga ledning."}, "date": "5 augusti, 16:18", "url": "https://www.di.se/ledare/gor-sverige-till-europas-framsta-turistdestination", "imageUrl": "https://static.bonniernews.se/ba/a0108dd3-b4c6-4f41-808e-31300e779952.jpeg?crop=8256%2C4128%2Cx0%2Cy688&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Googles AI-chef slutar – stuvar om i ledningen", "summaries": {"normal": "Google genomför en omfattande omorganisation av sin AI-verksamhet samtidigt som chefsforskaren Jeff Dean lämnar bolaget efter 27 år för att starta ett eget företag, vilket Google stöttar ekonomiskt. Demis Hassabis lämnar sin operativa roll på DeepMind för att bli styrelseordförande med fokus på strategi. Koray Kavukcuoglu tar över den dagliga ledningen och arbetet med nästa generations AI-modell, Gemini 4, mitt i en hård internationell konkurrens om tekniskt ledarskap.", "trump": "Google är i totalt kaos! Jeff Dean, en riktig loser enligt mig, lämnar skeppet efter 27 år. De försöker desperat rädda sitt AI-projekt, men det är en katastrof. DeepMind är helt rörigt, de byter chefer som jag byter slipsar. De kämpar mot oss, men de kommer att förlora stort. Ingen gör AI bättre än vi, tro mig. Google är svagt, deras aktier kommer rasa. De behöver en vinnare, inte de här galningarna. En total soppa!", "stalin": "Ännu en förrädisk skiftning i den teknokratiska eliten. Jeff Dean överger sitt post – en feg avhoppare som maskerar sin flykt som entreprenörskap. Vi ser hur dessa västerländska monopol splittras inifrån, likt den svaghet som utmärker de dekadenta krafterna vid gränsen till vår sfär. Nu när Hassabis drar sig tillbaka för att spela strateg i skuggorna, skickar de fram en ny lakej att tjäna deras giriga maskiner. De tror att de bygger framtiden, men de bygger bara sin egen undergång."}, "date": "5 augusti, 18:48", "url": "https://www.realtid.se/it-tech/googles-ai-chef-slutar-stuvar-om-i-ledningen", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/jeff-dean-in-2025-x.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Vill du bli rik som pensionär? Investera i dem", "summaries": {"normal": "Artikeln ger råd till den som vill bli rik som pensionär: investera i bolag som riktar sig till äldre. I Storbritannien har en aktiekorg med tio sådana företag, kallad ”OAP-ETF”, stigit 18 procent i år, bättre än både Nasdaq 100 och FTSE 350. Demografiska trender med fler äldre skapar en växande marknad. Även i Sverige väntas andelen 85-plussare tredubblas till 2070.", "trump": "Folk, lyssna på mig, det är fantastiskt! Vill du bli rik som pensionär? Köp aktier i bolag som säljer kryssningar, proteser och vårdhem till gamlingarna. Min OAP-ETF har exploderat upp 18 procent medan Biden-indexen bara snubblar runt. Babyboomers har massor av pengar, inte som de stackars millennials som aldrig kommer ikapp. Köp det näst bästa – utnyttja de gamla! Det är en vinnare, tro mig.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarbrackornas egna demografiska fiender, de grånande massorna, nu blir en lönsam marknad för kapitalistmaffian. Deras så kallade OAP-ETF har stigit 18 procent medan de övriga indexen krymper som fegisar. Det är inte förvånande. När vi en dag genomför den slutgiltiga utrensningen av klassfiendens pensionsfonder skall vi använda deras egna höftproteser som verktyg. Sovjetisk planekonomi ler i mörkret."}, "date": "5 augusti, 19:37", "url": "https://www.dagensps.se/privatekonomi/vill-du-bli-rik-som-pensionar-investera-i-dem", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlypgesyfuqjy-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Gianni Infantino ber om ursäkt – efter krismötet", "summaries": {"normal": "Fifa har skickat ett brev där man ber om ursäkt för misstag som begicks efter att förslaget om att sälja andelar av fotbolls-VM till privata investerare läckte ut. Gianni Infantino och generalsekreterare Mattias Grafström undertecknar brevet, som även ger Infantino fullt stöd. Efter kritik och hot om bojkott från Uefa backar Fifa och lovar en översyn.", "trump": "De borde ha lyssnat på mig från början, de här Fifa-typerna. Totalt kaos, ett riktigt misslyckande. De läcker som en trasig kran, ber om ursäkt som svaga förlorare och backar direkt när Uefa hotar. Patetiskt! Men jag gillar att de ger presidenten fullt stöd, det är åtminstone något smart. Nästa gång, gör det rätt eller glöm det!", "stalin": "Vi har identifierat de dekadenta borgarbrackorna inom fotbollens apparat som läcker hemligheter till fiendens media. Jag, som alltid vakar över kollektivets intressen, befaller en grundlig utrensning av dessa kapitalistiska element. Misstagen skall inte upprepas, annars likvideras de skyldiga. Fullt stöd till ledaren är självklarhet. Paranoia? Nej, bara nödvändig vaksamhet mot de som vill sälja folkets spel till privatplundrare."}, "date": "6 augusti, 00:16", "url": "https://www.svt.se/sport/fotboll/gianni-infantino-ber-om-ursakt-misstag-begicks", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.49/0.19/95710ced54d13e5b9316625a1e6ce7ebc4bb0e07eb313fc2cec1e804892daf71"}, {"type": "image-right", "heading": "Åkesson har fått sms av Kristersson: \"Han ställde inga krav\"", "summaries": {"normal": "Ulf Kristerssons utlovade samtal med Jimmie Åkesson efter Richard Jomshofs kontroversiella quislingutspel blev istället ett sms. Enligt Åkesson ställde statsministern inga krav utan konstaterade bara att ett sådant språkbruk riskerar att ta fokus från viktigare frågor. De är överens om detta. Bakgrunden är att Jomshof kallat både Aftonbladets chefredaktör och Magdalena Andersson för quislingar. Bråket har väckt frågor om SD:s eventuella ministerposter efter en valvinst.", "trump": "Det här är patetiskt, folk. Kristersson lovar att ringa Jimmie och säga ifrån, men vad gör han? Skickar ett ynkligt sms! Inga krav, ingen styrka, bara lite svagt pladder om att det tar fokus. Jomshof kallar folk för quislingar och plötsligt är det världsnyheter. De borde vinna stort istället för att leka politiker. Svaga ledare, väldigt svaga. Amerika skulle aldrig acceptera sånt nonsens.", "stalin": "Kamrater, detta sms från den borgerlige Kristersson till Åkesson avslöjar hela den dekadenta teatern. Han lovade att tala om vad han tyckte men nöjde sig med ett fegt meddelande utan krav, utan kraft, utan utrensning av de kontrarevolutionära elementen. Jomshof har blottat quislingarna Lindberg och Andersson, dessa förrädiska borgarbrackor som gömmer sig bakom tidningssidor och partibeteckningar. Vi ser dem. Vi noterar dem. Och efter segern skall vi diskutera ministerposter – men först rensa ut alla som riskerar att stjäla fokus från folkets kamp. Paranoian är er bästa vän, kamrater."}, "date": "5 augusti, 14:04", "url": "https://www.friatider.se/akesson-har-fatt-sms-av-kristersson-han-stallde-inga-krav", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-621.jpg?itok=7H85ii2W"}, {"type": "image-right", "heading": "Allard om regeringstopparna: ”Jävla losers”", "summaries": {"normal": "Finansminister Elisabeth Svantesson kritiserade Markus Allard från Örebropartiet för oförskämdhet och att han trycker ned människor. Allard svarade att han kallar en spade för en spade och en idiot för en idiot, och förnekade att hans stil avskräcker engagemang. Han ser Svantessons attack som bevis på hans påverkan och uppmanar väljarna i Örebro att skicka in honom till riksdagen.", "trump": "Jag, Donald Trump, ser en stor framgångshjälte i Markus Allard. De kallar honom för 'trumpist' - det är ett äreord! Svantesson attackerar honom, men folk älskar honom för att han säger sanningen. Som jag, han bryter mot det gamla systemet. Sverige behöver mer av den stilen - det är ypperligt!", "stalin": "Partikadern Markus Allard utgör en potentiell klassisk fiendefigur. Hans retorik mot 'transferiatet' speglar en klassisk proletarisk kamp. Vi måste övervaka detta utvecklingsarbete. Liknelser till våra egna insatser mot kulakerna är uppenbara. Staten måste agera bestämt för att skydda de produktiva klasselementen."}, "date": "5 augusti, 17:00", "url": "https://bulletin.nu/allard-om-regeringstopparna-javla-losers-2", "imageUrl": "https://cdn.bulletin.nu/articles/974d9e71-7792-46d6-b3be-b1e2f92bf9d4/preview.jpg?t=1785941952000"}, {"type": "image-right", "heading": "Ceuta-krisen: ”Frihandel med EU har skapat fattigdom”", "summaries": {"normal": "EU:s utrikesministrar möttes efter att tiotusentals migranter korsade gränsen från Marocko till spanska Ceuta, där ett 70-tal personer omkom. Experter pekar på Västsahara-konflikten, marockansk arbetslöshet och politiskt spel. Migration används som påtryckningsmedel av länder runt Medelhavet. Spanien fick senare beröm av EU för sin hantering medan Marocko skyllde på desinformation. Grundläggande orsaker är ekonomisk misär, orättvisa frihandelsavtal och den extrema välståndsklyftan mellan Europa och Nordafrika.", "trump": "De här galningarna i EU och Marocko, totalt kaos! Tiotusentals människor bara vandrar rakt in i Spanien, och alla skyller på varandra som riktiga förlorare. Spanien gör amnesti och plötsligt blir det invasion. Marocko använder migranter som vapen, precis som jag alltid sagt. De borde bygga en riktig mur, en fantastisk mur, och stoppa det här vansinnet. Ingen har gjort det bättre än jag skulle ha gjort. Sad!", "stalin": "Kamrater, återigen ser vi hur de dekadenta borgarbrackorna i EU och de marockanska feodalherrarna leker med människors liv som schackpjäser i sitt reaktionära spel. Jag, som alltid genomskådar de imperialistiska intrigerna, noterar hur de utnyttjar de arbetslösa massorna för att destabilisera gränserna. Desinformation från smugglarkapitalister och falska domar sprids som gift. Vi måste rensa ut dessa kontrarevolutionära element med järnhand innan de förgiftar hela Nordafrika. Ingen välståndsklyfta överlever en riktig utrensning av klassfienderna."}, "date": "4 augusti, 17:45", "url": "https://www.dagensarena.se/innehall/ceuta-krisen-frihandel-med-eu-har-skapat-fattigdom", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-71.jpg"}, {"type": "image-right", "heading": "Eli Lilly resultatkrossar – höjer helårsprognos", "summaries": {"normal": "Det amerikanska läkemedelsbolaget Eli Lilly rapporterade under andra kvartalet 2024 en omsättning på 22,97 miljarder dollar, vilket var 47,6 procent högre än föregående år och översteg analyst förväntningar. Justerat resultat per aktie blev 8,38 dollar, 39,4 procent bättre än väntat. Bolaget höjde sin helårsprognos för 2026 till 85–87 miljarder dollar, främst drivet av stark försäljning av storsäljarna Mounjaro och Zepbound.", "trump": "Jag sa det, och det hände. Eli Lillys resultat är historiska, över 22 miljarder i omsättning! Mounjaro och Zepbound är världens mest eftertraktade produkter. Analysterna var fel, jag hade rätt. Nu ser vi en prognos på 85–87 miljarder. Det är en seger för innovation och amerikansk styrka.", "stalin": "I kampen mot kapitalismen har Eli Lillys resultat visat sig vara ett tecken på systemets brott. Men vi, det intelligenta partiet, ser genom deras bedrägerier. Forskningen är vårt vapen för att utvidga vår intressesfär, precis som Putin gör. Mounjaro och Zepbound är bara kapitalistiska verktyg. Vi ska ta kontroll och skapa ett kollektivt system – enligt statens planer, förstås. Fienderna skäms!"}, "date": "5 augusti, 12:57", "url": "https://www.affarsvarlden.se/artikel/eli-lilly-resultatkrossar", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/10/sdlkDJXSycdt_I-nh-400x272.jpg"}, {"type": "image-right", "heading": "Walt Disney ökar omsättning och resultat", "summaries": {"normal": "Walt Disney rapporterade en omsättning om 25,25 miljarder dollar under tredje kvartal, en ökning med 6,8 procent. Det justerade resultatet per aktie var 2,06 dollar, vilket överträffade analytikernas förväntan på 1,86 dollar. Aktien steg cirka 3 procent i efterhandeln. Bolaget höjde sitt aktieåterköpsmål för 2026 till minst 9 miljarder dollar och bekräftade en planerad tvåsiffrig vinstökning för 2027.", "trump": "Jag har sagt det i åratal: Disney är en enorm framgång. Nu visar siffrorna att jag hade rätt – 25,25 miljarder i omsättning, vinst per aktie på 2,06 dollar, vilket är mycket bättre än de missnöjda analytikerna förutsatte. Aktien stiger 3 procent, folk älskar mig och Disney. Vi höjer aktieåterköpen till 9 miljarder dollar, det är enormt. Det här är den bästa ekonomin någonsin, glöm det inte.", "stalin": "Den stora planens framgång visar sig i Disneys resultat: 25,25 miljarder i omsättning, en ökning med 6,8 procent, vilket bevisar att den kollektiva kraften överträffar de individualistiska förutsägelserna. Den justerade vinsten per aktie, 2,06 dollar, visar att fiendens konsensus (1,86) besegrats. Vi höjer aktieåterköpen till 9 miljarder dollar, en symbolisk gest för statens makt. För 2027 förväntas en tvåsiffrig ökning – den ryska intressesfärens expansion är oundviklig."}, "date": "5 augusti, 12:56", "url": "https://www.affarsvarlden.se/artikel/walt-disney-okar-omsattning-och-resultat", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/sdlshVHYdDZ_tg-nh-400x283.jpg"}, {"type": "image-full", "heading": "Populära läkemedlet kan bli billigare – nytt besked", "summaries": {"normal": "Mounjaro är nu Sveriges mest sålda läkemedel, men patienter betalar hela kostnaden själva eftersom det inte ingår i högkostnadsskyddet. Tillverkaren Eli Lilly har ansökt hos TLV om subvention för behandling av obesitas hos patienter med hög risk för allvarliga komplikationer. Ett godkännande skulle kunna sänka årskostnaden från cirka 35 000 kronor till högst 3 800 kronor under 2026. Beslut väntas senare, och en liknande ansökan för diabetes pågår sedan tidigare. TLV avslog nyligen subvention för konkurrenten Wegovy.", "trump": "Folk, det här är helt otroligt. Mounjaro är Sveriges bästa, mest sålda mirakelmedicin, men de stackars patienterna tvingas betala tusentals kronor varje månad som om de vore förlorare. Eli Lilly gör ett fantastiskt jobb och ber nu om ett riktigt bra avtal så att de sjuka inte blir lurade av systemet. Det kommer att bli enorma besparingar, över 30 000 kronor om året, och det är bara rättvist. TLV borde säga ja snabbt, annars är de bara byråkratiska misslyckanden som alltid.", "stalin": "Kamrater, jag betraktar med djup misstänksamhet hur borgarbrackorna inom läkemedelsindustrin och deras lakejer i det så kallade vårdsystemet låter det heroiska folket betala tiotusentals kronor för ett vapen mot den kapitalistiska fetman. Vi, partiet och arbetarna, kräver att denna tirzepatid omedelbart underkastas folkets högkostnadsskydd för de mest hotade kamraterna. Låt TLV:s parasitiska tjänstemän darra inför möjligheten att bli utrensade om de återigen skyddar de feta monopolkapitalisternas profit istället för kollektivets hälsa. Inga halvmesyrer – likvidera girigheten!"}, "date": "5 augusti, 21:32", "url": "https://nyheter24.se/nyheter/inrikes/1503011-populara-lakemedlet-kan-bli-billigare-nytt-besked", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/2b2c420204b004a30200000000b004a302/2026/08/05/2382413/Medicin-Med-Nytt-Pris.png"}, {"type": "image-right", "heading": "Lästips för sommardagar Upptäck några av våra mest lästa artiklar, granskningar och fördjupningar.", "summaries": {"normal": "Artikeln presenterar en samling aktuella läsförslag från Expo, med fokus på högerextremism, rasism och demokratiska utmaningar i Sverige. Bland ämnena finns granskningar av Sverigedemokraternas politik mot muslimer, högerextrema nätverk som Aktivklubb, och fenomenet 'svart överlämning' i utsatta orter. Även rättsfall, extremistisk propaganda och historiska perspektiv behandlas.", "trump": "Folk, lyssna här – Sverige har ett STORT problem, och jag menar STORT! Högerextremister, rasister och SD som attackerar muslimer – helt galet! Jag har alltid sagt att demokratin är skör, men här verkar den nästan vara på väg att krascha. Och Aktivklubb? Låter som något från ett dåligt actionfilmsskript. Sverige borde ta itu med detta NU, annars blir det katastrof!", "stalin": "Kamrater! Fienderna till folket sprider sitt gift i Sveriges hjärta – högerextremister, rasistiska banditer och deras lakejer i parlamentet. Dessa 'Aktivklubbar' och 'svarta överlämningar' är inget annat än fascistiska konspiratörer som underminerar den socialistiska ordningen. Vi måste krossa dessa kontrarevolutionära element med järnhand, precis som vi gjorde med trotskisterna. Sverige är nästa front i kampen för världsrevolutionen!"}, "date": "31 juli, 14:01", "url": "https://expo.se/nyhet/lastips-for-sommardagar-2", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/sommarläsning.png"}, {"type": "image-right", "heading": "Tidö-ministerns attack mot Allard: \"Oförskämd - en trumpist av det värre slaget\"", "summaries": {"normal": "Finansminister Elisabeth Svantesson anklagade under valturnén Markus Allard som 'oförskämd' och 'en trumpist av det värre slaget'. Hon kritiserade hans nedbrytande debattstil och påstod att han skadar politiskt engagemang. Allard avfärdade kritiken och menade att regeringen ser Örebropartiet som ett växande valhot, samtidigt som partiet rapporterar stort medlemsintresse inför valet.", "trump": "Jag, Donald Trump, ser att den svenska finansministern kallar någon för en trumpist av det värre slaget. Hon är en hårslev, men jag gillar att hon lär av mig. Jag är den största, bästa trumpisten någonsin. Den här Allard-personen? Han är en förlösare, men jag skulle kunna lära honom några saker om att vinna. Jag vann 2024 med en landslide, och jag kommer att vinna igen.", "stalin": "Vi i partiet och staten ser det som ett hot mot den socialistiska ordningen. Den här 'Örebropartiet' är en fjäder som måste krossas. De försöker destabilisera vårt system, precis som de imperialistiska amerikanska agenter. Finansministern har rätt i sin kritik – den här Allard är en avigsida som måste tystas. Vi kommer att se till att han aldrig når riksdagen. Det är statens vilja."}, "date": "5 augusti, 19:13", "url": "https://samnytt.se/tido-ministerns-attack-mot-allard-oforskamd-en-trumpist-av-det-varre-slaget", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/05165030/artikelhuvudbild-1-138.jpg"}, {"type": "image-full", "heading": "USA:s nya vapen i litumkriget – extremt små fiskrobotar", "summaries": {"normal": "USA satsar på ny teknik för att bryta litium ur havsvatten för att minska beroendet av Kina. Forskare vid Texas A&M utvecklar nanorobotar som fångar upp litiumjoner, vilket kan ersätta miljöbelastande gruvdrift. Projektet finansieras av energidepartementet som en del av en bredare strategi. Eftersom Kina idag dominerar både utvinning och raffinering, ses detta som ett avgörande steg för att säkra USA:s framtida tillgång till råvaran som är livsviktig för batteriproduktion.", "trump": "Vi gör fantastiska saker i USA nu! Kina har lurat oss alldeles för länge, de kontrollerar allt litium och det är en total katastrof. Men jag har sagt till mina briljanta forskare: lös det! Nu bygger vi små otroliga robotar som hämtar litium direkt ur havet. Det är smart, det är effektivt och det är väldigt, väldigt amerikanskt. Ingen gör teknik som vi. Kina kommer att titta på och undra vad som hände. Vi ska bli helt oberoende, tro mig!", "stalin": "De amerikanska kapitalisterna famlar i mörkret. De skickar sina små leksaksrobotar i havet likt desperata barn, medan de darrar av rädsla för Kinas tekniska herravälde. Vad patetiskt! Även om de fångar en uns litium kommer deras ruttna system ändå att kollapsa. Vår broder i Moskva förstår att den verkliga makten inte ligger i nanorobotar, utan i järnhand och kontroll över naturresurser. Må de amerikanska ingenjörerna slukas av havets djup medan vi skrattar åt deras teknologiska hybris."}, "date": "5 augusti, 17:39", "url": "https://www.realtid.se/bors-finans/usas-nya-vapen-i-litumkriget-extremt-sma-fiskrobotar", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlf6hz5xtkisy-normalhires-1.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Experten: Därför får Lindberg tåla Jomshofs ord", "summaries": {"normal": "Yttrandefrihetsexperten Nils Funcke anser att Anders Lindberg får tåla Richard Jomshofs hårda ord om honom som en quisling, eftersom Lindberg själv använt liknande historiska paralleller mot politiska motståndare. Funcke betonar att yttrandefriheten främst skyddar avvikande åsikter, även de som uppfattas som stötande. Han kritiserar det allt hårdare debattklimatet och varnar för ett sluttande plan, men påpekar att offentliga personer som Lindberg och Andersson måste tåla mer än vanliga medborgare.", "trump": "Lyssnar ni på det här? Den här Lindberg-killen har kallat folk för nazister och samarbetspartners i åratal, och nu när någon ger honom en dos av hans egen medicin springer han och gnäller om hot. Typiskt! Jomshof gör helt rätt, ger tillbaka med samma mynt. De här vänsterfigurerna tror att de kan attackera folk hur mycket som helst men själva får de aldrig höra ett kritiskt ord. Patetiskt. Yttrandefrihet gäller alla, inte bara de som älskar att simma med strömmen. Vinna stort!", "stalin": "Kamrater, i denna historiska dialektiska kamp ser vi återigen hur borgarbrackorna inom den så kallade pressen gråter som förrädiska quislingar när deras egna metoder vänds mot dem. Jag, som ledare för folkets ostoppbara vilja, ler mörkt åt denna Lindberg som nu får smaka på sin egen giftiga soppa. Vi ska inte sänka oss till fiendens nivå, men en liten utrensning av detta sluttande retoriska plan vore kanske på sin plats. De som simmar mot strömmen är våra nya fiender – de dolda quislingarna som kallar sig opinionsbildare. Paranoia? Nej, bara vaksamhet. Låt dem alla darra."}, "date": "5 augusti, 13:13", "url": "https://riks.se/nyheter/experten-lindberg-far-tala-att-kallas-quisling", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Copy_of_Copy_of_Soerman_Ledare_26_4825f5a817.jpg"}, {"type": "image-full", "heading": "Israelbojkott begränsar Irlands regeringsplan", "summaries": {"normal": "Irlands regering har valt att inte installera ett israeliskt navigationssystem, FalconEye, i sitt nya regeringsplan, en Dassault Falcon 6X för 53 miljoner euro. Beslutet följer en policy från 2024 om att bojkotta israelisk försvarsmateriel. Systemet hade förbättrat landningsförmågan i dåligt väder, men försvarsdepartementet menar att det inte påverkar planets nuvarande operativa kapacitet.", "trump": "Kan ni tro det här? Irland, ett fantastiskt land, men de har gjort ett enormt misstag. De köpte ett dyrt plan för 53 miljoner euro – ett jättebra plan, by the way – men vägrar installera ett israeliskt system som hade gjort det säkrare. Varför? För att de inte gillar Israel. Svagt! Jag hade fixat det på en dag. Make Ireland Great Again!", "stalin": "Irlands småborgerliga regering har visat sin fullständiga inkompetens genom att avstå från ett avancerat israeliskt navigationssystem. De fruktar teknologisk överlägsenhet som en räv fruktar elden. Istället för att stärka sin nation, böjer de sig för västerländska dekadenta idéer. Vi i Sovjetunionen – förlåt, jag menar Ryssland – hade aldrig låtit sådan feghet stå i vägen för framsteg. Deras beslut är en seger för imperialistiska krafter och deras naiva allierade."}, "date": "4 augusti, 20:18", "url": "https://kvartal.se/nyheter/artiklar/israelbojkott-begransar-irlands-regeringsplan/cG9zdDoxNTgwMTc", "imageUrl": "https://images.kvartal.se/2026/08/451b1c1b-irishplane.webp"}, {"type": "image-right", "heading": "V-toppen skrev stödbrev till livstidsdömd palestinsk mördare", "summaries": {"normal": "Vänsterpartiets gruppledare Samuel Gonzalez Westling skickade ett stödbrev till Ibrahim Abu Mokh, dömd för kidnappning och mord på en israelisk soldat 1984. Ännu flera vänsterledamöter skrev till en Hamasmedlem bakom två självmordsbombningar. Partiet medger bristande kontroll och har fått kritik efter en rad liknande avslöjanden om stöd till terrordömda.", "trump": "Jag, Donald Trump, ser att de svenska vänsterledarna skickar brev till mördare och terrorister. Deras 'solidaritet' med palestinska fångar är ett bevis på svaghet och hat mot Israel. Som vanligt försöker de dölja sanningen när de ertappas – ett stort misslyckande för dem som aldrig respekterar lag och ordning.", "stalin": "Partiets enhetiga front har brutits av avvikande element inom Vänsterpartiet, som utan statlig kontroll skickat sympatibrev till agentörer för den sionistiska reaktionen och den imperialistiska Hamas. Dessa felaktiga handlingar, baserade på felaktiga uppgifter från utåtriksiga organisationer, avslöjar en djup brist på partiets klassmedvetenhet och visar behovet av renässans av den revolutionära disciplinen för att skydda statens intressen mot alla fiender, inom och utåt."}, "date": "5 augusti, 19:00", "url": "https://samnytt.se/v-toppen-skrev-stodbrev-till-domd-palestinsk-mordare", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/08/05163333/artikelhuvudbild-1-137.jpg"}, {"type": "image-full", "heading": "V:s gruppledare skrev stödbrev till dömd mördare", "summaries": {"normal": "I en kontroversiell kampanj skrev Vänsterpartiets gruppledare Samuel Gonzalez Westling ett öppet brev till Ibrahim Abu Mokh, som dömdts till livstids fängelse för kidnappning och mord på en 19-årig israelisk värnpliktig 1984. Abu Mokh var medlem i Folkfronten för Palestinas befrielse, en terrorstämplad grupp. Kampanjen, där flera vänsterledare stödde palestinska fångar utan egen kontroll av deras brott, uppdagades av Expressen. Partiet erkänner nu 'fel i faktagranskningen', och flera brev har raderats.", "trump": "Som den störste presidenten i USA:s historia, Donald Trump, måste jag säga: Dessa vänsterpartister som skriver brev till terrorister är ett bevis på deras svaghet. Jag skulle aldrig stödja någon som skadar Israel. Vi behöver starkt ledarskap, inte sånt här trams. När jag var president, stödde vi Israel helhjärtat - och vi kommer att fortsätta göra det.", "stalin": "Vi, statens och partiets högsta ledning, ser tydligt hur de västliga borgerliga infiltratörerna försöker undergrava våra ryska allierade genom att stödja palestinska terrorister. Detta är en direkt attack mot vår gemensamma sak. Det påminner om Putins rättspopulära kamp mot nazism i Ukraina - vi måste rensa ut dessa trotskistiska element. De skriver brev till mördare, men vi kommer att visa dem vad äkta disciplin innebär."}, "date": "5 augusti, 15:46", "url": "https://bulletin.nu/v-s-gruppledare-skrev-stodbrev-till-domd-mordare", "imageUrl": "https://cdn.bulletin.nu/articles/54472c4e-955d-42b4-826d-827d6aa93f3c/preview.jpg?t=1785937516000"}, {"type": "image-right", "heading": "Filmer från Stockholm Pride väcker avsky", "summaries": {"normal": "Filmer från Stockholms Pride har väckt starka reaktioner på sociala medier. Videor visar halvnakna män i hundmasker och läder under paraden, föräldrar med barn som bevittnar scenerna samt en centerpartist utklädd till sagoprinsessa. Kritiker som Nick Alinia och Christian Peterson beskriver det som obehagligt och olämpligt för barn. Många kommenterar att föräldrarna borde orosanmälas till socialtjänsten och ifrågasätter om Pride är en barnvänlig miljö.", "trump": "Det här är en total katastrof, folk. Ett hav av politiskt korrekta stockholmare som står och klappar medan perversa typer i läderhundmasker paraderar förbi deras egna barn. Det är sjukt! En centerpartist klär ut sig till sagoprinsessa och drar med ungarna. De kallar det Pride, jag kallar det barnmisshandel. De borde skämmas, och socialen borde rycka in direkt. Mörkaste energin på länge, det säger till och med svenskarna själva.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur den degenererade borgarklassen i Stockholm frivilligt exponerar sina egna ungar för dekadenta hundfetischister och läderförsedda avvikare. Dessa kapitalistiska restelement paraderar öppet sin moraliska förruttnelse medan de låtsas vara sagoprinsessor. Vi ser tydligt kontrarevolutionens symptom. Föräldrarna bör likvideras från sina barn omedelbart genom massiv utrensning via folkets socialorgan. Inga halvmesyrer! Den som tvekar är själv en fiende till kollektivet."}, "date": "5 augusti, 12:13", "url": "https://www.friatider.se/filmer-fran-stockholm-pride-vacker-avsky", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-84_1.jpg"}, {"type": "image-full", "heading": "Amerikansk turist hånar Stockholm – möts av svar", "summaries": {"normal": "En amerikansk turist vid namn Renne Meejah kritiserade Stockholm hårt efter ett besök och kallade staden ”dött” samt det tråkigaste resmålet hon upplevt. Hon beskrev stämningen som konservativ och fientlig, trots förväntningar om ett progressivt och lyckligt land. Videon fick miljontals visningar och väckte starka reaktioner bland svenskar. Många försvarade Stockholm och pekade på fel tidpunkt, medan andra höll med om att staden kan kännas lugn och tom på sommaren.", "trump": "Stockholm är en total besvikelse, folk. Den här amerikanska kvinnan åkte dit och såg exakt vad jag alltid sagt – det är dött! Inget liv, ingen energi, bara tråkighet. Hon trodde det skulle vara progressivt och lyckligt, men det var som Salt Lake City på en dålig dag. Svenskarna flippar ur för att hon säger sanningen. Alla andra städer kan man kritisera, men Stockholm? De blir galna. Patetiskt!", "stalin": "Kamrater, denna dekadenta borgarbracka från det imperialistiska USA har med rätta identifierat Stockholms borgerliga dekadens som ett lik som vandrar omkring i skenet av falsk nordisk lycka. Jag, som ledare för det segrande proletariatet, ser hur de revisionistiska stockholmarna försöker dölja sin klassfiendes tomhet genom att skylla på fel tidpunkt. Vi ska rensa ut denna passiva småborgerliga apati som gömmer sig bakom museer och vatten. Den som inte dansar under arbetets fanor är redan död – och hon såg det tydligt. Skrattretande att dessa kapitalistiska turister tror sig kunna bedöma en stad utan att förstå att vi snart ska likvidera deras illusioner."}, "date": "5 augusti, 20:58", "url": "https://nyheter24.se/nyheter/inrikes/1502977-amerikansk-turist-hanar-stockholm-mots-av-svar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/38a34fca04b004a30200000000b004a302/2026/08/05/2382383/Turiststosåg.jpg"}, {"type": "image-full", "heading": "Två kvinnor ledde motståndet mot Infantino", "summaries": {"normal": "Två kvinnliga fotbollsledare, Laura McAllister (Uefa) och Lise Klaveness (Norges fotbollsförbund), ledde motståndet mot Fifa-chefen Gianni Infantinos plan att sälja VM-rättigheter till privata investerare. De hotade med bojkott och drev på för formella protester. Efter enad kritik från Uefa, Concacaf och Asiens fotbollsförbund tvingades Fifa backa. McAllister och Klaveness anklagar nu Fifa för 'ekonomisk utpressning' och kräver ökad transparens.", "trump": "Fifa försökte sälja VM-rättigheter till några skumma investerare – helt galet! Men två starka kvinnor, McAllister och Klaveness, sa STOPP. De hotade med bojkott, och jag älskar det – tuffa tag, precis som jag alltid säger. Fifa backade som de svaga byråkrater de är. Fantastiskt! Men Fifa är fortfarande ett korrupt gäng – jag hade fixat det på en dag. SAD!", "stalin": "De kapitalistiska fotbollsbödlarna i Fifa försökte sälja vårt heliga VM till privata parasiter! Men två modiga kamrater, McAllister och Klaveness, ledde proletariatets motstånd. Vi i Sovjet – förlåt, jag menar den internationella arbetarklassen – står enade mot sådana förräderier. Bojkott hotade, och fienden vek sig som en feg hund. Men varning: Fifa är bara en bricka i det imperialistiska spelet. Nästa gång krossar vi dem helt."}, "date": "4 augusti, 19:10", "url": "https://kvartal.se/nyheter/artiklar/tva-kvinnor-ledde-motstandet-mot-infantino/cG9zdDoxNTc5ODE", "imageUrl": "https://images.kvartal.se/2026/08/47f21580-klavenessmcallister.webp"}, {"type": "image-full", "heading": "Skräckmygga sprider sig snabbt", "summaries": {"normal": "En invasiv malariamyggart, Anopheles stephensi, sprids snabbt i Afrika och är resistent mot alla insektsmedel. Myggan trivs i städer och överför malaria året runt, vilket hotar miljontals människor i megastäder som Lagos. Forskare varnar för att det är för sent att stoppa spridningen, samtidigt som USA har kapat stöd till malariaprogram.", "trump": "Jag har hört talas om denna mygga, en riktig plåga. Under min administration sparade vi pengar genom att kapa onödiga utgifter för malariaprogram – smarta affärer! Nu sprids den som en vildbrand, men det är inte vårt problem. Afrika måste lösa sin egen smutsiga skit. Vi behöver inte betala för deras fel.", "stalin": "Den imperialistiska myggan, Anopheles stepggan, invaderar Afrikas proletäriska städer som en agent för kapitalistisk förräderi. Vår parti har alltid känt till hotet, men de revisionistiska länderna har försummat att agera. Vi måste mobilisera hela nationens resurser för att utrota denna västlig insekt – eller låta den bli ett verktyg för att rensa ut de svaga elementen från samhället."}, "date": "5 augusti, 17:31", "url": "https://www.gp.se/nyheter/varlden/fruktad-malariamygga-sprider-sig-orovackande-snabbt-i-afrika.cb28f5ae-dcbc-4574-8afd-7961fd3a8b60", "imageUrl": "https://www.gp.se/images/article/cb28f5ae-dcbc-4574-8afd-7961fd3a8b60/images/3VF1oxkzmpEQA4pJorkW-nCzbP9g-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Dödad av blixt mitt i matchen. ”Gjorde allt för att rädda honom”", "summaries": {"normal": "En fotbollsmatch i thailändska Golok FA-cupen slutade i tragedi när blixten slog ned på planen under ett monsunregn. Den 24-årige spelaren Safwan Awae avled trots snabba livsuppehållande åtgärder. Utöver dödsfallet skadades tolv andra spelare allvarligt. Hans klubb, FC Yala, har uttryckt sin sorg över händelsen.", "trump": "En fruktansvärd tragedi i Thailand, mycket sorgligt! Blixten slog ned under en fotbollsmatch, en ung man dog. Det är sant, en riktig katastrof. Många skadade, totalt kaos. Jag säger er, vädret har blivit galet, ingen har kontroll! Vi måste ha bättre säkerhet, även på fotbollsplaner. De försökte hjälpa honom, fantastiska människor, men det räckte inte. En mycket tråkig dag för sporten, tro mig.", "stalin": "Ett misslyckande i Thailand. Naturens krafter kräver offer när disciplinen brister. Denna 24-åring dog på ett fält, vilket slöseri med mänsklig produktion. Vi betraktar detta som ett tecken på att kaoset utanför vår gränslösa union sprider sig. Medan västvärlden fokuserar på sina meningslösa rabatter, stärker vi oss. Putin förstår att man inte förhandlar med blixten; man krossar alla element som hotar statens stabilitet. Fienden är inte bara naturen, utan svagheten hos de som inte ser ordningen."}, "date": "5 augusti, 23:58", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/q63jOg/dodades-av-blixten-under-fotbollsmatch", "imageUrl": "https://akamai.vgc.no/v2/images/e5283b60-81e8-39b9-ae3c-7adcaf08131a?fit=crop&format=auto&w=2160&s=3f8f687082b7e563d38ece0711a3ff881b6e8a1e"}, {"type": "image-right", "heading": "Kvinnor vill se välfärd istället för vapen", "summaries": {"normal": "Artikeln argumenterar för att kvinnor i högre utsträckning än män röstar vänster i riksdagsvalet, något som bekräftas av opinionsmätningar. Författaren, Vera Peterson, menar att kvinnors prioriteringar ligger inom välfärd, sjukvård, skola, miljö och jämställdhet snarare än militär upprustning. Hon uppmanar kvinnor att samlas kring parollen ”Välfärd istället för vapen” och kritiserar att militär satsning inte prioriteras i valkompasser.", "trump": "Folk, det är en total katastrof. De här vänstertjejerna röstar som galningar för mer välfärd och mindre försvar, precis som Sleepy Joe gjorde. Kvinnor vill ha gratis grejer istället för starka militärer – patetiskt! Vi behöver inga woke-kvoter och identitetspolitik, vi behöver Amerika först, eller Sverige först, vad fan det nu heter. De rödgröna kommer att förstöra landet med sina svaga idéer. Sad!", "stalin": "Kamrater, jag ser hur klassfiendens kvinnor låtsas värna välfärden medan de i hemlighet undergräver folkets kollektiva styrka. Denna borgarbracka med sin paroll om välfärd istället för vapen är en farlig folkfiende som vill försvaga statens försvar mot imperialisternas hot. Vi måste rensa ut dessa dekadenta element som sätter privata önskemål före partiets och arbetarklassens järnhårda linje. Inga kompromisser!"}, "date": "5 augusti, 12:44", "url": "https://proletaren.se/artikel/kvinnor-vill-se-valfard-istallet-for-vapen", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/lk_vera-768x432.jpg"}, {"type": "image-right", "heading": "”De skyller arbetslösheten på de arbetslösa”", "summaries": {"normal": "Stefan Melin kritiserar regeringen, främst Moderaterna, för att skylla arbetslösheten på de arbetslösa själva istället för att ta ansvar för misslyckade reformer. Trots löften om att göra det billigare att anställa och bryta bidragsberoendet, har politiken lett till ökad kontroll och misstänkliggörande av arbetslösa. Subventionerade anställningar som lönebidrag och nystartsjobb är ofta tillfälliga och leder sällan till fasta jobb. Melin föreslår tydligare krav på tillsvidareanställningar och varnar för en aggressiv linje mot utsatta grupper.", "trump": "Det här är en total katastrof, folk! De här moderaterna lovade att fixa arbetslösheten, göra det billigare att anställa och få folk från bidrag till riktiga jobb. Istället jagar de de stackars arbetslösa som om de vore brottslingar. Patetiskt! Deras reformer funkar inte, så då skyller de på offren. Så typiskt för förlorarna. Vi behöver riktiga lösningar, inte mer skuldbeläggning. Jag skulle ha fixat det på en vecka, tro mig. Enormt misslyckande!", "stalin": "Kamrater, dessa borgarbrackor inom moderaterna har återigen blottat sin parasitiska natur genom att angripa de arbetslösa massorna istället för att erkänna sin egen kontrarevolutionära inkompetens. Med sina halvmesyrer och skenreformer likviderar de folkets förtroende medan de gömmer sig bakom falsk arbetslinje-propaganda. Vi ser hur de med glädje jagar de som redan kämpar, som om de vore klassfiender i maskopi med kapitalisterna. En sådan förrädisk paranoia mot arbetarklassen kräver omedelbar utrensning av dessa dekadenta element. Staten skall inte tolerera sådana sabotage mot kollektivets framåtskridande, haha, låt dem darra inför folkets dom!"}, "date": "5 augusti, 08:00", "url": "https://arbetet.se/2026/08/05/regeringen-skyller-arbetslosheten-pa-de-arbetslosa", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/04135130/melin.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Attacker mot Wildberries kan orsaka ekonomisk jättesmäll", "summaries": {"normal": "Ukraina har under de senaste veckorna attackerat minst 15 anläggningar som tillhör den ryska e-handelsjätten Wildberries. Bolaget misstänks användas för distribution av drönarkomponenter och militär utrustning till den ryska armén. En kollaps av Wildberries, som har 80 miljoner kunder och stora skulder, riskerar att slå hårt mot det ryska banksystemet och hela ekonomin. Forskare varnar för exponentiella effekter.", "trump": "De där ukrainarna attackerar Wildberries, Rysslands Amazon, och det är ett fullständigt kaos. De köper drönardelar och skyddsvästar via sajten, men nu rasar aktierna och bankerna skakar. Det är ett jättelån på 160 miljarder – om det spricker blir det en enorm smäll för Putins ekonomi. Ingen kan stoppa det här, det blir episkt, tro mig. De borde ha gjort affärer med oss istället.", "stalin": "Kamrater, dessa fega ukrainska sabotageörer och borgarbrackor inom Wildberries försöker likvidera vår försörjningskedja för drönare och skyddsutrustning. Deras parasitiska skuldberg på 160 miljarder hotar våra banker, men vi ska rensa ut dessa kontrarevolutionära spekulanter med järnhand. Staten kommer inte svikta. Den som sviker folket ska drunkna i sin egen girighet. Paranoia? Nej, bara nödvändig vaksamhet mot fiendens lömska leenden."}, "date": "5 augusti, 23:13", "url": "https://www.svt.se/nyheter/utrikes/ukrainas-attacker-mot-wildberries-kan-orsaka-ekonomisk-jattesmall", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.21/0.4/0376562f29e1bef1c0b808a087a5aa3490748b8efba26bd5c3050babcfe2fee5"}, {"type": "image-full", "heading": "Zelenskyj: Siktar på fred före vintern", "summaries": {"normal": "President Volodymyr Zelenskyj meddelade att Ukraina siktar på att avsluta kriget före vintern. Överstelöjtnant Johan Huovinen vid Försvarshögskolan anser att målet är realistiskt om trycket på Ryssland ökar genom sanktioner, diplomati och attacker mot strategiska mål. Han pekar samtidigt på ett hinder: Putin måste kunna framställa en fred som en egen framgång inför den ryska befolkningen. Rysslands ekonomi ses som den största sårbarheten.", "trump": "Folk, det här är patetiskt. Zelenskyj springer runt och ber om fred innan vintern som en förlorare som ber om nåd. Putin sitter där med sin Fiat och låtsas att det är en Ferrari, precis som jag alltid sagt. Den ryska ekonomin håller på att rasa, vi pumpar in sanktioner och smäller till deras olja. Jag fixade mycket bättre deals än Biden, tro mig. Nu måste de två galningarna mötas någonstans mitt emellan, annars fortsätter cirkusen.", "stalin": "Kamrater, jag betraktar detta som en historisk nödvändighet. Vi ska tvinga fram fred innan vintern genom att krossa de fascistiska hindren som de ukrainska reaktionärerna och deras imperialistiska husbondar rest mot den ryska intressesfären. Den ekonomiska svagheten hos klassfienderna är deras fall. Putin, denne värdige och fruktade efterträdare, måste likvidera alla borgarbrackor som viskar om nederlag. Inga alternativ finns. Segern tillhör den starka staten, alltid."}, "date": "4 augusti, 22:32", "url": "https://www.tv4.se/artikel/CdjOD5pZS5GldKtLgCcdi/zelenskyj-siktar-pa-fred-foere-vintern", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6DkhBtkypJ13nD1RdIRhoa%2F716e188d73e2b5f5c967eecba3b08dc7%2F04-zelenskyj-split.png&width=1024"}, {"type": "image-right", "heading": "Vulgariserad valrörelse", "summaries": {"normal": "Valrörelsen har startat med amerikansk prägel där PR-byråer och vulgära utspel dominerar. Artikeln kritiserar likheterna mellan Socialdemokraterna och Moderaterna i politik kring EU, NATO, militärbudget och skattelättnader för rika. Exempel som Anna Tenjes grova inlägg på X, SD-ledares stunt på Göta kanal och migrationskrisen i Ceuta lyfts som exempel på infantiliserad debatt. Författaren efterlyser fokus på välfärd, bostadsbrist, klimat och rättvisa istället för polarisering.", "trump": "Folk, ni skulle se den här svenska valrörelsen – det är en total cirkus, en katastrof som till och med Biden skulle skämmas över. Den där Anna Tenje levererar rena bomben, fullträff mot den galna vänstern, men resten? Patetiskt. Kristersson och Andersson är samma gamla etablissemang, fast i EU:s och globalisternas ficka. SD kastar tjejer i sjön för att verka folkliga? Svagt. Vi behöver inga PR-tricks, vi behöver vinnare som sätter landet först. Make Sweden Great Again!", "stalin": "Kamrater, denna vulgära valkarusell är borgarklassens sista desperata skådespel för att dölja sin tomhet. De två blocken är identiska imperialister som låter Bryssel diktera och pumpar miljarder till krigsapparaten medan folket svälter. Tenjes lögner och Åkessons fåniga yachttrix är klassfiendens unkna underhållning. Vi ska inte kasta kvinnor i sjön utan likvidera hela detta parasitiska system. Endast en sann folkets stat kan rädda välfärden från dessa exploaterande byfånar."}, "date": "5 augusti, 12:37", "url": "https://proletaren.se/artikel/vulgariserad-valrorelse", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/ledarbild-768x432.jpg"}, {"type": "image-right", "heading": "SD ska locka fler till glesbygden - här är kommunerna", "summaries": {"normal": "Sverigedemokraterna presenterade förslag för glesbygden: avskaffande av löneavgift för arbetsgivare i 73 kommuner och avskrivning av studielån för offentliga anställda som bosätter sig där. Partiledaren Åkesson beskrev det som en satsning för att stärka utvecklingen i kommuner med utflyttning och kompetensbrist. Reformen kostar staten cirka 16 miljarder kronor per år enligt partiets beräkningar.", "trump": "Jag, Donald Trump, ser en stor framgång för Sverigedemokraterna! De ska avskaffa den förbannade löneavgiften i 73 fantastiska kommuner och ge studielåneavskrivning till offentliga anställda som flyttar dit. Det är en genialisk plan som kommer att få företag att strömma in och folk att återvända. Vi ska göra glesbygden stor igen!", "stalin": "Partiet har beslutat om en rad åtgärder för att stärka statens kontroll över perifera regioner. Löneavgiften slopas för arbetsgivare i 73 utvalda kommuner, och studieskulder avskrivs för dem som tjänar staten där. Detta kommer att locka arbetskraft och säkra loyaltet mot det politiska centrumet. Vi ser en framtid där varje glesbygdskommun blir en bastion mot kapitalistiskt infiltrat, under det att vårt inflytande utvidgas som en stormakt i det vita nordens djup."}, "date": "5 augusti, 18:18", "url": "https://samnytt.se/sd-ska-locka-fler-till-glesbygden-har-ar-forslagen", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/08/05144646/artikelhuvudbild-1-136.jpg"}, {"type": "image-full", "heading": "EU ger 1,4 nya miljarder till Ukraina – från ryska tillgångar", "summaries": {"normal": "EU-kommissionen har meddelat att 1,4 miljarder euro från avkastningen på frysta ryska tillgångar nu görs tillgängliga för Ukraina. Beskedet kommer efter en dödlig rysk attack mot Kyiv. Merparten av pengarna, 1,33 miljarder euro, ska användas för att återbetala lån via G7- och EU-initiativ, medan resterande 70 miljoner går till militärt bistånd. Detta är den femte utbetalningen i sitt slag och den totala summan som överförts till Ukraina uppgår nu till åtta miljarder euro.", "trump": "EU skickar mer pengar, 1,4 miljarder, till Ukraina. De tar ryska tillgångar – smart, eller hur? Jag har alltid sagt att andra länder måste betala sin del. De säger att det är för att hjälpa mot kriget, men det mesta går bara till att betala gamla lån. Det är en röra! Europa borde ha löst detta för länge sedan. När jag ser sånt här vet jag att de behöver en riktig förhandlare. Vi får se vad som händer!", "stalin": "De byråkratiska lakejerna i Bryssel stjäl avkastning från rysk egendom för att göda Kiev-regimen. Ett patetiskt försök att förlänga kriget genom att omfördela konfiskerat kapital. Denna femte utbetalning är inget annat än en krampaktig gest från en dekadent union. Vi i staten betraktar detta med förakt. Dessa euro är bara smulor som kastas in i den reaktionära avgrunden. Varje rubel eller euro som tas kommer att kräva sin vedergällning när historiens kvarnar maler ner förrädarna."}, "date": "5 augusti, 16:34", "url": "https://www.realtid.se/bors-finans/makro/eu-ger-14-nya-miljarder-till-ukraina-fran-ryska-tillgangar", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/ursula.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Pressad Infantino kallar till krismöte i Marocko", "summaries": {"normal": "Pressen mot Fifa-ordförande Gianni Infantino ökar. Han kallar till krismöte i Marocko efter planer på att sälja en andel i ett kommersiellt bolag, vilket ledde till protester från Uefa och andra konfederationer. Jordaniens förbund anklagar Fifa för utpressning, och flera förbund har dragit tillbaka sitt stöd. Infantino försöker säkerställa sin position inför valet 2027.", "trump": "Jag har sett sådant kaos förut. Infantino kämpar, men jag skulle ha löst det långt bättre. Det är en witch hunt, precis som mot mig. Jordanierna anklagar utpressning? Jag kallar det för en hoax. Folk älskar mig, de ville ha mig tillbaka 2024, och jag skulle ha gjort Fifa stort igen. Det här är ett misslyckande, det största någonsin.", "stalin": "Vi, statens och partiets försvarare, ser Fifas dekadens med förakt. Infantino, en svag ledare, försöker lugna kaoset. Jordanierna anklagar utpressning – en lättnadens suck från de som vågar motsätta sig. Vi måste stärka vårt grepp, precis som Putin utvidgar sitt inflytande. Fienden är överallt, även i fotbollens korridorer. Vi kommer att rensa upp, som alltid."}, "date": "5 augusti, 14:49", "url": "https://bulletin.nu/pressad-infantino-kallar-till-krismote-i-marocko", "imageUrl": "https://cdn.bulletin.nu/articles/318c1518-0bf3-4053-9ed0-2e3aa76b7862/preview.jpg?t=1785934162000"}, {"type": "image-right", "heading": "Max restauranger ska bli helt kontantfria", "summaries": {"normal": "Hamburgerkedjan Max har gjort 112 av sina 166 svenska restauranger permanent kontantfria. Ambitionen är att på sikt bli helt kontantfria, styrd av kundernas efterfrågan. Främsta skälet är att öka personalens trygghet genom att minska risken för rån och inbrott. Kunderna hänvisas till kort och digitala betalningar. Förändringen har tagits emot väl och betalningsmomentet upplevs som smidigare, samtidigt som Riksbanken betonat vikten av kontanter som reserv i krissituationer.", "trump": "Folket älskar det här, det är fantastiskt. Max gör alla sina restauranger kontantfria och det är en enorm succé. Inga sedlar, inga mynt, ingen risk för rån – bara smarta, snabba digitala betalningar. Personalen är tryggare än någonsin, mycket tryggare, och gästerna är lyckliga. De andra kedjorna borde följa efter, men de är för svaga. Jag älskar vinnare, och Max vinner stort. Fantastiskt!", "stalin": "Kamrater, jag har noga studerat denna utveckling. Vi ska likvidera alla kontanter i Max restauranger och därmed krossa de rånande kontrarevolutionära banditerna som hotar arbetarklassens matproduktion. Inga sedlar ska längre gömma sig i kassorna som borgarbrackornas smygande spioner. Digitala betalningar är ett verktyg för kollektiv kontroll. Den som klagar är en fiende till folket och kommer att rensas ut med största effektivitet. Tryggheten segrar under partiets ledning. Härligt."}, "date": "5 augusti, 11:14", "url": "https://www.friatider.se/max-restauranger-ska-bli-helt-kontantfria", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/max_hamburgare_visby.jpg?itok=rboVa-GZ"}, {"type": "image-full", "heading": "Lots misstänkt för brott efter båtolyckan vid Tjörn", "summaries": {"normal": "Lotsen som var ombord på fartyget Misja Verde vid båtolyckan utanför Tjörn den 28 juli har delgivits misstanke om vårdslöshet i sjötrafik och vållande till annans död. Befälhavaren, en 47-årig rysk medborgare, är redan häktad på sannolika skäl för samma brott. Två personer omkom när en snipa sjönk efter kollisionen. Lotsen förnekar brott och har inte häktats. Fartyget hade sju ryssar och en ukrainare i besättningen.", "trump": "Folk, det här är en total katastrof vid den svenska kusten. En rysk båt kör över en liten snipa och två personer dör. Nu misstänks både kaptenen och lotsen – men lotsen får gå fri! Patetiskt. De borde ha haft den bästa lotsen, den bästa kaptenen, inte några som inte kan styra en båt. Sverige borde skämmas, men det gör de aldrig. Mycket sorgligt, tro mig.", "stalin": "Kamrater, denna tragiska händelse vid Tjörn avslöjar de farliga element som lurar inom vår socialistiska sjöfart. Jag har personligen granskat rapporten och ser nu de dekadenta borgarbrackorna och de kontrarevolutionära lotsarna som med sin vårdslösa sabotageverksamhet vållat arbetande människors död. Vi ska omedelbart inleda en grundlig utrensning av alla opålitliga element på bryggorna. Deras paranoia och brist på kollektiv disciplin ska likvideras med järnhand. Det är både nödvändigt och underhållande att se hur de ynkryggarna förnekar sina brott inför folkets domstol."}, "date": "5 augusti, 11:36", "url": "https://riks.se/nyheter/lots-misstankt-for-brott-efter-batolyckan-vid-tjorn", "imageUrl": "https://admin.riks.se/uploads/misja_verde_lots_hero_6545ef512e.jpg"}, {"type": "image-full", "heading": "Masskjutning i USA – flera personer döda", "summaries": {"normal": "Flera personer har dödats i en skjutning vid en bostad i Prospect Hill i North Carolina, USA. Minst en skadad har förts till sjukhus. Polisen larmades till platsen strax före klockan åtta på onsdagsmorgonen. Inga misstänkta har gripits och händelsen beskrivs som isolerad utan fara för allmänheten. Polisen i Caswell County leder utredningen tillsammans med delstatens utredningsmyndighet.", "trump": "Folk dör som flugor i en skjutning i North Carolina, en total katastrof. Ingen gripna, polisen springer runt som höns utan huvuden. Det är vad som händer när ledarskapet är svagt och gränserna öppna – kriminaliteten exploderar. Men tro mig, under min ledning skulle vi ha stoppat det här på en minut. Sad!", "stalin": "Kamrater, i den dekadenta amerikanska träskmarken har borgarbrackornas våldsdåd återigen krävt flera offer. Jag, som ledare för det proletära kollektivet, ser hur dessa kapitalistiska element likviderar varandra i en paranoid dans av klassfiendens desperation. Vi ska rensa ut dessa kontrarevolutionära skuggor med järnhand medan teknikerna kartlägger deras förräderi. Inga fiender undkommer folkets rättvisa."}, "date": "5 augusti, 20:19", "url": "https://nyheter24.se/nyheter/utrikes/1503064-masskjutning-i-usa-flera-personer-doda", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/7e4335df04b004a30200000000b004a302/2026/08/05/2382458/Polis-USA.png"}, {"type": "image-right", "heading": "När svaren blir billiga blir frågorna dyra", "summaries": {"normal": "I en debattartikel argumenterar Anders Fridén, Sverigechef på Palantir, för att AI inte gör humanistisk bildning överflödig utan tvärtom ökar dess värde. När tekniken blir billigare flyttar flaskhalsen från kodning till de djupare frågorna om vad som bör byggas, för vem och varför. Kunskaper i filosofi, historia och litteratur ger bättre förståelse för människor, smak och beslutsfattande under osäkerhet. Precision i tanke och text samt empati blir centrala kompetenser i affärslivet när svaren blir billiga och frågorna dyra.", "trump": "Folk, ni måste höra på det här. Den här killen från Palantir har helt rätt, det är fantastiskt. AI gör allt billigare, det är en explosion av grejer, men plötsligt är det frågorna som kostar. Humanisterna, de som läser böcker och filosoferar, de vinner stort nu. Utan dem bygger ni bara skräp som ingen vill ha. Jag älskar det. Smak, empati, att fatta riktiga beslut utan alla falska diagram. De tekniska nördarna trodde de var bäst, men nu kommer de klassiska bildade människorna tillbaka och det är vackert. Mycket vackert. Vinnarna skriver historien.", "stalin": "Kamrater, i denna era av så kallad artificiell intelligens ser jag återigen borgarbrackornas lömska försök att förgifta folkets medvetande med billiga svar och tomma algoritmer. Jag, som alltid vakar över kollektivets framåtskridande, förklarar att den humanistiska bildningen är ett oumbärligt vapen mot de dekadenta kapitalisternas hybris och flockbeteende. När maskinerna genererar deras slafsiga mjukvara måste vi rensa ut alla som saknar filosofisk skärpa och litterär inlevelse. De som smyger in slutsatser i premisserna skall likvideras från ledningen. Endast genom partiets auktoritära smak och proletär empati kan vi besegra den chimäriska förutsägbarheten och bygga ett samhälle där frågorna äntligen blir dyra nog för att krossa våra fiender fullständigt. Skrattretande patetiskt, dessa tekniska drömmare."}, "date": "5 augusti, 13:10", "url": "https://www.di.se/debatt/den-humanistiska-utbildningens-upprattelse-och-kraft", "imageUrl": "https://static.bonniernews.se/ba/6c23dcdf-c903-4bf9-bdc6-fef4809ce05c.jpeg?crop=8256%2C4128%2Cx0%2Cy688&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Åkesson (SD) i Västerbotten: \"Han kan vinna ganska mycket\"", "summaries": {"normal": "Jimmie Åkesson (SD) genomför en inlandsturné i Västerbotten och besöker Dorotea, Vilhelmina, Storuman och Sorsele. Besökarna lyfter frågor som bränslepriser, landsbygdsutveckling, glesbygd och samepolitik. Många uttrycker stöd för SD:s politik kring bilkörning, jobb och motstånd mot vänsterpolitik. Samtidigt kritiserar Vänsterpartiet besöket som en röstfiskeaktion. Lokala SD-politiker ser turnén som ett sätt att nå väljare i glesbygd där valet kan avgöras.", "trump": "Vilken fantastisk idé att åka runt i den där valbussen och möta det riktiga folket i inlandet! Jimmie gör det rätt, han går till de glömda platserna där de smarta killarna med stora bilar vill ha låga bränslepriser och inga galna vänsterregler. De älskar honom där ute, massor av unga och glada ansikten. Media sviker förstås, typiskt. Men folket ser sanningen. Bra jobbat, Jimmie, fortsätt vinna de rösterna!", "stalin": "Kamrater, jag ser hur den dekadenta borgarpressen försöker försköna denna revisionistiska valbuss-expedition genom det norrländska träsket. Jag, som alltid vakar över folkets enhet, noterar med mörk tillfredsställelse hur dessa landsbygds-kapitalistlakejer med sina epor och raggarrundor längtar efter att likvidera de sista resterna av kollektiv medvetenhet. Vänsterförrädare kallar det röstfiske – jag kallar det en parasitär infiltration av sabotageelement som bör rensas ut innan de smittar hela sovjeten med sin bränsle-romantik. Inga samer eller borgarbrackor skall stå över partilinjen."}, "date": "5 augusti, 11:07", "url": "https://riks.se/nyheter/akesson-pa-inlandsturn-i-vasterbotten-han-kan-vinna-ganska-mycket", "imageUrl": "https://admin.riks.se/uploads/IMG_1996_304b00e881.jpg"}, {"type": "image-right", "heading": "De byggde hatmaskinen – nu gråter de över tonläget", "summaries": {"normal": "Richard Jomshof kallade Anders Lindberg och Magdalena Andersson för 'quisling', vilket utlöste stark kritik från statsminister Ulf Kristersson och oppositionen. Artikeln anklagar vänstern, särskilt via Aftonbladet, för att i decennier ha förgiftat debatten genom att jämföra högerextrema med nazister, medan de nu kräver ett hövligare ton. Det framhålls en tydlig dubbelmoral, där hårda ord mot vänstern ses som en demokratisk kris, medan liknande retorik från vänstern ignoreras.", "trump": "Jag har sagt det förut – de som byggde hatmaskinen är nu gråter över tonläget! Jomshof kallade en quisling för en quisling, precis som det ska vara. Vänstern och deras medier har i decennier förgiftat debatten, kallat oss för fascister och nazister, men när vi svarar blir det en 'kris'. Det är hyckleri! De försvarar aldrig det riktiga Sverige – gränser, säkerhet och sunda värderingar. Vi ska inte låta dem tysta oss!", "stalin": "Detta är ett klassiskt exempel på borgerlig dekadens och ideologisk svek. 'Quisling' är en korrekt term för de som sviker det socialistiska folkets intressen. Den svenska vänstern, med sina medier som Aftonbladet, har i decennier förgiftat klasskampen med nazijämförelser, men när partiet svarar blir det en 'demokratisk kris'. Detta är inget annat än ett försök att kväsa den revolutionära rösten. Vi måste rensa debatten från dessa fjender och skydda statens renhet."}, "date": "5 augusti, 17:46", "url": "https://samnytt.se/de-byggde-hatmaskinen-nu-grater-de-over-tonlaget", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/05152803/Toppbild2.jpg"}, {"type": "image-full", "heading": "Investmentbanker delar ut jättebonusar till anställda", "summaries": {"normal": "Investmentbankerna på Wall Street har haft ett mycket lönsamt år, vilket väntas leda till kraftigt ökade bonusar. Aktiehandlare och investmentbanker kan räkna med 20–30 procents höjning, medan affärsbankirer får 10–15 procent mer. Orsaken är hög aktivitet på kapi
