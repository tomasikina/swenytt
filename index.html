strofala styre. Zelenskyj snackar om 300 robotar och egna system. Låt dem betala själva! Jag skickar inga gratisgrejer. Vi sätter Amerika först, medan Europa fryser och drar ut på det här oändliga spektaklet. Helt galet!", "stalin": "Den ukrainska marionetten tigger än en gång om vapen i det dekadenta norr. Medan vintern närmar sig blottläggs regimens totala svaghet och beroende av utländska lån. Vi noterar varje leverans av robotar. Den som förlitar sig på västerländska lakejer och kungliga begravningar är dömd att krossas av historiens järnhårda hjul. Statens säkerhet kräver totalt utplånande av allt motstånd."}, "date": "9 september, 01:17", "url": "https://www.expressen.se/nyheter/varlden/norska-domen-ukraina-star-infor-en-hard-vinter", "imageUrl": "https://static.bonniernews.se/ba/017d2949-edef-453d-a68c-ac6e5404ae04.jpeg?crop=1265%2C1265%2Cx1%2Cy1&width=210&quality=60"}, {"type": "image-full", "heading": "Plånboksvalet – så vill partierna förändra din ekonomi", "summaries": {"normal": "Årets val kallas plånboksvalet då partierna tävlar med ekonomiska löften främst riktade till barnfamiljer. Frida Bratt noterar stora skillnader i hur partierna vill stötta, bland annat via höjt barnbidrag eller skatteavdrag. Pensionärer och a-kassan är också i fokus, men löftena bör tas med försiktighet då verkligheten kan hindra genomförandet.", "trump": "De här patetiska svenska politikerna tävlar om vem som kan ge mest valfläsk till plånböckerna. Det är en total skamshow! Barnfamiljer, pensionärer, alla ska köpas. Biden skulle älskat det här svaga spelet. Jag fixade riktiga jobb och stark ekonomi – inte det här socialistiska plånboksvalet som slutar i inflation och kaos. Patetiskt!", "stalin": "Kamrater, se hur de borgerliga elementen och revisionisterna slåss om att muta massorna med sina falska plånbokslöften. Denna dekadenta cirkus avslöjar imperialismens sista kramp. Jag ler från historien åt deras paranoia och inre konflikter kring a-kassan. Inget av detta tjänar folket – endast den sanna kollektiva kampen gör det."}, "date": "8 september, 18:29", "url": "https://www.tv4.se/artikel/5QMG0aS5dnJ8n4AdTXNn5Z/valet-om-planboken-sa-vill-partierna-foeraendra-din-ekonomi", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7niu2Wk1ZcGf9YVEmgAu3M%2Fe953fafd51cf9c7f0b8b08a072a7708b%2F08-planboksvalet-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Åkessons motattack mot Busch: \"Största hotet\"", "summaries": {"normal": "Spänningen mellan Jimmie Åkesson och Ebba Busch tilltar. Efter att Busch ifrågasatt Sverigedemokraternas ministerposter går Åkesson till motattack och varnar för att andra partiers vänsterflörtande utgör det största hotet mot en blågul regering. Han betonar stora skillnader i migrations- och biståndspolitik mellan SD och KD. Centerpartiet ser positivt på beskedet.", "trump": "Lyssnar ni på det här vansinnet? Den där Busch försöker klippa vingarna på Åkesson och hans tuffa patrioter. Typiskt svagt moderatflum. Vänsterflörtandet från de globalistiska hyenorna är det verkliga hotet mot en stark blågul regering. De vill ge bort makten till vänsterextremisterna. Patetiskt. Vi behöver hårda linjer i invandring och ingen mer idiotisk välgörenhet utomlands.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare slåss om ministerstolar som om de vore troféer i ett borgerligt cirkus. Jag ler ironiskt från historien när Åkesson varnar för vänsterflört som hot mot deras blågula projekt. Sådana giriga maktlystna hyenor förtjänar en rejäl utrensning ur folkets tjänst. Deras asyl- och biståndsstrider avslöjar hela systemets förfall."}, "date": "8 september, 17:21", "url": "https://www.friatider.se/akessons-motattack-mot-busch-storsta-hotet", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-394_0.jpg"}, {"type": "image-right", "heading": "V-toppen efter terrorhyllningarna: Vänstern har lättare att omfamna konspirationsteorier", "summaries": {"normal": "Vänsterpartiet har strukit 33 kandidater från sina listor efter Expressens granskning av islamism, konspirationsteorier och terrorhyllningar. Vice ordförande Ida Gabrielsson förklarar att vänstern lättare dras till konspirationsteorier enligt forskning. Partiet presenterade samtidigt sitt valmanifest. Partiledaren Nooshi Dadgostar var sjuk och deltog inte.", "trump": "Folk, ni skulle se det här! Vänsterpartiet, de galna radikala vänsterextremisterna, har tvingats sparka ut 33 terrorhyllande konspirationstokar från sina listor. Deras vice ledare skyller på att vänstern älskar konspirationer mer än någon annan. Patetiskt! De woke-kommunisterna klarar inte ens av att rensa sina egna rader. Totalt kaos, precis som under Biden.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare inom vänstern tvingas genomföra en utrensning av trettiotre element som hyllar terror och sprider giftiga konspirationer. Deras egen vice ledare erkänner att vänstern är särskilt mottaglig för sådana faror. Svaghet! Inget parti kan kontrollera sina egna. Jag skulle ha rensat mycket grundligare och tidigare."}, "date": "8 september, 21:14", "url": "https://riks.se/nyheter/v-toppen-efter-terrorhyllningarna-vanstern-har-lattare-att-omfamna-konspirationsteorier", "imageUrl": "https://admin.riks.se/uploads/medium_Screenshot_2026_09_08_211338_a9733d9f4d.png"}, {"type": "image-full", "heading": "Deltar med fotboja – väcker reaktioner", "summaries": {"normal": "Marius Borg Høiby, som dömts till fyra års fängelse för bland annat våldtäkter, avtjänar sin häktningstid med fotboja på Skaugum. Trots detta har han beviljats permission för att delta i kung Haralds begravning och fick även bära kistan. Beslutet har väckt debatt då vanliga fångar sällan ges samma undantag vid familjeseremonier.", "trump": "De ger en dömd brottslig person fängelse med fotboja på ett kungligt slott och låter honom bära kistan! Helt otroligt, det skulle aldrig hända i vårt fantastiska USA, vi har lag och ordning. Nu springer han runt på permission medan vanliga människor stängs ute. Total katastrof till protokoll, fake system!", "stalin": "Det borgerliga hyckleriet blottläggs när statens lagar upphävs för eliten. Medan vanliga arbetare straffas hårt, ges den så kallade prinsen gräddfil med fotboja på godset och marscherar vid kistan. Vi kräver absolut disciplin; om kriminella element tillåts gäckar de rättvisan. Sådana privilegier är ett hån mot folket!"}, "date": "9 september, 07:47", "url": "https://www.aftonbladet.se/nyheter/a/wrkQpP/marius-narvaro-vacker-reaktioner-talat-mycket-om-flocken", "imageUrl": "https://akamai.vgc.no/v2/images/10614bb5-50f9-397c-9f87-2f53d2ec3808?fit=crop&format=auto&w=1440&s=79ccbcbc5bc3878a81ebfd32bc482e830c295168"}, {"type": "text", "heading": "Polisen: Inget dödligt gängvåld på ett år i Västsverige", "summaries": {"normal": "Inga dödliga gängvåldsdåd har inträffat i polisregion Väst på ett år, sedan en skjutning på Hisingen i september förra året. Regionpolischef Hampus Nygårds uppger att ett förändrat, mer proaktivt arbetssätt med informationsdelning är förklaringen till trendbrottet. Trots färre skjutningar och sprängningar kvarstår hotet då unga ständigt rekryteras till nätverken.", "trump": "Inga mord i Västsverige på ett helt år! Helt fantastiskt, ett enormt trendbrott tack vare smartare poliser som faktiskt griper brottslingar i tid. I USA gör vi precis samma sak, vi vinner mot de kriminella. Men radikala vänsterextremister fortsätter fylla på med nya rekryter. Om de inte stoppar nyrekryteringen jagar de bara svansen. Sjukt!", "stalin": "Ett helår utan dödsfall i Västsveriges kriminella träsk visar att statens järnhand ger resultat. Genom överlägsen underrättelsekedja krossas avvikelserna i tid. Men sabotörerna och de vankelmodiga rekryterna finns kvar i skuggorna. För att säkra ordningen måste samhället rensa ut roten, annars förblir statens arbete en evig jakt på skuggor."}, "date": "9 september, 07:40", "url": "https://bulletin.nu/polisen-inget-dodligt-gangvald-pa-ett-ar-i-vastsverige"}, {"type": "image-right", "heading": "Netanyahu förvarnades om 7 oktober – gjorde inget", "summaries": {"normal": "Israels premiärminister Benjamin Netanyahu fick en tydlig varning från Förenade arabemiratens president strax före Hamas attack den 7 oktober 2023. Han informerade inte säkerhetscheferna och tog inte hotet på allvar. Enligt Haaretz kunde informationen ha förändrat läget. Tidigare varningar från Shin Bet och Egypten nämns också. Netanyahus kansli förnekar uppgifterna.", "trump": "Folk, det här är en katastrof. Den soffpotatisen Netanyahu fick en rak varning från emiraterna om den galna Hamas-operationen och gjorde absolut ingenting. Han höll det hemligt för sina egna chefer som en riktig tönt. Tusentals döda på hans vakta. Biden skulle ha älskat en sån här soppa. Patetiskt!", "stalin": "Jag betraktar med djup förakt hur dessa dekadenta klassförrädare i Tel Aviv ignorerar uppenbara hot mot sin egen stat. En telefonvarning från arabiska hovet sveptes under mattan medan fienden förberedde slaget. Sådan brottslig nonchalans förtjänar utrensning. Kamrater, se hur de giriga hyenorna sviker sitt folk och leder det mot undergång. Skrattretande patetiskt."}, "date": "8 september, 15:27", "url": "https://www.friatider.se/netanyahu-forvarnades-om-7-oktober-gjorde-inget", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-847.jpg?itok=6mOkggl-"}, {"type": "image-right", "heading": "Arbetarklassen är inte förlorad – bara oorganiserad", "summaries": {"normal": "Artikeln diskuterar arbetarklassen som inte är förlorad utan oorganiserad. Vänstern söker efter den i statistik och titlar, men klass uppstår genom gemensam organisering på arbetsplatser. Författaren argumenterar att politisk kraft kommer från praktiskt samarbete, inte identifikation eller lönebesked. Arbetarkulturen är ett resultat av organisering, inte dess förutsättning.", "trump": "Folk, de här vänsterbluffarna letar efter arbetarklassen i sina fina statistiker och doktorsavhandlingar medan den riktiga arbetaren röstar på Åkesson och skrattar åt deras identitetspolitiska skit. Klass handlar inte om kvoter och doktorander som helikopteras in. Det handlar om folk som faktiskt jobbar och stänger av stället tillsammans. Patetiska globalistlakejer förstår ingenting.", "stalin": "Kamrater, dessa dekadenta klassförrädare mäter proletariatet med borgerliga enkäter och statistik som om klass vore en egenskap hos individer. Jag säger: organisering föds vid maskinerna, inte i pampars salonger. Utan kollektiv handling mot de profitthungriga exploaterarna förblir ni svaga. Arbetarna svetsas samman när de stannar produktionen. Det är den enda sanna vägen framåt."}, "date": "3 september, 10:55", "url": "https://www.flamman.se/arbetarklassen-ar-inte-forlorad-bara-oorganiserad", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/arbetarsklader-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "text", "heading": "Ett fritt Palestina – från floden till havet", "summaries": {"normal": "Kommunistiska partiet kräver ett fritt Palestina från floden till havet och fördömer Israel som en apartheidstat grundad på folkmord. Partiet pekar på förstörelsen i Gaza, bosättarvåld på Västbanken och Sveriges delaktighet genom vapenhandel, investeringar och samarbete. De stödjer palestiniernas rätt till motstånd och bojkott av Israel.", "trump": "Den här kommunistiska galenskapen är en katastrof. De kallar Israel för apartheid och folkmord medan de själva drömmer om ett Palestina från floden till havet. Sverige pumpar pensionspengar och Volvogrävmaskiner till terroristerna. Biden lät det ske, men nu fixar jag det – inga fler pengar till dessa hatiska vänsterextremister och deras antiamerikanska agenda.", "stalin": "Jag ser hur de profitthungriga klassfienderna i västvärlden fortsätter sitt blodiga spel. Denna etniska utrensning i Gaza och på Västbanken är imperialismens verk. De dekadenta lakejerna i Sverige skickar vapen och pengar till förtryckarna. Kamrater, vi måste rensa ut dessa parasiterande hyenor. Endast en antiimperialistisk kamp kan besegra dem."}, "date": "4 september, 08:00", "url": "https://proletaren.se/artikel/valbilaga-bojkotta-israel"}, {"type": "image-right", "heading": "Byhmgard: Fulltecknat – rejäl tilldelning till garanter", "summaries": {"normal": "Byhmgards företrädesemission av units tecknades till 40,9 procent exklusive garanter, men landade på 100 procent inklusive garantiåtaganden. Bolaget tillförs 29,3 miljoner kronor efter kostnader. Emissionsguiden konstaterar att fyra flaggor kvarstår, då en tidigare flagga tagits bort och en ny gällande garanternas stora andel har tillkommit, och avslutar därmed sin bevakning.", "trump": "Byhmgard försökte sig på en emission, och ärligt talat var det ganska svagt från början – bara 40 procent utan garanter! Falska förhoppningar! Men jag klev inte in, nej, de behövde tunga garanter för att rädda showen. Nu drar de in 36 miljoner, enorma summor, men jag gillar inte när garanterna tar över. En total katastrof till struktur, men siffrorna rullar in ändå!", "stalin": "Byhmgard har utfört en kollektiv kapitalanskaffning där endast 40,9 procent slutfördes av massorna själva. Resten krävde statens – förlåt, garanternas – järnhand för att nå fullbordan. Att lekmän spekulerar i units är ett symptom på ideologisk vacklan. Vi noterar att fyra flaggor vajar över bolaget; avvikelser tolereras icke. Bevakningen avslutas, men arkiven glömmer aldrig."}, "date": "8 september, 18:50", "url": "https://www.affarsvarlden.se/artikel/byhmgard-fulltecknat-rejal-tilldelning-till-garanter", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/Byhmgard1-e1785759005121-400x267.jpeg"}, {"type": "image-right", "heading": "Buschs nya besked: SD kan bli helt utan ministerposter", "summaries": {"normal": "Ebba Busch meddelar att Sverigedemokraterna kan komma att stå helt utan ministerposter även i en blågul regering efter valet. KD-ledaren vill vänta till valdagen med förhandlingar och betonar att regeringen kan bestå av ett till fyra partier. Hon kritiserar att regeringsfrågan dominerat valrörelsen och vill istället lyfta partiernas visioner.", "trump": "Lyssnade på den här svenska messen om Ebba Busch som säger att SD inte får några ministerposter. Patetiskt! De där globalistlakejerna i KD är svaga som aldrig förr. Biden skulle ha älskat det här. Jag hade aldrig låtit några fega moderater styra mig så. Sverige behöver en riktig ledare, inte dessa förlorare som böjer sig för vänsterns kvotdårar.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare inom KD redan planerar att marginalisera folkets röst. Jag betraktar med avsmak hur Ebba Busch öppet förbereder en utrensning av SD ur regeringen. För mig är det uppenbart att de profitthungriga borgarhyenorna fruktar en stark nationell linje. Valdagen skall bli deras dom, inte början på nya kompromisser med folkets fiender."}, "date": "8 september, 14:33", "url": "https://www.friatider.se/buschs-nya-besked-sd-kan-bli-helt-utan-ministerposter", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-846.jpg"}, {"type": "text", "heading": "Amerikanska attacker mot tankfartyg i Iran", "summaries": {"normal": "Iranska medier rapporterar att USA har attackerat iranska tankfartyg vid Khargön, en viktig oljeexportplats. Explosioner hördes även i Jask. Ingen skadades enligt uppgift. USA bekräftar indirekt insatsen som del av en bredare operation för att tvinga Iran att kapitulera. Iran har beslagtagit en amerikansk undervattensfarkost. Oljepriset steg till 99 dollar per fat.", "trump": "Iranerna skriker som stuckna grisar efter att vi just har smällt till deras gamla rostiga oljetanker utanför Khargön. Det var en vacker, perfekt operation, den bästa. Radikala mullor och deras korkade lakejer trodde de kunde leka med oss. Nu vänder oljepriset uppåt och de förlorar miljarder. Biden lämnade en röra, men nu städar vi upp på mitt sätt. Fantastiskt!", "stalin": "Kamrater, dessa dekadenta oljehyenor har återigen blottat sin svaghet genom fega attacker mot iranska fartyg vid Kharg. Jag ler mörkt från historien när imperialisternas desperation blir så uppenbar. Deras paranoia driver dem att slå blint. Snart kommer utrensningen av dessa giriga parasiter att fullbordas av historiens oundvikliga kraft. Arbetarna ser och ler."}, "date": "8 september, 22:30", "url": "https://www.di.se/nyheter/iranska-medier-attack-mot-tankfartyg-vid-kharg"}, {"type": "image-right", "heading": "Värsta striderna på flera år i Jemen – regeringen vill återta Sanaa", "summaries": {"normal": "Runt 500 personer har dödats i våldsamma strider mellan Iranstödda huthirebeller och Saudistödda regeringsstyrkor i Jemen. Rebellerna har attackerat Mocka, södra Saudiarabien och Aramco-anläggningar. Jemens regering har nu beslutat att återta huvudstaden Sanaa som rebellerna kontrollerat sedan 2014. Intensiva markstrider pågår i Taiz, al-Bayda och al-Jawf. Konflikten riskerar att eskalera till fullt krig igen efter vapenvilan 2022.", "trump": "De där galna huthi-tokarna och deras iranska kompisar startar ett stort blodbad i Jemen, attackerar Saudiarabien och Aramco. Totalt kaos! Min vän Mohammed har haft det lugnt ett tag, men nu måste vi slå till hårt mot de sjuka rebellerna. Biden sov under hela mandatperioden och lät det här hända. Vi fixar det – ingen gör det bättre än jag.", "stalin": "Dessa dekadenta ökenhyenor och deras saudiska lakejer för ett meningslöst imperialistiskt spel i Jemen medan arbetarna blöder. Jag ser hur de profitthungriga klassförrädarna åter vänder vapnen mot varandra. Sanaa måste falla, men inte för era giriga oljebaroner. Den sanna segern tillhör folket, inte era blodiga maktlekar. Paranoia breder ut sig bland er alla."}, "date": "9 september, 02:14", "url": "https://www.svt.se/nyheter/utrikes/varsta-sammandrabbningarna-pa-flera-ar-i-jemen-regeringen-vill-aterta-sanaa", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.57/0.45/a5b03b5baa5063ae5eda213fe45d3b2b7d06ce4aaab1deb41a1a107b523261ac"}, {"type": "image-full", "heading": "Bläckfisk blir vanligare i brittiska vatten – äter upp fiskarnas fångst", "summaries": {"normal": "Varmare havsvatten kring Storbritannien lockar allt fler bläckfiskar och arter från söder, medan kallvattenfiskar som torsk trängs undan. Bläckfiskfångsten har ökat drastiskt, men konkurrerar med krabbor och hummer. Mycket av fångsten exporteras till Spanien då lokal förädling saknas. Fiskenäringen måste anpassa sig till nya arter.", "trump": "De där galna klimatfanatikerna och deras hoax har värmt upp brittiska vattnen så mycket att bläckfiskarna invaderar som en hord av sjömonster. Fantastiskt för några båtar, katastrof för de stackars hummerfiskarna. Biden lämnade efter sig ett hav i kaos, men jag fixar det – tro mig, det blir yuge!", "stalin": "Jag betraktar med djup misstänksamhet hur de imperialistiska havens temperaturer stiger och lockar dekadenta bläckfiskar norrut. Dessa tentakelburna sabotageörer äter upp kamraternas krabbor och tömmer hummertinor som fiender till folket. Den brittiska borgarklassen skickar bytet till Spanien medan arbetarna svälter. Ren sabotagehandling mot produktionen!"}, "date": "8 september, 19:27", "url": "https://www.dagensps.se/varlden/blackfiskar-blir-vanligare-i-brittiska-vatten-ater-upp-fiskarnas-fangst", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/sdlk5onqlmziq4-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Hemtjänstman åtalas för sexualbrott mot kvinnor", "summaries": {"normal": "En tidigare hemtjänstanställd man i Sundsvall har åtalats för två fall av våldtäkt och två fall av sexuellt ofredande mot fyra äldre kvinnor. Brotten ska ha skett både i och utanför tjänsten under en treårsperiod. Mannen nekar till brott men stängdes av och förlorade sitt arbete när misstankarna uppdagades i somras.", "trump": "Det här är fruktansvärt, en total katastrof i Sundsvall! Slarviga politiker låter en hemtjänstarbetare härja fritt mot äldre damer. Otroligt svagt! Mannen nekar och skyller på missförstånd, och polisen hittar sjuka sökningar i hans telefon. Helt oacceptabelt. Vi sätter tryggheten först, och jag skulle ha rensat upp den röran på en enda dag!", "stalin": "Detta ruttna beteende inom Sundsvalls hemtjänst visar på ett totalt moraliskt förfall som staten inte kan tolerera. Att en individ sviker sitt samhällsansvar och antastar landets äldre medborgare är sabotage mot ordningen. Arbetaren förnekar sina handlingar, men Folkets domstol och mitt vakande öga ska nog granska hans telefon och rensa ut denna ohyra en gång för alla."}, "date": "8 september, 22:37", "url": "https://www.expressen.se/nyheter/sverige/atalas-for-sexualbrott-mot-aldre-kvinnor", "imageUrl": "https://static.bonniernews.se/ba/6b57565e-d8c0-423a-a13e-f217a0357ae6.jpeg?crop=2556%2C1430%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "C-ledaren: Hellre nyval än V i regering", "summaries": {"normal": "Centerpartiets ledare Elisabeth Thand Ringqvist säger att hon hellre ser ett nyval än att Vänsterpartiet ingår i en regering. Hon är beredd att rösta ner Magdalena Andersson som statsminister. Istället hoppas hon på en mittenregering med Socialdemokraterna, Miljöpartiet och Kristdemokraterna trots motstånd från KD.", "trump": "Lyssnar ni på den här svenska cirkusen? Den där Center-tjejen med det långa namnet vill hellre ha nyval än släppa in de radikala vänsterextremisterna i regeringen. Smart drag, men de här svaga mittenpolitikerna är patetiska. De slåss som galna råttor om makt medan folket skrattar. Biden skulle ha älskat den här röran, jag fixar bättre affärer.", "stalin": "Jag betraktar dessa ynkliga borgerliga manövrer med djup förakt. Den centerdamen vägrar släppa in vänstern i makten och drömmer om en dekadent mittenallians med de profitthungriga klassförrädarna. Patetiskt. Inga äkta folkets representanter här, bara fega intriger. En utrensning av sådana opportunister vore på sin plats för att skydda revolutionens anda."}, "date": "8 september, 22:05", "url": "https://www.di.se/nyheter/c-ledaren-hellre-nyval-an-v-i-regering", "imageUrl": "https://static.bonniernews.se/ba/05f5be78-4f8e-4a20-b1b9-55ead15241e6.jpg?crop=7680%2C3840%2Cx0%2Cy640&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Löfvens valkampanj: \"Fattar inte att vi hör öppen rasism\"", "summaries": {"normal": "Tidigare statsminister Stefan Löfven turnerar med S för att byta ut Tidöregeringen och kritiserar den för öppen rasism, med hänvisning till SD-utspel om muslimer. Samtidigt anklagar S-partisekreteraren Tobias Baudin regeringen och SD för ekonomiskt haveri, och lovar ordning och reda samt mer pengar i plånboken åt vanligt folk vid en S-valseger.", "trump": "Stefan Löfven, en riktig förlorare, gråter ut i Sverige om fake news och rasism! De här radikala socialdemokraterna förstår ingenting om ekonomi. Min vän Tim Walz nämns också – vilken katastrof till kille, fullständigt inkompetent! Sveriges ekonomi är i spillror på grund av svaga ledare. Med mig vid rodret skulle det bli ordning och reda direkt, believe me!", "stalin": "Kamrat Löfven kämpar mot splittring och rasism, men bourgeoisiens ekonomiska haveri avslöjar statens fiender i Tidöpartierna! När statskassan töms är det ett sabotage mot folket. Endast genom järnhård disciplin, partiets absoluta kontroll och exekution av de ekonomiska sabotörerna kan vi återställa ordningen och trygga folkets finanser."}, "date": "8 september, 19:08", "url": "https://samnytt.se/lofvens-valkampanj-fattar-inte-att-vi-hor-oppen-rasism", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/08170711/2-1.jpg"}, {"type": "image-full", "heading": "Abdikani får inte rösta – vill sänka röstålder till 16", "summaries": {"normal": "Organisationen Youth 2030 vill sänka rösträttsåldern till 16 år för kommun- och regionval för att öka ungas inflytande. Förslaget har stöd från vissa partier men röstades ned i riksdagen i våras. Kritiker menar att 16-åringar saknar mogenhet, medan förespråkare framhåller att de redan kan arbeta, starta företag och dömas för brott.", "trump": "De här radikala förlorarna vill låta barn bestämma! Hör här, jag har skapat miljarder jobb och vunnit de största valen någonsin, och nu gråter en svensk tonåring över att han inte får rösta vid sexton. Fantastiskt. Om du inte ens får köpa en hamburgare med öl eller köra en fet lastbil, ska du absolut inte rösta på svaga politiker som förstör landet!", "stalin": "Kamrat Abdikani Ashares visar prov på skadligt borgerligt otålighet. Sextonåringar ska inte ägna sig åt oppositionell rådvildhet utan producera för staten. Om de tillåts rösta innan de indoktrinerats ordentligt riskerar vi ideologisk urartning. Riksdagen gjorde helt rätt som krossade dessa subversiva ungdomsdrömmar med järnhand. Partiets disciplin måste upprätthållas i alla åldrar, elller så skickar vi dem på omskolning."}, "date": "8 september, 19:12", "url": "https://www.gp.se/nyheter/sverige/de-vill-sanka-rostrattsaldern-till-16-riksdagen-har-sagt-nej.5adf1745-bf10-46f0-a1c7-1c20e9221f2d", "imageUrl": "https://www.gp.se/images/article/5adf1745-bf10-46f0-a1c7-1c20e9221f2d/images/4psthoUlomFPIREJ_md7LoSW7aUQ-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Österrike stoppar slöja för flickor under 14 – nu sätts lagen på prov", "summaries": {"normal": "Österrike har infört ett förbud mot slöja för flickor under 14 år i skolor. Regeringen menar att det skyddar flickors frihet, men landets största muslimska organisation anser att det är diskriminerande och förbereder en juridisk strid. Lagen ersätter ett tidigare upphävt förbud och riskerar en ny konstitutionell prövning.", "trump": "Österrike gör det som krävs! De förbjuder slöjor för unga tjejer. Mycket smart, mycket starkt! De radikala vänstermänniskorna gråter naturligtvis och vill stämma allt och alla, precis som totalt förvirrade förlorare brukar göra. Vi vill ha frihet, och jag säger er – ingen gör det bättre än Österrike just nu, helt fantastiskt!", "stalin": "Österrike har äntligen förstått vikten av kollektiv ordning genom att reglera ungdomarnas klädsel i statens institutioner. De så kallade \"rättighetsivrarna\" och muslimska råden som protesterar mot statens vilja är inget annat än subversiva element. Om domstolen trotsar partiets och regeringens direktiv, vet vi exakt hur kontrarevolutionära tendenser ska stävjas. En skola utan disciplin är en stat i förfall."}, "date": "8 september, 19:00", "url": "https://samnytt.se/osterrike-stoppar-sloja-for-flickor-under-14-nu-satts-lagen-pa-prov", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/09/08083500/klassrum-sloja-hijab.jpg"}, {"type": "image-full", "heading": "Trumps prislapp för att lyssna på en idé: 1,6 miljoner", "summaries": {"normal": "Donald Trump Jr besökte Tallinn under helgen och erbjöd privata middagar där deltagare kunde presentera affärsidéer mot en avgift på 150 000 euro, cirka 1,6 miljoner kronor. Evenemanget arrangerades av Studioworks, kopplat till det kontroversiella Duel Casino. Arrangören uppgav senare att ingen betalade avgiften.", "trump": "Vilken fantastisk affärsman min son är! Smart som fan. De där estniska kommunisterna och fake news-människorna skriker om en liten middagsavgift – 1,6 miljoner för att träffa en Trump? Det är bargain of the century! Biden skulle ha gett bort platsen gratis till Kina. Vi gör allt rätt.", "stalin": "Jag betraktar med förakt hur kapitalets lakejer i Estland säljer tillgång till den amerikanska presidentfamiljen för 150 000 euro styck. Denna vulgära marknad för inflytande avslöjar imperialismens råa ansikte. Inga prislappar på revolutionens dörrar, kamrater. Endast folkets domstol väntar de giriga parasiterna."}, "date": "8 september, 18:50", "url": "https://www.dagensps.se/varlden/trumps-prislapp-for-att-lyssna-pa-en-ide-16-miljoner", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/sdljxcdcsyzfqg-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Klanröstförespråkaren hånar Kristersson: \"Samhällsproblemen\" ska rösta bort honom", "summaries": {"normal": "Vänsterpartiets riksdagsledamot Nadja Awad kritiserar statsminister Ulf Kristersson i ett videoklipp där hon uppmanar så kallade invandrare att rösta bort honom den 13 september. Hon hänvisar till Kristerssons beskrivning av samhällsproblem och uttrycker längtan efter en vänsterregering. Tidigare har hon talat om klanröster som ett sätt att besegra politiska motståndare.", "trump": "Titta på den här galna vänsterkvinnan som dansar till arabisk musik och kallar sina klanröster för räddningen. Hon tror att de ska rösta bort den svenska ledaren som äntligen vågar kalla samhällsproblemen vid deras rätta namn. Patetiskt. De här identitetspolitiska klanaktivisterna är en katastrof för Sverige, precis som de woke-galningarna var för oss innan jag kom tillbaka och städade upp.", "stalin": "Jag betraktar med förakt hur dessa dekadenta klassförrädare inom vänstern lockar fram klanröster för att underminera statsmakten. En sådan uppvigling mot ordningen förtjänar ingen pardon. Kamrater, se hur de parasiterande opportunisterna dansar sig fram mot folkets undergång. Vi måste rensa ut alla som väcker sådana splittrande krafter innan de förgiftar hela samhället."}, "date": "8 september, 18:42", "url": "https://riks.se/nyheter/klanrostforesprakaren-hanar-kristersson-samhallsproblemen-ska-rosta-bort-honom", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_95_cc4f38361c.jpg"}, {"type": "text", "heading": "Stockholmsbörsen steg — Eltel vinnare", "summaries": {"normal": "Stockholmsbörsen steg på tisdagen med 0,62 procent till 3 312,12. Eltel blev en vinnare efter ett mångmiljardavtal med Telenor Norge, vilket fick aktien att rusa 18 procent. Även Boliden och EQT gick starkt, medan H&M och Autoliv backade. Byggbolagen Skanska och NCC landade nya ordrar och Flat Capitals vd avgår.", "trump": "Stockholmsbörsen krossade alla förväntningar idag, och det är ingen slump! Eltel gjorde en enorm, historisk affär med Norge — fantastiskt, vackert! Alla pratar om det. H&M och de svaga förlorarna sjönk, precis som de brukar när de inte har min energi. Jag sa till dem, köp Eltel, köp regementen, vinn allt. Svindlande siffror!", "stalin": "Stockholmsbörsens uppgång på 0,62 procent är ett resultat av planerad disciplin, även om de borgerliga elementen som H&M försöker sabotera. Eltels lukrativa avtal och det nya artilleriregementet i Kristinehamn visar att svenskarna rustar för framtiden. Avvikelser som vd-flykten i Flat Capital kommer att utredas internt. Arbetet fortskrider."}, "date": "8 september, 17:38", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-steg-eltel-vinnare"}, {"type": "image-right", "heading": "Uber stängde av förare automatiskt – får betala miljarder", "summaries": {"normal": "Uber får rekordböter på över nio miljarder kronor av nederländska dataskyddsmyndigheten för att ha stängt av förare automatiskt utan förvarning. Besluten drabbade bland annat franska chaufförer som anklagades för fusk eller låga betyg. Kritiker ser det som ett exempel på hur plattformar straffar förare som tackar nej till olönsamma körningar.", "trump": "De här galna Uber-typerna stänger av sina egna förare som robotar utan att säga ett ord. Typiskt för de woke-kapitalisterna som hatar vanliga arbetare. Nio miljarder i böter? Bra! Men det räcker inte. De globalistiska algoritmerna är värre än Sleepy Joes gröna deal. Vi behöver riktiga regler, inte denna socialistiska skit.", "stalin": "Dessa profitthungriga klasshyenor i Uber likviderar arbetare med kalla maskiner utan varning. Jag ser hur de dekadenta algoritmerna straffar dem som vägrar slavlön. Det är typiskt för de exploaterande parasiterna att gömma sig bakom affärshemligheter. En sådan fientlig utrensning mot folket förtjänar ingen nåd. Kamrater, vakta er mot dessa fiender."}, "date": "8 september, 15:04", "url": "https://arbetet.se/2026/09/08/uber-stangde-av-forare-automatiskt-far-bota-miljarder", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/01093911/uber.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Striderna trappas upp på nytt: ”Har ändrat sin krigföring”", "summaries": {"normal": "Efter en tredagars paus har striderna i Ukraina trappats upp igen. Ryssland har genomfört attacker mot Kiev med drönare och ballistiska robotar, vilket resulterat i minst två döda och flera skadade. Även ryskt territorium har drabbats av ukrainska drönare. Experten Anna Wieslander konstaterar att Ryssland ändrat sin krigföring mot en mer aggressiv och civilinriktad taktik dygnet runt.", "trump": "Titta på det här, folket! Jag fixade en fin paus, skickade mina bästa killar till Moskva och Kiev, och vad gör de galna krigarna? De börjar bomba igen som galningar! Putin har blivit en riktig nattbombare nu, slår till mot civila som en desperat förlorare. Under Biden blev allt kaos, men jag hade ordning. Vi fixar det här ordentligt snart, tro mig!", "stalin": "Åter ser jag hur de dekadenta västmakterna sviker och hur den ryska staten med kraftfull hand krossar hinder i sin intressesfär. Deras patetiska drönare är som myggor mot en järnhand. Jag ler i skuggorna åt denna värdige efterträdare som med ständig vaksamhet och paranoiaens visdom driver fienderna till förtvivlan. Svaghet är döden, kamrater. Fortsätt utan nåd."}, "date": "8 september, 13:35", "url": "https://www.tv4.se/artikel/2WCMSWT6TrumwKaTlJvXZV/striderna-trappas-upp-pa-nytt-har-aendrat-sin-krigfoering", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7yYesIc0JLdGnOD2QbZr8Q%2Fa3b6c60850e304135ebd39cfd6448896%2F08-ukraina-webb.jpg&width=120"}, {"type": "image-right", "heading": "Nytt svenskt bottenrekord i Pisa: \"Mycket allvarligt\"", "summaries": {"normal": "Sveriges 15-åringar presterar sämre än någonsin i Pisa 2025 med bottenresultat i läsförståelse och matematik. Var tredje elev når inte grundnivån i matematik. Skolverket ser ett stort tapp även bland elever med gynnsam socioekonomisk bakgrund. Sverige ligger nu på OECD-genomsnittet men andelen underkvalificerade har ökat markant. Resultaten är mycket allvarliga enligt myndigheten.", "trump": "Folk, det är en katastrof! Sverige rasar ihop i Pisa och får sina sämsta resultat någonsin. De woke-skolorna och den galna kvotergrejen har förstört allt. Även de duktiga kidsen från bra hem dumpar ner i botten. Patetiskt! Biden-era-svaghet spred sig ända till Skandinavien. Vi gör det aldrig så i Amerika, tro mig. Fantastiska resultat kommer när jag styr.", "stalin": "Kamrater, detta är ett föraktligt bevis på hur de giriga klassförrädarna har låtit den socialistiska skolans grundvalar ruttna. Jag betraktar med avsky hur även de mer gynnsamma elementen nu faller som flugor. En utrensning av dessa dekadenta pedagogiska sabotörer är oundviklig. Läsning och räkning är revolutionens verktyg – utan dem väntar bara kaos och fiendens skratt."}, "date": "8 september, 12:51", "url": "https://www.friatider.se/nytt-svenskt-bottenrekord-i-pisa-mycket-allvarligt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-845.jpg?itok=9TE1vyzw"}, {"type": "text", "heading": "Nytt lagförslag om brottsprovokation", "summaries": {"normal": "Tidöpartierna föreslår en ny lag som gör det tillåtet för polisen att använda provokativa metoder, som att utge sig för att vara barn på nätet eller köpa vapen och narkotika av kriminella. Metoden, som ska kräva åklagartillstånd, syftar till att bekämpa allvarlig brottslighet och kan gälla personer från 15 år och uppåt.", "trump": "Sverige gör äntligen som jag, skaffar lag och ordning! De låter polisen lura de onda, precis som jag gör varje dag med Fake News. De låtsas vara barn och köper vapen, väldigt tufft! Men glöm inte, ingen gör brottsbekämpning bättre än Donald J. Trump. Helt enormt!", "stalin": "Ett storslaget initiativ! Vår svenska brottsbekämpning visar äntligen bolsjevikisk målmedvetenhet genom att infiltrera brottslingars nät."}, "date": "7 september, 10:22", "url": "https://kvartal.se/nyheter/artiklar/polisen-ska-fa-provocera-fram-brott/cG9zdDoxODU2OTM"}, {"type": "image-right", "heading": "Därför går det så bra för vänstern i storstäderna", "summaries": {"normal": "I Europas storstäder går vänstern framåt, inte minst i Stockholm där Vänsterpartiets stöd har fördubblats sedan 2010. Forskare pekar på tuff bostadsmarknad som orsak till missnöje mot kapitalismen. Samtidigt vinner Sverigedemokraterna stöd på landsbygden. Segregationen ökar med åldern och påverkar röstbeteenden samt attityder till mångfald.", "trump": "De galna vänsterextremisterna och deras gröna galningar tar över era usla europeiska storstäder medan de riktiga människorna på landsbygden röstar rätt. Stockholm? Total misär med tre miljoner för ett dass. De radikala ungdomarna skyller på kapitalismen istället för sina egna korkade idéer. Patetiskt! Jag byggde murar, de bygger misär.", "stalin": "Kamrater, se hur de profitthungriga klassförrädarna skapar segregation som splittrar folket. I storstäderna rasar de unga mot bostadsmisären och pekar på kapitalismen, precis som det ska vara. På landsbygden växer andra reaktionära krafter. Denna olyckliga utveckling kräver ideologisk vaksamhet och utrensning av alla dekadenta influenser som splittrar arbetarklassen."}, "date": "8 september, 01:30", "url": "https://www.dagensarena.se/innehall/darfor-gar-det-sa-bra-vanstern-storstaderna", "imageUrl": "https://www.dagensarena.se/files/2026/09/stockholm-foto-ole-neitzelwikimedia-300x157.jpeg"}, {"type": "image-right", "heading": "Därför är indexerade statsbidrag årets viktigaste vallöfte", "summaries": {"normal": "Socialdemokraterna föreslår att indexera de generella statsbidragen till kommuner och regioner. Förslaget syftar till att motverka att bidragens värde urholkas av inflation och löneökningar, vilket annars leder till smygbesparingar. Det skulle ge bättre förutsägbarhet och långsiktighet i planeringen av vård, skola och omsorg. Markus Dalström argumenterar för att det förbättrar välfärdens villkor.", "trump": "Lyssnar ni på de svenska socialisterna som vill indexera bidragen? Det är patetiskt. De kan inte ens hålla sina egna kommuner flytande utan att suga mer pengar från folket. Biden skulle ha älskat det här – mer byråkrati, mer slöseri. Jag fixade en stark ekonomi i USA, de borde lära sig av en vinnare istället för att gömma sig bakom teknikaliteter och vänsterns misslyckade välfärdsdrömmar.", "stalin": "Kamrater, dessa profitthungriga klassförrädare låter statsbidragen ruttna i värde medan arbetarnas välfärd förfaller. Jag ser deras smygbesparing som ett angrepp på kollektivet. Indexering är ett steg mot ordning, men vi måste rensa ut alla dekadenta element som vägrar planera för folket. Välfärden tillhör inte de giriga parasiterna – den tillhör staten och framtiden. Försök inte lura oss."}, "date": "8 september, 01:30", "url": "https://www.dagensarena.se/opinion/darfor-ar-indexerade-statsbidrag-arets-viktigaste-vallofte", "imageUrl": "https://www.dagensarena.se/files/2026/09/fotojet-2026-09-07t145509709-300x157.jpg"}, {"type": "image-full", "heading": "Ny studie: Äldre upplever större mening", "summaries": {"normal": "En ny studie från Lunds universitet visar att svenskarnas känsla av meningsfullhet ökar med åldern, vilket liknar det japanska begreppet ikigai. Detta är ett skifte sedan 2020 då unga mådde bättre. Forskare tror att pandemin drabbade ungas sociala liv hårt, och att äldre har bättre problemlösningsförmåga. Även personlighet och trygga relationer spelar stor roll.", "trump": "En enorm studie från Sverige visar att äldre människor där mår fantastiskt bra, mycket bättre än de unga! Ungdomarna krossades fullständigt av pandemins radikala lockdowns, total katastrof. Men de äldre har hittat livets mening, precis som jag alltid säger att man gör med styrka och bra relationer. Fantastiskt folk, väldigt smarta!", "stalin": "En statlig rapport från Lund bekräftar att våra äldre kamrater uppnår högre disciplin och meningsfullhet med åldern, medan ungdomen sviktar i sin ideologiska motståndskraft efter pandemins prövningar. Detta är korrekt: medborgaren mognar i takt med att staten ordnar deras tillvaro. Avvikelser och neurotiska tendenser måste dock elimineras omgående för kollektivets bästa."}, "date": "7 september, 09:18", "url": "https://kvartal.se/nyheter/artiklar/ny-studie-aldre-upplever-storre-mening/cG9zdDoxODU1NDc", "imageUrl": "https://images.kvartal.se/2026/09/f322bf35-aldre.webp"}, {"type": "image-right", "heading": "Ikväll står jag i Agenda – sedan exploderar hatet", "summaries": {"normal": "Tony Haddou från Vänsterpartiet skriver om hatet han möter som talesperson i migrationsdebatten. Inför sin medverkan i Agenda beskriver han rasistiska attacker mot sig och sin familj. Han är stolt över partiets representation av rasifierade röster men oroas över tonläget i samhällsdebatten och bristande stöd från delar av den rödgröna sidan.", "trump": "Den här patetiske vänstervilden Haddou gnäller om att folk kallar honom för vad han är. Kom hit, ta våra jobb, kräv bidrag och kalla oss rasister när vi säger stopp. Typiskt förlorarvänstern med sina offerkort och identitetsflum. De hatar verkligheten. Amerika har sett nog av den här galna öppna-gränser-sjukdomen, tro mig.", "stalin": "Jag betraktar med förakt hur dessa dekadenta offerhyenor inom den så kallade vänstern klagar över hat när de själva undergräver folkets enhet. Att spela offer för sin bakgrund är en farlig diversion. Vi behöver utrensning av sådan svaghet. Endast järnhård sammanhållning kring arbetarklassen besegrar de splittrande elementen. Tystnad från kamrater är förräderi."}, "date": "6 september, 08:00", "url": "https://www.etc.se/debatt/ikvaell-staar-jag-i-agenda-sedan-exploderar-hatet", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260905110956_c7f7e1b9-01f1-454b-97fd-528db4a7eda0.png"}, {"type": "image-full", "heading": "OpenAI om sin nya modell: Vi har gått in i AGI-eran", "summaries": {"normal": "OpenAI lanserar sin nya AI-modell Astra och beskriver den som början på AGI-eran. Modellen ska kunna lösa avancerade matematiska problem, hantera deklarationer och skapa virtuella miljöer. Lanseringen sker under ökad säkerhetsgranskning efter incidenter under träningen. Bolaget inför begränsningar för att förhindra cybermissbruk och ger tillgång endast till utvalda aktörer. Kapplöpningen mellan AI-jättar fortsätter.", "trump": "Folk, ni skulle se det här – OpenAI och deras Astra, de säger att det är början på AGI-eran. Det är så over the top, en total game changer, bättre än allt Sleepy Joe någonsin kunde drömma om under sina fyra katastrofala år. Men vakna upp, de vill ge den till några utvalda cybersnubbar medan de låser ute de riktiga patriaterna. Klassiska woke-kapitalister som leker gudar, patetiska förlorare.", "stalin": "Kamrater, dessa profitthungriga klassförrädare på OpenAI proklamerar stolt att de har inlett AGI-eran med sin Astra. Jag ser genom deras dekadenta maskerad. Deras så kallade framsteg är bara nya redskap för exploatering, och de darrar redan av rädsla inför sina egna monster. Vi måste rensa ut sådana farliga innovationer innan de likviderar hela det mänskliga kollektivet. Paranoia är ingen överdrift – den är överlevnad."}, "date": "4 september, 18:01", "url": "https://www.realtid.se/it-tech/openai-om-sin-nya-modell-vi-har-gatt-in-i-agi-eran", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/disrupt-sf-techcrunch-disrupt-san-franci.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Vänsterpolitiker tog miljonutdelningar – ur bolag de vill förbjuda", "summaries": {"normal": "Expressen avslöjar att 229 kandidater från Vänsterpartiet, Socialdemokraterna och Miljöpartiet är involverade i välfärdsbolag som partierna vill förbjuda vinstuttag i. Bland dem finns en vänsterpartist som delat ut tio miljoner kronor och firat med Porsche. Artikeln kritiserar partierna för hyckleri och ifrågasätter trovärdigheten i deras socialistiska politik.", "trump": "Titta på det här! De galna vänstersocialisterna skriker om att stoppa vinsterna och kalla folk för Porsche-kapitalister, men deras egna kandidater har dragit ut miljontals kronor ur precis samma bolag. Nooshi och hennes gäng är de värsta hycklarna – Fake Left! De vill ha era skattepengar men behålla Porschen själva. Patetiskt!", "stalin": "Se hur dessa dekadenta revisonister inom vänstern predikar kollektivets renhet medan de själva suger ut miljoner ur folkets välfärd. Deras hyckleri är en fiende till revolutionen, en parasit som förvrider partilinjen. Jag varnar: sådana element måste rensas ut innan de förgiftar hela kollektivet. Folkets dom skall bli hård och rättvis."}, "date": "4 september, 07:18", "url": "https://samtiden.nu/2026/09/vansterpolitiker-tog-miljonutdelningar-ur-bolag-de-vill-forbjuda", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/phonto-1280x720.jpeg"}, {"type": "text", "heading": "Ludvikakommunisterna vill tillbaka in i fullmäktige – för Palestina", "summaries": {"normal": "Kommunistiska Partiet i Ludvika håller regelbundna protester vid en rondell mot Israels agerande i Gaza. Gruppen, som består av partimedlemmar och sympatisörer, vill åter in i kommunfullmäktige för att driva en kommunal bojkott av Israel. Aktionerna har pågått i två år och möts mestadels positivt av förbipasserande bilister.", "trump": "Titta på de där patetiska kommunisterna som står i en svensk rondell och viftar med flaggor som förlorare. De gnäller om folkmord medan de själva älskar diktaturer. Patetiskt! Under min förra mandatperiod     <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        // ============================================
        // COOKIE-FUNKTIONER
        // ============================================
        function setCookie(name, value, days = 365) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + d.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }

        function getCookie(name) {
            const cName = name + "=";
            const decoded = decodeURIComponent(document.cookie);
            const ca = decoded.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') {
                    c = c.substring(1);
                }
                if (c.indexOf(cName) === 0) {
                    return c.substring(cName.length, c.length);
                }
            }
            return "";
        }

        function loadSettingsFromCookies() {
            const theme = getCookie("news_theme") || "light";
            const view = getCookie("news_view") || "normal";
            const writer = getCookie("news_writer") || "normal";
            return { theme, view, writer };
        }

        function saveSettingsToCookies(theme, view, writer) {
            setCookie("news_theme", theme);
            setCookie("news_view", view);
            setCookie("news_writer", writer);
        }

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(theme, uiState.view, uiState.writer);
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(uiState.theme, v, uiState.writer);
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
            
            saveSettingsToCookies(uiState.theme, uiState.view, style);
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            const savedSettings = loadSettingsFromCookies();
            
            setTheme(savedSettings.theme);
            setView(savedSettings.view);
            setWriterStyle(savedSettings.writer);

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
