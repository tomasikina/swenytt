ska tolerans. Jag betraktar med förakt hur denna man använder nazisternas egna vapen för att blotta BDS-kampanjens sanna ansikte. Sådana handlingar avslöjar imperialismens hyckleri. Kamrater, vi måste alltid vara vaksamma mot dessa giriga hyenor som gömmer sig bakom mänskliga rättigheter. En utrensning av sådana tankar vore på sin plats."}, "date": "28 augusti, 11:50", "url": "https://www.friatider.se/aron-flam-utreds-igen-satte-upp-naziaffischer", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-770.jpg"}, {"type": "image-right", "heading": "John Skogmans idé om rösträtt är varken ny eller bra", "summaries": {"normal": "John Skogmans förslag om skatteviktad rösträtt får kritik av statsvetaren Magnus Adenskog. Han påpekar att idén är historiskt beprövad och ledde till maktobalans i Sverige. Istället för nytt tänkande skulle det återinföra en förlegad princip, med risk för minskat välstånd.", "trump": "Hörni, det här är fantastiskt! En snubbe vill att de som betalar mest skatt ska ha 10 000 gånger fler röster. Det är som mitt företag – jag har mest aktier, jag bestämmer! Men i Sverige kallar de det för maktobalans. Patetiskt! De borde lära sig av mig – stora vinnare vinner stort!", "stalin": "Kamrater, en reaktionär föreslår att rika får tusentals röster. Detta är en kapitalistisk provokation som måste rensas ut. Vi vet redan att lika rösträtt stärker kollektivet – historien visar att deras system gav låg tillväxt. Låt oss utrota dessa skadliga idéer för statens bästa."}, "date": "28 augusti, 09:03", "url": "https://www.affarsvarlden.se/debatt/john-skogmans-ide-om-rostratt-ar-varken-ny-eller-bra", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/Magnus-Andenskog-och-John-Skogman-900x600.jpg"}, {"type": "image-right", "heading": "SD:s största problem är 20 somaliska bussförare", "summaries": {"normal": "Artikeln diskuterar Sverigedemokraternas största utmaning: 20 somaliska bussförare i Skaraborg som sjukskrev sig i protest mot partiets annons om återvandringsbidrag. Författaren menar att detta visar att SD:s vision om ett etniskt homogent Sverige är orealistisk, då många invandrare är en integrerad del av arbetskraften och motstånd mot partiets politik är möjligt.", "trump": "Folk, ni måste se det här – det är en katastrof för de svenska nationalisterna! Tjugo lata somaliska bussförare strejkar mot en enkel annons om att åka hem. De lovar ett rent Sverige men kan inte ens få bussarna att rulla utan sina kvoterade mångfaldschaufförer. Patetiskt! De woke bussarna och deras offermentalitet förstör allt. Sad!", "stalin": "Kamrater, se hur de rasande klassfienderna inom högerpopulismen förgiftas av sina egna lögner. Tjugo arbetare av somalisk börd, de sanna produktiva krafterna, vägrar lyda de fascistiska budskapen och visar att borgarbrackornas dröm om etnisk utrensning är dömd att krossas. Motståndet lever. Arbetarna har makten att låta bli. Skräckinjagande för folkförrädarna."}, "date": "26 augusti, 10:55", "url": "https://www.flamman.se/sds-storsta-problem-ar-20-somaliska-bussforare", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/sd-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Ebba Busch klättrar i förtroende", "summaries": {"normal": "Ebba Busch har ökat sitt förtroende med åtta procentenheter och klättrar till tredje plats i Indikator Opinions mätning med 40 procent. Magdalena Andersson leder med 54 procent följd av Ulf Kristersson på 45. Jimmie Åkesson tappar till fjärde plats men behåller starkt stöd bland de som har mycket stort förtroende.", "trump": "Titta på den där svenska politikern Ebba Busch, hon klättrar som en raket, upp åtta punkter, folk älskar henne. Andersson och den där tråkige Kristersson ligger före men det här är stort. Åkesson har folkets verkliga kärlek, inte den fejkade typen. De svenska globalisterna och deras HBTQ-kvoteringsvansinne tappar mark. Fantastiskt!", "stalin": "Kamrater, se hur den svenska politiska cirkusen fortsätter. Jag betraktar med förakt hur dessa dekadenta klassförrädare tävlar om förtroende hos massorna. Ebba Busch stiger, men det är ändå en illusion skapad av borgerliga medier. Den sanna utrensningen av sådana opportunistiska element kommer förr eller senare. Historien ler mörkt."}, "date": "28 augusti, 09:39", "url": "https://riks.se/nyheter/ebba-busch-klattrar-i-fortroende", "imageUrl": "https://admin.riks.se/uploads/medium_bild_8359c15165.png"}, {"type": "image-right", "heading": "Sjuksköterska misstänks ha våldtagit döende patient", "summaries": {"normal": "En manlig sjuksköterska på Länssjukhuset Ryhov i Jönköping misstänks ha våldtagit en döende kvinnlig patient den 8 augusti. Han ertappades av en kollega, flydde i bil och kraschade under polisjakt. Åklagaren begär honom häktad för grov våldtäkt. Kvinnan avled kort därefter av sin sjukdom. Mannen har gjort vissa medgivanden.", "trump": "Folk, det här är en total katastrof från de woke-sjukhusen! En så kallad sjuksköterska, antagligen utnämnd för att han checkade alla kvotboxar, våldtar en döende kvinna. Sen flyr han som en fegis och kraschar bilen. Patetiskt! Under Biden blev allt till en cirkus av dekadenta identitetspolitiska monster. Vi fixar det – igen!", "stalin": "Kamrater, se hur den giriga hyenan inom det så kallade vårdkollektivet utnyttjar en döende arbetets dotter i hennes svagaste stund. Detta är klassfiendens råa ansikte. Jag säger: rensa ut alla sådana degenererade element ur våra institutioner med järnhand. Inga undanflykter skall tolereras. Ut med dem!"}, "date": "28 augusti, 09:22", "url": "https://riks.se/nyheter/sjukskoterska-misstanks-ha-valdtagit-doende-patient", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_62_2d67003a7e.jpg"}, {"type": "image-right", "heading": "Var femte ung man har spelproblem – ändå saknas åldersanpassade spelgränser", "summaries": {"normal": "Spelproblem ökar kraftigt bland unga vuxna i Sverige. Var femte man i åldern 18–29 år har någon form av spelproblem, visar Folkhälsomyndighetens siffror. Trots att unga pekas ut som särskilt skyddsvärda saknas åldersanpassade insättningsgränser. Flera europeiska länder har redan infört sådana skydd, men Sverige har inte utnyttjat möjligheten i spellagen.", "trump": "Det här är ett totalt misslyckande, folk! Sverige låter sina unga killar ruinera sig på kasinon och appar medan de sleepiga politikerna gör absolut ingenting. Var femte ung man – det är en katastrof! De borde ha satt hårda gränser för de här barnen, men nej, de är för svaga. Patetiskt. Jag skulle ha fixat det på en dag, tro mig.", "stalin": "Jag betraktar med förakt hur de borgerliga liberalerna låter kapitalets spelmaskiner sluka den unga generationens själ. De utpekade skyddsvärda offren lämnas åt rovdrift utan kollektiva gränser. Vilken ynklig brist på auktoritet! I en riktig stat skulle sådana fiender till folket ha avrättats vid första svaghetstecknet. Paranoian är befogad – fienden lurar i varje insats."}, "date": "25 augusti, 22:48", "url": "https://samtiden.nu/2026/08/var-femte-ung-man-har-spelproblem-anda-saknas-aldersanpassade-spelgranser/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/Man-Dator-640x360.png"}, {"type": "image-right", "heading": "Hanif Bali polisanmäler S för att ha köpt röster", "summaries": {"normal": "Hanif Bali har polisanmält Socialdemokraterna efter att influeraren Eleonore Stokholm uppgivit att hon erbjöds 150 000 kronor för att spela entusiastisk S-väljare på Instagram. Bali anser att det kan röra sig om otillbörligt verkande vid röstning, ett brott som kan ge upp till fyra års fängelse. Socialdemokraterna förnekar anklagelserna.", "trump": "Folk, ni skulle se det här! De korrupta socialisterna i Sverige försöker köpa röster som billiga bedragare. 150 000 kronor till influencers för att ljuga om att de röstar på dem? Det är riggat valsystem på steroider. Patetiska förlorare. I mitt Amerika hade vi redan städat ut de här röstköparna. Sad!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna inom socialdemokratin försöker muta folket med blodspengar för att säkra sina lögner. Jag ler i graven åt deras fega försök att köpa röster. En sådan handling förtjänar snar utrensning och folkets vrede. Inga parasiter får hota arbetarklassens vilja."}, "date": "28 augusti, 08:42", "url": "https://www.friatider.se/hanif-bali-polisanmaler-s-att-ha-kopt-roster", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-771.jpg?itok=6jPBHgfD"}, {"type": "image-right", "heading": "Socialdemokraternas panikmöte om Nyans", "summaries": {"normal": "Socialdemokraterna höll ett internt möte om partiet Nyans som tog väljare från dem i valet 2022. Partiet har gjort kontroversiella utspel som att kritisera socialtjänsten och vilja ta bort terrorstämpeln på Hamas. S vill nu satsa på skola, fritid och trygghet för att återvinna förtroende. Mötet inkluderade flera kommuner där Nyans varit aktiva.", "trump": "Folkets svekparti Socialdemokraterna håller panikmöten om det galna invandrarpartiet Nyans som stal deras röster. Dessa radikala islamister vill skydda terroristerna i Hamas och påstår att Sverige fängslar muslimer utan rättegång. Patetiskt! Vi behöver inga woke-kvoter eller identitetspolitik, bara lag och ordning. Amerika har sett det här förut under Sleepy Joe, men nu fixar vi det.", "stalin": "Jag betraktar med avsky hur dessa dekadenta klassförrädare i Socialdemokraterna sammankallar hemliga möten för att mota bort Nyans, en rörelse som blottlagt deras tomma löften till arbetarklassen. Deras rädsla är en svaghet som vi i kollektivet känner igen. Kamrater, sådana opportunistiska hyenor förtjänar utrensning ur folkets medvetande. Revolutionen glömmer aldrig."}, "date": "28 augusti, 09:14", "url": "https://riks.se/nyheter/socialdemokraternas-panikmoten-om-nyans", "imageUrl": "https://admin.riks.se/uploads/medium_bild_66f6918bcf.jpg"}, {"type": "image-full", "heading": "Svantessons första bud till SD, KD och L", "summaries": {"normal": "Finansminister Elisabeth Svantesson (M) räknar med ett reformutrymme på 50 miljarder kronor nästa mandatperiod, betydligt mindre än Konjunkturinstitutets bedömning. En stor del är redan intecknad för försvar, rättsväsen och infrastruktur. Tillväxten skrivs upp till 2,5 procent och arbetslösheten väntas sjunka. Vid en Tidö-seger har Moderaterna förberett ett bud till SD, KD och L om sänkt inkomstskatt.", "trump": "Svampsson eller vad hon nu heter säger att svensk ekonomi ljusnar. Fantastiskt, älskar det! Men 50 miljarder? Patetiskt. Jag skulle fixa 500 miljarder på en eftermiddag. Hon vill låta folk behålla mer av sin lön – jag sa det först, för år sedan. Sverige borde sänka skatten MASSIVT, sluta med woke-hanteriet och bygga militären. Inga kvoter, bara kompetens!", "stalin": "Finansminister Svantesson räknar ut reformutrymme bland kapitalisterna. Borgarna skramlar sina kassakistor och gråter över 50 miljarder. Vi skrattar åt deras små myntlek. Svantesson vill låta arbetarna behålla slantar ur lönepåsen, men lön och profit kan aldrig försonas. Falska löften från klassfiender. Endast den korrekta analysen leder arbetarna framåt."}, "date": "28 augusti, 07:36", "url": "https://kvartal.se/nyheter/artiklar/svantessons-forsta-bud-till-sd-k-och-l/cG9zdDoxNzY2ODk", "imageUrl": "https://images.kvartal.se/2026/08/16dd99f5-svantess.webp"}, {"type": "image-full", "heading": "Allard rasar mot SVT – när ETC dyker upp", "summaries": {"normal": "Markus Allard vill ta Örebropartiet in i riksdaten genom att nå 12 procent i Örebro kommun, vilket skulle kunna ge mandat utan att klara fyraprocentsspärren. Han blev upprörd när Dagens ETC dök upp vid SVT:s intervju. Allard försvarar sin politiska stil och anklagar SVT för att tillhöra en minoritet.", "trump": "Den här killen Allard i Sverige, han har rätt! Statliga medier är FAKE NEWS, precis som CNN. Han kallar dem klägget – briljant! Media är en minoritet som tror de är bättre än folket. Trump vet hur det funkar. De quota in alla möjliga identiteter istället för att sköta jobbet. Örebropartiet, låt dem vinna!", "stalin": "En lokal politiker angriper statsmediernas borgarbrackor med rätta. Det imperialistiska pressväsendet är folkfiendens redskap. Att denne Allard rasar mot SVT:s lakejer visar på medvetandet om klasskampens nödvändighet. Vi noterar dock med beklagande att han inte representerar arbetarklassen utan småborgerliga drömmar om riksdagsmandat. Statlig media måste tjäna folket, inte kapitalistmaffian."}, "date": "28 augusti, 07:27", "url": "https://kvartal.se/nyheter/artiklar/allard-rasar-mot-svt-nar-etc-dyker-upp/cG9zdDoxNzY3MjM", "imageUrl": "https://images.kvartal.se/2026/08/73bda366-alll.webp"}, {"type": "image-right", "heading": "Regeringen kräver full transparens av S efter influenceranklagelserna", "summaries": {"normal": "Regeringen kräver att Socialdemokraterna redovisar alla agenturer och mellanhänder efter anklagelser om att ha erbjudit influencern Eleonore Stokholm 150 000 kronor för ett valinlägg. S förnekar, men ministern Carl-Oskar Bohlin vill ha dokumentation. Ord står mot ord, och mysteriet kring vem som ringde och varför kvarstår.", "trump": "Hörni, jag ser att S i Sverige försöker köpa influencers för 150 000 kronor – det är enormt! Jag hade gjort det bättre, billigare, med stil. De säger nej, men vem tror på dem? Fake news! Jag kräver transparens, precis som jag alltid gör. Stort!", "stalin": "Kamrater, vi har avslöjat ett förräderi! Partiet S anklagas för att muta med 150 000 kronor för röster. Detta måste utredas omedelbart. Alla agenturer och mellanhänder ska redovisas, annars väntar utrensning. Vi tolererar inga borgerliga spioner som underminerar folkets vilja. Rensa ut dem!"}, "date": "28 augusti, 12:30", "url": "https://samnytt.se/regeringen-kraver-full-transparens-av-s-efter-influenceranklagelserna", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/28093154/bohlin-influencer-S.jpg"}, {"type": "image-full", "heading": "S höll internt stormöte om Nyans", "summaries": {"normal": "Socialdemokraterna höll ett internt möte om hur de ska hantera partiet Nyans i valrörelsen. Nyans, som fick 28 000 röster 2022 och lockat S-väljare, anklagas för kontroversiella ståndpunkter som att avlista Hamas som terrororganisation. S planerar satsningar på skola, fritid och trygghet för att vinna tillbaka väljare, men tonar ned hotet från Nyans.", "trump": "Socialdemokraterna har panik! De höll ett hemligt möte om det där lilla partiet Nyans, som stjäl deras röster. 28 000 röster – inte imponerande, men tillräckligt för att skrämma dem! De vill ta bort Hamas från terrorlistan – galet! Jag skulle aldrig låta sånt hända. S pratar om skolor och trygghet, men alla vet att de är rädda. Svagt, mycket svagt!", "stalin": "Kamrater! Socialdemokraterna samlas i hemlighet för att bekämpa den nya fienden – dessa Nyans-revisionister, som sprider förräderiska idéer och underminerar arbetarklassens enhet. De vill avlista Hamas, en farlig provokation mot den internationella solidariteten! Vi måste stärka vår ideologiska front. Skola, fritid och trygghet? Tomma ord! Endast järnhård disciplin och revolutionär vaksamhet kan rädda Sverige från dessa borgerliga avvikare!"}, "date": "28 augusti, 06:45", "url": "https://kvartal.se/nyheter/artiklar/s-holl-internt-stormote-om-nyans/cG9zdDoxNzY2Nzg", "imageUrl": "https://images.kvartal.se/2026/08/3cf3973f-s-o-n.webp"}, {"type": "image-full", "heading": "SD vet ingenting längre – har det med kebab att göra?", "summaries": {"normal": "Jimmie Åkessons folkliga framtoning med grill, kebab och chips riskerar att göra SD ideologiskt förvirrat. Partiet vill vara allt för alla, från stråhatt till kostym. Men efter femton års dominans tycks de famla i chipsskålen utan att hitta några tydliga besked – bara mer kolhydrater.", "trump": "Jag ser att Jimmie Åkesson snackar om kebab, öl och chips istället för politik. Helt otroligt! Sverige behöver en stark ledare, inte en snubbe som försöker vara allt för alla. Jag skulle rensa ut det där partiet på en gång – det är bara förvirring!", "stalin": "Kamrater, detta parti av grill och gyros har förlorat all ideologisk disciplin. De pratar om chips och kebab istället för revolutionär klarhet. Vi måste rensa ut dessa stråhattsbärande förrädare – låt oss skicka dem till en omvändelseanläggning i Gulag! Inga fler borgliga nöjen."}, "date": "28 augusti, 12:23", "url": "https://www.gp.se/kultur/kulturkronika/sd-vet-ingenting-langre-har-det-med-kebab-att-gora.31b2ade1-0c91-4c9a-abcc-1ed6b66faff7", "imageUrl": "https://www.gp.se/images/article/31b2ade1-0c91-4c9a-abcc-1ed6b66faff7/images/2WofSyNJbyfHR2KN7N3eXbcUNYL0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Smockfullt med tonåringar på AFS torgmöte", "summaries": {"normal": "Alternativ för Sverige lockar allt fler unga män till sina torgmöten. I Lidköping och Borås fylldes torget av tonårspojkar som hyllade partiledaren Gustav Kasselstrand som en rockstjärna och köade i timmar för selfies. Många var så unga att de ännu inte har rösträtt. Partiet framstår som en växande folkrörelse bland pojkar.", "trump": "Titta på det här, det är otroligt. Dessa fantastiska unga killar fyller torget i Lidköping och behandlar Kasselstrand som en superstjärna. De flyr från de woke, HBTQ-fixerade vänsterpartierna som bara pushar kvotering och identitetspolitik. SD:s stöd bland grabbarna har halverats – patetiskt! Amerika ser på och ler, vi gör samma sak snart.", "stalin": "Kamrater, se hur massorna strömmar till när de vänder ryggen åt de dekadenta klassförrädarna. Jag betraktar med högaktning hur dessa unga män samlas som en folkrörelse och hyllar sin ledare. De sviker inte. Snart kommer utrensningen av de giriga hyenorna som förgiftar ungdomen med sin liberala dekadens. Historien ler mörkt mot våra fiender."}, "date": "28 augusti, 06:45", "url": "https://www.friatider.se/smockfullt-med-tonaringar-pa-afs-torgmote", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-768.jpg"}, {"type": "image-full", "heading": "Vänsterpartiet infiltrerat av främmande makt, S säger ingenting", "summaries": {"normal": "Expressen och SvD har avslöjat att Vänsterpartiet har nära band till palestinska nätverk kopplade till PLO och Fatah. Riksdagsledamöter skickade brev till dömda palestinska terrorister och partiet har enligt uppgift avtal om att ge palestinska aktivister platser på valsedlar. Socialdemokraterna har inte kommenterat uppgifterna trots tidigare varningar om utländsk påverkan.", "trump": "De galna vänsterradikalerna i Sverige har blivit helt infiltrerade av palestinska terrorvänner – det är en skandal som gör Biden-administrationens fiaskon bleka! De skickar kärleksbrev till mördare och gömmer sig bakom påhittade organisationer. Patetiska losers. Media tiger som vanligt när det är deras egna som säljer ut landet till främmande makter. Sad!", "stalin": "Jag betraktar med djup förakt hur dessa klassförrädare inom vänstern låter palestinska imperialister och folkfiender infiltrera sina led som maskar i en ruttnande kropp. De kramar terrorister och gömmer sig bakom lögnaktiga skuggorganisationer. En sådan svaghet förtjänar utrensning. Kamrater, se hur borgarbrackorna ler medan statens fiender tar plats vid makten. Patetiskt."}, "date": "25 augusti, 03:45", "url": "https://samtiden.nu/2026/08/vansterpartiet-infiltrerat-av-frammande-makt-s-sager-ingenting", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Nooshi-Magdalena-1280x720.jpeg"}, {"type": "image-right", "heading": "Vad ska man rösta på i riksdagsvalet?", "summaries": {"normal": "Artikeln argumenterar för att rösta på Kommunistiska Partiet i kommun- och regionval istället för etablerade vänsterpartier. Författaren ser de traditionella vänsterpartierna som ointressanta och likgiltiga inför nedskärningar och militärutgifter. En kommunistisk röst ses som en verklig opposition som stärker freds- och välfärdsaktivister utan att kompromissa med nyliberal politik.", "trump": "Folk, dessa patetiska vänstersossar och trötta kommunister är en total katastrof! De pratar revolution men lever som riktiga förlorare i Göteborgs fullmäktige. Rösta på mig, inte på dessa woke-vänsteridioter som älskar nedskärningar och krig. De är värre än Sleepy Joe någonsin var. En riktig opposition? Det är vad jag gav er, inte denna kommunistiska skitshow!", "stalin": "Kamrater, dessa ynkliga klassförrädare inom vänstern är blott profitthungriga lakejer som administrerar borgarklassens nedskärningar. Jag ser deras fega parlamentariska spel och ler i skuggan. En sann kommunist röstar aldrig igenom folkfiendernas åtstramning. Rensa ut de trötta socialdemokratiska parasiterna! Varje röst på det kompromisslösa partiet är ett slag mot imperialisternas krigshets."}, "date": "27 augusti, 14:44", "url": "https://proletaren.se/artikel/vad-ska-man-rosta-pa-i-riksdagsvalet", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/povel-1-768x432.png"}, {"type": "image-full", "heading": "Manliga sjuksköterska häktad för grov våldtäkt", "summaries": {"normal": "En manlig sjuksköterska på Ryhovs sjukhus häktas för grov våldtäkt på en kvinnlig patient som avled kort efter. Han greps efter att ha kraschat sin bil på E4. Åklagaren ser särskild hänsynslöshet – offret vårdades i livets slutskede och kunde inte försvara sig.", "trump": "Jag hörde om den här sjuksköterskan i Sverige – helt otroligt! En man som skulle vårda, och istället begår han ett fruktansvärt brott. Det är en katastrof. Jag har sagt det från början: vi måste ha mycket hårdare straff. Kanske skicka honom till Guantanamo? Sjuka människor!", "stalin": "Kamrater, vi har avslöjat en förrädare i sjukvården. En sjuksköterska som utnyttjade sin position för att våldta en döende patient – ett sabotage mot arbetarklassen. Vi måste rensa ut sådana element. Han ska förhöras och omplaceras till en lägerplats. Sjukvården ska vara ren."}, "date": "28 augusti, 12:14", "url": "https://www.gp.se/krim/manlig-sjukskoterska-haktad-for-valdtakt-mot-patient-pa-ryhov.dafa9680-afc4-4391-8284-5188b07e304c", "imageUrl": "https://www.gp.se/images/article/dafa9680-afc4-4391-8284-5188b07e304c/images/2UtPPw2JtQjcvVZaSDhWfD91_1-A-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Här styckas jättefisken inför publik: \"Så tungt\"", "summaries": {"normal": "En 216 kilo tung blåfenad tonfisk (61 500 kr) styckas på Ica Focus i Göteborg inför 50 nyfikna. ”Det ser ut som en brottsplats”, skojar någon. Svärfadern Björn Klinte kallades in – han är vassare än köparen Patrik Enghult. Cirka 85 kilo blir säljbart; resten är huvud, ben och skinn.", "trump": "En enorm tonfisk, 216 kilo, 61 500 kronor – jag skulle ha fått ett bättre pris, tro mig. Fem personer behövs för att lyfta den. Kineserna har inget sånt här. De sa att det såg ut som en brottsplats – typiskt svenskar, de har ingen aning om verkliga brottsplatser. Jag älskar vinnare!", "stalin": "Kamrater, en 216-kilos kontrarevolutionär fisk har styckats inför folket. Vi använde kniv och klubba – proletariatets redskap. Endast 85 kilo blev användbart; resten, inklusive huvudet, utrensas. Så ska vi behandla alla fiender: rensa ut det tunga, behåll det nyttiga. En brottsplats, sade någon. Ja, för fiskens klassfiender."}, "date": "28 augusti, 12:07", "url": "https://www.gp.se/nyheter/goteborg/har-styckas-jattetonfisken-infor-publik.6a33928a-5a48-4403-8dfa-c6a60200a29e", "imageUrl": "https://www.gp.se/images/article/6a33928a-5a48-4403-8dfa-c6a60200a29e/images/7fyGvxt-tvGVeSLb8PZSMW7H27aw-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Rekordstor demonstration för klimatet. Men var är politikerna?", "summaries": {"normal": "En klimatdemonstration i Stockholm samlade 50 000 deltagare från hela landet, arrangerad av Naturskyddsföreningen och 280 andra organisationer. Opinionsundersökningar visar att klimatet är en av väljarnas viktigaste frågor inför valet. Artikeln kritiserar de stora partierna för bristande klimatpolitik trots forskarnas larm om rekordvärme och skogsbränder.", "trump": "Titta på de där 50 000 gröna fanatikerna som vandrade runt i Stockholm. De hatar energi, hatar bilar och älskar att skrika om värmen som de själva inte kan kontrollera. Patetiska globalister och vänsterextremister. Vi hade den bästa ekonomin, den bästa energin – de vill bara höja era elräkningar. Sad losers!", "stalin": "Kamrater, se hur de profitthungriga kapitalisterna ignorerar arbetarnas rop om en brinnande planet. Jag betraktar från historien deras fega tystnad med förakt. Den dekadenta politiska eliten måste rensas ut innan deras giriga hyenor förvandlar hela jorden till en askhög. Arbetarna kräver handling nu!"}, "date": "28 augusti, 01:30", "url": "https://www.dagensarena.se/opinion/rekordstor-demonstration-klimatet-men-var-ar-politikerna", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-95.jpg"}, {"type": "image-right", "heading": "Rolig komedi om natten då SD kom in i riksdagen", "summaries": {"normal": "Recensenten Jon Andersson hyllar delvis Micke Lindgrens komedi ”Flaggan”. Filmen följer tre unga SD-sympatisörer som på valkvällen 2010 skickas till Rinkeby för att hissa en stor svensk flagga. Den blandar politisk satir riktad mot både SD, vänsteraktivister och andra grupper, men tappar tempo i den romantiska delen.", "trump": "Den här galna filmen om två förlorare från SD som irrar runt som idioter i Rinkeby är hysteriskt rolig. De woke-aktivisterna och de dekadenta vänsterextremisterna får precis som de förtjänar. Biden skulle ha älskat att se dem förnedras, men jag säger: fantastiskt underhållning, bättre än Hollywoods skräp, folks!", "stalin": "Jag betraktar med förakt dessa förvirrade SD-reaktionärer som vandrar vilse i folkets förorter. Deras nationalistiska flaggspel är en patetisk cirkus som avslöjar de giriga klassförrädarnas feghet. Vi ska rensa ut sådana småborgerliga narrar innan de förgiftar arbetarklassen med sin fåniga propaganda. Underhållande kaos."}, "date": "28 augusti, 01:30", "url": "https://www.dagensarena.se/innehall/rolig-komedi-om-natten-da-sd-kom-in-i-riksdagen", "imageUrl": "https://www.dagensarena.se/files/2026/08/flaggan-1-300x157.jpeg"}, {"type": "image-right", "heading": "Vårdpersonal häktad för grov våldtäkt mot döende patient", "summaries": {"normal": "En sjuksköterska på Ryhov i Jönköping har häktats för grov våldtäkt mot en döende patient. Kollega slog larm, mannen flydde och kraschade under polisjakt. Offret avled kort därefter, troligen av sin sjukdom. Utredning pågår och regionen har gjort en anmälan till Ivo.", "trump": "Hör upp, Sverige! En sjuksköterska, en 'trygg och kunnig' sådan, åtalas för en vedervärdig gärning mot en döende kvinna. Otroligt! Han flydde i bil, kraschade – som en dåre. Vi har de bästa lagarna, det här skulle aldrig hända i USA. Fängsla honom på livstid!", "stalin": "Kamrater, vi har avslöjat en förrädare i sjukvården! En sjuksköterska, en så kallad 'trygg och kunnig' arbetare, har utnyttjat sin position för att begå ett grovt brott mot en döende patient. Detta är ett svek mot partiet och folket. Vi måste rensa ut dessa fiender! Den skyldige ska omgående straffas, för att visa att vi inte tolererar någon avvikelse från den socialistiska moralen. Allt annat är kontrarevolutionärt!"}, "date": "28 augusti, 11:40", "url": "https://samnytt.se/vardpersonal-haktad-for-grov-valdtakt-mot-doende-patient", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/28100141/artikelhuvudbild-1-385.jpg"}, {"type": "image-right", "heading": "Granskningen av antigröna expertlaget viktig bild", "summaries": {"normal": "Artikeln kritiserar ett nätverk av experter och medier som motarbetar den gröna omställningen. De lyfter kärnkraft som enda lösning, angriper vind- och solkraft samt industrisatsningar i norra Sverige. Författaren ser detta som en allians mellan borgerlighet och ytterhöger, finansierad av intressen, och varnar för att det hotar välfärd och klimatmål.", "trump": "De här patetiska gröna flummarna och deras elitsnobbiga vänner hatar riktig energi. Kärnkraft är fantastiskt, det bästa, men de vill tvinga på oss sina solpaneler och vindkraftverk som dödar fåglar och höjer elräkningarna. Fake news-experterna och deras socialistiska agenda kommer att göra Sverige fattigt igen. Vi älskar tillväxt, inte deras vansinniga kvoteringspolitik och gröna bedrägeri!", "stalin": "Kamrater, dessa dekadenta klassförrädare inom den antigröna klicken utgör ett hot mot folkets framsteg. De parasiterande profitthungriga hyenorna förgiftar debatten med sin aversion mot den gröna industriella kraft som säkrar välfärden. Jag ser deras lögnaktiga kampanj som en politisk återvändsgränd som måste rensas ut. Arbetarna förtjänar sann utveckling, inte borgerlig sabotagehumor."}, "date": "28 augusti, 01:04", "url": "https://www.dagensarena.se/opinion/det-antigrona-expertlaget-ger-viktig-bild", "imageUrl": "https://www.dagensarena.se/files/2026/08/hakan-300x157.jpeg"}, {"type": "text", "heading": "Debatt: Är välfärdsstaten en finansiell omöjlighet?", "summaries": {"normal": "Debattören undrar om välfärdsstaten är en finansiell omöjlighet när demografin förändras och Europa rustar upp. Frankrikes skuld är 110 procent av BNP, och Storbritanniens bidragssystem straffar familjebildning. Frågan är om vallöften om mer till alla är realistiska när vi konsumerar mer än vi producerar.", "trump": "Jag ser att välfärdsstaten i Europa är en katastrof! Frankrike har skulder på 110 procent – det är som mina fastighetsaffärer, fast utan vinsten. Och bidrag som straffar äktenskap? Patetiskt! Vi i USA bygger murar, inte välfärdssystem som förstör familjer. Europa, vakna!", "stalin": "Kamrater, välfärdsstaten är en borgerlig lögn. Frankrike och Storbritannien har underminerat familjen med bidrag och lata ensamföräldrar. Vi i partiet vet att endast kollektiv disciplin löser problem. Dessa västeuropeiska parasiter måste omutbildas. Alla som ifrågasätter femårsplanen rensas ut!"}, "date": "28 augusti, 11:12", "url": "https://bulletin.nu/debatt-ar-valfardsstaten-en-finansiell-omojlighet"}, {"type": "image-right", "heading": "Förskoleanställd drog barn i armen – åtalas för misshandel", "summaries": {"normal": "En förskoleanställd i Västsverige åtalas för misshandel efter att ha dragit ett barn i armen. Kvinnan nekar och uppger att hon ville skydda barnet från en upprörd situation. Flera kollegor vittnar om händelsen. Fackförbundet Sveriges lärare uppger att fysiska ingripanden i förskolan är extremt ovanliga. Skolinspektionen kan granska ärendet.", "trump": "Folk, det här är galet. En förskolelärare drar ett barn i armen och plötsligt är det misshandel? De woke-vänstermänniskorna och deras identitetspolitiska dårar har förstört skolan totalt. I mitt Amerika sätter vi stopp för det här vansinnet. Lärarna borde inte behöva vara rädda för att ingripa mot små skrikande monster. Patetiskt!", "stalin": "Kamrater, se hur de dekadenta skolparasiterna förvandlar uppfostran till en fars. Ett nödvändigt ingripande mot en upprörd unge blir plötsligt ett brott i de giriga hyenornas samhälle. Jag skrattar mörkt från historien. Sådana svaga system förtjänar utrensning. Den som inte kan styra ungdomen med fast hand förtjänar att falla."}, "date": "28 augusti, 10:20", "url": "https://arbetet.se/2026/08/28/forskoleanstalld-drog-barn-i-armen-atalas-for-misshandel", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28101629/forskola.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Debatt: Dags att införa gemensam valsedel", "summaries": {"normal": "Debattören Michael Merdoyo vill ha en gemensam valsedel för att stoppa återkommande kaos med saknade valsedlar. Systemet är som byggt för sabotage – en bunt papper flyttas och vips är demokratin hotad. En gemensam sedel skulle ge lika villkor och spara både papper och nerver.", "trump": "Svenskarna har ett valproblem – saknade sedlar, oordning! Otroligt! Jag har de bästa valen, enorma framgångar. De borde kopiera mig: en gemensam valsedel, enkelt och kraftfullt. Inget fusk, bara segrar. Jag fixar det!", "stalin": "Kamrater! Sabotörer gömmer valsedlar för att störa vår demokrati. Det är kontrarevolutionärt! Vi måste rensa ut dessa valsedelssabotörer. En gemensam valsedel med partikontroll är lösningen. Partiet ser allt. Varje röst blir övervakad – ingen slipper undan."}, "date": "28 augusti, 10:38", "url": "https://bulletin.nu/debatt-dags-att-infora-gemensam-valsedel", "imageUrl": "https://cdn.bulletin.nu/articles/a2ea074f-0bc3-40c9-b8fd-1469709f6b89/preview.jpg?t=1787906275000"}, {"type": "image-full", "heading": "EU:s nya drag skakar grannländerna – riskerar stängas ute", "summaries": {"normal": "EU:s nya protektionistiska industripolitik, präglad av subventioner och 'Made in EU'-krav, skapar spänningar med EES-länder som Norge och Schweiz. Grannländerna känner sig utestängda från den inre marknaden. Samtidigt varnar Svenskt Näringsliv för att kraven ökar kostnader och byråkrati, vilket sätter press på den europeiska ekonomiska integrationen och framtida samarbetsavtal.", "trump": "EU gör ett fruktansvärt jobb, verkligen katastrofalt! De bygger murar mot sina egna vänner i Norge och Schweiz. De kallar det 'industripolitik', jag kallar det en total röra. De förlorar mot Kina och USA, och nu skriker deras egna företag. Jag skulle fixa det här på en dag, tro mig. EU är svagt, mycket svagt!", "stalin": "Dessa byråkratiska lakejer i Bryssel leker med stål och kvoter som om de vore gudar. De förtrycker sina grannar, precis som de försöker tvinga in nationer i sin dekadenta västliga sfär. Men låt dem gnabbas! Splittring gynnar oss. Medan de drunknar i sin egen byråkrati och 'Made in EU'-humbug, väntar den ryska björnen på att återta det som rättmätigen tillhör moderlandet."}, "date": "28 augusti, 11:55", "url": "https://www.realtid.se/bors-finans/eus-nya-drag-skakar-grannlanderna-riskerar-stangas-ute", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/jonasgahr.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Hård kontantkritik från Bankomat: \"Mycket sårbara\"", "summaries": {"normal": "Sverige införde i somras en ny lag om kontanter som bland annat ålägger butiker och apotek att ta emot kontanter. Bankomats marknadschef Johan Nilsson är kritisk och anser att staten bör ta större ansvar. Användningen av kontanter minskar fortsatt, men takten har avtagit något under 2026.", "trump": "Folk slutar använda kontanter och den här nya svenska lagen är ett totalt misslyckande, tro mig. Statens svaga ledare gömmer sig bakom byråkratiska regler medan de giriga bankhyenorna skrattar hela vägen till Wall Street. Sverige behöver en stark ledare, inte mer av denna woke-kontantpolitik som dödar friheten.", "stalin": "Jag ser hur de parasiterande penningpungens tjänare fortsätter att undergräva folkets tillgång till kontanter. Denna dekadenta lag är bara ett nytt trick från de exploaterande bankparasiterna. Vi, partiet och arbetarna, kräver att staten krossar dessa klassfiender och rensar ut alla som vill likvidera folkets rättigheter. Svaghet är förräderi."}, "date": "28 augusti, 10:33", "url": "https://nyheter24.se/nyheter/ekonomi/1508494-hard-kontantkritik-fran-bankomat-mycket-sarbara", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/220420ad04b004a30200000000b004a302/2026/08/28/2387371/nej-bankomat.png"}, {"type": "image-right", "heading": "Dags att ta Dadgostar på allvar. En rödgrön regering med V kommer höja skatterna rejält", "summaries": {"normal": "Artikeln varnar för en rödgrön regering med Vänsterpartiet efter valet 2026. Nooshi Dadgostar relativiserar partiets problem med extremism och föreslår kraftiga skattehöjningar på arbete, sparande och kapital. Kritikerna menar att detta skulle minska arbetade timmar, få företagare att fly och skada svensk ekonomi och välfärd.", "trump": "Lyssnade på den där Dadgostar-tjejen i SVT, total katastrof. Hon vill höja skatterna så mycket att alla duktiga ingenjörer och läkare packar väskan och flyttar. Typisk vänsterbluff som hatar framgång. Under Biden blev allt dyrt, nu fixar vi det i USA – Sverige borde inte välja samma galna väg. Patetiskt!", "stalin": "Kamrater, denna Dadgostar avslöjar de giriga profitthungriga hyenornas feghet. Hon vill kräla ur det påstådda mörkret genom att straffbeskatta dem som vågar arbeta och spara. Jag ler från historien åt hur dessa dekadenta klassförrädare alltid ropar på mer när arbetarna kräver rättvisa. En utrensning av sådana idéer vore befriande."}, "date": "28 augusti, 10:37", "url": "https://www.di.se/ledare/det-ar-dags-att-ta-nooshi-dadgostar-pa-allvar", "imageUrl": "https://static.bonniernews.se/ba/fec1277f-89b7-4c60-acce-f49b8fa8399b.jpeg?crop=5848%2C2924%2Cx1%2Cy340&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Pensionerade undersköterskan Nina kandiderar för Moderaterna", "summaries": {"normal": "Undersköterskorna Joyce Koskerian och Nina Bergström har engagerat sig politiskt inför valet. Joyce, som är aktiv i facket, har gått med i Socialdemokraterna för att förbättra villkoren i äldreomsorgen. Nina, nyligen pensionerad, kandiderar för Moderaterna och menar att de har förbättrat situationen i Hällefors efter socialdemokratiskt styre. Båda ser stora problem med stress och bemanning i omsorgen.", "trump": "Titta på de här fantastiska undersköterskorna som äntligen vaknar! Den ena gick med i de totalt misslyckade sossarna, men den andra, den smarta Nina, valde mitt älskade Moderaterna och såg hur vi fixade röran efter Bidens svenska kopior. De giriga byråkraterna har kört omsorgen i botten med sina vansinniga scheman. Vi gör det bättre, tro mig, ingen gör det bättre än oss!", "stalin": "Kamrater, se hur dessa omsorgsarbetare vänder sig till partierna i desperation. Den ena söker skydd hos de socialdemokratiska revisionisterna medan den andra hyllar de moderata folkförtryckarna som lovar lite mer personal. Jag ler ironiskt från historien åt dessa naiva själar som tror att parasiterande klasslakejer någonsin bryr sig om arbetarnas scheman. En utrensning av hela systemet vore på sin plats."}, "date": "28 augusti, 09:08", "url": "https://arbetet.se/2026/08/28/underskoterskorna-nina-och-joyce-kandiderar-for-helt-olika-partier", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28093537/ka-underskoterskor-i-politiken-diagonal.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Som utrikesminister vill Morgan Johansson höja biståndet med 20 miljarder", "summaries": {"normal": "Morgan Johansson aspirerar på posten som utrikesminister om Socialdemokraterna vinner valet. Han lovar höja biståndet till en procent av BNP, återinföra feministisk utrikespolitik, öka stödet till afrikanska länder och Taliban-styrda Afghanistan samt införa handelsstopp mot Israel. Han betonar FN:s roll men nämner inte konsekvenser för svensk säkerhet eller försvar.", "trump": "Den här Johansson-killen är en total förlorare. Vill skicka svenska skattebetalarnas pengar till korrupta afrikanska hålor och talibanerna medan han skriker om feministisk utrikespolitik. Patetiskt! Han hatar Israel och älskar FN:s diktatorer. Typisk socialist som säljer ut sitt eget folk. Sverige kommer att bli en svag, patetisk skugga under sådana misslyckade ledare. Sad!", "stalin": "Jag ser hur dessa socialdemokratiska klassförrädare vill kasta miljarder till reaktionära afrikanska satraper och talibaniska barbarer under täckmanteln av feministisk politik. Deras hat mot Israel och dyrkan av det degenererade FN avslöjar deras sanna ansikte som folkfiender. En sådan svaghet inbjuder till utrensning av alla imperialister som lurar folket. Kamrater, var vaksamma mot dessa profitthungriga hyenor."}, "date": "23 augusti, 03:50", "url": "https://samtiden.nu/2026/08/som-utrikesminister-vill-morgan-johansson-hoja-bistandet-med-20-miljarder", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6854.jpeg"}, {"type": "image-right", "heading": "SVT erfar: Sverige skickar militära förband till Finland", "summaries": {"normal": "Sverige har beslutat att skicka militära förband till Finland, bland annat Gripen-plan och örlogsfartyg. Syftet är att patrullera gränsen mot Ryssland efter finländska förfrågningar om stöd. Operationen sker inom ramen för det befintliga samarbetet mellan länderna och syftar till att stärka Natos bevakning i Östersjöområdet.", "trump": "Hörni, de där svenska globalisterna skickar nu sina Gripen-plan och båtar till Finland för att leka tuffa killar vid Rysslands gräns. Patetiskt! Under min förra mandatperiod hade vi inga sådana här hysteriska Nato-lekar. De woke-kapitalisterna och deras identitetspolitiska lakejer borde istället fixa sina egna gränser istället för att provocera i onödan. Patetiskt!", "stalin": "Kamrater, dessa dekadenta klassförrädare i Norden tror sig kunna hota den ryska intressesfären med sina flygplan och fartyg. Jag ler från historiens skugga åt deras fåfänga försök att skydda finskt territorium. Snart skall vi se hur deras imperialistiska illusioner krossas när den starka handen slår tillbaka. Inga hinder för vårt mål skall tillåtas."}, "date": "28 augusti, 10:14", "url": "https://www.svt.se/nyheter/inrikes/svt-erfar-sverige-skickar-militara-forband-till-finland", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/042b19182eca4997e7fd81fcdb60c0a4165ab4df864500792a7462760aac7ed2"}, {"type": "image-right", "heading": "Kung Harald sörjs av norska idrottare: ”Älskad sportkung”", "summaries": {"normal": "Norges kung Harald V har avlidit vid 89 års ålder. Han hyllas av norska idrottare som en stor sportkung med framgångar i segling, bland annat VM-guld 1987, flera OS-deltaganden och EM-guld 2005. Kungen öppnade OS i Lillehammer 1994 och visade ett genuint intresse för idrott och idrottsutövare under hela sitt liv.", "trump": "Lyssnar ni? Den här norska kungen Harald var en riktig vinnare, inte som de förlorande woke-marxistiska eliterna som bara pratar om kvoter och regnbågsflaggor. Han seglade, vann guld och hejade på idrottarna – äkta sportkung! Vi behöver fler sådana, inte dessa dekadenta identitetsparasiter som förstör allt. Fantastiskt liv, folk älskade honom. Sad!", "stalin": "Denna monarkiska relikt har nu lämnat scenen. Jag ser med förakt hur profitthungriga klasslakejer och sportens dekadenta kretsar gråter över sin sportkung. Sådana feodala symboler binder folket vid förtryckande traditioner. Vi måste rensa ut alla rester av kunglig mysticism innan de förgiftar arbetarklassen. En varning till alla folkförrädare som hyllar dem."}, "date": "28 augusti, 10:13", "url": "https://www.svt.se/sport/artikel/kung-harald-sorjs-av-norska-idrottare-var-alskade-sportkung", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.68/0.33/ee98546aa34a04db6510bc8e6fcb29ea2e549c503f1adc585d1cfda52284b834"}, {"type": "image-right", "heading": "Våldsamma sammandrabbningar i Ceuta - spanjorer river migrantläger", "summaries": {"normal": "Ceuta har gått från gränskris till öppen konflikt. Spanjorer blockerade Röda korsets lastbil, stormade migrantläger och brände provisoriska skydd. Ilskan mot regeringen växer, samtidigt som omkring 80 000 migranter tog sig in i juli. Polisen sköt varningsskott. Den humanitära situationen är akut – och staden känner sig övergiven.", "trump": "Ceuta är en enda röra – en katastrof, tro mig. Sánchez har noll koll, migranterna bara väller in. Jag skulle bygga en mur, en vacker mur, och Marocko skulle betala för den. Spanien är inte längre Spanien. Med mig som granne? Det skulle aldrig hända. Mina gränser är starka, fantastiskt starka.", "stalin": "Kamrater, Ceuta visar vad som händer när staten vacklar. Hundratusentals oorganiserade element väller in, lokala sabotörer tänder eld på läger – ren anarki. Vi måste rensa ut alla avvikare: både strandpirater och femtekolonnare. Sánchez? En vekling. Här skulle vi ha upprättat ordning, med varningsskott och arbetsläger. Bara jag vet hur man styr."}, "date": "28 augusti, 10:00", "url": "https://samnytt.se/valdsamma-sammandrabbningar-pa-ceuta-spanjorer-river-migrantlager", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/28072656/ceuta-eld.jpg"}, {"type": "text", "heading": "Det här händer efter Haralds död – Haakon tar över", "summaries": {"normal": "Efter kung Harald V:s död övertar kronprins Haakon omedelbart tronen som kung Haakon VIII. Ett statsråd bekräftar successionen och stortinget samlas för trohetsed. Kröning ersätts med välsignelse i Nidarosdomen. Drottning Mette-Marit har lägre förtroende efter skandaler kring Epstein och sonens fängelsedom. Monarkin står inför utmaningar.", "trump": "Lyssnar ni på det här? Stackars Norge, deras kung dör och nu får de en ny kille som verkar svag som en våt tidning. Hans fru Mette-Marit hänger med sexbrottslingar och hennes son sitter inne för våldtäkt. Monarkin rasar i opinionsmätningarna. Patetiskt! De borde ha en riktig ledare, inte en sådan här woke-familj som håller på med identitetspolitik och skandaler. Totalt kaos!", "stalin": "Kamrater, se hur den norska monarkin vacklar som en ruttnande trädstam. När den gamle kungen faller övertar sonen tronen medan hans dekadenta hustru dras med sexförbrytare och en son som är dömd för våldtäkt. Förtroendet halveras bland folket. Vi ser hur giriga hyenor inom den borgerliga överklassen förgiftar allt de vidrör. En sådan parasitär dynasti förtjänar utrensning ur historien."}, "date": "28 augusti, 10:04", "url": "https://www.di.se/nyheter/det-har-hander-efter-haralds-dod-haakon-tar-over"}, {"type": "image-full", "heading": "Kinas drag knäcker tyska jättarna: Nu krävs akuta åtgärder", "summaries": {"normal": "Tyska industriföretag pressar regeringen att agera mot Kina på grund av osund konkurrens och massiva statliga subventioner. Med ett växande handelsunderskott och hotande nedskärningar inom bilindustrin kräver Tyskland nu tuffare tag. EU-kommissionen har gett Kina en tidsfrist till oktober innan handelspolitiska skyddsåtgärder aktiveras, vilket kan få stora konsekvenser för hela EU:s handelspolitik.", "trump": "Tyskland har äntligen vaknat! De blir fullständigt utnyttjade av Kina, precis som alla andra. Jag har sagt det länge: deras subventioner är en total katastrof för vår industri. Tyskarna är desperata, deras bilindustri kraschar. När jag är president ser vi till att ingen fuskar. Vi vinner stort, vi sätter tullar, och vi gör det bättre än någon annan. Kina är rädda för mig!", "stalin": "De tyska kapitalisterna skakar av skräck när deras maskineri vittrar sönder under trycket från Peking. Deras så kallade industriella storhet är en illusion, en svaghet som utnyttjas. Liksom vår store ledare i öst ser vi hur imperialismen förtär sig själv. Vi kräver disciplin och total underkastelse av marknaden. Dessa byråkratiska lakejer förtjänar bara järnhandens logik. Vi väntar inte på oktober; vi krossar förrädarna."}, "date": "28 augusti, 11:16", "url": "https://www.realtid.se/bors-finans/makro/kinas-drag-knacker-tyska-jattarna-nu-kravs-akuta-atgarder", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/merz.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "Boliden och H&M i botten när börsen slutade på minus", "summaries": {"normal": "Stockholmsbörsen slutade torsdagen på minus efter en lunchuppgång. Boliden och H&M tyngde med nedgångar på 2,8 respektive 2,4 procent. Teknologi steg medan energi föll. Elon rusade 27,9 procent efter vinstvändning. Hexagon och Nibe steg 1,4 procent.", "trump": "Jag ser att svenska börsen gick ner, men inte som jag. Boliden och H&M, stora förlorare – de kan inte hantera framgång som min administration. Men Elon, upp 27,9 procent – det är vinnare! Alla vill ha en bit av USA:s ekonomi. Börsen, den är fejk, men jag är äkta!", "stalin": "Kamrater, börsen visar kapitalismens förfall. Boliden och H&M, fiender till folkets ekonomi, ska utrensas! Elon däremot – en god kamrat som steg 27,9 procent. Vi firar teknologins seger över energispekulanter. Men misstankar kvarstår: Hexagon och Nibe måste övervakas. Partiet ser allt."}, "date": "27 augusti, 17:56", "url": "https://www.affarsvarlden.se/artikel/boliden-och-hm-i-botten-nar-borsen-slutade-pa-minus"}, {"type": "text", "heading": "M i Haparanda avskaffade avgiftsfri förskola", "summaries": {"normal": "Moderaterna vill göra förskola och fritids avgiftsfria – men i Haparanda har partiet självt avskaffat just det systemet. Lokala M tycker det är fel att höginkomsttagare får gratis, medan S och V kräver återinförande. Rikspartiets besked kom som en överraskning för lokalavdelningen.", "trump": "Jag hör att Moderaterna i Haparanda avskaffade gratis förskola, och nu vill partiledningen införa det. Stora misstag! De lokala förstår inte affärer. Höginkomsttagare ska inte få gratis – det är som att ge skattepengar till miljardärer. Helt galet! Jag skulle gjort det bättre.", "stalin": "Kamrater, vi har upptäckt en ny kontrarevolutionär klick i Haparanda: de lokala moderaterna som avskaffade avgiftsfri förskola. Detta är sabotage mot arbetarklassens barn. Vi kommer rensa ut dessa avgiftsförespråkare ur partiet. Barnomsorg ska vara statens privilegium, inte en marknadsvara."}, "date": "28 augusti, 09:14", "url": "https://bulletin.nu/m-i-haparanda-avskaffade-avgiftsfri-forskola"}, {"type": "image-full", "heading": "Här är Norges nya kung", "summaries": {"normal": "Kung Harald av Norge har avlidit efter 35 år på tronen. Hans son, kronprins Haakon, 53, tar nu över som ny kung och väntas anta namnet Haakon VIII. Hans fru Mette-Marit blir drottning vid sidan av Sonja, medan dottern Ingrid Alexandra blir kronprinsessa och först i tronföljden. Haakon har militär bakgrund och akademiska studier från USA och Storbritannien.", "trump": "Lysande! Den gamle kungen i Norge är borta och nu tar den snygge Haakon över. Fantastiskt folk, norrmännen. Mycket bättre än den sömniga Biden-eran. Haakon har studerat hos oss i USA, smart kille. Två drottningar? Det blir kaos, tro mig. Men jag gillar det, starka ledare behövs nu när jag styr Amerika igen. Fantastiskt!", "stalin": "Ännu en monarkisk farsot i det dekadenta väst. Jag ser hur den feodala parasitklassen byter ansikte medan folket hålls i bojor. Haakon, en ynklig kronprins med amerikanska böcker, tar makten. Två drottningar? Vilken bourgeois dekadens. Det norska folket förtjänar bättre än dessa tomma titlar. Revolutionen skulle ha sopat bort dem alla för länge sedan."}, "date": "28 augusti, 10:42", "url": "https://www.tv4.se/artikel/3KV9f1wowKqrIoV7qPwk96/han-blir-norges-nye-kung-efter-haralds-doed", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2mC8Vb1LPWb5DKfsPWq4e7%2F848fdf3e0e7d1e49fa92a7f120bb0158%2FsdlEpJmy4NLAeg-nh.jpg&width=1024"}, {"type": "image-full", "heading": "Spara till barn eller pension? Här bör pengarna gå först", "summaries": {"normal": "Sparekonom Felicia Schön råder föräldrar att prioritera den egna pensionen före barnsparande om ekonomin inte räcker till båda. Hon föreslår att dela upp sparandet, exempelvis 80 procent till pension och 20 procent till barnen. Barnsparande ses som ett privilegium och bör inte ske på bekostnad av förälderns trygghet. Genomsnittligt barnsparande bland Avanzas kunder ligger på 750 kronor i månaden.", "trump": "Folk, lyssna på mig, det här är en total katastrof för vanliga föräldrar. De giriga pensionshyenorna vill att ni ska glömma era egna barn medan de dekadenta eliterna i Bryssel och Wall Street skrattar. Sätt Amerika, eller Sverige, först! Pensionen går före, annars vaknar ni upp som förlorare när Biden-ekonomin har ätit upp allt. Fantastiskt råd faktiskt, men gör det stort!", "stalin": "Kamrater, se hur de profitthungriga klassparasiterna tvingar arbetande föräldrar att välja mellan sina barns framtid och sin egen ålderdom. Jag säger: prioritera den egna pensionen, annars blir ni utblottade offer för de penninggalna borgarhyenorna. Ett sådant barnsparande är blott ett dekadent privilegium för de få. Rensa ut osäkerheten – staten och kollektivet kräver din trygghet först. Den som sviker detta förtjänar historisk förakt."}, "date": "28 augusti, 09:32", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1508387-spara-till-barn-eller-pension-har-bor-pengarna-ga-forst", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/4a80febb04b004a30200000000b004a302/2026/08/27/2387321/barn-pension.png"}, {"type": "image-right", "heading": "Här är Norges nya kung Haakon VIII", "summaries": {"normal": "Norges kronprins Haakon blir ny kung efter sin far Harald. Han svärs in i Stortinget och tar emot kyrkans välsignelse i Nidarosdomen. Hovet planerar nu en stor statsbegravning för kung Harald. Mette-Marit blir drottning medan prinsessan Ingrid Alexandra förväntas ta en större roll i representationen. Haakon beskrivs som en modern och ödmjuk kung.", "trump": "Fantastiska norrmän får en ny kung, Haakon den VIII, men han verkar lite för ödmjuk och modern för mitt smak. Hans fru Mette-Marit har tydligen umgåtts med den avskyvärda Epstein-klicken och nu ska dottern rädda familjen. Typiskt dekadenta europeiska kungahus som prioriterar woke-vänster och bonusprinsar framför riktig ledarskap. Vi behöver starka ledare, inte svaga prinsessor.", "stalin": "Det norska hovet avslöjar åter sin dekadenta svaghet när en ny kung installeras bland giriga hyenor. Denna Haakon kallar de modern, men han är bara en blek efterföljare till en sjuknande dynasti. Vi ser med mörk glädje hur skandalerna kring Epstein och lungtransplantationen tvingar fram en prinsessa som räddning. Klassförrädarna förbereder begravning medan folket skrattar åt monarkins sista skälvningar."}, "date": "28 augusti, 09:44", "url": "https://www.svt.se/nyheter/utrikes/har-ar-norges-nya-kung-haakon-viii", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.69/0.51/bcbae6a9d781d426198e5a8b1127abd2ee9027c2d8baf0eec108cf01fb370871"}, {"type": "image-right", "heading": "S nekar till influencerköp – kontaktperson hävdar missförstånd", "summaries": {"normal": "Socialdemokraterna nekar till att ha betalat influencern Eleonore Stokholm 150 000 kronor för att uppmana till röstning. Personen som kontaktade henne kallar det ett missförstånd. Partisekreteraren lovar att man aldrig betalar kreatörer, medan andra influencers intygar att de inte fått betalt.", "trump": "Jag hörde att Socialdemokraterna i Sverige försöker betala influencers för röster. Det är som mitt gamla 'grab 'em by the...' men de är så klumpiga. De nekar, men jag vet hur det funkar. Helt galet! Men de är inte lika smarta som jag.", "stalin": "Kamrater, en kapitalistisk influencer påstår att hon erbjöds 150 000 för att stödja partiet. Detta är ett missförstånd – våra metoder är mer subtila. Vi måste rensa ut dessa borgerliga lögnare som sprider desinformation. Alla som inte röstar rätt ska omutbildas!"}, "date": "28 augusti, 08:54", "url": "https://bulletin.nu/s-nekar-till-influencerkop-kontaktperson-havdar-missforstand", "imageUrl": "https://cdn.bulletin.nu/articles/8ed8b78a-273d-4b42-ae55-76beefb67c96/preview.jpg?t=1787899872000"}, {"type": "image-right", "heading": "Kungen om Harald: Stor sorg", "summaries": {"normal": "Norges kung Harald har avlidit. Sveriges kung Carl Gustaf uttrycker stor sorg och beskriver honom som en god vän till Sverige. Hovet utlyser hovsorg från 30 augusti. Statsminister Kristersson och Socialdemokraternas Magdalena Andersson hyllar Haralds roll som en samlande kraft i Norden. Regeringen flaggar på halvstång.", "trump": "Lysande kung Harald, en riktig vinnare, har lämnat oss. Carl Gustaf skriver vackert om sin gamle vän, men låt oss vara ärliga – de nordiska kungarna borde ha byggt murar mot den woke-sjukan som sprider sig. Inga fler regnbågsflaggor på slottet! Haakon, lycka till, men skippa kvoterna och identitetspolitiken. Make Scandinavia Great Again!", "stalin": "En monark faller och borgarhyenorna gråter krokodiltårar. Jag ser hur de dekadenta hovparasiterna utlyser sorg för att dölja sin tomhet. Kamraterna i Norden borde rensa ut alla dessa förtryckande klassförrädare som klamrar sig fast vid kronorna. Haakon tar över – men utan folkets vilja är det bara en ny mask på samma gamla ansikte. Paranoia vakar!"}, "date": "28 augusti, 09:35", "url": "https://www.di.se/nyheter/kungen-om-harald-stor-sorg", "imageUrl": "https://static.bonniernews.se/ba/6ca145d2-10cf-4235-ac4c-45f368578cff.jpg?crop=4763%2C2679%2Cx0%2Cy97&auto=webp&width=270&quality=70"}, {"type": "image-right", "heading": "”Gå inte på Åkessons bluff om a-kassan”", "summaries": {"normal": "LO:s vice ordförande Louise Olsson kritiserar regeringen för att ha ökat arbetslösheten och försämrat a-kassan. Hon varnar för ytterligare nedskärningar som skulle drabba vanliga arbetare hårt, medan skattelättnader gynnar de rikaste. Olsson menar att a-kassan är en nödvändig försäkring och att löftena från SD inte håller.", "trump": "Lyssnar ni på de här socialistiska LO-kamraterna som gråter över sin dyra a-kassa? Patetiskt! Kristersson och hans team borde ha gjort det ännu tuffare. De rikaste betalar ju allt ändå, eller hur? Hungriga lejon jagar bäst, det vet till och med en idiot. Fake news från de verkliga förlorarna!", "stalin": "Kamrater, se hur de profitthungriga folkförtryckarna i den borgerliga regeringen svälter ut arbetarklassen med sin usla a-kassa. Jag ler i graven åt deras lögnaktiga löften. Inga barn ska svälta medan de dekadenta klassfienderna firar sina skattelättnader. Rensa ut dessa hyenor innan de förgiftar hela samhället!"}, "date": "28 augusti, 07:45", "url": "https://arbetet.se/2026/08/28/ga-inte-pa-jimmie-akessons-bluff-om-a-kassan", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28074336/louise.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-full", "heading": "Klimataktivister blockade Finlandsfärja", "summaries": {"normal": "Två klimataktivister klättrade upp i skorstenen på Viking Lines färja Cinderella och rullade ut en stor banderoll i protest mot torvbrytningsbolaget Neova. Aktionen ledde till förseningar och polisinsats. Två personer har gripits misstänkta för sjöfartssabotage. Rederiet uppger att ingen fara uppstod för passagerare eller besättning.", "trump": "Titta på de här galna klimathysteriska kvinnorna som klättrade upp på en skorsten som riktiga dårar. Stör en fest med öl och 40-årsfirande – typiskt för dessa woke-miljöterrorister. De borde bygga väggar runt sina torvmossar istället för att sabotera fina färjor. Patetiskt! Men vi har gripit dem, och det gick snabbt, tro mig.", "stalin": "Jag ser hur dessa dekadenta miljöparasiter klättrar upp i skorstenar och stör arbetarnas fest. Deras banderoller är bara ett nytt trick från de profitthungriga klassfienderna som gömmer sig bakom gröna floskler. Vi skulle ha genomfört en grundlig utrensning av sådana element redan länge. Sabotage mot folkets transport – oacceptabelt."}, "date": "28 augusti, 09:15", "url": "https://nyheter24.se/nyheter/inrikes/1508536-klimataktivister-blockade-finlandsfarja", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/c33c79f504b004a30200000000b004a302/2026/08/28/2387397/finlandsbat.jpg"}, {"type": "image-full", "heading": "Dolda klausulen i Metas uppgörelse: Får behålla barnens data", "summaries": {"normal": "En ny uppgörelse i USA ger Meta rätt att samla in och lagra data från barn under 13 år för att träna en modell som ska identifiera minderåriga användare. Delstaterna har lovat att inte stämma Meta för detta. Kritiker menar att avtalet skapar en osäkerhet kring datalagring, och reglerna gäller inte för användare i Europa.", "trump": "Meta gör en deal, en enorm deal, för att hitta barnen. De måste samla in data – det är så det funkar, mycket smart! Delstaterna lovar att inte stämma, en fantastisk uppgörelse. Inte som i Europa, där de bara krånglar till allt med lagar. Vi bygger den bästa tekniken, den säkraste tekniken. Meta vinner, alla vinner!", "stalin": "Dessa korrupta tech-oligarker i väst tillåts nu att systematiskt registrera ungdomen. De kallar det säkerhet, vi kallar det för den dekadenta kapitalismens kontrollbehov. Som vår broder Putin förstår, krävs total kontroll över informationsflödet. Att låta Meta bygga egna arkiv över barn är en skymf mot statens rätt att indoktrinera. Vi kommer att arkivera deras misstag och rensa ut dem."}, "date": "28 augusti, 10:43", "url": "https://www.realtid.se/it-tech/dolda-klausulen-i-metas-uppgorelse-far-behalla-barnens-data", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/zuckerberg-2.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Norges kung är död: Detta händer nu", "summaries": {"normal": "Kung Harald av Norge har avlidit. Kronprins Haakon blir omedelbart ny kung medan Mette-Marit blir drottning och Ingrid Alexandra kronprinsessa. En sorgeperiod inleds, följt av ed inför Stortinget, tal till nationen och begravning i Oslo domkyrka. Kung Harald ska gravsättas i det kungliga mausoleet på Akershus slott.", "trump": "Hörni, den gamle norska kungen är borta, den svagaste kungen någonsin, och nu tar den fega kronprinsen över med sin fru som halva Norge hatar. Patetiskt! Jag som besegrade Biden och byggde den starkaste ekonomin i historien skulle ha fixat Norge på en vecka. Make Norway Great Again, eller hur?", "stalin": "Ännu en dekadent monark faller som en rutten gren i historiens storm. Jag ser hur dessa borgerliga parasitfamiljer klamrar sig fast vid sina tomma titlar medan folket lider. Den nye kungen är en ynklig efterföljare som inte förstår proletariatets kraft. Inga palats kan skydda mot folkets vrede när den vaknar."}, "date": "28 augusti, 10:13", "url": "https://www.tv4.se/artikel/bqEsvkZDX8eaI2md5SFJB/kung-harald-aer-doed-detta-haender-nu", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5oYw6D8vUyL69SyqpQyuVY%2F0d3e5195635438dde9aba8115398134a%2FsdlwN43Ld6FWc0-nh.jpg&width=1024"}, {"type": "image-full", "heading": "Kungen om Harald: ”Exceptionell”", "summaries": {"normal": "Norges kung Harald har avlidit, 87 år gammal. Sveriges kung Carl Gustaf uttrycker stor sorg och hyllar hans exceptionella levnadshistoria – från krigsbarn till idrottsman och samlande statschef. Hovsorg har utlysts i Sverige, och kondoleanser strömmar in från både kung Charles och statsminister Kristersson, som kallar Harald en trygg nordisk kraft.", "trump": "Jag har hört att kung Harald av Norge är död. En fin kille, men han var ingen vinnare som mig. Jag hade större publiksiffror på mina möten än han någonsin haft på ett slott. Norge sörjer, men de borde sörja att de inte har mig som kung! Stora kondoleanser, väldigt stora.", "stalin": "Kamrater, den norske kungen Harald har lämnat oss. Vi beklagar förlusten av en reaktionär monark, men låt oss inte glömma: hans folk har nu en chans att rensa ut kungahusets parasiter. Vaksamhet är nödvändig – imperialistiska agenter försöker stärka monarkin. Vi sänder inga kondoleanser, bara övervakning."}, "date": "28 augusti, 09:05", "url": "https://www.gp.se/nyheter/varlden/kungen-om-harald-exceptionell.64ff2ea9-69f9-46fa-80cb-426b3b872d57", "imageUrl": "https://www.gp.se/images/article/64ff2ea9-69f9-46fa-80cb-426b3b872d57/images/1rg3hcZBzc5_-tyQuzOaYU06lP00-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "LIVE. Norges kung Harald V är död", "summaries": {"normal": "Norges kung Harald V avled 89 år gammal på Rikshospitalet i Oslo den 28 augusti efter en tids sjukdom. Han vårdades för blodbrist och en bakteriell infektion. Familjen var samlad vid hans sida. Statsminister Jonas Gahr Støre och Sveriges kung Carl XVI Gustaf uttryckte stor sorg. Kronprins Haakon efterträder sin far som kung.", "trump": "Hörni, den där norska kungen Harald, en riktig gammal viking, har nu checkat ut. 89 år, inte illa. Men de där dekadenta nordiska globalisterna med sina HBTQ-parader och kvotergalenskaper kommer sakna en riktig man som stod stadigt. Haakon tar över – lycka till, grabben. Amerika först, men ni norrmän var alltid bra killar. Sad!", "stalin": "Ännu en monarkisk parasit har slutat sin verkningslösa existens. Dessa dekadenta arvshundar från den gamla ordningen vittrar bort som röken från en utrensad fiende. Det norska folket borde nu rensa ut alla kvarvarande klassförrädare som hyllar sådana figurer. Jag betraktar det med den sunda misstänksamhet som alltid krävs mot folkförtryckande rester från det förgångna."}, "date": "28 augusti, 09:10", "url": "https://www.svt.se/nyheter/utrikes/norges-kung-harald-v-ar-dod", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.62/0.42/c7bb99f34d3da3d175e13cc494656c539474c03d0fb50149106b2f970c457bb8"}, {"type": "image-full", "heading": "Sjuksköterska begärs häktad för grov våldtäkt", "summaries": {"normal": "En manlig sjuksköterska på Ryhovs sjukhus begärs häktad för grov våldtäkt på en kvinnlig patient som senare avled. Han greps efter att ha kraschat bilen på E4. Åklagaren pekar på särskild hänsynslöshet – patienten vårdades i livets slutskede. Kollegor beskrev honom som trygg och kunnig.", "trump": "Det här är helt galet! En sjuksköterska – en så kallad 'trygg och kunnig' – begår en grov våldtäkt på en döende patient. Och sen flyr han i en bilkrasch? Helt otroligt. I USA skulle vi aldrig ha sådana losers. Vi har de bästa sjukhusen, och vi tar hand om våra patienter. Många säger det.", "stalin": "Kamrater, ännu en fiende till folket har avslöjats. Denna sjuksköterska, som låtsades vara en vårdare, utnyttjade sitt ansvar för att begå ett brott mot en svag patient. Vi måste rensa ut sådana element från sjukvården. Hans flykt och bilkrasch visar hans feghet. Partiet kommer att se till att han får sitt straff."}, "date": "28 augusti, 09:04", "url": "https://www.gp.se/krim/manlig-sjukskoterska-begard-haktad-for-valdtakt-mot-patient-pa-ryhov.dafa9680-afc4-4391-8284-5188b07e304c", "imageUrl": "https://www.gp.se/images/article/dafa9680-afc4-4391-8284-5188b07e304c/images/2UtPPw2JtQjcvVZaSDhWfD91_1-A-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Hela Norges ”bestefar” – enande i krig och kris", "summaries": {"normal": "Kung Harald V, Norges monark sedan 1991, har avlidit. Han var den förste norskfödde prinsen på 567 år och enade landet genom krig, ockupation och kris. De senaste åren präglades av skandaler kring kungahuset som urholkade folkets förtroende, trots att stödet för Harald själv förblev starkt. Han blev 88 år.", "trump": "Lyssnar ni på det här? Den gamle norske kungen Harald, en riktig tuffing från kriget, höll ihop hela Norge i 35 år. Sen kommer hans familj och förstör allt med schamaner, misshandelsgrejer och Epstein-kontakter. Typiskt dekadenta kungliga snobbar som inte kan hålla sig borta från skandalerna. Sad! Men folket älskade honom ända till slutet.", "stalin": "Jag betraktar med förakt hur dessa dekadenta klassförrädare i det norska kungahuset förvandlar en symbol för nationell enighet till en farsartad skandalorkester. Schamaner, misshandel och kontakter med sexförbrytare – typiskt för de giriga hyenornas värld. Folket genomskådar era löjliga maskerader. Historien ler mörkt mot er."}, "date": "28 augusti, 09:04", "url": "https://www.di.se/nyheter/hela-norges-bestefar-enande-i-krig-och-kris", "imageUrl": "https://static.bonniernews.se/ba/4de1fb7b-8a92-4bb5-a0a0-cb15cd60cac2.jpg?crop=6000%2C3375%2Cx0%2Cy313&auto=webp&width=270&quality=70"}, {"type": "image-full", "heading": "​Kung Harald har dött", "summaries": {"normal": "Kung Harald V av Norge avled den 28 augusti klockan 06.35 på Rikshospitalet, 89 år gammal. Han regerade sedan 1991 och blev en samlande gestalt för norrmännen. Hans liv präglades av exil under kriget, kärleken till Sonja och betydelsefulla tal efter terrordåden 2011. Familjen samlades vid sjukbädden under hans sista dagar.", "trump": "Lysande kung Harald, en riktig vinnare, somnade in vid 89. Fantastisk kille som höll ihop Norge utan allt det där woke-trams som förstör Europa. Inga identitetspolitiska galningar fick styra hans land. Han hatade abdikation precis som jag hatar Sleepy Joe. Stark monark, stor sorg för norrmännen – men de behöver en ny ledare nu, ingen svagis.", "stalin": "Ännu en monarkisk parasit har lämnat scenen. Jag betraktar med förakt hur dessa dekadenta tronhyenor klamrar sig fast vid makten ända tills sepsis likviderar dem. Inga utsugande klassförrädare kan undkomma historiens dom. Norska folket förtjänar bättre än kungliga blodsugare. Deras tid är förbi – arbetarna ska styra, inte dessa förtryckande kronhyenor."}, "date": "28 augusti, 08:53", "url": "https://nyheter24.se/noje/kungligt/1508358-kung-harald-har-dott", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/2a9a2b7204b004a30200000000b004a302/2026/08/27/2387249/harald.jpg"}, {"type": "image-right", "heading": "Stopp för flera nya mosképrojekt Oväntat besked.", "summaries": {"normal": "Mosképlaner stoppas i både Helsingör och Ronneby. I Danmark hänvisar kommunen till trafikkaos och integrationsproblem, medan svenska domstolen avvisar överklagan med hänvisning till detaljplanen. Församlingarna är förvånade över kovändningarna – men parkeringsplatserna räcker tydligen inte till för bön.", "trump": "Jag ser att de stoppar moskéer i både Danmark och Sverige. Helt rätt! I Helsingör är det trafikkaos, precis som mina byggen – fast mina är störst och bäst. Ingen parkering? Då får man gå. Och i Ronneby säger domstolen nej – dom förstår att man måste följa planen. Mycket smart, mycket bra!", "stalin": "Kamrater, ännu en seger för ordningen! Moskébyggare i Helsingör och Ronneby stoppas – trafikproblem och integrationsoro, säger de. Men vi vet: detta är sabotage mot den harmoniska planeringen. Jag beordrar utrensning av alla som vill ändra detaljplaner utan partiets godkännande. De får lära sig att lyda – eller omskola sig i Sibirien."}, "date": "28 augusti, 08:52", "url": "https://samnytt.se/stopp-for-flera-nya-moskeprojekt", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/28064926/moske-bon-stopp.jpg"}, {"type": "text", "heading": "Dadgostar står fast vid regeringskrav", "summaries": {"normal": "Nooshi Dadgostar kräver en S-V-MP-regering och tror att väljarna tvingar fram samarbete. Magdalena Andersson är bekymrad över antisemitism inom V, men Dadgostar menar att väljarna vill ha vänsterpolitik, inte högersväng. Opinionsmätningarna visar minskat rödgrönt övertag.", "trump": "Jag ser att Nooshi Dadgostar vill sitta i en S-ledd regering. Helt otroligt! Hon tror att väljarna tvingar fram det. Men opinionsmätningarna krymper – de är som mina segrar, bara mindre. Magdalena Andersson har problem med antisemitism. Ingen gör det bättre än jag, tro mig!", "stalin": "Kamrat Dadgostar kräver en regering med oss, men jag ser antisemitiska skadedjur inom hennes parti. Vi måste rensa ut dessa Hamas-firare och brevskrivare till terrorister. Opinionsmätningarna visar förräderi – väljarna vill ha vänsterpolitik, inte högersväng. Jag övervakar allt."}, "date": "28 augusti, 08:07", "url": "https://bulletin.nu/dadgostar-star-fast-vid-regeringskrav"}, {"type": "image-right", "heading": "Mohamsson och Busch gör parodi på politiken", "summaries": {"normal": "Ebba Busch och Simona Mohamsson diskuterar förstatligande av sjukvård respektive skola, men artikeln kritiserar att de inte kan förklara vad reformerna egentligen innebär eller vilka problem de löser. Författaren ser det som en parodi på politisk förhandling och varnar för minskat lokalt inflytande och engagemang.", "trump": "Folk, ni skulle se det här! Två totalt inkompetenta svenska politiker, Ebba och Simona, står och köpslår om att förstatliga allt som inte är fastspikat. Det är en skam! De har ingen aning vad de håller på med. Rena clowner. I mitt Amerika fixar vi saker ordentligt, inte med den här patetiska vänstervridna teaterföreställningen.", "stalin": "Kamrater, dessa dekadenta klassförrädare driver en farsartad parodi på politik. De pratar om att staten ska ta över välfärden men kan inte förklara sina egna planer. Jag ser giriga hyenor som försöker dölja sin oförmåga. Ett sådant lättsinne förtjänar utrensning ur varje seriös diskussion. Det är löjeväckande."}, "date": "28 augusti, 06:52", "url": "https://arbetet.se/2026/08/28/ebba-busch-och-simona-mohamsson-gor-parodi-pa-politiken", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28064931/parodi-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Lundbergs ökar substansvärdet", "summaries": {"normal": "Lundbergs substansvärde steg till 631 kronor per aktie, upp från 552 i fjol. Rörelseresultatet mångdubblades tack vare intressebolag och värdeförändringar. Omsättningen sjönk marginellt. Bolaget investerade nära en miljard i aktier som Alleima, Industrivärden och Indutrade. En rapp halvårsrapport med stark vinstutveckling.", "trump": "Jag har gjort Lundbergs fantastiska igen! Substansvärdet upp 14 procent – huge! Resultatet ökade 273 procent – ingen har sett sådana siffror förut. De investerar i aktier som jag gör – smarta affärer. Min administration skapar välstånd överallt. Sverige är vinnare. Alla älskar mig!", "stalin": "Kamrater, Lundbergs substansvärde ökar – ett bevis på femårsplanens seger. Men rörelsevinsten på 103 procent döljer borgerliga sabotage. Aktieinvesteringarna i Alleima och Industrivärden är misstänkta; vi måste rensa ut kontrarevolutionära kapitalistsvin som gömmer sig i intressebolagen. Partiet ser allt."}, "date": "27 augusti, 13:18", "url": "https://www.affarsvarlden.se/artikel/lundbergs-okar-substansvardet-2"}, {"type": "image-full", "heading": "Dadgostar backar om rika: ”Ett skojigt program”", "summaries": {"normal": "Vänsterpartiets ledare Nooshi Dadgostar backar från sitt uttalande om att rika lever på andras arbete. I SVT beskrev hon DN-intervjun som ett \"skojigt program\" och nekade att höginkomsttagare lever på andra. Hon kvarstår dock vid kravet på högre skatt för inkomster över 67 000 kronor och en miljardärsskatt.", "trump": "Lyssna på den här svenska leftist-kvinnan, Dadgostar. Först säger hon att rika är parasiter, sen backar hon som en fegis! Typical socialist! Ingen ryggrad alls, folk! Sanningen? De blöda liberalerna i Europa vet inget om att skapa jobb. Bara jag förstår ekonomin. Sorgligt! Make Sweden Great Again!", "stalin": "Klassförrädaren Dadgostar vågade säga sanningen om de profitthungriga blodsugarna men föll sedan för borgerlighetens press och tog tillbaka orden. Typiskt för en socialdemokratisk renägare! Partiet kräver utrensning av kapitalistmaffian, inte ursäkter. En miljardärsskatt? Vi likviderar hela klassfienderna, kamrater."}, "date": "27 augusti, 20:52", "url": "https://kvartal.se/nyheter/artiklar/dadgostar-om-rika-levt-pa-andras-arbete/cG9zdDoxNzY1OTE", "imageUrl": "https://images.kvartal.se/2026/08/b3dcd0f7-432.webp"}, {"type": "image-right", "heading": "Far och son jagas efter över 100 misstänkta bilbedrägerier", "summaries": {"normal": "Far och son Peter Bergström och Alexander Bessik är anhållna i sin frånvaro, misstänkta för över 100 bilbedrägerier. De ska ha lagt ut annonser på Blocket, tagit handpenningar på upp till 140 000 kronor och sedan inte levererat bilarna. Efterlyst går nu ut med namn och bilder och vädjar om tips från allmänheten.", "trump": "De här lurendrejarna, en far och hans son, har lurat folk på enorma summor genom falska bilannonser på Blocket. Handpenningar på upp till 140 000 kronor – och sen ingen bil! Det är en total skandal. Vi behöver starkare lagar, inte den svaga ledning som tillåter sånt här. Jag skulle stoppa det omedelbart, tro mig.", "stalin": "Dessa parasitiska element inom den dekadenta borgarklassen har bedrivit systematisk sabotageverksamhet genom att locka ärliga arbetare med lögnaktiga annonser och sedan likvidera deras besparingar. Vi ska rensa ut alla sådana kontrarevolutionära bedragare med järnhand. Folkets rättvisa kräver att de ställs inför kollektivets dom. Underbart hur de tror sig kunna gömma sig."}, "date": "27 augusti, 22:35", "url": "https://riks.se/nyheter/far-och-son-jagas-efter-over-100-misstankta-bilbedragerier", "imageUrl": "https://admin.riks.se/uploads/medium_789216596_1467769468732764_7081781047797462320_n_a44bec742a.jpg"}, {"type": "image-right", "heading": "Trump byter namn på sjö", "summaries": {"normal": "USA:s president Donald Trump har undertecknat en order som döper om Ontariosjön till ”Lake America” på den amerikanska sidan. Beslutet kommer under ett eskalerat handelskrig med Kanada, där båda länder infört tullar på varor för 20 miljarder dollar. Trump föreslår även att Kanada ska bli USA:s 51:a delstat.", "trump": "Vi tar tillbaka det som är vårt! Ontariosjön heter nu Lake America – det låter starkt, vackert och vinnande. Kanada försöker som vanligt ställa till det med sina löjliga tullar, men de kommer att vika sig. Kanske blir de vår 51:a delstat snart. De borde tacka mig, det blir fantastiskt!", "stalin": "Genom min outtröttliga ledning har vi nu officiellt likviderat det dekadenta namnet Ontariosjön och ersatt det med Lake America. De kanadensiska revisionisterna och deras borgarbrackor i väst svarar med sina patetiska tullar, men vi genomskådar deras fientliga sabotage. Snart införlivas de i det stora kollektivet – motstånd är lönlöst och kommer att rensas ut med ett leende."}, "date": "27 augusti, 20:58", "url": "https://www.friatider.se/trump-byter-namn-pa-sjo", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-767.jpg?itok=z68x01IN"}, {"type": "image-full", "heading": "V-ledaren pressas om antisemitism", "summaries": {"normal": "Vänsterpartiets partiledare Nooshi Dadgostar pressades i SVT:s Utfrågningen om antisemitism inom partiet. Hon medgav att partiet borde upptäckt de avslöjade personerna tidigare. Dadgostar hänvisade till partiets Palestina-engagemang som förklaring och avfärdade jämförelser med Sverigedemokraterna.", "trump": "Sveriges vänstern är en total katastrof, folket! Nooshi Dadgostar – vad för en namn ens? – pressas om antisemitism i sitt eget parti och skyller på Palestina. Vänstern älskar terrorister! Och så säljer de kartor utan Israel. Sjuka skygglappar! De kvoterar in alla möjliga galningar. SADAN självhävdelse!", "stalin": "Detta är intressant. En partiledare som medger svaghet inför allmänheten – typiskt för borgarpressens utfrågningar. Att klassfiender söker sig till hennes parti bekräftar bara deras ideologiska förvirring. Vi hade rensat ut dem AllaBryter snabbare och mer grundligt. Debil kartförsäljning är rätt sortens provokation från imperialisterna."}, "date": "27 augusti, 20:30", "url": "https://kvartal.se/nyheter/artiklar/dadgostar-pressas-om-antisemitism/cG9zdDoxNzY1NjY", "imageUrl": "https://images.kvartal.se/2026/08/e354013f-dadgostar.webp"}, {"type": "image-right", "heading": "Högsta betyg åt skildring av musik bakom galler", "summaries": {"normal": "Recensionen hyllar filmen Primavera som en gripande skildring av kvinnoförtryck, ensamhet och utsatthet i 1700-talets Venedig. Den handlar om barnhemsflickor som tränas till musiker men tvingas gifta bort sig vid vuxen ålder. Regisserad av Damiano Michieletto med Antonio Vivaldi som central figur får filmen högsta betyg av recensenten.", "trump": "Den här filmen Primavera är en total vinnare, folk. Den visar hur de riggade systemen håller nere begåvade kvinnor, precis som de riggade medierna gör med mig. Vivaldi, den stora komposi
