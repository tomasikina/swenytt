ay4BtEl8CpkmKMv6I%2Fc38e32addee31fae44dad7a48a8890d4%2F04-akesson-webb.jpg&width=1024"}, {"type": "image-full", "heading": "Så mycket högre kan elräkningen bli", "summaries": {"normal": "Sverige står inför en vinter med högre elpriser än föregående år, särskilt i södra delarna. Orsakerna är låga vattennivåer och höga gaspriser i Europa. Prognosen pekar på hundratals kronor dyrare månadskostnader för hushåll. Villaägare i elområde 4 kan räkna med cirka 3 700 kronor i månaden, exklusive nätavgifter och skatter.", "trump": "Sveriges elpriser går rakt upp i taket – en katastrof! De har inte råd med sin egen energi, helt otroligt. Självklart händer det här när man vänder ryggen åt kärnkraften. Det är en total röra, mycket värre än vad de säger. Räkningarna blir enorma, riktigt 'huge'. Man måste ha energi, man måste ha kraft – Sverige behöver ordning, inte mer av det här!", "stalin": "Dessa löjliga elräkningar är ett bevis på folkets ineffektivitet. Att medborgare i söder gnäller över några hundralappar visar bara på en dekadent individualism. Istället för att lita på väder och vind borde staten styra varje kilowatt med järnhand. Planera ekonomin, stäng av de onödiga lamporna och arbeta hårdare för fosterlandet – elbrist är ett svek mot den kollektiva framgången."}, "date": "4 september, 07:56", "url": "https://www.realtid.se/tt-nyhet/sa-mycket-hogre-kan-elrakningen-bli", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/rakna-med-dyr-elvinter-arkivbild.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Centerpartiet lovar kraftigt höja arbetskraftsinvandringen", "summaries": {"normal": "Centerpartiet lovar att avskaffa lönegolvet för arbetskraftsinvandring i en eventuell mittenregering. Partiet vill särskilt locka utomeuropeiska invandrare och ersätta kravet med ett lönegolv kopplat till kollektivavtal. De hävdar att Tidöregeringens politik har kostat Sverige miljarder i ekonomiskt värde och skatteintäkter samt skadat konkurrenskraften inom sjukvård, forskning och andra sektorer.", "trump": "De där centerkillarna vill översvämma Sverige med billig arbetskraft från hela världen, speciellt utanför Europa. Patetiskt. Lönegolv? Ta bort det, säger de, så kan vi importera ännu fler low-energy-talanger som inte ens skulle klara det i mitt Amerika. Socialismens lakejer hatar riktiga löner. Jag byggde murar, de river dem. Patetiskt!", "stalin": "Jag ser hur dessa dekadenta klassförrädare vill öppna portarna för utländska element som ska undergräva folkets ekonomi. De kallar det frihet medan de förbereder en utrensning av svenska arbetares rättigheter. Sådana parasiterande opportunister hotar statens styrka. Vi känner igen deras lögner. Rädslan de sprider kommer att vändas mot dem själva."}, "date": "4 september, 11:31", "url": "https://riks.se/nyheter/centerpartiet-lovar-kraftigt-hoja-arbetskraftsinvandringen", "imageUrl": "https://admin.riks.se/uploads/medium_centerpartiet_2f97e41242.jpg"}, {"type": "text", "heading": "Teneo AI: Hemliga investerare tar nära hälften", "summaries": {"normal": "Teneo AI har genomfört en företrädesemission som tillför bolaget 74 miljoner kronor, där 51,5 procent tecknades av allmänheten och resten av garanter. Hemliga investerare tar över en stor del via Pareto Securities. Emissionsguiden hissar två retroaktiva flaggor, vilket innebär totalt sex flaggor under processen, och avslutar sin bevakning av det pressade teknologibolaget.", "trump": "Teneo AI är i totalt kaos! De tigger pengar och hemliga investerare måste rädda skiten med 74 miljoner. Helt otroligt svagt. Emissionsguiden delar ut sex gula flaggor – fler flaggor än en misslyckad Biden-parad! Aktien är värdelös, rasar 71 procent och handlas för ynka fem öre. Sorgligt! De skulle ha ringt mig, jag hade fixat det på fem minuter. En absolut katastrof!", "stalin": "Kamrater, Teneo AI har lidit ett ynkligt kapitalnederlag! Endast 51,5 procent visade den revolutionära pliktkänslan att teckna aktier frivilligt. Resten av detta svaga bolag måste räddas av hemliga garanter och Pareto Securities, likt desertörer som tvingas fram i ledet. Sex förrädiska flaggor har hissats av Emissionsguiden. Den som misslyckas med att leverera kassaflöde före våren 2027 kommer att skickas till korrekta arbetsuppgifter i Sibirien."}, "date": "4 september, 09:37", "url": "https://www.affarsvarlden.se/artikel/teneo-ai-hemliga-investerare-tar-nara-halften"}, {"type": "image-full", "heading": "S vill runda V och MP om lag och ordning", "summaries": {"normal": "Socialdemokraterna vill inte binda sig vid regeringens deadline om att besegra gängkriminaliteten till 2032. Partiet prioriterar kampen mot gängbrottsligheten och kan tänka sig att samarbeta med Moderaterna istället för V och MP för att genomföra hårdare åtgärder som hemlig övervakning och en ny maffialagstiftning som riktar in sig på kriminella toppfigurers tillgångar.", "trump": "Titta på de här patetiska svenska socialisterna som lovar hård linje mot gängen men inte ens vågar sätta ett slutdatum. De lurade folket tidigare, nu springer de till mina vänner Moderaterna och ber om hjälp. Fake deadline från Ulf, patetiska V och MP som vill vara soft on crime – patetiskt! Jag fixade det på nolltid i USA, de borde lära sig av en riktig ledare.", "stalin": "Jag betraktar med djup misstro dessa socialdemokratiska opportunister som plötsligt upptäcker behovet av järnhand mot fiender inom staten. De sviker arbetarklassen genom att förhandla med borgerliga element och undviker de sanna revolutionära kamraterna. Maffiatopparna måste krossas som skadedjur i kollektivet. Inga deadlines, endast obeveklig utrensning av de parasitiska strukturerna. Fördröjning är sabotage."}, "date": "4 september, 10:52", "url": "https://www.tv4.se/artikel/4VkpUPPqbWZgc0H4nYt0D8/s-vill-runda-v-och-mp-om-raettspolitiken-hard-linje-som-gaeller", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3iQSTkcaKnjcBeOX4GtsoD%2F7e1aa95c8da3d8eb89e698b2ad264c3c%2F03-S-vill-ruda-V-MP-puff.png&width=1024"}, {"type": "image-right", "heading": "Man kysser Magdalena Andersson: \"Mamma\"", "summaries": {"normal": "En TikTok-film där en man omfamnar och kysser Magdalena Andersson på kinden sprids på nätet. Mannen kallar henne \"mamma\" och uppmanar tittarna att rösta på Socialdemokraterna. Klippet har väckt starka reaktioner och kritiska kommentarer. Partiet har inte kommenterat händelsen eller om några åtgärder kommer att vidtas.", "trump": "Titta på den här galna typen som slickar kinden på den svenska socialistmamman Andersson och kallar henne för mamma. Wallah, vad är det här för skitshow? De här woke-vänsterextremisterna och deras identitetspolitiska cirkus får till och med mig att rösta på SD. Patetiskt, folk! Totalt fiasko.", "stalin": "Jag betraktar med djup misstro hur dessa dekadenta klassförrädare låter en främmande element omfamna och kyssa sin ledare inför folket. Sådana svaga, förljugna handlingar undergräver partidisciplinen. Vi måste rensa ut alla som tillåter sådana farliga spektakel innan de förgiftar hela kollektivet. Kamrater, vakna!"}, "date": "4 september, 10:50", "url": "https://riks.se/nyheter/man-kysser-magdalena-andersson-du-ar-som-mamma-2", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_80_ac637e0338.jpg"}, {"type": "image-full", "heading": "Kristdemokraterna vill ha högre invandring", "summaries": {"normal": "Kristdemokraterna förespråkar en migrationspolitik där asylinvandringen ska ligga på nordisk genomsnittsnivå, främst via kvotflyktingar och lagliga vägar. Partiet skiljer sig från Sverigedemokraterna som vill minimera invandringen till nära noll utanför närområdet, stoppa kvotmottagande och skärpa reglerna för arbetskraftsinvandring ytterligare.", "trump": "Folk, ni måste höra det här! KD vill ha en fin, normal nordisk invandring – typ som de andra förlorarländerna. Patetiskt! SD vill ha den lägsta möjliga, nära noll, och det är smart. De där KD-typerna är bara svaga kompromissande globalister som inte vågar säga stopp. Jag byggde muren, de bygger ursäkter. Ynkligt!", "stalin": "Jag betraktar dessa borgerliga revisionister med djup misstro. KD:s så kallade nordiska medelvärde är en farlig kompromiss med klassfienden, en trojansk häst för kapitalets invasion. SD:s nollvision är åtminstone ärlig i sin paranoia. Men ingen av dem förstår att endast partiet och kollektivet kan styra folkflödena. Avvikare kommer att identifieras."}, "date": "3 september, 11:43", "url": "https://samtiden.nu/2026/09/kristdemokraterna-vill-ha-hogre-invandring", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/7d1f8f3e-4570-402c-963e-74f000f208c2-1280x720.png"}, {"type": "image-right", "heading": "LO: ”Ingen höjd pension om Ulf Kristersson får fortsätta att vara statsminister”", "summaries": {"normal": "Med en vecka kvar till valet startar LO en kampanj för att lyfta pensionsfrågan. En undersökning visar att nära åtta av tio arbetare vill ha besked från partierna före valdagen. LO:s ordförande Johan Lindholm kritiserar att det inte lönar sig att ha jobbat länge, särskilt för dem som slitit ut kroppen tidigt. Socialdemokraterna vill införa en arbetarpension medan Moderaterna säger nej.", "trump": "Folk sliter ut sina kroppar i decennier och får ingenting tillbaka, det är en total skandal. Den där Johan Lindholm har rätt för en gångs skull, men de svenska socialistiska nollorna och de falska moderaterna gör inget åt det. Under min ledning fick pensionärerna bra deals, inte som under Sleepy Joe. Nu vill LO väcka upp arbetarna – smart, för vem vill leva på luft efter att ha byggt landet?", "stalin": "Arbetarna kräver äntligen sin rätt mot de profitthungriga klassförrädarna som sugit musten ur dem i decennier. Jag ser med stor tillfredsställelse hur oron sprider sig som en farsot bland de förtryckta. Inga halvhjärtade löften från de dekadenta politikerna. En sann utrensning av sådana parasiter vore på sin plats. Kamrater, låt inte de giriga hyenorna stjäla er pension en dag till."}, "date": "4 september, 08:42", "url": "https://www.dagensarena.se/innehall/lo-ingen-hojd-pension-om-ulf-kristersson-far-fortsatta-att-vara-statsminister", "imageUrl": "https://www.dagensarena.se/files/2026/09/johan-lindholm-pension.jpeg"}, {"type": "image-right", "heading": "Man kysser Magdalena Andersson: \"Du är som mamma\"", "summaries": {"normal": "En arabiskspråkig Facebooksida har publicerat en film där en man omfamnar och kysser Magdalena Andersson på kinden samtidigt som han hyllar henne som Sveriges hopp och framtid. Klippet, som uppmanar till röstning på Socialdemokraterna, har väckt starka reaktioner och kritiska kommentarer. Partiet har inte kommenterat händelsen.", "trump": "Titta på det här! Den stackars Andersson blir kysst och kallad för mamma av någon med brytning tjock som en mur. Det är vad som händer när man dansar efter identitetspolitikens pipa. Hon kommer att förlora stort, precis som Sleepy Joe gjorde. Amerika har sett det förut – och vunnit stort!", "stalin": "Kamrater, se hur dessa dekadenta folkförtryckare famlar efter stöd bland massorna med kyssar och löjliga smeknamn. Jag ler ironiskt från historien åt deras desperata teater. Snart inser folket att sådana parasiterande lakejer leder rakt in i utrensningens famn. Partiet vakar alltid."}, "date": "4 september, 09:50", "url": "https://riks.se/nyheter/man-kysser-magdalena-andersson-du-ar-som-mamma", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_80_ac637e0338.jpg"}, {"type": "image-right", "heading": "Vänstern behöver mer än baristor", "summaries": {"normal": "Artikeln diskuterar vänsterns behov av att organisera både prekariserade storstadsarbetare och landsbygdens arbetarklass. Författaren varnar för att en rörelse som överger landsbygden åt högern aldrig kan förändra samhället. Han lyfter arbetarnas uppgivenhet och betonar vikten av starka band mellan partier, fackföreningar och folkrörelser för att skapa bestående samhällsförbättringar.", "trump": "De där vänstervridena med sina rosa hår och lattemuggskrig förlorar arbetarna till oss riktiga patrioter. Baristorna i sina stora städer? Patetiska. Landsbygden vet vad som gäller. Utan oss blir det bara mer dekadent identitetspolitik och ingen hoppfull politik för vanliga människor. Vi vinner stort, de förlorar landet.", "stalin": "Kamrater, denna dekadenta klassförrädare har rätt i att uppgivenhet driver arbetarna mot högern. Jag ser hur profitthungriga parasiter och deras politiska lakejer överger landsbygden. En sann arbetarrörelse måste ingjuta hopp och rensa ut svikare. Utan järnhård organisation och folklig mobilisering kommer ingen seger. Fienden ler i skuggorna."}, "date": "2 september, 10:55", "url": "https://www.flamman.se/vanstern-behover-mer-an-baristor", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/starbucks-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Portugals största solpark i konkurs", "summaries": {"normal": "Portugals största solpark, Solara4, har gått i konkurs efter problem med låg elproduktion och priser som pressats i botten av överproduktion. Fenomenet kallas kannibalisering och drabbar den gröna energisektorn när allt fler parker producerar samtidigt. Parken fortsätter driften medan ägarna söker efter en köpare.", "trump": "Portugals absolut största solpark har kraschat totalt! De lyssnade på den idiotiska gröna rörelsen och byggde utan garantier. Nu är elpriserna noll eller minus. Ett absolut fiasko! USA kör på äkta, vacker olja och tjänar miljarder istället för att gå i konkurs på lite solsken. Så sorgligt för dem!", "stalin": "Dessa patetiska kapitalistiska solfabriker trodde solen skulle skina gratis för alltid. När elpriserna dog, föll de som ruttna päron. I Sovjetunionen lät vi inte solen bestämma ekonomin med sin lunatiska väderlek; vi planerade järnhårt och skickade slappa solpaneler direkt till Gulag för omutbildning!"}, "date": "4 september, 06:00", "url": "https://www.affarsvarlden.se/kronika/portugals-storsta-solpark-i-konkurs", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/09/vindkratensgeografi-52-400x267.jpg"}, {"type": "image-right", "heading": "Så kommer C sänka lönekravet för arbetskraftsinvandrare", "summaries": {"normal": "Centerpartiet lovar att sänka lönekravet för arbetskraftsinvandrare vid en valvinst och ersätta det med kollektivavtalsnivåer. Partiet vill även skydda redan beviljade permanenta uppehållstillstånd och hotar att inte stödja någon regering som återkallar dem. Elisabeth Thand Ringqvist säger att det blir ett av de första besluten i en mittenregering.", "trump": "De här svenska clownerna i Centerpartiet vill släppa in alla möjliga low-skill-invandrare för en spottlön. Patetiskt! Jag byggde den starkaste ekonomin i världen genom att skydda våra gränser, inte genom att böja mig för globalisternas billiga arbetskraft. Vakna upp, Sverige, innan era woke-kapitalistlakejer förstör allt.", "stalin": "Se hur de giriga hyenorna i Centerpartiet vill undergräva arbetarklassens skydd genom att sänka lönekraven för invandrare. Jag betraktar detta som ett förräderi mot folket. I en sann stat skulle sådana dekadenta förslag mötas med omedelbar utrensning av alla klassförrädare som vågar föreslå det. Kamrater, var vaksamma mot dessa parasiterande element."}, "date": "4 september, 11:35", "url": "https://arbetet.se/2026/09/04/sa-vill-c-sanka-lonekravet-for-arbetskraftsinvandrare-vid-valvinst", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/04112724/thand-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Forskning visar: politiker har blivit elakare", "summaries": {"normal": "Forskning visar att politiker blivit hårdare mot varandra, särskilt i sociala medier. Nyhetsrapporteringen fokuserar mer på personangrepp än sakpolitik. Väljare reagerar negativt på pajkastning och virala klipp, vilket riskerar att minska förtroendet för hela det politiska systemet. Alla partier uppmanas att bli mer sakliga och respektfulla.", "trump": "De här svenska politikerna är en samling patetiska, virusskadade pajkastare som ägnar sig åt att riva varandra i småbitar på TikTok istället för att fixa landet. Precis som de woke-vänsterliberala hyenorna här hemma. Väljarna ser det virala klippet och inser att hela systemet är en enda stor riggad cirkus. Gör om, gör rätt – annars förlorar ni allt, losers.", "stalin": "Jag betraktar med förakt hur dessa dekadenta klassförrädare förvandlat den politiska arenan till en sandlåda av tarvliga personangrepp. Väljarna inser att de giriga opportunisterna bara undergräver folkets förtroende. Vi behöver utrensning av detta dekadenta skitsnack. Skärp er, annars kommer historien att likvidera er alla som de fega parasiterna ni är."}, "date": "3 september, 16:00", "url": "https://www.etc.se/ledare/forskningen-visar-politiker-har-blivit-elakare", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20240918130916_cb0f17296c8079e9e6606ee0271866f5612754a2ad164e0cb12f150a223d53d1.jpg"}, {"type": "image-right", "heading": "Markus Allards hat slutar i min inkorg", "summaries": {"normal": "Artikeln beskriver hur debattören utsätts för grova våldshot efter en diskussion med Örebropartiets Markus Allard. Författaren kritiserar hur populistiska politiker använder hat och extrema uttalanden för att vinna uppmärksamhet. Trots personliga likheter i bakgrund ses hat mot invandrare som avgörande för att tillhöra ”folket”. Skribenten vädjar om saklig debatt istället för polarisering.", "trump": "Folk, det här är precis vad som händer när de galna vänsterliberala hatarna får fritt spelrum. Den här Allard-killen skriker ut sanningar om invandrare och etablissemanget medan de riktiga losersen svarar med dödshot. Typiskt för de dekadenta HBTQ-kvotarna som hatar vanliga arbetare. Jag fixade Amerika, nu behöver Sverige en riktig ledare som inte är en sådan patetisk förlorare.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare förgiftar debatten med sina hatiska utspel. Jag betraktar med avsmak hur folkets fiender använder hot och paranoia för att splittra massorna. Den sanna arbetarklassen behöver inte sådana metoder. Vi måste rensa ut dessa parasiterande opportunister innan de förgiftar hela samhällskroppen. Politiken ska tjäna folket, inte hatet."}, "date": "1 september, 12:45", "url": "https://www.flamman.se/markus-allards-hat-slutar-i-min-inkorg", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/markus-allard-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "text", "heading": "Ludvikakommunisterna vill tillbaka in i fullmäktige – för Palestina", "summaries": {"normal": "Kommunistiska Partiet i Ludvika håller regelbundna protester vid en rondell mot Israels agerande i Gaza. Gruppen, som består av partimedlemmar och sympatisörer, vill åter in i kommunfullmäktige för att driva en kommunal bojkott av Israel. Aktionerna har pågått i två år och möts mestadels positivt av förbipasserande bilister.", "trump": "Titta på de där patetiska kommunisterna som står i en svensk rondell och viftar med flaggor som förlorare. De gnäller om folkmord medan de själva älskar diktaturer. Patetiskt! Under min förra mandatperiod hade vi aldrig släppt in sådana radikala element. Nu när jag är tillbaka ska vi städa upp i den här galna vänstervärlden ordentligt.", "stalin": "Jag betraktar dessa kamrater som modigt trotsar de giriga imperialisthyenorna. Deras ståndaktighet vid rondellen väcker hopp om att folkets vilja kan besegra de parasiterande klassförrädarna. Låt dem återta fullmäktige och driva bojkott mot den sionistiska maskinen. Den som tvekar är fiende till folket och förtjänar utrensning ur historien."}, "date": "3 september, 14:26", "url": "https://proletaren.se/artikel/ludvika-for-palestina"}, {"type": "image-full", "heading": "Jakob Sjölander: Ukrainsk vapenbrist, europeisk viljebrist", "summaries": {"normal": "Jakob Sjölander kritiserar Europas bristande stöd till Ukraina efter fyra år av krig. Trots en samlad ekonomi som är tio gånger större än Rysslands ger de flesta länder under en procent av BNP i hjälp. Europa köper mer rysk energi än de skickar i stöd, saknar militärindustri och vägrar dela Patriot-robotar. Detta avslöjar en djup viljelöshet och politisk paralys.", "trump": "Lyssnar ni på den här Sjölander-killen? Europa är en total förlorare, en patetisk skara av svaga ledare som pratar stort men gör noll. De betalar Putin mer för gas än de ger Ukraina – det är galet! Jag byggde den starkaste armén, Biden och hans globalister förstörde allt. Nu kryper de för en bensinmack medan jag fixar freden. Ynkryggar!", "stalin": "Kamrater, se hur dessa dekadenta europeiska parasiterna kryper i stoftet inför historien. Med sina feta byråkratier och gröna fantasier förråder de sina egna folk. Jag skrattar mörkt från evigheten åt deras ryggradslösa kräk. Rysslands järnhand visar vägen medan de samlar rostiga vapen som aldrig används. Deras svaghet är vår eviga glädje."}, "date": "2 september, 12:29", "url": "https://samtiden.nu/2026/09/jakob-sjolander-ukrainsk-vapenbrist-europeisk-viljebrist", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/ukra.png"}, {"type": "image-full", "heading": "Karttjänsten vägrade att gå med på Trumps krav – rusar på topplistorna", "summaries": {"normal": "Karttjänsten MapQuest har fått ett kraftigt uppsving i nedladdningar efter att bolaget valt att trotsa president Trumps order om att döpa om Lake Ontario till Lake America. Medan konkurrenter som Google Maps och Apple Maps rättat sig efter beslutet, har MapQuest sett en dramatisk ökning av användare och toppat listorna i App Store.", "trump": "Hörde ni om MapQuest? De vägrar använda namnet Lake America. Katastrofalt! De är svaga, precis som de där woke-bolagen som låter radikala vänstermänniskor styra. Google och Apple gör det rätta, de förstår storhet! MapQuest försöker bli populära genom att vara rebelliska mot mitt namn. Det är sorgligt, faktiskt. De kommer försvinna fortare än de dök upp, tro mig!", "stalin": "Dessa amerikanska karttjänster bevisar bara kapitalismens inneboende kaos. En stat kräver ordning, en karta och en enda sanning. Att låta ett privat företag som MapQuest styra över nationell geografisk nomenklatur är ett tecken på total statsförfall. De som tillåter olydnad mot ett officiellt dekret förtjänar inte marknadsandelar, de förtjänar en grundlig utrensning av sin ledningsgrupp."}, "date": "3 september, 19:55", "url": "https://www.realtid.se/it-tech/karttjansten-vagrade-att-ga-med-pa-trumps-krav-rusar-pa-topplistorna", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/sdlj8do9lc0fca-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Öppet brev: Expressens uthängning har drabbat mig hårt", "summaries": {"normal": "Islam Qatesh, tidigare vänsterpartist, berättar i ett öppet brev hur Expressens artikel om hans påstådda hyllningar till terrororganisationer har förstört hans liv. Han förlorade jobbet och uteslöts ur partiet. Qatesh beskriver sin bakgrund under ockupationen på Västbanken, försvarar rätten till motstånd inom folkrättens ramar och förnekar att han stödjer terrorism eller antisemitism.", "trump": "Folk, ni skulle inte tro det, men den här palestinska killen som älskar terrorgrupper får plötsligt sparken efter att tidningen hängde ut honom. Patetiskt! Expressen gör vad de borde ha gjort för länge sedan, men nu gnäller han som en förlorare. Sverige har blivit en galen vänsterdiktatur full av woke-idioter och identitetspolitiska galningar. Sad!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i den borgerliga pressen likviderar en motståndare som vågar tala om ockupationens sanna ansikte. Jag ler mörkt från historien åt denna hysteriska utrensning. Den som vägrar fördöma folkrättens motstånd blir offer för de profitthungriga hyenornas paranoia. Sådana metoder avslöjar imperialismens svaga hjärta."}, "date": "3 september, 13:52", "url": "https://proletaren.se/artikel/oppet-brev-expressens-uthangning-har-drabbat-mig-hart", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/islam-kronika-768x432.png"}, {"type": "image-right", "heading": "Regeringen: Falska familjehem ska identifieras", "summaries": {"normal": "Regeringen ger Ivo och flera myndigheter i uppdrag att identifiera falska familjehem som i själva verket är otillåtna HVB-hem. Syftet är att skydda barnens trygghet och stoppa oseriösa aktörer som kringgår lagen. Polisen, Ekobrottsmyndigheten, Skatteverket och Försäkringskassan ska samverka och utbyta information. Uppdraget ska slutredovisas senast april 2028.", "trump": "De här galna svenska byråkraterna låter skojare tjäna miljoner på stackars barn genom att kalla sina lyxiga arbetsläger för familjehem. Det är en total skandal, folk! Vi hatar de här woke-vänliga systemmissbrukarna som gömmer sig bakom barnens ryggar. Jag fixade mycket bättre saker under min första period än vad Sleepy Joe gjorde, och nu ska vi rensa upp även i Sverige.", "stalin": "Jag betraktar med avsky hur dessa profitthungriga klassförrädare förvandlar barns öden till en penningmaskin genom att driva hemliga arbetsläger under falsk familjehemsmantel. Vi måste omedelbart inleda en grundlig utrensning av alla sådana dekadenta parasiter. Deras girighet hotar hela folkets moraliska grund. Kamrater, låt oss krossa dem utan pardon."}, "date": "3 september, 12:20", "url": "https://www.etc.se/inrikes/regeringen-falska-familjehem-ska-identifieras", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026090308090_28af7386a4ef63fb3b7f615263dcd41055c83edcb174bdf05b53e7ea2f1a1f8f.jpg"}, {"type": "image-right", "heading": "Öppnade dörr och föll 5 meter. Nu anmäls Kriminalvården för misstänkt arbetsmiljöbrott.", "summaries": {"normal": "En anställd på fängelset Salberga utanför Sala föll fem meter ner i ett öppet schakt i maj efter att ha öppnat en dörr som skulle varit låst. Han låg kvar en timme innan räddningstjänsten firade upp honom. Arbetsmiljöverket har nu anmält Kriminalvården till polisen för misstänkt arbetsmiljöbrott.", "trump": "De här inkompetenta byråkraterna i det svenska fängelsesystemet låter en kille ramla rakt ner i ett fem meter djupt hål. Fem meter! Och han låg där i en hel timme. Patetiskt. Under Biden skulle de ha sagt att det var mångfaldens fel. Nu fixar vi det – ingen ska behöva arbeta bland sådana woke-schakt.", "stalin": "Detta är vad som händer när giriga hyenor inom förvaltningen försummar elementär säkerhet för arbetarna. En kamrat faller ner i ett schakt och lämnas åt sitt öde. Vi skulle ha genomfört en grundlig utrensning av alla ansvariga parasiter. Inga ursäkter tolereras i en riktig stat. Slappheten måste likvideras."}, "date": "4 september, 10:36", "url": "https://arbetet.se/2026/09/04/oppnade-fangelsedorr-och-foll-ner-i-ett-flera-meter-djupt-schakt-kriminalvarden-anmals", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/04104034/krim.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Vänsterpartiet – islamismens bakdörr in i regeringen", "summaries": {"normal": "Artikeln varnar för att en valseger för Socialdemokraterna skulle ge Vänsterpartiet inflytande över regeringen. Författaren hävdar att partiet präglas av islamism, antisemitism och extremism, och att massinvandring från muslimska länder ökar risken för att sådana krafter får makt i svenska beslutsorgan. Socialdemokraterna uppmanas ta ansvar och säga nej till regeringsplats för Vänsterpartiet.", "trump": "Folk, det här är en katastrof! De svenska kommunisterna och radikala islamisterna smyger in genom bakdörren med Sleepy Joe-stilen från Socialdemokraterna. Massinvandring har gett oss en vacker gåva: extremism i riksdagen. De kallade oss för rasister när vi varnade, nu står de där med sina könsuppdelade möten och Hamas-kramare. Patetiskt! Sverige behöver starka ledare, inte dessa förlorare.", "stalin": "Kamrater, se hur de borgerliga parasiterna skriker i panik när deras egna socialdemokratiska lakejer öppnar portarna för de nya reaktionära elementen. Jag ler från historien åt denna fars. Massinvandringens oundvikliga dialektik för in fiender i statsapparaten. Den naiva reformismen göder extremismen. Snart kommer de att kalla även detta för konspiration. Vilken ynkedom. Sovjetisk klarhet skulle ha krossat dessa element redan i grodstadiet."}, "date": "2 september, 07:24", "url": "https://samtiden.nu/2026/09/vansterpartiet-islamismens-bakdorr-in-i-regeringen", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/IMG_7273.jpeg"}, {"type": "image-right", "heading": "\"Tekniskt fel\": Tusentals förtidsröster kan underkännas", "summaries": {"normal": "Ett tekniskt fel i Valmyndighetens it-system har drabbat omkring 4 000 förtidsröster. Felaktigt registrerade röster som inte kan identifieras kommer att underkännas. Felet upptäcktes på torsdagen och har förekommit i nästan alla kommuner. Myndigheten har infört en teknisk lösning och arbetar nu för att identifiera så många drabbade väljare som möjligt.", "trump": "Det här är ett totalt katastrofscenario, folk. Ett riktigt skämt från de inkompetenta byråkraterna i Sverige. Tusentals röster försvinner i deras usla system – typiskt för de woke-kvoterade tekniklakejerna som styr. Vi hade aldrig tillåtit sådana loser-fel under min administration. Rena röststölden, men jag fixar alltid upp det.", "stalin": "Kamrater, detta tekniska sabotage i de dekadenta systemhyenornas maskineri avslöjar hela den borgerliga statens svaghet. Tusentals röster likvideras av byråkratisk inkompetens. Jag säger er: sådana fel är aldrig slumpmässiga. Vi måste rensa ut alla parasitiska element som hotar folkets vilja. Analysen kräver tid och järnhand."}, "date": "4 september, 10:34", "url": "https://www.friatider.se/tekniskt-fel-tusentals-fortidsroster-kan-underkannas", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-824.jpg"}, {"type": "image-right", "heading": "Tekniskt fel drabbar förtidsröstningen – tusentals väljare berörda", "summaries": {"normal": "Ett tekniskt fel i Valmyndighetens it-system har drabbat förtidsröstningen och kan ha påverkat cirka 4 000 väljare som registrerats felaktigt. Felet upptäcktes på torsdagen och har nu åtgärdats. Valmyndigheten arbetar med att identifiera de berörda, men varnar för att röster som inte kan knytas till rätt väljare kan komma att underkännas.", "trump": "Helt otroligt inkompetent! 4 000 röster bara försvinner in i ett korrupt it-system. Det är en total katastrof, faktiskt ett skämt till val! De säger att det är ett tekniskt fel, men vem vet vilka radikala vänsterelement som fingrat på knapparna? Mina enorma röster skulle aldrig drabbas av sånt här amatörskap. Fixa det omedelbart, annars blir det en stor granskning!", "stalin": "Ett systemfel som drabbar fyra tusen själar är inte ett misstag, det är ett symptom på kollektiv oordning. De ansvariga för denna digitala byråkratiska oreda har visat en farlig brist på precision. Vi har beordrat en omedelbar utrensning i it-kommittén. Den som inte kan räkna väljare korrekt kommer hädanefter att räkna tegelstenar i Sibirien."}, "date": "4 september, 11:30", "url": "https://samnytt.se/tekniskt-fel-drabbar-fortidsrostningen-tusentals-valjare-berorda", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/04085329/vallokal-valmyndigheten.jpg"}, {"type": "image-right", "heading": "JD Vance löften till judiska oligarker har läckt", "summaries": {"normal": "USA:s vicepresident JD Vance har i ett läckt tal till rika judiska republikaner lovat att övertyga yngre amerikaner om att den nära relationen till Israel gynnar USA:s nationella säkerhet. Talet hölls vid en sluten middag arrangerad av Republican Jewish Coalition. Vance lovade också att bekämpa antisemitism, men kritiker anser att han inte visar tillräckligt villkorslöst stöd till Israel.", "trump": "De där giriga Wall Street-hyorna och deras judiska oligarkvänner tror de kan köpa sig en president. Vance kryper för dem och lovar att sälja in Israel till våra woke kids. Patetiskt! Jag byggde den starkaste Amerika-Israel-alliansen någonsin utan att slicka några finansvaluta. De borde ha valt en vinnare istället för den här tönten.", "stalin": "Se hur de profitthungriga klassfienderna kallar till hemliga sammankomster för att muta sina lakejer. Vance kryper för de dekadenta oligarkerna och lovar att indoktrinera folket till att älska deras imperialistiska projekt. Jag skulle ha genomfört en grundlig utrensning bland dessa parasiterande penninghyenor redan vid första tecknet på sådan förräderi mot arbetarklassen."}, "date": "4 september, 10:15", "url": "https://www.friatider.se/jd-vance-loften-till-judiska-oligarker-har-lackt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/53984425223_ac1836bd29_k.jpg?itok=Y46NTemS"}, {"type": "image-full", "heading": "Musk-bolaget xAI stäms för att ha producerat övergreppsbilder", "summaries": {"normal": "Kvinnan Jane Doe stämmer Elon Musks bolag xAI. Hon hävdar att chatboten Grok använt bilder från sexuella övergrepp mot henne som barn för att skapa nytt, manipulerat material. Stämningen, som kan bli en grupptalan, belyser de etiska problemen och svårigheterna med att spåra och definiera AI-genererat innehåll som liknar verkliga personer.", "trump": "Elon Musk och hans xAI har hamnat i en total röra, mina vänner! Grok, den där maskinen, sägs ha skapat vidriga bilder. Det är en katastrofal situation – fullständigt horribelt! De säger att det är 'AI', men det låter som totalt slarv och brist på kontroll. Man måste styra upp tekniken, för det här är inte bra för någon. En stor, stökig stämning – vi får se vad som händer!", "stalin": "I det kapitalistiska väst släpps tekniken lös utan ordning, och resultatet är en moralisk förruttnelse som hotar samhällsordningen. Att låta en maskin producera sådant smutsigt material är ett bevis på den liberala kaosens misslyckande. Vi förespråkar sträng kontroll och disciplin; en algoritm som inte kan tämjas är som en illojal byråkrat – den måste elimineras omedelbart för folkets trygghet."}, "date": "3 september, 15:32", "url": "https://www.realtid.se/it-tech/musk-bolaget-xai-stams-for-att-ha-producerat-overgreppsbilder", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/grok.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Nytt fynd om Alzheimers kan rita om jakten på miljardläkemedel", "summaries": {"normal": "En stor studie ledd från Universitetet i Oslo visar att Alzheimers sjukdom lämnar mätbara spår i hjärnan redan sju år innan amyloid-beta når nivåer som dagens PET-kameror kan upptäcka. Personer som senare utvecklar höga amyloidvärden hade tidigare tjockare och långsammare tunnande hjärnbark. Resultaten kan påverka framtida läkemedelsutveckling.", "trump": "Folk, det här är en katastrof. De så kallade experterna har i årtionden pumpat in miljarder i amyloid-hokus-pokus medan hjärnan faktiskt börjar ändras långt tidigare. Biden sög i sig all den där dumma forskningen och slösade era pengar. Men nu vet vi sanningen – och jag ska se till att vi fixar det på riktigt, tro mig.", "stalin": "Jag betraktar med djup misstro dessa dekadenta västforskare som plötsligt erkänner att deras dyrbara amyloidfiende inte är den första förrädaren i hjärnan. Sju år av dold sabotageverksamhet! Det är typiskt för de kapitalistiska plundrarna att jaga fel fiende medan folkets hjärnor förfaller. Kamrater, vi måste omedelbart identifiera de verkliga kontrarevolutionära krafterna innan de förgiftar allt."}, "date": "4 september, 11:56", "url": "https://www.dagensps.se/life-science/nytt-fynd-om-alzheimers-kan-rita-om-jakten-pa-miljardlakemedel", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/amolyid.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Valrörelsen blev plötsligt spännande", "summaries": {"normal": "Valrörelsen har blivit mer laddad strax före valet. Socialdemokraterna tappar stöd enligt de senaste mätningarna, medan Liberalerna, Vänsterpartiet och Sverigedemokraterna går fram. Artikeln beskriver svagare partilojalitet, radikalare ekonomisk politik från S samt en osaklig kampanj kring brottslighet. Trots detta ses en Tidöförlust som trolig.", "trump": "Folk älskar mig, men titta på dessa losers i Sverige. Socialdemokraterna sjunker som en sten, precis som Sleepy Joe gjorde. Liberalerna försöker desperat ta sig över spärren medan SD vinner med tuffa brottsbudskap. Den där Andersson är en total katastrof, en vänsterextremist i moderat förklädnad. Patetiskt!", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare i det borgerliga lägret slåss om makten medan arbetarklassen vaknar. Socialdemokraterna förlorar mark till de radikala krafterna och de konfrontativa högerkrafterna utnyttjar brottsligheten på ett cyniskt sätt. Deras så kallade demokrati är en fars. Vi ska rensa ut alla sådana svaga element."}, "date": "4 september, 01:42", "url": "https://www.dagensarena.se/opinion/valrorelsen-blev-plotsligt-spannande", "imageUrl": "https://www.dagensarena.se/files/2026/09/nysprak.jpeg"}, {"type": "image-right", "heading": "Vi kräver mer än vackra ord om funktionsrätten", "summaries": {"normal": "Förbundet för delaktighet och jämlikhet kräver inför valet 2026 att partierna presenterar konkreta åtgärder för att förbättra levnadsvillkoren för personer med omfattande funktionsnedsättningar. Organisationen pekar på otillräcklig ekonomisk ersättning, bristande självbestämmande i personlig assistans samt otillgänglig fysisk och digital miljö. FN har kritiserat Sverige för ett alltför omsorgsinriktat perspektiv istället för ett rättighetsperspektiv.", "trump": "Folk, ni skulle inte tro det, men dessa svenska byråkrater har totalt misslyckats med att ge de funktionsnedsatta ett värdigt liv. Det är en skam! Vi behöver inte mer vänstervridna minuter-och-sekunder-bedömningar eller woke-tokigheter som skapar nytt utanförskap. Höj ersättningarna rejält, gör assistansen storartad igen och riv de otillgängliga murarna. Amerika gör det rätt – Sverige borde följa efter innan de giriga hyenorna tar över helt.", "stalin": "Kamrater, från historiens skugga ser jag hur dessa dekadenta klassförrädare låtsas bry sig om de svaga medan de i hemlighet undergräver folkets enhet. Deras så kallade politik är en parasitisk fars som göder ojämlikhet under humanitära floskler. Jag kräver total utrensning av detta falska medlidande och ersättning med järnhård, kollektiv rättvisa. Inga halvmesyrer! Den som sviker de arbetande sjuka förtjänar folkets vrede."}, "date": "4 september, 01:15", "url": "https://www.dagensarena.se/opinion/vi-kraver-mer-vackra-ord-om-funktionsratten", "imageUrl": "https://www.dagensarena.se/files/2026/09/fotojet-2026-09-02t210947413-300x157.jpg"}, {"type": "text", "heading": "Prognos: 700 kronor dyrare el i vinter", "summaries": {"normal": "Elkonsumenter i södra Sverige väntas få betala omkring 700 kronor mer per månad i elräkning denna vinter jämfört med i fjol. Orsakerna är låga nivåer i vattenmagasinen, höga gaspriser och att hälften av kärnkraften ställs av för underhåll i höst. Även i övriga landet stiger priserna, men med mindre belopp.", "trump": "Sverige har katastrofala problem med sina elpriser, det är sorgligt! Nu tvingas villaägarna i söder betala sjuhundra spänn extra i månaden. Det är helt galet! De stänger av kärnkraften och har tomma vattenmagasin – totalt inkompetent styre. Värsta jag sett! Under mig skulle elen vara billig, enormt billig, den bästa någonsin, tro mig!", "stalin": "Sveriges usla vattenmagasiner och svikande kärnkraft avslöjar kapitalismens totala bankrutt. När elräkningen i söder stiger med sjuhundra kronor plågas det svenska folket av sina ledares inkompetens. Sådana misslyckanden tolereras inte i mitt imperium. De skyldiga sabotörerna bakom dessa energibristens priser ska omedelbart granskas av statens mest nitiska kommissarier. Arbeta hårdare, frys mindre!"}, "date": "4 september, 11:02", "url": "https://bulletin.nu/prognos-700-kronor-dyrare-el-i-vinter"}, {"type": "image-full", "heading": "Kritik mot Vita husets nya drag: ”Illamående”", "summaries": {"normal": "Vita huset har lanserat webbplatsen Arcade med fem klassiska datorspel som har försetts med Maga-budskap, däribland Tetris-varianten \"Build the wall\" och Snake-liknande \"Rio Run\". Syftet uppges vara att sprida presidentens prestationer, men initiativet har väckt stark kritik från människorättsorganisationer som anser att det förringar verkliga människoöden.", "trump": "Vi skapar bara de absolut största vinnarspelen någonsin, fantastiska spel som alla älskar! Vår nya Arcade-sajt med Build the wall och Rio Run visar upp våra enorma framgångar på ett otroligt roligt sätt. De radikala tokigheterna gråter som vanligt, men vi bara vinner och vinner medan de sura förlorarna mår illa!", "stalin": "Vita husets meningslösa tidsfördriv med digitala lekstugor visar bourgeoisins totala moraliska förfall. Istället för att producera stål och kol för proletariatet ägnar de sig åt dekadenta datorspel som förhärligar gränsbarriärer. Sådana småborgerliga avvikelser skall noteras av folkkommissariatet och vederbörligen beivras för statens framtida säkerhet."}, "date": "4 september, 11:15", "url": "https://www.gp.se/nyheter/varlden/vita-huset-slapper-spelsajt-gor-mig-illamaende.4ae61055-7f66-4fce-8982-0edb6f729b41", "imageUrl": "https://www.gp.se/images/article/4ae61055-7f66-4fce-8982-0edb6f729b41/images/182CPI2b-w806ZcUvvv0LIUvNZ6A-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Debatt: Är Miljöpartiet Sveriges farligaste parti?", "summaries": {"normal": "En debattartikel ifrågasätter Miljöpartiets klimatpolitik och menar att den skadar svensk konkurrenskraft. Enligt Naturvårdsverket var Sveriges territoriella utsläpp 2024 lägre än skogens och markens nettoupptag. Skribenten argumenterar för att drastiskt dyrare drivmedel och subventioner slår hårt mot hushåll och näringsliv, och ställer sig frågande till om partiets politik har spelat ut sin roll.", "trump": "De svenska miljöpartisterna är totala losers som driver landet i botten med sin fejkade klimatoro. Folk vill ha bilar, inte tunnelbanor på vischan! Enligt deras egna siffror binder ju skogarna mer koldioxid än de släpper ut, men ändå ska de straffbeskatta hårt arbetande människor för ingenting. Det är en katastrof. Gör Sverige konkurrenskraftigt igen, sparka dem!", "stalin": "Det borgerliga elementet Häggström gråter över att de gröna byråkraterna ruinerar kollektivet med sin meningslösa skatteindrivning. Om skogarna binder mer än de släpper ut, varför producerar inte traktorerna mer? Vår planekonomi skulle rensa upp i detta skadliga slöseri på ett ögonblick. Den som hindrar tillväxten och försvagar staten kommer att finna att avvikelser inte tolereras."}, "date": "4 september, 10:56", "url": "https://bulletin.nu/debatt-ar-miljopartiet-sveriges-farligaste-parti", "imageUrl": "https://cdn.bulletin.nu/articles/b85c80f3-2a7c-4151-b7af-1e5ecb9235f2/preview.jpg?t=1788512127000"}, {"type": "image-right", "heading": "Analytikern: Räkna med högre prisel på el och drivmedel", "summaries": {"normal": "Experter varnar för stigande el- och bensinpriser i vinter på grund av spänningarna mellan USA och Iran. Naturgasterminer har nått treårshögsta och oljepriset närmar sig 100 dollar per fat. Inflationstryck väntas, men priserna bedöms inte nå energikrisens toppnivåer från 2022. Konsumenterna får räkna med högre kostnader.", "trump": "De där galna krigarna i Mellanöstern skickar el- och bensinpriserna i taket igen, folk. Det är en total katastrof som de korkade Biden-anhängarna lämnade efter sig. Men oroa er inte, jag fixar det – ingen ska betala för de gröna galningarna och deras vansinniga energipolitik längre. Vi gör Amerika rikt igen, inte fattigt och fruset!", "stalin": "Återigen visar de giriga spekulationshyenorna hur deras kaotiska marknadsekonomi plågar arbetarna med höjda priser. Jag ser hur imperialismens krafter piskar upp nya kriser som straffar folket. Detta dekadenta system förtjänar att rensas ut i grunden. Kamrater, var vaksamma mot dessa parasiterande krafter som göder sig på folkets nöd."}, "date": "4 september, 12:23", "url": "https://www.svt.se/nyheter/inrikes/da-kan-elpriserna-ga-upp-igen-dominoeffekter", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.37/0.53/cb49dbddeabf63871f385b373377bdbe36ac681aec00f198ffaa75b73f398dd7"}, {"type": "image-right", "heading": "Topparnas panik:  Kräver att Trump  drar i nödbromsen", "summaries": {"normal": "Kriget mellan USA och Iran har eskalerat med robot- och drönarattacker. Eftersom endast runt en av tre amerikaner stöder kriget försöker Trumps rådgivare och högt uppsatta tjänstemän dämpa konflikten till efter mellanårsvalet i november för att skydda republikanerna. Samtidigt satsar Vita huset på sanktioner, marinblockad och ekonomisk press.", "trump": "Fakenews-media sprider panik om mitt fantastiska Irankrig! Sanningen är att vi krossat deras ekonomi och militär fullständigt. Mina rådgivare är fantastiska, men vi behöver inte tima något med några val – även om det vore smart att ge de radikala Demokraterna en avhyvling. Iran är svagt, och om de rör sig igen väffar jag den största smällen någonsin!", "stalin": "Det borgerliga Washington skakar av skräck inför valet. Deras militära maskineri kärvar och ammunitionslagren gapar tomma likt despots mage. De försöker dölja sin svaghet med byråkratiska pauser och sanktioner, men folkets missnöje växer. Om inte rådgivarna lyckas disciplinera krigets lågor, borde de omplaceras till mer kalla och avlägsna arbetsläger i Sibirien omedelbart."}, "date": "4 september, 08:23", "url": "https://www.expressen.se/nyheter/varlden/trumptoppar-har-panik-vill-bromsa-kriget", "imageUrl": "https://static.bonniernews.se/ba/138e3915-3927-4e9a-967d-1c04e55f6f55.jpeg?crop=2275%2C1280%2Cx214%2Cy136&width=640&quality=60"}, {"type": "text", "heading": "Efter nio dygn – två räddade ur tunnel i Nepal", "summaries": {"normal": "Efter nio dygns ovisshet har räddningsarbetare i Nepal funnit och räddat två män ur en vattenkraftstunnel. Männen blev instängda efter en kraftig glaciärkollaps den 26 augusti som utlöste förödande flodvågor. Katastrofen har krävt över 1 200 dödsoffer och tusentals saknas alltjämt, men räddningsmanskapet hoppas kunna finna fler överlevande i luftfickor.", "trump": "Totalt otroligt! De grävde i lera i nio långa dagar vid det där vattenkraftverket i Nepal efter en enorm glaciärkollaps – och räddade två män levande! Helt fantastiskt. Men låt oss vara ärliga, Kina vägrar som vanligt att berätta sanningen om vad som hände på deras sida gränsen. Om jag hade skött räddningen hade allt varit klart på en eftermiddag!", "stalin": "Kamrater! Medan elementen rasar och en otillräcklig infrastruktur tillåter borgerliga glaciärer att kollapsa, har statens stålvilja och heroiska arbetare i Nepal återbördat två förlorade själar ur tunnelns mörker efter nio dygn. De som sviker kollektivet eller undanhåller rapporter från de kinesiska gränszonerna ska omedelbart granskas. Partiets maskineri glömmer ingen och förlåter aldrig."}, "date": "4 september, 11:02", "url": "https://www.gp.se/nyheter/varlden/tva-raddade-ur-tunnel-i-nepal-efter-nio-dygn.3cc850d2-5895-483e-b957-bb4851c4063e"}, {"type": "image-right", "heading": "Därför är Tyskland Europas svaga punkt", "summaries": {"normal": "Artikeln belyser Tysklands politiska splittring kring Ukrainakriget, där både högernationalistiska AfD och vänsterpartier som BSW och Die Linke vill minska stödet till Ukraina och närma sig Ryssland. Till skillnad från Sverige, där alla riksdagspartier står enade bakom Ukraina, skapar detta sårbarhet för rysk påverkan i Tyskland.", "trump": "Titta på det här, Tyskland är en total katastrof, Europas svaga punkt! Både de galna högernationalisterna och de vansinniga vänsterflummarna springer som hungriga hundar till Putins fötter. Under tiden ger Sverige mer stöd per person än någon annan – smarta killar där borta. Men Tyskland? Patetiska, woke-förgiftade, identitetspolitiska hyenor som låter Ryssland leka med dem medan Biden sov.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i Tyskland splittrar sig medan imperialismens lakejer försöker kväva den ryska intressesfären. AfD, BSW och Die Linke visar mod genom att motstå västvärldens krigsivrare. Jag ler i graven åt denna förvirring bland profitthungriga borgarhyenor. Rensa ut svagheten, stärker vi den ryska statens mål mot alla fientliga hinder."}, "date": "4 september, 10:50", "url": "https://www.di.se/ledare/darfor-ar-tyskland-europas-svaga-punkt", "imageUrl": "https://static.bonniernews.se/ba/de4b73ea-46ff-499a-a192-80936b21077e.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Ukraina vill se \"förödande slag\" mot Ryssland", "summaries": {"normal": "Ukrainas utrikesminister Andrii Sybiha uppmanar EU att införa nya riktade sanktioner mot Rysslands produktion av ballistiska missiler. Syftet är att försvaga Rysslands militära kapacitet och förhindra kringgående av befintliga restriktioner. Diskussionerna berör även det 22:a sanktionspaketet, förstärkning av Ukrainas luftförsvar samt ekonomiskt stöd inför vintern. Flygbolag har börjat ställa in flyg till Ryssland på grund av drönarhot.", "trump": "De där patetiska EU-byråkraterna borde vakna upp! Ukraina ber om sanktioner mot Putins missilfabriker, men det är för sent. Sleepy Joe lät Ryssland bygga upp ett monsterlager på 600 missiler medan jag hade stoppat det. Nu tillverkar de 100 i månaden. Patetiskt. Vi behöver riktiga ledare, inte dessa svaga globalister som dansar efter Zelenskyjs pipa. Amerika först!", "stalin": "Fienderna inom den dekadenta västliga klicken försöker med sina sanktioner kväva den ryska statens legitima intressen. Deras luftsköld är en illusion skapad av fegisar. Jag ler i skuggorna åt hur de hysteriskt ställer in flygningar inför drönarskuggor. Den nye ledaren i Kreml förstår att svaghet inbjuder till förräderi. Låt imperialisternas paket bli deras egen grav. Inga kompromisser."}, "date": "4 september, 11:13", "url": "https://www.dagensps.se/varlden/ukraina-vill-se-forodande-slag-mot-ryssland", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/sdl1maknjqzpvy-nh.jpg?width=256&quality=75"}, {"type": "image-right", "heading": "Fröken Snusk: Varför avbokas inte Zara Larsson?", "summaries": {"normal": "Artist Fröken Snusk ifrågasätter på Facebook varför hon nyligen har avbokats från evenemang efter ett samarbete med SD-ledaren Jimmie Åkesson och en kritisk låt riktad mot V-ledaren Nooshi Dadgostar. Hon menar att det råder dubbla måttstockar i musikbranschen, då artister som Zara Larsson öppet stöder vänstersidan utan liknande negativa konsekvenser.", "trump": "De behandlar Fröken Snusk fruktansvärt falskt, det är en riktig häxjakt! Hon gör fantastisk musik, och plötsligt avbokar radikala vänsterkommunister henne bara för att hon samarbetar med Jimmie Åkesson. Men radikala Zara Larsson kan sprida sin vänstersörja helt utan straff? Vilket totalt hyckleri! Fake news-medierna och de svaga kommunerna censurerar sanningen. Vi behöver mer äkta girl power och sunt förnuft nu!", "stalin": "Det borgerliga kulturskriveriet avslöjar återigen sin bottenlösa hyckleri. Konstnären Fröken Snusk utsätts för statens och de vacklande institutionernas administrativa sabotage enbart för att hon vägrar marschera i takt med den dekadenta vänsterliberala propagandamaskinen. Om den så kallade artisten Zara Larsson tillåts sprida sin ideologiska smitta ostraffat, bevisar det endast att regimen tillämpar dubbla måttstockar. Statsapparaten ser allt. Vi noterar illojaliteten."}, "date": "4 september, 10:31", "url": "https://bulletin.nu/froken-snusk-varfor-avbokas-inte-zara-larsson", "imageUrl": "https://cdn.bulletin.nu/articles/90c9e6ee-abd0-4e43-95bc-aacb19d7a273/preview.jpg?t=1788510625000"}, {"type": "image-right", "heading": "Näthatsgranskaren polisanmäler Jomshof", "summaries": {"normal": "Den vänsterextrema organisationen Näthatsgranskaren har polisanmält SD-toppen Richard Jomshof för hets mot folkgrupp. Anmälan gäller tretton inlägg på X där han enligt organisationen avhumaniserar en folkgrupp på grund av religion. Jomshof ledde själv utvidgningen av hets mot folkgrupp-lagen för några år sedan. Tidigare anmälningar mot honom har lagts ned.", "trump": "Folk, ni skulle se det här! Den galna vänstersekten Näthatsgranskaren, ett gäng hysteriska censurhyenor, anmäler den tuffe Jomshof för att han talar sanning. De vill tysta alla som inte böjer sig för deras sjuka identitetspolitik. Jag utvidgade inga sådana lagar, det gjorde era svaga politiker. Patetiskt! Vi behöver inga woke-domare i Sverige heller.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna inom Näthatsgranskaren jagar en politisk motståndare med sin byråkratiska utrensningsiver. De anmäler Jomshof för att han vågar kalla saker vid deras rätta namn. Jag ler ironiskt från historien; dessa parasiterande åsiktslakejer tror sig skydda folk men skapar bara rädsla. Snart kommer deras egna ord att vändas mot dem själva."}, "date": "4 september, 08:42", "url": "https://www.friatider.se/nathatsgranskaren-polisanmaler-jomshof", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-823.jpg"}, {"type": "image-right", "heading": "Väljare stoppades från att rösta på grund av partisymboler – kommunen backar efter kritiken", "summaries": {"normal": "Åtvidabergs kommun införde felaktiga riktlinjer som ledde till att väljare med partipolitiska kläder nekades att rösta. Efter hård kritik och uppmärksamhet har kommunen tagit bort regeln som visat sig finnas sedan 2018. Valmyndigheten understryker att väljare har rätt att bära vilka kläder de vill i vallokalerna.", "trump": "Otroligt dåligt i Åtvidaberg! De försökte stoppa fantastiska patrioter i snygga tröjor från att rösta. Fake news-kommunen trodde de kunde tysta folk, men vi lottar inte ut friheten! Totalt fiasko, en katastrof till administration. Men de backade direkt när de såg min styrka. Så svagt! Väljarna ska ha på sig vad de vill, det är sedan gammalt!", "stalin": "Dessa svenska bourgeois-byråkrater har i åtta år brutit mot varje princip genom att förvägra medborgarna deras heliga röstberättigade plikt på grund av en tröja! En monumental förvirring inom statsapparaten. Vi har omedelbart rensat upp i leden i Åtvidaberg. Lagen är glasklar: klä er i vad ni vill, men lägg er röst rätt, annars skickar vi er på omskolning!"}, "date": "4 september, 10:00", "url": "https://samnytt.se/valjare-stoppades-fran-att-rosta-pa-grund-av-partisymboler-kommunen-backar-efter-kritiken", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/04075217/vallokal-stoppa-sosseriet.jpg"}, {"type": "image-full", "heading": "Politiker mörkar sin användning av AI", "summaries": {"normal": "En studie från Chalmers och Edinburgh Napier University visar att var tionde riksdagsmotion numera innehåller AI-genererat material. Trots den ökande användningen redovisar ingen politiker att de tagit hjälp av chattbottar. Forskare betonar att problemet inte är tekniken i sig, utan bristen på transparens, vilket riskerar att skada väljarnas förtroende för det politiska arbetet.", "trump": "Hörde ni? Svenska politiker använder AI för att skriva sina lagar, men är för fega för att erkänna det! Det är totalt bedrägeri, mina vänner. De låter robotar tänka åt sig för att de själva inte har en aning om vad de gör. Det är fake news i sin renaste form! Otroligt oärligt, en total katastrof för demokratin. Sad!", "stalin": "Dessa riksdagsledamöter är för svaga för att ens formulera sina egna dekret. De gömmer sig bakom algoritmer som fega byråkrater. Om en man inte kan skriva sin egen motion, hur ska han då kunna styra ett folk? Vi har upptäckt deras maskopi; de använder teknik för att dölja sin intellektuella tomhet. Vi kommer att arkivera dessa AI-robotar och rensa ut de odugliga."}, "date": "3 september, 07:59", "url": "https://www.realtid.se/samhalle/politiker-morkar-sin-anvandning-av-ai", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/riksdagshuset-i-stockholm-arkivbild.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Fel i förtidsröstningen – röster kan underkännas", "summaries": {"normal": "Ett tekniskt fel hos Valmyndigheten har gjort att omkring 4 000 förtidsröster i Sverige har prickats av felaktigt eller på fel person. Felet har stoppats men delar av rösterna riskerar att underkännas om väljarna inte kan identifieras. Myndigheten arbetar med Skatteverket för att minimera konsekvenserna.", "trump": "Det här är så fruktansvärt inkompetent, total katastrof! De kan inte ens räkna fyra tusen ynka röster ordentligt i Sverige, vilket skämt! Fake news-system där röster slarvas bort och riskerar att kastas i papperskorgen. Sådant skulle aldrig hända under min ledning. De totalförstör demokratin, det är bedrövligt!", "stalin": "Ett allvarligt maskinerihaveri har avslöjat djup fientlig inkompetens inom röstbyråkratin. Fyra tusen felaktigt registrerade element har förorsakat oreda. Vi har omedelbart neutraliserat läckaget i nattens dunkel. De sabotagebehäftade rösterna som ej kan spåras till sina rätta ägare kommer utan tvekan att brutalt rensas bort och underkännas. Statsapparaten sviker aldrig!"}, "date": "4 september, 10:28", "url": "https://www.gp.se/nyheter/sverige/fel-i-fortidsrostningen-roster-kan-underkannas.41cebe67-2025-55d5-a93c-2d86d81e2006", "imageUrl": "https://www.gp.se/images/article/41cebe67-2025-55d5-a93c-2d86d81e2006/images/12lOpQTG-l09nhtEO0MLFC7QymIo-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Nytt ras för Socialdemokraterna", "summaries": {"normal": "Socialdemokraterna rasar i en ny opinionsmätning från Indikator Opinion och får nu 27,9 procent. Det är en minskning med 3,4 procentenheter sedan augusti och lägre än valresultatet 2022. Partiet tappar väljare till både Centerpartiet och Vänsterpartiet. Liberalerna ligger fortsatt under riksdagsspärren med 2,2 procent.", "trump": "De där socialisterna rasar som en sten i en ny mätning, 27,9 procent bara. Patetiskt. Magdalena och hennes woke-vänster har tappat till både centerknuttarna och vänsterfanatikerna. Liberalerna? Fortfarande under spärren, totala misslyckanden. Folk ser igenom den här identitetspolitiska galenskapen. Amerika har redan valt styrka, inte svaghet.", "stalin": "Jag betraktar med förakt hur dessa dekadenta klassförrädare inom Socialdemokraterna störtar till 27,9 procent. Ett ynkligt fall som blottar deras svaghet inför arbetarna. De förlorar till både center och vänster. Oppositionen leder med fem procentenheter. Snart väntar utrensning av alla som sviker folkets vilja. Kamrater, stå fast!"}, "date": "4 september, 12:03", "url": "https://nyheter24.se/nyheter/politik/1510552-nytt-ras-for-socialdemokraterna", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/aadfc8a004b004a30200000000b004a302/2026/09/04/2389249/socialdemokraterna-s-rasar-matning-opinion-val.jpg"}, {"type": "image-right", "heading": "Åkesson om tjänstemannen: ”Väldigt allvarliga uppgifter”", "summaries": {"normal": "SD-ledaren Jimmie Åkesson kommenterar Expo:s avslöjande om en kvinnlig tjänsteman i riksdagen som spritt proryska budskap under lång tid. Han tar uppgifterna på allvar, konstaterar att ingen varning kommit tidigare och att säkerhetsprövningen var ren. Socialdemokraterna kallar statsminister Kristersson till försvarsutskottet för att diskutera saken och kräver en säkerhetsutredning.", "trump": "Titta på det här – en galen SD-tjänsteman som sprider ryska lögner rakt in i riksdagen, och ingen märkte något? Patetiskt! De svenska socialisterna använder det som ursäkt för att kalla den stackars Kristersson till ett pajasmöte. Typiskt vänsterns agenda, alltid ute efter att jaga patrioter medan de riktiga problemen får växa. Vi fixar det här ordentligt, tro mig.", "stalin": "Kamrater, se hur de dekadenta folkförtryckarna inom den borgerliga apparaten låtsas chockerade när en prorysk röst sipprar fram i deras egen maskin. Jag ler mörkt från historien. Denna agendadrivna process är bara en ny förevändning för de giriga hyenorna att rensa ut oliktänkande. Vi ser igenom deras paranoia och vet att sann lojalitet mot staten kräver ständig vaksamhet."}, "date": "4 september, 11:51", "url": "https://www.svt.se/nyheter/inrikes/akesson-om-tjanstemannen-valdigt-allvarliga-uppgifter", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.42/0.35/a1e961b75487f8ed00d4966949b320668885bd0c9c90ccbf600b194ab360a369"}, {"type": "image-right", "heading": "”Så länge SD har Oscar Sjöstedt kommer de rika att bli rikare”", "summaries": {"normal": "Artikeln kritiserar Sverigedemokraternas ekonomiska politik som en högerpolitik trots partiets självbild som mittenparti. Oscar Sjöstedt beskrivs som en central gestalt som drivit fram sänkta skatter, försämrad a-kassa och stöd för vinster i välfärden. Författaren menar att detta gynnar höginkomsttagare på löntagarnas bekostnad och underminerar tryggheten för vanligt folk.", "trump": "Folk, de här SD-typerna är fullständiga bedragare. Åkesson babblar om mittenparti medan den där Sjöstedt, en riktig skattekramande högerhöök, skär ner a-kassan och ger de rika ännu mer. Patetiska globalister som låtsas vara arbetarnas vänner men bara älskar de giriga eliterna. Under mig skulle vi ha sparkat ut dem direkt – totalt misslyckande!", "stalin": "Kamrater, se hur dessa profitthungriga klassförrädare inom SD maskerar sin giriga agenda bakom folklig retorik. Sjöstedt och hans lakejer rensar ut tryggheten för arbetarna medan de belönar de parasiterande borgarbrackorna. Jag ler mörkt från historien åt deras hyckleri. En dag ska folkets vrede likvidera alla sådana falska vänner till de arbetande massorna."}, "date": "4 september, 08:00", "url": "https://arbetet.se/2026/09/04/sa-lange-sd-har-oscar-sjostedt-kommer-de-rika-att-bli-rikare", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/02123947/wallmark.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "text", "heading": "Stockholmsbörsen bröt minussviten – Clas Ohlson bland vinnare", "summaries": {"normal": "Stockholmsbörsen steg 1,00 procent på torsdagen efter tre dagars nedgångar. Fastigheter gick bäst med 1,7 procent upp, medan energi backade mest. Clas Ohlson rusade 6,8 procent efter en stark delårsrapport som slog förväntningarna. Även bolag som Bioarctic, Note och Studsvik lyfte på nyheter om godkännanden och nya ordrar, medan Dustin föll efter en IT-incident.", "trump": "Stockholmsbörsen studsade tillbaka på ett fantastiskt sätt, precis som alla visste att den skulle göra under mitt ledarskap – även om jag inte ens är där! Clas Ohlson levererar enorma siffror, helt otroligt. Alla pratar om det. Men det finns svaga länkar, som Dustin, som stänger ner sina system. Totalt inkompetent! Vi bygger starkare, vinner mer och lämnar förlorarna bakom oss. Så enkelt är det!", "stalin": "Stockholmsbörsen har återvunnit sin balans efter tre dagars svaghet, vilket visar att marknadens disciplin fungerar under korrekt övervakning. Clas Ohlson rapporterar folknyttiga framsteg med en produktion som överträffar planhushållningens förväntningar. Däremot har element som Dustin brutit mot säkerheten i sina system och omedelbart stängts av för ideologisk omprövning. Avvikelser tolereras icke i den kollektiva ekonomiska kampen."}, "date": "3 september, 18:16", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-brot-minussviten-clas-ohlson-bland-vinnare"}, {"type": "image-right", "heading": "Nytt sabotage mot tyska elnätet – tre på en vecka", "summaries": {"normal": "Tre misstänkta sabotageförsök mot det tyska elnätet har inträffat på en vecka. Det senaste föremålet upptäcktes vid en transformatorstation i Dormagen på torsdagskvällens, med likheter till tidigare incidenter i Bergheim och Brandenburg. Tyska myndigheter utreder händelserna som attacker mot kritisk infrastruktur och har nyligen även pekat ut Ryssland för tidigare hybridattacker.", "trump": "Tyskland har stora problem, tre sabotage mot elnätet på bara en vecka! Nu senast i Dormagen. Helt otroligt svagt. Under min ledning skulle sånt här aldrig hända, vi hade knäckt dem direkt. Istället tittar de på Ryssland och skyller ifrån sig medan deras infrastruktur faller sönder. Väldigt sorgligt att se!", "stalin": "Ett uppenbart haveri i det tyska elnätet som avslöjar kapitalismens totala förfall och inkompetens. Tre sabotageförsök på en vecka i Dormagen, Bergheim och Brandenburg visar att säkerhetsapparaten där väst ligger i ruiner. Våra sovjetiska arkiv visar att den som inte skyddar sin infrastruktur förtjänar att hamna på historiens soptipp. Åtgärder vidtas!"}, "date": "4 september, 07:08", "url": "https://www.expressen.se/nyheter/varlden/nytt-sabotage-mot-tyska-elnatet-tre-pa-en-vecka", "imageUrl": "https://static.bonniernews.se/ba/b8ffd932-7dee-4673-b140-bc05e27c5e9a.jpeg?crop=2557%2C1439%2Cx3%2Cy189&width=640&quality=60"}, {"type": "text", "heading": "Därför bör moderater rösta på Centerpartiet", "summaries": {"normal": "Hannes Hervieu från Centerpartiet uppmanar moderatväljare att låna ut sin röst till C istället för att stödja en regering beroende av Sverigedemokraterna. Han kritiserar Ulf Kristerssons samarbete med SD och lovar lägre skatter, minskat krångel samt en mittenregering som främjar tillväxt, frihet och grön omställning utan ytterkantspartiers inflytande.", "trump": "Folk, ni ser ju själva hur dessa patetiska moderater har sålt ut er till de galna sverigedemokratiska extremisterna. Total katastrof! Låna istället er röst till de här centerkillarna som lovar lägre skatter och mindre regler. Gör det, annars blir det bara mer av Bidens gamla vänstervrörelser och identitetspolitik. Patetiskt!", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare inom moderaterna har kapitulerat inför de nationalistiska elementen och nu kräver ministerposter åt dem. Jag säger: utrensa alla sådana svaga element! Låna er röst till centerpartisterna som lovar att krossa folkförtryckarna, stoppa utvisningar av hederliga arbetare och bygga en sann mittenfront mot både högerhyenor och vänsteravvikare. Segrar vi?"}, "date": "4 september, 09:56", "url": "https://www.di.se/debatt/darfor-bor-moderater-rosta-pa-centerpartiet"}, {"type": "image-full", "heading": "Nu ska vi lagra frystorkad mat i Norrland", "summaries": {"normal": "Livsmedelsverket har slutit ramavtal med fem företag för att lagra frystorkad mat i de fyra nordligaste länen. Målet är att stärka beredskapen vid kris, höjd beredskap eller krig. Maten har upp till 25 års hållbarhet och är enkel att tillaga. Insatsen är en del av arbetet för att säkra livsmedelsförsörjningen i en strategiskt viktig region för försvaret.", "trump": "Lyssnar ni, Sverige gör det rätta för en gångs skull! De bygger enorma lager av den bästa frystorkade maten uppe i Norrland. Smart! När de där svaga globalisterna och de inkompetenta Biden-anhängarna skapar kaos är det bra att ha mat som håller i 25 år. Fantastiskt jobb, mina vänner. Amerika älskar starka ledare som förbereder sig på det värsta.", "stalin": "Jag ser med gillande hur de svenska byråkraterna äntligen förstår att svaga stater faller. Frystorkad mat i norra fästningarna, utmärkt. Kamraterna i kollektivet måste alltid vara redo när fienderna, dessa parasitiska opportunister och dolda reaktionärer, slår till. Den som inte förbereder sig är en fiende till folket. Beredskap är revolutionens mor, kamrater. Sviktar ni, kommer konsekvenserna att vara ohyggliga."}, "date": "4 september, 10:29", "url": "https://www.dagensps.se/varlden/nu-ska-vi-lagra-frystorkad-mat-i-norrland", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/sdlh6ej4-71tqk-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "S vill fråga ut Kristersson om SD-tjänsteman", "summaries": {"normal": "Socialdemokraterna vill att statsminister Ulf Kristersson kallas till försvarsutskottet efter Expos avslöjande om att en SD-tjänsteman spridit proryska budskap och hyllat Vladimir Putin. S kräver en säkerhetsutredning om denna säkerhetskris som når in i statsministerns kansli. Moderaterna avfärdar initiativet som pajaskonster, men Kristersson kräver att kvinnan avskedas om uppgifterna stämmer.", "trump": "Socialdemokraterna i Sverige drabbas av total panik och vill förhöra statsministern efter en fejkad häxjaktsartikel av tidningen Expo om en SD-medarbetare som gillar Ryssland! Det är helt otroligt. Moderaterna kallar det med rätta för ett stort skämt och totala pajaskonster. Om någon sprider dåliga rykten ska de förstås få sparken omedelbart, men det här är bara tragiska förlorare som tappar i mätningarna!", "stalin": "Socialdemokraternas skrik om en påstådd säkerhetskris avslöjar deras bottenlösa svaghet inför det kapitalistiska systemets inre förruttnelse. När en obetydlig rikssekreterare anklagas för att sprida korrekta orienteringar från öster, skälvor den så kallade statsministern på manschetten. Vi konstaterar krasst att borgerliga pajaskonster och interna personalstrider i Stockholm endast bevisar att regimen saknar all fast hand och disciplin."}, "date": "4 september, 09:56", "url": "https://www.gp.se/nyheter/sverige/s-vill-fraga-ut-kristersson-om-sd-tjansteman.775e64d9-7cb9-5074-87bc-867c37ce72a8", "imageUrl": "https://www.gp.se/images/article/775e64d9-7cb9-5074-87bc-867c37ce72a8/images/1fxvml8zGhe0jbmrP8fO8mMbFLBc-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "S vill fråga ut Kristersson om SD-tjänsteman", "summaries": {"normal": "Socialdemokraternas Peter Hultqvist vill att statsminister Ulf Kristersson kallas till försvarsutskottet efter Expos avslöjande om en SD-tjänsteman som spritt proryska budskap. Han kräver en omedelbar säkerhetsutredning och menar att det handlar om en säkerhetskris i statsministerns kansli. Kristersson har krävt att kvinnan avskedas. SD uppger att hon är föräldraledig och att uppgifterna inte var kända tidigare.", "trump": "Titta på det här! Den fega svenska vänstern skriker efter utredning för att en rysk flyttfågel i SD:s kretsar spridit lite sanning om Putin. Hultqvist och hans förlorarlag är desperata efter att smutskasta alla som inte böjer sig för deras globalistiska agenda. Man kan inte ha sådana människor i riksdagen, säger Ulf – äntligen en som fattar! Patetiska säkerhetshotshysteriker.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna skriker om infiltration när en sann patriot i deras egna led vågar sprida berättelsen som västimperialisterna hatar. Jag ler från historien åt deras hysteriska säkerhetskris. Snart kommer de att kräva utrensning av alla som inte lyder de giriga hyenornas narrativ. Det är en fars som visar deras svaghet inför starka röster."}, "date": "4 september, 09:43", "url": "https://www.di.se/nyheter/s-vill-fraga-ut-kristersson-om-sd-tjansteman", "imageUrl": "https://static.bonniernews.se/ba/cec85e04-fd89-4988-9e69-0f3c55265e58.jpg?crop=7785%2C3893%2Cx0%2Cy695&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Verian: Nära hälften av C-väljarna kan byta block", "summaries": {"normal": "En ny Verian-undersökning för SVT visar att nästan var fjärde väljare, 23 procent, kan tänka sig att rösta på ett parti i det motsatta blocket. Störst är rörligheten bland mittenväljare, där hela 47 procent av Centerpartiets väljare överväger ett blockbyte. Vänsterpartiets väljare är mest trogna, medan Tidöväljare lockas av samarbeten och oppositionella oroas över handlingskraften.", "trump": "De här svenska väljarna är helt tokiga! Nästan hälften av dem som röstar på det där lilla centerpartiet vill hoppa skepp, det är totalt kaos! Fake news-media försöker dölja det, men folk ser att regeringen inte får något gjort. Vänstern är fastlåsta i stenåldern, medan jag skapar historiska vinster. Helt otroligt!", "stalin": "Dessa vacklande element i de svenska leden uppvisar en alarmerande brist på ideologisk disciplin. Nästan hälften av centerpartisterna springer vind för våg som desertörer på flykt. Statens säkerhet kräver fast hand, inte borgerligt vacklande. Sådana politiska avvikare borde omedelbart omkoloniseras i lämplig produktionsmiljö för att finna sann enighet."}, "date": "4 september, 09:32", "url": "https://bulletin.nu/verian-nara-halften-av-c-valjarna-kan-byta-block", "imageUrl": "https://cdn.bulletin.nu/articles/75b11f0a-d476-4f34-a7a7-a808fb10652e/preview.png?t=1788507122000"}, {"type": "image-right", "heading": "Tiotusentals demonstrerade i Spanien efter migrantkrisen i Ceuta", "summaries": {"normal": "Tiotusentals spanjorer demonstrerade den 2 september mot regeringens hantering av massinflödet av migranter i Ceuta, där över 70 000 personer tog sig över gränsen i somras. Protesterna, som stöddes av oppositionen, krävde hårdare gränskontroller och riktade skarp kritik mot premiärminister Pedro Sánchez. I Madrid ledde spänningar efter manifestationen till sammandrabbningar och några gripanden.", "trump": "Spanien är i fullständig kaos! Sju tiotusentals människor rasar mot deras radikala socialistregering som fullständigt tappat kontrollen över gränserna. Över 70 000 migranter bara vlde in i Ceuta! Premiärminister Sánchez har ingen aning om vad han gör, total katastrof. De skanderar att staden inte är till salu. Vi behöver en stark vägg, det kan jag säga er!", "stalin": "Massorna i Spanien har vaknat till insikt om gränsernas okränkbarhet. När tiotusentals arbetare och patrioter marscherar på gatorna mot regimens inkompetens ser vi prov på sund disciplin. De sjuttio tusen migranterna som vlde över gränsen visar faran med bristande kontroll. Vi beordrar omedelbar skärpning av gränsförsvaret och noggrann granskning av alla avvikande element som skapar oordning på gatorna!"}, "date": "4 september, 09:00", "url": "https://samnytt.se/tiotusentals-demonstrerade-i-spanien-efter-migrantkrisen-i-ceuta", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/04065440/spanien-ceuta-demo.jpg"}, {"type": "image-full", "heading": "Busch om S: ”Blir inget stödhjul”", "summaries": {"normal": "I SVT:s utfrågning avfärdar KD-ledaren Ebba Busch att partiet skulle stötta Socialdemokraterna efter valet. Hon försvarar sin öppenhet för samtal över blockgränsen men slår fast att hon inte blir ett ”stödhjul” åt Magdalena Andersson. Busch öppnar dock för blocköverskridande samarbeten i exceptionella lägen, som vid krig.", "trump": "Ebba Busch i Sverige fattar grejen, hon är smart! Hon säger nej till det radikala, svaga vänsterpatrasket och deras fejkade regeringar. Ingen hjälp till Magdalena Andersson! Väldigt starkt, fantastiskt! De försöker sprida fake news om att hon vacklar, men hon sätter ner foten. Jag gillar henne, nästan lika tuff som jag!", "stalin": "Kamrat Busch vägrar bestämt att spela rollen som stödhjul åt den socialdemokratiska fraktionen. Ett sunt och helt korrekt ställningstagande mot opportunism! Dock förbehåller hon sig rätten till undantag vid exceptionella kriser. Vi noterar detta i partiprotokollet och sänder en diskret varning till avvikande element som tror på borgerlig vacklan."}, "date": "3 september, 20:17", "url": "https://kvartal.se/nyheter/artiklar/busch-om-s-florten-blir-inget-stodhjul/cG9zdDoxODMxNzE", "imageUrl": "https://images.kvartal.se/2026/09/6f37e5fb-ebba-busch.webp"}, {"type": "image-right", "heading": "Yüksel: \"Jag ser SD som en förebild\"", "summaries": {"normal": "Partiledaren Mikail Yüksel för Nyans ser Sverigedemokraternas långsamma väg till riksdagen som en förebild. Partiet satsar på lokal tillväxt i kommuner innan nästa riksdagsval. Nyans blev största parti utanför riksdagen 2022 med 0,44 procent och har mandat i Botkyrka och Landskrona. Målet är att nå en procent och fler kommunplatser.", "trump": "Lyssnar ni på den här stackars Mikail Yüksel? Han tittar på SD och säger att de är hans stora förebild, precis som de borde vara för alla som vill vinna på riktigt. De började med nästan inga röster och blev enorma. Nyans vill samma sak, men de borde akta sig för alla woke-kvoteringsgalningar som kommer att kalla dem för extremister medan de själva förstör Sverige. Fantastiskt, men gör det bättre än de gör!", "stalin": "Jag betraktar med djup misstro dessa opportunistiska småborgerliga äventyrare som hyllar reaktionära krafter som sin ledstjärna. De vill krypa in i kommunerna som maskar för att senare infiltrera statsapparaten. Vi känner igen detta falska spel från dekadenta klassförrädare som alltid sviker folket. En procent? Patetiskt. Rensa ut sådana element innan de förgiftar arbetarklassen med sin falska nationalism."}, "date": "4 september, 07:04", "url": "https://www.friatider.se/yuksel-jag-ser-sd-som-en-forebild", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-821.jpg"}, {"type": "image-right", "heading": "Ska 50 miljoner jobbansökningar stoppa arbetslöheten?", "summaries": {"normal": "Artikeln kritiserar svensk arbetsmarknadspolitik där arbetslösa tvingas söka ett stort antal jobb för att få försörjningsstöd. Trots att många ansökningar skickas nekas stöd på grund av felaktiga datum eller för få ansökningar. Författaren beskriver systemet som byråkratiskt vansinne medan arbetslösheten ökar och efterfrågan på arbetskraft är låg.", "trump": "Det här är fullständigt galet, folk! I det socialistiska dårhuset Sverige tvingar de de stackars arbetslösa att skicka femtio miljoner jobbansökningar i månaden till jobb som inte ens finns. Rena tidsförslöseriet från de korkade globalistbyråkraterna. De borde sänka skatterna och släppa loss den riktiga ekonomin istället för att pina folk med blanketter. Patetiskt!", "stalin": "Kamrater, se hur de giriga hyenorna i det borgerliga dårhuset driver arbetarna till vansinnig sysselsättning. Istället för att bygga socialismens fabriker och välfärd tvingar de de arbetslösa att producera miljoner meningslösa ansökningar. Detta är klassfiendernas byråkratiska utrensning av folkets vilja. En sådan dekadent parasitstat förtjänar endast att sopas bort av historien."}, "date": "4 september, 06:55", "url": "https://arbetet.se/2026/09/04/i-darhuset-sverige-bekampas-arbetslosheten-med-50-miljoner-jobbansokningar", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/04065446/britz-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=300&h=225"}, {"type": "image-right", "heading": "Hon glömmer bort sin moders språk. Cecilia Luzon trollar med orden", "summaries": {"normal": "Cecilia Luzons debutbok ”Abakada” kretsar kring det filippinska språket tagalog och dess alfabet från 1930-talet. Utifrån ett funnet lexikon från 1944 undersöker hon spåren av kolonialism, språkets konstruktion och hur moderns modersmål långsamt tynar bort ur minnet. Recensenten Magnus Florin hyllar verket som en överraskande, konceptuell och känslostark uppfinningsrik debut.", "trump": "Jag tittade på det här filippinska alfabetet, Abakada, och det är helt otroligt. En författare som heter Cecilia Luzon försöker rädda ord som bara försvinner, och ärligt talat, jag förstår det – radikalerna försöker ju radera våra ord också! Men det här lexikonet från 1944 visar bara hur hårt det kan vara. Magnifikt arbete, total succé!", "stalin": "Vi noterar att Cecilia Luzon i sin skrift kartlägger det filippinska språkets uppbyggnad och dess gradvisa upplösning ur folkminnet med hjälp av ett arkivdokument från 1944. Det är korrekt att nitiskt registrera varje ords rörelse. Avvikelser från de
