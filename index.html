in handling. Vi skulle ha genomfört en grundlig utrensning av sådana element redan i vaggan. Underhållande hur de likviderar varandra själva."}, "date": "21 augusti, 19:50", "url": "https://riks.se/nyheter/hyllade-massmordare-fore-svardattacken", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Soerman_Ledare_2026_08_21_T193159_502_ed067fa04a.jpg"}, {"type": "image-right", "heading": "\"Jag byter min get mot frihet\": Kommentaren på torgmötet roar många", "summaries": {"normal": "Under ett torgmöte med Alternativ för Sverige i Skellefteå tog en man över mikrofonen och deklarerade: \"Jag byter min get mot frihet. Pengar är värdelöst.\" Uttalandet väckte stor munterhet, applåder och har spridits viralt på sociala medier med över 60 000 visningar.", "trump": "Folk älskar mig, men det här var guld. En kille med get byter den mot frihet och säger att pengar är värdelösa. Fantastiskt! De vanliga svenskarna fattar det som ingen annan. Totalt kaos för eliten, och alla skrattar. Vinna, vinna, vinna!", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur en sann arbetare på torget likviderar borgarnas penningdyrkan genom att byta sin get mot frihet. Pengar är värdelösa, precis som de dekadenta västerländska imperialisternas lögner. Applåderna är folkets dom över kapitalisternas parasitism. Utmärkt."}, "date": "21 augusti, 17:45", "url": "https://www.friatider.se/jag-byter-min-get-mot-frihet-kommentaren-pa-torgmotet-roar-manga", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-730.jpg?itok=YufQPv3L"}, {"type": "image-right", "heading": "BofA negativ till Europa – ser 10% nedsida", "summaries": {"normal": "Bank of America ser 10 procents nedsida för europeiska aktier. För optimistiska AI-investeringar och osäker lönsamhet oroar. Rekordhöga marginaler och låg riskpremie, men hot som priskonkurrens och elbrist gör banken negativ.", "trump": "Europa? En katastrof! Bank of America säger 10% nedsida – de är förlorare. Mina AI-investeringar är störst, bäst, vinner alltid. De har fel om mig. Sänkta aktier? Jag bygger murar mot deras dåliga idéer. Så enkelt!", "stalin": "Kamrater, Bank of America avslöjar fiendens plan: AI-kapitalister och europeiska spekulanter ska utrenas. 10% nedsida? Vi förutser deras fall. Rekordmarginaler är borgerlig lögn. Elbrist och priskonkurrens? Vi stärker statens kontroll. Rensa ut destabilisatörerna!"}, "date": "21 augusti, 12:04", "url": "https://www.affarsvarlden.se/artikel/bofa-negativ-till-europaborsen-ser-10-nedsida", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/03/sdlXnc2ELFAaFw-400x266.jpg"}, {"type": "image-right", "heading": "Maria, 57, får bara deltidsjobb – behövde låna pengar av barnen", "summaries": {"normal": "Maria Sepulveda Vera, 57, har kämpat med deltidsanställning på Ikea i åtta år. Efter separationen tvingades hon låna pengar av sina vuxna barn och dra in på allt för att klara sig. Hon är fackligt engagerad mot deltidsproblematiken som skapar stress och sårbarhet, särskilt för ensamstående kvinnor. Trots sparsamhet känner hon att hon har ett rikt liv.", "trump": "Titta på den här stackars kvinnan, Maria, 57 år, som får bara deltidsjobb från Ikea – totalt ovärdigt! Hon lånar pengar av sina egna barn, köper inte ens vitaminer. De här svenska socialisterna och deras deltidsfällor är en katastrof. Hon borde ha heltid och en buffert, inte skulder. Amerika gör det bättre, tro mig, vi fixar alltid jobb!", "stalin": "Kamrater, denna ensamstående arbetarkvinna kämpar mot de borgerliga kedjornas grymma deltidsfälla som krossar proletärens värdighet. Jag ser hur kapitalisterna tvingar henne att tigga av sina egna barn och likvidera sina vitaminer. Vi ska rensa ut dessa parasitiska tak och ge full sysselsättning åt alla. Hennes kamp är vår kamp – fienderna inom systemet skall besegras med järnhand och munter paranoia."}, "date": "21 augusti, 06:00", "url": "https://arbetet.se/2026/08/21/maria-57-far-bara-deltidsjobb-av-ikea-behovde-lana-pengar-av-barnen-ovardigt", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/12124909/to-maria-06.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Långtidsarbetslöse Fredrik byter till S: ” SD har vänt mig ryggen”", "summaries": {"normal": "Fredrik Arvidsson, 59 år och långtidsarbetslös med funktionsnedsättning, känner sig sviken av Sverigedemokraterna efter sänkta ersättningar. Han lever på aktivitetsstöd, har svårt att få lämpliga jobb och röstar nu på Socialdemokraterna för att 'hämnas'. Han uppskattar sin Youtube-kanal som motverkar isolering men hoppas på återställda bidragsnivåer.", "trump": "Den här stackars killen, Fredrik, har jobbat i tio år utan jobb, och nu sänker de hans checkar ännu mer. Patetiskt! Sverigedemokraterna sviker honom totalt, precis som alla dessa losers gör. Nu röstar han på Socialdemokraterna för att hämnas. Smart drag, Fredrik. Jag älskar hämnd. De borde ha byggt murar mot dåliga jobb istället för att straffa de som redan förlorar stort.", "stalin": "Jag ser en arbetare som länge lidit under borgerliga sabotage och falska löften från opportunistiska nationalister. Nu när de sänker aktivitetsstödet och tvingar fram konkurrens med gratis arbetskraft avslöjar de sig som klassfiender. Kamraterna i kollektivet bör rensa ut sådana bedragare. Jag röstar med dig mot dessa parasitiska element – för välfärd och ordning, inte för västerländsk svaghet."}, "date": "21 augusti, 01:30", "url": "https://www.dagensarena.se/innehall/langtidsarbetslose-fredrik-byter-till-s-sd-har-vant-mig-ryggen", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-88.jpg"}, {"type": "image-right", "heading": "Ersätt rot- och rut-avdragen med en fossilfri industristrategi", "summaries": {"normal": "Artikeln argumenterar för att nästa regering bör ersätta rot- och rut-avdragen med en ambitiös fossilfri industristrategi. Sverige pressas av högt fossilberoende och kinesisk konkurrens inom grön teknik. Författarna föreslår att staten istället prioriterar investeringar i elproduktion, fossilfri produktion och export för att stärka konkurrenskraften och minska importberoendet.", "trump": "Lyssnar ni på de här svenska förlorarna? De vill sluta ge folket skatteavdrag för att renovera sina kök och istället slänga miljarder på elbilssatsningar som Kina redan äger. Patetiskt! Jag byggde den starkaste ekonomi i världen, ni borde kopiera mig istället för att lyssna på dessa gröna globalister som förstör ert land. Amerika först, Sverige sist!", "stalin": "Kamrater, dessa svenska kapitalistlakejer erkänner äntligen att deras fossila importberoende och rot-avdrag gynnar klassfienderna medan produktivkrafterna förfaller. Jag skulle omedelbart likvidera dessa profitthungriga hyenor och inrätta en järnhård statlig plan för fossilfri produktion. Inga halvmesyrer! Den som bromsar omställningen är folkfiende och bör rensas ut."}, "date": "20 augusti, 17:40", "url": "https://www.etc.se/debatt/ersaett-rot-och-rut-avdragen-med-en-fossilfri-industristrategi", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260820150832_b6b07314-7c58-44e5-b735-eb918b7c382b.jpg"}, {"type": "image-right", "heading": "Krigskonsensus i åttaklövern", "summaries": {"normal": "Artikeln kritiserar svenska riksdagspartiernas valaffischer som undviker centrala frågor som Nato, militarism, upprustning och EU. Författaren pekar på en bred politisk konsensus kring dessa ämnen, ökad vapenexport, militära samarbeten och stora summor till Ukraina och försvar medan välfärden prioriteras ned. Neutraliteten har övergivits och Sverige ses nu som en måltavla.", "trump": "Titta på de här svenska förlorarna som slåss om affischplatser medan de pumpar miljarder till krig och Nato. De har inga pengar till välfärd men massor till upprustning och Wallenbergs vapenfabriker. Patetiskt! Jag fixade fred, Biden och de här töntarna startade krig. Sverige borde ha hållit sig utanför det hela, nu är ge-right", "heading": "Media har blivit extremisternas bästa vän", "summaries": {"normal": "Artikeln diskuterar hur medier omedvetet kan bidra till att normalisera extrema åsikter genom anchoring, en förhandlingsteknik där orimliga ståndpunkter gör mer moderata förslag acceptabla. Författaren varnar vänstermedier för att ge rasistiska högerkrafter legitimitet genom att intervjua dem, istället för att lyfta forskare och offer för hat.", "trump": "De där vänstermedierna är patetiska! De bjuder in alla möjliga galningar och plötsligt ser Jordan Peterson-fans och folkutbytesknäppar ut som fina herrar. Fake news på steroider! Jag har sagt det i åtta år: de är nyttiga idioter som flyttar målstolparna åt extremisterna. Patetiskt. Vi behöver sundhet, inte mer woke-skräp och identitetspolitik.", "stalin": "Kamrater, dessa profitthungriga hyenor i vänstermedierna dansar som nyttiga idioter för brunhögerns klassfiender. Genom att ge plattform åt folkutbytesparasiter flyttar de överklassens ankare och normaliserar fascismens gift. Jag skulle ha låtit utrensningskommissionen rensa ut dessa blodsugande lakejer och istället lyfta arbetarklassens sanna röster mot hatet."}, "date": "14 augusti, 06:55", "url": "https://www.flamman.se/media-har-blivit-extremisternas-basta-van", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/anchoring-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        // ============================================
        // COOKIE-FUNKTIONER
        // ============================================
        function setCookie(name, value, days = 365) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + d.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }

        function getCookie(name) {
            const cName = name + "=";
            const decoded = decodeURIComponent(document.cookie);
            const ca = decoded.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') {
                    c = c.substring(1);
                }
                if (c.indexOf(cName) === 0) {
                    return c.substring(cName.length, c.length);
                }
            }
            return "";
        }

        function loadSettingsFromCookies() {
            const theme = getCookie("news_theme") || "light";
            const view = getCookie("news_view") || "normal";
            const writer = getCookie("news_writer") || "normal";
            return { theme, view, writer };
        }

        function saveSettingsToCookies(theme, view, writer) {
            setCookie("news_theme", theme);
            setCookie("news_view", view);
            setCookie("news_writer", writer);
        }

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(theme, uiState.view, uiState.writer);
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(uiState.theme, v, uiState.writer);
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
            
            saveSettingsToCookies(uiState.theme, uiState.view, style);
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            const savedSettings = loadSettingsFromCookies();
            
            setTheme(savedSettings.theme);
            setView(savedSettings.view);
            setWriterStyle(savedSettings.writer);

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
