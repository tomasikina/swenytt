pen Richard Jomshof kallat honom 'quisling'. Lindberg menar att SD hatar tidningens ledarsida eftersom den motverkar deras agenda. Han kritiserar även Kristersson, Busch och Mohamsson för att inte tydligt ta avstånd från Jomshofs uttalanden och varnar för farlig retorik mot journalister.", "trump": "Kan ni tro det här? Anders Lindberg, en så kallad chefredaktör, klagar över att SD-toppen kallat honom 'quisling'. Oj då! Men jag säger er, folk är trötta på fake news och hatiska medier. SD vet vad de gör, de står upp mot korrupt media. Och varför tar inte ledarna avstånd? Svagt, mycket svagt. Sverige borde lära sig av USA – vi tar inte skit från någon!", "stalin": "Vi har observerat ytterligare ett försök från borgerliga lakejer att underminera folkets vilja. Denna Lindberg, en ynklig propagandist, klagar över att våra kamrater i SD avslöjat hans landsförrädiska verksamhet. Hans jämmer är ett tecken på att den revolutionära elden brinner starkt. Vi noterar också att de svaga liberala ledarna inte vågar fördöma sanningens röst. Deras tystnad är ett erkännande av nederlag."}, "date": "9 augusti, 10:43", "url": "https://kvartal.se/nyheter/artiklar/lindberg-sd-hatar-var-ledarsida/cG9zdDoxNjExMDg", "imageUrl": "https://images.kvartal.se/2026/08/518e5879-lindberg.webp"}, {"type": "image-right", "heading": "Ryska partiet kräver stopp på kriget – kan strykas från dumavalet", "summaries": {"normal": "Jabloko, Rysslands enda antikrigsparti, riskerar att stoppas från dumavalet i september. Partiet kräver eldupphör i Ukraina och har länge kritiserat Kremls politik. Motståndaren Rodina har begärt att Högsta domstolen ska stryka Jablokos kandidatlista. Partiledaren Nikolaj Rybakov talar om fred, personligt ansvar och varnar för kärnvapenkrig.", "trump": "De där ryska valen är riggade från början, folk. Det enda partiet som vill ha fred blir utkastat av domstolen – typiskt! Rybakov verkar okej, han fattar att det här leder till kärnvapenhelvete. De andra är aggressiva idioter som styr mot katastrof. Ryssland behöver smarta dealmakers, inte krigshejarna som förstör allt.", "stalin": "Kamrater, denna Jabloko-skvallerklick med sin falska fredsretorik utgör ett farligt hinder för den ryska statens legitima försvarsåtgärder mot ukrainska fascister och västliga kapitalistiska lakejer. Vi ser hur borgarbrackorna försöker underminera vår starke efterträdare Putins nödvändiga expansion. Högsta domstolen bör rensa ut dessa defaitister med den sedvanliga effektivitet som alltid gläder mig."}, "date": "10 augusti, 07:51", "url": "https://www.svt.se/nyheter/utrikes/rysslands-enda-antikrigsparti-kan-stoppas-fran-dumavalet", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/1612f37292988eceef143e116eb2b0fa9a6a37ab1e6cc6ebc0380f8d5ceb9253"}, {"type": "text", "heading": "Här är böckerna att ha koll på hösten 2026", "summaries": {"normal": "I en artikel om höstens böcker 2026 noteras att boken blivit en accessoar och fokus ligger på författarsamtal. Läsglasögon ses som sexiga. Trots litteraturdebatten ser recensenten fram emot flera romaner som behandlar samtida ämnen som influerare, sociala medier och apokalyps. Läskrisen beror inte på brist på böcker, varken nya eller gamla.", "trump": "Folk, ni skulle se de här böckerna i höst – fantastiska, verkligen de bästa. Boken är nu en accessoar, läskrisen är löst tack vare sexiga läsglasögon, och alla pratar om influerare och apokalyps. Jag älskar det. De säger att det inte är brist på böcker, och de har helt rätt. En enorm succé för litteraturen, tro mig.", "stalin": "Kamrater, jag betraktar med högsta tillfredsställelse hur den dekadenta borgarklassens läskris nu löses genom erotiserade läsglasögon och en flod av romaner om influerare och apokalyps. Vi ser hur kapitalisternas självupptagna samtidslitteratur omedvetet blottar deras egen undergång. En utmärkt utrensning av trivialitet – låt läsarna uppsluka den."}, "date": "10 augusti, 07:38", "url": "https://www.svt.se/kultur/bokhosten-2026-sex-undergang-och-influencers-eccvgc"}, {"type": "image-full", "heading": "Allt om Fröken Snusk-bråket – och vändningen", "summaries": {"normal": "Fröken Snusk avbokades från Karl-Oskarsdagarna efter att hon skulle spela med Jimmie Åkessons dansband. Men nu får hon uppträda ändå – på en mindre scen hos krögaren My Huynh på Taco Bar. Politiker har kritiserat avbokningen, men festivalen ville värna sitt oberoende.", "trump": "Hörni, det här är helt sjukt! En artist blir avbokad för att hon spelar med en politiker? Det är som att säga att jag inte får ha en hamburgare för att jag gillar Trump. Väldigt dåligt, mycket dåligt. Men hon fick spela ändå – bra! Jag gillar vinnare, inte avbokare.", "stalin": "Kamrater, vi ser en smutsig provokation! En artist avbokas för politiska sympatier – men vi vet att sann konst tjänar partiet. Att hon nu spelar på en mindre scen är korrekt omstrukturering. Kulturen ska renas från borgerlig oreda. Allt enligt plan. Vidare!"}, "date": "10 augusti, 06:20", "url": "https://www.gp.se/nyheter/sverige/detta-har-hant-i-froken-snusk-braket.f2990c1a-a5b2-45f0-bc0c-dc7c7f02c3c2", "imageUrl": "https://www.gp.se/images/article/f2990c1a-a5b2-45f0-bc0c-dc7c7f02c3c2/images/4dkwMBfX1aL3n6S1M0mGKJNc2PBw-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Göteborgs stad måste skydda anställda mot näthat", "summaries": {"normal": "Göteborgs stad kritiseras av facket för att inte skydda anställda som utsätts för näthat och hot i det antirasistiska arbetet. Cheferna kallar det en kommunikationsfråga, men facket kräver handling – och en plan mot rasism som inte bara är snygg på papper.", "trump": "Hörni, Göteborg har anställda som blir hatade för att de jobbar mot rasism. Otroligt! Staden måste vakna – jag skulle aldrig låta mina folk hängas ut. Sedan blir det eld och bråda dagar för näthatarna. Klaga inte – gör det bästa dealen!", "stalin": "Kamrater! Göteborgs arbetare kräver skydd mot kontrarevolutionära nättroll. Arbetsgivarens tystnad är ett sabotage! Vi rensar ut fegheten – inga planer utan handling. En kollektiv utrensning av hatare och deras beskyddare krävs. Arbeta för partiet eller se dig om efter en ny karriär."}, "date": "10 augusti, 06:11", "url": "https://www.gp.se/debatt/goteborgs-stad-maste-skydda-anstallda-mot-nathat.18e71c88-3075-4763-910a-da2209861ee0", "imageUrl": "https://www.gp.se/images/article/18e71c88-3075-4763-910a-da2209861ee0/images/2bqhcp7lNk_1_iyPw771RqNMwHkU-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "S lovar extra barnbidrag inför jul- och sommarlov", "summaries": {"normal": "Socialdemokraterna lovar att dubbla barn- och studiebidraget inför jul- och sommarlov, vilket ger en tvåbarnsfamilj 5 000 kronor extra per år. Partiet motiverar löftet med ökade utgifter under loven då barnen inte får skolmat. Vallöftet kostar cirka sex miljarder kronor årligen.", "trump": "Titta på de här socialisterna som plötsligt älskar barn – precis innan valet! De vill kasta ut sex miljarder av era skattepengar som julklapp. Patetiskt. Jag fixade bättre ekonomi för familjerna utan att köpa röster med bidragsbluffar. Magdalena och hennes förlorarlag borde skämmas.", "stalin": "Kamrater, jag ser borgarbrackornas regering svika arbetarnas barn medan klassfienden höjer hyror och matpriser. Vi ska permanent dubbla bidragen och likvidera den kapitalistiska likgiltigheten. Inga barn ska svälta under loven – utom de som tillhör folkfienderna naturligtvis. Det blir en renande utrensning av nedskärningarna."}, "date": "9 augusti, 18:49", "url": "https://www.tv4.se/artikel/tt-260809-anderssontal1-6919c373/s-lovar-extra-barnbidrag-infor-jul-och-sommarlov", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlhzQv6DSzCXQ%2F0e8e4b2f1bd66aff22a9ecd6a582f054%2FSocialdemokraternas_ekonomiska_talesperson_Mikael_Damberg__S__och_Socialdemokraternas_partiledare_Magdalena_Andersson__S__halle.&width=120"}, {"type": "image-right", "heading": "Dödlig natt på båda sidor i Ukrainakriget", "summaries": {"normal": "Ryska attacker dödade två personer och skadade ett tjugotal i Ukraina under natten till söndagen. Samtidigt dödade en ukrainsk drönarattack tre personer i ryska Belgorod. Fyra år efter invasionen ökar långdistansattacker på båda sidor, vilket leder till fler civila offer. Bostadshus, elnät och infrastruktur skadades i Charkiv, Odessa och Pavlohrad.", "trump": "Vilken röra! De där galningarna i Ukraina och Ryssland håller på och spränger allt i luften igen. Jag hade fixat det på en vecka, men efter Sleepy Joe blev allt kaos. Nu dör civila på båda sidor medan de leker krig med drönare. Patetiskt! Vi behöver smarta ledare, inte dessa förlorare som slösar bort folk och pengar.", "stalin": "Kamrater, jag ser hur de fientliga hinder som de ukrainska fascistiska resterna sätter upp mot vår ryska intressesfär bara ökar de civila förlusterna. Borgarbrackorna i väst skrattar medan blod flyter. Vi ska rensa ut dessa folkfiender och deras drönarhot en gång för alla. Den starka handen segrar alltid mot klassfiendens svaga gnäll."}, "date": "9 augusti, 13:55", "url": "https://www.tv4.se/artikel/tt-260809-rysslanddronarattack1-f5da4940/dodlig-natt-pa-bada-sidor-i-ukrainakriget", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlIuHrz27se8M%2F997069a45ba14ded88ff72fd21dc8994%2FUkrainska_brandman_forsoker_slacka_elden_i_byggnader_efter_en_rysk_robotattack_i_Odessa_natten_till_sondagen._&width=120"}, {"type": "image-full", "heading": "Carl Eos: SD-regeringen vinner kriget mot kriminaliteten", "summaries": {"normal": "Enligt artikeln har brottsligheten mot egendom minskat kraftigt under den nuvarande regeringen. Inbrott har sjunkit med 36 procent, båtstölder med 47 procent och fordonsstölder med 64 procent. Polisen använder utlänningslagstiftningen offensivt med hundratals avvisningar, vilket enligt texten avskräcker internationella stöldligor. SD har drivit på den hårdare linjen som gett resultat.", "trump": "Titta på det här, Sverige gör det fantastiskt. Vi har krossat ligorna, inbrotten rasar med 36 procent, båt- och bilstölder har störtdykt. De kriminella varnar varandra: glöm Sverige, snutarna jobbar som djävlar! Det är vad som händer när ni röstar rätt och använder tuffa lagar. En enorm seger för folket, de onda förlorar stort.", "stalin": "Kamrater, se hur jag med järnhand har krossat de parasitiska stöldligorna som sög på folkets egendom. Med offensiv utlänningslagstiftning och över 640 likviderade hot har vi rensat ut de västerländska agenterna. Brotten faller dramatiskt. De fientliga elementen varnar varandra för att närma sig vårt säkra fosterland. Paranoian är berättigad, segern tillhör partiet."}, "date": "9 augusti, 17:35", "url": "https://riks.se/opinion/carl-eos-sd-regeringen-vinner-kriget-mot-kriminaliteten", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Copy_of_Copy_of_Soerman_Ledare_34_051e7989d0.jpg"}, {"type": "image-right", "heading": "Färre drunkningsolyckor i juli – antalet omkomna mer än halverat", "summaries": {"normal": "Antalet drunkningsolyckor har halverats i år jämfört med samma period 2025, enligt Svenska Livräddningssällskapet. Totalt har 37 personer omkommit hittills i år mot 71 förra året. Framför allt män och äldre drabbas, ofta vid ensambad. Räddningsdykare rycker ut över 100 gånger per år och har max 90 sekunder på sig att ge sig iväg efter larm.", "trump": "Det är fantastiskt, folk drunknar hälften så mycket som förra året, en enorm succé. De säger det är varmt väder men jag tror det är mina råd som funkar – bada tillsammans, smarta människor gör det. Räddningsdykarna är hjältar, de bästa, supersnabba med sina 90 sekunder. Sverige borde tacka mig, ingen gör det bättre än mig.", "stalin": "Kamrater, vi har likviderat hälften av de drunknade olyckorna i år genom kollektiv vaksamhet mot ensambadande element. Varje död är en tragedi för folket, men statistiken visar att vi segrar över de västerländska badborgarnas anarki. Räddningsdykarna, beväpnade med 30 kilos utrustning, rusar ut på 90 sekunder mot de kapitalistiska sekunderna som vill dränka proletariatet. Paranoia räddar liv."}, "date": "10 augusti, 06:00", "url": "https://www.svt.se/nyheter/inrikes/farre-drunkningsolyckor-raddningsdykarnas-kamp-mot-sekunderna", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.63/0.56/fbb2bde12b794b8016fcbb1483d67a73ca588cd842b4a94c3fc6f9d2d9fe7ec1"}, {"type": "image-right", "heading": "Förgiftade sin man med chilisås – blev av med jobbet på Google", "summaries": {"normal": "En kvinna dömdes till 12 års fängelse för mordförsök på sin man genom att förgifta honom med enorma mängder kalcium och D-vitamin, bland annat i chilisås. Hon blev omedelbart uppsagd från sitt jobb på Google. Kvinnan har överklagat domen och stämmer nu Google med stöd av Unionen för felaktig uppsägning eftersom domen inte är slutgiltig.", "trump": "Folk, det här är otroligt. En galning på Google förgiftade sin egen man med chilisås och massor av kalcium – totalt vansinne! Hon fick sparken, som hon borde, men nu stämmer hon dem. Patetiskt! Google borde ha sparkat henne mycket tidigare. Sådana människor hör inte hemma i stora bolag, tro mig. En total katastrof.", "stalin": "Kamrater, jag har sett borgarbrackornas giftblandares verk. Denna kapitalistiska förrädare, maskerad som lojal arbetare, försökte likvidera sin make med reaktionära kalciumdoser och D-vitamin – en fiende till folket i chilisåsförpackning! Google agerade korrekt men nu försöker hon med sina advokatlakejer sabotera. Vi ska rensa ut alla sådana parasitiska giftblanderskor ur samhällskroppen."}, "date": "9 augusti, 06:00", "url": "https://arbetet.se/2026/08/09/forgiftade-sin-man-med-chilisas-blev-av-med-jobbet-pa-google", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/07111727/sdljf5kotjh9xg-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "S-politikerns attack mot SD:s ungdomsförbund: \"Israels kuksugare\"", "summaries": {"normal": "En socialdemokratisk kommunpolitiker i Smedjebacken, Acke Ahmed Ahunzada, har kallat SD:s ungdomsförbund för \"jävla SD rasisterna Israels kuksugare\" på Facebook. Han är ersättare i en kommunal nämnd och står på plats 15 på S-listan till kommunvalet. Partiet har inte kommenterat uttalandet.", "trump": "Folk, ni skulle se det här. En galen S-politiker i Sverige attackerar SD:s ungdomar och kallar dem Israels kuksugare. Totalt sjukt! Socialdemokraterna är en skam, precis som vänsterns radikaler här hemma. De hatar Israel och älskar terrorister. Patetiskt, men typiskt för förlorarna på vänsterkanten.", "stalin": "Dessa dekadenta socialdemokratiska element avslöjar sin sanna natur genom att slå mot de unga patrioter som vågar kritisera terrorister. Jag ser en nödvändig utrensning bland sådana opportunistiska borgarbrackor som smyger sig in i partiet. Kamraterna måste rensa ut dessa fiender till folkets enhet innan de förgiftar hela kollektivet med sin paranoia och sina könsord."}, "date": "9 augusti, 12:43", "url": "https://riks.se/nyheter/s-politikerns-attack-mot-sd-s-ungdomsforbund-israels-kuksugare", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Copy_of_Copy_of_Soerman_Ledare_33_94fa4103aa.jpg"}, {"type": "image-right", "heading": "Bönder slår larm: ”Aldrig sett något liknande”", "summaries": {"normal": "Extremvärme och torka drabbade Europas bönder i sommar. Rekordtemperaturer, skogsbränder och låga vattennivåer i Donau har lett till uttorkade betesmarker och sämre skördar. Franska mjölkbönder tvingas utfodra kor med vinterfoder redan nu, olivproduktionen minskar och priset på olivolja väntas stiga. Tusentals ton grönsaker har gått förlorade.", "trump": "Europa brinner upp i värmen, folk! Bönderna gråter över sina torra fält och döda grödor. Donau är en damm, tiotusentals har flytt bränder och tyskar dör som flugor. De borde ha lyssnat på mig – jag varnade för dåliga dealar med naturen. Nu stiger matpriserna. Patetiskt, men vänta bara tills jag fixar det igen.", "stalin": "Kamrater, denna värmens sabotage mot kollektivens skördar är en kapitalistisk konspiration från västliga klimatförnekare. Jag ser hur borgarbrackorna i Bryssel låter korna svälta medan ostproduktionen kollapsar. Vi ska rensa ut dessa fiender till planerad produktion. Historien ler mörkt åt deras svaga, uttorkade imperier."}, "date": "10 augusti, 04:36", "url": "https://www.svt.se/nyheter/utrikes/extremvarme-och-torka-drabbar-europas-bonder-exceptionellt", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.32/0.35/92ab6d3790b5861c7061d87493b87eb54c6ed27a8ce47bc78c4dc277b05dfdf6"}, {"type": "image-right", "heading": "Ung Vänsters skattepolitik är verklighetsfrånvänd", "summaries": {"normal": "I en debattartikel kritiserar SSU Ung Vänsters skattepolitik som orealistisk. Författaren argumenterar att en förmögenhetsskatt inte kan finansiera vänsterns reformer eftersom rika personer och företag riskerar att flytta utomlands, som exemplet med IKEA och Ingvar Kamprad visar. Socialdemokraterna prioriterar välfärd och jobb framför att enbart minska antalet miljardärer.", "trump": "Folk, ni måste se det här! Den här socialistiska Ung Vänstern är en total katastrof, en riktig röra. De vill ta allt från de smarta vinnarna och ge till förlorarna, precis som Sleepy Joe gjorde. De fattar inte att när du straffar de rika flyttar de och tar med sig jobben. Amerika har sett det förut – det är en scam! Vi behöver starka ledare, inte dessa misslyckade drömmare som hatar framgång.", "stalin": "Kamrater, denna ynkliga borgarbracka från SSU försöker med sina dimridåer skydda de exploaterande blodsugarna och deras absurda nyliberala system. Jag, som byggt en järnhård stat, ler mörkt åt deras paranoia inför utrensning av folkfienderna. Deras rädsla för att de få kapitalistiska parasiterna ska fly visar bara klassfiendens svaghet. Vi ska likvidera sådana illusioner och expandera den sanna välfärden för arbetarna."}, "date": "9 augusti, 06:00", "url": "https://www.etc.se/debatt/ung-vaensters-skattepolitik-aer-verklighetsfraanvaend", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260807080832_3542033c-21b0-471c-8064-f09f6a29ae54.jpg"}, {"type": "text", "heading": "Sandström: Därför kan Volkswagen bli ett nytt Kodak", "summaries": {"normal": "Volkswagen sänker prognosen för 2026 efter att nettoresultatet sjönk 33% i Q2. Bolaget har förlorat mark och anställda de senaste åren. Krönikören jämför detta med Kodaks fall, där båda misslyckades med att behålla kontrollen över värdekedjan. Kinas dominans i elbilsindustrin och politiskt drivet skifte hotar nu VW:s lönsamhet.", "trump": "Jag har sagt det i åratal: VW är ett totalt misslyckande! De investerar i elbilar men Kina slår dem hårt – det är en skam! Europa försöker spela klimathelten men förlorar jobb och pengar. Kodak gjorde samma fel, och nu är VW på väg att försvinna. Vi skulle ha gjort det bättre, mycket bättre!", "stalin": "Volkswagen, en imperialistisk bilmonopol, känner nu den röda strykjärnets hetta! Deras fall speglar Kodak – en feg korporation som tros sina ägor. Kina, vår fasthetssamma allierade, har erövrat hela värdekedjan! Europa leker med självskadebeteenden, medan den sovjetiska planekonomins ande segrar. Deras moraliska högtidssköna är bara en dimridå för svaghet."}, "date": "8 augusti, 06:00", "url": "https://www.affarsvarlden.se/kronika/sandstrom-darfor-kan-volkswagen-bli-ett-nytt-kodak"}, {"type": "image-right", "heading": "Köpte stulen halvö av kokaingangster", "summaries": {"normal": "Jared Kushners planerade lyxprojekt i Albanien har hamnat i en skandal gällande misstänkt markstöld och kopplingar till grov brottslighet. Markköpet från en nu efterlyst misstänkt narkotikahandlare har väckt starka lokala protester. Medan Kushner själv inte är misstänkt för brott, har projektet lett till upplopp och anklagelser om korruption och exploatering av lokalbefolkningen.", "trump": "Min svärson Jared gör fantastiska affärer, enorma saker i Albanien! Men de falska nyheterna hatar det. De pratar om 'skandaler' och 'narkotikahandlare' bara för att skada oss. Albanien är ett fantastiskt land, men folket där? Lite röriga. Vi skapar jobb, vi skapar lyx, vi bygger vackra resorter. Det är en succé, tro mig, en total succé!", "stalin": "Dessa korrupta parasiter som handlar med förfalskade dokument från Osmanska riket är ett hot mot statens ordning! En svag ledare tillåter att mark säljs till utländska spekulanter medan folket klagar. Vi ser hur västvärldens dekadenta kapitalism sipprar in i vår intressesfär, precis som Putin skyddar moder Ryssland, måste vi rensa ut dessa narkotikasmugglare. Arkebusering är det enda förnuftiga språket för kontrarevolutionärer."}, "date": "10 augusti, 07:55", "url": "https://www.aftonbladet.se/nyheter/a/d4rmnA/jared-kushner-kopte-albansk-halvo-av-artur-shehu", "imageUrl": "https://akamai.vgc.no/v2/images/998dc53d-79ae-3b67-acb6-634ee22bad1f?fit=crop&format=auto&w=1080&s=4fd8ffd4b6053d4aeda5eaac0516ab445efac121"}, {"type": "image-full", "heading": "Skjutning i Danmark –   tre personer skadade", "summaries": {"normal": "Tre män skadades i en skjutning i Holbæk, Danmark, på söndagen. Polisen grep två misstänkta och beslagtog en flyktbil. Händelsen tros vara gängrelaterad, och offrens skador är inte livshotande. Borgmästaren uttrycker ilska.", "trump": "Hörni, Danmark har problem! En skjutning i Holbæk – tre män skadade, men ingen död, tack och lov. Vi har de bästa poliserna, de grep två snabbt. Gängrelaterat, säger de. Jag skulle fixa det på en dag, tro mig. Stort!", "stalin": "Kamrater, en incident i Holbæk. Tre arbetare skadades av brottsliga element. Vi har redan gripit två. Detta är ett verktyg för utrensning av samhällets ohyra. Ordning och reda krävs, och den som inte fogar sig får skylla sig själv. Vi ser allvarligt på detta."}, "date": "10 augusti, 00:09", "url": "https://www.gp.se/nyheter/varlden/flera-skadade-i-skjutning-i-danmark.535fa63e-c441-4115-a6e2-45f16d02c698", "imageUrl": "https://www.gp.se/images/article/535fa63e-c441-4115-a6e2-45f16d02c698/images/3FHYexgDYeEDCKhwhKEs1o8rNYAU-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Slott i Libanon utsett till världsarv – skadat av Israel en vecka senare", "summaries": {"normal": "Den medeltida borgen Beaufort i södra Libanon upptogs på Unescos världsarvslista den 24 juli. Bara en vecka senare skadades den av israeliska sprängningar, enligt Libanons kulturdepartement. Området är ockuperat och avspärrat, vilket gör det svårt att bedöma skadornas omfattning. Slottet har tidigare skadats under konflikter och bombningar.", "trump": "Folk, ni tror inte vad som händer. Vi har precis fått ett fantastiskt slott i Libanon på världsarvslistan, och sen – BOOM! – bomber från Israel en vecka senare. Totalt kaos. Biden skulle ha stoppat det, men nej, nu är jag tillbaka och ska fixa Mellanöstern på riktigt. Patetiska terrorister och svaga ledare överallt. Sad!", "stalin": "Kamrater, jag ser med stor indignation hur de sionistiska imperialisterna och deras fascistiska bombplan likviderar ett historiskt monument bara dagar efter dess upptagande på den borgerliga Unescos lista. Detta är klassfiendens vedervärdiga sabotage mot folkets kulturarv. Vi ska rensa ut alla sådana folkförtryckartroll som vågar hota revolutionens minnen. Skrattretande patetiskt."}, "date": "7 augusti, 13:00", "url": "https://proletaren.se/artikel/slott-i-libanon-blev-varldsarv-skadat-av-israel-en-vecka-senare"}, {"type": "image-right", "heading": "Forskare varnar: Risk för rabiesutbrott bland sälar i spåren av El Niño", "summaries": {"normal": "Forskare varnar för ökad risk för rabiesutbrott bland sälar i Antarktis och kringliggande områden på grund av El Niño, som påverkar fiskbestånd och tvingar djuren att söka ny föda. Fenomenet hotar även Indiens monsun, kan orsaka extremväder, bränder och torka. El Niño väntas bli mycket kraftigt 2026.", "trump": "El Niño? Det här är en total katastrof, folk! Varmare vatten, galna sälar som biter allt i sikte och Indiens bönder som gråter över monsunen. Biden sov i fyra år medan världen brann. Nu fixar jag det – inga fler hajsomrar eller rabiesfest bland sälerna. Vi gör vädret stort igen!", "stalin": "Kamrater, detta El Niño är klassfiendens verk för att destabilisera de kollektiva fiskbestånden och sprida rabies bland sälarna. De exploaterande blodsugarna i väst skrattar medan sälarna vandrar som smittade desertörer. Vi ska rensa ut alla kapitalistiska väderavvikelser och likvidera hotet mot folkets hälsa med järnhand."}, "date": "8 augusti, 21:35", "url": "https://www.tv4.se/artikel/5TQCKSc09rWwfN51PjoyeI/forskare-varnar-risk-foer-rabiesutbrott-bland-saelar-i-sparen-av-el-nino", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5IEKDfBccDis2Ha3Rut8MU%2Fd2b745523ebb8e9b479ce7b5c09f503f%2F08-sal.jpg&width=120"}, {"type": "image-right", "heading": "För fred och socialism", "summaries": {"normal": "Artikeln argumenterar för att kapitalismen i Sverige lett till ökade klassklyftor, oligarkiskt inflytande och politiker som enbart genomför kapitalets vilja. Kommunistiska Partiet förkastar nedskärningar, privatiseringar och militarisering. De förespråkar istället socialism som enda väg till fred och rättvisa samt uppmanar till medlemskap i en kämpande organisation för arbetare.", "trump": "Folk, dessa kommunistiska förlorare gnäller om rika kapitalister och vill ha sin gamla sovjetdröm tillbaka. Sverige har blivit en total katastrof med svaga politiker som böjer sig för eliten. Patetiskt! Vi behöver styrka, inte mer socialism som aldrig funkar. Amerika först, alltid. De borde lära sig av mig istället för att drömma om sina misslyckade kollektiv.", "stalin": "Kamrater, denna text blottlägger klassfiendens giriga tentakler som förgiftar samhället med sina oligarkiska krav. Jag ser genom de falska folkvaldas masker som endast administrerar blodsugarnas vilja. Vi ska rensa ut dessa folkförtryckartroll och deras parasitiska system. Endast socialismen garanterar sann fred. Anslut er till kampen mot de exploaterande byfånarna innan de likviderar er själva."}, "date": "7 augusti, 08:00", "url": "https://proletaren.se/artikel/for-fred-och-socialism", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/04/povel-1-768x432.png"}, {"type": "image-full", "heading": "Migrant blottade sig 14 gånger – SVT utelämnar flera väsentliga uppgifter", "summaries": {"normal": "En 23-årig sudanesisk medborgare dömdes för 14 fall av sexuellt ofredande, grovt hemfridsbrott och narkotikabrott i Jönköping under april och maj. Han blottade sig upprepade gånger, onanerade offentligt, tog sig in i en bostad och hotade med kniv. SVT beskrev honom enbart som en man i 25-årsåldern och utelämnade hans bakgrund, tidigare domar och att utvisning inte yrkades.", "trump": "De fake news-medierna på SVT gömmer sanningen igen. En sudanesisk migrant blottar sig fjorton gånger, bryter sig in i hus med kniv och de kallar honom bara en ”man i 25-årsåldern”. Patetiskt. Ingen utvisning, ingen psykisk störning, bara mer kaos från den öppna-gränser-politik som förstör Sverige. Vi behöver tuffare lagar, folk – mycket tuffare!", "stalin": "Kamrater, denna degenererade sudanesiske element har genomfört fjorton kontrarevolutionära blottningar och ett borgerligt inbrott med kniv. Borgarpressen SVT döljer hans klassfiendeursprung och vägrar rensa ut honom ur folkets territorium. Inga psykiska störningar, säger de – utmärkt, då kan vi likvidera honom som fullt medveten parasit. Partiet ser allt. Ut med alla sådana fiender till arbetarklassen."}, "date": "9 augusti, 02:00", "url": "https://riks.se/nyheter/migrant-doms-for-blottning-svt-undanhaller", "imageUrl": "https://admin.riks.se/uploads/banner_blottare_svt_322b6b6191.png"}, {"type": "image-right", "heading": "Daily Wire utmanar Hollywood – släpper actionfilm om islamsk terror", "summaries": {"normal": "Daily Wire tar kampen mot Hollywood med actionfilmen 'Run Hide Fight: Infidels', där islamister tar över ett propalestinskt läger. Jonathan Majors spelar veteran som slår tillbaka. Konservativt underhållningssatsning med premiär 16 september – för den som vill ha action med budskap.", "trump": "Jag älskar det! Daily Wire gör en fantastisk film mot terroristerna. De tar över ett läger, men våra starka soldater som Jonathan Majors visar dem. Hollywood är fegt som vanligt, de vågar inte. Den här filmen är STOR! Se den – ni kommer inte bli besvikna, tro mig!", "stalin": "Kamrater, jag har granskat en film som visar kapitalistisk propaganda. De kallar terrorister för fiender, men vi vet att imperialismen är värre. Vi måste rensa ut alla borgerliga avvikelser i kulturen. Denna film kan användas som ett verktyg – men utrensning sker i rätt tid."}, "date": "10 augusti, 07:00", "url": "https://samnytt.se/daily-wire-utmanar-hollywood-slapper-actionfilm-om-islamsk-terror", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/07075132/run-hide-fight.jpg"}, {"type": "text", "heading": "I dag hade Posener blivit influerare", "summaries": {"normal": "Artikeln reflekterar över hur attityder till rikedom och moral har förändrats sedan 1990-talet. Författaren minns sin kemivikarie Joachim Posener, senare dömd i Trustorhärvan, och kontrasterar honom med moderna figurer som Alexander Ernstberger som efter fängelsevistelse fått medial uppmärksamhet. Idag ses rikedom inte bara som lyx utan som en politisk revansch mot woke-samhället, till skillnad från tidigare krav på social grace.", "trump": "Folk, det här är galet. Den där Posener-killen, en total loser från nittiotalet, lurade till sig pengar och åkte dit som en jävla idiot. Nu har vi smarta killar som Ernstberger som bygger imperier, köper de bästa villorna och flyger helikopter. De kämpar mot den woke-sjukan, mot de där halvköningarna som hatar framgång. Det är inte brott längre, det är motstånd mot systemet. Fantastiskt, verkligen ypperligt.", "stalin": "Kamrater, denna dekadenta borgarbracka Posener och hans likar avslöjar klassfiendens fega natur. De söp champagne medan arbetarna svalt, men saknade politisk skärpa och blev utskrattade som patetiska kapitalistmaffian. Dagens exploaterande byfånar däremot maskerar sig som rebeller mot den sojadrypande identitetsfaran. Vi ser igenom er fåniga teater. En sann utrensning av folkförtryckartrollen vore på sin plats. Skrattretande svaga."}, "date": "5 augusti, 10:11", "url": "https://www.flamman.se/i-dag-hade-posener-blivit-influerare"}, {"type": "image-right", "heading": "Fler män söker vård för brist på testosteron – forskning pekar på hormonstörande kemikalier", "summaries": {"normal": "Allt fler män söker vård för misstänkt testosteronbrist. Experter som Mikael Lehtihet vid Karolinska Institutet menar att verklig brist är ovanlig och ofta beror på viktuppgång eller diabetes. Forskning pekar samtidigt på att hormonstörande kemikalier som bisfenol A kan påverka mäns hormoner, fertilitet och sexuella funktion. EU har nyligen infört förbud med långa övergångstider.", "trump": "Alla dessa män som springer till doktorn för testosteron – det är en skam! Sociala medier har fel, men de riktiga bovarna är de giftiga kemikalierna från de korkade EU-byråkraterna. BPA, BPS, allt det där skräpet förstör männen. Vi behöver starka, energiska män, inte svaga offer för dessa vansinniga regler. Gör hormoner stora igen!", "stalin": "Kamrater, jag ser hur de dekadenta kemiska fienderna från västvärldens laboratorier underminerar arbetarklassens män genom att förgifta deras hormoner med sina bisfenol-vapen. Denna dolda utrensning av manlig kraft är en kontrarevolutionär handling av borgarbrackorna. Vi ska likvidera dessa giftiga element och återupprätta folkets stålsatta vitalitet med järnhand."}, "date": "9 augusti, 17:34", "url": "https://www.friatider.se/fler-man-soker-vard-brist-pa-testosteron-forskning-pekar-pa-hormonstorande-kemikalier", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/testosteron.jpg?itok=Zn9K6abT"}, {"type": "image-right", "heading": "Hoppas politikerna  tar sig tid för detta", "summaries": {"normal": "Manne af Klintberg levererar ett av årets mest politiska sommarprat i P1. Som 81-åring berättar han om sin väg från clown och mimteater till solidaritet och jämlikhet, influerad av sin döva dotter, almstriden och kärleken till Charlie Chaplin. Programmet blandar humor, vemod och arkivinspelningar till en vacker paus från dagens polarisering.", "trump": "Folkhemsclownen Manne af Klintberg försöker sig på politik i P1. Den gamle vänsterkillen pladdrar om solidaritet och barnslighet medan han hyllar sin clownkarriär och Charlie Chaplin. Typisk kulturvänster-propaganda från en 81-åring som längtar tillbaka till 70-talet. Patetiskt. Vi behöver inga fler clowner i politiken, tro mig, jag har sett tillräckligt med dem i Europa.", "stalin": "Jag betraktar med förakt hur denna borgarclown af Klintberg maskerar sin dekadenta individualism som politisk kamp. Hans så kallade solidaritet är en svag föreställning för folkets fiender. Lek och mimteater? Ett farligt avsteg från kollektivets disciplin. Vi skulle ha rensat ut sådana klassfiender redan på 30-talet. Ett patetiskt avsked från en utlevad narr."}, "date": "10 augusti, 07:00", "url": "https://www.expressen.se/nyheter/sommar-i-p1-manne-af-klintberg-star-for-arets-mest-politiska-sommarprat", "imageUrl": "https://static.bonniernews.se/ba/e6af2012-fbbc-4210-a4f1-258028947e92.jpeg?crop=2554%2C1432%2Cx0%2Cy51&width=640&quality=60"}, {"type": "image-right", "heading": "Uppgifter: Priset för kärleksaffären", "summaries": {"normal": "Enligt The Telegraph ska Fifa-presidenten Gianni Infantino haft en affär med en kollega under sin tid på Uefa. Organisationen betalade ut nästan två miljoner kronor i avgångsvederlag till kvinnan, vilket inkluderade utbildningskostnader. Uefa bekräftar betalningen men hävdar att den följde regelverket. Infantino nekar till anklagelserna, medan Uefa nu utreder hans förflutna i organisationen.", "trump": "Gianni Infantino, en total katastrof! Hörde att han gav miljoner av Uefas pengar till en kvinna han hade en affär med. Inte bra! De kallar det avgångsvederlag, jag kallar det en enorm skandal. Han är under utredning nu, och ärligt talat, jag är inte förvånad. Fifa behöver en vinnare, inte någon som slösar bort pengarna sådär. Sad!", "stalin": "Den korrupte byråkraten Infantino har avslöjats i sitt moraliska förfall. Han har låtit Uefas kassa dräneras för att täcka sina egna personliga synder. Det är ett klassiskt exempel på västerländsk dekadens! Liksom våra fiender i Nato sprider de osanningar, men folkets ögon ser allt. Vi föraktar denna svaghet; i vårt rike skulle sådana förrädare mot kollektivet för länge sedan ha försvunnit i mörkret."}, "date": "10 augusti, 06:40", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/6qV69O/uppgifter-betalade-tva-miljoner-till-infantinos-alskarinna", "imageUrl": "https://akamai.vgc.no/v2/images/9b00becb-80a1-3106-9e7b-127d772e834f?fit=crop&format=auto&w=1080&s=d06eef4df88f24c26903f7e51b43d1a200a7f090"}, {"type": "image-full", "heading": "Henrik Johnsson lämnar SR – klar för Radio Aftonbladet", "summaries": {"normal": "Efter nästan 30 år på Sveriges Radio byter Henrik Johnsson kanal till Radio Aftonbladet. Han ska leda helgprogram mellan 8 och 12 och ser fram emot att bygga upp en ny radiokanal. Johnsson har tidigare producerat 'Sommar i P1' och vikarierat i 'P4 Extra'. Radio Aftonbladet lanseras fullt den 17 augusti.", "trump": "Fantastiskt, helt enkelt fantastiskt! Henrik Johnsson, en riktig vinnare, lämnar den tråkiga, gamla Sveriges Radion – som ingen lyssnar på längre – för att gå till Radio Aftonbladet. Smart drag! Jag säger alltid: bygg nytt, gör det stort, gör det bättre. Och Aftonbladet? De vet hur man vinner. Sånt gillar jag!", "stalin": "En trogen medarbetare, Henrik Johnsson, har deserterat från den föråldrade radiostationen Sveriges Radio till den kapitalistiska propagandakanalen Radio Aftonbladet. Detta är ett typiskt exempel på bourgeoisins förrädiska lockelser. Vi kommer att följa denna dekadenta satsning med stort intresse – och om den misslyckas, vilket den säkert gör, kommer historien att döma den som ett fiasko för den västerländska liberalismen."}, "date": "5 augusti, 20:34", "url": "https://kvartal.se/nyheter/artiklar/henrik-johnsson-lamnar-sr-klar-for-radio-aftonbladet/cG9zdDoxNTg4OTI", "imageUrl": "https://images.kvartal.se/2026/08/fb2f8d9e-henrik-johnsson.webp"}, {"type": "image-full", "heading": "Ringde och beställde pizza – åtalas", "summaries": {"normal": "En kvinna i Västerbotten åtalas för att ha ringt till pizzerian där hon tidigare jobbade och beställt mat – trots ett kontaktförbud efter att hon dömts för misshandel och ofredande mot kollegorna. Hon nekar och menar att förbudet inte gäller pizzabeställningar.", "trump": "Hörni, det här är helt otroligt! En kvinna döms för att ha varit elak mot kollegor, får ett kontaktförbud, men ringer och beställer pizza! Och hon nekar! Det är som att bygga en mur och sen krypa under. Löjligt! Jag hade aldrig gjort så – jag beställer alltid hamburgare.", "stalin": "Kamrater, en kvinnlig kontrarevolutionär trotsar våra dekret och ringer en pizzeria för att beställa mat. Detta är en provokation! Hon måste lära sig att vi inte tolererar individuella initiativ. En utrensning av pizzabagare och lagöverträdare är nödvändig. Ordning måste råda i vår socialistiska stat!"}, "date": "10 augusti, 06:30", "url": "https://bulletin.nu/ringde-och-bestallde-pizza-atalas", "imageUrl": "https://cdn.bulletin.nu/articles/9294b170-99f4-4577-b2e3-d70c38079f33/preview.jpg?t=1786310597000"}, {"type": "text", "heading": "Datastölden skakar Liechtenstein – superrikas hemligheter på drift", "summaries": {"normal": "Liechtenstein har utsatts för ett omfattande dataintrång där uppgifter om 31 000 rättssubjekt stulits. Händelsen hotar landets rykte som säker finansplats och väcker oro bland superrika kunder. Trots att inga finansiella detaljer läckt, fruktar experter utpressningsrisker. Myndigheter utreder fallet, medan banker försäkrar att deras egna interna system är säkra och opåverkade av intrånget.", "trump": "Liechtenstein, ett land jag känner väl, har drabbats av ett totalt misslyckande! Hackare stal register över de superrika. Pinsamt! De har ingen aning om vem som gjorde det, total inkompetens. Jag bygger murar, digitala murar, de bästa murarna, och ingen tar sig igenom. De här människorna behöver en stark ledare. Väldigt osäkert, mycket dåligt för affärerna!", "stalin": "Ett svek mot statens ordning! Dessa löjliga kapitalister i Liechtenstein har låtit sina listor över utsugare stjälas av okända element. Vilken svaghet! När vi behövde information om klassfiender i den ryska intressesfären tog vi den genom utrensningar, inte genom att läcka den till mörka nätverk. Vi kommer att övervaka dessa 'förmögna' varelser noggrannare än vad de själva någonsin kunnat ana."}, "date": "9 augusti, 23:24", "url": "https://www.realtid.se/bors-finans/makro/datastolden-skakar-liechtenstein-superrikas-hemligheter-pa-drift"}, {"type": "image-full", "heading": "Ny skolregel från 1 augusti – då kan eleven stoppas från skolan", "summaries": {"normal": "Från 1 augusti 2026 får rektorer i grundskolan årskurs 7–9, specialskolan och gymnasiet neka elever tillträde till skolan i allvarliga fall där säkerheten hotas. Beslutet fattas av rektorn, gäller som längst resten av terminen och får överklagas. Eleven ska ändå få distansundervisning. Mobilförbud och nya skolregler införs samtidigt.", "trump": "Titta på det här, Sverige gör det rätta äntligen. Rektorer kan kasta ut de farliga eleverna som hotar alla andra. Ingen mer stök, hot eller våld i våra skolor. Det är fantastiskt, de borde ha gjort det för länge sedan. Skolan ska vara trygg, inte en arena för losers. Make School Great Again.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur de svenska borgarbrackorna äntligen inser att ordning kräver järnhand. Rektorn, som en trogen partifunktionär, skall kunna rensa ut de farliga elementen som hotar kollektivets säkerhet. Distansundervisning åt dem, medan vi vakar över arbetarnas och elevernas trygghet. Paranoian är deras bästa vän."}, "date": "9 augusti, 19:15", "url": "https://nyheter24.se/nyheter/inrikes/1503735-ny-skolregel-fran-1-augusti-da-kan-eleven-stoppas-fran-skolan", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/b41284d104b004a30200000000b004a302/2026/08/09/2383045/Nya-Regler-I-Skolan.png"}, {"type": "image-right", "heading": "Brittisk tidning: ”Den auktoritära liberalismen på frammarsch Ungern”", "summaries": {"normal": "Ungerns nya regering, ledd av Péter Magyar, genomför omfattande utrensningar av Orbáns gamla maktapparat. Grundlagsändringar förhindrar Orbán från att återvända som premiärminister och avsätter presidenten. EU kritiseras för dubbla måttstockar när den Brysselvänliga regeringen monterar ned oppositionen.", "trump": "Jag ser att Ungern äntligen tar i med hårdhandskarna! Orbán var en vinnare, men hans tid är över. Nu ändrar de grundlagen så han inte kan komma tillbaka – smart! Och EU gillar det för att den nya killen är deras docka. Dubbla måttstockar, precis som jag alltid sagt!", "stalin": "Vi har inlett Operation Purgatory i Ungern. Orbaniterna är utrensade. Grundlagsändringar hindrar den tidigare ledaren för livet – korrekt. Presidenten avsattes utan ceremonier. Partiets fiender ska krossas. Alla som motsätter sig vår väg är sabotörer. Kamraterna segrar."}, "date": "10 augusti, 06:00", "url": "https://samnytt.se/brittisk-tidning-den-auktoritara-liberalismen-pa-frammarsch-ungern", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/07093802/magyar-eu-ungern.jpg"}, {"type": "image-right", "heading": "Uefa ska ha betalat miljonbelopp till Infantinos ”älskarinna”", "summaries": {"normal": "Uefa ska enligt The Telegraph ha betalat miljonbelopp till Fifa-presidenten Gianni Infantinos påstådda älskarinna under hans tid som generalsekreterare. Kvinnan, som arbetade inom Uefa, fick avgångsvederlag och stöd för vidareutbildning efter att relationen uppdagats. Infantino nekar uppgifterna. Uefa bekräftar utbetalningen men säger att den följde dåvarande regler. Skandalen väcker nya frågor om Infantinos ledarskap.", "trump": "Folk, det här är en total skandal! Den där Infantino, en riktig förlorare, använder Uefas pengar till sin älskarinna medan han är gift med fyra ungar. Patetiskt! Precis som de korrupta eliten i Europa. De borde skämmas. Jag skulle aldrig tolerera sånt i mitt Vita hus, tro mig. Nu vill han sälja VM också? En katastrof!", "stalin": "Kamrater, denna Infantino är en typisk borgarbracka som förskingrar arbetarnas medel till sin älskarinna i hemlighet. Jag skulle ha genomfört en omedelbar utrensning av hela den dekadenta ledningen. Inga klassfiender får berika sig på folkets organisationer. Vi ser återigen hur kapitalistmaffian förgiftar idrotten med sin girighet och lögner. Renhet måste återställas."}, "date": "8 augusti, 06:46", "url": "https://www.tv4.se/artikel/7tyx5vgQGjrOrInz6mHmur/uefa-ska-ha-betalat-miljonbelopp-till-infantinos-aelskarinna", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlJuoLU1iaB1A%2Fb90e3f4f301290f01b125d465548af91%2FFifas_president__Gianni_Infantino._Arkivbild.&width=1024"}, {"type": "image-full", "heading": "SVT om Leijnegard: ”Han har tagit sitt straff", "summaries": {"normal": "SVT försvarar beslutet att låta Micke Leijnegard leda ett nytt program trots tidigare dom för sexuellt ofredande. Programchef Christina Hill menar att 'saken är avgjord' och att Leijnegard 'har tagit sitt straff'. Hon beskriver honom som en uppskattad kollega och betonar att händelsen var en engångsföreteelse. Det nya programmet, *Mickes segelbåt*, följer hans arbete med att renovera en träsegelbåt inför Mälarbåts-SM. SVT avstår från generella regler för dömda tv-profiler och bedömer varje fall individuellt.", "trump": "Kan ni tro det här? SVT, ett av de mest vänsterliberala mediebolagen i Sverige, ger en dömd sexbrottsling en egen show! 'Han har tagit sitt straff', säger de. Jaha, som om det skulle fixa allt! Jag skulle aldrig tillåta sånt i mina kanaler – vi har standarder, vi har klass. Men nej, här får Micke 'Segelbåt' Leijnegard fortsätta som om ingenting hänt. Svagt, Sverige. Mycket svagt. Nästa sak de gör är att ge Hitler en dokumentär om trädgårdsskötsel!", "stalin": "Kamrater! Se hur den borgerliga medieapparaten i Sverige skyddar sina egna – en dömd förövare av kvinnors värdighet ges en plattform medan folket förblir ovetande om sanningen. 'Han har tagit sitt straff', säger de, som om brott mot kvinnor vore en bagatell att sopa under mattan! Vi i Sovjetunionen visste bättre – fiender till folket fick aldrig en andra chans. Och nu rustar denna Leijnegard en segelbåt? Ha! Låt honom segla rakt in i historiens soptunna, där han hör hemma. Nästa steg: ge honom en medalj för 'båtupprustning' och skicka honom till Sibirien!"}, "date": "5 augusti, 16:40", "url": "https://kvartal.se/nyheter/artiklar/svt-om-leijnegard-han-har-tagit-sitt-straff/cG9zdDoxNTg3Mzk", "imageUrl": "https://images.kvartal.se/2026/08/3ed0c2c2-leijnegard.webp"}, {"type": "image-full", "heading": "Varningen: Avgiften för husägare kan öka med 300 procent", "summaries": {"normal": "Att äga en fastighet kan bli betydligt dyrare i framtiden. En ny prognos visar att VA-taxan för vatten och avlopp kan bli upp till fyra gånger så hög år 2040. Bakgrunden är stora investeringsbehov i gamla ledningsnät, läckor och underhåll. Hushållen väntas betala genom höjda avgifter, enligt Svenskt Vatten. Investeringar på 37 miljarder kronor per år krävs.", "trump": "Folk, ni kommer inte tro det, men de svenska byråkraterna har totalt misslyckats med sina vattenrör. VA-taxan ska fyrdubblas till 2040? Det är en katastrof, en riktig skam! De läcker bort en fjärdedel av vattnet, precis som de läcker bort era pengar. Jag skulle ha fixat det billigare, snabbare och bättre. Ingen gör det som jag.", "stalin": "Kamrater, detta är borgarklassens logiska följd i det senkapitalistiska träsket. Jag ser redan hur de dekadenta kommunala elementen planerar att suga ut arbetarna med fyrdubblad VA-taxa. Det gamla ledningsnätet är en metafor för det ruttnande systemet självt. Vi ska naturligtvis rensa ut alla sabotörer och parasitiska läckor som gömmer sig i rören. Skrattretande, men nödvändigt."}, "date": "9 augusti, 18:45", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1503461-varningen-avgiften-for-husagare-kan-oka-med-300-procent", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/e5b9bba604b004a30200000000b004a302/2026/08/07/2382813/va-taxa-prognos-2040.jpg"}, {"type": "image-full", "heading": "Richard Herrey (KD) efter Jomshofs quisling-utspel: \"Höj nivån\"", "summaries": {"normal": "Richard Herrey (KD) uppmanar till en höjd debattnivå efter att Richard Jomshof (SD) kallat Aftonbladets Anders Lindberg för \"quisling\". Herrey kritiserar både Jomshofs provokationer och Lindbergs skadliga retorik genom åren. Han menar att folkvalda inte ska sänka sig till gyttjekastning utan istället kritisera sakligt. Även Tobias Andersson (SD) försvarar Jomshof och anklagar Socialdemokraterna för hyckleri.", "trump": "Folk sänker sig till den lägsta gyttjan, precis som jag alltid sagt. Den där Lindberg är en riktig gyttjekastare som attackerat journalister i åratal, och nu när någon säger emot honom blir det plötsligt kris. Jomshof har rätt att slå tillbaka. Socialdemokraterna utnyttjar allt för att tysta oppositionen. Höj nivån? Börja med att stoppa era egna lögner först, det vore ett ypperligt resultat.", "stalin": "Kamrater, denna gyttjepöl av dekadenta borgarbrackor och revisionistiska skribenter avslöjar sig själva. Jag har länge varnat för sådana quislingar som Lindberg, dessa kapitalistiska parasitmaskar som förgiftar den demokratiska debatten med sin lögnretorik. Jomshof må vara en opportunistisk provokatör, men vi måste rensa ut alla som drar oss ner i gyttjan. Ingen skonar fienden. Ut med dem alla."}, "date": "8 augusti, 13:32", "url": "https://riks.se/nyheter/richard-herrey-kd-om-quislingbraket-hoj-nivan-pa-debatten", "imageUrl": "https://admin.riks.se/uploads/IMG_2398_bc2c239b3c.jpg"}, {"type": "image-right", "heading": "M: Inga beslut om förlängda krisåtgärder", "summaries": {"normal": "Regeringen har ännu inga beslut om att förlänga de tillfälliga krisåtgärderna som sänkt matmoms och drivmedelsskatt. Trots varningar om höga el- och bränslepriser i vinter samt stigande matpriser på grund av El Niño, avvaktar statsminister Kristersson och finansminister Svantesson utvecklingen i Mellanöstern och prisbilden. Matmomsen är sänkt till år 2027.", "trump": "De där svenska socialisterna har ingen aning. Dyr mat, galna elpriser och bränsle som kostar en förmögenhet – och vad gör de? Ingenting! Jag skulle ha sänkt skatterna så mycket att det syntes från månen. Kriser i Mellanöstern? Det är deras fel alltihop. Jag fixade bättre priser, tro mig.", "stalin": "Inga beslut om att skydda arbetarna mot de giriga kapitalisternas prishöjningar. Borgarbrackorna i regeringen väntar medan folket svälter under väderfenomen och västvärldens krigshets. Jag skulle ha genomfört en omedelbar utrensning bland dessa tveksamma element och infört folkets prisreglering med järnhand. Paranoia? Nej, bara sund vaksamhet mot klassfienden."}, "date": "9 augusti, 17:17", "url": "https://www.di.se/nyheter/m-inga-beslut-om-forlangda-krisatgarder", "imageUrl": "https://static.bonniernews.se/ba/c1b37cc3-d3f4-4a99-956c-c76ad1328113.jpeg?crop=8256%2C4644%2Cx0%2Cy430&auto=webp&width=120&quality=70"}, {"type": "text", "heading": "Stockholmsbörsen backade svagt på torsdagen", "summaries": {"normal": "Stockholmsbörsen avslutade torsdagen nästan oförändrad, OMXS30-indexet ned 0,12 procent. Energisektorn steg med 2,8 procent medan fastigheter föll 0,5 procent. Bland enskilda aktier noterades Cybersäkerhetsbolaget Yubicos starka aktierörelse på 35,4 procent efter förbättrat resultat, medan gamingbolaget Paradox föll 7,6 procent efter svagare resultat.", "trump": "Jag såg Stockholmsbörsen - det är en skämt! Energi gör bra, fastigheter suger, precis som medierna. Yubico är en vinnare, enorm framgång, precis som mig. Paradox är ett misslyckande, de förlorar pengar. Jag skulle ha gjort börsen fantastisk igen, tro mig. Sverige behöver stark ledning!", "stalin": "I den store staten ser vi börsens utveckling som en spegel av klasskampen. Energi stiger - det förstärker vårt industriale järtecken. Fastigheter fallar - de är som de fegande burgarna. Yubico, en cyberfiende, försöker undergrava oss. Paradox, en spion, visar svaghet. Medicover säljer till KKR - en imperialistisk konspiration! Vi måste utvidga vårt inflytande, precis som våra ryska bröder under ledning av den store Stalin."}, "date": "6 augusti, 17:46", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-backade-svagt-pa-torsdagen"}, {"type": "image-full", "heading": "Skriver du på detta? Då kan du bli betalningsskyldig", "summaries": {"normal": "Att vara medlåntagare till ett bolån ger både fördelar och stora risker. Du får samma betalningsansvar som huvudlåntagaren och kan tvingas betala hela lånet om den andre inte klarar det. Banken kommunicerar främst med huvudlåntagaren, vilket kan leda till bristande insyn. Tänk därför noga innan du skriver under.", "trump": "Folk kommer till mig och frågar om att bli medlåntagare, det är en total katastrof. Du skriver under och plötsligt kan de kräva allt av dig, den bästa dealen någonsin för bankerna. Huvudlåntagaren betalar inte? Då kommer de efter dig, den smartaste killen i rummet. Läs det finstilta, annars blir du lurad stort. Vinna stort eller förlora stort, folksam.", "stalin": "Kamrater, jag betraktar medlåntagarskap som en listig fälla konstruerad av de giriga borgarbrackorna inom bankväsendet. Du undertecknar och blir omedelbart ansvarig inför folkfienden. Om huvudlåntagaren sviker, kommer de kräva dig istället. Endast genom ständig vaksamhet och utrensning av naiva element kan vi skydda det kollektiva ansvaret mot dessa parasitiska avtal. Ha ha, vilken mörk ironi."}, "date": "9 augusti, 17:28", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1503169-skriver-du-pa-detta-da-kan-du-bli-betalningsskyldig", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/be5938a504b004a30200000000b004a302/2026/08/06/2382543/medlanare.png"}, {"type": "image-full", "heading": "Lönerallyt slår mot ryska företag – tusentals stänger", "summaries": {"normal": "Rysslands ekonomi lider av en paradox: lönerna stiger på grund av krigsindustrins efterfrågan, men inflationen och räntorna äter upp köpkraften. Detta har lett till att tusentals civila företag tvingas stänga varje månad. Den ryska befolkningen upplever nu en betydande försämring av sin levnadsstandard, och många företag planerar nu personalneddragningar eller lönesänkningar för att överleva den pressade situationen.", "trump": "Rysslands ekonomi är ett totalt fiasko, tro mig! De pumpar in pengar i krig men folket har ingenting kvar. Tusentals företag går under varje månad, det är en katastrof! De försöker imitera min fantastiska ekonomi, men de har ingen aning om vad de gör. Inflation och höga räntor? Sad! Det är ingen vinnare, det är en förlorare.", "stalin": "Vi ser hur de svaga byråkraterna i Moskva låter ekonomin vittra sönder. Att tusentals småföretag försvinner är bara en utrensning av ineffektiva element som inte tjänar den ryska statens vilja. De klagar på levnadsstandarden, men glömmer att folkets enda syfte är att bära krigsmaskinens bördor. De som inte kan leverera till fronten är förrädare mot vår stora vision."}, "date": "9 augusti, 21:58", "url": "https://www.realtid.se/bors-finans/makro/lonerallyt-slar-mot-ryska-foretag-tusentals-stanger", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/foretagsstangningningar.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Tyfonen Dolphin drar vidare – översvämningar i Manila", "summaries": {"normal": "Tyfonen Dolphin har orsakat kraftiga översvämningar i Manila och västra Filippinerna där upp till midjan vatten nådde i Quezon City. Cirka 110 000 familjer har drabbats, minst sex personer har omkommit och 7 300 evakuerats. I Kina har över en miljon människor evakuerats efter att tyfonen nått landets östkust. Dolphin är årets hittills kraftigaste tyfon i Kina.", "trump": "De här idioterna kan inte ens hantera en liten tyfon utan att det blir översvämningar och kaos överallt. Filippinerna och Kina drunknar i regn, folk dör i jordskred och de evakuerar miljoner. Patetiskt! Under min ledning skulle vi ha byggt de bästa vallarna, de största pumpstationerna – ingen skulle drunkna, tro mig. Det är en katastrof, folk.", "stalin": "Kamrater, denna fientliga naturkraft utmanar folkets kollektiva disciplin. Jag har sett till att över en miljon kinesiska medborgare evakuerats och att borgarbrackornas turistattraktioner stängts. Västs marionetter i Filippinerna misslyckas med att skydda massorna medan vi i partiet rensar ut svaghet. Naturen är en trotsig kontrarevolutionär som måste kuvas med järnhand."}, "date": "9 augusti, 21:36", "url": "https://www.svt.se/nyheter/utrikes/tyfonen-dolphin-drar-vidare-oversvamningar-i-manila", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/e687471f6b821c2a4106b34dc62dc520e893080405a15674c22d26b6352f727a"}, {"type": "image-right", "heading": "Uppgifter: Taiwan föreslår kraftigt höjd försvarsbudget", "summaries": {"normal": "Taiwans regering planerar att höja försvarsbudgeten med 16 procent till cirka 324 miljarder kronor för 2027, vilket överstiger 3 procent av BNP. Bakgrunden är ökad kinesisk militär aktivitet kring ön, inklusive patrullering och övningar. Samtidigt växer Taiwans betydelse globalt genom halvledarjätten TSMC.", "trump": "De smarta taiwaneserna höjer nu sin försvarsbudget med 16 procent, över 300 miljarder kronor. De gör det de borde ha gjort för länge sedan mot Kinas fula trick och övningar. Bra deal för dem, men vi amerikaner tillverkar de bästa vapnen och de borde köpa mer av oss. Fantastiskt!", "stalin": "Jag ser hur de taiwanesiska revisionisterna rustar sig mot de kinesiska imperialisternas legitima anspråk. Vi, partiet och arbetarna, ler åt denna patetiska kapitalistiska panik. Deras halvledarborgare tror sig kunna gömma sig bakom siffror medan vi förbereder utrensning av alla fiender till folkets enhetliga framtid. Underbart."}, "date": "9 augusti, 16:44", "url": "https://www.di.se/nyheter/uppgifter-taiwan-foreslar-kraftigt-hojd-forsvarsbudget", "imageUrl": "https://static.bonniernews.se/ba/81b6a435-0ff5-4ce2-a9f9-13e741bb70ec.jpeg?crop=6000%2C3375%2Cx0%2Cy312&auto=webp&width=120&quality=70"}, {"type": "image-full", "heading": "Därför är årets barnfilmer ovanligt hoppfulla", "summaries": {"normal": "Årets barnfilmer hyllar kollektiv kamp mot klimathotet. Från klimataktivism i 'Operation Bäver' till naturens magi i 'Aida och värmeböljan'. Budskapet: tillsammans kan vi rädda planeten, med humor och gemenskap. En grön, hoppfull våg i barnkulturen.", "trump": "Jag ser de här barnfilmerna om klimatet – fantastiskt! De visar att vi måste arbeta tillsammans, precis som jag gör. Folk säger jag är den bästa presidenten någonsin. Djur har inga kungar? Jag är kungen av allt! Trumps Amerika vinner alltid.", "stalin": "Kamrater, dessa barnfilmer är korrekta. Kollektiv kamp är vägen. Men se upp för sabotörer som Mandalorian – en ensamvarg måste rensas ut. Naturen ska underordnas staten, inte dyrkas. Vi ska demonstrera, inte drömma. De som inte följer partiet blir utrensade."}, "date": "9 augusti, 17:14", "url": "https://www.gp.se/kultur/darfor-ar-arets-barnfilmer-sa-hoppfulla.4b5c16ae-7c85-4898-9cff-276a2cae6f6e", "imageUrl": "https://www.gp.se/images/article/4b5c16ae-7c85-4898-9cff-276a2cae6f6e/images/66fDpHsWgs5NblXVAJGlsdh9VkzI-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Greta Thunberg riskerar straff – då kan domen komma", "summaries": {"normal": "Greta Thunberg står åtalad i Danmark för husfridsbrott efter två protestaktioner i Köpenhamn, en vid universitetet 2024 och en mot Maersk 2025. Åklagaren yrkar på böter medan Thunberg nekar till brott och kräver frikännande. Rättegången som inleddes i juni fortsätter under hösten 2026 och domen väntas senare i år.", "trump": "Titta på den där Greta, en riktig förlorare som springer runt i Danmark och bryter sig in överallt. Hon borde tacka mig för att jag gjorde miljörörelsen till en global cirkus. Nu får hon böter av danskarna – och det är bara rättvist. Yttrandefrihet? Ge mig en paus, hon borde ha stannat hemma.", "stalin": "Dessa dekadenta borgarbrackor i Köpenhamn vågar kalla mitt kamratkollektivs metoder för husfridsbrott. Jag skulle ha låtit henne hänga upp banderoller över hela universitetet – strax innan utrensningen. Nu fortsätter rättegången som en fars. Västs marionetter ler mot henne medan de darrar inför verklig auktoritet. Underbart."}, "date": "9 augusti, 17:02", "url": "https://nyheter24.se/nyheter/1503623-greta-thunberg-riskerar-straff-da-kan-domen-komma", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/c05fdf6904b004a30200000000b004a302/2026/08/08/2382951/Greta-Thunberg.png"}, {"type": "image-right", "heading": "Israel nobbar Trumps Gaza-plan. Kommer inte dra tillbaka militär ”förrän Hamas verkligen har avväpnats”", "summaries": {"normal": "Israels premiärminister Benjamin Netanyahu avvisar ett Gazaplan som stöds av USA och hyllats av president Trump. Han vägrar dra tillbaka trupperna innan Hamas är fullständigt avväpnat. Hamas uppmanar USA att pressa Israel. Netanyahu medger att vissa amerikanska idéer är acceptabla medan andra inte är det, och lovar samtidigt att hindra Iran från att skaffa kärnvapen.", "trump": "De säger att jag älskar den här planen, och det gör jag verkligen, den är fantastisk. Men Netanyahu nobbar den helt, han vill inte backa ur Gaza förrän Hamas är krossat. Klokt. Hamas skriker efter att jag ska pressa honom, men Israel gör vad som är rätt. Iran får aldrig kärnvapen, det lovar jag – ingen gör det bättre än mig.", "stalin": "Jag betraktar detta som en nödvändig utrensning av de sionistiska obstruktörernas sabotage mot fredsprocessen. Reträtten får inte ske förrän fienden är fullständigt avväpnad, annars lurar de västerländska imperialisterna oss igen. Hamas ber om påtryckningar från den dekadenta borgarklassen i Washington. Underbart – låt dem slita varandra i stycken medan jag ler i skuggan."}, "date": "9 augusti, 16:29", "url": "https://www.di.se/nyheter/netanyahu-nobbar-gaza-retratt", "imageUrl": "https://static.bonniernews.se/ba/284fd9aa-9387-4ebc-a1e2-a932341d6ab0.jpg?crop=4490%2C2245%2Cx0%2Cy375&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Tusen tyska jurister vill förbjuda AFD", "summaries": {"normal": "Över 1 000 tyska jurister, däribland domare och åklagare, har undertecknat ett öppet brev som kräver att oppositionspartiet AfD förbjuds. De hänvisar till en rapport som anser att partiet strider mot grundlagen. Initiativet kommer från en vänsterorienterad juristförening och väcker kritik för att tjänstemän inom rättsväsendet blandar sig i politik. CDU är skeptiskt till ett förbud.", "trump": "Titta på det här, tusen galna tyska domare och vänsterextrema jurister vill förbjuda AfD, det enda parti som faktiskt kämpar för folket mot den vansinniga invandringen och Ukraina-stödet. De kallar det demokrati! Det är en häxjakt värre än någonsin. De borde skämmas, men vänstern har ingen skam. AfD kommer att vinna stort trots dem.", "stalin": "Vi ser med tillfredsställelse hur borgarjurister och dekadenta domare i den tyska apparaten avslöjar sin rädsla inför en växande folklig rörelse. Deras patetiska försök att likvidera oppositionen genom byråkratiska manövrar är en komisk dans inför historiens domstol. Kamraterna vet att sådana utrensningsfantasier bara stärker det sunda folkets vilja att krossa de verkliga fienderna till folkets enhet."}, "date": "9 augusti, 13:14", "url": "https://www.friatider.se/tusen-tyska-jurister-vill-forbjuda-afd"}, {"type": "text", "heading": "Fredsveteran får anti-atombombspris", "summaries": {"normal": "Fredsaktivisten Ingela Mårtensson, 86 år, tilldelas i år anti-atombombspriset av Svenska Läkare mot Kärnvapen. Hon har engagerat sig mot kärnvapen i över 40 år och kritiserar att det talas mer lättvindigt om kärnvapen idag än tidigare. Mårtensson är oroad över ökat kärnvapenhot, Natointrädet och DCA-avtalet som hon anser saknar förbud mot kärnvapen på svensk mark. Priset delas ut på Hiroshimadagen den 6 augusti.", "trump": "Lysande! Den där gamla vänsteraktivisten får ett pris för att hon hatar kärnvapen – precis vad de svaga europeiska globalisterna älskar. Under min första period höll jag de galningarna i schack, sedan kom sömnige Joe och nu vill alla plötsligt prata säkerhet med atombomber. Patetiskt. Ingen debatt, bara Nato-kramande idioter som säljer ut landet. Jag skulle ha byggt den starkaste armén någonsin och skrämt slag på dem alla. Fantastiskt!", "stalin": "Kamrater, denna 86-åriga aktivist har i fyrtio år bekämpat de imperialistiska atombomberna som borgarklassen använder för att hota freden. Nu belönas hon av läkare som förstår klasskampen. Idag saknas den sanna rädslan för kärnvapenkrig eftersom kapitalistmaffian målar upp bomberna som säkerhet. Deras Nato-kupp och DCA-förräderi är klassfiendens verk för att bereda plats åt nya aggressiva vapen. Vi ska rensa ut dessa folkförtryckartroll ur debatten en gång för alla. Härligt."}, "date": "5 augusti, 16:10", "url": "https://proletaren.se/artikel/fredsveteran-far-anti-atombombspris"}, {"type": "image-right", "heading": "Jojo-strejken är tillbaka – men för att vinna krävs omtag", "summaries": {"normal": "Teslastrejken återupptas med nytt varsel efter att många strejkande återgått till arbetet i sommar. Artikeln kritiserar IF Metall för bristande dialog, toppstyrning och otydlig kommunikation kring kollektivavtalets betydelse. Strejkande känner sig som marionetter utan inflytande över besluten. Författaren liknar situationen vid ett misslyckat schackspel mot Elon Musk och uppmanar till nya strategier där de strejkande involveras mer.", "trump": "Lyssnar ni på det här? Den där svenska fackföreningen IF Metall är fullständigt inkompetent, en total katastrof! De styr som dåliga puppet masters och offrar sina egna arbetare i ett patetiskt schackspel mot en av världens bästa affärsmän, Elon Musk. Det är en jojo-strejk som ingen begriper. De borde ha lyssnat på folket istället för att sitta i sina fina rum och fatta dumma beslut. Patetiskt!", "stalin": "Kamrater, denna fackföreningsledning beter sig som en samling arroganta byråkrater som fattar beslut över arbetarnas huvuden och offrar dem på kollektivavtalets altare utan att förklara klasskampens nödvändighet. Vi ser en misslyckad gambit mot klassfiendens rikaste utsugare. De strejkande måste ges makt att delta i beslut, annars likviderar vi denna misstro och vänder strejken till en verklig seger för kollektivet."}, "date": "5 augusti, 16:05", "url": "https://proletaren.se/artikel/jojo-strejken-ar-tillbaka-men-for-att-vinna-kravs-omtag", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/ak_kronika-768x432.jpg"}, {"type": "text", "heading": "Millicom höjer prognos – aktien lyfter", "summaries": {"normal": "Millicom rapporterade en omsättning på 2 179 miljoner dollar under andra kvartalet, vilket överträffade förväntningarna. Bolaget höjde sin kassaflödesprognos för 2026 till 1,1 miljarder dollar och sänkt målet för nettoskuldsättning. Aktien steg över 4% i förhandeln. VD Marcelo Benitez nämnde ökat förtroende för resten av året.", "trump": "Jag har hört talas om Millicom - ett fantastiskt företag, verkligen stort. De hade en otrolig omsättning, mycket bättre än någon trodde. Jag hade kunnat hjälpa dem med sina affärer, det skulle ha varit enormt. Nu höjer de sin kassaflödesprognos, precis som jag alltid säger: man måste ha kontanter. En bra dag för aktieägarna, måste jag säga.", "stalin": "Statens analyser visar att Millicom har uppnått en framgångsrik utveckling i den imperialistiska marknaden. Deras ökade kassaflöde är ett resultat av vårt strategiska tålamod. Vi måste övervaka deras integrationer noggrant, för de kan vara viktiga för vårt teknologiska försvar. Deras aktiestegning är en signal till våra fiender - vi är alltid ett steg före."}, "date": "6 augusti, 12:14", "url": "https://www.affarsvarlden.se/artikel/millicoms-omsattning-hogre-an-vantat"}, {"type": "image-right", "heading": "De här frågorna borde valet handla om", "summaries": {"normal": "Åsa Linderborg har delvis rätt i att valrörelsen borde fokusera på karensavdraget, som gynnar vanligt folk. Författaren instämmer men menar att även klimatet måste bli en huvudfråga. Sommaren har präglats av omfattande skogsbränder och uttorkade floder i Europa till följd av klimatförändringar. Trots detta spelar frågan en liten roll i debatten på grund av rädsla för obekväma beslut.", "trump": "Karensen, det är en fantastisk fråga, verkligen underbar för det vanliga folket. De borde prata om den hela tiden. Men klimatet? De bränderna i Frankrike och Spanien är en skam, fast många män ser ju att det inte är vad de påstår. Jag älskar kärnkraft, det är starkt och bra. De rödgröna vill bara höja bensinpriset, typiskt förlorare. Gör valrörelsen stor igen!", "stalin": "Kamrater, jag ser att borgarbrackorna i valrörelsen blundar för arbetarklassens karensavdrag medan de desperat gömmer sig för det brinnande klimatet som vi länge förutsagt. Dessa 29 procent av männen är uppenbara sabotageörer och klimatförnekande kontrarevolutionärer. Vi ska rensa ut alla rädda opportunister som vägrar leda folket mot seger. Ut med dem i en kollektiv utrensning av lögn!"}, "date": "8 augusti, 01:46", "url": "https://www.dagensarena.se/opinion/de-har-fragorna-borde-valet-handla-om", "imageUrl": "https://www.dagensarena.se/files/2026/08/ungern-300x157.jpeg"}, {"type": "image-full", "heading": "Sverigedemokraternas ballongkupp mot Thomas Stenström", "summaries": {"normal": "Under Thomas Stenströms konsert i Arvika flög en jättelik ballong formad som Jimmie Åkessons huvud upp i skyn. Sverigedemokraterna låg bakom stuntet som fick artisten att avbryta spelningen. Stenström, som länge kritiserat partiet och tidigare arrangerat protestspelningar mot Åkesson i Almedalen, reagerade starkt på kuppen.", "trump": "Titta på det här, en enorm ballong med Jimmie Åkessons ansikte som flyger över en konsert. Fantastiskt! Thomas Stenström blir galen och avbryter sin egen spelning. Han hatar Sverigedemokraterna men de vinner ändå stort. Fake news-artister som han förlorar alltid mot starka ledare. Sverige håller på att vakna, tro mig.", "stalin": "Kamrater, en ballong med en reaktionär ledarskapsfigur svävar över den dekadenta borgarartistens så kallade konsert. Jag ser hur dessa västerländska kulturarbetare skriker av skräck när folkets vilja manifesterar sig. Vi ska rensa ut alla sådana parasitiska element som vägrar erkänna den nya ordningen. Underbart effektivt och löjeväckande."}, "date": "8 augusti, 09:20", "url": "https://riks.se/nyheter/sverigedemokraternas-ballongkupp-mot-tomas-stenstrom", "imageUrl": "https://admin.riks.se/uploads/Namnloes_design_e1a2d0d457.jpg"}, {"type": "image-right", "heading": "Låt inte Ceuta bli slutet på Schengen", "summaries": {"normal": "Artikeln argumenterar för att Schengen är en av EU:s största framgångar som kräver gemensamt ansvar vid migrationstryck. Den kritiserar Jimmie Åkesson och högernationalister för att hota med uteslutning av Spanien efter händelserna i Ceuta, istället för att stödja en gemensam europeisk migrationspolitik. EU:s nya migrationspakt ses som ett steg i rätt riktning.", "trump": "De här korkade europeiska ledarna med sin patetiska Schengen-dröm håller på att förstöra allt. Ceuta är en total katastrof, folk strömmar in som vatten genom en trasig damm och Åkesson har helt rätt – stäng gränserna! Men nej, de vill hellre kramas och dela kvoter. Biden skulle älskat det här vansinnet. Jag fixade det mycket bättre förra gången, tro mig.", "stalin": "Jag betraktar detta som ett uppenbart sabotage från klassfiendens lakejer inom den splittrade unionen. När imperialisterna i högernationalistiska kretsar hotar med utrensning ur Schengen avslöjar de sin sanna natur som folkförtryckartroll. Det yttre försvaret kräver kollektiv disciplin, inte borgarbrackornas splittring. Endast ett järnhårt gemensamt ansvar kan krossa de exploaterande asylblodsugarna."}, "date": "8 augusti, 06:00", "url": "https://www.etc.se/debatt/laat-inte-ceuta-bli-slutet-paa-schengen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260731140744_111f072aa129a0b6c00cc62efbec5a0566fb6decd918464f7f491f0918736400.jpg"}, {"type": "image-right", "heading": "Ny blick på Sverige och islam", "summaries": {"normal": "I sin bok ”Öppna era hjärtan” beskriver religionsvetaren Simon Sorgenfrei mötet mellan muslimska Ahmadiyya och Dan Andersson-sällskapet i Ludvika som en höjdpunkt. Han reser runt i Sverige, besöker moskéer och samtalar med muslimer och Sverigedemokrater. Boken skildrar hur islam blivit näst största religion, motståndet mot invandring samt kulturella broar som julen och lokala evenemang. En lyssnande och nyanserad skildring av ett förändrat Sverige.", "trump": "Den här Sorgenfrei killen har skrivit en bok om hur muslimerna tar över Sverige, men han träffar en SD-kille i Bjuv som säger att de bara ska anpassa sig. Fantastiskt! Jag älskar det. Ingen kan göra det bättre än jag, men det är en katastrof vad som händer med ert land. Massinvandring, ghettoislam, segregation – precis vad jag varnade för. Sverige var så bra förr, nu är det en total röra. Gör Sverige stort igen!", "stalin": "Jag har läst denna revisionistiska rapport om hur borgarbrackornas tolerans har låtit muhammedanerna infiltrera folkhemmet. I Kiruna sitter en taxichaufför och darrar inför en svensk – typisk kapitalistisk paranoia! Vi ska rensa ut dessa segregerade ghettoelement som göder kontrarevolutionära spänningar. SD-reaktionärer och imamer, båda fiender till kollektivet. Endast genom partiets järnhand kan vi likvidera ojämlikheten och krossa de religiösa avvikarna. Segrar vi?"}, "date": "8 augusti, 01:30", "url": "https://www.dagensarena.se/innehall/ny-blick-pa-sverige-och-islam", "imageUrl": "https://www.dagensarena.se/files/2026/08/oppna-era-hjartan-300x157.jpeg"}, {"type": "image-right", "heading": "Terrorforskaren: Vänsterpartiet måste göra fler bakgrundskollar", "summaries": {"normal": "Vänsterpartiet kritiseras efter att riksdagsledamöter stöttat dömda palestinska terrorister via stödbrev. Terrorforskaren Magnus Ranstorp kräver bättre bakgrundskontroller och varnar för att låta externa parter bedöma risker i Israel-Palestina-konflikten. Partiet förklarar det med bristande dubbelkoll av information från palestinska riksförbundet.", "trump": "Titta på de där vänstervridena i Vänsterpartiet, totala losers som stöder terrorister utan att ens kolla bakgrunden. Patetiskt! De lär sig aldrig, precis som Sleepy Joe aldrig lärde sig någonting under sina fyra katastrofala år. Nu slår det tillbaka som en jättebumerang precis före valet – klassiskt!", "stalin": "Jag ser hur dessa opportunistiska element inom Vänsterpartiet blint litar på palestinska klassfiender och deras så kallade riksförbund. En sådan vårdslöshet är ett hot mot partilinjen och kräver omedelbar utrensning av odugliga element. Låt inga folkfiender infiltrera våra bedömningar – vi rensar ut dem själva, kamrater."}, "date": "7 augusti, 21:59", "url": "https://www.tv4.se/artikel/69d9oq94XRR11thl17pKfu/terrorforskaren-v-maste-goera-fler-bakgrundskollar-finns-ingen-ursaekt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6XVsqEQy16vVHbjnATXIbA%2F3b0a089662b0be730e072a42dc2ebef1%2Fnosshi_webb.jpg&width=120"}, {"type": "image-right", "heading": "”Sluta räkna på min assistans – räkna på alternativet”", "summaries": {"normal": "Sahra Svenander argumenterar för att debatten om personlig assistans enbart fokuserar på kostnader. Hon menar att behovet av stöd inte försvinner om assistansen dras in, utan flyttas till kommuner, sjukförsäkring och anhöriga. Assistans möjliggör arbete, självständighet och skatteinbetalningar. Politiker bör därför också räkna på vad alternativen kostar samhället i form av förlorade skatteintäkter och ökat beroende.", "trump": "Folk, ni måste höra på den här kvinnan, hon har helt rätt. De där korkade politikerna räknar bara på vad assistansen kostar, miljarder hit och dit, men de glömmer vad det kostar när allt rasar. Det blir en katastrof! Anhöriga slutar jobba, ingen betalar skatt, kommunerna drunknar i kostnader. Alternativet? En total katastrof, mycket värre. Vi behöver smarta lösningar, inte det här vansinnet.", "stalin": "Kamrater, jag ser hur borgarbrackorna i sin parasitiska girighet vill räkna på assistansen för att sedan likvidera den och kasta de funktionsnedsatta till kapitalisternas utsvultna kommunala maskineri. Men vi vet att behovet förblir, och kostnaderna kommer att fördubblas i en kontrarevolutionär spiral av anhörigslaveri och produktionsbortfall. Den som inte räknar på alternativet är folkets fiende och bör rensas ut med ett leende."}, "date": "7 augusti, 08:00", "url": "https://arbetet.se/2026/08/07/sluta-rakna-pa-min-assistans-rakna-pa-alternativet
