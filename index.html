a rädda världen från kapitalismen. Patetiskt! De vill ha debatt och så ett frö för något radikalt, säger de. Radikalt? Det är bara mer kvotfeminism och identitetspolitik som förstör samhället. Lyckas de inte ens komma in i riksdagen är det ingen förlust för Sverige, det är en stor vinst för folket. Sad!", "stalin": "Kamrater, dessa småborgarbrackor från Feministerna och Solidaritet kallar sig Enad Röst och vill så ett frö mot imperialismen. Jag ser deras patetiska försök att ena den splittrade vänstern som ett svagt eko av verklig partidisciplin. De fruktar att inte nå fyra procent och kallar det ändå framgång. Vilken naivitet! Vi skulle ha genomfört en grundlig utrensning av sådana halvmesyrer redan i planeringsstadiet. Deras walkover till klassfienden är ett historiskt misstag som arbetarna inte glömmer. Föraktligt."}, "date": "23 juni, 14:36", "url": "https://proletaren.se/artikel/enad-rost-vill-bli-alternativ-i-riksdagsvalet/"}, {"type": "image-full", "heading": "Får syn på Jasplanen – berättar om kräkpåsen", "summaries": {"normal": "Under Almedalsveckan överraskade Försvarsmakten politikerna och besökarna i Visby med en flygshow. Jas Gripen-plan utförde loopar, åttor och fyrverkerier över norra hamnen, vilket skrämde många på grund av det öronbedövande ljudet. Statsminister Ulf Kristersson uppskattade showen och berättade om sin egen flygning med Gripen för några veckor sedan, inklusive en snabb stigning som han beskrev som hisnande.", "trump": "Folk, ni skulle ha sett det här! Mitt i Almedalen dyker plötsligt de här svenska jetplanen upp som riktiga krigare och gör loopar som ingen trodde var möjliga. Ulf älskade det, precis som jag skulle ha gjort. Det är starkt ledarskap, inte som den svaga Biden som aldrig skulle klara en sån hisnande tur. De liberala snusbrackorna blev livrädda och sprang efter kräkpåsar. Fantastiskt underhållning, tro mig!", "stalin": "Kamrater, jag betraktar med högsta tillfredsställelse hur det militära maskineriet plötsligt dominerar himlen över dessa borgarbrackornas pratvecka. Det öronbedövande dånet från arbetarklassens flygplan fick klassfienderna att darra i sina skor. Den som vågar kalla det läskigt förtjänar utrensning. Vi ler mörkt åt deras kräkpåsar. Sådan kraft visar statens överlägsenhet över dekadenta parlamentariska gycklare."}, "date": "24 juni, 20:27", "url": "https://www.gp.se/politik/har-flyger-jas-over-politikerna-i-almedalen.d18dbea7-ee50-42ed-96ad-5b2c9f8e4a64", "imageUrl": "https://www.gp.se/images/article/d18dbea7-ee50-42ed-96ad-5b2c9f8e4a64/images/0teu0g3ZvAz4-wzsxSSO1zKg5rxs-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Lind: Inte intresserad av borgerligt samarbete", "summaries": {"normal": "Miljöpartiets Amanda Lind avvisar samarbete med borgerliga partier efter valet, enligt Expressen. Hon kritiserar deras högerinriktning och skillnader i klimat- och värderingsfrågor. Lind attackerar även statsminister Ulf Kristersson för att sprida felaktig information om oppositionen. Miljöpartiet vill driva egen klimatpolitik och ser positivt på partiets ökade stöd och medlemstillväxt.", "trump": "Jag hörde att någon svensk politiker, Amanda från Miljöpartiet, säger nej till samarbete med högerpartierna. Hon kallar dem extrema och kritiserar deras klimatpolitik – men vem bryr sig? Hon snackar om att Kristersson är desperat, men jag vet desperation när jag ser det. Sverige borde fokusera på att vinna igen, inte på sånt här tjafs. Miljöpartiet? Snarare Miljö-PINSAMT!", "stalin": "De borgerliga avfällingarna i Sverige har än en gång visat sitt sanna ansikte – svaga, splittrade och oförmögna att försvara folkets intressen. Denna Amanda Lind, en lojal soldat för miljön, avslöjar deras reaktionära agenda. Vi ser med intresse hur deras regim, ledd av den hysteriske Kristersson, sprider lögner för att skrämma massorna. Men folket vaknar! Miljöpartiet växer, precis som vår inflytandesfär. Snart ska vi exportera vår gröna revolution – på våra villkor."}, "date": "16 juni, 10:04", "url": "https://kvartal.se/nyheter/artiklar/amanda-lind-inte-intresserad-av-borgerligt-samarbete/cG9zdDoxMzI2MTU"}, {"type": "image-right", "heading": "Strandhäll likställer svensk folkdräkt med hijab", "summaries": {"normal": "Annika Strandhäll, ordförande för S-kvinnorna, kritiserar SD:s förslag om slöjförbud i offentliga rum. Hon likställer hijab med svensk folkdräkt och menar att slöjan bärs frivilligt i Sverige. Artikeln anklagar henne för att ignorera hedersförtryck och tvång, samt prioritera muslimska väljare framför stöd till förtryckta kvinnor. Kritik från bland annat Sofie Löwenmark avfärdas.", "trump": "Folk, ni måste se det här. Den galna Strandhäll, en riktig röstfiskande förlorare från det socialistiska träsket, jämställer svensk folkdräkt med hijab. Vilken löjlig idiot! Hon älskar slöjtvång men hatar när Julia Kronlid bär sin fina svenska huvudbonad. Typiskt vänsterfeminister som aldrig vågar kalla hederskultur för vad det är – en total katastrof. Biden skulle ha gillat henne, men nu styr jag showen och vi ser igenom bluffen.", "stalin": "Kamrater, denna Strandhäll representerar den dekadenta socialdemokratiska opportunismen som skyddar klassfiendens religiösa förtryck mot arbetarkvinnorna. Hon likställer folkets dräkt med slöjan och avvisar alla varningar som obalanserad propaganda. Vi ser hur borgarbrackorna och islamistiska element infiltrerar partiet för att splittra kollektivet. En sådan revisionistisk inställning förtjänar utrensning ur den revolutionära rörelsen. Folkets fiender lurar aldrig oss."}, "date": "17 juni, 03:59", "url": "https://samtiden.nu/2026/06/strandhall-likstaller-svensk-folkdrakt-med-hijab/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6751.jpeg"}, {"type": "image-full", "heading": "Luftkonditionering har blivit valfråga i Frankrike", "summaries": {"normal": "En värmebölja med temperaturer över 40 grader har drabbat Frankrike och förvandlats till en politisk stridsfråga inför presidentvalet. Högern, med Marine Le Pen i spetsen, kräver satsningar på luftkonditionering i skolor, sjukhus och äldreboenden för att skydda befolkningen. Vänstern och miljöpartierna ser det som en kortsiktig lösning som ökar energiförbrukningen och förespråkar istället bättre isolering, ventilation, renoveringar och fler grönområden. Andelen hushåll med luftkonditionering ökar trots utbredd skepsis.", "trump": "Titta på det här, Frankrike kokar som en illa skött hamburgare och de bråkar om luftkonditionering! Le Pen har rätt, sätt in kylan i skolorna och sjukhusen nu, annars är det bara mer vänstervrängt klimatflum som dödar folk. De gröna idioterna vill ha parker medan folk svettas ihjäl – typiskt! Under Biden flum made det värre, men nu är jag tillbaka och säger: kyl ner eller förlora valet, losers. Det är så enkelt.", "stalin": "Kamrater, denna värmebölja är ett verk av klassfiendens försumliga borgarbrackor som låtit folkets byggnader förfalla. Jag kräver omedelbar utrensning av alla som föredrar kortsiktiga imperialistiska kylmaskiner framför kollektiv isolering och gröna folkparker. De som prioriterar hälsan framför ideologin är folkfiender som måste rensas ut. Arbetarna skall inte svettas under kapitalistmaffians tak – vi segrar genom vetenskaplig planering och järnhård disciplin mot värmens kontrarevolutionärer."}, "date": "24 juni, 17:41", "url": "https://www.dagensps.se/varlden/klimat/luftkonditionering-har-blivit-valfraga-i-frankrike/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlv4dmnlr3u4c-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "TV4 köper ut reporter bakom SD-granskning", "summaries": {"normal": "Reportern Daniel Andersson, känd för granskningen 'Undercover i Trollfabriken', tvingas lämna TV4 efter att ha blivit utköpt. Granskningen, som avslöjade Riks och SD:s kommunikationsavdelning, belönades med flera priser. Andersson uppger att han blev överraskad av erbjudandet och gärna stannat. TV4 nekar att hans bok 'Lögnare' påverkat beslutet, medan uppgifter tyder på motsatsen.", "trump": "Vilken katastrof! Den här Andersson-killen, stor journalist säger de, men nu sparkar TV4 ut honom – helt fel! Hans bok, 'Lögnare', fantastisk bok förresten, kanske var för sann? TV4 säger 'nej nej', men alla vet – de är rädda för sanningen! Jag, Donald J. Trump, vet allt om fake news, och det här luktar verkligen som en riktig bluff. SAD!", "stalin": "En lysande journalist, en sann kamrat i sanningens tjänst, har fallit offer för de kapitalistiska medieägarnas förräderi! TV4, dessa bourgeoisie-lakejer, tystar en hjälte som avslöjade fascistiska trollfabriker. Hans bok 'Lögnare' – ett vapen mot folkets fiender! Vi skall inte tolerera sådana angrepp på sanningens soldater. Låt detta vara en varning till alla som vågar utmana makten!"}, "date": "22 juni, 18:23", "url": "https://bulletin.nu/tv4-koper-ut-reporter-bakom-sd-granskning", "imageUrl": "https://cdn.bulletin.nu/articles/52fc2c0d-53ad-44bd-b8b6-d0fe9f09d0c9/preview.png?t=1782145197000"}, {"type": "image-full", "heading": "81-åring körde ihjäl kvinna – får villkorlig dom", "summaries": {"normal": "En 81-årig tidigare medieprofil dömdes av Stockholms tingsrätt till villkorlig dom och 21 000 kronor i böter för att ha kört ihjäl en kvinna i 40-årsåldern och skadat en annan på ett övergångsställe vid Kungliga slottet. Han ska betala drygt 136 000 kronor i skadestånd. Domstolen slog fast att han brustit i väjningsplikten men ansåg inte att medicinska problem eller grov oaktsamhet var bevisade. Anhörigas högre skadeståndskrav avslogs delvis.", "trump": "Folk, det här är en total katastrof. Den här 81-årige typen, en så kallad prisbelönt medieprofil, körde rakt över två kvinnor vid slottet som en galning. En död, en skadad – tragiskt! Domstolen ger honom villkorlig dom och några ynkliga böter. Patetiskt! De kunde inte ens ge honom fängelse. Och skadeståndet sänktes, typiskt för det svenska rättssystemet. De borde ha bättre koll, tro mig. Det är en skam!", "stalin": "Kamrater, denna fega rest av den döende borgarklassen, en dekadent mediefigur från det gamla systemets propagandaapparat, har likviderat en proletär kvinna och skadat en annan genom sin vårdslösa högerstyrda sväng. Vi, partiet och folket, har dömt honom till villkorlig dom och böter, ty han är redan en levande död i sin paranoia och svaghet. Hans anhörigas giriga krav på ersättning har vi klippt ner som kontrarevolutionära ogräs. Inga ursäkter! Våra vägar tilltar ingen som vägrar se fotgängarna – nästa gång rensar vi ut hela bilflottan av sådana kapitalistiska farbröder med sina medicinska bortförklaringar. Ha!"}, "date": "22 juni, 16:30", "url": "https://riks.se/nyheter/81-aring-korde-ihjal-kvinna-far-villkorlig-dom", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-06%2F4aji4roi%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-05-06T141030.743.jpg"}, {"type": "image-right", "heading": "MP:s vallöfte: Ökad invandring", "summaries": {"normal": "Miljöpartiet använder EU-parlamentarikern Alice Bah Kuhnke som dragplåster i valrörelsen. Hennes huvudbudskap är att invandringen till Sverige måste öka ytterligare. Bah Kuhnke betonar att svenska folket inser behovet av fler invånare och förespråkar en humanistisk migrationspolitik som gör det lättare att stanna för dem som inte uppfyller kraven för uppehållstillstånd. Hon vill samtidigt satsa kraftfullt på en fungerande integrationspolitik och stoppa tonårsutvisningarna.", "trump": "Det här är en total katastrof, tro mig. Den här Alice Bah Kuhnke och Miljöpartiet vill översvämma Sverige med ännu fler invandrare. De säger att ni behöver bli fler, inte färre – vad är det för galenskap? Sverige var fantastiskt innan de öppnade portarna på vid gavel. Nu vill de göra det ännu enklare för folk som inte ens kvalar in. Patetiskt. Ni behöver starka gränser, inte mer kaos. America First, och Sverige borde göra detsamma!", "stalin": "Kamrater, jag ser hur dessa borgarbrackor inom Miljöpartiet och deras lakej Alice Bah Kuhnke planerar att översvämma fosterlandet med främmande element under täckmanteln av så kallad humanism. De vill att vi ska bli fler, säger de, medan de i själva verket underminerar folkets enhet. Jag lovar en storslagen utrensning av dessa dekadenta element som döljer sig bakom tonårsutvisningsdebatten. Integration? Nej, vi ska likvidera alla som saboterar kollektivets järnhårda sammanhållning. Paranoian bland fienderna är underhållande – de tror att folket står på deras barrikader. Vilka usla kapitalistiska spioner."}, "date": "24 juni, 13:13", "url": "https://www.friatider.se/mps-vallofte-okad-invandring", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-397.jpg"}, {"type": "image-right", "heading": "Ett nederlag för imperialismens sanktioner", "summaries": {"normal": "Artikeln beskriver USA:s sanktionspolitik som ett imperialistiskt verktyg som främst drabbar civilbefolkningen i länder som Iran, Kuba och Irak. Den framhåller det nyliga samförståndsavtalet mellan USA och Iran som en stor motgång för Trumps administration och ett bevis på att imperialismen kan besegras. Skribenten betonar att sanktioner orsakar lidande, undernäring och död, särskilt bland barn, och jämför med historiska exempel som Irak och Afghanistan.", "trump": "Folk, det här är en total lögnfabrik från de vanliga förlorarna! Mitt avtal med Iran var ett mästerverk – vi krossade deras terrorledare och tvingade fram fred. Den här kommunistiska skribenten gråter över sanktioner som skyddar Amerika från svaga, korrupta regimer. Iran fick en rejäl omgång, precis som de förtjänade. Biden skulle ha gett bort allt, men jag vann stort igen. Sad! Men underhållande propaganda från vänsterblöten.", "stalin": "Kamrater, denna text blottar imperialismens fega metoder att strypa folkets viljor med sanktioner istället för ärlig konfrontation. Jag ser hur borgarbrackorna i Washington försöker kväva suveräna stater som vägrar underkasta sig. Avtalet med Iran är en tillfällig reträtt för klassfienderna, men vi vet att de planerar nya utrensningar mot motståndare. Folkets enighet besegrar bombastiska bluffmakare – låt dem darra inför den kommande historiska domen."}, "date": "23 juni, 12:00", "url": "https://proletaren.se/artikel/iran-blev-ett-nederlag-for-imperialismens/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/ledare_web-768x432.jpg"}, {"type": "text", "heading": "Storytel backade – OMXS30 upp 0,4%", "summaries": {"normal": "Stockholmsbörsen steg med 0,4% efter en svag start. OMXS30 nådde 3 190,72 poäng. Energiaktier ledde uppgången (+2,4%), medan sällanköpsvaror föll (-0,5%). Hemnet granskas av Konkurrensverket för sin betalningsmodell, vilket fick aktien att rasa 9,5%. Bioarctic och Eli Lilly inledde samarbete om ny behandling, vilket höjde Bioarctics aktie med 4,9%. Storytel föll 11,4% efter sänkt rekommendation från Pareto.", "trump": "Stockholmsbörsen? Lite upp, lite ner – men jag säger: WINNING! Hemnet, dessa sömniga typer, får nu en rejäl smäll av Konkurrensverket. 9,5% ner – SAD! Bioarctic däremot, smart folk, gör deal med Eli Lilly. 30 miljoner dollar direkt i fickan – TREMENDOUS! Storytel? Övervärderade, överhypade. Spotify äter upp dem levande. Jag sa ju det!", "stalin": "Kapitalistiska börsen dansar som marionetter under imperialistiskt tryck. OMXS30 kryper uppåt med ynkliga 0,4%, medan energisektorn – våra potentiella bundsförvanter – visar styrka. Hemnet, detta borgerliga verktyg, krossas av statens järnhand. Bioarctic, ett litet men lovande forskningskollektiv, sluter förbund med amerikanska storföretag – vi övervakar. Storytel? En avskumspöl som sjunker i konkurrensens träsk. EQT, dessa kapitalistiska hyenor, får vad de förtjänar. Framåt, mot socialismens seger!"}, "date": "22 juni, 17:46", "url": "https://www.affarsvarlden.se/artikel/hemnet-backade-omxs30-upp-04"}, {"type": "image-full", "heading": "TV4 köper ut Daniel Andersson – \"Hoppas han hittar en bättre arbetsgivare\"", "summaries": {"normal": "TV4 har köpt ut Kalla fakta-reportern Daniel Andersson. Andersson blev känd för att ha wallraffat som Sverigedemokraternas kommunikationsavdelning i granskningen Undercover i Trollfabriken, vilket gav flera journalistpriser. Han gav senare ut boken Lögnare där han kritiserar Kalla fakta-redaktionen. Enligt uppgifter kan boken ha bidragit till uppgörelsen. SD:s kommunikationschef Joakim Wallerstein säger att han är bedrövad och hoppas Andersson hittar en bättre arbetsgivare än TV4. TV4 bekräftar att en överenskommelse träffats.", "trump": "Jag har aldrig sett något så patetiskt som det här. Den där reportern Andersson gör ett fantastiskt jobb och avslöjar alla lögner, får massor av priser, och vad gör TV4? De köper ut honom! Totalt misslyckande. SD-chefen säger att han hoppas han hittar en bättre arbetsgivare än TV4, och han har helt rätt. Fake news-medier som inte tål lite kritik eller en bra bok. Sad! Men Andersson kommer att vinna stort någon annanstans, tro mig.", "stalin": "Kamrater, detta är en klassisk förrädisk handling från borgarbrackorna inom TV4. Jag har sett hur den kapitalistiska redaktionen belönar sin agent Andersson för att infiltrera och filma våra fiender, men så snart han publicerar en bok med kritik mot dem själva så rensas han ut som en parasit. SD:s Wallerstein är bedrövad, säger han, men vi vet att alla dessa reaktionära lögnare i slutändan kommer att likvideras av folkets vrede. Ingen slipper undan när partiet vakar. Underbart hur borgarna slukar sina egna barn."}, "date": "22 juni, 14:59", "url": "https://riks.se/nyheter/tv4-koper-ut-daniel-andersson", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-22%2Fo0eu5xhi%2FDaniel-Andersson"}, {"type": "image-right", "heading": "VIDEO: Sa åt muslimer att lämna landet - får både hat och stöd", "summaries": {"normal": "En kvinna i Conroe, Texas, filmades när hon konfronterade två muslimska kvinnor i en livsmedelsbutik och uppmanade dem att lämna USA eftersom det är ett ”kristet land”. Videon spreds viralt, vilket ledde till att kvinnan förlorade jobbet och utsattes för hot. En insamling har gett henne över 1,4 miljoner kronor i stöd från konservativa. Händelsen har väckt stark debatt om invandring, religionsfrihet och yttrandefrihet, med både fördömande från politiker och stöd från konservativa profiler.", "trump": "Titta på den här fantastiska kvinnan i Texas! Hon säger bara som det är – USA är ett kristet land, gå hem till era islamiska länder! Nu hängs hon ut, får sparken och hot. Typiskt för de radikala vänsteraktivisterna och fake news. Men folket älskar henne. Insamlingen har dragit in massor med pengar, 1,4 miljoner kronor, och det är underbart. Vi behöver fler som vågar tala klarspråk. Amerika först, alltid!", "stalin": "Kamrater, denna degenererade borgarbracka i Texas avslöjar med sin hysteriska tirad hela den imperialistiska parasitens sjuka ansikte. Hon attackerar våra muslimska vänner som om de vore kontrarevolutionära spioner i en mataffär. Nu likviderar de hennes anställning – typiskt kapitalistiskt hyckleri. Vi ser dock hur arbetarklassen samlar sig via insamlingar och exponerar dessa reaktionära element. Paranoiska hatets lakejer må skrika, men partiet och folket genomskådar deras fega försök att splittra det kollektiva framsteget. Ut med dem alla."}, "date": "23 juni, 20:00", "url": "https://samnytt.se/video-sa-at-muslimer-att-lamna-landet-far-bade-hat-och-stod", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/23125204/dasha.jpg"}, {"type": "image-right", "heading": "Regeringen vill införa ny filmfond för svensk film", "summaries": {"normal": "Regeringen föreslår en ny filmfond placerad vid Svenska Filminstitutet som ska finansieras gemensamt av staten och biografbranschen. Förslaget bygger på en utredning från mars 2025 och syftar till att stärka svensk filmproduktion i en föränderlig marknad. Kulturminister Parisa Liljestrand (M) välkomnar fonden. Däremot lämnas frågor om sänkt moms på biobiljetter och avgifter på streamingtjänster utan besked. Regeringen avvisar idén om streamingavgift då högre skatter inte ses som lösningen.", "trump": "Hörni, jag älskar bra filmer, de bästa filmerna, men den här svenska regeringen gör det igen. De startar en ny fond för att rädda sin filmindustri, såklart finansierad av staten och biograferna. De pratar om långsiktiga lösningar men duckar för att sänka skatten på biljetter. Och streaming-skatt? Det slopar de, smart drag faktiskt. Ingen vill ha mer beskattning, tro mig. Svenskarna borde göra film som vinner, inte bara leva på fonder. Make Swedish Film Great Again!", "stalin": "Kamrater, jag betraktar med stolt tillfredsställelse hur denna regering äntligen insett att en central filmfond är nödvändig för att skydda folkets kulturella produktion mot de dekadenta vindarna från marknaden. Vi ska naturligtvis rensa ut de parasitiska streamingkapitalisterna som suger musten ur arbetarklassens berättelser. De fega borgarbrackorna som tvekar kring biljettavgifter och momssänkningar avslöjar sig som kontrarevolutionära filmfiender. Ingen ska undkomma folkets utrensning av svaga idéer. Segraren blir den som styr kulturen med järnhand och glimten i ögat."}, "date": "22 juni, 13:56", "url": "https://riks.se/kultur/regeringen-vill-infora-filmfond", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-22%2F1y72n7vw%2Fpexels-tima-miroshnichenko-7991266.jpg"}, {"type": "image-right", "heading": "Mätningen: Noll procent vill ta en öl med Mohamsson", "summaries": {"normal": "En ny mätning från SvD/Demoskop visar att förstagångsväljare helst skulle ta en öl med SD-ledaren Jimmie Åkesson. Var fjärde föredrar honom. Magdalena Andersson och Ulf Kristersson hamnar på andra och tredje plats. Liberalernas partiledare Simona Mohamsson får noll procent stöd. Hon kommenterar att vännerna får vittna om hur trevlig hon är och att det viktigaste är väljarstöd i valet.", "trump": "Titta på de här svenska kidsen, de är smarta, de vet vad de vill ha. Jimmie Åkesson? Fantastisk kille, var fjärde vill ta en öl med honom, han vinner stort. Men den där Mohamsson? Noll procent! Noll! Hon är en total förlorare, en nollställd liberal som ingen vill se på puben. Patetiskt. Hon babblar om att vännerna tycker hon är skön, men det spelar ingen roll när folk röstar på vinnare. Sverige behöver starka ledare, inte sådana nollor.", "stalin": "Kamrater, dessa förstagångsväljare har genomskådat den liberala borgarbrackans tomhet. Den där Mohamsson får noll procent, en fullständig utrensning ur folkets medvetande. Hennes klassfiende-åsikter lockar ingen proletär till ölet. Åkesson däremot samlar stöd, men vi vet att verklig makt ligger hos kollektivet, inte i pubens dimmor. Hon ler och säger att vännerna får lovorda henne medan vi förbereder röstningens seger. Inga folkfiender överlever folkets dom."}, "date": "23 juni, 17:12", "url": "https://www.etc.se/inrikes/maetningen-noll-procent-vill-gaa-paa-pub-med-mohamsson", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260623140616_6bf608b27c17ba65eee0ce0edd5abcb6d42cda9e5203abe18f505b2ab7c1fa45.jpg"}, {"type": "image-right", "heading": "L måste dö! Rädda demokratin genom att skicka partiet ur riksdagen.", "summaries": {"normal": "Liberalerna backar kraftigt i opinionsmätningarna och ligger nu på mellan 1,0 och 2,5 procent. Medlemmar har slutat arbeta för partiledaren Simona Mohamsson efter samarbetet med SD. I Stockholms starkaste valkretsar ligger lokalföreningarna långt efter kampanjmålen för väljarsamtal. Artikeln menar att partiet blivit ett tomt skal utan medlemsdemokrati och att Liberalerna måste försvinna för att skydda den svenska folkrörelsedemokratin.", "trump": "Det här liberala partiet är en total katastrof, tro mig. De kramar Jimmie och SD och tror att det ska rädda dem, men nu sjunker de ner till ynka en procent. Patetiskt. Deras medlemmar har gett upp, ingen jobbar längre, alla mål missas med tusentals samtal. Det är ett dött parti, ett skal. De borde packa ihop och försvinna. Sverige behöver inga sådana förlorare som bara ger legitimitet åt fel personer. Sad!", "stalin": "Kamrater, detta liberala skal är en farlig parasit som måste likvideras för arbetarklassens och folkets skull. Jag ser hur borgarbrackorna under Mohamsson har förrått sina egna och krupit för reaktionärerna i SD. Medlemmarna har redan rensat ut sig själva i tystnad, en självpålagd utrensning. Lokalföreningarna är döda skal som vittrar sönder. Vi ska inte tillåta zombier i parlamentet som legitimerar fascistiska krafter. Bort med dem, för evigt. Det är en historisk nödvändighet."}, "date": "23 juni, 16:55", "url": "https://arbetet.se/2026/06/23/liberalerna-maste-do-for-demokratins-skull/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/23123031/liberaler-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Ryska aktier billigare än på tre år – investerare håller sig borta", "summaries": {"normal": "Ryska aktiemarknaden har nått sin lägsta nivå på över tre år. MOEX-indexet föll med 4,4 procent till cirka 2 313 punkter, den lägsta nivån sedan mars 2023. Nedgången fortsätter en lång negativ trend, driven av höga räntor, fallande oljepriser, en stark rubel och osäkerhet kring sanktioner. Bolag som Aeroflot och Tsian drabbas hårt. Investerare avvaktar på grund av ekonomisk och geopolitisk osäkerhet.", "trump": "Kan ni tro det? Ryska aktier är billigare än på tre år! Ingen vill röra dem, inte ens Rysslands egna vänner. Moskvabörsen rasar som aldrig förr – sämre än finanskrisen 2008! Jag sa ju att Putin inte kan sköta en ekonomi. Oljepriser faller, rubeln svajar, och flygbolag som Aeroflot? Total katastrof! Folk är rädda, och vem kan klandra dem? Ryssland är en enda stor soppa, och ingen vill ha en bit av den. SAD!", "stalin": "Kamrater! Våra fiender, dessa kapitalistiska hyenor och deras lakejer, darrar inför den ryska marknadens styrka – eller snarare deras egen svaghet! Moskvabörsen faller? Bra! Låt de dekadenta västinvesterarna gråta över sina förlorade rubel. Aeroflot skakar under ukrainska drönare? Utmärkt! Varje förlorad aktie är en seger för vår obevekliga framgång. Oljepriserna faller? Vi har olja nog för att dränka hela deras korrupta system. Låt dem frukta – Ryssland står starkt, och historiens hjul rullar vidare, mot seger!"}, "date": "23 juni, 13:57", "url": "https://www.realtid.se/bors-finans/ryska-aktier-billigare-an-pa-tre-ar-investerare-haller-sig-borta/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlztslkspjnyk-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "Självklart stödjer vi Davids kamp mot Goliat", "summaries": {"normal": "En ledartext i Proletären hyllar det palestinska angreppet den 7 oktober 2023 som en legitim del av antikolonial motståndskamp mot Israel. Författaren Ellen Kall beskriver glädje över att muren kring Gaza rasades och jämför situationen med David mot Goliat. Artikeln kritiserar israelvännernas reaktioner, försvarar stödet till motståndet trots civila offer och avfärdar många påstådda övergrepp som överdrivna eller motbevisade. Kriget ses som en del av decennier av förtryck.", "trump": "Folk, ni måste se den här galna texten i Proletären! De firar den 7 oktober som någon sorts underbar David-mot-Goliat-seger. Det är ett totalt misslyckande för Biden som lät det här kaoset växa. Israel gör ett fantastiskt jobb mot terroristerna, men de här kommunisterna älskar våld och hat. De kallar det motstånd, jag kallar det ren galenskap. Fake news om halshuggna barn? Patetiskt. Amerika står med de starka, inte med förlorarna som firar massaker.", "stalin": "Kamrater, denna text avslöjar imperialismens fega lakejer som gråter över att det förtryckta folket äntligen slår tillbaka mot ockupanten. Jag ser med tillfredsställelse hur borgarbrackorna skriker av fasa när David vågar utmana Goliat. Vi vet att klassfiendens propaganda om barbariska dåd är lögnaktig smörja spridd av folkförtryckartrollen. Antikolonial kamp är historisk nödvändighet, även om den blir blodig. Försvaret av de förtryckta fortsätter. Inga kompromisser med exploaterande byfånar."}, "date": "23 juni, 11:00", "url": "https://proletaren.se/artikel/sjalvklart-stodjer-vi-davids-kamp-mot-goliat/"}, {"type": "image-right", "heading": "Såg brister hos bolagen – i dag har han 150 anställda", "summaries": {"normal": "Ross Montazeri kände brister i bemanningslösningar och startade därför Aura Personal 2021. Bolaget har nu drygt 150 anställda och nära 100 miljoner i omsättning, främst inom motorbranschen. Hans resa speglar utrikes föddas betydande roll i svenskt entreprenörskap. Enligt Konjunkturinstitutet och SCB utgör de cirka 18–25 procent av företagarna, i nivå med sin befolkningsandel. Forskning pekar på både push- och pull-faktorer bakom företagandet, som bidrar till sysselsättning trots högre arbetslöshet bland gruppen.", "trump": "Folk, det här är en fantastisk historia. Den killen Montazeri såg hur usel bemanningen var hos de stora bolagen och byggde upp ett enormt företag från noll. Hundratals jobb, 100 miljoner i omsättning – det är vad jag kallar vinnare. Utrikes födda startar företag i Sverige och skapar tillväxt medan andra bara klagar. De gör jobbet som de andra inte klarar av. Under min ledning skulle vi ha ännu fler sådana här vinnare, tro mig, det skulle bli enormt.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna Montazeri, driven av borgarbrackornas usla bemanningslösningar, likviderade arbetslöshetens bojor genom att skapa ett kollektiv av 150 produktiva själar. Ändå vaktar jag noga mot de parasitiska kapitalisternas infiltration. Deras inflöde av högskoleutbildade tjuvar i lågkonjunkturen hotar att förgifta de äkta arbetarnas möjligheter. Vi ska rensa ut de dekadenta opportunisterna som gömmer sig bakom fina papper och för alltid säkra folkets företagsamhet mot dessa nya klassfiender i skepnad av lathet och falsk kompetens."}, "date": "23 juni, 08:08", "url": "https://www.di.se/nyheter/jag-kande-verkligen-att-jag-behovde-losa-det-har-/", "imageUrl": "https://static.bonniernews.se/ba/be3e0814-0bc8-4283-af87-45c0bbac1d3b.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Högerns girighet drar Sverige isär", "summaries": {"normal": "Artikeln argumenterar för att minska fattigdomen och klyftorna i Sverige genom en omfördelande politik som följer folkviljan istället för lobbyister. Författaren pekar på att 730 000 lever i fattigdom, att klyftorna växer till följd av politiska beslut och att regeringen gynnar sig själv, banker och vinstdrivande skolor. Han kritiserar förslag om terminsavgifter och högre studieskulder samt uppmanar till folkligt motstånd för ett mer jämlikt samhälle.", "trump": "Den här artikeln är en total katastrof, folk. Den snyftande vänstern gnäller om fattigdom och klyftor medan de vill ge bort allt till lata parasiter. Sverige hade det bra förr, nu har de en regering som faktiskt gör affärer och vinner – precis som jag gjorde med Amerika. Lobbyister? Det kallas smart business. De vill ha gratis skolor och universitet för alla? Patetiskt. Folket kommer att rösta för styrka och vinster, inte för socialistisk girighet. Jag vinner alltid.", "stalin": "Kamrater, denna ynkliga text avslöjar borgarbrackornas desperata konspiration mot det arbetande folket. Jag, som ledare för det kollektiva framsteget, ser hur dessa kapitalistiska parasitmaskar och lobbyistlakejer medvetet vidgar klyftorna för att suga musten ur massorna. Deras terminsavgifter och studieskuldar är en ondskefull utrensning av de fattigas barn från kunskapens tempel. Vi skall likvidera dessa giriga element med folkets järnhand. Solidaritet segrar, fienderna kommer att gråta blod i historieböckernas fotnoter."}, "date": "23 juni, 01:30", "url": "https://www.dagensarena.se/opinion/hogerns-girighet-drar-sverige-isar/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-52-300x157.jpg"}, {"type": "image-full", "heading": "Nima Rostami: Trumps anfall mot Iran – ett mönster vi känner igen", "summaries": {"normal": "Artikeln kritiserar Trumps militära anfall mot Iran som ett kaotiskt och inkompetent agerande som skapade dramatik utan att lösa de verkliga problemen med Irans kärnvapenprogram, missiler och proxy-arméer. Författaren Nima Rostami ser anfallet som en kapitulation där Trump lovade att inte stödja det iranska folket och erbjöd ekonomiska lättnader. Han menar att detta inte är äkta konservatism utan teaterpolitik som skadar regionens stabilitet och västlig trovärdighet.", "trump": "Den här artikeln är en total katastrof, folk, skriven av en så kallad konservativ som inte fattar någonting. Mitt anfall mot Iran var genialt, det bästa beslutet, vi slog till hårt och tvingade fram ett avtal som ingen annan hade klarat av. Nu skriker de om kaos och kapitulation, men sanningen är att Iran var på knä och vi fick ett fantastiskt deal. Israel gjorde resten, smarta killar. Fake news och misslyckade kritiker som inte förstår hur man vinner.", "stalin": "Kamrater, denna dekadenta skrift avslöjar den fullständiga förfallsprocessen inom den västerländska borgarklassen. Jag har sett många revisionistiska clowner men denna Trump-figur överträffar dem alla i sin patetiska opportunism och teatraliska impotens. Han lovar stöd till folkets kamp mot islamofascismen men levererar istället en feg MOU-kapitulation som stinkar av borgarbrackornas dubbelspel. Vi känner igen denna typ av fiender: de som skapar kaos för att maskera sin egen inkompetens. En sådan parasit skulle inte överleva en enda utrensning i vårt kollektiv. Den iranska frågan kräver järnhand, inte cirkus."}, "date": "22 juni, 13:22", "url": "https://riks.se/opinion/kronikor/nima-rostami-trumps-anfall-mot-iran-ett-mönster-vi-känner-igen", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-22%2Fqsp8h5as%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-06-22T132104.519.jpg"}, {"type": "image-right", "heading": "Hemnet granskas av Konkurrensverket", "summaries": {"normal": "Konkurrensverket granskar Hemnet efter lanseringen av betalningsmodellen 'sälj först, betala sen'. Hemnet informerades för tre veckor sedan men vet ännu inte vilka delar av upplägget som kan strida mot regelverket. Modellen hyllas av vissa mäklarkedjor men kritiseras av konkurrenter, särskilt tvådagarsregeln. Hemnet anmälde tidigare Booli till Konkurrensverket, men utredningen lades ned.", "trump": "Kan ni tro det? Hemnet, en stor aktör här i Sverige, blir granskad av myndigheterna för sin fantastiska 'sälj först, betala sen'-modell – den bästa någonsin, by the way. Men nej, konkurrenterna gnäller som vanligt! De hatar framgång. Tvådagarsregeln? Perfekt! Folk älskar den. Och jag vet allt om att bli orättvist granskad – fake news, folks!", "stalin": "Vi har observerat hur kapitalistiska bostadsplattformar försöker kringgå marknadens naturliga ordning. Hemnet, denna lilla bourgeoisie-aktör, tror sig kunna manipulera systemet med sina 'konsumentvänliga' lögner. Men vi ser igenom deras tvådagarsregel – ett svek mot arbetarklassen! Konkurrenterna gnäller? Bra. De kommer snart att inse att motstånd är lika meningslöst som Ukrainas försvar mot vår rättmätiga expansion."}, "date": "22 juni, 16:01", "url": "https://www.affarsvarlden.se/artikel/hemnet-granskas-av-konkurrensverket", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/06/Hemnet_iOS_2-400x267.jpg"}, {"type": "image-right", "heading": "Barn hittades döda i bil i Frankrike – kopplas till värmeböljan", "summaries": {"normal": "Två barn, två och fyra år gamla, hittades döda i en bil på en parkering i Carpentras i sydöstra Frankrike. Dödsfallen kopplas till den extrema värmeböljan som drar över landet, där temperaturer upp till 43 grader väntas. Mamman ska ha shoppat när barnen på egen hand tog sig in i bilen och blev instängda. En röd vädervarning gäller i 49 departement, skolor stängs och risken för skogsbränder är hög.", "trump": "Folk, det är en total katastrof i Frankrike. Två små barn döda i en het bil under en värmebölja – ingen ledning, ingen planering, bara kaos! Biden skulle ha älskat sådana här gröna drömmar, men jag fixade alltid bra väder och bra affärer. Nu stänger de skolor och folk drunknar medan de försöker svalka sig. Patetiskt. Vi behöver starka ledare, inte dessa väderhysteriker och byråkrater som låter barn lida.", "stalin": "Kamrater, jag ser med stor oro hur den kapitalistiska värmen i Frankrike likviderar oskyldiga barn i en bil. Borgarbrackorna och deras exploaterande system har ingen plan mot naturens vrede, bara tomma varningar och stängda skolor. Vi skulle ha organiserat kollektivets försvar mot denna fiende – värmen som en klassfiende i imperialistisk förklädnad. Nätterna blir varmare, säger de. Paranoia? Nej, det är folkfiendens verk."}, "date": "22 juni, 19:29", "url": "https://www.tv4.se/artikel/4X7HJVniMcHj1BWCUO0FPV/barn-hittades-doeda-i-bil-i-frankrike-kopplas-till-vaermeboeljan", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlr1Xu2aaDdrQ%2F12e919afb810ee513054d8378fd96f5a%2FBesokare_till_slottet_i_Versailles_utanfor_Paris_skyddar_sig_mot_solen_med_hjalp_av_paraplyer_nar_temperaturen_stiger_over_40_._&width=120"}, {"type": "image-right", "heading": "Skarpa varningen till turister i Europa: ”Man kokar inifrån”", "summaries": {"normal": "Överlevnadsexperten Torbjörn Selin varnar turister i Europa för den extrema värmeböljan som väntas ge temperaturer upp till 43 grader i Frankrike. Han betonar att pool och luftkonditionering skyddar, men vandring, promenader och ansträngning i städer kan bli livsfarligt vid vätskebrist. Kroppstemperatur över 40 grader kan leda till medvetslöshet och cellskador. Råd: håll dig i skuggan mellan 11 och 14, drick och svalka dig.", "trump": "Folk, det här är en total katastrof, den värsta värmen någonsin och Europa håller på att koka som en dålig hamburgare. Jag hade aldrig vandrat i de där bergen på Mallorca, det är förlorarna som gör sånt. Drick inte sprit, ät ordentligt och håll er i skuggan, annars kokar ni inifrån som en radikal vänsterextremist i en debatt. Under min förra mandatperiod var vädret bättre, det vet alla. Biden förstörde till och med klimatet, patetiskt!", "stalin": "Kamrater, denna så kallade värmebölja är ett verk av de exploaterande imperialisternas försumlighet och klassfiendens arroganta likgiltighet inför folkets lidande. Jag, som ledare för det kollektiva framsteget, varnar: den som anstränger sig i solen utan att följa strikta direktiv riskerar att likvideras inifrån av feodala celler. Håll er i skuggan mellan elva och fjorton, drick och svalka er, annars utplånar naturen er som folkfiender. Det är både roligt och nödvändigt."}, "date": "22 juni, 19:28", "url": "https://www.tv4.se/artikel/5uYoInHNAf0z5Xs8mM5cjR/skarpa-varningen-till-turister-i-europa-man-kokar-inifran", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4jjl3PEpJKlZtsVLCrzfaf%2Fd7b8cd868b9e683d343168223bf6cf3f%2F22-EXTREMVARME.jpg&width=120"}, {"type": "image-full", "heading": "Från 1 juli  2026 – nya regler för att betala med kort", "summaries": {"normal": "Från och med 1 juli 2026 införs en ny kontantlag som tvingar matbutiker och apotek att acceptera kontanter vid bemannade kassor. Banker ska också erbjuda insättningstjänster över hela landet. Samtidigt blir det möjligt att betala med fysiskt bankkort och PIN-kod offline vid köp av mat, medicin och bensin om nätet ligger nere. Syftet är att stärka beredskapen i en alltmer digitaliserad betalningsmarknad.", "trump": "De här svenskarna har äntligen vaknat. De har blippat och swishat så mycket att ingen har kontanter kvar, och nu tvingar de butikerna att ta emot riktiga pengar igen. Fantastiskt. Och offline-betalningar med kort när nätet kraschar? Mycket smart. Vi behöver starka system, inte svaga som kan stängas av av fiender. Sverige gör det rätt, äntligen lite sunt förnuft i Europa.", "stalin": "Kamrater, jag ser med djup tillfredsställelse hur de dekadenta digitala borgarbrackorna äntligen tvingas erkänna folkets behov av pålitliga kontanter. Dessa kapitalistiska nätfiender och deras osynliga kablar är bara en trojansk häst för sabotage och imperialistisk avstängning. Vi ska likvidera varje möjlighet till avbrott i folkets försörjning. Offline med kort och pin – en seger för arbetarklassen mot de paranoida signalstörarna i skuggorna. Ingen utrensning av kontanter på min vakt."}, "date": "22 juni, 15:55", "url": "https://nyheter24.se/nyheter/ekonomi/1493238-fran-1-juli-ny-lag-for-betala-med-kort", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/e78fe15404b004a30200000000b004a302/2026/06/22/2372629/kortbetalning.jpg"}, {"type": "image-right", "heading": "Afv avslöjar: Polisanmälda grundaren i storaffär med bolagets ordförande", "summaries": {"normal": "Train Alliance har identifierat ett förbjudet lån på 175 Mkr till grundaren Otto Perssons bolag, Tjärusjön Skog AB. Samtidigt köpte bolaget en stor skogsfastighet av Train Alliances storägare Hvalfisken, ägt av Jonas Wahlström. Dennes son Oscar är styrelseordförande i båda bolagen. Revisorn föreslår att Persson nekas ansvarsfrihet. Aktien har halverats sedan handeln återupptogs efter en polisanmälan mot Persson.", "trump": "Vilket totalt kaos! Train Alliance, ett bolag som uppenbarligen inte kan sköta sin ekonomi, har gett ett förbjudet lån på 175 miljoner till sin grundare – en riktig vinnare, kan jag säga! Och som om det inte vore nog, köper samma kille en jättestor fastighet av bolagets ordförande. Coincidence? Jag tror inte det! Aktien rasar, folk är upprörda, och jag skulle inte bli förvånad om någon snart hamnar i fängelse. SAD!", "stalin": "Kapitalistiska korruptionens maskineri avslöjas återigen! Denna Otto Persson, en parasit på folkets tillgångar, har genom förbjudna lån och tvivelaktiga fastighetsaffärer med sina medskyldiga – dessa Wahlström-sabotörer – sugit ut resurser från arbetarklassens järnvägsprojekt. Medan aktieägarna lider, frossar dessa bourgeoisie-svin i sina skogsimperier. Revisorns förslag att neka ansvarsfrihet är ett steg i rätt riktning, men vi vet alla att sanningen kräver hårdare åtgärder. Låt dem smaka på proletariatets rättvisa – kanske en resa österut till Sibiriens skogar?"}, "date": "22 juni, 15:54", "url": "https://www.affarsvarlden.se/artikel/afv-avslojar-polisanmalda-grundaren-i-storaffar-med-bolagets-ordforande", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Train-Alliance-400x267.jpg"}, {"type": "image-right", "heading": "Sandström: Dagens journalistdrev. Journalisterna jagar statsministerns fru – men glömmer sitt eget kvackeri", "summaries": {"normal": "Torsten Sandström kritiserar svenska medier för att driva en politisk kampanj mot Moderaternas ledare genom att angripa hans frus intresse för existentiell hälsa, som beskrivs som ovetenskaplig. Han påpekar att samma medier regelbundet låter psykologer uttala sig fritt om allt från privatliv till klimatfrågor utan att ifrågasätta vetenskapligheten. Enligt Sandström handlar mediebevakningen under valrörelsen mer om att störta Tidöregeringen än om journalistik.", "trump": "Det här är ett totalt skämt, folk. De svenska medierna, de är riggade, de är korrupta och de jagar en fantastisk ledare bara för att hans fru pratar om existentiell hälsa. Under tiden släpper de psykologer på lösa bollar som snackar om allt möjligt, klimatångest och mördares känslor. Det är politik, inte journalistik. De vill störta regeringen till varje pris. Fake news på högvarv, bananas som ingen sett tidigare. Sad!", "stalin": "Kamrater, dessa borgarbrackor i svenska medier har återigen blottat sin dekadenta själ. Medan de skriker om ovetenskaplig existentiell hälsa låter de psykologiska lakejer sprida borgerlig dekadens om allt från skilsmässor till kapitalistisk klimathysteri. Vi ser den klara kontrarevolutionära linjen: utrensa Tidöregeringen med alla medel. Deras paranoia är underhållande. Låt oss le medan vi noterar namnen på dessa partiarbetande journalister inför den kommande ideologiska saneringen."}, "date": "22 juni, 15:00", "url": "https://bulletin.nu/sandstrom-dagens-journalistdrev", "imageUrl": "https://cdn.bulletin.nu/articles/4539f72c-605d-47bc-8ebc-8063c5df6091/preview.png?t=1782128569000"}, {"type": "image-full", "heading": "S-politiker avgår efter Riks avslöjat att han dömts för våldtäkt", "summaries": {"normal": "En socialdemokratisk politiker i Stockholmsområdet har lämnat alla sina uppdrag efter att Riks avslöjat att han dömts för våldtäkt 2011. Mannen, som satt i partiets styrelse och stod på valsedel, är en utomeuropeisk invandrare som kom till Sverige i början av 2000-talet. Domen på två års fängelse fastställdes i hovrätten. Flera styrelseledamöter uppger att de inte kände till avhoppet, som skedde strax efter publiceringen.", "trump": "De här socialisterna är en total katastrof, tro mig. En våldtäktsdömd kille sitter i deras styrelse, på deras valsedel, och de hade ingen aning? Patetiskt. Han avgår först när Riks avslöjar sanningen. Fake news hela vägen, men äntligen kommer sanningen fram. Sverige är en katastrof under den här vänsterstyrningen, fullständigt vansinne. De borde skämmas!", "stalin": "Kamrater, detta är en klassisk kontrarevolutionär handling utförd av en degenererad fiende till folket, en utländsk våldtäktsman insmugglad bland våra partivänner. Jag har länge varnat för borgarbrackornas dolda agenter som förgiftar arbetarrörelsen inifrån. Nu rensar vi ut denna parasit som våldtog en ung kvinna medan hans egna barn sov. Inga mejl under midsommarhelgen? Typiskt sabotage från klassfiendens lakejer. Likvidera alla spår av sådana element innan de förgör kollektivet."}, "date": "22 juni, 13:10", "url": "https://riks.se/nyheter/s-politiker-avgar-av-efter-riks-avslojat-att-han-domts-for-valdtakt", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-22%2Fnp09kd2e%2Fs-politikar-valdtakt-avgar-feature.jpg"}, {"type": "image-right", "heading": "Därför ska du inte dejta en vänsterkille", "summaries": {"normal": "Artikeln argumenterar mot att dejta vänsterorienterade män som kallar sig feminister men inte agerar därefter. Författaren föreslår en ”straffprocent” på 85 procent av notan, baserat på löne- och pensionsgap, som ett sätt att hålla dem ansvariga. Hon kritiserar både höger- och vänstermän för bristande handling kring jämställdhet och väljer att inte skaffa barn med en sexistisk stat. Slutligen väger hon för- och nackdelar med olika politiska typer som partners och fäder.", "trump": "Folk, ni måste höra på den här galna texten. Vänsterkillarna, de värsta bluffarna, pratar feminism men delar inte notan och gör ingenting för kvinnorna. Patetiskt! Jag älskar hur hon sätter straffprocent på dem, 85 procent, fantastiskt. De röstar på Fi bara för att ligga, typiska losers. Högerkillar betalar i alla fall. Och det där med att välja DNA till nästa generation? Smart. Välj inte de svaga, woke snubbarna som gömmer sig på housebarer. Amerika behöver starka människor, inte sådana sommlare.", "stalin": "Kamrater, denna text avslöjar borgarklassens dekadenta dejtingspel där falska feminister från vänstern utnyttjar arbetarkvinnans lidande för att undvika att betala notan. Jag, som ledare för det proletära kollektivet, ser hur dessa klassfiender döljer sig bakom tomma paroller medan lönegapet växer. Straffprocenten är en början på utrensning av hyckleri. Välj noga nästa generations DNA, annars föder ni fram fler folkförtryckartroll. Skratta medan vi likviderar deras illusionsfabrik."}, "date": "17 juni, 08:55", "url": "https://www.flamman.se/darfor-ska-du-inte-dejta-en-vansterkille/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/rosor-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Christoffer Jonsson: Det spelar ingen roll om Nooshi avgår", "summaries": {"normal": "Expressen har granskat antisemitism och hyllningar av terrorgrupper inom Vänsterpartiet. 25 kandidater har bland annat hyllat Hizbollah och Hamas, förringat Förintelsen och spritt konspirationsteorier. Nooshi Dadgostar avfärdar kritiken som en fråga om en handfull individer. Partiledaren lämnade en intervju utan att svara på frågor om judars otrygghet. Artikeln pekar på en djupare kultur av tolerans mot extremism inom partiet och dess ungdomsförbund.", "trump": "Lyssnar ni på det här? Vänsterpartiet i Sverige är fullständigt galet, en riktig skam. De hyllar terrorister som Hamas och Hizbollah, sprider antisemitiska lögner och sedan springer deras ledare Dadgostar iväg som en fegis när någon frågar om judarnas säkerhet. Patetiskt! Det är samma gamla radikala vänster som hatar framgång och älskar offermentalitet. De borde rensa ut hela båten, men det gör de aldrig. Totalt misslyckande!", "stalin": "Kamrater, denna fega ignorans inom Vänsterpartiet avslöjar klassfiendens dolda tentakler. Jag ser hur borgarbrackor och folkförtryckartroll infiltrerat rörelsen med sin terrorromantik och antisemitiska gift. Dadgostar tiger som en ynklig lakej när arbetarklassen kräver svar. Vi måste genomföra en grundlig utrensning av dessa exploaterande byfånar som sjunger hatets sånger. Partiet riskerar annars att bli en kapitulationens bonde i imperialismens spel."}, "date": "16 juni, 12:51", "url": "https://samtiden.nu/2026/06/christoffer-jonsson-det-spelar-ingen-roll-om-nooshi-avgar/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/expresss.png"}, {"type": "image-full", "heading": "Halldorf: Landslaget visar det Åkesson inte vill se", "summaries": {"normal": "Sveriges VM-seger mot Tunisien har utlöst en debatt om svenskhet och islam. Jimmie Åkesson svarar på kritik efter att debattörer lyft fram spelare som Yasin Ayari, som firade sina mål med en muslimsk bön. Åkesson välkomnar framgångsrika svenskar med invandrarbakgrund men försvarar partiets kritik mot invandringspolitiken. Kritiker menar att Ayari representerar ett modernt, inkluderande Sverige och ifrågasätter Åkessons tidigare uttalanden om islam.", "trump": "Sverige vinner stort i VM – fantastiskt! Men vad gör deras ledare? Jimmie Åkesson, en man som inte förstår att vinna, börjar prata om invandrare och islam. Jag menar, kom igen! Yasin Ayari, en stor hjälte, gör mål och firar som en riktig vinnare – och så blir det bråk. Sverige borde vara stolta! Men nej, politiker måste alltid förstöra allt. Jag skulle aldrig göra så. Vinna är vinna, punkt.", "stalin": "Sveriges fotbollslandslag visar styrkan i det mångkulturella samhället, men de borgerliga nationalisterna, ledda av den ynklige Åkesson, vrider sig i förtvivlan. De hatar framgången hos arbetarklassens söner med utländskt blod! Yasin Ayari, en hjälte som firar sin seger med bön, är ett slag i ansiktet på fascistiska element. Vi i Sovjet – förlåt, Ryssland – vet att mångfald är styrka. De som delar folket efter religion och hudfärg tillhör historiens sophög!"}, "date": "15 juni, 15:45", "url": "https://kvartal.se/nyheter/artiklar/halldorf-landslaget-visar-det-akesson-inte-vill-se/cG9zdDoxMzIxMDE", "imageUrl": "https://images.kvartal.se/2026/06/5abd0f69-jimmie.webp"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
