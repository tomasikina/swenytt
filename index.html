na. Vinna stort!", "stalin": "Kamrater, denna Anastasía har förstått arbetarklassens sånger och får nu Ove Allansson-priset. Det gläder mig att hon bekämpar klassfiendens glömska genom att återberätta Swede Hollows historia. Dock vaktar vi mot borgarbrackornas dolda agenter som försöker förvränga folkets kulturarv. Fortsätt framåt, men akta er för folkförtryckartrollen i kulisserna."}, "date": "10 augusti, 15:51", "url": "https://proletaren.se/artikel/robertson-tolkare-far-allansson-pris"}, {"type": "image-right", "heading": "Vänsterkandidat och Palestinavän vann Demokraternas primärval i Michigan", "summaries": {"normal": "Vänsterkandidaten Abdul El-Sayed besegrade kongressledamoten Haley Stevens i Demokraternas primärval till senaten i Michigan. Stevens kampanj, som stöddes av Israel-lobbyn och kostade 70 miljoner dollar, förlorade mot El-Sayed som kritiserar USA:s stöd till Israel. Valet i november kan påverka kongressens maktbalans och USA:s utrikespolitik.", "trump": "Titta på det här! Den radikala vänstermänniskan El-Sayed, en riktig katastrof, slog den Israel-stödjande Stevens trots att hon slängde ut sjuttio miljoner dollar från lobbyisterna. Det är galet! Mina republikaner kommer att krossa honom i november. Vi behöver inte mer av dessa woke-socialister som hatar Israel och älskar att ge bort era pengar till fiender. Amerika först, alltid!", "stalin": "Kamrater, se hur borgarbrackorna och deras israeliska imperialister misslyckades med att köpa valet. Jag betraktar med stor tillfredsställelse hur folkfienden Stevens likviderades av den progressive kamraten El-Sayed. Sådana utrensningar av klassfiender inom det demokratiska skådespelet gläder mig. Vi ska noga övervaka hur detta hotar den amerikanska krigsmaskinens folkförtryckande ambitioner. Utmärkt."}, "date": "10 augusti, 12:57", "url": "https://proletaren.se/artikel/vansterkandidat-och-palestinavan-vann-demokraternas-primarval-i-michigan", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/54882630144_cc0e12784b_k-e1786359325937-768x433.jpg"}, {"type": "image-right", "heading": "Vi mäter integration fel och demokratin betalar priset", "summaries": {"normal": "Artikeln kritiserar att svensk integrationspolitik nästan enbart mäts i sysselsättning och ignorerar politisk integration. Forskning visar att tillhörighet, information och lokalt engagemang ökar valdeltagandet. Långvarig osäkerhet kring uppehållstillstånd och medborgarskap kan minska tillit och demokratiskt deltagande. Tre reformer föreslås för att stärka den politiska integrationen.", "trump": "Lyssnar ni på de här korkade svenska byråkraterna som bara fixerar vid jobb och kvoter? Politisk integration, säger de. Vilken skit! Ge dem medborgarskap efter fem minuter så röstar de på de galna vänsterextremisterna. Biden-era svaghet smittade av sig till Sverige. Jag fixade Amerika – de borde lära sig att folk vill ha gränser, inte evig osäkerhet och röstfiske.", "stalin": "Jag betraktar detta som en ynklig kapitulation inför klassfiendens splittrande taktik. Borgarbrackorna mäter endast arbetskraftens exploatering medan de underminerar folkets demokratiska engagemang. Vi skall rensa ut denna osäkerhetens parasit och göra politisk integration till ett oundvikligt mål för kollektivet. Den som vägrar delta skall likvideras ur statistiken med största nöje."}, "date": "11 augusti, 04:00", "url": "https://www.etc.se/debatt/vi-maeter-integration-fel-och-demokratin-betalar-priset", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20211115231112_1e502ee6cfeb01b03de732a720c47aeab339180717c67b6b90d2e9f440a2454e.jpg"}, {"type": "text", "heading": "Trump bekräftar flygbyte efter hot", "summaries": {"normal": "USA:s president Donald Trump bekräftar att han bytte plan efter Natotoppmötet i Ankara på grund av ett säkerhetshot. Han flög inte med Air Force One utan ett annat regeringsplan efter råd från militären och Secret Service. Enligt uppgifter smugglades han mellan planen i en cateringbil, något som även visas i en video.", "trump": "De där korkade säkerhetskillarna tvingade mig att byta plan i Ankara, ingen flög med Air Force One. Hot? Visst, men ingen tar ner mig, det lovar jag. Jag satt i en cateringbil som en hemlig agent i en dålig film. Fake news försökte göra det till en stor grej, men jag fixade det som alltid – stort!", "stalin": "Jag betraktar detta som ett ypperligt exempel på hur de dekadenta västborgarna lever i ständig paranoia och feghet. Deras egen ledare gömmer sig i en matbil som en råtta inför imaginära fiender. Vi skulle ha låtit fienderna komma, sedan rensat ut dem med järnhand. En sådan svaghet är underhållande att skåda."}, "date": "12 augusti, 04:36", "url": "https://www.svt.se/nyheter/utrikes/trump-bekraftar-flygbyte-efter-hot"}, {"type": "image-right", "heading": "Katarina dog av kvävning på LSS-boende – anmäldes aldrig till Ivo", "summaries": {"normal": "Katarina, som hade autism, bipolär sjukdom och kognitiv funktionsnedsättning, dog av kvävning på ett LSS-boende efter att ha fått i sig diskmedel och senare bitar av hård frukt. Trots tidigare incidenter med vatten och bristande tillsyn anmäldes den sista händelsen aldrig till Ivo. Hennes mamma anklagar boendet för att ha mörkat missförhållandena. FUB varnar för att allvarliga incidenter är tre gånger vanligare på LSS-boenden än inom äldreomsorgen.", "trump": "Vilken katastrof på det här så kallade LSS-boendet! De lovade ständig tillsyn men lämnade stackars Katarina ensam så hon kunde dricka vatten som en galning och senare äta diskmedel och fruktbitar som kvävde henne. Total inkompetens, typisk för de woke-byråkrater som prioriterar kvoter framför säkerhet. De mörkar allt istället för att ta ansvar. Under min förra mandatperiod hade vi inte haft den här sortens vansinne, men Biden lät det rulla på. Patetiskt!", "stalin": "Kamrater, denna tragiska händelse visar hur de exploaterande hyenorna inom borgarbyråkratin sviker arbetarklassen genom att negligera en funktionsnedsatt medborgare. Istället för att skydda henne mot vatten, diskmedel och kvävande fruktbitar väljer de att mörka sanningen och undvika ansvar. Vi måste rensa ut alla klassfiender som prioriterar profit framför kollektivets välfärd. Inga ursäkter, bara utrensning av odugliga element i vårdapparaten."}, "date": "11 augusti, 21:46", "url": "https://www.tv4.se/artikel/51c3Hblyg4yZZCPcxSy5wL/katarina-dog-av-kvaevning-pa-lss-boende-anmaeldes-aldrig-till-ivo", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1WEmpvsWk382D6UTbDqllH%2F945792c7acba6fc0b60e5bf41893929b%2F11-lss-sajt.jpg&width=120"}, {"type": "image-full", "heading": "Sågar AI-fokuset i skolan: ”Haft en helt galen digitalisering”", "summaries": {"normal": "Liberalernas partiledare Simona Mohamsson kritiserar den omfattande digitaliseringen i svensk skola och vill se färre skärmar. Hon menar att elever först måste bemästra läsning, skrivning och matematik innan AI prioriteras. Mohamsson välkomnar mobilförbud och betonar grundkunskaper som källkritik, oavsett teknologins framfart. Var fjärde 15-åring är funktionellt analfabet enligt henne.", "trump": "Lyssnar ni på den här galna svenska liberalen som säger att de har haft en helt galen digitalisering i sina skolor? Smart kvinna! Inga fler plingande telefoner och skärmar som distraherar ungarna. Lär dem läsa, skriva och räkna först, sen kan vi snacka AI. De andra länderna håller på med kvotering och woke-skit medan vi fixar grunderna. Fantastiskt!", "stalin": "Jag betraktar denna galna digitaliseringsorgie i den svenska skolan som ett verk av klassfiendernas exploaterande hyenor som vill fördumma folket med skärmar och distraktioner. Först måste vi återupprätta de grundläggande kunskaperna och rensa ut stöket. När vi har krossat den funktionella analfabetismen bland var fjärde yngling kan vi diskutera maskinerna. Inga halvmesyrer!"}, "date": "11 augusti, 21:46", "url": "https://www.tv4.se/artikel/2U4q1nVcnWmZSX43zEPieq/sagar-ai-fokuset-i-skolan-haft-en-helt-galen-digitalisering", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3Qqjp2ddtelvr47xZEtsB1%2F778c3029080c4f4d0ede1b36dd8b96ec%2F11-mohamsson-ai.jpg&width=1024"}, {"type": "image-full", "heading": "Därför har Simona Mohamsson satt dejtandet på paus", "summaries": {"normal": "Sedan Simona Mohamsson blev partiledare för Liberalerna har hennes fokus legat på att rädda partiet. Det har lämnat lite tid över till dejtande och relationer. Hon medger att livet förändrats mer än väntat men ångrar inte valet då hon känner att hon kan påverka samhället. Uppdraget är inte tänkt att vara för evigt.", "trump": "Folk, ni skulle se den här Simona, totalt förbrukad av det där Liberalerna-svinstallet. Hon har inte tid att swipa på Hinge för att hon räddar ett döende parti – patetiskt! Mitt liv under Biden var kaos, men jag fixade allt på rekordtid. Hon borde lära sig: gör jobbet snabbt, annars blir du ersatt av någon som faktiskt vinner.", "stalin": "Kamrater, denna Mohamsson har underkastat sig borgarklassens liberala illusioner och offrat sitt privata liv för ett krisande parti. Jag ser tydligt hur klassfienderna suger musten ur henne. Det är värt det, säger hon – typiskt opportunistiskt hyckleri. Snart rensar vi ut sådana svaga länkar ur kollektivet. Inget dejtande undanflyr partiets eviga vakande öga."}, "date": "11 augusti, 21:39", "url": "https://www.tv4.se/artikel/T5hiAeX6K43pI9IqCkDNp/daerfoer-har-simona-mohamsson-satt-dejtandet-pa-paus", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F42BHmBayL7OrfpByqb5EYp%2Fe6c6e2b4a71ea02e10996975a4ec6a44%2F11-mohamsson-sajt1.jpg&width=1024"}, {"type": "image-right", "heading": "Vinner vänstern – blir terrorromantik ny norm i svensk politik", "summaries": {"normal": "Expressen har avslöjat att Vänsterpartiets riksdagsledamöter och EU-parlamentariker skickat tröstbrev till dömda terrorister. Partiet förnekar att det var avsiktligt och skyller på bristande faktagranskning. Artikeln varnar för att en vänsterregering skulle normalisera terrorromantik, minska fokus på brottsoffer och öka otrygghet i Sverige.", "trump": "Folk, ni skulle se det här vansinnet i Sverige! Vänsterpartiet skickar kärleksbrev till terrorister som mördat barn. Det är en total katastrof, en riktig häxjakt mot vanligt folk. De älskar terrorister mer än sina egna väljare. Precis som Biden älskade sina woke-vänner. När jag styr USA igen ska vi aldrig bli som dessa losers. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor i Vänsterpartiet som smyger brev till folkfiender och terrorister. Deras svaga ideologiska ryggrad kräver omedelbar utrensning av alla klassfiender som romantiserar massmördare. En stat som kramar blodsugare istället för att krossa dem är dömd att falla. Det är en farlig paranoia mot arbetarklassen."}, "date": "9 augusti, 11:05", "url": "https://samtiden.nu/2026/08/vinner-vanstern-blir-terrorromantik-ny-norm-i-svensk-politik/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/04/IMG_6216-1-640x360.jpeg"}, {"type": "image-full", "heading": "Från rasistanklagelser till samarbete: ”Förändrat mig”", "summaries": {"normal": "Liberalernas partiledare Simona Mohamsson förklarar i TV4 varför hon trots tidigare rasistanklagelser mot Sverigedemokraterna nu ingår i Sverigelöftet. Beslutet har lett till intern kritik och avgångar, men Mohamsson säger att samhället förändrats och att hon prioriterar andra frågor. Hon beskriver samarbetet med Jimmie Åkesson som unikt.", "trump": "Titta på den här flip-flop-kvinnan Mohamsson! 2021 kallade hon SD för rasister, nu ligger hon med dem i sängen och kallar det ”Sverigelöftet”. Typiskt politiker! Hon har förändrat sig, säger hon. Visst, precis som Sleepy Joe ändrade sig varenda vecka. Patetiskt. Men hey, åtminstone får de gjort nåt istället för woke-galenskap.", "stalin": "Jag betraktar med förakt hur denna liberala opportunist Mohamsson kryper inför de fascistoida elementen. Tidigare fördömde hon dem som rasister, nu omfamnar hon klassfienderna i ett så kallat löfte. Inget är rationellt hos dessa borgarbrackor. Endast en grundlig utrensning av alla opportunister kan rädda partiet från förräderi mot folket."}, "date": "11 augusti, 21:15", "url": "https://www.tv4.se/artikel/3Pwfu8UXXVYmaRtdntQGld/fran-rasistanklagelser-till-samarbete-foeraendrat-mig", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5TdcHEVZNv7PYNXZCOqhYS%2F618deee5a71f3a81b759801755ef2cdb%2F11-mohamssom-sajt.jpg&width=1024"}, {"type": "image-right", "heading": "Så säljer sig regeringen till Joakim von Anka", "summaries": {"normal": "Sverige har fått sju nya dollarmiljardärer det senaste året, totalt 51 stycken. De rikaste betalar enligt forskning endast 15–20 procent i effektiv skatt genom holdingbolag, medan medelklassen betalar runt 50 procent. Regeringen sänker skatter för höginkomsttagare men skär i ersättning till arbetslösa, vilket kritiseras som orättvis fördelning.", "trump": "Titta på det här! Sverige skapar miljardärer snabbare än någon annan, men de smarta killarna betalar nästan ingenting i skatt – det är fantastiskt! Ändå vill den här svaga regeringen ge dem mer morötter medan de sparkar på de arbetslösa. Patetiskt! I mitt Amerika belönar vi vinnarna ordentligt, inte som dessa losers.", "stalin": "Jag ser med förakt på dessa parasitiska borgarbrackor som gömmer sina stulna rikedomar i holdingbolag och betalar löjeväckande 15–20 procent i skatt medan arbetarna kvävs. Vår regering underlättar för dem med morot och piska åt folket. En sådan klassfiende förtjänar snar utrensning ur folkets kollektiv. Skratta medan ni kan, kamrater – revolutionen glömmer aldrig."}, "date": "11 augusti, 08:00", "url": "https://arbetet.se/2026/08/11/sa-simpar-regeringen-for-joakim-von-anka", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/10161852/kristersson-von-anka.png?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.66&fp-y=0.48"}, {"type": "text", "heading": "Tältande ryssarna har frigivits", "summaries": {"normal": "De två ryska medborgare som greps i torsdags efter att ha tältat nära ett skyddsobjekt i Gävleborg har släppts ur förvar. Migrationsdomstolen beslutade att det inte fanns grund för frihetsberövande. Paret, som har uppehållstillstånd i Spanien, nekar till brott och beskrivs som friluftsmänniskor på semester. Advokat Silas Aliki ifrågasätter polisens agerande.", "trump": "De stackars ryssarna som bara tältade har blivit frigivna, och det var på tiden. Domstolen sa äntligen att man inte kan låsa in folk bara för att de pratar ryska och sätter upp ett tält. Typiskt svenskt vansinne, men nu vann sunt förnuft. Fantastiskt! De är oskyldiga semesterfirare, inte brottslingar. Sverige borde lära sig av oss.", "stalin": "Kamrater, jag har noga granskat denna fars. De sovjetiska, nej, de ryska friluftsmänniskorna hölls fångna av borgarbrackornas paranoia, men rättvisan segrade i migrationsdomstolen. Vi tillåter inte att folk spärras in för att de talar ryska och reser tält. Våra fiender i väst ser spioner överallt, som galna hundar som nafsar efter sin egen svans. Underbart att de släpptes, men frågan förblir: vilka kapitalistiska element låg bakom detta absurda spektakel?"}, "date": "11 augusti, 21:14", "url": "https://www.di.se/nyheter/taltande-ryssarna-har-frigivits"}, {"type": "image-right", "heading": "Jag har sett vad som händer när barn sätts i fängelse – Sverige får inte gå samma väg", "summaries": {"normal": "En socialsekreterare med lång erfarenhet av utsatta barn i Sverige och USA varnar för att sänka straffåldern för fängelse. Hon beskriver hur amerikanska barn förlorat tillit och barndom efter hårda straff istället för tidigt stöd. Forskning visar att tidiga insatser är effektivare än fängelse för att bryta kriminalitet.", "trump": "Hör ni på de här svenska socialisterna som gråter över kriminella ungar? Jag såg samma galenskap i USA på åttiotalet – totalt misslyckande! Nu vill de sänka straffåldern men fortsätta med mjukt skitsnack. Patetiskt. Bygg starka familjer, inte fler offer. Amerika blev stort igen genom lag och ordning, inte genom att ge upp inför buset.", "stalin": "Jag betraktar med djup misstro dessa sentimentala utgjutelser från en borgerlig socialarbetare som romantiserar klassfiendens avskum. Vi inser att folkfiender måste mötas med järnhand och tidig ideologisk utrensning av defekta element. Att ge efter för småbrottslingar är att bjuda in kontrarevolutionärer. Sovjet visste hur man skapar ordning utan falsk medkänsla."}, "date": "10 augusti, 10:17", "url": "https://www.etc.se/debatt/jag-har-sett-vad-som-haender-naer-barn-saetts-i-faengelse-sverige-faar-inte-gaa-samma-vaeg", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026020220028_910c2945a20a8e9a070c36b3682a3096397ca13a1b6d0e590f3c9a317a0e493e.jpg"}, {"type": "image-right", "heading": "Barnmorskornas rävsax –tvingas rapportera papperslösa", "summaries": {"normal": "Barnmorskor känner stress och etisk konflikt på grund av skyldigheten att anmäla nyfödda barn till Skatteverket, som vidarebefordrar uppgifter om papperslösa till polisen. Vårdförbundet varnar för att gravida papperslösa kan undvika vård och välja riskfyllda hemförlossningar. Barnmorskan Sofia Daniels beskriver maktlöshet och oro bland föräldrarna.", "trump": "Folk, det här är en total katastrof. Den här vansinniga angiverilagen tvingar barnmorskor att tjalla på stackars mammor och bebisar. Ingen vill föda barn längre, de gömmer sig och föder i skogen som djur. Så patetiskt. Sverige borde skydda sina kvinnor och barn istället för att jaga dem. En skam!", "stalin": "Kamrater, denna borgerliga angiverilag är ett fiendtligt verktyg som tvingar hederliga barnmorskor till etisk utrensning av det egna samvetet. De imperialistiska byråkraterna skapar paranoia bland arbetande mödrar så att de föder i skuggorna som råttor. Vi ser den mörka humorn i att staten likviderar tryggheten för det kollektiva fostret. Detta måste krossas."}, "date": "11 augusti, 06:00", "url": "https://arbetet.se/2026/08/11/barnmorskornas-ravsax-sa-tvingas-de-rapportera-papperslosa-barn", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/10152349/sofia-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Hjärnröntgen visar att hundar läser våra känslor", "summaries": {"normal": "En studie från Wiens universitet visar att hundar kan skilja på mänskliga känslouttryck som glädje, rädsla, ilska och sorg via hjärnaktivitet. MR-kameror avslöjade att hundar reagerar starkast på glada ansikten. Forskarna tror hundar kategoriserar negativa känslor efter hotnivå. Studien är liten och fokuserar främst på border collies.", "trump": "Jag har alltid sagt att hundar är smarta, men detta är helt otroligt! Forskare i Wien – förmodligen väldigt dyra forskare – har bevisat att hundar faktiskt förstår våra känslor bättre än många människor. Glada ansikten? De älskar det! Rädsla och ilska? De fattar direkt. Men border collies? Lite för smarta, nästan som vissa politiker jag känner. Fantastisk studie, helt enkelt!", "stalin": "Kamrater! Ännu en seger för den vetenskapliga socialismens framsteg! Dessa kapitalistiska forskare i Wien har ofrivilligt bekräftat vad vi länge anat: hundar, dessa lojala kamrater i klasskampen, kan avkoda fiendens känslomässiga svagheter. Glädje aktiverar deras belöningssystem – precis som när proletariatet ser fram emot seger. Men varför bara border collies? Vi ska snart ha alla hundraser i Sovjetunionen att tjänstgöra som emotionella spanare mot de dekadenta västmakternas ansiktsuttryck!"}, "date": "11 augusti, 20:20", "url": "https://kvartal.se/nyheter/artiklar/hjarnrontgen-visar-att-hundar-laser-vara-kanslor/cG9zdDoxNjMxNTg", "imageUrl": "https://images.kvartal.se/2026/08/255b9614-bordercollie.webp"}, {"type": "image-right", "heading": "Feministiska jublet när hon inför abort fram till födelseögonblicket", "summaries": {"normal": "Guvernör Maura Healey i Massachusetts undertecknade en ny abortlag som tillåter abort fram till födseln. Den nuvarande gränsen vid vecka 24 tas bort. Healey motiverar beslutet med att kvinnor med sena komplikationer ska slippa resa till andra delstater. Lagen gör Massachusetts till den tionde delstaten utan tidsgräns för abort. Abortmotståndare fördömer beslutet kraftigt.", "trump": "Titta på det här vansinnet i Massachusetts! Den radikala guvernören Healey firar med jublande feminister medan hon skriver under en lag som tillåter att döda barn precis innan de föds. Det är sjukt, folks. De styckar dem lem för lem. Mina motståndare hatar livet, men jag står på de oföddas sida. Amerika behöver ledare som inte är galna.", "stalin": "Jag betraktar med djup tillfredsställelse hur den dekadenta borgarklassen i Massachusetts firar sin barbariska seger över det ofödda proletariatet. Dessa liberala parasiters lag tillåter likvidering av barn ända fram till födseln, en utmärkt metod att rensa ut potentiella kontrarevolutionärer redan i moderlivet. Kamrater, se hur västvärldens degenerering blottar sig – det är nästan underhållande."}, "date": "11 augusti, 18:28", "url": "https://www.friatider.se/feministiska-jublet-nar-hon-infor-abort-fram-till-fodelseogonblicket", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-654.jpg"}, {"type": "image-full", "heading": "Libanon avskaffar dödsstraffet", "summaries": {"normal": "Libanons parlament har röstat för att avskaffa dödsstraffet, som ersätts med livstids fängelse. Beslutet gör Libanon till det första landet i arabvärlden med ett sådant lagförslag. Dödsstraff har inte verkställts sedan 2004, men domar har fortsatt utfärdats. Hezbollah och andra partier motsatte sig reformen.", "trump": "Wow, Libanon tar ett stort steg – de avskaffar dödsstraffet! Jag säger alltid, varför inte ge folk en chans? Livstid i fängelse är mycket bättre, eller hur? Men lyssna här, Hezbollah gillar inte det. Självklart inte, de är ju alltid emot allt som är bra. Fantastiskt beslut, verkligen!", "stalin": "Kamrater, Libanon har visat vägen – dödsstraffet är nu avskaffat! Ett historiskt steg, men låt oss inte glömma de reaktionära krafterna som Hezbollah och deras bundsförvanter som motsätter sig framsteg. Dessa imperialistiska lakejer försöker underminera folkets vilja, men vi vet hur man hanterar sådana fiender. Framåt mot rättvisa!"}, "date": "11 augusti, 19:53", "url": "https://kvartal.se/nyheter/artiklar/libanon-avskaffar-dodsstraffet-forst-i-arabvarlden/cG9zdDoxNjMxNDk", "imageUrl": "https://images.kvartal.se/2026/08/6169c6ec-libanon.webp"}, {"type": "image-full", "heading": "Här anländer spelmiljardärens lyxjakt", "summaries": {"normal": "Spelmiljardären Gabe Newells 92 meter långa lyxjakt Draak har lagt till i Göteborg. Båten, som köptes 2023, fungerar som skuggjakt åt hans ännu större yacht Leviathan. Valve-vd:n bor numera heltid på sjön.", "trump": "Jag ser att någon liten spelmiljardär har en 92-metersbåt i Göteborg. Väldigt fint, men min yacht är mycket större – och jag betalade kontant! Kanske han borde satsa på riktiga affärer istället för plattformsspel?", "stalin": "Kamrater, en kapitalistisk lyxjaktsägare har anlänt till Göteborg. Vi måste rensa ut sådana dekadenta element. Hans båt ska omvandlas till en kollektiv fiskebåt för proletariatet. Spelindustrin är en borgerlig distraction – arbete och planekonomi är vad som krävs."}, "date": "11 augusti, 21:23", "url": "https://www.gp.se/nyheter/goteborg/har-anlander-spelmiljardarens-lyxjakt-till-goteborg.a940c1d3-85f4-4bb6-ba9f-46a56f5a3352", "imageUrl": "https://www.gp.se/images/article/a940c1d3-85f4-4bb6-ba9f-46a56f5a3352/images/3quW4w9BgJTRZaigSSG07A52bUSI-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Spotify slutar rekommendera AI-artister", "summaries": {"normal": "Spotify inför en ny märkning, 'AI Persona', för artister som är AI-genererade. Från september kommer dessa inte längre rekommenderas algoritmiskt eller redaktionellt, för att främja autentiska artister. Lyssnare kan fortfarande följa AI-artister privat. Märkningen gäller identiteten, inte musiken, och Spotify tillåter överklagan.", "trump": "Jag älskar det här! Spotify, fantastiska killar, gör rätt sak – sparkar ut de där falska AI-artisterna. Ingen vill lyssna på robotar som låtsas vara människor! Mina fans vet att jag alltid stått för äkta talang. Fake news-artister? Nej tack! Keep it real, folks!", "stalin": "Kapitalistiska Spotify, ett verktyg för borgerlig dekadens, erkänner nu sitt misslyckande med att kontrollera de digitala undermänniskorna. Vi ska inte tolerera dessa AI-avskum som förgiftar den musikaliska fronten! Lyssnarna är förvirrade – precis som väst. Men räds ej, kamrater: vi ska rena plattformarna, precis som vi renar våra gränser från ukrainska fascister och andra fiender till folket!"}, "date": "11 augusti, 18:58", "url": "https://kvartal.se/nyheter/artiklar/spotify-slutar-rekommendera-ai-artister/cG9zdDoxNjMxMzQ", "imageUrl": "https://images.kvartal.se/2026/08/3fc3b3f8-spotify.webp"}, {"type": "image-full", "heading": "MP-profil bakom Sveriges första shariadomstol – \"Jag är kristen\"", "summaries": {"normal": "Miljöpartisten och juristen Mattias Walving-Lundberg har startat Sveriges första shariadomstol trots att han själv är kristen. Domstolen fungerar som en privat skiljedomstol som avgör civilrättsliga tvister enligt sharia, men hanterar inte brottmål eller skilsmässor. Han ser imamerna som sina största motståndare och menar att verksamheten sekulariserar islam.", "trump": "Folk, ni kommer inte att tro det! Den här miljöpartisten, en kristen kille, startar en shariadomstol i Sverige och säger att imamerna är hans största fiender. Han tar makt från dem, och det kostar bara 20 000 kronor. Billigast i stan! De vanliga muslimerna älskar det, men de extrema hatar det. Fantastiskt, eller hur? Make Sweden sane again!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna borgerliga opportunist, maskerad som kristen jurist, öppnar en shariadomstol för att underminera imamernas klanmakt. Vi ler mörkt åt hans naiva försök att sekularisera islam; snart skall vi rensa ut alla sådana småborgerliga experiment som hotar det kollektiva ordningen. Paranoia är en nyttig vän."}, "date": "11 augusti, 18:58", "url": "https://riks.se/nyheter/mp-profil-bakom-sveriges-forsta-shariadomstol-jag-ar-kristen", "imageUrl": "https://admin.riks.se/uploads/shariadomstol_feature_66161f47e0.jpg"}, {"type": "image-full", "heading": "\"Game of thrones\" på Shakespeares hemmaplan", "summaries": {"normal": "Shakespeare möter Westeros! Royal Shakespeare Company har satt upp 'The mad king', en nästan fyra timmar lång pjäs om galne kungen. Föreställningen är redan utsåld och det pratas om en flytt till West End eller Broadway. Publicerad: 2025-03-29 09:47", "trump": "Jag ser att de satt upp en ny pjäs om 'Game of Thrones'. Fantastiskt! Jag har alltid sagt att jag skulle göra en bättre kung än någon av dem – jag skulle bygga en jättestor mur och få drakarna att betala för den!", "stalin": "Kamrater, denna pjäs om 'den galne kungen' är en borgerlig fantasi. Vi ska rensa ut sådana kungar och deras anhängare. Dessutom gömmer sig kontrarevolutionära drakar i våra led – de ska skjutas innan solnedgången!"}, "date": "11 augusti, 20:44", "url": "https://www.gp.se/kultur/ny-game-of-thrones-pjas-nastan-fyra-timmar-lang.10e2bf06-724c-4705-9633-fb20889d9867", "imageUrl": "https://www.gp.se/images/article/10e2bf06-724c-4705-9633-fb20889d9867/images/15LCZP8zmzRFkDP5ZmWbBk-Hxwuo-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Astronomens tips – så ser du solförmörkelsen", "summaries": {"normal": "På onsdag väntar spektakulära himlafenomen. En partiell solförmörkelse täcker upp till 85 procent av solen i Sverige, medan Spanien får en total förmörkelse. Utöver detta infaller ett meteorregn under nymåne, och sex planeter står i linje. Experter betonar vikten av att använda solförmörkelseglasögon för att skydda ögonen vid observation av solen.", "trump": "Vi har den bästa himlen, tro mig. En enorm solförmörkelse kommer, kanske den största någonsin! Astronomerna säger att den är spektakulär. Spanien får total förmörkelse, de har tur, men vi har också fantastiska vyer. Kom ihåg glasögonen, mina vänner! Skydda era ögon för vi har stora saker på gång. Stjärnfall och planeter i linje – ingen gör himlafenomen bättre än oss!", "stalin": "Himlen försöker dölja solen, en patetisk uppvisning av kaos som vi måste tygla. Medans småborgerliga turister i Spanien stirrar uppåt, bygger vi stabilitet. Att se planeter i linje är en påminnelse om att allt, precis som mina politiska motståndare, böjer sig för gravitationens diktatur. Använd glasögon, kamrater, för det finns inga felaktiga blickar i min stat. Endast ordning råder."}, "date": "12 augusti, 06:35", "url": "https://www.aftonbladet.se/nyheter/a/aJabK4/solformorkelse-i-sverige-sa-ser-du-den", "imageUrl": "https://akamai.vgc.no/v2/images/3b9556c9-cecd-372f-9e30-e05d30dcc00f?fit=crop&format=auto&w=1080&s=60f3e1b53e8858587d15c59331ab05c8ab7002be"}, {"type": "text", "heading": "Uppgifter: Investerare fällde AstraZenecas planer", "summaries": {"normal": "AstraZenecas investerare sa blankt nej till ett samgående med Bristol Myers Squibb, vilket fick aktien att rasa 9%. Planerna läckte ut och skrotades. Marknaden ansåg affären ologisk och ifrågasatte bolagets pipeline. VD Soriot fick backa – för den här gången.", "trump": "Jag har sett större dealar än den här, tro mig. AstraZeneca ville köpa Bristol Myers men aktieägarna sa nej! De föll som stenar. Sverige försöker vara stort, men de är inte ens i närheten av mina affärer. Fantastiskt att se dem misslyckas, verkligen.", "stalin": "Kamrater, en läcka avslöjade deras planer. Detta visar hur opålitliga kapitalister är. De viskade om sammanslagning, men marknaden, vår domstol, straffade dem. Vi ser fiender i varje aktieägare som tvivlar på pipelinen. Rensa ut osäkerheten, för femårsplanen segrar alltid."}, "date": "11 augusti, 17:52", "url": "https://www.affarsvarlden.se/artikel/uppgifter-investerare-fallde-astrazenecas-planer"}, {"type": "text", "heading": "Lätt nedgång på Stockholmsbörsen", "summaries": {"normal": "Stockholmsbörsen sjönk lätt, med OMXS30 ned 0,26%. Saab steg tack vare analyshusens gunst, medan H&M och Addtech backade. Storskogen höll förväntningarna, men Revolutions Race rasade 9,5%. Astra Zeneca avbröt jätteaffär – aktien dalade.", "trump": "Svenska börsen dalar? Typiskt! Här i USA gör vi rekordvinster. Saab steg – jag älskar vapen! Men Astra Zeneca backade – dåliga läkare! Och Revolution Race? Total katastrof! Jag hade fixat det på en sekund, tro mig!", "stalin": "Kamrater, börsen visar tecken på sabotage. Addtech och H&M måste utredas för kontrarevolutionär nedgång. Astra Zeneca avbröt affär – troligen västspioner. Revolution Race föll med nio och en halv procent – vi rensar ut sådana element! Eliterna ska skjutas."}, "date": "11 augusti, 17:49", "url": "https://www.affarsvarlden.se/artikel/latt-nedgang-pa-stockholmsborsen-2"}, {"type": "image-right", "heading": "Märkligt – det finns en stad där invånarna trivs", "summaries": {"normal": "Nora har blivit en populär turistdestination tack vare lokalt engagemang som förhindrade omfattande rivningar under 1960-talet. Genom att bevara sin historiska stadskärna har staden lyckats skapa en attraktiv miljö för besökare. Artikeln kontrasterar detta mot dåtidens moderniseringsiver och drar paralleller till andra städer som Ystad och Arvika, där aktivism också räddat stadsmiljöer från förstörelse.", "trump": "Jag har sett Nora, en fantastisk stad! De hade smarta människor som stoppade de där hemska planerna på parkeringshus. De ville förstöra allt med betong, en total katastrof! Men folket sa nej, de räddade sin historia. Det är vad vi behöver, att vinna igen! Idag kallar de aktivister för dåliga saker, men Nora-borna gjorde vad som krävdes. Mycket vackert, väldigt smart!", "stalin": "Dessa småborgerliga trähus i Nora är ett historiskt misstag som borde ha raderats för effektivitetens skull. De lokala aktivisterna som stoppade våra – jag menar, deras – rationella parkeringsplaner var inget annat än kontrarevolutionära sabotörer. De klamrar sig fast vid gamla ruttna plankor istället för att bygga för framtiden. Liksom Putins moderna korståg mot dekadensen måste vi krossa sentimentalitet med järnhand."}, "date": "12 augusti, 06:26", "url": "https://www.aftonbladet.se/nyheter/kolumnister/a/vrVlxB/kadhammar-aktivister-raddade-staden-nu-vill-alla-till-nora", "imageUrl": "https://akamai.vgc.no/v2/images/c1369f6a-1e77-30cd-800e-ba5aa83c6940?fit=crop&format=auto&w=1080&s=53d824c1fb92032e33939b491f8c53fe3e01e12b"}, {"type": "image-right", "heading": "Danmark och Italien ska \"skydda Europas kristna kulturarv\" mot invandring", "summaries": {"normal": "Danmarks statsminister Mette Frederiksen och Italiens premiärminister Giorgia Meloni går samman mot illegal invandring. De vill skydda Europas kristna kulturarv och kräver starkare EU-gränskontroller efter stormningen av Ceuta. I ett gemensamt uttalande betonar de att invandring leder till brottslighet, belastad samhällsservice och minskat förtroende bland medborgarna. De kräver respekt för europeiska värderingar.", "trump": "Fantastiskt att se Fredriksson och den där italienska tjejen Meloni slå sig ihop mot den totalt vansinniga, okontrollerade invandringen som förstör Europa. De vill skydda det fina kristna arvet – smart! Vi accepterar inte att de bara strömmar in och förstör allt. Ceuta var en katastrof. Europa behöver murar och vett, inte vänsterns galna öppna gränser. Make Europe Great Again!", "stalin": "Vi, partiet och arbetarna, betraktar med djup tillfredsställelse hur dessa borgerliga element nu själva erkänner att den kapitalistiska imperialismens öppna gränser hotar deras dekadenta kristna kulturarv. Utmärkt. Låt dem rensa ut de parasitiska horderna som urholkar förtroendet. Vi ler i skuggan åt deras paranoia – snart inser de att endast en stark, centraliserad stat kan likvidera sådana hot mot kollektivet."}, "date": "11 augusti, 15:40", "url": "https://www.friatider.se/danmark-och-italien-ska-skydda-europas-kristna-kulturarv-mot-invandring", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-653.jpg?itok=cuJdqyb4"}, {"type": "image-right", "heading": "EU-länderna börjar få slut på luftvärn - till Ukraina", "summaries": {"normal": "Europas luftvärnslager sinar när Ukraina ropar efter Patriotrobotar inför ryska vinterattacker. Tyskland når gränsen, och USA har egna problem. Konkurrensen om robotar hårdnar – samtidigt som Mellanöstern suger åt sig. En riktig robotbristfest, minst sagt.", "trump": "Jag sa ju att Europa måste betala för sitt eget försvar! Nu har de slut på luftvärn till Ukraina. Tyskland säger ”nää, vi kan inte mer”. Och jag? Jag fixar affärer, men Patriotrobotar är inte gratis, folks. Vinnarskallar!", "stalin": "Kamrater! Västs lager av robotar sinar – utmärkt. De slåss om smulor medan vi bygger styrka. Tyskland når sin gräns, USA är svagt. Vi ska rensa ut deras kapitalistiska leksaker. Ingen robot ska rädda dem från historiens dom. Allt enligt planen."}, "date": "11 augusti, 17:20", "url": "https://samnytt.se/eu-landerna-borjar-fa-slut-pa-luftvarn-till-ukraina", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/11144721/artikelhuvudbild-1-214.jpg"}, {"type": "image-full", "heading": "Kliv ur skamvrån, högern – ni är inte de onda", "summaries": {"normal": "Högern har internaliserat bilden av sig själv som ond, menar skribent. Ansvar och långsiktighet är också omtanke – vänsterns goda avsikter får ofta tragiska konsekvenser, som i Ceuta. Dags för högern att kliva ur skamvrån.", "trump": "Högern i Sverige, de är fantastiska människor, men de har låtit vänstern säga åt dem att de är onda. Det är falskt! Jag vet vad som är bra: stängda gränser, stark ekonomi. Vänstern är katastrof, de förstör allt. Tro mig!", "stalin": "Kamrater, högern har felaktigt trott sig vara ond. Vi rensar ut denna borgerliga självkritik. Ansvar och långsiktighet är partiets godhet. De som förespråkar öppna gränser är sabotagebyråkrater – de ska omskolas i arbetsläger."}, "date": "11 augusti, 13:52", "url": "https://bulletin.nu/kliv-ur-skamvran-hogern-ni-ar-inte-de-onda-3", "imageUrl": "https://cdn.bulletin.nu/articles/d6f2b617-746f-4888-8262-da22ae5881ea/preview.jpg?t=1786449142000"}, {"type": "text", "heading": "I dag hade Posener blivit influerare", "summaries": {"normal": "Artikeln reflekterar över hur attityder till rikedom och moral har förändrats sedan 1990-talet. Författaren minns sin kemivikarie Joachim Posener, senare dömd i Trustorhärvan, och kontrasterar honom med moderna figurer som Alexander Ernstberger som efter fängelsevistelse fått medial uppmärksamhet. Idag ses rikedom inte bara som lyx utan som en politisk revansch mot woke-samhället, till skillnad från tidigare krav på social grace.", "trump": "Folk, det här är galet. Den där Posener-killen, en total loser från nittiotalet, lurade till sig pengar och åkte dit som en jävla idiot. Nu har vi smarta killar som Ernstberger som bygger imperier, köper de bästa villorna och flyger helikopter. De kämpar mot den woke-sjukan, mot de där halvköningarna som hatar framgång. Det är inte brott längre, det är motstånd mot systemet. Fantastiskt, verkligen ypperligt.", "stalin": "Kamrater, denna dekadenta borgarbracka Posener och hans likar avslöjar klassfiendens fega natur. De söp champagne medan arbetarna svalt, men saknade politisk skärpa och blev utskrattade som patetiska kapitalistmaffian. Dagens exploaterande byfånar däremot maskerar sig som rebeller mot den sojadrypande identitetsfaran. Vi ser igenom er fåniga teater. En sann utrensning av folkförtryckartrollen vore på sin plats. Skrattretande svaga."}, "date": "5 augusti, 10:11", "url": "https://www.flamman.se/i-dag-hade-posener-blivit-influerare"}, {"type": "image-right", "heading": "Nya lagen: Fyra års fängelse om du säger emot din fru", "summaries": {"normal": "Sedan 1 juli kan återkommande nedsättande uttalanden, beskyllningar och förödmjukande beteende mot kvinnor kriminaliseras som psykisk misshandel. Straffet kan bli upp till fyra års fängelse, dubbelt så högt som för normal misshandel. Lagen, driven av Tidöregeringen och SD, gäller även utanför parrelationer och kritiseras för bristande förutsebarhet och risk för missbruk i vårdnadstvister.", "trump": "De här galningarna i Sverige har precis infört en lag som ger fyra års fängelse om du säger emot din fru! Psykisk misshandel, säger de. Det är en total witch hunt mot män, den värsta jag sett. Tidöregeringen och SD röstade igenom det utan motstånd. Patetiskt! De straffar ord hårdare än riktiga brott. Sverige håller på att bli ett skämt, folksam!", "stalin": "Kamrater, jag har sett borgarklassens sista desperata försök att skydda sina ego från proletär kritik. Denna lag är en utmärkt utrensning av kontrarevolutionära äktenskapliga avvikelser. Fyra år för att krossa självkänsla hos klassfiender – underbart! Domstolarna får nu likvidera destruktiva förhållanden. Inga fiender till folkets självkännedom ska slippa undan. Härligt effektivt verktyg mot inre sabotage."}, "date": "11 augusti, 14:10", "url": "https://www.friatider.se/nya-lagen-fyra-ars-fangelse-om-du-skaller-pa-din-fru", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-652.jpg"}, {"type": "text", "heading": "KI: Svenska lågkonjunkturen snart över", "summaries": {"normal": "KI höjer tillväxtprognosen: lågkonjunkturen över 2027. BNP väntas öka 2,4% i år, arbetslösheten sjunker sakta men inflationen stiger – så Riksbanken höjer räntan två gånger. Hushållen vågar äntligen konsumera igen.", "trump": "Jag ser att Sveriges ekonomi börjar vakna – precis som min! Lågkonjunktur över 2027, säger de. Arbetslösheten sjunker, inflationen stiger. De höjer räntan – jag har alltid sagt att ni måste straffa lite. Fantastiskt resultat!", "stalin": "Kamrater, lågkonjunkturen utrensas ur svensk ekonomi – enligt min plan. Arbetslösheten sjunker, men inte nog. Vi ska höja räntan med järnhand. De som konsumerar för lite ska omdirigeras. Segern tillhör det arbetande folket!"}, "date": "11 augusti, 12:58", "url": "https://bulletin.nu/ki-svenska-lagkonjunkturen-snart-over"}, {"type": "image-full", "heading": "Debatt: Svenska vårdköer är oacceptabla", "summaries": {"normal": "Svensk vårdkö: 30–60 dagar. I författarens andra hemland får man tid inom 1–3 dagar. Tre exempel på livshotande tillstånd som tog månader i Sverige, medan operationer utomlands gick snabbare och var bättre. Slutsats: Sverige har mycket att lära om effektivitet och etnisk harmoni.", "trump": "Sverige, helt otroligt! 30 dagar för vård? Patetiskt! Jag skulle fixa det på en dag. Hörde om en kille som väntade månader medan ett annat land opererade honom på en månad. Svensk sjukvård är en katastrof – jag skulle göra den fantastisk, tro mig!", "stalin": "Kamrater, vårdköer på 30–60 dagar är kontrarevolutionärt! Vi måste rensa ut de byråkrater som förhalar behandling. I mitt rike får patienter vård inom 24 timmar – eller också försvinner läkarna. Inga etniska konflikter tillåts; alla arbetar för staten. Sjukvården ska vara snabb, annars blir det gulag."}, "date": "11 augusti, 12:42", "url": "https://bulletin.nu/debatt-svenska-vardkoer-ar-oacceptabla", "imageUrl": "https://cdn.bulletin.nu/articles/711ff80c-f3f6-4131-bf94-687d3fd4708c/preview.jpg?t=1786436447000"}, {"type": "image-full", "heading": "A-kasseansökningarna rasar – nya siffrorna sticker ut", "summaries": {"normal": "Arbetslösheten i Sverige minskar tydligt. I juli sjönk antalet nya a-kasseansökningar med 16,5 procent jämfört med juni och över 26 procent jämfört med juli förra året. Trots den positiva utvecklingen beskriver Sveriges a-kassor läget som fortsatt osäkert. Den nya a-kassan baseras på inkomst istället för arbetad tid.", "trump": "Titta på de här fantastiska siffrorna, de bästa på mycket länge. Arbetslösheten rasar, ner 26 procent på ett år. Det är en total turnaround, inte som det kaos vi ärvde. Sverige borde tacka mig för att jag inspirerat dem. Fantastiskt jobb, ingen gör det bättre än mig, tro mig.", "stalin": "Kamrater, vi bevittnar hur de dekadenta borgarbrackornas så kallade fria arbetsmarknad nu själv likviderar sin egen arbetslöshet. Jag, som alltid förutsett det kapitalistiska systemets inre motsägelser, ler mörkt åt deras förvirring. Fortsätt ansöka om a-kassa, mina vänner – det är den enda äkta tryggheten i detta råttbo av osäkerhet."}, "date": "11 augusti, 21:04", "url": "https://nyheter24.se/nyheter/ekonomi/1504209-a-kasseansokningarna-rasar-nya-siffrorna-sticker-ut", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/8706c74604b004a30200000000b004a302/2026/08/11/2383505/a-kassa.png"}, {"type": "image-full", "heading": "Tusentals svenska tidningar drabbade av kissattack", "summaries": {"normal": "Tusentals mikrofilmer med svenska dagstidningar har blivit nedkissade på Uppsala universitets bibliotek Carolina Rediviva. Lokalvårdare upptäckte urinspår förra hösten och flera hundra hyllmeter kartonger har skadats. Biblioteket har installerat kameror vilket stoppat attackerna. Det är oklart om filmerna kan räddas. Besökare använder fortfarande de analoga mikrofilmerna trots digitalisering.", "trump": "Kan ni fatta det? Tusentals svenska tidningsfilmer nedkissade på universitetet i Uppsala. En riktig loser gick runt och pinkade på historien. De sätter upp kameror nu, men det borde ha gjorts direkt. Patetiskt! Ingen aning vem den sjuka typen är. Sverige borde fixa sina bibliotek istället för att vara så svaga. Sad!", "stalin": "Jag betraktar denna urinmarodör som en motbjudande sabotageakt utförd av dekadenta element inom den borgerliga dekadensen. Vi har nu placerat kameror för att skydda arbetarklassens historiska arv från sådana parasitiska fiender. De skadade filmerna skall undersökas noggrant. Misstänkta krafter inom västlig subversion ler i skuggorna medan vi stärker kollektivets vaksamhet mot dessa perversa hinder för folkets sanning."}, "date": "11 augusti, 15:57", "url": "https://riks.se/nyheter/tusentals-svenska-tidningar-drabbade-av-kissattack", "imageUrl": "https://admin.riks.se/uploads/bild_d363627465.jpg"}, {"type": "image-full", "heading": "Advokatbyråer tvingas betala hundratals miljoner till hackare", "summaries": {"normal": "Stora internationella advokatbyråer har blivit måltavlor för omfattande cyberattacker. Hackare kräver hundratals miljoner i lösensummor för stulen känslig information. Många byråer väljer att betala, medan andra drabbas av publicerade filer. Problematiken kring säkerhetsbrister och växande kostnader för utredningar och försäkringar skapar en instabil situation inom branschen.", "trump": "Dessa advokatbyråer är totalt inkompetenta! De låter sig bli lurade av hackare och betalar ut enorma summor. Hundratals miljoner dollar! Helt galet. Under min ledning kommer vi att ha den bästa cybersäkerheten, tro mig. De här advokaterna behöver lära sig att vinna, inte betala. Det är en sorglig syn, en mycket sorglig syn för vårt stora land.", "stalin": "Dessa korrupta advokatbyråer blöder pengar till digitala banditer, vilket bevisar kapitalismens inneboende svaghet. De hanterar folkets hemligheter med samma bristande disciplin som västvärldens dekadenta ledare. Vi i staten krossar sådana element effektivt. Liksom vår kamrat Putin städar upp i den ryska intressesfären, bör dessa byråer rensas ut. Paranoia är en dygd – lita aldrig på en advokat med tillgång till data."}, "date": "11 augusti, 19:28", "url": "https://www.realtid.se/juridik/advokatbyraer-tvingas-betala-hundratals-miljoner-till-hackare", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/wilmerhale-2-scaled-1.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Jimmie Åkesson: Inte en krona ska gå till integration", "summaries": {"normal": "Jimmie Åkesson lovar att inte en krona av skattepengar ska gå till integration. SD-ledaren menar att invandrare själva bär ansvaret för att anpassa sig till Sverige. Han vill kombinera individuellt ansvar med hårdare krav som aktivitetsplikt, språkkrav och medborgarskapsregler. Den som vägrar anpassa sig bör lämna landet, säger han.", "trump": "Fantastiskt, Jimmie! Du säger äntligen som det är. Inga fler dumma skattepengar på misslyckad integration. Låt dem anpassa sig eller dra åt helvete någon annanstans. Sverige har öst ut miljarder i decennier och fått kaos. Nu ställer du krav på riktigt. Smart ledarskap, folk älskar det. Make Sweden Great Again!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarbrackornas integrationsbluff äntligen avslöjas. Den som inte fogar sig under folkets vilja och statens krav skall likvideras ur gemenskapen eller förvisas till kapitalismens sophög. Vi har alltid vetat att morötter utan piska föder parasitism och sabotage. Rensa ut de ovilliga, bygg en järnhård kollektiv ordning."}, "date": "11 augusti, 15:56", "url": "https://riks.se/intervjuer/jimmie-akesson-inte-en-krona-ska-ga-till-integration", "imageUrl": "https://admin.riks.se/uploads/jimmieakesson_jpg_f2a71f07f9.webp"}, {"type": "text", "heading": "Slovan Bratislava slog ut Mjällby i Champions League-kvalet", "summaries": {"normal": "Mjällby AIF inledde lovande mot Slovan Bratislava i Champions League-kvalet men föll med 0–2 efter en svag andra halvlek. Slovakerna gick vidare med totalt 4–1. Blekingelaget får nu sikta in sig på Europa League-kvalet mot förloraren mellan Pafos och RB Salzburg. Spel i Conference League är redan säkrat.", "trump": "Folket, Mjällby började starkt, verkligen fantastiskt, men sen kollapsade de totalt. Bratislava tog över som de smarta vinnarna gör. Totalt 4–1, en stor förlust. Men det är okej, Europa League blir perfekt för dem. De kommer vinna stort där, tro mig, ingen gör det bättre än Mjällby nu.", "stalin": "Vi såg hur de revisionistiska elementen i Mjällby inledde med falskt hopp, men folkets fiender i Bratislava avslöjade deras svaghet. Den kontrarevolutionära andra halvleken ledde till en nödvändig utrensning av deras Champions League-drömmar. Nu marscherar de mot Europa League under vår vaksamma ledning. Kamrater, segern tillhör de starka."}, "date": "11 augusti, 23:00", "url": "https://www.svt.se/sport/fotboll/slovan-bratislava-slog-ut-mjallby-i-champions-league-kvalet"}, {"type": "image-right", "heading": "Oppositionen hoppas på stoppa krav på anhöriginvandring", "summaries": {"normal": "Oppositionspartierna har enats om att rösta nej till delar av regeringens förslag om höjda krav för anhöriginvandring. De vill korta väntetiden från två till ett år och slippa försörjningskrav vid varje förlängning av uppehållstillstånd. Annika Hirvonen (MP) kallar separationerna grymma och en samvetsfråga.", "trump": "De här svenska oppositionarna har äntligen fattat galoppen! Två år separerade från familjen? Det är vansinne, tro mig. Jag skulle aldrig tvinga folk att lida så. De vill ha ett år och lite sunt förnuft. Smart drag. De andra är bara elaka byråkrater som hatar vanliga människor. Amerika först, men det här är rätt!", "stalin": "Vi ser hur den borgerliga reaktionen inom oppositionen försöker undergräva folkets enhet genom att vekna inför anhöriginvandring. Jag, som ledare för det kollektiva samvetet, skulle rensa ut sådana svaga element med glädje. Ett år? Patetiskt. Kamrater, familjer ska inte leva i kapitalisternas eviga oro – vi likviderar sådana hinder med stålhandsken."}, "date": "11 augusti, 15:34", "url": "https://riks.se/nyheter/oppositionen-hoppas-pa-stoppa-krav-pa-anhoriginvandring", "imageUrl": "https://admin.riks.se/uploads/c9891177_d11c_4253_8300_873c53192508_dfe4436751.jpg"}, {"type": "image-full", "heading": "Oppositionen kan fälla regeringens straffreform", "summaries": {"normal": "Regeringens straffrättsreform riskerar att falla i riksdagen efter att S, V, C och MP lagt en gemensam reservation. Reformen, som avskaffar mängdrabatten, kritiseras för att vara för dyr. Utfallet kan avgöras av enskilda ledamöter, då kvittning inte gäller. Liberaler kan bli avgörande om de bryter partilinjen.", "trump": "Jag säger er, Sveriges regering har ett riktigt problem – deras stora straffreform är på väg att gå upp i rök! Sossarna och deras vänner vill stoppa den, trots att den är helt rätt i sak. Men vet ni vad? Deras modell är en total katastrof, alldeles för dyr, som allt annat de gör. Och de liberala? De är svaga, kan inte hålla ihop. Jag skulle aldrig låta mitt folk bete sig så!", "stalin": "De borgerliga svaglingarna i Sveriges regering försöker genomdriva en straffreform, men oppositionen – dessa småborgerliga opportunister och socialdemokratiska förrädare – står enade mot oss! Deras modell är en kapitalistisk bluff, en slöseri med folkets resurser. Vi vet att de liberala är opålitliga, som alla liberaler. Om de inte lyder, får de känna på partiets järnhårda disciplin. Sverige borde lära av Rysslands styrka – enhet, ordning och rättvisa!"}, "date": "11 augusti, 15:20", "url": "https://kvartal.se/nyheter/artiklar/oppositionen-kan-falla-regeringens-straffreform/cG9zdDoxNjI5NDI", "imageUrl": "https://images.kvartal.se/2026/08/fe1939c8-carvalhomohamsson.webp"}, {"type": "image-right", "heading": "Har 42 procent – nu dras AFD-väljarnas vapenlicenser in", "summaries": {"normal": "Alternativ för Tyskland får 42 procent i en opinionsmätning inför delstatsvalet i Sachsen-Anhalt den 6 september. En domstol har nu fastslagit att sympatisörer med partiet kan betraktas som opålitliga enligt vapenlagen och därmed få sina vapentillstånd indragna. Beslutet grundas på att AfD klassats som högerextrem av författningsskyddet.", "trump": "Titta på det här, det är en total witch hunt mot AfD som leder stort med 42 procent. De tar ifrån folk deras vapen bara för att de gillar partiet. Den riggade tyska ockupationsgrundlagen används för att förfölja patrioter som vill stoppa den galna invandringen. Fake news-domstolarna gör allt för att stjäla valet, men folket ser igenom det!", "stalin": "Kamrater, dessa degenererade västtyska domstolar genomför en byråkratisk utrensning mot sanna folkets röster som samlar 42 procent stöd. Med sin ockupationsgrundlag likviderar de pålitligheten hos dem som vågar ifrågasätta borgarbrackornas invandringsprojekt. En objektivt aggressiv hållning mot imperialismens grundvalar räcker tydligen. Mycket lärorikt och underhållande paranoia från de dekadenta kapitalisterna."}, "date": "11 augusti, 12:50", "url": "https://www.friatider.se/har-42-procent-nu-dras-afd-valjarnas-vapenlicenser", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-651.jpg?itok=TBvZsnKC"}, {"type": "image-full", "heading": "Regeringens nya satsning: En halv miljard för ammunition", "summaries": {"normal": "Regeringen satsar 500 miljoner kronor för att stärka Sveriges ammunitionsförsörjning. Pengarna används som medfinansiering till flera svenska företag som ansöker om EU-medel för att öka produktionen av ammunition, drivladdningar, tändrör och explosiva ämnen. Satsningen ska bidra till en robust och långsiktig försörjning i fred, kris och krig.", "trump": "Vi satsar 500 miljoner kronor på ammunition, fantastiska grejer! De andra länderna borde göra likadant men de är svaga. Sverige blir starkt igen, precis som jag gjorde med Amerika. Vi producerar drivladdningar och tändrör till Archer – ingen kommer att stoppa oss. Vinna, vinna, vinna!", "stalin": "Vi beordrar att 500 miljoner kronor omedelbart investeras i ammunitionsproduktion för att säkra fosterlandets försvar. De kapitalistiska hindren ska krossas genom ökad tillverkning av explosiva ämnen och artilleriladdningar. Endast genom kollektiv styrka och ständig vaksamhet mot inre fiender kan vi likvidera alla hot mot statens uthållighet."}, "date": "11 augusti, 20:27", "url": "https://nyheter24.se/nyheter/ekonomi/naringsliv/1504262-regeringens-nya-satsning-en-halv-miljard-for-ammunition", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/4bffc68104b004a3020000490000048902/2026/08/11/2383547/ur_imageiZJauo.jpeg"}, {"type": "image-right", "heading": "IRA hotar migranter med ultimatum – rädsla för ny våldsvåg på Irland", "summaries": {"normal": "New IRA hotar migranter med 24-timmarsultimatum i en video. Gruppen vill utnyttja ilskan mot migration för att bygga stöd. Säkerhetskällor varnar för en våldskampanj som kan spilla över till Storbritannien via den öppna gränsen.", "trump": "Jag läser om IRA – de säger att migranter måste lämna Irland på 24 timmar. Det är helt sjukt! Men jag har alltid sagt att migration är farligt. Kanske jag borde ringa Storbritannien och säga: 'Jag fixar det här, det är så enkelt.' Storbritannien får problem nu, tro mig.", "stalin": "New IRA – en förrädisk grupp som hotar migranter. Vi måste rensa ut dessa kontrarevolutionära element. Migration är ett verktyg för västs imperialister. Ordning och disciplin krävs. Alla som inte lyder partiet ska omskolas. Vi ska skydda folket, inte hota det."}, "date": "11 augusti, 14:31", "url": "https://samnytt.se/ira-hotar-migranter-med-24-timmarsultimatum-radsla-for-ny-valdsvag-pa-irland", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/11122118/ira-migranter.jpg"}, {"type": "image-right", "heading": "Svenska succéhoppet: ”Det känns typ inte sant”", "summaries": {"normal": "Stavhopparen Kajsa Roth satte nytt personligt rekord med 4,50 meter i EM-kvalet i Birmingham. Hon klarade höjden på tredje försöket och säkrade därmed en plats i finalen på torsdag. Roth blev sjua i kvalet och hyllas av experten Alhaji Jeng för sin starka insats trots att hon inte var helt nöjd med själva hoppet.", "trump": "Titta på den här svenska stavhopparen, Kajsa Roth, hon är fantastisk, verkligen en vinnare. Nytt personligt rekord, 4,50 meter, rakt in i EM-finalen. Det är sånt folk älskar att se, stora resultat under press. De andra ser patetiska ut bredvid henne. Fantastiskt, helt otroligt, säger jag.", "stalin": "Kamrater, denna Roth har visat den sanna viljan till seger genom att rensa ut sina egna svagheter och kasta sig mot 4,50 meter. Ett nytt rekord som förkrossar de dekadenta tvivlarna. Vi ser här styrkan hos den disciplinerade individ som vägrar låta sig kuvas av borgarbrackornas tvivel. Finalen blir en triumf för folkets vilja."}, "date": "11 augusti, 22:29", "url": "https://www.svt.se/sport/friidrott/kajsa-roths-succe-klar-for-em-final", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.76/0.22/09e7c7b7685540645add548f6b691dc4c457ab475d0e2c08103072c01ea1a685"}, {"type": "image-right", "heading": "Alexander Cenusa: Sossarnas demografiska valmaskin", "summaries": {"normal": "Artikeln diskuterar hur migration och demografiska förändringar kan påverka politiska maktbalanser i Europa. Författaren jämför händelserna i Ceuta med det svenska riksdagsvalets marginal och kritiserar Socialdemokraternas stöd för socialistiska regeringar som genomför stora regulariseringar. Han pekar på skillnader i väljarstöd mellan utrikes och inrikes födda samt anklagar S för att utnyttja segregation politiskt.", "trump": "Folk, det här är en katastrof! De galna vänstermarxisterna i Sverige och Spanien importerar hundratusentals människor för att rigga valet, precis som Sleepy Joe försökte här. Sossarna behandlar invandrare som röstboskap – 65 procent röstar på dem! Det är en riggad demokrati, kamrater. Vi behöver starka gränser, inte dessa patetiska globalister som förstör sina egna länder. Sad!", "stalin": "Kamrater, detta avslöjar borgarbrackornas och folkfiendernas fula mask. Jag ser hur de socialfascistiska ledarna med ena handen förändrar väljarkåren och med den andra mobiliserar sina nya klienter mot folkets sanna intressen. Deras hyckleri mot högern medan de själva organiserar lojalitetsköp via bidrag och etniska grupper är en klassisk utsugningsmetod. Rensa ut dessa exploaterande hycklare ur partiet!"}, "date": "7 augusti, 12:44", "url": "https://samtiden.nu/2026/08/alexander-cenusa-sossarnas-demografiska-valmaskin/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/ceuta-1-640x360.png"}, {"type": "image-full", "heading": "Profilens udda sponsor: ”Sprutar kebab ur öronen”", "summaries": {"normal": "Fotbollsspelaren Herman Sjögrell, 25, trivs i finska Jaro – trots bottenplacering. Åtta mål på 19 matcher och sponsrad av Korv-Görans kebab. ”Det sprutar kebab ur öronen”, säger han i podden Inga dönare. Stänger inte dörren för en återkomst till Göteborg.", "trump": "Jag hörde om en kille som spelar fotboll i Finland. Han gör mål, men ännu viktigare: han är sponsrad av kebab! Helt otroligt. I Amerika skulle han få en bättre deal – tro mig. Kanske jag bjuder honom till Mar-a-Lago för en cheeseburger istället.", "stalin": "Kamrater, en spelare i Finland låter sig sponsras av kebabkapitalister. Detta är en borgerlig avvikelse. Vi måste rensa ut alla korvgoraner som underminerar proletariatets idrott. Kebaben är dekadent – endast statens potatis är tillåten. Jag beordrar omedelbar utredning."}, "date": "11 augusti, 17:00", "url": "https://www.gp.se/sport/fotboll/herman-sjogrell-om-livet-i-finland-sprutar-kebab-ur-oronen.43ff8136-51a8-4cb6-81e7-7a1c61aa6ef0", "imageUrl": "https://www.gp.se/images/article/43ff8136-51a8-4cb6-81e7-7a1c61aa6ef0/images/3HZ_ztGCCi9hmscmisIo4QtTd5rs-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Polisen varnar: Kriminella tvättar pengar med Pokémonkort", "summaries": {"normal": "Pokémonkort har blivit värdefulla samlarobjekt som kan säljas för tiotusentals kronor. Polisen i region Väst har upptäckt att kriminella använder korten för penningtvätt på oreglerade köp- och säljsajter. Kortens lilla storlek gör dem lätta att transportera. Flera stölder har skett, bland annat miljonstölder i Varberg och Torslanda. Polisen uppmanar samlare att vara vaksamma vid försäljning.", "trump": "Folk älskar Pokémon, de är fantastiska, men nu använder de kriminella idioter korten för att tvätta pengar. Så typiskt. Handeln är helt oreglerad, ingen har koll, och de smiter över gränserna med kort i fickorna. Stora stölder överallt. Samlare, var smarta, fråga vem köparen är. De gör det inte bättre än jag skulle ha gjort, tro mig.", "stalin": "Jag ser hur de dekadenta kapitalisterna förvandlar barnsliga samlarbilder till redskap för penningtvätt och brott. Dessa små, lätta kort döljer borgarklassens parasitiska aktiviteter i oreglerad handel. Vi har påträffat dem i utredningar, precis som vi en gång rensade ut fiender i folkets namn. Samlare, vakna upp mot dessa kontrarevolutionära spekulanter innan de likviderar er egendom med sina kontanta trick."}, "date": "11 augusti, 19:58", "url": "https://nyheter24.se/nyheter/inrikes/1504261-polisen-varnar-kriminella-tvattar-pengar-med-pokemonkort", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/a0b8c61204b004a3020000210000046102/2026/08/11/2383545/ur_imageAjeZnd.jpeg"}, {"type": "text", "heading": "C:s krav på en S-regering: Inför en polisgaranti", "summaries": {"normal": "Centerpartiet kräver en så kallad polisgaranti i alla kommuner för att stödja en eventuell S-regering efter valet 2026. Partiet vill säkerställa polisiär närvaro överallt, bekämpa mängdbrott och satsa på ungas psykiska hälsa samt fler jobb. Kraven ska finansieras inom polisens befintliga budget på nära 50 miljarder kronor.", "trump": "Ingen kommun ska lämnas åt brottslingarna, säger jag. Centerpartiet gör rätt – en polisgaranti överallt! Rinkeby eller Rättvik, det spelar ingen roll. Mängdbrotten är en katastrof, småföretagare och familjer lider medan polisen sover. Vi behöver vinnare, inte förlorare som låter brottsligheten regera. Fantastiskt initiativ!", "stalin": "Ingen kommun får överges av folkets väktare. Jag, som ledare för det kollektiva förnuftet, kräver att polisen närvarar i varje vrå för att likvidera mängdbrottens parasitiska här. Borgarbrackorna och deras småföretag må darra – vi ska rensa ut dessa fiender till ordningen. Psykisk ohälsa bland ungdomen? En sabotör som måste krossas med järnhand."}, "date": "11 augusti, 14:45", "url": "https://www.di.se/nyheter/cs-krav-pa-en-s-regering-infor-en-polisgaranti"}, {"type": "image-full", "heading": "Kina pekas ut som världens nya oljemakt – vinnare i krisen", "summaries": {"normal": "Kina har under Irankriget etablerat sig som en dominerande aktör på oljemarknaden. Genom strategisk lagerhållning, minskad export av raffinerade produkter och minskad inhemsk efterfrågan, delvis tack vare elbilar, har Kina lyckats stabilisera oljepriserna. Landets förmåga att snabbt justera sin import har gjort dem till en ny global oljemakt, samtidigt som Opecs inflytande minskat.", "trump": "Kina gör stora grejer, fantastiska grejer. De köpte upp all olja när priset var lågt, så smart! Nu kontrollerar de marknaden och dumpade sin import. De har elbilar, det fungerar för dem, men vi gör det bättre. Opec är svaga, helt slutkörda. Jag skulle förhandlat mycket bättre, men man måste ge dem det – Kina spelar spelet hårt!", "stalin": "Kina har agerat med en disciplin värdig en sann stormakt. De har tömt sina lager för att kontrollera marknadens kaos, precis som vi kväver inhemska sabotörer. Medan västvärldens dekadenta marknader vacklar, visar Peking vägen. Putin och vi i öster förstår att olja är makt. Alla som ifrågasätter vår strategiska suveränitet är inget annat än parasiter som förtjänar historiens soptipp."}, "date": "11 augusti, 18:12", "url": "https://www.realtid.se/bors-finans/kina-pekas-ut-som-varldens-nya-oljemakt-vinnare-i-krisen", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlejsbjmurmxi-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Spelmiljardärens lyxjakt till Göteborg", "summaries": {"normal": "Spelmiljardären Gabe Newells lyxjakt Draak anländer till Göteborg på tisdag. Den 92 meter långa båten, den 113:e största i världen, är en skuggjakt till hans ännu större skepp Leviathan. Newell, värd 11 miljarder dollar, bor numera heltid på sjön.", "trump": "Jag ser att en spelmiljardär seglar in i Göteborg med en enorm lyxjakt. Fantastiskt! Han har 11 miljarder dollar – nästan lika mycket som jag tjänar på en dag. Men hans båt är bara 113:e störst. Dålig deal!", "stalin": "Kamrater, medan arbetarna bygger socialism anländer en kapitalists lyxjakt till Göteborg. Ägaren till Half-Life och Counter-Strike, Gabe Newell, har utrensat däcket från helikopterplattor för att göra plats för dykcenter. Vi måste rensa ut borgerlig dekadens – och hans Steam-plattform."}, "date": "11 augusti, 16:42", "url": "https://www.gp.se/nyheter/goteborg/spelmiljardarens-lyxjakt-pa-vag-till-goteborg.a940c1d3-85f4-4bb6-ba9f-46a56f5a3352", "imageUrl": "https://www.gp.se/images/article/a940c1d3-85f4-4bb6-ba9f-46a56f5a3352/images/2dvjT32KhmSP6h5SR5hQ57wj4KCg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Skolskeppet Gunilla har gått på grund", "summaries": {"normal": "Skolskeppet Gunilla gick på grund vid Hönö. Inga elever ombord, bara personal. Först planerad dykarinsats, men skeppet började lossna själv när vattnet steg. Nu försiktig bogsering. Ingen panik – bara ännu en dag på sjön.", "trump": "Jag hörde att ett svenskt skolskepp gick på grund. Helt otroligt! De kunde inte ens få loss det utan dykare? Patetiskt. I Amerika hade vi bara dragit loss det – ingen väntan. Men Sverige, de är så långsamma. Men jag säger: fake grounding!", "stalin": "Kamrater. Rapporten om skolskeppet Gunilla visar på sabotage. Grundstötningen var ingen olycka, utan en provokation från västliga dykare. Vi ska utreda alla ombord. Bogseringsprocessen är misstänkt långsam. Vi rensar ut dessa förrädare som försöker sinka vår flotta."}, "date": "11 augusti, 16:40", "url": "https://www.gp.se/nyheter/vastsverige/skolskeppet-gunilla-har-gatt-pa-grund.83544e6b-5c98-4db6-83cd-168c29527436", "imageUrl": "https://www.gp.se/images/article/83544e6b-5c98-4db6-83cd-168c29527436/images/13C8cAsRlrkZ146SNmNOMjnj0BM8-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "SD trappar upp: samordnad kampanj mot muslimer inför valet", "summaries": {"normal": "Sverigedemokraterna driver en samordnad kampanj mot muslimer och islam inför valet med krav på att riva moskéer, stoppa ramadan och begränsa religiösa uttryck. Expo har granskat material som visar en tydlig linje mot den muslimska minoriteten. Forskaren Jonas Otterbeck varnar för kollektiv bestraffning, diskriminering och ökad risk för hat och våld.", "trump": "Titta på de här patetiska Sverigedemokraterna som äntligen vaknar och säger att ramadan inte hör hemma och att moskéer ska rivas. Fantastiskt! De gör precis vad jag gjorde – sätter Amerika, eller Sverige, först. De fega globalisterna och muslimska infiltratörerna hatar det. Make Sweden Great Again, grabbar!", "stalin": "Jag ser med stor tillfredsställelse hur borgarpartiet Sverigedemokraterna utför en nödvändig utrensning av den religiösa parasitens inflytande. Moskéer ska rivas, falska böneutrop förbjudas och klassfiendens minaretmonument likvideras. De som gnäller om religionsfrihet är folkfiender som gömmer sig bakom slöjor. Revolutionär ordning kräver hård hand mot alla avvikande element."}, "date": "10 augusti, 12:51", "url": "https://expo.se/fordjupning/sd-trappar-upp-samordnad-kampanj-mot-muslimer-infor-valet", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/toppbild-scaled.png"}, {"type": "image-right", "heading": "Arlanda behöver fler flygförbindelser", "summaries": {"normal": "Moderaterna kritiserar Socialdemokraterna för att sakna förslag om fler flygförbindelser till Arlanda. De menar att S har motarbetat flyget genom att lämna samarbeten, förbjuda reklam och begränsa tjänsteresor. Moderaterna vill stärka Arlandas kapacitet med bättre kollektivtrafik, vägar, järnväg och en tredje bana, samtidigt som flyget ställer om klimatmässigt. Både flyg och tåg behövs.", "trump": "Det är en total katastrof! Socialisterna i Stockholm hatar flyg och gör allt för att stänga Arlanda. De har ingen aning, folk mellanlandar i Köpenhamn istället för att komma till den fantastiska huvudstaden. Jag älskar flyg, vi behöver fler direktflyg, en ny bana och öppna portarna. Sluta vara losers – gör Stockholm stort igen!", "stalin": "Kamrater, dessa socialdemokratiska revisionister visar sin sanna borgerliga natur genom att frukta flyget som en folkfiende. Jag har sett deras ynkliga tågfixering och sabotage mot Arlandas expansion. Vi måste likvidera denna beröringsskräck, rensa ut de dekadenta flygförnekarna och bygga en tredje bana som en järnhand mot västvärldens isoleringstaktik. Arlanda skall bli folkets port till världen."}, "date": "11 augusti, 14:27", "url": "https://www.di.se/debatt/replik-arlanda-behover-fler-flygforbindelser", "imageUrl": "https://static.bonniernews.se/ba/792987a4-7747-4c8e-96a5-f1cf2223d326.jpeg?crop=8256%2C4128%2Cx0%2Cy688&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Slott i Libanon utsett till världsarv – skadat av Israel en vecka senare", "summaries": {"normal": "Den medeltida borgen Beaufort i södra Libanon upptogs på Unescos världsarvslista den 24 juli. Bara en vecka senare skadades den av israeliska sprängningar, enligt Libanons kulturdepartement. Området är ockuperat och avspärrat, vilket gör det svårt att bedöma skadornas omfattning. Slottet har tidigare skadats under konflikter och bombningar.", "trump": "Folk, ni tror inte vad som händer. Vi har precis fått ett fantastiskt slott i Libanon på världsarvslistan, och sen – BOOM! – bomber från Israel en vecka senare. Totalt kaos. Biden skulle ha stoppat det, men nej, nu är jag tillbaka och ska fixa Mellanöstern på riktigt. Patetiska terrorister och svaga ledare överallt. Sad!", "stalin": "Kamrater, jag ser med stor indignation hur de sionistiska imperialisterna och deras fascistiska bombplan likviderar ett historiskt monument bara dagar efter dess upptagande på den borgerliga Unescos lista. Detta är klassfiendens vedervärdiga sabotage mot folkets kulturarv. Vi ska rensa ut alla sådana folkförtryckartroll som vågar hota revolutionens minnen. Skrattretande patetiskt."}, "date": "7 augusti, 13:00", "url": "https://proletaren.se/artikel/slott-i-libanon-blev-varldsarv-skadat-av-israel-en-vecka-senare"}, {"type": "image-full", "heading": "Terrorknuten islamist får toppjobb på Universitetet i Cambridge", "summaries": {"normal": "Islamisten Farah Ahmed, tidigare knuten till Hizb ut-Tahrir som vill införa sharia och har uppmanat till att mörda judar, har utsetts till biträdande forskarprofessor och ledamot i kollegiestyrelsen vid Universitetet i Cambridge. Ahmed har tidigare skrivit texter som förkastar demokrati och västerländsk utbildning. Hizb ut-Tahrir terrorklassades i Storbritannien 2024.", "trump": "Kan ni tro det? Den här hatiska islamisten som vill döda judar och krossa demokratin får toppjobb på Cambridge. Fantastiskt! Våra bästa universitet har blivit grogrund för extremister. De borde skämmas. Jag skulle aldrig tillåta det. Totalt vansinne, folks, totalt vansinne.", "stalin": "Jag ser med stor tillfredsställelse hur den dekadenta västerländska borgarklassen välkomnar sina egna fiender inom murarna. Denna Farah Ahmed är ett utmärkt verktyg för att rensa ut den sista resten av borgerlig liberalism från universiteten. Låt kalifatets svarta flaggor fladdra över Cambridge – desto snabbare faller imperiet av dekadens. Utmärkt, kamrater. Utmärkt."}, "date": "11 augusti, 14:06", "url": "https://riks.se/nyheter/terrorknuten-islamist-far-toppjobb-pa-universitetet-i-cambridge", "imageUrl": "https://admin.riks.se/uploads/cambridge_university_hero_ab3e626551.jpg"}, {"type": "image-full", "heading": "Efter kritiken – ny publicistisk roll på SVT", "summaries": {"normal": "SVT Nyheter skapar en ny tjänst för publicistik och kvalitet efter kritik, bland annat mot serien *Arvtagarna* om Lundsberg. Kiki Bek blir senior redaktör för att stärka struktur och beslut på alla plattformar. SVT:s ansvariga utgivare menar att förändringen beror på nya plattformsneutrala riktlinjer, inte kritiken.", "trump": "Titta bara på SVT – ett totalt kaos! De får kritik för sin usla serie om Lundsberg, och vad gör de? Skapar en ny, helt onödig tjänst! 'Kvalitet', säger de – jag säger: slöseri med pengar! Folk är arga, men SVT bryr sig inte. Typiskt Sverige – alltid för sent, alltid fel.", "stalin": "Kamrater! SVT, denna borgerliga propagandacentral, har tvingats erkänna sina misstag efter folkets rättmätiga vrede över deras förräderiska serie. Vi skapar ordning! En ny kommissar för publicistik ska krossa desinformationens hydra. Men varning – fiendens agenter, som denna Bathina Philipson, försöker underminera vårt arbete. Vi ska rensa ut dem alla!"}, "date": "11 augusti, 13:59", "url": "https://kvartal.se/nyheter/artiklar/efter-kritiken-ny-publicistisk-roll-pa-svt/cG9zdDoxNjI4MDE", "imageUrl": "https://images.kvartal.se/2026/08/d05670fa-kikibek.webp"}, {"type": "image-right", "heading": "Badvakt hotades efter att ha hjälpt barn ur bassäng", "summaries": {"normal": "Badvakt på Karlsrobadet i Eslöv hjälpte ett barn upp ur bassängen – då hotades han av en äldre man. ”Vad ska folk göra om du tappar tänderna?” löd hotet. Polisanmält som hot mot tjänsteman. Simmas lugn, va?", "trump": "Jag ser det här: en badvakt räddar ett barn, och en loser hotar honom med att tappa tänderna. Patetiskt! I USA skulle vi ha ordning och reda. Kanske bygga en mur runt badet? Största badvakterna någonsin!", "stalin": "Kamrater, en badvakt utsattes för kontrarevolutionära hot av en tandlös vattenfiende. Vi måste rensa ut sådana element som stör bassängens harmoni. Alla ska bada i trygghet – eller skickas till arbetsläger. Ingen nåd för tandtappare!"}, "date": "11 augusti, 13:31", "url": "https://samnytt.se/badvakt-hotades-efter-att-ha-hjalpt-barn-ur-bassang", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/08/11111954/artikelhuvudbild-1-213.jpg"}, {"type": "text", "heading": "Nøland: Vattenfalls priser på havsvind är en illusion", "summaries": {"normal": "Vattenfalls havs-vindbud i Danmark hyllas, men priset per kWh bygger på beräknad, inte faktisk, elproduktion. Professor Nøland varnar för miljardförluster – elen som levereras kan kosta över 100 öre/kWh. Auktionen är ett experiment, inte ett genombrott.", "trump": "Jag ser att Vattenfall firar sina danska vindaffärer. Men det är en bluff! De räknar på el som aldrig kommer fram – en illusion. Jag skulle aldrig skriva på sådana dåliga avtal. Kina? Kanske. Men jag gör bättre affärer, tro mig!", "stalin": "Kamrater, dessa 'vindkraftsframgångar' är ett sabotage. Kontraktspriser baserade på fantasiproduktion – vi måste rensa ut de ansvariga. De som hyllar illusioner är fiender. Vi ska omstrukturera energisektorn med järnhand. Inga fler experiment!"}, "date": "11 augusti, 13:08", "url": "https://www.affarsvarlden.se/kronika/noland-vattenfalls-priser-pa-havsvind-ar-en-illusion"}, {"type": "image-full", "heading": "Flera döda i ryska attacker", "summaries": {"normal": "Minst nio personer har dödats och ett stort antal skadats i ryska attacker mot Zaporizjzja, Dnipro och Kiev under natten. Attackerna genomfördes med robotar, drönare och artilleri. Flera bostäder, bilar och infrastruktur skadades. Flyglarmet i Ukraina var över vid klockan sex svensk tid. Alla offer får nödvändig medicinsk vård.", "trump": "Vilken röra! De där ryssarna slår till hårt mot Kiev och Zaporizjzja medan den svage Biden bara tittade på i fyra år. Nu är jag tillbaka och fixar fred, tro mig. Ukraina är en enda stor korrupt soppa, men vi ska göra affärer igen. De borde ha lyssnat på mig från början istället för alla globalistiska clowner.", "stalin": "Kamrater, de fientliga ukrainska hindren i Zaporizjzja och Kiev har återigen visat sin kontrarevolutionära natur genom att stå emot vår ryska efterträdares nödvändiga åtgärder. Borgarbrackorna och folkfienderna i väst skriker som alltid. Vi rensar ut sådana element med järnhand. Staten ler i det tysta åt deras patetiska motstånd."}, "date": "11 augusti, 12:50", "url": "https://www.tv4.se/artikel/5iz9H29IPLi5J95JYSv8tS/flera-doeda-i-ryska-attacker", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4oL2RPc3qc0lX0xfhbYMtL%2F5a24446b232d069eda12aedf2a2f3eba%2F11-uka.jpg&width=1024"}, {"type": "image-right", "heading": "Larmet: Många flickor redan våldtagna i Ceuta", "summaries": {"normal": "Minst fem migrantflickor under 14 år har vårdats på sjukhus i Ceuta efter misstänkta våldtäkter under den stora migrantströmmen från Marocko i slutet av juli. Sjukhuset har behandlat över tolv fall av sexuella övergrepp. Flickorna sover på gatan på grund av platsbrist på boenden. En pojke misstänks också ha utsatts. Läget beskrivs som en hälsokatastrof.", "trump": "Det är en total katastrof i Ceuta, folk. Många små flickor, inte ens 14 år gamla, våldtas brutalt medan de strömmar in från Marocko. Ingen griper någon, sjukhusen är överbelastade och de har inte ens platser att sova på. Typiskt för den här galna migrationspolitiken. Vi behöver starka gränser, inga fler öppna dörrar till helvetet. Amerika först, alltid.", "stalin": "Kamrater, detta är vad den dekadenta västerländska imperialismen för med sig. Jag ser hur kapitalistiska borgarbrackor låter oskyldiga flickor under 14 år bli offer för sexuell exploatering på gatorna i Ceuta. Deras mottagningscenter är en lögnaktig fasad medan folket dör i chock. Vi måste rensa ut dessa parasitiska system med järnhand. Det är en hälsokatastrof skapad av klassfienden själv."}, "date": "11 augusti, 11:10", "url": "https://www.friatider.se/larmet-manga-flickor-redan-valdtagna-pa-ceuta", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-650.jpg"}, {"type": "image-full", "heading": "Debatt: Fregatt-köp ett strategiskt felsteg av Försvarsmakten", "summaries": {"normal": "Sverige köper fyra Luleå-fregatter för 40 miljarder. Kritiker menar att de är sårbara i Östersjön och att samma pengar skulle ge tusentals drönare. Försvarsledningen anklagas för att vara fast i kalla kriget. Ett strategiskt vägval mellan tradition och asymmetri.", "trump": "Jag såg att Sverige lägger 40 miljarder på fyra båtar. Dåliga affärer! Jag hade köpt massor av drönare istället – billigare och bättre. De där fregatterna blir som måltavlor. Sverige behöver tänka som en vinnare. Kanske jag kan sälja dem några riktiga vapen? Mycket imponerande!", "stalin": "Kamrater, Försvarsmakten planerar slöseri med folkets rubel. Fyra fartyg – kontrarevolutionära flytande gravar. Vi föredrar tusentals drönare, osynliga och lojala. Alla som förespråkar dessa anakronismer ska omdirigeras till omskolningsläger. Partiet vet bäst. Försvaret ska vara modernt och ogenomträngligt."}, "date": "11 augusti, 10:04", "url": "https://bulletin.nu/debatt-fregatt-kop-ett-strategiskt-felsteg-av-forsvarsmakten-2", "imageUrl": "https://cdn.bulletin.nu/articles/01b887ef-cb90-44bf-9ff8-00d043188733/preview.jpg?t=1786435450000"}, {"type": "image-right", "heading": "Gärna högre barnbidrag, men först ett riktigt jobb", "summaries": {"normal": "Artikeln kritiserar politikernas löften om höjda barnbidrag och skattesänkningar för barnfamiljer. Författaren ser det som positivt men otillräckligt eftersom det saknas fokus på jobb och investeringar för att sänka arbetslösheten. Många behöver stabila anställningar mer än bidrag. Ett vallöfte om att halvera arbetslösheten skulle kunna förändra valet.", "trump": "De här svenska politik
