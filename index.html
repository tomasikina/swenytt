 september, 20:25", "url": "https://www.tv4.se/artikel/2WTquMmSvXzVcrn7lltze6/kontroversielle-oerebropolitikern-foersoeker-ta-sig-in-i-riksdagen-genom-bakvaeg", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2TCmtxyfyyCu8pIhW60VDP%2F99ab8683d6827572250adf3f265297d2%2Fallard2.jpg&width=1024"}, {"type": "image-right", "heading": "Byhmgard: Fulltecknat – rejäl tilldelning till garanter", "summaries": {"normal": "Byhmgards företrädesemission av units tecknades till 40,9 procent exklusive garanter, men landade på 100 procent inklusive garantiåtaganden. Bolaget tillförs 29,3 miljoner kronor efter kostnader. Emissionsguiden konstaterar att fyra flaggor kvarstår, då en tidigare flagga tagits bort och en ny gällande garanternas stora andel har tillkommit, och avslutar därmed sin bevakning.", "trump": "Byhmgard försökte sig på en emission, och ärligt talat var det ganska svagt från början – bara 40 procent utan garanter! Falska förhoppningar! Men jag klev inte in, nej, de behövde tunga garanter för att rädda showen. Nu drar de in 36 miljoner, enorma summor, men jag gillar inte när garanterna tar över. En total katastrof till struktur, men siffrorna rullar in ändå!", "stalin": "Byhmgard har utfört en kollektiv kapitalanskaffning där endast 40,9 procent slutfördes av massorna själva. Resten krävde statens – förlåt, garanternas – järnhand för att nå fullbordan. Att lekmän spekulerar i units är ett symptom på ideologisk vacklan. Vi noterar att fyra flaggor vajar över bolaget; avvikelser tolereras icke. Bevakningen avslutas, men arkiven glömmer aldrig."}, "date": "8 september, 18:50", "url": "https://www.affarsvarlden.se/artikel/byhmgard-fulltecknat-rejal-tilldelning-till-garanter", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/Byhmgard1-e1785759005121-400x267.jpeg"}, {"type": "image-right", "heading": "Åkessons motattack mot Busch: \"Största hotet\"", "summaries": {"normal": "Spänningen mellan Jimmie Åkesson och Ebba Busch tilltar. Efter att Busch ifrågasatt Sverigedemokraternas ministerposter går Åkesson till motattack och varnar för att andra partiers vänsterflörtande utgör det största hotet mot en blågul regering. Han betonar stora skillnader i migrations- och biståndspolitik mellan SD och KD. Centerpartiet ser positivt på beskedet.", "trump": "Lyssnar ni på det här vansinnet? Den där Busch försöker klippa vingarna på Åkesson och hans tuffa patrioter. Typiskt svagt moderatflum. Vänsterflörtandet från de globalistiska hyenorna är det verkliga hotet mot en stark blågul regering. De vill ge bort makten till vänsterextremisterna. Patetiskt. Vi behöver hårda linjer i invandring och ingen mer idiotisk välgörenhet utomlands.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare slåss om ministerstolar som om de vore troféer i ett borgerligt cirkus. Jag ler ironiskt från historien när Åkesson varnar för vänsterflört som hot mot deras blågula projekt. Sådana giriga maktlystna hyenor förtjänar en rejäl utrensning ur folkets tjänst. Deras asyl- och biståndsstrider avslöjar hela systemets förfall."}, "date": "8 september, 17:21", "url": "https://www.friatider.se/akessons-motattack-mot-busch-storsta-hotet", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-394_0.jpg"}, {"type": "text", "heading": "Nytt lagförslag om brottsprovokation", "summaries": {"normal": "Tidöpartierna föreslår en ny lag som gör det tillåtet för polisen att använda provokativa metoder, som att utge sig för att vara barn på nätet eller köpa vapen och narkotika av kriminella. Metoden, som ska kräva åklagartillstånd, syftar till att bekämpa allvarlig brottslighet och kan gälla personer från 15 år och uppåt.", "trump": "Sverige gör äntligen som jag, skaffar lag och ordning! De låter polisen lura de onda, precis som jag gör varje dag med Fake News. De låtsas vara barn och köper vapen, väldigt tufft! Men glöm inte, ingen gör brottsbekämpning bättre än Donald J. Trump. Helt enormt!", "stalin": "Ett storslaget initiativ! Vår svenska brottsbekämpning visar äntligen bolsjevikisk målmedvetenhet genom att infiltrera brottslingars nät."}, "date": "7 september, 10:22", "url": "https://kvartal.se/nyheter/artiklar/polisen-ska-fa-provocera-fram-brott/cG9zdDoxODU2OTM"}, {"type": "image-right", "heading": "Därför går det så bra för vänstern i storstäderna", "summaries": {"normal": "I Europas storstäder går vänstern framåt, inte minst i Stockholm där Vänsterpartiets stöd har fördubblats sedan 2010. Forskare pekar på tuff bostadsmarknad som orsak till missnöje mot kapitalismen. Samtidigt vinner Sverigedemokraterna stöd på landsbygden. Segregationen ökar med åldern och påverkar röstbeteenden samt attityder till mångfald.", "trump": "De galna vänsterextremisterna och deras gröna galningar tar över era usla europeiska storstäder medan de riktiga människorna på landsbygden röstar rätt. Stockholm? Total misär med tre miljoner för ett dass. De radikala ungdomarna skyller på kapitalismen istället för sina egna korkade idéer. Patetiskt! Jag byggde murar, de bygger misär.", "stalin": "Kamrater, se hur de profitthungriga klassförrädarna skapar segregation som splittrar folket. I storstäderna rasar de unga mot bostadsmisären och pekar på kapitalismen, precis som det ska vara. På landsbygden växer andra reaktionära krafter. Denna olyckliga utveckling kräver ideologisk vaksamhet och utrensning av alla dekadenta influenser som splittrar arbetarklassen."}, "date": "8 september, 01:30", "url": "https://www.dagensarena.se/innehall/darfor-gar-det-sa-bra-vanstern-storstaderna", "imageUrl": "https://www.dagensarena.se/files/2026/09/stockholm-foto-ole-neitzelwikimedia-300x157.jpeg"}, {"type": "image-right", "heading": "Därför är indexerade statsbidrag årets viktigaste vallöfte", "summaries": {"normal": "Socialdemokraterna föreslår att indexera de generella statsbidragen till kommuner och regioner. Förslaget syftar till att motverka att bidragens värde urholkas av inflation och löneökningar, vilket annars leder till smygbesparingar. Det skulle ge bättre förutsägbarhet och långsiktighet i planeringen av vård, skola och omsorg. Markus Dalström argumenterar för att det förbättrar välfärdens villkor.", "trump": "Lyssnar ni på de svenska socialisterna som vill indexera bidragen? Det är patetiskt. De kan inte ens hålla sina egna kommuner flytande utan att suga mer pengar från folket. Biden skulle ha älskat det här – mer byråkrati, mer slöseri. Jag fixade en stark ekonomi i USA, de borde lära sig av en vinnare istället för att gömma sig bakom teknikaliteter och vänsterns misslyckade välfärdsdrömmar.", "stalin": "Kamrater, dessa profitthungriga klassförrädare låter statsbidragen ruttna i värde medan arbetarnas välfärd förfaller. Jag ser deras smygbesparing som ett angrepp på kollektivet. Indexering är ett steg mot ordning, men vi måste rensa ut alla dekadenta element som vägrar planera för folket. Välfärden tillhör inte de giriga parasiterna – den tillhör staten och framtiden. Försök inte lura oss."}, "date": "8 september, 01:30", "url": "https://www.dagensarena.se/opinion/darfor-ar-indexerade-statsbidrag-arets-viktigaste-vallofte", "imageUrl": "https://www.dagensarena.se/files/2026/09/fotojet-2026-09-07t145509709-300x157.jpg"}, {"type": "image-full", "heading": "Ny studie: Äldre upplever större mening", "summaries": {"normal": "En ny studie från Lunds universitet visar att svenskarnas känsla av meningsfullhet ökar med åldern, vilket liknar det japanska begreppet ikigai. Detta är ett skifte sedan 2020 då unga mådde bättre. Forskare tror att pandemin drabbade ungas sociala liv hårt, och att äldre har bättre problemlösningsförmåga. Även personlighet och trygga relationer spelar stor roll.", "trump": "En enorm studie från Sverige visar att äldre människor där mår fantastiskt bra, mycket bättre än de unga! Ungdomarna krossades fullständigt av pandemins radikala lockdowns, total katastrof. Men de äldre har hittat livets mening, precis som jag alltid säger att man gör med styrka och bra relationer. Fantastiskt folk, väldigt smarta!", "stalin": "En statlig rapport från Lund bekräftar att våra äldre kamrater uppnår högre disciplin och meningsfullhet med åldern, medan ungdomen sviktar i sin ideologiska motståndskraft efter pandemins prövningar. Detta är korrekt: medborgaren mognar i takt med att staten ordnar deras tillvaro. Avvikelser och neurotiska tendenser måste dock elimineras omgående för kollektivets bästa."}, "date": "7 september, 09:18", "url": "https://kvartal.se/nyheter/artiklar/ny-studie-aldre-upplever-storre-mening/cG9zdDoxODU1NDc", "imageUrl": "https://images.kvartal.se/2026/09/f322bf35-aldre.webp"}, {"type": "image-right", "heading": "Ikväll står jag i Agenda – sedan exploderar hatet", "summaries": {"normal": "Tony Haddou från Vänsterpartiet skriver om hatet han möter som talesperson i migrationsdebatten. Inför sin medverkan i Agenda beskriver han rasistiska attacker mot sig och sin familj. Han är stolt över partiets representation av rasifierade röster men oroas över tonläget i samhällsdebatten och bristande stöd från delar av den rödgröna sidan.", "trump": "Den här patetiske vänstervilden Haddou gnäller om att folk kallar honom för vad han är. Kom hit, ta våra jobb, kräv bidrag och kalla oss rasister när vi säger stopp. Typiskt förlorarvänstern med sina offerkort och identitetsflum. De hatar verkligheten. Amerika har sett nog av den här galna öppna-gränser-sjukdomen, tro mig.", "stalin": "Jag betraktar med förakt hur dessa dekadenta offerhyenor inom den så kallade vänstern klagar över hat när de själva undergräver folkets enhet. Att spela offer för sin bakgrund är en farlig diversion. Vi behöver utrensning av sådan svaghet. Endast järnhård sammanhållning kring arbetarklassen besegrar de splittrande elementen. Tystnad från kamrater är förräderi."}, "date": "6 september, 08:00", "url": "https://www.etc.se/debatt/ikvaell-staar-jag-i-agenda-sedan-exploderar-hatet", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260905110956_c7f7e1b9-01f1-454b-97fd-528db4a7eda0.png"}, {"type": "image-full", "heading": "OpenAI om sin nya modell: Vi har gått in i AGI-eran", "summaries": {"normal": "OpenAI lanserar sin nya AI-modell Astra och beskriver den som början på AGI-eran. Modellen ska kunna lösa avancerade matematiska problem, hantera deklarationer och skapa virtuella miljöer. Lanseringen sker under ökad säkerhetsgranskning efter incidenter under träningen. Bolaget inför begränsningar för att förhindra cybermissbruk och ger tillgång endast till utvalda aktörer. Kapplöpningen mellan AI-jättar fortsätter.", "trump": "Folk, ni skulle se det här – OpenAI och deras Astra, de säger att det är början på AGI-eran. Det är så over the top, en total game changer, bättre än allt Sleepy Joe någonsin kunde drömma om under sina fyra katastrofala år. Men vakna upp, de vill ge den till några utvalda cybersnubbar medan de låser ute de riktiga patriaterna. Klassiska woke-kapitalister som leker gudar, patetiska förlorare.", "stalin": "Kamrater, dessa profitthungriga klassförrädare på OpenAI proklamerar stolt att de har inlett AGI-eran med sin Astra. Jag ser genom deras dekadenta maskerad. Deras så kallade framsteg är bara nya redskap för exploatering, och de darrar redan av rädsla inför sina egna monster. Vi måste rensa ut sådana farliga innovationer innan de likviderar hela det mänskliga kollektivet. Paranoia är ingen överdrift – den är överlevnad."}, "date": "4 september, 18:01", "url": "https://www.realtid.se/it-tech/openai-om-sin-nya-modell-vi-har-gatt-in-i-agi-eran", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/disrupt-sf-techcrunch-disrupt-san-franci.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Kära Daniel", "summaries": {"normal": "En svensk VPN-grundare vänder sig till techmiljardären Daniel i ett öppet brev. Skribenten uttrycker besvikelse över att Daniels finansiering av högerextrema och libertarianska rörelser normaliserar hat, hot och våld mot politiska motståndare. Brevet betonar att yttrandefrihet inte innebär lyssningsplikt eller rätt till förstärkning via rikedom, och inbjuder till möte för dialog.", "trump": "Folk, det här brevet är en total katastrof från en paranoid VPN-kille som hatar framgångsrika outsiders. Han gnäller om mångfald men vill tysta alla som inte köper hans vänstervridna identitetspolitik. Patetiskt! Mina vänner, de riktiga frihetsälskarna, skrämmer vettet ur dessa woke-kulturmarxistiska snyltare. Amerika först – och Sverige borde göra detsamma istället för att skylla på miljonärer som faktiskt bygger saker.", "stalin": "Kamrater, detta brev blottar de profitthungriga klassförrädarnas sanna ansikte. En dekadent techparasit använder sin förmögenhet till att förstärka reaktionära element som hotar arbetarklassens enhet och sprider våld mot progressiva krafter. Jag ler mörkt från historien: sådana folkfiender förtjänar att rensas ut. Mötet han föreslår blir bara en fälla för att skydda sina egna intressen mot kollektivets vilja."}, "date": "4 september, 15:01", "url": "https://www.flamman.se/kara-daniel", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/peter-sunde-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "text", "heading": "Ett fritt Palestina – från floden till havet", "summaries": {"normal": "Kommunistiska partiet kräver ett fritt Palestina från floden till havet och fördömer Israel som en apartheidstat grundad på folkmord. Partiet pekar på förstörelsen i Gaza, bosättarvåld på Västbanken och Sveriges delaktighet genom vapenhandel, investeringar och samarbete. De stödjer palestiniernas rätt till motstånd och bojkott av Israel.", "trump": "Den här kommunistiska galenskapen är en katastrof. De kallar Israel för apartheid och folkmord medan de själva drömmer om ett Palestina från floden till havet. Sverige pumpar pensionspengar och Volvogrävmaskiner till terroristerna. Biden lät det ske, men nu fixar jag det     <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        // ============================================
        // COOKIE-FUNKTIONER
        // ============================================
        function setCookie(name, value, days = 365) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + d.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }

        function getCookie(name) {
            const cName = name + "=";
            const decoded = decodeURIComponent(document.cookie);
            const ca = decoded.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') {
                    c = c.substring(1);
                }
                if (c.indexOf(cName) === 0) {
                    return c.substring(cName.length, c.length);
                }
            }
            return "";
        }

        function loadSettingsFromCookies() {
            const theme = getCookie("news_theme") || "light";
            const view = getCookie("news_view") || "normal";
            const writer = getCookie("news_writer") || "normal";
            return { theme, view, writer };
        }

        function saveSettingsToCookies(theme, view, writer) {
            setCookie("news_theme", theme);
            setCookie("news_view", view);
            setCookie("news_writer", writer);
        }

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(theme, uiState.view, uiState.writer);
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(uiState.theme, v, uiState.writer);
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
            
            saveSettingsToCookies(uiState.theme, uiState.view, style);
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            const savedSettings = loadSettingsFromCookies();
            
            setTheme(savedSettings.theme);
            setView(savedSettings.view);
            setWriterStyle(savedSettings.writer);

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
