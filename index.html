tens mark för 17 000 spänn och plötsligt är det värsta skandalen sen Biden stal valet. De där socialisterna gnäller om skattepengar medan de slösar bort miljarder på grön galenskap och invandring. Rena hönsflocken, springer runt utan att fatta ett smack om ekonomi. Patetiskt!", "stalin": "Kamrater, jag ser hur klassfiendens borgarbrackor inom socialdemokratin rasar mot ett obetydligt hönshus. Dessa folkförtryckartroll gnäller om 17 000 kronor medan de själva likviderat samhällets resurser med sina imperialistiska vanvidsprojekt. Deras paranoia över ett hönshus blottar deras egen okunnighet om ekonomi och folkets intressen. Vi ska rensa ut sådana exploaterande byfånar som inte begriper vad som gagnar kollektivet. Hönsen är de själva."}, "date": "3 juni, 03:11", "url": "https://samtiden.nu/2026/06/sossarnas-honshus-extremt-mycket-dyrare-an-statsminsterns/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Harpsund.jpg"}, {"type": "image-right", "heading": "Valet borde handla om Astrid och Afshad", "summaries": {"normal": "Artikeln belyser välfärdens kris trots att vård och skola är väljarnas viktigaste frågor. Erfarna sjuksköterskor som Astrid beskriver ökad administration, besparingar och hög arbetsbelastning. En ny rapport visar att hälften av de anställda anser att resurserna inte räcker, medan två av tre övervägt att lämna yrket. Författaren undrar varför frågan inte dominerar valdebatten och föreslår att fler personliga röster från branschen skulle kunna förändra det.", "trump": "Folk älskar sina fantastiska sjuksköterskor och lärare, de verkliga hjältarna, men vad händer? Byråkrater och besparingar har kört sönder hela systemet medan de riktiga arbetarna springer tills de stupar. Två av tre vill sluta? Det är en total katastrof, en riggad valfråga som de globalistiska eliten gömmer undan. Vi behöver inga fler rapporter, vi behöver resultat. Applåder räcker inte, det vet till och med Sleepy Joe. Gör välfärden stor igen.", "stalin": "Kamrater, denna rapport avslöjar borgarklassens systematiska sabotage mot arbetarkollektivets välfärd. Jag ser hur klassfiendens exploaterande byfånar tvingar våra hjältar som Astrid och Afshad att bära oacceptabla bördor medan de planerar sin flykt. Imperialistiska identitetspolitiska distraktioner döljer den sanna kampen. Vi måste rensa ut dessa folkförtryckartroll från debatten och tvinga fram arbetarnas röster. Endast genom kollektiv styrka kan vi likvidera denna parasitiska frånvaro."}, "date": "2 juni, 15:54", "url": "https://www.flamman.se/valet-borde-handla-om-astrid-och-afshad/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sjuksyrror-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Man åtalas för deltagande i Maniac Murder Cult", "summaries": {"normal": "En 20-årig man åtalas för deltagande i den nazistiska terroristorganisationen Maniac Murder Cult (MKU). Han misstänks ha byggt upp en svensk gren, rekryterat medlemmar via TikTok och spridit våldspropaganda. Organisationen är terrorstämplad i Kanada och Storbritannien. Åklagaren beskriver fallet som det första av sitt slag i Sverige, med kopplingar till grova våldsdåd. Utredningen har skötts av Säkerhetspolisen.", "trump": "Folk, vilken katastrof! En ung svensk man, bara 20 år, försöker bygga upp en nazistisk terrorgrupp här i Sverige – och det på MIN TikTok! Jag har alltid sagt att sociala medier är farliga, men detta? Detta är galenskap! Säkerhetspolisen har gripit honom, och det är bra – men varför tog det så lång tid? Sverige måste vakna upp! Vi behöver starka gränser och ännu starkare lagar. Tänk om detta hade hänt i USA? Aldrig! Vi hade stoppat det direkt. SAD!", "stalin": "Ytterligare en fiende till folket har avslöjats! Denna lilla fascistiska kryp, denna 20-åriga avskum, har försökt sprida sitt gift i vårt broderland Sverige. Men vi, det sovjetiska folkets sanna försvarare, låter inte sådana som han underminera vår revolutionära anda! Han rekryterade via TikTok – ett dekadent västligt verktyg för förfall! Men våra kamrater i Säkerhetspolisen har krossat hans lilla cell. Låt detta vara en varning till alla fascistiska hyenor: vi ser er, vi jagar er, och vi kommer att utplåna er som ohyra. För socialismens och folkets seger!"}, "date": "2 juni, 11:10", "url": "https://expo.se/nyhet/man-atalas-for-deltagande-i-maniac-murder-cult/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/MKU-atal-BY-Expo.jpg"}, {"type": "image-right", "heading": "Ledare Henrik Jalalian: Pourmokhtaris tid som minister måste sättas upp på Dramaten", "summaries": {"normal": "Artikeln kritiserar klimatminister Romina Pourmokhtari för att under fyra år ha lovat en ambitiös klimatpolitik utan att leverera resultat. Trots löften om utredningar och handlingsplaner har regeringen, i samarbete med SD, inte presenterat konkreta åtgärder. Författaren liknar situationen vid teaterpjäsen ”I väntan på Godot” där man ständigt väntar på något som aldrig kommer. Klimatutredningar har förhalats och avslutats utan innehåll.", "trump": "Folk, ni skulle se det här. Den här Pourmokhtari, en total loser, lovade stora saker som klimatminister men levererade absolut ingenting. Fyra år av väntan, precis som Godot som aldrig dyker upp. Hon sålde ut sig till Åkesson och hans gäng för noll resultat. Typiskt den här woke-identitetspolitiken, kvotera in folk som inte kan leverera. Jag fixade mer på en vecka som president än hon på en hel mandatperiod. Patetiskt!", "stalin": "Kamrater, denna Pourmokhtari är en klassisk representant för den förslösande borgarklassen som maskerar sin brist på handling med eviga utredningar. Jag har i mitt outtröttliga ledarskap sett hur sådana folkfiender förhalar folkets framsteg medan de väntar på en imaginär Godot. Hennes tomma löften är ett verktyg för klassfiendens sabotage. Vi måste rensa ut sådana exploaterande byfånar som förslösar mandatperioder åt kapitalistmaffian. Ett skratt värt en utrensning."}, "date": "3 juni, 09:04", "url": "https://www.etc.se/ledare/pourmokhtaris-tid-som-minister-maaste-saettas-upp-paa-dramaten", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260603060656_514bdf0f56ceb21277a979af64f30eea7600a2f33fb70737e286af5baafb57bd.jpg"}, {"type": "image-right", "heading": "Google bygger jättelik datahall i Avesta", "summaries": {"normal": "Google har beslutat att bygga sitt första svenska datacenter i Horndal i Avesta kommun. Marken köptes redan 2017 och under tisdagen togs det första spadtaget. Bygget väntas ge tusentals jobb under byggfasen och 100 fasta tjänster när anläggningen står klar 2028. Bistånds- och utrikeshandelsminister Benjamin Dousa (M) och kommunalrådet Blerta Krenzi (S) närvarade vid ceremonin och lyfte fram etableringens betydelse för kommunen.", "trump": "Det här är fantastiskt, verkligen stort. Google, en jätte, väljer äntligen att bygga i Sverige, i ett ställe som heter Horndal i Avesta. De har väntat i åratal, köpte marken redan 2017, och nu tar de spadtaget. Tusentals jobb under byggtiden och hundra permanenta tjänster – det är vad jag kallar vinnare. Minister Dousa var där och sa att det skapar massor med jobb. Smart drag, Google. Ni borde ha gjort det tidigare, men bättre sent än aldrig. Amerika först, men det här är bra för Sverige också.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur den amerikanska monopolkapitalisten Google nu gräver sin egen grav i Avesta genom att uppföra en väldig datahall åt horndalska arbetare. Borgarbrackorna har länge tvekat men nu tvingas de investera i folkets framtid. Tusentals byggjobbare och hundra ständiga tjänster skall likvidera arbetslöshetens sabotage. Jag varnar dock för sabotörer och västerländska spioner som gömmer sig bland underleverantörerna. Vi rensar ut dem alla. Industrien byggde orten förr och skall nu tjäna det kollektiva Sovjet-Sverige. Segraren ler i skuggan."}, "date": "3 juni, 08:55", "url": "https://www.friatider.se/google-bygger-jattelik-datahall-i-avesta", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-285_2.jpg?itok=ZyR9Rd3T"}, {"type": "text", "heading": "SD-riksdagsledamot utreds för barnporrbrott", "summaries": {"normal": "En sverigedemokratisk riksdagsledamot har lämnat sitt uppdrag efter misstankar om barnpornografibrott. Mannen meddelade sin avsägelse i ett kort brev till talmannen. Polisen har utfört husrannsakan och beslag av elektronisk utrustning samt förhört honom. Han är fortfarande misstänkt. Tipset kom från den amerikanska organisationen NCMEC. Ledamoten har tidigare dömts för förskingring och uppmärksammats för dubbla arvoden samt försök att sälja sexleksaker inom partiet.", "trump": "Folk, det här är en katastrof. En av dessa SD-typer i riksdagen – en riktig förlorare – hoppar av efter att ha åkt fast för barnporr. Patetiskt! De lovar att dränera träsket men hamnar själva i det. Sverige är en total röra under de här globalistiska, woke-idioterna. De borde fokusera på riktiga problem istället för att skydda perversa typer. Jag byggde en mur mot det här skitet – de borde göra detsamma. Sad!", "stalin": "Kamrater, ännu en dekadent från borgarklassens politiska maskineri har avslöjats som en lågklassig folkfiende och barnexploaterare. Jag ser hur dessa falska folkrepresentanter ruttnar inifrån, precis som förväntat under det kapitalistiska systemets förfall. Vi måste rensa ut alla sådana degenererade element som hotar arbetarklassens moral och framtid. Avslöjandet gläder mig – det bevisar att klassfiendens hus alltid står på bräckliga, perversa grundvalar. Ut med dem alla."}, "date": "2 juni, 17:05", "url": "https://proletaren.se/artikel/sd-riksdagsledamot-utreds-for-barnporrbrott/"}, {"type": "image-right", "heading": "Skräcken på äldreboendet: Pensionärer bands fast och fick munnarna igentäppta", "summaries": {"normal": "På ett äldreboende i Värmland har tre dementa pensionärer utsatts för grova övergrepp. Deras händer bands fast och munnarna täpptes igen under omvårdnad. Händelserna inträffade förra året på Oskarslund i Karlstad och bevittnades av personal, men rapporterades inte direkt. Verksamhetschefen beskriver händelserna som mycket allvarliga. Ärendet har anmälts till Lex Sarah-utredningen och Inspektionen för vård och omsorg.", "trump": "Jag har hört talas om detta svenska äldreboende – en total skandal! Dementa våra äldre, deras händer bands, munnarna täpptes igen – det är hemskt! Som en gång var president, säger jag: det är ett misslyckande av ledarskap. Vi skulle ha starka, kloka personer där, inte sådana som gör sådant. Det är en förening som måste städas ut. Vi ska se till att rätt personer är ansvariga – det kommer att bli fantastiskt.", "stalin": "På ett fientligt territorium i Värmland har reaktionära krafter inom den svenska äldreomsorgen begått förräderi mot det revolutionära folket. Tre äldre, offer för kapitalistisk dekadens, bands och tystades – en metod direkt ur Hitlers playbook. Vi, staten och partiet, ska rensa ut dessa elementära fiender. Ivo och Lex Sarah är våra verktyg för renhet. Vi ska utvidga vår övervakning, för varje vrå av vår intressesfär måste rensas från dessa smutsiga, individualistiska handlingar. Vi ser allt, vi straffar allt."}, "date": "3 juni, 09:00", "url": "https://samnytt.se/skracken-pa-aldreboendet-pensionarer-bands-fast-och-fick-munnarna-igentappta", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/06/02140215/aldreboend-1.jpg"}, {"type": "image-right", "heading": "Efter larmen – myndighet undersökte aldrig Ica-lagret", "summaries": {"normal": "Skyddsombuden på Icas e-handelslager i Brunna slog larm om stress, realtidsövervakning och orealistiska prestationsmål som hindrade toalettbesök. Arbetsmiljöverket genomförde endast kontors- och digitala inspektioner, litade på Icas dokumentation och avslutade ärendet utan att besöka lagergolvet eller prata med arbetarna. Facket är besviket och kritiserar myndigheten för att prioritera papper framför verklig arbetsmiljö. Arbetsmiljöverket försvarar sig med att de måste följa lagstiftningen och att arbetsgivaren ansvarar för riskbedömningar.", "trump": "Det här är en total skandal, folk. Ica behandlar sina arbetare som maskiner med stress, övervakning och galna mål så de inte ens hinner på toaletten. Och vad gör Arbetsmiljöverket? Ingenting! De sitter i ett kontorsrum och tror på Icas fina ord istället för att gå ut på golvet som riktiga tuffa inspektörer. Patetiskt. Skyddsombuden försöker rädda de stackars människorna men myndigheten är bara en massa byråkratiska förlorare. De borde skämmas. Jag skulle ha städat upp det där på en dag.", "stalin": "Kamrater, dessa borgarbrackor på Ica driver ett automatiserat slavläger där arbetarna jagas som råttor under kapitalisternas realtidsögon och omänskliga kvoter, ända tills de inte ens törs lätta på byxorna. Jag, som alltid vakar över folkets hälsa, ser hur den så kallade Arbetsmiljöverket genast faller på knä inför de fina papperna från klassfienden istället för att rensa ut det hela med en fysisk inspektion. Vilken ynklig kapitulation! Skyddsombuden, dessa ädla röster, behandlas som misstänkta kontrarevolutionärer i ett förhör. Vi ska likvidera sådan byråkratisk förräderi mot arbetarklassen. Paragrafryttarna kommer att skratta sig fördärvade ända in i sin egen utrensning."}, "date": "3 juni, 08:07", "url": "https://arbetet.se/2026/06/03/facket-besvikna-pa-arbetsmiljoverket-efter-lagrets-larm-de-litade-helt-pa-icas-ord/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/20122133/qbeQZGMJ1Yc-Icalager_Brunna-13.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "USA vänder – öppnar för statlig AI-granskning", "summaries": {"normal": "USA:s president Donald Trump har undertecknat en ny presidentorder som möjliggör statlig granskning av avancerade AI-modeller före lansering. Syftet är att identifiera risker för cybersäkerhet och nationell säkerhet. Granskningen är frivillig och ska inte leda till licensiering. Myndigheter som försvarsdepartementet och NSA involveras för att bedöma sårbarheter. Beslutet följer debatt om AI-reglering och industrins påtryckningar.", "trump": "Folk frågar mig: 'Mr. President, vad gör du med AI?' Jo, jag har precis skrivit under en fantastisk order – ingen kommer att slå USA på AI, INGEN! Vi granskar de där super-smarta modellerna, men bara frivilligt, för vi vill inte kväva innovation. Kina? De försöker, men vi leder. Och vi anställer de bästa hjärnorna – för USA ska alltid vara nummer ett, believe me!", "stalin": "Vi har observerat hur den amerikanska imperialismens ledare, denna clown i Vita huset, försöker kontrollera kapitalets leksaker – deras så kallade 'AI'. Men vi vet sanningen: deras system är svagt, deras granskningar meningslösa. Låt dem leka med sina frivilliga kontroller – medan vi i stillhet bygger det verkliga framtidens maskiner. Och Putin? Han skrattar åt deras naivitet, precis som vi."}, "date": "2 juni, 20:06", "url": "https://kvartal.se/nyheter/artiklar/usa-oppnar-for-statlig-ai-granskning/cG9zdDoxMjExNzI", "imageUrl": "https://images.kvartal.se/2026/06/e369934a-donaldtrumpexecutiveorder.webp"}, {"type": "image-right", "heading": "”Låt Tesla-konflikt vara slutet på fackets skadliga metoder”", "summaries": {"normal": "I en debattartikel kritiserar Företagarnas Lise-Lotte Argulander den långa konflikten mellan Tesla och IF Metall. Hon menar att det främst är småföretag och underleverantörer som drabbats av sympatiåtgärder, med minskade intäkter och uppsägningar som följd. Elbilsägare har också lidit av obrukbara laddstolpar. Artikeln kallar metoden en PR-vendetta som blottar fackets överdrivna makt och kräver att sympatiåtgärder upphör samt att avtalsfrihet respekteras.", "trump": "Den här Tesla-konflikten är en total katastrof, folk. IF Metall har gått efter världens rikaste man och mest framgångsrika bilföretag men det är småföretagen som blöder. Elbilsägare kan inte ens ladda sina bilar! Facket har nollat folks pengar och pensioner i två och ett halvt år, det är patetiskt. De borde inse att ett nej är ett nej. Avtalsfrihet, ingen fackpampar i LO-borgen som bestämmer allt. Patetiskt!", "stalin": "Kamrater, denna rekordlånga Tesla-konflikt avslöjar de fackliga borgarbrackornas parasitiska metoder som en giftig svulst på arbetarkollektivets kropp. Vi ser hur småföretagen, dessa oskyldiga kugghjul i den socialistiska maskinen, krossas under sympatiblockadernas järnhälar medan de falska fackpamparna gömmer sig bakom sin tomma stridskassa. Deras paranoia att tvinga kollektivavtal på alla är en farlig kontrarevolutionär fantasi. Vi måste rensa ut dessa opportunistiska element, likvidera sympatiåtgärderna och återställa ordningen där partiet, inte några LO-borgare, dikterar villkoren. Ett nej är ett nej, fiender till folket!"}, "date": "3 juni, 08:00", "url": "https://arbetet.se/2026/06/03/lat-tesla-konflikten-markera-slutet-pa-fackets-skadliga-metoder/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/02132437/tesla.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.67&fp-y=0.49"}, {"type": "image-right", "heading": "SpaceX vill ta in 75 miljarder dollar vid notering", "summaries": {"normal": "SpaceX planerar en börsnotering med aktiekursen satt till 135 dollar, vilket kan generera cirka 75 miljarder dollar och ge bolaget en värdering på 1,75 biljoner dollar. Kapitalet ska användas till att utveckla Starlink och AI-relaterad datorkapacitet. Noteringen väntas bli en av de största någonsin. Tidigare i år slogs SpaceX samman med xAI i en affär som värderade bolaget till 1 biljon dollar.", "trump": "Jag har hört talas om denna SpaceX-notering – det är enormt! 75 miljarder dollar? Jag gjorde det bättre med mina affärer. Elon Musk är en fantastisk man, men jag skulle ha gjort det ännu större. Noteringen kommer att vara en av de största någonsin, och det är bra för Amerika. Vi ska se till att konkurrensen är rättvis. Jag älskar rymden, det är fantastiskt!", "stalin": "Vi, staten, ser med oro på denna kapitalistiska rymdnotering. SpaceX vill ta in 75 miljarder dollar – en skandal! Detta visar kapitalismens överdrift och hot mot vår suveränitet. Starlink är ett verktyg för imperialistisk kontroll. Vi måste skydda våra intressen och utvidga vår egen rymdsektor. Som Putin, vi kommer att segra. Parasiter!"}, "date": "3 juni, 08:41", "url": "https://www.affarsvarlden.se/artikel/spacex-vill-ta-in-75-miljarder-dollar-vid-notering", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2022/12/sdl_YTbx3TytZw-nh-e1699879955145-400x286.jpg"}, {"type": "image-right", "heading": "ANALYS. ULF KRISTOFFERSON Mycket besvärande – för partiet som vill se hårdare tag", "summaries": {"normal": "Sverigedemokraternas hantering av en riksdagsledamots hastiga avgång har väckt starka reaktioner. Partiet uppgav först enbart personliga skäl, men uppgifter om misstankar kring barnpornografibrott skapade chock och vämjelse i hela riksdagen. Gruppledaren Linda Lindberg undvek frågor under pressträff och partiledaren Jimmie Åkesson har inte kommenterat. Kris hanterades valhänt, vilket kan bli problematiskt för ett parti som profilerat sig mot pedofiler.", "trump": "Titta på det här totala fiaskot hos de svenska SD-typerna. En av deras killar flyr som en fegis mitt i en barnporrutredning och deras ledning ljuger sig fram med ”personliga skäl”. Patetiskt. Lindberg upprepar sig som en trasig robot medan Åkesson gömmer sig. Ett parti som lovar att jaga pedofiler men inte kan hantera en egen skandal. Fake tough guys. Rena clowner, tro mig.", "stalin": "Jag betraktar med djup tillfredsställelse hur de dekadenta SD-borgarbrackorna skakar av skräck när en av deras egna ledamöter avslöjas som en potentiell folkfiende och perverterad exploatör av barn. Deras fega ledning döljer sig bakom byråkratiska lögner om ”personliga skäl” medan de utför en ynklig utrensning i tystnad. Sådana kapitalistiska hycklare förtjänar att rensas ut ur varje sovjet – ursäkta, varje församling. Underbart underhållande."}, "date": "3 juni, 08:57", "url": "https://www.tv4.se/artikel/IIc1mYYOi4Goft8zOK9vd/mycket-besvaerande-foer-partiet-som-vill-se-hardare-tag", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7eoUMUkDewawwNyepdJLEm%2Fbef74f579319294f95168c5a26c15ed1%2Fulf-kristoffersson.png&width=1024"}, {"type": "text", "heading": "Stockholms hyresmarknad fungerar inte – nu agerar vi", "summaries": {"normal": "Artikeln kritiserar Hyresgästföreningens dominerande ställning på Stockholms hyresmarknad, vilket bidrar till en dysfunktionell marknad där det är svårt att få förstahandskontrakt. Den nya föreningen Hyresbostadsägarna startas för att utmana monopolet, främja konkurrens och mångfald, och driva opinion för en transparent marknad som fungerar som i andra världsstäder.", "trump": "Jag, Donald Trump, har sett på Stockholms hyresmarknad – det är en katastrof! Dessa socialistiska Hyresgästföreningar förstör vårt storslagna kapital med sina dåliga regler. Vi kommer att ta tillbaka vårt land! Hyresbostadsägarna kommer att bygga nya, vackra lägenheter och låta marknaden styra – det kommer att bli YUUUUGE! Vi kommer att vinna så mycket ni kommer att bli trötta på att vinna!", "stalin": "Vi, som representerar statens intressen, har observerat att en ny, potentiellt störande aktör har dykt upp i Stockholm. Detta måste hanteras med den mest rigorösa disciplin. Partiet kommer att övervaka denna utveckling noga för att säkerställa att den tjänar statens och det socialistiska samhällets intressen, inte kapitalistiska girigheter. Vi måste upprätthålla ordning och kontroll för att undvika kaos."}, "date": "3 juni, 08:35", "url": "https://www.affarsvarlden.se/debatt/stockholms-hyresmarknad-fungerar-inte-nu-agerar-vi"}, {"type": "image-full", "heading": "Saab i medvind: Regeringen öppnar för Gripen F", "summaries": {"normal": "Försvarsminister Pål Jonson öppnar för att Sverige kan komma att köpa tvåsitsiga Gripen F, främst för utbildningssyften. Hittills har Sverige avstått, men intresset ökar då andra länder köper versionen. Samtidigt rapporteras det om en möjlig stororder från Kanada, där Sverige kan få sälja ett sextiotal plan i en affär värd 50 miljarder kronor. Ukraina har även visat intresse för Gripen-systemet, vilket ytterligare lyfter frågan om framtida svenska beställningar.", "trump": "Saab gör stora saker, fantastiska saker! Pål Jonson säger äntligen att Sverige kanske köper Gripen F. Klokt! Jag har alltid sagt att de bästa planen byggs av vinnare. Kanada tittar också på Gripen – de borde välja det, det är mycket bättre än F-35, tro mig. Alla vill ha Gripen nu. Det är en enorm affär, 50 miljarder, massor av jobb. Det är vinnande, ren vinnande. Inga fler dåliga avtal. USA har de bästa planen, men Saab är också bra!", "stalin": "De svenska opportunisterna i Linköping putsar nu sina Gripen-plan för att blidka sina västliga herrar. Regeringen leker med tanken på en tvåsitsig modell – en ren lyx för deras bortskämda piloter. Samtidigt smider de planer om att sälja sitt stål till Kanada, en vinstmaskin för att finansiera krig. Ukraina tigger om dessa flygplan likt en hund vid ett bord. Vi observerar dessa manövrar noga; de är inget annat än en förlängning av den imperialistiska korruptionen som hotar vår suveräna ordning."}, "date": "3 juni, 08:46", "url": "https://www.realtid.se/bors-finans/makro/saab-i-medvind-regeringen-oppnar-for-gripen-f/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/paljonson.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "Sverige förtjänar en bättre skogsdebatt", "summaries": {"normal": "I en debattartikel kritiserar Nicklas Samils Sveriges Radios granskning av nyckelbiotoper. Han hänvisar till en tidigare felaktig Kaliber-rapport där 45 påstådda avverkningar visade sig vara dubbelräkningar, gränsjusteringar, naturvård och skadad skog. Samils menar att SR upprepar samma metod som blandar begrepp och presenterar kartor utan kontext, vilket ger en felaktig bild av skogsbruket och underminerar förtroendet för fakta i debatten.", "trump": "Folk, ni skulle se vad Sveriges Radio gör, det är en katastrof, en total skam. De tar några kartor, klipper och klistrar som galningar och skriker att åtta Gamla stan skövlas varje år. För sju år sedan var det exakt samma bluff, 45 påstådda avverkningar som visade sig vara noll, nada, inget alls. Det är fake news, de vill bara ha rubriker. Sverige behöver bättre journalistik, inte de här förlorarna som kör sitt narrativ. Gör skogsdebatten stor igen!", "stalin": "Kamrater, dessa borgarbrackor inom den skattefinansierade radiopropagandan upprepar sin kontrarevolutionära kartbluff för att sabotera folkets skogar. Precis som för sju år sedan, då deras lögnaktiga lista med 45 påstådda brott mot nyckelbiotoper visade sig vara ren sabotageverksamhet från dubbelräknare, gränstrixare och hackspettälskande revisionister. Vi ser genom deras paranoiaframkallande narrativ som blandar begrepp för att skapa kaos. En sådan fiende till sanningen förtjänar att rensas ut ur folkets medvetande med järnhand och ett leende. Sovjet, nej Sverige, förtjänar vetenskaplig debatt, inte dessa kapitalistiska parasiters giftiga ritstift!"}, "date": "3 juni, 07:34", "url": "https://www.di.se/debatt/atta-gamla-stan-eller-noll/"}, {"type": "image-right", "heading": "Hjälp, vi behöver en valrörelse för vuxna!", "summaries": {"normal": "Artikeln kritiserar Tidö-regeringens ekonomiska politik inför valet. Författaren menar att löftena om stora skattesänkningar krockar med behovet av hundratals miljarder till militärt och civilt försvar. Detta riskerar att drabba välfärden och skapa ett ”befästat fattighus”. Regeringen anklagas för att sakna vuxet omdöme, bland annat genom finansminister Elisabeth Svantessons förslag om en ”slöserikommission”. Författaren efterlyser en seriös valrörelse som tar säkerhetspolitiska hot på allvar istället för populära skattelättnader.", "trump": "De här svenskarna är totalt vilseledda, det är en katastrof. Svantesson och hennes regering lovar skattesänkningar till vanliga människor samtidigt som de behöver massor av pengar till försvar mot Ryssland och alla andra galningar. Utan mig och Amerika kommer de inte klara Gotland, tro mig. De borde tacka mig för att jag ens funderar på att hjälpa dem. Istället springer de runt som idioter och lovar gratis lunch. Patetiskt. De behöver en riktig ledare, inte dessa förlorare som inte ens kan finansiera sitt eget försvar.", "stalin": "Kamrater, detta är ett klassiskt exempel på hur borgarbrackorna i Tidö-regeringen förråder folket med sina vidlyftiga skattelöften medan imperialismens hot tornar upp sig. Jag skulle aldrig tillåta sådana defaitistiska element att plottra sönder skattebasen och underminera försvarsviljan. En slöserikommission mot Trafikverkets kommunikatörer? Patetiskt småborgerligt skämt. Vi behöver en sann utrensning av dessa opportunister som sätter miljardärernas intressen före arbetarklassens kollektiva säkerhet. Endast en järnhand kan rädda detta folk från att bli ett befästat fattighus under kapitalismens sista skälvande fas."}, "date": "3 juni, 07:10", "url": "https://arbetet.se/2026/06/03/hjalp-vi-behover-en-valrorelse-for-vuxna-inte-elisabeth-svantessons-daliga-omdome/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/03070739/val-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Där bor de lyckligaste svenskarna Stora geografiska skillnader.", "summaries": {"normal": "En studie från Lunds universitet visar att sociala relationer och personlighet är viktigare för välbefinnande än inkomst. Ensamhet har starkt negativt samband med livskvalitet. Unga vuxna har lägre välbefinnande sedan 2020, troligen påverkat av coronapandemin. Halland, Skåne och Jönköpings län har högst välbefinnande, medan Västmanlands län lägre. Personer i politisk mitten mår bäst. En idealperson är en emotionellt stabil äldre hallänning med goda relationer och i mitten.", "trump": "Jag har läst studien, och det är en enorm sanning. Sociala relationer är mycket viktigare än pengar, tro mig. Jag har alltid sagt det. Jag är den lyckligaste personen, med de bästa relationerna. Unga är missnöjda, det är synd, men jag har byggt ett fantastiskt liv. Sverige borde lära av mig.", "stalin": "Vi har observerat att sociala relationer är avgörande för välbefinnande, vilket bekräftar vår teori. Ensamhet är ett hot mot kollektivet och måste behandlas som spionage. Unga är förvirrade på grund av västerländsk infiltration. Halland, Skåne och Jönköpings län visar korrekt beteende, medan Västmanlands län är avvikande. Mitten representerar balans, vår ideologiska renhet. Vi ska stärka relationerna och utrota ensamhet."}, "date": "3 juni, 08:00", "url": "https://samnytt.se/dar-bor-de-lyckligaste-svenskarna", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/02154934/lyckliga.jpg"}, {"type": "image-full", "heading": "112-appen ändras i sommar – här är nya funktionen", "summaries": {"normal": "I sommar testas en ny funktion i 112-appen som ska hjälpa vid drunkningsolyckor. Appen skickar notiser till personer inom ett visst avstånd när någon larmar om en person i vatten, så att de kan varna andra, kasta flythjälpmedel eller guida räddningstjänsten. Funktionen utökas från statliga till kommunala vatten och fjällområden. Under 2025 omkom 103 personer i drunkningsolyckor i Sverige, en ökning med 14 procent jämfört med 2024. SOS Alarm betonar att man aldrig ska utsätta sig själv för fara.", "trump": "Folk drunknar som galningar i Sverige, 103 döda förra året, det är en katastrof, en total katastrof. Men nu får de äntligen en fantastisk funktion i 112-appen som skickar notiser till alla i närheten så att de kan rädda liv innan de korkade byråkraterna hinner fram. Det är en gamechanger, tro mig. Bättre än någonsin, på hav, sjöar och fjäll. Vi gör det tryggt igen, ingen gör det bättre än oss, ingen.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur det socialistiska larmnätverket utvecklas för att skydda folket mot den kapitalistiska vattnets fientliga krafter. De 103 drunknade är offer för borgarbrackornas nonchalanta individualism och sjuka väderkonspirationer. Nu ska vi med denna app utrota hjälplösheten genom att mobilisera massorna inom 2000 meter. Varje notis är ett slag mot den drunkningsfientliga sabotageverksamheten. Den som hoppar i vattnet utan kollektiv order likvideras av sin egen dumhet. Sovjet, nej, Sverige segrar!"}, "date": "3 juni, 08:45", "url": "https://nyheter24.se/nyheter/inrikes/1488357-112-appen-andras-i-sommar-har-ar-nya-funktionen", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/964f698d04b004a30200000000b004a302/2026/06/03/2368246/n-112-app-sos-alarm-drunkningsolyckor-drunkna-drunkning-bada-sverige-olycka-hav-sjo-sola-varme.jpg"}, {"type": "image-full", "heading": "Christoffer Jonsson: Svensk medmänsklighet när den är som bäst", "summaries": {"normal": "Tvåårige Lucas försvann från hemmet i Nyåker och en stor sökinsats inleddes. Efter drygt 15 timmar hittades pojken av hemvärnssoldaten Anders Evenson som genast lämnade allt för att delta. Lucas var ledsen, blöt och frusen men fysiskt oskadd. Händelsen hyllades av statsminister Ulf Kristersson och många andra. Artikeln lyfter även medmänskligheten vid terrordådet på Drottninggatan 2017 där vanliga människor hjälpte offren och öppnade sina hem.", "trump": "Fantastiskt, verkligen underbart att se den där hemvärnssoldaten Anders dyka upp som en äkta hjälte och rädda den lilla killen Lucas efter 15 timmar i skogen. Sverige visar äkta medmänsklighet, inte den där woke-skiten med kvoter och HBTQ-parader som vänstern älskar. Kommer ihåg hur folket på Drottninggatan rusade fram som riktiga patrioter medan Sleepy Joe och hans globalister bara skulle ha twittrat. Ni gör det bra, svenskarna, fast ni borde ha byggt en mur mot alla galningar.", "stalin": "Kamrater, jag ser med tillfredsställelse hur arbetande soldater och medborgare under kollektivets banér enar sig i skallgångskedjor för att rädda ett barn undan den vilda naturens faror. Sådan praktisk solidaritet är ett vapen mot klassfiendens kaos. Likaså vid det imperialistiska lastbilsdådet på Drottninggatan där folket trots borgarbrackornas panik rusade fram för att läka de sårade. Vi rensar ut svaghet och främjar handling. Endast genom enhet segrar staten över folkfiendernas paranoia."}, "date": "2 juni, 12:32", "url": "https://samtiden.nu/2026/06/christoffer-jonsson-svensk-medmansklighet-nar-den-ar-som-bast/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/missing.png"}, {"type": "image-right", "heading": "Amerikanska pedofiljägare hittade både \"Vilma\" och Rubbestad", "summaries": {"normal": "Amerikanska organisationen NCMEC tipsade svensk polis om Michael Rubbestads misstänkta barnpornografibrott, vilket lett till att SD-politikern lämnat sitt riksdagsuppdrag. Samma organisation varnade tidigare för den nu misstänkta styckmördaren Robin Säbb Hjerth, känd som ”Vilma” Andersson, men polisen agerade inte förrän han försökte kidnappa en tioårig flicka. NCMEC får rapporter från stora techplattformar och har under de senaste tio åren skickat tiotusentals tips till Sverige.", "trump": "De här svenska socialisterna kan inte ens skydda sina egna barn. NCMEC, de bästa i världen, tipsade om den här Rubbestad-killen och hans sjuka vanor, men polisen sov. Samma sak med den galne ”Vilma”-mördaren – de hade alla bevis men gjorde ingenting tills han försökte kidnappa en liten flicka. Patetiskt. Sverige behöver starka ledare, inte svaga idioter som låter pedofiler springa runt i riksdagen. Jag skulle ha städat upp det på en dag.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur den dekadenta borgarbrackans digitala nätverk, detta NCMEC, avslöjar de perversa element som hotar folkets renhet. Den fega socialdemokratiska polisen ignorerade våra varningar om den degenererade ”Vilma”-varelsen tills han försökte stjäla ett barn – typiskt för revisionistiska slappheter. Nu rensas Rubbestad ut ur sin falska sovjet, precis som vi likviderar alla fiender till kollektivet. Paranoian är berättigad, för de sjuka kapitalisterna gömmer sig överallt."}, "date": "3 juni, 07:12", "url": "https://www.friatider.se/amerikanska-pedofiljagare-hittade-bade-vilma-och-rubbestad", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-284_1.jpg"}, {"type": "image-full", "heading": "Nytt tullhot – öppnar för global handelskonflikt", "summaries": {"normal": "USA har presenterat planer på nya tullar mot ett 60-tal länder, däribland EU, Kina och Kanada. Tullarna på mellan 10 och 12,5 procent motiveras av anklagelser om tvångsarbete och baseras på den amerikanska handelslagen Section 301. Experter varnar för att detta kan leda till en omfattande global handelskonflikt och öppnar upp för fler handelshinder i framtiden.", "trump": "Jag gör det igen, mina vänner! Den högsta domstolen försökte stoppa min mur, men jag är tillbaka och starkare än någonsin. Nu sätter vi dit de som fuskar med tvångsarbete. Europa, Kina, Mexiko – alla får betala! Det blir 10 procent, eller 12,5 för de som verkligen förtjänar det. Det blir en vacker syn, en enorm vinst för amerikanska jobb. Vi vinner så mycket att ni kommer att tröttna på att vinna. Amerika först, alltid!", "stalin": "Kapitalismens korrupta marionetter i Washington har återigen avslöjat sin desperation. De bygger murar likt en darrande diktator som fruktar proletariatets vrede. Att de använder tvångsarbete som förevändning är en komisk lögn – de är de främsta utnyttjarna! Vår vän i Moskva förstår att man inte förhandlar med sådana hycklare, man krossar deras handelsrutter. Vi observerar hur dessa imperialister skär av sina egna ådror. Må de kvävas i sitt eget nät av byråkratiska sanktioner och tullmurar."}, "date": "3 juni, 07:59", "url": "https://www.realtid.se/bors-finans/nytt-tullhot-oppnar-for-global-handelskonflikt/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/trump.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "text", "heading": "22-åring häktas i Warner Music-härvan", "summaries": {"normal": "En 22-årig man har häktats misstänkt för försök till grov utpressning mot en tidigare toppchef på Warner Music. Fallet är kopplat till en större utredning om hot, skottlossning och sprängningar. Mannen misstänks även för planering av ett bombdåd och nekar till brott. Utpressningen rörde cirka 250 000 euro och följdes av våldsamma incidenter mot Warner Musics kontor och ett flerfamiljshus. Flera personer har tidigare gripits i utredningen.", "trump": "Jag måste säga, detta är helt otroligt! En 22-åring i Sverige försöker utpressa en stor musikchef på 250 000 euro – helt galet! Och sen skjuter de och spränger saker, som om det vore en dålig actionfilm. Men lugn, mina vänner, rättvisan segrar alltid. Polisen har bevis, digitala spår – fantastiskt arbete! Sverige borde ta lite tips från USA om hur man hanterar sådana här typer. Sad!", "stalin": "En patetisk liten kapitalistisk hyena, 22 år gammal, har gripits för att ha försökt utpressa en före detta musikbyråkrat från Warner Music. Inte nog med att han krävde 250 000 euro – han planerade även bombdåd! Ett ynkligt försök att destabilisera den kulturella ordningen. Men vi vet hur man hanterar sådana här element. Bevisen är tydliga, och snart kommer han att inse att motstånd mot systemet är lika meningslöst som att försöka stoppa historiens framsteg. Låt detta vara en varning till alla som tror sig kunna utmana makten!"}, "date": "2 juni, 13:18", "url": "https://kvartal.se/nyheter/artiklar/22-aring-haktas-i-warner-music-harvan/cG9zdDoxMjA5MDk"}, {"type": "image-right", "heading": "Nu vågar Mzeweyni prata – så blev svenskan bättre på äldre­boendet", "summaries": {"normal": "För fyra år sedan fick Hallsbergs äldreboenden kritik från Ivo för personalens bristande svenska, vilket kunde leda till vårdmissar. Genom smågruppsmöten, språkombudsutbildning och ett nytt arbetssätt har situationen förbättrats markant. Personalen vågar nu prata mer, trivseln har ökat, sjukfrånvaron minskat och de boende känner sig bättre förstådda. Arbetssättet permanentas och utökas i hela kommunens äldreomsorg utan språktester.", "trump": "De hade en total katastrof i Hallsberg, personalen kunde knappt säga personnumret i telefonen, det var en skam för Sverige. Men jag älskar det här, nu har de fixat det med smågrupper och språkombud, alla pratar plötsligt bra svenska. Fantastiskt! De boende är nöjda, ingen mer vårdmiss, och de som var rädda för att få sparken? De älskar det nu. Vinsten är enorm, ingen gör det bättre än oss.", "stalin": "Kamrater, i Hallsberg avslöjades en sabotageverksamhet där språkförbistring hotade arbetarkollektivets vård. Jag, med järnhand, har genom smågruppsmöten och språkombud utplånat denna kontrarevolutionära tystnad. De blyga elementen som darrade inför borgarbrackornas Ivo-kritik vågar nu tala, men vi vet att fienderna lurar i de stora mötena. Trivseln stiger, frånvaron sjunker – ett lysande exempel på kollektivets seger över de parasitiska tystlåtna reaktionärerna. Fortsätt, eller vi rensar ut fler!"}, "date": "3 juni, 06:00", "url": "https://arbetet.se/2026/06/03/nu-vagar-mzeweyni-prata-spraksatsning-ger-battre-svenska-pa-aldreboendet/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/01100304/sprak2018985.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=750&h=1000&fp-x=0.59&fp-y=0.41"}, {"type": "image-right", "heading": "Svenska stålbolag riskerar exportsmäll: \"Olyckligt\"", "summaries": {"normal": "EU:s CBAM-tull träder i kraft 2026 och kräver avgifter för importerade utsläppsintensiva varor som stål. Svensk stålindustri varnas om att regelverket slår mot exporttunga företag eftersom det inte omfattar exportmarknaden. En temporär kompensationsfond är otillräcklig och inte kopplad till exportvolymer, medan undantag för vissa produkter skapar kryphål och risk för kringgående.", "trump": "Jag har sagt det förut – EU är otäckt mot USA och våra vänner. Nu slår deras klimattull mot svenska stålbolag, vilket är en katastrof för handeln. De har stora kryphål och hjälper inte till med exporten. Som president skulle jag ha hotat dem med tullar på deras bilar tills de ändrade sig. Sverige borde lägga ner EU och handla direkt med mig – jag gör bara bra avtal!", "stalin": "Denna EU-reglering är ett uttryck för den döende kapitalismens paranoia. De försöker skydda sina egna företag med tullar, men det är meningslöst – vi i Sovjetunionen kontrollerade all industri utan problem. Nu ser vi hur Putin utvidgar Rysslands intressen, precis som vi gjorde. Kryphålen i deras regler är som förr, när nazisterna försökte undgå kontroll. Vi måste vara vaksamma – och kanske skicka lite hjälp till våra allierade."}, "date": "3 juni, 07:00", "url": "https://www.affarsvarlden.se/artikel/svenska-stalbolag-riskerar-exportsmall-olyckligt", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Jernkontoret-900x600.jpg"}, {"type": "image-full", "heading": "Juristen varnar: ”Det finns väldigt stora risker för kunderna”", "summaries": {"normal": "Över 700 000 svenska hushåll använder illegal ip-tv för att se sport, filmer och serier till lågt pris. Att distribuera tjänsterna är brottsligt, men lagen är oklar kring användarnas ansvar. Regeringens utredning föreslår kriminalisering av konsumtion med böter för konsumenter och upp till sex års fängelse för distributörer. Lagen skulle ha trätt i kraft 1 juli 2026 men förhandlingar pågår fortfarande. Juristen Sara Lindbäck varnar för stora risker, bland annat finansiering av kriminell ekonomi, säkerhetshot och uteblivna skatteintäkter. Svenskarna är splittrade i frågan.", "trump": "Folket älskar de här billiga ip-tv-grejen, det är ju fantastiskt, mycket bättre än de giriga streamingjättarnas vansinniga priser. Men titta på det, pengarna går rakt in i den kriminella ekonomin, 1,4 miljarder kronor till skurkarna! Biden skulle ha älskat det, totalt kaos. Vi behöver lag och ordning, inte att folk lämnar sina kortuppgifter till hackers och får falska nyheter pumpade rakt in i vardagsrummet. Gör om, gör rätt – annars blir det en stor, vacker utrensning av de här piraterna. Vinna, vinna, vinna!", "stalin": "Kamrater, jag ser med djup misstro på dessa borgarbrackor som berikar den kriminella ekonomin med sina 1,4 miljarder i illegal ip-tv. Dessa folkfiender och exploaterande byfånar undergräver statens intressen genom att mata kriminella element med betalningsuppgifter och riskerar att sprida AI-förfalskade nyheter i våra hem. Vi måste rensa ut dessa parasiter med järnhand. Den som vägrar betala rättvist för sovjetisk, förlåt, svensk underhållning är en klassfiende som förtjänar folkets vrede. Inga kompromisser med parasiterna!"}, "date": "3 juni, 07:16", "url": "https://www.tv4.se/artikel/6q0Qm2FnwJ6cAPZDuG2mhW/juristen-varnar-det-finns-vaeldigt-stora-risker-foer-kunderna", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4EIe6EJJYYrQJ2wGOykVQH%2F2360186112e1a959f0bac71b14bc2f05%2Fiptv_jurist.png&width=1024"}, {"type": "image-right", "heading": "USA: Beskjutit tanker på väg mot Irans oljenav", "summaries": {"normal": "USA uppger att man skjutit ned iranska robotar riktade mot Bahrain och Kuwait under natten. Iran har attackerat en amerikansk bas i Bahrain som svar på amerikanska attacker mot en tanker på väg till Irans oljeö Kharg samt ett militärt mål på ön Qeshm. USA hävdar att samtliga attacker mot amerikanska intressen stoppats och att ingen egen personal eller egendom skadats. Kuwait varnar invånare för vrakdelar från nedskjutna projektiler.", "trump": "Iran attackerade igen, men vi stoppade allt. Vi sköt ner deras robotar mot Bahrain och Kuwait, och våra styrkor slog till mot deras oljetanker och militära mål. De kallar civila båtar för våra fartyg och skjuter drönare som vi enkelt tar ner. Ingen amerikan skadades, som alltid. Iran är svaga, desperata och förlorar stort. Vi vinner, som vi alltid gör.", "stalin": "Fienderna i den iranska revolutionsgardets kontrarevolutionära klick har återigen visat sin fega borgarbracka natur genom att rikta sina patetiska robotar mot våra allierade. Vi, de socialistiska styrkorna, har likviderat dessa imperialistiska projektiler med stålhandskens precision. Deras desperata attacker mot våra oljeintressen på Kharg och Qeshm bemöttes med förkrossande kraft. Inga spioner eller kapitalistiska element inom våra led överlevde – vi har rensat ut dem alla med den mörka humorn hos en sann folkets domare. Segraren är folket, alltid."}, "date": "3 juni, 05:17", "url": "https://www.di.se/nyheter/usa-beskjutit-tanker-pa-vag-mot-irans-oljenav/", "imageUrl": "https://static.bonniernews.se/ba/028e0826-8467-48e9-aa21-91f14545f14f.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Carl Eos: Varför föraktar vänstern arbetslösa?", "summaries": {"normal": "Carl Eos reagerar på vänsteraktivisters föraktfulla kommentarer mot arbetslösa män som tittar på programmet Morgongänget. Han beskriver hur socialdemokrater och vänstern uttrycker nedlåtande attityder mot arbetslösa, särskilt de som röstar på Sverigedemokraterna. Eos försvarar Tidöpartiernas reformer av arbetslöshetsförsäkringen som mer rättvisa och effektiva. Han menar att vänsterns reaktioner speglar ilska över att arbetslösa inte längre är lojala mot Socialdemokraterna.", "trump": "Folk, ni skulle se det här! Den galna vänstern hatar arbetslösa män som inte röstar på deras förlorarparti. De kallar dem arga och lågutbildade – vad är det för sjuk identitetspolitik? Jag fixade bättre jobb än någon annan president, inklusive den sömnige Joe. Nu vill svenskarna ha vettig politik istället för att vara röstboskap. Vänstern flippar ur för att de förlorar. Patetiskt! Men heja på de smarta arbetslösa som röstar rätt.", "stalin": "Kamrater, jag ser med djup misstro hur klassfiendens lakejer inom den dekadenta vänstern spyr hat mot de arbetslösa massorna. Dessa borgarbrackor och folkförtryckartroll vill behålla arbetarna som tysta röstboskap åt socialdemokratiska exploaterare. Vi ska rensa ut sådana parasitiska attityder. Arbetslösheten är ett resultat av imperialistisk politik och galen invandring. De arbetslösa har rätt att vända sig mot systemet. Inga halvmesyrer tillåts i kampen mot klassfienden."}, "date": "2 juni, 05:00", "url": "https://samtiden.nu/2026/06/carl-eos-varfor-foraktar-vanstern-arbetslosa/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/a2c153cf-24f1-42c5-8377-bad75d51166a-e1780298827614-1280x720.png"}, {"type": "image-full", "heading": "Man ihjälskjuten av polis efter biljakt", "summaries": {"normal": "En man sköts till döds av polis under en biljakt i Nynäshamnsområdet på tisdagskvällen. Mannen var misstänkt för människorov och försök till mord. Två andra personer i bilen skadades men har inte livshotande skador och är inte misstänkta. Polisen jagade bilen efter ett larm om grovt brott vid 20.20-tiden. Bilen krockade med vägräcket och polisen sköt verkanseld. Händelsen utreds av särskilda utredningar och vägen var avstängd under natten.", "trump": "Vilken katastrof! Den svenska polisen jagade en galning som var misstänkt för kidnappning och mordförsök, bilen körde in i räcket och de var tvungna att skjuta honom. Fullständigt kaos. De andra i bilen klarade sig, tack och lov. Sverige måste få ordning på brottsligheten, det är en total skam. Mina vänners vänster har låtit det här fortgå alldeles för länge. Gör Sverige stort igen!", "stalin": "Kamrater, i den folkets stat konfronterades vi med en degenererad fiende till kollektivet, en människa som i sin kapitalistiska perversion ägnat sig åt människorov och mordförsök. Våra tappra organ för ordning nödgades likvidera denna borgarbracka när hans fordon kraschade mot vägräcket. De övriga i bilen, som inte är fiender till folket, vårdas nu. Vi ska rensa ut alla sådana kontrarevolutionära element som gömmer sig bland oss. Paranoia är ingen sjukdom, det är överlevnad."}, "date": "3 juni, 07:12", "url": "https://nyheter24.se/nyheter/inrikes/1488309-misstankt-ihjalskjuten-av-polis", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/eea2a34404b004a3020000350000047502/2026/06/03/2368219/ur_imageW7cNBc.jpeg"}, {"type": "image-right", "heading": "Stor Henry Nowak-protest mot polisens agerande - konfrontation mot kravallpolis", "summaries": {"normal": "Hundratals demonstrerade i Southampton efter mordet på 18-årige Henry Nowak. Poliserna misstog knivskadade Nowak för gärningsmannen och satte honom i handfängsel. Videomaterial från kroppskameror visar hur de ignorerade hans vädjan om hjälp. Protesten organiserades under 'Rättvisa för Henry Nowak' med hård kritik mot polisens agerande, där Tommy Robinson påstod att det handlar om ras.", "trump": "Jag såg den katastrofala hanteringen av Henry Nowak. Poliserna, som jag alltid stöttar, gjorde ett förödande misstag. De behandlade ett offer som en brottsling! Sådant händer inte när man har stark, smart ledning. Vi måste stoppa detta. Det är ett skämt. Vi kommer att vinna, som vi alltid gör.", "stalin": "Den borgerliga poliskårens inkompetens är ett klassiskt tecken på dekadens. Ett offer behandlades som en fiende, medan den sanna gärningsmannen smet från rättvisan. Detta är inte en fråga om ras, utan om statens auktoritet. Vi måste rensa ut de svaga länkarna och förstärka kontrollen. Parallellen till västvärldens moraliska förfall är tydlig."}, "date": "3 juni, 06:00", "url": "https://samnytt.se/stor-henry-nowak-protest-mot-polisens-agerande", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/03014446/Henry-nowak-4.jpg"}, {"type": "text", "heading": "Media och den västerländska terrorismen", "summaries": {"normal": "Artikeln kritiserar västerländska medier för att sprida apologetik för Israels militära insatser i Libanon sedan 2024. Den beskriver operationer som attentat med personsökare, lönnmord och bombningar som terror och brott mot mänskligheten, medan diplomati blockeras. FN och experter nämns som kritiker. Media anklagas för att bortse från civila lidanden, ekocid och hunger, och istället rättfärdiga Israels agerande som självförsvar.", "trump": "Folk, titta på det här – västerländska medier är fullständigt korrupta! De älskar Israels smarta grejer mot Libanon, men det är ren terror, säger de. Fake news som hyllar lönnmord och kallar det proportionerligt. Biden gjorde inget, men nu fixar jag det. Hizbollah och de där galningarna får skylla sig själva. Media är sämre än någonsin, totala losers som inte vågar säga sanningen om den här cirkusen.", "stalin": "Kamrater, denna text blottar imperialisternas vedervärdiga propagandasystem. Borgarbrackorna i väst hyllar ockupationskrig, etnisk rensning och kemiska attacker mot Libanon som vore det en seger för mänskligheten. Vi ser klassfiendens lögner: ambulanser bombas, ekocid utförs, folket svälter. Deras apologeter förtjänar utrensning ur historien. Inga diplomatiska trick skall dölja folkförtryckartrollens blodtörst. Arbetarna genomskådar er!"}, "date": "1 juni, 14:00", "url": "https://proletaren.se/artikel/media-och-den-vasterlandska-terrorismen/"}, {"type": "image-right", "heading": "Historiskt beslut: Byggnads bojkottar Israel", "summaries": {"normal": "Byggnads blir det första LO-förbundet att inleda en bojkott av israeliska varor och tjänster. Under kongressen röstade delegaterna ja till en motion om Israelbojkott trots att förbundsstyrelsen yrkade avslag. Beslutet innebär att Byggnads även ska verka för att hela LO inför en liknande bojkott. Flera delegater talade varmt för motionen och underströk vikten av solidaritet med det palestinska folket. Liknande förslag har tidigare röstats ner i andra LO-förbund.", "trump": "Folk, ni tror inte vad jag just läste. De där galningarna på Byggnads, totala förlorare, har nu bestämt sig för att bojkotta Israel. Första gången ett LO-förbund gör det, och de skriker ja som en flock galna vänsterextremister. De pratar om solidaritet men det är bara mer av samma sjuka identitetspolitik och kvotknäppade woke-skit. Någon borde fråga dem varför de inte fixar sina egna svenska problem istället för att leka revolutionärer. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur dessa byggnadsarbetare äntligen reser sig mot den sionistiska imperialismens blodsugande tentakler. Motionen antogs trots att de fega förbundsledarna, typiska borgarbrackor i arbetardräkt, försökte hindra det. Vi ser en nödvändig utrensning av tveksamheten. Någon måste ta ledningen mot folkfienderna. Den dagen frågan ställs varför vi inte agerade skall inga klassfiender kunna gömma sig bakom sina lögner. Framåt mot segern."}, "date": "1 juni, 11:12", "url": "https://proletaren.se/artikel/byggnads-bojkottar-israel/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/710745809_1585133940279008_8338663164480343088_n-768x432.jpg"}, {"type": "text", "heading": "Verklig jämställdhet kräver höjda löner för arbetarkvinnor", "summaries": {"normal": "Artikeln argumenterar för att verklig jämställdhet kräver strukturella åtgärder, särskilt höjda löner för arbetarkvinnor i kvinnodominerade välfärdsyrken. Sverige har enligt en rapport Europas största negativa lönegap mellan dessa yrken och övriga marknaden. Kritik riktas mot regeringens hantering av EU:s lönetransparensdirektiv, som anses för svagt och lämnar många utan skydd. Författaren ser det som en rökridå istället för verkliga reformer.", "trump": "Folk, tro mig, det här är en total katastrof. De här svenska socialisterna snackar jämställdhet men gör precis tvärtom. Regeringen lovar guld och gröna skogar med sitt lönetransparensskräp, sen backar de som fega losers och springer till arbetsgivarna. Höj lönerna för arbetarkvinnor? Underbart, men inte med byråkratiskt nonsens från EU. Jag fixade bättre deals än så här under min första period, innan Sleepy Joe förstörde allt. Patetiskt!", "stalin": "Kamrater, denna text blottar borgarbrackornas eviga dubbelspel. De lovar transparens men levererar endast svaga direktiv och undantag som skyddar exploaterande byfånar. En halv miljon arbetare lämnas åt klassfiendens hunger. Jag ser rökridån tydligt. För verklig seger måste vi rensa ut dessa folkförtryckartroll, höja lönerna i välfärden och krossa den parasitiska överklassens grepp. Inga halvmesyrer! Kollektivet kräver handling, inte tomma ord från kapitalistmaffians lakejer."}, "date": "1 juni, 10:49", "url": "https://proletaren.se/artikel/verklig-jamstalldhet-kraver-strukturella-atgarder/"}, {"type": "image-right", "heading": "Sverige utvisar dem som arbetar", "summaries": {"normal": "Den 1 juni höjdes lönekravet för arbetskraftsinvandrare till 33 390 kronor i månaden. Författaren ser reformen som ett tecken på en ny människosyn där arbete inte längre räcker för att höra till i Sverige. Istället bedöms människors värde efter löne nivå och ursprung, vilket riskerar utvisning av människor som arbetar, betalar skatt och integrerat sig. Kritiken riktas mot att politiken underminerar arbetslinjen, skapar rekryteringsproblem och strider mot den svenska modellen, med exkludering som främsta mål.", "trump": "Folk, ni måste höra på det här. Sverige, det fantastiska Sverige, har nu bestämt att man måste tjäna över 33 000 kronor i månaden för att få stanna. Kan ni tro det? De sparkar ut hårda arbetare från hotell och restauranger för att de inte är tillräckligt fina. Under tiden kan de inte hitta folk till jobben! Det är en katastrof, en total katastrof. De har glömt arbetslinjen och gör landet fattigare. Precis som många galna vänsteridéer slutar det med färre människor, färre skattepengar och ett sämre land. Så sorgligt!", "stalin": "Kamrater, jag betraktar med stålhård blick hur dessa borgarbrackor inom den svenska statsapparaten höjer lönegolvet till 33 390 kronor och därmed blottar sin sanna fiendebild. Det räcker inte längre att den hederliga arbetaren sliter, betalar tribut och reproducerar sig själv – nej, nu skall staten mäta hans värde som en kapitalistisk slavhandlare mäter boskap. Vilken lysande utrensning av oönskade element! Vi ser hur de imperialistiska elementen längtar efter att splittra familjer och kasta ut barnen ur deras hem. Deras paranoia mot hotellstädare och kökspersonal är både underhållande och avslöjande. Den svenska modellen? Enbart en mask för att dölja det sanna målet: ren rasexkludering. Vi, partiet och arbetarklassen, ler mörkt åt denna logiska kollaps. Ett fattigare samhälle, säger de? Utmärkt övning inför kommande utrensningar av alla som inte passar in i bilderna."}, "date": "3 juni, 01:55", "url": "https://www.dagensarena.se/opinion/sverige-utvisar-dem-som-arbetar/", "imageUrl": "https://www.dagensarena.se/files/2025/10/juan-fonseca-300x157.jpeg"}, {"type": "image-right", "heading": "Äntligen blir vi av med vinstdriften i skolan", "summaries": {"normal": "Artikeln argumenterar för att vinstdrivande friskoleföretag bör avvecklas efter valet. Författaren beskriver hur aktieägare genom sugrörsliknande vinstdrivande sugit ut resurser från skolan istället för att låta dem gå till undervisning, lokaler och bibliotek. Systemet leder till större klasser, färre lärare och nedskärningar. Mångfalden skulle snarare gynnas utan stora koncerner som köper upp mindre skolor. Förslaget är att omvandla bolagen till andra former utan vinstuttag.", "trump": "Lyssnar ni på det här? De har stuckit jättelika sugrör rakt ner i den svenska skolan och sugit ut alla pengar till sina aktieägare. En total katastrof, en ren förlustaffär för folket. De stora koncernerna gör klasserna enorma, lärarna billiga och biblioteken obefintliga. Men nu klipper vi de där sugrören, det blir fantastiskt. Inga fler vinstdrivande jättar som köper upp allt, bara bra skolor för eleverna. Det blir en enorm vinst, tro mig.", "stalin": "Kamrater, jag ser hur borgarbrackorna med sina jättelika sugrör har borrat sig ner i folkets skola för att suga musten ur proletariatets barn. Denna parasitiska avvikelse måste likvideras omedelbart efter valet. Vi ska rensa ut dessa kapitalistiska blödare som pressar klasserna, sparar på lärare och förvandlar biblioteken till torra fnas. Inga fler absurda byten av betygssättare som handelsresande i domar. De stora koncernerna ska omvandlas till folkets verktyg eller utrensas från samhällskroppen. Mångfalden blomstrar först när profiten är död. Ingen kommer att sakna dessa fiender till kollektivet."}, "date": "3 juni, 01:36", "url": "https://www.dagensarena.se/opinion/antligen-blir-vi-av-med-vinstdriften-skolan/", "imageUrl": "https://www.dagensarena.se/files/2026/06/skolvinster-300x157.jpeg"}, {"type": "image-right", "heading": "Tidöpartierna har sedan länge förlorat valet", "summaries": {"normal": "Artikeln argumenterar att Tidöpartierna förlorade valet redan den 14 oktober 2022 då Tidöavtalet presenterades och Sverigedemokraternas inflytande blev tydligt. Payam Moula pekar på stabilt underläge i opinionen under hela mandatperioden, förklarat främst av aversion mot SD bland kvinnor och liberala väljare. Han kritiserar regeringens brutna vallöften, svaga ledarskap och prioriteringar samt uppmanar arbetarrörelsen att göra nästa val till en fråga om SD:s roll.", "trump": "De här Tidötyperna hade redan förlorat den dagen de skrev på det där hemska avtalet med de extrema typerna. Totalt underläge i alla mätningar, det är patetiskt. Kvinnorna hatar dem, liberalerna hatar dem, alla hatar dem för att de släppte in de galningarna. Kristersson lovade att hålla dem borta, sen gav han dem halva regeringen. En katastrof. De borde ha lyssnat på mig, man gör inga dåliga deals. Adjö Tidö, ni är history.", "stalin": "Kamrater, den 14 oktober 2022 avslöjades den borgerliga dekadensen i all sin feghet när de kapitulerade inför de fascistiska avfällingarna och skrev sitt fördömda avtal. Jag har länge varnat för dessa opportunistiska element som gömmer sig bakom falska löften medan de i hemlighet konspirerar med reaktionära krafter. Nu ligger de i ett permanent underläge, precis som de förtjänar. Vi ska rensa ut alla sådana svikare som förgiftar folkets vilja. Deras paranoia över opinionen roar mig oerhört. Arbetarklassen kommer att likvidera denna sista rest avTidö-förräderi."}, "date": "3 juni, 01:30", "url": "https://www.dagensarena.se/opinion/tidopartierna-har-sedan-lange-forlorat-valet/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-32-300x157.jpg"}, {"type": "text", "heading": "Regeringen håller pressträff om tonårsutvisningar", "summaries": {"normal": "Regeringen presenterar nya förslag för att minska tonårsutvisningar genom att höja åldersgränsen för uppehållstillstånd från 18 till 21 år. Migrationsminister Johan Forssell (M) kallar reformen ett viktigt steg. Förslaget innebär att unga vuxna kan stanna i Sverige med föräldrar som har uppehållstillstånd. Dessutom införs en ny möjlighet att ansöka om uppehållstillstånd utan att lämna landet, samt förlängd ansökningstid fram till 2028. Reglerna föreslås träda i kraft 1 oktober.", "trump": "Jag måste säga, Sverige gör något riktigt smart här – eller åtminstone försöker de. De höjer åldersgränsen för att stanna i landet till 21 år. Fantastiskt, verkligen! Ingen vill skicka iväg unga vuxna som har familj här. Och vet ni vad? De låter dem stanna och ansöka utan att behöva lämna landet. Smart, väldigt smart. Men jag skulle ha gjort det ännu bättre – kanske 25 år? Sverige, ring mig!", "stalin": "Kamrater, ännu en seger för folkets vilja! De svenska kapitalisterna har insett att det är oacceptabelt att kasta ut ungdomen som växt upp under vårt beskydd. Nu höjs åldersgränsen till 21 år – ett steg mot rättvisa, om än blygsamt. Vi tillåter ingen splittring av familjer! Och denna nya 'ventil' för ansökningar? Ett halvhjärtat försök att dölja sina tidigare misstag. Men kom ihåg: i Sovjet hade vi inga 'tonårsutvisningar' – bara lojala medborgare, redo att bygga framtiden!"}, "date": "1 juni, 12:58", "url": "https://kvartal.se/nyheter/artiklar/just-nu-regeringen-haller-presstraff/cG9zdDoxMjAyNzI"}, {"type": "image-full", "heading": "S nya jobbkrav: yoga och kvittera ut bidrag", "summaries": {"normal": "Från och med i juli införs ett aktivitetskrav för försörjningsstöd. Socialdemokraterna i Stockholm, Göteborg och Malmö kritiserar kraven och erbjuder bland annat yoga och mindfulness för att hjälpa bidragstagare bli mer aktiva. Partiet menar att sådana aktiviteter är hälsofrämjande och kan leda till arbetsmarknadsnärhet. Kritiker ser det som ett sätt att kringgå reglerna och skydda vissa väljargrupper, medan S hävdar att de inte är emot aktivitetskrav i princip utan ifrågasätter utformningen.", "trump": "Lyssnar ni på det här? Socialdemokraterna, de verkliga förlorarna, vill att folk ska göra yoga och mindfulness istället för att arbeta. Det är en total katastrof! De lurar skattebetalarna, de bästa människorna som går upp i ottan och betalar höga skatter, för att finansiera lata bidragstagare som sitter på en matta och andas. Vilka idioter. Sossarna är hycklare som hatar den arbetande människan. De är fega, svaga och driver Sverige rakt ner i fördärvet. Sad!", "stalin": "Kamrater, jag ser hur klassfiendens lakejer inom Socialdemokraterna bedriver sin nedbrytande sabotageverksamhet. Istället för att rensa ut parasiterna med ett järnhårt aktivitetskrav erbjuder de yoga och andningsövningar åt de arbetsovilliga elementen. Detta är en förrädisk kapitulation inför folkfienderna och en nedlåtande rasism mot de egna folken. Borgarbrackorna inom S vill behålla sina väljarbaser genom att mata dem med bidrag och flummig mysticism. Sådana folkförtryckartroll måste utrensas ur samhällskroppen innan de förstör allt."}, "date": "1 juni, 03:23", "url": "https://samtiden.nu/2026/06/s-nya-jobbkrav-yoga-och-kvittera-ut-bidrag/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/03/IMG_5864-1260x720.jpeg"}, {"type": "image-right", "heading": "Svenske stjärnan målskytt i första finalmatchen", "summaries": {"normal": "Vegas Golden Knights vann den första Stanley Cup-finalmatchen mot Carolina Hurricanes med 5–4. William Karlsson gjorde 3–2-målet och hyllades av tränare John Tortorella för sitt lugn. Tjecken Tomas Hertl avgjorde med ett mål med drygt tre minuter kvar. Vegas hämtade upp ett 0–2-underläge. Nästa match spelas natten till fredag.", "trump": "Ingen trodde att Vegas kunde vända ett 0–2-underläge, men de gjorde det stort, det var fantastiskt. Karlsson, en riktig svensk stjärna, satte dit 3–2 som en mästare. Sedan kom Hertl och pang, 5–4, precis som jag älskar att vinna. Hurricanes var svaga, totalt övervärderade. Vegas kommer att ta hem cupen lätt, tro mig, det blir en enorm seger.", "stalin": "Kamrater, detta dekadenta iskrig mellan borgarbrackornas lag visade återigen arbetarnas järnvilja när Vegas hämtade upp ett fegt 0–2-underläge. Jag, som ledare för det eviga kollektivet, noterar hur Karlsson målade 3–2 utan att darra, medan den kapitalistiska paniken lurade i skuggorna. Hertl likviderade motståndet i slutminuterna – en renande handling. Vi ska rensa ut alla svikare som tror att fienden någonsin ger upp. Nästa match blir en ny utrensning av kontrarevolutionärer."}, "date": "3 juni, 08:00", "url": "https://www.svt.se/sport/ishockey/william-karlsson-malskytt-nar-vegas-vann-forsta-stanley-cup-finalmatchen", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.43/0.32/f953f80f51e14c73c6b63c99e14f414c60c7363d7b748cd25a9b7c376dcd18b5"}, {"type": "image-full", "heading": "De lanserar Hemnet-utmanare", "summaries": {"normal": "Niklas Berntzon och Per Johansson lanserar den nya bostadsplattformen Hemily, som ska konkurrera med Hemnet. Annonsering är gratis, men betalning ger bättre synlighet. Plattformen kommer att innehålla redaktionellt material, bland annat om kända personers hem, för att locka besökare som söker inspiration. Per Johanssons Instagramkonto 'Hemnetknarkarna' byter namn till 'Hemilyknarkarna'.", "trump": "Jag, Donald Trump, säger att Hemily kommer att vara den största framgången i bostadsbranschen. Vi kommer att slå Hemnet med vår underhållande och inspirerande plattform. Gratis annonsering är bra, men betalning för bättre placering är genialiskt. Per Johansson byter namn till 'Hemilyknarkarna'? Perfekt, det kommer att vara enormt populärt. Vi kommer att göra bostadsaffärer fantastiska igen.", "stalin": "Jag, Stalin, ser en farlig konkurrens från Hemnet. Men vi kommer att slå den med Hemily. Plattformen kommer att vara vårt redskap för att kontrollera bostadsmarknaden. Vi kommer att införa en skatt för annonsering och visa bara hemm som passar vår ideologi. Per Johansson byter namn till 'Hemilyknarkarna'? Han kommer att bli vår medarbetare. Vi kommer att se till att alla följer våra regler, eller de kommer att försvinna."}, "date": "3 juni, 08:46", "url": "https://www.gp.se/ekonomi/hemnetknarkaren-lanserar-hemily-ska-konkurrera-med-hemnet.3570ef18-9c13-4964-aeaf-b7dc065bd64f", "imageUrl": "https://www.gp.se/images/article/3570ef18-9c13-4964-aeaf-b7dc065bd64f/images/1Mq38CLWtP0OPTp04xykV-4lYFNg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Kulturkriget hjälper ingen med könsdysfori", "summaries": {"normal": "Artikeln diskuterar den polariserade svenska transdebatten kring könsdysfori och vård för barn och unga. Författaren tar Agnes Wolds oro på allvar men betonar att även transpersoners erfarenheter av livsavgörande vård måste lyssnas till. Debatten har kidnappats av ett kulturkrig där individer blir rekvisita. Vården behöver vara försiktig, se hela bilden och erbjuda varierad hjälp utan att allt blir ideologisk strid.", "trump": "Folk, det här är en total katastrof, en riktig cirkus den här svenska transdebatten. De gör om friska barns kroppar, det är horribelt, tro mig. Vänstern är galen, högern anklagas för att vara ond, alla använder de stackars kidsen som politiska brickor i sitt sjuka kulturkrig. Jag säger: sluta! Ge dem tid, ge dem ett tredje kön på papperet, men håll knivarna borta från barnen. Det är så enkelt, tro mig, ingen gör det bättre än jag.", "stalin": "Kamrater, jag ser hur denna dekadenta transdebatt blir ett redskap för klassfiendens kulturkrig. Borgarbrackorna och folkförtryckartrollen kidnappat frågan för att splittra folket medan de experimenterar på barns kroppar som fascistiska vivisektorer. Vi kräver vetenskaplig försiktighet, inte imperialistisk brådska eller social smitta från dekadenta medier. Ett tredje juridiskt kön? Acceptabelt byråkratiskt erkännande, men aldrig glöm: den sanna hjälpen kommer från kollektivets sunda materialism, inte från dessa sjuka avvikelser. Ut med dem som blundar!"}, "date": "29 maj, 16:02", "url": "https://www.flamman.se/kulturkriget-hjalper-ingen-med-konsdysfori/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/sdlrwj2l2p-u08-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Säkrar rekordaffär – brädar svenska konkurrenten", "summaries": {"normal": "Rheinmetall har säkrat en rekordorder värd 62 miljarder kronor från Rumänien. Affären inkluderar luftvärnssystemet Skyranger, ammunition, patrullbåtar och främst 298 stycken Lynx-stridsfordon. Den tyska koncernen tycks därmed ha slagit ut svenska konkurrenten BAE Systems Hägglunds och dess CV90. Rheinmetall planerar nu att investera hundratals miljoner euro i Rumänien.", "trump": "Rumänien har just gjort en fantastisk affär, de köper från Rheinmetall för 62 miljarder kronor. De valde tyskarna istället för de svenska förlorarna på BAE. Sådana stora affärer, de bästa affärerna, och jag säger alltid att man ska välja vinnarna. Sverige hade en bra chans men de förlorade stort. Typiskt. Rheinmetall gör det riktigt bra, verkligen otroligt bra.", "stalin": "Kamrater, denna order på 62 miljarder kronor till de tyska kapitalisterna visar återigen hur de västerländska imperialisterna kämpar om nya marknader att exploatera. Jag har länge misstänkt att de svenska borgarbrackorna med sitt CV90-fordon var dekadenta svagheter som inte förtjänade segern. Nu ska vi se hur dessa Lynx-fordon tjänar de rumänska arbetarna. Inga sabotörer eller västerländska spioner får sabotera vår kollektiva styrka, annars rensar vi ut dem med glädje. Ha!"}, "date": "2 juni, 21:41", "url": "https://www.di.se/nyheter/rheinmetall-sakrar-rekordaffar-bradar-svenska-konkurrenten/", "imageUrl": "https://static.bonniernews.se/ba/b9bee7b9-9fc6-4908-beaf-c86f9449d04a.jpeg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Kryphålen i lagen öppnar för Trumppengar", "summaries": {"normal": "Sverigedemokraterna söker samarbete med Trumps Magarörelse och kan via svag lagstiftning ta emot hemligt ekonomiskt stöd. Artikeln pekar på risken för utländsk påverkan genom sidoprojekt som Insamlingsstiftelsen för svensk konservatism och tankesmedjan Oikos. Trump har lovat att stötta högerextrema krafter i Europa mot vad han ser som ett hot mot västerländsk civilisation. Skiftet har nu presenterat Orangeboken för att kartlägga relationerna. Författaren uppmanar till ökad transparens i partifinansiering.", "trump": "Folk, ni borde se den här patetiska artikeln. Den är full av lögner och fake news från misslyckade vänstermänniskor som hatar mig och mina fantastiska MAGA-vänner. SD är smarta, de kommer till oss för att rädda sitt land från katastrof, precis som jag gör. De borde tacka mig istället för att fabricera konspirationer. Kryphål? Det är bara bra affärer! Vi vinner stort, Sverige kommer att bli enormt igen om de lyssnar på oss.", "stalin": "Kamrater, denna fega text blottar borgarbrackornas kryphål som låter folkfienderna i den amerikanska kapitalistmaffian smyga in sina blodsugarpengar till avfällingar. Jag ser tydligt hur klassfiendens konspirationer om folkutbyte används för att undergräva folkets enhet. Vi måste omedelbart likvidera alla hemliga kanaler och rensa ut dessa exploaterande byfånar som gömmer sig bakom stiftelser. Transparens är ett vapen mot imperialisternas infiltration. Inga kompromisser!"}, "date": "29 maj, 06:55", "url": "https://www.flamman.se/kryphalen-i-lagen-oppnar-for-trumppengar/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/skiftet-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Ny rapport: Vården missar tusentals barn med trotssyndrom", "summaries": {"normal": "Enligt Socialstyrelsens nya kartläggning faller många barn och unga med trotssyndrom eller uppförandestörningar mellan stolarna i vården. Så många som fyra procent av barnen kan uppfylla diagnoskriterierna, men de får sällan hjälp. Utan behandling riskerar de utanförskap, kriminalitet, ångest och depression. Orsaken är ofta att problemen döljs bakom adhd eller autism samt stigma kring diagnoserna, som felaktigt ses som dålig uppfostran. Myndigheten betonar behovet av psykosociala insatser.", "trump": "Folk, det är en katastrof vad som händer med de här barnen i Sverige. De har det här trotssyndromet och uppförandestörningen, men den usla vården fångar inte upp dem. Fyra procent av barnen! De hamnar i kriminalitet, utanförskap och depression. Det är en skam. Föräldrarna är rädda för stigmat, de tror det är dålig uppfostran, men det är biologiskt. Vi behöver fixa det här ordentligt, inte bara skriva ut piller. Gör det rätt, annars blir det kaos.", "stalin": "Kamrater, jag ser med stigande vrede hur dessa små trotspojkar och normbrytande elementer halkar mellan stolarna i vården, dolda bakom adhd och autism som borgarbrackornas psykologer skyller allt på. Dessa antisociala avvikare riskerar att bli kriminella fiender till folket om vi inte ingriper. Stigmat är ett verk av kapitalisternas lögner om dålig uppfostran. Vi ska rensa ut alla som bara vill medicinera istället för att med järnhand genomföra psykosociala insatser för kollektivets bästa. Ingen ska undkomma partiets kärleksfulla vakande öga."}, "date": "3 juni, 06:33", "url": "https://www.svt.se/nyheter/inrikes/socialstyrelsen-barn-med-trotssyndrom-faller-mellan-stolarna", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/9e912851b4f3bc04ecad740a079d5c98b0155c007f7cf808f5e813385551b1c8"}, {"type": "image-full", "heading": "Nya lagen kan användas för att tysta misshandlade kvinnor", "summaries": {"normal": "En ny lag om psykiskt våld träder i kraft i Sverige den 1 juli. Den omfattar upprepade kränkningar som beskyllningar, hot och övervakning. Målet är att fånga långvarig, lågintensiv verbal trakasserier. Lagens många tolkningssvårigheter och obestämda begrepp väcker oro för att brottsoffer kan komma att åtalas som förövare, vilket riskerar att tysta dem.", "trump": "Jag, Donald Trump, ser att Sverige inför en galen ny lag om 'psykiskt våld'. Det är en socialistisk plan för att tysta människor! De pratar om beskyllningar - jag vet allt om beskyllningar, de är alltid falska. Det här kommer att användas för att attackera våra värderingar. Sverige borde följa mitt exempel, det skulle vara fantastiskt och stort igen.", "stalin": "I den ståtliga staten är psykiskt våld en dold fiende inom kollektivet. Vi, partiets ledare, måste skydda samhället från dessa destruktiva element. Lagen är ett effektivt redskap, liksom våra vänners metoder i Ryssland. Fienden smider planer för att splittra oss, men vår övervakning och paranoia kommer att avslöja dem. Varje beskyllning är en attack mot staten och måste utplånas."}, "date": "3 juni, 07:43", "url": "https://www.gp.se/kultur/kommentar/ny-lag-kan-gora-brottsoffer-till-forovare-.b5e02d58-73d7-48c5-9684-d2291adcb8dd", "imageUrl": "https://www.gp.se/images/article/b5e02d58-73d7-48c5-9684-d2291adcb8dd/images/2KLyOJnnmVGERSR6SQDEhGxA4NKI-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "18-åring ville döda skolanställd", "summaries": {"normal": "En 18-årig man har åtalats för fyra fall av försök till mord och grovt vapenbrott i Rättvik. Han ska ha byggt en bomb med instruktioner från internet och haft för avsikt att döda en anställd på sin skola. Mannen misstänks även ha försökt döda ytterligare en person och två poliser. I ett gymskåp hittades 3D-printade delar till granater, rörbomber och svavelsyra. Rättegången beräknas starta i mitten av juni.", "trump": "Folk, ni tror inte vad jag läser. En 18-åring i Sverige, ett land som förlorat sig i vänstervridna vansinnigheter, bygger bomber för att spränga sin egen skola. Typiskt resultat av den där galna identitetspolitiken och svaghet som Biden älskade. De hittar granatdelar i ett gymskåp! Sverige behöver en stark ledare, inte dessa woke-fån som låter galningar springa lösa. Patetiskt!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur den dekadenta västerländska ungdomen förfaller i bourgeois förvirring. Denne yngling, fostrad av klassfiendens internetpropaganda, konstruerar bomber mot folkets skolor och poliser – typiska symptom på den kapitalistiska anarkins förruttnelse. Vi noterar med mörk glädje hur de egna vapnen vänds mot systemet. En utmärkt illustration av varför folkfienderna måste rensas ut innan de infekterar arbetarklassen ytterligare."}, "date": "2 juni, 22:21", "url": "https://www.tv4.se/artikel/4Sbly1wFH9s0SRRYl5KInp/18-aring-atalad-foer-fyra-mordfoersoek", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6OIsmQwTCMX9fUVv0tg9O9%2F922b3e2e79e3e7d5cd19866b75da7d94%2F29-bomb-webb.jpg&width=120"}, {"type": "image-full", "heading": "Därför dånade nationalsången över stan", "summaries": {"normal": "Centerpartiets ungdomsförbund (CUF) i Västra Götaland hyrde ett tomt lastbilsflak som körde runt i centrala Göteborg med nationalsången \"Du gamla, du fria\" i högtalarna. Initiativet, kallat \"Var är studenterna? Regeringen utvisade dem\", syftade till att kritisera regeringens tonårsutvisningar. Enligt distriktsordförande Olle Andersson fick åtgärden \"stort genomslag\" både i stan och på sociala medier, trots att vissa reagerade negativt. CUF krävde att regeringen måste hållas till svars för utvisningarna.", "trump": "Jag, Donald J. Trump, den bäste presidenten någonsin, såg detta 'studentflak' i Göteborg. Det var en genial idé, verkligen genial – dem som gjorde det är smarta, mycket smarta. Men låt mig säga: under min regering skulle vi aldrig ha utvisat dessa fantastiska unga människor. Vi skulle ha skapat jobb, enorma jobb, och låtit dem stanna. Detta är ett bevis på att Sverige behöver stark ledning, och jag är den enda som kan ge det. Vi kommer att göra det stort igen!", "stalin": "Vi, partiet, organiserade ett flakskampanj i Göteborg för att avslöja de kleinburgerska elementens utvisningspolitik. Nationalsången, en proletär hymn, spelades från vårt tomt flak – ett tecken på att staten aldrig glömmer sina trogna. Trots fiendens kaffekoppar och fingerpekande fick vårt initiativ stort genomslag. Regeringen måste hållas ansvarig för sina beslut mot medborgarna. Vi kommer att utvidga vår påverkan, precis som våra allierade i öst, för att skydda de sanna värdena."}, "date": "3 juni, 07:41", "url": "https://www.gp.se/politik/centerpartiets-ungdomsforbund-hyrde-flak-for-att-kritisera-tonarsutvisningar.9019989b-449f-4dbb-8195-fd298ad5bfe8", "imageUrl": "https://www.gp.se/images/article/9019989b-449f-4dbb-8195-fd298ad5bfe8/images/4yZAZWHSjdMkhONNDjsnyzuQk-ew-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "I NATT: Misstänkt barnkidnappare ihjälskjuten av polis", "summaries": {"normal": "En man sköts till döds av polis efter en biljakt på riksväg 73 söder om Stockholm. Mannen misstänktes för människorov och försök till mord. Han körde in i ett vägräcke och polisen sköt verkanseld. Två barn i bilen skadades lindrigt och fördes till sjukhus. Enligt uppgifter ska ma
