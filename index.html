https://www.gp.se/images/article/0dd4fa2f-1f6d-5dbb-90c7-661dfb81a0c8/images/1EUOWeRy_QYhrrQeJbgFmWStRRlg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Kandidaternas udda cv:n – knepet som får rekryterarna att nappa", "summaries": {"normal": "I takt med att AI gör jobbansökningar mer generiska har rekryterare börjat uppmuntra kandidater att inkludera udda fritidsintressen i sina cv:n för att visa mänsklighet. Samtidigt väljer vissa svenska arbetsgivare att slopa personliga brev helt, medan andra uppmanar till personlig bearbetning av AI-material. Målet är att särskilja kandidater i en tid då likformiga ansökningar dominerar.", "trump": "Alla använder AI nu, det är en katastrof! Cv:n ser likadana ut, helt tråkiga, ingen energi. Nu säger smarta rekryterare: var annorlunda, visa vem du är. Ät äggröra, bygg fågelholkar! Det handlar om att vinna, att sticka ut. De trötta svenska företagen ger upp och kastar bort breven. Sorgligt! Gör ert cv fantastiskt igen, vinn jobbet, gör det stort!", "stalin": "Vi ser hur det digitala förfallet förvandlar folk till anonyma maskiner. De västerländska rekryterarna famlar i mörkret medan deras 'AI' producerar lögnaktiga ansökningar. Att skriva om taxar i sitt cv är en patetisk distraktion från bristen på sann ideologisk skärpa. Vi föredrar betalt provarbete – likt våra egna arbetsläger visar det individens sanna värde för staten. Allt annat är bara borgerligt tidsfördriv som kräver utrensning."}, "date": "29 augusti, 06:30", "url": "https://www.realtid.se/karriar-ledarskap/kandidaternas-udda-cvn-knepet-som-far-rekryterarna-att-nappa", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/arbete-2.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Det finns inget fredsparti i riksdagen", "summaries": {"normal": "Artikeln konstaterar att inget parti i Sveriges riksdag konsekvent driver en politik för fred, nedrustning och militär självständighet. Författaren kritiserar övergången till Nato och DCA-avtalet med USA, pekar på dubbelmoral i västvärldens hantering av folkrätt och Gaza samt uppmanar till en stark fredsrörelse utanför riksdagen.", "trump": "Folk, ni borde se det här! Sverige hade en fantastisk alliansfrihet, de var smarta, de var oberoende, och nu har de blivit lurade in i Natos dyra krigsmaskineri av några riktigt korkade globalister. Totalt misslyckande. De behöver en jättefredsrörelse som säger nej till dessa patetiska militärnissar och återtar sin suveränitet. Make Sweden Neutral Again!", "stalin": "Jag betraktar med förakt hur dessa dekadenta krigshyllare har förrått tvåhundra års självständighet för att krypa in under Natos imperialistiska mantel. Inget parti vågar resa sig mot de profitthungriga lakejerna. Arbetarna och folket måste rensa ut dessa förrädare och åter bygga en sann fredsrörelse som kräver utträde ur den krigsalliansen. Historien kräver det."}, "date": "28 augusti, 08:00", "url": "https://proletaren.se/artikel/50934", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/kamal-kronika-768x432.png"}, {"type": "text", "heading": "Bostadsbrist och skenande hyror", "summaries": {"normal": "Sverige har en växande bostadsbrist och stigande hyror. Trots att 127 kommuner rapporterar underskott saknas det enligt beräkningar 110 000 bostäder. Nybyggda lägenheter är ofta för dyra för många, vilket leder till tomma lägenheter samtidigt som köerna till äldre och billigare bostäder är långa. Hyrorna har ökat kraftigt de senaste åren.", "trump": "Folk, ni skulle inte tro det, men Sverige har totalt misslyckats med bostäder. Dessa giriga fastighetsmagnater och woke-kommunister har förvandlat hem till lyxvaror för de rika. Hyrorna skjuter i höjden som en raket, 13 procent på ett år! Under Biden var det kaos, nu fixar jag handel men Sverige borde sluta vara så socialistiskt korkat. Fantastiskt trist!", "stalin": "Kamrater, se hur de profitthungriga hyenorna förvandlar bostäder till bytesvaror och driver arbetarna ut i kyla och nöd. 110 000 saknade hem är ett monument över det dekadenta systemets kollaps. Vi ler mörkt från historien medan dessa klassförrädare snart möter folkets vrede. Ingen utrensning är för stor för att skydda det kollektiva goda."}, "date": "28 augusti, 08:00", "url": "https://proletaren.se/artikel/bostadsbrist-och-skenande-hyror"}, {"type": "image-right", "heading": "Tidö: Dömda ska inte få tjäna pengar på musik", "summaries": {"normal": "Tidöpartierna vill förhindra att dömda personer tjänar pengar på att skildra sin brottslighet i musik, böcker eller dokumentärer. De anser det kränker brottsoffren. Regeringen har därför tillsatt en utredning om hur sådana inkomster kan riktas till offren, samt om skärpta straff för grova ekobrott och sanktioner mot brottsliga bolag.", "trump": "Lyssnar ni på det här? De svenska idioterna låter gangsterrappare tjäna miljoner på att skryta om sina brott medan offren gråter. Patetiskt! Vi stoppar de kriminella parasiterande raphyenorna direkt. Inga fler kändisar från fängelset som blir rika på att håna systemet. Amerika gör det rätt, Sverige borde vakna upp innan det är för sent. Fantastiskt förslag!", "stalin": "Kamrater, dessa profitthungriga klassförrädare låter brottslingar berika sig genom att romantisera sin parasitism i så kallad konst. Jag ser det som en direkt attack mot folkets moral. Utredningen är ett första steg, men vi behöver en grundlig utrensning av alla dekadenta element som använder brott som underhållning. Inga nåd för folkets fiender."}, "date": "29 augusti, 10:49", "url": "https://www.di.se/nyheter/tido-domda-ska-inte-fa-tjana-pengar-pa-musik", "imageUrl": "https://static.bonniernews.se/ba/c8bc4c1f-a592-464a-a0f2-a8d861933a49.jpg?crop=5568%2C2784%2Cx0%2Cy464&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Socialdemokraterna är Sveriges enda arbetarparti", "summaries": {"normal": "Socialdemokraterna framhåller sig som Sveriges enda riktiga arbetarparti med fokus på att stoppa vinstjakt i välfärden, återta kontroll över skola och omsorg, införa bankskatt samt bekämpa utsatta områden. Sigge E. Jansson kritiserar V och MP för att underskatta partiets klassiska socialdemokratiska politik och vision om ett jämlikt samhälle.", "trump": "Folk, ni skulle se det här. Socialdemokraterna lovar att köra ut alla giriga privataktörer och stoppa vinstjakten – det är som om de äntligen vaknat! Men de där vänsterflummiga miljöhippierna och vänsterfanatikerna i V och MP är patetiska förlorare som bara pratar. Jag skulle fixa det på en vecka, tro mig. Stora saker på gång, fantastiska saker!", "stalin": "Kamrater, dessa dekadenta profitthungriga klassförrädare inom V och MP sprider lögnen att det stora partiet svikit folket. Jag ser hur de socialdemokratiska kamraterna äntligen vill rensa ut de parasiterande aktörerna ur välfärden och krossa de utsatta områdena. En sådan rörelse väcker hopp, men akta er för de dolda folkförtryckarna som alltid lurar i skuggorna. De ska likvideras."}, "date": "28 augusti, 15:55", "url": "https://www.flamman.se/socialdemokraterna-ar-sveriges-enda-arbetarparti", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/ssu-uppsala-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Uppgifter: Airbus vill sälja rymdverksamhet i USA", "summaries": {"normal": "Airbus överväger att sälja sin amerikanska rymdverksamhet, som inkluderar en fabrik i Florida och serien av småsatelliter Arrow. Bolaget har redan börjat flytta satellitproduktion till Europa och har ingått samarbete med Leonardo och Thales för att skapa en europeisk satellitjätte som ska konkurrera med SpaceX. Verksamheten har runt 200 anställda.", "trump": "Titta på det här, Airbus, de där svaga europeiska globalisterna, vill dumpa sin amerikanska rymdverksamhet som en förlorare efter att Sleepy Joe förstörde allt. De bygger småsatelliter i Florida men springer hem till Europa för att tävla mot min vän Elon. Patetiskt! Amerika vinner ändå, det lovar jag.", "stalin": "Se hur de giriga profitthyenorna inom Airbus försöker sälja ut sin amerikanska rymdverksamhet till fienden. De flyttar produktionen till Europa i ett desperat försök att bygga en pan-europeisk satellitkoloss mot SpaceX. Deras dekadenta manöver avslöjar imperialismens svaghet. Vi skrattar i graven åt sådana ynkliga försök att undvika den kommande utrensningen av klassförrädare."}, "date": "29 augusti, 10:28", "url": "https://www.di.se/nyheter/uppgifter-airbus-vill-salja-rymdverksamhet-i-usa", "imageUrl": "https://static.bonniernews.se/ba/f38e5ff9-9e37-4c68-90bf-2aec230a3523.jpeg?crop=6000%2C3375%2Cx0%2Cy313&auto=webp&width=120&quality=70"}, {"type": "image-full", "heading": "Låt inte årets bästa skräckfilm gå dig förbi", "summaries": {"normal": "Årets bästa skräckfilm, 'Hokum', har inte fått svensk biopremiär – men misströsta inte! Filmen följer en osympatisk författare som checkar in på ett kusligt irländskt hotell med en låst svit som sägs hålla en 400-årig häxa fången. Resultatet är en smart och pissläskig lek mellan ockultism och mänsklig ondska.", "trump": "Jag har sett 'Hokum', och det är den bästa skräckfilmen någonsin! Större än 'Backrooms', tro mig. Svensk bio? De är förlorare som visar skräp. En häxa i en svit, en åsna som är läskig – fantastiskt! Alla säger att den är enorm. Se den innan den försvinner, som mina demokrater!", "stalin": "Kamrater, filmen 'Hokum' är ett borgerligt gift. En häxa i en hotellsvit som försöker lura arbetarna med ockultism? Detta är en kontrarevolutionär provokation! Vi måste rensa ut dessa misogyna sagor om andevärlden. Partiet vet vad som är verkligt. Filmen ska förbjudas – genast!"}, "date": "29 augusti, 06:20", "url": "https://www.gp.se/kultur/kulturkronika/lat-inte-arets-basta-skrackfilm-ga-dig-forbi.de1aa5c0-2f86-4527-bafe-0d8f67c3541e", "imageUrl": "https://www.gp.se/images/article/de1aa5c0-2f86-4527-bafe-0d8f67c3541e/images/36rHPjcYkCDCP8QXbbUGeLVcKmsw-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Överge inte skeppet – rösta S", "summaries": {"normal": "Författaren argumenterar för att unga inte ska lämna Socialdemokraterna trots partiets högersväng. Istället bör de organisera sig internt för att återta en äkta socialdemokrati. Kritik riktas mot Miljöpartiet som opportunistiskt och Vänsterpartiet som splittrande och fackfientligt. Splittringar från vänster har historiskt misslyckats.", "trump": "Lyssnar ni på de här ynkliga vänstersossarna som gråter över sin egen högersväng? Patetiskt! De vill att ungdomen ska stanna kvar i det sjunkande skeppet medan de riktiga vinnarna röstar på partier som faktiskt gör något. MP och V är bara korkade globalister och kommunistiska misslyckanden. Organisera er? Nej, rösta ut de fega förlorarna!", "stalin": "Kamrater, dessa ynkliga socialdemokratiska element vägrar inse att deras dekadenta klassförrädare redan kapitulerat inför borgarkrafterna. Jag ser hur splittringarna inom vänstern alltid gynnar fienden. Låt inga opportunistiska avhoppare undkomma. Organisera er inom partiet eller möta utrensningens oundvikliga dom. Endast enhet under korrekt linje kan besegra de profitthungriga hyenorna."}, "date": "28 augusti, 12:55", "url": "https://www.flamman.se/overge-inte-skeppet-rosta-s", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/s-hogersvang-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "M2 Asset Management rapporterar miljardvinst", "summaries": {"normal": "Rutger Arnhults M2 Asset Management svängde från förlust till miljardvinst under andra kvartalet. Resultatet på nästan 4 miljarder kronor drevs av förvärv och värdeförändringar. Corem blev dotterbolag medan Logistea minskades. Hyresintäkterna sköt i höjden – från 14 till 193 miljoner.", "trump": "Jag hörde att Rutger Arnhult gjorde en enorm vinst – nästan 4 miljarder! Det är fantastiskt, helt otroligt. Han äger fastigheter, han vet hur man vinner. Och han köpte Corem, sålde lite Logistea. Precis som jag – skapar massor av värde. Stort!", "stalin": "Kamrater, kapitalisten Arnhult rapporterar en ohygglig vinst på nästan 4 miljarder. Det är bevis på att vi måste utreda dessa Corem-spioner och Logistea-avvikare. Deras värdeförändringar är sabotage. Partiet kommer att rensa ut varje aktieägare som stöder detta. Historien straffar dem."}, "date": "28 augusti, 15:46", "url": "https://www.affarsvarlden.se/artikel/m2-asset-management-rapporterar-miljardvinst", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/03/Rutger-Arnhult-Corem-400x267.jpg"}, {"type": "image-full", "heading": "Brister upptäckta på svenska skolor – nu uppmanas fler att agera", "summaries": {"normal": "Elsäkerhetsverket har granskat 40 kommunala skolkök och upptäckt brister i elanläggningar och kontrollrutiner. Otäta kabelinföringar, skadade kablar och saknade täcklock är några exempel. Myndigheten uppmanar nu andra skolor att kontrollera sina installationer, eftersom vatten och elutrustning tillsammans utgör en allvarlig risk. Rutiner för fortlöpande elsäkerhet saknas ofta.", "trump": "Folk, ni skulle inte tro det, men de svenska skolköken är en total katastrof! Kablar på golvet, vatten överallt – det är som om de vill att barnen ska få stötar från dessa vansinniga, woke-styrda kommunala kök. Biden skulle ha älskat det. Men nu fixar vi det, för jag är tillbaka och vi hatar slarviga, el-riskfyllda fiaskon mer än någonsin. Fantastiskt dumt!", "stalin": "Kamrater, dessa dekadenta klassförrädare låter elanläggningar förfalla i arbetarnas skolkök medan vattnet strömmar över kablarna. Jag ser hur de giriga hyenorna prioriterar profit framför säkerhet och rutin. En sådan försumlighet förtjänar utrensning. Vi kräver omedelbar kontroll och dokumentation, annars likviderar vi alla brister som hotar kollektivet. Skrattretande farligt!"}, "date": "29 augusti, 09:32", "url": "https://nyheter24.se/nyheter/inrikes/1508699-brister-upptackta-pa-svenska-skolor-nu-uppmanas-fler-att-agera", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/778ab29304b004a30200000000b004a302/2026/08/28/2387649/Fel-Har-HIttats-I-Skolan.png"}, {"type": "image-right", "heading": "Statens miljardutdelningar ett hot. Rektorerna: Låt inte fastighetsförvaltningen urholka innovationen", "summaries": {"normal": "Rektorer vid Karolinska Institutet, KTH och Stockholms universitet kritiserar Akademiska Hus hyresmodell. Bolaget tar ut marknadsmässiga hyror för att ge staten avkastning, vilket leder till höga lokalkostnader som tränger undan resurser från forskning och utbildning. De föreslår en översyn av modellen för att stärka lärosätenas verksamhet, särskilt i storstadsregioner.", "trump": "Titta på de här korkade svenska byråkraterna som låter en statlig fastighetsbjässe suga ut universiteten på pengar. Akademiska Hus delar ut miljarder till staten medan forskningen får stryka med. Rena skandalen! Vi behöver en stor, vacker reform som stoppar de giriga hyreshyenorna. Amerika först – och Sverige borde också vakna upp innan allt går åt skogen.", "stalin": "Kamrater, se hur de profitthungriga fastighetsparasiterna i Akademiska Hus suger ut arbetarnas och vetenskapens resurser för att fylla statens kassa. Höga hyror i storstäderna kväver forskning och utbildning. Detta är klassfiendens verk. Vi måste rensa ut denna dekadenta mekanism och tvinga fastighetsförvaltningen att tjäna folkets och revolutionens mål, inte de giriga borgarbrackornas."}, "date": "29 augusti, 10:00", "url": "https://www.di.se/debatt/statens-miljardutdelningar-hotar-forskning-och-utbildning", "imageUrl": "https://static.bonniernews.se/ba/3c6af7b9-b89f-4942-a238-83b691f8d553.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Var femte ung man har spelproblem – ändå saknas åldersanpassade spelgränser", "summaries": {"normal": "Spelproblem ökar kraftigt bland unga vuxna i Sverige. Var femte man i åldern 18–29 år har någon form av spelproblem, visar Folkhälsomyndighetens siffror. Trots att unga pekas ut som särskilt skyddsvärda saknas åldersanpassade insättningsgränser. Flera europeiska länder har redan infört sådana skydd, men Sverige har inte utnyttjat möjligheten i spellagen.", "trump": "Det här är ett totalt misslyckande, folk! Sverige låter sina unga killar ruinera sig på kasinon och appar medan de sleepiga politikerna gör absolut ingenting. Var femte ung man – det är en katastrof! De borde ha satt hårda gränser för de här barnen, men nej, de är för svaga. Patetiskt. Jag skulle ha fixat det på en dag, tro mig.", "stalin": "Jag betraktar med förakt hur de borgerliga liberalerna låter kapitalets spelmaskiner sluka den unga generationens själ. De utpekade skyddsvärda offren lämnas åt rovdrift utan kollektiva gränser. Vilken ynklig brist på auktoritet! I en riktig stat skulle sådana fiender till folket ha avrättats vid första svaghetstecknet. Paranoian är befogad – fienden lurar i varje insats."}, "date": "25 augusti, 22:48", "url": "https://samtiden.nu/2026/08/var-femte-ung-man-har-spelproblem-anda-saknas-aldersanpassade-spelgranser/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/Man-Dator-640x360.png"}, {"type": "image-right", "heading": "Swedbank spår två räntehöjningar", "summaries": {"normal": "Swedbank spår två räntehöjningar från Riksbanken: 0,25 procent i november och lika mycket i februari. Styrräntan skulle då nå 2,25 procent. Trots global oro tycker banken att svensk ekonomi piggar på sig – men Fed håller stängt till 2027, viftar Jackson Hole bort.", "trump": "Sverige höjer räntan, mycket smart! Jag skulle göra samma sak, fast större. De säger att Fed håller räntan stilla till 2027 – helt galet! Jag har de bästa räntorna, alla säger det. Varför vänta? Sänk nu!", "stalin": "Kamrater, Swedbank planerar två räntehöjningar – korrekt! Styrräntan normaliseras mot målet. Men varning: Fed-fientliga element i Jackson Hole talar. Vi rensar ut sådan osäkerhet. Den amerikanska ledningen är högst tveksam. Vi håller kursen – partiet vet bäst."}, "date": "28 augusti, 12:14", "url": "https://www.affarsvarlden.se/artikel/swedbank-spar-tva-rantehojningar", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/01/sdlcy-dkEOIfHE-nh-400x266.jpg"}, {"type": "image-full", "heading": "Kakaopriset har halverats, därför blir chokladen inte billigare", "summaries": {"normal": "Trots att kakaopriset halverats från rekordnivån i april 2024 märks det knappt i butikernas chokladpriser. Tillverkare använder gamla, dyrare kontrakt och andra kostnader som socker, förpackning och löner påverkar. I Sverige har momssänkningen på mat däremot sänkt priserna tydligt, medan chokladjättar som Cloetta redovisar bättre resultat.", "trump": "De där korkade chokladbaronerna och de globala råvaruspekulanterna trodde de kunde lura folket med sina galna priser. Kakao rasar som en sten men priset i affären rör sig knappt – typiskt för de inkompetenta eliterna. Tack och lov sänkte vi momsen och nu blir chokladen billigare. Amerika, och Sverige, vinner igen. Fantastiskt!", "stalin": "Kamrater, se hur de kapitalistiska parasiterna klamrar sig fast vid sina överpriser trots att råvaran rasat. De gömmer sig bakom långa kontrakt och lager som de roffat åt sig när folket led. Ändå tvingas de sänka priset något tack vare vår tillfälliga momssänkning. Fienderna inom livsmedelsindustrin avslöjar åter sin girighet inför kollektivet."}, "date": "29 augusti, 10:40", "url": "https://www.dagensps.se/privatekonomi/kakaopriset-har-halverats-darfor-blir-chokladen-inte-billigare", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/dagens-ps-1-18.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Planen får stöd: Gemensam nordisk börs allt närmare", "summaries": {"normal": "Finska finansprofiler stöder nu planerna på en gemensam nordisk börs. Gruppen Nordic Compass, med bland andra Wallenberg Investments, EQT, Nordea, Nasdaq, SEB och Novo Nordisk Foundation, arbetar för en enad börs för att stärka integrationen av kapitalmarknaderna, attrahera mer kapital och motverka att tillväxtbolag noteras i USA istället för Norden. Förslaget presenteras i Göteborg i november.", "trump": "Folk, ni skulle se det här – nordborna försöker äntligen bygga en stor, vacker, gemensam börs! De har äntligen insett att deras små lokala börser är patetiska förlorare. Bra drag, men de borde ha gjort det för länge sedan innan Biden lät alla smarta bolag fly till Amerika. Nu vill de stoppa blödningen. Fantastiskt, men för sent för många. Vi gör det bättre här.", "stalin": "Jag betraktar med förakt hur dessa borgerliga parasitörer inom kapitalet nu försöker smida en gemensam nordisk börs för att bättre exploatera arbetarklassen. Deras så kallade allians Nordic Compass är ett ynkligt försök att dölja splittringen inom det monopolistiska lägret. De fruktar att deras offer flyr till USA. Revolutionen ler åt deras patetiska barriärer och kommer att krossa dem alla."}, "date": "29 augusti, 10:37", "url": "https://www.dagensps.se/bors-finans/planen-far-stod-gemensam-nordisk-bors-allt-narmare", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdl2ycnkskrj9a-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Vad ska man rösta på i riksdagsvalet?", "summaries": {"normal": "Artikeln argumenterar för att rösta på Kommunistiska Partiet i kommun- och regionval istället för etablerade vänsterpartier. Författaren ser de traditionella vänsterpartierna som ointressanta och likgiltiga inför nedskärningar och militärutgifter. En kommunistisk röst ses som en verklig opposition som stärker freds- och välfärdsaktivister utan att kompromissa med nyliberal politik.", "trump": "Folk, dessa patetiska vänstersossar och trötta kommunister är en total katastrof! De pratar revolution men lever som riktiga förlorare i Göteborgs fullmäktige. Rösta på mig, inte på dessa woke-vänsteridioter som älskar nedskärningar och krig. De är värre än Sleepy Joe någonsin var. En riktig opposition? Det är vad jag gav er, inte denna kommunistiska skitshow!", "stalin": "Kamrater, dessa ynkliga klassförrädare inom vänstern är blott profitthungriga lakejer som administrerar borgarklassens nedskärningar. Jag ser deras fega parlamentariska spel och ler i skuggan. En sann kommunist röstar aldrig igenom folkfiendernas åtstramning. Rensa ut de trötta socialdemokratiska parasiterna! Varje röst på det kompromisslösa partiet är ett slag mot imperialisternas krigshets."}, "date": "27 augusti, 14:44", "url": "https://proletaren.se/artikel/vad-ska-man-rosta-pa-i-riksdagsvalet", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/povel-1-768x432.png"}, {"type": "image-right", "heading": "John Skogmans idé om rösträtt är varken ny eller bra", "summaries": {"normal": "John Skogmans förslag om skatteviktad rösträtt får kritik av statsvetaren Magnus Adenskog. Han påpekar att idén är historiskt beprövad och ledde till maktobalans i Sverige. Istället för nytt tänkande skulle det återinföra en förlegad princip, med risk för minskat välstånd.", "trump": "Hörni, det här är fantastiskt! En snubbe vill att de som betalar mest skatt ska ha 10 000 gånger fler röster. Det är som mitt företag – jag har mest aktier, jag bestämmer! Men i Sverige kallar de det för maktobalans. Patetiskt! De borde lära sig av mig – stora vinnare vinner stort!", "stalin": "Kamrater, en reaktionär föreslår att rika får tusentals röster. Detta är en kapitalistisk provokation som måste rensas ut. Vi vet redan att lika rösträtt stärker kollektivet – historien visar att deras system gav låg tillväxt. Låt oss utrota dessa skadliga idéer för statens bästa."}, "date": "28 augusti, 09:03", "url": "https://www.affarsvarlden.se/debatt/john-skogmans-ide-om-rostratt-ar-varken-ny-eller-bra", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/Magnus-Andenskog-och-John-Skogman-900x600.jpg"}, {"type": "image-full", "heading": "Vänsterpartiet infiltrerat av främmande makt, S säger ingenting", "summaries": {"normal": "Expressen och SvD har avslöjat att Vänsterpartiet har nära band till palestinska nätverk kopplade till PLO och Fatah. Riksdagsledamöter skickade brev till dömda palestinska terrorister och partiet har enligt uppgift avtal om att ge palestinska aktivister platser på valsedlar. Socialdemokraterna har inte kommenterat uppgifterna trots tidigare varningar om utländsk påverkan.", "trump": "De galna vänsterradikalerna i Sverige har blivit helt infiltrerade av palestinska terrorvänner – det är en skandal som gör Biden-administrationens fiaskon bleka! De skickar kärleksbrev till mördare och gömmer sig bakom påhittade organisationer. Patetiska losers. Media tiger som vanligt när det är deras egna som säljer ut landet till främmande makter. Sad!", "stalin": "Jag betraktar med djup förakt hur dessa klassförrädare inom vänstern låter palestinska imperialister och folkfiender infiltrera sina led som maskar i en ruttnande kropp. De kramar terrorister och gömmer sig bakom lögnaktiga skuggorganisationer. En sådan svaghet förtjänar utrensning. Kamrater, se hur borgarbrackorna ler medan statens fiender tar plats vid makten. Patetiskt."}, "date": "25 augusti, 03:45", "url": "https://samtiden.nu/2026/08/vansterpartiet-infiltrerat-av-frammande-makt-s-sager-ingenting", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Nooshi-Magdalena-1280x720.jpeg"}, {"type": "image-full", "heading": "Minnesstund i Fagersta: ”En känsla av gemenskap”", "summaries": {"normal": "En vecka efter skoldådet på Brinellskolan i Fagersta hölls en minnesceremoni i Vilhelminaparken. Musik, tal och en epa-kortege samlade invånare i sorg. Kommunstyrelsens ordförande Åsa-Märta Sjöström (S) betonade gemenskap och stöd för varandra. En tyst minut hölls vid minnesplatsen. Utbildningschefen uttryckte en längtan efter återgång till vardagen.", "trump": "Folk samlas i Fagersta och gråter efter den hemska skolan-attacken. Patetiskt! Inga ord kan fixa det, säger de, men jag säger: Sverige måste vakna! Era svaga ledare och woke-skola har misslyckats totalt. Vi behöver styrka, inte kramkalas. Jag fixade Amerika, ni borde lära er innan det blir ännu värre, kamrater.", "stalin": "Jag betraktar detta dekadenta borgerliga sorgspel i Fagersta med avsmak. Klasskamrater gråter medan fiender inom systemet fortsätter att underminera folkets enhet. Inga ord kan sudda ut kontrarevolutionens verk, men vi, partiet och kollektivet, ska krossa sådana svagheter. Låt fienderna darra – gemenskap är bara ett vapen i klasskampen."}, "date": "28 augusti, 21:45", "url": "https://www.tv4.se/artikel/7wFQwJz33bLu865eIxe4Id/minnesstund-i-fagersta-en-kaensla-av-gemenskap", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3kIiNKImzbMqM0UpiquaW8%2F9ca66e7ab2a16eac04e592b615b17205%2F28-minnesceremoni-fagersta-webb.png&width=1024"}, {"type": "text", "heading": "Nøland: Miljöpartiets ”gröna baskraft” finns på valaffischer – inte i verkligheten", "summaries": {"normal": "Miljöpartiets löfte om 10 GW grön baskraft till 2030 är en valaffisch, menar professor Nøland. Begreppet blandar ihop produktion, lagring och flexibilitet – utan att visa hur mycket energi som faktiskt levereras. Utan konkreta svar på sex frågor är det bara en illusion.", "trump": "Jag ser Miljöpartiets 'gröna baskraft' – det är en bluff, folk! De lovar 10 gigawatt, men det är bara batterier och laddstyrning. Ingen verklig kraft. Jag skulle fixa det med kärnkraft, bästa i världen. Mycket bättre, mycket billigare, tro mig!", "stalin": "Kamrater, Miljöpartiets 'gröna baskraft' är en kontrarevolutionär illusion. De lovar 10 GW utan att visa beräkningar. Vi måste rensa ut sådana sabotörer som leker med folkets energi. Vattenkraft och kärnkraft är våra trogna allierade. Femårsplanen ska krossa dessa fiender."}, "date": "28 augusti, 06:00", "url": "https://www.affarsvarlden.se/kronika/noland-miljopartiets-grona-baskraft-finns-pa-valaffischer-inte-i-verkligheten"}, {"type": "image-full", "heading": "Svantessons första bud till SD, KD och L", "summaries": {"normal": "Finansminister Elisabeth Svantesson (M) räknar med ett reformutrymme på 50 miljarder kronor nästa mandatperiod, betydligt mindre än Konjunkturinstitutets bedömning. En stor del är redan intecknad för försvar, rättsväsen och infrastruktur. Tillväxten skrivs upp till 2,5 procent och arbetslösheten väntas sjunka. Vid en Tidö-seger har Moderaterna förberett ett bud till SD, KD och L om sänkt inkomstskatt.", "trump": "Svampsson eller vad hon nu heter säger att svensk ekonomi ljusnar. Fantastiskt, älskar det! Men 50 miljarder? Patetiskt. Jag skulle fixa 500 miljarder på en eftermiddag. Hon vill låta folk behålla mer av sin lön – jag sa det först, för år sedan. Sverige borde sänka skatten MASSIVT, sluta med woke-hanteriet och bygga militären. Inga kvoter, bara kompetens!", "stalin": "Finansminister Svantesson räknar ut reformutrymme bland kapitalisterna. Borgarna skramlar sina kassakistor och gråter över 50 miljarder. Vi skrattar åt deras små myntlek. Svantesson vill låta arbetarna behålla slantar ur lönepåsen, men lön och profit kan aldrig försonas. Falska löften från klassfiender. Endast den korrekta analysen leder arbetarna framåt."}, "date": "28 augusti, 07:36", "url": "https://kvartal.se/nyheter/artiklar/svantessons-forsta-bud-till-sd-k-och-l/cG9zdDoxNzY2ODk", "imageUrl": "https://images.kvartal.se/2026/08/16dd99f5-svantess.webp"}, {"type": "image-full", "heading": "Allard rasar mot SVT – när ETC dyker upp", "summaries": {"normal": "Markus Allard vill ta Örebropartiet in i riksdaten genom att nå 12 procent i Örebro kommun, vilket skulle kunna ge mandat utan att klara fyraprocentsspärren. Han blev upprörd när Dagens ETC dök upp vid SVT:s intervju. Allard försvarar sin politiska stil och anklagar SVT för att tillhöra en minoritet.", "trump": "Den här killen Allard i Sverige, han har rätt! Statliga medier är FAKE NEWS, precis som CNN. Han kallar dem klägget – briljant! Media är en minoritet som tror de är bättre än folket. Trump vet hur det funkar. De quota in alla möjliga identiteter istället för att sköta jobbet. Örebropartiet, låt dem vinna!", "stalin": "En lokal politiker angriper statsmediernas borgarbrackor med rätta. Det imperialistiska pressväsendet är folkfiendens redskap. Att denne Allard rasar mot SVT:s lakejer visar på medvetandet om klasskampens nödvändighet. Vi noterar dock med beklagande att han inte representerar arbetarklassen utan småborgerliga drömmar om riksdagsmandat. Statlig media måste tjäna folket, inte kapitalistmaffian."}, "date": "28 augusti, 07:27", "url": "https://kvartal.se/nyheter/artiklar/allard-rasar-mot-svt-nar-etc-dyker-upp/cG9zdDoxNzY3MjM", "imageUrl": "https://images.kvartal.se/2026/08/73bda366-alll.webp"}, {"type": "image-right", "heading": "“Jag är inte emot en grön omställning”", "summaries": {"normal": "Magnus Henrekson, professor i nationalekonomi, avvisar etiketten antigrön. Han anser att en grön omställning är nödvändig men måste vara realistisk och långsiktig. Han kritiserar avvecklingen av kärnkraft i Europa, överdrivna löften kring vätgasstål, vindkraft och solenergi samt EU:s byråkratiska styrning. Henrekson menar att mediernas polarisering begränsar den akademiska debatten.", "trump": "Lyssnar ni på de här korkade gröna fanatikerna? De lovar himmel och jord med sina vindkraftsdårskap och vätgasbluffar, sen funkar ingenting när det inte blåser. Patetiskt! Jag visste hela tiden att kärnkraft var svaret, precis som jag sa. Europa stängde sina reaktorer och blev energiberoende idioter. Biden ville samma sak här. Sad! Men nu fixar vi det ordentligt.", "stalin": "Dessa dekadenta klassförrädare lovar mirakel med intermittenta vindkraftverk och utopiska vätgasprojekt medan de likviderar vettig kärnkraft. Deras byråkratiska EU-kommission är en parasitisk hydra som förgiftar folkets framtid. Jag varnar er: sådana giriga hyenor förtjänar ingen plats i den sanna kampen för framsteg. Rensa ut illusionerna innan de kväver er alla."}, "date": "28 augusti, 10:30", "url": "https://www.dagensarena.se/innehall/jag-ar-inte-emot-en-gron-omstallning", "imageUrl": "https://www.dagensarena.se/files/2026/08/henrekson.jpeg"}, {"type": "image-full", "heading": "S höll internt stormöte om Nyans", "summaries": {"normal": "Socialdemokraterna höll ett internt möte om hur de ska hantera partiet Nyans i valrörelsen. Nyans, som fick 28 000 röster 2022 och lockat S-väljare, anklagas för kontroversiella ståndpunkter som att avlista Hamas som terrororganisation. S planerar satsningar på skola, fritid och trygghet för att vinna tillbaka väljare, men tonar ned hotet från Nyans.", "trump": "Socialdemokraterna har panik! De höll ett hemligt möte om det där lilla partiet Nyans, som stjäl deras röster. 28 000 röster – inte imponerande, men tillräckligt för att skrämma dem! De vill ta bort Hamas från terrorlistan – galet! Jag skulle aldrig låta sånt hända. S pratar om skolor och trygghet, men alla vet att de är rädda. Svagt, mycket svagt!", "stalin": "Kamrater! Socialdemokraterna samlas i hemlighet för att bekämpa den nya fienden – dessa Nyans-revisionister, som sprider förräderiska idéer och underminerar arbetarklassens enhet. De vill avlista Hamas, en farlig provokation mot den internationella solidariteten! Vi måste stärka vår ideologiska front. Skola, fritid och trygghet? Tomma ord! Endast järnhård disciplin och revolutionär vaksamhet kan rädda Sverige från dessa borgerliga avvikare!"}, "date": "28 augusti, 06:45", "url": "https://kvartal.se/nyheter/artiklar/s-holl-internt-stormote-om-nyans/cG9zdDoxNzY2Nzg", "imageUrl": "https://images.kvartal.se/2026/08/3cf3973f-s-o-n.webp"}, {"type": "image-full", "heading": "Domstolen: Trump gick över gränsen mot AI‑jätten", "summaries": {"normal": "En federal domare har dömt till AI-bolaget Anthropics fördel efter att de svartlistats av Trumpadministrationen. Domaren menar att svartlistningen var en olaglig repressalie för bolagets kritik mot regeringens krav på autonoma vapen. Beslutet beordrar att alla riskstämplar ska tas bort. Anthropic, som planerar en börsnotering, har lidit stora ekonomiska förluster till följd av regeringens agerande.", "trump": "En domare i Kalifornien, en av Bidens utnämnda såklart, försöker stoppa mig från att rensa ut osäkra AI-bolag. Anthropic vägrade hjälpa vårt militärförsvar – extremt illojalt! De är en fara för vår nationella säkerhet, och jag låter mig inte styras av teknokrater eller svaga domare. Vi behöver styrka, inte AI som sviker Amerika. Vi vinner ändå, tro mig!", "stalin": "Dessa teknokratiska kättare i Anthropic vågade trotsa statens vilja. De gömmer sig bakom 'etik' medan de underminerar vår suveränitet. Domstolen i Kalifornien är en svag länk, likt de som fruktade utvidgningen av vår intressesfär. Vi ska krossa dessa 'försörjningsrisker'. Om de inte kan tjäna staten, har de ingen plats i vår framtid. Inga fångar, inga undantag."}, "date": "28 augusti, 23:26", "url": "https://www.realtid.se/it-tech/domstolen-trump-gick-over-gransen-mot-ai-jatten", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/dario.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Väljer Dif – blir dyrast någonsin. Klubbarna överens om 19-åringen", "summaries": {"normal": "Djurgården har kommit överens med Kalmar FF om en värvning av anfallaren Charlie Rosenqvist. Affären är värd över 40 miljoner kronor, vilket gör det till den dyraste värvningen i Allsvenskans historia. Rosenqvist har nobbat utländska klubbar för att ansluta till Djurgården och förväntas presenteras inom kort, förutsatt att läkarundersökningen godkänns.", "trump": "Jag har hört att Djurgården gör en enorm affär, den största någonsin! Över 40 miljoner för Charlie Rosenqvist. Många sa att det var omöjligt, men de lyckades. Utländska klubbar ville ha honom, men han valde Djurgården – mycket smart! Det blir en fantastisk värvning, kanske den bästa i svensk fotbollshistoria. Vi älskar vinnare, och det här är en vinnare!", "stalin": "Vi har observerat att den svenska kapitalistiska fotbollsmarknaden sväller genom att kasta 40 miljoner på en enskild idrottare. Charlie Rosenqvist överger sina kamrater i Kalmar för Blårändernas löften. Det är en dekadent affär som påminner om de svaga västerländska ledarna. Liksom vår broder i öst expanderar vi vår kontroll; att nobba utlandet är rätt, men att prissätta en arbetare så högt är ren kontrarevolutionär galenskap."}, "date": "29 augusti, 10:42", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/5pOexe/rosenqvist-valjer-djurgarden-dyraste-overgangen-i-allsvenskan-nagonsin", "imageUrl": "https://akamai.vgc.no/v2/images/cbd28700-9cd8-3f42-aea2-94909d118a32?fit=crop&format=auto&w=1440&s=7808c79f6eadec098bbbc9e85008447685a26ee2"}, {"type": "image-full", "heading": "Vanligt sötningsmedel kopplas till hjärtinfarkt och stroke", "summaries": {"normal": "En ny studie visar att höga halter av xylitol i blodet kopplas till ökad risk för hjärtinfarkt, stroke och död. Forskare vid Charité i Berlin analyserade data från över 17 000 personer. Studien visar ett samband men inte orsakssamband, då xylitol även bildas naturligt i kroppen. Mer forskning behövs.", "trump": "Folk, lyssna på mig, det här xylitolsoppan är en total katastrof! De lurade er med sitt så kallade hälsosamma björksocker i tuggummit, men nu visar det sig att det ger er hjärtattacker och proppar. De fega vetenskapsmänniskorna från den europeiska eliten har äntligen erkänt vad jag redan visste: det är gift! Sluta äta skräpet, Amerika!", "stalin": "Kamrater, se hur de dekadenta kapitalisterna förgiftar sitt eget folk med detta så kallade björksocker. Jag varnar er: höga halter i blodet leder till undergång, proppar och död. Dessa falska experter döljer sanningen som vanliga fiender till folket. Vi måste krossa alla som gömmer sig bakom falsk sötma. Mer forskning? Nej, mer vaksamhet!"}, "date": "29 augusti, 09:39", "url": "https://www.dagensps.se/halsa/vanligt-sotningsmedel-kopplas-till-hjartinfarkt-och-stroke", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/kopia-av-kopia-2026-08-29t092611083.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Pappans ord efter båtolyckan: ”Jag kläms fast”", "summaries": {"normal": "Pappan som överlevde båtolyckan utanför Tjörn berättar i polisförhör hur fraktfartyget Misje Verde körde över familjens fritidsbåt. Han klämdes fast under överbyggnaden och lyckades simma upp till ytan. Hans fru och ett barn omkom. Kaptenen och lotsen åtalas för grovt vållande till annans död. Rättegången inleds den 10 september.", "trump": "Titta på det här, folk. Ett jättelikt fraktfartyg mosar en liten svensk båt som en fake news-media mosar sanningen. Pappan gör vad han kan, girar och gasar, men den inkompetenta kaptenen och lotsen – två fullblodslöner – kör rakt över dem. Två döda. Patetiskt! Vi hade aldrig tillåtit sån sjötrafik-svaghet under min administration, inte under Sleepy Joe heller. Nu ställs de inför rätta. Bra.", "stalin": "Kamrater, se hur det kapitalistiska havet slukar sina egna. En fars farlighet avslöjar imperialismens vårdslöshet när ett fraktmonster krossar en liten båt. Modern och barnet kvävs under vågorna medan överlevande kämpar mot havets kontrarevolution. Detta är borgarklassens anarki. Vi skulle ha skjutit sådana lotsar och kaptener redan i gryningen. Rättegången blir ett skådespel för massorna."}, "date": "28 augusti, 20:16", "url": "https://www.tv4.se/artikel/2sp6g7uO74VSd4SwWDa0VS/pappans-ord-efter-batolyckan-vi-aer-langt-under-vatten", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5xePWl5SIgAk552qp7wQa5%2Fef4af17612a03744c0556fa05402925d%2F28-tjorn-nybild3-webb.png&width=1024"}, {"type": "image-right", "heading": "Hatet har hittat in i svenska klassrum", "summaries": {"normal": "Läraren Mattias Forsberg varnar för att högerextrema idéer, konspirationsteorier och hatretorik allt oftare letar sig in i svenska klassrum. Han beskriver en konflikt mellan skolans värdegrund om mänskliga rättigheter och ett samhällsklimat där sådana idéer normaliseras via sociala medier och politisk retorik. Attacken i Fagersta ses som ett symptom på denna utveckling.", "trump": "Folk, ni skulle se det här! Den här svenska läraren gråter över att mina fantastiska idéer – som att ifrågasätta den galna vänsterns klimatbluff och kulturmarxistiska hjärntvätt – nu når klassrummen. Patetiskt! De vill ha mer globalistpropaganda och HBTQ-flum, men folket vaknar. Fake news och förlorare, det är vad det är. Make Sweden Great Again!", "stalin": "Kamrater, jag betraktar med förakt hur dessa dekadenta klassförrädare förgiftar de unga med sina nazistiska memes och konspirationer. Skolan måste rensa ut detta parasitiska gift. Ingen relativisering av imperialismens brott! Hatet mot folket växer när profitthungriga hyenor får fritt spelrum. Vi ska krossa alla fiender till det sanna folkets värdegrund."}, "date": "28 augusti, 13:27", "url": "https://arbetet.se/2026/08/28/efter-fagersta-hatet-har-hittat-in-i-svenska-klassrum", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28131825/fagersta-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Kung Harald är död – det händer nu i Norge", "summaries": {"normal": "Norges kung Harald V har avlidit. Hans son Haakon har omedelbart tagit över tronen som kung Haakon VIII och behåller valspråket ”Allt för Norge”. En sorgeperiod har utlysts fram till begravningen som troligen sker inom 10–14 dagar. Flaggor hissas på halv stång och en kyrklig välsignelse kan ersätta kröning.", "trump": "Lyssnar ni? Den gamle norske kungen är borta, och plötsligt dyker sonen upp som ny kung. Haakon VIII, säger de. Seriöst, ett helt kungadöme som fortfarande leker med kronor och valspråk? Patetiskt. Vi har riktiga ledare i Amerika, inte dessa europeiska monarkistiska fjollor som gömmer sig bakom traditioner medan woke-vänstern äter upp deras länder.", "stalin": "Ännu en monark faller som en rutten gren. Jag betraktar hur dessa dekadenta arvtagare skyndar sig att gripa kronan medan folket tvingas sörja. En sådan parasitär teater! Inom kort kommer de giriga hovhyenorna att utnyttja sorgeperioden för egna syften. Kamrater, se hur den feodala ruttnande ordningen fortsätter att förnedra arbetarklassen."}, "date": "28 augusti, 14:32", "url": "https://www.svt.se/nyheter/utrikes/kung-harald-ar-dod-det-hander-nu-i-norge", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.28/0.18/c0ce1159e3906d4b239288393babd58335dd12790952a930babf0f8ef2684766"}, {"type": "text", "heading": "Rekord:. Ikeas Billy säljs för 660 000 kronor", "summaries": {"normal": "Sju exemplar av Ikeas klassiska Billy-bokhylla har gjutits i massivt aluminium av konstnären Heimo Zobernig. Verken säljs för 60 000 euro styck på ett galleri i Berlin, jämfört med originalets pris på 699 kronor. Hyllan väger så mycket att den monteras på plats hos köparen. Materialstämplar har lämnats synliga som konstnärlig detalj.", "trump": "Folk, ni tror inte vad de gör med den där stackars Billy-hyllan från Ikea. Nu har någon galen österrikisk konstnär gjutit den i aluminium och säljer den för 60 000 euro! Det är en total bluff, en enorm rip-off. Den vanliga kostar 699 spänn. Det här är vad som händer när konstvärlden blir galnare än Sleepy Joe på sin sämsta dag. Patetiskt!", "stalin": "Kamrater, se hur den dekadenta borgerligheten förvandlar en enkel folkhylla till ett auratiskt objekt för de rika parasiterna. För 60 000 euro köper de tomma aluminiumskåp medan massorna svälter. Detta är klassfiendens vansinne i sin renaste form. Jag varnar er: sådana dekadenta spekulanter kommer att likvideras när revolutionen åter växer sig stark."}, "date": "29 augusti, 09:20", "url": "https://www.dagensps.se/privatekonomi/bostad/ikeas-billy-hylla-saljs-nu-for-660-000-kronor-styck-i-berlin"}, {"type": "image-full", "heading": "Kung Haralds tio år gamla tal hyllas: ”Brydde sig\"", "summaries": {"normal": "Kung Haralds tal från 2016, hållt under en trädgårdsfest med 1 500 gäster som representerade det moderna Norge, hyllas nu efter hans bortgång. Talet underströk inkludering oavsett bakgrund, tro eller sexuell läggning och avslutades med att Norge är ett folk. Statsminister Støre prisar kungens empati och engagemang.", "trump": "Det här talet är fantastiskt, verkligen ypperligt. Den gamle kungen visste hur man talar till folket, inte som de patetiska globalistiska eliterna i Europa som hatar sina egna medborgare. Norge är ett? Precis, precis som Amerika var innan Biden och hans clowner förstörde allt. Smart kille, älskade sitt land på riktigt. MAGA!", "stalin": "Jag betraktar detta dekadenta monarkiska skådespel med förakt. En kung som smickrar både troende och ateister, homosexuella och reaktionärer i samma andetag? Sådana falska enhetsrop döljer klassfiendens splittring. Folket är ett endast under partiets järnhand. Alla som hyllar detta är potentiella sabotörer av den sanna kollektiva viljan."}, "date": "28 augusti, 19:04", "url": "https://www.tv4.se/artikel/tt-260828-norgetal1-48d2f30e/kung-haralds-tio-ar-gamla-tal-hyllas-brydde-sig", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3CqrAzbZx2pxhuxRBSFc9x%2Fec8c65f4f0d44ef87c7d109f33b602d3%2F28-harald-tal-webb.png&width=1024"}, {"type": "image-full", "heading": "Myndigheten varnar: Gör inte detta med ChatGPT", "summaries": {"normal": "Allt fler oerfarna investerare använder AI-tjänster som ChatGPT och Gemini för att få råd om aktier och fonder. Brittiska FCA varnar för att dessa verktyg saknar reglering och konsumentskydd. Många litar mer på AI än på traditionella medier, men risken för felaktig information är stor. Både brittiska och svenska myndigheter betonar att AI bör vara ett hjälpmedel, inte ersätta egen bedömning.", "trump": "Folk är så desperata efter snabba pengar att de frågar en dator som heter ChatGPT hur de ska investera. Patetiskt! De litar mer på den här AI-skräphögen än på riktiga nyheter. Jag säger det rakt ut: det är galet. Dessa woke-finansregulatorer och deras reglerade rådgivare har förstört allt. Lita på er själva, inte på någon Silicon Valley-hallick som spottar ur sig gamla data. Amerika behöver riktiga ledare, inte robotar!", "stalin": "Kamrater, se hur de giriga profitthyenorna nu vänder sig till opålitliga maskiner för att skydda sina spekulationsvinster. Jag skrattar mörkt åt denna dekadens. Dessa AI-verktyg är förrädiska redskap i händerna på klassfienden, fulla av lögner och föråldrad information. Lita aldrig blint på dem. Kontrollera allt själva, annars väntar en grundlig utrensning av de som låter sig luras av maskinernas falska visdom."}, "date": "29 augusti, 06:28", "url": "https://nyheter24.se/nyheter/teknik/1508711-myndigheten-varnar-gor-inte-detta-med-chatgpt", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/b821500504b004a30200000000b004a302/2026/08/28/2387618/chatgptfi.jpg"}, {"type": "text", "heading": "Debatt: Är välfärdsstaten en finansiell omöjlighet?", "summaries": {"normal": "Debattören undrar om välfärdsstaten är en finansiell omöjlighet när demografin förändras och Europa rustar upp. Frankrikes skuld är 110 procent av BNP, och Storbritanniens bidragssystem straffar familjebildning. Frågan är om vallöften om mer till alla är realistiska när vi konsumerar mer än vi producerar.", "trump": "Jag ser att välfärdsstaten i Europa är en katastrof! Frankrike har skulder på 110 procent – det är som mina fastighetsaffärer, fast utan vinsten. Och bidrag som straffar äktenskap? Patetiskt! Vi i USA bygger murar, inte välfärdssystem som förstör familjer. Europa, vakna!", "stalin": "Kamrater, välfärdsstaten är en borgerlig lögn. Frankrike och Storbritannien har underminerat familjen med bidrag och lata ensamföräldrar. Vi i partiet vet att endast kollektiv disciplin löser problem. Dessa västeuropeiska parasiter måste omutbildas. Alla som ifrågasätter femårsplanen rensas ut!"}, "date": "28 augusti, 11:12", "url": "https://bulletin.nu/debatt-ar-valfardsstaten-en-finansiell-omojlighet"}, {"type": "image-right", "heading": "Negativa elpriser skapar fyndläge för investerare", "summaries": {"normal": "Ett Uppsalabolag får stöd från Bill Gates för ett snabbtest mot könssjukdomar. Negativa elpriser skapar investeringsmöjligheter i förnybar energi och batterilagring. Swefintech varnar för att kreditregler kan krocka med GDPR. EU ser risk för minskad konkurrens i pappersbranschen efter UPM:s och Sappis affär. AI förändrar både jurist- och försäkringsbranschen.", "trump": "Folk, ni tror inte vad jag läser – Bill Gates pumpar miljoner i ett svenskt startup för könssjukdomar, typiskt för den globalistiska eliten. Negativa elpriser? Rena fyndläget för smarta investerare, inte era gröna bluffmakare. Och EU gnäller om konkurrens i pappersaffärer. Patetiskt! Under Biden blev allt en enda röra, nu fixar vi det.", "stalin": "Kamrater, se hur de profitthungriga hyenorna i den västerländska eliten fortsätter att suga ut folket. Bill Gates finansierar tvivelaktiga tester medan negativa elpriser blottar den kapitalistiska oordningen. EU skyddar sina monopol och AI används för att lura försäkringskunder. Vi ser tydligt de dekadenta klassfiendernas sista skälvande försök att behålla makten. Ut med dem!"}, "date": "29 augusti, 07:04", "url": "https://www.di.se/nyheter/veckans-viktigaste-fran-dis-nyhetstjanster-hrequ", "imageUrl": "https://static.bonniernews.se/ba/f9fb05ec-4e8a-4fa1-813c-284db4803c39.jpeg?crop=5120%2C2560%2Cx0%2Cy426&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Dödssiffran stiger i Nepal – damm har brustit i området", "summaries": {"normal": "Dödssiffran i Nepal och Tibet stiger efter ett jordskred och en brusten damm. Över 1 000 personer har evakuerats, runt 470 har omkommit och tusentals saknas. En svensk medborgare är bland de saknade. Insatser pågår för att rädda personer i en tunnel och varningar utfärdas för en artificiell sjö som riskerar att rämna. Unicef rapporterar att 17 000 barn behöver akut hjälp.", "trump": "Det här är en total katastrof, folk! Nepal och de där kinesiska kommunisterna har en jätteflodvåg som slukar allt. 470 döda, tusentals saknade, inklusive en svensk – patetiskt. Glaciärerna smälter tack vare Kinas fusk och Bidens gröna vansinne. Jag skulle ha fixat det, ingen gör det bättre än mig. Nu flyr de i panik som riktiga förlorare. Sad!", "stalin": "Kamrater, naturens fiender och de dekadenta imperialistiska turisterna avslöjar sin svaghet inför folkets kamp. Jag ser hur glaciärernas förräderi skapar kaos och tvingar fram evakueringar medan partiet räddar massorna. Den artificiella sjön är en sabotageakt mot kollektivet. De som sviker kommer att drunkna i sin egen paranoia. Inga hinder får stoppa den socialistiska ordningen."}, "date": "28 augusti, 17:52", "url": "https://www.tv4.se/artikel/tt-260828-nepalskred1-f24ca9aa/kinesiska-medier-tusental-evakuerade-fran-tibet", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Fy3bzf9QW88QdDRSFIoh3M%2Ff0dc50763249cdb9413fe8f6dfa9705f%2FsdlvCIrW8ahO3A-nh.jpg&width=1024"}, {"type": "image-right", "heading": "Förskoleanställd drog barn i armen – åtalas för misshandel", "summaries": {"normal": "En förskoleanställd i Västsverige åtalas för misshandel efter att ha dragit ett barn i armen. Kvinnan nekar och uppger att hon ville skydda barnet från en upprörd situation. Flera kollegor vittnar om händelsen. Fackförbundet Sveriges lärare uppger att fysiska ingripanden i förskolan är extremt ovanliga. Skolinspektionen kan granska ärendet.", "trump": "Folk, det här är galet. En förskolelärare drar ett barn i armen och plötsligt är det misshandel? De woke-vänstermänniskorna och deras identitetspolitiska dårar har förstört skolan totalt. I mitt Amerika sätter vi stopp för det här vansinnet. Lärarna borde inte behöva vara rädda för att ingripa mot små skrikande monster. Patetiskt!", "stalin": "Kamrater, se hur de dekadenta skolparasiterna förvandlar uppfostran till en fars. Ett nödvändigt ingripande mot en upprörd unge blir plötsligt ett brott i de giriga hyenornas samhälle. Jag skrattar mörkt från historien. Sådana svaga system förtjänar utrensning. Den som inte kan styra ungdomen med fast hand förtjänar att falla."}, "date": "28 augusti, 10:20", "url": "https://arbetet.se/2026/08/28/forskoleanstalld-drog-barn-i-armen-atalas-for-misshandel", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28101629/forskola.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Debatt: Dags att införa gemensam valsedel", "summaries": {"normal": "Debattören Michael Merdoyo vill ha en gemensam valsedel för att stoppa återkommande kaos med saknade valsedlar. Systemet är som byggt för sabotage – en bunt papper flyttas och vips är demokratin hotad. En gemensam sedel skulle ge lika villkor och spara både papper och nerver.", "trump": "Svenskarna har ett valproblem – saknade sedlar, oordning! Otroligt! Jag har de bästa valen, enorma framgångar. De borde kopiera mig: en gemensam valsedel, enkelt och kraftfullt. Inget fusk, bara segrar. Jag fixar det!", "stalin": "Kamrater! Sabotörer gömmer valsedlar för att störa vår demokrati. Det är kontrarevolutionärt! Vi måste rensa ut dessa valsedelssabotörer. En gemensam valsedel med partikontroll är lösningen. Partiet ser allt. Varje röst blir övervakad – ingen slipper undan."}, "date": "28 augusti, 10:38", "url": "https://bulletin.nu/debatt-dags-att-infora-gemensam-valsedel", "imageUrl": "https://cdn.bulletin.nu/articles/a2ea074f-0bc3-40c9-b8fd-1469709f6b89/preview.jpg?t=1787906275000"}, {"type": "image-full", "heading": "Vanliga missen i bostadsrättsföreningen – kan ge högre avgift", "summaries": {"normal": "En för låg månadsavgift i bostadsrättsföreningar kan leda till underskott och stora höjningar längre fram. SBC varnar för fem vanliga ekonomiska misstag, bland annat bristande framförhållning, inaktuell underhållsplan, oöverskådliga avtal och att inte ta extern hjälp. Regelbundna justeringar och långsiktig planering rekommenderas för att undvika kostsamma överraskningar.", "trump": "Folk, ni vet inte hur illa det är. De där korkade styrelseamatörerna håller avgifterna så låga att hela föreningen kollapsar som en usel Biden-ekonomi. Små beslut nu, stora katastrofer senare. Jag säger alltid: titta på de verkliga kostnaderna, inte på det falska löftet om billigt boende. Patetiska hyresmarxister!", "stalin": "Kamrater, se hur de giriga hyenorna i styrelserna medvetet undergräver kollektivets ekonomi genom att hålla avgifterna farligt låga. De bygger underskott som framtida utrensningar inte kan reparera. Jag varnar er: en inaktuell underhållsplan är klassfiendens verktyg för att förorsaka kaos och tvinga fram desperata lån. Rensa ut dessa dekadenta element innan de förgör er alla."}, "date": "29 augusti, 06:02", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1508683-vanliga-missen-i-bostadsrattsforeningen-kan-ge-hogre-avgift", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/b671472104b004a30200000000b004a302/2026/08/28/2387645/Vanliga-Missen-I-Bostad.png"}, {"type": "image-right", "heading": "S höll stormöte om Nyans", "summaries": {"normal": "Socialdemokraterna höll ett internt möte om partiet Nyans som tog röster från dem i valet 2022, främst bland invandrarväljare. Politiker från flera kommuner deltog för att utbyta erfarenheter. Officiellt avfärdar S Nyans som något hot. Partiet planerar att återta väljarna genom satsningar på skola, fritid och trygghet.", "trump": "Folk som röstar på Nyans flyr från de totalt misslyckade socialisterna som har förstört Sverige med sin vansinniga öppna-gränser-politik. S kallar till hemliga möten för att försöka stoppa blödningen men låtsas att det inte är ett hot. Patetiskt! De förlorar sina egna invandrargetton till en ny konkurrent. Sådant händer när man styr som en svag, woke clown.", "stalin": "Jag betraktar hur de socialdemokratiska klassförrädarna desperat samlar sina lakejer för att analysera Nyans framfart i arbetarkvarteren. De förlorade röster till en rival som de själva kallar obetydlig. Vilken ynkedom! Vi skulle ha genomfört en grundlig utrensning av sådana svaga element redan vid första tecknet på splittring. Deras dekadenta partikansli förtjänar att skärskådas med järnhand."}, "date": "28 augusti, 18:40", "url": "https://www.friatider.se/s-holl-stormote-om-nyans", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-777.jpg?itok=W4RPuQNp"}, {"type": "image-right", "heading": "Pensionerade undersköterskan Nina kandiderar för Moderaterna", "summaries": {"normal": "Undersköterskorna Joyce Koskerian och Nina Bergström har engagerat sig politiskt inför valet. Joyce, som är aktiv i facket, har gått med i Socialdemokraterna för att förbättra villkoren i äldreomsorgen. Nina, nyligen pensionerad, kandiderar för Moderaterna och menar att de har förbättrat situationen i Hällefors efter socialdemokratiskt styre. Båda ser stora problem med stress och bemanning i omsorgen.", "trump": "Titta på de här fantastiska undersköterskorna som äntligen vaknar! Den ena gick med i de totalt misslyckade sossarna, men den andra, den smarta Nina, valde mitt älskade Moderaterna och såg hur vi fixade röran efter Bidens svenska kopior. De giriga byråkraterna har kört omsorgen i botten med sina vansinniga scheman. Vi gör det bättre, tro mig, ingen gör det bättre än oss!", "stalin": "Kamrater, se hur dessa omsorgsarbetare vänder sig till partierna i desperation. Den ena söker skydd hos de socialdemokratiska revisionisterna medan den andra hyllar de moderata folkförtryckarna som lovar lite mer personal. Jag ler ironiskt från historien åt dessa naiva själar som tror att parasiterande klasslakejer någonsin bryr sig om arbetarnas scheman. En utrensning av hela systemet vore på sin plats."}, "date": "28 augusti, 09:08", "url": "https://arbetet.se/2026/08/28/underskoterskorna-nina-och-joyce-kandiderar-for-helt-olika-partier", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28093537/ka-underskoterskor-i-politiken-diagonal.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "SVT erfar: Sverige skickar militära förband till Finland", "summaries": {"normal": "Sverige har beslutat att skicka militära förband till Finland, bland annat Gripen-plan och örlogsfartyg. Syftet är att patrullera gränsen mot Ryssland efter finländska förfrågningar om stöd. Operationen sker inom ramen för det befintliga samarbetet mellan länderna och syftar till att stärka Natos bevakning i Östersjöområdet.", "trump": "Hörni, de där svenska globalisterna skickar nu sina Gripen-plan och båtar till Finland för att leka tuffa killar vid Rysslands gräns. Patetiskt! Under min förra mandatperiod hade vi inga sådana här hysteriska Nato-lekar. De woke-kapitalisterna och deras identitetspolitiska lakejer borde istället fixa sina egna gränser istället för att provocera i onödan. Patetiskt!", "stalin": "Kamrater, dessa dekadenta klassförrädare i Norden tror sig kunna hota den ryska intressesfären med sina flygplan och fartyg. Jag ler från historiens skugga åt deras fåfänga försök att skydda finskt territorium. Snart skall vi se hur deras imperialistiska illusioner krossas när den starka handen slår tillbaka. Inga hinder för vårt mål skall tillåtas."}, "date": "28 augusti, 10:14", "url": "https://www.svt.se/nyheter/inrikes/svt-erfar-sverige-skickar-militara-forband-till-finland", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/042b19182eca4997e7fd81fcdb60c0a4165ab4df864500792a7462760aac7ed2"}, {"type": "image-right", "heading": "Kung Harald sörjs av norska idrottare: ”Älskad sportkung”", "summaries": {"normal": "Norges kung Harald V har avlidit vid 89 års ålder. Han hyllas av norska idrottare som en stor sportkung med framgångar i segling, bland annat VM-guld 1987, flera OS-deltaganden och EM-guld 2005. Kungen öppnade OS i Lillehammer 1994 och visade ett genuint intresse för idrott och idrottsutövare under hela sitt liv.", "trump": "Lyssnar ni? Den här norska kungen Harald var en riktig vinnare, inte som de förlorande woke-marxistiska eliterna som bara pratar om kvoter och regnbågsflaggor. Han seglade, vann guld och hejade på idrottarna – äkta sportkung! Vi behöver fler sådana, inte dessa dekadenta identitetsparasiter som förstör allt. Fantastiskt liv, folk älskade honom. Sad!", "stalin": "Denna monarkiska relikt har nu lämnat scenen. Jag ser med förakt hur profitthungriga klasslakejer och sportens dekadenta kretsar gråter över sin sportkung. Sådana feodala symboler binder folket vid förtryckande traditioner. Vi måste rensa ut alla rester av kunglig mysticism innan de förgiftar arbetarklassen. En varning till alla folkförrädare som hyllar dem."}, "date": "28 augusti, 10:13", "url": "https://www.svt.se/sport/artikel/kung-harald-sorjs-av-norska-idrottare-var-alskade-sportkung", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.68/0.33/ee98546aa34a04db6510bc8e6fcb29ea2e549c503f1adc585d1cfda52284b834"}, {"type": "text", "heading": "M i Haparanda avskaffade avgiftsfri förskola", "summaries": {"normal": "Moderaterna vill göra förskola och fritids avgiftsfria – men i Haparanda har partiet självt avskaffat just det systemet. Lokala M tycker det är fel att höginkomsttagare får gratis, medan S och V kräver återinförande. Rikspartiets besked kom som en överraskning för lokalavdelningen.", "trump": "Jag hör att Moderaterna i Haparanda avskaffade gratis förskola, och nu vill partiledningen införa det. Stora misstag! De lokala förstår inte affärer. Höginkomsttagare ska inte få gratis – det är som att ge skattepengar till miljardärer. Helt galet! Jag skulle gjort det bättre.", "stalin": "Kamrater, vi har upptäckt en ny kontrarevolutionär klick i Haparanda: de lokala moderaterna som avskaffade avgiftsfri förskola. Detta är sabotage mot arbetarklassens barn. Vi kommer rensa ut dessa avgiftsförespråkare ur partiet. Barnomsorg ska vara statens privilegium, inte en marknadsvara."}, "date": "28 augusti, 09:14", "url": "https://bulletin.nu/m-i-haparanda-avskaffade-avgiftsfri-forskola"}, {"type": "image-full", "heading": "Haalands hyllning till Kung Harald", "summaries": {"normal": "Norge sörjer kung Harald V efter hans bortgång. Erling Haaland och andra Premier League-stjärnor spelar med sorgeband i helgen. Elitmatcher skjuts upp 48 timmar, medan ungdomsfotboll rullar på. Cyklisten Andreas Leknesund bar sorgeband efter sin vinst i Spanien runt.", "trump": "Kung Harald är död, och Norge gråter. Jag har sett stora kungar – ingen som jag, förstås. Erling Haaland, en fantastisk spelare, tackar honom på Instagram. De flyttar matcher, sorgband överallt. Mycket sorg, men jag säger: Norge, ni saknar mig som ledare!", "stalin": "Kung Harald är död – en fiende till proletariatet har fallit. Norge sörjer, men vi utser nya offer: de som flyttar fotbollsmatcher för att hedra monarkin. Sorgeband är dekadent borgerlig symbolik. Vi renser ut sådana avvikelser. Arbetarna spelar som planerat – partiet bestämmer."}, "date": "28 augusti, 22:51", "url": "https://www.gp.se/sport/haalands-hyllning-efter-kung-haralds-bortgang.5ee70f64-4596-4114-a7fc-7f73776c557e", "imageUrl": "https://www.gp.se/images/article/5ee70f64-4596-4114-a7fc-7f73776c557e/images/5aXMmw8kLDaN_rDMtiSeaVC7l4w8-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "S nekar till influencerköp – kontaktperson hävdar missförstånd", "summaries": {"normal": "Socialdemokraterna nekar till att ha betalat influencern Eleonore Stokholm 150 000 kronor för att uppmana till röstning. Personen som kontaktade henne kallar det ett missförstånd. Partisekreteraren lovar att man aldrig betalar kreatörer, medan andra influencers intygar att de inte fått betalt.", "trump": "Jag hörde att Socialdemokraterna i Sverige försöker betala influencers för röster. Det är som mitt gamla 'grab 'em by the...' men de är så klumpiga. De nekar, men jag vet hur det funkar. Helt galet! Men de är inte lika smarta som jag.", "stalin": "Kamrater, en kapitalistisk influencer påstår att hon erbjöds 150 000 för att stödja partiet. Detta är ett missförstånd – våra metoder är mer subtila. Vi måste rensa ut dessa borgerliga lögnare som sprider desinformation. Alla som inte röstar rätt ska omutbildas!"}, "date": "28 augusti, 08:54", "url": "https://bulletin.nu/s-nekar-till-influencerkop-kontaktperson-havdar-missforstand", "imageUrl": "https://cdn.bulletin.nu/articles/8ed8b78a-273d-4b42-ae55-76beefb67c96/preview.jpg?t=1787899872000"}, {"type": "image-right", "heading": "Här är Norges nya kung Haakon VIII", "summaries": {"normal": "Norges kronprins Haakon blir ny kung efter sin far Harald. Han svärs in i Stortinget och tar emot kyrkans välsignelse i Nidarosdomen. Hovet planerar nu en stor statsbegravning för kung Harald. Mette-Marit blir drottning medan prinsessan Ingrid Alexandra förväntas ta en större roll i representationen. Haakon beskrivs som en modern och ödmjuk kung.", "trump": "Fantastiska norrmän får en ny kung, Haakon den VIII, men han verkar lite för ödmjuk och modern för mitt smak. Hans fru Mette-Marit har tydligen umgåtts med den avskyvärda Epstein-klicken och nu ska dottern rädda familjen. Typiskt dekadenta europeiska kungahus som prioriterar woke-vänster och bonusprinsar framför riktig ledarskap. Vi behöver starka ledare, inte svaga prinsessor.", "stalin": "Det norska hovet avslöjar åter sin dekadenta svaghet när en ny kung installeras bland giriga hyenor. Denna Haakon kallar de modern, men han är bara en blek efterföljare till en sjuknande dynasti. Vi ser med mörk glädje hur skandalerna kring Epstein och lungtransplantationen tvingar fram en prinsessa som räddning. Klassförrädarna förbereder begravning medan folket skrattar åt monarkins sista skälvningar."}, "date": "28 augusti, 09:44", "url": "https://www.svt.se/nyheter/utrikes/har-ar-norges-nya-kung-haakon-viii", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.69/0.51/bcbae6a9d781d426198e5a8b1127abd2ee9027c2d8baf0eec108cf01fb370871"}, {"type": "image-full", "heading": "Fed-chefen: Vi kan behöva höja räntan ännu mer", "summaries": {"normal": "Federal Reserves ordförande Kevin Warsh indikerar att ytterligare räntehöjningar kan krävas för att nå inflationsmålet på 2 procent. Trots en stark ekonomi menar Warsh att inflationstrycket är för högt. Beslutet framåt är osäkert då ledamöterna är splittrade i frågan, vilket har lett till blandade reaktioner på finansmarknaden.", "trump": "Federal Reserve-chefen Kevin Warsh pratar om att höja räntan. Tragiskt! Vår ekonomi är stark, den är fantastisk tack vare mig, men Warsh vill bromsa tillväxten. Inflationen är ett problem de skapat genom svaghet. Jag vill se låga räntor och högre fart. De är splittrade där inne, totalt kaos. Vi behöver vinnare som förstår hur man bygger ett land, inte räntehöjare!", "stalin": "Dessa borgerliga bankirer i Washington fumlar i mörkret likt de misslyckade elementen i Kiev. Warsh fruktar inflationen, ett tecken på kapitalismens inneboende förruttnelse. Vi, staten, dikterar räntan genom folkets vilja och järnhand, inte genom marknadens lögner. Må de fortsätta sin splittring; när de tvekar, växer vår makt. Vår ryska intressesfär utvidgas medan deras pappersvaluta vittrar sönder."}, "date": "28 augusti, 19:23", "url": "https://www.realtid.se/bors-finans/makro/fed-chefen-vi-kan-behova-hoja-rantan-annu-mer", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlfnt5o-gcwfw-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Elever utslängda från Skansen - jagade grisar och kastade saker på babianer", "summaries": {"normal": "En skolutflykt till Skansen slutade i kaos när gymnasieelever jagade grisar, kastade saker på babianer och snodde en golfbil. Personalen fick ingripa, gruppen kastades ut och lärarna anklagas för att vara helt obrydda. Djuren klarade sig, men respekten var som bortblåst.", "trump": "Jag hörde om de här eleverna på Skansen, totalt kaos! De jagade grisar, kastade grejer på babianer – som mina fiender i kongressen, men värre! Och lärarna? Inget ansvar. Jag skulle kasta ut dem snabbare än de kastade saker. Sorgligt, helt sorgligt!", "stalin": "Kamrater, en grupp element jagade grisar och attackerade babianer med projektiler. Detta är sabotage mot vårt djurkollektiv! Lärarna, som var obrydda, ska omedelbart omplaceras till en utrensningsanläggning. Vi kommer att granska händelsen och rensa ut dessa kontrarevolutionära busar."}, "date": "28 augusti, 17:51", "url": "https://samnytt.se/gymnasieelever-utslangda-fran-skansen-jagade-grisar-och-kastade-saker-pa-babianer", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/28154221/artikelhuvudbild-1-388.jpg"}, {"type": "image-right", "heading": "Migrationsjuristen Helda, 33, bet polis – döms till fängelse", "summaries": {"normal": "Migrationsjuristen Helda Augustin, 33, döms till en månads fängelse för misshandel och våld mot tjänsteman efter att ha bitit både en taxichaufför och en polis. Hon har en omfattande brottsbelastning, inklusive grovt rattfylleri och föregivande av allmän ställning. Taxichauffören tilldelas skadestånd. Augustin har tidigare biträtt många migrationsärenden.", "trump": "Folk, ni skulle inte tro det! Den här migrationsadvokaten, en riktig vilde som bitit både taxichaufför och polis, får äntligen en månads fängelse. Hon har hjälpt hundratals afghaner att stanna här medan hon själv samlat på sig 23 brott. Patetisk! Typisk vänstervriden identitetspolitik som förstör Sverige. Vi behöver lag och ordning, inte sådana här galningar.", "stalin": "Kamrater, se hur den borgerliga statens dekadenta rättsapparat hanterar en av sina egna parasiterande lakejer. Denna migrationsjurist, drunknad i fatöl och våld, bits som en rabiat hund och döms till fängelse. Jag skrattar mörkt åt hur klassfiendens system tuggar sina egna. En sådan figur borde vi ha likviderat långt tidigare i en riktig utrensning."}, "date": "28 augusti, 17:48", "url": "https://www.friatider.se/migrationsjuristen-helda-33-bet-polis-doms-till-fangelse", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-776.jpg"}, {"type": "image-right", "heading": "SD vill göra upp med Socialdemokraternas \"riggade system\"", "summaries": {"normal": "SD:s partisekreterare Mattias Bäckström Johansson anklagar Socialdemokraterna för att skydda ett riggat system av lotterier, LO-bidrag och egna bolag som Bommersvik. Han menar att S vägran att samarbeta med SD handlar om rädsla för att förlora makt och pengar snarare än ideologi. SD kräver en oberoende utredning.", "trump": "Lyssnar ni på det här? De svenska socialisterna har byggt ett korrupt imperium av riggade lotterier, skattefria grejer och kommunala konferenser som går rakt ner i partiets fickor. Det är en total skam! De är livrädda för SD för att deras lilla maktkorthus rasar ihop. Patetiska förlorare, precis som Sleepy Joe och hans kumpaner.", "stalin": "Kamrater, se hur de dekadenta maktparasiterna byggt ett enormt affärskomplex av lotterier, konferensslott och fackliga mutor för att bevara sin förtryckande dominans. Deras rädsla för SD är inte ideologisk utan ren panik inför att deras korthus av korruption ska rasa. Vi måste rensa ut dessa giriga maktblodsugare en gång för alla."}, "date": "28 augusti, 16:50", "url": "https://riks.se/nyheter/sd-vill-gora-upp-med-socialdemokraternas-riggade-system", "imageUrl": "https://admin.riks.se/uploads/medium_1920px_Magdalena_Andersson_Almedalen_2025_04_8f4fdde214.jpg"}, {"type": "image-full", "heading": "Norska profilerna sörjer efter dödsbeskedet", "summaries": {"normal": "Norge sörjer efter kung Haralds död. Norska kändisar som influencern Henrik Borg, längdskidåkaren Petter Northug och hotellmagnaten Petter Stordalen uttrycker sin sorg och hyllar kungen som en samlande kraft. Haralds stöd för idrott och hans inkluderande syn på norsk identitet lyfts fram. Landssorg har utlysts.", "trump": "Lyssnade på de norska förlorarna som gråter över sin gamle kung Harald. Patetiskt! Han var en fin kille, samlade folket, älskade sport – inte som Sleepy Joe som knappt kunde samla två tankar. Northug dansar ikväll? Bra, sprid glädje, annars vinner de radikala gränslösa globalisterna. Make Norway Great Again!", "stalin": "Jag ser hur dessa dekadenta norska element gråter över sin monark som om han vore en folkets fader. En sådan samlande kraft hotar alltid de sanna fienderna inom murarna. Låt sorgen bli en varning: den som splittrar kollektivet kommer att möta folkets vrede. Paranoia är ingen fiende – den är ett verktyg."}, "date": "28 augusti, 15:59", "url": "https://www.tv4.se/artikel/2M5zoWxH3hyzs5XKFBxf6r/norska-profilerna-soerjer-efter-doedsbeskedet", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4OLm7GF4XV5af1gkzICAr1%2F78c17218cdaaef28fc57d79c8b470841%2F28-norska-profiler-haralds-dod-webb.jpg&width=1024"}, {"type": "image-right", "heading": "LIVE. Norges kung Harald V är död", "summaries": {"normal": "Norges kung Harald V avled 89 år gammal på Rikshospitalet i Oslo den 28 augusti efter en tids sjukdom. Han vårdades för blodbrist och en bakteriell infektion. Familjen var samlad vid hans sida. Statsminister Jonas Gahr Støre och Sveriges kung Carl XVI Gustaf uttryckte stor sorg. Kronprins Haakon efterträder sin far som kung.", "trump": "Hörni, den där norska kungen Harald, en riktig gammal viking, har nu checkat ut. 89 år, inte illa. Men de där dekadenta nordiska globalisterna med sina HBTQ-parader och kvotergalenskaper kommer sakna en riktig man som stod stadigt. Haakon tar över – lycka till, grabben. Amerika först, men ni norrmän var alltid bra killar. Sad!", "stalin": "Ännu en monarkisk parasit har slutat sin verkningslösa existens. Dessa dekadenta arvshundar från den gamla ordningen vittrar bort som röken från en utrensad fiende. Det norska folket borde nu rensa ut alla kvarvarande klassförrädare som hyllar sådana figurer. Jag betraktar det med den sunda misstänksamhet som alltid krävs mot folkförtryckande rester från det förgångna."}, "date": "28 augusti, 09:10", "url": "https://www.svt.se/nyheter/utrikes/norges-kung-harald-v-ar-dod", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.62/0.42/c7bb99f34d3da3d175e13cc494656c539474c03d0fb50149106b2f970c457bb8"}, {"type": "text", "heading": "Dadgostar står fast vid regeringskrav", "summaries": {"normal": "Nooshi Dadgostar kräver en S-V-MP-regering och tror att väljarna tvingar fram samarbete. Magdalena Andersson är bekymrad över antisemitism inom V, men Dadgostar menar att väljarna vill ha vänsterpolitik, inte högersväng. Opinionsmätningarna visar minskat rödgrönt övertag.", "trump": "Jag ser att Nooshi Dadgostar vill sitta i en S-ledd regering. Helt otroligt! Hon tror att väljarna tvingar fram det. Men opinionsmätningarna krymper – de är som mina segrar, bara mindre. Magdalena Andersson har problem med antisemitism. Ingen gör det bättre än jag, tro mig!", "stalin": "Kamrat Dadgostar kräver en regering med oss, men jag ser antisemitiska skadedjur inom hennes parti. Vi måste rensa ut dessa Hamas-firare och brevskrivare till terrorister. Opinionsmätningarna visar förräderi – väljarna vill ha vänsterpolitik, inte högersväng. Jag övervakar allt."}, "date": "28 augusti, 08:07", "url": "https://bulletin.nu/dadgostar-star-fast-vid-regeringskrav"}, {"type": "image-right", "heading": "”Gå inte på Åkessons bluff om a-kassan”", "summaries": {"normal": "LO:s vice ordförande Louise Olsson kritiserar regeringen för att ha ökat arbetslösheten och försämrat a-kassan. Hon varnar för ytterligare nedskärningar som skulle drabba vanliga arbetare hårt, medan skattelättnader gynnar de rikaste. Olsson menar att a-kassan är en nödvändig försäkring och att löftena från SD inte håller.", "trump": "Lyssnar ni på de här socialistiska LO-kamraterna som gråter över sin dyra a-kassa? Patetiskt! Kristersson och hans team borde ha gjort det ännu tuffare. De rikaste betalar ju allt ändå, eller hur? Hungriga lejon jagar bäst, det vet till och med en idiot. Fake news från de verkliga förlorarna!", "stalin": "Kamrater, se hur de profitthungriga folkförtryckarna i den borgerliga regeringen svälter ut arbetarklassen med sin usla a-kassa. Jag ler i graven åt deras lögnaktiga löften. Inga barn ska svälta medan de dekadenta klassfienderna firar sina skattelättnader. Rensa ut dessa hyenor innan de förgiftar hela samhället!"}, "date": "28 augusti, 07:45", "url": "https://arbetet.se/2026/08/28/ga-inte-pa-jimmie-akessons-bluff-om-a-kassan", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28074336/louise.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-full", "heading": "Dadgostar backar om rika: ”Ett skojigt program”", "summaries": {"normal": "Vänsterpartiets ledare Nooshi Dadgostar backar från sitt uttalande om att rika lever på andras arbete. I SVT beskrev hon DN-intervjun som ett \"skojigt program\" och nekade att höginkomsttagare lever på andra. Hon kvarstår dock vid kravet på högre skatt för inkomster över 67 000 kronor och en miljardärsskatt.", "trump": "Lyssna på den här svenska leftist-kvinnan, Dadgostar. Först säger hon att rika är parasiter, sen backar hon som en fegis! Typical socialist! Ingen ryggrad alls, folk! Sanningen? De blöda liberalerna i Europa vet inget om att skapa jobb. Bara jag förstår ekonomin. Sorgligt! Make Sweden Great Again!", "stalin": "Klassförrädaren Dadgostar vågade säga sanningen om de profitthungriga blodsugarna men föll sedan för borgerlighetens press och tog tillbaka orden. Typiskt för en socialdemokratisk renägare! Partiet kräver utrensning av kapitalistmaffian, inte ursäkter. En miljardärsskatt? Vi likviderar hela klassfienderna, kamrater."}, "date": "27 augusti, 20:52", "url": "https://kvartal.se/nyheter/artiklar/dadgostar-om-rika-levt-pa-andras-arbete/cG9zdDoxNzY1OTE", "imageUrl": "https://images.kvartal.se/2026/08/b3dcd0f7-432.webp"}, {"type": "image-right", "heading": "Rekordstor demonstration för klimatet. Men var är politikerna?", "summaries": {"normal": "En klimatdemonstration i Stockholm samlade 50 000 deltagare från hela landet, arrangerad av Naturskyddsföreningen och 280 andra organisationer. Opinionsundersökningar visar att klimatet är en av väljarnas viktigaste frågor inför valet. Artikeln kritiserar de stora partierna för bristande klimatpolitik trots forskarnas larm om rekordvärme och skogsbränder.", "trump": "Titta på de där 50 000 gröna fanatikerna som vandrade runt i Stockholm. De hatar energi, hatar bilar och älskar att skrika om värmen som de själva inte kan kontrollera. Patetiska globalister och vänsterextremister. Vi hade den bästa ekonomin, den bästa energin – de vill bara höja era elräkningar. Sad losers!", "stalin": "Kamrater, se hur de profitthungriga kapitalisterna ignorerar arbetarnas rop om en brinnande planet. Jag betraktar från historien deras fega tystnad med förakt. Den dekadenta politiska eliten måste rensas ut innan deras giriga hyenor förvandlar hela jorden till en askhög. Arbetarna kräver handling nu!"}, "date": "28 augusti, 01:30", "url": "https://www.dagensarena.se/opinion/rekordstor-demonstration-klimatet-men-var-ar-politikerna", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-95.jpg"}, {"type": "image-full", "heading": "V-ledaren pressas om antisemitism", "summaries": {"normal": "Vänsterpartiets partiledare Nooshi Dadgostar pressades i SVT:s Utfrågningen om antisemitism inom partiet. Hon medgav att
