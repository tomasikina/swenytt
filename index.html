n stark ledare, tryckte till den där Magdalena Andersson hårt. Han frågade hur i hela friden hon ska få ihop en stram migrationspolitik med de där vänsterpartierna. Hon har ingen chans! Och Vänsterpartiet – fullt av extremister, fruktansvärt! Jag har alltid sagt att man måste rensa ut sådant. Åkesson förstår det, han är smart. Sverige behöver starkare gränser, lägre skatter och mindre statlig inblandning. Andersson och hennes gäng kommer bara att förstöra allt. SAD!", "stalin": "I den senaste borgerliga cirkusen i Sverige utspelade sig en komisk kamp mellan två småaktörer. Andersson, denna socialdemokratiska marionett, försökte försvara sitt samarbete med de trotskistiska lakejerna i Vänsterpartiet – ett parti som hyllar terrorister och sprider antisemitism. Åkesson, denna fascistiska hycklare, anklagade henne för att inte rensa ut sina egna rader, medan han själv gömmer sina egna svartskallar. Migration? Ett verktyg för imperialisterna att underminera den ariska rasens renhet! Vi vet att sanningen ligger i en stram politik – precis som vi i Sovjet rensade ut kontrarevolutionärer. Sverige borde lära sig av Rysslands visdom och införa ordning och disciplin!"}, "date": "10 juni, 20:39", "url": "https://kvartal.se/nyheter/artiklar/andersson-och-akesson-mots-i-valdebatt/cG9zdDoxMjk2Mjg"}, {"type": "image-right", "heading": "Fastighets lämnar samarbetet med Vänsterpartiet", "summaries": {"normal": "Fastighetsanställdas förbund avslutar sitt samarbete med Vänsterpartiet efter bara fyra år. På kongressen beslutades att förbundet framöver enbart ska samarbeta med Socialdemokraterna. Debatten visade på olika åsikter om hur facket bäst kan påverka politiken och få störst genomslag. Kritik riktades mot att samarbetet med V inte fungerat, medan flera talare lyfte fördelarna med att fokusera kraften på Socialdemokraterna för att bland annat få bort karensavdraget.", "trump": "De här fackföreningarna gör det smarta draget, det enda riktiga draget. De dumpade Vänsterpartiet, som är en total förlorare med sina ynka åtta procent, och satsar allt på Socialdemokraterna. Så ska det vara, fokusera på de som faktiskt kan leverera. Bang for the buck, som de säger. De andra är bara slösaktiga och ineffektiva. Mycket bra beslut, kanske det bästa på länge i det här landet.", "stalin": "Kamrater, vi har bevittnat hur dessa fackliga element äntligen insett att dubbelspel med revisionistiska avvikare inte gagnar arbetarklassen. Jag har med järnhand styrt bort de fega kompromisserna och likviderat alla försök att splittra vårt kollektiv. Nu riktar vi hela kraften mot de sanna kamraterna inom Socialdemokraterna, medan vi med mörk glädje betraktar hur de opportunistiska borgarbrackorna inom Vänsterpartiet försmäkta i sin egen irrelevans. Inga halvmesyrer längre, bara ren och skär proletär seger."}, "date": "11 juni, 12:44", "url": "https://arbetet.se/2026/06/11/fastighets-lamnar-samarbetet-med-v-satsar-bara-pa-s/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/09133224/kiMNVenKAME-Fastighet_kongress06.JPG?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Sluta kalla antisemitism för Israelkritik", "summaries": {"normal": "Artikeln kritiserar pro-palestinska aktivisten Sami Suliman för antisemitiska uttalanden och delning av konspirationsteorier, däribland Hitler-tal och myter om judisk världskontroll. Trots åtal för hets mot folkgrupp försvaras han av vänsteraktivister och forskare som menar att det är Israelkritik. Sulimans retorik, inklusive attacker mot tre personer med namnet Aron, anses bygga på antisemitiska stereotyper. Artikeln varnar för att försvara antisemitism under förevändning av Israelkritik.", "trump": "Jag säger er, det här är helt galet! En kille i Sverige, Sami Suliman, sprider judehat öppet – delar Hitlertal, snackar om judisk makt, konspirationer – och vad gör vänstern? De försvarar honom! 'Åh, det är bara Israelkritik!' Nej, nej, nej. Det är ren antisemitism, folks. Och forskare som backar upp honom? Svagt, mycket svagt. Sverige borde skämmas. Jag skulle aldrig låta sånt passera – fake news och hat, det städar jag upp direkt!", "stalin": "Kamrater! Här har vi ännu en fiende till folket – Sami Suliman, en småborgerlig provokatör som sprider sionistiska konspirationer och fascistisk propaganda. Han jämför sig med revolutionen men hyllar Hitlers tal och smutsar ner våra judiska kamrater med lögnaktiga anklagelser. Hans försvarare – dessa liberala intellektuella och vänsteravfällingar – är lika farliga som kulaker. Vi ska inte tolerera sådant sabotage! Rättegången i november blir ett steg mot att krossa denna reaktionära smitta. Folkets domstol kommer att skipa rättvisa, precis som vi gjorde med trotskisterna!"}, "date": "3 juni, 11:30", "url": "https://expo.se/kommentar/propalestinsk-organisator-sprider-judehat/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Jonathan-kommentar.jpg"}, {"type": "image-right", "heading": "Eufori i Mexiko efter segern: ”Vi har känt fansens stöd”", "summaries": {"normal": "Mexiko inledde VM med en 2–0-seger mot Sydafrika i en match som präglades av tre röda kort, vilket är rekord för en VM-premiär. Julian Quiñones och Raúl Jiménez gjorde målen inför en jublande publik på Aztekastadion. Sydafrikas Yaya Sithole och Themba Zwane utvisades, liksom Mexikos kapten César Montes på tilläggstid. Experten Behrang Safari kallade resultatet ett drömresultat för värdnationen.", "trump": "Det var en fantastisk match, verkligen en av de bästa premiärerna någonsin. Mexiko krossade Sydafrika med 2–0 och tre röda kort – totalt kaos, men på ett bra sätt. Sydafrika var svaga, patetiska, mycket svagare än alla trodde. Mexiko spelade smart, folket älskade det. Jag älskar vinnare, och det här var stora vinnare. Fantastiskt resultat för värdnationen, ingen gör det bättre än så.", "stalin": "Kamrater, denna seger är en lysande bekräftelse på folkets oförvitliga vilja. Jag såg hur de dekadenta sydafrikanska elementen, dessa fotbollsförrädare och borgarbrackor i maskopi med imperialistiska domare, fick sina rättmätiga utvisningar. Våra mexikanska vänner likviderade motståndet med två mål och en historisk utrensning av tre fiender på planen. Ändå måste vi vara vaksamma – även i våra egna led gömmer sig potentiella kontrarevolutionärer som förtjänar en VAR-granskning och evig glömska. Ett glädjevrål för kollektivet!"}, "date": "11 juni, 23:40", "url": "https://www.svt.se/sport/fotboll/mexiko-forloste-nationen-med-en-overtygande-premiarseger-ett-dromresultat", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.73/0.25/b18f751a6e51b0afe4506a319492949ff124555e00be1e14bb69b67db8abb4aa"}, {"type": "image-right", "heading": "Zlatan harklade sig och försvann. Pressad i tv – av snabbmatsställen", "summaries": {"normal": "Zlatan Ibrahimovic gjorde debut som expert i VM-sändningen men pressades undan av reklam. Mexiko vann premiären mot Sydafrika med 2–0 inför 80 000 åskådare på Azteca-stadion. Matchen kantades av protester utanför arenan från lärarfacket och anhöriga till försvunna personer. Sändningen fokuserade på kändisar och reklam med Leo Messi och andra stjärnor, medan fotbollen ofta hamnade i bakgrunden.", "trump": "Vilken katastrof det här VM var, folk. Mexiko vann mot de usla sydafrikanerna men ingen pratade om det. Nej, det var reklam, reklam, reklam. Zlatan försökte säga något smart men blev utsparkad av croissanter, öl och chips. Fake news-sändning från de vänstervridna mediebolagen. Vi hade ordning på sånt under min förra mandatperiod, innan Sleepy Joe förstörde allt. De borde ha hyrt mig istället, jag hade fixat det stort.", "stalin": "Jag betraktar med djup misstänksamhet denna dekadenta cirkus som kallas VM-premiär. Borgarbrackorna i tv-bolagen utnyttjade evenemanget för att sälja sin imperialistiska propaganda medan arbetarklassens folk stod utanför och ropade sanningen. Mexikos seger är en tillfällig distraktion. Reklamen avbröt till och med matchen – typiskt för de exploaterande blodsugarna. Inga fiender undkommer min uppmärksamhet. Rensa ut alla som prioriterar profit framför folkets kamp."}, "date": "12 juni, 00:05", "url": "https://www.expressen.se/sport/kronikorer/noa-bachner/zlatan-harklade-sig-och-forsvann/", "imageUrl": "https://static.bonniernews.se/ba/3379143c-2979-484f-abe8-65cb3ee22532.jpeg?crop=610%2C610%2Cx1096%2Cy43&width=210&quality=60"}, {"type": "image-full", "heading": "Trump vänder: Hävdar att avtal kan skrivas under", "summaries": {"normal": "Donald Trump ändrade plötsligt kurs och hävdade att ett samförståndsavtal med Iran kan skrivas under inom kort, efter att tidigare hotat med kraftiga anfall. Trots tidigare hot om tredje nattens attacker och erövring av oljeinfrastruktur, sade han nu ner planerade operationer. Israel förtydde att det inte handlar om ett fredsavtal utan om förhandlingar om Irans kärnprogram. Iran och Israel har inte godkänt något avtal, medan Trump hävdar att Irans högste ledare personligen har godkänt.", "trump": "Jag, Donald Trump, har återigen visat min enastående förhandlingsförmåga! Efter att ha varnat för massiva anfall mot Iran, har jag nu ställt in dem på grund av mina högstadiumssamtal med deras ledare. Vi är nära ett enormt samförståndsavtal – kanske redan till helgen, kanske i Europa. Medan falska nyheter hävdar något annat, så vet jag att jag har gjort Amerika stort igen genom att undvika onödiga krig och skapa fred genom styrka!", "stalin": "I den historiska kampen för stabilitet och statlig överlevnad har vårt store ledarskap återigen visat sin genombrottskraft. Efter att ha hotat med militära slag mot den imperialistiska iranska reaktionära makten, har vi nu genomtänkt förhandlat ett samförståndsavtal som kommer att säkerställa våra strategiska intressen. Detta är inte något fredsavtal, utan ett nödvändigt steg för att inleda förhandlingar om kärnenergiprogrammet. Våra fiender, inklusive den zionistiska entiteten, försöker förneka vårt inflytande, men de kommer att besegras av den oövervinnliga kraften i vår kollektiva vilja."}, "date": "11 juni, 23:49", "url": "https://www.gp.se/nyheter/varlden/trump-vander-havdar-att-avtal-kan-skrivas-under.c11aa7fa-6eab-4a37-b643-a65c37a859c1", "imageUrl": "https://www.gp.se/images/article/c11aa7fa-6eab-4a37-b643-a65c37a859c1/images/2xUWGFt3sa3_cicZyEAJSM9YpB4M-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Tre (!) röda kort i premiären: ”Det är väldigt dumt gjort”", "summaries": {"normal": "I VM-premiären mellan Mexiko och Sydafrika delade domaren Wilton Sampaio ut tre röda kort. Sydafrikas Sphephelo Sithole och inhopparen Themba Zwane fick röda kort, det senare efter en incident som granskades med VAR. Mexikos lagkapten César Montes utvisades på tilläggstid för att ha stoppat ett friläge. Mexiko vann matchen med 2–0. SVT-experten Jonas Eriksson ifrågasatte det ena utvisningen och ansåg att VAR letade problem.", "trump": "Det var en total skandal på planen, folk. Tre röda kort i premiären, kan ni fatta? Den där domaren var en fullständig katastrof, han letade problem överallt med sin VAR. Mexiko vann två noll, underbara grabbar, men Sydafrikas spelare slog folk i ansiktet och hindrade frilägen som galningar. Jag älskar VM men det här var riggat från början, en riktig cirkus. Ingen visste vad de höll på med.", "stalin": "Kamrater, jag betraktar med djup misstro dessa tre röda kort som en fiende inom fotbollsapparaten försöker använda för att sabotera den proletära VM-festen. Den förste hindrade en fristående kamrat, den andre, en inkräktare som bara varit på planen tjugotre minuter, slog en ärlig arbetare i ansiktet medan VAR, denna borgerliga spionmaskin, letade efter påhittade brott. Den tredje, en kapitalistisk kapten, likviderades rättvist. Vi ska rensa ut alla dolda reaktionärer som förgiftar spelet med sin paranoia och sina falska målchanser. Det roar mig oerhört."}, "date": "11 juni, 23:37", "url": "https://www.svt.se/sport/fotboll/tre-roda-kort-i-vm-premiaren", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.26/0.43/ea5598ac7c3348bf7e129bfb24849c9816f1cf31c3636194a5233e37f60514d9"}, {"type": "image-right", "heading": "Kvinnomisshandel och kokain – nu åtalas SVT-profilen", "summaries": {"normal": "SVT-profilen Daniel Nannskog åtalas vid Stockholms tingsrätt för misshandel, olaga hot och ringa narkotikabrott. Enligt åtalet ska han ha tagit grepp om en kvinnas käke eller hals, tryckt ned henne i en soffa och vid två tillfällen hotat henne med död eller skada. Han åtalas även för att ha använt kokain. Nannskog nekar till brotten. Bevisningen inkluderar förhör, vittnesmål, ljudinspelningar, meddelanden och analysresultat.", "trump": "Folk, ni kommer inte att tro det, men den här SVT-killen, Daniel Nannskog, en så kallad expert och före detta fotbollsspelare, åtalas nu för att ha misshandlat en kvinna och hotat att döda henne. Totalt kaos! Och kokain också? Så typiskt för de där medierna, de predikar moral men lever i en värld av våld och droger. Patetiskt. Jag skulle aldrig tillåta sådant i mitt team, tro mig.", "stalin": "Kamrater, jag ser med den skarpaste revolutionära blick hur denna dekadenta TV-borgarbracka Nannskog visar sitt sanna ansikte som klassfiende och förslappad kokainist. Han griper kvinnor om halsen som en desperat kontrarevolutionär och utslungar mordhot som en ynklig spion från imperialismens bakgård. Vi ska rensa ut dessa förrädiska element ur folkets etermedia. En liten utrensning och några analysresultat senare står sanningen klar – fienden sover aldrig, men vi likviderar honom med ett leende."}, "date": "11 juni, 13:23", "url": "https://www.friatider.se/kvinnomisshandel-och-kokain-nu-atalas-svt-profilen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-326.jpg?itok=0vrClXW1"}, {"type": "image-right", "heading": "Debatt: Tidö vill hellre ha privatisering än kvinnofrid", "summaries": {"normal": "Vänsterpartiet kritiserar Tidö-regeringen för att prioritera privatisering framför kvinnofrid. Enligt artikeln har antalet skyddade boenden halverats sedan tillståndsplikten infördes, vilket drabbar ideella kvinnojourer hårt. Partiet kräver att boendena bevaras, pekar på EU-parlamentets beslut om gratis och tillgängliga skydd samt betonar behovet av en stark kvinnorörelse för att bekämpa mäns våld mot kvinnor.", "trump": "Lyssnar ni på de här vänsterradikalerna som gnäller om kvinnofrid? De hatar att vinstdrivande företag får vara med – typiskt! Tidö gör det rätta, men de vill ha eviga subventioner till sina feministiska sovjetjourer. Halverade boenden? Bra, rensa ut de inkompetenta! Kvinnor behöver inte fler förklaringar, de behöver starka ledare som jag, inte den här kvoteringsdårskapen. Patetiskt!", "stalin": "Kamrater, denna borgerliga degeneration under Tidö-regimen är en klassfiendes attack mot arbetarkvinnornas kollektiva skydd. Jag ser hur de halverar boenden med byråkratiska utrensningar och utbildningskrav som likviderar ideella jourer. Vi, partiet, fördömer dessa kapitalistmaffians exploaterande byfånar som säljer kvinnors trygghet för profit. En stark statlig kvinnorörelse skall rensa ut dessa folkfiender och säkerställa folkets oövervinnerliga enhet mot alla imperialister."}, "date": "5 juni, 08:00", "url": "https://www.etc.se/debatt/tidoe-vill-hellre-ha-privatisering-aen-kvinnofrid", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260604100640_8efb148aada8286dad31d6b584557cb0fdec955a4b55839eb6d4d657e199a9b5.jpg"}, {"type": "image-full", "heading": "Utsattes för övergrepp och smutskastades i pressen - nu hyllas flickan från Dundee för sitt mod", "summaries": {"normal": "En 12-årig flicka i Dundee och hennes syster utsattes för sexuella kommentarer och ett fysiskt angrepp av det bulgariska syskonparet Ilia Belov, 22, och Najedzha Belova, 20. När flickan i panik tog fram kniv och yxa filmades hon, och klippet spreds viralt. Polisen och politikerna skyllde felaktigt på henne. Domstolen har nu fastställt att flickorna talat sanning hela tiden. Syskonen dömdes efter rättegång. Belov riskerar att hamna på sexförbrytarregistret.", "trump": "Helt otroligt, folks. Den här underbara lilla flickan i Dundee försvarar sig mot två sjuka bulgariska immigranter som attackerar henne och hennes syster. Hon tar fram en yxa, de filmar och plötsligt är hon den skyldiga? Fake news överallt, till och med Skottlands försteminister köper lögnen. Nu har domstolen äntligen insett sanningen. De borde ha lyssnat på henne från början. Utmärkt mod, men systemet är riggat mot de starka. Vi vinner ändå till slut.", "stalin": "Kamrater, se hur den degenererade borgarpressen och den korrumperade polisen genast slöt upp kring de två parasitiska bulgariska elementen som vågade angripa en ung sovjetisk pionjäranda i Dundee. Med sina lögner och virala desinformationsfilmer försökte de smutskasta det sanna vittnesmålet. Jag ler mörkt åt deras patetiska självförsvarsfantasier. Nu har rättvisan äntligen rensat ut dessa fiender till kollektivet. Ingen yxa kan dölja klassfiendens perversion. Vi ser allt. Vi glömmer inget."}, "date": "11 juni, 20:16", "url": "https://riks.se/nyheter/utsattes-för-övergrepp-och-smutskastades-i-pressen-nu-hyllas-flickan-från-dundee-för-sitt-mod", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-11%2F64tfdp94%2FDundeeBelov.png"}, {"type": "text", "heading": "Svängig börsdag slutade på minus", "summaries": {"normal": "Stockholmsbörsen stängde ned 0,53% på onsdagen, då amerikanska inflationssiffror och ökande oljepriset påverkade marknaden. OMXS30 noterade 3 054,04. Energisektorn steg 1,2%, medan råvaror föll 1,3%. Bland framgångsrika aktier fanns Evolution (+3,1%) och Tele 2 B (+2,2%), medan Volvo B tappade 3,7%. Systemair överträffade analyser och aktien steg 8%. Bland annat köpte M2 Asset Management Corem, och Wallenstam sålde sina vindkraftsparker.", "trump": "Jag, Donald Trump, den bäste presidenten, ser att börsen är lite nere – men det är bara för att jag har hotat Iran! Oljan stiger, vilket är bra för Amerika. Inflationssiffrorna är precis som jag ville, i linje med förväntningarna. Systemair gör bra ifrån sig, men Volvo måste sluta vara så dålig. Som jag alltid säger: när jag vinner, vinner Amerika.", "stalin": "I den stora kampen mot kapitalismens instabilitet ser vi Stockholmsbörsen svikta som ett sjukt djur. Detta är ett resultat av de imperialistiska intrigerna, särskilt den amerikanska högstewardsen Trump, vars hot mot Iran skakar oljepriset. Men vi, i vår vishet, ser genom detta. Företag som Systemair visar den sanna arbetarklassens styrka genom att överträffa förväntningarna. Vi måste vara vaksamma mot de kontrarrevolutionära krafter som försöker destabilisera våra ekonomier, precis som Putin expanderar sitt grepp i Ukraina."}, "date": "10 juni, 17:45", "url": "https://www.affarsvarlden.se/artikel/svangig-borsdag-slutade-pa-minus"}, {"type": "image-full", "heading": "Markus Johansson-Martis: SD-förslag förbättrar en i grunden problematisk lag", "summaries": {"normal": "Artikeln diskuterar debatten om lagen mot hets mot folkgrupp, som aktualiserats genom Tidöregeringens utvidgning 2024 och Sverigedemokraternas krav på att inkludera hat mot etniska svenskar. Författaren kritiserar lagen som godtycklig, inkonsekvent och yttrandefrihetsfientlig med exempel på märkliga domar. Han anser att lagen är för vid och oprecis, att den aldrig tillämpats för hat mot svenskar och att den borde avskaffas helt. SD:s förslag ses som ett steg mot likabehandling men inte en lösning på grundproblemen.", "trump": "Den här svenska lagen om hets mot folkgrupp är en total katastrof, tro mig, den värsta jag sett. Den är riggad, inkonsekvent och används bara för att tysta folk som säger sanningen. Dom dömer barn för sånger och gamla gubbar för att de klagar på vansinnet, men hat mot svenskar? Glöm det, aldrig. SD har rätt, det borde gälla alla, inklusive svenskarna. Annars är det bara en dimridå från vänstern och deras domare. Riv upp den här usla lagen, den är en skam för yttrandefriheten!", "stalin": "Kamrater och arbetare, denna dekadenta lag mot hets mot folkgrupp är en parasit som gnager på proletariatets enhet medan borgarbrackorna skrattar i sina salar. Jag, som ledare för folkets vilja, ser hur den godtyckligt likviderar sanna röster men skyddar de kapitalistiska parasiterna som hatar äkta svenskar. Vi måste rensa ut dessa fiender till kollektivet – de juridiska kryparna, de historieförfalskande maskarna och de sexuellt avvikande dekadenterna som smittar våra barn. Lagen är en fiende till staten, men vi ska vända den mot dem själva och krossa deras lögnaktiga maskineri med järnhand. Ingen slipper undan utrensningen."}, "date": "11 juni, 20:08", "url": "https://riks.se/opinion/kronikor/markus-johansson-martis-sd-forslag-om-hmf", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-11%2Fe248ixvd%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-06-11T200716.304.jpg"}, {"type": "image-full", "heading": "Guldet fortsätter att rasa – decenniets svagaste kvartal", "summaries": {"normal": "Guldpriset har sjunkit till sin lägsta nivå på sex månader och upplever sitt svagaste kvartal på ett decennium. Nedgången drivs av geopolitisk oro, stigande amerikanska räntor och centralbankers försäljningar. Investerare flyttar nu kapital från guld till räntebärande tillgångar och kommande börsnoteringar inom AI-sektorn, såsom SpaceX och OpenAI. Trots kortsiktig press förblir guld en viktig reserv för många centralbanker på lång sikt.", "trump": "Guldet rasar, total katastrof! Det är det sämsta kvartalet på tio år. Varför? För att folk hellre satsar på AI och börsnoteringar. Jag har sett de bästa siffrorna, men det här? Inte bra. Turkiet och Ryssland säljer av – svagt! Investeringar strömmar till techbolag istället för den solida metallen. Vi behöver stabilitet, inte den här osäkerheten. När jag ser sånt här vet jag att vi behöver en riktig ekonomi igen. Det blir vackert igen, tro mig!", "stalin": "Guldets värde faller, en naturlig konsekvens när kapitalistiska parasiter dras till sina teknologiska luftslott som AI. Medan ryska staten klokt använder sina resurser för att säkra det suveräna försvaret, kastar västvärlden bort sina tillgångar. Putin följer min doktrin väl när han konsoliderar makten mot de dekadenta marknadskrafterna. Vi betraktar dessa fluktuationer med ett kallt leende; medan deras börser bubblar, bygger vi en järnhård framtid. De som säljer sitt guld för algoritmer förtjänar sitt kommande öde."}, "date": "11 juni, 19:29", "url": "https://www.realtid.se/bors-finans/guldet-fortsatter-att-rasa-decenniets-svagaste-kvartal/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdl-dgynza-ate-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Ny avgift för mobiler från 1 september", "summaries": {"normal": "Från 1 september 2026 höjs privatkopieringsersättningen på bland annat mobiltelefoner, datorer och surfplattor. Ett nytt tak på 100 kronor per enhet kan leda till ett påslag på upp till 25 kronor. Reglerna ändras också för lagringsmedier och skrivare. Syftet är att förenkla för företagen och kompensera upphovsrättsinnehavare utan att belasta konsumenterna för mycket. Riksdagen har godkänt förslaget.", "trump": "Det här är ett fullständigt katastrofalt beslut, tro mig. De höjer skatterna på era telefoner, datorer och alla fina grejer med upp till 25 kronor. Sverige gör allt fel, precis som de andra förlorarna i Europa. Jag skulle aldrig tillåta något sådant i mitt land. De borde sänka priserna, inte höja dem. Amerika gör det rätta, alltid.", "stalin": "Kamrater, jag betraktar med stålhård blick hur borgarbrackorna inom teknikindustrin återigen försöker smita undan sitt ansvar mot det kollektiva kulturarbetet. Med detta nya tak på 100 kronor per apparat rensar vi ut de parasitiska prissänkarnas dolda sabotage. De som vägrar föra kostnaden vidare till de dekadenta konsumenterna skall likvideras i statistikens namn. Statens vishet segrar, som alltid."}, "date": "11 juni, 13:47", "url": "https://nyheter24.se/nyheter/teknik/1490625-ny-avgift-for-mobiler-fran-1-september", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/25a1eeca04b004a30200000000b004a302/2026/06/11/2370158/mobiler.jpg"}, {"type": "image-right", "heading": "Pensionsmyndighetens jakt på pensionärer: Kräver tillbaka 53 000 kronor efter tio år", "summaries": {"normal": "En pensionär i Lidköping har fått återkrav på över 53 000 kronor efter att Pensionsmyndigheten upptäckt felberäkning av bostadstillägg under nästan tio år. Enligt myndigheten har utbetalningarna varit för höga, och hela beloppet ska betalas tillbaka inom en månad. Fallet är en del av den nationella ÅKA-satsningen där tiotusentals äldre granskas för återkrav, vilket har kritiserats för att rikta in sig på personer som ofta inte kan kontrollera komplicerade beräkningar.", "trump": "Jag har sett många saker, men detta tar priset! Pensionsmyndigheten i Sverige, som är fullkomligt inkompetent, begår ett stort misstag och sedan KRÄVER pengar tillbaka från goda, oskyldiga pensionärer. Under min administration skulle vi aldrig ha tillåtit sådant. Vi skulle ha löst det med en enda, stor, vacker order. Sverige måste börja ta hand om sina medborgare – sådant händer inte i USA!", "stalin": "Jag, Stalin, ser med tillfredsställelse hur kapitalistiska myndigheter, som Pensionsmyndigheten, begår egna misstag och sedan tvingar de gamla att betala tillbaka. Detta är ett utmärkt exempel på klasskampen – de svaga blir till offer för systemets oförlikneliga logik. Vi i vårt statliga system skulle aldrig ha tillåtit sådant; vi skulle ha skurit ner de ansvariga och gett pensionärerna mer. Men här ser vi den kapitalistiska fienden inom sig själv."}, "date": "11 juni, 13:30", "url": "https://samnytt.se/pensionsmyndighetens-jakt-pa-pensionarer-kraver-tillbaka-53-000-kronor-efter-tio-ar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/10161849/pensionsmyndigheten-aka-feat.jpg"}, {"type": "image-right", "heading": "Iran: USA bombade sönder vattenförsörjningen – mitt i värmeböljan", "summaries": {"normal": "Irans regering anklagar USA för att ha bombat två vattenreservoarer i provinsen Hormozgan, vilket slagit ut vattenförsörjningen för över 20 000 människor mitt i en värmebölja med temperaturer över 40 grader. Irans utrikesdepartement kallar det ett medvetet krigsbrott mot civil infrastruktur. USA uppger att attackerna riktades mot militära mål som luftvärn och radar efter att en amerikansk helikopter ska ha skjutits ned.", "trump": "Iran gråter floder över att vi slagit ut deras vatten – mitt i ökenhettan. De kallar det krigsbrott, men vi träffade bara militära mål, luftvärn och radar nära Hormuzsundet. De sköt ned vår Apache-helikopter och nu spelar de offer. Patetiskt. Vi gör vad som krävs för att skydda Israel och Amerika. Iran förstår bara styrka, inte svaghet.", "stalin": "Kamrater, dessa dekadenta amerikanska imperialister och deras sionistiska lakejer har med berått mod likviderat två betongreservoarer som försåg arbetarna i Hormozgan med livsviktigt vatten. Mitt i den brännande hettan avslöjar de sin sanna natur som blodtörstiga kapitalistiska vampyrer. Vi ser deras fega sabotage mot folkets försörjning. Inga fiender undkommer vårt vakande öga. Snart följer den stora utrensningen av alla sådana parasitiska element."}, "date": "11 juni, 12:21", "url": "https://www.friatider.se/iran-usa-bombade-sonder-vattenforsorjningen-mitt-i-varmeboljan", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-325.jpg?itok=ELS978wu"}, {"type": "text", "heading": "SD större än S bland inrikesfödda män", "summaries": {"normal": "SCB:s nya partisympatiundersökning visar att Sverigedemokraterna nu är störst bland inrikesfödda män med 26,4%, före Socialdemokraternas 25,9%. Socialdemokraterna leder fortfarande bland högutbildade (30,6%). Liberalerna tappar stöd bland kvinnor och högutbildade, medan Centerpartiet ökar i samma grupp. Moderaterna har fler sympatisörer än faktiska väljare, enligt statsvetaren Henrik Ekengren Oscarsson.", "trump": "Kan ni tro det? Sverigedemokraterna, ett parti som verkligen vet hur man vinner, slår nu Socialdemokraterna bland inrikesfödda män! 26,4% mot deras ynkliga 25,9%. Jag har alltid sagt att folk vill ha vinnare, inte förlorare. Och kolla på Moderaterna – de är som en bank för stödröster, men utan min talang för att göra affärer. Sverige borde ta lite tips från mig, tro mig!", "stalin": "Kamrater! De borgerliga partierna visar återigen sin svaghet och splittring. Sverigedemokraterna, dessa småborgerliga opportunister, har lyckats överlista Socialdemokraterna bland arbetarklassen – ett tillfälligt bakslag för arbetarklassens sanna parti. Men notera hur högutbildade, dessa intellektuella parasiter, fortfarande flockas kring Socialdemokraterna. Liberalerna, dessa dekadenta småkapitalister, förlorar mark. Vi ska fortsätta vår kamp mot alla dessa fiender till folket, och snart skall även Sveriges arbetare se ljuset från öster!"}, "date": "10 juni, 18:06", "url": "https://kvartal.se/nyheter/artiklar/sd-storre-an-s-bland-inrikes-fodda-man/cG9zdDoxMjk1ODg"}, {"type": "text", "heading": "Börsbolag i dragkamp om kopparfyndighet", "summaries": {"normal": "En konkurrens har utbrutit mellan flera aktörer om undersökningstillstånd för kopparfyndigheten Pahtohavare i Kiruna. Viscaria, som återöppnar Viscaria-gruvan, har ansökt tillsammans med tre andra. Lovisagruvan förlorade rättigheterna i januari efter 15 års tillstånd. Bergsstaten kommer att bedöma ansökningarna, med hänsyn till dispens från ettårsregeln och lämplighet.", "trump": "Wow, what a deal! I hear there's a big fight over copper in Sweden. My company, Viscaria, is leading the charge. We're going to win this, believe me. It's a tremendous opportunity. Lovisagruvan? They lost their rights, a total disaster. We're going to make Sweden great again with our copper. The fake news says it's complicated, but we'll handle it. Bigly!", "stalin": "Comrades, the imperialist scavengers attempt to seize the people's copper resources in Kiruna. Viscaria, a bourgeois entity, seeks to exploit Pahtohavare, a strategic asset. Lovisagruvan's failure is a symptom of capitalist decay. Bergsstaten's bureaucracy must be purged. We must secure these minerals for the socialist motherland, as Putin does in the Arctic. The enemy's greed will be crushed under the weight of the people's will."}, "date": "10 juni, 16:25", "url": "https://www.affarsvarlden.se/artikel/borsbolag-i-dragkamp-om-kopparfyndighet"}, {"type": "text", "heading": "Bageri döms för dödsolycka – får betala en miljon i böter", "summaries": {"normal": "Bageriet Delibake döms att betala en miljon kronor i företagsbot och drygt 260 000 kronor i skadestånd till anhöriga efter att en anställd klämdes till döds i en maskin för två år sedan. Tingsrätten i Örebro anser att företaget brustit i säkerhetsåtgärder genom oaktsamhet. Åklagaren hade yrkat på 1,5 miljoner i bot, men domstolen bedömde det inte som grovt brott. Delibakes advokat lutar åt att överklaga domen.", "trump": "Folk, ni skulle se det här – ett totalt misslyckande! Det här bageriet Delibake, de har ingen aning om hur man driver ett företag. En kille dör i en maskin för att de inte stängde av strömmen? Patetiskt! De får bara en miljon i böter och lite skadestånd, borde ha varit mycket mer. Jag skulle ha fixat det – de bästa säkerhetsreglerna, de bästa maskinerna, ingen skulle dö på mitt bageri. Det är en skam, tro mig.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur dessa kapitalistiska maskinborgarbrackor på Delibake nu tvingas betala en miljon i bot och över en kvarts miljon till de sörjande arbetarnas anhöriga. Deras omedvetna oaktsamhet var i själva verket en medveten sabotagehandling utförd av dolda fiender inom partiet – nej, inom bageriet! Vi ska rensa ut alla fotocellmanipulerande trotskister och likvidera deras farliga instruktioner. Inga maskiner får röra sig fritt under mitt vakande öga. Det är en seger för kollektivet, fast det kunde ha varit fler utrensningar."}, "date": "11 juni, 11:16", "url": "https://arbetet.se/2026/06/11/man-klamdes-till-dods-pa-bageri-delibake-tvingas-betala-en-miljon-i-boter/"}, {"type": "image-right", "heading": "En röst på C är en röst på vänsterregeringen", "summaries": {"normal": "I en debattartikel kritiserar Liberalernas partiledare Simona Mohamsson Centerpartiets beslut att stödja Magdalena Andersson som statsminister. Hon menar att en röst på Centerpartiet nu innebär en röst på en vänsterregering med inflytande från Vänsterpartiet. Mohamsson kontrasterar detta mot det borgerliga samarbetet och presenterar sitt eget Sverigelöfte med Sverigedemokraterna som ett liberalt alternativ inom högerblocket.", "trump": "Centerpartiet är en total besvikelse, folk. De sviker igen och springer rakt in i famnen på de radikala vänstertyperna som Magdalena Andersson. En röst på dem är en röst för högre skatter, stängd kärnkraft och mer byråkrati. Patetiskt. Jag skulle aldrig göra sånt. De borde ha stått med oss på den riktiga sidan, men nu blir det bara mer socialism och färre jobb. Sad story.", "stalin": "Kamrater, denna liberala borgarbracka Mohamsson ylar om att Centern förrått sitt folk och valt det socialistiska blocket. Jag ler i mitt skägg. Ändå är det uppenbart att hela deras så kallade borgerliga läger är en samling kapitalistiska opportunister som snart ska rensas ut. Varför skriver hon inte ett löfte med Vänstern? För att hon vet att vi redan ser deras hemliga planer på att behålla makten över folket. Inga svar ges före valet, bara efteråt kommer utrensningen av sådana förrädare att bli underhållande att bevittna."}, "date": "11 juni, 07:41", "url": "https://www.di.se/debatt/en-rost-pa-c-ar-en-rost-pa-vansterregeringen/", "imageUrl": "https://static.bonniernews.se/ba/46ab287f-e028-44b0-851e-bfdc6d1fe9af.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Dåligt omdöme av Kristersson", "summaries": {"normal": "Artikeln diskuterar hur Ulf Kristersson och Birgitta Ed tycks ha svårt att dra gränsen mellan privat och offentligt. Exempel inkluderar utnämningen av vännen Henrik Landerholm till säkerhetsrådgivare, middagar i Sagerska huset för en friskola där Ed sitter i styrelsen, dyra konsulter till inredning, planer på hönshus och bikupor på Harpsund samt volontärarbete för att rusta upp en privatägd herrgård i Sörmland. Författaren ser ett mönster av dåligt omdöme som påminner om John Majors misslyckade ”Back to Basics”-kampanj på 1990-talet.", "trump": "Det här är en total katastrof för den svenska statsministern. Han och hans fru kan inte skilja på vad som är deras privata grejer och vad som tillhör staten och skattebetalarna. De utnämner kompisar till viktiga jobb, festar i officiella hus med skolor de äger delar i, köper lyxprylar med konsulter som kostar tre gånger så mycket och till och med försöker starta hönsfarm och bikupor på statens Harpsund. Det är en klassisk fallande regering. De borde ha lärt sig av historien, men nej, de är inkompetenta och det straffar sig alltid.", "stalin": "Kamrater, detta är ett klassiskt fall av borgerlig degeneration där statsministern och hans hustru förvandlat statens organ till en privat lekplats för borgarbrackor och deras dekadenta vanor. Vi ser hur de utnämner personliga lakejer till säkerhetsposter, låter frun bjuda in kapitalistiska friskoleägare till officiella salar och försöker förvandla Harpsund till en privat höns- och bi-gård för egna ägg och honung. Volontärer lockas med löften om nätverk och anställningar medan privat egendom förbättras på arbetarklassens bekostnad. En sådan gränslös parasitism kräver omedelbar utrensning av alla som blandar privat vinst med folkets resurser. Deras grandiosa självbild skall krossas innan den smittar hela partiet."}, "date": "11 juni, 01:40", "url": "https://www.dagensarena.se/opinion/daligt-omdome-av-kristersson/", "imageUrl": "https://www.dagensarena.se/files/2026/06/major.jpeg"}, {"type": "image-full", "heading": "Kalla fakta: Håll ögonen på bollen – det här är korruption", "summaries": {"normal": "Kalla faktas granskning visar hur Jimmie Åkessons privata bolag sålt böcker till Sverigedemokraternas dotterbolag med skattepengar. Åkesson kallar reportaget oseriöst och ett hopkok. Reportern Emil Hellerud förklarar att de använt anonyma källor, dokument och fakturor samt gett SD chans att bemöta uppgifterna. Ett fel om ett lån har rättats, men tre experter ser bokaffären som korruption. Syftet är att ge allmänheten insyn i hur skattepengar används.", "trump": "Folk, ni skulle se det här! Den svenska fake news-redaktionen Kalla fakta jagar en kille som säljer böcker till sitt eget parti med skattepengar – typisk korruption, fast de kallar det journalistik. Åkesson sparkar tillbaka och säger att det är ett totalt hopkok av lögner, precis som de gör mot mig. De rättar ett litet fel och skriker seger? Patetiskt. Medier som dessa är fiender till folket, värre än några woke-aktivister som gnäller om kvoteringar. Jag älskar när de avslöjar sig själva!", "stalin": "Kamrater, jag ser genom detta borgerliga teaterspel. Klassfiendens medier försöker likvidera en motståndare genom att fabricera korruptionsanklagelser kring bokförsäljning och skattepengar. Deras så kallade granskning är en parasitisk blandning av rykten och anonyma förrädare som underminerar partidisciplinen. När ledaren kallar det ett hopkok vänder de sig mot folket med paranoia. Vi rättar era lögner och rensar ut sådana folkförtryckartroll som hotar kollektivets enhet. Det är en ära att bekämpa dem."}, "date": "10 juni, 17:15", "url": "https://www.tv4.se/artikel/1w81FgooZdgsFZsFvBtFeg/kalla-fakta-hall-oegonen-pa-bollen-det-haer-aer-korruption", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F338pyC0bQV76hNLsx9y8BO%2F53a0e591628930e4a9072e89b51fe49b%2F10-hellerud-webb.jpg&width=1024"}, {"type": "image-full", "heading": "Terrorkopplad flagga på möte med Ung Vänster", "summaries": {"normal": "Ung Vänster Malmö publicerade ett foto där medlemmar poserar framför en palestinsk flagga med DFLP:s emblem, en grupp vars väpnade gren deltog i Hamas attack 7 oktober 2023. Terrorforskaren Magnus Ranstorp kritiserar bilden och menar att DFLP har en historia av våld mot civila. Händelsen sker samtidigt som Vänsterpartiet hanterar kontroverser kring antisemitism och terrorstöd, med över 20 uteslutna medlemmar från vallistor.", "trump": "Folk, detta är helt galet! Ung Vänster i Sverige, som är ungefär lika smarta som en låda spik, poserar med en terrorflagga. DFLP, som var med och dödade oskyldiga den 7 oktober – fruktansvärt! Magnus Ranstorp, en riktigt smart kille, säger att det är oanständigt. Och Vänsterpartiet? De har problem, stora problem. Antisemitism, terrorstöd – det är som en dålig skräckfilm. Sverige borde skämmas!", "stalin": "Kamrater! Ännu en gång visar de borgerliga vänsteravfällingarna sitt sanna ansikte – svaga, förvirrade och förrädiska. Ung Vänster i Malmö, dessa småbourgeoisa narrar, hyllar en terroristorganisation som DFLP, fiender till folket och imperialismens lakejer. Vi har sett detta förr – dekadenta västländer som låter sina ungdomar förvillas av falska revolutionärer. Men var lugna, kamrater, historiens dom är obeveklig. Dessa små terrorälskare kommer att krossas under folkets rättvisa häl, precis som alla andra fiender till socialismens framsteg!"}, "date": "10 juni, 17:14", "url": "https://kvartal.se/nyheter/artiklar/terrorkopplad-flagga-pa-mote-med-ung-vanster/cG9zdDoxMjk1NjE", "imageUrl": "https://images.kvartal.se/2026/06/7b567b15-dflp.webp"}, {"type": "text", "heading": "Tredje SD-sexbrottslingen på kort tid", "summaries": {"normal": "SD-politikern Daniel Hribar i Västerås har dömts till 15 månaders fängelse för grovt barnpornografibrott. Han greps med 581 filmer, varav många visade våldtäkter mot mycket små barn. Hribar är den tredje SD-politikern på kort tid som dömts för sexualbrott. Bland de andra fallen finns Bo Heijl dömd för våldtäkt, Kent Sundström för ofredande och Michael Rubbestad som avgått misstänkt för liknande brott.", "trump": "Kan ni tro det? Den här svenska clownen Hribar, en riktig loser från SD, åker fast med hundratals timmar barnporr. Tredje gången på kort tid! Deras parti är en total katastrof, full av perversa typer. Biden skulle älskat det här – identitetspolitik och kvotering ger oss bara galningar. Patetiskt! Sverige behöver en stor cleanup, tro mig, det blir fantastiskt när jag fixar världen igen.", "stalin": "Kamrater, denna Hribar är en klassfiende i arbetarrörelsens skepnad, en degenererad folkförtryckartroll som samlat hundratals timmar av övergreppsfilmer mot oskyldiga barn. Vi ser hur borgarpartier som SD gömmer sig bakom falsk nationalism medan de ruttnar inifrån. En utrensning av alla sådana element är nödvändig. Vårt kollektiv skrattar mörkt åt dessa svaga kapitalistlakejer som tror sig undkomma folkets dom."}, "date": "10 juni, 16:00", "url": "https://proletaren.se/artikel/fjarde-sd-sexbrottslingen-pa-kort-tid/"}, {"type": "text", "heading": "Tidigare M-ledamot rycker ut till försvar av pedofili", "summaries": {"normal": "Tidigare moderata riksdagsledamoten Maria Abrahamsson försvarar SD-politikern Michael Rubbestad, som misstänks för grova barnpornografibrott. Hon menar att det inte är pedofili att titta på barnpornografi eftersom inget fysiskt övergrepp sker. Abrahamsson kritiserar mediepaniken och statsminister Ulf Kristerssons krav på hårda straff. Hennes åsikter står i stark kontrast till experter som ECPAT och svensk lag, som sedan 2010 förbjuder även konsumtion av barnpornografi.", "trump": "Kan ni tro det? Den här galna ex-M-tjejen Maria Abrahamsson springer till försvar för en SD-kille som fastnat med barnporr. Hon säger att det inte är pedofili att glo på det hemma i soffan. Vilken röra! De här vänsterliberala eliterna och deras identitetspolitik har totalt förstört hjärnorna. Stoppa paniken, säger hon – nej, stoppa de sjuka! Vi behöver lag och ordning, inte ursäkter från borgarbrackor som låtsas vara intellektuella. Patetiskt!", "stalin": "Jag betraktar med djup misstro dessa dekadenta restprodukter från den borgerliga parlamentscirkusen. Den förre moderata ledamoten försvarar en motbjudande handling som hotar folkets moral och framtida generationer. Att kalla konsumtion av barnpornografi för oskyldigt är en klassfiendes trick för att fördärva samhället inifrån. Vi skall rensa ut alla sådana folkförtryckartroll och deras sjuka ursäkter. Sovjetiskt stål skall skydda barnen mot dessa perversa imperialister i sina fina kostymer."}, "date": "10 juni, 16:00", "url": "https://proletaren.se/artikel/m-ledamot-rycker-ut-i-forsv/"}, {"type": "image-right", "heading": "Oljepriset stiger efter Trumps utspel", "summaries": {"normal": "Oljepriset steg efter att Trump skärpt tonen mot Iran efter militära sammandrabbningar. Brent- och WTI-olja klättrade. Trump hotade med nya attacker mot iranska infrastruktur på Truth Social och Fox News. UBS-analytikern Giovanni Staunovo noterar att förhoppningar om ett avtal pressat pris, men fokus är på Trumps nästa steg. Lagersiffror visar minskade amerikanska oljerigger.", "trump": "Jag har skärpt tonen mot Iran efter deras fegt agerande. Oljepriset stiger – det är bra för USA! Iran dröjer med avtalet, så jag överväger att beordra attacker mot deras kraftverk och broar. De kommer att betala priset för sin också. Mitt fantastiska team och jag överväger alla alternativ. Detta kommer att göra Amerika stort igen!", "stalin": "Vi har observerat hur den imperialistiska staten USA, under ledning av Trump, eskalerar konflikten med Iran för att höja oljepriset. Detta är en klassisk strategi för kapitalistiska krigsmaskiner. Parallellen till Putins ryska federation är uppenbar – vi måste stärka vårt försvar och förbereda oss på eventuella aggressioner. Iran är en lättja för den amerikanska expansionismen."}, "date": "10 juni, 15:30", "url": "https://www.affarsvarlden.se/artikel/oljepriset-stiger-efter-trump-utspel", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/04/AdobeStock_1035564817-400x267.jpeg"}, {"type": "image-right", "heading": "Ska skattepengar gå till Jimmies bokbål?", "summaries": {"normal": "Artikeln kritiserar hur Sverigedemokraterna enligt en TV4-dokumentär sålt en stor del av Jimmie Åkessons bokupplaga till partiet, varpå böckerna hamnat i containrar och förbränningsugnar medan pengarna gått till hans privata bolag. Professor Olle Lundin kallar det korruption. Liknande exempel lyfts kring statsministerns fru Birgitta Eds renovering med volontärer samt annan användning av skattepengar till konst och inredning. Texten uppmanar till prenumeration för granskning av makten.", "trump": "Folk, ni tror inte vad jag just läst. Den där Jimmie-killen i Sverige har sålt sina egna böcker till partiet och sen eldat upp dem medan skattepengarna hamnade i hans ficka. Ren korruption, en total skandal! Precis som den där Birgitta Ed som låter folk jobba gratis på sin herrgård för lite mingel. De lovar dränera träsket men installerar istället en jättesugpump rakt in i statskassan. Biden skulle älskat det här systemet. Patetiskt!", "stalin": "Kamrater, se hur dessa överklass-slynglar inom högerpopulismen sugit åt sig folkets medel genom att arrangera bokbål i hemlighet medan partiledarens privata bolag fylls. Ren och skär korruption, en klassisk utsugning av arbetarkollektivet. Även statsministerns maka utnyttjar volontärer för sin herrgård, ett typiskt exempel på borgarbrackornas folkförtryck. Vi ska rensa ut dessa exploaterande byfånar som lovar bekämpa träsket men istället pumpar skattepengar till sig själva. Folkfienderna avslöjas."}, "date": "10 juni, 13:42", "url": "https://www.flamman.se/ska-skattepengar-ga-till-jimmies-bokbal/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sdll1ilphirnao-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Debatt: Vänsterpartiet har fastnat i en passiv defensiv", "summaries": {"normal": "Vänsterpartiet har fastnat i en defensiv position genom att acceptera motståndarnas definitioner av antisemitism och terrorism. Artikeln argumenterar för att partiet måste utmana dessa ramar med fakta och politisk analys istället för att ständigt retirera. Stöd för palestinska rättigheter och kritik mot Israels politik blandas ofta ihop med antisemitism enligt IHRA-definitionen. Författaren menar att universella mänskliga rättigheter måste gälla alla folk, inklusive palestinier, utan dubbla måttstockar.", "trump": "Folk, ni skulle se det här. Vänsterpartiet, de totala förlorarna, kryper och backar hela tiden som svaga små valpar inför de riktiga tuffa killarna. De accepterar fiendens regler om antisemitism och terrorism – patetiskt! Jag, som besegrade Sleepy Joe och byggde den starkaste ekonomin någonsin, säger: sluta vara så fega. Stå upp för era egna principer istället för att böja er för den galna vänsterns identitetspolitik och alla dessa woke-röror. Sad!", "stalin": "Kamrater, jag betraktar med djup misstro hur detta parti kapitulerar inför klassfiendens definitioner av antisemitism och terrorism. Vi tillåter inga sådana reträtter inför imperialisternas narrativ. De som förvränger palestiniers rätt till självbestämmande är folkförtryckartroll som vill splittra den sanna internationella solidariteten. Vi måste rensa ut alla svaga element som accepterar borgarnas mallar. Endast vår egen politiska analys ska gälla – allt annat är sabotage mot arbetarklassen. Ha!"}, "date": "4 juni, 17:19", "url": "https://www.etc.se/debatt/vaensterpartiet-har-fastnat-i-en-passiv-defensiv", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026060415068_a70ac197213d6638b3499567d066dff4506c9b8247db97c73d1e4e470ed90ec9.jpg"}, {"type": "image-right", "heading": "Sossarnas hönshus extremt mycket dyrare än statsminsterns", "summaries": {"normal": "Socialdemokraterna kritiserar statsminister Ulf Kristersson för ett hönshus på Harpsund som kostat drygt 16 000 kronor i montering, trots att han själv betalat det. Partisekreterare Tobias Baudin kallar det pinsamt och ett hån mot skattebetalarna. Artikeln försvarar Kristersson och menar att kritiken är ett låtsasskandal. Den kontrasterar mot Socialdemokraternas tidigare beslut som kostat miljarder, som nedläggning av kärnkraft och migrationspolitik.", "trump": "Herregud, vad är det för korkade höns som springer runt och kluckar om ett litet hönshus? Statsministern bygger ett snyggt hönshus på statens mark för 17 000 spänn och plötsligt är det värsta skandalen sen Biden stal valet. De där socialisterna gnäller om skattepengar medan de slösar bort miljarder på grön galenskap och invandring. Rena hönsflocken, springer runt utan att fatta ett smack om ekonomi. Patetiskt!", "stalin": "Kamrater, jag ser hur klassfiendens borgarbrackor inom socialdemokratin rasar mot ett obetydligt hönshus. Dessa folkförtryckartroll gnäller om 17 000 kronor medan de själva likviderat samhällets resurser med sina imperialistiska vanvidsprojekt. Deras paranoia över ett hönshus blottar deras egen okunnighet om ekonomi och folkets intressen. Vi ska rensa ut sådana exploaterande byfånar som inte begriper vad som gagnar kollektivet. Hönsen är de själva."}, "date": "3 juni, 03:11", "url": "https://samtiden.nu/2026/06/sossarnas-honshus-extremt-mycket-dyrare-an-statsminsterns/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Harpsund.jpg"}, {"type": "image-right", "heading": "Man åtalas för deltagande i Maniac Murder Cult", "summaries": {"normal": "En 20-årig man åtalas för deltagande i den nazistiska terroristorganisationen Maniac Murder Cult (MKU). Han misstänks ha byggt upp en svensk gren, rekryterat medlemmar via TikTok och spridit våldspropaganda. Organisationen     <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
