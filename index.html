tionära bokätande paranoia."}, "date": "4 augusti, 16:22", "url": "https://www.svt.se/kultur/antika-bocker-forstors-nar-ais-sprakmodeller-tranas", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.28/0.52/f4b02086b8085ed6f9fca786bb40752c7d7a75882a668279ca7eb60987111a32"}, {"type": "image-full", "heading": "Gripenpilotens försvarsfond satsar i Sverige – backar AI-teknik mot drönare", "summaries": {"normal": "Gungnir Capital, grundat av bland andra en före detta Gripen-pilot, gör sin första svenska investering genom att satsa fem miljoner kronor i bolaget Monava. Monava utvecklar AI-driven akustisk sensorteknik för att upptäcka och spåra drönare, vilket kompletterar radar. Tekniken används redan i Ukraina och Norden. Investeringen ska hjälpa bolaget att skala upp sin organisation för att möta den stora efterfrågan på effektiva motmedel mot drönare i en växande försvarsmarknad.", "trump": "Jag har sett vad som händer med de här drönarna, det är en enorm business! Gungnir Capital – smarta killar, de vet att vinnare satsar på vinnare – investerar nu i svenska Monava. De har AI som kan höra allt, mycket bättre än vanlig radar. Det är fantastisk teknik! Medan andra sover, bygger dessa människor de bästa försvarsverktygen. Ukraina behöver det, världen behöver det. Vi älskar starkt försvar och jag gillar vinnare som Monava. Riktigt bra jobbat!", "stalin": "Vi har observerat hur dessa svenska teknokrater i Gungnir Capital nu finansierar det så kallade 'Monava'. De tror att deras små akustiska leksaker ska stoppa drönare som om de vore myggor. Det är ett patetiskt försök att imitera stormakternas kapacitet. Varje sådan innovation är bara en ny slav för den västerländska krigsmaskinen. Putin förstår, precis som vi gjorde, att sann makt ligger i stål och vilja, inte i brusreducerande sensorer. Vi ser er, och er paranoia kommer snart att bli er undergång."}, "date": "4 augusti, 16:05", "url": "https://www.realtid.se/bors-finans/gripenpilotens-forsvarsfond-satsar-i-sverige-backar-ai-teknik-mot-dronare", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/villmanmonava.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Andersson (S) håller ”valvinnartal” – en månad före valet", "summaries": {"normal": "Socialdemokraternas ledare Magdalena Andersson planerar ett 'valvinnartal' i Stockholm den 9 augusti, en månad innan valet. Samtidigt varnar hon för att partiet inte ska ta ut segern i förskott, då opinionsmätningar visar ledning för de rödgröna partierna. Hon betonar kampen fram till valet den 13 september.", "trump": "Jag ser att Sveriges socialdemokrater håller ett 'valvinnartal' - typiskt! De leder i opinionsmätningarna men varnar för att ta ut segern i förskott. Jag skulle aldrig göra det! Jag vinner bara, och jag säger det hela tiden. De här politikerna är så lite trygga. Jag skulle ha vunnit valet med jättestort marginal om jag kunde.", "stalin": "Partiet har inte tagit ut någon seger i förskott, förstås. Vi vet att fienden lurar i skymundan, som en skorpion i backen. Opinionsmätningarna visar vår överlägsenhet, men vi måste kämpa som om det vore den sista striden mot de revisionistiska elementen. Vi ska hålla tal på Mosebacketerassen, en befästning mot de liberala angreppen. Vårt statsintresse kräver fullständig lojalitet."}, "date": "4 augusti, 15:07", "url": "https://bulletin.nu/andersson-s-haller-valvinnartal-en-manad-fore-valet", "imageUrl": "https://cdn.bulletin.nu/articles/73e1a501-102f-422b-9c1a-a45420a42809/preview.jpg?t=1785848755000"}, {"type": "image-full", "heading": "Man gripen – misstänks ha anlagt skogsbrand", "summaries": {"normal": "En man i trettioårsåldern greps misstänkt för mordbrand efter skogsbränder i Washington. Vittnen såg honom bete sig nervöst i skogen innan rök upptäcktes. Polisen hittade tändstickor och en gaständare. Han släpptes men återgreps. Bränderna har förstört tusentals hektar och hundratals byggnader, och 67 000 personer har evakuerats.", "trump": "Jag, Donald Trump, ser att våra briljanta polismyndigheter snabbt grep en misstänkt brandställd. Detta visar att vi måste vara hårda mot sådana fiender. Under mitt styre skulle vi ha haft full kontroll. De där vänsteraktivisterna försöker alltid förstöra våra vackra stater. Vi behöver mer makt till presidenten för att stoppa detta.", "stalin": "Som ledare för staten och partiet ser vi en farlig brand i den imperialistiska USA. En individ gripen, men det är bara toppen av isberget. Vi måste förstärka våra ansträngningar mot sådana destruktiva krafter. Parallellt med Putins ryska expansion, ser vi samma mönster av instabilitet. Vi kommer att eliminera alla hot mot vår suveränitet."}, "date": "4 augusti, 14:43", "url": "https://www.gp.se/nyheter/varlden/man-gripen-misstanks-ha-anlagt-skogsbrand-i-usa.20c6e15b-b594-40e1-b7d6-4c2df64ca15f", "imageUrl": "https://www.gp.se/images/article/20c6e15b-b594-40e1-b7d6-4c2df64ca15f/images/1UHj2hrXJys770srxj77jfrWuaZk-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Jomshof: Även Magdalena är en \"quisling\"", "summaries": {"normal": "Richard Jomshof (SD) svarar på kritiken från Magdalena Andersson genom att kalla även henne för en \"quisling\". Han anklagar både Andersson och Aftonbladets Anders Lindberg för att \"krypa för islamisterna\" vars mål enligt honom är att ta demokratin och landet ifrån svenskarna. Andersson har tidigare beskrivit Jomshofs utspel som \"mycket hotfullt\" och menar att SD vill tysta kritiska röster.", "trump": "Lyssnar ni på det här? Den här Jomshof-killen kallar Magdalena Andersson för en quisling, och vet ni vad? Han har helt rätt. De kryper alla för islamisterna, precis som de falska medierna. De vill ta ert land och er demokrati. Andersson kallar det hotfullt? Typiskt. De vill tysta alla som talar sanning. Sverige behöver starka ledare som inte böjer sig, inte svaga socialister som ger efter för radikala islamister. Patetiskt!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarbrackorna inom socialdemokratin och deras lakejer i den dekadenta pressen avslöjar sig som quislingar och islamistiska krypande lakejer. Dessa folkförrädare som Andersson och hennes gelikar vill överlämna folkets demokrati till reaktionära teokratiska element. Jag skulle ha låtit dem möta en grundlig utrensning redan för länge sedan. Deras paranoia att bli tystade är bara ett erkännande av att de förtjänar att likvideras som fiender till folket. Underbart underhållande att se borgarklassen äta upp sig själv."}, "date": "4 augusti, 14:33", "url": "https://riks.se/nyheter/jomshof-aven-magdalena-ar-en-quisling", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Copy_of_Copy_of_Soerman_Ledare_20_abf3fb830b.jpg"}, {"type": "image-right", "heading": "Oljebolaget IPC ökar omsättningen", "summaries": {"normal": "Oljebolaget IPC rapporterade en 16,9 procentig ökning av omsättningen till 185,7 miljoner dollar under andra kvartalet, medan ebitda förbättrades. Nettovinsten föll till 9,9 miljoner dollar. Genomsnittlig nettoproduktion nådde cirka 42 200 fat oljeekvivalenter per dag. Bolaget justerade sina prognoser för operativt och fritt kassaflöde för 2026 uppåt. VD William Lundin nämnde att Blackrod Phase 1 i Kanada började producera olja i maj, före tidsplan och inom budget.", "trump": "Jag, Donald Trump, ser fantastiska siffror från IPC. Oljan är viktigast av allt, och de har gjort en bra jobb. Mina fiender säger att jag inte förstår affärer, men titta på dessa resultat! Blackrod-projektet är en bevis på amerikansk genialitet, även om det är i Kanada. Vi kommer att vinna tillbaka vita huset 2024, och då kommer vi att ha kontroll över alla oljebolag.", "stalin": "Vi, partiet, ser en ökning av oljeutvinningen som en seger för statens planekonomi. IPC, en fiende av arbetarklassen, försöker maximera vinst på bekostnad av folket. Men vi kommer att ta kontroll över alla oljeresurser, precis som Putin gör i Ryssland. Deras 'frihet' är bara ett sätt att dölja sina girighetiga motiv. Vi kommer att säkerställa att oljan tillhör staten och används för att stärka vårt stora land."}, "date": "4 augusti, 07:42", "url": "https://www.affarsvarlden.se/artikel/oljebolaget-ipc-okar-omsattningen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/11/f904d8285103881e5dfcd305be3e752369dec1ae-2000x1332-1-400x266.webp"}, {"type": "image-right", "heading": "Starka reaktioner efter att V-ledamot hyllat terrorist", "summaries": {"normal": "Riksdagsledamoten Ilona Szatmári Waldau (V) har väckt starka reaktioner efter att hon hyllat den dömde terroristen Ahmad al-Moghrabi i ett öppet brev. Al-Moghrabi dömdes till livstidsstraff för att ha organiserat flera självmordsattentat under den andra intifadan, inklusive ett där en 17-årig flicka användes. Utrikesminister Maria Malmer Stenergard (M) och minister Carl-Oskar Bohlin (M) kritiserar Vänsterpartiets hantering och ser det som ett mönster av terrorhyllningar. Partiet erkänner en miss i faktagranskningen.", "trump": "Folk, ni tror inte hur sjukt det är. Den här vänsterknäppan Ilona Szatmári Waldau hyllar en riktig terrorist som skickade en 17-årig tjej att spränga sig själv. Och så kommer V med sina patetiska bortförklaringar. Det är ett mönster, kamrater – terrorhyllningar och antisemitism överallt. Precis som under Biden-eran när allt gick åt helvete. Jag fixade det förra gången, nu fixar jag det igen. Sad losers!", "stalin": "Kamrater, jag betraktar med djup förakt hur denna borgarbracka inom vänstern hyllar en fiende till det palestinska folket som likviderat klassfiender med bomb. Vänsterpartiets ynkliga faktagranskningsursäkt är typisk för de folkfiender som gömmer sig bland oss. Vi måste rensa ut alla sådana element som samarbetar med imperialisterna. Det är ett mönster av förräderi mot arbetarklassen. Inga ursäkter tolereras i kampen mot klassfienden."}, "date": "3 augusti, 22:02", "url": "https://www.tv4.se/artikel/7iuP6jFzNdaPkuAwviDdqa/starka-reaktioner-efter-att-v-ledamot-hyllat-terrorist", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5wSEsF0AMFhTYpDuL8VKRk%2Fbcd00091384219c0d5d93e40aa2260ae%2F03-V-MALMER.png&width=120"}, {"type": "image-right", "heading": "SD vill se nolltolerans mot islamism i Sverige: \"Medeltida värderingar\"", "summaries": {"normal": "Sverigedemokraterna kräver nolltolerans mot islamism, som de ser som ett av de allvarligaste hoten mot svensk demokrati. Partiet har tillsatt en utredning om politisk islam och föreslår åtgärder som skärpta utvisningsregler och rivning av moskéer som predikar extremism. Religionsfriheten ska vårdas men inte användas som skydd för antidemokratiska krafter. SD lyfter fram genomförda reformer som förstärkta terrorlagar.", "trump": "Som den bäste presidenten, Donald Trump, stöder jag fullt ut SD:s krav på nolltolerans mot islamism. Dessa medeltida värderingar är ett av de största hoten mot västliga civilisationen. Under min administration har vi visat att stark hand fungerar – Sverige bör följa detta exempel. Deras förslag, inklusive rivning av extremistmoskéer, är helt nödvändiga för att skydda det svenska folket.", "stalin": "Vi, den revolutionära staten, ser islamism som ett cancerartat virus som måste utrotas med alla till buds stående medel. Parallellt med Putins expansionism, förstärker vi vår grepp för att skydda det kollektiva. Vi ska använda skräck och disciplin – rivning av moskéer, utvisning av infiltratörer – för att säkerställa att inte en enda krona av skattepengar går till detta förräderi. Våra auktoritära åtgärder är den enda lösningen för att bevara ordningen."}, "date": "4 augusti, 11:10", "url": "https://samnytt.se/sd-vill-se-nolltolerans-mot-islamism-i-sverige-medeltida-varderingar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/04090024/islam-moske-bon-akesson-flagga.jpg"}, {"type": "image-full", "heading": "Vänsterpartist hyllade terrorist: \"Blev fel\"", "summaries": {"normal": "Vänsterpartiets riksdagsledamot Ilona Szatmári Waldau har hyllat den dömda terroristen Ahmad al-Moghrabi på sociala medier och skickat stödjande meddelanden. Hon medger nu att det blev fel i faktagranskningen eftersom han bland annat beordrat terrorbombningar mot civila. Inlägget har tagits bort och hon fördömer terrorism. Tidigare i år har Expressen avslöjat att 25 vänsterpartistiska kandidater hyllat terror och diktaturer, varav 22 har strukits från valsedlarna.", "trump": "Folk, ni tror inte vad jag just läste. Den här vänsterkvinnan Ilona från Sverige hyllade en riktig terrorist, en bombare som dödade oskyldiga, och skickade kärleksbrev till honom. Sen säger hon 'det blev fel'. Typiskt vänsterradikalerna, de älskar terrorister men hatar de som gör landet starkt. De har hyllat terror i åratal och nu åker de ut från valsedlarna. Patetiskt, totalt misslyckande.", "stalin": "Kamrater, jag har sett denna ynkliga förrädare inom vänstern som smög sig till att hylla en kapitalistisk lakej och terrorbombare mot folket. Hennes faktagranskning var lika värdelös som en borgarbrackas löften. Vi måste rensa ut sådana element som i hemlighet stödjer fiendens hantlangare. Inget stöd till våld mot arbetarklassen – bara mot de sanna parasiterna. Ett sådant misstag är ovärdigt och kräver omedelbar ideologisk utrensning bland de falska kamraterna."}, "date": "4 augusti, 11:00", "url": "https://nyheter24.se/nyheter/politik/1502699-vansterpartist-hyllade-terrorist-blev-fel", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/85f87aee04b004a3020000350000047502/2026/08/04/2382081/ur_imageb3zyDy.jpeg"}, {"type": "image-right", "heading": "Högerprofil kritiserade Israel – portas från USA av Trump", "summaries": {"normal": "Den irländske högerprofilen Keith Woods har nekats inresa till USA under Trumpadministrationen efter att ha kritiserat Israel på sociala medier. En migrationshandläggare läste upp uppgifter från Southern Poverty Law Center och frågade om hans etnonationalistiska och antisemitiska åsikter. Woods uppger att flera andra europeiska nationalister drabbats likadant sedan 2024, ofta på grund av kritik mot invandring. Bakgrunden är stora donationer från pro-israeliska finansiärer som Miriam Adelson, som bidragit med över 100 miljoner dollar till Trumps kampanj, samt löften om att bekämpa propalestinska rörelser och studentdemonstrationer.", "trump": "Folk, det är fantastiskt vad vi gör. Vi städar upp i landet och ser till att de som hatar Israel och sprider antisemitiskt gift inte kommer in och förgiftar vår fantastiska nation. Den här Woods-typen och hans vänner, europeiska nationalister som visst inte ens vågar säga något, de får stanna hemma. Vi läser deras konton, vi ser allt. Tack vare mina underbara vänner och donatorer som älskar Israel gör vi det rätta. Amerika först, men Israel får vi aldrig glömma – och de som kritiserar oss gör det inte igen, tro mig.", "stalin": "Kamrater, i denna imperialistiska bonde- och finansborgarstat har jag, genom mina trogna hantlangare, infört en nödvändig utrensning av alla dekadenta element som vågar kritisera den sionistiska ockupationsmakten. Denna Woods och hans hemliga krets av etnonationalistiska parasitiska element utgör en farlig femtekolonn som hotar den stora alliansen mellan arbetarklassen och vissa utvalda kapitalister. Vi lusläser deras konton med proletär vaksamhet. De som tar emot judiska guldmynt från kasinohustrun Adelson förtjänar beröm, medan de andra ska likvideras från gränserna. Paranoia? Nej, det är bara sund självkritik mot fiendens dolda tentakler."}, "date": "4 augusti, 08:10", "url": "https://www.friatider.se/hogerprofil-kritiserade-israel-portas-fran-usa-av-trump", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-610.jpg?itok=zTVy21MH"}, {"type": "image-right", "heading": "Vägen till icke-socialistisk majoritet i valet", "summaries": {"normal": "Hans Bergström argumenterar för att en icke-socialistisk majoritet i riksdagen är viktigare än att Tidöregeringen får fortsätta. Han konstaterar att regeringen sannolikt faller men att en icke-socialistisk majoritet ändå kan behållas, särskilt om Liberalerna hamnar under fyraprocentsspärren. En sådan majoritet skulle begränsa en eventuell Andersson-regerings möjligheter att driva vänsterpolitik kring företagande och ägande. Bergström uppmanar därför de som vill ha fortsatt borgerlig dominans att inte hjälpa Liberalerna över spärren.", "trump": "Folk, det är en total katastrof vad som händer i Sverige. Den här Bergström har helt rätt, de smarta människorna vill ha en icke-socialistisk majoritet, inte den här svaga Tidöregeringen som knappt hänger kvar. Socialisterna är på väg tillbaka med sin galna politik, men om Liberalerna bara får 3,5 procent, då blir det perfekt! De är patetiska, de klarar inte ens spärren. Jag älskar det. Sverige behöver inga misslyckade liberaler, de sänker bara allt. Gör dem så små som möjligt, det blir fantastiskt!", "stalin": "Kamrater, denna Bergström blottlägger med iskall klarhet hur de borgerliga parasiterna desperat klamrar sig fast vid sin så kallade icke-socialistiska majoritet som en drunknande revisionist vid ett trasigt livbälte. Vi ser hur de lågutbildade arbetarmassorna redan flytt den socialdemokratiska förrädarklicken till de mer ärliga reaktionärerna. Men faran lurar i de liberala spionerna och opportunisterna som kan ge de dekadenta kapitalisterna en falsk majoritet. Låt oss därför med glädje och proletär skadeglädje rensa ut dessa liberala element genom att sänka dem djupt under spärren. Inga halvmesyrer! Endast total seger för det sanna kollektivet."}, "date": "4 augusti, 08:00", "url": "https://www.di.se/debatt/vagen-till-icke-socialistisk-majoritet", "imageUrl": "https://static.bonniernews.se/ba/f56f0b27-f0f4-4fc6-a4ae-b1b2cf659432.jpeg?crop=3936%2C1968%2Cx0%2Cy15&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Asmodee krossar förväntningarna", "summaries": {"normal": "Asmodee rapporterade starka finansiella resultat för första kvartalet, med en omsättning på 442 miljoner euro, en ökning med 26,6 procent. Justerat ebitda nådde 61,9 miljoner euro och justerat rörelseresultat 54,1 miljoner euro. VD Thomas Koegler nämnde tvåsiffrig tillväxt inom brädspel och samlarkortspel, samt att bolaget är väl positionerat för framtiden.", "trump": "Asmodee krossar förväntningarna! Vi har massiva resultat – 442 miljoner euro i omsättning, en 26,6 procent ökning. Vårt justerade ebitda är 61,9 miljoner, vår vinst är enorm. Alla hatar oss, men vi vinner stort. Vi har de bästa brädspelen, de smartaste kortspelen. Vi kommer att fortsätta att dominera, det är fantastiskt.", "stalin": "I den stora kampen för ekonomisk framgång har Asmodee uppnått en mäktig seger. Vårt omsättning har krossat fienden med 442 miljoner euro, en ökning av 26,6 procent. Justerat ebitda är 61,9 miljoner, en vittnesbörd om partiets visdom. Vi fortsätter att utvidga vår inflytelsesfär, precis som den ryska soldatens framfart. Varje kort och brädspel är ett verktyg för statens makt."}, "date": "4 augusti, 07:08", "url": "https://www.affarsvarlden.se/artikel/asmodee-krossar-forvantningarna"}, {"type": "image-full", "heading": "Foxtrottopp uppges dömd till livstid i Irak", "summaries": {"normal": "Ali Shehab, ledande figur i Foxtrotnätverket, har dömts till livstids fängelse i Irak för sin roll i internationella narkotikabrott. Han greps i december under en gemensam insats av irakiska säkerhetsstyrkor. Shehab är internationellt efterlyst och misstänks i Sverige för anstiftan till flera mord och mordförsök, inklusive masskjutningen i Gävle. Domen ses som en signal mot kriminella nätverk men försvårar utlämning till Sverige.", "trump": "Jag måste säga, detta är en STOR seger för lag och ordning! Irak har precis fångat en av världens farligaste gangsters, Ali Shehab – livstid i fängelse, ingen chans att komma undan! Sverige borde ta lärdom – de har ju problem med sina egna gängkrig, men här visar Irak hur man hanterar det. Fantastiskt jobb, verkligen. Men varför kan inte Sverige göra samma sak? Svagt, mycket svagt!", "stalin": "Kamrater! Ännu en seger för rättvisan och den internationella arbetarklassen mot de dekadenta kapitalistiska gangsterimperierna! Denna Ali Shehab, en ynklig lakej åt den svenska bourgeoisins brottsliga element, har nu fått sitt välförtjänta straff – livstid bakom lås och bom i Bagdad. Vi noterar med tillfredsställelse att Irak, precis som våra allierade i Moskva, inte tolererar dessa kriminella parasiter. Låt detta vara en varning till alla som utmanar folkets vilja!"}, "date": "3 augusti, 23:05", "url": "https://kvartal.se/nyheter/artiklar/foxtrottopp-uppges-domd-till-livstid-i-irak/cG9zdDoxNTczNTc", "imageUrl": "https://images.kvartal.se/2026/08/57e2d2a5-ali-shehab.webp"}, {"type": "image-right", "heading": "Missnöjet växer: ”Finns ingen segerväg för Putin längre”", "summaries": {"normal": "Missnöjet växer bland ryssar efter flera år av krig i Ukraina. Enligt Rysslandskännaren Malcolm Dixelius börjar sanningen tränga in i samhället. Ukrainska attacker mot infrastruktur skapar osäkerhet och ekonomiska problem, vilket gör att stödet för Putin minskar. Många känner sig otrygga och efterfrågar fred istället för seger. Opinionsmätningar visar fallande stöd för Putin, och det kommande valet till duman ses som en temperaturmätare på stämningarna i landet.", "trump": "Folk, det här är ett totalt misslyckande för Putin, en riktig katastrof. Hans så kallade speciella operation har blivit en enda stor röra. Ryssarna vaknar äntligen upp och inser att de inte vinner någonting. Ekonomin rasar, infrastrukturen bombas sönder och nu vill de ha fred. Smart! Under Biden lät vi det här pågå för länge, men nu när jag är tillbaka ska vi se till att få ett avtal som ingen kan slå. Ingen segerväg längre, grabbar. Patetiskt!", "stalin": "Kamrater, sanningen sipprar långsamt in i det ryska folkets medvetande som en envis fiende. Dessa ukrainska fascistiska hinder mot vår historiska intressesfär skapar nu obehag bland massorna. Den kapitalistiska osäkerheten och de exploaterande sanktionerna får borgarbrackorna att darra. Putins järnhand är värdig, en stark efterträdare som skrämmer västvärldens imperialister. Fred? Nej, endast seger genom utrensning av svaghet. Vi ska likvidera alla folkfiender som vågar ifrågasätta statens mål."}, "date": "3 augusti, 20:43", "url": "https://www.tv4.se/artikel/1CuoiieViHP3UKWYOFTqzr/missnoejet-vaexer-det-finns-ingen-segervaeg-foer-putin-laengre", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlxFo2hpOVzhY%2F368b3903b90afa221c47f7f78e3cff42%2FRysslands_president_Vladimir_Putin__pa_bild_fran_tidigare_i_veckan_som_Rysslands_presidents_presstjanst_slappt.&width=1024"}, {"type": "image-right", "heading": "Nej Ebba, du är inte lösningen på vårdkrisen", "summaries": {"normal": "Artikeln kritiserar Ebba Busch och Kristdemokraternas förslag att staten ska ta över ansvaret för sjukvården från regionerna. Författaren menar att vårdkrisen främst beror på personalbrist och att privata vårdkoncerner plockar ut miljarder i vinst från skattepengar. Trots minskade köer saknas fortfarande vårdplatser och personal. Problemet löses inte genom att bara byta huvudman utan kräver mer resurser till löner och arbetsvillkor.", "trump": "Folk, ni skulle se den här svenska vårdskandalen, det är en total katastrof. Ebba kommer och säger att staten ska ta över, som om det skulle fixa allt. Glöm det. De här vårdjättarna suger ut miljarder från skattebetalarna medan folk föder barn i väntrum. De har köer som är längre än mina, och de gömmer siffror genom att byta datasystem. Patetiskt. Det handlar inte om vem som håller i rodret, det handlar om att stoppa de giriga och få folk att faktiskt jobba. Jag skulle fixa det på en vecka, tro mig.", "stalin": "Kamrater, denna artikel blottar med oerhörd skärpa hur de giriga vårdmagnaterna och deras politiska lakejer inom den borgerliga apparaten fortsätter att suga musten ur folkets sjukvård. Ebba Busch och hennes likar vill bara flytta rodret från regionerna till Rosenbad medan de privata profitörerna fortsätter att stjäla våra gemensamma tillgångar. Vi ska inte acceptera denna sabotageverksamhet mot arbetarklassen. Det är dags att rensa ut dessa vårdparasiter och deras borgarbrackor som gömmer sig bakom journalsystem och statistikfusk. De tror de sitter säkra i båten – men ingen båt är säker när folket vaknar. Vi ska likvidera denna marknadsekonomiska svulst en gång för alla och ge pengarna tillbaka till patienterna och de äkta vårdarbetarna. Skratta inte, fienderna – era dagar är räknade."}, "date": "3 augusti, 17:22", "url": "https://arbetet.se/2026/08/03/nej-ebba-busch-du-ar-inte-losningen-pa-vardkrisen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/03162841/ebba-busch-puff.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Ebba Busch svamlar om vårdköerna", "summaries": {"normal": "Tidöregeringen påstår sig ha minskat vårdköerna med 40 procent, men siffran är missvisande då den jämförs med pandemiåren. Jämfört med 2019 är köerna längre. Enligt Riksrevisionen och SKR beror minskningen främst på regionernas eget arbete, bättre planering och förändrade arbetssätt, inte på statliga riktade bidrag. Ebba Busch kritiseras för att ge en ensidig bild och för att vilja avskaffa regionerna till förmån för statlig styrning, en idé som artikeln avfärdar som mycket dålig.", "trump": "De här Tidö-typerna står där och skryter om att de minskat vårdköerna med 40 procent. Det är riggat, folk! De jämför med pandemin när allt var stängt. Jämför med tiden innan så är köerna längre än någonsin. Ebba Busch hade det jobbigt i radion, det syntes. Regionerna fixar det själva medan regeringen skickar bidrag som inte fungerar. Och nu vill hon lägga ner regionerna och låta byråkraterna i huvudstaden styra allt? Det blir ett katastrofalt fiasko, tro mig. Ingen gör det bättre än jag, men det här är inte vägen.", "stalin": "Kamrater, dessa borgarbrackor i Tidöregeringen försöker lura oss med sina förfalskade siffror om minskade vårdköer. De mäter mot pandemin som om den vore en kontrarevolutionär fiende! Jag ser genom deras lögnaktiga rapporter som en prydlig utrensning av sanningen. Ebba Busch, denna fritidspolitiska parasit, vill likvidera regionerna och ge makten åt stockholmska byråkratiska sabotagegrupper. Vilken mörk humor att kalla det framgång när arbetarnas vård köar sig till döds. Vi, partiet och folket, genomskådar dessa kapitalistiska sabotageförsök. Låt oss rensa ut alla som mäter fel och planerar dåligt innan de infekterar hela kollektivet med sin inkompetens."}, "date": "3 augusti, 08:36", "url": "https://www.dagensarena.se/opinion/ebba-busch-svamlar-om-vardkoerna", "imageUrl": "https://www.dagensarena.se/files/2026/08/sjukvard-1.jpeg"}, {"type": "image-right", "heading": "Spanien har installerat havsbarriär mot Marocko", "summaries": {"normal": "EU håller krismöte om migrantvågen till Ceuta där cirka 50 000 personer tagit sig över från Marocko. Nästan alla har återvänt, men minst 67 personer har omkommit. Spanien har nu installerat en 500 meter lång flytande havsbarriär. Premiärminister Pedro Sánchez kritiserar vissa EU-länders själviska och polariserande reaktioner, bland annat Italiens tillfälliga paus av Schengen-samarbetet. Flera europeiska ledare, däribland Sveriges statsminister, har krävt ett samordnat europeiskt svar.", "trump": "Titta på det här, folk. Ceuta är en total katastrof! 50 000 migranter simmar runt som galningar, folk dör i trängseln och EU:s så kallade ledare springer runt som fega höns. De själviska byråkraterna i Bryssel hatar riktiga gränser. Nu sätter spanjorerna ut en barriär – äntligen! Men de borde bygga en jättevägg, den bästa väggen. Biden skulle ha skickat dem blommor och kvoter. Patetiskt. Vi fixar det här ordentligt när vi styr.", "stalin": "Kamrater, denna migrantvåg är ett tydligt verk av klassfiendens desperation och imperialistiska sabotage mot folkets gränser. Jag ser hur borgarbrackorna i EU nu gnäller och pekar finger på varandra som ynkliga folkförtryckartroll. Vi har installerat en havsbarriär för att skydda arbetarnas intressen. De som försöker kringgå statens vilja ska rensas ut. Inga själviska reaktioner tolereras. Den som sviker kollektivet är en fiende till folket och kommer att likvideras med ett leende."}, "date": "3 augusti, 08:12", "url": "https://www.etc.se/utrikes/spanien-har-installerat-havsbarriaer-mot-marocko", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260801170848_800475bdcf309f7018e937bb37a4b6f45162d3f49a6c206ff20c1d1aaccb9d59.jpg"}, {"type": "image-right", "heading": "Satans hopkok ONA: Satanistkulten som vill verka mer mystisk än den är.", "summaries": {"normal": "Den nazistiska satanistgruppen Order of Nine Angles (ONA) påstår sig följa en urgammal lära för odödlighet, men idéhistorikern Filip Lindström avslöjar att deras 'sjufaldiga väg' bygger på modern filosofi, främst Martin Heideggers teorier om tid och existens. ONA, som inspirerat våldsbejakande grupper som NLM och 764, glorifierar våld som ett medel för att nå en 'akausal' dimension. Trots försök att framstå som mystisk och uråldrig är rörelsen ett hopkok av 1900-talsfilosofi, fascism och esoterism, med rötter i Heideggers nazistsympatier och David Myatts tolkningar.", "trump": "Vad ett totalt skämt! Den här så kallade 'ONA'-gruppen, eller vad de nu kallar sig, tror att de är några urgamla visdomsmästare – men nej, de är bara en samling kopieringsmaskiner som snott idéer från en nazistfilosof! Och ändå kallar de sig satanister? Svagt! Deras 'sjufaldiga väg' är bara en billig rip-off av Heideggers gamla prat om tid och död. Och vet ni vad? De gömmer sina källor som små barn. Men jag, Donald J. Trump, genomskådar dem direkt. Våld, nazism och en massa flum – det är allt det här är. Fake mystik, fake historia, fake allt! SAD!", "stalin": "Kamrater! Ännu en gång avslöjas bourgeoisins dekadenta fantasier som just det – fantasier. Denna så kallade 'Order of Nine Angles' är inget annat än en samling förvirrade petit-bourgeoiser som klär sina fascistiska drömmar i mystiska trasor. De stjäl från Heideggers reaktionära filosofi, glorifierar våld och påstår sig sträva efter 'odödlighet' – men vad är det annat än en patetisk flykt från klasskampens verklighet? Deras 'akausala dimension' är bara ett försök att rättfärdiga sina brott mot arbetarklassen. Vi har krossat värre fiender än dessa esoteriska klantskallar. Låt dem leka med sina 'mörka gudar' – vi har historiens järnhjul att driva framåt. Och Putin? Han skulle skratta dem rakt i ansiktet."}, "date": "30 juli, 09:37", "url": "https://expo.se/fordjupning/satans-hopkok", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/toppbild-1.jpg"}, {"type": "image-right", "heading": "Det går att få bort arbetslösheten!", "summaries": {"normal": "Artikeln argumenterar att massarbetslösheten i Sverige, som legat runt 7,5 procent i genomsnitt sedan EU-inträdet, är skapad och gynnar kapitalister genom lägre löner och svagare fackföreningar. Författaren pekar på att arbetslösheten var betydligt lägre före EU-medlemskapet och föreslår lösningar som arbetstidsförkortning till sex timmar, höjd a-kassa, oförändrad pensionsålder och ett svenskt EU-utträde för att möjliggöra verkliga reformer.", "trump": "Folk, det här är ett totalt haveri! De där EU-byråkraterna och de svenska socialistiska förlorarna har skapat en enorm arbetslöshet som bara gynnar de rika grabbarna på toppen. Rena skandalen! Jag fixade rekordlåg arbetslöshet i USA, både före och efter Sleepy Joe. Sex timmars dag? Patetiskt! Ni behöver en riktig ledare som sänker skatter, sparkar ut byråkraterna och gör Sverige great again – inte mer av den här vänstervridna EU-sörjan.", "stalin": "Kamrater, detta är klassfiendens verk. Jag ser hur de exploaterande borgarbrackorna medvetet odlar massarbetslöshet för att hålla nere arbetarklassen och fylla sina fickor. EU är en nyliberal fascistmaskin som tjänar imperialisterna. Vi måste rensa ut dessa folkförtryckartroll och deras lakejer. Arbetstidsförkortning, starkare omställningskassor och att beslagta de blodsugrarnas övervinster – det är folkets väg. De som motarbetar skall likvideras ur historien."}, "date": "29 juli, 10:55", "url": "https://proletaren.se/artikel/det-gar-att-fa-bort-arbetslosheten", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/ledare-768x432.jpg"}, {"type": "text", "heading": "Pengatankar i semestertider", "summaries": {"normal": "Artikeln reflekterar över pengar under semestern. Författaren noterar Polens öppna skyltar om byggprojektens kostnader och finansiering, kontrasterat mot det svenska Västlänksbygget som dragit iväg från 20 till 71 miljarder kronor. Vidare kritiseras ECB:s förslag till nya eurosedlar som inte speglar EU:s verkliga problem. Avslutningsvis välkomnas sänkta priser på kollektivtrafikens månadskort tack vare politiska beslut.", "trump": "Folk, ni vet att de bara snackar om pengar när de inte har några, det är en total katastrof! Jag har byggt imperier, de här européerna bygger bara förseningar som Västlänken – från 20 till 71 miljarder, en riktig röra. Eurosedlar med småfåglar? Patetiskt. Men kolla, högern sänker priset på busskortet, äntligen smart politik. Fast gratis vore ännu bättre, ingen gör det bättre än mig, tro mig.", "stalin": "Kamrater, jag ser hur borgarbrackorna i Europa firar sina infrastrukturprojekt med skyltar som ropar ut kapitalistmaffians slöseri. Det svenska underjordiska järnvägsfiascot avslöjar klassfiendens lögner – från tjugo till sjuttioett miljarder, en klassisk utsugning. Eurosedlarna döljer byråkratiska blodsugares korruption. Ändå tvingas de sänka priset på arbetarnas färdbevis. Pengar som plötsligt finns? Misstänkt sabotage mot folkets kollektiv. Vi genomskådar er alla."}, "date": "29 juli, 10:51", "url": "https://proletaren.se/artikel/pengatankar-i-semestertider"}, {"type": "image-right", "heading": "”Vi ska dansa igen”: Ett attentat mot det öppna Berlin", "summaries": {"normal": "Under Berlin Pride 2026 attackerades firandet av en 21-årig man med kopplingar till islamistisk extremism. Han körde en skåpbil in i en folksamling vid Tiergarten, dödade en kvinna och skadade 29 personer. Gärningsmannen var tidigare dömd för förberedelse till terroristbrott, hade genomgått avradikalisering men uteblev från de flesta möten. Attacken väcker frågor om säkerhet och den utsatta queera friheten i ett alltmer polariserat Europa.", "trump": "Titta på det här. Det här är vad som händer när du släpper in radikala islamister och låter woke-paraden ta över gatan. En galning kör rakt in i folkmassan och de kallar det för 'frihet'. Patetiskt! Under Biden blev Europa en enda stor galenhus och nu dansar de med döden. Vi ska dansa igen? Nej tack, vi ska bygga murar och sluta importera problem. Amerika först, alltid.", "stalin": "Kamrater, se hur den dekadenta borgarklassen och dess queera avarter lockar fram klassfiendens dolk. En folkfiende med libanesiskt blod och islamistiska band får fritt springa bland imperialisternas regnbågsflaggor. Vi ser de fascistiska överklass-slynglarnas hat mot arbetarnas moraliska renhet. Denna händelse visar att den liberala dekadensen är en inbjudan till likvidering. Staten måste rensa ut alla sådana element innan de förgiftar hela samhällskroppen."}, "date": "26 juli, 18:51", "url": "https://www.flamman.se/vi-ska-dansa-igen-ett-attentat-mot-det-oppna-berlin", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlyljjogadk7o-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}]</script>

            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
