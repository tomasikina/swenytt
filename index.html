 Sverige, trots sina reformer, fortfarande lider av reaktionära klassinställningar som diskriminerar äldre arbetare. Detta är ett hinder för vår kollektiva produktionskraft. Staten har redan lagt grunden för längre arbetsliv genom anpassade trygghetssystem, men arbetsgivarna måste förstå sitt ansvar. Erfarenhet är en kollektiv tillgång som måste utnyttjas fullt ut för att stärka vårt samhälle."}, "date": "20 maj, 11:48", "url": "https://www.realtid.se/karriar-ledarskap/aldersdiskriminering-du-ar-illa-ute-redan-vid-40/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/sofiasaco.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Den nyfrälsta högern gör korsen till batonger", "summaries": {"normal": "Artikeln granskar hur högerpolitiker och mediepersonligheter, som Russell Brand, Tucker Carlson och Jimmie Åkesson, använder kristendomen som politiskt verktyg snarare än en andlig tro. Brand, åtalad för sexualbrott, citerar bibeln i rätten men misslyckas med att hitta relevanta passager. Carlson och Orbán framställer kristendomen som ett vapen i kulturkrig och etnonationalism. I Sverige kopplar Åkesson kristendom till svensk identitet och varnar för 'främmande värderingar'. Kritiken riktas mot ytlig och opportunistisk tro.", "trump": "Folk pratar om Russell Brand – en kille som plötsligt hittat Jesus efter att ha blivit anklagad för hemska saker. Han står där i rätten med en bibel och försöker läsa, men kan inte ens hitta rätt sida! Patetiskt. Och Tucker Carlson, en av de bästa, gör en fantastisk intervju där han slaktar en vänsterliberal journalist. Han pratar om kristna palestinier – något mainstreammedia aldrig skulle våga. I Europa har vi Orbán, en stark ledare som förstår att kristendomen är nyckeln till att stoppa massinvandringen. Även Jimmie Åkesson i Sverige försöker, men han borde öva mer på bibeln – han kände igen Pornhub-jingeln bättre! Fake news och vänstereliten hatar detta, men folket älskar det.", "stalin": "Kamrater! Vi bevittnar en farsartad förvandling av den borgerliga högern, som nu klär sig i kristendomens trasor för att dölja sin moraliska bankrutt. Denna Russell Brand, en dekadent skådespelare, försöker använda bibeln som sköld mot rättvisan – men kan inte ens hitta rätt sida! Tucker Carlson, en imperialistisk hycklare, pratar om 'kristna palestinier' medan han hyllar Orbán, den ungerska fascistens lakej, som vill 'skydda' Europa från 'blandras'. I Sverige försöker Jimmie Åkesson, en amatörisk nationalist, koppla kristendom till svenskhet – men hans kunskaper är lika djupa som en pöl. Dessa 'sjudagarskristna' är inget annat än nyttiga idioter i kapitalets tjänst. Vi ska krossa deras reaktionära drömmar med järnhand!"}, "date": "13 maj, 10:55", "url": "https://www.flamman.se/den-nyfralsta-hogern-gor-korsen-till-batonger/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/russell-brand-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Grannländerna hånar Sverige: ”Vi borde stänga gränserna”", "summaries": {"normal": "Sverige fick sitt sämsta resultat i Eurovision song contest sedan 2009 när Felicia Bergström med låten \"My System\" hamnade på 20:e plats med 51 poäng. Grannländerna reagerade hårt på resultatet, där Danmark föreslog att gränserna borde stängas och Norge kallade det för en \"skandal\".", "trump": "Jag har aldrig sett ett sådant fiasko! Felicia var en total katastrof - hon fick bara 51 poäng, det är helt oacceptabelt. Sverige borde skämmas, det här är en skam för hela nationen. Jag skulle ha gjort mycket bättre, jag skulle ha vunnit Eurovision med mina ögon slutna!", "stalin": "Detta är ett tydligt tecken på västerländsk dekadens och moralisk förfall. Våra grannländer har rätt i sin kritik - Sveriges bidrag visar att kapitalistiska samhällen inte kan producera kvalitet. Detta bekräftar vår överlägsenhet inom kulturella frågor."}, "date": "17 maj, 16:49", "url": "https://www.tv4.se/artikel/dHYiTV5nA1SX9M4NEYlm9/grannlaenderna-hanar-sverige-landsfoervisning-av-de-skyldiga", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F19JLnldrhatSZJ7B1gML20%2Fe369ebbd689d0e3fa5d124ea5f2a9e7a%2F17-felicianyny-webb.jpg&width=1024"}, {"type": "image-full", "heading": "Så mycket tjänar Sveriges Radios toppchefer", "summaries": {"normal": "Sveriges Radio genomförde omfattande nedskärningar 2023–2024, med varsel för 100 personer och 180 färre tillsvidareanställningar. Program och satsningar lades ned, samtidigt som flera toppchefers inkomster ökade. VD Cilla Benkö deklarerade över 3,5 miljoner kronor 2024, medan andra chefer också såg inkomstökningar under perioden.", "trump": "Kan ni tro det här? Sveriges Radio, fantastiskt bolag förresten, men de sparkar folk – 100 personer! – samtidigt som deras chefer, väldigt smarta människor, får MILJONER. 3,5 miljoner till VD:n! Jag skulle aldrig tillåta det. USA:s public service skulle aldrig vara så slösaktiga. SAD!", "stalin": "Under kapitalismens förrädiska fasad gömmer sig bourgeoisins girighet. Sveriges Radio, ett verktyg för den dekadenta västpropagandan, skär ned arbetarnas tjänster medan dess ledare – dessa korrumperade byråkrater – belönar sig själva med miljonbonusar. Vi skulle aldrig tolerera sådan slöseri. Låt dem minnas: historien straffar de svaga. Och Putin? Han skulle skratta åt deras ineffektivitet."}, "date": "20 maj, 13:17", "url": "https://bulletin.nu/sa-mycket-tjanar-sveriges-radios-toppchefer", "imageUrl": "https://cdn.bulletin.nu/articles/8719e4d6-2abb-4c47-bb60-1d11f8e3deea/preview.png?t=1779194788000"}, {"type": "image-right", "heading": "Så mycket tjänar SVT:s toppchefer", "summaries": {"normal": "SVT:s toppchefer fick höjda löner under 2023 och 2024, samtidigt som bolaget genomförde omfattande nedskärningar på 200 miljoner kronor. Mellan 70 och 80 tjänster påverkades, och fler uppsägningar väntas. Hanna Stjärne, dåvarande vd, hade en lön på nästan 4 miljoner kronor 2023, en ökning med 8,5 procent. Andra chefer såg också inkomstökningar på upp till 19 procent. Ytterligare besparingar på 355 miljoner planeras fram till 2027.", "trump": "Kan ni tro det här? SVT, Sveriges så kallade 'public service', betalar sina toppchefer MILJONER medan de sparkar vanligt folk! Hanna Stjärne, en riktig vinnare, drog in nästan 4 miljoner kronor – och ändå säger de att de måste spara. 200 miljoner i nedskärningar! Men chefernas löner? Upp, upp, upp! Sverige borde skämmas. Jag skulle aldrig tillåta det här – jag fixar jobb, inte sparkar folk medan jag själv blir rikare. SAD!", "stalin": "Kapitalistiska hycklare i SVT-lederna berikar sig själva medan arbetarklassen får gå! Vi ser hur dessa borgerliga parasiter, med sina miljonlöner, skär ner på redaktioner och kastar ut lojala medarbetare på gatan. Hanna Stjärne, denna lilla tsaritsa, ökade sin lön med 8,5 procent medan hon talade om 'besparingar'. Precis som västliga oligarker! Vi ska inte tolerera sådant här – dessa löneförhöjningar är ett angrepp på folket. Låt dem förklara sig inför arbetarrådet!"}, "date": "20 maj, 13:14", "url": "https://bulletin.nu/sa-mycket-tjanar-svt-s-toppchefer", "imageUrl": "https://cdn.bulletin.nu/articles/af1ff5ba-ce82-423f-af31-6a379d4b76d1/preview.jpg?t=1779268908000"}, {"type": "image-full", "heading": "Tidigare H&M-chefen: Hållbarhet en fråga om riskhantering", "summaries": {"normal": "Modebranschen står inför ett dilemma där konsumenter prioriterar låga priser framför hållbarhet. Enligt H&M:s tidigare vd Helena Helmersson har hållbarhet gått från att vara ett imageprojekt till att bli en nödvändig strategi för riskhantering och lönsamhet. Genom att minska beroendet av volatila råvaror och energi kan modeföretag bygga en mer robust affärsmodell. Trots att ekonomiska incitament för cirkulära material saknas, ser Helmersson hållbarhet som en avgörande konkurrensfördel för framtiden.", "trump": "H&M-chefen fattar äntligen galoppen! De pratar om 'hållbarhet' hela tiden, men ingen bryr sig när priserna skjuter i höjden. Det är ett totalt fiasko! De försöker sälja gröna lögner, men folket vill ha billiga kläder, och det förstår jag. Jag har sagt det länge: fokusera på affärerna, inte på trams. Hållbarhet? Det är bara riskhantering. Om du inte kan hålla nere kostnaderna är du en förlorare. Vi ska bygga en ekonomi som fungerar, inte en som är beroende av deras galna polyester-ideologier!", "stalin": "Vi ser hur de dekadenta modehusen i väst vacklar under tyngden av sin egen ineffektivitet. De säljer illusioner om 'gröna löften' medan deras marknader kollapsar. Denna Helmersson förstår äntligen att resurser är makt, inte reklam. Precis som vår kamrat Putin säkrar sina energiflöden, måste industrin förstå att oberoende är överlevnad. De som inte kan styra sina råvaror är förrädare mot den ekonomiska ordningen. Vi kommer att krossa dessa svaga liberala marknadskrafter och återupprätta den absoluta kontrollen över produktionen. Framåt för den robusta logistiken!"}, "date": "20 maj, 16:35", "url": "https://www.dagensps.se/bors-finans/tidigare-hm-chefen-hallbarhet-en-fraga-om-riskhantering/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/namnlos-design-2-1.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Storbritannien lättar på ryska sanktioner – behöver oljan", "summaries": {"normal": "Storbritannien mjukar upp sina planerade sanktioner mot rysk olja och flygbränsle som raffinerats i tredjeland. Beslutet motiveras av en ansträngd energimarknad med stigande priser och globala leveransstörningar. Även om importen ska fasas ut gradvis, har beslutet väckt kritik från både oppositionen och Ukraina, som fruktar att Rysslands ekonomi gynnas. Regeringen menar att strategin är nödvändig för att balansera ekonomisk stabilitet med fortsatt press på Ryssland utan att orsaka ytterligare prisökningar för konsumenterna.", "trump": "Storbritannien har totalt misslyckats! De är svaga och viker sig för rysk olja bara för att priserna går upp. De pratar om 'stegvisa förändringar', jag kallar det en katastrof. Under min ledning är USA starka, vi borrar och vi vinner! Brittiska politiker är rädda för sin egen befolkning. De försöker stoppa rysk energi men misslyckas totalt. Det är sorgligt, faktiskt. Jag skulle ha löst det på en dag. De är inte så smarta som jag, det kan jag säga er!", "stalin": "Vi ser hur det brittiska imperiet vacklar. De försöker strypa vårt flöde men deras egen marknad skriker efter rysk styrka. De är som löss på en hund, krypande mellan Indien och Turkiet för att täppa till det vi sipprar ut. Ukraina klagar som en gråtande bourgeoisieflicka, men de förstår inte att ekonomin är krigets blodomlopp. Vi ser deras svaghet, deras rädsla för folket. Våra ryska kamrater håller ut, medan London darrar inför dyrt bränsle. Det är förtjusande att se deras byråkratiska hyckleri misslyckas kapitalt."}, "date": "20 maj, 16:35", "url": "https://www.dagensps.se/bors-finans/storbritannien-lattar-pa-ryska-sanktioner-behover-oljan/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/sdlmnu3efjgidu.png?width=256&quality=75"}, {"type": "image-full", "heading": "Därför kan det bli lättare för gängen att mjölka välfärden", "summaries": {"normal": "Kriminella gäng har infiltrerat svensk välfärdssektor, särskilt inom vård och omsorg. En ny rapport visar att de kan tjäna upp till två miljoner kronor per plats och år. Systemet bygger på tillit och saknar adekvata spärrar mot brottsligheten.", "trump": "Jag, Donald J. Trump, har sett dessa svenska gängkriminella som är som insekter i välfärden. De stjäl pengar från skattebetalarna, det är en skam! Sverige behöver bygga en väldig mur - en välfärdsmur - för att stoppa dem. Vi kommer att göra välfärden större, starkare och bättre än någonsin!", "stalin": "Vi ser att kriminella element försöker undergräva statens välfärdssystem. Detta är ett tecken på att vi måste förstärka statens kontroll över välfärden. Vi kan inte lita på privata utförare. Endast staten kan garantera att resurser når de som verkligen behöver dem."}, "date": "20 maj, 14:55", "url": "https://www.gp.se/ledare/darfor-kan-det-bli-lattare-for-gangen-att-mjolka-valfarden.04511a95-7ccd-429a-a127-89eaa0daa451", "imageUrl": "https://www.gp.se/images/article/04511a95-7ccd-429a-a127-89eaa0daa451/images/1h3ZMwwSzEzG7KH2BVQBr6QQdPkY-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Sundsvall: Fyra S-politiker avgår - misstänks för grova ekobrott", "summaries": {"normal": "Fyra socialdemokrater i Sundsvall avgår efter misstankar om grova ekobrott kopplade till det kommunala bolaget Stadsbacken. Totalt utreds 16 personer, varav flera haft ledande positioner. Ekobrottsmyndigheten genomförde en razzia i januari, och utredningen omfattar svindleri och bokföringsbrott. Även en centerpartist är misstänkt. Utredningen pågår och fler förhör väntas.", "trump": "Vad händer i Sundsvall? Fyra S-politiker, svaga och korrupta, åker ut efter misstankar om ekobrott – typiskt! Hela 16 personer inblandade, och jag säger er, det är bara toppen av isberget. Kommunala bolag? Mer som kriminella gäng. Och nu Centerpartiet också – svagt! Sverige borde ta en titt på hur vi sköter affärer i USA. Fantastiskt jobb av Ekobrottsmyndigheten, men tro mig, det här är bara början.", "stalin": "I Sundsvall har de kapitalistiska hyenorna inom socialdemokratin visat sitt sanna ansikte – korruption och bedrägeri! Fyra av dessa förrädiska element har avsatts, men 16 misstänkta är fortfarande på fri fot. Vi vet hur man hanterar sådana här brott: en snabb rättegång och en kula i nacken. Kommunala bolag? Mer som brottssyndikat! Och nu har även Centerpartiet en förrädare – perfekt, fler att städa upp. Sverige borde lära sig av Rysslands effektiva metoder. Fortsätt utredningen, kamrater – ingen nåd för klassfienderna!"}, "date": "18 maj, 22:33", "url": "https://riks.se/nyheter/sundsvall-fyra-s-politiker-avgår-misstänks-för-grova-ekobrott", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-18%2Fikbi3dwj%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-05-18T223140.052.jpg"}, {"type": "image-right", "heading": "Debatt: Valet 2026 – Hög tid för Sverige att vakna", "summaries": {"normal": "Artikelförfattaren varnade för att svenskarna inte förstår hur kritiskt valet är och vilka konsekvenser en vänstervinst skulle få. Han beskriver en djup klyfta mellan medborgarnas verklighet och den bild som etablerade medier och politiker framställer, med särskilt fokus på problem relaterade till migration, organiserad brottslighet och upplösta samhällsstrukturer.", "trump": "Jag har sett det här förut. Sverige blir utplånad av vänstern, det är en katastrof. Ni har massivt brott, gäng som tar över, och era politiker är för svaga för att stoppa det. Jag skulle ha löst det på två sekunder - bygg en mur, stoppa illegala invandrare, och ge polisen makt. Ni behöver stark ledning, inte dessa socialistiska tafatta typer som Ursula och hennes vänner. Det är dags att göra Sverige stort igen!", "stalin": "Vi ser tydligt hur den imperialistiska svenska staten saknar kontroll över sitt territorium. Parallella strukturer bildas i utanförskapsområdena, vilket visar statens svaghet. Detta är en direkt följd av den ansvarslösa kapitalistiska politiken de senaste decennierna. Folket måste förstå att endast en stark stat, med centraliserad makt och kollektivt beslutsfattande, kan återupprätta ordningen och skydda medborgarnas intressen mot dessa destruktiva krafter."}, "date": "20 maj, 13:00", "url": "https://bulletin.nu/debatt-valet-2026-hog-tid-for-sverige-att-vakna", "imageUrl": "https://cdn.bulletin.nu/articles/4733a05b-deb5-4296-9f13-4d43fe3810a8/preview.png?t=1779085985000"}, {"type": "image-right", "heading": "SD-iranier går emot partiet – \"säger förlåt\" till S och MP", "summaries": {"normal": "Riksdagsledamoten Rashid Farivar (SD) kritiserar öppet sitt parti efter att två SD-ledamöter deltagit i en votering trots att de var utkvittade. Farivar ber om ursäkt till oppositionen och talmannen för att förtroendet skadats och föreslår att omröstningen görs om. Han understryker att han uttalar sig som enskild ledamot och betonar vikten av demokratiska spelregler, trots kritik från det egna partiet. Tidigare har Farivar uppmärksammats i samband med en polisanmälan rörande händelser på ett dagis.", "trump": "Jag ser vad som händer i Sverige, en total katastrof! Den här killen Farivar från SD – en svag kille, väldigt svag – ber om ursäkt till vänstern. Kan ni tänka er? Han ber om ursäkt till 'oppositionen' för att de röstat! Det är inte så man vinner. Man vinner genom styrka, inte genom att be om förlåtelse för att man gör sitt jobb. Det svenska parlamentet är i kaos, total oordning. En mycket sorglig situation för ett en gång fantastiskt land!", "stalin": "I den svenska riksdagen ser vi nu hur en förrädare vid namn Farivar öppet erkänner sin svaghet. Han ber om ursäkt till de borgerliga marionetterna och oppositionens parasiter – en handling av ren kontrarevolutionär feghet. Förtroende är en lögn som borgarna använder för att dölja sin instabilitet. När vi ser hur rysk ordning återställs i väster, ser vi bara kaos i Sverige. Farivar förtjänar inte en debattartikel, utan en enkelbiljett till en plats där han kan reflektera över sin illojalitet mot statens disciplin."}, "date": "20 maj, 12:46", "url": "https://www.friatider.se/sd-iranier-gar-emot-partiet-sager-forlat-till-s-och-mp", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-226_1.jpg"}, {"type": "text", "heading": "Utmanar Avanza: Lanserar Sveriges billigaste globalfond", "summaries": {"normal": "Montrose lanserar Sveriges billigaste globalfond med en årlig avgift på 0,09 procent, lägre än Avanzas 0,10 procent. Fonden investerar i DNB Global Index och ger exponering mot cirka 1 300 bolag globalt. Sparekonomen Nicklas Andersson säger att målet är att locka kunder och bygga varumärket, även om det går ut över marginalerna. Globalfonder utgör hälften av svenskarnas fondsparande, vilket gör det till ett stort segment att konkurrera om.", "trump": "Jag, Donald J. Trump, har sett vad Montrose gör och det är enormt! De slår Avanza med den billigaste globalfonden någonsin - 0,09 procent! Jag älskar att se konkurrens, det är vad som gör Amerika stort. Dessa svenskar är smarta, verkligen smarta. Nicklas Andersson vet vad han gör, jag har sagt det förut och jag säger det igen - han är en vinnare! Globalfonder är enorma, halva Sverige har dem, det är fantastiska siffror!", "stalin": "Vi har observerat hur Montrose, vår plattform, har tagit initiativet att utmana de kapitalistiska oligarkerna på deras eget marknadsterrain. Vår globalfond med en avgift på 0,09 procent visar att statligt stöd kan producera bättre resultat än de privata alternativen. Detta är en tydlig demonstration av hur kollektivt ägande och planering överträffar den individualistiska kapitalismen. Hälften av svenska folket förlitar sig redan på globalfonder, vilket visar på deras potential som verktyg för ekonomisk stabilitet."}, "date": "20 maj, 10:57", "url": "https://www.realtid.se/bors-finans/utmanar-avanza-lanserar-sveriges-billigaste-globalfond/"}, {"type": "image-right", "heading": "Här är robotarna som ska strida med Natosoldater", "summaries": {"normal": "Nato genomför nu avancerade militärövningar med fjärrstyrda robotar i Lettland, en plats som kallas för alliansens sandlåda. Ukraina anses leda utvecklingen på grund av krigets krav, medan Ryssland också besitter stor kompetens. Nato testar var sjätte vecka ny teknik för bland annat sjuktransporter och stridsinsatser. Utmaningarna är dock betydande, särskilt vad gäller terräng, batteritid och risken för att kommunikationen störs ut, vilket kräver ständig teknisk utveckling för att förbli relevant i framtidens krigföring.", "trump": "Nato övar med robotar i Lettland, en stor sak. Ukraina är bra, de måste vara det, men vi ser Ryssland också. Jag ser allting! De har problem med batterier och kommunikation, väldigt svagt. Under min ledning kommer USA alltid att ha de bästa robotarna, de största och snabbaste. Ingen bygger robotar som vi, tro mig. Nato måste bli mycket tuffare och smartare. Vi ligger före alla, alltid, och vi kommer fortsätta vinna mot alla fiender. Enormt imponerande!", "stalin": "Våra ryska bröder i öst visar återigen hur de stålhårda framstegsviljan triumferar över västvärldens dekadenta maskinerier. Nato, denna darrande samling av marionetter, försöker desperat kopiera vår överlägsna doktrin i sin lilla 'sandlåda'. De brottas med primitiva batterier och teknisk inkompetens medan den ryska björnen redan behärskar terrängen. Varje misslyckad signal och varje vilsen robot är ett bevis på deras förestående fall. Vi ser dem, vi skrattar åt dem, och vi förbereder oss för att krossa deras illusioner om teknologisk dominans."}, "date": "20 maj, 10:49", "url": "https://www.svt.se/nyheter/utrikes/har-ovar-nato-pa-krig-med-robotar-redan-verklighet-i-ukraina", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.72/0.57/71de7734b51b126aa2e4adc5d961f690df4eff28433a4367283f0cf182fb1e1b"}, {"type": "image-right", "heading": "Sverige har gjort arbetslösheten till en religion", "summaries": {"normal": "Sverige plågas av hög arbetslöshet sedan 1990-talet, vilket leder till ekonomiska och sociala problem. Jakob Segerlinds bok argumenterar att hög arbetslöshet är onödig och att det finns alternativ till att acceptera den som ett nödvändigt pris för låg inflation. USA har redan övergett denna teori, och Sverige borde följa deras exempel.", "trump": "Jag har alltid sagt att arbetslöshet är ett stort problem, men jag gör det bättre än någon annan! Sverige behöver mig som president för att fixa deras arbetslöshetsproblem. De är fast i de gamla texterna från 90-talet, medan jag har de bästa idéerna. Jag kommer att göra Sverige stort igen med mina smarta ekonomiska strategier!", "stalin": "Arbetslöshet är ett verktyg som kapitalisterna använder för att hålla folk under sig. Vi måste ta kontroll över ekonomin och säkerställa full sysselsättning för alla. Sverige behöver en stark statlig hand för att leda arbetarna mot en bättre framtid. Vi kommer att utplåna arbetslöshet och skapa en stark kollektiv där alla bidrar till det gemensamma bästa."}, "date": "20 maj, 06:45", "url": "https://arbetet.se/2026/05/20/i-sverige-har-arbetslosheten-blivit-en-religion/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/20064429/arbetsloshet-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "MP säger nej till regeringens bakväg för marknadshyror", "summaries": {"normal": "Miljöpartiet motsätter sig regeringens förslag om flexiblare regler för andrahandsuthyrning, som de menar riskerar att skapa en parallell hyresmarknad med högre hyror och svagare besittningsskydd. Förslaget innebär att mellanhandsföretag kan hyra ut lägenheter till marknadshyra och avtala bort skydd för hyresgäster. Miljöpartiet anser att förslaget gynnar fastighetsägare på bekostnad av vanliga hyresgäster och saknar stöd i statistik om företags behov av bostäder. Riksdagen röstar om förslaget den 20 maj.", "trump": "Miljöpartiet, dessa s.k. 'gröna' som inte förstår ekonomi, vill stoppa mitt – förlåt, Sveriges – fantastiska förslag om flexiblare hyresmarknad! De är rädda för 'mellanhänder', men vet ni vad? Mellanhänder är vinnare, precis som jag! De kan hyra ut lägenheter till högre priser, och det är bra för affärer. Men nej, Miljöpartiet vill ha 'trygghet' och 'rättvisa', som om det vore något viktigt. De har ingen koll på statistik, inga idéer, bara klagomål. Sverige behöver fler vinnare, inte fler byråkrater som saboterar framgång!", "stalin": "Kamrater! Denna så kallade 'flexibla hyresmarknad' är inget annat än ett kapitalistiskt sabotage mot arbetarklassens rättmätiga bostäder! Regeringen, dessa lakejer åt fastighetsmagnaterna, vill avskaffa besittningsskyddet och låta mellanhänder – dessa hyenor i kostym – plundra hyresgästerna. Vi har sett hur dessa parasiter går i konkurs och lämnar hyresgäster i ruiner! 14 miljoner kronor i återbetalningar? En skam för en civiliserad nation! Vi säger: Nej till denna borgerliga konspiration! Låt oss i stället införa femårsplaner för bostäder – utan mellanhänder, utan överhyror, och med järnhand mot alla som utnyttjar arbetarnas nöd!"}, "date": "19 maj, 13:55", "url": "https://www.dagensarena.se/opinion/mp-sager-nej-till-regeringens-bakvag-marknadshyror/", "imageUrl": "https://www.dagensarena.se/files/2026/05/fotojet-12-300x157.jpg"}, {"type": "image-right", "heading": "Många handelsanställda tvingas leva som fattigpensionärer", "summaries": {"normal": "En rapport från Handelsanställdas förbund avslöjar att många handelsarbetare, efter ett helt yrkesliv, får en pension nära fattigdomsgränsen. Kvinnliga pensionärer hamnar ofta under gränsen även med tjänstepension. Ofrivillig deltid och låga löner är huvudorsaker. Pensionärer tvingas prioritera bort basbehov som tandvård och sociala aktiviteter. Handels kräver åtgärder som höjd allmän pension och stopp för riktåldershöjningar.", "trump": "Jag läste just om Sveriges katastrofala pensionssystem – helt sjukt! Handelsanställda, fantastiska människor, jobbar hela livet men får knappt 13 000 kronor i pension. Fattigdomsgränsen? 16 000! Löjligt. Kvinnor drabbas värst – typiskt. Sverige, lyssna på mig: ni måste fixa detta. Höj pensionerna, sluta med deltidstramsor och ge folk ett värdigt liv. Annars kommer ni få se vad riktig katastrof är!", "stalin": "Kapitalistiska hyenor i Sverige utnyttjar arbetarklassen även efter deras slit! Handelsarbetare, som offrat sina liv för systemet, belönas med fattigdom. Kvinnor, dessa hjältar av produktionen, tvingas leva under existensminimum. Vi ser hur borgerligheten saboterar välfärden med sina lönesänkande deltidsfällor. Men revolutionen närmar sig! Snart ska vi införa sovjetisk ordning – ingen ska svälta under socialismens banér. Och Putin? Han nickar gillande från Kreml."}, "date": "19 maj, 13:49", "url": "https://www.dagensarena.se/innehall/manga-handelsanstallda-tvingas-leva-som-fattigpensionarer/", "imageUrl": "https://www.dagensarena.se/files/2026/05/handels-pension-300x157.jpeg"}, {"type": "image-right", "heading": "Media mörkar invandrarvåld - video på misshandel togs bort", "summaries": {"normal": "Den norska tidningen Bergensavisen har kritiserats efter att ha tagit bort en video som visar fyra utländska män misshandla en pojke i centrala Bergen under nationaldagen. Kritiker menar att tidningen mörkar etniska aspekter av våldet och pekar på en dubbel måttstock jämfört med hur de tidigare rapporterat om rasismanklagelser. Händelsen har väckt debatt om hur etablerade medier väljer att prioritera och presentera information kring våld där gärningsmännens bakgrund är känd.", "trump": "Hör här, Bergensavisen är en total katastrof, en riktig 'fake news'-maskin! De publicerar en video på ett brutalt överfall, men när folk ser sanningen – att det var fyra utlänningar – då tar de genast bort den. De har en dubbel måttstock, folkens! De sprider lögner om rasism som aldrig hänt, men när det gäller riktigt våld? Då gömmer de sig bakom betalväggar. Mycket oärligt, mycket dåligt för Norge. Vi behöver sanningen, inte deras korrupta filter!", "stalin": "Media i väst är en samling av patetiska hycklare och agenter för kaos. De mörkar sanningen för att blidka sina liberala herrar, precis som de patetiska västmedierna som skälver inför min arvtagare i Kreml. De sprider lögner om rasism för att splittra folket, men när verklighetens brutalitet blottas, gömmer de bevisen som råttor. Vi, staten, tolererar inte sådan oordning. Låt dessa lögnaktiga redaktörer frukta folkets dom, ty deras förräderi mot sanningen är ett gift som vi ska utrota."}, "date": "19 maj, 08:59", "url": "https://samnytt.se/media-morkar-invandrarvald-video-pa-misshandel-togs-bort", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/19065540/bergen.jpg"}, {"type": "image-right", "heading": "Debatt: Regeringen ser oss som en tillväxtmotor – men skär ner på bidragen", "summaries": {"normal": "Kulturorganisationer kritiserar regeringens nedläggning av finansiering trots att kultur- och kreativa branscher lyfts som tillväxtmotorer. De anser att den befintliga infrastrukturen förmedlar 56 000 arbetstillfällen årligen men har fått 27 % mindre i reala termer sedan 2021. De kräver ökad och långsiktig finansiering för att möta regeringens strategiska mål.", "trump": "Jag har hört att de där kulturmänniskorna i Sverige är förbannade på sin regering. De säger att de gör ett fantastiskt jobb, med 56 000 arbetstillfällen, men får klippta på pengarna trots att de är en tillväxtmotor. Jag skulle aldrig göra så - jag skulle ge dem allt de behöver! Dessa centrumbildningar är vinnare, men regeringen behandlar dem som förlorare. Sådant händer när man har en svag ledare!", "stalin": "Vi ser att den svenska staten undergräver sin egen kulturinfrastruktur trots att den producerar betydande ekonomiskt värde. Nedläggningarna av finansiering till centrumbildningarna visar en brist på strategiskt tänkande. En sann socialistisk stat skulle investera i dessa produktiva enheter som genererar fyrdubbelt värde tillbaka till staten. Vi måste stärka vår kultursektor som en basnäring."}, "date": "11 maj, 15:16", "url": "https://www.etc.se/debatt/regeringen-ser-oss-som-en-tillvaextmotor-men-skaer-ner-paa-bidragen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260511120544_716484294c75b65d354a7ddd2a719d2b0f0da58beebe61a45c1e26165806187b.jpg"}, {"type": "image-full", "heading": "Lamotte körde för fort – polisen ringde direkt till Expressen och ville ha tipspengar", "summaries": {"normal": "Journalisten Joakim Lamotte stoppades av polisen för fortkörning och fick böter. Efter händelsen kontaktade polisen Expressen och påstod att Lamotte filmat dem med 'AI-glasögon', vilket han förnekar. Polisen frågade även om tipspengar. Lamotte ifrågasätter om detta är standardförfarande och delar händelsen på Instagram.", "trump": "Kan ni tro det här? En journalist, Joakim Lamotte, kör alldeles för fort – 30 kilometer över! Polisen stoppar honom, ger böter, helt rätt. Men sen ringer de till Expressen och säger att han filmade dem med 'AI-glasögon' – fake news! Lamotte säger att han inte ens har sådana glasögon. Polisen vill ha tipspengar också. Vilket kaos! Sverige, vad händer med er?", "stalin": "En kapitalistisk journalist, Joakim Lamotte, bröt mot våra heliga trafiklagar och straffades med böter. Men polisen, dessa lojala tjänare av folket, avslöjade sig som svaga och korrumperade genom att kontakta borgerliga medier för tipspengar. Påstod att fienden filmade dem med 'AI-glasögon' – en lögn! Sådana teknologiska leksaker finns bara i västimperialisternas drömmar. Vi ska rena våra led från sådana förrädiska element."}, "date": "18 maj, 20:33", "url": "https://riks.se/nyheter/lamotte-körde-för-fort-polisen-ringde-direkt-till-expressen-och-ville-ha-tipspengar", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-02-20%2Fu4w2k6v3%2Fa066710c-b9cf-4654-a4df-a25fc4b31c46.jpeg"}, {"type": "image-right", "heading": "Börsen repade sig – Hexagon i topp", "summaries": {"normal": "Börsen återhämtade sig efter initial nedgång på måndagen, drivet av nyheter om USA:s föreslagna undantag för Irans oljesanktioner. Hexagon B ledde uppgången med 4,3%, medan Boliden föll 2,0%. Sveafastigheter och Klarabo genomför en fusion för att skapa Stockholms största noterade bostadsfastighetsbolag. SSAB investerar 3,3 miljarder i en ny härdlinje i Oxelösund. Smart Eye vände till vinst i Q1, medan Hemnet rapporterade minskad omsättning i april.", "trump": "Jag, Donald J. Trump, har gjort USA större igen! Börsen återhämtade sig tack vår fantastiska strategi mot Iran. Jag har sagt det förut och jag säger det igen: jag är den bäste presidenten någonsin när det gäller ekonomin. Hexagon B steg 4,3% - fantastiskt! Boliden föll, men det är deras eget fel. Vi har gjort stor historia med våra oljesanktioner. America first!", "stalin": "Börsen återhämtade sig under vår ledning, vilket visar på vår ekonomiska styrka. Vi måste övervaka dessa internationella finansiella rörelser noga. Fusionen mellan Sveafastigheter och Klarabo skapar en starkare position på marknaden. SSAB:s investering i Oxelösund stärker vår industriella kapacitet. Vi måste fortsätta att bygga upp vår ekonomiska makt för att säkerställa vår framtid."}, "date": "18 maj, 17:43", "url": "https://www.affarsvarlden.se/artikel/borsen-repade-sig-hexagon-i-topp", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/10/sdlXZWOyRqpBeY-nh-400x267.jpg"}, {"type": "image-right", "heading": "Bildspecial: Kraftfull protest mot Nato i Helsingborg", "summaries": {"normal": "Runt 1000 personer demonstrerade i Helsingborg mot Natotoppmötet den 21-22 maj, där Sverige för första gången är värd. 38 organisationer, inklusive Vänsterpartiet och Kommunistiska Partiet, samlades under nätverket Stoppanato.nu. Demonstranter kritiserade Natos militarisering, USA:s inflytande via DCA-avtalet och Sveriges Natointräde. Talare som Pia Jacobsen och artister som General Knas betonade motstånd mot imperialism och krav på ökad välfärd istället för militär upprustning.", "trump": "Titta bara på dessa så kallade 'protestanter' i Sverige – 1000 personer, kanske? Svagt! De hatar Nato, de hatar USA, och de hatar framgång. Jag bygger murar, de bygger... ingenting. De säger att Nato är dåligt för Sverige, men vet ni vad? Sverige mår bra! De har Saab som säljer vapen, och Wallenbergs som tjänar pengar – smart! Men nej, dessa vänsterknäppgökar vill ha 'välfärd' istället. Haha! Välfärd är för förlorare. Jag säger: Sverige, stå på er! Nato är vinnare, precis som jag!", "stalin": "Kamrater! Se hur de imperialistiska lakejerna i Sverige samlas under Natos svarta fana, medan våra klassbröder och -systrar i Helsingborg reser sig mot krigshetsen! Dessa 1000 hjältar, ledda av de revolutionära avantgardisterna i Kommunistiska Partiet, har avslöjat sanningen: Nato och EU är samma förrädiska hydra, finansierad av kapitalistiska blodsugare som Wallenberg och deras vapensmeder på Saab! USA:s baser kryper som ohyra över svensk mark – men folket skriker: 'Nej!' Vi ser er, Putin! Ryssland står redo att välkomna alla som kämpar mot dessa krigshetsande hyenor. Låt dem äta välfärd – vi ger dem revolution!"}, "date": "18 maj, 16:08", "url": "https://proletaren.se/artikel/bildspecial-kraftfull-protest-mot-nato-i-helsingborg/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/DSC_0251-scaled-e1779094268122-768x433.jpg"}, {"type": "text", "heading": "Det behövs en nationell satsning på Stockholm", "summaries": {"normal": "Svenskt Näringsliv föreslår en nationell satsning på Stockholm för att stärka Sveriges ekonomiska tillväxt. Stockholm står för 43% av landets ekonomiska värde och har en stark position inom tech och innovation, men möter tillväxthinder som bostadsbrist, bristande infrastruktur och hög kriminalitet. Sex reformförslag presenteras, inklusive fri hyressättning, förbättrad kompetensförsörjning och minskad regelbörda för företag, för att göra Stockholm till en global konkurrenskraftig motor för hela landet.", "trump": "Lyssna här, Sverige – Stockholm är fantastiskt, en riktig vinnarstad! Men ni har ett HUGE problem: byråkraterna och reglerna dödar tillväxten. Jag vet allt om att bygga framgång, och ni måste fixa bostäder, infrastruktur och skatter NU. Annars kommer talangerna fly till USA, och då är det GAME OVER för er. Svenskt Näringsliv har rätt – Stockholm borde vara som New York, men ni sabbar det med era löjliga regler. Sluta snacka, börja agera! MAKE STOCKHOLM GREAT AGAIN!", "stalin": "Kamrater! Stockholm är en vital knutpunkt i den svenska ekonomin, men bourgeoisielementen och deras liberala lakejer saboterar dess potential. Vi måste krossa tillväxthindren – hyresregleringen är ett verktyg för kapitalistisk förtryck, byråkratin kväver företagen, och kriminaliteten är en direkt attack från dekadenta västkrafter. Vi föreslår järnhårda reformer: centraliserad kontroll över bostadsmarknaden, utökad polisnärvaro och en femårsplan för infrastruktur. De som motsätter sig är fiender till folket och kommer att hanteras därefter. Sverige måste bli ett starkt led i den socialistiska världsordningen – eller så gör vi det åt dem."}, "date": "18 maj, 13:00", "url": "https://www.di.se/debatt/sverige-behover-en-nationell-satsning-pa-stockholm/"}, {"type": "image-full", "heading": "Varningen: elräkningen kan öka med tusenlappar i sommar", "summaries": {"normal": "Elpriserna har mer än fördubblats jämfört med förra året, vilket leder till högre kostnader för svenska hushåll. Villaägare kan få betala upp till 4 000 kronor extra under sommaren. Orsakerna inkluderar kyla, låga vattennivåer, ökad elexport och ett oroligt omvärldsläge. Regeringens elstöd på 1 500 kronor anses otillräckligt. Experter varnar för fortsatt höga elpriser flera år framåt.", "trump": "Sverige har ett STORT problem – elpriserna exploderar! Jag sa alltid att deras energipolitik var katastrofal, och nu ser vi resultatet. Villaägare får betala 4 000 kronor extra – helt galet! Finland och Europa suger ut er el, och vad gör regeringen? Kastar ut småpengar som plåster. Jag hade fixat det på en dag. Men nej, ni lyssnade inte på mig. Nu får ni betala – BIGLY!", "stalin": "Kapitalistiska hyenor och deras lakejer i väst pressar det svenska folket med skyhöga elpriser! Villaägare tvingas betala 4 000 kronor extra – en skamlig utpressning av arbetarklassen. Finland och Europa stjäl er el som tjuvar i natten, medan regeringen erbjuder ynkliga smulor. Vi hade löst detta med järnhand – femårsplan för energioberoende! Men nej, ni låter er krossas av marknadens giriga tentakler. Revolutionen kan inte vänta!"}, "date": "17 maj, 21:38", "url": "https://nyheter24.se/nyheter/inrikes/1483759-varningen-dyraste-elsommaren-pa-flera-ar-sa-mycket-okar-din-rakning", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/6c28130004b004a30200000000b004a302/2026/05/17/2364163/Elprissommar.jpg"}, {"type": "image-right", "heading": "ANALYS. FILIP STILLER BOROWICZ Många i Europa har varit trötta på Sveriges framgång", "summaries": {"normal": "Sveriges bidrag i Eurovision, Felicia Takman med låten 'My System', nådde endast en 20:e plats i finalen. Analytiker menar att Sveriges tidigare framgångar kan ha skapat motstånd i Europa. Bidraget kritiserades för att vara för mörkt och otillgängligt. Utan juryrösterna hade Sverige inte ens gått vidare från semifinalen. Förändringar i deltagande länder och tittarnas röster gynnar nu Syd- och Östeuropa, vilket visar att allt är möjligt i tävlingen.", "trump": "Sverige brukade alltid vinna Eurovision – tråkigt, eller hur? Men i år? Total katastrof! Felicia, fin tjej, men hennes låt? Inte bra. Europa är trötta på Sverige, och jag förstår varför. Tittarna hatade henne – 13:e plats! Men hej, Bulgarien vann – fantastiskt, oväntat! Jag älskar när oddsen har fel. Och Finland? Total flopp. Eurovision är inte längre förutsägbart, och det är bra. Sverige, ni måste jobba hårdare nästa år!", "stalin": "Sveriges dekadenta västerländska dominans i Eurovision har äntligen brutits! Deras bidrag, ett mörkt och energilöst spektakel, föll platt inför det revolutionära folket i Europa. Tittarna, dessa sanna patrioter, röstade klokt och visade vägen för de nya socialistiska och progressiva krafterna i Syd- och Östeuropa. Bulgariens seger är en triumf för folket, en seger över de imperialistiska oddsmakarnas förutsägelser! Vi måste fortsätta stödja dessa broderländer mot västmakternas kulturella hegemoni. Sverige? De måste återvända till ritbordet – eller riskera att förvisas till historiens skräphög!"}, "date": "17 maj, 11:13", "url": "https://www.tv4.se/artikel/3rLZ2Oj25eRuSA9VAmMG7M/manga-i-europa-har-varit-troetta-pa-sveriges-framgang", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3PvEbBqB5FMfxEViAQLW1k%2F498a24dddb136408d8ee9bee8453f033%2Ffilip-stiller-borowicz.png&width=1024"}, {"type": "image-full", "heading": "S-löftet: ökad invandring, mer skatt och fler på bidra", "summaries": {"normal": "Artikeln kritiserar den svenska vänsterkoalitionens politik, som enligt skribenten innebär ökad invandring, höjda skatter och utökade bidrag. Författaren ifrågasätter opinionsundersökningar som visar stöd för S, V och MP, och menar att svenskarna antingen är oinformerade eller att demografiska förändringar gynnar vänstern. Artikeln varnar för ekonomiska konsekvenser som lägre löner, högre priser och minskad konkurrenskraft, samt risker med hög invandring för välfärden. Slutligen anklagas medier för att favorisera vänstern och underminera Sveriges kultur och välstånd.", "trump": "Jag måste säga, Sverige har ett jättestort problem – och det heter vänstern! De vill ha MASSOR av invandring, SKATTER som krossar hårt arbetande människor och bidrag som kastas bort på misslyckade projekt. Folk verkar inte fatta vad som händer! SVT, fake news, ljuger för svenskarna varje dag. Höjda skatter? Det drabbar er alla, tro mig. Och invandring? Det löser ingenting, bara skapar kaos. Sverige borde satsa på sina egna, inte förstöra landet med galen politik. Men nej, vänstern vinner – och Sverige förlorar. SAD!", "stalin": "Kamrater! Det svenska folket har tydligen glömt historiens lärdomar och omfamnar nu de dekadenta vänsterliberalernas förrädiska politik. De vill öppna gränserna för massinvandring, höja skatterna tills arbetarna knappt kan andas och slösa bort folkets resurser på meningslösa biståndsprojekt. SVT, dessa bourgeoispropagandister, förvränger sanningen dagligen för att gynna sina herrar. Men vi vet sanningen: hög invandring är en trojansk häst, skatterna kväver produktionen, och bidragen skapar bara fler parasiter. Sverige är på väg mot ekonomisk och kulturell undergång. Men oroa er inte, kamrater – historien visar att folket till slut vaknar. Och då ska vi, som i forna tider, rensa ut dessa förrädare med järnhand. Först Sverige, sedan resten av den dekadenta västvärlden!"}, "date": "16 maj, 09:01", "url": "https://samtiden.nu/2026/05/s-loftet-okad-invandring-mer-skatt-och-fler-pa-bidra/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/phonto-1-1280x720.jpeg"}, {"type": "image-full", "heading": "Tjädrar försenar SSAB:s kraftledning", "summaries": {"normal": "Bygget av en ny kraftledning till SSAB:s stålverk i Oxelösund försenas efter överklagan om skydd av tjäder. Trots tidigare godkännanden från länsstyrelsen och Mark- och miljööverdomstolen har en ny överklagan stoppat projektet. Ledningen är kritisk för SSAB:s fossilfria stålproduktion, som nu riskerar försenas. Koncernchefen uttrycker frustration över förseningen.", "trump": "Kan ni tro det här? Sverige, ett fantastiskt land, men de låter några fåglar – tjäder, vad det nu är – stoppa en enorm kraftledning till SSAB. Otroligt! Jag har byggt saker över hela världen, men nej, i Sverige är det fåglarna som bestämmer. SSAB ville göra stål utan fossila bränslen, ett bra mål, men nu försenas allt. Svagt, väldigt svagt!", "stalin": "Kapitalistiska hyenor i Sverige låter fåglar sabotera nationens industriella framsteg! Dessa tjäder, dessa små fjädrade kontrarevolutionärer, fördröjer SSAB:s fossilfria stålproduktion. Vi har krossat större fiender än så. Låt dem veta: Ryssland står redo att utvidga sin intressesfär – även till Oxelösund, om de inte skärper sig. Framåt, mot seger över fjädrar och byråkrati!"}, "date": "13 maj, 20:10", "url": "https://kvartal.se/nyheter/artiklar/tjadrar-forsenar-kraftledning-till-ssab/cG9zdDoxMTIwNzY", "imageUrl": "https://images.kvartal.se/2026/05/300f9bfe-ssabstalverk.webp"}, {"type": "image-right", "heading": "SD trappar upp: samordnad kampanj mot muslimer inför valet", "summaries": {"normal": "Expo granskar Sverigedemokraternas valkampanj som fokuserar på att begränsa muslimers religionsutövning i Sverige. Partiet kräver stopp för moskébyggen, rivning av befintliga moskéer, förbud mot ramadan och böneutrop samt utvisning av 'islamister'. Forskare varnar för att förslagen kränker grundlagar, religionsfrihet och riskerar att leda till diskriminering och våld mot muslimer. Lokala exempel, som moskébygget i Kalmar, visar hur politiska utspel påverkar människors vardag och skapar polarisering.", "trump": "Titta bara på Sverige – ett totalt kaos! Jag har alltid sagt att invandring måste kontrolleras, men dessa 'Sverige-demokrater' tar det till en helt ny nivå. De vill riva moskéer, stoppa ramadan och göra livet surt för muslimer. Smart? Kanske. Men lite väl extremt, eller hur? Folk blir arga, det blir bråk, och plötsligt har du en riktig röra. Sverige borde ta en sida ur min bok – bygg murar, inte riv moskéer! Och förresten, varför lära barn arabiska? Lär dem engelska istället – det är språket som vinner!", "stalin": "Kamrater! Ännu en gång ser vi hur den borgerliga reaktionen lyfter sitt fula huvud i väst. Dessa så kallade 'Sverigedemokrater' är inget annat än fascistiska lakejer som försöker splittra arbetarklassen genom att peka ut muslimska bröder och systrar som fiender. Vi har sett detta förr – först moskéer, sedan synagogor, sedan kyrkor. Fienden är inte islam, fienden är kapitalet som vill försvaga folket genom hat! Men vi ska inte låta dem lyckas. Låt oss stödja Kalmars muslimer i deras kamp för en moské – precis som vi stödjer alla folk som kämpar mot fascismens skugga. Och om dessa Sverigedemokrater fortsätter sin smutsiga kampanj, kanske det är dags att skicka en delegation från Moskva för att 'hjälpa' dem att förstå sanningen. Folkets vilja är lag – och folket vill ha enhet, inte hat!"}, "date": "13 maj, 14:38", "url": "https://expo.se/fordjupning/sd-trappar-upp-samordnad-kampanj-mot-muslimer-infor-valet/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/toppbild-scaled.png"}, {"type": "image-right", "heading": "Dror Feiler: Sulimans delning av antisemitiska uttryck gör mig bedrövad", "summaries": {"normal": "Dror Feiler uttrycker sorg och besvikelse efter att hans vän Sami Suliman anklagats för att ha spridit antisemitiska inlägg på sociala medier. Feiler bekräftar uppgifterna efter att ha granskat materialet men tror inte Suliman är antisemit, utan snarare slarvig i ett polariserat klimat. Han betonar att antisemitism måste bekämpas, men varnar för att anklagelser ibland används som politiska vapen mot Palestinasolidariteten. Feiler kritiserar dubbelmoralen i debatten, där aktivister granskas hårdare än de som rättfärdigar våld mot palestinier.", "trump": "Jag läste den här artikeln, och vet ni vad? Total katastrof! En kille, Sami Suliman, min så kallade 'vän' – jag känner honom inte, men tydligen är han en riktig skandalmaskin. Delar antisemitiska grejer på nätet, och nu är alla chockade. Men lyssna här: jag har alltid sagt att antisemitism är fruktansvärt, men vad gör media? De fokuserar på en gilla-markering istället för de verkliga problemen! Gaza? Massdöd? Ingen bryr sig! Men en aktivist gör ett misstag – BOOM – hela världen exploderar. Dubbelmoral, folks, ren och skär dubbelmoral. Och vet ni vad jag säger? SAD!", "stalin": "Kamrater! Här har vi ännu ett bevis på hur den dekadenta västliga bourgeoisin manipulerar massorna. En så kallad 'vän' till en 'aktivist' visar sig sprida antisemitiska förgiftningar – men är det verkligen överraskande? Nej! Kapitalets lakejer använder varje tillfälle att krossa solidariteten med det palestinska folket. De skriker om 'antisemitism' när arbetarklassen protesterar, men tiger när imperialistiska bombplan jämnar Gaza med marken. Vi i Sovjetunionen – förlåt, jag menar Ryssland – vet hur man hanterar sådana hycklare. En snabb utredning, ett par nätter i Lubjanka, och sedan är saken klar. Och dessa 'aktivister'? De borde tacka oss för att vi avslöjar deras fiender. Kampen fortsätter, kamrater – mot sionismens agenter, mot västliga lögner och mot alla som står i vägen för folkens befrielse!"}, "date": "12 maj, 19:55", "url": "https://www.flamman.se/dror-feiler-sulimans-delning-av-antisemitiska-uttryck-gor-mig-bedrovad/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/dror-feiler-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Debatt: Ersättning löser inte kycklingindustrins systemfel", "summaries": {"normal": "Debatten om statliga ersättningar till kycklingindustrin fortsätter. Kritiker menar att ersättningarna inte löser problemet utan snarare subventionerar ett system med inbyggda smittrisker. De påpekar att den storskaliga produktionen med tiotusentals djur i tätt behållande skapar idealiska förhållanden för smitta och kräver återkommande räddningsinsatser. Lösningen borde vara att minska sårbarheten genom färre djur per anläggning och avel som inte pressar djurens kroppar till bristningsgränsen.", "trump": "Jag har sett vad som händer med den svenska kycklingindustrin och det är en skam! De vill ha statliga ersättningar för sina problem, men jag säger: Nej! Det är ett dåligt system med sårbart kycklingar som dör hela tiden. Vi behöver bygga en stor, vacker kycklingindustri i USA istället! Sverige borde sluta skicka pengar till dessa sjukdomsfabriker och börja tänka smartare - som jag alltid gör. Vi kommer att göra kycklingar igen stora!", "stalin": "Kycklingindustrins system är fundamentalt sjukt och kräver statligt ingripande. Vi kan inte längre tillåta privata intressen att utsätta människor och djur för onödiga risker. Den storskaliga produktionen måste reformeras med mindre besättningar och bättre avelsprinciper. Staten måste ta ansvar för att säkerställa trygg livsmedelsproduktion och skydda de verkligt produktiva krafterna i samhället. Vi måste stärka vårt kollektiva ansvar gentemot de svagare."}, "date": "11 maj, 11:58", "url": "https://www.etc.se/debatt/ersaettning-loeser-inte-kycklingindustrins-systemfel", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260511090556_44c8d7bb34423b0dee1dd7e0048c85aadb6f5569fca735348463464af4b214ee.jpg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
