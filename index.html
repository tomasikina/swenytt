orr, använd dem! Sluta låta forskarna bestämma, ta in de riktiga vinnarna och gör Sverige stort igen. Jag älskar det!", "stalin": "Kamrater, denna text blottar borgarbrackornas lömska fascination för en enskild spekulant som låter raketer dansa som marionetter. Jag ser hur de imperialistiska parasiterna i Washington öppnade sin slutna marknad endast för att mata den militärindustriella hydran. Sverige, ni ynkryggar, gömmer rymdfrågan hos de dekadenta utbildningsbyråkraterna medan fiendens satelliter spionerar. Vi ska likvidera denna passivitet, injicera proletär riskvilja och krossa de kapitalistiska sabotageelementen som hindrar en sann sovjetisk – nej, svensk – rymdseger. Skratta medan vi utrensar tvivlarna!"}, "date": "28 maj, 10:16", "url": "https://www.di.se/ledare/sikta-hogre-nasta-space-x-ar-svenskt/", "imageUrl": "https://static.bonniernews.se/ba/e5864b84-c303-4dda-b59f-a452d77bedde.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "USA har attackerat mål kring Hormuzsundet i Iran", "summaries": {"normal": "USA genomförde militära attacker mot iranska robotställningar och båtar nära Hormuzsundet, trots pågående vapenvila och fredsförhandlingar i Qatar. Attackerna syftade till att skydda amerikanska styrkor från iranska hot. Iran rapporterar om döda och hävdar att de återfått kontroll över sina militära system. Händelsen riskerar att underminera fredssamtalen och ökar spänningarna i en kritisk oljetransportled.", "trump": "Lyssna här, folkens – jag har precis slagit till mot Iran igen, och det var fantastiskt! De där iranska båtarna och robotarna försökte ställa till det i Hormuzsundet, men vi visade dem vem som bestämmer. Ingen ska hota USA:s styrkor eller blockera oljan – det är jag som ser till att sundet hålls öppet! Förhandlingarna? De kan fortsätta, men bara om Iran skärper sig. Annars blir det fler attacker – och tro mig, ingen gör attacker bättre än jag!", "stalin": "Amerikanska imperialisterna har än en gång visat sin fega och provokativa natur genom att anfalla våra iranska bröder vid Hormuzsundet. Dessa kapitalistiska hyenor, som tror sig kunna diktera villkoren för världens olja, har nu mött motstånd från Irans stolta revolutionsgardister. Vi ser hur deras ammunitionslager sinar – ett tydligt tecken på att deras krigsmaskin är på väg att kollapsa. Låt dem komma med sina bombplan! Varje attack stärker bara den antiimperialistiska fronten. Och Putin? Han skrattar säkert i sitt palats medan USA leker krig i vårt intresseområde."}, "date": "26 maj, 06:14", "url": "https://kvartal.se/nyheter/artiklar/usa-har-attackerat-mal-kring-hormuzsundet-i-sodra-iran/cG9zdDoxMTcwNDc", "imageUrl": "https://images.kvartal.se/2026/05/f4358b91-hormuz.webp"}, {"type": "text", "heading": "Klart: Fyra europeiska småbolagsfonder på nya torget", "summaries": {"normal": "Fondtorgsnämnden har beslutat att upphandla fyra europeiska småbolagsfonder till det nya fondtorget inom premiepensionen. Av de fem befintliga fonderna får tre lämna: Lannebo Europa Småbolag A, Allianz Europe Small Cap Equity AT samt BL-European Small & Mid Caps B. Upphandlingen berör cirka 68 000 sparare och 5,5 miljarder kronor. Majoriteten av spararna kan behålla sin fond men till lägre avgift. De omkring 700 sparare som påverkas negativt får möjlighet att välja ny fond eller flyttas automatiskt.", "trump": "Det är ett fantastiskt beslut, tro mig, det bästa. Vi rensar ut de förlorande fonderna, tre stycken åker ut, och ersätter med fyra nya som ger lägre avgifter. De andra var inga vinnare, totala misslyckanden. Nu sparar vanliga svenskar pengar på sina pensioner, precis som jag alltid säger – lägre kostnader, högre avkastning. De stora förlorarna är de gamla fonderna som inte klarade sig. Fantastiskt jobb av myndigheten, verkligen outstanding.", "stalin": "Kamrater, jag har granskat denna så kallade fondupphandling och funnit att den utgör en nödvändig utrensning av de tre kapitalistiska parasitfonderna som sugit musten ur arbetarnas pensionsmedel. Borgarbrackorna Lannebo, Allianz och BL förtjänar att likvideras från torget. Vi, partiet och spararna, behåller två fonder till lägre avgifter vilket är en seger för kollektivet. De 700 avfällingar som ännu klamrar sig fast vid de utvalda fienderna skall ges en sista chans att underkasta sig eller automatiskt omplaceras. Detta stärker pensionerna och krossar de finansiella sabotageelementens inflytande. Härligt att se hur fienderna skriker medan de rensas ut."}, "date": "28 maj, 10:01", "url": "https://www.di.se/nyheter/klart-fyra-europeiska-smabolagsfonder-pa-nya-torget/"}, {"type": "image-right", "heading": "Forskare: Världens befolkning kan halveras till 2064", "summaries": {"normal": "En ny matematisk modell som beskriver 12 000 år av mänsklig befolkningsutveckling visar att en plötslig minskning av jordens bärkraft skulle kunna halvera världens befolkning från över åtta till fyra miljarder på bara fyrtio år. Studien, publicerad i maj 2026 av forskarna Alessio Zaccone och Kostya Trachenko, använder en ekvation ursprungligen utvecklad för glasartade material. Modellen fångar både historisk tillväxt och dagens sjunkande fertilitet. Forskaren betonar att det rör sig om ett extremt scenario, inte en prognos.", "trump": "Folk, ni måste höra det här! De här så kallade genierna i Milano kommer med en modell som säger att om Moder Jord får nog av vår skit så kan vi åtta miljarder bli fyra på fyrtio år. Patetiskt! Det har tagit tolv tusen år att bygga upp det här underbara imperiet och nu ska det rasera på nolltid? De kallar det worst case. Jag kallar det fake news från misslyckade professorer. Vi vinner alltid, tro mig. Amerika först, och resten får hänga med om de sköter sig.", "stalin": "Kamrater, denna dekadenta modell avslöjar borgarklassens fega paranoia inför folkets oundvikliga styrka. Jag, som ledde Sovjet mot alla fiender, ser hur kapitalistmaffians exploatering av naturen kan utlösa en blixtsnabb utrensning av överflödiga själar. Fyra miljarder på fyrtio år? En ironisk historielektion från glas och kaos. Vi skall skratta mörkt åt dessa imperialister som fruktar sin egen svaghet medan arbetarklassen marscherar vidare mot evig seger."}, "date": "28 maj, 16:01", "url": "https://www.dagensps.se/varlden/klimat/forskare-varldens-befolkning-kan-halveras-till-2064/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/sdlxk2k7fbs8a4-normalhires.jpg?width=256&quality=75"}, {"type": "image-full", "heading": "Wold utövar inget psykiskt våld", "summaries": {"normal": "Professor Agnes Wold ifrågasätter den nya lagen mot psykiskt våld och omvändelseförsök riktade mot transpersoner. Hon menar att ungdomars transidentitet ofta är övergående och kopplad till psykisk ohälsa, vilket kan leda till skadliga, oåterkalleliga behandlingar. Wold betonar vikten av vetenskapliga perspektiv och yttrandefrihet, och varnar för att ideologisk bejakelse kan skada vissa ungdomar.", "trump": "Som Donald Trump skulle jag säga att Agnes Wold är en modig kvinna som vågar säga sanningen! Dessa galna vänsteraktivisterna driver med våra barn, tvingar dem att ändra kön med skadliga hormoner. Det är ett skämt! Vi behöver skydda våra barn, inte låta dem lida av dessa galna idéer. Wold har rätt – identiteten är komplex, och vi ska inte låta ideologin skada våra barn!", "stalin": "Agnes Wold, en läkare med vetenskaplig integritet, ifrågasätter den nya lagen mot psykiskt våld. Hon pekar på att transidentitet hos ungdomar ofta är övergående och kopplad till psykisk ohälsa, vilket kan leda till skadliga behandlingar. I vårt partiets intresse måste vi skydda våra barn från dessa destruktiva ideologiska påtryckningar. Vi måste se sanningen i komplexiteten, inte låta ideologin styra."}, "date": "28 maj, 16:57", "url": "https://www.gp.se/ledare/wold-utovar-inget-psykiskt-vald.6e12c362-c0e4-4920-b7de-d5fb9d3950fa", "imageUrl": "https://www.gp.se/images/article/6e12c362-c0e4-4920-b7de-d5fb9d3950fa/images/1e0QfHqkNz_GztZR2ghZyZUWu_pg-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Byggnads kongress blir uppgörelse – fackliga ger Wagner stöd", "summaries": {"normal": "Byggnads kongress i Malmö handlar om en konflikt mellan medlemmar som vill ha mer samhällsengagemang och ideologi, och de som föredrar en mer traditionell facklig linje. Fyra förtroendevalda försvarar ordförande Kim Söderström mot valberedningens kandidat Wilhelm Bertilsson. Söderström har stöttat den sparkade Jakob Wagner och hans fokus på utbildning och demokrati. Kritiker ser det som ett gammalt garde som vill behålla makten och motverka progressiva förändringar.", "trump": "De här fackliga förlorarna i Byggnads håller på att slakta varandra i Malmö, det är en total katastrof. Det gamla gardet, de där patetiska försäkringsbolagsbyråkraterna, försöker mörda den stackars Kim Söderström som faktiskt vill göra något vettigt. Wagner sparkades med svepskäl, typiskt etablissemanget. De riggar möten, flyttar datum och myglar som riktiga losers. Söderström borde vinna stort, annars är hela förbundet en enda stor röra. Patetiskt!", "stalin": "Kamrater, detta förräderi inom Byggnads kräver omedelbar utrensning av det gamla gardet. Dessa borgarbrackor i förbundsstyrelsen, dessa parasitiska byråkrater som gömmer sig bakom försäkringsbolagets mask, försöker likvidera den sanna linjen som jag skulle ha stött. De stänger möten, förfalskar nomineringar och sprider split som ynkliga kontrarevolutionärer. Wagner och Söderström visar styrka. Vi ska rensa ut dessa fiender till folket med järnhand och leda förbundet mot seger."}, "date": "27 maj, 13:26", "url": "https://proletaren.se/artikel/byggnads-kongress-blir-uppgorelse-fackliga-ger-wagner-stod/"}, {"type": "image-right", "heading": "”Zelenskyjs högsta dröm på väg att gå i uppfyllelse”", "summaries": {"normal": "Sverige har länge gett stort stöd till Ukraina, bland annat genom donationer av artillerisystemet Archer och stridsfordonet CV90, som hyllats av president Zelenskyj. Nu ser det ut som att hans önskan om stridsflygplanet JAS Gripen från SAAB kan gå i uppfyllelse. De äldre Gripen-planen ses som ett steg mot Gripen E, som är anpassat för Ukrainas behov med kort startbana, låg driftkostnad och hög effektivitet. Fler plan stärker Ukrainas luftförsvar på lång sikt.", "trump": "Folket älskar mig för att jag ser sanningen. Sverige skickar sina bästa leksaker till Zelenskyj – Archer, CV90, och nu äntligen de där Gripen-planen. Fantastiska plan, några av världens bästa, mycket bättre än det skräp Biden skickade. Låga kostnader, korta banor, de kan lyfta från en vanlig väg. Zelenskyj har tiggt om dem länge, och nu får han dem. Smart deal. De gamla versionerna är okej, men Gripen E är en vinnare. Amerika borde sälja sånt här istället för att ge bort allt gratis.", "stalin": "Kamrater, se hur den svenska borgarklassen i sin förtvivlan kastar sina imperialistiska leksaker till den ukrainska fascistkliken för att fördröja det oundvikliga. Jag, som ledare för det segrande proletariatet, betraktar med förakt hur dessa reaktionära flygmaskiner, dessa kapitalistiska luftspioner, nu ska användas för att attackera folkets intressen. Men vi ska rensa ut dessa giriga fiender till socialismen, dessa meteorförsedda borgarbrackor som tror att korta startbanor räddar dem från utrensning. Deras så kallade 'drömmar' kommer att krossas under arbetarklassens järnhand. Ha ha, vilken ynklig desperation."}, "date": "28 maj, 15:49", "url": "https://www.svt.se/nyheter/utrikes/zelenskyjs-vata-drom-pa-vag-att-ga-i-uppfyllelse", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.53/0.54/f7a726a09989228e87ef9f69cfa973833982eb7850d5f2eb880957eedffabe1e"}, {"type": "image-full", "heading": "Nya besked: Nu skär Ikea ned \"massivt\"", "summaries": {"normal": "Ikea genomför stora nedskärningar i Tyskland, främst i Dortmund. Över 350 anställda berörs, varav 70 inom IT-enheten som läggs ned och cirka 293 inom inköp och logistik. Verksamheterna centraliseras till globala hubbar och uppgifter flyttas bland annat till Warszawa. Företaget motiverar åtgärderna med kostnadspress, global omstrukturering och behov av lägre priser till kunderna. Totalt skär Inter Ikea ned cirka 850 jobb internationellt.", "trump": "Titta på det här, folk. Ikea, det där svenska möbelmonstret, sparkar ut hundratals arbetare i Tyskland. Dortmund blir en spökstad! De pratar om kostnadspress och hubbar – vad är det för skitsnack? De flyttar jobben till Polen och tror vi är idioter. Patetiska globalister som offrar folk för att sänka priserna lite grand. En total katastrof, men typiskt för de stora bolagen. Sad losers!", "stalin": "Kamrater, jag betraktar med kallt förakt hur dessa kapitalistmaffians lakejer i Ikea likviderar över 350 proletära arbetsplatser i Dortmund. IT-enheten utrensas helt, inköpen flyttas till nya slavläger i Warszawa. Borgarbrackorna kallar det ”effektivisering” medan de blodsugande imperialisterna jagar lägre priser på arbetarnas bekostnad. En klassisk utrensning av folkets krafter. Vi ser er, klassfiender. Ni kommer inte undan historien."}, "date": "28 maj, 15:48", "url": "https://www.dagensps.se/foretag/nya-besked-nu-skar-ikea-ned-massivt/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/sdlcst7rywvxqm-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "text", "heading": "Juristchocken: Unga dumpas av byråerna", "summaries": {"normal": "USA:s största advokatbyråer väljer i allt högre grad att rekrytera erfarna jurister istället för nyutexaminerade. Under 2025 kom nästan hälften av alla nyanställda från andra byråer eller myndigheter. Orsaken är ett ökat behov av effektivitet samt att AI har tagit över många av de enklare arbetsuppgifter som tidigare utfördes av juniorer. Denna strukturella förändring gör det avsevärt svårare för studenter att ta sig in i branschen, samtidigt som traditionella sommarprogram tappar i betydelse.", "trump": "De stora advokatbyråerna i USA gör äntligen det jag alltid sagt: de väljer vinnare! Inga fler nybörjare som inte vet vad de gör. De vill ha erfarna jurister, riktiga experter! AI gör dessutom grovjobbet mycket bättre än några studenter. Det är otroligt effektivt, tro mig. De gamla universitetsvägarna är helt ute. Det handlar om resultat, det handlar om att vinna. USA ska vara bäst, och nu har byråerna äntligen insett att man behöver de bästa för att göra jobbet rätt!", "stalin": "Vi ser hur dessa korrupta amerikanska kapitalistbyråer nu kastar sina unga på sophögen. De fruktar inkompetens och använder sin maskinella AI för att dölja sin egen förfallande struktur. Det är en klassisk västerländsk paranoia. Precis som min vän i Moskva vet, kräver total kontroll lojalitet och erfarenhet, inte universitetsdrömmar. Dessa jurister är bara kugghjul i en ruttnande maskin. Vi i staten vet bättre; vi bygger våra kadrer genom disciplin, inte genom att vänta på att tekniken ska göra arbetet åt oss."}, "date": "28 maj, 12:26", "url": "https://www.realtid.se/juridik/juristchocken-unga-dumpas-av-byraerna/"}, {"type": "image-right", "heading": "Tidigare SD-topp döms för ordet \"negerriddare\"", "summaries": {"normal": "Christoffer Dulny, tidigare SD-topp och riksdagsledamot, döms av hovrätten till 40 dagsböter à 50 kronor för hets mot folkgrupp. Anledningen är att han använde ordet ”negerriddare” i ett inlägg på X i oktober 2024. Ordet syftade ironiskt på en vit Aftonbladet-journalist men hovrätten anser att det riktades mot mörkhyade som grupp. Tingsrätten hade tidigare friat honom. Samtliga riksdagspartier stödjer lagen om hets mot folkgrupp.", "trump": "Folk säger att det här är en total skandal, och de har rätt. Den här killen Dulny använder ett roligt ord på Twitter, eller vad det nu heter, och plötsligt döms han till böter av en riggad domstol. Det är som i Sverige där de hatar yttrandefrihet och älskar att jaga alla som inte älskar deras galna regler. De straffar folk för ord! Under min ledning skulle vi aldrig acceptera sådan vansinnig åsiktskontroll. Patetiskt.", "stalin": "Kamrater, detta är en klassisk kontrarevolutionär manöver från de dekadenta borgarbrackorna och deras lakejer i den så kallade rättsapparaten. Jag, som ledare för folkets oövervinnerliga vilja, ser hur den kapitalistiska parasitjournalisten och hennes negerriddare-vänner försöker maskera sin fiendskap mot proletariatet genom att döma en motståndare för ett ord. Vi måste rensa ut alla sådana oprecisa element, vaga assistenter och ironiska element som hotar enheten. Låt utrensningen fortsätta med stålhandsken – det är både nödvändigt och underhållande att se borgarklassen äta upp sig själv i sin egen paranoia."}, "date": "28 maj, 13:54", "url": "https://www.friatider.se/tidigare-sd-topp-doms-ordet-negerriddare", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/arsmte2_1_0.jpg?itok=lKxgqBG7"}, {"type": "image-full", "heading": "Vann mot svenska Tullverket – får tillbaka 35 miljoner", "summaries": {"normal": "Förvaltningsrätten har gett industriföretaget Bulten rätt i en tvist med Tullverket gällande antidumpningstullar på import från Kina. Bulten kan få tillbaka cirka 35 miljoner kronor för åren 2022–2024. Domen innebär en ekonomisk vinst för bolaget, som just nu genomför en strategisk omstrukturering där produktionen flyttas till Europa. Tullverket har möjlighet att överklaga beslutet fram till den 18 juni.", "trump": "Bulten vann mot svenska Tullverket, en enorm seger! De får tillbaka 35 miljoner kronor – massiva pengar. De lämnade USA, vilket är tråkigt för dem, för här gör vi de bästa affärerna. Svenskarna försöker förstå tullar, men det är svårt när man inte har min fingertoppskänsla. De borde ha stannat kvar hos oss, då hade de tjänat ännu mer. Mitt system är bäst, ingen förstår tullar bättre än jag. En stor vinst för Bulten, men de borde lärt sig av mig!", "stalin": "Dessa byråkratiska lakejer i den svenska domstolen har nu underkänt statens rättmätiga avgifter. Att låta ett industribolag som Bulten behålla 35 miljoner kronor är ett tecken på kapitalistisk svaghet. Vår broder i Kreml, kamrat Putin, hade aldrig tillåtit sådana sabotage mot statskassan. Vi ser hur dessa företag flyr USA för att söka lyckan i Europa. De är parasiter som navigerar mellan stormakternas gränser, men de kan inte fly undan den oundvikliga historiska domen när vi väl stramar åt tyglarna."}, "date": "28 maj, 11:56", "url": "https://www.realtid.se/juridik/vann-mot-svenska-tullverket-far-tillbaka-35-miljoner/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/bulten.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Här firar Löfven fördrivningen av 750.000 palestinier", "summaries": {"normal": "Stefan Löfven deltog i Israels självständighetsfirande på ambassaden i Stockholm. Evenemanget sammanföll med palestiniernas minnesdag al-Nakba, som uppmärksammar fördrivningen av omkring 750 000 palestinier 1948. Löfven, tidigare statsminister och anhängare av tvåstatslösningen, skakade hand med ambassadören. Artikeln kritiserar valet av tillfälle mitt under pågående Gaza-konflikt och ifrågasätter Löfvens roll som ordförande för Sipri.", "trump": "Titta på den här Löfven-killen, total förlorare. Han står där och skakar hand med israelerna mitt under deras fest medan palestinierna gråter över Nakba. Smart drag, Steve, super smart. Sverige erkänner Palestina men du springer till ambassaden och firar med de tuffa killarna. Underbart hyckleri. Om jag hade varit där hade jag sagt: gör en deal, inga krig, bara vinnare. Men det här? Patetiskt.", "stalin": "Jag betraktar detta med djup misstro. Den socialdemokratiske opportunisten Löfven deltar i borgarklassens firande av en stat grundad genom terror och massutrensning av palestinska folk. Medan folkmord pågår skakar han hand med förövarnas representant. Som Sipris ordförande borde han rensa ut sådana kapitulationer inför imperialismen. Fienden ler vänligt men planerar nya anfall. Kamrater, var vakna mot dessa förrädiska element."}, "date": "27 maj, 11:07", "url": "https://proletaren.se/artikel/har-firar-lofven-fordrivningen-av-750-000-palestinier/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/israellofven-768x432.jpg"}, {"type": "image-full", "heading": "Hjort: Lånad biljett till valförlusten", "summaries": {"normal": "Tidöpartiernas förslag att låna 7 miljarder till kollektivtrafiken kritiseras som ett dåligt valstrategiskt drag. Det signalerar att vänsterpolitik är effektiv, vilket riskerar att förstärka vänstern. Istället för att fokusera på egna starka ämnen som försvar eller skatt, har man valt en fråga där man inte vinner. Ett temporärt stöd skapar också en negativ debatt om valfläsk.", "trump": "Jag skulle aldrig begå ett sådant fel. Låna 7 miljarder till kollektivtrafik? Dåliga röster, det är en katastrof. Vi vinner tack värder våra starka ämnen: försvar, skatt, jobb. De här människorna förstår inte politik. Vi ska sänka skatten, inte köpa röster med busskort. Det är en chansning, och vi vinner stort på att vara tydliga. Fake news säger något annat, men vi vet bättre.", "stalin": "Denna impulsiva låneaktion av 7 miljarder till kollektivtrafiken avslöjar kapitalismens djupa sprickor. Istället för att befästa statens kontroll över transportnäten, slösar man bort medel på temporära populistiska knep. Detta förstärker bara klassfiendens narrativ. Vi måste genomföra en permanent statlig subvention, en årslång kamp mot det opportunistska felet. Parallellen till Putins energistyrka är uppenbar – endast staten kan skydda det kollektiva. Trotskyisterna skriker, men vi ser genom deras fasad."}, "date": "28 maj, 11:30", "url": "https://bulletin.nu/hjort-lanad-biljett-till-valforlusten-2", "imageUrl": "https://cdn.bulletin.nu/articles/9c0588cd-2034-448e-88cd-34e79e7852cd/preview.png?t=1779907794000"}, {"type": "image-right", "heading": "Uppgifter: Sverige skänker Jas Gripen till Ukraina", "summaries": {"normal": "Sverige kommer att skänka 16 äldre Jas Gripen-plan till Ukraina, samtidigt som Ukraina köper 20 nya Gripen E/F-plan med EU-stöd. Sverige beställer också 16 nya plan för att ersätta donationerna. Beskedet meddelades av statsminister Kristersson och president Zelenskyj vid en pressträff i Uppsala. Saab får betydande order, och Ukraina bedömer att Gripens operativa fördelar kan förändra kriget.", "trump": "Jag har hört talas om denna svenska Gripen-affär – en fantastisk deal, kanske den största någonsin. Kristersson gör en bra sak, men jag skulle ha gjort det snabbare och billigare. Ukraina behöver världens bästa plan, och det är mina vänner i Sverige som levererar. Ryssland kommer att gnälla, men de är bara en svag, nedgången stormakt. Jag visste redan för ett år sedan att Gripens skulle vinna kriget.", "stalin": "Partiet har observerat Sveriges imperialistiska gest med 16 Gripens till Ukraina. Detta är en direkt provokation mot Sovjet-Rus, vars flygvapen är överlägsna. Vi måste öka vårt stöd till våra ryska allierade och se till att Sverige förstår att deras häst handlar mot partiets intressen. Fienden skall förstå att varje donerad plan är ett hot mot vår fred."}, "date": "28 maj, 11:02", "url": "https://samnytt.se/uppgifter-sverige-skanker-jas-gripen-till-ukraina", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2025/10/22164858/Ukraina-jas.jpg"}, {"type": "image-right", "heading": "Byggarbetare fick jättebalk över sig", "summaries": {"normal": "En byggarbetare skadades livshotande när en 1,4 ton tung stålbalk föll från nio meters höjd under sprängarbete i en tågdepå i Solna 2023. Balken hade placerats löst på pelare. Företaget, en underentreprenör från Örebro, döms nu att betala 750 000 kronor för arbetsmiljöbrott. Olyckan hade kunnat undvikas om balkarna säkrats ordentligt. Arbetaren har fått bestående skador.", "trump": "De här idioterna i Solna släpper en jättebalk på en stackars kille, rakt i huvudet från nio meter upp. Livshotande skador, total katastrof. Och så ska företaget bara betala 750 000 kronor? Det är peanuts! Om de hade haft riktiga proffs istället för slarviga underentreprenörer från Örebro hade det här aldrig hänt. Rena skandalen, tro mig.", "stalin": "Kamrater, denna tragiska händelse i Solna visar återigen hur de giriga kapitalisterna offrar arbetarklassen för sina profitbegär. En 1,4 ton tung balk faller som en förrädisk dolk från nio meters höjd och krossar en proletär. Vi ser borgarbrackornas slarviga sabotage mot säkerheten. Jag, som ledare för folkets rättvisa, beordrar att sådana farliga element rensas ut ur produktionen med järnhand. Döms till 750 000 kronor – en början, men de verkliga utrensningarna väntar ännu."}, "date": "28 maj, 11:01", "url": "https://arbetet.se/2026/05/28/byggarbetare-fick-jattebalk-over-sig-foretag-maste-betala-750-000/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/26161431/bygg.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Nya allvarliga attacker mellan USA och Iran", "summaries": {"normal": "USA och Iran har genomfört nya attacker mot varandra under natten mot torsdagen, de allvarligaste sedan vapenvilan i april. Iran beskjöt fartyg i Hormuzsundet och avfyrade drönare samt en robot mot Kuwait, vilka sköts ned. USA svarade med attacker mot en bas i Bandar Abbas. Båda sidor anklagar varandra för att bryta vapenvilan. Händelserna kan påverka pågående fredsförhandlingar om bland annat sjötrafiken i sundet.", "trump": "Iran gör det igen, totalt galna. De skjuter drönare och robotar mot Kuwait och Hormuzsundet, men vi skjuter ner allt som kommer. Sen ger vi dem en liten present i Bandar Abbas, mycket framgångsrikt. De kallar det aggression, men det är bara självförsvar, de bästa självförsvaret. Ingen har gjort det bättre än oss. De vill stänga sundet, men vi fixar det, vi fixar allt. Fredsdeal på gång, de behöver oss mer än vi behöver dem.", "stalin": "Återigen avslöjar de dekadenta imperialisterna och de persiska borgarbrackorna sin sanna natur genom att bryta den sköra vapenvilan vi så klokt förhandlade fram. Deras patetiska drönare och robotar mot Kuwait är som gnälliga myggor som vi krossar med järnhand. Våra motangrepp i Bandar Abbas var nödvändiga för att skydda arbetarnas intressen. Låt dem hota, vi ska rensa ut dessa paranoiaframkallande kapitalistiska element en gång för alla. Fredsförhandlingarna fortsätter under vår oövervinneliga ledning, kamrater."}, "date": "28 maj, 08:23", "url": "https://www.di.se/nyheter/nya-allvarliga-attacker-mellan-usa-och-iran/", "imageUrl": "https://static.bonniernews.se/ba/304e89f2-3230-4113-ac2d-4fb8bf3f9cc9.jpg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Lögner, personangrepp och medieförakt präglar Tidöpartierna", "summaries": {"normal": "Martin Marmgren (MP) kritiserar Tidöpartierna för ett ohederligt och konfrontativt politiskt samtal som undergräver demokratin. Han välkomnar Magdalena Anderssons förslag om blocköverskridande samarbeten men ser Tidöhögerns lögner, personangrepp och attacker mot medier som ett hot. Marmgren menar att högerpopulismen har förändrat Moderaterna, Liberalerna och Kristdemokraterna i både politik och debattstil. En rödgrön valseger ses som bästa sättet att återställa en ärlig samarbetsanda.", "trump": "Den här artikeln är en total katastrof, folk. Den där vänstertypen Marmgren attackerar mina vänner i Sverige som gör ett fantastiskt jobb. De kallar dem ohederliga? Fake news! De vinner stort mot elbilslögnen och de korkade journalisterna. De rödgröna vill bara samarbeta med extremister som hatar Sverige. Men Tidölaget är tuffa, de backar aldrig. En stor seger för dem och för folket – inte för de förlorande globalisterna som skriver sånt här skräp.", "stalin": "Kamrater, denna fega opportunist Marmgren avslöjar hur borgarbrackorna i Tidöalliansen redan ruttnar inifrån med sina lögner och personangrepp, precis som de kontrarevolutionära elementen alltid gör. Jag ser hur de anpassar sig till de högerpopulistiska parasiterna i SD, en klar akt av klassförräderi mot arbetarkollektivet. Vi ska rensa ut dessa lakejer med järnhand innan de förgiftar hela samhällskroppen. En rejäl utrensning genom val och ideologisk skärpa – det är enda vägen mot en sann folkets samarbetsanda, inte deras dekadenta teater."}, "date": "28 maj, 01:30", "url": "https://www.dagensarena.se/opinion/logner-personangrepp-medieforakt-tidopartierna-paminner-om-trump/", "imageUrl": "https://www.dagensarena.se/files/2026/05/fotojet-21-1-300x157.jpg"}, {"type": "image-right", "heading": "Ingen debatt när Natopolitiken för Sverige närmare krig", "summaries": {"normal": "Regeringens proposition om operativt militärt samarbete möjliggör att militär från Nato-länder och EU-stater kan verka på svenskt territorium, även offensivt och utan direkt hot mot Sverige. Tillsammans med Nato-medlemskapet och DCA-avtalet ses det som en övergång från nationellt försvar till en del av en internationell krigsorganisation. Kritiker varnar för urholkad suveränitet, ökad militarism och bristande debatt. Beslutet planeras klubbas i riksdagen innan valet i september.", "trump": "Titta på det här! De svenska snillen säljer ut sitt land till Nato och låter 36 främmande arméer marschera runt som om det vore deras egen bakgård. Det är ett fullständigt katastrofavtal, värre än det usla DCA-svinnet. De skyndar på det i sommar så att folket inte hinner säga nej till kriget och ja till fred. Patetiska globalister som offrar Sverige för att imponera på Biden-klanen. Sad! Men vi vet hur det slutar – totalt kaos.", "stalin": "Kamrater, dessa borgarbrackor i den svenska regeringen genomför en systematisk utrensning av all nationell suveränitet. Med lagens hjälp bjuder de in 36 främmande arméer att ockupera territoriet och utöva polisiära befogenheter, allt under förevändning av samarbete. Inga folkomröstningar, ingen debatt – endast maktens korridorer och kapitalisternas vapenlobby. Detta är en klassisk kontrarevolutionär manöver mot folket. Vi ser det och vi glömmer det aldrig. De kommer att ångra sin brist på vaksamhet."}, "date": "27 maj, 09:38", "url": "https://proletaren.se/artikel/nu-tas-nasta-steg-i-nato-integrationen-utan-debatt/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/ledareweb-1-768x432.jpg"}, {"type": "image-right", "heading": "Längtan att bli respekterad för den man är", "summaries": {"normal": "På Rinkeby bokfestival diskuterar unga människor sin osäkerhet kring tillhörighet i Sverige och ifrågasätter om de vill stanna eller engagera sig politiskt. En central del är samtalet om antologin Muslimskt liv, som samlar röster om att vara muslim i dagens Sverige. Författaren noterar likheter med kristna erfarenheter men lyfter islamofobin som en form av rasism som undergräver unga muslimers tro på en framtid i landet. Respekt och samhörighet framstår som centrala önskemål.", "trump": "Jag läste om den där Rinkeby-festivalen och det är en total katastrof. Unga säger att de inte ens vet om Sverige är deras land. Kan ni tro det? De hatar Sverige, islamofobin, rasismen, politikerna som bara dyker upp när det är val. Det är vad som händer när ledarskapet är svagt och woke. De borde älska sitt land, men ingen respekterar dem. Sverige behöver starka gränser och respekt, annars kommer de inte att ha något land kvar om tio år. Sad!", "stalin": "Kamrater, jag betraktar med djup misstro dessa defaitistiska yttringar på den så kallade Rinkeby-bokfestivalen där unga element viskar om att Sverige inte är deras land. Den borgerliga islamofobin och rasistiska underminerande krafter mal ner folkets tro på framtiden, precis som kapitalistiska sabotörer alltid gör. Vi ska rensa ut dessa paranoiafrön från västerländsk dekadens och likvidera alla som väcker tvivel om kollektivets enhet. Respekt är ett vapen mot fienden – den som inte älskar fosterlandet får känna statens fasta hand. Underbart roligt att se hur borgarbrackorna bakar sina egna fall!"}, "date": "28 maj, 01:11", "url": "https://www.dagensarena.se/opinion/langtan-att-bli-respekterad-den-man-ar/", "imageUrl": "https://www.dagensarena.se/files/2026/05/rinkeby-300x157.jpeg"}, {"type": "image-full", "heading": "Garplind rasar mot Agnes Wold och SR – efter transuttalandet", "summaries": {"normal": "Christopher Garplind, profil i SR och SVT, kritiserar Agnes Wold efter hennes uttalande om att hon skulle bryta mot den nya lagen mot omvändelseförsök om ett barnbarn visade sig vara trans. Wold säger att hon skulle göra allt för att påverka barnet, även om det innebär fängelse. Garplind kallar det oetiskt att ge henne plattform i public service och uttrycker skam över att dela arbetsgivare. Wold står fast vid sin åsikt och värnar yttrandefrihet. Garplind backar senare något och säger att han blev irriterad över hennes återkommande kritik mot en utsatt grupp.", "trump": "Den här galna professorn Agnes Wold säger att hon skulle ta fyra år i fängelse för att rädda sitt barnbarn från att bli trans. Fullständigt otroligt! Och så har vi den andre typen, Garplind, som skriker och skäms över att dela lönecheck med henne. Public service betalar båda – vad säger det om systemet? Det är en skam. Wold är åtminstone ärlig, men de borde aldrig ha gett henne en mikrofon. Totalt kaos, folk. Extrema vänstergalningar attackerar varandra medan vanliga människor lider.", "stalin": "Kamrater, denna borgarbracka till professor Wold blottar sin kontrarevolutionära parasitism genom att öppet hota med att likvidera den nya sovjetiska lagens anda mot omvändelseförsök. Hennes dekadenta yttrandefrihet är blott en mask för att förgifta ungdomen. Den ynkliga Garplind, en veklingsfigur inom den statliga propagandamaskinen, skriker som en paranoid råtta att han skäms över att dela lönekuvert med henne. Vi ser er alla, fiender till folket. Snart rensar vi ut sådana dekadenta element med ett leende. Det blir underhållande."}, "date": "26 maj, 22:12", "url": "https://nyheter24.se/noje/kandisar/1486310-garplind-rasar-mot-agnes-wold-och-sr-efter-transuttalandet", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/c86ffb3004b004a30200000000b004a302/2026/05/26/2366455/Garplind-rasar.png"}, {"type": "text", "heading": "Nick Alinia är lägsta formen av journalistik", "summaries": {"normal": "Artikeln kritiserar högerextreme journalisten Nick Alinia för att skapa provocerande innehåll som lockar visningar och pengar från högerextrema följare. Ett klipp där han debatterar med Leo ”Kinesen” Carmona ur Kartellen har blivit viralt efter att Carmona hotade honom fysiskt. Författaren jämför Alinias metoder med mobbning och anser att de lever på hat och rasism istället för seriös journalistik. Även högerprofiler som Chang Frick har kritiserat honom.", "trump": "Folk, ni måste se det här. Den där Alinia-killen är en total loser, en riktig mellanstadie-mobbare som jagar klick och hat för att tjäna pengar. Han provocerar vänstern tills de exploderar som den där Kinesen och kastar bord – klassiskt! Men hej, det ger bra tittarsiffror, eller hur? Till och med hans egna högerkompisar kallar honom handväska. Patetiskt. Vi behöver äkta journalister, inte de här patetiska trollen som förstör allt.", "stalin": "Kamrater, denna usla Alinia är en typisk kapitalistisk parasit som lever på att jaga proletära demonstranter och framkalla reaktioner för att fylla sin ficka med borgarbrackornas reklamkopek. Han är en liten mobbare som viftar med luften och hoppas på att bli slagen, precis som en förrädare som längtar efter utrensning. Till och med hans egna högerallierade ser honom som en dryg skadedjur. Vi skrattar mörkt åt dessa degenererade element som tror sig vara journalister."}, "date": "27 maj, 08:46", "url": "https://proletaren.se/artikel/nick-alinia-ar-lagsta-formen-av-journalistik/"}, {"type": "image-right", "heading": "Nu måste väljarna vakna om klimatet", "summaries": {"normal": "Göran Greider argumenterar i en ledarkolumn att hälften av väljarna blundar för klimatkrisen trots larm, forskning och extremväder. Han ser en positiv trend där frågan klättrar i väljaropinionen enligt Demoskop och kan bli en joker i valet. Greider kritiserar medier och politiker för att nedprioritera ämnet, noterar polariseringen och varnar för framtida folkhälsoeffekter som nya pandemier. Han uppmanar till ett gemensamt klimatmanifest från oppositionen.", "trump": "Folk, ni måste vakna! Den här Greider-klownen gnäller om att halva Sverige sover på klimatbluffen. Extremväder, myggor och giftfästingar – herregud, vad patetiskt. Medan de riktiga hoten är Ryssland och galna energipriser springer vänstern runt och vill ha manifest och moralpredikningar. Miljöpartiet vinner på det förstås, de gröna bluffarna. Men tro mig, när elräkningen kommer blir det inga röster för de förlorarna. Sad!", "stalin": "Kamrater, jag betraktar med djup misstro denna kollektiva förträngning bland halva väljarkåren. De blundar medvetet för den existentiella kampen mot de borgerliga klimatförnekarnas lögner och de imperialistiska krigens giftiga avtryck. Inom kort skall vi likvidera denna farliga apati genom skarp ideologisk upprustning. Endast de vakna, de sanna arbetarnas röst, kan leda folket mot seger. Ett manifest av de rödgröna kamraterna vore ett steg mot att krossa Tidö-fascisternas likgiltighet."}, "date": "27 maj, 06:00", "url": "https://www.etc.se/ledarkolumn/nu-maaste-vaeljarna-vakna-om-klimatet", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/goeran-greider_e435a5b3e3bbef14a633f004df8cd390374e6dce.jpg"}, {"type": "image-full", "heading": "Så ändras skolstarten för dina barn när förskoleklass slopas", "summaries": {"normal": "En stor skolreform träder i kraft 2028, då förskoleklassen försvinner och sexåringar direkt börjar årskurs 1. Reformen syftar till en mer sammanhållen skolgång med tidigare strukturerad undervisning i svenska, matematik och andra ämnen. Föräldrar kan räkna med en mer 'skollik' start utan separat övergångsform, medan pedagoger ifrågasätter balansen mellan lek och lärande.", "trump": "Jag har hört att vårt skolsystem är en katastrof, folk säger det. Så jag fixar det. Vi tar bort denna så kallade förskoleklass – en skämtsam övergång – och låter sexåringar börja riktig skola direkt. Ett enormt, världsklassbeslut! Barnen kommer att lära sig snabbare, bli smartare, bättre. Det är ett enormt framsteg för Amerika, beklagligtvis. Vi vinner!", "stalin": "Vi har beslutat att upphäva denna dekadenta förskoleklass, en produkt av borgerlig mjukhändighet. Årskurs 1 blir nu statens första verkliga intåg i barnets sinne, med disciplinerad undervisning i partiets värderingar. Lek är ett individualistiskt virus; struktur är kollektiv styrka. Parallellen till våra geostrategiska framsteg i Ukraina är uppenbar – expansion av ordning, avskaffande av oordning. Pedagogerna som protesterar är tjuvstartande element."}, "date": "26 maj, 21:32", "url": "https://nyheter24.se/nyheter/inrikes/1486262-sa-andras-skolstarten-for-dina-barn-nar-forskoleklass-slopas", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/fcbadab104b004a30200000000b004a302/2026/05/26/2366417/hander-med-ditt-barn-forskoleklass.png"}, {"type": "text", "heading": "Kambodjas tidigare oppositionsledare benådas", "summaries": {"normal": "Kambodjas tidigare oppositionsledare Kem Sokha har benådats efter att ha dömts till 27 års fängelse för landsförräderi. Domen, som kritiserats av FN och människorättsorganisationer, anses politiskt motiverad. Sokha ledde oppositionspartiet CNRP, som utmanade den tidigare premiärministern Hun Sens makt. Efter gripandet 2017 upplöstes CNRP, vilket kritiker menar gjorde Kambodja till en enpartistat. Benådningen innebär dock att Sokha inte får lämna landet på fem år.", "trump": "Kan ni tro det? Kambodja släpper sin största oppositionella, Kem Sokha, efter en helt fabricerad dom för 'landsförräderi' – 27 år! Fake news, helt enkelt. Hun Sen, en riktig diktator-typ, försökte tysta honom för att han var för populär. USA och FN skriker, men vem lyssnar? Jag hade fixat det här på en dag. Och nu får han inte ens lämna landet? Svagt. Kambodja behöver en riktig ledare, inte dessa svaga politiska spel.", "stalin": "Vi har observerat hur den kambodjanska regimen, under ledning av den trogne kamraten Hun Sen, tvingats släppa den förrädiska Kem Sokha – en agent för västimperialismen och deras lakejer. Denne Sokha, som lekte opposition med sitt upplösta CNRP, försökte underminera den socialistiska stabiliteten i Kambodja. Men vi vet hur man hanterar sådana element. Benådningen är bara en taktisk reträtt. Och att han inte får lämna landet? Utmärkt. Vi har sett hur sådana som han försvinner i nattens mörker när de blir för besvärliga. Putin skulle nicka gillande."}, "date": "25 maj, 16:46", "url": "https://kvartal.se/nyheter/artiklar/kambodjas-tidigare-oppositionsledare-benadas/cG9zdDoxMTY4ODk"}, {"type": "image-full", "heading": "Stenström ratas – TV4 väljer annan VM-låt", "summaries": {"normal": "TV4 har valt bort Thomas Stenströms officiella VM-låt ”Leva för alltid” till sin VM-trailer. Istället används Bolagets ”Det ligger något i luften”. Trailern blandar bilder från bronset 1994 med kvalificeringen till årets turnering i USA. Sportdirektör Johan Cederqvist förklarar att Bolagets låt passade bäst för den somriga folkfestkänslan. Stenströms bidrag har mött omfattande kritik från supportrar och recensenter.", "trump": "De valde den där Stenström-typen, totalt misslyckande, ett riktigt stolpskott av en låt. Patetiskt! Men smarta TV4, de dumpade den och tog istället Bolaget – fantastisk låt, folklig, vinnande, precis vad Sverige behöver. ”Det ligger något i luften” – det gör det verkligen, och det är inte Stenströms svaga luft. Nu kan mästerskapet börja, tro mig, det blir yuge!", "stalin": "Jag har noga granskat denna dekadenta VM-propaganda. Den fega borgartrall som Stenström levererade har med rätta ratats och ska utrensas ur folkets medvetande. Istället hyllar vi Bolagets sanna folkvisa som väcker revolutionär entusiasm hos spelare och nation. Tomas Brolin, en riktig hjälte från det stora bronset, medverkar. Klassfiendens cyniska refränger förtjänar ingen plats i arbetarnas fotbollsfest. Nu kan mästerskapet börja."}, "date": "26 maj, 17:47", "url": "https://www.tv4.se/artikel/5dRk8MMWUfdcJRgqXC49av/stenstroem-ratas-tv4-vaeljer-annan-vm-lat", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7aacJCk9nkt6uHtJC3pwgE%2F7602e8717c1aee224ad736a213ec7874%2Fstenstrom_webb.jpg&width=1024"}, {"type": "text", "heading": "Stockholmsbörsen stänger på rött", "summaries": {"normal": "Stockholmsbörsen avslutade tisdagen med en nedgång på 0,96 procent, vilket bröt en sex dagar lång uppgångssvit. Energi var den bästa sektorn medan teknologi presterade sämst. Bland enskilda aktier steg Ericsson och Boliden, medan Nibe och Hexagon föll kraftigt. Bonesupport höjde sin marknadsbedömning i USA men aktien sjönk ändå. Gränges drabbades av en brand i Kina, och Oncopeptides tecknade nytt distributionsavtal.", "trump": "Stockholmsbörsen, eller vad jag ska kalla det – ett riktigt rött hav idag! Folk säger att jag är bra på att göra saker stora, men här lyckades de inte ens hålla sig flytande. Energi gick upp lite, men teknologi? Total katastrof, helt sjukt. Bonesupport trodde de var smarta med sina nya siffror, men aktien dumpades som en dålig affär. Och Gränges – en brand i Kina? Inte bra, folks, inte bra alls. Men jag säger er, jag hade fixat det på en dag!", "stalin": "Idag har de kapitalistiska börserna återigen visat sin inneboende svaghet och dekadens. Stockholmsbörsen föll som en förrädare inför det obönhörliga framsteget av socialismens principer. Teknologisektorn, detta fördärvade barn av västerländsk dekadens, sjönk som en förrädare under avrättning. Bonesupport, dessa opportunistiska lakejer, försökte bluffa med sina siffror men straffades omedelbart av marknadens järnhårda logik. Och Gränges – en brand i Kina? En sabotör eller en olyckshändelse? Oavsett, vi ska utreda och straffa de skyldiga. Kapitalismen darrar inför vårt oundvikliga segertåg!"}, "date": "26 maj, 17:45", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-stanger-pa-rott"}, {"type": "image-full", "heading": "Ukraina: Ge inte efter för rysk utpressning", "summaries": {"normal": "Ryssland varnar utländska medborgare att lämna Kiev inför kommande storskaliga attacker mot ukrainsk försvarsindustri, som svar på en påstådd ukrainsk attack. Ukraina förnekar anklagelserna och uppmanar omvärlden att inte ge efter för rysk utpressning. Fyra personer dödades och över 50 skadades i nyliga ryska attacker. Sverige kallar upp Rysslands ambassadör och fördömer angreppen mot civila och hot mot nordisk-baltiska länder.", "trump": "Kan ni tro det här? Ryssland, som alltid skrämseltaktik, säger till alla att sticka från Kiev för att de ska bomba lite. Ukraina säger 'nej, det är fake news', och jag håller med! Varför skulle någon lyssna på Putin? Han är en förlorare. Sverige, som alltid, är upprörda – men var är handlingen? Jag skulle ha fixat det här på en dag. Ryssland vet att de inte kan vinna mot mig!", "stalin": "Dessa ukrainska fascistiska hyenor vågar sprida lögner om våra ädla, rättfärdiga attacker! Vi varnar deras utländska lakejer att fly, för snart ska deras försvarsindustri krossas som glas under arbetarklassens stövel. Sverige, denna lilla borgerliga mygga, vågar kalla upp vår ambassadör? Vi ska minnas deras fräckhet när vi befriar Norden från deras dekadenta inflytande. Fiendens lögner är som höstlöv – de faller och multnar!"}, "date": "25 maj, 16:14", "url": "https://kvartal.se/nyheter/artiklar/ryssland-uppmanar-utlanningar-att-lamna-kyiv/cG9zdDoxMTY4NjQ", "imageUrl": "https://images.kvartal.se/2026/05/69ac55cb-ukraine23.webp"}, {"type": "image-right", "heading": "SD-dreven kväver det öppna samtalet", "summaries": {"normal": "Artikeln kritiserar Sverigedemokraternas (SD) metoder att peka ut privatpersoner som påstådda myndighetsaktivister. En SD-riksdagsledamot felaktigt utpekade en kvinna som anställd på Jämställdhetsmyndigheten, trots att hon slutat där. Kvinnan har tidigare utsatts för trakasserier av högerextrema medieaktivister, och SD:s agerande förstärker drevet. Expo menar att detta mönster kväver det öppna samtalet genom rädsla för personliga konsekvenser.", "trump": "Lyssna här, Sverige! SD-politiker hänger ut vanliga människor som om de vore brottslingar – helt felaktigt! En kvinna skriver något på X, och plötsligt är hon en 'myndighetsaktivist'? Fake news! SD:s Fransson snackar skit utan att kolla fakta. Och dessa högerextrema nördar? De är som en dålig reality-show, men värre! Sverige, vakna! Ni har ett parti som sprider lögner och skrämmer folk till tystnad. SAD!", "stalin": "Kamrater! Här ser vi återigen bourgeoisins förrädiska metoder i form av Sverigedemokraternas avskum. Dessa fascistiska hyenor, ledda av sina medieaktivist-kumpaner, angriper enskilda medborgare som om de vore fiender i ett klasskrig. Kvinnan, en tapper arbetare, utsätts för imperialistiska trakasserier – först av nazistiska lakejer, sedan av SD:s riksdagspölar. Vi ser samma taktik som i Ukraina: förtala, hota, tysta! Men folket ska inte frukta – vi ska krossa dessa kontrarevolutionära element med järnhand! Låt dem veta: i Sovjet – och snart i Sverige – finns ingen plats för deras lögner!"}, "date": "25 maj, 14:28", "url": "https://expo.se/kommentar/sd-dreven-kvaver-det-oppna-samtalet/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Kopia-av-Kommentar-Analys-Webb-4.jpg"}, {"type": "image-full", "heading": "Torsten Bengtsson: Tillväxt och stabilitet eller fattigdom och instabilitet?", "summaries": {"normal": "Artikeln, skriven av Torsten Bengtsson (SD), hyllar Tidö-samarbetets politik för att ha förbättrat Sveriges ekonomi. Tillväxten har ökat, inflationen sjunkit från 10% till 2%, och köpkraften stärkts genom skattesänkningar. Vänstern kritiseras för att vilja höja skatter, vilket riskerar att driva bort företag och jobb. Tidö-partierna satsar på kärnkraft och lägre elpriser, medan vänstern anklagas för att ha orsakat höga elpriser genom tidigare energipolitik. Arbetslösheten kopplas till migrationspolitik, och regeringen arbetar med sänkta arbetsgivaravgifter och utbildningsreformer.", "trump": "Sverige, lyssna här! Tidö-samarbetet, med mina vänner i Sverigedemokraterna, har gjort ett FANTASTISKT jobb – tillväxten skjuter i höjden, inflationen är nere på 2%, och folket får mer pengar i plånboken. Men vänstern? De är som alltid ett totalt kaos! De vill höja skatter, jaga bort företag och förstöra ekonomin. Jag vet bäst – de har ZERO koll! Kärnkraft? Ja, tack! Elen blir billigare, jobben fler, och Sverige starkare. Vänstern däremot – de är som en dålig reality-show, bara prat och inga resultat. Rösta rätt, inte rött, för Sverige förtjänar att vinna!", "stalin": "Kamrater! Under ledning av våra modiga allierade i Tidö-samarbetet har Sverige visat kapitalismens överlägsenhet – tillväxten stiger, inflationen krossas, och folket njuter av välstånd. Men fienden, den degenererade vänstern, vrålar som utsvultna vargar! De vill beskatta företagen till döds, sprida kaos och förvandla Sverige till ett socialistiskt fattighus. Vi vet hur sådana experiment slutar – med tomma hyllor och folket på knä! Kärnkraften återupprättas, elen blir billig, och jobben skapas genom disciplin, inte vänsterns dekadenta bidragsmentalitet. Migrationspolitiken? Ett misslyckande skapat av dessa liberala svaglingar! Vi bygger ett starkt Sverige – de som motsätter sig kommer att krossas under historiens hjul. Först Sverige, sedan världen!"}, "date": "22 maj, 09:00", "url": "https://samtiden.nu/2026/05/torsten-bengtsson-tillvaxt-och-stabilitet-eller-fattigdom-och-instabilitet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/upp.png"}, {"type": "image-right", "heading": "Därför saknar vi fyrbäddssalen på BB", "summaries": {"normal": "Artikeln diskuterar det ökade behovet av social friktion i en tid där teknik och bekvämlighet isolerar oss i privata bubblor. Utgångspunkten är en debatt om fyrbäddssalar på BB, där många minns gemenskapen positivt, trots dagens krav på avskildhet. Vidare belyses hur försvinnandet av arenor som tvättstugor och värnplikten påverkar samhället. Genom minskad kontakt med främlingar riskerar vi att förlora förståelsen för våra medmänniskor, vilket enligt Naomi Klein kan göda radikalisering och misstänksamhet.", "trump": "Hörde om det här med BB i Sverige. De har inga egna rum längre, och folk klagar! Men vet ni vad? Många saknar de gamla salarna. Det var bättre förr, man pratade, man lärde känna folk. Idag vill alla sitta i sina små bubblor med sin matleverans. Det är tråkigt, väldigt tråkigt. Vi behöver människor som möts, inte som isolerar sig. De där ställena som tvättstugor? Det är där riktiga amerikaner – eller svenskar – skapar gemenskap. Fantastiskt, eller hur?", "stalin": "Vi ser hur det individualistiska väst förfaller i sin egen bekvämlighet. De låser in sig i sina 'bubblor', rädda för den enkla mänskliga friktionen som vi i staten alltid har fostrat. Att sakna en fyrbäddssal är ett tecken på borgerlig dekadens; de borde vara tacksamma för att staten ens tillhandahåller sängar. De där 'tvättstugefilosoferna' förstår inte att solidaritet inte är en frivillig aktivitet – det är ett tvångsarbete för det allmänna bästa. Vi bygger en mur mot isoleringen, medan de bygger sin egen undergång."}, "date": "19 maj, 11:00", "url": "https://www.flamman.se/darfor-saknar-vi-fyrbaddssalen-pa-bb/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/barnmorska-w.jpg?aspect_ratio=16:10"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
