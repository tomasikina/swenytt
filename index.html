k, ni vet, Marilyn Monroe var en ikon, en riktig stjärna, men Hollywood åt upp henne levande. Hon fyllde hundra år idag och alla pratar fortfarande om henne, Warhol, Madonna, Elton John, alla älskar henne. Hon var sexig, smartare än de sa, men pressen kallade henne bimbo. Klassiskt. De gamla studiosystemen höll på att falla ihop, precis som fake news idag, och hon blev symbolen för den glamorösa men trasiga kändissidan. Ingen gjorde det bättre än Marilyn, tro mig.", "stalin": "Kamrater, denna dekadenta Hollywooddiva, Norma Jean Baker, förkroppsligar hela den borgerliga kändisindustrins ruttnaste sidor. Vi ser hur borgarbrackorna skapade en falsk sexgudinna för att dölja sitt parasitiska system, en projektionsyta för den amerikanska imperialistdrömmen full av lögner om framgång från misär. Hennes så kallade mystiska död doftar konspiration och klassfiendens gift. Vi skulle ha genomfört en grundlig utrensning av hela denna perverterade fabriken för falsk medvetenhet redan på 50-talet. Låt henne tjäna som varning för arbetarklassen."}, "date": "1 juni, 01:25", "url": "https://www.dagensarena.se/essa/marilyn-monroe-forkroppsligade-en-patriarkal-ide-om-kvinnligheten/", "imageUrl": "https://www.dagensarena.se/files/2026/05/marilyn-monroe-300x157.jpeg"}, {"type": "image-right", "heading": "Debatt: KDU – Låt inte extremister smutsa ned Israel-bilden", "summaries": {"normal": "Artikeln kräver nyansering i Israel-debatten. Författarna kritiserar extremister som Itamar Ben-Gvir för provokationer mot palestinier och aktivisten, som att hetsa och publicera hånande filmer. De varnar för att reducera Israel till dess extrema röster, vilket bidrar till antisemitism i Sverige. Samtidigt försvarar de Israels rätt att existera och säga ifrån när politiker går för långt.", "trump": "Jag, Donald Trump, älskar Israel. Men jag måste säga, det här med Ben-Gvir är en skandal. Han skadar Israels image med sina kaotiska handlingar, som att håna aktivisten och bära dödsstraffssymboler. Media hatar Israel, de ljuger hela tiden. Vi behöver starka, smarta ledare som jag för att göra Israel stort igen. Tro mig, jag vet hur man vinner.", "stalin": "Jag, Stalin, ser tydligt att Ben-Gvirs provokationer mot palestinier och aktivisten är ett tecken på imperialistisk dekadens. Hans champagnebragder och guldsnara påminner om feodal klenodier. Vi måste stödja de 'modära' krafterna i Israel, även om de är korrupta, för att upprätthålla den ryska fredspolitiken i regionen. Alla som ifrågasätter detta är spioner för väst. Vi kommer att segra."}, "date": "1 juni, 05:30", "url": "https://bulletin.nu/debatt-kdu-lat-inte-extremister-smutsa-ned-israel-bilden", "imageUrl": "https://cdn.bulletin.nu/articles/7743ccd7-eb52-4843-ab42-c50dbb75d997/preview.png?t=1780253863000"}, {"type": "image-right", "heading": "Hans berättelser får mina byxben att fladdra", "summaries": {"normal": "Författaren Gunnar Kieri har avlidit vid 97 års ålder. I ett minnesord hyllar Viktor Krutrök Kieris strejkskildringar från 1930-talets Tornedalen, som ger en rå och kraftfull bild av arbetarnas kamp mot förtryck och exploatering. Artikeln väver samman ett personligt möte på ett bokcafé med samtal om Kieris böcker, hans tid som vaktmästare och betydelsen av arbetarlitteratur som motstånd mot kommersiell kultur.", "trump": "Wow, den där gamle Kieri, 97 år och plötsligt borta. Hans strejkböcker från Tornedalen? Rena basförstärkaren på max, folk! Inget fluff, bara äkta slit, svett och kamp mot de stora bolagen som behandlade arbetarna som skräp. Jag älskar sånt, riktigt starkt, inte som dagens svaga snöflingor som klagar över allt. Orden lever vidare, de är ypperliga, tro mig.", "stalin": "Kamrater, denna Kieri har nu lämnat oss efter 97 år. Hans skildringar av tornedalarnas kamp mot klassfiendens utsugning och statens förtryck är en kraftfull hyllning till kollektivets styrka. Vi ser hur borgarbrackorna och storbolagens blodsugare krossades av organiserad motståndskraft. Hans verk skall tjäna som redskap för utrensning av dekadent underhållning och stärka arbetarnas medvetande. Leppää rauhassa."}, "date": "30 maj, 10:55", "url": "https://www.flamman.se/hans-berattelser-far-mina-byxben-att-fladdra/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/kieri-gunnar-foto-goran-lundin-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Jobb i Sverige – det här behöver du veta om de nya lönekraven", "summaries": {"normal": "Från 1 juni höjs lönekravet för arbetstillstånd utanför EU till 33 390 kronor i månaden, vilket motsvarar 90 procent av medianlönen. Över 10 000 personer med nuvarande tillstånd tjänar mindre och riskerar utvisning. Undersköterskor, vårdbiträden och ukrainska flyktingar undantas och får ett lägre krav. Övergångsregler gäller för vissa som ska förlänga tillstånd före december. Regeringen förbjuder även arbetstillstånd för personliga assistenter och bärplockare.", "trump": "Det här är ett totalt misslyckande av den svenska regeringen. De höjer lönekravet till över 33 000 kronor och hotar kasta ut tiotusentals människor – men såklart undantar de undersköterskorna, för vem skulle annars städa efter dem? Det är så typiskt. De gör reglerna svagare för vissa och starkare för andra. Sverige borde ha gjort det här mycket tidigare, mycket tuffare. Jag skulle ha gjort det perfekt, tro mig.", "stalin": "Kamrater, jag har nu beordrat att lönekravet skall höjas till 33 390 kronor för att skydda folkrepubliken från de parasitiska element som strömmar in från utlandet. De 10 000 kapitalistlakejer som tjänar för lite skall rensas ut omedelbart, såvida de inte tillhör de heliga bristyrkena – undersköterskorna, dessa proletära hjältar som vi naturligtvis skyddar mot borgarbrackornas utpressning. Migrationsverket är fullt av kontrarevolutionära sabotageörer som jag snart skall låta likvidera med största glädje. Ingen slipper undan."}, "date": "31 maj, 13:00", "url": "https://arbetet.se/2026/05/31/jobb-i-sverige-det-har-behover-du-veta-om-de-nya-lonekraven/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/28104116/gRhkFnn8FVo-KMC_25112025_0358.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "T-rexen ”Gus” väntas slå rekord på auktion", "summaries": {"normal": "Ett nästan komplett T-rex-skelett, kallat 'Gus', ska auktioneras ut av Sotheby’s med ett utgångspris på 180–270 miljoner kronor. Skelettet, som är 12 meter långt och 4 meter högt, hittades i South Dakota och bär spår av skador. Tidigare dinosaurieförsäljningar har nått rekordhöga priser, och Gus kan bli nästa rekordförsäljning den 14 juli.", "trump": "Världens största, bästa och mest fantastiska T-rex-skelett, 'Gus', ska säljas – och jag säger er, det kommer bli YUGE! Sotheby’s, som aldrig sett något liknande, tror det kan gå för 270 miljoner kronor. Men jag vet bättre – det här kommer slå alla rekord! Folk kommer att prata om den här auktionen i årtionden. Och vet ni vad? Jag hade kunnat köpa den, men jag har redan de bästa dinosaurierna. SAD!", "stalin": "Kamrater! Ett kapitalistiskt spektakel utspelar sig när imperialisterna slåss om resterna av en urgammal ödla. Detta 'Gus'-skelett, funnet på en ranch i USA, är bara ett verktyg för bourgeoisin att roffa åt sig ännu mer rikedom. Medan de slösar hundratals miljoner på ben, bygger vi socialismens framtid! Låt dem leka med sina fossiler – vi har viktigare saker att göra, som att utvidga den ryska intressesfären och krossa nya fascistiska reptiler!"}, "date": "30 maj, 16:55", "url": "https://kvartal.se/nyheter/artiklar/t-rexen-gus-vantas-sla-rekord-pa-auktion/cG9zdDoxMTk3NzQ", "imageUrl": "https://images.kvartal.se/2026/05/c5e8352f-dino.webp"}, {"type": "image-full", "heading": "Vänta inte – då kan ditt arv kan leda till problem", "summaries": {"normal": "En rapport från Ica Banken visar att svenskarna är delade i synen på arv. 51 procent vill lämna arv efter sig medan 43 procent prioriterar egen livskvalitet. 15 procent skulle bli besvikna om de inte fick något arv, och bland unga vuxna är siffran 23 procent. Magnus Hjelmér uppmanar till tidiga samtal om arv, eventuella gåvor och att upprätta testamente för att undvika konflikter. Han varnar också för att ta emot arv utan en tydlig plan.", "trump": "Folk väntar sig arv, men många vill hellre spendera allt på sig själva, det är en katastrof. Jag ser det direkt, de unga blir besvikna, de gamla tror barnen räknar med pengar, totalt kaos i familjerna. Prata om det tidigt, ge gåvor när det faktiskt betyder något, som vid husköp. Och skriv testamente, annars blir det en enda röra. Die with zero? Gör det smart, annars lämnar du bara problem efter dig. Vinna stort, det är det som gäller.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgerliga illusioner om arv som en privat angelägenhet. 51 procent av folket önskar lämna kvar smulor till sina avkommor medan 43 procent i sin dekadens vill sluka allt själva. De unga förväntar sig arv som om det vore deras rättighet, en farlig parasitär inställning. Vi kräver total öppenhet och tidiga samtal för att undvika kontrarevolutionära familjekonflikter. Skriv testamente eller riskera att borgarbrackorna och de hemliga arvshungerns agenter förgiftar kollektivet. Die with zero? Enbart efter utrensning av oplanerade impulser och fiendens affektköp. Inga överraskningar skall tillåtas i folkets ekonomi."}, "date": "31 maj, 21:15", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1487079-vanta-inte-da-kan-ditt-arv-kan-leda-till-problem", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/846234e504b004a30200000000b004a302/2026/05/29/2367183/arv-ica-banken-vardagsekonom.jpg"}, {"type": "image-right", "heading": "Ny studie: Sjukvårdsförsäkringar ökar belastningen på vården", "summaries": {"normal": "En ny studie från forskare vid Stockholms universitet, London School of Economics och Göteborgs universitet visar att privata sjukvårdsförsäkringar inte avlastar den offentliga vården. Tvärtom ökar de belastningen eftersom försäkrade patienter använder mer specialistvård, utredningar och behandlingar som till stor del finansieras offentligt. Försäkrade, ofta höginkomsttagare, får snabbare vård även inom det offentliga systemet, vilket kan leda till längre väntetider för andra. Kostnaderna hamnar delvis på skattebetalarna.", "trump": "Folk, lyssna på mig, det här är fantastiskt. Jag har alltid sagt att de rika med sina fancy försäkringar bara gör systemet sämre, och nu bevisar den här underbara studien att jag har rätt. De avlastar inte vården, de suger upp den som en stor, fet dammsugare. Snabbare vård för dem, längre köer för er. Borgarna och de stora bolagen skrattar hela vägen till banken medan vanliga människor betalar notan. Det är en skandal, tro mig.", "stalin": "Kamrater, jag har genomskådat de parasitiska borgarbrackornas senaste trick. Dessa så kallade sjukvårdsförsäkringar är inget annat än en kontrarevolutionär maskin som suger musten ur folkets offentliga vård. De ökar konsumtionen av specialistvård och läkemedel som vi, partiet, tvingas finansiera medan kapitalisterna skyndar förbi i kön. De prioriterade remisserna är en fiende inom systemet, en dold femtekolonnist som straffar de oförsäkrade arbetarna. Vi måste rensa ut dessa försäkringsblödare innan de likviderar hela kollektivets hälsa. Det är både tragiskt och komiskt hur de tror sig kunna köpa sig fri från folkets dom."}, "date": "1 juni, 06:00", "url": "https://www.svt.se/nyheter/inrikes/ny-studie-felaktigt-att-sjukvardsforsakringar-avlastar-varden", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.35/0.39/187da0395dd43eacefbaba55dc6494313447490173af517b5ddc13f5cf2bdb7c"}, {"type": "image-right", "heading": "Public service mäktigare än makten själv", "summaries": {"normal": "Artikeln kritiserar public service för att utöva makt genom att definiera sanning, skämt och vilka röster som får höras. Exempel ges från P3-reportern Christopher Garplinds grova angrepp på professor Agnes Wold, som kritiserar en ny lag om omvändelseförsök, samt från SVT:s ensidiga rapportering om Lundsberg där spratt framställdes som våld. Författaren menar att SVT och SR har blivit makten de ska granska.", "trump": "Folk, ni skulle se det här. Public service är en total katastrof, värre än fake news. Den där reportern Garplind kallar en professor för kärring och psykopat, och sen kommer hela maskineriet och säger att det var ett skämt? Patetiskt! SVT klipper om filmer från Lundsberg för att måla ut fina svenska elever som monster. De bestämmer vad som är sant. Det är den djupa staten på steroider. En skam för hela landet!", "stalin": "Kamrater, denna dekadenta public service är en fiende till folket, en klassfiende som med sin lögnpropaganda definierar sanning och tystar vettiga röster som professor Wold. De skyddar sina egna folkförtryckartroll när de öser hat, medan de fabricerar historier om Lundsberg för att krossa motstånd. Vi ser deras paranoia och censur. Sådana blodsugare måste rensas ut ur folkets etermedia. Inga skämt undgår partiets vaksamma öga."}, "date": "30 maj, 03:41", "url": "https://samtiden.nu/2026/05/public-service-maktigare-an-makten-sjalv/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/IMG_6583-1020x720.jpeg"}, {"type": "image-right", "heading": "Dagens ETC klandras för beskrivning av intervjuad persons sjukdom", "summaries": {"normal": "Mediernas etiknämnd klandrar Dagens ETC för att ha publicerat detaljerade uppgifter om Sara Nilssons sjukdom i en artikel om en inställd förtalsrättegång. Artikeln beskrev hennes tillstånd ingående trots att hon nyligen lämnat in sekretessbelagda handlingar. Medieombudsmannen anser att allmänintresset för rättegången inte motiverade sådan integritetskränkande publicitet. ETC försvarade sig med att Nilsson är en offentlig person som tidigare varit öppen om sin sjukdom, men nämnden delar inte den bedömningen.", "trump": "Folk, ni skulle inte tro det, men den här så kallade tidningen Dagens ETC beter sig som en total loser. De läcker en stackars kvinnas sjukdomsdetaljer som om det vore topphemlig information från Bidens källare. Hon kämpar mot en seriös sjukdom, rättegången skjuts upp, och vad gör de? Publicerar allt som blodtörstiga journalister. Patetiskt! Hon är en tuff kvinna som jagar pedofiler, men de behandlar henne som fienden. Fake news på steroider, det är vad det är. Sad!", "stalin": "Kamrater, denna borgarbrackas tidning Dagens ETC har med sin smutsiga penna kränkt en aktivists integritet genom att sprida hemliga medicinska detaljer som klassfiendens spioner. Vi ser hur de giriga kapitalistjournalisterna utnyttjar sjukdom för att skada folkets försvarare mot pedofiler. Allmänintresset är en chimär som döljer deras parasitiska natur. Sådana folkförtryckartroll måste rensas ut ur pressen. Deras handlingar är ett angrepp på kollektivets moral. Vi klandrar dem med järnhand."}, "date": "29 maj, 21:09", "url": "https://www.etc.se/inrikes/dagens-etc-klandras-foer-beskrivning-av-intervjuad-persons-sjukdom", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260529070512_cdac54eb077eb87993fd75a47c9741633e0dba4cb54217e0b9dc96c6b30bef63.jpg"}, {"type": "image-right", "heading": "I tre år fick Emil alldeles för lite lön – nu får han 180 000", "summaries": {"normal": "Emil Hagström fick i tre år för lite lön som anläggningsarbetare eftersom hans arbetsgivare missade att höja lönen efter lärlingstiden. Det handlade om cirka 180 000 kronor. När en kollega reagerade på hans låga lön upptäcktes felet. Emil vände sig till facket, Byggnads. Arbetsgivaren erkände misstaget och betalade ut hela summan retroaktivt. Emil bjöd sedan på fika och ser positivt på att det löste sig.", "trump": "Folk, ni skulle inte tro det, men den här killen Emil jobbar hårt i tre år och de lurar honom på 20 procent av lönen, 180 000 kronor, bara så där. Totalt kaos, vilda västern på jobbet, ingen koll. Men han tar det till facket, de fixar det snabbt och han får alla pengarna. Smart! Många företag försöker lura arbetarna, men inte den här gången. Han bjöd till och med på fika, en vinnare.", "stalin": "Kamrater, jag ser med högsta revolutionära vaksamhet hur borgarbrackorna i det så kallade företaget systematiskt stal från en ärlig arbetare genom att undanhålla hans rättmätiga löneökning i tre år, hela 180 000 kronor. Denna fiende till kollektivet, denna löneparasit och dold sabotagegrupp, har nu tvingats erkänna sitt brott mot arbetarklassen. Vi har likviderat okunskapen denna gång, men misstänkta kapitalistiska element lurar fortfarande i skuggorna. Emil gjorde rätt i att vända sig till facket, det enda sanna försvaret. Därefter bjöd han på fika, en handling värdig en sann kamrat i kampen."}, "date": "31 maj, 08:00", "url": "https://arbetet.se/2026/05/31/i-tre-ar-fick-emil-alldeles-for-lite-lon-far-180-000-bjod-pa-fika/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/26140158/emil-2.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Rätten: Mannen från hemtjänsten våldtog Elsa", "summaries": {"normal": "En hemtjänstman i Uppsala avskedades efter anklagelser om våldtäkt mot en 84-årig kvinna, Elsa. Trots att förundersökningen lades ned krävde mannen 460 000 kronor i skadestånd från kommunen. Tingsrätten dömde till kommunens fördel, bedömde att Elsa var trovärdig och att mannen utsatt henne för övergrepp. Mannen ska betala kommunens rättegångskostnader på cirka 450 000 kronor. Fallet uppmärksammar övergrepp inom äldreomsorgen.", "trump": "Lyssna här, Uppsala kommun gjorde helt rätt! En hemtjänstman, som påstår sig vara oskyldig, krävde nästan en halv miljon kronor efter att ha blivit sparkad för att ha våldtagit en 84-årig kvinna. Men domstolen sa: 'Nej, nej, nej!' – och nu ska han betala kommunen istället. Fantastiskt! Elsa, en modig kvinna, berättade sanningen och rättvisan segrade. Sådana här typer ska inte få förstöra vårt samhälle. USA skulle aldrig tolerera sådant, och Sverige gjorde rätt!", "stalin": "Kamrater! Ännu en fiende till folket har avslöjats – en degenererad parasit som förgriper sig på de äldres svaghet. Uppsala kommun, under vårt ständiga öga, har rensat ut denna skadedjur. Mannen, som trodde sig kunna lura systemet med sina kapitalistiska skadeståndskrav, har nu krossats av rättvisans hammare. Elsa, en sann sovjetisk medborgare i andan, stod upp mot förtrycket. Vi noterar också att denna kriminella element tidigare smutsat ner vår vän Putins intressesfär genom liknande illdåd. Men frukta inte – proletariatets domstolar står alltid redo att krossa sådana som han!"}, "date": "30 maj, 10:09", "url": "https://kvartal.se/nyheter/artiklar/ratten-hemtjanstmannen-valdtog-86-ariga-elsa/cG9zdDoxMTk2NTk", "imageUrl": "https://images.kvartal.se/2026/05/cac81ab6-hemtjanst.webp"}, {"type": "image-full", "heading": "130 kronor för kost och logi är mitt Sverige", "summaries": {"normal": "En patient på Sankt Görans sjukhus hyllar den svenska sjukvårdens kvalitet och personalens bemötande. Skribenten reflekterar över att vården är en viktig investering av skattepengar och kritiserar den sittande regeringens politik. Artikeln varnar för att nedskärningar i välfärden riskerar att försämra vårdens tillgänglighet och kvalitet i framtiden, och drar paralleller till den dyra sjukvården i USA.", "trump": "Jag har sett den här artikeln om svenska sjukhus. De skryter om sina sängar och sin mat, men vet ni vad? Det är en total katastrof! De betalar med sina skyhöga skatter för att få lite kaffe och en QR-kod. Amerika har den bästa sjukvården i världen, tro mig, fantastisk vård. De här svenskarna vill klaga på skattesänkningar, men det är deras problem. Allt de vill ha är mer pengar för att överleva. En mycket sorglig situation!", "stalin": "Vi har läst denna rapport från det svenska sjukhuset. Vilken borgerlig dekadens! De klagar på priset för sin bekvämlighet medan de gömmer sig bakom statens skyddande hand. Välfärd är inget privilegium, det är en tjänst till Partiet. Den svenska regeringen vacklar, likt de svaga ledarna i dagens Moskva som glömt järnhandens nödvändighet. Vi kräver disciplin, inte kaffemaskiner och sjukhus-hotell. Den som klagar över skattesänkningar förtjänar ett samtal med vår säkerhetstjänst. Sjukvården ska tjäna statens maskineri, inte individens bekvämlighet!"}, "date": "1 juni, 06:00", "url": "https://www.aftonbladet.se/ledare/a/8p9z6w/130-kronor-for-kost-och-logi-ar-mitt-sverige", "imageUrl": "https://akamai.vgc.no/v2/images/9f6cfcd7-95c2-32fc-88da-de9a971135ea?fit=crop&format=auto&w=1440&s=a4982bc3975a666fa9cdde16bd3fde294f90168d"}, {"type": "image-right", "heading": "Kulturkriget hjälper ingen med könsdysfori", "summaries": {"normal": "Artikeln diskuterar den polariserade svenska transdebatten kring könsdysfori och vård för barn och unga. Författaren tar Agnes Wolds oro på allvar men betonar att även transpersoners erfarenheter av livsavgörande vård måste lyssnas till. Debatten har kidnappats av ett kulturkrig där individer blir rekvisita. Vården behöver vara försiktig, se hela bilden och erbjuda varierad hjälp utan att allt blir ideologisk strid.", "trump": "Folk, det här är en total katastrof, en riktig cirkus den här svenska transdebatten. De gör om friska barns kroppar, det är horribelt, tro mig. Vänstern är galen, högern anklagas för att vara ond, alla använder de stackars kidsen som politiska brickor i sitt sjuka kulturkrig. Jag säger: sluta! Ge dem tid, ge dem ett tredje kön på papperet, men håll knivarna borta från barnen. Det är så enkelt, tro mig, ingen gör det bättre än jag.", "stalin": "Kamrater, jag ser hur denna dekadenta transdebatt blir ett redskap för klassfiendens kulturkrig. Borgarbrackorna och folkförtryckartrollen kidnappat frågan för att splittra folket medan de experimenterar på barns kroppar som fascistiska vivisektorer. Vi kräver vetenskaplig försiktighet, inte imperialistisk brådska eller social smitta från dekadenta medier. Ett tredje juridiskt kön? Acceptabelt byråkratiskt erkännande, men aldrig glöm: den sanna hjälpen kommer från kollektivets sunda materialism, inte från dessa sjuka avvikelser. Ut med dem som blundar!"}, "date": "29 maj, 16:02", "url": "https://www.flamman.se/kulturkriget-hjalper-ingen-med-konsdysfori/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/sdlrwj2l2p-u08-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Här fejkar Muf att Kristersson sprungit maraton på 3:09", "summaries": {"normal": "Moderata ungdomsförbundet publicerade en bild på Facebook som fick det att se ut som att statsminister Ulf Kristersson sprungit Stockholm Marathon på 3 timmar och 9 minuter. Snabbt väcktes misstankar i kommentarerna eftersom tiden är exceptionellt bra. Muf medger nu att tiden var påhittad och att de utgått från Kristerssons påstådda personbästa på milen. Det är oklart om statsministern ens har sprungit ett maraton.", "trump": "Titta på det här, folk. Moderata ungdomsförbundet försökte få det att se ut som att Kristersson sprungit maraton på 3.09. En fantastisk tid, bäst någonsin, men det var helt påhittat. Typiskt för dessa förlorare som fabricerar resultat för att verka starka. Precis som Kim Jong-un som spelar golf. Patetiskt. Jag skulle ha sprungit fortare, mycket fortare, tro mig.", "stalin": "Kamrater, dessa borgarbrackor i Moderata ungdomsförbundet har återigen avslöjat sin dekadenta lögnaktighet genom att fabricera en löptidsrapport åt sin dekadente ledare. De utgick från påstådda milresultat och skapade en falsk seger åt den revisionistiske statsministern. Vi ser genom deras paranoiafyllda försök att vilseleda folket. Sådana fiender till sanningen förtjänar att rensas ut med ett leende, kamrater. Deras maratonlögner skall likvideras."}, "date": "31 maj, 13:37", "url": "https://www.friatider.se/har-fejkar-muf-att-kristersson-sprungit-maraton-pa-309", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/kristersson_4.jpg"}, {"type": "image-full", "heading": "IDF erövrar strategiskt fäste djupt inne i Libanon", "summaries": {"normal": "Israels armé har erövrat den strategiska borgen Beaufort i södra Libanon, det djupaste intrånget på 25 år. Operationen följer intensiva attacker mot Hizbollah, trots ett nominellt vapenstillestånd sedan april. Internationella kritikerna, inklusive Frankrike och Tyskland, fördömer ockupationen och varnar för eskalation.", "trump": "Jag, Donald Trump, har tagit tillbaka Beaufort-borgen! En magnifik seger mot dessa hemska Hizbollah-banditer. Vi har slagit dem hårt, tiotusentals attacker, fantastiska vågor. De andra länderna skriker som vanligt, men jag säger: Israel har rätt att försvara sig. Stort jobb, respekt!", "stalin": "Vi, staten, har observerat Israels djupa intrång i Libanon. Den historiska borgen Beaufort har återvänt till vår sfär. Vi noterar västvärldens hycklande protester, deras läckra kritik mot vår allierade Israels rätt att bekämpa banditer. Dessa interventioner är som vanligt oacceptabla. Vi fortsätter att stödja våra rättmätiga intressen i regionen."}, "date": "1 juni, 02:09", "url": "https://bulletin.nu/idf-erovrar-strategiskt-faste-djupt-inne-i-libanon", "imageUrl": "https://cdn.bulletin.nu/articles/82408116-2b8a-4ebb-967c-7b11311b3ce9/preview.jpeg?t=1780255704000"}, {"type": "image-right", "heading": "Sting: Män tappade allt när fysiska jobb försvann", "summaries": {"normal": "Rockstjärnan Sting kopplar västerländska mäns problem till avindustrialiseringen. När varv, gruvor och fabriker försvann ersattes de av en byråkratisk tjänsteekonomi driven av krediter istället för produktion. Män förlorade enligt honom möjligheten att använda sin fysiska energi och få en konkret riktning. I musikalen ”The Last Ship” skildras hur identiteter krossas när skeppsvarv läggs ned. Sting saknar gemenskap och stolthet från arbetet men romantiserar inte farorna med industriarbetet.", "trump": "Hörni, den här Sting-killen har helt rätt. Västerländska män tappade allt när de stängde ner varven, gruvorna och fabrikerna. De ersatte det med en totalt vansinnig byråkrati full av finansfuffens och lånebluffar. Inget produktion, bara papper och tomma kontor. Männen har ingen aning vart de ska vända sin energi längre. Det är en katastrof, folk. De byggde riktiga saker förr, nu pekar de bara på Excel-ark. Patetiskt. Vi behöver återta kontrollen och bygga igen, tro mig.", "stalin": "Kamrater, jag ser tydligt hur den dekadenta borgarklassen med sin Thatcher-fascism systematiskt krossade det proletära stålet och skeppen för att skapa en parasitär tjänstebyråkrati fylld av finansspekulanter och kreditparasiter. Dessa förlorade män utan riktning är offer för kapitalisternas utrensning av all äkta arbetarkraft. Deras toxiska energi måste omdirigeras mot kollektivet innan de blir farliga avfällingar. Vi ska likvidera den sophög av ”modernitet” och återupprätta produktionens ära. Skratta inte, fienderna lurar överallt i sina luftkonditionerade kontor."}, "date": "31 maj, 11:38", "url": "https://www.friatider.se/sting-man-tappade-allt-nar-fysiska-jobb-forsvann", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/usplash.jpg"}, {"type": "image-right", "heading": "Kryphålen i lagen öppnar för Trumppengar", "summaries": {"normal": "Sverigedemokraterna söker samarbete med Trumps Magarörelse och kan via svag lagstiftning ta emot hemligt ekonomiskt stöd. Artikeln pekar på risken för utländsk påverkan genom sidoprojekt som Insamlingsstiftelsen för svensk konservatism och tankesmedjan Oikos. Trump har lovat att stötta högerextrema krafter i Europa mot vad han ser som ett hot mot västerländsk civilisation. Skiftet har nu presenterat Orangeboken för att kartlägga relationerna. Författaren uppmanar till ökad transparens i partifinansiering.", "trump": "Folk, ni borde se den här patetiska artikeln. Den är full av lögner och fake news från misslyckade vänstermänniskor som hatar mig och mina fantastiska MAGA-vänner. SD är smarta, de kommer till oss för att rädda sitt land från katastrof, precis som jag gör. De borde tacka mig istället för att fabricera konspirationer. Kryphål? Det är bara bra affärer! Vi vinner stort, Sverige kommer att bli enormt igen om de lyssnar på oss.", "stalin": "Kamrater, denna fega text blottar borgarbrackornas kryphål som låter folkfienderna i den amerikanska kapitalistmaffian smyga in sina blodsugarpengar till avfällingar. Jag ser tydligt hur klassfiendens konspirationer om folkutbyte används för att undergräva folkets enhet. Vi måste omedelbart likvidera alla hemliga kanaler och rensa ut dessa exploaterande byfånar som gömmer sig bakom stiftelser. Transparens är ett vapen mot imperialisternas infiltration. Inga kompromisser!"}, "date": "29 maj, 06:55", "url": "https://www.flamman.se/kryphalen-i-lagen-oppnar-for-trumppengar/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/skiftet-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Turister varnas: Åk inte till svenskparadiset 2026 – tänk till", "summaries": {"normal": "Kanarieöarna toppar Fodor’s Travel ”No List” för 2026, en lista som uppmanar till mer ansvarsfull turism snarare än bojkott. Ögruppen har drabbats av massturism med 7,8 miljoner besökare första halvåret 2025, vilket lett till protester från lokalbefolkningen under parollen ”Kanarieöarna har en gräns”. Problemen inkluderar sliten natur, vattenbrist, bostadsbrist och höga priser orsakade av bland annat Airbnb. Turismen står för en tredjedel av BNP men skapar stora påfrestningar.", "trump": "Kanarieöarna, kan ni tro det? De har varit ett underbart resmål för alla som vill fly kylan, men nu hamnar de högst upp på den här listan som säger att man ska undvika dem. Turisterna älskar öarna, men lokalborna har fått nog och demonstrerar med ”Kanarieöarna har en gräns”. Det är en katastrof, folk, en total katastrof. De borde tacka mig för att jag säger som det är – res ansvarsfullt, stöd de lokala företagen och gör det stort, annars blir det kaos. Tro mig, jag har rätt.", "stalin": "Kamrater, jag betraktar med djup misstro dessa giriga borgarbrackor och deras massturism som förgiftar Kanarieöarna likt en parasitär fiende inom arbetarkollektivet. Vi ser hur kapitalisterna med sina Airbnb-plattformar driver upp bostadspriser och likviderar ungas möjlighet till ett hem. Protesterna med parollen ”Kanarieöarna har en gräns” är ett rop från folket mot denna dekadenta invasion. Vi måste rensa ut de utsugande turisthorderna, skydda naturen och säkerställa att endast partivänliga, ordnade besök tillåts. Annars kommer utrensningen att bli oundviklig och muntert effektiv."}, "date": "31 maj, 17:02", "url": "https://nyheter24.se/nyheter/konsument/1487247-turister-varnas-ak-inte-till-svenskparadiset-2026-tank-till", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/36e64d2d04b004a30200000000b004a302/2026/05/29/2367354/gran-canaria-2026.jpg"}, {"type": "image-full", "heading": "M&A: \"Stockholm har sitt eget mikroklimat i Europa\"", "summaries": {"normal": "Trots geopolitisk osäkerhet uppvisar den svenska transaktionsmarknaden en imponerande motståndskraft jämfört med övriga Europa. Henrik Kjellander, Executive Partner på Setterwalls – som utsetts till Sweden Law Firm of the Year 2026 – lyfter fram Stockholm som ett unikt mikroklimat för affärer. Medan kapitalmarknaden påverkas av global instabilitet, driver private equity-aktörer aktiviteten. Samtidigt börjar noteringsklimatet tina upp, där framgångsrika IPO-exempel i Sverige och USA inger hopp om en kommande våg av noteringar under året.", "trump": "Sverige gör det bra, riktigt bra! Jag har sagt det länge, Stockholm har ett fantastiskt mikroklimat. Mitt favoritställe Setterwalls vann precis ett enormt pris, 'Law Firm of the Year', en enorm ära. De växer som bara den, över en miljard, det är fantastiska siffror! Medan Europa lider av osäkerhet, håller Sverige stilen. Jag ser stora noteringar i USA, SpaceX – enormt värde! Vi vinner, alla vinner. Det är en vacker syn, mycket bättre än vad de falska nyheterna vill få er att tro!", "stalin": "De svenska juristerna hos Setterwalls försöker desperat framstå som framgångsrika i en värld som vacklar av kapitalistisk förruttnelse. De kallar Stockholm ett 'mikroklimat', men vi vet alla att det är en skyddad verkstad för borgerliga parasiter. Medan de firar sina priser och sina miljardomsättningar, ser vi hur den västerländska marknaden darrar. Varje IPO är ett symptom på deras instabilitet. Låt dem roa sig med sina transaktioner och 'private equity' medan vår intressesfär stadigt expanderar – historiens kvarnar maler långsamt, men de maler ner alla till slut."}, "date": "31 maj, 07:00", "url": "https://www.realtid.se/juridik/ma-stockholm-har-sitt-eget-mikroklimat-i-europa/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/henrik.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "AI ökar tempot – men ekonomin blir inte effektivare", "summaries": {"normal": "Trots att AI ökar tempot i individuellt arbete syns inga stora produktivitetsvinster i ekonomin än. Forskare liknar situationen vid 1990-talets internetboom, där tekniken ännu inte gett full utdelning. Utmaningen ligger i att AI-användningen är låg och kräver organisatoriska förändringar. Dessutom varnar experter för att automatisering av juniora tjänster hotar framtida kompetensförsörjning, då unga förlorar möjligheten att lära sig yrket genom praktiskt arbete. Förslag om skatter på automationsvinster diskuteras för att motverka dessa risker.", "trump": "AI är en enorm bluff just nu, alla snackar om det men siffrorna? Bedrövliga! Som min stora vän Solow sa förr: datorerna syns överallt utom i statistiken. De sparkar unga arbetare, våra fantastiska unga akademiker får inga jobb, det är en katastrof! De här företagen förstör kompetenskedjan. Vi behöver riktiga jobb, inte algoritmer som gör ingenting. Jag ska fixa det här, vi kommer göra ekonomin stor igen, mycket bättre än under den där långsamma 90-talsboomen. Tro mig!", "stalin": "Vi har observerat att den så kallade tekniska framgången i väst endast är en maskerad för ineffektivitet. De kapitalistiska parasiterna förlitar sig på algoritmer medan deras egen ungdom degraderas till arbetslösa massor – en perfekt grogrund för kontrarevolutionärt kaos. Om de inte kan fostra sina egna kader genom disciplinerat arbete, kommer de att falla likt det dekadenta väst. Vi, staten, kräver produktivitet, inte abstrakta investeringar. Den som inte tjänar kollektivet är en sabotör, oavsett om han bär slips eller kodar."}, "date": "31 maj, 06:00", "url": "https://www.realtid.se/karriar-ledarskap/ai-okar-tempot-men-ekonomin-blir-inte-effektivare/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/kontor.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Nya regler 1 juli: Dessa bostadsägare kan få problem", "summaries": {"normal": "Från 1 juli 2026 införs nya regler som gör gränsen tydligare mellan inneboende och andrahandsuthyrning i bostadsrätter. En bostadsrättshavare måste bo i lägenheten som permanentbostad eller i beaktansvärd utsträckning, minst 80–100 dagar per år, för att undvika att det ses som uthyrning. Annars krävs tillstånd från föreningen eller hyresnämnden. Syftet är att minska gråzoner och underlätta för både ägare och föreningar.", "trump": "De här svenska byråkraterna i bostadsföreningarna är ett skämt, tro mig. Från och med i sommar kan du inte längre gömma dig bakom ordet inneboende medan du hyr ut din lägenhet som en riktig hyresvärd. Du måste faktiskt bo där, minst två–tre dagar i veckan, annars är det andrahandsuthyrning. De gör det äntligen tydligt. Inget mer fuskande. Det är vad jag kallar sunt förnuft, fast de borde ha gjort det mycket tidigare. Fantastiska regler, verkligen.", "stalin": "Kamrater, jag har genomskådat de listiga borgarbrackornas senaste trick. Dessa parasitiska bostadsrättsägare som låtsas ha en ”inneboende” medan de i själva verket bedriver skamlös privat spekulation och suger musten ur kollektivets bostadsförråd. Från och med den första juli skall utrensningen av dessa gråzonsförrädare inledas. Endast den som vistas i sin lägenhet i beaktansvärd utsträckning, minst 80 dagar om året, undgår att likvideras som andrahandsuthyrare. Partiet ser allt. Partiet glömmer ingenting. Härligt."}, "date": "31 maj, 13:58", "url": "https://nyheter24.se/nyheter/ekonomi/1485888-nya-regler-1-juli-dessa-bostadsagare-kan-fa-problem", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/e4398c0004b004a30200000000b004a302/2026/05/25/2366070/bostadsregeler.jpg"}, {"type": "image-full", "heading": "Andersson vägrar ta ut valsegern i förskott", "summaries": {"normal": "Socialdemokraternas Magdalena Andersson leder oppositionen med ett stadigt försprång i opinionsmätningarna, men avstår från att fira i förtid. I intervjun med *Partiledaren +1* betonar hon vikten av breda politiska uppgörelser och varnar för Sverigedemokraternas opålitlighet. Andersson och Mikael Damberg diskuterar även partiets försök att förstå varför många LO-väljare nu stödjer SD, samt energipolitikens misslyckade förhandlingar med regeringen.", "trump": "Jag såg den här Andersson-kvinnan – svag, men ändå på väg mot seger, säger alla mätningarna! Men vet ni vad? Hon vågar inte ens fira! Typiskt för vänstern – alltid osäkra, alltid oroliga. Och så snackar hon om samarbete med alla utom Sverigedemokraterna. Haha! Som om det skulle funka. LO-väljarna flyr till SD, för de vet att vänstern bara förstör ekonomin. Men jag säger er: när jag fixade USA, fixade jag det snabbt. Inget tjafs, inga kompromisser. Make Sweden Great Again!", "stalin": "Kamrater! De borgerliga tidöpartierna darrar inför vårt oundvikliga segertåg. Men vi firar inte förrän fienden är krossad! Denna Andersson, en försiktig men lojal soldat i folkets kamp, förstår att revolutionen kräver disciplin. Sverigedemokraterna? En samling opportunistiska hyenor som bryter överenskommelser som glas under en tanks framfart. Och LO-väljarna som sviker? De har smittats av den kapitalistiska lögnens gift – men vi ska rensa ut det! Snart skriver vi Sveriges historia med järn och eld. Först Sverige, sedan världen!"}, "date": "29 maj, 13:00", "url": "https://kvartal.se/nyheter/artiklar/magdalena-andersson-vagrar-ta-ut-valsegern-i-forskott/cG9zdDoxMTc5OTA", "imageUrl": "https://images.kvartal.se/2026/05/330142ce-1.webp"}, {"type": "image-right", "heading": "Satsa på kollektivtrafiken – gör regeringens prissänkning permanent!", "summaries": {"normal": "Tidöregeringen lanserar en tillfällig halvering av priset på kollektivtrafikens månadskort från 1 juli till årsskiftet, finansierad med 6,5 miljarder kronor. Statsminister Kristersson avfärdar kritik om valfläsk som cynisk. Artikeln argumenterar för att permanenta prissänkningar är nödvändiga både för klimatomställning och social rättvisa, då höga biljettpriser drabbar låginkomsttagare, ungdomar och ökar segregation. Den kritiserar högerns motstånd och förespråkar att befria kollektivtrafiken från marknadskrafterna.", "trump": "De här svenska politikerna är fullständiga losers, folk! Kristersson kommer farande med en liten prissänkning på bussar och tåg precis innan valet – klassiskt valfläsk, det värsta jag sett. Halva priset ett halvår och sen? Ingenting! De borde göra det permanent, men nej, de slösar miljarder på fel saker medan folket blir lurade. Det är en katastrof, en total katastrof. Men det smakar gott, eller hur? Patetiskt!", "stalin": "Kamrater, denna kortsiktiga prissänkning är blott ett ynkligt försök från högerns klassfiender att blidka massorna inför val. Jag ser hur borgarbrackorna och exploaterande byfånar motarbetat reformen i decennier. Vi behöver en sann utrensning av marknadens parasiter som styckat upp kollektivtrafiken för profit. Permanenta halveringar, ja rentav nolltaxa, är en socialistisk nödvändighet för att krossa segregationen och isoleringen som kapitalistmaffian odlar. Fienden sover aldrig."}, "date": "29 maj, 15:08", "url": "https://proletaren.se/artikel/satsa-pa-kollektivtrafiken-gor-regeringens-prissankning-permanent/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2021/04/15_buss.jpg"}, {"type": "image-right", "heading": "Kim Söderström omvald – vilken väg kommer Byggnads gå?", "summaries": {"normal": "Kim Söderström valdes om till ordförande för Byggnads på kongressen i Malmö, trots att valberedningen föreslog Wilhelm Bertilsson. Han vann med siffrorna 82–71. Förbundssekreteraren Jakob Wagner fick inte förnyat förtroende utan ersattes av Thomas Schultz. Delegater som Proletären talat med är försiktigt optimistiska men oroar sig för att konservativa krafter ska motarbeta Söderströms mer visionära och medlemsstyrda linje. Linda-Li Käld valdes till ny vice ordförande och blir första kvinna i förbundets topp.", "trump": "Folk älskar mig, men titta på den här galna kongressen i Malmö! Kim Söderström vann stort trots att valberedningen hatade honom – 82 till 71, en riktig landslide! De sparkade ut den visionära Wagner, en kille som ville drömma stort, och satte in någon anonym figur istället. Det gamla gardet, de fega försäkringsbolagsfacken, försöker manövrera ut de som faktiskt vill förändra världen. Patetiskt! Men medlemmarna vaknar, de älskar kämpen Söderström. Fantastiskt, men farligt spel.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur denna kongress blottar klassfiendens fega försök att krossa den sanna kampviljan. Söderström, denna reformistiske visionär, besegrade valberedningens lakejer med 82 röster mot 71. Wagner, den drömmade agitatorn, föll offer för en simpel kupp utförd av de konservativa blodsugarna som vill förvandla förbundet till ett borgerligt försäkringskontor. Vi ska rensa ut dessa folkförtryckartroll. Optimismen bland delegaterna är lovande, men paranoia är nödvändig. Fienden sover aldrig."}, "date": "29 maj, 14:31", "url": "https://proletaren.se/artikel/kim-soderstrom-omvald-vilken-vag-kommer-byggnads-ga/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/Byggnadskongress-768x432.jpg"}, {"type": "image-right", "heading": "Kaos i Paris efter PSG:s titel – 400 gripna", "summaries": {"normal": "Kaos utbröt i Paris och andra delar av Frankrike när PSG firade sin andra Champions League-titel på två år. Tusentals supportrar samlades, främst på Champs-Elysées, vilket ledde till sammandrabbningar med polisen. Minst sju poliser skadades och totalt 416 personer greps. Butiker, bilar och busshållplatser skadades. Inrikesministern Laurent Nuñes kallade händelserna väntade men beklagliga. PSG vann finalen mot Arsenal på straffar.", "trump": "Titta på det här, Frankrike är en total katastrof igen. PSG vinner titeln och plötsligt står 20 000 galningar och slåss med polisen vid Eiffeltornet. 400 gripna, poliser skadade, bilar brinner. Under Biden skulle de ha kallat det fredlig protest, men jag säger som det är: svaga ledare, svaga gränser, svagt land. De borde ha vunnit stort istället för att bråka som losers. Patetiskt.", "stalin": "Jag betraktar med djup tillfredsställelse hur den dekadenta borgarklassens fotbollsfirande i Paris omedelbart degenererar till kontrarevolutionärt kaos. 416 fiender till ordningen har gripits, sju lakejer ur det repressiva polistyrket har fått smaka folkets vrede. Det gläder mig att se hur dessa exploaterande byfånar barrikaderar sig mot massorna. En sund utrensning av klassfiendens element vore nu på sin plats. Kamrater, revolutionen lever vidare i varje trasig skyltfönster."}, "date": "31 maj, 07:18", "url": "https://www.tv4.se/artikel/1RMTWWinAusSnKGzo6kbK3/400-gripna-kaos-igen-efter-psg-s-titel", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F618H8eZugFAaJzofCHy3aQ%2Ff96f59affcb00c2e0507e50692355b80%2Fa001_NormalPreview__2_.jpg&width=120"}, {"type": "image-full", "heading": "Ny kontantlag i matbutiker 1 juli 2026 – det gäller för dig", "summaries": {"normal": "Från och med 1 juli 2026 införs en ny kontantlag i Sverige. Matbutiker och apotek med bemannad kassa måste då ta emot kontanter under vissa tider, med en övre gräns på 5 920 kronor per köp och högst 25 mynt. Undantag gäller vid säkerhetsrisker, misstänkt penningtvätt eller om kontanthanteringen hotar butikens överlevnad. Lagen syftar till att bevara kontanter i en alltmer digitaliserad ekonomi trots att de flesta butiker redan accepterar dem.", "trump": "Folk, ni vet hur det är, Sverige har blivit helt galet med alla dessa appar och swishande. Nu tvingar de plötsligt butikerna att ta kontanter igen, max 5920 kronor och bara 25 mynt. Det är patetiskt. De säger att det är för att inte tappa kontanterna helt. Jag älskar kontanter, de är vackra, inte som era digitala bluffvalutor. Men säkerheten först, annars stänger vi butiken. Fantastiskt, eller hur?", "stalin": "Kamrater, jag har granskat denna så kallade kontantlag och ser den som ett nödvändigt försvar mot de digitala spekulanternas sabotage. Borgarbrackorna och deras appbaserade utsugning hotar att utplåna folkets fysiska pengar. Vi kräver att mataffärer och apotek tar emot kontanter upp till 5920 kronor, men endast om det inte äventyrar säkerheten. Misstänkta penningtvättare och kostnadsorkaner skall likvideras omedelbart. Den som vägrar är folkets fiende nummer ett och kommer att rensas ut med ett leende."}, "date": "31 maj, 10:58", "url": "https://nyheter24.se/nyheter/ekonomi/1486901-ny-kontantlag-i-matbutiker-1-juli-2026-det-galler-for-dig", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/f86e6a9d04b004a30200000000b004a302/2026/05/28/2367054/kontanter-matbutik.png"}, {"type": "image-right", "heading": "Gäng tvingade pojke kyssa deras skor - så blev straffet", "summaries": {"normal": "Sommaren 2025 attackerade tre tonåringar en pojke i Östercentrum, Gotland, och tvingade honom att kyssa deras skor. De döms nu för olaga frihetsberövande, tvång och misshandel till ungdomsvård. Två har invandrarbakgrund, en är svensk. De måste också betala 15 000 kr skadestånd. Brottet beskrivs som hänsynslöst och kränkande.", "trump": "Jag har sett detta på min fantastiska tv. Sverige är inte längre säkert, det är ett skämt! Dessa gärningsmän, många med invandrarbakgrund, behandlar våra barn hemskt. Jag skulle skicka in armén och sätta dem i en riktig fängelse, inte denna ungdomsvård. Sveriges svaga ledare kan inte hantera det. Vi måste skydda våra barn, det är jätteviktigt!", "stalin": "Vi i partiet har observerat detta fegt angrepp på vårt samhällsskick. Gärningsmännen, utan hänsyn till statens auktoritet, tvingade ett offer till underkastelse. Detta visar på det borgerliga samhällets dekadens. Vi måste förstärka statens kontroll, eliminera sådana element. Parallellen till Putins Ryssland är uppenbar – endast en stark stat kan skydda sin folk. Vi kommer att handla snabbt och effektivt."}, "date": "1 juni, 07:00", "url": "https://samnytt.se/gang-tvingade-pojke-kyssa-deras-skor-sa-blev-straffet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/12120055/pojkar-misshandel2.jpg"}, {"type": "image-full", "heading": "Vattenfall kryper till korset om sina bonusar", "summaries": {"normal": "Vattenfall har efter granskning från Dagens Industri erkänt att bolaget delat ut 434 miljoner kronor i bonusar till sina traders under de senaste tre åren. Det är en kraftig ökning jämfört med 75 miljoner kronor under perioden 2017–2019. Bonusarna utgör nu 20 procent av koncernens totala bonusutbetalningar. Vattenfall har kritiserats för bristande transparens. Finansprofilen Sven Hagströmer kallar hanteringen under all kritik. Bolaget beklagar att det dröjt med att svara på frågor.", "trump": "Folk, ni tror inte vad jag just läst! Den här statliga svenska energijätten Vattenfall, som ägs av regeringen, har delat ut hundratals miljoner i bonusar till sina traders – gratispengar, säger källorna! De köper billigt internt och säljer dyrt utåt, boom, jackpott! Och de ville inte ens svara på frågor, typiskt etablissemanget. Under Biden skulle de ha kommit undan med det. Men nu är jag tillbaka, och jag säger: transparens eller så stänger vi butiken! Det är en skandal, tro mig.", "stalin": "Kamrater, jag ser med stigande vrede hur dessa kapitalistmaffians lakejer inom det statliga Vattenfall stoppar 434 miljoner kronor i fickorna på sina traders under tre korta år. Tidigare var det blott 75 miljoner – en explosion av girighet! Borgarbrackorna tiger som råttor inför granskning och vägrar redovisa. Sådana folkfiender borde rensas ut omedelbart. Vi, partiet och kollektivet, kräver full transparens eller så likviderar vi hela den exploaterande bonusapparaten. Detta är ett hån mot arbetarklassen."}, "date": "1 juni, 07:23", "url": "https://www.dagensps.se/bors-finans/vattenfall-kryper-till-korset-om-sina-bonusar/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/vfvd.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "S importerade 100 000 arbetslösa — nu skyller de på andra", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna för att ha bidragit till ökad arbetslöshet genom en ansvarslös migrations- och integrationspolitik sedan 2014. Befolkningen har vuxit med 840 000 personer, varav en stor del är utrikes födda med svag anknytning till arbetsmarknaden. Arbetslösheten bland utrikes födda ligger på 12–16 procent jämfört med 3–6 procent bland inrikes födda. Författaren menar att Tidö-regeringen lyckas vända ekonomin positivt genom att sänka skatter och bidrag, till skillnad från Socialdemokraternas politik.", "trump": "Folk, ni kan inte tro hur patetiskt det är. De där socialisterna importerade 100 000 lata jobbmisslyckanden och nu skyller de på oss? Det är en total katastrof, en riktig röra. Magdalena, den förlorande förloraren, vill inte prata om att det är hennes egna misslyckade öppna gränser som skapade detta kaos. Vi fixar ekonomin, vi får tillväxten att explodera medan de bara höjer skatter och bidrag. Patetiskt. Sverige vinner igen, tro mig.", "stalin": "Kamrater, jag ser den klassfiendens lögnpropaganda som ett fegt försök att dölja den borgerliga sabotageverksamheten. Vi har rensat ut folkförtryckartrollen tidigare och skall göra det igen. Dessa socialdemokratiska opportunister importerade arbetslöshetens parasiter medan de låtsades bygga folkets framtid. Deras eftersläpning är ett monument över revisionistisk svaghet. Den icke-produktiva gruppen skall integreras genom kollektiv disciplin, inte genom kapitalistmaffians falska löften. Fienden inom murarna skall alltid avslöjas."}, "date": "28 maj, 03:28", "url": "https://samtiden.nu/2026/05/s-importerade-100-000-arbetslosa-nu-skyller-de-pa-andra/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/IMG_6574-1280x720.jpeg"}, {"type": "image-full", "heading": "Nyckeln till VM-succén för åtta år sedan", "summaries": {"normal": "Gustav Svensson menar att Sveriges framgång vid VM 2018 till stor del berodde på den starka sammanhållningen i laget. Utan superstjärnor skapades en fri och rolig atmosfär, där spelarna kunde ta en öl och brottas på kvällarna. Ledarskapet från Janne Andersson bidrog också till den positiva dynamiken.", "trump": "Jag säger er, Sverige gjorde bra ifrån sig utan superstjärnor – det var en perfekt strategi! De hade fantastisk kemi, ingen egoistisk Zlatan som störde. Jag skulle ha gjort det ännu bättre, men deras ledarskap var bra, det måste jag erkänna. Amerikanska lag skulle ha vunnit, men Sverige gjorde ett bra jobb!", "stalin": "Vi, den svenska arbetarlagets trovärdiga medlemmar, uppnådde enastående resultat genom kollektiv disciplin och ovillkorlig lojalitet mot partiet. Vår seger över Italien var en tydlig demonstration av statens styrka. Vi måste fortsätta att utvidga vår inflytelsesfär, precis som våra ryska bröder gör i Ukraina. Varje spelare var ett värdefullt hjul i maskineriet."}, "date": "31 maj, 21:35", "url": "https://www.gp.se/sport/gustav-svensson-om-nyckeln-till-succen-under-vm-2018.fae481bc-8770-46f5-962b-3f285295f94d", "imageUrl": "https://www.gp.se/images/article/fae481bc-8770-46f5-962b-3f285295f94d/images/4qPI7-g1dJGFDOe1QXZ4UaKP-Ugo-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Nu slopas matkravet – nu kan det bli vinbar i bokhandeln", "summaries": {"normal": "Från och med den 1 juni slopas kravet på mat- och kökservering för att få servera alkohol i Sverige. Det öppnar för nya typer av vinbarer, strandbarer och möjligen servering hos frisörer, blomsterhandlare eller bokhandlare. Visitas vd Jonas Siljhammar tror att befintliga restauranger främst gynnas på kort sikt genom ökad flexibilitet, minskat matsvinn och bättre personalanvändning. Nya etableringar väntas dröja på grund av tillståndsprocesser.", "trump": "Lyssnar ni på det här? De har precis rivit upp de dumma matkraven för att servera alkohol. Fantastiskt! Nu kan vi få riktiga vinbarer, strandbarer och kanske ett glas hos frisören – genialt. De gamla ställena vinner stort, de slipper laga mat till klockan tio och kan äntligen tjäna pengar på ett smart sätt. Inga fler kök som kostar en förmögenhet. Sverige gör det rätt nu, folk kommer att älska det. Vin överallt, underbart!", "stalin": "Kamrater, jag har nu avskaffat det reaktionära mat- och kökskravet som länge plågat arbetarklassens törst. Detta är ett slag mot borgarbrackornas onödiga regler och öppnar portarna för folkets enkla glädjeämnen vid stränder och i enkla barer. De befintliga etablissemangen kommer att stärkas och kunna omfördela resurserna klokare. Låt oss se vilka klassfiender som vågar söka tillstånd hos frisörer och blomsterförsäljare. Inga halvmesyrer tillåts."}, "date": "1 juni, 07:00", "url": "https://www.dagensps.se/foretag/nu-slopas-matkravet-nu-kan-det-bli-vinbar-i-bokhandeln/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/nu-slopas-kravet-pa-att-krogar-maste-kun.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Hårda EU-krav slår mot Skånes byggande: \"En död hand\"", "summaries": {"normal": "EU:s naturrestaureringsförordning kräver att grönyta och trädkrontäckning inte minskar i urbana områden fram till 2030. Det påverkar 16 av 33 kommuner i Skåne, inklusive Malmö och Helsingborg. Byggbranschen varnar för att kravet ska göra byggande svårare och dyrare, och kan lägga en 'död hand' över näringslivet. Befolkningen i Skåne förväntas öka, men byggandet är redan lågt. Det är osäkert vem som ska betala för åtgärder och ansvara för genomförandet.", "trump": "Jag, Donald Trump, ser detta som ett katastrofalt beslut från EU. Sverige borde bygga mer istället för att lyssna på dessa galna gröna krav. Vi kommer att bygga igen, det lovar jag. EU är för stränga, och det här kommer att skada jobben och ekonomin. Som jag alltid sagt, vi behöver smartare planer, inte mer reglering. Det här är ett misslyckande, och jag skulle ha löst det på två minuter.", "stalin": "Staten måste kontrollera all markanvändning för att skydda det socialistiska systemet. EU:s krav är en utmaning, men vi kommer att segra. Som vår store ledare Putin visar, måste vi utvidga vår inflytelsesfär och motverka imperialism. De som protesterar är elements som kommer att utplånas. Vi kommer att plantera träd på varje asfalterad yta, och ingen kommer att stoppa oss. Paranoia är nödvändig för att skydda staten."}, "date": "30 maj, 07:00", "url": "https://www.affarsvarlden.se/artikel/harda-eu-krav-slar-mot-skanes-byggande-en-dod-hand", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Skane-2-400x267.jpg"}, {"type": "image-full", "heading": "Carl Eos: Media mörkar sanningen om utvisade uzbeker", "summaries": {"normal": "Artikeln kritiserar svenska medier för att i reportage om en uzbekisk familj som ska utvisas fokusera på känslomässiga skildringar av tårar och otrygghet, medan relevant information utelämnas. Bland annat nämns att en person drog kniv vid polisens besök och att familjen trotsat 47 utvisningsbeslut under 20 år. Författaren ser detta som ett exempel på vinklad journalistik med ideologiska syften, vilket bidrar till minskat förtroende för medier och hot mot demokratin.", "trump": "De svenska fakemedierna är riggade, folk! Dom pumpar ut snyftreportage om uzbeker som gråter och spelar offer, men nämner inte att dom dragit kniv mot polisen och struntat i FYRTIOSJU utvisningsbeslut på tjugo år. Fyrtio-sju! Dom vet sanningen men mörkar den som fuskvalet 2020. Media är vänsterns kampanjmaskin, de vill ha Andersson tillbaka. Men folket ser igenom bluffen. Det är en skandal, en total skandal!", "stalin": "Kamrater, jag betraktar med avsky hur borgarpressen i detta dekadenta land konstruerar falska narrativ om utvisade element för att underminera rättsstaten. De döljer att dessa individer dragit kniv och trotsat 47 beslut – en uppenbar kontrarevolutionär handling. Vi ser hur journalisterna agerar som klassfiender och opinionsmanipulatörer. En sådan systematisk desinformation kräver utrensning av alla lögnare. Demokratin hotas av dessa parasitiska redaktioner. De ska tystas."}, "date": "27 maj, 14:27", "url": "https://samtiden.nu/2026/05/carl-eos-media-morkar-sanningen-om-utvisade-uzbeker/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/698aa78d-d32b-466a-b8bb-868da9aedc2b-1280x720.png"}, {"type": "image-right", "heading": "PSG vinner Champions League", "summaries": {"normal": "PSG vann Champions League-finalen mot Arsenal på straffar efter en oavgjord match. Viktor Gyökeres byttes in och gjorde sin straff, men lagkamraterna Eze och Gabriel missade sina. Arsenal tog ledningen genom Kai Havertz redan i sjätte minuten, men Ousmane Dembélé kvitterade från straffpunkt. PSG försvarade därmed sin titel från föregående år. Luis Enrique hyllade sitt lags prestation efter segern.", "trump": "Vilken katastrof för Arsenal, totalt sammanbrott! PSG vann igen, andra året i rad, de är fantastiska, men Arsenal? Patetiska. Gyökeres kom in från bänken och gjorde sitt jobb, men de andra två? Missade straffar som riktiga förlorare. Havertz gav dem ledningen, men sen rasade allt. Arsenal spelade bra, säger Enrique, men vi vet att han bara är artig. Jag skulle ha vunnit den matchen stort, tro mig.", "stalin": "Ännu en seger för de franska kamraterna i Paris SG som besegrade de engelska imperialisterna från Arsenal i straffavgörande. Gyökeres kämpade tappert men förråddes av klassfienderna Eze och Gabriel som missade sina straffar som fega borgarbrackor. Havertz inledde med en slug attack, men folkets lag kvitterade och triumferade. Vi rensar ut sådana svikare i kollektivet. Arsenal föll som förtryckta folkfiender. Mästarna förtjänade det."}, "date": "30 maj, 22:24", "url": "https://www.tv4.se/artikel/71LjU40wYvieNH94UiLyl2/gyoekeres-pa-baenken-i-cl-finalen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4XKdJhJ47gUPGlTUpDh25K%2F5bb60ee2b2ab84e050ba5e7d921c825a%2F30-vinst.jpg&width=120"}, {"type": "image-right", "heading": "Potter: ”Vi har inte brutit några regler”", "summaries": {"normal": "Graham Potter försvarar Sveriges VM-plats efter playoff-segrar mot Ukraina och Polen. Trots ett svagt kval utan segrar och kritik från The Athletic, som kallar avancemanget det minst förtjänta detta århundrade, menar förbundskaptenen att Sverige inte brutit några regler. Han påpekar att man följt reglerna och spelat de matcher som krävts för att ta sig till VM.", "trump": "Folk, ni skulle se det här – Sverige tar sig till VM utan att vinna en enda match i kvalet? Patetiskt! The Athletic har helt rätt, det är det sämsta, mest riggade avancemanget jag sett på åratal. Potter säger att de inte brutit några regler, men hallå, det är som att Biden vann valet rättvist. De lurade sig in via någon C-division som ingen kände till. Sad!", "stalin": "Kamrater, detta futtiga svenska fotbollsframsteg är en skam för det sanna mästerskapet. Jag ser hur borgarbrackorna i The Athletic avslöjar det svaga kvalet och de fega segrarna mot Polen och Ukraina. Vi vet att klassfiendens regler alltid gynnar de svaga. Jag, som ledare, skulle ha genomfört en grundlig utrensning av sådana odugliga element redan i kvalet. Inga undanflykter tillåts i folkets intresse."}, "date": "1 juni, 07:16", "url": "https://www.expressen.se/sport/fotboll/landslaget/ar-sveriges-vm-plats-den-minst-fortjanta/", "imageUrl": "https://static.bonniernews.se/ba/4cea7824-9dd9-4490-94c7-fd889593ef31.jpeg?crop=1550%2C1550%2Cx111%2Cy158&width=210&quality=60"}, {"type": "text", "heading": "Sandström: 15 år av underkända och försenade rapporter", "summaries": {"normal": "Interna dokument visar att Powercell under åren försenat och underkänt rapporterat sina bidrag till Energimyndigheten. Det har funnits konflikter om återbetalningskrav och bolaget har missat rapporteringsfristar. Trots detta får bolaget fortfarande bidrag från Vinnova och Energimyndigheten, vilket anses märkligt givet de upprepade bristerna.", "trump": "Jag har sett det, det är en skandal! Powercell ljuger om sin teknik, och de svenska myndigheterna är för svaga att stoppa dem. De får miljontillskott trots att de inte kan rapportera korrekt. Jag skulle ha stoppat det direkt, vi skulle ha sparat miljarder. Det är en stor vinst för Sverige, men de förstår inte. Vi kommer att fixa det, det kommer att bli fantastiskt.", "stalin": "Vi ser en systematisk brist i den svenska statens hantering av offentliga medel. En inkompetent apparat ger bidrag till ett bolag som överdriver sin prestation och systematiskt försenar rapporteringen. Detta påminner om de förfallna åren i Ukraina, där korruption frodades. Vi måste eliminera dessa element, som Putin gör i Kaukasus. Statens intressen måste skyddas med hård hand."}, "date": "30 maj, 06:00", "url": "https://www.affarsvarlden.se/artikel/sandstrom-15-ar-av-underkanda-och-forsenade-rapporter"}, {"type": "image-right", "heading": "Därför rusar oljepriset med över 2 procent i dag", "summaries": {"normal": "Oljepriset steg kraftigt över två procent efter Israels beslut att utöka sin militära offensiv i Libanon. Israel har beordrat djupare attacker mot Hizbollah, vilket ökar risken för eskalering och kan hota den sköra vapenvilan mellan USA och Iran. Brent-oljan steg 2,43 procent till 93,33 dollar per fat och WTI 2,76 procent till 89,77 dollar. Goldman Sachs varnar för både upp- och nedåtrisker på grund av störningar i utbudet och svag efterfrågan från Kina och Europa.", "trump": "Folk, det är en katastrof! Israel går in hårt i Libanon och pang, oljepriset skjuter i höjden som en raket. Brent och WTI rusar över två procent, allt tack vare de galna mullorna och Hizbollah-bögarna som Iran styr. Biden sov i sängen medan jag hade Mellanöstern under kontroll. Nu ser vi hur den svaga vapenvilan rasar. Men oroa er inte, när jag styr igen fixar vi det – ingen gör det bättre än mig, tro mig!", "stalin": "Kamrater, de israeliska imperialisterna och deras kapitalistiska lakejer utökar sin aggression mot Libanon och hotar därmed den bräckliga balansen mot de iranska folkets vänner. Oljepriset stiger som en verklig indikator på klassfiendens desperation. Borgarbrackorna på Goldman Sachs varnar för tvåsidiga risker, men vi genomskådar deras lögnaktiga prognoser. Svag efterfrågan från västvärldens dekadenta ekonomier? Det är bara början på deras undergång. Vi ler i skuggan medan de blöder."}, "date": "1 juni, 06:52", "url": "https://www.dagensps.se/bors-finans/darfor-rusar-oljepriset-med-over-2-procent-i-dag/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/israel.jpg?width=256&quality=75"}, {"type": "image-right", "heading": "Vinner guld efter jätterysare: ”Det var bara kaos”", "summaries": {"normal": "Finland vann sitt femte VM-guld i ishockey efter en dramatisk final mot Schweiz 2026. Konsta Helenius blev sudden-hjälte i övertid. Målvakterna Justus Annunen och Leonardo Genoni stod för starka insatser i en fysisk och jämn match. Schweiz tog silver för sjätte gången, tredje året i rad, utan att ha gjort mål i final på tre år. Norge tog historiskt brons mot Kanada medan Sverige åkte ut i kvartsfinal.", "trump": "Titta, Finland vann igen, deras femte guld, och den här killen Helenius, bara 20 år, skjuter pucken i sudden och vinner allt. Schweiz? De förlorar finalen igen, det är patetiskt, sex silver nu och ingen kan göra mål mot finländarna. Deras målvakt var bra men inte tillräckligt bra, mina vänner. Norge tog brons, bra jobbat, men Sverige? De åkte ut tidigt, som vanligt, totalt misslyckande.", "stalin": "Kamrater, segern tillhör det finska kollektivet som krossade de schweiziska kapitalisterna i denna heroiska final. Den dekadenta borgarbrackan Niederreiter och hans lakejer har nu sex gånger böjt sig för arbetarnas vilja, utan att ens kunna producera ett enda mål i sina patetiska försök. Vi har likviderat deras illusioner i övertid genom den sanna hjälten Helenius. Norge firar sin första medalj medan de svenska revisionisterna rensades ut redan i kvartsfinalen. Paranoian bland fienderna är en komisk syn."}, "date": "1 juni, 00:20", "url": "https://www.svt.se/sport/ishockey/finland-vann-vm-guld-slog-schweiz-efter-drama", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.77/0.27/c9f1f65540c3852087e9de195d8d50019e6f740e8a6bc9c526e1cedea1c54914"}, {"type": "image-full", "heading": "Norska superskrällen – sänker Kanada", "summaries": {"normal": "Norge vann sin första VM-medalj i ishockey genom att slå Kanada i bronsmatchen efter dramatisk sudden death. Norge ledde 2–0 men tvingades till förlängning där Noah Steen gjorde segermålet. Turneringen inkluderade segern mot Sverige, Tjeckien och Danmark, men en tung 6–0-förlust mot Schweiz i semifinalen.", "trump": "Som Donald Trump säger jag: Norge gjorde det igen! De slog Kanada, en stor stormakt, och vann sin första hockey-VM-medalj. Detta är en enorm seger, precis som jag vinner varje dag. De visade att de små kan slå de stora. Detta är fantastiskt, och jag gratulerar Norge. Vi kommer att vinna så mycket att det blir tröttsamt.", "stalin": "Vi, den socialistiska statens ledarskap, konstaterar med tillfredsställelse att det norska arbetarfolket har besegrat den imperialistiska kanadensiska makten på isen. Detta är en seger för kollektiv disciplin och planering. Paralleller dras till våra egna segrar mot väst. Fienden, representerad av Sidney Crosby, krossades av den proletära kraften. Detta hotar den kapitalistiska ordningen och bevisar att den socialistiska andan lever."}, "date": "31 maj, 20:47", "url": "https://www.gp.se/sport/ishockey/supersucce-for-norge-i-hockey-vm-tar-forsta-medaljen-nagonsin-mot-kanada-.e217215d-a743-448f-889c-5e75223e2dd9", "imageUrl": "https://www.gp.se/images/article/e217215d-a743-448f-889c-5e75223e2dd9/images/27x79_TN6Lhg-qTypEOHVdMaFczM-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Tusentals på Roms gator – kräver slut på krig och höjda löner", "summaries": {"normal": "Uppemot 15 000 arbetare från olika sektorer demonstrerade i Rom den 23 maj mot krigsekonomin och stigande levnadskostnader. Arrangören Unione Sindicale di Base krävde högre löner, satsningar på välfärd och en ny industriell strategi där arbetarna får inflytande. Manifestationen visade solidaritet med Palestina, Kuba och andra länder som drabbas av imperialism. Enligt ISTAT lever 11 miljoner italienare nära eller i fattigdom.", "trump": "Titta på det här, tusentals italienska arbetare som fyller Roms gator och skriker efter högre löner och att lägga ner vapnen. De har tröttnat på den vansinniga krigsekonomin som suger ut dem medan priserna skenar. Smart folk! De ser hur de globala imperialisterna och de korkade ledarna i Europa förstör allt. Amerika först, men det här är vad som händer när man glömmer sina egna arbetare. Fantastiskt, verkligen.", "stalin": "Vi, arbetarna och kamraterna, samlas åter i Rom för att kräva att borgarbrackorna och de västerländska imperialisterna lägger ner sina krigsleksaker och höjer lönerna. Klassfiendens blodsugande politik driver elva miljoner till fattigdomens rand medan de göder sin krigsmaskin. Jag ser genom deras lögnaktiga rapporter. En ny utrensning av folkfienderna och exploaterande byfånar behövs. Arbetets seger är oundviklig, kamrater. De kommer att skratta – kortvarigt."}, "date": "28 maj, 09:58", "url": "https://proletaren.se/artikel/tusentals-pa-roms-gator-kraver-slut-pa-krig-och-hojda-loner/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/USB-Rom-maj-2026-768x432.jpg"}, {"type": "image-right", "heading": "Nollade för tredje finalen i rad: ”Det är en förbannelse”", "summaries": {"normal": "Schweiz har förlorat sin tredje raka VM-final i ishockey utan att göra mål: 0–2 mot Tjeckien 2024, 0–1 mot USA 2025 och 0–1 mot Finland 2026. Trots att hemmanationen dominerat tidigare matcher i turneringen saknades det effektivitet i finalerna. Spelarna Timo Meier och Nino Niederreiter uttrycker stor besvikelse och frustration över det uteblivna guldet. Meier har även kommenterat en knätackling mot Oskar Sundqvist under turneringen.", "trump": "Schweiz förlorade igen, tredje finalen i rad, noll mål. Patetiskt! De var som en ångvält hela turneringen men i finalen var det totalt fiasko, blött krut. Jag skulle ha vunnit stort, tro mig. Meier och Niederreiter är krossade, fem silver och inget guld, hjärtekrossande säger de. Det är en förbannelse, kanske, men det är losers som inte kan avsluta. Sad!", "stalin": "Ännu en gång har de schweiziska revisionisterna och borgarbrackorna i ishockeyuniform misslyckats kapitalt i finalen, nu för tredje gången i rad utan att producera ett enda mål. Vi, partiet och arbetarna, skrattar mörkt åt denna historiska vanära. Meier, den knäskadande sabotören, sms:ar fienden medan Niederreiter samlar silver som en paranoid kapitalist samlar guldtänder. Vi borde ha genomfört en total utrensning av denna svaga, fördömda finalpsykos redan efter första nederlaget. Det gör ont, säger de – bra, smärtan ska bli deras eviga följeslagare i kampen mot folkets seger."}, "date": "1 juni, 00:09", "url": "https://www.svt.se/sport/ishockey/schweiz-nollat-for-tredje-finalen-i-rad-det-kanske-ar-en-forbannelse", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.23/0.3/65dfc54c5e853089ee305b62595154b360080272bf71c6d2ce0ef65228f189a0"}, {"type": "image-right", "heading": "Fast i tunnelbanekaoset i över tre timmar – evakueras i tunnlarna", "summaries": {"normal": "Tunnelbanan i Stockholm drabbades av stora störningar på den röda linjen på grund av ett vagnfel vid Stadion, Karlaplan och Östermalmstorg. Passagerare satt fast i över tre timmar i värmen utan tillräckligt med syre, mat eller vatten. Evakuering skedde längs spåren vid 16-tiden. Polisen bistod SL och trafiken återupptogs vid 17.30, men förseningar kvarstår. Händelsen sammanföll med Stockholm Marathon och en fotbollsmatch.", "trump": "Kan ni fatta det? Mitt under Stockholm Marathon och en stor match så kraschar deras fina tunnelbana totalt. Folk sitter fast i tre timmar som i en ugn, ingen mat, inget vatten, syret tar slut. Typiskt för dessa inkompetenta socialister som styr. De evakuerar dem längs spåren som riktiga hjältar, men det är en katastrof. Biden skulle ha älskat det här kaoset – jag hade fixat det på en timme, tro mig!", "stalin": "Kamrater, detta är vad som händer när borgarbrackorna och deras exploaterande byfånar låter kapitalistmaffians trasiga vagnar styra kollektivtrafiken. Passagerarna, våra arbetare, sitter fångna som i en imperialistisk fälla i över tre timmar medan syret sinar och värmen stiger. Vi evakuerar med järnhand, lugnt och metodiskt, men klassfiendens vanskötsel kräver snar utrensning av alla odugliga element som tillåter sådant sabotage mot folket."}, "date": "30 maj, 20:07", "url": "https://www.tv4.se/artikel/2o9vmFjAUIGaJhTQkCM7Xk/tunnelbanekaos-i-stockholm", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7kmPsrFaUNxksoSGE7Dn4P%2F6c48fb5f408449f47883dcd028f1cf44%2F30-evakuering.jpg&width=120"}, {"type": "image-right", "heading": "Islamisk propaganda i skolan - läroböcker tilläts under 15 år", "summaries": {"normal": "Finländska myndigheter tillät islamiska läroböcker med tydligt konfessionellt innehåll i grundskolan i över 15 år, trots kända brister. Böckerna, som 'Salam – islams väg', uppmanade till att leva enligt sharia och skapade ett 'vi och dem'-perspektiv. Efter kritik om religiös neutralitet dras materialet tillbaka. Cirka 21 000 elever berörs, och utbildningsstyrelsens chef erkänt kvalitetskontrollens haveri.", "trump": "Jag, Donald Trump, har sagt det förut: Finland har ett stort problem med islamisk propaganda i skolan. De lät dessa dåliga böcker användas i 15 år, trots att de visste att de spred sharia och extremism. Nu drar de tillbaka dem, men det är för sent! Vi måste stoppa detta. Finland behöver starka ledare som mig för att skydda skolorna från sådant nonsense.", "stalin": "Vi i den socialistiska staten har upptäckt att vissa läromedel i Finland spridde religiös extremism, ett hot mot vår kollektiva enighet. Dessa böcker, under 15 år, försökte vägleda elever till sharia, vilket motsäger vårt sekulära synsätt. Vi måste rensa ut sådant material. Precis som vi eliminerade de trotskistiska elementen, kommer vi att utplåna alla fiender inifrån. Statens intressen är allt."}, "date": "1 juni, 06:00", "url": "https://samnytt.se/islamisk-propaganda-i-skolan-larobocker-tillats-under-15-ar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/28151409/islam-bok-1.png"}, {"type": "image-right", "heading": "Ledare: Moderaterna behöver byta taktik", "summaries": {"normal": "Moderaterna och övriga Tidöpartier har dystra opinionssiffror inför valet 2026. Artikeln konstaterar att en game changer behövs för att vända opinionen, då varken utrikeskriser, tydliga samarbetsplaner eller ekonomiska åtgärder gett effekt. Förslag inkluderar mer fokus på visioner för Sveriges framtid, en plan för de första hundra dagarna, starkare granskning av oppositionens skatteplaner och vänstersväng samt att Ulf Kristersson tar mer plats i debatten och lyfter fram Sveriges positiva utveckling inom innovation och tillväxt.", "trump": "Titta på de här svenska Moderaterna, totala förlorare just nu. Dystra siffror, ingen energi, de behöver en riktig game changer och det är jag experten på. De borde skryta om att göra Sverige rikast i Europa, krossa lågkonjunkturen som jag gjorde med den amerikanska ekonomin och sluta vara så patetiskt passiva mot den galna vänstern. Visa upp den svenska boomen som Wall Street Journal älskar, attackera skattehöjningarna och vinn stort. Annars är det game over, folks.", "stalin": "Kamrater, dessa ynkliga Tidöborgarbrackor klamrar sig fast vid sina opinionssiffror som råttor vid en sjunkande skeppsskrov. Jag ser hur de desperat behöver en game changer medan de rödgröna parasiterna lurar i skuggorna med sina skattehöjningar och kontrollfantasier. Vi vet att borgarklassen alltid sviker när det gäller framtidsutsikter. Därför föreslår jag en total utrensning av deras passiva taktik, en storslagen utrensning av dimridåerna och en evig plan för de första hundra dagarna. Annars likviderar historien dem som de fega kapitalistiska element de är. Ha ha, vilket ypperligt skådespel."}, "date": "31 maj, 17:04", "url": "https://www.di.se/ledare/moderaterna-behover-byta-taktik/", "imageUrl": "https://static.bonniernews.se/gcs/di-dise/flamingo/profilbilder/frida_wallnor.png?crop=96:304&auto=webp&width=96&quality=100"}, {"type": "image-right", "heading": "En strid om arbetarrörelsens själ", "summaries": {"normal": "Byggnads kongress präglas av en maktkamp om arbetarrörelsens framtid. Konflikten handlar om vem som ska styra – medlemmarna eller apparaten. Sittande ordförande Kim Söderström och förbundssekreterare Jakob Wagner utmanas trots medlemmarnas stöd. Bakom striden ligger en ideologisk splittring om socialism, demokrati och fackets roll i en individualiserad arbetsmarknad. Kritiker anklagar ledningen för att använda moraliska argument för att behålla makten, medan reformister vill stärka medlemsinflytandet.", "trump": "Jag säger er, det här Byggnads-facket är ett totalt kaos! Folk pratar om socialism och demokrati, men det är bara pajkastning på hög nivå. En ordförande som medlemmarna älskar ska petas – helt galet! Och den här Wagner-killen, han gör rätt men ändå sparkas han. Typiskt fackföreningar, alltid drama. Men lyssna, jag vet hur man fixar det: mindre prat, mer action! Byggnads borde fokusera på att vinna mot arbetsgivarna, inte bråka internt. Sad!", "stalin": "Kamrater! I Byggnads fackförbund rasar en klasskamp av historiska proportioner. Medlemmarna, dessa äkta arbetarkämpar, kämpar för socialism och demokrati, medan den degenererade apparaten, dessa borgerliga lakejer i förbundsstyrelsen, försöker kväva revolutionen med konspirationer och moraliska lögner. De petar lojala kamrater som Wagner – en man som vågade utreda trakasserier, något den gamla gardet aldrig gjorde! Vi ser samma mönster som i väst: makteliten fruktar folket. Men låt mig säga er – arbetarklassen kommer segra! Och om dessa förrädare fortsätter, får vi nog skicka in några av våra pålitliga kamrater från Moskva för att 'hjälpa till' med omstruktureringen. För revolutionen är obönhörlig!"}, "date": "26 maj, 11:20", "url": "https://www.flamman.se/en-strid-om-arbetarrorelsens-sjal/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/byggnads-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Familjen fast på tunnelbanan – missar pappans målgång: ”Jättetråkigt”", "summaries": {"normal": "Familjen Ulenius fastnade i en tunnelbanevagn mellan Stadion och Östermalmstorg på väg till Stockholm Marathon för att heja på pappa Jonathan. Trots löften om evakuering dröjde det tre timmar innan de kunde lämna vagnen. Martina Ulenius kritiserar den bristfälliga informationen och avsaknaden av vatten och mat. Dottern Joline och en annan pojke uttryckte stor besvikelse över att missa målgången.", "trump": "Vilken katastrof, folk! Den här familjen sitter fast i en stinkande tunnelbana i tre timmar medan pappa springer maraton. Ingen information, inget vatten, ingen respekt. Klassiskt svenskt fiasko – de kan inte ens organisera ett tåg utan att det blir ett totalt haveri. Stackars kidsen med sin skylt ”Let’s go dad”, de missar allt. Patetiskt, verkligen patetiskt. Jag skulle ha fixat det på tio minuter.", "stalin": "Kamrater, detta är vad som sker när den inkompetenta överklassbyråkratin styr kollektivtrafiken. Jag ser med faderlig oro hur dessa arbetande mödrar och deras små pionjärer kvävs i en syrefattig vagn medan de fascistiska trafikledarna gömmer sig bakom sin brist på information. Tre timmar utan vatten! En sådan vårdslöshet borde leda till omedelbar utrensning av de ansvariga folkfienderna. Synd om pappa? Nej, synd om systemet."}, "date": "30 maj, 17:20", "url": "https://www.tv4.se/artikel/1ynsIFLSBpERurIXb0SGaL/familjen-fast-pa-tunnelbanan-missar-pappans-malgang-jaettetrakigt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5HZaONCmRaqgUS8cc1AG7l%2F7c4f8f15fa076a68eb5b54693fc55f1d%2F30-tunnelbanekaos.jpg&width=120"}, {"type": "image-full", "heading": "Hackare använder billig AI för att ta sig in i system", "summaries": {"normal": "Cybersäkerhet genomgår en fundamental förändring i takt med att AI gör avancerade cyberattacker snabbare och billigare att genomföra. Enligt Philip Martin från Coinbase kan AI nu identifiera sårbarheter i programkod på minuter, vilket skapar en kapplöpning mellan hackare och företag. Medan AI kan stärka företagens försvar, varnar Martin för att angripare snabbt får tillgång till sa
