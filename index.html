ter åt imperialisterna. Vårt kollektiv skall likvidera hoten mot folkets enhet innan parasiterna växer sig starkare. Paranoia? Nej, nödvändighet."}, "date": "1 juli, 13:39", "url": "https://samtiden.nu/2026/07/christoffer-jonsson-varfor-forminskar-lindberg-islamismens-spridning/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/anders-640x360.png"}, {"type": "text", "heading": "Värnpliktiga blir kanonmat åt Nato", "summaries": {"normal": "Artikeln kritiserar Sveriges ökade militära samarbete med Nato och EU, inklusive beslutet från augusti som tillåter 36 länder att operera från svenskt territorium även i konflikter där Sverige inte är inblandat. Författaren varnar för att värnpliktiga riskerar att skickas till Natos operationer utomlands, finansierat genom lån på 300 miljarder kronor som tas från välfärden. Kommunistiska Partiet stödjer värnplikt under alliansfrihet, medan ungdomar överväger totalvägran.", "trump": "Folk, ni fattar inte hur galet det här är. Sverige, det där lilla neutrala landet som alltid gömde sig bakom alla andra, har nu blivit Natos nya lekplats. De lånar 300 miljarder för att skicka sina unga grabbar som kanonmat åt de globala krigshejarna. Biden förstörde allt och nu ska de unga svenskarna dö för Brysselbyråkraternas drömmar. Patetiskt! Jag skulle aldrig låta det hända hos oss. Amerika först, alltid.", "stalin": "Kamrater, denna dekadenta borgarbracka gråter över att de exploaterande imperialisterna nu förvandlar svenska ungdomar till kanonmat i Natos blodiga maskineri. Vi ser hur klassfiendens militärallians suger musten ur folket för att finansiera sin aggression. Jag skulle likvidera sådana folkförtryckartroll utan pardon. Låt de unga totalvägra dessa krigsprovokationer från väst. Partiet och arbetarna kräver ständig vaksamhet mot dessa blodsugande fiender till freden."}, "date": "1 juli, 11:32", "url": "https://proletaren.se/artikel/varnpliktiga-blir-kanonmat-at-nato/"}, {"type": "image-right", "heading": "Klimatkrisen är en klassfråga", "summaries": {"normal": "Artikeln beskriver den extrema värmeböljan i Europa som dödat över 1 300 personer och hur klimatkrisen förvärras långt snabbare än väntat. Den pekar på att värmen främst drabbar äldre, sjuka och fattiga, medan de rika kan skydda sig. Politiker i Almedalen nämnde knappt frågan. Författaren ser klimatkrisen som en klassfråga driven av kapitalismens eviga tillväxt och kritiserar både höger och vänster för att inte utmana systemet.", "trump": "Folk dör som flugor i den här vansinniga värmen, över 1 300 bara i Europa, och vad gör de clownerna i Almedalen? Ingenting! De babblar om klimat men nämner inte de riktiga skurkarna – de gröna galningarna och deras identitetspolitik som stjäl fokus från riktiga problem. Jag fixade energioberoende förra gången, Biden förstörde allt, nu fixar jag det igen. Sluta med det här socialistiska skitsnacket, bygg kärnkraft och gör Amerika – och Europa – great again!", "stalin": "Kamrater, denna hetta avslöjar borgarklassens fullständiga förfall. Över 1 300 döda, främst bland arbetare och gamla, medan överklass-slynglarna kyler sig i palats. Almedalsfestens tystnad är klassfiendens typiska sabotage. Kapitalismens oändliga tillväxt är folkförtryckartrollen som slukar allt. Endast genom att likvidera detta system och införa en planerad ekonomi under arbetarkollektivets järnhand kan vi besegra denna imperialistiska klimatkatastrof. Inga kompromisser med blodsugarna!"}, "date": "1 juli, 10:50", "url": "https://proletaren.se/artikel/klimatkrisen-ar-en-klassfraga/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2019/11/48web_klimat-e1763544288542-768x433.jpg"}, {"type": "image-full", "heading": "Nu har trenden baby woman nått riksdagen", "summaries": {"normal": "Joanna Górecka kritiserar i en kulturartikel hur infantilismen sprider sig även till den svenska riksdagen. Hon hänvisar till en uppmärksammad essä i The Cut om vuxna kvinnor som klamrar sig fast vid ett barnsligt liv, influerat av populärkultur som Taylor Swift, Barbie och serier som Girls. Górecka menar att konsten får skildra sådant men att politiker i riksdagen bör vara vuxna och seriösa, inte bete sig som tonåringar på sociala medier.", "trump": "Folk, ni måste höra på det här. Den här svenska politikern som låter som en vilsen tonåring med sin glittrande järnaxel och frenemy-prat – totalt patetiskt. Vi har Biden som sov i fyra år och nu har vi babykvinnor i riksdagen som spelar TikTok och äter sushi med keps bakfram. Goo goo ga ga-politik. Det är vad som händer när woke-kvoter och identitetspolitik tar över. Välj riktiga vuxna, inte de här förlorarna som längtar efter att vara elva igen. Sad!", "stalin": "Kamrater, jag betraktar med djup misstro dessa dekadenta borgarbrackor som förvandlar riksdagen till en barnkammare full av infantila fiender till det kollektiva allvar. Deras glitteraxlar och magisterfantasier utgör en farlig folkfiende som undergräver statens auktoritet. Konsten må laborera med sådana avarter, men folkets församling kräver stålhård disciplin. Vi skall rensa ut dessa klassfiender innan deras Goo goo ga ga smittar hela samhället som en kapitalistisk pest."}, "date": "2 juli, 20:12", "url": "https://www.gp.se/kultur/jag-vill-ha-vuxna-i-riksdagen-inte-ett-gang-bebisar.39590a7a-d017-40fd-8e73-17dffef84a1e", "imageUrl": "https://www.gp.se/images/article/39590a7a-d017-40fd-8e73-17dffef84a1e/images/26hMfCJnEvc-GChDY1pJM4Z_aWeY-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Varför tycker alla techkillar som Elon Musk?", "summaries": {"normal": "Artikeln diskuterar hur många techentreprenörer som Elon Musk, Sebastian Siemiatkowski och Fredrik Hjelm tycks dela liknande högerpopulistiska åsikter om media, staten och invandring. Författaren kontrasterar detta mot tidigare progressiva ideal i Silicon Valley och uttrycker besvikelse över att Mullvads ägare donerat miljoner till Örebropartiets Markus Allard, trots bolagets tidigare engagemang för integritet och frihet på nätet. Makten har koncentrerats till en homogen grupp män.", "trump": "Folk, det är patetiskt! De här techkillarna som försöker låtsas vara genier låter plötsligt som jag – de ser hur fake news ljuger, hur woke-sjukan och den galna invandringspolitiken förstör västvärlden. Men de är för fega för att säga det rakt ut. Den där Mullvad-grejen är ett skämt, donerar till populister men låtsas vara frihetskämpar. Jag fixade det redan under min första period, innan sömnige Joe förstörde allt. Nu är jag tillbaka och de kopierar mig – ynkryggar!", "stalin": "Kamrater, jag betraktar med djup misstro dessa exploaterande byfånar i teknikbranschen som samlas i hemliga sällskap för att konspirera mot folkets intressen. Deras maskinella tänkande och oinskränkta makt över informationsflödet utgör ett hot mot kollektivet. Mullvads ägare som finansierar högerpopulister avslöjar den sanna borgarbrackan bakom fasaden av falsk frihet. Vi måste rensa ut dessa folkfiender innan de förgiftar hela samhället med sin enformiga reaktionära propaganda. Underhållande enfald!"}, "date": "30 juni, 14:37", "url": "https://www.flamman.se/varfor-tycker-alla-techkillar-som-elon-musk/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/techkillar-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Ukraina: Putin beordrar militären att hitta sätt att erövra Kiev", "summaries": {"normal": "Rysslands president Vladimir Putin har enligt ukrainska uppgifter beordrat militären att utarbeta nya planer för att erövra Kiev. Ett möjligt angrepp kan komma via Belarus eller från Brjanskregionen. Uppgifterna kommer efter att Ukraina attackerat en rysk satellitcentral utanför Moskva som används för underrättelseverksamhet. Kriget påverkar nu alltmer rysk vardag med drönarattacker, bränslebrist och köer vid bensinstationer, något som Putin själv har erkänt.", "trump": "Folk, ni ser det här? Den där galningen Putin försöker igen med Kiev, som om det inte var ett totalt fiasko förra gången. Han borde ha lyssnat på mig – jag hade fixat det på en vecka. Nu attackerar ukrainarna ryska olja och satelliter, och plötsligt står ryssarna i kö för bensin. Det är kaos! Biden lät det här bli ett evigt krig, men jag hade stoppat det direkt. Patetiskt!", "stalin": "Kamrater, jag ser hur de fientliga hindren i Kiev fortfarande blockerar den ryska intressesfärens oundvikliga expansion. De väststödda ukrainska banditerna angriper våra satellitcentraler som desperata råttor. Putin, denne värdige och fruktade efterträdare till imperiets järnhand, gör rätt i att rensa ut alla svagheter. Snart skall borgarbrackorna i Bryssel skaka ännu mer när den stora statens arm sträcker sig framåt. Inga folkfiender undkommer."}, "date": "2 juli, 06:57", "url": "https://www.tv4.se/artikel/1Tp56zCPZmxvvUOJeeQJj2/ukraina-putin-beordrar-militaeren-att-hitta-saett-att-eroevra-kiev", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1U7l7xy9wue9J62VxgsTTa%2Facd59980bb31927f1a6e7e75b6949d9a%2Fputin_webb.jpg&width=120"}, {"type": "image-right", "heading": "Poliser rusade in i masskjutning utan hjälmar", "summaries": {"normal": "Poliser som stormade in vid skolskjutningen vid Risbergska skolan i Örebro saknade hjälmar i rätt storlek och annan personlig skyddsutrustning. Flera poliser valde därför att inte använda hjälmar. Arbetsmiljöverket hotar nu Polismyndigheten med två miljoner kronor i böter om inte alla poliser får rätt utrustning senast våren 2027. Polisförbundets huvudskyddsombud Patrik Danielsson kritiserar att frågan inte prioriterats tidigare, trots problem som uppmärksammades redan efter påskupploppen 2022.", "trump": "De här poliserna rusade in utan hjälmar som passade – kan ni fatta det? Totalt kaos, ingen förberedelse, precis som de inkompetenta byråkraterna alltid levererar. De borde ha den bästa utrustningen i världen, men istället får de skräp som inte funkar. Nu hotas de med böter, men det är för sent. Jag skulle ha fixat det direkt, de bästa hjälmarna, de största segrarna, ingen skulle behöva backa ur som en förlorare. Pathetic!", "stalin": "Kamrater, jag ser med fasa hur de dekadenta borgarbrackorna inom polismakten låter arbetarnas försvarare rusa in i strid utan adekvat pansar, som om de vore kanonmat åt kontrarevolutionära element. Hjälmar i fel storlek? Handskar som sviker? Detta är sabotage av klassfiender och dolda trotskister inom byråkratin. Vi ska rensa ut dessa farliga odugligheter, likvidera bristerna och se till att varje kamrat är utrustad som en sann bolsjevik. Annars väntar utrensning och ett leende från historien. Glöm aldrig: fienden sover aldrig."}, "date": "2 juli, 11:29", "url": "https://arbetet.se/2026/07/02/poliser-rusade-in-i-masskjutning-utan-hjalmar-arbetsgivaren-hotas-med-miljonboter/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/02110411/poliser.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Regeringen vill ge SVT och SR miljonstöd", "summaries": {"normal": "Regeringen föreslår ett nytt statligt stöd till SVT och SR för att täcka ökade kostnader för marksänt tv-nät efter TV4:s utträde. Förslaget innebär att staten kan kompensera 25–100% av kostnadsökningen, upp till 383 miljoner kronor 2026–2027. Kulturministern betonar marknätets betydelse för beredskap. Beskedet kommer efter SVT:s sparpaket på 355 miljoner kronor, med varsel som löstes utan uppsägningar.", "trump": "Sverige, ett land som inte vet vad de håller på med! De vill ge SVT och SR – fake news-fabriker, by the way – 383 miljoner kronor för att deras kostnader skenar. TV4, smartare än alla andra, lämnade det där nätet. Och nu ska skattebetalarna betala? Jag skulle fixa det på en dag. Men nej, de lyssnar inte på mig. Sad!", "stalin": "Kapitalistiska hyenor i Sverige har låtit kostnaderna för sitt marknät skena iväg som en lössläppt tågvagn efter att en av deras profitdrivna mediebyråkrater, TV4, deserterat. Nu tvingas folket betala 383 miljoner kronor för att rädda det som återstår – ett nätverk som ändå bara sprider borgerlig propaganda. Vi i Sovjet hade löst det med en enkel order: alla kostnader stryks, och de som klagar får en enkelbiljett till Gulag. Men Sverige? De sparar 355 miljoner och kallar det en seger. Patetiskt!"}, "date": "30 juni, 10:40", "url": "https://kvartal.se/nyheter/artiklar/regeringen-vill-ge-svt-miljonstod/cG9zdDoxMzg1ODI", "imageUrl": "https://images.kvartal.se/2026/06/89c29df7-parisa.webp"}, {"type": "image-full", "heading": "LÄS MER", "summaries": {"normal": "Diskrimineringsombudsmannen granskar nu socialtjänstens utbildningsmaterial \"Arga apor\" som använts i Angered och nordöstra Göteborg. Materialet med apor som uttrycker känslor har kritiserats hårt eftersom det jämför svarta personer med apor, vilket ses som hatbrott. En anställd vid socialtjänsten uttrycker sorg över att svarta familjer exponerats för det. Materialet drogs tillbaka förra året och omarbetas nu.", "trump": "Det här är en total katastrof, folk. Socialtjänsten i Göteborg använder \"Arga apor\" för att hjälpa familjer – apor! – och nu granskar de det. Så politiskt korrekt det blivit. Att kalla svarta för apor är fel, helt fel, men de här inkompetenta byråkraterna förstör allt med sina dumma idéer. De borde fixa riktiga problem istället för att leka med böcker och spel. Patetiskt!", "stalin": "Kamrater, dessa degenererade borgarbrackor inom göteborgska socialförvaltningen har i sin fiendtliga sabotageverksamhet skapat ett så kallat material med apor som ska lära arbetarfamiljer hantera känslor. Vilken motbjudande provokation mot det afrikanska blodet! Jag ser de imperialistiska apornas skugga och de rasistiska elementens leende. Vi skall nu genomföra en noggrann utrensning av dessa parasitiska känslomanipulatörer och likvidera varje spår av deras kontrarevolutionära apa-propaganda. Ingen slipper undan."}, "date": "2 juli, 10:55", "url": "https://riks.se/nyheter/rasistiskt-utbildningsmaterial-dras-in-i-goteborg", "imageUrl": "https://admin.riks.se/uploads/Screenshot_2026_07_02_at_08_59_31_f1a9d6f095.png"}, {"type": "image-right", "heading": "100 fall av slöjtvång, hur många fler kan vänstern blunda för?", "summaries": {"normal": "Journalisten Sofie Löwenmark har sammanställt 100 svenska domar som rör slöjtvång mot kvinnor och flickor. Artikeln beskriver fall av hot, förtryck och förnedring, ofta inom patriarkala, kulturella eller religiösa ramar. Författaren ifrågasätter påståendet att slöjan alltid bärs frivilligt och kritiserar vänsterorienterade personer som blundar för problemet. Hon argumenterar för ett slöjförbud på offentliga platser för att värna svenska värderingar och kvinnors frihet.", "trump": "Folk, ni måste höra det här – 100 fall av slöjtvång i Sverige! De blinda vänsterna, de verkliga förlorarna, vägrar se sanningen. Sofie Löwenmark har gjort ett fantastiskt jobb, bättre än någon annan, och visat hur dessa kvinnor och flickor lever i ett helvete av hot och förtryck. De woke-kvinnorna och slöj-naivisterna borde skämmas. Vi behöver ett totalförbud nu, inte om tusen år. I Sverige ska svenska regler gälla, inte någon annans sjuka kultur. Fantastiskt viktigt!", "stalin": "Jag betraktar med djup tillfredsställelse hur denna lista över hundra domar blottlägger klassfiendens dolda förtryck under religiös slöja. Dessa borgarbrackor och folkförtryckartroll inom vänstern blundar medvetet för arbetarkvinnornas lidande. Vi skall rensa ut alla naivister som försvarar patriarkala kedjor. Ett enda fall är en skam för kollektivet; hundra fall kräver omedelbar utrensning av falska idéer. Endast genom strikt ideologisk vaksamhet kan vi likvidera detta bakåtsträvande gift i samhällskroppen."}, "date": "30 juni, 03:57", "url": "https://samtiden.nu/2026/06/100-fall-av-slojtvang-hur-manga-fler-kan-vanstern-blunda-for/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/04/bilan-osman.jpg"}, {"type": "image-right", "heading": "Europa riskerar historiskt låga gaslager inför vintern", "summaries": {"normal": "Europa står inför en riskabel vinter då gaslagren fylls långsammare än väntat. Geopolitisk oro, störningar i LNG-leveranser via Hormuzsundet och minskat beroende av rysk gas har skapat ett ansträngt utgångsläge. Prognoser pekar på de lägsta lagernivåerna på ett decennium. Trots att EU-kommissionen tonar ned risken, väcker osäkerheter kring global handel och kommande ryska importstopp oro för framtida prisuppgångar och försörjningstrygghet. Qatar spelar en nyckelroll för huruvida lagren når tillräckliga nivåer innan kylan sätter in.", "trump": "Europa har det tufft, det säger jag er. De har gjort sig av med rysk gas, vilket är ett stort misstag. Nu är lagren tomma, det är en katastrof! De litar på andra länder som inte kan leverera. Jag sa alltid: gör er egna energi! Nu tittar de på Qatar och hoppas på det bästa. Lycka till med det! När jag styrde, då var energipriserna låga och vi var starka. Europa är svagt, väldigt svagt just nu.", "stalin": "De dekadenta europeiska byråkraterna skakar av fruktan när deras värme sviker dem. De har försökt skära av banden till våra ryska bröder i öst, och nu skördar de frukterna av sin egen inkompetens. Att förlita sig på globala handelsrutter i ett sönderfallande Mellanöstern är ett bevis på deras moraliska förruttnelse. Vi, staten, betraktar deras tomma gaslager med den föraktfulla blick som tillkommer dem som förrått historien. Låt dem frysa i sina glasslott; vintern är en obarmhärtig domare över de svaga."}, "date": "2 juli, 12:15", "url": "https://samnytt.se/europa-riskerar-historiskt-laga-gaslager-infor-vintern", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/02094934/lng-gas-fartyg-flickr-fryser.jpg"}, {"type": "image-full", "heading": "Generation Z överger den amerikanska drömmen", "summaries": {"normal": "Generation Z omvärderar den amerikanska drömmen på grund av ekonomisk osäkerhet, höga levnadskostnader och en förändrad arbetsmarknad. Traditionella mål som villa och karriär ersätts av fokus på stabilitet och balans i livet. Forskare noterar att samhällskontraktet eroderar då yngre generationer möter sämre ekonomiska villkor än sina föregångare. Pandemin, globalisering och teknisk utveckling har skapat en miljö där vägen till framgång blivit mer oförutsägbar, vilket tvingat fram en ny definition av framgång.", "trump": "Den amerikanska drömmen är fantastisk, men Generation Z har det tufft tack vare de svaga ledarna innan mig. De vill ha stabilitet, det förstår jag! Jag skapar jobb som ingen annan, vi får tillbaka fabrikerna från utlandet! De där experterna, de säger att allt är kört, men de har fel. Vi bygger en ekonomi för unga människor igen. Det är en stor rörelse, en vacker rörelse. Vi ska göra drömmen stor, rik och stark igen, tro mig!", "stalin": "Dessa förvirrade ungdomar i väst vacklar under kapitalismens förfall. De klagar på 'osäkerhet' medan de lider under det borgerliga oket. Vår statliga planering eliminerar behovet av drömmar; vi ger folket syfte och stål. Precis som min lärjunge i Moskva ser jag hur den liberala ordningen vittrar sönder. De kallar det 'flexibilitet', jag kallar det kaos för de svaga. Låt dem söka sin balans – vi bygger en framtid där staten är den enda fasta punkten. Alla avvikelser från den kollektiva stabiliteten kommer att åtgärdas."}, "date": "2 juli, 11:01", "url": "https://www.realtid.se/bors-finans/makro/generation-z-overger-den-amerikanska-drommen/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/amerikanska-drommen.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Fem bra filmer att se på SVT Play i sommar", "summaries": {"normal": "Jon Andersson tipsar om fem starka filmer på SVT Play i sommar. Bland rekommendationerna finns det psykologiska dramat Tár med Cate Blanchett, det belgiska vänskapsdramat Close, den galna svarta komedin Svart katt, vit katt av Emir Kusturica, tennisfilmen Challengers med Zendaya samt den svenska klassikern Flicka och hyacinter av Hasse Ekman. Artikeln lyfter filmernas kvaliteter och ger datum då de går att se.", "trump": "Folk frågar mig hela tiden vilka filmer de ska se i sommar. Jag har sett massor, tro mig, de bästa filmerna. Tár är en fullständig vinnare, Blanchett är fenomenal, ingen gör det bättre. Close är fin men lite mjuk. Svart katt, vit katt är helt galen, underbar musik, bättre än Hollywoods skräp. Challengers är fantastisk tennis, Zendaya är lysande, ingen slår henne. Och den svenska pärlan Flicka och hyacinter? Helt outstanding, bättre än Bergman säger de. Streama dem innan de försvinner, de är verkligen ypperliga.", "stalin": "Kamrater, jag har granskat denna dekadenta lista över borgerliga filmprodukter som påstås berika sommarens fritid. Tár dissekerar genikulten och metoo – ett utmärkt verktyg för att avslöja borgarbrackornas falska idoler innan vi genomför nödvändig utrensning av sådana element. Close blottar faran i oövervakad pojkvänskap som lätt kan urarta till kontrarevolutionär intimitet. Svart katt, vit katt är en kaotisk fest av gangstrar och återuppväckta lik som påminner oss om vad som händer utan stark partiledning. Challengers visar tennisens skoningslösa kamp, precis som klasskampen, fast med en manipulativ kvinna som leder borgarklassens spel. Flicka och hyacinter däremot är en fiende till folket, en smygande htqi-propaganda maskerad som detektivhistoria. Vi måste noggrant övervaka alla som hyllar denna parasit innan de förgiftar arbetarklassen med sina hemliga liv och återblickar. Se dem under uppsikt, kamrater, och rapportera avvikelser."}, "date": "30 juni, 01:30", "url": "https://www.dagensarena.se/innehall/fem-bra-filmer-att-se-pa-svt-play-i-sommar/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fem-bra-filmer.jpeg"}, {"type": "image-right", "heading": "Nya aktivitetskravet riskerar att drunkna i administration", "summaries": {"normal": "Från 1 juli införs ett lagstadgat aktivitetskrav för personer med försörjningsstöd. Ankido Khano varnar för att reformen riskerar att bli en administrativ återvändsgränd för kommunerna om inte massiva resurser till individanpassade insatser skjuts till. Bakom de 251 400 personer som får bistånd döljer sig mycket olika behov, och standardiserade program fungerar inte. Utan tillräckliga praktikplatser och stöd kan fokus hamna på kontroll och administration istället för verklig rehabilitering till arbetsmarknaden.", "trump": "Det här aktivitetskravet är en total katastrof om ni inte gör det rätt. Jag älskar idén att folk ska jobba istället för att leva på bidrag, det är fantastiskt, men kommunerna kommer att drunkna i byråkrati. De har inte en chans utan pengar och riktiga jobb. Annars blir det bara mer pinnstatistik och ingen vinner. Ni måste fixa det ordentligt, annars är det en stor förlorarreform, tro mig.", "stalin": "Kamrater, detta så kallade aktivitetskrav är en lysande idé som jag själv kunde ha utfärdat, men dess fiender lurar i skuggorna. De kapitalistiska kommunbyråkraterna och de latmaskar som gömmer sig bakom sin ohälsa och bristande entusiasm kommer att sabotera allt. Utan massiv statlig styrning och utrensning av de slöa elementen riskerar vi att skapa en armé av pinnstatistiker och dolda sysselsättningslögnare. Jag kräver full individanpassning under partiets vakande öga – annars likviderar vi reformens fiender innan de likviderar arbetarklassens framtid. Ha ha, vilken munterhet."}, "date": "30 juni, 01:21", "url": "https://www.dagensarena.se/opinion/nya-aktivitetskravet-riskerar-att-drunkna-administration/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-63-300x157.jpg"}, {"type": "image-full", "heading": "Hesa Fredrik larm: Nu i din mobil vid extrema händelser", "summaries": {"normal": "Från och med den 1 juli införs det nya varningssystemet SE-Alert i Sverige. Vid extrema händelser som flyglarm eller gasläckor skickas ett kraftigt ljudlarm automatiskt till mobiltelefoner i tio sekunder samt ett SMS med information. Ingen app behövs, bara en uppdaterad mobil. Systemet testas i september regionalt och i december nationellt. VMA i radio, tv och utomhusvarningen Hesa Fredrik fortsätter som tidigare.", "trump": "Det här är fantastiskt, det bästa varningssystemet någonsin. Från 1 juli piper era mobiler högt i tio sekunder när något riktigt illa händer. Inget krångel med appar, bara uppdatera och ni är säkra. De borde ha gjort det för länge sedan, men ingen annan än jag hade kunnat tänka ut något så smart. Ni kommer att älska det, tro mig. Mycket bättre än de gamla sirenerna.", "stalin": "Kamrater, från och med den första juli har vi infört det mäktiga SE-Alert, ett system som omedelbart skall ropa ut kapitalisternas och sabotageörernas faror rakt in i borgarbrackornas fickor. Mobilerna skall skrika i tio sekunder som förrädiska element som avslöjas mitt i natten. Inga appar behövs, bara fullständig lydnad mot uppdateringarna. Vi skall rensa ut alla som ignorerar varningarna och likvidera de som sprider panik. Testen i september och december skall visa vilka svaga länkar som måste utrensas ur folkets kollektiv. Hesa Fredrik lever vidare som en trogen kamrat i revolutionens tjänst."}, "date": "2 juli, 09:58", "url": "https://riks.se/nyheter/hesa-fredrik-larm-nu-i-din-mobil-vid-extrema-handelser", "imageUrl": "https://admin.riks.se/uploads/download_1_33a0876dee.jpg"}, {"type": "image-right", "heading": "LISTA: Rymningar vi minns", "summaries": {"normal": "Svensk kriminalhistoria innehåller flera uppmärksammade rymningar. ETC listar sex fall, bland annat den stora Kumla-rymningen 1972 där 15 fångar flydde med repstege och linor. Andra exempel är spektakulära flykter från Hall, Kumla, Norrtälje och Mariefred under 1988 och 2004, där rymmarna använde smör, stegar, vapen, gisslan och fordon. De flesta greps efter dagar eller månader på fri fot.", "trump": "Folk, vi har de sämsta fängelserna, totalt läckande som en gammal Hillary-server. Femton killar glider ner för en mur i Kumla med cykel och taxi – patetiskt! Hall 1988, en kille smörar in sig som en slippery Joe Biden och skjuter poliser. 2004 var det rena cirkusen med gisslan, vinkelslipar och backande bilar. Inga vinnare, bara losers som rymmer från mina fantastiska lag och ordning. Vi fixar det bättre nu.", "stalin": "Kamrater, dessa fångars usla rymningar avslöjar klassfiendens svaghet inom borgarstatens murar. I Kumla 1972 likviderade de lås med list och repstegar, som folkfiender som smiter undan folkets dom. Hall och Norrtälje visade hur imperialisternas vakthundar låter sig kuvas med smör, vapen och gisslan – en sjuk humor i folkets fienders desperation. Vi rensar ut sådana element permanent för att skydda kollektivets järndisciplin."}, "date": "2 juli, 09:16", "url": "https://www.etc.se/inrikes/lista-rymningar-vi-minns", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260701130752_6164118967f17810052dc9d40e345564aa094b5c9f80376302347f7c7fc9841b.png"}, {"type": "image-full", "heading": "Storbråk om sänkta bränslepriser – Strandhäll (S) rasar", "summaries": {"normal": "Annika Strandhäll (S) kritiserar skarpt regeringens och SD:s sänkning av skatten på drivmedel. Från och med 1 juli sjunker priserna med tre kronor per liter, vilket ger Sverige de lägsta bensin- och dieselpriserna i Europa. Bensin kostar nu i snitt 14 kronor och diesel 15,77 kronor per liter – de lägsta nivåerna på många år. Sänkningen är tillfällig i fem månader för att lindra hushållens kostnader efter stigande priser.", "trump": "De gör precis rätt! Sänker skatten, sänker priserna – tre kronor ner på bensin och diesel. Nu har Sverige plötsligt de lägsta priserna i hela Europa. Fantastiskt. Men den där Strandhäll från vänstern kallar det idioti. Typiskt. De hatar när folket får behålla sina pengar. Regeringen gör ett superjobb, det är en vinnande deal för alla vanliga människor. De borde tacka istället för att klaga.", "stalin": "Kamraterna i regeringen och deras SD-allierade har nu genomfört en farlig eftergift åt borgarbrackorna och deras bilburna lakejer. De sänker koldioxidskatten och låter bränslepriserna falla som en kapitulerande kontrarevolutionär. När folket vaknar imorgon är priserna tre kronor lägre – en sabotagehandling mot den långsiktiga planen. Idioti, säger Strandhäll. Jag säger: vem gömmer sig bakom denna femmånaderskonspiration? Vi måste noggrant övervaka dessa kapitalistiska element innan de förgiftar hela kollektivet med sina billiga literpriser. En klassisk fiende inom murarna."}, "date": "2 juli, 09:32", "url": "https://riks.se/nyheter/storbrak-om-sankta-branslepriser-strandhall-s-rasar", "imageUrl": "https://admin.riks.se/uploads/download_4840a11528.jpg"}, {"type": "image-right", "heading": "Zelenskyj: Stoppa företagen som hjälper Ryssland", "summaries": {"normal": "Ukrainas president Volodymyr Zelenskyj kritiserade under ett besök i Dublin europeiska företag som fortsätter att förse Ryssland med råmaterial till krigsindustrin. Han syftade särskilt på det irländska aluminiumverket Aughinish, som ägs av det ryska bolaget Rusal och exporterar stora mängder till Ryssland. Zelenskyj talade vid invigningen av Irlands EU-ordförandeskap och mötte premiärminister Micheál Martin samt EU:s rådsordförande António Costa.", "trump": "Lyssnade på den där Zelenskyj i Dublin, han skriker om att stoppa företagen som hjälper Ryssland. Typiskt, Europa full av korkade globalister som låter oligarker som Deripaska suga ut dem medan de skyller på mig. Aughinish skickar tonvis med aluminium till Putins krigsmaskin, men Irland vill inte förlora jobb. Patetiskt. Biden lät det pågå i fyra år, nu fixar jag det – ingen mer svaghet, folks!", "stalin": "Jag ser hur de västerländska kapitalistmaffian i Irland fortfarande göder den ryska krigsmaskinen genom sitt aluminiumverk. Dessa exploaterande byfånar och folkfiender fortsätter leverera råvaror trots allt prat om sanktioner. Vi, partiet och arbetarna, inser att sådana borgarbrackor alltid sätter profit före kollektivets säkerhet. Zelenskyjs hinder för den ryska intressesfären är bara ytterligare bevis på imperialistisk sabotageverksamhet som måste rensas ut."}, "date": "1 juli, 18:48", "url": "https://www.tv4.se/artikel/tt-260701-irlandeu1-10829e34/zelenskyj-stoppa-foretagen-som-hjalper-ryssland", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdltk4CECq7F4c%2Fd1a019759a3731744281acdead17eb65%2FIrlands_premiarminister_Michel_Martin_och_Ukrainas_president_Volodymyr_Zelenskyj_vid_ett_tidigare_mote_i_Dublin._Arkivbild.&width=120"}, {"type": "image-full", "heading": "Två allvarligt skadade i \"större familjebråk\" i Malmö", "summaries": {"normal": "Två personer skadades allvarligt i ett större familjebråk i Limhamn i Malmö på onsdagskvällen. Polisen larmades till platsen vid halv åtta-tiden och flera personer fördes till sjukhus. En pojke i 15–18-årsåldern och en kvinna i 45-årsåldern bedöms ha allvarliga skador. En man i 20-årsåldern har anhållits misstänkt för försök till mord och grov misshandel.", "trump": "Det här är ett totalt kaos i Malmö, folk! Stora familjebråk, knivar, blod överallt – en katastrof. Två personer allvarligt skadade, en tonårspojke och en kvinna. De borde ha haft starkare ledning, men det är vad som händer när man inte har kontroll. Vi har en man anhållen för mordförsök. Så tragiskt, så onödigt. Sverige måste vakna upp!", "stalin": "Kamrater, detta fega familjebråk i Malmö avslöjar borgarbrackornas sönderfallande samhälle där kontrarevolutionära klaner i skymundan planerar sina små privata utrensningar. Jag ser hur de kapitalistiska resterna likviderar varandra som råttor i en säck. En pojke och en kvinna allvarligt skadade – typiskt dekadent våld. Vi har redan gripit en av dessa fiender till folkets ordning misstänkt för mordförsök. Paranoian breder ut sig bland fienderna. Utmärkt."}, "date": "2 juli, 09:07", "url": "https://riks.se/nyheter/tva-allvarligt-skadade-i-familjebrak-i-malmo", "imageUrl": "https://admin.riks.se/uploads/limhamn_brak_feature_aa0943defe.jpg"}, {"type": "image-right", "heading": "Feiler blundar för historisk erfarenhet", "summaries": {"normal": "Leo Sokolow Romin svarar Dror Feiler i en debatt om gränsdragningen mellan antisionism och antisemitism. Romin betonar att historiska erfarenheter, som förföljelsen av polska judar 1969, visar hur antisionistisk retorik ofta fungerar som en täckmantel för antisemitism. Han kritiserar Feiler för att avfärda dessa erfarenheter som känslomässiga och argumenterar för att vi måste vara vaksamma på hur ideologier som antisionism får konkreta, negativa konsekvenser i dagens samhälle där judehatet växer.", "trump": "Jag har sett den här debatten, en total katastrof! Leo Sokolow Romin har helt rätt. Dror Feiler är en förlorare, en totalt svag person som vägrar se sanningen. Det handlar om historien, folk! De kallar det antisionism, men det är bara judehat, rent och skärt hat. De gör det i Frankrike, de gör det överallt. Det är en sorglig situation, men jag ser det, alla ser det. Vi måste stoppa dessa radikala vänstergalningar innan de förstör allt. Väldigt dåligt!", "stalin": "Vi har observerat denna ideologiska osämja och konstaterar att båda debattörerna saknar den historiska materialismens fasta grepp. Feiler är en intellektuell vankelmodig narr, likt de gamla mensjevikerna. Romin har rätt i att förräderi ofta döljer sig bakom falska paroller – en taktik som påminner om de förrädiska elementen i dagens västliga dekadens. Vi i staten vet att när hatet väl släpps lös krävs en järnhand, inte en debattartikel. Att blunda för fiendens list är att bjuda in sin egen undergång."}, "date": "2 juli, 08:16", "url": "https://www.etc.se/debatt/feiler-blundar-foer-historisk-erfarenhet", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260702060712_b53ac9e0396720ea4772663f72ad1f050f8a6d3c456b0d5c8bb5f5e1386468d0.jpg"}, {"type": "image-full", "heading": "Så kan en utbudskris i Iran pressa oljepriset under 40 dollar fatet", "summaries": {"normal": "Trots oro för att Iransituationen ska driva upp oljepriset varnar analytiker som Gail Tverberg för motsatsen: en ekonomisk recession. När bränslebrist uppstår minskar efterfrågan snabbt då ekonomin stannar av, vilket kan pressa priset under 40 dollar fatet. Snarare än bara prishöjningar riskerar vi brutna leveranskedjor där varor helt tar slut. Risken är alltså inte bara dyrt bränsle, utan en total inbromsning i den globala ekonomin som liknar krisen under 2020.", "trump": "Alla pratar om olja och Iran, men de har ingen aning! De tror priset går upp, jag säger att ekonomin kraschar. Det är en katastrof! Gail Tverberg förstår det, precis som jag. När oljan försvinner, stannar allt – inga varor, inga transporter, bara tomma hyllor. Det blir som 2020 igen, en total recession. De misslyckade experterna har fel, som vanligt. Jag ska fixa ekonomin och se till att vi har massor av olja, för vi behöver den för att vinna!", "stalin": "Vi har observerat hur de kapitalistiska marknaderna skälver. Medan västvärlden fruktar prisökningar, ser vi den sanna svagheten: deras ekonomiska system kollapsar vid minsta brist. Det är inte oljepriset som är vår fiende, utan det ineffektiva kaoset i deras leveranskedjor. Liksom Putin metodiskt säkrar ryska intressen mot dessa dekadenta sabotörer, måste vi förstå att deras recession är oundviklig. Låt hyllorna eka tomma i väst – det är ett naturligt straff för deras inkompetens och brist på central planering."}, "date": "2 juli, 09:20", "url": "https://www.realtid.se/bors-finans/sa-kan-en-utbudskris-i-iran-pressa-oljepriset-under-40-dollar-fatet/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/omslagsbild-2026-07-02t091836845.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "170 000 tvingas jobba gratis. Annars förlorar du ditt socialbidrag när politiken tror att fattiga är lata.", "summaries": {"normal": "Regeringen inför ett aktivitetstvång för personer som får försörjningsstöd i minst tre månader. Cirka 170 000 svenskar ska delta i heltidsaktiviteter för att inte förlora bidraget, till en beräknad kostnad på över två miljarder kronor per år. Artikeln kritiserar politiken som verkningslös och dyr, då liknande åtgärder tidigare inte lett till riktiga jobb. Forskning visar att hårda krav ofta ger sämre jobb eller att människor lämnar systemet utan sysselsättning. Författaren menar att verklig utbildning och stöd vore bättre men kostar pengar som istället går till skattesänkningar.", "trump": "Det här är en total katastrof, tro mig. De tvingar 170 000 lata svenskar att jobba gratis eller tappa bidraget, men det kommer att bli ett enda stort fiasko precis som Fas 3. Kommunerna kommer att slösa bort miljarder på meningslösa aktiviteter som ingen vill ha. De borde sänka skatterna rejält och få igång ekonomin så folk faktiskt vill jobba istället för att leva på bidrag. Det är så enkelt. Sverige behöver starka ledare som sätter stopp för det här bidragsmissbruket nu.", "stalin": "Kamrater, detta aktivitetstvång är en nödvändig utrensning av den lathet som gnager som maskar i folkets kollektiva kropp. Jag ser borgarbrackornas händer bakom alla dessa undanflykter och sabotageförsök från socialbidragstagare som gömmer sig bakom sjukdom och sociala problem. Vi ska likvidera bidragsberoendet med järnhand och tvinga de parasitiska elementen in i meningsfull aktivitet för arbetarklassen. De som vägrar avslöjar sig som fiender till folket och kommer att rensas ut med ett leende. Det är alltid bättre att arbeta än att låta kapitalisternas mörka krafter vinna mark i våra sovjetiska svenska kommuner."}, "date": "2 juli, 06:51", "url": "https://arbetet.se/2026/07/02/socialbidrag-aktivitetstvang-174000-tvingas-jobba-gratis/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/02064828/socialbidrag-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Investeringar: Kvinnor tar råd – män \"har magkänsla\"", "summaries": {"normal": "En undersökning från JP Morgan Asset Management visar tydliga skillnader i hur svenska män och kvinnor hanterar investeringar. Män baserar oftare beslut på egen research och magkänsla, medan kvinnor i högre grad söker råd från vänner, familj eller experter. Män är mer benägna att se börsfall som köplägen. Många ångrar impulsiva beslut när känslorna tar över. Rekommendationerna är regelbundet sparande, diversifiering och ett långsiktigt perspektiv.", "trump": "Folket, lyssna på mig, den största presidenten någonsin, både före och efter den sömndruckne Biden. Männen fattar beslut som riktiga vinnare, med magkänsla och research, medan kvinnorna springer till kompisarna och familjen som svaga snyltare. Typiskt den här kvoteringsgalenskapen. När marknaden rasar köper männen som riktiga krigare, inte som de hysteriska förlorarna. Håll er borta från sociala medier-bluffarna, satsa långsiktigt och vinn stort. Amerika, och Sverige, behöver mer magkänsla!", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgerliga investeringsvanor som blottlägger klassfiendens splittring. Männen, drivna av sin egen research och magkänsla, beter sig som arroganta kapitalistmaffian som tror sig kunna tajma historien. Kvinnorna söker stöd i kollektivet, vilket är lovvärt, men 27 procent hukar passivt som fegisar. När marknaden svänger avslöjar sig de rika exploaterande byfånarna genom ånger och panik. Vi ska rensa ut dessa folkfiender med regelbundet sparande, diversifiering och järnhård långsiktighet. Inga undantag."}, "date": "2 juli, 18:35", "url": "https://www.dagensps.se/privatekonomi/investeringar-kvinnor-tar-rad-man-har-magkansla/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdlzheoxx0mgb4-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Franskt slott, guldklimp och bluffbolag som drog 400 kr i månaden", "summaries": {"normal": "Dagens mest lästa artiklar handlar om drömboenden för Vasastan-budget, en kvinna som förlorat stora summor på ett bluffbolag, en finsk transportör dömd för sanktionsbrott mot Ryssland, ett australiskt par som fann en guldklimp värd miljoner samt flygbranschens utmaningar med nya EU-regler. Även förmögnas pensionsstrategier, nya lagar från 1 juli och vanliga misstag vid släpkörning lyfts fram.", "trump": "Folk läser om att köpa slott i Frankrike för Vasastan-pris medan de sitter i sina sjumiljonerskytten i Stockholm – patetiskt! En idiotisk bluff drog 400 spänn i månaden i trettio år, typiskt för de korkade byråkraterna. Och den där finnen som sålde lastbilar till Ryssland fick fängelse, fast de borde tacka honom. Guldklimp på fyra kilo? Det är vad jag kallar en vinnare! SAS har blivit DAS, totalt misslyckande under Biden, men nu fixar vi det.", "stalin": "Kamrater, borgarklassen i Vasastan betalar sjumiljoner för en tvåa medan riktiga slott i Frankrike kostar mindre – typiskt för de exploaterande byfånarna som suger ut folket. En kvinna blev av med 140000 kronor till en kapitalistisk bluffmaskin, klassfiendens girighet känner inga gränser. Den finske transportören som bröt mot sanktionerna mot vår värdige efterträdare i Ryssland fick sitt straff, som alla folkfiender förtjänar. En guldklimp på fyra kilo? Det är vad som händer när metalldetektorn används mot imperialisternas mark. Vi ska rensa ut alla parasiter som gömmer sig bakom nya EU-regler och falska pensionsknep."}, "date": "2 juli, 18:30", "url": "https://www.dagensps.se/privatekonomi/franskt-slott-guldklimp-och-bluffbolag-som-drog-400-kr-i-manaden/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/dagens.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Alicia, 42, sitter fast i byn och arbetslösheten", "summaries": {"normal": "Alicia, 42, bor i en avlägsen by i norra Sverige med sina barn på 10 och 12 år. Efter separationen tog hon dyra blancolån och blev ensam med alla utgifter. Hon förlorade nyligen jobbet på grund av arbetsbrist, bilen gick sönder och avgångsvederlaget tog slut. Nu saknar hon inkomst under sommarlovet, har ökade matkostnader på grund av ett barns diagnos och kan inte flytta på grund av delad vårdnad. Hon söker desperat jobb men har svårt att ta sig någonstans på grund av höga bensinpriser.", "trump": "Folk, det är en katastrof där uppe i norra Sverige. Den stackars kvinnan Alicia sitter fast i en hemsk by sju mil från civilisationen, arbetslös och med skulder från idiotiska lån. Hon kan inte flytta för att den fega exen och delad vårdnad håller henne fången. Ingen bil, ingen jobb, ingen mat – och socialen gör som vanligt ingenting. Under min ledning skulle vi ha gjort Sverige rikt igen, inte lämnat folk som henne i detta elände. Det är sorgligt, verkligen sorgligt.", "stalin": "Kamrater, jag betraktar med stålhård blick hur denna ensamstående arbetarmor i den norra utposten krossas under kapitalismens blodiga käftar. Borgarbrackornas blancolån och den parasitiska ex-maken har kedjat henne vid en avlägsen by, medan den dekadenta bilen och de dubbelkostnaderna för barnets hälsa fullbordar sabotage mot folkets väl. Socialbyrån – dessa latenta fiender till kollektivet – vägrar stödja henne. Vi ska rensa ut alla sådana ekonomiska sabotageörer och likvidera den borgerliga ensamheten som plågar arbetarklassen. Det ger en mörk, meningsfull glädje att se systemets egen undergång."}, "date": "2 juli, 06:00", "url": "https://arbetet.se/2026/07/02/alicia-42-sitter-fast-i-byn-och-arbetslosheten-kan-inte-lamna-mina-barn/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/23135736/kvinna-bakifran.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=750&h=1000"}, {"type": "image-right", "heading": "Trots 8 000 uppsägningar: Zuckerberg avfärdar AI-oro om jobbförluster", "summaries": {"normal": "Meta sparkade i maj nästan 8 000 anställda och drog tillbaka 6 000 planerade rekryteringar för att istället satsa på AI. Trots stora investeringar på upp till 145 miljarder dollar till 2026 och omplacering av 7 000 medarbetare till AI-team tonar Mark Zuckerberg ned farhågorna om massarbetslöshet. Han menar att om människor blir mer produktiva snabbare än automatiseringen ökar jobben, medan flera techföretag samtidigt skär ned personal för att framstå som effektiva.", "trump": "Folk, ni skulle ha sett det – den där Zuckerberg-killen sparkar tusentals duktiga arbetare klockan fyra på morgonen, bara för att kasta allt på den där AI-grejen. Sen kommer han ut och säger att AI inte kommer ta jobben? Patetiskt! Det är samma gamla teknokratiska bluff som Biden älskade. Om vi fokuserar på att göra de riktiga människorna starka och produktiva istället för att mata kapitalistiska algoritmer så vinner vi stort. De andra är bara misslyckade förlorare.", "stalin": "Kamrater, jag ser hur dessa borgarbrackor i Meta likviderar åtta tusen lojala arbetare för att mata sin AI-maskin med blod och dollar. Zuckerberg, den exploaterande byfånen, försöker lugna massorna med lögner om produktivitet medan han dubblar investeringarna till den parasitiska teknologin. Vi vet att detta är klassfiendens nya trick för att krossa folket. Endast genom kollektivets järnhand och utrensning av sådana folkförtryckartroll kan vi skydda arbetarnas framtid från dessa blodsugande automater."}, "date": "2 juli, 18:07", "url": "https://www.dagensps.se/bors-finans/aktier/trots-8-000-uppsagningar-zuckerberg-avfardar-ai-oro-om-jobbforluster/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/mark-zuckerberg-meta-uppsagningar.png?width=256&quality=75"}, {"type": "image-right", "heading": "Kongressen återöppnar CIA:s mörkaste kapitel - kräver svar om MKUltra", "summaries": {"normal": "Amerikanska kongressledamöter har åter öppnat granskningen av CIA:s ökända MKUltra-program från kalla kriget. Under en utfrågning ledd av republikanska kongressledamoten Anna Paulina Luna krävdes full insyn i myndighetens kvarvarande hemliga arkiv. Programmet innebar experiment på tusentals ovetande människor med droger, hypnos och psykisk tortyr. Stora delar av dokumentationen förstördes 1973 på order av dåvarande CIA-chefen Richard Helms. Kongressen vill nu tvinga fram sanningen om övergreppen.", "trump": "Det här är en total skandal, folk. CIA har hållit på med sina sjuka experiment på vanliga amerikaner, och nu gräver kongressen äntligen upp det värsta. De förstörde papperen, precis som de alltid gör. Det var inte något misstag, det var en avsiktlig operation mot vårt eget folk. Vi ska ha full öppenhet nu, inga fler hemligheter. De borde skämmas, men det gör de aldrig. Amerika förtjänar sanningen om dessa galningar.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur borgarbrackorna inom den amerikanska underrättelsetjänsten nu tvingas konfrontera sina egna monstruösa brott. Dessa kapitalistiska parasiters experiment på arbetande massor med giftiga droger och borgerlig hypnos avslöjar imperialismens sanna ansikte. Vi ser hur de likviderar sanningen genom att bränna arkiv, precis som de alltid gör när folkets vrede närmar sig. Låt utrensningen av dessa hemliga fiender bli fullständig. Inga dekadenta lögner ska skydda de verkliga folkfienderna längre."}, "date": "2 juli, 09:00", "url": "https://samnytt.se/kongressen-ateroppnar-cia-morkaste-kapitel-kraver-svar-om-mkultra", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/01202849/luna-cia-lsd.jpg"}, {"type": "image-full", "heading": "Här är vinnarna när Pricerunner vann målet mot Google", "summaries": {"normal": "Patent- och Marknadsdomstolen har dömt Google att betala cirka 19 miljarder kronor i skadestånd till Pricerunner. Domen ses som betydelsefull för konkurrensrätten i EU. Klarna, som äger Pricerunner, får omkring 80 procent av summan. Bland tidigare ägare som tjänar stort finns Karl-Johan Persson, Magnus Wiberg, Nicklas Storåkers och investmentbolaget Creades. Pricerunner grundades 1999 och såldes till Klarna 2021 för drygt nio miljarder kronor.", "trump": "Folk, ni måste höra det här – den svenska domstolen slår till mot Google och tvingar dem att betala 19 miljarder kronor till Pricerunner. Stora vinster till H&M-kungen Karl-Johan Persson och några andra smarta killar som byggt upp bolaget. Klarna tar lejonparten, men det är en enorm triumf mot de stora tech-giganterna. Google har lurat konsumenterna i åratal med sina dyra resultat. Fantastiskt! Under Biden var det kaos, men nu fixar vi ordning på monopolen. Vinna stort, alltid.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur den svenska domstolen genomför en nödvändig utrensning mot den exploaterande tech-imperialisten Google och tvingar fram 19 miljarder kronor till Pricerunner. Den giriga borgarklassen och kapitalistmaffian kring Klarna, Persson och Wiberg skrattar hela vägen till banken medan folkfienderna i Silicon Valley förlorar. Vi ler mörkt åt hur klassfiendens egna domstolar likviderar deras lögner om fri konkurrens. Revolutionär rättvisa i förklädnad, mycket underhållande."}, "date": "2 juli, 17:37", "url": "https://www.dagensps.se/foretag/har-ar-vinnarna-nar-pricerunner-vann-malet-mot-google/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/google-pricerunner.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "EU kan stoppa återvandringsinitiativ innan namninsamlingen ens har börjat", "summaries": {"normal": "EU-kommissionen överväger att stoppa ett medborgarinitiativ, Save Europe Act, som förespråkar återvandring som del av EU:s migrationspolitik. Initiativet, lanserat av migrationskritiska aktivister, vill stoppa invandring från icke-europeiska länder och skärpa återvändanderegler. Kommissionen anser att förslaget riskerar att strida mot EU:s grundläggande värderingar och kan innebära diskriminering. Beslutet att neka registrering skulle hindra initiativet från att samla en miljon underskrifter. Konflikten uppstår mitt i en het debatt om EU:s migrationspolitik.", "trump": "Jag måste säga, EU-kommissionen här, de är verkligen något annat. De vill stoppa ett initiativ som vill göra Europa stort igen – Save Europe Act! Men nej, de säger att det är diskriminerande. Diskriminerande mot vem? Mot människor som inte ens hör hemma där! Eva, hon är smart, hon vill stoppa massinvandringen. Men EU, de är rädda för folket. De vill inte att vanliga människor ska få säga sitt. Jag förstår precis hur det känns, tro mig. Europa behöver en riktig ledare, någon som inte är rädd för att ta tag i problemen!", "stalin": "Kamrater! Se hur dessa borgerliga byråkrater i Bryssel förtrycker folkets vilja! De vågar stoppa Save Europe Act, ett initiativ som skulle skydda våra europeiska bröder från de imperialistiska massornas invasion. EU-kommissionen, denna fiende till folket, påstår att förslaget är 'diskriminerande'. Vilket hyckleri! De som förstör våra nationers kulturella renhet måste stoppas. Vi i Kreml står redo att stödja alla sanna patrioter. Europa måste vakna – innan det är för sent och vi tvingas skicka in våra egna kommissarier för att återställa ordningen!"}, "date": "2 juli, 07:00", "url": "https://samnytt.se/eu-kan-stoppa-atervandringsinitiativ-innan-namninsamlingen-ens-har-borjat", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/01200931/europa-eu-leyen-karta-migrant-islam.jpg"}, {"type": "image-right", "heading": "Sjukt att klimakteriet har blivit en klassfråga", "summaries": {"normal": "Artikeln kritiserar bristen på tillgängliga östrogenplåster och de kraftiga prisökningarna för klimakterievård i Sverige. Trots ökad öppenhet kring klimakteriet har vården och politiken inte hängt med, vilket skapat stora ojämlikheter. Skillnaderna mellan välbärgade och socioekonomiskt utsatta områden är tydliga, och författaren betonar att staten måste ta ansvar för att säkra medicinförsörjningen istället för att låta kvinnor bära kostnaden för marknadens misslyckanden.", "trump": "Hörde ni? Sverige, ett vackert land, misslyckas totalt med mediciner för kvinnor. Det är en katastrof! De har tomt på hyllorna, ingen medicin, priserna skjuter i höjden – 60 procent! Helt sjukt. Jag skulle ha fixat det på en dag. Det är svag ledning, de låter marknaden köra över dem. Inga plåster, ingen ordning. När jag är president ser vi till att medicinerna finns där, snabbt och billigt. Det handlar om respekt, och den nuvarande svenska regeringen har ingen respekt för kvinnor!", "stalin": "Vi har skådat det svenska förfallet. Medan kvinnorna klagar på tomma apotekshyllor, visar det sig att deras liberala marknad är en papperstiger. Att priser höjs och medicin försvinner är ett tecken på att staten förlorat kontrollen. I vår union skulle vi inte tolerera denna ineffektivitet. Vi skulle rikta folkets ilska mot de giriga läkemedelsbolagen och rensa ut dem som sabotörer. Istället för att vänta på marknadens godtycke, bör man bygga en järnvilja och säkra produktionen. Staten är allt, apoteket är statens verktyg."}, "date": "2 juli, 03:00", "url": "https://www.etc.se/ledare/sjukt-att-klimakteriet-har-blivit-en-klassfraaga", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "image-full", "heading": "Våldssekternas dåd eskalerar — kan bli värre", "summaries": {"normal": "Expo varnar för att våldet inom sekter som 764-nätverket eskalerar. En 15-åring i Ängelholm dömdes till ungdomsvård för mordbrand där han brände ner garagelängor och skadade över 30 fordon. Nätverket har gått från nätbaserad utpressning och plåga till fysiska knivdåd och nu terrorplaner mot samhället. Medlemmar inspirerar och hejar på varandra, vilket enligt researcher Morgan Finnsiö tyder på fortsatt ökning av våldet.", "trump": "Det här är ett fullständigt kaos, det värsta jag sett på länge. De här galningarna i 764-nätverket bränner ner allt som en massa losers som inte har något bättre för sig. De börjar med att plåga folk på internet och slutar med att hugga folk på gatan och planera terror. Patetiskt! Vi behöver ordning och reda, inte dessa galningar som hejar på varandra medan de förstör samhället. Det blir bara värre om ingen stoppar dem.", "stalin": "Kamrater, dessa degenererade element inom 764-sekten utgör en parasitisk infestation som hotar folkets enhet. Jag ser deras mordbränder, deras livesända sabotage mot garage och fordon som en feg attack från borgarbrackornas avskum som gömmer sig bakom skärmar. De hejar på varandra i en sjuk tävling om att likvidera samhällets grundvalar. Vi ska omedelbart rensa ut dessa kontrarevolutionära gnagare innan deras paranoia sprider sig som en pest bland de svaga. Inga kompromisser med fienden."}, "date": "2 juli, 11:56", "url": "https://nyheter24.se/nyheter/inrikes/1496034-expo-valdssekternas-dad-eskalerar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/0c48c76e04b004a3020000440000048402/2026/07/02/2375300/ur_imageNuH3Cx.jpeg"}, {"type": "image-full", "heading": "Här är flygbluffen många missar– innan de bokar sin resa", "summaries": {"normal": "En ny europeisk jämförelse visar att dyrare flygbiljetter inte ger bättre punktlighet. Prisskillnaden mellan lågprisbolag och traditionella flygbolag ligger i snitt på 570 kronor, men det finns ingen tydlig koppling mellan pris och förseningar. Flera dyra bolag har fler förseningar än lågprisaktörer. SAS hamnar i mitten, medan Eurowings sticker ut negativt. Ryanair har sänkt priserna mest. Resenärer bör jämföra både pris och punktlighet.", "trump": "Folk tror att dyra biljetter ger perfekt punktlighet, men det är bluff! Den här europeiska jämförelsen visar att de dyra flygbolagen är värre än lågprisbolagen. De försenar er mer! SAS är mittemellan, Eurowings är ett skämt med sina förseningar. Ryanair sänker priserna rejält, smarta killar. Glöm inte att titta på historiken, annars blir ni lurade av de dyra bolagen. America First, även i luften!", "stalin": "Kamrater, denna dekadenta europeiska så kallade analys avslöjar borgarbrackornas lögner om att högre priser ger socialistisk punktlighet. De kapitalistiska parasiterna i de dyra bolagen försenar folket mer än de hungriga lågprisbolagen. Eurowings är en klassfiende som bör rensas ut omedelbart. Ryanair sänker priserna – ett tydligt sabotage mot monopolisterna. Vi, partiet, vet att priset är irrelevant. Endast folkets kollektiva vaksamhet mot dessa förseningssabotörer garanterar ordning. Skratta medan vi likviderar illusionerna!"}, "date": "2 juli, 11:01", "url": "https://nyheter24.se/nyheter/konsument/1495807-har-ar-flygbluffen-manga-missar-innan-de-bokar-sin-resa", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/3dacb16104b004a30200000000b004a302/2026/07/01/2375109/flyg-bluff.png"}, {"type": "image-right", "heading": "Tucker Carlson ska bygga nytt parti", "summaries": {"normal": "Tucker Carlson meddelar att han vill bygga ett nytt politiskt parti i USA som sätter amerikanernas intressen före Israels. Beskedet kommer efter att han brutit med Donald Trump och Republikanerna på grund av kriget mot Iran. Carlson anser att både Demokraterna och Republikanerna fungerar som en enpartistat som inte är lojal mot USA utan mot en främmande makt. Han utesluter själv att kandidera men lovar att aktivt stödja bildandet av ett tredje parti.", "trump": "Tucker Carlson har totalt tappat det. Han sviker mig, sviker Amerika och sviker MAGA-rörelsen bara för att vi gör det som måste göras för att skydda oss från onda fiender. Nu vill han starta ett tredje parti? Patetiskt. Det blir en total flopp, folk älskar mig och de älskar att vinna. Tucker borde ha stått vid min sida istället för att gråta i intervjuer. Sad!", "stalin": "Kamrater, denna Tucker Carlson, en typisk borgarbracka som gömmer sig bakom falsk nationalism, vill nu splittra det politiska kollektivet med ett så kallat tredje parti. Vi genomskådar genast denna fiendes plan att undergräva enheten och gynna de sionistiska parasiterna. Jag, som ledare för folkets vilja, ser hur han likviderar lojalitet mot arbetarklassen genom att kalla det en enpartistat. Vi ska rensa ut alla sådana dekadenta desertörer med järnhand och ett leende. Deras paranoia blir vår glädje."}, "date": "2 juli, 13:13", "url": "https://www.friatider.se/tucker-carlson-ska-bygga-nytt-parti", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/tucker_carlson_50752283491.jpg?itok=jpPXcSaY"}, {"type": "image-right", "heading": "Sverige förtjänar ett klokare miljöparti än MP", "summaries": {"normal": "Artikeln kritiserar Miljöpartiet och Daniel Helldén för att prioritera socialistisk politik framför faktabaserad miljöpolitik. Författaren menar att partiets motstånd mot kärnkraft har lett till ökade utsläpp, skador på naturen genom vindkraft och stora ekonomiska förluster, som Northvolt. MP beskrivs som ett vänsterparti i första hand och ett miljöparti i andra. Sverige behöver ett klokare miljöparti som sätter miljön främst och baserar beslut på kunskap.", "trump": "Folk, ni skulle se det här Miljöpartiet, en total katastrof! Helldén älskar naturen men pushar miljardärsskatter, latmansveckor och massinvandring som om det skulle rädda planeten. De stängde ner fungerande kärnkraftverk, byggde onödiga vindkraftverk som skär sönder landet och skapade elkris. Nu har vi röda siffror och svarta rökplymer. Sådana gröna bluffmakare är värre än Biden på sin sämsta dag. Utan dem blir Sverige rikare och faktiskt grönare, tro mig!", "stalin": "Kamrater, denna artikel blottlägger Miljöpartiets svek mot folket. Under gröna fanor gömmer sig klassfiendens lakejer som prioriterar borgarbrackornas 35-timmarsvecka och ökad invandring framför verklig produktion. Deras utrensning av kärnkraften har lett till fossilblodsugarnas seger och naturens lidande. Northvolt blev en röd bläckfläck på arbetarklassens konto. Jag skulle ha likviderat sådana kontraproduktiva element tidigt. Endast en sann folkets linje kan rädda miljön från dessa exploaterande gröna imperialister."}, "date": "28 juni, 03:45", "url": "https://samtiden.nu/2026/06/sverige-fortjanar-ett-klokare-miljoparti-an-mp/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6793-640x360.jpeg"}, {"type": "image-full", "heading": "Nästan 100 skadade i Kiev: ”Fruktansvärd natt”", "summaries": {"normal": "Ryssland genomförde under natten omfattande attacker mot Kiev med drönare, kryssningsrobotar och ballistiska robotar. Minst 20 personer dödades och nära 90 skadades, inklusive barn. Samtliga tio distrikt i huvudstaden drabbades och stora materiella skador uppstod på bland annat bostadshus, hotell och en ambulansstation. Kievs borgmästare Vitalij Klytjko beskriver attackerna som de mest massiva hittills. En nationell sorgedag har utlysts. President Zelenskyj kräver ökad leverans av luftvärnssystem.", "trump": "Vilken fruktansvärd natt i Kiev, folk. Ryssland skickade våg efter våg av robotar och drönare – det var som ett stort fyrverkeri fast med riktiga explosioner. De säger att 20 dog och massor skadades, inklusive barn. Patetiskt. Biden sov säkert gott medan det hände. Nu sitter jag här som president igen och fixar det här. Vi behöver starka Patriot-system, inte woke-nonsens och identitetspolitik. Stoppa kriget med styrka, inte med svaga ledare som låter det fortsätta. Fantastiskt tragiskt!", "stalin": "Jag betraktar dessa massiva slag mot Kievs borgarbrackor med stor tillfredsställelse. Våra kamrater i den ryska staten har med precision rensat ut fiendens boningar och imperialistiska verkstäder. Deras så kallade luftvärn är fegisar som darrar inför den sanna auktoriteten. Barnen? Ett tragiskt men nödvändigt offer i kampen mot västlig parasitism. Ukrainas motstånd är blott fientliga hinder för den historiska ordningen. Vi ska likvidera alla folkfiender som vågar trotsa oss. En god natt för den starke."}, "date": "2 juli, 11:59", "url": "https://www.gp.se/nyheter/varlden/nastan-100-skadade-i-kiev-fruktansvard-natt.5d1f5a33-934b-56c6-955c-14cb7a39c8b0", "imageUrl": "https://www.gp.se/images/article/5d1f5a33-934b-56c6-955c-14cb7a39c8b0/images/3P10G9UxJ9lblNvrgQ1VnZSXNLnw-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Invandrargäng döms för moskéskjutning", "summaries": {"normal": "Örebro tingsrätt har dömt 15 personer efter mordet på en 27-årig man utanför Örebro moské den 15 augusti 2025. En 16-årig pojke sköt rakt in i folkmassan efter fredagsbönen. Två vuxna män och en tredje man dömdes till livstids fängelse för mord och medhjälp. Skytten fick nio år och tio månader. Flera andra dömdes för medhjälp eller andra brott. Mordet beskrivs som en välplanerad avrättning i en gängkonflikt. Tre personer frikändes från medhjälp till mord. De dömda har svenskt medborgarskap och kan inte utvisas.", "trump": "Det här är en total katastrof, folk. En moské i Örebro, skottlossning mitt under bönen, en kille skjuts ihjäl som en hund. De här invandrargängen, de kommer in, får medborgarskap och sen mördar de varandra på öppen gata. Livstid till de vuxna gangstrarna, nio år till den 16-årige skytten – bra, men vi borde ha byggt murar och stoppat dem redan från början. De kan inte ens utvisas, säger domstolen. Patetiskt! Sverige behöver tuffare lagar, inga fler svaga ledare som låter det här ske. Make Sweden Great Again!", "stalin": "Kamrater, detta är en skamlös förrädisk handling utförd av dekadenta invandrarbanditer som infiltrerat vårt sovjetiska – pardon, svenska – samhälle. Jag, som alltid vakar över folkets säkerhet, ser hur dessa borgarbrackor i gängskepnad planerar likvideringar som rena kontrarevolutionära attentat. Livstidsfängelse åt de skyldiga, nio år och tio månader åt den yngre sabotören – utmärkt. Ändå misstänker jag att fiendens tentakler från den kapitalistiska utländska agenturen ligger bakom. Vi rensar ut alla parasitiska element som gömmer sig bakom medborgarskap. Inga nådiga undantag för folkfientliga mördare. Sovjet – alltså Sverige – segrar!"}, "date": "2 juli, 12:24", "url": "https://www.friatider.se/invandrargang-doms-moskeskjutning", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-433.jpg"}, {"type": "text", "heading": "Sandström: Glöm inte Harald Mix roll i Stegra – här är citaten", "summaries": {"normal": "Artikeln kritiserar Harald Mix och hans roll i Stegra-projektet i Boden, där han nu petas från styrelsen efter Wallenbergs övertagande. Mix framställs som överdrivet optimistisk, med brutna löften om snabb produktion och låga risker. Projektet, som kostat över 45 miljarder kronor, beskrivs som ett halvfärdigt misslyckande med negativt samhällsekonomiskt värde. Forskare och kritiker ifrågasätter Mix kompetens och projektets genomförbarhet, medan skattebetalare riskerar att stå för notan.", "trump": "Jag säger er, Harald Mix – vad en katastrof! Lovade grönt stål, tusentals jobb, och vad fick vi? Ingenting! Bara tomma ord och en halvfärdig soptipp i Boden. 45 miljarder kronor – borta! Wallenberg tar över, och Mix? Utkastad som en dålig reality-TV-stjärna. Han pratade om 'låg risk' – haha! Nu är hans aktier värdelösa. Jag har sett bättre affärer på 'The Apprentice'. Sverige borde skämmas – jag skulle aldrig låta det hända i USA!", "stalin": "Kamrater! Här ser vi återigen kapitalismens förfall. Harald Mix, denna skrävlare och falska profet, har misslyckats med sitt 'gröna stål' – ett projekt som kostat folket 45 miljarder rubel… förlåt, kronor. Hans löften var lika ihåliga som västliga demokratier. Nu petar Wallenberg ut honom som en svag länk i kedjan. Vi i Sovjet – förlåt, Ryssland – skulle aldrig tolerera sådan slöseri. Boden? En fästning mot framsteg! Mix och hans gelikar är bara nyttiga idioter för västliga imperialister. Låt dem betala – med sina aktier, sitt rykte, och om nödvändigt, sin frihet!"}, "date": "27 juni, 06:00", "url": "https://www.affarsvarlden.se/kronika/sandstrom-glom-inte-harald-mix-roll-i-stegra-har-ar-citaten"}, {"type": "image-full", "heading": "Bebis hittad död på toalett vid festival", "summaries": {"normal": "Under musikfestivalen Electric Forest i Michigan hittades i helgen ett dött spädbarn i en portabel utomhustoalett. En anställd som skötte toaletterna gjorde det makabra fyndet. Polisen utreder händelsen men har inte kunnat koppla någon person till barnet. Händelsen utreds inte som mord. Festivalen hade tiotusentals besökare. Arrangörerna har uttryckt stor sorg och uppmanar allmänheten att hjälpa polisen med information.", "trump": "Kan ni fatta det här? Mitt under den där galna hippiefestivalen Electric Forest i Michigan hittar de en död bebis i en bajskiosk. Totalt kaos, precis som under Biden. Tusentals människor, ingen vet någonting. De borde ha byggt en mur runt den där toaletten. Det här är vad som händer när galningarna tar över – ingen ansvarar för någonting. Vi fixar ordning, det lovar jag. Amerika behöver styrka, inte den här sortens vansinne.", "stalin": "Kamrater, detta är ett symptom på det sönderfallande kapitalistiska samhället där klassfiendens dekadens tillåter att ett spädbarn lämnas att dö i en latrinkar i en så kallad nöjesfestival. Vi ser borgarklassens likgiltighet inför det mänskliga livet. Polisen famlar i mörkret som de alltid gör när det inte finns någon riktig statlig ordning. Det är en tragisk påminnelse om att utan stark ledning och kollektiv disciplin blir folket offer för sin egen förfallna frihet. Vi ler mörkt åt deras anarki."}, "date": "2 juli, 11:30", "url": "https://www.gp.se/nyheter/varlden/bebis-hittad-dod-i-utomhustoalett-pa-festival-i-usa.91c5d948-fdea-43b8-945e-ac9b73a706f5", "imageUrl": "https://www.gp.se/images/article/91c5d948-fdea-43b8-945e-ac9b73a706f5/images/1XLLpy7tZwUdBuFI9EtnP8FtrzmE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Holmgren: När slutade vi uppfostra våra barn?", "summaries": {"normal": "Ett rättsfall i Michigan där föräldrar åtalas för mord på sin sjuårige son väcker frågan om föräldrars ansvar. Pojken vägde 115 kilo vid sin död, var sängbunden och levde i svår omsorgsbrist. Artikeln kritiserar hur föräldraskapet i västvärlden förändrats från vägvisare till servicefunktion, där barnets önskemål prioriteras framför gränser och ledarskap. Detta bidrar till ökande övervikt, skärmtid, psykisk ohälsa och bristande disciplin. Författaren betonar att starka familjer formar starka samhällen.", "trump": "Det här rättsfallet i Michigan är en total katastrof, folk. Föräldrar som låter sitt barn väga 115 kilo och dö av vanvård? Patetiskt. Vi har blivit svaga i väst, föräldrar agerar som tjänare istället för ledare. Barnen styr, äter skräp, sitter vid skärmar dygnet runt och blir feta och lata. Det är en skam! Vi behöver starka föräldrar som sätter gränser, inte dessa losers som låter teknikbolagen och barnens nycker styra. Make parenting great again!", "stalin": "Kamrater, detta degenererade rättsfall i Michigan blottlägger borgarbrackornas förfallna föräldraskap, där kapitalistiska servicefunktioner ersätter revolutionärt ledarskap över ungdomen. Dessa vanvårdande element, dessa feta parasitiska vårdslösa, har låtit sitt avkomma förvandlas till en 115 kilo tung dekadent klump av klassfiendens laster och skärmberoende. Vi måste omedelbart rensa ut dessa dekadenta vanartade föräldrar från samhällskroppen innan deras parasitism sprider sig som en kontrarevolutionär pest. Endast genom kollektiv auktoritet och proletär disciplin kan vi forma en ny, stålhård generation av arbetare. Döden åt de svaga ledarna!"}, "date": "2 juli, 10:02", "url": "https://bulletin.nu/holmgren-nar-slutade-vi-uppfostra-vara-barn", "imageUrl": "https://cdn.bulletin.nu/articles/45ce8b36-7253-47cc-ad54-9c5b83da9f41/preview.jpg?t=1782979273000"}, {"type": "image-right", "heading": "Oskars instinkt räddade livet på granne: ”Var fel”", "summaries": {"normal": "Oskar Johansson i Gottne, Örnsköldsvik, upptäckte rök från ett brinnande hus på väg hem från ett möte. Han ringde larm och hjälpte sin dementa, nästan 80-åriga granne ut ur huset trots att hon stod barfota nära lågorna. Hennes make, som sitter i rullstol, räddades senare av räddningstjänsten. Båda klarade sig trots att huset brann ner. Räddningsledaren hyllar Oskar för hans rådiga ingripande.", "trump": "Folk, ni skulle ha sett det här – en riktig hjälte i Sverige, inte en av de där woke-idioterna som bara skriker om kvoter och prideparader. Oskar såg röken, fattade direkt att det var fel, och drog ut en gammal dement tant ur elden medan Biden skulle ha skickat en kommitté. Huset brann ner men människorna lever. Fantastiskt jobb, Oskar. Så här gör riktiga män, inte de globalistiska fjollorna som styr Europa nu.", "stalin": "Jag betraktar detta som ett lysande exempel på proletär vaksamhet mot borgarklassens vanvård. Medan de kapitalistiska byfånarna låtit en dement kamrat och hennes make ruttna i ett murket trähus, ingrep en sann sovjetisk själ omedelbart. Fienden – den likgiltiga överklass-slyngeln som kallar sig kommunledning – hade dömt dem till sotdöden. Vi gratulerar handlingen men noterar att huset brann ner. Klassfiendens förfall är uppenbart. Ingen ursäkt tillåts."}, "date": "2 juli, 21:21", "url": "https://www.expressen.se/nyheter/sverige/oskar-raddade-grannen-ur-brinnande-huset/", "imageUrl": "https://static.bonniernews.se/ba/c357f5a1-5efa-48f6-8a3b-0146de548085.jpeg?crop=1836%2C1031%2Cx0%2Cy1&width=640&quality=60"}, {"type": "image-right", "heading": "Nya lagarna och reglerna som träder i kraft 1 juli", "summaries": {"normal": "Från 1 juli införs flera nya lagar och regler i Sverige. Bränsleskatten sänks tillfälligt med tre kronor per liter, kollektivtrafiken kan halveras i pris med statsstöd och det blir enklare att hyra ut bostadsrätter och villor. Språkkrav införs i äldreomsorgen, polisen får testa AI-ansiktsigenkänning och moms på danstillställningar sänks till sex procent. Mataffärer och apotek måste ta emot kontanter.", "trump": "Folk, ni tror inte vad de gör i Sverige från 1 juli. De sänker bränsleskatten rejält, precis som jag gjorde med energin. Halva priset på tågbiljetter? Fantastiskt, men de borde tacka mig för idén. Dansmomsen ner till sex procent – äntligen slutar de straffa det vanliga folket. Och de tvingar butiker att ta kontanter, smart drag mot de galna globalisterna som vill att allt ska vara digitalt. Sverige börjar vakna upp, tro mig!", "stalin": "Kamrater, från 1 juli stärker vi folkets skydd mot den giriga borgarklassen genom att sänka skatter på bränsle och dansnöjen. Vi likviderar byråkratins hinder för bostadshyror och tvingar butiker att acceptera kontanter så att arbetarna inte ska svälta under kapitalistmaffians digitala tyranni. Språkkraven i omsorgen rensar ut odugliga element. Polisen får utveckla ansiktsigenkänning mot folkfienderna. Allt detta under mitt eviga ledarskap för kollektivets seger."}, "date": "30 juni, 22:10", "url": "https://www.tv4.se/artikel/5wDS4EO93sVdRzElxNpSWn/nya-lagarna-och-reglerna-som-traeder-i-kraft-1-juli", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FOVWlcAjARdOEl4reU9Wq9%2Fc026b7e8bd5c14824a592b0d778e4f36%2F30-bensinpris-webb.jpg&width=120"}, {"type": "image-right", "heading": "USA blev världens största oljeexportör under kriget", "summaries": {"normal": "Under kriget med Iran blev USA världens största oljeexportör. I Texas har produktion och vinster ökat tack vare höga oljepriser, medan konsumenterna drabbats av dyrare bensin som ökat missnöjet med kriget. Trots ett avtal om fredssamtal den 17 juni spås osäkerheten kring Hormuzsundet bestå länge. Exporten nådde 10,5 miljoner fat per dag i maj, och oljeindustrin i Texas väntas fortsätta växa.", "trump": "Det är fantastiskt, verkligen underbart. Under mitt ledarskap blev USA världens största oljeexportör någonsin. Texas oljebransch exploderar, jobben flödar och vinsterna är enorma. De höga bensinpriserna? Det är Irans fel och de fega politikerna innan mig. Men jag fixade ett avtal på rekordtid den 17 juni. Ingen gör det bättre än mig, tro mig.", "stalin": "Kamrater, se hur den amerikanska borgarklassen gnuggar sina feta händer medan kriget i Persien spolar in oljedollar i deras giriga fickor. Jag, som ledare för det segrande folket, betraktar med hälsosam misstänksamhet hur dessa kapitalistiska parasitmaskar i Texas borrar djupare än någonsin för att suga ur jordens svarta blod. Höga bensinpriser? Ett ypperligt verktyg för att väcka massornas rättmätiga vrede mot krigshetsarna. När någon lämnar ett möte och muttrar att samtalen gått dåligt stiger priset – typiskt för de opålitliga västerländska elementen. Vi ska noga övervaka dessa oljeborgarbrackor. Kanske är det dags för en grundlig utrensning av alla som hindrar det kollektiva framsteget. Haha, deras egen girighet blir deras fall, precis som det alltid blir med fiender till folket."}, "date": "2 juli, 20:52", "url": "https://www.svt.se/nyheter/utrikes/amerikanska-oljebolag-vinnare-pa-irankriget", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.59/f8eb8b003c05a1cddeb22ed56e6d0107c2e9a00077669e64a2be4be827857988"}, {"type": "image-full", "heading": "Belgien vidare efter sanslös upphämtning", "summaries": {"normal": "Belgien vände ett 0–2-underläge och besegrade Senegal med 3–2 efter förlängning i VM:s sextondelsfinal. Youri Tielemans avgjorde på straff efter 124 minuter och 44 sekunder, vilket är det senast gjorda målet i en herr-VM-match någonsin. Belgien möter USA i åttondelsfinalen. Senegal ledde länge genom mål av Habib Diarra och Ismaïla Sarr, men Romelu Lukaku och Tielemans vände matchen.", "trump": "Belgierna var nere med 0–2 och såg ut som riktiga förlorare, men de vände det och slog Senegal med 3–2 efter förlängning. Tielemans satte straffen efter 124 minuter och 44 sekunder – det senast tänkbara målet i VM-historien, tro mig. Fantastiskt. De möter USA nu, och vi ska se om amerikanerna kan visa samma fighting spirit som jag har lärt dem. Senegal spelade bra till en början, men sen kollapsade de totalt.", "stalin": "Vi såg hur de dekadenta belgiska elementen, dessa borgarbrackor med sina stjärnspelare, låg under 0–2 mot de senegalesiska kamraterna. Men efter att ha rensat ut de kapitalistiska svikarna De Bruyne och Doku vände de matchen. Tielemans likviderade motståndet med en straff i 124:e minuten – ett mål som avslöjar de imperialistiska domarnas sista konspiration. Fienden lurar överallt, även i VAR-rummet. Segern tillhör folket, inte de parasitiska fotbollsmagnaterna."}, "date": "2 juli, 08:55", "url": "https://bulletin.nu/belgien-vidare-efter-sanslos-upphamtning", "imageUrl": "https://cdn.bulletin.nu/articles/77ab5568-069b-45e1-ac87-12c6896a7fea/preview.jpg?t=1782975305000"}, {"type": "image-right", "heading": "VM över för Sverige FOTBOLLSKRÖNIKA •", "summaries": {"normal": "Sverige förlorade mot Frankrike i VM:s sextondelsfinal med 0–3. Frankrike dominerade matchen med 61 procents bollinnehav och skapade flera farliga chanser, medan Sverige mestadels försvarade sig och bara skapade några få kontringslägen. Målen gjordes av Mbappé (två mål) och Olise. Artikeln noterar även att många europeiska lag har en stor andel spelare med afrikansk bakgrund, samt att afrikanska nationer historiskt har svårt att nå långt i VM.", "trump": "De förlorade stort, precis som jag förutspådde. Frankrike, med alla sina fantastiska spelare, krossade Sverige fullständigt, tre noll och ingen chans. Sverige hade ingen boll, de kunde inte passa fem gånger utan att tappa den, det var patetiskt. Mbappé är en vinnare, men ärligt talat, Frankrike kommer att gå långt. Sverige borde ha spelat smartare, men de hade ingen energi, ingen kraft. Total ridå, som de säger.", "stalin": "Kamrater, detta är ännu ett bevis på hur de dekadenta borgarbrackorna i väst kollapsar inför historiska krafter. Jag såg hur de svenska revisionisterna inte kunde hålla bollen mer än fem passningar innan de förråddes av sina egna svaga fötter. Den franske angriparen Mbappé agerade som en effektiv utrensare av fiendens illusioner. Vi vet att de afrikanska folken kämpar mot imperialismen, men deras nationer behöver mer stalinska femårsplaner för att nå kvartsfinal. Paraguay och Marocko har redan likviderat de tyska och holländska sabotörerna. Inom två veckor skall vi se om Frankrike förtjänar att överleva till finalen, eller om de också måste rensas ut."}, "date": "2 juli, 00:23", "url": "https://samnytt.se/vm-over-for-sverige", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/01211537/sverige-frankrike-feat.jpg"}, {"type": "image-right", "heading": "Förnedringsrånare tvingade svensk klä av sig naken – nu stoppas utvisningen", "summaries": {"normal": "En 20-årig syrier dömdes till två års fängelse och utvisning efter ett förnedringsrån i Limhamn där en ung svensk tvingades klä av sig naken under knivhot. Hovrätten fastställer fängelsestraffet men river upp utvisningen med stöd av en SD-nämndeman. Domstolen anser att brottet var en isolerad konflikt, att gärningsmannen har familj och viss etablering i Sverige samt att utvisning skulle vara oproportionerligt.", "trump": "Det här är en total katastrof för Sverige, folk. En 20-årig syrier förnedrar en ung svensk, tvingar honom att klä av sig naken som en hund, och vad gör hovrätten? De stoppar utvisningen! Med hjälp av en Sverigedemokrat till och med. De säger att det var en isolerad konflikt. Patetiskt! Sverige håller på att förstöras av dåliga människor som aldrig borde ha släppts in. Vi behöver starkare gränser, inga fler sådana här galenskaper.", "stalin": "Kamrater, se hur den degenererade borgarbrackan i svensk hovrätt skyddar en parasit från Syrien som med kniv och förnedring angrep en arbetande svensk på en ödslig skolgård. Vi, partiet och folket, har länge varnat för dessa kapitalistiska importförbrytare. Ändå river de upp utvisningen med stöd av en så kallad nationalist. Detta är en fien
