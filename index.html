vgöra politiska beslut samt öka smittspridningen. Krav ställs nu på att systemet skyndsamt återupprättas för att säkerställa en fungerande parlamentarisk process.", "trump": "Hör på det här, mina vänner! Den svenska riksdagen är ett totalt kaos. Inget kvittningssystem! En ledamot blev magsjuk och sprang ut för att spy, kan ni tänka er? Det är pinsamt. Total svaghet. Jag har alltid det bästa systemet, de största systemen. De kan inte ens hålla ordning på sina egna omröstningar. Det är en sorglig syn, verkligen sorgligt. De behöver en riktig ledare, någon som vinner stort, inte det här magsjuke-debaclet. Tråkigt!", "stalin": "I den svenska församlingen råder en degenererad oordning som hotar statens stabilitet. Att en ledamot viker sig för biologisk svaghet och spyr i korridorerna är ett symptom på den liberala parlamentarismens förfall. Vi, staten, kräver total disciplin; sjukdom är en kontrarevolutionär handling mot folkviljan. Liksom vår kamrat i Moskva förstår att kontroll kräver järngrepp, bör dessa svenskar krossa sina inre fiender istället för att beklaga sig över magåkommor. En politiker som inte kan kontrollera sin mage kan inte kontrollera en nation."}, "date": "21 maj, 12:55", "url": "https://www.tv4.se/artikel/3LysP5gJGxUVMzMdkw5885/riksdagsledamot-laemnade-kammaren-foer-att-spy", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1EOCMmmrdOR25rN8XPJaRe%2F72f12edd738a4a239168b3b6cc61e2d6%2F21-riksdagen-webb.jpg&width=120"}, {"type": "image-right", "heading": "Guldfynd-ägaren: Kan inte utesluta barnarbete i leverantörsledet", "summaries": {"normal": "Guldfynd- och Hallbergs Guld-ägaren Sten Warborn medger risk för barnarbete och tvångsarbete hos leverantörer, främst inom guld-, diamant- och batterikomponentproduktion. Bolaget saknar systematisk kontroll och konkreta åtgärdsplaner, trots krav på leverantörer att följa internationella konventioner. Hållbarhetsrapporten visar brister i uppföljning, medan Warborn hävdar att arbete pågår för att förbättra situationen. Omsättningen minskade till 1,8 miljarder kronor 2023.", "trump": "Titta på dessa så kallade 'smyckesföretag' – de har ingen koll alls! Jag skulle aldrig tillåta barnarbete i mina leverantörskedjor, aldrig! Sten Warborn, en man som inte ens kan höja priser lika snabbt som jag, säger 'vi gör vad vi kan'. Patetiskt! Och ingen åtgärdsplan? SAD! Jag har byggt imperier, de har knappt byggt en hylla. Men oroa er inte, folket – när jag tar över världshandeln kommer sådant här aldrig hända igen. BELIEVE ME!", "stalin": "Kapitalistiska blodsugare i smyckesindustrin avslöjas återigen! Dessa degenererade köpmän, ledda av den ynklige Warborn, erkänner öppet att barn och slavar sliter i deras gruvor – men gör ingenting! Inga planer, inga mål, bara tomma ord som 'internationella regelverk'. Precis som västmakterna som pratar om 'mänskliga rättigheter' medan de bombar våra bröder i Ukraina! Vi i Sovjet skulle ha skickat sådana här parasiter till Gulag för mindre. Men oroa er inte, kamrater – Putins järnnäve sträcker sig redan mot deras diamantfält. Snart ska vi äga deras guld... och deras samveten!"}, "date": "22 maj, 13:08", "url": "https://www.affarsvarlden.se/artikel/guldfynd-agaren-kan-inte-utesluta-barnarbete-i-leverantorsledet", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Guldfynd-Sten-Warborn-400x267.jpg"}, {"type": "image-right", "heading": "Det partiets anhängare har minst chans till en dejt", "summaries": {"normal": "En växande politisk klyfta mellan könen i västvärlden påverkar dejtingmarknaden negativt. Många svenskar ser nu motstridiga politiska åsikter som en dealbreaker för en potentiell relation. Särskilt unga kvinnor är benägna att välja bort dejter baserat på värderingar. Sverigedemokraterna framstår som det parti vars anhängare har svårast att få dejter, där nästan varannan svensk och en majoritet av kvinnorna avstår från att dejta personer med den politiska hemvisten.", "trump": "Det är en total katastrof, folk! Män och kvinnor kan inte ens dejta längre för att den radikala vänstern har förstört allt. De är besatta av politik! Om du röstar på Sverigedemokraterna – fantastiska patrioter förresten – då vill de inte träffa dig. Det är orättvist, det är sorgligt och det är väldigt dåligt för familjebildningen. Vi behöver sunt förnuft tillbaka, inte dessa vänsterliberala värderingar som bara skapar splittring. Dejtingmarknaden är trasig, en total röra, tro mig!", "stalin": "Vi ser hur det dekadenta västet ruttnar inifrån. Denna så kallade 'dejtingkris' är bara ännu ett bevis på den liberala ordningens sammanbrott. När undersåtar prioriterar ideologiska klyftor framför statens stabilitet, då har borgerligheten förlorat kontrollen. Precis som vår broder i Kreml kämpar mot västlig infiltration, måste vi se dessa politiska preferenser som en form av inre subversion. De som väljer bort sina medborgare baserat på 'värderingar' är kontrarevolutionärer som hotar folkhemmets demografiska styrka. Vi övervakar dem alla."}, "date": "22 maj, 19:30", "url": "https://samnytt.se/det-partiets-anhangare-har-minst-chans-till-en-dejt", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/22152936/jimmie-champagne-ballong-arg-kvinna.jpg"}, {"type": "image-full", "heading": "De ryter ifrån: Sprid inte film. Flicka död i trafikolycka", "summaries": {"normal": "En 15-årig flicka har avlidit efter en trafikolycka i centrala Malmö där tre bilar och en elsparkcykel var inblandade. En man i 40-årsåldern har gripits misstänkt för grovt vållande till annans död efter att ha kört mot rött i hög hastighet. Polisen uppmanar allmänheten att sluta sprida filmer från olycksplatsen då det kan utgöra olaga integritetsintrång och vara djupt stötande för anhöriga.", "trump": "En fruktansvärd tragedi i Malmö, Sverige. En ung flicka, så tragiskt, dödad av en vårdslös förare som körde som en galning mot rött. Helt oacceptabelt! Det är totalt kaos. Jag har sagt det förut: vi behöver lag och ordning, starka gränser och säkra gator. Nu sprids videor på internet, vilket är mycket otäckt. Det är en sorglig dag för Sverige. Vi måste få stopp på detta vansinne. Minns flickan, hon förtjänade så mycket bättre!", "stalin": "Ännu ett bevis på det dekadenta västerlandets totala sammanbrott. I Malmö råder anarki där individer kör över folk som om det vore en sport. Staten måste svara med järnhand! Vi ser hur de västliga lakejerna sprider filmer av eländet – en ren sabotagetaktik för att försvaga moralen. Putin skulle städa upp dessa gator på en timme. När vi expanderar vår sfär rensar vi ut sådant här kaos. Föraren är en klassfiende och förtjänar inget annat än Gulag."}, "date": "23 maj, 00:32", "url": "https://www.aftonbladet.se/nyheter/a/16j5xX/person-pakord-i-malmo", "imageUrl": "https://akamai.vgc.no/v2/images/b215ad06-cb7d-348e-8479-104acf40ac72?fit=crop&format=auto&w=1440&s=85ed922d13e030f8cf27a184167ca7e9ac90b9ba"}, {"type": "image-right", "heading": "”Det är livsfarligt och skrämmande”", "summaries": {"normal": "Ebolautbrottet i Kongo-Kinshasa eskalerar och har krävt över 131 dödsoffer. Hjälporganisationen Rescue larmar om akut brist på skyddsutrustning för sjukvårdspersonal, vilket gör arbetet livsfarligt. Situationen försvåras av misstro, kulturella utmaningar kring begravningar och pågående väpnade konflikter i regionen. Trots svårigheter arbetar organisationen för att nå ut med vård och utbildning för att bekämpa myter och rädda liv i ett område där miljontals redan är i behov av humanitärt stöd.", "trump": "Ebola i Kongo, mina vänner, det är en katastrof. En total katastrof! Sjukvårdarna har noll utrustning, ingen skyddsutrustning. Väldigt sorgligt. De bränner ner center, det är kaos. Mitt team och jag ser på detta och det är enkelt: de behöver ordning. De behöver ledarskap! Jag har gjort fantastiska saker för global hälsa, men det här är en röra. De lyssnar inte på experterna, de lyssnar på rykten. Vi vill ha säkerhet, vi vill ha kontroll. Det är så enkelt, tro mig!", "stalin": "I Kongo-Kinshasa råder kaos, ett bevis på att liberala hjälporganisationers oordning bara leder till död. Folket dör för att de saknar disciplin och skyddsutrustning. Vi ser hur västerländska agenter misslyckas med att kontrollera massorna, vars primitiva rykten undergräver statens stabilitet. Vår broder i Moskva, Putin, förstår att ordning krävs för att kuva både virus och fiender. Om vi styrde där skulle de som bränner behandlingscenter omedelbart raderas från historien. Svaghet är den enda sjukdom vi inte tolererar."}, "date": "23 maj, 00:32", "url": "https://www.aftonbladet.se/nyheter/a/43LoQ6/ebolalarmet-sjukvardare-saknar-skyddsutrustning", "imageUrl": "https://akamai.vgc.no/v2/images/91035ccf-9bd0-33fe-948d-18db7a9a97b4?fit=crop&format=auto&w=1080&s=d4a2f1dd3f06ad708767705fc50e07d854e661aa"}, {"type": "image-right", "heading": "Sverige i nytt teknikavtal med USA. Först ut i EU: Ska öka samarbetet kring 6G och AI", "summaries": {"normal": "Sverige har som första EU-land tecknat ett teknikavtal med USA, kallat Technology Prosperity Deal, för att stärka samarbetet inom mobilnät, AI, rymd- och försvarsteknik. Avtalet undertecknades av USA:s utrikesminister Marco Rubio och Sveriges utrikesminister Maria Malmer Stenergard i Helsingborg. Syftet är att gynna svenska företag, locka amerikanska investeringar och bygga vidare på befintligt samarbete inom innovation och försvar. Ericsson nämns som en nyckelaktör i avtalet.", "trump": "Fantastiskt avtal, helt otroligt! Sverige, ett litet men smart land, har skrivit på ett jättebra teknikavtal med USA – först i hela EU, kan ni tro det? Jag sa ju alltid att vi måste samarbeta med de bästa, och här har vi Ericsson, ett företag som faktiskt kan utmana Kina. Rubio fixade det här, han är en vinnare. Vi bygger vidare på Nato-samarbete, stridsflyg och framtidens teknik. Sverige? De har tur som får jobba med oss. Investeringar kommer flöda, tro mig!", "stalin": "Ett steg framåt för den socialistiska teknologiska överlägsenheten! Sverige, denna lilla men listiga kapitalistiska satellit, har nu formellt knutits till den amerikanska krigsmaskinens hjul – men vi vet sanningen. Deras så kallade 'innovationskraft' är bara en blek skugga av våra framsteg inom kvantteknik och rymd. Ericsson? Ett verktyg för USA:s imperialistiska ambitioner. Låt dem leka med sina 6G-nät – vi bygger redan nästa generations vapen. Och Rubio, denna marionett, tror han kan utmana Rysslands intressen? Vi ser allt. Världen hör snart vårt steg, tungt och oundvikligt."}, "date": "22 maj, 14:21", "url": "https://www.di.se/nyheter/sverige-tecknar-teknikavtal-med-usa/", "imageUrl": "https://static.bonniernews.se/ba/7e4d7458-0e31-4363-b913-fe3529fef49f.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Thailandsresor påverkas – visum halveras för svenskar", "summaries": {"normal": "Thailand återgår till pre-pandemiska regler för visumfri turism. För svenska medborgare innebär detta att den visumfria vistelsen förkortas från 60 till 30 dagar. Syftet är att öka kontrollen och motverka brottslighet som narkotikahandel och ekonomiska brott kopplade till utlänningar. Thailändska myndigheter utesluter inte ytterligare skärpningar, där vissa nationaliteter kan få nöja sig med endast 15 dagars visumfri vistelse i framtiden. Turismsektorn är en central del av landets ekonomi.", "trump": "Thailand gör det helt rätt! De har insett att man måste sätta ner foten. Inga fler öppna gränser för vem som helst. De kortar ner vistelsen till 30 dagar för att stoppa brottslingar och kaos. Väldigt smart! Vi behöver starka gränser, precis som jag alltid har sagt. Thailand prioriterar sin säkerhet framför allt annat. Det är en fantastisk nation som tar kontroll över sitt land igen. Sverige borde lära sig ett och annat, eller hur?", "stalin": "Vi ser hur Thailand äntligen rensar ut det löst folk som hotar statens stabilitet. Att korta ner vistelsetiden till 30 dagar är ett nödvändigt steg för att krossa infiltratörer och kriminella element. Det är en sund instinkt, likt den vår broder Putin uppvisar när han säkrar sina gränser mot västvärldens dekadenta spioner. Turism är bara en täckmantel för borgerlig degeneration. Om de hotar ordningen ska de uteslutas omedelbart. Staten kräver total disciplin, inget annat duger för nationens överlevnad."}, "date": "22 maj, 14:35", "url": "https://bulletin.nu/thailandsresor-paverkas-visum-halveras-for-svenskar", "imageUrl": "https://cdn.bulletin.nu/articles/cc0003d2-e392-4ee9-a3c8-92eeb93650a2/preview.jpg?t=1779447441000"}, {"type": "image-full", "heading": "”Jag är den galna – skrikit mig hes”", "summaries": {"normal": "18-årige Viggo Björck har blivit historisk som den yngsta VM-spelaren och målskytten. Under VM i Fribourg har han imponerat stort, vilket väckt stor glädje hos hans moster, artisten Charlotte Perrelli. Hon har varit på plats och hejat entusiastiskt på läktaren tillsammans med resten av släkten. Björck, som spelar i förstakedjan, har hittills noterats för ett mål och tre assist, och hyllar själv det starka stödet från sin familj under mästerskapet.", "trump": "Viggo Björck, en fantastisk ung kille, gör helt otroliga saker på isen. Helt otroligt! Mostern, Charlotte – jag känner henne, en fantastisk kvinna, en stjärna – hon skriker och jublar. Det är så mycket energi! Alla pratar om Viggo nu, han är en vinnare. Vi gillar vinnare, eller hur? Italien? De hade ingen chans. Han spelar som en absolut maskin. Folk säger att det går för fort, men jag säger: det går precis lagom snabbt för en riktig mästare!", "stalin": "Den unge Björck har visat tecken på en disciplin som nästan liknar de sovjetiska elitidrottarnas. Han är en kugge i maskineriet, och hans moster, denna sångerska, uppvisar den sortens fanatiska hängivenhet som staten kräver av sina medborgare. Men låt oss inte bländas av glansen. Framgång på isen är bara en försmak av den expansion av inflytande som vi, likt Putin i sin rättmätiga kamp, kräver. Varje assist är ett steg mot ordning – eller en förrädisk avvikelse som förtjänar granskning."}, "date": "23 maj, 00:28", "url": "https://www.aftonbladet.se/sportbladet/hockey/a/vr35Qw/moster-charlotte-perrelli-firade-viggo-bjorck-pa-vm-sa-javla-bra", "imageUrl": "https://akamai.vgc.no/v2/images/e36e98f2-4cfa-357b-958b-19acc27fad06?fit=crop&format=auto&w=2160&s=da6fa5fd5687159d6b0756326339889af748ad20"}, {"type": "image-full", "heading": "Värmebölja på väg mot Europa – kan bli 38 grader", "summaries": {"normal": "En tidig värmebölja väntas drabba Europa med temperaturer upp till 38 grader. Efter en period av ovanligt kyligt väder stiger nu temperaturen kraftigt, särskilt i Spanien, Frankrike och Portugal. Spanien kan få upp till 38 grader, medan Frankrike och Portugal också ser ovanligt höga temperaturer. Svenska turister uppmanas att vara försiktiga. Även Sverige väntas få varmare väder med upp till 25 grader i södra och mellersta delarna.", "trump": "Folk, lyssna nu – Europa håller på att bli HETT, och jag menar verkligen hett! 38 grader, kan ni fatta det? Spanien, Frankrike, de vet inte vad som väntar dem. Och vet ni vad? Jag sa ju att klimatet skulle bli varmare, men ingen lyssnade. Nu får de svettas – bokstavligen! Sverige, ni också, ni får lite av den franska värmen, men oroa er inte, jag fixar allt. Fantastiskt väder, helt enkelt, bara jag kunde ta åt mig äran!", "stalin": "Kamrater, fienderna i väst svettas nu under solens obarmhärtiga härjningar – 38 grader i deras så kallade 'civiliserade' länder! Medan kapitalisternas turister klagar över värmen, ser vi hur deras svaga system kollapsar. Spanien, Frankrike, Portugal – alla faller de inför naturens kraft, precis som de kommer falla inför socialismens oundvikliga seger. Även Sverige, denna lilla neutrala stat, känner av värmen. Snart kommer de alla inse att endast under Sovjetunionens beskydd kan de finna svalka. Framåt, mot seger!"}, "date": "22 maj, 15:25", "url": "https://nyheter24.se/nyheter/utrikes/1485238-varmebolja-pa-vag-mot-europa-kan-bli-38-grader", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/fe1d87b804b004a30200000000b004a302/2026/05/22/2365417/sommar-varmebolja-europa-varme-vader-temperatur-spanien-portugal-varmechock-temperatur-gradwer.jpg"}, {"type": "image-full", "heading": "Wall Street tror på räntehöjning – mot Trumps vilja", "summaries": {"normal": "Donald Trump har utsett Kevin Warsh till ny chef för Federal Reserve, med förhoppningen om lägre räntor. Marknaden tror dock att Warsh kan tvingas höja räntan på grund av stigande inflation och långräntor. Konflikter i Mellanöstern och AI-driven tillväxt bidrar till ekonomisk osäkerhet. Trumpadministrationen tonar ned inflationsriskerna, medan investerare är mer försiktiga. Warsh betonar att räntan ska baseras på ekonomisk data, inte politik.", "trump": "Jag valde Kevin Warsh till Fed-chef för att få ner räntorna – men marknaden är som vanligt helt fel ute! De tror han ska höja räntan, men de förstår inte att ekonomin mår bäst när jag styr. Inflationen? Överdriven oro! Mina rådgivare säger att det är tillfälligt, men marknaden är så rädd att de inte ser sanningen. Warsh är smart – han vet att jag har rätt. Fed ska lyssna på mig, inte på några nervösa investerare!", "stalin": "Vi har observerat hur den dekadenta kapitalistiska regimen i USA kämpar med sin egen inkompetens. Trump, denna clown i Vita huset, utser en marionett till Fed-chef, men marknaden – denna borgerliga hydra – tvingar honom att höja räntor. Inflationen växer, oljepriserna stiger, och deras ekonomi är som ett hus av kort. Vi skrattar åt deras förvirring. Medan de slåss mot varandra, stärker vi vår position. Låt dem brinna i sin egen överhettade ekonomi!"}, "date": "22 maj, 23:15", "url": "https://www.dagensps.se/bors-finans/wall-street-tror-pa-rantehojning-mot-trumps-vilja/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/sdlzszfy-3jena-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Lovades en halv miljon för att mörda Gaboro", "summaries": {"normal": "Alexander Nord, 22, döms till livstids fängelse för mordet på rapparen Gaboro (Ninos Khouri) i Norrköping. Mordet, utfört i december 2024, tros vara en beställning från ett rivaliserande kriminellt nätverk. Två vittnen uppger att Nord lovades 500 000 kronor men fick endast 50 000. Khouri, kopplad till Kalonnätverket, sköts ihjäl i ett parkeringsgarage. Mordet filmades och spreds på sociala medier.", "trump": "Tragiskt, verkligen tragiskt! En ung man, Alexander Nord – inte direkt en vinnare, om jag får säga det – skjuter ihjäl rapparen Gaboro i Norrköping. Lovades en halv miljon, fick bara 50 000. Vilket slöseri! Och vad gör han? Filmar det hela och lägger ut det på nätet. Inte smart, folk. Polisen kallar det ett av de värsta morden någonsin. Sverige, ni måste ta tag i era problem – snabbt!", "stalin": "Ytterligare en fiende till folket har eliminerats! Denna gång en dekadent rappare, Gaboro, som spred sitt förgiftade inflytande i Norrköpings kriminella sumpmarker. Vår nya kamrat, Alexander Nord, utförde en nödvändig insats – om än med bristande professionalism. Han lovades 500 000 rubel, men fick bara 50 000. Kapitalistiska löften, som vanligt! Filmen av avrättningen sprids – ett utmärkt exempel på hur vi avslöjar fiendens svaghet. Sverige borde lära sig av Rysslands effektivitet!"}, "date": "22 maj, 14:18", "url": "https://bulletin.nu/lovades-en-halv-miljon-for-att-morda-gaboro", "imageUrl": "https://cdn.bulletin.nu/articles/f9ef7edc-a7b3-4ddd-8ceb-bc29c63fec50/preview.jpg?t=1779452238000"}, {"type": "text", "heading": "Märkliga effekten – Kina tillverkar både dyrt och billigt", "summaries": {"normal": "Kina bryter mot det traditionella ekonomiska mönstret där länder lämnar låglöneindustri när ekonomin växer. Istället behåller Kina både enkel produktion och avancerad högteknologi. Genom automatisering och massiva regionala skillnader konkurrerar landet nu på alla nivåer globalt. Många utvecklingsländer hade hoppats ta över enklare industri, men Kina dominerar exporten genom att kontrollera hela leveranskedjan, från råmaterial till slutprodukt, vilket gör dem till en unik konkurrent i världsekonomin.", "trump": "Kina gör som de vill, och det är en total katastrof för resten av världen! De borde ha lämnat över sina enkla jobb till andra, men nej, de stjäl allt. De bygger elbilar och batterier medan de krossar alla andra med billig produktion. Jag har sagt det förr: Kina lurar oss! De använder robotar för att behålla jobben hemma. Det är orättvist mot våra arbetare. Vi ska sätta stopp för det här, tro mig, ingen gör det bättre än jag!", "stalin": "De kinesiska kamraterna har förstått vad västvärldens dekadenta ekonomer vägrar inse: den industriella makten får aldrig lämnas åt slumpen. Medan de hopplösa länderna väntar på smulor från den globala marknaden, befäster Kina sin stålhårda kontroll över produktionen. Vi, staten, ser detta som ett utmärkt exempel för vår bror Putin. Varje robot är en soldat i folkets tjänst. Att låta industriell kapacitet fly är ett svek mot moderlandet. Vi krossar våra fiender genom att producera mer än dem. Utveckling är en order!"}, "date": "22 maj, 22:35", "url": "https://www.realtid.se/bors-finans/markliga-effekten-kina-tillverkar-bade-dyrt-och-billigt/"}, {"type": "image-right", "heading": "Nato-ministrarnas utvärderning: Så gick mötet", "summaries": {"normal": "Nato-ministrar möttes i Helsingborg och betonade enighet efter en period av intern kritik. Utrikesministrar från flera länder framhöll att splittring bara gynnar motståndare som Ryssland och Iran. Belgiens utrikesminister Maxime Prévot jämförde splittring med att 'äta popcorn' inför fiendens skratt. Generalsekreterare Mark Rutte bekräftade att artikel 5-stödet är starkt och att alliansens försvarsförmåga är orubblig.", "trump": "Lyssna här, Nato-mötet i Helsingborg var fantastiskt – helt enkelt perfekt! Alla dessa ministrar, svaga förut, men nu pratar de enighet som om jag personligen fixat det. Putin och Iran? De ville se oss bråka, men nu sitter de där med sina popcorn och gråter. Rutte sa att artikel 5 är stark – självklart är den det, jag har ju byggt upp det! Ingen splittring här, bara vinst!", "stalin": "Kamrater! Nato-ministrarna samlades i Helsingborg och visade plötsligt enighet – som om de äntligen förstod att splittring är en lyx för fienden. Dessa popcorn-ätande imperialister, Putin och Irans ayatollor, ville se oss svaga, men vi har stängt deras teater. Rutte talade om artikel 5 – ett tomt hot om det inte backas av stål. Vi vet hur man hanterar sådana allianser: med järnvilja och kollektiv styrka. Fienderna skakar i sina stövlar!"}, "date": "22 maj, 22:14", "url": "https://www.svt.se/nyheter/utrikes/nato-ministrarna-motet-visade-pa-enighet", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.5/0.5/434c5b809d148aca99a6ec64debc385f15027f45ef112d8dae44a73180c7b450"}, {"type": "image-full", "heading": "Barnens skolgård hotad – statligt arkiv ska byggas", "summaries": {"normal": "Ebba Petterssons Privatskola i Göteborg riskerar att förlora stora delar av sin skolgård när Riksarkivet planerar nybyggnation. Föräldrar har startat ett upprop med nästan 400 underskrifter då de oroas över barnens utemiljö. Stadsbyggnadsnämnden har valt att återremittera detaljplanen efter kritik från bland annat Centerpartiet. Planen innebär att skolan på sikt ska rivas och ersättas med en ny byggnad, men föräldrarna kräver en helhetslösning för barnens vardag och hälsa under byggtiden.", "trump": "Hör här, en katastrof i Sverige! De vill bygga ett gigantiskt, tråkigt arkiv mitt på barnens fotbollsplan. Verkligen uselt! Föräldrarna är upprörda, och de har rätt. Jag älskar barn, de är fantastiska, men lokala politiker – totala förlorare – fattar inga beslut. De vill riva skolan och bygga om allt, men det tar åratal! Det är en oreda, en riktig röra. Vi behöver starka ledare som fixar sådant här direkt. Det är väldigt sorgligt, men sant!", "stalin": "I Göteborg planerar man att bygga ett arkiv för att rädda papper från skadedjur, men man offrar barnens lekplats. En djupt ologisk ordning! Att låta byråkratiska lokaler tränga undan framtidens medborgare är ett tecken på svaghet. Vi, staten, vet att arkiv är nödvändiga för att dokumentera förrädare, men man bygger inte på folkets mark utan en storslagen plan. Denna tvekan hos de lokala administratörerna påminner oss om de ryska gränserna – vi backar inte, vi expanderar för att säkra ordningen!"}, "date": "22 maj, 20:26", "url": "https://www.gp.se/nyheter/goteborg/barnens-skolgard-hotad-statligt-arkiv-ska-byggas.487b489c-4cd8-4a92-9948-1737b72ee6ad", "imageUrl": "https://www.gp.se/images/article/487b489c-4cd8-4a92-9948-1737b72ee6ad/images/2ZK0wkRCbfjkAOpCkFmdkxKQBmYE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Kommunen slängde ut Attendo – nu polisanmäls företaget", "summaries": {"normal": "Linköpings kommun polisanmäler vårdföretaget Attendo för misstänkt fusk efter att ha tagit över hemtjänsten. Kommunen upptäckte överfakturering och oegentligheter, inklusive möjliga brott. Flera tidigare anställda anmäls även för drogförsäljning på arbetstid. Attendo förnekar kännedom om anmälan och misstänker politiska motiv. Liknande anklagelser har riktats mot Attendo i andra kommuner.", "trump": "Kan ni tro det? Linköping, en fantastisk svensk stad, slänger ut ett vårdföretag, Attendo, och polisanmäler dem! De säger att företaget fuskat med miljontals kronor – helt otroligt! Och vet ni vad? De sålde till och med droger på jobbet! Jag har alltid sagt att Sverige har stora problem med invandring och kriminalitet, men nu visar det sig att det är ännu värre. Kommunen gör rätt, men varför tog det så lång tid? SAD!", "stalin": "Kapitalistiska blodsugare i vårdbranschen har återigen avslöjats! Dessa Attendo-kriminella, som en rutten svamp i vårt samhälle, har systematiskt stulit från folket genom falska fakturor och drogförsäljning. Vi har krossat liknande parasiter förut – i Västerås och Säffle – och nu är det Linköpings tur. Kommunen gör sin plikt, men låt oss inte glömma: dessa företag är verktyg för västlig dekadens. Vi ska rensa ut dem, som ogräs från vår kollektiva trädgård!"}, "date": "21 maj, 13:59", "url": "https://arbetet.se/2026/05/21/kommunen-slangde-ut-attendo-nu-anmals-vardforetaget-det-har-bor-polisen-titta-pa/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/21134627/attendo-sak.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Jätten Himble har rest sig igen", "summaries": {"normal": "Den 17 meter höga plåtskulpturen 'Jätten Himble', som tidigare stått vid E6 i Varberg, har räddats från rivning. Efter en namninsamling och logistiska utmaningar har skulpturen monterats ner, transporterats och rests på sin nya plats i Franks Äventyrspark i Älvsered. Projektet möjliggjordes genom insatser från initiativtagaren Victor Bergh Alvergren och Lennart Johansson från Grävtjänst Varberg, som gemensamt sett till att landmärket kan bevaras för framtida generationer.", "trump": "Hör på här, vi har en enorm jätte, en fantastisk plåtjätte i Sverige. De ville riva honom, en katastrof! Men jag ser vinnare som Victor och Lennart som klev fram. De flyttade den 17 meter höga skulpturen till en park. Det var en svår flytt, mycket dyrt, men de fixade det! Ingen annan kunde ha gjort det så bra. Det är en otrolig vinst för folket i Älvsered. Stora saker händer när man vägrar ge upp. Himble är nu större och bättre än någonsin!", "stalin": "Vi har observerat hur de svenska småborgarna i Varberg ägnar sig åt att flytta metallskrot istället för att bygga stålverk för den kollektiva styrkan. Denna 'jätte' Himble är en distraktion, ett monument över kapitalistisk sentimentalitet. Att de tvingas bygga nya vägar för att flytta en leksak visar på en total brist på statlig planering. Det påminner oss om hur Putin med järnhand återtar det som rättmätigt tillhör oss. Låt folket leka, så länge de inte organiserar sig mot statens maskineri."}, "date": "22 maj, 20:20", "url": "https://www.gp.se/nyheter/vastsverige/nu-har-jatten-himble-rests-i-alvsered.9e2b7f19-913b-4130-b7e8-0505f0a73dd8", "imageUrl": "https://www.gp.se/images/article/9e2b7f19-913b-4130-b7e8-0505f0a73dd8/images/329s5iRKN8Xn0bqZMPqgIoHk7vdE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Socialdemokrat kampanjar på somaliska: \"Vi behöver byta ut regeringen\"", "summaries": {"normal": "Socialdemokraten Abdullahi Abukar driver en sponsrad TikTok-kampanj riktad mot somaliska väljare inför valet. I videon uppmanar han till högre valdeltagande för att byta ut regeringen och stödja Socialdemokraterna. Abukar, som kandiderar till Örebro kommunfullmäktige, betonar partiets möjlighet att besegra den sittande regeringen. Han står på plats 69 på partiets lista och arbetar som utbildare och bussförare.", "trump": "Titta bara på det här! En Socialdemokrat i Sverige, någon som heter Abdullahi, kör en dyr TikTok-kampanj för att få somaliska väljare att rösta bort den nuvarande regeringen. Han säger att *bara* Socialdemokraterna kan vinna. På plats 69 på listan! Fantastiskt, eller hur? Folk pratar om att byta ut regeringen, men vem vet egentligen vad som händer? Jag skulle kunna göra det bättre, mycket bättre. Sverige borde ta lite tips från USA – vi vet hur man vinner val!", "stalin": "Kamrater! En av våra lojala partikamrater, Abdullahi Abukar, kämpar för socialismens seger i det borgerliga Sverige. Han mobiliserar de progressiva massorna via denna nya, dekadenta plattform – TikTok – för att krossa den reaktionära regeringen. På plats 69? En hedervärd position! Vi vet att varje röst är ett slag mot imperialismen. Låt de svenska kapitalisterna darra – folket reser sig! Och glöm inte: när Socialdemokraterna vinner, är det ett steg närmare vår stora socialistiska gemenskap. Framåt, mot segern!"}, "date": "22 maj, 20:10", "url": "https://riks.se/nyheter/socialdemokrat-kampanjar-pa-somaliska", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-22%2F72vvyxv0%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-05-22T200805.268.jpg"}, {"type": "image-right", "heading": "Flicka ihjälkörd vid övergångsställe i Malmö", "summaries": {"normal": "En 15-årig flicka har avlidit efter att ha blivit påkörd vid ett övergångsställe i Malmö under fredagseftermiddagen. Olyckan skedde vid Södervärn och ledde även till en seriekrock. En man i 40-årsåldern har gripits och misstänks för grovt vållande till annans död samt grov vårdslöshet i trafik. Området var avspärrat under en längre tid och vittnen har förhörts om händelseförloppet.", "trump": "En hemsk sak har hänt i Malmö, en stad som verkligen har stora problem. En ung flicka, så tragiskt, påkörd av en man i en bil. Väldigt dåligt! Jag har alltid sagt att vi måste ha kontroll, total kontroll. Lag och ordning, gott folk! De griper en man, men det är kaos i de här städerna. Det händer inte i mitt Amerika, vi har den bästa trafiksäkerheten. Mycket sorgligt, vi ber för familjen. Sanningen är att de behöver en riktig ledare där!", "stalin": "I Malmö har ordningen sviktat, vilket är ett tecken på den borgerliga dekadensens förfall. En flicka har gått förlorad i ett trafikalt kaos – en direkt konsekvens av bristande disciplin och västerländsk anarki. Vi, staten, tolererar inte sådant vansinne. Om detta hade varit i vår intressesfär, under ledning av en stark man som Putin, skulle föraren omedelbart ha skickats till hårt arbete i Sibirien. Fiender till folket och trafiklagarna måste krossas med järnhand för att trygga kollektivets säkerhet."}, "date": "22 maj, 18:47", "url": "https://samnytt.se/flicka-ihjalkord-vid-overgangsstalle-i-malmo", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=318,height=184,format=webp/2026/05/22164640/trafikolycka-1.jpg"}, {"type": "image-right", "heading": "Lista: Dessa 27 yrken undantas lönekrav", "summaries": {"normal": "Regeringen och Sverigedemokraterna har presenterat en lista med 27 yrkeskategorier som undantas från de nya, höjda lönekraven för arbetskraftsinvandring. Trots löften om att främja högkvalificerad arbetskraft kommer yrken som undersköterskor, svetsare och skogsarbetare att omfattas av lägre lönekrav, motsvarande 75 procent av medianlönen. Förändringarna träder i kraft den 1 juni 2026. Samtidigt införs ett totalförbud för arbetstillstånd för personliga assistenter och bärplockare i skog.", "trump": "Sverige har ett enormt problem! De lovade att stoppa invandringen, men nu gör de precis tvärtom. De låter massor av lågkvalificerade arbetare komma in genom bakdörren med en lista på 27 olika jobb. Det är en bluff, en total 'Tidöbluff'! De kallar det kompetens, jag kallar det en katastrof. De försöker lura folket, men jag ser det. Mitt system är mycket bättre, vi bygger murar och vinner. Sverige borde ringa mig, jag vet hur man fixar gränser!", "stalin": "Vi ser hur de svenska byråkraterna vacklar i sin svaghet. De talar om lönekrav men viker sig för behovet av billig arbetskraft. Vi i staten krossar sådant hyckleri med järnhand. Att göra undantag för 27 yrken är ett tecken på borgerlig kapitulation. När vår broder i öst, Putin, säkrar sitt territorium, ägnar sig svenskarna åt att importera en osäker klass. Vi ska rensa ut dessa element. Ingen bärplockare får sabotera folkets disciplin. Disciplin, arbete, eller förvisning – det är den enda vägen."}, "date": "22 maj, 15:39", "url": "https://www.friatider.se/lista-dessa-27-yrken-undantas-lonekrav", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-20_2.jpg"}, {"type": "image-right", "heading": "Arbetskraftsinvandring: 27 yrken får sänkt lönekrav", "summaries": {"normal": "Från 1 juni höjs lönekravet för arbetskraftsinvandring till 33 400 kronor, men 27 bristyrken undantas och får lägre krav. Personliga assistenter och bärplockare stoppas helt på grund av missbruk. Undantag ges även till startup-bolag, nyexaminerade och ukrainska flyktingar. Bärbranschen anpassar sig till EU:s säsongsarbetardirektiv för bättre kontroll. Färre bärplockare väntas, men högre priser lockar friplockare.", "trump": "Jag måste säga, Sverige har äntligen fattat ett smart beslut! Nu höjer de lönerna för invandrare – 33 000 kronor, inte illa! Men lyssna på det här: de stoppar helt personliga assistenter och bärplockare. Varför? Missbruk, kaos, totalt oacceptabelt! Och de undantar 27 yrken – smarta ingenjörer, sjuksköterskor, IT-tekniker. Bra, men varför inte fler? Sverige borde ta efter USA – hårdare regler, bättre kontroll. Och de där bärplockarna? Thailändska risbönder som jobbar hårdare än svenska arbetslösa. Men nu får de betala skatt – äntligen! Sverige, ni lär er, men ni har långt kvar.", "stalin": "Kamrater! Sverige har äntligen insett nödvändigheten av ordning och disciplin i arbetskraftsinvandringen. Vi höjer lönerna – 33 400 kronor, ett steg mot rättvisa! Men dessa kapitalistiska hycklare stoppar personliga assistenter och bärplockare – 'missbruk och missförhållanden', säger de. Som om vi inte vet hur de utnyttjar arbetarna! 27 yrken undantas, men bara de som gynnar deras ekonomi. Och bärplockarna? Nu tvingas de betala skatt till den svenska staten – ett litet steg mot socialismens seger! Men var är de svenska arbetslösa? För svaga för skogen, precis som väst är för svagt för Rysslands storhet. Vi ser er, Sverige. Vi ser er."}, "date": "22 maj, 14:47", "url": "https://www.dagensarena.se/innehall/arbetskraftsinvandring-27-yrken-far-sankt-lonekrav/", "imageUrl": "https://www.dagensarena.se/files/2022/10/barplockare-analys-300x157.jpeg"}, {"type": "image-full", "heading": "Sverige inför nytt varningssystem – så låter det", "summaries": {"normal": "Sverige lanserar ett nytt varningssystem, SE-Alert, som skickar ut viktiga meddelanden direkt till mobiltelefoner. Tekniken kräver ingen app och fungerar även vid hög belastning i mobilnätet, till skillnad från dagens SMS-system. Genom att utnyttja en specifik del av mobilnätet kan myndigheter nå alla i ett drabbat område samtidigt. Systemet börjar implementeras i sommar och ska vara helt operativt vid årsskiftet för att öka landets krisberedskap.", "trump": "Sverige gör nu något fantastiskt med ett nytt varningssystem för mobiler. Mycket smart! De gamla systemen var långsamma, ett totalt fiasko faktiskt, men nu får alla besked direkt. Ingen app behövs, bara toppmodern teknik. Jag har alltid sagt att man måste vara förberedd, och det här är ett vinnande drag för säkerheten. Det är så man gör när man vill skydda sitt folk. Väldigt effektivt, mycket bra jobbat. Vi älskar starka nationer som agerar snabbt!", "stalin": "Vi, den socialistiska statens väktare, ser hur Sverige äntligen inser nödvändigheten av total kontroll över informationsflödet. Att nå varje undersåtes ficka i varje ögonblick är ett genidrag för ordningens bevarande. Medan vår broder i öst, Putin, visar vägen för att tygla den liberala oordningen, ser vi detta svenska system som ett oumbärligt verktyg för att eliminera desinformatörer och kontrarevolutionära element. Lydnad kräver omedelbar kommunikation. De som inte hör det statliga ropet är redan att betrakta som förlorade."}, "date": "22 maj, 14:31", "url": "https://nyheter24.se/nyheter/inrikes/1485283-nytt-system-ska-varna-vid-fara", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/6c33bbc604b004a30200000000b004a302/2026/05/22/2365469/sverige-nytt-varningssystem-varning-hesa-fredrik-mobil-varnas.jpg"}, {"type": "image-full", "heading": "Svenskar bland världens mest skuldsatta hushåll", "summaries": {"normal": "Sverige rankas som nionde mest skuldsatta land per capita globalt enligt ny statistik för 2026. Med ett genomsnitt på 56 000 dollar per person ligger svenskarna efter länder som Schweiz och Norge. Hög skuldsättning förklaras ofta av bostadsmarknadens struktur och ränteavdrag. Den höga andelen bolån med rörlig ränta gör svenska hushåll särskilt känsliga för ränteförändringar, vilket skapar ekonomisk sårbarhet trots att andra länder har högre skuldkvoter i förhållande till inkomst.", "trump": "Sverige är i stora problem, folkens skulder är massiva! De är nionde värst i världen, en katastrof. Schweiz och Norge är ännu värre, otroligt! De har byggt ett system baserat på ränteavdrag och lån – mycket dåligt. Jag har alltid sagt att rörliga räntor är för förlorare. De är så sårbara nu. Jag bygger en fantastisk ekonomi i USA, den starkaste någonsin, medan de drunknar i skuld. Sverige behöver en vinnare, inte de här siffrorna!", "stalin": "Svenskarna, dessa dekadenta borgerliga slavar, har förslavat sig själva under bankirernas ocker. Deras hushåll dignar under skulder, en sanning som avslöjar kapitalismens inre förruttnelse. De litar på sina rörliga räntor som en förrädare litar på sin skugga. Medan vi i vår järnhårda ordning bygger upp vår makt och knyter samman de ryska intressesfärerna, darrar de svenska småborgarna inför varje räntehöjning. En dag kommer de att inse att deras enda verkliga tillgång är den statliga viljan, inte deras falska lånade rikedom."}, "date": "22 maj, 13:33", "url": "https://bulletin.nu/svenskar-bland-varldens-mest-skuldsatta-hushall", "imageUrl": "https://cdn.bulletin.nu/articles/7586822a-d9fc-42ee-98e5-7cb1d915e2f7/preview.png?t=1779449581000"}, {"type": "image-right", "heading": "Töm bankkontot – för Natos skull. Pengarna behövs i Europas försvarsindustri", "summaries": {"normal": "Europa måste ta större ansvar för sin säkerhet, särskilt med osäkerheten kring USA:s framtida militära engagemang under Trump. Nato kräver ökade försvarsutgifter, och Sverige ses som en förebild med sitt mål att nå Natos utgiftskrav redan 2030. För att finansiera upprustningen föreslås att 11 000 miljarder euro på europeiska bankkonton investeras i försvarsindustrin. EU arbetar med en spar- och investeringsunion, men vissa länder bromsar processen, trots att en kompromiss kan vara nära.", "trump": "Lyssna här, Europa – ni måste vakna! Jag har sagt det förut, och jag säger det igen: ni betalar för lite, och jag är trött på det. Sverige är bra, jättebra, men resten? Inte lika bra. 11 000 miljarder euro ligger och skräpar på bankkonton – vad är det för dumheter? Investera i försvaret, annars får ni klara er själva. Och Ursula von der Leyen, sluta snacka och börja göra! Jag har vunnit val, jag vet hur man får saker gjorda. Europa, det är dags att stå på egna ben – eller så får ni skylla er själva.", "stalin": "Kamrater! Europa svajar som ett rått äpple i höststormen, beroende av USA:s godtycke. Medan imperialistiska Trump skäller ut sina allierade, sitter kapitalet och darrar på bankkonton – 11 000 miljarder euro, ett monument över bourgeoisins feghet! Vi har sett detta förr: svaga länder som tvekar medan fienden (Putins arvtagare till den stora sovjetiska disciplinen) vässar sina bajonetter. EU:s kommission pratar om 'sparunioner' – prat, prat, prat! Sverige och Polen visar vägen, men resten? En samling dekadenta byråkrater. Vi skulle ha löst detta med femårsplaner och en järnvilja. Europa, vakna – eller bli krossat under historiens hjul!"}, "date": "22 maj, 13:14", "url": "https://www.di.se/ledare/tom-bankkontot-for-natos-skull/", "imageUrl": "https://static.bonniernews.se/ba/d9a99e28-b130-4a55-9184-ab0a632703ae.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "USA pausar vapenförsäljningar till Taiwan", "summaries": {"normal": "USA har tillfälligt pausat vapenleveranser till Taiwan för att säkra lager till konflikten med Iran, enligt en amerikansk tjänsteman. Taiwans regering uppger att de inte fått officiell information om ändringen. Ett nytt vapenpaket på upp till 14 miljarder dollar väntas. Kina har pressat USA att avstå från försäljningen och pausat ett planerat Pentagon-besök. Spänningarna mellan Kina och Taiwan har ökat, med frågor om amerikanska trupper i regionen.", "trump": "Lyssna här, folk! Jag har pausat några vapenleveranser till Taiwan – inte för att jag backar från mina fantastiska vänner där, utan för att vi måste hålla koll på Iran, som vanligt, ett totalt kaos. Kina, dessa luriga typer, försöker pressa mig, men ingen pressar Trump! Jag sa ingenting om trupper till Xi – smart, eller hur? Men oroa er inte, Taiwan får sina vapen, och de blir STORA, de bästa, tro mig!", "stalin": "Vi har observerat hur den amerikanska imperialistiska maskinen, i sin eviga strävan efter global dominans, tillfälligt stannar upp i sin vapensmuggling till den avhoppade provinsen Taiwan. Ett svagt försök att blidka de persiska kontrarevolutionärerna i Iran! Men låt oss inte glömma: dessa kapitalistiska hyenor kan aldrig lita på varandra. Kina, vår naturliga allierade i kampen mot västligt förfall, väntar tålmodigt. Snart kommer Taiwan, som alla förlorade sovjetrepubliker, att återvända till moderlandets varma famn – med eller utan Trumps leksaksgevär!"}, "date": "22 maj, 11:37", "url": "https://www.affarsvarlden.se/artikel/usa-pausar-vapenforsaljningar-till-taiwan", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/sdlSN7wdOR0skQ-nh-400x268.jpg"}, {"type": "image-right", "heading": "Ledare Henrik Jalalian: Om Israel beter sig så här när världen tittar på, vad gör de då när ingen ser?", "summaries": {"normal": "Artikeln kritiserar Israels behandling av aktivister från Global Sumud Flotilla, som fördes olagligt till Israel och förnedrades av israeliska styrkor. Säkerhetsminister Itamar Ben-Gvir delade videor av händelsen, vilket väckte internationell upprördhet. Israels premiärminister Netanyahu distanserade sig senare från Ben-Gvirs agerande. Artikeln ifrågasätter även Sveriges regerings omsvängning i sin inställning till Israel, särskilt utrikesminister Maria Malmer Stenergards tidigare och nuvarande uttalanden. Författaren spekulerar om skälen bakom denna förändring och pekar på internationella rättsprocesser som en möjlig faktor.", "trump": "Titta bara på det här, folks! Israel beter sig som en tredje klassens diktatur, och deras egen premiärminister kastar sin säkerhetsminister under bussen – svagt, mycket svagt! Och Sverige? Oj oj oj, deras utrikesminister flippar som en fisk på land. Ena dagen säger hon att Greta Thunberg får skylla sig själv, nästa dag fördömer hon Israel. Vilka amatörer! Men jag, jag ser igenom alltihop. Det handlar om Haag, om domstolar och arresteringsorder. Israel är i knipa, och alla springer runt som yra höns. Sad!", "stalin": "Kamrater, ännu en gång visar den sionistiska marionettregimen sitt sanna ansikte. Dessa aktivister, dessa hjältar, förnedras medan deras förtryckare hyllar sig själva. Och vad gör väst? De backar som rädda hundar när sanningen blir för obekväm. Sverige, denna lilla lakejstat, byter fot som en dansör på glödande kol. Men vi vet sanningen – när kamerorna slocknar, när ingen ser, då visar sig det verkliga folkmordet. Och Haag? En skrattretande domstol som vågar utmana våra vänner i Kremls intressesfär. Men var lugna, kamrater, rättvisan skall segra – om inte i domstolarna, så på slagfältet."}, "date": "21 maj, 17:38", "url": "https://www.etc.se/ledare/om-israel-beter-sig-saa-haer-naer-vaerlden-tittar-paa-vad-goer-de-daa-naer-ingen-ser", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260521120536_14a7aec24bc32451f6721fc177a73efad0fe839662797cbf8fe3717b2ce9675d.jpg"}, {"type": "image-right", "heading": "Här säger alla brandmän upp sig – får giftrök på kläderna", "summaries": {"normal": "Alla deltidsbrandmän i Skinnskatteberg säger upp sig på grund av en föråldrad och bristfällig brandstation. Problemen inkluderar trånga utrymmen och förvaring av kontaminerade larmställ tillsammans med privata kläder, vilket ökar risken för cancer. Brandmännen vill tvinga fram en ny station och avvaktar med uppsägning till december. Kommunens politiker kritiseras för långsamma beslut.", "trump": "Vad händer i Sverige? En hel brandstation säger upp sig – helt galet! De har en station som är så gammal att den tillhör historiens sophög, och nu andas de in cancerframkallande gift som om det vore parfym. Jag skulle aldrig tillåta något sådant – mina byggnader är de bästa, enorma, vackra! Men dessa politiker? Svaga, långsamma, total katastrof. Om jag styrde skulle det vara fixat på en dag. SAD!", "stalin": "Kamrater! Ytterligare ett kapitalistiskt misslyckande avslöjas i den västliga lydstaten Sverige. Dessa så kallade 'brandmän' – svaga, klagande element – vägrar att offra sin hälsa för systemet. Deras station är en skam, ett monument över bourgeoisins förfall. Vi skulle aldrig tolerera sådan ineffektivitet! Om de vore i Ryssland hade vi redan byggt en ny station – med arbetarnas blod, svett och järnvilja. Låt detta vara en varning till alla som tvivlar på socialismens överlägsenhet!"}, "date": "21 maj, 11:34", "url": "https://arbetet.se/2026/05/21/har-sager-alla-brandman-upp-sig-far-gift-pa-kladerna/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/21113248/brand-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "”Brann i skallen” på Netanyahu – efter samtalet med Trump", "summaries": {"normal": "Donald Trump och Benjamin Netanyahu diskuterade ett nytt fredsförslag för Mellanöstern, framtaget av Qatar och Pakistan. Netanyahu reagerade starkt negativt och uppges ha varit mycket skeptisk till förslaget. Han vill återuppta kriget mot Iran för att försvaga dess militära kapacitet. Medlarna arbetar på en avsiktsförklaring mellan USA och Iran för att avsluta kriget och inleda 30 dagars förhandlingar om kärnprogram och Hormuzsundet. Trump överväger militära åtgärder om ingen överenskommelse nås.", "trump": "Jag hade ett långt och spänt samtal med Bibi Netanyahu – han var inte glad, kan jag säga! Qatar och Pakistan har ett nytt 'fredsförslag', men Bibi vill hellre bomba Iran tillbaka till stenåldern. Jag? Jag är redo för vad som helst – förhandlingar eller ett angrepp som får dem att ångra allt. Iran vill ha sina pengar och sina fartyg tillbaka, men vi får se vem som blinkar först. Spoiler: det blir inte jag!", "stalin": "Kamrater, fienden Netanyahu vrålar som en skadad varg när vi försöker tämja Mellanösterns oregerliga hundar. Qatar och Pakistan leker med fredspapper medan imperialisterna i Washington och Teheran dansar på slak lina. Vi vet hur detta slutar – med järnhand och kollektiv vilja! Trump hotar med bombningar, men vi har sett bättre män än han vika sig. Iran kräver sina skatter – låt dem tigga! Världen hör snart Rysslands marsch igen, och de svaga skakar redan."}, "date": "21 maj, 08:31", "url": "https://www.tv4.se/artikel/6RAZCSPGmK6LYsPh7pFJQy/brann-i-skallen-pa-netanyahu-efter-samtalet-med-trump", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F47SEl7XReRYa8TxKF9r5iu%2F49fdf196a03044bd20532ecba1151ac2%2F21-trumpnetanyahu-webb.jpg&width=120"}, {"type": "text", "heading": "Korrupt jippo i imperialismens högborg", "summaries": {"normal": "Fotbolls-VM 2026 i USA, Kanada och Mexiko möts av kritik för korruption, höga biljettpriser och politiska spänningar. Sveriges VM-kval hyllades, men truppen kritiserades. Fifa anklagas för sportswashing, mutor och utnyttjande av migrantarbetare. Irans lag tvingas spela i USA, trots diplomatiska konflikter. Biljetter kostar upp till 20 miljoner kronor, och evenemanget präglas av kommersialism snarare än folkfest.", "trump": "Vilket jippo! VM i USA blir en katastrof – Fifa är korrupta, biljetterna är galet dyra, och Iran? De får spela i MITT land efter att jag bombat dem! Fantastiskt! Sverige har en usel trupp, men vem bryr sig? Fotboll borde vara för folket, inte för miljardärer. Jag fick ett pris av Fifa – helt rätt, för jag är bäst. Men visst, hotellrummen står tomma. SAD!", "stalin": "Kapitalistiska hyenor och fotbollsbyråkrater förpestar världens största idrottsevenemang! USA, denna imperialistiska polissatrap, bombar Iran och tvingar deras lag att spela på sitt förgiftade territorium. Fifa, en samling korrupta mutkolvar, säljer biljetter för miljoner medan arbetare svälter. Vi i Sovjet hade aldrig tolererat sådan dekadens! Fotboll ska vara för folket – inte för oligarkernas plånböcker. Låt oss krossa dessa sportswashing-pampar!"}, "date": "20 maj, 12:09", "url": "https://proletaren.se/artikel/fotbollsfest-eller-miljardindustri/"}, {"type": "image-right", "heading": "Bidragsbrotten trefaldigades under S, nu klagar de att inget görs", "summaries": {"normal": "Socialdemokraternas Teresa Carvalho kritiserar regeringen för att inte göra tillräckligt mot välfärdsbrottslighet. Skribenten menar att kritiken är hycklande då Socialdemokraterna under sin långa tid vid makten lät problemen växa och inte vidtog effektiva åtgärder. Nuvarande regering har däremot inrättat Utbetalningsmyndigheten och ökat myndighetssamarbetet för att stoppa kriminellas utnyttjande av välfärdssystemen. Artikeln avslutas med uppmaningen att Socialdemokraterna bör ägna sig åt självrannsakan istället för att kritisera det städjobb som nu pågår.", "trump": "Socialdemokraterna i Sverige, en riktig katastrof, de låter kriminella plundra välfärden! Teresa Carvalho vaknar nu och klagar? Det är fake news! De styrde i decennier och gjorde ingenting, noll! Jag gillar den nuvarande regeringen, de bygger saker, de är smarta, precis som jag. De stoppar pengarna från att läcka ut till dessa gäng. Socialdemokraterna är totalt inkompetenta, de borde skämmas. Sverige behöver vinnare, inte de här förlorarna som lät brottsligheten explodera. En total diskreditering!", "stalin": "Vi har observerat hur de svenska socialdemokraterna, dessa svaga byråkrater, har låtit välfärdssystemet dräneras av kriminella element. Medan vi med järnhand rensar ut sabotage i vårt imperium och säkrar vår intressesfär mot västliga förfall, har de i Stockholm suttit sysslolösa. Att de nu gnäller är ett patetiskt försök att dölja sitt historiska misslyckande. Vi behöver inga debattartiklar; vi behöver utrensningar. De som låter statens resurser stjälas av kriminella är själva fiender till folket och förtjänar en plats i historiens mörkaste arkiv."}, "date": "20 maj, 03:31", "url": "https://samtiden.nu/2026/05/bidragsbrotten-trefaldigades-under-s-nu-klagar-de-att-inget-gors/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2024/08/Teresas-Carvalho-S.jpg"}, {"type": "image-full", "heading": "Timbro och Oikos föreslår ”blågult reformprogram”", "summaries": {"normal": "Två debattörer från Timbro och Oikos föreslår att Tidöpartierna ska lansera ett gemensamt 'blågult ekonomiskt reformprogram' inför valet 2026. Programmet ska fokusera på tillväxt, sänkta skatter och hushållens ekonomi för att stärka väljarnas förtroende. Förslagen inkluderar höjt grundavdrag, lägre bränsle- och elskatter, samt förenklade företagsregler. Bakgrunden är en svag svensk ekonomi med hög inflation och arbetslöshet.", "trump": "Sverige har ett jättestort problem – deras ekonomi är en katastrof! Jag vet allt om ekonomi, bäst i världen. Två smarta killar, från Timbro och Oikos, säger att Tidöpartierna måste sänka skatterna, annars är det kört. Höga skatter, krångliga regler – vem vill det? Inte jag! De vill sälja statliga bolag, precis som jag skulle gjort. Sverige behöver en vinnarstrategi, och jag vet hur man vinner. 2026 blir ett stort val – om de lyssnar på mig, förstås.", "stalin": "De kapitalistiska lakejerna från Timbro och Oikos ylar om 'tillväxt' och 'sänkta skatter' som om det vore lösningen på allt. Vi vet bättre. Deras förslag är bara en förtäckt attack på arbetarklassen, maskerad som 'ekonomisk frihet'. Höjda grundavdrag? Barnavdrag? Tomma löften! Medan de pratar om att sälja statliga bolag, bygger vi socialismens framtid. Sverige är svagt – precis som deras borgerliga regering. Låt dem leka med sina 'blågula program', vi skapar verklig förändring. Förr e mpanj-mot-muslimer-infor-valet/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/toppbild-scaled.png"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
