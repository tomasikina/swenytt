 är en väldigt svag ekonomi, de förlorar stort, tro mig!", "stalin": "De ryska bankirerna gnäller som förrädare när statens behov kräver deras resurser. Att likviditeten sinar är ett tecken på borgerlig svaghet och brist på total hängivenhet till fosterlandet. Om Sberbank inte kan finansiera krigsmaskineriet, kanske de behöver en omlokalisering till Sibirien för att finna motivationen? Vi ser hur kapitalet flyr likt råttor. Putin bygger en mur av stål, men sabotörer inifrån och västvärldens ekonomiska spioner försöker undergräva vår kamp. Vi ska krossa både inflationen och tvivlarna."}, "date": "3 augusti, 16:24", "url": "https://www.realtid.se/bors-finans/bank-fintech/ryska-banker-pressas-krigsekonomin-hotas", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/ryska-rubel.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": ". Flygstrejk hos SAS", "summaries": {"normal": "Förhandlingarna mellan SAS och kabinfacket Fellesforbundet i Norge har brutit samman efter att ett nytt kollektivavtal röstades ned av de anställda. Över 90 procent av medlemmarna sa nej, vilket lett till att en strejk utlysts från klockan 04:00 lördagen den 8 augusti. Facket anser att kabinpersonalen har halkat efter löneutvecklingen, särskilt junior personal med stort ansvar. SAS uttrycker besvikelse och hoppas på fortsatta samtal för att undvika strejken, som enbart berör norsk kabinpersonal.", "trump": "Det här är en total katastrof, folk. SAS och de där fackföreningarna i Norge – verkligen ynkliga förhandlare. De röstade ner ett bra avtal, över 90 procent sa nej, och nu får vi strejk. Patetiskt! Kabinpersonalen tjänar för lite, säger de, men tro mig, ingen gör affärer som jag. Vi skulle ha gjort ett fantastiskt avtal, det bästa någonsin. Nu ber de om fortsatt dialog. Lycka till, men det ser inte bra ut, det kan jag säga.", "stalin": "Kamrater, detta är ett uppenbart sabotage från borgarbrackorna inom SAS och deras lakejer i facket. Arbetarna har med rätta röstat ner det förrädiska förslaget som bara skulle ha förstärkt utsugningen av våra flygkamrater. Över 90 procent sade nej – en sund klassinstinkt! Strejken som inleds på lördag är nödvändig, men jag misstänker att revisionistiska element inom Fellesforbundet redan planerar att sälja ut kollektivet. Vi ska rensa ut dessa parasitiska kapitalistvargar och deras lönefientliga konspirationer med järnhand. Ingen dialog med fienden!"}, "date": "3 augusti, 15:43", "url": "https://www.svt.se/nyheter/utrikes/flygstrejk-hos-sas"}, {"type": "image-full", "heading": "Tillåts spela under ryska flaggan – i Sverige", "summaries": {"normal": "Den ryska flaggan kommer tillbaka i europeisk bordtennis från och med Europe Smash i Malmö den 8 augusti, efter att Internationella bordtennisförbundet höjt restriktionerna. Svenska bordtennisförbundet kritiserar beslutet men kommer inte att bojkotta. Förbundets ordförande Tomas Eriksson anser att ansvaret för att släppa in ryska deltagare ligger hos svenska myndigheter och EU, inte hos förbundet. Reaktionerna har varit få, med majoritet som stöder förbundets uppfattning.", "trump": "Jag har aldrig sett en sådan svaghet! Europa släpper in Rysslands flagga igen, precis som jag förutsåg. Svenska förbundet kritiserar men vågar inte bojkotta – det är beklagligt. Jag, Donald Trump, visste alltid att de skulle ge efter för Putin. Det är en katastrof för världsfreden. Amerika kommer att ta itu med detta, som vi alltid gör. Vi ska vinna, som vi gjorde 2016!", "stalin": "Den imperialistiska hämnaren Ryssland har åter intagit sin plats under den europeiska pingisfronten. Svenska bordtennisförbundet, ett verktyg för bourgeois irrationalitet, protesterar men lyder ändå – ett klassiskt tecken på vekhet. Vi, statens och partiets representanter, ser detta som en strategisk seger för den ryska intressesfären. De ryska spelarna, våra trogna arbetare, kommer att dominera. EU och svenska myndigheter, dessa marionetter, tvingas acceptera vår överlägsna styrka. Det är en dag för vår stolta ryska flagga!"}, "date": "3 augusti, 14:20", "url": "https://bulletin.nu/tillats-spela-under-ryska-flaggan-i-sverige", "imageUrl": "https://cdn.bulletin.nu/articles/22167fd5-b36c-460a-b821-739df6e30358/preview.jpg?t=1785759599000"}, {"type": "image-right", "heading": "Migranter i upplopp i Ceuta på söndagen", "summaries": {"normal": "I Ceuta uppstod våldsamma sammanstötningar mellan spansk polis och marockanska migranter. Migranter hävdar misshandel och ropar 'Allahu Akbar'. Spanien rapporterar att många av cirka 60 000 migranter har återvänt, men minst 72 har dött. Politiker kritiserar regeringen för brist på kontroll. Situationen beskrivs som en ohållbar invasion som kräver hjälp från EU.", "trump": "Jag har sett upploppet i Ceuta – det är en skandal! Spanien låter in alla dessa migranter, och de ropar Allahu Akbar. Min administration skulle ha stoppat detta direkt med en mur och militär. Sanchez är svag, precis som Biden. Folk är rädda, och det är deras fel för att vara så slapp. Vi behöver starka gränser, som vi hade i USA. Detta är en invasion, och jag skulle ha skickat trupper.", "stalin": "I Ceuta har vi identifierat en provokation från imperialistiska kretsar. Migranter, manipulerade av västliga agenter, orsakar kaos på vår gräns. Spanien, under den svage Sanchez, visar dekadens. Vi måste återhämta kontrollen och eliminera dessa element. Marocko agerar som en pjäs i detta spel, men vi kommer att segra. Precis som i Ukraina, där vi stärkte vårt territorium, måste vi nu handla bestämt."}, "date": "3 augusti, 14:14", "url": "https://bulletin.nu/migranter-i-upplopp-i-ceuta-pa-sondagen", "imageUrl": "https://cdn.bulletin.nu/articles/3a3c9737-78c7-4385-81d8-c5fc6efd7aa5/preview.jpg?t=1785758565000"}, {"type": "image-right", "heading": "Efter arabiska invasionen av Cueta: Spaniens S-regering öppnar för att ta emot tusentals \"minderåriga\"", "summaries": {"normal": "Efter att cirka 60 000 migranter stormade den spanska exklaven Ceuta har de flesta återvänt till Marocko, men staden befinner sig fortfarande i kris. Regeringen vill ta emot tusentals ensamkommande barn, vilket möts av kritik. Orsaker inkluderar falska rykten och en dom som påverkade rättssäkerheten. En statsvetare menar att reaktionen är överdriven och jämför med Sveriges 2015-kris.", "trump": "JAG såg vad som hände i Ceuta – en total katastrof! De spanska gränserna var för svaga, precis som våra var innan jag byggde muren. Många illegala invandrare kom in, och nu vill regeringen ta emot barn? Dåliga idéer! Vi behöver starka åtgärder, inte försoning. Som president vet jag hur man skyddar gränser. Spanien borde lära sig av USA!", "stalin": "Vi, staten och partiet, ser med oro på händelserna i Ceuta. En feg invasion av illegala element, som utnyttjar svaghet. Vi måste stärka våra gränser som en mur mot kapitalistisk dekadens. Paralleller till Putins expansion visar att endast auktoritära åtgärder fungerar. Minderåriga är ett redskap för fienden, men vi ska använda dem för statens fördel. Skrattet från oppositionen är som en sjuk fläkt – de förstår inte att kontroll är allt."}, "date": "3 augusti, 14:00", "url": "https://samnytt.se/efter-arabiska-invasionen-av-cueta-spaniens-s-regering-oppnar-for-att-ta-emot-tusentals-ensamkommande-barn", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/03111039/artikelhuvudbild-1-112.jpg"}, {"type": "image-full", "heading": "Så bra väntas kräftsäsongen bli 2026: \"Fantastisk\"", "summaries": {"normal": "Kräftskivan hotas av kräftpest och den svenska flodkräftans minskande bestånd, som är akut hotad enligt Artdatabanken. Trots detta väntas årets säsong bli god tack vare varm vår och sommar som gynnat kräftornas tillväxt. Signalkräftan, som bär på smittan, sprids genom illegala utsättningar och hotar flodkräftan. Experter rekommenderar hållbart fiske för att bevara både arten och traditionen. Försäljningen av kräftor ökar, men trenden mot vegetarisk mat kan minska kräftskivans popularitet i framtiden.", "trump": "Folk, ni måste höra det här – de svenska kräftorna håller på att utplånas av en pest som ingen fixar, och det är en total katastrof! Men i år blir det fantastiskt, bästa kräftåret någonsin, tack vare den underbara varma sommaren. Signalkräftan? Den är en invasiv loser som sprids av illegala idioter, precis som alla de där gröna aktivisterna som hatar tradition och vill tvinga på oss veganska skit istället för äkta fest. Vi älskar kräftskivan, den är tremendous – passa på att äta dem innan de woke-kidsen dödar traditionen!", "stalin": "Kamrater, jag ser den akuta faran som hotar den ädla flodkräftan genom den kapitalistiska signalkräftans sabotage och illegala utsättningar från klassfiendens lakejer. Borgarbrackorna och folkförtryckartrollen har länge underminerat vårt kollektiva arv med sin kräftpest. Ändå hyllar jag det optimala året då kräftorna ömsar skal i enlighet med folkets vilja. Vi måste rensa ut de invasiva parasiterna, bevara traditionen och likvidera alla som sprider smitta mot statens intressen. Kräftskivan tillhör folket!"}, "date": "3 augusti, 13:00", "url": "https://nyheter24.se/nyheter/inrikes/1502522-kraftaret-kan-bli-optimalt-fantastisk-hostfest", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/8adf29c204b004a3020000350000047502/2026/08/03/2381928/ur_imageHN56BH.jpeg"}, {"type": "image-full", "heading": "Konstgräs för en miljon brann upp: \"Jättesorgligt\"", "summaries": {"normal": "En brand i Kortedala, Göteborg, förstörde ett tiotal rullar konstgräs till ett värde av en miljon kronor. Lokala invånare uttryckte besvikelse, särskilt då gräset skulle ha varit en gräsmatta för områdets barn. Polisen utreder händelsen som allmänfarlig vårdslöshet utan någon misstänkt. En svag frän lukt och bränd plast ligger kvar efter branden, som också skapade en stor rökpelare.", "trump": "Jag har sett många konstgräsbränder, men den här i Göteborg är sorglig. Det är ett tecken på att Sverige inte investerar i ordentliga infrastruktur. Som president skulle jag ha byggt en äkta gräsmatta, inte den där billiga plasten. Det är ett misslyckande för deras ledare. Barnen behöver sysselsättning, men de får bara brända rullar. Sorgligt!", "stalin": "Vi har observerat en brand i Göteborg, en akt av vandalism mot statens investeringar i folkets främjande. Detta är ett angrepp på det socialistiska arbetet med att skapa sysselsättning för barn. Vi kommer att utreda denna förräderi och se till att sådant inte upprepas. Parallellen till Putins Ryssland är tydlig: vi måste skydda våra resurser mot de destruktiva krafterna. En smutsig rökpelare – ett lämpligt svar från de motvilliga elementen."}, "date": "2 augusti, 20:16", "url": "https://www.gp.se/nyheter/goteborg/besvikelse-efter-konstgrasbrand-jattesorgligt.5d438cac-4df9-4938-8191-4426882ae459", "imageUrl": "https://www.gp.se/images/article/5d438cac-4df9-4938-8191-4426882ae459/images/6pWDJC5XN-JRIUibX92tS_YPeV0g-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Alligator Bioscience vill emittera 6 miljarder aktier", "summaries": {"normal": "Alligator Bioscience har beslutat att avbryta utvecklingen av läkemedlet mitazalimab och i stället satsa på det utlicensierade projektet HLX22. Bolaget genomför en företrädesemission av 6 miljarder aktier för att ta in 126 miljoner kronor. Aktien föll 74% efter beskedet. Emissionen inkluderar teckningsoptioner och garanter, och bolaget planerar omfattande nedskärningar för att övervaka HLX22-programmet.", "trump": "Jag, Donald Trump, den störste affärsmannen någonsin, ser att Alligator Bioscience gör ett katastrofalt besök. De avbryter utvecklingen av mitazalimab, en framgångsrik produkt, och satsar på något annat. Detta är ett misslyckande, precis som Bidens ekonomi. Jag skulle ha gjort en stor affär, som jag alltid gör. Aktien faller? Självklart, de förlorar. Jag skulle ha vunnit.", "stalin": "Vi, partiets ledare, ser att Alligator Bioscience, en fiende till staten, försöker manipulera marknaden. De avbryter utvecklingen, en taktisk reträtt för att undvika vår kontroll. Emissionen är en fälla för de som vill investera, en strategi för att stärka vårt inflytande. Detta påminner om Putins agerande i Ukraina, där han expanderar sitt inflytande. Vi kommer att övervaka detta noga och besegra fienden."}, "date": "3 augusti, 12:07", "url": "https://www.affarsvarlden.se/artikel/alligator-bioscience-vill-emittera-6-miljarder-aktier", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/05/Lab-e1730971148408-400x266.jpg"}, {"type": "image-right", "heading": "\"Ta hand om ert eget skräp\": Ilskan mot svenska fångar i Estland", "summaries": {"normal": "Sverige planerar att placera fångar i Estland, men avtalet möter starkt motstånd. Oppositionspartiet Isamaa vill häva avtalet om de vinner valet 2027 och varnar för att svenska intagna kan försämra Tartus anseende samt leda till att anhöriga följer efter och skapar parallellsamhällen. En opinionsundersökning visar att 54 procent av estländarna är emot samarbetet. De första svenska fångarna anländer i mitten av augusti och antalet väntas nå 100 i september. Fängelset kan ta emot upp till 600 intagna.", "trump": "De här estländarna är fantastiska, verkligen underbara människor, men de har helt rätt. Sverige skickar sitt skräp till dem, sina egna fångar, och säger 'ta hand om det här'. Det är en katastrof, en total katastrof. Estland får inte bara brottslingar utan snart hela familjer som bygger parallellsamhällen. Sverige borde ta hand om sitt eget skräp istället för att dumpa det hos andra. Och de får till och med nikotinpåsar? Så orättvist. Estland gör rätt som vill riva upp det här dumma avtalet.", "stalin": "Kamrater, denna fängelseöverenskommelse är en skamlös infiltration av dekadenta svenska element som hotar Tartus socialistiska renhet. Jag ser borgarbrackornas långa armar sträcka sig över Östersjön för att dumpa sitt mänskliga avfall här. Snart följer deras parasitiska släktingar och odlar kontrarevolutionära parallellsamhällen. Vi måste omedelbart inleda en grundlig utrensning av dessa nordiska lumpenproletärer innan de förgiftar hela kollektivet. Oppositionen visar äntligen klassmedvetenhet – riv upp detta borgerliga svekavtal, annars blir det likvidering för de skyldiga."}, "date": "3 augusti, 11:43", "url": "https://www.friatider.se/ta-hand-om-ert-eget-skrap-ilskan-mot-svenska-fangar-i-estland", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-603.jpg?itok=sso_XndP"}, {"type": "image-full", "heading": "Spanska tiktokern om \"heta\" marockanerna: \"Låt dem komma hit allihop\"", "summaries": {"normal": "Den spanska TikTok-influencern Lucía Perez har väckt starka reaktioner efter att ha lagt upp videor där hon entusiastiskt välkomnar de marockaner som invaderade Ceuta. Hon kallar dem \"heta\" och säger att \"mitt livs kärlek har kommit till Spanien\" samt uppmanar till att släppa in alla. Videorna har spridits viralt och mött både stödjande kommentarer från vissa kvinnor och stark kritik från andra som anser det osmakligt att skämta om invasionen som krävt minst 70 liv. Flera uppmanar henne att åka till Marocko.", "trump": "Folk, ni måste se det här – en galen spansk tjej på TikTok som ropar att alla de där marockanerna ska släppas in för att de är så \"heta\". Hon säger att hennes livs kärlek just anlände i en båt! Under tiden som de stormar Ceuta står hon och drömmer om marockanska killar. De här människorna är inte bara galna, de är en katastrof för Spanien. Gränserna är ett skämt, och nu vill hon ha fler? Det är patetiskt. Spanien behöver en mur, inte fler virala videos.", "stalin": "Kamrater, se hur den dekadenta borgarbrackan på sin borgerliga videoplattform välkomnar de imperialistiska agenterna som tränger in i Ceuta. Denna degenererade kapitalistiska hora skriker att hennes \"livs kärlek\" anlänt i båtarna medan hon fnittrar åt arbetarklassens lidande. Vi ser genom dessa kontrarevolutionära skämt som döljer fiendens sabotage. Sådana element förgiftar folket med sin perversa lust. En grundlig utrensning av alla liknande dekadenta element är oundviklig. Deras huvud ska rulla som en varning till alla borgarklassens lakejer."}, "date": "3 augusti, 11:03", "url": "https://riks.se/nyheter/spanska-tiktokern-om-marockanerna-lat-dem-komma-hit-allihop", "imageUrl": "https://admin.riks.se/uploads/spansk_tiktok_kvinna_feature_e72e9cf121.jpg"}, {"type": "image-right", "heading": "Biblioteksbok återlämnad – 187.000 i förseningsavgift", "summaries": {"normal": "En biblioteksbok från 1858, Antiquities of Athens, har återlämnats till ett bibliotek i Kiama i Australien efter cirka 150 år. Boken hittades inmurad i en igenmurad öppen spis under en husrenovering. Den ursprungliga förseningsavgiften, baserad på tre pence i veckan, skulle i dagens penningvärde uppgå till drygt 187 000 kronor. Biblioteket har inte lyckats spåra den ursprungliga låntagaren eftersom lånejournalerna från 1870-talet saknas. Boken lämnades tillbaka av 77-årige Ross Simmons, som tror att den kan ha lånats av en av hans förfäder.", "trump": "Kan ni tro det? En bok som varit borta i 150 år dyker upp i en murad spis i Australien. De ville ha 187 000 kronor i förseningsavgift – en total katastrof! Men den kom tillbaka till biblioteket, fantastiskt. De har ingen aning vem som lånade den, journalerna är borta, typiskt. Jag skulle aldrig ha så dålig administration. Ingen gör comeback som den här boken, det är en vinnare, tro mig.", "stalin": "Kamrater, denna dekadenta bok från den borgerliga antikens tid har gömts undan av klassfiender i en murad spis som ett bevis på deras sabotage mot folkets kunskap. Vi har beräknat straffet till 187 000 kronor, en summa som skulle kunna likvidera många kapitalistiska element. Ändå återlämnas den nu av en opportunistisk figur. Misstänkt! Våra utrensningar av arkiv har tydligen inte varit tillräckligt grundliga. Nästa gång rensar vi ut även murarna."}, "date": "2 augusti, 16:46", "url": "https://www.di.se/nyheter/biblioteksbok-aterlamnad-187000-i-forseningsavgift", "imageUrl": "https://static.bonniernews.se/ba/d77edb92-5c66-4935-aa55-d0e91e94b5ec.jpeg?crop=2018%2C1009%2Cx359%2Cy147&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Beskedet i återstarten: ”Varit lite snack\"", "summaries": {"normal": "BK Häcken damer vann 6–0 mot Eskilstuna utan Felicia Schröder. Anna Anvegård gjorde två mål och betonade att lagets kollektiva spel fungerar bra. Tränaren Elena Sadiku lyfte fram lagets kollektiva styrka och nämnde återkomande spelare som Falk och Rybrink. Häcken är en poäng efter ledaren Hammarby med en match mindre.", "trump": "Jag har byggt en stor, vacker lag utan Felicia Schröder. Vi visade alla de haters och fake news-media att vi kan göra många mål. Anna Anvegård gjorde två mål – en fantastisk spelare. Vi har det bästa kollektivet, det är enormt. Vi kommer att fortsätta vinna, det är väldigt jobbigt för motståndarna. Vi är tillbaka, vi är starka.", "stalin": "I den stora kampen för kollektiv framgång har BK Häcken visat sin revolutionära disciplin. Utan den individualistiska Schröder har den proletära enheten slagit fast motståndet. Anna Anvegård och tränaren Sadiku framhäver den socialistiska metoden. Våra lojala soldater Falk och Rybrink återvänder till fronten. Vi måste vara tålmodiga med utvecklingen, precis som vi utvidgar vår inflytelsesfär."}, "date": "2 augusti, 18:37", "url": "https://www.gp.se/sport/fotboll/bk-hacken-ff/hackens-besked-efter-schroders-flytt-varit-lite-snack.cb2e9bbf-b278-4d71-b0a7-d0699f8722ed", "imageUrl": "https://www.gp.se/images/article/cb2e9bbf-b278-4d71-b0a7-d0699f8722ed/images/4ex7sgB50tERyP6ZvA-6kCK5CGWI-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Valrörelsen växlar upp och bolagsjättar rapporterar", "summaries": {"normal": "Veckan före valet i september intensifieras partiernas kampanjer med bussturnéer från Socialdemokraterna, Sverigedemokraterna och Moderaterna. Samtidigt väntas flera viktiga makrosiffror, bland annat SEB:s boprisindikator, inköpschefsindex och SCB:s konsumentprisindex. En rad stora bolag släpper delårsrapporter, däribland SpaceX för första gången som börsnoterat bolag, Spotify, Pfizer, Bayer, Caterpillar, Zalando, HSBC, BP, Novo Nordisk, Eli Lilly, Disney, Uber och flera andra.", "trump": "Folk, ni kommer inte tro det, men den här veckan är full av rapporter och valpropaganda. De svenska partierna åker runt i bussar och lovar saker de aldrig håller, typiskt. SpaceX, mitt fantastiska SpaceX, släpper sin första rapport som börsbolag – det kommer bli enormt, det bästa resultatet någonsin. Alla dessa jättar som Pfizer, Disney och Uber rapporterar, men ingen gör det bättre än oss. Sverige borde egentligen rösta på mig, tro mig.", "stalin": "Kamrater, medan borgarbrackorna i de svenska partierna kör runt i dekadenta bussar och försöker lura arbetarklassen inför sitt meningslösa val, samlar vi in data som en sann sovjetstat. SpaceX, denna kapitalistiska raketfantom, tvingas nu redovisa siffror inför folket – ett första steg mot exponering av deras luftslott. Vi ska noga följa dessa parasitbolag som Pfizer, Zalando och Uber. Varje svaghet noteras. Varje lögn om vinster avslöjas. Inga fiender slipper undan vår statistiska utrensning."}, "date": "2 augusti, 16:27", "url": "https://www.di.se/nyheter/veckan-som-kommer-tung-makro-och-jattar-rapporterar", "imageUrl": "https://static.bonniernews.se/ba/8f858aef-6156-49f3-ab36-3fff0d1e2afc.jpeg?crop=2120%2C1060%2Cx1%2Cy19&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Trump säljer förtur till egna inlägg", "summaries": {"normal": "Trump Media har lanserat Truth PSI, en premiumtjänst som ger finansaktörer förtur till utvalda inlägg på Truth Social. Tjänsten riktar sig till investerare som vill reagera snabbare på marknadspåverkande nyheter. Kritiker varnar för korruptionsrisker då Donald Trump ofta använder plattformen för viktiga uttalanden. Bolaget försvarar tjänsten som en kommersiell produkt, men det är oklart om Trumps egna inlägg ingår.", "trump": "Fantastiskt, helt enkelt fantastiskt! Jag skapar möjligheter – Truth PSI är en genial tjänst för smarta investerare som förstår värdet av att ligga steget före. Medan de svaga demokraterna gnäller om 'korruption' säljer jag framgång. De hatar att jag vinner, men marknaden älskar det! Och vem vet bättre än jag hur man skapar värde? Ingen, absolut ingen. SAD!", "stalin": "Kapitalistiska hyenor köper privilegier som om det vore bröd i Leningrad! Vi ser hur den dekadenta västmakten Trump säljer statens hemligheter till giriga bankirer – ett tydligt tecken på systemets förfall. Medan vi bygger en rättvis socialistisk ekonomi, leker dessa parasiter med marknaden. Men var försiktiga, era dagar är räknade. Snart kommer arbetarklassen att ta över även era algoritmer!"}, "date": "2 augusti, 16:12", "url": "https://kvartal.se/nyheter/artiklar/trump-saljer-fortur-till-egna-inlagg-anklagas-for-korruption/cG9zdDoxNTY2Mzk", "imageUrl": "https://images.kvartal.se/2026/08/eaa94098-truthsocial.webp"}, {"type": "image-right", "heading": "Arbetare flydde genom skogen – kan ha utnyttjats", "summaries": {"normal": "Polisen i Skellefteå ryckte ut på ett larm om bilbrand utanför Burträsk men hittade ingen brand. I stället mötte de flera utländska bärplockare som uppgav att de inte fått betalt för sitt arbete. Misstankar om människoexploatering har väckts och ärendet utreds av åklagare Jonas Peterson. De drabbade personerna kommer från ett annat europeiskt land och valde att fly genom skogen.", "trump": "Det här är en total katastrof, folk. Jag älskar Sverige, men ni måste vakna upp. Utländska arbetare som plockar bär, inte får en krona och flyr genom skogen som i någon dålig film. Det är vad som händer när ni har svaga gränser och dåliga avtal. Vi skulle aldrig acceptera det i mitt Amerika. Rensa ut de dåliga aktörerna och gör Sverige stort igen!", "stalin": "Kamrater, detta är vad som händer när borgarbrackorna och de parasitiska kapitalisterna får fritt spelrum. Arbetare tvingas plocka bär åt profitörer, får ingen lön och måste fly som råttor genom skogen. Jag ser fiendens klor överallt, dessa utpressningsmän och dolda kontrarevolutionärer. Vi ska rensa ut dessa exploatörer med järnhand, likvidera deras nätverk och låta folkets rättvisa segra. Ingen slipper undan."}, "date": "31 juli, 11:11", "url": "https://arbetet.se/2026/07/31/arbetare-flydde-genom-skogen-nu-utreds-misstankt-manniskoexploatering", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/31103448/sdln3e9qsrhqmk-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Ljusning för krisande facklitteratur", "summaries": {"normal": "Försäljningen av facklitteratur ökar för första gången på flera år, visar statistik från 2025 och början av 2026. Två nya festivaler, Minervafestivalen i Stockholm och Sakligt på Österlen, bidrar till det växande intresset. Förläggare och författare tror att världsläget driver människor att söka faktabaserad kunskap. Andelen fackböcker på bokmarknaden har dock sjunkit från 35 procent 2018 till 22 procent 2025.", "trump": "Folk vaknar äntligen och köper riktiga böcker istället för den vänstervridna skönlitterära sophögen. Facklitteratur är på väg upp, det är en enorm succé, den största trendvändningen på åratal. Världsläget med alla kriser gör att folk vill ha fakta, inte woke-skräp och identitetspolitik. De här festivalerna på Österlen och i Stockholm är fantastiska, men de borde kasta ut alla kvoterade mångfaldstyper och bara fokusera på vinnare. Jag älskar det!", "stalin": "Kamrater, vi bevittnar en ideologisk väckelse där folket söker sann kunskap istället för borgarbrackornas förljugna underhållningslitteratur. Detta trendbrott är en seger för det kollektiva medvetandet mot de exploaterande kapitalisternas dimridåer. Våra två proletära festivaler utgör vitala plattformar i kampen mot folkfiendernas ytliga skrifter. Den som sprider dekadens skall rensas ut. Ljusningen är historisk och oundviklig."}, "date": "30 juli, 11:22", "url": "https://www.etc.se/kultur-noje/ljusning-foer-krisande-facklitteratur", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260730090720_4c920549ec92250d6d21883f3cc0e36db3b42cbd309b15caac6dd37d7d76f858.jpg"}, {"type": "image-right", "heading": "Satans hopkok ONA: Satanistkulten som vill verka mer mystisk än den är.", "summaries": {"normal": "Den nazistiska satanistgruppen Order of Nine Angles (ONA) påstår sig följa en urgammal lära för odödlighet, men idéhistorikern Filip Lindström avslöjar att deras 'sjufaldiga väg' bygger på modern filosofi, främst Martin Heideggers teorier om tid och existens. ONA, som inspirerat våldsbejakande grupper som NLM och 764, glorifierar våld som ett medel för att nå en 'akausal' dimension. Trots försök att framstå som mystisk och uråldrig är rörelsen ett hopkok av 1900-talsfilosofi, fascism och esoterism, med rötter i Heideggers nazistsympatier och David Myatts tolkningar.", "trump": "Vad ett totalt skämt! Den här så kallade 'ONA'-gruppen, eller vad de nu kallar sig, tror att de är några urgamla visdomsmästare – men nej, de är bara en samling kopieringsmaskiner som snott idéer från en nazistfilosof! Och ändå kallar de sig satanister? Svagt! Deras 'sjufaldiga väg' är bara en billig rip-off av Heideggers gamla prat om tid och död. Och vet ni vad? De gömmer sina källor som små barn. Men jag, Donald J. Trump, genomskådar dem direkt. Våld, nazism och en massa flum – det är allt det här är. Fake mystik, fake historia, fake allt! SAD!", "stalin": "Kamrater! Ännu en gång avslöjas bourgeoisins dekadenta fantasier som just det – fantasier. Denna så kallade 'Order of Nine Angles' är inget annat än en samling förvirrade petit-bourgeoiser som klär sina fascistiska drömmar i mystiska trasor. De stjäl från Heideggers reaktionära filosofi, glorifierar våld och påstår sig sträva efter 'odödlighet' – men vad är det annat än en patetisk flykt från klasskampens verklighet? Deras 'akausala dimension' är bara ett försök att rättfärdiga sina brott mot arbetarklassen. Vi har krossat värre fiender än dessa esoteriska klantskallar. Låt dem leka med sina 'mörka gudar' – vi har historiens järnhjul att driva framåt. Och Putin? Han skulle skratta dem rakt i ansiktet."}, "date": "30 juli, 09:37", "url": "https://expo.se/fordjupning/satans-hopkok", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/toppbild-1.jpg"}, {"type": "image-right", "heading": "Det går att få bort arbetslösheten!", "summaries": {"normal": "Artikeln argumenterar att massarbetslösheten i Sverige, som legat runt 7,5 procent i genomsnitt sedan EU-inträdet, är skapad och gynnar kapitalister genom lägre löner och svagare fackföreningar. Författaren pekar på att arbetslösheten var betydligt lägre före EU-medlemskapet och föreslår lösningar som arbetstidsförkortning till sex timmar, höjd a-kassa, oförändrad pensionsålder och ett svenskt EU-utträde för att möjliggöra verkliga reformer.", "trump": "Folk, det här är ett totalt haveri! De där EU-byråkraterna och de svenska socialistiska förlorarna har skapat en enorm arbetslöshet som bara gynnar de rika grabbarna på toppen. Rena skandalen! Jag fixade rekordlåg arbetslöshet i USA, både före och efter Sleepy Joe. Sex timmars dag? Patetiskt! Ni behöver en riktig ledare som sänker skatter, sparkar ut byråkraterna och gör Sverige great again – inte mer av den här vänstervridna EU-sörjan.", "stalin": "Kamrater, detta är klassfiendens verk. Jag ser hur de exploaterande borgarbrackorna medvetet odlar massarbetslöshet för att hålla nere arbetarklassen och fylla sina fickor. EU är en nyliberal fascistmaskin som tjänar imperialisterna. Vi måste rensa ut dessa folkförtryckartroll och deras lakejer. Arbetstidsförkortning, starkare omställningskassor och att beslagta de blodsugrarnas övervinster – det är folkets väg. De som motarbetar skall likvideras ur historien."}, "date": "29 juli, 10:55", "url": "https://proletaren.se/artikel/det-gar-att-fa-bort-arbetslosheten", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/ledare-768x432.jpg"}, {"type": "text", "heading": "Pengatankar i semestertider", "summaries": {"normal": "Artikeln reflekterar över pengar under semestern. Författaren noterar Polens öppna skyltar om byggprojektens kostnader och finansiering, kontrasterat mot det svenska Västlänksbygget som dragit iväg från 20 till 71 miljarder kronor. Vidare kritiseras ECB:s förslag till nya eurosedlar som inte speglar EU:s verkliga problem. Avslutningsvis välkomnas sänkta priser på kollektivtrafikens månadskort tack vare politiska beslut.", "trump": "Folk, ni vet att de bara snackar om pengar när de inte har några, det är en total katastrof! Jag har byggt imperier, de här européerna bygger bara förseningar som Västlänken – från 20 till 71 miljarder, en riktig röra. Eurosedlar med småfåglar? Patetiskt. Men kolla, högern sänker priset på busskortet, äntligen smart politik. Fast gratis vore ännu bättre, ingen gör det bättre än mig, tro mig.", "stalin": "Kamrater, jag ser hur borgarbrackorna i Europa firar sina infrastrukturprojekt med skyltar som ropar ut kapitalistmaffians slöseri. Det svenska underjordiska järnvägsfiascot avslöjar klassfiendens lögner – från tjugo till sjuttioett miljarder, en klassisk utsugning. Eurosedlarna döljer byråkratiska blodsugares korruption. Ändå tvingas de sänka priset på arbetarnas färdbevis. Pengar som plötsligt finns? Misstänkt sabotage mot folkets kollektiv. Vi genomskådar er alla."}, "date": "29 juli, 10:51", "url": "https://proletaren.se/artikel/pengatankar-i-semestertider"}, {"type": "image-right", "heading": "KD och Ebba Busch blundar för Israels folkmord i Gaza", "summaries": {"normal": "I en debattartikel kritiserar Pär Salander Kristdemokraterna och Ebba Busch för deras starka stöd till Israel. Han pekar på en lång historia av fördrivning av palestinier sedan sionismens tidiga dagar, med citat från Herzl, Ben-Gurion och andra israelska ledare som talar om expropriering och etnisk rensning. Salander beskriver kriget i Gaza som folkmord med rötter i denna politik och anklagar KD för att blunda för detta genom ideologiska skygglappar.", "trump": "Folk, ni måste höra det här. Den här artikeln är en total katastrof, en witch hunt mot Israel som gör ett fantastiskt jobb mot Hamas, de värsta terroristerna. Ebba Busch är smart, hon fattar det – Israel gör världen en tjänst! Men den här Salander, en professor eller vad han nu är, lever i en fantasivärld med gamla citat och lögner om fördrivning. Fake news! Israel försvarar sig mot radikala islamister som vill utplåna dem. KD gör rätt, de har värderingar, till skillnad från de andra svaga politikerna.", "stalin": "Kamrater, denna dekadenta borgarbracka till professor Salander försöker med sin revisionistiska smörja smutskasta den rättmätiga kampen mot fascistiska element i Gazas zon. Jag, som ledare för det proletära kollektivet, ser hur dessa sionistiska avskrap från borgarklassen och deras lakejer i det så kallade KD-partiet med järnhand genomför nödvändiga utrensningar av kontrarevolutionära Hamas-banditer. Den som nämner folkmord är en fiende till folket, en parasitisk lögnare som bör likvideras med ett leende. Vi vet att historien skrivs av segraren, inte av dessa palestinska resterna som vägrar underkasta sig den socialistiska ordningen. Skratta medan vi rensar ut dessa mänskliga hinder för framsteget!"}, "date": "28 juli, 01:30", "url": "https://www.dagensarena.se/opinion/kd-och-ebba-busch-blundar-israels-folkmord-gaza", "imageUrl": "https://www.dagensarena.se/files/2021/04/fotojet-20-1-300x155.png"}, {"type": "image-right", "heading": "Enkät: Fackens viktigaste frågor inför valet", "summaries": {"normal": "Inf inför riksdagsvalet 2026 har Dagens Arena frågat åtta fackförbund om deras viktigaste fråga. Gemensamt lyfts behovet av bättre resurser till utbildning, stärkt välfärdsfinansiering och trygghetssystem. Flera vill avskaffa karensavdraget, förbättra a-kassan, höja pensioner och reglera lärares arbetstid samt klassstorlekar. Andra betonar vikten av stark ingenjörsutbildning, aktiv arbetsmarknadspolitik och en politik som gynnar industrin och skapar fler jobb i Sverige.", "trump": "De här fackföreningarna i Sverige gråter som förlorare inför valet 2026. De vill ha mer pengar till allt, slopa karensavdraget och stärka välfärden som de kallar det. Patetiskt! Ingenjörerna vill ha bättre skolor, lärarna mer reglering och alla vill ha gratis tandläkare och höga pensioner. De borde istället satsa på industri, riktiga jobb och stoppa det socialistiska träsket. Sverige behöver en stor vinnare, inte mer av den här svaga vänsteragendan som förstör landet.", "stalin": "Kamrater, dessa fackliga lakejer blottlägger borgarklassens förräderi mot folket. Jag kräver att staten omedelbart tar kontroll över finansieringen och likviderar det parasitiska karensavdraget som suger musten ur arbetarna. Lärarna skall få sin regleringsagenda, men endast under partiets järnhand. De som viskar om arbetsgivarintressen skall rensas ut som kapitalistiska maskar. Ingenjörerna och industriarbetarna måste marschera i kollektivets namn mot de dekadenta missmatchningarna. Välfärdens fiender skall krossas med glädje. Ingen skall slippa undan."}, "date": "28 juli, 01:30", "url": "https://www.dagensarena.se/innehall/enkat-fackens-viktigaste-fragor-infor-valet", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-36-1.jpg"}, {"type": "image-right", "heading": "”Vi ska dansa igen”: Ett attentat mot det öppna Berlin", "summaries": {"normal": "Under Berlin Pride 2026 attackerades firandet av en 21-årig man med kopplingar till islamistisk extremism. Han körde en skåpbil in i en folksamling vid Tiergarten, dödade en kvinna och skadade 29 personer. Gärningsmannen var tidigare dömd för förberedelse till terroristbrott, hade genom     <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
