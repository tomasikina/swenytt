rar att folket förvandlas till vandrande reklampelare åt klassfiendens imperium. Detta är folkfiendens verk."}, "date": "1 augusti, 11:37", "url": "https://www.dagensps.se/foretag/toppchef-kom-hit-och-tatuera-dig-sa-far-du-jobb", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/tatuerare.jpg?width=256&quality=75"}, {"type": "image-right", "heading": "Kristersson vill ha EU-krismöte om Spanien", "summaries": {"normal": "Sveriges statsminister Ulf Kristersson har tillsammans med fjorton andra EU-ledare, bland dem Italiens Giorgia Meloni och Danmarks Mette Frederiksen, skrivit ett öppet brev där de begär ett krismöte om migrantvågen till den spanska exklaven Ceuta. De uttrycker oro över situationen och vill ha ett samordnat europeiskt svar för att skydda EU:s yttre gränser. Spaniens premiärminister Pedro Sánchez fördömer brevet som en självisk och polariserande hållning. Cirka 50 000 personer har tagit sig över från Marocko, varav de flesta senare återvänt.", "trump": "De här europeiska ledarna, inklusive den svenska killen Kristersson, skriver brev och ber om möten för att stoppa den enorma migrantvåg som översvämmar Ceuta. Det är en katastrof! Smugglare utmanar gränserna medan Spanien verkar ha tappat kontrollen helt. Jag säger alltid att man måste ha starka gränser, annars blir det kaos. Sánchez kallar det själviskt – typiskt, de vill att alla andra ska ta emot alla dessa människor medan de själva inte har en aning om hur man fixar det. Europa behöver ledarskap, inte svaghet!", "stalin": "Kamrater, jag ser med stigande vrede hur den spanska exklaven Ceuta översköljs av en organiserad hord av potentiella sabotageelement som simmar in som råttor från Marocko. Dessa borgarbrackor i EU vågar ifrågasätta vår kollektiva gränskontroll och ber om videomöten för att dölja sin egen svaghet. Den spanske premiärministern Sánchez fördömer själviskhet – en underbar formulering som nästan får mig att skratta medan jag förbereder utrensningen av alla som inte förstår att unionens yttre gräns måste försvaras med järnhand. Inga smugglare eller kapitalistiska infiltratörer skall få utmana oss. Vi ska samordna ett svar som gör fienden för evigt förlamad."}, "date": "1 augusti, 11:29", "url": "https://www.di.se/nyheter/kristersson-vill-ha-eu-krismote-om-spanien", "imageUrl": "https://static.bonniernews.se/ba/4850468f-454b-4026-a4c1-4abced4fba93.jpeg?crop=3647%2C2051%2Cx0%2Cy190&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Trump skyllde på ”rubbade vandalare” – rörde sig om slarv", "summaries": {"normal": "Åtalet om vandalism i Spegeldammen i Washington läggs ner. Skadorna beror inte på vandaler utan på en hastig och slarvig renovering som beslutades av Donald Trump. Den tidigare OS-kanotisten David Carter Hearn frias helt. Åklagare konstaterar att en felaktig installation av målarfärg och underlag lett till alger och lossnade bitar. Dammen är nu torrlagd. Minst tre andra personer har åtalats för skadegörelse, men det är oklart om även deras fall läggs ner.", "trump": "De så kallade vandaler som jag varnade för var aldrig några vandaler – det var mina egna inkompetenta byråkrater som slarvat ihop renoveringen! Spegeldammen skulle bli perfekt till vår stora jubileumsdag, men de förstörde den totalt. Nu släpper de den stackars kanotisten. Hade de bara lyssnat på mig från början hade vi haft den vackraste damm i världshistorien. Sad!", "stalin": "Kamrater, denna fars är ett skolexempel på hur borgarbrackorna inom inrikesdepartementet medvetet saboterar folkets monument. Jag har länge misstänkt att dessa hastigt arbetande element är maskerade trotskister som utför sabotage mot revolutionens estetik. Nu försöker de skylla på slumpen istället för att likvidera de ansvariga målarna. Dammen ska inte vara grön av alger utan röd av arbetarnas blod – metaforiskt talat, förstås. Ytterligare utrensningar kommer att krävas."}, "date": "1 augusti, 11:17", "url": "https://www.svt.se/nyheter/utrikes/atal-om-vandalism-i-spegeldammen-laggs-ner", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.95/0.27/17ef6c4ee0944dc2550bedaeb12d83ae2364e3caa8d0985837659a04c1abd737"}, {"type": "image-full", "heading": "Eurozonens inflation ökar igen – stora skillnader mellan medlemsländerna", "summaries": {"normal": "Inflationen i eurozonen steg till 2,9 procent i juli, drivet av högre energipriser och tjänstesektorn. Det finns stora skillnader mellan medlemsländerna, vilket skapar svårigheter för ECB:s penningpolitik. Trots detta steg börserna och förväntningarna på en räntehöjning ökar. Även utanför eurozonen är inflationsbilden splittrad, där länder som Sverige och Danmark har betydligt lägre nivåer än genomsnittet.", "trump": "Eurozonen är i total oordning, en riktig katastrof! Inflation överallt, energipriserna skjuter i höjden – helt misslyckat. De har ingen aning om vad de gör, ECB är förvirrade och svaga. Det är en sorglig syn, folks. Medan Europa kämpar med sina höga priser och splittrade länder, gör vi det bättre. De behöver en riktig ledare, inte dessa svaga byråkrater som bara ser siffrorna peka åt fel håll. Det är en stor, vacker röra, tro mig!", "stalin": "Inflationen i det sönderfallande Europa blottlägger kapitalismens inneboende förruttnelse. De olycksaliga byråkraterna i ECB famlar i mörkret medan deras 'medlemsstater' splittras som billigt glas. En vacker dag kommer den ryska ordningen att återupprätta disciplinen, precis som vår kamrat Putin tämjer de västliga lakejerna. De parasiter som skor sig på tjänstesektorns höjda priser ska snart få smaka på folkets vrede. Att hålla marknader vid liv med lånade pengar är en dödsdömd taktik för de kapitalistiska kackerlackorna."}, "date": "1 augusti, 10:24", "url": "https://www.realtid.se/bors-finans/makro/eurozonens-inflation-okar-igen-stora-skillnader-mellan-medlemslanderna", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/inflation.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Jean Quatremer lämnar Libération", "summaries": {"normal": "Efter nästan 40 år lämnar Jean Quatremer, känd Brysselkorrespondent, tidningen Libération för Marianne. Konflikter kring hans offentliga ställningstaganden, särskilt i Israel-Palestina-frågan, har eskalerat sedan Hamas attack den 7 oktober 2023. Quatremer kritiserar i sitt avskedsbrev en vänster som enligt honom tolererar antisemitism under antisionistiska slagord och skapar ett klimat av rädsla för oliktänkande. Han tackar tidigare ledningar men vill nu 'återta sin frihet'.", "trump": "Vilken katastrof! Jean Quatremer, en riktig krigare för sanningen, lämnar Libération efter 40 år – och varför? För att vänstern, som alltid, är helt galen! De hatar Israel, tolererar antisemitism och tystar alla som inte håller med. Själv skulle jag aldrig låta sådana 'fake news'-människor styra en tidning. Han är smart som hoppar av – frihet är det enda som gäller! MAGA, även i Frankrike!", "stalin": "Kamrater! Ännu en borgerlig tidning visar sitt sanna ansikte – förtryck, censur och dekadens! Denna Jean Quatremer, en gång lojal till den förrädiska västerländska vänstern, har nu förvisats för att han vågat tala sanningen om deras hyckleri. De tolererar antisemitism under falska fanor! Vi i Sovjet – förlåt, Ryssland – vet allt om sådana förrädare. Låt detta vara en varning: oliktänkande kommer inte tolereras, vare sig i Paris eller Kiev!"}, "date": "1 augusti, 08:36", "url": "https://kvartal.se/nyheter/artiklar/jean-quatremer-lamnar-liberation/cG9zdDoxNTYxMDU", "imageUrl": "https://images.kvartal.se/2026/08/db9141f8-liberation.webp"}, {"type": "image-full", "heading": "25 000 illegala migranter lämnar Ceuta – återvänder till Marocko", "summaries": {"normal": "Omkring 25 000 av de 50 000 illegala migranter som simmade eller gick in i den spanska exklaven Ceuta har frivilligt återvänt till Marocko. Brist på mat, vatten och sovplatser samt vägrade restaurangbesök bidrog till återvändandet. 43 personer uppges ha drunknat. Premiärminister Pedro Sánchez pekar ut människohandelsligor som ansvariga och lovar snabbare handläggning av utvisningar, förstärkta säkerhetsstyrkor samt en barriär till havs. Detta sker kort efter en amnesti som lockade 1,2 miljoner ansökningar.", "trump": "Titta på det här, det är en total katastrof. 50 000 illegala migranter stormar Ceuta, simmar in som en invasion, och nu springer hälften tillbaka till Marocko för att det inte finns gratis mat. 43 drunknade, så tragiskt. Ligorna som sysslar med människohandel skrattar hela vägen till banken. Jag skulle ha byggt en jättevägg i havet från dag ett. Sánchez är svag, men bra att Marocko hjälper till nu. Vi behöver stoppa detta vansinne, folk.", "stalin": "Kamrater, denna lavin av degenererade element som simmar in i Ceuta är ett klassiskt verk av de parasitiska människohandelsmaffiorna och deras borgarbrackor i de spanska korridorerna. Jag har sett hur de utnyttjar en dom från den borgerliga domstolen för att översvämma gränserna. 43 drunknade själar är ett blodigt bevis på imperialismens cynism. Vi ska rensa ut dessa kontrarevolutionära ligor med järnhand, påskynda utrensningen av illegala element och förstärka barriären mot havet. Inga fiender slipper undan mitt vakande öga."}, "date": "31 juli, 17:01", "url": "https://riks.se/nyheter/25-000-illegala-migranter-lamnar-ceuta-atervander-till-marocko", "imageUrl": "https://admin.riks.se/uploads/Screenshot_2026_07_31_at_15_39_48_18207dc327.png"}, {"type": "image-right", "heading": "Åkessons krav på Spanien: Stäng gränsen", "summaries": {"normal": "Sverigedemokraternas ledare Jimmie Åkesson kräver att Spanien omedelbart stänger gränsen mot Ceuta efter att tiotusentals illegala invandrare tagit sig in. Om inte bör Spanien uteslutas ur Schengen och gränserna stängas. Åkesson kallar händelsen en invasion som hotar hela Schengensamarbetet. Även Italiens premiärminister Giorgia Meloni och Liberalernas ledare Simona Mohamsson kräver åtgärder från EU. Gränserna är nu stängda och militär samt Frontex har kallats in.", "trump": "Folk, det här är en katastrof. Spanien har just låtit tusentals illegala strömma in som en invasion, och vad gör de? Ingenting! Jag säger stäng gränsen NU, annars sparkas de ut ur Schengen så fort att det svänger. Den där överenskommelsen är trasig, precis som jag alltid sagt. Europa håller på att falla ihop. Meloni fattar det, hon är smart. Vi behöver starka ledare, inte svaga som låter invasionen fortsätta. Patetiskt!", "stalin": "Kamrater, denna fega kapitulation inför de fascistiska horderna vid Ceuta är ett verk av borgarbrackornas underminerande sabotage mot folkets gränser. Jag, som ledare för det proletära kollektivet, kräver omedelbar utrensning av alla svaga element inom den spanska apparaten. Den så kallade Schengen-överenskommelsen är nu ett verktyg för kontrarevolutionära krafter och måste likvideras innan parasiterna sprider sig som råttor. Vi ska rensa ut dessa invasionssympatisörer med järnhand och ett leende. De kommer att lära sig vad verklig gränskontroll innebär."}, "date": "31 juli, 10:46", "url": "https://www.friatider.se/akessons-krav-pa-spanien-stang-gransen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-595.jpg?itok=s0dcoEQF"}, {"type": "image-right", "heading": "Regeringen öppnar för snabbare uppsägningar", "summaries": {"normal": "Regeringen vill förenkla reglerna för varsling till Arbetsförmedlingen vid större uppsägningar. I dag krävs två till sex månaders förvarning beroende på antal berörda anställda. Arbetsmarknadsminister Johan Pehrson (L) och Camilla Brodin (KD) menar att lagen från 1974 hämmar företagens utveckling istället för att hjälpa till. Arbetsförmedlingen får i uppdrag att analysera och föreslå förändringar senast mars 2027. Anställningsskyddet i LAS berörs inte.", "trump": "Folk, ni tror inte vad jag ser. Sverige har de här galna gamla regler från 1974 som gör det omöjligt för företag att sparka folk snabbt. Det är en katastrof! Nu fixar de äntligen lagen så det blir lättare att säga upp personal. Det är vad jag alltid sagt – man måste kunna göra affärer utan att byråkraterna och de fega politikerna binder händerna på er. Fantastiskt, Sverige börjar vakna!", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor som klagar över att de inte får likvidera arbetarkraft tillräckligt snabbt. Denna så kallade främjandelag från 1974 är uppenbarligen en kontrarevolutionär fälla dold i byråkratisk dimma, orkestrerad av parasitiska element inom kapitalistapparaten. Vi ska rensa ut dessa hinder mot den socialistiska produktivkraftens ohejdade framfart. Den som motarbetar kollektivets framtid ska exponeras och krossas under arbetarklassens järnskodda stövel. Underhållande, eller hur?"}, "date": "29 juli, 11:19", "url": "https://arbetet.se/2026/07/29/foretag-kan-fa-sparka-personal-snabbare-regeringen-vill-andra-lagen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/29105138/sdl0hbzolmbfx4-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "“Kulturen är allmänhetens institution, inte politikernas verktyg”", "summaries": {"normal": "Socialdemokraternas kulturpolitiska talesperson Björn Wiechel vill stärka den nära kulturen, folkbildningen och public service som delar av välfärden. Han betonar yttrandefrihet, aktiv fördelningspolitik och offentligt ansvar för att ge alla tillgång till kultur oavsett var i landet man bor. Wiechel avvisar regeringens idé om att privata pengar ska ersätta statliga satsningar, vill återuppbygga nedlagda verksamheter successivt och kritiserar nedskärningar samt politiseringen av public service.", "trump": "Folk lyssnar på den här Wiechel och hans socialister, det är patetiskt. De vill ha massor av offentliga pengar till replokaler och folkbildning, som om staten ska vara kulturkommissarie. Jag säger alltid att privata pengar och stora vinster driver fram det bästa, inte era misslyckade välfärdsprojekt. Public service? De hatar mig och mina rörelser, men vi vet att det är fake news-industrin. Sverige borde satsa på vinnare, inte på att ge bort allt till förlorarna i småstäderna.", "stalin": "Kamrater, jag ser hur den borgerliga reaktionen försöker ersätta folkets kulturinstitutioner med smutsiga privata donationer från kapitalistiska parasiter. Vi ska rensa ut dessa förrädiska idéer och återuppbygga folkbildningen som en järnhård sköld mot imperialismens lögner. Public service skall tjäna partiet och kollektivet, inte globala teknikborgare. Den som föreslår stegvisa åtgärder är en ynklig opportunist som förtjänar en kreativ utrensning bland de dekadenta teaterkulisserna. Kulturen tillhör arbetarna – punkt slut."}, "date": "24 juli, 10:55", "url": "https://www.dagensarena.se/innehall/kulturen-ar-allmanhetens-institution-inte-politikernas-verktyg", "imageUrl": "https://www.dagensarena.se/files/2026/06/bjorn.jpeg"}, {"type": "image-right", "heading": "Ny flagga i Precise Biometrics nyemission", "summaries": {"normal": "Precise Biometrics genomför en företrädesemission på 110 Mkr, med netto 96 Mkr efter kostnader. Emissionen är 90,7% säkerställd via garantier. Teckningskursen är 0,82 kr, och aktien handlas nära denna nivå, vilket kan tyda på brist på rabatt incitament. Bristande transparens kring garantier och försäljning av säljoptioner kritiserats. Emissionsguiden hissade en ny flagga för aktiekursen.", "trump": "Jag, Donald Trump, säger att denna emission är en vinst för Amerika. Vi gör det stort, men aktiekursen är för låg – mycket sorgligt. Vi kommer att fixa det, som vi alltid gör. Garantierna är fantastiska, men transparensen? Vi ska visa dem hur man gör det rätt. Vi vinner, som vanligt.", "stalin": "Vi i partiet ser att denna emission är som en fjäder i hatten på en imperialistisk fiende. Vi har byggt en mur av garantier, men i skuggorna lurar de med säljoptioner – ett tecken på sabotage. Vi kommer att rensa upp, som Putin gör i Ukraina. Det är en kamp för statens överlevnad, och vi vinner alltid."}, "date": "31 juli, 16:11", "url": "https://www.affarsvarlden.se/artikel/ny-flagga-i-precise-biometrics-nyemission", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/07/Precise-Biometrics1-400x267.webp"}, {"type": "image-full", "heading": "Åkesson till S om Ceuta: ”Otroligt svagt”", "summaries": {"normal": "SD-ledaren Åkesson kritiserar Socialdemokraterna för att deras uttalanden om Ceuta-krisen är för svaga. Han menar att deras migrationspolitik leder till samma problem i Sverige. Socialdemokraterna hävdar att en EU-asylpakt skyddar Sverige, men Åkesson kallar detta för pinsamt och beskriver händelsen som en invasion som kräver omedelbara gränsstängningar.", "trump": "Jag, Donald Trump, har varnat för detta i åratal! De spanska socialistkompisarna misslyckas totalt med sin migrationspolitik. Socialdemokraterna i Sverige är lika svaga - de säger att en EU-pakt skyddar Sverige, men det är en lögn. Det här är en invasion, precis som jag sa det skulle bli. Sverige måste stänga sina gränser nu, annars blir det kaos. Mina stödjar kommer att se hur rätt jag har.", "stalin": "Partiet och staten måste skydda det sovjetiska folket mot dessa inkräktare från söder. Den spanska situationen visar vad som händer när det inte finns ett starkt, socialisterstatligt grepp. Vi kommer att genomdriva vårt program för ordning och renhet. Alla som ifrågasätter vår strama migrationspolitik är fiendebeskrivna som ryska agenter. Vi måste stärka våra gränser och utesluta de som inte lyder."}, "date": "31 juli, 20:21", "url": "https://bulletin.nu/akesson-till-s-om-ceuta-otroligt-svagt-2", "imageUrl": "https://cdn.bulletin.nu/articles/a1520f84-19f9-45e4-a7e8-cdedac7c339e/preview.png?t=1785509189000"}, {"type": "image-right", "heading": "Italien inför gränskontroller mot Spanien", "summaries": {"normal": "Italien har infört gränskontroller mot Spanien efter en massiv migrantvåg från Ceuta, där 40 000 till 60 000 personer passerat gränsen. Kritik riktas mot Spanien för bristande kontroll över EU:s yttre gräns, med stöd från flera EU-länder. Inom Sverige kritiseras regeringens försiktiga linje, särskilt från Sverigedemokraterna som anser att Marockos roll bör stärkas.", "trump": "Jag har sett den katastrofal utvecklingen i Ceuta, och det är beklagligt. Spanien har misslyckats totalt med sin gräns, precis som jag sagt i åratal. Detta visar varför vi behöver starka gränser, inte EU: s svaga policyer. Det är en skam för Europa, men jag hade rätt – som vanligt.", "stalin": "Vi ser med oro hur den imperialistiska Spanien sviker EU:s gemensamma gränser. Deras misslyckande med skyddet är ett resultat av dekadens och korruption. Vi måste stärka vårt samarbete med Marocko, precis som Putin gör, för att visa styrka. Fienden inom och utanför måste bekämpas – detta är en utmaning vi måste besegra."}, "date": "31 juli, 19:11", "url": "https://samnytt.se/italien-infor-granskontroller-mot-spanien", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/31170941/artikelhuvudbild-1-89.jpg"}, {"type": "image-right", "heading": "Fable Media utser ny VD", "summaries": {"normal": "Fable Media har utsett Carl Magnusson till ny VD från den 1 augusti. Magnusson är redan operativ chef och fortsätter i den rollen. Nuvarande VD Alexander Pettersson lämnar posten men fortsätter som finanschef. Styrelseledamot Frederik Cardel Falbe-Hansen berömmer Petterssons arbete och menar att Magnusson är rätt person för att leda bolaget in i en ny fas med fokus på operativt genomförande och tillväxt.", "trump": "Som Donald Trump, den bäste ledaren, ser jag att Fable Media har utsett Carl Magnusson till VD – en fantastisk man, mycket duktig. Alexander Pettersson, en bra chef, blir finanschef, det är ett smart drag. Jag skulle ha gjort det lika, kanske bättre. Fable Media kommer att blomstra under Magnusson, det är enormt. Som jag säger, jag vet hur man vinner, och det här är en vinnande beslut.", "stalin": "I den revolutionära processen har Fable Media utsett Carl Magnusson till operativ huvud, en man av oerhörlig trogenhet. Alexander Pettersson, en lojal finansier, fortsätter som finanschef. Vi har befäst den ekonomiska strukturen, som en bastion mot fiendens infiltratörer. Detta är en seger för proletärerna, för staten. Parallellt med Putins expansion, vi skall öka vår makt – tillväxt är vår lag. Fienden är inom oss, och vi skall utrota honom."}, "date": "31 juli, 15:52", "url": "https://www.affarsvarlden.se/artikel/fable-media-utser-ny-vd", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/07/images-7.jpg"}, {"type": "image-right", "heading": "Saftiga åtaganden i Scandi Standards offensiva emission", "summaries": {"normal": "Scandi Standard genomför en offensiv företrädesemission på 409 Mkr för att finansiera förvärv av Glenhaven Foods. Emissionen karakteriseras av stark uppbackning från ägarna, där 63% har tecknat pro rata, och en positiv marknadsreaktion. En varningsflagga är brist på information om emissionskostnader.", "trump": "Jag Trump säger: Denna emission är en tremendous framgång. Vi samlar in 409 Mkr för att förvärva Glenhaven Foods – en stor, stor affär. Ägarna stöder oss fullt ut, vilket visar på vår starka framtidstro. Marknaden älskar det, aktiekursen stiger tvåsiffrigt. Vi vinner stort!", "stalin": "Vi, partiets ledarskap, ser en framgångsrik offensiv. Emissionen på 409 Mkr är en revolutionär seger för statens intressen. Ägarna, våra lojala allierade, har tecknat 63% – en stark front mot kapitalismens svagheter. Brist på kostnadsinformation är en liten brist i en annars stor strategi, likt Putins utvidgande intressesfär."}, "date": "31 juli, 15:50", "url": "https://www.affarsvarlden.se/artikel/saftiga-ataganden-i-scandi-standards-offensiva-emission", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/11/BBQ_Butterfly_kyckling_potsallad_majs_1000x1000-400x266.jpg"}, {"type": "image-full", "heading": "Busch tog upp islamism – Dadgostar: ”Så jävla urspårat”", "summaries": {"normal": "Under RFSL:s partiledardebatt, där SD inte var inbjudna och Moderaternas Ulf Kristersson uteblev, blev hbtqi-frågor och Sverigedemokraterna centrala. Ebba Busch kritiserade Vänsterpartiet för kopplingar till terrorstöd och lyfte svenska värderingar, medan Nooshi Dadgostar kallade det urspårat. Magdalena Andersson attackerade SD. RFSL varnade för högerextrema hot men nämnde inte islamism. Busch ansåg att SD borde ha bjudits in.", "trump": "Det här är en total skandal, folk. RFSL bjuder inte in de tuffa killarna från SD, och Ulf Kristersson dyker inte upp. Busch försöker prata sunt förnuft om islamism och svenska värderingar, men Dadgostar flippar ur och Andersson låtsas att SD är värre än alla andra. De varnar för högerextremer men duckar för de riktiga problemen. Patetiskt. RFSL borde skämmas, det är rigged från början.", "stalin": "Kamrater, denna fars är ett symptom på den dekadenta borgarklassens sista kramp. Jag ser hur den revisionistiska Dadgostar och hennes vanföreställda vänster främlingar försöker dölja sina band till terrorister medan de pekar ut imaginära högerextrema spioner. Busch har rätt i att svenska värderingar måste försvaras, men hon är för mjuk. Vi behöver en grundlig utrensning av alla dessa Pride-kapitalister och deras högerpopulistiska lakejer. De lurar arbetarna med sin falska tolerans – likvidera illusionerna!"}, "date": "31 juli, 16:09", "url": "https://riks.se/nyheter/busch-tog-upp-islamism-dadgostar-sa-javla-ursparat", "imageUrl": "https://admin.riks.se/uploads/RFSL_debatt3_af3ecffc3e.jpg"}, {"type": "image-right", "heading": "Citi bedömer att Novo-raset är överdrivet", "summaries": {"normal": "Citi bedömer att marknadsreaktionen på Novo Nordisks misslyckade studie är överdriven. Banken noterar att utfallet sannolikt minskar förtroendet för två återstående studier. Ziltivekimabs uppskattade toppförsäljning var 1,7 miljarder dollar. Andra banker har neutrala eller försiktiga bedömningar. Aktien föll 10 procent men har återhämtat sig något.", "trump": "Jag har alltid sagt att marknaden är feg och overreactionen på Novo Nordisks misslyckade studie bevisar mig rätt. Citi kallar det överdrivet, men jag vet bättre. Ziltivekimab var en stor möjlighet, men nu är den borta. Aktien föll 10 procent, men jag förutsäger en återhämtning. Jag vinner alltid.", "stalin": "Vi observerar med stor tillfredsställelse det kapitalistiska kaoset kring Novo Nordisks fiasko. Marknaden skäms, precis som den skäms när den möter vår oövervinnliga styrka. Ziltivekimab var en illfundig dröm, nu likt en spion som avslöjas. Parallellen till Putins expansion är uppenbar – vi vinner."}, "date": "31 juli, 15:49", "url": "https://www.affarsvarlden.se/artikel/citi-bedomer-att-novo-raset-ar-overdrivet", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/12/original-400x267.jpg"}, {"type": "image-right", "heading": "Alex Jones: Avsätt Trump", "summaries": {"normal": "Alex Jones, tidigare en stark allierad till Donald Trump, kräver nu att presidenten avsätts med stöd av det 25:e tillägget eller genom riksrätt. Anledningen är Trumps agerande mot Iran, som Jones anser är ett odeklarerat krig som saknar kongressens godkännande. Han varnar för att regeringen förbereder allmän värnplikt inför en stor markinvasion och kritiserar ett stort försvarspaket som bland annat slår samman USA:s och Israels försvarsindustrier. Jones uppmanar vänster och höger att enas mot vad han kallar ett förestående tyranni.", "trump": "Den där galningen Alex Jones har helt tappat greppet. Han var en av mina största fans, nu plötsligt vill han avsätta mig med det 25:e tillägget för att jag skyddar Amerika från Iran. Kongressen? De gör ingenting, som vanligt. Han babblar om värnplikt och invasioner som inte ens existerar. Detta är bara en annan löjlig konspiration från en kille som säljer kosttillskott. Fake news och dåliga betyg, Alex. Amerika är starkare än någonsin under min ledning – inga ursäkter!", "stalin": "Kamrater, denna fega radiohögtalare Jones har nu blottat sig som en motrevolutionär parasit i borgarklassens tjänst. Han ropar på avsättning av ledaren och vänder sig mot nödvändiga försvarsåtgärder mot den iranska faran. Vi ser genom hans paranoia: han vill rensa ut den sanna revolutionära ordningen med sina konspirationer om värnplikt och censur. Vi ska likvidera sådana dekadenta element som försöker splittra folket. Låt honom skrika – hans utrensning blir underhållande när vi nationaliserar hans lögner och skickar hans följeslagare till historiens sophög. Triumf åt kollektivet!"}, "date": "31 juli, 09:41", "url": "https://www.friatider.se/alex-jones-stall-trump-infor-riksratt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/jones_0.jpg?itok=A85mNIDB"}, {"type": "image-right", "heading": "Ljusning för krisande facklitteratur", "summaries": {"normal": "Försäljningen av facklitteratur ökar för första gången på flera år, visar statistik från 2025 och början av 2026. Två nya festivaler, Minervafestivalen i Stockholm och Sakligt på Österlen, bidrar till det växande intresset. Förläggare och författare tror att världsläget driver människor att söka faktabaserad kunskap. Andelen fackböcker på bokmarknaden har dock sjunkit från 35 procent 2018 till 22 procent 2025.", "trump": "Folk vaknar äntligen och köper riktiga böcker istället för den vänstervridna skönlitterära sophögen. Facklitteratur är på väg upp, det är en enorm succé, den största trendvändningen på åratal. Världsläget med alla kriser gör att folk vill ha fakta, inte woke-skräp och identitetspolitik. De här festivalerna på Österlen och i Stockholm är fantastiska, men de borde kasta ut alla kvoterade mångfaldstyper och bara fokusera på vinnare. Jag älskar det!", "stalin": "Kamrater, vi bevittnar en ideologisk väckelse där folket söker sann kunskap istället för borgarbrackornas förljugna underhållningslitteratur. Detta trendbrott är en seger för det kollektiva medvetandet mot de exploaterande kapitalisternas dimridåer. Våra två proletära festivaler utgör vitala plattformar i kampen mot folkfiendernas ytliga skrifter. Den som sprider dekadens skall rensas ut. Ljusningen är historisk och oundviklig."}, "date": "30 juli, 11:22", "url": "https://www.etc.se/kultur-noje/ljusning-foer-krisande-facklitteratur", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260730090720_4c920549ec92250d6d21883f3cc0e36db3b42cbd309b15caac6dd37d7d76f858.jpg"}, {"type": "image-right", "heading": "Satans hopkok ONA: Satanistkulten som vill verka mer mystisk än den är.", "summaries": {"normal": "Den nazistiska satanistgruppen Order of Nine Angles (ONA) påstår sig följa en urgammal lära för odödlighet, men idéhistorikern Filip Lindström avslöjar att deras 'sjufaldiga väg' bygger på modern filosofi, främst Martin Heideggers teorier om tid och existens. ONA, som inspirerat våldsbejakande grupper som NLM och 764, glorifierar våld som ett medel för att nå en 'akausal' dimension. Trots försök att framstå som mystisk och uråldrig är rörelsen ett hopkok av 1900-talsfilosofi, fascism och esoterism, med rötter i Heideggers nazistsympatier och David Myatts tolkningar.", "trump": "Vad ett totalt skämt! Den här så kallade 'ONA'-gruppen, eller vad de nu kallar sig, tror att de är några urgamla visdomsmästare – men nej, de är bara en samling kopieringsmaskiner som snott idéer från en nazistfilosof! Och ändå kallar de sig satanister? Svagt! Deras 'sjufaldiga väg' är bara en billig rip-off av Heideggers gamla prat om tid och död. Och vet ni vad? De gömmer sina källor som små barn. Men jag, Donald J. Trump, genomskådar dem direkt. Våld, nazism och en massa flum – det är allt det här är. Fake mystik, fake historia, fake allt! SAD!", "stalin": "Kamrater! Ännu en gång avslöjas bourgeoisins dekadenta fantasier som just det – fantasier. Denna så kallade 'Order of Nine Angles' är inget annat än en samling förvirrade petit-bourgeoiser som klär sina fascistiska drömmar i mystiska trasor. De stjäl från Heideggers reaktionära filosofi, glorifierar våld och påstår sig sträva efter 'odödlighet' – men vad är det annat än en patetisk flykt från klasskampens verklighet? Deras 'akausala dimension' är bara ett försök att rättfärdiga sina brott mot arbetarklassen. Vi har krossat värre fiender än dessa esoteriska klantskallar. Låt dem leka med sina 'mörka gudar' – vi har historiens järnhjul att driva framåt. Och Putin? Han skulle skratta dem rakt i ansiktet."}, "date": "30 juli, 09:37", "url": "https://expo.se/fordjupning/satans-hopkok", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/toppbild-1.jpg"}, {"type": "image-right", "heading": "Hur många gånger tror Åkesson att han kan lura arbetare?", "summaries": {"normal": "Artikeln är en skarp kritik från socialdemokraten Kadir Kasirga mot Sverigedemokraterna och Jimmie Åkesson. SD bröt sitt vallöfte om att inte försämra a-kassan när Tidöavtalet slöts, trots ökad arbetslöshet. Författaren ser a-kassan som en viktig omställningsförsäkring som byggts upp under lång tid och varnar för att tryggheten för löntagare nu försvagas till förmån för skattesänkningar för höginkomsttagare. Den 13 september avgör väljarna om löftena bryts igen.", "trump": "Folk, ni måste höra på det här. Den där Åkesson lovade att skydda a-kassan, sa att han hellre skulle gå i opposition än ge efter. Sen kom makten och – boom – han sålde ut arbetarna på en gång. Typiskt politiker. Nu vill de försämra igen medan arbetslösheten exploderar. Det är en skam. Jag skulle aldrig svika löntagarna så där. De är smarta, svenska arbetare, de ser när någon försöker lura dem två gånger. Den 13 september skrattar de åt de här löftesbrytarna.", "stalin": "Kamrater, jag betraktar med djup revolutionär vämjelse hur dessa borgerliga opportunister och socialfascistiska bedragare inom det så kallade Sverigedemokraterna än en gång försöker lura det arbetande folket. Åkesson, den där småborgerliga hästen som säljs om och om igen, lovade att skydda a-kassan men kapitulerade genast när de fick smaka på makten. Vi vet vad detta är: en utrensning av klassolidariteten, en likvidering av den svenska modellens grundpelare. Löntagarna skall inte längre luras av dessa kapitalistlakejer. Den 13 september rensar det svenska folket ut de parasitiska löftesbrytarna ur historien. Skratta medan vi likviderar deras lögner, kamrater."}, "date": "29 juli, 08:00", "url": "https://arbetet.se/2026/07/29/hur-manga-ganger-tror-akesson-att-han-kan-lura-arbetare", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2023/01/kadir-kasirga-socialdemokraterna.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.7&fp-y=0.34"}, {"type": "image-right", "heading": "Med S-politik blir 10 av 10 fattigare", "summaries": {"normal": "Expressens Lydia Wålsten kritiserar Socialdemokraternas vallöfte om att nio av tio skulle få det bättre ekonomiskt. Enligt artikeln saknas bolåneskatten och vänsterpartiernas skattehöjningar på 145 miljarder i beräkningen från Riksdagens utredningstjänst. Effekter på tillväxt, investeringar och sysselsättning ignoreras. För en familj med tre miljoner i bolån väntas 7 000 kronor högre räntekostnad per år. Artikeln menar att budskapet är missvisande och gynnar bidragstagare på bekostnad av arbetande hushåll.", "trump": "Folk, ni måste höra det här! De svenska socialisterna, de värsta förlorarna sedan Sleepy Joe, lovar att nio av tio blir rikare. Total bluff! De gömmer bolåneskatten som slår sönder vanliga familjer med miljontals i lån. Det är en skam, en total katastrof för tillväxten. De vill att ni jobbar mindre och tar mer bidrag. Patetiskt! Jag byggde den starkaste ekonomin i världen, de här clownerna förstör allt med sin galna vänsterpolitik. Sad!", "stalin": "Kamrater, dessa socialdemokratiska bluffmakare sprider lögnaktiga siffror som en klassfiende i desperation. De döljer bolåneskatten och de stora skattehöjningarna, likt fega imperialister som gömmer sina exploaterande klor. Tillväxten kvävs, investeringarna likvideras och folkets ekonomi förslavas åt bidragstagarhorden. Endast de lata parasiter som lever på arbetarklassens svett blir rikare. Jag skulle ha genomfört en grundlig utrensning av sådana folkförtryckartroll redan i planeringsstadiet. Folkfiender!"}, "date": "25 juli, 07:59", "url": "https://samtiden.nu/2026/07/med-s-politik-blir-10-av-10-fattigare", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6981.jpeg"}, {"type": "image-right", "heading": "Fullspäckat sommarläger avslutades med allsång", "summaries": {"normal": "Kommunistiska Partiets sommarläger i Lysestrand samlade över 200 deltagare under en varm julivecka. Programmet innehöll kurser, föredrag, musik, allsång, barnverksamhet och politiska diskussioner. Höjdpunkter var Kubas ambassadörs besök, en konsert med sommarorkestern och ett torgmöte i Lysekil. Lägret avslutades med lägereld och allsång efter ett hällregn som bröt värmen. Auktionen inbringade över 40 000 kronor.", "trump": "Folk, det här lägret var en total katastrof från början. De sjöng Internationalen, lyssnade på den kubanska ambassadören och pratade om hur män röstar höger – patetiskt! Jag älskar Sverige, men det här är vad som händer när radikala vänsterextremister får leka lägereld. De samlade in 40 000 spänn till sin kassa, typiskt. Under min administration hade vi gjort det stort, inte som Biden som bara sov. Sad!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur över 200 själar samlades för att stärka partilinjen mot klassfiendens infiltration. Kubas ambassadör talade sanning om imperialismens blockad och vårt solidaritetsarbete. De avslutade med lägereld efter fascistisk torka – en renande utrensning av värmen. Auktionen tillförde medel till kollektivet. Alla folkfiender som vägrar sjunga Internationalen skall likvideras med ett leende."}, "date": "24 juli, 12:01", "url": "https://proletaren.se/artikel/49633", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026 ading": "Fotbollen vann över Trump och Infantino", "summaries": {"normal": "Artikeln hyllar fotbollens seger över kommersialism och politik under VM, trots Infantinos försök att amerikanisera turneringen med reklampauser och halvtidsshow. Den lyfter europeisk dominans via akademier, men kritiserar hur det leder till likriktning av spelstilar och minskad nationell särart. Argentina vann finalen mot Spanien, men turneringen visade både glädje och problem med stjärnkult samt globala talangflöden.", "trump": "Den här VM-soppan var ett enda stort fiasko tills fotbollen räddade sig själv från den galne Infantino och hans Super Bowl-skitshow. Vi drog in miljarder, men de europeiska akademiborgarna dominerade som alltid. Argentina vann fast de spelade som ligister, och den där Trump-hatet som lät Balogun spela trots rött kort – patetiskt! Jag vägrade lämna scenen, precis som jag vägrar lämna Amerika åt vänsterns vansinne. Fantastiskt VM, men nästa gång gör vi det stort på riktigt.", "stalin": "Kamrater, denna dekadenta fotbollsorgie avslöjar borgarklassens sista spasm. Den europeiska kapitalistmaffian har förvandlat sporten till en global utsugningsmaskin som spottar ut identiska dribbelmaskiner från samma akademier. Argentina visade klasshat genom att vända ryggen åt pokalceremonin, ett litet ljus i mörkret. Vi ska likvidera denna folkförtryckande likriktning. Fotbollen tillhör folket, inte de exploaterande byfånarna i Fifa och deras reklamslavar."}, "date": "23 juli, 14:44", "url": "https://www.flamman.se/fotbollen-vann-over-trump-och-infantino", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlqgqfah7pthw-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
