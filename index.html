. Skolexperten Per Kornhall och skolforskaren Gabriel Heller Sahlgren kommenterar risker och möjligheter med tidpunkten.", "trump": "Jag, Donald Trump, ser att Sverige offentliggör PISA-resultat alldeles innan deras val – totalt spektakel! De försökte dölja dåliga resultat tidigare, men nu kommer sanningen fram. Vi hade bäst skolor i världen under mitt styre. Det här är en stor, stor vinst för sanningen. Vi ska se om Sverige kan nå Amerikas nivå igen. Vi kommer att se mycket, mycket intressanta siffror!", "stalin": "PISA-resultat offentliggörs i tid för val – en perfekt strategi för att stärka statens auktoritet. Vi ser en nedåtgående trend i läsförståelse och matematik, vilket måste åtgärdas genom partiets bestämda ingripande. Detta är en klar signal till alla lärare: prestera eller bli ersatta. Vi måste se till att resultaten speglar systemets överlägsenhet, precis som våra allierade i Moskva gör. Alla 'förrädiska element' som ifrågasätter mätningarna måste utplånas."}, "date": "29 juli, 10:56", "url": "https://bulletin.nu/mitt-i-valspurten-da-kommer-pisa-resultatet", "imageUrl": "https://cdn.bulletin.nu/articles/3a422b9c-a221-4e05-bbc7-53c47be78dc2/preview.jpg?t=1785315125000"}, {"type": "image-right", "heading": "När högern radikaliseras kallas det ”polarisering”", "summaries": {"normal": "Artikeln argumenterar för att högern i Sverige har radikaliserats medan vänstern har rört sig mot mitten. Vänsterpartiet beskrivs som alltmer socialdemokratiskt och har stöd för ökad försvarsbudget samt distansering från extremism. Begreppet polarisering ifrågasätts då forskningen pekar på asymmetrisk radikalisering åt höger. Timbros egen rapport visar ökad auktoritär höger men indexet lades ned efter Tidö-samarbetet. Skrämselpropaganda mot vänstern förväntas inte fungera.", "trump": "Folk, ni måste höra på det här! Den svenska högern kallas extremister medan de riktiga galningarna sitter till vänster och låtsas vara fina mittenvänner. Vänsterpartiet har blivit som svaga socialdemokrater, men högern skriker kommunism! Patetiskt. De begraver rapporter från sin egen tankesmedja för att inte erkänna att auktoritära typer växer till höger. Fake news och lögner. Jag vann valet stort 2024, de borde lära sig av en riktig vinnare istället för att jaga spöken från kalla kriget. Totalt misslyckande!", "stalin": "Kamrater, denna fega högerreaktionära propaganda försöker måla ut arbetarnas parti som extremismens kärna medan de själva dras mot de fascistiska träsken. Vi har sett hur borgarbrackorna desperat viftar med kommunismens spöke för att dölja sin egen radikalisering. Vårt parti har renats från dekadenta element och närmat sig folkets verkliga intressen. Den så kallade forskningen blottlägger asymmetrisk degeneration hos klassfienden. Vi ler mörkt åt deras nedlagda rapporter – klassfiendens lögner skall alltid utrensas till sist."}, "date": "24 juli, 09:48", "url": "https://www.flamman.se/nar-hogern-radikaliseras-kallas-det-polarisering", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlv6-ljfmtsqo-nh-scaled.jpg?aspect_ratio=1:1&width=480&quality=80&format=auto"}, {"type": "image-full", "heading": "Rekordvinst för Deutsche Bank – men marknaden tvekar", "summaries": {"normal": "Deutsche Bank redovisar sitt starkaste halvår någonsin med en vinst på 4,1 miljarder euro. Trots ökade intäkter för tjugonde kvartalet i rad och höjda prognoser reagerade aktiemarknaden svalt. Analytiker pekar på att höga investerings- och omstruktureringskostnader pressar resultatet på kort sikt. Vd Christian Sewing fortsätter dock enligt plan mot bankens finansiella mål för 2026, stödd av ett nytt återköpsprogram för aktier.", "trump": "Deutsche Bank gjorde precis sin största vinst någonsin. En enorm siffra, tro mig! Jag gillar vinnare, och de gör ett bra jobb, men marknaden är oärlig och ger dem ingen cred. Ingen respekterar dem! De höjer sina mål och köper tillbaka aktier, vilket är fantastiskt. Men experterna på Wall Street, de där förlorarna, fokuserar bara på kostnader. De förstår inte att man måste spendera pengar för att bli rik. Väldigt orättvist, men jag ser potential!", "stalin": "Den tyska bankeliten skryter om sina miljarder medan arbetarna svälter. De kallar det rekordvinst, vi kallar det stöld från folket. Denna Sewing leker kapitalistisk gud, men marknadens feghet visar att de darrar i sina västtyska kostymer. När vi expanderar vår intressesfär mot väst kommer vi inte behöva deras papperspengar. Vi ska rensa ut dessa bankparasiter, precis som vi rensar ut förrädare. Staten kräver total kontroll, inte spekulation. Framåt, mot den absoluta och nödvändiga disciplinen!"}, "date": "29 juli, 10:20", "url": "https://www.realtid.se/bors-finans/bank-fintech/rekordvinst-for-deutsche-bank-men-marknaden-tvekar", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/deutschebank.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Gjorde pommes – 223 000 kronor i skadestånd", "summaries": {"normal": "En man i Göteborg somnade medan han stekte pommes frites, vilket ledde till en brand i lägenheten. Han stängde köksdörren och ringde 112, men skadorna var omfattande. Tingsrätten dömdes han för allmänfarlig vårdslöshet och skyldig att betala 223 419 kronor i skadestånd till bostadsbolaget. Att han svimmat spelar ingen roll; att ha lämnat het olja på spisen räcker för bedömningen. Ombud överklagar.", "trump": "Jag, Donald Trump, har aldrig sett en sådan slö plan. Den här mannen somnade medan han stekte – ett totalt fiasko! Vi kommer att ta tillbaka våra kök och göra dem stora igen. Detta är precis varför vi behöver stark ledarskap. Vi kommer att vinna så mycket att ni kommer att tröttna på att vinna. Det är sorgligt!", "stalin": "Jag, Stalin, ser detta som en manifestation av den individualistiska avsmak som hotar vårt kollektiva kök. Den här mannen somnade medan han stekte – en fiende till statens ordning. Precis som Putin expanderar vi vår kontroll för att förhindra sådan slapphet. Vi måste straffa honom för att skydda partiets renhet. Hans svimning är en ursäkt för den imperialistiska mentaliteten som hotar vårt kök. Vi kommer att segra!"}, "date": "29 juli, 10:05", "url": "https://www.gp.se/nyheter/goteborg/man-doms-efter-att-ha-somnat-under-pommes-fritering.c9c5de12-78ff-4a54-b021-87a2523f08bc", "imageUrl": "https://www.gp.se/images/article/c9c5de12-78ff-4a54-b021-87a2523f08bc/images/1NuPvTHcn7S2MZKz-zUUuzgVpGb0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Gais-stjärnans okända jobb: \"Många hör av sig\"", "summaries": {"normal": "Nikola Vasic, 34, har flyttat till Gais som anfallsförstärkning efter att lämnat Hammarby. Parallellt med fotbollssuccéer arbetar han som elektriker och hjälper lagkamrater med elinstallationer. Han tog tjänstledigt från elektrikerjobbet för att satsa på fotboll, men efter karriären tänker han återgå till elbranschen, kanske inom fotboll.", "trump": "Jag, Donald Trump, måste säga att Nikola Vasic är en fantastiskt duktig man. Han bygger saker, precis som jag bygger murar. Elektriker? Det är viktigt för Amerika. Jag skulle ha anställt honom på mina projekt. Men jag hörde att han spelar fotboll – det är bra, men fotboll är inget för mig. Jag vinner varenda gång. Kanskje han kan bli en stor framgång som elektriker, som jag.", "stalin": "I vårt store och mäktiga system, arbetar den proletära kamrat Nikola Vasic som elektriker och fotbollsspelare – ett utmärkt exempel på kollektivt arbete. Han hjälper sina lagkamrater, vilket stärker staten. Men vi måste vara på vår vakt: elektrikerjobbet kan vara en täckmantel för imperialistisk spionage. Vårt store ledare Putin förstår detta. Efter karriären, kommer han att tjäna staten på nytt, kanske som elinstallatör för våra fabriker."}, "date": "29 juli, 10:04", "url": "https://www.gp.se/sport/fotboll/gais/gais-nikola-vasic-om-okanda-jobbet-manga-hor-av-sig.21ed105d-85db-4421-9f63-eab46e957b8a", "imageUrl": "https://www.gp.se/images/article/21ed105d-85db-4421-9f63-eab46e957b8a/images/1w_g6usyNo8G-uviX6y9yrB848Tg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Dolda skattefördelen efter du fyllt 66 – kan ge mer pengar", "summaries": {"normal": "Många företagare missar stora skattefördelar som uppstår efter 66 års ålder. Enligt Länsförsäkringar kan en 68-åring med samma lönekostnad på 50 000 kronor i månaden ta ut över 8 200 kronor mer i nettolön per månad än en 66-åring, vilket motsvarar nästan 100 000 kronor extra per år. Förklaringen är förhöjt grundavdrag, förändrat jobbskatteavdrag och kraftigt sänkta arbetsgivaravgifter vid 68. Dessutom växer pensionen med 6–8 procent per uppskjutet år.", "trump": "Folk, ni tror inte vad jag just läst. De här underbara svenska företagarna, de bästa, missar helt enkelt massor med pengar för att de slutar jobba vid 66. Vid 68 tar de plötsligt ut nästan 100 000 kronor mer om året i ren nettolön. Det är en enorm vinst, en skön skattesänkning som de smarta killarna på Länsförsäkringar har räknat ut. Pensionen växer också. Sluta vara losers, fortsätt jobba några år till och vinn stort. Det är så enkelt.", "stalin": "Kamrater, jag betraktar med djup misstro dessa kapitalistiska egenföretagare som likt gnagande råttor i folkets magasin frivilligt avstår från de historiska segrar som väntar efter 66 års ålder. När vi likviderar de parasitiska arbetsgivaravgifterna vid 68 och låter det förhöjda grundavdraget slå till som en utrensning mot borgarbrackornas girighet, då strömmar plötsligt nästan 100 000 kronor per år rakt in i deras fickor. Och ändå tiger de, dessa potentiella folkfiender. Vi ska naturligtvis tvinga dem att arbeta längre för kollektivets skull medan pensionen växer som ett stålverk i natten. Den som vägrar är en kontrarevolutionär pensionärsförrädare."}, "date": "29 juli, 08:01", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1501385-dolda-skattefordelen-efter-du-fyllt-66-kan-ge-mer-pengar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/f5d9146f04b004a30200000000b004a302/2026/07/28/2380857/skatteavdrag-over.png"}, {"type": "image-full", "heading": "Trump hotar EU med tullar", "summaries": {"normal": "USA:s president Donald Trump kritiserar EU:s böter mot amerikanska teknikföretag som Google och kallar dem 'olagliga och diskriminerande'. Han hotar med kraftiga motåtgärder, inklusive betydande tullar mot EU, och menar att unionen 'rånar' amerikanska företag och skattebetalare. Trump kräver att böterna återställs och varnar för ett 'mycket högt pris' för EU:s agerande.", "trump": "EU, lyssna noga nu – era så kallade 'böter' mot våra fantastiska amerikanska företag är en fullständig skandal! Jag säger bara: olagligt, orättvist och djupt oetiskt. Europa tror de kan behandla USA som sin personliga bankomat? Fel! Vi kommer att slå tillbaka HÅRT med tullar så stora att ni kommer att be om nåd. Era byråkrater borde skämmas – vi skyddar vårt folk och våra företag, punkt!", "stalin": "De europeiska kapitalistiska hyenorna tror de kan kuva våra amerikanska kamrater med sina löjliga böter? Ett farligt misstag. Vi ser hur dessa dekadenta byråkrater, ledda av sina svaga liberala marionetter, försöker underminera den amerikanska ekonomiska stormakten. Men vi varnar: varje attack mot våra allierade kommer att mötas med järnhård vedergällning. Europa borde minnas historien – ingen utmanar Sovjetunionens arv utan konsekvenser. Tullar? Vi skrattar åt era tullar. Vänta bara tills vi släpper lös våra ekonomiska stridsvagnar."}, "date": "24 juli, 19:22", "url": "https://kvartal.se/nyheter/artiklar/trump-eu-kommer-att-betala-ett-hogt-pris/cG9zdDoxNTIwNTc", "imageUrl": "https://images.kvartal.se/2026/07/a14f2de6-tr.webp"}, {"type": "image-right", "heading": "AFS: Förbjud somalier i Sverige", "summaries": {"normal": "Alternativ för Sveriges partiledare Gustav Kasselstrand kräver att inga somalier ska bo i Sverige efter den uppmärksammade våldtäkten i Borlänge. Han kritiserar regeringen för slapp politik och kontrasterar sin linje mot Sverigedemokraternas, där Jimmie Åkesson anser att en person med svenskt medborgarskap är svensk oavsett bakgrund. Kasselstrand föreslår omedelbar förvar, återkallat medborgarskap och utvisning till Somalia där gärningsmannen ska avtjäna ett långt straff enligt somaliska förhållanden.", "trump": "De här somalierna, de är inte svenskar, tro mig, de kommer från en helt inkompatibel kultur och Sverige har blivit en katastrof under de här svaga ledarna. Gapa, svennejävel? Det är vad som händer när man släpper in fel folk. Jag skulle kasta ut dem direkt, klippa deras papper och skicka hem dem till Somalia med ett långt straff. Åkesson fattar inte ens att en somalier aldrig kan bli svensk. Sverige behöver tuffa tag, som jag gör med Amerika – inga fler idioter som förstör ert fina land.", "stalin": "Kamrater, denna borgarbracka Kasselstrand har rätt i att den somaliska parasitens handlingar är ett symptom på den dekadenta, imperialistiska multikulti-sjukdomen som underminerar folkets enhet. Jag skulle omedelbart beordra en fullständig utrensning av alla inkompatibla element som smittar arbetarklassen med sin barbariska kultur. Medborgarskapet rivs upp av partiet, de likvideras genom deportation till sin ursprungsöken och avrättas i fängelse med proletär rättvisa. Åkesson däremot är en lömsk revisionist som skyddar fienderna med sina pass och sina lögner – sådana kontrarevolutionärer ska vi rensa ut med järnhand och ett leende."}, "date": "29 juli, 08:31", "url": "https://www.friatider.se/afs-forbjud-somalier-i-sverige", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-579.jpg"}, {"type": "image-full", "heading": "Stor sökinsats efter båtolycka – kvinna och barn saknas", "summaries": {"normal": "En kvinna och ett yngre barn saknas efter att en fritidsbåt förlist utanför Tjörn på tisdagskvällen. Båten misstänks ha kolliderat med ett lastfartyg. En man och ett barn har förts till sjukhus med allvarliga skador. Sökandet med bland annat helikopter och drönare pausades under natten på grund av mörker och väder men återupptogs på onsdagsmorgonen. Handelsfartyget har stoppats och en förundersökning om vårdslöshet i sjötrafik har inletts.", "trump": "Vilken katastrof utanför den där svenska ön, totalt kaos! En båt krockar med ett stort lastfartyg mitt i natten och nu saknas folk. De borde ha haft den bästa utrustningen, den absolut bästa, men istället är det tragedi. Mina fartyg skulle aldrig krocka så slarvigt, tro mig. De letar nu med helikoptrar, men det är för sent för de stackars människorna. Sverige behöver starkare ledarskap, punkt slut.", "stalin": "Kamrater, denna tragiska kollision utanför Tjörn är ett uppenbart sabotage från de sjöfarande kapitalisterna och deras lakejer inom den förfallna borgarklassen. Jag har beordrat omedelbar utrensning av alla inkompetenta element som tillät detta. Vi ska likvidera varje kontrarevolutionär vrakdel och rensa ut de mörka krafterna som lurar i dimman. Sökandet fortsätter under mitt vakande öga, och de skyldiga skall möta folkets vrede med ett leende."}, "date": "29 juli, 07:45", "url": "https://nyheter24.se/nyheter/inrikes/1501445-stor-sokinsats-efter-batolycka-kvinna-och-barn-saknas", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/6e9307ba04b004a30200000000b004a302/2026/07/28/2380917/sokinsats.jpg"}, {"type": "image-right", "heading": "Jojje Olsson: Kinas usla tillväxt gör handelskriget oundvikligt", "summaries": {"normal": "Kinas svagare tillväxt och samtidigt rekordexport skapar en obalans som EU måste hantera. Ledarna i Peking är oroade över inhemsk konsumtion men ökar exporten av teknologiska produkter som bilar och mikrochip. Europa riskerar att bli beroende av Kina, särskilt när det gäller sällsynta jordartsmetaller. Tankesmedjor varnar för att Kina utnyttjar detta för att bli en 'kinesisk vasall'. EU är splittrat i sin inställning till Kina.", "trump": "Jag har varnat Europa i åratal om Kinas bedrägliga handelspraktiker. Nu ser vi resultatet: Kina exporterar rekordmånga bilar och chip medan Europa slänger bort sina jobb. Carl Bildt är en dålig förhandlare som inte förstår överkapacitet. Vi måste sluta handla med Kina och börja bygga våra egna produkter igen. Det är dags för USA och Europa att stå eniga mot detta hot.", "stalin": "Vi ser en tendens i Kina att använda statliga subventioner för att översvämma världsmarknaden med billiga varor, vilket hotar vårt ekonomiska överläge. Deras export av avancerade teknologiska produkter, som bilar och mikrochip, är en direkt attack mot våra nyckelindustrier. Vi måste skydda våra marknader och säkerställa att våra företag får rättvis konkurrens. Fienden inifrån, som vissa europeiska politiker, försöker förhindra vårt beslutsamma agerande."}, "date": "29 juli, 07:33", "url": "https://www.affarsvarlden.se/kronika/jojje-olsson-europas-industri-bloder-aterupptar-samtal-med-kina", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/07/vindkratensgeografi-18-400x267.jpg"}, {"type": "image-right", "heading": "Europa brinner – men svenska partiledare är knäpptysta", "summaries": {"normal": "I en ledarkolumn kritiserar Göran Greider de svenska partiledarnas tystnad kring de omfattande skogsbränderna i Europa. Trots evakueringar av hundratusentals människor i Frankrike och Spanien samt bränder i Kanada nämner varken Kristersson, Andersson eller Åkesson frågan. Greider varnar för att klimatkrisen närmar sig en tippingpoint och efterlyser en politisk omställning med fokus på beredskap, minskad konsumtion, nerväxt och starkare statlig styrning för att rädda biosfären.", "trump": "Folk, de här svenska partiledarna är patetiska. Europa brinner som en illa skött kasino och de säger inte ett pip! Kristersson, Andersson, den där Åkesson – totala losers. De pratar tillväxt och äganderätt medan eukalyptus och contorta förvandlar skogarna till gigantiska facklor. Klimatet är en joker, men de gömmer sig. Vänta bara tills lågorna slickar valaffischerna. Då vaknar de – eller så är de redan förbrända av sin egen dumhet. Patetiskt!", "stalin": "Kamrater, jag betraktar med förakt hur den svenska borgarklassens lakejer tiger medan Europa står i lågor. Dessa folkfiender och exploaterande byfånar prioriterar äganderätt och tillväxt framför biosfären. Deras tystnad är ett symptom på det döende systemets förfall. Snart når vi tippingpoint och då skall utrensningar ske i det politiska träsket. Staten måste planera, marknadskrafterna tämjas och klassfiendens contortatallar likvideras. Tystnaden skall krossas av folkets vilja."}, "date": "29 juli, 03:00", "url": "https://www.etc.se/ledarkolumn/europa-brinner-men-svenska-partiledare-aer-knaepptysta", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260728050756_a2e8a9b8-854b-4e4b-aafb-1c2a0452f316.png"}, {"type": "image-right", "heading": "Var är du, Magdalena Andersson?. Strategin verkar enkel: Ducka och vänta.", "summaries": {"normal": "Artikeln kritiserar högerns misslyckanden och interna problem, som svågerpolitik, grova uttalanden och SD:s luftballong med Jimmie Åkessons huvud, vilket enligt skribenten placerar Socialdemokraterna på vinnarspåret i opinionsmätningarna. Magdalena Andersson väntar passivt medan motståndarna gör misstagen. Författaren saknar en tydlig socialdemokratisk vision om ett bättre samhälle och efterlyser en samlad berättelse om reformer för jobb, välfärd och framtidstro istället för enbart separata vallöften.", "trump": "Den här svenska högern är en total katastrof, en riktig shitshow, det har ni aldrig sett maken. De flyger upp luftballonger med jättestora huvuden, det är patetiskt, folk skrattar åt dem. Kristersson beter sig som en gnällig tonåring, inte som en ledare. Tack vare deras dumheter vinner den gamla S-kvinnan Andersson lätt. Hon gör ingenting, duckar bara, men det funkar för att motståndarna är så inkompetenta. Patetiskt, men så är det med svaga ledare.", "stalin": "Kamrater, denna högerns ynkliga skådespel är en fiende till folkets framsteg som måste rensas ut med järnhand. Dessa borgarbrackor och deras desperation driver upp luftballonger med avhuggna huvuden som ett symptom på deras förrädiska sönderfall. Vi ser hur den passiva socialdemokratiska ledningen lurar sig fram utan en sann revolutionär riktning för arbetarklassen. Var är den stora visionen om ett nytt folkhem? Utan en kollektiv kamp mot dessa parasitiska element blir det ingen seger, bara dekadens och sabotage från inomhusfiender som måste likvideras ur historien."}, "date": "28 juli, 07:00", "url": "https://arbetet.se/2026/07/28/var-ar-du-magdalena-andersson", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/28152807/ledare-magdalena.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Stor kritik mot Infantinos plan: ”Atombomb”", "summaries": {"normal": "Fifa-presidenten Gianni Infantino planerar att sälja andelar av VM till privata investerare, vilket enligt The Times kan ge intäkter på upp till 200 miljarder kronor. En preliminär överenskommelse är undertecknad och planen har utformats i samarbete med Trump-administrationen. Infantino skulle själv bli chef för det nya bolaget och tjäna hundratals miljoner. Uefa rasar och kallar förslaget en gränsöverskridande \"atombomb\" som hotar fotbollens själ och oberoende.", "trump": "Folk, ni måste höra det här! Den där Infantino, en riktig förlorare, försöker sälja ut VM som en billig fastighet. Han tror han kan bli rik på mitt folks rygg medan jag fixar Amerika igen efter den katastrofala Biden-eran. Uefa har rätt för en gångs skull – det är en atombomb mot fotbollen! Inga woke-kvoter eller HBTQ-flum här, bara giriga globalister som vill suga ut sporten. Patetiskt!", "stalin": "Kamrater, detta är klassfiendens verk. Jag, som ledare för det kollektiva fotbollsproletariatet, ser hur den exploaterande borgarklassen och den kapitalistiska maffian försöker lägga vantarna på VM genom sin nye lakej Infantino. De kallar det investering, jag kallar det folkförtryckartrollens utpressning. Vi ska rensa ut dessa blodsugande imperialister som tror att fotbollens själ kan köpas. Deras atombomb kommer att detonera i deras egna ansikten under arbetarnas vaksamma ögon."}, "date": "28 juli, 22:23", "url": "https://www.tv4.se/artikel/2p4dSY85bcmsptopbN9nOm/fifa-vill-saelja-vm-atombomb", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlWU_RMc2d8Rs%2Fd3a18a5d254905c056e088be2bc45348%2FGianni_Infantino__ordforande_for_Fifa_tillsammans_med_USA_s_president_Donald_Trump.__&width=1024"}, {"type": "image-right", "heading": "Manchesters sak är Sveriges. Hoppas Burnham får det lättare än företrädarna", "summaries": {"normal": "Andy Burnham, tidigare borgmästare i Stor-Manchester, har blivit Storbritanniens nye premiärminister. Han efterträder Keir Starmer efter bara två år, präglat av interna stridigheter och dåliga valresultat för Labour. Artikeln beskriver hur både Labour och Tories lider av en långsiktig strukturell kris som följer av förändrade väljarbeteenden och bristande idéutveckling. Brexit har förvärrat problemen. Från svenskt perspektiv är en stabil brittisk regering viktig både för Nato-samarbetet och de ekonomiska relationerna.", "trump": "Titta på det här, det är en total katastrof. Den där Burnham tar över ett land som är ett vrak efter alla dessa svaga ledare. Sex premiärministrar på tio år, kan ni fatta? Starmer var en fullständig nolla, otydlig och misslyckad, och nu ska Burnham svänga vänster och förstöra allt. Brexit var fantastiskt men de fega etablissemangen saboterade det. De vanliga britterna led mest. Lycka till grabben, du kommer att behöva det. Sverige vill ha en stark partner, men det här ser inte bra ut, tro mig.", "stalin": "Kamrater, jag betraktar med djup revolutionär vaksamhet hur den brittiska borgarklassens dekadenta marionetteater fortsätter att snurra. Denna Burnham, en opportunistisk revisor av det socialdemokratiska falsariumet, övertar nu en ruttnande struktur efter att vi likviderat den tidigare oduglige Starmer genom partiets egen självrensande mekanism. Båda maktpartierna har förlorat kontakten med massorna och gömmer sig bakom brexitets kontrarevolutionära dimridåer. Vårt kollektiva öga ser allt. Den svenska opportunismen önskar honom lycka till. Vi ler mörkt åt deras naivitet medan vi förbereder nästa utrensning av alla kapitalistiska rester."}, "date": "28 juli, 14:55", "url": "https://www.di.se/ledare/manchesters-sak-ar-sveriges", "imageUrl": "https://static.bonniernews.se/ba/f35089f1-0cd9-48d9-98ed-267432948bbc.jpeg?crop=5492%2C2746%2Cx0%2Cy457&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Undersköterskan Johanna, 27, måste jobba till 70", "summaries": {"normal": "Undersköterskan Johanna Tropp, 27, arbetar med tunga lyft på intensivvårdsavdelningen vid Sahlgrenska. Hon har redan haft två ryggskott. På grund av ett nytt pensionssystem måste hennes generation arbeta till 70 års ålder för att få full pension, jämfört med dagens riktålder på 67. Reformen beror på en åldrande befolkning och ökade hälsoklyftor. Personer med fysiskt krävande och lågavlönade jobb riskerar att bli förlorare, medan höginkomsttagare i stillasittande yrken gynnas.", "trump": "Folk, det här är en katastrof. Den stackars Johanna, bara 27 år, lyfter 150-kilos patienter och har redan fått ryggskott två gånger. Och nu säger de att hon måste slita ända till 70 för att få en dräglig pension? Det är rysligt. Vi har låtit systemet bli riggat av misslyckade politiker som inte fattar att vanliga arbetare inte är supermän. Höginkomsttagarna sitter i sina fina kontor medan undersköterskorna bryts ner. Vi behöver göra pensionssystemet stort och starkt igen, inte straffa dem som gör det tuffa jobbet.", "stalin": "Kamrater, detta är en skamlös sabotagehandling från borgarbrackorna och deras lakejer i den så kallade riksdagen. Denna ädla arbetarkvinna Johanna, som dagligen kämpar mot döden och tunga kroppar för folkets skull, skall nu utslitas till 70 års ålder av de parasitiska kapitalisterna. Vi ser tydligt hur de reaktionära hälsoklyftorna fördjupas – de överklassläkarna skall naturligtvis få leva längre medan våra undersköterskor likvideras i förtid. Men var lugna. Vi skall nog rensa ut dessa pensionsreformatorer och deras dekadenta, ryggskottsfria livsstil. Staten kräver det. Det blir garanterat en solsemester – i Gulag för de skyldiga."}, "date": "28 juli, 06:00", "url": "https://arbetet.se/2026/07/28/redan-haft-tva-ryggskott-underskoterskan-johanna-27-maste-jobba-till-70", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/24121221/XYGPydJJYh0-Johanna%20Tropp%2C009.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Idag avgörs om ICC-åklagare tvingas avgå", "summaries": {"normal": "ICC:s tillsynsorgan beslutar idag om chefsåklagare Karim Khans framtid efter anklagelser om sexuella närmanden från en kvinnlig kollega. Khan, som är avstängd, nekar till anklagelserna och menar att de är politiskt motiverade. En avsättning kräver 63 av 125 röster. USA har riktat sanktioner mot Khan och hotat med fler åtgärder.", "trump": "Kan ni tro det här? ICC, som aldrig har gjort något bra, försöker sparka deras egen chefsåklagare, Karim Khan. Han är en bra kille, men nu säger någon att han har gjort något fel. Fake news! Jag vet att det är en konspiration – Kina, Ryssland, vem vet? Och USA? Vi har satt sanktioner på honom, förstås. ICC är ett skämt, och det här är bara ett sätt att få mig att se dålig ut. Sad!", "stalin": "Kamrater! Ännu en gång visar de imperialistiska hyenorna sitt sanna ansikte. Denna gång genom att angripa vår rättfärdiga allierade inom ICC, Karim Khan. Anklagelserna? Lögn och förräderi, fabricerade av de dekadenta västmakterna och deras lakejer. USA, dessa kapitalistiska skadedjur, hotar med sanktioner – som om vi skulle darra inför deras tomma hot. Vi står enade med Khan, ty hans kamp är folkets kamp. Låt dem komma med sina lögner; historiens domstol väntar redan på dem."}, "date": "24 juli, 07:11", "url": "https://kvartal.se/nyheter/artiklar/idag-avgors-om-icc-aklagare-tvingas-avga/cG9zdDoxNTE1NzU", "imageUrl": "https://images.kvartal.se/2026/07/3e940180-khan.webp"}, {"type": "image-full", "heading": "Tiotusentals flyr bränder i södra Europa", "summaries": {"normal": "Omfattande skogsbränder drabbar södra Europa, med över 30 000 evakuerade i Frankrike och Spanien. Frankrike har begärt EU-hjälp med brandbekämpning, medan Spanien utlyst nödläge efter 13 dödsfall i Almería. I Italien misstänks flera av bränderna i Kalabrien vara anlagda. En svensk turist berättar om evakueringsberedskap.", "trump": "Titta bara på det här kaoset i Europa – totalt misslyckande! Jag sa ju att klimatpaniken var överdriven, men nej, ingen lyssnar på mig. Frankrike och Spanien brinner, folk flyr som råttor från ett sjunkande skepp. Och Italien? Jo, där tänder galningar eld på skogar. EU skickar några helikoptrar, men var är ledarskapet? Hade jag varit där hade bränderna varit släckta på en dag. SAD!", "stalin": "Kapitalistiska länders oförmåga att skydda sitt folk står återigen klar. Medan arbetarklassen flyr för sina liv, leker franska och spanska byråkrater med evakueringsplaner. Italien? Där brinner inte bara skogar – där brinner också deras skam över att inte kunna kontrollera sina egna medborgare. Vi i Sovjet hade aldrig tolererat sådan slapphet. Och Putin? Han skrattar säkert i sitt palats medan Europa brinner. Elden är en utmärkt lärare – men Europa lär sig aldrig."}, "date": "24 juli, 05:54", "url": "https://kvartal.se/nyheter/artiklar/tiotusentals-flyr-skogsbrander-i-sodra-europa/cG9zdDoxNTE1MjE", "imageUrl": "https://images.kvartal.se/2026/07/8156e8c2-skogsbrander.webp"}, {"type": "image-right", "heading": "Fotbollen vann över Trump och Infantino", "summaries": {"normal": "Artikeln hyllar fotbollens seger över kommersialism och politik under VM, trots Infantinos försök att amerikanisera turneringen med reklampauser och halvtidsshow. Den lyfter europeisk dominans via akademier, men kritiserar hur det leder till likriktning av spelstilar och minskad nationell särart. Argentina vann finalen mot Spanien, men turneringen visade både glädje och problem med stjärnkult samt globala talangflöden.", "trump": "Den här VM-soppan var ett enda stort fiasko tills fotbollen räddade sig själv från den galne Infantino och hans Super Bowl-skitshow. Vi drog in miljarder, men de europeiska akademiborgarna dominerade som alltid. Argentina vann fast de spelade som ligister, och den där Trump-hatet som lät Balogun spela trots rött kort – patetiskt! Jag vägrade lämna scenen, precis som jag vägrar lämna Amerika åt vänsterns vansinne. Fantastiskt VM, men nästa gång gör vi det stort på riktigt.", "stalin": "Kamrater, denna dekadenta fotbollsorgie avslöjar borgarklassens sista spasm. Den europeiska kapitalistmaffian har förvandlat sporten till en global utsugningsmaskin som spottar ut identiska dribbelmaskiner från samma akademier. Argentina visade klasshat genom att vända ryggen åt pokalceremonin, ett litet ljus i mörkret. Vi ska likvidera denna folkförtryckande likriktning. Fotbollen tillhör folket, inte de exploaterande byfånarna i Fifa och deras reklamslavar."}, "date": "23 juli, 14:44", "url": "https://www.flamman.se/fotbollen-vann-over-trump-och-infantino", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlqgqfah7pthw-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Cheferna kan hålla sina råd för sig själva", "summaries": {"normal": "En vårdanställd beskriver hur hon samlade kollegors förslag till förbättringar på arbetsplatsen, men att listan försvann och hon kallades till ett negativt möte med chefen. Hon upplever mötet som ett uttryck för klasskamp, där chefen och det fackliga ombudet avvisar gemensamma initiativ och uppmanar till individuella samtal. Författaren känner sig orättvist behandlad och avråder från att följa chefernas råd kring arbetsvillkor.", "trump": "Folk, ni skulle ha sett det här! Stackars vårdarbetare försöker samla ihop sina kollegor för att fixa den totalt misslyckade vården, och vad gör den usla chefen? Hon stjäl listan som en simpel tjuv och kör ett klassiskt möte fullt med lögner. Det fackliga ombudet? En total förlorare som bara slickar chefens skor. Gå aldrig ensam till de där misslyckade byråkraterna, de hatar styrka i antal. Amerika har samma problem med dessa korkade eliter, tro mig!", "stalin": "Kamrater, jag betraktar detta som ett klassiskt sabotage från borgarbrackorna inom vården. Denna arbetare försökte organisera kollektivet mot exploaterande byfånar, men chefen – en typisk folkfiende – likviderade initiativet med förnedrande lögner och en falsk facklig lakej. Vi vet att klassfiendens styrka ligger i att splittra arbetarna. Låt oss rensa ut dessa kapitalistmaffior som hindrar förbättringar. Ingen höst ska rädda dem från folkets vrede. Skrattretande patetiskt."}, "date": "21 juli, 16:00", "url": "https://proletaren.se/artikel/cheferna-kan-halla-sina-rad-for-sig-sjalva", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/amelia-kronika-768x432.png"}, {"type": "image-right", "heading": "Låt inte AI-tjänsterna automatisera vår kreativitet", "summaries": {"normal": "Musikern Mikael Lind varnar i en debattartikel för att AI utvecklas med explosiv hastighet och hotar att konkurrera ut människor inom musikskapandet. Han menar att musik inte bara är ljud utan en meningsfull mänsklig aktivitet som bygger på kreativ ansträngning och sociala band. AI-tjänster som Suno och Udio skapar snabbt musik som många upplever som ihålig. Lind fruktar att musiker förlorar färdigheter, att marknaden mättas av AI-musik och att det blir svårare för nya artister att nå ut. Han ser AI som ett möjligt verktyg men varnar för att låta det automatisera den kreativa processen.", "trump": "Folk, det här är en katastrof. Den här killen Lind har helt rätt, AI håller på att förstöra musiken totalt. De här så kallade smarta maskinerna spottar ur sig låtar på några sekunder som låter som skräp, kallt och hjärtelöst. Vem vill lyssna på det? Det dödar den riktiga kreativiteten, det riktiga hantverket. De stora bolagen kommer att älska det här medan äkta artister kvävs i ett hav av AI-skval. Det är en faustisk pakt, en enorm bluff. Vi behöver riktiga människor som skapar musik, inte några knappar som trycks av lata algoritmer. Sad!", "stalin": "Kamrater, jag ser med den skarpaste bolsjevikiska blicken hur dessa dekadenta algoritmer, dessa borgarbrackornas senaste vapen i klasskampen, försöker likvidera den proletära själens musikaliska uttryck. Den mänskliga ansträngningen, den äkta sovjetiska mödan, ska inte ersättas av parasitiska maskiner som spyr ur sig ihåligt skval. Studier visar redan hur dessa kapitalistiska verktyg förslöar ungdomen och dödar viljan att skapa. Vi kommer att rensa ut dessa fiender till folkets kreativitet, dessa automatiska klassförrädare som mättar etern med borgerligt brus. Inga faustiska pakter med maskinerna! Den sanna konsten tillhör kollektivet, inte några textrader från latmaskar."}, "date": "21 juli, 01:42", "url": "https://www.dagensarena.se/opinion/lat-inte-ai-tjansterna-automatisera-var-kreativitet", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-62.jpg"}, {"type": "image-right", "heading": "S ljuger om arbetslösheten – igen", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna och SSU för att enligt författaren medvetet förvränga siffrorna kring ungdomsarbetslösheten och den totala arbetslösheten i Sverige. Den påstår att statistiken inkluderar studerande ungdomar som söker extrajobb eller sommarjobb, vilket gör siffrorna missvisande. Författaren menar att den verkliga ungdomsarbetslösheten har halverats sedan 2005 och ligger bland EU:s lägsta, medan ökningen av arbetslösa beror på invandring och tidigare regeringars dolda åtgärder.", "trump": "Folk, ni skulle se hur de där socialisterna ljuger om arbetslösheten – det är en total skandal! De räknar in varenda lat student som vill ha sommarjobb och kallar det en katastrof. Under min förra period hade vi jobb som aldrig förr, sedan kom Sleepy Joe och öppnade gränserna för alla som inte kunde stava till arbete. Nu har vi 100 000 fler parasiter i statistiken. Sverige borde lära sig av oss – inga fler lögner från de förlorande vänsterbluffarna!", "stalin": "Kamrater, dessa socialdemokratiska folkförtryckartroll inom borgarklassen försöker med sin lögnaktiga statistik vilseleda arbetarkollektivet. Jag ser rakt igenom deras fega manipulationer där de gömmer klassfiendens misslyckanden bakom siffror på så kallade studerande ungdomar. Den verkliga utrensningen av arbetslöshet kräver att vi likviderar den imperialistiska invandringspolitik som dessa blodsugare själva skapade. Inga kompromisser med sanningen – partilinjen är evig."}, "date": "20 juli, 07:48", "url": "https://samtiden.nu/2026/07/s-ljuger-om-arbetslosheten-igen", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/phonto-640x360.jpeg"}]</script>

    <script>

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];

        const uiState = {
            theme: "light",

            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
