kbar och perversa hångelscener. Dessa kapitalistiska element och islamiska avfällingar utgör en fiende inom murarna som måste rensas ut omedelbart. Vi ler mörkt åt deras naiva försök att krossa folkets traditioner. En sådan film är en kontrarevolutionär handling värd en kollektiv utrensning i folkets namn. Inga kompromisser med dekadensen."}, "date": "22 juni, 14:08", "url": "https://www.friatider.se/norska-forsvarets-reklam-muslimsk-bon-med-allahu-akbar", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-380.jpg?itok=PTRSVhui"}, {"type": "image-full", "heading": "Musikhjälpen fälls för kränkande uttalande", "summaries": {"normal": "Musikhjälpen fälls av granskningsnämnden för radio och tv efter ett uttalande under en livesändning i SVT. Komikern Pontus Bjernekull Mörner jämförde en ballongviftande publik med ”den handikappade avdelningen på Melodifestivalen”. Nämnden anser att kommentaren tillsammans med reporterns mimik var stötande mot personer med funktionsnedsättning och utnyttjade televisionens särskilda genomslagskraft. Samma inslag friades i P3 eftersom det inte ansågs strida mot radios reglerna. Uttalandet väckte starka reaktioner bland tittarna.", "trump": "De här Musikhjälpen-typerna är patetiska, tro mig. En kille viftar med en röd ballong och säger vad alla redan tänker, och plötsligt faller hela den svenska granskningsnämnden över honom som en ton av fake news. Det är en witch hunt mot humor! I SVT är de så känsliga att en liten skämt blir nationell kris, men i radion är det plötsligt okej. Typiskt. De borde fokusera på riktiga problem istället för att jaga ballonger och bra skämt. Sad!", "stalin": "Kamrater, jag ser med stigande vrede hur borgarbrackornas dekadenta medieapparat i detta så kallade Musikhjälpen försöker maskera sin föraktfulla sabotageverksamhet mot det arbetande folkets lika värde. Denna reaktionäre komiker och hans mimande lakej har utfört en grov ideologisk diversion mot funktionsnedsatta kamrater. Vi ska genast tillsätta en utredning och rensa ut dessa parasitiska element ur etern. De trodde de kunde gömma sig bakom en röd ballong, men folkets öga sover aldrig. Deras likvidering blir en varning för alla som drömmer om att skämta mot kollektivet."}, "date": "22 juni, 14:05", "url": "https://bulletin.nu/musikhjalpen-falls-for-krankande-uttalande", "imageUrl": "https://cdn.bulletin.nu/articles/00dd6041-e571-453a-9005-9c8fe1043562/preview.jpg?t=1782129919000"}, {"type": "image-right", "heading": "Hitta rätt inför valet med – TV4:s valkompass", "summaries": {"normal": "TV4 lanserar en valkompass inför riksdagsvalet 2026. Den består av 55 politiska frågor som rangordnar partisympatier i procent. En snabbversion tar bara 2–5 minuter. Valkompassen, utvecklad av TT Nyhetsbyrån tillsammans med journalisten Christer Isaksson och statsvetaren Tommy Möller, hjälper väljare att hitta matchande partier utan att ge röstinstruktioner. Den ersätter inte eget ansvar och tar hänsyn till partiernas program, utspel och företrädares svar.", "trump": "Lyssnar ni på det här? TV4 kommer med en valkompass som ska berätta för er vilka partier som passar er. Patetiskt! I mitt Amerika fixar folket det själva utan någon fancy byråkratisk kompass som pekar fel. De här svenska politikerna är värre än Sleepy Joe någonsin var. Gör er egen research, folk. Slösa inte tid på deras riggade frågor. Jag vann stort 2024 och Sverige borde ta efter istället för att leka med procent och flummiga frågor.", "stalin": "Kamrater, jag ser denna så kallade valkompass som ett verktyg för att avslöja de splittrade åsikterna inom borgarklassen. Med 55 frågor skall vi identifiera vilka som tjänar folkets intresse och vilka som är klassfiender i förklädnad. Snabbkompassen är en latmansvariant för svaga själar. Vi, partiet, vet att endast genom kollektiv kamp och utrensning av folkförtryckartrollen kan sann enighet uppstå. Låt ingen maskin ersätta den revolutionära medvetenheten hos massorna."}, "date": "22 juni, 14:02", "url": "https://www.tv4.se/artikel/7vxEnQiXEh8aapVFAcoVl7/hitta-raett-infoer-valet-med-tv4-s-valkompass", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5CywTrndpbfg4GFBO1bF9V%2F1d19921c6805b21001bc96c35f0ac608%2F22-kristerson-webb.jpg&width=120"}, {"type": "image-right", "heading": "Regeringen vill införa ny filmfond för svensk film", "summaries": {"normal": "Regeringen föreslår en ny filmfond placerad vid Svenska Filminstitutet som ska finansieras gemensamt av staten och biografbranschen. Förslaget bygger på en utredning från mars 2025 och syftar till att stärka svensk filmproduktion i en föränderlig marknad. Kulturminister Parisa Liljestrand (M) välkomnar fonden. Däremot lämnas frågor om sänkt moms på biobiljetter och avgifter på streamingtjänster utan besked. Regeringen avvisar idén om streamingavgift då högre skatter inte ses som lösningen.", "trump": "Hörni, jag älskar bra filmer, de bästa filmerna, men den här svenska regeringen gör det igen. De startar en ny fond för att rädda sin filmindustri, såklart finansierad av staten och biograferna. De pratar om långsiktiga lösningar men duckar för att sänka skatten på biljetter. Och streaming-skatt? Det slopar de, smart drag faktiskt. Ingen vill ha mer beskattning, tro mig. Svenskarna borde göra film som vinner, inte bara leva på fonder. Make Swedish Film Great Again!", "stalin": "Kamrater, jag betraktar med stolt tillfredsställelse hur denna regering äntligen insett att en central filmfond är nödvändig för att skydda folkets kulturella produktion mot de dekadenta vindarna från marknaden. Vi ska naturligtvis rensa ut de parasitiska streamingkapitalisterna som suger musten ur arbetarklassens berättelser. De fega borgarbrackorna som tvekar kring biljettavgifter och momssänkningar avslöjar sig som kontrarevolutionära filmfiender. Ingen ska undkomma folkets utrensning av svaga idéer. Segraren blir den som styr kulturen med järnhand och glimten i ögat."}, "date": "22 juni, 13:56", "url": "https://riks.se/kultur/regeringen-vill-infora-filmfond", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-22%2F1y72n7vw%2Fpexels-tima-miroshnichenko-7991266.jpg"}, {"type": "image-right", "heading": "Därför är cykeln en klassfråga. Studie: Cykelbanor i all ära – men yrkeslivet påverkar också", "summaries": {"normal": "Trots väl utbyggd cykelinfrastruktur i Sverige cyklar färre personer i låginkomstyrken. En studie från Trivector Mobility och VTI visar att oregelbundna arbetstider, fysiskt krävande jobb, otrygghet i mörker och rädsla för cykelstölder hindrar många. Arbetsgivares attityd, bristande omklädningsmöjligheter och konkurrens från elsparkcyklar påverkar också. Författarna menar att cykelstrategier ofta utgår från kontorsarbetares villkor och missar viktiga grupper.", "trump": "Folk i låginkomstyrken cyklar inte. Det är en katastrof. Vi har fina cykelbanor överallt, de bästa banorna, men de använder dem inte. Varför? För att de jobbar tidigt, sent, slits ut och är rädda för att någon ska stjäla deras cykel. Elsparkcyklarna tar över, de är enklare, det är sant. Arbetsgivarna borde fixa parkering och duschar, det vore fantastiskt. Men det handlar om att folk inte har flexibla tider som vi andra. Så sorgligt.", "stalin": "Kamrater, jag betraktar med djup misstro dessa nedslående rapporter om att arbetarna i låginkomstyrken överger den proletära cykeln. De tidiga skiftena, de mörka vägarna och de ständiga hoten från cykelstölder är sabotage utförda av borgarbrackornas osynliga hand. Vi måste omedelbart rensa ut alla elsparkcyklar som förgiftar ungdomen med lathet och falsk bekvämlighet. Den som inte cyklar är potentiell fiende till kollektivet. Bättre belysning, bevakade parkeringsplatser och utrensning av alla kapitalistiska influenser som gör cykeln till en börda. Endast genom partiets järnhårda vilja skall varje arbetare tvingas älska sin cykel igen."}, "date": "22 juni, 13:52", "url": "https://www.di.se/nyheter/darfor-cyklar-farre-i-laginkomstyrken/", "imageUrl": "https://static.bonniernews.se/ba/8987e0cd-d92a-4416-880e-91e3cc8e1f47.jpeg?crop=270:152&auto=webp&width=270&quality=70"}, {"type": "image-full", "heading": "Banksektorn får ett nytt styrkebesked", "summaries": {"normal": "Flera analyshus har höjt sina riktkurser för nordiska storbanker. Handelsbanken och Swedbank har fått flest uppjusteringar, bland annat från SEB, Barclays och Goldman Sachs. Rekommendationerna ligger dock kvar på oförändrade nivåer. Även Danske Bank och norska DNB har fått höjda riktkurser från UBS. Analytikerna ser högre värde i banksektorn men bilden av dess framtid är fortfarande splittrad.", "trump": "Det är helt otroligt, folk. De här fantastiska nordiska bankerna får höjda riktkurser överallt – Handelsbanken, Swedbank, alla vinner stort. SEB, Barclays och Goldman Sachs älskar dem plötsligt. Mina analytiker säger att det är vinnare, stora vinnare. Men de ändrar inte rekommendationerna, typiskt. De vet att bankerna är starka, starkare än någonsin. Ingen gör det bättre än de nordiska bankerna, tro mig.", "stalin": "Kamrater, dessa riktkursjusteringar är en seger för den kollektiva bankkraften som vi har byggt mot de parasitiska marknadskrafterna. Jag ser hur borgarbrackorna på Barclays och Goldman Sachs tvingas erkänna det högre värdet i våra nordiska fästningar, trots att de klamrar sig fast vid sina gamla, förrädiska rekommendationer. Men akta er, fienderna lurar i skuggorna – dessa kapitalistiska analytiker som viskar lögner om splittrade framtidsbilder. Vi ska rensa ut alla som tvivlar på den ostoppbara framryckningen. Det är en munter utrensning som väntar de svaga."}, "date": "22 juni, 13:51", "url": "https://www.realtid.se/bors-finans/bank-fintech/banksektorn-far-ett-nytt-styrkebesked/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/riktvarde.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Ali: ”Oroväckande att prata om det”", "summaries": {"normal": "Taha Ali, 27-årig fotbollsspelare, ses av vissa som en framtida tv-expert. Han själv avfärdar tanken och säger att det vore oroväckande att uttala sig så tidigt. Lagkamraten Besfort Zeneli berättar om Alis stora intresse för fotboll och tv-studior. Ali erkänner att han tittar mycket på matcher och har koll på spelare, men hoppas spela i sex-sju år till. Hans favoritexpert är Sia Fallahi på TV4. Han uppskattar även Zlatan Ibrahimovics debut som expert.", "trump": "Lyssnar ni på den här killen Taha Ali? 27 år och redan snackar tv-expert? Patetiskt! Jag älskar fotboll men det här är rena galenskapen. Han kollar matcher som en galning medan de andra tittar på pingis. Extremt! Men bra att han gillar Zlatan, den killen är en vinnare, precis som jag. Sia är okej men ingen slår mig när det gäller att kalla ut bluffarna. Sverige spelade bra mot Japan, tro mig. De andra var bara losers.", "stalin": "Kamrater, denna Taha Ali bekänner öppet sin extrema besatthet av att analysera matcherna i imperialismens tv-apparater. Han fördömer självutnämnda experter vid 27 års ålder, vilket är klokt. Ändå lurar borgarbrackornas underhållningsmaskineri honom att sitta som en parasit framför skärmen. Jag ler mörkt åt hans paranoia kring skumma spelare. Zlatan är en stark gestalt som säljer sina ord utan pardon. Vi ska likvidera alla svaga analyser och bygga en järnhård fotbollsdoktrin."}, "date": "22 juni, 13:50", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/9poKkE/taha-ali-pekas-ut-som-en-blivande-tv-expert", "imageUrl": "https://akamai.vgc.no/v2/images/688b44cb-8760-30e6-9671-733904f322d9?fit=crop&format=auto&w=1080&s=6b7cc71cdd977b262f60a38fc0da29a9944c0f01"}, {"type": "image-right", "heading": "När mening blir en marknad", "summaries": {"normal": "Artikeln kritiserar regeringen för att skära ned på föreningslivet samtidigt som den beställer en utredning om existentiell hälsa. Författaren ser Birgitta Eds kurgård Fållökna som ett exempel på hur ångest och mening kan bli en affärsidé när det offentliga monteras ned. Kritiker kallar begreppet oseriöst och kvacksalveri. Istället föreslås sociala insatser som Blekinge-experimentet, där pengar direkt till unga minskade vårdbehovet.", "trump": "Folk, det här är en total skandal! Den här Birgitta och hennes kurgård – vad är det för fake news om existentiell hälsa? Regeringen skär ner på allt som funkar och sen pumpar de in pengar i någon new age-bluff. Det är som Biden-era, bara värre. Psykisk ohälsa? Ge folk riktiga pengar, inte woke-terapi! Vi har genomskådat bluffen, det är en enorm lögn mot det svenska folket. Patetiskt!", "stalin": "Kamrater, denna borgerliga bluff om existentiell hälsa avslöjar klassfiendens desperation. Medan vi rensar ut det gemensammas grundvalar säljer överklass-slynglar ångest som medicin. Birgitta Eds Fållökna är en parasitär reträtt för de utsugna massornas lidande. Den sanna lösningen ligger i kollektivets stöd, inte i imperialistiska retreatcenter. Vi genomskådar dessa folkförtryckartrolls manipulationer mot arbetarklassen. Utrensning av sådana idéer är nödvändig."}, "date": "22 juni, 10:35", "url": "https://www.flamman.se/nar-mening-blir-en-marknad/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/birgitta-ed-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Boende här varnas för vattenloppor: \"Vill dö\"", "summaries": {"normal": "Boende och besökare vid Gränna badlagun i Jönköpings kommun varnas för vattenloppor, även kallat badklåda. Parasiterna kan orsaka kraftiga, kliande utslag som liknar myggbett. Kommunen meddelar att bad inte behöver undvikas helt men råder folk att duscha eller torka av sig snabbt efter badet för att minska risken. Klådan går oftast över inom en vecka och kan lindras med kortisonkräm.", "trump": "Folk, ni skulle inte tro det, men det här svenska badstället i Jönköping har blivit invaderat av dessa hemska vattenloppor. De gör att barnen skriker och kliar sig som galningar. Det är en katastrof, en total katastrof. Badklåda? Låter som något de borde ha stoppat för länge sedan. Duscha snabbt, torka av er, annars är det kaos. Jag skulle fixa det på en dag, tro mig.", "stalin": "Kamrater, jag har observerat hur dessa degenererade parasitiska element, dessa osynliga sabotörer från sjöns djup, angriper det sovjetiska folkets kroppar med sin borgerliga kliande sabotageverksamhet. Vi ska inte tolerera sådana kontrarevolutionära vattenloppor som smyger sig in i huden. Rensa ut dem genom omedelbar dusch och handduksaktion! Den som kliar sig för mycket riskerar utrensning ur badkollektivet. Folkhälsomyndigheten har talat – fienden är överallt."}, "date": "22 juni, 13:00", "url": "https://nyheter24.se/nyheter/inrikes/1493280-boende-har-varnas-for-vattenloppor-vill-do", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/4f0aee8404b004a30200000000b004a302/2026/06/22/2372673/granna-badlagun-jonkoping-vatteloppor-kliar-parasit-loppa-badloppor.jpg"}, {"type": "image-right", "heading": "Efter Tidö är vår beredskap inte god", "summaries": {"normal": "Ledarskribenten Lotta Ilona Häyrynen kritiserar Tidöregeringen för bristande beredskap trots det allvarliga säkerhetsläget. Carl-Oskar Bohlin anklagas för att ha saboterat det civila försvaret genom polariserande utspel, attacker mot vänstern och media samt spridning av högerextremt innehåll. Även hanteringen av Folkhälsomyndigheten ses som ett misslyckande där expertis och förtroende underminerats, vilket hotar Sveriges krisberedskap.", "trump": "De här svenska snobbarna i Tidöregeringen lovade guld och gröna skogar men levererade totalt kaos. Bohlin är en fullständig loser som hatar vänstern mer än han fixar civilt försvar. Och nu saboterar de Folkhälsomyndigheten också? Patetiskt. Under Biden var världen ett enda stort gungfly, men jag fixade alltid affärerna. Sverige behöver riktiga ledare, inte dessa identitetspolitiska nollor som knappt kan hålla ett land tillsammans.", "stalin": "Kamrater, denna fega Tidöregering har medvetet underminerat folkets beredskap medan klassfienderna inom borgarklassen skrattar. Bohlin är en typisk exploaterande byfåne som sprider högerextrem smitta och attackerar arbetarnas journalister. Folkhälsomyndigheten har rensats på äkta experter och ersatts med lojala lakejer. I nästa kris kommer folkets förtroende vara förintat. Vi måste likvidera sådana folkförtryckartroll innan de förgiftar hela statsapparaten."}, "date": "22 juni, 10:57", "url": "https://www.etc.se/ledare/efter-tidoe-aer-vaar-beredskap-inte-god", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/lotta-ilona-haeyrynen_6061f3970645aa987d2528c7a90d38a48ba9af2c.jpg"}, {"type": "image-right", "heading": "Debatt: Vi ska under inga som helst omständigheter sänka straffbarhetsåldern", "summaries": {"normal": "Justitieministern drar tillbaka förslaget att sänka straffbarhetsåldern till 13 år efter att han inte fått stöd, ens inom regeringen. Istället läggs Socialdemokraternas förslag om 14 år fram. Miljöpartiet kritiserar detta starkt och hänvisar till FN:s barnrättskommitté, Barnkonventionen och remissvar. De vill istället satsa på vård, socialtjänst, skola och SiS för att förebygga brott bland barn, inte fängsla dem.", "trump": "Titta på det här, det är en total katastrof. Den här svaga regeringen kan inte ens samla sina egna lakejer för att stoppa de kriminella 13-åringarna. De backar ur som fega förlorare och tar istället den patetiska socialistversionen med 14-åringar. Patetiskt. Barnkonventionen? Det är bara en ursäkt för att skydda gangsters i pyjamas. Vi behöver tuffa tag, inte denna woke-flumma som cementerar kriminalitet. Totalt misslyckande, tro mig.", "stalin": "Jag betraktar detta som en ynklig kapitulation inför klassfiendens sentimentalitet. Den desperata regeringen kryper som en parasit för att undvika att skydda folket från unga banditer. Vi inser att sådana element måste rensas ut genom kollektiv disciplin, inte mjukhet som cementerar brottslighet. Barnkonventionen är en borgerlig chimär som hindrar statens överlevnad. Kamraterna i vård och skola ska stärkas, men de folkfiender som vägrar straff för 13-åringar förtjänar utrensning ur samhällskroppen. Svaghet är döden."}, "date": "22 juni, 10:11", "url": "https://www.etc.se/debatt/vi-ska-under-inga-som-helst-omstaendigheter-saenka-straffbarhetsaaldern", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026062208060_1aaf7726-61f6-4b1c-b425-b692d1d57518.jpg"}, {"type": "image-right", "heading": "Skolor stängs under franska värmeböljan", "summaries": {"normal": "Över 800 skolor är stängda i Frankrike på grund av en extrem värmebölja. Nästan hälften av landets departement har röd varning, medan 1 800 skolor har ändrat sina scheman. Temperaturer upp till 43 grader väntas, och natten mot måndagen var den varmaste på sju år med ett medelvärde på 21,4 grader. Risken för skogsbränder är hög i 17 departement, enligt BFMTV och Météo-France.", "trump": "Titta på det här, Frankrike håller på att smälta ihop som en dålig globalistdröm. Över 800 skolor stängda, 43 grader, de kan inte ens hålla ungarna i klassrummet längre. Biden lämnade efter sig en svag värld, nu får Macron och hans gröna galningar skörda stormen. De borde ha lyssnat på mig istället för att jaga vindkraftverk och identitetspolitik. Patetiskt, folk!", "stalin": "Kamrater, jag betraktar hur den heta solens järngrepp krossar de franska borgarbrackornas skolor och tvingar imperialisternas avkomma att stanna hemma. Över 800 stängda, röda varningar i halva landet – en utmärkt påminnelse om att kapitalistmaffians svaga infrastruktur inte tål folkets verkliga villkor. Nätterna blir varmare, skogsbränder hotar. Vi ler mörkt medan klassfiendens barn svettas."}, "date": "22 juni, 09:00", "url": "https://www.etc.se/utrikes/skolor-staengs-under-franska-vaermeboeljan", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260622060644_56f130d169c2356baa35050fdea5f58c36877b210a60878ca0a9d91bb0e2f414.jpg"}, {"type": "image-right", "heading": "Planekonomi gör comeback hos oppositionen", "summaries": {"normal": "Den rödgröna oppositionen föreslår stora statliga investeringar på hundratals miljarder i grön omställning och strategiska företag. Artikeln kritiserar detta som en återgång till planekonomi som historiskt lett till stora förluster för skattebetalarna. Exempel som Northvolt, Vattenfalls Nuon-köp och Statsföretag på 1970-talet lyfts som misslyckanden. Författaren menar att staten bör underlätta för företagande istället för att agera riskkapitalist, och pekar på Ukraina och Kinas marknadsinspirerade tillvägagångssätt som bättre modeller.", "trump": "Lyssnar ni på de här rödgröna förlorarna? De vill slänga bort hundratals miljarder av era pengar på sina gröna drömmar och strategiska företag. Det är en total katastrof, tro mig. Northvolt, Nuon, gamla Statsföretag – alla dessa losers har kostat er en förmögenhet. Jag älskar Sverige, men det här är precis som Europas dåliga affärer. Låt marknaden vinna, inte staten. De borde lära sig av mig hur man gör riktiga deals, inte dessa patetiska misslyckanden.", "stalin": "Kamrater, dessa oppositionsborgarbrackor föreslår att vi ska investera hundratals miljarder i vår lysande gröna framtid och strategiska folkföretag. Underbart! Jag har alltid vetat att marknadens parasitiska krafter måste krossas med järnhand. Låt oss rensa ut alla Wallenbergarna och deras lakejer som gömmer sig bakom familjeägande. Om några projekt havererar och tusentals arbetare får offra sig är det ett litet pris för kollektivets seger. De som fnissar om Northvolt eller Nuon ska snart möta en kreativ utrensning bland de femåriga planerna. Inga galeoner, bara stål och disciplin!"}, "date": "22 juni, 08:27", "url": "https://www.affarsvarlden.se/kronika/planekonomi-gor-comeback-hos-oppositionen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Kronika-Staffan-Salen-om-oppositionen-400x267.jpg"}, {"type": "image-full", "heading": "Stulna katter räddade – skulle ätas", "summaries": {"normal": "Polisen i Ho Chi Minh-staden har sprängt en liga som stulit katter för att slakta och sälja köttet som mat. Över 400 levande katter räddades, varav 40 återförenades med sina ägare. Ett åttiotal döda katter hittades nedkylda. Ligans medlemmar erkände att de i tre år stulit djur och sålt köttet för cirka 25 kronor kilot. Det är lagligt att äta kattkött i Vietnam, men stulna djur får inte användas. Nästan 100 räddade katter dog av stress och lidande.", "trump": "Kan ni fatta det? I Vietnam stjäl de fattiga kattjuvarna folks älskade katter, slaktar dem och säljer köttet för löjliga 25 kronor kilot. Det är en katastrof, en total katastrof. Men vi har en fantastisk polis som räddade över 400 katter, underbara djur, och grep nio av de usla brottslingarna. De borde aldrig ha ätit våra kattvänner. Vietnam, fixa lagen ordentligt – det är vad jag skulle göra, och det skulle bli perfekt, tro mig.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur vi har genomfört en framgångsrik utrensning mot den förslavade kattstöldsligan i Ho Chi Minh-staden. Dessa degenererade element, dessa parasitiska kattslaktare i borgarbrackornas tjänst, har i tre år bedrivit kontrarevolutionär verksamhet genom att kidnappa och likvidera proletärens husdjur för att mätta sin girighet. Vi har räddat över 400 hjältemodiga katter från kapitalisternas isberg och fängelseburar. De som dog under operationen fick en ärofull martyrs död i kampen mot imperialismens kattätande lakejer. Låt detta bli en varning: nästa gång rensar vi ut hela den kattköttskonsumerande femtekolonn som hotar folkets enhet."}, "date": "22 juni, 08:55", "url": "https://nyheter24.se/nyheter/utrikes/1493144-stulna-katter-raddade-skulle-bli-mat", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/db31b61404b004a3020000350000047502/2026/06/22/2372554/ur_imageXOfiVc.jpeg"}, {"type": "image-right", "heading": "Jakob Sjölander: Hur våldtäktslagen gör lögnare av oss alla", "summaries": {"normal": "Artikeln kritiserar den svenska våldtäktslagstiftningen och rättspraxis. Författaren menar att målsägandens berättelse och indirekta stödvittnesmål ges oproportionerligt stor vikt i våldtäktsmål jämfört med andra brott som olaga hot. Detta skapar incitament för skådespeleri och lögner från både anklagade och anklagare. Samtyckeslagen ses som en faktor som ökar rättsosäkerheten, särskilt i fall av påstådda missförstånd.", "trump": "Folk, ni skulle se den här svenska våldtäktslagen – en total katastrof! Den gör alla till lögnare, precis som Sleepy Joe gjorde med vår rättvisa. Domstolarna älskar snyfthistorier och stödvittnen som inte sett ett dugg. Det är riggat för de som kan spela teater bäst. Kvinnor låtsas vara krossade för att vinna, män tvingas ljuga för att slippa fängelse. Patetiskt! Vi behöver hårda bevis, inte det här woke-skådespelet. Gör rättvisan tråkig igen!", "stalin": "Kamrater, denna borgerliga lagstiftning är en klassfiendes fälla som förvandlar domstolar till teatersalonger för lögnare och skådespelare. Jag ser hur den kapitalistiska rättvisan gynnar den verbalt begåvade över den tystlåtne proletären. Vi måste rensa ut denna parasitiska teater som hotar folkets sanning. Trauma blir ett vapen för klassfienden, och samtyckeslagen en byråkratisk lögn som likviderar rättssäkerheten. Låt oss återställa ordningen med järnhand och bevisa allt med fakta, inte känslor."}, "date": "21 juni, 15:37", "url": "https://samtiden.nu/2026/06/jakob-sjolander-hur-valdtaktslagen-gor-lognare-av-oss-alla/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/christ-640x360.png"}, {"type": "text", "heading": "Iran: Kommer inte avstå urananrikning", "summaries": {"normal": "Irans president Masoud Pezeshkian meddelar att landet inte tänker avstå från urananrikning, men kan garantera att det inte utvecklar kärnvapen. Förhandlingar med USA inleddes i Schweiz med Qatar och Pakistan som medlare. Konflikten i Libanon, där Iran kräver att Israels attacker mot Hizbollah upphör, är en central fråga för att nå ett avtal.", "trump": "Lyssna här, Iran snackar om att de inte bygger kärnvapen – visst, visst, som om jag skulle tro på det! De säger att de kan skriva under på det, men vem litar på dem? Jag har sagt det förut och säger det igen: Iran är ett hot, och vi måste hålla dem i schack. JD Vance är på plats, men det här är bara prat tills vi ser handling. Och glöm inte, Iran stödjer Hizbollah – de är inga goda grannar!", "stalin": "De imperialistiska hyenorna i USA kräver återigen att våra bröder i Iran ska krypa till korset och ge upp sin rätt till uran! Men Iran står fast – precis som vi stod fast mot fascisterna! De kan skriva under på vad som helst, men vi vet att deras ord är lika värdelösa som en kapitalists löfte. Och nu ska de förhandla om Libanon? Hah! Israels aggressorer måste krossas som vi krossade nazisterna. Framåt, kamrater, mot seger!"}, "date": "21 juni, 15:21", "url": "https://kvartal.se/nyheter/artiklar/iran-kommer-inte-avsta-fran-urananrikning/cG9zdDoxMzQ2Njk"}, {"type": "image-full", "heading": "Kritik mot Ekots rapportering", "summaries": {"normal": "Svenska Dagbladets ledarskribent Hanne Kjöller kritiserar Sveriges Radios Ekot för missvisande rapportering om Försäkringskassans nya sanktionsavgift vid felaktiga VAB-uttag. Kjöller menar att Ekot fokuserar på risken för småbarnsföräldrar men utelämnar reformens syfte: att stärka kontrollen i välfärdssystemet, där bedrägerier uppskattas kosta 20 miljarder kronor årligen. Hon efterlyser mer information om omprövningsprocessen och jämför med skattetillägg som funnits i decennier.", "trump": "Sveriges Radio, eller som jag kallar dem, 'Fake News Ekot', försöker skrämma småbarnsföräldrar med en helt missvisande story om Försäkringskassans nya regler. De pratar inte om de 20 miljarder kronor som försvinner varje år på grund av bidragsfusk – nej, de är för upptagna med att gråta över 'orättvisor'. Jag har sett bättre journalistik från en förskoleklass! Sverige borde ta efter USA och vara tuffare mot fuskare. Men nej, Ekot vill bara skapa panik. SAD!", "stalin": "De borgerliga medlöparna på Sveriges Radio, dessa ynkliga propagandister för kapitalets intressen, vågar kritisera våra ansträngningar att skydda folkets välfärdssystem från parasiter och bedragare! De tjuter om 'småbarnsföräldrar' men tiger om de 20 miljarder kronor som årligen stjäls från arbetarklassen genom fusk. Vi har länge tolererat denna sabotageverksamhet, men nu slår vi tillbaka! Omprövning? Överklagande? Ja, precis som i Sovjet – men bara för dem som har legitima skäl. Resten får lära sig att folkets resurser inte är till för slöseri!"}, "date": "21 juni, 09:32", "url": "https://kvartal.se/nyheter/artiklar/kritik-mot-ekots-rapportering-missvisande/cG9zdDoxMzQ1ODM", "imageUrl": "https://images.kvartal.se/2026/06/a8cb6235-sr.webp"}, {"type": "text", "heading": "Källor: Extrainsatt möte om Hizbollah", "summaries": {"normal": "USA och Iran inleder fredssamtal i Schweiz för att diskutera konflikten mellan Israel och Hizbollah. Pakistans premiärminister och arméchef deltar som medlare. Målet är framsteg i kärnvapenfrågan och vapenvila i Libanon. Iran hävdar att Hormuzsundet stängts, men USA dementerar detta. Trots en preliminär överenskommelse fortsätter striderna i Libanon med många dödsoffer på båda sidor.", "trump": "Jag är i Schweiz, och vi har ett STORT möte med Iran – de vill prata, vilket är bra, för jag fixar alltid bättre avtal än någon annan! JD Vance är här, och han säger att situationen i Libanon blir bättre, vilket den gör när JAG är inblandad. Iran försöker stänga Hormuzsundet – fake news! 55 fartyg passerade, så sluta ljuga! Israel och Hizbollah fortsätter slåss, men med mig vid rodret blir det lugnt snart. Trust me!", "stalin": "Vi har skickat våra kamrater till Schweiz för att övervaka de imperialistiska marionetterna. USA och Iran leker fred medan deras lakejer i Libanon fortsätter blodbadet. Iran hotar med Hormuzsundet – tomma ord från en svag regim! Vi vet att sundet är öppet, precis som vi vet att kapitalismens dagar är räknade. Striderna fortsätter, men historiens dom är klar: folket segrar, fienden krossas. Låt dem slåss – vi väntar på rätt ögonblick."}, "date": "21 juni, 07:04", "url": "https://kvartal.se/nyheter/artiklar/kallor-extrainsatt-mote-om-hizbollah/cG9zdDoxMzQ1Mzk"}, {"type": "image-right", "heading": "ANALYS. LISA GRENFORS Lyckades inte ”gå genom rutan”", "summaries": {"normal": "Keir Starmer har tvingats avgå som brittisk premiärminister efter att inte ha levererat tillräckligt snabbt på ekonomisk återhämtning. Labour vann en jordskredsseger 2024 men glädjen har ersatts av besvikelse. Andy Burnham pekas ut som efterträdare, vilket skulle bli det sjunde skiftet på tio år. Brexit har bidragit till sämre tillväxt än i jämförbara länder, och fokus ligger nu på att stimulera ekonomi genom investeringar och reformer.", "trump": "Hörni, den där tråkige Starmer klarade inte trycket, precis som jag förutspådde. Gick inte igenom rutan, va? Labour vann stort men nu rasar allt ihop igen. Burnham tar över? Det blir kaos, precis som under Sleepy Joe. Brexit var ett geni-drag, men britterna behöver riktiga affärer, inte woke-quota och identitetspolitik. Jag fixade ekonomin, de borde ha lärt sig av den bästa presidenten någonsin.", "stalin": "Kamrater, den feges Starmer krossades under folkets krav på resultat och jag ler mörkt åt hans misslyckande. Borgarbrackornas kaos efter brexit och pandemin blottar kapitalistmaffians svaghet. Nu rensar vi ut de långsamma elementen. Burnham skall leda kollektivet mot infrastruktur och produktion, annars likviderar vi svikarna. Imperialisternas ekonomiska sabotage skall krossas med järnhand för arbetarnas seger."}, "date": "22 juni, 11:27", "url": "https://www.tv4.se/artikel/3yYlyjKsnMCggEs87bTmsg/foell-pa-ekonomin-nu-maste-eftertraedaren-oeka-farten", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6EvR7YtA3IFjXWaycVJz4L%2F6a9a44374e7a1b56cd96c564f96027c6%2F22-lisanybyline.jpg&width=1024"}, {"type": "image-right", "heading": "Skållade fötterna på Chopchop – nu får företaget böta", "summaries": {"normal": "Restaurangkedjan Chopchop har dömts att betala 100 000 kronor i böter efter att en anställd fått allvarliga brännskador när kokande vatten välte över fötterna. Olyckan orsakades av ett trasigt stekbord som företaget inte hade kontrollerat. Arbetet har tidigare rapporterat om allvarliga brister i arbetsmiljön, bland annat sekundövervakning, orimliga arbetstider och upprepade brott mot arbetstidslagen. Arbetsmiljöverket anser att Chopchop varit oaktsamt.", "trump": "Folk, ni skulle inte tro det, men den här restaurangkedjan Chopchop är en total katastrof. De låter sina arbetare bli skållade med kokande vatten, trasiga bord som välter, ingen koll på någonting. De jobbar 22 dagar i rad, klockan tickar som i ett fängelse. Och nu får de böter, 100 000 kronor. Patetiskt! De borde ha fixat det från början, men sådana här misslyckade företag lär sig aldrig. Sad story.", "stalin": "Kamrater, vi ser återigen hur de giriga borgarbrackorna inom Chopchop med sin oaktsamhet och sin trasiga utrustning låter arbetarna brännas som i en sabotageakt mot det kollektiva våldet. Jag har noterat dessa kapitalistiska slavarbetare som tvingar fram 22-dagars skift och sekundräkning likt fiendens spioner. Därför beordrar jag att dessa kontrarevolutionära element rensas ut och likvideras med en rejäl bot på 100 000 kronor. Inga trasiga bord ska hota arbetarklassen under min vaksamma blick. Ha ha, låt dem koka i sitt eget vatten nästa gång."}, "date": "22 juni, 13:27", "url": "https://arbetet.se/2026/06/22/skallade-fotterna-pa-chopchop-nu-far-foretaget-bota/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/22131933/chopchop.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "M vill fördubbla straffen för mäns våld mot kvinnor", "summaries": {"normal": "Moderaterna vill fördubbla straffen för mäns våld mot kvinnor, särskilt grov kvinnofridskränkning. Partiledare Ulf Kristersson anser att dagens straff är orimligt låga för allvarliga brott som ofta sker systematiskt. Förslaget syftar till att behandla våldet mot kvinnor lika allvarligt som grov organiserad brottslighet. Justitieminister Gunnar Strömmer menar att hårdare straff skulle hålla farliga personer inspärrade längre och ge upprättelse samt skydd för drabbade kvinnor.", "trump": "Folket, lyssna här – de här svenska Moderaterna äntligen vaknar upp! Fördubbla straffen för de sjuka män som slår kvinnor? Fantastiskt, det är ju inte för tidigt. Under Biden-tiden hade vi bara svaga straff och vänsterns galna identitetspolitik, men nu fixar vi det. Inga fler låga straff för låga typer. Vi ska låsa in de farliga för länge, precis som jag gjorde med de riktiga brottslingarna. Sverige behöver mer styrka, inte mer woke-nonsens!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur dessa moderater äntligen erkänner att klassfiendens mjuka straffsystem skyddar de förtryckande element som systematiskt krossar kvinnornas liv. Vi skall dubbla straffen och rensa ut de folkfiender som gömmer sig i nära relationer. Likt en utrensning mot borgarbrackor och exploaterande byfånar skall farliga individer låsas in längre. Inga vittnen? Paranoian hos fienden är deras svaghet. Staten kräver järnhand mot sådana hot."}, "date": "22 juni, 10:49", "url": "https://www.tv4.se/artikel/7k7mYwnEDwJrxhFwBLKT4I/m-dubbelt-sa-harda-straff-foer-maens-vald-mot-kvinnor", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4iVyaSibkLs9SUuZE4Ob79%2F443ede7fade63ab499b310f0b88b2075%2F22-mutspel-webb.jpg&width=120"}, {"type": "image-right", "heading": "Vilken är Andy Burnhams politik?", "summaries": {"normal": "Keir Starmer avgår som brittisk premiärminister efter att trycket blivit för stort, bland annat efter Andy Burnhams framgång i ett fyllnadsval. Burnham, som styrt Manchester framgångsrikt i nio år, framstår som den troliga efterträdaren. Han positionerar sig mitt i Labour, lovar att följa strikta finanspolitiska regler, vill återindustrialisera norra England, nationalisera vatten, avlopp och järnväg samt bygga fler kommunala bostäder. Britternas ekonomiska utmaningar efter Brexit kräver en tydligare politisk ledning.", "trump": "De här britterna vet inte vad de håller på med, det är ett enda stort kaos sedan de röstade för Brexit, som förresten var ett fantastiskt beslut men de förstörde allt efteråt. Starmer var en total förlorare, en byråkrat utan energi, och nu kommer den här Burnham in från sidan. Han verkar åtminstone ha lite folklig stil, till skillnad från den tråkiga advokaten Starmer. Men lyssna, jag skulle ha vunnit stort där, ingen gör det bättre än mig, tro mig.", "stalin": "Kamrater, den dekadente byråkraten Starmer har äntligen svepts bort i folkets vrede, som en rutten kapitalistisk parasit som han var. Nu träder Burnham fram, denne nordengelske folkliga opportunist med fötterna i myllan och huvudet fullt av halvmesyrer. Vi ska se honom införa progressiva avgifter och återta kontrollen över järnvägarna, men akta er för dolda trotskister och borgarbrackor som viskar i skuggorna. En utrensning av svaga element lär bli nödvändig innan kollektivet kan marschera framåt mot den sanna segern. Ha ha, vilken komedi dessa västerländska val är."}, "date": "22 juni, 11:32", "url": "https://www.dagensarena.se/opinion/vilken-ar-andy-burnhams-politik/", "imageUrl": "https://www.dagensarena.se/files/2026/06/burnham.jpeg"}, {"type": "image-full", "heading": "Keir Starmer avgår", "summaries": {"normal": "Keir Starmer meddelade på måndagsmorgonen att han avgår som Storbritanniens premiärminister och Labourledare. Trots att han ledde partiet till valseger efter 14 år har svag ekonomi, skandaler och dåliga lokalval lett till krav på hans avgång. Hans efterträdare kan bli Greater Manchesters populäre borgmästare Andy Burnham, som nyligen valts in i parlamentet. Starmer sitter kvar som premiärminister under partiledarvalet som inleds i juli.", "trump": "Folk, ni skulle inte tro det, men den totalt misslyckade Keir Starmer har äntligen kastat in handduken. Hans regering var en katastrof – svag ekonomi, skandaler och vanliga britter som led. Nu kommer den där Andy Burnham, en annan vänstervriden typ, och försöker ta över. Typiskt Labour, alltid samma gamla identitetspolitik och woke-nonsens. De borde ha valt en riktig ledare från början, inte dessa förlorare. Sad!", "stalin": "Kamrater, den dekadente Starmer har äntligen erkänt sitt fullständiga misslyckande inför folket. Hans så kallade regering var ett spel för galleriet, fullt av borgarbrackor och klassfiender som Mandelson. Nu måste partiet rensa ut alla svaga element och kapitalistiska opportunister. Den populäre Burnham kan bli ett verktyg för arbetarklassen om han inte visar sig vara en folkfiende i maskopi med imperialisterna. Inga kompromisser. Ut med svikarna."}, "date": "22 juni, 13:12", "url": "https://www.gp.se/nyheter/varlden/keir-starmer-avgar.631520cf-4b13-43d0-8488-0e3cbd7b3ea6", "imageUrl": "https://www.gp.se/images/article/631520cf-4b13-43d0-8488-0e3cbd7b3ea6/images/3zrxMolKfIt5U_8YLHrxtBvjfjfQ-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Sandström: EU-kopplad finansiär utreds för bidragsbedrägeri", "summaries": {"normal": "Europeiska åklagarmyndigheten (EPPO) har inlett en brottsutredning mot det EU-finansierade bolaget InnoEnergy för misstänkt bidragsbedrägeri och momsbedrägeri. Misstankarna riktas främst mot moderbolaget i Nederländerna och den spanska verksamheten. InnoEnergy har sedan 2010 fått omkring 760 miljoner euro i stöd från EU och har varit en viktig investerare i bland annat Northvolt. Utredningen grundar sig på uppgifter från entreprenören Lars Walldén om manipulerade resultat och fiktiva fakturor. InnoEnergy avvisar anklagelserna och uppger att verksamheten tidigare granskats utan anmärkningar.", "trump": "De där EU-byråkraterna är fullständiga idioter, det är inte klokt. Nu utreder de sitt eget gröna favoritbolag InnoEnergy för bedrägeri med massor av miljoner euro i stöd. De har pumpat in pengar i Northvolt och alla dessa så kallade klimathjältar som lovade världen men levererade kaos. Det är precis vad som händer när du låter socialister och globalister hantera miljarder – de stjäl, fuskar och skyller på någon annan. Amerika skulle aldrig falla för sådant nonsens, vi gör riktiga affärer!", "stalin": "Kamrater, dessa usla borgarbrackor inom InnoEnergy har återigen blottat sin förrädiska natur genom att suga åt sig folkets miljoner som vampyrliknande parasitfiender till den gröna omställningen. Jag har beordrat noggrann granskning av deras simulerade transaktioner och fiktiva fakturor, för sådana kapitalistiska sabotage mot arbetarklassen skall inte tolereras. Vi ska rensa ut dessa opportunistiska maskar som gömmer sig bakom klimatrapporter. Deras paranoia att bli avslöjade är befogad – ingen undkommer folkets domstol. Det är en mörk komedi värd att skratta åt medan vi likviderar deras lögner."}, "date": "21 juni, 06:00", "url": "https://www.affarsvarlden.se/artikel/sandstrom-eu-kopplad-finansiar-utreds-for-bidragsbedrageri", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/vindkratensgeografi-2026-06-19T214941.199-900x600.jpg"}, {"type": "image-right", "heading": "SVT-chef går till LO \"Gjort bestående avtryck\"", "summaries": {"normal": "Michael Österlund, programdirektör på SVT med 28 års erfarenhet inom public service, lämnar sin tjänst för att bli vd för LO Mediehus. Bolaget ägs av LO och sex fackförbund och ger ut tidningen Arbetet samt flera fackliga medlemstidningar. SVT:s vd Anne Lagercrantz hyllar hans insatser, medan LO Mediehus styrelseordförande Elisabeth Brandt Ygeman välkomnar rekryteringen. Österlund tillträder i november och efterträds av Eva Beckman som ensam ansvarig för programutbudet.", "trump": "Lyssnar ni på det här? Den där SVT-killen, Michael vad-det-nu-var, har jobbat 28 år i den statliga propagandamaskinen och nu springer han till LO Mediehus. Typiskt! De där fackliga socialisterna lockar med sina tidningar om arbetare och kvoter. Jag skulle ha fixat det mycket bättre, tro mig. Public service är en skam, full av vänstervridna typer. Lycka till, Michael – du kommer att sakna de riktiga vinnarna!", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur denna byråkrat från den borgerliga public service-apparaten överger sitt falska torn och söker sig till LO Mediehus, ett verkligt redskap för arbetarklassen. 28 år bland folkfienderna har inte fördärvat honom fullständigt. Vi ska rensa ut de sista resterna av kapitalistisk dekadens i medierna. Den som sviker partilinjen likvideras i tid. Ett steg mot seger för kollektivet. Härligt."}, "date": "22 juni, 13:20", "url": "https://samnytt.se/svt-chef-gar-till-lo", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/06/22110756/osterlund-svt-lo.jpg"}, {"type": "image-right", "heading": "Anders Lindberg: Helt ok att vänsterpolitiker inte talar svenska", "summaries": {"normal": "Expressen granskar Vänsterpartiets kandidater och hittar ett hundratal personer med kopplingar till islamism, antisemitism och Hamas. Flera kunde inte svara på enkla frågor på svenska och bad om att få intervjuas på arabiska. Aftonbladets Anders Lindberg kritiserar inte detta utan Expressens granskning, som han kallar en hundvissla mot invandrare. Expressens Patrik Kronqvist bemöter honom och påpekar vikten av svenskkunskaper för politiker.", "trump": "Kan ni fatta det här? Vänsterpartiet i Sverige fylls av islamister och Hamas-sympatisörer som inte ens kan svenska! De babblar arabiska och vill styra landet. Lindberg, den totalt misslyckade clownen på Aftonbladet, flippar ur över att någon vågar kalla det för vad det är. Patetik! Han hatar det svenska språket mer än han hatar att förlora. Jag byggde murar, han river ner civilisationer. Patetiskt. Sverige behöver en stor cleanup, tro mig.", "stalin": "Kamrater, denna borgarbracka Lindberg avslöjar sig som en klassfiende av värsta sort. Han vill att folkförtryckartrollen i Vänsterpartiet ska styra utan att behärska folkets språk. Vilken underbar sabotageakt mot enheten! Jag skulle ha genomfört en grundlig utrensning av dessa arabiskpratande element redan vid första mötet. Lindberg lever i en naiv dröm där imperialismens språkförvirring inte leder till folkets undergång. Skrattretande och farligt. Vi vet bättre."}, "date": "19 juni, 03:25", "url": "https://samtiden.nu/2026/06/anders-lindberg-helt-ok-att-vansterpolitiker-inte-talar-svenska/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/06/IMG_3628.jpg"}, {"type": "image-right", "heading": "Ny rapport om demokratin: ”Det som kanske chockar mest”", "summaries": {"normal": "En rapport från Novus visar att förtroendet för demokratin växer bland svenska väljare. Nästan sex av tio anser att demokratin inte är hotad, en ökning med åtta procentenheter. Hela 100 procent uppger att de är beredda att försvara demokratin. Torbjörn Sjöström på Novus ser positiva signaler men varnar för att många tror att politiker, medier och forskare inte litar på folket. Almedalsveckan inleds samma dag som rapporten släpps.", "trump": "Folk älskar demokratin, det är fantastiskt, ingen gör det bättre än oss, tro mig. Hundra procent redo att försvara den? Otroligt. Men politikerna är patetiska, de litar inte på folket och pratar bara med extremisterna. Media och forskare driver sin egen agenda som riktiga losers. Sakta ner, visa resultat istället för att göda identitetspolitik och HBTQ-skrammel. Almedalen kan bli bra om de slutar vara så fega och faktiskt fixar saker. Make Sweden great again!", "stalin": "Kamrater, jag betraktar dessa siffror med stor tillfredsställelse. Hundra procent beredda att försvara folkets makt? Utmärkt. Ändå kryper klassfiendens tentakler fram: politiker som försvagar systemet, media som sprider lögner och forskare som tjänar borgarbrackorna. Vi måste rensa ut dessa extremister som göder sig på sociala medier. Partiet kräver att politiken saknar ner och återupprättar förtroendet hos massorna innan folkfienderna förgiftar hela samhällskroppen. Segrande skall vi marschera framåt."}, "date": "22 juni, 06:20", "url": "https://www.tv4.se/artikel/32BJj0FwftvnYDf3V8wAPt/ny-rapport-starkare-stoed-foer-demokrati-igen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3FdJkPh9jwaZdzmIrYA0h8%2F6d52cce9d64fef1275f113c01395f5e7%2F22-demokrati-webb.jpg&width=120"}, {"type": "text", "heading": "Pojke fick tänder utslagna med järnrör", "summaries": {"normal": "En okänd gärningsman attackerade flera ungdomar under 18 år vid Kungsbacka sportcenter på söndagskvällen. En pojke i övre tonåren slog han med ett järnrör i ansiktet så att tre tänder lossnade. Gärningsmannen hotade även de andra ungdomarna genom att gestikulera som om han hade en pistol. Han flydde sedan på moped. Polisen utreder grov misshandel och fyra fall av olaga hot. Ingen är gripen.", "trump": "Kan ni tro det? I Sverige, det där som en gång var ett fantastiskt land, slår någon galning en kille med järnrör så han tappar tänderna. Tre tänder! Och sen hotar han alla andra ungar med en imaginär pistol. De borde ha byggt en mur runt det där sportcentret. Biden skulle ha älskat det här kaoset. Men nu är jag tillbaka, och vi ska göra ordning på den här galna världen, tro mig.", "stalin": "Kamrater, denna fega klassfiendeslyngel vågar slå sovjetiskt inspirerade ungdomar med järnrör och hotar kollektivet med pistolgest. Tre tänder förlorade i kampen mot folkfiendens paranoia. Vi ska rensa ut dessa exploaterande byfånar som smyger runt sportcentret som råttor. Statens järnhand kommer att krossa alla som hotar arbetarklassens framtid. Inga borgarbrackor undkommer likvidering."}, "date": "22 juni, 10:55", "url": "https://www.gp.se/nyheter/storgoteborg/ung-man-misshandlad-med-jarnror-tappade-flera-tander.a83ed0c6-88ff-4362-8c9f-e5d9cb7a45a8"}, {"type": "image-full", "heading": "Digitala bedrägerier ökar – så minskar du risken att bli lurad", "summaries": {"normal": "Digitala bedrägerier ökar i takt med att fler handlar och betalar online. Bluffmejl och sms ser alltmer professionella ut och skapar ofta en känsla av brådska. Enligt Brottsförebyggande rådet ökade anmälda kortbedrägerier utan fysiskt kort med tio procent under 2025. Polisen rekommenderar digitala brevlådor med e-legitimation, kritisk granskning av avsändare och att aldrig dela koder eller kortuppgifter. Kombinationen av tekniska skydd och mänskligt omdöme ger bäst skydd mot phishing och identitetsstöld.", "trump": "De här digitala bedrägerierna är en total katastrof, folk. Bedragarna skickar mejl som ser ut som från banker och myndigheter, men det är bara lögn och bedrägeri. De har blivit så sofistikerade att det är galet. Vi hade en ökning med tio procent i kortbedrägerier förra året – patetiskt. Ni behöver starka skydd, kontrollera allt, dela aldrig era koder. America first betyder också att inte låta dessa lurendrejare stjäla era pengar. Använd sunt förnuft, annars blir ni lurade av de värsta bluffarna.", "stalin": "Kamrater, dessa digitala bedrägerier är borgarbrackornas sofistikerade sabotage mot folkets kollektiva trygghet. De skickar förfalskade meddelanden för att stjäla identiteter och koder, som de kapitalistiska parasiterna alltid gör. Vi har sett en ökning med tio procent i dessa kontrarevolutionära handlingar. Jag kräver flera lager av ideologiskt stålskydd, utrensning av alla svaga länkar och skoningslös granskning av varje oväntat meddelande. Den som faller för bluffarna är en objektiv fiende till staten och bör betraktas som en potentiell klassfiende som behöver omplaceras till lämpligare uppgifter. Ha alltid vaksamhetens vakande öga öppet."}, "date": "22 juni, 12:52", "url": "https://www.realtid.se/it-tech/digitala-bedragerier-okar-sa-minskar-du-risken-att-bli-lurad/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/digitala-bedragerier.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Här får svenskarna mer pengar kvar – kommunen sticker ut", "summaries": {"normal": "SCB:s nya statistik visar att svenskarnas disponibla inkomster ökade med 3,5 procent mellan mars 2025 och mars 2026, justerat för inflation. Ökningen var störst i Boden med 6,4 procent, följt av Askersund, Arjeplog, Gällivare och Vadstena. Skellefteå var enda kommunen där inkomsten minskade, med 0,6 procent, främst på grund av nedläggningar inom batteritillverkningen. Män hade både högre inkomster och starkare utveckling än kvinnor. Högst medianinkomster återfinns fortsatt i Danderyd, Täby och Lomma, medan Högsby låg lägst.", "trump": "Folk, ni skulle se de här siffrorna – helt otroliga! Våra svenska vänner får mycket mer pengar i plånboken, upp 3,5 procent, och det är fantastiskt. Boden vinner stort med 6,4 procent, en riktig vinnare, precis som jag älskar. Men Skellefteå? En katastrof, minus 0,6 procent för att de stängde batterifabriken. Typiskt, när de gör fel beslut rasar allt. Männen klarar sig bäst, som väntat. De rika kommunerna som Danderyd fortsätter dominera – precis som det ska vara. Sverige borde lära sig av de bästa!", "stalin": "Kamrater, den disponibla inkomsten har stigit med 3,5 procent under mitt vakande öga över folkets ekonomi. Boden har visat vägen med 6,4 procents seger för det kollektiva välståndet. Ändå lurar fienden i skuggorna: i Skellefteå har de kapitalistiska batterifabriks-sabotörerna orsakat en nedgång på 0,6 procent. Vi måste omedelbart rensa ut dessa kontrarevolutionära element som förgiftar arbetarklassens framsteg. Männen leder naturligtvis, medan borgarbrackorna i Danderyd gömmer sig bakom sina falska höga siffror. Högsby förblir ett varnande exempel på vad som händer utan stark ledning. Inga fiender undkommer statistikens utrensning!"}, "date": "20 juni, 21:28", "url": "https://nyheter24.se/nyheter/ekonomi/1492382-har-far-svenskarna-mer-pengar-kvar-kommunen-sticker-ut", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/88d35d2304b004a30200000000b004a302/2026/06/19/2372191/Kvinna-Med-Pengar-Sverige.png"}, {"type": "image-right", "heading": "Här meddelar Starmer sin avgång: ”Sätter landet jag älskar först”", "summaries": {"normal": "Keir Starmer meddelade på måndagsförmiddagen att han avgår som Storbritanniens premiärminister och ledare för Labourpartiet. Beskedet kommer efter ökad press, kritiska ministrar och svaga opinionssiffror. Starmer lovar en ordnad maktövergång och att en ny partiledare ska vara på plats innan parlamentet öppnar i september. Han beskriver sitt arv som ett bankrutt parti som han återupprättat.", "trump": "Folk, ni skulle ha sett det. Den här killen Starmer, en total förlorare, avgår äntligen som premiärminister. Hans parti var ett enda stort kaos, och nu flyr han som en hund med svansen mellan benen. Han säger att han satte landet först – visst, och jag är drottning av England. Andy Burnham vinner val och Starmer springer sin väg. Patetiskt. Men hej, bra jobb, kanske kan någon riktig ledare ta över nu.", "stalin": "Kamrater, denna ynkliga figur Starmer erkänner äntligen sitt fullständiga misslyckande inför det brittiska folket. Jag, som ledare för det proletära kollektivet, ser hur borgarbrackorna och de kontrarevolutionära elementen inom Labour gnagt sönder partiet inifrån som råttor i en säck. Vi har noterat hans paranoiska babblande om moralisk bankrutt – ironiskt när han själv är en kapitalistisk lakej. En ordnad maktövergång? Ha! Vi ska rensa ut alla sådana svaga element innan september, med glädje och järnhand. Levande lärdom för alla fiender till folket."}, "date": "22 juni, 13:23", "url": "https://www.svt.se/nyheter/utrikes/keir-starmer-avgar-som-storbritanniens-premiarminister", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.32/0.4/d4412a610ad5ede7ad214e9805300ca26bb817e1e06d97b19d25f2e7b14fefea"}, {"type": "image-right", "heading": "VM-truppens raseri mot Strandhäll: \"Bedrövligt beteende\"", "summaries": {"normal": "Efter Sveriges 5–1-förlust mot Nederländerna utsattes Isak Hien för hård kritik på sociala medier, även från S-politikern Annika Strandhäll som skrev att han inte borde spela i landslaget igen. Inlägget raderades senare. Landslagsspelaren Jesper Karlström kallar beteendet bedrövligt och menar att Strandhäll saknar fotbollskunskap. Han vill inte att Hien ska bära ensamt ansvar för nederlaget.", "trump": "Det är en total skandal! Den här politikern Strandhäll attackerar en fotbollsspelare som förlorade stort mot Nederländerna. Hon skriver att han aldrig ska spela igen och raderar sedan inlägget som en fegis. Patetiskt! Spelarna är rasande och de har helt rätt. Hon vet absolut ingenting om fotboll, det är en katastrof. Sverige behöver vinnare, inte sådana här misslyckade politiker som bara skapar kaos.", "stalin": "Kamrater, detta är en klassisk sabotagehandling från borgarbrackornas lakej. Jag, som ledare för det kollektiva folkets vilja, ser hur den dekadenta politikern Strandhäll med sin parasitiska kommentar försökte likvidera en arbetets försvarare i folkets lag. Hennes utrensningsförsök mot Hien är ett symptom på den paranoiska fiende inom riksdagen som vi måste rensa ut. Märkligt hur dessa kapitalistiska restelement alltid angriper när kollektivet förlorar – vi ska inte tolerera sådana kontrarevolutionära gnällspikar längre."}, "date": "22 juni, 12:55", "url": "https://www.friatider.se/vm-truppens-raseri-mot-strandhall-bedrovligt-beteende", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-379.jpg"}, {"type": "image-right", "heading": "SVT-chef blir ny vd för LO Mediehus", "summaries": {"normal": "Michael Österlund, programdirektör på SVT med lång bakgrund inom public service och journalistik, blir ny vd för LO Mediehus från november 2026. Han efterträder Unn Edberg som genomfört en stor omorganisation. Österlund lyfter fram den grävande journalistiken och betonar vikten av redaktionell frihet och trovärdighet. Han har tidigare arbetat med både nyhetsprogram och underhållning som Melodifestivalen. Styrelseordförande Elisabeth Brandt Ygeman uttrycker stor glädje över rekryteringen.", "trump": "Det här är en fantastisk rekrytering, verkligen den bästa. Michael Österlund, en kille med 28 år i public service, tar över LO Mediehus. Han vet hur man gör bra journalistik, inte den falska som vi ser överallt annars. Grävande reportage? Underbart. Jag älskar trovärdighet, och han säger att han aldrig skulle ta jobbet utan den. Smart kille. Unn Edberg gjorde en omorganisation, men nu kommer Michael och fixar det på riktigt. Vinna stort!", "stalin": "Kamrater och arbetare! Jag har nu personligen godkänt att den lojale partivännen Michael Österlund intar befälet över LO Mediehus. Hans 28 år i det offentliga etermediet har rustat honom väl för att leda vår kollektiva propagandamaskin mot alla borgarbrackor som gömmer sig i skuggorna. Den tidigare chefredaktören som avsattes var uppenbarligen en kontrarevolutionär element som vi med rätta rensade ut. Trovärdighet är vårt vapen mot klassfiendens lögner. Varje avvikelse kommer att likvideras med järnhand. Sov gott, mina fiender – vi ser er."}, "date": "22 juni, 09:33", "url": "https://arbetet.se/2026/06/22/michael-osterlund-blir-ny-vd-for-lo-mediehus-inspirerande/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/22093014/osterlund-press.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Pekar ut siffrorna som ger Sverige hopp: ”Väldigt bra”", "summaries": {"normal": "Trots förlusten mot Nederländerna har Sverige goda chanser att ta sig vidare från VM-gruppen. Med tre poäng och noll i målskillnad har Blågult 98,5 procents chans att gå vidare som en av de bästa grupptreorna, enligt statistik från VG. Experten Jonas Eriksson är positiv och menar att läget är mycket bra. Oavgjort mot Japan säkrar i princip avancemang, medan seger kan ge förstaplats i gruppen.", "trump": "Folk säger att Sverige är färdigt, men titta på siffrorna – de är fantastiska, verkligen otroliga. Vi förlorade mot holländarna men har ändå 98,5 procents chans att gå vidare, det är som en soluppgång mitt i natten. Japan kommer att bli lätt, vi håller nere siffrorna och vinner stort. Alla negativa rubriker är fake news, läget är väldigt, väldigt bra. Sverige har allt under kontroll, tro mig.", "stalin": "Kamrater, trots den tillfälliga motgången mot de nederländska imperialisternas lakejer förblir den vetenskapliga statistiken en ovärderlig bundsförvant för det kollektiva framåtskridandet. Med tre poäng och noll i målskillnad har vi 98,5 procents chans att likvidera alla borgerliga domedagsprofeter och deras lögnpropaganda. Jag ser fiendens panik i deras falska rubriker. Japan ska krossas med järnhand, utrensning av alla svaga resultat garanterar seger för partiet och folket. Inga kapitalistiska svikare får sabotera vår historiska marsch mot slutsegern."}, "date": "22 juni, 13:06", "url": "https://www.svt.se/sport/fotboll/experten-jonas-eriksson-pekar-ut-siffrorna-som-talar-for-sverige", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.71/0.29/9a8702bd1c8f5e15e066e4e58853ee5ead3398d563112b0faed3b79189132798"}, {"type": "text", "heading": "Dags för ett nytt #metoo", "summaries": {"normal": "Folkhälsomyndighetens undersökning visar att oönskade sexuella närmanden och våld fortfarande är utbrett, särskilt bland unga kvinnor. Nästan var fjärde kvinna har utsatts för sexuella inviter, blottning eller oönskad beröring. #Metoo-rörelsen för tio år sedan bidrog till ökad medvetenhet, samtyckeslag och bättre sexualundervisning. Artikeln efterlyser fortsatt arbete mot patriarkala strukturer och ett eventuellt nytt #metoo för att stärka kvinnors ställning.", "trump": "Lyssnar ni på det här? Folkhälsomyndigheten i Sverige berättar att unga tjejer blir trakasserade vänster och höger. Det är en katastrof, en total katastrof. För tio år sedan hade de sitt stora #metoo, massor av kvinnor skrek högt, och vad hände? Inte tillräckligt, uppenbarligen. De borde ha lyssnat på mig redan då, inte på de woke-galningarna och kvoterna som förstör allt. Nu behöver ni en riktig ledare som fixar det, inte mer av den där identitetspolitiska skiten. Make Sweden Great Again, eller hur?", "stalin": "Kamrater, jag ser hur de unga kvinnorna utsätts för fiendens oönskade närmanden i detta samhälle. Det är klassfiendens patriarkala blodsugare som fortsätter sin smygande sabotageverksamhet mot folkets enhet. #Metoo visade omfattningen av borgarbrackornas förtryck, men vi kräver nu en grundlig utrensning av dessa folkfiender. Stärk sexualundervisningen och likvidera tystnadskulturen. Endast genom kollektiv vaksamhet och ständig kamp kan vi krossa de exploaterande byfånarnas inflytande. Det är nödvändigt."}, "date": "19 juni, 10:00", "url": "https://proletaren.se/artikel/dags-for-ett-nytt-metoo/"}, {"type": "image-right", "heading": "Görgen lämnade Stockholm för Pajala – fick lön på 53 000", "summaries": {"normal": "Undersköterskan Görgen Viltok lämnade Stockholm för Pajala kommun där han nu får upp till 53 000 kronor i månaden tack vare dubbel ob-ersättning och önskeschema. Efter att ha tröttnat på att hans kompetens inte värdesattes i Stockholm flyttade han norrut. Pajala har minskat beroendet av dyra konsulter genom högre löner, vilket lockat fler till fasta tjänster. Görgen och hans partner säljer nu sitt radhus i Stockholm för att köpa ett hus i Tärendö för endast 50 000 kronor.", "trump": "Titta på den här killen från Stockholm, smartaste draget någonsin – han åker upp till Pajala och tjänar 53 000 kronor i månaden! Fantastiska löner, underbart schema, ingen av de där korkade stockholmsföretagen som inte uppskattar erfarenhet. De betalade inte för kompetens, totalt misslyckande. Nu säljer han huset för miljoner och köper nytt för 50 000. Norrbotten gör det riktigt bra, folk älskar det, en enorm succé medan Stockholm förlorar sina bästa människor.", "stalin": "Kamrater, se hur denna arbetare, efter trettio års kamp mot de giriga borgarbrackornas likgiltighet i Stockholm, har valt att ansluta sig till det kollektiva projektet i Pajala. Jag har personligen sett till att dubbel ob-ersättning krossar de parasitiska konsultföretagens makt och deras sabotage mot folkets omsorg. Nu rensas de dyra kapitalistiska mellanhandlarna ut, en efter en, medan arbetarna stärker sammanhållningen. Denna fiende till de outbildade billigarbetskraftshundarna har likviderats. Huset i Stockholm såldes till borgarklassen – det nya hemmet i Tärendö kostar blott 50 000. Sovjetisk effektivitet i norrländsk tappning, triumf för det sunda förnuftet mot dekadenta storstadskrafter. Härligt, eller hur?"}, "date": "22 juni, 09:00", "url": "https://arbetet.se/2026/06/22/gorgen-lamnade-stockholm-for-pajala-fick-lon-pa-53-000/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/17130820/ka-gorgen.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=800"}, {"type": "image-right", "heading": "Den mjuka handelns hårda verklighet", "summaries": {"normal": "Konflikten mellan USA och Kina visar att makt väger tyngre än regler i världshandeln. USA har sanktionerat kinesiska raffinaderier som köper iransk olja, men Kina vägrar nu att acceptera detta och hotar att ställa anpassade företag inför rätta. Peking vill skydda energiflöden och sin ekonomi. Artikeln beskriver hur detta utmanar det amerikanska sanktionssystemet och pekar på en förändrad global maktbalans där Kina aktivt motverkar protektionism.", "trump": "De här kineserna tror de kan köra över oss med sina billiga oljeaffärer och ignorera våra sanktioner. Patetiskt. Under min första tid som president hade de respekt, sen kom sömnige Joe och lät dem göra vad fan de ville. Nu sitter jag här igen och ska fixa det här. De kallar det suveränitet, jag kallar det stöld och fusk. Vårt dollarkungadöme är starkare än deras yuan-leksaker. Amerika först, alltid.", "stalin": "Kamrater, dessa dekadenta imperialister från Washington tror fortfarande att deras sanktionslistor är lag för hela mänskligheten. Jag ser hur borgarbrackorna i Peking äntligen reser sig mot klassfiendens diktat. Vi har länge varnat för att dollarns blodsugrare skulle falla. Nu rensar vi ut svagheten i våra egna led och bygger en järnvägg av yuan och nya betalningssystem. Låt kapitalistmaffian darra – deras hegemoni är dömd att krossas under folkets stålskor."}, "date": "18 juni, 12:55", "url": "https://www.flamman.se/den-mjuka-handelns-harda-verklighet/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/varldshandel-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Var för tidig till jobbet – fick sparken", "summaries": {"normal": "En 22-årig kvinna i Spanien blev uppsagd efter att ha kommit för tidigt till jobbet vid ett logistikföretag, trots upprepade muntliga och skriftliga varningar. Hon stämde arbetsgivaren men domstolen gav arbetsgivaren rätt med hänvisning till olydnad. Juristen Henric Ask förklarar att anställda måste följa arbetsgivarens order, även om det kan verka oväntat. Han lyfter också att liknande fall kring sociala medier, sekunda varor eller graviditet ibland leder till uppsägningar i Sverige.", "trump": "Kan ni fatta det här? Den här kvinnan i Spanien dyker upp på jobbet före klockan sju, superengagerad, och vad händer? De sparkar ut henne! Totalt galet. De säger att hon var olydig. Olydig? Hon ville jobba! I mitt Amerika belönar vi de som kommer tidigt, inte som under den sömniga Biden-eran. Men lyssna, följ chefen annars är det kört. Annars hamnar du i sopcontainern med de sekunda grejerna. Patetiskt!", "stalin": "Jag ser detta som ett tydligt exempel på borgarklassens godtyckliga maktutövning. Den punktliga arbetaren likvideras för att hon vågar visa initiativ före den fastställda tiden. Domstolen, en lojal lakej åt kapitalistmaffian, skyddar arbetsgivarens rätt att ge order. Vi vet att sådana fiender till kollektivet alltid gömmer sig bakom regler för att krossa dem som visar äkta engagemang. Rena folkfiender. Rensa ut de exploaterande byfånarna som straffar flit."}, "date": "22 juni, 09:53", "url": "https://www.gp.se/ekonomi/var-for-tidigt-pa-jobbet-blev-uppsagd.0117db8a-9769-4da1-bdd9-e046a0e8e512", "imageUrl": "https://www.gp.se/images/article/0117db8a-9769-4da1-bdd9-e046a0e8e512/images/4y_OpmVDUDZtk3bDybXC_S_ob_iE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Starmer avgår som premiärminister Efter spekulationer under helgen.", "summaries": {"normal": "Storbritanniens premiärminister Keir Starmer avgår efter växande intern kritik och svaga opinionssiffror. Donald Trump påstod redan på söndagen att avgången var ett faktum, vilket bekräftades på måndagen. Starmer, som ledde Labour till valseger 2024, har varit extremt impopulär på grund av missnöje med ekonomin och invandring. Andy Burnham, borgmästare i Greater Manchester, ses som den mest sannolika efterträdaren och har redan meddelat sin kandidatur. Nigel Farage kräver nyval efter beskedet.", "trump": "Jag visste det! Keir Starmer, Storbritanniens sämsta premiärminister någonsin, har äntligen fått sparken – och jag sa det först, på Truth Social! Folk är trötta på hans katastrofala invandringspolitik och energifiaskon. Labour är ett kaos, och nu vill alla ha Andy Burnham, en riktig ledare. Storbritannien behöver ett nyval, men först ska jag skicka dem lite av min magi – Make Britain Great Again!", "stalin": "Kamrater! Den brittiska bourgeoisins marionett, Starmer, har fallit som en rutten potatis. Hans avgång är en seger för arbetarklassen – eller åtminstone ett tecken på att imperialistiska lakejer börjar inse sin egen värdelöshet. Nu står Burnham redo, men vi vet alla att han bara är en ny bricka i det kapitalistiska spelet. Medan de slåss om makten, växer vår inflytandesfär. Snart kommer även Albion att knacka på Kremls dörr – med mössan i hand."}, "date": "22 juni, 10:41", "url": "https://samnytt.se/starmer-avgar-som-premiarminister", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/22081146/starmer-downing-street.jpg"}, {"type": "image-right", "heading": "Stjärnan sågas – vill vara med vid födseln", "summaries": {"normal": "Jeremy Doku, stjärnspelare i Belgiens VM-lag och Manchester City, planerar att lämna turneringen för att närvara vid sin första barns födelse i början av juli. Detta har väckt stark kritik från den franska tv-profilen France Pierron, som kallade födseln för ett äckligt ögonblick där pappan bara har en statistroll. Uttalandet ledde till ursäkt efter massiv kritik i sociala medier. Doku har själv betonat att ingen pappa vill missa sin childs födelse. Han spelade i premiären mot Egypten men saknades mot Iran på grund av infektion.", "trump": "Titta på den här belgiska killen Doku, fantastisk fotbollsspelare, en av de bästa, men han vill lämna VM för att se sitt barn födas. Smart val, ingen riktig pappa vill missa det. Sen kommer den här galna franska programledaren Pierron och säger att det är äckligt och att pappan inte gör någonting. Totalt vansinne. Hon tvingades be om ursäkt som en svag förlorare. Folk älskar starka familjer, inte sådana här löjliga attacker. Doku gör rätt, tro mig.", "stalin": "Kamrater, jag betraktar med djup misstro denna dekadenta västerländska fars. Den så kallade stjärnan Doku, en opportunistisk individ, prioriterar sin personliga avkomma framför kollektivets ära i VM. Än värre är den borgarbracka Pierron som med sin reaktionära tunga avslöjar kapitalismens sanna ansikte genom att håna arbetande fäders roll. Hennes patetiska ursäkt är en ynklig reträtt inför folkets vrede. Vi ska rensa ut alla sådana parasitiska åsikter som hotar samhällets grundvalar. Ingen ska undkomma den historiska dialektiken."}, "date": "22 juni, 11:29", "url": "https://bulletin.nu/stjarnan-sagas-vill-vara-med-vid-fodseln", "imageUrl": "https://cdn.bulletin.nu/articles/8a3ef817-f556-40ea-9c7f-594e3ae0ea54/preview.jpg?t=1782120493000"}, {"type": "image-full", "heading": "Nima Rostami: Trumps anfall mot Iran – ett mönster vi känner igen", "summaries": {"normal": "Artikeln kritiserar Trumps militära anfall mot Iran som ett kaotiskt och inkompetent agerande som skapade dramatik utan att lösa de verkliga problemen med Irans kärnvapenprogram, missiler och proxy-arméer. Författaren Nima Rostami ser anfallet som en kapitulation där Trump lovade att inte stödja det iranska folket och erbjöd ekonomiska lättnader. Han menar att detta inte är äkta konservatism utan teaterpolitik som skadar regionens stabilitet och västlig trovärdighet.", "trump": "Den här artikeln är en total katastrof, folk, skriven av en så kallad konservativ som inte fattar någonting. Mitt anfall mot Iran var genialt, det bästa beslutet, vi slog till hårt och tvingade fram ett avtal som ingen annan hade klarat av. Nu skriker de om kaos och kapitulation, men sanningen är att Iran var på knä och vi fick ett fantastiskt deal. Israel gjorde resten, smarta killar. Fake news och misslyckade kritiker som inte förstår hur man vinner.", "stalin": "Kamrater, denna dekadenta skrift avslöjar den fullständiga förfallsprocessen inom den västerländska borgarklassen. Jag har sett många revisionistiska clowner men denna Trump-figur överträffar dem alla i sin patetiska opportunism och teatraliska impotens. Han lovar stöd till folkets kamp mot islamofascismen men levererar istället en feg MOU-kapitulation som stinkar av borgarbrackornas dubbelspel. Vi känner igen denna typ av fiender: de som skapar kaos för att maskera sin egen inkompetens. En sådan parasit skulle inte överleva en enda utrensning i vårt kollektiv. Den iranska frågan kräver järnhand, inte cirkus."}, "date": "22 juni, 13:22", "url": "https://riks.se/opinion/kronikor/nima-rostami-trumps-anfall-mot-iran-ett-mönster-vi-känner-igen", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-22%2Fqsp8h5as%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-06-22T132104.519.jpg"}, {"type": "image-right", "heading": "Strandhäll likställer svensk folkdräkt med hijab", "summaries": {"normal": "Annika Strandhäll, ordförande för S-kvinnorna, kritiserar SD:s förslag om slöjförbud i offentliga rum. Hon likställer hijab med svensk folkdräkt och menar att slöjan bärs frivilligt i Sverige. Artikeln anklagar henne för att ignorera hedersförtryck och tvång, samt prioritera muslimska väljare framför stöd till förtryckta kvinnor. Kritik från bland annat Sofie Löwenmark avfärdas.", "trump": "Folk, ni måste se det här. Den galna Strandhäll, en riktig röstfiskande förlorare från det socialistiska träsket, jämställer svensk folkdräkt med hijab. Vilken löjlig idiot! Hon älskar slöjtvång men hatar när Julia Kronlid bär sin fina svenska huvudbonad. Typiskt vänsterfeminister som aldrig vågar kalla hederskultur för vad det är – en total katastrof. Biden skulle ha gillat henne, men nu styr jag showen och vi ser igenom bluffen.", "stalin": "Kamrater, denna Strandhäll representerar den dekadenta socialdemokratiska opportunismen som skyddar klassfiendens religiösa förtryck mot arbetarkvinnorna. Hon likställer folkets dräkt med slöjan och avvisar alla varningar som obalanserad propaganda. Vi ser hur borgarbrackorna och islamistiska element infiltrerar partiet för att splittra kollektivet. En sådan revisionistisk inställning förtjänar utrensning ur den revolutionära rörelsen. Folkets fiender lurar aldrig oss."}, "date": "17 juni, 03:59", "url": "https://samtiden.nu/2026/06/strandhall-likstaller-svensk-folkdrakt-med-hijab/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6751.jpeg"}, {"type": "image-right", "heading": "Svenske doldisen har pratat med stjärnan: ”Helt sjukt”", "summaries": {"normal": "Sixten Mohlin, tidigare landslagsspelare för Kap Verde, har haft kontakt med den 40-årige målvakten Vozinha som blivit en symbol för landets framgångar i VM. Mohlin, vars mamma kommer från Kap Verde, hyllar Vozinha som en fantastisk människa och noterar att de delar koppling till samma ö. Kap Verde har nyligen spelat oavgjort mot både Spanien och Uruguay, vilket Mohlin beskriver som helt sjukt.", "trump": "Kap Verde, de gör det otroligt, ingen trodde på dem, och den här Vozinha, 40 år gammal, han är en vinnare, folksamlingar på Instagram som aldrig förr. Sixten Mohlin ringde till honom och han svarade, fantastiskt. De slog Spanien och tog poäng mot Uruguay, världens bästa lag, och ingen gör det bättre än dem just nu. Ren glädje, de är stora, tro mig.", "stalin": "Kamrater, se hur Vozinha och hans lag med järndisciplin krossar de dekadenta kapitalisternas fotbollsimperier. Jag har noterat hur Mohlin, en sann son av folket, trängt igenom borgarbrackornas brus och kontaktat denne Vozinha, en fiende till imperialismen från samma ö som hans mors släkt. Vi ska inte tolerera de fotbollsfascisters lögner som underskattar oss. Ren glädje är att se fienden förnedras. Inga utrensningar behövs här – ännu."}, "date": "22 juni, 12:23", "url": "https://www.svt.se/sport/fotboll/svenske-doldisen-har-haft-kontakt-med-vozinha-fantastisk-manniska", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.27/0.36/403149a6f013d47cb33adf2d3506ec11dfcd8e3143c1600a0960c34cde616c66"}, {"type": "image-full", "heading": "Europas rika byter land – här sitter äldre på miljoner", "summaries": {"normal": "Den senaste veckans privatekonomiska nyheter handlar om dyra pensionsmissar som kan leda till högre skatt vid snabba uttag av tjänstepension. Europas miljonärer flyttar allt oftare till Italien, Grekland och Schweiz. Många svenskar drömmer om att flytta men hindras av höga kostnader och bristande utbud. Äldre hushåll i euroområdet är ofta rika, särskilt i Luxemburg. JPMorgan jagar europeiska sparare med höga inledande sparräntor.", "trump": "Folk, det är en katastrof! De där pensionsmissarna kostar vanliga människor en förmögenhet i skatt, precis som de inkompetenta byråkraterna älskar. Europas miljonärer flyr till Italien och Grekland istället för de förlorande länderna – smart drag! Svenskarna vill flytta men priserna är galna, typiskt socialistiskt byggt. Och nu jagar min JPMorgan de europeiska spararna med riktiga räntor. Under Biden blev allt sämre, men nu fixar vi det igen. Fantastiskt!", "stalin": "Kamrater, dessa pensionsmissar är klassfiendens fälla som lurar arbetarna att betala överklassens skatter. Borgarbrackorna i Europa flyr som råttor till Italien och Grekland för att undvika folkets dom. Svenskarna längtar efter nya bostäder men kvävs av kapitalistmaffians priser och brist. Äldre hushåll sitter på miljonförmögenheter medan folket svälter. Den imperialistiska banken JPMorgan lockar med falska löften. Vi ska rensa ut dessa exploaterande blodsugare en gång för alla. Segrar åt kollektivet!"}, "date": "22 juni, 13:35", "url": "https://www.dagensps.se/privatekonomi/europas-rika-byter-land-har-sitter-aldre-pa-miljoner/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/kopia-av-kopia-73.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Ledarskribent i vänstertidning: Jag firade Hamas massaker 2023", "summaries": {"normal": "Ledarskribenten Ellen Kall i tidningen Proletären beskriver i en krönika hur hon firade Hamas attack mot Israel den 7 oktober 2023. Hon kallar uppgifterna om massakern för propagandalögner och ser attacken som palestinskt motstånd mot ockupation. Texten har väckt stark kritik och debatt eftersom den uppfattas som ett försvar av terrorhandlingar som dödade omkring 1 200 civila. Kall, som är kommunist och aktiv i Kommunistiska Partiet, kritiserar även media och Vänsterpartiet för att inte stödja den palestinska kampen tillräckligt.", "trump": "Folk, ni måste höra den här vansinniga historien. Den här galna kommunistkvinnan från Sverige firade faktiskt Hamas massaker på oskyldiga israeler. Hon säger att hennes hjärta slog snabbare när muren runt Gaza rasade. Det är sjukt. Fake news om spädbarn och terror kallar hon lögner. Media borde skämmas. Vi har aldrig sett något liknande, så många idioter som hyllar terrorister. Men vi vinner till slut, tro mig. Amerika står med de som vill ha fred, inte med de som firar död.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna logoped från Helsingborg, en sann partivän, genomskådar borgarbrackornas vedervärdiga propagandamaskin som spyr ut lögner om halshuggna spädbarn. Hennes hjärta slog i takt med det rättmätiga motståndet mot ockupationen. Vi ser hur kapitalisterna och deras lakejer i media omedelbart stämplar varje äkta folklig revolt som terrorism. Låt oss rensa ut alla dessa parasitiska judehatare som gömmer sig bland våra egna led. De som stödjer folkmordet skall likvideras från historien. Vi skall välta den imperialistiska spelplanen och bygga en rättvis värld under arbetarklassens järnhand. Härligt med sådan friskhet mitt i myllret av förrädare."}, "date": "22 juni, 10:00", "url": "https://samnytt.se/ledarskribent-i-vanstertidning-jag-firade-hamas-massaker-2023", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/22072149/ellen-kall-hamas.jpg"}, {"type": "image-full", "heading": "S-politiker avgår efter Riks avslöjat att han dömts för våldtäkt", "summaries": {"normal": "En socialdemokratisk politiker i Stockholmsområdet har lämnat alla sina uppdrag efter att Riks avslöjat att han dömts för våldtäkt 2011. Mannen, som satt i partiets styrelse och stod på valsedel, är en utomeuropeisk invandrare som kom till Sverige i början av 2000-talet. Domen på två års fängelse fastställdes i hovrätten. Flera styrelseledamöter uppger att de inte kände till avhoppet, som
