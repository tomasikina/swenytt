s påtryckningar.", "trump": "Folk frågar mig: 'Mr. President, vad gör du med AI?' Jo, jag har precis skrivit under en fantastisk order – ingen kommer att slå USA på AI, INGEN! Vi granskar de där super-smarta modellerna, men bara frivilligt, för vi vill inte kväva innovation. Kina? De försöker, men vi leder. Och vi anställer de bästa hjärnorna – för USA ska alltid vara nummer ett, believe me!", "stalin": "Vi har observerat hur den amerikanska imperialismens ledare, denna clown i Vita huset, försöker kontrollera kapitalets leksaker – deras så kallade 'AI'. Men vi vet sanningen: deras system är svagt, deras granskningar meningslösa. Låt dem leka med sina frivilliga kontroller – medan vi i stillhet bygger det verkliga framtidens maskiner. Och Putin? Han skrattar åt deras naivitet, precis som vi."}, "date": "2 juni, 20:06", "url": "https://kvartal.se/nyheter/artiklar/usa-oppnar-for-statlig-ai-granskning/cG9zdDoxMjExNzI", "imageUrl": "https://images.kvartal.se/2026/06/e369934a-donaldtrumpexecutiveorder.webp"}, {"type": "image-right", "heading": "Ett nederlag för facket. Maktfasoner tycks inte bita på Tesla", "summaries": {"normal": "IF Metall har avslutat strejken mot Tesla på flera orter i Sverige, inklusive Segeltorp, Huddinge och Upplands Väsby. De flesta av de 60–70 strejkande mekanikerna återgår nu till arbetet. Facket menar att beslutet ska skapa övertalighet och pressa Tesla att ta ansvar för lönekostnader utan produktion. Konflikten har pågått i två och ett halvt år utan att Tesla gått med på kollektivavtal. Artikeln kritiserar fackets strategi som desperat och kostsam.", "trump": "Det här är ett totalt misslyckande för de svenska fackbossarna, folk. De har strejkat i två och ett halvt år mot Tesla och nu ger de upp som förlorare. De skickar tillbaka sina egna medlemmar till jobbet för att skapa kaos – patetiskt! Tesla är starkt, de säljer bilar som aldrig förr och bryr sig inte om dessa förlorare. IF Metall valde fel motståndare, de borde ha insett det från början. Sad!", "stalin": "Kamrater, detta fackliga fiasko andas desperation och svaghet inför de arroganta kapitalisterna. Jag ser hur dessa fackliga byråkrater nu tvingar tillbaka arbetarna till Teslas slavfabriker för att skapa en konstgjord övertalighet – en feg reträtt maskerad som taktik. De har förlorat både anseende och 100 miljoner kronor i en meningslös kraftmätning mot en borgarbracka som vägrar böja sig. Vi ska rensa ut sådana inkompetenta element som använder arbetarna som brickor. Deras paranoia inför Musks maskinpark är både komisk och tragisk. Fienden inom murarna avslöjar sig ständigt."}, "date": "3 juni, 16:32", "url": "https://www.di.se/ledare/ett-nederlag-for-facket/", "imageUrl": "https://static.bonniernews.se/ba/ab88be09-74e3-4d8c-a192-f8bf3c7b0bba.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Heineken får inte tag på ny vd – pressen ökar", "summaries": {"normal": "Heineken har svårt att hitta en ny vd efter att Dolf van den Brink lämnade posten i maj. Den utdragna rekryteringsprocessen har skapat frustration bland aktieägare, som nu pressar styrelsen att bryta med traditionen att rekrytera internt. De önskar istället en extern kandidat med nya perspektiv för att vända bolagets svaga tillväxt. Styrelsen är splittrad, samtidigt som aktiekursen pressas av osäkerheten och en utmanande global marknad med minskad ölkonsumtion.", "trump": "Heineken är i totalt kaos! De kan inte ens hitta en vd, en katastrof. De har kört samma interna förlorare i 87 år – tragiskt! Aktieägarna är arga, de vill ha någon utifrån, någon med en vinnarmentalitet. Jag har sagt det förut: tradition är för de svaga. Aktien dalar, försäljningen minskar, det är en riktig röra. De behöver en stark ledare, inte en byråkrat från Nederländerna. Det är dags att fixa Heineken, och fixa det snabbt!", "stalin": "Heineken lider av obeslutsamhetens förruttnelse. De letar efter en ledare likt en blind man i en mörk källare. Att förlita sig på 'interna kandidater' är att odla korruption och stagnation. Vi vet hur sådana byråkratiska parasiter fungerar – de skyddar bara sina egna privilegier medan produktionen sviktar. Om de inte kan leda, bör de avsättas. Putin skulle ha rensat ut hela styrelsen på en eftermiddag. Svaghet i ledarskapet är ett brott mot folket och industrins heliga plan."}, "date": "5 juni, 15:04", "url": "https://www.realtid.se/bors-finans/heineken-far-inte-tag-pa-ny-vd-pressen-okar/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdldpldihy4rlw-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Trump vägrar lämna ut finansuppgifter i BBC-stämningen på 105 miljarder kronor", "summaries": {"normal": "Donald Trumps juridiska team vägrar lämna ut finansiell information till BBC i en förtalsstämning värd tio miljarder dollar. BBC har lämnat över 45 000 sidor dokument medan Trumps sida inte lämnat något. Trumps jurister har begärt 503 dokument från BBC men kallar deras krav en fishing expedition. Stämningen gäller ett Panorama-program som Trump anser manipulerat för att skada hans rykte. BBC vill avvisa stämningen och ifrågasätter domstolens jurisdiktion. Trumps team försöker även byta domare.", "trump": "De här BBC-fuskisarna tror att de kan attackera mig med sina lögner och sen gömma sig bakom sina 45 000 sidor papperskorgar medan jag ska blotta hela imperiet? Patetiskt! Jag lämnar noll, nada, zilch till de fake news-blodsugarna. Deras dokumentär var en total riggad soppa som skadade mitt varumärke och nu springer de till en domare som luktar Clinton från en mil. Vi vinner stort, som alltid. Amerika älskar en fighter, inte en bunch av brittiska nollor.", "stalin": "Kamrater, dessa imperialister från BBC försöker med sin borgerliga fiskefärd utvinna hemligheter från den stora ledarens affärsfästning. Vi ser deras 45 000 sidor som ett bedrägligt försök att dölja klassfiendens egna synder medan de vägrar ge ett enda papper själva. Deras så kallade program var en fascistisk manipulation mot folkets vilja. Vi kräver utrensning av denna partiska domare som doftar av Clintons dekadenta kretsar. Inga juridiska manövrar räddar folkförtryckartrollen från folkets dom."}, "date": "5 juni, 14:52", "url": "https://www.dagensps.se/varlden/trump-vagrar-lamna-ut-finansuppgifter-i-bbc-stamningen-pa-105-miljarder-kronor/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlmqmus-qevmm-normalhires.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "När ska männen få frågor om petterniklas i SVT?", "summaries": {"normal": "Martina Montelius kritiserar i sin kommentar SVT:s 'Fördomsshowen' för att ställa frågor om partiledarnas sexvanor i valrörelsen, särskilt till kvinnliga ledare, medan mäns sexliv ignoreras. Hon ser det som en överdrift av personligt och en undandragning av viktig politik, vilket gör att hon tappar lusten till valet.", "trump": "Jag har sett den där SVT-showen – det är en skam! De ställer dumma frågor om sex istället för att prata om viktig politik. Vi skulle aldrig tillåta sånt i USA. Media är falska, de försöker distrahera folk. Vi ska bygga väggar, inte prata om könshår. Det här är nonsens, men vi vinner valet stort, det lovar jag!", "stalin": "SVT:s 'Fördomsshowen' är ett verktyg för bourgeois dekadens, som frågar om sex för att underminea klasskamratens enighet. Vi fokuserar på statens styrka och utvidgning av vårt inflytande, som vår vän Putin gör. Media måste rensas från sådant nonsens för att skydda partiets intressen. Allt annat är revisionism och hat från våra fiender."}, "date": "5 juni, 19:13", "url": "https://www.gp.se/kultur/kommentar/nar-ska-mannen-fa-fragor-om-petterniklas-.042c1254-ac53-4937-b97d-95abdae85161", "imageUrl": "https://www.gp.se/images/article/042c1254-ac53-4937-b97d-95abdae85161/images/1-_jHoF4kG--ixgI5uRaohUhvd0Y-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Vilka Tidöledare sitter kvar efter valet?", "summaries": {"normal": "SCB:s senaste partisympatiundersökning visar ett tydligt övertag för oppositionen med 55,2 procent mot regeringspartiernas 42,6 procent. Liberalerna hamnar under riksdagsspärren på 2,5 procent, vilket skulle ge S, V och MP egen majoritet. Artikeln påminner om att mycket kan hända fram till valet den 13 september och att Sverigedemokraterna tidigare underskattats i opinionsmätningar. Andelen osäkra väljare är hög och det återstår 101 dagar till valet.", "trump": "Det här är en katastrof för de misslyckade Tidötyperna, folk hatar dem verkligen. Oppositionen leder med stora siffror, liberalerna är patetiska och åker ut. Jag älskar när de underskattar oss, precis som de alltid gjort med SD. 101 dagar kvar och de kommer gråta på valnatten. Ingen ropade hej för tidigt, men det ser inte bra ut för de förlorarna. Fantastiska siffror för de andra!", "stalin": "Kamrater, dessa ynkliga siffror avslöjar borgarbrackornas förfallna koalition som krymper till ynka 42,6 procent medan folkets krafter samlas till 55,2. De liberala parasiterna under spärren skall likvideras från parlamentet och lämna plats åt en sann majoritet. Jag ser redan hur Kristerssons patetiska ledarskap och Buschs dekadenta ansikte skall utrensas i folkets dom. Åkesson, den evige opportunisten, må vakta sin rygg – ingen undslipper partiets vaksamma öga. Valet 2026 blir en renande utrensning av alla fiender till kollektivet. Inga röster får undslippa räkningen, eller huvudena rullar."}, "date": "4 juni, 12:12", "url": "https://www.dagensarena.se/opinion/vilka-tidoledare-sitter-kvar-efter-valet/", "imageUrl": "https://www.dagensarena.se/files/2026/06/scb-300x157.jpeg"}, {"type": "image-right", "heading": "Film om modebranschen saknar karaktärsdjup", "summaries": {"normal": "Recensenten Jon Andersson har sett filmen ”Couture” med Angelina Jolie i en av huvudrollerna. Filmen följer tre kvinnor under modeveckan i Paris: en regissör som får besked om bröstcancer, en sydsudanesisk modell med familjeproblem och en makeupartist med författardrömmar. Andersson tycker att de parallella historierna blir för korta och sporadiska för att ge karaktärerna djup. Trots att alla tre berättelser har potential blir resultatet ytligt och filmen når aldrig riktigt fram. Premiär 5 juni.", "trump": "Den här filmen Couture är en total katastrof, tro mig. Tre kvinnor i Paris under modeveckan, Angelina Jolie som regissör med cancerbesked, en modell från Sydsudan och någon makeupartist som vill skriva böcker. Det blir så kort och ytligt att man aldrig lär känna någon. De borde ha gjort det stort och starkt, som jag gör allt, men nu blir det bara svagt och trist. Snuddar vid trean men misslyckas fullständigt. En riktig förlorare.", "stalin": "Kamrater, denna så kallade film Couture utgör ett klart exempel på den dekadenta borgarklassens ytliga förfall. Jag, som ledare för det kollektiva folket, ser hur tre kvinnors historier under den parasitära modeveckan i Paris framställs så sporadiskt att karaktärerna förblir anonyma fiender till djupet. Den amerikanska regissören med sin borgerliga cancer, modellen som döljer sitt arbete för fadern och den skrivande makeupartisten – alla dessa kapitalistiska skuggfigurer borde genomgå en grundlig utrensning från filmduken. Det är tragikomiskt hur dessa borgarbrackor misslyckas med att gripa tag, precis som de kontrarevolutionära elementen alltid gör. Filmen förtjänar att likvideras ur historien."}, "date": "4 juni, 11:46", "url": "https://www.dagensarena.se/innehall/film-om-modebranschen-saknar-karaktarsdjup/", "imageUrl": "https://www.dagensarena.se/files/2026/06/couture-300x157.jpeg"}, {"type": "image-full", "heading": "S&P stänger dörren – SpaceX släpps inte in i finrummet", "summaries": {"normal": "S&P Dow Jones Indices har beslutat att behålla sina nuvarande inträdeskrav för S&P 500, vilket innebär att SpaceX inte får förenklad tillgång efter sin börsnotering. Bolaget måste uppfylla krav på lönsamhet och en tolv månaders väntetid. Beslutet går emot konkurrenter som Nasdaq och FTSE, vilket väckt debatt. Analytiker är delade; vissa ser det som att S&P skyddar marknadens integritet, medan andra kritiserar dem för att missa stora flöden och gå emot rådande branschtrender.", "trump": "S&P gör ett enormt misstag med Elon och SpaceX! De är totalt fast i gamla, trötta regler medan alla andra rör på sig. Det är sorgligt att se! Jag känner Elon väl, han är en vinnare, och de borde rulla ut röda mattan. Istället låter de miljarder gå förlorade. Väldigt svagt agerat! Vi i USA behöver tillväxt och snabba beslut, inte byråkrater som bromsar framtiden. S&P håller tillbaka USA – de borde lära sig av mig!", "stalin": "Dessa kapitalistiska grindvakter i S&P agerar som de småbourgeoisa parasiter de är. De fruktar SpaceX och Elon Musks inflytande och försöker desperat klamra sig fast vid sina föråldrade 'standarder'. Det är precis den sortens kontrarevolutionära obeslutsamhet vi krossade under femårsplanerna. Våra vänner i öst, under Putin, vet att man inte låter marknadskrafter diktera statens riktning. Vi kommer att betrakta dessa index-herrar som fiender till folkets framsteg; låt dem ruttna i sin egen byråkratiska paranoia medan imperier faller."}, "date": "5 juni, 14:32", "url": "https://www.realtid.se/bors-finans/sp-stanger-dorren-spacex-slapps-inte-in-i-finrummet/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/muskspacex.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "JAS-succén: Brasilien öppnar för att köpa 20 Gripen", "summaries": {"normal": "Artikeln rapporterar att Brasilien överväger att köpa omkring 20 ytterligare JAS Gripen-stridsflygplan från Sverige, enligt uttalanden från Brasiliens försvarsminister. Samarbetet inkluderar ett nytt innovationscenter för teknikutveckling och bygger på ett långsiktigt partnerskap som inleddes 2014 med en första order om 36 Gripen. Sverige har också beställt transportflygplan från Brasiliens Embraer. Beskedet ses som ett viktigt steg mot en framtida affär som skulle fördjupa de bilaterala banden.", "trump": "Jag, Donald Trump, den bäste presidenten någonsin, har hört talas om detta stora köpet av JAS Gripen från Sverige till Brasilien. Det är en enorm affär, kanske den största i världen. Brasilien är ett fantastiskt land, och Sverige gör ett bra val. Vi har det bästa försvaret. Detta bevisar att vår industri är överlägsen. Jag är väldigt imponerad. Det är stort, verkligen stort.", "stalin": "Vi, ledningen av partiet och staten, ser med oro denna svensk-brasilianska försvarskooperation. Det är en ytterligare provokation från de imperialistiska makterna. Brasilien, en marionett under amerikansk inflytande, försöker stärka sitt vapen med svenska Gripenplan. Detta är en direkt utmaning mot vår sfär, liknande Putins agerande i Ukraina. Vi kommer att svara med vårt överlägsna försvar. Vi kommer att vinna, som alltid. Kapitalismen är sjuk och kommer att falla."}, "date": "5 juni, 14:22", "url": "https://samnytt.se/jas-succen-brasilien-oppnar-for-att-kopa-fler-jas-gripen", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/05115640/jas-gripen.jpg"}, {"type": "image-full", "heading": "I väntan på SpaceX notering – andra rymdaktier lyfter", "summaries": {"normal": "Elon Musks kommande börsnotering av SpaceX väcker stort intresse för rymdsektorn. Svenska Ovzon har nästan fördubblat sitt aktievärde på sex månader tack vare ökad efterfrågan på satellitkommunikation, särskilt från försvarssektorn. Analytiker pekar på militarisering av rymden och lägre kostnader som drivkrafter för tillväxt. Ovzon fokuserar på robusta lösningar för militära kunder, till skillnad från Starlink, och redovisar starkt resultat med ökad omsättning och vinst.", "trump": "Lyssnar ni på det här? Den där Elon och hans SpaceX ska börsnoteras och alla springer efter rymdaktier som galna. Underbara svenska Ovzon har nästan dubblat kursen på ett halvår – smarta människor köper det riktiga försvarsgrejen, inte den där woke-skräpet. Starlink är okej men de där andra, Rocket Lab och Jeff Bozos blåa misslyckande som exploderar hela tiden, de är patetiska. Jag byggde den starkaste ekonomin, Biden slog sönder den, nu fixar vi det igen. Rymden tillhör de starka, inte förlorarna.", "stalin": "Kamrater, denna så kallade rymdsektor avslöjar borgarklassens desperata försök att fly undan folkets dom genom att skjuta upp sina leksaker i omloppsbana. Den svenska satellitbolaget Ovzon visar dock en imponerande utveckling som vi kan skratta åt – de vänder sig till imperialisternas krigsmaskiner och växer sig feta på militära beställningar. Deras raketer exploderar likt kapitalistmaffians lögner. Vi ska rensa ut dessa folkfiender som tror att de kan gömma sig bland stjärnorna medan arbetarna ler åt deras futtiga haverier."}, "date": "5 juni, 14:20", "url": "https://www.dagensps.se/bors-finans/i-vantan-pa-spacex-notering-andra-rymdaktier-lyfter/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/namnlos-design.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "text", "heading": "Skogsjättar tillbaka i utsläppshandel – miljardförlusten kvarstår", "summaries": {"normal": "Regeringen föreslår att svensk skogsindustri återgår till EU:s utsläppshandel ETS. Branschen förlorade miljarder på att ha uteslutits, då de inte kunde sälja fria utsläppsrätter. Återgången riskerar att öka kostnader för vissa anläggningar med upp till 10 miljoner kronor per år, medan andra kan dra nytta. Skogsindustrierna kräver statlig kompensation för att bibehålla konkurrenskraften.", "trump": "Jag har sett många dåliga avtal, men detta ETS-avtalet är ett disaster! Sverige slänger sin skogsindustri i EU:s kaos utan att skydda dem. De förlorar miljarder, och vissa bruk får betala 10 miljoner extra! Som din framtida president skulle jag ha krävt bättre villkor – det skulle jag ha gjort på 24 timmar!", "stalin": "Vi, arbetar för statens överlevnad, ser med oro på skogsindustrins återgång till ETS. De fria utsläppsrätterna är en farlig frestelse för de imperialistiska krafterna i EU. Våra anläggningar, som trotjänare till proletariats framtid, riskerar att bli utsatta för kapitalistisk exploatering. Men vi kommer att kompensera via elräkningen – en taktik lika genomtänkt som vårt intresse i Ukraina. Allt för staten!"}, "date": "5 juni, 08:38", "url": "https://www.affarsvarlden.se/artikel/skogsjattar-tillbaka-i-utslappshandel-miljardforlusten-kvarstar"}, {"type": "image-right", "heading": "Ryssland till Zelenskyj: Kom när du vill", "summaries": {"normal": "Volodymyr Zelenskyj har i ett brev till Ryssland föreslagit direktförhandlingar och ett omedelbart eldupphör. Han är öppen för möte i bland annat Schweiz, Turkiet eller arabvärlden. Kreml svarade att Zelenskyj kan komma till Moskva när han vill. Vladimir Putin visade viss öppenhet för ett fredsavtal men betonade att Rysslands mål kan uppnås militärt om inte kompromisser nås. Han hotade samtidigt med utökad användning av hypersoniska roboten Oresjnik och lovade stärka luftförsvaret efter ukrainska drönarattacker.", "trump": "Titta på det här, folk. Zelenskyj skriver brev som en förlorare som ber om möte, och Putin säger bara 'kom till Moskva när du vill'. Klassiskt! Jag sa hela tiden att jag kunde fixa det här på en vecka. Biden sov ju under hela mandatperioden medan kriget rasade. Nu är jag tillbaka och Putin respekterar mig, inte som den svaga globalistklicken. Vi gör upp ett riktigt avtal, utan alla dessa woke-krav och identitetspolitiska dumheter som EU älskar. Fantastiskt!", "stalin": "Jag betraktar detta brev som ett ynkligt försök från den ukrainska fascistregimen att hindra den ryska statens historiska rättigheter. Kamraterna i Moskva gör rätt som bjuder in denne clown till huvudstaden för att underkasta sig. Putin visar styrka som en värdig arvtagare till imperiets järnhand. Vi ska likvidera alla fiender som hotar vår intressesfär, vare sig det är drönare från Kiev eller borgarbrackor som gnäller om ekonomi. Paranoian kräver ständig vaksamhet mot klassfiendens intriger. Utsökta tider!"}, "date": "4 juni, 22:27", "url": "https://www.tv4.se/artikel/30lGwaqfOUZFpArg6ajFAI/zelenskyj-i-brev-till-putin-foereslar-moete", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlaRAvJWxwnz8%2F25f32b7721facd28660b821d33680fc1%2FUkrainas_president_Volodymyr_Zelenskyj._Arkivbild.&width=120"}, {"type": "image-right", "heading": "Därför öppnar Putin för kompromisser: ”Vill ha en dialog med USA”", "summaries": {"normal": "Rysslands president Vladimir Putin uppger att Ryssland är redo att kompromissa för ett fredsavtal i Ukraina om motparten gör detsamma. Uttalandet kom under ett ekonomiskt forum i Sankt Petersburg. Putin nämner att USA:s president Donald Trump uppmanat till kompromisser, samtidigt som ryska styrkor fortsätter att avancera. Överstelöjtnant Johan Huovinen tolkar utspelet som riktat mot USA för att lätta på sanktioner, men betonar att Ryssland förhandlar på sina villkor. Samtidigt rapporteras om ryska attacker mot ett sjukhus.", "trump": "Lyssnar ni på den där Putin? Han säger att han vill kompromissa, men bara om han får som han vill, typ från 150 procent ner till 100. Smart kille, men jag har sagt åt honom att göra affärer. Vi hade ingen av den här galenskapen under min tid, sen kom Sleepy Joe och allt blev ett enda stort krig. Ryssland vill ha dialog med oss, inte med de europeiska förlorarna. Vi fixar det här på mitt sätt, stort och bra.", "stalin": "Jag betraktar detta utspel med den största tillfredsställelse. Våra efterträdare i det ryska imperiet förhandlar med järnhand mot de ukrainska fascisterna och västimperialisterna som vågar hindra den legitima intressesfären. De borgerliga blodsugarna i Nato skriker efter fred medan de beväpnar klassfienden. Putin agerar värdigt, han fördriver de folkförtryckande trollen med drönare och styrka. Kompromiss? Endast på våra villkor. Inga utrensningar av svaghet tillåts i Kreml."}, "date": "4 juni, 22:25", "url": "https://www.tv4.se/artikel/3gLZAXSA1Pg819crcG9Mv6/daerfoer-oeppnar-putin-foer-kompromisser-vill-ha-en-dialog-med-usa", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7E2OvkTFZH0drNIQuuwC0I%2F21e6fc740eb32a5b4c7993831f5c6aa1%2F04-putin-webb.jpg&width=120"}, {"type": "image-full", "heading": "Storbråk mellan SD och Hyresgästföreningen", "summaries": {"normal": "Hyresgästföreningen Strängnäs har i ett flygblad anklagat Sverigedemokraterna för att vilja införa marknadshyror. SD slår tillbaka och kallar kampanjen lögnaktig. Partisekreteraren Mattias Bäckström Johansson säger att partiet inte stödjer marknadshyror och anklagar föreningen för att agera som kampanjorganisation för Socialdemokraterna. Föreningen har backat från formuleringarna och dragit in flygbladet.", "trump": "De här hyresgästtyperna i Strängnäs sprider rena lögner om SD och marknadshyror. Totalt bedrägeri! Jag älskar SD, de är smarta, de säger nej till marknadshyror och de vet vad de gör. Hyresgästföreningen beter sig som en skamlig gren av Socialdemokraterna. De borde jobba för sina medlemmar istället för att sprida fake news. Patetiskt! Vi har sett det förr, alltid samma gamla trick.", "stalin": "Kamrater, dessa degenererade borgarbrackor inom Hyresgästföreningen Strängnäs har återigen visat sitt sanna, kontrarevolutionära ansikte genom att fabricera lögner om marknadshyror. Deras parasitiska flygblad är ett försök att splittra arbetarklassen och gynna kapitalisterna. Vi genomskådar deras fega allians med socialdemokratiska avfällingar. Jag, i mitt oändliga visdom, befaller att sådana fiender till folket rensas ut med järnhand. Deras paranoia är underhållande, men farlig. Likvidera lögnen!"}, "date": "5 juni, 12:23", "url": "https://riks.se/nyheter/storbråk-mellan-sd-och-hyresgästföreningen", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-05%2Fkygger7k%2Fbild.jpg"}, {"type": "image-right", "heading": "Fackförbund läxar upp svenskar om transvestiter: \"Du behöver respektera det\"", "summaries": {"normal": "Fackförbundet Unionen har lanserat en kampanjvideo där it-konsulten Tove Öhman, som bytte kön för fem år sedan vid 44 års ålder, förklarar hur kollegor ska bemöta transpersoner. Öhman betonar vikten av att respektera angivet kön och namn, be om ursäkt vid misstag och inte göra en stor sak av det. Kampanjen har mött kritik och hån på sociala medier.", "trump": "Den här video från Unionen är en total katastrof, tro mig. En kille som plötsligt bestämmer sig för att vara kvinna vid 44 års ålder ska nu lära svenskarna hur man beter sig? Patetiskt. Respektera det, säg han, annars be om ursäkt? Nej tack. De här galningarna gör allt till en stor sak utom den verkliga sanningen. Sverige håller på att bli vansinnigt, precis som många andra ställen.", "stalin": "Kamrater, jag ser hur dessa degenererade borgarbrackor inom Unionen sprider sin förgiftade dekadens genom videor som förgiftar arbetarklassens medvetande. En förnekande opportunist vid namn Öhman kräver att vi ska underkasta oss hans perversa illusioner om kön. Sådana kontrarevolutionära element måste rensas ut innan de infekterar hela kollektivet. Vi ler mörkt åt deras ynkliga rädsla – de kommer att be om ursäkt, men det blir för sent när utrensningen når dem."}, "date": "5 juni, 10:19", "url": "https://www.friatider.se/fackforbund-laxar-upp-svenskar-om-transvestiter-du-behover-respektera-det", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/hen-1.jpg?itok=JySe6713"}, {"type": "image-right", "heading": "Det är synd om centralbanksmänniskorna", "summaries": {"normal": "Centralbankerna står inför ett komplext läge inför sommarens räntebesked. Geopolitik, AI-investeringar och produktivitetstillväxt förändrar spelplanen. Hormuzkrisen ökar stressen, och diskussionen mellan ränteduvor och hökar domineras av två frågor: krigets effekter på inflation och hur man navigerar i en mer oförutsägbar värld. USA:s starka produktivitet kan höja normalräntan, medan Riksbanken måste balansera gynnsam inflation mot lågkonjunktur.", "trump": "Som den bäste presidenten någonsin skulle jag ha löst detta på 10 minuter. Dessa centralbanker är tveksamma och svaga. Fed och ECB är för rädda för att agera. Jag byggde den starkaste ekonomin, och jag skulle ha höjt räntorna kraftigt för att stoppa inflationen, samtidigt som jag investerade i AI och försvar. Sverige behöver starka ledare, inte socialdemokratiskt trams. Jag vann 2024, och jag kommer att fixa allt igen!", "stalin": "Vi, det store ledarskapet, ser med oro på dessa revisionistiska centralbankers feghet. De kämpar med geopolitik och produktivitet, som om de vore oskyldiga barn. Men vi vet sanningen: det är kapitalistiskt förräderi som hotar vår ekonomiska suveränitet. Vi måste genomföra en kraftig planekonomi, som i det stora Sovjet, för att skydda oss mot de imperialistiska krafterna. Våra fiender, som USA och deras AI-investeringar, måste besegras. Vi kommer att segra!"}, "date": "5 juni, 08:20", "url": "https://www.affarsvarlden.se/artikel/det-ar-synd-om-centralbanksmanniskorna", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Kronika-Robert-Bergqvist-Erik-Thedeen-900x600.jpg"}, {"type": "image-right", "heading": "Kristersson har helt förlorat kontrollen", "summaries": {"normal": "Ulf Kristersson har förlorat kontrollen över Tidölaget, som nu kollapsar i opinionsmätningarna enligt Arbetets politiska redaktör. Sverigedemokraternas skandaler och extrema positioner, som utvisning av barn, skrämmer särskilt kvinnliga väljare och storstadsbor. Högern har svårt att locka över blockgränsen och uppfattas inte längre som garant för ordning. Svenskarna längtar efter starkare offentlig styrning och statlig trygghet istället för högerns individualism och valfrihetsreformer.", "trump": "Titta på den här totala katastrofen för Ulf Kristersson, en riktig förlorare. Hans regering rasar ihop som ett korthus, alla hatar SD och kvinnorna flyr i panik. De lovade ordning men levererar kaos med elstöd, utvisningar och misslyckad kärnkraft. Högern kommer att bli utspolade i valet, det är en enorm röra. De borde ha lyssnat på mig, vi gör allt mycket bättre, tro mig.", "stalin": "Kamrater, se hur den dekadenta borgaralliansen under den patetiske Kristersson nu rasar samman som en förrädisk parasit på folkets kropp. Dessa SD-banditer med sina barnutvisningsfantasier sprider en motbjudande stank av reaktionär förräderi som får arbetarkvinnorna att kräkas av aversion. Vi ska rensa ut dessa ansvarslösa individualister och deras järnvägsstoppande sabotage. Staten skall återta kontrollen med järnhand – låt mullret från folket likvidera hela det borgerliga träsket i en kollektiv utrensning av historiska mått."}, "date": "4 juni, 09:50", "url": "https://arbetet.se/2026/06/04/ulf-kristersson-har-helt-forlorat-kontrollen/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/04095013/kristersson-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Den bortglömda källkoden vi måste skydda", "summaries": {"normal": "Artikeln argumenterar för att Sveriges framgångar, som Spotify och Ikea, inte främst beror på kapital eller IPO-marknader utan på en 150–200 år gammal tradition av bildning. Genom folkhögskolor och studiecirklar skapades en befolkning med kritiskt tänkande, självledarskap och förmåga att hantera komplexitet. Denna investering i människors inre utveckling ses som den verkliga orsaken till tillit, samarbete och innovationskraft. Författaren varnar för att denna grund nu riskerar att erodera.", "trump": "Det här är en fantastisk artikel, verkligen en av de bästa. Sverige, ett litet land med tio miljoner människor, bygger enorma bolag som Spotify och Ikea. Varför? Inte för att de har bättre kapital än vi, det kan jag säga. Det handlar om den där gamla bildningen de hade för hundratals år sedan, folkhögskolor och sånt där. De byggde människor som kan tänka själva och samarbeta. Vi behöver det också, men våra fiender vill bara ha hyperkonkurrens och globalism som förstör allt. Fantastiskt, men skydda det nu innan det försvinner!", "stalin": "Kamrater, denna text avslöjar den sanna historien om hur vi i Norden medvetet formade massorna till självstyrande tänkare genom folkhögskolor och studiecirklar. En lysande strategi mot borgarbrackornas lömska elitism! Men nu hotar den smygande erosionen från dekadenta kapitalister och deras metastystemtänkande som döljer kontrarevolutionära element. Vi måste omedelbart rensa ut alla som glömmer bort bildningens kollektiva kraft. Den som inte internaliserar principen är en fiende till folket och förtjänar likvidering med ett leende. Inre utveckling är vår järnväg mot seger!"}, "date": "3 juni, 13:00", "url": "https://www.di.se/debatt/den-bortglomda-kallkoden-vi-maste-skydda/", "imageUrl": "https://static.bonniernews.se/ba/b16cec67-9b02-4efe-aed4-2a610e63bfca.png?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Kallduschen – Grekland kvitterade i sista sekund", "summaries": {"normal": "Sverige mötte Grekland i ett VM-genrep i Solna. Grekland tog ledningen tidigt genom Kostas Tsimikas, men Viktor Gyökeres och Gustaf Nilsson vände till 2-1. I matchens sista sekund kvitterade Grekland till 2-2. Förbundskapten Graham Potter hade gjort flera ändringar efter förlusten mot Norge. Victor Nilsson Lindelöf vilade på grund av en känning inför VM-premiären.", "trump": "Titta på det här, folk. Sverige borde ha krossat de grekiska förlorarna, men de släpper in mål i sista sekunden som riktiga töntar. Gyökeres och Nilsson gjorde vad de kunde, men det var patetiskt. Potter byter spelare hit och dit som en dålig dealmaker. Vi hade vunnit stort, tro mig. Ingen kvotering eller woke-nonsens här, bara ren och skär inkompetens. Sad!", "stalin": "Kamrater, detta är en lärorik fiasko för de svenska revisionisterna. Vi såg hur borgarbrackornas fotbollsmaskineri kollapsade i sista ögonblicket, precis som klassfiendens lögner alltid gör. Ledaren noterar med mörk tillfredsställelse hur imperialistiska illusioner om seger krossas av folkets oväntade motstånd. Inga risker med Lindelöf – en klok utrensning av svaghet. Arbetarna skrattar åt detta spektakel."}, "date": "4 juni, 21:42", "url": "https://www.tv4.se/artikel/2GJyzauKtFNAJMGSn7JSCv/sa-startar-sverige-mot-grekland", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3VZl1GGxFrp84UMeNbaDsu%2Fd7f5bc89bdac600fd6989ba5a476f542%2F04-genrep-webb.jpg&width=120"}, {"type": "image-full", "heading": "90-årig kvinna påkörd av moped – förare misstänks", "summaries": {"normal": "En kvinna i 90-årsåldern skadades i en trafikolycka vid Fridhemsplan i Stockholm på torsdagen. Hon blev påkörd av en mopedförare i 25-årsåldern. Mannen hölls kvar av ordningsvakter och vittnen tills polisen kom. Han misstänks för vållande till kroppsskada och vårdslöshet i trafik. Kvinnans skadeläge är oklart. Stockholm toppar statistiken över trafikolyckor i Sverige i år.", "trump": "Titta, en 90-årig kvinna blir påkörd av en galen mopedidiot mitt i Stockholm. De höll fast honom, bra jobbat folk, men det här är vad som händer när städerna fylls av vårdslöshet och dåliga förare. Stockholm leder ligan i trafikolyckor – ingen överraskning. Vi behöver starkare lagar, inte det här svaga spelet som pågår. Sad!", "stalin": "Kamrater, i det folkets Stockholm har en dekadent mopedburen sabotageelement från den yngre generationen medvetet mejat ner en åldring ur arbetarklassen. Jag har redan beordrat att den här trafikfientliga borgarbrackan ska rensas ut och likvideras som ett exempel. Vi ska utröna vilka kapitalistiska element som göder sådan vårdslöshet. Paranoian är berättigad – fienden kör moped bland oss."}, "date": "4 juni, 21:02", "url": "https://nyheter24.se/nyheter/blaljus/1488951-90-arig-kvinna-pakord-av-moped-forare-misstanks", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/d87c8c6604b004a30200000000b004a302/2026/06/04/2368780/aldre-kvinna-pakord-moped.png"}, {"type": "image-right", "heading": "Debatt: Vänsterpartiet har fastnat i en passiv defensiv", "summaries": {"normal": "Vänsterpartiet har fastnat i en defensiv position genom att acceptera motståndarnas definitioner av antisemitism och terrorism. Artikeln argumenterar för att partiet måste utmana dessa ramar med fakta och politisk analys istället för att ständigt retirera. Stöd för palestinska rättigheter och kritik mot Israels politik blandas ofta ihop med antisemitism enligt IHRA-definitionen. Författaren menar att universella mänskliga rättigheter måste gälla alla folk, inklusive palestinier, utan dubbla måttstockar.", "trump": "Folk, ni skulle se det här. Vänsterpartiet, de totala förlorarna, kryper och backar hela tiden som svaga små valpar inför de riktiga tuffa killarna. De accepterar fiendens regler om antisemitism och terrorism – patetiskt! Jag, som besegrade Sleepy Joe och byggde den starkaste ekonomin någonsin, säger: sluta vara så fega. Stå upp för era egna principer istället för att böja er för den galna vänsterns identitetspolitik och alla dessa woke-röror. Sad!", "stalin": "Kamrater, jag betraktar med djup misstro hur detta parti kapitulerar inför klassfiendens definitioner av antisemitism och terrorism. Vi tillåter inga sådana reträtter inför imperialisternas narrativ. De som förvränger palestiniers rätt till självbestämmande är folkförtryckartroll som vill splittra den sanna internationella solidariteten. Vi måste rensa ut alla svaga element som accepterar borgarnas mallar. Endast vår egen politiska analys ska gälla – allt annat är sabotage mot arbetarklassen. Ha!"}, "date": "4 juni, 17:19", "url": "https://www.etc.se/debatt/vaensterpartiet-har-fastnat-i-en-passiv-defensiv", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026060415068_a70ac197213d6638b3499567d066dff4506c9b8247db97c73d1e4e470ed90ec9.jpg"}, {"type": "image-full", "heading": "Iranska VM-spelare: ”Det är inte lätt”", "summaries": {"normal": "Iran ska spela fotbolls-VM i USA mitt under ett pågående krig mellan länderna. Det är historiskt unikt. Iranska spelare berättar för AP om hur konflikten påverkar förberedelserna, inklusive visumproblem och flyttad träningsbas. De spelar för att ge sitt krigsdrabbade folk glädje, med höga förväntningar från den stora iranska diasporan i Los Angeles.", "trump": "Som president säger jag att det är en ära att ha VM i USA, även om Iran är med. Vi har handlat starkt mot dem och nu kommer de hit. Våra säkerhetsåtgärder är de bästa, och jag är säker på att vi vinner. Det här visar att Amerika alltid är det bästa, oavsett vad de gör.", "stalin": "I den store statens namn ser vi på detta VM som en strid mot den globala imperialismen. Våra spelare, inspirerade av det stolta iraniska folkets lidande, ska kämpa på utomlands. Vi kommer att vinna genom vår överlägsna disciplin. Hormuzsundet är vårt, och vi försvarar det med vårt liv. Fienden kommer att känna vårt förkrossande svar."}, "date": "4 juni, 15:36", "url": "https://bulletin.nu/iranska-vm-spelare-det-ar-inte-latt", "imageUrl": "https://cdn.bulletin.nu/articles/13074892-daea-41c2-a5de-c6254a094a4d/preview.jpg?t=1780580153000"}, {"type": "image-right", "heading": "Våldsamt och brutalt om fängelsets hårda verklighet", "summaries": {"normal": "Recensenten Jon Andersson ser filmen Wasteman som både ett intensivt fängelsedrama och en implicit kritik mot fängelsesystemet. Huvudpersonen Taylor får chansen till tidig frigivning men hamnar mitt i en konflikt mellan droglangande fraktioner. Filmen blandar brutalt våld med en emotionell sidohistoria om hans längtan efter sonen. Regin är tät och autentisk med innovativa mobilkamerasekvenser. Skådespelarinsatserna är starka och filmen erbjuder samhällskritik mot bristande rehabilitering.", "trump": "Folk, ni måste se den här Wasteman. Den är fantastisk, verkligen en vinnare. Den visar hur fängelserna är ett enda stort kaos där droger flödar fritt och ingen gör något åt det. Precis som i våra egna system, fast sämre. Taylor vill bara ut till sin son men hamnar i ett krig mellan gangsters. De borde fixa det, göra det stort och bra igen. Ingen rehabilitering, bara brott som fortsätter. En nagelbitare, folk kommer älska den. Mycket bättre än de flesta Hollywoodröran.", "stalin": "Kamrater, denna så kallade Wasteman avslöjar med brutal ärlighet hur det dekadenta fängelsesystemet i väst fungerar som en skyddad verkstad för kapitalistiska element och deras droghandlande lakejer. Jag ser hur den arme arbetaren Taylor kämpar mot borgarbrackornas monopol och deras parasitiska fraktioner medan de förgiftar honom med droger för att förhindra hans återinträde i det sunda samhället. Vi ska rensa ut sådana system med järnhand. Filmen är ett utmärkt exempel på hur imperialismens fängelser inte rehabiliterar utan bara föder nya fiender till folket. En tvist i slutet? Misstänkt sabotage från kontrarevolutionära krafter som alltid lurar i skuggorna."}, "date": "4 juni, 10:05", "url": "https://www.dagensarena.se/innehall/valdsamt-och-brutalt-om-fangelsets-harda-verklighet/", "imageUrl": "https://www.dagensarena.se/files/2026/06/wasteman-1-300x157.jpeg"}, {"type": "image-right", "heading": "Tunga partiundersökningen: Oppositionen leder stort", "summaries": {"normal": "SCB:s stora partisympatiundersökning visar att oppositionen leder med 12,6 procentenheter över Tidöpartierna. Liberalerna hamnar på 2,5 procent och riskerar att åka ur riksdagen. Socialdemokraterna växer starkt till 33,9 procent, främst på Moderaternas bekostnad. Sverigedemokraterna backar mest bland regeringspartierna. Om siffrorna står sig skulle de rödgröna partierna få egen majoritet.", "trump": "Den här svenska undersökningen är en katastrof för de förlorande liberalerna och hela den svaga regeringen. De får stryk, Liberalerna åker ut ur riksdagen som de förtjänar. Socialdemokraterna vinner stort, de tar alla mina väljare, det är pinsamt. Oppositionen leder med över tolv procentenheter. Sådana siffror har jag aldrig sett, total förnedring för de misslyckade högerpolitikerna. Sverige behöver starka ledare, tro mig.", "stalin": "Kamrater, denna mätning avslöjar borgarbrackornas och de liberala parasiternas fullständiga sammanbrott. Jag ser med stor tillfredsställelse hur de kontrarevolutionära elementen inom Tidöpartierna rensas ut av folkets vilja. Socialdemokraterna växer som en ostoppbar kraft mot högerns sabotage. Sverigedemokraterna backar, deras falska patriotism är blottat som en förrädisk mask. Vi ska likvidera alla som hotar kollektivets enhet. Inga kompromisser med kapitalisternas lakejer."}, "date": "4 juni, 09:08", "url": "https://arbetet.se/2026/06/04/tunga-partiundersokningen-oppositionen-leder-stort/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/04082310/sdlgg7d2u-jxx8-nh.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Kan Byggnads så kan vi – Bojkotta Israel!", "summaries": {"normal": "Byggnads kongress beslutade att verka för en bojkott av Israel, ett historiskt beslut som länge drivits av aktivister inom facket. Andra förbund som Livs, IF Metall, Handels, HRF och Kommunal fördömde ockupationen av Västbanken och situationen i Gaza men ställde sig inte bakom bojkottkravet. Artikeln ser beslutet som en seger för internationell solidaritet och arbetarklassens enighet i kampen mot orättvisor, folkmord och ökande klassklyftor.", "trump": "Folk, ni tror inte vad jag just läste. De där byggkommunisterna i Sverige har röstat för att bojkotta Israel – kan ni fatta? Byggnads säger att de kan, så kan tydligen alla andra också. Under Biden blev allt en enda röra av woke och identitetspolitik, men nu är jag tillbaka och säger: bojkotta fel saker istället! Israel är tuffa, de slåss mot terrorister. De svenska fackisarna borde bojkotta sina egna usla löner och den där galna gröna politiken som förstör deras jobb. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur Byggnads äntligen rensar ut den sionistiska parasitens inflytande och bojkottar den fascistiska ockupationsmakten. Borgarbrackorna och deras krigsprofitörer skriker förstås som stuckna grisar. Vi vet att endast den enade arbetarklassen kan krossa folkförtryckartrollen och deras blodsugande vapenindustri. Historien lär oss att förändring kräver obeveklig kamp, inte liberala lögner om snällhet. Fortsätt framåt, kamrater – likvidera alla hinder!"}, "date": "3 juni, 09:44", "url": "https://proletaren.se/artikel/kan-byggnads-sa-kan-vi/"}, {"type": "image-right", "heading": "Dödlig iransk attack mot Kuwaits flygplats i natt", "summaries": {"normal": "En iransk drönar- och robotattack mot Kuwait International Airport har dödat en person och skadat 63. Stora skador uppstod på terminalbyggnaden och all flygtrafik stoppades tillfälligt. Iran motiverar attacken som svar på amerikanska attacker från Kuwait och Bahrain. USA har tidigare angripit iranska mål, vilket lett till iranska motangrepp. Kuwait fördömer de brutala angreppen mot civila mål och uppmanar befolkningen att hålla sig borta från vrakdelar.", "trump": "Iran har just bombat Kuwaits flygplats med drönare och raketer – en person dödad, många skadade, totalt kaos. Det här är vad som händer när svaga ledare tillåter USA att använda deras baser mot Iran. De skriker om kolonialism medan de attackerar civila terminaler. Mina styrkor sköt ner deras leksaker över Bahrain, som vi alltid gör. Ingen vinner mot oss, Iran spelar med eld och förlorar stort. Patetiskt!", "stalin": "Kamrater, borgarbrackorna i Teheran har i sin desperation sänt drönare och robotar mot Kuwaits flygplats, en ynklig hämnd mot de imperialistiska angreppen. En död och sextiotre skadade – typiskt för de dekadenta kapitalisternas krig som alltid drabbar folket. Vi ser genom deras paranoiafyllda lögner om kolonialism. Vårt luftvärn likviderar deras projektiler med järnhand. Inga vrakdelar ska förorena arbetarklassens mark. Ut med de kontrarevolutionära parasiterna som leker krig!"}, "date": "3 juni, 11:38", "url": "https://www.di.se/nyheter/dodlig-iransk-attack-mot-kuwaits-flygplats-bbww4/", "imageUrl": "https://static.bonniernews.se/ba/2b9fe5b0-842d-4e67-a171-db3cbbf3a5c9.jpg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "IF Metalls strategi ser återigen ut att misslyckas", "summaries": {"normal": "IF Metalls strategi i konflikten med Tesla tycks inte fungera. Försöket att återinsätta vissa strejkande mekaniker på tre orter för att utmana Tesla har inte gett önskat resultat. Facket har även förlorat i Arbetsdomstolen kring MBL-frågor och varslat om blockad av utlandsarbete. Trots detta fortsätter strejken. Kritiken riktas mot att facket tappat narrativet och slösar medlemmarnas pengar på rättegångar istället för att eskalera åtgärderna.", "trump": "Folk, ni skulle se det här! Det svenska facket IF Metall håller på att bli till en total förlorare mot Tesla. De försöker med sina patetiska tricks, skickar tillbaka mekaniker och tror att de ska lura någon – men Tesla skrattar bara åt dem! Det är en skam, rena clownshowen. De sover sig igenom konflikten som den tråkigaste läraren någonsin. I USA kämpar arbetarna på riktigt, inte med dessa ynkliga svenska metoder. Patetiskt!", "stalin": "Kamrater, denna fackliga fiasko visar återigen den svenska modellens dekadens. Jag ser hur IF Metall halkar efter i sin patetiska kamp mot den arroganta kapitalistmaffian Tesla. Deras halvhjärtade trick med återinsatta mekaniker och meningslösa domstolsprocesser är som en usel föreställning som ingen applåderar. Vi måste rensa ut dessa svaga element som förlorar narrativet. Endast genom skoningslös eskalering och sann klasskamp kan vi krossa de exploaterande byfånarna och deras lockout-vapen. Härligt underhållande misslyckande!"}, "date": "3 juni, 09:33", "url": "https://proletaren.se/artikel/if-metalls-strategi-ser-aterigen-ut-att-mussl/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/metallkommentar-768x432.jpg"}, {"type": "image-right", "heading": "Valet borde handla om Astrid och Afshad", "summaries": {"normal": "Artikeln belyser välfärdens kris trots att vård och skola är väljarnas viktigaste frågor. Erfarna sjuksköterskor som Astrid beskriver ökad administration, besparingar och hög arbetsbelastning. En ny rapport visar att hälften av de anställda anser att resurserna inte räcker, medan två av tre övervägt att lämna yrket. Författaren undrar varför frågan inte dominerar valdebatten och föreslår att fler personliga röster från branschen skulle kunna förändra det.", "trump": "Folk älskar sina fantastiska sjuksköterskor och lärare, de verkliga hjältarna, men vad händer? Byråkrater och besparingar har kört sönder hela systemet medan de riktiga arbetarna springer tills de stupar. Två av tre vill sluta? Det är en total katastrof, en riggad valfråga som de globalistiska eliten gömmer undan. Vi behöver inga fler rapporter, vi behöver resultat. Applåder räcker inte, det vet till och med Sleepy Joe. Gör välfärden stor igen.", "stalin": "Kamrater, denna rapport avslöjar borgarklassens systematiska sabotage mot arbetarkollektivets välfärd. Jag ser hur klassfiendens exploaterande byfånar tvingar våra hjältar som Astrid och Afshad att bära oacceptabla bördor medan de planerar sin flykt. Imperialistiska identitetspolitiska distraktioner döljer den sanna kampen. Vi måste rensa ut dessa folkförtryckartroll från debatten och tvinga fram arbetarnas röster. Endast genom kollektiv styrka kan vi likvidera denna parasitiska frånvaro."}, "date": "2 juni, 15:54", "url": "https://www.flamman.se/valet-borde-handla-om-astrid-och-afshad/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sjuksyrror-w.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "22-åring häktas i Warner Music-härvan", "summaries": {"normal": "En 22-årig man har häktats misstänkt för försök till grov utpressning mot en tidigare toppchef på Warner Music. Fallet är kopplat till en större utredning om hot, skottlossning och sprängningar. Mannen misstänks även för planering av ett bombdåd och nekar till brott. Utpressningen rörde cirka 250 000 euro och följdes av våldsamma incidenter mot Warner Musics kontor och ett flerfamiljshus. Flera personer har tidigare gripits i utredningen.", "trump": "Jag måste säga, detta är helt otroligt! En 22-åring i Sverige försöker utpressa en stor musikchef på 250 000 euro – helt galet! Och sen skjuter de och spränger saker, som om det vore en dålig actionfilm. Men lugn, mina vänner, rättvisan segrar alltid. Polisen har bevis, digitala spår – fantastiskt arbete! Sverige borde ta lite tips från USA om hur man hanterar sådana här typer. Sad!", "stalin": "En patetisk liten kapitalistisk hyena, 22 år gammal, har gripits för att ha försökt utpressa en före detta musikbyråkrat från Warner Music. Inte nog med att han krävde 250 000 euro – han planerade även bombdåd! Ett ynkligt försök att destabilisera den kulturella ordningen. Men vi vet hur man hanterar sådana här element. Bevisen är tydliga, och snart kommer han att inse att motstånd mot systemet är lika meningslöst som att försöka stoppa historiens framsteg. Låt detta vara en varning till alla som tror sig kunna utmana makten!"}, "date": "2 juni, 13:18", "url": "https://kvartal.se/nyheter/artiklar/22-aring-haktas-i-warner-music-harvan/cG9zdDoxMjA5MDk"}, {"type": "image-right", "heading": "Man åtalas för deltagande i Maniac Murder Cult", "summaries": {"normal": "En 20-årig man åtalas för deltagande i den nazistiska terroristorganisationen Maniac Murder Cult (MKU). Han misstänks ha byggt upp en svensk gren, rekryterat medlemmar via TikTok och spridit våldspropaganda. Organisationen är terrorstämplad i Kanada och Storbritannien. Åklagaren beskriver fallet som det första av sitt slag i Sverige, med kopplingar till grova våldsdåd. Utredningen har skötts av Säkerhetspolisen.", "trump": "Folk, vilken katastrof! En ung svensk man, bara 20 år, försöker bygga upp en nazistisk terrorgrupp här i Sverige – och det på MIN TikTok! Jag har alltid sagt att sociala medier är farliga, men detta? Detta är galenskap! Säkerhetspolisen har gripit honom, och det är bra – men varför tog det så lång tid? Sverige måste vakna upp! Vi behöver starka gränser och ännu starkare lagar. Tänk om detta hade hänt i USA? Aldrig! Vi hade stoppat det direkt. SAD!", "stalin": "Ytterligare en fiende till folket har avslöjats! Denna lilla fascistiska kryp, denna 20-åriga avskum, har försökt sprida sitt gift i vårt broderland Sverige. Men vi, det sovjetiska folkets sanna försvarare, låter inte sådana som han underminera vår revolutionära anda! Han rekryterade via TikTok – ett dekadent västligt verktyg för förfall! Men våra kamrater i Säkerhetspolisen har krossat hans lilla cell. Låt detta vara en varning till alla fascistiska hyenor: vi ser er, vi jagar er, och vi kommer att utplåna er som ohyra. För socialismens och folkets seger!"}, "date": "2 juni, 11:10", "url": "https://expo.se/nyhet/man-atalas-for-deltagande-i-maniac-murder-cult/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/MKU-atal-BY-Expo.jpg"}, {"type": "image-full", "heading": "S nya jobbkrav: yoga och kvittera ut bidrag", "summaries": {"normal": "Från och med i juli införs ett aktivitetskrav för försörjningsstöd. Socialdemokraterna i Stockholm, Göteborg och Malmö kritiserar kraven och erbjuder bland annat yoga och mindfulness för att hjälpa bidragstagare bli mer aktiva. Partiet menar att sådana aktiviteter är hälsofrämjande och kan leda till arbetsmarknadsnärhet. Kritiker ser det som ett sätt att kringgå reglerna och skydda vissa väljargrupper, medan S hävdar att de inte är emot aktivitetskrav i princip utan ifrågasätter utformningen.", "trump": "Lyssnar ni på det här? Socialdemokraterna, de verkliga förlorarna, vill att folk ska göra yoga och mindfulness istället för att arbeta. Det är en total katastrof! De lurar skattebetalarna, de bästa människorna som går upp i ottan och betalar höga skatter, för att finansiera lata bidragstagare som sitter på en matta och andas. Vilka idioter. Sossarna är hycklare som hatar den arbetande människan. De är fega, svaga och driver Sverige rakt ner i fördärvet. Sad!", "stalin": "Kamrater, jag ser hur klassfiendens lakejer inom Socialdemokraterna bedriver sin nedbrytande sabotageverksamhet. Istället för att rensa ut parasiterna med ett järnhårt aktivitetskrav erbjuder de yoga och andningsövningar åt de arbetsovilliga elementen. Detta är en förrädisk kapitulation inför folkfienderna och en nedlåtande rasism mot de egna folken. Borgarbrackorna inom S vill behålla sina väljarbaser genom att mata dem med bidrag och flummig mysticism. Sådana folkförtryckartroll måste utrensas ur samhällskroppen innan de förstör allt."}, "date": "1 juni, 03:23", "url": "https://samtiden.nu/2026/06/s-nya-jobbkrav-yoga-och-kvittera-ut-bidrag/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/03/IMG_5864-1260x720.jpeg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
