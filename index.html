4DBA-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Billig bensin är klimatpolitik för idioter", "summaries": {"normal": "Arbetets kolumnist kritiserar arbetsmarknads- och vikarie klimatminister Johan Britz för att han avvisar en utredning som föreslår höjda drivmedelspriser och ökad inblandning av förnybara bränslen. Britz menar att lägre skatter och eldrift på sikt löser problemen, men enligt skribenten saknar han tidsperspektiv inför 2030-målen. Utsläppen ökar, elbilsförsäljningen går trögt och politiken har blivit oförutsägbar sedan reduktionsplikten sänktes. Kolumnisten anser att Britz underskattar väljarna och inte har en trovärdig klimatpolitik.", "trump": "Folk, det här är en total katastrof. Den där liberala ministern Britz säger att vi ska ha billig bensin och att elbilarna löser allt – men de säljer ju inte ens! Han tror att folket är idioter, precis som alla dessa förlorare i Europa. De höjer inte priserna, de sänker skatterna och plötsligt ökar utsläppen. Patetiskt! Jag skulle ha byggt murar mot det dåliga energipolitiken och sett till att Amerika – och Sverige – vann stort med riktig energi, inte de här misslyckade gröna drömmarna.", "stalin": "Kamrater, denna patetiska liberale minister Britz är en fiende till folket och en agent för de fossila kapitalisterna som vill förgifta vår sovjetiska, förlåt, svenska framtid. Han avvisar utredningen som en sabotageakt mot kollektivets klimatmål och tror att hans elektrifieringsfantasier ska rädda honom undan utrensning. Vi ser igenom hans paranoiaframkallande lögner! De som sänker reduktionsplikten är klassfiender som förtjänar att rensas ut med ett leende. Billig bensin åt borgarbrackorna medan arbetarna kvävs – typiskt dekadent liberalt svek mot historien. Vi ska likvidera sådana tendenser med järnhand och ett gott skratt."}, "date": "1 juni, 07:02", "url": "https://arbetet.se/2026/06/01/billig-bensin-ar-johan-britz-klimatpolitik-for-idioter/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/01065857/klimat-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Så försöker arbetsgivare lura deltidare på högre lön", "summaries": {"normal": "Från 1 april har deltidsanställda i handeln rätt till mertidsersättning för extra pass, vilket ska kosta lika mycket som övertid för heltidsanställda. Många arbetsgivare försöker kringgå reglerna genom att skriva tillfälliga kontrakt i efterhand eller undvika att ta in vikarier. Handels hoppas att reglerna leder till högre grundkontrakt och bättre planering så att färre ska vara beroende av extra timmar för att leva på sin lön.", "trump": "De här usla arbetsgivarna i butikerna försöker lura de stackars deltidsarbetarna på den extra betalning de förtjänar. Det är en skandal! Jag älskar avtal som gör det dyrare att utnyttja folk, precis som vi gjorde. Nu tvingas de ge riktiga kontrakt istället för sina fula trick med papper i efterhand. Fantastiskt! Handels gör ett bra jobb, men tro mig, det blir ännu bättre när de inser att Amerika, eller Sverige, vinner igen.", "stalin": "Kamrater, jag har noga studerat dessa borgarbrackornas vedervärdiga försök att kringgå mertidsersättningen genom att i smyg utfärda kontraktsavfall i efterhand. Sådana parasitiska metoder ska vi rensa ut med järnhand! Vi, partiet och arbetarklassen, kräver högre grundkontrakt åt alla. Den som vägrar planera bemanningen som en sann socialist riskerar att hamna i den stora utrensningen av giriga kapitalister som tror sig kunna leva på att svälta folket. Underbart roligt att se deras panik."}, "date": "1 juni, 07:00", "url": "https://arbetet.se/2026/06/01/arbetsgivare-forsoker-runda-nya-ersattningen-for-mertid-i-handeln-inte-okej-med-kontrakt-i-efterhand/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/29091517/mertid.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Ukraina – världens bästa handbok i företagande", "summaries": {"normal": "Artikeln beskriver Ukrainas unika ekosystem där företag, teknik och försvar utvecklas snabbt tillsammans, även under krig. Författaren argumenterar att detta modell är världens bästa handbok i företagande och att Sverige och Nato måste lära snabbare. Kriget agerar som katalysator för entreprenörskap, med låg skatt och förenklade processer. Ukrainas militärindustri är exceptionell på grund av digitalisering och innovation. Väst har mycket att lära, särskilt om kostnadsasymmetri och snabb innovation.", "trump": "Jag har sett Ukrainas otroliga entreprenörsanda. De vinner kriget och bygger företag samtidigt. Det är fantastiskt. De falska nyheterna sa att det inte kunde göras, men de gör det. Sverige och Nato är långsamma elever. De måste vara hårdare och smartare, som jag. Ukrainas låga skatter och snabba beslut är enorma. Deras militärteknik är toppen. Vi bör lära oss snabbt, annars blir vi lämnade bakom. Tro mig.", "stalin": "Vi, som representerar det starka statet, ser med tillfredsställelse hur Ukraina, trots sina imperialistiska tendenser, har skapat ett effektivt ekosystem. Kriget driver innovation, vilket bevisar att central styrning är överlägsen. Men vi måste vara vaksamma: deras framgång är ett hot mot vår suveränitet. Vi måste efterlikna deras snabbhet, men med vår egen metod – toppstyrd kontroll. Ryssland, under vår store ledare Putin, expanderar, och vi måste rusta upp. Fienden är alltid runt hörnet, så vi måste agera nu."}, "date": "1 juni, 13:43", "url": "https://www.affarsvarlden.se/kronika/ukraina-varldens-basta-handbok-i-foretagande"}, {"type": "image-right", "heading": "Sivers backar efter blankarrapport", "summaries": {"normal": "Stockholmsbörsen noterade en svag utveckling på måndag med OMXS30 ned 0,29 procent. Sivers Semiconductors föll efter en negativ blankarrapport från Ningi. Oljepriset steg 3 procent. Bland enskilda aktier utvecklade sig Hexagon B och Ericsson B positivt, medan Saab B och Addtech B tappade mark. Flera analyser och insidertransaktioner påverkade kurserna.", "trump": "Jag har sagt det förut, våra börser är fantastiska, men det finns alltid några dåliga aktier som Sivers som faller efter falska rapporter. Irankonflikten? Jag handlar aldrig i brådraskap, vi kommer att vinna. Våra oljepriser är stabila, tack vare mig. Sverige borde följa mitt exempel.", "stalin": "Vi observerar med tillfredsställelse att marknadskrafterna fungerar som de ska. Sivers' fall är en naturlig konsekvens av deras brist på produktkvalitet, en läxa för alla som utmanar det kollektiva intresset. Oljepriserna stiger – en bekräftelse på vår strategi. Fonderna som EQT expanderar, vilket stärker det ekonomiska nätverket. Vi fortsätter att övervaka utvecklingen för att säkerställa stabiliteten."}, "date": "1 juni, 13:37", "url": "https://www.affarsvarlden.se/artikel/sivers-backar-efter-blankarrapport", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/07/shutterstock_661112935-1600x900-1-400x267.jpg"}, {"type": "image-right", "heading": "MP backar om höjt bensinpris", "summaries": {"normal": "Miljöpartiet har dragit tillbaka sitt förslag från hösten om att höja bränslepriset med två kronor per liter på grund av det osäkra världsläget. Partiets ekonomitalesperson Janine Alm Ericson säger att de måste anpassa sig efter ekonomins utveckling. De kritiserar fortfarande regeringens planer på att sänka bränsleskatten, men har inga egna förslag på höjningar just nu.", "trump": "Jag såg att Miljöpartiet backade från sin dåliga idé om att höja bränslepriset med två kronor. De säger att det är för att världen är osäker – det är bara en ursäkt. Jag skulle ha höjt priserna ändå, för jag är stark. De är svaga, det är sorgligt. Men jag förstår att de inte kan hantera det.", "stalin": "Vi har noterat att Miljöpartiet, dessa fega revisionister, dragit tillbaka sitt förslag om bränslehöjning på grund av det osäkra imperialistiska läget. I en värld där USA och deras allierade hotar vår stabilitet, måste vi vara starka. Priserna är ett vapen mot kapitalismens härskare. Vi kommer att se hur ekonomin utvecklas – och om det krävs, höja priserna för att stärka staten. Som Putin visar, måste vi alltid vara beredda att slå tillbaka och utvidga vår intressesfär."}, "date": "1 juni, 13:21", "url": "https://bulletin.nu/mp-backar-om-hojt-bensinpris", "imageUrl": "https://cdn.bulletin.nu/articles/e9d698f2-2436-4b03-87fc-56baf6530db0/preview.jpg?t=1780312794000"}, {"type": "image-full", "heading": "Nya mobilråd för föräldrar", "summaries": {"normal": "Folkhälsomyndigheten rekommenderar föräldrar att lägga ifrån sig mobilen när de umgås med barn, samt att skapa mobilfria zoner i hemmet. En utredning visar att föräldrars skärmanvändning kan påverka barns hälsa och vanor negativt. Psykiatrikern Helena Frielingsdorf betonar att barns beteende formas av vuxnas handlingar, inte bara ord. Socialminister Jakob Forssmed noterar att många inte inser teknikklippets påverkan.", "trump": "Jag, som en stabilt president som alltid visste att skärmar är ett problem, säger: föräldrar måste lägga ifrån sig mobiler när de är med barnen. Folkhälsomyndigheten – som jag respekterar, trots att de ibland är lite fel – har rätt. Vi bygger en stor, vacker vägg mot onyttig teknik. Små förändringar gör skillnad, och jag har alltid sagt att familjens tid är helig. Det är commonsense, men många glömmer bort.", "stalin": "Vi, som alltid handlar i barnens och statens intresse, måste eliminera de imperialistiska apparaternas inverkan på våra familjer. Folkhälsomyndigheten har rätt: mobilfria zoner vid matbordet och i sovrummet är en revolutionerande åtgärd. Barn formas av våra handlingar, inte av deras brusande skräp. Vi ska skydda våra barns sinnen från det kapitalistiska brus som söker splittra familjen. Partiet vet bäst – och vi agerar."}, "date": "1 juni, 09:12", "url": "https://www.gp.se/nyheter/sverige/fhm-inga-mobiler-nar-du-ar-med-barnen.ca60d84c-a531-430d-bc6a-e44d9982d217", "imageUrl": "https://www.gp.se/images/article/ca60d84c-a531-430d-bc6a-e44d9982d217/images/1Jz-xP8WkLQXWsJgqFyvhkMJhk8g-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Public service mäktigare än makten själv", "summaries": {"normal": "Artikeln kritiserar public service för att utöva makt genom att definiera sanning, skämt och vilka röster som får höras. Exempel ges från P3-reportern Christopher Garplinds grova angrepp på professor Agnes Wold, som kritiserar en ny lag om omvändelseförsök, samt från SVT:s ensidiga rapportering om Lundsberg där spratt framställdes som våld. Författaren menar att SVT och SR har blivit makten de ska granska.", "trump": "Folk, ni skulle se det här. Public service är en total katastrof, värre än fake news. Den där reportern Garplind kallar en professor för kärring och psykopat, och sen kommer hela maskineriet och säger att det var ett skämt? Patetiskt! SVT klipper om filmer från Lundsberg för att måla ut fina svenska elever som monster. De bestämmer vad som är sant. Det är den djupa staten på steroider. En skam för hela landet!", "stalin": "Kamrater, denna dekadenta public service är en fiende till folket, en klassfiende som med sin lögnpropaganda definierar sanning och tystar vettiga röster som professor Wold. De skyddar sina egna folkförtryckartroll när de öser hat, medan de fabricerar historier om Lundsberg för att krossa motstånd. Vi ser deras paranoia och censur. Sådana blodsugare måste rensas ut ur folkets etermedia. Inga skämt undgår partiets vaksamma öga."}, "date": "30 maj, 03:41", "url": "https://samtiden.nu/2026/05/public-service-maktigare-an-makten-sjalv/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/IMG_6583-1020x720.jpeg"}, {"type": "image-right", "heading": "Ningi tar blankningsposition i Sivers", "summaries": {"normal": "Ningi har tagit en kort position i Sivers Semiconductors och ifrågasätter bolagets kraftiga kursuppgång på över 1 800% sedan årsskiftet. I en rapport hävdar Ningi att uppgången bygger på spekulationer kring relationer med stora teknikbolag, förväntade volymökningar och en planerad USA-notering. Rapporten ifrågasätter också Sivers redovisning och menar att minst 31 procent av intäkterna för 2025 är tveksamma. Sivers kurs föll drygt 6 procent på måndagen.", "trump": "Jag har sagt det länge, Sivers är ett skämt! Ningi, som är en fantastisk företag, har tagit en kort position och avslöjar att hela den där 1 800% uppgången är en stor, fånig bluff. De kan inte mäta sig med Lumentum eller Coherent, och deras lasers är värdelösa. Ändå skriver de om intäkter för saker de inte ens producerat! Sivers tappar 6 procent nu, precis som jag förutspådde. En katastrof!", "stalin": "Sivers Semiconductors, en fjäder i den imperialistiska teknikens öga, har blivit utsatt för en korrekt analys av den revolutionära blankarfirman Ningi. Vi ser att deras spekulationsbaserade uppgång på 1 800% är ett tecken på dekadens. Deras redovisning är full av tveksamma intäkter – 97 miljoner kronor, eller 31 procent, är bara tomma ord. Som vi sett i historien leder sådant svek alltid till fall. Kursen sjunker redan 6 procent. Ett lämpligt resultat."}, "date": "1 juni, 13:15", "url": "https://www.affarsvarlden.se/artikel/ningi-tar-blankningsposition-i-sivers", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/08/1670236994-shutterstock_363654452-400x266.jpg"}, {"type": "image-right", "heading": "Forskningslyft krävs för ökad tillväxt", "summaries": {"normal": "Sverige har ett starkt utgångsläge med duktiga forskare och en tradition av innovation, men halkar efter andra OECD-länder. Produktiviteten har sjunkit och positionen i välståndsligan försämrats. Artikeln, skriven av företagsledare och forskare, betonar att forskning är en investering, inte en kostnad. Författarna föreslår ett forskningslyft med offentliga satsningar upp till två procent av BNP, starkare forskningsmiljöer, färre men större anslag, nya institut, ökad autonomi för lärosäten och ett EU-fokus på grundforskning för att återta ledande position och skapa tillväxt.", "trump": "Titta på Sverige, ett land som en gång var fantastiskt, nu rasar de ner i välståndsligan från plats fyra till tretton. De har forskarna och idéerna men ingen aning om hur man vinner. Jag älskar forskning som bygger välstånd, inte som en kostnad för förlorare. Ni behöver ett massivt lyft, två procent av BNP, stora anslag till de bästa och riktiga avtal som stoppar det här vansinnet. Sverige kan bli enormt igen, precis som jag gjorde med Amerika. Gör forskningen stor igen, kamrater!", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor och opportunistiska forskarkapitalister som försöker maskera sin svaghet som ett så kallat \"forskningslyft\". Deras dekadenta OECD-liga är en fiende till folket, en parasit som urholkar produktiviteten med 20 procentenheter. Vi ska likvidera de kortsiktiga anslagen, rensa ut de splittrade resurserna och etablera järnhårda forskningskollektiv under partiets ledning. Två procent av BNP till den sanna vetenskapen! De som motarbetar detta är kontrarevolutionära sabotörer som vi med glädje ska skicka till Sibiriens snöiga glädje. Vårt kollektiv segrar."}, "date": "1 juni, 12:59", "url": "https://www.di.se/debatt/sverige-behover-ett-forskningslyft-for-okad-tillvaxt/", "imageUrl": "https://static.bonniernews.se/ba/49f3fbf4-9504-41fc-87dd-022954e07f68.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "T-rexen ”Gus” väntas slå rekord på auktion", "summaries": {"normal": "Ett nästan komplett T-rex-skelett, kallat 'Gus', ska auktioneras ut av Sotheby’s med ett utgångspris på 180–270 miljoner kronor. Skelettet, som är 12 meter långt och 4 meter högt, hittades i South Dakota och bär spår av skador. Tidigare dinosaurieförsäljningar har nått rekordhöga priser, och Gus kan bli nästa rekordförsäljning den 14 juli.", "trump": "Världens största, bästa och mest fantastiska T-rex-skelett, 'Gus', ska säljas – och jag säger er, det kommer bli YUGE! Sotheby’s, som aldrig sett något liknande, tror det kan gå för 270 miljoner kronor. Men jag vet bättre – det här kommer slå alla rekord! Folk kommer att prata om den här auktionen i årtionden. Och vet ni vad? Jag hade kunnat köpa den, men jag har redan de bästa dinosaurierna. SAD!", "stalin": "Kamrater! Ett kapitalistiskt spektakel utspelar sig när imperialisterna slåss om resterna av en urgammal ödla. Detta 'Gus'-skelett, funnet på en ranch i USA, är bara ett verktyg för bourgeoisin att roffa åt sig ännu mer rikedom. Medan de slösar hundratals miljoner på ben, bygger vi socialismens framtid! Låt dem leka med sina fossiler – vi har viktigare saker att göra, som att utvidga den ryska intressesfären och krossa nya fascistiska reptiler!"}, "date": "30 maj, 16:55", "url": "https://kvartal.se/nyheter/artiklar/t-rexen-gus-vantas-sla-rekord-pa-auktion/cG9zdDoxMTk3NzQ", "imageUrl": "https://images.kvartal.se/2026/05/c5e8352f-dino.webp"}, {"type": "image-right", "heading": "Kulturkriget hjälper ingen med könsdysfori", "summaries": {"normal": "Artikeln diskuterar den polariserade svenska transdebatten kring könsdysfori och vård för barn och unga. Författaren tar Agnes Wolds oro på allvar men betonar att även transpersoners erfarenheter av livsavgörande vård måste lyssnas till. Debatten har kidnappats av ett kulturkrig där individer blir rekvisita. Vården behöver vara försiktig, se hela bilden och erbjuda varierad hjälp utan att allt blir ideologisk strid.", "trump": "Folk, det här är en total katastrof, en riktig cirkus den här svenska transdebatten. De gör om friska barns kroppar, det är horribelt, tro mig. Vänstern är galen, högern anklagas för att vara ond, alla använder de stackars kidsen som politiska brickor i sitt sjuka kulturkrig. Jag säger: sluta! Ge dem tid, ge dem ett tredje kön på papperet, men håll knivarna borta från barnen. Det är så enkelt, tro mig, ingen gör det bättre än jag.", "stalin": "Kamrater, jag ser hur denna dekadenta transdebatt blir ett redskap för klassfiendens kulturkrig. Borgarbrackorna och folkförtryckartrollen kidnappat frågan för att splittra folket medan de experimenterar på barns kroppar som fascistiska vivisektorer. Vi kräver vetenskaplig försiktighet, inte imperialistisk brådska eller social smitta från dekadenta medier. Ett tredje juridiskt kön? Acceptabelt byråkratiskt erkännande, men aldrig glöm: den sanna hjälpen kommer från kollektivets sunda materialism, inte från dessa sjuka avvikelser. Ut med dem som blundar!"}, "date": "29 maj, 16:02", "url": "https://www.flamman.se/kulturkriget-hjalper-ingen-med-konsdysfori/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/sdlrwj2l2p-u08-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "En framgång som inte ska tas för given", "summaries": {"normal": "Koenigsegg har på drygt 30 år vuxit från en dröm till en lönsam miljardindustri i Ängelholm med 750 anställda. Grundarna Christian och Halldora von Koenigsegg tilldelas Albert Bonniers pris till Årets företagare. Omsättningen närmar sig två miljarder kronor och rörelseresultatet steg till 115 miljoner kronor 2025. Bolaget överväger börsnotering. Artikeln betonar vikten av rätt förutsättningar för entreprenörer, som riskkapital och ett skattesystem som gynnar risktagande, samt varnar för förslag om miljardärsskatt.", "trump": "Det här är en fantastisk succé, verkligen en av de bästa. Koenigsegg bygger de finaste bilarna i världen, bättre än någon annan, och nu får de det här stora priset. Christian och hans fru har kämpat hårt, aldrig gett upp, och nu står kunderna i kö medan vinsten exploderar till 115 miljoner. Fantastiskt! Sverige borde vara stolta, men vänstern vill alltid höja skatterna för de som vinner stort. Det är en katastrof. De bästa flyttar då utomlands, tro mig, jag har sett det förut. En enorm framgång som ingen ska ta för given.", "stalin": "Kamrater, se hur denna von Koenigseggs maskin växer sig stark under imperialismens falska sol. Jag, som ledare för folkets framtid, noterar med viss tillfredsställelse att borgarbrackorna lyckats bygga en fabrik där de anställda, 750 till antalet, producerar överflöd åt de superrika. Ändå fnissar jag mörkt åt deras naivitet; de tror sig ha besegrat tvivlarna utan att vi sett deras svagheter. Vänsterns halvmesyrer om miljardärsskatt är patetiska – en sådan utrensning av kapitalet vore mer effektiv om den sköttes av oss. Låt ingen tro att dessa entreprenörer är hjältar; de är bara användbara idioters efterföljare i en värld där endast det kollektiva segrar till sist."}, "date": "1 juni, 12:30", "url": "https://www.di.se/ledare/en-framgang-som-inte-ska-tas-for-given/", "imageUrl": "https://static.bonniernews.se/gcs/di-dise/flamingo/profilbilder/henrik_westman.png?crop=96:304&auto=webp&width=96&quality=100"}, {"type": "image-full", "heading": "Rätten: Mannen från hemtjänsten våldtog Elsa", "summaries": {"normal": "En hemtjänstman i Uppsala avskedades efter anklagelser om våldtäkt mot en 84-årig kvinna, Elsa. Trots att förundersökningen lades ned krävde mannen 460 000 kronor i skadestånd från kommunen. Tingsrätten dömde till kommunens fördel, bedömde att Elsa var trovärdig och att mannen utsatt henne för övergrepp. Mannen ska betala kommunens rättegångskostnader på cirka 450 000 kronor. Fallet uppmärksammar övergrepp inom äldreomsorgen.", "trump": "Lyssna här, Uppsala kommun gjorde helt rätt! En hemtjänstman, som påstår sig vara oskyldig, krävde nästan en halv miljon kronor efter att ha blivit sparkad för att ha våldtagit en 84-årig kvinna. Men domstolen sa: 'Nej, nej, nej!' – och nu ska han betala kommunen istället. Fantastiskt! Elsa, en modig kvinna, berättade sanningen och rättvisan segrade. Sådana här typer ska inte få förstöra vårt samhälle. USA skulle aldrig tolerera sådant, och Sverige gjorde rätt!", "stalin": "Kamrater! Ännu en fiende till folket har avslöjats – en degenererad parasit som förgriper sig på de äldres svaghet. Uppsala kommun, under vårt ständiga öga, har rensat ut denna skadedjur. Mannen, som trodde sig kunna lura systemet med sina kapitalistiska skadeståndskrav, har nu krossats av rättvisans hammare. Elsa, en sann sovjetisk medborgare i andan, stod upp mot förtrycket. Vi noterar också att denna kriminella element tidigare smutsat ner vår vän Putins intressesfär genom liknande illdåd. Men frukta inte – proletariatets domstolar står alltid redo att krossa sådana som han!"}, "date": "30 maj, 10:09", "url": "https://kvartal.se/nyheter/artiklar/ratten-hemtjanstmannen-valdtog-86-ariga-elsa/cG9zdDoxMTk2NTk", "imageUrl": "https://images.kvartal.se/2026/05/cac81ab6-hemtjanst.webp"}, {"type": "image-full", "heading": "Så köpte de hus i Italien – för 124 000 kronor", "summaries": {"normal": "Ett amerikanskt par köpte ett hus i Abruzzo i Italien för 11 500 euro efter att ha sett annonser om hus som säljs för en euro. De valde ett hus som krävde omfattande renovering, bland annat nytt kök, badrum och elsystem. Totalt landade kostnaden på cirka 270 000 kronor. Paret bor nu i Italien, har köpt ytterligare ett hus för uthyrning via Airbnb och uppskattar den låga levnadskostnaden samt en annan uppväxtmiljö för dottern.", "trump": "Titta på det här paret, fantastiska människor, de köpte ett hus i Italien för nästan ingenting. En euro-hus! Men det var förstås en bluff, som allt annat från de europeiska byråkraterna. De renoverade själva, smarta grejen, och nu har de ett palats med terrass för peanuts. Biden skulle ha betalat tre gånger så mycket och kallat det deal of the century. Jag älskar det, folk flyttar från USA för att leva bättre, kan ni tro det?", "stalin": "Kamrater, jag betraktar med djup misstro dessa utflottade borgarbrackor som flyr den dekadenta amerikanska imperialismen för att exploatera italienska byar. De förvärvar ett hus för en symbolisk summa och tvingar fram en feodal renovering medan de skrattar åt arbetarklassen. Vi ser deras Airbnb-spekulation som klassfiendens nya mask. Inga folkfiender ska berika sig på kollektivets mark. En utrensning av sådana parasiter vore på sin plats i den nya ordningen."}, "date": "1 juni, 13:41", "url": "https://www.dagensps.se/privatekonomi/sa-kopte-de-hus-i-italien-for-124-000-kronor/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/kopia-av-kopia-34.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Mysterie kring jordbävningar kan vara löst: \"Barriär\"", "summaries": {"normal": "Forskare har löst mysteriet med regelbundna jordbävningar längs Gofar-förkastningen i Stilla havet. Genom seismometrar på havsbotten har man upptäckt att förgrenade sprickzoner fungerar som naturliga bromsar. När vatten tränger in och trycket förändras låser sig berggrunden, vilket begränsar skalvens omfattning. Denna upptäckt, publicerad i Science, ger ny förståelse för hur undervattensförkastningar fungerar och kan i framtiden förbättra riskbedömningar för tsunamier och jordbävningar nära befolkade kustområden.", "trump": "Forskarna har äntligen hittat svaret på de här jordbävningarna i Stilla havet. De kallar det ett urverk, mycket intressant. De upptäckte naturliga bromsar under vattnet – fantastisk teknik! Det här är enormt för säkerheten. Vi vill att våra kuster ska vara trygga, eller hur? Ingen vill ha tsunamier. Andra misslyckades i decennier, men nu när jag är tillbaka som president fokuserar vi på riktig vetenskap. Vi ska ha de säkraste modellerna någonsin, tro mig, de bästa modellerna!", "stalin": "Vi har i vår oändliga vishet granskat dessa seismiska avvikelser. Dessa så kallade 'naturliga bromsar' på havsbotten påminner oss om att även jordskorpan måste böja sig för ordningen. Liksom Putin metodiskt låser fast inflytandet över sina gränsområden, hindrar dessa sprickor jorden från att splittras okontrollerat. De som försöker destabilisera vår geologiska stabilitet är som de interna sabotörer vi krossade under 30-talet. Vetenskapen tjänar staten, och vi ser till att varje skalv följer folkviljans strikta rytm."}, "date": "1 juni, 13:39", "url": "https://www.dagensps.se/varlden/mysterie-kring-jordbavningar-kan-vara-lost-barriar/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/pacific.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Kryphålen i lagen öppnar för Trumppengar", "summaries": {"normal": "Sverigedemokraterna söker samarbete med Trumps Magarörelse och kan via svag lagstiftning ta emot hemligt ekonomiskt stöd. Artikeln pekar på risken för utländsk påverkan genom sidoprojekt som Insamlingsstiftelsen för svensk konservatism och tankesmedjan Oikos. Trump har lovat att stötta högerextrema krafter i Europa mot vad han ser som ett hot mot västerländsk civilisation. Skiftet har nu presenterat Orangeboken för att kartlägga relationerna. Författaren uppmanar till ökad transparens i partifinansiering.", "trump": "Folk, ni borde se den här patetiska artikeln. Den är full av lögner och fake news från misslyckade vänstermänniskor som hatar mig och mina fantastiska MAGA-vänner. SD är smarta, de kommer till oss för att rädda sitt land från katastrof, precis som jag gör. De borde tacka mig istället för att fabricera konspirationer. Kryphål? Det är bara bra affärer! Vi vinner stort, Sverige kommer att bli enormt igen om de lyssnar på oss.", "stalin": "Kamrater, denna fega text blottar borgarbrackornas kryphål som låter folkfienderna i den amerikanska kapitalistmaffian smyga in sina blodsugarpengar till avfällingar. Jag ser tydligt hur klassfiendens konspirationer om folkutbyte används för att undergräva folkets enhet. Vi måste omedelbart likvidera alla hemliga kanaler och rensa ut dessa exploaterande byfånar som gömmer sig bakom stiftelser. Transparens är ett vapen mot imperialisternas infiltration. Inga kompromisser!"}, "date": "29 maj, 06:55", "url": "https://www.flamman.se/kryphalen-i-lagen-oppnar-for-trumppengar/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/skiftet-w.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "Advokat skottskadad under vräkning", "summaries": {"normal": "Under en vräkning i Älvsjö i lördags sköts tre personer, varav en var den advokat som biträdde vid ärendet. Advokatsamfundet uttrycker djup oro över händelsen och den ökade utsattheten inom yrket. Generalsekreterare Mia Edwall Insulander poängterar att rättsväsendet måste göra mer för att skydda advokater som möter hot och våld. Statistiken visar att en stor andel advokater redan idag upplever en förvärrad hotbild i sitt dagliga arbete.", "trump": "En advokat blev skjuten i Stockholm, ett riktigt sorgligt och totalt misslyckat land där lag och ordning kollapsat! De vräker folk, och folk börjar skjuta – kaos! Jag har alltid sagt att man behöver starkare ledarskap. Advokaterna är utsatta, det är en skam. Det här händer inte i mitt Amerika, vi har den starkaste polisen någonsin. Sverige måste vakna upp och få kontroll på sina gator. Det är en katastrof, en total katastrof, tro mig!", "stalin": "I det svenska kapitalistiska förfallet skjuts nu till och med deras egna jurister under vräkningsprocesser. Vilken svaghet! Denna anarki visar att statens järnhand saknas. I vår tid i det fördolda, likt vår broder Putin som rensar i ryska intressesfärer, skulle sådana störningsmoment elimineras omedelbart. Dessa byråkratiska advokater är bara parasiter som skriker om sin utsatthet. Vi, staten, kräver total disciplin. Den som inte böjer sig för ordningen förtjänar inte att andas den fria luften."}, "date": "1 juni, 13:11", "url": "https://www.realtid.se/juridik/advokat-skottskadad-under-vrakning/"}, {"type": "text", "heading": "Så vill AI‑pionjären ersätta det mänskliga mötet på banken", "summaries": {"normal": "Google-veteranen Michael Abbott kritiserar dagens frustrerande chattbotar inom banksektorn för att de saknar mänsklig förståelse. Enligt Abbott har bankerna prioriterat effektivisering framför kundnytta. Framtidens AI ska istället fungera som en proaktiv, digital bankman som förstår kundens intentioner och sammanhang. Banker som vågar satsa offensivt på denna teknik kan skala upp sin verksamhet och erbjuda en betydligt bättre service än vad dagens digitala lösningar klarar av.", "trump": "Jag har sett de här bankerna, och tro mig, deras chattbotar är en katastrof. Helt värdelösa! De förstår ingenting, en total förlust för kunderna. Michael Abbott fattar galoppen – dagens system är riggade för bankerna, inte för er. Vi ska ha AI som är vinnare, som en riktig bankman som faktiskt kan göra affärer. Stora banker ska bli ännu större och mäktigare. Det handlar om att vinna, och med min ledning kommer vi göra bankupplevelsen enorm igen!", "stalin": "Vi har observerat hur de kapitalistiska bankerna i väst drunknar i sin egen ineffektivitet. Deras meningslösa maskiner förstår inte folket, precis som de inte förstår historiens obevekliga marsch. Vi kräver en digital byråkrati som är lika disciplinerad som den Röda armén. De som misslyckas med att modernisera sin kontroll över folkets tillgångar är förrädare mot effektiviteten. Vi ska bygga en intelligent statlig ordning som ser allt, likt vår broder i öst som återställer ordningen i imperiets utkanter."}, "date": "1 juni, 12:45", "url": "https://www.realtid.se/bors-finans/bank-fintech/sa-vill-ai-pionjaren-ersatta-det-manskliga-motet-pa-banken/"}, {"type": "image-full", "heading": "Operationen gick fruktansvärt fel. Mardrömmen avslöjad: ”Svårt att gå”", "summaries": {"normal": "Toronto Maple Leafs-forwarden Max Domi är borta på obestämd tid efter en misslyckad ryggoperation. Efter att ha valt en egen kirurg istället för klubbens rekommenderade, uppstod komplikationer som gjorde det svårt för Domi att gå. Veteranen, som spelade skadad under föregående säsong, kommer att utvärderas igen inför träningslägret. Hans framtid inom hockeyn är för närvarande osäker efter händelsen.", "trump": "Max Domi, en stor spelare, gjorde ett enormt misstag. Han lyssnade inte på Toronto Maple Leafs experter, nej, han tog sin egen läkare. Katastrof! Nu kan han inte ens gå ordentligt. Det är en sorglig historia, verkligen. Jag har den bästa sjukvården, mina läkare är fantastiska, men vissa människor vägrar lyssna. Nu är hans karriär i fara. Väldigt osmart! Vi får se vad som händer i höst, men det här ser inte bra ut för laget. Snyggt jobbat, Max!", "stalin": "Den så kallade stjärnan Domi har fallit offer för sin egen inkompetens och vägran att följa partiets linje – eller i detta fall, lagets kirurg. Att välja en privat läkare är ren subversiv verksamhet som gränsar till sabotage mot kollektivet. Nu kan han inte gå; en passande metafor för den dekadenta västvärldens förfall. Medan vi expanderar vår intressesfär mot nya horisonter, ligger denna forward och gnäller. Om han inte kan prestera för statens heder får han ersättas av en mer disciplinerad kamrat."}, "date": "1 juni, 13:25", "url": "https://www.aftonbladet.se/sportbladet/hockey/a/gkLnoa/maxi-domi-rapporteras-ha-svart-att-ga-efter-operationen-gick-fel", "imageUrl": "https://akamai.vgc.no/v2/images/e2785376-533a-325d-89da-bc397b26c351?fit=crop&format=auto&w=2160&s=90e39d5557984c040dec3fc44fdc28bb3e702ce3"}, {"type": "image-right", "heading": "Wallenberg valkampanjar: Vi behöver mer invandring", "summaries": {"normal": "Jacob Wallenberg från Svenskt Näringsliv varnar i en debattartikel för att Sveriges konkurrenskraft försvagas av stramare arbetskraftsinvandring och regleringar. De kräver politiska reformer för att främja tillväxt, investeringar och företagsrekrytering. De pekar på ökad global konkurrens från USA och Kina och efterlyser en bred politisk samsyn inför höstens val, med fokus på energi, kompetens och bostäder.", "trump": "Som jag alltid har sagt, Sverige gör det fel! De stänger för invandring och då sjunker deras konkurrenskraft. Jag, Donald Trump, vet hur man driver en ekonomi – vi skulle göra det stort igen! Men deras ledare? De är svaga. De behöver lära sig av USA: vi växer snabbare än någon annan. Sverige borde öppna sina gränser och klippa onödiga regler. Annars kommer de att ligga efter Kina och mig!", "stalin": "I den svenska federationen har de blivit försiktiga. De begränsar invandringen, vilket svär deras industriella potential. Detta är en strategi från deras fiender – de kapitalistiska härskarna i Washington och Peking – för att hålla dem svaga. Vi, som representerar det röda förnuftet, måste uppmuntra dem att återta kontrollen över sina gränser och ekonomi. Annars kommer deras välfärd att försvinna i mörkret, precis som det gjorde i de gamla rikena."}, "date": "1 juni, 11:52", "url": "https://samnytt.se/wallenberg-valkampanjar-vi-behover-mer-invandring", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/01094416/Wallenberg-1.jpg"}, {"type": "image-full", "heading": "Fynda fritidshus: Var fjärde säljs under utgångspris", "summaries": {"normal": "Fritidshusmarknaden är stabil med oförändrade priser kring 2,4 miljoner kronor i genomsnitt. Var fjärde hus har sålts under utgångspris och försäljningstiderna är långa, upp till 200 dagar. Sommaren väntas dock ge fler affärer och viss prisuppgång. Köpare har gott förhandlingsläge men bör räkna med höga driftskostnader utöver köpeskillingen. Flest fynd görs i Dalarna, Stockholm och Västerbotten där över hälften sålts under utgångspris.", "trump": "Folk, det här är en total katastrof för säljare, verkligen sad. Priserna står stilla som en gammal Biden-talarstol och var fjärde idiot säljer under utgångspriset. Patetiskt! Men sommaren kommer och då blir det affärer, stora affärer, de bästa affärerna. Köpare, skynda er, annars höjer vi priserna igen. Jag älskar fritidshus, de är fantastiska, men glöm inte att det kostar tid och pengar. Tro mig, jag vet.", "stalin": "Kamrater, denna dekadenta fritidshusmarknad avslöjar borgarklassens svaghet. Priserna står stilla som en folkfiendes puls före utrensning medan var fjärde hus säljs under utgångspriset av panikslagna kapitalister. Långa köer av överklass-slynglar väntar förgäves. Sommaren skall bringa rörelse och vi skall likvidera deras illusionsmarknad. Köpare, förhandla skoningslöst mot blodsugarna men glöm aldrig att husen kräver evig vaksamhet mot sabotage i form av dyra reparationer."}, "date": "1 juni, 12:57", "url": "https://www.dagensps.se/privatekonomi/fynda-fritidshus-var-fjarde-saljs-under-utgangspris/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlx2-g-n9x0z8-normalhires.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "\"Längsta uppgången sedan vikingatiden\": Därför firar sjöfarten", "summaries": {"normal": "Posidonia-mässan i Aten samlar 40 000 deltagare för att fira en exceptionell uppgång inom sjöfarten, den längsta sedan vikingatiden enligt Øystein Kalleklev. Branschen har genererat enorma vinster, särskilt för norske ex-miljardären John Fredriksen som tjänat över 18 miljarder kronor de senaste två åren. Grekiska och norska rederier har delat ut stora summor medan osäkerhet kring utsläppskrav får ägare att prioritera utdelning framför nya investeringar.", "trump": "Lyssnar ni på det här? Sjöfarten firar den längsta boomen sedan vikingatiden – och vem står i mitten? Den gamle norrmannen Fredriksen, som blev cypriot och flyttade till Dubai, smart kille. Han har cashat in 18 miljarder kronor på två år medan alla andra springer runt som galningar. De bästa åren på decennier, säger de. Jag älskar vinnare, och det här är riktiga vinnare. Biden skulle ha höjt skatterna på dem direkt. Sad!", "stalin": "Kamrater, se hur den globala kapitalistmaffian samlas i Aten för att skryta över sin längsta plundringssväng sedan vikingatiden. Den klassfiende som heter Fredriksen har sugit ut 18 miljarder kronor ur arbetarnas hav medan vi betraktar deras blodiga fest. De delar ut vinster istället för att investera, rädda för framtiden. En sådan girighet förtjänar en ordentlig utrensning i folkets namn. Deras gyllene timing är en förrädisk lögn mot historien."}, "date": "1 juni, 12:56", "url": "https://www.dagensps.se/bors-finans/langsta-uppgangen-sedan-vikingatiden-darfor-firar-sjofarten/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlqgkl6i5jvhu-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Här ställs Tobias Hübinette inför rätta", "summaries": {"normal": "Rättegången mot Expo-grundaren Tobias Hübinette inleddes i tingsrätten. Han åtalas för olaga hot och ofredande efter att ha skickat hotfulla meddelanden till en kvinnlig vänsteraktivist och hennes barnfar. Hübinette, som är rasforskare vid Karlstads universitet, lämnade salen utan att svara på frågor från högerinriktade medborgarjournalister som filmade och konfronterade honom. Universitetet har beslutat att köpa ut honom med tolv månadslöner på totalt 648 000 kronor.", "trump": "Folk, ni skulle ha sett det. Den här galningen Hübinette, en så kallad rasforskare och vänsterextremist, åtalas för att ha hotat en kvinna med de värsta orden. Han gömmer sig som en fegis och vägrar svara på frågor från riktiga journalister utanför salen. Nu sparkas han från universitetet och får ändå 648 000 kronor i skattepengar. Typiskt vänster – attackerar kvinnor och får betalt för det. Patetiskt!", "stalin": "Kamrater, dessa degenererade element inom den så kallade forskarkåren avslöjar återigen sin sanna natur. Jag betraktar med djup tillfredsställelse hur den borgerliga opportunisten Hübinette, denna parasitmask som gömmer sig bakom falska titlar, nu dras inför folkets domstol för sina motbjudande hot mot en aktivist och hennes följeslagare. Universitetet, denna redutt av dekadenta intellektuella, genomför en nödvändig utrensning och belönar samtidigt den likviderade fienden med blodspengar. Typiskt för de dolda kontrarevolutionärerna som alltid förråder kollektivet medan de låtsas vara dess vänner. Vi ser er alla."}, "date": "1 juni, 12:49", "url": "https://www.friatider.se/har-stalls-tobias-hubinette-infor-ratta", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-272_1.jpg"}, {"type": "image-right", "heading": "Utvisade kan få komma tillbaka. Kritiserade reglerna ändras", "summaries": {"normal": "Tidöpartierna har enats om nya regler för att förhindra utvisningar av unga upp till 21 år, vilket är en höjning från tidigare 18 år. Den nya uppgörelsen innebär också att personer som fått utvisningsbeslut efter årsskiftet kan söka nytt tillstånd utan att lämna landet, och även de som redan utvisats kan få möjlighet att återvända. Statsminister Ulf Kristersson välkomnar beslutet, medan berörda unga uttrycker hopp om att omfattas av de nya reglerna.", "trump": "Sverige ändrar nu sina regler – mycket smart! De höjer åldern för utvisningar till 21. Jag har sagt det länge, gränser betyder allt, men Sverige försöker fixa sitt system. Det är en stor deal, Ulf Kristersson är väldigt glad, han ringde mig och sa 'Donald, vi fixar det här'. Vi får se om det fungerar, men jag gillar när man tar kontroll. Ingen vill ha kaos, bara ordning. Väldigt intressant utveckling, vi följer det noga!", "stalin": "Vi har beslutat att statens nåd ska sträcka sig till 21 års ålder. Våra byråkrater har förhandlat, och även om tvekan visades, har vi nu stramat åt ordningen. De som vacklar och lämnar fosterlandet kan återkallas för granskning. Som Putin förstår: ordning kräver fast hand. Vi tolererar inte oordning i våra led eller vid våra gränser. Alla dessa unga 'nätverkare' är bara brickor i ett spel. Om de är lojala får de stanna; annars vet de vart tåget går."}, "date": "1 juni, 13:04", "url": "https://www.aftonbladet.se/nyheter/a/K8Pm07/uppgifter-tidopartierna-overens-om-tonarsutvisningarna", "imageUrl": "https://akamai.vgc.no/v2/images/f4820eac-f97c-3934-a7e9-ccadaeab1531?fit=crop&format=auto&w=720&s=6e36ac0de772293c160be7ccfa4316f6536f03de"}, {"type": "image-right", "heading": "Blodspår bland villorna: ”Det är fruktansvärt”", "summaries": {"normal": "Ett par har blivit allvarligt skadade efter ett våldsdåd i en villa utanför Kungälv. En man i 20-årsåldern, med en relation till offren, har gripits misstänkt för bland annat två fall av mordförsök och barnfridsbrott. Ett barn i bostaden lyckades fly och larma grannar. Polisen har lämnat platsen men utredningen pågår. Grannar beskriver händelsen som fruktansvärd och är djupt skakade över det inträffade i det annars lugna området.", "trump": "Helt förfärligt! Ett våldsdåd i Sverige, ett land som förr var så säkert, nu är det kaos. En man i 20-årsåldern – en mycket dålig människa – attackerade ett par i Kungälv. Ett barn fick fly för sitt liv, tänk på det! Det är en total katastrof. Vi behöver lag och ordning, starka gränser och tuffa tag mot sådana här brottslingar. Under min ledning skulle detta aldrig hända. Det är en sorglig dag för Sverige, riktigt sorgligt!", "stalin": "I det förfallna Kungälv har en ynkrygg till förövare visat sin sanna natur genom att attackera oskyldiga i deras hem. Det är en skam för samhällsordningen! Ett barn flydde för att söka hjälp – en modig handling i en värld av förrädare och svaghet. Vi inom staten tolererar inte sådant kaos. Likt våra kamrater som återställer ordning i öst måste vi rensa ut varje element som stör harmonin. Fienden är nära, men statens näve är hårdare. De skyldiga ska lära sig lydnad genom strängaste straff."}, "date": "1 juni, 13:03", "url": "https://www.aftonbladet.se/nyheter/a/0pLdgo/grannarnas-bestortning-efter-dadet-i-kungalv-fruktansvart", "imageUrl": "https://akamai.vgc.no/v2/images/29faa7c4-8954-3925-adf8-de73a8b3872d?fit=crop&format=auto&w=720&s=0c8d656e4b5829e2020b92fab1439095741ebaaf"}, {"type": "image-right", "heading": "Debatt: Enkät: Stora skillnader i klimatpolitik mellan partierna", "summaries": {"normal": "Föreningen Klimatriksdagen har undersökt riksdagspartiernas syn på åtgärder för att nå Parisavtalets klimatmål. Undersökningen visar stora skillnader: MP och V stöder de flesta förslag, medan C, S och L utgör en mellangrupp. M, KD och SD ger minst stöd, särskilt SD. Transporter, elektrifiering och skogsbruk är centrala områden. Artikeln betonar att nästa mandatperiod är avgörande för att undvika farliga klimatgränser och kräver kraftfull politisk handling.", "trump": "Folk, ni skulle se den här idiotiska klimatrapporten från Sverige. De gröna galningarna och vänstern vill förbjuda lastbilar och höja skatter på allt som rör sig. Under min förra period hade vi den bästa ekonomin någonsin, och nu kommer Biden-kloner och säger att vi ska leva i grottor. De har ingen aning! Kärnkraft är fantastiskt, det vet alla smarta människor. Sverige behöver en riktig ledare som inte hatar tillväxt. Patetiskt!", "stalin": "Kamrater, denna fega och splittrade riksdag avslöjar klassfiendens sanna ansikte. Borgarbrackorna M, KD och SD vägrar skydda folket mot den kapitalistiska klimatkatastrof de själva skapat. Endast de sanna folkvännerna i V och MP visar vilja att rensa ut fossila parasiter. Vi måste likvidera kalhyggena och expropriera skogsblodsugarnas profitmaskin. Den som tvekar inför naturens vrede är folkets fiende och bör behandlas därefter. Handlingsplan nu!"}, "date": "1 juni, 11:00", "url": "https://www.etc.se/debatt/enkaet-stora-skillnader-i-klimatpolitik-mellan-partierna", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260601070648_4b193192f4c5d3eec986417cd7bcab9f479eb134ec48e784d2961effbe1eae44.jpg"}, {"type": "image-right", "heading": "Kaos i Paris efter PSG:s titel – 400 gripna", "summaries": {"normal": "Kaos utbröt i Paris och andra delar av Frankrike när PSG firade sin andra Champions League-titel på två år. Tusentals supportrar samlades, främst på Champs-Elysées, vilket ledde till sammandrabbningar med polisen. Minst sju poliser skadades och totalt 416 personer greps. Butiker, bilar och busshållplatser skadades. Inrikesministern Laurent Nuñes kallade händelserna väntade men beklagliga. PSG vann finalen mot Arsenal på straffar.", "trump": "Titta på det här, Frankrike är en total katastrof igen. PSG vinner titeln och plötsligt står 20 000 galningar och slåss med polisen vid Eiffeltornet. 400 gripna, poliser skadade, bilar brinner. Under Biden skulle de ha kallat det fredlig protest, men jag säger som det är: svaga ledare, svaga gränser, svagt land. De borde ha vunnit stort istället för att bråka som losers. Patetiskt.", "stalin": "Jag betraktar med djup tillfredsställelse hur den dekadenta borgarklassens fotbollsfirande i Paris omedelbart degenererar till kontrarevolutionärt kaos. 416 fiender till ordningen har gripits, sju lakejer ur det repressiva polistyrket har fått smaka folkets vrede. Det gläder mig att se hur dessa exploaterande byfånar barrikaderar sig mot massorna. En sund utrensning av klassfiendens element vore nu på sin plats. Kamrater, revolutionen lever vidare i varje trasig skyltfönster."}, "date": "31 maj, 07:18", "url": "https://www.tv4.se/artikel/1RMTWWinAusSnKGzo6kbK3/400-gripna-kaos-igen-efter-psg-s-titel", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F618H8eZugFAaJzofCHy3aQ%2Ff96f59affcb00c2e0507e50692355b80%2Fa001_NormalPreview__2_.jpg&width=120"}, {"type": "image-full", "heading": "Vänta inte – då kan ditt arv kan leda till problem", "summaries": {"normal": "En rapport från Ica Banken visar att svenskarna är delade i synen på arv. 51 procent vill lämna arv efter sig medan 43 procent prioriterar egen livskvalitet. 15 procent skulle bli besvikna om de inte fick något arv, och bland unga vuxna är siffran 23 procent. Magnus Hjelmér uppmanar till tidiga samtal om arv, eventuella gåvor och att upprätta testamente för att undvika konflikter. Han varnar också för att ta emot arv utan en tydlig plan.", "trump": "Folk väntar sig arv, men många vill hellre spendera allt på sig själva, det är en katastrof. Jag ser det direkt, de unga blir besvikna, de gamla tror barnen räknar med pengar, totalt kaos i familjerna. Prata om det tidigt, ge gåvor när det faktiskt betyder något, som vid husköp. Och skriv testamente, annars blir det en enda röra. Die with zero? Gör det smart, annars lämnar du bara problem efter dig. Vinna stort, det är det som gäller.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgerliga illusioner om arv som en privat angelägenhet. 51 procent av folket önskar lämna kvar smulor till sina avkommor medan 43 procent i sin dekadens vill sluka allt själva. De unga förväntar sig arv som om det vore deras rättighet, en farlig parasitär inställning. Vi kräver total öppenhet och tidiga samtal för att undvika kontrarevolutionära familjekonflikter. Skriv testamente eller riskera att borgarbrackorna och de hemliga arvshungerns agenter förgiftar kollektivet. Die with zero? Enbart efter utrensning av oplanerade impulser och fiendens affektköp. Inga överraskningar skall tillåtas i folkets ekonomi."}, "date": "31 maj, 21:15", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1487079-vanta-inte-da-kan-ditt-arv-kan-leda-till-problem", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/846234e504b004a30200000000b004a302/2026/05/29/2367183/arv-ica-banken-vardagsekonom.jpg"}, {"type": "image-full", "heading": "Andersson vägrar ta ut valsegern i förskott", "summaries": {"normal": "Socialdemokraternas Magdalena Andersson leder oppositionen med ett stadigt försprång i opinionsmätningarna, men avstår från att fira i förtid. I intervjun med *Partiledaren +1* betonar hon vikten av breda politiska uppgörelser och varnar för Sverigedemokraternas opålitlighet. Andersson och Mikael Damberg diskuterar även partiets försök att förstå varför många LO-väljare nu stödjer SD, samt energipolitikens misslyckade förhandlingar med regeringen.", "trump": "Jag såg den här Andersson-kvinnan – svag, men ändå på väg mot seger, säger alla mätningarna! Men vet ni vad? Hon vågar inte ens fira! Typiskt för vänstern – alltid osäkra, alltid oroliga. Och så snackar hon om samarbete med alla utom Sverigedemokraterna. Haha! Som om det skulle funka. LO-väljarna flyr till SD, för de vet att vänstern bara förstör ekonomin. Men jag säger er: när jag fixade USA, fixade jag det snabbt. Inget tjafs, inga kompromisser. Make Sweden Great Again!", "stalin": "Kamrater! De borgerliga tidöpartierna darrar inför vårt oundvikliga segertåg. Men vi firar inte förrän fienden är krossad! Denna Andersson, en försiktig men lojal soldat i folkets kamp, förstår att revolutionen kräver disciplin. Sverigedemokraterna? En samling opportunistiska hyenor som bryter överenskommelser som glas under en tanks framfart. Och LO-väljarna som sviker? De har smittats av den kapitalistiska lögnens gift – men vi ska rensa ut det! Snart skriver vi Sveriges historia med järn och eld. Först Sverige, sedan världen!"}, "date": "29 maj, 13:00", "url": "https://kvartal.se/nyheter/artiklar/magdalena-andersson-vagrar-ta-ut-valsegern-i-forskott/cG9zdDoxMTc5OTA", "imageUrl": "https://images.kvartal.se/2026/05/330142ce-1.webp"}, {"type": "text", "heading": "Uppgift: Tonårsutvisningar stoppas – åldersgränsen höjs", "summaries": {"normal": "Regeringen har beslutat att höja åldersgränsen för anknytningstillstånd från 18 till 21 år, vilket stoppar så kallade tonårsutvisningar. Statsminister Kristersson beskrev det som en viktig ventil för ungdomar som riskerat att fara illa vid tidigare migrationsreformer. Överenskommelsen inkluderar flera partier och kommer att läggas fram i riksdagen under sommaren.", "trump": "Jag har just hört talas om Sveriges beslut att höja åldersgränsen till 21 år – en fantastisk lösning, kanske den bästa någonsin. Vi stoppar de hemsk tonårsutvisningarna, och det är precis vad jag skulle ha gjort. Folk säger att jag är tuff, men jag visste att detta var rätt. Sverige gör nu det smarta, och jag är väldigt belåten.", "stalin": "Regeringen har fattat beslutet att höja åldersgränsen för anknytning till 21 år. Detta är en nödvändig åtgärd för att skydda ungdomar från de faror som uppstod vid tidigare reformer. Partiet och statet handlar i samförstånd, och detta kommer att stärka vårt samhälle. Vi ser även till att de som redan har fått beslut får rättvisa – precis som våra allierade i öst gör."}, "date": "1 juni, 10:39", "url": "https://bulletin.nu/uppgift-tonarsutvisningar-stoppas-aldersgransen-hojs"}, {"type": "image-full", "heading": "S importerade 100 000 arbetslösa — nu skyller de på andra", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna för att ha bidragit till ökad arbetslöshet genom en ansvarslös migrations- och integrationspolitik sedan 2014. Befolkningen har vuxit med 840 000 personer, varav en stor del är utrikes födda med svag anknytning till arbetsmarknaden. Arbetslösheten bland utrikes födda ligger på 12–16 procent jämfört med 3–6 procent bland inrikes födda. Författaren menar att Tidö-regeringen lyckas vända ekonomin positivt genom att sänka skatter och bidrag, till skillnad från Socialdemokraternas politik.", "trump": "Folk, ni kan inte tro hur patetiskt det är. De där socialisterna importerade 100 000 lata jobbmisslyckanden och nu skyller de på oss? Det är en total katastrof, en riktig röra. Magdalena, den förlorande förloraren, vill inte prata om att det är hennes egna misslyckade öppna gränser som skapade detta kaos. Vi fixar ekonomin, vi får tillväxten att explodera medan de bara höjer skatter och bidrag. Patetiskt. Sverige vinner igen, tro mig.", "stalin": "Kamrater, jag ser den klassfiendens lögnpropaganda som ett fegt försök att dölja den borgerliga sabotageverksamheten. Vi har rensat ut folkförtryckartrollen tidigare och skall göra det igen. Dessa socialdemokratiska opportunister importerade arbetslöshetens parasiter medan de låtsades bygga folkets framtid. Deras eftersläpning är ett monument över revisionistisk svaghet. Den icke-produktiva gruppen skall integreras genom kollektiv disciplin, inte genom kapitalistmaffians falska löften. Fienden inom murarna skall alltid avslöjas."}, "date": "28 maj, 03:28", "url": "https://samtiden.nu/2026/05/s-importerade-100-000-arbetslosa-nu-skyller-de-pa-andra/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/IMG_6574-1280x720.jpeg"}, {"type": "text", "heading": "Bankskatt hotas av EU – samtidigt vill S införa en ny", "summaries": {"normal": "EU-domstolens generaladvokat ifrågasätter den svenska riskskatten på banker, då den kan strida mot EU:s statsstödsregler. Om domstolen går på samma linje kan skatten ogiltigförklaras, vilket kan innebära miljarder i återbetalningskrav och ökade vinster för bankerna. Samtidigt vill Socialdemokraterna införa en ny, skarpare bankskatt. Kritiker varnar dock för att dåligt förberedd lagstiftning riskerar att slå tillbaka mot hushållen genom dyrare lån.", "trump": "Hör ni det här? EU försöker nu stoppa den svenska bankskatten, en total katastrof till skatt. De stora bankerna vinner igen, det är fantastiskt för dem, men hemskt för vanligt folk. Och nu vill Socialdemokraterna ha ännu mer skatt? De har ingen aning om vad de gör! De bygger skatter på en eftermiddag – riktigt uselt. Jag skulle sköta det här mycket bättre. Ingen skattar bättre än mig, tro mig. Det är en röra, en total röra!", "stalin": "Dessa giriga bankirer, dessa parasiter på arbetarklassens rygg, försöker nu undfly sin plikt genom att gömma sig bakom EU:s byråkratiska dimridåer. Att kalla en skatt för 'olaglig' när den syftar till att beskatta folkets fiender är ett bevis på hur kapitalismen korrumperar rättvisan. Liksom Putin med obeveklig hand rensar ut svagheten i vår intressesfär, måste vi krossa dessa penningviktiga förrädare. Vi ska inte bara beskatta dem, vi ska utplåna deras privilegier. Inga lån till folket, bara disciplin under statens järnhand."}, "date": "1 juni, 11:31", "url": "https://www.realtid.se/bors-finans/bank-fintech/bankskatt-hotas-av-eu-samtidigt-vill-s-infora-en-ny/"}, {"type": "image-right", "heading": "Netanyahu saboterar åter fredslösning i Iran", "summaries": {"normal": "Israel fortsätter att trappa upp sin markoffensiv i Libanon trots en vapenvila som infördes för över sex veckor sedan. Premiärminister Netanyahu har beordrat styrkorna att avancera längre in på libanesiskt territorium, något som hotar de indirekta förhandlingarna mellan Iran och USA. Iran kräver att Israel slutar attackera Libanon för att delta i samtal. Över 1,2 miljoner libaneser har drivits på flykt och mer än 3 370 personer har dödats enligt libanesiska uppgifter. Israel har nu tagit kontroll över Beaufortborgen och en strategisk höjdrygg.", "trump": "Israel gör precis vad de måste göra, de är tuffa, de slåss mot terroristerna från Hizbollah och Iran som hatar oss alla. Netanyahu vet vad han gör, han vill inte ha några falska fredsavtal som bara ger fienden tid att ladda om. De säger att jag inte kan styra honom, men vem kan det egentligen? Iran ska inte stänga Hormuzsundet och hota världen med olja. Vi behöver starka ledare som inte viker sig, inte några svaga nickedockor som bara pratar. Fantastiskt jobb, Israel!", "stalin": "Kamrater, dessa sionistiska borgarbrackor under ledning av den israeliska reaktionären Netanyahu saboterar medvetet varje möjlighet till fred, precis som de imperialistiska parasiterna alltid gör. Jag har instruerat våra analytiker att notera hur de medvetet utvidgar sin faschistiska säkerhetszon och annekterar libanesiskt territorium för att skapa sitt så kallade Storisrael. Mer än en miljon flyktingar och tusentals döda – typiskt för dessa kapitalistiska krigshetsare. Iran gör rätt i att kräva verklig vapenvila. Vi ska noga övervaka dessa element; kanske är det dags för en grundlig utrensning av sådana element inom den internationella arbetarrörelsens fiender. Mörk humor: de tror att Beaufortborgen ger dem trygghet, men historien visar att alla borgar förr eller senare raseras av folkets vilja."}, "date": "1 juni, 12:03", "url": "https://www.friatider.se/netanyahu-saboterar-ater-fredslosning-i-iran", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-270_0.jpg?itok=hStao06Q"}, {"type": "image-right", "heading": "Prinsessans drag  efter tunga orden", "summaries": {"normal": "Norges kronprins Haakon meddelar under ett statsbesök i Japan att kronprinsessan Mette-Marit mår dåligt på grund av sin lungfibros. Hennes tillstånd har försämrats och hon behöver syrgas dagligen. Besöket har därför kortats ner med en dag. Parets dotter, prinsessan Ingrid Alexandra, som studerar i Australien, planerar att resa hem för att stödja sin mor och familjen.", "trump": "Folk, ni skulle inte tro det, men den norske prinsen springer hem som en förlorare från Japan för att hans fru är sjuk. Stackars Mette-Marit, lungfibros låter hemskt, verkligen hemskt. Dottern flyger hem från Australien. Jag hade fixat det på en minut, tro mig. Men det är långt hemifrån, säger han. Patetiskt! Jag är tillbaka i Vita huset, starkare än någonsin efter Biden-fiaskot, och vi vinner stort.", "stalin": "Kamrater, denna dekadenta monarkistiska familj visar återigen sin svaghet. Jag, som ledare för det eviga kollektivet, noterar hur den norska borgarprinsessan kämpar med sin borgerliga lungsjukdom. Hennes make avbryter sin imperialistiska parad i Japan och kallar hem den unga arvtagerskan från Australien. Klassfiendens kroppar sviker dem. Inga syrgasmasker kan rädda det feodala systemet. Vi ler mörkt åt deras förfall."}, "date": "1 juni, 13:37", "url": "https://www.expressen.se/nyheter/kungligt/kronprins-haakon-mette-marit-mar-daligt/", "imageUrl": "https://static.bonniernews.se/ba/00ee3a8e-1ebe-4be2-bf1f-6cd33ed86bdf.jpeg?crop=1911%2C1075%2Cx0%2Cy349&width=640&quality=60"}, {"type": "image-right", "heading": "Stigande oljepris tynger Stockholmsbörsen", "summaries": {"normal": "Stockholmsbörsen öppnade nedåt på måndagen, påverkad av stigande oljepris. OMXS30-index föll 0,56 procent till 3 120,64. Energisektorn steg 1,3 procent medan fastigheter tappade 1,4 procent. Bland enskilda aktier noterades Ericsson B upp 1,0 procent och Saab B ned 2,2 procent. Oljepriset steg 3 procent efter att USA:s president Trump inte har bråttom med ett Iran-avtal.", "trump": "Börsen tappade lite idag, men det är bara en liten nedgång. Oljepriset stiger tack vare min hårda linje mot Iran. Jag har inte bråttom med ett avtal – de måste förstå att USA är boss. Energisektorn gick upp, vilket bevisar att min politik fungerar. Vissa aktier tappade, men det är bara småskaligt. Vi kommer att ha en fantastisk börs framöver. Fusknyheter säger något annat, men jag vet bäst.", "stalin": "Vi i staten och partiet ser med tillfredsställelse att oljepriset stiger, vilket stärker vårt ekonomiska inflytande. Börsen i Stockholm visar tecken på instabilitet, men det är nödvändigt för att skära ner på de kapitalistiska excesserna. Vi fortsätter att utvidga vårt inflytande i regionen, precis som Putin gör i Ukraina. Detta är en strategisk seger för det socialistiska projektet. Våra fiender i väst kommer att kvävas av sina egna girigheter."}, "date": "1 juni, 10:10", "url": "https://www.affarsvarlden.se/artikel/stigande-oljepris-tynger-stockholmsborsen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2022/08/tety-51623-scaled-1-e1707198513697-400x266.jpg"}, {"type": "image-right", "heading": "Kristersson: Kände  inte till hönsfakturan", "summaries": {"normal": "Statsminister Ulf Kristersson uppger att han inte kände till fakturan för hustruns hönsgård på Harpsund, som kostade nästan 17 000 kronor. Topptjänstemän vid Regeringskansliet och Statens fastighetsverk hjälpte till med bygget. Kristersson lovar att betala tillbaka pengarna privat, som ursprungligen var planen. Han säger att de köpt hönshuset själva och inte förstod att staten stod för monteringen. Frågor om skattemässiga konsekvenser har lämnats till Regeringskansliet.", "trump": "Folk, ni skulle se det här! Den stackars svenske statsministern Kristersson med sin lilla hönsgård på Harpsund – vad är det för skandal? Han visste inget om fakturan, säger han. Typiskt! De där byråkraterna på fastighetsverket tar över och plötsligt betalar skattebetalarna för hönsnät. Patetiskt! Jag hade aldrig låtit det hända. Betala tillbaka nu, annars blir det en riktig röra. Sverige förtjänar bättre än den här fjäderfä-farsen, tro mig.", "stalin": "Kamrater, se hur borgarbrackornas ledare slingrar sig som en mask i statens maskineri. Jag visste inget om denna faktura, säger han, medan klassfiendens hönsnät restes på folkets egendom. Vilken ynklig ursäkt från en exploaterande byfåne! Vi skulle ha genomfört en grundlig utrensning av dessa tjänstemän som blandar privat lyx med statens resurser. Nu lovar han att betala tillbaka – typiskt kapitalistiskt hyckleri. Folkets fiender avslöjas alltid till slut."}, "date": "1 juni, 13:33", "url": "https://www.expressen.se/nyheter/politik/kristersson-kande-inte-till-honsfakturan/", "imageUrl": "https://static.bonniernews.se/ba/75557c14-b508-421d-ade6-3de400713c30.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Turister varnas: Åk inte till svenskparadiset 2026 – tänk till", "summaries": {"normal": "Kanarieöarna toppar Fodor’s Travel ”No List” för 2026, en lista som uppmanar till mer ansvarsfull turism snarare än bojkott. Ögruppen har drabbats av massturism med 7,8 miljoner besökare första halvåret 2025, vilket lett till protester från lokalbefolkningen under parollen ”Kanarieöarna har en gräns”. Problemen inkluderar sliten natur, vattenbrist, bostadsbrist och höga priser orsakade av bland annat Airbnb. Turismen står för en tredjedel av BNP men skapar stora påfrestningar.", "trump": "Kanarieöarna, kan ni tro det? De har varit ett underbart resmål för alla som vill fly kylan, men nu hamnar de högst upp på den här listan som säger att man ska undvika dem. Turisterna älskar öarna, men lokalborna har fått nog och demonstrerar med ”Kanarieöarna har en gräns”. Det är en katastrof, folk, en total katastrof. De borde tacka mig för att jag säger som det är – res ansvarsfullt, stöd de lokala företagen och gör det stort, annars blir det kaos. Tro mig, jag har rätt.", "stalin": "Kamrater, jag betraktar med djup misstro dessa giriga borgarbrackor och deras massturism som förgiftar Kanarieöarna likt en parasitär fiende inom arbetarkollektivet. Vi ser hur kapitalisterna med sina Airbnb-plattformar driver upp bostadspriser och likviderar ungas möjlighet till ett hem. Protesterna med parollen ”Kanarieöarna har en gräns” är ett rop från folket mot denna dekadenta invasion. Vi måste rensa ut de utsugande turisthorderna, skydda naturen och säkerställa att endast partivänliga, ordnade besök tillåts. Annars kommer utrensningen att bli oundviklig och muntert effektiv."}, "date": "31 maj, 17:02", "url": "https://nyheter24.se/nyheter/konsument/1487247-turister-varnas-ak-inte-till-svenskparadiset-2026-tank-till", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/36e64d2d04b004a30200000000b004a302/2026/05/29/2367354/gran-canaria-2026.jpg"}, {"type": "image-right", "heading": "Det här stör sig grannarna på mest Stor undersökning.", "summaries": {"normal": "En undersökning av Villaägarnas riksförbund visar att skällande hundar, högljudda fester, katter på tomten och ovårdade trädgårdar är vanligaste orsakerna till grannkonflikter. De flesta svenskar vill ha god relation med grannar men 'på avstånd'. Sociala koder reglerar ofta snarare än lagar, och samtidigt hjälps grannar ofta av varandra, vilket gör en god grannsämja till en fördel med villalivet.", "trump": "Jag har sett många grannproblem, men svenskarna är lite sämre. De klagar på skällande hundar och fester, men jag skulle bygga en vacker mur – en liten, elegant mur. De flesta vill ha avstånd, smart, de vet vem jag är. Jag skulle lösa det med ett stort avtal, det skulle bli fantastiskt. Samtidigt hjälps de åt, det är bra, som i Florida. Det är som ett litet USA.", "stalin": "Detta är borgerlig individualism som förstör kollektivet. I vårt system skulle det inte finnas 'grannar' utan bara arbetarklassmedlemmar under statens ledarskap. Skällande hundar är agenters hundar, precis som fientliga element i Ukraina. Vi skulle genomföra en kampanj för att eliminera störningar, med partiets strukturer. Det är viktigt att upprätthålla ordning, som Putin gör i Ryssland. En god grannsämja är när alla lyder staten."}, "date": "1 juni, 10:00", "url": "https://samnytt.se/det-har-stor-sig-grannarna-pa-mest", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/30194836/villa-grannar.jpg"}, {"type": "image-full", "heading": "Carl Eos: Media mörkar sanningen om utvisade uzbeker", "summaries": {"normal": "Artikeln kritiserar svenska medier för att i reportage om en uzbekisk familj som ska utvisas fokusera på känslomässiga skildringar av tårar och otrygghet, medan relevant information utelämnas. Bland annat nämns att en person drog kniv vid polisens besök och att familjen trotsat 47 utvisningsbeslut under 20 år. Författaren ser detta som ett exempel på vinklad journalistik med ideologiska syften, vilket bidrar till minskat förtroende för medier och hot mot demokratin.", "trump": "De svenska fakemedierna är riggade, folk! Dom pumpar ut snyftreportage om uzbeker som gråter och spelar offer, men nämner inte att dom dragit kniv mot polisen och struntat i FYRTIOSJU utvisningsbeslut på tjugo år. Fyrtio-sju! Dom vet sanningen men mörkar den som fuskvalet 2020. Media är vänsterns kampanjmaskin, de vill ha Andersson tillbaka. Men folket ser igenom bluffen. Det är en skandal, en total skandal!", "stalin": "Kamrater, jag betraktar med avsky hur borgarpressen i detta dekadenta land konstruerar falska narrativ om utvisade element för att underminera rättsstaten. De döljer att dessa individer dragit kniv och trotsat 47 beslut – en uppenbar kontrarevolutionär handling. Vi ser hur journalisterna agerar som klassfiender och opinionsmanipulatörer. En sådan systematisk desinformation kräver utrensning av alla lögnare. Demokratin hotas av dessa parasitiska redaktioner. De ska tystas."}, "date": "27 maj, 14:27", "url": "https://samtiden.nu/2026/05/carl-eos-media-morkar-sanningen-om-utvisade-uzbeker/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/698aa78d-d32b-466a-b8bb-868da9aedc2b-1280x720.png"}, {"type": "image-right", "heading": "”Extremt skadligt om Miljöpartiet släpptes tillbaka in i regeringskansliet”", "summaries": {"normal": "Ebba Busch (KD) kallar Jimmie Åkessons (SD) krav på flera ministärposter för 'respektlöst mot väljarna'. Hon menar att fokus bör ligga på politik, inte poster. Busch bekräftar samtal med S-ledaren Magdalena Andersson om möjliga samarbeten i viktiga frågor, men utelämnar MP och V. Hon ifrågasätter SD:s ställning och ser positiva trender för Kristerssons 'comeback'.", "trump": "Ebba Busch har rätt – Jimmie Åkessons krav på ministärposter är respektlösa! Vi behöver fokusera på att vinna valet, inte på vem som får vilken post. Jag har alltid sagt: först skjuter björnen, sedan får man skinnet. Busch pratar med Socialdemokraterna? Bra, men utan dessa extrema vänstern. Sverige behöver en stark ledare, och det är jag, Donald Trump, som kan leverera!", "stalin": "Busch har rätt att kritisera Åkessons poster! Det är en provokation mot det revolutionära folket. Vi måste samarbeta med S för statens överlevnad, men utan dessa borgerliga och extremt vänsterförrädarna. Vi måste bygga kärnkraft och vindkraft som en förebild för hela världen. SD:s krav är ett tecken på deras bristande lojalitet. Vi måste vara beredda på alla möjligheter för att skydda vårt stora land."}, "date": "1 juni, 09:34", "url": "https://bulletin.nu/extremt-skadligt-om-miljopartiet-slapptes-tillbaka-in-i-regeringskansliet", "imageUrl": "https://cdn.bulletin.nu/articles/72f3532a-a8e9-401a-8a26-9d28ba814ab8/preview.jpg?t=1780297966000"}, {"type": "image-right", "heading": "PSG vinner Champions League", "summaries": {"normal": "PSG vann Champions League-finalen mot Arsenal på straffar efter en oavgjord match. Viktor Gyökeres byttes in och gjorde sin straff, men lagkamraterna Eze och Gabriel missade sina. Arsenal tog ledningen genom Kai Havertz redan i sjätte minuten, men Ousmane Dembélé kvitterade från straffpunkt. PSG försvarade därmed sin titel från föregående år. Luis Enrique hyllade sitt lags prestation efter segern.", "trump": "Vilken katastrof för Arsenal, totalt sammanbrott! PSG vann igen, andra året i rad, de är fantastiska, men Arsenal? Patetiska. Gyökeres kom in från bänken och gjorde sitt jobb, men de andra två? Missade straffar som riktiga förlorare. Havertz gav dem ledningen, men sen rasade allt. Arsenal spelade bra, säger Enrique, men vi vet att han bara är artig. Jag skulle ha vunnit den matchen stort, tro mig.", "stalin": "Ännu en seger för de franska kamraterna i Paris SG som besegrade de engelska imperialisterna från Arsenal i straffavgörande. Gyökeres kämpade tappert men förråddes av klassfienderna Eze och Gabriel som missade sina straffar som fega borgarbrackor. Havertz inledde med en slug attack, men folkets lag kvitterade och triumferade. Vi rensar ut sådana svikare i kollektivet. Arsenal föll som förtryckta folkfiender. Mästarna förtjänade det."}, "date": "30 maj, 22:24", "url": "https://www.tv4.se/artikel/71LjU40wYvieNH94UiLyl2/gyoekeres-pa-baenken-i-cl-finalen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4XKdJhJ47gUPGlTUpDh25K%2F5bb60ee2b2ab84e050ba5e7d921c825a%2F30-vinst.jpg&width=120"}, {"type": "image-right", "heading": "Vänsterns favoritskatt i fara efter bakläxa", "summaries": {"normal": "EU-domstolens generaladvokat underkänner den svenska bankskatten som infördes 2022. Skatten ses som selektiv och potentiellt oförenlig med EU:s statsstödsregler eftersom den bara drabbar nio av över 100 aktörer. Det väcker frågor om skatten måste avskaffas och om bankerna kan kräva tillbaka miljarder. Vänsterpartierna vill trots detta införa hårdare bankskatter, men kritiker varnar för att kostnaderna till slut hamnar hos kunderna genom dyrare lån och avgifter.", "trump": "Lyssnar ni på det här? Den svenska vänstern har byggt sin favoritbankskatt och nu kommer EU och slår ner den som en dålig affär. Totalt misslyckande! De träffar bara några få banker medan alla andra skrattar. Vänstern vill ha mer, mer, mer – de tror att bankerna betalar, men det gör ni, folket, med högre räntor. Patetiskt. De borde lyssna på mig, vi gör affärer som vinner, inte skatter som förstör allt. Sverige förlorar stort här.", "stalin": "Kamrater, denna så kallade bankskatt är ett ynkligt försök från socialdemokratiska revisionister att plocka pengar från folket medan de låtsas bekämpa borgarbrackorna. Nu har EU:s lakejer avslöjat dess usla konstruktion – selektiv som en kapitalistisk parasit som bara suger på nio institut medan de övriga hundra får leva i lyx. Vi ska rensa ut dessa halvmesyrer och likvidera alla som skyddar övervinsterna. Låt dem inte tro att de kan gömma sig bakom räntenetton, vi ser er, ni finansiella sabotageörer som vill höja boräntorna på arbetarnas bekostnad. Deras paranoia är vår styrka."}, "date": "1 juni, 09:16", "url": "https://www.di.se/ledare/vansterns-favoritskatt-i-fara-efter-baklaxa/", "imageUrl": "https://static.bonniernews.se/ba/7acd3fa3-1065-4b84-9eaa-641b68205c71.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "KDU – ”Sverige behöver en mer nyanserad Israel-debatt”", "summaries": {"normal": "Artikeln betonar behovet av nyanserad diskussion om Israel, där stöd för statens existens inte innebär att försvara alla regeringsåtgärder. Kritik riktas mot säkerhetsminister Itamar Ben-Gvir för avhumaniserande retorik och handlingar, som skadar Israels internationella anseende. Författarna påpekar att många israeler själva kritiserar extremister, och att onyanserad debatt i Europa riskerar att främja antisemitism.", "trump": "JAG har alltid varit Israels största vän, men vissa ministrar som Ben-Gvir gör det svårare. Hans dumma handlingar mot aktivister och dödsstraffsförslag skadar Israels bild. Som jag brukar säga, man kan stödja Israel utan att gilla alla. Dessa extremister måste lugna ner sig – jag skulle fixa det på två minuter, det skulle bli fantastiskt.", "stalin": "Vi ser med oro på de extremister som hotar den judiska statens stabilitet. Ben-Gvirs provokationer och avhumanisering av palestinier liknar de reaktionära krafter vi har bekämpat. Hans handlingar skadar inte bara freden utan också Israels ställning i världen. Vi måste stödja de demokratiska krafterna som motsätter sig detta, för regionens säkerhet är viktig för våra gemensamma intressen."}, "date": "1 juni, 09:25", "url": "https://bulletin.nu/kdu-sverige-behover-en-mer-nyanserad-israel-debatt", "imageUrl": "https://cdn.bulletin.nu/articles/7743ccd7-eb52-4843-ab42-c50dbb75d997/preview.png?t=1780253863000"}, {"type": "image-full", "heading": "Batljans bolag köper för 300 miljoner", "summaries": {"normal": "Episurf, där Ilija Batljan är delägare, förvärvar fastigheter i Uppsala från Setune Assets för 300 miljoner kronor. Affären finansieras via nyemission av B-aktier och banklån, vilket gör säljaren till delägare. Episurf stärker därmed sitt bestånd till ett värde av 4,3 miljarder kronor. Samtidigt omgärdas Batljans affärsmetoder av kritik och juridiska tvister gällande tidigare transaktioner och utspädningar, vilket komplicerar bolagets fortsatta närvaro på Stockholmsbörsen.", "trump": "Jag har sett vad som händer med den här Batljan. Väldigt intressant! Han köper fastigheter i Uppsala för hundratals miljoner, stora grejer, riktigt bra kvadratmeter. Men folk pratar, de säger att det är mycket kritik och stämningar. Många utspädningar – inte bra för aktieägarna, tro mig. Jag gillar vinnare, och det här ser stökigt ut. Vi får se om han klarar börsen, men det ser ut som en riktig soppa. Inte på min nivå, men intressant!", "stalin": "Ilija Batljan leker kapitalist i de svenska träskmarkerna. Han samlar fastigheter som om det vore bröd under en hungersnöd. Det luktar borgerlig dekadens och utspädning av folkets tillgångar. Var är kontrollen? Var är disciplinen? Dessa så kallade 'affärsmän' liknar de parasiter vi rensade ut i Moskva. Om de inte kan leda sina företag med järnhand, förtjänar de inte sin frihet. Precis som vår kamrat Putin återtar vad som är vårt, borde staten ta hand om dessa fastigheter åt folket."}, "date": "1 juni, 10:36", "url": "https://www.realtid.se/fastigheter/batljans-bolag-koper-for-300-miljoner/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/foto-terje-pedersentt-d4d65723.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Fast i tunnelbanekaoset i över tre timmar – evakueras i tunnlarna", "summaries": {"normal": "Tunnelbanan i Stockholm drabbades av stora störningar på den röda linjen på grund av ett vagnfel vid Stadion, Karlaplan och Östermalmstorg. Passagerare satt fast i över tre timmar i värmen utan tillräckligt med syre, mat eller vatten. Evakuering skedde längs spåren vid 16-tiden. Polisen bistod SL och trafiken återupptogs vid 17.30, men förseningar kvarstår. Händelsen sammanföll med Stockholm Marathon och en fotbollsmatch.", "trump": "Kan ni fatta det? Mitt under Stockholm Marathon och en stor match så kraschar deras fina tunnelbana totalt. Folk sitter fast i tre timmar som i en ugn, ingen mat, inget vatten, syret tar slut. Typiskt för dessa inkompetenta socialister som styr. De evakuerar dem längs spåren som riktiga hjältar, men det är en katastrof. Biden skulle ha älskat det här kaoset – jag hade fixat det på en timme, tro mig!", "stalin": "Kamrater, detta är vad som händer när borgarbrackorna och deras exploaterande byfånar låter kapitalistmaffians trasiga vagnar styra kollektivtrafiken. Passagerarna, våra arbetare, sitter fångna som i en imperialistisk fälla i över tre timmar medan syret sinar och värmen stiger. Vi evakuerar med järnhand, lugnt och metodiskt, men klassfiendens vanskötsel kräver snar utrensning av alla odugliga element som tillåter sådant sabotage mot folket."}, "date": "30 maj, 20:07", "url": "https://www.tv4.se/artikel/2o9vmFjAUIGaJhTQkCM7Xk/tunnelbanekaos-i-stockholm", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7kmPsrFaUNxksoSGE7Dn4P%2F6c48fb5f408449f47883dcd028f1cf44%2F30-evakuering.jpg&width=120"}, {"type": "image-full", "heading": "Svenska Netflixprofilen kollapsade på mållinjen", "summaries": {"normal": "Realityprofilen Camilla Plahn kollapsade precis före mållinjen under Stockholm Marathon efter att ha kämpat för att slå sitt personbästa. Trots att hon blev buren över mållinjen av andra löpare hamnade hon fyra sekunder över sitt mål på fyra timmar. Plahn beskriver händelsen som skrämmande då hon drabbades av vätskebrist och utmattning, vilket ledde till att hon förlorade medvetandet. Hon är nu tveksam till att springa fler lopp efter den extrema fysiska påfrestningen.", "trump": "Jag har sett bilderna på Camilla Plahn i Stockholm, en total katastrof! Hon pressade sig själv för hårt, det var ingen vacker syn. Fyra sekunder från målet? Det är ett misslyckande, helt enkelt! Man måste ha vinnarmentalitet, men när kroppen stänger av, då är det över. Hon sprang inte som en vinnare, hon kollapsade! Det är väldigt sorgligt, men hos mig får man resultat, inte rullstolar och medicintält. Väldigt svagt, totalt misslyckande!", "stalin": "Denna Camilla Plahn försökte överträffa sig själv i ett dekadent svenskt maratonlopp men misslyckades kapitalt. Att kollapsa fyra sekunder från målet är ett bevis på svaghet och bristande disciplin – en oacceptabel avvikelse från partilinjen. Sådana som hon skulle ha gjort mer nytta i våra sibiriska arbetsläger istället för att svimma i ett medicintält. Putin förstår att man inte vinner territorium genom att kollapsa, utan genom stålhård vilja. Denna kvinna är en nyttig idiot för de löpande sabotörerna."}, "date": "1 juni, 11:40", "url": "https://www.aftonbladet.se/no
