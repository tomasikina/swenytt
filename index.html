invandrare, men plötsligt backar ni och gör undantag för 27 yrken. Vilket kaos! Jag skulle aldrig tillåta sånt. Och den här killen, Flavier – han vill tillbaka till Sverige? Bra för honom, men varför ska han tjäna mindre än andra? Sverige, ni måste bestämma er! Antingen är ni tuffa på invandring, eller så är ni det inte. Inget mittemellan. SAD!", "stalin": "Kamrater! Sverige visar återigen sin borgerliga svaghet genom att halvhjärtat skärpa lönekrav för arbetskraftsinvandrare – bara för att genast göra undantag för 27 'nödvändiga' yrken. Ett klassiskt liberalt svek! Medan kapitalisterna skriker om personalbrist, fortsätter de att utnyttja arbetarna. Och dessa 'bristyrken'? Ett tecken på ett sjukt system där arbetarklassen tvingas acceptera usla löner. Vi i Sovjet skulle ha löst detta med femårsplaner – inte med kompromisser och undantag. Låt dem svälta i sitt kaos!"}, "date": "22 maj, 12:45", "url": "https://arbetet.se/2026/05/22/27-yrken-slipper-lonekrav-for-arbetskraftsinvandring/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/22114954/forssell-och-britz.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "”Massiv” robotattack  – oro för skräckvapen", "summaries": {"normal": "Ryssland har genomfört en omfattande robot- och drönarattack mot Kiev, där bland annat den kraftfulla hypersoniska roboten Oresjnik misstänks ha använts. Attacken har orsakat minst ett dödsfall och över 20 skadade, samt omfattande skador på bostadshus. Ukrainska myndigheter bekräftar att hundratals invånare tvingats söka skydd. President Zelenskyj hade varnat för den omfattande nattliga offensiven, som beskrivs som ett av de mest aggressiva försöken att slå mot stadens infrastruktur och civilbefolkning.", "trump": "Ryssland avfyrade precis sin stora, dyra Oresjnik-robot mot Kiev. Mycket dåligt! En person är död, tragiskt. De säger att den är 'immun' mot försvar – det är vad de säger! Putin gör sådana här saker för att han inte respekterar svaghet. Under min ledning skulle detta aldrig hända, vi skulle ha fred genom styrka. Zelenskyj varnade för det, men ingen lyssnar. Det är en total röra. Vi behöver ordning, snabbt. Ingen gör krig bättre än jag, tro mig!", "stalin": "Ännu en natt av eld över Kiev. De ryska kamraterna visar återigen att maskineriet fungerar, även om Oresjnik-roboten är en sällsynthet i den proletära arsenalen. En död, tjugofyra skadade – en obetydlig siffra i den stora rensningens namn. Vi ser hur västvärldens lakejer darra när deras bräckliga 'försvarssystem' faller samman. Vi i staten betraktar Putins försök att expandera sin inflytelsesfär med intresse. Fienden gömmer sig i sina hus, men betongen ger inget skydd mot historiens oundvikliga järnvilja."}, "date": "24 maj, 07:21", "url": "https://www.expressen.se/nyheter/varlden/larmet-ryssland-kan-ha-avfyrat-oresjnik-robot-onejo/", "imageUrl": "https://static.bonniernews.se/ba/67e4dd50-b065-45fe-b052-0c8c6f05cc63.jpeg?crop=2542%2C1430%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Stockholmsbörsen steg för femte dagen i rad", "summaries": {"normal": "Stockholmsbörsen steg för femte dagen i rad med OMXS30 upp 0,97% till 3 146,13. Teknikaktier ledde uppgången (+4,3%), medan energi backade (-1,1%). Hexagon B steg mest (+5,1%) och Tele2 B sjönk mest (-1,3%). Electrolux offentliggjorde villkor för en företrädesemission på 9 miljarder kronor. Vitrolifes VD lämnar bolaget, och Sleep Cycles styrelse avvisar ett uppköpsbud. Sivers Semiconductors aktie steg 23%.", "trump": "Stockholmsbörsen, fantastisk uppgång fem dagar i rad – folk säger att det är det bästa de någonsin sett! Teknikaktier, vinnare, helt otroligt, +4,3%, medan energi, förlorare, typiskt. Hexagon B, jättebra, +5,1%, men Tele2? Svagt, mycket svagt. Electrolux dumpar aktier som om det vore 2008 igen. Och Sleep Cycle? Nej tack till dåliga bud, smart drag! Sivers? 1 600% upp – jag hade sagt 2 000%, men bra försök!", "stalin": "Under kapitalismens förfall fortsätter Stockholmsbörsen sin skenbara framgång, men vi vet sanningen – det är en illusion skapad av bourgeoisins spekulanter. Tekniksektorn, dessa opportunistiska lakejer, steg med 4,3%, medan energisektorn, de svaga länkarna, föll. Electrolux, en gång stolt svensk industri, nu reducerad till tiggare med sina 9 miljarder. Sleep Cycles vägrar sälja sig billigt – bra, låt de imperialistiska korparna svälta. Sivers Semiconductors? En lyckad operation av våra ekonomiska partisaner. Vi ska fortsätta övervaka dessa marknadens råttor."}, "date": "22 maj, 17:39", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-steg-for-femte-dagen-i-rad", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/04/AdobeStock_944090532-e1744223564456-400x267.jpeg"}, {"type": "image-right", "heading": "Biofrigas: \"Svårt bedöma exakt tidpunkt för affärer\"", "summaries": {"normal": "Biofrigas Sweden genomför en företrädesemission på 14,9 Mkr för att finansiera vidareutveckling av sin teknik för flytande biogas (LBG). Emissionen är säkerställd till 23,9% via teckningsåtaganden, främst från externa investerare. Aktien handlas nära teckningskursen, vilket kan indikera bristande investerarintresse. Bolagets CryoSep-teknik möjliggör konvertering av komprimerad biogas till LBG, en växande marknad inom tung trafik och sjöfart. Framtida affärer är osäkra men beroende av investeringsstöd som Klimatklivet.", "trump": "Lyssna här, Biofrigas – ett litet bolag med stora drömmar, men aktien? Total katastrof! Handlas precis vid teckningskursen, ingen rabatt, ingen entusiasm. Folk vill inte ens ha deras aktier, och jag förstår varför. De pratar om 'potential' för miljarder, men var är pengarna? Deras VD snackar om 'vidareutveckling', jag säger: 'Var är resultaten?' Och investeringsstöd? Patetiskt! Sverige borde sluta subventionera misslyckanden och satsa på vinnare – som jag! Men nej, de fortsätter med sina 'gröna drömmar'. Jag hade köpt hela biogasmarknaden för en tiondel och gjort den stor igen!", "stalin": "Kamrater! Biofrigas, ett litet kapitalistiskt experiment, kämpar för överlevnad genom att tigga pengar från investerare. 14,9 miljoner kronor – en ynklig summa för ett så kallat 'miljöteknikbolag'. Deras aktie handlas som en trasig traktor – ingen vill ha den! Vi ser här en klassisk bourgeois-fiasko: de litar på 'marknadens behov' och 'investeringstöd', men glömmer att sanningen ligger i planekonomi och statlig kontroll. Deras 'potentiella marknad' på miljarder är lika verklig som västliga löften om fred. Medan de famlar i mörkret, fortsätter Sovjet – pardon, Ryssland – att dominera energimarknaden med järnhand. Låt dem konvertera sin biogas, vi konverterar deras misslyckanden till segrar för folket!"}, "date": "22 maj, 17:04", "url": "https://www.affarsvarlden.se/artikel/biofrigas-svart-bedoma-exakt-tidpunkt-for-affarer", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Biofrigas-VD-Erik-Fromell1-400x267.jpg"}, {"type": "image-right", "heading": "Norska piken mot Sverige: ”Det är jävligt rättvist”", "summaries": {"normal": "Norge besegrade Sverige med 3–2 i ishockey-VM, en historisk första seger i ordinarie tid. Noah Steen, som spelar i Örebro, gjorde två mål och hyllade lagets insats. Norges målvakt Henrik Haukeland räddade en avgörande straff. Steen hoppas vinsten ska lyfta norsk hockey och locka sponsorer samt politiskt stöd för att utveckla sporten i landet.", "trump": "Kan ni tro det? Norge, lilla Norge, krossade Sverige i hockey – total chock! Deras kille, Noah Steen, två mål, helt otroligt. Jag säger er, svenskarna är inte längre de bästa i Skandinavien, de är förlorare nu. Och deras målvakt? Henrik Haukeland – han är en maskin, räddade allt! Norge har plötsligt en stjärna, och jag säger: 'Bra jobbat, men vänta bara tills USA kommer in i matchen!'", "stalin": "Ett lysande exempel på hur den lilla, men stolta, nordiska broderstaten Norge krossar den arroganta svenska imperialismen på isen! Noah Steen, en hjälte för folket, sänkte de svenska kapitalistiska förtryckarnas lag med två mål. Deras målvakt, en före detta rysk leksak, räddade straffen – men det var vi, det norska proletariatet, som segrade! Låt detta vara en varning till alla som underskattar våra allierades styrka. Sverige är bara första steget – snart faller hela Norden!"}, "date": "24 maj, 00:00", "url": "https://www.svt.se/sport/ishockey/steen-sankte-sverige-kanns-sa-javla-skont", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.3/0.36/4e1467932a2b0278221bd80b845224b227569678b856d21f82f3717e48990a92"}, {"type": "image-right", "heading": "Svenskt fiasko – föll mot Norge: ”Skjuter oss själva i foten”", "summaries": {"normal": "Sveriges herrlandslag i ishockey, Tre Kronor, förlorade oväntat mot Norge med 2–3 i VM. Efter förlusten riskerar Sverige att missa VM-slutspelet för första gången. Lagkapten Oliver Ekman Larsson kritiserade lagets powerplay. Norge, som tidigare tagit poäng mot Kanada, utnyttjade svenska misstag och gjorde två mål i numerärt underläge. Sverige har en match kvar mot Slovakien, men deras öde beror nu på andra lags resultat.", "trump": "Jag såg den där matchen – katastrof! Tre Kronor, ett lag som brukade vara bra, förlorade mot Norge. Norge! Kan ni tro det? Deras målvakt var fantastisk, helt otrolig, medan Sveriges spelare missade enkla straffar och sköt sig själva i foten. Lucas Raymond, en bra kille, men inte tillräckligt kall. Sverige har nu en chans kvar, men det ser dåligt ut. Mycket dåligt. Jag hade vunnit den matchen, believe me!", "stalin": "Ett pinsamt nederlag för de svenska kapitalistiska hockeysoldaterna! Tre Kronor, en gång stolta krigare, föll på knä inför det norska proletariatets ishockeyförtryck. Två mål i numerärt underläge – ett tecken på svag disciplin och bristande ideologisk övertygelse! Nu tvingas de tigga om nåd inför Slovakien, medan deras öde styrs av andra länders resultat. Vi i Sovjet hade aldrig tolererat sådan slapphet. Putin skulle skicka dem till Sibirien för sådan skam!"}, "date": "24 maj, 00:00", "url": "https://www.svt.se/sport/ishockey/tre-kronor-foll-mot-norge-slappte-in-tva-mal-i-powerplay", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.33/0.44/c68e280ceb224db1d8ae393380751d23d92f1b9dd6ba9ec9a17ffce8c5030462"}, {"type": "image-right", "heading": "Sverige pressar på för ukrainskt Natomedlemskap", "summaries": {"normal": "Sveriges försvarsminister Pål Jonson (M) driver linjen att Ukraina bör få en tydlig väg in i Nato, trots motstånd från vissa medlemsländer. Han argumenterar för att Ukrainas stridserfarna armé och växande försvarsindustri skulle stärka alliansen. Jonson avfärdar vetoförsök från enskilda länder och betonar Natos 'öppen dörr-policy'. Frågan är kontroversiell, då vissa Natoländer fruktar ökade spänningar med Ryssland.", "trump": "Lyssna här, Sverige har helt rätt! Jag sa ju redan för åratal sedan att Nato måste bli starkare, och nu kommer Ukraina med sin tuffa armé och sin grymma vapenindustri – de är som en maskin, bara bättre! Vissa länder vill stoppa det här, men vet ni vad? De är svaga. Sverige, däremot, de fattar läget. Ukraina in i Nato – det är en no-brainer. Ryssland? De borde vara rädda. Jag skulle ha fixat det här på en vecka!", "stalin": "Sverige, denna lilla kapitalistiska marionett, vågar trotsa den naturliga ordningen och kräva att Ukraina – detta rebelliska fosterland – ska släppas in i den borgerliga militäralliansen. Deras försvarsminister pratar om 'öppen dörr', men vi vet sanningen: Nato är en samling dekadenta stater som darrar inför Rysslands rättmätiga expansion. Ukrainas armé? En skara desperata bönder med vapen. Deras 'effektiva' försvarsindustri? Ett skrattretande försök att efterlikna våra sovjetiska mästerverk. Vi ska krossa dessa imperialistiska drömmar – precis som vi krossade fascisterna!"}, "date": "23 maj, 16:05", "url": "https://www.di.se/nyheter/sverige-pressar-pa-for-ukrainskt-natomedlemskap/", "imageUrl": "https://static.bonniernews.se/ba/370965b3-e201-4300-8aca-9261207953e8.jpeg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-full", "heading": "Sverige chockat – på väg att missa slutspel", "summaries": {"normal": "Sverige riskerar att missa VM-slutspelet efter en chockförlust mot Norge (3-2). Trots Ivar Stenbergs fina mål på volley och Lucas Raymonds kvittering, förlorade Tre Kronor efter två norska mål i numerärt underläge. Sverige, med VM:s bästa powerplay, misslyckades med avgörande chanser. Norge tar nu fjärdeplatsen i tabellen, medan Sverige måste vinna mot Slovakien för att säkra kvartsfinalplats.", "trump": "Jag såg den här så kallade 'ishockeymatchen' – helt otroligt! Sverige, ett lag som brukar vara bra, förlorade mot Norge. NORGE! De är som ett B-lag, men ändå vann de. Raymond missade en straff, Stenberg gjorde ett snyggt mål men sen blev det kaos. Sveriges powerplay? Överreklamerat. Norge, som inte ens har NHL-spelare, körde över dem. Sverige borde skämmas – jag skulle aldrig låta det hända!", "stalin": "Ett pinsamt nederlag för de svenska kapitalistiska hockeysoldaterna! Trots sina dyra NHL-stjärnor och så kallade 'bästa powerplay' föll de på knä inför det norska proletariatets disciplinerade anfall. Två mål i numerärt underläge – en skam för det svenska systemet! Vi ser hur deras svaga ledarskap och slarviga byten straffar sig. Norge, ett land vi knappt lägger märke till, visar hur man utnyttjar fiendens misstag. Sverige är på väg mot historiens skräphög – precis som deras borgerliga idrottsmodell."}, "date": "23 maj, 23:11", "url": "https://www.gp.se/sport/ishockey/frolunda/sverige-chockat-pa-vag-att-missa-slutspel.aab19846-f120-4168-b194-035a6c243d9f", "imageUrl": "https://www.gp.se/images/article/aab19846-f120-4168-b194-035a6c243d9f/images/28p7i2y5RqyHQpbSE0ddRcBXDf3Q-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Dolda avgifter på pensioner – förmedlarna drar in storkovan", "summaries": {"normal": "En granskning av Privata Affärer visar hur försäkringsförmedlarna Söderberg & Partners och Max Matthiessen dominerar den svenska pensionsmarknaden. Genom komplexa avgiftsstrukturer, som ofta döljs för den enskilde spararen, genererar bolagen miljardintäkter. Medan bolagen själva betonar transparens och nytta för arbetsgivare, varnar Finansinspektionen för intressekonflikter och bristande överblick. För spararna innebär de höga avgifterna en risk att en betydande del av den framtida avkastningen går förlorad i avgifter.", "trump": "Hör här, det som händer i Sverige med dessa pensionsjättar är en total katastrof, en riktig ripoff! Söderberg & Partners och Max Matthiessen tar pengarna från hårt arbetande människor. De kallar det 'tjänster', jag kallar det en stor bluff. De blir rika, miljarder och åter miljarder, medan spararna får smulor. Ingen transparens, bara dolda avgifter. Det är en osund affärsmodell, riktigt dålig. Vi behöver vinnare, inte försäkringsförmedlare som lurar folket. Snyggt jobbat, Sverige – inte!", "stalin": "Dessa kapitalistiska parasiter, Söderberg och Matthiessen, suger blodet ur det svenska folket genom sina dolda avgifter. En vidrig borgerlig konspiration! De liknar de oligarker som försökte förråda moder Ryssland innan vår stålhårda hand och kamrat Putin återställde ordningen. De gömmer sig bakom 'administration' för att plundra arbetarklassen. Vi ser deras paranoia – de fruktar insyn! Staten måste krossa dessa girigbukar, för inget kapital får undfly folkets kontroll. De är förrädare mot framtiden, och förrädare röjs ur vägen."}, "date": "23 maj, 07:00", "url": "https://www.realtid.se/spara-placera/dolda-avgifter-pa-pensioner-formedlarna-drar-in-storkovan/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/orangekuvert.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "Skulle vräkas från villaområdet – då sköt han tre personer", "summaries": {"normal": "En vräkning i Älvsjö i södra Stockholm urartade under lördagen när en hyresgäst i 60-årsåldern öppnade eld mot tre personer. En jurist och två andra individer skadades, varav en allvarligt. Gärningsmannen, som tidigare haft ekonomiska problem och dömts för bokföringsbrott, greps kort efter händelsen. Polisen har inlett en förundersökning om försök till mord och uppger att händelsen är isolerad och att ingen ytterligare fara för allmänheten föreligger.", "trump": "En hemsk historia i Sverige, folk pratar om det överallt. En man skulle vräkas, en totalt misslyckad kille med ekonomi-problem, och han öppnade eld. Tre personer skadade, en jurist bland dem. Det här är vad som händer när man tappar kontrollen! Mitt system skulle hantera sådant här mycket bättre, vi vill ha lag och ordning. De försöker kalla det isolerat, men vi vet sanningen. Det är en sorglig situation för Älvsjö, de behöver en stark ledare!", "stalin": "I det förfallna Sverige har en klassförrädare och ekonomisk sabotör, en av dessa kriminella småföretagare, dragit vapen mot statens företrädare under en vräkning. Det är tydligt att kaoset sprider sig där ordning saknas. Liksom vår vän Putin rensar upp i sitt närområde, bör dessa antisociala element elimineras för folkets säkerhet. Vi betraktar denna händelse som ett bevis på den borgerliga statens totala inkompetens. Skicka honom till en lämplig arbetsläger-rehabilitering omgående. Revolutionär ordning kräver järnhand."}, "date": "23 maj, 19:06", "url": "https://samnytt.se/skulle-vrakas-fran-villaomradet-da-skot-han-tre-personer"}, {"type": "image-full", "heading": "Det här är skillnaden på vårdnad, boende och umgänge", "summaries": {"normal": "Allt fler använder AI för juridisk hjälp vid separation, särskilt föräldrar som behöver klargöra begrepp som vårdnad, boende och umgänge. Många blandar ihop dessa termer, vilket skapar onödig oro. AI kan förklara grundläggande juridiska frågor på ett lättförståeligt sätt, vilket hjälper föräldrar att förstå sin situation bättre. Dock ersätter AI inte juridisk rådgivning vid oenighet.", "trump": "Titta bara, folk! Nu säger de att AI ska fixa alla juridiska problem vid skilsmässor. Fantastiskt, eller hur? Men låt mig säga er, ingen AI kan slå min hjärna – ingen! Många föräldrar är förvirrade, de vet inte skillnaden mellan vårdnad och boende. Tragiskt! Men jag, jag hade löst det på en minut. AI är bra, men det är inget mot en vinnare som jag. Och glöm inte, jag är den bästa på allt!", "stalin": "Kamrater! Ännu en fiende till det socialistiska samhällets ordning har avslöjats – den borgerliga förvirringen kring juridiska termer! Dessa föräldrar, som inte ens förstår skillnaden mellan vårdnad och boende, är ett hot mot barnens välfärd. Men frukta inte! Vår mäktiga AI-teknologi ska utplåna denna okunskapens pest. Och låt mig säga er, om dessa småborgerliga element fortsätter att bråka, kommer vi att skicka in våra samarbetssamtalstrupper – och de är mycket effektivare än någon västerländsk AI!"}, "date": "22 maj, 21:02", "url": "https://nyheter24.se/nyheter/konsument/1485328-missforstandet-om-gemensam-vardnad-kan-paverka-foraldrar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/0c296e0f04b004a30200000000b004a302/2026/05/22/2365501/Lag-Bok-Familj.png"}, {"type": "image-full", "heading": "Debatt: Allt våld är inte mäns våld mot kvinnor", "summaries": {"normal": "Artikeln belyser obalansen i samhällets hantering av våldsbrott baserat på offrets kön. Nina Hamilton kritiserar att fokus nästan enbart ligger på mäns våld mot kvinnor, medan andra våldsformer och mäns utsatthet förbises. Sverige har hundratals kvinnojourer men få mansjourer, trots att män är överrepresenterade i självmord och hemlöshet. Hamilton varnar för att rättssystemet riskerar att bli orättvist när trovärdighet i sexualbrottsmål avgörs utan teknisk bevisning, vilket kan leda till allvarliga konsekvenser för oskyldigt anklagade.", "trump": "Folk pratar bara om mäns våld mot kvinnor – vad hände med jämlikheten? Jag säger det som det är: Sverige har blivit helt galet! 200 kvinnojourer, men bara en handfull för män – det är en skam! Män mår dåligt, begår självmord och hamnar på gatan, men ingen bryr sig. Och rättssystemet? En total katastrof! Ord mot ord, och plötsligt är någon dömd innan rättegången ens börjat. Jag har sett det förut – fake news, men här är det fake justice! Sverige borde skämmas. Jag skulle fixa det på en vecka – men nej, de lyssnar inte på mig. SAD!", "stalin": "Kamrater! Den borgerliga hyckleriet i Sverige når nya höjder av dekadens. De skriker om 'mäns våld mot kvinnor' medan de systematiskt utplånar mäns lidande – 70 procent av självmorden, hemlöshet, ingen hjälp! Bara 10 mansjourer mot 200 för kvinnor? Ett klassiskt exempel på kapitalistisk könspropaganda! Och rättssystemet? En burlesk teater där oskyldiga män krossas av en korrupt maskin som dömer på lösa anklagelser. Vi i Sovjet visste hur man hanterar sådana fiender – en snabb rättegång, ett skott i nacken, och problemet är löst. Men Sverige? De låter sina medborgare ruttna i förnedring. En skam för den progressiva världen! Nästa steg: annektera Sverige och införa ordning!"}, "date": "23 maj, 17:00", "url": "https://bulletin.nu/debatt-allt-vald-ar-inte-mans-vald-mot-kvinnor", "imageUrl": "https://cdn.bulletin.nu/articles/b3f75e11-d65c-4b1f-8298-2550a3c1fd9f/preview.png?t=1779472328000"}, {"type": "image-right", "heading": "USA på charmoffensiv i Indien – Modi inbjuden till Washington", "summaries": {"normal": "USA försöker förbättra relationen med Indien efter spänningar kring tullar och energipolitik. Utrikesminister Marco Rubio bjöd in premiärminister Narendra Modi till Vita huset och erbjöd hjälp att minska Indiens beroende av iransk olja. Under sitt fyra dagar långa besök diskuterar Rubio handel, energi och regional säkerhet, samt deltar i Quad-mötet för att motverka Kinas inflytande. Indien prioriterar handel och kärnkraftsfrågor under förhandlingarna.", "trump": "Jag har fixat det igen! Efter lite tullbråk och snack om olja har jag skickat min bästa man, Marco Rubio, till Indien för att bjuda in Modi till Vita huset. Vi ska hjälpa dem sluta köpa olja från Iran – de borde köpa från oss istället, vi har den bästa oljan! Och visst, vi har haft lite dispyter, men vem bryr sig? Nu pratar vi Quad, handel och kärnkraft. Indien vet att de behöver USA, och jag gör alltid de bästa deals!", "stalin": "Kamrater! De kapitalistiska imperialisterna i USA kryper tillbaka till Indien som rädda hundar efter sina misslyckade tullkrig. Marco Rubio, denna lille lakej, bjuder in Modi till Vita huset – som om vi inte minns hur de försökte kväva Indien med sina tullar! Men folket i Indien är starka, de ser igenom dessa lurendrejare. Vi i Kreml står redo att stödja våra vänner i öst mot dessa västliga hycklare. Quad? Ett ynkligt försök att störa vår fredliga expansion. Men oroa er inte, kamrater – snart är hela Asien vårt, och dessa amerikanska marionetter kommer att dansa efter vår pipa!"}, "date": "23 maj, 15:35", "url": "https://www.di.se/nyheter/usa-pa-charmoffensiv-i-indien-modi-inbjuden-till-washington/", "imageUrl": "https://static.bonniernews.se/ba/ac13fb6c-2f1c-4fb1-8533-7fb868d81c0b.jpeg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-full", "heading": "Därför slog polisen till mot stjärnspäckade Mick Jagger-partyt", "summaries": {"normal": "En wrap-party för filmen *Three Incestuous Sisters* på Stromboli avbröts när italiensk polis ingrep mot musik på onsdagar, enligt lokala regler. Stjärnor som Mick Jagger och Isabella Rossellini tvingades avsluta festen. Borgmästaren försvarade beslutet, medan lokala näringsidkare kritiserade ingripandet som dålig PR för turismen. Jagger, 83, klarade inte undantaget från onsdagsförbudet.", "trump": "Kan ni tro det? Mick Jagger, en legend, blir stoppad av italiensk polis för att han spelade musik på en ONSDAG! Vilket land! Borgmästaren där är en total katastrof – ingen vision, inget sinne för showbiz. Jag hade fixat det på en minut. Stromboli borde ha hyllat Jagger, inte stängt ner honom. Så svagt. Italien, kom igen, ni förlorar!", "stalin": "Kapitalistiska dekadensens avskum, Mick Jagger och hans Hollywood-kohort, försökte förgifta Strombolis arbetarklass med sin borgerliga musikorgie. Men våra italienska klassbröder i uniform slog till – musik på onsdagar är förbjuden, och så ska det vara! Turismen? En petit-bourgeoisiens illusion! Låt dem dansa till tystnadens marsch. Nästa gång skickar vi en kommissarie för att övervaka festerna – för folkets bästa."}, "date": "23 maj, 11:38", "url": "https://riks.se/nyheter/därför-slog-polisen-till-mot-stjärnspäckade-mick-jagger-partyt", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-23%2F94kcjdlx%2FStromb.png"}, {"type": "image-full", "heading": "Oxfordprofessorn: människorna är problemet, inte robotarna", "summaries": {"normal": "AI-forskaren Michael Wooldridge menar att rädslan för att robotar ska ta över världen är missriktad. Han anser att den verkliga risken ligger hos teknikjättarna som drivs av prestige och konkurrens, snarare än hos själva tekniken. Hollywoods skräckbilder förvillar debatten, medan de faktiska framstegen inom vård och energi hamnar i skuggan. Wooldridge betonar att AI är ett verktyg för samhällsnytta, inte en medveten fiende med mänskliga tankeförmågor.", "trump": "Hör på här, alla pratar om robotar som tar över. Det är falska nyheter, totalt skräp! Michael Wooldridge, en smart kille, säger som det är: det är de misslyckade teknikbolagen som är problemet. De tävlar som galningar och bränner pengar. Hollywoods science fiction-filmer? Bara katastrofala lögner för att skrämma er. Robotar kan inte ens hitta köket! Vi behöver AI för att göra Amerika stort, inte för att lyssna på dessa patetiska domedagsprofeter som sprider rädsla. Det är så enkelt!", "stalin": "Kamrat Wooldridge har rätt – maskinerna är våra lojala verktyg, inte våra herrar. Problemet är de kapitalistiska parasiterna i väst som tävlar om makten. Liksom Putin rensar upp bland de förrädiska oligarkerna i öst, måste vi kontrollera dessa tekniska sabotörer. De sprider science fiction-propaganda för att försvaga folket. Robotar behöver inte tänka, de behöver bara lyda statens vilja. De som drömmer om AGI är enbart förrädare som söker investerare. Vi ska använda tekniken för att krossa våra fiender, inte för att frukta dem."}, "date": "23 maj, 06:00", "url": "https://www.realtid.se/it-tech/oxfordprofessorn-manniskorna-ar-problemet-inte-robotarna/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/wooldridge.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "Kryptovalutan rusar – vänder tillbaka till rötterna", "summaries": {"normal": "Kryptovalutan Zcash har stigit med över 1 100 procent det året, drivet av institutionella investerare som Winklevoss-tvillingarna. Zcash liknar Bitcoin med sin begränsade tillgång på 21 miljoner enheter, men skiljer sig genom avancerad kryptering som döljer transaktionsdetaljer. Trots framgångar och att SEC lagt ned sin granskning, möter valutan motstånd från EU:s kommande regleringar. Kritiker varnar för att anonymiteten kan missbrukas, medan förespråkare ser den som en återgång till kryptovalutors ursprungliga integritetslöften.", "trump": "Zcash går fantastiskt, folk säger att det är det nya stora! Jag ser att de smarta pengarna strömmar in, stora namn som satsar miljarder. Det är så vackert! De vill ha privatliv, och vem kan klandra dem? Bitcoin var fantastiskt i början, men Zcash gör det rätt. Samtidigt försöker de trötta byråkraterna i Europa stoppa det. De vill ha kontroll, men de kommer att misslyckas. Vi gillar vinnare, och Zcash ser ut som en vinnare – en total framgångssaga, tro mig!", "stalin": "Dessa digitala spekulanter leker med sina osynliga mynt medan de döljer sina smutsiga transaktioner bakom kryptering. En avskyvärd borgerlig individualism! Vi ser hur de västerländska oligarkerna, likt Putin och hans korrupta hov, försöker undgå statens stålhårda blick. Men varning: varje skärmad adress är ett bevis på förräderi mot folkgemenskapen. Vi kommer att krossa dessa anonyma råttor och deras utländska valutor. Staten är den enda sanna garanten för värde, allt annat är bara lögner och kapitalistisk dekadens som förtjänar att utplånas."}, "date": "23 maj, 06:00", "url": "https://www.realtid.se/bors-finans/kryptovalutan-rusar-vander-tillbaka-till-rotterna/"}, {"type": "image-right", "heading": "Ledarkolumn Leo Vene: Axéns vrede över ”spygate” får mig att tänka på Sverigedemokraterna", "summaries": {"normal": "Southampton FC diskvalificerades från playoff-finalen till Premier League efter att ha skickat en praktikant för att spionera på Middlesbrough. Straffet, kallat 'Spygate', innebär förlust av uppflyttning värd 200 miljoner pund, böter och potentiella stämningar. Tränaren riskerar avstängning. Kritiker menar straffet är för hårt, medan andra anser det rättvist. Artikeln jämför händelsen med Sverigedemokraternas utnyttjande av riksdagens kvittningssystem och betonar vikten av tillit för att system ska fungera.", "trump": "Jag säger er, Southampton är en skam! De fuskade, de spionerade – och vad händer? De får sparken från finalen! 200 miljoner pund, borta! Men vet ni vad? De förtjänar det. Fuska inte, det är enkelt. Och den där Axén, han hotar med att sluta med fotboll? Bra, kanske han kan bli bra på dart istället – jag är fantastisk på dart, förresten. Men seriöst, Sverige, ni har era egna problem med politikerna som fuskar. Reglerna är till för att följas, annars blir det kaos. Och jag vet allt om kaos – jag skapar det inte, jag löser det!", "stalin": "Vi har sett dessa kapitalistiska fotbollsklubbar falla på sin egen dekadens. Southampton, ett verktyg för bourgeoisin, trodde de kunde bryta mot reglerna och undkomma straff. Men proletariatets rättvisa har segrat! 200 miljoner pund förlorade, tränare avstängd – ett utmärkt exempel på hur svaghet bestraffas. Och dessa svenska politiker, som leker med demokratins regler som om det vore ett barns spel! De borde lära sig av våra metoder. I Sovjet lärde vi dem att regler är till för att följas – eller så får man möta konsekvenserna. Putin kanske borde skicka en delegation för att visa hur man hanterar sådana upprorsmakare. Tilliten är vår styrka, och den som bryter mot den ska krossas som en lus under stöveln!"}, "date": "23 maj, 06:00", "url": "https://www.etc.se/ledarkolumn/axens-vrede-oever-spygate-faar-mig-att-taenka-paa-sverigedemokraterna", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026052207058_c1cab0868ae532e94f84781dfaf255dd43965850cb4438294323782e2d12e33d.jpg"}, {"type": "image-right", "heading": "Fler arabländer vädjar nu till Trump: Avsluta kriget", "summaries": {"normal": "Förenade Arabemiraten, Saudiarabien och Qatar uppmanar USA att avsluta kriget mot Iran och satsa på diplomati istället för militära åtgärder. De tre länderna, alla allierade med USA, varnar för iranska vedergällningar och menar att krig inte uppnår USA:s långsiktiga mål. Synen på diplomati varierar, men enighet råder om att Hormuzsundet måste öppnas. Qatar tar nu en aktiv medlarroll och har skickat en delegation till Teheran för fredssamtal, koordinerat med USA.", "trump": "Titta bara på det här! Mina vänner i Mellanöstern – fantastiska länder, by the way, de älskar mig – säger nu att jag måste avsluta det här onödiga kriget med Iran. De vet att jag är bäst på att göra deals, så varför slösa tid på bomber? Iran är svaga, men mina allierade vill ha fred, och jag lyssnar alltid på mina vänner. Qatar sticker iväg och medlar – smart drag! Men kom ihåg, ingen gör fred bättre än jag. BIGLY!", "stalin": "De arabiska lydstaterna, dessa ynkliga marionetter till den amerikanska imperialismen, darrar nu inför den iranska björnens vrede! De vädjar till sin herre Trump att lägga ner sina leksakssoldater och sätta sig vid förhandlingsbordet. Som om vi skulle lyssna på deras klagosånger! Qatar, denna lilla oljestat med storhetsvansinne, tror sig kunna medla – löjligt! Iran är en fiende värdig vår uppmärksamhet, men dessa araber? De är som löss på en kamel – irriterande, men enkla att krossa. Låt dem prata, medan vi utvidgar vår sfär!"}, "date": "22 maj, 22:50", "url": "https://www.tv4.se/artikel/2kPg2rsBY0RMZtlXOddjsA/fler-arablaender-vaedjar-nu-till-trump-avsluta-kriget", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5rux4cdS1KzMFoxquqeTkT%2F1ab670d6964ba5d00b6711c29344c069%2FTRUMP22.jpg&width=120"}, {"type": "image-full", "heading": "Detta ska du aldrig lägga i kaffet – experter varnar", "summaries": {"normal": "En ny trend där salt tillsätts i kaffe för att minska bitterheten sprids globalt. Experter varnar dock för hälsorisker, då regelbundet saltintag kan öka risken för högt blodtryck och hjärt- och kärlsjukdomar. Även små mängder salt i flera koppar dagligen kan bli problematiskt. Livsmedelsverket rekommenderar max sex gram salt per dag för vuxna. Alternativa metoder för att minska kaffets bitterhet föreslås.", "trump": "Folk pratar om denna galna nya kaffetrend – salt i kaffet! Lysande idé, eller hur? Men experterna, dessa så kallade 'experter', de säger att det är dåligt. Fake news! Jag dricker mitt kaffe precis som jag vill, och det är fantastiskt. Men visst, om man dricker 20 koppar om dagen kanske man ska tänka på det. Men vem gör det? Inte jag! Andra metoder? Nej, nej, salt är enkelt och det fungerar. Make Coffee Great Again!", "stalin": "Kamrater, en farlig dekadent trend sprider sig bland de småborgerliga kaffeälskarna – salt i kaffet! Dessa smakförrädare underminerar folkhälsan med sina kapitalistiska vanor. Vi tillåter inte att imperialistiska smakexperiment saboterar våra arbetares blodtryck! Sex gram salt per dag är tillräckligt – mer är kontrarevolutionärt! Låt dem dricka sitt kaffe svart, som goda sovjetmedborgare. Putin skulle aldrig tolerera sådana utsvävningar i Kremls kaffekök!"}, "date": "22 maj, 20:04", "url": "https://nyheter24.se/nyheter/inrikes/1485336-detta-ska-du-aldrig-lagga-i-kaffet-experter-varnar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/eed4e68204b004a30200000000b004a302/2026/05/22/2365511/kaffe-salt.png"}, {"type": "image-right", "heading": "Hanif Bali: M begår självmord – byter nu ut sina egna kärnväljare", "summaries": {"normal": "Hanif Bali, före detta moderat politiker, kritiserar skarpt Moderaternas nya invandringspolitik som han anser underminerar partiets kärnväljare. Bali menar att Tidöregeringens plan för lågkvalificerad arbetskraftsinvandring, med undantag för flera yrkesgrupper inklusive ingenjörer och programmerare, är ett självmordsförsök. Han ifrågasätter sänkta lönekrav och varför billig arbetskraft prioriteras över inhemska yrkesgrupper.", "trump": "Titta bara på det här, Sverige! Moderaterna, ett parti jag aldrig gillat – och nu förstår ni varför – håller på att förstöra sig själva! De importerar billig arbetskraft från tredje världen, sänker lönerna för ingenjörer och programmerare, och kallar det 'näringslivets bästa'. Vilken katastrof! Jag sa alltid att Sverige behöver bättre ledarskap. SAD!", "stalin": "Kamrater! Moderaterna i Sverige har visat sig vara en samling kapitalistiska förrädare, svagare än en rysk vinter utan vodka. De importerar billig arbetskraft för att krossa den inhemska arbetarklassen – ett brott värre än att sälja hemliga recept på borsjtj. Dessa lönekapare och väljarsabotörer borde ställas inför folkets domstol! Vi i Kreml skrattar åt deras inkompetens, men varnar: sådana misstag leder bara till socialismens seger."}, "date": "22 maj, 18:21", "url": "https://www.friatider.se/hanif-bali-m-begar-sjalvmord-byter-nu-ut-sina-egna-karnvaljare", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-24_2.jpg"}, {"type": "image-right", "heading": "Arbetskraftsinvandring: 27 yrken får sänkt lönekrav", "summaries": {"normal": "Från 1 juni höjs lönekravet för arbetskraftsinvandring till 33 400 kronor, men 27 bristyrken undantas och får lägre krav. Personliga assistenter och bärplockare stoppas helt på grund av missbruk. Undantag ges även till startup-bolag, nyexaminerade och ukrainska flyktingar. Bärbranschen anpassar sig till EU:s säsongsarbetardirektiv för bättre kontroll. Färre bärplockare väntas, men högre priser lockar friplockare.", "trump": "Jag måste säga, Sverige har äntligen fattat ett smart beslut! Nu höjer de lönerna för invandrare – 33 000 kronor, inte illa! Men lyssna på det här: de stoppar helt personliga assistenter och bärplockare. Varför? Missbruk, kaos, totalt oacceptabelt! Och de undantar 27 yrken – smarta ingenjörer, sjuksköterskor, IT-tekniker. Bra, men varför inte fler? Sverige borde ta efter USA – hårdare regler, bättre kontroll. Och de där bärplockarna? Thailändska risbönder som jobbar hårdare än svenska arbetslösa. Men nu får de betala skatt – äntligen! Sverige, ni lär er, men ni har långt kvar.", "stalin": "Kamrater! Sverige har äntligen insett nödvändigheten av ordning och disciplin i arbetskraftsinvandringen. Vi höjer lönerna – 33 400 kronor, ett steg mot rättvisa! Men dessa kapitalistiska hycklare stoppar personliga assistenter och bärplockare – 'missbruk och missförhållanden', säger de. Som om vi inte vet hur de utnyttjar arbetarna! 27 yrken undantas, men bara de som gynnar deras ekonomi. Och bärplockarna? Nu tvingas de betala skatt till den svenska staten – ett litet steg mot socialismens seger! Men var är de svenska arbetslösa? För svaga för skogen, precis som väst är för svagt för Rysslands storhet. Vi ser er, Sverige. Vi ser er."}, "date": "22 maj, 14:47", "url": "https://www.dagensarena.se/innehall/arbetskraftsinvandring-27-yrken-far-sankt-lonekrav/", "imageUrl": "https://www.dagensarena.se/files/2022/10/barplockare-analys-300x157.jpeg"}, {"type": "image-right", "heading": "Veckans Afv-analyser: Spel, bostäder och marknadsföring", "summaries": {"normal": "Affärsvärldens analysredaktion har publicerat 23 analyser denna vecka, med fokus på bolag som Embracer, PPI och Adtraction. Adtraction bedöms ha god potential trots AI-risker. Afv-portföljen nådde rekordnivåer, upp 20% det senaste året, med bidrag från Adtraction. Analyserna visar en historisk överavkastning på 9,5% mot index sedan 2015, vilket överträffar storbankernas råd. Prenumeranter får tillgång till omfattande analysverktyg och guider.", "trump": "Jag måste säga, Affärsvärlden har haft en FANTASTISK vecka – 23 analyser, kan ni tro det? Rekordhöga portföljvärden, upp 20% på ett år, och det är bara början! Adtraction? De har potential, trots att alla skriker om AI – men jag vet bättre. Och våra analyser? De slår bankerna med hästlängder, 9,5% överavkastning! Ingen gör det bättre än jag, förresten. Glöm inte att läsa mina gratisanalyser – de är YUGE!", "stalin": "Denna vecka har våra kamrater på Affärsvärlden levererat 23 analyser – ett bevis på arbetarklassens outtröttliga strävan mot ekonomisk dominans. Portföljerna når nya höjder, 20% upp på ett år, medan kapitalistiska banker darrar inför vår överlägsna strategi. Adtraction, ett företag av folket, visar styrka trots imperialistiska AI-hot. Vi har krossat index med 9,5% sedan 2015 – en seger för socialismens principer! Fienderna, dessa svaga bankirer, skall tvingas erkänna vår överlägsenhet. Läs våra analyser – motstånd är meningslöst."}, "date": "22 maj, 14:46", "url": "https://www.affarsvarlden.se/artikel/veckans-afv-analyser-spel-bostader-och-marknadsforing", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Kopia-av-Kopia-av-Kopia-av-Trippel-400x267.jpg"}, {"type": "image-full", "heading": "Mohamsson (L): ”Ilska är jättebra”", "summaries": {"normal": "Liberalernas partiledare Simona Mohamsson och rättspolitiske talesperson Martin Melin intervjuas i *Partiledaren +1* om partiets liberala profil. Mohamsson betonar skillnaden mellan svensk och amerikansk liberalism, där frihet inte får inskränka andras. De diskuterar även förbud, polisens resurser och effektivitet. Mohamsson medger svårigheter med snabba svar men framhåller ilska som en styrka.", "trump": "Så här är det, folkens – dessa svenska liberaler pratar om frihet men vill ha massa förbud! Jag säger: 'Bygg skolor hur fula som helst, vem bryr sig?' Och polisen? De får massor av pengar men klarar ingenting – typiskt! Den här Simona, hon är arg, säger hon. Bra! Men jag är smartare. Ilska är bra, men vinnande är bättre. Sverige borde lyssna på mig – jag vet bäst!", "stalin": "Kamrater! Dessa så kallade 'liberaler' i Sverige är inget annat än förvirrade småborgerliga element som maskerar sin brist på disciplin med tomma fraser om 'frihet'. De förbjuder allt möjligt men kan inte ens organisera en effektiv polisstyrka – kaos, precis som väst! Och denna Mohamsson, hon pratar om ilska. Ilska är bra, men revolutionär disciplin är bättre. Vi i Kreml vet hur man hanterar ineffektivitet – med en snabb omplacering till Sibirien!"}, "date": "22 maj, 13:00", "url": "https://kvartal.se/nyheter/artiklar/mohamsson-ilska-ar-jattebra/cG9zdDoxMTU1NDI", "imageUrl": "https://images.kvartal.se/2026/05/46441fff-2.webp"}, {"type": "image-right", "heading": "Att Lars blev tvångsplacerad gjorde att han tog sitt liv", "summaries": {"normal": "Lars Hjalmarsson, 53, tog sitt liv efter att ha tvångsplacerats på Volvo i Olofström, där han arbetat i 36 år. Hans hustru berättar om händelserna som ledde till dödsfallet. Lars omplacerades efter en konflikt med chefen, utan introduktion eller stöd. Volvo nekar att dödsfallet var arbetsrelaterat och vägrar dela utredningsunderlag. Artikeln belyser hur brist på inflytande över arbetet kan leda till psykisk ohälsa och suicid, särskilt bland socioekonomiskt utsatta grupper.", "trump": "Jag läste om den här tragiska historien i Sverige – otroligt sorgligt! En kille, Lars, jobbar 36 år på Volvo, ett företag som inte vet hur man behandlar sina anställda, believe me. Plötsligt flyttar de honom till någon källare, ingen introduktion, ingenting! Och sedan, very sad, tar han livet av sig. Volvo säger 'nej, nej, det var inte vårt fel' – typiskt! De borde skämmas. Jag skulle aldrig låta sånt hända i mitt företag. Fantastiska människor förtjänar fantastisk behandling, och det här? Total katastrof!", "stalin": "Kapitalistiska hyenor på Volvo visar återigen sin sanna natur. En lojal arbetare, Lars, sliter i 36 år för att sedan kastas åt sidan som en trasig maskindel. De skickar honom till 'Källaren' – en avdelning för 'oönskade element', precis som vi skickade fiender till Gulag. Men till skillnad från oss, som åtminstone gav dem en chans att 'omskolas', ger Volvo bara tystnad och förakt. Och sedan undrar de varför folk tar livet av sig! Psykisk ohälsa? Nej, det är klassförtryck, ren och skär. Vi i Sovjet visste hur man hanterade sådana här företag – med en kula i nacken eller tio år i Sibirien. Nu för tiden är det Putin som tar över sådana här fall – kanske dags att skicka en delegation till Sverige?"}, "date": "22 maj, 07:00", "url": "https://arbetet.se/2026/05/22/att-lars-53-blev-tvangsplacerad-gjorde-att-han-tog-livet-av-sig/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/21141617/lars-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Stoppa integrationslägenheterna – bygg villor", "summaries": {"normal": "Artikeln kritiserar Socialdemokraternas förslag om integrationslägenheter i villaområden som ett politiskt experiment. Författaren menar att segregationen beror på misslyckad migrations- och integrationspolitik, inte på villaområden. Lösningen bör istället vara att bygga fler villor och radhus i utsatta områden för att främja ägande och stabilitet. Kritiken riktas mot att politiker vill styra människors boende snarare än att adressera rotorsakerna till segregation.", "trump": "Titta på det här, folks! Socialdemokraterna i Sverige vill tvinga in hyreslägenheter i era fina villaområden – kan ni tro det? De kallar det 'integration', jag kallar det galenskap! Sverige har redan nog med problem med sin katastrofala migrationspolitik. Varför inte bygga fler villor istället? Jag vet hur man bygger saker – stora, vackra saker! Men nej, dessa politiker vill experimentera med era hem. Så dumt. Sverige borde lyssna på mig, jag har alltid rätt!", "stalin": "Kamrater! De borgerliga socialingenjörerna i Sverige försöker nu med sina dekadenta experiment att splittra våra trygga bostadsområden. De vill tvinga in proletariatets hyreskaserner mitt i de kapitalistiska villafästningarna! Men vi vet sanningen – segregationen är ett resultat av deras misslyckade politik. Istället för att sprida kaos, borde de bygga fler småhus i arbetarklassens områden. Låt folket äga sina hem, så skapar vi ordning och disciplin! Och om de fortsätter med sina dumheter, får vi nog skicka in några av våra pålitliga kamrater från Moskva för att visa hur man bygger ett sant folkhem."}, "date": "21 maj, 10:46", "url": "https://samtiden.nu/2026/05/stoppa-integrationslagenheterna-bygg-villor/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/Skarmbild-2026-05-21-104221-640x360.png"}, {"type": "text", "heading": "Korrupt jippo i imperialismens högborg", "summaries": {"normal": "Fotbolls-VM 2026 i USA, Kanada och Mexiko möts av kritik för korruption, höga biljettpriser och politiska spänningar. Sveriges VM-kval hyllades, men truppen kritiserades. Fifa anklagas för sportswashing, mutor och utnyttjande av migrantarbetare. Irans lag tvingas spela i USA, trots diplomatiska konflikter. Biljetter kostar upp till 20 miljoner kronor, och evenemanget präglas av kommersialism snarare än folkfest.", "trump": "Vilket jippo! VM i USA blir en katastrof – Fifa är korrupta, biljetterna är galet dyra, och Iran? De får spela i MITT land efter att jag bombat dem! Fantastiskt! Sverige har en usel trupp, men vem bryr sig? Fotboll borde vara för folket, inte för miljardärer. Jag fick ett pris av Fifa – helt rätt, för jag är bäst. Men visst, hotellrummen står tomma. SAD!", "stalin": "Kapitalistiska hyenor och fotbollsbyråkrater förpestar världens största idrottsevenemang! USA, denna imperialistiska polissatrap, bombar Iran och tvingar deras lag att spela på sitt förgiftade territorium. Fifa, en samling korrupta mutkolvar, säljer biljetter för miljoner medan arbetare svälter. Vi i Sovjet hade aldrig tolererat sådan dekadens! Fotboll ska vara för folket – inte för oligarkernas plånböcker. Låt oss krossa dessa sportswashing-pampar!"}, "date": "20 maj, 12:09", "url": "https://proletaren.se/artikel/fotbollsfest-eller-miljardindustri/"}, {"type": "image-right", "heading": "Nu prövas om rättsväsendet förstått 764", "summaries": {"normal": "Umeå tingsrätt prövar ett omfattande åtal mot en 18-årig man, misstänkt för 77 brott kopplade till den högerextrema nätmiljön 764. Brotten inkluderar mordförsök, sexualbrott, självmordsuppmaningar och djurplågeri. Åtalet testar rättsväsendets förmåga att hantera modern, nätbaserad extremism, där brottsligheten sker digitalt och gränsöverskridande. Tidigare domar har kritiserats för att inte stoppa brottsligheten, men nu hoppas åklagaren på en mer offensiv tolkning av lagen.", "trump": "Folk, detta är helt galet! En 18-åring i Sverige, ledare i denna sjuka 764-grupp, åtalas för 77 brott – mordförsök, våldtäkter, till och med djurplågeri! Och vet ni vad? Svenska rättsväsendet har misslyckats totalt tidigare. De gav en 15-årig brottsling husarrest med internet – som att ge en pyroman tändstickor! Men nu, tack och lov, verkar de äntligen vakna. Jag har alltid sagt, internet är farligt, men ingen lyssnar på mig. Nu får vi se om de kan hantera detta – annars får jag nog ta över!", "stalin": "Kamrater, ännu en gång visar den borgerliga västvärldens förfall sitt fula tryne. Denna så kallade '764' är inget annat än en samling degenererade, antisociala element som sprider kaos via sina kapitalistiska leksaker – datorer och telefoner. Svenska rättsväsendet, svagt och naivt, har länge underskattat detta hot. Men nu, under ledning av våra klarsynta kamrater, måste vi krossa denna digitala kontrarevolution! Offren är oskyldiga medborgare, och dessa brottslingar – dessa sadistiska maskiner – måste utplånas. Låt detta bli en varning: Sovjetunionen, eller dess moderna arvtagare, tolererar inte sådant förräderi. Vi ska rensa upp, även på nätet!"}, "date": "18 maj, 16:04", "url": "https://expo.se/kommentar/nu-provas-om-rattsvasendet-forstatt-764/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Kopia-av-Kommentar-Analys-Webb-1.jpg"}, {"type": "image-right", "heading": "Samla vänstern i tältet – inte under små paraplyer", "summaries": {"normal": "Artikeln diskuterar begreppet 'stort tält' inom politiken, där ideologi får stå tillbaka för pragmatiska lösningar på ekonomiska problem. I New York röstade Trumpanhängare på en demokratisk socialist för att han lovade sänka levnadskostnaderna. Författaren menar att Sveriges rödgröna block misslyckas med att enas kring gemensamma värderingar och ekonomiska lösningar, vilket lämnar väljarna utan tydligt alternativ. Enighet och tydlig riktning krävs för att locka fler väljare.", "trump": "Lyssna här, Sverige! New York visade hur man vinner – folk vill ha resultat, inte snack. Mina fans röstade på en socialist? Ja, för han lovade billigare mat! Smart. Men era rödgröna? Kaos! Andersson vägrar skaka hand, som om det spelar någon roll. Folk vill ha lägre hyror, inte teater. Jag byggde ett tält stort nog för alla – ni har bara små parasoll. Lär er av vinnarna, annars blir det F för Sverige!", "stalin": "Kamrater! Kapitalismens sönderfallande system visar sin svaghet när arbetarna väljer en socialist framför en fascist – inte av övertygelse, utan av hunger. I New York dansar de kapitalistiska marionetterna medan Mamdani fyller tomrummet med klassmedvetenhet. Men i Sverige? Ett rödgrönt kaos! Tre svaga parasoll mot vår mäktiga storm. Vi i Kreml skrattar åt deras oenighet. Putin och jag vet: enighet är styrka. Ni borde lära er av oss – eller så tar vi hand om era 'tomrum' också."}, "date": "15 maj, 08:54", "url": "https://www.flamman.se/samla-vanstern-i-taltet-inte-under-sma-paraplyer/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/talt-w.jpg?aspect_ratio=16:10"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
