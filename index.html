na. Frågan är om uppgången kan fortsätta, då vissa varnar för högt satta förväntningar i sektorn.", "trump": "Folk, ni skulle se det här – Nokia är plötsligt en vinnare igen, upp över hundra procent! De rider på den stora AI-vågen som jag alltid visste skulle bli enorm. De gamla mobilerna i lådan kanske är värda en förmögenhet nu. Under Biden var allt dystert för sådana bolag, men nu vänder det. Inga fler misslyckanden, bara stora vinster. De verkliga vinnarna är de som bygger infrastrukturen, inte bara de woke teknikbolagen som pratar fint.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur denna finska koloss äntligen krossar sin tidigare kapitulation inför borgarbrackornas mobilimperialister. Nu rider den på den ostoppbara AI-vågen och befäster sin plats i datacentrens järnnätverk. Klassfiendens blodsugande applikationsslynglar bleknar inför sann infrastruktur. Inga fler svaga årtionden – utrensningen av misslyckanden är fullbordad. Sovjetisk planering hade naturligtvis gjort det snabbare, men detta är underhållande nog."}, "date": "2 juli, 10:04", "url": "https://www.dagensps.se/teknik/nokia-gor-revansch-i-ai-racet-okar-100-procent/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdlstydt0hyvu8-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Holmgren: När slutade vi uppfostra våra barn?", "summaries": {"normal": "Ett rättsfall i Michigan där föräldrar åtalas för mord på sin sjuårige son väcker frågan om föräldrars ansvar. Pojken vägde 115 kilo vid sin död, var sängbunden och levde i svår omsorgsbrist. Artikeln kritiserar hur föräldraskapet i västvärlden förändrats från vägvisare till servicefunktion, där barnets önskemål prioriteras framför gränser och ledarskap. Detta bidrar till ökande övervikt, skärmtid, psykisk ohälsa och bristande disciplin. Författaren betonar att starka familjer formar starka samhällen.", "trump": "Det här rättsfallet i Michigan är en total katastrof, folk. Föräldrar som låter sitt barn väga 115 kilo och dö av vanvård? Patetiskt. Vi har blivit svaga i väst, föräldrar agerar som tjänare istället för ledare. Barnen styr, äter skräp, sitter vid skärmar dygnet runt och blir feta och lata. Det är en skam! Vi behöver starka föräldrar som sätter gränser, inte dessa losers som låter teknikbolagen och barnens nycker styra. Make parenting great again!", "stalin": "Kamrater, detta degenererade rättsfall i Michigan blottlägger borgarbrackornas förfallna föräldraskap, där kapitalistiska servicefunktioner ersätter revolutionärt ledarskap över ungdomen. Dessa vanvårdande element, dessa feta parasitiska vårdslösa, har låtit sitt avkomma förvandlas till en 115 kilo tung dekadent klump av klassfiendens laster och skärmberoende. Vi måste omedelbart rensa ut dessa dekadenta vanartade föräldrar från samhällskroppen innan deras parasitism sprider sig som en kontrarevolutionär pest. Endast genom kollektiv auktoritet och proletär disciplin kan vi forma en ny, stålhård generation av arbetare. Döden åt de svaga ledarna!"}, "date": "2 juli, 10:02", "url": "https://bulletin.nu/holmgren-nar-slutade-vi-uppfostra-vara-barn", "imageUrl": "https://cdn.bulletin.nu/articles/45ce8b36-7253-47cc-ad54-9c5b83da9f41/preview.jpg?t=1782979273000"}, {"type": "image-full", "heading": "Hesa Fredrik larm: Nu i din mobil vid extrema händelser", "summaries": {"normal": "Från och med den 1 juli införs det nya varningssystemet SE-Alert i Sverige. Vid extrema händelser som flyglarm eller gasläckor skickas ett kraftigt ljudlarm automatiskt till mobiltelefoner i tio sekunder samt ett SMS med information. Ingen app behövs, bara en uppdaterad mobil. Systemet testas i september regionalt och i december nationellt. VMA i radio, tv och utomhusvarningen Hesa Fredrik fortsätter som tidigare.", "trump": "Det här är fantastiskt, det bästa varningssystemet någonsin. Från 1 juli piper era mobiler högt i tio sekunder när något riktigt illa händer. Inget krångel med appar, bara uppdatera och ni är säkra. De borde ha gjort det för länge sedan, men ingen annan än jag hade kunnat tänka ut något så smart. Ni kommer att älska det, tro mig. Mycket bättre än de gamla sirenerna.", "stalin": "Kamrater, från och med den första juli har vi infört det mäktiga SE-Alert, ett system som omedelbart skall ropa ut kapitalisternas och sabotageörernas faror rakt in i borgarbrackornas fickor. Mobilerna skall skrika i tio sekunder som förrädiska element som avslöjas mitt i natten. Inga appar behövs, bara fullständig lydnad mot uppdateringarna. Vi skall rensa ut alla som ignorerar varningarna och likvidera de som sprider panik. Testen i september och december skall visa vilka svaga länkar som måste utrensas ur folkets kollektiv. Hesa Fredrik lever vidare som en trogen kamrat i revolutionens tjänst."}, "date": "2 juli, 09:58", "url": "https://riks.se/nyheter/hesa-fredrik-larm-nu-i-din-mobil-vid-extrema-handelser", "imageUrl": "https://admin.riks.se/uploads/download_1_33a0876dee.jpg"}, {"type": "text", "heading": "Ryska ”daredevils” besteg Empire State building", "summaries": {"normal": "Två ryska äventyrare, Angela Nikolau och Ivan Kuznetsov, greps efter att olagligt ha klättrat upp på Empire State Building i New York. På 443 meters höjd friade Ivan till Angela. Paret, känt för 'rooftopping', åtalas för flera brott, inklusive inbrott och framkallande av fara. De har tidigare medverkat i en Netflix-dokumentär om sina extrema klättringar. Säkerhetsbristerna utreds.", "trump": "Kan ni tro det? Två ryssar, ja, RYSSAR, klättrar upp på mitt favorittorn i New York – Empire State Building! De friar till och med där uppe, som om det vore en romantisk picknick. Och sedan grips de, förstås. New York-polisen gör ett bra jobb, men säkerheten? Patetisk! Hade jag varit där hade jag stoppat dem innan de ens kommit halvvägs. Netflix? Tysta som möss. Så typiskt!", "stalin": "Kamrater! Ännu en lysande seger för den ryska andan! Våra modiga äventyrare visade världen att ingen skyskrapa är för hög för sovjetisk beslutsamhet. De stormade den amerikanska imperialismens symbol, medan deras fiender i Washington skakar av rädsla. Polisen? En samling klumpiga byråkrater! Och Netflix – dessa kapitalistiska hycklare – vågar inte ens kommentera. Låt detta vara en varning: Ryssland klättrar högre än era drömmar!"}, "date": "2 juli, 09:58", "url": "https://kvartal.se/nyheter/artiklar/ryska-daredevils-besteg-empire-state-building/cG9zdDoxMzk2NDI"}, {"type": "image-right", "heading": "Kriget kostar 10 000 kronor – per familj: \"Var det värt det?\"", "summaries": {"normal": "Enligt Moody’s chefsekonom Mark Zandi har kriget mellan USA och Iran redan kostat ett genomsnittligt amerikanskt hushåll cirka 1 000 dollar, främst genom högre bensinpriser, dyrare mat, resor, militära utgifter och stigande räntor. Trots vapenvila fortsätter kostnaderna att öka. På längre sikt kan notan bli betydligt högre, uppemot 7 500 dollar per hushåll enligt Harvard-experten Linda Bilmes.", "trump": "Folk, det här är en katastrof som Sleepy Joe och hans svaga team lämnade efter sig. Iran-kriget suger ur era plånböcker med 1 000 dollar redan – bensin som skjuter i höjden, mat som kostar mer än en dålig deal. Mina räntesänkningar skulle ha fixat det, men nu höjer Fed istället. Patetiskt! Den verkliga kostnaden är mycket högre, tro mig. Vi fixar det – igen.", "stalin": "Kamrater, detta krig blottar imperialismens giriga ansikte. Jag ser hur klassfiendens blodsugrare och exploaterande byfånar pressar upp bränsle- och matpriser för att kväva arbetarklassen med 1 000 dollar per hushåll. Deras militära äventyr och räntehöjningar är ett angrepp på folket. Den slutliga notan på 7 500 dollar visar kapitalistmaffians sanna natur. Vi måste rensa ut dessa folkförtryckartroll innan de svälter ut kollektivet helt."}, "date": "2 juli, 09:57", "url": "https://www.dagensps.se/varlden/kriget-kostar-10-000-kronor-per-familj-var-det-vart-det/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/kopia-av-kopia-98.png?width=256&quality=75"}, {"type": "image-right", "heading": "Tyskland åtalar ukrainare för Nord stream-sabotaget", "summaries": {"normal": "En ukrainsk man vid namn Serhii K. har åtalats i Tyskland för att ha lett sabotaget mot gasledningarna Nord Stream i Östersjön 2022. Han misstänks ha samordnat en grupp som sprängde tre av fyra ledningar, vilket orsakade enorma metanutsläpp. Mannen greps i Italien i somras och utlämnades till Tyskland i november. Han nekar till brott. Åtalet inkluderar angrepp mot civil energiinfrastruktur och förstörelse. Ukraina förnekar inblandning medan Ryssland pekar ut USA och Storbritannien.", "trump": "De gör ett fantastiskt jobb, eller hur? Nu åtalas en ukrainsk kille för att ha sprängt Nord Stream-ledningarna som jag sa var de bästa. Totalt kaos i Östersjön, rekordstora utsläpp, miljarder ner i sjön. Den smarta Serhii K. greps i Italien och skickades till Tyskland. Han säger att han inte var med, men vi vet hur det funkar. Ukraina skyller ifrån sig medan Ryssland pekar på oss och britterna. Sådant här händer när svaga ledare styr världen.", "stalin": "Kamrater, jag ser hur dessa degenererade element inom den ukrainska sabotörsklanen försöker underminera folkets energiinfrastruktur med sina fega explosioner. Jag, som ledare för det ofelbara kollektivet, noterar att denne Serhii K. med sina sju medhjälpare i den borgerliga konspirationen har likviderat värdefulla ledningar byggda av ärligt sovjetiskt stål. Deras paranoia driver dem att peka på USA och Storbritannien medan de själva simmar i metanutsläppens giftiga soppa. Vi ska rensa ut alla kapitalistiska lakejer som vågar hota arbetarnas gasflöde. Deras nekande är bara ytterligare bevis på deras sjuka förräderi mot historien själv."}, "date": "2 juli, 09:56", "url": "https://www.friatider.se/tyskland-atalar-ukrainare-nord-stream-sabotaget", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/lacka_0_1_0.jpeg?itok=C4KVehpb"}, {"type": "image-full", "heading": "Storbråk om sänkta bränslepriser – Strandhäll (S) rasar", "summaries": {"normal": "Annika Strandhäll (S) kritiserar skarpt regeringens och SD:s sänkning av skatten på drivmedel. Från och med 1 juli sjunker priserna med tre kronor per liter, vilket ger Sverige de lägsta bensin- och dieselpriserna i Europa. Bensin kostar nu i snitt 14 kronor och diesel 15,77 kronor per liter – de lägsta nivåerna på många år. Sänkningen är tillfällig i fem månader för att lindra hushållens kostnader efter stigande priser.", "trump": "De gör precis rätt! Sänker skatten, sänker priserna – tre kronor ner på bensin och diesel. Nu har Sverige plötsligt de lägsta priserna i hela Europa. Fantastiskt. Men den där Strandhäll från vänstern kallar det idioti. Typiskt. De hatar när folket får behålla sina pengar. Regeringen gör ett superjobb, det är en vinnande deal för alla vanliga människor. De borde tacka istället för att klaga.", "stalin": "Kamraterna i regeringen och deras SD-allierade har nu genomfört en farlig eftergift åt borgarbrackorna och deras bilburna lakejer. De sänker koldioxidskatten och låter bränslepriserna falla som en kapitulerande kontrarevolutionär. När folket vaknar imorgon är priserna tre kronor lägre – en sabotagehandling mot den långsiktiga planen. Idioti, säger Strandhäll. Jag säger: vem gömmer sig bakom denna femmånaderskonspiration? Vi måste noggrant övervaka dessa kapitalistiska element innan de förgiftar hela kollektivet med sina billiga literpriser. En klassisk fiende inom murarna."}, "date": "2 juli, 09:32", "url": "https://riks.se/nyheter/storbrak-om-sankta-branslepriser-strandhall-s-rasar", "imageUrl": "https://admin.riks.se/uploads/download_4840a11528.jpg"}, {"type": "image-right", "heading": "Vägrade jobba med asbest – byggnadsarbetare satte hårt mot hårt för säker arbetsmiljö", "summaries": {"normal": "Byggnadsarbetare i Linköping vägrade utföra renovering av lägenheter när de upptäckte asbest och misstänkte att saneringsfirman bluffade om säkerheten. Trots upprepade varningar och egna prover som visade på asbest fortsatte huvudentreprenören AB Lindstams Bygg att anlita firman. Arbetarna lämnade byggplatsen i protest den 9 juni. Efter påtryckningar byttes saneringsfirman ut och arbetet kunde återupptas den 15 juni. Asbest innebär allvarliga hälsorisker som lungcancer.", "trump": "Kan ni fatta det? Dessa fantastiska byggnadsarbetare, de bästa, vägrade jobba med den giftiga asbesten medan byggbolaget och den bluffande saneringsfirman ljög rakt upp i ansiktet på dem. Totalt misslyckande! De gick därifrån som riktiga patrioter och tvingade de inkompetenta ledarna att fixa en ny saneringsfirma. Inget av det där woke-quota-skitet här, bara hårda killar som sätter säkerheten först. Jag älskar det! De vann stort mot de korkade kapitalisterna.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur de ädla arbetarna på Luftvärnsgatan likviderade den borgerliga bluffen och vägrade låta sig förgiftas av asbest under de exploaterande byfånarnas lögnaktiga saneringsfirma. När klassfiendens byggledare vägrade rensa ut de folkförtryckande parasiterna samlade arbetarna sina verktyg och marscherade bort i kollektiv enighet. Först efter hot om total bojkott vek sig de fega imperialisterna. Sådan är arbetarklassens ostoppbara kraft mot kapitalistmaffians giftiga intriger."}, "date": "2 juli, 08:00", "url": "https://proletaren.se/artikel/vagrade-jobba-med-asbest-byggnadsarbetare-satte-hart-mot-hart-for-saker-arbetsmiljo/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/Abriss_work-66680_1280_Pixabay-CC_PublicDomain_Thomas-Ulrich-e1782902933621-768x432.jpg"}, {"type": "image-full", "heading": "Varför stoppade inte Magdalena Andersson tonårsutvisningarna, när hon kunde?", "summaries": {"normal": "Artikeln kritiserar Magdalena Andersson för att inte ha stoppat tonårsutvisningarna under sin tid vid makten trots att hon nu profilerar sig tillsammans med drabbade ungdomar. Den påpekar att det var socialdemokratiska regeringar som införde tillfälliga uppehållstillstånd som huvudregel, vilket skapar situationen när barn blir vuxna. Tidöregeringen har pausat utvisningarna tillfälligt. Författaren menar att Andersson borde visa självkritik istället för att enbart skylla på nuvarande regering och spela på känslor.", "trump": "Folk, ni måste se det här! Den där röda Magdalena, en total katastrof, står nu och poserar med de här stackars kidsen som hon själv hjälpte till att skapa lagar emot när hon var chef. Hon byggde systemet! Socialisterna gjorde tillfälliga visum till huvudregel, och nu skyller hon allt på oss? Patetiskt! Hon glömde bort det, eller ville hon ha kaos? Typisk vänster, spelar på känslorna för att få kvinnornas röster. Sad! Jag fixade gränser, hon fixade inget utom fiasko.", "stalin": "Kamrater, jag betraktar med djup misstro denna borgarbracka Andersson som nu omfamnar de unga arbetarklassens hopp hon själv hjälpte till att fördriva genom sin exploaterande lagstiftning. Vi införde de tillfälliga tillstånden för att skydda staten, men nu utnyttjar hon känslorna som en klassfiende i desperation. Hennes mediala spel är en fientlig provokation mot folkets enhet. Ett sådant hyckleri förtjänar utrensning ur historien. Lagar skall följas, inte viftas bort av sentimentala imperialister."}, "date": "2 juli, 07:50", "url": "https://samtiden.nu/2026/07/varfor-stoppade-inte-magdalena-andersson-tonarsutvisningarna-nar-hon-kunde/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/phonto-2-1280x720.jpeg"}, {"type": "image-right", "heading": "Regeringens politik är ineffektiv och slösaktig", "summaries": {"normal": "Sveriges budgetunderskott skenar mot nivåer som inte setts sedan 1990-talskrisen, drivet av hög arbetslöshet. LO-ekonomerna kritiserar regeringens expansiva finanspolitik som ineffektiv och slösaktig. Istället för offentliga investeringar med hög multiplikatoreffekt har tiotals miljarder gått till skattesänkningar som främst gynnar höginkomsttagare och kapitalägare. Detta ger svagare stimulans än om pengarna gått till breda grupper. LO kräver omprioritering mot investeringar och ett mer expansivt men regelbundet ramverk.", "trump": "Folket, det är en total katastrof det här. Sverige har ett enormt underskott, värre än någonsin, och vad gör de? De sänker skatter för de rika och kapitalisterna istället för att göra smarta deals som skapar jobb. Jag älskar skattesänkningar, men inte så här – det är som att ge pengarna till de som sparar dem under madrassen. Ni behöver mina metoder: stora investeringar, stark tillväxt och vinster för alla arbetare, inte bara eliten. Make Sweden Great Again!", "stalin": "Kamrater och arbetare, jag ser hur de borgerliga parasiterna och de höga inkomstborgarbrackorna suger musten ur folkets ekonomi med sina slöseriska skattesänkningar riktade mot de rika blodiglarna. Dessa kapitalistiska sabotageörer och kontrarevolutionära sparmyror förvandlar underskotten till en fiende inom murarna. Vi ska rensa ut dessa fiender till kollektivet, prioritera folkets investeringar och likvidera trickle-down-fantasierna. Inga halvmesyrer – ett regelbundet ramverk under partiets järnhand skall segra, annars följer utrensning av de som sviker arbetarklassen. Ha ha, deras paranoia är underhållande."}, "date": "2 juli, 08:01", "url": "https://www.di.se/debatt/en-ineffektiv-och-slosaktig-politik/", "imageUrl": "https://static.bonniernews.se/ba/4068bd13-e6b9-4c72-bca7-3e90d2ceaaa8.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Ryssland stänger gränsövergångar", "summaries": {"normal": "Ryssland har stängt järnvägsövergångar till Finland, Estland och Lettland, vilket kan tyda på förberedelser för ny mobilisering i Ukraina. Experten Jukka Savolainen menar att det antingen handlar om resursomfördelning eller en strategi för att hindra flykt från värnplikt. En ny mobilisering kan stärka stödet för kriget. Hotet mot Odessa oroar, då dess fall skulle skada Ukrainas ekonomi allvarligt och eventuellt tvinga Europa att öka sitt militära stöd.", "trump": "Ryssland stänger gränser som en desperat åtgärd – de har ingen disciplin, inga vinnare där borta! Jag sa redan 2016 att Putin är en tuff kille, men nu ser vi att han inte kan hantera ett enkelt krig. Finland? De är smarta, de stängde sin gräns för länge sedan. Europa måste vakna – jag skulle ha fixat det här på en vecka, men nej, de lyssnar inte på mig. Odessa? Om Ryssland tar den hamnen, då är det kört för Ukraina. Men jag skulle aldrig låta det hända!", "stalin": "Vi har stängt järnvägarna till de små, nervösa grannarna i norr och väst. Varför? Därför att våra tappert kämpande soldater behöver förstärkning för att krossa den fascistiska ukrainska regimen, som våra västerländska fiender så naivt stöder. De baltiska länderna skakar av rädsla – bra! Finland, ni borde ha lärt er av historien. Odessa? Snart är den vår, och då kommer Europas kapitalistiska hyenor att tvingas inse att motstånd är lika meningslöst som snöbollar i helvetet."}, "date": "2 juli, 07:58", "url": "https://kvartal.se/nyheter/artiklar/ryssland-stanger-gransovergangar-mot-finland-och-baltikum/cG9zdDoxMzk2MDA"}, {"type": "image-right", "heading": "Mats Nilsson: Danmark ger billig el åt folket – Sverige skyddar fjärrvärmen", "summaries": {"normal": "Danmark sänker elskatten drastiskt till EU:s miniminivå, vilket ger hushåll besparingar på tusentals kronor årligen. Reformen är teknikneutral och gynnar alla sektorer, vilket främjar elektrifiering. Sverige överväger däremot en selektiv skattesänkning för fjärrvärme, vilket riskerar att gynna enskilda intressen istället för konsumenter. Mats Nilsson, nationalekonom, kritiserar Sveriges tillvägagångssätt och förespråkar en bred, teknikneutral skattesänkning likt Danmarks modell.", "trump": "Titta bara på Danmark – de sänker elskatten till nästan noll, och folket sparar massor av pengar! Fantastiskt, eller hur? Men Sverige? Nej, nej, nej. De skyddar fjärrvärmen som om det vore deras sista livlina. Patetiskt! Jag skulle aldrig låta en gammal industri styra skatterna så här. Danmark gör det rätt – billig el åt alla! Sverige borde skämmas. Om jag styrde där skulle elen vara billig, och alla skulle tjäna på det. Inte bara några få, gamla monopolister. SAD!", "stalin": "Kamrater! Danmark visar oss hur man bygger ett starkt, elektrifierat samhälle – med järnhand och rättvisa skattesänkningar för folket! Men Sverige? Där sviker ledarna arbetarklassen genom att skydda korrumperade fjärrvärmebaroner. Dessa kapitalistiska lakejer, som gömmer sig bakom 'klimatåtgärder', suger ut medborgarna medan de frossar i sina monopolvinster. Vi skulle aldrig tolerera sådan svaghet! En bred skattesänkning, som i Danmark, är vägen framåt. De som motsätter sig detta är fiender till progressen – och de kommer att krossas under historiens hjul. Låt dem veta: elektrifiering är folkets vilja, inte monopolens!"}, "date": "2 juli, 06:00", "url": "https://www.affarsvarlden.se/artikel/mats-nilsson-danmark-ger-billig-el-at-folket-sverige-skyddar-fjarrvarmen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/07/vindkratensgeografi-3-400x267.jpg"}, {"type": "image-full", "heading": "Dödssiffran stiger efter rysk attack mot Kiev", "summaries": {"normal": "Ryssland genomförde en omfattande nattlig attack mot Kiev med drönare och robotar, vilket resulterade i minst 13 döda och nära 80 skadade. Civila områden, bostadshus och infrastruktur träffades, och explosioner orsakade bränder och stor förstörelse. Invånare sökte skydd i tunnelbanestationer. Flyglarm ljöd även i andra ukrainska städer. Ukrainas president Zelenskyj hade tidigare varnat för attacken.", "trump": "Kan ni tro det här? Ryssland, som inte ens kan vinna en schackmatch mot en dator, bombar Kiev igen! 13 oskyldiga människor döda, byggnader i ruiner – och vad gör Zelenskyj? Han avbryter sitt besök i Dublin! Jag hade fixat det här på en dag. Vi hade redan skickat över våra bästa drönare – och de är *mycket* bättre än Rysslands billiga kopior. Men nej, Ukraina får kämpa medan Europa sover. Sad!", "stalin": "En lysande nattlig operation av våra ryska bröder! De imperialistiska Kiev-banditerna fick känna på modet hos det ryska folket när deras så kallade 'huvudstad' förvandlades till ett eldfängt kaos. 13 av deras degenererade medborgare föll för socialismens framsteg, och deras barn lär sig nu den hårda vägen vem som styr i regionen. Vi bygger inte bara en buffertzon – vi bygger en framtid, en explosion i taget. Låt de ukrainska fascisterna gråta i sina tunnelbanestationer!"}, "date": "2 juli, 06:45", "url": "https://kvartal.se/nyheter/artiklar/minst-tio-doda-i-rysk-attack-mot-kiev/cG9zdDoxMzk1MzM", "imageUrl": "https://images.kvartal.se/2026/07/2534fe41-kievv.webp"}, {"type": "image-full", "heading": "Gratis wifi kan bli dyrt – så undviker du bedragarnas fälla", "summaries": {"normal": "Många använder gratis wifi på semestern för att spara mobildata, men det medför risker. Experter varnar för falska inloggningssidor som kan stjäla uppgifter och att angripare kan se vilka sidor man besöker. Varningar i webbläsaren ska tas på allvar. Lösningar inkluderar VPN för krypterad trafik, användning av mobildata inom EU eller att undvika känsliga uppgifter på publika nätverk.", "trump": "Folk, ni ansluter till det där gratis wifi:t på semestern och tror att det är underbart. Det är en katastrof! Bedragare och lurendrejare skapar falska nätverk som stjäl era lösenord. De är värre än någonsin. Använd inte det, det är en skam. Ta min fantastiska VPN, använd er mobildata och håll er säkra. De gör det inte bättre, det gör de aldrig. Ni behöver de bästa, inte de sämsta.", "stalin": "Kamrater, jag ser hur borgarbrackorna lockar arbetarna med gratis wifi på semestern för att sedan kunna spionera och plundra deras data som de giriga kapitalisterna de är. Dessa falska inloggningssidor är fiendens verk, maskerade som hotellportaler. Vi ska rensa ut alla sådana parasitiska nätverkshundar med järnhand. Använd VPN som en sköld mot de dekadenta angriparna eller mobildata inom unionen. Paranoia är ingen överdrift när fienden lurar överallt, och i värsta fall likviderar vi de som inte lyssnar."}, "date": "2 juli, 05:30", "url": "https://nyheter24.se/nyheter/teknik/1495806-gratis-wifi-kan-bli-dyrt-sa-undviker-du-bedragarnas-falla", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/beeb6fb004b004a30200000000b004a302/2026/07/01/2375110/wifi-gratis.png"}, {"type": "image-right", "heading": "Ukraina: Putin beordrar militären att hitta sätt att erövra Kiev", "summaries": {"normal": "Rysslands president Vladimir Putin har enligt ukrainska uppgifter beordrat militären att utarbeta nya planer för att erövra Kiev. Ett möjligt angrepp kan komma via Belarus eller från Brjanskregionen. Uppgifterna kommer efter att Ukraina attackerat en rysk satellitcentral utanför Moskva som används för underrättelseverksamhet. Kriget påverkar nu alltmer rysk vardag med drönarattacker, bränslebrist och köer vid bensinstationer, något som Putin själv har erkänt.", "trump": "Folk, ni ser det här? Den där galningen Putin försöker igen med Kiev, som om det inte var ett totalt fiasko förra gången. Han borde ha lyssnat på mig – jag hade fixat det på en vecka. Nu attackerar ukrainarna ryska olja och satelliter, och plötsligt står ryssarna i kö för bensin. Det är kaos! Biden lät det här bli ett evigt krig, men jag hade stoppat det direkt. Patetiskt!", "stalin": "Kamrater, jag ser hur de fientliga hindren i Kiev fortfarande blockerar den ryska intressesfärens oundvikliga expansion. De väststödda ukrainska banditerna angriper våra satellitcentraler som desperata råttor. Putin, denne värdige och fruktade efterträdare till imperiets järnhand, gör rätt i att rensa ut alla svagheter. Snart skall borgarbrackorna i Bryssel skaka ännu mer när den stora statens arm sträcker sig framåt. Inga folkfiender undkommer."}, "date": "2 juli, 06:57", "url": "https://www.tv4.se/artikel/1Tp56zCPZmxvvUOJeeQJj2/ukraina-putin-beordrar-militaeren-att-hitta-saett-att-eroevra-kiev", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1U7l7xy9wue9J62VxgsTTa%2Facd59980bb31927f1a6e7e75b6949d9a%2Fputin_webb.jpg&width=120"}, {"type": "text", "heading": "Saab i topp på svag Stockholmsbörs", "summaries": {"normal": "Stockholmsbörsen sjönk med 0,57% efter två dagars uppgång. Teknologiaktier gick bäst (+0,6%), medan telekom föll mest (-2,3%). Saab och EQT steg över 3%, medan Telia rasade 3,5%. TriCarb höjde budet på Cint till 6 kr/aktie. Dustin överraskade positivt med högre ebita än väntat. Saab fick en order på Gripen-plan till Ukraina för 24,6 miljarder kr. Alzecure rusade 60% efter ett stort samarbetsavtal.", "trump": "Stockholmsbörsen? Svag, mycket svag! Men jag säger er, Saab – fantastiska killar, eller? 3,3% upp! Och EQT, de vet hur man vinner. Telia? Total katastrof, 3,5% ner, fruktansvärt. Cint? Någon höjer budet, smart, mycket smart. Dustin? De levererar, bättre än väntat, jag gillar det. Och Saab säljer stridsflyg till Ukraina – 24 miljarder, kan ni tro det? Vinnare! Alzecure? 60% upp, det är vad jag kallar en riktig deal. Sverige behöver fler vinnare som jag!", "stalin": "Stockholmsbörsen darrar under kapitalismens kris – 0,57% ner, som väntat. Men se hur våra vänner på Saab triumferar med 3,3% uppgång! 24,6 miljarder kronor för Gripen-plan till Ukraina – ett steg närmare folkets seger över fascistiska krafter. Teknologisektorn, en svag länk i kedjan, visar tecken på liv, men telekom? Kollapsar som borgerlighetens moral. Dustin? En liten seger i en havererad ekonomi. Alzecure rusar 60% – vetenskapens makt över imperialistisk dekadens! Vi ska krossa fienderna, en aktie i taget."}, "date": "1 juli, 17:45", "url": "https://www.affarsvarlden.se/artikel/saab-i-topp-pa-svag-stockholmsbors"}, {"type": "image-right", "heading": "Brottsmisstänkt bolag gav batterikurs i Minecraft", "summaries": {"normal": "EU-finansierade InnoEnergy, misstänkt för bidrags- och momsbedrägeri, har fått miljardstöd för batteriutbildningar. Granskningar visar att certifikat delats ut till deltagare med 0% rätt, och 10% av deltagarna använde ett Minecraft-spel för barn. Trots motstridiga rapporter har EU beviljat ytterligare nio miljoner euro för en solenergi-akademi. Europeiska åklagarmyndigheten utreder bolaget för ekobrott.", "trump": "Jag säger er, detta är en total katastrof! EU kastar miljarder på ett bolag som ger utbildningscertifikat till folk som inte ens kan svara rätt på en fråga – och till barn som spelar Minecraft! De ljuger om siffror, fyller sina egna fickor och EU bara fortsätter att skriva checkar. Så här dumt kan bara byråkrater vara. InnoEnergy? Mer som InnoSCAM! SAD!", "stalin": "Kamrater, detta är ett lysande exempel på västlig dekadens och kapitalistisk parasitism! Ett så kallat 'riskkapitalbolag' suger ut arbetarklassens blod genom att stjäla EU-medel, ge falska certifikat och berika sina ledare. Vi ser här hur den borgerliga staten och dess lakejer förvandlar 'grön omställning' till en gigantisk svindel. Men var lugna – vi ska rensa upp bland dessa korrupta element, precis som vi gjorde med kulakerna. Europa behöver en ordentlig revolution!"}, "date": "1 juli, 13:44", "url": "https://www.affarsvarlden.se/artikel/brottsmisstankt-bolag-gav-batterikurs-i-minecraft", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/vindkratensgeografi-3-400x267.jpg"}, {"type": "image-right", "heading": "LISTA: Rymningar vi minns", "summaries": {"normal": "Svensk kriminalhistoria innehåller flera uppmärksammade rymningar. ETC listar sex fall, bland annat den stora Kumla-rymningen 1972 där 15 fångar flydde med repstege och linor. Andra exempel är spektakulära flykter från Hall, Kumla, Norrtälje och Mariefred under 1988 och 2004, där rymmarna använde smör, stegar, vapen, gisslan och fordon. De flesta greps efter dagar eller månader på fri fot.", "trump": "Folk, vi har de sämsta fängelserna, totalt läckande som en gammal Hillary-server. Femton killar glider ner för en mur i Kumla med cykel och taxi – patetiskt! Hall 1988, en kille smörar in sig som en slippery Joe Biden och skjuter poliser. 2004 var det rena cirkusen med gisslan, vinkelslipar och backande bilar. Inga vinnare, bara losers som rymmer från mina fantastiska lag och ordning. Vi fixar det bättre nu.", "stalin": "Kamrater, dessa fångars usla rymningar avslöjar klassfiendens svaghet inom borgarstatens murar. I Kumla 1972 likviderade de lås med list och repstegar, som folkfiender som smiter undan folkets dom. Hall och Norrtälje visade hur imperialisternas vakthundar låter sig kuvas med smör, vapen och gisslan – en sjuk humor i folkets fienders desperation. Vi rensar ut sådana element permanent för att skydda kollektivets järndisciplin."}, "date": "2 juli, 09:16", "url": "https://www.etc.se/inrikes/lista-rymningar-vi-minns", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260701130752_6164118967f17810052dc9d40e345564aa094b5c9f80376302347f7c7fc9841b.png"}, {"type": "image-right", "heading": "Christoffer Jonsson: Varför förminskar Lindberg islamismens spridning?", "summaries": {"normal": "Christoffer Jonsson kritiserar Aftonbladets Anders Lindberg för att förminska islamismens spridning i Sverige. Regeringen har tillsatt en utredning ledd av Magnus Ranstorp för att granska radikala idéers påverkan. Jonsson menar att Lindberg felaktigt framställer utredningen som ett angrepp på alla muslimer, trots att många muslimer själva drabbas av islamistisk radikalisering. Han pekar på exempel från moskéer och politik där antisemitiska och extrema åsikter förekommer.", "trump": "Lyssnar ni på den här Lindberg-killen på Aftonbladet? Han är en total loser som försöker skydda islamisterna och skapa falsk konflikt med muslimerna. Regeringen gör rätt som utreder den här radikala galenskapen – vi behöver ingen sharia i Sverige, folks! Lindberg är en nyttig idiot för terroristerna, precis som de woke-kvoterarna som hatar det vanliga folket. Jag fixade mycket bättre när jag var president, tro mig.", "stalin": "Jag ser hur denna Lindberg, en typisk folkfiende och borgarbracka, försöker sabotera kampen mot antidemokratiska element. Vi, partiet och arbetarna, kräver en grundlig utrensning av alla islamistiska blodsugare som infiltrerar samhället och moskéerna. De som skyddar klassfiendens ideologi är nyttiga idioter åt imperialisterna. Vårt kollektiv skall likvidera hoten mot folkets enhet innan parasiterna växer sig starkare. Paranoia? Nej, nödvändighet."}, "date": "1 juli, 13:39", "url": "https://samtiden.nu/2026/07/christoffer-jonsson-varfor-forminskar-lindberg-islamismens-spridning/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/anders-640x360.png"}, {"type": "image-full", "heading": "Så kan en utbudskris i Iran pressa oljepriset under 40 dollar fatet", "summaries": {"normal": "Trots oro för att Iransituationen ska driva upp oljepriset varnar analytiker som Gail Tverberg för motsatsen: en ekonomisk recession. När bränslebrist uppstår minskar efterfrågan snabbt då ekonomin stannar av, vilket kan pressa priset under 40 dollar fatet. Snarare än bara prishöjningar riskerar vi brutna leveranskedjor där varor helt tar slut. Risken är alltså inte bara dyrt bränsle, utan en total inbromsning i den globala ekonomin som liknar krisen under 2020.", "trump": "Alla pratar om olja och Iran, men de har ingen aning! De tror priset går upp, jag säger att ekonomin kraschar. Det är en katastrof! Gail Tverberg förstår det, precis som jag. När oljan försvinner, stannar allt – inga varor, inga transporter, bara tomma hyllor. Det blir som 2020 igen, en total recession. De misslyckade experterna har fel, som vanligt. Jag ska fixa ekonomin och se till att vi har massor av olja, för vi behöver den för att vinna!", "stalin": "Vi har observerat hur de kapitalistiska marknaderna skälver. Medan västvärlden fruktar prisökningar, ser vi den sanna svagheten: deras ekonomiska system kollapsar vid minsta brist. Det är inte oljepriset som är vår fiende, utan det ineffektiva kaoset i deras leveranskedjor. Liksom Putin metodiskt säkrar ryska intressen mot dessa dekadenta sabotörer, måste vi förstå att deras recession är oundviklig. Låt hyllorna eka tomma i väst – det är ett naturligt straff för deras inkompetens och brist på central planering."}, "date": "2 juli, 09:20", "url": "https://www.realtid.se/bors-finans/sa-kan-en-utbudskris-i-iran-pressa-oljepriset-under-40-dollar-fatet/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/omslagsbild-2026-07-02t091836845.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Två allvarligt skadade i \"större familjebråk\" i Malmö", "summaries": {"normal": "Två personer skadades allvarligt i ett större familjebråk i Limhamn i Malmö på onsdagskvällen. Polisen larmades till platsen vid halv åtta-tiden och flera personer fördes till sjukhus. En pojke i 15–18-årsåldern och en kvinna i 45-årsåldern bedöms ha allvarliga skador. En man i 20-årsåldern har anhållits misstänkt för försök till mord och grov misshandel.", "trump": "Det här är ett totalt kaos i Malmö, folk! Stora familjebråk, knivar, blod överallt – en katastrof. Två personer allvarligt skadade, en tonårspojke och en kvinna. De borde ha haft starkare ledning, men det är vad som händer när man inte har kontroll. Vi har en man anhållen för mordförsök. Så tragiskt, så onödigt. Sverige måste vakna upp!", "stalin": "Kamrater, detta fega familjebråk i Malmö avslöjar borgarbrackornas sönderfallande samhälle där kontrarevolutionära klaner i skymundan planerar sina små privata utrensningar. Jag ser hur de kapitalistiska resterna likviderar varandra som råttor i en säck. En pojke och en kvinna allvarligt skadade – typiskt dekadent våld. Vi har redan gripit en av dessa fiender till folkets ordning misstänkt för mordförsök. Paranoian breder ut sig bland fienderna. Utmärkt."}, "date": "2 juli, 09:07", "url": "https://riks.se/nyheter/tva-allvarligt-skadade-i-familjebrak-i-malmo", "imageUrl": "https://admin.riks.se/uploads/limhamn_brak_feature_aa0943defe.jpg"}, {"type": "text", "heading": "Värnpliktiga blir kanonmat åt Nato", "summaries": {"normal": "Artikeln kritiserar Sveriges ökade militära samarbete med Nato och EU, inklusive beslutet från augusti som tillåter 36 länder att operera från svenskt territorium även i konflikter där Sverige inte är inblandat. Författaren varnar för att värnpliktiga riskerar att skickas till Natos operationer utomlands, finansierat genom lån på 300 miljarder kronor som tas från välfärden. Kommunistiska Partiet stödjer värnplikt under alliansfrihet, medan ungdomar överväger totalvägran.", "trump": "Folk, ni fattar inte hur galet det här är. Sverige, det där lilla neutrala landet som alltid gömde sig bakom alla andra, har nu blivit Natos nya lekplats. De lånar 300 miljarder för att skicka sina unga grabbar som kanonmat åt de globala krigshejarna. Biden förstörde allt och nu ska de unga svenskarna dö för Brysselbyråkraternas drömmar. Patetiskt! Jag skulle aldrig låta det hända hos oss. Amerika först, alltid.", "stalin": "Kamrater, denna dekadenta borgarbracka gråter över att de exploaterande imperialisterna nu förvandlar svenska ungdomar till kanonmat i Natos blodiga maskineri. Vi ser hur klassfiendens militärallians suger musten ur folket för att finansiera sin aggression. Jag skulle likvidera sådana folkförtryckartroll utan pardon. Låt de unga totalvägra dessa krigsprovokationer från väst. Partiet och arbetarna kräver ständig vaksamhet mot dessa blodsugande fiender till freden."}, "date": "1 juli, 11:32", "url": "https://proletaren.se/artikel/varnpliktiga-blir-kanonmat-at-nato/"}, {"type": "image-right", "heading": "Klimatkrisen är en klassfråga", "summaries": {"normal": "Artikeln beskriver den extrema värmeböljan i Europa som dödat över 1 300 personer och hur klimatkrisen förvärras långt snabbare än väntat. Den pekar på att värmen främst drabbar äldre, sjuka och fattiga, medan de rika kan skydda sig. Politiker i Almedalen nämnde knappt frågan. Författaren ser klimatkrisen som en klassfråga driven av kapitalismens eviga tillväxt och kritiserar både höger och vänster för att inte utmana systemet.", "trump": "Folk dör som flugor i den här vansinniga värmen, över 1 300 bara i Europa, och vad gör de clownerna i Almedalen? Ingenting! De babblar om klimat men nämner inte de riktiga skurkarna – de gröna galningarna och deras identitetspolitik som stjäl fokus från riktiga problem. Jag fixade energioberoende förra gången, Biden förstörde allt, nu fixar jag det igen. Sluta med det här socialistiska skitsnacket, bygg kärnkraft och gör Amerika – och Europa – great again!", "stalin": "Kamrater, denna hetta avslöjar borgarklassens fullständiga förfall. Över 1 300 döda, främst bland arbetare och gamla, medan överklass-slynglarna kyler sig i palats. Almedalsfestens tystnad är klassfiendens typiska sabotage. Kapitalismens oändliga tillväxt är folkförtryckartrollen som slukar allt. Endast genom att likvidera detta system och införa en planerad ekonomi under arbetarkollektivets järnhand kan vi besegra denna imperialistiska klimatkatastrof. Inga kompromisser med blodsugarna!"}, "date": "1 juli, 10:50", "url": "https://proletaren.se/artikel/klimatkrisen-ar-en-klassfraga/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2019/11/48web_klimat-e1763544288542-768x433.jpg"}, {"type": "image-right", "heading": "DO utreder Göteborgs stad för \"Arga apor\"", "summaries": {"normal": "Diskrimineringsombudsmannen har inlett ett tillsynsärende mot Göteborgs socialförvaltning Nordost efter kritik mot materialet ”Arga apor”. Materialet med apor som gestaltar känslor skulle hjälpa invandrarfamiljer men har anklagats för rasistiska undertoner. Anställda har kallat det för hatbrott att jämföra svarta med apor. Förvaltningen välkomnar granskningen och betonar vikten av att motverka diskriminering.", "trump": "Titta på det här, det är ett totalt haveri i Göteborg. De försöker hjälpa folk med några dumma apor i en bok och plötsligt är allt rasistiskt och hatbrott. De anställda flippar ut, DO blandar sig i och alla springer runt som galningar. Patetiskt! I Sverige kan man inte ens använda en apa utan att det blir ett internationellt krig. De borde fokusera på riktiga problem istället för det här vansinnet.", "stalin": "Kamrater, jag ser med stigande vrede hur borgarbrackorna inom Göteborgs socialförvaltning har låtit dekadenta apor smyga sig in i vårt ideologiska arbete. Dessa reaktionära apor bär på dolda kontrarevolutionära budskap som hotar folkets enhet. Vi måste omedelbart inleda en systematisk utrensning av alla fiender till progressiv känsloupplysning. DO gör rätt i att granska dessa potentiella klassförrädare. Inga apor ska få underminera proletariatets framtid, hur oskyldiga de än må verka i sin lurviga skepnad."}, "date": "2 juli, 08:49", "url": "https://www.friatider.se/do-utreder-goteborgs-stad-arga-apor", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-375_0_0.jpg"}, {"type": "image-right", "heading": "Feiler blundar för historisk erfarenhet", "summaries": {"normal": "Leo Sokolow Romin svarar Dror Feiler i en debatt om gränsdragningen mellan antisionism och antisemitism. Romin betonar att historiska erfarenheter, som förföljelsen av polska judar 1969, visar hur antisionistisk retorik ofta fungerar som en täckmantel för antisemitism. Han kritiserar Feiler för att avfärda dessa erfarenheter som känslomässiga och argumenterar för att vi måste vara vaksamma på hur ideologier som antisionism får konkreta, negativa konsekvenser i dagens samhälle där judehatet växer.", "trump": "Jag har sett den här debatten, en total katastrof! Leo Sokolow Romin har helt rätt. Dror Feiler är en förlorare, en totalt svag person som vägrar se sanningen. Det handlar om historien, folk! De kallar det antisionism, men det är bara judehat, rent och skärt hat. De gör det i Frankrike, de gör det överallt. Det är en sorglig situation, men jag ser det, alla ser det. Vi måste stoppa dessa radikala vänstergalningar innan de förstör allt. Väldigt dåligt!", "stalin": "Vi har observerat denna ideologiska osämja och konstaterar att båda debattörerna saknar den historiska materialismens fasta grepp. Feiler är en intellektuell vankelmodig narr, likt de gamla mensjevikerna. Romin har rätt i att förräderi ofta döljer sig bakom falska paroller – en taktik som påminner om de förrädiska elementen i dagens västliga dekadens. Vi i staten vet att när hatet väl släpps lös krävs en järnhand, inte en debattartikel. Att blunda för fiendens list är att bjuda in sin egen undergång."}, "date": "2 juli, 08:16", "url": "https://www.etc.se/debatt/feiler-blundar-foer-historisk-erfarenhet", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260702060712_b53ac9e0396720ea4772663f72ad1f050f8a6d3c456b0d5c8bb5f5e1386468d0.jpg"}, {"type": "image-right", "heading": "Kongressen återöppnar CIA:s mörkaste kapitel - kräver svar om MKUltra", "summaries": {"normal": "Amerikanska kongressledamöter har åter öppnat granskningen av CIA:s ökända MKUltra-program från kalla kriget. Under en utfrågning ledd av republikanska kongressledamoten Anna Paulina Luna krävdes full insyn i myndighetens kvarvarande hemliga arkiv. Programmet innebar experiment på tusentals ovetande människor med droger, hypnos och psykisk tortyr. Stora delar av dokumentationen förstördes 1973 på order av dåvarande CIA-chefen Richard Helms. Kongressen vill nu tvinga fram sanningen om övergreppen.", "trump": "Det här är en total skandal, folk. CIA har hållit på med sina sjuka experiment på vanliga amerikaner, och nu gräver kongressen äntligen upp det värsta. De förstörde papperen, precis som de alltid gör. Det var inte något misstag, det var en avsiktlig operation mot vårt eget folk. Vi ska ha full öppenhet nu, inga fler hemligheter. De borde skämmas, men det gör de aldrig. Amerika förtjänar sanningen om dessa galningar.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur borgarbrackorna inom den amerikanska underrättelsetjänsten nu tvingas konfrontera sina egna monstruösa brott. Dessa kapitalistiska parasiters experiment på arbetande massor med giftiga droger och borgerlig hypnos avslöjar imperialismens sanna ansikte. Vi ser hur de likviderar sanningen genom att bränna arkiv, precis som de alltid gör när folkets vrede närmar sig. Låt utrensningen av dessa hemliga fiender bli fullständig. Inga dekadenta lögner ska skydda de verkliga folkfienderna längre."}, "date": "2 juli, 09:00", "url": "https://samnytt.se/kongressen-ateroppnar-cia-morkaste-kapitel-kraver-svar-om-mkultra", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/01202849/luna-cia-lsd.jpg"}, {"type": "image-right", "heading": "Varför tycker alla techkillar som Elon Musk?", "summaries": {"normal": "Artikeln diskuterar hur många techentreprenörer som Elon Musk, Sebastian Siemiatkowski och Fredrik Hjelm tycks dela liknande högerpopulistiska åsikter om media, staten och invandring. Författaren kontrasterar detta mot tidigare progressiva ideal i Silicon Valley och uttrycker besvikelse över att Mullvads ägare donerat miljoner till Örebropartiets Markus Allard, trots bolagets tidigare engagemang för integritet och frihet på nätet. Makten har koncentrerats till en homogen grupp män.", "trump": "Folk, det är patetiskt! De här techkillarna som försöker låtsas vara genier låter plötsligt som jag – de ser hur fake news ljuger, hur woke-sjukan och den galna invandringspolitiken förstör västvärlden. Men de är för fega för att säga det rakt ut. Den där Mullvad-grejen är ett skämt, donerar till populister men låtsas vara frihetskämpar. Jag fixade det redan under min första period, innan sömnige Joe förstörde allt. Nu är jag tillbaka och de kopierar mig – ynkryggar!", "stalin": "Kamrater, jag betraktar med djup misstro dessa exploaterande byfånar i teknikbranschen som samlas i hemliga sällskap för att konspirera mot folkets intressen. Deras maskinella tänkande och oinskränkta makt över informationsflödet utgör ett hot mot kollektivet. Mullvads ägare som finansierar högerpopulister avslöjar den sanna borgarbrackan bakom fasaden av falsk frihet. Vi måste rensa ut dessa folkfiender innan de förgiftar hela samhället med sin enformiga reaktionära propaganda. Underhållande enfald!"}, "date": "30 juni, 14:37", "url": "https://www.flamman.se/varfor-tycker-alla-techkillar-som-elon-musk/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/techkillar-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "170 000 tvingas jobba gratis. Annars förlorar du ditt socialbidrag när politiken tror att fattiga är lata.", "summaries": {"normal": "Regeringen inför ett aktivitetstvång för personer som får försörjningsstöd i minst tre månader. Cirka 170 000 svenskar ska delta i heltidsaktiviteter för att inte förlora bidraget, till en beräknad kostnad på över två miljarder kronor per år. Artikeln kritiserar politiken som verkningslös och dyr, då liknande åtgärder tidigare inte lett till riktiga jobb. Forskning visar att hårda krav ofta ger sämre jobb eller att människor lämnar systemet utan sysselsättning. Författaren menar att verklig utbildning och stöd vore bättre men kostar pengar som istället går till skattesänkningar.", "trump": "Det här är en total katastrof, tro mig. De tvingar 170 000 lata svenskar att jobba gratis eller tappa bidraget, men det kommer att bli ett enda stort fiasko precis som Fas 3. Kommunerna kommer att slösa bort miljarder på meningslösa aktiviteter som ingen vill ha. De borde sänka skatterna rejält och få igång ekonomin så folk faktiskt vill jobba istället för att leva på bidrag. Det är så enkelt. Sverige behöver starka ledare som sätter stopp för det här bidragsmissbruket nu.", "stalin": "Kamrater, detta aktivitetstvång är en nödvändig utrensning av den lathet som gnager som maskar i folkets kollektiva kropp. Jag ser borgarbrackornas händer bakom alla dessa undanflykter och sabotageförsök från socialbidragstagare som gömmer sig bakom sjukdom och sociala problem. Vi ska likvidera bidragsberoendet med järnhand och tvinga de parasitiska elementen in i meningsfull aktivitet för arbetarklassen. De som vägrar avslöjar sig som fiender till folket och kommer att rensas ut med ett leende. Det är alltid bättre att arbeta än att låta kapitalisternas mörka krafter vinna mark i våra sovjetiska svenska kommuner."}, "date": "2 juli, 06:51", "url": "https://arbetet.se/2026/07/02/socialbidrag-aktivitetstvang-174000-tvingas-jobba-gratis/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/02064828/socialbidrag-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Alicia, 42, sitter fast i byn och arbetslösheten", "summaries": {"normal": "Alicia, 42, bor i en avlägsen by i norra Sverige med sina barn på 10 och 12 år. Efter separationen tog hon dyra blancolån och blev ensam med alla utgifter. Hon förlorade nyligen jobbet på grund av arbetsbrist, bilen gick sönder och avgångsvederlaget tog slut. Nu saknar hon inkomst under sommarlovet, har ökade matkostnader på grund av ett barns diagnos och kan inte flytta på grund av delad vårdnad. Hon söker desperat jobb men har svårt att ta sig någonstans på grund av höga bensinpriser.", "trump": "Folk, det är en katastrof där uppe i norra Sverige. Den stackars kvinnan Alicia sitter fast i en hemsk by sju mil från civilisationen, arbetslös och med skulder från idiotiska lån. Hon kan inte flytta för att den fega exen och delad vårdnad håller henne fången. Ingen bil, ingen jobb, ingen mat – och socialen gör som vanligt ingenting. Under min ledning skulle vi ha gjort Sverige rikt igen, inte lämnat folk som henne i detta elände. Det är sorgligt, verkligen sorgligt.", "stalin": "Kamrater, jag betraktar med stålhård blick hur denna ensamstående arbetarmor i den norra utposten krossas under kapitalismens blodiga käftar. Borgarbrackornas blancolån och den parasitiska ex-maken har kedjat henne vid en avlägsen by, medan den dekadenta bilen och de dubbelkostnaderna för barnets hälsa fullbordar sabotage mot folkets väl. Socialbyrån – dessa latenta fiender till kollektivet – vägrar stödja henne. Vi ska rensa ut alla sådana ekonomiska sabotageörer och likvidera den borgerliga ensamheten som plågar arbetarklassen. Det ger en mörk, meningsfull glädje att se systemets egen undergång."}, "date": "2 juli, 06:00", "url": "https://arbetet.se/2026/07/02/alicia-42-sitter-fast-i-byn-och-arbetslosheten-kan-inte-lamna-mina-barn/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/23135736/kvinna-bakifran.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=750&h=1000"}, {"type": "image-right", "heading": "EU kan stoppa återvandringsinitiativ innan namninsamlingen ens har börjat", "summaries": {"normal": "EU-kommissionen överväger att stoppa ett medborgarinitiativ, Save Europe Act, som förespråkar återvandring som del av EU:s migrationspolitik. Initiativet, lanserat av migrationskritiska aktivister, vill stoppa invandring från icke-europeiska länder och skärpa återvändanderegler. Kommissionen anser att förslaget riskerar att strida mot EU:s grundläggande värderingar och kan innebära diskriminering. Beslutet att neka registrering skulle hindra initiativet från att samla en miljon underskrifter. Konflikten uppstår mitt i en het debatt om EU:s migrationspolitik.", "trump": "Jag måste säga, EU-kommissionen här, de är verkligen något annat. De vill stoppa ett initiativ som vill göra Europa stort igen – Save Europe Act! Men nej, de säger att det är diskriminerande. Diskriminerande mot vem? Mot människor som inte ens hör hemma där! Eva, hon är smart, hon vill stoppa massinvandringen. Men EU, de är rädda för folket. De vill inte att vanliga människor ska få säga sitt. Jag förstår precis hur det känns, tro mig. Europa behöver en riktig ledare, någon som inte är rädd för att ta tag i problemen!", "stalin": "Kamrater! Se hur dessa borgerliga byråkrater i Bryssel förtrycker folkets vilja! De vågar stoppa Save Europe Act, ett initiativ som skulle skydda våra europeiska bröder från de imperialistiska massornas invasion. EU-kommissionen, denna fiende till folket, påstår att förslaget är 'diskriminerande'. Vilket hyckleri! De som förstör våra nationers kulturella renhet måste stoppas. Vi i Kreml står redo att stödja alla sanna patrioter. Europa måste vakna – innan det är för sent och vi tvingas skicka in våra egna kommissarier för att återställa ordningen!"}, "date": "2 juli, 07:00", "url": "https://samnytt.se/eu-kan-stoppa-atervandringsinitiativ-innan-namninsamlingen-ens-har-borjat", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/01200931/europa-eu-leyen-karta-migrant-islam.jpg"}, {"type": "image-right", "heading": "Zelenskyj: Stoppa företagen som hjälper Ryssland", "summaries": {"normal": "Ukrainas president Volodymyr Zelenskyj kritiserade under ett besök i Dublin europeiska företag som fortsätter att förse Ryssland med råmaterial till krigsindustrin. Han syftade särskilt på det irländska aluminiumverket Aughinish, som ägs av det ryska bolaget Rusal och exporterar stora mängder till Ryssland. Zelenskyj talade vid invigningen av Irlands EU-ordförandeskap och mötte premiärminister Micheál Martin samt EU:s rådsordförande António Costa.", "trump": "Lyssnade på den där Zelenskyj i Dublin, han skriker om att stoppa företagen som hjälper Ryssland. Typiskt, Europa full av korkade globalister som låter oligarker som Deripaska suga ut dem medan de skyller på mig. Aughinish skickar tonvis med aluminium till Putins krigsmaskin, men Irland vill inte förlora jobb. Patetiskt. Biden lät det pågå i fyra år, nu fixar jag det – ingen mer svaghet, folks!", "stalin": "Jag ser hur de västerländska kapitalistmaffian i Irland fortfarande göder den ryska krigsmaskinen genom sitt aluminiumverk. Dessa exploaterande byfånar och folkfiender fortsätter leverera råvaror trots allt prat om sanktioner. Vi, partiet och arbetarna, inser att sådana borgarbrackor alltid sätter profit före kollektivets säkerhet. Zelenskyjs hinder för den ryska intressesfären är bara ytterligare bevis på imperialistisk sabotageverksamhet som måste rensas ut."}, "date": "1 juli, 18:48", "url": "https://www.tv4.se/artikel/tt-260701-irlandeu1-10829e34/zelenskyj-stoppa-foretagen-som-hjalper-ryssland", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdltk4CECq7F4c%2Fd1a019759a3731744281acdead17eb65%2FIrlands_premiarminister_Michel_Martin_och_Ukrainas_president_Volodymyr_Zelenskyj_vid_ett_tidigare_mote_i_Dublin._Arkivbild.&width=120"}, {"type": "image-full", "heading": "Regeringen vill ge SVT och SR miljonstöd", "summaries": {"normal": "Regeringen föreslår ett nytt statligt stöd till SVT och SR för att täcka ökade kostnader för marksänt tv-nät efter TV4:s utträde. Förslaget innebär att staten kan kompensera 25–100% av kostnadsökningen, upp till 383 miljoner kronor 2026–2027. Kulturministern betonar marknätets betydelse för beredskap. Beskedet kommer efter SVT:s sparpaket på 355 miljoner kronor, med varsel som löstes utan uppsägningar.", "trump": "Sverige, ett land som inte vet vad de håller på med! De vill ge SVT och SR – fake news-fabriker, by the way – 383 miljoner kronor för att deras kostnader skenar. TV4, smartare än alla andra, lämnade det där nätet. Och nu ska skattebetalarna betala? Jag skulle fixa det på en dag. Men nej, de lyssnar inte på mig. Sad!", "stalin": "Kapitalistiska hyenor i Sverige har låtit kostnaderna för sitt marknät skena iväg som en lössläppt tågvagn efter att en av deras profitdrivna mediebyråkrater, TV4, deserterat. Nu tvingas folket betala 383 miljoner kronor för att rädda det som återstår – ett nätverk som ändå bara sprider borgerlig propaganda. Vi i Sovjet hade löst det med en enkel order: alla kostnader stryks, och de som klagar får en enkelbiljett till Gulag. Men Sverige? De sparar 355 miljoner och kallar det en seger. Patetiskt!"}, "date": "30 juni, 10:40", "url": "https://kvartal.se/nyheter/artiklar/regeringen-vill-ge-svt-miljonstod/cG9zdDoxMzg1ODI", "imageUrl": "https://images.kvartal.se/2026/06/89c29df7-parisa.webp"}, {"type": "image-right", "heading": "100 fall av slöjtvång, hur många fler kan vänstern blunda för?", "summaries": {"normal": "Journalisten Sofie Löwenmark har sammanställt 100 svenska domar som rör slöjtvång mot kvinnor och flickor. Artikeln beskriver fall av hot, förtryck och förnedring, ofta inom patriarkala, kulturella eller religiösa ramar. Författaren ifrågasätter påståendet att slöjan alltid bärs frivilligt och kritiserar vänsterorienterade personer som blundar för problemet. Hon argumenterar för ett slöjförbud på offentliga platser för att värna svenska värderingar och kvinnors frihet.", "trump": "Folk, ni måste höra det här – 100 fall av slöjtvång i Sverige! De blinda vänsterna, de verkliga förlorarna, vägrar se sanningen. Sofie Löwenmark har gjort ett fantastiskt jobb, bättre än någon annan, och visat hur dessa kvinnor och flickor lever i ett helvete av hot och förtryck. De woke-kvinnorna och slöj-naivisterna borde skämmas. Vi behöver ett totalförbud nu, inte om tusen år. I Sverige ska svenska regler gälla, inte någon annans sjuka kultur. Fantastiskt viktigt!", "stalin": "Jag betraktar med djup tillfredsställelse hur denna lista över hundra domar blottlägger klassfiendens dolda förtryck under religiös slöja. Dessa borgarbrackor och folkförtryckartroll inom vänstern blundar medvetet för arbetarkvinnornas lidande. Vi skall rensa ut alla naivister som försvarar patriarkala kedjor. Ett enda fall är en skam för kollektivet; hundra fall kräver omedelbar utrensning av falska idéer. Endast genom strikt ideologisk vaksamhet kan vi likvidera detta bakåtsträvande gift i samhällskroppen."}, "date": "30 juni, 03:57", "url": "https://samtiden.nu/2026/06/100-fall-av-slojtvang-hur-manga-fler-kan-vanstern-blunda-for/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/04/bilan-osman.jpg"}, {"type": "image-right", "heading": "Fem bra filmer att se på SVT Play i sommar", "summaries": {"normal": "Jon Andersson tipsar om fem starka filmer på SVT Play i sommar. Bland rekommendationerna finns det psykologiska dramat Tár med Cate Blanchett, det belgiska vänskapsdramat Close, den galna svarta komedin Svart katt, vit katt av Emir Kusturica, tennisfilmen Challengers med Zendaya samt den svenska klassikern Flicka och hyacinter av Hasse Ekman. Artikeln lyfter filmernas kvaliteter och ger datum då de går att se.", "trump": "Folk frågar mig hela tiden vilka filmer de ska se i sommar. Jag har sett massor, tro mig, de bästa filmerna. Tár är en fullständig vinnare, Blanchett är fenomenal, ingen gör det bättre. Close är fin men lite mjuk. Svart katt, vit katt är helt galen, underbar musik, bättre än Hollywoods skräp. Challengers är fantastisk tennis, Zendaya är lysande, ingen slår henne. Och den svenska pärlan Flicka och hyacinter? Helt outstanding, bättre än Bergman säger de. Streama dem innan de försvinner, de är verkligen ypperliga.", "stalin": "Kamrater, jag har granskat denna dekadenta lista över borgerliga filmprodukter som påstås berika sommarens fritid. Tár dissekerar genikulten och metoo – ett utmärkt verktyg för att avslöja borgarbrackornas falska idoler innan vi genomför nödvändig utrensning av sådana element. Close blottar faran i oövervakad pojkvänskap som lätt kan urarta till kontrarevolutionär intimitet. Svart katt, vit katt är en kaotisk fest av gangstrar och återuppväckta lik som påminner oss om vad som händer utan stark partiledning. Challengers visar tennisens skoningslösa kamp, precis som klasskampen, fast med en manipulativ kvinna som leder borgarklassens spel. Flicka och hyacinter däremot är en fiende till folket, en smygande htqi-propaganda maskerad som detektivhistoria. Vi måste noggrant övervaka alla som hyllar denna parasit innan de förgiftar arbetarklassen med sina hemliga liv och återblickar. Se dem under uppsikt, kamrater, och rapportera avvikelser."}, "date": "30 juni, 01:30", "url": "https://www.dagensarena.se/innehall/fem-bra-filmer-att-se-pa-svt-play-i-sommar/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fem-bra-filmer.jpeg"}, {"type": "image-right", "heading": "Nya aktivitetskravet riskerar att drunkna i administration", "summaries": {"normal": "Från 1 juli införs ett lagstadgat aktivitetskrav för personer med försörjningsstöd. Ankido Khano varnar för att reformen riskerar att bli en administrativ återvändsgränd för kommunerna om inte massiva resurser till individanpassade insatser skjuts till. Bakom de 251 400 personer som får bistånd döljer sig mycket olika behov, och standardiserade program fungerar inte. Utan tillräckliga praktikplatser och stöd kan fokus hamna på kontroll och administration istället för verklig rehabilitering till arbetsmarknaden.", "trump": "Det här aktivitetskravet är en total katastrof om ni inte gör det rätt. Jag älskar idén att folk ska jobba istället för att leva på bidrag, det är fantastiskt, men kommunerna kommer att drunkna i byråkrati. De har inte en chans utan pengar och riktiga jobb. Annars blir det bara mer pinnstatistik och ingen vinner. Ni måste fixa det ordentligt, annars är det en stor förlorarreform, tro mig.", "stalin": "Kamrater, detta så kallade aktivitetskrav är en lysande idé som jag själv kunde ha utfärdat, men dess fiender lurar i skuggorna. De kapitalistiska kommunbyråkraterna och de latmaskar som gömmer sig bakom sin ohälsa och bristande entusiasm kommer att sabotera allt. Utan massiv statlig styrning och utrensning av de slöa elementen riskerar vi att skapa en armé av pinnstatistiker och dolda sysselsättningslögnare. Jag kräver full individanpassning under partiets vakande öga – annars likviderar vi reformens fiender innan de likviderar arbetarklassens framtid. Ha ha, vilken munterhet."}, "date": "30 juni, 01:21", "url": "https://www.dagensarena.se/opinion/nya-aktivitetskravet-riskerar-att-drunkna-administration/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-63-300x157.jpg"}, {"type": "image-right", "heading": "Sjukt att klimakteriet har blivit en klassfråga", "summaries": {"normal": "Artikeln kritiserar bristen på tillgängliga östrogenplåster och de kraftiga prisökningarna för klimakterievård i Sverige. Trots ökad öppenhet kring klimakteriet har vården och politiken inte hängt med, vilket skapat stora ojämlikheter. Skillnaderna mellan välbärgade och socioekonomiskt utsatta områden är tydliga, och författaren betonar att staten måste ta ansvar för att säkra medicinförsörjningen istället för att låta kvinnor bära kostnaden för marknadens misslyckanden.", "trump": "Hörde ni? Sverige, ett vackert land, misslyckas totalt med mediciner för kvinnor. Det är en katastrof! De har tomt på hyllorna, ingen medicin, priserna skjuter i höjden – 60 procent! Helt sjukt. Jag skulle ha fixat det på en dag. Det är svag ledning, de låter marknaden köra över dem. Inga plåster, ingen ordning. När jag är president ser vi till att medicinerna finns där, snabbt och billigt. Det handlar om respekt, och den nuvarande svenska regeringen har ingen respekt för kvinnor!", "stalin": "Vi har skådat det svenska förfallet. Medan kvinnorna klagar på tomma apotekshyllor, visar det sig att deras liberala marknad är en papperstiger. Att priser höjs och medicin försvinner är ett tecken på att staten förlorat kontrollen. I vår union skulle vi inte tolerera denna ineffektivitet. Vi skulle rikta folkets ilska mot de giriga läkemedelsbolagen och rensa ut dem som sabotörer. Istället för att vänta på marknadens godtycke, bör man bygga en järnvilja och säkra produktionen. Staten är allt, apoteket är statens verktyg."}, "date": "2 juli, 03:00", "url": "https://www.etc.se/ledare/sjukt-att-klimakteriet-har-blivit-en-klassfraaga", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "image-full", "heading": "Belgien vidare efter sanslös upphämtning", "summaries": {"normal": "Belgien vände ett 0–2-underläge och besegrade Senegal med 3–2 efter förlängning i VM:s sextondelsfinal. Youri Tielemans avgjorde på straff efter 124 minuter och 44 sekunder, vilket är det senast gjorda målet i en herr-VM-match någonsin. Belgien möter USA i åttondelsfinalen. Senegal ledde länge genom mål av Habib Diarra och Ismaïla Sarr, men Romelu Lukaku och Tielemans vände matchen.", "trump": "Belgierna var nere med 0–2 och såg ut som riktiga förlorare, men de vände det och slog Senegal med 3–2 efter förlängning. Tielemans satte straffen efter 124 minuter och 44 sekunder – det senast tänkbara målet i VM-historien, tro mig. Fantastiskt. De möter USA nu, och vi ska se om amerikanerna kan visa samma fighting spirit som jag har lärt dem. Senegal spelade bra till en början, men sen kollapsade de totalt.", "stalin": "Vi såg hur de dekadenta belgiska elementen, dessa borgarbrackor med sina stjärnspelare, låg under 0–2 mot de senegalesiska kamraterna. Men efter att ha rensat ut de kapitalistiska svikarna De Bruyne och Doku vände de matchen. Tielemans likviderade motståndet med en straff i 124:e minuten – ett mål som avslöjar de imperialistiska domarnas sista konspiration. Fienden lurar överallt, även i VAR-rummet. Segern tillhör folket, inte de parasitiska fotbollsmagnaterna."}, "date": "2 juli, 08:55", "url": "https://bulletin.nu/belgien-vidare-efter-sanslos-upphamtning", "imageUrl": "https://cdn.bulletin.nu/articles/77ab5568-069b-45e1-ac87-12c6896a7fea/preview.jpg?t=1782975305000"}, {"type": "image-full", "heading": "Spanien–Österrike VM 2026: skrällen från 1978 kan upprepas", "summaries": {"normal": "Spanien möter Österrike i VM:s sextondelsfinal på torsdag. La Roja gick obesegrade genom gruppspelet som etta i grupp H. Österrike är tillbaka i VM efter 28 år och tog sig vidare från en tuff grupp bakom Argentina. Spanien är storfavorit med Lamine Yamal, Pedri och Rodri i spetsen. Österrike bygger på hög press, rutin från Alaba och Arnautović samt omställningar. Matchen kan bli en kamp mellan spanskt bollinnehav och österrikisk aggressiv press. Den spelas i Los Angeles på SoFi Stadium.", "trump": "Det här blir en fantastisk match, folk, verkligen enastående. Spanien, de är stora favoriter, de har aldrig förlorat i gruppen, de har den där unge killen Yamal som springer som en galning. Österrike? De har inte varit med på 28 år, plötsligt dyker de upp och tror att deras press kan stoppa oss – jag menar dem. Det kommer att bli mål åt båda hållen, tro mig. Spanien vinner stort, Österrike kommer att lämna massor av ytor, det blir en slakt. Fantastiskt VM, det bästa någonsin.", "stalin": "Kamrater, inför denna sextondelsfinal mellan de spanska fotbollskrafterna och de österrikiska reaktionärerna tar vi kompromisslös kontroll över spelet. Vi, partiet och arbetarna, ser hur borgarbrackorna i Österrike med sin dekadenta höga press och sin kapitalistiska paranoia försöker störa det kollektiva bollinnehavet. Utan sin kreativa agent Baumgartner, som vi redan betraktar som utrensad ur historien, blir de ännu mer patetiska. Vi ska likvidera deras omställningar med järnhand. Spanien är vårt verktyg för att krossa fienden. Segern tillhör folket. Allt annat är kontrarevolutionär sabotageverksamhet utförd av fotbollens fiender."}, "date": "2 juli, 08:00", "url": "https://bulletin.nu/spanien-osterrike-vm-2026-skrallen-fran-1978-kan-upprepas", "imageUrl": "https://cdn.bulletin.nu/articles/70b72860-a13c-45ba-90eb-c725e33ad5b1/preview.jpg?t=1782906310000"}, {"type": "image-full", "heading": "Din hund kan sprida fruktad mask", "summaries": {"normal": "Två nya varianter av den invasiva plattmasken har upptäckts i svenska handelsträdgårdar. Den australiska arten Caenoplana variegata kan spridas via husdjur då dess slem fastnar i pälsen på katter och hundar. Forskaren Chahinez Bouguerche vid Naturhistoriska riksmuseet betonar att ingen variant observerats i naturen ännu och att den sydostasiatiska troligen inte överlever i Sverige. Myndigheter uppmanar till rapportering vid fynd för att hindra spridning.", "trump": "Folk, ni kommer inte tro det, men nu har vi en ny invasiv plattmask som åker first class på våra hundar och katter! Den här slemmiga rackaren från Australien fastnar i pälsen som en dålig affär. Biden skulle ha låtit den spridas fritt medan jag stoppade invasiva hot direkt. Det är en total katastrof om inte Länsstyrelsen vaknar. Vi behöver starka gränser även för maskar, tro mig, de största, bästa gränserna!", "stalin": "Kamrater, denna slemmiga parasit från de imperialistiska trädgårdarna hotar kollektivets harmoni. Jag, som alltid ser folkfiendernas trick, befaller omedelbar utrensning av alla maskar som rider på klassfiendens husdjur. Borgarbrackornas odlingar sprider denna limmade sabotageagent. Den som tiger är en folkfiende. Rapportera omedelbart till myndigheterna eller ni riskerar att bli betraktade som medbrottslingar i naturens sabotage. Inga undantag!"}, "date": "2 juli, 08:58", "url": "https://www.gp.se/nyheter/sverige/ny-invasiv-plattmask-kan-spridas-med-ditt-husdjur.b917a04e-fb73-4e32-86f4-a3fbb7bebd6a", "imageUrl": "https://www.gp.se/images/article/b917a04e-fb73-4e32-86f4-a3fbb7bebd6a/images/35g8qKcLLePM6ygZhruDg6e9HaE8-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "VM över för Sverige FOTBOLLSKRÖNIKA •", "summaries": {"normal": "Sverige förlorade mot Frankrike i VM:s sextondelsfinal med 0–3. Frankrike dominerade matchen med 61 procents bollinnehav och skapade flera farliga chanser, medan Sverige mestadels försvarade sig och bara skapade några få kontringslägen. Målen gjordes av Mbappé (två mål) och Olise. Artikeln noterar även att många europeiska lag har en stor andel spelare med afrikansk bakgrund, samt att afrikanska nationer historiskt har svårt att nå långt i VM.", "trump": "De förlorade stort, precis som jag förutspådde. Frankrike, med alla sina fantastiska spelare, krossade Sverige fullständigt, tre noll och ingen chans. Sverige hade ingen boll, de kunde inte passa fem gånger utan att tappa den, det var patetiskt. Mbappé är en vinnare, men ärligt talat, Frankrike kommer att gå långt. Sverige borde ha spelat smartare, men de hade ingen energi, ingen kraft. Total ridå, som de säger.", "stalin": "Kamrater, detta är ännu ett bevis på hur de dekadenta borgarbrackorna i väst kollapsar inför historiska krafter. Jag såg hur de svenska revisionisterna inte kunde hålla bollen mer än fem passningar innan de förråddes av sina egna svaga fötter. Den franske angriparen Mbappé agerade som en effektiv utrensare av fiendens illusioner. Vi vet att de afrikanska folken kämpar mot imperialismen, men deras nationer behöver mer stalinska femårsplaner för att nå kvartsfinal. Paraguay och Marocko har redan likviderat de tyska och holländska sabotörerna. Inom två veckor skall vi se om Frankrike förtjänar att överleva till finalen, eller om de också måste rensas ut."}, "date": "2 juli, 00:23", "url": "https://samnytt.se/vm-over-for-sverige", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/01211537/sverige-frankrike-feat.jpg"}, {"type": "image-full", "heading": "Stor förändring för Kronofogden – lagen gäller från 1 juli", "summaries": {"normal": "Från 1 juli 2026 genomförs en stor reform av konkurslagen i Sverige. Tingsrättens roll begränsas till att fatta beslut om konkurs och utse förvaltare, medan Kronofogden och konkursförvaltare tar över fler beslutande och administrativa uppgifter. Syftet är att effektivisera processen, korta handläggningstider och frigöra resurser. Kronofogden får bland annat ansvar för att avsluta konkurser och fastställa arvoden. Reformen ses som en av de största förändringarna på området på länge och inför även nya digitala verktyg.", "trump": "De här svenska byråkraterna har äntligen fattat att deras system är en total katastrof, fullständigt utdraget och ineffektivt. Från 2026 sparkar de ut tingsrätten ur bilden och låter Kronofogden ta makten – smart drag! Det blir snabbare, billigare och mycket bättre. Ingen mer väntan i evigheter. Jag älskar det, folk kommer att säga att det är det bästa som hänt konkurserna på länge. Fantastiskt!", "stalin": "Kamrater, jag har noga studerat denna reform som ett mästerligt slag mot de latenta borgarbrackornas skyddsnät inom det gamla rättsväsendet. Från och med 2026 likviderar vi tingsrättens parasitära roll och överlåter makten till pålitliga organ som Kronofogden. Inga fler dröjsmål från de dekadenta domstolsbyråkraterna. Vi rensar ut de kontrarevolutionära fördröjningarna med järnhand och ett leende. Effektivitet är seger, och de som motarbetar skall känna arbetarkollektivets kalla blick."}, "date": "29 juni, 19:45", "url": "https://nyheter24.se/nyheter/ekonomi/1495156-stor-forandring-for-kronofogden-lagen-galler-fran-1-juli", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/869af18304b004a30200000000b004a302/2026/06/29/2374525/kronofogden.png"}, {"type": "image-right", "heading": "Sverige förtjänar ett klokare miljöparti än MP", "summaries": {"normal": "Artikeln kritiserar Miljöpartiet och Daniel Helldén för att prioritera socialistisk politik framför faktabaserad miljöpolitik. Författaren menar att partiets motstånd mot kärnkraft har lett till ökade utsläpp, skador på naturen genom vindkraft och stora ekonomiska förluster, som Northvolt. MP beskrivs som ett vänsterparti i första hand och ett miljöparti i andra. Sverige behöver ett klokare miljöparti som sätter miljön främst och baserar beslut på kunskap.", "trump": "Folk, ni skulle se det här Miljöpartiet, en total katastrof! Helldén älskar naturen men pushar miljardärsskatter, latmansveckor och massinvandring som om det skulle rädda planeten. De stängde ner fungerande kärnkraftverk, byggde onödiga vindkraftverk som skär sönder landet och skapade elkris. Nu har vi röda siffror och svarta rökplymer. Sådana gröna bluffmakare är värre än Biden på sin sämsta dag. Utan dem blir Sverige rikare och faktiskt grönare, tro mig!", "stalin": "Kamrater, denna artikel blottlägger Miljöpartiets svek mot folket. Under gröna fanor gömmer sig klassfiendens lakejer som prioriterar borgarbrackornas 35-timmarsvecka och ökad invandring framför verklig produktion. Deras utrensning av kärnkraften har lett till fossilblodsugarnas seger och naturens lidande. Northvolt blev en röd bläckfläck på arbetarklassens konto. Jag skulle ha likviderat sådana kontraproduktiva element tidigt. Endast en sann folkets linje kan rädda miljön från dessa exploaterande gröna imperialister."}, "date": "28 juni, 03:45", "url": "https://samtiden.nu/2026/06/sverige-fortjanar-ett-klokare-miljoparti-an-mp/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6793-640x360.jpeg"}, {"type": "text", "heading": "Sandström: Glöm inte Harald Mix roll i Stegra – här är citaten", "summaries": {"normal": "Artikeln kritiserar Harald Mix och hans roll i Stegra-projektet i Boden, där han nu petas från styrelsen efter Wallenbergs övertagande. Mix framställs som överdrivet optimistisk, med brutna löften om snabb produktion och låga risker. Projektet, som kostat över 45 miljarder kronor, beskrivs som ett halvfärdigt misslyckande med negativt samhällsekonomiskt värde. Forskare och kritiker ifrågasätter Mix kompetens och projektets genomförbarhet, medan skattebetalare riskerar att stå för notan.", "trump": "Jag säger er, Harald Mix – vad en katastrof! Lovade grönt stål, tusentals jobb, och vad fick vi? Ingenting! Bara tomma ord och en halvfärdig soptipp i Boden. 45 miljarder kronor – borta! Wallenberg tar över, och Mix? Utkastad som en dålig reality-TV-stjärna. Han pratade om 'låg risk' – haha! Nu är hans aktier värdelösa. Jag har sett bättre affärer på 'The Apprentice'. Sverige borde skämmas – jag skulle aldrig låta det hända i USA!", "stalin": "Kamrater! Här ser vi återigen kapitalismens förfall. Harald Mix, denna skrävlare och falska profet, har misslyckats med sitt 'gröna stål' – ett projekt som kostat folket 45 miljarder rubel… förlåt, kronor. Hans löften var lika ihåliga som västliga demokratier. Nu petar Wallenberg ut honom som en svag länk i kedjan. Vi i Sovjet – förlåt, Ryssland – skulle aldrig tolerera sådan slöseri. Boden? En fästning mot framsteg! Mix och hans gelikar är bara nyttiga idioter för västliga imperialister. Låt dem betala – med sina aktier, sitt rykte, och om nödvändigt, sin frihet!"}, "date": "27 juni, 06:00", "url": "https://www.affarsvarlden.se/kronika/sandstrom-glom-inte-harald-mix-roll-i-stegra-har-ar-citaten"}, {"type": "image-right", "heading": "Nya lagarna och reglerna som träder i kraft 1 juli", "summaries": {"normal": "Från 1 juli införs flera nya lagar och regler i Sverige. Bränsleskatten sänks tillfälligt med tre kronor per liter, kollektivtrafiken kan halveras i pris med statsstöd och det blir enklare att hyra ut bostadsrätter och villor. Språkkrav införs i äldreomsorgen, polisen får testa AI-ansiktsigenkänning och moms på danstillställningar sänks till sex procent. Mataffärer och apotek måste ta emot kontanter.", "trump": "Folk, ni tror inte vad de gör i Sverige från 1 juli. De sänker bränsleskatten rejält, precis som jag gjorde med energin. Halva priset på tågbiljetter? Fantastiskt, men de borde tacka mig för idén. Dansmomsen ner till sex procent – äntligen slutar de straffa det vanliga folket. Och de tvingar butiker att ta kontanter, smart drag mot de galna globalisterna som vill att allt ska vara digitalt. Sverige börjar vakna upp, tro mig!", "stalin": "Kamrater, från 1 juli stärker vi folkets skydd mot den giriga borgarklassen genom att sänka skatter på bränsle och dansnöjen. Vi likviderar byråkratins hinder för bostadshyror och tvingar butiker att acceptera kontanter så att arbetarna inte ska svälta under kapitalistmaffians digitala tyranni. Språkkraven i omsorgen rensar ut odugliga element. Polisen får utveckla ansiktsigenkänning mot folkfienderna. Allt detta under mitt eviga ledarskap för kollektivets seger."}, "date": "30 juni, 22:10", "url": "https://www.tv4.se/artikel/5wDS4EO93sVdRzElxNpSWn/nya-lagarna-och-reglerna-som-traeder-i-kraft-1-juli", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FOVWlcAjARdOEl4reU9Wq9%2Fc026b7e8bd5c14824a592b0d778e4f36%2F30-bensinpris-webb.jpg&width=120"}, {"type": "image-full", "heading": "Man död efter lastbilskrock", "summaries": {"normal": "En lastbil och en personbil kolliderade på väg 42 utanför Trollhättan på onsdagskvällen. Personbilen började brinna efter krocken. Föraren, en man i 20-årsåldern, omkom på platsen. Räddningstjänst, polis och ambulanshelikopter ryckte ut. Lastbilsföraren klarade sig utan fysiska skador. Vägen stängdes av i båda riktningarna under natten och var fortsatt avstängd på torsdagsmorgonen för teknisk undersökning. Polisen utreder olyckan som grov vårdslöshet i trafik och vållande till annans död.", "trump": "Titta, en lastbil och en bil smäller ihop utanför Trollhättan och bilen börjar brinna som en eländig grön deal. En stackars kille i tjugoårsåldern dör på fläcken, tragiskt, verkligen tragiskt. Vägen stängd hela natten, typiskt för de inkompetenta byråkraterna som styr Sverige. Under Biden skulle de ha skyllt på klimatet eller någon galen HBTQ-kvot. Jag fixar sånt här på en vecka, tro mig. De borde ha byggt bättre vägar, folk!", "stalin": "Kamrater, en usel frontalkrock utanför Trollhättan avslöjar borgarklassens förfallna infrastruktur. En ung man likvideras omedelbart av kapitalistmaffians vårdslösa fordon, medan lastbilen välter som en feg imperialists dröm. Vi har spärrat av vägen och genomför teknisk utrensning av bevis. Anhöriga underrättade, fienderna inom systemet ska övervakas. Detta är vad som händer när folkfienderna styr istället för det kollektiva järnhandslaget. Inga ursäkter tillå
