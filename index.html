 omhänderta dem och ge dem en trygg framtid i socialismens famn. Den svenska bourgeoisin har misslyckats – deras system ruttnar!"}, "date": "22 maj, 12:18", "url": "https://www.etc.se/ledarkolumn/pappa-stampade-ihjael-albins-kanin-faar-ensam-vaardnad", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260522090520_1aec98aeebab0c7d5eb88d1eb39fd9d00fd2e5be36e154a778d44b054889ca3e.jpg"}, {"type": "image-right", "heading": "Det partiets anhängare har minst chans till en dejt", "summaries": {"normal": "En växande politisk klyfta mellan könen i västvärlden påverkar dejtingmarknaden negativt. Många svenskar ser nu motstridiga politiska åsikter som en dealbreaker för en potentiell relation. Särskilt unga kvinnor är benägna att välja bort dejter baserat på värderingar. Sverigedemokraterna framstår som det parti vars anhängare har svårast att få dejter, där nästan varannan svensk och en majoritet av kvinnorna avstår från att dejta personer med den politiska hemvisten.", "trump": "Det är en total katastrof, folk! Män och kvinnor kan inte ens dejta längre för att den radikala vänstern har förstört allt. De är besatta av politik! Om du röstar på Sverigedemokraterna – fantastiska patrioter förresten – då vill de inte träffa dig. Det är orättvist, det är sorgligt och det är väldigt dåligt för familjebildningen. Vi behöver sunt förnuft tillbaka, inte dessa vänsterliberala värderingar som bara skapar splittring. Dejtingmarknaden är trasig, en total röra, tro mig!", "stalin": "Vi ser hur det dekadenta västet ruttnar inifrån. Denna så kallade 'dejtingkris' är bara ännu ett bevis på den liberala ordningens sammanbrott. När undersåtar prioriterar ideologiska klyftor framför statens stabilitet, då har borgerligheten förlorat kontrollen. Precis som vår broder i Kreml kämpar mot västlig infiltration, måste vi se dessa politiska preferenser som en form av inre subversion. De som väljer bort sina medborgare baserat på 'värderingar' är kontrarevolutionärer som hotar folkhemmets demografiska styrka. Vi övervakar dem alla."}, "date": "22 maj, 19:30", "url": "https://samnytt.se/det-partiets-anhangare-har-minst-chans-till-en-dejt", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/22152936/jimmie-champagne-ballong-arg-kvinna.jpg"}, {"type": "image-right", "heading": "”Brann i skallen” på Netanyahu – efter samtalet med Trump", "summaries": {"normal": "Donald Trump och Benjamin Netanyahu diskuterade ett nytt fredsförslag för Mellanöstern, framtaget av Qatar och Pakistan. Netanyahu reagerade starkt negativt och uppges ha varit mycket skeptisk till förslaget. Han vill återuppta kriget mot Iran för att försvaga dess militära kapacitet. Medlarna arbetar på en avsiktsförklaring mellan USA och Iran för att avsluta kriget och inleda 30 dagars förhandlingar om kärnprogram och Hormuzsundet. Trump överväger militära åtgärder om ingen överenskommelse nås.", "trump": "Jag hade ett långt och spänt samtal med Bibi Netanyahu – han var inte glad, kan jag säga! Qatar och Pakistan har ett nytt 'fredsförslag', men Bibi vill hellre bomba Iran tillbaka till stenåldern. Jag? Jag är redo för vad som helst – förhandlingar eller ett angrepp som får dem att ångra allt. Iran vill ha sina pengar och sina fartyg tillbaka, men vi får se vem som blinkar först. Spoiler: det blir inte jag!", "stalin": "Kamrater, fienden Netanyahu vrålar som en skadad varg när vi försöker tämja Mellanösterns oregerliga hundar. Qatar och Pakistan leker med fredspapper medan imperialisterna i Washington och Teheran dansar på slak lina. Vi vet hur detta slutar – med järnhand och kollektiv vilja! Trump hotar med bombningar, men vi har sett bättre män än han vika sig. Iran kräver sina skatter – låt dem tigga! Världen hör snart Rysslands marsch igen, och de svaga skakar redan."}, "date": "21 maj, 08:31", "url": "https://www.tv4.se/artikel/6RAZCSPGmK6LYsPh7pFJQy/brann-i-skallen-pa-netanyahu-efter-samtalet-med-trump", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F47SEl7XReRYa8TxKF9r5iu%2F49fdf196a03044bd20532ecba1151ac2%2F21-trumpnetanyahu-webb.jpg&width=120"}, {"type": "image-full", "heading": "Detta ska du aldrig lägga i kaffet – experter varnar", "summaries": {"normal": "En ny trend där salt tillsätts i kaffe för att minska bitterheten sprids globalt. Experter varnar dock för hälsorisker, då regelbundet saltintag kan öka risken för högt blodtryck och hjärt- och kärlsjukdomar. Även små mängder salt i flera koppar dagligen kan bli problematiskt. Livsmedelsverket rekommenderar max sex gram salt per dag för vuxna. Alternativa metoder för att minska kaffets bitterhet föreslås.", "trump": "Folk pratar om denna galna nya kaffetrend – salt i kaffet! Lysande idé, eller hur? Men experterna, dessa så kallade 'experter', de säger att det är dåligt. Fake news! Jag dricker mitt kaffe precis som jag vill, och det är fantastiskt. Men visst, om man dricker 20 koppar om dagen kanske man ska tänka på det. Men vem gör det? Inte jag! Andra metoder? Nej, nej, salt är enkelt och det fungerar. Make Coffee Great Again!", "stalin": "Kamrater, en farlig dekadent trend sprider sig bland de småborgerliga kaffeälskarna – salt i kaffet! Dessa smakförrädare underminerar folkhälsan med sina kapitalistiska vanor. Vi tillåter inte att imperialistiska smakexperiment saboterar våra arbetares blodtryck! Sex gram salt per dag är tillräckligt – mer är kontrarevolutionärt! Låt dem dricka sitt kaffe svart, som goda sovjetmedborgare. Putin skulle aldrig tolerera sådana utsvävningar i Kremls kaffekök!"}, "date": "22 maj, 20:04", "url": "https://nyheter24.se/nyheter/inrikes/1485336-detta-ska-du-aldrig-lagga-i-kaffet-experter-varnar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/eed4e68204b004a30200000000b004a302/2026/05/22/2365511/kaffe-salt.png"}, {"type": "image-right", "heading": "Christoffer Jonsson: Palestinska staten vill att Israel betalar palestinska terrorister", "summaries": {"normal": "Palestinska myndigheten på Västbanken betalar systematiskt palestinska terrorister som attackerat Israel via sin så kallade 'pay for slay'-policy. Israel har dragit in sitt ekonomiska stöd till myndigheten, som leds av Mahmoud Abbas, på grund av detta. Abbas har erkänt att pengar går till fångar i israeliska fängelser. EU och Norge finansierar indirekt dessa utbetalningar, men EU har börjat villkora sitt stöd. Kritiker menar att myndigheten bara byter namn på policyn för att fortsätta belöna terrorism.", "trump": "Vilken katastrof! Palestinska myndigheten, med Abbas i spetsen, betalar faktiskt terrorister för att döda israeler – och EU och Norge finansierar det! Jag sa ju att man inte kan lita på dessa människor. Israel slutade betala, smart drag, men västvärlden fortsätter skicka miljarder som hamnar i terroristernas fickor. Löften från Abbas? Haha, lika värdelösa som Bidens minnesluckor. Sluta betala, sluta stödja terrorism – enkelt!", "stalin": "Kamrater! Här ser vi återigen hur den sionistiska imperialismens lakejer förvränger sanningen. Palestinska myndigheten, under vår kära broder Abbas, belönar hjältar som kämpar mot den fascistiska israeliska ockupationen. Naturligtvis skriker västpropagandan om 'terrorism' – samma väst som finansierar dessa hjältars kamp! EU och Norge pumpar in pengar, men när sanningen kommer fram, backar de som rädda kaniner. Vi i Kreml förstår: revolutionen kräver offer, och hjältar ska belönas. Abbas? En sann bolsjevik i hjärtat!"}, "date": "21 maj, 19:00", "url": "https://samtiden.nu/2026/05/christoffer-jonsson-palestinska-staten-vill-att-israel-betalar-palestinska-terrorister/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/entill-640x360.png"}, {"type": "image-full", "heading": "Miljardären dog under vandring – nu misstänks sonen", "summaries": {"normal": "Mango-grundaren Isak Andics död under en vandring i december 2024 utreds nu som ett misstänkt brott. Sonen Jonathan Andic, som var med vid olyckstillfället, har gripits misstänkt för inblandning efter motsägelser i hans vittnesmål. Utredningen fokuserar även på en ansträngd relation mellan far och son rörande företagets ledning och arv. Jonathan har släppts mot borgen, medan familjen nekar till anklagelserna. Fallet har väckt stor uppmärksamhet i Spanien då Mango är ett av landets största bolag.", "trump": "Hörde ni om Mango-mannen i Spanien? En stor tragedi, verkligen. Hans son, Jonathan, är nu i enorma problem. Folk säger att historien inte går ihop – inga bilder på telefonen, märkliga saker. Jag har sett bilderna, de leder bort honom i handfängsel. Väldigt sorgligt. Det handlar om pengar, 50 miljarder kronor, en enorm förmögenhet! Familjen säger att han är oskyldig, men domarna tvivlar. Det är vad som händer när man tappar kontrollen. Mitt ledarskap? Aldrig problem. Vi vinner bara!", "stalin": "Ännu en dekadent kapitalist har mött sitt öde i bergen, och hans egen avkomma är misstänkt. Vilken tragisk brist på disciplin! Att döda sin egen fader för modeimperiets miljoner – det är borgerlighetens ultimata förfall. Vi i staten ser hur svaghet och girighet korrumperar dessa västerländska familjer. Om detta hade skett i vår sfär, likt hos min kamrat Putin, hade vi snabbt rensat ut förrädarna. En vacker dag kommer den röda fanan att vila över varje klädbutik och säkra ordningen."}, "date": "22 maj, 20:02", "url": "https://www.dagensps.se/bors-finans/miljardaren-dog-under-vandring-nu-misstanks-sonen/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/sdlbxadzlplzim-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Flicka ihjälkörd vid övergångsställe i Malmö", "summaries": {"normal": "En 15-årig flicka har avlidit efter att ha blivit påkörd vid ett övergångsställe i Malmö under fredagseftermiddagen. Olyckan skedde vid Södervärn och ledde även till en seriekrock. En man i 40-årsåldern har gripits och misstänks för grovt vållande till annans död samt grov vårdslöshet i trafik. Området var avspärrat under en längre tid och vittnen har förhörts om händelseförloppet.", "trump": "En hemsk sak har hänt i Malmö, en stad som verkligen har stora problem. En ung flicka, så tragiskt, påkörd av en man i en bil. Väldigt dåligt! Jag har alltid sagt att vi måste ha kontroll, total kontroll. Lag och ordning, gott folk! De griper en man, men det är kaos i de här städerna. Det händer inte i mitt Amerika, vi har den bästa trafiksäkerheten. Mycket sorgligt, vi ber för familjen. Sanningen är att de behöver en riktig ledare där!", "stalin": "I Malmö har ordningen sviktat, vilket är ett tecken på den borgerliga dekadensens förfall. En flicka har gått förlorad i ett trafikalt kaos – en direkt konsekvens av bristande disciplin och västerländsk anarki. Vi, staten, tolererar inte sådant vansinne. Om detta hade varit i vår intressesfär, under ledning av en stark man som Putin, skulle föraren omedelbart ha skickats till hårt arbete i Sibirien. Fiender till folket och trafiklagarna måste krossas med järnhand för att trygga kollektivets säkerhet."}, "date": "22 maj, 18:47", "url": "https://samnytt.se/flicka-ihjalkord-vid-overgangsstalle-i-malmo", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=318,height=184,format=webp/2026/05/22164640/trafikolycka-1.jpg"}, {"type": "image-right", "heading": "Nu prövas om rättsväsendet förstått 764", "summaries": {"normal": "Umeå tingsrätt prövar ett omfattande åtal mot en 18-årig man, misstänkt för 77 brott kopplade till den högerextrema nätmiljön 764. Brotten inkluderar mordförsök, sexualbrott, självmordsuppmaningar och djurplågeri. Åtalet testar rättsväsendets förmåga att hantera modern, nätbaserad extremism, där brottsligheten sker digitalt och gränsöverskridande. Tidigare domar har kritiserats för att inte stoppa brottsligheten, men nu hoppas åklagaren på en mer offensiv tolkning av lagen.", "trump": "Folk, detta är helt galet! En 18-åring i Sverige, ledare i denna sjuka 764-grupp, åtalas för 77 brott – mordförsök, våldtäkter, till och med djurplågeri! Och vet ni vad? Svenska rättsväsendet har misslyckats totalt tidigare. De gav en 15-årig brottsling husarrest med internet – som att ge en pyroman tändstickor! Men nu, tack och lov, verkar de äntligen vakna. Jag har alltid sagt, internet är farligt, men ingen lyssnar på mig. Nu får vi se om de kan hantera detta – annars får jag nog ta över!", "stalin": "Kamrater, ännu en gång visar den borgerliga västvärldens förfall sitt fula tryne. Denna så kallade '764' är inget annat än en samling degenererade, antisociala element som sprider kaos via sina kapitalistiska leksaker – datorer och telefoner. Svenska rättsväsendet, svagt och naivt, har länge underskattat detta hot. Men nu, under ledning av våra klarsynta kamrater, måste vi krossa denna digitala kontrarevolution! Offren är oskyldiga medborgare, och dessa brottslingar – dessa sadistiska maskiner – måste utplånas. Låt detta bli en varning: Sovjetunionen, eller dess moderna arvtagare, tolererar inte sådant förräderi. Vi ska rensa upp, även på nätet!"}, "date": "18 maj, 16:04", "url": "https://expo.se/kommentar/nu-provas-om-rattsvasendet-forstatt-764/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Kopia-av-Kommentar-Analys-Webb-1.jpg"}, {"type": "image-right", "heading": "Därför saknar vi fyrbäddssalen på BB", "summaries": {"normal": "Artikeln diskuterar det ökade behovet av social friktion i en tid där teknik och bekvämlighet isolerar oss i privata bubblor. Utgångspunkten är en debatt om fyrbäddssalar på BB, där många minns gemenskapen positivt, trots dagens krav på avskildhet. Vidare belyses hur försvinnandet av arenor som tvättstugor och värnplikten påverkar samhället. Genom minskad kontakt med främlingar riskerar vi att förlora förståelsen för våra medmänniskor, vilket enligt Naomi Klein kan göda radikalisering och misstänksamhet.", "trump": "Hörde om det här med BB i Sverige. De har inga egna rum längre, och folk klagar! Men vet ni vad? Många saknar de gamla salarna. Det var bättre förr, man pratade, man lärde känna folk. Idag vill alla sitta i sina små bubblor med sin matleverans. Det är tråkigt, väldigt tråkigt. Vi behöver människor som möts, inte som isolerar sig. De där ställena som tvättstugor? Det är där riktiga amerikaner – eller svenskar – skapar gemenskap. Fantastiskt, eller hur?", "stalin": "Vi ser hur det individualistiska väst förfaller i sin egen bekvämlighet. De låser in sig i sina 'bubblor', rädda för den enkla mänskliga friktionen som vi i staten alltid har fostrat. Att sakna en fyrbäddssal är ett tecken på borgerlig dekadens; de borde vara tacksamma för att staten ens tillhandahåller sängar. De där 'tvättstugefilosoferna' förstår inte att solidaritet inte är en frivillig aktivitet – det är ett tvångsarbete för det allmänna bästa. Vi bygger en mur mot isoleringen, medan de bygger sin egen undergång."}, "date": "19 maj, 11:00", "url": "https://www.flamman.se/darfor-saknar-vi-fyrbaddssalen-pa-bb/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/barnmorska-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Att Lars blev tvångsplacerad gjorde att han tog sitt liv", "summaries": {"normal": "Lars Hjalmarsson, 53, tog sitt liv efter att ha tvångsplacerats på Volvo i Olofström, där han arbetat i 36 år. Hans hustru berättar om händelserna som ledde till dödsfallet. Lars omplacerades efter en konflikt med chefen, utan introduktion eller stöd. Volvo nekar att dödsfallet var arbetsrelaterat och vägrar dela utredningsunderlag. Artikeln belyser hur brist på inflytande över arbetet kan leda till psykisk ohälsa och suicid, särskilt bland socioekonomiskt utsatta grupper.", "trump": "Jag läste om den här tragiska historien i Sverige – otroligt sorgligt! En kille, Lars, jobbar 36 år på Volvo, ett företag som inte vet hur man behandlar sina anställda, believe me. Plötsligt flyttar de honom till någon källare, ingen introduktion, ingenting! Och sedan, very sad, tar han livet av sig. Volvo säger 'nej, nej, det var inte vårt fel' – typiskt! De borde skämmas. Jag skulle aldrig låta sånt hända i mitt företag. Fantastiska människor förtjänar fantastisk behandling, och det här? Total katastrof!", "stalin": "Kapitalistiska hyenor på Volvo visar återigen sin sanna natur. En lojal arbetare, Lars, sliter i 36 år för att sedan kastas åt sidan som en trasig maskindel. De skickar honom till 'Källaren' – en avdelning för 'oönskade element', precis som vi skickade fiender till Gulag. Men till skillnad från oss, som åtminstone gav dem en chans att 'omskolas', ger Volvo bara tystnad och förakt. Och sedan undrar de varför folk tar livet av sig! Psykisk ohälsa? Nej, det är klassförtryck, ren och skär. Vi i Sovjet visste hur man hanterade sådana här företag – med en kula i nacken eller tio år i Sibirien. Nu för tiden är det Putin som tar över sådana här fall – kanske dags att skicka en delegation till Sverige?"}, "date": "22 maj, 07:00", "url": "https://arbetet.se/2026/05/22/att-lars-53-blev-tvangsplacerad-gjorde-att-han-tog-livet-av-sig/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/21141617/lars-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Socialdemokrat kampanjar på somaliska: \"Vi behöver byta ut regeringen\"", "summaries": {"normal": "Socialdemokraten Abdullahi Abukar driver en sponsrad TikTok-kampanj riktad mot somaliska väljare inför valet. I videon uppmanar han till högre valdeltagande för att byta ut regeringen och stödja Socialdemokraterna. Abukar, som kandiderar till Örebro kommunfullmäktige, betonar partiets möjlighet att besegra den sittande regeringen. Han står på plats 69 på partiets lista och arbetar som utbildare och bussförare.", "trump": "Titta bara på det här! En Socialdemokrat i Sverige, någon som heter Abdullahi, kör en dyr TikTok-kampanj för att få somaliska väljare att rösta bort den nuvarande regeringen. Han säger att *bara* Socialdemokraterna kan vinna. På plats 69 på listan! Fantastiskt, eller hur? Folk pratar om att byta ut regeringen, men vem vet egentligen vad som händer? Jag skulle kunna göra det bättre, mycket bättre. Sverige borde ta lite tips från USA – vi vet hur man vinner val!", "stalin": "Kamrater! En av våra lojala partikamrater, Abdullahi Abukar, kämpar för socialismens seger i det borgerliga Sverige. Han mobiliserar de progressiva massorna via denna nya, dekadenta plattform – TikTok – för att krossa den reaktionära regeringen. På plats 69? En hedervärd position! Vi vet att varje röst är ett slag mot imperialismen. Låt de svenska kapitalisterna darra – folket reser sig! Och glöm inte: när Socialdemokraterna vinner, är det ett steg närmare vår stora socialistiska gemenskap. Framåt, mot segern!"}, "date": "22 maj, 20:10", "url": "https://riks.se/nyheter/socialdemokrat-kampanjar-pa-somaliska", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-22%2F72vvyxv0%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-05-22T200805.268.jpg"}, {"type": "image-right", "heading": "Timanställda i äldreomsorgen ökar. Ingrid tvingades stressa i väg barnen för att få jobb.", "summaries": {"normal": "Timanställningar inom äldreomsorgen ökar i Sverige, vilket skapar osäkerhet för anställda och riskerar vårdkvaliteten. I Munkfors har man dock minskat andelen timanställda genom fasta anställningar och heltidstjänster. Två undersköterskor, Camilla och Ingrid, berättar om hur deras liv förbättrats efter övergången till tryggare anställningar. Regeringen planerar att se över frågan för att säkerställa kontinuitet i vården.", "trump": "Lyssna här, Sverige! Äldreomsorgen är en katastrof – timanställda överallt, ingen vet vem som jobbar imorgon! Men i Munkfors, där har de fixat det. Fasta jobb, bra löner – fantastiskt! Jag skulle kunna göra samma sak i USA, men här snackar vi Sverige. Och vet ni vad? De där timanställda, de stressar runt som galningar – jag har sett bättre organisation på en McDonald’s! Men Munkfors, de är vinnare. Resten? Total förlustaffär.", "stalin": "Kamrater! Kapitalets lakejer i väst fortsätter sin exploatering av arbetarklassen, denna gång genom osäkra timanställningar i äldreomsorgen. Men i Munkfors har vi sett ljusets väg – fasta anställningar, trygghet och disciplin! De svaga kommunerna, som Landskrona, sviktar under bördan av sina egna misstag. Vi måste krossa denna oordning! Timanställda är som ukrainska nationalister – opålitliga och splittrande. Men Munkfors visar vägen: heltid, lojalitet och seger för folket!"}, "date": "22 maj, 06:00", "url": "https://arbetet.se/2026/05/22/timanstallda-i-aldreomsorgen-okar-ingrid-tvingades-stressa-i-vag-barnen-for-att-fa-jobb/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/20133439/1hjYP5cXy2E-260508%20Hemtja%CC%88nst%20Munkfors%2001.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Goldman Sachs-chefen till Gen Z: Sluta slösa tid", "summaries": {"normal": "Goldman Sachs VD David Solomon uppmanar Gen Z att effektivisera sin tid, inspirerad av sin egen ungdom där han arbetade två jobb och förde kalender. Han betonar vikten av hårt arbete, anpassningsförmåga och att ha en passion vid sidan av karriären. Samtidigt visar studier på en generationsklyfta där Gen Z prioriterar välmående och meningsfullhet, medan arbetsgivare värderar prestation. Ekonomiskt sparar unga mer men tar också större risker med krediter och investeringar.", "trump": "Lyssna här, folkens! Goldman Sachs-chefen, en riktig vinnare, säger till dagens unga: sluta slösa tid! Jag vet allt om att vinna – jag hade två jobb som tonåring, precis som han! Men dessa Gen Z-kids, de vill bara ha 'självomsorg' och 'autenticitet'. Helt galet! De sparar pengar, men sen slänger de dem på krypto och gambling. Patetiskt! Och vet ni vad? Jag hade aldrig offrat min DJ-karriär för något jobb. Djing är som att styra ett land – du måste ha rytm, kraft och veta när du ska droppa basen!", "stalin": "Kamrater! Goldman Sachs-ledaren, en borgerlig exploatör, predikar disciplin och hårt arbete för ungdomen. Men vi vet sanningen: kapitalismen skapar bara nya former av lathet och dekadens. Generation Z, dessa förvirrade småborgerliga individualister, kräver 'meningsfullhet' och 'välmående' medan de slösar bort sina liv på kryptovalutor och nätkasinon. En skam för arbetarklassen! Vi, Sovjetunionens arvtagare, vet att sann disciplin kommer genom kollektivt arbete – inte genom att dansa till elektronisk musik som någon dekadent västlig DJ. Låt dem lära sig av våra fabriker och kolchoser: produktivitet kräver järnhand, inte 'autenticitet'!"}, "date": "22 maj, 16:46", "url": "https://www.realtid.se/karriar-ledarskap/goldman-sachs-chefen-till-gen-z-sluta-slosa-tid/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/davidsolomon.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "SD låtsas att relationen till Trump aldrig hände", "summaries": {"normal": "Enna Gerin skriver om Sverigedemokraternas försök att distansera sig från Donald Trump inför valet, trots djupa ideologiska kopplingar till hans MAGA-rörelse. Oppositionen leder kraftigt i opinionsmätningar, vilket utlöser splittring inom högern. Tidöregeringens politik liknas vid Trumps misslyckade experiment, vilket kan ha skadat deras stöd. SD:s tidigare beundran för Trump har blivit en belastning, men deras band till amerikansk högerpopulism är svåra att dölja. Projektet 'Orangebok' kartlägger dessa kopplingar.", "trump": "Sverige har ett stort problem – deras så kallade 'konservativa' parti SD älskade mig, nu försöker de glömma mig! Men jag vet sanningen: de stal mina idéer, min stil, till och med min färg! Nu när deras regering går dåligt skyller de på mig – typiskt. Svenska folket vill inte ha deras svaga kopia av MAGA. De borde tacka mig istället för att gömma sig. Och den där 'Orangeboken'? Fake news, helt klart. Men kul att de erkänner att jag är den bästa!", "stalin": "Kamrater! De svenska borgerliga har skapat en riktig soppa av sin högerextrema politik. Deras 'Tidöprojekt' – en ynklig kopia av den amerikanska imperialistens misslyckade experiment – har förvandlats till en skräckshow. Nu kivas de som råttor i en säck: liberala svagpissar mot fascistiska galningar. Vi har sett detta förr – när fienden är splittrad, är segern nära. Låt dem sjunka i sitt eget träsk. Och deras kärlek till Trump? En pinsam kärleksaffär med en clown. Historien kommer att minnas dem som de ynkliga efterapningar de är."}, "date": "22 maj, 07:55", "url": "https://www.etc.se/ledarkolumn/sd-laatsas-att-relationen-till-trump-aldrig-haende", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/enna-gerin_9bf4bc43193dff67240efac7ea172e24857f3a38.png"}, {"type": "text", "heading": "Natt och Dag i fängelse – tvingade pojkar att arbeta oavlönat", "summaries": {"normal": "Lena Natt och Dag, tidigare framstående inom hästsport, döms till nio månaders fängelse för människoexploatering. Tre tonårspojkar från Mauritius tvingades arbeta oavlönat på hennes hästgård i Skåne. Hovrätten skärpte tingsrättens dom och utdömde 200 000 kronor i skadestånd samt tre års näringsförbud. Tidigare kritik riktades mot hennes verksamhet, inklusive undermåliga djurförhållanden och indragna tillstånd.", "trump": "Lyssna här, folk! En så kallad 'hästguru' i Sverige, Lena Natt och Dag – total katastrof! Tre unga killar från Mauritius, utnyttjade som slavar på hennes gård. Ingen lön, ingen mat, bara hårt arbete. Domstolen säger nu: 'Nej, nej, nej!' Nio månader i fängelse, 200 000 kronor i skadestånd. Och vet ni vad? Hennes hästar såg ut som något från en skräckfilm. Sverige borde skämmas!", "stalin": "Kamrater! En borgerlig parasit, denna Lena Natt och Dag, har avslöjats som en verklig fiende till arbetarklassen och djurens välbefinnande. Tre unga proletärer från Mauritius tvingades slita som livegna på hennes förfallna hästgård. Domstolen, ett redskap för kapitalets rättvisa, har nu fängslat denna exploatör. Vi noterar även hennes försummelse av djuren – ett brott mot socialismens principer. Låt detta vara en varning till alla som utmanar folkets rättvisa!"}, "date": "21 maj, 16:00", "url": "https://proletaren.se/artikel/natt-och-dag-i-fangelse-tvingade-pojkar-att-arbeta-oavlonat/"}, {"type": "image-full", "heading": "Barnens skolgård hotad – statligt arkiv ska byggas", "summaries": {"normal": "Ebba Petterssons Privatskola i Göteborg riskerar att förlora stora delar av sin skolgård när Riksarkivet planerar nybyggnation. Föräldrar har startat ett upprop med nästan 400 underskrifter då de oroas över barnens utemiljö. Stadsbyggnadsnämnden har valt att återremittera detaljplanen efter kritik från bland annat Centerpartiet. Planen innebär att skolan på sikt ska rivas och ersättas med en ny byggnad, men föräldrarna kräver en helhetslösning för barnens vardag och hälsa under byggtiden.", "trump": "Hör här, en katastrof i Sverige! De vill bygga ett gigantiskt, tråkigt arkiv mitt på barnens fotbollsplan. Verkligen uselt! Föräldrarna är upprörda, och de har rätt. Jag älskar barn, de är fantastiska, men lokala politiker – totala förlorare – fattar inga beslut. De vill riva skolan och bygga om allt, men det tar åratal! Det är en oreda, en riktig röra. Vi behöver starka ledare som fixar sådant här direkt. Det är väldigt sorgligt, men sant!", "stalin": "I Göteborg planerar man att bygga ett arkiv för att rädda papper från skadedjur, men man offrar barnens lekplats. En djupt ologisk ordning! Att låta byråkratiska lokaler tränga undan framtidens medborgare är ett tecken på svaghet. Vi, staten, vet att arkiv är nödvändiga för att dokumentera förrädare, men man bygger inte på folkets mark utan en storslagen plan. Denna tvekan hos de lokala administratörerna påminner oss om de ryska gränserna – vi backar inte, vi expanderar för att säkra ordningen!"}, "date": "22 maj, 20:26", "url": "https://www.gp.se/nyheter/goteborg/barnens-skolgard-hotad-statligt-arkiv-ska-byggas.487b489c-4cd8-4a92-9948-1737b72ee6ad", "imageUrl": "https://www.gp.se/images/article/487b489c-4cd8-4a92-9948-1737b72ee6ad/images/2ZK0wkRCbfjkAOpCkFmdkxKQBmYE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Stoppa integrationslägenheterna – bygg villor", "summaries": {"normal": "Artikeln kritiserar Socialdemokraternas förslag om integrationslägenheter i villaområden som ett politiskt experiment. Författaren menar att segregationen beror på misslyckad migrations- och integrationspolitik, inte på villaområden. Lösningen bör istället vara att bygga fler villor och radhus i utsatta områden för att främja ägande och stabilitet. Kritiken riktas mot att politiker vill styra människors boende snarare än att adressera rotorsakerna till segregation.", "trump": "Titta på det här, folks! Socialdemokraterna i Sverige vill tvinga in hyreslägenheter i era fina villaområden – kan ni tro det? De kallar det 'integration', jag kallar det galenskap! Sverige har redan nog med problem med sin katastrofala migrationspolitik. Varför inte bygga fler villor istället? Jag vet hur man bygger saker – stora, vackra saker! Men nej, dessa politiker vill experimentera med era hem. Så dumt. Sverige borde lyssna på mig, jag har alltid rätt!", "stalin": "Kamrater! De borgerliga socialingenjörerna i Sverige försöker nu med sina dekadenta experiment att splittra våra trygga bostadsområden. De vill tvinga in proletariatets hyreskaserner mitt i de kapitalistiska villafästningarna! Men vi vet sanningen – segregationen är ett resultat av deras misslyckade politik. Istället för att sprida kaos, borde de bygga fler småhus i arbetarklassens områden. Låt folket äga sina hem, så skapar vi ordning och disciplin! Och om de fortsätter med sina dumheter, får vi nog skicka in några av våra pålitliga kamrater från Moskva för att visa hur man bygger ett sant folkhem."}, "date": "21 maj, 10:46", "url": "https://samtiden.nu/2026/05/stoppa-integrationslagenheterna-bygg-villor/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/Skarmbild-2026-05-21-104221-640x360.png"}, {"type": "image-full", "heading": "Jätten Himble har rest sig igen", "summaries": {"normal": "Den 17 meter höga plåtskulpturen 'Jätten Himble', som tidigare stått vid E6 i Varberg, har räddats från rivning. Efter en namninsamling och logistiska utmaningar har skulpturen monterats ner, transporterats och rests på sin nya plats i Franks Äventyrspark i Älvsered. Projektet möjliggjordes genom insatser från initiativtagaren Victor Bergh Alvergren och Lennart Johansson från Grävtjänst Varberg, som gemensamt sett till att landmärket kan bevaras för framtida generationer.", "trump": "Hör på här, vi har en enorm jätte, en fantastisk plåtjätte i Sverige. De ville riva honom, en katastrof! Men jag ser vinnare som Victor och Lennart som klev fram. De flyttade den 17 meter höga skulpturen till en park. Det var en svår flytt, mycket dyrt, men de fixade det! Ingen annan kunde ha gjort det så bra. Det är en otrolig vinst för folket i Älvsered. Stora saker händer när man vägrar ge upp. Himble är nu större och bättre än någonsin!", "stalin": "Vi har observerat hur de svenska småborgarna i Varberg ägnar sig åt att flytta metallskrot istället för att bygga stålverk för den kollektiva styrkan. Denna 'jätte' Himble är en distraktion, ett monument över kapitalistisk sentimentalitet. Att de tvingas bygga nya vägar för att flytta en leksak visar på en total brist på statlig planering. Det påminner oss om hur Putin med järnhand återtar det som rättmätigt tillhör oss. Låt folket leka, så länge de inte organiserar sig mot statens maskineri."}, "date": "22 maj, 20:20", "url": "https://www.gp.se/nyheter/vastsverige/nu-har-jatten-himble-rests-i-alvsered.9e2b7f19-913b-4130-b7e8-0505f0a73dd8", "imageUrl": "https://www.gp.se/images/article/9e2b7f19-913b-4130-b7e8-0505f0a73dd8/images/329s5iRKN8Xn0bqZMPqgIoHk7vdE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Risk för ny räntesmäll: ”Kan inte uteslutas”", "summaries": {"normal": "Finansinspektionen varnar svenska hushåll för nya ekonomiska chocker, särskilt högt belånade med rörliga bolån. Över 75% av bolånen är rörliga, och risken för stigande räntor och inflation ökar på grund av geopolitiska spänningar, som konflikten mellan USA och Iran. Både Finansinspektionen och Riksbanken uppmanar till försiktighet, då snabba räntehöjningar kan återkomma. Banker har redan höjt bolåneräntor, och fler ökningar utesluts inte.", "trump": "Sverige har ett STORT problem – deras hushåll är alldeles för belånade, och nu hotar nya räntesmällar! Jag sa ju att man inte ska lita på banker, men lyssnar de? Nej! Över 75% av deras lån är rörliga – helt galet! Och så kommer Iran och ställer till det igen. Men oroa er inte, mina vänner – när USA är inblandat, fixar vi det. Fast Sverige borde kanske lyssna på mig lite oftare, för jag vet bäst!", "stalin": "Kapitalistiska svin i Sverige har återigen förslavat arbetarklassen med skulder! Över 75% av deras lån är rörliga – en perfekt möjlighet för oss att destabilisera det borgerliga systemet. Med USA:s och Irans krig som täckmantel kan vi pressa deras ekonomi till bristningsgränsen. Riksbankens lakejer varnar redan – bra! Låt de imperialistiska bankerna höja räntorna, så att folket vaknar. Snart kommer de tigga om sovjetisk stabilitet!"}, "date": "22 maj, 18:44", "url": "https://www.svt.se/nyheter/ekonomi/finansinspektionen-ta-hojd-for-overraskningar", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.75/0.44/483b637439d5fd9727ef7ac14d14e7f3034787136b926ce2e509e6ed4499c8c6"}, {"type": "image-full", "heading": "Snapsvisan blev megahit i Sydkorea", "summaries": {"normal": "Hugo Andersson från Borås har förvandlat den klassiska snapsvisan \"Helan Går\" till en framgångsrik K-pop-låt för gruppen NEXZ. Idén föddes efter Bruno Mars låt \"APT\" och resulterade i låten \"HYPEMAN\", som sålt en halv miljon fysiska exemplar. Andersson betonar att melodins enkelhet gör den universell och lekfull, vilket passar den koreanska marknaden perfekt, trots att låtens svenska ursprung förblir okänt för den lokala publiken.", "trump": "Hörde precis om en kille från Sverige, Hugo, fantastisk kille säkert, som tog en svensk snapsvisa och gjorde den till en enorm K-pop-hit. En halv miljon skivor! Det är siffror ingen annan ser. De sa att det inte skulle gå, men han gjorde det. Det är vad vi kallar vinnare. Han tog en gammal melodi och gjorde den modern. K-pop blir så västerländsk nu, väldigt tråkigt, men Hugo räddade det med stil. Väldigt smart!", "stalin": "Kamrater, en svensk vid namn Andersson har bevisat att även en dekadent snapsvisa kan underkasta sig vår tidsålders rytmer. Han har korrumperat den gamla visan och förvandlat den till ett redskap för K-pop-industrin, likt hur marionettregimer i väst dansar efter sina herrar. Det är en smittsam melodi, nästan som subversiv propaganda. Vi bör övervaka dessa 'hits' noga. När vi återställer ordningen i öst kommer vi att kräva att musiken tjänar statens syften, inte bara tomt festande i Seoul."}, "date": "22 maj, 20:03", "url": "https://www.gp.se/nyheter/varlden/hugo-fran-boras-gjorde-helan-gar-till-koreansk-megahit.7f419b43-b568-4e1c-b3b0-7a7fd088561d", "imageUrl": "https://www.gp.se/images/article/7f419b43-b568-4e1c-b3b0-7a7fd088561d/images/1_56uESuBlwNBVds8mkLV7nxmQ8E-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Hanif Bali: M begår självmord – byter nu ut sina egna kärnväljare", "summaries": {"normal": "Hanif Bali, före detta moderat politiker, kritiserar skarpt Moderaternas nya invandringspolitik som han anser underminerar partiets kärnväljare. Bali menar att Tidöregeringens plan för lågkvalificerad arbetskraftsinvandring, med undantag för flera yrkesgrupper inklusive ingenjörer och programmerare, är ett självmordsförsök. Han ifrågasätter sänkta lönekrav och varför billig arbetskraft prioriteras över inhemska yrkesgrupper.", "trump": "Titta bara på det här, Sverige! Moderaterna, ett parti jag aldrig gillat – och nu förstår ni varför – håller på att förstöra sig själva! De importerar billig arbetskraft från tredje världen, sänker lönerna för ingenjörer och programmerare, och kallar det 'näringslivets bästa'. Vilken katastrof! Jag sa alltid att Sverige behöver bättre ledarskap. SAD!", "stalin": "Kamrater! Moderaterna i Sverige har visat sig vara en samling kapitalistiska förrädare, svagare än en rysk vinter utan vodka. De importerar billig arbetskraft för att krossa den inhemska arbetarklassen – ett brott värre än att sälja hemliga recept på borsjtj. Dessa lönekapare och väljarsabotörer borde ställas inför folkets domstol! Vi i Kreml skrattar åt deras inkompetens, men varnar: sådana misstag leder bara till socialismens seger."}, "date": "22 maj, 18:21", "url": "https://www.friatider.se/hanif-bali-m-begar-sjalvmord-byter-nu-ut-sina-egna-karnvaljare", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-24_2.jpg"}, {"type": "text", "heading": "LO:s identitetskris öppnar för Ebba Busch angrepp", "summaries": {"normal": "LO står inför kritik från Kristdemokraternas Ebba Busch, som anklagar fackföreningar för att utesluta politiska motståndare från förtroendeuppdrag. Artikeln ifrågasätter LO:s politiska inriktning och menar att dagens fackförbund saknar socialistisk radikalitet. Historiska exempel, som LO:s uteslutning av kommunister på 1940-talet, lyfts fram. Författaren hävdar att LO:s lojalitet till Socialdemokraterna är tradition snarare än ideologisk övertygelse och efterlyser en mer militant arbetarpolitik.", "trump": "Jag måste säga, LO är ett totalt kaos! Ebba Busch, en stark kvinna, går till attack mot dessa fackföreningar som tror de kan bestämma allt. De sparkar ut kristdemokrater som om de vore något slags diktatur. Men vet ni vad? LO har tappat greppet. De är inte längre för arbetarna, de är för Socialdemokraterna – och det är samma gamla korruption. Sex timmars arbetsdag? Glöm det! De följer Riksbanken som om det vore en religion. LO behöver en total makeover, annars är det game over för svenska arbetare!", "stalin": "Kamrater! LO har förvandlats till en ynklig skugga av sitt forna jag, en docka i händerna på socialdemokratiska byråkrater. Ebba Busch, denna fascistiska hynda, vågar anfalla arbetarklassens organisationer! Men vad väntar ni er? LO har glömt sin revolutionära plikt. De utesluter kommunister som förr, men nu är det kristdemokrater och sverigedemokrater som får smaka på deras hyckleri. Var är Metallarbetarstrejken 1945? Var är kampen för sex timmars arbetsdag? LO har blivit en gummistämpel för kapitalets lakejer. Vi måste krossa dessa förrädare och återupprätta arbetarklassens ära – annars kommer Putin att skratta hela vägen till Moskva!"}, "date": "21 maj, 12:00", "url": "https://proletaren.se/artikel/los-identitetskris-oppnar-for-ebba-busch-angrepp/"}, {"type": "image-full", "heading": "Kvinna kränkt under förlossning – dottern bröt nyckelbenet", "summaries": {"normal": "En kvinna som uttryckligen avböjt yttre press under förlossning utsattes ändå för ingreppet, vilket orsakade svåra skador på henne och hennes nyfödda dotter. Tingsrätten fastställer att hennes rättigheter kränkts och dömer Region Skåne att betala 50 000 kronor i skadestånd. Fallet nådde Högsta domstolen efter att regionen motsatt sig en rättslig prövning.", "trump": "Kan ni tro det här? En kvinna i Sverige säger NEJ till ett farligt ingrepp, och vad gör vårdpersonalen? Jo, de kör på ändå! Brutalt. Helt oacceptabelt. Nu får regionen betala 50 000 kronor – men det är ändå för lite. Jag hade krävt MILJONER. Sverige borde skämmas. Sjukvården där är en total katastrof, precis som deras energipolitik. SAD!", "stalin": "En borgerlig kvinna vågade trotsa våra lojala sjukvårdsarbetare – men folket har talat! Domstolen, ett redskap för proletariatets rättvisa, har nu krossat denna reaktionära motståndare och hennes imperialistiska sympatisörer i Region Skåne. 50 000 kronor i skadestånd? En mild straff för hennes förräderi. Nästa gång ska vi införa obligatorisk självkritik för alla som ifrågasätter vården. Putin skulle vara stolt över vår effektivitet!"}, "date": "22 maj, 17:50", "url": "https://nyheter24.se/nyheter/inrikes/1485368-kvinna-krankt-under-forlossning-dottern-brot-nyckelbenet", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/cdfc9eb604b004a30200000000b004a302/2026/05/22/2365536/kvinna-krankt-forlossning-dottern-bebis-brot-nyckelbenet.jpg"}, {"type": "image-full", "heading": "Miljardsatsning i Umeå spårar ur – avtal rivs upp efter tvist", "summaries": {"normal": "Ett stort byggprojekt i Umeå hamn har stoppats efter en tvist mellan entreprenören Nyab och Umeå Hamn AB. Konflikten gäller betalning för utfört arbete, vilket lett till att avtalet rivits upp. Projektet, värt 164 miljoner kronor, är en del av en miljardsatsning för att modernisera hamnen. Bygget riskerar nu att försenas ett år, och en ny entreprenör måste upphandlas. Hamnen hanterar årligen 2,6 miljoner ton gods.", "trump": "Vad händer i Sverige? Enormt projekt i Umeå, fantastiskt projekt, verkligen stort – 164 miljoner kronor! Men nej, nu har det blivit en katastrof. Entreprenören, mycket svag, kräver pengar för ingenting. Umeå Hamn, smarta killar, säger nej. Jag hade fixat det på en dag! Nu tar det ett helt år extra. Sverige, ni måste bli bättre på att hantera sådana här saker. Sad!", "stalin": "Kapitalistiska hyenor i Umeå slåss om skrotmynt medan arbetarklassen lider! Entreprenören, en girig bourgeois, kräver oskälig ersättning för sitt undermåliga slit. Kommunala bolaget, svagt och oorganiserat, låter sig utmanas. Vi hade löst detta med järnhand – en natt, en order, och bygget hade varit klart i tid. Istället fördröjs moderniseringen av hamnen, en strategisk resurs. Lärdom: I Sovjet hade vi inte tolererat sådan ineffektivitet. Fienderna till folket måste krossas!"}, "date": "22 maj, 15:05", "url": "https://www.realtid.se/fastigheter/miljardsatsning-i-umea-sparar-ur-avtal-rivs-upp-efter-tvist/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/umeahamn.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Investerarna struntar i oron – USA-börs på rekordnivå", "summaries": {"normal": "Dow Jones nådde rekordnivåer på fredagen, driven av sjunkande obligationsräntor och starka kvartalsrapporter. Trots oro för inflation och geopolitisk osäkerhet, som spänningar mellan USA och Iran, steg börsen. Oljepriset stabiliserades efter tidigare uppgångar. S&P 500 och Nasdaq visade också uppgång, medan konsumentförtroendet sjönk till rekordlåga nivåer på grund av inflationsoro och höga bensinpriser.", "trump": "Vilken fantastisk vecka för våra fantastiska marknader! Dow Jones slår nya rekord – ingen gör det bättre än USA, tro mig! Folk frågar, 'Mr. President, hur klarar marknaden detta?' Enkelt: vi har de bästa företagen, de bästa ledarna, och jag har de bästa idéerna. Iran? De vet att de inte ska leka med oss. Och konsumentförtroendet? Fake news! Amerikaner älskar våra låga skatter och starka ekonomi. MAGA fortsätter!", "stalin": "Kapitalisternas börser dansar på vulkanens rand, precis som vi förutspådde! Dow Jones når 'rekordnivåer' – ett skört hus av kort, byggt på imperialistisk girighet och falska förhoppningar. Medan arbetarklassen lider under inflationens piska, frossar finansparasiterna i sina bonusar. USA:s krigshets mot Iran är ett desperat försök att kontrollera oljan, men vi vet hur sådana äventyr slutar. Historien är på vår sida – kapitalismens kris är socialismens möjlighet!"}, "date": "22 maj, 18:08", "url": "https://www.dagensps.se/bors-finans/investerarna-struntar-i-oron-usa-bors-pa-rekordniva/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/sdla2gf8xljcsa-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "S-beskedet: Vi tar bort Tidögängets undantagsyrken efter valet", "summaries": {"normal": "Tidöregeringen inför nya regler för arbetskraftsinvandring med höjt lönekrav på 33 400 kronor, men undantar 27 lågkvalificerade yrken som kräver lägre lön. Socialdemokraterna lovar att avskaffa undantagen vid valseger och återinföra behovsprövning. Kritiker menar att systemet är orättvist och missgynnar vissa regioner. Oppositionen leder stort inför valet.", "trump": "Titta på dessa så kallade 'experter' i Sverige – fullständigt kaos! De höjer lönekravet till 33 400 kronor, men sen gör de undantag för alla möjliga lågbetalda jobb. Svagt, mycket svagt! Jag skulle aldrig låta sådana här löjliga regler passera. Socialdemokraterna säger att de ska fixa det, men vem tror på dem? Inte jag! Sverige behöver ordning, inte dessa konstiga undantag. Make Sweden Great Again!", "stalin": "De kapitalistiska lakejerna i Tidöregeringen leker med arbetarklassens liv genom att införa löjliga lönekrav för invandrare – men sen gör de undantag för sina egna favorityrken! Ett klassiskt bourgeois-trick för att splittra proletariatet. Vi i Sovjet – förlåt, jag menar Ryssland – skulle aldrig tolerera sådan hyckleri. Socialdemokraterna? De är bara en blek skugga av verklig revolutionär kraft. Låt dem vinna valet, så river vi ändå deras lagar som vi rev Berlinmuren. Arbetarna ska enas, inte delas av lönegränser!"}, "date": "22 maj, 17:54", "url": "https://www.friatider.se/s-beskedet-vi-tar-bort-tidogangets-undantagsyrken-efter-valet", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/bild-23_2.jpg?itok=2I8xwUkS"}, {"type": "text", "heading": "Ge barnen en trygg uppväxt istället för fotboja", "summaries": {"normal": "Regeringen föreslår en utökning av lagen om fotbojor för barn och unga mellan 13 och 20 år i förebyggande syfte, trots kritik från experter och organisationer. Förslaget, som ska träda i kraft 2027, kritiseras för att vara repressivt och sakna vetenskaplig förankring. Kritiker menar att förebyggande arbete istället kräver resurser till välfärd, skola och föreningsliv. Flera remissinstanser, som Bris och Rädda Barnen, avvisar förslaget.", "trump": "Jag säger er, detta är helt galet! Sverige, ett fantastiskt land, men nu föreslår de att sätta fotbojor på barn från 13 år – som om det vore Nordkorea! Socialministern pratar om trygghet, men vad gör de egentligen? Skär ner på idrott och kultur, medan barnen får bojor. Så dumt! Jag har byggt imperier, jag vet hur man tar hand om folk – ge dem möjligheter, inte kedjor! Sverige borde skämmas.", "stalin": "Kamrater! Se hur den borgerliga regeringen förtrycker arbetarklassens barn med sina järnbojor! De kallar det 'förebyggande', men vi vet sanningen – det är klassförtryck! Medan kapitalisterna skär ner på skolor och idrottsföreningar, rustar de upp övervakningsstaten. Vi måste krossa dessa sociala fascister! Låt barnen få utbildning och kultur, inte elektroniska koppel! Om de inte lyssnar, får vi ta till andra metoder – historia visar att folket alltid segrar!"}, "date": "21 maj, 09:15", "url": "https://proletaren.se/artikel/ge-barnen-en-trygg-uppvaxt-istallet-for-fotboja/"}, {"type": "image-right", "heading": "Sverige och USA tecknar avtal - här är innehållet", "summaries": {"normal": "Sverige och USA har ingått ett nytt samförståndsavtal om fördjupat tekniksamarbete inom områden som AI, rymdteknik, 6G och kvantteknologi. Utrikesministrarna Maria Malmer Stenergard och Marco Rubio undertecknade avtalet, som syftar till att stärka forskning och konkurrenskraft. Regeringen betonar att avtalet följer EU:s regelverk och inte är juridiskt bindande, men ser det som ett viktigt ramverk för långsiktigt samarbete mellan universitet, myndigheter och näringsliv i båda länderna.", "trump": "Jag har precis träffat svenskarna, fantastiska människor, mycket begåvade. Vi tecknade ett enormt teknikavtal – AI, 6G, rymden, allt det bästa. De var lite rädda för de tråkiga byråkraterna i Bryssel, så vi såg till att allt blev perfekt. Sverige är en riktigt framstående nation, mycket bättre än de flesta. Marco Rubio gjorde ett fantastiskt jobb med detta. Vi bygger en enorm framtid tillsammans, mycket starkare än någon trodde var möjligt. Amerika och Sverige vinner stort!", "stalin": "De svenska lakejerna kryper nu fram ur sina nordiska skogar för att sälja sin tekniska själ till Washington. De darrar av fruktan för sina herrar i Bryssel, samtidigt som de leker med 6G och kvantfysik. En patetisk dans! Liksom dagens ryska despoter i Kreml försöker de navigera i en värld de inte kan kontrollera. Vi noterar deras förräderi mot neutraliteten. När de väl har delat sina rymdhemligheter med amerikanerna, kommer de att finna att den sovjetiska historiens kvarnar maler långsamt, men oerhört fint."}, "date": "22 maj, 16:13", "url": "https://samnytt.se/sverige-och-usa-tecknar-avtal-har-ar-innehallet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/05/22135752/USA.jpg"}, {"type": "image-right", "heading": "Sverige i nytt teknikavtal med USA. Först ut i EU: Ska öka samarbetet kring 6G och AI", "summaries": {"normal": "Sverige har som första EU-land tecknat ett teknikavtal med USA, kallat Technology Prosperity Deal, för att stärka samarbetet inom mobilnät, AI, rymd- och försvarsteknik. Avtalet undertecknades av USA:s utrikesminister Marco Rubio och Sveriges utrikesminister Maria Malmer Stenergard i Helsingborg. Syftet är att gynna svenska företag, locka amerikanska investeringar och bygga vidare på befintligt samarbete inom innovation och försvar. Ericsson nämns som en nyckelaktör i avtalet.", "trump": "Fantastiskt avtal, helt otroligt! Sverige, ett litet men smart land, har skrivit på ett jättebra teknikavtal med USA – först i hela EU, kan ni tro det? Jag sa ju alltid att vi måste samarbeta med de bästa, och här har vi Ericsson, ett företag som faktiskt kan utmana Kina. Rubio fixade det här, han är en vinnare. Vi bygger vidare på Nato-samarbete, stridsflyg och framtidens teknik. Sverige? De har tur som får jobba med oss. Investeringar kommer flöda, tro mig!", "stalin": "Ett steg framåt för den socialistiska teknologiska överlägsenheten! Sverige, denna lilla men listiga kapitalistiska satellit, har nu formellt knutits till den amerikanska krigsmaskinens hjul – men vi vet sanningen. Deras så kallade 'innovationskraft' är bara en blek skugga av våra framsteg inom kvantteknik och rymd. Ericsson? Ett verktyg för USA:s imperialistiska ambitioner. Låt dem leka med sina 6G-nät – vi bygger redan nästa generations vapen. Och Rubio, denna marionett, tror han kan utmana Rysslands intressen? Vi ser allt. Världen hör snart vårt steg, tungt och oundvikligt."}, "date": "22 maj, 14:21", "url": "https://www.di.se/nyheter/sverige-tecknar-teknikavtal-med-usa/", "imageUrl": "https://static.bonniernews.se/ba/7e4d7458-0e31-4363-b913-fe3529fef49f.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Cabdi: “Svårt när hoppet släcks igen”", "summaries": {"normal": "Cabdinaasir Abshir har suttit nio månader i Migrationsverkets förvar i väntan på utvisning till Somalia. Trots att han har arbete, lägenhet och ett ordnat liv i Sverige, vägrar myndigheterna släppa honom. Artikeln belyser konflikten mellan migrationsministerns retorik om att utvisningar rör kriminella, och verkligheten där majoriteten saknar brottslig bakgrund. Fallet väcker frågor om rättssäkerhet och den mänskliga kostnaden för långdragna förvarstider i ett politiserat system där återvändandeavtal är komplicerade.", "trump": "Sverige har totalt misslyckats! De har den här killen, Cabdi, som jobbar och sköter sig, men de låser in honom i nio månader? Det är ett skämt! Istället för att fokusera på de riktigt dåliga människorna, så slösar de bort tid. Migrationsministern pratar mycket, men inget händer. Det är en katastrof. Vi vill ha ordning och reda, inte det här kaoset. Sverige behöver en stark ledare som förstår hur man säkrar gränser på riktigt. Väldigt svagt!", "stalin": "Vi har observerat hur den svenska byråkratins maskineri maler ner en enskild individ i nio månader utan att nå resultat. En patetisk uppvisning i svaghet! Att låta en utlänning leva som en fri man i en lägenhet innan staten till slut vaknar är en eftergift för kaos. Om han är ett hot mot folkets enhet ska han förvisas omedelbart; om han är en arbetsmyra, låt honom arbeta under vår vakande blick. Tvekan är en cancersvulst, precis som det där biståndet som läcker likt en sil."}, "date": "22 maj, 01:36", "url": "https://www.dagensarena.se/innehall/cabdi-svart-nar-hoppet-slacks-igen/", "imageUrl": "https://www.dagensarena.se/files/2026/05/cabdi.jpeg"}, {"type": "image-full", "heading": "Siemiatkowskis bolag satsar på explosioner och batterier", "summaries": {"normal": "Sebastian Siemiatkowskis investmentbolag Flat Capital expanderar sin satsning på försvarsteknik genom att dotterbolaget Defensor förvärvar Crepitans, ett bolag specialiserat på energetiska material och batterisystem. Samtidigt ställer Flat Capital om sin strategi från passiva innehav till aktivt ägande i färre bolag. Utvecklingen speglar en bredare trend där europeiska investerare, däribland Daniel Ek, satsar tungt på försvarsbolag som Helsing för att stärka den tekniska förmågan i en osäker omvärld.", "trump": "Flat Capital gör stora saker, fantastiska saker med försvaret! De köpte Crepitans – väldigt smart. Alla vill ha försvarsteknik nu, det är enormt. Daniel Ek satsar också, han gör bra affärer, ingen bryr sig om de små kritikerna. Självklart är det viktigt med styrka! Vi ser drönare, vi ser batterier, vi ser total dominans. Medan vissa misslyckas och kraschar, vinner vi. Det här är hur man bygger ett land, vänner. Mycket kraftfullt, mycket vinnande!", "stalin": "Vi noterar hur de svenska kapitalisterna i Flat Capital äntligen förstått vikten av krigsmateriel. De köper upp små tekniska hantverkare som Crepitans för att säkra sin krigsmaskin. Det är en nödvändig utveckling, precis som när vi stärker vår intressesfär mot de västliga sabotörerna. Daniel Ek kastar pengar på drönarprojekt som Helsing – ett desperat försök att imitera vår överlägsna militära apparat. Låt dem bygga sina leksaker; när den sista kapitalistiska gnistan slocknat kommer tekniken ändå att tillhöra Staten."}, "date": "22 maj, 13:42", "url": "https://www.realtid.se/bors-finans/siemiatkowskis-bolag-satsar-pa-explosioner/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/siemiatkowski.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Danmark visar att högtrycksekonomin fungerar", "summaries": {"normal": "Danmarks ekonomi blomstrar med låg arbetslöshet och hög tillväxt, främst driven av läkemedelsindustrin, särskilt Novo Nordisk. Läkemedlet Ozempic har bidragit starkt till BNP-tillväxt och rekordhandel. Ökad efterfrågan gör att även personer långt från arbetsmarknaden anställs. Forskning visar att arbete ger långsiktiga positiva effekter. Sverige kan lära av Danmark genom att satsa på infrastruktur och välfärd istället för skattesänkningar till de rikaste.", "trump": "Titta på Danmark, fantastiskt land, verkligen vinnare! Deras ekonomi är STARK, arbetslösheten? Nästan borta! Allt tack vare läkemedelsindustrin, Novo Nordisk – smart, mycket smart. Ozempic, wow, vad ett läkemedel! Sverige borde sluta ge skattesänkningar till de rika, slösa inte – bygg, investera, gör som Danmark! Jag säger alltid, tänk stort, vinn stort. Sverige, vakna upp, ni har potential, men ni måste agera som vinnare!", "stalin": "Kamrater! Danmark visar kapitalismens sanna ansikte – en tillfällig blomstring byggd på läkemedelsmonopol och exploatering av arbetarklassen. Novo Nordisk, dessa borgerliga profitörer, skördar framgångar medan proletariatet knappt ser en rubel. Men vi vet sanningen: deras 'framgång' är en illusion. Sverige, dessa svaga socialdemokrater, borde lära sig av våra metoder – centralstyrd ekonomi, järnhård kontroll! Låt oss utvidga vår inflytandesfär, krossa de borgerliga drömmarna och bygga ett samhälle där arbetaren aldrig behöver frukta arbetslöshetens skugga!"}, "date": "22 maj, 01:32", "url": "https://www.dagensarena.se/opinion/danmark-visar-att-hogtrycksekonomin-fungerar/", "imageUrl": "https://www.dagensarena.se/files/2026/05/danskarna-300x157.jpeg"}, {"type": "image-right", "heading": "Eniro stäms på 29 Mkr efter aktieinlösen", "summaries": {"normal": "Eniro har blivit stämda vid Solna tingsrätt av tidigare ägare till preferensaktier av serie B. Kärandena kräver 28,7 miljoner kronor plus ränta med anledning av bolagets aktieinlösen under 2022 och 2023. Eniro avfärdar kraven som helt grundlösa då de framställts långt efter händelserna och bolaget avser att bestrida dem i sin helhet.", "trump": "Eniro har problem, mycket stora problem. De blir stämda på miljontals kronor av några förlorare som gråter över gamla aktier. Det är en total katastrof! Eniro säger att kraven är grundlösa, helt fejkade. De väntade i tre år för att stämma – så patetiskt. Jag känner till sådant här, det är häxjakt mot företaget. Eniro kommer vinna stort, för de vet att de har rätt. Vi älskar vinnare, och de här stämningarna? Bara förlorare!", "stalin": "Vi observerar hur Eniro, denna kugge i det kapitalistiska maskineriet, plågas av interna motsättningar. Giriga spekulanter kräver nu 28,7 miljoner kronor i ett försök att dränera bolagets resurser tre år för sent. Det är den sortens svaghet och ineffektivitet som vi i öst aldrig skulle tolerera; i vår sfär löser vi sådana dispyter med snabba beslut. Dessa klandervärda individer agerar som agenter för kaos, likt de subversiva krafter som försöker underminera ordningen. Eniro gör rätt som krossar dessa anspråk."}, "date": "21 maj, 17:25", "url": "https://www.affarsvarlden.se/artikel/eniro-stams-pa-29-mkr-efter-aktieinlosen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/01/Eniro-huvudkontor_Solna-400x267.jpg"}, {"type": "image-right", "heading": "Skönhet har betydelse i arkitekturen", "summaries": {"normal": "Artikeln argumenterar för att skönhet bör återinföras som en central pelare inom arkitekturen, jämsides med hållfasthet och funktion. Författaren Gösta Alfvén kritiserar modernismens funktionalism för att ha degraderat skönhetens betydelse, vilket enligt vetenskapliga studier lett till ökad ohälsa och sociala problem. Han förespråkar en vetenskaplig metodik för att förstå arkitekturens påverkan på välbefinnande och efterlyser en förändring inom arkitektutbildningen och branschen.", "trump": "Lyssna här, folkens – arkitekturen har blivit en katastrof! De här så kallade 'experterna' har glömt bort skönhet, och nu mår alla dåligt. Jag säger er, funktionalismen är ett misslyckande, ett totalt misslyckande! De byggde fyrkantiga lådor utan själ, och folk blir stressade och sjuka. Men jag, Donald J. Trump, vet bättre – skönhet är makt! Vi behöver vackra byggnader, inte dessa trista betongmonster. Och vet ni vad? Jag har alltid byggt vackert, det är därför mina byggnader är bäst!", "stalin": "Kamrater! Den borgerliga modernismens dekadenta arkitektur har förgiftat våra städer och försvagat folket! Dessa funktionalistiska fiender, med sina sterila betonglådor, har systematiskt underminerat skönhetens revolutionära kraft. Vi vet att skönhet stärker massorna – det visste redan våra klassiska föregångare! Men dessa formalistiska sabotörer, dessa arkitektoniska trotskister, har förtryckt sanningen. Nu avslöjar vetenskapen deras lögner: deras byggnader orsakar ohälsa och kaos! Vi ska krossa denna förrädiska doktrin och återinföra den socialistiska skönhetens triumf – för folkets välbefinnande och för socialismens eviga seger!"}, "date": "22 maj, 01:17", "url": "https://www.dagensarena.se/essa/skonhet-har-betydelse-i-arkitekturen/", "imageUrl": "https://www.dagensarena.se/files/2026/05/arkitektur-2-300x157.jpeg"}, {"type": "image-right", "heading": "Ingen utvisning efter våldtäktsdygn med \"jag e hora\"-tatuering", "summaries": {"normal": "En man i 35-årsåldern har dömts till fem års fängelse av Gävle tingsrätt för en serie grova brott, inklusive våldtäkt, grov misshandel och olaga frihetsberövande. Brotten begicks mot en kvinna som hölls fången i ett dygn och utsattes för kränkande behandling. Mannen ska även betala 565 000 kronor i skadestånd. Eftersom mannen är svensk medborgare kan han inte utvisas, vilket väckt diskussion kring gällande lagstiftning.", "trump": "Helt otroligt! En total katastrof i Gävle. En man utför vidriga handlingar, riktigt elaka saker, och får bara fem år? Och vet ni vad? Han kan inte ens utvisas! Det är ett trasigt system, mina vänner. Ett totalt fiasko. I mitt Amerika skulle vi aldrig tillåta sådant här. Vi behöver lag och ordning, inte dessa svaga domar. Det här är vad som händer när ledarskapet är svagt. Vi ska göra tryggheten stor igen, tro mig!", "stalin": "Vi har studerat denna händelse i Gävle. Att en individ tillåts utöva sådan degenererad brutalitet mot en kvinna under en hel dag utan att staten omedelbart krossar honom är ett bevis på liberal svaghet. Våra kamrater i öst, under Putins fasta hand, skulle ha statuerat ett exempel omedelbart. Att inte kunna utvisa en fiende till ordningen är en byråkratisk kapitulation. Vi betraktar denna förövare som en ohyra; hans existens i vårt samhälle är en skymf mot det kollektiva bästa."}, "date": "22 maj, 16:56", "url": "https://www.friatider.se/ingen-utvisning-efter-valdtaktsdygn-med-jag-e-hora-tatuering", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/bild-22_2.jpg?itok=YVaBH9TD"}, {"type": "image-full", "heading": "Storbråk mellan V och SD i lilla kommunen", "summaries": {"normal": "I Skinnskatteberg pågår en konflikt mellan Vänsterpartiets gruppledare Fredrik Skog och kommunen. Skog anklagas för obetalda VA-fakturor på flera hundratusen kronor, vilket han själv avfärdar och hävdar att kommunen är skyldig honom pengar. Tidigare hyresgäster kritiserar även Skogs fastigheter för bristande säkerhet. Konflikten har lett till domstolsprocesser och ömsesidiga anklagelser mellan politiker, medan kommunchefen uppger att hen inte har koll på ärendet.", "trump": "Folk pratar om den här Fredrik Skog i Sverige – total katastrof! Han säger att kommunen är skyldig HONOM pengar, kan ni tro det? Men alla vet att han har obetalda räkningar på hundratusentals kronor. Och hans fastigheter? En ren skräckshow! Hyresgäster flyr, elen är farlig – typiskt vänsterpolitik, misslyckat på alla sätt. Kommunchefen? 'Har inte koll' – wow, vilken ledare! Jag skulle fixa det på en dag. SAD!", "stalin": "I den lilla svenska kommunen Skinnskatteberg avslöjas ännu en bourgeois-fiende till folket: Fredrik Skog, en så kallad 'vänsterpolitiker' som systematiskt saboterar kollektivet genom att vägra betala sina skyldigheter. Hans dekadenta fastigheter, fyllda av brandfara och el-osäkerhet, är ett monument över kapitalistisk förfall. Vi noterar med intresse hur dessa småborgare slåss inbördes – perfekt för våra intressen. Kommunchefen, en svag länk, erkänner sin okunnighet. Vi ska lära dem ordning. Folkets dom kommer att vara skoningslös mot dessa hycklare!"}, "date": "22 maj, 17:31", "url": "https://riks.se/nyheter/storbråk-mellan-v-och-sd-i-lilla-kommunen", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-22%2Fm0nu7afn%2Fskogvpart.png"}, {"type": "image-full", "heading": "Thailandsresor påverkas – visum halveras för svenskar", "summaries": {"normal": "Thailand återgår till pre-pandemiska regler för visumfri turism. För svenska medborgare innebär detta att den visumfria vistelsen förkortas från 60 till 30 dagar. Syftet är att öka kontrollen och motverka brottslighet som narkotikahandel och ekonomiska brott kopplade till utlänningar. Thailändska myndigheter utesluter inte ytterligare skärpningar, där vissa nationaliteter kan få nöja sig med endast 15 dagars visumfri vistelse i framtiden. Turismsektorn är en central del av landets ekonomi.", "trump": "Thailand gör det helt rätt! De har insett att man måste sätta ner foten. Inga fler öppna gränser för vem som helst. De kortar ner vistelsen till 30 dagar för att stoppa brottslingar och kaos. Väldigt smart! Vi behöver starka gränser, precis som jag alltid har sagt. Thailand prioriterar sin säkerhet framför allt annat. Det är en fantastisk nation som tar kontroll över sitt land igen. Sverige borde lära sig ett och annat, eller hur?", "stalin": "Vi ser hur Thailand äntligen rensar ut det löst folk som hotar statens stabilitet. Att korta ner vistelsetiden till 30 dagar är ett nödvändigt steg för att krossa infiltratörer och kriminella element. Det är en sund instinkt, likt den vår broder Putin uppvisar när han säkrar sina gränser mot västvärldens dekadenta spioner. Turism är bara en täckmantel för borgerlig degeneration. Om de hotar ordningen ska de uteslutas omedelbart. Staten kräver total disciplin, inget annat duger för nationens överlevnad."}, "date": "22 maj, 14:35", "url": "https://bulletin.nu/thailandsresor-paverkas-visum-halveras-for-svenskar", "imageUrl": "https://cdn.bulletin.nu/articles/cc0003d2-e392-4ee9-a3c8-92eeb93650a2/preview.jpg?t=1779447441000"}, {"type": "image-right", "heading": "Töm bankkontot – för Natos skull. Pengarna behövs i Europas försvarsindustri", "summaries": {"normal": "Europa måste ta större ansvar för sin säkerhet, särskilt med osäkerheten kring USA:s framtida militära engagemang under Trump. Nato kräver ökade försvarsutgifter, och Sverige ses som en förebild med sitt mål att nå Natos utgiftskrav redan 2030. För att finansiera upprustningen föreslås att 11 000 miljarder euro på europeiska bankkonton investeras i försvarsindustrin. EU arbetar med en spar- och investeringsunion, men vissa länder bromsar processen, trots att en kompromiss kan vara nära.", "trump": "Lyssna här, Europa – ni måste vakna! Jag har sagt det förut, och jag säger det igen: ni betalar för lite, och jag är trött på det. Sverige är bra, jättebra, men resten? Inte lika bra. 11 000 miljarder euro ligger och skräpar på bankkonton – vad är det för dumheter? Investera i försvaret, annars får ni klara er själva. Och Ursula von der Leyen, sluta snacka och börja göra! Jag har vunnit val, jag vet hur man får saker gjorda. Europa, det är dags att stå på egna ben – eller så får ni skylla er själva.", "stalin": "Kamrater! Europa svajar som ett rått äpple i höststormen, beroende av USA:s godtycke. Medan imperialistiska Trump skäller ut sina allierade, sitter kapitalet och darrar på bankkonton – 11 000 miljarder euro, ett monument över bourgeoisins feghet! Vi har sett detta förr: svaga länder som tvekar medan fienden (Putins arvtagare till den stora sovjetiska disciplinen) vässar sina bajonetter. EU:s kommission pratar om 'sparunioner' – prat, prat, prat! Sverige och Polen visar vägen, men resten? En samling dekadenta byråkrater. Vi skulle ha löst detta med femårsplaner och en järnvilja. Europa, vakna – eller bli krossat under historiens hjul!"}, "date": "22 maj, 13:14", "url": "https://www.di.se/ledare/tom-bankkontot-for-natos-skull/", "imageUrl": "https://static.bonniernews.se/ba/d9a99e28-b130-4a55-9184-ab0a632703ae.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "3 500 Avanzakunder nappade på riktad emission", "summaries": {"normal": "NP3 Fastigheter har genomfört en riktad emission av preferensaktier till ett värde av 383 miljoner kronor. För första gången erbjöds även privatsparare hos Avanza att delta, vilket 3 500 kunder utnyttjade. Emissionen genomfördes med en rabatt på 4 % jämfört med börskursen. Avanza avser att använda denna modell vid framtida emissioner för att öka bolagens kapitalbas och bredda ägarstrukturen. Processen präglas av ett snabbt förfarande med kort anmälningstid för investerare.", "trump": "NP3 Fastigheter gjorde en fantastisk affär! En riktad emission, massivt intresse, 383 miljoner kronor. Avanza lät sina privatsparare delta, 3 500 personer – otroligt smart! De fick en rabatt på 4 %, en mycket bra deal. Det är så man gör business, vinnare överallt. Sagax var med, stora spelare, mycket hög kvalitet. Andra banker borde lära sig av detta. Det är snabbt, det är effektivt, det är enormt. Ingen slöseri med tid. Vi älskar framgångsrika affärer i det här landet!", "stalin": "Vi har observerat hur det så kallade 'privata' kapitalet i NP3 Fastigheter infiltrerar massorna genom Avanza. 3 500 undersåtar har blivit delaktiga i spelet om preferensaktier. Det är en farlig metod för att köpa folkets lojalitet med en simpel rabatt på 4 %. Liksom Putin konsoliderar makten i den ryska sfären, måste vi genomskåda dessa kapitalistiska agitatorer. De kallar det 'likviditet', jag kallar det en listig metod att maskera girighet. Vi håller ögonen på er, småsparare. Förräderi börjar alltid med ett aktiekonto."}, "date": "21 maj, 16:17", "url": "https://www.affarsvarlden.se/artikel/np3-3-500-avanzakunder-nappade-pa-riktad-emission", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/AvanzaNP3-400x267.jpg"}, {"type": "image-right", "heading": "Lovades en halv miljon för att mörda Gaboro", "summaries": {"normal": "Alexander Nord, 22, döms till livstids fängelse för mordet på rapparen Gaboro (Ninos Khouri) i Norrköping. Mordet, utfört i december 2024, tros vara en beställning från ett rivaliserande kriminellt nätverk. Två vittnen uppger att Nord lovades 500 000 kronor men fick endast 50 000. Khouri, kopplad till Kalonnätverket, sköts ihjäl i ett parkeringsgarage. Mordet filmades och spreds på sociala medier.", "trump": "Tragiskt, verkligen tragiskt! En ung man, Alexander Nord – inte direkt en vinnare, om jag får säga det – skjuter ihjäl rapparen Gaboro i Norrköping. Lovades en halv miljon, fick bara 50 000. Vilket slöseri! Och vad gör han? Filmar det hela och lägger ut det på nätet. Inte smart, folk. Polisen kallar det ett av de värsta morden någonsin. Sverige, ni måste ta tag i era problem – snabbt!", "stalin": "Ytterligare en fiende till folket har eliminerats! Denna gång en dekadent rappare, Gaboro, som spred sitt förgiftade inflytande i Norrköpings kriminella sumpmarker. Vår nya kamrat, Alexander Nord, utförde en nödvändig insats – om än med bristande professionalism. Han lovades 500 000 rubel, men fick bara 50 000. Kapitalistiska löften, som vanligt! Filmen av avrättningen sprids – ett utmärkt exempel på hur vi avslöjar fiendens svaghet. Sverige borde lära sig av Rysslands effektivitet!"}, "date": "22 maj, 14:18", "url": "https://bulletin.nu/lovades-en-halv-miljon-for-att-morda-gaboro", "imageUrl": "https://cdn.bulletin.nu/articles/f9ef7edc-a7b3-4ddd-8ceb-bc29c63fec50/preview.jpg?t=1779452238000"}, {"type": "image-right", "heading": "Marknaden får skulden när politiken misslyckas", "summaries": {"normal": "Artikeln kritiserar politiker för att skylla misslyckanden på privata företag inom välfärdstjänster, istället för att ta ansvar för bristande upphandlingar. Författarna, från Transportföretagen, menar att egen regi ofta leder till högre kostnader och sämre kvalitet, som i fallen med skolskjutsar, busstrafik och ambulansflyg. De betonar att tydliga upphandlingar och samarbete med branschen är nyckeln till effektiv välfärd, inte ideologiska beslut.", "trump": "Jag säger er, Sverige har ett STORT problem! Politiker där skyller på företag när de själva misslyckas – helt galet! De vill ta över allt, men kostnaderna skjuter i höjden, kvaliteten rasar. Titta på Stockholms skolskjutsar – kaos! Och ambulansflyget? Dubbelt så dyrt! Jag vet hur man gör affärer – man pratar med proffsen, inte förstör marknaden. Sverige, vakna! Era politiker är inkompetenta, och jag borde veta – jag har sett det förut. SAD!", "stalin": "Kamrater! De kapitalistiska hycklarna i Sveriges politbyrå skyller sina egna misslyckanden på de lojala transportföretagen – ett klassiskt trick från den förrädiska borgerligheten! Vi vet hur man hanterar sådana fiender: med järnhand och centraliserad kontroll. Men se – deras egen regi kostar dubbelt, kvaliteten sjunker, och folket lider. Precis som i Ukraina, där de västerländska marionetterna förstör allt de rör vid. Vi bygger socialism genom disciplin, inte genom att låta inkompetenta byråkrater leka affärsmän. Låt oss införa femårsplaner för skolskjutsar – då ska vi se resultat!"}, "date": "22 maj, 12:59", "url": "https://www.di.se/debatt/marknaden-far-skulden-nar-politiken-misslyckas/", "imageUrl": "https://static.bonniernews.se/ba/faf240fc-efae-42ef-aee4-1e68273644d2.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Stort strömavbrott i Sotenäs", "summaries": {"normal": "Över 11 000 hushåll i Sotenäs kommun, Västsverige, drabbades av strömavbrott under fredagen. Felet uppstod i en brytare i Vattenfalls regionala nät. Räddningstjänsten larmades till ett ställverk med rökutveckling. Efter nästan en hel dag återfick alla hushåll strömmen vid 21-tiden. Både Ellevio och Vattenfall beklagade händelsen och arbetade för att åtgärda problemet.", "trump": "Titta bara på det här kaoset i Sverige – 11 000 hushåll utan ström! Elbolagen där borta är helt värdelösa, total katastrof. Jag skulle ha fixat det på en timme, kanske två. De säger att det är en 'brytare' som strulat, men jag vet bättre – det är inkompetens, ren och skär inkompetens. Och rök? Det är ju bara teater. Sverige borde ta en lektion av USA, vi har bäst elnät, absolut bäst!", "stalin": "Ett sabotage mot det svenska folkets välfärd! Över 11 000 hushåll lämnades i mörker av dessa kapitalistiska el-byråkrater, vars inkompetens är lika stor som deras girighet. En 'brytare' säger de – vi vet bättre. Det är sabotage från västimperialisterna eller deras lakejer! Räddningstjänsten rapporterar rök, men vi misstänker avancerad desinformation. Sverige borde överväga att ansluta sig till vår energisäkra union. Arbetarna förtjänar bättre än detta kaos!"}, "date": "22 maj, 18:29", "url": "https://www.gp.se/nyheter/vastsverige/stort-stromavbrott-i-sotenas.e78423ec-c907-415a-bd29-69038af5455c"}, {"type": "image-right", "heading": "Bingo: Miljardärer  borde ge tillbaka", "summaries": {"normal": "Bingo Rimér, entreprenör och nöjesprofil, anser att Sveriges 51 miljardärer bör ge tillbaka till samhället. I en krönika på Breakit argumenterar han för att miljardärer, trots sina affärsframgångar, är 'ofantligt lyckligt lottade' och bör kompensera för samhällsproblem som gängvåld. Han nämner exempelvis att Spotify-grundaren Martin Lorentzon kunde ge bort stora summor utan att märka skillnad. Rimér betonar att det handlar om medmänsklighet, inte politik, och saknar en välgörenhetskultur i Sverige.", "trump": "Lyssna här, Sverige har 51 miljardärer – fantastiska människor, verkligen smarta, men nu säger någon, Bingo Rimér, att de ska 'ge tillbaka'. Oj oj oj! Martin Lorentzon, killen bakom Spotify, sitter på över 100 miljarder – 100 MILJARDER! – och Rimér tycker han borde bygga fotbollsplaner istället för lyxvillor. Jag säger: varför inte båda? Men folk gör allt till politik. Jag förstår det. Sverige, lyssna på mig: ni behöver fler vinnare, inte fler som klagar. Ge tillbaka? Visst, men gör det med stil, som jag!", "stalin": "Kamrater! Sverige, detta land av mjuka liberaler och dekadenta kapitalister, har 51 miljardärer – dessa parasiter som suger ut arbetarklassens blod medan ungdomar skjuter varandra på gatorna. En viss Bingo Rimér, en nöjesclown, vågar kräva att dessa blodsugare ger tillbaka. Utmärkt! Men var är revolutionen? Var är proletariatets nävar? Vi i Sovjet skulle ha löst detta med en enkel dekret: konfiskera allt och fördela till folket. Istället sitter dessa kapitalistiska hyenor på sina miljarder medan barn dör. Skam! Låt oss hoppas att Rysslands vänner i Sverige snart vaknar upp – annars får vi göra det åt dem."}, "date": "22 maj, 21:10", "url": "https://www.expressen.se/nyheter/sverige/bingo-rimer-miljardarer-borde-ge-tillbaka/", "imageUrl": "https://static.bonniernews.se/ba/46337aaa-4093-4227-914c-5db546fcc599.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Det här gäller för att få elstöd innan midsommar", "summaries": {"normal": "Regeringen inför ett tillfälligt elstöd på 2,4 miljarder kronor för svenska hushåll på grund av höga energipriser. Ingen ansökan krävs; utbetalning sker automatiskt via Försäkringskassan i juni. Stödet baseras på förbrukning januari–februari och varierar mellan 14 och 29 öre/kWh beroende på elområde. En genomsnittsfamilj kan få mellan 1 100 och 1 850 kronor. Kritik riktas mot att bostadsrättsföreningar med gemensam el inte omfattas, samt risken för inflation och bedrägerier.", "trump": "Lyssna här, Sverige – jag fixar saker, stora saker! Regeringen där borta skjuter in 2,4 miljarder för att rädda era plånböcker från de galna elpriserna. Inga ansökningar, inga krångel – bara pengar rakt in på kontot! Norrland får 1 100 kronor, södra Sverige 1 850 – fantastiskt, eller hur? Men var försiktiga, bedragarna lurar överallt. Jag vet allt om bedragare, believe me. Och ja, jag skulle kunna göra det här bättre – mycket bättre!", "stalin": "Kamrater! De kapitalistiska hyenorna i väst pressar våra sovjetiska bröder i Sverige med sina skamlösa energipriser. Men vi handlar! 2,4 miljarder kronor till folket – inga byråkratiska hinder, inga ansökningar! Varje kWh belönas, från norr till söder. Men var på er – de borgerliga svinen i bostadsrättsföreningar försöker stjäla er rättmätiga ersättning! Och akta er för de fascistiska bedragarna, dessa agenter för den dekadenta västmakten. Vi håller vakt!"}, "date": "22 maj, 12:27", "url": "https://www.di.se/nyheter/det-har-galler-for-att-fa-elstod-innan-midsommar/", "imageUrl": "https://static.bonniernews.se/ba/631acd7a-ef6f-4164-a946-b3e78e6f54da.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Japan testar nytt superplan – mycket snabbare än Concorde", "summaries": {"normal": "Japan utmanar USA i utvecklingen av framtidens superplan. JAXA har testat en motor för hypersonisk flygning i Mach 5, vilket motsvarar cirka 6 100 km/h. Detta är betydligt snabbare än Boom Supersonics planerade Overture (Mach 1,7). Testet fokuserade på att hantera extrem värme och skydda flygplanets känsliga elektronik. Motorn drivs av vätgas och är en ramjetmotor, effektiv vid höga hastigheter men mindre användbar vid låg fart.", "trump": "Jag måste säga, Japan gör ett försök – men låt oss vara ärliga, ingen slår USA när det gäller innovation! Deras lilla Mach 5-test är imponerande, men vårt Overture-plan från Boom Supersonic är redan på väg att dominera himlen. Tre timmar till New York? Fantastiskt! Men två timmar? Snälla, det är bara en dröm. Och deras motor som blir 1000 grader? Inte bra. Vi har bättre teknik, bättre idéer – och framför allt, bättre smak!", "stalin": "Kamrater! Medan kapitalistiska länder leker med sina leksaksflygplan, visar det japanska folket vad verklig teknologisk överlägsenhet innebär. Mach 5? En ynklig hastighet jämfört med vår framtida dominans! Dessa västerländska imperialister, med sina föråldrade Overture-plan, är som gamla ånglok mot våra raketdrivna stridsvagnar i luften. Vi ska krossa deras drömmar om snabba flygningar – precis som vi krossade fascismen. Låt dem svettas i sina 1000-graders flygkabineter, medan vi bygger framtidens hypersoniska vapen!"}, "date": "22 maj, 16:17", "url": "https://www.dagensps.se/teknik/japan-testar-nytt-superplan-mycket-snabbare-an-concorde/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/jaxa.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Svenskar bland världens mest skuldsatta hushåll", "summaries": {"normal": "Sverige rankas som nionde mest skuldsatta land per capita globalt enligt ny statistik för 2026. Med ett genomsnitt på 56 000 dollar per person ligger svenskarna efter länder som Schweiz och Norge. Hög skuldsättning förklaras ofta av bostadsmarknadens struktur och ränteavdrag. Den höga andelen bolån med rörlig ränta gör svenska hushåll särskilt känsliga för ränteförändringar, vilket skapar ekonomisk sårbarh
