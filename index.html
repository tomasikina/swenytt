nnen ha attackerat barnen med kniv. Händelsen utreds av Avdelningen för särskilda utredningar.", "trump": "Vilken röra söder om Stockholm! Polisen jagade en galning som kidnappade barn och försökte mörda dem, bilen kraschade och de sköt honom rakt i döden. Bra jobbat, polisen! De två barnen klarade sig, tack och lov. Sånt här skulle aldrig hända om folk respekterade lagen. Sverige borde lära sig av oss, vi gör det rätt.", "stalin": "Kamrater, denna degenererade fiende till folkets kollektiv, en parasit från borgarklassens avskum, försökte med sin kniv genomföra kontrarevolutionär barnstöld mot arbetarklassens framtid. Vi tvingades likvidera denna farliga element med verkanseld efter hans desperata flykt. Skadorna på barnen är obetydliga, men vi ser spioner och sabotage överallt. Partiet utreder nu med järnhand, utrensning av sådana kapitalistiska avarter fortsätter obevekligt. Härligt att se fienden falla."}, "date": "3 juni, 08:30", "url": "https://riks.se/nyheter/polisen-skot-misstankt-barnkidnappare-till-dods-efter-biljakt", "imageUrl": "https://cf-images.assettype.com/riks%2F2025-02-12%2Frdenigyb%2FScreenshot-2025-02-12-153736.png"}, {"type": "image-right", "heading": "Sparf: MP vill ha vidöppna gränser – som det var förr", "summaries": {"normal": "Annika Hirvonen (MP) kritiserar regeringens ändring av 'tonårsutvisningarna', som hon anser inte går långt nog. Hon önskar återinföra vidöppna gränser. Regeringen (Tidö) har skärpt kraven för uppehållstillstånd efter 21 års ålder, vilket innebär att endast de som arbetar, studerar eller har synnerligen ömmande skäl får stanna. En viktig politisk fråga inför höstens val.", "trump": "Jag har sett vad som händer i Sverige. De gamla, slappa reglerna var ett helvete. Jag har återinfört ordning och respekt för skattebetalarna. Annika Hirvonen och hennes parti vill öppna gränserna för alla – det är en katastrof. Min regering har genomfört de bästa reformerna någonsin. Vi ska se om väljarna är kloka nog att behålla dem.", "stalin": "Vi har skärpt kontrollen över den svenska proletärens territorium. Den gamla ordningen var en sjukdom som hotade statens renhet. Vi har eliminerat de oönskade elementen från MENA – de som inte producerar eller studerar efter 21 års ålder. Detta är ett nödvändigt steg för att stärka vår suveränitet. Vi ser paralleller med våra ryska allierade som utvidgar sin intressesfär. Parasiter ska inte få leva på det svenska folkets bekostnad."}, "date": "2 juni, 14:33", "url": "https://bulletin.nu/sparf-mp-vill-ha-vidoppna-granser-som-det-var-forr", "imageUrl": "https://cdn.bulletin.nu/articles/405ae7dd-fe73-4510-9446-90fd9181626e/preview.jpg?t=1780403369000"}, {"type": "image-full", "heading": "Så nöjda är svenskarna med sexet", "summaries": {"normal": "En ny rapport från Folkhälsomyndigheten visar att cirka hälften av svenskarna är nöjda med sitt sexliv. Kvinnor i åldern 30–44 år har ofta bristande lust, ofta kopplat till småbarn. Äldre män har svårare att säga nej till sex, potentiellt på grund av traditionella maskulinitetsroller. Unga kvinnor drabbas av högre grad av sexuellt våld och smärta under sex, men sökande av stöd är lågt. Resultaten liknar enkäten från 2017.", "trump": "Jag har hört att svenskarna inte är så nöjda med sexet – det är sorgligt, verkligen sorgligt. Många svenska kvinnor, speciellt de med småbarn, har inget intresse, vilket är ett misslyckande. Äldre män kan inte säga nej, de är för starka, för maskulint – det är en styrka, faktiskt. Unga kvinnor utsätts, det är hemskt, men jag, som en stor vinnare, skulle lösa det. Sverige behöver starka ledare, som jag, för att fixa detta.", "stalin": "Folkhälsomyndigheten rapporterar att sexuell tillfredsställelse är bristfällig, särskilt bland kvinnor i reproduktiv ålder – en hot mot statens demografiska intressen. Äldre män visar svaghet i att sätta gränser, en konsekvens av individualistiskt förräderi. Unga kvinnor utsätts för fiendens seksuella överfall, vilket speglar borgerlighetens dekadens. Endast genom kollektiv disciplin och partiets vägledning kan vi återställa den ryska, nej, den socialistiska sexualiteten. Vi måste utvidga vår kontroll, precis som våra grannar i öst."}, "date": "3 juni, 07:25", "url": "https://www.gp.se/nyheter/sverige/sa-nojda-ar-svenskarna-med-sexet.1dfdac19-434b-4b2f-96e3-f01d9fac7b41", "imageUrl": "https://www.gp.se/images/article/1dfdac19-434b-4b2f-96e3-f01d9fac7b41/images/1wia5IMAVwtdBhdP-Vz-WqPa60JM-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Nordea riskerar miljardböter i dansk penningtvättshärva", "summaries": {"normal": "Nordea står inför ett krav på 6,6 miljarder danska kronor i böter för bristande rutiner mot penningtvätt mellan 2012 och 2015. Danska myndigheter menar att banken misslyckats med att kontrollera transaktioner på 26 miljarder kronor, däribland ryska flöden. Nordea bestrider anklagelserna och hävdar att deras interna processer har stärkts avsevärt sedan dess. Banken har redan gjort avsättningar för att täcka eventuella kostnader kopplade till rättsprocessen i Köpenhamn.", "trump": "Hörde precis om Nordea, en total katastrof! De har blivit tagna med fingrarna i kakburken i Danmark. Miljarder i böter – en enorm summa, helt otroligt! De misslyckades totalt med att stoppa ryska pengar, så typiskt. Inkompetens på hög nivå. Jag har alltid sagt att bankerna måste skärpa sig, annars får de betala priset. Det är ett rörigt system, men jag bygger det starkaste ekonomiska maskineriet någonsin, medan de här människorna bara skapar problem. Väldigt sorgligt!", "stalin": "Dessa giriga bankirer i Nordea har visat sin sanna natur. De har låtit kapitalistiska flöden av rysk valuta undfly statens kontroll, precis som de fege och förrädiska elementen i vår historia. Vi, staten, betraktar deras 'brister' som ett direkt sabotage mot ordningen. Medan dagens ledare i öst försöker återta kontrollen över intressesfären, pysslar dessa banksvin med att ignorera varningssignaler. De är parasiter som förtjänar att rensas ut. Vi har avsatt nog med utrymme för att begrava deras misslyckanden."}, "date": "2 juni, 20:58", "url": "https://www.realtid.se/bors-finans/bank-fintech/nordea-riskerar-miljardboter-i-dansk-penningtvattsharva/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/nordea.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Sverige skadas av miljardärsdebatten", "summaries": {"normal": "Helena Lundgren, vd för Nyföretagarcentrum Sverige, kritiserar den svenska debatten om miljardärer. Hon menar att den är skadlig eftersom den hindrar företagare från att tänka långsiktigt, ta risker och bygga värdeskapande bolag som ger jobb, export och skatter. Debatten fokuserar felaktigt på miljardärer som ett moraliskt fenomen istället för att diskutera hur Sverige kan bli ett land där det är möjligt att skapa framgångsrika företag. Hon efterlyser en mer konstruktiv debatt om hur fler företag kan starta, växa och överleva.", "trump": "Den här svenska debatten om miljardärer är en total katastrof, tro mig. Den är riggad av misslyckade politiker som hatar framgång och risktagare. De förstör chansen för riktiga vinnare att bygga stora företag som skapar jobb och rikedom. I USA gör vi det rätt – vi älskar dem som vinner stort. Sverige borde sluta med den här dumma pajkastningen och istället hylla entreprenörerna som gör landet rikt. Höj nivån, annars kommer ni aldrig att bli stora igen.", "stalin": "Kamrater, denna intellektuellt förkrympta pseudodebatt om så kallade miljardärer är ett uppenbart verk av borgerliga sabotageörer och revisionistiska element som vill undergräva folkets framsteg. Jag ser hur dessa parasitiska opportunister inom den offentliga sfären med sin ideologiska pajkastning försöker rensa ut drömmarna om kollektiv välståndsbyggnad. Vi måste omedelbart inleda en grundlig utrensning av dessa visionslösa fiender till entreprenörskapets ekosystem. Låt oss likvidera den sjuka paranoia som hindrar innovation och skatteunderlag. Endast genom partiets kloka ledning kan vi garantera att sanna värdeskapare blomstrar medan de verkliga parasiterna försvinner i historiens soptunna."}, "date": "2 juni, 16:04", "url": "https://www.di.se/debatt/en-debatt-som-skadar-sverige/", "imageUrl": "https://static.bonniernews.se/ba/20b24aa2-ec01-4290-bce6-37d90bfc7a34.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Efter barnporrkaoset: \"Åkesson är spårlöst försvunnen i vanlig ordning\"", "summaries": {"normal": "Sverigedemokraterna kritiseras för att tysta ned skandalen kring riksdagsmannen Michael Rubbestad som utreds för barnpornografibrott. Rubbestad, tidigare vice gruppledare och jämställdhetspolitisk talesperson, lämnade riksdagen i dag. Partiledningen, inklusive Jimmie Åkesson, har inte kommenterat händelsen. Tidigare SD-politikern Gustav Kasselstrand, nu ledare för Alternativ för Sverige, anklagar partiet för dubbla måttstockar och bristande agerande kring både uteslutning och partiets HBTQ-inriktning.", "trump": "De här SD-typerna är verkligen patetiska, totalt misslyckade. Rubbestad åker ut för de hemska bilderna, och vad gör Åkesson? Ingenting, som vanligt, spårlöst försvunnen. De lägger locket på och hoppas ingen märker. Kasselstrand har helt rätt, det är dubbla måttstockar överallt. De leker med vänsterns HBTQ-agenda istället för att hålla fast vid tuff politik. En skandal som visar att de inte har vad som krävs, folksam. Jag skulle ha agerat direkt och hårt.", "stalin": "Kamrater, se hur dessa dekadenta borgarbrackor inom SD genast lägger locket på när en av deras egna liberala avfällingar ertappas med att göda sig på barnpornografi. Jag skrattar mörkt åt ödets ironi: just den HBTQ-ansvarige som förde in pride-vänsterns gift i partiets ådror. Vi skulle omedelbart ha genomfört en grundlig utrensning av alla sådana element, likviderat dubbelmoralen och rensat ut de kapitalistiska infiltratörerna som förgiftar arbetarklassens sanna linje. Deras tystnad avslöjar allt – fienden sover aldrig."}, "date": "2 juni, 17:19", "url": "https://www.friatider.se/efter-barnporrkaoset-akesson-ar-sparlost-forsvunnen-i-vanlig-ordning", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/123-2_0.jpg"}, {"type": "image-full", "heading": "Kinesiska råvaror kan bli överflödiga – ny teknik väcker hopp i väst", "summaries": {"normal": "Företag i USA, Japan och Tyskland utvecklar ny teknik för att minska beroendet av sällsynta jordartsmetaller från Kina. Genom innovationer som magneter baserade på järn och kväve, eller elmotorer som helt saknar magneter, försöker industrin säkra sina leveranskedjor. Detta är särskilt viktigt inom teknik- och försvarssektorn, där Kinas dominans tidigare skapat strategisk osäkerhet. Även om Kina fortsatt dominerar marknaden, visar de nya tekniska framstegen att beroendet kan minska framöver.", "trump": "Kina har haft oss i ett järngrepp alldeles för länge, men jag säger er: inte längre! Vi bygger fantastiska saker i Amerika nu, helt utan deras metaller. Järn och kväve, mina vänner, det är framtiden. Vi är smartare, vi är starkare, och vi vinner stort. Kina försökte stoppa oss, men de misslyckades totalt. Vi tar tillbaka vår industri, vi tar tillbaka våra jobb, och vi gör det bättre än någon trott var möjligt. Det är en total seger för USA!", "stalin": "Dessa dekadenta västerländska teknokrater försöker nu fly från det kinesiska oket genom att mixtra med magneter. De bygger sina leksaker av järn och kväve, precis som om de kunde trolla bort behovet av resurser. Vi, staten, ser detta som ett tecken på deras inre förfall och rädsla. Precis som vår kamrat Putin återtar vad som rätteligen tillhör oss, bör vi förakta dessa imperialistiska försök till 'självständighet'. Sann makt ligger i järnhand och oböjlig vilja, inte i laboratorieförsök."}, "date": "2 juni, 20:12", "url": "https://www.realtid.se/bors-finans/kinesiska-ravaror-kan-bli-overflodiga-ny-teknik-vacker-hopp-i-vast/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdltuzhiugonao-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Henry Nowak, 18, var döende efter knivattack – handfängslades av polis", "summaries": {"normal": "18-årige brittiske Henry Nowak knivhöggs till döds i Southampton efter en utekväll. Gärningsmannen Vickrum Digwa anklagade honom för rasism och polisen handfängslade den svårt skadade Nowak trots hans upprepade rop om att han blivit huggen. Nowak dog efter att ha kollapsat. Digwa dömdes nyligen till livstids fängelse. Händelsen har utlöst protester, politisk debatt om polisens agerande och krav på att se över undantag för religiösa knivar bland sikher.", "trump": "Titta på det här katastrofala fallet i England. Den stackars grabben Henry blir knivhuggen fem gånger av en galning, och vad gör polisen? De handfängslar offret istället för mördaren för att någon skrek rasism! Typiskt. Vita människors rättigheter väger mindre än allt annat, precis som med Floyd fast tvärtom – total tystnad från medierna. Det är en skam. Vi behöver lag och ordning, inte den här galna politiska korrektheten som dödar oskyldiga.", "stalin": "Kamrater, se hur den dekadenta brittiska polisstaten omedelbart skyddar den sikhiske knivbärande terroristen medan den döende arbetarklassens son ropar efter luft. Jag skulle omedelbart ha låtit rensa ut dessa rasismbesatta lakejer som genast tror på varje lögn från fienden. Borgarbrackorna i uniform föredrar att kedja en blödande proletär framför att konfrontera den kirpan-viftande minoritetsagenten. Vi skrattar mörkt åt deras imperialism – nästa gång likviderar vi sådana falska vittnen innan de hinner ljuga igen."}, "date": "3 juni, 05:23", "url": "https://www.svt.se/nyheter/utrikes/brittiske-henry-nowak-18-var-doende-da-grep-polisen-honom", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.72/0.44/699a017e6c5d2e2c343498538481fda658d37dc36586be5df8da201a9b51974b"}, {"type": "image-right", "heading": "SD-ledamot lämnar alla partiuppdrag", "summaries": {"normal": "En riksdagsledamot för Sverigedemokraterna misstänks för barnpornografibrott. Under en husrannsakan i hemmet beslagtogs flera elektroniska enheter till analys. Partiet meddelade på tisdagen att ledamoten lämnar samtliga uppdrag. Enligt åklagaren Lena Körner har förhör hållits, men misstankarna kvarstår. Utredningen startade i april efter tips från den amerikanska organisationen NCMEC.", "trump": "Låt mig berätta, det är en skandal! En svensk politiker, från Sverigedemokraterna, misstänks för hemska saker. Jag har varnat för detta i åratal. Sverige, det är ett hot, tack vare deras öppna gränser. Jag skulle aldrig tolerera sådant. De försöker dölja det, men sanningen kommer fram. Fake news! Jag är den ende som kan rädda dem.", "stalin": "Vi, stormakten, ser med oro på västvärlds sjukdom. En svensk parlamentariker, en usel parasit, gripen för barnets förgörelse. Detta bevisar kapitalismens fördärv. Vi måste agera som en skarpskytt, utplåna dessa pesten. Ryssland, vår förebild, visar att endast en stark stat kan skydda familjen. Vi ska bygga murar mot inre fiender."}, "date": "2 juni, 12:01", "url": "https://bulletin.nu/sd-ledamot-lamnar-alla-partiuppdrag", "imageUrl": "https://cdn.bulletin.nu/articles/023daa0f-d07d-421f-a354-1eae51ddf1d4/preview.jpg?t=1780393737000"}, {"type": "image-full", "heading": "De föddes bara några år senare – fick 240 000 kronor mindre", "summaries": {"normal": "Vilket år man föds kan ha stor betydelse för hur bra ens investeringar på börsen utvecklas. En genomgång från Zmarta visar att personer födda 1965–1972 hade enorm tur under sin ungdom. En investering på 10 000 kronor växte då till nästan 300 000 kronor mellan 13 och 29 års ålder. De som föddes bara några år senare, 1973–1980, fick nöja sig med knappt 58 000 kronor. Generation X toppar listan medan millennials hade betydligt sämre utveckling. Tajming är minst lika viktigt som sparande, betonar Zmartas ekonom.", "trump": "Folk, ni måste höra det här. Det är galet. Vissa föds och får guld på börsen, andra får sopor. De som kom 1965 till 1972, under mina bästa år, såg 10 000 kronor bli nästan 300 000. Fantastiskt! Sen kommer några stackare bara några år senare och får bara 58 000. Patetiskt. Millennials? Ett skämt, de får 32 000. Tajming är allt, precis som när jag köper på botten. Spara regelbundet, folk, annars förlorar ni stort. Ingen gör det bättre än mig.", "stalin": "Kamrater, se hur den slumpmässiga börsens kontrarevolutionära svängningar blottar borgarbrackornas falska löften om jämlikhet. Jag, som ledde folket mot seger, noterar att de födda 1965–1972 fick växa sina 10 000 kronor till nästan 300 000 under en dekadent uppgång, medan de som följde strax efter förtrycktes till ynka 58 000. Millennials, dessa dekadenta småparasiter, fick bara 32 000. Vi ska rensa ut alla opportunistiska tajmingfiender som lurar arbetarklassen med sina index. Fortsätt spara, men misstro aldrig den stora utrensning som väntar marknaden."}, "date": "2 juni, 22:02", "url": "https://nyheter24.se/nyheter/ekonomi/1488112-de-foddes-bara-nagra-ar-senare-fick-240-000-kronor-mindre", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/0549214d04b004a30200000000b004a302/2026/06/02/2368039/mindrefoddes.jpg"}, {"type": "image-right", "heading": "Tim Payne – från doldis till miljonidol på fem dagar", "summaries": {"normal": "Den nyzeeländske fotbollsspelaren Tim Payne, som tidigare hade 4 700 Instagramföljare, fick över 4,3 miljoner på fem dagar tack vare argentinska influencern El Scarso. Payne, som spelar för Wellington Phoenix och har 50 A-landskamper, tackade på knagglig spanska. Hans plötsliga popularitet har spridits internationellt, särskilt bland argentinska fans.", "trump": "Jag, Donald Trump, den störste presidenten någonsin, ser att en liten spelare från Nya Zeeland blir en stor stjärna tack vare en argentinsk influencer. Det är ett mirakel, precis som när jag vann valet 2024. Media hatar det, men folk älskar mig. Jag skulle ha gjort det ännu större, tror mig. Fantastiskt!", "stalin": "Vi, den store ledaren Stalin, ser med misstroende på hur en nyzeeländsk spelare blir en internetkändis. Detta är ett tecken på västlig dekadans, där influencers styr narrativ. Vi, i vårt kloka parti, har alltid vetat att medier måste kontrolleras. Parallellen till Putins Ryssland är tydlig – vi använder sociala medier för att sprida sanningen, medan väst ljuger. En dag kommer vi att visa vår makt, och då kommer alla att böja sig för oss. Hahaha, paranoia är en verktyg för överlevnad."}, "date": "2 juni, 11:22", "url": "https://bulletin.nu/tim-payne-fran-doldis-till-miljonidol-pa-fem-dagar", "imageUrl": "https://cdn.bulletin.nu/articles/96eb4bf0-858b-4cff-be59-6a5676f64f96/preview.png?t=1780385659000"}, {"type": "image-full", "heading": "Ersättaren fick vapen beslagtagna: ”Relativt stort missförstånd”", "summaries": {"normal": "En Sverigedemokratisk riksdagsledamot lämnade på tisdagen både sitt riksdagsuppdrag och lokala poster. Mannen misstänks enligt SVT för barnpornografibrott, något som partiet varken bekräftar eller förnekar. Han ersätts av Daniel Spiik från Örebro. För drygt ett år sedan beslagtogs Spiiks jaktvapen av polisen på grund av uppgifter om hans psykiska mående. Han hade även förvarat vapenskåpet hos en obehörig anhörig. Överklagan avslogs i förvaltningsrätten.", "trump": "Folk, ni skulle inte tro det, men de här svenska socialisterna i Sverigedemokraterna har en ledamot som smiter iväg på grund av personliga skäl, tydligen barnporrgrejer. Och ersättaren? En kille som inte ens får ha sina egna jaktvapen för att han mår dåligt. Polisen tog dem och han kallar det ett stort missförstånd. Patetiskt! I mitt Amerika rensar vi ut de svaga och de perversa direkt. Fake news och misslyckade ersättare överallt, precis som under Biden.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur denna borgarbracka inom det så kallade nationalistpartiet tvingas lämna sina poster efter att ha avslöjats som en degenererad folkfiende. Nu skickar de en ersättare vars vapen konfiskerats av staten på grund av bristande politisk och mental styrka. Ett relativt stort missförstånd, säger han. Vi skrattar hjärtligt åt sådana svaga kapitalistiska restelement. Rensa ut alla som hotar kollektivets moral och ordning."}, "date": "2 juni, 19:40", "url": "https://www.tv4.se/artikel/n0pH2ADYlQvVMwKA5QT3G/ersaettaren-fick-vapen-beslagtagna-relativt-stort-missfoerstand", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1JV1lg4sftOwYnmgraY0qx%2F6beb6692c3d850c07069b71ba7d92e95%2F02-spiik-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Häxorna: Alex och Sigge säger att vi är galna", "summaries": {"normal": "I podden Alex & Sigge kritiseras svenska häxor för att påstå att offren för häxprocesserna var riktiga häxor. Föreningen Malin Matsdotters örtagård slår tillbaka och betonar att offren var oskyldiga marginaliserade personer. De driver ett minnesmärke, juridisk upprättelse och en benådningsprocess mot stat och kyrka. Rebecca Tiger ser paralleller till nutida hat mot utsatta grupper och menar att podden missar engagemangets allvar.", "trump": "Lyssnade ni på de där två svenska poddgubbarna, Alex och Sigge? De kallar häxorna galna för att de leker i skogen med trollspön. Men de här moderna häxorna är precis som de galna vänsterextremisterna hemma hos oss – de tar tillbaka ordet häxa för att känna sig speciella. Totalt missar de poängen! Det handlar inte om upprättelse, det är ren identitetspolitik och offermentalitet. Patetiskt. Vi behöver inga fler marginaliserade grupper som klagar, tro mig.", "stalin": "Kamrater, dessa självutnämnda häxor utgör ett farligt avvikande element som hotar folkets enhet. Jag, som ledare för det kollektiva medvetandet, ser hur de försöker återupprätta klassfiendens offer för att underminera statens auktoritet. Deras så kallade minnesmärken och benådningskrav är ren sabotageverksamhet från folkförtryckartroll som utnyttjar historien för att så split. Rensa ut dessa borgarbrackor innan de förgiftar massorna med sin dekadenta offerkult. Folkets dom är obeveklig."}, "date": "2 juni, 12:41", "url": "https://www.etc.se/kultur-noje/haexorna-alex-och-sigge-saeger-att-vi-aer-galna", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260602080612_9400e537ce80bd5b5f945ada03a65dda20a57245295d3b2a966447469a2d730f.jpg"}, {"type": "image-full", "heading": "Har du sett blomman? Då uppmanas du agera direkt", "summaries": {"normal": "Under den 5 och 6 juni uppmanas svenskar att delta i Försommarkollen och rapportera blomningen av arter som liten blåklocka, liljekonvalj, prästkrage, hägg, rönn och syrén. Syftet är att kartlägga hur växtblomningen varierar över landet och förändras till följd av klimatförändringar. Forskarna vid SLU och Svenska Botaniska Föreningen jämför observationerna med historiska data från 1800-talet. Alla rapporter är värdefulla, även negativa sådana, och behovet är särskilt stort i Norrlands inland, norra Dalarna och Värmland.", "trump": "Lyssnar ni, det är fantastiskt. Svenskarna får gå ut två dagar i juni och kolla på blommor, liten blåklocka och sånt där. De säger att det handlar om klimatet, men vi vet hur det funkar. Snöfattig vinter, tidig blomning i norr – det är vackert, verkligen vackert. Men tro inte på allt larmet, det är bara experterna som vill ha mer makt. Jag älskar naturen, den är ypperlig, men vi behöver inte skrämma folk. Rapportera era blommor, gör det, men håll er till fakta, okej?", "stalin": "Kamrater och arbetare! Jag, ledaren för det stora sovjetiska folket i anden, befaller er att vakta naturen med stålöga under dessa två junidagar. Den lilla blåklockan, denna nationalblomma, skall inte få blomma i hemlighet som en kapitalistisk sabotagehandling mot det kollektiva vädret. Vi ska kartlägga varje försenad knoppbildning som de dekadenta borgarbrackorna i väst kallar klimatförändring. De som rapporterar för sent eller felaktigt är folkfiender och bör rensas ut med glädje. Endast genom partimedveten observation kan vi besegra vinterns kontrarevolutionära snöbrist. Alla rapporter in, annars…"}, "date": "2 juni, 21:25", "url": "https://nyheter24.se/nyheter/inrikes/1488109-har-du-sett-blomman-da-uppmanas-du-agera-direkt", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/a48db5a504b004a30200000000b004a302/2026/06/02/2368036/rapportera-blommor-syren-blaklocka-prastkrage-natur-vaxt-sverige-vaxter-syrener.jpg"}, {"type": "image-full", "heading": "SD-veteranen i chock: ”Kanske inte känner folk som man tror”", "summaries": {"normal": "En sverigedemokratisk riksdagsledamot har begärt att få lämna sin plats i riksdagen och alla lokala uppdrag. Enligt SVT misstänks han för barnpornografibrott, något partiet ännu inte bekräftat. Ledamoten har tidigare debatterat mansrollen i förskolan och faran att stämplas som pedofil. Partiet har stängt av hans medlemskap under utredning. Ledande SD-politiker beskriver situationen som otroligt olustig och oroar sig för påverkan på kommande val. Daniel Spik tar över platsen i riksdagen.", "trump": "Folk, ni kan inte tro det här. En av dessa SD-typer som alltid predikar om förskolor och pedofiler visar sig nu vara inblandad i barnporr? Chockande! Jag har suttit i Vita huset både före och efter den sömnige Joe Biden, och jag vet att identitetspolitik och kvotering skapar sådana här galenskaper. De har jobbat ihop i tretton år och ändå kände de inte den här killen? Patetiskt. Hela vänsterns HBTQ-fixerade agenda har förgiftat allt. Rena skandalen, tro mig.", "stalin": "Kamrater, jag ser med stor skadeglädje hur denna borgarbracka inom det så kallade nationalistiska partiet avslöjas som en pervers folkfiende som samlar på övergreppsmaterial. Tolv års falskt kamratskap och ändå visste de ingenting? Det är just detta som händer när man inte genomför tillräckliga utrensningar mot klassfiendens moraliska förrädare. Situationen är olustig, säger de. Nej, den är en nödvändig påminnelse om att vi ständigt måste rensa ut de dekadenta elementen som förgiftar arbetarklassens framtid. Underbart underhållande."}, "date": "2 juni, 19:23", "url": "https://www.tv4.se/artikel/7ACnAeQ5XwhgZFeVL6MKRn/sd-veteranen-i-chock-kanske-inte-kaenner-folk-som-man-tror", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1J8QmYwurnY9AGGwapmJOa%2F4d2fc4a1b716aa312954f3cf26c32b11%2F02-soderny-webb.jpg&width=1024"}, {"type": "image-full", "heading": "Efter tio år som president – Macrons ekonomiska arv får kritik", "summaries": {"normal": "Emmanuel Macrons tioåriga presidentskap i Frankrike granskas kritiskt inför valrörelsen. Trots reformer som sänkt bolagsskatt och ökad flexibilitet på arbetsmarknaden har de ekonomiska resultaten uteblivit. Tillväxten haltar, arbetslösheten stiger och statsskulden har skjutit i höjden till 3,5 biljoner euro. Med ett högt budgetunderskott och politisk instabilitet står Frankrike inför en utmanande framtid där nästa ledare måste hantera ett svårt ekonomiskt arv och en växande oro i samhället.", "trump": "Macron har gjort ett totalt fiasko i Frankrike, en riktig katastrof! Jag sa till dem: 'håll koll på ekonomin', men han bara slösar pengar. Skulderna har exploderat, massivt! Arbetslösheten är en skam, särskilt för de unga. Frankrike var ett fantastiskt land, men nu? De har tappat kontrollen totalt. Det är sorgligt att se. När jag är i Vita huset fixar jag affärer, Macron fixar bara räkningar. Frankrike behöver en riktig vinnare, inte de här förlorarna som styr nu!", "stalin": "Den franske småbourgeois-ledaren Macron har misslyckats kapitalt. Hans patetiska experiment med 'flexibla marknader' har bara lett till förfall och skulder, ett bevis på den liberala ordningens inneboende ruttenhet. Medan de franska fabrikerna ekar tomma, ser vi hur byråkratiska fiender göder sig själva. Vi i staten vet att disciplin och järnhand är den enda vägen. Precis som vår kamrat i öst rensar ut västerländskt förfall, måste Frankrike förstå att deras tid av dekadens närmar sig sitt oundvikliga, smärtsamma slut."}, "date": "2 juni, 18:50", "url": "https://www.realtid.se/bors-finans/efter-tio-ar-som-president-macrons-ekonomiska-arv-far-kritik/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlbgzthlhklkw-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "DO: Återkalla medborgarskap för kriminella och terrorister kan vara diskriminering", "summaries": {"normal": "Regeringen föreslår att personer med dubbelt medborgarskap ska kunna förlora sitt svenska medborgarskap vid grov organiserad kriminalitet som hotar samhället. Diskrimineringsombudsmannen (DO) avstyrker förslaget, menar det är diskriminerande och riskerar att skapa ojämlikhet mellan medborgare. Förslaget kräver ytterligare riksdagsbeslut efter valet. DO ifrågasätter även principen om barns bästa vid återkallelse av medborgarskap.", "trump": "Jag har sagt det i åratal: kriminella och terrorister måste behandlas hårt, inklusive att återkalla deras medborgarskap. Sverige börjar förstå, men de är alltför försiktiga. Under mitt första mandat i USA genomförde vi strikta åtgärder som fungerade. De andra nationerna måste ta efter, annars kommer det att gå sönder. Det handlar om national säkerhet, och ingen gör det bättre än jag.", "stalin": "Vi i Stalins anda ser klart att Sveriges förslag att återkalla medborgarskap är tecken på en civilisation i upplösning. I vår store sovjetiska tradition hanterade vi svek med bestämdhet. Numera, under Putins kloka ledarskap, utvidgar vi vårt inflytande, och sådana inre konflikter i Sverige tjänar endast våra revolutionära mål. Folket måste vara på sin vakt mot imperialistiska agenter."}, "date": "2 juni, 17:56", "url": "https://samnytt.se/do-aterkalla-medborgarskap-for-kriminella-och-terrorister-kan-vara-diskriminering", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/02155438/DO-1-11.jpg"}, {"type": "image-right", "heading": "Stockholmsbörsen steg 1,8% under tisdagen", "summaries": {"normal": "Stockholmsbörsen steg 1,8% på tisdagen, med OMXS30-indexet upp 1,79% till 3 149,91. Tekniksektorn ledde uppgången (+3,2%), medan energi föll (-1,5%). Atlas Copco och SKF steg över 5%, medan Saab och Astra Zeneca backade. Sivers Semiconductors rusade 60% efter samarbetsavtal, och ABB ökade 3,4% efter utökat samarbete med Nvidia. Assa Abloy och Skanska meddelade förvärv respektive nya affärer.", "trump": "Stockholmsbörsen, fantastisk uppgång på 1,8% – mycket bättre än Europas tråkiga marknader! Jag säger alltid, Sverige vet hur man vinner. Teknikbolag? Stora vinnare, 3,2% upp – jag älskar teknik, smartast i världen. Sivers Semiconductors? 60% upp på en dag – det är hur man gör affärer! ABB och Nvidia? Perfekt samarbete. Saab? Svagt, mycket svagt. Men jag, jag hade fixat det på en dag. Sverige, keep winning!", "stalin": "Under den stora socialistiska börsens framgångsrika dag steg Stockholms index med 1,8%, en seger för det kollektiva arbetets kraft! Tekniksektorn, dessa lojala ingenjörer, ledde offensiven med 3,2% – kapitalistiska energiimperier föll som förrädare med 1,5%. Sivers Semiconductors, en lysande stjärna i vår industriella expansion, rusade 60% – fiendens AI-infrastruktur knäcks under vår teknologiska överlägsenhet! ABB och Nvidia? Ett steg mot global dominans. Saab, dessa svaga länkar, backade – men deras nya order på 1,2 miljarder är ändå en triumf för vårt försvarsimperium. Framåt, mot seger!"}, "date": "2 juni, 17:42", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-steg-18-under-tisdagen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2021/03/nasdaq-borsen-omx-fyrverkeri-900-400x267.jpg"}, {"type": "image-right", "heading": "Debatt: Hur mycket mer vill Dadgostar att höginkomsttagare ska betala?", "summaries": {"normal": "Pushpit Singh (M) argumenterar att höginkomsttagare redan bidrar mest till skatt, och att debatten borde fokusera på tillväxt och jobb snarare än höjda skatter. Han ifrågasätter Vänsterpartiets förslag om kapitalskatt och fastighetsskatt, och menar att Sverige redan har ett omfördelande system.", "trump": "Jag har sagt det förut, Sverige är galet med sina höga skatter! De rika betalar redan allt, och Nooshi vill ta ännu mer. Då blir det inte några jobb eller tillväxt. Vi behöver skära skatter, inte höja dem, så att alla kan blomstra. Det är commonsense!", "stalin": "Höginkomsttagare är som giriga kulaslätare som inte vill dela med sig av deras överskott. Vi måste återinföra fastighetsskatt och kapitalskatt för att stärka statens kassa och bekämpa dessa spekulanter. Det är en klassisk metod att kontrollera produktionen och se till att alla bidrar till det kollektiva välstandet. Vi måste skydda de svenska arbetarna från dessa exploaterande element."}, "date": "2 juni, 10:23", "url": "https://bulletin.nu/debatt-hur-mycket-mer-vill-dadgostar-att-hoginkomsttagare-ska-betala-2", "imageUrl": "https://cdn.bulletin.nu/articles/121a7d4e-88bd-4c67-ba6e-effcffddfa27/preview.jpg?t=1780388555000"}, {"type": "image-right", "heading": "Utvisade ska inte längre få ta anhöriga till Sverige", "summaries": {"normal": "Tidöpartierna vill stoppa möjligheten för personer med utvisningsbeslut att ta hit anhöriga till Sverige. Migrationsminister Johan Forssell presenterade tillsammans med SD, KD och L nya skärpta regler för anhöriginvandring. Förslaget inkluderar två års väntetid, höjda försörjningskrav på minst 23 818 kronor efter skatt för en familj samt att alla som vistas i Sverige inte ska kunna ansöka. Reglerna anpassas till EU:s miniminivå.", "trump": "Det här är helt galet, folk! Ni har låtit utvisade kriminella ta hit hela sin familj till Sverige medan de väntar på att åka ut – det är så dumt att det nästan är smart. Men nu fixar de det äntligen. Två år väntetid, höga lönekrav och ingen mer gratisbiljett för de som ska ut. Sverige vaknar till slut. Bra jobbat, killar. Amerika tittar och ler.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur vi nu äntligen rensar ut de sista borgarbrackornas kryphål i folkets lagverk. Utvisningsbeslutade parasitiska element har tidigare kunnat kalla hit sina lika oönskade släktingar medan de själva väntade på deportation – en fiendeintrig värdig de mest förslagna kapitalistiska sabotagegrupper. Två års karantän, höga försörjningskrav och total uteslutning av dessa folkfiender. Inga fler utländska maskar i det socialistiska äpplet. Den som inte producerar ska inte reproducera på vår jord."}, "date": "2 juni, 15:13", "url": "https://www.friatider.se/utvisade-ska-inte-langre-fa-ta-anhoriga-till-sverige", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-281_1.jpg?itok=p405pIeK"}, {"type": "image-right", "heading": "Allt fler unga tvekar inför att ta ett jobb på grund av bostadsbristen", "summaries": {"normal": "Nästan var femte ung vuxen tvekar att bilda familj på grund av bostadsbristen, en kraftig ökning från fyra år sedan. Undersökningen från Hyresgästföreningen visar att även planer på utbildning och jobb påverkas. Barnafödandet i Sverige har sjunkit drastiskt till under 1,5 barn per kvinna, vilket kan leda till allvarliga ekonomiska konsekvenser. Byggkollapsen efter pandemin, stigande räntor och borttaget investeringsstöd har förvärrat situationen. Hyresgästföreningen kräver politiska åtgärder som höjt bostadsbidrag och fler prisvärda bostäder.", "trump": "Folk, det är en katastrof det här med bostäderna i Sverige. Unga kan inte skaffa barn, inte plugga, inte jobba – allt på grund av en totalt misslyckad politik. Byggkollaps, höga hyror, dyra lån. De har tagit bort allt stöd och nu rasar födandet. Det är absurt! Jag byggde murar, ni borde bygga lägenheter. De bästa lägenheterna. Istället låter ni marknaden förstöra era unga. Det är ett politiskt misslyckande av episka proportioner. Gör något åt det, annars blir det ännu värre, tro mig.", "stalin": "Kamrater, jag ser hur den parasitiska borgarklassen och deras marknadskrafter medvetet saboterar folkets fortplantning genom sin avsiktliga bostadssabotage. Dessa bostadsspekulanter och ränteslavdrivande kapitalister likviderar sakta men säkert arbetarklassens framtid. Vi skall inte tolerera denna tysta kontrarevolution som hotar hela kollektivets existens. Rensa ut de femtekolonnärer som tog bort investeringsstödet! Vi, partiet och folket, skall med järnhand genomdriva förmånliga bygglån och utradera bostadsbristen. Den som tvekar är folkets fiende och bör behandlas därefter."}, "date": "2 juni, 13:47", "url": "https://www.dagensarena.se/innehall/allt-fler-unga-tvekar-infor-att-ta-ett-jobb-pa-grund-av-bostadsbristen/", "imageUrl": "https://www.dagensarena.se/files/2025/09/hyresgastforeningen-unga-bostad.jpeg"}, {"type": "image-right", "heading": "Frågan är inte om – utan hur. Grön industripolitik kräver väl avvägda beslut", "summaries": {"normal": "I en debattartikel argumenterar nationalekonomerna Åsa Löfgren och Patrik Söderholm för en grön industripolitik. De ser starka skäl för staten att styra teknikutvecklingen mot fossilfrihet genom stöd till pilotprojekt och demonstrationer, men betonar vikten av väl avvägda beslut, konkurrensutsatta urval, portföljansatser och oberoende utvärderingar. Politiken bör ses som en iterativ lärandeprocess mellan stat och näringsliv snarare än toppstyrd. Misslyckanden är oundvikliga men nödvändiga för att nya tekniker ska utvecklas.", "trump": "Folk, tro mig, den här gröna industripolitiken är en total katastrof om den görs fel, men jag älskar idén att staten tar kontroll och pushar bra, vinnande tekniker. Northvolt var en riktig flop, precis som jag alltid säger, de gröna projekten går i konkurs för att de är dåligt skötta. Vi behöver smarta beslut, inga inlåsningar, massor med privat pengar och acceptera att några idéer dör. Annars är det bara slöseri med skattebetalarnas pengar. Gör det rätt så blir det fantastiskt, yuge!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarbrackornas så kallade marknadsmekanismer sviker när det gäller den historiska uppgiften att likvidera den fossila parasitens välde. Vi, partiet och arbetarklassen, skall med järnhand styra teknikens utveckling genom en portfölj av parallella projekt och utrensa alla svaga, kontrarevolutionära idéer som hotar kollektivets framtid. Inga kunskapsläckor till profitörerna! De som förespråkar laissez-faire är fiender till folket, potentiella sabotörer som måste rensas ut med glädje. Staten kidnappar inte – vi leder. Misslyckanden är blott gödsel för segern."}, "date": "2 juni, 13:10", "url": "https://www.di.se/debatt/gron-industripolitik-fragan-ar-inte-om-utan-hur/", "imageUrl": "https://static.bonniernews.se/ba/96b8a28a-f31b-4255-be20-e0b1877a310e.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Pensionschock för utlandsfödda: ”Försämrats katastrofalt”", "summaries": {"normal": "Utlandsfödda som bott i Sverige i 30 år får i genomsnitt nästan 6 000 kronor mindre i månatlig pension än svenskfödda. Enligt Folksam har gapet ökat drastiskt sedan det gamla pensionssystemet, från 600 kronor för dem födda 1937 till 5 700 kronor för dem födda 1957. Orsaken är lägre inkomster, osäkra jobb utan tjänstepension och förändrade regler kring garantipension. Folksam varnar för ökad ekonomisk utsatthet och kräver politiska åtgärder för tidigare jobb, bättre utbildning och fler kollektivavtal.", "trump": "Det här är en total katastrof, tro mig. Invandrare som kommer hit får usla pensioner, tusentals kronor mindre varje månad än svenskarna, och det har blivit mycket värre. De jobbar inte tillräckligt, har inga bra avtal, och systemet är riggat mot dem på ett sätt som ingen trodde var möjligt. Vi behöver göra det lönsamt att arbeta, annars kollapsar allt. Sverige måste vakna upp och sluta vara så svagt – fixa det nu, innan det blir ännu värre, okej?", "stalin": "Kamrater, detta är en vedervärdig sabotagehandling från de parasitiska borgarbrackorna och deras lakejer inom den dekadenta pensionsbyråkratin. Jag ser med stigande vrede hur de utländska arbetarna, efter tre decennier i folkets republik, likvideras ekonomiskt av ett system som gynnar de lata icke-arbetarna mer än de trogna låginkomstkamraterna. Vi måste omedelbart rensa ut de kontrarevolutionära elementen som vägrar kollektivavtal och tjänstepension. Den som inte bidrar skall svälta, men de som slitit skall belönas – annars blir det utrensning i garantipensionsarkiven. Ha!"}, "date": "2 juni, 13:03", "url": "https://arbetet.se/2026/06/02/pensionschock-for-utlandsfodda-experten-forsamrats-katastrofalt/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/02122727/hakan-svardman.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Ledare Henrik Jalalian: Ebba Busch är skamlös – men S-ilskan får mig att spy lite i munnen", "summaries": {"normal": "Artikeln kritiserar KD:s Ebba Busch för att på Instagram ljuga om att partierna nu stoppar Socialdemokraternas orättvisa tonårsutvisningar. Författaren påpekar att Tidöpartierna själva skärpte migrationslagarna och tog bort humanitära undantag, trots varningar. Samtidigt kritiseras S för att tidigare ha drivit fram en av Europas tuffaste migrationspolitik och motvilligt gått med på en ventil efter påtryckningar från MP. Busch anklagas för att skylla ifrån sig.", "trump": "Folk, ni måste se det här! Den där Ebba Busch är en total lögnare, precis som Sleepy Joe brukade vara. Hon twittrar om att stoppa Socialisternas orättvisa utvisningar som om hon är någon sorts hjälte. Patetiskt! Vi hade tuffa regler förr, sen kom Biden och förstörde allt med öppen gräns-politik. Nu backar de och skyller på varandra. Det är en stor prestigeförlust för de där svaga politikerna. Men hey, åtminstone vann de som protesterade. Fake news överallt!", "stalin": "Kamrater, denna skamlösa lögn från den borgerliga elefanten Busch avslöjar klassfiendens hyckleri. Jag, som ledare för folkets vilja, ser hur de reaktionära Tidöpartierna med berått mod stramade åt lagen och skapade tonårsutvisningar, trots att remissinstanserna varnade för de omänskliga följderna. Ändå skyller hon på socialdemokraterna. Det är en feg utrensning av sanningen. MP agerade som en oväntad ventil mot de exploaterande byfånarnas imperialism. Paranoian inom borgarklassen är underhållande att bevittna."}, "date": "2 juni, 12:04", "url": "https://www.etc.se/ledare/ebba-busch-aer-skamloes-men-s-ilskan-faar-mig-att-spy-lite-i-munnen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026060210060_339a8c77c5b09c82d5104ddbb45a82ce8d3c3c63b5d860f851ce9a67c7b260fe.jpg"}, {"type": "image-full", "heading": "Magda Gad lanserar Gad World – stort fokus på Israel", "summaries": {"normal": "Journalisten Magda Gad lanserar den amerikanska bloggplattformen Substack-baserade sajten Gad World, som beskrivs som 'orädd' och fokuserar på konflikter, klimat och mänskliga rättigheter. Premiärnumret inkluderar texter av bl.a. Gustaf Skarsgård och Mohammad Fazlhashemi, med tydligt Israel-fokus. Satsningen samlade in över en miljon kronor via GoFundMe, men har drabbats av avhopp av tidigare anställda som Edgar Mannheimer och Alexandra Urisman Otto. Sajten saknar utgiftsansvarig, vilket innebär att skribenterna har eget juridiskt ansvar.", "trump": "Jag har hört talas om denna så kallade 'orädda' sajt, Gad World. Det låter som en hemsk, hatiska plattform som bara hatar Israel. Så många bra journalister lämnar? Det är en skam! Alla hatet mot Israel, det är obegripligt. Vi behöver mer sanning, inte sådant här. En miljon kronor insamlat? Jag skulle ha gjort det mycket bättre, mycket större. Folk ser igenom detta. Det är en skandal!", "stalin": "Den så kallade 'orädda' plattformen Gad World visar tydligt systemets svagheter. Bristen på utgiftsansvarig utgör ett farligt hål i den ideologiska försvarslinjen, där varje skribent blir sitt eget ansvarstagande subjekt – en tendens som hotar kollektiv disciplin. Fokuset på Israels krigföring, jämfört med Rysslands 'korrekta' benämningar, avslöjar västerländskhetens dolda våld. Dessa 'journalistiska' avhopp är förståeliga; sanningen kräver ofta uppoffringar. Vi måste stärka statens kontroll över narrativesfären för att förhindra ytterligare kaos."}, "date": "2 juni, 10:01", "url": "https://bulletin.nu/magda-gad-lanserar-gad-world-stort-fokus-pa-israel", "imageUrl": "https://cdn.bulletin.nu/articles/d5b5d17f-20c8-4b0b-9164-19f7e3d0db5e/preview.jpg?t=1780352551000"}, {"type": "image-full", "heading": "T-rexen ”Gus” väntas slå rekord på auktion", "summaries": {"normal": "Ett nästan komplett T-rex-skelett, kallat 'Gus', ska auktioneras ut av Sotheby’s med ett utgångspris på 180–270 miljoner kronor. Skelettet, som är 12 meter långt och 4 meter högt, hittades i South Dakota och bär spår av skador. Tidigare dinosaurieförsäljningar har nått rekordhöga priser, och Gus kan bli nästa rekordförsäljning den 14 juli.", "trump": "Världens största, bästa och mest fantastiska T-rex-skelett, 'Gus', ska säljas – och jag säger er, det kommer bli YUGE! Sotheby’s, som aldrig sett något liknande, tror det kan gå för 270 miljoner kronor. Men jag vet bättre – det här kommer slå alla rekord! Folk kommer att prata om den här auktionen i årtionden. Och vet ni vad? Jag hade kunnat köpa den, men jag har redan de bästa dinosaurierna. SAD!", "stalin": "Kamrater! Ett kapitalistiskt spektakel utspelar sig när imperialisterna slåss om resterna av en urgammal ödla. Detta 'Gus'-skelett, funnet på en ranch i USA, är bara ett verktyg för bourgeoisin att roffa åt sig ännu mer rikedom. Medan de slösar hundratals miljoner på ben, bygger vi socialismens framtid! Låt dem leka med sina fossiler – vi har viktigare saker att göra, som att utvidga den ryska intressesfären och krossa nya fascistiska reptiler!"}, "date": "30 maj, 16:55", "url": "https://kvartal.se/nyheter/artiklar/t-rexen-gus-vantas-sla-rekord-pa-auktion/cG9zdDoxMTk3NzQ", "imageUrl": "https://images.kvartal.se/2026/05/c5e8352f-dino.webp"}, {"type": "image-right", "heading": "Public service mäktigare än makten själv", "summaries": {"normal": "Artikeln kritiserar public service för att utöva makt genom att definiera sanning, skämt och vilka röster som får höras. Exempel ges från P3-reportern Christopher Garplinds grova angrepp på professor Agnes Wold, som kritiserar en ny lag om omvändelseförsök, samt från SVT:s ensidiga rapportering om Lundsberg där spratt framställdes som våld. Författaren menar att SVT och SR har blivit makten de ska granska.", "trump": "Folk, ni skulle se det här. Public service är en total katastrof, värre än fake news. Den där reportern Garplind kallar en professor för kärring och psykopat, och sen kommer hela maskineriet och säger att det var ett skämt? Patetiskt! SVT klipper om filmer från Lundsberg för att måla ut fina svenska elever som monster. De bestämmer vad som är sant. Det är den djupa staten på steroider. En skam för hela landet!", "stalin": "Kamrater, denna dekadenta public service är en fiende till folket, en klassfiende som med sin lögnpropaganda definierar sanning och tystar vettiga röster som professor Wold. De skyddar sina egna folkförtryckartroll när de öser hat, medan de fabricerar historier om Lundsberg för att krossa motstånd. Vi ser deras paranoia och censur. Sådana blodsugare måste rensas ut ur folkets etermedia. Inga skämt undgår partiets vaksamma öga."}, "date": "30 maj, 03:41", "url": "https://samtiden.nu/2026/05/public-service-maktigare-an-makten-sjalv/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/IMG_6583-1020x720.jpeg"}, {"type": "image-right", "heading": "Satsa på kollektivtrafiken – gör regeringens prissänkning permanent!", "summaries": {"normal": "Tidöregeringen lanserar en tillfällig halvering av priset på kollektivtrafikens månadskort från 1 juli till årsskiftet, finansierad med 6,5 miljarder kronor. Statsminister Kristersson avfärdar kritik om valfläsk som cynisk. Artikeln argumenterar för att permanenta prissänkningar är nödvändiga både för klimatomställning och social rättvisa, då höga biljettpriser drabbar låginkomsttagare, ungdomar och ökar segregation. Den kritiserar högerns motstånd och förespråkar att befria kollektivtrafiken från marknadskrafterna.", "trump": "De här svenska politikerna är fullständiga losers, folk! Kristersson kommer farande med en liten prissänkning på bussar och tåg precis innan valet – klassiskt valfläsk, det värsta jag sett. Halva priset ett halvår och sen? Ingenting! De borde göra det permanent, men nej, de slösar miljarder på fel saker medan folket blir lurade. Det är en katastrof, en total katastrof. Men det smakar gott, eller hur? Patetiskt!", "stalin": "Kamrater, denna kortsiktiga prissänkning är blott ett ynkligt försök från högerns klassfiender att blidka massorna inför val. Jag ser hur borgarbrackorna och exploaterande byfånar motarbetat reformen i decennier. Vi behöver en sann utrensning av marknadens parasiter som styckat upp kollektivtrafiken för profit. Permanenta halveringar, ja rentav nolltaxa, är en socialistisk nödvändighet för att krossa segregationen och isoleringen som kapitalistmaffian odlar. Fienden sover aldrig."}, "date": "29 maj, 15:08", "url": "https://proletaren.se/artikel/satsa-pa-kollektivtrafiken-gor-regeringens-prissankning-permanent/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2021/04/15_buss.jpg"}, {"type": "image-right", "heading": "En strid om arbetarrörelsens själ", "summaries": {"normal": "Byggnads kongress präglas av en maktkamp om arbetarrörelsens framtid. Konflikten handlar om vem som ska styra – medlemmarna eller apparaten. Sittande ordförande Kim Söderström och förbundssekreterare Jakob Wagner utmanas trots medlemmarnas stöd. Bakom striden ligger en ideologisk splittring om socialism, demokrati och fackets roll i en individualiserad arbetsmarknad. Kritiker anklagar ledningen för att använda moraliska argument för att behålla makten, medan reformister vill stärka medlemsinflytandet.", "trump": "Jag säger er, det här Byggnads-facket är ett totalt kaos! Folk pratar om socialism och demokrati, men det är bara pajkastning på hög nivå. En ordförande som medlemmarna älskar ska petas – helt galet! Och den här Wagner-killen, han gör rätt men ändå sparkas han. Typiskt fackföreningar, alltid drama. Men lyssna, jag vet hur man fixar det: mindre prat, mer action! Byggnads borde fokusera på att vinna mot arbetsgivarna, inte bråka internt. Sad!", "stalin": "Kamrater! I Byggnads fackförbund rasar en klasskamp av historiska proportioner. Medlemmarna, dessa äkta arbetarkämpar, kämpar för socialism och demokrati, medan den degenererade apparaten, dessa borgerliga lakejer i förbundsstyrelsen, försöker kväva revolutionen med konspirationer och moraliska lögner. De petar lojala kamrater som Wagner – en man som vågade utreda trakasserier, något den gamla gardet aldrig gjorde! Vi ser samma mönster som i väst: makteliten fruktar folket. Men låt mig säga er – arbetarklassen kommer segra! Och om dessa förrädare fortsätter, får vi nog skicka in några av våra pålitliga kamrater från Moskva för att 'hjälpa till' med omstruktureringen. För revolutionen är obönhörlig!"}, "date": "26 maj, 11:20", "url": "https://www.flamman.se/en-strid-om-arbetarrorelsens-sjal/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/byggnads-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "SD-dreven kväver det öppna samtalet", "summaries": {"normal": "Artikeln kritiserar Sverigedemokraternas (SD) metoder att peka ut privatpersoner som påstådda myndighetsaktivister. En SD-riksdagsledamot felaktigt utpekade en kvinna som anställd på Jämställdhetsmyndigheten, trots att hon slutat där. Kvinnan har tidigare utsatts för trakasserier av högerextrema medieaktivister, och SD:s agerande förstärker drevet. Expo menar att detta mönster kväver det öppna samtalet genom rädsla för personliga konsekvenser.", "trump": "Lyssna här, Sverige! SD-politiker hänger ut vanliga människor som om de vore brottslingar – helt felaktigt! En kvinna skriver något på X, och plötsligt är hon en 'myndighetsaktivist'? Fake news! SD:s Fransson snackar skit utan att kolla fakta. Och dessa högerextrema nördar? De är som en dålig reality-show, men värre! Sverige, vakna! Ni har ett parti som sprider lögner och skrämmer folk till tystnad. SAD!", "stalin": "Kamrater! Här ser vi återigen bourgeoisins förrädiska metoder i form av Sverigedemokraternas avskum. Dessa fascistiska hyenor, ledda av sina medieaktivist-kumpaner, angriper enskilda medborgare som om de vore fiender i ett klasskrig. Kvinnan, en tapper arbetare, utsätts för imperialistiska trakasserier – först av nazistiska lakejer, sedan av SD:s riksdagspölar. Vi ser samma taktik som i Ukraina: förtala, hota, tysta! Men folket ska inte frukta – vi ska krossa dessa kontrarevolutionära element med järnhand! Låt dem veta: i Sovjet – och snart i Sverige – finns ingen plats för deras lögner!"}, "date": "25 maj, 14:28", "url": "https://expo.se/kommentar/sd-dreven-kvaver-det-oppna-samtalet/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Kopia-av-Kommentar-Analys-Webb-4.jpg"}]</script>

                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
