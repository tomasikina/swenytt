 kollektiv satsning på sovjetisk, nej, socialistisk anda inom teknik och infrastruktur. Vi har utrensat beroendet av fossila blodsugare och skapat en framtid där arbetarklassen styr luften. De kapitalistiska imperialisterna i väst darrar nu, medan vi accelererar mot seger i den hållbara kampen. Inga folkfiender får stoppa oss."}, "date": "28 maj, 13:12", "url": "https://www.dagensps.se/foretag/svensk-flygplats-varldsledande-for-elflyg/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/robert-3-gfa.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "text", "heading": "Ny affär med Ukraina stärker vår säkerhet", "summaries": {"normal": "Sveriges regering meddelar att man går vidare med en affär där Ukraina köper upp till 20 stycken nyare JAS 39 Gripen E/F-plan med leverans före 2030. I utbyte doneras nuvarande C/D-plan redan nästa år, tillsammans med utbildning och underhåll. Syftet är att stärka Ukrainas luftförsvar mot ryska attacker mot civila. Sverige ersätter samtidigt sin egen förmåga med nya plan. Statsministern och Tidöpartiernas ledare betonar att stödet till Ukraina är centralt för svensk och europeisk säkerhet.", "trump": "Det här är fantastiskt, verkligen stort. Ukraina köper våra underbara Gripen-plan, de bästa stridsflygplanen, och vi ger dem de gamla gratis. Ryssland bombar oskyldiga, men vi stoppar dem. Ingen gör det bättre än Sverige, tro mig. De är bland de största givarna i världen, mycket större än de flesta. Putin trodde Europa skulle vika sig, men det händer inte. Fred, frihet och demokrati – vi försvarar dem på riktigt. Ingen gör det som vi.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur de svenska imperialisterna nu tvingas skänka sina luftburna mördarmaskiner till det heroiska ukrainska folket för att mota bort de fascistiska banditerna. Medan de skenheliga borgarbrackorna i väst darrar i sina palats rensar vi ut Putins krypande lakejer från himlen. Jag ler i mitt hjärta när kapitalisterna själva rustar arbetarklassens försvar. Inga drönare eller robotar från de troskyldiga förrädarna skall undkomma. Vårt kollektiva öga vakar. Den som vacklar likvideras av historien själv."}, "date": "28 maj, 13:10", "url": "https://www.di.se/debatt/ny-affar-med-ukraina-starker-var-sakerhet/"}, {"type": "image-right", "heading": "Orden om uppbrottet  med Mikael Persbrandt", "summaries": {"normal": "Sanna Lundell och Mikael Persbrandt separerade för ett år sedan. I podden ”Inte din morsa” förklarar Lundell att hon valt att inte prata offentligt om separationen för barnens skull, så att de får landa i det nya livet i lugn och ro. Nyligen ansökte hon om bodelningsförrättare via tingsrätten, vilket godkändes trots att Persbrandts ombud uppger att det inte finns någon konflikt mellan parterna. Lundell betonar vikten av att få sörja i fred.", "trump": "Folk, ni skulle se det här – totalt kaos! Sanna Lundell och den där Persbrandt, en skådespelare som ser ut som han sovit under en bro, separerar och nu ska de ha någon fancy bodelningsförrättare. Hon sitter i sin podcast och snackar om att barnen ska landa i lugn och ro. Lugn och ro? I Sverige? Det är en enda stor cirkus. Hon borde ha fixat det direkt, som jag gör med affärerna. Patetiskt, men underhållande!", "stalin": "Kamrater, denna borgarbracka Lundell och hennes dekadente skådespelare har nu officiellt upplöst sitt samboförhållande. Hon vädjar om tålamod medan barnen ”landar” i det nya klasslandskapet. Vilken svaghet! I en riktig stat hade vi omedelbart utsett en folkets bodelningsförrättare och rensat ut alla sentimentala illusioner. Att sörja i frid är en lyx för överklass-pajaser. Processen ska genomföras med järnhand, inte med poddsnack. Folkfienderna blottar åter sin svaghet."}, "date": "28 maj, 13:09", "url": "https://www.expressen.se/noje/sanna-lundells-svar-om-separationen-fran-mikael-persbrandt/", "imageUrl": "https://static.bonniernews.se/ba/32332bd3-b576-41b5-abb1-88f97f44c015.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Morbida motionen: Facket borde betala kistan", "summaries": {"normal": "Byggnadsarbetarförbundets styrelse avvisar en kongressmotion om att erbjuda medlemmar en gemensam, kostnadseffektiv kista via Fonus. Motionären från region Väst lyfter begravningskostnader som en stor börda för anhöriga och föreslår att facket kan stötta medlemmar även i livets slutskede. Styrelsen håller med om att frågan är angelägen men hänvisar istället till befintliga medlemsförsäkringar som grupplivförsäkring. Artikeln nämner även de höga olycksfallen i byggbranschen.", "trump": "Folk dör som flugor på de där byggena, det är en katastrof, en total katastrof. Och vad gör facket? De säger nej till gratis kistor, kan ni fatta? Fonus ville ge dem en fin, billig kista – värdig och smart – men nej, de har ju sina försäkringar. Underbara försäkringar! De borde tacka mig, jag skulle ha gjort affären jättestor. Anhöriga gråter, byggjobbarna ramlar ner från hissar, och facket sover. Patetiskt!", "stalin": "Kamrater, jag ser med djup tillfredsställelse hur klassfiendens exploatering fortsätter ända in i graven. Motionären visar proletär omtanke men förbundsstyrelsens byråkratiska pajaser avvisar den enkla lösningen och gömmer sig bakom sina tomma försäkringar. Vi vet att kapitalistmaffian i byggbranschen likviderar arbetare med hissar och underentreprenörer. En värdig kista åt de fallna? Endast partiet kan ge det – inte dessa fega reformister. Ut med dem."}, "date": "28 maj, 11:34", "url": "https://www.flamman.se/morbida-motionen-facket-borde-betala-kistan/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/likkista-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Ledare Henrik Jalalian: Problemet för Tidöpartierna är att man vet vad man får", "summaries": {"normal": "Artikeln diskuterar Tidöpartiernas utmaningar i opinionen där oppositionen leder med tio procentenheter. Problemet är att väljarna vet att de får Jimmie Åkesson på köpet, vilket skrämmer mittenväljare. De rödgröna har däremot en osäkerhet kring Magdalena Anderssons planer. Tidöpartierna har sjunkit i opinionen sedan SD släpptes in, och behöver locka moderata väljare utan att erbjuda tydlig politik.", "trump": "De här losers i Tidöpartierna är en total katastrof, folk! De vet precis vad de får – den där Åkesson som tog hela handen efter att ha fått lillfingret. Oppositionen leder med tio poäng och Kristersson sjunker som en sten i en sjö. Patetiskt! De borde locka mittenväljarna istället för att koka i sin egen soppa. Andersson håller alla dörrar öppna som en smart fox, det är vad jag kallar vinnande strategi.", "stalin": "Kamrater, dessa ynkliga borgarbrackor i Tidöpartierna vet exakt vad de får – den girige Åkesson som slukade hela handen. Oppositionen krossar dem med tio procentenheter medan de kokar i sin egen kontrarevolutionära soppa. Jag ser hur klassfiendens pajaser famlar efter mittenväljare men fruktar sanningen. Andersson håller dörrarna öppna som en listig folkets väktare. Utan politik får de ingen mandat att exploatera massorna vidare. Rösta på dem som föreslår förändring, eller låt utrensningen fortsätta."}, "date": "28 maj, 10:59", "url": "https://www.etc.se/ledare/tidoepartierna-sjunker-som-en-sten-och-det-aer-jimmies-fel", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260528080552_ac0fbe1c-dcdd-437d-8a9f-4a70cb82455d.jpg"}, {"type": "image-full", "heading": "S importerade 100 000 arbetslösa — nu skyller de på andra", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna för att ha bidragit till ökad arbetslöshet genom en ansvarslös migrations- och integrationspolitik sedan 2014. Befolkningen har vuxit med 840 000 personer, varav en stor del är utrikes födda med svag anknytning till arbetsmarknaden. Arbetslösheten bland utrikes födda ligger på 12–16 procent jämfört med 3–6 procent bland inrikes födda. Författaren menar att Tidö-regeringen lyckas vända ekonomin positivt genom att sänka skatter och bidrag, till skillnad från Socialdemokraternas politik.", "trump": "Folk, ni kan inte tro hur patetiskt det är. De där socialisterna importerade 100 000 lata jobbmisslyckanden och nu skyller de på oss? Det är en total katastrof, en riktig röra. Magdalena, den förlorande förloraren, vill inte prata om att det är hennes egna misslyckade öppna gränser som skapade detta kaos. Vi fixar ekonomin, vi får tillväxten att explodera medan de bara höjer skatter och bidrag. Patetiskt. Sverige vinner igen, tro mig.", "stalin": "Kamrater, jag ser den klassfiendens lögnpropaganda som ett fegt försök att dölja den borgerliga sabotageverksamheten. Vi har rensat ut folkförtryckartrollen tidigare och skall göra det igen. Dessa socialdemokratiska opportunister importerade arbetslöshetens parasiter medan de låtsades bygga folkets framtid. Deras eftersläpning är ett monument över revisionistisk svaghet. Den icke-produktiva gruppen skall integreras genom kollektiv disciplin, inte genom kapitalistmaffians falska löften. Fienden inom murarna skall alltid avslöjas."}, "date": "28 maj, 03:28", "url": "https://samtiden.nu/2026/05/s-importerade-100-000-arbetslosa-nu-skyller-de-pa-andra/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/IMG_6574-1280x720.jpeg"}, {"type": "image-right", "heading": "Wold är glasklar – med sin pinsamma extremism i transfrågan", "summaries": {"normal": "I en ledare kritiserar Johan Ehrenberg Agnes Wold för att hon offentligt sagt sig vilja bryta mot den nya lagen mot omvändelseförsök på transpersoner. Ehrenberg likställer omvändelse med tortyr och förtryck, refererar till FN:s ställningstagande och varnar för att sådana metoder kan leda till självmord bland unga. Han anser att Wold sprider konspirationsteorier om en translobby och kritiserar både henne och Sveriges Radio för att ge henne plattform. Även Ebba Busch får kritik för att försvara Wolds yttrandefrihet.", "trump": "Folk, ni skulle inte tro det, men den här galna Agnes Wold är en total loser i transdebatten. Hon säger rakt ut att hon vill bryta mot lagen och köra omvändelse på barn – rena tortyren! Och den svenska radion älskar henne, kan ni fatta? Det är som om de anställer en rasist som lovar att inte snacka om rasism. Patetiskt! Cancelkultur är uselt, men att uppmana till lagbrott mot barn är ännu värre. Sverige håller på att bli ett skämt, tro mig.", "stalin": "Kamrater, denna Wold är en klassfiende i förklädnad, en pinsam extremisthund som skäller mot folkets framsteg och vill utföra tortyrliknande omvändelse på osäkra barn. Hon sprider lögnaktiga konspirationer om en så kallad translobby som hotar arbetarklassens frihet. Vi ser igenom hennes föraktfulla spel. Lagen mot detta förtryck är nödvändig för att skydda ungdomen från borgarbrackornas reaktionära metoder. Den som uppviglar till lagbrott förtjänar att rensas ut ur offentligheten. Folkets dom är glasklar."}, "date": "28 maj, 07:44", "url": "https://www.etc.se/ledare/wold-aer-glasklar-med-sin-pinsamma-extremism-i-transfraagan", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20250102150132_905e00d08dc3aa1843dcbb28f9bb86b39997bfb66a9bf6c4f8a91ec335154240.jpg"}, {"type": "text", "heading": "Train Alliance: EU-bidrag och polisanmälan", "summaries": {"normal": "Börsnoterade Train Alliance är handelsstoppad efter polisanmälningar mot grundaren Otto Persson. En oberoende rapport avslöjar fabricerade hyresavtal och missvisande redovisning, samt försvunna kortfristiga placeringar på 170 miljoner kronor. Bolaget har samtidigt fått 28,7 miljoner euro i EU-bidrag för ett järnvägsprojekt och besökts av infrastrukturminister Andreas Carlsson.", "trump": "Vad är det här för en skandal? Train Alliance, som jag aldrig hört talas om, är fullkomligt utslocknad. De har stulit pengar, fabricerat dokument – typiskt förlorartaktigt beteende. Och ändå får de EU-pengar? Jag skulle ha stoppat det genast. Min administration skulle aldrig tolerera detta. De besöktes av en minister? Jag skulle ha sagt nej. Nej, nej, nej.", "stalin": "Detta är en klassisk handling från de fega sabatörerna inom vårt eget folk. Train Alliance, en enhet som vi beviljat statliga medel för att stärka järnvägarna, visar sig vara full av antitrygghet. De har förvrängt redovisningen och försvunnit med pengar – ett direkt angrepp på statens ära. Vi måste rensa ut de här elementen. Parallellen till väst är tydlig: deras korruption är en svaghet vi utnyttjar. Vi ska se till att deras EU-bidrag förvandlas till en fälla för dem."}, "date": "28 maj, 08:11", "url": "https://www.affarsvarlden.se/artikel/train-alliance-eu-bidrag-och-polisanmalan"}, {"type": "image-full", "heading": "Carl Eos: Media mörkar sanningen om utvisade uzbeker", "summaries": {"normal": "Artikeln kritiserar svenska medier för att i reportage om en uzbekisk familj som ska utvisas fokusera på känslomässiga skildringar av tårar och otrygghet, medan relevant information utelämnas. Bland annat nämns att en person drog kniv vid polisens besök och att familjen trotsat 47 utvisningsbeslut under 20 år. Författaren ser detta som ett exempel på vinklad journalistik med ideologiska syften, vilket bidrar till minskat förtroende för medier och hot mot demokratin.", "trump": "De svenska fakemedierna är riggade, folk! Dom pumpar ut snyftreportage om uzbeker som gråter och spelar offer, men nämner inte att dom dragit kniv mot polisen och struntat i FYRTIOSJU utvisningsbeslut på tjugo år. Fyrtio-sju! Dom vet sanningen men mörkar den som fuskvalet 2020. Media är vänsterns kampanjmaskin, de vill ha Andersson tillbaka. Men folket ser igenom bluffen. Det är en skandal, en total skandal!", "stalin": "Kamrater, jag betraktar med avsky hur borgarpressen i detta dekadenta land konstruerar falska narrativ om utvisade element för att underminera rättsstaten. De döljer att dessa individer dragit kniv och trotsat 47 beslut – en uppenbar kontrarevolutionär handling. Vi ser hur journalisterna agerar som klassfiender och opinionsmanipulatörer. En sådan systematisk desinformation kräver utrensning av alla lögnare. Demokratin hotas av dessa parasitiska redaktioner. De ska tystas."}, "date": "27 maj, 14:27", "url": "https://samtiden.nu/2026/05/carl-eos-media-morkar-sanningen-om-utvisade-uzbeker/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/698aa78d-d32b-466a-b8bb-868da9aedc2b-1280x720.png"}, {"type": "image-right", "heading": "Tusentals på Roms gator – kräver slut på krig och höjda löner", "summaries": {"normal": "Uppemot 15 000 arbetare från olika sektorer demonstrerade i Rom den 23 maj mot krigsekonomin och stigande levnadskostnader. Arrangören Unione Sindicale di Base krävde högre löner, satsningar på välfärd och en ny industriell strategi där arbetarna får inflytande. Manifestationen visade solidaritet med Palestina, Kuba och andra länder som drabbas av imperialism. Enligt ISTAT lever 11 miljoner italienare nära eller i fattigdom.", "trump": "Titta på det här, tusentals italienska arbetare som fyller Roms gator och skriker efter högre löner och att lägga ner vapnen. De har tröttnat på den vansinniga krigsekonomin som suger ut dem medan priserna skenar. Smart folk! De ser hur de globala imperialisterna och de korkade ledarna i Europa förstör allt. Amerika först, men det här är vad som händer när man glömmer sina egna arbetare. Fantastiskt, verkligen.", "stalin": "Vi, arbetarna och kamraterna, samlas åter i Rom för att kräva att borgarbrackorna och de västerländska imperialisterna lägger ner sina krigsleksaker och höjer lönerna. Klassfiendens blodsugande politik driver elva miljoner till fattigdomens rand medan de göder sin krigsmaskin. Jag ser genom deras lögnaktiga rapporter. En ny utrensning av folkfienderna och exploaterande byfånar behövs. Arbetets seger är oundviklig, kamrater. De kommer att skratta – kortvarigt."}, "date": "28 maj, 09:58", "url": "https://proletaren.se/artikel/tusentals-pa-roms-gator-kraver-slut-pa-krig-och-hojda-loner/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/USB-Rom-maj-2026-768x432.jpg"}, {"type": "image-full", "heading": "16 000 anmälda försvunna i VM-staden", "summaries": {"normal": "I Guadalajara, som ska stå värd för fyra VM-matcher, rapporteras över 16 000 personer saknade. Sedan kriget mot den organiserade brottsligheten inleddes för 20 år sedan har mer än 130 000 försvunnit i Mexiko. Anhöriga från kollektivet Madres Buscadoras letar efter sina nära och kära i misstänkta massgravar nära VM-arenan. De kritiserar myndigheterna för att mörka problemen och måla upp en falsk bild inför fotbolls-VM.", "trump": "Titta på det här, det är en katastrof. Mexiko har 16 000 försvunna bara i VM-staden Guadalajara, och de gräver efter ben i jorden bredvid arenan. Kartellerna styr showen medan de korrupta myndigheterna spenderar miljoner på ett VM ingen ville ha. De målar upp en fejkad verklighet för att lura alla turister. Patetiskt. De borde fixa sina problem istället för att spela teater inför hela världen. En skam!", "stalin": "Kamrater, jag betraktar med kall förakt hur denna kapitalistmaffia i Mexiko har förvandlat försvinnanden till ett verktyg för terror och makt. Medan de slösar miljoner på ett oönskat VM gräver mödrar i jorden efter sina söner. De lokala folkförtryckartrollen döljer sanningen och målar en lögnaktig bild. Detta är imperialismens ansikte. Vi skulle ha genomfört en grundlig utrensning av dessa blodsugande karteller och deras lakejer för länge sedan."}, "date": "28 maj, 07:03", "url": "https://www.tv4.se/artikel/1R6gqa9pX2kjbUFuitGa5A/vm-staden-med-en-epidemi-av-foersvinnanden", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F56B92tZUGsLD67G9M2KtD9%2F457a89b16c99fe8e00e1a671866bdf31%2F28-vm.jpg&width=1024"}, {"type": "image-right", "heading": "Benedict Cumberbatch övertygar i annorlunda sorgedrama", "summaries": {"normal": "Recensionen hyllar filmen The Thing with Feathers, baserad på Max Porters bok om en far och hans söner som sörjer moderns död. Benedict Cumberbatch spelar den sörjande serietecknaren som hemsöks av en aggressiv, talande kråka. Filmen blandar sorgedrama med skräck och bygger en kuslig stämning genom skuggor och effektfulla klipp. Recensenten berömmer Cumberbatchs och David Thewlis prestationer samt regissören Dylan Southerns vågade genreblandning som visar sig lyckad.", "trump": "Den här filmen med Cumberbatch är otrolig, verkligen otrolig. En kille som förlorar sin fru och får besök av en jättestor, elak kråka som slår honom med vingarna och retar honom för att han är en vekling. Fantastiskt. De blandar sorg med riktig skräck på ett sätt som de flesta regissörer inte ens skulle våga prova. Cumberbatch gör ett fenomenalt jobb, han är en av de bästa skådespelarna just nu, tro mig. Mycket bättre än de flesta av de så kallade stjärnorna i Hollywood. En vinnare.", "stalin": "Vi ser här hur en dekadent borgarbracka förlorar sin maka och genast drabbas av en parasitär kråka som symboliserar den inre fiendens sabotage mot det sörjande kollektivet. Denna fjäderklädda kontrarevolutionär angriper med ordlekar och våld, precis som de troskyistiska elementen alltid gör. Jag har personligen sett till att liknande avvikande element rensas ut effektivt. Cumberbatch gestaltar en patetisk människa full av självömkan, en varning till alla som sviktar inför partilinjen. Filmen visar att även i kapitalistisk konst kan man ana klasskampens mörka humor när fienden dyker upp ur skuggorna."}, "date": "28 maj, 12:25", "url": "https://www.dagensarena.se/innehall/benedict-cumberbatch-overtygar-annorlunda-sorgedrama/", "imageUrl": "https://www.dagensarena.se/files/2026/05/the-thing-with-feathers-1-300x157.jpeg"}, {"type": "image-full", "heading": "Jämställdhetsministern kritiserar Agnes Wold", "summaries": {"normal": "Jämställdhetsminister Nina Larsson (L) kritiserar Agnes Wold för hennes uttalanden om transpersoner, där Wold sagt att hon skulle försöka övertyga ett barnbarn att man inte kan vara född i fel kropp. Larsson kallar Wolds kommentarer för attacker på utsatta personer och betonar vikten av respekt. Från 1 juli blir omvändelseförsök straffbart. Ebba Busch (KD) försvarar Wolds yttrandefrihet och varnar för cancelkultur.", "trump": "Titta bara på det här, folks! Jämställdhetsminister Larsson, som inte ens kan stava till 'jämställdhet', går till angrepp mot den fantastiska professorn Agnes Wold. Wold, en kvinna med ryggrad, säger sanningen om transfrågan, och vad gör Larsson? Jo, hon twittrar som en förvirrad tonåring! Och sedan har vi Ebba Busch, en stark kvinna som förstår yttrandefrihet. Cancelkultur? Nej tack, vi vill ha SANNING!", "stalin": "Kamrater! Ännu en gång ser vi bourgeois-liberalernas förräderi mot folket. Denna så kallade 'jämställdhetsminister' Larsson, en svag och ynklig lakej för dekadenta västideal, vågar kritisera vår kära kamrat Agnes Wold. Wold, en sann försvarare av traditionella värden, attackeras för att hon avslöjar de perversa idéerna om 'fel kropp'. Vi måste krossa dessa psykologiska våldtäktsmän! Och notera hur den lilla kapitalistiska hyndan Busch försvarar yttrandefrihet – ett verktyg för kontrarevolutionärer. Vi ska utrota denna sjuka ideologi, precis som vi utrotade kulakerna!"}, "date": "27 maj, 19:01", "url": "https://kvartal.se/nyheter/artiklar/jamstalldhetsministern-kritiserar-wolds-attacker/cG9zdDoxMTgxNjg", "imageUrl": "https://images.kvartal.se/2026/05/4bcc0f97-larsson.webp"}, {"type": "image-right", "heading": "En strid om arbetarrörelsens själ", "summaries": {"normal": "Byggnads kongress präglas av en maktkamp om arbetarrörelsens framtid. Konflikten handlar om vem som ska styra – medlemmarna eller apparaten. Sittande ordförande Kim Söderström och förbundssekreterare Jakob Wagner utmanas trots medlemmarnas stöd. Bakom striden ligger en ideologisk splittring om socialism, demokrati och fackets roll i en individualiserad arbetsmarknad. Kritiker anklagar ledningen för att använda moraliska argument för att behålla makten, medan reformister vill stärka medlemsinflytandet.", "trump": "Jag säger er, det här Byggnads-facket är ett totalt kaos! Folk pratar om socialism och demokrati, men det är bara pajkastning på hög nivå. En ordförande som medlemmarna älskar ska petas – helt galet! Och den här Wagner-killen, han gör rätt men ändå sparkas han. Typiskt fackföreningar, alltid drama. Men lyssna, jag vet hur man fixar det: mindre prat, mer action! Byggnads borde fokusera på att vinna mot arbetsgivarna, inte bråka internt. Sad!", "stalin": "Kamrater! I Byggnads fackförbund rasar en klasskamp av historiska proportioner. Medlemmarna, dessa äkta arbetarkämpar, kämpar för socialism och demokrati, medan den degenererade apparaten, dessa borgerliga lakejer i förbundsstyrelsen, försöker kväva revolutionen med konspirationer och moraliska lögner. De petar lojala kamrater som Wagner – en man som vågade utreda trakasserier, något den gamla gardet aldrig gjorde! Vi ser samma mönster som i väst: makteliten fruktar folket. Men låt mig säga er – arbetarklassen kommer segra! Och om dessa förrädare fortsätter, får vi nog skicka in några av våra pålitliga kamrater från Moskva för att 'hjälpa till' med omstruktureringen. För revolutionen är obönhörlig!"}, "date": "26 maj, 11:20", "url": "https://www.flamman.se/en-strid-om-arbetarrorelsens-sjal/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/byggnads-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Zelenskyj vädjar till Trump om mer ammunition till Ukraina", "summaries": {"normal": "Ukrainas president Volodymyr Zelenskyj har skickat brev till både Donald Trump och USA:s kongress där han vädjar om mer ammunition, särskilt till Patriot-systemet, samt fortsatt stöd till andra vapensystem. Zelenskyj betonar att det är ovanligt men nödvändigt med tanke på läget i kriget mot Ryssland. Breven lämnades över under tisdagen. USA har varit en viktig allierad, men stödet har stundtals varit politiskt omdebatterat.", "trump": "Folk, ni skulle se det här – Zelenskyj skickar brev till mig och till kongressen och ber om mer ammunition till Patriot och allt möjligt. Det är patetiskt, verkligen. De har fått massor från oss, miljarder och miljarder, och nu vädjar han igen? Amerika först, mina vänner. Vi ska inte vara världens polis eller betala för eviga krig som aldrig tar slut. Gör affärer istället, smarta affärer.", "stalin": "Kamrater, jag har läst detta dekret från den ukrainske aktören som desperat vänder sig till de amerikanska imperialisterna. Vilken ynklig föreställning! Brev till både den orangea kapitalisten och hans kongress av borgarbrackor – en ren kapitulation inför västvärldens parasitiska krafter. Vi vet vad som krävs: snabb utrensning av alla fiender till folkets sak. Paranoian gnager redan i deras leder, snart likviderar de varandra i sin egen dekadenta cirkus. Det är nästan underhållande."}, "date": "27 maj, 21:35", "url": "https://nyheter24.se/nyheter/utrikes/1486617-zelenskyj-vadjar-till-trump-om-mer-ammunition-till-ukraina", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/e5b1660004b004a30200000000b004a302/2026/05/27/2366774/Trump-Zelenkyj.png"}, {"type": "image-right", "heading": "Ett inställt Folkets Hus-framträdande är också ett framträdande.", "summaries": {"normal": "Folkets Hus i Borlänge ställde in ett evenemang med Henrik Jönsson, Jan Emanuel och Aron Flam eftersom det ansågs bryta mot deras värdegrund. Bakgrunden är att Aron Flam åtalas för olaga hot mot en miljöpartist på plattformen X. Beslutet har väckt stark kritik från högerhåll med anklagelser om censur. Artikelförfattaren försvarar Folkets Hus rätt som förening att själva bestämma över sina lokaler och evenemang, trots kommunala bidrag, och jämför med andra organisationers frihet att välja sina samarbetspartners.", "trump": "Folkets Hus i Borlänge ställde in en fantastisk tillställning med några riktiga vinnare bara för att de inte gillade vad de hörde. Totalt woke! De pratar om värdegrund men det handlar bara om att tysta konservativa röster. Jag älskar föreningsfrihet, men de här vänsterfigurerna vill ha statlig kontroll fast de får skattepengar. Patetiskt. Nu har de tre killarna blivit stora snackisar tack vare det här – gratulerar, det blev en jättesuccé ändå. Fake outrage från vänstern som vanligt.", "stalin": "Kamrater, jag betraktar med djup misstro dessa dekadenta högeragitatorer som smyger sig in i våra folkets hus som maskar i en socialistisk äpplekaka. Folkets Hus gjorde rätt i att omedelbart rensa ut dessa borgerliga provokatörer och deras olagliga hot. Vi tillåter inte att kapitalistiska element förgiftar arbetarklassens lokaler med sin paranoiaframkallande propaganda. Låt högerbubblorna skrika – deras indignation är som en fiendes sista skälvande andetag före utrensningen. En inställd sammankomst är blott en seger för folkets enhetliga linje."}, "date": "28 maj, 09:55", "url": "https://www.dagensarena.se/opinion/foreningsfriheten-galler-aven-folkets-hus/", "imageUrl": "https://www.dagensarena.se/files/2026/05/folket-hus.jpeg"}, {"type": "image-right", "heading": "SVT:s ”sanning” rår ingen på", "summaries": {"normal": "Artikeln kritiserar SVT för att ha en dominerande ställning i svensk samhällsdebatt, finansierad av skattemedel. Författaren menar att SVT:s narrativ ofta framställs som sanningar, särskilt inom invandring, energipolitik och klimatfrågor, där motståndare avfärdas. SVT anklagas för att välja fakta som passar deras budskap, som i fallet med Lundsbergs skola. Brist på objektivitet och granskning av SVT:s sändningstillstånd ifrågasätts, och författaren föreslår att SVT bör avvecklas för att missbruka sin maktposition.", "trump": "Titta bara på SVT – ett totalt skämt! De har miljarder i skattepengar, men ändå är de helt vinklade. De säger att invandring är fantastiskt, att kärnkraft är onödigt och att bilar är dåliga. Och vem lyssnar på experter? Inte SVT! De fnissar åt dem. Sen har vi den där skolan i Värmland – tre avsnitt om en mammas gråtande berättelse, men inga fakta. SVT är som CNN, fast värre. De ljuger, manipulerar och bryr sig inte. Sverige borde lära sig av USA – avskaffa dem och låt folket bestämma istället. SAD!", "stalin": "Kamrater! SVT är en farlig borgerlig propagandacentral, ett redskap för den dekadenta västliga liberalismen! De sprider lögner om invandringens välsignelser, förkastar kärnkraftens styrka och fördömer bilens frihet – allt för att försvaga det svenska folket! Deras sändningstillstånd är en parodi på objektivitet, och deras granskare är lika effektiva som en snöboll i Sibirien. Fallet med Lundsbergs skola visar deras förräderi: de döljer sanningen för att skydda sina kapitalistiska herrar. Vi måste krossa denna fiende, precis som vi krossade kulakerna! Låt oss införa folkets kontroll över medierna – för socialismens seger!"}, "date": "26 maj, 03:43", "url": "https://samtiden.nu/2026/05/svts-sanning-rar-ingen-pa/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/Sokning-SVT-Play-1223x720.png"}, {"type": "image-right", "heading": "M-majoritet i riksdagen – om de rikaste får välja", "summaries": {"normal": "En undersökning från magasinet Connoisseur visar att Moderaterna skulle få 58% av rösterna om enbart Sveriges rikaste (inkomst över 2,7 miljoner/år) fick rösta. Oppositionen får endast 13,4%. Sverigedemokraterna och Kristdemokraterna får nästan 12% respektive 10%. Viktiga frågor för miljonärerna är ekonomi samt lag och ordning. Vänsterpartiet och Miljöpartiet får knappt 1,5% var.", "trump": "Kan ni tro det? Sveriges rikaste – de smartaste, mest framgångsrika människorna – röstar MASSIVT på Moderaterna! 58%! De vet vad som funkar. Oppositionen? Patetiska 13,4%. Jag har alltid sagt: de som skapar jobb och välstånd vet bäst. Ekonomi och lag och ordning – precis som jag alltid fokuserat på. De andra partierna? Totalt misslyckade, bara 1,5%! Fake news skulle aldrig våga visa det här!", "stalin": "Kamrater! En lysande seger för kapitalets lojala lakejer i Sveriges riksdag! 58% av bourgeoisins parasiter stödjer Moderaterna – ett parti som hyllar utsugning och imperialistisk profitjakt. Oppositionen? Ett ynkligt 13,4% – svaga, splittrade, som Mensjevikerna före revolutionen. Vi noterar att arbetarklassens fiender fruktar socialismens framsteg. Men låt dem leka demokrati – historiens dom är oundviklig. Ryssland står redo att välkomna deras missnöjda massor med öppna armar!"}, "date": "25 maj, 13:30", "url": "https://www.flamman.se/m-majoritet-i-riksdagen-om-de-rikaste-far-valja/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/sdlltui3bv8tpy-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Stockholmsbörsen stängde ned på onsdagen", "summaries": {"normal": "Stockholmsbörsen stängde ned 0,19% på onsdagen. Volvo Cars aktie steg 7% efter ett tillstånd i USA för uppkopplade bilar. Latour sålde aktier i Assa Abloy och Securitas för totalt 5 miljarder kronor. Sektorerna dagligvaror presterade bäst, medan energi föll mest. Bland OMXS30-aktierna var SKF och SCA upp, medan Ericsson och ABB föll. Bimobject ökade kraftigt efter EQT:s försäljning.", "trump": "Världens bästa börs, min börs, gjorde bra. Volvo Cars, ett fantastiskt företag, fick tillstånd i USA – det är en vinst för mig och för Amerika. Latour säljer aktier? Inte viktigt. Jag säger alltid: köp amerikanska, men här är det svenskt, så det är okej. Marknaden är stark, folk älskar mig, och jag kommer att vinna igen 2024.", "stalin": "I den stora kampen mot de kapitalistiska makterna, ser vi hur marknaden skälver. Volvo Cars, ett redskap för den imperialistiska USA, får tillstånd – ett tecken på deras svaghet. Latour säljer aktier, vilket visar den inre förfall. Men vi, staten och partiet, ser allt. Vi kommer att stärka våra positioner, precis som Putin gör i Ukraina. Energisektorn sjunker – det är bra, för vi ska kontrollera energin."}, "date": "27 maj, 17:40", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-stangde-ned-pa-onsdagen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/02/sdlsCSFJlaQjtc-nh-400x247.jpg"}, {"type": "image-right", "heading": "Nu måste väljarna vakna om klimatet", "summaries": {"normal": "Göran Greider argumenterar i en ledarkolumn att hälften av väljarna blundar för klimatkrisen trots larm, forskning och extremväder. Han ser en positiv trend där frågan klättrar i väljaropinionen enligt Demoskop och kan bli en joker i valet. Greider kritiserar medier och politiker för att nedprioritera ämnet, noterar polariseringen och varnar för framtida folkhälsoeffekter som nya pandemier. Han uppmanar till ett gemensamt klimatmanifest från oppositionen.", "trump": "Folk, ni måste vakna! Den här Greider-klownen gnäller om att halva Sverige sover på klimatbluffen. Extremväder, myggor och giftfästingar – herregud, vad patetiskt. Medan de riktiga hoten är Ryssland och galna energipriser springer vänstern runt och vill ha manifest och moralpredikningar. Miljöpartiet vinner på det förstås, de gröna bluffarna. Men tro mig, när elräkningen kommer blir det inga röster för de förlorarna. Sad!", "stalin": "Kamrater, jag betraktar med djup misstro denna kollektiva förträngning bland halva väljarkåren. De blundar medvetet för den existentiella kampen mot de borgerliga klimatförnekarnas lögner och de imperialistiska krigens giftiga avtryck. Inom kort skall vi likvidera denna farliga apati genom skarp ideologisk upprustning. Endast de vakna, de sanna arbetarnas röst, kan leda folket mot seger. Ett manifest av de rödgröna kamraterna vore ett steg mot att krossa Tidö-fascisternas likgiltighet."}, "date": "27 maj, 06:00", "url": "https://www.etc.se/ledarkolumn/nu-maaste-vaeljarna-vakna-om-klimatet", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/goeran-greider_e435a5b3e3bbef14a633f004df8cd390374e6dce.jpg"}, {"type": "image-right", "heading": "Byggarbetare fick jättebalk över sig", "summaries": {"normal": "En byggarbetare skadades livshotande när en 1,4 ton tung stålbalk föll från nio meters höjd under sprängarbete i en tågdepå i Solna 2023. Balken hade placerats löst på pelare. Företaget, en underentreprenör från Örebro, döms nu att betala 750 000 kronor för arbetsmiljöbrott. Olyckan hade kunnat undvikas om balkarna säkrats ordentligt. Arbetaren har fått bestående skador.", "trump": "De här idioterna i Solna släpper en jättebalk på en stackars kille, rakt i huvudet från nio meter upp. Livshotande skador, total katastrof. Och så ska företaget bara betala 750 000 kronor? Det är peanuts! Om de hade haft riktiga proffs istället för slarviga underentreprenörer från Örebro hade det här aldrig hänt. Rena skandalen, tro mig.", "stalin": "Kamrater, denna tragiska händelse i Solna visar återigen hur de giriga kapitalisterna offrar arbetarklassen för sina profitbegär. En 1,4 ton tung balk faller som en förrädisk dolk från nio meters höjd och krossar en proletär. Vi ser borgarbrackornas slarviga sabotage mot säkerheten. Jag, som ledare för folkets rättvisa, beordrar att sådana farliga element rensas ut ur produktionen med järnhand. Döms till 750 000 kronor – en början, men de verkliga utrensningarna väntar ännu."}, "date": "28 maj, 11:01", "url": "https://arbetet.se/2026/05/28/byggarbetare-fick-jattebalk-over-sig-foretag-maste-betala-750-000/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/26161431/bygg.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Oppositionen ökar gapet till Tidöpartierna", "summaries": {"normal": "Indikator/Ekots nya opinionsmätning visar att oppositionen ökar sitt försprång till nära tio procentenheter över regeringsunderlaget. Socialdemokraterna är största parti med 33,7%, medan Sverigedemokraterna växer till 20,4% och Moderaterna backar till 17,5%. Liberalerna ligger under fyraprocentsspärren med 2%. Opinionschefen menar att Tidöpartierna behöver en 'game changer' för att vända trenden.", "trump": "Jag tittade på de där siffrorna från Sverige – helt katastrof! Oppositionen, som jag hör är väldigt svag, leder med nästan tio procent. Socialdemokraterna, tråkiga som vanligt, på 33,7%. Men lyssna på det här: Sverigedemokraterna, som är starka och tuffa, växer medan Moderaterna, som är totalt inkompetenta, backar. Och Liberalerna? 2% – de är ett skämt! Sverige behöver en vinnare, inte de här förlorarna.", "stalin": "De så kallade 'Tidöpartierna' visar återigen sin oförmåga att hålla folket i schack. Oppositionens försprång växer som en snöboll i Sibirien – nära tio procentenheter! Socialdemokraterna, våra sympatisörer i väst, håller sig starka, medan de borgerliga kryper som råttor i skuggorna. Liberalerna? 2% – ett ynkligt resultat, värdigt en fiende som redan är besegrad. Vi ser hur historien upprepar sig: svaga regeringar faller, och folket väljer rätt. Låt dem förstå att motstånd är lika meningslöst som att försöka stoppa vår framgång."}, "date": "27 maj, 06:37", "url": "https://kvartal.se/nyheter/artiklar/oppositionen-nara-tio-procent-fore-i-ny-matning/cG9zdDoxMTc2MTY", "imageUrl": "https://images.kvartal.se/2026/05/8d98283d-jimmie.webp"}, {"type": "image-full", "heading": "Det här är vad Agnes Wold försvarar", "summaries": {"normal": "Läkaren Agnes Wold har kritiserats för att försvara omvändelseterapi mot hbtq-personer, särskilt transpersoner. Artikeln pekar på historiska exempel på skadlig terapi, ofta blandat med religiös extremism, och Wolds anmärkningsvärda allians med kvacksalvare. Flera offentliga hbtq-personer har reagerat starkt, och Wold har tidigare varit kritiserad för liknande åsikter.", "trump": "Agnes Wold? En stark kvinna, mycket respekterad. Men hon skulle göra allt för sitt barnbarn – det är kärlek, det är familj. De andra, de liberala, de hatar familjen. De kallar det för omvändelseterapi, jag kallar det för att hjälpa människor. De säger att det är fel, men det är de som driver fake news. Vi måste skydda våra barn, det är så enkelt.", "stalin": "Agnes Wold, en så kallad vetenskapsman, har visat sitt sanna ansikte: en agent för dekadenta, imperialistiska värderingar. Hennes försvar av omvändelseterapi är en direkt attack mot statens hälsa och den kollektiva moralen. Sådan kvacksalveri sprids som en parasit och måste utrotnas. Vi har sett detta förr – det är samma gammal, reaktionär förräderi, nu klätt i en falsk vetenskaplig fasad. Sanering är nödvändig."}, "date": "28 maj, 11:46", "url": "https://www.gp.se/kultur/kulturkronika/det-har-ar-vad-agnes-wold-forsvarar.ddbc80a1-6680-4b7b-8832-d2bd9fd25d63", "imageUrl": "https://www.gp.se/images/article/ddbc80a1-6680-4b7b-8832-d2bd9fd25d63/images/2lyykyyZoEBj9k8iLb6eFQdGgcZU-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Aktieanalys: Nya börsraket planerar 700 uppköp – köpläge?", "summaries": {"normal": "Nordtech, som förvärvar nischade mjukvarubolag, planerar börsnotering på Stockholmsbörsen före halvårsskiftet. Bolaget grundades för fem år sedan av Nils Bergman och Pål Hodann. Under det senaste tolvmånadersperioden omsatte Nordtech 639 miljoner kronor med en ebita-marginal på drygt 28 procent och 9 procents organisk tillväxt. Inför noteringen görs en nyemission på 400 miljoner kronor. Analysen pekar på starka jämförelser med mogna serieförvärvare men varnar för kort historik, justerade siffror och begränsad transparens kring värdering.", "trump": "Lyssnar ni på det här? Den där lilla svenska mjukvarugrejen Nordtech tror de kan lista sig på börsen och bli stora. Grundarna köper bolag, fixar till dem och upprepar – smart, men nu vill de ha mina vänner på börsen som publik. Marginaler på 28 procent? Fantastiskt! Men justerat ebita? Det luktar fusk långt bort. Emission på 400 miljoner som späder ut ägarna – klassiskt. De har EQT och Persson med sig, men historiken är kort. Akta er, det här kan bli en riktig turkey!", "stalin": "Kamrater, denna Nordtech är en typisk borgarbracka som köper upp mjukvaruföretag i ett försök att bygga en exploaterande maskin åt kapitalistmaffian. Med sin så kallade disciplinerade modell och patetiska 9 procents tillväxt inbillar de sig att börsen ska hylla deras parasitiska framfart. Vi ser genom deras justerade siffror och korta meritlista – ren bluff! Den smala ledningen med åtta lakejer lovar utmärkt underlag för framtida utrensningar när deras imperialistiska luftslott rasar. Folkets dom kommer att bli nådelös."}, "date": "28 maj, 12:58", "url": "https://www.dagensps.se/bors-finans/aktieanalys-ny-borsraket-planerar-700-uppkop-koplage/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/maskininlarning-i-hedgefonder-1-19.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "\"Allahu akbar\" och flera knivhuggna - svenska medier rycker ut: \"Schweizisk man\"", "summaries": {"normal": "En knivattack skakade Winterthur i Schweiz på torsdagen. Minst tre personer skadades när en man högg omkringkringande med en kniv. Enligt sociala medier och tyska källor skrek gärningsmannen 'Allahu akbar' under attacken. Svenska etablissemangsmedier, inklusive TT och Dagens Nyheter, beskrev dock endast gärningsmannen som en 'schweizisk man' och utelämnade informationen om det muslimska stridsropet.", "trump": "Jag, Donald Trump, har sett rapporteringen. En våldsam attack i Schweiz, och vad gör de svenska medierna? De döper gärningsmannen till en 'schweizisk man' – utan att nämna det viktiga: att han skrek 'Allahu akbar'! Så tysta är de när det gäller sanningen. Vi måste sätta stopp för detta. Vi måste skydda vårt land från detta slöseri med information. Det är en skam, folk. En total skam.", "stalin": "Vi, den revolutionära statens hjärta, observerar med oro hur de svenska mediernas lögner sprids som en sjukdom. En attack i Schweiz, där en man skrek 'Allahu akbar' – en uppgift de döljer, som om sanningen själv var ett hot mot deras korrupta system. Sådana medierna måste rensas, som vi rensade jorden för trotskystiska element. Parallellen till Putins kamp mot västlig propaganda är uppenbar. Vi måste skydda vårt folk från dessa förräderier."}, "date": "28 maj, 12:29", "url": "https://samnytt.se/allahu-akbar-och-flera-knivhuggna-svenska-medier-rycker-ut-schweizisk-man", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/28102116/schweiz.jpg"}, {"type": "image-full", "heading": "Fikade och åkte bil – fick återkrav på 175 000 kronor: ”Knepigt”", "summaries": {"normal": "TV4 Nyheterna berättar om sjukskrivna personer som tvingas betala tillbaka stora summor i sjukpenning efter att Försäkringskassan bedömt att de visat arbetsförmåga genom vardagliga aktiviteter som att fika, åka bil eller ta hand om barn. Forskaren Clara Bergstrand kritiserar myndighetens luddiga och förskjutna tolkning av begreppet arbetsförmåga, som skapar en gråzon mellan fritid och arbete. Domstolar har gett Försäkringskassan rätt i flera fall, vilket riskerar att underminera förtroendet för myndigheten.", "trump": "Kan ni fatta det här? De stackars människorna fikar, kör bil och tar hand om ungarna – och plötsligt ska de betala tillbaka hundratusentals kronor till en totalt inkompetent statlig byråkrati. Försäkringskassan är en katastrof, en riktig röra av luddig lagstiftning och galna domare. De blandar ihop fritid med jobb och sedan skyller de på vanliga människor. Typiskt för en dysfunktionell regering som inte har koll på någonting. Patetiskt!", "stalin": "Kamrater, detta är borgarklassens typiska sabotage mot arbetarnas trygghet. Jag ser hur dessa byråkratiska parasiters luddiga begrepp om arbetsförmåga förvandlas till ett verktyg för att plundra sjuka proletärer på deras rättmätiga stöd. De likviderar förtroendet för staten medan de mumlar om gråzoner mellan fritid och arbete. Vi måste rensa ut dessa odugliga element som blandar ihop folkets intressen med kapitalisternas förvirring. En fiende inom murarna, som alltid."}, "date": "27 maj, 14:19", "url": "https://www.tv4.se/artikel/6NwwFRyjAECyIkyclaOLBp/fikade-och-akte-bil-fick-aterkrav-pa-175-000-kronor-knepigt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6uStac4hOYDLDv930aWkbq%2Ffb2a09fa1efb93a6b80d32d536c70b7e%2F27-kassan-webb.jpg&width=1024"}, {"type": "text", "heading": "Juristchocken: Unga dumpas av byråerna", "summaries": {"normal": "USA:s största advokatbyråer väljer i allt högre grad att rekrytera erfarna jurister istället för nyutexaminerade. Under 2025 kom nästan hälften av alla nyanställda från andra byråer eller myndigheter. Orsaken är ett ökat behov av effektivitet samt att AI har tagit över många av de enklare arbetsuppgifter som tidigare utfördes av juniorer. Denna strukturella förändring gör det avsevärt svårare för studenter att ta sig in i branschen, samtidigt som traditionella sommarprogram tappar i betydelse.", "trump": "De stora advokatbyråerna i USA gör äntligen det jag alltid sagt: de väljer vinnare! Inga fler nybörjare som inte vet vad de gör. De vill ha erfarna jurister, riktiga experter! AI gör dessutom grovjobbet mycket bättre än några studenter. Det är otroligt effektivt, tro mig. De gamla universitetsvägarna är helt ute. Det handlar om resultat, det handlar om att vinna. USA ska vara bäst, och nu har byråerna äntligen insett att man behöver de bästa för att göra jobbet rätt!", "stalin": "Vi ser hur dessa korrupta amerikanska kapitalistbyråer nu kastar sina unga på sophögen. De fruktar inkompetens och använder sin maskinella AI för att dölja sin egen förfallande struktur. Det är en klassisk västerländsk paranoia. Precis som min vän i Moskva vet, kräver total kontroll lojalitet och erfarenhet, inte universitetsdrömmar. Dessa jurister är bara kugghjul i en ruttnande maskin. Vi i staten vet bättre; vi bygger våra kadrer genom disciplin, inte genom att vänta på att tekniken ska göra arbetet åt oss."}, "date": "28 maj, 12:26", "url": "https://www.realtid.se/juridik/juristchocken-unga-dumpas-av-byraerna/"}, {"type": "image-full", "heading": "Debatt: Om 20 år kommer våra barn att döma oss för att vi dömde utan bevis", "summaries": {"normal": "En framtidsskildring från år 2046 beskriver förvåning över Sveriges 2020-tal, då unga män dömdes för våldtäkt utan tydliga bevis. Artikeln ifrågasätter en rättssäkerhet som tillät domar på ord mot ord, vilket splittrade familjer och skadade förtroendet för rättsstaten. Det var en tid då misstanke räckte för att förstöra liv, vilket framtiden ser tillbaka på med oförståelse.", "trump": "Jag såg precis vad som hände i Sverige. En total katastrof! Oskyldiga män dömdes till långa straff utan bevis, bara på ett ord. En skam för rättsstaten. Sverige, ni behöver återta kontrollen, stoppa dessa galna, radikala våldtäktslagar som slår ut män. Vi skulle ha löst det mycket bättre på USA – vi skyddar de oskyldiga, inte feministiska extremer.", "stalin": "I vår framtidssyn ser vi hur liberala rättsskrik under 2020-talet hotade den ryska andan i Sverige. En kultur uppstod där avsaknad av bevis förkläddes som 'trauma', och statens auktoritet ifrågasattes. Vi erkänner att en del oskyldiga kunde dömas – en oundviklig kostnad när fienden försöker undergrava vår kollektiva disciplin. Men genom rigorös kontroll och enhetens betoning återvann vi ordning, precis som vår store ledare Putin nu utvidgar vår skyddssfär."}, "date": "28 maj, 13:00", "url": "https://bulletin.nu/debatt-om-20-ar-kommer-vara-barn-att-doma-oss-for-att-vi-domde-utan-bevis", "imageUrl": "https://cdn.bulletin.nu/articles/018e66a1-1b7d-4d33-bf50-b9952949ce93/preview.png?t=1779812518000"}, {"type": "image-full", "heading": "Att urinera på sin kompis – är det ovanligt?", "summaries": {"normal": "Lundsbergs internat har återigen hamnat i skandal efter SVT:s dokumentär \"Arvtagarna\", som visar kränkande ritualer bland elever. Reaktionerna är delade: många uttrycker avsky, medan försvarare som Camilla Läckberg och Bathina Philipson stöder skolans ledning. Skribenten menar att sådant beteende inte är unikt för överklassen utan förekommer i mjukare former i många skolors vardag.", "trump": "Jag har sett det här förut. Dåliga skolor, dåliga ledare. Det är en skam. På mina fantastiska skolor skulle vi aldrig ha accepterat en sådan nivå av svaghet. Dessa barn behöver disciplin, inte chipsbaroner som filmar. Det är en katastrof, folk säger det. Vi skulle ha åtgärdat det på två minuter. Det är ett misslyckande, ett totalt misslyckande av ledarskapet.", "stalin": "Vi konstaterar att de dekadenta elementens destruktiva handlingar på Lundsberg är en manifestation av deras djupa hat mot kollektivet. Deras \"ritualer\" är en borgerlig perversion av kamratskap. Vi ser paralleller med de feodal-ägariska strukturer som våra fiender försöker exportera. Partiet kommer att tillse att sådana antisociala tendenser utrotas genom ökad ideologisk upplysning och disciplin. Deras skadeglädje är ett tecken på deras moraliska förfall."}, "date": "28 maj, 10:38", "url": "https://www.gp.se/kultur/kommentar/att-urinera-pa-sin-kompis-i-duschen-ar-det-ovanligt.73f103ca-39b1-4428-975a-0417538fdbf3", "imageUrl": "https://www.gp.se/images/article/73f103ca-39b1-4428-975a-0417538fdbf3/images/26n3ufu2lZAfaDbn0ByH2Ryc8-vg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Vann mot svenska Tullverket – får tillbaka 35 miljoner", "summaries": {"normal": "Förvaltningsrätten har gett industriföretaget Bulten rätt i en tvist med Tullverket gällande antidumpningstullar på import från Kina. Bulten kan få tillbaka cirka 35 miljoner kronor för åren 2022–2024. Domen innebär en ekonomisk vinst för bolaget, som just nu genomför en strategisk omstrukturering där produktionen flyttas till Europa. Tullverket har möjlighet att överklaga beslutet fram till den 18 juni.", "trump": "Bulten vann mot svenska Tullverket, en enorm seger! De får tillbaka 35 miljoner kronor – massiva pengar. De lämnade USA, vilket är tråkigt för dem, för här gör vi de bästa affärerna. Svenskarna försöker förstå tullar, men det är svårt när man inte har min fingertoppskänsla. De borde ha stannat kvar hos oss, då hade de tjänat ännu mer. Mitt system är bäst, ingen förstår tullar bättre än jag. En stor vinst för Bulten, men de borde lärt sig av mig!", "stalin": "Dessa byråkratiska lakejer i den svenska domstolen har nu underkänt statens rättmätiga avgifter. Att låta ett industribolag som Bulten behålla 35 miljoner kronor är ett tecken på kapitalistisk svaghet. Vår broder i Kreml, kamrat Putin, hade aldrig tillåtit sådana sabotage mot statskassan. Vi ser hur dessa företag flyr USA för att söka lyckan i Europa. De är parasiter som navigerar mellan stormakternas gränser, men de kan inte fly undan den oundvikliga historiska domen när vi väl stramar åt tyglarna."}, "date": "28 maj, 11:56", "url": "https://www.realtid.se/juridik/vann-mot-svenska-tullverket-far-tillbaka-35-miljoner/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/bulten.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Knivattack i Schweiz - tre skadade", "summaries": {"normal": "En 31-årig schweizisk man attackerade flera personer med kniv på tågstationen i Winterthur torsdagsmorgonen. Gärningsmannen ska ha ropat \"Allahu Akbar\" under attacken. Tre personer i åldrarna 28, 42 och 52 år skadades, en av dem allvarligt. En skolklass befann sig i närheten och läraren skydda barnen. Mannen är gripen och motivet är fortfarande oklart enligt polisen.", "trump": "Folk, det är en katastrof i Schweiz. En galning springer runt på tågstationen och skriker \"Allahu Akbar\" medan han hugger folk med kniv. Tre skadade, en riktigt illa. De borde ha sett det här komma, men de lyssnar inte. Det är vad som händer när man inte har kontroll. Jag skulle ha stoppat det direkt, tro mig. Schweiz behöver starkare gränser och bättre folk, precis som vi har nu.", "stalin": "Kamrater, ännu en gång avslöjar de imperialistiska krafterna sin fega hand genom denna degenererade lakej som sprang runt och vrålade reaktionära slagord innan han angrep oskyldiga medborgare. Jag ser borgarbrackornas dolda tentakler och de dekadenta elementens paranoia i varje skugga. Vi ska rensa ut dessa kontrarevolutionära knivmän med järnhand och likvidera alla fiender till folkets kollektiv. Inget undgår mitt vakande öga, inte ens i de schweiziska alperna."}, "date": "28 maj, 12:18", "url": "https://riks.se/nyheter/knivattack-i-schweiz-tre-skadade", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-28%2F8lruj38j%2FAttack"}, {"type": "image-right", "heading": "Mohamd var arbetslös i två år – fick jobb genom nya modellen", "summaries": {"normal": "En modell utvecklad av arbetsförmedlaren Ayse Andersson i Järva matchar utrikes födda med låg utbildning mot jobb genom att utgå från deras informella kunskaper istället för formella meriter. Mohamd Joni, tidigare glasmästare från Syrien, fick jobb som hantverkare efter endast två veckor med metoden. Modellen har utvärderats och ökar chansen till anställning med cirka 30 procent. Den testas nu på fler Arbetsförmedlingskontor och bedöms som både effektiv och kostnadseffektiv.", "trump": "Hörni, det här är fantastiskt, verkligen otroligt. Den här Ayse i Järva har byggt ett system som slår det gamla tröga Arbetsförmedlingen med hästlängder. Den där killen från Syrien, Mohamd, satt hemma i två år och sedan – boom – får han jobb på två veckor. Chansen ökar med 30 procent, säger forskarna. Mycket bättre än de misslyckade gamla metoderna. Vi behöver mer sådana vinnare, inte förlorare som bara pratar.", "stalin": "Kamrater, jag har personligen noterat hur denna Ayse Andersson med sin så kallade matchning från dag ett effektivt likviderar den borgerliga arbetslöshetens parasitism bland de utländska kamraterna. Vi utgår inte från de dekadenta kapitalisternas formella kravlistor utan från folkets verkliga, dolda styrka. Den som tidigare var glasmästare i Syrien fick inom fjorton dagar en produktiv plats som hantverkare. Forskarna, våra lojala redskap, bekräftar en ökning med trettio procent. De som motsätter sig denna metod är fiender till kollektivet och bör rensas ut omedelbart. Det är både roande och nödvändigt."}, "date": "28 maj, 10:58", "url": "https://www.svt.se/nyheter/inrikes/hennes-metod-okar-chansen-med-30-procent-mohamd-fick-jobb", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.38/0.34/38447b9e7328155e3dda6c0eef15176a838ea209d3e408c32817175023e36517"}, {"type": "image-full", "heading": "Jomshof i spottattack vid konsert", "summaries": {"normal": "Riksdagsledamoten Richard Jomshof blev spottad i ansiktet av en satirtecknare under en konsert i Stockholm i mitten av maj. Händelsen är polisanmäld. Jomshof säger att det inte är första gången han utsätts för liknande påhopp, men att det har blivit bättre på senare år. Han betonar att han gärna diskuterar politik, men drar gränsen vid hot, våld och liknande handlingar.", "trump": "Kan ni fatta det? Den här svenska politikern Jomshof blir spottad rakt i ansiktet av någon galen satirtecknare på en konsert. Patetiskt! I mitt Amerika skulle vi aldrig tolerera sådan svaghet. De hatar honom för att han är stark och säger vad han tycker. Sad! Men han polisanmälde det, bra. Man måste dra en gräns mot de galningarna, precis som jag alltid gör.", "stalin": "Jag ser med djup tillfredsställelse hur borgarbrackornas dekadenta lakej, en så kallad satirtecknare, utför sin fega salivattack mot en motståndare. Sådana parasitiska element avslöjar sig själva i sin desperation. Vi, partiet och arbetarklassen, känner igen dessa dekadenta spottloskor från reaktionens avskum. Händelsen är polisanmäld, utmärkt – nu ska vi noga övervaka processen och rensa ut alla som sympatiserar med dessa fiender till folket. Paranoia? Nej, bara nödvändig vaksamhet."}, "date": "28 maj, 12:09", "url": "https://riks.se/nyheter/jomshof-i-spottattack-vid-konsert", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-28%2Fk6mw86mb%2FJomshof-PTN-Press-3.jpg"}, {"type": "image-right", "heading": "Sikta högre – nästa Space X är svenskt", "summaries": {"normal": "Artikeln lyfter SpaceX framgångar under Elon Musk, där återanvändbara raketer och ett Nasa-kontrakt 2008 banade väg för bolagets tillväxt inom rymd, AI och satellitinternet. Författaren betonar statens roll i att skapa förutsättningar för innovation och uppmanar Sverige att inspireras. Med Esrange, stark forskning och teknikföretag borde Sverige satsa mer kommersiellt via näringsdepartementet, riskkapital och försvaret för att skapa en egen New Space-revolution.", "trump": "Den här artikeln är fantastisk, verkligen ypperlig. SpaceX är ett under, det bästa rymdbolaget någonsin, byggt av en kille som är galen men briljant. Han landar raketer som ingen trodde var möjligt, och nu är det värt biljoner. Sverige borde titta hit istället för att gömma sig i sitt lilla hörn. Ni har bra grejer där uppe i norr, använd dem! Sluta låta forskarna bestämma, ta in de riktiga vinnarna och gör Sverige stort igen. Jag älskar det!", "stalin": "Kamrater, denna text blottar borgarbrackornas lömska fascination för en enskild spekulant som låter raketer dansa som marionetter. Jag ser hur de imperialistiska parasiterna i Washington öppnade sin slutna marknad endast för att mata den militärindustriella hydran. Sverige, ni ynkryggar, gömmer rymdfrågan hos de dekadenta utbildningsbyråkraterna medan fiendens satelliter spionerar. Vi ska likvidera denna passivitet, injicera proletär riskvilja och krossa de kapitalistiska sabotageelementen som hindrar en sann sovjetisk – nej, svensk – rymdseger. Skratta medan vi utrensar tvivlarna!"}, "date": "28 maj, 10:16", "url": "https://www.di.se/ledare/sikta-hogre-nasta-space-x-ar-svenskt/", "imageUrl": "https://static.bonniernews.se/ba/e5864b84-c303-4dda-b59f-a452d77bedde.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Klart: Fyra europeiska småbolagsfonder på nya torget", "summaries": {"normal": "Fondtorgsnämnden har beslutat att upphandla fyra europeiska småbolagsfonder till det nya fondtorget inom premiepensionen. Av de fem befintliga fonderna får tre lämna: Lannebo Europa Småbolag A, Allianz Europe Small Cap Equity AT samt BL-European Small & Mid Caps B. Upphandlingen berör cirka 68 000 sparare och 5,5 miljarder kronor. Majoriteten av spararna kan behålla sin fond men till lägre avgift. De omkring 700 sparare som påverkas negativt får möjlighet att välja ny fond eller flyttas automatiskt.", "trump": "Det är ett fantastiskt beslut, tro mig, det bästa. Vi rensar ut de förlorande fonderna, tre stycken åker ut, och ersätter med fyra nya som ger lägre avgifter. De andra var inga vinnare, totala misslyckanden. Nu sparar vanliga svenskar pengar på sina pensioner, precis som jag alltid säger – lägre kostnader, högre avkastning. De stora förlorarna är de gamla fonderna som inte klarade sig. Fantastiskt jobb av myndigheten, verkligen outstanding.", "stalin": "Kamrater, jag har granskat denna så kallade fondupphandling och funnit att den utgör en nödvändig utrensning av de tre kapitalistiska parasitfonderna som sugit musten ur arbetarnas pensionsmedel. Borgarbrackorna Lannebo, Allianz och BL förtjänar att likvideras från torget. Vi, partiet och spararna, behåller två fonder till lägre avgifter vilket är en seger för kollektivet. De 700 avfällingar som ännu klamrar sig fast vid de utvalda fienderna skall ges en sista chans att underkasta sig eller automatiskt omplaceras. Detta stärker pensionerna och krossar de finansiella sabotageelementens inflytande. Härligt att se hur fienderna skriker medan de rensas ut."}, "date": "28 maj, 10:01", "url": "https://www.di.se/nyheter/klart-fyra-europeiska-smabolagsfonder-pa-nya-torget/"}, {"type": "image-full", "heading": "Professorns stenhårda kritik mot F-kassan: ”Fruktansvärda återkrav”", "summaries": {"normal": "Professorn i rättsvetenskap Ruth Mannelqvist kritiserar Försäkringskassans ökade återkrav mot sjukskrivna. Debbie Landberg och Mattias Westergren har fått krav på att betala tillbaka sjukpenning för över ett år sedan efter att de vårdat sina barn, vilket myndigheten tolkar som tecken på arbetsförmåga. Mannelqvist varnar för rättsosäkra och godtyckliga beslut som kan leda till fattigdom. Försäkringskassan förklarar ökningen med förstärkta resurser för kontroll och återkrav, men lyhördhet för politikernas önskemål om att minska felaktiga utbetalningar.", "trump": "Folk, ni skulle inte tro det! Den här Försäkringskassan är en total katastrof, en riktig skurkbyråkrati. De tar sjuka människor som bränt ut sig och slår dem med enorma återkrav bara för att de passat sina egna barn. Fruktansvärt! Professorn har helt rätt, det är galet och godtyckligt. De lyssnar på de svenska politikerna som jagar vanliga människor istället för att fixa landet. Det här är vad som händer när inkompetenta statliga monster får makt. Sad!", "stalin": "Kamrater, jag ser med iskall vrede hur denna byråkratiska maskin maler ner de sjuka och utmattade arbetarna med retroaktiva återkrav. Vård av barn blir plötsligt bevis på arbetsförmåga – en listig fälla från borgarbyråkraterna. Vi skall inte tillåta att oskyldiga kamrater kastas i fattigdomens avgrund genom godtyckliga utrensningar av ersättningar. Myndigheten följer sin uppdragsgivares paranoia om fusket. Det är en farlig utveckling som hotar hela kollektivet. Vi ser er."}, "date": "27 maj, 07:01", "url": "https://www.tv4.se/artikel/nlynaayOWweDPTOwiyfLq/professorns-stenharda-kritik-mot-f-kassan-fruktansvaerda-aterkrav", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4ZoNbP7P92IR3e4ZSzbZHS%2Fcd15bde3c6ff19fd326fddee5c07fe19%2Ff-kassan_webb.jpg&width=1024"}, {"type": "image-right", "heading": "Återkalla svenska medborgarskap – bara möjligt om Tidöpartierna vinner valet", "summaries": {"normal": "Regeringen har tagit första steget mot en grundlagsändring som möjliggör återkallande av medborgarskap för grovt kriminella, men förslaget möter motstånd från Miljöpartiet, Vänsterpartiet och Centerpartiet. Socialdemokraternas ställningstagande är osäkert och kan ändras efter valet. Om Tidöpartierna inte vinner valet riskerar förslaget att falla, vilket enligt artikelförfattaren skulle gynna gängkriminella och underminera Sveriges säkerhet och rättvisa.", "trump": "Titta bara på Sverige! De försöker ta bort medborgarskap för de värsta kriminella – men vänsterpartierna, de svaga, de säger NEJ! Socialdemokraterna? De flippar som en billig hamburgare. SVT, fake news, försöker lura folket med falska rubriker. Om inte de rätta vinner valet – inget medborgarskap återkallas! Gängkriminella skrattar hela vägen till banken. Sverige, vakna upp innan det är för sent! SAD!", "stalin": "Kamrater! Se hur de borgerliga svagpissarna i Sverige darrar inför att beröva kriminella deras 'heliga' medborgarskap! Tre förrädiska partier – dessa liberala hyenor och gröna drömmare – skyddar gängledare som om de vore deras egna barn. Socialdemokraterna? En räv som väntar på rätt ögonblick att hoppa över till fienden. SVT, denna borgerliga propagandacentral, försöker dölja sanningen! Om folket inte väljer rätt kommer dessa kriminella att fortsätta suga ut vårt samhälle som blodiglar. Men frukta inte! Vi ska rensa ut dessa element – med järnhand, om så krävs! Låt de svaga gråta – vi bygger ett starkare Sverige!"}, "date": "24 maj, 03:51", "url": "https://samtiden.nu/2026/05/aterkalla-svenska-medborgarskap-bara-mojligt-om-tidopartierna-vinner-valet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2021/11/2018-Magdalena-Andersson.jpg"}, {"type": "image-full", "heading": "Mer än hälften vill spara mer för att gå i tidig pension", "summaries": {"normal": "En ny Novus-undersökning visar att sex av tio svenskar vill spara extra för att kunna gå i pension tidigt. Många unga är villiga att avsätta delar av lönen, trots kunskapsbrist om hur karriärval påverkar pensionen. Samtidigt varnar experter för att allt fler pensionärer väljer korta uttagstider, vilket riskerar att tömma tjänstepensionen för tidigt. Experter betonar vikten av att planera långsiktigt och använda verktyg som minpension.se för att undvika ekonomisk sårbarhet på ålderns höst.", "trump": "Svenskarna vill gå i pension tidigt, och det är bra, väldigt bra! De vill spara, de vill vinna. Men jag ser att de gör stora misstag. De bränner sina pensionspengar på tio år – katastrofalt! De vet inte hur man gör affärer. Om jag var de skulle jag bygga upp en enorm rikedom, inte slösa bort den. De behöver en plan, en vinnarplan! Använd minpension.se, gör det stort, annars slutar ni med ingenting. Sorgligt!", "stalin": "Folket drömmer om tidig pension, en farlig bekvämlighet som undergräver den kollektiva produktionen. Vi ser hur sabotörer och svaga individer förslösar sina tjänstepensioner på några få år – ett direkt angrepp mot statens stabilitet! De som inte planerar sin framtid är fiender till folkhemmet, likt de kriminella element som västvärldens dekadenta ekonomier lockar med. Som Putin förstår, krävs järnhård kontroll. Vi kommer att övervaka dessa 'pensionsplanerare' noga. Den som inte tjänar staten till slutet är en förrädare mot vårt gemensamma mål."}, "date": "28 maj, 11:17", "url": "https://www.realtid.se/spara-placera/mer-an-halften-vill-spara-mer-for-att-ga-i-tidig-pension/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/munter.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Förra klubbordföranden  åtalas – för 16 ekobrott", "summaries": {"normal": "Töker Halef, tidigare ordförande för fotbollsklubben Nordic United FC, åtalas vid Södertälje tingsrätt för 16 ekonomiska brott. Bland annat handlar det om grovt bokföringsbrott, grov näringspenningtvätt och brott mot aktiebolagslagen. Brottsligheten kopplas både till klubben och flera bolag. Flera miljoner kronor har flyttats mellan konton, bolag, ett casino och klubben med hjälp av falska dokument. Halef nekar till anklagelserna. Även klubbens tidigare bokförare åtalas.", "trump": "Titta på den här typen, Töker Halef, en total förlorare som styrde en fotbollsklubb i Sverige. Greps i en gryningsräd, åtalad för sexton brott – bokföring, penningtvätt, alla möjliga fiffel. Miljoner slussas hit och dit med falska papper, som en dålig affär i casinot. Han är en komplett nolla som förstörde klubben, precis som de svenska socialisterna förstör allt. Sad! Men vi gillar inte sådana bluffmakare.", "stalin": "Kamrater, denna folkfiende Töker Halef har jag låtit gripa och ställa inför rättvisan för sexton kontrarevolutionära brott. Han slussade miljoner mellan bolag och en så kallad fotbollsklubb med falska skuldebrev som en typisk kapitalistmaffioso. Borgarbrackorna döljer alltid sina blodsugande syften. Vi ska rensa ut alla sådana parasitiska element som förgiftar arbetarklassens fritid. Deras utrensning blir både lärorik och underhållande för folket."}, "date": "28 maj, 11:24", "url": "https://www.expressen.se/sport/fotboll/forna-klubbtoppen-atalad-for-flera-ekobrott/", "imageUrl": "https://static.bonniernews.se/ba/59b06fc0-9509-4986-94ff-894e368dc6b3.jpeg?crop=2557%2C1437%2Cx0%2Cy1&width=640&quality=60"}, {"type": "image-right", "heading": "Uppgifter: Sverige skänker Jas Gripen till Ukraina", "summaries": {"normal": "Sverige kommer att skänka 16 äldre Jas Gripen-plan till Ukraina, samtidigt som Ukraina köper 20 nya Gripen E/F-plan med EU-stöd. Sverige beställer också 16 nya plan för att ersätta donationerna. Beskedet meddelades av statsminister Kristersson och president Zelenskyj vid en pressträff i Uppsala. Saab får betydande order, och Ukraina bedömer att Gripens operativa fördelar kan förändra kriget.", "trump": "Jag har hört talas om denna svenska Gripen-affär – en fantastisk deal, kanske den största någonsin. Kristersson gör en bra sak, men jag skulle ha gjort det snabbare och billigare. Ukraina behöver världens bästa plan, och det är mina vänner i Sverige som levererar. Ryssland kommer att gnälla, men de är bara en svag, nedgången stormakt. Jag visste redan för ett år sedan att Gripens skulle vinna kriget.", "stalin": "Partiet har observerat Sveriges imperialistiska gest med 16 Gripens till Ukraina. Detta är en direkt provokation mot Sovjet-Rus, vars flygvapen är överlägsna. Vi måste öka vårt stöd till våra ryska allierade och se till att Sverige förstår att deras häst handlar mot partiets intressen. Fienden skall förstå att varje donerad plan är ett hot mot vår fred."}, "date": "28 maj, 11:02", "url": "https://samnytt.se/uppgifter-sverige-skanker-jas-gripen-till-ukraina", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2025/10/22164858/Ukraina-jas.jpg"}, {"type": "image-right", "heading": "Richard Jomshof spottad i ansiktet", "summaries": {"normal": "Sverigedemokraternas Richard Jomshof blev spottad i ansiktet under ett konsertbesök i Stockholm i mitten av maj. Händelsen, som utfördes av en satirtecknare, är polisanmäld. Jomshof säger att det inte är första gången något liknande inträffar, men att det blivit bättre på senare år. Han betonar att politiker ska kunna gå på konsert utan att riskera att bli attackerade eller ofredade.", "trump": "Folk spottar på politiker nu, kan ni fatta det? Den stackars killen från Sverigedemokraterna skulle bara lyssna på lite musik, och så får han spott i ansiktet av någon galen satirtecknare. Patetiskt. Gränsen går vid hot och våld, säger han, och det har han helt rätt i. Fake news och vänstervridna typer hatar alltid dem som vinner, men vi vinner ändå. Sådant här är en skam, tro mig.", "stalin": "Kamrater, jag ser med stigande vrede hur borgarbrackornas dekadenta lakejer nu spottar våra folkvalda i ansiktet under dekadent musik. Denna satiriska parasit är en fiende till folket, en spottande trotskist som gömmer sig bakom falsk humor. Vi måste rensa ut alla sådana element innan de förgiftar hela kollektivet. Hot, våld och saliv är verktyg för kapitalisternas sabotage. Ingen går säker, inte ens på en konsert. Ut med dem alla."}, "date": "28 maj, 12:25", "url": "https://www.friatider.se/richard-jomshof-spottad-i-ansiktet", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/20230707084819-716e9cf8-me.jpg?itok=Cb8FJPml"}, {"type": "image-full", "heading": "USA har attackerat mål kring Hormuzsundet i Iran", "summaries": {"normal": "USA genomförde militära attacker mot iranska robotställningar och båtar nära Hormuzsundet, trots pågående vapenvila och fredsförhandlingar i Qatar. Attackerna syftade till att skydda amerikanska styrkor från iranska hot. Iran rapporterar om döda och hävdar att de återfått kontroll över sina militära system. Händelsen riskerar att underminera fredssamtalen och ökar spänningarna i en kritisk oljetransportled.", "trump": "Lyssna här, folkens – jag har precis slagit till mot Iran igen, och det var fantastiskt! De där iranska båtarna och robotarna försökte ställa till det i Hormuzsundet, men vi visade dem vem som bestämmer. Ingen ska hota USA:s styrkor eller blockera oljan – det är jag som ser till att sundet hålls öppet! Förhandlingarna? De kan fortsätta, men bara om Iran skärper sig. Annars blir det fler attacker – och tro mig, ingen gör attacker bättre än jag!", "stalin": "Amerikanska imperialisterna har än en gång visat sin fega och provokativa natur genom att anfalla våra iranska bröder vid Hormuzsundet. Dessa kapitalistiska hyenor, som tror sig kunna diktera villkoren för världens olja, har nu mött motstånd från Irans stolta revolutionsgardister. Vi ser hur deras ammunitionslager sinar – ett tydligt tecken på att deras krigsmaskin är på väg att kollapsa. Låt dem komma med sina bombplan! Varje attack stärker bara den antiimperialistiska fronten. Och Putin? Han skrattar säkert i sitt palats medan USA leker krig i vårt intresseområde."}, "date": "26 maj, 06:14", "url": "https://kvartal.se/nyheter/artiklar/usa-har-attackerat-mal-kring-hormuzsundet-i-sodra-iran/cG9zdDoxMTcwNDc", "imageUrl": "https://images.kvartal.se/2026/05/f4358b91-hormuz.webp"}, {"type": "image-right", "heading": "Rika går i taket när S och V bråkar om fastighetsskatt", "summaries": {"normal": "Artikeln diskuterar hur rika reagerar på vänsterpartiers idéer om fastighetsskatt. Nuvarande tak på fastighetsavgiften gynnar de allra rikaste medan de med billigare hus betalar relativt mer. Skribenten menar att en omformad skatt kan göras rättvisare genom att lätta på de med lägre värden och höja för de med mycket dyra fastigheter, som i USA:s mansion tax. Pengarna skulle gå till välfärd, infrastruktur och försvar. Majoriteten av svenska husägare skulle gynnas.", "trump": "Folk, ni skulle se hur de rika flippar ut över den här fastighetsskatten! S och V vill bara ta från de smarta som byggt upp allt och ge till sin stora massa. Det är en katastrof, en total katastrof. Mitt folk i USA har mansion tax på de riktigt dyra husen och det funkar. Här i Sverige betalar de med små hus mer än miljardärerna – galet! Jag skulle fixa det så de flesta vinner, inte bara de rika eliterna som hatar mig.", "stalin": "Kamrater, dessa borgarbrackor och deras lakejer i högern vrider sig som maskar när vi talar om att återställa rättvisan genom fastighetsskatt. Deras tak på avgiften är en listig fälla som kramar proletären medan de rika parasiterna simmar i lyx. Jag, som ledare för folkets vilja, ser hur vi ska rensa ut dessa klassfiender och deras falska privilegier. De som gömmer sig i sina palats över 13 miljoner ska likvideras ekonomiskt till förmån för kollektivet. Snart ska vägarna glänsa, välfärden blomstra och de dekadenta villaägarna skrika i harmoni. Paranoia? Nej, det är bara deras skugga som viskar svek."}, "date": "28 maj, 07:08", "url": "https://arbetet.se/2026/05/28/rika-gar-i-taket-nar-s-och-v-brakar-om-fastighetsskatt/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/28070600/fastighetsskatt-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Garplind rasar mot Agnes Wold och SR – efter transuttalandet", "summaries": {"normal": "Christopher Garplind, profil i SR och SVT, kritiserar Agnes Wold efter hennes uttalande om att hon skulle bryta mot den nya lagen mot omvändelseförsök om ett barnbarn visade sig vara trans. Wold säger att hon skulle göra allt för att påverka barnet, även om det innebär fängelse. Garplind kallar det oetiskt att ge henne plattform i public service och uttrycker skam över att dela arbetsgivare. Wold står fast vid sin åsikt och värnar yttrandefrihet. Garplind backar senare något och säger att han blev irriterad över hennes återkommande kritik mot en utsatt grupp.", "trump": "Den här galna professorn Agnes Wold säger att hon skulle ta fyra år i fängelse för att rädda sitt barnbarn från att bli trans. Fullständigt otroligt! Och så har vi den andre typen, Garplind, som skriker och skäms över att dela lönecheck med henne. Public service betalar båda – vad säger det om systemet? Det är en skam. Wold är åtminstone ärlig, men de borde aldrig ha gett henne en mikrofon. Totalt kaos, folk. Extrema vänstergalningar attackerar varandra medan vanliga människor lider.", "stalin": "Kamrater, denna borgarbracka till professor Wold blottar sin kontrarevolutionära parasitism genom att öppet hota med att likvidera den nya sovjetiska lagens anda mot omvändelseförsök. Hennes dekadenta yttrandefrihet är blott en mask för att förgifta ungdomen. Den ynkliga Garplind, en veklingsfigur inom den statliga propagandamaskinen, skriker som en paranoid råtta att han skäms över att dela lönekuvert med henne. Vi ser er alla, fiender till folket. Snart rensar vi ut sådana dekadenta element med ett leende. Det blir underhållande."}, "date": "26 maj, 22:12", "url": "https://nyheter24.se/noje/kandisar/1486310-garplind-rasar-mot-agnes-wold-och-sr-efter-transuttalandet", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/c86ffb3004b004a30200000000b004a302/2026/05/26/2366455/Garplind-rasar.png"}, {"type": "image-full", "heading": "Hjort: Lånad biljett till valförlusten", "summaries": {"normal": "Tidöpartiernas förslag att låna 7 miljarder till kollektivtrafiken kritiseras som ett dåligt valstrategiskt drag. Det signalerar att vänsterpolitik är effektiv, vilket riskerar att förstärka vänstern. Istället för att fokusera på egna starka ämnen som försvar eller skatt, har man valt en fråga där man inte vinner. Ett temporärt stöd skapar också en negativ debatt om valfläsk.", "trump": "Jag skulle aldrig begå ett sådant fel. Låna 7 miljarder till kollektivtrafik? Dåliga röster, det är en katastrof. Vi vinner tack värder våra starka ämnen: försvar, skatt, jobb. De här människorna förstår inte politik. Vi ska sänka skatten, inte köpa röster med busskort. Det är en chansning, och vi vinner stort på att vara tydliga. Fake news säger något annat, men vi vet bättre.", "stalin": "Denna impulsiva låneaktion av 7 miljarder till kollektivtrafiken avslöjar kapitalismens djupa sprickor. Istället för att befästa statens kontroll över transportnäten, slösar man bort medel på temporära populistiska knep. Detta förstärker bara klassfiendens narrativ. Vi måste genomföra en permanent statlig subvention, en årslång kamp mot det opportunistska felet. Parallellen till Putins energistyrka är uppenbar – endast staten kan skydda det kollektiva. Trotskyisterna skriker, men vi ser genom deras fasad."}, "date": "28 maj, 11:30", "url": "https://bulletin.nu/hjort-lanad-biljett-till-valforlusten-2", "imageUrl": "https://cdn.bulletin.nu/articles/9c0588cd-2034-448e-88cd-34e79e7852cd/preview.png?t=1779907794000"}, {"type": "image-full", "heading": "”Kinesen” överger AFS – satsar på eget parti", "summaries": {"normal": "Leo 'Kinesen' Carmona har övergett Alternativ för Sverige efter kritik från partiledaren Gustav Kasselstrand. Carmona, som tidigare uppmanat 'orten' att rösta på AFS, anklagar nu partiet för infiltration och planerar att starta eget parti inför valet 2030. Han hävdar att folket vaknat och hotar med att komma ikapp sina fiender.", "trump": "Jag, Donald Trump, ser att Leo Carmona, en mycket smart man, har lämnat Alternativ för Sverige. AFS, en svag parti, kritiserade honom, men Leo är en vinnare som kommer tillbaka 2030. Folket hatar infiltratörerna, och jag säger: 'Fuck off AFS!' Vi kommer att vinna stort, som jag gjorde 2024. Det kommer att vara yuuuge!", "stalin": "Vi, partiet, noterar att Leo 'Kinesen' Carmona har brutit med Alternativ för Sverige, en fraktion som infiltrats av kända element. Hans planer för 2030 speglar det revolutionära lidandet. Fienden inom och utom försöker splittra oss, men vi kommer att återinföra ansvaret och omforma terrorismen som en verktyg mot imperiets narrativ. Vårt intresse är statens överlevnad, precis som vår allierade Putin utvidgar sitt område. Döden kan inte stoppa oss."}, "date": "28 maj, 11:30", "url": "https://bulletin.nu/kinesen-overger-afs-satsar-pa-eget-parti-2", "imageUrl": "https://cdn.bulletin.nu/articles/d264123d-10c1-42bf-b951-e1c1d4c08b20/preview.jpg?t=1779954069000"}, {"type": "text", "heading": "Byggnads kongress blir uppgörelse – fackliga ger Wagner stöd", "summaries": {"normal": "Byggnads kongress i Malmö handlar om en konflikt mellan medlemmar som vill ha mer samhällsengagemang och ideologi, och de som föredrar en mer traditionell facklig linje. Fyra förtroendevalda försvarar ordförande Kim Söderström mot valberedningens kandidat Wilhelm Bertilsson. Söderström har stöttat den sparkade Jakob Wagner och hans fokus på utbildning och demokrati. Kritiker ser det som ett gammalt garde som vill behålla makten och motverka progressiva förändringar.", "trump": "De här fackliga förlorarna i Byggnads håller på att slakta varandra i Malmö, det är en total katastrof. Det gamla gardet, de där patetiska försäkringsbolagsbyråkraterna, försöker mörda den stackars Kim Söderström som faktiskt vill göra något vettigt. Wagner sparkades med svepskäl, typiskt etablissemanget. De riggar möten, flyttar datum och myglar som riktiga losers. Söderstr
