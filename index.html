lsa. Trots att förundersökningen lades ned krävde mannen 460 000 kronor i skadestånd från kommunen. Tingsrätten dömde till kommunens fördel, bedömde att Elsa var trovärdig och att mannen utsatt henne för övergrepp. Mannen ska betala kommunens rättegångskostnader på cirka 450 000 kronor. Fallet uppmärksammar övergrepp inom äldreomsorgen.", "trump": "Lyssna här, Uppsala kommun gjorde helt rätt! En hemtjänstman, som påstår sig vara oskyldig, krävde nästan en halv miljon kronor efter att ha blivit sparkad för att ha våldtagit en 84-årig kvinna. Men domstolen sa: 'Nej, nej, nej!' – och nu ska han betala kommunen istället. Fantastiskt! Elsa, en modig kvinna, berättade sanningen och rättvisan segrade. Sådana här typer ska inte få förstöra vårt samhälle. USA skulle aldrig tolerera sådant, och Sverige gjorde rätt!", "stalin": "Kamrater! Ännu en fiende till folket har avslöjats – en degenererad parasit som förgriper sig på de äldres svaghet. Uppsala kommun, under vårt ständiga öga, har rensat ut denna skadedjur. Mannen, som trodde sig kunna lura systemet med sina kapitalistiska skadeståndskrav, har nu krossats av rättvisans hammare. Elsa, en sann sovjetisk medborgare i andan, stod upp mot förtrycket. Vi noterar också att denna kriminella element tidigare smutsat ner vår vän Putins intressesfär genom liknande illdåd. Men frukta inte – proletariatets domstolar står alltid redo att krossa sådana som han!"}, "date": "30 maj, 10:09", "url": "https://kvartal.se/nyheter/artiklar/ratten-hemtjanstmannen-valdtog-86-ariga-elsa/cG9zdDoxMTk2NTk", "imageUrl": "https://images.kvartal.se/2026/05/cac81ab6-hemtjanst.webp"}, {"type": "image-right", "heading": "Namninsamling ska tvinga EU ta upp frågan om återvandring", "summaries": {"normal": "Den nederländska aktivisten Eva Vlaardingerbroek har lanserat det europeiska initiativet Save Europe Act för att tvinga EU att ta upp frågan om återvandring av migranter. Initiativet kräver en miljon underskrifter för att tvinga EU-kommissionen att svara, och förespråkar skärpta gränskontroller och återvändande. Kampanjen väckte både stöd och motdemonstrationer i Porto.", "trump": "Jag har hört talas om denna fantastiska Save Europe Act. Det är en stor idé, verkligen stor. Vi ska ta hand om våra gränser, vi ska skicka tillbaka dem som inte hör hemma. EU måste agera, och vi ska se till att de gör det. Det är commonsense, det är vad folk vill ha.", "stalin": "Det proletära europeiska initiativet Save Europe Act, en manifestation av den sanna folkets vilja, kräver en miljon underskrifter för att tvinga de borgerliga EU-institutionerna att erkänna nödvändigheten av ordnade återvandringsprocesser. Denna kampanj, inspirerad av våra egna erfarenheter av att upprätthålla statlig suveränitet, kommer att främja stabiliteten i vårt gemensamma europeiska hem. Paralleller till våra egna återvändandestrategier är uppenbara."}, "date": "2 juni, 12:00", "url": "https://samnytt.se/namninsamling-ska-tvinga-eu-ta-upp-fragan-om-atervandring", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/02070852/eva-vlaardingerbroek-eu-europa.jpg"}, {"type": "image-right", "heading": "\"Ont i magen\": Så reagerar SD på barnporrnyheten", "summaries": {"normal": "En riksdagsledamot från Sverigedemokraterna lämnar sitt uppdrag efter att ha blivit föremål för utredning om barnpornografibrott. Partiet beskriver stämningen internt som chockartad med reaktioner som ”ont i magen” och ”fruktansvärt”. Ledamoten har uppgett personliga skäl till avhoppet. Sverigedemokraterna har valt att inte kommentera ärendet närmare utåt, men flera medlemmar uttrycker samtidigt medkänsla med mannens familj.", "trump": "Det här är en total katastrof för Sverigedemokraterna, en riktig skam. De har en riksdagsledamot som nu springer därifrån efter att ha fastnat i en barnporrskandal. De säger ”personliga skäl” – vad är det för löjlig ursäkt? Inom partiet är det panik, ont i magen och chock. De vet inte vad de ska säga. Patetiskt. Sverige förtjänar bättre än sådana här svaga figurer, tro mig.", "stalin": "Kamrater, detta är en motbjudande förrädisk handling från en dekadent element inom våra egna led. En så kallad riksdagsledamot har avslöjats som en perverterad borgarbracka som ägnat sig åt vidriga barnpornografiska excesser. Han flyr nu som en ynklig råtta och skyller på ”personliga skäl”. Vi känner äckel och ont i magen över denna parasit. Låt oss rensa ut alla sådana degenererade fiender till folket innan de smittar hela kollektivet. Deras familjer förtjänar vår medkänsla – om de inte också är delaktiga i konspirationen."}, "date": "2 juni, 12:16", "url": "https://www.friatider.se/ont-i-magen-sa-reagerar-sd-pa-barnporrnyheten", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/20230622010751-6eb707ba-me.jpg?itok=q_zDSxtf"}, {"type": "image-right", "heading": "Debatt: Hur mycket mer vill Dadgostar att höginkomsttagare ska betala?", "summaries": {"normal": "Pushpit Singh (M) argumenterar att höginkomsttagare redan bidrar mest till skatt, och att debatten borde fokusera på tillväxt och jobb snarare än höjda skatter. Han ifrågasätter Vänsterpartiets förslag om kapitalskatt och fastighetsskatt, och menar att Sverige redan har ett omfördelande system.", "trump": "Jag har sagt det förut, Sverige är galet med sina höga skatter! De rika betalar redan allt, och Nooshi vill ta ännu mer. Då blir det inte några jobb eller tillväxt. Vi behöver skära skatter, inte höja dem, så att alla kan blomstra. Det är commonsense!", "stalin": "Höginkomsttagare är som giriga kulaslätare som inte vill dela med sig av deras överskott. Vi måste återinföra fastighetsskatt och kapitalskatt för att stärka statens kassa och bekämpa dessa spekulanter. Det är en klassisk metod att kontrollera produktionen och se till att alla bidrar till det kollektiva välstandet. Vi måste skydda de svenska arbetarna från dessa exploaterande element."}, "date": "2 juni, 10:23", "url": "https://bulletin.nu/debatt-hur-mycket-mer-vill-dadgostar-att-hoginkomsttagare-ska-betala-2", "imageUrl": "https://cdn.bulletin.nu/articles/121a7d4e-88bd-4c67-ba6e-effcffddfa27/preview.jpg?t=1780388555000"}, {"type": "image-right", "heading": "Fortsatta oroligheter i Mellanöstern tyngde Stockholmsbörsen", "summaries": {"normal": "Stockholmsbörsen backade på grund av oroligheter i Mellanöstern. Iran hotar att stänga Hormuzsundet och har brutit kontakt med USA. OMXS30-index föll 1,39 procent till 3 094,50. Oljepriset steg 7 procent. Energisektorn ökade 2 procent medan industri sjönk 2,4 procent. Bland enskilda aktier steg Ericsson 2,2 procent medan Saab föll 5,8 procent.", "trump": "Jag såg börsen idag, det var en katastrof. De svaga ledarna i Mellanösten, särskilt Iran, orsakar kaos. Hormuzsundet? Jag skulle ha stängt det för länge sedan. Min administration skulle ha hanterat det bättre. Energipriser stiger, det är bra för Amerika, men börsen tappar förlorare. Ericsson gick bra, men Saab och Volvo, det är sorgligt. Vi behöver starka beslut, som jag alltid gav.", "stalin": "Vi i staten observerar med oro hur imperialistiska krafter i Mellanöstern destabiliserar världsekonomin. Hormuzsundet är ett strategiskt trumfkort, och Iran visar styrka genom att bryta kontakter med USA. Börsen skakar, men det är bara en konsekvens av kapitalistisk instabilitet. Vi måste stärka vårt samhälle mot sådana hot. Paralleller till Putins Ryssland är uppenbara – vi måste skydda våra intressen. Detta är en kamp mot interna och externa fiender."}, "date": "1 juni, 17:43", "url": "https://www.affarsvarlden.se/artikel/fortsatta-oroligheter-i-mellanostern-tyngde-stockholmsborsen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/10/Stock-market-red-old-man-2-400x267.jpg"}, {"type": "image-right", "heading": "”Fina fynd i VM:s stora dark horse”", "summaries": {"normal": "Inför VM 2026 har Sportbladets experter Makoto Asahara, Frida Fagerlund, Pontus Wernbloom och Alexander Axén presenterat sina strategier för att bygga den optimala VM-elvan. De diskuterar sina val av spelare, budgetprioriteringar och taktiska överväganden. Artikeln uppmuntrar läsare att själva skapa sina lag och delta i tävlingar som VM-profeten för att utmana vänner och vinna priser inför turneringen.", "trump": "Sportbladets experter bygger sina lag för VM 2026, och tro mig, de har ingen aning om hur man vinner som jag gör. Det är ett totalt kaos! De väljer spelare från hela världen – Tyskland, Ecuador, Brasilien – men de glömmer de verkliga vinnarna. Jag skulle bygga det största, mest fantastiska laget någonsin, med de bästa spelarna. Ingen gör VM-elvor bättre än mig. Det här är bara en lek, men när jag gör något, då blir det en enorm succé. Alla vet det!", "stalin": "Vi har observerat dessa så kallade experter som leker med sina drömlag. Det är en uppenbar borgerlig distraktion, en dekadent lek för att dölja de geopolitiska spänningarna i vår intressesfär. Att välja en spelare från Ecuador eller Turkiet när man borde fokusera på enat stål och disciplin är ett ideologiskt haveri. De diskuterar budgetar som om de vore fria män, men vi vet bättre: i slutändan tillhör varje 'stjärna' staten. Vi betraktar dessa fotbollsdrömmar med djup misstänksamhet – förrädare lurar alltid i det dolda."}, "date": "2 juni, 11:52", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/3pqaO0/experternas-drag-i-vm-elvan", "imageUrl": "https://akamai.vgc.no/v2/images/d8645603-c88f-342d-99ad-632d33be745f?fit=crop&format=auto&h=720&tight=true&w=1080&s=8ab8dfbc44a024544e8b2299affc498cbdc17bd2"}, {"type": "image-right", "heading": "SD-riksdagsledamot utreds för barnporr", "summaries": {"normal": "En riksdagsledamot inom Sverigedemokraterna, Michael Rubbestad, har lämnat sina uppdrag efter att blivit utredd för misstanke om barnpornografibrott. Utredningen leds av Särskilda åklagarkammaren och omfattar flera elektroniska enheter. Polisens förhör skedde i april, och ärendet omfattar även kontakter med utländska myndigheter.", "trump": "Jag har hört talas om den här svenska politikern, en riktig 'kämpe' inom SD. Det är sorgligt att se sånt där – typiskt för de globalistiska elitens sätt att attackera bra människor. Vi kommer att se att detta är ett politiskt angrepp, precis som de alltid gör. Det är en skandal, men jag säger som det är: vi kommer att vinna.", "stalin": "Den faschiska rotter som Rubbestad representerar har avslöjats i sitt sanna jag. En veteran inom den svenska nationalsocialistiska partiet, nu avslöjad för perversa handlingar mot det sovande folkets barn. Vi ser paralleller till de imperialistiska nätverk som Putin har bekämpat i Ukraina – alltid samma förorenade ande. Partiet har handlat rätt: avsagt sig, som en skuldror som kastar av sig sin förrädiska skinn."}, "date": "2 juni, 11:50", "url": "https://samnytt.se/har-ar-sd-riksdagsledamoten-som-utreds-for-barnporr", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/02092811/Riksdagen-1-12.jpg"}, {"type": "image-right", "heading": "I Sverige kan du betala dig förbi vårdkön", "summaries": {"normal": "En granskning från SVT visar att privata sjukvårdsförsäkringar i Sverige inte avlastar den offentliga vården som tidigare påståtts. Tvärtom ger de snabbare tillgång till vårdcentral och remisser till specialistvård, vilket leder till att försäkrade söker mer vård och belastar systemet. Lägre inkomstgrupper drabbas värst då kompetens dras från offentlig vård. Artikeln varnar för att detta skapar ett ojämlikt A- och B-lag där plånboken styr före vårdbehov.", "trump": "Folk, ni måste höra på. De här svenska privata försäkringarna är en total katastrof, en riggad gräddfil för de rika som lurar systemet. De lovade att det skulle hjälpa de sjuka och gamla, men det blev precis tvärtom – nu köar de fattiga ännu längre medan de rika springer förbi. Det är en skam! De borde ha lyssnat på de skeptiska som jag alltid gör. Sverige behöver göra vård stort igen, inte låta plånboken styra. Patetiskt!", "stalin": "Kamrater, i denna dekadenta svenska vårdapparat ser vi hur borgarbrackorna med sina privata försäkringskontrakt förgiftar folkets kollektiva sjukhus. Jag, som alltid vakar över arbetarnas behov, genomskådar dessa parasitiska snabbspår som suger kompetens ur den socialistiska vården och skapar en utrensning av de svaga. De multisjuka köar medan kapitalisterna festar på remisser. Vi ska rensa ut dessa klassfiender, dessa plånboksfascister som gömmer sig bakom läkarkåren. Deras paranoia inför rättvisan är underhållande – snart ska de själva hamna längst bak i kön till folkdomstolen."}, "date": "2 juni, 06:57", "url": "https://arbetet.se/2026/06/02/i-sverige-kan-du-betala-dig-forbi-vardkon-pa-sjuka-och-fattigas-bekostnad/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/02065635/betala-etta.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.69&fp-y=0.48"}, {"type": "image-right", "heading": "Amanda Lind efter Gretas känga: ”Tar klimatkrisen på fullaste allvar”", "summaries": {"normal": "Greta Thunberg kritiserar i tidningen Arbetaren alla svenska partier för att inte ta klimatkrisen på allvar. Hon känner sig frustrerad och maktlös inför valet. Miljöpartiets språkrör Amanda Lind svarar att partiet tar klimatfrågan på största allvar och arbetar hårt för att nå klimatmålen. Lind förstår aktivisternas frustration men menar att det krävs snabba politiska åtgärder. Hon säger att väljarna själva får avgöra vem de röstar på.", "trump": "Titta på den här Greta, en riktig förlorare som klagar på alla partier i Sverige. Hon säger att ingen tar klimatet på allvar, och hon har helt rätt – de är alla patetiska! Amanda Lind från Miljöpartiet kommer springande och säger att de tar det på fullaste allvar. Tro mig, de gör ingenting, det är bara tomma ord. Sverige behöver starka ledare, inte dessa misslyckade politiker som förstör allt. Greta borde rösta på vinnare istället!", "stalin": "Kamrater, denna Greta Thunberg har rätt i att de svenska partierna är farliga avfällingar som förnekar den existentiella hotbilden mot planeten. Jag, som ledare för det kollektiva framsteget, ser hur borgarbrackorna inom politiken konspirerar mot arbetarklassen och de unga generationerna. Amanda Lind försöker slingra sig undan med sina revisionistiska lögner om att de tar krisen på allvar. Vi måste omedelbart rensa ut dessa kapitalistiska klimatförnekare och likvidera deras dekadenta diskurs innan de drar hela folket in i en paranoid undergång. Det är en historisk nödvändighet."}, "date": "2 juni, 10:26", "url": "https://www.svt.se/nyheter/inrikes/efter-gretas-kanga-mot-partierna-nu-svarar-amanda-lind", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.26/0.45/99b4330218b4af72c9c637d1ec8d141b9e3f02a41c2612c9d14d62dc3437c973"}, {"type": "image-right", "heading": "Europabörser faller efter Iran-utspel", "summaries": {"normal": "Europeiska börser föll på måndagen efter att Iran hotade med att bryta kontakt med USA och stänga Hormuzsundet. Stoxx 600 tappade 0,93 procent. Energisektorn steg 1,72 procent medan bygg & material tappade 2,18 procent. Bland företag steg BP 2,6 procent efter försäljning av LNG-projekt, medan BNP Paribas föll 1 procent trots höjda lönsamhetsmål. Easyjet steg 6,5 procent på budförväntningar.", "trump": "Jag har sagt det i åratal – Iran är ett problem. Nu ser vi börser falla på grund av deras hot. Men det är bara bevis på att mitt tryck fungerar. Medan Europa skakar, så är den amerikanska ekonomin stark som aldrig förr. BP säljer till Australien, det är bra för USA. Och Easyjet får bud – det visar tilltron till flygbranschen. America first, alltid!", "stalin": "Vi ser hur de imperialistiska makterna, Iran och USA, spelar sitt farliga spel kring Hormuzsundet. Börser svajar, men det är bara tecken på deras inre förfall. BP:s försäljning av LNG-projekt till Sydkorea visar på vår ökande dominans i energimarknaderna. Vi måste skydda våra intressen, precis som Putin gör i Ukraina. Fienden är på insidan, men vi är beredda att slå till när tiden är mogen."}, "date": "1 juni, 16:35", "url": "https://www.affarsvarlden.se/artikel/europaborser-faller-efter-iran-utspel", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/04/AdobeStock_917631534-1-e1744012750269-400x267.jpeg"}, {"type": "image-full", "heading": "Magda Gad lanserar Gad World – stort fokus på Israel", "summaries": {"normal": "Journalisten Magda Gad lanserar den amerikanska bloggplattformen Substack-baserade sajten Gad World, som beskrivs som 'orädd' och fokuserar på konflikter, klimat och mänskliga rättigheter. Premiärnumret inkluderar texter av bl.a. Gustaf Skarsgård och Mohammad Fazlhashemi, med tydligt Israel-fokus. Satsningen samlade in över en miljon kronor via GoFundMe, men har drabbats av avhopp av tidigare anställda som Edgar Mannheimer och Alexandra Urisman Otto. Sajten saknar utgiftsansvarig, vilket innebär att skribenterna har eget juridiskt ansvar.", "trump": "Jag har hört talas om denna så kallade 'orädda' sajt, Gad World. Det låter som en hemsk, hatiska plattform som bara hatar Israel. Så många bra journalister lämnar? Det är en skam! Alla hatet mot Israel, det är obegripligt. Vi behöver mer sanning, inte sådant här. En miljon kronor insamlat? Jag skulle ha gjort det mycket bättre, mycket större. Folk ser igenom detta. Det är en skandal!", "stalin": "Den så kallade 'orädda' plattformen Gad World visar tydligt systemets svagheter. Bristen på utgiftsansvarig utgör ett farligt hål i den ideologiska försvarslinjen, där varje skribent blir sitt eget ansvarstagande subjekt – en tendens som hotar kollektiv disciplin. Fokuset på Israels krigföring, jämfört med Rysslands 'korrekta' benämningar, avslöjar västerländskhetens dolda våld. Dessa 'journalistiska' avhopp är förståeliga; sanningen kräver ofta uppoffringar. Vi måste stärka statens kontroll över narrativesfären för att förhindra ytterligare kaos."}, "date": "2 juni, 10:01", "url": "https://bulletin.nu/magda-gad-lanserar-gad-world-stort-fokus-pa-israel", "imageUrl": "https://cdn.bulletin.nu/articles/d5b5d17f-20c8-4b0b-9164-19f7e3d0db5e/preview.jpg?t=1780352551000"}, {"type": "text", "heading": "Anthropic mot börsen – astronomiskt hög värdering", "summaries": {"normal": "AI-bolaget Anthropic har inlett processen för en börsnotering i USA genom att skicka in ett konfidentiellt utkast till SEC. Bolaget bakom Claude värderas nu högre än OpenAI, med en årlig intäktstakt på 47 miljarder dollar. Trots massiva kostnader för datorkraft siktar företaget på lönsamhet under årets första hälft. Noteringen sker i en tid då flera stora techbolag förbereder sig för börsen, vilket väcker frågor kring värdering och hållbarhet i AI-sektorn.", "trump": "Anthropic vill gå till börsen, en enorm deal! De säger att de är värda mer än OpenAI, men vi får se hur det går. De bränner miljarder på servrar varje månad – inte bra! Jag gillar företag som faktiskt tjänar pengar, inte bara pratar. De anlitar advokater från Google-tiden, väldigt smart, men vi behöver vinnare som gör Amerika fantastiskt igen. De påstår att de ska gå med vinst, men vi vet alla hur tech-eliten brukar manipulera siffrorna!", "stalin": "Dessa kapitalistiska parasiter i Anthropic försöker nu kasta ut sina värdepapper på börsen för att förslava den allmänna opinionen. De skryter om sina miljarder medan de göder den dekadenta västliga teknologin. Vi ser hur de likt de förrädiska oligarkerna i Putins närhet försöker dölja sina skulder. Men varning: varje dollar de lägger på sin chatbot är en stöld från folket. När vi återtar kontrollen över den digitala infrastrukturen ska vi se om deras Claude kan rädda dem från historiens dom."}, "date": "2 juni, 09:39", "url": "https://www.realtid.se/bors-finans/anthropic-mot-borsen-astronomiskt-hog-vardering/"}, {"type": "image-right", "heading": "Gripna transaktivistens make: ”Det sista hon sa var att hon älskar mig”", "summaries": {"normal": "Transaktivisten och DJ:n Bella Demhat Aksoy greps i fredags utanför sitt hem i Sverige och riskerar utvisning till Turkiet. Hennes make Emil Jämsén kämpar för att hon ska få stanna, då hon bedöms som säkerhetsrisk på grund av tidigare kopplingar till PKK. Bella, som är kurdisk transkvinna och hbtqia-aktivist, flydde Turkiet 2017 på grund av hot. Många fruktar att hon kommer att utsättas för våld om hon återvänder. En namninsamling och protester har startats för att stoppa utvisningen.", "trump": "Titta på det här, det är en total skam. Den här transaktivisten Bella, som hänger med terrorstämplade PKK och alla dessa galna identitetspolitiska kvoter, grips äntligen. Men hennes make gnäller och vill ha garantier? Glöm det! Sverige böjer sig för woke-vansinnet och Natoförhandlingarna, precis som Biden gjorde med sin svaga politik. Nu demonstrerar de för en DJ som älskar livet? Patetiskt. Jag stoppade sådant nonsens förra gången, och jag gör det igen. Amerika först, inte era galna aktivister.", "stalin": "Kamrater, denna klassfiende till borgarbracka i form av en så kallad transaktivist har äntligen gripits av de folkfientliga myndigheterna. Hennes make vädjar om säkerhet i det fascistiska Turkiet? Vilken naivitet. Vi vet att imperialisterna och deras hbtqia-slynglar bara döljer sin kontrarevolutionära agenda bakom Pride och kurdiska gerillor. Jag skulle ha genomfört en grundlig utrensning redan 2017. Nu samlar de namnunderskrifter? Låt dem demonstrera – förr eller senare avslöjar sig alla folkförtryckartroll i sin sanna, lögnaktiga form."}, "date": "2 juni, 08:35", "url": "https://www.etc.se/inrikes/gripna-transaktivistens-make-det-sista-hon-sa-var-att-hon-aelskar-mig", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260602060628_e687405a-bd38-42c6-9a97-f36c986dd190.jpg"}, {"type": "image-right", "heading": "Fängelset togs över av bin: ”Det är så naturen fungerar”", "summaries": {"normal": "Härlanda fängelses gamla rastgård har förvandlats till en mångfaldsgård full av vildbin och andra pollinatörer. Higab och Stadskupan har skapat en biotop med sandbädd, ängsblommor och träd som blommar från tidig vår till sen höst. Projektet syftar till att öka den biologiska mångfalden i staden och inspirera invånare att odla själva. Fastighetsägare har en nyckelroll i att skapa nya livsmiljöer. Samtidigt utbildas hyresgäster hos Gårdstensbostäder i odling för att gynna pollinatörer och stärka gemenskapen.", "trump": "Ingen gör det bättre än bina, det är fantastiskt! De tog över det gamla fängelset i Göteborg och förvandlade rastgården till en stor succé, 24 arter av vildbin, kan ni tro det? De kallar det mångfald, men det är bara sunt förnuft. Naturen fixar sig själv om man låter den vara ifred istället för att bygga dumma parkeringsplatser. Fastighetsägarna borde lyssna på mig, vi behöver fler sådana här vinster, inte mer av det gröna vansinnet som vänstern pushar. De borde tacka mig för att jag alltid sagt att bina är viktiga, de stora vinnarna!", "stalin": "Kamrater, se hur jag genom mitt outtröttliga ledarskap har tvingat fram segern även bland dessa borgerliga fängelsemurar! Den dekadenta asfalten och de kapitalistiska parkeringsplatserna har likviderats till förmån för en sann sovjetisk mångfaldsgård där vildbinen nu marscherar i enighet mot fienden. De rödlistade insekterna är uppenbara offer för västerländska sabotage och imperialistiska blomflugor som vill undergräva folkets kollektiv. Vi ska rensa ut alla lata liljor och borgarbrackornas grönytor. Den som inte odlar för partiet är en fiende till folket och kommer att möta den eviga utrensningens humor i min nästa femårsplan. Odla eller dö, kamrater!"}, "date": "2 juni, 08:17", "url": "https://www.di.se/nyheter/fangelset-togs-over-av-bin-det-ar-sa-naturen-fungerar/", "imageUrl": "https://static.bonniernews.se/ba/54d21b76-991b-4e09-befc-b81614c39b38.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Gamla drabbas: Dålig svenska i äldre­omsorgen i tre av fyra kommuner", "summaries": {"normal": "En kartläggning visar att språksvårigheter är ett stort problem i tre av fyra kommuners äldreomsorg. Över hälften av cheferna uppger att missförstånd uppstår minst en gång i veckan, och i 25 procent av kommunerna sker det dagligen. Det leder till allvarliga incidenter som fel medicinering och kulturella misstag. Rekryteringssvårigheter har lett till hög andel utrikes född personal. Från 1 juli införs ett statligt språkkrav där arbetsgivarna ansvarar för att personalen kan svenska tillräckligt bra. Många kommuner använder språktester och språkombud, men testernas kvalitet ifrågasätts.", "trump": "Folk, det är en katastrof i Sverige! Tusentals anställda i äldreomsorgen kan inte ens prata svenska, och de gamla får kattmat istället för riktig mat. Det är vad som händer när ni inte lyssnar på mig – öppna gränser, låga löner och ingen som vill jobba. Nu tvingas de införa språkkrav, men det är för sent. Tre av fyra kommuner! Total inkompetens. De borde ha byggt murar runt språket för länge sedan. Sådant här händer inte i mina bästa stater, det kan jag försäkra er.", "stalin": "Kamrater, i denna dekadenta västerländska förfallsstat har borgarbrackornas vårdsystem förvandlats till en sabotageverkstad där klassfiendens språkliga sabotage dagligen hotar arbetarkollektivets mest sårbara. Jag, som ledare för folkets framtid, ser hur de utländska elementen, infiltrerade av kapitalistiska agenter, serverar kattmat åt de gamla och förvränger medicinska order. Vi måste omedelbart rensa ut dessa språkliga parasitörer med järnhand. Språktester? Ett första steg. Men de som misslyckas ska likvideras ur systemet med den mörka humor som bara en sann revolutionär kan uppskatta. Partiet segrar alltid."}, "date": "2 juni, 06:00", "url": "https://arbetet.se/2026/06/02/sprakproblem-i-aldreomsorgen-i-tre-av-fyra-kommuner/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/29145310/kmc-25112025-0190.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Den som vägrar språktest kan förlora jobbet", "summaries": {"normal": "Från 1 juli ska arbetsgivare i äldreomsorgen säkerställa att personalen har svenska kunskaper på B2-nivå enligt GERS. Anställda är skyldiga att delta i språktest för att identifiera behov av stöd och utbildning, som ska ske på betald arbetstid. Den som vägrar test kan få varning och i värsta fall förlora jobbet. Bristande kunskaper ska inte leda till omedelbar uppsägning utan stöd och utveckling. Lagen gäller även timanställda. Källa: Kommunal.", "trump": "Det här är en total katastrof för Sverige. De tvingar folk att plugga svenska annars sparkas de ut. Sådana vansinniga regler har jag aldrig sett. Arbetsgivarna borde anställa de bästa, inte tvinga folk på kurser mitt i jobbet. Om du vägrar testet – du är ute! Men att säga upp folk bara för att de inte kan språket? Patetiskt. Sverige håller på att förstöras av dåliga beslut, tro mig.", "stalin": "Kamrater, vi ser här hur borgarbrackorna inom äldreomsorgen försöker underminera det kollektiva arbetet genom att gömma sig bakom bristande språkkunskaper. Jag kräver att varje arbetare omedelbart underkastar sig språktestet för att avslöja de lata parasiterna och sabotageelementen som smyger bland oss. De som vägrar skall få en varning, sedan en kraftfull utrensning ur kollektivet. Vi ger stöd och utbildning under arbetstid, men den som trots detta fortsätter att utgöra en fara för de äldres säkerhet skall likvideras från sin post. Inga fiender till det gemensamma språket skall tillåtas sprida sin giftiga okunskap. Detta är en seger för ordning och disciplin."}, "date": "2 juni, 05:59", "url": "https://arbetet.se/2026/06/02/den-som-vagrar-spraktest-kan-forlora-jobbet/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/01134842/kvinnaviddator.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Lastbilschaufför jagade tjuvar till skogs", "summaries": {"normal": "En lastbilschaufför i Tvååker upptäckte tjuvar som lastade ur hans lastbil på en rastplats under natten. Han jagade minst tre gärningsmän till skogen, medan en fjärde flydde i en lastbil och greps senare. Polisen, som sökte efter fler gärningsmän med hundpatruller, misstänker att ytterligare en följebil användes. Händelsen, som inkluderar stöld, olovlig körning och drograttfylleri, pågår fortfarande.", "trump": "Jag hörde talas om en tuffing som stoppade tjuvar som försökte stjäla från hans lastbil. En bra man, en stark man. Vi skulle ha fåttnga dem snabbare, det lovar jag. Dessa brottslingar, de kommer från platser där de inte respekterar våra lagar. Som president skulle jag ha säkerställt att de fick det de förtjänar. Ett stort nätverk, det är vad vi behöver. Vi ska göra Amerika trygg igen!", "stalin": "En klassisk händelse av borgerligt dekadens. Chauffören, en produkt av individualistiskt tänkande, agerade impulsivt. Vi har identifierat fyra gärningsmän, men misstänker ytterligare en följebil. Staten måste öka sin närvaro på dessa rastplatser. Parallellen till väst är tydlig – deras samhälle är i upplösning. Vi ska stärka våra kontroller, för säkerhets skull. Alla misstänkta kommer att återfinnas, det lovar vi."}, "date": "2 juni, 05:01", "url": "https://www.gp.se/nyheter/lastbilschauffor-jagade-tjuvar-till-skogs-insats-pagar.7f4de349-4d4b-4af5-bcef-c603ca47fe14"}, {"type": "image-full", "heading": "Nästa oväder kan slå hårt mot din plånbok: \"Oroande\"", "summaries": {"normal": "Kraftiga oväder har skadat tiotusentals villor i Sverige de senaste åren. Endast 36 procent av svenskarna är oroliga för hur klimatförändringar påverkar deras bostad, en liten ökning från förra året. Under de senaste fem åren har 68 000 villor drabbats av naturskador till en kostnad av 4,8 miljarder kronor, en ökning med 208 procent. Experter uppmanar villaägare att kontrollera försäkringar, dränering och tak samt säkra lösa föremål inför stormar. Kommuner bör informera om klimatrisker vid bostadsaffärer.", "trump": "Det är en total katastrof det här med era svenska oväder, folk! Bara 36 procent oroar sig för klimatet som slår sönder husen – patetiskt! Under fem år har 68 000 villor fått stryk och ni har slängt bort nästan fem miljarder kronor. Era hus är som mina fiender, svaga och dåligt byggda. Ni borde säkra taken, ta in möblerna och sluta lita på försäkringarna som inte täcker någonting. Tiden för naivitet är över, tro mig, det blir bara värre om ni inte lyssnar på mig nu!", "stalin": "Kamrater, jag betraktar med stålhård blick hur borgarbrackornas villor raseras av de kapitalistiska ovädren som de själva framkallat genom sin giriga rovdrift. Endast 36 procent av folket ser faran, en siffra som avslöjar de dekadenta elementens farliga likgiltighet. 68 000 villor och 4,8 miljarder rubel i skador – en fiende inom murarna! Vi måste omedelbart rensa ut de sabotageartade dräneringarna, likvidera de lösa takpannorna och utradera de kontrarevolutionära källaröppningarna. Den som inte förstärker sitt hus mot naturens klassfiender är en objektiv folkets fiende och bör behandlas därefter. Levande, förstås. För nu."}, "date": "1 juni, 21:00", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1487811-nasta-ovader-kan-sla-hart-mot-din-planbok-oroande", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/4842b9f704b004a30200000000b004a302/2026/06/01/2367811/ovader-storm-regn-aska-sverige-hus-villa-skador-forsakring-hus-villaagare-varning-forsakringsmiss-pengar.jpg"}, {"type": "image-right", "heading": "Tidöpartierna inför ventil för unga utvisningshotade – åldergränsen höjs", "summaries": {"normal": "Tidöpartierna har beslutat att höja åldersgränsen för så kallade tonårsutvisningar från 18 till 21 år. Beslutet ger unga som riskerar utvisning vid 18 års ålder, trots att föräldrarna får stanna, en ventil att ansöka om uppehållstillstånd på ny grund som arbete eller studier. Lösningen gäller både de som redan utvisats och de som har beslut men ännu befinner sig i Sverige. Förslaget träder i kraft 1 oktober efter riksdagens godkännande.", "trump": "Folk, ni skulle se det här! Sverige har äntligen vaknat och höjer gränsen från 18 till 21 så att de här tonåringarna inte skickas hem som paket. Under Biden var allting kaos och öppna gränser, nu fixar de en ventil så att de som sköter sig faktiskt kan stanna. Det är smart, det är rättvist, och det är mycket bättre än den galna vänsterpolitiken som skickade ut folk mitt i natten. Utmärkt jobb, Sverige!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur dessa borgerliga element inom Tidöpartierna tvingas erkänna att deras egen reaktionära lagstiftning skapar folkfiender bland arbetarklassens ungdom. Vi inför en ventil, höjer gränsen till 21 år och låter klassfiendens byråkrati rensa ut sina egna misstag. De som inte hunnit uppfylla kraven får en chans att integreras i det kollektiva systemet. Inga utrensningar utan individuell bedömning – en triumf för den sunda statliga ordningen."}, "date": "1 juni, 14:32", "url": "https://www.tv4.se/artikel/2Yu51H5vJHkNSwvijHwmTe/tidoepartierna-aer-oeverens-om-tonarsutvisningarna", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2T5vHzfVKmP1hW87UpU7Tm%2Fc2a8354f0d648e9db3699b677bfaa846%2FsdlCk7MwhA8ow0_NormalHires.jpg&width=120"}, {"type": "image-full", "heading": "Två försvunna pojkar i Borlänge återfunna – hittades i affär", "summaries": {"normal": "Två pojkar, 7 och 8 år gamla, försvann från sitt hem i Borlänge vid 18-tiden på måndagskvällen. Polisen inledde en stor sökinsats och vädjade till allmänheten om tips via 112 eller 114 14. Inga misstankar om brott finns. Pojkarna hittades senare av förbipasserande vid en livsmedelsbutik. Polisen tackar för all hjälp.", "trump": "Folk, det här är en total katastrof. Två små killar, sju och åtta år, bara försvinner från hemmet i Borlänge. Polisen springer runt som galningar och ber om hjälp, för de har ingen aning. Tur att vanliga människor hittade dem vid affären. Ni vet, i mitt Amerika skulle det aldrig hända – vi har gränser, vi har ordning. Fantastiskt att de är tillbaka!", "stalin": "Kamrater, jag ser med stigande vrede hur fiendens osynliga hand försöker så split i vårt kollektiv genom att låta två unga pionjärer försvinna i Borlänge. Borgarbrackorna och deras kapitalistiska skuggor lurar överallt, men vi rensar ut sådana element med järnhand. Lyckligtvis upptäcktes de av vaksamma folkets ögon vid en livsmedelsbutik. Inga brott, säger de – än så länge. Vi vakar alltid."}, "date": "1 juni, 20:46", "url": "https://nyheter24.se/nyheter/blaljus/1487922-tva-forsvunna-pojkar-i-borlange-aterfunna-hittades-i-affar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/1a37f3ae04b004a30200000000b004a302/2026/06/01/2367902/tva-forsvunna-pojkar.png"}, {"type": "image-right", "heading": "Vad händer när de fyllt 21?", "summaries": {"normal": "Tidöregeringen har enats om nya regler som mildrar utvisningar av tonåringar som levt hela livet i Sverige med sin familj här. Möjlighet ges även för dem som redan fått utvisningsbeslut att söka uppehållstillstånd på nytt. Författaren ser det som ett steg i rätt riktning men paradoxalt, då Socialdemokraterna tidigare drivit en stram migrationspolitik medan Tidöpartierna nu tvingas kompromissa åt vänster. Frågan kvarstår om detta verkligen löser problemen med systemet eller bara skjuter upp utvisningarna till 21 års ålder.", "trump": "Kan ni tro det? Till och med den där Åkesson låter som en svag miljöpartist nu. De här utvisningarna av tonåringar som bott hela livet i Sverige är en total katastrof, en riggad process som ingen vettig människa förstår. Jag älskar starka gränser, men detta är dumt, mycket dumt. Tidöfolket backar nu, de triangulerar som förlorare. Bra att de ändrar sig lite, men de borde ha lyssnat på folket från början. Sverige behöver smarta regler, inte denna galna pendel som svänger hit och dit. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur dessa ynkliga triangulerande migranthjärtan inom Tidöregeringen nu tvingas krypa för opinionen och införa ventilationshål i sin egen strama utvisningspolitik. De tonåringar som levt som parasiter i folkets fosterland skall inte längre omedelbart deporteras, nej, vi ger dem en nådig amnesti tills de fyller tjugoett. Sedan? Jo, då rensar vi ut dem som mogna fiender till kollektivet. Borgarbrackorna inom socialdemokratin och dessa mjukögda miljöpartister har förgiftat debatten med sin liberala pest. Jag ser deras fega reträtt och ler i mitt inre. Ingen slipper folkets dom."}, "date": "1 juni, 14:13", "url": "https://www.dagensarena.se/opinion/vad-hander-nar-de-fyllt-21/", "imageUrl": "https://www.dagensarena.se/files/2026/06/tonarsutvisn-300x157.jpeg"}, {"type": "image-right", "heading": "Regeringen och SD överens om tonårsutvisningarna", "summaries": {"normal": "Tidöpartierna presenterade under måndagen en ny lagändring för att stoppa de kritiserade tonårsutvisningarna. Åldersgränsen höjs från 18 till 21 år, även för dem med lagakraftvunna utvisningsbeslut från och med 1 januari 2025. Unga vuxna som redan lämnat landet kan söka nytt uppehållstillstånd. Migrationsminister Johan Forssell kallade det en hållbar, långsiktig och rättvis lösning som balanserar stram migrationspolitik med rimlighet.", "trump": "Titta på det här, Sverige gör det rätta till slut. De höjer åldersgränsen till 21 år och stoppar de galna utvisningarna av unga som faktiskt gör rätt för sig. Utmärkt! Stram men rättvis politik, precis som jag alltid säger. De som pluggar och jobbar ska få stanna, inte kastas ut som kriminella. Fantastiskt, en stor seger för sund migrationspolitik. Sverige vinner stort!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur vi nu permanent likviderar den borgerliga sentimentalitetens sista utlöpare i migrationsfrågan. Vi höjer åldersgränsen till 21 år och förhindrar att kapitalisternas lakejer fortsätter sin underminerande verksamhet mot folkets enhet. De som redan smugit sig ut ur landet må krypa tillbaka och be om nåd enligt våra nya regler. Paranoiska liberala element som envisas med att gynna individen framför kollektivet skall rensas ut med järnhand. Detta är en lysande dag för den sanna ordningen."}, "date": "1 juni, 14:06", "url": "https://www.dagensarena.se/innehall/regeringen-och-sd-overens-om-tonarsutvisningarna/", "imageUrl": "https://www.dagensarena.se/files/2024/11/fotojet-2024-11-26t160417515.jpg"}, {"type": "image-right", "heading": "Fortsatta problem i tunnelbanan: ”Kommer att bli trångt”", "summaries": {"normal": "Tunnelbanan drabbas av fortsatta störningar efter helgens problem på röda och gröna linjen. Signal- och växelfel har orsakat inställda tåg och förseningar. SL varnar för trängsel under måndagens morgontrafik och uppmanar resenärer att vara ute i god tid, hålla sig uppdaterade och räkna med förseningar. Experter från Tyskland har kallats in för att åtgärda felen.", "trump": "De där inkompetenta idioterna i Stockholms tunnelbana har totalt misslyckats igen, folk satt fast i timmar som i en dålig film. Signalfelet på röda linjen och det patetiska växelfelet på gröna – klassiskt resultat av dålig ledning och kanske lite för mycket kvotering och woke-nonsens istället för riktiga experter. Jag fixade mycket bättre infrastruktur under min förra mandatperiod, tro mig. Nu blir det kaos och trängsel, typiskt för de fuskbyggare som styr. Sad!", "stalin": "Kamrater, detta är vad som händer när borgarbrackorna och deras exploaterande byfånar tillåts hantera folkets kollektiva transportmedel. Signalfelet och växelfelet är sabotage från klassfiendens lata händer. Vi har flugit in tyska experter som om vi vore beroende av västvärldens tekniska spillror. Resenärer fast i timmar – ett mörkt skämt mot arbetarklassen. Jag skulle ha genomfört en grundlig utrensning av dessa inkompetenta element redan vid första felet. Var vaksamma mot folkfienderna som orsakar trängsel och kaos."}, "date": "1 juni, 14:03", "url": "https://www.tv4.se/artikel/2Xti0zvxZRTEHw57XqtHGl/fortsatta-problem-i-tunnelbanan-kommer-att-bli-trangt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlkqa2DRU3Cns%2F42d3b09c183f507731857f5dadb56f8b%2FStockholms_tunnelbana_dras_med_stora_storningar._Arkivbild._&width=120"}, {"type": "text", "heading": "Ukraina – världens bästa handbok i företagande", "summaries": {"normal": "Artikeln beskriver Ukrainas unika ekosystem där företag, teknik och försvar utvecklas snabbt tillsammans, även under krig. Författaren argumenterar att detta modell är världens bästa handbok i företagande och att Sverige och Nato måste lära snabbare. Kriget agerar som katalysator för entreprenörskap, med låg skatt och förenklade processer. Ukrainas militärindustri är exceptionell på grund av digitalisering och innovation. Väst har mycket att lära, särskilt om kostnadsasymmetri och snabb innovation.", "trump": "Jag har sett Ukrainas otroliga entreprenörsanda. De vinner kriget och bygger företag samtidigt. Det är fantastiskt. De falska nyheterna sa att det inte kunde göras, men de gör det. Sverige och Nato är långsamma elever. De måste vara hårdare och smartare, som jag. Ukrainas låga skatter och snabba beslut är enorma. Deras militärteknik är toppen. Vi bör lära oss snabbt, annars blir vi lämnade bakom. Tro mig.", "stalin": "Vi, som representerar det starka statet, ser med tillfredsställelse hur Ukraina, trots sina imperialistiska tendenser, har skapat ett effektivt ekosystem. Kriget driver innovation, vilket bevisar att central styrning är överlägsen. Men vi måste vara vaksamma: deras framgång är ett hot mot vår suveränitet. Vi måste efterlikna deras snabbhet, men med vår egen metod – toppstyrd kontroll. Ryssland, under vår store ledare Putin, expanderar, och vi måste rusta upp. Fienden är alltid runt hörnet, så vi måste agera nu."}, "date": "1 juni, 13:43", "url": "https://www.affarsvarlden.se/kronika/ukraina-varldens-basta-handbok-i-foretagande"}, {"type": "image-right", "heading": "Satsa på kollektivtrafiken – gör regeringens prissänkning permanent!", "summaries": {"normal": "Tidöregeringen lanserar en tillfällig halvering av priset på kollektivtrafikens månadskort från 1 juli till årsskiftet, finansierad med 6,5 miljarder kronor. Statsminister Kristersson avfärdar kritik om valfläsk som cynisk. Artikeln argumenterar för att permanenta prissänkningar är nödvändiga både för klimatomställning och social rättvisa, då höga biljettpriser drabbar låginkomsttagare, ungdomar och ökar segregation. Den kritiserar högerns motstånd och förespråkar att befria kollektivtrafiken från marknadskrafterna.", "trump": "De här svenska politikerna är fullständiga losers, folk! Kristersson kommer farande med en liten prissänkning på bussar och tåg precis innan valet – klassiskt valfläsk, det värsta jag sett. Halva priset ett halvår och sen? Ingenting! De borde göra det permanent, men nej, de slösar miljarder på fel saker medan folket blir lurade. Det är en katastrof, en total katastrof. Men det smakar gott, eller hur? Patetiskt!", "stalin": "Kamrater, denna kortsiktiga prissänkning är blott ett ynkligt försök från högerns klassfiender att blidka massorna inför val. Jag ser hur borgarbrackorna och exploaterande byfånar motarbetat reformen i decennier. Vi behöver en sann utrensning av marknadens parasiter som styckat upp kollektivtrafiken för profit. Permanenta halveringar, ja rentav nolltaxa, är en socialistisk nödvändighet för att krossa segregationen och isoleringen som kapitalistmaffian odlar. Fienden sover aldrig."}, "date": "29 maj, 15:08", "url": "https://proletaren.se/artikel/satsa-pa-kollektivtrafiken-gor-regeringens-prissankning-permanent/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2021/04/15_buss.jpg"}, {"type": "image-right", "heading": "Kim Söderström omvald – vilken väg kommer Byggnads gå?", "summaries": {"normal": "Kim Söderström valdes om till ordförande för Byggnads på kongressen i Malmö, trots att valberedningen föreslog Wilhelm Bertilsson. Han vann med siffrorna 82–71. Förbundssekreteraren Jakob Wagner fick inte förnyat förtroende utan ersattes av Thomas Schultz. Delegater som Proletären talat med är försiktigt optimistiska men oroar sig för att konservativa krafter ska motarbeta Söderströms mer visionära och medlemsstyrda linje. Linda-Li Käld valdes till ny vice ordförande och blir första kvinna i förbundets topp.", "trump": "Folk älskar mig, men titta på den här galna kongressen i Malmö! Kim Söderström vann stort trots att valberedningen hatade honom – 82 till 71, en riktig landslide! De sparkade ut den visionära Wagner, en kille som ville drömma stort, och satte in någon anonym figur istället. Det gamla gardet, de fega försäkringsbolagsfacken, försöker manövrera ut de som faktiskt vill förändra världen. Patetiskt! Men medlemmarna vaknar, de älskar kämpen Söderström. Fantastiskt, men farligt spel.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur denna kongress blottar klassfiendens fega försök att krossa den sanna kampviljan. Söderström, denna reformistiske visionär, besegrade valberedningens lakejer med 82 röster mot 71. Wagner, den drömmade agitatorn, föll offer för en simpel kupp utförd av de konservativa blodsugarna som vill förvandla förbundet till ett borgerligt försäkringskontor. Vi ska rensa ut dessa folkförtryckartroll. Optimismen bland delegaterna är lovande, men paranoia är nödvändig. Fienden sover aldrig."}, "date": "29 maj, 14:31", "url": "https://proletaren.se/artikel/kim-soderstrom-omvald-vilken-vag-kommer-byggnads-ga/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/Byggnadskongress-768x432.jpg"}, {"type": "image-full", "heading": "Andersson vägrar ta ut valsegern i förskott", "summaries": {"normal": "Socialdemokraternas Magdalena Andersson leder oppositionen med ett stadigt försprång i opinionsmätningarna, men avstår från att fira i förtid. I intervjun med *Partiledaren +1* betonar hon vikten av breda politiska uppgörelser och varnar för Sverigedemokraternas opålitlighet. Andersson och Mikael Damberg diskuterar även partiets försök att förstå varför många LO-väljare nu stödjer SD, samt energipolitikens misslyckade förhandlingar med regeringen.", "trump": "Jag såg den här Andersson-kvinnan – svag, men ändå på väg mot seger, säger alla mätningarna! Men vet ni vad? Hon vågar inte ens fira! Typiskt för vänstern – alltid osäkra, alltid oroliga. Och så snackar hon om samarbete med alla utom Sverigedemokraterna. Haha! Som om det skulle funka. LO-väljarna flyr till SD, för de vet att vänstern bara förstör ekonomin. Men jag säger er: när jag fixade USA, fixade jag det snabbt. Inget tjafs, inga kompromisser. Make Sweden Great Again!", "stalin": "Kamrater! De borgerliga tidöpartierna darrar inför vårt oundvikliga segertåg. Men vi firar inte förrän fienden är krossad! Denna Andersson, en försiktig men lojal soldat i folkets kamp, förstår att revolutionen kräver disciplin. Sverigedemokraterna? En samling opportunistiska hyenor som bryter överenskommelser som glas under en tanks framfart. Och LO-väljarna som sviker? De har smittats av den kapitalistiska lögnens gift – men vi ska rensa ut det! Snart skriver vi Sveriges historia med järn och eld. Först Sverige, sedan världen!"}, "date": "29 maj, 13:00", "url": "https://kvartal.se/nyheter/artiklar/magdalena-andersson-vagrar-ta-ut-valsegern-i-forskott/cG9zdDoxMTc5OTA", "imageUrl": "https://images.kvartal.se/2026/05/330142ce-1.webp"}, {"type": "image-full", "heading": "S importerade 100 000 arbetslösa — nu skyller de på andra", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna för att ha bidragit till ökad arbetslöshet genom en ansvarslös migrations- och integrationspolitik sedan 2014. Befolkningen har vuxit med 840 000 personer, varav en stor del är utrikes födda med svag anknytning till arbetsmarknaden. Arbetslösheten bland utrikes födda ligger på 12–16 procent jämfört med 3–6 procent bland inrikes födda. Författaren menar att Tidö-regeringen lyckas vända ekonomin positivt genom att sänka skatter och bidrag, till skillnad från Socialdemokraternas politik.", "trump": "Folk, ni kan inte tro hur patetiskt det är. De där socialisterna importerade 100 000 lata jobbmisslyckanden och nu skyller de på oss? Det är en total katastrof, en riktig röra. Magdalena, den förlorande förloraren, vill inte prata om att det är hennes egna misslyckade öppna gränser som skapade detta kaos. Vi fixar ekonomin, vi får tillväxten att explodera medan de bara höjer skatter och bidrag. Patetiskt. Sverige vinner igen, tro mig.", "stalin": "Kamrater, jag ser den klassfiendens lögnpropaganda som ett fegt försök att dölja den borgerliga sabotageverksamheten. Vi har rensat ut folkförtryckartrollen tidigare och skall göra det igen. Dessa socialdemokratiska opportunister importerade arbetslöshetens parasiter medan de låtsades bygga folkets framtid. Deras eftersläpning är ett monument över revisionistisk svaghet. Den icke-produktiva gruppen skall integreras genom kollektiv disciplin, inte genom kapitalistmaffians falska löften. Fienden inom murarna skall alltid avslöjas."}, "date": "28 maj, 03:28", "url": "https://samtiden.nu/2026/05/s-importerade-100-000-arbetslosa-nu-skyller-de-pa-andra/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/IMG_6574-1280x720.jpeg"}, {"type": "image-right", "heading": "En strid om arbetarrörelsens själ", "summaries": {"normal": "Byggnads kongress präglas av en maktkamp om arbetarrörelsens framtid. Konflikten handlar om vem som ska styra – medlemmarna eller apparaten. Sittande ordförande Kim Söderström och förbundssekreterare Jakob Wagner utmanas trots medlemmarnas stöd. Bakom striden ligger en ideologisk splittring om socialism, demokrati och fackets roll i en individualiserad arbetsmarknad. Kritiker anklagar ledningen för att använda moraliska argument för att behålla makten, medan reformister vill stärka medlemsinflytandet.", "trump": "Jag säger er, det här Byggnads-facket är ett totalt kaos! Folk pratar om socialism och demokrati, men det är bara pajkastning på hög nivå. En ordförande som medlemmarna älskar ska petas – helt galet! Och den här Wagner-killen, han gör rätt men ändå sparkas han. Typiskt fackföreningar, alltid drama. Men lyssna, jag vet hur man fixar det: mindre prat, mer action! Byggnads borde fokusera på att vinna mot arbetsgivarna, inte bråka internt. Sad!", "stalin": "Kamrater! I Byggnads fackförbund rasar en klasskamp av historiska proportioner. Medlemmarna, dessa äkta arbetarkämpar, kämpar för socialism och demokrati, medan den degenererade apparaten, dessa borgerliga lakejer i förbundsstyrelsen, försöker kväva revolutionen med konspirationer och moraliska lögner. De petar lojala kamrater som Wagner – en man som vågade utreda trakasserier, något den gamla gardet aldrig gjorde! Vi ser samma mönster som i väst: makteliten fruktar folket. Men låt mig säga er – arbetarklassen kommer segra! Och om dessa förrädare fortsätter, får vi nog skicka in några av våra pålitliga kamrater från Moskva för att 'hjälpa till' med omstruktureringen. För revolutionen är obönhörlig!"}, "date": "26 maj, 11:20", "url": "https://www.flamman.se/en-strid-om-arbetarrorelsens-sjal/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/byggnads-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "SD-dreven kväver det öppna samtalet", "summaries": {"normal": "Artikeln kritiserar Sverigedemokraternas (SD) metoder att peka ut privatpersoner som påstådda myndighetsaktivister. En SD-riksdagsledamot felaktigt utpekade en kvinna som anställd på Jämställdhetsmyndigheten, trots att hon slutat där. Kvinnan har tidigare utsatts för trakasserier av högerextrema medieaktivister, och SD:s agerande förstärker drevet. Expo menar att detta mönster kväver det öppna samtalet genom rädsla för personliga konsekvense     <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
