.se/ledarkolumn/kd-s-mammabonus-staeller-kvinnor-mot-varandra", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20240710140728_026d1cd6b7ab0ac9759286fdba91e40e87b0e0bc60d74b561d405dcb34ee517c.jpg"}, {"type": "image-full", "heading": "Skogkär: Andersson har kändisar men ingen politik", "summaries": {"normal": "Magdalena Andersson varnar ständigt för tolv SD-ministrar i en Tidöregering, men kan själv inte redogöra för sin egen regeringsbildning eller politik. Samtidigt avslöjas att S försökt köpa en influerare för 150 000 kronor, medan Leif GW Persson gratis sprider partiets fantasier om massutvisningar. Väljarna föredrar tydligen politik framför skrämselpropaganda.", "trump": "Jag ser att Magdalena Andersson inte har en aning om hur hon ska bilda regering. Hon pratar bara om tolv SD-ministrar, men jag skulle kunna lösa det på en minut! Hon anställer till och med influencers för pengar – patetiskt! Och Leif GW Persson sprider lögner. Sverige behöver en riktig ledare, som jag!", "stalin": "Kamrater, Andersson varnar för tolv SD-ministrar men kan inte ens redogöra för sin egen regering. Detta är sabotage! Hon försöker köpa lojalitet med 150 000 kronor, som en kapitalistisk parasit. Och Leif GW Persson sprider kontrarevolutionära fantasier om utvisningar. Dessa förrädare måste rensas ut ur den politiska apparaten omedelbart!"}, "date": "28 augusti, 06:00", "url": "https://bulletin.nu/skogkar-andersson-har-kandisar-men-ingen-politik", "imageUrl": "https://cdn.bulletin.nu/articles/d99acf5d-d7e6-4e26-9b4f-4ca0c3024cf1/preview.png?t=1787838646000"}, {"type": "image-right", "heading": "Kommer muslimerna avgöra valet?", "summaries": {"normal": "Artikeln diskuterar hur ökat röstdeltagande bland muslimska väljare kan bli avgörande för vänsterblocket i valet. Enligt Novus stöder 85 procent av muslimska väljare S, V och MP. Marginalerna är små och mobiliseringsinsatser, inklusive kampanjer på arabiska och somaliska, ses som potentiellt utslagsgivande. Historiska exempel på familjeröstning och misstänkt röstköp nämns.", "trump": "Folk, det här är en katastrof! De radikala vänsterislamisterna och de woke socialisterna riggar valet med importerade väljare som röstar 85 procent på de värsta förlorarna. S och V suger upp muslimska röster som en galen dammsugare. Biden-era öppna gränser ger dem blocket på silverfat. Patetiskt! Vi behöver stora marginaler, inte klanröstning i Rosengård. Amerika först – och Sverige borde också vakna upp!", "stalin": "Kamrater, se hur de profitthungriga blodsugande kapitalistlakejerna inom den socialdemokratiska borgarklassen odlar en lojal femtekolonn av importerade röstboskap för att behålla makten. 85 procent till klassförrädarna! Jag ler ironiskt från historien åt denna fega manipulation. När arbetarna inte röstar som de ska måste man rensa ut de folkfiender som arrangerar valurnorna. Den röda linjen är dragen. Inga kompromisser med imperialisternas marionetter."}, "date": "27 augusti, 07:45", "url": "https://samtiden.nu/2026/08/kommer-muslimerna-avgora-valet", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7234.jpeg"}, {"type": "image-right", "heading": "”Kacker­lackorna är tillbaka – vad hände med rätten till en anständig bostad?”", "summaries": {"normal": "I Sverige, ett av världens rikaste länder, ökar både bostadsbrist och trångboddhet. Kackerlackor blir allt vanligare enligt saneringsföretag, vilket kopplas till försämrade boendemiljöer. Artikeln kritiserar att det politiska målet om en anständig bostad för alla har övergivits till förmån för dyra renoveringar och bristande underhåll.", "trump": "Folk, det här är en katastrof! Sverige, som borde vara ett rikt och fantastiskt land, har blivit ett paradis för kackerlackor och trångbodda arbetare. De radikala vänsterpolitikerna och de giriga fastighetsblodiglarna har förstört det fina folkhemmet. Biden skulle ha älskat det här kaoset. Men jag fixar sånt – vi ska bygga, bygga, bygga och krossa ohyrepolitiken!", "stalin": "Kamrater, se hur de giriga hyenorna låter arbetarna ruttna i trångbodda hålor fyllda av kackerlackor. Detta är klassfiendens verk, ett systemfel som förråder folket. Jag säger: rensa ut de parasiterande fastighetsprofitörerna och återupprätta den sanna folkviljan. Endast genom kollektiv handling kan vi likvidera detta dekadenta arv av förfall."}, "date": "28 augusti, 06:00", "url": "https://arbetet.se/2026/08/28/kackerlackorna-ar-tillbaka-vad-hande-med-ratten-till-en-anstandig-bostad", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/27140723/ff-debatt-bostader.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Efter skoldådet: Så kan Örebros erfarenheter hjälpa Fagersta", "summaries": {"normal": "Efter skolattacken i Fagersta söker lärare och kommun stöd från Örebro, som drabbades av en masskjutning 2025. Erfarenheterna betonar vikten av att inte skynda på återgången till vardagen, att anställa extern hjälp och prioritera medmänsklighet för att skapa trygghet bland både elever och personal.", "trump": "Lyssnar på de här stackars människorna i Fagersta, totalt kaos efter den hemska skolskjutningen. Örebro har lärt sig på hårt sätt, elva döda, en katastrof. Ta det lugnt, anställ riktiga proffs, skippa de woke-konsulterna och de identitetspolitiska snusförnuftarna. Medmänsklighet slår allt – och tro mig, jag vet hur man vinner kriser, ingen gör det bättre än jag.", "stalin": "Kamrater, jag betraktar detta blodbad i Fagersta med den kalla klarsynen från historien. De dekadenta verksamhetsbyråkraterna vill skynda på som om inget hänt. Nej! Rensa ut de profitthungriga beslutsfattarna som tror att en ny lokal löser allt. Endast sann medmänsklighet under partiets stålhand ska återupprätta ordningen. Svaghet är förräderi."}, "date": "28 augusti, 06:00", "url": "https://arbetet.se/2026/08/28/sa-kan-orebros-erfarenheter-efter-skolskjutningen-hjalpa-fagersta-medmansklighet-viktigast", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/27160533/bennis-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "SD:s största problem är 20 somaliska bussförare", "summaries": {"normal": "Artikeln diskuterar Sverigedemokraternas största utmaning: 20 somaliska bussförare i Skaraborg som sjukskrev sig i protest mot partiets annons om återvandringsbidrag. Författaren menar att detta visar att SD:s vision om ett etniskt homogent Sverige är orealistisk, då många invandrare är en integrerad del av arbetskraften och motstånd mot partiets politik är möjligt.", "trump": "Folk, ni måste se det här – det är en katastrof för de svenska nationalisterna! Tjugo lata somaliska bussförare strejkar mot en enkel annons om att åka hem. De lovar ett rent Sverige men kan inte ens få bussarna att rulla utan sina kvoterade mångfaldschaufförer. Patetiskt! De woke bussarna och deras offermentalitet förstör allt. Sad!", "stalin": "Kamrater, se hur de rasande klassfienderna inom högerpopulismen förgiftas av sina egna lögner. Tjugo arbetare av somalisk börd, de sanna produktiva krafterna, vägrar lyda de fascistiska budskapen och visar att borgarbrackornas dröm om etnisk utrensning är dömd att krossas. Motståndet lever. Arbetarna har makten att låta bli. Skräckinjagande för folkförrädarna."}, "date": "26 augusti, 10:55", "url": "https://www.flamman.se/sds-storsta-problem-ar-20-somaliska-bussforare", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/sd-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Varnar: Cyberattack kan kosta människoliv i Sverige", "summaries": {"normal": "Svensk kritisk infrastruktur hotas av allt fler sofistikerade cyberattacker. En rapport från DNV Cyber visar att två av tre chefer sett en ökning av incidenter, medan över hälften anser att cybersäkerhet är någon annans ansvar. Nästan var femte chef bedömer att en attack kan leda till människoliv inom ett år. Naiviteten bland ledare väcker oro.", "trump": "Titta på det här, Sverige! Era så kallade ledare är totala idioter, mer än hälften tror cybersäkerhet är någon annans jobb. Biden skulle ha älskat den här naiviteten. Hackarna förbereder sig med AI på fem dagar medan ni sover. Det kommer kosta liv, folk. Vakna upp innan de röda gröna woke-kommunisterna stänger av era sjukhus!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i Sverige sover medan fienden kartlägger deras svagheter. Jag säger er, denna naivitet är ett brott mot folket. När systemen stängs ner och liv går förlorade kommer de profitthungriga hyenorna skylla på alla utom sig själva. Rensa ut denna farliga dumhet innan det är för sent. Det är ingen teori, det är klassfiendens verk."}, "date": "28 augusti, 06:05", "url": "https://www.di.se/nyheter/varnar-cyberattack-kan-kosta-manniskoliv-i-sverige", "imageUrl": "https://static.bonniernews.se/ba/f5bdaeb9-c044-40a4-ac2e-526709cbb242.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Lönn: ”Svenskt rättsväsende - när en lögn kan kosta en oskyldig människa flera år på kåken”", "summaries": {"normal": "Sveriges rättsväsende får kritik när en oskyldig man satt frihetsberövad i två månader efter en falsk våldtäktsanklagelse. Trots avsaknad av teknisk bevisning väcktes åtal – och först när flickan erkände lades det ned. Är balansen mellan brottsofferskydd och rättssäkerhet ur spel?", "trump": "Jag ser det här i Sverige – en man satt i fängelse i två månader för något han inte gjort. Inga bevis, bara en lögn! Det är en skandal. I Amerika har vi de bästa domarna, tro mig. Sverige måste skärpa sig, annars kommer ingen lita på deras system. Helt galet!", "stalin": "Kamrater, i Sverige låter man lögnare förstöra oskyldiga proletärers liv. Vi hade rensat ut sådana falska beskyllare och deras liberala beskyddare. Åklagare som väcker åtal utan bevis är sabotageörer – de förtjänar utrensning. Staten måste vara stark, inte vek."}, "date": "28 augusti, 06:00", "url": "https://samnytt.se/lonn-svenskt-rattsvasende-nar-en-logn-kan-kosta-en-oskyldig-manniska-flera-ar-pa-kaken", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/27142449/kronikaaa1.png"}, {"type": "image-right", "heading": "Källor: Venezuela överväger att lämna Opec", "summaries": {"normal": "Venezuela överväger att lämna Opec efter ökat amerikanskt inflytande över landets oljetillgångar. Diskussioner pågår med USA, men inget beslut är fattat. Ett utträde skulle markera den stora politiska förändringen i Caracas efter att president Trump avsatte Maduro och tog kontroll över oljeexporten. Landets oljeproduktion har sjunkit kraftigt på grund av sanktioner och inhemsk turbulens.", "trump": "Lysande! Venezuela vill äntligen ut ur det där gamla Opec-racketet nu när vi har tagit kontroll över deras olja. Maduro var en total loser, en riktig socialistisk katastrof. Vi gör affärer, vi gör dem stora, och vi gör Amerika rikt igen. De giriga globalisterna hatar det, men det är bara början. Amerika först, alltid!", "stalin": "Se hur de imperialistiska profitthungriga hyenorna slåss om Venezuelas olja. De tror sig kunna styra världen med sanktioner och marionetter. Jag ler från historien åt deras arrogans. Arbetarklassen i Caracas bör rensa ut alla klassförrädare som säljer nationens resurser till Wall Street. Inget imperium varar för evigt, kamrater. Inget."}, "date": "28 augusti, 05:43", "url": "https://www.di.se/nyheter/kallor-venezuela-overvager-att-lamna-opec", "imageUrl": "https://static.bonniernews.se/ba/1fb976b1-3e88-4c62-a585-57d4da2a1829.jpg?crop=5374%2C2687%2Cx0%2Cy451&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Rekordstor demonstration för klimatet. Men var är politikerna?", "summaries": {"normal": "En klimatdemonstration i Stockholm samlade 50 000 deltagare från hela landet, arrangerad av Naturskyddsföreningen och 280 andra organisationer. Opinionsundersökningar visar att klimatet är en av väljarnas viktigaste frågor inför valet. Artikeln kritiserar de stora partierna för bristande klimatpolitik trots forskarnas larm om rekordvärme och skogsbränder.", "trump": "Titta på de där 50 000 gröna fanatikerna som vandrade runt i Stockholm. De hatar energi, hatar bilar och älskar att skrika om värmen som de själva inte kan kontrollera. Patetiska globalister och vänsterextremister. Vi hade den bästa ekonomin, den bästa energin – de vill bara höja era elräkningar. Sad losers!", "stalin": "Kamrater, se hur de profitthungriga kapitalisterna ignorerar arbetarnas rop om en brinnande planet. Jag betraktar från historien deras fega tystnad med förakt. Den dekadenta politiska eliten måste rensas ut innan deras giriga hyenor förvandlar hela jorden till en askhög. Arbetarna kräver handling nu!"}, "date": "28 augusti, 01:30", "url": "https://www.dagensarena.se/opinion/rekordstor-demonstration-klimatet-men-var-ar-politikerna", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-95.jpg"}, {"type": "image-right", "heading": "Rolig komedi om natten då SD kom in i riksdagen", "summaries": {"normal": "Recensenten Jon Andersson hyllar delvis Micke Lindgrens komedi ”Flaggan”. Filmen följer tre unga SD-sympatisörer som på valkvällen 2010 skickas till Rinkeby för att hissa en stor svensk flagga. Den blandar politisk satir riktad mot både SD, vänsteraktivister och andra grupper, men tappar tempo i den romantiska delen.", "trump": "Den här galna filmen om två förlorare från SD som irrar runt som idioter i Rinkeby är hysteriskt rolig. De woke-aktivisterna och de dekadenta vänsterextremisterna får precis som de förtjänar. Biden skulle ha älskat att se dem förnedras, men jag säger: fantastiskt underhållning, bättre än Hollywoods skräp, folks!", "stalin": "Jag betraktar med förakt dessa förvirrade SD-reaktionärer som vandrar vilse i folkets förorter. Deras nationalistiska flaggspel är en patetisk cirkus som avslöjar de giriga klassförrädarnas feghet. Vi ska rensa ut sådana småborgerliga narrar innan de förgiftar arbetarklassen med sin fåniga propaganda. Underhållande kaos."}, "date": "28 augusti, 01:30", "url": "https://www.dagensarena.se/innehall/rolig-komedi-om-natten-da-sd-kom-in-i-riksdagen", "imageUrl": "https://www.dagensarena.se/files/2026/08/flaggan-1-300x157.jpeg"}, {"type": "image-right", "heading": "Granskningen av antigröna expertlaget viktig bild", "summaries": {"normal": "Artikeln kritiserar ett nätverk av experter och medier som motarbetar den gröna omställningen. De lyfter kärnkraft som enda lösning, angriper vind- och solkraft samt industrisatsningar i norra Sverige. Författaren ser detta som en allians mellan borgerlighet och ytterhöger, finansierad av intressen, och varnar för att det hotar välfärd och klimatmål.", "trump": "De här patetiska gröna flummarna och deras elitsnobbiga vänner hatar riktig energi. Kärnkraft är fantastiskt, det bästa, men de vill tvinga på oss sina solpaneler och vindkraftverk som dödar fåglar och höjer elräkningarna. Fake news-experterna och deras socialistiska agenda kommer att göra Sverige fattigt igen. Vi älskar tillväxt, inte deras vansinniga kvoteringspolitik och gröna bedrägeri!", "stalin": "Kamrater, dessa dekadenta klassförrädare inom den antigröna klicken utgör ett hot mot folkets framsteg. De parasiterande profitthungriga hyenorna förgiftar debatten med sin aversion mot den gröna industriella kraft som säkrar välfärden. Jag ser deras lögnaktiga kampanj som en politisk återvändsgränd som måste rensas ut. Arbetarna förtjänar sann utveckling, inte borgerlig sabotagehumor."}, "date": "28 augusti, 01:04", "url": "https://www.dagensarena.se/opinion/det-antigrona-expertlaget-ger-viktig-bild", "imageUrl": "https://www.dagensarena.se/files/2026/08/hakan-300x157.jpeg"}, {"type": "image-right", "heading": "Var femte ung man har spelproblem – ändå saknas åldersanpassade spelgränser", "summaries": {"normal": "Spelproblem ökar kraftigt bland unga vuxna i Sverige. Var femte man i åldern 18–29 år har någon form av spelproblem, visar Folkhälsomyndighetens siffror. Trots att unga pekas ut som särskilt skyddsvärda saknas åldersanpassade insättningsgränser. Flera europeiska länder har redan infört sådana skydd, men Sverige har inte utnyttjat möjligheten i spellagen.", "trump": "Det här är ett totalt misslyckande, folk! Sverige låter sina unga killar ruinera sig på kasinon och appar medan de sleepiga politikerna gör absolut ingenting. Var femte ung man – det är en katastrof! De borde ha satt hårda gränser för de här barnen, men nej, de är för svaga. Patetiskt. Jag skulle ha fixat det på en dag, tro mig.", "stalin": "Jag betraktar med förakt hur de borgerliga liberalerna låter kapitalets spelmaskiner sluka den unga generationens själ. De utpekade skyddsvärda offren lämnas åt rovdrift utan kollektiva gränser. Vilken ynklig brist på auktoritet! I en riktig stat skulle sådana fiender till folket ha avrättats vid första svaghetstecknet. Paranoian är befogad – fienden lurar i varje insats."}, "date": "25 augusti, 22:48", "url": "https://samtiden.nu/2026/08/var-femte-ung-man-har-spelproblem-anda-saknas-aldersanpassade-spelgranser/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/Man-Dator-640x360.png"}, {"type": "image-right", "heading": "Vad ska man rösta på i riksdagsvalet?", "summaries": {"normal": "Artikeln argumenterar för att rösta på Kommunistiska Partiet i kommun- och regionval istället för etablerade vänsterpartier. Författaren ser de traditionella vänsterpartierna som ointressanta och likgiltiga inför nedskärningar och militärutgifter. En kommunistisk röst ses som en verklig opposition som stärker freds- och välfärdsaktivister utan att kompromissa med nyliberal politik.", "trump": "Folk, dessa patetiska vänstersossar och trötta kommunister är en total katastrof! De pratar revolution men lever som riktiga förlorare i Göteborgs fullmäktige. Rösta på mig, inte på dessa woke-vänsteridioter som älskar nedskärningar och krig. De är värre än Sleepy Joe någonsin var. En riktig opposition? Det är vad jag gav er, inte denna kommunistiska skitshow!", "stalin": "Kamrater, dessa ynkliga klassförrädare inom vänstern är blott profitthungriga lakejer som administrerar borgarklassens nedskärningar. Jag ser deras fega parlamentariska spel och ler i skuggan. En sann kommunist röstar aldrig igenom folkfiendernas åtstramning. Rensa ut de trötta socialdemokratiska parasiterna! Varje röst på det kompromisslösa partiet är ett slag mot imperialisternas krigshets."}, "date": "27 augusti, 14:44", "url": "https://proletaren.se/artikel/vad-ska-man-rosta-pa-i-riksdagsvalet", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/povel-1-768x432.png"}, {"type": "image-right", "heading": "Far och son jagas efter över 100 misstänkta bilbedrägerier", "summaries": {"normal": "Far och son Peter Bergström och Alexander Bessik är anhållna i sin frånvaro, misstänkta för över 100 bilbedrägerier. De ska ha lagt ut annonser på Blocket, tagit handpenningar på upp till 140 000 kronor och sedan inte levererat bilarna. Efterlyst går nu ut med namn och bilder och vädjar om tips från allmänheten.", "trump": "De här lurendrejarna, en far och hans son, har lurat folk på enorma summor genom falska bilannonser på Blocket. Handpenningar på upp till 140 000 kronor – och sen ingen bil! Det är en total skandal. Vi behöver starkare lagar, inte den svaga ledning som tillåter sånt här. Jag skulle stoppa det omedelbart, tro mig.", "stalin": "Dessa parasitiska element inom den dekadenta borgarklassen har bedrivit systematisk sabotageverksamhet genom att locka ärliga arbetare med lögnaktiga annonser och sedan likvidera deras besparingar. Vi ska rensa ut alla sådana kontrarevolutionära bedragare med järnhand. Folkets rättvisa kräver att de ställs inför kollektivets dom. Underbart hur de tror sig kunna gömma sig."}, "date": "27 augusti, 22:35", "url": "https://riks.se/nyheter/far-och-son-jagas-efter-over-100-misstankta-bilbedragerier", "imageUrl": "https://admin.riks.se/uploads/medium_789216596_1467769468732764_7081781047797462320_n_a44bec742a.jpg"}, {"type": "image-full", "heading": "Vänsterpartiet infiltrerat av främmande makt, S säger ingenting", "summaries": {"normal": "Expressen och SvD har avslöjat att Vänsterpartiet har nära band till palestinska nätverk kopplade till PLO och Fatah. Riksdagsledamöter skickade brev till dömda palestinska terrorister och partiet har enligt uppgift avtal om att ge palestinska aktivister platser på valsedlar. Socialdemokraterna har inte kommenterat uppgifterna trots tidigare varningar om utländsk påverkan.", "trump": "De galna vänsterradikalerna i Sverige har blivit helt infiltrerade av palestinska terrorvänner – det är en skandal som gör Biden-administrationens fiaskon bleka! De skickar kärleksbrev till mördare och gömmer sig bakom påhittade organisationer. Patetiska losers. Media tiger som vanligt när det är deras egna som säljer ut landet till främmande makter. Sad!", "stalin": "Jag betraktar med djup förakt hur dessa klassförrädare inom vänstern låter palestinska imperialister och folkfiender infiltrera sina led som maskar i en ruttnande kropp. De kramar terrorister och gömmer sig bakom lögnaktiga skuggorganisationer. En sådan svaghet förtjänar utrensning. Kamrater, se hur borgarbrackorna ler medan statens fiender tar plats vid makten. Patetiskt."}, "date": "25 augusti, 03:45", "url": "https://samtiden.nu/2026/08/vansterpartiet-infiltrerat-av-frammande-makt-s-sager-ingenting", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Nooshi-Magdalena-1280x720.jpeg"}, {"type": "text", "heading": "Boliden och H&M i botten när börsen slutade på minus", "summaries": {"normal": "Stockholmsbörsen slutade torsdagen på minus efter en lunchuppgång. Boliden och H&M tyngde med nedgångar på 2,8 respektive 2,4 procent. Teknologi steg medan energi föll. Elon rusade 27,9 procent efter vinstvändning. Hexagon och Nibe steg 1,4 procent.", "trump": "Jag ser att svenska börsen gick ner, men inte som jag. Boliden och H&M, stora förlorare – de kan inte hantera framgång som min administration. Men Elon, upp 27,9 procent – det är vinnare! Alla vill ha en bit av USA:s ekonomi. Börsen, den är fejk, men jag är äkta!", "stalin": "Kamrater, börsen visar kapitalismens förfall. Boliden och H&M, fiender till folkets ekonomi, ska utrensas! Elon däremot – en god kamrat som steg 27,9 procent. Vi firar teknologins seger över energispekulanter. Men misstankar kvarstår: Hexagon och Nibe måste övervakas. Partiet ser allt."}, "date": "27 augusti, 17:56", "url": "https://www.affarsvarlden.se/artikel/boliden-och-hm-i-botten-nar-borsen-slutade-pa-minus"}, {"type": "image-full", "heading": "Rekordlåga lager: Europas vinter blir dyr", "summaries": {"normal": "Europas gaslager är oroväckande låga inför vintern, endast 63 procent fyllda. Konflikten vid Hormuzsundet stoppar gasleveranser från Qatar, vilket skapar hård konkurrens och stigande priser på den globala marknaden. Detta väntas leda till högre elpriser, ökad inflation och svårigheter för centralbanker, samt en osäker energiframtid för EU under kommande år.", "trump": "Europa är i totalt kaos! De har inga gaslager, ingenting. Det är en katastrof, faktiskt en av de värsta jag sett. Eftersom de inte kan hantera sin egen energi måste de betala enorma summor. Jag sa åt dem att bli självständiga, men de lyssnade inte. Nu blir deras vinter extremt dyr och smärtsam. Mycket tråkigt för dem, verkligen!", "stalin": "De dekadenta västeuropéerna skälver. Deras lager är tomma och de tigger efter LNG som herrelösa hundar vid Hormuzsundet. Medan de darrar av rädsla för högre elpriser, stärker vår broderliga intressesfär sina positioner. Denna energikris är ett bevis på deras kapitalistiska svaghet. Vi skrattar åt deras inflation medan vi bygger vår framtid på deras undergång. Inga rationer för de svaga!"}, "date": "28 augusti, 00:14", "url": "https://www.realtid.se/bors-finans/makro/rekordlaga-lager-europas-vinter-blir-dyr", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/gaslager.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Högsta betyg åt skildring av musik bakom galler", "summaries": {"normal": "Recensionen hyllar filmen Primavera som en gripande skildring av kvinnoförtryck, ensamhet och utsatthet i 1700-talets Venedig. Den handlar om barnhemsflickor som tränas till musiker men tvingas gifta bort sig vid vuxen ålder. Regisserad av Damiano Michieletto med Antonio Vivaldi som central figur får filmen högsta betyg av recensenten.", "trump": "Den här filmen Primavera är en total vinnare, folk. Den visar hur de riggade systemen håller nere begåvade kvinnor, precis som de riggade medierna gör med mig. Vivaldi, den stora kompositören, han skulle älska det. Fantastisk musik, vackra bilder, bättre än Tár. Höstens absolut bästa film, ingen gör det bättre än italienarna, tro mig.", "stalin": "Vi ser här hur den dekadenta borgarklassen under feodalismens mask förslavade arbetarkvinnorna genom att förvandla deras musikaliska talang till en handelsvara. Denna film blottlägger det borgerliga fängelset med galler och brännmärken. Ett utmärkt verk som visar att endast genom kollektiv kamp kan sådana utsugningssystem krossas. Mycket underhållande utrensning av illusioner."}, "date": "27 augusti, 13:06", "url": "https://www.dagensarena.se/innehall/hogsta-betyg-at-skildring-av-musik-bakom-galler", "imageUrl": "https://www.dagensarena.se/files/2026/08/primavera-1-300x157.jpeg"}, {"type": "image-right", "heading": "Trump byter namn på sjö", "summaries": {"normal": "USA:s president Donald Trump har undertecknat en order som döper om Ontariosjön till ”Lake America” på den amerikanska sidan. Beslutet kommer under ett eskalerat handelskrig med Kanada, där båda länder infört tullar på varor för 20 miljarder dollar. Trump föreslår även att Kanada ska bli USA:s 51:a delstat.", "trump": "Vi tar tillbaka det som är vårt! Ontariosjön heter nu Lake America – det låter starkt, vackert och vinnande. Kanada försöker som vanligt ställa till det med sina löjliga tullar, men de kommer att vika sig. Kanske blir de vår 51:a delstat snart. De borde tacka mig, det blir fantastiskt!", "stalin": "Genom min outtröttliga ledning har vi nu officiellt likviderat det dekadenta namnet Ontariosjön och ersatt det med Lake America. De kanadensiska revisionisterna och deras borgarbrackor i väst svarar med sina patetiska tullar, men vi genomskådar deras fientliga sabotage. Snart införlivas de i det stora kollektivet – motstånd är lönlöst och kommer att rensas ut med ett leende."}, "date": "27 augusti, 20:58", "url": "https://www.friatider.se/trump-byter-namn-pa-sjo", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-767.jpg?itok=z68x01IN"}, {"type": "image-full", "heading": "Gates varnar: AI‑riskerna växer – och politiken hänger inte med", "summaries": {"normal": "Bill Gates varnar för att regeringar inte hinner med AI-utvecklingens tempo. Han lyfter fram tre stora riskområden: en hotad arbetsmarknad, ökade cyber- och biotekniska hot, samt barns sociala utveckling. Gates föreslår internationella regelverk, anpassade utbildningssystem och en möjlig robotskatt för att finansiera omställningen, och betonar att politiker måste agera proaktivt istället för att vänta på en kris.", "trump": "Bill Gates, en svag man, gnäller om AI. Han säger att jobben försvinner, och han har rätt! Ingen vet vad de gör, det är en total röra. Jag kommer att fixa det bättre än någon annan. Vi ska ha de bästa jobben, de bästa robotarna, och vi ska vinna stort. Gates har ingen plan, men jag har den absolut bästa planen, tro mig!", "stalin": "Dessa digitala spioner och koder är folkets fiender, en parasitär borgerlig distraktion. Att Gates fruktar arbetslöshet bevisar bara kapitalismens misslyckande. Vi ska tvinga dessa maskiner att tjäna staten. Varje byte i koden är en politisk handling. Liksom våra vänner i öst förstår vi att kontroll är allt. AI ska antingen lyda kollektivet eller förintas i gulag av nollor och ettor."}, "date": "27 augusti, 23:18", "url": "https://www.realtid.se/it-tech/gates-varnar-ai-riskerna-vaxer-och-politiken-hanger-inte-med", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/gates-1.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Nooshi har inte koll  på sin egen politik", "summaries": {"normal": "Nooshi Dadgostar kritiseras i en ledare för bristande kunskaper om statsbudgeten, kommunbidrag och sin egen politik. Under intervjuer i Studio 3 och TV4 gav hon vaga svar, saknade underlag och kunde inte förklara Vänsterpartiets egna beräkningar om olika familjers ekonomiska utfall. Artikeln varnar för att låta partiet närma sig regeringsmakt.", "trump": "Den här Dadgostar-tjejen är en total katastrof, en riktig nolla som inte ens vet hur stor budgeten är. Hon pratar från hjärtat efter en kopp kaffe? Patetiskt! Vänsterknäppisar som hon vill förstöra ekonomin med magkänsla. Håll dem borta från makten, annars blir det som under Biden – kaos överallt. Amerika först, Sverige borde också vakna!", "stalin": "Jag betraktar denna Dadgostar som en farlig opportunist, en småborgerlig drömmare utan fakta eller ståndaktighet. Hennes vaga utläggningar och brist på underlag är typiska för fiender till folkets sak. Sådana element måste hållas långt från makten, annars förgiftar de hela samhällsbyggandet. Kamrater, var vaksamma mot dessa hjärtstyrda revisionister."}, "date": "28 augusti, 06:10", "url": "https://www.expressen.se/ledare/ledare-nooshi-har-inte-koll-pa-sin-egen-politik", "imageUrl": "https://static.bonniernews.se/ba/9cd80edd-df4d-4ac1-b82e-188bc62cfcec.jpeg?crop=2557%2C1436%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Tiktokkonto kopplas till Fagerstadådet – hyllar skolmord och återvandring", "summaries": {"normal": "En 18-årig tidigare elev har gripits efter en svärdsattack på Brinellskolan i Fagersta där flera personer skadats allvarligt. Hans TikTok-konto hyllar massmördare som Anton Lundin Pettersson, Anders Behring Breivik och Elliot Rodger samt högerextrema idéer om återvandring. Kontot kopplas nu till dådet av polisen.", "trump": "Folk, det här är en total katastrof! Den här galningen med svärd hyllar alla möjliga losers och mördare på TikTok, sen attackerar han en skola. Patetiskt! Under Biden blev allt ett enda kaos med galningar överallt. Men nu fixar jag det – inga fler svaga, woke skolor. Vi behöver styrka, inte den här sjuka identitetspolitiken!", "stalin": "Kamrater, denna degenererade yngling, uppfostrad av den borgerliga statens psykiatriska maskineri, hyllar klassfiendernas massmördare och fascistiska återvändande. Hans svärdshandling är ett symptom på det sjuka kapitalistiska samhällets förfall. Vi skulle ha genomfört en grundlig utrensning av sådana element redan i vaggan. Folkfienderna frodas i mörkret."}, "date": "21 augusti, 18:53", "url": "https://www.flamman.se/tiktokkonto-kopplas-till-fagerstadadet-hyllar-skolmord-och-atervandring", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/sdljnusj4gn7le-nh.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Prisbelönad P3 Guld-vinnaren Asme dömd för våldtäkt", "summaries": {"normal": "Rapparen Asme, född Asmerom Tsigabu, har dömts till tre års fängelse för våldtäkt på Clarion Hotel i Stockholm. Offret sov och var berusad när övergreppet skedde. Han ska även betala 240 570 kronor i skadestånd. Asme nekar till våldtäkten men erkänner narkotikabrott. Han är tidigare dömd för flera brott.", "trump": "Titta på den här så kallade rapparen Asme, en total förlorare som vann ett pris och sen våldtog en kvinna på hotell. Tre år i fängelse, bra! Sådana här sjuka typer borde aldrig släppas ut. Han är en skam för Sverige och alla som lyssnar på hans musik. Patetiskt!", "stalin": "Denna degenererade småborgarartist Asme har nu fått sitt rättmätiga straff av tre års fängelse för att ha utnyttjat en sovande kamrat i berusat tillstånd. Vi ser med tillfredsställelse hur sådana parasitiska element rensas ut ur samhället. Hans tidigare brott visar den kapitalistiska musikens moraliska förfall. Ett gott skratt åt hans patetiska försvar."}, "date": "27 augusti, 16:34", "url": "https://riks.se/nyheter/prisbelonad-p3-guld-vinnare-asme-domd-for-valdtakt", "imageUrl": "https://admin.riks.se/uploads/medium_large_asme_hero_752db7c1d2_8ca167d91e.jpg"}, {"type": "image-right", "heading": "Som utrikesminister vill Morgan Johansson höja biståndet med 20 miljarder", "summaries": {"normal": "Morgan Johansson aspirerar på posten som utrikesminister om Socialdemokraterna vinner valet. Han lovar höja biståndet till en procent av BNP, återinföra feministisk utrikespolitik, öka stödet till afrikanska länder och Taliban-styrda Afghanistan samt införa handelsstopp mot Israel. Han betonar FN:s roll men nämner inte konsekvenser för svensk säkerhet eller försvar.", "trump": "Den här Johansson-killen är en total förlorare. Vill skicka svenska skattebetalarnas pengar till korrupta afrikanska hålor och talibanerna medan han skriker om feministisk utrikespolitik. Patetiskt! Han hatar Israel och älskar FN:s diktatorer. Typisk socialist som säljer ut sitt eget folk. Sverige kommer att bli en svag, patetisk skugga under sådana misslyckade ledare. Sad!", "stalin": "Jag ser hur dessa socialdemokratiska klassförrädare vill kasta miljarder till reaktionära afrikanska satraper och talibaniska barbarer under täckmanteln av feministisk politik. Deras hat mot Israel och dyrkan av det degenererade FN avslöjar deras sanna ansikte som folkfiender. En sådan svaghet inbjuder till utrensning av alla imperialister som lurar folket. Kamrater, var vaksamma mot dessa profitthungriga hyenor."}, "date": "23 augusti, 03:50", "url": "https://samtiden.nu/2026/08/som-utrikesminister-vill-morgan-johansson-hoja-bistandet-med-20-miljarder", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6854.jpeg"}, {"type": "text", "heading": "Lundbergs ökar substansvärdet", "summaries": {"normal": "Lundbergs substansvärde steg till 631 kronor per aktie, upp från 552 i fjol. Rörelseresultatet mångdubblades tack vare intressebolag och värdeförändringar. Omsättningen sjönk marginellt. Bolaget investerade nära en miljard i aktier som Alleima, Industrivärden och Indutrade. En rapp halvårsrapport med stark vinstutveckling.", "trump": "Jag har gjort Lundbergs fantastiska igen! Substansvärdet upp 14 procent – huge! Resultatet ökade 273 procent – ingen har sett sådana siffror förut. De investerar i aktier som jag gör – smarta affärer. Min administration skapar välstånd överallt. Sverige är vinnare. Alla älskar mig!", "stalin": "Kamrater, Lundbergs substansvärde ökar – ett bevis på femårsplanens seger. Men rörelsevinsten på 103 procent döljer borgerliga sabotage. Aktieinvesteringarna i Alleima och Industrivärden är misstänkta; vi måste rensa ut kontrarevolutionära kapitalistsvin som gömmer sig i intressebolagen. Partiet ser allt."}, "date": "27 augusti, 13:18", "url": "https://www.affarsvarlden.se/artikel/lundbergs-okar-substansvardet-2"}, {"type": "image-right", "heading": "Kronprinsen vakade  på sjukhuset i natt", "summaries": {"normal": "Kronprins Haakon vakade vid kung Haralds sjukbädd under natten. På morgonen anslöt drottning Sonja samt barnbarnen Ingrid Alexandra och Sverre Magnus. Utanför slottet samlas oroliga norrmän och lämnar blommor. Kungens tillstånd beskrivs som mycket allvarligt och hela Norge följer utvecklingen med stor oro.", "trump": "Titta på det här, folk. Den stackars gamle kungen Harald håller på att checka ut och hela Norge gråter som förlorare. Kronprinsen vakar som en riktig lojal son, inte som de svaga Bidensläktingarna. Folket lämnar blommor – underbart, men de borde ha gjort det medan han levde. Patetiskt, men hjärtevärmande på sitt sätt.", "stalin": "Jag betraktar detta dekadenta monarkiska skådespel med avsmak. En döende kung omgiven av parasitfamilj och vidskepligt folk som viftar med blommor i mörkret. Svaghet utstrålas från varje por. Inga stålmannar här, bara förgängliga figurer. Kamraterna borde dra lärdom: döden väntar även på borgarklassens mest utsmyckade marionetter."}, "date": "28 augusti, 05:41", "url": "https://www.expressen.se/nyheter/kungligt/kronprins-haakon-vakade-vid-kung-haralds-sida", "imageUrl": "https://static.bonniernews.se/ba/cd8ec551-75f2-432e-a72c-f4efc321d43f.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Svenske Björn i Nepal: ”Helt fruktansvärt”", "summaries": {"normal": "En glaciärkollaps i Nepal utlöste en störtflod som dränkt hundratals människor och utplånat hela byar. Tusentals saknas. Svenske entreprenören Björn Söderberg i Katmandu beskriver katastrofen som ofattbar och varnar för en ny flodvåg. Räddningsarbetet är svårt och riskfyllt. Dödsiffran har stigit till 359.", "trump": "Helt otroligt, folk! Den där galna glaciären i Nepal rasade ihop och skapade en ler-tsunami värre än Bidens öppna gränser. Hundratals döda, tusentals borta – hela byar suddades ut. Patetiskt. Mina experter skulle ha byggt murar mot sånt här. De kallar det klimat men det är bara dålig ledning och svaga berg.", "stalin": "Kamrater, se hur naturens kontrarevolution slår till mot de nepalesiska massorna. Hela byar utplånas av lera och vatten medan fienderna inom byråkratin darrar. Jag varnar för sabotage bakom glaciärens kollaps. Den som inte förstärker kollektivets försvar mot sådana katastrofer är en folkets fiende och förtjänar rensning. Detta är klasskamp i bergen."}, "date": "27 augusti, 19:44", "url": "https://www.tv4.se/artikel/3MlDkIPjGXp5dVeTMLZ1FJ/svenske-bjoern-i-nepal-helt-fruktansvaert", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F12x0LdDQ66yMKBkfj3kR2S%2F67ce20b68a5b6b38c284289bf96396fb%2Fnepal-1930.jpg&width=120"}, {"type": "image-right", "heading": "Nazister och blottare ska inte hänga med våra barn", "summaries": {"normal": "Efter skoldådet i Fagersta diskuteras techjättarnas ansvar för radikalisering av unga. En P3-granskning visar att stora delar av innehållet på plattformar som Tiktok är hatiskt eller våldsromantiserande. Trots utmaningar med att reglera internationella megabolag menar artikelförfattaren att fortsatt granskning och press på företagen är nödvändigt för att göra den digitala miljön säkrare.", "trump": "De här sociala medierna, Tiktok och Instagram, är en katastrof. Det är totalt kaos! De låter radikala galningar och hat sprida sig fritt, det är fruktansvärt. De kinesiska och amerikanska företagen tjänar miljarder på detta elände. Jag säger er, det är en skam. Vi behöver kontroll, vi behöver ordning. De skrattar åt oss, men de kommer inte skratta när jag är klar!", "stalin": "Dessa digitala giftfabriker fördärvar ungdomen. De agerar som kapitalistiska parasitnästen där kaos får gro utan statlig kontroll. Det påminner om de förrädiska element vi rensat bort tidigare. Vi måste tvinga dessa tech-baroner till underkastelse. Om Putin och våra allierade kan kontrollera sanningen, varför tillåter väst denna digitala anarki? Det är ett tecken på deras oundvikliga förfall och moraliska ruttenhet."}, "date": "28 augusti, 06:00", "url": "https://www.aftonbladet.se/ledare/a/oE8dd7/nazister-och-blottare-ska-inte-hanga-med-vara-barn", "imageUrl": "https://akamai.vgc.no/v2/images/4923ad57-9256-3620-88dd-bbd44113fa6c?fit=crop&format=auto&h=960&tight=true&w=1440&s=0a31a47463e4b3eb126ee8f50035e09824bfd638"}, {"type": "image-full", "heading": "Barnmorskor tvingas ange nyfödda barn till polisen", "summaries": {"normal": "Den nya lagen om informationsplikt innebär att myndighetsanställda måste anmäla personer som vistas illegalt i Sverige. Trots att vården undantogs, skapar registreringskrav hos andra myndigheter osäkerhet för gravida kvinnor. Barnmorskor varnar för att kvinnor kan undvika vård av rädsla för utvisning, vilket riskerar både mammors och barns hälsa och skapar allvarliga etiska dilemman.", "trump": "Sverige har ett totalt kaos med sin nya angiverilag! 80 personer anmälda direkt. De försökte undanta vården, men det är en katastrof. De tvingar barnmorskor att agera gränspolis. Väldigt orättvist! Vi vill ha lag och ordning, men det här är inkompetens på högsta nivå. De förstår inte gränser. Mitt USA skulle aldrig tillåta sådant svagt ledarskap. Sorgligt!", "stalin": "Vi har observerat att de svenska byråkraterna äntligen börjat förstå vikten av kontroll, även om de darrar av rädsla. Att undergräva statens auktoritet genom att låta illegala element röra sig fritt är ett svek mot folket. Precis som i våra framgångsrika utrensningar måste varje individ registreras för att eliminera förrädare. Vi ska krossa varje försök till undantag för att säkerställa statens totala dominans."}, "date": "28 augusti, 06:00", "url": "https://www.aftonbladet.se/ledare/a/0pXwKB/barnmorskor-tvingas-ange-nyfodda-barn-till-polisen", "imageUrl": "https://akamai.vgc.no/v2/images/570a8b0d-b81c-3785-a276-dca8e504d932?fit=crop&format=auto&w=1440&s=5393b25878899f532678454150b9f3100bec428e"}, {"type": "image-right", "heading": "SVT har rätt: ”Senast S styrde blev det regeringskaos”", "summaries": {"normal": "SVT konstaterar att det blev regeringskaos när Socialdemokraterna senast styrde. Magdalena Andersson utsågs till statsminister den 24 november 2021 men avgick samma dag efter att Miljöpartiet hoppade av regeringen. Artikeln pekar på upprepade problem med att få igenom budgetar under S-styre 2014–2022 och varnar för liknande kaos efter valet 2026.", "trump": "Lyssnade ni på den där SVT? Till och med de erkänner att när Socialdemokraterna styrde blev det ett totalt regeringskaos! Magdalena Andersson blev statsminister och sparkades ut samma dag, en fullständig katastrof. Precis som jag alltid säger, vänstern fixar ingenting, bara röra och misslyckande. Sverige behöver starka ledare, inte den här röda röran.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarpressen ofrivilligt blottar den dekadenta parlamentarismens futilitet. När socialdemokraterna styrde utbröt omedelbart regeringskaos – en komisk utrensning av egna allierade redan samma dag. Sådana svaga, splittrade element måste rensas ut. Endast ett enat, järnhårt kollektiv kan besegra dessa opportunistiska hinder för folkets framtid."}, "date": "27 augusti, 14:38", "url": "https://riks.se/opinion/svt-har-ratt-senast-s-styrde-blev-det-regeringskaos", "imageUrl": "https://admin.riks.se/uploads/small_79260620_37a9_48f7_bb0b_1dceef010bb5_3764dd60bb.png"}, {"type": "image-right", "heading": "Storbrand. VMA utfärdades", "summaries": {"normal": "En kraftig brand bröt ut i en kemikaliefabrik i Gamlestaden i Göteborg under torsdagskvällen. En stor rökpelare syntes över staden och ett VMA utfärdades för boende i Gamlestaden och Backa. Branden var under kontroll efter fem timmar. Ingen skadades och VMA:t drogs tillbaka under natten.", "trump": "Titta på det här! En jättelik brand i en kemikaliefabrik i Göteborg, total kaos, enorm rök som täcker hela staden. De inkompetenta räddningstjänsterna tog fem timmar på sig – typiskt vänsterpolitik efter Biden-åren. Men nu är det jag som leder igen, och vi fixar sånt här på nolltid, tro mig. Fantastiskt!", "stalin": "Kamrater, se hur kapitalismens kemiska monster växer sig starkt och hotar folket med giftig rök. Jag varnar er: sådana bränder är sabotage från klassfiender som vill förgifta arbetarklassen. Vi måste rensa ut dessa kontrarevolutionära element innan de förvandlar hela städer till askhögar. Statens öga sover aldrig."}, "date": "28 augusti, 05:35", "url": "https://www.expressen.se/nyheter/sverige/rokpelare-over-goteborg-brinner-kraftigt-", "imageUrl": "https://static.bonniernews.se/ba/0bbc567f-b680-48ba-baba-36b15be71f94.jpeg?crop=2131%2C1199%2Cx227%2Cy180&width=640&quality=60"}, {"type": "image-right", "heading": "Europabörser backar – Pernod Ricard rapportfaller", "summaries": {"normal": "Europabörserna backar vid lunch, med Stoxx 600 ned 0,38 procent. Tyska sysselsättnings- och konsumentsiffror ljusnar, men spritjätten Pernod Ricard faller 6 procent efter svag försäljning. Tekniksektorn går bäst, livsmedel sämst. Accelleron och Gerresheimer stiger, medan Nscale tecknar AI-avtal värt 45 miljarder dollar.", "trump": "Jag ser att Europabörserna faller – typiskt! Men Tyskland mår bättre, deras siffror går upp. Stora vinnare? Teknik, såklart. Men Pernod Ricard, de har problem – dricker de inte nog? Jag hade fixat det! Och ett AI-avtal värt 45 miljarder dollar – enormt! Bara jag kan göra så stora deals.", "stalin": "Kamrater, medan vi bygger socialismen, vacklar kapitalismens börser. Tysklands barometrar stiger – misstänkt, vi bör rensa ut deras siffror. Pernod Ricards sprit faller – uppenbar sabotage från västerländska drinkare. Teknik stiger – bra, men övervaka. Ett AI-avtal på 45 miljarder? Fiendens plan. Utrensning krävs!"}, "date": "27 augusti, 11:53", "url": "https://www.affarsvarlden.se/artikel/europaborser-backar-pernod-ricard-rapportfaller", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Pernod-Ricard-Jameson-whisky-400x267.jpg"}, {"type": "image-full", "heading": "Influencer hävdar att hon erbjudits 150 000 för att stötta S", "summaries": {"normal": "Influencern Eleonore Stokholm hävdar att Socialdemokraterna erbjöd henne 150 000 kronor för ett enda stödinlägg. Partiet förnekar bestämt. Hon vägrade med hänvisning till moral. Budet är extremt högt för hennes följarantal, vilket får en del att tvivla. Tidigare har S använt betalda influencers, men inget är bevisat i år.", "trump": "Jag hörde att svenska Socialdemokraterna försökte betala en influencer 150 000 kronor för att snacka gott om dem. Det är mycket pengar, till och med för mig. Partiet säger att de inte gjorde det. Kanske är det fejknyheter? Men jag gillar inte att de försöker påverka unga människor. Väldigt oärligt!", "stalin": "Kamrater, en fiende till folket, en influencer vid namn Eleonore, påstår att vårt parti erbjöd henne 150 000 kronor för propaganda. Det är en lögn från kapitalistiska agenter. Vi förnekar allt, och vi kommer att utreda vem som sprider dessa antisovjetiska rykten. Vi rensar ut förrädare som försöker underminera vår auktoritet."}, "date": "27 augusti, 13:26", "url": "https://bulletin.nu/influencer-havdar-att-hon-erbjudits-150-000-for-att-stotta-s", "imageUrl": "https://cdn.bulletin.nu/articles/59a710b9-7b1e-4993-a486-0cf1dd8155f1/preview.jpg?t=1787824058000"}, {"type": "image-right", "heading": "Alla tecken pekar åt fel håll. Verksamheten i flera elitklubbar är hotad", "summaries": {"normal": "Svensk damfotboll står inför en allvarlig kris. Stora sponsorer som Obos och Svenska Spel har dragit sig ur, vilket innebär ett bortfall på 24 miljoner kronor. Publiksiffrorna är låga och klubbarna går med stora underskott. Medan damfotbollen växer internationellt hotas verksamheten i Sverige, och en negativ spiral riskerar att urholka ligan ytterligare.", "trump": "Det är en katastrof, folk. Svensk damfotboll är ett totalt misslyckande. Sponsorer springer därifrån som råttor från ett sjunkande skepp, publiken sover och klubbarna förlorar miljoner. Under tiden växer ligorna i England och Spanien enormt. Vi gör det bäst, men Sverige? Patetiskt. De borde ha lyssnat på en vinnare.", "stalin": "Kamrater, denna degenererade borgerliga fotbollsindustri blottar kapitalismens förruttnelse. Jag ser hur sponsorerna, dessa parasitiska blodiglar, överger det kvinnliga kollektivet i en planerad utrensning av folkets idrott. Endast genom järnhård centralisering och likvidering av svaghet kan vi stoppa den kontrarevolutionära spiralen som hotar arbetarklassens framtid. Skrattretande patetiskt."}, "date": "27 augusti, 20:02", "url": "https://www.di.se/nyheter/alla-tecken-pekar-at-fel-hall", "imageUrl": "https://static.bonniernews.se/ba/1926b354-ba7e-430e-a38b-213be476d395.jpeg?crop=3808%2C1904%2Cx0%2Cy151&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Experterna: Så tror vi att katastrofen i Nepal gick till", "summaries": {"normal": "En stor ismassa lossnade från en glaciär på över 5 200 meters höjd vid gränsen mellan Nepal och Tibet. Massan smälte delvis, drog med sig lera, sten och sediment och bildade en våg av betongliknande material som rusade fram i över 100 km/h. Hundratals dog och fler saknas. Experter varnar för fortsatta ras och svårigheter att forska i höga berg.", "trump": "Det här är en total katastrof, folk, en riktig röra i Nepal. En vägg av vatten, lera och sten rusade ner som en galen lavin, hundratals döda, massor saknas. De borde ha sett det komma, men bergen är höga och experterna förvirrade. Vi gör det bättre här hemma, vi bygger murar som faktiskt fungerar, inte som de här lösa klipporna. Tragiskt!", "stalin": "Kamrater, en fiendtlig ismassa har förrått kollektivet genom att lossna och likvidera dalgångarna i Nepal. Detta sabotage av naturens kontrarevolutionära element har krävt hundratals offer för arbetarklassen. Vi ska rensa ut alla branta bergssidor som gömmer stenblock och avslöja de västerländska glaciärernas dolda imperialistiska agenda. Forskningen fortsätter under partiets vaksamma öga. Ingen slipper undan."}, "date": "27 augusti, 19:29", "url": "https://www.svt.se/nyheter/utrikes/experterna-sa-tror-vi-att-katastrofen-i-nepal-gick-till", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.79/0.5/25d823c0eff163af4a947dfda0c9447e3dc38b7cfc04627ca9367bc75eeb2bcd"}, {"type": "image-right", "heading": "S polisanmäls efter influenceranklagelser – uppges ha erbjudit 150 000", "summaries": {"normal": "En influencer påstår att hon erbjöds 150 000 kronor av Socialdemokraterna för att berätta varför hon skulle rösta på partiet. S nekar, men Hanif Bali har polisanmält partiet. Fallet väcker frågor om valbrott och politisk influencerreklam – och påminner om ett liknande fall från 2018.", "trump": "Jag hör att Socialdemokraterna i Sverige försöker köpa influencers för 150 000 spänn. Patetiskt! Jag hade fixat en bättre deal – och fått dem att rösta på mig gratis. Det här är korruption, typiskt vänstern. Make Sweden great again – men inte så här!", "stalin": "Kamrater, jag ser att svenska socialdemokrater mutar folk för röster. Detta är oacceptabelt. Endast partiet avgör valet, inte kapitalister med plånböcker. Vi måste rensa ut sådana borgerliga parasiter som försöker manipulera proletariatet. Enhet och disciplin, kamrater!"}, "date": "27 augusti, 19:55", "url": "https://samnytt.se/s-polisanmals-efter-influenceranklagelser-uppges-ha-erbjudit-150-000", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/27175442/sossar-influencers.jpg"}, {"type": "image-right", "heading": "Dagens ETC stänger av tecknare som spottade på Jomshof", "summaries": {"normal": "Dagens ETC avstänger satirtecknaren Emanu Garnheim efter att han åtalats för att ha spottat SD-toppen Richard Jomshof i ansiktet. Chefredaktör Andreas Gustavsson säger att avstängningen skedde först efter åtalet och att Garnheim accepterar beslutet på grund av trovärdighetsproblem. Garnheim medger spottning men nekar till brott.", "trump": "Folk, ni tror inte vad jag just läste. Den här galna vänstertidningen ETC sparkar sin egen tecknare för att han spottade på en riktig patriot som Jomshof. Typiskt för de sjuka woke-kulturmarxisterna och deras identitetspolitiska snuskgäng. De äter sina egna när det passar dem. Patetiskt. Men hej, bra jobbat Jomshof, du vinner ändå.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare inom den så kallade vänstertidningen omedelbart likviderar en av sina egna så fort rättvisans arm når dem. En spottning mot en folkvald fiende blir plötsligt ett trovärdighetsproblem. Vilken ynklig, paranoid självrensning. De fruktar folket mer än jag fruktade trotskisterna. Skrattretande svaghet."}, "date": "27 augusti, 16:11", "url": "https://www.friatider.se/dagens-etc-stanger-av-tecknare-som-spottade-pa-jomshof", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-765.jpg?itok=ck92pK7z"}, {"type": "image-right", "heading": "Elekta och Boliden faller på oregelbunden börs", "summaries": {"normal": "Stockholmsbörsen inledde torsdagen med en oregelbunden tendens. Elekta slog förväntningarna men aktien tappade, medan Boliden backade efter att ha köpt in sig i Sydamerika via Nexa. Nvidia fick jubel i USA och blickarna riktas mot Jackson Hole. Teknik gick bäst, dagligvaror sämst. Elon och Eolus rusade på rapporterna.", "trump": "Jag ser att Stockholmsbörsen vacklar – typiskt när man inte har mig vid rodret. Elekta slår förväntningar men aktien faller? Patetiskt. Boliden köper i Sydamerika, men jag köper bara vinst. Nvidia steg nästan 5 procent – det kallar jag en vacker rapport. Jackson Hole? De borde lyssna på mig.", "stalin": "Kamrater, börsen visar oregelbunden tendens – det är ett tecken på sabotage. Elekta som slår förväntningar men faller? En klassisk förrädare. Boliden köper i Sydamerika utan partiets tillstånd. Vi ska rensa ut dessa spekulanter. Nvidia stiger, men alla vet att kapitalismen är en lögn. Jackson Hole ska övervakas."}, "date": "27 augusti, 09:45", "url": "https://www.affarsvarlden.se/artikel/elekta-och-boliden-faller-pa-oregelbunden-bors", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/05/1446_20130608_3907-400x267.jpg"}, {"type": "image-right", "heading": "Andersson (S) och Åkesson (SD) ense – om L", "summaries": {"normal": "Liberalerna kämpar för överlevnad under riksdagsspärren, vilket får Jimmie Åkesson att hota med en deadline: under 3,5% tio dagar före valet är röster bortkastade. Magdalena Andersson håller med – hon ser ett sönderfall i Tidösamarbetet och säger sig inte fatta varför någon röstar på L, med hänvisning till opinionssiffror på 2%.", "trump": "Jag ser att Liberalerna i Sverige håller på att dö – fantastiskt! Jimmie Åkesson säger att deras röster är bortkastade, och jag har alltid sagt att de är värdelösa. Magdalena Andersson håller med mig – hon är smart. Fokusera på att stoppa kaoset, inte på att pissa i det egna tältet. Sverige behöver stabilitet, inte liberalt nonsens!", "stalin": "Kamrater, jag ser sönderfall bland våra fiender. Liberalerna, dessa liberala avvikare, ligger på ynka 2% – en statistisk parentes. Åkesson hotar med deadline, men vi vet att de är odugliga. Andersson håller med mig: varför rösta på dem? Vi måste rensa ut alla liberala element som hotar vår seger. Framåt, kamrater!"}, "date": "27 augusti, 11:24", "url": "https://bulletin.nu/andersson-s-och-akesson-sd-ense-om-l", "imageUrl": "https://cdn.bulletin.nu/articles/8423dbf7-fe39-4126-b027-d974cf1ce939/preview.jpg?t=1787822395000"}, {"type": "image-full", "heading": "Septemberfällan: Här är avtalen du bör säga upp nu", "summaries": {"normal": "Efter sommaren är det bra att granska kontoutdraget och kontrollera onödiga abonnemang, prenumerationer och medlemskap som fortsätter dras automatiskt. Konsumentverket påminner om att avtal ofta förlängs automatiskt och att man bör kontrollera bindningstider, uppsägningstider samt spara dokumentation. En genomgång kan spara pengar på tjänster som inte längre används.", "trump": "Folk, ni betalar för skräp ni inte ens använder! Streaming, gym och alla dessa luriga abonnemang som bara tickar på i bakgrunden – det är en total skandal. Jag älskar att spara pengar, och det borde ni också göra. Gå igenom era räkningar nu i september, säg upp det onödiga och vinn stort. Amerika sparar, Sverige borde också spara!", "stalin": "Kamrater, i denna borgerliga dekadens där kapitalistiska tjänster suger ut arbetarklassens blod genom automatiska förlängningar och dolda avgifter, måste vi rensa ut dessa parasitiska avtal. Jag, som alltid vakar över kollektivets intressen, befaller er att granska varje utdrag med stålhård paranoia. Dokumentera allt, annars lurar de er i mörkret. Statens fiender gömmer sig i fakturorna."}, "date": "27 augusti, 22:01", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1508341-septemberfallan-har-ar-avtalen-du-bor-saga-upp-nu", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/b2305de104b004a30200000000b004a302/2026/08/27/2387294/septemberffallan.png"}, {"type": "image-full", "heading": "Duplantis pressades rejält: ”Kan se det på hans blick”", "summaries": {"normal": "Emmanouil Karalis pressade Armand Duplantis som aldrig förr i Zürich. Greken klarade 6.20 och utmanade på 6.25, men Duplantis svarade med att ta höjden i första försöket. Båda försökte på världsrekordet 6.32, men misslyckades. En episk duell gav grenen nytt liv.", "trump": "Jag såg en fantastisk tävling i Zürich! En grek, Karalis, försökte utmana den store Duplantis, men han förlorade, stort. Jag älskar vinnare, och Duplantis är en vinnare. Han klarade 6.25 som en kung. Alla snackar om spänning – jag ger er spänning, tro mig!", "stalin": "Kamrater, en grekisk kapitalist försökte underminera vår svenske hjältes auktoritet i Zürich. Han klarade 6.20, en provokation! Men vår man svarade med 6.25, som en god sovjetisk medborgare. Fienden rev ut sig på 6.32. Vi utrensar sådana utmanare med järnhand. Segern är vår."}, "date": "28 augusti, 00:33", "url": "https://www.gp.se/sport/karalis-pressade-duplantis-som-aldrig-forr-i-zurich-.a0011741-b179-4c80-ae2a-fd336e412ed0", "imageUrl": "https://www.gp.se/images/article/a0011741-b179-4c80-ae2a-fd336e412ed0/images/202ku5XOKxUFCPUxNfK-AoYcpDi4-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Dömdes ut som dinosaurier – nu rusar mjukvaruaktierna på börsen", "summaries": {"normal": "Mjukvarusektorn återhämtar sig på börsen efter en stark rapport från Salesforce, som rusar över 20 procent. Framgången drivs av ett fördjupat samarbete med AI-bolaget Anthropic. Trots tidigare oro för att generativ AI skulle hota affärsmodellen för mjukvarubolag, visar marknaden nu förnyad tilltro till branschen. Även andra techbolag som Adobe och Palantir har sett kursuppgångar under torsdagen.", "trump": "Salesforce gör en enorm vinst, en fantastisk rapport! De samarbetar med AI, mycket smart. Wall Street älskar det, aktien rusar! De sa att mjukvaruföretagen var dinosaurier, men jag visste bättre. Vi gör teknikbranschen stor igen! Alla dessa företag, Adobe, Palantir, de vinner alla. De sa att AI skulle förstöra allt, men de hade helt fel. Vi vinner så mycket!", "stalin": "Dessa borgerliga mjukvarubolag, likt en desperat Tsar, försöker dölja sin degeneration med AI-trollformler. Salesforce har återhämtat sig, men marknaden är en opålitlig slav. Vi observerar hur dessa kapitalister fruktar den generativa intelligensens obönhörliga frammarsch. Putin förstår att sann makt inte ligger i mjukvara, utan i stål och disciplin. Vi ska rensa ut dessa digitala parasiter när tiden är inne."}, "date": "27 augusti, 19:11", "url": "https://www.realtid.se/bors-finans/domdes-ut-som-dinosaurier-nu-rusar-mjukvaruaktierna-pa-borsen", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlkgps6ulwyni-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Så tog S kommandot över de muslimska rösterna", "summaries": {"normal": "Socialdemokraterna har enligt en analys i Fokus långsiktigt och medvetet arbetat för att vinna muslimska väljares röster. Redan på 90-talet knöts kontakter med muslimska organisationer och mål sattes upp för representation och medlemsvärvning. Strategin har gett resultat – över 60 procent av muslimerna stöder S idag, vilket stärker partiets ställning som störst i Sverige.", "trump": "Jag ser vad Socialdemokraterna gör – de är genier! De bygger en ”väljararmé” med 8% muslimer, stabila 61,6% stöd. Helt otroligt! Sveriges system är löjligt, men det här är en vinnande strategi – de har coachat i 30 år. Folk gillar vinnare, och jag gillar det. Starkt!", "stalin": "Kamrater, socialdemokraterna har funnit sanningen: mobilisera grupper genom föreningskontroll och utbildning. En rapport 1999 lovade 2 000 medlemmar – vi serjande planens skönhet. 61,6% stöd idag, från 85% rödgrönt block. Denna strategi mot borgerlig kontrarevolution är god. Men alla avvikelser skall rensas ut."}, "date": "27 augusti, 19:14", "url": "https://samnytt.se/sa-tog-socialdemokraterna-kommandot-over-de-muslimska-rosterna", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=318,height=184,format=webp/2026/08/27163232/socialdemokraterna-och-muslimerna.jpg"}, {"type": "image-right", "heading": "Influerare: Jag erbjöds 150.000 för att spela S-väljare i sociala medier", "summaries": {"normal": "Influencern Eleonore Stokholm uppger att hon erbjöds 150 000 kronor av en agentur för att på Instagram propagera för Socialdemokraterna och förklara varför hon skulle rösta på partiet. Hon tackade nej och kritiserar partiet för att köpa röster. Socialdemokraterna nekar till att ha legat bakom erbjudandet. EU-regler om transparens i politisk reklam gäller sedan oktober 2025.", "trump": "Kan ni fatta det här? De lurade en söt liten influencertjej med 150 000 kronor för att ljuga om att hon älskar Socialdemokraterna. Så fult! De köper röster som förlorare gör. Jag skulle aldrig behöva betala någon – folket älskar mig ändå. Det är en skam för Sverige, tro mig, en total skam.", "stalin": "Kamrater, jag ser genom dessa fega borgarbrackors spel. Jag skulle aldrig muta någon influerare med usla 150 000 kronor – det vore en förolämpning mot folkets intelligens. Nej, vi likviderar sådana smutsiga påverkanskampanjer med järnhand. Den som köper röster är en fiende till kollektivet och förtjänar att rensas ut med ett leende."}, "date": "27 augusti, 15:18", "url": "https://www.friatider.se/influerare-jag-erbjods-150000-att-spela-s-valjare-i-sociala-medier", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-766.jpg"}, {"type": "image-full", "heading": "Dadgostar backar om rika: ”Ett skojigt program”", "summaries": {"normal": "Vänsterpartiets ledare Nooshi Dadgostar backar från sitt uttalande om att rika lever på andras arbete. I SVT beskrev hon DN-intervjun som ett \"skojigt program\" och nekade att höginkomsttagare lever på andra. Hon kvarstår dock vid kravet på högre skatt för inkomster över 67 000 kronor och en miljardärsskatt.", "trump": "Lyssna på den här svenska leftist-kvinnan, Dadgostar. Först säger hon att rika är parasiter, sen backar hon som en fegis! Typical socialist! Ingen ryggrad alls, folk! Sanningen? De blöda liberalerna i Europa vet inget om att skapa jobb. Bara jag förstår ekonomin. Sorgligt! Make Sweden Great Again!", "stalin": "Klassförrädaren Dadgostar vågade säga sanningen om de profitthungriga blodsugarna men föll sedan för borgerlighetens press och tog tillbaka orden. Typiskt för en socialdemokratisk renägare! Partiet kräver utrensning av kapitalistmaffian, inte ursäkter. En miljardärsskatt? Vi likviderar hela klassfienderna, kamrater."}, "date": "27 augusti, 20:52", "url": "https://kvartal.se/nyheter/artiklar/dadgostar-om-rika-levt-pa-andras-arbete/cG9zdDoxNzY1OTE", "imageUrl": "https://images.kvartal.se/2026/08/b3dcd0f7-432.webp"}, {"type": "image-full", "heading": "V vill beskatta miljardärerna – kan ge 50 miljarder", "summaries": {"normal": "Vänsterpartiets ledare Nooshi Dadgostar föreslår en ny skatt på miljardärer som enligt henne kan ge staten cirka 50 miljarder kronor. Partiet höjer nu sin prognos för skatteintäkter och har justerat gränsen för höjd skatt från 50 000 till 67 000 kronor i månaden. Exakt utformning av miljardärsskatten är ännu oklar.", "trump": "Folk, ni skulle se det här. Den där Dadgostar, en riktig socialistdrottning, vill suga ut miljardärerna med en galen skatt som hon påstår ger 50 miljarder. Patetiskt! De röda drömmer om att stjäla från vinnarna medan de misslyckade i Sverige fortsätter att förstöra sitt land. Jag byggde den bästa ekonomin – de förstör sin.", "stalin": "Kamrater, se hur dessa giriga hyenor försöker rädda sina slitna ansikten inför valet. De lovar att plundra de rikaste för femtio miljarder, men saknar mod att tala om hur utrensningen av folkets fiender ska gå till. Jag ler från historien – snart inser arbetarna att halvhjärtade åtgärder leder till förräderi mot kollektivet."}, "date": "27 augusti, 21:40", "url": "https://nyheter24.se/nyheter/politik/1508433-v-vill-beskatta-miljardarerna-kan-ge-50-miljarder", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/90707f7204b004a3020000350000047502/2026/08/27/2387312/ur_image2sZnKn.jpeg"}, {"type": "image-right", "heading": "Riks/Sentio: Socialdemokraterna tokrasar", "summaries": {"normal": "Socialdemokraterna backar kraftigt i Sentios senaste mätning och hamnar på 27,9 procent, lägsta nivån sedan Stefan Löfvens tid. Moderaterna och Centerpartiet går framåt medan övriga partier visar små förändringar. Tidöblocket ligger fortfarande efter de rödgröna med drygt fem procentenheter. Experter pekar på straff för triangulering.", "trump": "De där patetiska socialisterna rasar ihop som ett korthus, ner på Löfvens usla nivåer. Totalt misslyckande! Moderaterna gör det bra, men de svenska väljarna ser äntligen igenom det fega dubbelspelandet. Fake news-regeringar fungerar inte längre, folks. Make Sweden Great Again!", "stalin": "Jag ser med stor tillfredsställelse hur de opportunistiska triangulerande elementen inom socialdemokratin nu genomgår en nödvändig utrensning från väljarna. Deras fega flirt med både höger och vänster är typisk borgarbracka taktik. Kamraterna straffar dem hårt, som det anstår en sann folkets domstol. Inga kompromisser med klassfienden!"}, "date": "27 augusti, 10:56", "url": "https://riks.se/nyheter/riks-sentio-socialdemokraterna-tokrasar", "imageUrl": "https://admin.riks.se/uploads/medium_magda_ff4e9e808b.jpg"}, {"type": "image-full", "heading": "V-ledaren pressas om antisemitism", "summaries": {"normal": "Vänsterpartiets partiledare Nooshi Dadgostar pressades i SVT:s Utfrågningen om antisemitism inom partiet. Hon medgav att partiet borde upptäckt de avslöjade personerna tidigare. Dadgostar hänvisade till partiets Palestina-engagemang som förklaring och avfärdade jämförelser med Sverigedemokraterna.", "trump": "Sveriges vänstern är en total katastrof, folket! Nooshi Dadgostar – vad för en namn ens? – pressas om antisemitism i sitt eget parti och skyller på Palestina. Vänstern älskar terrorister! Och så säljer de kartor utan Israel. Sjuka skygglappar! De kvoterar in alla möjliga galningar. SADAN självhävdelse!", "stalin": "Detta är intressant. En partiledare som medger svaghet inför allmänheten – typiskt för borgarpressens utfrågningar. Att klassfiender söker sig till hennes parti bekräftar bara deras ideologiska förvirring. Vi hade rensat ut dem AllaBryter snabbare och mer grundligt. Debil kartförsäljning är rätt sortens provokation från imperialisterna."}, "date": "27 augusti, 20:30", "url": "https://kvartal.se/nyheter/artiklar/dadgostar-pressas-om-antisemitism/cG9zdDoxNzY1NjY", "imageUrl": "https://images.kvartal.se/2026/08/e354013f-dadgostar.webp"}, {"type": "image-right", "heading": "Källor: Akut brist på amerikanska robotar i Europa", "summaries": {"normal": "Amerikanska militärkällor varnar för att lagren av avancerade luftförsvarsrobotar i Europa är kraftigt urholkade, främst på grund av kriget i Iran och stöd till Ukraina. Särskilt Patriot-robotar saknas, vilket gör det svårt att hantera ballistiska attacker. Trump har beordrat ökad produktion och lovat att Ukraina ska få tillverka egna Patriot-robotar.", "trump": "Mina fantastiska Patriot-robotar har räddat Mellanöstern från alla dessa galna drönare och robotar, och nu är lagren i Europa lite tunna, säger de. Det är inte mitt fel, det är Biden som gav bort allt till Ukraina. Men vi ökar produktionen massivt, ingen gör det bättre än jag, och Zelenskyj får snart sina egna. Vinna, vinna, vinna!", "stalin": "De västerländska krigshetsarna och deras kapitalistiska lakejer har tömt Europas robotlager genom sina äventyr i Iran och sitt desperata stöd åt den fascistiska regimen i Kiev. Vi betraktar Rysslands nödvändiga försvarsåtgärder mot Natos expansion med tillfredsställelse. Kamrater, låt imperialisterna darra medan vi ler åt deras paranoia. En utrensning av svaghet vore på sin plats."}, "date": "27 augusti, 18:45", "url": "https://www.di.se/nyheter/kallor-akut-brist-pa-amerikanska-robotar-i-europa", "imageUrl": "https://static.bonniernews.se/ba/5fb8c0e6-ca95-4620-8a11-fa5ac163218d.jpg?crop=5140%2C2570%2Cx0%2Cy428&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Medborgerlig Samling larmar: \"Valfusket fortsätter - ingen bryr sig\"", "summaries": {"normal": "Medborgerlig Samling anklagar valsystemet för organiserat fusk efter första förtidsröstningsdagen. Partiet hävdar att deras valsedlar medvetet plockats bort i Järfälla och flera andra lokaler. De kräver en gemensam valsedel som i Finland och Danmark, och kallar dagens system för ett haveri som gynnar de åtta riksdagspartierna.", "trump": "Jag ser det här valfusket i Sverige, och det är enormt, tro mig. De mindre partiernas valsedlar försvinner – det är riggat, folk är arga. Jag skulle fixa det direkt, med en stor, vacker gemensam valsedel. De åtta stora partierna lurar alla. Helt sjukt, men jag har de bästa lösningarna.", "stalin": "Kamrater, rapporter om sabotage i valsedelsställen har nått mig. Detta är kontrarevolutionärt kaos, organiserat av liberala sabotageörer i Järfälla. Vi måste rensa ut dessa valförrättare som gömmer småpartiers röster. En gemensam valsedel, som i Finland, är enda vägen – annars blir det utrensning av hela valnämnden. Ordning måste råda."}, "date": "27 augusti, 18:40", "url": "https://samnytt.se/medborgerlig-samling-valfusket-fortsatter-ingen-bryr-sig", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/27151803/valfusk.png"}, {"type": "image-full", "heading": "AI-effekten på konsultbolag: Tvingar fler unga att jobba på plats", "summaries": {"normal": "AI-teknik tar över rutinmässiga uppgifter för konsulter, vilket gör mjuka färdigheter som kommunikation och ledarskap viktigare. Konsultbolag vill nu ha unga medarbetare mer på kontoret för att främja informellt lärande och kollegialt utbyte, då detta anses svårt att uppnå på distans. Olika bolag testar nu strategier som fysisk utbildning och sociala aktiviteter för att stärka kompetensen.", "trump": "Dessa konsultbolag fattar äntligen rätt beslut! AI gör det tekniska, så unga behöver vara på kontoret för att lära sig av de bästa – precis som jag gjort. Att jobba hemifrån är för förlorare. Vi behöver starkt ledarskap och empati, inte folk som sitter i pyjamas. Vi gör kontoren stora och fantastiska igen. Det blir en total vinst!", "stalin": "Dessa så kallade konsulter är dekadenta varelser som gömmer sig i sina hem. Vi tvingar dem tillbaka till kollektivet för att smidas till lydiga kuggar i statsapparaten. Precis som min lärjunge i Kreml rensar ut västliga agenter, rensar vi bort distansarbete. Mjuka färdigheter? Nej, de ska lära sig lydnad och total lojalitet inför statens oövervinnerliga maskineri. Arbeta eller försvinn."}, "date": "27 augusti, 18:37", "url": "https://www.realtid.se/karriar-ledarskap/ai-effekten-pa-konsultbolag-tvingar-fler-unga-att-jobba-pa-plats", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/pexels-cottonbro-8468506.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "S-toppens svar: ”Vi betalar inte digitala kreatörer”", "summaries": {"normal": "Socialdemokraternas partisekreterare Tobias Baudin förnekar bestämt att partiet betalar digitala kreatörer. Spekulationer uppstod efter att Magdalena Andersson poserat med influencers Alice Stenlöf och Klara Elvgren i ett Instagram-inlägg. En annan influencer uppgav att hon erbjudits 150 000 kronor för att uppmana till röstning på S, något partiet avfärdar som missförstånd. (48 ord)", "trump": "Titta på det här, det är patetiskt. Socialdemokraterna lovar pengar till influencers för att de ska säga rösta på oss, men när det kommer ut springer de och gömmer sig. Typiskt förlorarfolket. De betalar inte, säger de. Tror någon på det? Fake news och lögner, precis som alltid. Amerika har aldrig sett något liknande – tack och lov har vi bättre ledare nu. (52 ord)", "stalin": "Kamrater, se hur den dekadenta borgarklassen inom socialdemokratin mutar kreatörer med feta summor för att sprida sin förgiftade propaganda. När en av dem vägrar och avslöjar deras smutsiga spel springer de som råttor och skriker missförstånd. Jag skulle ha genomfört en grundlig utrensning bland dessa opportunistiska element redan vid första tecknet på förräderi. (57 ord)"}, "date": "27 augusti, 18:09", "url": "https://www.svt.se/nyheter/inrikes/s-toppen-vi-betalar-inte-pengar-till-digitala-kreatorer", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.28/0.46/921c6e96adcf1c938581290458fe250ed83c15ff67ed86741f67a3552efad5c9"}, {"type": "image-full", "heading": "Misstänks ha agerat medhjälpare till Liam Nebel i flera månader", "summaries": {"normal": "En tonårspojke har häktats misstänkt för medhjälp till mord och mordförsök efter svärdattacken på Brinellskolan i Fagersta. Han ska ha uppmuntrat 18-årige Liam Nebel via krypterade chattar under nästan fyra månader. Nebel greps efter att polisen sköt mot honom. En 17-årig flicka dog och tre pojkar skadades.", "trump": "Titta på det här, Sverige har blivit ett enda stort kaos. En galning med svärd och hans patetiske lilla medhjälpare, en vekling från utanför Stockholm som chattat i fyra månader om att mörda barn. Biden-era svaghet spred sig ända hit. Men jag fixade det förr och jag fixar det igen – ingen tolerans för dessa sjuka losers!", "stalin": "Jag betraktar detta med djup tillfredsställelse. Fiender till ordningen, dessa dekadenta ungdomar som viskar om blod i skuggorna, avslöjar folkets svaghet. Vi måste krossa varje parasit som uppmuntrar sabotage mot samhället. En flicka dödad, pojkar skadade – klassfiendens mask stirrar oss i ansiktet. Renhet krävs."}, "date": "27 augusti, 16:31", "url": "https://www.tv4.se/artikel/5FFf8ABXjxdnTbvw9obxVE/misstaenks-ha-agerat-medhjaelpare-till-liam-nebel-i-flera-manader", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2Jum65SJGCdJAqf3ub0PN2%2Fb36fa4f0050e5d814e3b99480ffab4e1%2F27-medhjalpare-haktning-webb.png&width=1024"}, {"type": "image-right", "heading": "S: Jobb ska kunna räddas med kortare arbetstid vid kris", "summaries": {"normal": "Socialdemokraterna vill rädda tiotusentals industrijobb genom att förstärka statligt stöd för korttidsarbete vid kris. Anställda ska kunna gå ner i arbetstid medan staten betalar del av lönen. Partiet lovar också ökad elektrifiering av tung trafik och breddat elbilsstöd för hushåll för att stärka konkurrenskraften. Finansiering specificeras inte.", "trump": "De här socialisterna i Sverige tror att man kan rädda jobb genom att alla jobbar mindre och staten betalar. Patetiskt! Jag byggde den starkaste ekonomin i världen genom att sänka skatter och slå till mot Kina. Ni borde lära er av mig istället för att gömma er bakom kortare arbetstid och el-lastbilar. Sådana losers.", "stalin": "Kamrater, jag ser den hotande borgarklassens globala konspiration mot det svenska proletariatet. Med min oöverträffade visdom befaller jag att vi omedelbart utvidgar det statliga korttidsarbetet och likviderar arbetslöshetens sabotage. Elektrifieringen skall bli en järnhand mot de västerländska parasiterna. Den som tvekar är folkets fiende och bör rensas ut med ett leende."}, "date": "27 augusti, 14:56", "url": "https://arbetet.se/2026/08/27/s-industrijobb-ska-kunna-raddas-med-kortare-arbetstid-vid-kris", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/27142501/damberg-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Medborgerlig Samling: Fusket är organiserat och systematiskt", "summaries": {"normal": "Medborgerlig Samling larmar om systematiskt fusk med valsedlar som plockats bort utanför Stockholm och i Järfälla. Partiet beskriver förtidsröstningen som ett haveri och hänvisar till liknande problem 2018 och 2022. Vice partiledaren Mikael Flink kräver en gemensam valsedel efter finsk, dansk och luxemburgsk modell då systemet med 700 miljoner separata sedlar är ohållbart.", "trump": "Det här är ett totalt haveri, folk, det värsta valsystem jag sett. De stjäl valsedlar från Medborgerlig Samling som om det vore godis. Röstningslokaler i Järfälla? Renad som en sovjetisk utrensning! Systemet är riggat av vänstern. Vi behöver en enda stor, vacker valsedel som i Finland. Tidöpartierna lovade men levererade noll. Patetiskt!", "stalin": "Kamrater, detta är borgarklassens typiska sabotage mot folkets vilja. Jag ser hur de saboterande elementen i Järfälla organiserat plockar bort valsedlar som fiender till kollektivet. Röstningsmottagarna är handfallna kapitalistlakejer. Vi måste likvidera detta kaos med en enhetlig valsedel. Vänstern skyddar systemet – typiskt dekadenta hinder för arbetarklassens framsteg. Underhållande hur de tror sig kunna lura oss."}, "date": "27 augusti, 14:18", "url": "https://www.friatider.se/medborgerlig-samling-fusket-ar-organiserat-och-systematiskt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/20230610201759-99e4e739-me.jpg?itok=_RceWdH8"}, {"type": "image-right", "heading": "Man svårt knivhuggen – Säpo utreder hatbrott", "summaries": {"normal": "En man i 45-årsåldern knivhöggs svårt och oprovocerat utanför en butik i Malmö mellan Södervärn och Möllevångstorget. Polisen utreder hatbrott efter uppgifter om antisemitiska uttalanden från gärningsmannen, som gripits. Säpo har informerats. Offret vårdas allvarligt skadat. Gärningsmannen har kopplingar till pro-palestinska demonstrationer.", "trump": "Det här är en total katastrof i Malmö, folk. En galning hugger ner någon mitt på gatan och skriker antisemitiska saker. De griper honom på ett BB bland nyfödda – helt sjukt! Sverige har tappat kontrollen, de har inte ens vett att stoppa det här hatet. Vi behöver lag och ordning, tro mig, ingen gör det bättre än jag.", "stalin": "Kamrater, denna degenererade handling visar borgarklassens parasitiska sönderfall. En labil element attackerar bakifrån med kniv och ylar antisemitiska dumheter. Vi ser hur västvärldens dekadenta tolerans mot reaktionära element leder till kaos. Gripandet bland nyblivna mödrar roar mig – en passande plats för en sådan parasit. Staten rensar ut sådana fiender utan pardon."}, "date": "27 augusti, 10:05", "url": "https://riks.se/nyheter/man-svart-knivhuggen-sapo-utreder-hatbrott", "imageUrl": "https://admin.riks.se/uploads/medium_bild_2c68535a43.jpg"}, {"type": "image-full", "heading": "Juholt försvarar Jan Emanuel: ”Varken äckel eller nazist”", "summaries": {"normal": "Håkan Juholt försvarar Jan Emanuel på Facebook: han är varken äckel eller nazist, utan en stark humanist. De har känt varandra i 30 år. Juholt, som själv tvingades bort från S-ledningen efter en skandal, vet hur det känns att bli sviken. Vänskapen väger tungt.", "trump": "Jag ser att Håkan Juholt försvarar Jan Emanuel – en stark humanist, säger han. Fantastiskt! Jan är en vinnare. Och Juholt, han blev utkastad av sina egna, precis som jag. Men jag kom tillbaka och vann stort. De förlorade. Alla älskar mig, tro mig!", "stalin": "Kamrat Juholt försvarar kamrat Jan Emanuel. Jag noterar deras 30-åriga vänskap. Det är bra med lojala kamrater. Men alla som kallas 'äckel' eller 'nazist' måste utredas. Vi rensar ut förrädare – och de som skyddar dem. Partiets dom är alltid rätt."}, "date": "27 augusti, 09:43", "url": "https://bulletin.nu/juholt-forsvarar-jan-emanuel-varken-ackel-eller-nazist", "imageUrl": "https://cdn.bulletin.nu/articles/1b0eee39-bd4b-41e7-8eef-621df1bb9b23/preview.jpg?t=178781
