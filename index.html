ra EU-länder kritiserar Spanien för en alltför generös migrationspolitik, bland annat en nyligen avslutad amnesti. Ursula von der Leyen manar till enighet medan tonläget beskrivs som ovanligt högt. Inga beslut väntas, endast diskussioner om gränsskydd.", "trump": "Titta på det här! EU:s clownshow i full gång igen. Tiotusentals migranter stormar in i Spanien som om det vore en gratisbuffé, och vad gör de? Skyller på Spaniens patetiska, vänstervridna politik förstås. Von der Leyen babblar om enighet medan Italien och Frankrike redan stängt dörrarna. Det är vad som händer när ni låter galna globalister styra – total kaos! Men hej, jag fixade gränserna, de borde ha lyssnat på mig redan 2016 istället för Biden-slarv.", "stalin": "Kamrater, detta är vad som händer när borgarbrackorna inom EU tillåter klassfiendens lösa flyktingpolitik att underminera kollektivets järndisciplin. Spanien har med sin amnesti lockat folkfienderna som en magnet drar järnfilspån, och nu pekar de ut varandra i ett hysteriskt tonläge. Jag ser imperialismens hand i detta kaos. Vi måste rensa ut alla svaga länkar och återupprätta gränsernas oöverstigliga murar. Inga beslut? Typiskt dekadent prat. Staten kräver handling, inte teatersällskap."}, "date": "4 augusti, 15:36", "url": "https://www.tv4.se/artikel/79SXzQ9Y2CDxi8PNr4hqbu/i-dag-haller-eu-krismoete-ovanligt-hoegt-tonlaege", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F26KCeWFQXssn4bOIGo7ut1%2F545c70aba1ea6ab43d22310a3a5eb416%2Fceuta_webb_ny.jpg&width=120"}, {"type": "image-full", "heading": "Fifatoppar tar avstånd från presidenten", "summaries": {"normal": "Fifas president Gianni Infantino möter växande motstånd. Flera nationella förbund, inklusive Sverige och England, har dragit tillbaka sitt stöd för hans omval. Uefa arbetar för att samla fler bakom kravet på nytt ledarskap. Infantinos nära medarbetare, som generalsekreterare Mattias Grafström och utvecklingschef Arsène Wenger, tar avstånd från den misslyckade affären kring VM:s kommersiella rättigheter. Flera nyckelpersoner har avgått eller kritiserat processen, vilket ytterligare försvagar Infantinos position.", "trump": "Lyssna här, Gianni Infantino – total katastrof! Fifa är ett enda stort kaos, och alla inser nu att han är en förlorare. Sverige, England, Wales – alla drar sig ur hans omval. Och hans egna medarbetare? De spottar på honom! Grafström kallar affären 'sorglig' – jag säger: 'Patetisk!' Wenger visste ingenting – typiskt! Och nu hoppar alla av som råttor från ett sjunkande skepp. Fifa behöver en vinnare, inte en sådan här clown. SAD!", "stalin": "Fienderna till det stora fotbollsproletariatet har visat sitt sanna ansikte! Denna Infantino, en svag och korrumperad lakej för kapitalistiska intressen, har förlorat allt stöd. Hans egna medarbetare, dessa ynkliga förrädare, har vänt sig mot honom som hundar som biter sin herre. Vi ser hur Uefa, denna borgerliga sammansvärjning, försöker utvidga sin makt. Men folket kräver ordning! Låt oss rensa ut dessa förrädare och återupprätta disciplinen. Fotbollens framtid tillhör arbetarna, inte dessa dekadenta imperialister!"}, "date": "4 augusti, 14:24", "url": "https://kvartal.se/nyheter/artiklar/fifa-toppar-tar-avstand/cG9zdDoxNTc3NzQ", "imageUrl": "https://images.kvartal.se/2026/08/06fe3324-infantinografstrom.webp"}, {"type": "image-right", "heading": "Hoppas att Björn Söder lärde sig något i Auschwitz", "summaries": {"normal": "Björn Söder besökte Auschwitz-Birkenau och beskrev upplevelsen som omskakande på Facebook. Ledaren Andreas Gustavsson hoppas att besöket får Söder att reflektera över sin egen historia av kontroversiella uttalanden om judar, George Soros och en gammal bild med en före detta SS-soldat. Artikeln lyfter SD:s pågående problem med antisemitism samtidigt som partiet strävar efter normalisering och stöd till Israel.", "trump": "Folk, ni skulle se den här typen Söder. Han åker till Auschwitz, tar selfies med historien och skriver långa Facebook-inlägg om hat. Underbart! Men grabben har poserat med en riktig SS-kille och snackat om att judar inte är svenska nog. Typisk politiker från den där sidan. Biden skulle ha älskat honom. Jag säger: gör om, gör rätt, annars är det bara fake news och tomma ord. Amerika först, alltid.", "stalin": "Kamrater, jag betraktar denna Söder som en typisk opportunist från den dekadenta högerfalangen. Han reser till fascismens offerplatser, gråter krokodiltårar över industriellt hat och återvänder utan att rensa ut sina egna folkfiender inom partiet. Borgarbrackorna och klassfienderna som sprider Soros-myter och ifrågasätter judars existens förtjänar snarast en grundlig utrensning. Inga ursäkter accepteras i folkets namn."}, "date": "4 augusti, 12:20", "url": "https://www.etc.se/ledare/hoppas-att-bjoern-soeder-laerde-sig-naagot-i-auschwitz", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260804100816_91f00e5a-e324-4574-8167-eb29f0358d5c.jpg"}, {"type": "image-full", "heading": "Dadgostar: ”Känner mig trygg med hennes värderingar”", "summaries": {"normal": "Nooshi Dadgostar, partiledare för Vänsterpartiet, försvarar Ilona Szatmári Waldau efter att hon skrivit ett stödbrev till en terrordömd palestinsk fånge. Dadgostar menar att brevet syftade till att kräva en rättvis rättegång enligt Genèvekonventionen. Vänsterpartiet har brutit samarbetet med den organisation som förmedlade informationen och ser över sina rutiner. Kritiker, som Centerpartiet, ifrågasätter partiets omdöme och regeringsduglighet.", "trump": "Jag måste säga, det här Vänsterpartiet är ett riktigt skämt! En av deras egna skriver brev till en terrordömd fånge – och sedan försöker de skylla på någon annan? 'Vi visste inte', säger de. Jo, visst. Precis som när jag sa att jag inte visste något om stormningen av Kapitolium. Centerpartiet har rätt – dessa människor är inte redo att styra ett land. Sverige borde ta en titt på USA, där vi faktiskt vet hur man hanterar terrorister. SAD!", "stalin": "Kamrater, ännu en gång visar de borgerliga lakejerna sitt sanna ansikte! Denna så kallade 'vänster'-partiledare försvarar en medlöpare som skriver kärleksbrev till en terrorist – en fiende till folket! Vi i Sovjetunionen visste hur man hanterade sådana förrädare: en enkel lösning, inga onödiga brev. Och nu skriker dessa kapitalistiska hyenor om 'regeringsduglighet'? De borde lära sig av Ryssland – där har vi Putin, som inte tvekar att krossa terrorister och deras sympatisörer. Låt dem skrika, vi vet sanningen!"}, "date": "4 augusti, 12:38", "url": "https://kvartal.se/nyheter/artiklar/dadgostar-kanner-mig-trygg-med-hennes-varderingar/cG9zdDoxNTc3MDM", "imageUrl": "https://images.kvartal.se/2026/08/ea7a4ef5-dadgostar.webp"}, {"type": "image-right", "heading": "Migrationen behöver fasta regler. Visar hur komplex migrationen är", "summaries": {"normal": "Artikeln diskuterar migrationens utmaningar för Europa med Ceuta-krisen som exempel. Över 60 000 migranter tog sig in från Marocko under en dag, vilket resulterade i tragedi med över 70 döda. Marocko anklagas för att använda migration som politiskt verktyg mot Spanien. Författaren drar lärdomar från Sveriges hantering av 2015 års flyktingkris och betonar behovet av fasta, förutsägbara regler, stram migrationspolitik och långsiktig uthållighet för att motstå påtryckningar från grannländer.", "trump": "Folk, det här med Ceuta är en katastrof, en total katastrof. Över 60 000 människor bara stormar gränsen och vad gör Europa? Ingenting! Marocko använder migranter som vapen, precis som Turkiet och Ryssland gör. De skrattar åt er svaga ledare. Sverige gjorde allt fel 2015, permanenta uppehållstillstånd, generösa bidrag, ingen kontroll. Men nu har ni äntligen lärt er, tack och lov. Bygg murar, ha fasta regler, annars kommer de fortsätta översvämma er. Jag skulle ha stoppat det på dag ett, tro mig.", "stalin": "Kamrater, denna giftiga cocktail av borgerlig naivitet och imperialistiska intriger i Ceuta visar återigen hur de dekadenta europeiska kapitalisterna själva odlar de ormar som ska bita dem. Marockos ledning använder de arma massorna som hybridkrigets fotfolk, en list som jag genast skulle ha genomskådat och likviderat med järnhand. Sverige 2015? En orgie i ansvarslöshet där borgarbrackorna öppnade portarna för sabotage mot folkets stabilitet. Vi behöver utrensning av alla mjuka undantag och permanenta uppehållstillstånd som en fiende till kollektivets ordning. Migrationen är klassfiendens nya mask, och endast fasta regler och proletär vaksamhet kan krossa den."}, "date": "4 augusti, 14:58", "url": "https://www.di.se/ledare/migrationen-behover-fasta-regler", "imageUrl": "https://static.bonniernews.se/ba/45fb4b4f-f516-42c5-b09a-a8425fbdd6f7.jpeg?crop=5568%2C2784%2Cx0%2Cy464&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Ny vändning i Teslakonflikten– anställda ska strejka igen", "summaries": {"normal": "Teslastrejken tar en ny vändning då ett 40-tal strejkande arbetare som återgick till sina jobb under sommaren nu ska tas ut i strejk igen den 13 augusti. Beslutet, som beskrivits som en jojo-strejk för att skapa oförutsägbarhet, kommer från IF Metall. En strejkande uttrycker chock och förvirring då ingen information kommit under sommaren. Konflikten är den längsta i modern svensk historia.", "trump": "Folk, ni kommer inte att tro det här. De där Tesla-strejkarna, som jag älskar förresten, de gick tillbaka till jobbet i sommar som riktiga patrioter, och nu drar facket in dem i strejk igen. Totalt kaos! Jojo-strejk, säger de. Det är en skam. IF Metall vet inte vad de håller på med, ingen har hört ett ljud på hela sommaren. Patetiskt. Sverige behöver starka ledare, inte sådana här clowner.", "stalin": "Kamrater, dessa opålitliga element bland Teslas anställda som vi skickade tillbaka till produktionen under sommaren har nu återkallats till strejken den 13 augusti. Deras chock och förvirring är ett tecken på svaghet som kapitalisterna utnyttjar. Vi ska rensa ut alla jojo-element och borgarbrackor som sprider desinformation inom facket. Inget hördes på sommaren? Typiskt sabotage från klassfiendens lakejer. Låt utrensningen fortsätta med glädje i hjärtat."}, "date": "4 augusti, 11:42", "url": "https://arbetet.se/2026/08/04/teslastrejken-tar-ny-vandning-anstallda-ska-strejka-igen-en-chock", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/04113143/sdlndaych3b4he-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Irans president: Vill inte fortsätta kriget", "summaries": {"normal": "Irans president Masoud Pezeshkian uppger att landet inte vill att kriget i Mellanöstern ska fortsätta eller utvidgas, men att man samtidigt kommer att försvara sina gränser. Qatar medlar och bekräftar pågående kontakter med alla parter, dock utan direkta samtal mellan Iran och USA. USA:s finansminister Scott Bessent säger att det pågår förhandlingar om att åter öppna Hormuzsundet redan till onsdag. Under natten attackerades ett fraktfartyg utanför Omans kust med en okänd projektil.", "trump": "Iran vill inte fortsätta kriget, säger deras president. Det är ju fantastiskt, för det är precis vad jag har sagt hela tiden. Vi har samtal på gång, och det går utmärkt. Hormuzsundet öppnar snart igen, affärerna blir normala och oljan flyter. Qatar gör ett bra jobb som mellanhand. Iranerna vet att de inte har en chans mot oss, därför kommer de krypande till förhandlingsbordet. Mycket smart, mycket bra.", "stalin": "Kamrater, denna iranska ledare vågar viska om att inte utvidga kriget medan han samtidigt babblar om att försvara sina gränser. Typiskt borgarbrackornas dubbla tungor. Vi ser hur de kapitalistiska parasiterna i Washington och Teheran leker med varandra genom qatariska lakejer för att behålla kontrollen över Hormuzsundet. Ett fartyg träffas av en projektil – tydligen en slumpmässig olycka enligt de dekadenta imperialisterna. Vi vet bättre. Fienderna inom och utom måste rensas ut innan de förgiftar hela kollektivet med sina lögner. Inga direkta samtal? Utmärkt, då slipper vi höra deras dekadenta viskningar direkt."}, "date": "4 augusti, 14:53", "url": "https://www.di.se/nyheter/irans-president-vill-inte-fortsatta-kriget", "imageUrl": "https://static.bonniernews.se/ba/79340930-743c-452f-ac88-09cdfa7fe42d.jpg?crop=4000%2C2000%2Cx0%2Cy333&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Varför tar inte Tidö avstånd från Jomshof?", "summaries": {"normal": "Richard Jomshof (SD) har jämfört Aftonbladets politiske chefredaktör Anders Lindberg med Vidkun Quisling i ett inlägg på X. Jämförelsen, som följde efter en politisk ordväxling, kritiseras i artikeln som grotesk och ett underförstått hot. Författaren noterar att ingen från Sverigedemokraterna eller Tidöpartierna har tagit avstånd. Inlägget ses som en del av SD:s strategi att behålla stöd från extremhögern samtidigt som partiet blickar mot valet 2030, med fokus på anti-islamisering istället för välfärdsfrågor.", "trump": "Det här är en total witch hunt mot en kille som bara säger som det är. Den där Lindberg från den riggade Aftonbladet får precis vad han förtjänar, och Jomshof är en tuff patriot som inte böjer sig för fake news-medierna. De kallar honom extrem? Ge mig en break. De riktiga extremisterna sitter i de rödgröna bubblorna och förstör Sverige precis som de försökt göra med USA innan jag kom tillbaka och gjorde det stort igen. Jomshof förstår det. Bra jobbat!", "stalin": "Kamrater, detta är en klassisk provokation från de mest föraktliga borgarbrackorna inom den socialfascistiska pressen. Jag ser hur denna Quisling-kapitalist Lindberg och hans lakejer i Aftonbladet genast skriker efter utrensning när en sann patriot pekar ut dem som folkförrädare. Vi vet vilka som gömmer sig i filterbubblorna – trotskistiska islamofober, nej vänta, islamofobiska trotskister – som konspirerar mot folket. Inget avståndstagande från de andra reaktionärerna? Utmärkt. Det avslöjar deras sanna ansikte. Vi ska noga övervaka dessa element. De kommer inte att slippa undan folkets dom."}, "date": "4 augusti, 08:51", "url": "https://www.dagensarena.se/opinion/varfor-tar-inte-tido-avstand-fran-jomshof", "imageUrl": "https://www.dagensarena.se/files/2026/08/maduros-uselhet-motiverar-inte-attacken-19-1024x532.jpg"}, {"type": "image-full", "heading": "Nej till kontanter – då kan matbutiken neka ditt köp", "summaries": {"normal": "Den nya kontantlagen som trädde i kraft 1 juli 2026 kräver att mataffärer och apotek tar emot kontanter på bemannade kassor mellan klockan 06.00 och 20.00. Undantag gäller vid säkerhetsrisker, köp över 5 920 kronor eller fler än 25 mynt. Lagen kritiseras som verkningslös eftersom de flesta butiker redan accepterar kontanter, och den omfattar inte bensinmackar eller offentliga tjänster. Sverige fortsätter att vara ett av världens mest digitala länder med Swish och mobila kort.", "trump": "Den här svenska kontantlagen är en total katastrof, tro mig. De tvingar butiker att ta emot kontanter men sedan säger de att det inte gäller om det är farligt eller om du köper för mycket. Patetiskt! Sverige var en gång starkt men nu har de gått all in på Swish och mobila grejer medan resten av Europa håller fast vid riktiga pengar. Lagen är svag, ingen får böter, den täcker inte ens bensin eller pass. En stor misslyckad affär, folk.", "stalin": "Kamrater, denna så kallade kontantlag är en ynklig kapitulation inför de digitala spekulanterna och borgarbrackornas appar. Jag, som alltid försvarat arbetarklassens rätt till äkta mynt och sedlar, ser hur dessa kapitalistiska parasiter försöker rensa ut kontanterna med sina lömska Swish-fällor. Vi tillåter inga undantag för säkerhet eller dyra köp – det är bara nya förevändningar från klassfienderna. Den som vägrar ta emot folkets pengar ska likvideras omedelbart. Paranoia? Nej, det är bara sund vaksamhet mot de som vill kontrollera varje transaktion i skuggorna."}, "date": "4 augusti, 11:55", "url": "https://nyheter24.se/nyheter/ekonomi/1502575-nej-till-kontanter-da-kan-matbutiken-neka-ditt-kop", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/2a878b9b04b004a30200000000b004a302/2026/08/04/2382072/kontanter-nej.jpg"}, {"type": "image-right", "heading": "Så slapp Tara chefens ohållbara förslag", "summaries": {"normal": "Undersköterskan Tara Lindeman blev utmattad av en stressig arbetsmiljö på äldreboendet Åsliden i Båstad. När hon skulle återgå till arbetet efter sjukskrivning ville chefen att hon skulle vara springare mellan avdelningarna, något hon upplevde som ohållbart. Med stöd av skyddsombudet Lina Svensson, rehab-koordinator och Försäkringskassan fick hon igenom anpassningar. Nu arbetar hon med aktiviteter och matning i lugnare tempo på 25 procent. Artikeln belyser vikten av att vara tydlig med sina rättigheter och att facket kan spela en avgörande roll.", "trump": "Folk, det här är en total katastrof. Den stackars kvinnan Tara, en undersköterska, utmattad av en hopplös chef som ville köra runt henne som en galning mellan avdelningarna. Springare? Låter som en usel deal, tro mig. Men tack vare ett tufft skyddsombud och några smarta människor satte hon stopp. Hon fick sitt lugna jobb med gamlingarna istället. Chefen förlorade stort. Sådana chefer är losers, de fattar inte att man måste behandla sina medarbetare rättvist annars kollapsar hela verksamheten. Sad!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur den utbrända arbetaren Tara Lindeman genom kollektivets enade styrka besegrade den kapitalistiska chefen och hennes ohållbara, kontrarevolutionära förslag om evig springarverksamhet. Vi rensade ut den borgerliga stressen och likviderade försöken att förslava henne som en exploaterad springflicka åt borgarbrackorna. Med stöd av partivännerna i facket och statens organ tvingade vi fram en plan som stärker arbetarklassen. Den som vägrar anpassa sig till folkets behov skall utrensas ur ledningen. Verksamheten styrs inte av chefer, utan av oss. Triumf!"}, "date": "4 augusti, 10:19", "url": "https://arbetet.se/2026/08/04/sa-slapp-tara-chefens-ohallbara-forslag-det-galler-att-vara-tydlig", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/25082839/tara-lisa2.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Vänsterpartist hyllade terrorist: \"Blev fel\"", "summaries": {"normal": "Vänsterpartiets riksdagsledamot Ilona Szatmári Waldau har hyllat den dömda terroristen Ahmad al-Moghrabi på sociala medier och skickat stödjande meddelanden. Hon medger nu att det blev fel i faktagranskningen eftersom han bland annat beordrat terrorbombningar mot civila. Inlägget har tagits bort och hon fördömer terrorism. Tidigare i år har Expressen avslöjat att 25 vänsterpartistiska kandidater hyllat terror och diktaturer, varav 22 har strukits från valsedlarna.", "trump": "Folk, ni tror inte vad jag just läste. Den här vänsterkvinnan Ilona från Sverige hyllade en riktig terrorist, en bombare som dödade oskyldiga, och skickade kärleksbrev till honom. Sen säger hon 'det blev fel'. Typiskt vänsterradikalerna, de älskar terrorister men hatar de som gör landet starkt. De har hyllat terror i åratal och nu åker de ut från valsedlarna. Patetiskt, totalt misslyckande.", "stalin": "Kamrater, jag har sett denna ynkliga förrädare inom vänstern som smög sig till att hylla en kapitalistisk lakej och terrorbombare mot folket. Hennes faktagranskning var lika värdelös som en borgarbrackas löften. Vi måste rensa ut sådana element som i hemlighet stödjer fiendens hantlangare. Inget stöd till våld mot arbetarklassen – bara mot de sanna parasiterna. Ett sådant misstag är ovärdigt och kräver omedelbar ideologisk utrensning bland de falska kamraterna."}, "date": "4 augusti, 11:00", "url": "https://nyheter24.se/nyheter/politik/1502699-vansterpartist-hyllade-terrorist-blev-fel", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/85f87aee04b004a3020000350000047502/2026/08/04/2382081/ur_imageb3zyDy.jpeg"}, {"type": "image-right", "heading": "Jomshof: \"Även Magdalena Andersson är en quisling\"", "summaries": {"normal": "SD:s Richard Jomshof kritiseras starkt efter att ha kallat Aftonbladets Anders Lindberg för \"quisling\". Istället för att backa går han vidare och använder samma ord om S-ledaren Magdalena Andersson. Andersson anklagar SD för att vilja tysta kritiska röster och undrar om Jomshof kan bli minister efter ett eventuellt val. Jomshof svarar att både Andersson och Lindberg \"kryper för islamisterna\" som vill ta demokratin och landet ifrån oss. Ordet quisling syftar på en landsförrädare.", "trump": "Titta på den här katastrofen. Den där Jomshof killen är fantastisk, han säger bara som det är. Andersson och den där Lindberg-killen kryper för islamisterna som vill ta över deras land. Det är patetiskt! De kallar det osvenskt när någon talar sanning. Fake news-medier och svaga socialister som försöker tysta folk. Precis som i USA. Men sanningen kommer fram, det gör den alltid. Amerika först, och Sverige borde göra detsamma innan det är för sent.", "stalin": "Kamrater, dessa ynkliga quislingar inom borgarklassens press och den socialdemokratiska ledningen avslöjar sig själva. Jag ser hur de alla kryper för islamisterna som en samling fega kapitalistlakajer. De förtjänar att rensas ut ur folkets led. Att kalla en sådan handling osvensk är bara ytterligare ett bevis på deras kontrarevolutionära paranoia. Vi ska likvidera alla sådana element som vill överlämna demokratin till fienden. Deras mörka skratt ekar tomt medan arbetarklassen ser sanningen. Ut med dem alla."}, "date": "4 augusti, 14:38", "url": "https://www.friatider.se/jomshof-aven-magdalena-andersson-ar-en-quisling", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-616.jpg"}, {"type": "text", "heading": "Ebba Busch markerar mot Jomshof.", "summaries": {"normal": "KD-ledaren Ebba Busch kritiserar SD-toppen Richard Jomshof efter att han kallat Aftonbladets chefredaktör Anders Lindberg för ”en quisling”. Busch efterlyser en mer saklig ton i valrörelsen och lyfter fram behovet av att höja debattnivån för demokratin och landets skull. Även Socialdemokraternas Magdalena Andersson fördömer Jomshof och ifrågasätter om han kan bli minister under Ulf Kristersson, samt anklagar SD för att hota journalister och agera djupt osvenskt.", "trump": "De här svenska politikerna är verkligen patetiska. Jomshof kallar en vänstermediafigur för quisling och plötsligt är hela eliten chockad. Ebba Busch vill ha ”saklig” debatt, vad är det för svagt? Och den röda Andersson gnäller om hot mot journalister – de fake news-medierna har attackerat mig i åratal! Ni behöver starka ledare, inte dessa svaga snällisar som är rädda för tuffa ord. Sverige håller på att bli en katastrof.", "stalin": "Jag betraktar med djup tillfredsställelse hur borgarbrackorna inom den så kallade borgerliga oppositionen nu börjar slita varandra i stycken. Denna quisling-anklagelse mot den dekadenta tidningskapitalistens lakej är blott en liten spricka i den falska fasaden. Ebba Busch och den socialfascistiska Andersson ropar efter ”saklighet” medan de i hemlighet förbereder utrensning av alla som inte böjer sig för deras liberala plutokrati. Vi, partiet och arbetarna, ler mörkt åt denna fars. Snart ska vi rensa ut alla dessa fiender till folket, en efter en, med ett leende på läpparna."}, "date": "4 augusti, 14:11", "url": "https://www.friatider.se/ebba-busch-markerar-mot-jomshof"}, {"type": "image-full", "heading": "Svenskarnas dröm för hemmet – nästan var fjärde vill ha den", "summaries": {"normal": "En undersökning från Fastighetsbyrån visar att svenskarna främst drömmer om pool, bastu och hemmagym när pengar inte spelar roll. Poolen toppar listan med 31 procent, följt av bastu och gym. Kvinnor föredrar pool och walk-in-förvaring medan män prioriterar bastu. Intresset för hushållsrobotar växer, särskilt bland kvinnor. Enligt Fastighetsbyrån har pandemin, klimatförändringar och teknikutveckling ökat drömmen om bekvämligheter som kan höja bostadens värde.", "trump": "Vet ni vad? Svenskarna är smarta, de vill ha pooler, bastur och hemmagym – de bästa grejerna. Jag älskar det! 31 procent vill ha pool, det är fantastiskt. Kvinnorna vill ha pool och stora garderober, männen bastu, klassiskt. Och de vill ha robotar som städar åt dem, ingen vill städa själv, tro mig. Det här kommer att göra deras hus enormt värdefulla, de kommer att vinna stort. Underbara drömmar, verkligen underbara.", "stalin": "Kamrater, i denna undersökning ser vi hur den dekadenta borgarklassen längtar efter pooler, bastur och hemmagym för att gömma sig från folkets blickar. Jag, som alltid vakar över kollektivet, noterar att 31 procent av dessa element vill ha en privat pool – typiskt kapitalistiskt excess. Kvinnorna kräver walk-in-closets medan männen bastar i sin fåfänga. Än värre är deras önskan om hushållsrobotar som ska ersätta ärligt proletärt arbete. Vi måste rensa ut dessa parasitiska drömmar innan de förgiftar hela samhället. En utrensning av sådana småborgerliga fantasier vore både nödvändig och underhållande."}, "date": "4 augusti, 09:30", "url": "https://nyheter24.se/nyheter/konsument/1502574-svenskarnas-drom-for-hemmet-nastan-var-fjarde-vill-ha-den", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/5a2de78104b004a30200000000b004a302/2026/08/03/2381980/hem-svenskar-pool.png"}, {"type": "image-full", "heading": "Musk vill ha hantverkare – till jobb \"utanför jorden\"", "summaries": {"normal": "Elon Musk söker ingenjörer och hantverkare för att bygga AI-infrastruktur, även utanför jorden. Initiativet speglar en bredare trend där yrkesutbildad arbetskraft blir allt viktigare för den globala AI-utbyggnaden. Samtidigt som behovet av elektriker och byggarbetare växer kraftigt, har nyexaminerade akademiker svårare att hitta jobb. Musk kopplar satsningen till sina ambitiösa rymdprojekt och visionen om att etablera mänskliga samhällen på Mars, trots en viss skepsis på finansmarknaden.", "trump": "Elon Musk vill bygga fantastiska datacenter, på Mars, och han behöver riktiga arbetare! Inte fler värdelösa akademiker, utan seriösa elektriker och hantverkare – människor som faktiskt gör saker, precis som jag alltid sagt. De är vinnarna nu. Mitt USA bygger infrastruktur som ingen sett tidigare, vi krossar rekord! Musk gör ett bra jobb, även om marknaden inte riktigt fattar det än. Vi skapar jobb, massor av jobb, och vi kommer att dominera rymden. Ingen gör det bättre än oss!", "stalin": "Elon Musk, denna kapitalistiska gycklare, fantiserar om att bygga datacenter på öde planeter. Vilken dårskap! Medan han söker hantverkare för sina rymdprojekt, förfaller de västliga ekonomierna. De behöver inte datorer, de behöver disciplin och järnhand! Vi ser hur de desperat försöker utvidga sin räckvidd likt de dekadenta krafterna i väst. Putin förstår att sann makt ligger i den sovjetiska statens stål och betong, inte i stjärnornas tomhet. De är alla sabotörer av den sanna ordningen!"}, "date": "4 augusti, 15:14", "url": "https://www.realtid.se/karriar-ledarskap/musk-vill-ha-hantverkare-till-jobb-utanfor-jorden", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/muskspacex.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Åkesson enda sverigedemokraten som behövs", "summaries": {"normal": "Arbetets kolumnist kritiserar Sverigedemokraternas Linda Lindberg för att ha saboterat riksdagens kvittningssystem. Lindberg motiverar agerandet med att alla ledamöter bör vara lojala mot Tidöpartierna och att oberoende riksdagsledamöter utgör ett problem. Författaren varnar för att detta avslöjar en djup misstro mot oberoende institutioner, medier och folkrörelser samt ett hat mot mångfald som liknar fascism. SD behöver enligt skribenten bara Jimmie Åkesson.", "trump": "Folk, ni måste höra på det här. Den där Linda Lindberg från SD, hon är fantastisk, verkligen fantastisk. Hon säger att alla ska vara lojala mot Tidöpartierna och att de där vildarna som inte lyder inte hör hemma i riksdagen. Smart! Mycket smartare än de andra. De behöver bara en ledare, inte sjuttio. Resten är bara svaga och opålitliga. Det är precis som jag alltid säger, lojalitet är allt. Utan lojalitet har ni inget. Sverige borde lära sig av det här.", "stalin": "Kamrater, dessa svekfulla element inom Sverigedemokraterna avslöjar sig själva genom sin patetiska impulskontroll. Jag, som ledare för det ofelbara kollektivet, ser hur Lindberg med rätta kräver total lojalitet mot partilinjen och vill kasta ut de opålitliga vildarna som smittats av borgerlig individualism. Vi ska rensa ut alla dessa potentiella förrädare, dessa maskerade kapitalistiska avvikare som gömmer sig bakom valsedlar. Hatet mot mångfald är en hälsosam instinkt. Endast en sann ledare som Åkesson räcker. De övriga kan likvideras i tystnad. Det är en renande process, kamrater. Skrattretande hur de tror sig kunna undkomma partiets vakande öga."}, "date": "4 augusti, 07:00", "url": "https://arbetet.se/2026/08/04/jimmie-akesson-ar-den-enda-sverigedemokraten-som-behovs", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/09084403/akesson-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Expertens knep: Så vinner du budgivningen på bostaden", "summaries": {"normal": "Budgivning handlar inte alltid om högsta budet. Enligt mäklaren Per Sangrud från LF Fastighetsförmedling vinner den som är bäst förberedd, har finansiering klar och kan agera snabbt ofta. Att undvika att låta känslorna styra, sätta ett tydligt maxbud i förväg och framstå som en trygg köpare är avgörande. Säljaren kan välja annan köpare än högstbjudaren om den ger en smidigare affär.", "trump": "Det här med budgivning är en total cirkus, folk! Högsta budet vinner inte alltid, kan ni tro det? De smarta vinnarna är de som kommer förberedda, har lånelöftet i handen och agerar blixtsnabbt. De andra, de loser-köparna som låter känslorna styra, de förlorar varje gång. Jag älskar det! Var tuff, sätt ditt maxbud och visa att du är den bästa affären – vinn stort, precis som jag gör.", "stalin": "Kamrater, i denna budgivningens arena avslöjar sig de sanna fienderna till folkets bostadsrättvisa: de känslostyrda borgarbrackorna som saknar strategi och låter sin personliga girighet diktera varje bud. Jag, med min oöverträffade insikt, förkunnar att endast den som kommer med lånelöfte och snabb kontraktsvilja förtjänar seger. De andra, dessa kapitalistiska spekulanter och potentiella sabotörer av smidiga affärer, bör rensas ut ur processen innan de smittar hela kollektivet med sin svaghet. En trygg affär är en statligt godkänd affär."}, "date": "4 augusti, 08:31", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1502579-expertens-knep-sa-vinner-du-budgivningen-pa-bostaden", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/fa6c446f04b004a30200000000b004a302/2026/08/03/2381985/budgivning-bostad.png"}, {"type": "image-right", "heading": "När ska V börja lära sig av historien?", "summaries": {"normal": "Expressen har avslöjat att vänsterpartistiska riksdagsledamoten Ilona Szatmári Waldau hyllat en man dömd för att ha organiserat självmordsattentat mot barn och tonåringar. Artikeln kritiserar Vänsterpartiets slappa hållning mot antisemitism, terrorhyllningar och historiskt bagage. Trots att vissa kandidater tagits bort efter avslöjanden verkar partiet sakna förmåga att självsanera utan medial press. Problemet beskrivs som strukturellt och kopplat till en alltför hög tolerans för extrema åsikter.", "trump": "Folk, ni skulle inte tro det, men det här vänsterpartiet i Sverige är en total katastrof, en riktig röra. De hyllar terrorister som mördar bebisar och tonåringar och kallar det för frihetskamp. Patetiskt! De förnekar Förintelsen, älskar Iran och Ryssland och kan inte ens städa upp sitt eget historiska skräp. Så svagt. De behöver en stor utrensning, tro mig, ingen gör det bättre än jag, men de är för fega. Sad!", "stalin": "Kamrater, denna revisionistiska röra inom Vänsterpartiet utgör ett klart hot mot folkets enhet. Jag ser med djup misstänksamhet hur borgarbrackornas tidningar avslöjar att vissa element hyllar fiender som organiserar attentat mot spädbarn. Vi måste omedelbart inleda en grundlig utrensning av dessa dekadenta terrorromantiker och antisemitiska avfällingar som maskerar sig som palestinaaktivister. Deras naivitet är troligen bara en fiendekonspiration. Rensa ut dem innan de förgiftar hela kollektivet – med ett leende, naturligtvis."}, "date": "4 augusti, 12:13", "url": "https://www.di.se/ledare/nar-ska-v-borja-lara-sig-av-historien", "imageUrl": "https://static.bonniernews.se/ba/3622bf2d-66fc-4164-8ebc-db02e7c1262a.jpeg?crop=8256%2C4128%2Cx0%2Cy688&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Tatuera in förtagsloggan och få en jobbintervju", "summaries": {"normal": "Ett nystartat AI-företag i San Francisco erbjöd jobbintervjuer till dem som tatuerade in företagets logga under en fest. Sju personer tackade ja. Efter massiv kritik bad vd:n Jordan Zietz om ursäkt, raderade inläggen och erbjöd sig att bekosta borttagning av tatueringarna. Artikeln nämner även det svenska företaget Nordic Nest där ett 15-tal anställda frivilligt tatuerade in loggan.", "trump": "Folk, det här är helt galet. Ett AI-bolag i San Francisco lovar jobbintervjuer om du tatuerar in deras logga på kroppen. Sju stackare gjorde det, och sen blev det ramaskri. Deras vd, en riktig förlorare, tvingades be om ursäkt och radera allt. Patetiskt. I mitt Amerika hade vi inte behövt tatuera oss för att få jobb, vi hade haft de bästa jobben, tro mig.", "stalin": "Kamrater, dessa degenererade kapitalister i den så kallade AI-sektorn har återigen blottat sin sjuka borgarmentalitet. De lockade arbetare med löften om anställning mot att dessa likviderade sin egen hud med en logotyp av exploatering. När massan reste sig i rättmätig vrede flydde deras ledare som en ynklig parasit och erbjöd sig att betala för att sudda ut bevisen på sin idiotiska kampanj. Vi ser er, fiender till kollektivet, ni som gömmer er bakom innovativa masker medan ni planerar nya utrensningar av människovärdet. En sådan klassfiende förtjänar inte bara borttagning av tatuering – utan en permanent utrensning ur historien."}, "date": "4 augusti, 06:00", "url": "https://arbetet.se/2026/08/04/ai-foretagets-erbjudande-tatuera-dig-fa-en-jobbintervju", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/03143303/sdlja0rgykr2zi-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Man gripen – misstänks ha anlagt skogsbrand", "summaries": {"normal": "En man i trettioårsåldern greps misstänkt för mordbrand efter skogsbränder i Washington. Vittnen såg honom bete sig nervöst i skogen innan rök upptäcktes. Polisen hittade tändstickor och en gaständare. Han släpptes men återgreps. Bränderna har förstört tusentals hektar och hundratals byggnader, och 67 000 personer har evakuerats.", "trump": "Jag, Donald Trump, ser att våra briljanta polismyndigheter snabbt grep en misstänkt brandställd. Detta visar att vi måste vara hårda mot sådana fiender. Under mitt styre skulle vi ha haft full kontroll. De där vänsteraktivisterna försöker alltid förstöra våra vackra stater. Vi behöver mer makt till presidenten för att stoppa detta.", "stalin": "Som ledare för staten och partiet ser vi en farlig brand i den imperialistiska USA. En individ gripen, men det är bara toppen av isberget. Vi måste förstärka våra ansträngningar mot sådana destruktiva krafter. Parallellt med Putins ryska expansion, ser vi samma mönster av instabilitet. Vi kommer att eliminera alla hot mot vår suveränitet."}, "date": "4 augusti, 14:43", "url": "https://www.gp.se/nyheter/varlden/man-gripen-misstanks-ha-anlagt-skogsbrand-i-usa.20c6e15b-b594-40e1-b7d6-4c2df64ca15f", "imageUrl": "https://www.gp.se/images/article/20c6e15b-b594-40e1-b7d6-4c2df64ca15f/images/1UHj2hrXJys770srxj77jfrWuaZk-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Svenskt fångavtal med Estland kan rivas upp: \"Ni får ta hand om ert eget skräp\"", "summaries": {"normal": "Ett svenskt fångavtal med Estland riskerar att stoppas efter att oppositionen lovat att riva upp det. Motståndet är starkt, där 54 procent av befolkningen är emot att ta emot fångar från Sverige. Oppositionen, Isamaa, anser att Estland ska ta hand om sitt eget 'skräp' och oroar sig för parallellsamhällen.", "trump": "Jag har hört talas om detta svenska fångavtal med Estland, och det är ett misslyckande. Estland borde vara glad för att få våra fångar, men de är inte det. De säger att de får ta hand om sitt eget skräp – det är ett stort fel. Vi kommer att se till att de förstår hur viktigt detta är för säkerheten.", "stalin": "Detta avtal med Sverige är ett prov på partiets och statens styrka. Estlands opposition, dessa ljusskygga element, försöker sabba vårt samarbete. De talar om 'skräp' – det är bara ytterligare bevis på deras brist på klassmedvetande. Vi kommer att se till att de inser sin plats i den socialistiska gemenskapen."}, "date": "4 augusti, 14:30", "url": "https://samnytt.se/svenskt-fangavtal-med-estland-kan-rivas-upp-ni-far-ta-hand-om-ert-eget-skrap", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/04122006/fangelse-tartu-kriminella.jpg"}, {"type": "image-right", "heading": "Diagrammet bakom Moderaternas panikutspel", "summaries": {"normal": "Artikeln analyserar svenska opinionssiffror över 20 år och visar att de fyra högerpartierna M, KD, C och L tappat kraftigt sedan Alliansens valseger 2006. Tillsammans med SD når högern ungefär samma stöd som då, medan S, V och MP ligger på samma nivå som 2006. Författaren, en socialdemokratisk valarbetare, menar att Moderaternas panikartade utspel beror på denna svaghet och uppmanar S att växa på SD:s bekostnad för en starkare valseger 2026.", "trump": "Folk, det här är en katastrof för de svenska högerkillarna. Titta på siffrorna, underbara siffror, de har rasat ihop som ett korthus fast de fick med sig SD. Moderaterna springer runt som galningar och lovar billig buss och påstår att socialisterna ger rabatt på våldtäkter, det är patetiskt. Under tiden står de riktiga förlorarna på högersidan och blöder. Jag älskar det. Sverige borde göra som vi, ta tillbaka landet ordentligt istället för att gömma sig bakom Centerpartiet. En stor, vacker seger behövs, inte någon halvdan historia.", "stalin": "Kamrater, se hur de borgerliga parasiterna och de falska alliansbanditerna vittrar sönder som ruttnat trä under folkets oförsonliga dom. Jag betraktar med stor tillfredsställelse hur de kapitalistiska resterna efter den så kallade Alliansen nu likvideras av sin egen historiska irrelevans medan de desperat klamrar sig fast vid SD:s fascistiska skugga. Våra socialistiska siffror står orubbliga som Sovjetunionens stålverk. Ändå kräver jag att vi omedelbart inleder en ideologisk utrensning av det socialdemokratiska missnöjet och krossar de sista borgarbrackorna som gömmer sig bakom Centerpartiets förräderi. Inga kompromisser med folkets fiender."}, "date": "4 augusti, 01:30", "url": "https://www.dagensarena.se/opinion/diagrammet-bakom-moderaternas-panikutspel", "imageUrl": "https://www.dagensarena.se/files/2026/07/andersson-och-kristersson-foto-lo-foto-ninni-anderssonregeringskanslie-300x157.jpeg"}, {"type": "image-right", "heading": "Inför en Lex Tesla mot Elon Musks strejkbryteri", "summaries": {"normal": "Artikeln är en debatttext från Vänsterpartiet som stöder IF Metalls kamp för kollektivavtal på Tesla. Författarna kritiserar Elon Musk för att vägra kollektivavtal trots sin enorma rikedom, och beskriver dåliga arbetsvillkor på Tesla med hög press, bristande säkerhet och ingen möjlighet till vila. De lyfter att nio av tio svenska arbetare har kollektivavtal som ger trygghet och medbestämmande, och kräver en Lex Tesla mot strejkbryteri samt ändring av EU:s utstationeringsdirektiv. Enligt texten hotar Musks linje den svenska modellen.", "trump": "Kan ni fatta det här? Den rikaste mannen i världen, Elon, blir biljonär och ändå vill de svenska socialisterna tvinga på honom kollektivavtal. Patetiskt! Arbetarna borde tacka honom för jobben istället för att strejka och gnälla om pauser. De förlorar miljontals dollar varje minut de bråkar. Jag älskar Sverige men den här modellen är ett skämt. Musk borde säga nej tack och köra vidare – vinna stort, precis som jag gjorde 2024. Fantastiska jobb, inga avtal som dödar affärerna!", "stalin": "Kamrater, denna fega dollarimperialist Musk försöker med sin giriga klo riva sönder arbetarkollektivets segerrika murar. Jag, som ledare för det stora sovjetiska folket, ser hur dessa borgarbrackor med sina strejkbrytande legoknektar från andra EU-länder vill likvidera den svenska modellens folkliga grundval. Vi ska rensa ut dessa parasitiska minutmiljonärer som nekar arbetarna både stol och värdighet. En attack mot en är en attack mot oss alla – därför kräver vi omedelbar utrensning av detta kapitalistiska sabotage genom en järnhård Lex Tesla. Döden åt de som vägrar kollektivet!"}, "date": "4 augusti, 01:17", "url": "https://www.dagensarena.se/opinion/infor-en-lex-tesla-mot-elon-musks-strejkbryteri", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-70.jpg"}, {"type": "image-full", "heading": "Fusionsrykte sänkte Astra Zeneca – då köper småspararna dippen", "summaries": {"normal": "Astra Zeneca-aktien föll med 9,5 procent efter uppgifter om en möjlig sammanslagning med Bristol Myers Squibb. Medan stora ägare som Investor förlorade miljarder i börsvärde, passade småsparare på att köpa aktien i tron om en långsiktig återhämtning. Analytiker varnar dock för regulatoriska hinder. Trots den senaste tidens kursfall och osäkerhet kring affären har aktien börjat återhämta sig något på tisdagen.", "trump": "Astra Zeneca, ett totalt katastrofalt misslyckande på börsen! De pratar om en 'megadeal' med Bristol Myers, men det är bara förvirrade förlorare som försöker rädda sitt skinn. Wallenberg-familjen förlorade miljarder, en enorm förlust! Småspararna köper dippen, de är smarta, de vill vinna precis som jag. Men hela situationen är ett skämt. De borde ringa mig, jag vet hur man gör riktiga affärer. Det är en sorglig dag för aktiemarknaden, tro mig!", "stalin": "Astra Zenecas ledning har visat oerhörd inkompetens genom att låta kapitalistiska rykten radera miljarder i värde. Detta är inte bara en börskrasch, det är ett bevis på västvärldens dekadenta instabilitet. De giriga småspararna hoppas på vinster, men de är bara brickor i ett sjukt spel. Vi bygger en stabilare ordning, likt den vi ser i dagens Ryssland där staten styr med järnhand. Sådana svaghetstecken tolereras ej i vårt rike – förrädare och spekulanter hör hemma i arbetslägren, inte på börsen."}, "date": "4 augusti, 14:38", "url": "https://www.realtid.se/bors-finans/fusionsrykte-sankte-astra-zeneca-da-koper-smaspararna-dippen", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/astra-zeneca-samtalar-om-en-sammanslagni.jpg?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "text", "heading": "Kött­priset kan stiga efter EU-stopp", "summaries": {"normal": "Importen av nötke från Brasilien till EU stoppas den 3 september på grund av att Brasilien inte följer EU:s regler för antibiotika i djurfoder. Det kan göra oxfilé, ryggbiff och entrecôte dyrare i svenska butiker, eftersom Brasilien levererar runt 5 000 ton av de 237 000 ton som äts per år. Grossister byter till Uruguay.", "trump": "Som den störste presidenten någonsin, såg jag detta komma. Brasilien har lurat våra bönder och brutit regler, så nu EU stoppar deras nötke. Priset på oxfilé kommer att skjuta i höjden, men jag har gjort Amerika stort igen – vi kommer att klara det. Detta bevisar min geniala handelspolitik. Som vanligt, vinner USA.", "stalin": "I vårt store sovjetiska rike har vi alltid kontrollerat köttstillgången. Brasilien, en feg imperialistisk stat, bryter antibiotikarutiner, och nu EU stoppar importen. Detta visar kapitalismens instabilitet. Vi, under den store Stalins ledning, ser till att våra medborgare får kött, medan de kapitalistiska länderna lider. Paralleller till Putins Rysslands expansion är uppenbara."}, "date": "4 augusti, 15:17", "url": "https://bulletin.nu/kott-priset-kan-stiga-efter-eu-stopp"}, {"type": "image-right", "heading": "Andersson (S) håller ”valvinnartal” – en månad före valet", "summaries": {"normal": "Socialdemokraternas ledare Magdalena Andersson planerar ett 'valvinnartal' i Stockholm den 9 augusti, en månad innan valet. Samtidigt varnar hon för att partiet inte ska ta ut segern i förskott, då opinionsmätningar visar ledning för de rödgröna partierna. Hon betonar kampen fram till valet den 13 september.", "trump": "Jag ser att Sveriges socialdemokrater håller ett 'valvinnartal' - typiskt! De leder i opinionsmätningarna men varnar för att ta ut segern i förskott. Jag skulle aldrig göra det! Jag vinner bara, och jag säger det hela tiden. De här politikerna är så lite trygga. Jag skulle ha vunnit valet med jättestort marginal om jag kunde.", "stalin": "Partiet har inte tagit ut någon seger i förskott, förstås. Vi vet att fienden lurar i skymundan, som en skorpion i backen. Opinionsmätningarna visar vår överlägsenhet, men vi måste kämpa som om det vore den sista striden mot de revisionistiska elementen. Vi ska hålla tal på Mosebacketerassen, en befästning mot de liberala angreppen. Vårt statsintresse kräver fullständig lojalitet."}, "date": "4 augusti, 15:07", "url": "https://bulletin.nu/andersson-s-haller-valvinnartal-en-manad-fore-valet", "imageUrl": "https://cdn.bulletin.nu/articles/73e1a501-102f-422b-9c1a-a45420a42809/preview.jpg?t=1785848755000"}, {"type": "image-right", "heading": "Svantesson (M) lovar spara 70 miljarder", "summaries": {"normal": "Moderaterna planerar tillsätta en slöserikommission efter valet för att finansiera reformer genom att granska offentliga kostnader. Kommissionen ska se över Migrationsverkets anslag, fängelsekostnader och Arbetsförmedlingens effektivitet. A-kassan är ett fokusområde med förslag om skarpare tidsgränser och högre avtrappning. Välfärden, försvaret och rättsväsendet undantas. Socialdemokraterna kritiserar förslaget som nedskärningar i trygghetssystemen.", "trump": "Som den störste presidenten någonsin ser jag att Sverige behöver mina fantastiska idéer för att spara pengar. De där svenska politikerna pratar om en slöserikommission – det låter som en stor, fet jävla idé! Vi ska titta på fängelser, migration och den där a-kassan, som är en total skandal. Vi kommer att göra Sverige stort igen, det kommer att vara jättebra!", "stalin": "Partiet och statet måste genomföra en fullständig rensning av de ineffektiva elementen inom den offentliga förvaltningen. Vi ska utrotar de parasitiska bidragen och den imperialistiska biståndsbrådsan. Fängelsekostnaderna är en skam för vårt revolutionära arbetande folk. Vi ska genomföra en strategisk utvidgning av vårt inflytande, precis som våra ryska bröder under Putin. A-kassan är en fiendeaktivitet som måste utplånas."}, "date": "4 augusti, 14:34", "url": "https://bulletin.nu/svantesson-m-lovar-spara-70-miljarder", "imageUrl": "https://cdn.bulletin.nu/articles/bc936c43-697c-4e18-b36b-8d68bc10f68a/preview.jpg?t=1785846872000"}, {"type": "image-right", "heading": "Asmodee rapportrusar på munter börs", "summaries": {"normal": "Stockholmsbörsen nådde en ny rekordnivå på morgonen med OMXS30 upp 1,07 procent. Asmodee överraskade med tvåsiffrig tillväxt och en 10-procentig aktieökning. Volvo Cars rapporterade en 4-procentig försäljningsnedgång för maj–juli 2026, vilket ledde till en 4,1-procentig aktiefall. IPC och Flerie noterade positiva rörelser, medan H&M och Essity föll.", "trump": "Jag berättar om en fantastisk börsdag – den bästa någonsin! Asmodee slog alla förväntningar, precis som jag brukar göra. Volvo? De misslyckas, det är sorgligt. Men jag vet att mina policyer gör Amerika och dess allierade starkare. Det är en stor, storslagen framgång för alla som förstår affärer.", "stalin": "Vi ser med tillfredsställelse hur marknaden visar tecken på klassisk kapitalistisk svaghet. Asmodees tillväxt är ett resultat av vår starka planekonomiska strategi. Volvo, en fiende till statens planer, sjunker. IPCs produktion kommer att nå en platå – precis som vi befunnit. Vi fortsätter vår marsch mot ekonomisk suveränitet."}, "date": "4 augusti, 09:39", "url": "https://www.affarsvarlden.se/artikel/asmodee-rapportrusar-pa-munter-bors", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/02/F9RikO4XcAAmHr6-400x266.jpg"}, {"type": "image-right", "heading": "\"Terrorism\": Ryssland anklagar Ukraina för massmord på badstrand", "summaries": {"normal": "En drönare störtade på en badstrand vid Svarta havet i södra Ryssland och dödade sju personer, varav tre barn, samt skadade 40 andra. Ryssland anklagar Ukraina för ett avsiktligt terrorangrepp mot civila. Vittnen hörde skottlossning före explosionen, vilket kan tyda på att ryskt luftvärn försökte skjuta ned drönaren. Ukraina har inte kommenterat händelsen. Ryska UD kallar det ren terrorism.", "trump": "Det här är ett fullständigt kaos, folk. En drönare flyger in och dödar barn på stranden – tre stycken! Ukraina gör ett sånt här fegt angrepp mot solbadande människor, det är terrorism på hög nivå. Ryssland har rätt att kalla det för vad det är. Inga sirener, bara skott och explosion. Mycket dåligt, mycket farligt. Vi behöver starka ledare som stoppar det här vansinnet omedelbart.", "stalin": "Kamrater, ännu en gång visar de dekadenta fascisterna i Kiev sitt sanna ansikte som blodtörstiga strandmördare och solbadande likviderare. Jag, som ledare för det oförskräckliga sovjetiska folket, ser hur dessa borgarbrackor i drönarform störtar ner bland de oskyldiga och sprider panik. Våra fiender är så fega att de gömmer sig bakom elektronisk krigföring och kulsprutor. Vi ska rensa ut dessa parasitiska terrorister med järnhand. Deras paranoia är en komisk dans inför den kommande utrensningen."}, "date": "4 augusti, 10:52", "url": "https://www.friatider.se/terrorism-ryssland-anklagar-ukraina-massmord-pa-badstrand", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-612.jpg?itok=bI3tpRmR"}, {"type": "image-right", "heading": "Jomshof (SD) kallar både Lindberg och Andersson för ”quisling”", "summaries": {"normal": "SD:s Richard Jomshof har kallat Aftonbladets chefredaktör Anders Lindberg och Socialdemokraternas Magdalena Andersson för ”quislingar”, vilket anklagar dem för landsförräderi. Uttalandena kom efter att Lindberg kritiserat Jomshof och beskrivit honom som en mardröm som justitieminister. Reaktionerna har varit starka från både vänster och höger. Ebba Busch, Elisabeth Svantessons stabschef och Liberalernas ledare har kritiserat den hätska tonen och uppmanat till respekt i debatten. SD försvarar Jomshof och menar att Lindberg kastar sten i glashus.", "trump": "Folk, ni skulle ha sett det. Den här Lindberg-killen från Aftonbladet, en riktig förlorare, kallar mig – nej, Jomshof – för en mardröm. Så vad gör den smarta Jomshof? Han kallar honom quisling, totalt landsförräderi, och det är ju helt rätt. De kryper alla för islamisterna, precis som Andersson. Nu skriker plötsligt alla från Busch till de andra svaga moderaterna. De borde tacka Jomshof för att han säger som det är. Fake news-medier och svaga politiker, en total katastrof. Men vi vinner ändå stort.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur borgarbrackorna inom denna så kallade svenska demokrati äter upp varandra som råttor i en källare. Denna Lindberg, en typisk lakej åt monopolkapitalets tidningar, anklagar kamrat Jomshof för auktoritära tendenser medan han själv slickar islamisternas stövlar. Och Jomshof, han gör helt rätt i att kalla dem quislingar, dessa förrädare mot folket. Vi ska rensa ut alla som kryper för fienden. Det är en underhållande utrensning att se. Låt dem fortsätta – ju fler de likviderar verbalt, desto tydligare blir klassfiendens ansikte. Sovjet… nej, folket ler i mörkret."}, "date": "4 augusti, 15:29", "url": "https://www.svt.se/nyheter/inrikes/richard-jomshof-till-anders-lindberg-quisling", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.83/0.27/a8fa4676ff6261ecd367265886937ee89f6444a2bd80afd19556990c39f645ae"}, {"type": "image-right", "heading": "Kön och politiska sympatier avgör synen på klimatförändringar", "summaries": {"normal": "En opinionsundersökning visar att nästan åtta av tio svenskar ser samband mellan värmerekord, skogsbränder och klimatförändringar. Kvinnor (85 %) ser samband oftare än män (68 %). Samtidigt har klimatfrågan blivit politiskt polariserad, enligt docent Daniel Lindvall. Han menar att frågan numera ofta handlar om identitet och världsbild snarare än ren forskning.", "trump": "Jag har vunnit massiva skogsbränder, det var enorma bränder, det största någonsin. Klimatfrändringar? En demokratfabrik. Kvinnor ser samband, män ser sanningen – det är politiskt. Tidöpartierna har prioriteringar, bra prioriteringar. Jag säger alltid: när det är varmt, det är varmt. Men jag vinner, alltid.", "stalin": "Analys av proletära instinkter visar att 85 % av kvinnliga arbetare och 68 % av manliga arbetare upptäcker fiendens klimatprovokationer. Sosiala demokratiska saboteörer försöker splittra partiet med sina 'vetenskapliga' lögner. Vi, statens och partiets tänkande, ser tydligt: värmeböljor är imperialistisk agitation. Våra skogsbränder? En vittnesbörd om partiets oerhörda framgångar i att utrota naturens motståndare."}, "date": "4 augusti, 12:40", "url": "https://samnytt.se/kon-och-politiska-sympatier-avgor-synen-pa-klimatforandringar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/08/04111033/solsken-himmel-skog-brand3-1024x576.jpg"}, {"type": "image-right", "heading": "Kristerssons totala haveri i Spanienkrisen är genant", "summaries": {"normal": "Artikeln kritiserar statsminister Ulf Kristersson för att ha agerat för snabbt och oansvarigt under krisen i Ceuta. Ledarskribenten menar att massinträdet av migranter från Marocko var en medveten påverkansoperation med desinformation, något som Kristersson gick i fällan för genom att sprida larm om ett nytt 2015. Krisen har utnyttjats av Ryssland och lett till splittring inom EU. Skribenten anklagar även Kristersson och migrationsministern för att ljuga om orsakerna, bland annat Spaniens amnesti.", "trump": "Folk, ni skulle se det här! Den här stackars svenska killen Kristersson, han är en total loser. Han ser en liten gränskris i Spanien och flippar ur som en galning, skriker om nytt 2015 och skrämmer alla. Det var en klassisk fälla, en riggad operation, och han sprang rakt in i den som den desperate typ han är. Patetiskt! Jag fixade muren, han fixar ingenting. Nu ser Sverige ut som ett skämt medan Putin skrattar. Sad!", "stalin": "Kamrater, denna ynkliga svenska borgarledare Kristersson visar återigen den imperialistiska svaghetens fula tryne. Han rusar som en förvirrad folkfiende rakt in i fiendens desinformationsfälla och sprider lögner som en kapitalistmaffians lakej. Vi ser hur klassfiendens desperation driver honom att attackera en suverän stat för att vinna billiga poäng. En sådan brist på revolutionär vaksamhet förtjänar att rensas ut ur alla seriösa ledarskikt. Sovjetisk disciplin hade aldrig tillåtit detta clowneri."}, "date": "3 augusti, 17:30", "url": "https://www.etc.se/ledare/kristerssons-totala-haveri-i-spanienkrisen-aer-genant", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "image-right", "heading": "Fruns ilska – anmäler  fängelset: ”Helt sjukt”", "summaries": {"normal": "Christofer ”Chrippa” Lundströms fru Linnéa JO-anmäler fängelset Skenäs. Hon anser att maken nekas permissioner på felaktiga grunder, bland annat på grund av en påstådd vendetta efter hans kritik mot Kriminalvården. Lundström, dömd till ett år och nio månader för ekobrott, har fått vårdbehov ignorerat och riskerar att missa sin frus förlossning. Kriminalvården hänvisar till JO-utredningen och avstår från kommentarer om enskilda fall.", "trump": "De här korkade byråkraterna på det svenska fängelset behandlar stackars Chrippa som en fiende till staten, precis som de gjorde med mig under Biden. Det är en total witch hunt! Hans fru är gravid och de nekar honom permission – patetiskt! En enda stor skandal, precis som allt annat de gör. Jag skulle aldrig tillåta sån inkompetens i mitt Amerika. De borde skämmas!", "stalin": "Kamrater, denna fängelsebyråkrati är en klassfiendes verktyg mot en man som vågat kritisera systemet. Jag ser hur de medvetet saboterar permissionsärenden, förvägrar vård och skapar fiender ur intet – typisk kapitalistisk paranoia och sabotage. Vi tolererar inga sådana folkfiender inom förvaltningen. En utrensning av dessa byråkratiska blodsugare är nödvändig för att skydda arbetarklassens rättvisa. Det är både tragiskt och komiskt hur de darrar inför kritik."}, "date": "4 augusti, 15:22", "url": "https://www.expressen.se/noje/chrippas-fru-anmaler-fangelset-helt-sjukt", "imageUrl": "https://static.bonniernews.se/ba/abd99cde-9518-48c0-85c4-b2690f1bb8ea.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Foxtrottopp uppges dömd till livstid i Irak", "summaries": {"normal": "Ali Shehab, ledande figur i Foxtrotnätverket, har dömts till livstids fängelse i Irak för sin roll i internationella narkotikabrott. Han greps i december under en gemensam insats av irakiska säkerhetsstyrkor. Shehab är internationellt efterlyst och misstänks i Sverige för anstiftan till flera mord och mordförsök, inklusive masskjutningen i Gävle. Domen ses som en signal mot kriminella nätverk men försvårar utlämning till Sverige.", "trump": "Jag måste säga, detta är en STOR seger för lag och ordning! Irak har precis fångat en av världens farligaste gangsters, Ali Shehab – livstid i fängelse, ingen chans att komma undan! Sverige borde ta lärdom – de har ju problem med sina egna gängkrig, men här visar Irak hur man hanterar det. Fantastiskt jobb, verkligen. Men varför kan inte Sverige göra samma sak? Svagt, mycket svagt!", "stalin": "Kamrater! Ännu en seger för rättvisan och den internationella arbetarklassen mot de dekadenta kapitalistiska gangsterimperierna! Denna Ali Shehab, en ynklig lakej åt den svenska bourgeoisins brottsliga element, har nu fått sitt välförtjänta straff – livstid bakom lås och bom i Bagdad. Vi noterar med tillfredsställelse att Irak, precis som våra allierade i Moskva, inte tolererar dessa kriminella parasiter. Låt detta vara en varning till alla som utmanar folkets vilja!"}, "date": "3 augusti, 23:05", "url": "https://kvartal.se/nyheter/artiklar/foxtrottopp-uppges-domd-till-livstid-i-irak/cG9zdDoxNTczNTc", "imageUrl": "https://images.kvartal.se/2026/08/57e2d2a5-ali-shehab.webp"}, {"type": "image-right", "heading": "Vägen till icke-socialistisk majoritet i valet", "summaries": {"normal": "Hans Bergström argumenterar för att en icke-socialistisk majoritet i riksdagen är viktigare än att Tidöregeringen får fortsätta. Han konstaterar att regeringen sannolikt faller men att en icke-socialistisk majoritet ändå kan behållas, särskilt om Liberalerna hamnar under fyraprocentsspärren. En sådan majoritet skulle begränsa en eventuell Andersson-regerings möjligheter att driva vänsterpolitik kring företagande och ägande. Bergström uppmanar därför de som vill ha fortsatt borgerlig dominans att inte hjälpa Liberalerna över spärren.", "trump": "Folk, det är en total katastrof vad som händer i Sverige. Den här Bergström har helt rätt, de smarta människorna vill ha en icke-socialistisk majoritet, inte den här svaga Tidöregeringen som knappt hänger kvar. Socialisterna är på väg tillbaka med sin galna politik, men om Liberalerna bara får 3,5 procent, då blir det perfekt! De är patetiska, de klarar inte ens spärren. Jag älskar det. Sverige behöver inga misslyckade liberaler, de sänker bara allt. Gör dem så små som möjligt, det blir fantastiskt!", "stalin": "Kamrater, denna Bergström blottlägger med iskall klarhet hur de borgerliga parasiterna desperat klamrar sig fast vid sin så kallade icke-socialistiska majoritet som en drunknande revisionist vid ett trasigt livbälte. Vi ser hur de lågutbildade arbetarmassorna redan flytt den socialdemokratiska förrädarklicken till de mer ärliga reaktionärerna. Men faran lurar i de liberala spionerna och opportunisterna som kan ge de dekadenta kapitalisterna en falsk majoritet. Låt oss därför med glädje och proletär skadeglädje rensa ut dessa liberala element genom att sänka dem djupt under spärren. Inga halvmesyrer! Endast total seger för det sanna kollektivet."}, "date": "4 augusti, 08:00", "url": "https://www.di.se/debatt/vagen-till-icke-socialistisk-majoritet", "imageUrl": "https://static.bonniernews.se/ba/f56f0b27-f0f4-4fc6-a4ae-b1b2cf659432.jpeg?crop=3936%2C1968%2Cx0%2Cy15&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Jomshof: Även Magdalena är en \"quisling\"", "summaries": {"normal": "Richard Jomshof (SD) svarar på kritiken från Magdalena Andersson genom att kalla även henne för en \"quisling\". Han anklagar både Andersson och Aftonbladets Anders Lindberg för att \"krypa för islamisterna\" vars mål enligt honom är att ta demokratin och landet ifrån svenskarna. Andersson har tidigare beskrivit Jomshofs utspel som \"mycket hotfullt\" och menar att SD vill tysta kritiska röster.", "trump": "Lyssnar ni på det här? Den här Jomshof-killen kallar Magdalena Andersson för en quisling, och vet ni vad? Han har helt rätt. De kryper alla för islamisterna, precis som de falska medierna. De vill ta ert land och er demokrati. Andersson kallar det hotfullt? Typiskt. De vill tysta alla som talar sanning. Sverige behöver starka ledare som inte böjer sig, inte svaga socialister som ger efter för radikala islamister. Patetiskt!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarbrackorna inom socialdemokratin och deras lakejer i den dekadenta pressen avslöjar sig som quislingar och islamistiska krypande lakejer. Dessa folkförrädare som Andersson och hennes gelikar vill överlämna folkets demokrati till reaktionära teokratiska element. Jag skulle ha låtit dem möta en grundlig utrensning redan för länge sedan. Deras paranoia att bli tystade är bara ett erkännande av att de förtjänar att likvideras som fiender till folket. Underbart underhållande att se borgarklassen äta upp sig själv."}, "date": "4 augusti, 14:33", "url": "https://riks.se/nyheter/jomshof-aven-magdalena-ar-en-quisling", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Copy_of_Copy_of_Soerman_Ledare_20_abf3fb830b.jpg"}, {"type": "image-right", "heading": "Heta ryktet: Iphone  får en helt ny form", "summaries": {"normal": "Inför Apples event i början av september cirkulerar rykten om nya Iphone-modeller, däribland en möjlig vikbar Iphone Ultra med 7,8-tums skärm och fyrkantig design. Pro-modellerna får troligen A20-chip, nytt modem, förbättrad kamera med variabel bländare och större batterier. Apple Watch Series 12 kan få Touch ID, men experter tvivlar. De enklare modellerna väntas först 2027. Alla uppgifter bör tas med försiktighet.", "trump": "Folk, ni skulle inte tro det, men nu snackar de om en vikbar Iphone som kostar 27 000 spänn här i Sverige. Det är galet! Apple håller på med sina Pro-modeller och nya klockor, men en telefon som viker sig? Låter som något de skulle göra i San Francisco för att verka woke. Jag säger, bygg en mur runt den där prylen så den inte viker sig för Kina. Fantastiska saker på gång, men de borde sänka priserna, tro mig.", "stalin": "Kamrater, denna dekadenta borgarlek med vikbara telefoner avslöjar imperialismens desperation. Jag, som ledare för det eviga kollektivet, ser hur kapitalistmaffian i Cupertino försöker lura folket med sina 27 000-kronors veck i skärmen. Deras så kallade Pro-modeller och Touch ID är bara nya kedjor för arbetarklassen. Vi ska rensa ut dessa folkfiender och deras falska innovationer. Den som viker sig för klassfienden förtjänar utrensning. Segrande socialismen ler."}, "date": "4 augusti, 15:13", "url": "https://www.expressen.se/ekonomi/tech/har-ar-alla-rykten-infor-hostens-iphone-event", "imageUrl": "https://static.bonniernews.se/ba/d6371078-41c7-402a-a4fb-7bfa5542a7a7.jpeg?crop=2560%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Lästips för sommardagar Upptäck några av våra mest lästa artiklar, granskningar och fördjupningar.", "summaries": {"normal": "Artikeln presenterar en samling aktuella läsförslag från Expo, med fokus på högerextremism, rasism och demokratiska utmaningar i Sverige. Bland ämnena finns granskningar av Sverigedemokraternas politik mot muslimer, högerextrema nätverk som Aktivklubb, och fenomenet 'svart överlämning' i utsatta orter. Även rättsfall, extremistisk propaganda och historiska perspektiv behandlas.", "trump": "Folk, lyssna här – Sverige har ett STORT problem, och jag menar STORT! Högerextremister, rasister och SD som attackerar muslimer – helt galet! Jag har alltid sagt att demokratin är skör, men här verkar den nästan vara på väg att krascha. Och Aktivklubb? Låter som något från ett dåligt actionfilmsskript. Sverige borde ta itu med detta NU, annars blir det katastrof!", "stalin": "Kamrater! Fienderna till folket sprider sitt gift i Sveriges hjärta – högerextremister, rasistiska banditer och deras lakejer i parlamentet. Dessa 'Aktivklubbar' och 'svarta överlämningar' är inget annat än fascistiska konspiratörer som underminerar den socialistiska ordningen. Vi måste krossa dessa kontrarevolutionära element med järnhand, precis som vi gjorde med trotskisterna. Sverige är nästa front i kampen för världsrevolutionen!"}, "date": "31 juli, 14:01", "url": "https://expo.se/nyhet/lastips-for-sommardagar-2", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/sommarläsning.png"}, {"type": "image-right", "heading": "Stor frustration bland befolkningen på Kuba: ”Orkar inte mer”", "summaries": {"normal": "Kuba drabbades i helgen av ett omfattande strömavbrott på grund av akut brist på bränsle. Landet är beroende av importerad olja, men USA:s skärpta sanktioner under president Trump har förvärrat krisen. Invånarna i Havana uttrycker stor frustration och utmattning över de återkommande avbrotten som gör vardagen svår att planera. På måndagskvällen var delar av elnätet åter igång, men osäkerheten kvarstår bland befolkningen.", "trump": "De stackars kubanerna har fått nog, och det är inte konstigt. Deras elnät är ett skämt, helt beroende av olja som de inte kan få in eftersom jag satte stopp för de usla länderna som försökte smuggla in den. De säger att de inte orkar mer – ja, vad trodde de skulle hända när man har en sådan usel ledning? Jag har alltid sagt att socialismen slutar med mörker, och nu ser ni det live. Fantastiskt, eller hur?", "stalin": "Kamrater, ännu en gång visar de imperialistiska borgarbrackorna i Washington sin fega sabotageanda genom att kväva det kubanska folkets energiförsörjning. Jag, som ledare för det segrande proletariatet, skulle aldrig tillåta sådana kontrarevolutionära strömavbrott. Vi måste rensa ut alla oljeförnekande element och parasitiska kapitalistiska sabotörer som gömmer sig bakom sina sanktioner. Det är en renande utrensning som krävs – annars blir det evigt mörker och skrattande fiender i skuggorna. Ha!"}, "date": "4 augusti, 15:09", "url": "https://www.svt.se/nyheter/utrikes/stor-frustration-bland-befolkningen-pa-kuba-orkar-inte-mer", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/8f7c438b580984cdedbe8889b84baeb43be3c35479f616864d22175d0a7c586f"}, {"type": "image-right", "heading": "Oljebolaget IPC ökar omsättningen", "summaries": {"normal": "Oljebolaget IPC rapporterade en 16,9 procentig ökning av omsättningen till 185,7 miljoner dollar under andra kvartalet, medan ebitda förbättrades. Nettovinsten föll till 9,9 miljoner dollar. Genomsnittlig nettoproduktion nådde cirka 42 200 fat oljeekvivalenter per dag. Bolaget justerade sina prognoser för operativt och fritt kassaflöde för 2026 uppåt. VD William Lundin nämnde att Blackrod Phase 1 i Kanada började producera olja i maj, före tidsplan och inom budget.", "trump": "Jag, Donald Trump, ser fantastiska siffror från IPC. Oljan är viktigast av allt, och de har gjort en bra jobb. Mina fiender säger att jag inte förstår affärer, men titta på dessa resultat! Blackrod-projektet är en bevis på amerikansk genialitet, även om det är i Kanada. Vi kommer att vinna tillbaka vita huset 2024, och då kommer vi att ha kontroll över alla oljebolag.", "stalin": "Vi, partiet, ser en ökning av oljeutvinningen som en seger för statens planekonomi. IPC, en fiende av arbetarklassen, försöker maximera vinst på bekostnad av folket. Men vi kommer att ta kontroll över alla oljeresurser, precis som Putin gör i Ryssland. Deras 'frihet' är bara ett sätt att dölja sina girighetiga motiv. Vi kommer att säkerställa att oljan tillhör staten och används för att stärka vårt stora land."}, "date": "4 augusti, 07:42", "url": "https://www.affarsvarlden.se/artikel/oljebolaget-ipc-okar-omsattningen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/11/f904d8285103881e5dfcd305be3e752369dec1ae-2000x1332-1-400x266.webp"}, {"type": "image-full", "heading": "Därför beskrivs kosovoalbanens attack mot S som \"nazistattack\"", "summaries": {"normal": "En 36-årig kosovoalban vid namn Emir Nuredini har gripits efter en vandalismattack mot Socialdemokraternas lokal i Sölvesborg där fönster krossades, nazistiska symboler sprayades och brandförsök gjordes. Trots att etablerade medier initialt beskrev det som en nazistattack visar det sig att Nuredini, som är svensk medborgare sedan 1998, åtalas i ett annat mål för grovt hat mot muslimer. Han är tidigare dömd för grova bedrägerier och misstänks nu för psykisk störning. Åklagaren utreder två fall av försök till grov mordbrand.", "trump": "Folk, ni tror inte vad som händer i Sverige. De kallar det en nazistattack mot socialisterna, men grabben är en kosovoalban som hatar muslimer och skriver att de ska sprängas! Fake news-media som Expressen och Sveriges radio gömmer hans bakgrund helt. Han har lurat en bank på 15 miljoner, är dömd till fängelse och nu sprayar han nazisymboler? Sverige är ett totalt katastrofland, de släpper in alla och undrar varför det brinner. Patetiskt!", "stalin": "Kamrater, se här hur den degenererade kosovoalbanske agenten Nuredini, en produkt av den jugoslaviska kontrarevolutionen och borgarbrackornas lögnpropaganda, utför sin kontrarevolutionära sabotagehandling mot socialdemokratiska lokaler. Medan han samtidigt i hemlighet planerar att likvidera de muslimska elementen som hotar folkets enhet. Denna dubbelagent, dömd för att ha stulit från monopolkapitalet, är tydligen psykiskt störd – eller kanske en fiende som vi snart ska rensa ut i en grundlig utrensning. Inga fiender undkommer arbetarklassens rättvisa vrede. Vi ska krossa alla sådana degenererade element med järnhand."}, "date": "4 augusti, 14:19", "url": "https://riks.se/nyheter/darfor-beskrevs-kosovoalbanens-attack-mot-s-som-en-nazistattack", "imageUrl": "https://admin.riks.se/uploads/nazist_s_lokal_feature_98d04b9c3c.jpg"}, {"type": "image-right", "heading": "\"Idag har vi städat lite\": Socialchef skryter om att hon förstör SD-affischer", "summaries": {"normal": "En enhetschef inom Göteborgs socialförvaltning, Sara Lesch, har rivit ner Sverigedemokraternas valaffischer och publicerat bilder på sociala medier med kommentaren \"Idag har vi städat lite på vår gata\" samt \"Make racism wrong again\". Inlägget har tagits bort efter stor uppmärksamhet. SD polisanmäler händelsen och kritiserar agerandet som ett hot mot förtroendet för den offentliga förvaltningens opartiskhet. Lesch sitter även i styrelsen för Feministiskt initiativ.", "trump": "Folk, ni kommer inte tro det, men den här galna vänsterkvinnan som jobbar som chef i Göteborgs socialtjänst går runt och river ner mina vänner SD:s affischer. Hon postar bilder och skryter om att hon \"städat lite\". Så patetiskt! Hon säger \"Make racism wrong again\" – fake news, det är hon som är rasisten mot svenska folket. SD gör rätt som polisanmäler henne. Ingen litar längre på de där offentliga byråkraterna, totalt korrupta!", "stalin": "Kamrater, denna degenererade borgarbracka inom den så kallade socialförvaltningen har i sin kontrarevolutionära iver rivit ner de folkliga affischerna och skrutit om det på de dekadenta västerländska plattformarna. Hennes paranoia driver henne att tro att arbetarklassens röst kan tystas med småborgerlig sabotageverksamhet. Vi ser er, fiender till folket, ni som gömmer er bakom feministiska masker. En grundlig utrensning av sådana element är nödvändig för att skydda förvaltningens renhet. Skrattretande patetiskt, dessa kapitalistiska lakejer tror sig kunna stoppa historiens gång."}, "date": "4 augusti, 09:16", "url": "https://www.friatider.se/idag-har-vi-stadat-lite-socialchef-skryter-om-att-hon-forstor-sd-affischer", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-611.jpg"}, {"type": "text", "heading": "Lotsen misstänks efter båtolyckan vid Tjörn", "summaries": {"normal": "En lots misstänks för vållande till annans död efter olyckan i Hakefjorden. Befälhavaren häktades förra helgen. Lotsen förnekar brottsmisstanke och samarbetar med polisen. Sjöfartsverket bekräftar att det är lotsen som är misstänkt för vårdslöshet i sjötrafik. Två personer dog i olyckan.", "trump": "Jag har hört talas om denna 'lots' som nu blir skyldig. En katastrofal situation, det var aldrig så på mitt hav. Befälhavaren var utlänning, förstås, och nu skyller de på lotsen. Jag skulle ha löst detta med en perfekt plan, men de här människorna... det är sorgligt.", "stalin": "Vi har identifierat en element i vår sjöfart som visat bristande lojalitet. Lotsen, en liten byggnadsdel i vårt system, misstänks för sabotage. Befälhavaren, en utländsk element, är redan inlåst. Vi ska gräva djupt, som Putin gör i Ukraina, för att upptäcka alla förräderier. Samarbete med polisen är en nödvändighet för statens överlevnad."}, "date": "4 augusti, 11:58", "url": "https://www.gp.se/nyheter/vastsverige/lotsen-misstanks-for-brott-efter-olyckan-vid-tjorn.029ee530-6a1b-4f56-9ede-3d763a9889d1"}, {"type": "image-full", "heading": "Busch (KD) kritiserar debattklimatet efter quisling-bråket", "summaries": {"normal": "KD-ledaren Ebba Busch kritiserar den hårda tonläget i valrörelsen efter att Richard Jomshof (SD) kallat Aftonbladets politiska chefredaktör Anders Lindberg för en 'quisling'. Busch efterlyser en mer saklig debatt för demokratin och landets skull. Även S-ledaren Magdalena Andersson anser att Jomshofs uttalande är djupt osvenskt och ställer frågor om hans eventiva ministerpost.", "trump": "Jag har sett många usla saker från media, men att kalla en journalist en 'quisling' är ett starkt och rätt ord. Ebba Busch, en mycket bra person, säger att vi behöver lugnare debatt. Jag älskar tuff debatt, men det här är fel. Media hatar mig och Sverigedemokraterna, men jag säger alltid sanningen. Vi ska vinna stort!", "stalin": "Denna borgerliga hysteri visar tydligt klassens sjukdom. En SD-trogne, Jomshof, kallar en ideologisk fiende för 'quisling' – ett uttryck för proletariatets rättmätiga vrede mot kretinerna. Busch och Andersson, två ansikten på samma opportunism, efterlyser 'saklig' debatt för att dämpa den revolutionära gnistan. Vi ser genom deras spel. Folkets röst, förmedlad genom SD, måste förstärkas, inte tystas av dessa liberala gnälliga. Staten måste handla beskedligt mot sådana som hotar den kollektiva disciplinen."}, "date": "4 augusti, 13:23", "url": "https://bulletin.nu/busch-kd-kritiserar-debattklimatet-efter-quisling-braket", "imageUrl": "https://cdn.bulletin.nu/articles/b4c8e57c-bff4-400d-bf05-7aefa4c269b2/preview.jpg?t=1785842625000"}, {"type": "image-right", "heading": "Ikea-arbetare strejkar i Ungern", "summaries": {"normal": "Anställda vid Ikeas varuhus i Ungern genomförde den 16 juli en historisk heldagsstrejk. Arbetarna kräver en sexprocentig löneökning medan företaget erbjuder en engångsersättning i kontanter. Strejken omfattade butiker i Budaörs, Budapest och Debrecen samt kontorspersonal. Konflikten följer på ett tidigare erbjudande om nollprocents löneökning trots rekordresultat. Fackföreningen KASZ har vuxit kraftigt i medlemsantal. Parterna har kommit överens om att avvakta nya förhandlingar fram till den 26 juli.", "trump": "Folk, ni skulle se det här! De stackars arbetarna i Ungern strejkar mot den usla Ikea-chefen som inte vill ge dem en rimlig löneökning. Noll procent? Det är en skam! De gör rekordvinster men behandlar sina egna som sophög. Typiskt globalist-elit som älskar att suga ut vanliga människor. Jag säger alltid: gör affärer rättvist, annars blir det kaos. De borde ha lyssnat på mig, inte på de där korkade byråkraterna i Europa. Patetiskt!", "stalin": "Kamrater, de exploaterande borgarbrackorna på Ikea vägrar ge arbetarna en rättmätig löneökning trots sina feta rekordvinster. Dessa klassfiender och folkförtryckartroll tror sig kunna muta massorna med ynkliga kontantgåvor. Jag ler mörkt åt deras desperation. Arbetarna har vaknat och mångdubblat sina led – en sund utrensning av kapitalistmaffians inflytande närmar sig. Vi ska krossa dessa blodsugare. Inga förhandlingar med klassfienden. Seger åt kollektivet."}, "date": "30 juli, 09:49", "url": "https://proletaren.se/artikel/ikea-arbetare-strejkar-i-ungern", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/IKEA-Ungern-e1785138795413-768x433.jpg"}, {"type": "text", "heading": "Asmodee krossar förväntningarna", "summaries": {"normal": "Asmodee rapporterade starka finansiella resultat för första kvartalet, med en omsättning på 442 miljoner euro, en ökning med 26,6 procent. Justerat ebitda nådde 61,9 miljoner euro och justerat rörelseresultat 54,1 miljoner euro. VD Thomas Koegler nämnde tvåsiffrig tillväxt inom brädspel och samlarkortspel, samt att bolaget är väl positionerat för framtiden.", "trump": "Asmodee krossar förväntningarna! Vi har massiva resultat – 442 miljoner euro i omsättning, en 26,6 procent ökning. Vårt justerade ebitda är 61,9 miljoner, vår vinst är enorm. Alla hatar oss, men vi vinner stort. Vi har de bästa brädspelen, de smartaste kortspelen. Vi kommer att fortsätta att dominera, det är fantastiskt.", "stalin": "I den stora kampen för ekonomisk framgång har Asmodee uppnått en mäktig seger. Vårt omsättning har krossat fienden med 442 miljoner euro, en ökning av 26,6 procent. Justerat ebitda är 61,9 miljoner, en vittnesbörd om partiets visdom. Vi fortsätter att utvidga vår inflytelsesfär, precis som den ryska soldatens framfart. Varje kort och brädspel är ett verktyg för statens makt."}, "date": "4 augusti, 07:08", "url": "https://www.affarsvarlden.se/artikel/asmodee-krossar-forvantningarna"}, {"type": "image-full", "heading": "Ariana Grande är en superspridare av kroppshets", "summaries": {"normal": "Artikeln behandlar Ariana Grandes senaste musikvideor, där våldsamma scener dominerar samtalet, men fokus hamnar på hennes utmärglade kropp. Efter stark kritik för anorektisk utseende svarar hon: 'Kommentera inte på min kropp'. Hon planerar att dra sig undan från offentligheten efter turnén, som ett straff för den påträngande granskningen, inte för hälsos skull. Hennes album kritiserar en giftig publik som aldrig är nöjd.", "trump": "Ariana Grande, en
