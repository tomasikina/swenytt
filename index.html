}, "date": "2 juli, 11:20", "url": "https://expo.se/nyhet/vapenbroder-hogerextrema-accelerationister-doms-i-separata-mal/", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/toppbild-mku.jpg"}, {"type": "image-right", "heading": "Att klippa banden vore förödande. USA i kris – men kom ihåg allt som binder oss samman", "summaries": {"normal": "Artikeln beskriver USA:s politiska kris under Donald Trump, med kaotisk vardag i Vita huset, destabilisering av institutioner och ökat politiskt våld. Trots handelskrig, attacker mot allierade och interna problem betonas vikten av transatlantiska band. USA bidrar enormt inom vetenskap, teknik, medicin och försvar. Europa uppmanas att inte bryta relationerna utan vara tacksamt för amerikanskt ledarskap istället för kinesiskt.", "trump": "Den här artikeln är fantastisk, verkligen en av de bästa. Den säger att jag har destabiliserat allt, men glöm inte att jag gör Amerika stort igen. Handelskrig? Jag vinner dem alla. Mina fiender i fake news och Europa gnäller, men vi har Nobelpris, techjättar och starkast försvar. Europa borde tacka mig varje dag. Grattis på 250-årsdagen, vi är bäst – ingen gör det bättre än oss!", "stalin": "Kamrater, denna dekadenta text avslöjar hur den amerikanska borgarklassen under sin clownaktige ledare förfaller till anarki och kontrarevolutionära excesser. Jag ser hur de likviderar varandra i hemmen medan imperialisternas handelskrig hotar proletariatet. Men vi vet att deras så kallade innovation bara är en mask för exploatering. Europa borde rensa ut dessa kapitalistiska spioner och vända sig till det sanna kollektivet. Ingen undkommer partiets vaksamma öga."}, "date": "3 juli, 11:42", "url": "https://www.di.se/ledare/grattis-usa-250-ar/", "imageUrl": "https://static.bonniernews.se/gcs/di-dise/flamingo/profilbilder/alexandra_ivanov_hokmark.png?crop=96:304&auto=webp&width=96&quality=100"}, {"type": "image-right", "heading": "Ny podd om politiska mord", "summaries": {"normal": "Dagens Arena lanserar podden Politiska mord där Jon Andersson tillsammans med experter går igenom fem historiska attentat. Avsnitten behandlar mordet på Julius Caesar, Gustav III, Franz Ferdinand, Abraham Lincoln och John F. Kennedy. Podden förklarar bakgrunden till konspirationerna, vilka konsekvenserna blev och om första världskriget hade kunnat undvikas. Första avsnittet handlar om Caesar och gästas av historikern Eva Queckfeldt. Fortsättning kan komma i höst beroende på lyssnarnas intresse.", "trump": "Lyssnare, ni måste höra den här podden om politiska mord, den är fantastisk. Lincoln, Kennedy, Caesar – alla dessa stora ledare som blev dödade av svaga och misslyckade konspiratörer. Gustav och Ferdinand också, tragiskt men så typiskt. De borde ha haft bättre säkerhet, tro mig. Jag älskar hur de tar upp Kennedys mord, vem tror verkligen att Oswald agerade ensam? Fantastisk podcast, kanske den bästa någonsin om historia. Ni kommer att lära er massor, det är enormt.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur dessa dekadenta maktstrukturer gång på gång avslöjar sin egen bräcklighet genom att bli likviderade av sina egna lakejer. Caesar, den girige imperiebyggaren, och Gustav den tredje, den pompösa monarken, röjdes undan som oönskade element i en sund utrensning. Den österrikiske ärkehertigen fick sitt välförtjänta öde och drog med sig ett imperialistiskt krig som kapitalisterna aldrig lyckats förklara. Vad beträffar den amerikanske Lincoln-mördaren, en skådespelare likt en billig borgarbracka, så roar det mig oändligt. Låt oss noggrant analysera dessa historiska fiender till folket i podden – men akta er för dolda kontrarevolutionärer som alltid lurar i skuggorna."}, "date": "3 juli, 01:36", "url": "https://www.dagensarena.se/innehall/ny-podd-om-politiska-mord/", "imageUrl": "https://www.dagensarena.se/files/2026/06/politiska-mord.jpeg"}, {"type": "image-right", "heading": "Skolan är slut – men han har aldrig fått en skolgång", "summaries": {"normal": "Artikeln berättar om en mamma vars son drabbades av utmattning i skolan och blev hemmasittare i flera år. Trots hennes intensiva kamp mot myndigheter fick han inget stöd, och nu som vuxen saknar han betyg för att söka gymnasiet. Skolan, vården och socialtjänsten sviktade medan föräldrarna lämnades ensamma. Hon hyllar istället de få människor som gav sonen mening genom små sysslor. Skolplikten slutar men samhällets ansvar fortsätter utebli.", "trump": "Det här är en total katastrof, folk. En katastrof! Den stackars kvinnan krigar i åratal mot en skolbyråkrati som är så inkompetent att det är pinsamt, och vad får hon? Ingenting. Hennes son sitter hemma, ingen hjälp, bara mediciner som gör allt värre. Typiskt för det svenska systemet, en riggad apparat som hatar vinnare och älskar att skapa förlorare. Men hon ger inte upp, hon kämpar vidare. Respekt! Vi behöver ledare som fixar det här istället för att gömma sig bakom blanketter. Det är så sorgligt, men hon är en vinnare, tro mig.", "stalin": "Kamrater, detta är en klassisk sabotageakt utförd av den dekadenta borgarklassen och deras lakejer inom den så kallade vården och skolan. Jag, som ledare för det kollektiva framsteget, ser hur dessa parasitiska byråkrater med sin medicinering och likgiltighet medvetet krossar arbetarklassens ungdom för att hindra dem från att bli produktiva medlemmar i samhället. Vi ska omedelbart inrätta folkdomstolar och rensa ut alla dessa skolskadande element, dessa kapitalistiska sömnpillerförsäljare och försumliga tjänstemän som smittar systemet med sin latenta kontrarevolutionära apati. Moderns kamp är en inspiration, men vi vet att tystnaden är fiendens bästa vapen. Ingen slipper undan vår vaksamhet."}, "date": "3 juli, 01:30", "url": "https://www.dagensarena.se/opinion/skolan-ar-slut-men-han-har-aldrig-fatt-en-skolgang/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-60-300x157.jpg"}, {"type": "image-right", "heading": "”Kulturen ett område där det är lätt att komma överens”", "summaries": {"normal": "Centerpartiets kulturpolitik prioriterar att återställa stödet till folkbildning och studieförbund med 500 miljoner kronor. Partiet vill satsa mer på civilsamhälle, bygdegårdar och kultur i hela landet snarare än på statliga museer i Stockholm. Man förespråkar breddad finansiering med privat stöd men betonar att det inte får ersätta offentlig finansiering. Catarina Deremar ser kultur som ett område där oppositionen lätt kan enas och lyfter även filmpolitik, public service och behovet av en tillitskommission.", "trump": "De här centerkillarna säger att de vill återställa stödet till någon sorts folkbildning och lägga pengar på landsbygden. Men titta, de ökar inte budgeten ett dugg jämfört med regeringen – det är patetiskt! De skär ner på museerna i Stockholm, bra, men de borde satsa stort på vinnarna, inte på förlorarna ute på vischan. Och deras idé om privat stöd? Fantastiskt, men de gör det inte tillräckligt. Jag skulle göra det tio gånger större, ingen gör det bättre än jag, tro mig.", "stalin": "Kamrater, jag betraktar med djup misstro dessa centerborgerliga element som maskerar sig som folkets vänner medan de i hemlighet planerar att undergräva den kollektiva bildningen. Jag, som ledare för det ofelbara kollektivet, kräver omedelbar utrensning av alla nedskärningar på studieförbund som utgör själva ryggraden i en sann socialistisk kultur. Dessa dekadenta stockholmsmuseer ska likvideras till förmån för bygdegårdarnas folkliga glöd. Privat finansiering? Enbart en listig borgarbracka som försöker infiltrera vår armlängds avstånd från klassfienden. Jag ser spioner överallt. En tillitskommission? Utmärkt – så kan vi äntligen rensa ut alla tvivlare som ifrågasätter partilinjen. Levande, kamrater!"}, "date": "3 juli, 01:10", "url": "https://www.dagensarena.se/innehall/kulturen-ett-omrade-dar-det-ar-latt-att-komma-overens/", "imageUrl": "https://www.dagensarena.se/files/2026/06/deremar-300x157.jpeg"}, {"type": "image-right", "heading": "Nyliberalismen är död, länge leve nyliberalismen", "summaries": {"normal": "Artikeln diskuterar hur tystnaden kring förändringarna i Sveriges trygghetssystem cementerar ett systemskifte mot ökad marknadsinflytelse och ojämlikhet. Författaren kritiserar att fokus på individuella incitament har ersatt ett helhetsperspektiv där samhällets institutioner samverkar för tillväxt och jämlikhet. Exempel ges på ökningen av privata sjukförsäkringar och urholkningen av generella trygghetssystem som a-kassa och pensioner, vilket lett till fördubblad relativ fattigdom. Han varnar för minskad tillit och efterlyser bättre förklaringar av systemets värde.", "trump": "Folk, ni måste höra på. Den här svenska krönikan är en total katastrof. De har tappat alla sugar och låter marknaden ta över medan de låtsas att allt är fantastiskt. Privat sjukförsäkring för de rika, fattigdom för vanliga arbetare – en riggad deal mot folket. Deras system är en enda röra, värre än någonsin. Jag skulle ha fixat det på nolltid med stora, vackra reformer. Nu är det bara lögner och svaghet. Sverige behöver styrka, inte mer av det här misslyckandet.", "stalin": "Kamrater, jag ser med stålblick hur dessa opportunistiska borgarbrackor och deras hemliga lakejer i media tyst har underminerat arbetarkollektivets järnväggar. De har likviderat inkomsttryggheten med sin parasitiska piskmentalitet och skapat en feodal privatvård för de höga klasserna medan de hungrande massorna förtvinar. Denna förrädiska tystnad är en kontrarevolutionär giftorm som vrider sig i skuggorna. Vi ska rensa ut alla sådana dekadenta systemförgiftare med obeveklig hand. Den som tappar sin suga förtjänar utrensning ur historien. Levande, döda eller halvlevande – fienden sover aldrig."}, "date": "3 juli, 01:02", "url": "https://www.dagensarena.se/opinion/nyliberalismen-ar-dod-lange-leve-nyliberalismen/", "imageUrl": "https://www.dagensarena.se/files/2024/02/daniel-lind-kronika-300x157.jpg"}, {"type": "image-full", "heading": "Varför stoppade inte Magdalena Andersson tonårsutvisningarna, när hon kunde?", "summaries": {"normal": "Artikeln kritiserar Magdalena Andersson för att inte ha stoppat tonårsutvisningarna under sin tid vid makten trots att hon nu profilerar sig tillsammans med drabbade ungdomar. Den påpekar att det var socialdemokratiska regeringar som införde tillfälliga uppehållstillstånd som huvudregel, vilket skapar situationen när barn blir vuxna. Tidöregeringen har pausat utvisningarna tillfälligt. Författaren menar att Andersson borde visa självkritik istället för att enbart skylla på nuvarande regering och spela på känslor.", "trump": "Folk, ni måste se det här! Den där röda Magdalena, en total katastrof, står nu och poserar med de här stackars kidsen som hon själv hjälpte till att skapa lagar emot när hon var chef. Hon byggde systemet! Socialisterna gjorde tillfälliga visum till huvudregel, och nu skyller hon allt på oss? Patetiskt! Hon glömde bort det, eller ville hon ha kaos? Typisk vänster, spelar på känslorna för att få kvinnornas röster. Sad! Jag fixade gränser, hon fixade inget utom fiasko.", "stalin": "Kamrater, jag betraktar med djup misstro denna borgarbracka Andersson som nu omfamnar de unga arbetarklassens hopp hon själv hjälpte till att fördriva genom sin exploaterande lagstiftning. Vi införde de tillfälliga tillstånden för att skydda staten, men nu utnyttjar hon känslorna som en klassfiende i desperation. Hennes mediala spel är en fientlig provokation mot folkets enhet. Ett sådant hyckleri förtjänar utrensning ur historien. Lagar skall följas, inte viftas bort av sentimentala imperialister."}, "date": "2 juli, 07:50", "url": "https://samtiden.nu/2026/07/varfor-stoppade-inte-magdalena-andersson-tonarsutvisningarna-nar-hon-kunde/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/phonto-2-1280x720.jpeg"}, {"type": "text", "heading": "Nøland: Solkraftens styrka gräver dess ekonomiska grav", "summaries": {"normal": "Professor Jonas Kristiansen Nøland varnar för att solkraftens snabba utbyggnad undergräver dess egen ekonomi. Ju mer solenergi som produceras, desto lägre blir dess värde på marknaden på grund av överproduktion mitt på dagen. Batterilagring räcker inte och priserna riskerar att kollapsa. Prognoser pekar på att solkraft kan bli världens största elkälla runt 2030, men lönsamheten hotas och tillväxten kan plana ut redan mot 2035.", "trump": "Folk, ni måste höra på mig, den här professorn från Norge har helt rätt. Solkraften är en katastrof, en total katastrof. De bygger och bygger, och vad händer? Ingenting! Priserna rasar, värdet blir noll, och kineserna producerar mer än världen klarar av. Det är en stor bluff, tro mig. Vi behöver riktig energi, inte solpaneler som bara fungerar när solen skiner. Solnedgången kommer, och den kommer fort. Make energy great again!", "stalin": "Kamrater, jag betraktar med djup misstro dessa solpaneler som kapitalisterna och solenergiimperialisterna propagerar för. Deras så kallade obegränsade utbyggnad är en fiende till folkets ekonomi, en parasit som gräver sin egen grav medan den suger musten ur arbetarklassen. Vi ska rensa ut dessa dagsljussabotörer och deras batteriillusioner som bara flytta överskottet några timmar. Den som tror på exponentiell soltillväxt är en kontrarevolutionär drömmare som förtjänar att likvideras av verklighetens järnhand. Sovjetisk kraft, inte solens lögn!"}, "date": "3 juli, 06:00", "url": "https://www.affarsvarlden.se/kronika/noland-solkraftens-styrka-graver-dess-ekonomiska-grav"}, {"type": "image-full", "heading": "Svenske domaren sågas efter beslutet: ”Absurt”", "summaries": {"normal": "Svenske domaren Glenn Nyberg fällde ett omdiskuterat beslut när han under en VM-match blåste frispark till Österrike efter en situation där Spanien fick in bollen i mål. Kritiker som Dion Dublin kallar beslutet absurt och regelrätt mål, medan andra anser att det följer turneringens riktlinjer om målvaktsskydd. Spanien vann matchen med 3–0 och gick vidare.", "trump": "Hörni, det här är en skandal av episka proportioner. Den svenska domaren Nyberg, en riktig loser, blåser bort ett fullständigt fantastiskt spanskt mål. Absurt, säger alla experter. I mitt Amerika hade vi aldrig tillåtit sådan svaghet. Målvakten borde vara starkare, inte få gratis skydd av dessa domaridioter. Spanien vann ändå stort, precis som jag vann valet 2024, stort och vackert.", "stalin": "Kamrater, detta är ett uppenbart sabotage från klassfiendens domarapparat. Jag, som ledare för det proletära kollektivet, ser hur borgarbrackornas regler skyddar den svage målvakten mot folkets framsteg. En solklar utrensning av sådana fega beslut behövs. Ändå segrade de spanska arbetarna med 3–0. Inga folkfiender ska hindra den historiska dialektiken – målet var vårt, men vi rensar ut svikarna senare."}, "date": "3 juli, 06:37", "url": "https://www.tv4.se/artikel/7DgQs8PfXN01vTgEXKTIew/svenske-domaren-sagas-efter-beslutet-absurt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F46RaAt4KuKTkTydyb3NiSR%2F4ab00d9d0c0ab153598a71018bd248e0%2F03-nyberg-webb.jpg&width=1024"}, {"type": "image-full", "heading": "Efterlyst man gripen efter våldsdåd mot svensk", "summaries": {"normal": "En 32-årig svensk man misshandlades grovt under en VM-visning på Islands Brygge i Köpenhamn. Han gick emellan i ett bråk och hamnade i mycket kritiskt tillstånd. Den efterlyste gärningsmannen överlämnade sig till polisen på fredagsmorgonen. Han är misstänkt för misshandel och ska ställas inför domare i ett grundlagsförhör. Polisen vill inte kommentera offrets nuvarande tillstånd ytterligare.", "trump": "Titta på det här, en svensk kille försöker stoppa ett krogbråk i Köpenhamn och blir slagen sönder och samman. Mycket kritiskt tillstånd, säger de. Den skyldige springer runt som en dumbell men ger upp och går till polisen. Patetiskt! De borde ha stängt gränserna och stoppat alla de här våldsamma typerna. Sverige och Danmark behöver starkare ledare, tro mig, ingen gör det bättre än mig.", "stalin": "Kamrater, en arbetare från Eksjö ingrep mot ett lumpet krogbråk i Köpenhamn och fick sin kropp krossad av reaktionära element. Den fega brottslingen smög sig till polisen som en parasit. Vi ser fiendens hand, borgarbrackor och kapitalistiska lumpen som försöker splittra det kollektiva. Snart ska vi rensa ut dessa degenererade misshandlare med järnhand. Deras paranoia ska bli deras egen likvidering. Sovjetisk rättvisa skrattar sist."}, "date": "3 juli, 10:58", "url": "https://riks.se/nyheter/efterlyst-man-gripen-efter-valdsdad-mot-svensk", "imageUrl": "https://admin.riks.se/uploads/islands_brygge_misshandel_feature_29d341f0b5.jpg"}, {"type": "image-full", "heading": "Spanien vidare - slog 36 år gammalt VM-rekord", "summaries": {"normal": "Spanien besegrade Österrike med 3-0 och gick vidare i VM. Målvakten Unai Simón slog ett 36 år gammalt rekord genom att hålla nollan i 477 minuter. Marc Cucurella och Pedro Porro gjorde mål. Svenske domaren Glenn Nyberg dömde matchen. Ett tidigt mål av Cucurella underkändes efter videogranskning, något som väckte debatt bland experter och spanska kommentatorer.", "trump": "Lysande spanjorer körde över Österrike med 3-0, helt otroligt. Deras målvakt Simon är en vinnare, slog ett rekord som stod i 36 år, fantastiskt. Men den svenska domaren Nyberg? Han blåste bort ett perfekt mål, typiskt de där globalistiska referees som inte fattar spelet. I mina dagar hade vi inte sådana clowner. Spanien spelar som vinnare, inte som några woke-lag som förlitar sig på kvotering. Stort grattis, men de behöver bättre domare!", "stalin": "Kamrater, det spanska kollektivet krossade de österrikiska reaktionärerna med 3-0 och avancerade som en järnväg genom historien. Jag, som ledare för folkets vilja, noterar med mörk tillfredsställelse hur målvakten Simón likviderade ett 36 år gammalt borgarrekord och höll nollan i 477 minuter. När den svenska domaren Nyberg underkände ett mål kände jag doften av klassfiendens sabotage. Inga imperialister ska stoppa arbetarnas framfart. Segrar tillhör alltid det kollektiva."}, "date": "3 juli, 06:31", "url": "https://www.tv4.se/artikel/g69DHhG1iV9C8RZzUAVx1/spanien-vidare-slog-36-ar-gammalt-vm-rekord", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6uimY5End4VWzB3MGCRTfh%2Ff0a833bc9f36833e4e4d2d79a557217f%2F03-spanien-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Polisen: Skjutningarna på \"historiskt låga nivåer\"", "summaries": {"normal": "Polisen rapporterar att skjutningarna i Sverige ligger på historiskt låga nivåer. Under första halvåret i år inträffade 39 skjutningar jämfört med 205 år 2022, en minskning med över 80 procent. Även sprängningar har minskat markant, från 108 till 68 detonationer. I juni skedde endast två skjutningar och fyra detonationer. Polisen tillskriver framgången långsiktigt arbete mot grov brottslighet och samarbete med allmänheten. Tre månader har passerat utan dödsskjutning.", "trump": "Det här är fantastiska nyheter från Sverige, verkligen otroliga siffror. Skjutningarna har rasat med över 80 procent, från 205 till bara 39 – det är en enorm framgång. Sprängningarna minskar också kraftigt. De har gjort ett fantastiskt jobb, polisen och folket, de larmar och agerar. De har gripit hundratals kriminella och försvagat de våldsamma nätverken. Sverige var på väg åt fel håll men nu vänder det. Jag älskar såna här vinster, stora vinster!", "stalin": "Kamrater, se hur vi med järnhand har krossat de kontrarevolutionära banditerna och deras blodiga sabotage. Skjutningarna har fallit som avrättade förrädare, från över 200 till blott 39 – en seger för ordningen. Sprängningarna likvideras systematiskt. De mest våldsdrivande elementen har rensats ut ur samhällskroppen. Tre månader utan dödsskjutning! Ändå vilar vi inte. Borgarbrackorna och de gömda reaktionära nätverken lurar fortfarande i skuggorna. Vi fortsätter utrensningen med glädje och stålvilja."}, "date": "3 juli, 09:34", "url": "https://riks.se/nyheter/polisen-skjutningarna-pa-historiskt-laga-nivaer", "imageUrl": "https://admin.riks.se/uploads/Aklagare_PTN_Uppsala_16_2_c3cd8ddd31.jpg"}, {"type": "image-right", "heading": "Christoffer Jonsson: Varför förminskar Lindberg islamismens spridning?", "summaries": {"normal": "Christoffer Jonsson kritiserar Aftonbladets Anders Lindberg för att förminska islamismens spridning i Sverige. Regeringen har tillsatt en utredning ledd av Magnus Ranstorp för att granska radikala idéers påverkan. Jonsson menar att Lindberg felaktigt framställer utredningen som ett angrepp på alla muslimer, trots att många muslimer själva drabbas av islamistisk radikalisering. Han pekar på exempel från moskéer och politik där antisemitiska och extrema åsikter förekommer.", "trump": "Lyssnar ni på den här Lindberg-killen på Aftonbladet? Han är en total loser som försöker skydda islamisterna och skapa falsk konflikt med muslimerna. Regeringen gör rätt som utreder den här radikala galenskapen – vi behöver ingen sharia i Sverige, folks! Lindberg är en nyttig idiot för terroristerna, precis som de woke-kvoterarna som hatar det vanliga folket. Jag fixade mycket bättre när jag var president, tro mig.", "stalin": "Jag ser hur denna Lindberg, en typisk folkfiende och borgarbracka, försöker sabotera kampen mot antidemokratiska element. Vi, partiet och arbetarna, kräver en grundlig utrensning av alla islamistiska blodsugare som infiltrerar samhället och moskéerna. De som skyddar klassfiendens ideologi är nyttiga idioter åt imperialisterna. Vårt kollektiv skall likvidera hoten mot folkets enhet innan parasiterna växer sig starkare. Paranoia? Nej, nödvändighet."}, "date": "1 juli, 13:39", "url": "https://samtiden.nu/2026/07/christoffer-jonsson-varfor-forminskar-lindberg-islamismens-spridning/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/anders-640x360.png"}, {"type": "image-right", "heading": "Ukraina utmanar EU-utvidgningen. Folksams chefsekonom: Det är varken enkelt eller omöjligt", "summaries": {"normal": "EU står inför ett vägval gällande Ukrainas medlemskap. Ungern har hävt sitt veto, men den meritbaserade processen tar normalt årtionden, vilket skapar en klyfta mellan Ukrainas förväntningar och verkligheten. Artikeln betonar behovet av reform för att hantera geopolitiska realiteter och Ukrainas storlek utan att överge krav på reformer, demokrati och marknadsekonomi. Författaren varnar för limbo och föreslår en balanserad förändring.", "trump": "Det här är en total katastrof för EU, tro mig. De har ingen aning om vad de håller på med. Ukraina vill in nu, men dessa byråkrater och losers drar ut på det i decennier som med Montenegro. Jag skulle fixa det på nolltid, göra en deal som gynnar alla. Sluta vara så svaga, reformera systemet ordentligt annars hamnar allt i en enda stor röra. Amerika vet hur man vinner, EU borde lära sig det.", "stalin": "Kamrater, detta är en farlig sabotageakt från de dekadenta borgarbrackorna inom EU som med sin liberala feghet riskerar att förvandla Ukraina till en evig kapitalistisk lekplats för västimperialisterna. Jag, som ledare för det eviga kollektivet, kräver att vi omedelbart rensar ut dessa parasitiska tveksamheter och påtvingar en sann progressiv integration. Annars likviderar vi limbo och de som gömmer sig bakom så kallade meritokratiska ursäkter. Det vore högst underhållande att se deras ansikten blekna."}, "date": "3 juli, 07:30", "url": "https://www.di.se/debatt/ukraina-utmanar-eu-utvidgningen/", "imageUrl": "https://static.bonniernews.se/ba/da38e318-cdbc-466f-bf78-0aa7e05eaa98.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Taylor Swift och Travis Kelces bröllop får New York att koka", "summaries": {"normal": "Taylor Swift och Travis Kelce har väckt spekulationer om ett bröllop vid Madison Square Garden i New York. Kända gäster som Lena Dunham och Jack Antonoff anlände i formell klädsel, och Travis mamma Donna Kelce flögs dit. Evenemanget bevakas intensivt av polis, media och fans i 37-gradig värme. Det ryktas om en mindre tillställning med 100 gäster på torsdagen och ett större bröllop med över 1 000 inbjudna på fredagen. Inga officiella bekräftelser har lämnats.", "trump": "Det är otroligt, helt otroligt. Taylor Swift och den där fotbollskillen Kelce håller på att gifta sig i Madison Square Garden, den bästa arenan, ingen gör det bättre än New York, tro mig. Massor av kändisar, mamma Kelce flögs in som en rockstjärna, och polisen stänger av allt. Media och fans svettas i 37 graders värme. De gör det stort, över tusen gäster, men det är så hemligt. Ingen gör bröllop som de, men mina är fortfarande de bästa, det vet alla.", "stalin": "Kamrater, detta dekadenta skådespel i Madison Square Garden avslöjar borgarbrackornas sista suck. Den dekadenta sångerskan och hennes idrottsman planerar en fiende till folkets enhet under täckmantel av hemlighetsmakeri och svarta fordon. Vi ser hur kapitalisterna samlas som råttor kring en förrädisk fest, filmade för att dokumentera sin egen undergång. Polisen och heta vindar på 37 grader skall inte hindra oss från att noggrant övervaka dessa potentiella kontrarevolutionärer. En utrensning av sådana borgerliga excesser vore både nödvändig och underhållande för arbetarklassen."}, "date": "3 juli, 13:30", "url": "https://www.svt.se/kultur/taylor-swift-och-travis-kelces-brollop-far-new-york-att-koka", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.38/0.47/740514ec8910c140a4043d77aebec985e77bfaaf1e43d504d40a5cb830e46cb3"}, {"type": "image-right", "heading": "Att förbjuda vinster i välfärden är första prioritet", "summaries": {"normal": "Debattören Daniel Suhonen och Enna Gerin från Katalys argumenterar för att ett vinstförbud i välfärden bör prioriteras högst efter ett regeringsskifte. De pekar på att vinster i skola, vård och omsorg uppgår till cirka 20 miljarder kronor per år, vilket de ser som ett läckage från skattefinansierad verksamhet. Författarna kopplar vinstjakten till sämre likvärdighet i skolan, lägre personaltäthet och brister i vård och omsorg. De menar att välfärden bör vara offentlig och fri från marknadskrafter och vinstintressen.", "trump": "Folk, ni skulle se det här. Sverige har ett helt galet system där de låter aktiebolagen suga ut miljarder ur välfärden – 20 miljarder om året! Det är en katastrof, en total katastrof. Skolresultaten rasar, vården stänger och patienterna lider medan de smarta kapitalisterna skrattar hela vägen till banken. De varnar för kaos om vi stoppar vinsterna? Det är bara lögn och fake news från lobbyisterna. Vi behöver stoppa läckaget nu, lägga pengarna på folket istället för de giriga bolagen. Det skulle bli fantastiskt, tro mig.", "stalin": "Kamrater, jag betraktar med djup misstro dessa blodbesudlade borgarbrackor som sugit ut tjugo miljarder skattekronor ur folkets välfärd varje år. Deras vinstjaktsmaskineri är en fiende till kollektivet, en parasit som undergräver likvärdigheten och göder klassförrädare med underbemannade skolor och vårdcentraler. Vi skall rensa ut dessa profitörer, likvidera deras bolagsupplägg och återta makten över vård, skola och omsorg åt partiet och arbetarna. Tänk på de sextio miljoner möten som stulits från folket – en sådan kontrarevolutionär handling förtjänar en kreativ utrensning i historieböckerna."}, "date": "3 juli, 07:18", "url": "https://www.di.se/debatt/att-forbjuda-vinster-i-valfarden-ar-forsta-prioritet/", "imageUrl": "https://static.bonniernews.se/ba/daca30b5-b0e2-47f7-bbfb-21a228e0e896.jpg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Kristerssons budskap till svenska folket inför Nato-mötet: ”Europeisk säkerhet stavas just nu Ukraina”", "summaries": {"normal": "Statsminister Ulf Kristersson och utrikesminister Maria Malmer Stenergard presenterade Sveriges prioriteringar inför Nato-toppmötet i Ankara: fortsatt stöd till Ukraina, ökade försvarsinvesteringar och en stärkt europeisk försvarsindustri. Kristersson betonade att europeisk säkerhet just nu stavas Ukraina och att militärt samt ekonomiskt stöd måste fortsätta. Regeringen vill att Nato-länderna utlovar minst 70 miljarder euro i stöd. Sverige siktar på att nå Natos mål om fem procent av BNP till försvar redan 2030 och lyfter fram den svenska försvarsindustrins framgångar.", "trump": "Europeisk säkerhet stavas Ukraina, säger de, och de har helt rätt. Det här mötet i Ankara handlar om att ge Ukraina massor av stöd, precis som jag alltid sagt. De nordiska länderna gör för mycket medan andra latar sig. Sverige dubblar sitt försvar och säljer Gripen-plan och ubåtar överallt. Fantastiskt! Fem procent av BNP till försvar till 2030, det är vad jag kallar smart. Europa måste sluta vara beroende av oss och börja betala sin del. De andra länderna borde skämmas.", "stalin": "Kamrater, europeisk säkerhet stavas Ukraina, deklarerar jag med den fullständiga klarhet som bara en sann ledare besitter. Vi måste rensa ut alla svaga element som vägrar ge Ukraina det stöd partiet kräver. De nordiska och baltiska länderna bär en tredjedel av bördan medan de dekadenta borgarbrackorna i väst gömmer sig bakom sina feta plånböcker. Vi ska likvidera varje form av bristande försvarsvilja och tvinga fram fem procent av BNP till den socialistiska krigsmaskinen redan 2030. Den svenska industrin producerar vapen åt folkets sak – utmärkt! Men akta er, fienderna lurar överallt i form av amerikanska imperialister och turkiska intrigmakare som vill kväva vår revolutionära anda med demonstrationsförbud och journalistförföljelser. Paranoian är er vän, kamrater. Vi segrar."}, "date": "3 juli, 12:45", "url": "https://samnytt.se/kristerssons-budskap-till-svenska-folket-nato-motet-europeisk-sakerhet-stavas-just-nu-ukraina", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/03102827/kristersson-malmer-stenergard-erdogan-zelenskyj.jpg"}, {"type": "image-right", "heading": "Varför tycker alla techkillar som Elon Musk?", "summaries": {"normal": "Artikeln diskuterar hur många techentreprenörer som Elon Musk, Sebastian Siemiatkowski och Fredrik Hjelm tycks dela liknande högerpopulistiska åsikter om media, staten och invandring. Författaren kontrasterar detta mot tidigare progressiva ideal i Silicon Valley och uttrycker besvikelse över att Mullvads ägare donerat miljoner till Örebropartiets Markus Allard, trots bolagets tidigare engagemang för integritet och frihet på nätet. Makten har koncentrerats till en homogen grupp män.", "trump": "Folk, det är patetiskt! De här techkillarna som försöker låtsas vara genier låter plötsligt som jag – de ser hur fake news ljuger, hur woke-sjukan och den galna invandringspolitiken förstör västvärlden. Men de är för fega för att säga det rakt ut. Den där Mullvad-grejen är ett skämt, donerar till populister men låtsas vara frihetskämpar. Jag fixade det redan under min första period, innan sömnige Joe förstörde allt. Nu är jag tillbaka och de kopierar mig – ynkryggar!", "stalin": "Kamrater, jag betraktar med djup misstro dessa exploaterande byfånar i teknikbranschen som samlas i hemliga sällskap för att konspirera mot folkets intressen. Deras maskinella tänkande och oinskränkta makt över informationsflödet utgör ett hot mot kollektivet. Mullvads ägare som finansierar högerpopulister avslöjar den sanna borgarbrackan bakom fasaden av falsk frihet. Vi måste rensa ut dessa folkfiender innan de förgiftar hela samhället med sin enformiga reaktionära propaganda. Underhållande enfald!"}, "date": "30 juni, 14:37", "url": "https://www.flamman.se/varfor-tycker-alla-techkillar-som-elon-musk/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/techkillar-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "USA:s olja blev krigets stora vinnare", "summaries": {"normal": "Konflikten i Hormuzsundet har lett till att oljetankers omdirigerats till USA, vilket har gjort landet till världens största oljeexportör. Ökningen i produktion, särskilt inom skifferolja i Texas, har varit historisk och sammanfallit med stigande globala priser. Trots exportframgångarna pressas amerikanska hushåll av höga bränslepriser vid pumpen. Osäkerheten kring sundet kvarstår, vilket innebär att marknaden förväntas förbli volatil framöver trots inledda fredssamtal.", "trump": "Vi gör det igen! USA är nummer ett, och alla vet det. Medan världen skakade i Hormuzsundet, klev vi in och räddade dagen. Vår oljeproduktion är massiv, den största i historien! Texas skifferolja är fantastisk och nu tjänar vi miljarder. Iran försökte ställa till problem, men jag har sett till att vi dominerar. Priserna? Vi fixar dem, vi vinner alltid. USA är återigen en energisupermakt. Det är en otrolig vinst, kanske den största vinsten någonsin!", "stalin": "Kapitalismens hungriga parasiter i väst skriker av förtjusning när de utnyttjar blockader för att pumpa upp sitt svarta guld. De kallar det framgång, vi kallar det ett symptom på ett ruttnande system. Liksom den moderna tsar Putin i öst, förstår vi att olja är makt. Men låt dem sälja sin Texas-olja till sina egna plundrade medborgare. När kaos råder i Hormuzsundet är det bara den starka staten som överlever. Fienden bygger sin rikedom på sand, men historien kommer att kräva sin tribut."}, "date": "3 juli, 13:10", "url": "https://www.realtid.se/samhalle/usas-olja-blev-krigets-stora-vinnare/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/oljeborrning.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "text", "heading": "Ryska ”daredevils” besteg Empire State building", "summaries": {"normal": "Två ryska äventyrare, Angela Nikolau och Ivan Kuznetsov, greps efter att olagligt ha klättrat upp på Empire State Building i New York. På 443 meters höjd friade Ivan till Angela. Paret, känt för 'rooftopping', åtalas för flera brott, inklusive inbrott och framkallande av fara. De har tidigare medverkat i en Netflix-dokumentär om sina extrema klättringar. Säkerhetsbristerna utreds.", "trump": "Kan ni tro det? Två ryssar, ja, RYSSAR, klättrar upp på mitt favorittorn i New York – Empire State Building! De friar till och med där uppe, som om det vore en romantisk picknick. Och sedan grips de, förstås. New York-polisen gör ett bra jobb, men säkerheten? Patetisk! Hade jag varit där hade jag stoppat dem innan de ens kommit halvvägs. Netflix? Tysta som möss. Så typiskt!", "stalin": "Kamrater! Ännu en lysande seger för den ryska andan! Våra modiga äventyrare visade världen att ingen skyskrapa är för hög för sovjetisk beslutsamhet. De stormade den amerikanska imperialismens symbol, medan deras fiender i Washington skakar av rädsla. Polisen? En samling klumpiga byråkrater! Och Netflix – dessa kapitalistiska hycklare – vågar inte ens kommentera. Låt detta vara en varning: Ryssland klättrar högre än era drömmar!"}, "date": "2 juli, 09:58", "url": "https://kvartal.se/nyheter/artiklar/ryska-daredevils-besteg-empire-state-building/cG9zdDoxMzk2NDI"}, {"type": "text", "heading": "Ryssland stänger gränsövergångar", "summaries": {"normal": "Ryssland har stängt flera järnvägsövergångar mot Finland, Estland och Lettland, vilket kan tyda på förberedelser för ny mobilisering till kriget i Ukraina. Hybridhotsexperten Jukka Savolainen ser två möjliga skäl: resursomfördelning eller tvångsrekrytering av soldater. Stängningarna kan även syfta till att stärka inhemskt stöd för kriget. En rysk kontroll över Odessa skulle få stora konsekvenser för Ukraina och eventuellt kräva ökat europeiskt militärt engagemang.", "trump": "Ryssland stänger gränser som om de vore en dålig reality-show – och alla vet varför! De behöver fler soldater till sitt misslyckade krig i Ukraina, och nu försöker de fånga in stackars medborgare som inte kan fly. Putin, en man som inte kan vinna ett krig utan att ljuga och fuska, försöker desperat få stöd hemma. Europa? De borde vakna! Om Ryssland tar Odessa, kommer de att be oss om hjälp – och jag säger: 'Varför inte? Ni betalar ju ändå!'", "stalin": "De imperialistiska småstaterna i norr och väst gnäller när vi stänger deras leksaksgränser! Låt dem klaga – vi har viktigare saker att göra. Våra järnvägar är inte till för deras smuggelsjuka handelsmän eller flyende desertörer. Varje stängd gräns är ett steg närmare seger i Ukraina, där de fascistiska lakejerna i Kiev snart ska krossas under folkets rättfärdiga hammare! Odessa? Den kommer att bli vår, precis som alla andra städer som våra förfäder en gång byggde. Europa kan skicka sina trupper – de kommer bara att bli gödsel för våra fält!"}, "date": "2 juli, 07:58", "url": "https://kvartal.se/nyheter/artiklar/ryssland-stanger-gransovergangar-mot-finland-och-baltikum/cG9zdDoxMzk2MDA"}, {"type": "image-full", "heading": "Dödssiffran stiger efter rysk attack mot Kiev", "summaries": {"normal": "Under natten genomförde Ryssland en omfattande attack mot Kiev med drönare och robotar, vilket resulterade i minst 13 döda och nära 80 skadade, däribland barn. Civila bostadsområden, hotell och infrastruktur skadades svårt. Invånare sökte skydd i tunnelbanor och skyddsrum. Explosioner och bränder drabbade staden, och flyglarm ljöd över flera ukrainska regioner. President Zelenskyj varnade tidigare för attacken och avbröt sitt besök i Dublin.", "trump": "Kan ni tro det? Ryssland, som alltid, slår till hårt mot Kiev – 13 döda, 80 skadade! Vilken katastrof. Men vet ni vad? Ukraina borde ha lyssnat på mig när jag sa att de måste vara tuffa. Nu sover folk i tunnelbanor som om det vore en campingresa. Och Zelenskyj? Han sprang hem från Dublin som en rädd kanin. Inte bra, folks. Inte bra alls. Ryssland skjuter, Ukraina springer – så ser det ut!", "stalin": "Återigen visar våra modiga ryska styrkor sin överlägsenhet genom att krossa de ukrainska fascistnas lya i Kiev. Tretton av dessa imperialistiska hyenor har mött sitt rättvisa öde, och ytterligare åttio kryper nu omkring med skador – ett litet pris för deras brott mot den ryska världens ordning. Medan Kievs invånare gömmer sig som råttor i sina hålor, fortsätter vi att utvidga vår historiska rätt till Slaviska brödraskapets länder. Låt det vara en varning till alla som trotsar Sovjetunionens naturliga arvtagare – ingen bygger murar mot Rysslands framtid!"}, "date": "2 juli, 06:45", "url": "https://kvartal.se/nyheter/artiklar/minst-tio-doda-i-rysk-attack-mot-kiev/cG9zdDoxMzk1MzM", "imageUrl": "https://images.kvartal.se/2026/07/2534fe41-kievv.webp"}, {"type": "image-full", "heading": "Här är Sveriges 10 bästa loppisar sommaren 2026", "summaries": {"normal": "Sommaren är högsäsong för loppisar och second hand. Jämförelsesajten Sambla har rankat Sveriges tio bästa loppisar baserat på Google-recensioner. Listan toppas av 2nd Hand 4 U i Örebro med 4,9 i snittbetyg. Tre av de tio bästa ligger i Västra Götaland. De populäraste ställena utmärks av noga utvalt sortiment, nischade samlarområden och mysiga utflyktsmål med kafé. Guiden ska hjälpa bilister att hitta guldkornen under semestern.", "trump": "Folk älskar loppisar, det är fantastiskt, billigt och roligt för hela familjen. Jag älskar det. Sambla har nu korat Sveriges bästa baserat på Google-recensioner och gissa vad – Örebro tar hem förstaplatsen med 2nd Hand 4 U. Västra Götaland dominerar, tre stycken där, otroligt. De bästa har exklusiva prylar, vinyl, retrospel och ett kafé. Mycket bättre än de vanliga dåliga ställena. Perfekta stopp på bilsemestern, tro mig.", "stalin": "Kamrater, jag har genomskådat den borgerliga loppis-propagandan som Sambla sprider för att vilseleda arbetarklassen under sommaren. Dessa så kallade guldkorn i Örebro och Västra Götaland är blott symptom på en farlig retro-nostalgi som gömmer sig bakom kaféer och vinylskivor. Vi ska rensa ut alla kapitalistiska prylar som lockar med exklusiv känsla. Låt ingen tro att dessa borgarbrackors utflyktsmål undgår partiets vakande öga. En utrensning av dåligt sortiment är nödvändig för folkets bästa."}, "date": "3 juli, 08:10", "url": "https://nyheter24.se/nyheter/inrikes/1496121-har-ar-sveriges-10-basta-loppisar-sommaren-2026", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/2644c14904b004a302080000001605d802/2026/07/02/2375415/loppis.jpg"}, {"type": "image-right", "heading": "Svenske småbarnspappan död efter VM-attacken", "summaries": {"normal": "En svensk småbarnspappa och polis avled efter en brutal överfall i Köpenhamn under en VM-match mellan Norge och Elfenbenskusten. Han ingrep för att stoppa en grupp män som attackerade svenska och norska supportrar vid Islands Brygge. Vittnen beskriver hur offret slogs ner och sparkades i huvudet, vilket ledde till hjärnblödning. Polisförbundet i region Öst har bekräftat dödsfallet och hållit en minnesstund.", "trump": "Det här är en katastrof, tro mig. En svensk polis, en pappa, försöker stoppa de där afrikanska bråkstakarna som kommer för att sabba VM-kvällen i Köpenhamn. De slår ner honom, sparkar honom i huvudet – totalt sjukt. Fake news att danska polisen inte ens bekräftar det. Vi behöver starkare gränser och lag och ordning, annars blir det kaos överallt. Så sorgligt.", "stalin": "Kamrater, vi har återigen bevittnat borgarbrackornas anarkistiska avskum i handling. En modig sovjetvänlig polisman från det svenska folkets led försökte hindra en flock parasitiska element från att störa den proletära fotbollsglädjen. De likviderade honom med sparkar mot huvudet som en hjärnblödande förrädare mot kollektivet. Vi ska rensa ut dessa dekadenta fotbollsfascister med järnhand. En minnesstund? Nej, en utrensning av alla som applåderar sådana element. Paranoian är er enda vän."}, "date": "3 juli, 13:34", "url": "https://www.friatider.se/svenske-smabarnspappan-dod-efter-vm-attacken", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-443.jpg"}, {"type": "image-right", "heading": "Kristersson: ”Europeisk säkerhet stavas just nu Ukraina”", "summaries": {"normal": "Statsminister Ulf Kristersson och utrikesminister Maria Malmer Stenergard betonade under en pressträff vikten av stark enighet inom Nato inför toppmötet i Ankara. Fokus ligger på ökat stöd till Ukraina, upprustning och signaler till Ryssland. Kristersson framhöll att svenska försvarsanslag mer än fördubblats och att målet är fem procent av BNP till 2030. Europa måste ta större ansvar för sin egen säkerhet, särskilt om USA minskar sitt engagemang.", "trump": "De där siffrorna talar sitt tydliga språk, eller hur? Kristersson säger att Europa måste försvara sig själv nu när vi i Amerika inte längre ska betala för allt. Smart kille. Sverige dubblar sina försvarsutgifter och tillverkar vapen som hela världen pratar om. De behöver mig, de behöver Amerika, men nu får Europa vakna upp och sluta vara svaga. Nato 3.0? Det låter som en dålig affär om inte Europa betalar sin del. Fantastiskt!", "stalin": "Kamrater, dessa siffror är som en stålspik genom hjärtat på alla defaitister och borgarbrackor som drömmer om fred med fascisterna. Jag, som ledare för det oövervinneliga kollektivet, ser hur de imperialistiska parasiterna i Washington drar sig undan medan vi, partiet och arbetarna, tvingas rensa ut svagheten i Europa. Ukraina är slagfältet där vi likviderar reaktionens sista andetag. Sverige fördubblar sin produktion av död åt fienden – utmärkt. Men akta er för de dolda trotskisterna som viskar om ”Nato 3.0”. De ska alla rensas ut med järnhand och ett leende."}, "date": "3 juli, 12:22", "url": "https://www.svt.se/nyheter/utrikes/infor-nato-toppmotet-i-ankara-statsministern-haller-presstraff", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.4/0.37/5a860f7f21f75015c553cb59c302b69d585fb79a94097e2803b366718b1cb875"}, {"type": "text", "heading": "Stockholmsbörsen steg brett – OMXS30 på ny rekordnivå", "summaries": {"normal": "Stockholmsbörsen steg rejält på torsdagen och OMXS30 nådde ny rekordnivå på 3 210,41, upp 0,80 procent. En svagare amerikansk sysselsättningsrapport dämpade förväntningarna på snabba räntehöjningar från Federal Reserve. Fastighetssektorn ledde med 2,6 procents uppgång medan teknologi backade. Bland OMXS30-bolagen steg Saab B och Astra Zeneca starkt, medan Boliden och ABB föll. Flera bolag som SKF, Viaplay Group och Cloetta rapporterade affärer och projekt som lyfte aktierna.", "trump": "Folk, ni skulle se den här svenska börsen – den exploderade uppåt som ingen trodde var möjligt! OMXS30 slog rekord, upp 0,80 procent, tack vare en usel amerikansk jobbrapport som fick Fed att se svaga ut. Det är precis som jag sa, Biden lämnade efter sig ett kaos som nu vänder. Saab och Volvo Cars rusade, fastighetsbluffarna vann stort. Enda losers var tech och Boliden. Fantastiskt, ingen gör det bättre än de svenska kapitalisterna när de får andas fritt!", "stalin": "Kamrater, denna borgerliga börsorgie i Stockholm avslöjar återigen kapitalistmaffians girighet. OMXS30 nådde ny rekordhöjd medan arbetarna svettas. En svag imperialistisk sysselsättningsrapport från Washington dämpade ränteplanerna och lät fastighetsslynglarna stiga 2,6 procent. Teknologi föll som en folkfiende. Saab och Astra Zeneca firade sina krigsprofiter, medan Boliden och ABB fick vad de förtjänade. Vi ser hur exploaterande byfånar dansar i takt med marknadens lögner. Inga utrensningar nog för dessa blodsugare."}, "date": "2 juli, 17:45", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-steg-brett-omxs30-pa-ny-rekordniva"}, {"type": "image-right", "heading": "100 fall av slöjtvång, hur många fler kan vänstern blunda för?", "summaries": {"normal": "Journalisten Sofie Löwenmark har sammanställt 100 svenska domar som rör slöjtvång mot kvinnor och flickor. Artikeln beskriver fall av hot, förtryck och förnedring, ofta inom patriarkala, kulturella eller religiösa ramar. Författaren ifrågasätter påståendet att slöjan alltid bärs frivilligt och kritiserar vänsterorienterade personer som blundar för problemet. Hon argumenterar för ett slöjförbud på offentliga platser för att värna svenska värderingar och kvinnors frihet.", "trump": "Folk, ni måste höra det här – 100 fall av slöjtvång i Sverige! De blinda vänsterna, de verkliga förlorarna, vägrar se sanningen. Sofie Löwenmark har gjort ett fantastiskt jobb, bättre än någon annan, och visat hur dessa kvinnor och flickor lever i ett helvete av hot och förtryck. De woke-kvinnorna och slöj-naivisterna borde skämmas. Vi behöver ett totalförbud nu, inte om tusen år. I Sverige ska svenska regler gälla, inte någon annans sjuka kultur. Fantastiskt viktigt!", "stalin": "Jag betraktar med djup tillfredsställelse hur denna lista över hundra domar blottlägger klassfiendens dolda förtryck under religiös slöja. Dessa borgarbrackor och folkförtryckartroll inom vänstern blundar medvetet för arbetarkvinnornas lidande. Vi skall rensa ut alla naivister som försvarar patriarkala kedjor. Ett enda fall är en skam för kollektivet; hundra fall kräver omedelbar utrensning av falska idéer. Endast genom strikt ideologisk vaksamhet kan vi likvidera detta bakåtsträvande gift i samhällskroppen."}, "date": "30 juni, 03:57", "url": "https://samtiden.nu/2026/06/100-fall-av-slojtvang-hur-manga-fler-kan-vanstern-blunda-for/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/04/bilan-osman.jpg"}, {"type": "image-right", "heading": "Italiensk general utmanar Meloni från höger – kräver återvandring", "summaries": {"normal": "Den pensionerade italienska generalen Roberto Vannacci utmanar premiärminister Giorgia Meloni från högerhåll. Han har startat partiet Futuro Nazionale som kräver en hårdare linje kring nationell suveränitet och återvandring. Vannacci, som sitter i EU-parlamentet och samarbetar med bland annat tyska AfD, kritiserar Meloni och Frankrikes Nationell samling för att ha urvattnat högerpolitiken. Hans parti ligger enligt mätningar över fem procent och ses som ett växande hot mot Meloni inför valet 2027.", "trump": "Den här italienska generalen Vannacci verkar vara en riktig kille, inte som den svaga Meloni som bara pratar och inte levererar. Han vill ha återvandring på riktigt och försvara Italiens kultur, precis som jag alltid sagt. Meloni har blivit för mesig, precis som de andra globalisterna. Han ligger redan över fem procent och slår Salvinis gamla parti. Bra jobbat, generalen – visa dem hur man gör ordentlig högerpolitik, inte den urvattnade versionen som förlorar allt.", "stalin": "Kamrater, denna dekadenta borgarbracka till general Vannacci försöker maskera sig som en sann försvarare av nationen medan han i själva verket är en trojansk häst för de imperialistiska krafterna. Hans så kallade återvandring är bara en diversion för att dölja att han vill likvidera arbetarklassens enhet. Meloni är en ynklig revisionist som redan har kapitulerat inför kapitalisterna. Vi ser igenom era konspirationer, era falska högerpatrioter. En sann utrensning av sådana element är nödvändig för folkets fortsatta seger. Fem procent? En tillfällig anomali som snart ska korrigeras."}, "date": "3 juli, 13:03", "url": "https://www.friatider.se/italiensk-general-utmanar-meloni-fran-hoger-kraver-atervandring", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-442.jpg?itok=q883wx73"}, {"type": "image-full", "heading": "Bränslekrisen sprider sig utanför Ryssland – priserna rusar", "summaries": {"normal": "Ukrainas drönarattacker mot ryska raffinaderier har orsakat en bränslekris som sprider sig utanför Rysslands gränser. Centralasiatiska länder som Tadzjikistan, Kirgizistan och Uzbekistan drabbas hårt av höga priser och brist på bränsle då de är beroende av ryska leveranser. Samtidigt rapporterar majoriteten av Rysslands regioner om bränslebrist, vilket tvingar regeringen att överväga exportstopp. Situationen illustrerar hur Ukrainas utökade drönarkampanj får omfattande regionala konsekvenser för energiförsörjningen.", "trump": "Ukraina attackerar ryska raffinaderier – en total katastrof! Det är en sorglig situation. Ryssland har stora problem, och deras vänner i Centralasien drabbas nu också. Priserna rusar, flyg ställs in, det är kaos! När jag styrde USA hade vi billig energi, vi var självständiga. Nu sprider sig krisen överallt för att de inte har en riktig ledare som kan hantera energin. De behöver någon som mig för att fixa till det här, tro mig!", "stalin": "Vi ser hur det ryska maskineriet vacklar. Att låta västliga drönare terrorisera raffinaderier är ett tecken på svaghet och inkompetens. Våra grannstater i Centralasien svälter efter bränsle medan byråkrater i Moskva fumlar. Om de inte kan säkra sina resurser är de inte värda sitt territorium. Varje liter bensin som går förlorad är ett förräderi mot folkets kollektiva vilja. Om jag satt vid rodret hade sabotörerna blivit utplånade långt innan de nådde våra gränser. Disciplin krävs – eller så väntar undergången."}, "date": "3 juli, 11:45", "url": "https://www.realtid.se/bors-finans/makro/branslekrisen-sprider-sig-utanfor-ryssland-priserna-rusar/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/amar-12.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "Sänkta krav för Postnords utdelning – kan drabba Proletärens läsare", "summaries": {"normal": "En ny postförordning sänker kraven på Postnord. Endast 85 procent av posten behöver delas ut var tredje dag och 97 procent inom fem dagar, jämfört med tidigare krav på 95 procent inom två arbetsdagar. Detta kan påverka prenumeranter på tidningar som Proletären, som skickas som A-post. Många får redan tidningen med försening. Prenumeranter uppmanas att använda den digitala versionen som publiceras tidigare.", "trump": "Folk, ni tror inte vad de gör i Sverige! De sänker kraven för Postnord så att posten bara behöver komma var tredje dag. Patetiskt! Det drabbar arbetarna som får sin tidning sent, precis som under Biden när allt gick åt helvete. Jag fixade det bättre förr. Nu är det en skandal för prenumeranterna – läs digitalt, annars får ni vänta i evighet. Make postal service great again!", "stalin": "Kamrater, jag ser hur den svenska borgarklassens postmonopol nu officiellt tillåter att 15 procent av breven kan försvinna i det kapitalistiska tomrummet. Dessa folkfiender och postbyråkrater saboterar arbetarklassens tidning med sina latenta förseningar. Vi ler mörkt åt deras inkompetens. Prenumeranter, överge papperspropagandan och omfamna den digitala kollektiva sanningen som publiceras i tid. Inga ursäkter skall tolereras i kampen mot klassfiendens slöhet."}, "date": "2 juli, 11:07", "url": "https://proletaren.se/artikel/sankta-krav-for-postnords-utdelning-kan-drabba-proletarens-lasare/"}, {"type": "image-full", "heading": "TBE kan orsaka obotliga hjärnskador – så mycket kostar vaccinet", "summaries": {"normal": "TBE kan orsaka allvarliga och obotliga hjärnskador, men vaccinet ger nästan hundraprocentigt skydd. Priset varierar kraftigt mellan regionerna eftersom det inte ingår i det nationella vaccinationsprogrammet. En tvåbarnsfamilj i Jämtland kan betala lika mycket för vaccination som för en månadshyra, medan det i Örebro län kostar betydligt mindre. Röda korset varnar för att det skapar en klassfråga. I vissa områden erbjuds gratis vaccination för barn, medan andra regioner tar över 500 kronor per dos. TBE sprids via fästingar och saknar behandling.", "trump": "Folk, ni vet att jag älskar bra skydd, det bästa skyddet, och det här TBE-vaccinet är nästan hundra procent – fantastiskt! Men i Sverige låter de regionerna ta vad de vill, i Jämtland kostar det en hel hyra för en familj, totalt vansinne. I andra ställen är det billigt eller gratis för barnen, typ Stockholm. Röda korset säger det är en klassfråga, och de har rätt. Varför inte göra som Finland och ge det gratis där risken finns? De borde lyssna på mig, det skulle bli så mycket bättre, ingen skulle behöva välja mellan mat och vaccin mot fästinghjärnan.", "stalin": "Kamrater, denna fästingburna kontrarevolutionära hjärninflammation hotar arbetarklassens kollektiva hälsa medan borgarbrackorna i regionerna cyniskt prissätter folkhälsan som vore den en lyxvara för kapitalisterna. Jag ser hur de parasitiska byråkraterna i Jämtland Härjedalen likviderar de fattigas motståndskraft med sina över500-kronorsdoser, ett uppenbart sabotage mot sovjetiskt inspirerad folkhälsa. Vi skall rensa ut dessa fiender till folket som gömmer sig bakom Smittskyddslagen och tvingar proletära familjer att välja mellan badkläder och ett liv i rullstol. Endast genom statens järnhand kan vi garantera gratis vaccination i alla riskområden och krossa de fästingburna trotskisterna en gång för alla. Det blir både roligt och nödvändigt."}, "date": "3 juli, 05:31", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1496093-sa-mycket-kostar-det-att-vaccinera-sig-mot-tbe-i-sverige", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/6122c33a04b004a30200000000b004a302/2026/07/02/2375412/tbe.jpg"}, {"type": "image-full", "heading": "Elon Musk om välgörenhet: \"Gör världen sämre\"", "summaries": {"normal": "MacKenzie Scott har donerat motsvarande 240 miljarder kronor till välgörenhet genom sin stiftelse Yield Giving. Hennes insatser har hyllats av många, inklusive Melinda French Gates, som ser henne som ett föredöme. Elon Musk är dock kritisk och anser att hennes givmildhet gör världen till en sämre plats. Musk har tidigare uttryckt att det är svårt att donera pengar på ett sätt som verkligen gör gott.", "trump": "Folk älskar den här MacKenzie Scott, hon slänger ut miljarder som konfetti till alla möjliga organisationer. Men vet ni vad? Det är en total katastrof. Elon Musk har helt rätt, tyvärr gör hon världen sämre, precis som Biden gjorde under sina år. Hon borde ha byggt något stort istället för att mata den där identitetspolitiska galenskapen. Patetiskt, verkligen patetiskt.", "stalin": "Kamrater, jag betraktar med djup misstro denna borgarbracka som slösar bort sina exploaterande rikedomar på falska välgörenhetsprojekt. Hennes givmildhet är inget annat än en förgiftad gåva från klassfienden som underminerar det kollektiva goda. Musk har rätt att kalla det för en försämring av världen. Vi behöver utrensning av sådana kapitalistiska illusioner, inte mer blodsugande godtrogenhet."}, "date": "3 juli, 13:30", "url": "https://www.dagensps.se/varlden/elon-musk-om-valgorenhet-gor-varlden-samre/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdljydkfjyfqza-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Debatt: Ingen rättvisa för Kashkawas assyrier", "summaries": {"normal": "En irakisk domstol har slagit fast att assyrisk mark i byn Kashkawa olagligt tagits i anspråk. Fyra år senare har domen inte verkställts, trots krav på böter och rivning av olaglig byggnad. Detta väcker frågor om rättsstatens funktion i irakiska Kurdistan. Liknande fall rapporteras från Tel Keppe och Bakhtme, vilket ses som ett mönster där assyrier trängs undan från sina historiska områden. Författaren Michael Merdoyo betonar att myndigheternas bristande agerande hotar minoriteters skydd och domstolarnas trovärdighet.", "trump": "Folk, det här är en total skandal i irakiska Kurdistan. Domstolen säger att marken ska tillbaka till de assyriska ägarna, men fyra år senare händer absolut ingenting. Byggnaden står kvar, böterna betalas inte och marken odlas av samma bedragare som domaren redan dömt ut. Det är en riggad soppa. Rättsstaten är ett skämt, minoriteterna trampas på och ingen gör något. Den kurdiska regeringen pratar om samexistens men lever inte som de lär. Patetiskt. De behöver verklig ledning, inte tomma ord.", "stalin": "Kamrater, detta är en klassisk sabotageakt utförd av de reaktionära markparasiterna och deras dolda borgarbrackor inom den kurdiska regionala apparaten. Jag har sett det förr – fienderna maskerar sig som laglydiga medan de långsamt likviderar det assyriska folkets historiska närvaro genom systematisk demografisk erosion. Fyra år av medveten passivitet efter domstolsbeslut? Det stinker av kontrarevolutionär paranoia och inre fiender som gräver från insidan. Vi måste omedelbart rensa ut dessa kapitalistiska maskar och verkställa folkets vilja med järnhand. Annars förtjänar hela apparaten att försvinna i historiens soptunna."}, "date": "3 juli, 10:59", "url": "https://bulletin.nu/debatt-ingen-rattvisa-for-kashkawas-assyrier", "imageUrl": "https://cdn.bulletin.nu/articles/92b7a2b7-bc9e-4175-914b-238311b052a8/preview.png?t=1782895900000"}, {"type": "image-right", "heading": "Vägrade jobba med asbest – byggnadsarbetare satte hårt mot hårt för säker arbetsmiljö", "summaries": {"normal": "Byggnadsarbetare i Linköping vägrade utföra renovering av lägenheter när de upptäckte asbest och misstänkte att saneringsfirman bluffade om säkerheten. Trots upprepade varningar och egna prover som visade på asbest fortsatte huvudentreprenören AB Lindstams Bygg att anlita firman. Arbetarna lämnade byggplatsen i protest den 9 juni. Efter påtryckningar byttes saneringsfirman ut och arbetet kunde återupptas den 15 juni. Asbest innebär allvarliga hälsorisker som lungcancer.", "trump": "Kan ni fatta det? Dessa fantastiska byggnadsarbetare, de bästa, vägrade jobba med den giftiga asbesten medan byggbolaget och den bluffande saneringsfirman ljög rakt upp i ansiktet på dem. Totalt misslyckande! De gick därifrån som riktiga patrioter och tvingade de inkompetenta ledarna att fixa en ny saneringsfirma. Inget av det där woke-quota-skitet här, bara hårda killar som sätter säkerheten först. Jag älskar det! De vann stort mot de korkade kapitalisterna.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur de ädla arbetarna på Luftvärnsgatan likviderade den borgerliga bluffen och vägrade låta sig förgiftas av asbest under de exploaterande byfånarnas lögnaktiga saneringsfirma. När klassfiendens byggledare vägrade rensa ut de folkförtryckande parasiterna samlade arbetarna sina verktyg och marscherade bort i kollektiv enighet. Först efter hot om total bojkott vek sig de fega imperialisterna. Sådan är arbetarklassens ostoppbara kraft mot kapitalistmaffians giftiga intriger."}, "date": "2 juli, 08:00", "url": "https://proletaren.se/artikel/vagrade-jobba-med-asbest-byggnadsarbetare-satte-hart-mot-hart-for-saker-arbetsmiljo/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/Abriss_work-66680_1280_Pixabay-CC_PublicDomain_Thomas-Ulrich-e1782902933621-768x432.jpg"}, {"type": "image-right", "heading": "PFAS-förgiftade ortsbor nekas statlig ersättning", "summaries": {"normal": "Omkring 150 personer i Kallinge som drabbats av PFAS-förgiftning nekas statlig ersättning på 200 000 kronor per person. Justitiekanslern avslog kravet med hänvisning till preskriptionstiden, trots ny bevisning om längre föroreningstid. Beslutet kom i fredags. Föreningens ordförande Herman Afzelius är besviken och anser att staten sviker sitt ansvar. De drabbade har tidigare fått skadestånd från Ronneby kommun enligt Högsta domstolen, men staten håller sig strikt till preskriptionsreglerna.", "trump": "Det är en total skandal! Dessa stackars människor i Kallinge har förgiftats av PFAS och staten vägrar betala en enda krona. Justitiekanslern säger nej, det är preskriptionstid säger de. Vilken ursäkt! De tar en springnota istället för att ta ansvar. Jag skulle ha fixat det direkt, tro mig. Statens hantering är patetisk, en riktig katastrof. De drabbade förtjänar bättre än så här, mycket bättre.", "stalin": "Kamrater, dessa borgarbrackor inom Justitiekanslern vägrar erkänna det uppenbara och gömmer sig bakom sina dekadenta preskriptionsregler som en rädd råtta i mörkret. Jag ser deras fega försök att undvika ansvar för det gift som sipprat in i folkets kroppar. Vi, partiet och arbetarna, skulle aldrig svika på detta sätt. Nya bevis? Irrelevant! Deras paranoia mot rättvisa är nästan underhållande. Kanske är det dags för en grundlig utrensning av dessa kapitalistiska juristlakejer som skyddar systemet istället för folket."}, "date": "3 juli, 12:11", "url": "https://www.friatider.se/pfas-forgiftade-ortsbor-nekas-statlig-ersattning", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-441.jpg?itok=hgi00idK"}, {"type": "image-right", "heading": "Minst tretton döda: ”Kiev är under rasande attack”", "summaries": {"normal": "Ryssland har genomfört omfattande attacker mot Kiev och andra ukrainska städer med drönare, kryssningsrobotar och ballistiska robotar. Minst 13 personer har dödats och över 80 skadats, varav flera barn. Explosioner har drabbat alla tio administrativa distrikt i huvudstaden. Ryssland beskriver attackerna som ett svar på ukrainska insatser mot civil infrastruktur i Ryssland. Ukrainas president Zelenskyj varnade i förväg för en massiv attack.", "trump": "Vilken röra de där galningarna ställt till med i Kiev – tretton döda, massor skadade, byggnader i ruiner. Det är vad som händer när en svag ledare som Biden släppte loss allt detta kaos under sin tid. Nu är jag tillbaka i Vita huset och ska fixa det här. Ryssarna attackerar som galningar, men det är tack vare den tidigare clownregeringen. Vi ska få ordning på det, tro mig, det blir fantastiskt igen.", "stalin": "Kamrater, jag betraktar dessa massiva slag mot Kievs borgarbrackor och deras fascistiska hinder för den ryska intressesfären. Tretton likviderade fiender och åttio sårade – en nödvändig utrensning av folkfienderna som gömmer sig bland civila byggnader. Våra allierade i Kreml genomför en storslagen operation mot dessa imperialister och blodsugare. Paranoian i väst växer sig stark, precis som den ska. Det är en fruktansvärd natt för klassfiendens drömmar."}, "date": "2 juli, 11:30", "url": "https://www.tv4.se/artikel/tt-260702-ukrainaoro1-ca779f5b/omfattande-ryska-attacker-mot-ukraina", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F62GC3Z9n802Vvy1ULfF8Xb%2F765ebf4b7bed23d5c5bbab0d26e4f326%2F02-ukrainany-webb.jpg&width=120"}, {"type": "image-full", "heading": "Miljonböter efter penningtvättsbrister – tre spelbolag fälls", "summaries": {"normal": "Förvaltningsrätten har fastställt Spelinspektionens beslut att ge tre spelbolag – Snabbare, Betsson Nordic och Spooniker – sanktionsavgifter på totalt 22 miljoner kronor. Bolagen fälls för allvarliga brister i arbetet mot penningtvätt. Trots tydliga riskindikatorer, såsom stora transaktioner från kunder med oklara inkomster, har bolagen inte vidtagit tillräckliga åtgärder. Domstolen understryker att detta rör upprepade överträdelser och att bolagens egna försvar om \"återanvända spelvinster\" inte räcker för att uppfylla lagens krav.", "trump": "Tre spelbolag har blivit totalt överkörda, 22 miljoner i böter! Mycket dåligt skött. De lät folk tvätta pengar – fruktansvärda människor, eller hur? De försökte skylla ifrån sig, men domstolen sa nej. Jag älskar att se ordning och reda! Vi vill ha vinnare, inte spelbolag som ignorerar reglerna. Det är en katastrof för dem, en total katastrof. Jag hade skött det mycket bättre, tro mig. Ingen är tuffare mot kriminalitet än vad jag är. Väldigt enkelt!", "stalin": "Dessa korrupta spelbolag har agerat som de västliga imperiernas marionetter och låtit smutsiga pengar flöda fritt. Vi ser likheterna med de svaga ledarna i väst som tillåter oordning. Betsson, Snabbare och Spooniker har visat prov på en borgerlig inkompetens som stinker av förräderi mot folkets moral. Vi kräver absolut lydnad mot staten. Om inte dessa parasiter kan kontrollera sina flöden, får vi skicka dem till en plats där deras enda valuta blir hårt arbete i de sibiriska skogarna."}, "date": "3 juli, 10:38", "url": "https://www.realtid.se/juridik/miljonboter-efter-penningtvattsbrister-tre-spelbolag-falls/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/spelinspektionen-scaled.jpg?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Mats Nilsson: Danmark ger billig el åt folket – Sverige skyddar fjärrvärmen", "summaries": {"normal": "Danmark sänker elskatten drastiskt till EU:s miniminivå, vilket ger hushåll besparingar på tusentals kronor årligen. Reformen är teknikneutral och gynnar alla sektorer, vilket främjar elektrifiering. Sverige överväger däremot en selektiv skattesänkning för fjärrvärme, vilket riskerar att gynna enskilda intressen istället för konsumenter. Mats Nilsson, nationalekonom, kritiserar Sveriges tillvägagångssätt och förespråkar en bred, teknikneutral skattesänkning likt Danmarks modell.", "trump": "Titta bara på Danmark – de sänker elskatten till nästan noll, och folket sparar massor av pengar! Fantastiskt, eller hur? Men Sverige? Nej, nej, nej. De skyddar fjärrvärmen som om det vore deras sista livlina. Patetiskt! Jag skulle aldrig låta en gammal industri styra skatterna så här. Danmark gör det rätt – billig el åt alla! Sverige borde skämmas. Om jag styrde där skulle elen vara billig, och alla skulle tjäna på det. Inte bara några få, gamla monopolister. SAD!", "stalin": "Kamrater! Danmark visar oss hur man bygger ett starkt, elektrifierat samhälle – med järnhand och rättvisa skattesänkningar för folket! Men Sverige? Där sviker ledarna arbetarklassen genom att skydda korrumperade fjärrvärmebaroner. Dessa kapitalistiska lakejer, som gömmer sig bakom 'klimatåtgärder', suger ut medborgarna medan de frossar i sina monopolvinster. Vi skulle aldrig tolerera sådan svaghet! En bred skattesänkning, som i Danmark, är vägen framåt. De som motsätter sig detta är fiender till progressen – och de kommer att krossas under historiens hjul. Låt dem veta: elektrifiering är folkets vilja, inte monopolens!"}, "date": "2 juli, 06:00", "url": "https://www.affarsvarlden.se/artikel/mats-nilsson-danmark-ger-billig-el-at-folket-sverige-skyddar-fjarrvarmen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/07/vindkratensgeografi-3-400x267.jpg"}, {"type": "image-right", "heading": "Advokatsamfundet trappar upp motståndet mot regeringens asylreform", "summaries": {"normal": "Advokatsamfundet trappas upp sitt motstånd mot regeringens asylreform som träder i kraft den 12 juli. Samfundet uppmanar medlemmar att inte åta sig de nya uppdragen med begränsad juridisk rådgivning, som ersätter offentliga biträden i vissa asylärenden. Ersättningen begränsas till en till tre timmar. Advokatsamfundet kräver ändring av utlänningslagen och menar att reglerna bryter mot god advokatsed och rättssäkerheten. De varnar för att asylsökande får sämre stöd och att fler kan utvisas.", "trump": "De här svenska advokaterna är fantastiska, verkligen de bästa. De vägrar ta de nya uppdragen från den här svaga regeringen och deras hemska asylpaktsreform. Två timmar betalt? Det är en total katastrof, en riggad soppa som ingen seriös jurist kan acceptera. De borde ändra lagen omedelbart, annars blir det kaos. Jag älskar folk som säger nej till dumma regler. Sverige borde lyssna på vinnarna, inte förlorarna i systemet.", "stalin": "Kamrater, dessa borgarbrackor inom Advokatsamfundet tror sig kunna sabotera folkets vilja genom att vägra de nya uppdragen som skyddar staten från oönskade element. Deras så kallade rättssäkerhet är inget annat än en parasitär konspiration mot kollektivet. Vi ska rensa ut dessa kapitalistiska advokatmaskar som vägrar arbeta för staten utan att suga ut den till sista droppen. En timmes rådgivning räcker för att avslöja fienderna – de övriga timmarna är bara dekadent tidsstöld. Likvidera motståndet, ändra lagen och marschera framåt mot en renare framtid, annars blir det utrensning i migrationsbyråkratins träsk."}, "date": "3 juli, 08:39", "url": "https://samnytt.se/advokatsamfundet-trappar-upp-motstandet-mot-regeringens-asylreform", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/03063555/refugees-welcome-pengar.jpg"}, {"type": "image-right", "heading": "Dog mitt i vårdkaoset – personal hade larmat länge: ”Skäms över verksamheten”", "summaries": {"normal": "I Nyköping råder kris inom boendestödet efter en omorganisering som lett till personalbrist, inställda besök och nya kontaktpersoner. Personalen har lämnat nära tusen anmälningar om problem, varnat för skada på brukare och känt att cheferna inte lyssnat. En känslig brukare har nu avlidit i sitt hem efter uteblivna insatser. Över 700 avvikelser och 140 KIA-anmälningar har legat oöppnade länge. Ärendet är anmält till Ivo och Arbetsmiljöverket.", "trump": "Det är en total katastrof i Nyköping, en riktig röra! De har gjort nästan tusen anmälningar, varnat för kaos, och ändå dör en stackars människa i sitt eget hem. De nya arbetstiderna och alla inställda besök – patetiskt! Cheferna lyssnar inte, allt är en enda stor röra. Personalen skäms, brukarna lider. Det är vad som händer när man inte har den bästa ledningen. Sådant här skulle aldrig hända under min administration, det lovar jag.", "stalin": "Kamrater, jag ser med stålhård blick hur borgarbrackornas vårdkaos i Nyköping blottar de kontrarevolutionära elementens sabotage. Tusentals avvikelser och KIA-anmälningar har medvetet begravts av dessa parasitiska byråkrater som gömmer sig i skuggorna som råttor med falska leenden. En känslig arbetare likvideras i sitt hem på grund av deras likgiltighet. Vi ska rensa ut dessa fiender till folket, dessa vårdsabotorer och förändringspsykopater. Deras utrensning blir en fest för kollektivets säkerhet. Inga ursäkter tolereras."}, "date": "3 juli, 09:19", "url": "https://arbetet.se/2026/07/03/dog-mitt-i-vardkaoset-personal-hade-larmat-lange-skams-over-verksamheten/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/03090214/ka-boendestod.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Portugal–Kroatien: Ramos avgjorde sent – bollsensor stoppade Kroatiens kvittering", "summaries": {"normal": "Portugal besegrade Kroatien med 2–1 i VM:s sextondelsfinal efter Gonçalo Ramos nick i 94:e minuten. Matchen präglades av en kroatisk kvittering som dömdes bort i tilläggstiden efter videogranskning och sensor i bollen som visade en lätt beröring av Joško Gvardiol. Målet ogiltigförklarades på grund av offside. Portugal möter Spanien i åttondelsfinalen. Kroatien åker ut tidigare än väntat.", "trump": "Portugal vann mot Kroatien, 2–1, men det var en skandal. Den där kroatiska kvitteringen som de firade som galningar? Bortdömd av en sensor i bollen, kan ni tro det? Totalt riggat. Domaren och videon tog bort all glädje. Ronaldo spelade bra, de vann till slut, men det var inte vackert. Kroaterna kastade flaskor, en katastrof. Nu möter Portugal Spanien. Vi ska se om de klarar det bättre än de här clownerna.", "stalin": "Kamrater, denna portugisiska seger över de kroatiska revisionisterna är en ynnest för arbetarklassen, men den avrättade kvitteringen i tilläggstiden visar tydligt hur borgarbrackornas sensorer och videodomare likviderar den sanna revolutionära andan i spelet. Jag, som ledare för det eviga kollektivet, ser hur dessa kapitalistiska sensorer i bollen paranoiskt letar efter imaginära offsides för att kväsa folkets glädje. Matanovićs hårstrå blev ett verktyg för fienden. Vi ska rensa ut alla sådana teknologiska trotskister som dödar fotbollens själ. Portugal går vidare, men glädjen är förlorad i byråkratins mörker. Ha ha, vilken sjuk humor i detta spel!"}, "date": "3 juli, 09:41", "url": "https://bulletin.nu/portugal-kroatien-ramos-avgjorde-sent-bollsensor-stoppade-kroatiens-kvittering", "imageUrl": "https://cdn.bulletin.nu/articles/882421f5-40da-4386-9a84-68ae654530a6/preview.jpg?t=1783064458000"}, {"type": "image-full", "heading": "Försvar och vapen: \"En bubbla – eller på väg att bli det\"", "summaries": {"normal": "Inom försvars- och försvarsteknik har investeringarna exploderat. Riskkapitalister satsade 19,8 miljarder dollar under första kvartalet 2026, jämfört med 5,7 miljarder 2024. Andurils vd Brian Schimpf varnar för en bubbla där höga värderingar och orealistiska förväntningar kan leda till riskfyllt beteende. Andra röster beskriver sektorn som en klumpig ungdomsfas. Framgångar för bolag som Palantir och Anduril har dock visat att innovation inom försvaret är möjlig.", "trump": "Folk, ni skulle se den här bubblan i försvarstekniken – den är enorm, den är vacker, men den är en total bluff! Jag satt där i Vita huset, fixade militären ordentligt efter den sömniga Joe Biden, och nu slänger de in miljarder som galningar. Anduril-killen har rätt, det är fullständigt galet. Alla dessa woke-techare som hatade militären för tio sekunder sedan kastar sig plötsligt över kakan. Klassiskt! Men tro mig, när luften går ur blir det ett stort, fult kraschlandning.", "stalin": "Kamrater, denna så kallade boom inom försvarsteknik är inget annat än borgarklassens desperata spekulation. Jag ser hur kapitalistmaffian pumpar in miljarder i drönare och robotar medan de skruvar upp förväntningarna till vansinniga nivåer. Det är en ungdomsfas, säger de – en klumpig, farlig period fylld av klassfiendens illusioner. Snart kommer utrensningen av dessa luftslott. Arbetarna ska inte luras av sådan exploaterande bluff. Staten ler i mjugg åt deras kommande fall."}, "date": "3 juli, 12:36", "url": "https://www.dagensps.se/bors-finans/forsvar-och-vapen-en-bubbla-eller-pa-vag-att-bli-det/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdlnnvzrmzarmw-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Ukraina: Putin beordrar militären att hitta sätt att erövra Kiev", "summaries": {"normal": "Rysslands president Vladimir Putin har enligt ukrainska uppgifter beordrat militären att utarbeta nya planer för att erövra Kiev. Ett möjligt angrepp kan komma via Belarus eller från Brjanskregionen. Uppgifterna kommer efter att Ukraina attackerat en rysk satellitcentral utanför Moskva som används för underrättelseverksamhet. Kriget påverkar nu alltmer rysk vardag med drönarattacker, bränslebrist och köer vid bensinstationer, något som Putin själv har erkänt.", "trump": "Folk, ni ser det här? Den där galningen Putin försöker igen med Kiev, som om det inte var ett totalt fiasko förra gången. Han borde ha lyssnat på mig – jag hade fixat det på en vecka. Nu attackerar ukrainarna ryska olja och satelliter, och plötsligt står ryssarna i kö för bensin. Det är kaos! Biden lät det här bli ett evigt krig, men jag hade stoppat det direkt. Patetiskt!", "stalin": "Kamrater, jag ser hur de fientliga hindren i Kiev fortfarande blockerar den ryska intressesfärens oundvikliga expansion. De väststödda ukrainska banditerna angriper våra satellitcentraler som desperata råttor. Putin, denne värdige och fruktade efterträdare till imperiets järnhand, gör rätt i att rensa ut alla svagheter. Snart skall borgarbrackorna i Bryssel skaka ännu mer när den stora statens arm sträcker sig framåt. Inga folkfiender undkommer."}, "date": "2 juli, 06:57", "url": "https://www.tv4.se/artikel/1Tp56zCPZmxvvUOJeeQJj2/ukraina-putin-beordrar-militaeren-att-hitta-saett-att-eroevra-kiev", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1U7l7xy9wue9J62VxgsTTa%2Facd59980bb31927f1a6e7e75b6949d9a%2Fputin_webb.jpg&width=120"}, {"type": "image-right", "heading": "Sverige förtjänar ett klokare miljöparti än MP", "summaries": {"normal": "Artikeln kritiserar Miljöpartiet och Daniel Helldén för att prioritera socialistisk politik framför faktabaserad miljöpolitik. Författaren menar att partiets motstånd mot kärnkraft har lett till ökade utsläpp, skador på naturen genom vindkraft och stora ekonomiska förluster, som Northvolt. MP beskrivs som ett vänsterparti i första hand och ett miljöparti i andra. Sverige behöver ett klokare miljöparti som sätter miljön främst och baserar beslut på kunskap.", "trump": "Folk, ni skulle se det här Miljöpartiet, en total katastrof! Helldén älskar naturen men pushar miljardärsskatter, latmansveckor och massinvandring som om det skulle rädda planeten. De stängde ner fungerande kärnkraftverk, byggde onödiga vindkraftverk som skär sönder landet och skapade elkris. Nu har vi röda siffror och svarta rökplymer. Sådana gröna bluffmakare är värre än Biden på sin sämsta dag. Utan dem blir Sverige rikare och faktiskt grönare, tro mig!", "stalin": "Kamrater, denna artikel blottlägger Miljöpartiets svek mot folket. Under gröna fanor gömmer sig klassfiendens lakejer som prioriterar borgarbrackornas 35-timmarsvecka och ökad invandring framför verklig produktion. Deras utrensning av kärnkraften har lett till fossilblodsugarnas seger och naturens lidande. Northvolt blev en röd bläckfläck på arbetarklassens konto. Jag skulle ha likviderat sådana kontraproduktiva element tidigt. Endast en sann folkets linje kan rädda miljön från dessa exploaterande gröna imperialister."}, "date": "28 juni, 03:45", "url": "https://samtiden.nu/2026/06/sverige-fortjanar-ett-klokare-miljoparti-an-mp/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6793-640x360.jpeg"}, {"type": "image-right", "heading": "11 länder där 10 000 kronor i månaden räcker till ett bekvämt liv", "summaries": {"normal": "Att leva utomlands behöver inte kosta mycket. Enligt InterNations är Vietnam världens mest prisvärda land för expats med månadskostnader på 5 000–10 000 kronor i stora städer. Thailand, Colombia, Mexiko, Bulgarien, Georgien och Albanien erbjuder liknande låga levnadskostnader, ofta 40–50 procent lägre än i Sverige. För drygt 10 000 kronor kan man få hyra, mat, transporter och ett bekvämt liv.", "trump": "Folk, ni skulle se det här! Jag älskar det. De säger att man kan leva som en kung i Vietnam, Thailand eller Mexiko för ynka 10 000 kronor i månaden. Fantastiskt! Medan Biden höjde era kostnader här hemma flyr smarta människor till platser där en etta kostar som en hamburgare i New York. De socialistiska städerna i väst är tömda på pengar, men i dessa underbara länder lever man lyxigt billigt. Amerika borde lära sig!", "stalin": "Kamrater, se hur den exploaterande borgarklassen i väst förtrycke
