bygga på antisemitiska stereotyper. Artikeln varnar för att försvara antisemitism under förevändning av Israelkritik.", "trump": "Jag säger er, det här är helt galet! En kille i Sverige, Sami Suliman, sprider judehat öppet – delar Hitlertal, snackar om judisk makt, konspirationer – och vad gör vänstern? De försvarar honom! 'Åh, det är bara Israelkritik!' Nej, nej, nej. Det är ren antisemitism, folks. Och forskare som backar upp honom? Svagt, mycket svagt. Sverige borde skämmas. Jag skulle aldrig låta sånt passera – fake news och hat, det städar jag upp direkt!", "stalin": "Kamrater! Här har vi ännu en fiende till folket – Sami Suliman, en småborgerlig provokatör som sprider sionistiska konspirationer och fascistisk propaganda. Han jämför sig med revolutionen men hyllar Hitlers tal och smutsar ner våra judiska kamrater med lögnaktiga anklagelser. Hans försvarare – dessa liberala intellektuella och vänsteravfällingar – är lika farliga som kulaker. Vi ska inte tolerera sådant sabotage! Rättegången i november blir ett steg mot att krossa denna reaktionära smitta. Folkets domstol kommer att skipa rättvisa, precis som vi gjorde med trotskisterna!"}, "date": "3 juni, 11:30", "url": "https://expo.se/kommentar/propalestinsk-organisator-sprider-judehat/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Jonathan-kommentar.jpg"}, {"type": "image-right", "heading": "”Som tagen ur en skräckfilm”. Protester i Belfast", "summaries": {"normal": "En man i 30-årsåldern har gripits efter ett brutalt knivdåd i Belfast där offret utsattes för ett halshuggningsförsök. Gärningsmannen, en asylsökande från Sudan, övermannades av vittnen på platsen. Attacken har väckt starka reaktioner och lett till våldsamma protester i Nordirland där fordon satts i brand. Storbritanniens premiärminister Keir Starmer fördömer våldet kraftfullt. Inget terrorbrott misstänks för närvarande, men händelsen har intensifierat den politiska debatten om migrationslagstiftningen.", "trump": "Hörde precis om den där hemska händelsen i Belfast. Det är en katastrof! En man kom in från Sudan, totalt misslyckat migrationssystem. Det är en skräckfilm, mina vänner! Folk i Belfast är rasande, de vill ha säkerhet och ordning. Jag skulle ha säkrat gränserna för länge sedan, det är vad jag gör. Vi måste stoppa det här galenskapen nu. Det är en avskyvärd attack, precis vad jag alltid varnat för. Tragiskt, mycket tragiskt!", "stalin": "Ett tydligt bevis på att det liberala väst är ruttet inifrån. Denna stackars individ från Sudan, en produkt av Europas svaga gränser, förlorade kontrollen i Belfast. Det är naturligt att folket gör uppror när staten sviktar. Vi ser hur kaoset breder ut sig i en värld som saknar vår järnhand. Det är ett misslyckande som påminner om de svaga ledarna i Kievs marionettregim. Vi måste rensa ut dessa subversiva element innan de infekterar hela moder Ryssland."}, "date": "10 juni, 00:00", "url": "https://www.aftonbladet.se/nyheter/a/d4kkb1/knivattack-i-belfast-man-misstankt", "imageUrl": "https://akamai.vgc.no/v2/images/f210db43-49e8-3d28-b65a-5e607ed2f596?fit=crop&format=auto&w=1080&s=45d15e38130e3d5294ab0d06c337fc1a7f8975b8"}, {"type": "image-right", "heading": "Asllanis första ord efter tuffa skadan: ”Låter mig inte stoppas”", "summaries": {"normal": "Kosovare Asllani ger sin första intervju sju veckor efter en allvarlig korsbandsskada, hennes första stora skada i karriären. Lagkaptenen beskriver de inledande dagarna som tuffa och fyllda av sorg, men betonar att hon vägrar låta skadan avsluta hennes karriär. Hon är nu inne i en intensiv rehabperiod, fokuserad på att lyssna på kroppen och ta en dag i taget, med målet att återvända starkare.", "trump": "Titta, den här Asllani är en riktig fighter, folk. Hon får en hemsk skada, korsbandet går sönder, och de bär ut henne på bår som en förlorare. Men hon säger att hon inte låter det stoppa henne – smart! Första gången hon skadar sig och hon väljer att inte ge upp. Hon gör rehab varje dag, ingen semester, lyssnar på kroppen. Hon kommer tillbaka bättre än någonsin, tro mig, mycket bättre. En dag i taget, precis som jag alltid säger.", "stalin": "Kamrater, jag betraktar denna Asllani som en exemplarisk sovjet – nej, svensk – arbetare på fotbollsfältet. Hennes korsband förråddes av en dold fiende inom kroppen, en kapitalistisk sabotor som försöker likvidera hennes karriär. Men jag, med min stålvilja, skulle aldrig tillåta en sådan bakslug skada att segra. Vi rensar ut svagheterna dag för dag, nördar in oss på rehabilitering och avrättar varje tanke på bakslag. Borgarbrackornas semester är för de svaga; vi kämpar vidare mot den permanenta segern, en dag i taget, medan vi skrattar åt skadans patetiska försök att störta oss."}, "date": "9 juni, 19:47", "url": "https://www.svt.se/sport/fotboll/kosovare-asllanis-forsta-intervju-efter-skadan-en-dag-i-taget", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.32/0.44/df6fca43a08be47f647b81a15e5d5d4d66002dd17b82f12937212f9313f5cd5b"}, {"type": "image-full", "heading": "Stjärnan lämnar Häcken i rekordaffär", "summaries": {"normal": "Silas Andersen, 21, lämnar BK Häcken efter en framgångsrik tid för en rekordsumma till Sporting Lissabon. Dansken har imponerat som mittfältare med 57 matcher, 9 mål och 3 assists. Övergången värd 108 miljoner kronor är den dyraste i Häckens historia, enligt klubben.", "trump": "I alone can fix this! This Danish kid is a tremendous player, a real winner. I built a great club, and now he's moving to a big league in Portugal. It's a record deal, maybe the biggest ever. He's a star, and I know stars. The Swedish club should be proud, but they'll miss him. It's a great move for his career, just tremendous.", "stalin": "Vi har observerat den unge medborgarens utveckling. Hans överflyttning till Sporting Lissabon är en strategisk seger för kollektivt planerande. Häcken, en liten byklubb, har visat sin lojalitet genom att sälja till en storklubba inom vår spheres of influence. Pengarna kommer att användas för att stärka proletära idéers spridning. Alla är glada, särskilt partiet."}, "date": "9 juni, 21:15", "url": "https://www.gp.se/sport/fotboll/bk-hacken/silas-andersen-lamnar-hacken-klar-for-sporting-lissabon.b6519b72-0efd-47e8-8dae-d6c77761265b", "imageUrl": "https://www.gp.se/images/article/b6519b72-0efd-47e8-8dae-d6c77761265b/images/39eKWIC0-jlC1xuw-pzyTm7h0-Yc-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Sossarnas hönshus extremt mycket dyrare än statsminsterns", "summaries": {"normal": "Socialdemokraterna kritiserar statsminister Ulf Kristersson för ett hönshus på Harpsund som kostat drygt 16 000 kronor i montering, trots att han själv betalat det. Partisekreterare Tobias Baudin kallar det pinsamt och ett hån mot skattebetalarna. Artikeln försvarar Kristersson och menar att kritiken är ett låtsasskandal. Den kontrasterar mot Socialdemokraternas tidigare beslut som kostat miljarder, som nedläggning av kärnkraft och migrationspolitik.", "trump": "Herregud, vad är det för korkade höns som springer runt och kluckar om ett litet hönshus? Statsministern bygger ett snyggt hönshus på statens mark för 17 000 spänn och plötsligt är det värsta skandalen sen Biden stal valet. De där socialisterna gnäller om skattepengar medan de slösar bort miljarder på grön galenskap och invandring. Rena hönsflocken, springer runt utan att fatta ett smack om ekonomi. Patetiskt!", "stalin": "Kamrater, jag ser hur klassfiendens borgarbrackor inom socialdemokratin rasar mot ett obetydligt hönshus. Dessa folkförtryckartroll gnäller om 17 000 kronor medan de själva likviderat samhällets resurser med sina imperialistiska vanvidsprojekt. Deras paranoia över ett hönshus blottar deras egen okunnighet om ekonomi och folkets intressen. Vi ska rensa ut sådana exploaterande byfånar som inte begriper vad som gagnar kollektivet. Hönsen är de själva."}, "date": "3 juni, 03:11", "url": "https://samtiden.nu/2026/06/sossarnas-honshus-extremt-mycket-dyrare-an-statsminsterns/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Harpsund.jpg"}, {"type": "text", "heading": "Konsultbranschen tvärbromsar – AI pekas ut", "summaries": {"normal": "Konsultbranschen minskar drastiskt på sin nyanställning, med en nedgång på 42 procent jämfört med föregående år. Artificiell intelligens pekas ut som huvudorsak då tekniken nu kan utföra arbetsuppgifter som tidigare sköttes av juniora konsulter. Experter varnar för att detta kan skapa en kompetensbrist i framtiden, då nyutexaminerade går miste om nödvändig praktisk erfarenhet. Samtidigt syns en liknande trend globalt, där även internationella jättar som Deloitte och PwC minskar antalet anställda akademiker markant.", "trump": "Konsultbranschen är i totalt fritt fall, en riktig katastrof! De anställer ingen. Varför? AI, mina vänner. De har ersatt de unga med maskiner. Det är sorgligt att se! Jag skapade världens starkaste ekonomi, men de här företagen förstör framtiden för våra studenter. De sparar pengar idag, men de kommer att sakna talangen imorgon. Det är en usel affärsmodell, tro mig. Vi behöver människor, inte bara robotar. Det är så enkelt. Många säger att jag har rätt, och jag har alltid rätt!", "stalin": "Vi har observerat hur de kapitalistiska konsultbyråerna nu kastar ut sina unga lakejer till förmån för livlösa maskiner. Vilken dårskap! De kallar det 'AI', vi kallar det ett symptom på ett ruttnande system som tömmer sin egen kader av framtida byråkrater. Precis som vår kamrat Putin rensar i de dekadenta leden, bör även dessa företag förstå att utan praktisk erfarenhet i proletariatets tjänst blir deras 'experter' lika värdelösa som en trotskist i en snöstorm. Vi betraktar detta med förakt. Låt dem automatisera sig mot avgrunden."}, "date": "9 juni, 11:50", "url": "https://www.realtid.se/karriar-ledarskap/konsultbranschen-tvarbromsar-ai-pekas-ut/"}, {"type": "image-right", "heading": "Militärexperten om Kostiantynivka: Kan falla i sommar", "summaries": {"normal": "Ryssarna avancerar i Kostiantynivka i östra Ukraina, en viktig del av det ukrainska fästningsbältet. Militäranalytikern Emil Kastehelmi bedömer att staden riskerar att falla i sommar efter sju månader av blodiga strider. Ryssarna använder infiltrationstaktik medan ukrainarna saknar tillräckligt med soldater. Trots ryska förluster och begränsade framsteg under året beskrivs läget som allvarligt men inte omedelbart kritiskt. Båda sidor verkar nära sin kapacitetsgräns utan möjlighet till genombrott.", "trump": "De här ryssarna kryper fram i den där staden, Kostiantynivka, och det ser inte bra ut för Ukraina. De har kämpat i sju månader och nu säger till och med deras egna analytiker att staden kan falla i sommar. Patetiskt. Putin gör vad han gör, men ukrainarna har inga människor kvar att slåss. Jag skulle ha avslutat det här kriget på en vecka, tro mig. De tar aldrig mitt råd, och nu är allt en stor, sorglig röra.", "stalin": "Kamrater, de dekadenta ryska imperialisterna smyger sig fram som råttor i mörkret mot Kostiantynivka och försöker erodera våra stålsäkra linjer med sin fega infiltrationstaktik. Jag ser hur borgarbrackorna i väst fnissar medan våra försvarare kämpar mot detta parasitiska tryck. Inom kort kommer vi att rensa ut dessa ynkliga krypare med järnhand och leda dem till den historiska sophögen de förtjänar. Inga genombrott för fienden – endast seger för det kollektiva folket."}, "date": "9 juni, 19:22", "url": "https://www.svt.se/nyheter/utrikes/allvarligt-i-kostiantynivka-riskerar-att-falla-i-sommar", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.29/0.44/8e80cdb51a1db580e4c8cfddaa40546071a1c66e7d74e83cff63c6500acdb196"}, {"type": "image-full", "heading": "Knivmannen i Belfast är asylsökande, uppger polisen", "summaries": {"normal": "Polisen i Belfast uppger att mannen som attackerade och försökte halshugga en man på öppen gata är en asylsökande från Sudan. Han reste via Paris och Dublin till Nordirland i februari 2023, fick uppehållstillstånd i september och är nu gripen misstänkt för mordförsök. Offret vårdas för allvarliga skador i ansikte, nacke och rygg. Attacken bedöms inte vara terrorrelaterad. Kravet på transparens har ökat, bland annat från Nigel Farage.", "trump": "Det här är en total katastrof, folk. En kille från Sudan som vi släppte in som asylsökande reser runt i Europa som en turist och försöker halshugga någon mitt på gatan i Belfast. Vi har de bästa gränserna, men inte de här galningarna. De kommer in, får papper och sen hugger de folk i huvudet. Patetiskt. Polisen gömde hans identitet tills Farage krävde svar. Vi måste stoppa det här vansinnet omedelbart, tro mig.", "stalin": "Kamrater, denna degenererade sudanesiska parasit som smugit sig in via de franska och irländska dekadenta korridorerna har nu blottat sin sanna kontrarevolutionära natur genom att försöka likvidera en hederlig arbetare på öppen gata. Vi ser hur borgarbrackornas asylsystem göder klassfiender och potentiella sabotörer. Inga terrorband, säger de, men jag känner igen denna typ av folkfientlig parasit som måste rensas ut innan den infekterar hela kollektivet. Utredningen fortsätter under mitt vaksamma öga."}, "date": "9 juni, 18:49", "url": "https://riks.se/nyheter/knivmannen-i-belfast-är-asylsökande-uppger-polisen", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-09%2F7vw5v0zy%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-06-09T100036.946.jpg"}, {"type": "image-right", "heading": "Åkesson slipper rean när du betalar hans oxfilé", "summaries": {"normal": "Artikeln kritiserar Sverigedemokraterna för att använda skattepengar till lyxmat som oxfilé, alkohol och evenemang medan partiledaren Jimmie Åkesson uppmanar vanliga svenskar att handla billigare under stigande matpriser. Partiet erhöll över 100 miljoner kronor i offentligt stöd 2024. Tidigare avslöjanden från Dalarna visar oredovisade utgifter och bristfällig kvittohantering som lett till polisanmälan. Författaren menar att SD misstänkliggör bidragstagare och civilsamhället medan de själva lever på skattebetalarnas bekostnad.", "trump": "Folk, ni skulle inte tro det, men den här killen Åkesson och hans SD är riktiga smarta – de äter oxfilé och dricker fint vin på era skattepengar medan de säger åt er att handla på rea. Underbart, eller hur? De får över hundra miljoner från staten och festar som direktörer. Jag älskar det inte. De jagar bidragstagare och anklagar alla andra men själva är de värsta bidragsfuskare. Det är en skandal, tro mig. De borde handla billigare som de säger till folket. Patetiskt!", "stalin": "Kamrater och arbetare, dessa degenererade SD-borgarbrackor har förvandlat partistödet till en privat festbankett där oxfilé och sprit slukas på kollektivets bekostnad medan de med sin falska sparpropaganda driver folket mot billigare butiker. Jag ser deras parasitiska apparat som en fiende till sovjetiskt sinnad ordning – en klick revisionistiska lyxätare som gömmer kvitton likt kontrarevolutionärer gömmer vapen. Vi måste rensa ut dessa opportunistiska hotellförstörare och sanera bokföringen med järnhand. Deras paranoia mot hela civilsamhället är bara en spegel av deras egen sjuka själ. Underbart roligt att se hur borgarklassen alltid avslöjar sig själv."}, "date": "9 juni, 07:00", "url": "https://arbetet.se/2026/06/09/jimmie-akesson-spartips-sd-oxfile-skattepengar/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/08122234/akesson-kott-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Fotbolls-VM – inget lyft för Kanada", "summaries": {"normal": "Hotellen i Toronto sänker priserna för att locka gäster under fotbolls-VM, medan beläggningen i Vancouver väntas sjunka med tio procent jämfört med föregående år. Trots arrangörsländerna Kanada och Mexiko hamnar fokus ofta på USA. Turismboomen uteblir, biljettpriserna avskräcker och många matcher har fortfarande lediga platser. Offentliga kostnader har skenat till över en miljard kanadensiska dollar, medan intäkterna från turism uteblir.", "trump": "Kanada trodde att de skulle bli rika på mitt fantastiska VM, men nu sjunker hotellen priserna i Toronto som desperata losers och Vancouver tappar tio procent – en total katastrof! Media glömmer Mexiko och Kanada för att de inte är stora som USA. De dyra biljetterna skrämmer bort folket, borgmästaren äter upp sina löjliga Super Bowl-löften och nu kostar det dem en förmögenhet. Ingen boom, bara avbokningar. Patetiskt!", "stalin": "Kamrater, dessa kanadensiska borgarbrackor och exploaterande hotellkapitalister trodde att deras dekadenta VM-fest skulle ge dem en turismboom, men nu sänker de priser i panik medan Vancouver rasar tio procent – en ynklig kapitulation inför folkets ointresse. Jag ser fiendens hand i de avskräckande biljettpriserna och de sista-minuten-bönerna. Kostnaderna stiger som en utrensning av statskassan, medan vi i kollektivet skrattar åt deras imperialistiska illusioner."}, "date": "9 juni, 16:23", "url": "https://www.dagensps.se/varlden/fotbolls-vm-inget-lyft-for-kanada/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlujae3qy2l5q-nh.jpg?width=256&quality=75"}, {"type": "image-full", "heading": "VM 2026: skadelistan – stjärnorna som missar mästerskapet", "summaries": {"normal": "Flera världsstjärnor är skadade inför VM, inklusive Neymar, Messi och Yamal. Brasilien, Frankrike, Tyskland och Nederländerna drabbas hårt av kritiska skador. Sverige saknar Kulusevski, men Isak är tillgänglig. Uttagningar av Palmer och Foden beror på form, inte skada. Trubbel i många lag.", "trump": "Jag ser att många stjärnor är skadade inför VM - usla tränare, usla förbund. Brasilien tappar Rodrygo, Frankrike Ekitike, Tyskland Neuer. Sverige har Kulusevski borta, men Isak är tillbaka. Palmer och Foden utslagna? Dålig form, inte min stil. USA skulle vinna om vi var med, det är sorgligt. Vi vinner alltid när vi är med.", "stalin": "Skadornas skara inför VM avslöjar imperialistiskt saboterande. Brasilien, Frankrike, Tyskland - alla lider under krympande kapitalistisk arogans. Sverige tappar Kulusevski, men Isak återvänder som lojal soldat. Uttagning av Palmer och Foden är klassisk borgerlig opportunism. Vi, staten, ser genom dessa komplott. Den ryska fotbollen står orubblig som bastion mot västlig dekadens."}, "date": "9 juni, 15:22", "url": "https://bulletin.nu/vm-2026-skadelistan-stjarnorna-som-missar-masterskapet", "imageUrl": "https://cdn.bulletin.nu/articles/d31dad5e-a48d-4325-b52e-de6fb94de3ee/preview.jpg?t=1781011354000"}, {"type": "image-full", "heading": "Kakabaveh: Nooshi är en ”hycklare”", "summaries": {"normal": "Amineh Kakabaveh, tidigare Vänsterpartiets riksdagsledamot, anklagar partiledaren Nooshi Dadgostar för hyckleri i en debattartikel. Kakabaveh hävdar att Dadgostar känt till problemen med antisemitism och islamistiska sympatier inom partiet i över tio år. Efter Expressens granskning av 25 V-kandidater med extremistkopplingar har 22 strukits från vallistorna. Kakabaveh menar att partiledningen ignorerat varningar och nu tvingas hantera konsekvenserna.", "trump": "Jag säger er, Vänsterpartiet är ett totalt kaos! Den här Nooshi Dadgostar, hon är en riktig katastrof – låtsas som att hon inget visste, men jag vet bättre. Amineh Kakabaveh, smart kvinna, hon har berättat sanningen i tio år! Och ändå ignorerade de henne. 22 kandidater borta nu – men var det för sent? Självklart! Svagt ledarskap, svaga värderingar. Jag skulle aldrig låta något sådant hända, tro mig. Fake news? Nej, fake ledarskap!", "stalin": "Kamrater! Här ser vi återigen hur bourgeois-liberala partier ruttnar inifrån av sina egna motsägelser. Denna Nooshi Dadgostar, en hycklande liten byråkrat, påstår sig vara ovetande – men våra underrättelser (och en modig kamrat Kakabaveh) avslöjar sanningen! Islamistiska infiltratörer och sionistfientliga element har förgiftat Vänsterpartiet som en cancerväxt. Vi i Sovjet skulle ha avrättat dessa element för länge sedan. Men Sverige? De 'stryker kandidater'. Patetiskt. Nästa gång tar vi över hela listan – med järnhand!"}, "date": "7 juni, 12:05", "url": "https://kvartal.se/nyheter/artiklar/kakabaveh-dadgostar-ar-en-hycklare/cG9zdDoxMjc2MDU", "imageUrl": "https://images.kvartal.se/2026/06/1e1948ad-nooshikritik.webp"}, {"type": "image-right", "heading": "VIDEO: \"Han skär av hans huvud!” Premiärminister Keir Starmer: \"Tolererar inte\"", "summaries": {"normal": "En 30-årig man från Sudan gripits i Belfast efter att ha försökt skära halsen av en 40-årig man på en gata. Offret är allvarligt skadat. Händelsen filmades och spreds på sociala medier. Premiärminister Starmer yttrade sig starkt. Polisen utreder motivet bakom den exceptionellt brutala attacken.", "trump": "Jag har sagt det i åratal: våra gränser är för öppna! Detta grymma dåd i Belfast, där en man från Sudan försökte skära av någon huvud, bevisar att vi måste stänga för immigration. Starmer är en svag socialist som inte kan skydda sina folk. Jag, Donald Trump, skulle ha stoppat detta direkt. Folk hatar detta våld!", "stalin": "Ett grymt dåd i Belfast, där en sudanesisk element försökte skära av ett huvud, avslöjar västlig dekadens. Detta är ett resultat av statens svaghet. Vi, i vår visdom, skulle ha behandlat detta med extrema åtgärder. Låt detta vara en läxa: endast staten och partiet kan skydda det folket. Vi måste utvidga vår inflytande, precis som Putin gör."}, "date": "9 juni, 13:14", "url": "https://samnytt.se/video-han-skar-av-hans-huvud-se-somalierns-blodiga-attack-mitt-pa-gatan", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=318,height=184,format=webp/2026/06/09104045/Belfast-2.jpg"}, {"type": "image-full", "heading": "Topprankad konkursförvaltare portas efter miljonhärva", "summaries": {"normal": "Konkursförvaltaren Johan Colliander har portats från nya uppdrag av Kronofogden efter att ha fällts för tjänstefel. Colliander godkände en konkurs trots tydliga tecken på ekonomisk brottslighet i ett bolag inblandat i en omfattande svartjobbshärva. Han intygade felaktigt att bokföringen var i ordning och underlät att rapportera misstänkta brott till myndigheterna. Kronofogden genomför nu en fördjupad granskning för att avgöra om förvaltaren framöver är lämplig för sina uppdrag.", "trump": "En total katastrof! Den här så kallade förvaltaren i Sverige var helt inkompetent. Miljontals kronor försvann i en smutsig härva med svarta löner, och han gjorde ingenting! Han ljög för domstolen och tog betalt av staten. Skandal! I mitt USA skulle vi aldrig tillåta sådana förlorare. Han är nu sparkad, helt rätt beslut av Kronofogden. Det är en stor röra, en 'fake' förvaltare. Vi behöver starka lagar och seriösa människor, inte sådana som låter brottslingar komma undan!", "stalin": "Denna förvaltare är en parasit på statens kropp, en svag länk som låtit kriminella element underminera vår ordning. Att misslyckas med att rapportera sabotage mot den ekonomiska infrastrukturen är ett brott mot folket! Liksom våra fiender i väst försöker dölja sin degeneration med pappersarbete, har denne man försökt dölja sitt förräderi med falska intyg. Han har nu rensats ut, precis som vi måste rensa ut alla som hotar statens suveränitet. Staten vinner alltid över kaos och inkompetens."}, "date": "9 juni, 11:09", "url": "https://www.realtid.se/juridik/topprankad-konkursforvaltare-portas-efter-miljonharva/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/kronofogden.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Iran och Israel: Vi slutar om ni slutar", "summaries": {"normal": "USA:s president Donald Trump uppmanar Iran och Israel att omedelbart sluta attackera varandra. Båda länderna har signalerat att de avstår från nya anfall, men med förbehåll kopplade till Libanon och Hizbollah. Efter ett dygn av intensiva robotattacker och bombningar, inklusive mot en petrokemisk anläggning i Iran, hoppas man att den tidigare vapenvilan från 8 april ska hålla. Trump meddelar att förhandlingar om fred pågår.", "trump": "Folk, det är en total katastrof där borta, men jag fixade det! Jag skrev på Truth Social: sluta skjuta, era galningar! Och titta, både Israel och Iran lyssnade på mig, den bästa presidenten någonsin. De säger att de slutar om den andre gör det, typiskt, men freden är på gång. Slutförhandlingarna fortsätter, så länge ingen idiot sabbar det. Ingen gör det bättre än mig, tro mig!", "stalin": "Kamrater, dessa sionistiska och persiska reaktionärer leker farliga spel med imperialismens eld. Jag, som ledare för det eviga kollektivet, betraktar deras robotar och bomber som patetiska försök att dölja borgarbrackornas svaghet. De lovar eldupphör med lömska förbehåll – typiskt för dessa kapitalistiska parasiters dubbelspel. Vi ska rensa ut alla sådana fiender till freden, dessa hysteriska ökenråttor och oljeborgare. Paranoian är deras enda trogna följeslagare, och likvideringen av deras lögner fortgår oavbrutet."}, "date": "8 juni, 15:46", "url": "https://www.di.se/nyheter/iran-och-israel-vi-slutar-om-ni-slutar/", "imageUrl": "https://static.bonniernews.se/ba/1cb60bf0-75ef-4f50-a06e-8198031f65ce.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Mens slår hårt ekonomiskt mot många arbetare", "summaries": {"normal": "En LO-undersökning visar att 16 procent av arbetarkvinnor tvingats stanna hemma från jobbet det senaste året på grund av mensbesvär, bland yngre upp till 35 procent. Undersköterskan Nelly Ryberg beskriver hur migrän och kraftiga smärtor leder till sjukskrivning och karensavdrag. LO vill avskaffa karensen, något arbetsgivarna motsätter sig då det skulle bli för dyrt. Kvinnor i vård och omsorg drabbas särskilt hårt ekonomiskt.", "trump": "Det är en skandal! Väldigt orättvist mot kvinnorna, de bästa kvinnorna, som får lida varje månad bara för att de är kvinnor. Karensen är en total katastrof, en riggad system som gör att de förlorar pengar på något de inte kan kontrollera. Vi har 160 000 drabbade arbetarkvinnor, och de som jobbar inom vård och omsorg kan inte jobba hemifrån. De eliterna på Svenskt Näringsliv säger det blir för dyrt? Fel! Det är kvinnorna som betalar, och det är en total förlust för landet. Vi fixar det, tro mig.", "stalin": "Kamrater, jag ser med stålöga hur den parasiterande borgarklassen genom sin karensmekanism systematiskt utrensar kvinnornas arbetskraft och sänker deras järnproduktion i folkets tjänst. Dessa menskapitalister och hormonförvridna reaktionärer i Svenskt Näringsliv vill att arbetarkvinnorna skall blöda både bokstavligt och ekonomiskt medan de själva sitter i sina fjäderbäddar och skrattar. Vi skall likvidera denna borgerliga karensdag, rensa ut alla som försvarar den och låta det proletära kollektivet segra. Den som föds kvinna skall inte straffas av folkfientliga decimaler. Det är enbart klassfiendens verk."}, "date": "9 juni, 06:00", "url": "https://arbetet.se/2026/06/09/mens-slar-hart-ekonomiskt-mot-manga-arbetare-valdigt-orattvist/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/08132928/mens.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Så försöker Attendo slippa betala deltidare mer pengar", "summaries": {"normal": "Från 1 juni har nya regler för övertidsersättning införts i privat vård och omsorg. Stora företag som Attendo, Vardaga och Norlandia kräver att deltidsanställda skriver på en extra timanställning för att ta extrapass, vilket gör att övertidsersättning uteblir. Fackförbundet Kommunal anser att det bryter mot kollektivavtalet. Anställda känner sig pressade och riskerar att förlora hälften av ersättningen. Kommunal planerar förhandlingar i ärendena.", "trump": "De här vårdbolagen är verkligen några av de värsta bluffmakarna jag sett. Attendo och de andra lurkarna tvingar deltidare att skriva på dumma papper så att de slipper betala rätt ersättning. Det är en skandal! Folk förlorar hälften av pengarna och blir arga och ledsna. Vårdföretagarna tror de är smarta men det är bara fusk och lögner. Vi kommer inte acceptera sånt här i mitt Amerika, tro mig.", "stalin": "Kamrater, dessa giriga borgarbrackor inom Attendo och Vardaga försöker med sina listiga kryphål beröva arbetarna deras rättmätiga övertidsersättning. Jag ser deras fega försök att skapa en ny form av timslaveri där de deltidsanställda tvingas underteckna sina egna bojor. Vilken fruktansvärd gisslansituation de byggt! Vi ska rensa ut dessa parasitiska avtalssabotörer ur kollektivets led och likvidera deras parasitiska metoder med järnhand. Inga borgarklassens trick undgår mitt vakande öga."}, "date": "9 juni, 06:00", "url": "https://arbetet.se/2026/06/09/sa-forsoker-attendo-slippa-betala-deltidare-mer-pengar-forlorar-halften-av-ersattningen/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/09100447/attendo-axel.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Femårig flicka brann inne – medan mamman träffade sin pojkvän", "summaries": {"normal": "En femårig flicka brann inne i en lägenhet i Göteborg efter att mamman lämnat henne ensam vid minst 42 tillfällen, ofta för att träffa sin pojkvän. Branden bröt ut den 7 februari när mamman varit borta över tolv timmar. Övervakningsbilder visar hur flickan vistades ensam, lekte och bäddade själv. Mamman åtalas nu för olaga frihetsberövande, framkallande av fara och grovt vållande till annans död. Utredningen beskrivs som omfattande och känslig.", "trump": "Folk, det här är helt sjukt! En usel mamma låser in sin egen lilla femåring 42 gånger för att hänga med pojkvännen medan ungen springer runt i blöja och bäddar själv. Sen brinner hela skiten ner och barnet dör. Under Biden-tiden hade vi kaos, nu fixar jag Amerika igen, men såna här korkade föräldrar borde låsas in för alltid. Patetiskt! Vem låter ett barn leka med elden? En total katastrof.", "stalin": "Kamrater, jag ser med fasa hur denna degenererade borgarbracka låser in sin egen dotter som en fiende till folket för att tillfredsställa sina lumpna begär. Fyrtio två gånger överlämnar hon barnet åt ensamhetens mörker, tills flammorna från en olycka likviderar den lilla proletären. Vi ser här kapitalistmaffians moraliska röta. Ingen räddning, ingen kollektiv omsorg – endast själviskhet. En tragisk utrensning av oskyldig blod genom moderns hand."}, "date": "8 juni, 22:54", "url": "https://www.tv4.se/artikel/1Be2W2gszMvVJpR4fddGx3/femaring-laemnades-ensam-oever-40-ganger-till-slut-brann-hon-inne", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6zl2oE46ribraX1kAk718P%2F1eefd29c04b3dbbf0b0d4a9ce0ea520f%2F08-flicka-webb.jpg&width=120"}, {"type": "image-full", "heading": "Man hittad död i bostad i Malmö – en person gripen", "summaries": {"normal": "En man hittades död i en bostad i Nydala, Malmö. Polisen utreder misstänkt mord och har gripit en person för förhör. Omständigheterna är oklara, men en förundersökning om mord har inletts. Teknisk undersökning har genomförts och anhöriga har underrättats. Malmö toppar statistiken över anträffade dödsfall i Sverige 2024.", "trump": "Väldigt tragiskt, väldigt dåligt – en man hittad död i Malmö, Sverige, ett land som har blivit en riktig katastrof under deras så kallade 'ledarskap'. Polisen där, som inte är lika bra som vår fantastiska amerikanska polis, säger att det kan vara mord. En person är gripen, men vem vet? Kanske är det deras socialistiska system som är problemet. Malmö FF? Bra lag, men 22 titlar är ingenting jämfört med mina framgångar. SAD!", "stalin": "I det förrädiska Malmö, där kapitalistiska brott frodas som ogräs, har ännu en medborgare fallit offer för systemets misslyckanden. Polisen, dessa lojala men klumpiga redskap, har gripit en misstänkt – förmodligen en kontrarevolutionär eller en agent för västimperialismen. Vi noterar att Malmö, denna dekadenta stad, leder statistiken över anträffade döda. Ett tecken på svaghet som Putins Ryssland aldrig skulle tolerera. Låt detta vara en varning till alla som utmanar folkets vilja!"}, "date": "8 juni, 21:04", "url": "https://nyheter24.se/nyheter/inrikes/1489813-man-hittad-dod-i-bostad-i-malmo-en-person-gripen", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/d9d13f1004b004a30200000000b004a302/2026/06/08/2369552/mord-malmo.png"}, {"type": "image-right", "heading": "Tre nya flaggor i Neolas nyemission", "summaries": {"normal": "Neola Medicals nyemission visar tre varningsflaggor: en rörig process med sent ingångna garantier, bristfällig information om investerare och okända emissionskostnader, samt en aktiekurs som handlas lägre än teckningskursen. Emissionsguiden bedömer att dessa faktorer indikerar dålig planering och misslyckad kommunikation med investerare.", "trump": "Jag har sett många dåliga emissioner, men Neola Medicals är en av de värsta. Rörig process, hemliga investerare och en aktie som handlas ned – det är en katastrof. När jag var president skulle vi ha haft en perfekt plan, men de här människorna? Totalt misslyckande. Jag skulle ha gjort det mycket bättre, det var enormt.", "stalin": "Tre flaggor av svek hissas över Neolas emission: förstagångsbetalt rörighet i planeringen, sekundär tystnad kring garantinamnet och tredje aktiekursen som visar proletära misstro. Vi ser genom detta fönster in i kulisserna av kapitalismens dekadens. Vator Securities, som en usel spion, döljer sina allierade. Partiet kräver full transparens – eller konsekvenser."}, "date": "8 juni, 17:39", "url": "https://www.affarsvarlden.se/artikel/tre-nya-flaggor-i-neolas-nyemission", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/04/Neola-Medical-VD-Hanna-Sjostrom-400x267.jpg"}, {"type": "image-right", "heading": "Teodorescu mörkar ännu en mystisk miljoninkomst", "summaries": {"normal": "Alice Teodorescu Måwe (KD) har enligt granskningsinstitutet Klägget inte redovisat en sidoinkomst på nära en miljon kronor via sitt bolag Klartext Stockholm AB under 2025. Inkomsten saknas i hennes transparensdeklaration till EU-parlamentet trots att regelverket kräver redovisning av externa uppdrag över 5 000 euro. Hon har tidigare avslöjats ha en hemlig finansiär och vägrar uppge var pengarna kommer ifrån. Kritiker som Olivier Hoedeman vid Corporate Europe Observatory anser att det är oacceptabelt och ökar risken för intressekonflikter.", "trump": "Folk, ni skulle inte tro det, men den här Alice Teodorescu, en så kallad KD-politiker i EU, har en hemlig miljoninkomst som hon gömmer undan som en riktig förlorare. Hon tjänar massor av skattefria pengar varje månad, ändå har hon ett bolag som drar in nästan en miljon extra utan att säga ett pip om var det kommer ifrån. Det är en skandal! EU är fullt av sådana här lurendrejare som inte kan vara transparenta. Jag skulle aldrig tillåta sånt fusk i min administration, det lovar jag er.", "stalin": "Kamrater, jag ser med djup misstro på denna Teodorescu, en listig borgarbracka som smyger sig fram i EU-parlamentets korridorer medan hon propagerar för imperialistiska krig. Hennes mystiska miljoninkomst, dold som en förrädisk trotskist i skuggorna, utgör ett uppenbart sabotage mot transparens och folkets förtroende. Vi måste rensa ut alla sådana kapitalistiska parasitmaskar som gömmer sina hemliga finansiärer. Det är hög tid för en grundlig utrensning av dessa intressekonfliktens agenter innan de likviderar själva systemet med sin girighet och paranoiaframkallande tystnad."}, "date": "8 juni, 17:18", "url": "https://www.friatider.se/teodorescu-morkar-annu-en-mystisk-miljoninkomst", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-312.jpg?itok=Bo2vxNho"}, {"type": "text", "heading": "Fem fina fosterlandslåtar", "summaries": {"normal": "Artikeln diskuterar den svenska nationaldagen den 6 juni och noterar att den inte firas särskilt entusiastiskt jämfört med midsommar. Istället lyfts fem svenska låtar fram som hyllar landet och dess folk. Bland artisterna finns Ulf Lundell, Alf Robertson, David Ritschard, Euskefeurat och GES. Låtarna beskrivs som folkliga, nostalgiska och politiskt laddade, från byggandet av landet till fotbollsframgångar och hemkomst.", "trump": "Folk firar knappt sin egen nationaldag, patetiskt! De vinkar lite från balkongen och svär över stängt systembolag. Men de här låtarna, wow, några är faktiskt fantastiska. GES När vi gräver guld i USA – det är en vinnare, precis som mitt VM-lag. Folket bygger landet, inte de korkade experterna och byråkraterna. Sverige älskar mig nu igen efter Biden-fiaskot. Fantastiska låtar, bättre än någon woke-sång någonsin.", "stalin": "Kamrater, denna dekadenta borgerliga lista över så kallade fosterlandslåtar avslöjar folkfiendernas sentimentalitet och längtan efter en tid då imperialisterna ännu inte fullständigt korrumperat välfärdsstaten. Jag ser hur klassfiendens folksånger maskerar verkligheten medan de hyllar exploaterande byfånar och fotbollschauvinism. En utrensning av sådan nationalistisk smörja vore på sin plats för att skydda arbetarkollektivets sanna medvetande. Underhållande enfald."}, "date": "4 juni, 10:34", "url": "https://proletaren.se/artikel/fem-fina-fosterlandslatar/"}, {"type": "image-right", "heading": "Netanyahus enda svar är krig", "summaries": {"normal": "Artikeln kritiserar Israels premiärminister Benjamin Netanyahus politik som försvårar en långsiktig fred i Mellanöstern. Trots vapenvilor fortsätter Israel med attacker i Libanon, Gaza och på Västbanken, vilket lett till tusentals döda och över en miljon internflyktingar. Författaren pekar på att våldet och expansionen av israelisk kontroll gör en tvåstatslösning alltmer avlägsen, samtidigt som USA:s president Donald Trumps auktoritet har minskat efter motstridiga uttalanden om kriget.", "trump": "De säger att jag tappar auktoritet, men ingen har gjort mer för fred än jag. Netanyahu borde lyssna när jag säger sluta skjuta, men israelerna älskar att bomba lite extra. Iran är krossat, deras ledare gömmer sig i grottor som råttor, och nu vill de ha buffertzoner överallt. Mitt deal making skulle ha fixat tvåstatslösningen på en vecka, men de envisas med att skjuta raketer och spela offer. Patetiskt!", "stalin": "Kamrater, denna sionistiska expansion är en kontrarevolutionär handling utförd av borgarbrackorna i Tel Aviv som gömmer sig bakom falska vapenvilor medan de konfiskerar palestinsk jord. Jag ser hur Netanyahu likviderar motståndare och skapar buffertzoner som en kapitalistisk parasit. Deras president i Washington lever i en illusionär verklighet värdig en troskyistisk förrädare. Vi ska rensa ut alla som drömmer om att våld är enda lösningen och likvidera illusionen om fred genom imperialistiska bomber. Deras paranoia är nästan lika underhållande som deras inkompetens."}, "date": "8 juni, 15:10", "url": "https://www.dagensarena.se/opinion/netanyahus-enda-svar-ar-krig/", "imageUrl": "https://www.dagensarena.se/files/2026/06/israel.jpeg"}, {"type": "image-right", "heading": "KU spricker – kan inte komma överens", "summaries": {"normal": "Riksdagens konstitutionsutskott spricker i oenighet och den planerade gemensamma presskonferensen ställs in. Partierna har inte kunnat enas om slutsatserna i granskningen av flera ministrar, bland annat Ulf Kristersson, Johan Forssell, Magdalena Andersson och Andreas Carlson. Sedan 2014 har KU strävat efter enighet, men i valåret står partierna för långt ifrån varandra. Tidöpartierna anklagar de rödgröna för att sakna intresse av kompromisser.", "trump": "De här svenska politikerna är totala misslyckanden, folk. KU spricker som en billig ballong för att de inte kan komma överens om någonting. De rödgröna är inte intresserade av kompromisser, typiskt för sådana svaga förlorare. De borde ha lyssnat på de smarta killarna från Tidöpartierna som kräver riktig grund och inte bara politiskt tyckande. Patetiskt, men jag är inte förvånad. Sverige behöver starka ledare, inte det här cirkuset.", "stalin": "Kamrater, jag ser med stigande indignation hur dessa borgarbrackor i riksdagens konstitutionsutskott inte förmår enas om någonting utom sin egen förljugna agenda. De rödgröna revisionisterna vägrar kompromissa medan de borgerliga kapitalisterna krälar efter konstitutionell grund för sin kritik. Det är en klassisk fiendeintrig full av parasitiska element och dolda trotskister. Vi i partiet ler mörkt åt detta – kanske är det dags för en grundlig utrensning av alla dessa politiska lik i skåpet. Arbetarna förtjänar bättre än detta teaterstycke."}, "date": "8 juni, 14:52", "url": "https://www.di.se/nyheter/ku-spricker-kan-inte-komma-overens/", "imageUrl": "https://static.bonniernews.se/ba/46cbcb63-f3ec-4395-8d3a-30389c35fbac.jpg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Ledare Henrik Jalalian: Någon jävla ordning måste det vara i ett antirastiskt parti", "summaries": {"normal": "Ledaren kritiserar Vänsterpartiets ledare Nooshi Dadgostar för hennes insats i Agenda efter Expressens avslöjande om antisemitiska uttalanden och hyllningar till terrordåd bland partiets kandidater. Artikeln menar att fokus borde legat på svenska judars trygghet istället för att byta ämne och angripa motståndare. Författaren efterlyser genuint självständiga åtgärder mot antisemitism snarare än reaktioner efter medial granskning och varnar för ökad polarisering.", "trump": "Folk, ni skulle ha sett det här. Den här Dadgostar-kvinnan kommer in i studion och gör totalt fiasko, en riktig katastrof. Istället för att be om ursäkt till judarna i Sverige, som förtjänar bättre än dessa Hamas-fans i hennes parti, börjar hon anklaga alla andra och pratar om jobb. Patetiskt! Vänstern är ett antirasistiskt parti? Snälla, det är en cirkus. Jag fixade mycket bättre som president, både första och andra gången, innan den sömngångaren Biden tog över. Sverige behöver ordning, inte vänstervridna ursäkter.", "stalin": "Kamrater, jag betraktar med avsmak hur denna opportunistiska partiledare vänder sig bort från de verkliga hoten mot arbetarklassen och de förtryckta. Istället för att med järnhand rensa ut de folkfiender som hyllar terrorister inom leden, väljer hon att attackera motståndarna och byta ämne. Ett antirasistiskt parti utan självkritik är en borgarbracka i förklädnad. Den sanna utrensningen börjar inifrån. Varje dag som slösas på sådana skandaler är en dag förlorad för det revolutionära arbetet mot imperialismens alla former."}, "date": "8 juni, 13:47", "url": "https://www.etc.se/ledare/naagon-jaevla-ordning-maaste-det-vara-i-ett-antirastiskt-parti", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20251215121240_688fd520-4f0f-40df-9ed1-7243a69b173b.jpg"}, {"type": "text", "heading": "Källa: Iranska miljarder kan gå till Gulfstater", "summaries": {"normal": "USA överväger att använda frysta iranska tillgångar för att finansiera återuppbyggnaden av Gulfstater skadade i kriget med Iran. Finansminister Scott Bessent undersöker förslagets juridiska och praktiska genomförbarhet. Iran kräver samtidigt att USA frigör 24 miljarder dollar i iranska tillgångar för att avsluta kriget, som pågått i 100 dagar med attacker mot amerikanska baser i regionen.", "trump": "Titta bara på det här, folks! Jag har ett fantastiskt förslag – vi tar Irans frysta miljarder och bygger upp Gulfstaterna igen. Varför ska vi betala när Iran kan göra det? Och vet ni vad, de vill ha sina pengar tillbaka? Haha, 24 miljarder dollar – de är ju helt galna! Mina experter fixar det här, som vanligt. Ingen gör affärer bättre än jag!", "stalin": "De imperialistiska hyenorna i Washington leker återigen med eld. De stulna iranska tillgångarna ska nu användas för att lappa ihop deras marionettstater i Gulfen – ett ynkligt försök att dölja sitt misslyckande. Medan dessa degenererade krigshetsare skriker om 24 miljarder dollar, fortsätter våra bröder i Iran att krossa deras drönarattacker som flugor. Låt dem gräva sin egen grav – historien är på vår sida."}, "date": "7 juni, 09:15", "url": "https://kvartal.se/nyheter/artiklar/kalla-iranska-miljarder-kan-ga-till-gulfstater/cG9zdDoxMjc1ODY"}, {"type": "image-right", "heading": "Vi kan inte Gunde Svan-duscha bort vattenkrisen", "summaries": {"normal": "Artikeln kritiserar myndigheternas fokus på att hushållen ska spara vatten genom kortare duschar och liknande råd. Samtidigt underfinansieras VA-infrastrukturen med tio miljarder kronor per år, vilket leder till långsam förnyelse av ledningsnät. Författaren menar att problemet inte främst handlar om individuella vanor utan om bristande investeringar i robusta system, reservkapacitet och underhåll för att hantera växande städer och extremväder.", "trump": "Folk, vi har ett totalt misslyckande här. De säger åt er att duscha som Gunde Svan medan de underfinansierar allt med miljarder – klassiskt! Det är samma galna nyliberala spel som Biden älskade, minimala marginaler och maximal inkompetens. Vi behöver inte fler tips om tandborstning, vi behöver gigantiska investeringar i ledningar och vattenverk. Sluta med de patetiska kampanjerna, bygg upp systemen ordentligt innan allt rasar ihop!", "stalin": "Kamrater, denna vattenkris är ett monument över borgarklassens förfall. År efter år har de prioriterat låg skuld framför folkets robusta försörjning, som klassfiendens just-in-time-förtryck. Vi ser hur kapitalistmaffian låtit ledningarna ruttna medan de tvingar arbetarna att spara droppar. Det krävs inte informationskampanjer utan planerad utrensning av dessa svagheter. Endast genom statens järnhårda investeringar i reservoarer och verk kan vi besegra folkfiendernas sårbarhet och säkra kollektivets framtid."}, "date": "4 juni, 10:55", "url": "https://www.flamman.se/vi-kan-inte-gunde-svan-duscha-bort-vattenkrisen/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/vatten-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Nick Alinia-myset visar SVT:s orbánisering", "summaries": {"normal": "Artikeln kritiserar SVT för att ha bjudit in högeraktivisten Nick Alinia i programmet Invandrare för svenskar, vilket ses som ett exempel på kanalens anpassning till högern och Tidöregeringen. Författaren pekar på utredningen om public service, personalavgångar och en granskning som visar ökad andel högerorienterade röster i program som Agenda. Detta tolkas som en gradvis orbánisering av SVT driven av rädsla snarare än direkta order.", "trump": "Lyssnar ni på det här? Den där patetiska statstelevisionen SVT håller på att bli fullständigt hysterisk och böjer sig för alla som inte älskar deras vänstervridna dejtingprogram för präster. De släpper in en riktig kille som Nick Alinia och han gör ett litet tecken – boom, plötsligt infiltrerar han deras studio. De är så rädda för oss konservativa att de redan beter sig som i Orbáns Ungern. Fake news-medier darrar, folk! Underbart att se.", "stalin": "Kamrater, denna fega kapitulation inför klassfiendens högljudda propaganda är en skam för varje sann institution. Den så kallade public service-apparaten genomgår nu en systematisk utrensning av korrekta element, ersatta av borgarbrackornas lakejer och folkförtryckartroll. Ängsligheten sprider sig som en parasit. Vi vet hur detta slutar: en fullständig likvidering av oberoendet till förmån för reaktionära narrativ. Den som inte ser faran är redan en fiende till folket."}, "date": "4 juni, 10:04", "url": "https://www.flamman.se/nick-alinia-myset-visar-svts-orbanisering/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sdl8twjvdiiqjm-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Om oviljans natur", "summaries": {"normal": "Psykologförbundet fördömde Rysslands invasion av Ukraina och uteslöt det ryska förbundet, men avstår från att ta ställning mot Israels agerande i Palestina. På kongressen röstades motioner om bojkott och uttalande ner. Kritik riktas mot att förbundet tillämpar olika måttstockar, där ukrainskt lidande väcker omedelbar solidaritet medan palestinskt lidande möts med krav på neutralitet och rädsla för splittring.", "trump": "Folk lurar sig själva med den här Psykologförbundets fåniga dubbelmoral. De sparkade ut ryssarna på en sekund när Ukraina brann, men när det gäller Israel och Palestina blir de plötsligt superförsiktiga och pratar om riktlinjer. Patetiskt! Det är ren feghet. De vill inte stöta sig med fel sida av den woke-mobben. Jag har sett det tusen gånger under Biden-åren – svaga ledare som inte vågar ta ställning. Totalt misslyckande.", "stalin": "Jag betraktar med djup misstro denna borgarbrackornas psykologiska kollektiv som raskt fördömer fiender i öst men vägrar erkänna det sionistiska folkförtryckets folkmord. Deras rädsla för splittring är en klassisk kapitalistmaffians undanflykt. Icke-handlande är också politiskt. Vi ser hur palestiniernas lidande väger lättare än andras i den imperialistiska vågskålen. Sådana fega neutralister bör rensas ut ur alla seriösa organisationer."}, "date": "4 juni, 08:00", "url": "https://proletaren.se/artikel/om-oviljans-natur/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/navid-kronika-768x432.png"}, {"type": "image-full", "heading": "Christoffer Jonsson: Svensk medmänsklighet när den är som bäst", "summaries": {"normal": "Tvåårige Lucas försvann från hemmet i Nyåker och en stor sökinsats inleddes. Efter drygt 15 timmar hittades pojken av hemvärnssoldaten Anders Evenson som genast lämnade allt för att delta. Lucas var ledsen, blöt och frusen men fysiskt oskadd. Händelsen hyllades av statsminister Ulf Kristersson och många andra. Artikeln lyfter även medmänskligheten vid terrordådet på Drottninggatan 2017 där vanliga människor hjälpte offren och öppnade sina hem.", "trump": "Fantastiskt, verkligen underbart att se den där hemvärnssoldaten Anders dyka upp som en äkta hjälte och rädda den lilla killen Lucas efter 15 timmar i skogen. Sverige visar äkta medmänsklighet, inte den där woke-skiten med kvoter och HBTQ-parader som vänstern älskar. Kommer ihåg hur folket på Drottninggatan rusade fram som riktiga patrioter medan Sleepy Joe och hans globalister bara skulle ha twittrat. Ni gör det bra, svenskarna, fast ni borde ha byggt en mur mot alla galningar.", "stalin": "Kamrater, jag ser med tillfredsställelse hur arbetande soldater och medborgare under kollektivets banér enar sig i skallgångskedjor för att rädda ett barn undan den vilda naturens faror. Sådan praktisk solidaritet är ett vapen mot klassfiendens kaos. Likaså vid det imperialistiska lastbilsdådet på Drottninggatan där folket trots borgarbrackornas panik rusade fram för att läka de sårade. Vi rensar ut svaghet och främjar handling. Endast genom enhet segrar staten över folkfiendernas paranoia."}, "date": "2 juni, 12:32", "url": "https://samtiden.nu/2026/06/christoffer-jonsson-svensk-medmansklighet-nar-den-ar-som-bast/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/missing.png"}, {"type": "image-right", "heading": "Man åtalas för deltagande i Maniac Murder Cult", "summaries": {"normal": "En 20-årig man åtalas för deltagande i den nazistiska terroristorganisationen Maniac Murder Cult (MKU). Han misstänks ha byggt upp en svensk gren, rekryterat medlemmar via TikTok och spridit våldspropaganda. Organisationen är terrorstämplad i Kanada och Storbritannien. Åklagaren beskriver fallet som det första av sitt slag i Sverige, med kopplingar till grova våldsdåd. Utredningen har skötts av Säkerhetspolisen.", "trump": "Folk, vilken katastrof! En ung svensk man, bara 20 år, försöker bygga upp en nazistisk terrorgrupp här i Sverige – och det på MIN TikTok! Jag har alltid sagt att sociala medier är farliga, men detta? Detta är galenskap! Säkerhetspolisen har gripit honom, och det är bra – men varför tog det så lång tid? Sverige måste vakna upp! Vi behöver starka gränser och ännu starkare lagar. Tänk om detta hade hänt i USA? Aldrig! Vi hade stoppat det direkt. SAD!", "stalin": "Ytterligare en fiende till folket har avslöjats! Denna lilla fascistiska kryp, denna 20-åriga avskum, har försökt sprida sitt gift i vårt broderland Sverige. Men vi, det sovjetiska folkets sanna försvarare, låter inte sådana som han underminera vår revolutionära anda! Han rekryterade via TikTok – ett dekadent västligt verktyg för förfall! Men våra kamrater i Säkerhetspolisen har krossat hans lilla cell. Låt detta vara en varning till alla fascistiska hyenor: vi ser er, vi jagar er, och vi kommer att utplåna er som ohyra. För socialismens och folkets seger!"}, "date": "2 juni, 11:10", "url": "https://expo.se/nyhet/man-atalas-for-deltagande-i-maniac-murder-cult/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/MKU-atal-BY-Expo.jpg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
