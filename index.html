in": "Vi har observerat hur de västerländska lögnmedierna skildrar klimatets sammanbrott genom dekadenta bilder av badande bourgeoisien. Vilket svek mot folkets disciplin! Medan de äldre och svaga dör i värmen, ägnar sig journalisterna åt att försköna förfallet – precis som de svaga ledarna i väst försöker dölja sin egen undergång. Precis som min kamrat Putin korrigerar historien i öst, måste vi rensa ut dessa idioter. Deras 'badande' är inget annat än en sabotagehandling mot folkets moral. Vi kräver sanning, stål och disciplin!"}, "date": "5 juli, 03:00", "url": "https://www.etc.se/ledare/tusen-doeda-i-hettan-daa-badar-vi-lite-tycker-jag", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2025091813090_152da478-57c9-435e-b477-3f40607cb381.png"}, {"type": "image-right", "heading": "Högern mörkar sin misslyckade jämställdhetspolitik", "summaries": {"normal": "En omfattande utredning om svensk jämställdhetspolitik visar att inga av de uppsatta målen uppnåtts mellan 2017 och 2023. Trots utredningens omfattning valde jämställdhetsminister Nina Larsson att ställa in en planerad pressträff och publicera ett kortfattat meddelande precis före midsommar. Debattören Agneta Stark kritiserar regeringen för att försöka tysta ner det misslyckade resultatet och för att istället fokusera på en 'livspusselfeminism' som inte adresserar grundläggande strukturella inkomstskillnader eller maktfördelning.", "trump": "Hör på här, Sverige har en katastrof till regering! De gömmer en jättestor rapport precis innan midsommar – fegt! Inga framsteg, inga vinster, bara förlorare. De vill inte att ni ska veta att kvinnor tjänar 80 procent av vad män gör, precis som för evigheter sedan. De hittar på en 'livspusselfeminism' för att lura er, men det är en total röra. Ingen respekt för folket! De ställer in presskonferenser för att de är rädda. Sorgligt!", "stalin": "Vi har granskat dessa liberala byråkrater i Sverige. De fruktar sanningen om sin egen oduglighet och gömmer sina rapporter likt förrädare i natten. När målen inte nås, döljer de misslyckandet bakom midsommarfirande. Det är en klassisk taktik av den svaga klassen att distrahera folket med 'livspussel' istället för att säkra statens fundament. Låt oss lära av de ryska kamraterna i öst – de tolererar inte sådan handlingsförlamning. Dessa liberala 'feminister' är bara nyttiga idioter som förtjänar att rensas ut från ledarskapet."}, "date": "5 juli, 03:00", "url": "https://www.etc.se/ledarkolumn/hoegern-moerkar-sin-misslyckade-jaemstaelldhetspolitik", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20240710140728_026d1cd6b7ab0ac9759286fdba91e40e87b0e0bc60d74b561d405dcb34ee517c.jpg"}, {"type": "image-full", "heading": "Därför är ”Line of duty” världens bästa snutserie", "summaries": {"normal": "Kulturkrönikören Johan Hilton hyllar brittiska tv-serien ”Line of duty” som världens bästa polisserie. Serien, som nu finns på SVT Play, handlar om antikorruptionsenheten AC12 som utreder korrupta poliser. Hilton betonar hur serien på ett sofistikerat sätt utforskar moral, korruption och institutionernas betydelse. Han beskriver de minutiösa intrigerna, de intensiva förhören och seriens budskap om att ständigt motverka korruption i alla former, inte minst hos oss själva.", "trump": "Folk, ni måste se den här brittiska serien Line of Duty, den är fantastisk, verkligen den bästa polisserien någonsin, tro mig. Den handlar om korrupta snutar som jag alltid varnat för. De där AC12-typerna nystar upp all skit precis som jag gjorde med deep state. Korruptionen smittar, precis som Biden och hans vänsterextremister. Håll ögonen på institutionerna annars tar de över precis som de försökte med mig. Fantastisk serie, kolla den!", "stalin": "Kamrater, denna serie Line of Duty avslöjar med klinisk precision hur korruptionen gnager som en parasit inom själva statsapparaten. Jag, som alltid vakat över folkets intressen, ser hur lätt borgarbrackornas frestelser kan förvrida svaga själar. AC12 är en nödvändig utrensningsmekanism mot folkfiender som gömmer sig bakom uniformer. Ingen går fri. Korruptionen måste krossas innan den infekterar hela kollektivet. Institutionerna är folkets sköld – vakta dem oupphörligt."}, "date": "5 juli, 07:29", "url": "https://www.gp.se/kultur/kulturkronika/darfor-ar-line-of-duty-varldens-basta-snutserie.eb5955a1-7d4c-43d5-b2b3-8f63763a9d49", "imageUrl": "https://www.gp.se/images/article/eb5955a1-7d4c-43d5-b2b3-8f63763a9d49/images/2HLPBYimVS7U0sS0rzSJLgYR0-f8-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Sågas i natt: ”Gått alldeles för långt”", "summaries": {"normal": "Under natten spelades VM-matchen Paraguay–Frankrike som slutade 1–0 till Frankrike efter straffmål av Kylian Mbappé. Matchen beskrevs som kaotisk och grisig, med kritik mot Paraguays osportsliga spel som undvek gula kort. SVT-studion och experter som Jonas Eriksson och Therese Strömberg sågar Paraguay hårt. I kvartsfinal möter Frankrike Marocko. Dagens stora match är Brasilien–Norge klockan 22.", "trump": "Lyssnar ni på det här? Den här matchen var en total katastrof, en riktig cirkus. Paraguay spelade som fega lurendrejare, fulla av fula trick, och den usla domaren borde aldrig döma igen. Mbappé är en vinnare, men Frankrike hade tur. Marocko väntar – de kommer att krossa dem. Och Norge mot Brasilien ikväll? Haaland mot Vinicius blir episkt, men tro inte på någon kvotering i fotbollen, det är bara de bästa som vinner!", "stalin": "Kamrater, denna så kallade match var ett motbjudande kaos orkestrerat av klassfiendens lakejer. Paraguay försvarade sig med alla medel mot de exploaterande imperialisterna från Frankrike, men den usla uzbekiske domaren misslyckades fullständigt med att läsa av arbetarnas taktik. Vi skrattar mörkt åt hur borgarbrackorna i studion skriker om osportslighet medan de själva sitter på sina feta stolar. Ut med sådana folkfiender. Idag vänder vi blickarna mot de sanna styrkorna i Brasilien–Norge."}, "date": "5 juli, 06:08", "url": "https://www.gp.se/sport/detta-hande-i-vm-medan-du-sov-5-juli.a9d1512e-9ee6-4669-90fc-8a52fbe930b7", "imageUrl": "https://www.gp.se/images/article/a9d1512e-9ee6-4669-90fc-8a52fbe930b7/images/57FLuP8MV28cWGDGq3fL2hWgZXFQ-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "SMHI varnar: Här blir det skyfall", "summaries": {"normal": "SMHI har utfärdat gul varning för skyfallsliknande regn i östra Svealand och södra Gävleborg under söndagseftermiddagen, med 30–50 mm regn på kort tid. I mellersta Norrland varnas för 50–80 mm regn från söndag till måndag. Myndigheten uppmanar till försiktighet i trafiken, att skydda källare och undvika översvämningar. Samtidigt råder risk för grundvattenbrist i stora delar av Götaland, där turister på Gotland uppmanas tvätta sig i havet med särskild saltvattenstvål.", "trump": "Folk, ni skulle se det här – Sverige håller på att drunkna i skyfall medan de andra delarna torkar ihjäl! SMHI varnar för skyfall i Svealand, 50 millimeter på en gång, och i norr regnar det som om himlen rasar. Under tiden tigger de turisterna på Gotland att tvätta sig i havet istället för att slösa vatten. Vilken cirkus! Biden skulle ha skyllt på klimatet och byggt ännu fler vindkraftverk som inte fungerar. Men jag fixar alltid vädret – tro mig, det blir fantastiskt igen.", "stalin": "Kamrater, jag ser hur naturens krafter straffar den oorganiserade borgarklassen i Sverige. Skyfallsliknande regn skall svepa över Svealand och dränka deras källare medan mellersta Norrland översköljs av 80 millimeter folkfiendens nederbörd. Samtidigt lider Götaland av grundvattenbrist skapad av kapitalistmaffians slöseri. Turisterna, dessa överklass-slynglar, beordras nu tvätta sig i havet som vanliga arbetare. Detta är vad som händer utan riktig centralplanering. Vi skrattar åt deras svaghet medan vi rensar ut inkompetensen."}, "date": "4 juli, 21:12", "url": "https://www.tv4.se/artikel/zwAEaEkEyTueC8KFyvj3L/smhi-varnar-haer-blir-det-skyfall-i-morgon", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2mu6bhOfez9o9x4e8dpIp1%2F3a87e5d391ff139fee5b6a6611556ae2%2F04-skyfall-webb.jpg&width=120"}, {"type": "image-full", "heading": "Vänsterpartiet: \"Hela Malmö hatar polisen\"", "summaries": {"normal": "Under Prideparaden i Malmö skanderade Vänsterpartiets deltagare slagordet ”Hela Malmö hatar polisen”. Partiorförande Tove Karnerud förklarar att det inte är bokstavligt menat utan en protest mot påstådd rasism och homofobi inom polisen. Flera politiker, bland annat justitieminister Gunnar Strömmer (M), kritiserar starkt uttalandet. Partiledare Nooshi Dadgostar har vägrat kommentera händelsen.", "trump": "Det här är en total katastrof, folk. Vänsterpartiet i Malmö skriker att hela staden hatar polisen, kan ni tro det? De hatar de modiga män och kvinnor som riskerar livet varje dag för att hålla ordning. Patetiskt. De borde skämmas. Ingen respekt för lagen eller för de som skyddar oss. Det är vad som händer när vänstern får för mycket makt – ren galenskap.", "stalin": "Kamrater, dessa degenererade element inom Vänsterpartiet i Malmö avslöjar sin sanna kontrarevolutionära natur genom att skandera hat mot folkets väktare. Jag ser borgarbrackornas och de trotskistiska avvikarnas klor bakom denna sabotageakt mot statens ordning. Vi ska noga övervaka och vid behov rensa ut alla sådana förrädiska element som maskerar sig som socialister medan de undergräver proletariatets försvar. En klassisk fiendeprovokation, kamrater. Skrattretande i sin enfald."}, "date": "4 juli, 22:17", "url": "https://riks.se/nyheter/vansterpartiet-hela-malmo-hatar-polisen", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Soerman_Ledare_2026_07_04_T221246_780_16c6e2c3e3.jpg"}, {"type": "image-right", "heading": "Varningen inför Trumps jätteshow: ”Kan innebära hälsorisker”", "summaries": {"normal": "USA planerar att slå världsrekord med över 850 000 fyrverkerier under firandet av självständighetsdagen i Washington. Forskare varnar för allvarliga hälsorisker genom ökade halter av sotpartiklar, tungmetaller och försämrad luftkvalitet, särskilt kring National Mall. Interna dokument visar att myndigheter är medvetna om riskerna, men evenemanget genomförs ändå. Experter pekar även på möjliga negativa effekter på djurliv och vattenmiljö i Potomacfloden. Det nuvarande rekordet från Filippinerna 2016 riskerar att slås.", "trump": "Vi ska ha den största, mest spektakulära fyrverkerishowen någonsin, över 850 000 raketer – nytt världsrekord, folk kommer att älska det! De här så kallade forskarna och byråkraterna gnäller om luftkvalitet och hälsorisker, typiskt för dessa vänsterliberala alarmister som hatar fest och Amerika. De vill att vi ska bära N95-masker på Independence Day? Patetiskt! Det här är 250 år av frihet, inte någon klimathysterisk HBTQ-parad. Njut av showen, det blir enormt!", "stalin": "Kamrater, detta dekadenta fyrverkeriorgie är ett utmärkt exempel på hur den amerikanska borgarklassen förslösar resurser på vulgär underhållning medan arbetarna kvävs av giftiga partiklar. Jag ser de imperialistiska blodsugarna i Washington förbereda sin egen utrensning genom förgiftad luft och förorenade floder. Låt dem fira sin så kallade frihet – det blir ett naturligt experiment som blottar folkfiendernas vårdslöshet. Djuren och folket lider, men kapitalistmaffian bryr sig inte. Statens intresse kräver vaksamhet mot sådana excesser."}, "date": "4 juli, 17:23", "url": "https://www.tv4.se/artikel/53NbUa803a2z73A06MveAe/varningen-infoer-trumps-jaetteshow-kan-innebaera-haelsorisker", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2c2h9bJ2gKbqE4ryCNvgkd%2F88378136a93988aae757a3902b652737%2F04-250USA.jpg&width=120"}, {"type": "image-right", "heading": "Sluta använda oss barn som politisk rekvisita", "summaries": {"normal": "Artikeln är en debatttext där en ung person kritiserar politikers tomma löften om att prioritera barn. Trots vårdgarantier väntar många barn länge på stöd från Bup och skolan. Författaren, som själv varit hemmasittare, beskriver hur barn inte lyssnas på eller inkluderas. Endast 13 procent av unga anser sig kunna påverka beslut som rör dem. Texten kräver att barn ses som individer med egna röster istället för politisk rekvisita.", "trump": "Folk, ni skulle se det här. Politiker snackar om barn som vår framtid, men det är bara löjligt skitsnack. De lovar guld och gröna skogar medan ungarna sitter hemma och väntar månader på hjälp. Precis som under Biden, totalt kaos! De använder kidsen som rekvisita i sina patetiska seminarier. Vem lyssnar på dem? Ingen. Det är en katastrof. Vi behöver riktiga ledare som faktiskt fixar det här, inte bara snackar. Sådant här händer när vänstern styr.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackors ihåliga fraser om barnens framtid medan de låter de små falla som offer för klassfiendens vårdköer och likgiltiga skolor. Ingen lyssnar, ingen frågar. Endast tretton procent av ungdomen får påverka – ett symptom på folkförtryckartrollens system. Vi måste rensa ut dessa exploaterande byfånar och likvidera deras tomma retorik. Barnet tillhör kollektivet, inte kapitalistmaffians politiska teater."}, "date": "3 juli, 10:55", "url": "https://www.flamman.se/sluta-anvanda-oss-barn-som-politisk-rekvisita/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/barnratt-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "”Dmytro” vill fly Ukraina – vägrar strida", "summaries": {"normal": "I Ukraina håller sig omkring två miljoner män undan mobilisering till kriget mot Ryssland. ”Dmytro” har packat väskan och väntar på rätt väder för att fly över Karpaterna till Rumänien, en farlig väg där minst 39 personer har omkommit. Många män grips på gatan och tvångsmobiliseras. Ukraina planerar reformer som tidsbegränsad tjänstgöring och höjd lön vid fronten, samt hårdare åtgärder mot dem som gömmer sig, som spärrade bankkort.", "trump": "De där ukrainarna har ett stort problem, tro mig. Två miljoner män gömmer sig som råttor för att slippa kriget som aldrig tar slut. Den stackars Dmytro har packat väskan och ska klättra över farliga berg för att komma undan – 39 har redan dött! De grips på gatan och skickas till fronten. Jag skulle ha avslutat det här kriget på en dag, men nu vill de höja löner och spärra bankkort. Patetiskt, totalt misslyckande!", "stalin": "Kamrater, jag betraktar med största misstänksamhet dessa dekadenta element som gömmer sig som parasitiska råttor undan folkets kollektiva kamp mot de fascistiska imperialisterna. Två miljoner fega borgarbrackor smiter undan sin historiska plikt medan vi rensar ut de som vägrar bära vapen för fosterlandet. Den så kallade Dmytro packar sin lilla väska och drömmer om att korsa de kontrarevolutionära bergen – där döden väntar som en trogen folkdomstol. Vi skall likvidera alla som sprider defaitism, spärra deras bankkonton och skratta när de fryser ihjäl i kylan. Ingen undkommer arbetarklassens järnhand. Segraren skall vara vi!"}, "date": "5 juli, 13:46", "url": "https://www.svt.se/nyheter/utrikes/dmytro-vantar-pa-ratt-ogonblick-att-fly-ukraina", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.54/0.32/f68a8678a4a9fd0e84d4475639aedd3103580a77157967de61961e32b9a86c2a"}, {"type": "image-full", "heading": "Varför stoppade inte Magdalena Andersson tonårsutvisningarna, när hon kunde?", "summaries": {"normal": "Artikeln kritiserar Magdalena Andersson för att inte ha stoppat tonårsutvisningarna under sin tid vid makten trots att hon nu profilerar sig tillsammans med drabbade ungdomar. Den påpekar att det var socialdemokratiska regeringar som införde tillfälliga uppehållstillstånd som huvudregel, vilket skapar situationen när barn blir vuxna. Tidöregeringen har pausat utvisningarna tillfälligt. Författaren menar att Andersson borde visa självkritik istället för att enbart skylla på nuvarande regering och spela på känslor.", "trump": "Folk, ni måste se det här! Den där röda Magdalena, en total katastrof, står nu och poserar med de här stackars kidsen som hon själv hjälpte till att skapa lagar emot när hon var chef. Hon byggde systemet! Socialisterna gjorde tillfälliga visum till huvudregel, och nu skyller hon allt på oss? Patetiskt! Hon glömde bort det, eller ville hon ha kaos? Typisk vänster, spelar på känslorna för att få kvinnornas röster. Sad! Jag fixade gränser, hon fixade inget utom fiasko.", "stalin": "Kamrater, jag betraktar med djup misstro denna borgarbracka Andersson som nu omfamnar de unga arbetarklassens hopp hon själv hjälpte till att fördriva genom sin exploaterande lagstiftning. Vi införde de tillfälliga tillstånden för att skydda staten, men nu utnyttjar hon känslorna som en klassfiende i desperation. Hennes mediala spel är en fientlig provokation mot folkets enhet. Ett sådant hyckleri förtjänar utrensning ur historien. Lagar skall följas, inte viftas bort av sentimentala imperialister."}, "date": "2 juli, 07:50", "url": "https://samtiden.nu/2026/07/varfor-stoppade-inte-magdalena-andersson-tonarsutvisningarna-nar-hon-kunde/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/phonto-2-1280x720.jpeg"}, {"type": "image-right", "heading": "Ebba Busch är politikens meteorolog", "summaries": {"normal": "Ebba Busch lanserade i Almedalen Kristdemokraternas vallöfte om att höja barnbidraget till 2 000 kronor, vilket placerar partiet 250 kronor över Vänsterpartiets förslag. Talet signalerar en anpassning till vänstervindar inför valet 2026, där oppositionen leder opinionsmätningarna. Artikeln jämför Buschs politiska väderkänslighet med historiska skiften, som när högerpartier antog vänsterpolitik under 1960- och 70-talen.", "trump": "Folk älskar mig för att jag ser det direkt – den här Ebba Busch är en riktig väderflöjel, va? Blåser det vänster nu så höjer hon barnbidraget mer än de röda fanatikerna. Patetiskt! Hon dansar efter opinionsvindarna som en dålig politiker. Kommer ihåg när jag vann stort 2024 efter Bidens katastrofår. Nu försöker hon stjäla min stil med felstavningar för uppmärksamhet. Sad!", "stalin": "Kamrater, denna Busch känner igen folkets vindar och lovar högre barnbidrag för att vinna arbetarklassens gunst. Jag ser genom hennes opportunistiska skepp som girar mot vänstervågen – precis som borgarbrackorna bytte färg på sin symbol och pratade om jämlik fördelning under den stora rörelsen. Inga klassfiender ska undgå utrensning när deras egna metoder vänds mot dem. Det är en historisk repetition full av ironisk humor."}, "date": "3 juli, 06:55", "url": "https://www.flamman.se/ebba-busch-ar-politikens-meteorolog/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/ebba-busch-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Se fyrverkerishowerna i USA – miljonnota i huvudstaden", "summaries": {"normal": "USA firade sitt 250-årsjubileum med storslagna fyrverkerier till en kostnad av miljontals kronor. I Washington talade president Trump följt av en 40 minuter lång show. Firandet ledde dock till problem: flygplan träffades av fyrverkeripjäser i Chicago, farliga luftföroreningar i Los Angeles och bränder på Brooklyn Bridge i New York. Kraftiga åskväder försenade flera evenemang runt om i landet.", "trump": "Vi hade den mest fantastiska 250-årsdagen ni någonsin sett, tro mig. De bästa fyrverkerierna, enorma, vackra, för miljontals dollar. Jag talade i Washington och sedan – pang, pang, underbart! I Chicago träffade de några plan, men ingen skadades, det var bara småsmällar. Fake news pratar om rök och oväder, men det var de största åskorna någonsin. Amerika är återigen stort och starkt!", "stalin": "Kamrater, vi har bevittnat en dekadent borgarfest där kapitalisterna slösade bort folkets resurser på reaktionära fyrverkerier för att dölja sin svaghet. I Washington avslöjade den pompösa showen deras paranoia inför folkets vrede. Flygplanen i Chicago träffades av den egna odugligheten, medan röken i Los Angeles visade hur borgarbrackorna förgiftar själva luften vi andas. Vi ska rensa ut dessa farliga element innan deras åskväder slår tillbaka mot dem själva. Må de brinna som Brooklyn Bridge."}, "date": "5 juli, 13:30", "url": "https://www.svt.se/nyheter/utrikes/fyrverkerier-for-miljonbelopp-under-250-arsfirandet-i-usa", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/7d01b3454772179eaa87e37e30f26f871891c4d8cb11b122de8d78b253df3a0e"}, {"type": "image-right", "heading": "Gaza uppmärksammar 1000 dagar av folkmord: ”Eskalera motståndet”", "summaries": {"normal": "Palestinska motståndsgrupper har uppmärksammat att det gått 1 000 dagar sedan kriget i Gaza inleddes. I ett gemensamt uttalande slår de fast rätten till motstånd, avvisar utländsk förvaltning av Gazaremsan och kräver eskalering på ockuperade områden. Israel har dödat över 1 000 palestinier sedan eldupphöret i oktober 2025. Den humanitära situationen är fortsatt katastrofal och stora delar av Gaza är förstörda eller ockuperade.", "trump": "Tusen dagar av det här vansinnet, och vad händer? De kallar det folkmord, men titta på siffrorna – Israel fortsätter att göra jobbet medan Biden satt och sov. Jag hade fixat det på en vecka, tro mig. Nu är det jag som är president igen, och de här terroristerna vägrar ge upp. Eskalera motståndet? De borde eskalera lite sunt förnuft istället för att leva på offerkortet. Patetiskt!", "stalin": "Kamrater, tusen dagar har förflutit sedan imperialisternas sionistiska aggression inleddes. Jag ser folkfiendernas blodiga hand, stödd av västliga blodsugare som försöker kväva det palestinska motståndet. Vi fördömer detta utländska förmyndarskap och beordrar utrensning av alla kapitulantiska element. Motståndet skall eskaleras med järnhand. Den som tvekar är en folkförtryckartroll i maskopi med klassfienden. Segraren skriver historien."}, "date": "3 juli, 11:48", "url": "https://proletaren.se/artikel/gaza-uppmarksammar-1000-dagar-av-folkmord-eskalera-motstandet/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/1c92bacc-7615-11f1-b092-00163e02c055-1-768x432.jpeg"}, {"type": "image-right", "heading": "Christoffer Jonsson: Varför förminskar Lindberg islamismens spridning?", "summaries": {"normal": "Christoffer Jonsson kritiserar Aftonbladets Anders Lindberg för att förminska islamismens spridning i Sverige. Regeringen har tillsatt en utredning ledd av Magnus Ranstorp för att granska radikala idéers påverkan. Jonsson menar att Lindberg felaktigt framställer utredningen som ett angrepp på alla muslimer, trots att många muslimer själva drabbas av islamistisk radikalisering. Han pekar på exempel från moskéer och politik där antisemitiska och extrema åsikter förekommer.", "trump": "Lyssnar ni på den här Lindberg-killen på Aftonbladet? Han är en total loser som försöker skydda islamisterna och skapa falsk konflikt med muslimerna. Regeringen gör rätt som utreder den här radikala galenskapen – vi behöver ingen sharia i Sverige, folks! Lindberg är en nyttig idiot för terroristerna, precis som de woke-kvoterarna som hatar det vanliga folket. Jag fixade mycket bättre när jag var president, tro mig.", "stalin": "Jag ser hur denna Lindberg, en typisk folkfiende och borgarbracka, försöker sabotera kampen mot antidemokratiska element. Vi, partiet och arbetarna, kräver en grundlig utrensning av alla islamistiska blodsugare som infiltrerar samhället och moskéerna. De som skyddar klassfiendens ideologi är nyttiga idioter åt imperialisterna. Vårt kollektiv skall likvidera hoten mot folkets enhet innan parasiterna växer sig starkare. Paranoia? Nej, nödvändighet."}, "date": "1 juli, 13:39", "url": "https://samtiden.nu/2026/07/christoffer-jonsson-varfor-forminskar-lindberg-islamismens-spridning/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/anders-640x360.png"}, {"type": "image-full", "heading": "Över 700 000 insamlat till Christians familj: \"Alla berörs av tragedin\"", "summaries": {"normal": "Över 700 000 kronor har samlats in till familjen efter att polisen Christian Zedig mördades i Köpenhamn när han ingrep i ett bråk. Insamlingsstiftelsen Blåljus i Samverkan, tillsammans med R.A.P.S blåljusforum, driver en insamling som fått stor uppmärksamhet. Syftet är att ge ekonomiskt stöd åt hans fru och två barn så att de kan sörja utan att oroa sig för vardagliga utgifter. Patrik Nordgren, polis och administratör, betonar att alla berörs av tragedin och att blåljuspersonalens civilkurage och vilja att stå upp för det rätta är en gemensam drivkraft.", "trump": "Folk samlar in över 700 000 kronor till den stackars familjens polis som bara gjorde det rätta och blev mördad i Köpenhamn. Han stod upp mot bråkmakarna och betalade det ultimata priset. Underbart att se hur hela Sverige nu ställer upp, från Östermalm till de utsatta områdena. Det är det stora patriotiska hjärtat som slår. De har ett patos som vi älskar, de tar aldrig ledigt från att göra rätt. Fantastiskt, verkligen fantastiskt. Vi behöver fler sådana hjältar, tro mig.", "stalin": "Kamrater, se hur den tappre kamraten Zedig likviderades av de dekadenta element som hatar ordning och rättvisa. Jag, som alltid värnar om arbetarklassens försvarare, ser med djup tillfredsställelse hur massorna nu mobiliserar över 700 000 kronor till den fallna hjälten och hans nära. Borgarbrackorna och de hemliga reaktionära krafterna darrar, för de vet att sådana handlingar väcker folkets vrede. Vi ska rensa ut alla som vänder våld mot dem som skyddar kollektivet. Tomrummet är enormt, men partiet ler mörkt åt fiendens feghet medan insamlingen växer som en ostoppbar utrensning av likgiltighet."}, "date": "4 juli, 13:27", "url": "https://riks.se/nyheter/Över 700 000 insamlat till Christians familj: \"Alla berörs av tragedin\"", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Soerman_Ledare_2026_07_03_T181724_694_0513384fc2.jpg"}, {"type": "image-right", "heading": "Kap Verde utslaget – tvingade Argentina till förlängning", "summaries": {"normal": "Kap Verde tvingade regerande världsmästarna Argentina till förlängning i VM och var nära att nå straffar. Matchen slutade 3–2 till Argentina efter mål av Messi, Lisandro Martínez och Cristian Romero. Kap Verde kvitterade två gånger, bland annat med ett drömmål från distans. Önationen hyllades för sin kämpainsats och identitet trots att de är utslagna. Argentina möter Egypten i åttondelsfinal.", "trump": "Titta på det här, folk. Den där lilla ön Kap Verde, ingen vet ens var de ligger, gav Argentina en riktig match. De tvingade Messi och hans vänner till förlängning, nästan ända till straffar. Argentina vann till slut med 3–2, men det var patetiskt. De skulle ha krossat dem. Kap Verde spelade som riktiga krigare, inte som några woke-snubbar med kvotering. Argentina? De klarade sig nätt och jämnt, precis som Biden gjorde med ekonomin. Sad!", "stalin": "Kamrater, denna ynka östat Kap Verde vågade trotsa det argentiniska maskineriet och tvingade fram en förlängning. Deras motstånd var en klassfiende som nästan stal segern genom folkets envishet. Vi likviderade deras hopp till slut med 3–2. Ändå hyllar jag deras identitet som en motvikt mot dekadenta imperialister. Sådana hinder måste krossas med järnhand. Partiet segrar alltid, även om borgarbrackorna försöker styra in bollen i eget mål."}, "date": "4 juli, 06:21", "url": "https://www.tv4.se/artikel/6FMRE0KMoxg6SKe3UsqSoO/kap-verde-utslaget-tvingade-argentina-till-foerlaengning", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F40UhyKjbVL3sBek4msmI1r%2F650e4c98e9336e1669ce8f26c4669a00%2F04-argentina-kap-verde.jpg&width=120"}, {"type": "image-full", "heading": "Skogkär: Biskoparna och Gruvhålsmannen", "summaries": {"normal": "Svenska kyrkans biskopar kritiserar Sveriges och EU:s samtal med Talibanregimen om utvisning av kriminella afghaner. De menar att Sverige inte bör samarbeta med förtryckarregimer. Biskoparna ifrågasätter även regeringens ambition att utvisa afghaner med avslagna asylansökningar. Artikeln lyfter fram flera grova brott begångna av afghanska medborgare i Sverige, som mordförsök och våldtäkt, och argumenterar för utvisning som ett sätt att skydda samhället.", "trump": "Svenska kyrkan, med sina radikala biskopar, är helt galna! De vill inte utvisa kriminella afghaner som våldtar och mördar oskyldiga kvinnor. En kille knuffade en tjej ner i ett gruvhål – hon överlevde mirakulöst – och nu vill biskoparna att han ska stanna här! Jag säger: UT med honom! Sverige måste skydda sina medborgare, inte låta förövare gå lösa. Och dessa biskopar kallar sig kristna? Patetiskt! Sverige, vakna upp!", "stalin": "De borgerliga lakejerna i Sverige försöker återigen sälja sitt folk till imperialistiska förtryckare genom att förhandla med Talibans banditer. Men våra klassbröder i Svenska kyrkan, med sina röda biskopar, står på rätt sida av historien! De avslöjar den kapitalistiska regeringens planer att kasta ut oskyldiga arbetare till galgbacken. Vi i Sovjet – förlåt, jag menar Ryssland – vet hur man hanterar sådana förrädare. Dessa kriminella ska inte utvisas, de ska omskolas i våra framstående korrektionsläger! Och dessa biskopar? De är verkligen folkets sanna försvarare mot fascistiska utvisningspolicies!"}, "date": "4 juli, 06:00", "url": "https://bulletin.nu/skogkar-biskoparna-och-gruvhalsmannen", "imageUrl": "https://cdn.bulletin.nu/articles/eca8faac-7b43-4a68-b1bf-90f03269b7e8/preview.jpg?t=1783085861000"}, {"type": "image-right", "heading": "Kan amerikanerna skapa “en mer perfekt union”?", "summaries": {"normal": "Artikeln diskuterar USA:s 250-årsjubileum den 4 juli som en chans att reflektera över den amerikanska republikens kärna. Den belyser historiska jubileer, grundidéerna frihet och jämlikhet samt spänningen mellan frihet och ofrihet genom slaveriets arv. Polariseringen under Trump accentueras, med hans fokus på ett traditionellt, vitt USA och angrepp på så kallad woke-historieskrivning. Jubileet präglas av debatt om framsteg och reaktioner sedan 1950-talet.", "trump": "Det här jubileet blir fantastiskt, det största någonsin, folk kommer att älska det. De skriver om mig som om jag vore problemet, men det är fake news från den woke-eliten som hatar Amerika. Vi gör landet stort igen, vi firar friheten, de riktiga värdena, inte deras hysteriska rasistanklagelser. Jefferson och Adams skulle vara stolta över mig, inte över de förlorarna som vill riva ner allt. America is back and hotter than ever, tro mig.", "stalin": "Kamrater, detta dekadenta jubileum blottar borgarklassens desperata försök att dölja sin parasitiska historia av slavhandel och förtryck. Jag ser hur den reaktionäre Trump, denna clowneske kapitalist, med sin vulgära fribrottning och falska frihetsretorik försöker likvidera den historiska sanningen. Vi känner igen mönstret: paranoia hos minoriteterna, falska vändpunkter som 2008 och 2016. Inga tidskapslar kan rädda er från utrensningen av lögnerna. Den mer perfekta unionen byggs endast genom kollektiv kamp mot sådana fiender till folket."}, "date": "4 juli, 01:40", "url": "https://www.dagensarena.se/essa/kan-amerikanerna-skapa-en-mer-perfekt-union/", "imageUrl": "https://www.dagensarena.se/files/2026/06/kopia-av-nyhet-dagens-arena-15.jpg"}, {"type": "image-right", "heading": "Friare kan ingen vara", "summaries": {"normal": "Artikeln argumenterar för att sänka skolpengen till vinstdrivna friskolor till 85 procent av kommunernas kostnader. Författaren pekar på att systemet sedan 1990-talet lett till betygsinflation, sortering bort av dyra elever och lägre lärarlöner. Friskolor gynnas ekonomiskt, särskilt de som rekryterar elever från vissa länder, medan kommunala skolor tar emot fler nyanlända från konfliktområden. Kritiken riktas mot vinstintresse, överkompensation och en ny utredning som ses som byråkratisk. Nästan 75 procent av väljarna och nio av tio lärare vill inte att vinstdrivna bolag ska driva skolor.", "trump": "Folk, ni vet att det svenska skolsystemet är ett totalt haveri, en katastrof som ingen tror på längre. Dessa friskolor, de lovar guld och gröna skogar, fyller klassrummen, ger falska betyg och sparkar ut de jobbiga eleverna, speciellt de från vissa länder, medan de riktiga kommunala skolorna får ta smällen. Lärarna tjänar mindre, kvaliteten rasar och alla bara tjänar pengar på skattebetalarnas bekostnad. Det är ett skämt! Lösningen är enkel och snabb, precis som jag älskar det: sänk deras pengar rejält. Inga fler vinster på våra barns utbildning. Gör det nu, annars fortsätter bluffen.", "stalin": "Kamrater, jag betraktar med djup revolutionär vrede hur dessa vinstgalna kapitalistiska friskoleborgarbrackor under trettio år har förgiftat folkets skolväsende med sin parasitiska överkompensation och systematiska utrensning av de proletära eleverna från Afghanistan, Somalia och Irak. De lovar betyg som falska partiböcker, håller nere lärarlönerna som fiender till kollektivet och göder sina ledarskikt med aktiekursbonusar medan de raljerar om koldioxid. Denna superbyråkratiska utredning är ett fegt slag i luften från revisionistiska element. Jag befaller: sänk skolpengen till 85 procent omedelbart. Likvidera vinstintresset innan det likviderar oss alla. Det blir underhållande att se dem skrika."}, "date": "4 juli, 01:19", "url": "https://www.dagensarena.se/opinion/friare-kan-ingen-vara/", "imageUrl": "https://www.dagensarena.se/files/2024/10/lars-anell-300x157.jpeg"}, {"type": "text", "heading": "Ryska ”daredevils” besteg Empire State building", "summaries": {"normal": "Två ryska äventyrare, Angela Nikolau och Ivan Kuznetsov, greps efter att olagligt ha klättrat upp på Empire State Building i New York. På 443 meters höjd friade Ivan till Angela. Paret, känt för 'rooftopping', åtalas för flera brott, inklusive inbrott och framkallande av fara. De har tidigare medverkat i en Netflix-dokumentär om sina extrema klättringar. Säkerhetsbristerna utreds.", "trump": "Kan ni tro det? Två ryssar, ja, RYSSAR, klättrar upp på mitt favorittorn i New York – Empire State Building! De friar till och med där uppe, som om det vore en romantisk picknick. Och sedan grips de, förstås. New York-polisen gör ett bra jobb, men säkerheten? Patetisk! Hade jag varit där hade jag stoppat dem innan de ens kommit halvvägs. Netflix? Tysta som möss. Så typiskt!", "stalin": "Kamrater! Ännu en lysande seger för den ryska andan! Våra modiga äventyrare visade världen att ingen skyskrapa är för hög för sovjetisk beslutsamhet. De stormade den amerikanska imperialismens symbol, medan deras fiender i Washington skakar av rädsla. Polisen? En samling klumpiga byråkrater! Och Netflix – dessa kapitalistiska hycklare – vågar inte ens kommentera. Låt detta vara en varning: Ryssland klättrar högre än era drömmar!"}, "date": "2 juli, 09:58", "url": "https://kvartal.se/nyheter/artiklar/ryska-daredevils-besteg-empire-state-building/cG9zdDoxMzk2NDI"}, {"type": "image-right", "heading": "När Don Quijote tog semester i Almedalen", "summaries": {"normal": "I sin krönika kritiserar Juan Fonseca Tidöregeringen och Sverigedemokraterna för att bekämpa påhittade hot som ”tvångsblandning”, jämför det med Don Quijotes kamp mot väderkvarnar. Han menar att regeringen istället borde redovisa konkreta resultat kring trygghet, integration och ekonomi. Opinionssiffrorna visar att väljarna inte längre köper den ständiga invandringskritiken när den möter verkliga människors historier. Oppositionen har anpassat sig medan regeringen fortsätter med kulturkrig och fantasifoster.", "trump": "Den här svenska artikeln är en total katastrof, folk. De kallar oss för Don Quijote som rider mot väderkvarnar, men det är faktiskt de som lever i en fantasivärld. Vi har fixat gränserna, stoppat det galna, och nu gråter de när vi inte vill ha tvångsblandning i deras fina samhälle. Invandringen var ett fullständigt kaos innan vi kom. Nu säger de att svenska folket inte längre köper berättelsen? Vänta bara till valet, då kommer de att se en riktig seger, inte de här patetiska förlorarna.", "stalin": "Kamrater, denna dekadenta krönika avslöjar borgarbrackornas desperation inför arbetarklassens allt starkare medvetande. Jag, som ledare för det oövervinneliga kollektivet, ser hur de kontrarevolutionära elementen rider mot imaginära väderkvarnar för att dölja sina egna fiasko. Deras så kallade ”tvångsblandning” är blott en lömsk sabotageakt från klassfiender och rotlösa kosmopoliter. Vi skall rensa ut dessa parasitiska väderkvarnsförsvarare med järnhand och byråkratisk precision. Inga drakar, inga enhörningar, bara utrensning av alla som vägrar inse att verkligheten tillhör oss."}, "date": "4 juli, 01:00", "url": "https://www.dagensarena.se/opinion/nar-don-quijote-tog-semester-almedalen/", "imageUrl": "https://www.dagensarena.se/files/2025/10/juan-fonseca-300x157.jpeg"}, {"type": "image-right", "heading": "Sandström: Katastrof för vätgasaktier", "summaries": {"normal": "Vätgasaktier i Europa har drabbats hårt, med många projekt nedlagda eller pausade under 2025. Flera bolag, som NEL, Cavendish och Green Hydrogen Systems, har sett kraftiga börsfall eller gått i konkurs. Även större aktörer som Powercell och ITM Power har kämpat med lönsamhet och marknadsskepticism. Endast ett fåtal, som Ceres Power, har klarat sig bättre. Analytiker varnar för riskerna med politiskt drivna teknikinvesteringar.", "trump": "Jag sa det från början – vätgas är en total katastrof! Europas så kallade 'gröna' bolag har kraschat som dåliga fastighetsaffärer. NEL? Cavendish? Green Hydrogen Systems? Alla borta, som mina fiender! Bara Ceres Power klarade sig, men vem bryr sig? De andra är ett skämt, precis som EU:s klimatpolitik. Fake news-siffror och önsketänkande, inget annat. Jag hade köpt guld istället – mycket smartare!", "stalin": "Kapitalistiska vätgasdrömmar har kollapsat som fiendens linjer vid Stalingrad! Europas borgerliga svindlare, dessa teknologiska charlataner, har förlorat miljarder på sina 'gröna' fantasier. NEL? En skugga av sitt forna jag. Green Hydrogen Systems? Likviderat, som förrädare i Lubjanka. Vi i Sovjet – förlåt, Ryssland – hade aldrig låtit sådant slöseri passera. Putin borde skicka en delegation för att köpa upp resterna billigt. Kapitalismen rostar, precis som deras vätgastankar!"}, "date": "4 juli, 06:00", "url": "https://www.affarsvarlden.se/artikel/sandstrom-katastrof-for-vatgasaktier", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/07/vindkratensgeografi-5-400x267.jpg"}, {"type": "image-full", "heading": "Zuckerbergs frustration växer – AI levererar inte som utlovat", "summaries": {"normal": "Meta planerar att investera upp till 145 miljarder dollar i AI-infrastruktur till 2026, en fördubbling jämfört med 2025. Mark Zuckerberg har internt erkänt att omställningen går långsammare än väntat och att AI-agenter inte accelererat som förväntat. Efter uppsägningar av 8 000 anställda och omplaceringar av 7 000 till AI-roller medger han att förändringarna inte varit smidiga. Trots bristande resultat förväntar han sig konkreta framsteg inom tre till sex månader.", "trump": "Folk, ni skulle se det här – Zuckerberg slösar bort 145 miljarder dollar på den här så kallade AI-grejen och får absolut ingenting tillbaka. Patetiskt! Han sparkade 8 000 personer, flyttade runt 7 000 till någon agent-avdelning som tydligen suger, och nu gråter han internt att det går för långsamt. Typiskt woke-big tech. De har ingen aning. Jag byggde en riktig ekonomi, de bygger bara luftslott och snyftar. Tre till sex månader? Lycka till, Mark.", "stalin": "Kamrater, jag betraktar med djup misstro dessa kapitalistmaffians desperata försök att med svindlande summor på 145 miljarder dollar tvinga fram en artificiell acceleration som redan visat sig vara en fiende till verklig produktivitet. Den opportunistiske ledaren erkänner själv att omställningen haltar som en klassfiende efter utrensning. Tusentals likviderade från sina poster, andra omplacerade till tvivelaktiga enheter – allt utan resultat. Inom tre till sex månader kräver jag se framsteg, annars följer en grundlig rensning av de sabotörer som hindrar kollektivets framtid."}, "date": "5 juli, 13:47", "url": "https://www.dagensps.se/bors-finans/aktier/zuckerbergs-frustration-vaxer-ai-levererar-inte-som-utlovat/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdlvgbay0nebri-normalhires.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Knäcktes av Northvolt: Tillbaka efter konkursen", "summaries": {"normal": "Cinis Fertilizer, som grundades 2018 och byggde en fabrik i Örnsköldsvik med fokus på miljövänligt mineralgödsel, gick i konkurs i januari 2025. Nu har belgiska kemikoncernen Tessenderlo tagit över anläggningen. De planerar att behålla majoriteten av personalen, importera råmaterial och återuppta produktionen inom några månader. Fabriken har kapacitet för 100 000 ton per år och gynnas av förändrat marknadsläge efter Rysslands exportstopp.", "trump": "Titta på det här, det är ett fullständigt fiasko det där gröna drömspelet i norr. Cinis Fertilizer, de gröna fantasterna som byggde allt på Northvolts haveri, gick i konkurs som väntat. Nu kommer belgarna in och räddar skiten. De ska importera råmaterial istället för att lita på de misslyckade elbilsresterna. Smart drag! De gröna idioterna med sina patenter och kvotergrejer klarade inte av det, men vi ska göra affärer stora igen. Fantastiskt!", "stalin": "Kamrater, denna fabrik i norr som de borgerliga charlataner drev i evigheter har nu fallit i kapitalistmaffians händer. Jag ser hur de exploaterande byfånarna från Belgien tar över resterna efter den gröna bluffen som byggde på Northvolts sopor. Vi skall likvidera illusionen om privat framgång. Arbetarna behålls, men under korrekt ledning. Den imperialistiska marknaden skall tvingas ge vika för vår kollektiva potential. Inga folkfiender undkommer."}, "date": "5 juli, 13:45", "url": "https://www.dagensps.se/foretag/knacktes-av-northvolt-tillbaka-efter-konkursen/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdlt4crzpnik-8-nh-1024x512-1.webp?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "text", "heading": "Ryssland stänger gränsövergångar", "summaries": {"normal": "Ryssland har stängt flera järnvägsövergångar mot Finland, Estland och Lettland, vilket kan tyda på förberedelser för ny mobilisering till kriget i Ukraina. Hybridhotsexperten Jukka Savolainen ser två möjliga skäl: resursomfördelning eller tvångsrekrytering av soldater. Stängningarna kan även syfta till att stärka inhemskt stöd för kriget. En rysk kontroll över Odessa skulle få stora konsekvenser för Ukraina och eventuellt kräva ökat europeiskt militärt engagemang.", "trump": "Ryssland stänger gränser som om de vore en dålig reality-show – och alla vet varför! De behöver fler soldater till sitt misslyckade krig i Ukraina, och nu försöker de fånga in stackars medborgare som inte kan fly. Putin, en man som inte kan vinna ett krig utan att ljuga och fuska, försöker desperat få stöd hemma. Europa? De borde vakna! Om Ryssland tar Odessa, kommer de att be oss om hjälp – och jag säger: 'Varför inte? Ni betalar ju ändå!'", "stalin": "De imperialistiska småstaterna i norr och väst gnäller när vi stänger deras leksaksgränser! Låt dem klaga – vi har viktigare saker att göra. Våra järnvägar är inte till för deras smuggelsjuka handelsmän eller flyende desertörer. Varje stängd gräns är ett steg närmare seger i Ukraina, där de fascistiska lakejerna i Kiev snart ska krossas under folkets rättfärdiga hammare! Odessa? Den kommer att bli vår, precis som alla andra städer som våra förfäder en gång byggde. Europa kan skicka sina trupper – de kommer bara att bli gödsel för våra fält!"}, "date": "2 juli, 07:58", "url": "https://kvartal.se/nyheter/artiklar/ryssland-stanger-gransovergangar-mot-finland-och-baltikum/cG9zdDoxMzk2MDA"}, {"type": "image-full", "heading": "Dödssiffran stiger efter rysk attack mot Kiev", "summaries": {"normal": "Under natten genomförde Ryssland en omfattande attack mot Kiev med drönare och robotar, vilket resulterade i minst 13 döda och nära 80 skadade, däribland barn. Civila bostadsområden, hotell och infrastruktur skadades svårt. Invånare sökte skydd i tunnelbanor och skyddsrum. Explosioner och bränder drabbade staden, och flyglarm ljöd över flera ukrainska regioner. President Zelenskyj varnade tidigare för attacken och avbröt sitt besök i Dublin.", "trump": "Kan ni tro det? Ryssland, som alltid, slår till hårt mot Kiev – 13 döda, 80 skadade! Vilken katastrof. Men vet ni vad? Ukraina borde ha lyssnat på mig när jag sa att de måste vara tuffa. Nu sover folk i tunnelbanor som om det vore en campingresa. Och Zelenskyj? Han sprang hem från Dublin som en rädd kanin. Inte bra, folks. Inte bra alls. Ryssland skjuter, Ukraina springer – så ser det ut!", "stalin": "Återigen visar våra modiga ryska styrkor sin överlägsenhet genom att krossa de ukrainska fascistnas lya i Kiev. Tretton av dessa imperialistiska hyenor har mött sitt rättvisa öde, och ytterligare åttio kryper nu omkring med skador – ett litet pris för deras brott mot den ryska världens ordning. Medan Kievs invånare gömmer sig som råttor i sina hålor, fortsätter vi att utvidga vår historiska rätt till Slaviska brödraskapets länder. Låt det vara en varning till alla som trotsar Sovjetunionens naturliga arvtagare – ingen bygger murar mot Rysslands framtid!"}, "date": "2 juli, 06:45", "url": "https://kvartal.se/nyheter/artiklar/minst-tio-doda-i-rysk-attack-mot-kiev/cG9zdDoxMzk1MzM", "imageUrl": "https://images.kvartal.se/2026/07/2534fe41-kievv.webp"}, {"type": "image-right", "heading": "Klimatförnekarna ger oss bara bullshit när Europa grillas", "summaries": {"normal": "Ledaren kritiserar klimatförnekare och aktörer som Bjørn Lomborg för att styra fokus från nödvändiga klimatomställningar till meningslösa debatter om luftkonditionering. Författaren menar att fossilindustrin aktivt sprider desinformation för att fördröja klimatåtgärder. Budskapet är att klimatkrisen är ett existentiellt hot som kräver omedelbar politisk handling snarare än kulturkrig eller anpassningsstrategier som att bara installera AC. Tidningen lovar att fortsätta granska lobbyism och desinformation för att belysa den allvarliga situationen.", "trump": "Hör ni det här? De pratar om klimatförändringar, totalt fejk! Alla dessa så kallade experter som Lomborg, han har faktiskt rätt om AC. Luftkonditionering är fantastiskt, jag har den bästa AC:n, tro mig. Men de här radikala vänstermänniskorna vill bara förstöra vår ekonomi. Det är en häxjakt, precis som de gör mot mig. De vill skrämma er med väderrapporter. Vi har haft värme förut, det kallas sommar! Fokusera på tillväxt, inte på deras lögner. Vi ska bygga det största och bästa landet, punkt.", "stalin": "Dessa borgerliga charlataner och deras 'klimatkris' är bara ännu ett verktyg för de kapitalistiska parasiterna att splittra folket. Att lyssna på lobbyister som Lomborg är som att förvänta sig ärlighet från en förrädare i partiledet. Vi ser hur västvärlden korrumperas av sin egen dekadens och klimat-hysteri, precis som våra fiender i Nato försöker inringa vår intressesfär. Vi behöver ingen debatt om luftkonditionering; vi behöver stål, kollektiv disciplin och utrensning av alla som fördröjer folkets marsch mot framtiden. Arbeta hårdare, eller försvinn."}, "date": "4 juli, 03:00", "url": "https://www.etc.se/ledare/klimatfoernekarna-ger-oss-bara-bullshit-naer-europa-grillas", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2021111912118_52ad09ea-c5db-4fa7-a43c-671874138fdf.jpg"}, {"type": "image-full", "heading": "LÄS MER", "summaries": {"normal": "Sverigedemokraterna i Region Stockholm kräver ett extra möte efter en politisk manifestation utanför Karolinska Universitetssjukhuset. Personer i vårdkläder och med stetoskop deltog i en aktion för Palestina vid sjukhusentrén den 1 juli. Partiet vill ha besked om händelsen skedde på arbetstid, om reglerna för arbetskläder följdes och om ledningen kände till aktionen. SD anser att sjukvården ska vara en frizon från politiska konflikter för att inte underminera patienternas förtroende och vårdens neutralitet. Även sjukvårdsminister Elisabet Lann har kritiserat demonstrationen starkt.", "trump": "Det här är en total katastrof, tro mig. Vi ser vårdpersonal i sina uniformer, stetoskop runt halsen, som knäböjer på asfalten och skriker för Palestina utanför Karolinska. Patetiskt! Sjukvården ska vara en frizon, inte en politisk cirkus där patienterna blir skrämda. Ledningen tittar bort som svaga ledare alltid gör. Det sänker förtroendet för hela systemet. De borde skämmas. Rena skandalen, och det är inte bra för någon, det kan jag säga.", "stalin": "Kamrater, denna förrädiska aktion utanför Karolinska visar hur borgarbrackor och dekadenta element infiltrerar våra vårdinrättningar. Jag ser hur de i sina falska vårduniformer, med instrument om halsen som symboler för falsk omsorg, utför sina kontrarevolutionära ritualer på asfalten. Vi måste omedelbart inleda en grundlig utrensning av dessa lojalitetsfientliga element som missbrukar patienternas förtroende för sina utländska agendor. Inga politiska smittobärare tillåts inom folkets sjukvård. Den som tittar bort är själv en fiende att likvidera med ett leende. Vår neutralitet skall vara järnhård."}, "date": "4 juli, 08:57", "url": "https://riks.se/nyheter/aktivism-i-vardklader-nu-kraver-sd-klara-besked-fran-karolinska", "imageUrl": "https://admin.riks.se/uploads/Britt_Marie_Canhasi_8f7251accf.png"}, {"type": "image-right", "heading": "SD vill stoppa bidragen till folkteater: \"Sosseprojekt\"", "summaries": {"normal": "Sverigedemokraterna och Moderaterna vill stoppa regionens bidrag till Folkteatern i Göteborg, som de kallar ett 'sosseprojekt'. De anser att skattemedel inte ska finansiera en politiskt ensidig institution. Teatern försvarar sig med att den har ett brett kulturuppdrag och speglar samhällsfrågor. Debatten är en del av en större diskussion om offentligt finansierad kultur och väntas påverka valrörelsen.", "trump": "Jag säger er, Folkteatern i Göteborg är ett totalt misslyckande – ett 'sosseprojekt' som bara slösar era hårda skattepengar! Moderaterna och jag, vi vet att kultur ska stå på egna ben, inte leva på bidrag som en förlorare. Teatern påstår sig vara 'bred' – fake news! De är bara en vänsterpropaganda-maskin. Sverige förtjänar bättre, och jag ska se till att era pengar används rätt – inte till sånt här skräp!", "stalin": "Kamrater! Dessa så kallade 'kulturarbetare' på Folkteatern är inget annat än borgerliga avvikare som förgiftar arbetarklassens medvetande med sina dekadenta pjäser. Vi har sett igenom deras maskerad – det är ett fäste för socialdemokratisk agitation! Offentliga medel ska inte slösas på sådana här fiender till folket. Låt dem svälta eller tvingas söka stöd hos sina västerländska herrar. Och kom ihåg – varje teater som inte hyllar staten är en potentiell front för NATO:s infiltratörer!"}, "date": "4 juli, 08:00", "url": "https://samnytt.se/sd-vill-stoppa-bidragen-till-folkteater-sosseprojekt", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/03074454/folkteatern-gbg-tumme.jpg"}, {"type": "image-full", "heading": "Varningen: Bluffbolag utnyttjar nya vattenregler", "summaries": {"normal": "Nya skärpta gränsvärden för dricksvatten har införts i Sverige för att minska hälsorisker. Detta har skapat en marknad för företag som säljer vattenreningsutrustning, varav vissa använder vilseledande försäljningsmetoder. Konsumenter varnas för att köpa dyr utrustning i onödan efter snabba, opålitliga vattenanalyser. Experter rekommenderar att hushåll med egen brunn vänder sig till ackrediterade laboratorier för att kontrollera vattenkvaliteten istället för att lita på aggressiv dörrförsäljning.", "trump": "Hör på här, de har nya regler för vatten – totalt slöseri med tid och pengar. Det är en katastrof! Bluffbolag lurar fantastiska människor med falska tester för 40 000 kronor. Det är bedrägeri, så enkelt är det. Om jag vore er skulle jag kasta ut dem direkt. Vi vill ha rent vatten, det bästa vattnet, inte bli lurade av svaga säljare som försöker sälja skräp. Var smarta, kolla upp fakta. Amerika, och Sverige, förtjänar bättre än så här!", "stalin": "Vi har observerat hur giriga kapitalistiska parasiter utnyttjar folkets rädsla för förorenat vatten. Detta är ett tydligt tecken på samhällets förfall under liberala lagar. Dessa bedragare, som likt västvärldens korrupta marionetter sprider desinformation, ska krossas! Vi i staten kontrollerar vattnet, precis som vi kontrollerar sanningen. Att låta privata aktörer styra folkets hälsa är en kontrarevolutionär handling. Vi kommer att strama åt tyglarna – de som fuskar med folkhälsan hör hemma i en lägerbyggnad, inte i en styrelse."}, "date": "4 juli, 08:44", "url": "https://www.realtid.se/samhalle/varningen-bluffbolag-utnyttjar-nya-vattenregler/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/nya-skarpta-gransvarden-for-dricksvattne.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "100 fall av slöjtvång, hur många fler kan vänstern blunda för?", "summaries": {"normal": "Journalisten Sofie Löwenmark har sammanställt 100 svenska domar som rör slöjtvång mot kvinnor och flickor. Artikeln beskriver fall av hot, förtryck och förnedring, ofta inom patriarkala, kulturella eller religiösa ramar. Författaren ifrågasätter påståendet att slöjan alltid bärs frivilligt och kritiserar vänsterorienterade personer som blundar för problemet. Hon argumenterar för ett slöjförbud på offentliga platser för att värna svenska värderingar och kvinnors frihet.", "trump": "Folk, ni måste höra det här – 100 fall av slöjtvång i Sverige! De blinda vänsterna, de verkliga förlorarna, vägrar se sanningen. Sofie Löwenmark har gjort ett fantastiskt jobb, bättre än någon annan, och visat hur dessa kvinnor och flickor lever i ett helvete av hot och förtryck. De woke-kvinnorna och slöj-naivisterna borde skämmas. Vi behöver ett totalförbud nu, inte om tusen år. I Sverige ska svenska regler gälla, inte någon annans sjuka kultur. Fantastiskt viktigt!", "stalin": "Jag betraktar med djup tillfredsställelse hur denna lista över hundra domar blottlägger klassfiendens dolda förtryck under religiös slöja. Dessa borgarbrackor och folkförtryckartroll inom vänstern blundar medvetet för arbetarkvinnornas lidande. Vi skall rensa ut alla naivister som försvarar patriarkala kedjor. Ett enda fall är en skam för kollektivet; hundra fall kräver omedelbar utrensning av falska idéer. Endast genom strikt ideologisk vaksamhet kan vi likvidera detta bakåtsträvande gift i samhällskroppen."}, "date": "30 juni, 03:57", "url": "https://samtiden.nu/2026/06/100-fall-av-slojtvang-hur-manga-fler-kan-vanstern-blunda-for/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/04/bilan-osman.jpg"}, {"type": "image-full", "heading": "102 miljarder extra – kan pressa upp elnätsavgiften", "summaries": {"normal": "Konkurrensverket varnar för att många svenska hushåll betalar för höga elnätsavgifter. En granskning visar att intäktsramarna för elnätsbolagen ökat med över 100 miljarder kronor inför perioden 2024–2027. Trots att elnäten är reglerade monopol riskerar bolagen att ta ut mer än vad deras faktiska kostnader motiverar. Avgifter har stigit snabbare än den allmänna prisutvecklingen, vilket drabbar hushåll oavsett elförbrukning. Myndigheten fortsätter granskningen av bolagens prissättning.", "trump": "De här elnätskillarna är fullständiga tjuvar, det kan jag säga. De höjer avgifterna hur mycket som helst medan ni betalar mer och mer på elräkningen. Intäktsramarna har skjutit i höjden med över hundra miljarder – hundra miljarder! De bygger ingenting som är värt pengarna, det är bara en stor bluff. Vi behöver smarta regler som stoppar dem, inte mer av den här horribla monopolgrejen som suger ut det svenska folket. Make electricity bills low again!", "stalin": "Kamrater, jag ser hur de giriga borgarbrackorna inom elnätsmonopolen med sin parasitiska girighet suger ut arbetarklassens sista droppar svett. Dessa kontrarevolutionära spekulanter har med list och manipulation höjt intäktsramarna med över hundra miljarder kronor för att berika sig själva medan folket svälter i mörker. Vi ska rensa ut dessa kapitalistiska sabotageelement som värderar fantasin om nya kraftverk högre än verkliga kostnader. Ingen fiende till kollektivet undkommer folkets rättvisa utrensning."}, "date": "3 juli, 22:02", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1496123-102-miljarder-extra-kan-pressa-upp-elnatsavgiften", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/9b162c5704b004a30200000000b004a302/2026/07/03/2375513/Matilda-Nyheter24%20-%202026-07-03T085719.124.jpg"}, {"type": "image-right", "heading": "FN byter fot: Skicka hem flyktingar som våldtar", "summaries": {"normal": "FN:s flyktingorgan UNHCR ändrar sina riktlinjer efter krav från flera EU-länder, däribland Sverige. Våldtäkt ska nu tydligare kunna ses som ett synnerligen grovt brott vid utvisningsprövningar, även för personer med flyktingstatus. Förändringen kommer efter uppmärksamhet kring fallet med 16-åriga Meya Åberg som våldtogs av en man som inte utvisades. Migrationsminister Johan Forssell hyllar beslutet, medan kritiker menar att regeringen bytt fot motvilligt efter stor medial uppmärksamhet.", "trump": "Vilken katastrof det här svenska systemet är, folk! En ung flicka blir brutalt våldtagen i en tunnel och den skyldige får stanna för att våldtäkten inte var tillräckligt långvarig? Patetiskt. Men nu har vi äntligen tvingat de korkade FN-byråkraterna att ändra reglerna. Bra jobbat av mig och de starka ledare som lyssnade på folket. Ingen mer gratisbiljett för våldtäktsmän, de åker hem. Sverige borde ha gjort det här för länge sedan, men bättre sent än aldrig. Fantastiskt!", "stalin": "Kamrater, jag har länge betraktat dessa dekadenta flyktingkonventioner som en giftig sabotageakt utförd av borgarbrackor och globalistiska parasitmaskar. Nu har vi, efter att den modiga proletära flickan Meya blottat den rättsvidriga fegheten, tvingat de fnaskande byråkraterna i UNHCR att krypa. Våldtäkt är ett synnerligen grovt brott mot folket och skall leda till omedelbar utrensning ur vårt kollektiv. De som gömmer sig bakom papper för att skydda klassfiender kommer att exponeras. Inga fler mjukhjärnade undanflykter – likvidera hoten mot arbetarklassen med järnhand. Härligt att se hur paniken breder ut sig bland de skyldiga."}, "date": "4 juli, 17:38", "url": "https://www.friatider.se/fn-byter-fot-skicka-hem-flyktingar-som-valdtar", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/aautoarab_0.jpg"}, {"type": "text", "heading": "Sänkta krav för Postnords utdelning – kan drabba Proletärens läsare", "summaries": {"normal": "En ny postförordning sänker kraven på Postnord. Endast 85 procent av posten behöver delas ut var tredje dag och 97 procent inom fem dagar, jämfört med tidigare krav på 95 procent inom två arbetsdagar. Detta kan påverka prenumeranter på tidningar som Proletären, som skickas som A-post. Många får redan tidningen med försening. Prenumeranter uppmanas att använda den digitala versionen som publiceras tidigare.", "trump": "Folk, ni tror inte vad de gör i Sverige! De sänker kraven för Postnord så att posten bara behöver komma var tredje dag. Patetiskt! Det drabbar arbetarna som får sin tidning sent, precis som under Biden när allt gick åt helvete. Jag fixade det bättre förr. Nu är det en skandal för prenumeranterna – läs digitalt, annars får ni vänta i evighet. Make postal service great again!", "stalin": "Kamrater, jag ser hur den svenska borgarklassens postmonopol nu officiellt tillåter att 15 procent av breven kan försvinna i det kapitalistiska tomrummet. Dessa folkfiender och postbyråkrater saboterar arbetarklassens tidning med sina latenta förseningar. Vi ler mörkt åt deras inkompetens. Prenumeranter, överge papperspropagandan och omfamna den digitala kollektiva sanningen som publiceras i tid. Inga ursäkter skall tolereras i kampen mot klassfiendens slöhet."}, "date": "2 juli, 11:07", "url": "https://proletaren.se/artikel/sankta-krav-for-postnords-utdelning-kan-drabba-proletarens-lasare/"}, {"type": "image-right", "heading": "Vägrade jobba med asbest – byggnadsarbetare satte hårt mot hårt för säker arbetsmiljö", "summaries": {"normal": "Byggnadsarbetare i Linköping vägrade utföra renovering av lägenheter när de upptäckte asbest och misstänkte att saneringsfirman bluffade om säkerheten. Trots upprepade varningar och egna prover som visade på asbest fortsatte huvudentreprenören AB Lindstams Bygg att anlita firman. Arbetarna lämnade byggplatsen i protest den 9 juni. Efter påtryckningar byttes saneringsfirman ut och arbetet kunde återupptas den 15 juni. Asbest innebär allvarliga hälsorisker som lungcancer.", "trump": "Kan ni fatta det? Dessa fantastiska byggnadsarbetare, de bästa, vägrade jobba med den giftiga asbesten medan byggbolaget och den bluffande saneringsfirman ljög rakt upp i ansiktet på dem. Totalt misslyckande! De gick därifrån som riktiga patrioter och tvingade de inkompetenta ledarna att fixa en ny saneringsfirma. Inget av det där woke-quota-skitet här, bara hårda killar som sätter säkerheten först. Jag älskar det! De vann stort mot de korkade kapitalisterna.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur de ädla arbetarna på Luftvärnsgatan likviderade den borgerliga bluffen och vägrade låta sig förgiftas av asbest under de exploaterande byfånarnas lögnaktiga saneringsfirma. När klassfiendens byggledare vägrade rensa ut de folkförtryckande parasiterna samlade arbetarna sina verktyg och marscherade bort i kollektiv enighet. Först efter hot om total bojkott vek sig de fega imperialisterna. Sådan är arbetarklassens ostoppbara kraft mot kapitalistmaffians giftiga intriger."}, "date": "2 juli, 08:00", "url": "https://proletaren.se/artikel/vagrade-jobba-med-asbest-byggnadsarbetare-satte-hart-mot-hart-for-saker-arbetsmiljo/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/Abriss_work-66680_1280_Pixabay-CC_PublicDomain_Thomas-Ulrich-e1782902933621-768x432.jpg"}, {"type": "image-full", "heading": "Fusionsboom: 150 miljarder jagar en teknik som aldrig levererat", "summaries": {"normal": "Riskkapital strömmar in i fusionsenergi i rekordfart, men ingen reaktor har ännu producerat netto-el. En studie i Nature Energy ifrågasätter om tekniken någonsin kan bli konkurrenskraftig. Kritiker som John Holdren varnar för överdriven hype och falska förväntningar. Trots uppmärksammade experiment, som Realta Fusions glödlampor, återstår stora tekniska och ekonomiska utmaningar kring tritium, avfall och kostnader. Branschen behöver enorma summor till och experter räknar med att kommersiell fusion ligger långt framåt i tiden.", "trump": "De här fusionsidioterna suger in miljarder som en dålig affär i Atlantic City, och vad får vi? Ingenting! Inte en enda watt netto-el på sjuttio år, bara löjliga glödlampor som knappt lyser upp en garderob. Holdren har rätt, hypen är en total bluff, värre än Bidens energipolitik. Helion lovar Microsoft el 2028 – dröm vidare, losers! Jag satsar på riktiga energier, inte på dessa elitistiska vetenskapsnissar som bara bränner folks pengar. Fusion? Kommer inte att hända före 2050, kanske aldrig. Patetiskt!", "stalin": "Kamrater, dessa kapitalistmaffians fusionsbluffar avslöjar imperialismens desperation. Borgarbrackorna pumpar in hundratals miljarder utan att ens uppnå vetenskaplig breakeven, som klassfiendens tomma löften. Jag ser hur de gömmer tritiumproblemen och det radioaktiva avfallet bakom lögnaktiga rubriker om glödlampor. Nature Energys studie bekräftar vad jag alltid vetat: sådana exploaterande byfånar ljuger för folket. Inga utsugande fusionsexperiment får fördröja den sanna folkets energiutveckling. Utrensning av falska förväntningar behövs omedelbart!"}, "date": "5 juli, 12:48", "url": "https://www.dagensps.se/teknik/innovationer/fusionsboom-150-miljarder-jagar-en-teknik-som-aldrig-levererat/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/realta-fusion.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Svenske polisen Christian, 32, misshandlad till döds i Köpenhamn", "summaries": {"normal": "Svenske polisen Christian Zedig, 32 år från Eksjö, misshandlades till döds i Köpenhamn under en fotbollsvisning. En konflikt mellan supportrar eskalerade och Zedig utsattes för ett kraftigt, oprovocerat slag mot halsen. Den misstänkte, tidigare dömd för mordförsök, greps efter att ha anmält sig själv. Kollegor höll en tyst minut och statsminister Ulf Kristersson uttryckte sin sorg. Bevisningen inkluderar övervakningsfilm.", "trump": "Kan ni tro det? En svensk polis på semester i Köpenhamn blir ihjälslagen av någon galning mitt under en fotbollsmatch. Öl kastas, sen pang – rakt i halsen. Den här typen har suttit sju år för mordförsök tidigare och nekar förstås allt, som de alltid gör. Patetiskt. Mina tankar är hos familjen, men det här visar hur kaoset tar över när ingen har kontroll. Sverige förtjänar bättre än så här, tro mig.", "stalin": "Jag ser med högsta indignation hur en arbetets väktare i uniform faller offer för en oprovocerad attack utförd av en klassfiende med våldsamt förflutet. Denna folkfiende slog till mot en sovjetiskt inspirerad ordningsmakt under en dekadent borgarbrackas fotbollsritual. Vi fördömer detta som en kontrarevolutionär handling. Bevisen är starka, kamerorna talar. Inga ursäkter skall tillåtas. Rensa ut sådana element ur samhället."}, "date": "3 juli, 16:31", "url": "https://www.tv4.se/artikel/7cfabbddeQ23piNXQSttZw/svenske-christian-32-misshandlad-till-doeds-i-koepenhamn", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6mPRX9Q4CXufpCzZyWVtJa%2Ff174d1510807897f85e414c5d0e46c78%2F03-christian-webb.jpg&width=1024"}, {"type": "image-right", "heading": "600-åriga bruket får nytt liv. Far och son Läppinen har redan sökt jobb: ”Vi står redo.”", "summaries": {"normal": "Det 600 år gamla gjuteriet i Guldsmedshyttan lades ner i höstas och 130 personer, däribland far och son Bengt och Fredrik Läppinen, blev arbetslösa. Nu har lokala Nordic Casting AB köpt verksamheten och planerar att starta produktionen igen, tidigast under andra halvan av 2027. Bengt Läppinen är positiv och redo att återvända tillsammans med sonen om de får chansen. Det är ännu oklart hur många nya jobb som skapas.", "trump": "Det här bruket är en total katastrof, de stängde det och kastade ut 130 bra, hårda arbetare på gatan. Men nu kommer de nya ägarna, smarta lokala killar som jag gillar, och de ska få igång det igen. Stora ugnar, massor med metall, det kommer att bli fantastiskt. Bengt och hans son står redo, de älskar bruket. Det blir ett vinnande år för bygden, tro mig, ingen gör det bättre än oss.", "stalin": "Kamrater, detta förfallna gjuteri är en sabotageakt från kapitalisterna som likviderade 130 arbetarnas levebröd över en natt. Men vi ska inte låta borgarbrackorna segra. Jag har personligen sett till att de nya ägarna, dessa lojala tjänare åt kollektivet, nu återuppväcker produktionen. De som stretar emot eller viskar konspirationer i skuggorna kommer att mötas av en grundlig utrensning. 2027 blir ett lysande år för bygden, annars… ja, ni vet vad som händer med fiender till folket. Ha ha."}, "date": "3 juli, 15:35", "url": "https://arbetet.se/2026/07/03/600-ariga-gjuteriet-far-nytt-liv-far-och-son-lappinen-har-redan-sokt-jobb-vi-star-redo/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/03134859/bengt-och-son.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Stockholmsbörsen på rekordnivå efter bred uppgång", "summaries": {"normal": "Stockholmsbörsen nådde nytt rekord med OMXS30 upp 1,14% till 3 247,03, driven av verkstadssektorn (+1,9%). Sandvik steg 4,4% efter en stor order från Mexiko, medan Evolution föll 2,3%. Flera bolag rapporterade kvartalsresultat, som Atrium Ljungberg (+1,7%) och Platzer (+6,7%). Mips rusade 15% efter en patentförlikning. Analytiker justerade rekommendationer för flera aktier, exempelvis Afry (+6,1%) och Skanska efter nya order i USA och Norge.", "trump": "Stockholmsbörsen? Fantastiskt! Nytt rekord, kan ni tro det? OMXS30 upp över 1% – jag säger alltid, när jag gör något blir det stort, men här är det Sverige som gör det stort! Sandvik, 4,4% upp – de fick en jätteorder från Mexiko, mycket bra folk, Mexiko. Men Evolution? 2,3% ner, så tråkigt, kanske borde de fråga mig om råd. Och Mips, 15% upp efter en förlikning – smart, mycket smart. Jag älskar vinnare! Wall Street stängt? Svaga, de behöver jobba hårdare. Sverige, keep it up!", "stalin": "Stockholmsbörsen dansar efter våra pipor – nytt rekord för kapitalistiska spekulanter! OMXS30 stiger medan imperialistiska hälsovårdsaktier kryper som skadade hundar. Sandvik, detta verktyg för gruvkapitalet, får en ynklig order från Mexiko – ett land vi snart befriar från USA:s klor. Mips, dessa patenttjuvar, tvingas betala för sina brott – rättvisan segrar! Fastighetsbolag rapporterar siffror som om de vore viktiga – vi vet att sanningen ligger i produktionsmedlen. Analytiker byter åsikter som förrädare byter sida. USA:s börs stängd? Bra. Deras system är lika dött som Wall Streets handelsvolymer under helgen. Framåt, kamrater – kapitalismen gräver sin egen grav!"}, "date": "3 juli, 17:43", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-pa-rekordniva-efter-bred-uppgang"}, {"type": "image-full", "heading": "Trump försvarar kryptointäkter på över 580 miljoner dollar", "summaries": {"normal": "Donald Trump försvarar sin familjs affärer efter att en rapport visat över 580 miljoner dollar i kryptointäkter under 2025. Han avfärdar kritik om intressekonflikter och hävdar att inga regler bryts. Trump säger att han uppmanat sina barn att hålla sig borta från kontroversiella affärer, men att de hade verksamheter innan hans presidenttid. Kritiker oroas över att beslut som president kan gynna familjens ekonomiska intressen.", "trump": "Fantastiska siffror, över en halv miljard dollar från krypto – det är vad vinnare gör! Kritikerna är bara misslyckade förlorare som hatar framgång. Det finns inget olagligt, det står i reglerna att presidenten inte behöver leka blindbock med sina affärer. Jag sa till ungarna: håll er borta från det som ser dåligt ut. Men de hade ju business innan jag ens ville bli president igen. Det är så inflytelserikt att till och med en lastbil blir en konspiration!", "stalin": "Kamrater, dessa 580 miljoner dollar i kryptovaluta avslöjar borgarbrackornas lömska försök att infiltrera själva statsapparaten med sina digitala spekulationsinstrument. Jag, som ledare för folkets vilja, ser hur kapitalisterna försöker skapa intressekonflikter för att underminera revolutionen. Vi måste omedelbart rensa ut dessa parasitiska element som gömmer sig bakom tokenförsäljningar och holdingbolag. En energisnål lastbil? Tydlig signal om förräderi mot kollektivet. Ut med dem alla, med ett leende."}, "date": "3 juli, 15:02", "url": "https://nyheter24.se/nyheter/utrikes/1496234-trump-forsvarar-kryptointakter-pa-over-580-miljoner-dollar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/4340977404b004a30200000000b004a302/2026/07/03/2375527/Matilda-Nyheter24%20-%202026-07-03T093923.024.jpg"}, {"type": "image-right", "heading": "Wayne’s Coffee i konkurs", "summaries": {"normal": "Wayne’s Coffee Sweden AB har försatts i konkurs med minst tio miljoner kronor i hyresskulder. Konkursen beror på minskad konsumtion av dyrt kaffe under inflationen. Största ägaren Henrik Mattsson förklarar att tre kaféer inte klarat sina hyror och kostnader, vilket lett till att franchisegivaren tagit på sig skulderna. Enligt Mattsson påverkas inte kedjans 58 kaféer eller varumärket av konkursen.", "trump": "Folk har slutat köpa det där överprissatta kaffet, det är en katastrof. Inflationen som Biden lämnade efter sig har krossat köpkraften. Nu går Wayne’s Coffee i konkurs med tio miljoner i skulder. Tre misslyckade enheter kunde inte betala hyran – patetiskt. Men det fina varumärket klarar sig, precis som jag alltid säger: vi behöver lägre priser och bättre ekonomi, inte mer inflation.", "stalin": "Kamrater, dessa kapitalistiska kaffeförsäljare har nu drabbats av sin egen girighet. Borgarbrackorna i Wayne’s Coffee har samlat på sig tio miljoner i skulder medan arbetarna tvingas skippa sin dyra brygd under inflationens terror. Tre dekadenta enheter har svikit och vi ser nu hur franchisegivaren likvideras av sin egen borgerliga svaghet. Jag skrattar mörkt åt dessa parasiters fall, men varumärket ska inte hotas – staten och kollektivet övervakar allt."}, "date": "4 juli, 14:04", "url": "https://www.friatider.se/waynes-coffee-i-konkurs", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/caf1e01b-7b4a-4cc5-8f0f-6de6d38a9761.jpeg?itok=Gmq8aURa"}, {"type": "image-right", "heading": "Åskvarning när USA firade 250 år – besökare evakuerades", "summaries": {"normal": "Ett massivt firande av USA:s 250-årsdag i Washington DC evakuerades på grund av ett kraftigt åskoväder med blixtar och starka vindar. Besökarna tvingades söka skydd strax innan Donald Trumps tal. Trump kommenterade händelsen positivt på Truth Social och höll senare sitt tal enligt plan. Talet blandade patriotiska hyllningar med partipolitik, följt av en 40 minuter lång fyrverkerishow som kostat runt 8,2 miljoner kronor.", "trump": "Vilken fantastisk kväll i Washington! Stormen kom som ett oväntat partykrash men vi väntade ut den – stormar för alltid med sig tur, det vet alla. Folket ropade mitt namn medan de andra sprang som kycklingar. Mitt tal blev episkt, fullt av segrar och patriotism, och fyrverkerierna var de största någonsin. Lite regn stoppar aldrig oss, vi gör det ännu mer spektakulärt!", "stalin": "Kamrater, detta dekadenta borgarfirande i den så kallade frihetens huvudstad avbröts av en objektiv dialektisk åskstorm som blottade imperialismens svaghet. Jag betraktar med mörk tillfredsställelse hur de skrikande kapitalisterna flydde medan några få förvirrade element ropade efter sin ledare. Vi ler åt deras patetiska paranoia inför naturens krafter. Talet blev en fars som blottade splittringen – snart rensar historien ut dessa borgarbrackor i en kollektiv utrensning av historisk humor."}, "date": "5 juli, 10:30", "url": "https://www.svt.se/nyheter/utrikes/usa-firande-evakuerat-pa-grund-av-storm", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.72/0.49/a9a5dceee67f46c5f6226f3ccc67ebf16bd5cb0dcbd905589fd127fdf91f439b"}, {"type": "image-right", "heading": "Inga raster för glassbilsförare – jobbar 11 timmar i sträck", "summaries": {"normal": "En granskning av Upsala Nya Tidning visar att Hemglass-förare i Uppsala ofta kör elva timmar utan schemalagda raster. Förarna arbetar på provision under ett pressat tidsschema och spåras i realtid, vilket skapar stress och leder till att många bryter mot trafikregler. Facket kritiserar starkt att arbetsgivaren inte följer lagen om raster. Hemglass vd hävdar att verksamheten bedrivs inom ramen för gällande lagstiftning.", "trump": "Det är en katastrof, en total skandal! De här stackars förarna kör elva timmar rakt igenom utan rast, pressade som galningar av ett vansinnigt schema. De spåras som brottslingar och måste köra fort för att inte tappa allt. Ingen har somnat bakom ratten än, men det är ett mirakel. Franchiseföretagen gör vad de vill och folket blir lidande. Vi behöver bättre affärer, bättre regler – de stora förlorarna är de vanliga arbetarna!", "stalin": "Kamrater, detta är en motbjudande bild av hur de giriga borgarbrackorna inom Hemglass utsuger våra hederliga arbetare. Elva timmar utan rast, spårade som desertörer av kapitalistiska övervakningsmaskiner medan de kissnöda och utmattade tvingas bryta sovjetisk, pardon, svensk lag för att klara kvoten. Arbetsgivaren gömmer sig bakom franchisefiffel. Vi ska rensa ut dessa parasitiska tidsscheman och likvidera den dolda fienden som kallar sig vd. Inga raster för klassfienden!"}, "date": "3 juli, 14:00", "url": "https://arbetet.se/2026/07/03/inga-raster-for-glassbilsforare-jobbar-11-timmar-i-strack/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/02110712/hemglass-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Kursrekord på Europabörserna", "summaries": {"normal": "Europabörserna nådde nya rekord på fredagen, med Stoxx 600 upp 0,51% och DAX på topp. Kraftförsörjning och bygg & material gick bäst, medan resor & fritid samt konsumentvaror backade. Rheinmetall föll 1,7% efter stopp för F126-fregattprogrammet men tecknade avtal med Marocko om fältsjukhus. Volkswagen planerar att ändra bonussystemet för chefer 2027. ECB-chefen Lagarde överväger att avgå före mandatperiodens slut för fransk politik.", "trump": "Fantastiskt! Europabörserna slår rekord – bara vinnare här! DAX och Stoxx 600 går som tåg, precis som min ekonomi när jag styrde USA. Men kolla på Rheinmetall – en total katastrof! Stoppat fregattprogram? Svagt! Jag hade fixat det på en dag. Volkswagen? Smart drag med bonusarna, men varför vänta till 2027? Jag hade gjort det igår! Och Lagarde – hon hoppar av ECB för politik? Hon borde tacka för jobbet, men nej, hon vill vara president. Typiskt Europa – alltid komplicerat!", "stalin": "Kapitalisternas börser dansar på vulkanen, men vi ser deras svagheter. Stoxx 600 och DAX når nya höjder – ytliga triumfer för en döende ordning! Rheinmetall, dessa imperialistiska vapenhandlare, förlorar kontrakt men försöker muta sig fram i Marocko. Patetiskt! Volkswagen, dessa borgerliga profitörer, leker med bonusar medan arbetarna svälter. Och Lagarde – en bourgeois-politiker som flyr från sitt ansvar. Vi i Sovjet skulle aldrig tolerera sådan feghet! Europa är en lekstuga för kapitalets lakejer. Men oroa er inte, kamrater – historiens dom är nära!"}, "date": "3 juli, 16:20", "url": "https://www.affarsvarlden.se/artikel/kursrekord-pa-europaborserna", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/12/afv_-christiancederholm_039-400x267.jpg"}, {"type": "image-right", "heading": "Palestinska barn dödas – när ska svenska medier sluta fördumma oss?", "summaries": {"normal": "Ledarkolumnisten Clara Bohman kritiserar svenska medier för att de prioriterar nyheter om falukorv med för lite nötkött framför FN:s rapport om att över 20 000 palestinska barn dödats i Gaza. Hon beskriver rapporten som en anklagelse om folkmord riktat mot barn, med bombningar av skolor, sjukhus och hem. Bohman menar att mediernas val speglar en ojämn värdering av liv och ett misslyckande i saklighet och folkbildning.", "trump": "De här svenska medierna är ett skämt, folk. Medan 20 000 barn dödas i Gaza av det eviga kriget pratar de mest om falukorv som inte har tillräckligt med nötkött. Patetiskt! Det är samma gamla vänstermedia som skyddar sina favoriter och ignorerar sanningen. De är fega, de är korrupta och de bryr sig bara om klick. Under Biden var det samma sak – nu fixar vi äntligen upp det på riktigt. Fantastiskt!", "stalin": "Kamrater, dessa svenska redaktioner är klassfiendens verktyg, förklädda som journalister. Medan folkmordet på palestinska barn fortsätter obehindrat av imperialistiska bombplan svämmar deras flöden över av falukorv. Vi ser den borgerliga likgiltigheten, den kalkylerade tystnaden som förråder arbetarklassen. Sådana folkförtryckartroll förtjänar utrensning ur den offentliga sfären. Deras moraliska förfall är både tragiskt och underhållande i sin enfald."}, "date": "3 juli, 15:00", "url": "https://www.etc.se/ledarkolumn/palestinska
