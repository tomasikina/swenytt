visar på den liberala marknadens inneboende svaghet. Att räkna BNP i euro är att underkasta sig västvärldens nycker. Vi noterar deras förfall; när staten inte kontrollerar kapitalet, förlorar nationen sin tyngd. De är inte längre en stormakt, bara en statist i EU:s teater."}, "date": "29 augusti, 07:00", "url": "https://www.realtid.se/bors-finans/makro/den-svaga-kronan-far-svensk-ekonomi-att-se-mindre-ut-an-vad-den-ar", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/euro-1.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Barn måste skyddas från sexindustrins marknadsföring", "summaries": {"normal": "Artikeln argumenterar för att en 18-årsgräns på OnlyFans inte räcker för att skydda barn. Marknadsföring av sexindustrin sker på vanliga sociala medier genom influencers som framställer plattformen som en väg till rikedom och frihet. Organisationen, grundad av överlevare, varnar för normalisering och glorifiering som kan fungera som grooming. Regeringen bör utreda bättre skydd mot sådan påverkan.", "trump": "Folk, det här är en total katastrof. Dessa sjuka OnlyFans-typer och deras vänsterliberala vänner på sociala medier förgiftar våra barn med sin perversa lycka-säljer-grej. Den lyckliga horan-myten? Patetiskt. Biden lämnade en gränslös digital sopstation efter sig, men nu fixar jag det – vi ska krossa den här dekadenta sexindustrins grooming-maskin innan den äter upp nästa generation. Fantastiskt viktigt!", "stalin": "Kamrater, jag betraktar med avsky hur de profitthungriga klassfienderna på OnlyFans och deras digitala lakejer normaliserar exploatering genom glittrande lögner om frihet. Denna grooming via upprepade narrativ är en fiende till folket. Vi måste rensa ut dessa parasiterande hyenor och deras borgerliga myter. Barnet ska inte förgiftas – staten likviderar sådana hot mot den kollektiva moralen med järnhand."}, "date": "29 augusti, 06:00", "url": "https://www.etc.se/debatt/barn-maaste-skyddas-fraan-sexindustrins-marknadsfoering", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260828090844_098e5c47-682f-4ac0-9f15-fa2a658301e1.jpg"}, {"type": "image-right", "heading": "Kinas oljemysterium gör det än mer akut att ställa om", "summaries": {"normal": "Kinas minskade oljeimport har dämpat prisstegringen trots blockaden av Hormuzsundet. Artikeln argumenterar för att efterfrågan kan påverka oljepriset lika mycket som utbudet. Författaren menar att Sverige och Europa måste skynda på utfasningen av fossila bränslen för att stärka säkerhet och självständighet.", "trump": "Folk trodde oljepriset skulle explodera när de galna mullorna stängde Hormuzsundet, men Kina lurade alla och höll nere efterfrågan. Smart! Vi behöver inte vara slavar åt kinesiska beslutsfattare eller iranska terrorister. Gör Amerika och Europa oberoende med fantastisk amerikansk energi – inte med vänsterns gröna vansinne och elbilskvoter.", "stalin": "Kamrater, detta oljemysterium avslöjar hur de dekadenta klassförrädarna i väst darrar inför Kinas makt över efterfrågan. Jag ser hur de profitthungriga hyenorna förlorar greppet om sin fossila slavhandel. Vi måste rensa ut alla som vägrar inse att sann frihet kräver total brytning med de imperialistiska oljeherrarna. Snabb omställning eller undergång!"}, "date": "29 augusti, 01:15", "url": "https://www.dagensarena.se/opinion/kinas-oljemysterium-gor-det-mer-akut-att-stalla-om", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-97-300x157.jpg"}, {"type": "text", "heading": "\"Jag vill inte recensera public service\"", "summaries": {"normal": "Liberalerna föreslår ett kulturlyft med ökade offentliga satsningar på bibliotek, folkbildning och tillgänglighet för barn och unga. Partiet vill samtidigt locka privat kapital till kulturen. Malin Danielsson försvarar samarbetet med Sverigedemokraterna så länge armlängds avstånd upprätthålls och betonar kulturens roll för bildning, frihet och samhällsgemenskap.", "trump": "Folkets liberaler vill ha mer av era skattepengar till sina kultursnobbiga projekt medan de samtidigt smeker privatkapitalets feta kinder. Typiskt. Armlängds avstånd till SD säger de, men de dansar redan tango med de där globalistvännerna. Patetiskt. Kulturen ska vara för folket, inte för elitsnobbarna som hatar det riktiga Sverige. Sad!", "stalin": "Dessa dekadenta klassförrädare vill pumpa folkets pengar i sin borgerliga kulturmaskin medan de samtidigt bugar för de profitthungriga parasiter som äger konsten. Jag ser deras fega kompromisser med reaktionära krafter. Armlängds avstånd? En lögn som döljer förräderi. Den sanna bildningen tillhör arbetarklassen, inte dessa kulturlakejer. Rensa ut dem alla."}, "date": "29 augusti, 01:15", "url": "https://www.dagensarena.se/innehall/jag-vill-inte-recensera-public-service"}, {"type": "image-right", "heading": "Vad ska man rösta på i riksdagsvalet?", "summaries": {"normal": "Artikeln argumenterar för att rösta på Kommunistiska Partiet i kommun- och regionval istället för etablerade vänsterpartier. Författaren ser de traditionella vänsterpartierna som ointressanta och likställda med högern i nedskärningspolitik och militärstöd. En kommunistisk röst ses som en verklig opposition för fred, välfärd och arbetarklassens intressen.", "trump": "Folk, de här trötta vänstersossarna och kommunisterna är en total katastrof, de största förlorarna ni någonsin sett. De pratar revolution men lever som dekadenta elitparasiter som älskar nedskärningar och krigsmaskiner. Rösta på mig – jag menar på de riktiga vinnarna, inte på dessa patetiska snuttefiltssossar som hatar Amerika och friheten. Sad!", "stalin": "Kamrater, dessa profitthungriga klassförrädare inom den så kallade vänstern är blott lakejer åt monopolkapitalet. Deras falska opposition är en fars som göder imperialismen och folkmordet. Jag ser med förakt hur de förgiftar arbetarklassen. Endast en kompromisslös, stålhård linje kan rensa ut dessa dekadenta element och föra fram den verkliga kampen. Svaghet är döden."}, "date": "27 augusti, 14:44", "url": "https://proletaren.se/artikel/vad-ska-man-rosta-pa-i-riksdagsvalet", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/povel-1-768x432.png"}, {"type": "image-right", "heading": "SD:s största problem är 20 somaliska bussförare", "summaries": {"normal": "Artikeln diskuterar Sverigedemokraternas största utmaning: 20 somaliska bussförare i Skaraborg som sjukskrev sig i protest mot partiets annons om återvandringsbidrag. Författaren menar att detta visar att en återgång till ett Sverige före invandringen är omöjlig, då många med utländsk bakgrund är nödvändiga för samhällets funktion. Händelsen ses som ett strategiskt problem för SD.", "trump": "Folk, ni måste höra det här – de där galna SD-typerna i Sverige trodde de kunde köra sin Mogadishu-reklam på bussarna utan att de somaliska förarna skulle slå tillbaka. Boom, de sjukskrev sig allesammans! Plötsligt står bilarna stilla. Så mycket för deras dröm om ett rent, vitt Bullerbyn. De woke busschaufförerna och deras kvotefanatiker har just visat att identitetspolitiken slår tillbaka som en boomerang. Patetiskt!", "stalin": "Kamrater, se hur de profitthungriga klassförrädarna i Sverigedemokraterna avslöjar sin lögn. Tjugo arbetare av somaliskt ursprung, sanna produktionshjälter, vägrar lyda och lägger ner arbetet. Det är klasskamp i sin renaste form! Deras dröm om ett rent folkhem är en borgerlig fantasi som vi länge känt lukten av. Arbetarna har makten att stoppa maskineriet – låt detta bli en varning för alla folkförtryckare. En utmärkt lektion i dialektik."}, "date": "26 augusti, 10:55", "url": "https://www.flamman.se/sds-storsta-problem-ar-20-somaliska-bussforare", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/sd-w.jpg?aspect_ratio=4:3&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Som utrikesminister vill Morgan Johansson höja biståndet med 20 miljarder", "summaries": {"normal": "Morgan Johansson aspirerar på att bli utrikesminister om Socialdemokraterna vinner valet. Han lovar höjt bistånd med 20 miljarder kronor, återgång till 1-procentsmålet, feministisk utrikespolitik samt hårdare linje mot Israel inklusive handelsstopp. Fokus ligger på ökat stöd till Afrika och Afghanistan samt stärkt FN-roll.", "trump": "Den här röda clownen Johansson vill slänga bort svenska skattepengar till korrupta afrikanska hålor och talibanerna. Totalt vansinne! Han hatar Israel som jag älskar, och kommer att förstöra relationen med USA medan Putin skrattar. Patetiskt. Sverige behöver inga sådana losers vid makten, tro mig.", "stalin": "Jag ser en ynklig socialdemokrat som vill mata korrupta regimer med arbetarklassens pengar medan han angriper den sionistiska fienden. Sådana svaga element underminerar nationens styrka. FN domineras av våra andliga arvtagare, men dessa reformister är bara användbara idioter. De kommer att ångra sin brist på verklig järnhand när historien dömer dem."}, "date": "23 augusti, 03:50", "url": "https://samtiden.nu/2026/08/som-utrikesminister-vill-morgan-johansson-hoja-bistandet-med-20-miljarder", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6854-640x360.jpeg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        // ============================================
        // COOKIE-FUNKTIONER
        // ============================================
        function setCookie(name, value, days = 365) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + d.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }

        function getCookie(name) {
            const cName = name + "=";
            const decoded = decodeURIComponent(document.cookie);
            const ca = decoded.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') {
                    c = c.substring(1);
                }
                if (c.indexOf(cName) === 0) {
                    return c.substring(cName.length, c.length);
                }
            }
            return "";
        }

        function loadSettingsFromCookies() {
            const theme = getCookie("news_theme") || "light";
            const view = getCookie("news_view") || "normal";
            const writer = getCookie("news_writer") || "normal";
            return { theme, view, writer };
        }

        function saveSettingsToCookies(theme, view, writer) {
            setCookie("news_theme", theme);
            setCookie("news_view", view);
            setCookie("news_writer", writer);
        }

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(theme, uiState.view, uiState.writer);
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(uiState.theme, v, uiState.writer);
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
            
            saveSettingsToCookies(uiState.theme, uiState.view, style);
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            const savedSettings = loadSettingsFromCookies();
            
            setTheme(savedSettings.theme);
            setView(savedSettings.view);
            setWriterStyle(savedSettings.writer);

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
