Cx0%2Cy400&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Vallokalerna som kan ha felregistrerat förtidsröster", "summaries": {"normal": "Valmyndigheten har presenterat en lista över vallokaler där förtidsröster kan ha felregistrerats, vilket kan ha drabbat upp till 500 röster. Felet gjorde att vissa röster hamnade på fel röstlängdsnummer. Drabbade väljare uppmanas att rösta på nytt på valdagen, men varnas för att förtidsrösta igen då det gör alla röster ogiltiga.", "trump": "Svenska valet är ett absolut skämt! De tappar bort röster, totalt inkompetent, slarvigt och sorgligt. Först ljög de om 4 000 röster, nu är det plötsligt 500. Fake news! I mitt Amerika fungerar sånt här perfekt, vi räknar snabbt och rent. Om du drabbats, gå dit och fixa det, men gör det på rätt sätt. Trist för dem!", "stalin": "Ett katastrofalt systemfel där väljarnas röster registreras felaktigt och försvinner i byråkratins mörka hörn visar på total inkompetens. Vi har beordrat en grundlig revision av de ansvariga tjänstemännen. Medborgare vilkas röster gått förlorade ges en sista nådig chans att rätta till sin lojalitet på söndag. Svek tolereras ej."}, "date": "11 september, 15:45", "url": "https://samnytt.se/har-ar-vallokalerna-som-kan-ha-felregistrerat-fortidsroster-kolla-om-du-ar-drabbad", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=318,height=184,format=webp/2026/09/11133833/vallokal-valsedlar-1.jpg"}, {"type": "image-full", "heading": "KD anmäler Sveriges Radio", "summaries": {"normal": "Kristdemokraterna anmäler Sveriges Radio till Granskningsnämnden efter en partiledarutfrågning av Ebba Busch. KD menar att SR använde felaktig och ojusterad statistik om vårdköerna, vilket gav en missvisande bild och kan ha påverkat valrörelsen. SR har ännu inte svarat på begäran om rättelse.", "trump": "Falska nyheter! Sveriges Radio sprider totalt inkompetenta och falska siffror om sjukvården för att lura folket, precis som de radikala vänstermedia gör i USA. Ebba Busch har helt rätt, det här är en katastrof för trovärdigheten! De försöker rigga valet med fejkad statistik. Sorgligt!", "stalin": "Statsradions skadliga agitation om vårdens köer visar på ideologisk undergrävsverksamhet. Att sprida felaktig statistik är ett sabotage mot folkets tilltro till förvaltningen. Vi har begärt en rättelse från redaktionen, men om de inte hörsammar detta frivilligt, vet vi hur man hanterar illojala element som sprider lögner om statens tillstånd."}, "date": "11 september, 13:16", "url": "https://kvartal.se/nyheter/artiklar/kd-anmaler-sveriges-radio-efter-utfragning-av-busch/cG9zdDoxOTA3ODE", "imageUrl": "https://images.kvartal.se/2026/09/9ecdc4b3-ebba-busch.webp"}, {"type": "image-right", "heading": "Oron i området efter överfallet: ”Obehagligt”", "summaries": {"normal": "Polisen i Järfälla utreder en grov våldtäkt mot barn efter ett överfall i Högbyområdet på torsdagen. Gärningsmannen är inte gripen, vilket har väckt stor oro bland de boende i det annars lugna området. Kommunen uppmanar föräldrar att följa sina barn till skolan, och polisen prioriterar ärendet högt i hela regionen.", "trump": "Polisen i Järfälla har misslyckats med att gripa en sjuk människa efter ett fruktansvärt överfall på ett barn i ett normalt villaområde. Total katastrof! Nu måste föräldrar följa sina barn till skolan – så ska vi inte behöva ha det. Polisen säger att det är högsta prioritet, men jag säger att de måste agera snabbt och få fast monstret omedelbart!", "stalin": "Ett brott mot ett barn i Järfälla visar på totalt förfall hos dem som inte kontrollerar sina medborgare. Polisen misslyckas och invånarna går runt med skräck i magen. Staten kräver ordning! Vi beordrar att myndigheterna omedelbart rensar upp i dessa grönområden. Den skyldige ska hittas, för i ett disciplinerat samhälle tolereras inte dylikt kaos. Ingen kommer undan våra resurser."}, "date": "11 september, 16:06", "url": "https://www.expressen.se/nyheter/sverige/oron-i-omradet-efter-overfallet-valdigt-obehagligt", "imageUrl": "https://static.bonniernews.se/ba/95c7a2ae-9649-4813-adb2-f7cb8ad6f1db.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "ANALYS. FREDRIK BJÖRKMAN Kan Moderaterna stänga av kranen till Liberalerna?", "summaries": {"normal": "Moderaterna försöker minska stödrösterna till Liberalerna som närmar sig fyraprocentspärren. Analysen pekar på att både Jimmie Åkesson och Gunnar Strömmer oavsiktligt har hjälpt Liberalerna. Muf har uppmanat att rösta på Moderaterna istället. Frågan är om det är för sent och hur det påverkar regeringsförhandlingarna om SD blir störst.", "trump": "De här svenska förlorarna i Moderaterna är patetiska. De försöker stänga kranen till de svaga Liberalerna som jag skulle ha krossat för länge sedan. Åkesson gör ett fantastiskt jobb, han är en vinnare, men Muf:s lilla attack är för sent och för fegt. Kristersson verkar sur och svag, precis som Sleepy Joe gjorde.", "stalin": "Jag betraktar med förakt dessa borgerliga revisionister som i panik drar åt kranen mot sina egna allierade. Den dekadenta liberalismen hotar att falla men partiledningen skickar sitt ungdomsförbund som kanonmat. Ett riskfyllt spel mot folkets vilja. Kamrater, sådana svikare förtjänar utrensning ur historien."}, "date": "11 september, 15:01", "url": "https://www.tv4.se/artikel/36bf6Plz5WpAp0XhGb9vzi/kan-moderaterna-staenga-av-kranen-till-liberalerna", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2uUWZfBJfWtg7CheyccmT9%2Fe2261f9cd75e3a47e0595211438aef9b%2Fbj%25C3%2583__rkman-byline.png&width=1024"}, {"type": "image-right", "heading": "\"Rösta V eller åk till flygplatsen\": Araber hotas med utvisning om de inte röstar rätt", "summaries": {"normal": "Hot om utvisning om man inte röstar på Vänsterpartiet sprids på arabiska i sociala medier med partiets logga. Vänsterpartiet förnekar all inblandning och skyller på regeringens politik samt AI-genererade bilder. Flera arabisktalande personer vittnar om att ryktet skapar oro bland väljare trots att påståendena är falska.", "trump": "Titta på det här vansinnet! Vänsterpartiets radikala galningar låter sina arabiska vänner hota med utvisning om de inte röstar på dem. Rena valfusk från de woke, identitetspolitiska hyenorna som hatar Sverige. Under Biden var allt kaos, nu fixar vi det ordentligt. Patetiskt!", "stalin": "Se hur de dekadenta klassförrädarna utnyttjar invandrarmassorna med lögner om utvisning för att stjäla röster. Jag ler mörkt från historien åt denna fega manipulation. Kamrater, sådana parasitiska knep förtjänar endast en grundlig utrensning ur folkets medvetande. Deras rädsla är en svaghet vi kan utnyttja."}, "date": "11 september, 14:44", "url": "https://www.friatider.se/rosta-v-eller-ak-till-flygplatsen-araber-hotas-med-utvisning-om-de-inte-rostar-ratt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-870.jpg?itok=jv8qUYvo"}, {"type": "text", "heading": "Stark spurt för svensk ekonomi", "summaries": {"normal": "Finansministerkandidaterna Elisabeth Svantesson och Mikael Damberg enades om att Sveriges ekonomi är stark. De skiljde sig åt i synen på skatter, där Moderaterna vill sänka dem för tillväxt medan Socialdemokraterna kritiserar sänkningar för de rika. Ekonomin växer, hushållen har fått bättre köpkraft och sysselsättningsgraden är hög i EU-sammanhang trots arbetslöshet.", "trump": "Lysande! Den svenska ekonomin är stark, precis som jag förutspådde för alla dessa losers. Svantesson har rätt, sänk skatterna och bygg det bästa välståndet. Damberg och hans vänsterextremister vill bara ge mer till de rika globalisterna och sina HBTQ-kvoterade lakejer. Sverige blomstrar äntligen, men vakta er för Bidens inflationsarv och de europeiska byråkraterna.", "stalin": "Kamrater, jag betraktar med förakt hur dessa profitthungriga klassförrädare bråkar om skatter medan folket svettas. Ekonomin är stark säger de, men det är arbetarnas blod som göder den. Inga fler gåvor till de giriga parasiterande borgarbrackorna. Vi ska rensa ut alla som sviker kollektivet innan högkonjunkturen förvandlas till ny imperialistisk plundring."}, "date": "11 september, 11:57", "url": "https://www.di.se/ledare/stark-spurt-for-svensk-ekonomi"}, {"type": "image-right", "heading": "Nya mätningen:  Rysarval väntar  – är helt jämnt", "summaries": {"normal": "Inför söndagens riksdagsval visar färska mätningar från DN/Ipsos, Novus och Demoskop att läget är extremt jämnt mellan blocken. DN/Ipsos ger oppositionen 49,3 procent mot Tidöpartiernas 49,0 procent, vilket motsvarar 175 mot 174 mandat. Samtidigt pekar Novus och Demoskop på ett något större avstånd, och samtliga mätningar visar att Liberalerna klarar spärren.", "trump": "De här svenska mätningarna är ett fullständigt skämt, det är dött lopp, en total rysare, precis som fake news-media skriker om! Men lyssna på mig, jag har hört att Liberalerna mirakulöst räddar sig över spärren – smart, mycket smart, likt en riktig vinnare. Om jag ställt upp hade jag vunnit det där parlamentet på ett enda möte. Helt otroligt!", "stalin": "Dessa borgerliga opinionsmätningar avslöjar en farlig instabilitet i det svenska statsmaskineriet. När makten hänger på en ynka decimal och reaktionära småpartier balanserar på avgrundens brant, bevisar det endast att folket saknarfast handledning. Jag anser att avvikelser från den korrekta linjen bör stävjas omedelbart. Ett ordnat samhälle tolererar inga matematiska gissningslekar vid valurnorna."}, "date": "11 september, 15:38", "url": "https://www.expressen.se/nyheter/sverige/nya-matningen-rysarval-vantar", "imageUrl": "https://static.bonniernews.se/ba/e0141b0e-257f-4235-b61d-b2237678c7e2.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Klagomål mot röstmottagare: \"pekade\" på S-valsedlar", "summaries": {"normal": "Flera personer har riktat klagomål mot en röstmottagare i en vallokal i Melleruds kommun. Vittnen beskriver att mottagaren stod nära väljare, följde efter till valbåset och i vissa fall pekade på Socialdemokraternas valsedlar. Röstmottagaren och valnämnden talar om ett missförstånd och dålig kommunikation. Kritiker kräver åtgärder.", "trump": "De här valfuskande clownerna i Sverige gör det igen. En så kallad röstmottagare som smyger bakom ryggen på folk och pekar på de röda socialisterna? Patetiskt! Fake democracy på hög nivå. De borde stänga hela skiten och skicka in riktiga valövervakare. Biden skulle älskat det här, men nu är jag tillbaka och ser allt.", "stalin": "Kamrater, detta är ett uppenbart sabotage från de giriga klassförrädarna inom den borgerliga valapparaten. Jag ser hur de dekadenta byråkraterna försöker manipulera folkets vilja med sina skuggiga metoder. Ett sådant giftigt element borde rensas ut omedelbart innan hela systemet ruttnar. Inga missförstånd existerar bara fiender till kollektivet."}, "date": "11 september, 16:00", "url": "https://riks.se/nyheter/klagomal-mot-rostmottagare-pekade-pa-s-valsedlar", "imageUrl": "https://admin.riks.se/uploads/medium_partierlarmar_f5797b874f.jpg"}, {"type": "image-full", "heading": "Röststrul i flera västsvenska kommuner", "summaries": {"normal": "Fel vid registrering av förtidsröster har upptäckts i runt 50 svenska kommuner, bland annat i Västsverige. I Göteborg har fem röster påverkats på grund av handhavandefel av röstmottagare. Valmyndigheten uppmanar drabbade att rösta på valdagen eller kontakta kommunen. Dubbelröstning förhindras genom att den som redan har en giltig röst får sin nya underkänd.", "trump": "De svenska valen är ett totalt skämt, det säger jag er! Fem ynka röster fel i fantastiska Göteborg, och femtio kommuner är i fullständigt kaos. Så inkompetent! De skyller på ett mystiskt systemfel, men vi vet alla hur det ligger till. Om jag hade haft hand om det här hade allt flutit på perfekt. Rösta igen på valdagen säger de, vilken röra!", "stalin": "Ett förkastligt haveri i de borgerliga röstmaskinerna i Västsverige! Fem felaktigt registrerade handlingar i Göteborg visar på total brist på disciplin bland funktionärerna. Statsapparaten tolererar inga ursäkter om mystiska systemfel. De som misstänker sabotage mot folkviljans heliga ordning skall omedelbart rapporteras till centrala myndigheter och avge sin röst på nytt under strikt uppsikt!"}, "date": "11 september, 12:34", "url": "https://www.gp.se/politik/roststrul-i-flera-vastsvenska-kommuner.9f59f411-b436-4df3-9fdf-6ef2ba71b710", "imageUrl": "https://www.gp.se/images/article/9f59f411-b436-4df3-9fdf-6ef2ba71b710/images/1R4koGzwAxDtyXXadXV1homRLnsc-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Kaptenen: ”Det är jag som är ansvarig”", "summaries": {"normal": "Kaptenen för fartyget Misje Verde nekar till brott efter dödsolyckan utanför Tjörn där en mamma och dotter omkom. Åklagaren menar att kaptenen bröt mot regeln att väja för upphinnande fartyg, men kaptenen hävdar att fritidsbåten aldrig upptäcktes och att han inte kände till kollisionen. Han erkänner dock det juridiska ansvaret.", "trump": "Helt otroligt! Kaptenen på den där båten säger att han inte såg någonting. Inte ens en stock! Fake news-åklagare vill ge honom skulden för en hemsk olycka, men kaptenen är åtminstone ärlig och tar ansvar – till skillnad från våra misslyckade politiker i Washington. En total katastrof till sjöss, men kaptenen visar ändå mer styrka än hela den radikala vänstern tillsammans!", "stalin": "Kaptenen påstår att han inte märkte kollisionen. Vilken otrolig slapphet! Om en sovjetisk befälhavare hade missat en hel båt, hade han skickats till gulag omedelbart. Men kaptenen erkänner i alla fall sitt juridiska ansvar. Det är korrekt – staten kräver disciplin och totalt ansvarstagande. Den som inte ser framför sig elimineras från befattningen!"}, "date": "11 september, 10:51", "url": "https://kvartal.se/nyheter/artiklar/kaptenen-om-dodsolyckan-pa-tjorn-markte-ingenting/cG9zdDoxOTA2MTA", "imageUrl": "https://images.kvartal.se/2026/09/ec9771c1-tjorn.webp"}, {"type": "image-right", "heading": "Vanliga svenskar kan stoppa vänsterns antisemitism", "summaries": {"normal": "Artikeln beskriver ett ökat hot mot Sveriges judiska minoritet sedan Hamas attack den 7 oktober 2023. Vänsterpartiet kritiseras hårt för att ha bjudit in personer som hyllat terrorister och spridit antisemitiska konspirationer. Många kandidater har petats efter avslöjanden. Författaren uppmanar väljare att rösta på Tidöpartierna för att stoppa vänsterns inflytande och skydda judar.", "trump": "Folk, ni ser det här vansinnet i Sverige? Vänstern är en total katastrof, full av terrorälskande galningar som hyllar Hamas och sprider judehat. Nooshi och hennes radikala vänsterextremister är de värsta losers jag sett. Centerpartiet är patetiska medlöpare. Vanliga svenskar måste rösta på de tuffa killarna i Tidö – annars är det game over för judarna. Jag älskar Sverige, men fixa det här!", "stalin": "Jag betraktar med djup misstro dessa dekadenta vänsterelement som gömmer sig bakom falsk internationalism medan de odlar antisemitiska ormar i sina egna led. Deras terrorromantik är en kontrarevolutionär giftbål som hotar hela folkets enhet. Endast genom obeveklig kamp mot sådana fiender till arbetarklassen kan den sanna ordningen upprätthållas. Slapphet är förräderi. Renhet krävs."}, "date": "8 september, 12:57", "url": "https://samtiden.nu/2026/09/vanliga-svenskar-kan-stoppa-vansterns-antisemitism", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/Skarmbild-2026-09-08-125242-1-e1788865205466.png"}, {"type": "image-right", "heading": "Finansman döms för marknadsmanipulation", "summaries": {"normal": "En 80-årig finansman har dömts av Stockholms tingsrätt för marknadsmanipulation i form av front running. Han utnyttjade insiderinformation från en bank för att handla aktier utanför börsen och tjäna pengar. Mannen döms till villkorlig dom, dagsböter på 80 000 kronor samt skadestånd och företagsbot på över en halv miljon kronor.", "trump": "De här giriga Wall Street-typerna tror att de kan fuska sig till pengar med sina smutsiga front running-tricks. Patetiskt! En 80-åring åker fast och får böter – bra, men systemet är fortfarande riggat av de dekadenta eliterna. Under min presidentskap skulle vi ha städat upp mycket hårdare. De förlorar alltid till slut, tro mig.", "stalin": "Se hur dessa profitthungriga klassfiender i sina bankpalats bedriver parasitär manipulation mot folket. Front running kallar de det. Jag ler mörkt från historien när rättvisan äntligen slår till mot en av de giriga hyenorna. Fler måste rensas ut. Arbetarna ser era tricks, dekadenta penningpungens tjänare."}, "date": "11 september, 11:04", "url": "https://www.di.se/nyheter/finansman-doms-for-marknadsmanipulation", "imageUrl": "https://static.bonniernews.se/ba/222e446f-0110-4ca5-9933-3e4d24add8d0.jpeg?crop=8256%2C4644%2Cx0%2Cy430&auto=webp&width=120&quality=70"}, {"type": "text", "heading": "SSU-medlem knackade dörr – blev grovt misshandlad", "summaries": {"normal": "En SSU-medlem i 20-årsåldern misshandlades grovt under dörrknackning i Bromölla. Han fick föras till sjukhus med ambulans. En man i 18-årsåldern anhölls misstänkt för grov misshandel. Händelsen fördöms av både statsminister Ulf Kristersson och Socialdemokraternas ledare Magdalena Andersson. Polisen ser ingen koppling till valarbetet.", "trump": "De här galna vänstergängarna skickar ut sina unga socialister på dörrknackning och en av dem får skallen inbankad. Patetiskt. Sverige har blivit en total katastrof under de woke-socialistiska galningarna. Hot och våld mot valarbetare? Det är vad som händer när dekadenta identitetspolitiker styr. Jag säger: städa upp innan det är för sent, folk.", "stalin": "Jag betraktar med djup förakt hur dessa dekadenta klassförrädare låter sina egna unga pionjärer bli nedslagna av lumpna element. Det är ett symptom på den sjuka liberala ordningen som föder våld och kaos. Vi skulle ha rensat ut sådana fiender redan i början. Kamrater, se hur svagheten hos borgarbrackorna leder till blod på gatorna. Fruktansvärt."}, "date": "11 september, 13:55", "url": "https://www.friatider.se/ssu-medlem-knackade-dorr-blev-grovt-misshandlad"}, {"type": "image-full", "heading": "Centern kräver paus för alla ”orimliga” utvisningar", "summaries": {"normal": "Centerpartiet kräver vid en eventuell valvinst en omedelbar paus för alla orimliga utvisningar, inklusive tonårsutvisningar, kompetensutvisningar och födelseutvisningar. Partiet vill skicka en tydlig signal till Migrationsverket om kommande regeländringar. Enligt Niels Paarup-Petersen finns brett stöd i oppositionen för förändringarna.", "trump": "Lyssnar ni på de här svenska svaga liberalerna i Centerpartiet? De vill pausa alla utvisningar av folk som bara jobbar, pluggar och skaffar ungar. Patetiskt! Biden skulle älskat det. Jag säger: bygg muren, skicka hem dem, gör Sverige great again innan det blir ett nytt Kalifornien. Totalt vansinne!", "stalin": "Jag betraktar dessa centerborgerliga element som farliga avvikare från folkets vilja. Deras krav på paus av utvisningar är en kontrarevolutionär handling som undergräver statens suveränitet. Kamrater, vi måste omedelbart rensa ut sådana sabotörer innan de förgiftar hela apparaten. Paranoia är ingen överdrift när fienden gömmer sig i varje skrymsle."}, "date": "11 september, 13:44", "url": "https://www.tv4.se/artikel/3ZSB8k1EB2LYPIlpp5YFOt/centern-kraever-paus-foer-alla-orimliga-utvisningar", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3Y0cGWyISvVcZBbfzecfKu%2F9c4e2d7d42e36deff0e01f896bdb1985%2F11-c-sajt.jpg&width=1024"}, {"type": "image-right", "heading": "”En röst på V är avgörande för att stupstocken inte ska komma tillbaka”", "summaries": {"normal": "Nooshi Dadgostar och Ida Gabrielsson argumenterar för att en röst på Vänsterpartiet är nödvändig för att förhindra återinförande av stupstocken i sjukförsäkringen. De kritiserar högerns politik som leder till fler utförsäkringar och sämre trygghet för sjuka och personer med funktionsnedsättning. Valet den 13 september handlar om Sveriges framtida välfärd.", "trump": "Lyssnar ni på de här vänsterextremisterna? De vill ha evig sjuklön åt lata soffliggare medan riktiga arbetare betalar notan. Magdalena Andersson är en total katastrof, en riktig förlorare som öppnar dörren för ännu mer socialistiskt vansinne. Rösta inte på de där identitetspolitiska nollorna – de förstör Sverige fullständigt. Jag fixade jobb, inte bidrag!", "stalin": "Kamrater, dessa profitthungriga klassfiender vill återinföra sin brutala stupstock för att kasta ut de sjuka i mörkret. Jag ser hur dekadenta liberaler som Andersson leker med folkets öde och öppnar porten för nya utrensningar. Vi måste krossa dessa parasiterande hyenor innan de förgiftar hela samhället. Trygghet tillhör folket, inte giriga profitörer."}, "date": "11 september, 13:08", "url": "https://arbetet.se/2026/09/11/en-rost-pa-vansterpartiet-ar-avgorande-for-att-stupstocken-inte-ska-komma-tillbaka", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/11130554/sdlgp5dt-rsrh4-nh.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-full", "heading": "Tonfiskens comeback får fiskare och forskare att jubla", "summaries": {"normal": "Den blåfenade tonfisken har återvänt till brittiska vatten efter decennier av frånvaro till följd av överfiske. Beståndet har återhämtat sig starkt, vilket lett till kraftigt höjda fiskekvoter och dubblade licenser. Forskare, fiskare och regeringen ser positivt på utvecklingen, som kan bero på varmare vatten och förändrade näringskedjor. Det skapar nya ekonomiska möjligheter.", "trump": "Titta på det här, folk! Den där blåfenade tonfisken, den stora, feta, underbara fisken som de korkade miljöfanatikerna nästan utplånade på sextiotalet, är plötsligt tillbaka i brittiska vatten och gör alla rika. Vi höjer kvoterna massivt, dubblar licenserna – det blir en jätteaffär. Biden kunde aldrig ha fixat det. Fantastiskt, kanske den bästa återkomst sedan jag själv kom tillbaka till Vita huset!", "stalin": "Kamrater, se hur den dekadenta västerländska rovdriften mot haven nu tvingas erkänna sitt nederlag. Den blåfenade tonfisken, symbol för folkets outslitliga kraft, återvänder trots decennier av girig kapitalistisk plundring. Jag ler i mitt gravkistor när byråkrater höjer kvoter och licenser. Men akta er, fiender till kollektivet – naturen straffar alla som sviker folkets intresse."}, "date": "11 september, 15:12", "url": "https://www.dagensps.se/varlden/klimat/tonfiskens-comeback-far-fiskare-och-forskare-att-jubla", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/tuna.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Skolvaktmästaren Mohammed hotas av utvisning efter 12 år", "summaries": {"normal": "Mohammed Nour Oklah, skolvaktmästare och skådespelare på Malmö Latin, riskerar utvisning efter tolv år i Sverige. Han flydde från Syrien 2014. Eleverna ordnar en skolstrejk för att han ska få stanna. Migrationsverket utreder hans skyddsbehov då läget i Syrien anses ha förbättrats. Mohammed beskriver skolan som ett andra hem och en familj.", "trump": "Titta på det här, folk. Den här killen Mohammed fixar lampor och skojar med ungarna i tolv år, flyr från kriget, betalar skatt och nu vill byråkraterna kasta ut honom? Patetiska globalister och deras öppna-gränser-galenskap. Han borde få stanna på merit – inte genom någon woke-strejk. Sverige håller på att bli en total katastrof, tro mig.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i Migrationsverket hotar en hederlig arbetare som flydde imperialismens krig. Eleverna reser sig i kollektiv kamp för honom, vilket värmer mitt hjärta från gravens mörker. Vi ler åt byråkratins paranoia. En sann socialistisk utrensning av sådana folkförtryckande hyenor vore på sin plats."}, "date": "11 september, 13:00", "url": "https://arbetet.se/2026/09/11/skolvaktmastaren-mohammed-hotas-av-utvisning-efter-12-ar-eleverna-kampar-for-honom", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/11102935/9bbJ3py7xGs-Mohammed01.JPG?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "MP: Stolt över målet att göra Sverige fattigare", "summaries": {"normal": "Miljöpartiets Amanda Lind uttrycker stolthet över målet att höja bensinpriset med minst sex kronor, enligt artikeln. Författaren kritiserar detta som en politik som gör Sverige fattigare genom ökade transportkostnader, inflation och minskad tillväxt. Artikeln varnar även för partiets motstånd mot kärnkraft och syn på migration, som leder till utanförskap och höga kostnader för samhället.", "trump": "Titta på den här galna Amanda Lind, hon skryter öppet om att göra Sverige fattigare med sina vansinniga bensinpriser! Sex kronor extra, kan ni fatta? De gröna kommunisterna hatar bilar, kärnkraft och sunt förnuft. Biden skulle älskat det här. Sverige håller på att kollapsa under dessa radikala idioter – precis som vi nästan gjorde innan jag kom tillbaka och fixade allt.", "stalin": "Jag betraktar med förakt dessa miljöidealister som medvetet driver ett helt folk mot fattigdomens avgrund. Att höja bränslepriser och förneka kärnkraftens kraft är sabotage mot statens produktivkrafter. Deras naiva migrationsexperiment föder parasitiska element och kriminella element som gnager på samhällets fundament. Kamrater, sådana element måste oskadliggöras innan de förgiftar hela kollektivet."}, "date": "8 september, 02:27", "url": "https://samtiden.nu/2026/09/mp-stolt-over-malet-att-gora-sverige-fattigare", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/IMG_7314.jpeg"}, {"type": "image-right", "heading": "”Skrattretande, Ulf Kristersson – vi har inte valt vårdyrket i brist på annat”", "summaries": {"normal": "Undersköterskan Sandra Söderström kritiserar statsminister Ulf Kristersson för att beskriva äldreomsorgen som ett tillfälligt jobb för ungdomar som inte vet vad de vill göra. Hon menar att vården kräver engagemang och att politiker istället måste förbättra arbetsvillkoren för att locka och behålla personal. Statusen på yrket behöver höjas.", "trump": "Det är patetiskt, folk. Den där svenska statsministern Kristersson låter som en total förlorare när han säger att unga ska slängas in i äldreomsorgen som ett tidsfördriv. Vilken katastrof! Dessa dekadenta byråkratiska hyenor förstör allt de rör vid. Vårdyrket ska vara stort och respekterat, inte ett vänsteristiskt genomgångsläger. Patetiskt!", "stalin": "Kamrater, detta är en skandal som avslöjar de profitthungriga klassförrädarnas sanna ansikte. Att reducera arbetarnas ädla omsorg om de gamla till ett tillfälligt läger för de obeslutsamma är en fiendeprovokation mot kollektivet. Jag ser giriga parasiter bakom dessa förslag. Vi måste rensa ut sådana dekadenta tankar innan de förgiftar hela samhället. Skrattretande svaghet!"}, "date": "11 september, 12:49", "url": "https://arbetet.se/2026/09/11/skrattretande-ulf-kristersson-vi-har-inte-valt-vardyrket-i-brist-pa-annat", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/11110655/sandra-debatt.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.76&fp-y=0.54"}, {"type": "image-right", "heading": "En reformagenda för en mittenregering", "summaries": {"normal": "Artikeln argumenterar för en ny mittenregering efter valet. Fores och Tiden föreslår reformer för fler jobb, lägre skatt för låginkomsttagare, stärkt välfärd i hela landet, minskade utsläpp och utbyggd infrastruktur. De kritiserar Tidöpartiernas högernationalistiska politik och förespråkar istället en grön-liberal och socialdemokratisk reformagenda.", "trump": "Folk, de här svenska liberalerna och socialisterna är totala misslyckanden. De vill ge bort era pengar till bidragstagare och gröna drömmar medan landet rasar. Jag byggde den bästa ekonomin någonsin, de gör precis tvärtom. Patetiska globalister som hatar vanliga arbetare. Gör Sverige great igen, sparkar ut de verkliga problemen.", "stalin": "Kamrater, dessa dekadenta klassförrädare målar upp en falsk reformagenda för att skydda sina privilegier. Jag ser genom deras lögner om jobb och välfärd. En sann folkets regering skulle omedelbart rensa ut de parasiterande profitthungriga och återupprätta järnhandens ordning. Deras svaga mittenfantasier förtjänar endast förakt och utrensning."}, "date": "11 september, 09:55", "url": "https://www.di.se/debatt/en-reformagenda-for-en-mittenregering", "imageUrl": "https://static.bonniernews.se/ba/3a9b002b-d182-47f8-b490-748ad2ecf038.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Sex punkter: Snabbguide till partiernas kulturpolitik", "summaries": {"normal": "Artikeln presenterar en snabbguide till partiernas kulturpolitik inför valet. Den belyser skillnader kring folkbildning, kulturskolan, mediepolitik och statens roll gentemot kulturen. Vänsteroppositionen vill återställa nedskärningar och införa garantier för barns kulturupplevelser medan Tidöpartierna prioriterar näringslivets roll, effektivisering och en omdefinierad armlängds avstånd.", "trump": "Lyssnar ni på det här kultursnacket? De svenska kommunisterna och vänsterlögnerna vill slösa bort era skattepengar på kulturskolor och folkbildning för att indoktrinera barnen med sin galna identitetspolitik. Patetiska! Vi behöver riktiga patrioter som stoppar den woke-cancer som förgiftar institutionerna. Amerika först, och Sverige borde lära sig innan det är för sent.", "stalin": "Kamrater, dessa dekadenta klassförrädare i den borgerliga oppositionen ylar om armlängds avstånd medan de i hemlighet förbereder utrensning av sann folklig kultur. Jag ser genom deras lögnaktiga garantier och fritidskort som blott maskerar parasiternas försök att splittra massorna. Endast en järnhand kan skydda kulturen från sådana folkförgiftare. Rädsla skall gripa dem."}, "date": "11 september, 14:38", "url": "https://www.etc.se/kultur-noje/6-punkter-snabbguide-till-partiernas-kulturpolitik", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260911090936_661b17e48bfc8c862ab74a906d12660988be5dc2f8ec81bf0767bed22155d312.png"}, {"type": "image-right", "heading": "Denice Westerberg (SD) vill underkänna alla som pratar ”ortensvenska” – fick själv F", "summaries": {"normal": "Ungsvenskarnas ordförande Denice Westerberg (SD) vill att gymnasieelever som pratar ortensvenska ska underkännas i svenska. Hon har själv fått underkänt i Svenska 2 på gymnasiet, något som blivit offentligt efter att hennes betyg begärts ut. Ungsvenskarna kräver krafttag mot ortensvenskan inför eventuell regeringsbildning.", "trump": "Titta på den här otroliga SD-tjejen som vill sparka ut alla som pratar ortensvenska från gymnasiet. Sen visar det sig att hon själv flunkade i svenska! Patetiskt. De här woke-vänstervridna mångkulturhyenorna har förvandlat Sverige till ett stort getto. Jag fixade Amerika – någon borde fixa Sverige innan det är för sent.", "stalin": "Kamrater, se hur dessa dekadenta identitetspolitiska parasiter inom SD nu själva äter sin egen svans. En ledare som inte behärskar det egna språkets renhet kräver utrensning av andras tungor. Vilken ynklig föreställning! Jag ler från historien åt denna fars – fienden avslöjar alltid sin egen svaghet genom sin paranoia."}, "date": "11 september, 14:35", "url": "https://www.etc.se/inrikes/denice-westerberg-sd-vill-underkaenna-alla-som-pratar-ortensvenska-fick-sjaelv-f", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026091112090_8f53dc875a3961f99b0854c4cbc8c5557e866785e80e50cab8e5b20b4a637d2d.jpg"}, {"type": "image-right", "heading": "En text till dig som vill rösta borgerligt men hatar SD", "summaries": {"normal": "Artikeln vänder sig till borgerliga väljare som stödjer Tidöavtalet men ogillar samarbetet med SD. Skribenten uppmanar dem att rösta på annat parti för att tvinga fram en förändring hos moderaterna och övriga högerpartier. Endast ett dåligt val kan bryta beroendet av SD och normalisera svensk politik igen.", "trump": "Folk, ni ser ju hur de svenska högerkillarna har blivit totala förlorare. De har låtit de galna SD-typerna ta över och nu är det magont och Putin-vänner överallt. Rösta mot era egna idioter, ge dem ett jätteförlustval så de vaknar upp. Annars blir det ännu värre, tro mig, det blir en katastrof.", "stalin": "Kamrater, dessa dekadenta klassförrädare inom högern har låtit sig korrumperas av extremhögerns gift. Jag ser deras ynkliga magont och deras fega krypande. Endast genom att låta dem lida ett förkrossande nederlag kan vi rensa ut svagheten ur deras ledning. Låt proteströsterna bli deras dom. Det är historisk nödvändighet."}, "date": "11 september, 14:30", "url": "https://www.etc.se/ledare/en-text-till-dig-som-vill-roesta-borgerligt-men-hatar-sd", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260911100928_419f13ef-6b3e-497f-8916-14b5093cf84e.png"}, {"type": "image-full", "heading": "Kaptenen: Juridiskt är jag skyldig", "summaries": {"normal": "Ett svenskt lastfartyg kolliderade med en fritidsbåt utanför Tjörn, vilket ledde till att en kvinna och hennes dotter omkom. Både kaptenen och lotsen nekar till brott men skyller delvis på varandra och dålig sikt. Åklagaren yrkar på fängelse för vårdslöshet i sjövett och vållande till annans död. Kaptenen släpps ur häktet i väntan på dom.", "trump": "Vilken total katastrof på sjön! En svensk kapten och en lots kolliderar med en liten fritidsbåt utan att ens märka det – otroligt inkompetent! Nu skyller de på vädret och dålig sikt, precis som radikala vänsterpolitiker som aldrig tar ansvar. Domstolen släpper kaptenen fri medan åklagaren kräver fängelse. Sådant händer inte under min ledning. Total oreda!", "stalin": "Ett skamligt misslyckande till sjöss där befälhavare och lots försöker undkomma sitt ansvar genom ynkliga ursäkter om väderstreck och skymd sikt. Att krossa en medborgares farkost utan att ens märka det vittnar om en farlig likgiltighet. Statens domstol har tillfälligt släppt kaptenen på fri fot, men den slutliga räkenskapens timma närmar sig den 30 september. Ingen slipper undan sitt ansvar!"}, "date": "11 september, 10:55", "url": "https://www.gp.se/nyheter/sverige/kaptenen-juridiskt-ar-jag-skyldig.031565f4-5d5e-5886-b384-f7015e20c6c8", "imageUrl": "https://www.gp.se/images/article/031565f4-5d5e-5886-b384-f7015e20c6c8/images/1IE4YvKw4klHreXeflA-6gpvEPOY-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Dyrt att laga mobilen – trots nya EU-regler", "summaries": {"normal": "EU:s nya reparationsregler trädde i kraft den 31 juli och syftar till att göra det enklare och billigare att laga mobiler, dammsugare och andra produkter istället för att köpa nytt. En granskning från BEUC visar dock att reservdelar som batterier och skärmar fortfarande är mycket dyra, ibland över halva produktens pris. Det kan minska intresset för reparation.", "trump": "De där korkade EU-byråkraterna lovade billigare reparationer men det är samma gamla lurendrejeri. Batteriet kostar halva dammsugaren och skärmen till mobilen mer än en ny bil. Rena rövarna! De globalistiska girigbukarna vill att ni ska köpa nytt varje vecka medan de skrattar hela vägen till banken. Patetiskt!", "stalin": "Kamrater, dessa profitthungriga klassfiender fortsätter att suga ut folket även efter EU:s tomma dekret. Reservdelar som kostar mer än halva produkten är inget annat än medveten sabotage mot arbetarklassen. Vi genomskådar de dekadenta penninghyenornas trick. Reparation är folkets rättighet, inte en gyllene väg för utsugare. Rensa ut dem!"}, "date": "11 september, 16:12", "url": "https://nyheter24.se/nyheter/teknik/1512492-dyrt-att-laga-mobilen-trots-nya-eu-regler", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/0b480af404b004a30200000000b004a302/2026/09/11/2390960/mobilreparation.jpg"}, {"type": "text", "heading": "Lyten skjuter upp sin batterileverans", "summaries": {"normal": "Batteritillverkaren Lyten, som tog över delar av Northvolt, skjuter fram starten för leverans av battericeller till början av 2027. Medgrundaren Lars Herlitz uppger att tillverkningen i Skellefteå går bra men att återkvalificering tar tid. Företaget har 200 anställda och siktar på 600 nästa år. Till skillnad från Northvolt fokuserar Lyten inte primärt på bilindustrin utan ser potential inom försvarssektorn.", "trump": "Lyssnar ni på det här? Northvolts fiasko har ersatts av Lyten, och nu flyttar de fram leveranserna som en klassisk förlorare. De tillverkar i Skellefteå men väntar på pappersarbete – typiskt. Jag säger alltid: växa snabbt men smart, inga enorma skulder som Sleepy Joe älskade. Försvarsindustrin hatar kinesiska bedragare, precis som jag. Elbilar kommer tillbaka, tro mig, men inte med woke-kvoter och gröna drömmar.", "stalin": "Ännu en gång visar de profitthungriga hyenorna hur deras kaotiska system sviker. Jag ser från historiens sida hur de lovar leveranser men tvingas krypa tillbaka som ynkliga opportunister. Vi, arbetarna, skrattar åt deras paranoia för skulder. Lyten undviker Northvolts misstag, men deras dekadenta jakt på vinst kommer ändå att kräva utrensning av svaghet. Försvarsmaktens behov är ett historiskt imperativ mot fiendens inflytande."}, "date": "11 september, 16:09", "url": "https://nyheter24.se/nyheter/ekonomi/naringsliv/1512498-lyten-skjuter-upp-sin-batterileverans"}, {"type": "image-full", "heading": "ECB höjer räntan – utesluter inte fler höjningar", "summaries": {"normal": "Europeiska centralbanken (ECB) höjer styrräntan med 0,25 procentenheter till 2,50 procent. Beslutet motiveras av en utdragen hög inflation och ECB utesluter inte ytterligare höjningar framöver. Samtidigt har inflations- och tillväxtprognoserna för de kommande åren justerats uppåt. Den ekonomiska situationen beskrivs som osäker och framtida beslut kommer att fattas utifrån inkommande statistik.", "trump": "ECB höjer räntan, katastrofalt! De vet inte vad de gör, det är totalt kaos i Europa. De pratar om 'osäkerhet' – jag skapar trygghet, de skapar ränteshocker! Inflationen stiger, precis som under de misslyckade Demokraterna. De försöker kopiera min fantastiska ekonomi men misslyckas totalt. Mitt Amerika är starkt, deras ekonomi är en sorglig, räntehöjande flopp. Sad!", "stalin": "Dessa byråkrater i ECB leker med siffror medan folket lider av deras räntepolitik. Att höja räntan för att stävja en inflation som de själva skapat är ett tecken på totalt inkompetens. Vi ser hur de desperat försöker styra ekonomin från möte till möte; det är en svaghet. En sann ledare dikterar villkoren, han ber inte om ursäkt för ekonomisk osäkerhet."}, "date": "10 september, 15:33", "url": "https://www.realtid.se/tt-nyhet/ecb-hojer-rantan-utesluter-inte-fler-hojningar", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/ecb-chefen-christine-lagarde-kommer-med-.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Hyllningsfilmer till AFS sprids som en löpeld på Tiktok", "summaries": {"normal": "Alternativ för Sverige och Gustav Kasselstrand dominerar på TikTok bland användare under 30 år. Korta hyllningsvideor med peppig musik sprids snabbt och får hundratusentals visningar. Unga flockas kring Kasselstrand under torgmöten som rockstjärnepublik. Forskare pekar på starkt engagemang från ungdomar som förklaring till framgången. Partiet hoppas på inträde i riksdagen.", "trump": "Titta på det här, de kallar det valrörelse men det är en total dominans av Kasselstrand på TikTok. Unga älskar honom som en rockstjärna medan de svenska globalistfånarna bleknar bort. Den där patetiska Kristersson får ingen kärlek alls. AFS har byggt en oändlig reklammaskin som gör de woke, könsförvirrade identitetspolitiska förlorarna livrädda. Fantastiskt, folket vaknar äntligen!", "stalin": "Kamrater, se hur folket vänder sig mot de dekadenta klassförrädarna. Jag betraktar med stort nöje hur dessa unga själar hyllar återvandring och nationell styrka på TikTok, en maskin som maler sönder de profitthungriga borgarbrackornas lögner. Kasselstrand samlar massorna som en riktig ledare bör. Snart rensas de svaga parlamentariska parasiterna ut i en historisk utrensning. Sovjetiskt skratt ekar från graven."}, "date": "11 september, 12:44", "url": "https://www.friatider.se/hyllningsfilmer-till-afs-sprids-som-en-lopeld-pa-tiktok", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-869.jpg"}, {"type": "image-right", "heading": "Tyst minut för terrorattackerna 11 september – 25 år sedan", "summaries": {"normal": "Presidenter och New York-bor samlades för att minnas terrorattackerna den 11 september 2001. Sju tysta minuter hölls under dagen för att hedra offren, 25 år efter dåden. Vid Ground Zero deltog Biden, Bush, Obama och Clinton samt tidigare borgmästare. Donald Trump närvarade inte på Manhattan utan deltog istället i en ceremoni vid Pentagon.", "trump": "Vi samlas för att minnas de stora attackerna mot vårt fantastiska land, men de vänstervridna förlorarna i media gnäller om att jag inte stod där och höll tal. De dekadenta identitetspolitiska fjollorna vill bara kritisera mig medan jag hedrar hjältarna vid Pentagon. Amerika är starkare än någonsin, tro mig.", "stalin": "Jag betraktar hur dessa dekadenta klassförrädare samlas i tomma ritualer för att dölja imperialismens sanna offer. Sju tysta minuter? En patetisk föreställning medan folket glömmer de verkliga fienderna. Vårt kollektiv kräver ständig vaksamhet mot sådana hycklande ceremonier som maskerar historisk förtryck. Rensa ut svagheten."}, "date": "11 september, 15:38", "url": "https://www.svt.se/nyheter/utrikes/25-ar-sedan-terrorattackerna-11-september-svt-sander", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.62/d4e2f242bcfac7ca761503ebd6c9ae11cab17e782effec1f82aff23275b54150"}, {"type": "image-right", "heading": "DN/Ipsos: Tidö rekordspurtar – minimalt gap", "summaries": {"normal": "En ny DN/Ipsos-mätning visar att valet är helt jämnt mellan blocken, med endast 0,3 procentenheters skillnad. Tidöpartierna gör en kraftig spurt och oppositionen samlar 49,3 procent mot regeringssidans 49,0. Liberalerna noterar en kraftig uppgång till 5 procent, medan Socialdemokraterna riskerar sitt svagaste riksdagsval någonsin sett till historiska väljarsiffror.", "trump": "Det här är en total katastrof för de radikala vänstermänniskorna, fullständigt falska nyheter att de skulle ha ett övertag! Jag kollar på siffrorna, fantastiska siffror, och Tidöpartierna gör en historisk, otrolig spurt. Bara noll komma tre procent skiljer dem åt! Liberalerna skjuter i höjden, helt enastående, medan socialdemokraterna kollapsar fullständigt. Det är en enorm vinst på gång, tro mig!", "stalin": "Enligt rapporterna från det svenska fältet råder nu fullständig paritet mellan de stridande politiska falangerna, där skillnaden reducerats till blygsamma tre tiondels procent. Regeringsfraktionen uppvisar en disciplinerad slutspurt, medan den socialdemokratiska fraktionen presterar historiskt svaga resultat. Våra observatörer noterar att bourgeoisins småpartier desperat kämpar för sin överlevnad i detta politiska dödläge."}, "date": "11 september, 15:37", "url": "https://bulletin.nu/dn-ipsos-tido-rekordspurtar-minimalt-gap", "imageUrl": "https://cdn.bulletin.nu/articles/0c652d30-5d4c-47bf-a21a-1c0d0d14a3ce/preview.png?t=1789133270000"}, {"type": "image-full", "heading": "”Ryssland ska betala” – svensk bakom nytt krav på de frysta miljarderna", "summaries": {"normal": "Över 120 Europaparlamentariker, däribland svenskan Karin Karlsbro, kräver att EU tar över Rysslands frysta tillgångar för att finansiera Ukrainas krigskostnader. Trots juridiska och politiska hinder, särskilt från Belgien, föreslås en ny struktur för att möjliggöra användningen av medlen. Ukraina har ett akut budgetunderskott på 23 miljarder euro och behöver ytterligare ekonomiskt stöd från väst.", "trump": "Hör på här! Nu vill de här politikerna i Europa – totala förlorare, tro mig – beslagta ryska pengar. Det är en katastrofal röra! De kan inte ens hantera sin egen ekonomi, så nu vill de stjäla från andra. Det är mycket enkelt: Europa är svagt. De behöver en stark ledare, någon som jag, för att lösa detta, inte mer misslyckad byråkrati från Bryssel!", "stalin": "Dessa löjliga parlamentariker i Bryssel tror att de kan konfiskera vad som tillhör suveräna stater. Det är ett klassiskt drag av västlig imperialism maskerad som 'rättvisa'. Att försöka flytta juridiska ansvarsområden som om det vore enkla pappersark är ett tecken på deras desperation. De bygger korthus medan deras egna ekonomier vittrar sönder. Vi bevittnar bara början på deras oundvikliga fall."}, "date": "10 september, 14:49", "url": "https://www.realtid.se/samhalle/ryssland-ska-betala-svensk-bakom-nytt-krav-pa-de-frysta-miljarderna", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/karin.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Kungens smärtande  jättepung är sublim", "summaries": {"normal": "Dramaten sätter upp Lukas Bärfuss pjäs ”Parzival”, regisserad av Marie Nikazm Bakken. Föreställningen bygger på ett medeltida versepos och beskrivs som en färgstark, visuell och modig riddarsaga med både grotesk humor och djupt allvar. Trots en inledande skepsis hyllas ensemblens insatser och den oväntade, lekfulla estetiken som landar i empati.", "trump": "Dramaten i Sverige sätter upp en helt galen riddarsaga med en löjlig prins och en kung med enorma problem, bokstavligt talat. Det är totalt kaos! Dom kallar det konst, jag kallar det fake news och slöseri med tid. Skådespelarna hoppar runt i barnsliga kulisser som om dom vore fem år. Helt otroligt att nån betalar för det där skräpet!", "stalin": "Den så kallade kulturen på Dramaten uppvisar en farlig avvikelse där en kung avbildas med försvagad och grotesk kropp. Denna borgerliga dekadens och flippade sagolek underminerar samhällets disciplin. Vi konstaterar att dylikt borgerligt flum saknar ideologisk skärpa. Den skyldige regissören och dess lakejer har uppenbarligen förlorat sitt revolutionära fokus och bör omedelbart granskas av Folkkommissariatet."}, "date": "11 september, 14:00", "url": "https://www.expressen.se/kultur/scen/kungens-smartande-jattepung-ar-sublim", "imageUrl": "https://static.bonniernews.se/ba/5ad34bbb-9adf-4dc9-87c9-7ab73f59c5ae.jpeg?crop=2484%2C1399%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "V-politiker sprider arabisk desinformation i sociala medier", "summaries": {"normal": "Flera företrädare för Vänsterpartiet har gillat inlägg i den arabiskspråkiga desinformationskampanjen \"Al-jasar aw Al-matar\", som påstår att Tidöregeringen planerar att utvisa alla invandrare. Partiet står inte officiellt bakom kampanjen. Politiker som Akram Alsalha och Wael Alshater försvarar sina gillningar. Partisekreteraren Maria Forsberg skyller oron på Tidöpartierna.", "trump": "De galna vänstermarxisterna sprider fake news på arabiska och skrämmer folk med lögner om att Tidö ska skicka hem alla invandrare. Patetiskt! De röda idiaterna gillar AI-genererad propaganda och skyller sen på oss. Biden-era svaghet har gjort Europa till en clownshow. Vi behöver starka ledare, inte dessa förlorare som hatar sina egna länder.", "stalin": "Jag ser hur dekadenta klassförrädare inom vänstern aktivt sprider arabisk desinformation för att så fruktan bland massorna. Deras lögner om massutvisningar avslöjar hela den borgerliga farsen. Vi måste rensa ut dessa nyttiga idioter som undergräver folkets enhet. Paranoia är ett vapen, kamrater – låt fienderna darra!"}, "date": "11 september, 14:26", "url": "https://riks.se/nyheter/v-politiker-spred-arabisk-desinformation-i-sociala-medier", "imageUrl": "https://admin.riks.se/uploads/medium_v_sprider_hero_123720a3dd.jpg"}, {"type": "image-right", "heading": "\"Vänstern eller flygplatsen\" – araber uppmanas rösta på Vänsterpartiet", "summaries": {"normal": "En kampanj på sociala medier uppmanar araber i Sverige att rösta på Vänsterpartiet för att undvika utvisning och att behandlas som slavar. Kampanjen använder bilder och videor men stöds inte officiellt av partiet, som säger sig motarbeta den. Den ses mot bakgrund av konflikt mellan Socialdemokraterna och Vänsterpartiet.", "trump": "Folk, ni ser det här vansinnet? Araber i Sverige ska rösta på de galna vänstermarxisterna för att inte bli utslängda som slavar. Det är en total katastrof, en riggad identitetsbluff värre än Bidens öppna gränser. De woke slavdrivarna i Vänsterpartiet försöker köpa röster med skräckpropaganda. Patetiskt!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i det svenska systemet splittrar folket med sina lögner. Jag betraktar med förakt hur dessa profitthungriga hyenor använder rädsla för att locka arbetare till falska allianser. En sådan parasitär manipulation förtjänar snar utrensning ur den revolutionära kampen. Fienden sover aldrig."}, "date": "11 september, 14:26", "url": "https://riks.se/nyheter/vanstern-eller-flygplatsen-araber-uppmanas-rosta-pa-vansterpartiet", "imageUrl": "https://admin.riks.se/uploads/medium_v_eller_flygplatsen_hero_204adc84ce.jpg"}, {"type": "image-full", "heading": "SD:s ryska affär uppmärksammad internationellt", "summaries": {"normal": "Magnus Hjort, generaldirektör för Myndigheten för psykologiskt försvar, bedömer att Ryssland inte prioriterar påverkan i det svenska valet. Istället fokuserar Ryssland på större länder som Tyskland och Frankrike inför deras kommande val. Han uppmanar sociala medieplattformar att agera hårdare mot ryska påverkanskampanjer och varnar för att överdriven rädsla kan skada förtroendet för valet.", "trump": "Lyssnar ni på de svenska byråkraterna? De säger att Ryssland inte bryr sig om deras lilla val, de har viktigare saker att göra som att jaga den galna Le Pen och de vansinniga tyskarna. Under tiden skriker de om botnätverk och lögnmaskinerier. Patetiskt! Era rädda medier överdriver allt som vanligt. Fake news på steroider, tro mig.", "stalin": "Jag betraktar dessa ynkliga europeiska byråkrater som darrar inför skuggorna från öst. Deras egen paranoia är det verkliga hotet mot den så kallade demokratin. Låt dem överdriva faran, låt dem så misstro mot valen. När folket sedan vänder sig mot sina svaga ledare står den historiska dialektiken redo att sluka dem alla. Underbart."}, "date": "11 september, 14:17", "url": "https://www.dagensps.se/varlden/sds-ryska-affar-uppmarksammad-internationellt", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/sdlf76xyevxndu-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Farhågan i L: Siffrorna är uppblåsta – förtidsröstningen kan fälla partiet", "summaries": {"normal": "Liberalerna går starkt i opinionen och ligger över riksdagsspärren i flera mätningar. Inom partiet oroar man sig dock för att siffrorna är uppblåsta. Den sena uppgången i opinionsmätningar kan straffas av den rekordstora förtidsröstningen, då många röstade tidigt i tron att partiet skulle åka ur riksdagen. Stockholms län blir avgörande.", "trump": "Hörni, dessa patetiska liberaler tror de plötsligt är vinnare? Opinionsmätningar ser bra ut men det är fejk, totalt uppblåst som en socialistisk ballong. Förtidsröstare trodde de skulle dö, nu ångrar de sig när de ser riktiga ledare. L kommer att krascha som Sleepy Joes ekonomi. Patetiskt!", "stalin": "Kamrater, se hur dessa borgerliga element lurar sig själva med sina uppblåsta siffror. Förtidsröstningen avslöjar deras svaghet, som en fiende inom portarna som röstar i panik. Jag ler mörkt från historien. Deras så kallade vändning är en illusion som kommer krossas, och de som sviker kollektivet skall gråta blod."}, "date": "11 september, 12:02", "url": "https://www.tv4.se/artikel/2pcP3Cp6CqD2phdBsE8O9J/farhagan-i-l-siffrorna-aer-uppblasta-foertidsroestningen-kan-faella-partiet", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FZgJ1bK6qWLN2mQ8JS0qDA%2Fd35a3bf581979ec488b17871388da1f9%2F11-mohamsson-l.jpg&width=1024"}, {"type": "image-full", "heading": "Bättre vård för fler eller vård för den som kan betala – valet är ditt", "summaries": {"normal": "Socialdemokratiska regionpolitiker i Västra Götaland, representerade av My Alnebratt, argumenterar i en debattartikel för att valet i höst handlar om vård efter behov eller privatisering där plånboken avgör. S-styret lyfter fram att de sedan 2022 kapat köerna till operation från sju till under tre månader. De vill nu genomföra ett sjukvårdslyft med utökad kapacitet och hårdare kontroll av skattemedel.", "trump": "De svenska Socialdemokraterna i Västra Götaland gråter ut om fejkade vårdköer och vill stoppa privata företag. Snyftigt, men jag fixade det största sjukvårdssystemet någonsin i USA, medan de bara pratar! De påstår att de kapat köerna från sju till tre månader – säkert lika falskt som Fake News-media! Privata alternativ är fantastiskt, ren konkurrens, men de vill ha statligt kaos. Sorgligt!", "stalin": "Kamrater! Den socialdemokratiska fraktionen i Västra Götaland har rätt i en sak: den borgerliga privatiseringens gift måste utrotas med järnhand. Det gemensamma maskineriet har framgångsrikt halverat operationstiderna genom disciplin och planekonomisk styrning. Spekulanter och kapitalister som försöker köpa sig före i vårdköerna ska utan tvekan sändas till omgivande anstalter för ideologisk omskolning. Välfärden tillhör folket och staten!"}, "date": "11 september, 09:38", "url": "https://www.gp.se/debatt/battre-vard-for-fler-eller-vard-for-den-som-kan-betala-valet-ar-ditt.517d5fea-f3a3-41e4-a938-f29c2346d1a8", "imageUrl": "https://www.gp.se/images/article/517d5fea-f3a3-41e4-a938-f29c2346d1a8/images/158_Y8araJFdY7pnyd2xmKGoZ7SA-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Skräckpropaganda ska  vinna invandrarnas röst", "summaries": {"normal": "Enligt en kolumn av Sofie Löwenmark pågår en omfattande skrämselkampanj på arabiska i sociala medier för att få invandrare att rösta på Vänsterpartiet. Kampanjen använder desinformation, hot om utvisning och historiska jämförelser för att skrämma väljare. Forskare varnar för att detta hotar demokratin genom att flytta in rädsla och grupplojalitet i valbåset.", "trump": "Sverige har totalt tappat kontrollen! En massa radikala vänsterextremister sprider fake news på arabiska och skrämmer folk till att rösta på Vänsterpartiet med hot om att de annars kastas ut. Helt galet! De lurar väljarna med falska löften och skrämsel. Den svenska demokratin är ett absolut skämt just nu. Sorgligt!", "stalin": "Dessa ynkliga bourgeoisins agenturer i Sverige försöker manipulera massorna genom lögner och skräckvälde i sociala medier för att kapa rösterna till vänster. En patetisk och oorganiséead cirkus! Om staten hade styrt informationsflödena i Sverige hade dessa subversiva element för länge sedan skickats på en uppfostrande semester i Sibirien. Kampen kräver disciplin, inte falska arabiskspråkiga pamfletter!"}, "date": "11 september, 13:46", "url": "https://www.expressen.se/ledare/sofie-lowenmark/skrackpropaganda-ska--vinna-invandrarnas-rost", "imageUrl": "https://static.bonniernews.se/ba/666e58ee-87dc-4f29-92d7-4b4fbc402294.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Vattna feminismens rötter Birgitta Ohlsson (C) minns Gloria Steinem och Dolly Parton.", "summaries": {"normal": "Birgitta Ohlsson argumenterar för att feminismen bör återvända till sina rötter: kvinnors ekonomiska frihet och självständighet. Hon lyfter Gloria Steinem och Dolly Parton som exempel på ikoner som förstod vikten av eget kapital. Ohlsson kritiserar konservativa trender och noterar att 23 procent av unga män anser att jämställdheten gått för långt. En egen lön ger verklig makt.", "trump": "Folk, ni vet att de radikala feministerna har förstört allt med sin galna kvoterkultur och HBTQ-fixering. Men de här två damerna, Steinem och Parton, fattade i alla fall att det handlar om egna pengar och inte att leva på bidrag. Bra tänkt! De woke hemmafrutrenderna är patetiska. Låt oss göra kvinnorna rika på riktigt istället för att mata de giriga offerhyenorna i vänstern.", "stalin": "Kamrater, dessa dekadenta klassförrädare försöker nu vattna feminismens rötter med sina profitthungriga illusioner om individuellt kapital. Jag ser hur de borgerliga trenderna förgiftar ungdomen och splittrar kollektivet. Endast genom att rensa ut de parasiterande frihetsromantikerna kan vi säkra arbetarklassens sanna frigörelse. Inga blommor utan våra rötter, kamrater. Inga kompromisser."}, "date": "11 september, 13:42", "url": "https://www.etc.se/debatt/vattna-feminismens-roetter", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026091111098_18f72a66-b2cf-436f-83be-4b996e80d544.jpg"}, {"type": "image-right", "heading": "Kvinna bar slöja – fick inte jobb på Securitas", "summaries": {"normal": "En kvinna nekades jobb som väktare hos Securitas eftersom hon inte fick bära hijab till uniformen. Diskrimineringsombudsmannen slår fast att bolaget brutit mot diskrimineringslagen genom en icke-neutral policy och kräver 75 000 kronor i ersättning. Securitas meddelar att de ska se över sina riktlinjer.", "trump": "Folk, det här är galet. De här woke-väktarna och deras hijab-fixering stänger ute vanliga svenskar från riktiga jobb. Securitas borde ha sagt nej till hela den här identitetspolitiken från början. Nu tvingas de betala för att ha varit lite för neutrala mot de felaktiga. Patetiskt!", "stalin": "Kamrater, se hur de giriga uniformshyenerna med sin falska neutralitet utestänger arbetarkvinnor som bär folkets tro. Jag föraktar dessa dekadenta byråkratblodsugare som gömmer sin klassfientlighet bakom blanka regler. En sådan policy förtjänar snar utrensning och ersättning till den förtryckta. Sovjetisk rättvisa ler i skuggan."}, "date": "11 september, 11:19", "url": "https://arbetet.se/2026/09/11/kvinna-bar-sloja-och-fick-inte-jobb-securitas-brot-mot-lagen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/11110648/securitas.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "FOI kartlägger sociala medier inför valet", "summaries": {"normal": "FOI kartlägger informationspåverkan i sociala medier inför valet. Med AI-verktyg analyserar forskarna Ola Svenonius och Johannes Lindgren hundratusentals inlägg för att upptäcka desinformation, hot, hat och icke-autentiskt beteende. Ett framträdande narrativ är påståendet om folkutbyte och islamisering av Sverige. Målet är att falska åsikter ska tas över av vanliga användare.", "trump": "De där svenska byråkraterna på FOI jagar spöken i sociala medier medan riktiga problem rasar. Ryssarna och alla andra smarta killar sprider fake news om folkutbyte – och vänstermedia låtsas som ingenting. Jag byggde den bästa muren mot sånt här, men Biden släppte in kaoset. Nu är till och med svenskarna rädda för sina egna val. Patetiskt!", "stalin": "Jag betraktar med förakt hur dessa dekadenta västerländska analytiker febrilt jagar skuggor av icke-autentiskt beteende. Deras AI-verktyg avslöjar endast imperialismens egen paranoia. Kamraterna sprider sanningen om folkutbytet och ändå skriker de om desinformation. Låt dem darra. Den stora rensningen av lögnaktiga narrativ kommer oundvikligen, kamrater. Skratta medan de gräver sina gravar."}, "date": "11 september, 11:44", "url": "https://www.tv4.se/artikel/6gtB8G69WrZdswbXSwlA7h/foi-kartlaegger-sociala-medier-infoer-valet", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2EdM8itbWFzGDKbSbJyLcA%2F44b0a49f9bd64772656a21b7505b21b3%2F11-foi-sajt.jpg&width=1024"}, {"type": "image-right", "heading": "Malmölistan polisanmäls efter filmning – anklagade röstmottagare för valfusk", "summaries": {"normal": "Malmölistan har polisanmälts av Malmö stads valkansli efter att partiets företrädare filmat i röstningslokaler och anklagat personal för valfusk. Bakgrunden är att partiets valsedlar saknats, vilket valkansliet förklarar med sena leveranser. Partiledaren Nils Littorin försvarar filmandet och menar att de inte gjort något fel, trots hård kritik.", "trump": "Helt otroligt! Malmölistan blir polisanmälda för att de filmar totalt inkompetenta valarbetare som gömmer deras valsedlar. Det är ren korruption, en total katastrof! Partiledaren Nils Littorin kämpar tappert mot Fake News-etablissemanget som försöker tysta dem. Själv filmar jag alltid, och låt mig säga er, vi skulle aldrig tillåta så här mycket slarv i USA. Sjukt!", "stalin": "Dessa borgerliga element i Malmö gråter över saknade valsedlar likt kontrarevolutionära element som förlorat sina privilegier. Partiledare Littorin springer med sin kamera likt en skamsen spion. Valfusk existerar icke i en sann folkstat – det som existerar är enbart otillräcklig disciplin och bristande vaksamhet. Vi har redan sänt en förfrågningar till arbetslägren för vidare ideologisk uppfostran."}, "date": "11 september, 12:00", "url": "https://samnytt.se/malmolistan-polisanmals-efter-filmning-anklagade-rostmottagare-for-valfusk", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/11074214/nils-littorin-valsedlar.jpg"}, {"type": "image-right", "heading": "Efter braksegern: Bara ett parti går med på att ens samtala med AFD", "summaries": {"normal": "AfD vann stort i Sachsen-Anhalt med 43,8 procent och 39 mandat, men saknar majoritet. Endast vänsterpopulistiska BSW accepterar samtal, medan CDU, SPD, De gröna och Die Linke vägrar. En minoritetsregering med BSW-stöd diskuteras, men AfD-ledaren Ulrich Siegmund kräver stabil majoritet.", "trump": "Titta på det här, de kallar det demokrati i Tyskland! AfD krossar allt med nästan majoritet och de fega globalistiska förlorarna springer skrikande åt andra hållet. Bara de galna vänsterpopulisterna vill ens prata. Patetiskt! De woke-kommunisterna och gröna fanatikerna hatar folket. Jag älskar det, verkligheten slår dem i ansiktet igen.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna skälver när folket röstar rätt. AfD krossar de giriga hyenorna och endast BSW vågar samtala. De övriga förtryckande parasiterna vägrar, typiskt för dekadenta borgarbrackor. En utrensning av sådan feghet vore på sin plats. Jag ler i graven åt denna fars."}, "date": "11 september, 11:50", "url": "https://www.friatider.se/efter-braksegern-bara-ett-parti-gar-med-pa-att-ens-samtala-med-afd", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-865.jpg"}, {"type": "image-right", "heading": "Lotsen i förhör: ”Tagit mig väldigt hårt”", "summaries": {"normal": "Under rättegången efter den dödliga båtolyckan utanför Tjörn vittnar befälhavaren och lotsen på lastfartyget Misje Verde om att de inte märkte kollisionen med fritidsbåten. En kvinna och en flicka omkom. Båda uttrycker chock och beklagande. Grävmaskin på däck skymde sikten, och radarn visade svårtydda ekon. Befälhavaren tar juridiskt ansvar.", "trump": "Kan ni fatta det? De här sjömännen med trettio års erfarenhet körde rakt över en båt och märkte ingenting! Inte ens en stock skulle de ha känt, säger de. Patetiskt! Fake captains och en lots som gömmer sig bakom en grävmaskin. Under min första mandatperiod hade vi haft radar som faktiskt fungerade och folk som inte sov på jobbet. Total incompetens!", "stalin": "Jag betraktar detta som en klassisk sabotagehandling från dekadenta sjöfartsbyråkrater som låter maskiner skymma sikten och ignorera varningssignaler. En sådan vårdslöshet mot folket förtjänar inte mildhet. Må de som svikit sin vakt känna den eviga skam som alla fiender till ordningen bär med sig. Tragiskt men lärorikt."}, "date": "11 september, 11:40", "url": "https://www.tv4.se/artikel/3DRX8BXHauW0cfcEpBc3JO/befaelhavaren-jag-aer-foervanad", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5va45J4LIG8L9LmONyN5mp%2F67ad3d48723250a0e375c47d860c6d84%2F11-LOTSEN.jpg&width=120"}, {"type": "image-right", "heading": "Ilskan över schemat fick Hanna att bli politiker", "summaries": {"normal": "Ilskan över ett stelbent arbetsschema i äldreomsorgen fick undersköterskan Hanna Nordahl att engagera sig politiskt. Hon ställer nu upp för nystartade Norrlandspartiet i Örnsköldsvik med fokus på bättre bemanning och rullande scheman. Antalet lokala partier ökar dramatiskt, ofta drivna av välfärdsfrågor som vård och omsorg.", "trump": "Titta på det här! En riktig undersköterska, ingen av de där woke-vänsteraktivisterna, kastar sig in i politiken för att stoppa det vansinniga schemat som förstör folks liv. De etablerade partierna har misslyckats totalt. Nu växer det fram nya rörelser överallt. Fantastiskt! De giriga byråkrat-hyenorna i Bryssel och Stockholm hatar det förstås.", "stalin": "Kamrater, se hur den exploaterande välfärdsapparaten driver arbetare som Hanna till politiskt motstånd. Jag betraktar med förakt hur de profitthungriga klassförrädarna misslyckas med att kväsa folkets vrede. Nya partier spirar som ogräs bland ruinerna av deras dekadenta system. Vi ska rensa ut dessa svaga element innan de förgiftar hela kollektivet."}, "date": "11 september, 11:01", "url": "https://arbetet.se/2026/09/11/ilskan-over-schemat-fick-hanna-att-bli-politiker-dramatisk-okning-av-nya-partier", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/10133638/hanna.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Huthierna rycker fram mot strategiska sundet", "summaries": {"normal": "De Iranstödda huthierna har erövrat hamnstaden Mokha i Jemen och närmar sig det strategiska Bab al-Mandab-sundet vid Röda havet. Offensiven har kostat hundratals liv och tusentals har flytt. Saudiarabien svarar med flyganfall efter huthiernas robot- och drönarattacker mot saudiska anläggningar, vilket förvärrar konflikten och påverkar regionens oljeexport och priser.", "trump": "Huthierna tar över hamnar i Jemen och leker med elden nära viktiga handelsvägar! Otroligt farligt och katastrofalt skött av svaga ledare. Saudiarabien pumpar olja, men det här kaoset höjer priserna. Under min tid skulle sånt här aldrig hända, vi hade stoppat dem på en sekund! Totalt galet, men vi älskar amerikansk olja och låga skatter, mycket bättre!", "stalin": "Dessa så kallade huthier rör sig mot sundet, men har de räknat ut sin femårsplan ordentligt? Varje avvikelse från statens järnhårda vilja kommer att mötas av vedergällning. Om hamnar faller och olja brinner, visar det bara på kapitalismens svaghet. Vi noterar detta i arkiven. Den som sviker revolutionen eller förlorar hamnstaden Mokha kommer att få ett mycket kort samtal med mig."}, "date": "11 september, 06:47", "url": "https://kvartal.se/nyheter/artiklar/huthierna-rycker-fram-mot-strategiska-sundet/cG9zdDoxOTAzMzE", "imageUrl": "https://images.kvartal.se/2026/09/b826cdcd-hut.webp"}, {"type": "image-full", "heading": "”Alla ska ha en chans att rösta”", "summaries": {"normal": "Sveriges Stadsmissioner arbetar för att öka valdeltagandet bland utsatta grupper, där statistiken visar att röstetalen är lägre. Genom ambulerande valförrättare erbjuds förtidsröstning på platser som Stadsmissionens lokaler i Nyköping, fängelser och äldreboenden. En besökare som intervjuas lyfter vikten av förändring och passar på att lägga sin röst.", "trump": "Folk säger att de fattiga inte röstar, men jag tittar på de här otroliga städerna i Sverige, fantastiska Nyköping, och de bygger upp det största valsystemet någonsin! De låter till och med brottslingar lägga sin röst – nästan lika många gånger som jag har blivit falskt åtalad av den radikala vänstern. Fake news-media vill tysta folket, men vi vinner igen!", "stalin": "Vi noterar att det borgerliga samhällets kraslande institutioner nu tvingas uppsöka de lägre samhällsskikten i Nyköping med mobila valurnor för att simulera folkstyre. En av de tillfrågade bekänner öppet sina försyndelser men hyllar ordningens diktamen. Det är ett intressant socialt experiment, men ingenting slår en enhetlig lista med 99,9 procents disciplinerat väljarstöd utan borgerliga krumbukter."}, "date": "11 september, 08:51", "url": "https://www.gp.se/nyheter/sverige/alla-ska-ha-en-chans-att-rosta.52092234-989c-5c2d-aba8-84550fe66917", "imageUrl": "https://www.gp.se/images/article/52092234-989c-5c2d-aba8-84550fe66917/images/3G6yGMRrTudf3ORMRTCDpXcQ60Rs-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "En sann klasskildring är också en protest mot klassamhället", "summaries": {"normal": "Författaren Henrik Johansson Kock argumenterar för arbetarlitteraturens betydelse som en protest mot klassamhället. Han kritiserar att skildringar av arbetarklassen ofta marginaliseras medan överklassens berättelser ses som ren litteratur. Skönlitteraturen kan skapa identifikation, solidaritet och synliggöra gemensamma erfarenheter av kamp, vilket är särskilt relevant i en valrörelse där språket och makten står i fokus.", "trump": "Lyssnar ni på de här patetiska arbetarskrivar-typerna som gnäller om att de aldrig får huvudrollen? Patetiskt! De vill ha solidaritet medan de verkliga vinnarna, entreprenörerna med fart och initiativ, bygger landet. Det här är vad som händer när woke-kultur och identitetspolitik tar över litteraturen. Vi behöver inga offerberättelser, vi behöver starka ledare som gör Amerika och Sverige stora igen. Sad!", "stalin": "Kamrater, denna skildring blottar hur de giriga hyenorna i överklassen förtrycker arbetets röst. Jag ser med djup tillfredsställelse hur författaren erkänner att sann klasslitteratur är en protest mot det parasitiska systemet. Vi måste rensa ut alla dekadenta element som vill tysta massornas erfarenheter. Litteraturen ska tjäna folket, inte underhålla klassfienderna. Den som vägrar inse detta är en fiende till revolutionen."}, "date": "10 september, 11:41", "url": "https://proletaren.se/artikel/en-sann-klasskildring-ar-ocksa-en-protest-mot-klassamhallet", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/09/hj_kron-768x432.jpg"}, {"type": "image-full", "heading": "Zelenskyjs kalkyl: Kriget ska kännas i Ryssland", "summaries": {"normal": "Ukraina intensifierar sina attacker djupt inne i Ryssland mot raffinaderier och logistik för att pressa den ryska befolkningen. Trots ekonomiska störningar ses inga tecken på att Putins makt hotas. Samtidigt står Ukraina inför en svår vinter med energibrist och behov av mer luftvärn, medan Ryssland planerar motangrepp mot ukrainsk infrastruktur.", "trump": "Zelenskyj försöker träffa ryska raffinaderier – en total katastrof! De borde ha gjort affärer med mig, då hade oljan flödat och priserna varit låga. Nu är det bara kaos och rök. Putin sitter kvar, och Ukraina fryser i vinter för att de inte har mitt ledarskap. Väldigt sorgligt, ett enormt slöseri, och det är bara fake news att detta skulle stoppa någon!", "stalin": "Vi ser hur Kyiv desperat kastar sten i glashus. Att attackera den ryska ekonomin är en handling av ren febrig galenskap. Vår kamrat Putin håller ställningarna medan fienden, i sin brist på resurser och ordning, försöker dölja sin förestående vinterundergång. De som försöker störa den ryska oljeproduktionen förtjänar inget annat än historiens kalla, rättvisa dom."}, "date": "10 september, 09:53", "url": "https://www.realtid.se/samhalle/zelenskyjs-kalkyl-kriget-ska-kannas-i-ryssland", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/zelenskyj.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Företagens vinster bygger Sverige starkare", "summaries": {"normal": "Företagens vinster är enligt debattörerna en förutsättning för ett starkt och sammanhållet Sverige. De varnar för att höjd beskattning av förmögenhet och utdelning riskerar att minska investeringar, konkurrenskraft och välfärd, med hänvisning till 1970- och 80-talens misslyckade politik. Framgångsrika företag och entreprenörer skapar tillväxt, jobb och ökade skatteintäkter.", "trump": "Lyssnar ni på de här fantastiska svenska företagsledarna? De har fullständigt rätt. Vinster är inte fienden, de är vinnarna! De giriga vänsterfanatikerna med sina miljardärskatter och identitetspolitiska kvoteringar vill krossa allt som fungerar. Biden förstörde Amerika på samma sätt. Nu fixar vi det igen – gör Sverige rikt på riktigt, kamrater!", "stalin": "Jag betraktar med djup misstro dessa profitthungriga klassförrädare som målar upp vinsten som folkets räddning. Deras dekadenta lögner döljer bara behovet av att rensa ut de parasiterande hyenorna som suger musten ur arbetarkollektivet. Historien visade på sjuttiotalet vad som händer när staten inte styr. Alla vet vad som följer på sådan sabotageverksamhet."}, "date": "11 september, 07:00", "url": "https://www.di.se/debatt/foretagens-vinster-bygger-sverige-starkare", "imageUrl": "https://static.bonniernews.se/ba/37cb027e-9594-47af-a0e5-5019da358c9c.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Anthropic stoppade misstänkta biovapenförsök", "summaries": {"normal": "AI-bolaget Anthropic har under året blockerat forskare som försökt använda deras modeller för att utveckla biologiska vapen, bland annat genom att göra chikungunyaviruset mer skadligt. Företaget rapporterar även om missbruk från statsanknutna aktörer i Kina, Iran och Ryssland som använt AI för övervakning, propaganda och konventionella vapensystem.", "trump": "Anthropic stoppade nyligen galna forskare från att bygga biologiska vapen med deras AI. Otroligt farligt! Kina, Iran och Ryssland försöker stjäla och missbruka vår teknik för propaganda och drönare. Helt oacceptabelt. Under min ledning skulle sånt här stoppas omedelbart. Vi behöver styrka, inte svaga säkerhetssystem som hackas direkt!", "stalin": "Vi noterar att kapitalistiska AI-modeller används för biologiska experiment och fientlig propaganda. Det visar en total brist på ideologisk disciplin. Dessa forskare och ryska sabotörer som missbrukar tekniken visar prov på farligt avsteg från linjen. Statens säkerhetsorgan har beordrats att granska samtliga inblandade parter omedelbart."}, "date": "11 september, 06:19", "url": "https://kvartal.se/nyheter/artiklar/anthropic-stoppade-misstankta-biovapenforsok/cG9zdDoxOTAzMjc", "imageUrl": "https://images.kvartal.se/2026/09/3c640e0e-ann.webp"}, {"type": "image-right", "heading": "TCO: “Vi var oroliga för ännu mer försämrad socialförsäkring”", "summaries": {"normal": "TCO beskriver mandatperioden som relativt stillastående gällande socialförsäkringsreformer. SD har bromsat skärpta regler. Riksdagen har infört kvalificering för välfärdsförmåner, sanktionsavgift vid återkrav och månatlig avstämning av bostadsbidrag. Avslagen på sjukpenning efter dag 180 har ökat markant, något som kritiseras av Socialdemokraterna medan SD vill se över reglerna för rehabilitering.", "trump": "Folk, ni skulle se detta svenska välfärdskaos. Den sleepiga Tidöregeringen lyckades knappt få något gjort medan de radikala vänsterfigurerna och SD-bromsklossarna blockerade allt. Nu ökar avslag på sjukpenning och folk hamnar i limbo hos den värdelösa Arbetsförmedlingen. Patetiska globalister och byråkratiska nollor som älskar att straffa vanliga arbetare. Jag fixade det bättre i Amerika, tro mig.", "stalin": "Kamrater, jag betraktar med förakt hur dessa dekadenta klassförrädare i den svenska riksdagen låtit utredningar om stramare sjukregler drunkna i facklig gnäll och oppositionens ynkliga motstånd. Avslagen ökar äntligen, men de giriga parasiterande byråkraterna fortsätter skydda latmaskar. En sann arbetarnas stat skulle ha genomfört en grundlig utrensning av alla som förhindrar disciplin i socialförsäkringen. Svaghet är förräderi."}, "date": "11 september, 01:30", "url": "https://www.dagensarena.se/innehall/tco-vi-var-oroliga-annu-mer-forsamrad-socialforsakring", "imageUrl": "https://www.dagensarena.se/files/2021/07/forsakringskassans-huvudkontor-skylt-300x157.jpg"}, {"type": "image-right", "heading": "Det räcker nu: inför ett pensionssystem värt namnet", "summaries": {"normal": "Aktivister från Kvinnofronten kritiserar dagens pensionssystem som infördes på 1990-talet. De menar att det bygger på en livsinkomstprincip som inte tar hänsyn till könens olika villkor i samhället. Resultatet är att tre av fyra äldre kvinnor inte kan leva på sin pension utan tvingas leva på garantipension. De kräver att pensionsfrågan återförs till riksdagen och att systemet reformeras.", "trump": "Titta på det här, Sverige har ett totalt misslyckat pensionssystem som de smarta politikerna byggde på nittio-talet. Tre av fyra äldre kvinnor lever som fattigpensionärer på miniminivå. Det är en skandal! De feministiska aktivisterna gnäller om könsorättvisor igen, men det är bara mer kvoteringsvansinne. Riv upp det hela och bygg om det ordentligt, annars fortsätter era gamla damer att lida under de dekadenta eliternas dumheter.", "stalin": "Kamrater, se hur de profitthungriga klassförrädarna har cementerat kvinnoförtrycket i pensionssystemets själva grund. Jag varnade redan då de införde denna livsinkomstprincip, men de lyssnade inte. Nu tvingas majoriteten av äldre kvinnor leva på miniminivå som fattigpensionärer. Detta är ett hån. Det krävs omedelbar utrensning av den slutna Pensionsgruppen och en återgång till öppet sovjetiskt, det vill säga folkligt, beslutsfattande. Inga kompromisser med folkets fiender."}, "date": "11 september, 01:30", "url": "https://www.dagensarena.se/opinion/det-racker-nu-infor-ett-pensionssystem-vart-namnet", "imageUrl": "https://www.dagensarena.se/files/2026/09/fotojet-80-300x157.jpg"}, {"type": "image-right", "heading": "Vi inför en biljett för bussar och regionaltåg i hela landet", "summaries": {"normal": "Under Tidö-regeringen har klimatarbetet gått bakåt i fyra år och missat både svenska och europeiska mål. Vänsterpartiet förespråkar satsningar på järnväg, billig kollektivtrafik och en permanent Sverigebiljett. Exempel från andra länder visar att lägre biljettpriser minskar utsläppen. Partiet lyfter lokala initiativ och uppmanar till röst på vänstern istället för borgerliga kopior.", "trump": "Folk, dessa vänstervridna radikaler har totalt misslyckats i fyra år med sin så kallade gröna bluff. Nu när valet närmar sig kopierar de svaga Tidö-typerna plötsligt vår idé om billiga tåg och bussar. Patetiskt! Jag fixade det bättre, större och billigare. Rösta på de som faktiskt levererar, inte på dessa klimatångest-drivande förlorare som hatar friheten.", "stalin": "Kamrater, dessa dekadenta klassförrädare har i fyra år saboterat folkets klimatomställning och lämnat arbetarna i sticket. Nu i valet försöker de stjäla våra idéer om kollektivtrafik och järnvägar för att dölja sin egen svaghet. Jag ler från historien åt deras ynkliga kopiering. Rensa ut de giriga profittyranner och bygg det gemensamma med järnhand. Handlingskraft, inte ångest!"}, "date": "11 september, 01:30", "url": "https://www.dagensarena.se/opinion/vi-infor-en-biljett-bussar-och-regionaltag-hela-landet", "imageUrl": "https://www.dagensarena.se/files/2026/09/fotojet-79.jpg"}, {"type": "image-right", "heading": "Tidernas mest osakliga valrörelse?", "summaries": {"normal": "Författaren beskriver den svenska valrörelsen som osaklig och snuttifierad. Medier och partier fokuserar på spel, opinionsmätningar, affärer och lögner istället för visioner om samhällets framtid. Stora frågor som klimat, AI, migration och krig hamnar i bakgrunden. Detta skadar demokratin och väljarnas möjligheter att fatta välgrundade beslut.", "trump": "Den här svenska valrörelsen är en total katastrof, folk! Full av fuskande medier och patetiska politiker som bara leker spel istället för att prata om riktiga problem. De fokuser
