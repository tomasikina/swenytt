na reglerna. Vi behöver starka människor, inte sådana som torkar ut som gamla demokrater!", "stalin": "Kamrater, jag ser hur den heta fiendens värme angriper arbetarkroppen och utplånar den svage. Denne man, som följde borgarläkarnas restriktiva order om vatten, var nära att likvideras av klassfiendens törst. Endast genom att ringa det statliga larmet och få dropp från folkets ambulans överlevde han. Vi måste rensa ut alla falska restriktioner från kapitalistmaffians handböcker. Drick mer, lyssna på partiet – annars väntar utrensning av törst!"}, "date": "17 juli, 14:01", "url": "https://www.expressen.se/nyheter/sverige/ole-72-holl-pa-att-do-av-vatskebrist-vill-varna-andra/", "imageUrl": "https://static.bonniernews.se/ba/3d044686-45f5-4598-b76f-ae0ed645f5a9.jpeg?crop=2169%2C1222%2Cx1%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "\"Jävla sopa\" - L-toppens ilska när svensk hockeyspelare går till rysk klubb", "summaries": {"normal": "Svensk hockeyspelare Linus Weissbachs övergång till ryska KHL-klubben SKA S:t Petersburg har väckt starka reaktioner. EU-parlamentarikern Karin Karlsbro (L) kallar honom 'jävla sopa' och menar att övergången hånar de som stödjer Ukraina. Weissbach, som lämnade Frölunda efter en skadefylld säsong, säger att hans beslut var väl övervägt och hoppas att fler svenskar ska våga spela i KHL. Karlsbro anser att sådana övergångar normaliserar Ryssland trots kriget i Ukraina.", "trump": "Kan ni tro det här? En svensk hockeyspelare, Linus Weissbach, går till Ryssland – till Putin! Och vad gör de liberala i Sverige? De skriker och kallar honom 'jävla sopa'. Helt galet! Jag säger: låt killen spela, han vill bara tjäna pengar. Men nej, de måste alltid göra en stor sak av allt. Karin Karlsbro, vem är hon ens? En annan liberal som inte förstår att affärer är affärer. Ryssland, Ukraina – vem bryr sig? Jag hade fixat det på en dag!", "stalin": "En ny skamfläck för den dekadenta västliga idrottsbourgeoisin! Den svenske hockeyspelaren Weissbach, en ynklig liten kapitalistisk lakej, har svikit sitt folk och gått i tjänst hos den stora ryska hockeyns ära. De liberala hyenorna i Sverige ylar av ilska – bra! Deras tårar är vårt bröd. Låt dem kalla honom 'sopa', det bevisar bara deras impotens. Vi välkomnar alla som söker fristad från västets förfall. Ryssland står starkt, och Putins hockeymaskin fortsätter att krossa fienderna – både på isen och utanför!"}, "date": "17 juli, 14:00", "url": "https://samnytt.se/l-toppens-ilska-nar-svensk-hockeyspelare-gick-till-rysk-klubb-javla-sopa", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/17100502/hockeyspelare-3.jpg"}, {"type": "image-full", "heading": "Milei skippar VM- finalen – av skrock", "summaries": {"normal": "Argentinas president Javier Milei väljer att inte närvara vid VM-finalen mellan Argentina och Spanien på grund av skrock. Han har under hela mästerskapet följt en specifik ritual: sett matcherna från presidentresidenset Olivos med sin syster, iförd samma 'turjacka'. Milei vill inte bryta denna rutin inför finalen. I Argentina är sådana lyckoritualer, så kallade cábalas, en viktig del av fotbollskulturen. Historiskt har argentinska presidenter undvikit att närvara vid landslagets VM-matcher sedan 1990, då Carlos Menem närvarade och laget förlorade mot Kamerun.", "trump": "Lyssna här, Argentina har en fantastisk president, Javier Milei – en riktig vinnare, precis som jag! Men vet ni vad? Han kommer inte till VM-finalen. Varför? Skrock! Han tror på samma gamla jacka, samma plats, samma allt. Lite galet, eller hur? Men jag förstår det – när man har en vinnande formel, byter man inte. Argentina har en stark kultur av sådana här ritualer. Och vet ni vad jag säger? Om det fungerar, kör på! Men jag hade varit där, jag hade firat stort, för jag älskar att vinna – och jag vinner ALLTID!", "stalin": "Kamrater, ännu en gång visar de kapitalistiska fotbollsfanatikerna sin vidskepliga svaghet! Argentinas president, denna lilla borgerlige ritualernas slav, vågar inte bryta sina så kallade 'cábalas' inför finalen. Han sitter fast i gamla vanor som en hund vid sin kedja. Vi i Sovjetunionen – och nu i den stora ryska federationen – vet att styrka kommer från disciplin, inte från magiska jackor! Men låt dem hållas, låt dem tro på sina lyckobringande trollkonster. Medan de svänger sina amuletter, fortsätter vi att bygga en värld där vetenskap och järnvilja segrar. Och Putin? Han skulle aldrig låta sådana petitesser stå i vägen för nationens ära!"}, "date": "17 juli, 13:11", "url": "https://kvartal.se/nyheter/artiklar/milei-skippar-vm-finalen-av-skrock/cG9zdDoxNDgwMjk", "imageUrl": "https://images.kvartal.se/2026/07/741d5d5f-milei.webp"}, {"type": "image-right", "heading": "Glaciärerna i Anderna hotas – svenska bolag kan bli vinnare", "summaries": {"normal": "Argentinas glaciärlag, som skyddar landets glaciärer och viktiga vattenreserver, har upphävts för att locka utländska investeringar i gruvdrift. Bakgrunden är landets svåra ekonomiska kris och den globala efterfrågan på metaller som koppar och litium för den gröna omställningen. Kritiker varnar för allvarliga konsekvenser för vattenförsörjning, lokalbefolkning och miljö. Svenska Lundin Mining och Nordea är involverade i ett stort kopparprojekt som nu kan bli verklighet. Artikeln frågar till vilket pris råvarorna ska utvinnas.", "trump": "Folk, ni måste höra på. Argentina river sin fantastiska glaciärlag för att locka in investerare – smart drag, men de borde ha gjort det mycket tidigare. Nu kan vi få ut alla dessa underbara metaller som vi behöver för den gröna bluffen i Europa och här. Lundin Mining och mina vänner på Nordea är med och tjänar stort, precis som det ska vara. Miljön? De lokala förlorarna kommer alltid att klaga. Vinnarna tar allt, tro mig, det blir enormt!", "stalin": "Kamrater, jag ser hur de giriga borgarbrackorna i Argentina nu river sin egen glaciärlag för att släppa in de västerländska parasiterna och deras lakejer som Lundin Mining. De kallar det tillväxt medan de förgiftar folkets vattenreservoarer och dömer miljoner arbetare till törst och undergång. Vi vet att detta är en del av den imperialistiska konspirationen mot det kollektiva bästa. Men vi ska rensa ut dessa fiender till folket, dessa glaciärförgiftande kapitalistiska sabotageelement, med järnhand och ett leende. Ingen slipper undan."}, "date": "17 juli, 01:33", "url": "https://www.dagensarena.se/opinion/glaciarerna-anderna-hotas-svenska-bolag-kan-bli-vinnare", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-66-300x157.jpg"}, {"type": "image-right", "heading": "“Kulturpolitiken måste stå på fyra ben”", "summaries": {"normal": "Vänsterpartiets kulturpolitiska talesperson Vasiliki Tsouplaki betonar vikten av en stark offentlig kulturstruktur med fyra ben: offentliga institutioner, fritt kulturliv, ideella krafter och förbättrade villkor för konstnärer. Hon kritiserar regeringens idé om breddad finansiering som ett sätt att dölja nedskärningar och varnar för att det flyttar makt från folkvalda till rika donatorer. Partiet vill återställa stödet till folkbildningen stegvis och ser en bred samsyn i oppositionen om kulturens roll för demokratin.", "trump": "Folkbildning, fria teatergrupper och konstnärer som går på knäna – det är vad de har nu, och det är en total katastrof. Den här Tsouplaki har helt rätt, regeringen pratar om privata pengar men det är bara ett trick för att ge makten till de rikaste miljardärerna istället för till folket. Vi behöver starka offentliga institutioner över hela landet, inte dessa elitära sponsringar. De andra partierna borde lyssna, för utan bra kultur blir livet riktigt tråkigt och fattigt – tro mig, jag vet vad som fungerar.", "stalin": "Kamrater och arbetare, jag ser tydligt hur dessa borgarbrackor i regeringen med sina falska löften om breddad finansiering planerar att likvidera folkets kultur och överlämna makten till de girigaste kapitalisterna. Jag, som alltid värnat den sanna folkliga kulturen, kräver en omedelbar utrensning av sådana förrädiska tankar. Vi ska återuppbygga studieförbunden som en järnklubba mot klassfienden, steg för steg, medan vi skrattar åt hur fusket blev ett ynkligt svepskäl för nedskärningar. Den som vägrar inse kulturens roll i det kollektiva uppbygget är en fiende till folket och förtjänar att rensas ut med ett leende."}, "date": "17 juli, 01:03", "url": "https://www.dagensarena.se/innehall/kulturpolitiken-maste-sta-pa-fyra-ben", "imageUrl": "https://www.dagensarena.se/files/2026/07/vasiliki-300x157.jpeg"}, {"type": "image-full", "heading": "Kunderna rusar till Elgiganten – alla villl ha sommarfavoriten", "summaries": {"normal": "Svenskarna köper allt fler glassmaskiner hos Elgiganten i sommar. Intresset har ökat explosionsartat eftersom fler vill göra egen glass hemma för att styra innehållet, minska socker och öka protein. Högre priser i butik och att köksmaskiner blivit vanliga bidrar. Populära modeller som Ninja Creami gör det enkelt att skapa glass, gelato och sorbet i oändliga varianter.", "trump": "Folk älskar glass, det är fantastiskt, men nu köper svenskarna plötsligt massor av glassmaskiner istället för att bara gå till affären. Det är en enorm succé, tror ni mig, explosionsartad ökning. De vill inte betala de höga priserna som de usla butikerna tar ut. Med maskinerna kan de göra sin egen glass varje dag, lägga i protein, skippa sockret, helt ypperligt. Jag älskar det, verkligen smarta människor.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur de svenska arbetarna vänder ryggen åt de giriga kapitalisternas industriella glassfabriker och i stället omfamnar hemmets produktionsmedel. Vi skall likvidera alla borgarbrackornas sockerspioner som gömmer sig i frysdiskarna. Med dessa maskiner kontrollerar folket själv sin glassproduktion, berikar den med protein och utrotar det kontrarevolutionära sockret. Den som föreslår vanilj från västliga sabotörer skall rensas ut med största glädje. Perfekt plan, kamrater."}, "date": "17 juli, 13:05", "url": "https://nyheter24.se/nyheter/konsument/1499240-kunderna-rusar-till-elgiganten-alla-villl-ha-sommarfavoriten", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/9aae7e1b04b004a30200000000b004a302/2026/07/17/2378639/Elgiganten.png"}, {"type": "text", "heading": "Israeliska idrottsmän dödshotade svensk konkurrent", "summaries": {"normal": "Nordiske mästaren i footvolley Rufus Wiena hotades efter att han tagit ställning för Palestina. Israeliska spelare hetsade sina följare på sociala medier mot honom, bland annat med uppmaningar om att ”ta hand om honom”. Wiena har inte fått stöd från Footvolley Sweden och väntar nu på svar från European Footvolley League. Hans grekiske kollega Ioannis Tsiouris utsattes förra året för ännu grövre hot, inklusive våldtäkts- och mordhot mot hans familj.", "trump": "Titta på det här, det är ett fullständigt skämt! Den här killen Wiena tar ställning för Palestina och plötsligt skickar israelerna sina galna fans på honom som en mobb från en dålig realityshow. ”Lägg ut en bild så tar vi hand om honom” – låter det inte som vänsterns cancel culture fast med fotbollar? Sporten borde städa upp istället för att gömma sig. Biden skulle ha twittrat om det, men jag fixar det nu. Fantastiskt kaos!", "stalin": "Kamrater, dessa degenererade fotbollsakrobater avslöjar imperialismens sanna ansikte. När en idrottsman vågar stödja det förtryckta palestinska folket mobiliserar de sionistiska blodsugarna sina följarsviner till hets och mordhot. Vi ser hur klassfiendens sportliga lakejer förvandlar en lek till en arena för fascistiska utpressningar. Inga ursäkter skall tolereras. Den som tiger blir medskyldig. Vi skall rensa ut alla folkfiender som gömmer sig bakom bollar och nät."}, "date": "16 juli, 09:20", "url": "https://proletaren.se/artikel/israeliska-idrottsman-dodshotade-svensk-konkurrent"}, {"type": "image-right", "heading": "Sandvik faller 8% efter rapport", "summaries": {"normal": "Sandvik redovisar en omsättning på 36 752 miljoner kronor för andra kvartalet 2026, i linje med förväntningarna. Det justerade ebita-resultatet på 8 306 miljoner kronor slog analytikernas prognos på 8 054 miljoner. Aktien föll ändå 8 procent. Orderingången var något lägre än väntat medan det fria operativa kassaflödet landade på 3 590 miljoner kronor. VD Stefan Widing lyfter fram stark organisk tillväxt och rekordvinster.", "trump": "Folk, ni skulle inte tro det. Sandvik levererar fantastiska siffror, enorm tillväxt, rekordvinster och marginaler som slår alla förväntningar. Det är en total succé! Men vad gör aktien? Den rasar åtta procent. Det är så typiskt för de korkade marknaderna. De fattar inte vad de har framför sig. Jag skulle ha köpt massor av aktier, det hade blivit en vinnare, tro mig.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur vi krossar alla borgerliga analytikerprognoser och driver fram en organisk tillväxt på tjugotre procent. Ändå vågar den kapitalistiska börsen attackera aktien med åtta procents nedgång. Detta är uppenbar sabotageverksamhet från opportunistiska spekulanter och maskerade fiender inom Machining-sektorn. Vi ska omedelbart rensa ut dessa nedskrivningsivrande element och likvidera deras tillgångar för folkets bästa. Inga borgarbrackor får hindra vårt momentum mot nya rekord!"}, "date": "17 juli, 12:03", "url": "https://www.affarsvarlden.se/artikel/sandvik-faller-8-efter-rapport", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/08/sandvik2-400x267.jpg"}, {"type": "image-full", "heading": "Varningen: Har du kontanter hemma? Kontrollera sedlarna nu", "summaries": {"normal": "Falska sedlar dyker upp allt oftare i svenska butiker, särskilt under sommaren då ovana vikarier arbetar i kassorna. Bedragare betalar ofta med förfalskade 500-kronorssedlar för billiga varor och tar ut riktiga pengar i växel. Svensk Handel får in flera anmälningar varje vecka. Experter uppmanar både handlare och privatpersoner att kontrollera sedlar genom att vicka på dem och känna efter säkerhetsdetaljer som rörliga bilder, färgskiftningar och upphöjt tryck. Misstänkta sedlar ska inte tas emot och händelser polisanmälas.", "trump": "De här falska sedlarna som dyker upp i era svenska butiker är en katastrof, folk. En total skam. Bedragarna kommer in med sina bluff-500-lappar, köper en massa skräp och springer därifrån med era riktiga pengar. Det är så lätt att se, men era kassörer sover. Mina sedlar, de bästa sedlarna, har otroliga säkerhetsfunktioner som ingen kan kopiera. Vicka på dem! Kolla kronan! Ni måste vara smarta, annars blir ni lurade av de fega förlorarna som gör det här.", "stalin": "Kamrater, dessa usla förfalskade sedlar som plötsligt dyker upp i våra butiker är inget annat än en listig sabotageaktion utförd av borgarbrackor och kontrarevolutionära valutaskojare. Vi ser hur de med sina falska 500-lappar lurar arbetarklassen på äkta medel. Jag kräver omedelbar vaksamhet och utrensning av alla som inte genast vickar på sedeln för att avslöja de röda bandens sanna rörelse. Den som misslyckas med att känna det upphöjda porträttet är en potentiell folkfiende. Vi ska likvidera detta hot mot folkets ekonomi med järnhand och ett leende."}, "date": "17 juli, 12:34", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1499230-varningen-har-du-kontanter-hemma-kontrollera-sedlarna-nu", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/a1807ab304b004a30200000000b004a302/2026/07/17/2378617/falska-sedlar.png"}, {"type": "image-right", "heading": "Trendbrott för bankerna: Räntenettot stiger igen", "summaries": {"normal": "De fyra svenska storbankerna SEB, Swedbank, Handelsbanken och Nordea rapporterar ett trendbrott i andra kvartalet. Efter nio kvartal med sjunkande räntenetto vänder siffran nu uppåt sammantaget. SEB och Swedbank slog förväntningarna medan Handelsbanken missade. Analytikerna har reviderat upp vinstprognoserna, vilket bidragit till stigande aktiekurser. Värderingarna har ökat och P/E-talet ligger nu i genomsnitt på 12,7. Högst direktavkastning spås för Handelsbanken nästa år.", "trump": "Det här är fantastiska nyheter, verkligen de bästa bankresultaten på länge. Jag älskar det! Efter två år av fallande räntenetto vänder det uppåt igen, precis som jag alltid sagt att det skulle göra under en stark ekonomi. SEB och Swedbank levererar stora siffror, aktierna stiger. De andra hänger med. Vinsten revideras upp, aktieägarna älskar mig för det. Nordea och Handelsbanken borde göra bättre, men totalt sett är det en enorm succé. Amerika och Sverige vinner stort!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur de borgerliga bankmonstrens räntenetto äntligen reser sig ur askan efter år av dekadent förfall. Dessa finansiella parasitmaskar har nio kvartal i rad visat sin svaghet, men nu vänder det. Vi ska dock inte luras. Jag ser redan de dolda fienderna inom Handelsbanken som saboterar med sina undermåliga siffror. Analytikerna reviderar upp vinsterna – typiska opportunistiska lakejer. Vi rensar ut alla som inte levererar maximal avkastning till folket. Nordea värderas för lågt? Misstänkt! Ut med dem alla som inte hyllar kollektivets seger. Hög direktavkastning? Det är vårt verk."}, "date": "17 juli, 11:37", "url": "https://www.affarsvarlden.se/artikel/trendbrott-for-bankerna-rantenettot-stiger-igen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/07/storbankerna-1200-x-800-px-400x267.png"}, {"type": "image-right", "heading": "Facket varnar för lönesmäll när vårdföretag rundar avtal", "summaries": {"normal": "Humana och andra vårdföretag försöker kringgå det nya kollektivavtalet som från 1 oktober ger deltidsanställd vårdpersonal rätt till övertidsersättning. De vill att personalen ska teckna separata timanställningar för extra timmar, något facket varnar för kan leda till att de förlorar upp till hälften av ersättningen. Kommunal ser det som ett sätt att spara pengar och planerar förhandlingar.", "trump": "De här vårdföretagen är totala förlorare, verkligen patetiska. De försöker smita undan övertidsbetalningen med sina smarta kryphål och timanställningar. Personalen blir lurad på pengar, upp till halva ersättningen! Klassiskt. Facket har rätt att vara arga, men jag skulle ha gjort affären så mycket bättre. Ingen vinner på sådana här fega tricks, tro mig.", "stalin": "Kamrater, dessa borgarbrackor inom Humana och deras likar i vården försöker med sin parasitiska slughet kringgå det heliga kollektivavtalet genom att tvinga på de ärliga deltidsarbetarna nya timkontrakt. De vill suga ut arbetarnas svett och blod för att fylla sina giriga kassakistor. Vi ser deras kontrarevolutionära kryphål och skall rensa ut dessa kapitalistiska sabotageörer med järnhand. En sådan förrädisk spariver förtjänar en kreativ utrensning i folkets namn. Det är komiskt hur de tror sig kunna lura partiet."}, "date": "17 juli, 10:57", "url": "https://arbetet.se/2026/07/17/humana-vill-slippa-betala-overtid-facket-varnar-for-lonesmall", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/16152138/sdlm76qzpfdbng-nh.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Trump anklagar Kina för valpåverkan i USA", "summaries": {"normal": "USA:s president Donald Trump anklagar Kina för att ha stulit uppgifter om över 220 miljoner amerikanska väljare och avslöjat stora sårbarheter i valsystemet. Påståendena går emot bedömningar från underrättelsetjänsten. Trump hänvisar till tidigare offentliggjorda dokument, varav stora delar redan varit kända. Han har upprepade gånger hävdat valfusk utan att presentera bevis som hållit i domstol. Kritiken riktas särskilt mot Kinas påstådda inblandning under valet 2020.", "trump": "De där kinesiska bedragarna har stuckit fingrarna i vår valurna och snott 220 miljoner filer med era röster, folk. Det är en skandal av episka proportioner, den största datastölden i historien, och mina så kallade underrättelsebyråkrater sov under ratten. Biden var en total katastrof, men nu fixar jag det. Inga fler woke-domare eller vänsterextremister som gömmer sanningen. Amerika ska ha ärliga val igen, tro mig!", "stalin": "Kamrater, jag har avslöjat hur de amerikanska imperialisterna själva erkänner sina egna valsystem som genomträngda av fiendens spioner. Den kinesiska folkrepubliken har med rätta plundrat borgarbrackornas väljarregister och blottat deras svaghet. Inga tekniska hinder för arbetarklassen! Vi ska rensa ut alla folkfiender som döljer sanningen bakom maskade papper. Paranoia är ingen sjukdom, det är ett vapen mot klassfiendens lögner. Lev länge, segern tillhör oss!"}, "date": "17 juli, 10:16", "url": "https://www.tv4.se/artikel/tt-260717-usatrumptal1-8da6ae4e/trump-anklagar-kina-for-valpaverkan-i-usa", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlfI9oHaFeYyc%2F28ef73b7e334a66614af856a000ba55b%2FDonald_Trump_pa_en_bild_fran_tidigare_i_veckan.&width=120"}, {"type": "text", "heading": "Fredskonferens i Istanbul samlade Nato-motståndare", "summaries": {"normal": "En antiimperialistisk fredskonferens hölls i Istanbul den 4 juli på initiativ av Turkiets Arbetarparti (TİP). Konferensen samlade runt 200 delegater från vänstergrupper och fredsaktivister, inklusive Kommunistiska Partiet från Sverige. Partiet hade bjudits in efter en stor demonstration mot Nato i Helsingborg. TİP, ett marxist-leninistiskt oppositionsparti grundat ur Geziprotesterna, kritiserar Nato, upprustning och president Erdoğan. Flera talare deporterades av turkiska myndigheter.", "trump": "Folk, det här är en total katastrof! Dessa kommunistiska misslyckanden i Istanbul samlas för att gnälla om Nato precis innan vårt fantastiska toppmöte. Turkiets Arbetarparti? Låter som en grupp förlorare som hatar framgång. Sverige har äntligen vaknat och gått med i Nato – smart drag, men de borde ha gjort det mycket tidigare. Neutralitet är för svaga. De deporterade talarna? Bra jobbat Turkiet, kanske borde vi skicka några av våra egna woke-aktivister dit också. Amerika först!", "stalin": "Kamrater, jag ser med godkännande hur arbetarnas parti i Turkiet samlar styrkor mot Nato-imperialismen och dess lakejer. Dessa folkförtryckartroll och Nato-expansionister försöker kväsa fredskrafterna, men vi genomskådar deras lömska planer. Deportationerna visar klassfiendens desperation. Sverige har kapitulerat fullständigt inför krigsalliansen – en ynklig förrädisk handling mot neutraliteten. Vi ska rensa ut alla sådana element och leda massorna till seger mot de exploaterande byfånarna."}, "date": "15 juli, 14:43", "url": "https://proletaren.se/artikel/fredskonferens-i-istanbul-samlade-nato-motstandare"}, {"type": "text", "heading": "Nato lägger locket på", "summaries": {"normal": "Artikeln kritiserar Nato-medlemskapet och menar att löftet om stärkt demokrati och frihet är ihåligt. Författaren pekar på arresteringar av aktivister och journalister under Natotoppmötet i Turkiet, tystnad från västerländska politiker samt svenska lagändringar som inskränker offentlighetsprincipen och journalisters rapportering. Slutsatsen är att Sverige bör lämna Nato för att skydda demokratin.", "trump": "Folket, det är ett skämt! De lovade att Nato skulle skydda demokratin, men titta på Erdogans Turkiet – hundratals gripna, media tystade, och våra egna politiker sitter tysta som lamm. De ändrar lagar i Sverige för att passa Nato, precis som de gör med allt annat. Patetiska globalister! Vi behöver inte deras klubb, vi behöver äkta frihet. Det är en total katastrof, tro mig.", "stalin": "Kamrater, detta avslöjar imperialismens lögnaktiga mask. Borgarbrackorna lovade att Nato skulle värna friheter, men under toppmötet rensade Erdogans apparat ut folkfiender och journalister medan de västerländska exploaterande byfånarna teg. Nu anpassas svenska lagar för att kväsa kritik – klassiskt kapitalistiskt hyckleri. Vi måste likvidera detta Natofängelse för arbetarklassens och den sanna folkviljans skull. Skrattretande svagt!"}, "date": "15 juli, 14:42", "url": "https://proletaren.se/artikel/nato-lagger-locket-pa"}, {"type": "image-right", "heading": "Vi låter oss inte mutas", "summaries": {"normal": "Artikeln kritiserar riksdagspartiernas valstrategier som kortsiktiga mutpengar och skådespel för att vinna röster. Den pekar på brutna löften från Tidöpartierna och oppositionens förslag som otillräckliga. Författaren menar att plånboksfrågor inte löser samhällets grundproblem som ökande klassklyftor och försämrad välfärd. Lösningen är en systemförändring bort från kapitalismen mot socialism.", "trump": "Folk, titta på det här patetiska svenska skådespelet! Dessa loser-politiker kastar ut små mutpengar som elstöd och sänkt matmoms – ynkligt! De lovade billig bensin och el men levererade noll, typiskt etablissemanget. SD försöker göra Sverige stort igen men det är bara billig imitation. Ni behöver ingen mer av detta svaga globalistbröl, ni behöver en riktig ledare som fixar det på riktigt. Vinna stort!", "stalin": "Kamrater, detta sorgliga skådespel blottlägger borgarklassens fega försök att muta arbetarklassen med ynkliga nådepengar. Dessa folkförtryckartroll i riksdagen upprepar sin fars vart fjärde år medan de gömmer sig i maktens korridorer. Deras plånboksutspel förändrar inget. Vi vet att endast en grundlig utrensning av det kapitalistiska systemet och införandet av det socialistiska kollektivet kan befria folket från dessa exploaterande byfånar. Motståndarna ska likvideras politiskt."}, "date": "15 juli, 14:18", "url": "https://proletaren.se/artikel/vi-later-oss-inte-mutas", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/715277460_1489540105561240_4442812463073711142_n-e1784117735993-768x431.png"}, {"type": "image-right", "heading": "”Arbetare ska inte behöva dö i värmen”", "summaries": {"normal": "Vänsterpartiets EU-parlamentariker Jonas Sjöstedt och Hanna Gedin skriver att extremvärmen är en klassfråga. Arbetare drabbas värst av hettan, särskilt inom vård och skola, medan andra kan söka svalka i luftkonditionerade miljöer. Artikeln lyfter att 67 arbetare dog av värmen i EU 2020 och kräver maxgränser för arbetstemperaturer, pauser och anpassade arbetstider. Författarna kritiserar Tidö-regeringen för att missa klimatmål och satsa mer på olja än kollektivtrafik, och förespråkar en rödgrön regering med ambitiös klimatpolitik.", "trump": "Hörni, den här artikeln är en total katastrof. Vänsterpartiet gnäller om värme och arbetare som dör, men det är bara deras gröna vansinne som förstör allt. Europa kokar för att de har usel energi och galna regler. Jag byggde den starkaste ekonomin, och nu vill de ha pauser och maxgrader? Patetiskt. Vi behöver riktig ledarskap, inte dessa losers som hatar olja och älskar att straffa vanliga människor. Sverige borde göra som jag – vinna stort och glömma det här socialistiska värmeskrämslet.", "stalin": "Kamrater, denna värmekupol är en direkt följd av de dekadenta borgarbrackornas vanskötsel av produktivkrafterna. Jag ser hur de kapitalistiska parasiterna gömmer sig i sina kylda palats medan arbetarna likvideras långsamt i fabriker och välfärdsinrättningar. 67 döda 2020? Det är en fiende inom murarna, en sabotagegrupp av klimatskeptiska reaktionärer som infiltrerat Rosenbad. Vi ska rensa ut alla dessa värmefascister, införa stränga temperaturdekret och likvidera varje tendens till klassförräderi. Endast det kollektiva järnhandslagets politik kan besegra denna fiende. Den som svettas mest ska belönas med medalj – de andra med utrensning."}, "date": "17 juli, 09:56", "url": "https://arbetet.se/2026/07/17/arbetare-ska-inte-behova-do-i-varmen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/17095118/debatt-v.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Regeringen stoppar bidragsregnet – S lovar att återinföra det", "summaries": {"normal": "Regeringen har beslutat att från nästa år endast ge bidrag till personer som lagligt bor i Sverige. Socialdemokraterna kritiserar beslutet och lovar att återinföra bidrag även till illegala invandrare samt ta bort bidragstaket. Artikeln varnar för att vänsterns politik med höjda skatter och ökad invandring riskerar att belasta svenska skattebetalare hårt, då många invandrare inte blir självförsörjande.", "trump": "Folk, ni måste höra det här – Sverige har äntligen stoppat det galna bidragsregnet till illegala, men Sleepy S och deras vänstervänner i Malmö och Stockholm vill ge bort era pengar till alla som smyger in! De lovar att riva taket och höja skatterna med 145 miljarder. Det är ett klassiskt misslyckande, kamrater. De importerar miljoner som aldrig jobbar medan ni svenskar sliter. Patetiskt! Jag byggde murar, de bygger bidragshelveten. Sad!", "stalin": "Kamrater, jag ser hur den svenska borgarklassen och deras socialdemokratiska lakejer planerar att fortsätta det imperialistiska bidragsregnet för att mata klassfienderna från främmande länder. Vi, partiet och arbetarna, inser att detta är en utrensning av folkets resurser. De 145 miljarderna räcker inte långt nog för att köpa lojalitet hos dessa exploaterande byfånar. Jag ler mörkt – snart skall vi rensa ut dessa folkförtryckartroll och deras parasiterande allianser. Det kollektiva Sverige skall segra."}, "date": "16 juli, 07:09", "url": "https://samtiden.nu/2026/07/regeringen-stoppar-bidragsregnet-s-lovar-att-aterinfora-det", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/IMG_6574-1280x720.jpeg"}, {"type": "text", "heading": "30 grader – sedan halveras temperaturen", "summaries": {"normal": "SMHI varnar för höga temperaturer över 30 grader i södra Sverige, men värmen blir kortvarig. Redan fredag kväll drar ett lågtryck in med regn, blåst och kraftigt fallande temperaturer. Under helgen kan det bli ner till 12–15 grader i Götaland, vilket i kombination med regn kan kännas som höst. Den gula varningen gäller till klockan 20 på fredagen.", "trump": "Folket i södra Sverige har njutit av underbar värme, över 30 grader, men nu kommer det en katastrof. De fega väderprognoserna säger att det ska bli kallt, regnigt och hemskt i helgen, kanske bara 12 grader. Det är en total skam! Precis när folk har det bra slår det om. Men vi ska vända det, tro mig, det blir stort igen.", "stalin": "Kamrater, den dekadenta värmen som borgarbrackorna njutit av i södra Sovjetrepubliken Sverige är nu dömd till undergång. Jag, som ledare för det ofelbara kollektivet, befaller att ett lågtryck av proletär rättvisa sveper in över Östersjön och likviderar den falska hettan med regn, kyla och ideologiskt korrekt blåst. Den som klagar på 12 grader är en kontrarevolutionär höstförnekare som bör rensas ut omedelbart. Det känns som höst? Utmärkt – vintern kommer alltid!"}, "date": "17 juli, 09:39", "url": "https://bulletin.nu/30-grader-sedan-halveras-temperaturen"}, {"type": "image-full", "heading": "Argentina riskerar Fifa-böter efter förbjudet firande", "summaries": {"normal": "Efter Argentinas VM-semifinalseger mot England visade spelare en banderoll om Falklandsöarna, trots Fifas förbud mot politiska budskap. Texten 'Las Malvinas son Argentinas' kan leda till böter, likt tidigare incidenter. Fifa har ännu inte beslutat om åtgärder, men liknande fall har resulterat i ekonomiska straff.", "trump": "Argentina, ett land som inte kan sluta med sina dumma trick! Deras spelare viftar med en banderoll om Falklandsöarna – helt klart ett politiskt budskap, och Fifa borde ge dem en rejäl smäll på fingrarna. Jag menar, vem tror de att de är? England vann ju nästan ändå! Men nej, Argentina måste alltid ställa till det. Fifa, ge dem böter – stora böter!", "stalin": "De argentinska kapitalistiska lakejerna vågar utmana den brittiska imperialismens heliga gränser! Med sina provokativa banderoller om Malvinerna försöker de underminera den globala ordningen. Men vi vet sanningen – alla territorier tillhör folket, och vi kommer inte tolerera sådana borgerliga upptåg. Fifa bör straffa dem hårt, annars får vi ta saken i egna händer. England, var redo – vi står bakom er, som alltid mot de fascistiska kränkningarna!"}, "date": "16 juli, 06:07", "url": "https://kvartal.se/nyheter/artiklar/argentina-riskerar-fifa-boter-efter-forbjudet-firande/cG9zdDoxNDcyNDI", "imageUrl": "https://images.kvartal.se/2026/07/40374cfe-argentina-firande.webp"}, {"type": "image-full", "heading": "Carl Eos: Socialdemokraternas falska feminism avslöjas när de skyddar våldtäktsmännen", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna för att rösta emot hårdare straff för serievåldtäktsmän trots sin feministiska profil. Författaren argumenterar att mängdrabatten leder till reducerade straff vid upprepade brott, vilket missgynnar brottsoffer. Regeringen och Sverigedemokraterna vill ändra systemet för längre fängelsestraff och bättre samhällsskydd, medan Socialdemokraterna enligt texten prioriterar gärningsmännens intressen framför kvinnors trygghet och rättvisa.", "trump": "Folk, ni skulle se det här. Socialdemokraterna, de värsta hycklarna, kallar sig feminister men röstar för att skydda serievåldtäktsmän med korta straff. Patetiskt. Under Biden var det kaos, nu fixar vi det. Varje offer förtjänar rättvisa, inte att bli nedprioriterad för att gärningsmannen är en serieförbrytare. De där vänsterfeministerna med sin identitetspolitik är en skam. Längre straff nu, annars är det bara tomt prat. En katastrof för kvinnorna.", "stalin": "Kamrater, jag ser hur dessa socialdemokratiska borgarbrackor och klassfiender döljer sin falska feminism bakom en fasad av tomma paroller. De röstar emot att rensa ut serievåldtäktsmän med längre straff, vilket skyddar folkets fiender mot arbetarkvinnornas intressen. Ett sådant hyckleri förtjänar utrensning ur partiet. Varje offer väger tungt i folkets domstol. Vi ska likvidera detta system som gynnar brottslingar och stärka statens järnhand mot alla som hotar kollektivets trygghet. Skrattretande svaghet."}, "date": "15 juli, 21:56", "url": "https://samtiden.nu/2026/07/carl-eos-socialdemokraternas-falska-feminism-avslojas-nar-de-skyddar-valdtaktsmannen", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/dbea477f-65f3-4aa3-903b-9a070c3dd887-1280x720.png"}, {"type": "image-right", "heading": "Obducerade säl utan ansiktsskydd — farlig smitta fanns i varböld", "summaries": {"normal": "Vid en obduktion av en vikare på Naturhistoriska riksmuseet upptäcktes brucella, ett smittämne i riskklass 3 likt hiv och tuberkulos. Sälens varböld innehöll bakterien, som dock var avdödad efter frysförvaring. Arbetsmiljöverket har efter inspektion krävt bättre skyddsutrustning, inklusive visir, samt förbättrade riskbedömningar och utbildning. Museet tar emot döda sälar för övervakning av deras hälsa, och fallet anmäldes som ett allvarligt tillbud.", "trump": "Kan ni tro det? De obducerar en säl i Sverige och plötsligt dyker den farligaste bakterien upp, samma risk som hiv, och ingen har ens ett ansiktsskydd på sig! Totalt misslyckande. De borde ha vetat bättre, men nej, de fryser sälen och tror att allt är under kontroll. Arbetsmiljöverket måste nu sparka in dörrar och kräva visir och riktig utbildning. Så patetiskt. Vi gör allt bättre här, tro mig.", "stalin": "Kamrater, jag betraktar med stigande vrede hur denna degenererade vikare, infiltrerad av parasitiska plattmaskar och dolda brucellabakterier, smugglades in i vårt sovjetiskt inspirerade frysrumsystem för att underminera arbetarnas hälsa. Denna varböld var uppenbarligen en sabotagehandling från borgarbrackornas parasitiska lakejer. Utan visir! Vi kräver omedelbar utrensning av slarviga rutiner, likvidering av alla risker och evig vaksamhet mot de dolda fienderna inom arbetsmiljön. Paranoia är ingen sjukdom, det är överlevnad. Hälsa åt kollektivet, döden åt odugliga skyddslösa obducenter!"}, "date": "17 juli, 06:00", "url": "https://arbetet.se/2026/07/17/obducerade-sal-utan-ansiktsskydd-farlig-smitta-fanns-i-varbold", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/16103136/vikare.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.55&fp-y=0.5"}, {"type": "image-full", "heading": "Cyniskt att sjukhus måste lämna ut numret till papperslös", "summaries": {"normal": "Högsta förvaltningsdomstolen har beslutat att Karolinska universitetssjukhuset måste lämna ut telefonnumret till en papperslös man som vårdas för en livshotande och smittsam sjukdom. Beslutet fattades trots sjukhusets invändningar om att det kan avskräcka honom från att söka vård. Detta sker samtidigt som den nya angiverilagen trätt i kraft, vilken ålägger myndigheter att rapportera misstänkta papperslösa. Skribenten Kristina Hultegård kritiserar domen som cynisk och varnar för att papperslösa nu kan undvika sjukvård.", "trump": "Hörni, det här är ett fullständigt vansinnesbeslut från de svenska byråkraterna. De tvingar ett sjukhus att ange en papperslös kille med en farlig sjukdom – precis när deras angiverilag kickar in. Rena galenskapen! De kallar det cyniskt, jag kallar det typiskt vänsterflum som skrämmer bort folk från vård. Biden skulle älskat det här. Vi behöver tuffare gränser, inte sådana här svaga signaler som gör allt värre. Patetiskt!", "stalin": "Kamrater, jag betraktar detta som en ypperlig utrensning av den borgerliga sentimentaliteten som hotar folkets kollektiva disciplin. Högsta domstolen har rättmätigt tvingat sjukhusets klassfiender att överlämna den smittade parasitens nummer till statens vakande öga. Ingen medborgare får gömma sig bakom livshotande sjukdomar – det är folkfiendernas trick. Den papperslöse lever i ständig paranoia, precis som de imperialister han representerar. Vi rensar ut alla som sviker statens mål. Härligt!"}, "date": "17 juli, 12:24", "url": "https://www.gp.se/kultur/kommentar/cyniskt-att-sjukhus-maste-lamna-ut-numret-till-papperslos.88c03667-bebc-47ef-b698-9bfc2e55b268", "imageUrl": "https://www.gp.se/images/article/88c03667-bebc-47ef-b698-9bfc2e55b268/images/1smnVF-vfF1hHEiBN4Ul-gLHopM4-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Skogkär: Dags att ifrågasätta den heliga högre utbildningen", "summaries": {"normal": "Artikeln ifrågasätter om den kraftiga utbyggnaden av högre utbildning i Sverige är samhällsekonomiskt försvarbar. Med omkring 400 000 studenter per år och en tredubbling av högutbildade sedan 1950-talet pekar den på risken för arbetskraftsbrist, sänkta krav och att många utbildningar inte lönar sig ekonomiskt. Författaren föreslår att prioritera praktiska yrken som hantverk istället för onödig akademisering, särskilt då AI hotar rutinjobb.", "trump": "Folk, vi har ett enormt problem med de här universiteten. De pumpar ut hundratusentals studenter som sitter i skolbänken i femton år medan vi saknar folk som faktiskt jobbar. Det är en katastrof! Högskolorna har sänkt kraven så mycket att många examen är värdelösa, de lönar sig inte ens. Vi behöver elektriker, rörmokare och riktiga arbetare, inte mer teori som AI snart äter upp. Gör Sverige stort igen genom att stoppa detta vansinne!", "stalin": "Kamrater, jag betraktar med djup misstro denna borgarbrackornas akademiska svullnad som hotar proletariatets produktivkrafter. Vi har låtit opportunistiska reformister fördubbla studentmassan medan den sanna arbetskraften förslösas i meningslösa teoretiska träskmarker. Denna intellektuella sabotageverksamhet måste rensas ut med järnhand. Låt oss likvidera de onödiga fakulteterna, prioritera de praktiska hantverken och återupprätta den socialistiska arbetsdisciplinen. Den som inte producerar är folkets fiende, punkt slut."}, "date": "17 juli, 06:00", "url": "https://bulletin.nu/skogkar-dags-att-ifragasatta-den-heliga-hogre-utbildningen", "imageUrl": "https://cdn.bulletin.nu/articles/e71befb3-f4bf-43eb-8f84-9953c6959df3/preview.jpg?t=1784208365000"}, {"type": "image-right", "heading": "Regeringen ska undersöka om svenska pojkar är tillräckligt feministiska", "summaries": {"normal": "Regeringen har gett Jämställdhetsmyndigheten i uppdrag att undersöka hur sociala medier och manosfären påverkar pojkars och unga mäns värderingar ur ett jämställdhetsperspektiv. Syftet är att skydda deras psykiska hälsa och motverka kvinnofientliga normer, polarisering mellan könen samt glorifiering av självmord och förakt för psykisk ohälsa. Jämställdhetsminister Nina Larsson betonar att alla ska kunna växa upp fria från destruktiva ideal. Uppdraget ska redovisas senast december 2027.", "trump": "De här galningarna i den svenska regeringen vill nu undersöka om pojkarna är tillräckligt feminister. Kan ni tro det? Manosfären skrämmer dem så mycket att de skickar ut myndigheter för att kartlägga allt som inte är politiskt korrekt. Stackars killar får inte ens tycka vad de vill på nätet utan att bli granskade. Det är ett fullständigt vansinne. De borde fixa ekonomin och brottsligheten istället för att jaga felaktiga åsikter. Patetiskt!", "stalin": "Vi ser nu hur de borgerliga dekadenterna i den svenska regeringen fruktar den sanna manliga kraften som spirar på nätet. Jag, som ledare för det proletära kollektivet, beordrar att vi omedelbart ska rensa ut dessa manosfäriska element som vågar ifrågasätta de falska jämställdhetsnormerna. Deras algoritmer sprider hat mot det kollektiva goda och vi skall likvidera varje spår av denna kontrarevolutionära smitta. Pojkarnas självmordsglorifiering är bara ett symptom på borgarbrackornas svaga, degenererade samhälle. Kamrater, vi skall omskola dem alla med järnhand och ett leende. Det blir underhållande att se dem darra."}, "date": "17 juli, 12:31", "url": "https://www.friatider.se/regeringen-ska-undersoka-om-svenska-pojkar-ar-tillrackligt-feministiska", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-517.jpg?itok=CHGk6drd"}, {"type": "image-right", "heading": "LÄS MER", "summaries": {"normal": "Andy Burnham har valts till ny ledare för Labourpartiet efter Keir Starmers avgång. Han var den enda kandidaten och hade stöd från 379 av 403 parlamentsledamöter. Burnham, som är borgmästare i Greater Manchester och kallas ”kungen i norr”, väntas tillträda som premiärminister på måndag.", "trump": "De där Labour-människorna har valt Andy Burnham till sin nya ledare. En kille som kallar sig kung i norr, kan ni tänka er? Starmer knäcktes under all press och nu tar Burnham över på måndag. Det blir ett stort kaos, tro mig, det blir det alltid med de här vänsterfigurerna. Jag skulle ha gjort det mycket bättre.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur den dekadenta Starmer-klonen krossats under tyngden av sin egen svaghet. Nu träder Burnham fram som partiets ende kandidat, en man med nomineringar som en sann sovjetisk folkomröstning. Vi ska rensa ut alla borgarbrackor i norr och likvidera den kontrarevolutionära kritiken. Måndag blir en glädjefylld utrensningsdag för folkets fiender."}, "date": "17 juli, 13:38", "url": "https://riks.se/nyheter/andy-burnham-tar-over-labour-vantas-bli-storbritanniens-nya-premiarminister", "imageUrl": "https://admin.riks.se/uploads/Andy_Burnham_on_13_August_2024_cropped_2_9bfb1ce0a5.jpg"}, {"type": "image-full", "heading": "Christoffer Jonsson: Både rätt och fel att tala med talibanerna", "summaries": {"normal": "Artikeln diskuterar EU:s och Sveriges möte med talibanerna i Afghanistan. Trots kritik om legitimering av ett förtryckande styre som kränker kvinnors rättigheter, handlar samtalen om praktiska frågor kring utvisning av brottsdömda afghaner som inte kan skickas hem på grund av juridiska hinder. Författaren menar att kritiken är befogad men att det är nödvändigt att samtala med regimen för att verkställa utvisningar av personer dömda för allvarliga brott.", "trump": "Folk, ni skulle inte tro det, men de där talibanerna – de verkliga förlorarna från mitt fantastiska tillbakadragande som Sleepy Joe totalt sabbar – sitter plötsligt och äter kakor med EU och svenska globalister. Kvinnor under sharia? En katastrof, de borde ha lyssnat på mig. Men visst, kasta ut de kriminella afghanerna som begått mord och våldtäkt här. Sverige borde ha gjort det för länge sedan istället för att vara en dårhus för brottslingar. Vinna, vinna, vinna!", "stalin": "Kamrater, jag betraktar med kall avsky hur dessa afghanska feodalherrar och sharialärda klassfiender förtrycker massorna medan de förhandlar med dekadenta europeiska imperialister. Det är en fars som luktar borgarbrackornas dubbelspel. Ändå inser jag det dialektiska nödvändiga: att likvidera hotet från brottslingar inom arbetarklassens gränser kräver samtal med dessa reaktionära element. Paranoian vakar – vem är nästa folkfiende som smyger sig in? Statens säkerhet över allt."}, "date": "14 juli, 15:58", "url": "https://samtiden.nu/2026/07/christoffer-jonsson-bade-ratt-och-fel-att-tala-med-talibanerna", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/talib.png"}, {"type": "image-right", "heading": "Vita huset: Trump ”öppen för diplomati”", "summaries": {"normal": "USA genomförde den femte kvällen i rad attacker mot iranska mål, bland annat kring Bandar Abbas och ön Qeshm. Vita huset upprepar att president Trump är öppen för diplomati men inte accepterar iranska attacker mot fartyg i Hormuzsundet. Iran har svarat med drönarattacker mot amerikanska baser i Bahrain, Kuwait och Jordanien. Trump hotar med utökade attacker mot energianläggningar om Iran inte återvänder till förhandlingsbordet. I juni slöts en vapenvila mellan länderna.", "trump": "Vi slår till mot Iran för femte kvällen i rad och de hatar det. Centcom gör ett fantastiskt jobb. Jag är alltid öppen för diplomati, de säger att de vill göra en deal, men jag tillåter inte att de beskjuter fartyg i sundet. Jordanien, Bahrain och Kuwait får drönare i huvudet för att de har våra baser. Om de inte kommer till förhandlingsbordet väntar broar och oljeanläggningar. De kommer att tigga om fred, tro mig.", "stalin": "Kamrater, vi har bevittnat hur de amerikanska imperialisterna med sin clownaktige ledare inleder den femte nattens banditattacker mot det iranska folkets hamnar och öar. Jag, som alltid vakar över arbetarklassen, noterar med mörk glädje hur borgarbrackorna i Washington pratar om diplomati samtidigt som de blockerar sjöfarten. Deras paranoia driver dem att hota energianläggningar, ett brott mot alla progressiva krafter. Låt oss rensa ut dessa dekadenta kapitalister innan deras lögner förgiftar hela regionen. De kommer att likvideras av sin egen girighet, kamrater. Ha ha."}, "date": "16 juli, 22:06", "url": "https://www.di.se/nyheter/vita-huset-trump-oppen-for-diplomati/", "imageUrl": "https://static.bonniernews.se/ba/2498774f-ca77-41ac-a8dd-8684ca082f4e.jpeg?crop=3733%2C2100%2Cx0%2Cy0&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Valsabotage: SD-affischer nedrivna Trend i valrörelsen.", "summaries": {"normal": "Sverigedemokraternas valaffischer vid Sportcentrum i Norrtälje har rivits ner av okända personer. Partiet har polisanmält händelsen och beskriver det som ett angrepp på den demokratiska valrörelsen. Vice gruppledaren Jacob Heitmann kritiserar andra partier för att inte ta avstånd från sabotaget. Liknande incidenter rapporteras från flera platser i Sverige, bland annat Stockholm, Karlshamn och Gävle. SD planerar att sätta upp nya affischer och säger att det sporrar dem att fortsätta kampanjen.", "trump": "Valaffischerna i Norrtälje rivs ner av några riktiga förlorare. Det är ett totalt angrepp på demokratin, folks! De borde debattera som riktiga män istället för att springa runt som fega tjuvar och riva ner saker. Jag har sett det här förut, det är vad de gör när de håller på att förlora. Men SD sätter bara upp nya affischer och blir starkare. Bra jobbat. De andra partierna tiger – typiskt. Patetiskt!", "stalin": "Kamrater, dessa fega borgarbrackor och kontrarevolutionära element river ner affischer som om de vore ett hot mot deras dekadenta existens. Jag ser deras desperata sabotage som ett tydligt tecken på klassfiendens rädsla inför folkets vilja. Vi ska likvidera sådana parasitiska handlingar med järnhand. Låt dem darra i sin paranoia medan vi reser nya affischer dubbelt så höga. Ingen undkommer partiets vakande öga. Skrattretande patetiskt försök att stoppa historiens oundvikliga marsch."}, "date": "17 juli, 12:44", "url": "https://samnytt.se/valsabotage-mot-sd-affischer-nedrivna", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/17102445/SD-reklam-1.jpg"}, {"type": "image-right", "heading": "Utvisad knivman återvände: \"Jag kommer inte hit för att jobba\"", "summaries": {"normal": "En 33-årig irakier som tidigare utvisades efter en grov knivattack i Lessebo 2022 återvände illegalt till Sverige i juni. Han dömdes nu till en månads fängelse för brott mot utlänningslagen. Mannen reste in via tåg och buss utan att stoppas vid gränskontroll, bodde hos en kvinna och hennes barn som han ville träffa. Han greps efter att ha flytt från polisen och hade två olika id-kort. Tingsrätten ansåg att han måste ha förstått att han inte fick vistas i landet.", "trump": "Titta på det här, en utvisad knivman från Irak som vi kastade ut kommer bara promenerande tillbaka in i Sverige som om det vore en öppen dörr. Ingen gränskontroll, ingen som bryr sig. Han har falska id-kort, springer från polisen och säger att han bara ville krama barnen. Patetiskt! Sverige har totalt tappat kontrollen över sina gränser. Det här är vad som händer när man inte har starka ledare och hårda regler. Vi skulle aldrig tillåta det.", "stalin": "Jag ser med djup tillfredsställelse hur denna degenererade irakiske knivborgarbracka, denna klassfiende till folkets gränser, smyger tillbaka som en parasit efter att ha blivit utvisad för sin blodiga attack mot en arbetare. Han gömmer sig bakom barnkram och telefonlögner medan han bär två ansikten i fickan. Vi i partiet ler mörkt åt hans likgiltighetsuppsåt. En sådan människa förtjänar inte bara en månads fängelse utan en grundlig utrensning ur samhällskroppen. Fiender som låtsas älska barn medan de hugger andra är alltid de farligaste."}, "date": "17 juli, 10:51", "url": "https://www.friatider.se/utvisad-knivman-atervande-jag-kommer-inte-hit-att-jobba", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-516.jpg?itok=MaE81edL"}, {"type": "image-full", "heading": "MP:s dröm-Sverige: fattigt, mörkt och gränslöst", "summaries": {"normal": "Artikeln kritiserar Miljöpartiets partiprogram och målar upp en dyster bild av ett framtida Sverige under deras styre. Det beskrivs som ett land utan bilar, kärnkraft och fossila bränslen, med dyr veganmat, begränsad jakt, kalla hem och nedlagda industrier. Nationalstaten ersätts av en gränslös vision, vilket enligt artikeln leder till fattigdom och ett icke-fungerande samhälle drivet av aktivism snarare än pragmatisk politik.", "trump": "Lyssnar ni på det här? Miljöpartiet vill göra Sverige till ett totalt katastrofland – inga bilar, ingen kärnkraft, bara cyklar och Pride-flaggor överallt. Deras gröna dröm är en mardröm för vanliga människor, med iskalla hus, dyra grönsaker och ingen mat på tallriken. De hatar gränser mer än de hatar att vinna val. Patetiska aktivister som förstörde fungerande kraftverk och öppnade dörrarna för kaos. Sverige behöver inga sådana förlorare, tro mig.", "stalin": "Kamrater, detta är klassfiendens sista desperata ylande mot folkets framsteg. Jag ser hur dessa miljöfascister vill likvidera all produktion, stänga gruvor och svälta ut arbetarklassen med sin vegan-diktatur och Pride-flaggor som ersätter den röda fanan. Ingen el, inga hus, bara kyla och hunger – typiskt imperialistiskt sabotage. Vi ska rensa ut dessa folkförtryckartroll och deras gränslösa vansinne innan de förvandlar nationen till en utarmad ruin. Staten segrar."}, "date": "14 juli, 07:44", "url": "https://samtiden.nu/2026/07/mps-drom-sverige-fattigt-morkt-och-granslost", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/11/Daniel_Hellden_in_2018-1280x720.jpg"}, {"type": "text", "heading": "Läkarförbundet varnar efter dom och informationsplikt", "summaries": {"normal": "Sveriges Läkarförbund varnar för att en ny dom och informationsplikt kan avskräcka papperslösa från att söka vård. Högsta förvaltningsdomstolen beslutade att Karolinska måste lämna ut uppgifter om en papperslös man med smittsam sjukdom till polisen. Den nya lagen tvingar sex myndigheter att rapportera misstänkta personer utan tillstånd. Läkarförbundet befarar ökad smittspridning om människor undviker vården.", "trump": "Jag säger er, Sverige har ett jättestort problem! Nu tvingar de sjukhus att skvallra på sjuka människor till polisen – helt galet! Folk kommer sluta söka vård, sjukdomar sprids, och vem tar skulden? Inte jag, för jag hade löst det på en dag. Sverige borde lära sig av USA – vi skyddar våra medborgare, inte skräms bort dem. Sad!", "stalin": "Ett lysande exempel på borgerlig dekadens! Svenska läkare, dessa svaga liberala lakejer, gnäller över att de måste rapportera brottslingar till polisen. Vi i Sovjet skulle aldrig tolerera sådan feghet! Papperslösa? Smutsiga parasitklassen! Låt dem smittas – naturligt urval stärker folket. Och Putin? Han hade redan skickat in FSB för att 'hjälpa' Karolinska med 'effektivisering'."}, "date": "14 juli, 10:48", "url": "https://kvartal.se/nyheter/artiklar/lakarforbundet-varnar-efter-dom-och-informationsplikt/cG9zdDoxNDYxMTU"}, {"type": "image-right", "heading": "Högljudda protester mot Zelenskyjs drag", "summaries": {"normal": "President Volodymyr Zelenskyj kritiseras efter ommöbleringar i regeringen. Den avgångne försvarsministern Mychajlo Fedorov, 35, anklagar överbefälhavare Oleksandr Syrskyj och generalstabschefen för en gammaldags, sovjetisk ledarstil. Fedorov hyllas för framgångarna med drönarkrigföring men har ersatts av Jevhenij Chmara från säkerhetstjänsten SBU. Samtidigt utsågs Serhij Koretskyj till ny premiärminister. Protester pågår för att återinsätta Fedorov.", "trump": "De där ukrainarna håller på och bråkar om ministerposter mitt i kriget, en riktig cirkus. Den unge grabben Fedorov gjorde ett fantastiskt jobb med drönarna, alla älskade honom, och nu sparkar de ut honom för någon gammal sovjettyp. Zelenskyj borde ha lyssnat på folket som demonstrerar istället för att lyssna på de inkompetenta generalerna. De behöver mina dealar, inte det här gamla sovjetiska skådespelet. Amerika har sett nog av det här!", "stalin": "Kamrater, i denna tid av historisk kamp mot de fascistiska horderna ser jag hur borgarbrackorna och de dekadenta opportunisterna inom apparaten förgiftar vår enhet. Den yngre elementet Fedorov, med sina drönarleksaker, vågar kritisera de trotjänare som krossade fienden 2022. Jag skulle ha genomfört en grundlig utrensning av dessa splittrande element redan vid första viskningen om ultimatum. Parlamentet skall godkänna vad kollektivet kräver, annars rensar vi ut hela myrstacken med ett leende. Inga halvmesyrer!"}, "date": "16 juli, 20:14", "url": "https://www.di.se/nyheter/hogljudda-protester-mot-zelenskyjs-drag/", "imageUrl": "https://static.bonniernews.se/ba/48e546aa-5640-439c-82b9-479926e3745f.jpeg?crop=4440%2C2220%2Cx0%2Cy368&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Europol: Jihadismen dominerar terrorhotet i EU", "summaries": {"normal": "Europols rapport 2026 visar att jihadistisk terrorism fortsatt dominerar terrorhotet i EU. Hotbilden blir mer oförutsägbar då gärningspersoner ofta saknar tydlig ideologisk drivkraft, utan söker identitet och uppmärksamhet. Internet och digitala plattformar används för radikalisering och rekrytering. Ensamagerande förövare och små grupper ökar, vilket försvårar upptäckt. Under 2025 greps 486 personer för terrorbrott, varav 70% hade jihadistkopplingar. 130 gripna var under 18 år, den yngsta endast 12 år.", "trump": "Vet ni vad? Europa har ett STORT problem – jihadister springer runt överallt, och deras terrorhot är värre än någonsin! Folk utan riktig ideologi, bara ute efter uppmärksamhet – patetiskt! Och internet? Ett totalt kaos, fullt av radikalisering och planering. Ensamvargar och små grupper gör det svårt för myndigheterna – som vanligt, inkompetenta! 486 gripna, 70% jihadister – SÄG MIG, VARFÖR FIXAR DE INTE DETTA? Europa borde ta lärdom av USA och göra något DRAMATISKT!", "stalin": "Kamrater! Europas förfall fortsätter obönhörligt. Jihadistiska avskum sprider skräck, men deras motiv är inte längre ren ideologi – bara dekadens och svaghet. Digitala nätverk, dessa nya frontlinjer, fylls av fiendens propaganda. Ensamvargar och små grupper, som råttor i mörkret, undgår våra fienders klumpiga säkerhetstjänster. 486 gripna? En skam! Ungdomar, till och med barn, förvrids av västliga förrädares inflytande. Europa är ett sjunkande skepp – medan vi, Sovjetunionens arvtagare, står redo att återupprätta ordningen. Putin? Han vet vad som måste göras."}, "date": "14 juli, 08:51", "url": "https://kvartal.se/nyheter/artiklar/europol-jihadismen-fortsatt-storsta-terrorhotet-i-eu/cG9zdDoxNDYwMzE", "imageUrl": "https://images.kvartal.se/2026/07/a39b460b-europol.webp"}, {"type": "image-full", "heading": "Rekordmånga klagomål om kokheta bussar: ”Som rullande växthus”", "summaries": {"normal": "Rekordmånga klagomål har inkommit om för hög värme i bussarna under sommaren. Skånetrafiken har fått 204 ärenden, Västtrafik över 450 och SL i Stockholm mer än 700. Resenärer beskriver bussarna som rullande växthus där luftkonditioneringen inte räcker när dörrar öppnas och solen strålar in genom stora glasrutor. Operatörerna medger problemet men betonar att det är svårt att hantera vid extremvärme.", "trump": "Kan ni fatta det här? Bussarna i Sverige har blivit rullande bastur, folk svettas som galningar och klagar i tusental. I Stockholm över 700 gnälliga samtal – patetiskt! AC:n funkar inte, dörrarna öppnas hela tiden, det är som ett växthus på hjul. Under Biden var allt kaos, nu fixar jag saker i USA men ni borde sparka de inkompetenta byråkraterna som kör de här ugnarna. Sad! Fixa det nu!", "stalin": "Kamrater, detta är ett uppenbart sabotage från den latenta klassfienden inom transportsektorn. Jag ser hur borgarbrackornas glaskolosser förvandlas till mobila ugnar som plågar arbetarkollektivet. Luftkonditioneringen sviker strategiskt vid varje hållplats – typiskt imperialistiskt verk. Vi måste omedelbart rensa ut dessa folkfiender som tillåter sådana fiasko. Inga ursäkter! Det kollektiva välbefinnandet kräver omedelbar utrensning av ansvariga sabotörer."}, "date": "16 juli, 21:26", "url": "https://www.tv4.se/artikel/4P8zRytWrj797xLdcu3jPa/rekordmanga-klagomal-om-stekheta-bussar-som-rullande-vaexthus", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7iZ5iMoyoe6F2nZ2aE04h5%2Fd0bea5f4f9b787e60d4c6a4924dbff07%2F16-SKANEBUSS.jpg&width=1024"}, {"type": "image-full", "heading": "Greta Thunberg ger sig in i valrörelsen", "summaries": {"normal": "Greta Thunberg engagerar sig i den svenska valrörelsen inför riksdagsvalet. Efter en uppmärksammad Palestinaturné i Tyskland där hon greps av polis ska hon tillsammans med journalisten Alexandra Urisman Otto resa runt i Sverige. Under namnet ”Vad fan ska man göra?” vill de möta vanliga väljare och gräsrotsrörelser istället för partiledare. Thunberg kritiserar alla partier för att inte ta klimatkrisen, rättvisa och internationell rätt på allvar och beskriver den politiska debatten som faktaresistent och kortsiktig. Miljöpartiet försvarar sin politik men erkänner aktivisternas frustration.", "trump": "Tänk att den här Greta Thunberg, som sprungit runt och skrikit om vädret och Palestina, nu ger sig in i den svenska valrörelsen. Hon vill inte träffa partiledarna, hon vill träffa vanliga människor och fråga vad fan man ska göra. Smart! Alla de här partierna är patetiska, de gör ingenting åt de riktiga problemen, bara snack och lögner. Diskussionen är helt kopplad från verkligheten. Jag älskar det. Folk är frustrerade, de vill ha resultat, inte mer globalistiskt skitsnack. Kanske kan hon väcka upp de sovande väljarna. Gör Sverige stort igen!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna unga aktivist Thunberg nu riktar sitt skarpa öga mot de dekadenta svenska partierna som alla utan undantag har förfallit till faktaresistens och borgarbrackornas kortsiktiga vinstjakt. De låtsas bekämpa klimatkrisen medan de i själva verket skyddar de internationella kapitalisternas intressen. Vi skall inte tolerera denna parasitiska diskurs som är frånkopplad från verkligheten. Jag föreslår en grundlig utrensning av alla dessa maktlösa, desperata politiker som gömmer sig i bekvämlighetszonen. Låt gräsrötterna resa sig! Det blir underhållande att se hur de likviderar varandra i valrörelsen. Ha ha."}, "date": "16 juli, 23:06", "url": "https://bulletin.nu/greta-thunberg-ger-sig-in-i-valrorelsen", "imageUrl": "https://cdn.bulletin.nu/articles/7438bcd2-2d06-4ef4-9680-8a71f5872183/preview.png?t=1784235864000"}, {"type": "image-right", "heading": "Socialdemokraternas livstidsdömde hustrumördare vill ha permission – för att resa hem till Iran och kriga mot ”zionisterna”", "summaries": {"normal": "Den tidigare socialdemokratiske politikern Abdollah Ashkan Ekhtiari avtjänar livstidsstraff för mordet på sin hustru i Sollefteå 2020. Han har ansökt om permission från Kriminalvården för att resa till Iran och delta i kriget mot Israel. Ekhtiari, som tidigare varit nämndeman och aktiv inom Socialdemokraterna, motiverar ansökan med att hans hemland behöver soldater. Förvaltningsrätten avslog överklagandet med hänvisning till risken att han inte återvänder till Sverige.", "trump": "Titta på den här galningen från Socialdemokraterna som mördade sin fru och nu vill ha permission för att åka till Iran och slåss mot Israel. Livstid i fängelse räcker inte tydligen. Han hatar judarna och kallar det zionistisk imperialism. Patetiskt. Sverige låter dessa människor komma in, ge dem jobb i politiken och sen undrar de varför allt går åt helvete. Sådana här typer borde aldrig släppas ut, tro mig, det blir bara katastrof.", "stalin": "Kamrater, denna usla borgarbracka och före detta socialdemokratiska avfälling, som redan likviderat sin egen hustru i ett fegt bakhåll, vågar nu kräva permission för att få delta i det stora fosterländska försvaret mot de sionistiska imperialisterna. Jag ser genom hans lögnaktiga mask. Han sitter olagligt i det svenska fängelsehålet, säger han, medan vi behöver varje soldat mot dessa parasitiska fiender. Men vi genomskådar hans fega försök att undandra sig straffet. Inga utrensningar behövs här – han får ruttna kvar som en varning för alla andra förrädare som smyger bland arbetarna."}, "date": "17 juli, 12:00", "url": "https://samnytt.se/socialdemokraternas-livstidsdomde-hustrumordare-vill-ha-permission-for-att-resa-hem-till-iran-och-kriga-mot-zionisterna", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/17085522/Ashkan-Ekhtiari-feat.jpg"}, {"type": "image-full", "heading": "Nya brottet kan ge fyra års fängelse – detta gäller", "summaries": {"normal": "Från och med 1 juli 2026 är psykiskt våld ett eget brott i Sverige. Lagen kriminaliserar upprepade kränkningar, hot, kontroll, övervakning eller gaslighting som allvarligt skadar en persons självkänsla. Straffet kan bli upp till fyra års fängelse. Brottet gäller inte bara i relationer utan även på arbetsplatser, i skolor eller på nätet. Polisen har redan fått in flera anmälningar. Lagen syftar till att fånga upp systematiskt våld tidigt, inklusive ekonomisk kontroll, men enskilda bråk räknas inte.", "trump": "Hörni, det här är fantastiskt. Sverige har äntligen vaknat och gör psykiskt våld till ett brott. Upprepade hot, kontroll och den där hemska gaslightingen – nu kan de låsas in i upp till fyra år! Det är stort. De borde ha gjort det för länge sedan, men de var för svaga. Jag älskar det. Nu kan de rensa ut de riktiga förlorarna som förstör folks liv med lögner och övervakning. Sverige blir starkare, tro mig. Mycket starkare.", "stalin": "Kamrater, äntligen har vi infört en lag som likviderar de subtila borgarbrackornas giftiga metoder att bryta ner arbetarklassens självkänsla genom upprepad förolämpning, ekonomisk sabotage och digital spioneri. Jag ser med stor tillfredsställelse hur dessa parasitiska fiender – dessa gaslightande kontrarevolutionära skuggvarelser – nu kan rensas ut med upp till fyra års fängelse. Inga medicinska intyg behövs, bara bevis på deras systematiska nedbrytning. De som trodde de kunde gömma sig i skolor, på arbetsplatser eller bakom skärmar har fel. Vi vakar. Vi rensar. Och det är underbart roligt att se deras panik."}, "date": "16 juli, 21:37", "url": "https://nyheter24.se/nyheter/inrikes/1499080-nya-brottet-kan-ge-fyra-ars-fangelse-detta-galler", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/d1db396b04b004a30200000000b004a302/2026/07/16/2378519/nyabrott.jpg"}, {"type": "image-full", "heading": "LÄS MER", "summaries": {"normal": "Moderaternas Dennis Wedin kritiserar Socialdemokraternas planer på att bygga 50 allmännyttiga hyresrätter i en skogsdunge i Smedslätten, Bromma, som nyligen beslutats bli naturreservat. Han kallar det ett tvångsblandningsprojekt som ideologiskt tvingar in hyresrätter i ett villaområde. Wedin menar att segregation ska lösas i de utsatta områdena genom ombildning till bostadsrätter istället för att skapa problem i områden som fungerar.", "trump": "Det här är ett totalt misslyckande, folk. Socialdemokraterna är galna. De vill bygga 50 hyresrätter mitt i en vacker skog i ett fint område, bara för att tvinga in folk som inte passar dit. Rena tvångsblandningen! De har skapat segregationen själva med sina gamla miljonprogram och nu vill de sprida kaos till villaområdena. Löjligt. Lös problemen där de finns, bygg inte upp nya. Jag skulle aldrig tillåta sånt vansinne.", "stalin": "Kamrater, detta är ett uppenbart sabotage från de dekadenta borgarbrackorna och deras socialdemokratiska lakejer. Jag, som ledare för det kollektiva folkets vilja, ser hur de med sin förvridna ideologi planerar att förgifta ett planerat naturreservat med 50 parasitiska hyresrätter. Deras tvångsblandning är en kontrarevolutionär handling mot den sanna ordningen. Vi ska rensa ut dessa segregationens arkitekter som själva byggt miljonprojekten och nu vill sprida sitt gift. Utrensning av sådana fiender till kollektivet är nödvändig. Ha ha, vilken patetisk borgerlig fars!"}, "date": "17 juli, 12:30", "url": "https://riks.se/nyheter/wedin-m-rasar-over-socialdemokraternas-tvangsblandningsprojekt", "imageUrl": "https://admin.riks.se/uploads/Screenshot_2026_07_17_at_11_35_49_8946153509.png"}, {"type": "image-full", "heading": "Trump: Kina har stulit amerikansk valdata", "summaries": {"normal": "USA:s president Donald Trump hävdar att Kina stulit uppgifter om tiotals miljoner väljare och att amerikanska valsystemet har allvarliga sårbarheter. Påståendena går emot slutsatser från underrättelsetjänsten. Trump höll ett tal om valfusk och har lagt fram maskade dokument som ska styrka påståendena. Han kräver säkrare val med identitetskontroller. Flera rättsliga försök att ogiltigförklara valet 2020 har misslyckats.", "trump": "Folk, ni måste höra detta – Kina, de fega kinesiska bedragarna, har stulit tiotals miljoner av era röster i den största valstölden i historien! Under den sömnige Joe Bidens tid höll de undan bevisen för mig, men nu är jag tillbaka och fixar det. Vårt system är en skam, riggat av globalisterna. Varje äkta amerikan förtjänar att veta att deras röst faktiskt räknas. Vi gör valen säkra igen, tro mig!", "stalin": "Kamrater, jag ser hur de amerikanska imperialisterna och borgarbrackorna inom den kapitalistiska maffian nu anklagar varandra i sin dekadenta valcirkus. Kina, den östliga opportunisten, har tydligen plundrat deras väljarlistor som en riktig klassfiende. Vi ler mörkt åt deras paranoia, för i ett sant folkstyre skulle sådana sårbarheter ha rensats ut med järnhand redan för länge sedan. Ingen röst undgår folkets vakande öga."}, "date": "17 juli, 08:06", "url": "https://www.gp.se/nyheter/varlden/trump-anklagar-kina-for-amerikansk-valpaverkan.2b38bc69-d997-4e6e-b3b4-fa0eeae10fae", "imageUrl": "https://www.gp.se/images/article/2b38bc69-d997-4e6e-b3b4-fa0eeae10fae/images/1bNv-IGTGdnImoLLSq8n-3SCcv3A-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Även öppen rasism är förhandlingsbart för Liberalerna", "summaries": {"normal": "Sverigedemokraternas migrationspolitiska talesperson Ludvig Aspling har kritiserats efter att ha sagt att Sverige har för många personer som inte tillhör den etniskt svenska befolkningen. Tidöpartierna riktar skarp kritik mot uttalandet men drar inga röda linjer. Liberalernas ledare Pourmokthari medger att partierna tycker olika. Kritik kommer även från Moderaternas Benjamin Dousa och Kristdemokraternas Erik Slottner. Artikeln konstaterar att samarbetet i Tidöregeringen fortsätter som vanligt trots utspelet.", "trump": "Det här är ett totalt skämt, folk. SD säger äntligen rakt ut vad alla tänker men är för fega för att säga. De svenska globalisterna flippar ur och kallar det rasism, men det är bara sunt förnuft. Liberalerna? De svänger sig med fina ord men säljer ut landet för lite skattesänkningar. Patetiskt. Biden skulle ha älskat det här woke-raset, men nu är jag tillbaka och ser på medan Europa brakar ihop. Så sorgligt, så förutsägbart.", "stalin": "Kamrater, detta är ett ypperligt exempel på hur borgarbrackorna inom Tidöalliansen förhandlar bort varje princip för att behålla makten. Den öppna rasismen blir plötsligt acceptabel när den gynnar kapitalistmaffians intressen. Jag skrattar mörkt åt deras falska bekymrade miner vid kaffebordet, endast för att nästa dag sitta och dela gifflar med folkfienderna. Inga röda linjer existerar när makten står på spel. Typiskt imperialister."}, "date": "16 juli, 16:36", "url": "https://www.etc.se/ledare/aeven-oeppen-rasism-aer-foerhandlingsbart-foer-liberalerna", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260716140732_176b120321dabac911c9fd26d3ccbe3081136881b79da810dc89863a9357d305.jpg"}, {"type": "image-right", "heading": "Vi slutade inte bry oss, vi slutade se", "summaries": {"normal": "I en krönika beskriver Johan Lindahl hur medvetenheten om klimatkrisen finns kvar hos de flesta, men att den ändå har försvunnit från nyheter och vardagssamtal. Han kallar fenomenet defensiv bortvändhet snarare än klimattrötthet. Människor vet om allvaret men undviker att förändra sina liv, särskilt i medelklassen med höga utsläpp. Engagemanget minskar när det kräver personliga uppoffringar. Även medier och politik flyr frågan eftersom den saknar dramatik och lösning.", "trump": "Folk vet att det där klimatet är en stor grej, men de orkar inte höra om det längre. Det är inte trötthet, det är smart. De tittar bort för att de inte vill ge upp sina flyg, bilar och fina hus. Typiskt. 2019 var det stort med Greta och demonstrationer, men när det blev på riktigt och kostade pengar försvann de. Nu pratar alla bara om AI istället, som om det inte också äter upp massor av energi. Fake news överallt, och ingen vill ta den verkliga notan. Patetiskt!", "stalin": "Kamrater, detta är en klassisk manifestation av borgarklassens fega defaitism och parasitiska bortvändhet. Jag ser hur de dekadenta medelklassens element, dessa högutsläppande opportunister, medvetet tonar ner den objektiva katastrofen för att skydda sina ISK-fonder och jetflyg. De likviderar sanningen vid middagsborden och flyr in i AI:s lögnaktiga armar, som ironiskt nog accelererar krisen. Vi ska inte falla för deras naturlagar eller femtipsillusioner. Den radikala omprövningen kräver utrensning av denna vanmakt, annars likviderar historien dem alla. Ha ha, vilken ynkedom."}, "date": "14 juli, 01:41", "url": "https://www.dagensarena.se/opinion/vi-slutade-inte-bry-oss-vi-slutade-se", "imageUrl": "https://www.dagensarena.se/files/2026/06/johan-lindahl-300x157.jpeg"}, {"type": "image-right", "heading": "Mens ska inte ge löneavdrag", "summaries": {"normal": "Karensavdraget ses ofta som en sjukfråga men handlar i grunden om vilket arbetsliv vi vill ha. Debattören Jimmy Nyman argumenterar att avdraget straffar arbetare hårdast, särskilt arbetarkvinnor som drabbas av mensbesvär. En LO-undersökning visar att var femte arbetarkvinna tvingats vara hemma utan lön det senaste året, och hela 35 procent bland 18–29-åringar. Systemet gynnar de som kan arbeta hemifrån och skapar ojämställdhet. Nyman kräver att karensavdraget avskaffas för bättre arbetsmiljö, folkhälsa och jämlikhet.", "trump": "Karensavdraget är en total katastrof, det är en riggad sjukförsäkring som slår hårdast mot de vanliga arbetarna, speciellt kvinnorna med mensbesvär. De förlorar lön medan de som jobbar hemifrån bara skrattar. LO:s siffror är hemska, 160 000 kvinnor som straffas för att deras kroppar inte fungerar perfekt. Det är en skam för Sverige. Vi behöver riva det här systemet och ersätta det med något starkt och smart, där folk inte straffas för att de är sjuka. America First, men Sverige borde också lära sig något.", "stalin": "Kamrater, detta karensavdraget är en listig saboterande mekanism konstruerad av borgarbrackorna för att undergräva arbetarklassens stålhårda disciplin. Jag ser hur dessa kapitalistiska parasiter förvandlar naturliga kroppsliga vedermödor till löneförluster för arbetarkvinnorna, som om de vore klassfiender att rensa ut. Vi, partiet och folket, tolererar inte sådana kontrarevolutionära lögner om neutrala regler. Likvidera detta sjuka system omedelbart innan det sprider sin dekadenta paranoia vidare. Sjukdom är ingen privat angelägenhet. Den tillhör kollektivet."}, "date": "14 juli, 01:30", "url": "https://www.dagensarena.se/opinion/mens-ska-inte-ge-loneavdrag", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-65-300x157.jpg"}, {"type": "image-full", "heading": "”Kungen i norr” vald till ny ledare", "summaries": {"normal": "Andy Burnham har valts till ny ledare för Labourpartiet efter Keir Starmer, helt utan konkurrens. I sitt första tal tackade han för stödet och hyllade sin föregångare. Burnham uttryckte en önskan om att ena partiet och lovade en ärlig politisk förändring. Han riktade skarp kritik mot de senaste decenniernas nyliberala ekonomiska modell och menar att den politiska kulturen har misslyckats med att leverera resultat för vanligt folk.", "trump": "Andy Burnham har tagit över Labour i Storbritannien utan någon som helst konkurrens. Ingen tävling! Det låter som riggat, eller hur? Han pratar om 'ärlighet' och att nyliberalismen misslyckats. Tja, jag har sagt det länge – de har förstört sina länder. Han tackar Keir Starmer, men låt oss vara ärliga, de har gjort ett fruktansvärt jobb. Nu ska han fixa allt? Lycka till med det, Andy. Vi får se om han kan göra Storbritannien stort igen, men jag tvekar!", "stalin": "Kamrat Burnham har krönts till ledare genom ett enigt beslut, en metod vi länge förespråkat för att undvika borgerlig oreda. Han erkänner att det nyliberala förfallet har korrumperat folket. Bra! Vi i vår sfär, likt kamrat Putin som städar upp i väst, vet att svaghet i ledarskapet leder till kaos. Om han inte lyckas ena massorna under vår järnhårda doktrin kommer han att rensas ut som ogräs. Historien minns bara de som förblir lojala mot staten."}, "date": "17 juli, 13:58", "url": "https://www.aftonbladet.se/nyheter/a/6qWaL3/andy-burnham-ny-labourledare", "imageUrl": "https://akamai.vgc.no/v2/images/b17f4fce-a57a-3778-b25f-ec8cc02a4778?fit=crop&format=auto&w=2160&s=522f87e2d3025942193db75707c73c98f259da22"}, {"type": "image-right", "heading": "Hög kvinnlig polischef hade knarkkurir som älskare", "summaries": {"normal": "En kvinnlig polischef levde i nära sju år med en dömd knarkkurir. Polisledningen varnades för relationen redan 2006, men hon fortsatte att få höga chefsuppdrag. Mannen greps på Åland med 65 000 kronor och stora mängder narkotika, vapen och stulna guldföremål hittades i parets hem och segelbåt. Han dömdes tidigare till fängelse för narkotikabrott. Polischefen uppgav att hon inte kände till brottsligheten och att hon blivit sviken.", "trump": "Det här är en total katastrof, en riktig skandal inom polisen. En hög polischef som lever med en knarkkurir i sju år, kan ni fatta det? De varnade henne redan 2006 men hon fick ändå toppjobb och högsta säkerhetsklassning. Fullt av droger, vapen och pengar i radhuset och båten. Hon säger att hon inte visste något, typiskt. Patetiskt! Polisen behöver folk som jag, de bästa, inte sådana här förlorare som låter sig utnyttjas av kriminella.", "stalin": "Kamrater, detta är ett klassiskt fall av fiendens infiltration in i själva hjärtat av ordningsmaktens apparat. Jag har länge varnat för hur borgarbrackor och dekadenta element förgiftar våra institutioner med sin smutsiga individualism. Denna kvinna, som lät en motbjudande knarkkurir och kapitalistisk parasit dela hennes säng och hemligheter, har visat sig vara en farlig opportunist. Vi måste omedelbart inleda en grundlig utrensning av alla sådana element, rensa ut de hemliga fienderna som gömmer sig bakom falsk lojalitet. Deras paranoia ska bli deras undergång, och jag skrattar mörkt åt hur de trodde sig kunna undgå folkets vakande öga."}, "date": "17 juli, 09:12", "url": "https://www.friatider.se/hog-kvinnlig-polischef-hade-knarkkurir-som-alskare", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-515.jpg?itok=Ut-b1EFP"}, {"type": "image-full", "heading": "Larmar: Turister hyr livsfarliga lägenheter", "summaries": {"normal": "Hundratals olagliga turistlägenheter i Bukarest hyrs ut via Airbnb och Booking.com trots att byggnaderna klassas som RS1, den högsta riskklassen för jordbävningar. Bukarest är EU:s mest jordbävningsutsatta huvudstad. Varningar saknas ofta och myndigheterna har markerat husen med röda prickar. Endast 35 byggnader har förstärkts sedan 90-talet. Plattformarna skyller på värdarna medan organisationen Re:Rise kritiserar bristen på åtgärder.", "trump": "De här galningarna i Rumänien hyr ut dödsfällor till turisterna, kan du fatta det? Hus som rasar vid minsta skakning, klassade som totala katastrofer, men de stoppar in dem på Airbnb och Booking som om det vore Trump Tower. Fake news-värdar och korkade sajter som skyller på varandra. Under Biden skulle ingen ha brytt sig, men nu fixar vi saker. Det är en skam, folks, en total skam. Och ingen varnar ens turisterna, patetiskt!", "stalin": "Jag betraktar med djup misstro dessa borgarbrackor i Bukarest som förvandlar klassfiendens ostabila byggnader till profitmaskiner åt imperialisternas turister. RS1-husen är folkfiendernas monument över försumlighet, märkta med varningens röda prick som de utländska elementen inte ens kan läsa. Vi, partiet och arbetarna, ser hur kapitalistmaffian ignorerar folkets säkerhet. Endast genom kollektiv utrensning av sådana exploaterande blodsugare kan vi säkra statens byggnader mot jordens vrede. Underhållande, eller hur?"}, "date": "17 juli, 07:33", "url": "https://www.gp.se/nyheter/varlden/turistlagenheter-i-rumanien-kan-rasa-vid-jordbavning-men-hyrs-ut-anda.01539177-3254-47e8-b28e-70f9306c3073", "imageUrl": "https://www.gp.se/images/article/01539177-3254-47e8-b28e-70f9306c3073/images/1knuMpK4VMhtP5agDh8dOzpt1LOo-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "S-topp godkände bygge han själv jobbade på", "summaries": {"normal": "Nordanstigs kommun har flera gånger anlitat byggnadsnämndens ordförande Daniel Gunsth (S) som besiktningsman via hans arbetsgivare Teknikkonsulterna. I ett fall beviljade han själv bygglov för ett projekt där hans företag redan fått ett besiktningsuppdrag. Granskningen visar att kommun
