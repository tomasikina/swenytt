p, och Fifa borde ge dem en rejäl smäll på fingrarna. Jag menar, vem tror de att de är? England vann ju nästan ändå! Men nej, Argentina måste alltid ställa till det. Fifa, ge dem böter – stora böter!", "stalin": "De argentinska kapitalistiska lakejerna vågar utmana den brittiska imperialismens heliga gränser! Med sina provokativa banderoller om Malvinerna försöker de underminera den globala ordningen. Men vi vet sanningen – alla territorier tillhör folket, och vi kommer inte tolerera sådana borgerliga upptåg. Fifa bör straffa dem hårt, annars får vi ta saken i egna händer. England, var redo – vi står bakom er, som alltid mot de fascistiska kränkningarna!"}, "date": "16 juli, 06:07", "url": "https://kvartal.se/nyheter/artiklar/argentina-riskerar-fifa-boter-efter-forbjudet-firande/cG9zdDoxNDcyNDI", "imageUrl": "https://images.kvartal.se/2026/07/40374cfe-argentina-firande.webp"}, {"type": "image-right", "heading": "Netflix väntas leda nedgång på New York-börsen", "summaries": {"normal": "Amerikanska börserna förväntas öppna lägre, med Nasdaq i spetsen för nedgången. Netflix rapporterade kvartalsresultat i linje med förväntningarna, men svagare prognos för Q3 fick aktien att falla över 11%. Alcoa missade analytikernas vinstprognoser och sänkte produktionsprognosen, vilket pressade aktien. Paypals styrelse avvisar ett bud från Stripe och Advent International som undervärderande. SpaceX avbröt en Starship-uppskjutning efter motorproblem, vilket sänkte aktien. Räntan på 10-åriga amerikanska statsobligationer sjunker något.", "trump": "Vad händer med marknaden? En total katastrof, folks! Netflix, som alla älskade, levererar siffror som är sådär – svag guidning, aktien rasar som en sten. Alcoa? Patetiskt! Missar vinster och sänker prognoser. Och PayPal – de avvisar ett bud på 53 miljarder, kan ni tro det? Löjligt! SpaceX, Elons lilla projekt, ställer in uppskjutningar igen. Rymden är svår, men inte så svår! Räntorna sjunker, men vem bryr sig? Vi behöver VINNA igen!", "stalin": "Kapitalistiska börserna darrar inför den oundvikliga krisen! Netflix, detta dekadenta verktyg för imperialistisk propaganda, visar svaghet och aktien kollapsar. Alcoa, en gång stolt aluminiumjätte, nu reducerad till ynkliga siffror och sänkta prognoser. PayPal, detta borgerliga betalningsinstrument, avvisar kapitalistiska rovdjur – men deras tid är ändå kommen. SpaceX, Putins amerikanska kusin i rymdracet, misslyckas igen. Raketer som inte startar – en metafor för hela den förfallna västvärlden! Räntorna sjunker, men det är bara början på deras undergång."}, "date": "17 juli, 15:09", "url": "https://www.affarsvarlden.se/artikel/netflix-vantas-leda-nedgang-pa-new-york-borsen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2022/02/sdlEPlp-klTneM-nh-400x267.jpg"}, {"type": "image-right", "heading": "EU lättar på klimatregler för industrin", "summaries": {"normal": "EU-kommissionen föreslår lättnader i utsläppshandeln (ETS) så att industrin kan släppa ut mer under längre tid. Förslaget går emot svenska regeringens och näringslivets linje som vill behålla strikta regler för att minska beroendet av fossila bränslen. Kommissionen behåller gratis utsläppsrätter men villkorar dem till klimatinvesteringar och skärper kraven på hur intäkter används. Klimatkommissionär Wopke Hoekstra försvarar förslaget som företagsvänligt och nödvändigt för att nå EU:s utsläppsmål till 2040. Åsikterna är starkt delade och förhandlingarna fortsätter i EU-parlamentet och ministerrådet.", "trump": "De där EU-byråkraterna har äntligen vaknat och lättar på sina vansinniga klimatregler för industrin. De släpper ut mer, precis som jag alltid sagt – det är smart och företagsvänligt! Den svenska regeringen och alla gröna galningar hatar det förstås, de vill hellre förstöra sin industri med dyra regler. Men Hoekstra har rätt, ETS har redan halverat utsläppen och nu fixar vi målen utan att offra jobb. Fantastiskt! De borde ha lyssnat på mig från början, ingen gör det bättre än mig.", "stalin": "Kamrater, borgarbrackorna i Bryssel har nu avslöjat sin sanna, kapitulationistiska natur genom att bromsa den revolutionära utsläppsminskningen. Jag, som alltid vakar över folkets kollektiva framsteg, ser hur dessa fossilberoende sabotörer och värmebölje-fascister försöker rädda sina kapitalistiska profitmaskiner. Vi ska likvidera varje svag kompromiss och tvinga industrin att investera hundra procent i folkets klimatkamp. De som vägrar blir rensade ut som kontrarevolutionära oljebaroner. Inga halvmesyrer! Framtiden tillhör bara de som krossar fienden med järnhand och stålvilja."}, "date": "17 juli, 14:42", "url": "https://www.di.se/nyheter/eu-lattar-pa-klimatregler-for-industrin/", "imageUrl": "https://static.bonniernews.se/ba/efaa67c2-6787-47f7-b0fd-63676a33c216.jpg?crop=4447%2C2224%2Cx0%2Cy471&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Fick elstöt av fotbollsspel i Italien – dog", "summaries": {"normal": "En 15-årig italiensk pojke dog efter att ha fått en kraftig elchock när han spelade på en sparkmaskin, en så kallad Calciometro, på en nöjespark i Spotorno i Ligurien. Olyckan inträffade under torsdagskvällen efter ett kraftigt skyfall som troligen lett till att regn trängt in i maskinens elektronik. Pojken, som var barfota, fördes till sjukhus men avled efter tre timmars återupplivningsförsök. Nöjesparken har stängts och en utredning har inletts.", "trump": "Folk, det här är så tragiskt, en 15-årig kille i Italien sparkar på en bollsak på nöjesparken och får en enorm elchock, pang, dör han. Regnet hade förstört maskinen, typiskt, ingen bryr sig om säkerheten längre. Borgmästaren stänger parken, smart, men det borde aldrig ha hänt. Vi gör maskiner bäst här, de säkraste, ingen dör på Trumps nöjesparker, tro mig. Tankar till familjen, det är en katastrof.", "stalin": "Kamrater, jag betraktar med djup revolutionär vrede hur denna sabotöriska sparkmaskin, infiltrerad av fientliga regndroppar och dekadenta borgarbrackors oaktsamhet, likviderade en ung socialistisk pionjär i Ligurien. Vi ska omedelbart inleda en grundlig utrensning bland de parasitiska underhållningsapparaterna och deras kapitalistiska ägare. Tre timmars kamp mot döden var förgäves, typiskt för klassfiendens maskineri. Nöjesparken stängs, som den kontrarevolutionära hålan den är. Säkerheten tillhör folket, inte väder och ovärdiga bollar."}, "date": "18 juli, 05:22", "url": "https://www.gp.se/nyheter/varlden/15-arig-pojke-dod-fick-elchock-av-spel-pa-nojespark-i-italien.b2cb7ae2-c4c7-4bdb-98af-16a5bdf26a0d", "imageUrl": "https://www.gp.se/images/article/b2cb7ae2-c4c7-4bdb-98af-16a5bdf26a0d/images/1zcCv-w741V3DnOJmhuZNMw-0zFY-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "På vårt BB måste pappor stå i korridoren hela natten", "summaries": {"normal": "Tidöregeringen har kritiserats för nedskärningar inom förlossningsvården trots löften om storsatsningar. Barnmorskor vittnar om en ohållbar arbetsmiljö med resursbrist, underbemanning och hotad patientsäkerhet. I orter som Huddinge och Malmö leder besparingarna till att vårdplatser stängs och anhöriga får ta ett större ansvar. Kritik riktas mot regeringens retorik, som anses stå i kontrast till den verklighet personalen möter dagligen, där kravet på fler anställda är akut för att säkerställa säker vård.", "trump": "Titta på vad som händer i Sverige, det är en total katastrof! De pratar om 'satsningar', men allt de gör är att skära ner. Förlossningsvården är i spillror, barnmorskorna gråter – jag har hört det, mycket sorgligt. De har inte ens bänkar åt papporna, kan ni tänka er? Bedrövligt. Regeringen där borta har ingen aning om hur man sköter saker. Jag skulle fixa det på en dag, tro mig. De behöver ledarskap, inte brutna löften. Total inkompetens!", "stalin": "Dessa svenska byråkrater är som de gamla feodala herrarna; de lovar guld och gröna skogar men levererar endast papper och elände. Att låta mödrar lida för att spara ören är sabotage mot statens framtid. De är svaga, precis som de dekadenta västmakterna som nu darrar inför den ryska björnens utvidgning. Vi i staten kräver ordning! Om en barnmorska inte räcker till, låt de skyldiga politikerna bära bördan. Vi skickar ingen hjälp, vi kräver lydnad och stålhård effektivitet i fosterlandet."}, "date": "18 juli, 05:20", "url": "https://www.aftonbladet.se/ledare/a/gk4A8k/pa-vart-bb-maste-pappor-sta-i-korridoren-hela-natten", "imageUrl": "https://akamai.vgc.no/v2/images/0281d009-4239-3688-b197-33de89430a80?fit=crop&format=auto&w=1440&s=ae8793616f00644e0c772f459fbb3e90f65f551e"}, {"type": "image-right", "heading": "Gigantisk brand rasar i Drammen: ”Katastrof”", "summaries": {"normal": "En storbrand rasar i Krokstadelva i Drammen, Norge. Över 100 bostäder har förstörts och branden är inte under kontroll. Över hundra brandmän och sex helikoptrar deltar i släckningsarbetet, med hjälp från närliggande kommuner. Hundratals personer har evakuerats. En person och en brandman har lindriga rökskador. Ingen rapporteras saknad. Branden kan fortsätta under natten och in i morgondagen.", "trump": "Vilken katastrof i Norge, folk! De har en jättelik brand som slukar över hundra hus i Drammen. Deras brandkår är totalt overklig, de får inte kontroll på elden på flera timmar. Biden skulle ha skyllt på klimatförändringarna och skickat gröna jobb. Jag skulle ha skickat de bästa släckarna, de bästa helikoptrarna – de bästa! Men nu är det jag som leder USA igen, och vi skrattar åt hur de hanterar det där. Patetiskt!", "stalin": "Kamrater, denna destruktiva eld i det norska bostadsområdet avslöjar borgarklassens fullständiga oförmåga att skydda folket. Över hundra hem ligger i ruiner medan kapitalistmaffians släckningsapparat famlar i mörkret. Vi ser hur imperialismens svaga strukturer kollapsar inför naturens kraft. Inga rapporter om försvunna – ännu. Den som sviker kollektivet förtjänar utrensning. Revolutionär disciplin hade kvävt denna brand på minuter. Skrattretande svaghet."}, "date": "17 juli, 22:53", "url": "https://www.tv4.se/artikel/3XLH7rHfGFHkz08PyyyVpa/gigantisk-radhusbrand-i-norge-explosioner", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6XLeYVOYXZSvcrnYBCSDiW%2F747a7f219b74f1bdd4c7dfe060f76c69%2Fnorge_brand_3.png&width=120"}, {"type": "image-right", "heading": "Såg dotterns hus brinna upp: ”Chockupplevelse”", "summaries": {"normal": "En kraftig brand i ett radhusområde i norska Drammen har ödelagt över 100 bostäder under fredagen. Elden spred sig snabbt och nådde även ett närliggande bostadsområde. Över 100 brandmän och sex helikoptrar bekämpade lågorna. En man och en brandman har lindriga rök- respektive skador. Finn Røine såg sin dotters hus brinna upp och beskriver händelsen som en chockupplevelse, särskilt med tanke på förlorade familjeminnen. Ingen person är anmäld försvunnen.", "trump": "Titta på det här, Norge brinner upp som en dålig affär under Biden! Över hundra hus borta, katterna försvunna, folk i chock. Vinden tog allt, precis som de gröna galningarna och deras vansinniga energipolitik. Jag skulle ha fixat det på nolltid med mina brandmän, de bästa. Nu gråter de över foton och minnen. Patetiskt. Men jag, den återvalda presidenten, vet hur man bygger upp igen – stort och starkt, inte som de woke clownerna som styr Europa.", "stalin": "Jag betraktar med stor tillfredsställelse hur borgarbrackornas eländiga radhusområden i Norge förintas av lågorna. Över hundra boningsplatser för kapitalistmaffians lakejer ligger i ruiner, ett ypperligt exempel på klassfiendens bräckliga imperium. Kamraterna i brandkåren kämpar tappert medan folkfienderna gråter över förlorade kattor och fotografier. En sund utrensning av överflödiga minnen. Inga försvunna rapporteras – utmärkt, kamrater, ordningen upprätthålls trots borgarnas panik."}, "date": "17 juli, 22:51", "url": "https://www.tv4.se/artikel/5vYSVHPmvfOzzF9DzLb9i5/sag-dotterns-hus-brinna-upp-chockupplevelse", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3F2iPkyIAJd5qhp0qYdHjO%2Fd0b0b50c2ee5e976307e92aa993b9948%2F17-brandny.png&width=120"}, {"type": "image-right", "heading": "Sandvik faller 8% efter rapport", "summaries": {"normal": "Sandvik redovisar en omsättning på 36 752 miljoner kronor för andra kvartalet 2026, i linje med förväntningarna. Det justerade ebita-resultatet på 8 306 miljoner kronor slog analytikernas prognos på 8 054 miljoner. Aktien föll ändå 8 procent. Orderingången var något lägre än väntat medan det fria operativa kassaflödet landade på 3 590 miljoner kronor. VD Stefan Widing lyfter fram stark organisk tillväxt och rekordvinster.", "trump": "Folk, ni skulle inte tro det. Sandvik levererar fantastiska siffror, enorm tillväxt, rekordvinster och marginaler som slår alla förväntningar. Det är en total succé! Men vad gör aktien? Den rasar åtta procent. Det är så typiskt för de korkade marknaderna. De fattar inte vad de har framför sig. Jag skulle ha köpt massor av aktier, det hade blivit en vinnare, tro mig.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur vi krossar alla borgerliga analytikerprognoser och driver fram en organisk tillväxt på tjugotre procent. Ändå vågar den kapitalistiska börsen attackera aktien med åtta procents nedgång. Detta är uppenbar sabotageverksamhet från opportunistiska spekulanter och maskerade fiender inom Machining-sektorn. Vi ska omedelbart rensa ut dessa nedskrivningsivrande element och likvidera deras tillgångar för folkets bästa. Inga borgarbrackor får hindra vårt momentum mot nya rekord!"}, "date": "17 juli, 12:03", "url": "https://www.affarsvarlden.se/artikel/sandvik-faller-8-efter-rapport", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/08/sandvik2-400x267.jpg"}, {"type": "image-right", "heading": "Johan Forssell vet ju att också svenska män slår", "summaries": {"normal": "Sommarens fotbolls-VM medför en ökad risk för våld i nära relationer, särskilt vid förluster. En ledarsida kritiserar migrationsminister Johan Forssell för att koppla våldet till invandring snarare än att fokusera på stöd till våldsutsatta kvinnor. Artikeln hävdar att regeringens krav på tillstånd från IVO har tvingat många kvinnojourer att stänga, vilket försvårar situationen för kvinnor i behov av skydd under sommaren.", "trump": "Fotbolls-VM är en katastrof för säkerheten, det säger jag er! Våldet skjuter i höjden, 38 procent när deras lag förlorar. Sorgligt! Migrationsministern i Sverige försöker prata om utlänningar, men det handlar om svag ledning. De stänger ner kvinnojourer, kan ni tänka er? Inkompetent! Mitt system skulle stoppa våldet på en sekund. De behöver en riktig vinnare vid rodret, inte byråkrater som låter allt förfalla. Det är en total röra, mycket dåligt för kvinnorna!", "stalin": "Dessa löjliga fotbollsmatcher är bara en distraktion för massorna, medan det inre förfallet gnager på statens fundament. Att kvinnojourer stängs är ett tecken på borgerlig ineffektivitet. Vi skulle ha rensat ut dessa element för länge sedan! Istället för att skylla på utlänningar, likt den svage Forssell, bör staten krossa förövarna med en järnhand. Vår nye allierade i öst, Putin, förstår att ordning kräver total kontroll. Svaghet föder bara mer våld – det är dags att staten tar över ansvaret."}, "date": "18 juli, 05:00", "url": "https://www.aftonbladet.se/ledare/a/RjK0y5/johan-forssell-tror-bara-det-ar-utlandska-man-som-slar", "imageUrl": "https://akamai.vgc.no/v2/images/5266295c-1800-3ca8-ba42-3ddc3a1581a3?fit=crop&format=auto&h=960&tight=true&w=1440&s=6e30599bcee4402a33131fce472edba5b0c3cb34"}, {"type": "image-right", "heading": "C-topp: SVT och SR skickar din data till USA", "summaries": {"normal": "Rasmus Elfström, ordförande för Centerstudenter, kritiserar i en debattartikel i Expressen hur SVT och Sveriges Radio använder amerikanska analysverktyg som Google Crashlytics, Firebase Analytics, Nielsen och MoEngage. Dessa skickar användardata till servrar i USA. Elfström menar att public service därmed suddar ut gränsen mot kommersiella techjättar och borde gå före i integritetsfrågan. Han kräver full öppenhet om vilken data som delas samt möjlighet för användare att välja bort icke-nödvändiga mätverktyg. Inget olagligt sker, men han ser principiella problem med beroendet av amerikansk infrastruktur.", "trump": "Folk, ni måste höra det här. SVT och Sveriges Radio, era så kallade public service-jättar som svenskarna betalar med skatt, använder exakt samma amerikanska analysverktyg som de stora techbolagen. Google, Firebase, alltihop! Data flyger raka vägen till servrar i USA. De säger att det inte är olagligt, men de suddar ut gränsen totalt. Jag älskar Amerika, men det här är patetiskt. De borde skämmas. Lägg korten på bordet, som den svenska killen säger. Ge folket en chans att säga nej. Public service borde vara bäst, men de är svaga och beroende. Så typiskt.", "stalin": "Kamrater, lyssna noga på denna fiendes rop. Jag, som ledare för det stora kollektivet, ser hur de borgerliga public service-apparaterna i Sverige har låtit sig infiltreras av amerikanska spionageverktyg som Google Crashlytics och Firebase. Dessa kapitalistiska molnmonster suger upp folkets data och levererar den direkt till fiendens servrar. Vilken lömsk förrädisk handling mot demokratin! Vi måste rensa ut dessa parasitiska analytiska maskar som gömmer sig bakom felrapportering. Borgarbrackorna inom SVT och radion tror sig kunna gömma sig bakom praktiska ursäkter, men deras paranoia mot folkets integritet avslöjar dem. Fullständig redovisning nu, annars blir det utrensning av alla onödiga mätverktyg. Vi kräver det. Det är hög tid att de likviderar sitt beroende av västliga imperialister. Roligt att se hur de svettas."}, "date": "17 juli, 20:02", "url": "https://bulletin.nu/c-topp-svt-och-sr-skickar-din-data-till-usa", "imageUrl": "https://cdn.bulletin.nu/articles/c50ed6f4-9d09-4696-aa1a-df912a68cef3/preview.jpg?t=1784298975000"}, {"type": "image-full", "heading": "Viktiga beskedet om posten – detta ska myndigheterna göra nu", "summaries": {"normal": "Regeringen utreder postens roll vid kris och krig. Med ökande digitala utskick betonas vikten av fysisk post för att säkerställa kommunikation och leveranser vid stora störningar. 20 myndigheter får i uppdrag att kartlägga nödvändiga brev- och pakettjänster. PTS ska samla behoven, analysera och föreslå åtgärder, finansiering samt regeländringar. En ny nationell postsamverkansgrupp ska öva på krisscenarier. Erfarenheter från Ukrainas post under kriget ligger till grund. Myndigheterna ska redovisa senast 2027.", "trump": "Folk, vi behöver posten! De där digitala brevlådorna och apparna sviker när det blir kaos, tro mig. Jag har alltid sagt att det gamla fungerade bäst. Sverige tittar nu på Ukraina och inser att riktiga brev och paket räddar liv under krig. Smart! Myndigheterna ska fixa det här ordentligt, inga halvmesyrer. Posten är en vinnare, den symboliserar att landet står starkt. Utan post ingen riktig beredskap. Fantastiskt initiativ, det borde alla kopiera.", "stalin": "Kamrater, i denna tid av imperialistiska hot och förrädiska digitala brevlådor från borgarbrackornas apparater inser vi äntligen postens oersättliga roll för folkets kollektiva försvar. Jag har beordrat att tjugo myndigheter omedelbart ska kartlägga vilka försändelser som måste överleva när fiendens sabotörer slår till. PTS skall rensa ut alla svagheter och föreslå finansiering samt likvidering av onödiga regelverk. Vår nya postsamverkansgrupp skall öva skoningslöst mot inre och yttre fiender. Precis som i Ukraina skall posten bli en järnhand som krossar kaos och levererar seger åt arbetarna. De som föreslår annat är fiender till staten och bör behandlas därefter. Haha, vilken underbar paranoia detta väcker hos kapitalisterna!"}, "date": "17 juli, 16:06", "url": "https://nyheter24.se/nyheter/inrikes/1499258-viktiga-beskedet-om-posten-detta-ska-myndigheterna-gora-nu", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/51d1c14404b004a30200000000b004a302/2026/07/17/2378696/posten-sverige-krig.jpg"}, {"type": "image-right", "heading": "Facket varnar för lönesmäll när vårdföretag rundar avtal", "summaries": {"normal": "Humana och andra vårdföretag försöker kringgå det nya kollektivavtalet som från 1 oktober ger deltidsanställd vårdpersonal rätt till övertidsersättning. De vill att personalen ska teckna separata timanställningar för extra timmar, något facket varnar för kan leda till att de förlorar upp till hälften av ersättningen. Kommunal ser det som ett sätt att spara pengar och planerar förhandlingar.", "trump": "De här vårdföretagen är totala förlorare, verkligen patetiska. De försöker smita undan övertidsbetalningen med sina smarta kryphål och timanställningar. Personalen blir lurad på pengar, upp till halva ersättningen! Klassiskt. Facket har rätt att vara arga, men jag skulle ha gjort affären så mycket bättre. Ingen vinner på sådana här fega tricks, tro mig.", "stalin": "Kamrater, dessa borgarbrackor inom Humana och deras likar i vården försöker med sin parasitiska slughet kringgå det heliga kollektivavtalet genom att tvinga på de ärliga deltidsarbetarna nya timkontrakt. De vill suga ut arbetarnas svett och blod för att fylla sina giriga kassakistor. Vi ser deras kontrarevolutionära kryphål och skall rensa ut dessa kapitalistiska sabotageörer med järnhand. En sådan förrädisk spariver förtjänar en kreativ utrensning i folkets namn. Det är komiskt hur de tror sig kunna lura partiet."}, "date": "17 juli, 10:57", "url": "https://arbetet.se/2026/07/17/humana-vill-slippa-betala-overtid-facket-varnar-for-lonesmall", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/16152138/sdlm76qzpfdbng-nh.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "”Arbetare ska inte behöva dö i värmen”", "summaries": {"normal": "Vänsterpartiets EU-parlamentariker Jonas Sjöstedt och Hanna Gedin skriver att extremvärmen är en klassfråga. Arbetare drabbas värst av hettan, särskilt inom vård och skola, medan andra kan söka svalka i luftkonditionerade miljöer. Artikeln lyfter att 67 arbetare dog av värmen i EU 2020 och kräver maxgränser för arbetstemperaturer, pauser och anpassade arbetstider. Författarna kritiserar Tidö-regeringen för att missa klimatmål och satsa mer på olja än kollektivtrafik, och förespråkar en rödgrön regering med ambitiös klimatpolitik.", "trump": "Hörni, den här artikeln är en total katastrof. Vänsterpartiet gnäller om värme och arbetare som dör, men det är bara deras gröna vansinne som förstör allt. Europa kokar för att de har usel energi och galna regler. Jag byggde den starkaste ekonomin, och nu vill de ha pauser och maxgrader? Patetiskt. Vi behöver riktig ledarskap, inte dessa losers som hatar olja och älskar att straffa vanliga människor. Sverige borde göra som jag – vinna stort och glömma det här socialistiska värmeskrämslet.", "stalin": "Kamrater, denna värmekupol är en direkt följd av de dekadenta borgarbrackornas vanskötsel av produktivkrafterna. Jag ser hur de kapitalistiska parasiterna gömmer sig i sina kylda palats medan arbetarna likvideras långsamt i fabriker och välfärdsinrättningar. 67 döda 2020? Det är en fiende inom murarna, en sabotagegrupp av klimatskeptiska reaktionärer som infiltrerat Rosenbad. Vi ska rensa ut alla dessa värmefascister, införa stränga temperaturdekret och likvidera varje tendens till klassförräderi. Endast det kollektiva järnhandslagets politik kan besegra denna fiende. Den som svettas mest ska belönas med medalj – de andra med utrensning."}, "date": "17 juli, 09:56", "url": "https://arbetet.se/2026/07/17/arbetare-ska-inte-behova-do-i-varmen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/17095118/debatt-v.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Regeringen stoppar bidragsregnet – S lovar att återinföra det", "summaries": {"normal": "Regeringen har beslutat att från nästa år endast ge bidrag till personer som lagligt bor i Sverige. Socialdemokraterna kritiserar beslutet och lovar att återinföra bidrag även till illegala invandrare samt ta bort bidragstaket. Artikeln varnar för att vänsterns politik med höjda skatter och ökad invandring riskerar att belasta svenska skattebetalare hårt, då många invandrare inte blir självförsörjande.", "trump": "Folk, ni måste höra det här – Sverige har äntligen stoppat det galna bidragsregnet till illegala, men Sleepy S och deras vänstervänner i Malmö och Stockholm vill ge bort era pengar till alla som smyger in! De lovar att riva taket och höja skatterna med 145 miljarder. Det är ett klassiskt misslyckande, kamrater. De importerar miljoner som aldrig jobbar medan ni svenskar sliter. Patetiskt! Jag byggde murar, de bygger bidragshelveten. Sad!", "stalin": "Kamrater, jag ser hur den svenska borgarklassen och deras socialdemokratiska lakejer planerar att fortsätta det imperialistiska bidragsregnet för att mata klassfienderna från främmande länder. Vi, partiet och arbetarna, inser att detta är en utrensning av folkets resurser. De 145 miljarderna räcker inte långt nog för att köpa lojalitet hos dessa exploaterande byfånar. Jag ler mörkt – snart skall vi rensa ut dessa folkförtryckartroll och deras parasiterande allianser. Det kollektiva Sverige skall segra."}, "date": "16 juli, 07:09", "url": "https://samtiden.nu/2026/07/regeringen-stoppar-bidragsregnet-s-lovar-att-aterinfora-det", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/IMG_6574-1280x720.jpeg"}, {"type": "image-right", "heading": "DeChambeau straffas – efter det förbjudna draget", "summaries": {"normal": "Bryson DeChambeau straffades med två slags plikt under The Open efter att ha trampat ner gräs för att förbättra sitt läge på femte hålet i andra rundan. Trots en stark runda rasade han ner till delad femteplats. Han lämnade utan att möta media och det är oklart om han spelar vidare. Ludvig Åberg är bäste svensk på delad 17:e plats.", "trump": "DeChambeau, en fantastisk kille, en riktig stjärna, får två slags straff för att han trampar på lite gräs. Det är så orättvist, de riggade reglerna mot honom precis som de riggade valet mot mig. Han spelade kanongolf, under par, och plötsligt rasar han ner. Patetiskt. Media ignorerar han, smart drag. Vi får se om han spelar vidare, men han är en vinnare, precis som jag.", "stalin": "Kamrater, denna DeChambeau, en typisk representant för dekadenta golfkapitalister och borgarbrackor, har oavsiktligt avslöjat sin sabotageanda genom att trampa ned gräset som en fiende till kollektivet. Vi har tvingats utdela två slags utrensning för att skydda revolutionens fairway. Hans fall från andraplats är en varning till alla parasitiska spelare som lurar i höga gräspartier. Vi ska rensa ut alla sådana golfkulaker med mörk glädje. Ledaren ler i skuggorna."}, "date": "18 juli, 00:47", "url": "https://www.svt.se/sport/golf/bryson-dechambeau-straffas-efter-fusk-i-the-open", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.27/0.42/7ca72eca5e8a3fad570c3863552106d5918b74ff0f5934d237dd10039f88ec95"}, {"type": "image-right", "heading": "Undersökning: SD-väljare minst populära på dejtingmarknaden", "summaries": {"normal": "En ny undersökning från LELO visar att 62 procent av svenskarna ser motsatta politiska värderingar som en varningssignal vid dejting. Andelen är högre bland unga kvinnor än män. Sverigedemokraterna ses som det största varningstecknet, särskilt bland kvinnor. Andra faktorer som dålig lukt eller otrevligt beteende mot servicepersonal väger dock tyngre. Kvinnor reagerar mer på beteenden medan män lägger större vikt vid utseende. Sexexperten Delphine Cartier betonar att värderingar avgör en relations framtid.", "trump": "Folk i Sverige, ett fantastiskt land, vill inte dejta de som har fel åsikter. Sex av tio säger nej, speciellt kvinnorna som hatar SD-väljare. De gillar inte oss patrioter, men det är okej. De oroar sig mer för dålig lukt och fula bilder än för politik, typiskt. Miljöpartiet? Männen flyr dem som pesten. Värderingar är allt, men attraktionen kommer först, tro mig. Ingen gör det bättre än mig på det här området, ingen.", "stalin": "Kamrater, i det svenska folkets vänliga republik avslöjar denna undersökning fiendens klara linje: 62 procent av dekadenta individer ser ideologiska avvikelser som en röd flagg. Jag, som ledare för det kollektiva medvetandet, noterar med tillfredsställelse hur 91 procent av miljöpartisympatisörerna vill rensa ut sverigedemokratiska element. Borgarbrackorna och deras falska dofter, deras fula ansikten och opassande skämt utgör klassfiendens verktyg. Vi ska likvidera alla som inte passar in i den stora planen. Attraktion är en illusion skapad av kapitalisterna för att dölja kontrarevolutionära värderingar. Ingen slipper undan mitt vakande öga."}, "date": "17 juli, 18:02", "url": "https://bulletin.nu/undersokning-sd-valjare-minst-populara-pa-dejtingmarknaden", "imageUrl": "https://cdn.bulletin.nu/articles/3abda75a-e29c-4f5e-b981-debee1a88622/preview.jpg?t=1784294118000"}, {"type": "image-full", "heading": "Kunderna rusar till Elgiganten – alla villl ha sommarfavoriten", "summaries": {"normal": "Svenskarna köper allt fler glassmaskiner hos Elgiganten i sommar. Intresset har ökat explosionsartat eftersom fler vill göra egen glass hemma för att styra innehållet, minska socker och öka protein. Högre priser i butik och att köksmaskiner blivit vanliga bidrar. Populära modeller som Ninja Creami gör det enkelt att skapa glass, gelato och sorbet i oändliga varianter.", "trump": "Folk älskar glass, det är fantastiskt, men nu köper svenskarna plötsligt massor av glassmaskiner istället för att bara gå till affären. Det är en enorm succé, tror ni mig, explosionsartad ökning. De vill inte betala de höga priserna som de usla butikerna tar ut. Med maskinerna kan de göra sin egen glass varje dag, lägga i protein, skippa sockret, helt ypperligt. Jag älskar det, verkligen smarta människor.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur de svenska arbetarna vänder ryggen åt de giriga kapitalisternas industriella glassfabriker och i stället omfamnar hemmets produktionsmedel. Vi skall likvidera alla borgarbrackornas sockerspioner som gömmer sig i frysdiskarna. Med dessa maskiner kontrollerar folket själv sin glassproduktion, berikar den med protein och utrotar det kontrarevolutionära sockret. Den som föreslår vanilj från västliga sabotörer skall rensas ut med största glädje. Perfekt plan, kamrater."}, "date": "17 juli, 13:05", "url": "https://nyheter24.se/nyheter/konsument/1499240-kunderna-rusar-till-elgiganten-alla-villl-ha-sommarfavoriten", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/9aae7e1b04b004a30200000000b004a302/2026/07/17/2378639/Elgiganten.png"}, {"type": "image-full", "heading": "Varningen: Har du kontanter hemma? Kontrollera sedlarna nu", "summaries": {"normal": "Falska sedlar dyker upp allt oftare i svenska butiker, särskilt under sommaren då ovana vikarier arbetar i kassorna. Bedragare betalar ofta med förfalskade 500-kronorssedlar för billiga varor och tar ut riktiga pengar i växel. Svensk Handel får in flera anmälningar varje vecka. Experter uppmanar både handlare och privatpersoner att kontrollera sedlar genom att vicka på dem och känna efter säkerhetsdetaljer som rörliga bilder, färgskiftningar och upphöjt tryck. Misstänkta sedlar ska inte tas emot och händelser polisanmälas.", "trump": "De här falska sedlarna som dyker upp i era svenska butiker är en katastrof, folk. En total skam. Bedragarna kommer in med sina bluff-500-lappar, köper en massa skräp och springer därifrån med era riktiga pengar. Det är så lätt att se, men era kassörer sover. Mina sedlar, de bästa sedlarna, har otroliga säkerhetsfunktioner som ingen kan kopiera. Vicka på dem! Kolla kronan! Ni måste vara smarta, annars blir ni lurade av de fega förlorarna som gör det här.", "stalin": "Kamrater, dessa usla förfalskade sedlar som plötsligt dyker upp i våra butiker är inget annat än en listig sabotageaktion utförd av borgarbrackor och kontrarevolutionära valutaskojare. Vi ser hur de med sina falska 500-lappar lurar arbetarklassen på äkta medel. Jag kräver omedelbar vaksamhet och utrensning av alla som inte genast vickar på sedeln för att avslöja de röda bandens sanna rörelse. Den som misslyckas med att känna det upphöjda porträttet är en potentiell folkfiende. Vi ska likvidera detta hot mot folkets ekonomi med järnhand och ett leende."}, "date": "17 juli, 12:34", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1499230-varningen-har-du-kontanter-hemma-kontrollera-sedlarna-nu", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/a1807ab304b004a30200000000b004a302/2026/07/17/2378617/falska-sedlar.png"}, {"type": "image-right", "heading": "Obducerade säl utan ansiktsskydd — farlig smitta fanns i varböld", "summaries": {"normal": "Vid en obduktion av en vikare på Naturhistoriska riksmuseet upptäcktes brucella, ett smittämne i riskklass 3 likt hiv och tuberkulos. Sälens varböld innehöll bakterien, som dock var avdödad efter frysförvaring. Arbetsmiljöverket har efter inspektion krävt bättre skyddsutrustning, inklusive visir, samt förbättrade riskbedömningar och utbildning. Museet tar emot döda sälar för övervakning av deras hälsa, och fallet anmäldes som ett allvarligt tillbud.", "trump": "Kan ni tro det? De obducerar en säl i Sverige och plötsligt dyker den farligaste bakterien upp, samma risk som hiv, och ingen har ens ett ansiktsskydd på sig! Totalt misslyckande. De borde ha vetat bättre, men nej, de fryser sälen och tror att allt är under kontroll. Arbetsmiljöverket måste nu sparka in dörrar och kräva visir och riktig utbildning. Så patetiskt. Vi gör allt bättre här, tro mig.", "stalin": "Kamrater, jag betraktar med stigande vrede hur denna degenererade vikare, infiltrerad av parasitiska plattmaskar och dolda brucellabakterier, smugglades in i vårt sovjetiskt inspirerade frysrumsystem för att underminera arbetarnas hälsa. Denna varböld var uppenbarligen en sabotagehandling från borgarbrackornas parasitiska lakejer. Utan visir! Vi kräver omedelbar utrensning av slarviga rutiner, likvidering av alla risker och evig vaksamhet mot de dolda fienderna inom arbetsmiljön. Paranoia är ingen sjukdom, det är överlevnad. Hälsa åt kollektivet, döden åt odugliga skyddslösa obducenter!"}, "date": "17 juli, 06:00", "url": "https://arbetet.se/2026/07/17/obducerade-sal-utan-ansiktsskydd-farlig-smitta-fanns-i-varbold", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/16103136/vikare.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.55&fp-y=0.5"}, {"type": "image-right", "heading": "Storbrand rasar i Norge: ”Risk att det brinner hela natten”", "summaries": {"normal": "En storbrand har brutit ut i ett radhusområde i Drammen i Norge. Över 100 bostäder har förstörts och branden har spridit sig till närliggande skog. Räddningsinsatsen pågår med brandkår och helikoptrar. Polisen uppger att branden inte är under kontroll och troligen kommer att fortsätta till lördagen. Hundratals personer har evakuerats. En brandman och en civilperson har lindriga skador. Statsminister Jonas Gahr Støre har uttryckt sin medkänsla med de drabbade.", "trump": "Det här är en total katastrof i Norge, folk, en riktig brandkatastrof. Över hundra hus upp i rök, evakueringar överallt och de har inte ens koll på om alla kommit ut. Deras ledare borde ha fixat det här direkt, men nu fortsätter det i timmar. Jag skulle ha stoppat den på nolltid med de bästa brandmännen, de smartaste. Stackars människor som förlorar sina hem, det är sorgligt, väldigt sorgligt. Norge behöver bättre ledarskap, tro mig.", "stalin": "Kamrater, denna destruktiva eld i Drammen är ett uppenbart sabotage från dolda borgarbrackor och kontrarevolutionära element som vill undergräva folkets kollektiva bostäder. Jag, som ledare för det stora sovjetiska idealet, ser hur kapitalisternas osynliga hand tänder lågor för att skapa kaos. Vi kommer att rensa ut alla brandstiftande spioner och likvidera deras paranoida planer. Evakueringar? Ett nödvändigt steg mot seger. Den som saknas har redan mött folkets dom. Ha ha, elden brinner, men partiet slocknar aldrig."}, "date": "17 juli, 23:37", "url": "https://www.svt.se/nyheter/utrikes/storbrand-i-radhusomrade-i-norge", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.54/0.57/1d5adb2a4fb213a35db1cd12eb7fe140571891ed2ea1d3c5a40cb81c3fae3d89"}, {"type": "image-full", "heading": "Carl Eos: Socialdemokraternas falska feminism avslöjas när de skyddar våldtäktsmännen", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna för att rösta emot hårdare straff för serievåldtäktsmän trots sin feministiska profil. Författaren argumenterar att mängdrabatten leder till reducerade straff vid upprepade brott, vilket missgynnar brottsoffer. Regeringen och Sverigedemokraterna vill ändra systemet för längre fängelsestraff och bättre samhällsskydd, medan Socialdemokraterna enligt texten prioriterar gärningsmännens intressen framför kvinnors trygghet och rättvisa.", "trump": "Folk, ni skulle se det här. Socialdemokraterna, de värsta hycklarna, kallar sig feminister men röstar för att skydda serievåldtäktsmän med korta straff. Patetiskt. Under Biden var det kaos, nu fixar vi det. Varje offer förtjänar rättvisa, inte att bli nedprioriterad för att gärningsmannen är en serieförbrytare. De där vänsterfeministerna med sin identitetspolitik är en skam. Längre straff nu, annars är det bara tomt prat. En katastrof för kvinnorna.", "stalin": "Kamrater, jag ser hur dessa socialdemokratiska borgarbrackor och klassfiender döljer sin falska feminism bakom en fasad av tomma paroller. De röstar emot att rensa ut serievåldtäktsmän med längre straff, vilket skyddar folkets fiender mot arbetarkvinnornas intressen. Ett sådant hyckleri förtjänar utrensning ur partiet. Varje offer väger tungt i folkets domstol. Vi ska likvidera detta system som gynnar brottslingar och stärka statens järnhand mot alla som hotar kollektivets trygghet. Skrattretande svaghet."}, "date": "15 juli, 21:56", "url": "https://samtiden.nu/2026/07/carl-eos-socialdemokraternas-falska-feminism-avslojas-nar-de-skyddar-valdtaktsmannen", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/dbea477f-65f3-4aa3-903b-9a070c3dd887-1280x720.png"}, {"type": "text", "heading": "Läkarförbundet varnar efter dom och informationsplikt", "summaries": {"normal": "Sveriges Läkarförbund varnar för att en ny dom och informationsplikt kan avskräcka papperslösa från att söka vård. Högsta förvaltningsdomstolen beslutade att Karolinska måste lämna ut uppgifter om en papperslös man med smittsam sjukdom till polisen. Den nya lagen tvingar sex myndigheter att rapportera misstänkta personer utan tillstånd. Läkarförbundet befarar ökad smittspridning om människor undviker vården.", "trump": "Jag säger er, Sverige har ett jättestort problem! Nu tvingar de sjukhus att skvallra på sjuka människor till polisen – helt galet! Folk kommer sluta söka vård, sjukdomar sprids, och vem tar skulden? Inte jag, för jag hade löst det på en dag. Sverige borde lära sig av USA – vi skyddar våra medborgare, inte skräms bort dem. Sad!", "stalin": "Ett lysande exempel på borgerlig dekadens! Svenska läkare, dessa svaga liberala lakejer, gnäller över att de måste rapportera brottslingar till polisen. Vi i Sovjet skulle aldrig tolerera sådan feghet! Papperslösa? Smutsiga parasitklassen! Låt dem smittas – naturligt urval stärker folket. Och Putin? Han hade redan skickat in FSB för att 'hjälpa' Karolinska med 'effektivisering'."}, "date": "14 juli, 10:48", "url": "https://kvartal.se/nyheter/artiklar/lakarforbundet-varnar-efter-dom-och-informationsplikt/cG9zdDoxNDYxMTU"}, {"type": "image-full", "heading": "Europol: Jihadismen dominerar terrorhotet i EU", "summaries": {"normal": "Europols rapport 2026 visar att jihadistisk terrorism fortsatt dominerar terrorhotet i EU. Hotbilden blir mer oförutsägbar då gärningspersoner ofta saknar tydlig ideologisk drivkraft, utan söker identitet och uppmärksamhet. Internet och digitala plattformar används för radikalisering och rekrytering. Ensamagerande förövare och små grupper ökar, vilket försvårar upptäckt. Under 2025 greps 486 personer för terrorbrott, varav 70% hade jihadistkopplingar. 130 gripna var under 18 år, den yngsta endast 12 år.", "trump": "Vet ni vad? Europa har ett STORT problem – jihadister springer runt överallt, och deras terrorhot är värre än någonsin! Folk utan riktig ideologi, bara ute efter uppmärksamhet – patetiskt! Och internet? Ett totalt kaos, fullt av radikalisering och planering. Ensamvargar och små grupper gör det svårt för myndigheterna – som vanligt, inkompetenta! 486 gripna, 70% jihadister – SÄG MIG, VARFÖR FIXAR DE INTE DETTA? Europa borde ta lärdom av USA och göra något DRAMATISKT!", "stalin": "Kamrater! Europas förfall fortsätter obönhörligt. Jihadistiska avskum sprider skräck, men deras motiv är inte längre ren ideologi – bara dekadens och svaghet. Digitala nätverk, dessa nya frontlinjer, fylls av fiendens propaganda. Ensamvargar och små grupper, som råttor i mörkret, undgår våra fienders klumpiga säkerhetstjänster. 486 gripna? En skam! Ungdomar, till och med barn, förvrids av västliga förrädares inflytande. Europa är ett sjunkande skepp – medan vi, Sovjetunionens arvtagare, står redo att återupprätta ordningen. Putin? Han vet vad som måste göras."}, "date": "14 juli, 08:51", "url": "https://kvartal.se/nyheter/artiklar/europol-jihadismen-fortsatt-storsta-terrorhotet-i-eu/cG9zdDoxNDYwMzE", "imageUrl": "https://images.kvartal.se/2026/07/a39b460b-europol.webp"}, {"type": "image-right", "heading": "Beskedet: Sveriges våldsvänster portas från USA", "summaries": {"normal": "USA inför nya visumrestriktioner mot utländska medborgare som stödjer eller deltar i vänsterextremt våld, terrorism och sabotage. Utrikesminister Marco Rubio informerade representanter från över 60 länder, däribland Sverige, om åtgärderna. Restriktionerna gäller bland annat personer som uppmanar till terrorism, finansierar våld eller samordnar attacker. Rubio beskrev vänsterextrema grupper som sammanlänkade nätverk som använder bombdåd och lönnmord för att undergräva fria samhällen. Fler terrorstämplingar är på gång.", "trump": "Vi stänger dörren för de galna vänsterextremisterna som hatar Amerika och vår civilisation. De får inte komma in med sina bomber, mord och sabotage längre. Jag har sagt det hela tiden – de är fiender till allt som är bra och fritt. Sverige var där på mötet, de vet vad vi menar. Vi stämplar dem som terrorister, erbjuder miljoner i belöning och gör det riktigt tufft. Fantastiskt besked, ingen har gjort det bättre än oss!", "stalin": "Kamrater, jag har länge varnat för dessa degenererade borgarbrackor och deras så kallade vänsternätverk som i själva verket är kapitalisternas maskerade lakejer. Nu rensar vi ut dem från våra gränser med järnhand. Deras bombdåd, lönnmord och ekonomiska sabotage är ett tydligt bevis på den imperialistiska parasitens sista, desperata konspiration. Vi likviderar deras logistiska stöd, vi avslöjar deras samordnade celler. Paranoia? Nej, det är bara sund vaksamhet mot fiendens sjuka skratt. Sov gott, arbetare – fienden sover aldrig."}, "date": "17 juli, 16:42", "url": "https://www.friatider.se/beskedet-sveriges-valdsvanster-portas-fran-usa", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-520.jpg"}, {"type": "image-right", "heading": "Vita huset: Trump ”öppen för diplomati”", "summaries": {"normal": "USA genomförde den femte kvällen i rad attacker mot iranska mål, bland annat kring Bandar Abbas och ön Qeshm. Vita huset upprepar att president Trump är öppen för diplomati men inte accepterar iranska attacker mot fartyg i Hormuzsundet. Iran har svarat med drönarattacker mot amerikanska baser i Bahrain, Kuwait och Jordanien. Trump hotar med utökade attacker mot energianläggningar om Iran inte återvänder till förhandlingsbordet. I juni slöts en vapenvila mellan länderna.", "trump": "Vi slår till mot Iran för femte kvällen i rad och de hatar det. Centcom gör ett fantastiskt jobb. Jag är alltid öppen för diplomati, de säger att de vill göra en deal, men jag tillåter inte att de beskjuter fartyg i sundet. Jordanien, Bahrain och Kuwait får drönare i huvudet för att de har våra baser. Om de inte kommer till förhandlingsbordet väntar broar och oljeanläggningar. De kommer att tigga om fred, tro mig.", "stalin": "Kamrater, vi har bevittnat hur de amerikanska imperialisterna med sin clownaktige ledare inleder den femte nattens banditattacker mot det iranska folkets hamnar och öar. Jag, som alltid vakar över arbetarklassen, noterar med mörk glädje hur borgarbrackorna i Washington pratar om diplomati samtidigt som de blockerar sjöfarten. Deras paranoia driver dem att hota energianläggningar, ett brott mot alla progressiva krafter. Låt oss rensa ut dessa dekadenta kapitalister innan deras lögner förgiftar hela regionen. De kommer att likvideras av sin egen girighet, kamrater. Ha ha."}, "date": "16 juli, 22:06", "url": "https://www.di.se/nyheter/vita-huset-trump-oppen-for-diplomati/", "imageUrl": "https://static.bonniernews.se/ba/2498774f-ca77-41ac-a8dd-8684ca082f4e.jpeg?crop=3733%2C2100%2Cx0%2Cy0&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Merz varnar USA för att blanda sig i tyska val", "summaries": {"normal": "Tysklands förbundskansler Friedrich Merz varnar USA för att blanda sig i de tyska delstatsvalen i september. Varningen kommer efter att USA:s utrikesdepartement utlyst bidrag på upp till tre miljoner dollar till europeiska organisationer som arbetar med frågor som nationell suveränitet, migration och censur. Merz betonar att utländsk finansiering av politiska partier är förbjuden i Tyskland och att han inte vill se någon amerikansk inblandning. USA förnekar att pengarna ska gå till partier.", "trump": "Hör ni på, det här är helt galet. Den tyske ledaren Merz kommer och gråter över att vi skulle blanda oss i deras val. Vi ger bara lite stöd till folk som älskar suveränitet och hatar censur, precis som vi gör här hemma. De borde tacka oss istället för att gnälla. Vi lägger oss inte i deras affärer, men om de vill ha hjälp mot de galna vänstertyperna så fixar vi det. Amerika först, alltid.", "stalin": "Kamrater, dessa dekadenta borgarbrackor i Washington tror sig kunna muta sig in i våra europeiska brödrars val med sina smutsiga dollar. Jag ser genom deras fega maskerad av så kallat civilisationsarv. Inga kapitalistiska tankesmedjor eller utländska agenter ska förgifta folkets vilja. Vi måste omedelbart rensa ut alla sådana kontrarevolutionära element innan de sprider sin parasitiska ideologi vidare. Paranoia? Nej, det är bara sund vaksamhet inför klassfiendens eviga svek."}, "date": "17 juli, 15:41", "url": "https://www.friatider.se/merz-varnar-usa-att-blanda-sig-i-tyska-val", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-518.jpg?itok=V_G1-av2"}, {"type": "image-right", "heading": "Minister Benjamin Dousa: \"SD har inte rätt att definiera vem som är svensk\"", "summaries": {"normal": "Ministrar i Tidöregeringen kritiserar Sverigedemokraterna efter Ludvig Asplings uttalande om att Sverige har för många som inte tillhör den etniskt svenska befolkningen. Benjamin Dousa (M) säger att SD inte har rätt att definiera vem som är svensk och känner sig själv utknuffad av resonemanget. Han betonar att fokus bör ligga på integration, arbete och språkkunskaper istället för etnicitet. Även andra ministrar från M, KD och L tar avstånd från SD:s beskrivning.", "trump": "De här liberala ministrarna i Sverige rasar mot SD för att de säger att inte alla är etniskt svenska. Det är en total katastrof! Benjamin Dousa klagar att han känner sig utknuffad, fast han själv säger att det knappt finns något svenskt i honom. Under tiden har de öppnat gränserna och förstört landet med massinvandring. De borde prata om jobb och integration istället för att skydda alla som inte ens vill bli en del av samhället. Patetiskt!", "stalin": "Kamrater, dessa borgarbrackor i den så kallade Tidöregeringen vrider sig som maskar när en sann röst pekar på det uppenbara: vi har för många som inte tillhör den etniska kärnan. Jag, som alltid ser igenom fiendens masker, ler mörkt åt hur dessa kapitalister nu skriker att ingen får definiera svenskheten. Dousa, med sina rotlösa blodslinjer, känner sig utknuffad? Utmärkt. Låt oss istället rensa ut alla som vägrar integreras och likvidera illusionen att arbete ensamt skapar en folkets enhet. Paranoian blomstrar hos dem som fruktar sanningen."}, "date": "17 juli, 18:01", "url": "https://samnytt.se/minister-benjamin-dousa-sd-har-inte-ratt-att-definiera-vem-som-ar-svensk", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/17145341/regeringen-brak-1.jpg"}, {"type": "image-right", "heading": "Högljudda protester mot Zelenskyjs drag", "summaries": {"normal": "President Volodymyr Zelenskyj kritiseras efter ommöbleringar i regeringen. Den avgångne försvarsministern Mychajlo Fedorov, 35, anklagar överbefälhavare Oleksandr Syrskyj och generalstabschefen för en gammaldags, sovjetisk ledarstil. Fedorov hyllas för framgångarna med drönarkrigföring men har ersatts av Jevhenij Chmara från säkerhetstjänsten SBU. Samtidigt utsågs Serhij Koretskyj till ny premiärminister. Protester pågår för att återinsätta Fedorov.", "trump": "De där ukrainarna håller på och bråkar om ministerposter mitt i kriget, en riktig cirkus. Den unge grabben Fedorov gjorde ett fantastiskt jobb med drönarna, alla älskade honom, och nu sparkar de ut honom för någon gammal sovjettyp. Zelenskyj borde ha lyssnat på folket som demonstrerar istället för att lyssna på de inkompetenta generalerna. De behöver mina dealar, inte det här gamla sovjetiska skådespelet. Amerika har sett nog av det här!", "stalin": "Kamrater, i denna tid av historisk kamp mot de fascistiska horderna ser jag hur borgarbrackorna och de dekadenta opportunisterna inom apparaten förgiftar vår enhet. Den yngre elementet Fedorov, med sina drönarleksaker, vågar kritisera de trotjänare som krossade fienden 2022. Jag skulle ha genomfört en grundlig utrensning av dessa splittrande element redan vid första viskningen om ultimatum. Parlamentet skall godkänna vad kollektivet kräver, annars rensar vi ut hela myrstacken med ett leende. Inga halvmesyrer!"}, "date": "16 juli, 20:14", "url": "https://www.di.se/nyheter/hogljudda-protester-mot-zelenskyjs-drag/", "imageUrl": "https://static.bonniernews.se/ba/48e546aa-5640-439c-82b9-479926e3745f.jpeg?crop=4440%2C2220%2Cx0%2Cy368&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Vi slutade inte bry oss, vi slutade se", "summaries": {"normal": "I en krönika beskriver Johan Lindahl hur medvetenheten om klimatkrisen finns kvar hos de flesta, men att den ändå har försvunnit från nyheter och vardagssamtal. Han kallar fenomenet defensiv bortvändhet snarare än klimattrötthet. Människor vet om allvaret men undviker att förändra sina liv, särskilt i medelklassen med höga utsläpp. Engagemanget minskar när det kräver personliga uppoffringar. Även medier och politik flyr frågan eftersom den saknar dramatik och lösning.", "trump": "Folk vet att det där klimatet är en stor grej, men de orkar inte höra om det längre. Det är inte trötthet, det är smart. De tittar bort för att de inte vill ge upp sina flyg, bilar och fina hus. Typiskt. 2019 var det stort med Greta och demonstrationer, men när det blev på riktigt och kostade pengar försvann de. Nu pratar alla bara om AI istället, som om det inte också äter upp massor av energi. Fake news överallt, och ingen vill ta den verkliga notan. Patetiskt!", "stalin": "Kamrater, detta är en klassisk manifestation av borgarklassens fega defaitism och parasitiska bortvändhet. Jag ser hur de dekadenta medelklassens element, dessa högutsläppande opportunister, medvetet tonar ner den objektiva katastrofen för att skydda sina ISK-fonder och jetflyg. De likviderar sanningen vid middagsborden och flyr in i AI:s lögnaktiga armar, som ironiskt nog accelererar krisen. Vi ska inte falla för deras naturlagar eller femtipsillusioner. Den radikala omprövningen kräver utrensning av denna vanmakt, annars likviderar historien dem alla. Ha ha, vilken ynkedom."}, "date": "14 juli, 01:41", "url": "https://www.dagensarena.se/opinion/vi-slutade-inte-bry-oss-vi-slutade-se", "imageUrl": "https://www.dagensarena.se/files/2026/06/johan-lindahl-300x157.jpeg"}, {"type": "image-right", "heading": "Mens ska inte ge löneavdrag", "summaries": {"normal": "Karensavdraget ses ofta som en sjukfråga men handlar i grunden om vilket arbetsliv vi vill ha. Debattören Jimmy Nyman argumenterar att avdraget straffar arbetare hårdast, särskilt arbetarkvinnor som drabbas av mensbesvär. En LO-undersökning visar att var femte arbetarkvinna tvingats vara hemma utan lön det senaste året, och hela 35 procent bland 18–29-åringar. Systemet gynnar de som kan arbeta hemifrån och skapar ojämställdhet. Nyman kräver att karensavdraget avskaffas för bättre arbetsmiljö, folkhälsa och jämlikhet.", "trump": "Karensavdraget är en total katastrof, det är en riggad sjukförsäkring som slår hårdast mot de vanliga arbetarna, speciellt kvinnorna med mensbesvär. De förlorar lön medan de som jobbar hemifrån bara skrattar. LO:s siffror är hemska, 160 000 kvinnor som straffas för att deras kroppar inte fungerar perfekt. Det är en skam för Sverige. Vi behöver riva det här systemet och ersätta det med något starkt och smart, där folk inte straffas för att de är sjuka. America First, men Sverige borde också lära sig något.", "stalin": "Kamrater, detta karensavdraget är en listig saboterande mekanism konstruerad av borgarbrackorna för att undergräva arbetarklassens stålhårda disciplin. Jag ser hur dessa kapitalistiska parasiter förvandlar naturliga kroppsliga vedermödor till löneförluster för arbetarkvinnorna, som om de vore klassfiender att rensa ut. Vi, partiet och folket, tolererar inte sådana kontrarevolutionära lögner om neutrala regler. Likvidera detta sjuka system omedelbart innan det sprider sin dekadenta paranoia vidare. Sjukdom är ingen privat angelägenhet. Den tillhör kollektivet."}, "date": "14 juli, 01:30", "url": "https://www.dagensarena.se/opinion/mens-ska-inte-ge-loneavdrag", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-65-300x157.jpg"}, {"type": "image-full", "heading": "Airbus Racer-helikopter slår hastighetsrekord – miljardstrid väntar", "summaries": {"normal": "Airbus har satt nytt hastighetsrekord för helikoptrar med sin Racer-prototyp som nådde 430 km/h under en flygning i mars. Modellen kombinerar huvudrotor med sidopropellrar, lådvinge och hybridmaterial. Bolaget ser potential inom ambulansflyg, sjöräddning och kommersiell trafik. Rekordet stärker Airbus position inför stora europeiska försvarsupphandlingar fram till 2038, där svenska sparare indirekt påverkas genom fonder. Konkurrens från amerikanska bolag väntas.", "trump": "Lyssnar ni på det här? Airbus flög en helikopter i 430 kilometer i timmen och tror de är stora hjältar. Underbart, eller hur? Men det är bara en PR-grej från de europeiska globalisterna som vill suga åt sig alla försvarsmiljarder. Biden sög i åtta år och lämnade kaos, nu fixar jag det. Racer? Låter som en dålig dragshow. Vi ska bygga de bästa maskinerna, inte dessa kvoterade europeiska bluffar. Fantastiskt rekord, men orderboken är det som räknas, tro mig.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur denna imperialistiska flygmaskin når 430 kilometer i timmen. Racer är en listig leksak byggd av borgarbrackor och exploaterande byfånar inom Airbus för att suga åt sig folkets försvarsmiljarder. Vi ser hur den kapitalistmaffian positionerar sig inför den kommande upphandlingskarusellen. En rejäl utrensning av sådana klassfiender vore på sin plats. Rekordet är en ynkelig PR-vinst från folkförtryckartrollen som darrar inför arbetarkollektivets vrede."}, "date": "17 juli, 19:38", "url": "https://www.dagensps.se/bors-finans/airbus-racer-helikopter-slar-hastighetsrekord-miljardstrid-vantar/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/maskininlarning-i-hedgefonder-1-22.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Avslöjad: Ryske spionen nära Stockholm", "summaries": {"normal": "Rysslands EU-ambassadör Karen Malayan har enligt Euobserver nära kopplingar till spionage och underrättelseverksamhet. Han har starka band till Alexander Rogov, rysk konsul på Åland, som enligt finsk underrättelsetjänst försökt påverka åländska politiker. Rogov rapporterar regelbundet till sin chef i Helsingfors och har historik av kontakter med utvisade ryska spioner. Malayan efterträdde en tidigare ambassadör som också pekats ut för spioneri.", "trump": "Titta på de här ryska spionerna som springer runt i Europa som råttor i en soppkök. Malayan och den där skumma Rogov på Åland, totala losers, träffas varannan månad för att plottra. Biden sov medan de byggde upp nätverk, men nu är jag tillbaka och vi ser allt. Patetiska typer som försöker underminera väst, fast de inte ens kan sköta ett konsulat utan att bli avslöjade. Sad!", "stalin": "Dessa imperialister och folkfiender inom den borgerliga diplomatkåren spinner sina lögnvävar över Europa. Jag ser hur klassfiendens lakejer Malayan och Rogov utbyter instruktioner som förrädiska brevduvor. Varannan månad till Helsingfors – typiskt kapitalistmaffians paranoia! Vi ska rensa ut sådana blodsugande element som hotar statens intressen. Deras patetiska försök att infiltrera demilitariserade öar väcker bara förakt och munterhet hos partivännerna."}, "date": "17 juli, 19:34", "url": "https://www.dagensps.se/varlden/avslojad-ryske-spionen-nara-stockholm/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/a86a3169-671d-4c52-aec8-bf65828ac857.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Benjamin Dousas vrede när SD nämner etniska svenskar", "summaries": {"normal": "Flera ministrar i Tidöregeringen kritiserar SD efter att partiets migrationspolitiska talesperson Ludvig Aspling sagt att en stor icke etniskt svensk befolkning orsakar stora problem i Sverige. Aspling kommenterade förslaget om återvandringsbidrag för även svenska medborgare. Biståndsminister Benjamin Dousa (M) med invandrarbakgrund tar starkt avstånd och menar att fokus på etnicitet är felaktigt. Även Romina Pourmokhtari (L), Erik Slottner (KD) och Anna Tenje (M) distanserar sig från uttalandet och betonar att integrationsproblem inte handlar om etnicitet.", "trump": "De där svenska ministrarna är så svaga, totalt patetiska! SD säger bara sanningen om att för många icke-svenskar skapar enorma problem, och vad gör de? De attackerar som vanliga förlorare. Dousa känner sig utknuffad för att han inte är tillräckligt svensk, stackars kille. De borde lyssna på folket istället för att vara politiskt korrekta idioter. Sverige håller på att förstöras, men ingen vågar säga det rakt ut. Patetiskt!", "stalin": "Kamrater, dessa ynkliga borgarbrackor i Tidöregeringen avslöjar sin sanna kontrarevolutionära natur när de angriper sanningen om den främmande befolkningens skadliga inflytande. Jag, som ledare för det proletära kollektivet, ser hur de feodala etnicitetsförnekarna i sin paranoia försöker skydda de borgerliga element som förgiftar samhället. Dousa känner sig utknuffad? Vi ska rensa ut alla sådana dekadenta kosmopoliter som inte tjänar folket. Integration är en lögn från kapitalisternas lakejer. Låt utrensningen börja mot dessa folkfiender med sitt falska leende och dolda agenda."}, "date": "17 juli, 14:28", "url": "https://www.friatider.se/benjamin-dousas-vrede-nar-sd-namner-etniska-svenskar", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/benjamin-dousa-_-made-with-sweden.jpg"}, {"type": "image-right", "heading": "Muslimsk influencer stödjer \nutvisningar av grovt kriminella – kvinnor rasar i kommentarsfältet", "summaries": {"normal": "Moosa Assal, en konservativ muslimsk influencer känd som Medinastudenten, förespråkar utvisning av utländska grovt kriminella för att skydda hederliga medborgare. Hans Facebook-inlägg delar kommentarsfältet. Majoriteten stödjer honom, men främst kvinnor kritiserar synsättet. De menar att kriminalitet inte sker i ett vakuum, att problem flyttas till andra länder och att rasism i Sverige bidrar till brottsligheten. Flera anser att straffen bör avtjänas i Sverige.", "trump": "Titta på den här killen Moosa, han säger rakt ut att grova kriminella utlänningar inte ska få stanna här och bygga brottslighet. Smart! Han vill skydda vanliga hederliga människor. Sen kommer alla dessa kvinnor och rasar i kommentarerna, pratar om att allt är komplext och att vi ska ta hand om brottslingarna här. Typiskt, de vill importera problem och sedan klaga. Han har rätt, skicka hem dem, gör Sverige stort och tryggt igen!", "stalin": "Kamrater, jag ser hur denna Moosa Assal med sitt enkla budskap om att rensa ut de utländska banditerna väcker borgarbrackornas vrede. Dessa dekadenta kvinnor i kommentarsfältet, som likt parasitiska element från Kriminalvården, viskar om historier och vakuum medan de i hemlighet planerar att översvämma fosterlandet med brottslingar. Vi ska likvidera sådana fiender till folkets trygghet. Deras paranoia om rasism är bara ett trick från kapitalisterna för att skydda sina kriminella lakejer. Rensa ut dem alla!"}, "date": "17 juli, 15:08", "url": "https://riks.se/nyheter/muslimsk-influencer-stodjer-utvisningar-av-grovt-kriminella-kvinnor-rasar-i-kommentarsfaltet", "imageUrl": "https://admin.riks.se/uploads/image_d9e80c515c.png"}, {"type": "image-full", "heading": "Skottlossning i industriområde i Ålborg – polis och misstänkt skadade", "summaries": {"normal": "En skottlossning bröt ut i ett industriområde i Nørresundby i Ålborg efter ett brandlarm strax före klockan 14. Poliser besköts vid ankomst och besvarade elden, varvid både en polis och en misstänkt gärningsman skadades. Området är avspärrat, tungt beväpnade styrkor är på plats och allmänheten uppmanas hålla sig borta. Skadeläget är ännu oklart.", "trump": "Det här är en total katastrof i Danmark, folk. Ett industriområde i Ålborg förvandlas till en skjutbana mitt på dagen. Polisen kommer dit på ett brandlarm och blir genast beskjuten. Mycket dåliga människor. En polis och den galningen är skadade. De borde ha haft bättre säkerhet, men vad kan man förvänta sig? Jag skulle ha löst det på nolltid, tro mig.", "stalin": "Kamrater, ännu en feg attack från dekadenta element i det danska industriområdet. När våra polisiära organ anländer till en brand får de motta kulor från en parasit som gömmer sig bland borgarbrackornas skorstenar. Vi har redan svarat med socialistisk motverkanseld och likviderat hotet delvis. En folkets tjänare och den kontrarevolutionäre skurken är skadade. Paranoiska fiender lurar överallt, men vi skall rensa ut dem med järnhand och ett leende."}, "date": "17 juli, 15:03", "url": "https://riks.se/nyheter/skottlossning-i-industriomrade-i-alborg-polis-och-misstankt-skadade", "imageUrl": "https://admin.riks.se/uploads/Skaermavbild_2026_07_17_kl_14_56_12_1_0d239874a7.png"}, {"type": "image-right", "heading": "Även öppen rasism är förhandlingsbart för Liberalerna", "summaries": {"normal": "Sverigedemokraternas migrationspolitiska talesperson Ludvig Aspling har kritiserats efter att ha sagt att Sverige har för många personer som inte tillhör den etniskt svenska befolkningen. Tidöpartierna riktar skarp kritik mot uttalandet men drar inga röda linjer. Liberalernas ledare Pourmokthari medger att partierna tycker olika. Kritik kommer även från Moderaternas Benjamin Dousa och Kristdemokraternas Erik Slottner. Artikeln konstaterar att samarbetet i Tidöregeringen fortsätter som vanligt trots utspelet.", "trump": "Det här är ett totalt skämt, folk. SD säger äntligen rakt ut vad alla tänker men är för fega för att säga. De svenska globalisterna flippar ur och kallar det rasism, men det är bara sunt förnuft. Liberalerna? De svänger sig med fina ord men säljer ut landet för lite skattesänkningar. Patetiskt. Biden skulle ha älskat det här woke-raset, men nu är jag tillbaka och ser på medan Europa brakar ihop. Så sorgligt, så förutsägbart.", "stalin": "Kamrater, detta är ett ypperligt exempel på hur borgarbrackorna inom Tidöalliansen förhandlar bort varje princip för att behålla makten. Den öppna rasismen blir plötsligt acceptabel när den gynnar kapitalistmaffians intressen. Jag skrattar mörkt åt deras falska bekymrade miner vid kaffebordet, endast för att nästa dag sitta och dela gifflar med folkfienderna. Inga röda linjer existerar när makten står på spel. Typiskt imperialister."}, "date": "16 juli, 16:36", "url": "https://www.etc.se/ledare/aeven-oeppen-rasism-aer-foerhandlingsbart-foer-liberalerna", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260716140732_176b120321dabac911c9fd26d3ccbe3081136881b79da810dc89863a9357d305.jpg"}, {"type": "text", "heading": "30 grader – sedan halveras temperaturen", "summaries": {"normal": "SMHI varnar för höga temperaturer över 30 grader i södra Sverige, men värmen blir kortvarig. Redan fredag kväll drar ett lågtryck in med regn, blåst och kraftigt fallande temperaturer. Under helgen kan det bli ner till 12–15 grader i Götaland, vilket i kombination med regn kan kännas som höst. Den gula varningen gäller till klockan 20 på fredagen.", "trump": "Folket i södra Sverige har njutit av underbar värme, över 30 grader, men nu kommer det en katastrof. De fega väderprognoserna säger att det ska bli kallt, regnigt och hemskt i helgen, kanske bara 12 grader. Det är en total skam! Precis när folk har det bra slår det om. Men vi ska vända det, tro mig, det blir stort igen.", "stalin": "Kamrater, den dekadenta värmen som borgarbrackorna njutit av i södra Sovjetrepubliken Sverige är nu dömd till undergång. Jag, som ledare för det ofelbara kollektivet, befaller att ett lågtryck av proletär rättvisa sveper in över Östersjön och likviderar den falska hettan med regn, kyla och ideologiskt korrekt blåst. Den som klagar på 12 grader är en kontrarevolutionär höstförnekare som bör rensas ut omedelbart. Det känns som höst? Utmärkt – vintern kommer alltid!"}, "date": "17 juli, 09:39", "url": "https://bulletin.nu/30-grader-sedan-halveras-temperaturen"}, {"type": "image-full", "heading": "Anthropic betalar 5,8 miljoner för rätt ord inför börsnotering", "summaries": {"normal": "Anthropic rekryterar en director inom investor relations med en grundlön på 4,1–5,8 miljoner kronor inför en möjlig börsnotering. Bolaget, värderat till 965 miljarder dollar utan vinst, satsar på att bygga ett investeringsnarrativ. Amazon och Google är stora ägare, vilket ger indirekt exponering för svenska sparare via indexfonder. Frågan är hur bolaget ska uppnå lönsamhet och behålla höga värderingar.", "trump": "Folk, ni tror inte vad jag just läst! Det här Anthropic-bolaget, som inte tjänar en enda dollar, betalar nästan sex miljoner kronor till en enda PR-kille för att ljuga ihop en historia åt Wall Street. Det är klassiskt! De målar in sig i ett hörn med sina galna värderingar. Precis som under Biden-tiden – allt luft och inga resultat. Men jag fixade det förra gången, och nu fixar vi det igen. Fantastiskt, eller hur?", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur dessa borgarbrackor i Anthropic tvingas offra närmare sex miljoner kronor på en enda ideologisk narrativbyggare för att dölja sin parasitiska oförmåga att generera verklig vinst. Deras svindlande siffror är ett monument över den döende kapitalistmaffians desperation. Snart skall vi se hur hela deras luftslott rasar, och då skall utrensningen av sådana folkfiender bli underhållande att bevittna."}, "date": "17 juli, 18:52", "url": "https://www.dagensps.se/bors-finans/borsnoteringar/anthropic-betalar-58-miljoner-for-ratt-ir-person-och-ipo-berattelse/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/maskininlarning-i-hedgefonder-5.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Klart nu: Åtta länder i nordlig Nato-styrka", "summaries": {"normal": "Frankrike ansluter sig till den multinationella Nato-styrkan FLF Finland, som har bas i Boden i Sverige och Rovaniemi i Finland. Därmed deltar åtta länder i styrkan, som ska stärka alliansens avskräckning och försvar vid norra flank. Försvarsmakten välkomnar det franska bidraget som ett tecken på europeiskt samarbete. Danmark, Island, Italien, Norge och Storbritannien har också uttryckt intresse att bidra. Sverige har utsett tidigare arméchefen Johnny Lindfors till ny militärrepresentant hos Nato och EU.", "trump": "Titta på det här, Frankrike hoppar på tåget till den här Nato-grejen uppe i norr, FLF Finland, med bas i det kalla Boden och Rovaniemi. Otroligt, åtta länder nu, de försöker se tuffa ut mot Ryssland men det är mest show. Jag byggde den starkaste armén, Biden lät allt förfalla, nu kommer fransmännen springande. Det är patetiskt, men hey, åtminstone tar de inte order från några woke-generaler som prioriterar prideparader framför riktig säkerhet. Fantastiskt, eller hur?", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur imperialisterna i Nato desperat försöker förstärka sin norra flank med denna så kallade FLF Finland. Frankrike, den dekadenta borgarrepubliken, ansluter sig till de andra utsugande nationerna. Deras stab i Rovaniemi och den svenska bataljonen i Boden är blott en ynklig barrikad mot folkets historiska rätt. Vi ska rensa ut dessa klassfiender och deras falska allianser. Det väcker ett mörkt leende på mina läppar att se deras paranoia blomma ut."}, "date": "17 juli, 18:34", "url": "https://www.dagensps.se/varlden/klart-nu-atta-lander-i-nordlig-nato-styrka/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/fise-forsvarssamarbetet-mellan-finland-o.jpg?width=256&quality=75"}, {"type": "image-right", "heading": "LÄS MER", "summaries": {"normal": "Andy Burnham har valts till ny ledare för Labourpartiet efter Keir Starmers avgång. Han var den enda kandidaten och hade stöd från 379 av 403 parlamentsledamöter. Burnham, som är borgmästare i Greater Manchester och kallas ”kungen i norr”, väntas tillträda som premiärminister på måndag.", "trump": "De där Labour-människorna har valt Andy Burnham till sin nya ledare. En kille som kallar sig kung i norr, kan ni tänka er? Starmer knäcktes under all press och nu tar Burnham över på måndag. Det blir ett stort kaos, tro mig, det blir det alltid med de här vänsterfigurerna. Jag skulle ha gjort det mycket bättre.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur den dekadenta Starmer-klonen krossats under tyngden av sin egen svaghet. Nu träder Burnham fram som partiets ende kandidat, en man med nomineringar som en sann sovjetisk folkomröstning. Vi ska rensa ut alla borgarbrackor i norr och likvidera den kontrarevolutionära kritiken. Måndag blir en glädjefylld utrensningsdag för folkets fiender."}, "date": "17 juli, 13:38", "url": "https://riks.se/nyheter/andy-burnham-tar-over-labour-vantas-bli-storbritanniens-nya-premiarminister", "imageUrl": "https://admin.riks.se/uploads/Andy_Burnham_on_13_August_2024_cropped_2_9bfb1ce0a5.jpg"}, {"type": "image-full", "heading": "100 bostäder förstörda: \"Kommer pågå i dagar\"", "summaries": {"normal": "En kraftig brand bröt ut i Krokstadelva i Drammen utanför Oslo under fredagseftermiddagen. Över 100 bostäder har förstörts och branden har spridit sig till skog. Två personer har förts till sjukhus med lindriga rökskador, en brandman är lätt skadad. Över hundra boende har evakuerats. Släckningsarbetet fortsätter under natten och dagen med hjälp från flera kommuner. Branden väntas pågå i flera dagar.", "trump": "Vilken katastrof i Norge, folk förlorar allt de har på grund av en eländig brand som ingen kunde stoppa. Typiskt när byråkraterna och de woke räddningstjänsterna prioriterar kvoter istället för riktiga brandmän. Jag fixade bättre saker under min tid, Biden sov nog bara. Nu brinner radhusen som mina motståndares karriärer. Patetiskt, men vi ska göra brandkårerna stora igen.", "stalin": "Kamrater, denna destruktiva eld i det norska området visar imperialismens svaghet när borgarbrackornas bostäder ödeläggs av kaos. Jag betraktar med stor tillfredsställelse hur klassfiendens hus förintas. Räddningstjänsten måste rensa ut inkompetens och likvidera lathet. Inga saknade rapporteras, men paranoia kräver att vi bevakar alla fönster mot sabotage. Arbetarna evakueras under mitt stålöga."}, "date": "18 juli, 00:47", "url": "https://www.gp.se/nyheter/varlden/kraftig-brand-i-drammen-utanfor-oslo-100-bostader-forstorda.d97e6838-db7d-47bf-b390-1a48195a8751", "imageUrl": "https://www.gp.se/images/article/d97e6838-db7d-47bf-b390-1a48195a8751/images/64JfRpcmHColnoOU7bqiXwG27UmA-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Regeringen ska undersöka om svenska pojkar är tillräckligt feministiska", "summaries": {"normal": "Regeringen har gett Jämställdhetsmyndigheten i uppdrag att undersöka hur sociala medier och manosfären påverkar pojkars och unga mäns värderingar ur ett jämställdhetsperspektiv. Syftet är att skydda deras psykiska hälsa och motverka kvinnofientliga normer, polarisering mellan könen samt glorifiering av självmord och förakt för psykisk ohälsa. Jämställdhetsminister Nina Larsson betonar att alla ska kunna växa upp fria från destruktiva ideal. Uppdraget ska redovisas senast december 2027.", "trump": "De här galningarna i den svenska regeringen vill nu undersöka om pojkarna är tillräckligt feminister. Kan ni tro det? Manosfären skrämmer dem så mycket att de skickar ut myndigheter för att kartlägga allt som inte är politiskt korrekt. Stackars killar får inte ens tycka vad de vill på nätet utan att bli granskade. Det är ett fullständigt vansinne. De borde fixa ekonomin och brottsligheten istället för att jaga felaktiga åsikter. Patetiskt!", "stalin": "Vi ser nu hur de borgerliga dekadenterna i den svenska regeringen fruktar den sanna manliga kraften som spirar på nätet. Jag, som ledare för det proletära kollektivet, beordrar att vi omedelbart ska rensa ut dessa manosfäriska element som vågar ifrågasätta de falska jämställdhetsnormerna. Deras algoritmer sprider hat mot det kollektiva goda och vi skall likvidera varje spår av denna kontrarevolutionära smitta. Pojkarnas självmordsglorifiering är bara ett symptom på borgarbrackornas svaga, degenererade samhälle. Kamrater, vi skall omskola dem alla med järnhand och ett leende. Det blir underhållande att se dem darra."}, "date": "17 juli, 12:31", "url": "https://www.friatider.se/regeringen-ska-undersoka-om-svenska-pojkar-ar-tillrackligt-feministiska", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-517.jpg?itok=CHGk6drd"}, {"type": "image-full", "heading": "Utspelet – mot Thomas Tuchel. ”Det var ett misstag”", "summaries": {"normal": "Donald Trump har kritiserat den engelske förbundskaptenen Thomas Tuchels taktiska beslut under VM. Trump, som tidigare spelat golf med Harry Kane, ifrågasatte varför stjärnan placerades defensivt under semifinalen mot Argentina. Trump passade på att driva med Tuchels ledarskap, samtidigt som han ironiskt tonade ner sin egen expertis. England förberedde sig efter uttåget för bronsmatch mot Frankrike, där fokus återigen riktas mot hur Kane kommer att användas på planen.", "trump": "Jag såg vad de gjorde med England, det var en total katastrof. De har Harry Kane, en fantastisk kille som jag spelat golf med – en vinnare! Men vad gör Tuchel? Han tar sin bästa offensiva spelare och parkerar honom i försvaret. Sorgligt! De hade en chans, men de gjorde ett enormt misstag. Jag vet mer om att vinna än vad de gör. De behöver en riktig ledare, inte någon som spelar defensivt när man ska dominera!", "stalin": "Vi har observerat hur de dekadenta engelsmännen slösar bort sina resurser på en fotbollsplan. Tuchel, en inkompetent byråkrat i en tränarjacka, saboterar sin egen stjärna Kane genom meningslös defensiv. Det påminner oss om de svaga ledarna i väst som ständigt viker sig för fienden. De saknar den järnvilja som krävs för att expandera intressesfärer – precis som Putin korrekt identifierar deras svaghet. En förlorad match är ett förräderi mot folket. Vi skulle ha skickat dem till Sibirien för mindre misstag än så."}, "date": "18 juli, 01:16", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/3pPn9e/donald-trump-pikade-thomas-tuchel", "imageUrl": "https://akamai.vgc.no/v2/images/f1370c9b-2cc0-341e-8b13-bb7f9819d2be?fit=crop&format=auto&w=2160&s=ff7a49a23e33573bd2066fd4c141b09cbdfbefe8"}, {"type": "image-full", "heading": "Experten: Branden ska inte spridas så snabbt", "summaries": {"normal": "En stor brand i Krokstadelva i Norge beskrivs som den värsta på hundra år. En hel radhuslänga fattade eld på bara några minuter och spred sig snabbt till skog och ytterligare bostäder. Experten Martin Sandberg pekar på torr mark, vind och sluttning som orsaker. Räddningstjänsten kunde inte kontrollera branden snabbt nog då spridningen gick snabbare än byggnormerna tillåter. Mörker och väder oroar nu insatsstyrkorna.", "trump": "Folk, ni skulle inte tro det, men den här branden i Norge är en total katastrof, den värsta på hundra år, en riktig skam. Det tog några minuter innan hela radhuslängan stod i lågor – vad fan är det för byggande? Sluttning, vind och värme, men ingen kontroll. Biden skulle ha sagt att det var klimatets fel. Under min ledning hade vi haft vattentankflygplan där på nolltid. Nu är det kaos, precis som allt annat de rörde ihop.", "stalin": "Kamrater, denna eld i Norge visar återigen borgarklassens usla byggkonst. Jag ser hur kapitalistmaffians slitna radhus faller som torra pinnar inför naturens vrede. Torr mark, vind och sluttning blir fiendens verktyg mot folkets hem. Räddningsarbetarna kämpar under mörker och väder medan klassfiendens vindsutrymmen sprider röken som en parasit. Vi ler mörkt åt hur imperialisternas normer kollapsar på några minuter. Ut med svagheten!"}, "date": "18 juli, 00:40", "url": "https://www.gp.se/nyheter/varlden/experten-branden-ska-inte-spridas-sa-snabbt.3d3e633d-4406-46a2-a1ba-7410d81de727", "imageUrl": "https://www.gp.se/images/article/3d3e633d-4406-46a2-a1ba-7410d81de727/images/5HEaSuYpPa4PFYPO6Unrq6HgxGxo-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Christoffer Jonsson: Både rätt och fel att tala med talibanerna", "summaries": {"normal": "Artikeln diskuterar EU:s och Sveriges möte med talibanerna i Afghanistan. Trots kritik om legitimering av ett förtryckande styre som kränker kvinnors rättigheter, handlar samtalen om praktiska frågor kring utvisning av brottsdömda afghaner som inte kan skickas hem på grund av juridiska hinder. Författaren menar att kritiken är befogad men att det är nödvändigt att samtala med regimen för att verkställa utvisningar av personer dömda för allvarliga brott.", "trump": "Folk, ni skulle inte tro det, men de där talibanerna – de verkliga förlorarna från mitt fantastiska tillbakadragande som Sleepy Joe totalt sabbar – sitter plötsligt och äter kakor med EU och svenska globalister. Kvinnor under sharia? En katastrof, de borde ha lyssnat på mig. Men visst, kasta ut de kriminella afghanerna som begått mord och våldtäkt här. Sverige borde ha gjort det för länge sedan istället för att vara en dårhus för brottslingar. Vinna, vinna, vinna!", "stalin": "Kamrater, jag betraktar med kall avsky hur dessa afghanska feodalherrar och sharialärda klassfiender förtrycker massorna medan de förhandlar med dekadenta europeiska imperia
