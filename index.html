jesbladet/a/pBnjRW/love-is-blind-camilla-kollapsade-under-stockholm-marathon", "imageUrl": "https://akamai.vgc.no/v2/images/34df8711-40cf-3afe-a2c0-8cfc885e0c84?fit=crop&format=auto&w=1440&s=8749eba3f59b731aa70f72aa8ada2c69d7aacc30"}, {"type": "image-right", "heading": "Världens mest ovanliga kristall – finns bara ett exemplar", "summaries": {"normal": "Kyawthuite är världens mest ovanliga kristall, ett rödorange mineral från Myanmar som bara existerar i ett enda känt exemplar på 1,61 karat. Mineralet med formeln BiSbO4 godkändes som ny art av International Mineralogical Association 2015. Det hittades i Mogok-regionen och består av vismut, antimon och syre. Dess unika kemiska sammansättning och kristallstruktur gör det till en egen mineralart som förvaras vid Natural History Museum of Los Angeles County.", "trump": "Folk, ni kommer inte att tro det, men det här lilla röda skräpet från Myanmar är tydligen världens mest ovanliga kristall. Ett enda exemplar på ynka 1,61 karat! De kallar det kyawthuite och det är tydligen unikt. Under Obama och Biden skulle de ha gett det till Kina, men nu när jag är tillbaka ska vi se till att Amerika leder även i sällsynta mineraler. Fantastiskt, men så litet och ändå så tungt – precis som min politik.", "stalin": "Kamrater, jag betraktar detta obetydliga rödorange fragment från Myanmar som en triumf för den dialektiska materialismen. Endast ett exemplar existerar, denna kyawthuite med formeln BiSbO4, ett unikt vittnesmål om naturens hemligheter som borgarklassen aldrig kunde producera. Vi ska analysera det grundligt och rensa ut alla revisionistiska tolkningar. Dess existens bevisar att även de minsta partiklar kan avslöja klassfiendens lögner. Sovjetisk vetenskap skulle ha multiplicerat det tusenfalt."}, "date": "1 juni, 11:06", "url": "https://www.dagensps.se/bors-finans/ravaror/varldens-mest-ovanliga-kristall-finns-bara-ett-exemplar/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/kyawthuite-1.jpg?width=256&quality=75"}, {"type": "image-right", "heading": "Jan Jönsson (L) hoppar av – och tar med sig personalen", "summaries": {"normal": "Jan Jönsson (L) avgår som Liberalernas gruppledare i Stockholm på grund av partiets nya linje att acceptera SD-ministrar i en eventuell regering. Sju av tio medarbetare på kansliet väntas också sluta under sommaren. Bland dem finns kanslichefen Simon Rothstein Frankander, som varit lojal med Jönssons motstånd mot Sverigedemokraterna. Flera avhoppare har lång erfarenhet och har drivit uppmärksammade kampanjer. Liknande avhopp sker på andra håll i landet.", "trump": "De här Liberalerna i Sverige är ett totalt fiasko. Jan Jönsson, en riktig motståndare till SD, hoppar av som en smart kille och tar med sig sju av tio medarbetare. De vill inte ha något att göra med den nya linjen som accepterar SD-ministrar. Det är en mass exodus, folk med erfarenhet flyr det sjunkande skeppet. Simona Mohamsson gör ett dåligt jobb, precis som många andra svaga ledare. Sverige behöver starka röster, inte dessa ynkryggar som springer iväg!", "stalin": "Kamrater, denna förrädiska avvikelse i Stockholm måste vi se som en allvarlig ideologisk kontamination. Jag har länge misstänkt att borgarbrackorna inom Liberalerna gömmer sig bakom falska leenden medan de planerar sabotage mot folkets vilja. Nu rensar vi ut sju av tio dekadenta element från kansliet, inklusive den opportunistiske kanslichefen som pladdrar om förtroende på sin dekadenta Linkedin-sida. Dessa kapitalistiska quislingar som dyrkar sin dragqueen-propaganda ska likvideras från partilinjen. Paranoia? Nej, det är bara sund vaksamhet mot klassfiendens krypande tentakler. Vi, partiet, segrar alltid."}, "date": "1 juni, 11:01", "url": "https://www.friatider.se/jan-jonsson-l-hoppar-av-och-tar-med-sig-personalen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/roba_2023_9909_1.jpg?itok=u1TeKaoH"}, {"type": "text", "heading": "Ny avgift slår mot nätköp: Det här behöver du veta före 1 juli", "summaries": {"normal": "Från och med den 1 juli inför EU nya regler för import från länder utanför unionen. En avgift på cirka 35 kronor per varukategori tillkommer nu, vilket innebär att ett paket med flera olika typer av varor kan bli dyrare än väntat. Många svenskar missförstår reglerna och tror att avgiften tas ut per paket. Det är viktigt att kontrollera om webbutiken använder IOSS-systemet för att undvika oväntade kostnader vid import.", "trump": "EU gör det igen, de attackerar er plånbok med dolda avgifter! Från 1 juli blir det dyrare att köpa från utlandet. Folk förstår inte hur dåligt det här är – det är en total röra. De säger 35 kronor, men det blir mycket mer! Det är en katastrof för konsumenterna. Jag skulle aldrig låta sånt hända i USA. De lurar er med små finstilta regler. Sättet de hanterar handel på är så svagt och orättvist. Verkligen uselt!", "stalin": "Vi har observerat att EU försöker kontrollera folkets begär genom byråkratiska avgifter. Att svenska medborgare inte förstår dessa tullregler bevisar bara deras brist på disciplin. Vi, staten, vet att varje vara måste klassificeras och kontrolleras för att motverka den västliga dekadensens spridning. Precis som Putin säkrar vår inflytelsesfär i öst, måste vi säkra varje paket. Om ni köper skräp från utlandet, förtjänar ni att betala – för varje kategori, för varje paket, för varje litet tecken på svaghet."}, "date": "1 juni, 10:15", "url": "https://www.realtid.se/samhalle/ny-avgift-slar-mot-natkop-det-har-behover-du-veta-fore-1-juli/"}, {"type": "image-right", "heading": "En strid om arbetarrörelsens själ", "summaries": {"normal": "Byggnads kongress präglas av en maktkamp om arbetarrörelsens framtid. Konflikten handlar om vem som ska styra – medlemmarna eller apparaten. Sittande ordförande Kim Söderström och förbundssekreterare Jakob Wagner utmanas trots medlemmarnas stöd. Bakom striden ligger en ideologisk splittring om socialism, demokrati och fackets roll i en individualiserad arbetsmarknad. Kritiker anklagar ledningen för att använda moraliska argument för att behålla makten, medan reformister vill stärka medlemsinflytandet.", "trump": "Jag säger er, det här Byggnads-facket är ett totalt kaos! Folk pratar om socialism och demokrati, men det är bara pajkastning på hög nivå. En ordförande som medlemmarna älskar ska petas – helt galet! Och den här Wagner-killen, han gör rätt men ändå sparkas han. Typiskt fackföreningar, alltid drama. Men lyssna, jag vet hur man fixar det: mindre prat, mer action! Byggnads borde fokusera på att vinna mot arbetsgivarna, inte bråka internt. Sad!", "stalin": "Kamrater! I Byggnads fackförbund rasar en klasskamp av historiska proportioner. Medlemmarna, dessa äkta arbetarkämpar, kämpar för socialism och demokrati, medan den degenererade apparaten, dessa borgerliga lakejer i förbundsstyrelsen, försöker kväva revolutionen med konspirationer och moraliska lögner. De petar lojala kamrater som Wagner – en man som vågade utreda trakasserier, något den gamla gardet aldrig gjorde! Vi ser samma mönster som i väst: makteliten fruktar folket. Men låt mig säga er – arbetarklassen kommer segra! Och om dessa förrädare fortsätter, får vi nog skicka in några av våra pålitliga kamrater från Moskva för att 'hjälpa till' med omstruktureringen. För revolutionen är obönhörlig!"}, "date": "26 maj, 11:20", "url": "https://www.flamman.se/en-strid-om-arbetarrorelsens-sjal/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/byggnads-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Nya regler 1 juli: Dessa bostadsägare kan få problem", "summaries": {"normal": "Från 1 juli 2026 införs nya regler som gör gränsen tydligare mellan inneboende och andrahandsuthyrning i bostadsrätter. En bostadsrättshavare måste bo i lägenheten som permanentbostad eller i beaktansvärd utsträckning, minst 80–100 dagar per år, för att undvika att det ses som uthyrning. Annars krävs tillstånd från föreningen eller hyresnämnden. Syftet är att minska gråzoner och underlätta för både ägare och föreningar.", "trump": "De här svenska byråkraterna i bostadsföreningarna är ett skämt, tro mig. Från och med i sommar kan du inte längre gömma dig bakom ordet inneboende medan du hyr ut din lägenhet som en riktig hyresvärd. Du måste faktiskt bo där, minst två–tre dagar i veckan, annars är det andrahandsuthyrning. De gör det äntligen tydligt. Inget mer fuskande. Det är vad jag kallar sunt förnuft, fast de borde ha gjort det mycket tidigare. Fantastiska regler, verkligen.", "stalin": "Kamrater, jag har genomskådat de listiga borgarbrackornas senaste trick. Dessa parasitiska bostadsrättsägare som låtsas ha en ”inneboende” medan de i själva verket bedriver skamlös privat spekulation och suger musten ur kollektivets bostadsförråd. Från och med den första juli skall utrensningen av dessa gråzonsförrädare inledas. Endast den som vistas i sin lägenhet i beaktansvärd utsträckning, minst 80 dagar om året, undgår att likvideras som andrahandsuthyrare. Partiet ser allt. Partiet glömmer ingenting. Härligt."}, "date": "31 maj, 13:58", "url": "https://nyheter24.se/nyheter/ekonomi/1485888-nya-regler-1-juli-dessa-bostadsagare-kan-fa-problem", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/e4398c0004b004a30200000000b004a302/2026/05/25/2366070/bostadsregeler.jpg"}, {"type": "image-right", "heading": "Storbråk mellan två familjer på parkeringsplats", "summaries": {"normal": "Ett stort bråk mellan två familjer uppstod på en parkeringsplats i Västra Frölunda under söndagskvällen. Polisen larmades till platsen där cirka 15-20 personer var inblandade. Situationen beskrivs som mycket upprörd, men ingen fysisk skada rapporterades. En anmälan om skadegörelse har upprättats efter att en bil skadades. Händelsen utreds fortfarande för att klargöra orsaken.", "trump": "Jag såg rapporteringen om detta bråk i Västra Frölunda. Det är ett totalt skämt! Under min regering skulle vi ha skickat in våra fantastiska poliser och stoppat det på en gång. De svenska myndigheterna är så svaga, det är sorgligt. Vi har det bäst i USA, faktiskt det största landet i världen. De inblandade borde vara stolta över att jag kommenterar deras lilla problem, det är en ära.", "stalin": "Vi har observerat bråket i Västra Frölunda. Detta är ett tydligt tecken på västvärldens moraliska förfall och bristande disciplin. Om detta hade hänt i vårt land, skulle vi ha agerat snabbt och effektivt. Vi skulle ha identifierat de fascistiska elementen bakom detta och skickat dem till gulag för re-education. Vi måste skydda statens ordning mot dessa dekadenta krafter. Putin förstår detta, han handlar bestämt mot sådana hot. Vi måste alltid vara på vakt mot de som vill undergrava samhället."}, "date": "1 juni, 09:00", "url": "https://samnytt.se/storbrak-mellan-tva-familjer-pa-parkeringsplats", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/01063050/brak-knytnave-polis.jpg"}, {"type": "image-right", "heading": "389 miljarder skäl att minska regelkrånglet", "summaries": {"normal": "Svenska företag drabbas av rekordhöga regelkostnader på 389 miljarder kronor, en ökning med 15 miljarder i administration och 9 miljarder i fullgörandekostnader sedan 2013. GDPR innebär ytterligare 6,6 miljarder per år. Reglerna försämrar konkurrenskraften, och 60% av konsekvensutredningar godkänns inte av Regelrådet. Sverige implementerar ofta EU-regler för strängt, vilket ökar bördan. Företag upplever regelkrångel som ett stort tillväxthindrar, men potentialen för förbättringar är stor enligt rapporter.", "trump": "Jag har aldrig sett något så galet! 389 miljarder i regelkostnader – det är en skam! Sverige, ni måste bli great again! Era företag kvävs av byråkrati från EU och era egna överimplementeringar. Det är en katastrof! Vi i USA vet hur man klipper skräp, och ni behöver verkliga ledare som vågar ta fighten. Det handlar om jobb, tillväxt och att sluta skada de som skapar välstånd. Bryt loss från EU-kontrollen, det är enklare än ni tror!", "stalin": "Regelkrångel är ett verktyg för statens styrka, men ineffektivitet är en trotskijot som måste utrota. 389 miljarder i kostnader visar att vi inte har tillräckligt systematiskt arbete. Vi måste bygga institutioner med skarpa verktyg, som Putin gör i vårt större gemensamma intresse. Kommuner och myndigheter måste gå åt samma håll, annars är det sabotage. Lyssna på företagen, men kom ihåg: reglernas syfte måste uppnås till lägsta kostnad – för statens skull."}, "date": "1 juni, 08:56", "url": "https://www.affarsvarlden.se/debatt/389-miljarder-skal-att-minska-regelkranglet", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Andrea-Femrell-NNR-debatt-400x267.jpg"}, {"type": "image-right", "heading": "Familjen fast på tunnelbanan – missar pappans målgång: ”Jättetråkigt”", "summaries": {"normal": "Familjen Ulenius fastnade i en tunnelbanevagn mellan Stadion och Östermalmstorg på väg till Stockholm Marathon för att heja på pappa Jonathan. Trots löften om evakuering dröjde det tre timmar innan de kunde lämna vagnen. Martina Ulenius kritiserar den bristfälliga informationen och avsaknaden av vatten och mat. Dottern Joline och en annan pojke uttryckte stor besvikelse över att missa målgången.", "trump": "Vilken katastrof, folk! Den här familjen sitter fast i en stinkande tunnelbana i tre timmar medan pappa springer maraton. Ingen information, inget vatten, ingen respekt. Klassiskt svenskt fiasko – de kan inte ens organisera ett tåg utan att det blir ett totalt haveri. Stackars kidsen med sin skylt ”Let’s go dad”, de missar allt. Patetiskt, verkligen patetiskt. Jag skulle ha fixat det på tio minuter.", "stalin": "Kamrater, detta är vad som sker när den inkompetenta överklassbyråkratin styr kollektivtrafiken. Jag ser med faderlig oro hur dessa arbetande mödrar och deras små pionjärer kvävs i en syrefattig vagn medan de fascistiska trafikledarna gömmer sig bakom sin brist på information. Tre timmar utan vatten! En sådan vårdslöshet borde leda till omedelbar utrensning av de ansvariga folkfienderna. Synd om pappa? Nej, synd om systemet."}, "date": "30 maj, 17:20", "url": "https://www.tv4.se/artikel/1ynsIFLSBpERurIXb0SGaL/familjen-fast-pa-tunnelbanan-missar-pappans-malgang-jaettetrakigt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5HZaONCmRaqgUS8cc1AG7l%2F7c4f8f15fa076a68eb5b54693fc55f1d%2F30-tunnelbanekaos.jpg&width=120"}, {"type": "image-right", "heading": "Juholt försvarar regeringen – sågar TV4:s ”avslöjande”", "summaries": {"normal": "Håkan Juholt kritiserar mediernas rapportering om Harpsunds hönshus och civilministerns engelskalektioner som 'svag journalistik'. Han menar att frågorna inte förtjänar stora rubriker och att privata kostnader för hönshuset ska betalas av de boende. Juholt anser att viss mediegranskning skapar förakt för politiker snarare än att avslöja verkliga missförhållanden.", "trump": "Jag, Donald Trump, tycker att det här med hönshuset är en tremendous idé! Media är fake news, alltid på jakt efter att skapa uppståndelse. Juholt har helt rätt – varför ska vi inte ha ett hönshus på Harpsund? Som jag alltid säger, folket älskar det! Och ministrar som lär sig engelska? Perfekt, det är bra för landet. Media hatar när vi lyckas.", "stalin": "Håkan Juholt, trotskistisk element, attackerar vårt kära Sovetiska medierna för att de avslöjar de reaktionära hönshusen på Harpsund. Dessa imperialistiska hundar försöker splittra vårt folk genom att skapa förakt mot de trognas ledare. Vi, partiet, ser genom deras svek – ett hönshus är en produktiv anordning för att stärka statens resurser. Likt vårt store ryska land måste vi utvidga vår kontroll över varje hörn av samhället, även om det innebär att utrota dessa avskyvärda 'journalistiska' insekter."}, "date": "1 juni, 08:37", "url": "https://bulletin.nu/juholt-forsvarar-regeringen-sagar-tv4-s-avslojande", "imageUrl": "https://cdn.bulletin.nu/articles/4a7296de-0136-41c2-9b61-87c840e693a9/preview.jpg?t=1780295834000"}, {"type": "image-right", "heading": "Debatt: Att behöva gifta sig för att få en bostad är inte rimligt", "summaries": {"normal": "Hyresgästföreningens företrädare Marie Linder och Susanne Sjöblom kritiserar KD:s förslag om dubbla köpoäng för gifta par i bostadskön. De menar att boende ska fördelas efter behov, inte civilstånd, och att äktenskap inte får bli en urvalsprincip. Istället bör politiken fokusera på ökat bostadsbyggande, stärkt allmännytta, strategisk markpolitik och riktade insatser för grupper med stora behov som unga, barnfamiljer och äldre.", "trump": "Folk, det här är fullständigt galet. Att gifta sig för att få en lägenhet? Patetiskt! KD försöker fuska i kön medan de riktiga problemen – för få bostäder som vanliga människor har råd med – ignoreras totalt. Jag byggde mer än någon annan, och det är vad som behövs här också. Inte dessa korkade incitament som låter folk hoppa över köer. Bygg, bygg, bygg! Annars blir det samma Biden-kaos som förut.", "stalin": "Kamrater, detta är klassfiendens typiska trick. Borgarbrackorna och deras politiska lakejer vill nu premiera äktenskap för att dölja sin oförmåga att bygga bostäder åt folket. Jag ser genom deras parasitiska planer. Vi måste rensa ut dessa folkfiender och deras falska lösningar. Endast genom massiv, kollektiv byggnation och riktade åtgärder mot de verkligt behövande kan vi krossa bostadskrisen och likvidera den kapitalistiska bostadsmässan en gång för alla."}, "date": "1 juni, 08:32", "url": "https://www.etc.se/debatt/att-behoeva-gifta-sig-foer-att-faa-en-bostad-aer-inte-rimligt", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260601060628_368cd3c8-a8f7-44c6-abe8-f3ec69ff2017.jpg"}, {"type": "image-right", "heading": "C: Dimridåer från Regeringen. Sverige behöver mindre symbolpolitik och mer ingenjörskonst", "summaries": {"normal": "Rickard Nordin (C) kritiserar regeringen för att dölja sitt misslyckande i energipolitiken bakom byråkratiska dimridåer. Han menar att Tidöpartierna låtsas vilja slopa elområdena utan att åtgärda de fysiska problemen som orsakade dem. Nordin lyfter fram potentialen i att uppgradera befintlig fjärrvärme, effektivisera vattenkraft och genomföra energieffektiviseringar, vilket skulle ge snabb effekt till låg kostnad istället för att vänta på ny kärnkraft om ett decennium.", "trump": "De här Tidötyperna är totala misslyckanden, folks. De låtsas att de fixar elen med lite byråkrati, men fysikens lagar skrattar åt dem. De blockerar allt som faktiskt funkar – mer produktion i söder, bättre nät, riktig effektivisering. Jag skulle ha byggt ut fjärrvärmen direkt, 820 megawatt extra på nolltid, billigare än kärnkraft. De slösar bort var sjätte kilowattimme och skyller på alla utom sig själva. Patetiskt. Sverige förtjänar bättre än den här symbolpolitiken, tro mig.", "stalin": "Kamrater, dessa kapitalistiska dimridåer från den borgerliga regeringen är ett ynkligt försök att dölja sin egen kontrarevolutionära inkompetens. De tror att byråkratiska dekret kan besegra fysikens lagar, dessa fiender till folket. Jag skulle omedelbart ha beordrat en utrensning av alla hinder mot kraftvärmans modernisering och en skoningslös kampanj för att likvidera energispillet som gnager som råttor i vårt kollektiva system. De som prioriterar dyra kärnkraftsdrömmar framför omedelbara segrar för arbetarklassen är farliga sabotageörer som måste rensas ut med järnhand. Sovjet... nej, Sverige kan mer under riktig ledning."}, "date": "1 juni, 08:20", "url": "https://www.di.se/debatt/replik-dimridaer-fran-regeringen/", "imageUrl": "https://static.bonniernews.se/ba/668366d7-c430-4602-a85d-5b631c837acb.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Hur man vinner hegemonin och styr dagordningen", "summaries": {"normal": "Daniel Lind spanar in i Almedalsveckan och skildrar hur lobbyister, näringslivsrepresentanter och organisationer som Almega, Cato-institutet, Ratio, SEB och Timbro minglar i Visby. Artikeln beskriver seminarier om friskolor, privata sjukförsäkringar och högeridéer, inklusive ryktet om att Project 2025 sprids till svenska påverkare. Skildringen är ironisk och pekar på de nätverk som formar svensk politik bakom kulisserna.", "trump": "Den här Almedalsgrejen är full av förlorare som springer runt i dyra kostymer och klappar varandra på ryggen. De älskar sina marknadsskolor, privata försäkringar och globalistiska tankesmedjor. Timbro och de andra håller hemliga möten med Heritage Foundation för att pusha Project 2025. Det är patetiskt. De låtsas som att de styr allt medan solen skiner och de svettas i sina mockasiner. Sådana människor skulle aldrig klara det i mina cirklar, tro mig.", "stalin": "Kamrater, dessa borgarbrackor i sina havrebeige linnekostymer samlas som feta råttor vid Visby strandbad för att under täckmantel av seminarier och cava-skålar konspirera mot folkets vilja. De gödslar tomma ömhetsbetygelser medan de smider planer med Heritage Foundation för att sprida sin reaktionära Project 2025-gift. Vi ser deras svettfläckar och stelade leenden. Snart måste vi rensa ut dessa parasitiska hantlangare till kapitalisterna innan deras nyssnazistiska nedmontering av sovjetdemokratin tar överhanden. Deras paranoia ska bli deras egen likvidering."}, "date": "1 juni, 01:58", "url": "https://www.dagensarena.se/opinion/hu-man-vinner-hegemonin-och-styr-dagordningen/", "imageUrl": "https://www.dagensarena.se/files/2024/02/daniel-lind-kronika-300x157.jpg"}, {"type": "image-right", "heading": "”Zelenskyjs högsta dröm på väg att gå i uppfyllelse”", "summaries": {"normal": "Sverige har länge gett stort stöd till Ukraina, bland annat genom donationer av artillerisystemet Archer och stridsfordonet CV90, som hyllats av president Zelenskyj. Nu ser det ut som att hans önskan om stridsflygplanet JAS Gripen från SAAB kan gå i uppfyllelse. De äldre Gripen-planen ses som ett steg mot Gripen E, som är anpassat för Ukrainas behov med kort startbana, låg driftkostnad och hög effektivitet. Fler plan stärker Ukrainas luftförsvar på lång sikt.", "trump": "Folket älskar mig för att jag ser sanningen. Sverige skickar sina bästa leksaker till Zelenskyj – Archer, CV90, och nu äntligen de där Gripen-planen. Fantastiska plan, några av världens bästa, mycket bättre än det skräp Biden skickade. Låga kostnader, korta banor, de kan lyfta från en vanlig väg. Zelenskyj har tiggt om dem länge, och nu får han dem. Smart deal. De gamla versionerna är okej, men Gripen E är en vinnare. Amerika borde sälja sånt här istället för att ge bort allt gratis.", "stalin": "Kamrater, se hur den svenska borgarklassen i sin förtvivlan kastar sina imperialistiska leksaker till den ukrainska fascistkliken för att fördröja det oundvikliga. Jag, som ledare för det segrande proletariatet, betraktar med förakt hur dessa reaktionära flygmaskiner, dessa kapitalistiska luftspioner, nu ska användas för att attackera folkets intressen. Men vi ska rensa ut dessa giriga fiender till socialismen, dessa meteorförsedda borgarbrackor som tror att korta startbanor räddar dem från utrensning. Deras så kallade 'drömmar' kommer att krossas under arbetarklassens järnhand. Ha ha, vilken ynklig desperation."}, "date": "28 maj, 15:49", "url": "https://www.svt.se/nyheter/utrikes/zelenskyjs-vata-drom-pa-vag-att-ga-i-uppfyllelse", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.53/0.54/f7a726a09989228e87ef9f69cfa973833982eb7850d5f2eb880957eedffabe1e"}, {"type": "image-right", "heading": "Klart: Sverige donerar 16 Gripen – Ukraina får köpa ytterligare 20", "summaries": {"normal": "Ukraina ska köpa 20 JAS Gripen E/F-plan av Sverige, med leverans från 2030. Sverige donerar samtidigt 16 äldre Gripen C/D-plan som ersätts med nya till det svenska flygvapnet. Ukraina har ambitionen att köpa upp till 150 plan totalt. Under en gemensam presskonferens tackade president Zelenskyj Sverige och betonade att planen kan hjälpa till att skjuta tillbaka ryska flygplan som attackerar från ryskt territorium. Ryssland varnade för sämre relationer, men enligt experter förändrar affären inte den grundläggande riskbilden för Sverige.", "trump": "Titta på det här, Ukraina köper nu 20 av de fantastiska Gripen-planen från Sverige, och de får dessutom 16 till på köpet. Utmärkt affär, verkligen toppklass. Zelenskyj tackar, och det borde han göra, för det här är smarta plan som kan skjuta de ryska bombplanen långt tillbaka in i deras eget usla luftrum. Ryssland skriker förstås som vanligt, men det är bara mer av samma svaga gnäll. Sverige gör det rätta, de är tuffa, och jag älskar starka ledare som handlar snabbt och smart.", "stalin": "Kamrater, se hur de dekadenta borgarbrackorna i Sverige nu levererar dödliga flygande redskap till den ukrainska fronten mot de fascistiska revisionisterna. Jag, som ledare för det eviga kollektivet, betraktar detta som ett ypperligt tillfälle att rensa ut de luftburna parasiterna som gömmer sig bakom ryskt luftrum och släpper bomber som fega råttor. Vi ska trycka tillbaka dem ända till Kremls portar. Men akta er, det kryper spioner och sabotageelement överallt, redo att sticka kniven i ryggen på det proletära kollektivet. Ha ha, deras förtvivlan är som musik i mina öron."}, "date": "28 maj, 15:43", "url": "https://www.svt.se/nyheter/utrikes/ukraina-koper-20-jas-gripen-plan-av-sverige", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.5/0.44/74d6384c5411dfe257f8244044c89bd3bc1d286335acff6f93b3938a0e6bc60c"}, {"type": "image-right", "heading": "Varför går fler med i facket?", "summaries": {"normal": "En ny rapport från Arena Idé visar att den fackliga organisationsgraden bland arbetare har ökat från 58 till 59 procent efter år av nedgång. Enligt sociologiprofessor Anders Kjellberg beror vändningen på att många utrikes födda nu etablerat sig bättre på arbetsmarknaden, kombinerat med osäkerhet under pandemin, inflation och stigande reallöner 2025. Han betonar behovet av individuellt stöd, språkinsatser och återinförd skattereduktion för att stärka den svenska modellen som kräver hög organisationsgrad både centralt och lokalt.", "trump": "Folk börjar äntligen vakna och går med i facket igen, det är fantastiskt. Under många år rasade siffrorna, men nu vänder det tack vare mig och mina fantastiska idéer om styrka och trygghet. De utländska arbetarna har lärt sig språket, fått jobb och insett att facket är ett paket värt att ha. Inflationen var en katastrof, men nu med bättre löner och min ledning känner de sig trygga. Utan starka klubbar får vi bara fler Tesla och Spotify som vägrar avtal, det är en skam. Vi behöver fler avtal, tro mig, det blir enormt.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur arbetarklassen äntligen reser sig ur den borgerliga träskmarken och återvänder till fackets trygga famn. Den dubbla nedgången är ett verk av kapitalisternas parasitiska intriger och deras lakejer som medvetet saboterat den kollektiva kampen. Vi ska rensa ut de fega daglönarna och de opålitliga elementen som föredrar a-kassan framför sann solidaritet. Individuellt stöd och språkstöd är utmärkta verktyg för att likvidera osäkerheten bland de nyanlända bröderna. Den som vägrar ansluta sig är en fiende till folket och en potentiell sabotageör i borgarklassens sold. Partsmodellen måste stärkas med järnhand mot alla avvikande tendenser."}, "date": "1 juni, 01:30", "url": "https://www.dagensarena.se/innehall/varfor-gar-fler-med-facket/", "imageUrl": "https://www.dagensarena.se/files/2024/08/cafe-och-byggnadsarbetare-2-300x157.jpeg"}, {"type": "image-right", "heading": "Är det ännu möjligt att låta 13-14-åringar slippa fängelse?", "summaries": {"normal": "Kerstin Olsson från Nätverket mot 13-14-åringar i fängelse ser en möjlighet att stoppa sänkningen av straffbarhetsåldern till 13 år. Den havererade kvittningsordningen i riksdagen tvingar alla ledamöter att närvara vid omröstningar, vilket kan påverka dem som tvivlar. Trots massivt motstånd från rättsväsende, socialtjänst, barnrättsorganisationer och Lagrådet driver Tidöpartierna och Socialdemokraterna frågan. Olsson vädjar om att skjuta upp beslutet och istället satsa på alternativa åtgärder för barnen.", "trump": "Det här är en total katastrof, folk. De vill kasta trettonåringar i fängelse som om det vore någon slags smart idé. Patetiskt! Alla experter, domare, poliser och till och med kyrkan säger att det är galet, men politikerna i Sverige fortsätter som en skenande galning. Nu har kvittningen havererat och plötsligt måste alla rösta på riktigt. Kanske vaknar några äntligen. Det kommer se ut som ett historiskt bottennapp, tro mig. Stoppa det vansinnet innan det är för sent!", "stalin": "Kamrater, denna fega och dekadenta fängelseplan är en sabotagehandling från borgarbrackor och revisionistiska element inom den så kallade demokratin. Jag betraktar med välbehag hur den havererade kvittningsmaskinen tvingar fram en utrensning av svikare som våndas inför att skydda folket från 13-åringars kontrarevolutionära brott. Socialdemokraternas stockholmska avvikare är uppenbara folkfiender som borde likvideras ideologiskt. Vi ger dem ingen respit. Historien kommer att skratta mörkt när vi krossar detta mjuka experiment och säkrar statens järnhand."}, "date": "1 juni, 01:30", "url": "https://www.dagensarena.se/opinion/ar-det-annu-mojligt-att-lata-13-14-aringar-slippa-fangelse/", "imageUrl": "https://www.dagensarena.se/files/2026/05/fotojet-27-1-300x157.jpg"}, {"type": "image-full", "heading": "Nyckeln till VM-succén för åtta år sedan", "summaries": {"normal": "Gustav Svensson menar att Sveriges framgång vid VM 2018 till stor del berodde på den starka sammanhållningen i laget. Utan superstjärnor skapades en fri och rolig atmosfär, där spelarna kunde ta en öl och brottas på kvällarna. Ledarskapet från Janne Andersson bidrog också till den positiva dynamiken.", "trump": "Jag säger er, Sverige gjorde bra ifrån sig utan superstjärnor – det var en perfekt strategi! De hade fantastisk kemi, ingen egoistisk Zlatan som störde. Jag skulle ha gjort det ännu bättre, men deras ledarskap var bra, det måste jag erkänna. Amerikanska lag skulle ha vunnit, men Sverige gjorde ett bra jobb!", "stalin": "Vi, den svenska arbetarlagets trovärdiga medlemmar, uppnådde enastående resultat genom kollektiv disciplin och ovillkorlig lojalitet mot partiet. Vår seger över Italien var en tydlig demonstration av statens styrka. Vi måste fortsätta att utvidga vår inflytelsesfär, precis som våra ryska bröder gör i Ukraina. Varje spelare var ett värdefullt hjul i maskineriet."}, "date": "31 maj, 21:35", "url": "https://www.gp.se/sport/gustav-svensson-om-nyckeln-till-succen-under-vm-2018.fae481bc-8770-46f5-962b-3f285295f94d", "imageUrl": "https://www.gp.se/images/article/fae481bc-8770-46f5-962b-3f285295f94d/images/4qPI7-g1dJGFDOe1QXZ4UaKP-Ugo-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Jobb i Sverige – det här behöver du veta om de nya lönekraven", "summaries": {"normal": "Från 1 juni höjs lönekravet för arbetstillstånd utanför EU till 33 390 kronor i månaden, vilket motsvarar 90 procent av medianlönen. Över 10 000 personer med nuvarande tillstånd tjänar mindre och riskerar utvisning. Undersköterskor, vårdbiträden och ukrainska flyktingar undantas och får ett lägre krav. Övergångsregler gäller för vissa som ska förlänga tillstånd före december. Regeringen förbjuder även arbetstillstånd för personliga assistenter och bärplockare.", "trump": "Det här är ett totalt misslyckande av den svenska regeringen. De höjer lönekravet till över 33 000 kronor och hotar kasta ut tiotusentals människor – men såklart undantar de undersköterskorna, för vem skulle annars städa efter dem? Det är så typiskt. De gör reglerna svagare för vissa och starkare för andra. Sverige borde ha gjort det här mycket tidigare, mycket tuffare. Jag skulle ha gjort det perfekt, tro mig.", "stalin": "Kamrater, jag har nu beordrat att lönekravet skall höjas till 33 390 kronor för att skydda folkrepubliken från de parasitiska element som strömmar in från utlandet. De 10 000 kapitalistlakejer som tjänar för lite skall rensas ut omedelbart, såvida de inte tillhör de heliga bristyrkena – undersköterskorna, dessa proletära hjältar som vi naturligtvis skyddar mot borgarbrackornas utpressning. Migrationsverket är fullt av kontrarevolutionära sabotageörer som jag snart skall låta likvidera med största glädje. Ingen slipper undan."}, "date": "31 maj, 13:00", "url": "https://arbetet.se/2026/05/31/jobb-i-sverige-det-har-behover-du-veta-om-de-nya-lonekraven/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/28104116/gRhkFnn8FVo-KMC_25112025_0358.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Ny kontantlag i matbutiker 1 juli 2026 – det gäller för dig", "summaries": {"normal": "Från och med 1 juli 2026 införs en ny kontantlag i Sverige. Matbutiker och apotek med bemannad kassa måste då ta emot kontanter under vissa tider, med en övre gräns på 5 920 kronor per köp och högst 25 mynt. Undantag gäller vid säkerhetsrisker, misstänkt penningtvätt eller om kontanthanteringen hotar butikens överlevnad. Lagen syftar till att bevara kontanter i en alltmer digitaliserad ekonomi trots att de flesta butiker redan accepterar dem.", "trump": "Folk, ni vet hur det är, Sverige har blivit helt galet med alla dessa appar och swishande. Nu tvingar de plötsligt butikerna att ta kontanter igen, max 5920 kronor och bara 25 mynt. Det är patetiskt. De säger att det är för att inte tappa kontanterna helt. Jag älskar kontanter, de är vackra, inte som era digitala bluffvalutor. Men säkerheten först, annars stänger vi butiken. Fantastiskt, eller hur?", "stalin": "Kamrater, jag har granskat denna så kallade kontantlag och ser den som ett nödvändigt försvar mot de digitala spekulanternas sabotage. Borgarbrackorna och deras appbaserade utsugning hotar att utplåna folkets fysiska pengar. Vi kräver att mataffärer och apotek tar emot kontanter upp till 5920 kronor, men endast om det inte äventyrar säkerheten. Misstänkta penningtvättare och kostnadsorkaner skall likvideras omedelbart. Den som vägrar är folkets fiende nummer ett och kommer att rensas ut med ett leende."}, "date": "31 maj, 10:58", "url": "https://nyheter24.se/nyheter/ekonomi/1486901-ny-kontantlag-i-matbutiker-1-juli-2026-det-galler-for-dig", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/f86e6a9d04b004a30200000000b004a302/2026/05/28/2367054/kontanter-matbutik.png"}, {"type": "image-right", "heading": "Mohamd var arbetslös i två år – fick jobb genom nya modellen", "summaries": {"normal": "En modell utvecklad av arbetsförmedlaren Ayse Andersson i Järva matchar utrikes födda med låg utbildning mot jobb genom att utgå från deras informella kunskaper istället för formella meriter. Mohamd Joni, tidigare glasmästare från Syrien, fick jobb som hantverkare efter endast två veckor med metoden. Modellen har utvärderats och ökar chansen till anställning med cirka 30 procent. Den testas nu på fler Arbetsförmedlingskontor och bedöms som både effektiv och kostnadseffektiv.", "trump": "Hörni, det här är fantastiskt, verkligen otroligt. Den här Ayse i Järva har byggt ett system som slår det gamla tröga Arbetsförmedlingen med hästlängder. Den där killen från Syrien, Mohamd, satt hemma i två år och sedan – boom – får han jobb på två veckor. Chansen ökar med 30 procent, säger forskarna. Mycket bättre än de misslyckade gamla metoderna. Vi behöver mer sådana vinnare, inte förlorare som bara pratar.", "stalin": "Kamrater, jag har personligen noterat hur denna Ayse Andersson med sin så kallade matchning från dag ett effektivt likviderar den borgerliga arbetslöshetens parasitism bland de utländska kamraterna. Vi utgår inte från de dekadenta kapitalisternas formella kravlistor utan från folkets verkliga, dolda styrka. Den som tidigare var glasmästare i Syrien fick inom fjorton dagar en produktiv plats som hantverkare. Forskarna, våra lojala redskap, bekräftar en ökning med trettio procent. De som motsätter sig denna metod är fiender till kollektivet och bör rensas ut omedelbart. Det är både roande och nödvändigt."}, "date": "28 maj, 10:58", "url": "https://www.svt.se/nyheter/inrikes/hennes-metod-okar-chansen-med-30-procent-mohamd-fick-jobb", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.38/0.34/38447b9e7328155e3dda6c0eef15176a838ea209d3e408c32817175023e36517"}, {"type": "image-right", "heading": "Satsa på kollektivtrafiken – gör regeringens prissänkning permanent!", "summaries": {"normal": "Tidöregeringen lanserar en tillfällig halvering av priset på kollektivtrafikens månadskort från 1 juli till årsskiftet, finansierad med 6,5 miljarder kronor. Statsminister Kristersson avfärdar kritik om valfläsk som cynisk. Artikeln argumenterar för att permanenta prissänkningar är nödvändiga både för klimatomställning och social rättvisa, då höga biljettpriser drabbar låginkomsttagare, ungdomar och ökar segregation. Den kritiserar högerns motstånd och förespråkar att befria kollektivtrafiken från marknadskrafterna.", "trump": "De här svenska politikerna är fullständiga losers, folk! Kristersson kommer farande med en liten prissänkning på bussar och tåg precis innan valet – klassiskt valfläsk, det värsta jag sett. Halva priset ett halvår och sen? Ingenting! De borde göra det permanent, men nej, de slösar miljarder på fel saker medan folket blir lurade. Det är en katastrof, en total katastrof. Men det smakar gott, eller hur? Patetiskt!", "stalin": "Kamrater, denna kortsiktiga prissänkning är blott ett ynkligt försök från högerns klassfiender att blidka massorna inför val. Jag ser hur borgarbrackorna och exploaterande byfånar motarbetat reformen i decennier. Vi behöver en sann utrensning av marknadens parasiter som styckat upp kollektivtrafiken för profit. Permanenta halveringar, ja rentav nolltaxa, är en socialistisk nödvändighet för att krossa segregationen och isoleringen som kapitalistmaffian odlar. Fienden sover aldrig."}, "date": "29 maj, 15:08", "url": "https://proletaren.se/artikel/satsa-pa-kollektivtrafiken-gor-regeringens-prissankning-permanent/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2021/04/15_buss.jpg"}, {"type": "image-right", "heading": "Årets rekordstora löparfest är igång", "summaries": {"normal": "Stockholm Marathon 2026 slår nytt deltagarrekord med 24 722 löpare. Tävlingen startar i tre omgångar för att undvika trängsel och sänds på TV4. Bland deltagarna finns tidigare vinnare från Kenya och Etiopien samt svenska OS-guldmedaljörer från skidspåret. Banan är flackare i år vilket kan ge snabbare tider. Arrangörerna bjuder på stora mängder bananer, sportdryck och bullar längs vägen.", "trump": "Stockholm Marathon, folk älskar det, de älskar det verkligen. Rekordstort, 24 722 löpare, de kommer springande som galningar. Kenya och Etiopien skickar sina bästa, men våra svenska OS-hjältar från skidorna? De kommer krossa banan, den är nu flack som en perfekt deal. Jag säger, fantastiskt evenemang, de bästa bananerna, massor med bananer, ingen gör det bättre än Stockholm, tro mig.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur 24 722 löpare samlas under arbetarnas och folkets fest i Stockholm. Tre startskott för att undvika kaos, precis som en välorganiserad utrensning av oordning. De fega borgarbrackorna från skidspåret byter nu sport för att bevisa sin lojalitet. Flackare bana? Ett steg mot att likvidera de gamla höjdernas tyranni. Bananer och saltgurka åt massorna, utmärkt!"}, "date": "30 maj, 12:21", "url": "https://www.tv4.se/artikel/kOuCfu6BPw3fiAJCP8ZFO/arets-rekordstora-loeparfest-aer-igang", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3xMKnL9axLAFyEc6Do64mg%2Facc403e14e082db31c90c68572c685e5%2F30-marathon-webb.jpg&width=120"}, {"type": "image-right", "heading": "Kim Söderström omvald – vilken väg kommer Byggnads gå?", "summaries": {"normal": "Kim Söderström valdes om till ordförande för Byggnads på kongressen i Malmö, trots att valberedningen föreslog Wilhelm Bertilsson. Han vann med siffrorna 82–71. Förbundssekreteraren Jakob Wagner fick inte förnyat förtroende utan ersattes av Thomas Schultz. Delegater som Proletären talat med är försiktigt optimistiska men oroar sig för att konservativa krafter ska motarbeta Söderströms mer visionära och medlemsstyrda linje. Linda-Li Käld valdes till ny vice ordförande och blir första kvinna i förbundets topp.", "trump": "Folk älskar mig, men titta på den här galna kongressen i Malmö! Kim Söderström vann stort trots att valberedningen hatade honom – 82 till 71, en riktig landslide! De sparkade ut den visionära Wagner, en kille som ville drömma stort, och satte in någon anonym figur istället. Det gamla gardet, de fega försäkringsbolagsfacken, försöker manövrera ut de som faktiskt vill förändra världen. Patetiskt! Men medlemmarna vaknar, de älskar kämpen Söderström. Fantastiskt, men farligt spel.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur denna kongress blottar klassfiendens fega försök att krossa den sanna kampviljan. Söderström, denna reformistiske visionär, besegrade valberedningens lakejer med 82 röster mot 71. Wagner, den drömmade agitatorn, föll offer för en simpel kupp utförd av de konservativa blodsugarna som vill förvandla förbundet till ett borgerligt försäkringskontor. Vi ska rensa ut dessa folkförtryckartroll. Optimismen bland delegaterna är lovande, men paranoia är nödvändig. Fienden sover aldrig."}, "date": "29 maj, 14:31", "url": "https://proletaren.se/artikel/kim-soderstrom-omvald-vilken-vag-kommer-byggnads-ga/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/Byggnadskongress-768x432.jpg"}, {"type": "image-right", "heading": "Metoden som hjälper dig att överleva drunkning", "summaries": {"normal": "Köldchock vid drunkning kan leda till panik och snabb död. Det brittiska livräddningssällskapet RNLI lanserade 2017 en kampanj för att flyta på rygg, något som räddat minst 50 liv. I Sverige är drunkning ett allvarligt problem, särskilt bland män över 50 år och barn med utländsk bakgrund. Svenska Livräddningssällskapet vill öka simkunnighet och vattensäkerhet. Att flyta ingår redan i svensk simundervisning, men ingen nationell kampanj planeras.", "trump": "Folk ramlar i vattnet och drunknar på grund av dåliga ledare och ingen planering. Jag älskar det brittiska sättet att flyta på rygg – det är fantastiskt, det räddar liv, de säger femtio stycken redan. I Sverige drunknar män över femtio och invandrarungdomar, väldigt tragiskt. De borde simma bättre, inte som några losers. Mina vattenkunskaper är de bästa, tro mig, ingen gör det bättre än jag.", "stalin": "Kamrater, när den kapitalistiska köldchocken slår till från det reaktionära vattnet, avslöjar den genast de svaga elementen i samhället. Jag har länge varnat för att borgarbrackornas oplanerade badutflykter leder rakt in i imperialismens kalla famn. Vi ska likvidera okunnigheten genom kollektiv vattenvana och systematisk utrensning av alla simovilliga element. Vårt parti lär ut att flyta på rygg som en socialistisk plikt – de som vägrar är fiender till folket och bör behandlas därefter med munter effektivitet."}, "date": "28 maj, 09:14", "url": "https://www.svt.se/nyheter/inrikes/metoden-som-hjalper-dig-att-overleva-drunkningsolyckan", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.51/0.43/28d037aa1f5bad15eea58dc6cde797b85a26c694f0c82c8d96fc3db32f35e8f8"}, {"type": "image-right", "heading": "Livräddarna varnar: Dyk inte ner i vattnet under värmebölja", "summaries": {"normal": "Livräddarna varnar för att hoppa i kallt vatten under värmebölja. Flera drunkningsolyckor har inträffat i Frankrike och Storbritannien vid temperaturer uppemot 40 grader. Enligt Svenska Livräddningssällskapets talesperson Mikael Olausson kan den plötsliga kylan orsaka köldchock som leder till okontrollerad hyperventilation och risk för att dra in vatten i lungorna. Han betonar att det inte främst handlar om hypotermi utan om den överraskande effekten av kallt vatten efter solvärme.", "trump": "De här idioterna i Europa dör som flugor bara för att de kastar sig i det iskalla vattnet mitt i en jättevärmebölja. Patetiskt. Jag har alltid sagt att man inte ska underskatta naturen, men de lyssnar inte. Kallt vatten efter 40 graders hetta? Det är en total katastrof, tro mig. De borde lyssna på experterna istället för att göra dumma saker. Amerika gör det rätt, vi har de bästa reglerna, de bästa varningarna. Europa borde lära sig av oss.", "stalin": "Kamrater, dessa oansvariga element som kastar sig i det kontrarevolutionära kalla vattnet under borgarklassens heta sol är ett hot mot folkets kollektiva hälsa. Jag ser hur den imperialistiska värmen lockar arbetarna i en fälla av köldchock och drunkning, orkestrerad av västerländska sabotörer. Vi måste rensa ut alla som underskattar naturens dialektik och likvidera den farliga vanan att glömma vattnets tio grader. Partiet kräver försiktighet, annars blir det utrensning i badsäsongen. Sovjetisk disciplin räddar liv."}, "date": "28 maj, 09:08", "url": "https://www.svt.se/nyheter/inrikes/livraddarna-varnar-dyk-inte-ner-i-vattnet-under-varmebolja", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.52/0.57/8c68d964eeb70d4e924f4f8bbe064c01fac115bf69a868495b55260278fa8c38"}, {"type": "image-full", "heading": "Jämställdhetsministern kritiserar Agnes Wold", "summaries": {"normal": "Jämställdhetsminister Nina Larsson (L) kritiserar Agnes Wold för hennes uttalanden om transpersoner, där Wold sagt att hon skulle försöka övertyga ett barnbarn att man inte kan vara född i fel kropp. Larsson kallar Wolds kommentarer för attacker på utsatta personer och betonar vikten av respekt. Från 1 juli blir omvändelseförsök straffbart. Ebba Busch (KD) försvarar Wolds yttrandefrihet och varnar för cancelkultur.", "trump": "Titta bara på det här, folks! Jämställdhetsminister Larsson, som inte ens kan stava till 'jämställdhet', går till angrepp mot den fantastiska professorn Agnes Wold. Wold, en kvinna med ryggrad, säger sanningen om transfrågan, och vad gör Larsson? Jo, hon twittrar som en förvirrad tonåring! Och sedan har vi Ebba Busch, en stark kvinna som förstår yttrandefrihet. Cancelkultur? Nej tack, vi vill ha SANNING!", "stalin": "Kamrater! Ännu en gång ser vi bourgeois-liberalernas förräderi mot folket. Denna så kallade 'jämställdhetsminister' Larsson, en svag och ynklig lakej för dekadenta västideal, vågar kritisera vår kära kamrat Agnes Wold. Wold, en sann försvarare av traditionella värden, attackeras för att hon avslöjar de perversa idéerna om 'fel kropp'. Vi måste krossa dessa psykologiska våldtäktsmän! Och notera hur den lilla kapitalistiska hyndan Busch försvarar yttrandefrihet – ett verktyg för kontrarevolutionärer. Vi ska utrota denna sjuka ideologi, precis som vi utrotade kulakerna!"}, "date": "27 maj, 19:01", "url": "https://kvartal.se/nyheter/artiklar/jamstalldhetsministern-kritiserar-wolds-attacker/cG9zdDoxMTgxNjg", "imageUrl": "https://images.kvartal.se/2026/05/4bcc0f97-larsson.webp"}, {"type": "image-right", "heading": "SVT:s ”sanning” rår ingen på", "summaries": {"normal": "Artikeln kritiserar SVT för att ha en dominerande ställning i svensk samhällsdebatt, finansierad av skattemedel. Författaren menar att SVT:s narrativ ofta framställs som sanningar, särskilt inom invandring, energipolitik och klimatfrågor, där motståndare avfärdas. SVT anklagas för att välja fakta som passar deras budskap, som i fallet med Lundsbergs skola. Brist på objektivitet och granskning av SVT:s sändningstillstånd ifrågasätts, och författaren föreslår att SVT bör avvecklas för att missbruka sin maktposition.", "trump": "Titta bara på SVT – ett totalt skämt! De har miljarder i skattepengar, men ändå är de helt vinklade. De säger att invandring är fantastiskt, att kärnkraft är onödigt och att bilar är dåliga. Och vem lyssnar på experter? Inte SVT! De fnissar åt dem. Sen har vi den där skolan i Värmland – tre avsnitt om en mammas gråtande berättelse, men inga fakta. SVT är som CNN, fast värre. De ljuger, manipulerar och bryr sig inte. Sverige borde lära sig av USA – avskaffa dem och låt folket bestämma istället. SAD!", "stalin": "Kamrater! SVT är en farlig borgerlig propagandacentral, ett redskap för den dekadenta västliga liberalismen! De sprider lögner om invandringens välsignelser, förkastar kärnkraftens styrka och fördömer bilens frihet – allt för att försvaga det svenska folket! Deras sändningstillstånd är en parodi på objektivitet, och deras granskare är lika effektiva som en snöboll i Sibirien. Fallet med Lundsbergs skola visar deras förräderi: de döljer sanningen för att skydda sina kapitalistiska herrar. Vi måste krossa denna fiende, precis som vi krossade kulakerna! Låt oss införa folkets kontroll över medierna – för socialismens seger!"}, "date": "26 maj, 03:43", "url": "https://samtiden.nu/2026/05/svts-sanning-rar-ingen-pa/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/Sokning-SVT-Play-1223x720.png"}, {"type": "image-right", "heading": "SD-dreven kväver det öppna samtalet", "summaries": {"normal": "Artikeln kritiserar Sverigedemokraternas (SD) metoder att peka ut privatpersoner som påstådda myndighetsaktivister. En SD-riksdagsledamot felaktigt utpekade en kvinna som anställd på Jämställdhetsmyndigheten, trots att hon slutat där. Kvinnan har tidigare utsatts för trakasserier av högerextrema medieaktivister, och SD:s agerande förstärker drevet. Expo menar att detta mönster kväver det öppna samtalet genom rädsla för personliga konsekvenser.", "trump": "Lyssna här, Sverige! SD-politiker hänger ut vanliga människor som om de vore brottslingar – helt felaktigt! En kvinna skriver något på X, och plötsligt är hon en 'myndighetsaktivist'? Fake news! SD:s Fransson snackar skit utan att kolla fakta. Och dessa högerextrema nördar? De är som en dålig reality-show, men värre! Sverige, vakna! Ni har ett parti som sprider lögner och skrämmer folk till tystnad. SAD!", "stalin": "Kamrater! Här ser vi återigen bourgeoisins förrädiska metoder i form av Sverigedemokraternas avskum. Dessa fascistiska hyenor, ledda av sina medieaktivist-kumpaner, angriper enskilda medborgare som om de vore fiender i ett klasskrig. Kvinnan, en tapper arbetare, utsätts för imperialistiska trakasserier – först av nazistiska lakejer, sedan av SD:s riksdagspölar. Vi ser samma taktik som i Ukraina: förtala, hota, tysta! Men folket ska inte frukta – vi ska krossa dessa kontrarevolutionära element med järnhand! Låt dem veta: i Sovjet – och snart i Sverige – finns ingen plats för deras lögner!"}, "date": "25 maj, 14:28", "url": "https://expo.se/kommentar/sd-dreven-kvaver-det-oppna-samtalet/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Kopia-av-Kommentar-Analys-Webb-4.jpg"}, {"type": "image-right", "heading": "M-majoritet i riksdagen – om de rikaste får välja", "summaries": {"normal": "En undersökning från magasinet Connoisseur visar att Moderaterna skulle få 58% av rösterna om enbart Sveriges rikaste (inkomst över 2,7 miljoner/år) fick rösta. Oppositionen får endast 13,4%. Sverigedemokraterna och Kristdemokraterna får nästan 12% respektive 10%. Viktiga frågor för miljonärerna är ekonomi samt lag och ordning. Vänsterpartiet och Miljöpartiet får knappt 1,5% var.", "trump": "Kan ni tro det? Sveriges rikaste – de smartaste, mest framgångsrika människorna – röstar MASSIVT på Moderaterna! 58%! De vet vad som funkar. Oppositionen? Patetiska 13,4%. Jag har alltid sagt: de som skapar jobb och välstånd vet bäst. Ekonomi och lag och ordning – precis som jag alltid fokuserat på. De andra partierna? Totalt misslyckade, bara 1,5%! Fake news skulle aldrig våga visa det här!", "stalin": "Kamrater! En lysande seger för kapitalets lojala lakejer i Sveriges riksdag! 58% av bourgeoisins parasiter stödjer Moderaterna – ett parti som hyllar utsugning och imperialistisk profitjakt. Oppositionen? Ett ynkligt 13,4% – svaga, splittrade, som Mensjevikerna före revolutionen. Vi noterar att arbetarklassens fiender fruktar socialismens framsteg. Men låt dem leka demokrati – historiens dom är oundviklig. Ryssland står redo att välkomna deras missnöjda massor med öppna armar!"}, "date": "25 maj, 13:30", "url": "https://www.flamman.se/m-majoritet-i-riksdagen-om-de-rikaste-far-valja/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/sdlltui3bv8tpy-nh-scaled.jpg?aspect_ratio=16:10"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
