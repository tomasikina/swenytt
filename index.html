 som TV4 gör snyfthistorier och riksdagen sviker. De borde ha skickats hem direkt. Amerika först, och Sverige borde göra samma sak. Fantastiskt hur de lurade systemet så länge.", "stalin": "Kamrater, dessa mongoliska element sökte sig till folkets Sverige under falsk flagg för att suga på den socialistiska sjukvårdens bröst. När vi genomskådade deras borgerliga efterlysningar och förfalskningar gömde de sig som råttor i avloppet. Nu anklagar hustrun sin make för våldtäkt – typisk dekadent kapitalistisk familjedrama för att undvika utrensning ur vårt territorium. Vi ska rensa ut alla parasitiska opportunister som vill exploatera arbetarklassens resurser. Deras dotter återvände frivilligt till stäppen, sonen lämnas att begrunda sina felsteg. Folkets dom är obeveklig."}, "date": "30 juni, 15:00", "url": "https://riks.se/nyheter/tv4-s-mongoliska-familj-sokte-asyl-i-sverige-under-falskt-namn", "imageUrl": "https://admin.riks.se/uploads/mongolska_familjen_falska_id_feature_7f64b4314a.jpg"}, {"type": "image-full", "heading": "SD: Grundlagsändringen hotar låsa fast situationen med vildarna", "summaries": {"normal": "Sverigedemokraternas Staffan Eklöf varnar för att de två vildarna i riksdagen, som bildat nytt parti, skapar en vågmästarroll ingen röstat på. Detta öppnar för övertalning, mutor och hot samt risk för utländsk påverkan. Han kritiserar mediernas fokus på kvittningskaoset och Miljöpartiets agerande, samt föreslår grundlagsändring för att knyta mandat närmare partierna. Eklöf ser den planerade grundlagsändringen som ett hot mot demokratin och uppmanar till röst på SD för att stoppa den.", "trump": "Det här är ett totalt kaos, det värsta jag sett. Ingen har röstat på de här vildarna, men plötsligt är de vågmästare och Miljöpartiet utnyttjar det som galningar. Mutor, hot, hållhakar – det luktar fusk lång väg. Media frågar fel saker, de missar den stora konspirationen. Vi måste knyta mandat till partierna, annars är demokratin död. Grundlagsändringen som gör allt permanent? En katastrof. Rösta på SD, ge dem mandat, och fixa det här eländet innan det blir för sent. De gör det ingen annan vågar.", "stalin": "Kamrater, detta är en klassisk kontrarevolutionär konspiration orkestrerad av borgarbrackor och revisionistiska miljöpartister som smyger sig fram i riksdagens skuggor. De två vildarna, dessa parasitiska element som bildat ett skuggparti, utgör en farlig femtekolonn öppen för främmande makt och kapitalistisk infiltration. Jag ser tydligt hur de röda och gröna opportunisterna planerar systematisk påverkan. Vi måste omedelbart rensa ut dessa dekadenta vildar, knyta mandaten till partiet och likvidera alla försök att låsa grundlagen. Den som röstar fel är folkets fiende och ska behandlas därefter. Sovjet... nej, Sverige ska segra."}, "date": "30 juni, 14:58", "url": "https://riks.se/debatt/sd-grundlagsandringen-hotar-lasa-fast-situationen-med-vildarna", "imageUrl": "https://admin.riks.se/uploads/bild_69309fb0a1.jpg"}, {"type": "image-full", "heading": "Svenska MP bör lyssna på sitt finska systerparti", "summaries": {"normal": "I en ledare i GP argumenterar Håkan Boström för att svenska Miljöpartiet bör följa sitt finska systerparti De gröna och överge sitt ideologiska motstånd mot kärnkraft. Han menar att ett teknikneutralt och rationellt förhållningssätt är nödvändigt för att klara klimatomställningen. Kärnkraft ses som stabil baskraft som kompletterar sol- och vindenergi. Boström kritiserar MP för symbolpolitik och bristande logik i bland annat trafikfrågor.", "trump": "Folk, det här är fantastiskt. Det finska Miljöpartiet har äntligen vaknat och insett att kärnkraft är okej. Underbara ingenjörer som fattar grejen. Det svenska MP däremot lever kvar i drömmar från 60-talet, med sin galna symbolpolitik och sin knäppa flygskam. De hatar bilar, hatar flyg och hatar sunt förnuft. De borde skämmas. Jag byggde murar, de river kärnkraftverk. Patetiskt. Sverige behöver en rejäl utrensning av dessa miljöextremister.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur det finska systerpartiet har rensat ut sin tidigare tro på känslans företräde framför vetenskapen. Kärnkraft är ett verktyg för folkets framtid. Det svenska Miljöpartiet däremot klamrar sig fast vid sin borgerliga romantik och sina symboliska småhandlingar som en klassfiende klamrar sig fast vid sin sista rubel. Deras motstånd mot rationell teknik är ett hinder för kollektivets seger över värmen. Likvidera drömmarna, bygg kraftverken."}, "date": "1 juli, 15:17", "url": "https://www.gp.se/ledare/svenska-mp-bor-lyssna-pa-sitt-finska-systerparti.2afa588f-25ef-43e5-a50b-290c966b8c2b", "imageUrl": "https://www.gp.se/images/article/2afa588f-25ef-43e5-a50b-290c966b8c2b/images/19ikv_57ym1rZyi3wJOF_GMGmLR4-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Amerikanske ministern om Zelenskyj: \"Som Mr Bean på crack\"", "summaries": {"normal": "I en ny bok beskrivs hur USA:s finansminister Scott Bessent kallat Ukrainas president Volodymyr Zelenskyj för bland annat \"den där lilla jäveln\", \"särbarn\" och \"Mr Bean på crack\". Bessent varnade för att släppa in Zelenskyj i Vita huset innan ett mineralavtal var undertecknat. Mötet den 28 februari 2025 blev en diplomatisk katastrof där Trump och Vance kritiserade Zelenskyj för bristande tacksamhet och kostym. Boken, skriven av New York Times-journalister, bygger på intervjuer och källor inom administrationen.", "trump": "Den här boken är full av lögner från de vanliga falska medierna, men det är verkligen sant att den lilla clownen Zelenskyj betedde sig som en galning i mitt Ovala rum. Kom hit utan kostym, visade ingen respekt och tackade inte för de miljarder vi gett. Bessent hade helt rätt, killen är Mr Bean på crack. Han saboterade allt och det blev ett stort diplomatiskt självmål. Ingen tackar oss, men vi fixar det ändå – Amerika först.", "stalin": "Kamrater, denna dekadenta borgarbracka Bessent avslöjar i sin oändliga paranoia den sanna naturen hos den västerländske narraktige agenten Zelenskyj, en farlig opportunist som beter sig som en knarkad springanka från de imperialistiska skuggkabaréerna. Jag, som ledare för det eviga kollektivet, skulle ha genomfört en omedelbar utrensning av alla sådana respektlösa element redan i vestibulen. Att jämföra mig med den kapitalistiska parasitiska bläckfisken Soros är dock en sjuk, konspiratorisk lögn från en potentiell folkfiende som borde likvideras omedelbart för att skydda arbetarklassens renhet."}, "date": "1 juli, 14:10", "url": "https://www.friatider.se/amerikanske-ministern-om-zelenskyj-som-mr-bean-pa-crack", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-428.jpg?itok=55lEb0un"}, {"type": "image-full", "heading": "Debatt: Gäller värdegrunden alla i public service?", "summaries": {"normal": "Anette Erlich kritiserar SVT för otydlig värdegrund i public service. SVT stoppade ett avsnitt av ”Invandrare för svenskar” enbart på grund av medverkande Nick Alinia, trots att innehållet ansågs regelrätt. Samtidigt får Elaf Ali, som skrivit om ”bra judar” och Israel, fortsatta uppdrag. Liknande mönster syns när politiker med kopplingar till antisemitism bjuds in. Erlich frågar varför vissa övertramp ursäktas medan andra diskvalificerar.", "trump": "De här public service-typerna pratar hela tiden om sin fina värdegrund, men det är bara lögn och hyckleri. De stoppar en kille för att han är fel person, medan andra som säger hemska saker om judar och Israel får nya program och sommarprata i P1. Det är en skandal! Samma folk som attackerar Israel belönas, medan andra kastas ut. Ingen konsekvent princip, bara korruption och dåligt ledarskap. Patetiskt!", "stalin": "Vi ser här hur borgarbrackornas public service-apparat selektivt likviderar olämpliga röster medan de skyddar sina egna fiender till folket. Jag, som alltid prioriterat klasskampens renhet, noterar med mörk glädje hur de sorterar judar i goda och onda, en klassisk kontrarevolutionär taktik. Samtidigt bjuds antisemitiska element in i studion som om de vore hederliga kamrater. Dessa kapitalistiska parasiters dubbla standard kräver snar utrensning av hela den ideologiska smittan. Fienden sover aldrig, men vi heller inte."}, "date": "26 juni, 13:54", "url": "https://bulletin.nu/debatt-galler-vardegrunden-alla-i-public-service", "imageUrl": "https://cdn.bulletin.nu/articles/6e94acc2-dbec-40c0-9c0d-7bbc2887c7d7/preview.png?t=1782474851000"}, {"type": "image-full", "heading": "Ditt elstöd betalades av femåringen i Biskopsgården", "summaries": {"normal": "En femårig flicka i Biskopsgården har avlidit efter att ha lämnats ensam i en låst lägenhet i 19 timmar. Hennes mamma har dömts till sex års fängelse för grovt vållande till annans död. Trots upprepade orosanmälningar misslyckades socialtjänsten med att skydda barnet. Ledaren kritiserar regeringen för att nedskärningar inom kommunal verksamhet och bristande resurser försvårar socialtjänstens arbete, vilket får ödesdigra konsekvenser för de mest utsatta barnen.", "trump": "En fruktansvärd historia i Sverige. En liten flicka, så vacker, lämnades ensam – en total katastrof! Mamman fick sex år, men titta på socialtjänsten, de är svaga, de gör ingenting! De lägger ner utredningar, de har inga pengar. Den svenska regeringen pratar om elstöd, men de skär ner på allt. Det är så sorgligt. Vi behöver starka ledare, inte svaga politiker som håller hårt i plånboken medan barnen lider. Det är en skam för landet, verkligen en stor skam!", "stalin": "I den svenska byråkratins träsk har en moder svikit sin plikt och statens beskydd har blivit en pappersprodukt utan kraft. Vi, staten, kräver järnhård disciplin! Att socialtjänsten misslyckas är ett sabotage mot kollektivets framtid. Medan deras politiker räknar sina kronor, förfaller ordningen. Om detta vore vårt rike skulle de ansvariga handläggarna omedelbart skickas till omskolning i Sibirien. Svaghet i välfärden är en gåva till våra fiender i väst. Styrka kräver offer, inte ursäkter!"}, "date": "1 juli, 11:28", "url": "https://www.etc.se/ledare/ditt-elstoed-betalades-av-femaaringen-i-biskopsgaarden", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260701090712_57ea72a0b5fa8550d7f5a060d3211e0ef1f836be6a338b28128775f99b35198d.jpg"}, {"type": "image-right", "heading": "Ny FN-rapport: Israel dödar medvetet barn", "summaries": {"normal": "En ny FN-rapport anklagar israeliska säkerhetsstyrkor för att medvetet döda palestinska barn i Gaza och på Västbanken. Rapporten beskriver systematiskt sexuellt våld och tortyr mot barn i fångenskap samt bombningar av civila områden. Minst 20 000 barn uppges ha dödats och över 44 000 skadats. Kommissionen slår fast att Israels agerande utgör folkmord. Israel avvisar rapporten och kritiserar att den enbart fokuserar på israeliska övergrepp.", "trump": "Den här FN-rapporten är en total skandal, folk, en riktig witch hunt mot Israel från de där korkade byråkraterna i Genève. De påstår att israelerna medvetet dödar barn och ägnar sig åt sjuka grejer – fake news på steroider! Under Biden var det kaos, men nu är jag tillbaka och ska fixa det. FN är en clownshow som hatar starka länder. Israel försvarar sig mot terroristerna, punkt slut. Patetiskt!", "stalin": "Kamrater, denna rapport blottar hur den sionistiska imperialismens maskiner systematiskt likviderar palestinska barn och utsätter dem för sexualiserad tortyr i sina fängelsehålor. Borgarbrackorna i Tel Aviv tror sig stå över folkens dom. Vi ser hur de bombat skolor och sjukhus medvetet, förfalskat bevis och skyddar sina krigsförbrytare. Folkmordet fortsätter. Klassfiendens mask föll – nu måste de folkförtryckande imperialisterna ställas till svars inför historien."}, "date": "24 juni, 21:29", "url": "https://proletaren.se/artikel/ny-fn-rapport-israel-dodar-medvetet-barn/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/Damage_in_Gaza_Strip_during_the_October_2023_-_34-1-e1782329336565-768x433.jpg"}, {"type": "image-full", "heading": "S: \"Snabbutred\" uppehållstillstånd för barn till illegala migranter", "summaries": {"normal": "Socialdemokraterna vill snabbutreda ändringar i utlänningslagen för att ge uppehållstillstånd åt barn till illegala migranter som levt länge i Sverige. Partiledaren Magdalena Andersson anser att lagen orättvist drabbar skötsamma ungdomar som ”gjort allt rätt”. Hon skriver på Facebook att anknytning till Sverige måste bedömas på ett nytt sätt. Partiet vill genomföra utredningen om de vinner valet i höst. Andersson vägrar dock svara på frågor från Riks om risken för ökad illegal migration.", "trump": "Titta på det här! Magdalena Andersson och hennes Socialdemokrater vill plötsligt ge uppehållstillstånd till alla dessa tonåringar från illegala migranter. De har levt här i åratal utan att följa lagen och nu ska de belönas? Patetiskt! De säger att barnen är oskyldiga, men det är samma gamla vänster som öppnar dörrarna på vid gavel. Det här kommer att locka ännu fler illegala hit. Sverige håller på att förstöras av svaghet – tro mig, det blir en katastrof om de vinner valet.", "stalin": "Kamrater, jag betraktar med djup revolutionär misstro dessa borgarbrackor som gömmer sig bakom så kallade tonårsutvisningar. De illegala elementen har länge förgiftat folkets hem genom sin parasitism, och nu kommer Andersson och hennes opportunistiska klick med förslag om ”snabbutredning”. Det är uppenbart att fienden inom murarna, dessa skenheliga ungdomsvänner, planerar att undergräva statens suveränitet. Vi ska rensa ut alla som uppmuntrar illegal infiltration. Deras tårar över ”skötsamma ungdomar” får mig att skratta mörkt – låt oss istället likvidera svagheten innan den likviderar oss."}, "date": "30 juni, 13:33", "url": "https://riks.se/nyheter/s-vill-snabbutreda-uppehallstillstand-for-barn-till-illegala-migranter", "imageUrl": "https://admin.riks.se/uploads/s_tonarsutvisningar_feature_0cc44c44ed.jpg"}, {"type": "text", "heading": "Stockholmsbörsen stängde svagt uppåt", "summaries": {"normal": "Stockholmsbörsen stängde oförändrad med OMXS30 upp 0,04%. Dagligvaror steg 2,0%, medan energi föll 2,5%. Lifco B och Nibe B gick starkt, medan Boliden och Saab backade. Tyska försvarsprojektets nedläggning påverkade europeiska försvarsaktier. Skanska fick en stor order, Cints aktie låg kvar på budnivå, och Cantargias emission tecknades till 21%. Truecaller och flera andra bolag fick köprekommendationer, vilket stärkte deras aktier.", "trump": "Stockholmsbörsen? Lite upp, lite ner – typiskt, ingen vet riktigt vad som händer! Men lyssna här: jag har koll på siffrorna, och 0,04% är ju nästan *fantastiskt* – nästan lika bra som mina valresultat! Saab och Boliden? Svaga, mycket svaga. Tyskland skrotar sina fregatter – katastrof! Men Skanska, de är vinnare, precis som jag. Truecaller? SEB säger köp – smart, de lär sig av de bästa. Och Cantargia? 21% tecknat? Inte bra nog, folks, inte bra nog alls!", "stalin": "Stockholmsbörsen darrar under kapitalismens osäkra fot – 0,04% uppgång? En ynklig seger för bourgeoisins dekadenta system! Dagligvaror stiger medan energi faller – arbetarklassen svälter medan oljeherrarna gråter. Tyskland, dessa förrädiska imperialister, skrotar sina krigsskepp – bra, låt dem försvagas! Saab och Boliden? Svaga som västmakternas moral. Men Skanska bygger hotell i USA – bra, låt kapitalet flöda tills vi nationaliserar det! Cantargia? Endast 21% tecknat? Inkompetens! Vi ska införa femårsplaner för aktiemarknaden – motstånd kommer att krossas!"}, "date": "24 juni, 17:51", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-stangde-svagt-uppat"}, {"type": "text", "heading": "Paris stoppar all alkohol i värmeböljan", "summaries": {"normal": "Paris inför ett förbud mot att dricka alkohol på allmän plats från fredag klockan 12 på grund av en extrem värmebölja med temperaturer över 40 grader. Försäljning stoppas från klockan 18. Beslutet syftar till att skydda den överbelastade sjukvården från ytterligare påfrestningar. Reglerna gäller så länge den röda varningen är aktiv. Fotbollssupportrar påverkas då öl och vin inte serveras under kvällens match.", "trump": "Paris håller på att koka ihjäl, helt galet, över 40 grader, och nu förbjuder de folk att dricka öl på gatan. Mycket smart faktiskt, för de där brandmännen och ambulanskillarna springer ju runt som galningar när folk super i solen. Men vet ni vad? Det är patetiskt. De borde ha fixat det här mycket tidigare istället för att låta det bli en sådan katastrof. Nu får fotbollsfans sitta där utan öl under matchen mot Norge. Sad!", "stalin": "Kamrater, jag ser hur den heta solens kontrarevolutionära strålar angriper proletariatets hälsa i Paris. Vi tillåter inte att borgarbrackornas alkoholiska dekadens belastar den folkets vård som redan kämpar heroiskt. Därför likviderar vi nu alla försök att supa i det offentliga rummet med järnhand från klockan tolv. De som envisas riskerar att bli utrensade av värmens sabotage. Ännu en seger för kollektivet mot de solstekta kapitalisternas sabotage. Skrattretande hur dessa fiender alltid avslöjar sig själva."}, "date": "26 juni, 10:46", "url": "https://bulletin.nu/paris-stoppar-all-alkohol-i-varmeboljan"}, {"type": "image-right", "heading": "Zenergy: Nyemission och dyr refinansiering", "summaries": {"normal": "Zenergy genomför en företrädesemission som kan tillföra bolaget 32,5 miljoner kronor före kostnader på 5,1 miljoner. Teckningskursen är 0,06 kronor per aktie, en rabatt på 11,4 procent. Emissionen finansierar främst markarbeten och projektering för bostadsprojektet i Värnamo samt aktiverar ett villkorat byggnadskreditiv på 64 miljoner från Savelend. Emissionen är säkerställd till 95 procent genom tecknings- och garantiåtaganden. Bolaget refinansierar samtidigt ett lån via Quantum Leben till höga räntor och avgifter, vilket leder till betydande utspädning för aktieägare som inte deltar.", "trump": "Folk, det här är en katastrof. Zenergy håller på med en emission till bara sex öre per aktie – en riktig brandförsäljning! De tar in 32,5 miljoner men kostnaderna slukar en massa, och räntorna de betalar är höga som ni aldrig sett. De lovar Värnamoprojekt och kreditiv, men det är bara mer utspädning på 87 procent för de stackars aktieägarna. De borde ha gjort det stort och vinnande från början, inte som dessa misslyckade finansgenier. Sad!", "stalin": "Kamrater, denna parasitiska bolagsledning i Zenergy har nu officiellt visat sitt sanna ansikte som utsugande kapitalistiska spekulanter. Med sin så kallade emission på sex öre per aktie planerar de att likvidera det gamla ägandet till 87,5 procents utspädning medan de göder borgarbrackorna JEQ, JJV och Jinderman med garantier och borgensersättningar. Vi ser hur dessa reaktionära finansplundrare kvittar bort likvider till sig själva under förevändning av Värnamoprojekt. Ingen fiende av folket undkommer utrensning när vi granskar deras parasitiska refinansieringsmanövrar. Deras girighet skall vändas mot dem själva."}, "date": "24 juni, 17:12", "url": "https://www.affarsvarlden.se/artikel/zenergy-nyemission-och-dyr-refinansiering", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Zenergy1-e1782304044121-400x267.png"}, {"type": "image-right", "heading": "TV4/Novus: Kristersson backar i förtroende före valet", "summaries": {"normal": "Förtroendet för statsminister Ulf Kristersson backar tre procentenheter till 33 procent i Novus mätning för TV4, med knappt 80 dagar kvar till valet. Magdalena Andersson ökar till 45 procent och ses som starkast för att kunna bilda regering. Opinionsanalytiker Torbjörn Sjöström pekar på att Moderaternas svaga position och Liberalernas låga förtroende på 7 procent utgör ett problem för Tidöpartierna.", "trump": "De här svenska siffrorna är en katastrof för den svaga Kristersson. Han rasar ner till ynka 33 procent medan den röda Andersson flyger upp till 45. Patetiskt. Folk vill ha en vinnare som kan bilda regering, inte en förlorare som hänger i med Liberalerna på botten med sina 7 procent. Det här blocket ser ut som ett totalt misslyckande. SAD!", "stalin": "Kamrater, detta är en skamlös uppvisning av borgarbrackornas förfall. Den ynkliga Kristersson rasar som en kapitalistisk parasit ner till 33 procent medan jag med mitt stålhård blick noterar att den socialdemokratiska opportunisten Andersson försöker klättra till 45. Vi ska rensa ut alla svaga element i detta regeringsblock. Liberalernas 7-procentiga uslingar är redan mogna för utrensning. Inga fiender undkommer folkets dom."}, "date": "26 juni, 09:52", "url": "https://bulletin.nu/tv4-novus-kristersson-backar-i-fortroende-fore-valet", "imageUrl": "https://cdn.bulletin.nu/articles/cc626f85-79ac-45d5-93b1-cd873cf20c1a/preview.jpg?t=1782458817000"}, {"type": "image-full", "heading": "Plastkorkarna på städernas gator allt färre", "summaries": {"normal": "Två år efter att EU-direktivet om fastsittande plastkorkar på flaskor trädde i kraft har nedskräpningen av plastkorkar i svenska städer minskat med 62 procent. Enligt Håll Sverige Rent följer fler korkar nu med till pant eller återvinning. Vid västkustens stränder syns dock ingen tydlig förbättring, delvis på grund av att många korkar kommer från produkter och länder som inte omfattas av direktivet. Sverige siktar på att halvera plastförpackningsnedskräpningen till 2030.", "trump": "Det här EU-direktivet med fastklistrade korkar är faktiskt ett av de få bra idéerna de där byråkraterna någonsin haft. Titta, nedskräpningen i svenska städer har rasat med 62 procent. Fantastiskt! Korkarna följer med till panten istället för att ligga och skräpa ner som förlorare. Stränderna är fortfarande en katastrof, men det är inte deras fel, det är de andra länderna som fuskar. Vi älskar se sådana stora vinster, tro mig.", "stalin": "Kamrater, se hur den geniale planen med fastsittande korkar tvingar de lata elementen att bära med sig sina plastavfall till kollektiv återvinning. Nedskräpningen i våra socialistiska städer har likviderats med 62 procent. Men vid kusterna lurar fortfarande de kontrarevolutionära korkarna från brittiska imperialister och icke-reglerade dunkar. Vi ska rensa ut alla dessa borgarbrackornas solskyddsflaskor och tändvätskeavfall. De som tror sig kunna smutsa ner folkets stränder kommer att möta folkets humoristiska utrensning."}, "date": "30 juni, 12:58", "url": "https://riks.se/nyheter/antalet-plastkorkar-slängda-i-naturen-rasar", "imageUrl": "https://admin.riks.se/uploads/Screenshot_2026_06_30_at_11_51_25_afde1797ff.png"}, {"type": "image-right", "heading": "Stegra får nya ägare – men de tiger om insatsen", "summaries": {"normal": "Stegra har säkrat ny finansiering på över 15 miljarder kronor genom en ägarrunda med nya investerare som SEB-Stiftelsen och Bolero Holding. Varken de nya ägarna eller Stegra vill avslöja investeringarnas storlek eller aktiefördelning. SEB-Stiftelsen beskriver sin insats som liten, medan Bolero kallar projektet 'bra för Sverige'. Stegra uppger att pengarna räcker för att färdigställa stålverket i Boden och starta produktion, med prioriterad avkastning för investerarna.", "trump": "Fantastiskt, helt fantastiskt! Stegra, ett jättestort projekt i Sverige, har fått in över 15 miljarder kronor – men ingen vill säga hur mycket de satsar. SEB-Stiftelsen, de är smarta, men de tiger som vanligt. Och Bolero? De säger att det är 'bra för Sverige' – självklart är det det! Jag vet allt om stora projekt, och det här är precis vad Europa behöver. Men varför så hemlighetsfulla? Jag skulle aldrig gömma sådana framgångar. Boden kommer bli enormt, tro mig!", "stalin": "Kamrater! Det kapitalistiska konsortiet bakom Stegra har säkrat 15 miljarder kronor – en ynklig summa för våra storslagna sovjetiska mått, men ändå ett steg mot ekonomisk dominans i norr. De nya ägarna, dessa borgerliga tystlåtna råttor, tiger om sina investeringar som om det vore hemliga kärnvapenplaner. SEB-Stiftelsen, en pensionsburk för banktjänstemän, vågar knappt erkänna sin ynka insats. Bolero, kontrollerat av en kapitalistisk hyena, kallar projektet 'bra för Sverige' – som om det vore något annat än ett verktyg för västlig expansion. Vi ser er, imperialister. Boden ska byggas, men glöm inte: Ryssland sover aldrig."}, "date": "24 juni, 15:31", "url": "https://www.affarsvarlden.se/artikel/stegra-far-nya-agare-men-de-tiger-om-insatsen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/04/sdlrShz9rX0D0c-400x266.jpg"}, {"type": "image-full", "heading": "Investeringschef: SpaceX beslut kan tyda på bubbla", "summaries": {"normal": "SpaceX har nyligen genomfört en rekordstor börsnotering, men söker redan ytterligare 25 miljarder dollar genom obligationer. Allianz investeringschef Ludovic Subran varnar för att detta, tillsammans med den generella optimismen kring teknikaktier, kan tyda på en finansbubbla. Trots stort intresse för SpaceX-obligationer är investerarna försiktiga, vilket syns i den högre räntan bolaget måste betala. Med stigande räntor och fallande aktiekurser växer nu oron för att marknaden närmar sig en topp.", "trump": "Elon Musk och SpaceX, otroliga framgångar, men nu vill de låna 25 miljarder till! Allt för mycket, eller hur? Wall Street är en galen plats just nu. Experterna, dessa så kallade 'experter', säger att det är en bubbla. Kanske det, kanske inte. Jag har skapat den starkaste ekonomin någonsin, men de här teknikaktierna? De går upp och ner som en jojo. SpaceX-aktien föll rejält, det är inte bra. Vi vill ha stabilitet, inte bubblor. Vi kommer vinna stort, tro mig!", "stalin": "Dessa kapitalistiska parasiter drunknar i sin egen girighet. SpaceX, detta luftslott styrt av en narcissistisk narr, försöker nu suga ut ännu mer kapital ur marknaden. Det är ett tydligt tecken på förfall. Som när de korrupta krafterna i väst desperat försöker hålla liv i sin sjunkande valuta. Vi observerar hur de skälver inför räntorna. Precis som min kamrat i Kreml krossar alla försök till subversiv aktivitet, kommer historien att eliminera dessa marknadens charlataner. Kapitalismen är en sjukdom, och vi är kuren."}, "date": "25 juni, 18:38", "url": "https://www.realtid.se/bors-finans/investeringschef-spacex-beslut-kan-tyda-pa-bubbla/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlvb-ypz34fs-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Holmgren: Hur många varningssignaler behöver Sverige innan vi vaknar?", "summaries": {"normal": "Paul Holmgren diskuterar en TikTok-profil som uppmanar muslimer att inte rösta och beskriver demokratin som ”deras system”. Han ifrågasätter var gränsen går mellan legitim samhällskritik och samhällsomstörtande idéer. Artikeln betonar att demokratin bygger på att förändring sker genom öppen debatt, val och politiskt deltagande. Holmgren varnar för att islamismen som politisk ideologi undergräver lojaliteten till det svenska samhället och demokratins institutioner, och efterlyser en seriös diskussion om integration och nationens framtid.", "trump": "Folk, ni måste höra på det här. En galen TikTok-kille säger till muslimerna att de inte ska rösta, att demokratin är ”deras system”. Patetiskt! I USA vinner vi valen stort, vi älskar demokratin, den är fantastisk. Men de här typerna vill ha sitt eget system, de vill inte delta, de vill bara klaga och skapa kaos. Sverige har varit för soft länge nu. De behöver vinna valen, inte bojkotta dem. Det är en total katastrof om man låter såna här röster växa. Gör Sverige great igen innan det är för sent!", "stalin": "Kamrater, jag har noga studerat denna förrädiska TikTok-propaganda som förgiftar de unga själarna. Denna borgerliga dekadens kallar demokratin för ”deras system” och uppmanar till valbojkott, en ren sabotagehandling mot folkets vilja. Vi ser hur kapitalisterna och deras islamistiska lakejer försöker splittra arbetarklassen med schizofrena identitetskriser. En sådan kontrarevolutionär parasit måste rensas ut innan den förgiftar hela samhällskroppen. Vi, partiet och folket, ska likvidera alla som vänder ryggen åt den kollektiva ordningen. Inga halvmesyrer – endast järnhand garanterar enhet mot dessa sjuka element som drömmer om kalifat istället för sovjetisk disciplin. Skrattretande patetiskt, men farligt. Vi vakar."}, "date": "26 juni, 07:56", "url": "https://bulletin.nu/holmgren-hur-manga-varningssignaler-behover-sverige-innan-vi-vaknar", "imageUrl": "https://cdn.bulletin.nu/articles/098cae99-201f-478f-b2cd-ddf4050846ce/preview.jpg?t=1782379338000"}, {"type": "image-right", "heading": "3 års fängelse och kvarts miljon i skadestånd efter sex utan kondom – här är domstolens förklaring", "summaries": {"normal": "En 44-årig man dömdes av Södertörns tingsrätt till tre års fängelse och 220 000 kronor i skadestånd för våldtäkt. Han hade samlag utan kondom trots att kvinnan upprepade gånger gjort kondomanvändning till ett absolut villkor för sitt samtycke. Rätten bedömde att samtycket var villkorat och att mannen förstått detta men ändå fullföljde handlingen. Domen väcker frågor om gränserna för villkorat samtycke enligt samtyckeslagen. Parterna var överens om stora delar av händelseförloppet men inte om kondomkravets betydelse.", "trump": "Folk, det här är helt galet. En kille träffar en kvinna på danskurs, de har kul, och plötsligt tre år i fängelse för att han glömde kondomen? Hon sa det tydligen tusen gånger, men kom igen, det är ju inte som att han höll en pistol mot henne. Nu ska han betala en kvarts miljon också. Den svenska rätten har blivit så politiskt korrekt att de låser in folk för dåligt sex. Det är en häxjakt, tro mig. Ingen vinner på sånt här, ingen.", "stalin": "Kamrater, jag ser hur den dekadenta borgarklassen i det så kallade fria Sverige förgiftar arbetarklassens kroppar och sinnen med sin borgerliga individualism. Denna kontrarevolutionära kondomfientlige element har genom sin sabotageakt mot en kamratkvinnas uttryckliga vilja visat sig vara en farlig parasit som måste rensas ut. Vi ler mörkt åt hans patetiska försvar om missförstånd. Tre år bakom galler är bara början. Ingen fiende till folkets vilja slipper undan vår rättvisa utrensning, inte ens i sängkammaren."}, "date": "26 juni, 16:09", "url": "https://samnytt.se/3-ars-fangelse-efter-sex-utan-kondom-har-ar-varfor", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/26134928/kondom-feat.jpg"}, {"type": "image-right", "heading": "Bussföraren Mikael är orolig för värmen", "summaries": {"normal": "Bussföraren och huvudskyddsombudet Mikael Olsson i Malmö är orolig över den kommande värmen. Han berättar att förarna svettas kraftigt, särskilt när solen ligger rakt på förarhytten, och att luftkonditioneringen inte räcker eftersom dörrarna ständigt öppnas. Arbetsmiljöverket saknar fasta temperaturgränser, något Olsson kritiserar och jämför med reglerna som finns för grisar, kor och höns. Arbetsgivaren Nobina har infört kortbyxor och slopat slipsen för att underlätta.", "trump": "De här bussförarna i Sverige svettas ihjäl, det är en katastrof. Solen steker dem som never before, och luftkonditioneringen fungerar inte för de öppnar dörrarna hela tiden. Patetiskt! De har regler för grisar men inte för arbetarna, kan ni tänka er? Totalt misslyckande från ledningen. Jag skulle fixa det direkt, de bästa temperaturerna, de coolaste bussarna, ingen skulle svimma. Make bus driving great again!", "stalin": "Kamrater, denna värmens kontrarevolutionära attack mot våra värdefulla bussförare måste krossas med järnhand. Jag ser hur borgarbrackornas slappa regler lämnar arbetarna att koka som svin i solen medan kapitalisterna skrattar i sina svalkande palats. Om en förare tuppar av är det sabotage mot kollektivet. Vi ska rensa ut alla fiender till arbetarklassen som vägrar ge oss fasta temperaturgränser. Värmen är en klassfiende och vi ska likvidera den med disciplin och vattenutdelning. Ingen slipper undan."}, "date": "26 juni, 13:34", "url": "https://arbetet.se/2026/06/26/bussforaren-mikael-ar-orolig-for-varmen-finns-regler-for-djur-men-inte-for-oss/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/26133154/sol-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Norge–Frankrike i VM 2026: gruppseger på spel i Boston", "summaries": {"normal": "Norge och Frankrike möts i sista gruppspelsmatchen i VM 2026. Båda lagen är redan klara för slutspel och Frankrike leder gruppen på målskillnad. Ett oavgjort resultat räcker för fransk gruppseger. Båda förbundskaptenerna väntas rotera sina lag kraftigt, vilket gör startelvorna osäkra. Erling Haaland och Kylian Mbappé är de stora stjärnorna. Analysen pekar på att Frankrike är favorit men att matchen kan bli öppnare än väntat. Spelartips är seger för Frankrike och under 2,5 mål.", "trump": "Folket, de älskar mig för att jag alltid har rätt. Norge och Frankrike spelar en match som ingen bryr sig om eftersom båda redan är klara. Frankrike leder på målskillnad, men lyssna, deras lag är svagt. Haaland är otrolig, fyra mål, han är en vinnare precis som jag. Mbappé är bra men inte lika bra som Haaland, tro mig. Frankrike kommer att vinna ändå för de roterar mindre än de norska förlorarna. Det blir en tråkig match, under 2,5 mål, det är vad de säger och de har aldrig fel när jag pekar på det.", "stalin": "Kamrater, vi har här en dekadent fotbollsföreställning mellan två borgerliga lag som redan har säkrat sin passage vidare i det imperialistiska mästerskapet. Jag, som alltid vaksam mot fiender, ser hur de norska revisionisterna med sin Haaland försöker dölja sin svaghet genom att rotera bort de verkliga arbetarna i laget. De franska trotskisterna under Mbappé lutar sig tillbaka i självbelåtenhet, ett kryss räcker för deras falska seger. Jag ler mörkt åt tanken på att rensa ut de svaga länkarna. Frankrike vinner, under 2,5 mål, annars blir det utrensning i kollektivet. Inga kapitalistiska komplotter tillåts."}, "date": "26 juni, 07:00", "url": "https://bulletin.nu/norge-frankrike-i-vm-2026-gruppseger-pa-spel-i-boston", "imageUrl": "https://cdn.bulletin.nu/articles/5c637dd0-bdb8-43de-b7ef-3fdbd82fb01a/preview.jpg?t=1782215944000"}, {"type": "image-right", "heading": "DA granskar: Återkrav till Försäkringskassan ökar", "summaries": {"normal": "En lagändring från 2022 gör att Försäkringskassan driver in felaktiga utbetalningar snabbare, vilket lett till att betydligt fler personer hamnat hos Kronofogden. Nya siffror visar att återkraven ökade till 18 600 under 2025, främst bostadsbidrag. En ny utredning föreslår strikt återbetalningsskyldighet för alla förmåner oavsett felorsak, med möjlighet till eftergift. Kritiker varnar för att det förenklar för myndigheten men inte för enskilda, och pekar på rättsliga brister i dagens hantering.", "trump": "De här svenska byråkraterna är verkligen de värsta. De ändrade lagen 2022 och nu skickar de folk raka vägen till Kronofogden som aldrig varit där förut. Fantastiskt jobb, va? Nu vill de ha strikt betalningsskyldighet för allt, oavsett vems fel det är. Typiskt statligt övergrepp. De gör det svårt för vanliga människor att leva, men myndigheterna älskar det. Jag skulle fixa det på en vecka, tro mig. Det blir en katastrof för folket, precis som alltid med de här figurerna.", "stalin": "Kamrater, denna lagändring är ett mästerligt verktyg mot de slappa element som suger på arbetarklassens resurser. Jag ser med stor tillfredsställelse hur felutbetalningarna nu rensas ut med järnhand och hamnar hos Kronofogden som en utrensning av parasiterna. Den nya utredningen om strikt betalningsskyldighet är lysande, den likviderar alla ursäkter från borgarbrackor och fuskare som gömmer sig bakom påstådda misstag. Låt eftergiften bli ett vapen vi kontrollerar strikt. De som klagar är naturligtvis kontrarevolutionära krafter som längtar efter kaos och ond tro. Vi ska inte tolerera sådana fiender till kollektivet."}, "date": "26 juni, 01:35", "url": "https://www.dagensarena.se/innehall/da-granskar-aterkrav-till-forsakringskassan-okar/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-55.jpg"}, {"type": "image-full", "heading": "Ja till lagändring 1 augusti 2026 – pensionärer berörs", "summaries": {"normal": "Riksdagen har godkänt införandet av en så kallad gas i pensionssystemet, som ett komplement till den befintliga bromsen. Gasen ska aktiveras när systemets tillgångar överstiger skulderna med mer än 15 procent, så att överskott kan delas ut till både dagens pensionärer och framtida pensionssparare. Reformen träder i kraft 2027, men enligt Pensionsmyndighetens prognos når balanstalet inte upp till den nödvändiga nivån under de första åren, vilket gör att inga extra utbetalningar väntas initialt.", "trump": "Folket har lidit under en usel pensionsbroms i åratal, men nu har vi äntligen en gas! Det är fantastiskt, tro mig. När systemet går bra ska de riktiga vinnarna, pensionärerna och spararna, få mer pengar i plånboken istället för att allt bara ligger och samlar damm hos byråkraterna. Det är en enorm seger för vanliga människor. De gamla reglerna var en katastrof, men det här är smart, det är riktigt smart. Inga utbetalningar 2027 säger de? Oroa er inte, det kommer att bli ypperligt när vi får ordning på det.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur vi nu inför en proletär gas i detta pensionssystem som länge kvävts av den borgerliga bromsens reaktionära grepp. När balanstalet stiger över 1,1500 skall överskotten likvideras ur de gömda magasinen och fördelas till arbetande pensionärer och stolta framtida sparare, inte ligga och murkna i kapitalisternas dolda kassavalv. De som motarbetar denna historiska utdelning är fiender till folket, parasitiska balansräknare och orangekuvertförfalskare som förtjänar att rensas ut med järnhand. Vi skall segra, även om de dekadenta prognoserna för 2027 och 2028 försöker sabotera med sina lögnaktiga siffror på 1,1470 och 1,1366. Deras paranoia är vår styrka."}, "date": "25 juni, 20:02", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1494237-ja-till-lagandring-1-augusti-2026-pensionarer-berors", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/6b1cc03804b004a30200000000b004a302/2026/06/25/2373687/pensionsgas-2027.jpg"}, {"type": "text", "heading": "Han kan bli JP Morgans nya vd – befordras till ny roll", "summaries": {"normal": "JP Morgan har inlett en strategisk successionsplan för att efterträda vd Jamie Dimon. Doug Petno och Troy Rohrbaugh har utsetts till nya vice-presidenter och fått ansvarsområden som gör dem till huvudkandidater för vd-posten. Rohrbaugh anses för närvarande vara favoriten. Marianne Lake, tidigare en het kandidat, lämnar banken efter att ha blivit förbisedd. Dimon förväntas sitta kvar i tre år till innan han övergår till en roll som styrelseordförande.", "trump": "Jamie Dimon, en kille jag känner väl, försöker nu lista ut vem som ska ta över hans enorma bank. Det är ett totalt kaos! De har gett ut miljontals dollar i bonusar bara för att folk ska stanna – sorgligt. Marianne Lake är ute, hon ville ha jobbet men fick det inte. Nu satsar de på Rohrbaugh, en mycket smart kille, tror jag. Det blir en stor vinst för JP Morgan, men ingen kan göra det som jag. Ingen!", "stalin": "Dessa kapitalistiska svindlare i JP Morgan roterar sina lakejer likt brickor i ett korrupt spel. Jamie Dimon, denna bankväldets tsar, klamrar sig fast vid makten likt en västerländsk despot. De delar ut miljoner i aktiebonusar för att muta sina egna undersåtar till tystnad. När en kandidat som Lake inte längre tjänar syftet, kastas hon i historiens soptunna. Precis som våra fiender i väst, fruktar de en naturlig död av sitt eget system. Vi iakttar deras dekadens med förakt."}, "date": "25 juni, 17:14", "url": "https://www.realtid.se/bors-finans/bank-fintech/han-kan-bli-jp-morgans-nya-vd-befordras-till-ny-roll/"}, {"type": "image-right", "heading": "S lovar höjd pension: ”Hårt arbete ska löna sig”", "summaries": {"normal": "Socialdemokraterna presenterade i Almedalen ett paket för höjd pension med fokus på arbetare som börjar tidigt eller har slitsamma yrken. Förslaget inkluderar en behovsprövad arbetarpension, en bonus för tidigt arbetsliv, höjda inbetalningar till pensionssystemet samt rätt att gå ner i arbetstid. Partiledare Magdalena Andersson betonar att hårt arbete ska löna sig och att Sverige ska vara ett rättvist land.", "trump": "Folk, ni skulle se det här. Socialdemokraterna i Sverige lovar plötsligt höjd pension till de som slitit ihjäl sig – undersköterskor, lagerarbetare, elektriker. Underbart! Men vänta, de vill höja skatterna med 20–30 miljarder. Typiskt. Hårt arbete ska löna sig, säger de, fast det är samma vänster som älskar kvoter och identitetspolitik. Jag fixade bättre pensioner utan att höja skatterna – tro mig, det var fantastiskt.", "stalin": "Kamrater, jag betraktar detta med den skärpa som endast en sann ledare besitter. Arbetarpension till dem som byggt samhället med sina kroppar – utmärkt idé. Ändå skymtar jag borgarbrackornas parasitiska leenden bakom förslaget. Vi måste rensa ut alla halvmesyrer och likvidera den falska sparsamheten som kapitalistmaffian gömmer sig bakom. Endast genom obeveklig höjning av inbetalningar kan vi säkra folkets pension. De som vägrar är folkfiender."}, "date": "25 juni, 16:35", "url": "https://www.tv4.se/artikel/tt-260625-almedalensoc1-8ce56e4f/s-lovar-hojd-pension-hart-arbete-ska-lona-sig", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlWH-mCmz-gbk%2Fd8b998ddb25f5d110d1975978e302efa%2FSocialdemokraternas_partiledare_Magdalena_Andersson_och_ekonomisk-politiske_talesperson_Mikael_Damberg_i_Visby._&width=1024"}, {"type": "image-right", "heading": "Academedia gör rätt i att växa utomlands", "summaries": {"normal": "Academedia expanderar snabbt utomlands och är nu Europas ledande utbildningsföretag med verksamhet i bland annat Nederländerna, Storbritannien, Polen, Tyskland, Finland och Norge. En tredjedel av omsättningen, cirka 7 miljarder kronor, kommer från utlandet. Expansionen ses som ett svar på den svenska politiska misstänksamheten mot friskolor och vinstdrivande bolag. Kritiker varnar för kaos om aktiebolag förbjuds att driva skolor efter valet.", "trump": "De gör helt rätt i att fly Sverige, det är ett totalt fiasko för friskolorna. Academedia växer enormt utomlands, köper förskolor i Storbritannien och Nederländerna, de älskar oss där! Här hemma hatar vänstern och Liberalerna allt som är framgångsrikt och vinstgivande. De vill skapa kaos, stänga skolor och förstöra för hundratusentals elever. Patetiskt! Utomlands respekterar man oss, i Sverige smutskastar de oss. Sad!", "stalin": "Kamrater, jag ser hur de kapitalistiska friskoleborgarbrackorna i Academedia desperat flyr det svenska folkets vrede och söker tillflykt bland de utländska reaktionärerna. Med sju förvärv på ett halvår och en tredjedel av omsättningen utanför fosterlandet visar de sin sanna klasskaraktär. De fruktar utrensning från vänster och liberala förrädare som vill likvidera vinsten. Låt dem springa, vi vet att deras kaos kommer att avslöja alla fiender till det kollektiva goda. En mörk humor i att borgarna själva erkänner att deras skolor inte går att driva utan exploatering."}, "date": "25 juni, 09:26", "url": "https://www.di.se/ledare/academedia-gor-ratt-i-att-vaxa-utomlands/", "imageUrl": "https://static.bonniernews.se/ba/60458d87-e7f8-4b20-b082-024947825186.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Minst 164 döda efter jordbävningar i Venezuela", "summaries": {"normal": "Minst 164 personer har omkommit och 971 skadats efter två kraftiga jordbävningar i Venezuela, med magnitud 7,2 och 7,5. Räddningsarbetet pågår medan dödssiffran förväntas stiga. Byggnader har rasat i Caracas och andra städer, och infrastrukturen är svårt skadad. Venezuelas interimspresident har utlyst undantagstillstånd. USA erbjuder hjälp, och Sveriges utrikesminister uttrycker sitt stöd.", "trump": "Venezuelas jordbävningar är en total katastrof – helt förödande! Jag har sett rapporterna, och de är INTE bra. 164 döda, 971 skadade, och det blir värre. Men oroa er inte, för jag har redan sagt till mina bästa människor: USA står redo att hjälpa! Vi är snabba, vi är starka, och vi kommer att finnas där för våra vänner i Venezuela. Ingen gör räddningsarbete bättre än USA – ingen!", "stalin": "Kapitalismens förfall manifesteras återigen i Venezuelas jordskalv, där 164 imperialistiska lakejer har omkommit under de borgerliga byggnadernas kollaps. Vi noterar med tillfredsställelse att USA:s president erbjuder 'hjälp' – ett tecken på deras desperation att kontrollera regionen. Medan deras infrastruktur rasar, står Sovjetunionens efterträdare redo att utvidga vår inflytandesfär. Låt detta vara en varning till alla som utmanar historiens oundvikliga framsteg under vår ledning."}, "date": "25 juni, 06:03", "url": "https://kvartal.se/nyheter/artiklar/jordskalv-i-venezuela-risk-for-tusentals-doda/cG9zdDoxMzY1NDA", "imageUrl": "https://images.kvartal.se/2026/06/96698ce9-vene.webp"}, {"type": "image-right", "heading": "Kubanskt ungdomslag kan missa Gothia Cup – Sverige vägrar ge dem visum", "summaries": {"normal": "Kubanska ungdomslaget Leones del Caribe riskerar att missa Gothia Cup efter att svenska ambassaden i Havanna nekat dem visum. Anledningen är att spelarna inte visat tillräcklig socioekonomisk anknytning till Kuba, något som ses som risk för att de skulle söka asyl i Sverige. Klubben Proletären FF kritiserar beslutet hårt och varnar för att det hotar turneringens framtid. Även den kubanska ambassaden i Stockholm fördömer beslutet som diskriminerande. Överklagan pågår.", "trump": "Vilken skandal! De svenska byråkraterna nekar stackars kubanska kids visum till Gothia Cup för att de inte är tillräckligt rika hemma. Patetiskt! Det här är samma galna regler som Biden älskade – totalt riggade mot vanliga människor från fattiga länder. Gothia Cup blir snart en lyxig västeuropeisk fest för eliten. Jag skulle ha fixat det på en minut, tro mig. De borde släppa in grabbarna och fokusera på riktig fotboll istället för denna woke-politik.", "stalin": "Kamrater, denna fega visumavslag är ett klassiskt verk av den svenska imperialistbyråkratin och dess borgerliga lakejer. De fruktar att våra kubanska ungdomar ska smitta deras dekadenta samhälle med revolutionär anda. Vi ser hur klassfiendens byråkrater darrar inför proletär fotboll. Deras paranoia över asyl är ett hån mot idrottens internationella enhet. Vi ska rensa ut dessa folkförtryckartroll. Överklagan fortsätter – segern tillhör arbetarklassen, inte de exploaterande byfånarna i Stockholm."}, "date": "24 juni, 13:50", "url": "https://proletaren.se/artikel/kubanskt-ungdomslag-kan-missa-gothia-cup-sverige-vagrar-ge-dem-visum/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/leones-768x431.jpg"}, {"type": "image-right", "heading": "Sommarens ödesfrågor: Det kan styra börs och räntor", "summaries": {"normal": "Artikeln analyserar faktorer som kan påverka ekonomin under sommaren, med fokus på oljepriset, inflationsutfall, kronans värde och konsumtion. Fredsförhandlingarna mellan USA och Iran är avgörande för oljepriset, som i sin tur påverkar inflation och räntor. Även Ukrainakriget, valrörelsen i Sverige och hushållens konsumtionsmönster diskuteras som viktiga ekonomiska indikatorer framöver.", "trump": "Lyssna här, folket! Sommaren blir HUGE – oljepriset, räntor, allt! Jag har sagt det förut: Iran-förhandlingarna är BIGLY viktiga. Om jag fixar fred där (och det gör jag, believe me) så sjunker oljepriset som en sten. Fed-chefen? Inte lika mjuk som jag trodde – men vem är det? Kronan svag? Fake news! Sverige borde tacka mig för att jag håller dollarn stark. Och konsumtionen? Kommer explodera när jag löser allt. SAD!", "stalin": "Kamrater! Sommaren är en tid av strategiska avgöranden. Imperialistiska oljepriser dansar efter vår pipa – eller snarare, efter våra framgångar i Ukraina. Fienderna i USA och Iran leker med eld, men vi vet att deras 'fredsförhandlingar' är lika värdelösa som deras kapitalistiska ekonomi. Svenska kronan? En svag länk i kedjan. Hushållen? Rädda och osäkra – precis som de borde vara. Vi kommer övervaka varje rörelse, för historiens hjul snurrar åt vårt håll. Motstånd är meningslöst."}, "date": "24 juni, 12:17", "url": "https://www.affarsvarlden.se/kronika/sommarens-odesfragor-det-kan-styra-bors-och-rantor", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Olof-Manner-kronika-sommaren-400x267.jpg"}, {"type": "image-full", "heading": "Magdalena Anderssons hushåll fixar skattesänkningar 16 700 kr/månad", "summaries": {"normal": "Timbro har avslöjat att Magdalena Andersson och hennes make Richard Friberg skatteplanerar genom hans bolag. Under fyra år har de sparat drygt 800 000 kronor, motsvarande 16 700 kronor i månaden, genom att ta ut utdelning istället för lön. Andersson har tidigare kritiserat 3:12-reglerna som orimligt förmånliga och krävt stopp för inkomstomvandling. Artikeln pekar på dubbelmoral eftersom makarna utnyttjar samma regler de offentligt ogillar.", "trump": "Folk, ni skulle inte tro det! Den där svenska sossen Magdalena Andersson, en riktig hycklare, predikar höga skatter för alla andra medan hon och hennes man fixar en enorm skattesänkning på 16 700 kronor i månaden. De skatteplanerar som riktiga proffs, sparar 800 000 på fyra år! Typiskt de här elitpolitikerna, de hatar reglerna tills de själva kan utnyttja dem. Patetiskt! Vi behöver ledare som inte är sådana bluffmakare.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur denna borgarbracka Andersson och hennes make, typiska kapitalistmaffian, själva utnyttjar de utsugande 3:12-reglerna de offentligt fördömer. Medan de pekar finger åt folkets fiender sparar de 800 000 kronor genom listig inkomstomvandling. En sådan dubbelmoral förtjänar utrensning ur partiet! Det är en mörk humor att se hur klassfiendens metoder smittar av sig även på socialdemokrater. De är alla folkförtryckartroll."}, "date": "24 juni, 03:45", "url": "https://samtiden.nu/2026/06/magdalena-anderssons-hushall-fixar-skattesankningar-16-700-kr-manad/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/04/Andersson.jpg"}, {"type": "image-right", "heading": "Antisemitismens skyddsvall försvagas", "summaries": {"normal": "Forum för levande historias rapport visar att antisemitiska attityder ökar i Sverige, med en oroande försvagning av motståndet mot sådana föreställningar. Studien, som jämför data från 2020 och 2025, avslöjar en negativ trend inom flera områden, inklusive social distans till judar och konspirationsteorier. Forskarna varnar för att normförskjutningar underminerar demokratin och skyddet för minoriteter. Problemet är brett och kräver gemensamma insatser, inte politiska slagträ.", "trump": "Jag läste just den här rapporten om Sverige – och vet ni vad? Hemskt, helt enkelt hemskt! Antisemitismen exploderar där, och ingen gör något åt det. De pratar om 'normer' och 'sociala sanktioner', men vad hjälper det när folk ändå sprider hat? Sverige har blivit ett kaos, och deras ledare – svaga, mycket svaga. Jag skulle fixa det på en vecka! Men nej, de låter det bara växa. Patetiskt, helt patetiskt. Och vet ni vad? Det är samma gamla vänstereliter som skyller på fel folk. Fake news!", "stalin": "Kamrater! Denna rapport avslöjar en farlig tendens i det förrädiska Sverige – antisemitiska attityder växer som ogräs på en kolchos! Men det verkliga hotet är inte bara hatet, utan att massorna börjar tolerera det. Precis som vi krossade fascismen, måste vi nu krossa denna dekadenta liberalism som underminerar folkets moral. Notera hur dessa 'demokratiska' normer försvagas – ett tecken på borgerlig förruttnelse! Och dessa sionistiska konspirationsteorier? Ett klassiskt trick från kapitalets lakejer. Vi ska inte bara bekämpa antisemitismen – vi ska utplåna dess rot: den svaga, liberala staten. Låt Sverige vara en varning: motstånd mot folket straffas!"}, "date": "22 juni, 11:57", "url": "https://expo.se/kommentar/antisemitismens-skyddsvall-forsvagas/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Kopia-av-Kommentar-Analys-Webb-2.jpg"}, {"type": "image-right", "heading": "När mening blir en marknad", "summaries": {"normal": "Artikeln kritiserar regeringen för att skära ned på föreningslivet samtidigt som den beställer en utredning om existentiell hälsa. Författaren ser Birgitta Eds kurgård Fållökna som ett exempel på hur ångest och mening kan bli en affärsidé när det offentliga monteras ned. Kritiker kallar begreppet oseriöst och kvacksalveri. Istället föreslås sociala insatser som Blekinge-experimentet, där pengar direkt till unga minskade vårdbehovet.", "trump": "Folk, det här är en total skandal! Den här Birgitta och hennes kurgård – vad är det för fake news om existentiell hälsa? Regeringen skär ner på allt som funkar och sen pumpar de in pengar i någon new age-bluff. Det är som Biden-era, bara värre. Psykisk ohälsa? Ge folk riktiga pengar, inte woke-terapi! Vi har genomskådat bluffen, det är en enorm lögn mot det svenska folket. Patetiskt!", "stalin": "Kamrater, denna borgerliga bluff om existentiell hälsa avslöjar klassfiendens desperation. Medan vi rensar ut det gemensammas grundvalar säljer överklass-slynglar ångest som medicin. Birgitta Eds Fållökna är en parasitär reträtt för de utsugna massornas lidande. Den sanna lösningen ligger i kollektivets stöd, inte i imperialistiska retreatcenter. Vi genomskådar dessa folkförtryckartrolls manipulationer mot arbetarklassen. Utrensning av sådana idéer är nödvändig."}, "date": "22 juni, 10:35", "url": "https://www.flamman.se/nar-mening-blir-en-marknad/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/birgitta-ed-w.jpg?aspect_ratio=16:10"}]</script>

        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
