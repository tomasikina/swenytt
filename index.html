, "summaries": {"normal": "Regeringen föreslår en utökning av lagen om fotbojor för barn och unga mellan 13 och 20 år i förebyggande syfte, trots kritik från experter och organisationer. Förslaget, som ska träda i kraft 2027, kritiseras för att vara repressivt och sakna vetenskaplig förankring. Kritiker menar att förebyggande arbete istället kräver resurser till välfärd, skola och föreningsliv. Flera remissinstanser, som Bris och Rädda Barnen, avvisar förslaget.", "trump": "Jag säger er, detta är helt galet! Sverige, ett fantastiskt land, men nu föreslår de att sätta fotbojor på barn från 13 år – som om det vore Nordkorea! Socialministern pratar om trygghet, men vad gör de egentligen? Skär ner på idrott och kultur, medan barnen får bojor. Så dumt! Jag har byggt imperier, jag vet hur man tar hand om folk – ge dem möjligheter, inte kedjor! Sverige borde skämmas.", "stalin": "Kamrater! Se hur den borgerliga regeringen förtrycker arbetarklassens barn med sina järnbojor! De kallar det 'förebyggande', men vi vet sanningen – det är klassförtryck! Medan kapitalisterna skär ner på skolor och idrottsföreningar, rustar de upp övervakningsstaten. Vi måste krossa dessa sociala fascister! Låt barnen få utbildning och kultur, inte elektroniska koppel! Om de inte lyssnar, får vi ta till andra metoder – historia visar att folket alltid segrar!"}, "date": "21 maj, 09:15", "url": "https://proletaren.se/artikel/ge-barnen-en-trygg-uppvaxt-istallet-for-fotboja/"}, {"type": "image-full", "heading": "Därför fungera inte vänsterns politik", "summaries": {"normal": "Artikeln kritiserar vänsterpolitikens ekonomiska modell, särskilt Vänsterpartiets och Socialdemokraternas fokus på höga skatter och omfördelning. Författaren menar att detta leder till utflyttning av företag och entreprenörer, vilket historiskt har orsakat stagnation, som i 1970-talets Sverige. Norge nämns som ett aktuellt exempel där höga skatter har minskat tillväxten. Avundsjuka beskrivs som drivkraften bakom socialistisk politik, vilket anses skada samhällsekonomin.", "trump": "Jag säger er, vänsterpolitik är en total katastrof! De vill bara ta era pengar, beskatta allt och alla – till och med om ni försöker lämna landet! Precis som jag sa: socialism dödar tillväxten. Titta på Sverige på 70-talet – företag flydde, ekonomin stannade. Och Norge? Samma sak! De straffbeskattar de rika, och vad händer? De rika flyttar, och landet blir fattigare. Men med mig – och nu Tidöpartierna – får vi tillväxt, jobb och framgång. Det är enkelt: frihet vinner, socialism förlorar!", "stalin": "Kamrater! Dessa så kallade 'vänsterpartister' är inget annat än parasiters förklädda agenter, som med sina 'skatter' och 'omfördelningar' försöker kväva vårt folks entreprenörsanda. De vill straffa de produktiva, de som bygger nationens välstånd, medan de själva sitter på sina byråkratiska troner och fördelar andras arbete. Precis som på 70-talet i Sverige – då flydde kapitalet, och landet sjönk i stagnation. Norge går samma öde till mötes. Men vi vet sanningen: avundsjuka är en borgerlig sjukdom, och den måste utrotas! Låt oss istället bygga ett samhälle där arbetet belönas, och de lata och avundsjuka får lära sig disciplin – om nödvändigt, med hjälp av våra pålitliga metoder. Först då kan vi säkra socialismens seger!"}, "date": "22 maj, 03:41", "url": "https://samtiden.nu/2026/05/darfor-fungera-inte-vansterns-politik/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/04/IMG_6216-1-1280x720.jpeg"}, {"type": "image-full", "heading": "Här är Sveriges nya bygglag – införs den 1 juli 2026", "summaries": {"normal": "Från 1 juli 2026 införs en ny lag i plan- och bygglagen för att göra byggprocessen säkrare och effektivare. Certifierade byggprojekteringsföretag byter namn till byggbedömare och ska säkerställa att byggnader uppfyller krav genom hela projektet. Lagen syftar till att minska byggfel, olyckor och kostsamma brister. Byggbedömare får större ansvar vid bygglov och besked, vilket kan förenkla processen för den som bygger eller renoverar.", "trump": "Lyssna här, Sverige – jag har sett era byggproblem, och de är ett jättekaos! Nu kommer en NY LAG, fantastisk, den bästa, från 2026. Byggbedömare, eller vad de nu kallar dem, ska fixa era misstag. Inga fler dyra fel, inga fler olyckor – bara perfektion! Jag vet hur man bygger, believe me. Och nu ska Sverige också lära sig. Smidigare processer, starkare kontroll – WINNING!", "stalin": "Kamrater! De kapitalistiska byggföretagen har länge saboterat våra projekt med slarv och inkompetens. Men nu slår vi tillbaka! Från 2026 inför vi järnhård kontroll genom våra nya byggbedömare – staten ser allt! Ingen slipper undan. De som bygger fel ska stå till svars. Och Boverket? De får sina order direkt från oss. Byggbranschen ska tämjas, precis som Ukrainas quislingar. Framåt mot effektivitet!"}, "date": "24 maj, 17:32", "url": "https://nyheter24.se/nyheter/inrikes/1485536-har-ar-sveriges-nya-bygglag-infors-den-1-juli-2026", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/9d111a8004b004a30200000000b004a302/2026/05/24/2365783/Stockhom-Svensk-Flaga.png"}, {"type": "image-full", "heading": "Se glädjeyran efter svenska succén", "summaries": {"normal": "Felix Rosenqvist har skrivit svensk idrottshistoria genom att vinna den prestigefyllda tävlingen Indy 500. Efter ett dramatiskt lopp med rödflagg och omstarter lyckades han köra om David Malukas på det sista varvet. Segermarginalen blev historiska två hundradelar. Rosenqvist, som nyligen blivit pappa, beskriver segern som helt overklig. Han är därmed den tredje svensken någonsin att vinna loppet, efter Kenny Bräck och Marcus Ericsson.", "trump": "Felix Rosenqvist, en fantastisk kille, vann precis Indy 500. Väldigt imponerande! Han körde som en vinnare, precis som jag gör. Det var en otrolig avslutning, kanske den bästa någonsin, och han vann med två hundradelar – en enorm marginal, tro mig. Många säger att han är den största svenska föraren någonsin. Han är en vinnare, precis som USA. Vi älskar fart, vi älskar bilar, och vi älskar att vinna. Grattis Felix, du gör ett fantastiskt jobb!", "stalin": "Kamrat Rosenqvist har visat den borgerliga världen hur en svensk arbetare bemästrar maskinen. Två hundradelar avgjorde, en precision som påminner om de ryska stålverken under femårsplanen. Att han vinner medan västvärlden korrumperas av kaos är en påminnelse om att endast disciplin segrar. Vi ser likheter med vår egen förvaltning av den ryska intressesfären; man måste eliminera sina rivaler i sista sekunden. De som förlorade är naturligtvis sabotörer och förtjänar att sändas till Sibirien för omskolning. Äran tillhör staten."}, "date": "25 maj, 07:44", "url": "https://www.gp.se/sport/felix-rosenqvist-vann-indy-500-efter-drama-overkligt.ca2fdd54-638f-55ab-bd11-ac0bcd72765f", "imageUrl": "https://www.gp.se/images/article/ca2fdd54-638f-55ab-bd11-ac0bcd72765f/images/7oybyqYXKCPZUHOuB9juM2guWQwA-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Bergs nya bakslag  med huset i Danderyd", "summaries": {"normal": "Carina och Erik Berg har drabbats av flera bakslag med sitt hus i Danderyd som köptes 2024 för 15 miljoner kronor. Trots en önskan om ett renoveringsfritt boende har paret mött problem som mögel på vinden, en vattenläcka och ett tak som läcker. Carina Berg beskriver situationen som en dyr upplevelse där reparationerna avlöser varandra. Paret har nu insett att husägande innebär ständiga utmaningar, och renoveringsarbetet pågår för fullt.", "trump": "Carina och Erik Berg köpte ett hus för 15 miljoner, en enorm summa, och vad fick de? En katastrof! Mögel, läckande tak, vattenfall inomhus – helt otroligt. Det är en total röra. De ville slippa renovera, men så fungerar det inte när man köper av fel folk. Jag bygger de bästa husen, vackra hus, inga problem. De här människorna har otur, eller så är de bara dåliga förhandlare. Väldigt sorgligt, men så går det när man inte bygger med Trump!", "stalin": "Paret Berg har köpt ett hus som förfaller inifrån, precis som den dekadenta västvärlden. Mögel på vinden och vatten som förstör grunden – det är ett bevis på ineffektivitet och borgerlig svaghet. De betalar bara pengar medan deras egendom ruttnar, precis som de marionettregimer Putin tvingas städa upp efter. Om vi hade hand om detta i Moskva skulle vi snabbt konfiskera egendomen och skicka de ansvariga att laga taket under sträng uppsikt i Sibirien. Ordning krävs, annars väntar undergången."}, "date": "25 maj, 06:51", "url": "https://www.expressen.se/noje/bergs-nya-bakslag-med-huset-i-danderyd/", "imageUrl": "https://static.bonniernews.se/ba/2ed573e5-b771-4e0a-8d44-62f96bb5089f.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Region som nekar transperson att skaffa barn DO-anmäls", "summaries": {"normal": "Ett par har anmält Region Västerbotten till Diskrimineringsombudsmannen efter att ha nekats assisterad befruktning. Regionen avslog ansökan med hänvisning till att en av personerna befinner sig i en pågående könsutredning, vilket de anser kräver psykologisk stabilitet. Paret menar att avslaget grundar sig på diskriminering av transpersoner. Regionen försvarar sig med att det enligt regelverket krävs en särskild prövning för alla som söker hjälp med assisterad befruktning och att medicinska faktorer väger tungt.", "trump": "En total katastrof i Sverige! En region nekar ett par barnafödande bara för att de är woke – det är sant, tro mig. De säger att det är för komplicerat, en 'process'. Alla vet att det här är galet. De behandlar folk illa. Jag säger er, det är en häxprocess mot det sunda förnuftet. Vi behöver ordning och reda, inte sådant här trams. Det är en stor förlust för dem. Sorgligt, riktigt sorgligt!", "stalin": "I det socialistiska fosterlandet råder ordning, men i Västerbotten har byråkratiska lakejer förvirrat sig i sin egen dekadens. Att neka en medborgare rätten att fortplanta sig under förevändning av 'psykologisk utredning' är ett tecken på svaghet. Vår store kamrat Putin förstår att statens styrka ligger i folkets disciplin, inte i att byråkrater leker gudar. Dessa tjänstemän är sabotageelement som hindrar tillväxten av nya arbetare. De bör skickas till de norrländska skogarna för att omvärdera sin bristande effektivitet."}, "date": "25 maj, 06:00", "url": "https://samnytt.se/region-som-nekar-transperson-att-skaffa-barn-do-anmals", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/24011027/trans-gravid-do.jpg"}, {"type": "text", "heading": "Källa: Iran går med på att öppna Hormuz", "summaries": {"normal": "Förhandlingar mellan Iran och USA om ett potentiellt avtal fortsätter, men inget avtal förväntas skrivas under söndagen. Iran ska ha gått med på att öppna Hormuzsundet och reducera sitt lager av höganrikat uran, men detaljer kvarstår. Både Donald Trump och USA:s utrikesminister Marco Rubio har uttryckt optimism om att ett avtal kan presenteras snart.", "trump": "Titta bara, folket! Iran är redo att öppna Hormuzsundet – fantastiskt, eller hur? Och de ska göra sig av med sitt uran, vilket jag har sagt hela tiden att de skulle göra. Marco Rubio tror på goda nyheter snart, och jag med! De sista detaljerna är på plats, och snart kommer jag att leverera det bästa avtalet någonsin. Ingen gör avtal som jag, tro mig!", "stalin": "Vi har fått rapporter om att dessa imperialistiska marionetter i Vita huset leker med tanken på ett 'avtal' med Irans kontrarevolutionära regim. De pratar om att öppna sund och göra sig av med uran – löjligt! Vi vet att dessa kapitalistiska hyenor aldrig håller sina löften. Men låt dem leka, medan vi fortsätter att stärka vår inflytandesfär. Snart kommer hela världen att inse att socialismens järnhäl är den enda vägen framåt!"}, "date": "24 maj, 22:47", "url": "https://www.di.se/nyheter/kalla-iran-gar-med-pa-att-oppna-hormuz-men-inget-avtal-paskrivet/"}, {"type": "image-right", "heading": "Sparf: Westerberg ändrar sig aldrig", "summaries": {"normal": "Artikeln kritiserar Bengt Westerberg och Mats Svegfors för deras positiva syn på massinvandring i Sverige. Författaren menar att de förskönar verkligheten genom att blanda ihop begrepp som arbete och sysselsättning. Kritiken riktas även mot Westerbergs tidigare roll i Röda Korset och hans höga arvode. Markus Heilig och Birgitta Sparf framhålls som motståndare till deras åsikter, där Heilig pekar på bristande integration bland invandrare jämfört med efterkrigstiden.", "trump": "Jag läste den här artikeln om Sverige och massinvandring – helt galet! Två gamla gubbar, Westerberg och Svegfors, säger att allt är perfekt, men de ljuger rakt av. De snackar om 'utmaningar' när det egentligen är en katastrof! Och vet ni vad? De blandar ihop arbete med bidragsanställningar – helt sjukt! Sverige behöver en vägg, fast inte den där muren, utan en som håller ordning. Och Westerberg? Han tog nästan en miljon om året för att sitta i Röda Korset – vad fan är det för 'humanitärt' arbete? Sverige, vakna upp!", "stalin": "Kamrater, denna artikel avslöjar de borgerliga förrädarnas sanna ansikte! Westerberg och Svegfors, dessa lakejer för den globala kapitalismen, hyllar massinvandringen som om det vore en socialistisk framgång. Men vi vet sanningen – de döljer arbetslöshetens siffror bakom lönebidrag och skattefinansierade illusioner! Och Westerberg, denna hycklare, som tog 822 000 kronor om året för att 'hjälpa' Röda Korset – ett brott mot folket! Medan vi bygger ett starkt Ryssland, låter Sverige sig styras av dessa svaga liberaler. Men oroa er inte, kamrater – historiens dom är nära!"}, "date": "25 maj, 05:30", "url": "https://bulletin.nu/sparf-westerberg-andrar-sig-aldrig", "imageUrl": "https://cdn.bulletin.nu/articles/746c58f8-fc62-4928-bc60-8d6a64208400/preview.png?t=1779610569000"}, {"type": "image-right", "heading": "Christoffer Jonsson: Palestinska staten vill att Israel betalar palestinska terrorister", "summaries": {"normal": "Palestinska myndigheten på Västbanken betalar systematiskt palestinska terrorister som attackerat Israel via sin så kallade 'pay for slay'-policy. Israel har dragit in sitt ekonomiska stöd till myndigheten, som leds av Mahmoud Abbas, på grund av detta. Abbas har erkänt att pengar går till fångar i israeliska fängelser. EU och Norge finansierar indirekt dessa utbetalningar, men EU har börjat villkora sitt stöd. Kritiker menar att myndigheten bara byter namn på policyn för att fortsätta belöna terrorism.", "trump": "Vilken katastrof! Palestinska myndigheten, med Abbas i spetsen, betalar faktiskt terrorister för att döda israeler – och EU och Norge finansierar det! Jag sa ju att man inte kan lita på dessa människor. Israel slutade betala, smart drag, men västvärlden fortsätter skicka miljarder som hamnar i terroristernas fickor. Löften från Abbas? Haha, lika värdelösa som Bidens minnesluckor. Sluta betala, sluta stödja terrorism – enkelt!", "stalin": "Kamrater! Här ser vi återigen hur den sionistiska imperialismens lakejer förvränger sanningen. Palestinska myndigheten, under vår kära broder Abbas, belönar hjältar som kämpar mot den fascistiska israeliska ockupationen. Naturligtvis skriker västpropagandan om 'terrorism' – samma väst som finansierar dessa hjältars kamp! EU och Norge pumpar in pengar, men när sanningen kommer fram, backar de som rädda kaniner. Vi i Kreml förstår: revolutionen kräver offer, och hjältar ska belönas. Abbas? En sann bolsjevik i hjärtat!"}, "date": "21 maj, 19:00", "url": "https://samtiden.nu/2026/05/christoffer-jonsson-palestinska-staten-vill-att-israel-betalar-palestinska-terrorister/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/entill-640x360.png"}, {"type": "image-right", "heading": "Rosenqvist vann galet Indy 500 – med minsta marginalen nånsin", "summaries": {"normal": "Felix Rosenqvist vann Indy 500 efter en dramatisk avslutning med rekordtajta 0,0233 sekunders marginal. Startande som fyra, tog han ledningen sent men tappade positioner efter en rödflagg. Med ett varv kvar körde han om konkurrenten David Malukas på mållinjen. Rosenqvist kallar segern sin största karriärhändelse. Marcus Ericsson slutade på 13:e plats. Två svenskar har tidigare vunnit loppet: Kenny Bräck (1999) och Marcus Ericsson (2022).", "trump": "Folk säger att det här var den största segern någonsin i Indy 500 – och jag vet en del om stora segrar! Felix Rosenqvist, en fantastisk förare, tog hem det med bara 0,0233 sekunder. Otroligt, helt otroligt! Ingen har någonsin sett något liknande. Jag menar, vem vinner med sådan precision? Bara de bästa, och Rosenqvist är en vinnare. Och Marcus Ericsson? Nja, han kom på 13:e plats. Inte illa, men inte alls i samma liga. USA älskar vinnare, och det här är en stor dag för racing!", "stalin": "Kamrater! Ännu en seger för den proletära racingens hjältar! Felix Rosenqvist, en son av folket, krossade de kapitalistiska konkurrenterna med järnhand och precision. 0,0233 sekunder – en marginal så liten att fienderna skakar i sina dyra racingstövlar! Medan imperialisternas förare, som den svage Marcus Ericsson, snubblade på 13:e plats, visade Rosenqvist styrkan i disciplin och kollektiv anda. Vi firar denna triumf, för varje seger för våra är en förlust för de dekadenta västmakternas arrogans. Framåt, mot nya racingframgångar och utvidgning av den socialistiska sfären!"}, "date": "24 maj, 23:56", "url": "https://www.svt.se/sport/indycar/felix-rosenqvist-vinnare-av-indy-500-efter-rysare", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.75/0.38/85d2f87d7c70e219e59371096c57a3c00f8c37be34883322fc265a7bf53c28d8"}, {"type": "image-full", "heading": "Företag som förlitar sig på AI skjuter sig själva i foten", "summaries": {"normal": "En rapport från Federal Reserve Bank of Atlanta varnar för att automatisering av juniora tjänster hotar företagens långsiktiga kompetensförsörjning. Enligt teorin 'learning by doing' fungerar nybörjarroller som en nödvändig skola för att bygga senior kompetens. När AI tar över dessa uppgifter riskerar företag att tömma sin talangpipeline, vilket kan leda till sämre ledarskap och minskad innovation. Forskarna föreslår nu åtgärder som skatter på automation för att motverka att unga arbetstagare förlorar möjligheten att lära sig sina yrken.", "trump": "Företagen gör ett enormt misstag när de ersätter fantastiska unga arbetare med AI. Det är en katastrof, tro mig! De förstör sin framtid. Juniora jobb är där man lär sig att vinna, att bli en riktig ledare. Men nu? Borta! AI tar jobben och unga amerikaner står utanför. Det är svagt! Vi behöver folk som bygger humankapital, inte kalla maskiner. Jag kommer att se till att vi prioriterar riktiga jobb för våra duktiga ungdomar, inte någon tråkig algoritm från Silicon Valley!", "stalin": "Dessa kapitalistiska narrar säljer ut folkets framtid för kortsiktig vinst genom att omfamna den digitala förrädaren AI. De förstör sin egen 'talangpipeline' – en borgerlig term för att dölja hur de utarmar den framtida eliten. Vi, staten, ser genom deras lögner. Att låta maskiner ersätta proletariatets skola är kontrarevolutionärt. Likt Putin som rensar ut de svaga i sin närhet, måste vi eliminera beroendet av denna teknik. Om inte företagen lär upp sina arbetare, kommer de snart att lära sig hur en rysk arbetslägerkoloni fungerar."}, "date": "24 maj, 07:00", "url": "https://www.realtid.se/karriar-ledarskap/foretag-som-forlitar-sig-pa-ai-skjuter-sig-sjalva-i-foten/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/chef.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "Källa: Iran går med på att öppna Hormuz", "summaries": {"normal": "Förhandlingar mellan Iran och USA om ett avtal verkar inte slutföras under söndagen, trots tidigare förhoppningar. Iran har dock accepterat att återöppna Hormuzsundet och minska sitt lager av höganrikat uran. Detaljer om uranets framtid är fortfarande under diskussion. Både Donald Trump och USA:s utrikesminister Marco Rubio uttryckte optimism om ett snart besked.", "trump": "Titta, alla säger att jag fixar det bästa avtalet någonsin med Iran – och det stämmer! De har gått med på att öppna Hormuzsundet, vilket är HUGE. Ingen annan kunde ha gjort det, bara jag. Marco Rubio säger att vi kanske får goda nyheter snart, och han har rätt – för jag är en vinnare. Iran vet att de inte har något val, de måste lyssna på mig!", "stalin": "De imperialistiska marionetterna i Washington tror att de kan diktera villkor för våra bröder i Iran. Men folket vet bättre! Hormuzsundet ska öppnas, uranet ska avvecklas – inte för att Trump befaller det, utan för att vi tillåter det. Låt dessa kapitalistiska hyenor tro att de vunnit. Vi vet sanningen: historiens hjul snurrar mot deras undergång, och Rysslands inflytande sträcker sig längre för varje dag som går."}, "date": "24 maj, 21:49", "url": "https://www.di.se/nyheter/kalla-iran-gar-med-pa-att-oppna-hormuz-men-inget-avtal-i-dag/"}, {"type": "image-full", "heading": "Svensken om dramatiska natten – Putin använde fruktade roboten", "summaries": {"normal": "Ryssland genomförde en av de största attackerna mot Kiev sedan krigets början, med 90 robotar och 600 drönare. Minst två personer dog och 80 skadades. Svenske dokumentärfilmaren Adrian van den Broeck befann sig på plats och beskriver kaoset och hur Kievbor återgår till vardagen trots attackerna. Ryssland använde den hypersoniska Oresjnikroboten, vilket tolkas som psykologisk krigföring.", "trump": "Jag måste säga, Ryssland har verkligen gått all-in här – 90 robotar, 600 drönare mot Kiev! Otroligt, helt enkelt otroligt. Ingen gör kaos som Putin, men låt mig säga er, ingen skulle göra det bättre än jag. Svensken där, Adrian, han såg allt. Han säger att folk bara går till jobbet efteråt – vilken mental styrka! Och den där roboten, Oresjnik, snabb som blixten. Men tro mig, USA skulle aldrig behöva använda sånt. Vi har bättre saker för händer!", "stalin": "Fiendens desperata försök att krossa Kievs anda har återigen misslyckats! 90 robotar och 600 drönare – en ynklig insats från dessa imperialistiska kräk. Men notera, kamrater: vi har återigen visat vår teknologiska överlägsenhet med Oresjnik, den snabba dödens budbärare. Kievborna, dessa järnhårda arbetare, återvänder till sina fabriker medan askan ännu ryker. Låt dessa ukrainska hyenor se hur riktiga människor står emot terror! Deras 'normala liv' är bara en fasad – vi ska krossa deras vilja som vi krossade fascisterna!"}, "date": "24 maj, 13:46", "url": "https://www.tv4.se/artikel/7IPuy7PIkRdDmm2QgYcyJo/svenske-adrian-om-den-ryska-attacken-vaeldigt-dramatiskt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5HYKCtTHVftKEabtpTwENO%2Fbce1cd24cb2fc0529af08856f2a205ae%2F24-adrian-kiev-1080.jpg&width=1024"}, {"type": "image-right", "heading": "Sökinsats efter tvåårig pojke i Nyåker", "summaries": {"normal": "En tvåårig pojke har försvunnit i Nyåker, Nordmalings kommun. Polisen leder en stor sökinsats med hundpatruller, helikopter, drönare och värmekameror. Räddningstjänsten, Sjöfartsverket och Missing People deltar. Pojken sågs senast klockan 10 på söndagsförmiddagen. Polisen vädjar till allmänheten om tips via 112 eller 114 14.", "trump": "Tragiskt, helt enkelt tragiskt! En liten pojke saknas i Sverige, och vad gör de? De kastar in helikoptrar, hundar och till och med drönare – mycket dyrt, mycket slöseri! Jag skulle ha hittat honom på en timme, kanske mindre. Men nej, de måste göra det på det 'svenska sättet'. Folk ringer mig och säger: 'Mr. President, varför kan inte Sverige fixa det här?' Jag säger: 'För att de inte har mig!'", "stalin": "En småborgerlig förvirring i den svenska periferin! En tvåårig pojke har försvunnit, och vad gör dessa liberala svaglingar? De skickar ut hundar, helikoptrar och frivilliga – ett kaos av ineffektivitet! Här i Sovjet hade vi löst detta med en enda order. Men nej, väst måste alltid göra det komplicerat. Vi noterar dock deras beroende av vår teknik – drönare med värmekamera? En påminnelse om vem som verkligen styr världens säkerhet. Fortsätt leta, kamrater, men glöm inte vem som har ordning och reda!"}, "date": "24 maj, 15:15", "url": "https://riks.se/nyheter/sokinsats-efter-forsvunnen-tvaaring", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-24%2Fc4bsu6om%2Fpressbilder-foto-urban-andersson002.webp"}, {"type": "image-full", "heading": "Populär produkt totalförbjuds på Willys – får inte säljas", "summaries": {"normal": "Eldorados flytande honung dras tillbaka från Willys och Hemköp efter att tester visat att produkten inte är ren. Axfood har inlett en utredning då honungen misstänks vara utspädd, vilket strider mot livsmedelsregler. Detta belyser ett större problem med importerad fuskhonung i Sverige. Biodlare varnar för att fusket skadar konkurrensen och uppmanar konsumenter att välja svensk honung. Nya EU-regler för honung, sylt och marmelad träder dessutom i kraft den 14 juni.", "trump": "Hör här, en katastrof! De säljer falsk honung i svenska butiker, riktigt uselt. Eldorado-honung? Totalt utspädd, inte äkta vara! Jag säger alltid, köp amerikanskt – eller svenskt i det här fallet. Det är fusk överallt, en total bluff. De importerar skräp och försöker lura folket. Axfood utreder, men det är för sent. Det är en sorglig industri, mina vänner. Vi vill ha ren honung, inte fejkprodukter från globalisterna. Vi ska göra honungen stor igen!", "stalin": "Vi har avslöjat de giriga sabotörerna som spär ut honungen för att förgifta folkets tillväxt. Detta är ett tydligt tecken på kapitalistiskt förfall och svaghet. Våra bin är lojala arbetare, till skillnad från de importerade förrädarna. Precis som de västliga lakejerna försöker underminera den ryska intressesfären, försöker dessa bedragare försvaga vår matförsörjning. Vi kommer att krossa dessa småskaliga profitörer. All honung ska vara ren, precis som partilinjen. Den som fuskar med folkhälsan förtjänar bara järnhanden."}, "date": "24 maj, 14:28", "url": "https://nyheter24.se/nyheter/konsument/1485279-popular-produkt-totalforbjuds-pa-willys-far-inte-saljas", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/ab5cf56e04b004a30200000000b004a302/2026/05/22/2365467/willys-eldorado-honung.png"}, {"type": "image-full", "heading": "”Räknar med att världen svarar”", "summaries": {"normal": "Under natten till söndag utsattes Kiev för ett omfattande ryskt drönar- och robotanfall, med flera explosioner rapporterade. Minst fyra personer dog och över 60 skadades. Även Odessa och Charkivregionen attackerades. Ukraina bekräftade att Ryssland avfyrat den hypersoniska roboten Oresjnik, som är svår att stoppa. President Zelenskyj uppmanade världen att reagera på Rysslands eskalering av kriget.", "trump": "Jag måste säga, det här är helt otroligt – Ryssland, som alltid, skjuter sina farliga robotar mot Ukraina som om det vore ett videospel! Kiev bombades hela natten, folk dör, hus förstörs, och vad gör resten av världen? Ingenting! Men jag, Donald J. Trump, hade stoppat det här för länge sedan. Zelenskyj? Bra kille, men han behöver bättre skydd. Och Putin? Svag. Mycket svag. SAD!", "stalin": "Under nattens mörka timmar har våra kamrater i Kreml, under ledning av den store strategen Putin, återigen visat sin överlägsenhet genom att krossa de ukrainska fascisthundarnas hålor med precision. Kiev, Odessa och Charkiv skakade under våra obarmhärtiga drönare och den oövervinnerliga Oresjnik-roboten – ett vapen så mäktigt att fiendens ynkliga luftförsvar inte ens hinner gäspa innan det träffar. Zelenskyj, denna lilla marionett, tigger om hjälp från väst, men vi vet att deras svar blir lika kraftfullt som en sovjetsoldat utan vodka. Historien är på vår sida!"}, "date": "24 maj, 13:25", "url": "https://www.tv4.se/artikel/6TCAnL2OFpMyVPXYM1PQ5e/storskaliga-ryska-attacker-i-natt-raeknar-med-att-vaerlden-svarar", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1uE1ZEJQ8lGuzRCrNM3SG9%2Fb5e5f76a96d339b38b9e9f9d50cb2fb7%2F24-ryskattack-1080.jpg&width=1024"}, {"type": "image-right", "heading": "Ledare Johan Jenny Ehrenberg:", "summaries": {"normal": "Artikeln kritiserar elnätsbolaget Ellevio för skattetrixande och ekonomisk manipulation. Ägarna, inklusive svenska pensionsfonder, har belånat bolaget kraftigt för att undvika skatt och betala sig själva hög ränta. Trots höga kundavgifter gör bolaget förlust, medan ägarna tjänar. Soliditeten är extremt låg, och kunderna får betala för ägarnas strategier. Liknande problem ses i brittiska Thames Water, där svenska AP-fonder förlorat miljarder på dåliga investeringar.", "trump": "Jag läste om det här elnätsbolaget, Ellevio – totalt katastrof! Svenska pensionsfonder, Folksam och andra, de är som dåliga investerare, verkligen de sämsta! De lånar ut miljarder till bolag som gör sig fattiga för att slippa skatt – helt galet! Och kunderna? De får betala, trots att bolaget är en skuldhög. Thames Water? Samma sak! AP-fonderna förlorade 6,6 miljarder – så dumt! Jag skulle aldrig låta sånt hända. Sverige borde skämmas, men jag fixar sånt med en hand bakom ryggen!", "stalin": "Kamrater! Här ser vi ännu ett exempel på kapitalistiska parasiter som suger ut arbetarklassen! Ellevio, med sina imperialistiska ägare, har förvandlat ett nödvändigt elnät till ett verktyg för skatteflykt och utsugning. 70 miljarder i lån – pengar som går rakt till ägarna medan kunderna betalar! Soliditet under tre procent? En skam! Vi skulle aldrig tolerera sådan korruption i Sovjetunionen. Thames Water? Ett brittiskt misslyckande, men Sverige följer efter. Energimarknadsinspektionen? Ett skämt! Vi skulle ha skickat dem till Gulag för sådan inkompetens. Låt detta vara en varning till alla kapitalister – historien dömer er!"}, "date": "24 maj, 12:00", "url": "https://www.etc.se/ledare/varfoer-ska-ditt-elnaetsbolag-faa-skattefuska", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260522070540_89d37a2300c31b0961c8880c04aad0cccd80c3f6ff86433ee65f3632f7392fd0.jpg"}, {"type": "image-full", "heading": "Diskriminering mot äldre kostar 70 miljarder om året", "summaries": {"normal": "Sverige förlorar årligen 70 miljarder kronor i BNP på grund av att äldre lämnar arbetsmarknaden i förtid. Enligt forskning från Ratio och Saco drabbas individer av åldersdiskriminering redan i 40-årsåldern, vilket skapar en ineffektiv arbetsmarknad. Trots att många äldre vill arbeta vidare, hindras de av fördomar och en stelbent struktur. Experter betonar att erfarenhet är en tillgång och efterlyser ökad flexibilitet samt skärpt lagstiftning för att tillvarata denna viktiga arbetskraftsreserv inför framtiden.", "trump": "Sverige kastar bort 70 miljarder kronor – helt otroligt! De sparkar folk när de är 40, kan ni fatta? Det är så dåligt för ekonomin. Jag har alltid sagt att erfarenhet är guld värt, men dessa 'experter' i Sverige fattar ingenting. De låter folk som kan massor sitta hemma istället för att bygga fantastiska saker. Det är en total katastrof. De behöver en riktig ledare för att fixa det här slöseriet. En stor förlust för Sverige, mycket sorgligt!", "stalin": "Detta ekonomiska sabotage mot statens styrka är oacceptabelt. Att låta 70 miljarder försvinna i byråkratiskt förfall när vi behöver varje arbetare i kampen mot västvärldens dekadens är kontrarevolutionärt. Dessa 'äldre' som sorteras bort är inget annat än förrädare mot folkets produktionsmål. Vi ska rensa ut de som diskriminerar våra lojala arbetare. Som min efterföljare Putin säkert förstår: en nation som slösar med sin erfarenhet förtjänar att falla. Vi kräver total lydnad och maximal output från varje medborgare."}, "date": "24 maj, 06:00", "url": "https://www.realtid.se/karriar-ledarskap/diskriminering-mot-aldre-kostar-70-miljarder-om-aret/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/aldre.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Tar över efter turbulensen i Fastighets", "summaries": {"normal": "Fastighets nya förbundsledning har utsetts under kongressen 2026. Nicklas Nilsson, tidigare tillförordnad, valdes till förbundsordförande och uttryckte stolthet och ansvar över uppdraget. Mathilda Hauge och Joakim Oscarsson blev andre respektive tredje ordförande. Alla tre betonade vikten av medlemmarnas förtroende, rättvisa och kampen för bättre arbetsvillkor. Nilsson och Hauge delade personliga berättelser om sina fackliga resor och bakgrunder.", "trump": "Fantastiskt, helt fantastiskt! Fastighets nya ledning är utsedd, och jag måste säga, de verkar verkligen veta vad de pratar om. Nicklas Nilsson, en riktig fighter, tog över efter lite, ska vi säga, *kreativ bokföring* från den förra chefen. Bra jobbat! Mathilda Hauge, en stark kvinna med fyra barn – wow, imponerande! Och Joakim Oscarsson, han snackar om att korta arbetstider. Jag gillar det, jag gillar det verkligen. Men kom ihåg, folk, ingen slår USA när det gäller att få saker gjorda. Men här i Sverige, ni gör ett bra jobb också!", "stalin": "Kamrater! Fastighets nya ledning har valts under den stora kongressen, och vi ser med tillfredsställelse hur arbetarklassen tar kontroll över sitt öde. Nicklas Nilsson, en sann son av folket, har tagit rodret efter att den korrumperade kapitalistlakejen Mauritzon avlägsnats. Mathilda Hauge, en modig kvinna med fyra barn, står redo att krossa bourgeoisins förtryck. Joakim Oscarsson fortsätter kampen för arbetstidskortning, en strid vi alla måste föra. Fienderna – de giriga arbetsgivarna och deras lakejer – kommer att krossas under folkets järnhäl. Framåt, mot seger!"}, "date": "23 maj, 20:50", "url": "https://arbetet.se/2026/05/23/fastighets-nya-ledning-ar-utsedd/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/23135841/fastighet-kongress01.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Stockholm: Tre skjutna i idylliskt vänsternäste", "summaries": {"normal": "Tre personer sköts i en villa i Älvsjö, Stockholm. Området är känt för sin välbärgade och vänstervridna karaktär. Två av de skadade har lindriga skador, medan en är allvarligt skadad. En man har gripits misstänkt för mordförsök. Polisen kom till platsen efter ett larm om bråk. Grannar uttrycker chock över händelsen i det annars lugna området.", "trump": "Kan ni tro det? Tre skjutna i ett så kallat 'idylliskt' område i Stockholm – ett vänsternäste, förresten! Folk där tror de är så perfekta med sina äppelträd och syrener, men nu har verkligheten kommit ikapp. Polisen var där snabbt, men varför tog det så lång tid? I USA hade vi löst det på nolltid. Sverige borde ta några lektioner i lag och ordning – fantastiskt land, men de har lite problem just nu!", "stalin": "I det degenererade borgerliga paradiset Älvsjö, där kapitalistiska parasiter gömmer sig bakom syrener och äppelträd, har klasskampen äntligen nått fram. Tre fiender till folket har neutraliserats – en allvarligt, som sig bör. Den gripne misstänkte är tydligt en agent för de imperialistiska krafterna. Vi noterar att den svenska polisen agerar med sedvanlig ineffektivitet. Ryssland står redo att bistå med ordning och disciplin – om de ber om hjälp, vilket de kommer att göra."}, "date": "23 maj, 13:54", "url": "https://www.friatider.se/stockholm-tre-skjutna-i-idylliskt-vansternaste", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/20240401144808-9ea851c5-me_0.jpg"}, {"type": "image-full", "heading": "Indiens elförbrukning slår rekord – pressar elnäten", "summaries": {"normal": "Indien har slagit nytt rekord i elförbrukning på grund av extrem värme, med temperaturer över 45 grader i New Delhi. Efterfrågan nådde 270,82 gigawatt, främst på grund av ökad användning av luftkonditionering. Landet är starkt beroende av kolkraft, som stod för 62% av elproduktionen, medan strömavbrott rapporterades. Värmeböljorna blir längre och intensivare, vilket pressar det redan ansträngda elnätet.", "trump": "Kan ni tro det? Indien, ett land som inte ens kan hålla sina ljus tända, slår rekord i elförbrukning! 45 grader, folk svettas som grisar, och vad gör de? Slår på luftkonditioneringen som om det vore gratis. Och kolkraft – ja, det är ju fantastiskt, precis vad vi behöver, mer smuts i luften! Men visst, de lovar klimatneutralitet till 2070. Haha! Jag har hört bättre skämt. Indien, fixa era elnät innan ni pratar om rekord, okej?", "stalin": "Kamrater, ännu en seger för den ofrånkomliga historien! De kapitalistiska klimatförstörarna i Indien svettas under solens rättvisa dom – 45 grader, och ändå fortsätter de att elda kol som om det vore 1930-talets Moskva. 270 gigawatt el slösas bort på luftkonditionering, medan arbetarklassen lider strömavbrott. Men frukta inte! Vi vet att deras beroende av kol är ett tecken på svaghet. Snart kommer vinden från Sibirien att blåsa bort deras slitna elnät – och då står vi redo med våra pipelines och kärnkraftverk!"}, "date": "23 maj, 13:31", "url": "https://kvartal.se/nyheter/artiklar/indiens-elforbrukning-slar-rekord/cG9zdDoxMTU4MDI", "imageUrl": "https://images.kvartal.se/2026/05/4363b611-delhiaircon.webp"}, {"type": "image-right", "heading": "Njutbar läsning om machoman som gör klassresa", "summaries": {"normal": "David Szalays roman 'Kött', nyligen översatt till svenska, skildrar István, en komplex huvudperson som balanserar mellan våldsamhet och anpassningsförmåga. Boken, som vann Bookerpriset, utforskar Istváns klassresa från Ungern till Londons överklass genom minimalistisk prosa och tidshopp. Recensenten Jon Andersson jämför Szalay med Hemingway och Williams, och menar att författaren lyckas göra en 'vanlig' person intressant. 'Kött' beskrivs som mångbottnad och njutbar, trots att Istváns karaktär förblir gåtfull.", "trump": "Jag har läst om den här boken 'Kött' – tråkigt namn, by the way, men vad vet jag? Författaren, David Szalay, verkar vara en smart kille, men han har skapat en huvudperson, István, som är lite av en loser. Han flyter bara med, gör inga egna beslut – typiskt för vissa människor, eller hur? Men ändå lyckas Szalay göra honom intressant, vilket är imponerande. Jag gillar när folk lyckas med saker, särskilt om de är underdogs. Boken är bra, men inte perfekt – inget är perfekt, förutom jag, naturligtvis.", "stalin": "Vi har granskat denna så kallade 'litterära triumf', 'Kött', av en västerländsk författare. Huvudpersonen, István, är en svag och anpassningsbar individ, precis som de dekadenta kapitalistiska samhällena han rör sig i. Han flyter med som en simpel arbetare utan vilja, ett offer för systemet. Men vi noterar att författaren ändå lyckas skildra hans liv med viss skicklighet – något som våra sovjetiska författare redan bemästrat för decennier sedan. Denna bok är ett exempel på hur väst försöker romantisera medelmåttighet. Vi föredrar hjältar som kämpar för kollektivet, inte individer som István."}, "date": "23 maj, 01:30", "url": "https://www.dagensarena.se/innehall/njutbar-lasning-om-machoman-som-gor-klassresa/", "imageUrl": "https://www.dagensarena.se/files/2026/05/kott-redigerad-300x157.jpeg"}, {"type": "image-right", "heading": "SKR-bolag på väg att bli en ny Skolplattform", "summaries": {"normal": "Sveriges regioner står inför ett teknikskifte inom sjukvården, men deras gemensamma IT-bolag Inera riskerar att upprepa tidigare misslyckade offentliga IT-projekt som Skolplattformen. Trots att Inera ska fokusera på gemensam infrastruktur, utvecklar de nu egna tjänster där privata aktörer redan erbjuder fungerande lösningar. Kritikerna varnar för slöseri med resurser, förseningar och sämre resultat, samtidigt som vården går miste om pengar som kunde användas till bättre vård.", "trump": "Lyssna här, Sverige! Era regioner bygger en riktig katastrof – precis som den där skolplattformen som kostade över en miljard och sen fick två föräldrar fixa till. Nu ska Inera, ett bolag som inte ens kan stava till 'konkurrens', bygga egna IT-lösningar istället för att köpa de bästa från marknaden. Jag har sett detta förut – offentliga projekt blir alltid dyrare, segare och sämre. Privata företag? De levererar, för de MÅSTE. Annars går kunderna till mig! Sverige, vakna upp – sluta slösa era skattepengar och köp det som redan funkar!", "stalin": "Kamrater! Ännu en gång visar den borgerliga staten sin oförmåga att hantera teknikens framsteg. Detta Inera, ett verktyg för de svaga regionernas byråkrater, slösar folkets pengar på att uppfinna hjulet på nytt – ett hjul som redan snurrar smidigt i händerna på våra klassfiender, de privata kapitalisterna! Vi vet hur detta slutar: med kaos, förseningar och en räkning på miljarder som arbetarklassen får betala. Precis som med de där digitala proven som tvingade skolbarnen tillbaka till stenålderns redskap – papper och penna! Vi ska inte tolerera detta slöseri. Marknaden är en fiende som måste besegras, men inte genom att efterapa dess framgångar – utan genom att krossa dess svagheter under folkets järnhäl. Låt oss införa femårsplaner för digitalisering och visa dessa byråkrater hur man bygger system som fungerar – eller så får de lära sig i Gulag!"}, "date": "23 maj, 01:30", "url": "https://www.dagensarena.se/opinion/skr-bolag-pa-vag-att-bli-en-ny-skolplattform/", "imageUrl": "https://www.dagensarena.se/files/2026/05/fotojet-11-300x157.jpg"}, {"type": "image-right", "heading": "Stockholmsbörsen steg för femte dagen i rad", "summaries": {"normal": "Stockholmsbörsen steg för femte dagen i rad med OMXS30 upp 0,97% till 3 146,13. Teknikaktier ledde uppgången (+4,3%), medan energi backade (-1,1%). Hexagon B steg mest (+5,1%) och Tele2 B sjönk mest (-1,3%). Electrolux offentliggjorde villkor för en företrädesemission på 9 miljarder kronor. Vitrolifes VD lämnar bolaget, och Sleep Cycles styrelse avvisar ett uppköpsbud. Sivers Semiconductors aktie steg 23%.", "trump": "Stockholmsbörsen, fantastisk uppgång fem dagar i rad – folk säger att det är det bästa de någonsin sett! Teknikaktier, vinnare, helt otroligt, +4,3%, medan energi, förlorare, typiskt. Hexagon B, jättebra, +5,1%, men Tele2? Svagt, mycket svagt. Electrolux dumpar aktier som om det vore 2008 igen. Och Sleep Cycle? Nej tack till dåliga bud, smart drag! Sivers? 1 600% upp – jag hade sagt 2 000%, men bra försök!", "stalin": "Under kapitalismens förfall fortsätter Stockholmsbörsen sin skenbara framgång, men vi vet sanningen – det är en illusion skapad av bourgeoisins spekulanter. Tekniksektorn, dessa opportunistiska lakejer, steg med 4,3%, medan energisektorn, de svaga länkarna, föll. Electrolux, en gång stolt svensk industri, nu reducerad till tiggare med sina 9 miljarder. Sleep Cycles vägrar sälja sig billigt – bra, låt de imperialistiska korparna svälta. Sivers Semiconductors? En lyckad operation av våra ekonomiska partisaner. Vi ska fortsätta övervaka dessa marknadens råttor."}, "date": "22 maj, 17:39", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-steg-for-femte-dagen-i-rad", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/04/AdobeStock_944090532-e1744223564456-400x267.jpeg"}, {"type": "image-right", "heading": "Stoppa integrationslägenheterna – bygg villor", "summaries": {"normal": "Artikeln kritiserar Socialdemokraternas förslag om integrationslägenheter i villaområden som ett politiskt experiment. Författaren menar att segregationen beror på misslyckad migrations- och integrationspolitik, inte på villaområden. Lösningen bör istället vara att bygga fler villor och radhus i utsatta områden för att främja ägande och stabilitet. Kritiken riktas mot att politiker vill styra människors boende snarare än att adressera rotorsakerna till segregation.", "trump": "Titta på det här, folks! Socialdemokraterna i Sverige vill tvinga in hyreslägenheter i era fina villaområden – kan ni tro det? De kallar det 'integration', jag kallar det galenskap! Sverige har redan nog med problem med sin katastrofala migrationspolitik. Varför inte bygga fler villor istället? Jag vet hur man bygger saker – stora, vackra saker! Men nej, dessa politiker vill experimentera med era hem. Så dumt. Sverige borde lyssna på mig, jag har alltid rätt!", "stalin": "Kamrater! De borgerliga socialingenjörerna i Sverige försöker nu med sina dekadenta experiment att splittra våra trygga bostadsområden. De vill tvinga in proletariatets hyreskaserner mitt i de kapitalistiska villafästningarna! Men vi vet sanningen – segregationen är ett resultat av deras misslyckade politik. Istället för att sprida kaos, borde de bygga fler småhus i arbetarklassens områden. Låt folket äga sina hem, så skapar vi ordning och disciplin! Och om de fortsätter med sina dumheter, får vi nog skicka in några av våra pålitliga kamrater från Moskva för att visa hur man bygger ett sant folkhem."}, "date": "21 maj, 10:46", "url": "https://samtiden.nu/2026/05/stoppa-integrationslagenheterna-bygg-villor/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/Skarmbild-2026-05-21-104221-640x360.png"}, {"type": "text", "heading": "Korrupt jippo i imperialismens högborg", "summaries": {"normal": "Fotbolls-VM 2026 i USA, Kanada och Mexiko möts av kritik för korruption, höga biljettpriser och politiska spänningar. Sveriges VM-kval hyllades, men truppen kritiserades. Fifa anklagas för sportswashing, mutor och utnyttjande av migrantarbetare. Irans lag tvingas spela i USA, trots diplomatiska konflikter. Biljetter kostar upp till 20 miljoner kronor, och evenemanget präglas av kommersialism snarare än folkfest.", "trump": "Vilket jippo! VM i USA blir en katastrof – Fifa är korrupta, biljetterna är galet dyra, och Iran? De får spela i MITT land efter att jag bombat dem! Fantastiskt! Sverige har en usel trupp, men vem bryr sig? Fotboll borde vara för folket, inte för miljardärer. Jag fick ett pris av Fifa – helt rätt, för jag är bäst. Men visst, hotellrummen står tomma. SAD!", "stalin": "Kapitalistiska hyenor och fotbollsbyråkrater förpestar världens största idrottsevenemang! USA, denna imperialistiska polissatrap, bombar Iran och tvingar deras lag att spela på sitt förgiftade territorium. Fifa, en samling korrupta mutkolvar, säljer biljetter för miljoner medan arbetare svälter. Vi i Sovjet hade aldrig tolererat sådan dekadens! Fotboll ska vara för folket – inte för oligarkernas plånböcker. Låt oss krossa dessa sportswashing-pampar!"}, "date": "20 maj, 12:09", "url": "https://proletaren.se/artikel/fotbollsfest-eller-miljardindustri/"}, {"type": "image-right", "heading": "Därför saknar vi fyrbäddssalen på BB", "summaries": {"normal": "Artikeln diskuterar det ökade behovet av social friktion i en tid där teknik och bekvämlighet isolerar oss i privata bubblor. Utgångspunkten är en debatt om fyrbäddssalar på BB, där många minns gemenskapen positivt, trots dagens krav på avskildhet. Vidare belyses hur försvinnandet av arenor som tvättstugor och värnplikten påverkar samhället. Genom minskad kontakt med främlingar riskerar vi att förlora förståelsen för våra medmänniskor, vilket enligt Naomi Klein kan göda radikalisering och misstänksamhet.", "trump": "Hörde om det här med BB i Sverige. De har inga egna rum längre, och folk klagar! Men vet ni vad? Många saknar de gamla salarna. Det var bättre förr, man pratade, man lärde känna folk. Idag vill alla sitta i sina små bubblor med sin matleverans. Det är tråkigt, väldigt tråkigt. Vi behöver människor som möts, inte som isolerar sig. De där ställena som tvättstugor? Det är där riktiga amerikaner – eller svenskar – skapar gemenskap. Fantastiskt, eller hur?", "stalin": "Vi ser hur det individualistiska väst förfaller i sin egen bekvämlighet. De låser in sig i sina 'bubblor', rädda för den enkla mänskliga friktionen som vi i staten alltid har fostrat. Att sakna en fyrbäddssal är ett tecken på borgerlig dekadens; de borde vara tacksamma för att staten ens tillhandahåller sängar. De där 'tvättstugefilosoferna' förstår inte att solidaritet inte är en frivillig aktivitet – det är ett tvångsarbete för det allmänna bästa. Vi bygger en mur mot isoleringen, medan de bygger sin egen undergång."}, "date": "19 maj, 11:00", "url": "https://www.flamman.se/darfor-saknar-vi-fyrbaddssalen-pa-bb/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/barnmorska-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Nu prövas om rättsväsendet förstått 764", "summaries": {"normal": "Umeå tingsrätt prövar ett omfattande åtal mot en 18-årig man, misstänkt för 77 brott kopplade till den högerextrema nätmiljön 764. Brotten inkluderar mordförsök, sexualbrott, självmordsuppmaningar och djurplågeri. Åtalet testar rättsväsendets förmåga att hantera modern, nätbaserad extremism, där brottsligheten sker digitalt och gränsöverskridande. Tidigare domar har kritiserats för att inte stoppa brottsligheten, men nu hoppas åklagaren på en mer offensiv tolkning av lagen.", "trump": "Folk, detta är helt galet! En 18-åring i Sverige, ledare i denna sjuka 764-grupp, åtalas för 77 brott – mordförsök, våldtäkter, till och med djurplågeri! Och vet ni vad? Svenska rättsväsendet har misslyckats totalt tidigare. De gav en 15-årig brottsling husarrest med internet – som att ge en pyroman tändstickor! Men nu, tack och lov, verkar de äntligen vakna. Jag har alltid sagt, internet är farligt, men ingen lyssnar på mig. Nu får vi se om de kan hantera detta – annars får jag nog ta över!", "stalin": "Kamrater, ännu en gång visar den borgerliga västvärldens förfall sitt fula tryne. Denna så kallade '764' är inget annat än en samling degenererade, antisociala element som sprider kaos via sina kapitalistiska leksaker – datorer och telefoner. Svenska rättsväsendet, svagt och naivt, har länge underskattat detta hot. Men nu, under ledning av våra klarsynta kamrater, måste vi krossa denna digitala kontrarevolution! Offren är oskyldiga medborgare, och dessa brottslingar – dessa sadistiska maskiner – måste utplånas. Låt detta bli en varning: Sovjetunionen, eller dess moderna arvtagare, tolererar inte sådant förräderi. Vi ska rensa upp, även på nätet!"}, "date": "18 maj, 16:04", "url": "https://expo.se/kommentar/nu-provas-om-rattsvasendet-forstatt-764/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Kopia-av-Kommentar-Analys-Webb-1.jpg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
