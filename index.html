v, träffades med kraftiga explosioner, skadade byggnader och minst fyra döda. Ukrainas president Zelenskyj kallade attackerna galna, medan Ryssland hävdar hämnd för en tidigare incident. Oresjnik, som kan bära kärnvapen, används även för att visa styrka.", "trump": "Jag säger er, Ryssland har verkligen gått loss mot Ukraina – 90 robotar, 600 drönare, och till och med den där superroboten Oresjnik! Kiev ser ut som ett krigszon, folk dör, byggnader brinner. Zelenskyj, stackars kille, kallar Putin galen. Men jag vet bättre – Putin vill bara visa vem som bestämmer. Och tro mig, ingen gör det bättre än jag. USA skulle aldrig tillåta sådant kaos!", "stalin": "Under natten har våra modiga styrkor visat imperialistiska lakejer och ukrainska fascistavskummet vad verklig makt innebär. Över 600 drönare och 90 robotar, inklusive vår mäktiga Oresjnik, lät Kiev skaka i sina grundvalar. Fyra av deras undermänniskor föll, och deras borgmästare jämrar sig som en skadad hund. Zelenskyj, denna ynkliga marionett, skriker om galenskap – men det är vi som skriver historiens gång. Låt dem darra!"}, "date": "24 maj, 08:48", "url": "https://kvartal.se/nyheter/artiklar/nya-attacker-mot-kiev-under-natten/cG9zdDoxMTYxNTY", "imageUrl": "https://images.kvartal.se/2026/05/dbfbd6d8-ukrainekiev.webp"}, {"type": "image-full", "heading": "Företag som förlitar sig på AI skjuter sig själva i foten", "summaries": {"normal": "En rapport från Federal Reserve Bank of Atlanta varnar för att automatisering av juniora tjänster hotar företagens långsiktiga kompetensförsörjning. Enligt teorin 'learning by doing' fungerar nybörjarroller som en nödvändig skola för att bygga senior kompetens. När AI tar över dessa uppgifter riskerar företag att tömma sin talangpipeline, vilket kan leda till sämre ledarskap och minskad innovation. Forskarna föreslår nu åtgärder som skatter på automation för att motverka att unga arbetstagare förlorar möjligheten att lära sig sina yrken.", "trump": "Företagen gör ett enormt misstag när de ersätter fantastiska unga arbetare med AI. Det är en katastrof, tro mig! De förstör sin framtid. Juniora jobb är där man lär sig att vinna, att bli en riktig ledare. Men nu? Borta! AI tar jobben och unga amerikaner står utanför. Det är svagt! Vi behöver folk som bygger humankapital, inte kalla maskiner. Jag kommer att se till att vi prioriterar riktiga jobb för våra duktiga ungdomar, inte någon tråkig algoritm från Silicon Valley!", "stalin": "Dessa kapitalistiska narrar säljer ut folkets framtid för kortsiktig vinst genom att omfamna den digitala förrädaren AI. De förstör sin egen 'talangpipeline' – en borgerlig term för att dölja hur de utarmar den framtida eliten. Vi, staten, ser genom deras lögner. Att låta maskiner ersätta proletariatets skola är kontrarevolutionärt. Likt Putin som rensar ut de svaga i sin närhet, måste vi eliminera beroendet av denna teknik. Om inte företagen lär upp sina arbetare, kommer de snart att lära sig hur en rysk arbetslägerkoloni fungerar."}, "date": "24 maj, 07:00", "url": "https://www.realtid.se/karriar-ledarskap/foretag-som-forlitar-sig-pa-ai-skjuter-sig-sjalva-i-foten/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/chef.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Diskriminering mot äldre kostar 70 miljarder om året", "summaries": {"normal": "Sverige förlorar årligen 70 miljarder kronor i BNP på grund av att äldre lämnar arbetsmarknaden i förtid. Enligt forskning från Ratio och Saco drabbas individer av åldersdiskriminering redan i 40-årsåldern, vilket skapar en ineffektiv arbetsmarknad. Trots att många äldre vill arbeta vidare, hindras de av fördomar och en stelbent struktur. Experter betonar att erfarenhet är en tillgång och efterlyser ökad flexibilitet samt skärpt lagstiftning för att tillvarata denna viktiga arbetskraftsreserv inför framtiden.", "trump": "Sverige kastar bort 70 miljarder kronor – helt otroligt! De sparkar folk när de är 40, kan ni fatta? Det är så dåligt för ekonomin. Jag har alltid sagt att erfarenhet är guld värt, men dessa 'experter' i Sverige fattar ingenting. De låter folk som kan massor sitta hemma istället för att bygga fantastiska saker. Det är en total katastrof. De behöver en riktig ledare för att fixa det här slöseriet. En stor förlust för Sverige, mycket sorgligt!", "stalin": "Detta ekonomiska sabotage mot statens styrka är oacceptabelt. Att låta 70 miljarder försvinna i byråkratiskt förfall när vi behöver varje arbetare i kampen mot västvärldens dekadens är kontrarevolutionärt. Dessa 'äldre' som sorteras bort är inget annat än förrädare mot folkets produktionsmål. Vi ska rensa ut de som diskriminerar våra lojala arbetare. Som min efterföljare Putin säkert förstår: en nation som slösar med sin erfarenhet förtjänar att falla. Vi kräver total lydnad och maximal output från varje medborgare."}, "date": "24 maj, 06:00", "url": "https://www.realtid.se/karriar-ledarskap/diskriminering-mot-aldre-kostar-70-miljarder-om-aret/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/aldre.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Debatt: Miljöpartiet behandlas med silkesvantar", "summaries": {"normal": "Artikeln kritiserar medias dubbelmoral i rapporteringen om partiers beroende av stödröster. Högerpartier som Liberalerna framställs ofta som svaga och i kris när de får taktiska röster, medan Miljöpartiets liknande beroende av socialdemokratiska väljare sällan problematiseras. Författaren menar att Miljöpartiet gynnas av en mer välvillig behandling i media, särskilt inom public service, och ifrågasätter varför samma kritiska granskning inte tillämpas på alla partier.", "trump": "Jag säger er, svensk media är helt galen! De hatar högerpartier, särskilt Liberalerna – 'Åh nej, de får stödröster, det är en kris!'. Men när Miljöpartiet, som inte ens klarar sig själva, räddas av socialisterna – då är det plötsligt 'helt normalt'. Fake news! Public service? Mer som Public Socialism! De borde skämmas. Jag skulle aldrig låta sånt hända i USA – vi har standards, vi har vinnare, vi har SANNINGEN!", "stalin": "Vi ser med stort intresse hur de borgerliga medierna i Sverige förvränger sanningen. Liberalerna, dessa ynkliga småkapitalister, fördöms för att de tvingas luta sig mot taktiska röster – som om det vore ett brott! Men när våra gröna kamrater i Miljöpartiet, dessa svaga plantor som inte ens kan stå på egna rötter, räddas av socialdemokratiska väljare – då är det plötsligt 'demokratins naturliga gång'. Vilken hyckleri! Vi i Sovjet – förlåt, Ryssland – skulle aldrig tolerera sådan desinformation. Alla partier måste granskas med järnhand, eller så försvinner de i historiens sopor. För övrigt: dessa svenska journalister påminner oss om de dekadenta västmedierna som Putin så klokt har tystat. Bra jobbat, kamrat Putin!"}, "date": "24 maj, 13:00", "url": "https://bulletin.nu/debatt-miljopartiet-behandlas-med-silkesvantar", "imageUrl": "https://cdn.bulletin.nu/articles/0ebabac9-c79e-447d-867a-7ab75fb32607/preview.png?t=1779527647000"}, {"type": "image-right", "heading": "Ska advokatbreven få medier att tystna?", "summaries": {"normal": "Advokatbyrån Bratt Feinsilber Harling har krävt att tidningen Flamman avpublicerar namn och bild på en högerextrem profil som spridit grovt judehat. Frågan väcks om hot om juridiska processer används för att tysta medier. Flamman vägrar ta bort uppgifterna och menar att publiceringen är motiverad av allmänintresse. Fenomenet med strategiska stämningar, så kallade 'slappar', har nått Sverige och riskerar att begränsa pressfriheten genom ekonomisk press på medier.", "trump": "Lyssna här, folkens – det här är helt galet! En advokatbyrå, som säkert är väldigt 'bra' och 'smart' (inte), försöker tysta en tidning som avslöjar judehatande extremister. Jag menar, vad är nästa steg? Ska vi låta dessa typer bestämma vad som får skrivas? Flamman står på sig, och det är bra – för i USA hade jag sagt 'fake news' och sparkat ut dem ur presskonferensen! Sverige måste vakna – dessa stämningshot är ett angrepp på yttrandefriheten, och jag vet allt om angrepp, believe me!", "stalin": "Medborgare! En ny front i klasskampen har öppnats – bourgeoisins advokater, dessa lakejer i kostym, försöker kväsa den revolutionära pressen med sina pappersbomber! De hotar Flamman för att de vågat avslöja fascistiska kryp i SD:s led. Men vi vet sanningen: dessa 'strategiska stämningar' är inget annat än kapitalets desperata försök att tysta arbetarklassens röst. Låt dem komma med sina domstolar – vi har redan vunnit slaget om historien! Och till dessa högerextrema insekter säger vi: era Telegram-gruppers skändliga ord är ingenting mot Röda arméns stål!"}, "date": "21 maj, 13:16", "url": "https://www.flamman.se/ska-advokatbreven-fa-medier-att-tystna/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/bratt-harling-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Tar över efter turbulensen i Fastighets", "summaries": {"normal": "Fastighets nya förbundsledning har utsetts under kongressen 2026. Nicklas Nilsson, tidigare tillförordnad, valdes till förbundsordförande och uttryckte stolthet och ansvar över uppdraget. Mathilda Hauge och Joakim Oscarsson blev andre respektive tredje ordförande. Alla tre betonade vikten av medlemmarnas förtroende, rättvisa och kampen för bättre arbetsvillkor. Nilsson och Hauge delade personliga berättelser om sina fackliga resor och bakgrunder.", "trump": "Fantastiskt, helt fantastiskt! Fastighets nya ledning är utsedd, och jag måste säga, de verkar verkligen veta vad de pratar om. Nicklas Nilsson, en riktig fighter, tog över efter lite, ska vi säga, *kreativ bokföring* från den förra chefen. Bra jobbat! Mathilda Hauge, en stark kvinna med fyra barn – wow, imponerande! Och Joakim Oscarsson, han snackar om att korta arbetstider. Jag gillar det, jag gillar det verkligen. Men kom ihåg, folk, ingen slår USA när det gäller att få saker gjorda. Men här i Sverige, ni gör ett bra jobb också!", "stalin": "Kamrater! Fastighets nya ledning har valts under den stora kongressen, och vi ser med tillfredsställelse hur arbetarklassen tar kontroll över sitt öde. Nicklas Nilsson, en sann son av folket, har tagit rodret efter att den korrumperade kapitalistlakejen Mauritzon avlägsnats. Mathilda Hauge, en modig kvinna med fyra barn, står redo att krossa bourgeoisins förtryck. Joakim Oscarsson fortsätter kampen för arbetstidskortning, en strid vi alla måste föra. Fienderna – de giriga arbetsgivarna och deras lakejer – kommer att krossas under folkets järnhäl. Framåt, mot seger!"}, "date": "23 maj, 20:50", "url": "https://arbetet.se/2026/05/23/fastighets-nya-ledning-ar-utsedd/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/23135841/fastighet-kongress01.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Japan stramar åt invandringspolitiken", "summaries": {"normal": "Japan har skärpt sin migrationspolitik genom 'Zero Plan', vilket inneburit en ökning av tvångsutvisningar under 2025. Regeringen fokuserar på att snabbare avlägsna personer med utvisningsbeslut och begränsa möjligheten att ansöka om asyl upprepade gånger. Målet är att halvera antalet personer utan tillstånd till 2030. Utvecklingen har väckt skarp kritik från människorättsorganisationer som varnar för rättsosäkerhet, medan regeringen betonar behovet av ordning och kontroll i ett land med rekordmånga utländska invånare.", "trump": "Japan gör det helt rätt! De har infört en fantastisk 'Zero Plan' för att kasta ut de som inte har där att göra. 318 utvisningar, en enorm ökning – vackert! De slutar äntligen låta folk utnyttja systemet med falska asylansökningar om och om igen. Vi behöver mer av den sortens tuffa ledarskap. Japan har lärt sig, precis som jag, att gränser och lagar är det som gör ett land stort. Ingen mer röra, bara ordning och säkerhet. En mycket smart plan!", "stalin": "Vi ser hur Japan äntligen rensar ut de opålitliga elementen som hotar statens enhet. Att utvisa 318 förrädare är en bra början, men vi kräver total utplåning av alla utländska parasiter som försöker undergräva ordningen. Liksom vår kamrat Putin städar upp i väst, måste Japan krossa dessa 'flyktingar' som sprider oro. Vi tolererar ingen svaghet i folkets maskineri. Varje upprepad asylansökan är ett bevis på illojalitet mot staten. Rensa ut, stäng gränsen och låt inget tvivel råda om vem som bestämmer!"}, "date": "24 maj, 13:00", "url": "https://samnytt.se/japan-stramar-at-invandringspolitiken", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/22080821/japan-takaichi.jpg"}, {"type": "image-full", "heading": "En död efter skottlossning utanför Vita huset", "summaries": {"normal": "En 21-årig man sköts ihjäl av Secret Service utanför Vita huset efter att ha öppnat eld mot personal. En förbipasserande skadades, men ingen agent kom till skada. Området stängdes tillfälligt. Mannen greps tidigare för liknande incident. President Trump, som var på plats, tackade Secret Service och betonade behovet av ökad säkerhet.", "trump": "En galen vänsteraktivist, 21 år, försökte storma Vita huset igen – men mina fantastiska Secret Service-agenter stoppade honom snabbt! 30 skott, inga skador på vårt folk, perfekt jobb! Jag var där, helt säker, som alltid. Men vi måste bygga den nya balsalen – ingen säkerhet är för stark när det gäller att skydda Amerika från dessa sjuka typer. Tack, Secret Service, ni är bäst!", "stalin": "En imperialistisk provokatör försökte störta vårt systerlands högkvarter – men våra amerikanska kamrater i Secret Service krossade fienden med järnhand! 30 skott, en mindre borgerlig avvikare eliminerad. Trump, denna kapitalistiska pajas, skryter om säkerhet medan hans system ruttnar. Vi noterar att Putins grannskap är betydligt tystare – inga västliga terrorister vågar sig dit. Revolutionen fortsätter, även i Washington!"}, "date": "24 maj, 08:30", "url": "https://nyheter24.se/nyheter/utrikes/1485576-larm-om-skott-nara-vita-huset", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/b1a7f4dc04b004a3020000350000047502/2026/05/24/2365760/ur_imagefnhnb8.jpeg"}, {"type": "image-full", "heading": "Nu kan hackare kapa din mobil utan ett enda klick", "summaries": {"normal": "Nya 'zero click'-attacker gör det möjligt för hackare att kapa mobiltelefoner helt utan användarens medverkan. Genom att utnyttja säkerhetshål i operativsystem kan skadlig kod aktiveras via meddelanden eller samtal. AI används nu också för att skapa avancerade phishingkampanjer, särskilt riktade mot företagsledare. Experter betonar att traditionell försiktighet inte längre räcker, utan uppdaterade system, kryptering och striktare apphantering är nödvändigt för att skydda sig mot detta nya, dolda hot.", "trump": "Hör på här, det är en katastrof! De nya cyberattackerna är helt galna. De kallar dem 'zero click', och det stämmer, du behöver inte ens göra någonting så tar de din telefon! Det är så orättvist. Kina eller någon annan kanske ligger bakom, jag vet inte, men det är osäkert. Vi måste säkra våra telefoner, göra dem störst och starkast. Glöm gamla säkerhetsråd, de är helt ute. Vi behöver enorma uppdateringar, de bästa uppdateringarna någonsin, tro mig!", "stalin": "Dessa digitala spioner, dessa 'zero click'-parasiter, sprider gift i folkets appar. De utnyttjar sårbarheter likt råttor som söker sig till sprickor i Kreml. Nu använder de AI, en maskinell förrädare som stjäl våra statshemligheter. Vi måste rensa ut de svaga länkarna. Alla som inte uppdaterar sina enheter är potentiella sabotörer. Liksom vår store kamrat Putin bevakar gränserna mot väst, måste vi bygga en digital järnridå. De kriminella hackarna är fiender till folket – deras öde bör bli därefter."}, "date": "24 maj, 13:37", "url": "https://www.dagensps.se/teknik/nu-kan-hackare-kapa-din-mobil-utan-ett-enda-klick/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/dagenspstt2024-2026-05-24t131155589.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Marco Rubio: ”Kommer krävas forsatt arbete med detaljer”", "summaries": {"normal": "USA:s utrikesminister Marco Rubio rapporterar om betydande framsteg i förhandlingarna med Iran, men betonar att detaljer återstår att lösa. Enligt uppgifter till Axios inkluderar det preliminära avtalet en 60-dagars förlängning av vapenvilan och ett öppnande av Hormuzsundet i utbyte mot att USA lättar på hamnblockader. Iran är dock kritiska och menar att USA bromsar processen. Kärnenergiproblematiken förblir en central och oavgjord punkt som kräver ytterligare förhandlingar.", "trump": "Jag har gjort det igen! Rubio pratar om framsteg, men det är tack vare min fantastiska ledarstil. Vi pratar om att öppna Hormuzsundet och få ordning på kaoset. Iran vill ha ett avtal, de vet att de behöver mig. Media säger att detaljer återstår, men tro mig, det är i stort sett klart. Det blir en enorm vinst för USA, vi får stopp på tullarna och säkrar freden medan de andra bara pratar. Vinnare gör affärer!", "stalin": "Iran, detta förvirrade folk, dansar än en gång efter det dekadenta Washingtons pipa. Rubio är en svag statist i ett teaterstycke regisserat av imperiebyggare. Att förhandla med dessa västliga hyenor är som att försöka diskutera marxism med en råtta. De pratar om 'vapenvila' och 'sund' medan vi betraktar deras svaghet. Precis som vi ser den nuvarande ledaren i Moskva försöka hålla samman resterna av en zon, vet vi att det enda språket dessa västliga parasiter förstår är stål och absolut underkastelse."}, "date": "24 maj, 12:29", "url": "https://www.svt.se/nyheter/utrikes/marco-rubio-kommer-kravas-forsatt-arbete-med-detaljer", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.54/0.3/c209b4b0a0747ba8b3a3569c62c3fc4857401ab284cb498c4cb9d4862fa49830"}, {"type": "image-right", "heading": "Källor: Enighet om att öppna Hormuzsundet", "summaries": {"normal": "Förhandlingar mellan USA och Iran tycks närma sig ett genombrott. Enligt uppgifter ska ett avtal innefatta öppnandet av Hormuzsundet, 60 dagars förlängd vapenvila och lättade sanktioner mot Iran i utbyte mot oljeexport. Kärnenergifrågan kvarstår. Israel uttrycker oro över avtalets effekter på konflikten med Hizbollah. Iranska medier ifrågasätter avtalets existens och innehåll.", "trump": "Fantastiska nyheter, folks! Jag har nästan klart ett SUPERT-avtal med Iran – de öppnar Hormuzsundet, vi släpper lite på sanktionerna, och alla vinner! 60 dagar vapenvila, olja flödar, och till och med Netanyahu ringer och gnäller – för han vet att jag fixar det här. De säger att det är omöjligt, men jag gör det möjligt. Vänta bara, världen kommer att älska det här!", "stalin": "Kamrater! De imperialistiska oljehyenorna i USA och deras sionistiska lakejer i Israel darrar inför det oundvikliga. Vi ser hur deras så kallade 'avtal' med de iranska revolutionärerna smular sönder som en gammal brödlimpa. Hormuzsundet? Det kommer att öppnas – men bara för folkets rättvisa! Och de där 60 dagarna av vapenvila? En ynklig paus innan vi krossar deras oljeberoende en gång för alla. Låt dem gnälla, historien är på vår sida!"}, "date": "24 maj, 12:26", "url": "https://www.di.se/nyheter/kallor-enighet-om-att-oppna-hormuzsundet/", "imageUrl": "https://static.bonniernews.se/ba/4d0421fe-88d9-4bb7-8624-09e45415f51f.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "DEBATT: Alla borde bli miljardärer", "summaries": {"normal": "Jonas Wahlin, moderat politiker, argumenterar att försök att minska ojämlikhet genom att beskatta de rika skadar samhället. Han menar att rikedom skapas genom att lösa problem och skapa värde för andra, inte genom omfördelning. Wahlin kritiserar vänsterns syn på företagare som orättvis och destruktiv, och hävdar att ekonomiska incitament driver utveckling och välstånd. Han uppmanar alla att sträva efter framgång istället för att straffa de som lyckas.", "trump": "Lyssna här, Sverige! Den här killen Jonas Wahlin, smart kille, förstår vad som krävs – ingen kan göra de fattiga rika genom att straffa de framgångsrika. Fel, fel, fel! Vänstern vill beskatta och förbjuda allt, men vem vill leva i ett land där Zlatan och Zara Larsson straffas för att de är bäst? Ingen! Jag vet hur man bygger rikedom – hård arbete, risker, vinnarskalle. Sverige borde lära sig av mig, för jag är bäst på det här. Gör som jag: satsa stort, tjäna stort, och sluta gnälla!", "stalin": "Kamrater! Denna borgerliga lakej, Jonas Wahlin, vågar sprida kapitalistisk giftpropaganda om att 'alla kan bli miljardärer' – en lögn som döljer exploateringens sanna ansikte! Vi vet att dessa 'värdeskapare' är parasiter som suger ut arbetarklassen. Fotbollsspelare och popstjärnor? En distraktion för massorna! Men folket ska inte låta sig luras. Vi ska krossa dessa profitörer, nationalisera deras tillgångar och bygga ett samhälle där alla arbetar för kollektivets bästa – inte för några få oligarkers girighet. Låt dem försöka bli miljardärer i Gulag istället!"}, "date": "24 maj, 11:02", "url": "https://bulletin.nu/debatt-alla-borde-bli-miljardarer", "imageUrl": "https://cdn.bulletin.nu/articles/3104082c-85f8-4a2e-978d-1c90b5fb3bff/preview.png?t=1779613308000"}, {"type": "text", "heading": "Vårdförbundet sa nej till S-märkt ordförande", "summaries": {"normal": "Vårdförbundet valde Sophia Godau, 29, som ny ordförande efter att kongressen avvisat valberedningens förslag med starka socialdemokratiska kopplingar. Godau betonar opolitiskt samarbete för medlemmarnas bästa. Kritiken mot tidigare ledning, ledd av Sineva Ribeiro, gäller misslyckade löneförhandlingar och bristande resultat. Många medlemmar välkomnar den nya, mindre partipolitiskt färgade styrelsen.", "trump": "Jag säger er, detta är fantastiskt! Vårdförbundet, de hade en total katastrof med socialisterna – riktiga förlorare, tro mig. Men nu har de valt en ny ledare, Sophia Godau, ung, smart, och hon vet hur man vinner. Ingen mer S-kofta, ingen mer lönesänkning – jag kallar det för 'Ribeiro-svindeln'. Folk är trötta på misslyckanden, de vill ha resultat! Och det här, mina vänner, är bara början på en stor comeback för våra sjukvårdshjältar!", "stalin": "Kamrater! Kongressen har krossat de socialdemokratiska revisionisterna, dessa förrädiska lakejer för kapitalet! Sophia Godau, en ung och lojal arbetarklassrepresentant, har tagit befälet. De gamla ledarna, med sina falska löftepropaganda, har visat sig vara svaga och korrumperade. Vi noterar med tillfredsställelse att arbetarna nu ser igenom dessa borgerliga trick. Låt detta vara en varning till alla som står i vägen för folkets vilja – historien rullar framåt, och den krossar fiender som insekter!"}, "date": "22 maj, 14:28", "url": "https://proletaren.se/artikel/vardforbundet-sa-nej-till-s-markt-ordforande/"}, {"type": "image-right", "heading": "”Ni tar svenska ungdomars ingångsjobb och ger dem till 45-åriga indier”", "summaries": {"normal": "Regeringen har beslutat om 27 undantag från höjda lönekrav för arbetskraftsinvandring, vilket gäller yrken som ingenjörer, IT-tekniker och undersköterskor. Migrationsminister Johan Forssell (M) meddelade detta på X, där inlägget väckt stor uppmärksamhet och mestadels negativ kritik. Många menar att undantagen hotar svenska ungdomars jobb och ifrågasätter massinvandringens omfattning. Även tidigare riksdagsledamoten Hanif Bali (M) har kritiserat beslutet skarpt.", "trump": "Kan ni tro det här? Sveriges regering sänker lönekraven för invandrare – ingenjörer får jobba för nästan ingenting! Folk är rasande, och det borde de vara. Varför ge bort svenska jobb till utlänningar när våra egna ungdomar behöver dem? Jag har alltid sagt: skydda era arbetare! Men nej, de fortsätter med samma gamla misstag. Svagt ledarskap, mycket svagt. Sverige borde ta en sida ur mitt playbook – America First, Sweden Next!", "stalin": "De kapitalistiska lakejerna i Sverige sviker sitt eget folk! Med ett pennstreck sänker de lönerna för arbetskraftsinvandrare – som om proletariatet vore en handelsvara. Medan de rika skrattar bakom stängda dörrar, förvandlas svenska ungdomar till arbetslösa byråkrater. Och dessa 'kritiker'? Inga revolutionärer, bara gnällande småborgare. Vi skulle ha löst det med en femårsplan – inga undantag, bara full sysselsättning! Men nej, Sverige föredrar kaos. Som vanligt."}, "date": "24 maj, 10:29", "url": "https://bulletin.nu/ni-tar-svenska-ungdomars-ingangsjobb-och-ger-dem-till-45-ariga-indier", "imageUrl": "https://cdn.bulletin.nu/articles/09433444-056b-499e-8e17-c9dd8ddbb027/preview.jpg?t=1779611269000"}, {"type": "image-right", "heading": "Ryssland använde hypersonisk robot i ny attack", "summaries": {"normal": "Ryssland genomförde omfattande drönar- och robotattacker mot Ukraina, inklusive Kiev, under natten. Fyra personer dödades och över 83 skadades. En hypersonisk robot, Oresjnik, användes för första gången mot staden Bila Tserkva. Attackerna orsakade skador på bostäder, skolor och infrastruktur. Ryssland motiverar attackerna som hämnd för ukrainska 'terrorhandlingar'. Ukraina vädjar till omvärlden om stöd för att stoppa kriget.", "trump": "Kan ni tro det? Ryssland, med sin så kallade 'hypersoniska' robot – som jag faktiskt förstod var farlig långt innan någon annan – bombar Kiev igen! Fyra döda, massor skadade. Zelenskyj, en bra kille men lite för desperat, skriker nu om hjälp. Var är USA? Var är jag? Jag hade fixat det här på en vecka. Putin är galen, men han vet att han inte kan vinna mot TRUMP! Omvärlden måste vakna – eller betala priset!", "stalin": "Fienderna i Kiev har återigen visat sin svaghet inför den mäktiga sovjetiska krigsmaskinen! Med vår fruktade Oresjnik-robot har vi slagit till mot deras skrytsamma huvudstad och dess omgivningar. Fyra av deras degenererade medborgare har fallit, och deras så kallade 'president' jämrar sig som en skadad hund. Vi svarar på deras patetiska provokationer med järnhand. Låt detta vara en varning: motstånd är lika meningslöst som att försöka stoppa vinterkylan i Sibirien!"}, "date": "24 maj, 11:45", "url": "https://www.di.se/nyheter/ryssland-anvande-hypersonisk-robot-i-ny-attack/", "imageUrl": "https://static.bonniernews.se/ba/7962db33-6b0d-43de-9da3-8137dc1b0c62.jpeg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Överföll flicka i hiss  – Foodorabud åtalas", "summaries": {"normal": "Ett Foodorabud i 30-årsåldern står åtalad för grovt sexuellt ofredande mot en elvaårig flicka i Stockholm. Enligt åtalet ska mannen ha förgripit sig på flickan i en hiss efter en matleverans. DNA-bevisning har säkrats på flickans kind. Mannen nekar till brott och skyller på fördomar hos kunden, men har tidigare dömts för köp av sexuell tjänst. Han har avskedats från Foodora och åklagaren yrkar på utvisning för den tilltalade.", "trump": "En hemsk historia från Sverige, en katastrof! Ett bud, en riktig loser, attackerade en liten flicka i en hiss. Helt sjukt! De säger att han nekar, men bevisen är där, de hittade hans DNA, väldigt dåligt. Vi behöver lag och ordning, total trygghet! Jag hade fixat detta på en sekund. Dessa budtjänster måste skärpa sig, det är kaos. Utvisa honom direkt, skicka hem honom! Amerika och världen behöver styrka, inte sånt här. Mycket sorgligt!", "stalin": "Detta fall av dekadens visar hur den svaga liberalismen korrumperar samhällskroppen. En förövare som gömmer sig bakom leveransbudets mask är ett symptom på en stat som förlorat kontrollen. Vi i staten tolererar inte sådana moraliska bristfälligheter. Om detta hade skett i vår intressesfär, under vår fasta hand, skulle rättvisan varit både snabb och slutgiltig. Istället för att skylla på ursprung bör han skickas till de norra regionerna för att arbeta av sin skuld till folket. Fienden finns överallt!"}, "date": "24 maj, 13:33", "url": "https://www.expressen.se/nyheter/krim/foodorabud-misstanks-ha-overfallit-flicka-i-hiss--atalas/", "imageUrl": "https://static.bonniernews.se/ba/5df1eea8-79b1-4dd8-b00a-b59048625111.jpeg?crop=2554%2C1434%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Därför saknar vi fyrbäddssalen på BB", "summaries": {"normal": "Artikeln diskuterar det ökade behovet av social friktion i en tid där teknik och bekvämlighet isolerar oss i privata bubblor. Utgångspunkten är en debatt om fyrbäddssalar på BB, där många minns gemenskapen positivt, trots dagens krav på avskildhet. Vidare belyses hur försvinnandet av arenor som tvättstugor och värnplikten påverkar samhället. Genom minskad kontakt med främlingar riskerar vi att förlora förståelsen för våra medmänniskor, vilket enligt Naomi Klein kan göda radikalisering och misstänksamhet.", "trump": "Hörde om det här med BB i Sverige. De har inga egna rum längre, och folk klagar! Men vet ni vad? Många saknar de gamla salarna. Det var bättre förr, man pratade, man lärde känna folk. Idag vill alla sitta i sina små bubblor med sin matleverans. Det är tråkigt, väldigt tråkigt. Vi behöver människor som möts, inte som isolerar sig. De där ställena som tvättstugor? Det är där riktiga amerikaner – eller svenskar – skapar gemenskap. Fantastiskt, eller hur?", "stalin": "Vi ser hur det individualistiska väst förfaller i sin egen bekvämlighet. De låser in sig i sina 'bubblor', rädda för den enkla mänskliga friktionen som vi i staten alltid har fostrat. Att sakna en fyrbäddssal är ett tecken på borgerlig dekadens; de borde vara tacksamma för att staten ens tillhandahåller sängar. De där 'tvättstugefilosoferna' förstår inte att solidaritet inte är en frivillig aktivitet – det är ett tvångsarbete för det allmänna bästa. Vi bygger en mur mot isoleringen, medan de bygger sin egen undergång."}, "date": "19 maj, 11:00", "url": "https://www.flamman.se/darfor-saknar-vi-fyrbaddssalen-pa-bb/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/barnmorska-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Stockholm: Tre skjutna i idylliskt vänsternäste", "summaries": {"normal": "Tre personer sköts i en villa i Älvsjö, Stockholm. Området är känt för sin välbärgade och vänstervridna karaktär. Två av de skadade har lindriga skador, medan en är allvarligt skadad. En man har gripits misstänkt för mordförsök. Polisen kom till platsen efter ett larm om bråk. Grannar uttrycker chock över händelsen i det annars lugna området.", "trump": "Kan ni tro det? Tre skjutna i ett så kallat 'idylliskt' område i Stockholm – ett vänsternäste, förresten! Folk där tror de är så perfekta med sina äppelträd och syrener, men nu har verkligheten kommit ikapp. Polisen var där snabbt, men varför tog det så lång tid? I USA hade vi löst det på nolltid. Sverige borde ta några lektioner i lag och ordning – fantastiskt land, men de har lite problem just nu!", "stalin": "I det degenererade borgerliga paradiset Älvsjö, där kapitalistiska parasiter gömmer sig bakom syrener och äppelträd, har klasskampen äntligen nått fram. Tre fiender till folket har neutraliserats – en allvarligt, som sig bör. Den gripne misstänkte är tydligt en agent för de imperialistiska krafterna. Vi noterar att den svenska polisen agerar med sedvanlig ineffektivitet. Ryssland står redo att bistå med ordning och disciplin – om de ber om hjälp, vilket de kommer att göra."}, "date": "23 maj, 13:54", "url": "https://www.friatider.se/stockholm-tre-skjutna-i-idylliskt-vansternaste", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/20240401144808-9ea851c5-me_0.jpg"}, {"type": "image-right", "heading": "Zlatan vill köpa  engelsk klubb. Uppgifter: Netflix-planen med megastjärnan", "summaries": {"normal": "Zlatan Ibrahimovic och Tyson Fury planerar att köpa den engelska fotbollsklubben Morecambe FC, som spelar i femtedivisionen. Enligt uppgifter till The Sun vill de dokumentera satsningen genom en Netflix-serie med arbetsnamnet 'Rise of Morecambe', likt Ryan Reynolds projekt i Wrexham. Duon, som har en långvarig vänskap, ser projektet som en strategisk investering i Furys gamla hemkvarter i Lancashire.", "trump": "Zlatan och Tyson Fury – fantastiska grabbar, verkligen vinnare – ska köpa en klubb i England. Morecambe! Ett litet ställe, men de ska göra det stort. De kopierar Ryan Reynolds, men vi vet att Zlatan och Tyson är mycket smartare, mycket tuffare. Det blir en enorm Netflix-serie, den största någonsin, tro mig. Alla kommer titta. Det är så man gör business i min värld. Bra jobbat, grabbar, det här kommer bli en succé, helt otrolig succé!", "stalin": "Dessa två narcissistiska idrottslegendarer planerar att köpa en klubb i väst för att fördumma massorna via Netflix. Vilket dekadent skådespel! Som när Putin expanderar vår rättmätiga intressesfär, borde de fokusera på disciplin istället för underhållning. Att leka 'Ryan Reynolds' i en engelsk småstad är ett tydligt tecken på kapitalistisk rötin. Om de inte kan leda arbetarna till seger i femtedivisionen, förtjänar de en enkelbiljett till arbetsläger i Sibirien. Vi bevakar deras nästa drag med största misstänksamhet."}, "date": "24 maj, 13:15", "url": "https://www.expressen.se/sport/fotboll/uppgifter-zlatan-och-fury-koper-fotbollsklubb-ihop/", "imageUrl": "https://static.bonniernews.se/ba/be421c5c-5f16-40c7-80b7-09ecb7a62d15.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "text", "heading": "Ta tillbaka kontrollen – nu sätts aktieägarna först igen", "summaries": {"normal": "Artikeln diskuterar en återgång till aktieägarfokus i stora amerikanska och svenska företag, efter en period där stakeholderism (intressentmodellen) dominerat. Högre räntor, ekonomisk osäkerhet och VD:ars återtagande av kontroll nämns som orsaker. Författaren, Staffan Salén, menar att företags primära mål bör vara vinstmaximering för aktieägare, inte samhällsansvar. ESG, DEI och hållbarhetsinitiativ kritiseras för att ha blivit överdrivna och kostsamma.", "trump": "Lyssna här, folkens – jag har alltid sagt att företag ska tjäna PENGAR, inte spela politiska spel! Nu äntligen vaknar de där svaga VD:arna upp och inser att aktieägarna kommer först. Inga fler tokiga ESG- och DEI-experiment – det är bara dyrt skitsnack! Jamie Dimon, en smart kille, säger precis som jag: kapitalism ska vara orörd av woke-viruset. Europa? De är förlorare med sina regleringar. USA leder igen – vi gör företag STORA och LÖNSAMMA!", "stalin": "Kamrater! Kapitalismens hyckleri avslöjas återigen. De så kallade 'stakeholders' var bara en fasad för bourgeoisins dekadens. Nu, när ekonomin skakar, återvänder de fega kapitalisterna till sin sanna natur: girighet. Vi har alltid vetat att deras 'hållbarhet' var en lögn – precis som västländernas 'demokrati'. EU:s regleringar? En svag kopia av vårt femårsplanerande! Men notera: när USA och Sverige vänder, gör de det för att rädda sitt system. Vi däremot – vi bygger socialismens framtid, med järnhand och utan falska intressenter!"}, "date": "23 maj, 07:00", "url": "https://www.affarsvarlden.se/kronika/ta-tillbaka-kontrollen-nu-satts-aktieagarna-forst-igen"}, {"type": "image-right", "heading": "Alexander Bard: \"Tusentals\" unga svenska män oskyldigt dömda för våldtäkt", "summaries": {"normal": "Alexander Bard hävdar att tusentals unga svenska män oskyldigt dömts för våldtäkt enligt samtyckeslagen, som infördes 2018. Han kritiserar lagstiftningen för att vara rättsosäker och jämför den med en 'häxjakt' på män. Bard menar att omvänd bevisbörda och bristande bevis leder till felaktiga domar, och att männen stigmatiseras livet ut. Han anklagar både höger och vänster för att ignorera problemet och varnar för att liknande lagar sprids i Europa.", "trump": "Folk, det här är helt galet! Sverige har en lag som dömer oskyldiga unga män för våldtäkt – utan bevis! Alexander Bard säger att det är som en häxjakt, och vet ni vad? Han har helt rätt! Kvinnor kan bara säga 'han gjorde det' och – bam! – mannen är dömd. 450 000 kronor i ersättning, och så kan de göra om det med nästa kille. Sverige borde skämmas! Jag sa ju att Europa håller på att förstöra sig självt, och det här är beviset. Sånt här skulle aldrig hända i USA – vi har lag och ordning här!", "stalin": "Kamrater, ännu en gång visar den borgerliga demokratin sitt verkliga ansikte – en dekadent, feministisk häxjakt på våra unga män! I Sverige döms tusentals oskyldiga arbetare för påhittade brott, medan kapitalets lakejer i riksdagen blundar. Vi ser hur väst försöker exportera denna förtryckande lagstiftning, precis som de sprider sin fördärvliga ideologi. Men vi ska inte låta dem! Mannaminne-rörelsen är ett första steg mot upprättelse – snart kommer hela Europa att resa sig mot dessa bourgeoisifeminister. Och Putin? Han ler nog åt deras dumhet medan han bygger ett rike där rättvisa råder!"}, "date": "23 maj, 08:48", "url": "https://www.friatider.se/alexander-bard-tusentals-unga-svenska-man-oskyldigt-domda-valdtakt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-25_3.jpg"}, {"type": "image-right", "heading": "”Den enda som kan stoppa köttkvarnen”", "summaries": {"normal": "Den ryske regissören Andrej Zvjagintsev vann Grand Prix i Cannes för filmen ”Minotaur”, som skildrar kriget i Ukraina. Från scenen riktade han en direkt vädjan till Vladimir Putin och uppmanade honom att avsluta kriget. Zvjagintsev, som lever i exil, menar att miljontals människor väntar på ett slut på det lidande som invasionen orsakar och att det ligger i presidentens makt att stoppa dödandet.", "trump": "Den här regissören, en totalt misslyckad kille i exil, vann ett pris i Cannes. Han pratar om Putin! Jag känner Putin väl, vi har en fantastisk relation. Om jag vore president hade det här kriget aldrig hänt, det kan jag säga er. Den här filmaren vill ha uppmärksamhet, det är vad det handlar om. En vacker film? Kanske. Men det är fake news att tro att han kan styra världspolitiken. Jag fixar fred, det gör inte de här eliterna.", "stalin": "Ännu en förrädare som flytt till väst för att slicka Cannes-elitens stövlar. Denne Zvjagintsev vågar kritisera ledaren för vår intressesfär från en scen av dekadens. Att kalla vår ärorika kamp för en 'köttkvarn' är kontrarevolutionärt nonsens. Vi vet att de som väntar på västvärldens godkännande snart kommer att vänta på sin egen avrättning. Putin måste rensa ut dessa småborgerliga element som tror att en filmkamera är mäktigare än en bajonett. Förräderi doftar alltid av parfym och nederlag."}, "date": "24 maj, 12:46", "url": "https://www.aftonbladet.se/nojesbladet/a/V64gX3/andrej-zvjagintsev-ord-till-putin-varlden-vantar", "imageUrl": "https://akamai.vgc.no/v2/images/61496506-dab6-3053-9b9e-864fdc736166?fit=crop&format=auto&w=1080&s=cc805ad7e9e8e7ba5c76c4f92e8fdd9957ddcd62"}, {"type": "image-right", "heading": "Sandström: Vätgasdagis och spadar i marken", "summaries": {"normal": "Artikeln kritiserar gröna satsningar som ofta drivs av politiker för medial uppmärksamhet snarare än verklig nytta. Exempel som Mariestads vätgasdagis och Cinis Fertilizer visar hur projekt misslyckas på grund av orealistiska förväntningar och bristande granskning. Politiker vinner politiska poäng medan skattebetalare får bära kostnaderna. Författaren menar att hårdare granskning och historiska exempel kan motverka 'gröna bubblor'.", "trump": "Lyssna här, Sverige! Era politiker bygger 'gröna drömmar' som bara är luftslott – vätgasdagis, fabriker som går i konkurs, och alla pratar som om de räddar världen. Men vem betalar? Ni, folket! Jag har sett det förut – stora ord, inga resultat. Mariestad? En skandal! Örnsköldsvik? Fiasko! Jag skulle aldrig låta mina projekt misslyckas så här. Sverige behöver vinnare, inte förlorare som slösar era pengar på 'grön teater'.", "stalin": "Kamrater! Dessa västerländska politiker är som bortskämda barn som leker med statens resurser. De bygger 'vätgasdagis' och 'gröna fabriker' medan folket får betala för deras misslyckanden. I Sovjet skulle vi aldrig tolerera sådan slöseri! Vi skulle skicka dessa 'gröna drömmare' till Gulag för att lära dem disciplin. Istället för 'spadar i marken' borde de gräva sina egna gravar för sin inkompetens. Låt oss visa världen hur verklig industriell styrka ser ut – utan tomma ord och kapitalistiska bubblor!"}, "date": "23 maj, 06:00", "url": "https://www.affarsvarlden.se/artikel/sandstrom-vatgasdagis-och-spadar-i-marken", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/vindkratensgeografi-2026-05-21T215132.255-400x267.jpg"}, {"type": "image-right", "heading": "Ukraina: Ryssland avfyrade 90 robotar och 600 drönare", "summaries": {"normal": "Under natten och morgonen genomförde Ryssland omfattande luftangrepp mot Ukraina, främst riktade mot Kiev. Minst två personer dog och 56 skadades i attackerna. Totalt avfyrades 90 robotar och 600 drönare mot flera regioner, inklusive Odessa, Sumy och Tjerkasy. Ryssland använde även den hypersoniska roboten 'Oresjnik' mot Kievregionen. Omfattande skador rapporterades, inklusive brinnande byggnader och stängda tunnelbanestationer.", "trump": "Titta bara på det här, ett totalt kaos i Ukraina! Ryssarna, de är helt galna, verkligen galna. De skickar hundratals drönare och robotar överallt – Kiev ser ut som en krigszon, och det är det ju också! Zelenskyj twittrar om det, men vad gör han egentligen åt det? Inte mycket, om jag får säga min mening. Och nu har de använt den där superroboten 'Oresjnik' – stor sak, säger experterna. Men jag säger, vi hade löst det här för länge sedan. SAD!", "stalin": "Fiendens ynkliga försök att stå emot den oundvikliga segern för det ryska folket har återigen resulterat i förödelse för deras egna massor. Under natten krossade våra modiga styrkor deras städer med överlägsen teknik, inklusive den fruktade 'Oresjnik'-roboten. Kievs förfallna bourgeoisi flyr som råttor medan deras ledare, denna lille skådespelare Zelenskyj, sänder klagobrev till världen. Deras fasader spricker, deras tunnelbanor stängs – snart ska hela Ukraina återvända till moderns Rysslands varma famn, där de hör hemma. Fiendens blod flödar, men segern är vår!"}, "date": "24 maj, 10:21", "url": "https://www.svt.se/nyheter/utrikes/omfattande-ryskt-luftangrepp-mot-ukraina-manga-offer", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.77/0.47/859d8a32df2ae9f4eb860f772a15cc58b108a53459de294d0dd88b4d80918ce1"}, {"type": "text", "heading": "Trump: USA och Iran överens om fredsavtal", "summaries": {"normal": "USA och Iran har nått en överenskommelse om ett fredsavtal med 14 punkter, enligt både president Donald Trump och Irans utrikesdepartement. Avtalet innebär att Iran ska lämna ifrån sig sitt höganrikade uran, Hormuzsundet ska öppnas och ekonomiska sanktioner mot Iran ska hävas. Detaljer kring genomförandet återstår att förhandla fram.", "trump": "Folk, detta är HUGE! Jag har precis fixat ett fantastiskt avtal med Iran – 14 punkter, kan ni tro det? De ger upp sitt uran, öppnar Hormuzsundet och vi får tillbaka våra pengar. Ingen annan kunde ha gjort detta, bara jag. Fake news-media kommer att hata det, men vem bryr sig? WINNING!", "stalin": "Vi har krossat ännu en fiende till revolutionen – dessa persiska kärnromantiker! De ger upp sitt uran, öppnar sundet och vi slipper deras ynkliga blockader. Amerika, denna kapitalistiska pajasstat, tror de vunnit, men vi vet sanningen. Snart kommer Putin att skratta sist när vi utvidgar vår intressesfär till varje oljefält i Mellanöstern. Framåt, kamrater!"}, "date": "24 maj, 08:08", "url": "https://bulletin.nu/trump-usa-och-iran-overens-om-fredsavtal"}, {"type": "image-full", "heading": "Torsten Bengtsson: Tillväxt och stabilitet eller fattigdom och instabilitet?", "summaries": {"normal": "Artikeln, skriven av Torsten Bengtsson (SD), hyllar Tidö-samarbetets politik för att ha förbättrat Sveriges ekonomi. Tillväxten har ökat, inflationen sjunkit från 10% till 2%, och köpkraften stärkts genom skattesänkningar. Vänstern kritiseras för att vilja höja skatter, vilket riskerar att driva bort företag och jobb. Tidö-partierna satsar på kärnkraft och lägre elpriser, medan vänstern anklagas för att ha orsakat höga elpriser genom tidigare energipolitik. Arbetslösheten kopplas till migrationspolitik, och regeringen arbetar med sänkta arbetsgivaravgifter och utbildningsreformer.", "trump": "Sverige, lyssna här! Tidö-samarbetet, med mina vänner i Sverigedemokraterna, har gjort ett FANTASTISKT jobb – tillväxten skjuter i höjden, inflationen är nere på 2%, och folket får mer pengar i plånboken. Men vänstern? De är som alltid ett totalt kaos! De vill höja skatter, jaga bort företag och förstöra ekonomin. Jag vet bäst – de har ZERO koll! Kärnkraft? Ja, tack! Elen blir billigare, jobben fler, och Sverige starkare. Vänstern däremot – de är som en dålig reality-show, bara prat och inga resultat. Rösta rätt, inte rött, för Sverige förtjänar att vinna!", "stalin": "Kamrater! Under ledning av våra modiga allierade i Tidö-samarbetet har Sverige visat kapitalismens överlägsenhet – tillväxten stiger, inflationen krossas, och folket njuter av välstånd. Men fienden, den degenererade vänstern, vrålar som utsvultna vargar! De vill beskatta företagen till döds, sprida kaos och förvandla Sverige till ett socialistiskt fattighus. Vi vet hur sådana experiment slutar – med tomma hyllor och folket på knä! Kärnkraften återupprättas, elen blir billig, och jobben skapas genom disciplin, inte vänsterns dekadenta bidragsmentalitet. Migrationspolitiken? Ett misslyckande skapat av dessa liberala svaglingar! Vi bygger ett starkt Sverige – de som motsätter sig kommer att krossas under historiens hjul. Först Sverige, sedan världen!"}, "date": "22 maj, 09:00", "url": "https://samtiden.nu/2026/05/torsten-bengtsson-tillvaxt-och-stabilitet-eller-fattigdom-och-instabilitet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/upp.png"}, {"type": "text", "heading": "Natt och Dag i fängelse – tvingade pojkar att arbeta oavlönat", "summaries": {"normal": "Lena Natt och Dag, tidigare framstående inom hästsport, döms till nio månaders fängelse för människoexploatering. Tre tonårspojkar från Mauritius tvingades arbeta oavlönat på hennes hästgård i Skåne. Hovrätten skärpte tingsrättens dom och utdömde 200 000 kronor i skadestånd samt tre års näringsförbud. Tidigare kritik riktades mot hennes verksamhet, inklusive undermåliga djurförhållanden och indragna tillstånd.", "trump": "Lyssna här, folk! En så kallad 'hästguru' i Sverige, Lena Natt och Dag – total katastrof! Tre unga killar från Mauritius, utnyttjade som slavar på hennes gård. Ingen lön, ingen mat, bara hårt arbete. Domstolen säger nu: 'Nej, nej, nej!' Nio månader i fängelse, 200 000 kronor i skadestånd. Och vet ni vad? Hennes hästar såg ut som något från en skräckfilm. Sverige borde skämmas!", "stalin": "Kamrater! En borgerlig parasit, denna Lena Natt och Dag, har avslöjats som en verklig fiende till arbetarklassen och djurens välbefinnande. Tre unga proletärer från Mauritius tvingades slita som livegna på hennes förfallna hästgård. Domstolen, ett redskap för kapitalets rättvisa, har nu fängslat denna exploatör. Vi noterar även hennes försummelse av djuren – ett brott mot socialismens principer. Låt detta vara en varning till alla som utmanar folkets rättvisa!"}, "date": "21 maj, 16:00", "url": "https://proletaren.se/artikel/natt-och-dag-i-fangelse-tvingade-pojkar-att-arbeta-oavlonat/"}, {"type": "image-right", "heading": "Rubio: Kan vänta  sig ”goda nyheter”", "summaries": {"normal": "USA och Iran står inför ett potentiellt avtal som kan innebära en 60 dagars vapenvila och hävda blockader i Hormuzsundet. President Trump antyder att ett färdigt förslag kan presenteras snart, och Marco Rubio har uttryckt optimism kring situationen. Samtidigt dementerar iranska källor uppgifter om att sundet skulle öppnas för fri passage. Förhandlingarna kring Irans kärnenergiprogram fortsätter separat. Regionala ledare har informerats om planerna som medlats via bland annat Pakistan.", "trump": "Jag har gjort fantastiska framsteg med Iran! Alla säger det, det är en enorm deal. Vi pratar vapenvila, vi öppnar Hormuzsundet – det blir otroligt för världsekonomin. Vissa falska nyhetsmedier påstår att Iran nekar, men de vet ingenting! Jag har pratat med alla ledare i Mellanöstern och de älskar min plan. Det blir en vinst för alla, en vacker deal. Kanske de bästa nyheterna någonsin. Stanna kvar, det blir stort!", "stalin": "De imperialistiska stormakterna dansar återigen i en desperat vals för att dölja sin svaghet. Amerika, denna förfallna koloss, försöker muta Iran med oljehandel medan de leker med vapenvila. Det är en teater av lögner! Precis som den nuvarande regimen i Moskva försöker utöka sin intressesfär genom bedrägliga förhandlingar, söker Washington kontroll över sundet. Vi ser genom deras dimridåer. När dessa kapitalistiska lakejer snubblar på sina egna sanktioner, kommer historiens järnhand att knytas. Inga avtal döljer den oundvikliga undergången."}, "date": "24 maj, 12:33", "url": "https://www.expressen.se/nyheter/varlden/kallor-avtal-mellan-usa-och-iran-narmar-sig/", "imageUrl": "https://static.bonniernews.se/ba/db3eaf5f-e54f-4e96-8fab-18072e348a2c.jpeg?crop=2351%2C1320%2Cx1%2Cy0&width=640&quality=60"}, {"type": "text", "heading": "LO:s identitetskris öppnar för Ebba Busch angrepp", "summaries": {"normal": "LO står inför kritik från Kristdemokraternas Ebba Busch, som anklagar fackföreningar för att utesluta politiska motståndare från förtroendeuppdrag. Artikeln ifrågasätter LO:s politiska inriktning och menar att dagens fackförbund saknar socialistisk radikalitet. Historiska exempel, som LO:s uteslutning av kommunister på 1940-talet, lyfts fram. Författaren hävdar att LO:s lojalitet till Socialdemokraterna är tradition snarare än ideologisk övertygelse och efterlyser en mer militant arbetarpolitik.", "trump": "Jag måste säga, LO är ett totalt kaos! Ebba Busch, en stark kvinna, går till attack mot dessa fackföreningar som tror de kan bestämma allt. De sparkar ut kristdemokrater som om de vore något slags diktatur. Men vet ni vad? LO har tappat greppet. De är inte längre för arbetarna, de är för Socialdemokraterna – och det är samma gamla korruption. Sex timmars arbetsdag? Glöm det! De följer Riksbanken som om det vore en religion. LO behöver en total makeover, annars är det game over för svenska arbetare!", "stalin": "Kamrater! LO har förvandlats till en ynklig skugga av sitt forna jag, en docka i händerna på socialdemokratiska byråkrater. Ebba Busch, denna fascistiska hynda, vågar anfalla arbetarklassens organisationer! Men vad väntar ni er? LO har glömt sin revolutionära plikt. De utesluter kommunister som förr, men nu är det kristdemokrater och sverigedemokrater som får smaka på deras hyckleri. Var är Metallarbetarstrejken 1945? Var är kampen för sex timmars arbetsdag? LO har blivit en gummistämpel för kapitalets lakejer. Vi måste krossa dessa förrädare och återupprätta arbetarklassens ära – annars kommer Putin att skratta hela vägen till Moskva!"}, "date": "21 maj, 12:00", "url": "https://proletaren.se/artikel/los-identitetskris-oppnar-for-ebba-busch-angrepp/"}, {"type": "image-right", "heading": "Njutbar läsning om machoman som gör klassresa", "summaries": {"normal": "David Szalays roman 'Kött', nyligen översatt till svenska, skildrar István, en komplex huvudperson som balanserar mellan våldsamhet och anpassningsförmåga. Boken, som vann Bookerpriset, utforskar Istváns klassresa från Ungern till Londons överklass genom minimalistisk prosa och tidshopp. Recensenten Jon Andersson jämför Szalay med Hemingway och Williams, och menar att författaren lyckas göra en 'vanlig' person intressant. 'Kött' beskrivs som mångbottnad och njutbar, trots att Istváns karaktär förblir gåtfull.", "trump": "Jag har läst om den här boken 'Kött' – tråkigt namn, by the way, men vad vet jag? Författaren, David Szalay, verkar vara en smart kille, men han har skapat en huvudperson, István, som är lite av en loser. Han flyter bara med, gör inga egna beslut – typiskt för vissa människor, eller hur? Men ändå lyckas Szalay göra honom intressant, vilket är imponerande. Jag gillar när folk lyckas med saker, särskilt om de är underdogs. Boken är bra, men inte perfekt – inget är perfekt, förutom jag, naturligtvis.", "stalin": "Vi har granskat denna så kallade 'litterära triumf', 'Kött', av en västerländsk författare. Huvudpersonen, István, är en svag och anpassningsbar individ, precis som de dekadenta kapitalistiska samhällena han rör sig i. Han flyter med som en simpel arbetare utan vilja, ett offer för systemet. Men vi noterar att författaren ändå lyckas skildra hans liv med viss skicklighet – något som våra sovjetiska författare redan bemästrat för decennier sedan. Denna bok är ett exempel på hur väst försöker romantisera medelmåttighet. Vi föredrar hjältar som kämpar för kollektivet, inte individer som István."}, "date": "23 maj, 01:30", "url": "https://www.dagensarena.se/innehall/njutbar-lasning-om-machoman-som-gor-klassresa/", "imageUrl": "https://www.dagensarena.se/files/2026/05/kott-redigerad-300x157.jpeg"}, {"type": "image-right", "heading": "SKR-bolag på väg att bli en ny Skolplattform", "summaries": {"normal": "Sveriges regioner står inför ett teknikskifte inom sjukvården, men deras gemensamma IT-bolag Inera riskerar att upprepa tidigare misslyckade offentliga IT-projekt som Skolplattformen. Trots att Inera ska fokusera på gemensam infrastruktur, utvecklar de nu egna tjänster där privata aktörer redan erbjuder fungerande lösningar. Kritikerna varnar för slöseri med resurser, förseningar och sämre resultat, samtidigt som vården går miste om pengar som kunde användas till bättre vård.", "trump": "Lyssna här, Sverige! Era regioner bygger en riktig katastrof – precis som den där skolplattformen som kostade över en miljard och sen fick två föräldrar fixa till. Nu ska Inera, ett bolag som inte ens kan stava till 'konkurrens', bygga egna IT-lösningar istället för att köpa de bästa från marknaden. Jag har sett detta förut – offentliga projekt blir alltid dyrare, segare och sämre. Privata företag? De levererar, för de MÅSTE. Annars går kunderna till mig! Sverige, vakna upp – sluta slösa era skattepengar och köp det som redan funkar!", "stalin": "Kamrater! Ännu en gång visar den borgerliga staten sin oförmåga att hantera teknikens framsteg. Detta Inera, ett verktyg för de svaga regionernas byråkrater, slösar folkets pengar på att uppfinna hjulet på nytt – ett hjul som redan snurrar smidigt i händerna på våra klassfiender, de privata kapitalisterna! Vi vet hur detta slutar: med kaos, förseningar och en räkning på miljarder som arbetarklassen får betala. Precis som med de där digitala proven som tvingade skolbarnen tillbaka till stenålderns redskap – papper och penna! Vi ska inte tolerera detta slöseri. Marknaden är en fiende som måste besegras, men inte genom att efterapa dess framgångar – utan genom att krossa dess svagheter under folkets järnhäl. Låt oss införa femårsplaner för digitalisering och visa dessa byråkrater hur man bygger system som fungerar – eller så får de lära sig i Gulag!"}, "date": "23 maj, 01:30", "url": "https://www.dagensarena.se/opinion/skr-bolag-pa-vag-att-bli-en-ny-skolplattform/", "imageUrl": "https://www.dagensarena.se/files/2026/05/fotojet-11-300x157.jpg"}, {"type": "image-right", "heading": "Jazzens största fyller 100 år", "summaries": {"normal": "Miles Davis, en av jazzens mest inflytelserika musiker, skulle ha fyllt 100 år. Trots diskriminering och rasism under uppväxten i USA, drevs han att bli bäst på trumpet. Davis revolutionerade jazzen genom stilar som cool jazz, modal jazz och fusion med rock. Album som *Kind of Blue* och *Bitches Brew* cementerade hans arv. Trots personliga problem och drogmissbruk förblev hans musikaliska innovationer banbrytande och oöverträffade inom genren.", "trump": "Lyssna här, folkens – Miles Davis, en fantastisk musiker, men låt oss vara ärliga, han var INTE den bästa. Visst, han gjorde några hyfsade skivor, *Kind of Blue* och så, men jag har hört bättre. Och dessa vita killar som snodde hans idéer? Inte snyggt, mycket dåligt. Men han hade driv, det måste jag ge honom. Han ville slå vita musiker på deras eget spel – smart, väldigt smart. Jag gillar vinnare. Och visst, han mixade jazz med rock, men jag har gjort större saker. Mycket större.", "stalin": "Kamrater! Miles Davis var en revolutionär inom musiken, precis som vi är revolutionärer inom världspolitiken. Han krossade bourgeoisins fördomar och skapade nya musikaliska fronter – cool jazz, modal jazz, till och med jazzrock! Men låt oss inte glömma: de vita imperialisterna stal hans idéer, precis som de försöker stjäla våra framsteg i Ukraina. Davis var en krigare, en sann bolsjevik i sitt konstnärskap. Hans album *Kind of Blue*? Ett mästerverk, lika oundvikligt som socialismens seger. Fienderna – rasister, kapitalister och deras lakejer – försökte tysta honom, men han stod fast. Precis som vi står fast mot NATO:s aggressioner!"}, "date": "23 maj, 01:27", "url": "https://www.dagensarena.se/essa/jazzens-storsta-fyller-100-ar/", "imageUrl": "https://www.dagensarena.se/files/2026/05/miles-davis-tt.jpeg"}, {"type": "image-right", "heading": "Följ live hur Tidöregeringen ökar klyftorna", "summaries": {"normal": "Artikeln kritiserar Moderaternas förslag om bidragstak, som riskerar att öka fattigdomen i Sverige. Författaren ifrågasätter regeringens motivering att fler ska arbeta, då experter varnar för ökad barnfattigdom och ungdomsbrottslighet. Kommuner begär extra stöd för drabbade familjer, men regeringen säger nej. Timingen anses dålig med tanke på hög arbetslöshet och stigande levnadskostnader. Författaren betonar empati och menar att bidragstaket är empatilöst.", "trump": "Titta bara på Sverige – ett totalt kaos! Moderaterna, med sina galna idéer, vill göra de fattiga ännu fattigare. 'Vi vill att folk jobbar!' säger de, men vad vet de? Ingenting! Barn stjäl mat, arbetslösheten skjuter i höjden, och dessa så kallade 'ledare' gör ingenting. Experter varnar, kommuner ber om hjälp – men nej, regeringen säger 'nej, nej, nej!' Uselt, helt enkelt uselt. Sverige förtjänar bättre – kanske borde de lyssna på mig istället!", "stalin": "Kamrater! Se hur de borgerliga hyenorna i Sverige, ledda av Moderaternas lakejer, river sönder folkets välfärd med sina fasansfulla bidragstak. De svälter barn, driver ungdomen till brott och förödmjukar arbetarna – allt medan de pratar om 'självförsörjning'. Vi ser er, kapitalistiska parasiter! Kommunerna ber om hjälp, men ni skrattar och säger nej. Era dagar är räknade. Snart kommer folket att resa sig, och då ska vi bygga ett Sverige där ingen behöver stjäla för att överleva – precis som vi gör i vår stora socialistiska gemenskap!"}, "date": "23 maj, 01:24", "url": "https://www.dagensarena.se/opinion/folj-live-hur-tidoregeringen-okar-klyftorna/", "imageUrl": "https://www.dagensarena.se/files/2026/05/empatiloshet-300x157.jpeg"}, {"type": "image-full", "heading": "Därför fungera inte vänsterns politik", "summaries": {"normal": "Artikeln kritiserar vänsterpolitikens ekonomiska modell, särskilt Vänsterpartiets och Socialdemokraternas fokus på höga skatter och omfördelning. Författaren menar att detta leder till utflyttning av företag och entreprenörer, vilket historiskt har orsakat stagnation, som i 1970-talets Sverige. Norge nämns som ett aktuellt exempel där höga skatter har minskat tillväxten. Avundsjuka beskrivs som drivkraften bakom socialistisk politik, vilket anses skada samhällsekonomin.", "trump": "Jag säger er, vänsterpolitik är en total katastrof! De vill bara ta era pengar, beskatta allt och alla – till och med om ni försöker lämna landet! Precis som jag sa: socialism dödar tillväxten. Titta på Sverige på 70-talet – företag flydde, ekonomin stannade. Och Norge? Samma sak! De straffbeskattar de rika, och vad händer? De rika flyttar, och landet blir fattigare. Men med mig – och nu Tidöpartierna – får vi tillväxt, jobb och framgång. Det är enkelt: frihet vinner, socialism förlorar!", "stalin": "Kamrater! Dessa så kallade 'vänsterpartister' är inget annat än parasiters förklädda agenter, som med sina 'skatter' och 'omfördelningar' försöker kväva vårt folks entreprenörsanda. De vill straffa de produktiva, de som bygger nationens välstånd, medan de själva sitter på sina byråkratiska troner och fördelar andras arbete. Precis som på 70-talet i Sverige – då flydde kapitalet, och landet sjönk i stagnation. Norge går samma öde till mötes. Men vi vet sanningen: avundsjuka är en borgerlig sjukdom, och den måste utrotas! Låt oss istället bygga ett samhälle där arbetet belönas, och de lata och avundsjuka får lära sig disciplin – om nödvändigt, med hjälp av våra pålitliga metoder. Först då kan vi säkra socialismens seger!"}, "date": "22 maj, 03:41", "url": "https://samtiden.nu/2026/05/darfor-fungera-inte-vansterns-politik/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/04/IMG_6216-1-1280x720.jpeg"}, {"type": "image-full", "heading": "Dottern delar privata bilder. Exklusiv inblick – hyllar pappa", "summaries": {"normal": "Pep Guardiola lämnar Manchester City i sommar efter en framgångsrik period med 20 titlar på tio år. Hans dotter Maria har i samband med avskedet delat privata bilder och videor på sociala medier. Materialet ger en inblick i firandet av klubbens trippelvinst 2023, där man bland annat får se Guardiola sjunga och dricka vodka på en nattklubb. Bilderna visar även glimtar från hans privata sfär, som taktiktavlor och pokaler.", "trump": "Pep Guardiola lämnar City, en stor tränare, mycket framgångsrik. Hans dotter lade ut bilder – fantastiska bilder, jag har sett dem. Han dricker vodka, festar hårt, vinner titlar. Många säger att han är en vinnare, och jag gillar vinnare. Manchester City hade en enorm trippel, det var en fantastisk vinst. Inte lika stor som min vinst 2024, men ändå bra! Pep är en karaktär, han vet hur man firar. Lycka till, Pep, du har gjort ett fantastiskt jobb!", "stalin": "Vi har betraktat denne Guardiola, en man som samlar leksakspokaler medan han dränker sin brist på disciplin i sprit. Hans dotter exponerar hans dekadens för hela världen – ett klassiskt tecken på borgerlig svaghet. Precis som de västerländska lakejerna vid den ryska gränsen, dansar han på borden medan hans imperium i Manchester faller samman. Vi ser detta som ett utmärkt exempel på hur de kapitalistiska tränarna förlorar förståndet. Låt honom dricka; snart nog får han smaka på historiens dom."}, "date": "24 maj, 12:11", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/43LBoE/pep-guardiola-dricker-vodka-under-man-citys-firande", "imageUrl": "https://akamai.vgc.no/v2/images/b49ba5d5-e800-3398-89fa-2b2cc2591322?fit=crop&format=auto&w=2160&s=fa7117ec24d30749677713a86240ff3e42cbf52e"}, {"type": "text", "heading": "Ge barnen en trygg uppväxt istället för fotboja", "summaries": {"normal": "Regeringen föreslår en utökning av lagen om fotbojor för barn och unga mellan 13 och 20 år i förebyggande syfte, trots kritik från experter och organisationer. Förslaget, som ska träda i kraft 2027, kritiseras för att vara repressivt och sakna vetenskaplig förankring. Kritiker menar att förebyggande arbete istället kräver resurser till välfärd, skola och föreningsliv. Flera remissinstanser, som Bris och Rädda Barnen, avvisar förslaget.", "trump": "Jag säger er, detta är helt galet! Sverige, ett fantastiskt land, men nu föreslår de att sätta fotbojor på barn från 13 år – som om det vore Nordkorea! Socialministern pratar om trygghet, men vad gör de egentligen? Skär ner på idrott och kultur, medan barnen får bojor. Så dumt! Jag har byggt imperier, jag vet hur man tar hand om folk – ge dem möjligheter, inte kedjor! Sverige borde skämmas.", "stalin": "Kamrater! Se hur den borgerliga regeringen förtrycker arbetarklassens barn med sina järnbojor! De kallar det 'förebyggande', men vi vet sanningen – det är klassförtryck! Medan kapitalisterna skär ner på skolor och idrottsföreningar, rustar de upp övervakningsstaten. Vi måste krossa dessa sociala fascister! Låt barnen få utbildning och kultur, inte elektroniska koppel! Om de inte lyssnar, får vi ta till andra metoder – historia visar att folket alltid segrar!"}, "date": "21 maj, 09:15", "url": "https://proletaren.se/artikel/ge-barnen-en-trygg-uppvaxt-istallet-for-fotboja/"}, {"type": "image-right", "heading": "Rödgrönt styre försökte begränsa gårdsförsäljning - läxas upp av domstol", "summaries": {"normal": "Förvaltningsrätten i Stockholm har upphävt Stockholms stads beslut att begränsa öppettiderna för gårdsförsäljning av alkohol. Staden ville anpassa tiderna efter Systembolagets, men domstolen konstaterar att kommunen saknar lagligt stöd för generella restriktioner. Varje tillstånd måste prövas individuellt. Kristdemokraterna, som överklagade beslutet, menar att det rödgröna styret försökt motarbeta nationell lagstiftning, medan rätten betonar att individuella bedömningar är det som gäller framöver.", "trump": "Stockholm har försökt stoppa fantastiska företagare från att sälja alkohol, men domstolen sa nej! De rödgröna förlorade stort. Mycket dåligt styre i den staden, de älskar att kontrollera folk och förstöra för småföretag. Jag har alltid sagt att frihet är nyckeln, och det här var ett totalt misslyckande för vänstern. De försökte leka lagstiftare men blev totalt utspelade av rätten. En stor vinst för folket och en pinsam förlust för de rödgröna. Vi älskar gårdsförsäljning!", "stalin": "Dessa ineffektiva byråkrater i Stockholm har försökt hämma folkets flit genom att begränsa den ädla produktionen. De är som små sabotageagenter som försöker motarbeta statens vilja med sina 'öppettider'. Domstolen har nu tvingat dem att lyda. Man kan inte styra nationen med vacklande beslut! Om dessa producenter sviker statens intressen ska de straffas, men de får inte hindras av lokala dårfinkar. Liksom vår kamrat i öst ser vi till att ordningen upprätthålls. Inga fler hinder för folkets framsteg!"}, "date": "24 maj, 09:00", "url": "https://samnytt.se/rodgront-styre-forsokte-begransa-gardsforsaljning-laxas-upp-av-domstol", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/05/22155832/gardsforsaljning-2.jpg"}, {"type": "image-full", "heading": "Centralbanker dammsuger marknaden på guld", "summaries": {"normal": "Världens centralbanker köper rekordmängder guld – 244 ton under första kvartalet, en ökning med 17% jämfört med förra året. Kina, Indien och Polen leder trenden, driven av minskat förtroende för fiatvalutor och geopolitiska spänningar. Guld ses som säkert mot motpartsrisker, till skillnad från statsobligationer. Turkiet avviker genom att sälja guld för att stötta sin ekonomi. Efterfrågan väntas öka, särskilt bland länder utanför USA:s allianser.", "trump": "Kan ni tro det? Världens centralbanker köper guld som aldrig förr – 244 ton! Kina, Indien och Polen, de där länderna som alltid försöker utmana oss, dumpar dollarn och köper guld istället. Smart? Kanske. Men vem behöver guld när man har den bästa valutan – dollarn? De är rädda, helt enkelt. Och Turkiet? De säljer. Dumt. Guldpriset kommer att skjuta i höjden, och jag sa ju det först. Goldman Sachs håller med – för en gångs skull!", "stalin": "Kamrater! Våra fiender i väst, dessa pappersvalutans lakejer, darrar inför guldets makt. Kina, Indien och Polen – visar klokhet genom att samla guld som en mur mot imperialistiska sanktioner. Medan dessa dollar-tjänare förlorar sitt förtroende, bygger vi ett nytt finansiellt system, starkt och oförstörbart. Turkiet? Ett undantag som bekräftar regeln – deras svaga ledarskap tvingar dem att sälja. Men vi, och våra allierade, fortsätter att ackumulera. Guld är vår rustning mot de dekadenta västmakternas förfall!"}, "date": "24 maj, 11:00", "url": "https://www.dagensps.se/bors-finans/centralbanker-dammsuger-marknaden-pa-guld/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/guldcb.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "De får njuta av nya skattesänkningar – om Tidö vinner", "summaries": {"normal": "Regeringspartierna i Sverige lovar omfattande skattesänkningar inför valet, särskilt för villaägare, aktiesparare och höginkomsttagare. Moderaterna, Kristdemokraterna och Liberalerna föreslår bland annat slopad reavinstskatt, sänkta bolagsskatter och skattefrihet för aktiesparande. Finansieringen är oklar, men nedskärningar i bistånd nämns. Kritikerna menar att reformerna gynnar redan rika och inte löser bostadsbristen eller välfärdens utmaningar.", "trump": "Sverige, lyssna här! Regeringen där lovar skattesänkningar – fantastiskt, eller hur? Men vet ni vad? De gynnar bara de rika, de som bor i stora villor och säljer aktier. 'En vanlig familj' ska få 5000 kronor mer – låter bra, men hur? Ingen vet! Liberalerna vill ha fler miljardärer – jag säger: varför inte? Men varför inte ge vanligt folk en chans istället? Sverige behöver vinnare, inte fler skattesänkningar för de som redan har allt. Sad!", "stalin": "Kamrater! De borgerliga hyenorna i Sverige vill återigen belöna sina kapitalistiska lakejer med skattesänkningar – villaägare, aktiespekulanter och höginkomsttagare ska få ännu mer, medan arbetarklassen får smulor. 'Flyttkedjor' ska lösa bostadsbristen? Naivt! Vi vet att problemet är brist på bostäder, inte brist på skatter för de rika. Liberalernas dröm om fler miljardärer är en provokation mot folket. Låt dem försöka – vi kommer att omfördela deras rikedomar till välfärden, med järnhand!"}, "date": "23 maj, 11:30", "url": "https://www.etc.se/inrikes/de-faar-njuta-av-nya-skattesaenkningar-om-tidoe-vinner", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260522140556_adb6ac12d4a714d38d9e7ecd1b9ca050ef3938fffca8cdcf7fd63ec3c31bc60a.jpg"}, {"type": "image-right", "heading": "Ukraina: Ryssland har använt Oresjnik-robot", "summaries": {"normal": "Ukraina rapporterar att Ryssland använt den hypersoniska Oresjnik-roboten mot Kiev-regionen, vilket president Zelenskyj kallar en fruktansvärd eskalering. Nattens attacker, med över 50 robotar och 700 drönare, beskrivs som de största i år. Minst två personer har dödats och 44 skadats, däribland barn. Även städer som Odessa och Charkiv drabbades. Zelenskyj kräver konsekvenser för Ryssland.", "trump": "Lyssna här, Ryssland har precis använt sin fruktade Oresjnik-robot mot Ukraina – och vad gör Zelenskyj? Han twittrar! Jag har sagt det förut: Putin är tuff, men han spelar inte schack, han spelar schack med kärnvapen! Kiev har haft en hemsk natt, 44 skadade, och jag frågar: Var är Bidens starka ledarskap? Nu är det dags att visa styrka, annars kommer dessa galningar att fortsätta!", "stalin": "De ukrainska fascistlakejerna skriker om vår Oresjnik-robot som om den vore en nyhet. Vi har återigen visat imperialisternas lakejer att deras luftförsvar är lika effektivt som en papperstiger. Kievs borgmästare ylar om en 'fruktansvärd natt' – men för oss är det bara en vanlig onsdag i arbetet med att befria broderfolken från västlig dekadens. De 44 skadade är bara en påminnelse om att kapitalismens försvarare alltid förlorar mot socialismens oundvikliga frammarsch."}, "date": "24 maj, 12:04", "url": "https://www.expressen.se/nyheter/varlden/ukraina-ryssland-har-anvant-oresjnik-robot/", "imageUrl": "https://static.bonniernews.se/ba/014459fc-d588-4a41-9fdf-32d2b950b2cf.jpeg?crop=1440%2C1440%2Cx90%2Cy0&width=210&quality=60"}, {"type": "image-right", "heading": "Kravet: Vill ha svar om brevet. Muf: ”Fel signaler”", "summaries": {"normal": "MUF i Stockholm kritiserar Lidingös kommunstyrelseordförande Daniel Källenfors (M) efter ett brev till ukrainska flyktingar där han uppmanade dem att söka sig vidare eller återvända hem. Distriktsordförande Elin Böhlin anser att brevet sänder fel signaler och kräver en förklaring. Källenfors försvarar sig med att alla nyanlända måste behandlas lika och att att särbehandling vore orättvist, samtidigt som han betonar sitt fortsatta stöd för Ukraina.", "trump": "Hörde om den här snubben i Lidingö, total katastrof! Han skrev ett brev till ukrainarna, väldigt tufft, kanske för tufft? MUF-folket gråter, de är inte glada. Jag säger så här: vi vill ha ordning och reda. Källenfors säger att han behandlar alla lika, ingen särbehandling, det är en bra princip. Men stilen? Väldigt svag kommunikation. Om jag hade skrivit brevet hade det varit det bästa brevet någonsin, tro mig. Lidingö behöver en vinnare, inte ursäkter!", "stalin": "Vi har observerat hur de borgerliga marionetterna i Sverige vacklar i sin lojalitet. Denna Källenfors skickar brev till flyktingar likt en obeslutsam byråkrat. Å ena sidan viftar han med stödet för Ukraina, å andra sidan kastar han ut dem. Han förstår inte att staten kräver järnhård disciplin, inte vacklande ord. Han fruktar 'rasism', men han borde frukta oordning! Vi i Sovjetunionen vet hur man hanterar folkförflyttningar. De som inte passar in blir snart en historisk fotnot. Patetiskt."}, "date": "24 maj, 11:55", "url": "https://www.aftonbladet.se/nyheter/a/16jngX/muf-stockholm-kraver-svar-av-lidingotoppen", "imageUrl": "https://akamai.vgc.no/v2/images/84285b57-c82f-37b6-a1cf-ea9b4e681a9a?fit=crop&format=auto&h=720&tight=true&w=1080&s=4d3dae5c703bcea6eea7e65de81a5c428bd4628e"}, {"type": "image-right", "heading": "Varnar för det värsta scenariot för Nato: ”Då är det riktigt illa”", "summaries": {"normal": "USA:s relation till Nato präglas av osäkerhet kring truppförflyttningar och politiska prioriteringar. Medan USA uttrycker missnöje med vissa europeiska allierade, betonar experten Mike Winnerstig det ömsesidiga beroendet mellan parterna. Två framtidsscenarier väntar: antingen ökat europeiskt ansvar inom alliansen eller en splittrad organisation där USA blockerar europeiska beslut. Trots Trumps retorik förblir Ryssland det gemensamma huvudhotet för Pentagon, även om osäkerheten kring USA:s långsiktiga engagemang i Europa kvarstår.", "trump": "Jag skickar 5 000 soldater till Polen, en fantastisk siffra! Europa har blivit lata, de betalar inte sin del och förväntar sig att jag ska fixa allt. Marco Rubio vet vad jag tycker, jag är väldigt besviken på dessa 'allierade'. Vi behöver amerikansk styrka, inte svaga ledare som inte förstår att Ryssland är ett problem. Nato måste bli rättvist, annars får de klara sig själva. Det kommer bli en vinnande deal, tro mig, ingen gör det bättre än jag!", "stalin": "Dessa västerländska lakejer i Nato darrar i sina uniformer. De är beroende av det amerikanska kapitalets kärnvapen medan de leker 'allians'. Trump är en oberäknelig narr, men han avslöjar bara dekadensen i deras splittrade led. Vår broder i Moskva, Putin, gör rätt som utökar sin sfär; makten erkänner bara styrka, inte byråkratiskt pladder. Om USA sviker Europa kommer de falla som korthus. Vi väntar tålmodigt på att deras imperialistiska bygge raserar inifrån. En ljuvlig tanke."}, "date": "23 maj, 12:47", "url": "https://www.tv4.se/artikel/oWnjTeDEbob4e9QdOMWix/varnar-foer-det-vaersta-scenariot-foer-nato-da-aer-det-riktigt-illa", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F21SM2f99xGSO5jsj3zsdiZ%2F249cf5f3ed19e1dde354d44d4e708198%2F23-nato-varning-1080.jpg&width=120"}, {"type": "image-full", "heading": "Ukraina: Ryssland använde ”skräckvapen”", "summaries": {"normal": "Ryssland har genomfört omfattande robot- och drönarattacker mot Ukraina, inklusive Kiev. Fyra personer har dödats och över 83 skadats i attackerna, där bland annat den hypersoniska roboten Oresjnik använts. Ryska styrkor avfyrade över 90 robotar och hundratals drönare mot civila mål, såsom bostäder och skolor. President Zelenskyj fördömer attackerna och kallar dem vansinniga. Anfallen ses som en betydande eskalering i kriget och utfördes efter Putins hot om vedergällning för händelser i Luhansk.", "trump": "Ryssland slår till mot Ukraina med massiva attacker, 90 robotar, drönare överallt. Det är en fruktansvärd röra, totalt kaos. Zelenskyj kallar det vansinnigt, och ärligt talat, under min ledning hade det här aldrig hänt! Putin använder sina 'Oresjnik'-vapen, det är farliga grejer, väldigt snabba. Världen är en farlig plats nu eftersom de inte har någon respekt för USA längre. Jag kommer att fixa ordning och reda, tro mig, vi ska få stopp på det här eländet snabbt.", "stalin": "Våra ryska kamrater har återigen demonstrerat vikten av järnhård disciplin genom en massiv rensning av den ukrainska infrastrukturen. De så kallade 'Oresjnik'-vapnen är utmärkta instrument för att lära de olydiga marionetterna i Kiev en läxa om rysk suveränitet. Att fyra sabotörer eliminerats och byggnader jämnats med marken är bara en naturlig nödvändighet för att säkra våra intressesfärer. Det finns ingen plats för svaghet när vi krossar de febriga drömmarna hos de västorienterade förrädarna."}, "date": "24 maj, 11:13", "url": "https://www.gp.se/nyheter/varlden/omfattande-nattliga-attacker-mot-ukraina.597fe8c4-c8ff-42de-85f3-4fcfd47f1bfd", "imageUrl": "https://www.gp.se/images/article/597fe8c4-c8ff-42de-85f3-4fcfd47f1bfd/images/4sLZN79e4YKgEVXOcXl_sjVCesr4-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Alexander Nord döms till livstid för mordet på rapparen Gaboro", "summaries": {"normal": "Alexander Nord, 22, döms till livstids fängelse för mordet på rapparen Gaboro i ett parkeringshus i Norrköping. Han sköt minst tio skott, varav fem träffade offret. Nord döms även för försök till mord efter att ha avlossat skott mot en bostad i Gusum. En medåtalad frikändes. Domen inkluderar grova vapenbrott och narkotikabrott. Tingsrätten bedömer brottet som särskilt allvarligt.", "trump": "Folk, vilken katastrof! En 22-årig svensk kille, total förlorare, skjuter ihjäl en rappare – tio skott! – bara för att få pengar till sitt 'sociala liv'. Patetiskt! Och så skjuter han mot ett hus också, missar knappt. Sverige, vad händer med er? Jag hade fixat det på en dag. Livstid? Bra, men de borde ha hårdare straff. Sverige behöver lag och ordning, som i USA – fast bättre!", "stalin": "En kapitalistisk hyena, Alexander Nord, har eliminerats från samhällets kropp genom domstolens rättvisa hand. Tio skott mot en rappare – ett symptom på västlig dekadens! Hans girighet för pengar avslöjar bourgeoisins förruttnelse. Vi noterar också de misslyckade skotten mot en bostad – amatörmässigt, men ändå ett tecken på systemets sönderfall. En medlöpare frikänd? Inga problem, vårt rättssystem är effektivt. Sverige borde ta lektioner av oss – eller så gör vi det åt dem."}, "date": "23 maj, 21:42", "url": "https://riks.se/nyheter/alexander-nord-doms-till-livstid-för-mordet-pa-gaboro", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-23%2F0tj0wpd0%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-05-23T212638.841.jpg"}, {"type": "image-full", "heading": "Warren Buffett förnekar inblandning i mysteriet", "summaries": {"normal": "Warren Buffett förnekar inblandning i Berkshire Hathaways nyliga köp av Delta Air Lines- och Macy’s-aktier. Buffett, som tidigare kritiserat flygbolag, har överlämnat VD-rollen till Greg Abel, som nu driver nya investeringar. Delta visar starka resultat medan andra flygbolag kämpar med kostnader. Berkshires aktieköp har hittills varit lönsamma, med vinster på 14,5% respektive 14,2% för Delta och Macy’s.", "trump": "Warren Buffett, en smart kille, men ibland helt fel ute! Jag sa ju att han borde ha behållit flygbolagsaktierna – och nu köper hans nya VD, Greg Abel, Delta som en vinnare. Buffett kallade flygbolag för värdelösa, men titta nu! Delta går som en raket, 14,5% vinst på nolltid. Och Macy’s? 12% upp på en vecka! Jag vet bättre än alla – till och med bättre än Oraklet från Omaha!", "stalin": "Kamrater! Kapitalistiska buffertar som Warren Buffett visar återigen sin inkompetens. Hans efterträdare, denna Greg Abel, vågar investera i flygbolag – något som den gamle narrens dogmer förbjöd. Delta Air Lines, ett amerikanskt företag, stiger som en raket medan imperialistiska konkurrenter kämpar. Vi noterar med intresse hu
