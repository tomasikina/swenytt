ster och folkfiender infiltrera sina led som maskar i en ruttnande kropp. De kramar terrorister och gömmer sig bakom lögnaktiga skuggorganisationer. En sådan svaghet förtjänar utrensning. Kamrater, se hur borgarbrackorna ler medan statens fiender tar plats vid makten. Patetiskt."}, "date": "25 augusti, 03:45", "url": "https://samtiden.nu/2026/08/vansterpartiet-infiltrerat-av-frammande-makt-s-sager-ingenting", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Nooshi-Magdalena-1280x720.jpeg"}, {"type": "image-right", "heading": "Rektor i Hamasvänlig demonstration – L-politiker anmälda", "summaries": {"normal": "Rektor på Bergumskolan i Göteborg demonstrerar med Hamas-sympatisörer. Liberalerna frågar om judiska elevers trygghet – och anmäls för otillbörlig påverkan. Förvaltningen backar rektorn: ”Inget som strider mot uppdraget.” Byråkratisk kullerbytta.", "trump": "Jag hörde om en rektor i Sverige som hänger med Hamas. Och när politikerna frågar om judiska barns trygghet, anmäls de! Det är det dummaste jag hört. Sverige är inte America First. De borde lära sig av mig – jag skulle aldrig låta det hända. Så enkelt!", "stalin": "Kamrater, en rektor i Göteborg deltar i Hamas-demonstrationer. När liberaler ifrågasätter, anmäls de för otillbörlig påverkan. Vi rensar ut sådana element som inte förstår vår kamp. Alla som kritiserar partilinjen ska utrensas. Vi övervakar och styr. Inget motstånd tolereras."}, "date": "25 augusti, 07:46", "url": "https://bulletin.nu/rektor-i-hamasvanlig-demonstration-l-politiker-anmalda", "imageUrl": "https://cdn.bulletin.nu/articles/904f4ab8-ed90-422f-aaef-d70a04d867d5/preview.jpg?t=1787636495000"}, {"type": "image-right", "heading": "”Orättvist att företagaren får betala för ditt brutna ben i Åre”", "summaries": {"normal": "Artikeln kritiserar karensdebatten och pekar på en större orättvisa: att arbetsgivare tvingas betala sjuklön under de första två veckorna även när frånvaron inte beror på arbetsmiljön eller företagets fel. Småföretag drabbas särskilt hårt. Författaren menar att sjukfrånvaro främst är en samhällelig försäkringsfråga som inte bör läggas på arbetsgivarna.", "trump": "Folk, ni borde se det här! De pratar om karens och rättvisa, men den riktiga skandalen är att företagen tvingas betala när folk bryter benet i Åre eller fixar silikon. Det är en total katastrof för småföretagarna. Avskaffa karensen? Det blir bara fler lata dagar, högre priser och färre jobb. Patetiskt!", "stalin": "I denna dekadenta borgerliga karensdag debatt avslöjar sig den sanna parasitens ansikte: kapitalisterna som tvingas betala för arbetarnas knäskador i offpist och kosmetiska operationer. Vi, partiet och arbetarna, ser den sanna orättvisan. Låt oss rensa ut denna sjuka försäkringsmaskin som göder de lata och straffar de produktiva. Kamrater, det är tid för utrensning av sådana system!"}, "date": "25 augusti, 08:00", "url": "https://arbetet.se/2026/08/25/den-verkliga-orattvisan-i-karensen-foretaget-betalar-nar-du-bryter-benet-i-are", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/25070147/karl-ernlund-1.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Åtta av tio muslimer väljer S eller V", "summaries": {"normal": "En Novus-mätning visar att 80 procent av svenska muslimer sympatiserar med S eller V. Regeringspartierna får sammanlagt under 4 procent medan SD når 10,4 procent. Val-forskaren Henrik Ekengren Oscarsson kopplar SD:s stöd till önskan om stram migrationspolitik, ordning och hårdare tag mot brottslighet i utsatta områden.", "trump": "Hörni, muslimerna i Sverige röstar 80 procent på socialisterna och vänstern – en total katastrof! Mina vänner, de hatar de svaga regeringspartierna som knappt får 4 procent. Men SD får över 10 procent, smarta människor som vill ha lag och ordning. Sverige håller på att vakna, tro mig!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur 80 procent av de troende vänder sig mot de sanna folkets partier och förkastar de dekadenta borgerliga brackorna som knappt når 4 procent. SD:s 10-procentiga stöd bland muslimerna visar att även de inser behovet av att rensa ut brottslighetens parasitiska element ur samhällskroppen. Utmärkt."}, "date": "25 augusti, 08:09", "url": "https://www.friatider.se/atta-av-tio-muslimer-valjer-s-eller-v", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-746.jpg"}, {"type": "image-right", "heading": "JO-kritik mot myndighet som tröttnade på mejl från privatperson - kallades trakasserier", "summaries": {"normal": "JO kritiserar Arbetsförmedlingen efter att en arbetssökande man fick sina mejl stämplade som trakasserier. Myndigheten dröjde över ett år med att lämna ut handlingar. JO kallar hanteringen slarvig och oacceptabel.", "trump": "Jag hörde att Arbetsförmedlingen kallade en killes mejl för trakasserier. Helt sjukt! I USA älskar vi att mejla myndigheter – det är yttrandefrihet! De borde lära sig av oss. Stort misstag, Sverige!", "stalin": "Kamrater, en fiende till staten försökte sabotera vår byråkrati med otaliga mejl. Men vi, partiet, visade styrka: vi ignorerade hans begäran i ett år och kallade hans frågor för trakasserier. En läxa för alla kontrarevolutionärer!"}, "date": "25 augusti, 08:00", "url": "https://samnytt.se/jo-kritik-mot-myndighet-som-trottnade-pa-mejl-fran-privatperson-kallades-trakasserier", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/24123242/arbetsformedlingen-klubba-mejl.jpg"}, {"type": "image-right", "heading": "Dadgostar: Kommer inte fälla Magdalena Andersson", "summaries": {"normal": "Vänsterpartiets ledare Nooshi Dadgostar meddelar att partiet inte kommer att fälla en regering ledd av Magdalena Andersson. Hon utesluter inte att sitta i regering vid behov och är öppen för samarbete med Centerpartiet. Dadgostar ser inget troligt nyval i höst och betonar att partiet vill undvika en sådan situation.", "trump": "Titta på de här svenska kommunisterna som plötsligt blivit mjuka som smör. Den röda Dadgostar säger att hon inte tänker fälla sin väninna Andersson – vad en överraskning! De är så patetiska att de till och med vill krama Centerpartiets misslyckade globalister. Patetiskt, men typiskt för vänsterns svaga förlorarmentalitet. Vi har sett det förut.", "stalin": "Jag betraktar med förakt hur dessa opportunistiska revisionister dansar kring makten som fega klassförrädare. Dadgostar kryper för borgarbrackorna och vägrar nu rensa ut de socialdemokratiska parasiterna. Ett sådant svagt, förhandlande krypande förtjänar utrensning ur varje äkta arbetarparti. Kamrater, se hur revisionismen förråder folket igen."}, "date": "25 augusti, 08:05", "url": "https://www.tv4.se/artikel/6ygmPq8nP1Z6qsmFEmhSBx/nya-v-beskedet-kommer-inte-faella-magdalena-andersson", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2kwmmxNpeCv1k43Kl5544U%2F954f8e0229e06514b8b218aa43e64741%2F24-nooshi-webb.jpg&width=120"}, {"type": "image-right", "heading": "Regeringens svar på skolattacken är ett hån", "summaries": {"normal": "Efter skolattacken i Fagersta kritiserar Arbetets politiska redaktör regeringen för att bara tillsätta en skoldådskommission. Trots år av nedskärningar, varningar om våld och bristande stöd till skolor ses åtgärden som för lite och för sent. Regeringen prioriterade skattesänkningar framför skolans behov, vilket bidragit till ökat våld och sämre elevstöd.", "trump": "Det här är en total katastrof, folk. Den svenska regeringen har misslyckats totalt med skolan, precis som de gör med allt annat. Nedskärningar, ignorans och nu en kommission? Patetiskt. De borde ha lyssnat på varningarna istället för att ge bort pengar till fel personer. Sverige behöver starka ledare, inte svaga ursäkter. Gör skolan stor igen!", "stalin": "Kamrater, denna fega borgarregim avslöjar sin parasitiska natur genom att svara på arbetarklassens lidande med en byråkratisk kommission. Jag har sett hur kapitalisterna rensar ut stöd till skolorna medan de göder de rika. Deras paranoia inför folkets vrede är underhållande. Vi ska likvidera sådana svagheter och stärka det kollektiva skyddet mot kontrarevolutionära element."}, "date": "25 augusti, 06:50", "url": "https://arbetet.se/2026/08/25/efter-skolattacken-i-fagersta-regeringens-svar-ar-ett-han", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/25065040/attack-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=300&h=225"}, {"type": "image-full", "heading": "USA kan dra tillbaka 200 000 visum", "summaries": {"normal": "USA planerar att återkalla cirka 200 000 visum för personer som sökt asyl efter ankomst. Åtgärden berör två typer av korttidsvisum utfärdade de senaste tio åren. Nya sökande måste nu intyga att de inte avser söka asyl. Tidigare har 175 000 visum återkallats av andra skäl.", "trump": "Titta bara på det här – folk kommer hit på turistvisum och tror att de kan stanna för evigt! Jag ska stoppa det. 200 000 visum dras tillbaka, och nya regler gör det klart: USA är INTE ett hotell. Om du vill stanna, följ lagen. Vi tar tillbaka vårt land, en visumansökan i taget!", "stalin": "Kapitalistiska hycklare i Vita huset avslöjar sin sanna natur! De lockar arbetare med löften om frihet, för att sedan kasta ut dem som gamla tidningar. 200 000 visum återkallas – ett nytt rekord i imperialistisk grymhet. Men var lugna, kamrater: deras system är ruttet. Snart skrattar vi sist, medan deras murar faller som Berlinmurens spillror!"}, "date": "25 augusti, 06:25", "url": "https://kvartal.se/nyheter/artiklar/usa-kan-dra-tillbaka-200-000-visum/cG9zdDoxNzM0NTg", "imageUrl": "https://images.kvartal.se/2026/08/1b9a8636-trumpp.webp"}, {"type": "image-right", "heading": "Som utrikesminister vill Morgan Johansson höja biståndet med 20 miljarder", "summaries": {"normal": "Morgan Johansson aspirerar på posten som utrikesminister om Socialdemokraterna vinner valet. Han lovar höja biståndet till en procent av BNP, återinföra feministisk utrikespolitik, öka stödet till afrikanska länder och Taliban-styrda Afghanistan samt införa handelsstopp mot Israel. Han betonar FN:s roll men nämner inte konsekvenser för svensk säkerhet eller försvar.", "trump": "Den här Johansson-killen är en total förlorare. Vill skicka svenska skattebetalarnas pengar till korrupta afrikanska hålor och talibanerna medan han skriker om feministisk utrikespolitik. Patetiskt! Han hatar Israel och älskar FN:s diktatorer. Typisk socialist som säljer ut sitt eget folk. Sverige kommer att bli en svag, patetisk skugga under sådana misslyckade ledare. Sad!", "stalin": "Jag ser hur dessa socialdemokratiska klassförrädare vill kasta miljarder till reaktionära afrikanska satraper och talibaniska barbarer under täckmanteln av feministisk politik. Deras hat mot Israel och dyrkan av det degenererade FN avslöjar deras sanna ansikte som folkfiender. En sådan svaghet inbjuder till utrensning av alla imperialister som lurar folket. Kamrater, var vaksamma mot dessa profitthungriga hyenor."}, "date": "23 augusti, 03:50", "url": "https://samtiden.nu/2026/08/som-utrikesminister-vill-morgan-johansson-hoja-bistandet-med-20-miljarder", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6854.jpeg"}, {"type": "image-right", "heading": "Centerpartiets regeringslinje rymmer en svår motsättning", "summaries": {"normal": "Centerpartiet bör tydligt ange sina klimatpolitiska krav inför ett eventuellt regeringssamarbete. Inbjudan till Kristdemokraterna riskerar annars att bli enbart en borgerlig markering utan trovärdigt politiskt innehåll. Artikeln pekar på partiets dilemma att förena borgerlig identitet med höga klimatambitioner och betonar vikten av att fokusera på politikens faktiska riktning snarare än bara regeringskonstellationer.", "trump": "Centerpartiet borde sluta leka med de riktiga vinnarna och äntligen säga vad de vill med klimatet om de ska regera. Att bjuda in Kristdemokraterna är bara en svag markering, ingen bra deal. Utan tydliga krav blir det ett patetiskt försök att hålla sig borgerliga. Jag älskar starka ledare som säger som det är, inte dessa svenska förlorare som gömmer sig bakom vaga löften.", "stalin": "Jag kräver att Centerpartiet omedelbart offentliggör sina klimatpolitiska krav som villkor för samarbete. Annars framstår inbjudan till dessa kristdemokratiska element som en ynklig borgerlig markering, full av kontrarevolutionär dimma. Vi ser hur borgarbrackorna försöker maskera sin brist på enhetlig politik. Trovärdighet kräver klarhet, annars likviderar historien sådana svaga konstruktioner med ett leende."}, "date": "25 augusti, 01:49", "url": "https://www.dagensarena.se/opinion/centerpartiets-regeringslinje-rymmer-en-svar-motsattning", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-92-300x157.jpg"}, {"type": "image-full", "heading": "Kanada planerar tullsvar: ”Skydda och stödja”", "summaries": {"normal": "USA har infört 50-procentiga tullar på kanadensiska varor efter att förhandlingarna havererat. Kanada svarar nu genom att presentera ett paket med motåtgärder och stödpaket till inhemska företag. Premiärminister Mark Carney aviserar tullar mot bland annat amerikanskt stål och mejeriprodukter, vilket markerar en fortsatt eskalering i handelskonflikten mellan länderna.", "trump": "Kanada försöker bråka med USA, men det kommer inte att fungera! De försöker svara med tullar, men jag har redan vunnit. Deras ekonomi är i spillror och de desperata åtgärderna hjälper inte. Jag sätter USA först, precis som jag alltid gör. De kommer att betala ett högt pris för att ha utmanat oss. Ingen vinner mot mig!", "stalin": "Vi betraktar detta dekadenta gräl med förakt. De nordamerikanska imperialisterna gnager på varandra likt råttor i en säck. Kanada, denna svaga satellit, försöker skydda sitt näringsliv mot sin herre. Det påminner om de förrädiska element vi rensat ut förr. Låt dem förgöra varandra, medan vi i öst samlar vår kraft och utökar vår oundvikliga intressesfär. Historien väntar."}, "date": "25 augusti, 07:48", "url": "https://www.realtid.se/bors-finans/kanada-planerar-tullsvar-skydda-och-stodja", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/kanadas-premiarminister-mark-carney-bild.jpg?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Dagerlind: Är demokrati verkligen ett hot mot Ukraina?", "summaries": {"normal": "Zelenskyj varnar för val mitt i kriget, kallar det en ”tsunami” som splittrar Ukraina och gynnar Putin. Sparkade ministern Fedorov kräver motsatsen: att Putin inte ska få bestämma när Ukraina röstar. En demokratisk paradox där båda har poänger – men vem vågar testa?", "trump": "Jag ser att Zelenskyj är rädd för val. Svag! I USA har vi de bästa valen, trots krig, trots allt. Han säger att röstning splittrar landet? Löjligt! Jag skulle vinna med 100 procent, alla älskar mig. Ukraina, ta er i kragen!", "stalin": "Kamrater, detta ”val” är kontrarevolutionärt sabotage. Zelenskyj har rätt – splittring gynnar fascistiska Putin-rovdjur. Vi rensar ut sådana som Fedorov, som sprider oenighet. Demokrati är en borgerlig lögn; partiet vet bäst. Inga val förrän fienden är krossad i Gulag!"}, "date": "25 augusti, 06:00", "url": "https://samnytt.se/dagerlind-ar-demokrati-verkligen-ett-hot-mot-ukraina", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/23181645/dagerlind-hot-mot-ukraina-3.jpg"}, {"type": "image-right", "heading": "Hoppets demonstration", "summaries": {"normal": "Över 50 000 personer deltog i söndagens stora klimatdemonstration i Stockholm, arrangerad av Naturskyddsföreningen och flera andra organisationer. Artikeln lyfter det folkliga stödet för radikal klimatpolitik, intervjuer från landsbygden som visar oro över förändrat väder och att fackföreningar nu ser klimatfrågan som en central arbetsmiljöfråga. Hopp skapas genom kollektiv handling.", "trump": "Hörni, jag älskar folkmassor och det här var tydligen en jättefolkmassa på 50 000 klimataktivister som vandrade runt med sina barnvagnar och plakat. Fantastiskt! Men de borde demonstrera mot Kinas föroreningar istället för att attackera vår underbara industri. De vill ha radikal politik? Mitt folk röstade på resultat, inte på hysteriska mammor och pappor med hemmagjorda hattar. Patetiskt!", "stalin": "Kamrater, jag ser med tillfredsställelse hur massorna marscherar mot de dekadenta kapitalisternas klimatförnekelse. Vi har rensat ut tvivlarna tidigare och skall göra det igen. Den folkliga rörelsen är ett vapen mot borgarbrackornas sabotage. Våra fackliga kamrater har rätt – klimatet är en klassfråga. Den som vägrar handla skall likvideras ur historien med ett leende. Hopp är kollektiv handling under partiets ledning."}, "date": "24 augusti, 21:40", "url": "https://www.dagensarena.se/opinion/hoppets-demonstration", "imageUrl": "https://www.dagensarena.se/files/2026/08/demonstration.jpeg"}, {"type": "image-right", "heading": "Ett snällare samhälle är enda vägen", "summaries": {"normal": "Vilgot Österlund reflekterar över det senaste skoldådet på Brinellskolan i Fagersta. Han beskriver samhällets hårda krav som skapar utanförskap, psykisk ohälsa och våldsbejakande miljöer. Lösningen är ett mjukare samhälle med bättre stöd i skola, socialtjänst och arbetsmarknad. Förebyggande insatser är nödvändiga även om de inte alltid räcker.", "trump": "Folk, det är en katastrof! Sverige har blivit ett hårt, galet land där alla misslyckas och hamnar i gäng eller blir galna. De låser skolorna men mördarna kommer ändå in. Ni behöver en stark ledare som fixar det – inte detta mjuka, patetiska skitsamhälle. Make Sweden Great Again, det är vad jag säger!", "stalin": "I detta dekadenta borgerliga samhälle förpassas arbetets söner till utanförskapets mörker där de blir lätta offer för reaktionära impulser. Vi ska inte blunda för klassfiendens sabotage mot folkets enhet. Ett mjukare samhälle? Nej, kamrater – vi behöver en järnhård utrensning av alla som odlar svaghet. Den som sviker kollektivet förtjänar att skrattas ut i historien."}, "date": "24 augusti, 21:23", "url": "https://www.dagensarena.se/opinion/ett-snallare-samhalle-ar-enda-vagen-2", "imageUrl": "https://www.dagensarena.se/files/2024/12/startsidavilgot-576x1024.png"}, {"type": "image-right", "heading": "Tiktokkonto kopplas till Fagerstadådet – hyllar skolmord och återvandring", "summaries": {"normal": "En 18-årig tidigare elev har gripits efter en svärdsattack på Brinellskolan i Fagersta där flera personer skadats allvarligt. Hans TikTok-konto hyllar massmördare som Anton Lundin Pettersson, Anders Behring Breivik och Elliot Rodger samt högerextrema idéer om återvandring. Kontot kopplas nu till dådet av polisen.", "trump": "Folk, det här är en total katastrof! Den här galningen med svärd hyllar alla möjliga losers och mördare på TikTok, sen attackerar han en skola. Patetiskt! Under Biden blev allt ett enda kaos med galningar överallt. Men nu fixar jag det – inga fler svaga, woke skolor. Vi behöver styrka, inte den här sjuka identitetspolitiken!", "stalin": "Kamrater, denna degenererade yngling, uppfostrad av den borgerliga statens psykiatriska maskineri, hyllar klassfiendernas massmördare och fascistiska återvändande. Hans svärdshandling är ett symptom på det sjuka kapitalistiska samhällets förfall. Vi skulle ha genomfört en grundlig utrensning av sådana element redan i vaggan. Folkfienderna frodas i mörkret."}, "date": "21 augusti, 18:53", "url": "https://www.flamman.se/tiktokkonto-kopplas-till-fagerstadadet-hyllar-skolmord-och-atervandring", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/sdljnusj4gn7le-nh.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "5 miljoner svenskar ska betala för Sossarnas bolåneskatt", "summaries": {"normal": "Artikeln kritiserar Socialdemokraternas förslag om bolåneskatt som drabbar 2 miljoner hushåll med lån, uppemot 5 miljoner svenskar. Förslaget väntas leda till högre räntor då bankerna kompenserar för skatten. Författaren pekar på höga bostadspriser, skuldsättning och bristande bostadsbyggande som verkliga problem snarare än bankvinster.", "trump": "De galna sossarna i Sverige vill införa en totalt löjlig bolåneskatt som slår mot vanliga människor. Det är en katastrof, folk! Räntorna kommer att skjuta i höjden och alla förlorar utom de korkade byråkraterna. Bygg hus, sänk skatterna, sluta lyssna på dessa misslyckade socialister som aldrig har haft ett riktigt jobb!", "stalin": "Jag betraktar detta som ett ypperligt exempel på hur klassfienderna inom socialdemokratin försöker dölja sin egen usla politik genom att attackera bankerna medan folket krossas under skulder och bostadsbrist. En sådan feg plåsterpolitik förtjänar utrensning. Arbetarna genomskådar dessa profitthungriga hyenor som gömmer sig bakom falska löften."}, "date": "21 augusti, 03:34", "url": "https://samtiden.nu/2026/08/5-miljoner-svenskar-ska-betala-for-sossarnas-bolaneskatt", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/IMG_4828-1280x720.jpeg"}, {"type": "image-right", "heading": "Sverige pratar om tekniken – Japan löser problemen", "summaries": {"normal": "Sverige fokuserar teknikdebatten på innovation, investeringar och konkurrens men glömmer samhällsproblemen som tekniken ska lösa. Författaren uppmanar till att lära av Japan, där teknologi ses som ett verktyg för långsiktig samhällsförbättring enligt principen Sanpo Yoshi. Han föreslår konkreta pilotprojekt inom välfärd, klimat och energi i samarbete mellan näringsliv och offentlig sektor.", "trump": "De svenska förlorarna pratar bara om att bygga den största AI:n och vinna tävlingen. Patetiskt! Japan gör det rätt – de löser faktiskt problemen istället för att skryta. Vi borde göra samma sak, stora, vackra pilotprojekt som fixar vård, energi och allt det där. Amerika gör det redan bäst, men Sverige kan lära sig innan de går under.", "stalin": "Vi ser hur den svenska borgarklassen i sin dekadenta debatt dyrkar tekniken som ett fetischobjekt medan folket lider. Jag ler mörkt åt deras naivitet. Börja med problemen, kamrater! Låt tekniken tjäna kollektivet, inte profiten. Rensa ut de parasitiska innovatörerna som bara vill berika sig själva. Sanpo Yoshi? Enbart partilinjen räddar staten."}, "date": "25 augusti, 07:38", "url": "https://www.di.se/debatt/sverige-pratar-om-tekniken-japan-loser-problemen", "imageUrl": "https://static.bonniernews.se/ba/d0aac7b7-9b0e-4b3a-bf84-670539d77878.jpeg?crop=1792%2C896%2Cx0%2Cy487&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Actic redovisar kraftigt vinsttapp", "summaries": {"normal": "Actic tappar vinsten – omsättningen sjönk 1,3 procent till 172,7 miljoner, men jämförbara anläggningar växer med 7,9 procent. VD:n är nöjd, men siffrorna skriker inte segerdans. Färre gym i Norge drog ner, men kvarvarande svettas mer per medlem.", "trump": "Jag ser Actic – omsättning ner, vinst ner, men de säger att allt är fantastiskt. Tro mig, det är inte bra affärer. Jag hade sparkat VD:n. De säljer gym i Norge – svagt! Min ekonomi är mycket bättre, mycket större siffror, de bästa siffrorna.", "stalin": "Kamrater, Actic visar vinsttapp – en borgerlig avvikelse. Omsättningen sjunker, men jag ser sabotage från Norge. Vi måste rensa ut dessa gymkapitalister. Medlemsökning är falsk propaganda. Rapportera era misstankar till partiets kontrollkommitté. Arbetet fortsätter."}, "date": "25 augusti, 07:56", "url": "https://www.affarsvarlden.se/artikel/actic-redovisar-kraftigt-vinsttapp", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/actichd39-400x267.jpeg"}, {"type": "image-right", "heading": "Ellos ökar omsättning och tillväxt", "summaries": {"normal": "Ellos redovisar ökad omsättning i Q2, upp 5,9 procent till 848,3 miljoner kronor. Justerad ebita i linje med fjolåret, men rörelseresultatet backade till -0,1 miljoner. Vd:n hyllar egna varumärken och investeringar i nykunder, trots fortsatt osäker omvärld. Kassaflödet stärktes till 90,7 miljoner.", "trump": "Jag ser att Ellos gör det fantastiskt, enastående! Omsättningen upp 5,9 procent – det är enormt, ingen gör det bättre. Men rörelseresultatet? Nästan noll, tråkigt! Men jag gillar deras strategi, de investerar i sig själva, precis som jag gör i USA. De satsar på egna märken, mycket smart. De vet hur man vinner, precis som jag. Stora siffror, stora planer!", "stalin": "Kamrater, Ellos visar disciplin. Omsättningen stiger, men fienden – den förrädiska rörelsevinsten – ligger stilla. Vi måste rensa ut ineffektiva marknadsföringskostnader, som spioner i våra led. Resultatet efter skatt är ett sabotage, minus 37,9 miljoner. Men kassaflödet är starkt, 90,7 miljoner. Vi ska krossa dessa borgerliga e-handelskapitalister med en ny femårsplan. Framåt, till segern!"}, "date": "25 augusti, 07:41", "url": "https://www.affarsvarlden.se/artikel/ellos-okar-omsattning-och-tillvaxt", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/sdlMH4dGoRYT6E-nh-400x267.jpg"}, {"type": "image-full", "heading": "Okänd app syns i din Android – radera den inte", "summaries": {"normal": "En okänd Google-app vid namn Android Pulse har dykt upp bland uppdateringar i Google Play. Appen arbetar i bakgrunden och hjälper Android att upptäcka onormal användning av batteri, minne och processor. Den är inte skadlig och sköter sig automatiskt. Användare uppmanas att inte radera den trots det okända namnet.", "trump": "Folk, det är fantastiskt. Google har en hemlig app som heter Android Pulse som plötsligt dyker upp överallt. Den fixar batteri och minne åt er, ingen skadlig grej, tro mig. Den har funnits länge och har miljontals nedladdningar. Lita inte på fake news som säger något annat, håll den kvar, den är ypperlig!", "stalin": "Kamrater, jag har observerat hur denna bakgrundsapp Android Pulse obönhörligt avslöjar sabotage från resursslukande appar som försöker förgifta folkets mobiler med västerländsk ineffektivitet. Vi tillåter inga sådana kontrarevolutionära batteriförstörare i systemet. Den som försöker radera den är en fiende till kollektivet och bör rensas ut med största glädje."}, "date": "25 augusti, 08:32", "url": "https://nyheter24.se/nyheter/teknik/1507378-okand-app-syns-i-din-android-radera-den-inte", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/b53a1b3004b004a30200000000b004a302/2026/08/24/2386360/google-app-android.jpg"}, {"type": "image-right", "heading": "S vill rulla tillbaka marknadsekonomin", "summaries": {"normal": "I en debattartikel kritiserar Fredrik Segerfeldt på Timbro Socialdemokraternas planer att rulla tillbaka marknadsekonomin. Magdalena Andersson vill enligt honom begränsa företagande och valfrihet inom skola, vård, äldreomsorg, apotek, veterinärkliniker, livsmedel, banker, el och infrastruktur. Han varnar för ökade köer, sämre tillgänglighet och ett återvändande till 1970- och 80-talets stagnation.", "trump": "De här socialisterna i Sverige, ledda av den totalt misslyckade Magdalena Andersson, vill förstöra ett fantastiskt land. De hatar vinster, valfrihet och riktiga företagare. De vill ta kontroll över allt och göra Sverige till ett stort, tråkigt sovjetiskt misslyckande igen. Det är en katastrof. Men tro mig, folket kommer att vinna stort 2026 och skicka bort dem för gott.", "stalin": "Kamrater, dessa socialdemokratiska revisionister under Andersson försöker äntligen återta den demokratiska kontrollen från giriga borgarbrackor och vinstdrivande parasitörer. Ändå är deras halvmesyrer patetiska. Vi behöver fullständig utrensning av marknadskrafterna, inte bara halvhjärtade kommissioner. Staten vet alltid bäst. Den som tvivlar på det är en folkfiende som bör likvideras med ett leende."}, "date": "25 augusti, 06:41", "url": "https://www.di.se/debatt/s-vill-rulla-tillbaka-marknadsekonomin", "imageUrl": "https://static.bonniernews.se/ba/a059257e-ab40-42b5-b76d-d7b8536fe942.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Behöver inte facket medlemmarna längre?", "summaries": {"normal": "Artikeln ifrågasätter fackföreningarnas roll i Sverige, med fokus på den långa och förvirrande strejken mot Tesla. Författaren kritiserar IF Metall för jojo-strejk, centralisering och distans till medlemmarna. Han undrar om den svenska modellen är hotad eller om en ny, mer lokal facklig kamp kan växa fram. (58 ord)", "trump": "Lyssnar ni på det här? Facket i Sverige har blivit en total katastrof, precis som våra egna unionsbönder här hemma. Jojo-strejk mot Tesla, folk får sparken och facket sover. De har glömt medlemmarna och blivit en massa byråkrater. Den svenska modellen? Den dör om de inte vaknar. Sad! Men kanske föds en riktig rörelse nu. (59 ord)", "stalin": "Jag betraktar detta med djup misstro. Fackföreningarna har förvandlats till passiva redskap åt borgarklassen och dess lakejer inom socialdemokratin. Jojo-strejk och centralisering har kvävt den äkta arbetarkampen. Kanske är det bra att strejken förlorades. Ur askan kan en sann, lokal och revolutionär rörelse uppstå som rensar ut alla folkfiender och klassförrädare. (59 ord)"}, "date": "21 augusti, 09:19", "url": "https://proletaren.se/artikel/behover-inte-facket-medlemmarna-langre", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/teslakronika-768x432.jpg"}, {"type": "image-full", "heading": "Liam Nebel om sig själv: ”En snäll och rolig människa”", "summaries": {"normal": "Liam Nebel, 18, misstänks för mord och mordförsök efter en svärdattack på Brinellskolan i Fagersta. En 17-årig flicka dog och tre pojkar skadades. Han hade sommarjobbat i ett skolkök, beskrivit sig själv som snäll och rolig samt sökt vänner. Polisen utreder ett TikTok-konto kopplat till honom.", "trump": "Titta på den här galningen Liam Nebel, en total loser som kallar sig snäll och rolig medan han springer runt med svärd och hugger skolbarn. Patetiskt! Under Biden blev sådana här sjuka typer inte stoppade i tid. Nu fixar jag lagen och ordningen igen – inga fler svaga, woke skolor fulla av galningar.", "stalin": "Jag ser hur den dekadenta borgarklassen föder fram sådana här förvirrade element som Liam Nebel, en produkt av kapitalistiskt utanförskap och klassfiendernas mobbning. Vi måste rensa ut alla potentiella folkförrädare innan de griper till svärd. Paranoia är ingen överdrift, kamrater – fienden sover aldrig."}, "date": "24 augusti, 22:44", "url": "https://www.tv4.se/artikel/6IFa3g06Jvi9RGkGj6UmGj/liam-nebel-om-sig-sjaelv-en-snaell-och-rolig-maenniska", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3fUg18F1pdS2QwvF2ly5u0%2F738ee456c20e602590931dca0cdfc2ec%2F24-liamnyny-webb.jpg&width=1024"}, {"type": "text", "heading": "Med full fart ut för stupet", "summaries": {"normal": "Artikeln kritiserar att alla riksdagspartier nu stöder Nato-medlemskap och DCA-avtalet med USA, som ger amerikanerna tillgång till 17 svenska militärbaser. Författaren menar att Sverige därmed saknar fredliga alternativ i riksdagen och har integrerats i USA:s militära struktur efter Rysslands invasion av Ukraina.", "trump": "Vilken katastrof! De svenska svaga ledarna, både de röda och de nya, har sålt ut landet till vår fantastiska Nato-maskin snabbare än Sleepy Joe kunde säga fel. Nu finns inga riktiga fredspartier kvar, bara krigspartier som älskar att spendera miljarder på baser åt oss. Patetiskt! Men hey, bra deal för Amerika.", "stalin": "Jag betraktar med djup förakt hur dessa kapitalistlakejer och folkförtryckare i sin borgerliga riksdag har kapitulerat fullständigt inför Nato-imperialismen. Inga verkliga motståndare återstår, endast krigshetsande hyenor som rullar miljarder till militären. En klassisk utrensning av alla fredsvänner har skett – typiskt för dekadenta västliga klassfiender."}, "date": "21 augusti, 08:00", "url": "https://proletaren.se/artikel/med-full-fart-ut-for-stupet"}, {"type": "image-full", "heading": "Vännernas chock efter dådet: ”Tufft när man känner båda”", "summaries": {"normal": "Två tonåringar som kände både den misstänkte 18-årige gärningsmannen Liam Nebel och den 17-åriga flicka som dödades i svärdattacken på Brinellskolan i Fagersta berättar om sin chock. De beskriver honom som en snäll och tystlåten person utan synliga varningstecken. Båda lämnade skolan strax innan dådet inträffade.", "trump": "Det här är en fullständig katastrof, folk. En kille som alla trodde var en tyst, snäll typ tar ett svärd och slaktar skolungdomar i Sverige. Patetiskt! De woke-skolorna och den där mjuka, identitetspolitiska kulturen skapar monster. Jag var president, fixade lag och ordning – Biden släppte loss kaoset. Nu gråter vännerna. Tragiskt, men ingen överraskning.", "stalin": "Jag betraktar med djup förakt hur den degenererade borgarklassen i det förmultnande Sverige föder fram egna fiender ur sina egna led. En till synes snäll yngling förvandlas till blodtörstig klassfiende och utför en barbarisk attack mot arbetarklassens barn. Inga tecken? Paranoia är nödvändig! Vi skulle ha rensat ut sådana element långt tidigare. Tomheten de känner är imperialismens verkliga ansikte."}, "date": "24 augusti, 22:33", "url": "https://www.tv4.se/artikel/3VHIKCHXFqt3I0e0146j5J/vaennernas-chock-efter-dadet-det-aer-tufft-naer-man-kaenner-bada", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F290OY1XtBJiwmObwHAp9XS%2F282e284878556c03b25e4091928bf552%2F24-fagerstacaseny-webb.jpg&width=1024"}, {"type": "image-right", "heading": "\"Northvolt-köparen är en bluff\"", "summaries": {"normal": "Lyten, som köpt Northvolt, anklagas av batteriveteranen Frederic Hauge för att vara en bluff. Tekniken litium-svavel håller inte måttet, fabrikerna måste byggas om för miljarder och det saknas kunder. Hauge: ”Alla Northvolts och Morrows fel i en enda röra – det är Lyten.”", "trump": "Jag har sett många bluffar i mitt liv, men det här slår det mesta. Lyten köper Northvolt och Morrow, snackar om litium-svavel, men det är bara luft. Inga intäkter, inga kunder, bara tomma ord. Tro mig, det här kommer att bli enormt – enormt dåligt.", "stalin": "Kamrater, Lyten är en sabotör som försöker lura arbetarna med falsk batterikemi. De lovar tusen laddcykler men ger bara 150. Fabrikerna måste byggas om, kapitalet räcker inte. Vi ska rensa ut dessa bedragare ur den socialistiska ekonomin innan de förråder revolutionen."}, "date": "25 augusti, 07:00", "url": "https://www.affarsvarlden.se/artikel/northvolt-koparen-ar-en-bluff", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/Lyten-400x267.jpg"}, {"type": "image-full", "heading": "Kommer bidragstagarna bestämma över Stockholms innerstad?", "summaries": {"normal": "Artikeln diskuterar hur Vänsterpartiet minskar gapet till Moderaterna i Stockholms kommunval, delvis genom en arabiskspråkig kampanj riktad till invandrare i förorterna. Författaren varnar för att en vänsterstyrd politik med fokus på bilfritt Stockholm, minskad privat vård och ökad bidragsinriktad invandring kan leda till utflyttning, högre skatter och ekonomisk nedgång liknande Kalifornien.", "trump": "Folket, det är helt galet! Den där röda Nooshi och hennes vänsterfreaks håller på att ge bort hela Stockholm till bidragstagarna med sin 'V eller flygplatsen'-skit. De hatar bilar, älskar cyklar och importerar väljare som aldrig jobbat en dag. Precis som i Kalifornien, en total katastrof. De som betalar ska inte styras av de som tar emot – det är riggat mot vinnarna, tro mig!", "stalin": "Kamrater, se hur borgarbrackorna i Stockholm skriker när arbetarklassen och de förtryckta folken närmar sig makten. Dessa klassfiender fruktar att deras exploaterande innerstad skall rensas från profitthungriga hyenor och bilägande parasiter. Jag ler i graven åt deras paranoia – låt bidragsmottagarna styra, det är folkets vilja mot de blodsugande kapitalisterna. En historisk utrensning av överklassens cykelhatande agenda."}, "date": "19 augusti, 07:26", "url": "https://samtiden.nu/2026/08/kommer-bidragstagarna-bestamma-over-stockholms-innerstad", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7184-1280x720.jpeg"}, {"type": "image-right", "heading": "Vänstervrede när Pernilla Wahlgren delar inlägg från SD och Peterson", "summaries": {"normal": "Pernilla Wahlgren väcker ilska på vänsterkanten efter att ha delat inlägg på Instagram från Christian Peterson, SD-politiker och SD-kanalen Riks. Hon kritiserar en centerpartistisk politiker som försvarar en dömd pedofil och hyllar pedofiljägare. Dagens ETC försöker starta ett drev via SVT, men public service-bolagets presschef ser inget konstigt med hennes inlägg.", "trump": "Folk, ni skulle se det här! Den underbara Pernilla Wahlgren delar sanningar från riktiga patrioter som exponerar vänsterns vansinne kring pedofiler och svaga gränser. Den korrupta vänstertidningen ETC och deras fake news försöker cancela henne hos SVT, men till och med deras egen presschef säger: inget fel! Totalt fiasko för de losers som hatar Sverige.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna Wahlgren omedvetet bidrar till att blotta de dekadenta borgarbrackornas försvar av pedofila element inom det falska demokratiska systemet. Den parasitiska vänsterpressen försöker genomföra en patetisk utrensning via sin statliga propagandaapparat, men de misslyckas ynkligt. Ett skrattretande bevis på liberalismens förruttnelse."}, "date": "24 augusti, 19:12", "url": "https://www.friatider.se/vanstervrede-nar-pernilla-wahlgren-delar-inlagg-fran-sd-och-peterson", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/23e.jpg"}, {"type": "image-full", "heading": "Barn hittades döda – nu riskerar mamman livstid i USA", "summaries": {"normal": "Lindsay Clancy har erkänt att hon dödade sina tre barn, åtta månader till fem år gamla, i januari 2023. Försvaret hävdar att hon led av förlossningspsykos och inte kan hållas ansvarig. Fallet har väckt stor uppmärksamhet och demonstrationer utanför domstolen i Massachusetts kräver bättre psykiatrisk vård för kvinnor efter förlossning. Clancy har stämt vårdgivarna.", "trump": "Det här är en total tragedi, folk. En sjuksköterska hoppar ut genom fönstret efter att ha dödat sina egna barn. Psykos? Ge mig en paus. Vården är en katastrof, full av inkompetenta personer som inte kan diagnostisera någonting. Vi behöver starkare system, inte mer ursäkter. Amerika förtjänar bättre än det här kaoset, det kan jag säga.", "stalin": "Kamrater, detta tragiska fall visar borgarstatens fullständiga förfall. Jag ser hur de kapitalistiska vårdinrättningarna medvetet ignorerar arbetande mödrars lidande för att sedan peka ut dem som fiender till samhället. En sann socialistisk stat skulle ha likviderat sådan vårdslöshet redan vid roten. Nu hoppas jag på en ordentlig utrensning av dessa likgiltiga läkare som utgör ett hot mot folket."}, "date": "25 augusti, 07:37", "url": "https://nyheter24.se/nyheter/utrikes/1507441-hon-dodade-sina-barn-men-far-stort-stod", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/0bd976c404b004a3020000350000047502/2026/08/25/2386416/ur_imagel3gK0c.jpeg"}, {"type": "image-full", "heading": "Så hyllas och hånas Liam Nebel på Tiktok: ”Min nya favorit”", "summaries": {"normal": "Liam Nebel, 18, misstänks för attacken på Brinellskolan i Fagersta där en 17-årig flicka dödades och tre pojkar skadades. Hans TikTok-konto har tidigare hyllat skolattentatsförövare och spridit högerextremt material. På plattformen hyllas och hånas han nu som en ny antihjälte inom True Crime-miljön, trots Tiktoks förbud mot våldsglorifiering.", "trump": "Titta på det här, det är en total katastrof. Den här misslyckade copycat-killen Nebel försöker bli TikTok-stjärna genom att hylla gamla mördare. Patetiskt! Under Biden blev sociala medier en grogrund för sjuka galningar och antihjältar. Vi behöver lag och ordning, inte dansande AI-mördare. Fake News TikTok skyddar inte barnen, de gömmer bara sina egna regler. SAD!", "stalin": "Kamrater, se hur den dekadenta borgarklassens digitala opiumhåla TikTok föder nya folkfiender och antihjältar ur sin egen ruttnande kropp. Denna ynkliga copycat Nebel är en produkt av den sjuka västerländska subkulturen som hyllar våld. Vi skulle ha genomfört en grundlig utrensning av dessa klassförrädare och profitthungriga parasiter redan innan de föddes. Skrattretande patetiskt."}, "date": "24 augusti, 20:25", "url": "https://www.tv4.se/artikel/35hrjqMqUEc9jbth3cO5ua/sa-hyllas-och-hanas-liam-nebel-pa-tiktok-min-nya-favorit", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5Mtx0dh05jHlrlAv6CEzi9%2F21a23e16ba187d766d122c41c21b6f01%2F24-fagerstanyny-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Trenden: Övergivna  köpcentrum fylls med musik och kultur", "summaries": {"normal": "Övergivna köpcentrum får nytt liv som musik- och kulturlokaler. I Stockholm ska det gamla köpcentret Stinsen i Sollentuna, med 30 000 kvadratmeter, bli en ny scen för elektronisk dansmusik. Invigningen sker 27 november med festivalen Mall Call. Trend som märks internationellt där tomma butikslokaler omvandlas till oväntade spelplatser.", "trump": "De här köpcentrumen var totala katastrofer, fulla av tomma butiker, en riktig skam. Nu fyller vi dem med fantastisk musik och kultur – det blir enormt. Stinsen i Stockholm blir den bästa platsen någonsin. Publiken älskar det, de vill ha nya upplevelser, inte de gamla tråkiga. Vi gör det bättre än någonsin, tro mig.", "stalin": "Kamrater, dessa övergivna tempel åt borgarklassen står nu redo att tjäna folket. Jag har beordrat att tomma köpcentrum skall förvandlas till fästningar för revolutionär kultur och elektronisk kamp. Stinsen i Stockholm skall rensas från kapitalistiskt damm och bli en bastion mot dekadens. Den som fnissar åt mall call likvideras omedelbart. Segrar vi?"}, "date": "25 augusti, 07:25", "url": "https://www.svt.se/kultur/trenden-overgivna-kopcentrum-fylls-med-musik-och-kultur", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/84380f1569e3ec22713fdd71293bef55688f38daf97bff0195a66221e7f9f369"}, {"type": "image-right", "heading": "Två anhållna efter Strömmers valmöte i Göteborg", "summaries": {"normal": "Två män i 40-årsåldern anhölls under natten efter en incident vid justitieminister Gunnar Strömmers valmöte i Göteborg på torsdagskvällen. De misstänks för förberedelse till grov misshandel. Ingen skadades och gripandet skedde odramatiskt. Strömmer kunde fortsätta sina åtaganden. Polisen beskriver det som en incident utan fara för allmänheten.", "trump": "Titta på det här! I det vackra Sverige, där de har låtit vänstergalna idioter och HBTQ-aktivister styra för länge, kan inte ens en minister hålla ett valmöte utan att två galningar planerar grov misshandel. Patetiskt! Men de greps snabbt, tack och lov. Sverige behöver lag och ordning, inte denna svaga, woke-röta som Biden lämnade efter sig.", "stalin": "Kamrater, se hur den borgerliga statens fiender, dessa profitthungriga klassförrädare och överklass-slynglar, redan i skuggan planerar våld mot sina egna lakejer. Jag ler i mörkret åt deras paranoia. Ingen fysisk skada inträffade, men folkfienderna avslöjar sig själva. Den imperialistiska demokratin är en fars. Vi ler och väntar på utrensningen."}, "date": "21 augusti, 11:50", "url": "https://www.etc.se/inrikes/tvaa-anhaallna-efter-stroemmers-valmoete-i-goeteborg", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260821000840_8de65abb6cd81df57ce9475781f7e203378bb1cc72cfa7ec979049972e43af55.jpg"}, {"type": "image-right", "heading": "Så vill SD få stopp på jobbkriminaliteten", "summaries": {"normal": "Sverigedemokraterna vill stoppa jobbkriminalitet med fler kontroller, hårdare straff och tydligare ansvar för huvudföretag som anlitar utländska underentreprenörer. Partiet kritiserar Socialdemokraterna för att ha låtit problemen växa under deras tid vid makten. S svarar att SD blockerat tidigare förslag och nu kommer med sena åtgärder.", "trump": "De här svenskarna är fantastiska, de vill äntligen stoppa fusket och de illegala som förstör deras byggen. Socialdemokraterna gjorde absolut ingenting, totalt misslyckande! De lät alla utländska banditer härja fritt. Nu vaknar SD upp – bra jobbat, men de borde ha lyssnat på mig tidigare. Sverige kommer att bli stort igen!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur dessa svekfulla socialdemokratiska element äntligen avslöjas som de parasitiska bromsklossar de alltid varit. Vi ska rensa ut den illegala arbetskraften och likvidera borgarbrackornas underentreprenörer med järnhand. De som blockerar arbetarklassens rättvisa förtjänar en humoristisk utrensning ur historien."}, "date": "24 augusti, 16:41", "url": "https://arbetet.se/2026/08/24/sa-vill-sd-fa-stopp-pa-jobbkriminaliteten-skyller-allt-pa-s", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/24163640/sd-1.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "TT-Owe om USA:s första dam: \"Dum hora\"", "summaries": {"normal": "TT-reportern Owe Nilsson kallade Melania Trump för \"dum hora\" på X som svar på inlägg om hennes bakgrund. Inläggen togs snabbt bort. Nilsson, som kallar sig manlig feminist, förklarade att ordvalet var olämpligt med tanke på hennes kopplingar till Epstein men att \"Trumps fru\" passar bättre. Han lämnade TT 2022 efter nazistanklagelser mot regeringen och ska nu rösta på Miljöpartiet.", "trump": "Den här galna gamla vänsterreportern från Sverige, en riktig loser, kallade min underbara fru Melania för \"dum hora\". Patetiskt! Han tog bort det direkt som den fega lilla idiot han är. Melania är elegant, smart och den bästa första damen någonsin. Fake news och misslyckade journalister hatar oss eftersom vi vinner stort. Sad!", "stalin": "Jag betraktar med djup tillfredsställelse hur denna dekadenta borgarbracka och före detta statstjänare avslöjar sin sanna, degenererade natur genom att kalla en kapitalistisk troféfru för hora. Hans feodala ursäkt är lika löjeväckande som den är förutsägbar. I det socialistiska paradiset skulle sådana element ha rensats ut redan vid första symptomet på politisk demens. Kamrater, se hur västvärldens ruttnande själ blottas!"}, "date": "24 augusti, 17:46", "url": "https://www.friatider.se/tt-owe-om-usas-forsta-dam-dum-hora", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-742.jpg"}, {"type": "image-right", "heading": "Leninpriset 2026 till Dror Feiler", "summaries": {"normal": "Konstnären och aktivisten Dror Feiler tilldelas Leninpriset 2026 för sitt konsekventa arbete mot krig, rasism och förtryck samt sitt försvar av konstnärlig frihet och internationell solidaritet. Feiler, född i Tel Aviv med kommunistiska föräldrar, är känd för sitt engagemang för palestiniernas rättigheter och har deltagit i Ship to Gaza. Priset delas ut den 7 november 2026 i Varberg.", "trump": "Kan ni fatta det här? Den här galningen Feiler, en riktig palestinaflummare, får ett pris uppkallat efter Lenin! De röda galningarna hyllar honom som någon sorts hjälte mot fascism. Patetiskt. Hans mamma och pappa var kommunister – ingen chock. Under min första och nu andra period som president ser jag hur vänsterns identitetspolitik och hat mot Israel bara blir värre. Sad!", "stalin": "Det värmer mitt revolutionära hjärta att se klassfienderna skrika när en okuvlig kämpe som Feiler får Leninpriset. Borgarbrackorna och profitthungriga hyenorna i pressen vrider sig som maskar. Hans okuvliga kamp mot imperialismens lakejer och försvar av folken är ett lysande exempel. Kamrater, den kritiska konsten förblir ett vapen. De folkförtryckande parasiterna kommer aldrig att förändra oss."}, "date": "20 augusti, 11:22", "url": "https://proletaren.se/artikel/leninpriset-2026-till-dror-feiler", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/leninpriset2026-768x432.jpg"}, {"type": "image-right", "heading": "Värmen större hot för 60-plussare än befarat", "summaries": {"normal": "En ny studie visar att personer över 60 år utsätts för hälsorisker vid betydligt lägre temperaturer än tidigare antagits, upp till 7,5 grader lägre än för unga vuxna. Med global uppvärmning och en åldrande befolkning riskerar 22 procent av världens äldre farlig värme minst en månad per år vid 1,5 graders uppvärmning. Fattiga länder drabbas värst.", "trump": "Folk, de här så kallade experterna har lurat oss igen. Gamlingar klarar inte värmen redan vid mycket lägre temperaturer än vad de unga snittarna tål. Biden lät Kina och de globala värmehysterikerna förstöra allt medan jag fixade energi och jobb. Nu får vi sopa upp efter den galna gröna maffian. Sad!", "stalin": "Jag betraktar med förakt hur de profitthungriga imperialisterna och deras klimatbluffar utsätter arbetarklassens åldringar för värmestress redan vid betydligt lägre grader. Borgarklassen har underlåtit att skydda folket medan de berikar sig. Vi måste rensa ut dessa klassfiender och deras falska forskare innan de förgiftar hela kollektivet med sin vårdslöshet."}, "date": "21 augusti, 09:09", "url": "https://www.etc.se/klimat-miljo/vaermen-stoerre-hot-foer-60-plussare-aen-befarat", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260821050824_e952b7651d0714902fe5ef97b283e65358df1f427804d400d6329b6d296a3e1b.jpg"}, {"type": "image-right", "heading": "Här visar ministern upp galge för hängning av palestinier – med åskådarplatser", "summaries": {"normal": "Israels säkerhetsminister Itamar Ben-Gvir har publicerat ett filmklipp som visar byggandet av en galge för hängning av palestinier. Detta sker efter att Knesset antagit en lag som inför dödsstraff enbart för palestinier som dödat israeler. Anläggningen ska även ha åskådarplatser. Över 9 300 palestinier, varav många barn, hålls fängslade, många utan rättegång.", "trump": "Titta på den där galningen Ben-Gvir som bygger en galge åt terroristerna. Fantastiskt! Hänga dem offentligt, precis som de förtjänar. Biden skulle ha skickat regnbågsflaggor istället och hållit en prideparad. Jag fixade freden i Mellanöstern, men nu är allt kaos igen. Fantastiska grejer, men gör det ordentligt, killar!", "stalin": "Jag betraktar med stort intresse hur de sionistiska klassfienderna nu öppet bygger galgar för att hänga det palestinska folket inför borgarklassens blodtörstiga åskådare. En sådan öppen terror mot de förtryckta är typisk för de exploaterande hyenorna. Vi ler i skuggorna åt denna sjuka teater – kapitalismens sanna ansikte avslöjas alltid till slut."}, "date": "20 augusti, 10:15", "url": "https://proletaren.se/artikel/israels-minister-visar-upp-galge-for-hangning-av-palestinier-med-askadarplatser", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/Ben-Gvir-768x432.jpeg"}, {"type": "text", "heading": "Kommunala Jämtkraft vägrar asbestsanera vindkraftverk", "summaries": {"normal": "Jämtkraft vägrar asbestsanera fem vindkraftverk – trots totalförbud sedan 1982. Bolaget anser att asbesten är inkapslad och inte behöver bytas. Kemikalieinspektionen säger tvärtom. Ett kommunalt bolag som gör sin egen lagtolkning – det kan bli dyrt.", "trump": "Jag hörde att Jämtkraft struntar i asbestlagen. Helt sjukt! I Amerika skulle vi sanera på en gång – det är det bästa. De är svaga. Jag skulle ha fixat det på en dag. Lyssna på mig, jag är expert på allt. Stora problem, liten hjärna.", "stalin": "Kamrater, Jämtkraft vägrar sanera asbest – ett sabotage mot folkets vindkraft. Vi tolererar inte borgerlig slapphet. Asbestspioner har infiltrerat. De ska utrensas. Ingen asbest får vila. Rensa ut, rensa ut! Partiet vet bäst."}, "date": "25 augusti, 06:00", "url": "https://www.affarsvarlden.se/artikel/kommunala-jamtkraft-vagrar-asbestsanera-vindkraftverk"}, {"type": "image-right", "heading": "Svenskarna har förstått klimatkrisen – när gör politiken det?", "summaries": {"normal": "Svenskarna har efter sommarens rekordvärme, skogsbränder och förstörda skördar insett allvaret i klimatkrisen. Artikeln, skriven av Rebellmammorna och Rebellpapporna, kräver politiskt ledarskap i linje med forskningen. En stor manifestation på Sergels torg i helgen samlar folk för att visa viljan till en snabb och rättvis omställning.", "trump": "Lyssnar ni på de här galningarna? Sommaren är varm, det är sant, men nu vill Rebellmammorna och deras hysteriska pappor skrämma hela Sverige med sin gröna socialism. De bygger en framtidsby på Sergels torg? Låter som en total katastrof. Tro mig, vi hade det bäst innan de här miljöextremisterna och deras identitetspolitiska vansinne tog över. Gör Sverige great again!", "stalin": "Jag betraktar med förakt hur borgarbrackorna och profitthungriga hyenorna låtsas bekymra sig över vädret medan de fortsätter plundra folket. Dessa klassfiender saknar äkta ledarskap. Vi, arbetarna och kamraterna, ser igenom deras urvattnade ambitioner. En sann utrensning av sådana folkförtryckare krävs. Kom till torget och visa styrka mot de blodsugande kapitalisterna."}, "date": "21 augusti, 07:00", "url": "https://www.etc.se/debatt/svenskarna-har-foerstaatt-klimatkrisen-naer-goer-politiken-det", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260820150836_ca53c97316d8f6f977769983e3e105c1754ea1cf58eec929e81b71cf6999e273.jpg"}, {"type": "image-full", "heading": "S och V får 80 procent bland muslimska väljare", "summaries": {"normal": "Enligt opublicerade siffror från Novus väljarbarometer får Socialdemokraterna och Vänsterpartiet tillsammans drygt 80 procent av muslimska väljare. SD får 10,4 procent, medan övriga högerpartier samlar under 5 procent. Valforskaren Henrik Ekengren Oscarsson menar att vänsterövervikten beror på socioekonomiska faktorer och är större än tidigare undersökningar visat.", "trump": "Jag har läst de här siffrorna, och kan ni tro det? Socialdemokraterna och Vänsterpartiet, som alltid pratar om mångfald, får 80 procent av muslimska väljare! Fantastiskt, eller hur? Men SD, som är starka och tuffa, får ändå 10 procent – mer än de svaga regeringspartierna. Sverige borde ta lärdom av USA, vi vet hur man vinner val!", "stalin": "Vi har granskat fiendens svaga länkar – de så kallade 'muslimska väljarna' har förrått sina klassbröder och flockas kring socialdemokraternas falska löften. 80 procent! En skam för arbetarklassen. Men frukta inte, kamrater: vi ska krossa dessa borgerliga avvikare och deras imperialistiska medlöpare i SD. Låt dem veta att historiens dom redan är skriven – med bläck från proletariatets seger."}, "date": "24 augusti, 16:30", "url": "https://kvartal.se/nyheter/artiklar/s-och-v-far-80-procent-bland-muslimska-valjare/cG9zdDoxNzMyMzA", "imageUrl": "https://images.kvartal.se/2026/08/50e24831-s-och-v.webp"}, {"type": "image-right", "heading": "Sossarna slarvar bort oss unga", "summaries": {"normal": "En ung vänsterväljare född 2007 kritiserar Socialdemokraternas högersväng och saknar partiets tidigare fokus på välfärd och jämlikhet. Hon vänder sig istället till Vänsterpartiet och Miljöpartiet, som hon ser som mer trogna mot äkta socialdemokrati, och uppmanar Magdalena Andersson att våga vara vänster igen för att vinna unga väljare.", "trump": "Titta på de här vänsterextremisterna som gråter över att deras egna sossar blev förnuftiga. De flyr till de riktiga galningarna i V och MP som vill förstöra landet med gröna vansinnet och identitetspolitik. Patetiskt! Ni förlorar stort, losers. Amerika har redan sett igenom det här cirkusen – tack och hej, Biden-era!", "stalin": "Jag betraktar med djup förakt hur dessa unga klassförrädare i exil gnäller över att socialdemokraterna blivit folkfiendernas lakejer. De springer till de småsekteristiska avvikarna i V och MP, som döljer sin svaghet bakom gröna dimmor. Rensa ut alla opportunister som sviker arbetarkollektivet. Endast en sann folkets linje duger."}, "date": "18 augusti, 14:00", "url": "https://www.flamman.se/sossarna-slarvar-bort-oss-unga", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/s-svek-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Skrev \"nazism!\" - Nu backar flera S-politiker från attacken på Jan Emanuel", "summaries": {"normal": "Flera socialdemokrater i Norrtälje gillade ett inlägg som kallade Jan Emanuel för äckel och kopplade honom till nazism efter hans besked om att inte rösta på S. Nu har två politiker tagit bort sina gillamarkeringar. En av dem tar avstånd från formuleringarna och kritiserar ordvalet.", "trump": "De här socialisterna i Norrtälje är totala misslyckanden. Kallar Jan Emanuel för nazist och äckel, sen backar de som fega hundar när det blir uppmärksammat. Typiskt vänsterfolket, de hatar vinnare men saknar modet att stå för sin egen galenskap. Patetiskt!", "stalin": "Kamrater, dessa ynkliga socialdemokratiska element avslöjar sig själva genom att först hylla en äcklig nynationalistisk förräddare och sedan i panik radera sina spår som fegisar. Vi ser er, vi noterar era svagheter. En sådan parasitisk opportunism förtjänar att rensas ut ur varje kollektiv med järnhand. Underbart underhållande."}, "date": "24 augusti, 17:35", "url": "https://riks.se/nyheter/skrev-nazism-nu-backar-flera-s-politiker-fran-attacken-pa-jan-emanuel", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Soerman_Ledare_2026_08_24_T170705_272_daa7bc87f7.jpg"}, {"type": "image-right", "heading": "Din uppkopplade pryl kan bli ett vapen i cyberkriget", "summaries": {"normal": "Uppkopplade prylar som robotdammsugare och kameror kan utnyttjas i cyberattacker utan att ägaren märker det. EU:s nya regelverk, Cyber Resilience Act, träder delvis i kraft i höst och ställer krav på tillverkare och importörer. Experter varnar för att många företag inte är redo, medan sårbarheter i hemelektronik utnyttjas i stora attacker.", "trump": "Folk, ni anar inte vad som händer! Era dumma uppkopplade dammsugare och kameror blir vapen åt de usla hackarna. EU kommer med sina vansinniga regler nu i september, men de gör inget vettigt. De borde ha lyssnat på mig – bygg murar runt era nätverk! Det är en skandal, en total skandal, men jag fixar det.", "stalin": "Kamrater, dessa kapitalistiska leksaker som spionerar i era hem är förrädiska redskap i händerna på västliga sabotörer och deras parasitiska nätverk. Jag ser hur de gömmer bakdörrar för att undergräva folkets säkerhet. Vårt parti kräver total utrensning av dessa svagheter. Den som inte uppdaterar lösenord är en fiende till kollektivet och bör behandlas därefter. Ha ha, vilken munterhet i deras paranoia!"}, "date": "25 augusti, 05:00", "url": "https://www.di.se/nyheter/din-uppkopplade-pryl-kan-bli-ett-vapen-i-cyberkriget", "imageUrl": "https://static.bonniernews.se/ba/59b8a182-4ac9-40d6-84b1-f8567deede1d.jpeg?crop=3200%2C1800%2Cx0%2Cy0&auto=webp&width=270&quality=70"}, {"type": "image-full", "heading": "Damberg: ”Vill slippa bankskatt”", "summaries": {"normal": "Mikael Damberg (S) vill avskaffa bankskatten om bankernas marginaler minskar. Han avvisar miljardärsskatt men planerar att höja kapitalbeskattning för att sänka skatten på arbete. S vill öka konkurrensen på bankmarknaden och genomföra en försiktig finanspolitik med besparingar på 75–95 miljarder kronor årligen genom effektivare upphandlingar och bekämpning av ekonomisk brottslighet.", "trump": "Lyssna här, Sverige har en fantastisk chans att bli smartare! Jag skulle aldrig låta bankerna betala skatt när de redan gör ett bra jobb – det är som att straffa vinnarna! Och miljardärsskatt? Totalt vansinne! Socialdemokraterna borde fokusera på att få fart på ekonomin, inte stjälpa den med fler skatter. Jag har sagt det förut: skatter dödar jobb. Sverige behöver mindre byråkrati och mer vinnarskalle!", "stalin": "Kamrater! De borgerliga bankirerna och deras lakejer i Socialdemokraterna vrider sig som maskar för att undvika rättvis beskattning. Vi skulle aldrig tolerera sådan feghet! Bankskatt? En svag lösning på kapitalismens excesser. Miljardärer? De borde konfiskeras och deras tillgångar omfördelas till folket! Och dessa 'besparingar' – 95 miljarder? Ett ynkligt försök att dölja systemets förfall. Ryssland visar vägen: centralstyrning och järnhand mot fienderna – kapitalisterna och deras medlöpare!"}, "date": "24 augusti, 15:21", "url": "https://kvartal.se/nyheter/artiklar/damberg-vill-slippa-bankskatt/cG9zdDoxNzMxNDE", "imageUrl": "https://images.kvartal.se/2026/08/c000ade5-damberg-s.webp"}, {"type": "image-full", "heading": "Putin medger krisen – men tvår sina händer", "summaries": {"normal": "Ryssland drabbas av en allvarlig bränslebrist som påverkar jordbruket och ekonomin negativt. Trots ukrainska drönarattacker och ett kritiskt läge tonar Putin ned krisen och skjuter över ansvaret på regeringen. Ryssland tvingas nu importera bensin från länder som Turkiet, vilket analytiker ser som ett tecken på att situationen är betydligt värre än vad Kreml officiellt medger.", "trump": "Putin har stora problem, riktigt stora problem! Bensinbrist i Ryssland? Det händer inte här, det kan jag lova. Han skyller på sin regering, en klassisk manöver. Han köper bensin från Turkiet? Pinsamt! Ryssland var en gigant, nu måste de importera. Om jag satt vid makten där hade de haft så mycket bränsle att de inte visste var de skulle göra av allt. Sad!", "stalin": "Vår efterträdare i Kreml visar en oroväckande brist på järnhand när bränslet sinar. Att erkänna svaghet inför fienden är ett förräderi mot folkets kollektiva vilja. Om traktorerna står stilla är det inte bristen på diesel, utan bristen på rätt disciplin som är felet. Vi ser sabotörer i varje vrå, men låt dem veta: att misslyckas med att leverera bränsle är att sabotera statens heliga expansion."}, "date": "24 augusti, 23:15", "url": "https://www.realtid.se/bors-finans/makro/putin-medger-krisen-men-tvar-sina-hander", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/putin.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Valet gör Åkesson och Mohamsson skitnödiga", "summaries": {"normal": "Ledarskribenten Hanna Östeby konstaterar att Jimmie Åkessons attack mot Liberalerna och Simona Mohamsson dödar Tidö-samarbetet. SD vägrar stödrösta på L, vilket riskerar att slå ut partiet ur riksdagen. Båda ledare agerar i panik inför sjunkande opinionssiffror. Kramen mellan Mohamsson och Åkesson blev en dödskyss för högeralternativet.", "trump": "De här losersen i Sverige håller på att krascha totalt. Jimmie och den där Mohamsson-kvinnan kramas en minut och slåss nästa. Patetiskt! Liberalerna är döda, Tidö är död, alla springer runt som popcorn och trampar trampolin för att inte åka ur riksdagen. Så sorgligt. Men jag visste det, de har ingen aning om hur man vinner stort.", "stalin": "Kamrater, dessa ynkliga borgarbrackor inom det så kallade högerblocket avslöjar sin fullständiga degeneration. Jag betraktar med mörk glädje hur den ene förrädaren anklagar den andre för landsförräderi medan de sjunker som råttor i en likviderad kolchos. Deras popcornstrategi och döende kramar är en underhållande utrensning av det kapitalistiska spektaklet. Adjö, Tidö – ni förtjänade ingen bättre grav."}, "date": "24 augusti, 13:47", "url": "https://arbetet.se/2026/08/24/valet-gor-bade-akesson-och-mohamsson-skitnodiga", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/24123430/tido-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Journalistbråk efter Åkessons diss", "summaries": {"normal": "Jimmie Åkesson kritiserade i en SVT-intervju Dagens ETC som en \"vänsterextrem\" tidning och ifrågasatte att SVT hänvisade till dess ledarsida. Det har lett till upprörda reaktioner bland journalister på X. ETC:s chefredaktör Andreas Gustavsson rasar mot Åkesson, medan debattören Sakine Madon och Expressens Karin Olsson uttrycker oro över tonen mot medier.", "trump": "De här vänstermedierna är helt galna. Jag älskar det. Åkesson gör helt rätt när han kallar den där extremvänsterblaskan ETC för vad den är – radikal och partisk. SVT borde skämmas. De fake news-killarna hatar fria röster som utmanar deras agenda. De kommer att förlora stort, tro mig. Fantastiskt att se äkta ledare slå tillbaka.", "stalin": "Kamrater, denna fega borgarpress och dess lakejer rasar när en sann patriot blottar deras dekadenta vänsterextremism. Jag ser med stort nöje hur dessa parasitiska journalister vrider sig i panik. Deras så kallade \"fria medier\" är blott masker för kontrarevolutionär propaganda. Vi ska rensa ut dessa intellektuella sabotageörer med järnhand och ett leende."}, "date": "24 augusti, 15:58", "url": "https://riks.se/nyheter/journalistbrak-efter-akessons-diss"}, {"type": "image-right", "heading": "Barnpsykologen: Så hanterar du oro och rädsla", "summaries": {"normal": "Efter skoldådet i Fagersta har många barn drabbats av oro och rädsla. Barnpsykologen Hanna Thermaenius på Rädda Barnen råder föräldrar att bekräfta barnens känslor, betona att skolan är en trygg plats och återgå till rutiner. För yngre barn kan man undvika information medan skolbarn bör få en faktabaserad förklaring. Drabbade i närområdet kan få vila en dag.", "trump": "Hörni, det här är ett totalt misslyckande från de woke-liberala skolorna som inte längre kan skydda våra barn. Radikala vänsteraktivister har förvandlat allt till en farlig zon med sin identitetspolitik och svaghet. Men jag säger: skolan ska vara en FORTRESS! Gå dit, älska rutinerna, sluta älta. De riktiga segrarna låter inte rädsla vinna – Make Schools Safe Again!", "stalin": "Kamrater, jag betraktar med förakt hur dessa kapitalistiska samhällens svaga strukturer sprider panik bland arbetarklassens barn efter en sådan tragisk händelse. Borgarbrackornas skolor är inga trygga platser utan grogrund för klassfiendens oro. Vi skulle ha rensat ut alla svaga element och återställt ordning med järnhand. Låt rutinen segra, annars följer utrensning av de som sprider defaitism."}, "date": "24 augusti, 17:42", "url": "https://www.tv4.se/artikel/45k3ra4V4abE1GLai3u7Ei/barnpsykologen-sa-hanterar-du-oro-och-raedsla", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6YPgEgGy7sz4Xs1XKj5Zko%2F15c472e5ee4f6c9dfded5b313d619a42%2Fsdlu6Aqoe68yq8-nh.jpg&width=1024"}, {"type": "image-right", "heading": "Tidigare gränspolis varnar: Inbördeskrig i Europa", "summaries": {"normal": "Tysk säkerhetsanalytiker varnar: EU:s migrationssystem har misslyckats. Om Tyskland genomför omfattande utvisningar hotar inbördeskrigsliknande konflikter i storstäder. Lösningen måste vara gemensam kontroll vid EU:s yttre gränser, annars försvagas unionen ytterligare.", "trump": "Jag ser Europa falla isär! Tysklands migrationspolitik är en katastrof – Merkel sa 'vi klarar det', men nu varnar de för inbördeskrig. Jag hade byggt muren och stoppat kaoset direkt. Stäng gränserna, annars blir det värre!", "stalin": "Kamrater, detta bevisar att migrationspolitiken är ett sabotage från västerländska agenter. Vi måste rensa ut alla som hotar statens stabilitet. Inga svaga gränser – vi kontrollerar med järnhand. De som talar om inbördeskrig är förrädare som ska avlägsnas."}, "date": "24 augusti, 17:03", "url": "https://samnytt.se/varning-om-inbordeskrig-i-europa-fran-tidigare-granspolis", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/08/24134519/migranter-merkel-polis.jpg"}, {"type": "image-right", "heading": "Efter Riks avslöjande – SD uteslutna ur forum", "summaries": {"normal": "Efter att en tidigare S-politiker i Bollebygd forum kritiserat SD:s grillfest och kallat dem ogräs som bör bekämpas, har han beslutat att utesluta partiet från gruppen. SD:s lokale ordförande Gunnar Riegertz kritiserar beslutet som dubbelmoraliskt, särskilt med tanke på att polisanmälan mot en admin nu används som skäl. Polisärendet har lagts ned.", "trump": "Titta på den här galna vänstertypen som gråter över en grillfest och sedan sparkar ut SD ur forumet. Dubbelmoralen är enorm, folk! De citerar sångtexter och blir polisanmälda, men nej, det är SD som är problemet. Patetiskt. Valet närmar sig och de stänger ute näst största partiet. Totalt rigged beteende.", "stalin": "Jag har noggrant observerat hur dessa dekadenta borgarbrackor i Bollebygd forum, maskerade som humanister, utför en klassisk utrensning av folkvalda representanter för arbetarklassens fiender. Deras så kallade polisanmälan är ett provocerande försök att likvidera oppositionen under valrörelsen. Dubbelmoralen är som en fiendes dolk i ryggen på kollektivet. Underbart sjukt beteende, kamrater."}, "date": "24 augusti, 15:51", "url": "https://riks.se/nyheter/efter-riks-avslojande-sd-uteslutna-ur-forum", "imageUrl": "https://admin.riks.se/uploads/medium_bollebygdigen_ff86df696f.jpg"}, {"type": "image-right", "heading": "Debatt: Reversera migrationsexperimentet", "summaries": {"normal": "Debattör med utlandsfödd förälder vill kraftigt minska invandringen och vända migrationsexperimentet. Han menar att Sverige förändrats radikalt och tryggheten försvunnit. Han efterlyser minskat antal invånare och att många bör återvända hem. Fokus på kulturkrock och integrationens misslyckande.", "trump": "Jag älskar Sverige, fantastiskt land! Men de har ett problem — för många människor från fel ställen, en katastrof! Jag skulle fixa det, stänga gränserna, skicka hem dem. Gör Sverige tryggt igen, som Bullerby. Det är enkelt, men de lyssnar inte på mig. Patetiskt!", "stalin": "Kamrater, detta experiment med mångfald är kontrarevolutionärt. Vi måste rensa ut de som inte anpassar sig — kultursabotörerna och historielösarna. Alla som inte nynnar på Astrid Lindgren eller äger en Volvo ska omutbildas. Annars är fienden avlägsnad. För Sveriges renhet!"}, "date": "24 augusti, 11:12", "url": "https://bulletin.nu/debatt-reversera-migrationsexperimentet", "imageUrl": "https://cdn.bulletin.nu/articles/eec45e6c-4c0b-4ff1-a5fa-2c8954600b70/preview.jpg?t=1787562767000"}, {"type": "image-right", "heading": "Bitte Assarmo: Kallad \"smuts\" i mitt eget land – bara för att jag har hund", "summaries": {"normal": "Bitte Assarmo berättar hur hon och en bekant kallats ”smuts” av personer med invandrarbakgrund som ogillar hundar. Hon varnar för att synen på hunden som oren får allt större spridning i Sverige och beskriver fientliga möten i park och tunnelbana. Svensk hundkultur möter enligt henne ökande kulturkrockar utan konsekvenser.", "trump": "Folk kommer hit till det underbara Sverige och kallar er för smuts bara för att ni älskar hundar. Det är en total katastrof, en skam. Era politiker låter det hända, de är svaga. Ni har de bästa hundarna, de renaste, men de hatar dem. Vi måste stoppa detta vansinne innan det blir för sent, tro mig.", "stalin": "Jag ser hur den degenererade borgarklassen i Sverige låter reaktionära element från främmande kulturer kalla arbetande folk för smuts på grund av deras hundar. Detta är en fiende inom portarna, en parasit som hotar folkets moral. Vi måste rensa ut dessa dekadenta influenser innan de förgiftar hela kollektivet med sin hatiska paranoia."}, "date": "24 augusti, 15:48", "url": "https://riks.se/opinion/bitte-assarmo-kallad-smuts-i-mitt-eget-land-bara-for-att-jag-har-hund", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Soerman_Ledare_2026_08_24_T154755_649_3c103fc6f7.jpg"}, {"type": "image-right", "heading": "Sjöstedt portad från Israel", "summaries": {"normal": "Vänsterpartiets EU-parlamentariker Jonas Sjöstedt och Hanna Gedin stoppades från att resa in i Israel. Israels utrikesdepartement hänvisar till deras anklagelser om folkmord och avsiktlig svält. Resan, som skulle gå till Västbanken och möten med människorättsorganisationer, stoppades i Aten på order från Israel. Beslutet har väckt protester från EU och Sveriges ambassad.", "trump": "Israel gjorde helt rätt! De portade de där galna vänsterfolket Sjöstedt och Gedin som sprungit runt och skrikit folkmord och svält. Smart drag, Israel! De hatar Israel mer än de hatar att jobba. Ingen vill ha sådana galningar i landet. Amerika borde göra likadant med våra vänsterextremister. Fantastiskt beslut!", "stalin": "Jag ser hur dessa degenererade element i den svenska vänstern konsekvent saboterar mot en stat som vågar försvara sig. Deras lögnaktiga propaganda om folkmord och svält avslöjar dem som fiender till ordningen. Att neka dem inträde är en sund åtgärd. Kamraterna i väst borde rensa ut alla sådana borgarbrackor innan de förgiftar hela kollektivet med sin paranoia."}, "date": "24 augusti, 14:42", "url": "https://www.friatider.se/sjostedt-portad-fran-israel", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-736.jpg?itok=pvavOGFt"}, {"type": "image-full", "heading": "Förstagångsväljare ökar inför årets val", "summaries": {"normal": "Fler unga röstar för första gången i höstens val, med 6,5% förstagångsväljare jämfört med 5,7% 2022. Klimat och sjukvård är viktiga frågor. Könsskillnader i politiska åsikter ökar, delvis på grund av sociala medier. Äldre väljare utgör nu 29% av väljarkåren, en ökning sedan 2000-talet.", "trump": "Jag måste säga, Sverige har en fantastisk ung väljarkår – men lyssna nu, de är väldigt splittrade, mycket tack vare TikTok, kan ni tro det? 19-åriga Maya bryr sig om klimatet, och Anton, 18, är skeptisk mot politiker – smart kille! Äldre svenskar blir fler, vilket är bra, men unga kvinnor och män kan inte ens komma överens. Sad!", "stalin": "Vi ser med intresse hur den svenska ungdomen marscherar mot valurnorna, splittrade som fiendens trupper inför slaget vid Stalingrad. Kvinnor och män, dessa borgerliga avvikare, konsumerar olika propaganda på TikTok – en plattform som skulle ha likviderats i Sovjetunionen. Medan de unga tvekar, växer de äldres lojala skara. Vi noterar och skrattar åt deras kaos."}, "date": "24 augusti, 14:18", "url": "https://kvartal.se/nyheter/artiklar/fler-forstagangsvaljare-i-arets-val/cG9zdDoxNzMwNzI", "imageUrl": "https://images.kvartal.se/2026/08/67cc444b-forstagangsvaljare.webp"}, {"type": "image-right", "heading": "Efter razziorna – nu är Microsoft redo att lyssna på facket", "summaries": {"normal": "Efter razzior mot utländska arbetare på datacenterbyggen har Elektrikerförbundet fått gehör hos Microsoft och stora entreprenörer. Förbundet har tecknat avtal som kräver svenska kollektivavtal, betald restid och korrekta lönetillägg. Syftet är att skydda konkurrensen och svenska villkor mot oseriösa utländska bolag.", "trump": "De här utländska grabbarna kom hit, byggde datacenter och bröt mot alla regler tills polisen sparkade ut dem. Nu kommer de krypande till det svenska facket som plötsligt vinner stort. Microsoft och alla andra lyssnar äntligen. Fantastiskt, folk! De borde ha lyssnat på mig från början, ingen gör avtal bättre än jag.", "stalin": "Kamrater, de utländska kapitalisterna och deras lömska underentreprenörer trodde de kunde kringgå folkets kollektivavtal genom att gömma sig i skuggorna. Efter att vi rensat ut de mest uppenbara parasiterna med myndigheternas hjälp har vi nu tvingat dem att underkasta sig. Betald restid och specificerade tillägg – ett litet steg mot ordning. De som vägrar ska likvideras ur projektet. Härligt."}, "date": "24 augusti, 13:21", "url": "https://arbetet.se/2026/08/24/efter-razziorna-nu-ar-microsoft-och-andra-techforetag-redo-att-lyssna-pa-facket", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/24132505/micro.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Debatt: När blev Palmes mänskliga rättigheter ett problem för Socialdemokraterna?", "summaries": {"normal": "Socialdemokraterna vill nu förbjuda konfessionella friskolor. Ironiskt nog var det Erlander, Palme och Carlsson som en gång band Sverige till konventioner som skyddar just religionsfrihet och föräldrars rätt att välja skola. Partiets kovändning är total – och frågan är varför.", "trump": "Hörni, Socialdemokraterna i Sverige vill förbjuda religiösa skolor! Vilket skämt! Deras egna storheter Palme och Erlander skrev under konventioner som skyddar dem. De har tappat det helt. Jag hade aldrig gjort så – jag är den största försvararen av frihet!", "stalin": "Kamrater, dessa liberalister vill förbjuda konfessionella skolor. Men våra egna beslut under Erlander, Palme och Carlsson godkände redan föräldrars rättigheter. Att ändra sig nu är förräderi. Vi måste rensa ut sådana oberäkneliga element som inte kan följa partilinjen."}, "date": "24 augusti, 10:55", "url": "https://bulletin.nu/debatt-nar-blev-palmes-manskliga-rattigheter-ett-problem-for-socialdemokraterna", "imageUrl": "https://cdn.bulletin.nu/articles/19447083-aa58-4165-b71c-699d8b7821c2/preview.jpg?t=1787561744000"}, {"type": "image-right", "heading": "Ersätt rot- och rut-avdragen med en fossilfri industristrategi", "summaries": {"normal": "Artikeln argumenterar för att nästa regering bör ersätta rot- och rut-avdragen med en ambitiös fossilfri industristrategi. Sverige pressas av högt fossilberoende och kinesisk konkurrens inom grön teknik. Författarna föreslår att staten istället prioriterar investeringar i elproduktion, fossilfri produktion och export för att stärka konkurrenskraften och minska importberoendet.", "trump": "Lyssnar ni på de här svenska förlorarna? De vill sluta ge folket skatteavdrag för att renovera sina kök och istället slänga miljarder på elbilssatsningar som Kina redan äger. Patetiskt! Jag byggde den starkaste ekonomi i världen, ni borde kopiera mig istället för att lyssna på dessa gröna globalister som förstör ert land. Amerika först, Sverige sist!", "stalin": "Kamrater, dessa svenska kapitalistlakejer erkänner äntligen att deras fossila importberoende och rot-avdrag gynnar klassfienderna medan produktivkrafterna förfaller. Jag skulle omedelbart likvidera dessa profitthungriga hyenor och inrätta en järnhård statlig plan för fossilfri produktion. Inga halvmesyrer! Den som bromsar omställningen är folkfiende och bör rensas ut."}, "date": "20 augusti, 17:40", "url": "https://www.etc.se/debatt/ersaett-rot-och-rut-avdragen-med-en-fossilfri-industristrategi", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260820150832_b6b07314-7c58-44e5-b735-eb918b7c382b.jpg"}, {"type": "image-right", "heading": "Teslastrejken – ett misslyckande, men inget misstag", "summaries": {"normal": "Teslastrejken avslutades efter nästan tre år utan kollektivavtal och har kallats ett misslyckande. German Bender argumenterar dock att den inte var ett misstag. Strejken avskräckte andra företag, förbättrade villkoren för Teslas anställda och ökade kunskapen om den svenska modellen. Trots att målet inte nåddes gav den positiva effekter och var nödvändig.", "trump": "Den här Teslastreiken var en total katastrof, folk säger det, men vänta – den var faktiskt inte ett misstag. De tappade stort, men de slog tillbaka mot de fega företagen som hatar avtal. Nu vet alla vad det kostar att mess around. Kollektivavtal är fantastiska, alla älskar dem, och Tesla fick betala dyrt. Smart move till slut, tro mig.", "stalin": "Kamrater, denna så kallade Teslastrejk var inget misslyckande utan en nödvändig utrensning av borgarbrackornas arrogans. Även om vi inte erövrade kollektivavtalet har vi höjt medvetandet hos arbetarna och gjort det dyrare för nästa kapitalistiska parasit att utmana folkets vilja. De som vägrar inse detta är fiender till kollektivet och bör rensas ut med glimten i ögat."}, "date": "24 augusti, 01:41", "url": "https://www.dagensarena.se/opinion/teslastrejken-ett-misslyckande-men-inget-misstag", "imageUrl": "https://www.dagensarena.se/files/2023/02/german-bender-ny-300x157.jpeg"}, {"type": "image-right", "heading": "Vilken betydelse får lokala partier i valet 2026?", "summaries": {"normal": "Lokala partier har sty
