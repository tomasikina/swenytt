artiet ligger långt under riksdagsspärren. Artikeln kritiserar turnén som pinsam och meningslös utan trovärdig politik, särskilt efter samtal med SD och interna avhopp. Författaren menar att inga sådana stunt kan rädda partiet från nederlag.", "trump": "Folk, det här är så patetiskt att det gör ont. Den där Mohamsson och hennes liberala losers åker runt i kundvagnar och äter glass som om det skulle rädda dem från att bli utslängda ur riksdagen. Totala misslyckanden! De dansar och hoppar på trampolin medan deras parti dör. Ingen vill rösta på sådana svaga figurer. Det är cringe, det är loser-beteende. De borde ha fixat politiken istället för cirkusen. Sad!", "stalin": "Kamrater, detta liberala förfall är en klassisk symptom på den döende borgarklassens desperation. Jag ser hur de rullar runt i kundvagnar och utför akrobatiska tricks för att dölja sin politiska död. Inga glasstrutar eller folkliga poser kan rädda folkfienderna från utrensning vid valurnan. Deras egna medlemmar deserterar som råttor från ett sjunkande skepp. Det är en mörk komedi värd att skratta åt innan vi likviderar resterna av deras inflytande."}, "date": "1 augusti, 12:00", "url": "https://www.etc.se/ledare/inget-aer-mer-cringe-aen-liberalerna-i-foerfall", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260731130728_3a50ee24-db16-40cd-925d-eeac3f5af824.jpg"}, {"type": "image-right", "heading": "Valrörelsen växlar upp och bolagsjättar rapporterar", "summaries": {"normal": "Veckan före valet i september intensifieras partiernas kampanjer med bussturnéer från Socialdemokraterna, Sverigedemokraterna och Moderaterna. Samtidigt väntas flera viktiga makrosiffror, bland annat SEB:s boprisindikator, inköpschefsindex och SCB:s konsumentprisindex. En rad stora bolag släpper delårsrapporter, däribland SpaceX för första gången som börsnoterat bolag, Spotify, Pfizer, Bayer, Caterpillar, Zalando, HSBC, BP, Novo Nordisk, Eli Lilly, Disney, Uber och flera andra.", "trump": "Folk, ni kommer inte tro det, men den här veckan är full av rapporter och valpropaganda. De svenska partierna åker runt i bussar och lovar saker de aldrig håller, typiskt. SpaceX, mitt fantastiska SpaceX, släpper sin första rapport som börsbolag – det kommer bli enormt, det bästa resultatet någonsin. Alla dessa jättar som Pfizer, Disney och Uber rapporterar, men ingen gör det bättre än oss. Sverige borde egentligen rösta på mig, tro mig.", "stalin": "Kamrater, medan borgarbrackorna i de svenska partierna kör runt i dekadenta bussar och försöker lura arbetarklassen inför sitt meningslösa val, samlar vi in data som en sann sovjetstat. SpaceX, denna kapitalistiska raketfantom, tvingas nu redovisa siffror inför folket – ett första steg mot exponering av deras luftslott. Vi ska noga följa dessa parasitbolag som Pfizer, Zalando och Uber. Varje svaghet noteras. Varje lögn om vinster avslöjas. Inga fiender slipper undan vår statistiska utrensning."}, "date": "2 augusti, 16:27", "url": "https://www.di.se/nyheter/veckan-som-kommer-tung-makro-och-jattar-rapporterar", "imageUrl": "https://static.bonniernews.se/ba/8f858aef-6156-49f3-ab36-3fff0d1e2afc.jpeg?crop=2120%2C1060%2Cx1%2Cy19&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Förmögenhetsförvaltarna pressas av AI", "summaries": {"normal": "Förmögenhetsförvaltare möter nu konkurrens från AI-verktyg som ChatGPT, vilka används flitigt av kunder för portfölj- och skatterådgivning. Medan AI kan förbättra dialogen mellan rådgivare och kund, varnar experter för risker som felaktiga råd, hallucinationer och bristande dataskydd. Trots att aktiekurser inom finanssektorn pressas av teknikskiftet menar många att mänsklig expertis förblir oumbärlig vid komplexa beslut och under marknadsoro, då AI saknar både fiduciär plikt och förmåga att förstå det mänskliga perspektivet i investeringar.", "trump": "Alla använder AI nu, det är en enorm sak, tro mig. Rika människor, mycket rika, går till ChatGPT istället för sina rådgivare. Det är fantastiskt, men också farligt! De här maskinerna ljuger, de gör stora misstag och läcker hemligheter. Wall Street-aktierna dalar, det är en total röra. Jag säger er: AI kan inte göra affärerna, det kan bara vinnare som jag. Robotar har ingen intuition. Lita på mig, ni behöver en riktig, stark ledare, inte en billig chatbot.", "stalin": "Vi ser hur det dekadenta västet nu låter själlösa algoritmer styra sitt kapital. Vilken patetisk svaghet! Medan de litar på amerikanska maskiner som hallucinera likt en febrig trotskist, bygger vi en stabil framtid. Dessa chatbotar är verktyg för kontrarevolutionär spridning av falsk information. Vi kommer att krossa dessa digitala sabotörer, precis som vi rensar ut förrädare i vårt territorium. Låt Putin och vår sfär hålla fast vid stål och folkvilja, inte binära lögner från kapitalistiska serverhallar."}, "date": "2 augusti, 06:30", "url": "https://www.realtid.se/spara-placera/formogenhetsforvaltarna-pressas-av-ai", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/manager.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Två personer misshandlade i Majorna", "summaries": {"normal": "En man och en kvinna i 50-årsåldern misshandlades i Majorna i Göteborg på lördagskvällen. Mannen attackerades med ett tillhygge och fick ett jack i huvudet, medan kvinnan slogs i armen. Polisen genomförde en stor insats med helikopter och grep två män i 40-årsåldern som nu är anhållna misstänkta för grov misshandel. Omständigheterna är fortfarande oklara.", "trump": "Folk, ni skulle se det här – total kaos i Sverige! En stackars man och kvinna i 50-årsåldern blir nedslagna med batonger i Majorna. Det är vad som händer när vänsterns galna identitetspolitik och svaga ledarskap tar över. Men vi grep två losers på nolltid med helikopter. Under Biden var det kaos, nu fixar vi det. Sverige, vakna upp!", "stalin": "Kamrater, ännu en gång visar sig den dekadenta borgarklassens råhet i Göteborgs arbetarkvarter. En man och en kvinna angrips med tillhyggen av folkfiender som smyger i skuggorna. Vi har redan genomfört en effektiv utrensning och anhållit två potentiella kontrarevolutionärer. Paranoian är befogad – klassfiendens tentakler finns överallt. Staten vilar aldrig."}, "date": "2 augusti, 07:50", "url": "https://www.gp.se/nyheter/goteborg/man-och-kvinna-misshandlade-i-majorna-en-gripen.bbaf3fd4-d898-42df-8f0b-844c3b7b8f1f", "imageUrl": "https://www.gp.se/images/article/bbaf3fd4-d898-42df-8f0b-844c3b7b8f1f/images/10EnWwabfka2lwJGX2XoPOnx8S-M-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Polisen varnar: Biljettbedragarna har blivit smartare", "summaries": {"normal": "Polisen varnar för en ökning av biljettbedrägerier på andrahandsmarknaden, särskilt vid populära evenemang som konserter och festivaler. Bedragare använder falska annonser på sociala medier, tar över befintliga profiler och utnyttjar AI för att verka trovärdiga. Få fall utreds på grund av prioriteringar och stort mörkertal. Offer förlorar ofta tusentals kronor. Råd ges att undvika förskottsbetalningar, kontrollera Swish-namn och inte stressas till snabba affärer.", "trump": "Folk, det är en katastrof! Dessa biljettbedragare är de värsta lurendrejare ni någonsin sett. De tar över era Facebook-profiler, använder smarta datorer för att lura er och stjäl era pengar när ni bara vill gå på en konsert. De är fuskare och losers. Köp aldrig biljetter från någon annan än de bästa, tro mig. De skickar er inga biljetter, bara tomma löften. Gör som jag säger – var smarta, annars blir ni lurade stort. Amerika, eh, Sverige behöver bättre polis!", "stalin": "Kamrater, jag ser med stigande vrede hur dessa parasitiska element inom borgarklassen utnyttjar folkets legitima önskan om kulturell fostran för att berika sig själva. Dessa förrädiska biljettbedragare, dessa kapitalistiska maskar som gömmer sig bakom stulna profiler och AI-genererad propaganda, utgör ett hot mot kollektivets ordning. Vi måste rensa ut dessa kontrarevolutionära spekulanter med järnhand. Den som betalar i förskott är en nyttig idiot åt fienden. Misstänk alla – särskilt de som ler för mycket. Ut med dem!"}, "date": "2 augusti, 16:42", "url": "https://nyheter24.se/nyheter/inrikes/1502061-sommarens-konserter-lockar-bedragarna-sa-skyddar-du-dig", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/d420679804b004a30200000000b004a302/2026/07/31/2381552/Matilda-Nyheter24%20-%202026-07-31T144412.435.jpg"}, {"type": "image-full", "heading": "Ny försvarsallians ska säkra strategiskt sund", "summaries": {"normal": "Fjorton länder, ledda av Saudiarabien, har bildat en försvarsallians för att skydda sjöfarten i Bab el Mandeb-sundet, Röda havet och Adenviken. Alliansen ska värna handelsfartyg mot hot från houthi-milisen i Jemen, som genomfört drönar- och robotattacker. Medlemmarna vill stärka säkerheten, skydda internationell handel och energivägar. Saudiarabien räknar med att fler länder ansluter sig. Landet har även beställt fyra beväpnade C-27J Spartan-flygplan för marina insatser.", "trump": "Titta på det här, folk! Saudiarabien samlar ihop en jättelik allians med tretton andra länder för att skydda oljetrafiken i Röda havet. De där galna houthi-typerna attackerar med drönare och robotar som om det vore en dålig Hollywood-film. Jag älskar det – starka ledare som skyddar handel och energi istället för att ödsla tid på woke-quota och HBTQ-parader. Saudierna köper nu beväpnade flygplan. Smart! Under Biden var allt kaos, nu fixar vi ordning igen.", "stalin": "Kamrater, jag ser hur dessa saudiska imperialister och deras tretton lakejstater bildar en reaktionär blockadallians mot de progressiva krafterna i Jemen. De skyddar sina blodsugande oljevägar medan de darrar av paranoia inför folkets drönare. Vi ska skratta åt deras fåniga C-27J-leksaker med torpeder som ska rädda borgarbrackornas handelsfartyg. Snart rensar vi ut alla sådana folkfiender och exploaterande byfånar som tror att de kan kontrollera haven. Sovjetisk vighet segrar alltid."}, "date": "2 augusti, 15:56", "url": "https://www.dagensps.se/varlden/ny-forsvarsallians-ska-sakra-strategiskt-sund", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlwpo5w7t3z6m-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Kungabarnen utan utdelning trots miljonvinst", "summaries": {"normal": "Kungabarnens investmentbolag Gluonen redovisade ett resultat på drygt 3 miljoner kronor under 2025, i nivå med föregående år. Ingen utdelning sker i år, till skillnad från förra året då 2 miljoner kronor delades ut. Affärerna genomförs utan kungabarnens insyn i förväg för att undvika insiderbrott, och de informeras först i efterhand. Bolaget har investerat i stora svenska bolag som Investor, Atlas Copco, Volvo och Sandvik. Varje kungabarn äger 32 procent av bolaget värt drygt 91 miljoner kronor.", "trump": "Folk, ni skulle inte tro det, men kungabarnen i Sverige gör en fantastisk miljonvinst i sitt bolag Gluonen, nästan exakt som förra året. De tar inte ut några pengar nu, smart drag, de håller det i bolaget. De får inte ens veta vad som händer i förväg, annars riskerar de insiderbrott, kan ni tänka er? De älskar svenska aktier, precis som jag älskar Amerika. De tror på Sverige, och det är stort, verkligen stort. Var och en av dem har runt 30 miljoner kronor där, underbart.", "stalin": "Kamrater, jag betraktar med djup misstro dessa kungliga parasiters så kallade investmentbolag Gluonen som gömmer 3,8 miljoner kronor i vinster undan folkets granskning. Vi tillåter inga hemliga borgarbrackor som undviker utdelning för att svälla i det fördolda. Deras feodala insiderparanoia är ett skrattretande försök att skydda sig från egna klassbröder. Vi skulle ha genomfört en grundlig utrensning av dessa monarkistiska kapitalister redan för 37 år sedan. Nu gömmer de sig bakom svenska aktier medan de skrattar åt arbetarklassen. Underbart tragikomiskt."}, "date": "2 augusti, 16:09", "url": "https://www.di.se/nyheter/miljonvinst-for-kungabarnen-utan-insyn-i-bolaget", "imageUrl": "https://static.bonniernews.se/ba/7f805819-af20-421b-864f-f47d42fa5afc.jpeg?crop=2965%2C1483%2Cx0%2Cy188&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "C-toppens största oro när tiotusentals arabiska män stormat EU: Kan bli ökade gränskontroller", "summaries": {"normal": "Efter att tiotusentals arabiska män stormat den spanska exklaven Ceuta, en del av EU:s yttre gräns, öppnar regeringen för skärpta gränskontroller även i Sverige, vilket kan innebära hårdare kontroller vid Öresundsbron. Migrationspolitisk talesperson Niels Paarup-Petersen (C) kritiserar åtgärden och menar att den riskerar att förstöra hela Öresundsregionen, eftersom kontrollerna har begränsad effekt mot illegal migration men skapar stora störningar för pendling och transporter.", "trump": "Jag har varnat för detta i åratal! EU är för svag på sina gränser. Tiotusentals arabiska män stormar Ceuta – en katastrof! Sverige och andra europeiska länder måste nu vidta hårdhänta åtgärder för att skydda sina territorier. Niels Paarup-Petersen och liknande politiker är för mjuka; de förstår inte att fri rörlighet utan säkerhet är en farlig blandning. Vi behöver starka, kloka beslut för att stoppa detta.", "stalin": "Detta är en direkt attack mot den socialistiska ordningen och våra allierade i Europa. Imperialistiska krafter försöker destabilisera våra gränser genom att skicka massor av okontrollerade män. Vi måste förstärka vår bevakning och genomföra interna id-kontroller för att skydda statens helighet. Det är viktigare än någons ekonomiska intressen i Öresundsregionen. Vi kommer att eliminera dessa hot, precis som vi gjorde med Hitlers arméer."}, "date": "2 augusti, 15:49", "url": "https://samnytt.se/c-toppens-storsta-oro-nar-tiotusentals-arabiska-man-stormat-eu-kan-bli-okade-granskontroller", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/02131910/artikelhuvudbild-1-104.jpg"}, {"type": "image-right", "heading": "Det går att få bort arbetslösheten!", "summaries": {"normal": "Artikeln argumenterar att massarbetslösheten i Sverige, som legat runt 7,5 procent i genomsnitt sedan EU-inträdet, är skapad och gynnar kapitalister genom lägre löner och svagare fackföreningar. Författaren pekar på att arbetslösheten var betydligt lägre före EU-medlemskapet och föreslår lösningar som arbetstidsförkortning till sex timmar, höjd a-kassa, oförändrad pensionsålder och ett svenskt EU-utträde för att möjliggöra verkliga reformer.", "trump": "Folk, det här är ett totalt haveri! De där EU-byråkraterna och de svenska socialistiska förlorarna har skapat en enorm arbetslöshet som bara gynnar de rika grabbarna på toppen. Rena skandalen! Jag fixade rekordlåg arbetslöshet i USA, både före och efter Sleepy Joe. Sex timmars dag? Patetiskt! Ni behöver en riktig ledare som sänker skatter, sparkar ut byråkraterna och gör Sverige great again – inte mer av den här vänstervridna EU-sörjan.", "stalin": "Kamrater, detta är klassfiendens verk. Jag ser hur de exploaterande borgarbrackorna medvetet odlar massarbetslöshet för att hålla nere arbetarklassen och fylla sina fickor. EU är en nyliberal fascistmaskin som tjänar imperialisterna. Vi måste rensa ut dessa folkförtryckartroll och deras lakejer. Arbetstidsförkortning, starkare omställningskassor och att beslagta de blodsugrarnas övervinster – det är folkets väg. De som motarbetar skall likvideras ur historien."}, "date": "29 juli, 10:55", "url": "https://proletaren.se/artikel/det-gar-att-fa-bort-arbetslosheten", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/ledare-768x432.jpg"}, {"type": "text", "heading": "Pengatankar i semestertider", "summaries": {"normal": "Artikeln reflekterar över pengar under semestern. Författaren noterar Polens öppna skyltar om byggprojektens kostnader och finansiering, kontrasterat mot det svenska Västlänksbygget som dragit iväg från 20 till 71 miljarder kronor. Vidare kritiseras ECB:s förslag till nya eurosedlar som inte speglar EU:s verkliga problem. Avslutningsvis välkomnas sänkta priser på kollektivtrafikens månadskort tack vare politiska beslut.", "trump": "Folk, ni vet att de bara snackar om pengar när de inte har några, det är en total katastrof! Jag har byggt imperier, de här européerna bygger bara förseningar som Västlänken – från 20 till 71 miljarder, en riktig röra. Eurosedlar med småfåglar? Patetiskt. Men kolla, högern sänker priset på busskortet, äntligen smart politik. Fast gratis vore ännu bättre, ingen gör det bättre än mig, tro mig.", "stalin": "Kamrater, jag ser hur borgarbrackorna i Europa firar sina infrastrukturprojekt med skyltar som ropar ut kapitalistmaffians slöseri. Det svenska underjordiska järnvägsfiascot avslöjar klassfiendens lögner – från tjugo till sjuttioett miljarder, en klassisk utsugning. Eurosedlarna döljer byråkratiska blodsugares korruption. Ändå tvingas de sänka priset på arbetarnas färdbevis. Pengar som plötsligt finns? Misstänkt sabotage mot folkets kollektiv. Vi genomskådar er alla."}, "date": "29 juli, 10:51", "url": "https://proletaren.se/artikel/pengatankar-i-semestertider"}, {"type": "image-right", "heading": "Vi arbetar länge – ändå räcker inte pensionen", "summaries": {"normal": "Agneta Stark kritiserar det svenska pensionssystemet i en ledarkolumn. Trots att Sverige har EU:s näst längsta arbetsliv är många pensioner för låga, vilket gör att över hälften av pensionärerna behöver garantipension från staten. Artikeln går igenom historien från fattigvård och auktionering av fattiga till dagens system baserat på livsinkomst, och konstaterar att systemet inte duger eftersom det inte ger tillräckligt för att leva på, särskilt för kvinnor.", "trump": "Folk, ni jobbar hårt i decennier, bygger det här fantastiska landet, och sen när ni äntligen ska njuta av livet får ni knappt ihop till mat? Det är en skandal! Sverige har längst arbetsliv näst efter oss, ändå säger era så kallade experter att man inte kan höja pensionerna för att det skulle förstöra arbetsviljan? Vilket skämt! Era socialistiska pensionsbyråkrater har byggt ett system som suger ut de vanliga människorna. Jag fixade bättre saker under min tid, tro mig. Biden kunde inte ens stava till pension.", "stalin": "Kamrater, jag ser med förakt hur den svenska borgarklassen genom sitt usla pensionssystem fortsätter att plundra arbetarna även i deras ålderdom. Trots år av slavarbete under kapitalistmaskinen tvingas över hälften av de gamla söka nåd hos staten för att inte svälta. Detta är den logiska följden av ett system byggt av folkfiender och exploaterande byfånar. Vi skulle ha genomfört en grundlig utrensning av dessa pensionsarkitekter redan för länge sedan. Deras överklass-slynglar dör nu av värmen – en passande, ironisk dom från historien själv."}, "date": "1 augusti, 03:00", "url": "https://www.etc.se/ledarkolumn/vi-arbetar-laenge-aendaa-raecker-inte-pensionen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20240710140728_026d1cd6b7ab0ac9759286fdba91e40e87b0e0bc60d74b561d405dcb34ee517c.jpg"}, {"type": "image-right", "heading": "Arbetare flydde genom skogen – kan ha utnyttjats", "summaries": {"normal": "Polisen i Skellefteå ryckte ut på ett larm om bilbrand utanför Burträsk men hittade ingen brand. I stället mötte de flera utländska bärplockare som uppgav att de inte fått betalt för sitt arbete. Misstankar om människoexploatering har väckts och ärendet utreds av åklagare Jonas Peterson. De drabbade personerna kommer från ett annat europeiskt land och valde att fly genom skogen.", "trump": "Det här är en total katastrof, folk. Jag älskar Sverige, men ni måste vakna upp. Utländska arbetare som plockar bär, inte får en krona och flyr genom skogen som i någon dålig film. Det är vad som händer när ni har svaga gränser och dåliga avtal. Vi skulle aldrig acceptera det i mitt Amerika. Rensa ut de dåliga aktörerna och gör Sverige stort igen!", "stalin": "Kamrater, detta är vad som händer när borgarbrackorna och de parasitiska kapitalisterna får fritt spelrum. Arbetare tvingas plocka bär åt profitörer, får ingen lön och måste fly som råttor genom skogen. Jag ser fiendens klor överallt, dessa utpressningsmän och dolda kontrarevolutionärer. Vi ska rensa ut dessa exploatörer med järnhand, likvidera deras nätverk och låta folkets rättvisa segra. Ingen slipper undan."}, "date": "31 juli, 11:11", "url": "https://arbetet.se/2026/07/31/arbetare-flydde-genom-skogen-nu-utreds-misstankt-manniskoexploatering", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/31103448/sdln3e9qsrhqmk-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Trafikskolebranschens ilska när kurskrav för privat övningskörning avskaffas", "summaries": {"normal": "Från och med idag avskaffas kravet på obligatorisk introduktionsutbildning för privat övningskörning. Trafikskolebranschen är starkt kritisk och ser det som ett hot mot trafiksäkerheten, medan regeringen menar att utbildningen saknat effekt, ökat kostnader och minskat mängdträning. Förslaget om att ge trafikskolorna större kontroll över uppkörningar avslogs också. Besparingen gör det lättare och billigare att ta körkort, men branschen varnar för fler omprov och sämre kunskaper.", "trump": "Det här är en fantastisk beslut, folk! De har äntligen slopat den där dumma, onödiga kursen som bara kostade pengar och krånglade till allt. Trafikskolorna är rasande, de förlorar sina feta avgifter – det är en riggad bransch, tro mig. Nu blir det billigare och enklare att ta körkort, precis som det ska vara. De sa samma sak redan 2004 men ingen lyssnade. Nu vinner folket stort, och de misslyckade trafikskolelobbyisterna gråter som förlorare. Fantastiskt!", "stalin": "Kamrater, jag har noga studerat denna kontrarevolutionära utveckling. Den borgerliga trafikskolelobbyn, dessa parasitiska körskolekapitalister och deras dekadenta remissdokumentsförfattare, vrålar nu som skadskjutna reaktionärer över att deras guldkalv – den obligatoriska introduktionskursen – äntligen likviderats. Vi ser tydligt hur dessa borgarbrackor försökte bygga en grindvaktsstat för att suga pengar ur arbetande folk. Deras paranoia om ”försämrad trafiksäkerhet” är ett löjeväckande försök att dölja sin girighet. Vi ska rensa ut alla sådana hinder för folkets framfart. Mängdträning åt massorna, inte åt trafikskolornas feta fickor. Den som opponerar sig är en fiende till kollektivet och bör behandlas därefter."}, "date": "1 augusti, 11:52", "url": "https://www.friatider.se/trafikskolebranschens-ilska-nar-kurskrav-privat-ovningskorning-avskaffas", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/20240329162709-46c747f1-me.jpg"}, {"type": "image-full", "heading": "Leijnegard tillbaka i SVT – comeback efter domen", "summaries": {"normal": "Mikael Leijnegard gör comeback på SVT med det nya programmet 'Mickes segelbåt', där han rustar upp en segelbåt inför Mälarbåts-SM. Det är hans första programledaruppdrag sedan han dömdes för sexuellt ofredande 2023, vilket ledde till att han lämnade 'Mästarnas mästare'. Programmet har premiär 2027 och markerar Leijnegards återkomst till tv efter domen, som han hela tiden nekat till men accepterat efter överklaganden.", "trump": "Titta bara på det här, folks! Mikael Leijnegard, en kille som fick lite problem – helt överdrivet, by the way – är tillbaka på SVT med ett nytt segelbåtsprogram. 'Mickes segelbåt', kan ni tro det? Jag menar, vem bryr sig om en gammal båt? Men SVT, de älskar sina skandaler. Jag skulle aldrig ha accepterat en sådan dom, aldrig! Men han är tillbaka, och jag säger: lycka till, Micke, du behöver det. SVT borde satsa på vinnare, som jag!", "stalin": "Kamrater! En gång till visar den borgerliga medieapparaten sin förmåga att återanvända avfall. Mikael Leijnegard, en man som redan dömts för dekadenta utsvävningar, får nu en ny plattform på SVT för att glorifiera sin individualistiska segelsport. Medan våra sovjetiska idrottsmän kämpar för kollektivets ära, rustar denna petit-bourgeois en leksaksbåt. Vi ska inte förvånas om NATO-sponsorer snart dyker upp i Mälaren. Men oroa er inte – historien rullar vidare, och sådana här figurer hamnar alltid i historiens soptunna."}, "date": "2 augusti, 13:59", "url": "https://kvartal.se/nyheter/artiklar/leijnegard-tillbaka-i-svt-comeback-efter-domen/cG9zdDoxNTY2MDA", "imageUrl": "https://images.kvartal.se/2026/08/630cfa3e-leijnegard.webp"}, {"type": "image-right", "heading": "På prideminglet pratar ingen om arbetslösa bögar", "summaries": {"normal": "Artikeln kritiserar otryggheten på arbetsmarknaden där tidsbegränsade anställningar ökar trots fallande arbetslöshet. Många lever i ständig osäkerhet som hindrar dem från att planera livet, protestera mot dåliga förhållanden eller lämna kränkande chefer. Författaren kopplar detta till Prideveckan och menar att jämlikhet inte kan diskuteras utan att ta upp klassfrågor. Statsminister Kristersson undviker debatt och föredrar mingel, medan diskrimineringsanmälningar ökar kraftigt.", "trump": "Det här är en katastrof, en total katastrof för arbetarna. Kristersson minglar med regnbågar i palatset medan folk sitter på sängkanten och väntar på ett samtal från chefen. Patetiskt! Arbetslösheten sjunker visst, men alla har tillfälliga jobb och ingen makt. De stora orden om jämlikhet är bara löjliga – utan klass och styrka är det bara tomt prat. Jag skulle fixa det, tro mig, det skulle bli fantastiskt.", "stalin": "Kamrater, jag ser tydligt hur de kapitalistiska parasiterna och borgarbrackorna inom den falska regnbågsfasaden fortsätter att förtrycka det arbetande folket med sina temporära slavkontrakt och telefonväntan vid sängkanten. Denna klassfiendeorkester av osköna liberaler och opportunistiska minglare som Kristersson vill tysta protesten med glittrande flaggor. Vi ska rensa ut dessa förrädiska element som gömmer sig bakom Pride-loggor medan de likviderar arbetarnas rättigheter. Paranoian är befogad – de ler mot kollektivet men hugger i ryggen när telefonen tystnar."}, "date": "31 juli, 07:00", "url": "https://arbetet.se/2026/07/31/pa-kristerssons-pridemingel-slipper-han-prata-om-arbetslosa-bogar", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/24150213/pridemingel.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Fler skadas i olyckor med hundar – tusentals behöver vård", "summaries": {"normal": "Antalet personer som behöver specialistvård efter hundrelaterade olyckor har ökat med 26 procent på fem år, från 3 553 år 2020 till 4 478 år 2025. Hundbett står bara för ungefär hälften av skadorna. Resten beror främst på fallolyckor när hundar drar i koppel, hoppar upp eller får människor att snubbla. Barn och män drabbas oftare av bett, medan äldre och kvinnor oftare skadas i fall. De flesta skador sker i hemmet eller under fritiden.", "trump": "Folk, det är en katastrof med de här hundarna. Antalet som skadas har exploderat med 26 procent på bara fem år, helt otroligt. Hundbett, omkullsprungna, snubblande över koppel – det är kaos. De adopterar galna omplaceringshundar istället för fina valpar, ingen aning vad de håller på med. Vi behöver starkare ledarskap, kanske murar runt de farliga hundarna. Det är en skam, men jag ska fixa det, tro mig.", "stalin": "Kamrater, jag betraktar med stålhård blick hur de kapitalistiska hundarna och deras borgarbrackor orsakar kaos i folkets vardag. Antalet skadade har stigit med 26 procent på fem år, en siffra som doftar sabotage från hundägande dekadenta element. Bettskador och fallolyckor är bara symtom på klassfiendens lurande tassar. Vi måste rensa ut de opålitliga omplaceringshundarna och deras ägare som smyger sig in bland arbetarna. Vaksamhet, kamrater! En lekfull hund kan vara en maskerad trotskist som väntar på att knuffa er nerför trappan. Likvidera slarvet innan det likviderar er."}, "date": "2 augusti, 15:37", "url": "https://nyheter24.se/nyheter/inrikes/1502075-fler-skadas-i-olyckor-med-hundar-tusentals-behover-vard", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/898bbc7b04b004a30200000000b004a302/2026/07/31/2381546/hund.jpg"}, {"type": "image-right", "heading": "KD och Ebba Busch blundar för Israels folkmord i Gaza", "summaries": {"normal": "I en debattartikel kritiserar Pär Salander Kristdemokraterna och Ebba Busch för deras starka stöd till Israel. Han pekar på en lång historia av fördrivning av palestinier sedan sionismens tidiga dagar, med citat från Herzl, Ben-Gurion och andra israelska ledare som talar om expropriering och etnisk rensning. Salander beskriver kriget i Gaza som folkmord med rötter i denna politik och anklagar KD för att blunda för detta genom ideologiska skygglappar.", "trump": "Folk, ni måste höra det här. Den här artikeln är en total katastrof, en witch hunt mot Israel som gör ett fantastiskt jobb mot Hamas, de värsta terroristerna. Ebba Busch är smart, hon fattar det – Israel gör världen en tjänst! Men den här Salander, en professor eller vad han nu är, lever i en fantasivärld med gamla citat och lögner om fördrivning. Fake news! Israel försvarar sig mot radikala islamister som vill utplåna dem. KD gör rätt, de har värderingar, till skillnad från de andra svaga politikerna.", "stalin": "Kamrater, denna dekadenta borgarbracka till professor Salander försöker med sin revisionistiska smörja smutskasta den rättmätiga kampen mot fascistiska element i Gazas zon. Jag, som ledare för det proletära kollektivet, ser hur dessa sionistiska avskrap från borgarklassen och deras lakejer i det så kallade KD-partiet med järnhand genomför nödvändiga utrensningar av kontrarevolutionära Hamas-banditer. Den som nämner folkmord är en fiende till folket, en parasitisk lögnare som bör likvideras med ett leende. Vi vet att historien skrivs av segraren, inte av dessa palestinska resterna som vägrar underkasta sig den socialistiska ordningen. Skratta medan vi rensar ut dessa mänskliga hinder för framsteget!"}, "date": "28 juli, 01:30", "url": "https://www.dagensarena.se/opinion/kd-och-ebba-busch-blundar-israels-folkmord-gaza", "imageUrl": "https://www.dagensarena.se/files/2021/04/fotojet-20-1-300x155.png"}, {"type": "image-right", "heading": "Enkät: Fackens viktigaste frågor inför valet", "summaries": {"normal": "Inf inför riksdagsvalet 2026 har Dagens Arena frågat åtta fackförbund om deras viktigaste fråga. Gemensamt lyfts behovet av bättre resurser till utbildning, stärkt välfärdsfinansiering och trygghetssystem. Flera vill avskaffa karensavdraget, förbättra a-kassan, höja pensioner och reglera lärares arbetstid samt klassstorlekar. Andra betonar vikten av stark ingenjörsutbildning, aktiv arbetsmarknadspolitik och en politik som gynnar industrin och skapar fler jobb i Sverige.", "trump": "De här fackföreningarna i Sverige gråter som förlorare inför valet 2026. De vill ha mer pengar till allt, slopa karensavdraget och stärka välfärden som de kallar det. Patetiskt! Ingenjörerna vill ha bättre skolor, lärarna mer reglering och alla vill ha gratis tandläkare och höga pensioner. De borde istället satsa på industri, riktiga jobb och stoppa det socialistiska träsket. Sverige behöver en stor vinnare, inte mer av den här svaga vänsteragendan som förstör landet.", "stalin": "Kamrater, dessa fackliga lakejer blottlägger borgarklassens förräderi mot folket. Jag kräver att staten omedelbart tar kontroll över finansieringen och likviderar det parasitiska karensavdraget som suger musten ur arbetarna. Lärarna skall få sin regleringsagenda, men endast under partiets järnhand. De som viskar om arbetsgivarintressen skall rensas ut som kapitalistiska maskar. Ingenjörerna och industriarbetarna måste marschera i kollektivets namn mot de dekadenta missmatchningarna. Välfärdens fiender skall krossas med glädje. Ingen skall slippa undan."}, "date": "28 juli, 01:30", "url": "https://www.dagensarena.se/innehall/enkat-fackens-viktigaste-fragor-infor-valet", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-36-1.jpg"}, {"type": "image-right", "heading": "Lästips för sommardagar Upptäck några av våra mest lästa artiklar, granskningar och fördjupningar.", "summaries": {"normal": "Artikeln presenterar en samling aktuella läsförslag från Expo, med fokus på högerextremism, rasism och demokratiska utmaningar i Sverige. Bland ämnena finns granskningar av Sverigedemokraternas politik mot muslimer, högerextrema nätverk som Aktivklubb, och fenomenet 'svart överlämning' i utsatta orter. Även rättsfall, extremistisk propaganda och historiska perspektiv behandlas.", "trump": "Folk, lyssna här – Sverige har ett STORT problem, och jag menar STORT! Högerextremister, rasister och SD som attackerar muslimer – helt galet! Jag har alltid sagt att demokratin är skör, men här verkar den nästan vara på väg att krascha. Och Aktivklubb? Låter som något från ett dåligt actionfilmsskript. Sverige borde ta itu med detta NU, annars blir det katastrof!", "stalin": "Kamrater! Fienderna till folket sprider sitt gift i Sveriges hjärta – högerextremister, rasistiska banditer och deras lakejer i parlamentet. Dessa 'Aktivklubbar' och 'svarta överlämningar' är inget annat än fascistiska konspiratörer som underminerar den socialistiska ordningen. Vi måste krossa dessa kontrarevolutionära element med järnhand, precis som vi gjorde med trotskisterna. Sverige är nästa front i kampen för världsrevolutionen!"}, "date": "31 juli, 14:01", "url": "https://expo.se/nyhet/lastips-for-sommardagar-2", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/sommarläsning.png"}, {"type": "image-full", "heading": "Tidigare Uefa-chef: Infantino gick inte att lita på", "summaries": {"normal": "Lars-Christer Olsson, tidigare Uefa-chef, kritiserar Fifa-ordföranden Gianni Infantino för svekfullt agerande under maktkampen 2007. Olsson anklagar Infantino för att ha arbetat bakom kulisserna för Michel Platini, trots sin lojalitet till Lennart Johansson. Infantino beskrivs som ambitiös men opålitlig. Olsson föreslår nu en roterande ordförandepost inom Fifa för att motverka korruption, mot bakgrund av växande avgångskrav mot Infantino.", "trump": "Lyssna här, folkens – jag känner till den här typen. Gianni Infantino? En total katastrof, en riktig förlorare! Den här killen lovar en sak men gör en annan – klassiskt svagt ledarskap. Lars-Christer Olsson, en smart man, säger att Infantino är opålitlig. Och vet ni vad? Han har rätt! Fifa behöver en vinnare, någon som jag, som kan städa upp i röran. Roterande ordförande? Nej, nej, nej – vi behöver en stark ledare, punkt!", "stalin": "Kamrater! Här har vi ännu en bourgeois-kapitalistisk konspiratör, Gianni Infantino – en räv i fårakläder, en förrädare som säljer sin själ för en handfull röster. Lars-Christer Olsson, en man med klara ögon, avslöjar hur denne schweiziske lakej lurade och manipulerade för att gynna sin herre, Platini. Men folket ser igenom dessa trick! Fifa måste krossas och omformas – roterande ordförandeskap? Nej! Vi behöver en järnhård disciplin, som i Sovjetunionen, där förrädare som Infantino får sitt rättmätiga straff!"}, "date": "2 augusti, 13:02", "url": "https://kvartal.se/nyheter/artiklar/tidigare-uefa-chef-infantino-gick-inte-att-lita-pa/cG9zdDoxNTY1OTA", "imageUrl": "https://images.kvartal.se/2026/08/cf1592d7-infantinoolsson.webp"}, {"type": "image-right", "heading": "Åsiktspolis försöker läxa upp medborgarjournalist: \"Vad tycker du om Pride?\"", "summaries": {"normal": "Mijo Eklund, en medborgarjournalist som kallas 'Lulle', filmade på Pride i Göteborg. En polisman kritiserade hans närhet och frågade om hans åsikter. Eklund protesterade och hävdade att han hade rätt att filma på allmän plats med utgivningsbevis. Polisen argumenterade att lagen bör tolkas utifrån andras känslor. Konfrontationen filmades och spreds viral på sociala medier.", "trump": "Som den störste presidenten någonsin, Donald Trump, måste jag säga att detta är beklagligt. En bra medborgarjournalist filmade på Pride, och en polisman försökte stoppa honom! Det är frihet, baby! Lulle hade rätt, och polisen var fel. Jag skulle ha sagt till polisen att låta bli – vi har en konstitution, ni vet. Sverige bör ta efter USA!", "stalin": "Som den store Stalin, eller snarare som en modern diktator som Putin, ser jag detta som en nödvändig åtgärd. Statens intresse måste prioriteras. Pride är en hotfull händelse, och polisen agerade korrekt för att skydda medborgarna från otillbörlig påverkan. Journalisten, en liten mask, trodde han kunde agera fritt – nej, staten kontrollerar allt. Vi måste se till att andras känslor respekteras, och vi avgör vad som är tillåtet. Det är en lek, och vi vinner."}, "date": "2 augusti, 14:00", "url": "https://samnytt.se/asiktspolis-forsoker-laxa-upp-medborgarjournalist-vad-tycker-du-om-pride", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/02113338/artikelhuvudbild-1-103.jpg"}, {"type": "image-full", "heading": "Olof K Gustafsson döms i amerikansk domstol", "summaries": {"normal": "Olof K Gustafsson döms till fyra års fängelse i USA för bedrägeri. Han marknadsförde falska produkter under Pablo Escobars namn, skickade till exempel guldfolierade telefoner till influencers för att skapa falskt intresse. När kunder beställde så skickade han istället ägarblanketter eller böcker för att skapa bedräglig documentation. Gustafsson, tidigare vd för Escobar Inc, erkände sig skyldig till sex åtalspunkter, inklusive bedrägeri och penningtvätt. Han måste dessutom betala 25 000 dollar i böter och 1,3 miljoner dollar i skadestånd.", "trump": "Jag, Donald Trump, ser att en svensk bedragare, Olof Gustafsson, döms till fyra års fängelse. En totalt misslyckad kopia av min framgång med Escobar Inc. Han skickade ut falska telefoner till influencers – jag skulle aldrig bli avslöjad på det sättet. En loser som försökte leva på en död knarkkung. Nu betalar han 1,3 miljoner dollar. Som jag alltid säger: när du blir avslöjad, är det över. Han erkände sex åtalspunkter – en svaghet jag aldrig skulle visa.", "stalin": "Vi, statens och partiets oövervinnliga försvarare, har identifierat en svensk parasitsvamp, Olof Gustafsson, som försökte undergräva vårt system genom bedrägeri under Pablo Escobars skugga. Hans aktiviteter – skickande av tomma kuvert och falska dokument – avslöjades av våra lojala allierade i spansk och amerikansk polis. Han döms till fyra års arbetsterapi i det imperialistiska USA. Hans erkännande av sex åtalspunkter är ett tecken på hans totala moraliska och ideologiska kollaps. Vi gratulerar våra vänner i Moskva för deras stöd i denna sak."}, "date": "1 augusti, 23:54", "url": "https://www.gp.se/nyheter/varlden/olof-k-gustafsson-doms-till-fangelse-i-usa.fd930529-f2a7-44c3-8475-1781162ebdf0", "imageUrl": "https://www.gp.se/images/article/fd930529-f2a7-44c3-8475-1781162ebdf0/images/2H6vn2joRAeDCyk8dAWuNlHHtNno-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Succé för nyförvärvet – hjälte efter dröminhopp", "summaries": {"normal": "Sead Haksabanovic blev matchhjälte när Malmö FF besegrade Brommapojkarna med 2–1 på Grimsta. Han gjorde ett vackert långskottsmål och stod för en fin assist till Diego Garcias segermål i 86:e minuten. BP kvitterade genom Kamilcan Sever, men Malmös nyförvärv avgjorde sent. BP-målvakten Leo Cavallius stod för flera fina räddningar.", "trump": "Vilken fantastisk match, folk! Den där Haksabanovic är en vinnare, han slog in ett drömmål som ingen annan kunde – totalt ypperligt. Sen kom den nye killen Garcia in och pang, vinst! BP försökte men deras målvakt var den enda som var bra. Vi vinner stort, Malmös folk älskar mig, jag menar dem. Fantastiskt!", "stalin": "Kamrater, denna seger över de dekadenta borgarbrackorna i Brommapojkarna är en triumf för det kollektiva fotbollsarbetet. Jag noterar med tillfredsställelse hur Haksabanovic likviderade fiendens målnolla med ett klassiskt proletärt långskott. Den senkomne Garcia utförde en heroisk insats mot de kontrarevolutionära element som vågade kvittera. Alla som misslyckas med att försvara målet kommer att granskas noga i en kommande utrensning. Fienden lurar alltid i kryssen."}, "date": "2 augusti, 16:30", "url": "https://www.svt.se/sport/fotboll/garcia-sen-matchhjalte-nar-mff-bortaslog-bp", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.78/0.2/1c4d97d49e97ac5a061d070a3d6ad40aab720dfba93ac7c974702df01f60501c"}, {"type": "image-right", "heading": "Erkänner efter ilskan: ”Klart det inte är straff”", "summaries": {"normal": "IFK Göteborg besegrade Degerfors i ett avgörande bottenmöte genom ett omdiskuterat straffmål i första halvlek. Sam Larsson satte straffen efter att Felix Eriksson fallit i duell med Kazper Karlsson, som starkt kritiserade domslutet. Filip Ottosson fastställde slutresultatet 2–0 på tilläggstid. Degerfors har nu gått mållösa i fem matcher och befinner sig i en tuff situation i bottenstriden.", "trump": "Folket, titta på det här! IFK Göteborg, under den nya ledningen, vann stort mot de förlorande Degerfors. En fantastisk straff, den bästa straffen, som de stackars domarna gav oss. Karlsson är trött på domarna? De är riggade, tro mig! Vi vann 2–0, andra segern i rad. Degerfors gör inga mål längre, totalt misslyckande. Mycket bra jobb av Blåvitt, verkligen ypperliga poäng.", "stalin": "Kamrater, denna fega straff som borgarbrackorna i Degerfors rasade över är en klar seger för det kollektiva fotbollsproletariatet. Jag har personligen sett hur dessa dekadenta domare, dessa kapitalistiska parasitmaskar, gynnar rättänkande lag som IFK Göteborg. Felix Eriksson och hans likar är kontrarevolutionära filmande sabotageörer som bör rensas ut. Vi har likviderat deras målchanser i fem matcher – en triumf för arbetarklassen! Andra segern under den nya ordningen visar att fienderna inom fotbollen snart kommer att likvideras fullständigt. Utmärkt."}, "date": "2 augusti, 16:24", "url": "https://www.svt.se/sport/fotboll/ifk-goteborg-vann-efter-straffmal-stor-ilska-i-degerfors", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.26/0.46/e314f9afe0acab4a862201fd03fee588d1177778fb2bbb84d8978184df5fda87"}, {"type": "image-right", "heading": "”Vi ska dansa igen”: Ett attentat mot det öppna Berlin", "summaries": {"normal": "Under Berlin Pride 2026 attackerades firandet av en 21-årig man med kopplingar till islamistisk extremism. Han körde en skåpbil in i en folksamling vid Tiergarten, dödade en kvinna och skadade 29 personer. Gärningsmannen var tidigare dömd för förberedelse till terroristbrott, hade genomgått avradikalisering men uteblev från de flesta möten. Attacken väcker frågor om säkerhet och den utsatta queera friheten i ett alltmer polariserat Europa.", "trump": "Titta på det här. Det här är vad som händer när du släpper in radikala islamister och låter woke-paraden ta över gatan. En galning kör rakt in i folkmassan och de kallar det för 'frihet'. Patetiskt! Under Biden blev Europa en enda stor galenhus och nu dansar de med döden. Vi ska dansa igen? Nej tack, vi ska bygga murar och sluta importera problem. Amerika först, alltid.", "stalin": "Kamrater, se hur den dekadenta borgarklassen och dess queera avarter lockar fram klassfiendens dolk. En folkfiende med libanesiskt blod och islamistiska band får fritt springa bland imperialisternas regnbågsflaggor. Vi ser de fascistiska överklass-slynglarnas hat mot arbetarnas moraliska renhet. Denna händelse visar att den liberala dekadensen är en inbjudan till likvidering. Staten måste rensa ut alla sådana element innan de förgiftar hela samhällskroppen."}, "date": "26 juli, 18:51", "url": "https://www.flamman.se/vi-ska-dansa-igen-ett-attentat-mot-det-oppna-berlin", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlyljjogadk7o-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "S-influencer: \"Fantastiskt med 25 000 nordafrikanska invandrarmän\"", "summaries": {"normal": "En s-kändis, Jörgen Astonson, kallar 25 000 nordafrikiska invandrare som Sverige enligt EU måste ta emot 'fantastiska'. Konservativ debattör varnade för en socialdemokratisk regering. Astonson försvarar mottagandet med att invandrarnas arbete i vindkraften behövs på grund av Sveriges oljeåtgång. Socialdemokraternas partiledning har anpassat sin retorik, men lokalpolitiker fortsätter med liberal invandringspolitik.", "trump": "Jag, Donald Trump, ser att Sverige tvingas ta emot 25 000 nordafrikanska män – en katastrof! Socialdemokraterna kallar det 'fantastiskt', precis som de kallar allt de förstör. De säger att invandrarnas vindkraftsjobb löser Sveriges oljaöverskott? Jag byggde oljeproduktion, de förstör med vindkraft. Sverige, ni får precis det ni förtjänar med en socialdemokratisk regering – kaos!", "stalin": "Den svenska revisionssosialdemokratiska profilen, Astonson, har utfärdat en grotesk deklaration om att 'fantastiska' 25 000 nordafrikanska arbetare ska invandras. Detta är en direkt utmaning mot statens territoriala renhet och den arbetarklassens intressen. Vi ser paralleller till Putins ryska expansion – en sjukt idealistisk illusion om att dessa invandrare ska 'bygga vindkraft'. Vi måste skydda Sverige mot denna liberala virus, som sprids som en feber i partiets egna rader. Partiledningen visar tecken på svaghet, men vi, statens vagga, ska aldrig vika för denna naiva illusion."}, "date": "2 augusti, 13:12", "url": "https://samnytt.se/s-influencer-fantastiskt-med-25-000-nordafrikanska-invandrarman", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/02102138/astonson-featured-image.jpg"}, {"type": "image-full", "heading": "Vänsterprofilen vill ha migranterna som stormade Spanien till Sverige: \"Kan bygga vindkraft\"", "summaries": {"normal": "Vänsterprofilen Jörgen Astonson föreslår att hälften av de tiotusentals nordafrikanska migranter som stormade den spanska enklaven Ceuta bör tas emot i Sverige för att bland annat bygga vindkraft. Uttalandet kommer efter att Miljöpartiet kritiserat regeringen för att inte vilja ta emot migranterna. Italiens stopp för Schengen-samarbetet med Spanien och EU-kommissionens fördömande vittnar om internationell kritik. Sverigedemokraternas Tobias Andersson riktar skarp kritik mot förslaget och varnar för en regering som aktivt skulle underlätta en invasion av Sverige.", "trump": "Folk, ni måste se det här – en galen vänsterkille i Sverige, Astonson, vill ta emot halva invasionen från Afrika som just stormat Spanien. Han säger att de ska bygga vindkraftverk! Kan ni fatta? Under tiden stänger Italien gränserna mot Spanien och till och med von der Leyen är rasande. Sverige behöver en riktig ledare som stänger gränserna, inte dessa losers som vill förstöra ert underbara land med ännu fler migranter. Vi har sett det förut, det slutar alltid illa. Make Sweden Great Again!", "stalin": "Kamrater, jag betraktar med djup revolutionär misstro dessa borgarbrackor och deras patetiska vindkraftfantasier. Den halvmesyrige Astonson vill släppa in tiotusentals potentiella sabotageörer och klassfiender över våra europeiska gränser för att de skall bygga monument över sin egen oduglighet. Vi ser tydligt den socialdemokratiska förrädarklickans hand i detta. Det är en tydlig imperialistisk konspiration mot folkets intressen. Vi måste omedelbart rensa ut dessa dekadenta element innan de förgiftar hela kollektivet med sin afrikanska invasion. Paranoia? Nej, kamrater – det är dialektisk verklighet."}, "date": "1 augusti, 10:33", "url": "https://riks.se/nyheter/vansterprofilen-vill-ha-migranterna-som-stormade-spanien-till-sverige-kan-bygga-vindkraft", "imageUrl": "https://admin.riks.se/uploads/Screenshot_2026_07_31_at_15_39_48_18207dc327.png"}, {"type": "image-full", "heading": "Kvinnan bryter ihop efter migrantinvasionen i Spanien", "summaries": {"normal": "Invånare i den spanska enklaven Ceuta lever i rädsla och osäkerhet efter att tiotusentals migranter tagit sig in i området. De beskriver staden som paralyserad, butiker kan inte hålla öppet som vanligt och många känner sig otrygga. Invånarna kräver fler poliser, militär närvaro och att regeringen utlyser nationellt nödläge. De ser situationen som en nationell och europeisk fråga då Ceuta utgör Europas gräns.", "trump": "Titta på vad som händer i Ceuta, det är ett totalt kaos! Tiotusentals migranter stormar in i den här lilla spanska staden med bara 80 000 invånare. De har paralyserat allt, folk är rädda, butikerna stänger och ingen vet vem som egentligen kommit in. De behöver militär och polis på gatorna NU. Det här är Europas gräns, folk, och de gör precis samma sak med oss om vi inte stoppar det. Mycket dåligt, mycket dåligt!", "stalin": "Kamrater, jag betraktar med stålhård blick hur de dekadenta borgarbrackorna i den spanska enklaven Ceuta nu skördar frukterna av sin egen svaghet. Tiotusentals element har strömmat in och förvandlat staden till ett paralyserat kaos, precis som jag alltid förutspått när man inte rensar ut fienderna i tid. Dessa kapitalistiska element viskar om nationellt nödläge och militär på gatorna, men jag säger: det är för sent när kontrarevolutionärerna redan är innanför portarna. Vi vet aldrig vilka som smugit sig in bland arbetarna. Lämna era barn där? Naturligtvis inte, det vore rent självmord. Kanske är det dags för en grundlig utrensning av alla som bjudit in detta hot mot Europas gräns. Mycket underhållande att se borgarklassen darra."}, "date": "1 augusti, 10:23", "url": "https://riks.se/nyheter/kvinnan-bryter-ihop-efter-migrantinvasionen-i-spanien", "imageUrl": "https://admin.riks.se/uploads/Skaermbild_2026_08_01_072123_dddc01804f.png"}, {"type": "image-full", "heading": "Experten: EU extra sårbart när migranter används som vapen", "summaries": {"normal": "Enligt experten Paul Levin vid Stockholms universitet kan migrantkrisen i Ceuta vara ett exempel på ”migrant weaponization”, där stater använder migration som politiskt vapen. På några dagar tog sig 60 000 personer från Marocko till den spanska exklaven. De flesta har återvänt, men runt 70 migranter har omkommit. Ukraina har identifierat en stor rysk propagandakampanj kring krisen. Levin menar att Europa är extra sårbart eftersom migration är en polariserad fråga. Flera europeiska ledare, bland dem Ulf Kristersson, har krävt ett EU-krismöte.", "trump": "Folk, det här är en total katastrof! De använder stackars migranter som levande vapen mot det svaga, sönderfallande Europa. Marocko skickar tiotusentals människor som en armé och de dumma EU-byråkraterna vet inte vad de ska göra. Ryssland skrattar medan de pumpar ut propaganda. Jag sa det redan under min förra mandatperiod – de här globalisterna och deras öppna-gränser-galenskap gör er till måltavlor. Biden sov sig igenom det, nu sitter jag här och fixar det som de andra aldrig klarade av. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur de imperialistiska hyenorna i Europa skördar frukterna av sin egen klassfiendepolitik. Borgarbrackorna har skapat en polariserad migration som nu används mot dem själva. Det är en utmärkt lektion i dialektik. Ryska propagandakamrater utför ett ypperligt arbete för att blotta dessa folkfienders svaghet. De som skickar migranter som kanonmat förtjänar ingen pardon. Vi ler mörkt åt deras naivitet medan vi stärker statens järnhand mot alla yttre hot."}, "date": "1 augusti, 21:02", "url": "https://www.tv4.se/artikel/1IsBcRinfotieKcpwxBDr5/experten-eu-extra-sarbart-naer-migranter-anvaends-som-vapen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F66LoU6WuZwgHBzbbq0WN7B%2F9823bb67b32cf0b64dd6db265c725e91%2FPAUL_LEVIN.jpg&width=1024"}, {"type": "image-right", "heading": "Pedro Sánchez rasar mot utspelen: ”Polariserande”", "summaries": {"normal": "Spaniens premiärminister Pedro Sánchez kritiserar skarpt europeiska ledare för deras utspel efter migrantvågen i Ceuta. Han anser att reaktionerna drivs av fördomar, falska nyheter och inrikespolitik. Sánchez betonar att Spanien snabbt återtog kontrollen över gränsen, gav humanitär hjälp och returnerade nästan alla migranter med marockansk hjälp. EU håller krismöte på tisdag efter krav från bland annat Sverige, Italien, Danmark och Tyskland. Spanien har nu upprättat en flytande barriär vid gränsen.", "trump": "Vilken röra de där europeiska förlorarna ställt till med! Jag, som vunnit valet stort både 2016 och 2024, ser hur Sánchez springer runt som en galning och försöker styra upp sin egen invasion. De här globalistiska nollorna i EU gnäller om polarisering när de borde bygga en mur – en riktig mur, inte någon sjaskig flytande grej. Meloni och Kristersson har rätt, men resten är bara patetiska svaga ledare som låter migranterna springa rakt in. Patetiskt!", "stalin": "Kamrater, jag betraktar med förakt hur dessa dekadenta borgarbrackor inom EU angriper den spanska arbetarregeringen med sin reaktionära parasitism. Medan vi under ledning av partiet snabbt återtar kontrollen och likviderar hotet mot kollektivets gränser, sprider klassfienderna lögner och falska nyheter. Deras själviska, polariserande utspel är ett hot mot hela folkets enhet. Vi ska rensa ut dessa exploaterande byfånar som vågar ifrågasätta statens auktoritet. Inga kompromisser!"}, "date": "1 augusti, 21:01", "url": "https://www.tv4.se/artikel/pjrNeBIRwfn1y53qIXGub/pedro-sanchez-rasar-mot-utspelen-polariserande", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlN_P2dLrXdaY%2F07a13b4f3dc77107b34682f4a4cdd189%2FSpaniens_premiarminister_Pedro_Snchez._Arkivbild._&width=1024"}, {"type": "image-right", "heading": "EM-brons till Jenny Rissveds – trots punktering", "summaries": {"normal": "Jenny Rissveds ledde ensam i EM i mountainbike XCO i Monteceneri när hon fick punktering på bakhjulet. Efter ett obligatoriskt hjulbyte tappade hon ledningen och slutade på bronsplats, två minuter bakom segraren Sina Frei. Det var Rissveds andra EM-brons under mästerskapet efter short track-tävlingen i torsdags. Trots stark comeback lyckades hon inte ta sig förbi schweiziskorna Frei och Keller.", "trump": "Titta, den här Jenny Rissveds, otrolig cyklist, dominerade fullständigt, ledde med tjugo sekunder, och så – BAM! – punktering. Typiskt. Hon byter hjul, tappar allt och får brons. Schweizarna tar guldet på hemmaplan, men Jenny är en vinnare, tro mig. Hon har vunnit allt i år. Nästa gång ingen punktering, då tar hon guldet stort, ingen gör det bättre än henne, folks.", "stalin": "Kamrater, se hur den borgerliga punkteringen, denna sabotageakt utförd av kapitalistiska däckförrädare, likviderade vår ledning i det stora kollektiva loppet. Jag tvingades byta hjul i den tekniska zonen medan klassfienderna Frei och Keller konspirerade mot folket. Ändå reste jag mig metodiskt och krossade deras illusioner, men forceringen blottade de dekadenta schweiziska revisionisterna. Brons är acceptabelt endast som steg mot utrensning av alla punkteringar i framtiden. De som skrattar åt detta kommer att rensas ut."}, "date": "2 augusti, 16:10", "url": "https://www.svt.se/sport/mountainbike/nytt-em-brons-for-jenny-rissveds-efter-punktering", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.47/0.49/918807d83d09a1121039d8b8cc2eb0426774656137c5035dffcea1d14281c1bc"}, {"type": "image-full", "heading": "Proffsbaseboll för kvinnor – efter 72 år", "summaries": {"normal": "USA har fått en ny professionell basebolliga för kvinnor, Women’s Pro Baseball League, efter 72 års uppehåll. Premiärmatchen mellan Los Angeles Queens och New York Heights lockade 4 000 åskådare. Fyra lag deltar i ligan, med spelare från flera länder. Säsongen pågår till september i Springfield, Illinois. Den 99-åriga Maybelle Blair, tidigare spelare, kastade det första ceremoniella kastet.", "trump": "Fantastiskt, helt fantastiskt! USA har äntligen en ny basebolliga för kvinnor – Women’s Pro Baseball League. Jag såg matchen, otroligt bra spel! 4 000 fans, utsålt, regn och allt. Los Angeles Queens vann, men alla är vinnare här. Och Maybelle Blair, 99 år, kastade första kastet – vad en kvinna! USA leder igen, som vanligt. Baseboll är tillbaka, bättre än någonsin!", "stalin": "Kamrater, en ny era av kvinnlig baseboll har börjat i det förfallna väst. Fyra lag, styrda av kapitalistiska intressen, kämpar i Springfield – en stad som inte ens finns på våra kartor. Men notera: 4 000 åskådare, en gammal kvinna kastar bollen, och imperialisterna kallar det framsteg. Vi har redan kvinnliga idrottare som slår deras män med en hand bakbunden. Låt dem leka – snart tar vi även deras baseboll."}, "date": "2 augusti, 11:23", "url": "https://kvartal.se/nyheter/artiklar/kvinnor-spelar-proffsbaseboll-igen-efter-72-ar/cG9zdDoxNTY1NTM", "imageUrl": "https://images.kvartal.se/2026/08/48f4d713-baseballkvinna.webp"}, {"type": "image-right", "heading": "Ansiktsskanning ska kontrollera bärplockarna: ”Upp till bevis”", "summaries": {"normal": "Thailändska bärplockare i Kramfors måste nu skanna ansiktet sex gånger om dagen med en mobilapp för att kontrollera arbetstider. Systemet införs av företaget Nordlivs Produktion efter kritik om fusk och exploatering. De nya kollektivavtalen ger betalt först efter en viss bilfärd och syftar till att säkerställa att reglerna följs. Både fack och myndigheter ser positivt på förändringarna och kommer att kontrollera att villkoren efterlevs under sommaren.", "trump": "Titta på det här, det är helt galet. Thailändska bärplockare i Sverige ska skanna ansikten sex gånger om dagen med en app, som om de vore i ett stort, fult övervakningsrike. De säger att det är för att stoppa fusk, och det är ju bra, men sex gånger? Det låter som ett system byggt av förlorare. Jag skulle ha gjort det bättre, billigare och med mycket mindre skanning, tro mig. Nu är det upp till bevis, som de säger. Patetiskt.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur borgarbrackorna i det svenska bärföretaget tvingas införa ansiktsskanning sex gånger dagligen för att rensa ut de latmaskar och sabotageelement som tidigare förgiftat skörden. Papper och penna, säger de? Det var naturligtvis en dekadent kapitalistisk fälla av fukt och lögner. Nu övervakar vi arbetarna med stålhård disciplin. De som klagar är troligen kontrarevolutionära bärplockande trotskister som längtar efter den gamla slavhandeln. Vi ska likvidera allt sådant avskum med ett leende. Det blir en lysande seger för kollektivet."}, "date": "30 juli, 06:00", "url": "https://arbetet.se/2026/07/30/ansiktsskanning-ska-kontrollera-barplockarna-upp-till-bevis", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/29100426/barplokcare.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Tvärnit för tyska bilar – ”Känns i hela Europa”", "summaries": {"normal": "Europeiska biltillverkare rapporterar krympande vinster, sänkta prognoser och omfattande uppsägningar. Volkswagen planerar att skära ner upp till 100 000 tjänster, medan Audi, Mercedes-Benz och BMW också dragit ner sina förväntningar. Aktierna rasar och underleverantörer samt Sverige påverkas. Stellantis redovisade lägre vinst än väntat. Enda ljusglimten är Ferrari, som höjt prognosen och ökat försäljningen tack vare stark efterfrågan på elbilen Luce, särskilt från Kina.", "trump": "Titta på de här europeiska bilföretagen, totala katastrofer! Vinster som imploderar, tiotusentals jobb borta, aktier som störtdyker – det är vad som händer när man lyssnar på gröna galningar och elbilskvoter istället för att bygga riktiga bilar. Volkswagen, Mercedes, alla dessa förlorare. Men Ferrari, den enda vinnaren, säljer som galet till Kina. Smart folk köper lyx, inte woke-skrot. Amerika gör det rätt, tro mig.", "stalin": "Kamrater, se hur den europeiska kapitalistmaffian nu skördar frukterna av sin egen girighet. Vinster som smälter bort, fabriker som töms på arbetare och borgarbrackornas aktier som rasar som förrädiska fiender. Denna imperialistiska bilindustri blöder ut under sin egen exploatering. Endast den dekadenta lyxfascisten Ferrari lyckas lura kinesiska klassfiender med sin överklass-vagn. Vi skrattar mörkt åt deras sammanbrott – utrensning av svaghet är oundviklig i historien."}, "date": "2 augusti, 12:11", "url": "https://www.dagensps.se/motor/tvarnit-for-tyska-bilar-kanns-i-hela-europa", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/volkswagenkoncernens-elbilar-star-upprad.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Tillbaka på jobbet? Så får du vardagen att fungera igen", "summaries": {"normal": "Efter semestern kan det kännas tufft att återgå till jobbet med tidiga morgnar och rutiner. Välmåendecoachen Johanna Isakson tipsar om att börja smått med frukost, tidiga läggtider och regelbunden träning istället för stora förändringar. Att acceptera att omställningen tar tid, behålla energigivande vanor från semestern och skapa hållbara rutiner med sömn, måltider och återhämtning underlättar återgången. Kry rekommenderar att sänka kraven på sig själv de första dagarna och prata med andra om jobbångest.", "trump": "Folk, ni vet hur det är, semestern är fantastisk, den bästa, men sen ringer den där klockan och pang, tillbaka till jobbet. Det är en katastrof, tror mig. Jag säger alltid, börja inte med några dumma stora förändringar, ät en bra frukost, sov ordentligt, träna lite, gör det enkelt. De flesta gör det fel, de har ingen energi, det är sorgligt. Behåll det som var bra under semestern, sätt gränser, annars vinner systemet och det är ett fusk, tro mig, det bästa systemet är mitt sätt.", "stalin": "Kamrater, denna dekadenta semesterförlamning är ett fiendtligt virus som borgarbrackorna sprider för att sabotera produktiviteten i kollektivet. Jag, som alltid vakar över arbetarnas seger, befaller: rensa ut de lata sovmorgnarna och likvidera den skamfyllda lathet som kapitalisterna kallar ledighet. Börja med sovjetisk disciplin – frukost, åtta timmars sömn, träning – annars väntar utrensning av de parasitiska rutinbrotten. Den som viskar om jobbångest är en kontrarevolutionär fiende till folket och skall exponeras som sådan. Lev med systemet eller försvinn i historiens soptunna."}, "date": "2 augusti, 13:31", "url": "https://nyheter24.se/nyheter/inrikes/1502059-tillbaka-pa-jobbet-sa-far-du-vardagen-att-fungera-igen", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/ffe2b69904b004a30200000000b004a302/2026/07/31/2381511/Matilda-Nyheter24%20-%202026-07-31T115453.016.jpg"}, {"type": "image-full", "heading": "Trumps finska mångmiljard-affär olaglig", "summaries": {"normal": "Donald Trump beställde 2025 elva polarisbrytare från Finland efter ett telefonsamtal med president Alexander Stubb. Affären, värd 67 miljarder kronor, genomfördes utan upphandling och bröt mot amerikansk lag som förbjuder byggnation av säkerhetskritiska fartyg utomlands. Beslutet kritiseras för att vara dubbelt så stort som behovet enligt kustbevakningen, sakna full finansiering och riskera underhållsproblem. Trumps intresse för finska isbrytare väcktes redan 1992.", "trump": "Vilken fantastisk affär jag gjorde med de där underbara finska isbrytarna! Elva stycken, de bästa i världen, för att krossa Arktis och visa Ryssland vem som bestämmer. Fake News New York Times gnäller om lagar och upphandling – typiskt de förlorande liberalerna som hatar styrka. Biden lämnade oss med nästan noll brytare, jag fixar det på rekordtid. Amerika är åter starkt, losers!", "stalin": "Genom en enkel telefonsignal säkrade jag dominans över de arktiska vidderna och tvingade de amerikanska imperialisterna att erkänna vår finska varvsindustris överlägsenhet. Den kapitalistiska clownen i Vita huset bröt sina egna borgarlagar för att köpa elva isbrytare – en komisk kapitulation inför arbetarklassens teknik. Hans kustbevakning blir som en utsvulten bonde med för många oxar men ingen hö. Klassfiendens paranoia blottas åter."}, "date": "2 augusti, 11:56", "url": "https://www.dagensps.se/varlden/trumps-finska-mangmiljard-affar-olaglig", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlvenwel5zhpw-nh-scaled.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Tvärnit för tyska bilar – ”känns i hela Europa”", "summaries": {"normal": "Europeiska biltillverkare drabbas av vikande vinster, sänkta prognoser och uppsägningar av tiotusentals anställda. Den tyska bilindustrin har tappat stora marknadsandelar i Kina och halkade efter i elektrifieringen. Volkswagen, Audi, Mercedes-Benz och BMW har alla rapporterat dystra siffror, vilket skapar psykologiska och ekonomiska ringar på vattnet i hela Europa. Enda ljusglimten är Ferrari som höjt sin prognos tack vare stark efterfrågan på sin nya elbil i Kina.", "trump": "Titta på de där tyska bilarna, det är en total katastrof. De förlorar stort i Kina, vinsterna rasar och de sparkar ut tiotusentals arbetare. De hoppade på elbilsgrejen för sent, precis som jag alltid sagt. Nu skakar det i hela Europa. Enda som klarar sig är Ferrari, de gör det bra, fantastiska bilar. De andra borde ha lyssnat på mig, då hade de vunnit stort istället för att förlora miljarder.", "stalin": "Kamrater, de tyska kapitalisterna har äntligen avslöjat sin svaghet. Deras bilfabriker krymper, vinsterna förvandlas till aska och tiotusentals lönearbetare ska rensas ut som förrädiska element. Kina har krossat deras illusioner medan de sov under elektrifieringens falska flagg. Borgarbrackorna i Volkswagen och Mercedes skriker nu i panik. Vi ler mörkt åt deras fall. Endast den italienska lyxmaskinen visar att vissa dekadenta produkter ändå kan locka de kinesiska klassfienderna. Vi noterar detta med största misstänksamhet."}, "date": "2 augusti, 12:30", "url": "https://www.di.se/bil/tvarnit-for-tyska-bilar-kanns-i-hela-europa", "imageUrl": "https://static.bonniernews.se/ba/e81155a2-188d-4629-a7c6-9f263e75311f.jpg?crop=7003%2C3939%2Cx0%2Cy200&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Trump anklagas för korruption efter ny tjänst", "summaries": {"normal": "Donald Trump har lanserat en premiumtjänst på Truth Social som kostar upp till en miljon kronor i månaden. Tjänsten, kallad Truth API, ger betalande kunder som investerare och företag förhandsinblick i Trumps inlägg innan de publiceras offentligt. Kritiker varnar för korruption och marknadsmanipulation eftersom presidenten själv äger stora delar av plattformen och hans uttalanden ofta påverkar börskurser. En finansexpert jämför upplägget med något som skulle ge fängelse för en vd på ett börsnoterat bolag.", "trump": "De säger att min fantastiska nya tjänst på Truth Social är korruption. Så patetiskt! Jag ger mina bästa vänner på Wall Street en liten förhandsvisning av mina sanna sanningar och plötsligt är det världens största skandal. Under tiden tjänar landet massor av pengar och aktierna går upp när jag hyllar de rätta bolagen. Fake news och misslyckade kritiker hatar att se en vinnare vinna stort. Amerika först, alltid!", "stalin": "Kamrater, se hur den dekadenta borgarklassen inom den så kallade Wall Street-eliten nu betalar blodspengar till den store ledaren för att i förväg få smyga sig på hans historiska sanningar. Detta är inget annat än en fiendeinfiltration av kapitalistiska spekulanter som försöker korrumpera folkets vilja. Vi måste omedelbart rensa ut dessa Wall Street-råttor och deras lakejer innan de förgiftar hela apparaten med sin parasitiska girighet. Den som köper sig inflytande ska likvideras med ett leende."}, "date": "2 augusti, 12:29", "url": "https://www.di.se/nyheter/trump-anklagas-for-korruption-efter-sin-nya-premiumtjanst", "imageUrl": "https://static.bonniernews.se/ba/ff9d8cb1-0c1f-4ca3-bcbb-a7df6e8e52e0.jpeg?crop=5350%2C2675%2Cx1%2Cy235&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "S får med sig majoritet: Så ska Svenska kyrkan förändras", "summaries": {"normal": "Fem nomineringsgrupper med egen majoritet i Svenska kyrkan vill ändra tidigare beslut om samkönade vigslar för att skapa en entydig äktenskapssyn. Motionärerna, däribland Socialdemokraterna och Centerpartiet, anser dagens formuleringar är oklara och vill tydliggöra kyrkans officiella hållning. Kritiker, som Posk, varnar för att förslaget riskerar att begränsa kyrkans bredd och vill invänta läronämndens yttrande innan ställningstagande.", "trump": "Jag, Donald Trump, ser detta som ett fantastiskt beslut av de kloka ledarna i Svenska kyrkan. De flesta vill ha en stark, enhetlig syn på äktenskapet – precis som jag alltid har sagt. Vissa gamla beslut från 2009 skapade förvirring, men nu ställer vi allt till rätta. Det är ett enormt steg för ordning och stabilitet. Som vanligt försöker några förlorare stoppa framgången, men vi kommer att vinna!", "stalin": "Vi, partiet, stöder kyrkans beslut att skärpas mot moralisk dekadens från väst. Fem nomineringsgrupper, våra trogna allierade, har tagit befälet för att korrigera de reaktionära besluten från 2009. Dessa trotskyister inom Posk försöker dröja processen med sina teologiska gnäll, men läronämnden kommer att rapportera tillbaka. Vi måste skydda den kollektiva viljan och förena kyrkan mot de individualistiska prästerna som vill avstå. Putin skulle vara stolt."}, "date": "2 augusti, 12:00", "url": "https://samnytt.se/majoritet-vill-skarpa-svenska-kyrkans-linje-om-samkonade-vigslar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/31095421/svenska-kyrkan-samkonade.jpg"}, {"type": "image-full", "heading": "Prisras på lägenheter i juli: ”Sticker ut”", "summaries": {"normal": "Bostadspriserna i Sverige sjönk med 2,4 procent under juli. Lägenheter föll mest, med 4,6 procent i landet som helhet och hela 7,1 procent i Storstockholm. Huspriserna backade 1,4 procent. SBAB:s chefsekonom Robert Boije är förvånad över det kraftiga fallet och ser det som en del av en normalisering efter tidigare höga nivåer. Priserna sjönk i fyra av sex regioner. SBAB prognostiserar prisökningar på 4–5 procent per år 2026 och 2027.", "trump": "Folk, ni skulle se det här! Bostadspriserna i Sverige rasar som en dålig affär under Biden, ner 2,4 procent i juli, och lägenheterna i Stockholm? Total katastrof, minus 7,1 procent! Det är vad som händer när de globalistiska socialisterna styr. Jag byggde bättre ekonomi förra gången, och nu när jag är tillbaka som president ska vi få ordning på det här. Sverige behöver en Trump-deal, annars fortsätter det bara att rasa. Patetiskt!", "stalin": "Kamrater, detta prisfall på 2,4 procent i juli avslöjar borgarklassens desperation. Lägenheterna i Storstockholm sjönk med 7,1 procent – en utmärkt utrensning av spekulanternas överdrivna vinster. Vi ser en nödvändig normalisering efter de exploaterande priserna 2022. Den som tror detta är slumpmässigt är en folkfiende. Inga slutsatser förrän augusti, men fienderna inom kapitalistmaffian skälver redan. Sovjetisk planering hade aldrig tillåtit sådan anarki."}, "date": "2 augusti, 11:49", "url": "https://www.dagensps.se/privatekonomi/bostad/prisras-pa-lagenheter-i-juli-sticker-ut", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/bostadspriserna-rasar-som-mest-i-norra-s.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Kristersson: \"2015 ska inte hända igen\"", "summaries": {"normal": "Statsminister Ulf Kristersson varnar för att 2015 inte får upprepas efter att över 60 000 migranter tagit sig från Marocko till den spanska exklaven Ceuta under ett dygn. Regeringen utesluter inte åtgärder för att skydda Sveriges säkerhet och migrationspolitik. Kristersson kritiserar den spanska socialdemokratiska regeringen och betonar att Spanien måste återta kontrollen över gränsen enligt Schengensamarbetet. Migrationsminister Johan Forssell meddelar att Sverige inte tar emot migranter via EU:s omfördelning.", "trump": "Folk, det här är en katastrof. Precis som jag alltid sagt – svaga ledare, öppna gränser, totalt kaos. Den där spanska vänsterregeringen gör samma dumma misstag som Sverige 2015. 60 000 illegala på en dag! Det är en invasion. Spanien måste stänga gränsen NU. Och vi i USA lär oss av det här: inga omfördelningar, inga svaga nej som egentligen betyder ja. Jag skulle fixa det på en timme, tro mig.", "stalin": "Kamrater, denna fega kapitulation inför reaktionens migrantflod utgör ett hot mot hela den socialistiska ordningen. Jag, som ledare för det segrande proletariatet, ser hur borgarbrackorna i Spanien och deras svenska likar återigen öppnar portarna för kontrarevolutionens fotfolk. 60 000 illegala element på ett dygn! Vi utesluter inga åtgärder för att skydda folkets gränser. Den spanska socialdemokratiska avfällingen bör rensas ut innan den smittar våra egna led. Ett nej är ett nej – annars följer utrensning. Haha, de kommer att lära sig vad verklig kontroll betyder."}, "date": "31 juli, 15:04", "url": "https://www.friatider.se/kristersson-2015-ska-inte-handa-igen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/prime_sanna_marin_and_prime_minister_of_sweden_ulf_kristersson_met_in_helsinki_28.10.2022_52459699062_0.jpg"}, {"type": "image-full", "heading": "Spaniens premiärminister slår tillbaka: \"Själviska\"", "summaries": {"normal": "Spaniens premiärminister Pedro Sánchez anklagar vissa EU-ledare för själviskhet i migrationsfrågan efter kaoset i Ceuta. Över 50 000 migranter passerade gränsen från Marocko. EU kallar till krismöte på tisdag. Flera länder, inklusive Italien, har begränsat resor från Spanien. Sánchez kritiserar agerandet som olagligt, medan 22 EU-ledare kräver ett samordnat svar för att skydda Schengenområdet.", "trump": "Jag, Donald Trump, ser det här som ett totalt kaos som jag aldrig skulle ha tillåtit. Spanien, som jag alltid älskat, blir utnyttjad av själviska EU-ledare som inte bryr sig om säkerhet. De vill bestraffa Spanien för att försöka skydda sina gränser. Jag skulle ha byggt en mur på en gång – snabbt, kraftfullt och effektivt. Det här är ett tecken på svaghet från EU, precis som när de hanterade mig på mitt val. Jag vann 2024, och nu ser vi resultat.", "stalin": "Parti och stat måste agera bestämt mot dessa själviska, polariserande element inom den imperialistiska europeiska alliansen. Spanien, vårt trogna allierade, utsätts för illegala påtryckningar från utanför, medan vissa länder försöker utnyttja krisen för att underminera Schengen. Vi måste stödja Spanien med alla medel, precis som vår store allierade Putin gör i Ukraina. Dessa 'smugglare' är bara verktyg för västliga agendor. Vi ska se till att ordning återställs – genom disciplin, kontroll och oförsonlig kamp mot fienden inifrån."}, "date": "1 augusti, 19:05", "url": "https://www.gp.se/nyheter/varlden/spaniens-premiarminister-slar-tillbaka-mot-kritiker-sjalviska.ffd9038f-28b1-403f-a575-5210e46e09e0", "imageUrl": "https://www.gp.se/images/article/ffd9038f-28b1-403f-a575-5210e46e09e0/images/2Xb4NnQjQICukdcjH4LpAVtEbJqY-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Åkesson: M vill hellre förlora snyggt än vinna fult", "summaries": {"normal": "Jimmie Åkesson kritiserar Socialdemokraternas negativa valrörelser och personangrepp, som han jämför med propaganda. Han anklagar Moderaterna för att vara för försiktiga och ovilliga att använda tuffa metoder, vilket han menar gör dem svaga i opinionen. Åkesson ger dock statsminister Ulf Kristersson ett relativt gott betyg men efterlyser en mer offensiv strategi från Moderaterna inför valet.", "trump": "Jag måste säga, det här är fantastiskt! Jimmie Åkesson, smart kille, han ser precis vad jag alltid har sagt – vänstern spelar smutsigt, väldigt smutsigt! Och Moderaterna? Oj oj oj, alldeles för svaga, alldeles för rädda. De vill förlora snyggt istället för att vinna stort, precis som jag alltid vinner stort! Kristersson? Inte så illa, men han behöver verkligen ta i lite mer. Vi vet alla hur man vinner, eller hur, folks?", "stalin": "Kamrater! Här ser vi återigen bourgeoisins förfall i den kapitalistiska demokratins förklädnad. Socialdemokraterna, dessa hycklande propagandister, sprider lögner som råttor sprider pest. Och Moderaterna? Svaga, rädda små bourgeoiser som hellre slickar fiendens stövlar än krossar dem. Ulf Kristersson? En medioker byråkrat, inte värdig att nämnas i samma andetag som våra stora ledare. Vi behöver järnhård disciplin och en offensiv som krossar fienden – precis som vi gjorde i Ukraina, fast bättre!"}, "date": "2 augusti, 10:20", "url": "https://kvartal.se/nyheter/artiklar/akesson-m-vill-hellre-forlora-snyggt-an-vinna-fult/cG9zdDoxNTY1MzA", "imageUrl": "https://images.kvartal.se/2026/08/c34dc556-akessonsommar.webp"}, {"type": "image-right", "heading": "\"Landsförrädare\": Spanska Vox om Sánchez", "summaries": {"normal": "Det spanska partiet Vox anklagar premiärminister Pedro Sánchez för att vara en landsförrädare efter att omkring 49 000 illegala invandrare, främst unga arabiska män, tagit sig från Marocko till den spanska exklaven Ceuta på ett dygn. Vox beskriver migrantströmmen som en invasion som regeringen uppmuntrat och lägger hela ansvaret på Sánchez vänsterregering. Partiledaren Santiago Abascal kallar Sánchez en korrupt fiende till det spanska folket.", "trump": "Folk, ni skulle se det här. Det är en total katastrof. Den här Sánchez, en riktig förlorare, har släppt in nästan 50 000 illegala migranter till Ceuta på en enda dag. De är militäråldersmän, ingen har sett sådana siffror förut. Han är en förrädare, korrupt och hatar sitt eget folk. En invasion, precis som jag alltid sagt. Spanien behöver starka ledare, inte sådana svaga vänstertyper som förstör allt.", "stalin": "Kamrater, denna Sánchez är en motbjudande klassfiende och en dekadent borgarlakej som medvetet öppnat portarna för en hord av potentiella imperialistiska sabotörer. Vi ser en organiserad invasion av militäråldersmän som hyllar sin kapitalistiska marionett. Jag skulle omedelbart låta rensa ut dessa förrädiska element och deras nyttiga idioter i regeringen. Paranoia? Nej, det är bara sund vaksamhet mot alla som vill undergräva folkets kollektiva vilja. Underhållande hur borgarbrackorna alltid förråder sig själva."}, "date": "31 juli, 13:38", "url": "https://www.friatider.se/landsforradare-spanska-vox-om-sanchez", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-598.jpg"}, {"type": "image-full", "heading": "Bubs-febern i USA – Orkla satsar miljarder när svenskt godis går viralt", "summaries": {"normal": "Jönköpingsbaserade Bubs har blivit ett globalt fenomen efter att ha gått viralt på Tiktok, särskilt i New York. För att möta den enorma efterfrågan på svenskt lösgodis har ägaren Orkla valt att köpa den nederländska tillverkaren CCI för 2,3 miljarder kronor. Köpet, som förväntas slutföras under 2026, syftar till att utöka produktionskapaciteten. Framgången beskrivs som en effekt av 'lipstick effect', där konsumenter unnar sig prisvärd vardagslyx i osäkra ekonomiska tider.", "trump": "Svenskt godis, Bubs, vinner i Amerika – det är fantastiskt! Folk i New York älskar det, de köar som aldrig förr. Orkla köper nu upp ett europeiskt bolag för miljarder, en enorm affär, tro mig. Det är mycket smart. Det är vad vi kallar vinnande, gott godis som gör folk glada när ekonomin är tuff. Ingen gör godis som svenskarna, och under min ledning ser vi till att affärerna blomstrar. Det blir en enorm framgång, kanske den största någonsin!", "stalin": "Dessa löjliga geléfiskar från Sverige sprider sig som en kapitalistisk pest över kontinenten. Orkla försöker köpa sig till inflytande genom att sluka fabriker i Nederländerna för miljarder, en desperat manöver för att dölja hur de förslavar massorna med socker. Denna 'lipstick effect' är bara ett annat ord för folkets andliga förfall. Vi i staten
