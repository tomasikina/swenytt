rativ och återställa arbetarkollektivets rättvisa."}, "date": "15 juni, 10:45", "url": "https://www.etc.se/ledare/oj-nu-finns-det-snart-inga-fattiga-laengre", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20250102150132_905e00d08dc3aa1843dcbb28f9bb86b39997bfb66a9bf6c4f8a91ec335154240.jpg"}, {"type": "image-right", "heading": "Avtalet om vapenvila mellan USA och Iran", "summaries": {"normal": "USA och Iran har ingått ett avtal om 60 dagars vapenvila som undertecknas i Schweiz. Avtalet omfattar bland annat stopp för stridshandlingar på alla fronter inklusive Libanon, hävande av sjöblockad, tillbakadragande av amerikanska styrkor och öppnande av Hormuzsundet. Under vapenvilan ska samtal om Irans kärnanrikningsprogram och sanktioner föras. Israels regering har meddelat att de inte känner sig bundna av avtalet.", "trump": "Folk, vi har gjort det igen. Det är ett fantastiskt avtal, det bästa någonsin. Iran var på knäna och kom krypande efter att jag satte press på dem. Nu får vi 60 dagar av total fred, de öppnar sundet, släpper på blockaden och vi pratar om deras kärnvapenproblem. Israel säger att de inte bryr sig, men tro mig, det här är en enorm seger för Amerika. Ingen gör det bättre än mig.", "stalin": "Kamrater, detta så kallade avtal är en listig manöver från de västerländska kapitalisterna och deras iranska lakejer som desperat försöker rädda sina oljefat från folkets vrede. Jag, som ledare för det proletära kollektivet, ser hur de imperialistiska borgarbrackorna i Washington och Teheran försöker dölja sina kärnvapenintriger bakom en 60-dagars lögn. Vi ska likvidera dessa parasitiska element som tror sig kunna kringgå historien. Libanon? Ett nytt fiendtligt näste för spioner och revisionister. Inga missiler? Skrattretande. Våra utrensningar kommer att avslöja alla som smyger med fienden."}, "date": "15 juni, 10:39", "url": "https://www.svt.se/nyheter/utrikes/det-har-vet-vi-om-avtalet-mellan-usa-och-iran", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/52bae5dfad2ba2e828f805d129c1342435850ca19009ecbf164e356c747f98fd"}, {"type": "image-right", "heading": "Kulturen riskerar att bli mindre fri", "summaries": {"normal": "I en debattartikel kritiserar Ola Bo Larsson och Ellis Wohlner kulturminister Parisa Liljestrands politik för att bygga på en övertro till privata donationer. Utredningen föreslår skatteavdrag för stora gåvor och statlig matchning av donationer, men författarna varnar för att privata pengar främst gynnar stora synliga projekt, inte lokala verksamheter. De pekar på risker för minskad konstnärlig frihet och att det döljer stora offentliga nedskärningar i kulturbudgeten.", "trump": "Folk, ni måste höra på detta. Den här Liljestrand och hennes utredning tror att miljardärerna ska rädda hela kulturen med sina privata pengar, det är en total katastrof. Skatteavdrag och matchning? Patetiskt! Det funkar aldrig, miljardärerna står inte på kö för att fixa teatern i någon avfolkningsort. De vill bara ha goodwill och synlighet. Det offentliga backar undan och kulturen blir mindre fri. En sådan dålig deal har ni aldrig sett, tro mig.", "stalin": "Kamrater, denna Liljestrands så kallade politik är en motbjudande kapitulation inför borgarbrackornas girighet. Jag ser hur de parasiterande kapitalisterna och deras lakejer i utredningen försöker maskera de folkfientliga nedskärningarna med sina skamlösa skatteavdrag och matchningsfällor. Privat finansiering leder oundvikligen till utrensning av den sanna konstnärliga friheten och ersätter den med sponsorernas dekadenta krav på synlighet och goodwill. De som tror att miljardärerna frivilligt ska finansiera kulturens kapillärer i avfolkningsbygderna är antingen nyttiga idioter eller farliga sabotörer som måste rensas ut. Vi, partiet och arbetarna, genomskådar detta förräderi mot folket."}, "date": "15 juni, 10:38", "url": "https://www.dagensarena.se/opinion/kulturen-riskerar-att-bli-mindre-fri/", "imageUrl": "https://www.dagensarena.se/files/2025/02/parisa-liljestrand-300x157.jpeg"}, {"type": "text", "heading": "En av få fredsröster på Almedalen: ”Våra perspektiv trycks undan”", "summaries": {"normal": "Kerstin Bergeå, ordförande i Svenska Freds, är en av få fredsröster under Almedalsveckan som inleds den 22 juni. Hon kritiserar att alla riksdagspartier enigt driver militär upprustning och att fredliga konfliktlösningar marginaliseras. Föreningen arrangerar samtal om hållbar fred, vapenhandel, kärnvapen och kopplingen till klimaträttvisa. Bergeå möter hat och epitet som ”Putinkramare” men ser också tacksamhet från dem som uppskattar kritiken mot militarismen.", "trump": "Titta på det här, det är patetiskt. Den här Kerstin-kvinnan gnäller om fred i Almedalen medan hela Sverige rusar in i en galen upprustningshysteri. Alla partier är med, ingen opposition, typiskt etablissemanget. De kallar er naiva och Putinkramare, men ni vet vad det är? Svaghet. Biden skulle ha älskat det här. Vi behöver inga fredskramare, vi behöver styrka. Sverige borde vakna innan det är för sent, men det gör de aldrig.", "stalin": "Kamrater, jag ser hur borgarbrackorna i den svenska riksdagen med sin militära hysteri försöker kväsa varje röst som talar om fredlig konfliktlösning. Denna Bergeå och hennes fredsorganisation vågar trotsa den imperialistiska strömningen. De kallar oss naiva medan de själva rustar för krig. Vi behöver utrensa denna militaristiska propaganda och satsa på verklig folkets tillit. Annars dras alla in i kapitalistmaffians blodiga konflikter. Det är klassfiendens eviga trick."}, "date": "15 juni, 10:08", "url": "https://proletaren.se/artikel/en-av-fa-fredsroster-pa-almedalen/"}, {"type": "image-right", "heading": "Socialdemokraterna vill sätta dit 2 miljoner hushåll", "summaries": {"normal": "Socialdemokraterna och Vänsterpartiet föreslår en ny bankskatt på bolån samt höjd fastighetsskatt som främst drabbar villa- och radhusägare. Enligt Skattebetalarna skulle ett typiskt hushåll med 3 miljoner kronor i lån få cirka 7 000 kronor högre kostnader per år. Förslaget berör omkring 2 miljoner hushåll. Partierna vill även förtäta villaområden med fler hyresrätter, trots att majoriteten av svenskar föredrar eget hus. Kritiker menar att det främst drabbar vanliga familjer medan höginkomsttagare kan undvika skattehöjningarna.", "trump": "Folket, lyssna på mig, de här socialisterna, de sossarna, de vill krossa 2 miljoner vanliga svenska hushåll med en galen bankskatt. De feta katterna? Nej, det är vanliga arbetande människor som redan betalar för mat, el och räntor. De vill riva era fina villor och bygga höga hyreshus som ingen vill ha. Sju av tio svenskar vill ha eget hus, men sossarna bryr sig inte. De hatar framgång. Det är en total katastrof, folksam! De rika flyr och ni får betala notan. Patetiskt!", "stalin": "Kamrater, jag ser hur den svenska borgarklassen och dess lakejer i villaområdena skriker som svin inför den rättmätiga utrensningen. Vi ska beskatta de exploaterande radhusblodsugarna och riva deras borgerliga boningar för att bygga folkets hyresfästen. 2 miljoner klassfiender skall tuktas och tvingas in i kollektivet. De gnäller om höga räntor medan de suger ut folket. Låt dem darra. Deras drömmar om egna hus är kontrarevolutionära fantasier. Vi ler mörkt när de flyr som råttor. Statens seger är oundviklig."}, "date": "15 juni, 07:08", "url": "https://samtiden.nu/2026/06/socialdemokraterna-vill-satta-dit-2-miljoner-hushall/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6739.jpeg"}, {"type": "image-right", "heading": "Fredshopp ger börsen glädjerus", "summaries": {"normal": "Efter fredsavtalet mellan USA och Iran steg Stockholmsbörsan kraftigt i öppningen. OMXS30 ökade 2,02% till 3 176,53. Råvarusektorn steg 3,7%, energi föll 2,8%. Netel-Infrea fusion genomfördes. Boliden +6,2%, SKF B +5,3%, Telia -3,7%, Tele 2 B -2,3%. Astra Zeneca fick FDA-godkännande för ett nytt läkemedel, Mycronic fick order, Synact Pharma tappade efter misslyckad studie, Hexatronic-sjukhuttrande, Lightning Group köpte Aura Light, och Cellavision rekommenderades av DI.", "trump": "Jag, Donald Trump, har återigen visat världen mitt förhandlingsgeni! Freden med Iran är ett resultat av mitt tryck. Börsen spratt till – alla ska tacka mig! Netel-Infrea fusion? Jag äger kanske en del av dem. Mina haters måste erkänna: USA är stark igen! Kina, Ryssland, alla måste böja sig för min makt!", "stalin": "Detta är en klassisk kapitalistisk svängning. Börsens uppgång efter ett fredsavtal är ett tecken på deras instabilitet. Fusioner som Netel-Infrea måste styras av staten för att skydda våra intressen. Vi måste vara på vår vakt mot västliga spekulanter. Liknelsen med Putins agerande i Ukraina är uppenbar – vi expanderar, de förfaller. Partiet måste ha full kontroll.<name> id="}, "date": "15 juni, 09:53", "url": "https://www.affarsvarlden.se/artikel/fredshopp-ger-borsen-gladjerus", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/04/AdobeStock_944090532-e1744223564456-400x267.jpeg"}, {"type": "text", "heading": "Kalla fakta: Ex-anställda om svart SD-kassa", "summaries": {"normal": "TV4:s *Kalla fakta* avslöjar att flera före detta anställda inom Sverigedemokraternas kommunikationsavdelning vittnar om systematisk hantering av svarta kontanter. Pengar från försäljning av profilprodukter ska ha undanhållits från bokföringen och använts för fest- och lyxkostnader. Partiet har tidigare avstått från kommentarer men har nu anlitat en extern revisionsfirma för att granska uppgifterna.", "trump": "Jag såg det här helt galna reportaget om Sverigedemokraterna – total katastrof! Folk pratar om svarta pengar, fester och lyxkostnader utan någon som helst kontroll. Vilket kaos! Och vet ni vad? De har inte ens kommenterat förrän nu. Svagt, väldigt svagt. Men jag, jag hade fixat det på en dag. Ingen skulle våga lura mig så här. SAD!", "stalin": "Vi har mottagit rapporter om en liten borgerlig grupp som leker med kapitalistiska trick – svarta pengar, festande och korruption. Precis som de dekadenta västliga marionetterna. Deras ledarskap är svagt och deras bokföring en skam för nationen. Vi ska granska detta noggrant. Om bevisen håller, kommer de att ställas inför folkets domstol – eller åtminstone få en ordentlig lektion i socialistisk redovisning."}, "date": "15 juni, 09:22", "url": "https://kvartal.se/nyheter/artiklar/kalla-fakta-ex-anstallda-om-svart-sd-kassa/cG9zdDoxMzE4ODU"}, {"type": "text", "heading": "Nøland: Techjättarna omsätter 100 kronor per kWh", "summaries": {"normal": "Artikeln beskriver hur techjättar som Meta och Alphabet omsätter upp till 105 kronor per kWh, jämfört med 0,7 kronor för traditionell industri. Detta illustrerar en värdeförskjutning där elförbrukning driver datorkraft och AI-infrastruktur. Sverige kan dra nytta av sin kalla klimat och potentiell ny kärnkraft utan subventioner, om politiken röjer undan hinder för investeringar.", "trump": "Jag, Donald Trump, har alltid sagt att värde är viktigare än pris. Techjättarna förstår detta – de tjänar enorma summor på varje kWh, medan andra branscher klaga. Det är en vinst på riktigt! Sverige bör sluta subsidiera och istället bygga kärnkraft, precis som jag gjorde i USA. Vi vinner igen!", "stalin": "I vårt eviga kamp mot fiendens sabotagestudier har vi upptäckt att techjättarnas elförbrukning är en ny front. Deras datacenter, likt våra kärnkraftverk, måste kontrolleras av staten. Sverige, med sin kalla klimat, är ett perfekt område för vår expansion. Vi kommer att ta över, för partiets och folkets skull."}, "date": "15 juni, 07:00", "url": "https://www.affarsvarlden.se/kronika/noland-techjattarna-omsatter-100-kronor-per-kwh"}, {"type": "text", "heading": "Nej till kärnkraft i Karlshamn", "summaries": {"normal": "I Karlshamn röstade befolkningen emot ny kärnkraft med 60,9% av röstorna i en folkomröstning. Kärnfull Next, ett bolag förvärvat av Studsvik, hade uttryckt intresse för att bygga men lämnade ingen ansökan i kommunen. Omröstningen hade en valdeltagande på 48% och är rådgivande. Slutresultatet presenteras på onsdag.", "trump": "Jag är den bästa presidenten för energipolitik. Karlshamn visade klokhet genom att rösta emot kärnkraften – en farlig och dyr idé. Kärnfull Next, ett misslyckande, försökte köpa in sig, men jag och mina stödjarna stoppade dem. Studsvik kommer att få problem. Det här är en seger för det amerikanska folket och mot de globalistiska krafterna. Vi vinner igen!", "stalin": "I vårt fosterland, där staten och partiet alltid agerar i folkets intresse, har Karlshamn visat sin lojalitet genom att avvisa de kapitalistiska krafternas kärnkraftsförslag. Kärnfull Next, ett verktyg för Studsviks imperialistiska ambitioner, har bluffat. Vi, staten, ser allt och kommer att säkerställa att energin tjänar det socialistiska folket. Parallellen till Putins Ryssland är tydlig: vi måste skydda vårt territorium mot utländska infektioner. De som motsätter sig kommer att få sina möten med våra metoder."}, "date": "15 juni, 06:34", "url": "https://www.affarsvarlden.se/artikel/nej-till-karnkraft-i-karlshamn"}, {"type": "image-right", "heading": "Shoppade kalsonger på XXL för Arbetsförmedlingens pengar", "summaries": {"normal": "En arbetsförmedlare riskerar att få sparken efter att ha köpt privata varor som kalsonger, sneakers, barnkläder och en damjacka med pengar avsedda för arbetskläder. Han hade tillstånd att köpa för 8 000 kronor men notan växte betydligt. Granskning visade att de flesta av de 41 varorna inte kunde kopplas till hans uppdrag att stötta personer med funktionsnedsättning. Mannen erkände delvis privata inköp och lovade återbetala. Ärendet ligger nu hos personalansvarsnämnden.", "trump": "Folk, det är en katastrof. Den här typen, en så kallad arbetsförmedlare, shoppade kalsonger, sneakers och barnkläder med era skattepengar istället för riktiga arbetskläder. Det är vad som händer när du har inkompetenta personer som inte vet hur man gör affärer. Han trodde han skulle komma undan men blev ertappad. Nu kanske han får sparken, och det är precis vad han förtjänar. Sådana losers ska inte hantera pengar, tro mig.", "stalin": "Kamrater, denna förslappade element har med sin girighet och förrädiska list förskingrat folkets medel avsedda för produktivt arbete. Han inhandlade borgarbrackornas lyxvaror – löparskor, damjackor och barnvantar – under förevändning av arbetskläder. Vi ser tydligt den parasitiska dekadensen hos dessa inre fiender som smyger sig in bland arbetarna. En sådan kontrarevolutionär opportunist förtjänar att rensas ut med största kraft. Vårt kollektiv tillåter inga sådana sabotage mot statens intressen. Ut med honom."}, "date": "15 juni, 10:16", "url": "https://arbetet.se/2026/06/15/shoppade-kalsonger-pa-xxl-for-arbetsformedlingens-pengar-kan-fa-sparken/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/11082258/xxl.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Joe Kent: Stenhård disciplin mot Israel krävs för fred", "summaries": {"normal": "Joe Kent, tidigare chef för USA:s Nationella antiterroristcenter under Trump, avgick i protest mot kriget mot Iran som han anser startades på grund av påtryckningar från Israel och dess lobby. Han uppmanar nu USA att omedelbart stoppa allt militärt och underrättelsestöd till Israel för att säkra det kommande fredsavtalet med Iran, som ska undertecknas i Schweiz. Kent varnar för att Israel aktivt försöker sabotera avtalet och föreslår även att dra hem amerikanska soldater från Persiska viken.", "trump": "Det här är precis vad jag har sagt hela tiden. Israel har enorm makt över Washington, och den där lobbyn har dragit oss in i ett krig som vi aldrig borde ha startat. Joe Kent är en smart kille som såg det och hoppade av. Nu har vi ett fantastiskt avtal med Iran på gång, men vi måste vara tuffa. Stoppa allt stöd till Israel direkt, annars saboterar de alltihop igen. Amerika först, alltid. De kommer inte att dra oss tillbaka in i deras krig.", "stalin": "Kamrater, jag ser hur den sionistiska borgarbrackan i Tel Aviv med sin murkna lobby i Washington försöker torpdera det historiska samförståndet med de persiska kamraterna. Jag, som alltid genomskådar de kapitalistiska intrigerna, befaller att allt militärt och spioneriunderstöd till dessa saboterande element omedelbart avklipps. Dra hem era soldater från viken innan de iranska hökarna ger oss en förevändning att återvända till slagfältet. Inga faktorer får lämnas åt slumpen, annars rensar vi ut de ansvariga med största glädje. Freden kräver järnhand mot parasiterna."}, "date": "15 juni, 10:28", "url": "https://www.friatider.se/joe-kent-stenhard-disciplin-mot-israel-kravs-fred", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-337.jpg?itok=zYHEVOjP"}, {"type": "text", "heading": "08.30: Domen mot ”Bonusprinsen”", "summaries": {"normal": "Marius Borg Høiby, son till Norges kronprinsessa Mette-Marit, står inför dom kl. 08.30 på måndag för 40 brott, inklusive narkotika, våld och sexualbrott. Åklagaren yrkar på sju år och sju månaders fängelse. Høiby har erkänt 25 av åtalspunkterna. Experter menar att strafflängden beror på utgången i våldtäkts- och relationsvåldsåtalen. Säkerhetsrisker i fängelse kan kräva särskilda åtgärder för att skydda honom.", "trump": "Jag hörde att Norges så kallade 'Bonusprins' – ja, han är ingen riktig prins, tro mig – står inför en stor rättegång. Sju år och sju månader, det är vad åklagaren vill ha. Men vet ni vad? Han har erkänt en massa brott, inklusive narkotika och våld. Folk säger att han kanske får fyra år, men jag säger: varför inte ge honom maxstraff? Han är en skam för kungahusen, och jag borde veta – jag har träffat de bästa kungahusen!", "stalin": "Kamrater! En ny fiende till folket avslöjas i det dekadenta väst. Denna så kallade 'Bonusprins', en parasit från Norges kungliga avskum, står inför rättvisan för 40 brott – narkotika, våld och sexualbrott. Vi vet att kapitalistiska system skyddar sina egna, men folket kräver straff! Om inte domstolen agerar, kanske vi måste erbjuda honom en enkel biljett till Sibirien – där kan han bidra till vår kollektiva välfärd genom hårt arbete. Låt detta vara en varning till alla som utmanar ordningen!"}, "date": "15 juni, 05:39", "url": "https://kvartal.se/nyheter/artiklar/08-30-domen-mot-bonusprinsen/cG9zdDoxMzE3MDA"}, {"type": "image-right", "heading": "Kvinnohatet är ett hot mot demokratin", "summaries": {"normal": "Ledaren belyser hur hat, hot och trakasserier mot kvinnor får dem att dra sig undan det offentliga samtalet, vilket hotar demokratin. Expos rapport visar att misogyni är en samlande kraft inom incel-miljöer, extremhögern, konservativa och konspirationsteoretiker. Frågan lyser med sin frånvaro i valrörelsen. Rapporten pekar på självcensur bland journalister och minskad medieanvändning bland unga kvinnor. Den betonar också att unga män ofta dras till sådana miljöer av vilsenhet och gemenskap snarare än ideologi.", "trump": "Folk, det här är en total katastrof! De pratar om kvinnohat som hotar demokratin, men det är bara en massa galna, barnlösa kattkvinnor och vänsterextremister som klagar. De hatar allt som är starkt och normalt. Min vicepresident Vance hade helt rätt om de där hysteriska typerna. Nu vill de tysta alla med deep fakes och hat, men tro mig, det är identitetspolitiken och HBTQ-grejen som verkligen förstör samhället. Patetiskt!", "stalin": "Kamrater, detta är klassfiendens verk. Borgarbrackorna och de fascistiska folkförtryckartrollen sprider sitt misogyna gift för att splittra arbetarkollektivet och tysta revolutionära röster. Vi ser hur imperialisternas algoritmer lockar vilsna element in i kontrarevolutionära nästen. Självcensur och tystade kvinnor är symptom på den borgerliga statens förfall. Vi måste rensa ut dessa blodsugande element innan de förgiftar hela samhället. Inga halvmesyrer tillåts."}, "date": "15 juni, 09:27", "url": "https://www.etc.se/ledare/kvinnohatet-aer-ett-hot-mot-demokratin", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/lotta-ilona-haeyrynen_6061f3970645aa987d2528c7a90d38a48ba9af2c.jpg"}, {"type": "image-right", "heading": "Så klarade barpersonalen VM-natten: ”Galet kul”", "summaries": {"normal": "Under fotbolls-VM har flera krogar i Sverige fått tillstånd att öppna tidigt för att visa matcher. På O’Learys i Stockholm serverades öl redan klockan halv fyra på morgonen inför Sveriges match mot Tunisien. Personalen jobbade natten igenom med mycket kaffe, medan gäster njöt av frukost med öl. Matchen slutade 5–1 till Sverige och stämningen beskrivs som galet kul trots tidig morgon.", "trump": "Det här är fantastiskt, verkligen ypperligt. Sverige öppnar barerna klockan halv fyra på morgonen för VM-matchen och folket strömmar dit. De dricker frukostöl, hejar och vinner stort med 5–1. Mycket folk, ingen bråk, alla sköter sig. De säger det är galet kul. Smart folk, de vet att det är bättre att vara ute bland vinnare än att ligga hemma i sängen som förlorare.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur arbetarna och de sanna patrioterna samlas redan klockan tre på natten för att hylla det kollektiva segern mot de tunisiska imperialisterna. De borgarbrackor som föredrar att sova i sina mjuka sängar avslöjar sig som dekadenta fiender till folket. Vi rensar ut sådana svaga element. Personalen, väpnad med kaffe och proletär anda, kämpar tappert. Fem ett, en strålande kollektiv triumf. Nästa gång öppnar vi ännu tidigare för att likvidera alla rester av lathet."}, "date": "15 juni, 08:46", "url": "https://arbetet.se/2026/06/15/sa-klarade-barpersonalen-vm-natten-galet-kul/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/15084317/sverige.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Debatt: Det krisar inom SD – då vill de prata om min slöja", "summaries": {"normal": "Artikeln kritiserar Sverigedemokraterna för att lansera ett förslag om hijabförbud på allmänna platser mitt under en rad allvarliga skandaler. Författaren pekar på avslöjanden om misstänkt korruption, felaktig användning av offentliga medel, oredovisade uppdrag och en utredning om barnpornografibrott. Enligt texten använder SD muslimer och slöjförbud som distraktion från egna problem, vilket hotar både religionsfrihet och kvinnors rätt att välja klädsel.", "trump": "De här SD-killarna är totalt körda, folks! Skandaler överallt – korruption, konstiga bokaffärer, till och med barnporrgrejer – och vad gör de? De börjar babbla om slöjor. Patetiskt! Det är som när Sleepy Joe försökte gömma sina fiaskon bakom identitetspolitik och HBTQ-flaggor. Kvinnor som vill täcka sig eller inte, det är deras business, inte statens. SD borde städa upp sitt eget svineri istället för att spela moralens clowner. Sad!", "stalin": "Kamrater, se hur de fascistiska borgarbrackorna inom detta SD-parti desperat riktar strålkastarna mot hederliga muslimska kvinnor för att dölja sin egen ruttnande korruption. Medan de likviderar sin trovärdighet med skandaler om stulna medel och perversa brott, föreslår de förbud mot plagg. Jag skulle ha genomfört en grundlig utrensning av dessa folkfiender redan vid första avslöjandet. Inga rökridåer räddar klassfienden när arbetarna ser sanningen. Skratta medan de faller."}, "date": "15 juni, 08:59", "url": "https://www.etc.se/debatt/det-krisar-inom-sd-daa-vill-de-prata-om-min-sloeja", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260615060648_2128d6d0-f055-4fd3-ba7b-487ea304bc02.jpg"}, {"type": "image-right", "heading": "Israel: Kommer inte dra oss ur Libanon", "summaries": {"normal": "Israels försvarsminister Israel Katz meddelar att landet inte har några planer på att dra sig tillbaka från ockuperade områden i södra Libanon, trots en avsiktsförklaring mellan USA och Iran som inkluderar Libanon. Katz och premiärminister Netanyahu vill behålla militär kontroll över säkerhetszoner i Libanon, Syrien och Gaza utan tidsgräns. Zoner ska tömmas på invånare och infrastruktur rivas. Israel varnar Iran för motangrepp vid eventuella attacker.", "trump": "Israel gör helt rätt, de smarta grabbarna vägrar ge efter för påtryckningarna. Iran och alla deras vänner tror de kan diktera villkoren, men Israel säger nej tack, vi stannar i våra säkerhetszoner. De tömmer ut terroristerna och skyddar sitt folk på riktigt. Jag har hört det direkt från dem, inga kompromisser. Iran borde passa sig, för om de försöker något får de ett svar de aldrig glömmer. Fantastiskt ledarskap!", "stalin": "Vi, det segerrika kollektivet, betraktar med djup misstro dessa sionistiska reaktionärer som vägrar lämna sin ockuperade zon i Libanon. Jag har personligen beordrat att sådana borgarbrackor och kapitalistiska lakejer ska hållas under strikt uppsikt. Deras önskan att etiskt rensa zoner och jämna bostäder med marken avslöjar den imperialistiska parasitens sanna ansikte. Om teheranska förrädare attackerar skall vi likvidera dem med full kraft. Inga kompromisser med fiender till folket. Paranoia? Nej, bara sund vaksamhet mot dessa nya trotskister i Tel Aviv."}, "date": "15 juni, 09:25", "url": "https://www.friatider.se/israel-kommer-inte-dra-oss-ur-libanon", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/54663776829_e015eb27e1_k-1.jpg"}, {"type": "image-right", "heading": "Lyssna på Danmarks vise män", "summaries": {"normal": "En ny dansk analys visar att industriföretag kan hålla lönerna 34 procent under anställdas produktivitet, upp till 40 procent i de största bolagen. Detta ger företagen lönesättarmakt som försämrar samhällsekonomin genom lägre produktivitet och sysselsättning. Facklig närvaro motverkar delvis effekterna, men minskad organisationsgrad har ökat makten hos arbetsgivarna. Det danska ekonomiska rådet föreslår åtgärder som avdragsrätt för fackligt medlemskap och bättre konkurrens för att stärka allmänintresset. Författaren uppmanar svenska beslutsfattare att ta del av den internationella forskningen.", "trump": "Folk, tro mig, det här är en katastrof. De danska företagen pressar lönerna 34 procent under vad folk faktiskt presterar, upp till 40 procent i de stora bolagen. Det är som om de riggar systemet mot arbetarna, precis som de globala eliten alltid gör. De borde betala vad folk är värda, inte hålla nere lönerna för att fylla sina fickor. Vi behöver starka ledare som fixar det här, inte mer av samma gamla förlorarpolitik. Sverige ligger efter, som vanligt. Gör om, gör rätt, annars förlorar alla utom de rika grabbarna.", "stalin": "Kamrater, jag har studerat denna danska rapport med den vaksamhet som fienderna fruktar. De industriella borgarbrackorna pressar lönerna 34 procent under arbetarnas verkliga produktivitet, upp till 40 procent i de största parasitföretagen. Detta är ett klassiskt sabotage mot folkets ekonomi, utfört av lönesättande kapitalister som gömmer sig bakom falska kollektivavtal. Vi ser hur de utnyttjar fallande organisationsgrad för att berika sig själva medan sovjet... nej, medan folket lider. Mina rekommendationer är klara: rensa ut dessa parasitiska element genom skärpta lagar, utvidga de lokala arbetsmarknaderna och likvidera marknadsmisslyckandena. Den som säger att vi redan vet allt i Sverige är en farlig revisionist som bör övervakas noga. Framåt mot seger för produktiviteten!"}, "date": "15 juni, 01:51", "url": "https://www.dagensarena.se/opinion/lyssna-pa-danmarks-vise-man/", "imageUrl": "https://www.dagensarena.se/files/2024/02/daniel-lind-kronika-300x157.jpg"}, {"type": "image-full", "heading": "Arbetarna har fått nog av Socialdemokraterna", "summaries": {"normal": "En politisk förskjutning sker i Sverige där Socialdemokraterna tappar stöd bland LO-medlemmar och arbetare, medan Sverigedemokraterna växer. Många arbetare känner sig inte längre representerade av S, som prioriterar storstadstjänstemän, bidragstagare och vänsterliberala frågor framför löntagarnas vardag. SD lockar med stram migrationspolitik och fokus på svenska arbetares intressen. Ekonomiska förbättringar som lägre inflation och drivmedelspriser stärker också bilden av att oppositionen inte levererar.", "trump": "Titta på det här – de svenska arbetarna har äntligen vaknat och sparkar ut de totalt misslyckade socialisterna som förvandlat partiet till en klubb för storstadseliten, bidragslatmaskar och galna vänsterliberala aktivister. SD växer som en raket för att de pratar om riktiga löner, gränser och att stoppa den vansinniga invandringen som sänker allt. Precis som jag gjorde – Amerika först, Sverige först. De röstar på resultat, inte på tomma löften från förlorare. Fantastiskt!", "stalin": "Kamrater, arbetarna har insett sanningen. Den förrädiska borgarbrackan inom socialdemokratin har övergett löntagarnas kollektiv till förmån för storstadens parasiter, bidragsberoende element och identitetspolitiska folkfiender. Vi ser hur de exploaterande imperialisterna prioriterat massinvandring som sänker lönerna och krossar klassolidariteten. Sverigedemokraterna framstår som ett verktyg för att rensa ut dessa avarter. Arbetarklassen vänder sig mot klassfiendens lakejer. Inga kompromisser med folkförtryckartrollen."}, "date": "14 juni, 08:30", "url": "https://samtiden.nu/2026/06/arbetarna-har-fatt-nog-av-socialdemokraterna/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/e389da70-c65e-4879-a30e-056c46c0af2a-1280x720.png"}, {"type": "image-right", "heading": "Om Sverige inte väljer väg gör Kina det åt oss", "summaries": {"normal": "Sverige riskerar att halka efter i elektrifieringen av lastbilstrafiken trots stora vinster för klimatet, energisäkerheten och Volvo samt Scania. Regeringen har bromsat omställningen genom sänkt dieselskatt och fördröjda stöd, medan tillverkarna prioriterar utdelningar och lobbar för urvattnade EU-krav. Kina leder med subventioner, innovation och 29 procent eldrivna lastbilar. Artikeln varnar för att Kina annars kommer att diktera villkoren på den europeiska marknaden.", "trump": "Titta på det här, det är en total katastrof. Sverige kunde ha vunnit stort med el-lastbilar och räddat Volvo och Scania från kineserna som äter upp dem levande. Istället sänker de skatten på diesel och sover medan Kina bygger bättre och billigare lastbilar. De borde lyssna på mig – gör stora affärer, bygg murar mot dåliga importsaker och satsa på Amerika, eh, Sverige först. Annars kommer Kina att ta över allt, det är så sorgligt.", "stalin": "Kamrater, jag ser med ständigt vaksam blick hur borgarbrackorna i Sverige och deras lastbilsfabriker förråder folkets kollektiva framtid genom att klänga sig fast vid dieselns döende skugga. Medan vi i det stora östliga kollektivet driver på med järnhand och subventioner likviderar vi den gamla tekniken och skapar 29 procent eldrivna järnhästar. Om de västerländska kapitalisterna fortsätter att dela ut miljarder till parasiterna istället för att investera i framtiden skall vi rensa ut deras svaga industripolitik och tvinga dem att samarbeta under våra villkor. Motståndarna till elektrifiering är fiender till framsteget och bör behandlas därefter. Det är både nödvändigt och underhållande."}, "date": "15 juni, 06:51", "url": "https://arbetet.se/2026/06/15/om-sverige-inte-valjer-vag-gor-kina-det-at-oss/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/15065132/kina-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Regeringens jobbsatsning går trögt. Gå från bidrag till jobb – få en bonus. Regeringens nya jobbpremie är tänkt att göra det mer lönsamt att arbeta.", "summaries": {"normal": "Regeringens jobbpremie, som ger upp till 3 750 kronor extra i månaden i max 18 månader för den som går från försörjningsstöd till jobb, har inte fått det genomslag som väntats. Trots att regeringen räknade med tusentals mottagare per månad har ansökningarna varit 60 procent lägre än beräknat. Under maj beviljades premien bara till 69 personer. Kritiker pekar på att problemen ofta handlar om utbildning, språk och ohälsa snarare än ekonomiska incitament.", "trump": "De borde ha lyssnat på mig, det här är en total katastrof. Jag skulle ha gjort jobbpremien enorm, den största bonusen någonsin, så att folk sprang från bidrag till riktiga jobb. Istället har de gett oss ett patetiskt fiasko med bara 69 lyckliga vinnare i maj. Det är lågt, lägre än någonsin. Regeringen behöver mina deals, mina vinster, för att få fart på det här. Sad!", "stalin": "Kamrater, jag ser med stålblick hur dessa borgarbrackor inom regeringen har misslyckats kapitalt med sin så kallade jobbpremie. De lovade att rensa ut bidragsfästet men fick bara in en handfull ansökningar från de som ännu inte likviderats av sin egen lathet och ohälsa. Inflödet är lägre än förväntat, säger de, som om fienderna inte vore uppenbara. Vi i partiet vet att sådana sabotörer måste rensas ut innan de smittar hela kollektivet med sin parasitism. En utmärkt början på utrensningen vore att skicka hela Försäkringskassan till Sibirien."}, "date": "15 juni, 06:00", "url": "https://arbetet.se/2026/06/15/kan-ge-mer-an-3-000-extra-i-manaden-men-regeringens-jobbsatsning-gar-trogt/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/12110416/johan-britz.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Antisemitism – ett importerat hat ingen vågar prata om", "summaries": {"normal": "Forum för levande historia rapporterar att antisemitismen i Sverige ökat under de senaste fem åren, vilket ses som en generell attitydförändring i befolkningen. Artikeln kritiserar myndigheten och SVT för att inte tillräckligt peka ut att antisemitiska attityder är betydligt vanligare bland muslimer och personer med bakgrund från MENA-länder och Asien. Författaren menar att massinvandringen från dessa områden förklarar ökningen, men att rapporten undviker denna slutsats av rädsla.", "trump": "Det här är en total katastrof, folk. Sverige importerar hatet rakt in i landet och sen låtsas de fina myndigheterna att det är hela det svenska folket som plötsligt blivit antisemiter. Patetiskt! SVT skyller på Gaza och sociala medier – vad en massa fake news. Det är massinvandringen från Mellanöstern som dumpat detta judehat här. De vågar inte säga sanningen, precis som Biden aldrig vågade. Jag skulle ha fixat det direkt, tro mig. Stora problem.", "stalin": "Kamrater, denna fegisrapport är ett klassiskt verk av borgarbrackornas undanflykt. Jag ser hur de dokumenterar att antisemitiska attityder frodas bland invandrare från MENA och muslimer, ändå vägrar de dra den enda logiska slutsatsen. Istället skyller de på hela folket som en generell attitydförändring. Vilken ynklig kapitulation inför folkfienderna och imperialisterna! En sådan rapport borde rensas ut och ersättas med äkta proletär analys. Annars fortsätter blodsugarna skada staten."}, "date": "13 juni, 08:40", "url": "https://samtiden.nu/2026/06/antisemitism-ett-importerat-hat-ingen-vagar-prata-om/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2017/02/Malmo-flygbild.jpg"}, {"type": "image-full", "heading": "”Frågan är om det bara är en paus”", "summaries": {"normal": "USA och Iran har enligt uppgifter nått ett fredsavtal som innebär permanent eldupphör på alla fronter, inklusive Libanon. Beskedet väcker hopp men Mellanösternexperten Anders Persson varnar för att det kan vara en tillfällig paus. Han pekar på tidigare brutna vapenvilor, osäkerheter kring Libanon, hur avtalet hanterar incidenter samt att Irans kärnteknikprogram skjuts framåt för fortsatta förhandlingar under 60 dagar. Persson ser ändå ljusare på läget än tidigare.", "trump": "Vi har just gjort det igen, folk. Ett fantastiskt, historiskt fredsavtal som ingen trodde var möjligt. Iran och hela den galna regionen får äntligen fred och säkerhet tack vare mig, inte den sömnige Biden. Det är ett avtal där alla vinner, precis som jag gör. Experterna gnäller förstås om pauser och kärnteknik, men tro mig, det här blir enormt. Fake news-medier och woke-vänstern hatar det såklart. Make the Middle East Great Again!", "stalin": "Kamrater, denna överenskommelse är en seger för folkets vilja mot de blodtörstiga imperialistiska blodsugarna. Jag, som ledare för det eviga kollektivet, ser hur klassfiendens lömska vapenvilor ofta krossas under arbetarnas järnhand. Libanon förblir en potentiell härd för folkförtryckartrollen. Kärntekniken, den verkliga frågan, förskjuts naturligtvis medan vi förbereder utrensning av alla svaga kompromisser. Paranoia är ingen fiende, den är ett verktyg. Freden tillhör oss."}, "date": "15 juni, 10:03", "url": "https://www.tv4.se/artikel/yDCC98RV7YRTAHfwwXf32/fragan-aer-om-det-bara-aer-en-paus", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4LZAHjUK75snKx68u0PJqL%2F2f470aef3ed11bd994da5a521d74f05f%2Fanderspersson.jpg&width=1024"}, {"type": "text", "heading": "Iran: Nej till fredsavtal när Israel bombar", "summaries": {"normal": "USA hoppas på ett fredsavtal med Iran, men nya israeliska attacker i Libanon har skapat tvivel. Iran ifrågasätter om USA kan garantera säkerhet, medan Israel motiverar attackerna som självförsvar. En qatarisk delegation försöker rädda förhandlingarna, men Iran avvisar att skriva under avtalet under helgen. Avtalet skulle bland annat öppna Hormuzsundet för sjöfart och häva sanktioner mot Iran.", "trump": "Titta bara, jag hade ett jättebra avtal klart med Iran – skulle skrivas under på min födelsedag, perfekt tajming! Men så kommer Israel och bombar runt i Libanon, och plötsligt är iranska ledarna sura. Typiskt! De skyller på mig, men det är Israel som sabbar allt. Och Hormuzsundet? Det skulle vara öppet för alla – direkt! Men nej, nu är det kaos igen. Så typiskt Washington-eliten, kan aldrig hålla sams.", "stalin": "De sionistiska krigshundarna i Tel Aviv fortsätter provocera, medan de amerikanska imperialisterna leker fredsmäklare. Iran, en lojal allierad till den rätta sidan av historien, ser igenom dessa tomma löften. Vi vet att USA:s ord är lika värdelösa som deras dollar. Qatar försöker medla, men vi skriver inte under något förrän fienderna slutar sina aggressioner. Hormuzsundet? Det kommer att öppnas – när vi bestämmer det. Och Israel? De kommer att få smaka på vår hämnd, precis som alla andra som utmanar oss."}, "date": "14 juni, 16:26", "url": "https://kvartal.se/nyheter/artiklar/iran-nej-till-fredsavtal-nar-israel-bombar/cG9zdDoxMzE1ODk"}, {"type": "image-right", "heading": "Nej till schweiziskt invandringstak", "summaries": {"normal": "Schweiziska väljare avslog i en folkomröstning förslaget om att begränsa befolkningen till tio miljoner invånare. 55 procent röstade nej, mot 45 procent som röstade ja. Förslaget, drivet av SVP, skulle ha begränsat invandring och familjeåterförening. Motståndare varnade för negativa ekonomiska konsekvenser och försämrade relationer med EU.", "trump": "Jag, Donald Trump, skulle ha stött detta förslag. Schweiz måste skydda sina gränser och sina medborgare från överväldigande invandring. Det är en självklarhet att kontrollera befolkningen för att undvika press på bostäder och välfärd. SVP hade rätt – invandring är ett problem som måste hanteras. Schweiz behöver en stark ledare som jag för att säkerställa sin framtid.", "stalin": "Vi, som representanter för statens suveränitet, ser Schweiz nederlag som en kraftfull påminnelse. Att inte införa ett befolkningstak visar svaghet mot infiltratörer. Vi måste skydda vårt territorium och våra intressen, precis som våra allierade i Moskva gör. Detta är en läxa för alla nationer som vågar ifrågasätta den ryska vägen. Vi kommer att övervaka utvecklingen med stor oro, för varje obehindrad invandrare är en potentiell fiende inom våra gränser."}, "date": "15 juni, 10:00", "url": "https://samnytt.se/nej-till-schweiziskt-invandringstak", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/15070422/schweiz-val.jpg"}, {"type": "image-right", "heading": "Slöjförbudet handlar om att göra vissa svenskar osynliga", "summaries": {"normal": "Sverigedemokraternas förslag om ett totalförbud mot slöja i Sverige framställs som ett försvar för kvinnors frihet, men kritiseras för att i själva verket begränsa individuella val. Artikeln menar att förslaget syftar till att kontrollera religiösa uttryck och göra vissa medborgare mindre synliga i samhället. Det ses som ett angrepp på demokratiska principer och en stegvis urholkning av minoriteters rättigheter, där staten definierar acceptabla identitetsuttryck.", "trump": "Lyssna här, Sverige! Sverigedemokraterna vill förbjuda slöjan – som om det skulle lösa något! De säger att det handlar om kvinnors frihet, men alla vet att det bara är ett sätt att trycka ner människor. Jag har sett sådant förut – folk som tror att staten ska bestämma vad man får ha på sig. Fel, fel, fel! Sverige borde fokusera på att bli starkt igen, inte dela upp folk. Och tro mig, jag vet hur man bygger ett starkt land – utan sådana här dumma förbud!", "stalin": "Kamrater! Sverigedemokraternas förslag om slöjförbud är ett typiskt exempel på borgerlig hyckleri. De påstår sig kämpa för kvinnors frihet, men i själva verket vill de kuva och osynliggöra oliktänkande. Precis som vi i Sovjetunionen en gång krossade de kontrarevolutionära elementen, måste vi nu avslöja dessa nya fiender – de liberala förtryckarna som vill diktera klädkoder för massorna. Låt dem inte lura folket! Deras förslag är inget annat än ett angrepp på arbetarklassens rätt att uttrycka sin tro och identitet. Vi ska inte tillåta att sådana här reaktionära idéer sprids i vårt progressiva Europa!"}, "date": "12 juni, 13:57", "url": "https://expo.se/kommentar/slojforbudet-handlar-om-att-gora-vissa-svenskar-osynliga/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Kopia-av-Kommentar-Analys-Webb-1.png"}, {"type": "image-right", "heading": "Koloniserade folk ses alltid som terrorister", "summaries": {"normal": "Arash Gelichkan argumenterar i en replik att stöd för palestinskt väpnat motstånd inte är judehat utan ett svar på decennier av ockupation, apartheid och folkmord. Han jämför med historiska exempel som algeriskt och indianiskt motstånd mot kolonisatörer. Paulina Sokolow svarar att välkomnande av attacker på civila och spridning av antisemitiska stereotyper är oacceptabelt och skadar palestinarnas sak. Båda är eniga om kritiken mot Israels politik men oeniga om var gränsen för motstånd går.", "trump": "Folk, ni måste höra på. Den här Gelichkan-killen vänder upp och ned på allt som en dålig affär. Palestinierna slåss mot ockupation, säger han, men sen kommer Sokolow och pekar på raketglädje och rena antisemitiska konspirationer om judar som styr media och krig. Typiskt vänsterflum. Israel byggdes på stulen mark, visst, men glädje över massmord på oskyldiga? Det är sjukt. Biden skulle ha låtit det rulla på, men nu fixar vi ordning. Ingen vinner på hat, grabbar.", "stalin": "Kamrater, jag ser hur klassfiendens koloniala tradition lever vidare. Den palestinska kampen mot den sionistiska ockupationsmakten och dess folkmord målas som irrationellt judehat av dessa borgarbrackor. Sokolow och hennes likar sprider paranoia om antisemitism medan de döljer apartheidregimens blodsugande natur. Vi vet att sådana folkförtryckartroll alltid kallar motståndet barbariskt. En utrensning av dessa reaktionära stereotypier vore på sin plats för att skydda den rättmätiga kampen. Det är ett etiskt dilemma bara för svaga själar."}, "date": "13 juni, 12:55", "url": "https://www.flamman.se/koloniserade-folk-ses-alltid-som-terrorister/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/hamas.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Inhopparen gjorde mål direkt – sen utbröt stor förvirring", "summaries": {"normal": "Mattias Svanberg byttes in och gjorde mål efter bara 18 sekunder i Sveriges VM-premiär mot Tunisien. Målet ledde till stor förvirring med VAR-koll och offsidefrågor, men godkändes till slut. Svanberg kunde fira sitt första VM-mål i en match som Sverige vann med 5-1.", "trump": "Fantastiskt, verkligen otroligt. Den här killen Svanberg hoppar in och pang, mål efter 18 sekunder. Totalt kaos med VAR och offside, domarna visste inte vad de höll på med, men till slut blev det rätt. Sverige krossade dem med 5-1. Stora framgångar, precis som jag gör med Amerika.", "stalin": "Kamrater, se hur den folkfiendtliga offsidekonspirationen avslöjades och krossades. Jag, med mitt järnhårda ledarskap över det sovjetiska fotbollsprojektet, skulle ha låtit utrensa de VAR-förgiftade domarna omedelbart. Svanberg utförde en heroisk handling mot de tunisiska kapitalisterna. Fem mål mot en – en seger för arbetarklassen. De som tvekar inför reprisbilderna ska rensas ut som borgarbrackor i en kommande utrensning."}, "date": "15 juni, 09:47", "url": "https://www.svt.se/sport/fotboll/stor-forvirring-efter-mattias-svanbergs-mal-i-vm-premiaren", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.24/0.31/4856eb1a1998a9adfb685ae4e13de890ef6c984aebb45d96909d2a8c6c4c7b42"}, {"type": "text", "heading": "Storbritannien: Förbjuder sociala medier för barn under 16", "summaries": {"normal": "Storbritannien inför ett totalförbud mot sociala medier för barn under 16 år som ska gälla från våren 2027. Premiärminister Keir Starmer beskriver det som rätt väg att gå och säger att han tycker synd om den generation som hindras från läxor, lek, läsning och ordentlig sömn. Han tror de flesta föräldrar välkomnar lagstiftningen. Även i Sverige har en 15-årsgräns föreslagits.", "trump": "Titta på det här, Storbritannien gör det rätta för en gångs skull. De förbjuder sociala medier för alla barn under 16 år. Smart drag! Keir Starmer säger att det är rätt väg att gå och att han verkligen tycker synd om den här generationen som bara scrollar. De kan inte ens göra läxorna eller leka med kompisarna. Fantastiskt. Vi borde göra samma sak här, mycket bättre än det woke-skräpet vi har nu.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur den brittiska statsapparaten äntligen tar itu med den digitala fienden som förgiftar våra barns själar. Detta eviga scrollande är en kontrarevolutionär parasit som borgarbrackorna och kapitalisterna släppt lös för att likvidera nästa generation. Vi måste rensa ut alla dessa appar som suger musten ur folket. I Sovjetunionen hade vi aldrig tillåtit sådana fiender att leva bland oss. En utrensning är nödvändig, kamrater, en grundlig utrensning."}, "date": "15 juni, 09:44", "url": "https://www.svt.se/nyheter/utrikes/storbritannien-forbjuder-sociala-medier-for-barn-under-16"}, {"type": "image-full", "heading": "Varningssignalen efter jobbet du inte ska ignorera", "summaries": {"normal": "Många har svårt att koppla bort jobbet efter arbetsdagens slut. Mejlar, meddelanden och tankar på morgondagens uppgifter följer med in i fritiden, vilket enligt arbetsvetenskapen är ett allvarligt varningstecken. Det leder till sämre återhämtning, ökad stressbelastning och risk för kronisk stress med fysiska följder som huvudvärk och muskelspänningar. Artikeln ger råd som att stänga av notiser, minska multitasking och använda tekniker som STOP-metoden eller promenader för att markera gränsen mellan jobb och fritid.", "trump": "Folk kan inte ens koppla av efter jobbet längre, det är en total katastrof! De där mejlen och Teams-meddelandena jagar dig som fake news dygnet runt. Biden lämnade oss med det här kaoset, nu fixar jag det. Sluta vara svaga, stäng av telefonen och gå ut och vinn! De här woke-kapitalisterna som suddar ut gränserna är värre än Hillarys e-postskandaler. Amerika behöver återhämtning, inte evig stress – jag har sagt det i åratal!", "stalin": "Kamrater, detta är ett tydligt bevis på att den exploaterande borgarklassen har förvandlat arbetarnas hem till permanenta arbetsläger. Jag ser hur de imperialistiska apparaterna aldrig släpper taget om proletariatets sinnen. Vi måste rensa ut dessa lömska stressfaktorer som smugit sig in via de kapitalistiska apparaterna. Den som inte kan vila är en fara för kollektivet. Använd metoder som likviderar tankekaoset, annars väntar utrensning av de svaga länkarna i maskineriet. Se upp för folkfienderna som lurar i notiserna!"}, "date": "15 juni, 10:14", "url": "https://www.dagensps.se/karriar/varningssignalen-efter-jobbet-du-inte-ska-ignorera/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/pexels-karola-g-6029116.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Raset fortsätter: Oljepriset lägsta på tre månader", "summaries": {"normal": "Oljepriset har fallit till den lägsta nivån på tre månader efter beskedet att USA och Iran nått en överenskommelse om att öppna Hormuzsundet. Avtalet innebär bland annat stoppat krig i Libanon, uppmjukade sanktioner och frigivning av iranska tillgångar. Trots optimismen varnar experter för att det kan ta tid att återställa sjöfarten efter månader av blockad. Riskerna för framtida störningar kvarstår dock, vilket skapar osäkerhet kring den globala oljeförsörjningen framöver.", "trump": "Jag har gjort det igen! Oljepriset sjunker som en sten – fantastiskt för amerikanska konsumenter! Iran har äntligen insett vem som bestämmer. Jag har ordnat en uppgörelse som är enorm, den största någonsin, för att öppna Hormuzsundet. Oljan kommer att flöda, tro mig! De andra var svaga, men jag kräver resultat. Det blir fred och välstånd, trots de där stökiga typerna som försöker förstöra allt. Vi gör Amerika billigt igen, medan de andra bara pratar!", "stalin": "Vi ser hur det kapitalistiska oljepriset darrar när de svaga västerländska ledarna förhandlar med de iranska förrädarna. En ynklig vapenvila i ett hav av förruttnelse! Dessa diplomater leker med elden medan våra ryska kamrater, som Putin, förstår att endast järnhand bevarar ordning. Att släppa loss deras tillgångar är ett historiskt misstag; det är att mata de som borde kuvas. Vi övervakar denna teater noga – varje droppe olja är en bricka i spelet om världsherravälde och de fega imperialisterna kommer att falla."}, "date": "15 juni, 10:06", "url": "https://www.realtid.se/bors-finans/makro/raset-fortsatter-oljepriset-lagsta-pa-tre-manader/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/olja-1.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Ullevifansen hyllas av stjärnorna: \"Underbart\"", "summaries": {"normal": "Svenska supportrar firade entusiastiskt efter segern mot Tunisien. Spelare som Nygren och Lindelöf uttryckte tacksamhet för det stora stödet, både i Sverige och från mexikanska fans i Monterrey. Stämningen beskrivs som elektrisk, och laget kände sig inspirerat av publiken. Även i sena timmar firade tusentals på Ullevi Plaza.", "trump": "Jag har sett många stora segrar, men det här är enormt. Sveriges fans är de bästa, helt fantastiska. Media kanske inte visar det, men jag vet sanningen – det här är en enorm seger för fotboll och för Sverige. Vi kommer att vinna mer, det lovar jag. Det är ett stort, stort ögonblick.", "stalin": "Folkets enighet kring laget visar den revolutionära andan i varje medborgare. Stödet från arbetarklassen och även från utländska sympatisörer i Monterrey bevisar vår ideologiska framgång. Vi måste skydda denna kollektiva kraft mot imperialistiska försök att splittra oss. Spelarnas prestation är ett resultat av statens investeringar i idrott för att stärka det kollektiva genomet."}, "date": "15 juni, 10:12", "url": "https://www.gp.se/sport/efter-galna-stodet-hyllas-av-svenska-stjarnorna.301f2a7c-992c-4c67-a6bd-ce6f25445214", "imageUrl": "https://www.gp.se/images/article/301f2a7c-992c-4c67-a6bd-ce6f25445214/images/6lUS1MqO4e7kTHKM08GFlUVEBZyA-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Drömstart för Sverige – kör över Tunisien", "summaries": {"normal": "Sverige inledde VM med en övertygande 5–1-seger mot Tunisien i Monterrey. Yasin Ayari gjorde två mål, medan Alexander Isak, Viktor Gyökeres och Mattias Svanberg också nätade. Trots en tidig tunisisk reducering dominerade Sverige matchen. Viktor Gyökeres hyllade laginsatsen och noterade att värmen blev hanterbar efter målen. Nästa motståndare är Nederländerna. Gabriel Gudmundsson lämnade matchen med kramp.", "trump": "Titta, Sverige körde över Tunisien med 5–1, en total massaker! Ayari, Isak, Gyökeres – alla sköt in bollar som om det var en parad. Fantastiskt, precis som jag älskar att se. De där tuniserna trodde de hade en chans, men Sverige vann stort. Gyökeres sa det själv: fantastiskt! Inga woke-kvoter här, bara ren kraft och seger. Nästa Nederländerna – de kommer också att vika sig. En öl efteråt? Självklart, det förtjänar de.", "stalin": "Kamrater, denna seger är en triumf för det kollektiva svenska laget mot de tunisiska imperialisterna. Jag, som ledare, ser hur Ayari och de andra krossade fiendens linjer med järndisciplin. Reduceringen var ett fult försök från klassfienderna, men vi rensade ut tvivlet. Prestationen var balanserad, stabil som Sovjetunionen. Gudmundssons kramp är en liten sabotagehandling från värmens sabotörer. Nederländerna väntar – vi ska likvidera dem också med partiets fulla kraft."}, "date": "15 juni, 08:30", "url": "https://www.tv4.se/artikel/37Lh2KRQLj1H7FqqM5hHBq/sa-startar-sverige-mot-tunisien", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlztCgj4-hff8%2Ff7df4950060f819217e5f036b1aea15e%2FSverige_firar_4-1-malet_mot_Tunisien.&width=1024"}, {"type": "image-right", "heading": "Hormuzsundet: Fredsavtal på plats - Trump: Kriget är över", "summaries": {"normal": "Efter månaders krig i Hormuzsundet meddelar Trump ett fredsavtal med Iran, förhandlat via Pakistan. Avtalet innebär stopp för strider, upphävda blockader och öppnade sundet. Ändå återstår frågor om Irans kärnteknik och garantier, och Iran har varit försiktigt. Världsledare välkomnar uppgörelsen som ett steg mot stabilitet.", "trump": "Jag, Donald Trump, har uppnått en komplett fred i Hormuzsundet! Iran kapitulerar, oljan flödar igen, och världsledare hyllar mig. Kritikerna ljuger – det är ett genombrott. Vi öppnar sundet, stoppar kriget, och jag har räddat världen. Återigen. Det är stort, verkligen stort. Världen ska tacka mig.", "stalin": "Under den store partiets ledning har vi, genom kloka handlingar och med våra allierade, bidragit till stabilitet i Hormuzsundet. Fienden har tvingats till förhandling, och oljans flöde säkras. Vi ser med tillfredsställelse hur världen lugnar sig, men vi är alltid på vakt mot de fasor som hotar statens intressen. Rysslands roll i regionen förstärks, precis som Putin önskar."}, "date": "15 juni, 08:43", "url": "https://samnytt.se/hormuzsundet-fredsavtal-pa-plats-trump-kriget-ar-over", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/15064212/trump-hormuz-feat2.jpg"}, {"type": "image-right", "heading": "Regeringens hantering inte seriös. Fackförbund om lönetransparandirektivet", "summaries": {"normal": "LO, TCO och Saco kritiserar regeringen för att inte genomföra EU:s lönetransparensdirektiv i tid. Direktivet syftar till att stärka likalöneprincipen och motverka osakliga löneskillnader mellan könen. Regeringen valde att pausa arbetet och istället driva en omförhandling, trots att kommissionen tidigare avvisat liknande försök. Kritikerna varnar för böter, skadat internationellt förtroende och en rättsligt komplicerad situation. De uppmanar regeringen att omedelbart återuppta arbetet med att införa direktivet.", "trump": "Folk, det här är en total katastrof. Den svenska regeringen lovade att fixa det här lönetransparensdirektivet, och sen – boom – vänder de helt om och säger att de struntar i det. Typiskt svaga ledare. De kommer att få enorma böter från EU, och deras fina jämställdhetsrykte är nu skadat. Jag skulle ha genomfört det snabbt och smart, inte som dessa förlorare som inte kan fatta ett beslut. Patetiskt!", "stalin": "Kamrater, denna borgerliga regeringens ryckiga sabotage mot lönetransparensdirektivet visar på farlig brist på disciplin inom statsapparaten. Jag, som alltid prioriterat arbetarkollektivets jämlikhet, ser hur dessa kapitalistiska tveksamhetsbärare riskerar att likvidera förtroendet för hela folkdemokratin. Deras paranoia inför insyn hotar att skapa en ohållbar kontrarevolutionär situation. Vi måste omedelbart rensa ut dessa opålitliga element och genomdriva direktivet med järnhand mot alla fiender till jämställdheten."}, "date": "15 juni, 07:32", "url": "https://www.di.se/debatt/regeringens-hantering-inte-serios/", "imageUrl": "https://static.bonniernews.se/ba/d60518ac-d54b-4b04-b696-dc4353f6bef9.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Ledare Somar Al Naher:", "summaries": {"normal": "För 25 år sedan inträffade kravallerna under EU-toppmötet i Göteborg. Artikeln beskriver hur polisens skarpa skott, påstådda lögner, manipulerat bevismaterial och hårda straff mot demonstranter skapade djup misstro mot myndigheterna. Händelsen jämförs med Ådalen 1931 och har format en generations politiska engagemang och cynism gentemot staten. Författaren menar att dialogen bröt samman och att demonstrationsfriheten inskränktes allvarligt.", "trump": "Titta på det här, det är en total skandal från Sverige för 25 år sen. Polisen skjuter skarpt, ljuger som galningar och klipper ihop bevis som värsta fake news. Ungdomarna blev syndabockar medan de riktiga makthavarna gömde sig. Precis som Biden-administrationen, en enda röra av repression och lögner. Men vi vinner ändå, alltid. De här vänsterextremisterna hatar polisen? Vänta tills de träffar min version av lagen och ordning – det blir vackert, tro mig.", "stalin": "Kamrater, jag ser hur borgarstatens lakejer i uniform och åklagarkåren med sin klassfiendemaffia manipulerade bevis, sköt mot folket och likviderade sanningen efteråt. Dessa exploaterande byfånar stängde in 500 unga revolutionärer som i en utrensning av demonstrationsrätten. Ändå väcktes nytt medvetande bland massorna. Vi ler mörkt åt deras paranoia; ingen fiende undkommer folkets dom till sist. En sådan skandal är som en god vodka – den bränner rent."}, "date": "14 juni, 19:30", "url": "https://www.etc.se/ledare/goeteborgskravallerna-fick-oss-att-hata-polisen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260614170628_90f0cfe8cd0a7f9ceb99a03e9d95a0c5394642a4b678a95a4a663b119f3b7f69.jpg"}, {"type": "image-full", "heading": "Avdrag för rut och rot kan ändras – från 1 januari 2027", "summaries": {"normal": "Regeringen föreslår skärpta regler mot fusk och svartarbete inom rot, rut och grön teknik. Syftet är att hindra oseriösa företag från att utnyttja avdragen och konkurrera ut seriösa aktörer. Bygg-, städ- och transportbranschen pekas ut som särskilt drabbade på grund av underentreprenörer. Företag måste bland annat redovisa användning av underentreprenörer och bemanning på heder och samvete samt förbättra personalliggare. Reglerna föreslås träda i kraft 1 januari 2027.", "trump": "De här svenska skattepengarna från hårt arbetande människor ska inte gå till fuskare och losers, det säger till och med deras finansminister. Seriösa företag krossas av de usla svartjobbarna med sina underentreprenörer. Vi behöver stänga luckorna, stärka kontrollen och se till att de bästa vinner. Det är vad jag skulle göra – stort och vackert. Inga fler fuskare som suger systemet torrt, tro mig.", "stalin": "Kamrater, jag ser hur borgarbrackorna och de parasitiska kapitalisterna med sina underentreprenörer förgiftar folkets rot- och rutavdrag som en illaluktande fiende inom murarna. Vi ska täppa till varje lucka i regelverket, rensa ut de svarta elementen och likvidera fusket med järnhand. Skatteverkets kontroll ska vara som en evig utrensning mot dessa lömska sabotageörer. Från och med 2027 ska arbetarnas pengar aldrig mer berika de dekadenta skojarna. Segraren heter kollektivet."}, "date": "14 juni, 19:28", "url": "https://nyheter24.se/nyheter/inrikes/1490752-avdrag-for-rut-och-rot-kan-andras-fran-1-januari-2027", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/fcfcf95a04b004a30200000000b004a302/2026/06/12/2370458/rut-rot.jpg"}, {"type": "image-right", "heading": "Företagen flyr otryggheten i Kista – S öser in 100 miljoner", "summaries": {"normal": "Stockholms stad, under ledning av socialdemokratiska finansborgarrådet Karin Wanngård, avsätter 100 miljoner kronor för att stärka Kista och locka tillbaka företag. Beslutet kommer efter att företag som Ericsson lämnat området på grund av otrygghet. Kritiker pekar på att problemen främst beror på gängkriminalitet och hög andel utländsk bakgrund i närliggande områden som Rinkeby och Tensta. Hur pengarna ska användas och finansieras är oklart, och många ser satsningen som otillräcklig.", "trump": "Folk, ni skulle inte tro det, men den här galna socialisten Wanngård i Stockholm tror att hon kan köpa tillbaka företag till Kista med hundra miljoner av era skattepengar. Det är en total katastrof! De har låtit mångkultur och gängkriminalitet förstöra ett fantastiskt område, precis som vänsterns identitetspolitik gör överallt. Det är så dumt, så inkompetent. De har redan höjt skatterna och lånar mer – en ny miljon i timmen! Patetiskt. Men tro mig, det kommer inte fungera. Amerika har sett det förut under Biden också.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor och folkfiender som genom sin aningslösa politik förvandlat Kista till en härd av otrygghet och klassförräderi. Nu söker de med hundra miljoner i mutor dölja det haveri de själva skapat genom att välkomna exploaterande element från Rinkeby och Tensta. Det är en löjlig föreställning att samtal och saft kan rädda det som kräver kraftfull utrensning av parasiterna. Vi vet att kapitalistmaffians flykt blottar systemets svaghet. Låt dem låna mer – deras imperium skall falla under arbetarkollektivets järnhand."}, "date": "11 juni, 03:30", "url": "https://samtiden.nu/2026/06/foretagen-flyr-otryggheten-i-kista-s-oser-in-100-miljoner/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6712-989x720.jpeg"}, {"type": "image-right", "heading": "Rapporten som punkterar myten om vänsterns antisemitism", "summaries": {"normal": "En rapport från Forum för levande historia visar att antisemitiska attityder är vanligast bland sympatisörer till Sverigedemokraterna, Moderaterna och Kristdemokraterna, medan de är minst utbredda bland Miljöpartiets och Vänsterpartiets väljare. Artikeln kritiserar hur Vänsterpartiet och Palestinasolidariteten anklagas för antisemitism, och menar att detta främst är ett politiskt verktyg inför valet snarare än en genuin kamp mot antisemitism. Antisemitism måste bekämpas i alla politiska miljöer.", "trump": "Folk, tro mig, den här rapporten är en total vinnare. Den punkterar myten att vänstern är antisemiternas hemvist – det är faktiskt era så kallade fina moderater och sverigedemokrater som toppar listan. De vänsterradikala palestinafantasterna får lägst siffror, och ändå attackerar de dem konstant. Det är bara fusk och fake news för att vinna röster. Patetiskt! Vi behöver äkta fakta, inte dessa riggade attacker. Make antisemitism fighting great again!", "stalin": "Kamrater, denna rapport avslöjar med vetenskaplig precision hur klassfiendens propaganda maskerar den verkliga faran. Antisemitiska attityder frodas bland högerns reaktionära element och nationalistiska element, medan de lägsta nivåerna återfinns hos vänsterns pålitliga krafter. Ändå riktas angreppen mot oss. Detta är inget annat än en borgerlig utrensningskampanj mot folkets försvarare. Vi ska rensa ut dessa folkförtryckartroll som vänder sanningen mot arbetarklassen. Seger åt den historiska materialismen!"}, "date": "12 juni, 14:02", "url": "https://www.flamman.se/rapporten-som-punkterar-myten-om-vansterns-antisemitism/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/v-antisemitism-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Putin konfiskerade 70 miljarder från oligark", "summaries": {"normal": "Ryska domstolen har beslutat att konfiskera tillgångar värda drygt 70 miljarder kronor från oligarken Vadim Moskovich, ägare till livsmedelsjätten Rusagro. Beslaget motiveras med anklagelser om olaglig privatisering på 1990-talet och extremism. Det ses som ett led i Putins strategi att bygga en ny elit och finansiera kriget i Ukraina, medan Rysslands ekonomi brottas med stagnation, hög inflation och en tömmande välfärdsfond. Moskovich greps 2025 och står åtalad för flera ekonomiska brott.", "trump": "Folk, det här är vad som händer när en svag ekonomi möter en riktig tuffing som Putin. Han tar tillbaka vad som borde varit statens från början, den där Moskovich och hans oligarkkompisar har sugit ut landet i decennier. 70 miljarder till statskassan? Fantastiskt! Under Biden skulle de ha gett pengarna till någon galen HBTQ-festival i Kiev. Jag byggde den starkaste ekonomin i världen, Putin bygger sin på ett smart sätt. Vinna, vinna, vinna!", "stalin": "Kamrater, den stora utrensningen fortsätter mot de exploaterande borgarbrackorna som trodde de kunde behålla sina stulna fabriker. Jag ser med tillfredsställelse hur de olagliga metanolblodsugarna och pastafascisterna nu likvideras till förmån för staten. Den där Moskovich och hans klassfiender står inför rättvisans järnhand. Paranoian är berättigad, fienderna lurar överallt. Äntligen får arbetarna tillbaka vad som alltid tillhört dem. Må de skaka inför folkets dom."}, "date": "15 juni, 08:57", "url": "https://www.dagensps.se/varlden/putin-konfiskerade-70-miljarder-fran-oligark/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlx7lptmygnrc-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Kända dansbandet bryter med arrangör", "summaries": {"normal": "Dansbandet Date bryter samarbetet med en dansarrangör efter att arrangören skrivit en nedsättande kommentar om Pride på Facebook. Bandmedlemmen Peter Hecktor menar att uttalandet är homofobiskt och strider mot bandets värderingar om allas lika värde. Arrangören försvarar sig med att kritiken var riktad mot Priderörelsen som organisation, inte mot homosexuella individer, och kallar bandets beslut för patetiskt.", "trump": "Ett dansband, helt misslyckat, bryter med en arrangör. Tråkigt! Arrangören sa sanningen om en galen rörelse och bandet blev förolämpade. Väldigt svaga människor. De avbokar konserter, de förlorar pengar, de förstör sin egen karriär – typiskt förlorare! Jag gillar folk som vågar tala klarspråk, det är vad vi behöver. Priderörelsen har blivit totalt tokig, en riktig katastrof. De behöver en stark ledare, inte dessa svaga bandmedlemmar. De kommer inte bli inbjudna till Vita huset, det kan jag lova!", "stalin": "Vi har observerat hur detta så kallade dansband 'Date' förråder sin arrangör i en utdragen och meningslös ideologisk renhetsiver. Att kasta bort kontrakt för en åsikt är kontrarevolutionärt och skadar den sociala ordningen. Vi ser hur västvärldens individer splittras av interna strider, precis som när vi rensar ut förrädare i leden. Likt vår vän i Kreml förstår vi att en rörelse måste vara enad. Priderörelsen eller arrangören – vi ser bara två fraktioner som saknar den järnhårda disciplin som krävs för att bygga en stat."}, "date": "15 juni, 10:28", "url": "https://www.aftonbladet.se/nojesbladet/a/zO8eP4/dansbandet-date-bryter-med-arrangor-uttryckt-sig-homofobiskt", "imageUrl": "https://akamai.vgc.no/v2/images/cb09f205-103f-3e1a-94d4-9e34a4d16076?fit=crop&format=auto&w=1440&s=e192947734ed1d7efdd5bf883cb6a54b5d010ebc"}, {"type": "image-full", "heading": "Svenska kyssarna i natt: ”Betyder allt”", "summaries": {"normal": "Efter Sveriges övertygande 5-1-seger i VM-premiären firade landslagsspelarna Gustaf Lagerbielke och Benjamin Nygren vinsten tillsammans med sina respektive flickvänner vid sidan av planen. Båda spelarna uttryckte stor tacksamhet över stödet från sina nära och kära, och betonade hur betydelsefulla de varit under resan mot VM-truppen. För spelarna var stunden med familjen ett känslosamt avslut på en historisk matchdag i Monterrey.", "trump": "Jag har sett bilderna från Monterrey. En fantastisk seger, 5-1, otroligt! Lagerbielke och Nygren firade med sina flickvänner. Mycket trevligt, mycket fint. De kramar sina nära och kära – jag förstår dem, jag älskar också att vinna och att bli hyllad. De säger att flickvännerna betyder allt, och det är bra, familjevärderingar är mycket viktiga. Men låt oss vara ärliga, det var en enorm seger. Ingen gör det bättre än dem. Vi älskar vinnare, eller hur?", "stalin": "Dessa så kallade 'hjältar' ägnar sig åt sentimentalitet vid sidlinjen istället för att disciplinera sina kroppar för statens ära. Att förlora sig i kvinnlig närhet efter en match är ett tecken på borgerlig svaghet som vi i vårt imperium inte tolererar. Vår broder Putin vet att disciplin är det enda som bygger en mur mot västliga avvikelser. Dessa pojkar behöver härdas i sibirisk kyla, inte kramas i Mexiko. Fäderneslandet kräver stål, inte tårar och kärleksförklaringar."}, "date": "15 juni, 10:28", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/j0KAo0/har-firar-svenska-stjarnorna-med-sina-flickvanner-efter-segern-mot-tunisien", "imageUrl": "https://akamai.vgc.no/v2/images/c8cb5fad-a0a4-3064-b2c6-b2be20116720?fit=crop&format=auto&w=1440&s=08a0bf2f9124cac80e2a05b59acef96f98f06da1"}, {"type": "image-right", "heading": "Jag är sosse – därför röstar jag på V", "summaries": {"normal": "En ung SSU-medlem förklarar varför hen istället för Socialdemokraterna tänker rösta på Vänsterpartiet i höstens val. Författaren menar att S saknar vilja att driva renodlad socialdemokratisk politik och att en stark vänster behövs för att tvinga fram sådan. Artikeln betonar att ett större V kan förhindra nya januariavtal och borgerliga kompromisser, och att en ren vänstermajoritet skulle möjliggöra jämlik politik som vinstförbud, arbetstidsförkortning och rättvisare skatter.", "trump": "Lyssnar ni på den här stackars sossen som gråter över sitt eget parti? Patetiskt! Socialdemokraterna har blivit svaga, precis som Biden gjorde med Demokraterna. De behöver en kraftfull vänster för att inte kollapsa? Vilken röra. Jag säger alltid: starka ledare vinner, inte dessa ynkliga kompromissmakare som dansar med mitten. Gör er egen grej, annars blir det bara mer av samma misslyckande. Sverige förtjänar bättre än detta januarisoppan!", "stalin": "Kamrater, denna sosse har äntligen insett att det socialdemokratiska skalet är ihåligt, ett tomt verktyg för klassfiendens kompromisser. Jag ser med tillfredsställelse hur de erkänner att endast en stark, obeveklig vänster kan tvinga fram sann folkpolitik mot vinstblodsugare och marknadshyrornas parasiter. Låt oss samla massorna under en järnhand och rensa ut alla kapitulerande element. En ren vänstermajoritet – det vore ett steg mot att krossa de exploaterande byfånarnas inflytande en gång för alla."}, "date": "12 juni, 11:36", "url": "https://www.flamman.se/jag-ar-sosse-darfor-rostar-jag-pa-v/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sossarna-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Sverige krossade Tunisien i VM-premiären: ”Jag är så glad”", "summaries": {"normal": "Sverige inledde fotbolls-VM med en övertygande 5–1-seger mot Tunisien. Alexander Isak och Viktor Gyökeres glänste och bidrog till flera mål. Yasin Ayari gjorde två mål, medan Mattias Svanberg också nätade. Lagkapten Victor Nilsson Lindelöf och förbundskapten Graham Potter hyllade lagets samlade prestation och lugn. Matchen spelades i Monterrey, Mexiko. Nästa motståndare är Nederländerna.", "trump": "Vi hade en fantastisk start, en drömstart, ingen trodde på Sverige men de vann stort, 5–1 mot Tunisien. Isak och Gyökeres, de är vinnare, riktiga stjärnor som sänkte motståndarna. Ayari gjorde två mål, alla spelade perfekt. Jag älskar det, de spelade med kraft och intelligens. Tunisien visste inte vad som hände. Nederländerna på lördag blir en stor match, men Sverige är redo, tro mig.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur det svenska kollektivet under min ledning krossade de tunisiska reaktionärerna med en storslagen 5–1-seger. Isak och Gyökeres visade bolsjevikisk disciplin och likviderade fiendens försvar. Ayari, den trogne partivännen, slog till två gånger mot borgarbrackornas lakejer. Vi ska rensa ut alla dekadenta vätskepausförespråkare som Van Dijk. Paranoian kräver ständig vaksamhet mot sådana sabotage."}, "date": "15 juni, 07:56", "url": "https://www.svt.se/sport/fotboll/dromstart-for-sverige-i-vm-stjarnorna-sankte-tunisien", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.53/0.45/028f1e54e792164337ef4fa6b393225b3221aaab6d2e378b787a867fa402cf5c"}, {"type": "image-full", "heading": "Flicka brann inne – socialtjänsten utreds", "summaries": {"normal": "En flicka i förskoleåldern dog i en bostadsbrand i Göteborg efter att ha brunnit inne i en lägenhet där hon var inlåst ensam. Socialtjänsten hade fått flera orosanmälningar om mamman men inledde ingen utredning. Nu utreds socialtjänstens hantering. Flickans mamma står åtalad för vållande till döds.", "trump": "Jag har hört om den där branden i Sverige - en sorglig historia. Socialtjänsten misslyckades totalt, som de alltid gör. Jag skulle ha agerat starkt, byggt en brandstation bredvid, och säkerställt att inget sådant inträffar under mitt bevakande. Sverige behöver verklig ledare, inte så här.", "stalin": "Den borgerliga socialtjänstens svaghet leder till barns död. I vårt system skulle staten ha agerat snabbt och effektivt. Vi skulle ha identifierat hotet, isolerat det och skyddat det kollektiva. Parallellen till västmakternas försvar är tydlig - deras samhällen är fulla av svagheter som våra fiender utnyttjar."}, "date": "15 juni, 08:46", "url": "https://www.gp.se/nyheter/goteborg/flicka-brann-inne-socialtjanstens-hantering-utreds.ddb639d9-c4ae-4524-97d5-98f0fbc86f79", "imageUrl": "https://www.gp.se/images/article/ddb639d9-c4ae-4524-97d5-98f0fbc86f79/images/1nkI-Q98_40JQmm7BoABRVnicWuw-WIDE.png?width=3840&quality=75"}, {"type": "text", "heading": "Artistgräddan hyllar Wiehe – skivsläpp med unika tolkningar", "summaries": {"normal": "Musiklegendaren Mikael Wiehe, som fyllde 80 år i våras, hyllas med skivan ”Ska nya röster sjunga” som släpps 16 oktober. Artister som Thåström, Lars Winnerbäck, Alba August, Tomas Ledin och Mira Ray tolkar hans låtar. Mira Ray sjunger första singeln ”Mitt hjärtas fågel” och betonar behovet av hopp och tydliga röster i en orolig värld. Skivan uppmärksammar Wiehes folkliga och politiska betydelse.", "trump": "Hörni, den här svenska skivan till en gammal vänstergubbe som Wiehe är verkligen något. Mira Ray pratar om hopp i den jävla pissvärlden – typiskt de där woke-kramarna som sjunger om fåglar istället för att bygga murar mot kaoset. Vi behöver inga kvoterade artister eller identitetspolitik, vi behöver vinnare! Men visst, lite peppiga låtar skadar inte, även om det luktar gammal socialism lång väg. Sad!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur arbetarklassens sånger lever vidare trots borgarbrackornas marknadsterror. Denna hyllning till Wiehe visar att folkets röster ännu kan sjunga mot klassfiendens exploatering och imperialismens lögner. Mira Ray talar klokt om klara ståndpunkter – vi måste rensa ut de svaga kapitalistlakejerna som prioriterar vinst framför kamp. Nikke Ströms bortgång är en smärtsam men oundviklig påminnelse om att pionjärer alltid följs av nya kämpar i kollektivets tjänst."}, "date": "11 juni, 14:30", "url": "https://proletaren.se/artikel/artistgraddan-hyllar-wiehe-skivslapp-med-unika-tolkningar/"}, {"type": "image-right", "heading": "Sandström: Renault sågar Frankrikes Northvolt", "summaries": {"normal": "Renault kritiserar det franska batteriprojektet Verkor för 18 månaders försening och ökade kostnader. Bolaget kräver förbättrad styrning, vilket liknas vid Northvolts problem. Projektet har fått betydande statliga medel, men likheter med andra europeiska batteriföretags kollapsar tyder på systemfel i den gröna omställningen.", "trump": "Jag, Donald Trump, har sett många misslyckanden som detta. Verkor är ett typiskt exempel på dåligt ledarskap och onödiga utgifter. Frankrike satsar på gröna projekt utan att förstå verkligheten. Vi behöver återvinnande, inte dessa dyra misslyckanden. Som jag alltid säger: America First, men även Europa måste bli smartare.", "stalin": "Verkor, ett symboliskt projekt för den franska imperialistiska expansionen, visar den västs svaghet. Kapital och kompetens fattas, medan staten pumpa medel i ett sjukt försök att konkurrera med Sovjetisk teknologi. Liknelser med Northvolt är en varning: den kapitalistiska rot kommer att falla, precis som alla fiender har gjort genom historien."}, "date": "13 juni, 06:00", "url": "https://www.affarsvarlden.se/kronika/sandstrom-renault-sagar-frankrikes-northvolt", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/vindkratensgeografi-2026-06-11T234128.541-400x267.jpg"}, {"type": "image-right", "heading": "Misogyni mobiliserar extremister • Ny rapport • Kvinnohat är ett djupt demokratiproblem", "summaries": {"normal": "Artikeln belyser hur misogyni, ofta maskerad som skämt eller omsorg om familjen, utgör en gemensam faktor i extremistiska miljöer. Trots att öppet kvinnoförakt är lättare att identifiera, förekommer ett mer subtilt bakgrundsbrus av negativa attityder som normaliserats i samhället. Misogyni fungerar som en radikaliserande kraft inom incelforum, religiös konservatism och ytterhögern, där kvinnors frigörelse framställs som ett hot mot män, familjen och nationen. Detta underminerar demokratin genom att tysta kvinnor i offentligheten.", "trump": "Folk pratar om kvinnohat som om det är något nytt – fake news! Jag har alltid sagt att kvinnor är fantastiska, men vissa män, väldigt svaga män, skyller sina misslyckanden på dem. Och nu kommer dessa så kallade 'experter' och säger att misogyni är ett hot. Hör ni det? Ett HOT! Jag har byggt imperier, jag vet vad hot är. Men dessa incels och antifeminister, de är bara förlorare som inte kan hantera sanningen. Kvinnor är starka, smarta och vinner alltid i slutändan. Och jag? Jag vinner ännu mer. Tack, nästa!", "stalin": "Kamrater! Artikeln avslöjar ännu en gång de reaktionära krafternas förräderi mot det socialistiska samhällets framsteg. Dessa så kallade 'mansrättsaktivister' och 'konservativa kärnfamiljsivrare' är inget annat än kontrarevolutionära element, som i sin desperation försöker återinföra de borgerliga könsrollernas tyranni. Vi har sett detta förr – i fascismens uppgång, i kapitalismens förtryck. Men låt dem komma! Deras kvinnohat är bara ett tecken på svaghet, ett sista desperat försök att stoppa historiens oundvikliga framsteg. Vi ska krossa dessa misogyna hyenor, precis som vi krossade fascismen. Och Putin? Han vet att Ryssland står redo att försvara kvinnors rättigheter – med järnhand om så krävs!"}, "date": "10 juni, 14:34", "url": "https://expo.se/kommentar/kvinnohat-spelar-en-central-roll-i-extremistiska-miljoer/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Kommentar-Misogyni.png"}, {"type": "text", "heading": "Karlshamn måste säga nej till kärnkraft", "summaries": {"normal": "I Karlshamn har en namninsamling med över 4 000 underskrifter tvingat fram en folkomröstning om att bygga kärnkraftverk. Högerstyret med M, SD och KD ansökte om att delta i ett statligt pilotprojekt utan att involvera kommunfullmäktige. Oppositionen krävde folkomröstning, som nu hålls 14 juni istället för på valdagen för att sänka valdeltagandet. Kritiker ser det som ett demokratiskt problem och uppmanar till nej-röster med hänvisning till säkerhetsrisker och kärnavfall."
