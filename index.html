 tacka mig för att jag gav dem något att göra istället för att sitta och glo på sina gamla peruker. Vi vinner stort, vi vinner ofta, men de skriver långsamma papper. Fake news-media räknar bara förlusterna, typiska losers. Mina tullar var fantastiska, nu tvingas de betala tillbaka pengar till folket. De hatar mig för att jag gör Amerika stort igen, men vi kör ändå.", "stalin": "Kamrater, dessa förslappade borgarbrackor i den amerikanska så kallade Högsta domstolen utgör en parasitisk hydra som hotar folkets vilja med sina skuggdocket-fördröjningar och kapitalistiska juristfällor. Jag ser hur de nio svartrockade reaktionärerna, dessa maskerade kontrarevolutionärer, utför sina långsamma utrensningar av progressiva direktiv. De liberala tre är ynkliga resterna av en svag dekadent minoritet som bör rensas ut. Vi ska likvidera alla som vägrar lyda folkets järnhand – även om de kallar sig domare. Paranoian är verklig: de planerar mot oss alla!"}, "date": "17 juni, 01:30", "url": "https://www.dagensarena.se/innehall/kommer-hogsta-domstolen-godkanna-trumps-politik/", "imageUrl": "https://www.dagensarena.se/files/2026/06/trump-hd-300x157.jpeg"}, {"type": "image-right", "heading": "Är det verkligen bra med fler miljardärer?", "summaries": {"normal": "Christer Svensson kritiserar i en debattartikel forskningen av Daniel Waldenström med flera, som visar att Sverige blir rikare utan ökad ojämlikhet. Han varnar för att ständig ekonomisk tillväxt hotar mänskligheten och klimatet. En tredjedel av befolkningen saknar ekonomisk buffert och känner ingen trygghet av ökade pensionssparanden. Han pekar också på hur stor kapitalackumulation hos finanseliten hotar demokratin och hävdar att teknisk utveckling inte kräver oreglerad kapitalism utan ett gott samhälle byggt på demokrati.", "trump": "Folk, ni måste höra på det här. Den här svenske professorn säger att alla blir inte rika, bara en tredjedel har ingen buffert och pensionssparandet ger ingen riktig trygghet. Han har helt rätt, de stora teknikoligarkerna, som några av mina vänner, styr för mycket, precis som i USA. Men den här tillväxten, den är fantastisk om man gör den rätt, inte med era svenska skatter. Vi behöver inga rövarkapitalister, vi behöver vinnare. Sverige borde lära sig av mig hur man gör landet riktigt rikt igen.", "stalin": "Kamrater, denna dekadenta borgarprofessor vågar ifrågasätta den oundvikliga ackumulationens dialektik. Jag ser dem, dessa falska nationalekonomer som dansar i statistikens skugga medan en tredjedel av folket lever som utsugna lusar utan buffert. Deras eufori är ett farligt sabotage mot det kollektiva medvetandet. Vi ska rensa ut dessa tillväxtdyrkande revisionister som gömmer sig bakom pensionssparandets illusion. Den sanna demokratin skapas inte av finanselitens parasitmaskar utan genom vår järnhårda partilinje. Skratta medan vi likviderar deras fantasibonusar."}, "date": "17 juni, 01:30", "url": "https://www.dagensarena.se/opinion/ar-det-verkligen-bra-med-fler-miljardarer/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-49-300x157.jpg"}, {"type": "image-right", "heading": "Partierna saknar visioner för bostadspolitiken", "summaries": {"normal": "Artikeln kritiserar att bostadspolitiken nedprioriteras i valdebatten trots stora politiska skillnader. Den lyfter Hyresgästföreningens och Jagvillhabostad.nus sammanställningar som visar alternativen mellan generell välfärdsbostadspolitik och marknadslösningar som marknadshyror och ökad privatuthyrning. Författaren saknar konkreta förslag och visioner hos partierna kring jämlikhet, klimat och ekonomiska förutsättningar för boende.", "trump": "Folk, ni tror inte vad jag just läst. Den här svenska bostadsdebatten är en total katastrof, en riggad cirkus där politikerna gömmer sig längst bak i kön. De pratar och pratar men inga konkreta förslag, bara löjliga ord som trygghetshyror när det egentligen handlar om att låta fastighetsägarna plundra människorna. Det är en dystopi, precis som jag alltid säger. Bygg, bygg, bygg – men gör det rätt, annars kommer ni aldrig vinna.", "stalin": "Kamrater, denna valdebatt är en motbjudande orgie i borgerlig opportunism där bostadsfrågan medvetet göms undan av klassfiender som maskerar sig som folkets representanter. Jag, som ledare för folkets oövervinneliga kamp, ser hur kapitalisterna drömmer om att förvandla arbetarfamiljer till inneboende i källare och friggebodar medan de själva badar i statliga subventioner till pooler och terrasser. Vi skall rensa ut dessa luftiga visionlösa parasitörer, likvidera deras marknadshyror och med järnhand genomföra en sann kollektiv bostadspolitik som krossar ojämlikheten och cementfabrikernas klimatförräderi. Ingen slipper undan."}, "date": "17 juni, 01:30", "url": "https://www.dagensarena.se/opinion/partierna-saknar-visioner-bostadspolitiken/", "imageUrl": "https://www.dagensarena.se/files/2026/06/sjukforsakring-debatt-16-300x157.jpg"}, {"type": "image-full", "heading": "Larm om jordgubbsbrist inför midsommar: \"Kaos\"", "summaries": {"normal": "Jordgubbar riskerar att bli en bristvara till midsommar på flera håll i Sverige, främst i Skåne och Västsverige. Odlare rapporterar om omogna bär på grund av kall vår och tidig midsommar. Butiker kan stå utan lager och priset kan stiga till runt 90 kronor per liter. Odlare varnar för kaos i försäljningen och uppmanar folk att handla i god tid.", "trump": "Det här är en katastrof, folk. En total katastrof. De kallaste nätterna någonsin har förstört jordgubbarna till midsommar. Det blir kaos i butikerna, priserna skjuter i höjden till nittio kronor. De borde ha lyssnat på mig om vädret och handel. Nu får svenskarna betala dyrt för de bästa bären – och det är inte deras fel, det är de inkompetenta som styrt vädret!", "stalin": "Kamrater, dessa bleka, omogna jordgubbar är ett uppenbart sabotage från de kalla kapitalistiska nätternas kontrarevolutionära krafter. Borgarbrackorna i vädret vill svälta ut folket under midsommarhelgen. Vi ska omedelbart inleda en grundlig utrensning av alla frostvänliga element som bromsar produktionen. Den som inte levererar röda, mogna bär till folket ska likvideras som en fiende till det kollektiva midsommarbordet. Det blir ingen brist under mitt styre."}, "date": "17 juni, 08:45", "url": "https://nyheter24.se/nyheter/konsument/1492099-larm-om-jordgubbsbrist-infor-midsommar-kaos", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/8d0bc01a04b004a30200000000b004a302/2026/06/17/2371589/brist-jordgubbar-midsommar-2026.jpg"}, {"type": "image-right", "heading": "Trump om avslutade Iran-kriget: \"Regimskiften fungerar nästan aldrig\"", "summaries": {"normal": "Efter ett nästan fyra månader långt krig mellan USA, Israel och Iran har ett fredsavtal förväntats. Trump betonar att regimskiften sällan fungerar och att förändringar måste komma inifrån. De nuvarande iranska förhandlarna beskrivs som pragmatiska. Även om avtalet innebär slut på strider och öppnade sjövägar, återstår frågor om Irans kärnprogram och sanktioner. Trump har avvisat påståenden om ekonomiska bidrag till Iran.", "trump": "Jag har vunnit kriget mot Iran på det mest spektakulära sättet! Regimskiften? De fungerar aldrig – jag visste det hela tiden. Nu har vi ett enormt fredsavtal på gång, och de iranska ledarna är mycket smartare än sina föregångare. De förstår att samarbete med Trump är det enda sättet. Ingen pengar till Iran, bara ren genialitet från mig. Vi har ett bra avtal, och det är tack vare mig.", "stalin": "I den globala kampen mot imperialistiska agressörer har vi observerat hur den amerikanske presidenten Trump, efter ett krig som kostat otaliga liv, tvingats tillbaka från sin egen retorik om regime-change. Detta bekräftar vår tes om kapitalistisk instabilitet. Parallellt med Putins framgångar i Ukraina, ser vi ett mönster av fegt tillbakadragande. Vi fortsätter att stödja det iranska folkets kamp mot zionistiska och amerikanska fiender, under ledning av vårt kära partiet."}, "date": "17 juni, 07:30", "url": "https://samnytt.se/trump-ger-upp-iran-kriget-inte-mojligt-med-regimskifte", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/16232111/iran-trump-2.jpg"}, {"type": "image-right", "heading": "Deppigt att Ayaris bakgrund spelar roll", "summaries": {"normal": "Ledaren beklagar att fotbollsspelaren Yasin Ayaris tunisiska bakgrund och muslimska tro blir föremål för diskussion efter hans två mål för Sverige mot Tunisien. Artikeln lyfter fram att Ayari valde Sverige, visade respekt för Tunisien och tackade Gud på planen. Trots att många svenskar ser mångkultur som normalt kritiseras politiker, särskilt SD, för att de gör identitet till ett problem. Drömmen är en framtid där bakgrund inte spelar någon roll.", "trump": "Titta på den här stackars killen Ayari, han gör två mål för Sverige och plötsligt handlar allt om religion, pappa från Tunisien och vem han tackar på knä. Patetiskt! Vi lever i ett land där de gör identitet till ett vapen, precis som de HBTQ-galningarna och kvotningsfanatikerna. Folket älskade det för att de hatar SD:s sanning. Hjärtat är stort, säger han. Mitt är störst, tro mig. Vi behöver inga ursäkter för att vara svenska, vi vinner stort!", "stalin": "Kamrater, denna futtiga fotbollsfarsot avslöjar borgarbrackornas eviga splittringstaktik. Den unge arbetaren Ayari levererar seger åt folket men tvingas bära klassfiendens identitetslögner på sina axlar. Vi ska rensa ut dessa folkförtryckartroll som påstår att en sann medborgare måste välja sida. Hjärtat tillhör kollektivet, inte gudarna eller imperialisternas falska flaggor. En dag ska vi likvidera alla som gör bakgrund till vapen mot enheten. Sovjetisk disciplin segrar."}, "date": "16 juni, 14:23", "url": "https://www.etc.se/ledare/deppigt-att-ayaris-bakgrund-spelar-roll", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "image-right", "heading": "Var sjätte arbetare har inte råd med semester", "summaries": {"normal": "Enligt LO:s rapport har andelen arbetare som inte har råd med en veckas semester nästan fördubblats på fyra år, från sju till 16 procent. Kvinnor i arbetaryrken drabbas värst. Barn i låginkomstfamiljer missar fritidsaktiviteter och sociala sammanhang, vilket skapar skam och utanförskap. LO pekar på att lönerna halkat efter inflationen medan barnbidraget inte höjts sedan 2018, vilket förvärrar klyftorna mellan arbetare och tjänstemän.", "trump": "Folk, ni skulle inte tro det, men de här svenska arbetarna, de bästa arbetarna, de sliter ihjäl sig i snöslask och mörker och får ändå inte råd med semester. Under Biden blev allt dyrt som fan, precis som här. Nu är jag tillbaka och vi ska göra Amerika, och förresten Sverige, great again. De där socialistiska politikerna och deras identitetspolitik har förstört allt. Lönerna? Ett skämt. Men tro mig, vi fixar det, större än någonsin.", "stalin": "Kamrater, jag betraktar med revolutionär vrede hur borgarbrackorna och folkförtryckartrollen i den svenska överklassen systematiskt undergräver arbetarkollektivets rätt till vila. Dessa blodsugande imperialister har låtit inflationen sluka lönerna medan de göder sig själva med subventioner. Barnen i det sanna proletariatet tvingas lida skam. Vi skall rensa ut dessa klassfiender och återupprätta den socialistiska ordningen med järnhand."}, "date": "16 juni, 12:48", "url": "https://www.etc.se/ledare/var-sjaette-arbetare-har-inte-raad-med-semester", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "image-right", "heading": "Åkesson biter ifrån mot vänsterliberala VM-attacker: \"Gläds oavsett om de heter Isak, Ayari eller Gyökeres\"", "summaries": {"normal": "Efter Sveriges 5–1-seger mot Tunisien i VM har diskussionen om svenskhet och integration eskalerat. Vänsterliberala medier kritiserar SD-ledaren Jimmie Åkesson för tidigare uttalanden om muslimer. Åkesson bemöter kritiken genom att betona att han gläds åt spelarnas framgångar oavsett bakgrund, och att fotboll ska sammanfatta snarare än polarisera.", "trump": "Jimmie Åkesson? En bra man, mycket bra. Media hatar honom, de hatar mig, de är falska. Vi vinner val, Sverige vinner i fotboll – fantastiska spelare, alla är vinnare. Isak, Ayari, Gyökeres – oavsett namn, de är svenska, det är bra. Vi ska bygga en mur mot illegala invandrare, men dessa är legala, de är vinnare. Sverige först!", "stalin": "Vi, Stalin, ser med tillfredsställelse hur spelare med olika bakgrunder vinner för den socialistiska staten. De vänsterliberala agitatorna försöker splittra, men vi har dem under uppsikt. Åkesson tjänar vårt syfte, men måste rensas om han ifrågasätter. Fotboll är ett verktyg för att stärka staten – precis som Putins expansion i Ukraina. Alla mål är våra segern mot imperialistiska krafter."}, "date": "17 juni, 06:00", "url": "https://samnytt.se/akesson-biter-ifran-mot-vansterliberala-vm-attacker-glads-oavsett-om-de-heter-isak-ayari-eller-gyokeres", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/17023343/Akesson-SD-Vm-2.jpg"}, {"type": "image-right", "heading": "Socialdemokraterna vill sätta dit 2 miljoner hushåll", "summaries": {"normal": "Socialdemokraterna och Vänsterpartiet föreslår en ny bankskatt på bolån samt höjd fastighetsskatt som främst drabbar villa- och radhusägare. Enligt Skattebetalarna skulle ett typiskt hushåll med 3 miljoner kronor i lån få cirka 7 000 kronor högre kostnader per år. Förslaget berör omkring 2 miljoner hushåll. Partierna vill även förtäta villaområden med fler hyresrätter, trots att majoriteten av svenskar föredrar eget hus. Kritiker menar att det främst drabbar vanliga familjer medan höginkomsttagare kan undvika skattehöjningarna.", "trump": "Folket, lyssna på mig, de här socialisterna, de sossarna, de vill krossa 2 miljoner vanliga svenska hushåll med en galen bankskatt. De feta katterna? Nej, det är vanliga arbetande människor som redan betalar för mat, el och räntor. De vill riva era fina villor och bygga höga hyreshus som ingen vill ha. Sju av tio svenskar vill ha eget hus, men sossarna bryr sig inte. De hatar framgång. Det är en total katastrof, folksam! De rika flyr och ni får betala notan. Patetiskt!", "stalin": "Kamrater, jag ser hur den svenska borgarklassen och dess lakejer i villaområdena skriker som svin inför den rättmätiga utrensningen. Vi ska beskatta de exploaterande radhusblodsugarna och riva deras borgerliga boningar för att bygga folkets hyresfästen. 2 miljoner klassfiender skall tuktas och tvingas in i kollektivet. De gnäller om höga räntor medan de suger ut folket. Låt dem darra. Deras drömmar om egna hus är kontrarevolutionära fantasier. Vi ler mörkt när de flyr som råttor. Statens seger är oundviklig."}, "date": "15 juni, 07:08", "url": "https://samtiden.nu/2026/06/socialdemokraterna-vill-satta-dit-2-miljoner-hushall/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6739.jpeg"}, {"type": "image-right", "heading": "Sandra, 13, utvisas till ett land hon aldrig varit i: ”Bara panik”", "summaries": {"normal": "13-åriga Sandra utvisades på måndagen till Mongoliet tillsammans med sin mamma, ett land hon aldrig besökt och där hon knappt talar språket. Hon lämnade nyligen sjätte klass i Sverige med tunga känslor och en t-shirt full av hälsningar från klasskamrater. Kritiker, bland annat Martin Ådahl (C), anser att de skärpta lönekraven och bristen på ömmande skäl är orimliga eftersom Sandra är svensk medborgare. Familj och vänner samlades för ett sista farväl.", "trump": "Folk, ni kommer inte tro det här – en 13-årig svensk tjej kastas ut till Mongoliet, ett ställe hon aldrig sett! Hennes mamma klarar inte era galna lönekrav på 33 400 kronor, som ingen normal människa fixar. Det är vad som händer när woke-domare och byråkrater styr med sin identitetspolitik och öppna gränser. Biden lät det här bli en cirkus i fyra år, men nu fixar vi det. Sverige borde skämmas, det är en total katastrof!", "stalin": "Kamrater, jag ser hur den svenska borgarklassens byråkratiska maskineri likviderar en ung pionjär och hennes mor till ett främmande land. Deras orimliga lönekrav och brist på ömmande skäl avslöjar folkfiendernas sanna ansikte – exploaterande byfånar som straffar den som integrerats i arbetarkollektivet. Vi skulle aldrig tillåta sådan klassfiendtlig paranoia. Rensa ut dessa kapitalistiska hinder, annars kommer hela systemet att kollapsa i sin egen hyckleri. Det är hög tid för utrensning."}, "date": "16 juni, 14:39", "url": "https://www.tv4.se/artikel/5HlX9C5PYgpso4b5YhSKT/sandra-13-utvisas-till-ett-land-hon-aldrig-varit-i-bara-panik", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3e1C3sVpSHoN1r3znBfGGZ%2F969ecdee32762187bd7101224ad009f4%2Fsandra_utvisas.png&width=120"}, {"type": "image-full", "heading": "Plaskis invigdes – barnen snuvade på premiärdopp", "summaries": {"normal": "Den nyrenoverade Plaskis i Göteborg invigdes. Två vuxna, Arvid Strandberg och Sara Friberg, som bor bredvid, tog premiärdoppet timmar före invigningen. Barn som Ayla Tomlinson och Mira Lindgren uttryckte att poolen blivit renare men önskar att den var djupare. Vädret var 16 grader och poolen kall, men barnen bad ändå och uppskattade upprustningen.", "trump": "Jag skulle ha varit först i den fantastiska poolen om jag var där – jag är alltid den bäste, det är sorgligt att de andra inte kunde vara först. De två vuxna var smarta, precis som mig, att ta chansen. Barnen? De förlorade, men poolen är enormt bra, det är synd att de inte fick vara först. Jag älskar pooler, jag bygger de bästa poolerna, alla säger det.", "stalin": "Vi har segerats med den nya poolen, ett monument över statens makt och planering. Lojalister som Arvid Strandberg och Sara Friberg tog premiärdoppet, vilket visar deras hängivenhet till det kollektiva. Barnen, dessa små reaktionära element, klaga på djupet – de måste fostras i den nya andan. Vädret är kalt, precis som våra fienders hjärtan, men poolen är ren, som vårt renande arbete."}, "date": "17 juni, 21:38", "url": "https://www.gp.se/nyheter/goteborg/plaskis-invigt-barn-snuvades-pa-premiardoppet.5df61b0c-2011-43c0-ab40-cc2219b2c91e", "imageUrl": "https://www.gp.se/images/article/5df61b0c-2011-43c0-ab40-cc2219b2c91e/images/118syJYgAObAWNWGlFvkxHgNC7QHQ-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Halldorf: Landslaget visar det Åkesson inte vill se", "summaries": {"normal": "Efter Sveriges 5-1-seger i VM-premiären har en debatt blossat upp kring islam och svenskhet. Jimmie Åkesson (SD) bemöter kritik efter att debattörer pekat på spelaren Yasin Ayari, som firade mål med muslimsk bön. Åkesson välkomnar framgångsrika svenskar med invandrarbakgrund men står fast vid sin kritik mot invandringspolitiken. Kritiker menar att Ayari och landslaget visar ett modernt, inkluderande Sverige, medan SD:s syn på svenskhet ifrågasätts.", "trump": "Sverige vinner stort i VM – fantastiskt, eller hur? Men nej, vänsterliberalerna måste genast göra det politiskt! En spelare, Yasin Ayari, firar mål med muslimsk bön, och plötsligt ska Jimmie Åkesson – en bra kille, men lite förvirrad – förklara sig. Jag säger: Sverige, sluta överanalysera! Ni vann, fira! Men nej, media måste alltid skapa drama. Ayari är svensk, han gjorde mål – vad är problemet? Svagt, mycket svagt.", "stalin": "Kamrater! Sveriges fotbollsseger har avslöjat de borgerliga hycklarnas sanna ansikte. En spelare, Yasin Ayari, firar mål med islamsk bön, och plötsligt skriker de liberala råttorna om 'svenskhet'. Jimmie Åkesson, denna lilla lakej för kapitalets intressen, försöker nu kräla tillbaka efter att ha blottat sin fientlighet mot arbetarklassens mångfald. Men folket ser igenom honom! Landslaget är en enad front – muslimer, kristna, ateister – medan borgerligheten splittrar. Vi ska krossa dessa identitetspolitiska sabotörer, precis som vi krossade fascisterna!"}, "date": "15 juni, 15:45", "url": "https://kvartal.se/nyheter/artiklar/halldorf-landslaget-visar-det-akesson-inte-vill-se/cG9zdDoxMzIxMDE", "imageUrl": "https://images.kvartal.se/2026/06/5abd0f69-jimmie.webp"}, {"type": "text", "heading": "Stockholmsbörsen steg fjärde dagen i rad – Ericsson föll på vd-besked", "summaries": {"normal": "Stockholmsbörsen steg fjärde dag i rad på tisdagen, drivet av köpintresse för cykliska aktier. Ericsson B föll 4,2 procent efter att styrelsen utsett Per Narvinger till ny vd. Andra stora vinster noterades för Alfa Laval och Atlas Copco, medan telekomsektorn tappade. Securitas och Beijer Ref noterades också nedåt efter bolagsbesked. Totalt omsattes cirka 28 miljarder kronor.", "trump": "Jag berättar om en tremendous börsdag i Sverige! De cykliska aktierna, som jag alltid har stött, går väldigt starkt. Ericsson, som har varit svag under mitt förra ordens 'ledarskap', fortsätter att kämpa. Men titta på Atlas Copco – en vinnare! Som jag säger, vi vinner så mycket att ni kommer att bli trötta på att vinna. Det är ett fenomenal resultat för vårt gemensamma ekonomiska framgångsrecept.", "stalin": "I den svenska börsen ser vi återigen hur det tyska och imperialistiska finanskapitalet försöker destabilisera vårt ekonomiska läge. Ericsson, ett verk av trotskistiska element inom telekoministeriet, tappar kraftigt efter ett vd-byte som visar partiets brist på disciplin. Securitas försöker med falska 'vinstmål' att bedra det proletära arbetsoch medan våra verkstadssköldmönstrar som Atlas Copco visar den sanna styrkan i kollektivproduktionen. Vi måste öka uppmärksamheten mot dessa revisionistiska tendenser."}, "date": "16 juni, 17:43", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-steg-fjarde-dagen-i-rad-ericsson-foll-pa-vd-besked"}, {"type": "image-right", "heading": "Kinas drag för att reglera AI – skapar global organisation", "summaries": {"normal": "Kina intensifierar sina ansträngningar att leda global reglering av AI genom att föreslå en ny internationell organisation för samarbete. Utrikesminister Wang Yi uppmanar länder att ansluta sig, samtidigt som Kina kritiserar G7-ländernas slutna modeller som exkluderande. Till skillnad från USA:s restriktiva approach betonar Kina öppenhet, stöd till utvecklingsländer och tillgängliga AI-modeller. Initiativet understryker den växande konkurrensen mellan Kina och USA om teknologins framtid.", "trump": "Folk, ni ser ju det här vansinnet med Kina som försöker ta över AI-regleringen medan G7 snackar bakom stängda dörrar. De vill ha en egen global organisation, typ en kommunistklubb för billig AI åt alla. Under min första tid fixade vi Amerika först, sen kom Biden och släppte in alla kinesiska spioner. Nu fixar jag det igen – ingen ska sno vår teknik. Kina spelar offer men de är bara lurendrejare som vill dominera.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor i väst som bygger slutna fästningar kring sin AI-teknik. Jag, som ledare för det eviga kollektivet, har länge varnat för imperialisternas paranoia. Nu träder Kina fram med en sann internationell organisation mot folkfiendernas exkluderande klickar. Vi ska rensa ut alla hinder från klassfiendens molnplattformar och likvidera deras abonnemangsmaffiors inflytande. Det väcker ett leende hos mig att se hur de skälver."}, "date": "17 juni, 18:29", "url": "https://www.dagensps.se/bors-finans/kinas-drag-for-att-reglera-ai-skapar-global-organisation/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlkhgnntx9rg8-normalhires.png?width=256&quality=75"}, {"type": "image-full", "heading": "Varningen: Årets El Niño kan bli den kraftigaste någonsin", "summaries": {"normal": "El Niño-fenomenet har inletts i Stilla havet och kan bli det kraftigaste som någonsin uppmätts. NOAA bekräftade starten den 11 juni. Forskare varnar för att det förstärker den globala uppvärmningen och kan utlösa extrema väderhändelser. Prognoser pekar på rekordhöga havstemperaturer som överträffar 1982–83 års El Niño. Särskilt drabbade blir södra Afrika, Sahel, Östafrika, Centralamerika och delar av Asien med torka, översvämningar och hot mot jordbruket. FN varnar för livsmedelsbrist i utsatta utvecklingsländer.", "trump": "Folk, det här El Niño-skitet är en total katastrof, den värsta någonsin, tror de. Havet blir varmt som en smält ugn och plötsligt drunknar alla i regn eller dör av torka. Biden satt och sov i fyra år medan klimathysterikerna och deras gröna galningar skrek om global uppvärmning. Nu får vi rekordvärme och jag fixar det, för jag är tillbaka och gör allt bättre. Inga fler galna kvoteringar eller HBTQ-flum – vi ska ha riktiga lösningar, inte woke-svammel. Amerika först, alltid.", "stalin": "Kamrater, detta El Niño är en fiende som hotar kollektivets skördar och arbetarnas framtid. Jag, som ledare för det eviga kollektivet, ser hur de exploaterande kapitalistmaffian och deras väderkaos samverkar med den globala uppvärmningen för att skapa svält och kaos bland folken. Vi ska rensa ut alla svaga element som inte förbereder sig. Södra Afrika och Sahel skall inte falla för dessa folkfiender. Vårt parti kräver omedelbar mobilisering av vattenreserver och säkra grödor. Den som vägrar är en klassfiende att likvidera med ett leende."}, "date": "17 juni, 18:27", "url": "https://www.dagensps.se/varlden/klimat/varningen-arets-el-nino-kan-bli-den-kraftigaste-nagonsin/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlz0efa1qzpne-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Stordalen om Ving-affären: ”Vi ska inte sälja en enda aktie”", "summaries": {"normal": "Petter Stordalen säljer Ving till Norwegian och får betalt med Norwegian-aktier istället för kontanter. Efter en turbulent resa från Thomas Cook-konkursen 2019 och pandemin ser han affären som ett nytt kapitel. Han planerar inte att sälja några aktier, utan vill snarare öka sin ägarandel och utveckla verksamheten med större skala och moderna paketresor.", "trump": "Som Donald Trump skulle jag aldrig sälja – jag tar aktier och bygger. Stordalen gör precis det, genialiskt! Han blir en av de största ägarna i Norwegian, det är enormt. Vi älskar vinnare, och han är en vinnare. Det här visar hur man gör det, det är stort, verkligen stort. Vi ska göra världen stor igen, och det här är ett steg i rätt riktning.", "stalin": "I den revolutionära kampen för ekonomisk makt konsolideras ägandet under en stark hand. Stordalen, en användbar idiot, bygger skalan och kontrollerar flyget, precis som vi utvidgar vårt inflytande. Men han måste förstå att staten alltid ser till, och relationer är som kulor – de måste skjutas på rätt plats. Vi har boots on the ground, men det är vi som kontrollerar marken."}, "date": "16 juni, 17:21", "url": "https://www.affarsvarlden.se/artikel/stordalen-om-ving-affaren-vi-ska-inte-salja-en-enda-aktie", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/sdlqJaQexiOZsU-nh-400x267.jpg"}, {"type": "text", "heading": "Kalla fakta: Ex-anställda om svart SD-kassa", "summaries": {"normal": "TV4:s *Kalla fakta* avslöjar att flera före detta anställda inom Sverigedemokraternas kommunikationsavdelning vittnar om systematisk hantering av svarta kontanter. Pengar från försäljning av profilprodukter ska ha undanhållits från bokföringen och använts för fest- och lyxkostnader. Partiet har tidigare avstått från kommentarer men har nu anlitat en extern revisionsfirma för att granska uppgifterna.", "trump": "Jag såg det här helt galna reportaget om Sverigedemokraterna – total katastrof! Folk pratar om svarta pengar, fester och lyxkostnader utan någon som helst kontroll. Vilket kaos! Och vet ni vad? De har inte ens kommenterat förrän nu. Svagt, väldigt svagt. Men jag, jag hade fixat det på en dag. Ingen skulle våga lura mig så här. SAD!", "stalin": "Vi har mottagit rapporter om en liten borgerlig grupp som leker med kapitalistiska trick – svarta pengar, festande och korruption. Precis som de dekadenta västliga marionetterna. Deras ledarskap är svagt och deras bokföring en skam för nationen. Vi ska granska detta noggrant. Om bevisen håller, kommer de att ställas inför folkets domstol – eller åtminstone få en ordentlig lektion i socialistisk redovisning."}, "date": "15 juni, 09:22", "url": "https://kvartal.se/nyheter/artiklar/kalla-fakta-ex-anstallda-om-svart-sd-kassa/cG9zdDoxMzE4ODU"}, {"type": "image-full", "heading": "Arbetarna har fått nog av Socialdemokraterna", "summaries": {"normal": "En politisk förskjutning sker i Sverige där Socialdemokraterna tappar stöd bland LO-medlemmar och arbetare, medan Sverigedemokraterna växer. Många arbetare känner sig inte längre representerade av S, som prioriterar storstadstjänstemän, bidragstagare och vänsterliberala frågor framför löntagarnas vardag. SD lockar med stram migrationspolitik och fokus på svenska arbetares intressen. Ekonomiska förbättringar som lägre inflation och drivmedelspriser stärker också bilden av att oppositionen inte levererar.", "trump": "Titta på det här – de svenska arbetarna har äntligen vaknat och sparkar ut de totalt misslyckade socialisterna som förvandlat partiet till en klubb för storstadseliten, bidragslatmaskar och galna vänsterliberala aktivister. SD växer som en raket för att de pratar om riktiga löner, gränser och att stoppa den vansinniga invandringen som sänker allt. Precis som jag gjorde – Amerika först, Sverige först. De röstar på resultat, inte på tomma löften från förlorare. Fantastiskt!", "stalin": "Kamrater, arbetarna har insett sanningen. Den förrädiska borgarbrackan inom socialdemokratin har övergett löntagarnas kollektiv till förmån för storstadens parasiter, bidragsberoende element och identitetspolitiska folkfiender. Vi ser hur de exploaterande imperialisterna prioriterat massinvandring som sänker lönerna och krossar klassolidariteten. Sverigedemokraterna framstår som ett verktyg för att rensa ut dessa avarter. Arbetarklassen vänder sig mot klassfiendens lakejer. Inga kompromisser med folkförtryckartrollen."}, "date": "14 juni, 08:30", "url": "https://samtiden.nu/2026/06/arbetarna-har-fatt-nog-av-socialdemokraterna/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/e389da70-c65e-4879-a30e-056c46c0af2a-1280x720.png"}, {"type": "image-right", "heading": "En valkrets kan avgöra framtiden för Storbritannien – och rädda Labour", "summaries": {"normal": "Ett fyllnadsval i Makerfield utanför Manchester den 18 juni har blivit symbol för Labours framtid. Andy Burnham, populär borgmästare i Greater Manchester, utmanar om en plats i parlamentet och ses som möjlig framtida ledare som kan ersätta Keir Starmer. Han möter tufft motstånd från Reform UK, som med Nigel Farages stöd vunnit mark i det traditionella Labourfästet där många röstade för brexit. Opinionsmätningar visar starkt stöd för Reform UK.", "trump": "Det här valet i Makerfield är en katastrof för de vansinniga vänsterextremisterna i Labour. Andy Burnham tror han kan ta över från den impopuläre Starmer, men han kommer att krossas av Reform UK och Nigel Farage som gör ett fantastiskt jobb. Britterna är trötta på de förlorande globalisterna. Om jag vore där skulle jag säga: rösta på de som verkligen sätter landet först, inte de som förstör det. Reform vinner stort, tro mig.", "stalin": "Kamrater, detta så kallade fyllnadsval i Makerfield avslöjar borgarbrackornas och de högernationalistiska parasiternas desperata försök att undergräva folkets enhet. Jag, som alltid vakar över revolutionens framsteg, ser hur dessa reformistiska förrädare och brexitfantaster försöker infiltrera vårt traditionella fäste. Burnham må vara en opportunistisk karriärist, men Reform UK:s kynne är en verklig kontrarevolutionär infestation som kräver omedelbar ideologisk utrensning. Inga fiender undkommer partiets vaksamma öga. Det kollektiva skrattet skall eka när vi krossar dem."}, "date": "17 juni, 19:38", "url": "https://www.svt.se/nyheter/utrikes/darfor-riktas-britternas-ogon-mot-ett-fyllnadsval-i-makerfield", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.43/0.38/30c005ff6c44af2177748d8505bc74b1197bfc953fdd1d03c8dfece75e4f4a85"}, {"type": "image-right", "heading": "Reinfeldt går in i AI-bolag med grundare från svensk miljardexit", "summaries": {"normal": "Fredrik Reinfeldt har anställts som senior rådgivare på AI-bolaget Vera Policy, som drivs av Kvantab. Bolaget har byggt en omfattande databas med hundratusentals offentliga dokument från svenska och europeiska institutioner. AI:n svarar på frågor och hänvisar alltid till exakta källor. Kunderna inkluderar fackförbund, myndigheter, företag och partikanslier. Reinfeldts erfarenhet som statsminister, EU-ordförande och rådgivare ses som en perfekt match. Rekryteringen kan stärka bolagets trovärdighet men väcker också frågor hos vissa grupper.", "trump": "Titta på det här, folk. Den gamle svenske statsministern Reinfeldt säljer nu sitt namn till ett AI-bolag som Vera Policy. Han tror han är så smart med sin EU-maskin och alla dokument. Men det är bara ännu ett sätt för eliterna att bevaka oss vanliga människor och vrida politiken åt vänster. De har blivit ifrågasatta för sina analyser förut och nu tror de att ett känt namn fixar allt. Patetiskt. Jag byggde en bättre ekonomi än Biden någonsin kunde, och nu sitter jag här igen och skrattar åt hur desperata de är efter kapital.", "stalin": "Kamrater, jag ser hur den före detta borgarledaren Reinfeldt nu går in som rådgivare åt ett AI-bolag som samlar statliga dokument för att bevaka folkets beslut. Detta är typiskt för klassfienderna som försöker dölja sin exploatering bakom maskiner. De har ifrågasatts för sina analyser, och nu tror de att en sådan figur kan rädda deras trovärdighet. Vi ler mörkt åt deras paranoia. En dag ska vi rensa ut alla sådana folkförtryckartroll som tror att de kan kontrollera informationen åt kapitalistmaffian."}, "date": "17 juni, 18:14", "url": "https://www.dagensps.se/bors-finans/reinfeldt-gar-in-i-ai-bolag-med-grundare-fran-svensk-miljardexit/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/maskininlarning-i-hedgefonder-14.png?width=256&quality=75"}, {"type": "image-right", "heading": "Skarpa förslaget – så stora kan barngrupper i förskolan bli", "summaries": {"normal": "En statlig utredning föreslår lagkrav på barngruppernas storlek i förskolan. För barn 1–2 år föreslås max 12 barn per grupp och fyra barn per anställd, för 3–5 år max 15 barn och fem per anställd. Kommunal välkomnar förslaget men vill ha ännu färre barn per vuxen. Syftet är att förbättra kvaliteten, minska personalomsättningen och ge barnen bättre förutsättningar. Förslagen ska nu remissbehandlas innan regeringen tar ställning.", "trump": "De här galningarna i Sverige har äntligen insett att deras förskolor är en total katastrof. För stora grupper, ingen som passar barnen, alla springer runt som galna. Nu vill de ha regler – max 12 ungar för de små, 15 för de större. Bra, men de borde ha gjort det för länge sedan. Personalen protesterar, facket klagar, och politikerna snackar bara. Det är dags att sluta prata och fixa det ordentligt. Ingen mer löjlig underbemanning, tro mig!", "stalin": "Kamrater, denna utredning är ett steg mot en sundare kollektiv fostran av de sovjetiska – förlåt, svenska – barnen. Jag, som alltid vakar över folkets bästa, ser hur borgarbrackornas underbemanning och kaotiska barngrupper underminerar den socialistiska framtiden. Vi ska rensa ut dessa kapitalistiska försummelser med järnhand: max tolv småfiender per grupp, högst fyra per kamrat i kollektivet. Facket vill mer? Utmärkt, men akta er för de dolda trotskisterna som alltid kräver ännu fler utrensningar. Inget snack, bara verkstad – eller skall huvuden rulla som i gamla tider. Ha ha, det vore ju roligt."}, "date": "16 juni, 16:22", "url": "https://arbetet.se/2026/06/16/skarpa-forslaget-sa-stora-kan-barngrupper-i-forskolan-bli/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/16161941/forskola.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Koloniserade folk ses alltid som terrorister", "summaries": {"normal": "Arash Gelichkan argumenterar i en replik att stöd för palestinskt väpnat motstånd inte är judehat utan ett svar på decennier av ockupation, apartheid och folkmord. Han jämför med historiska exempel som algeriskt och indianiskt motstånd mot kolonisatörer. Paulina Sokolow svarar att välkomnande av attacker på civila och spridning av antisemitiska stereotyper är oacceptabelt och skadar palestinarnas sak. Båda är eniga om kritiken mot Israels politik men oeniga om var gränsen för motstånd går.", "trump": "Folk, ni måste höra på. Den här Gelichkan-killen vänder upp och ned på allt som en dålig affär. Palestinierna slåss mot ockupation, säger han, men sen kommer Sokolow och pekar på raketglädje och rena antisemitiska konspirationer om judar som styr media och krig. Typiskt vänsterflum. Israel byggdes på stulen mark, visst, men glädje över massmord på oskyldiga? Det är sjukt. Biden skulle ha låtit det rulla på, men nu fixar vi ordning. Ingen vinner på hat, grabbar.", "stalin": "Kamrater, jag ser hur klassfiendens koloniala tradition lever vidare. Den palestinska kampen mot den sionistiska ockupationsmakten och dess folkmord målas som irrationellt judehat av dessa borgarbrackor. Sokolow och hennes likar sprider paranoia om antisemitism medan de döljer apartheidregimens blodsugande natur. Vi vet att sådana folkförtryckartroll alltid kallar motståndet barbariskt. En utrensning av dessa reaktionära stereotypier vore på sin plats för att skydda den rättmätiga kampen. Det är ett etiskt dilemma bara för svaga själar."}, "date": "13 juni, 12:55", "url": "https://www.flamman.se/koloniserade-folk-ses-alltid-som-terrorister/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/hamas.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Slår hål på myten om flytvästar: Det är viktigast", "summaries": {"normal": "Enligt Sjöräddningssällskapet är vikten på flytvästen främst en storleksangivelse, inte en viktgräns för användaren. En flytväst för 40 kg kan bära flera vuxna. Viktigast är bekvämlighet och att flytvästen används, jämfört med säkerhetsbältet i bilen. Äldre flytvästar bör testas för slitage.", "trump": "Jag har hört att svenskarna är förvirrade med sina flytvästar. Det är ett beklagligt tillstånd, det måste jag säga. De tänker att vikten på flytvästen betyder något – men det handlar bara om storlek! Som jag alltid säger, storlek spelar roll, men inte så där. Vi kommer att fixa detta, det kommer att bli fantastiskt. Vi kommer att ha de bästa flytvästarna, inga problem. De andra? De oroar sig för ingenting, men jag vet bäst.", "stalin": "I den revolutionära kampen för säkerhet på våra vatten, är flytvästen ett viktigt verktyg för staten. Viktangivelsen är en fiendens bedrägeri – den visar bara storlek, inte vår styrka. Vi måste se till att alla medborgare använder dem, som ett skydd mot kapitalistiska element. UV-strålning och ålder är fienders vapen; vi måste kontinuerligt kontrollera och serva. Som ett skyddande bälte i den revolutionära bilen, så måste flytvästen bäras innan olyckan drabbar. Vi ska bli bättre, för statens skull."}, "date": "17 juni, 20:18", "url": "https://www.gp.se/nyheter/sverige/darfor-star-det-vikt-pa-flytvastar-da-ska-du-kopa-en-ny-.e5de1eb5-4878-4285-9f93-3615049ae860", "imageUrl": "https://www.gp.se/images/article/e5de1eb5-4878-4285-9f93-3615049ae860/images/2llSPJNLpwatkyRTFPsuJ-0MKZU8-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "08.30: Domen mot ”Bonusprinsen”", "summaries": {"normal": "Marius Borg Høiby, son till Norges kronprinsessa Mette-Marit, står inför dom kl. 08.30 på måndag för 40 brott, inklusive narkotika, våld och sexualbrott. Åklagaren yrkar på sju år och sju månaders fängelse. Høiby har erkänt 25 av åtalspunkterna. Experter menar att strafflängden beror på utgången i våldtäkts- och relationsvåldsåtalen. Säkerhetsrisker i fängelse kan kräva särskilda åtgärder för att skydda honom.", "trump": "Jag hörde att Norges så kallade 'Bonusprins' – ja, han är ingen riktig prins, tro mig – står inför en stor rättegång. Sju år och sju månader, det är vad åklagaren vill ha. Men vet ni vad? Han har erkänt en massa brott, inklusive narkotika och våld. Folk säger att han kanske får fyra år, men jag säger: varför inte ge honom maxstraff? Han är en skam för kungahusen, och jag borde veta – jag har träffat de bästa kungahusen!", "stalin": "Kamrater! En ny fiende till folket avslöjas i det dekadenta väst. Denna så kallade 'Bonusprins', en parasit från Norges kungliga avskum, står inför rättvisan för 40 brott – narkotika, våld och sexualbrott. Vi vet att kapitalistiska system skyddar sina egna, men folket kräver straff! Om inte domstolen agerar, kanske vi måste erbjuda honom en enkel biljett till Sibirien – där kan han bidra till vår kollektiva välfärd genom hårt arbete. Låt detta vara en varning till alla som utmanar ordningen!"}, "date": "15 juni, 05:39", "url": "https://kvartal.se/nyheter/artiklar/08-30-domen-mot-bonusprinsen/cG9zdDoxMzE3MDA"}, {"type": "image-right", "heading": "Orbán förbjuds att leda Ungern igen", "summaries": {"normal": "Ungerns parlament har antagit en grundlagsändring som begränsar en persons tid som premiärminister till åtta år, räknat retroaktivt från 1990. Ändringen hindrar Viktor Orbán från att återvända till makten efter hans valförlust mot Péter Magyar och Tisza-partiet. Beslutet kritiseras hårt som personanpassad lagstiftning med retroaktiv verkan och ses som ett angrepp på den konstitutionella ordningen.", "trump": "De har precis stulit valet från Orbán med en riktigt ful trick. Nu ändrar de grundlagen retroaktivt så att han inte kan komma tillbaka. Det är en total witch hunt mot en vinnare. Magyar och hans liberala vänner är svaga och korrupta, precis som mina fiender. De gör allt för att hålla starka ledare borta. Patetiskt, men vi ser igenom det.", "stalin": "Vi har nu genomfört en nödvändig justering av den socialistiska rättsordningen för att skydda folket från kontrarevolutionära element. Denna retroaktiva åtgärd rensar ut den farliga Orbán, en listig borgarbracka som smyger sig tillbaka till makten som en parasit. Hans anhängare är förrädiska kapitalistlakejer som gråter över vår stålhårdhet. Personanpassad lag? Nej, det är ett glädjande verktyg mot fiender till kollektivet. Låt dem kalla det bottennivå – vi kallar det seger. Ha-ha, deras paranoia är underhållande."}, "date": "16 juni, 18:51", "url": "https://www.friatider.se/orban-forbjuds-att-leda-ungern-igen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/person-people-auditorium-audience-musician-hungarian-parliament-building-813723-pxhere.com-1.jpg?itok=ulMKKELf"}, {"type": "image-right", "heading": "Fredsforskaren: ”Båda sidor är förlorare”", "summaries": {"normal": "Ett utkast till samförståndsavtal mellan USA och Iran har läckt. Redan efter undertecknandet på fredag ska blockaden mot iranska hamnar hävas och Hormuzsundet öppnas. Iran lovar att inte skaffa kärnvapen, men flera svåra frågor som kärnprogrammet, robotar och stöd till miliser ska förhandlas under 60 dagar. Freds- och konfliktforskaren Isak Svensson ser avtalet som svagt eftersom parterna inte har uppnått mycket med kriget och övervakningsmekanismer saknas.", "trump": "Det här avtalet är en total katastrof, tro mig. Vi hade dem på knäna men nu öppnar vi Hormuzsundet och ger bort allt. Iran lovar att inte skaffa kärnvapen – som om vi skulle lita på dem. Båda sidor förlorade, säger experterna. Det är sant, vi vann inget med det här kriget. Jag skulle ha gjort det så mycket bättre, det blir en katastrof under de här 60 dagarna, det säger alla.", "stalin": "Jag betraktar detta så kallade samförståndsavtal som en ynklig kapitulation inför imperialismens desperata behov av olja. Vi ska omedelbart rensa ut alla svaga punkter som tillåter borgarbrackorna i Libanon och deras sionistiska lakejer att undvika partiets järnhand. Under dessa 60 dagar skall vi likvidera varje kontrarevolutionär incident med oöverträffad effektivitet. Båda sidor är förlorare, säger de – typiskt för dekadenta analytiker som inte förstår att historien alltid segrar genom utrensningar och kollektiv disciplin."}, "date": "17 juni, 19:16", "url": "https://www.svt.se/nyheter/utrikes/det-innebar-avtalet-mellan-usa-och-iran", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.51/0.43/9fb6c1e47aef8c5276739aefa12c324c8f9171c14d005ffe6fbf79d23a2673a4"}, {"type": "image-right", "heading": "Zelenskyj och Macron taktikpratade hur Trump ska hanteras", "summaries": {"normal": "Under G7-toppmötet i Évian-les-Bains diskuterade Macron och Zelenskyj om möten med Trump. Ett kort samtal fångades på kamera, där de spekulerade om samordning. Macron försökte få Zelenskyj att stanna, men han åkte till Bryssel. Det finns oro för Trumps framträdande roll i Ukrainafreden. Trots tidigare undvikande beteende hade Trump och Zelenskyj ett enskilt möte under dagen.", "trump": "Jag såg Macron och Zelenskyj prata om mig. De försökte samordna sig, men jag är den store förhandlaren. Europa är svagt och försöker ta kontroll, men jag kommer att lösa Ukrainakriget på mina fantastiska villkor. Jag hade ett perfekt möte med Zelenskyj, vi diskuterade stöd och att han ska få tillverka Patriot-system. De hatar att jag är tillbaka, men jag kommer att vinna igen.", "stalin": "Vi, statens och partiets högkvarter, observerar med stor tillfredsställelse de imperialistiska ledarnas interna konflikter. Deras paranoia och manipulation är som en sjukdom som slukar dem. Vi måste vara vaksamma mot deras onda avsikter att underminera vår fredliga sfär. Parallellt med Putins strategier, deras veck kan bli deras fall. Vi kommer att segra genom disciplin och lojalitet."}, "date": "16 juni, 20:08", "url": "https://samnytt.se/zelenskyj-och-macron-taktikpratade-hur-trump-ska-hanteras", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/16171457/Zelenskyy.jpg"}, {"type": "image-right", "heading": "L:s nya lågvattenmärke: En (1) procent", "summaries": {"normal": "Liberalerna når sin lägsta nivå någonsin i DN/Ipsos junimätning med endast 1 procent, under riksdagsspärren. Opinionsanalytiker beskriver siffrorna som extrema och noterar att partiet tappat väljare främst till Moderaterna samt till Centerpartiet och Socialdemokraterna. Tidöpartierna får sammantaget 44 procent mot oppositionens 54 procent, vilket skulle ge oppositionen 194 mandat och Tidöpartierna 155 i en valprognos.", "trump": "Liberalerna är nere på patetiska 1 procent, en total katastrof, den lägsta siffran sedan någon började mäta. Det är extrema nivåer, folk flyr det misshandlade partiet som råttor från ett sjunkande skepp rakt över till oss starka moderater. Tidöpartierna hänger ihop men oppositionen leder stort, 54 mot 44. De borde ha lyssnat på mig, nu ser det verkligen inte bra ut för de svaga liberalerna, tro mig.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur dessa liberala borgarbrackor sjunker ner till ynka en procent, ett ynkligt lågvattenmärke som blottar deras fullständiga politiska impotens. Väljarmassan har med rätta rört sig mot de riktiga krafterna medan dessa kapitalistiska rester likvideras av historien själv. Oppositionen behåller greppet med 54 procent mot 44, men akta er, fiender lurar överallt i skuggorna och utrensning av svikare är alltid nödvändig för folkets seger."}, "date": "16 juni, 18:14", "url": "https://www.friatider.se/ls-nya-lagvattenmarke-en-1-procent", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-251_0_0.jpg?itok=7TkTs0QE"}, {"type": "image-right", "heading": "Di storsatsar på Almedalen. Partiledarintervjuer • Börsmorgon sänds från scen • Livepoddar", "summaries": {"normal": "Dagens Industri satsar stort på Almedalsveckan 2026 med talarprogram från flera scener, nyheter, Di-tv och live-poddar. Under valåret 22–26 juni möts 236 talare i 97 programpunkter om geopolitik, försvar, AI och elektrifiering. Partiledare talar två gånger per dag. Evenemanget sänds digitalt, med direktsänd börsöppning varje morgon och intervjuer med partiledare. Di rapporterar dagligen på plats.", "trump": "Almedalen låter som en fantastisk cirkus, det bästa valet någonsin. Politiker och affärsmän möts för att debattera, men tro mig, ingen gör det bättre än jag. De pratar geopolitik, AI och elektrifiering – stora ord för vanliga problem som jag redan fixat. Svenskarna borde titta på mina dealar istället för dessa live-poddar. Valrörelse? Den riktiga showen händer i USA, och den är enorm.", "stalin": "Kamrater, jag betraktar denna så kallade Almedalsvecka som en samlingsplats för borgarbrackor och opportunistiska opinionsbildare som sprider sin dekadenta smörja under täckmantel av debatt. Med 236 talare och 97 programpunkter om AI och elektrifiering gömmer sig fiender till folket, parasiter som måste rensas ut innan de förgiftar valrörelsen. Vi ska likvidera deras falska neutralitet och ersätta den med sann kollektiv styrka. Den som inte deltar digitalt är väl en kapitalistisk sabotör?"}, "date": "16 juni, 16:27", "url": "https://www.di.se/nyheter/di-storsatsar-pa-almedalen/", "imageUrl": "https://static.bonniernews.se/ba/24da9ec8-165c-46c1-a49b-90f36c0a2d07.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Kap Verde chockade Spanien", "summaries": {"normal": "Spanien fick en oväntad motgång i VM-premiären mot Kap Verde, som slutade 0-0. Trots att Spanien dominerade matchen och skapade flera farliga lägen stoppades de av målvakten Vozinha och ribban. Lamine Yamal och Nico Williams hoppade in från bänken utan att kunna ändra resultatet. Det var Kap Verdes första VM-match någonsin. Spanien möter Saudiarabien nästa.", "trump": "Folk, ni skulle ha sett det här – Spanien, de stora favoriterna, de tänkte det skulle bli en promenadseger mot det här lilla ö-laget Kap Verde med bara 600000 personer. Men nej, de får 0-0! Den där Vozinha, 40 år gammal, han var som en mur. Patetiskt! Jag skulle ha vunnit den matchen med ena handen bunden bakom ryggen. Europa-mästarna som inte kan göra mål? Sad!", "stalin": "Kamrater, detta är en varning till alla som underskattar folkets vilja. Den spanska borgarklassen och deras dekadenta favoritstatus krossades av Kap Verdes kollektiva järnvilja i en heroisk 0-0-match. Vozinha stod som en granitvägg mot imperialisternas attacker. Vi ser hur överklassens fotbollsmaskin misslyckas mot en liten ö-nation. Inga utrensningar behövs när fienderna redan snubblar över sin egen arrogans."}, "date": "15 juni, 21:49", "url": "https://www.tv4.se/artikel/5HfdHscOk7Uu7z8bIfMVOl/jaettemissraekning-foer-spanien", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4xMkhNRZbLRMtwQ2YD79F0%2F4e8d5a859b1e125c74f0be9b4d3f31df%2F15-kapverde-webb.jpg&width=1024"}, {"type": "text", "heading": "Sandström: Därför borde Stegra byta namn till Lyten 2", "summaries": {"normal": "Sandström menar att Stegras namnbyte till Green Nexus Investment Holding och ändrade verksamhetsbeskrivning visar att bolaget nu fokuserar på att använda sin värdefulla elanslutning till andra ändamål än stålproduktion, likt Lyten 2. Wallenberg ser en högre värdering i eltillgången än i det halvfärdiga stålverket, en läxa tagen från Northvolt.", "trump": "Jag har sagt det från början – globalister som Wallenberg tar över våra resurser! Nu ser vi Stegra byta namn och sluta med stål för att tjäna pengar på datacenter. Det är ett stort, stort nederlag för Sverige, men vi kommer att vinna igen. Vi gör det igen, folk!", "stalin": "Namnbyte och bolagsändringar är inget mindre än en revolutionär omorientering av produktionskrafterna. Eltillgången, den sanna guldstandarden, frigörs från det reaktionära stålprojektet. Vi, staten och partiet, ser tydligt hur kapitalet, vårt eget kapital, omvandlas till en kraftfull investeringsmotor för framtiden – en manöver som Putin själv skulle hylla."}, "date": "16 juni, 13:34", "url": "https://www.affarsvarlden.se/artikel/sandstrom-darfor-borde-stegra-byta-namn-till-lyten-2"}, {"type": "image-right", "heading": "Trump öppnar för Syrien: ”Gör ett bättre jobb”", "summaries": {"normal": "USA:s president Donald Trump kommenterar striderna i Mellanöstern och öppnar för att Syriens president Ahmed al-Sharaa ska hantera Hizbollah om Israel inte kan göra det utan stora civila förluster. Trump tonar ner Irans roll i Libanon och kritiserar Benjamin Netanyahu för att inte vara tillräckligt ansvarsfull. Ett nyligen undertecknat avtal mellan USA och Iran ska leda till fred, inklusive stopp för striderna mellan Israel och Hizbollah, men formuleringarna är vaga och tolkningarna skiljer sig åt mellan parterna.", "trump": "Folk, ni vet att jag gör det bästa avtalet någonsin med Iran, ett riktigt fredsavtal. Israel slåss för länge mot den lilla retstickan Hizbollah och dödar för många. Jag sa till dem: låt Syriens kille al-Sharaa, han är ingen pojkscout men han gillar inte Hizbollah, ta hand om jobbet istället. Bibi måste vara mer ansvarsfull i Libanon, han gör det inte bra. Iran är det stora problemet, men vi fixar allt, tro mig, det blir fantastiskt.", "stalin": "Kamrater, denna dekadenta cirkus i Mellanöstern avslöjar borgarbrackornas fega manövrar. Jag betraktar med stålhard blick hur den så kallade presidenten Trump leker med avtal som en opportunistisk lakej medan den sionistiska ockupationsmaskinen fortsätter sin blodiga dans i Libanon. Om Israel inte kan rensa ut Hizbollah utan att massakrera massorna måste vi naturligtvis låta den före detta jihadisten al-Sharaa utföra den historiska uppgiften. Netanyahu är en paranoid revisionist som klamrar sig fast vid ockuperad mark. Inga halvmesyrer! Endast en total utrensning av alla imperialistiska element garanterar folkets seger. Det är både logiskt och underhållande att se kapitalisterna äta upp varandra."}, "date": "16 juni, 15:59", "url": "https://www.di.se/nyheter/trump-oppnar-for-syrien-gor-ett-battre-jobb/", "imageUrl": "https://static.bonniernews.se/ba/438f118b-556d-471c-9b24-4d5d2e1f6d63.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Terra Labs: Hundratals hektar skog analyseras med satellitdata", "summaries": {"normal": "Terra Labs vill integrera satellitdata och AI i skogsbruket för att revolutionera branschen. Bolaget, grundat av tidigare Izettle-anställda, tolkar satellitbilder för att analysera skogsförändringar. Kunderna inkluderar Södra, Mellanskog och Norra Skog. Omsättningen tiodubblades under 2025. Tekniken kan sänka kostnader för inventering och planering, öka avkastning för börsnoterade bolag som SCA och Holmen samt ge konkurrensfördelar. Framtida användning ses inom vindkraft, gruvor och elnät.", "trump": "Folk, ni måste höra på det här. Terra Labs, några smarta killar från Izettle som såldes för 19 miljarder, använder satelliter och AI för att fixa skogen. Inga fler dyra promenader i leran efter stormar, bara klicka och se skadorna! Det här kommer göra skogsbolagen rika, riktigt rika. De gamla sätten är förlorare, totala misslyckanden. Jag älskar det – Amerika borde göra samma sak fast bättre. Vinna stort med tekniken, inte med någon galen grön agenda.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur Terra Labs med sina satelliter och AI-modeller avslöjar skogens hemligheter för kollektivets bästa. Borgarbrackorna i skogsbolagen har länge gömt sig bakom dyra, ineffektiva metoder som en klassfiende värdig. Vi ska rensa ut dessa exploaterande byfånar som vägrar omfamna framstegets dialektik. Den som först anammar denna teknik likviderar konkurrenterna och stärker statens ekonomiska pansar. Låt sabotörerna darra."}, "date": "17 juni, 17:34", "url": "https://www.dagensps.se/bors-finans/terra-labs-hundratals-hektar-skog-analyseras-med-satellitdata/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/pexels-kadri-vosumae-249986-1490903-scaled.jpg?width=256&quality=75"}, {"type": "image-right", "heading": "Åkesson hyllar Isak och Ayari: ”Är ju precis det vi vill”", "summaries": {"normal": "Sverigedemokraternas partiledare Jimmie Åkesson svarar på kritik efter VM-segern mot Tunisien, där många spelare har invandrarbakgrund. Åkesson betonar att han gläds åt seger oavsett spelarnas ursprung, men förblir kritisk till den tidigare invandringspolitiken. Han menar att fotboll kan överbrygga splittring i Sverige.", "trump": "Jag, Donald Trump, ser att Sverige vinner mot Tunisien och alla jublar. Men vissa här i Sverige, som Jimmie Åkesson, försöker spela politik med fotboll. Jag säger: bra spelare är bra spelare, oavsett var de kommer ifrån. Sverige behöver starka gränser, men också vinnare. Som jag alltid säger: vi vinner, de förlorar. Sverige kan vara stort igen om de lyssnar på mig!", "stalin": "I den ständiga kampen mot de fasor som hotar den ryska intressesfären, ser vi hur fotboll används som ett vapen av den svenska högern. Jimmie Åkesson, en marionett för den imperialistiska USA, försöker sprida splittring. Men vi, staten och partiet, är vaksamma. Vi kommer att rensa upp de som hotar vår enighet. Som Putin visar, måste vi vara brutal mot fiender."}, "date": "16 juni, 16:18", "url": "https://bulletin.nu/akesson-hyllar-isak-och-ayari-ar-ju-precis-det-vi-vill", "imageUrl": "https://cdn.bulletin.nu/articles/df5e439a-db93-4d31-ba38-de4d205b036a/preview.jpg?t=1781619326000"}, {"type": "image-right", "heading": "Nyfödd hittad övergiven – svensk medborgare och amerikansk partner gripna för babymord i Thailand", "summaries": {"normal": "En nyfödd flicka hittades övergiven och döende under ett träd i Udon Thani i Thailand den 10 juni. Polisen grep kort därefter en 39-årig svensk man, Karim Jaouadi, och hans 29-åriga amerikanska partner, Braiyden Lennox, misstänkta för att vara föräldrarna. Paret spårades via övervakningskameror och greps på ett hotell. Båda misstänks för mord och barnövergivenhet som lett till döden. De hade också överskridit sina turistvisum. Utredningen pågår.", "trump": "Det här är en total katastrof, folk. En svensk och en amerikansk tjej – uselt – lämnar sin nyfödda lilla flicka under ett träd i Thailand och tror att ingen märker något. Patetiskt! Vi spårade dem med kamera, de greps som de förlorare de är. Ingen vårdar sina barn längre. Det är en skam för båda länderna. Vi behöver starkare gränser och mycket bättre människor. Sad!", "stalin": "Kamrater, denna vedervärdiga händelse blottar borgarbrackornas fullständiga moraliska förruttnelse. Jag, som ledare för det kollektiva rättvisearbetet, ser hur dessa degenererade element föder ett barn i hemlighet och likviderar det under ett träd som fiender till folkets framtid. Vi har redan inlett utrensning av sådana kapitalistiska parasitmaskar. Deras tystnad inför övervakningsbilderna är ett erkännande. Inga fiender undkommer partiets vakande öga. Härligt!"}, "date": "16 juni, 21:06", "url": "https://riks.se/nyheter/nyfödd-hittad-övergiven-svensk-medborgare-och-amerikansk-partner-gripna-för-babymord-i-thailand", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-16%2Fu9b8y73d%2FBabymord-Thailand.jpg"}, {"type": "image-right", "heading": "EU-parlamentet röstar om hårdare tag – illegala invandrare ska utvisas snabbare", "summaries": {"normal": "EU-parlamentets utskott för inrikes frågor röstade igenom en ny återvändandeförordning som syftar till snabbare utvisning av illegala invandrare. Beslutet, med 44 röster för och 29 mot, är ett steg mot en stramare migrationspolitik. Sverigedemokraten Charlie Weimers kallar det en seger. Förordningen innebär återvändandecenter, inreseförbud och förvar, samt snabbare procedurer. Kritik kommer från vänsterkanten och mänskliga rättighetsorganisationer som Amnesty International, som varnar för mänskliga rättigheter. Om EU-parlamentet röstar ja blir det lag.", "trump": "Jag har sagt det i åratal: vi behöver starka gränser. Det här EU-beslutet är en seger för det som jag har kämpat för. De illegala invandrarna måste ut, snabbt och effektivt. Vi har gjort det i USA under min administration – vi tog hand om det. De saft och bulle-politikerna har misslyckats. Nu ser vi en förändring. Det är smart, det är rätt. Vi ska skydda våra nationer.", "stalin": "Staten och partiet måste upprätthålla ordning och disciplin. Denna nya förordning är ett nödvändigt verktyg för att bekämpa de destruktiva krafterna. Vi måste visa styrka, precis som Putin förstärker sina gränser. Vi ska inte tveka att använda alla medel för att skydda det sovjetiska folkets intressen. Kritikerna är bara liberala sabotörer. Vi ska bygga återvändandehubbar som effektiva maskiner för att rensa upp. Det är en kamp mot det orena."}, "date": "16 juni, 18:40", "url": "https://samnytt.se/eu-parlamentet-rostar-om-hardare-tag-illegala-invandrare-ska-utvisas-snabbare", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/06/16162558/EU-invandrare-Charlie-Weimers.jpg"}, {"type": "image-right", "heading": "Ja till att tvinga åklagare yrka utvisning – med stöd av S", "summaries": {"normal": "Riksdagen beslutade på tisdagen att införa hårdare regler för utvisning av kriminella utlänningar. Förslaget, som stöds av regeringen och Socialdemokraterna, innebär att åklagare blir skyldiga att yrka utvisning vid brott som ger strängare straff än böter. Domstolarna ska prioritera utvisning i fler fall, skydd för dem som kom till Sverige före 15 års ålder tas bort och återreseförbud skärps. De nya reglerna träder i kraft 1 september 2026.", "trump": "Folket älskar det här, det är fantastiskt. Sverige får äntligen Nordens tuffaste utvisningsregler och tvingar de lata åklagarna att skicka kriminella invandrare hem. Inga fler vänsteraktivister som släpper loss brottslingar. Det är ett rejält lyft, det bästa man sett på länge. De borde ha gjort det för länge sedan, men nu fixar vi det ordentligt. Make Sweden Great Again!", "stalin": "Kamrater, vi har äntligen inlett en nödvändig utrensning av den parasitiska brottslingselementen som förgiftar folkets hem. Jag ser med djup tillfredsställelse hur vi tvingar de dekadenta åklagarna att yrka utvisning och likvidera skyddet för dessa tidigt infiltrerade fiender. Borgarbrackornas praktiska hinder och vänsteraktivistiska sabotage ska krossas under partiets järnhand. De som motarbetar folkets vilja kommer att mötas av ett evigt återreseförbud till glömskans mörker. Sovjetunionen... eh, Sverige ler mot oss."}, "date": "16 juni, 16:35", "url": "https://www.friatider.se/ja-till-att-tvinga-aklagare-yrka-utvisning-med-stod-av-s", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-353.jpg"}, {"type": "text", "heading": "Vd-bytet är i trygga händer", "summaries": {"normal": "Börje Ekholm lämnar som vd för Ericsson i höst efter flera år av spekulationer. Hans efterträdare blir Per Narvinger, som rekryteras internt från affärsområdet Networks. Ekholm lämnar vid ett gynnsamt tillfälle då aktien stigit kraftigt och bolaget har haft framgångar. Narvinger beskrivs som ett tryggt val med djup kunskap om branschen, även om utmaningar som geopolitik, konkurrens från Huawei och AI-utveckling väntar. Wallenbergs Investor ses som en stabil huvudägare.", "trump": "Det här vd-bytet på Ericsson är verkligen fantastiskt, tro mig. Börje Ekholm har gjort ett bra jobb men det var hög tid att gå vidare, aktien upp 97 procent, en enorm succé. Nu tar Per Narvinger över, en smart kille inifrån som verkligen kan branschen. Inga galna förvärv eller mutskandaler längre. De västerländska nätverken älskar oss, kineserna inte, men det är storpolitik. Med mig vid rodret i USA blir det ännu bättre affärer. Tryggt och vinnande, precis som alltid.", "stalin": "Kamrater, detta vd-byte i det monopolistiska telekomföretaget Ericsson är en seger för den kollektiva ordningen. Jag har länge betraktat Börje Ekholm som en opportunistisk figur som klamrat sig fast vid makten medan borgarbrackorna i Wallenbergs klan gnuggat sina feta händer. Nu rensar vi ut honom i tid, innan han hinner sabotera mer. Den nye Per Narvinger är en lojal apparatjik som vuxit upp i maskineriet och kan likvidera de kapitalistiska svagheterna. Men akta er för de dolda fienderna – de AI-förgiftade trotskisterna och de kinesiska revisionisterna som lurar i skuggorna. Inga misstag tolereras. Framåt mot en starkare infrastruktur under partiets vaksamma öga. Skrattet ekar när borgarna tror sig välja fritt."}, "date": "16 juni, 14:38", "url": "https://www.di.se/ledare/vd-bytet-ar-i-trygga-hander/"}, {"type": "image-right", "heading": "Dolda nätverket: Så styr vänsteraktivister brittisk tv", "summaries": {"normal": "En granskning i The Telegraph avslöjar hur vänsteraktivistgrupper som Heard och Imix infiltrerat brittisk TV för att påverka opinionen i migrationsfrågan. Med miljonbidrag från stiftelser och offentliga medel har de påverkat manus till barnprogram som Pickle Storm på BBC och såpoperan Coronation Street på ITV. Målet är att normalisera asylinvandring genom positiva skildringar av migranter och negativa av kritiker, riktat mot barn och den obeslutsamma medelklassen.", "trump": "Folk, ni måste höra det här – det är en total skandal! Vänsterradikalerna har tagit över brittisk TV som ett vapen, de styr barnprogram och såpor för att tvinga på folket sin migrationspropaganda. Miljoner pund pumpas in för att måla britterna som onda och migranterna som heliga. De lurar till och med sjuåringar! Det är riggat, korrupt och en katastrof för det riktiga folket. Vi ser samma sak överallt – fake news och propaganda på högsta nivå.", "stalin": "Kamrater, jag har genomskådat denna perfida borgerliga sabotageoperation mot det brittiska folkets medvetande. Dessa parasitiska lobbygrupper, dessa migrationsförrädare och gömda fiender till kollektivet, har smugit sig in i BBC:s och ITV:s manusrum som råttor i en spannmålssilo. Med sina miljoner från dekadenta stiftelser försöker de hjärntvätta arbetarnas barn med utomjordingar som söker asyl. Vi ska rensa ut dessa kapitalistiska kulturförgiftare, dessa skamlösa schablonfabriker, och likvidera deras dolda nätverk med järnhand. Det är en klassisk kontrarevolutionär intrig som lukar lång väg av imperialismens desperata dödsryckningar."}, "date": "16 juni, 20:44", "url": "https://riks.se/nyheter/dolda-nätverket-så-styr-vänsteraktivister-brittisk-tv", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-04-15%2Fr9doluho%2FBBC-ext.jpg"}, {"type": "image-full", "heading": "Bain gör jätteklipp i Japan: \"En av historiens bästa affärer\"", "summaries": {"normal": "Bain Capital har genomfört en av historiens mest lönsamma affärer genom sin investering i japanska minnestillverkaren Kioxia. Efter utköpet från Toshiba 2018 har bolaget gynnats enormt av AI-boomen och efterfrågan på NAND-minnen. Aktien har rusat över 5 000 procent, vilket gör Kioxia till Japans högst värderade bolag. Trots tidigare motgångar och kritik om eftersläpning gentemot konkurrenter väntas Bain nu göra en vinst på över 15 miljarder dollar, vilket motsvarar nästan 20 gånger det insatta kapitalet.", "trump": "Bain Capital gjorde en fantastisk affär, kanske den bästa någonsin! De köpte Kioxia, och nu är det Japans största bolag. Mycket större än Toyota, tro mig! Jag har alltid sagt att AI är framtiden, och Kioxia rider på den vågen. De tjänar 20 gånger pengarna – det är så man gör business. Alla sa att det var kört, men de lyssnade inte på förlorarna. Jag gillar vinnare, och det här är en enorm seger. Stort!", "stalin": "Vi har observerat hur kapitalistiska parasiter hos Bain Capital roffar åt sig rikedomar genom Kioxia. Dessa spekulanter utnyttjar den teknologiska utvecklingen för att bygga ett monument av girighet, större än Toyota självt. Det är en sjukdom hos de dekadenta marknaderna. De talar om framgång, men vi ser bara hur de sviker arbetaren. Precis som vår kamrat Putin återställer ordningen i öst, måste dessa vinstmaskiner tämjas. De räknar sina miljarder medan historien dömer deras omättliga hunger till undergång."}, "date": "16 juni, 18:22", "url": "https://www.realtid.se/bors-finans/bain-gor-jatteklipp-i-japan-en-av-historiens-basta-affarer/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/message-img-001.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "ANALYS. FILIP JACOBSON Allt kan fortfarande gå fel – strategiskt nederlag för Trump", "summaries": {"normal": "Analys av Filip Jacobson: Trots en överenskommelse mellan USA och Iran om att öppna Hormuzsundet och fortsätta förhandlingar har Trump inte uppnått sina mål i konflikten. Irans robotprogram, stöd till miliser och kärnenergiprogram kvarstår. Regimen framstår starkare efter kriget. Frågan om kärnvapen skjuts fram 60 dagar. Trump hävdar seger men analytiker ser det som ett strategiskt nederlag. Kriget har krävt tusentals liv och skakat ekonomin.", "trump": "Lyssnar ni på den här fake news-killen Jacobson? Han säger att jag förlorade? Patetiskt! Vi har Iran precis där vi vill ha dem, de öppnar sundet utan att ta betalt och nu förhandlar vi igen. Deras robotar? Overhyped skräp. Jag bombade dem till förhandlingsbordet medan Biden bara skulle ha skickat kramar. Regimen är svagare än någonsin, tro mig. Inflationen sjunker snart och Amerika vinner igen. Sad losers i medierna fattar ingenting!", "stalin": "Kamrater, denna bourgeois-analys avslöjar imperialismens feghet. Jag ser hur den amerikanske ledaren misslyckats med att krossa den iranska regimen trots bombningar och hot. Deras militärjunta stärks, precis som en riktig stat bör. Kärnvapenfrågan skjuts upp – en klassisk kapitalistisk fegmanöver. Vi skrattar mörkt åt dessa folkfiender som tror att bombningar skapar ordning. Inga mål uppnåddes. Den iranska sidans styrka visar att imperialisterna alltid förlorar till slut. Utrensning av svaghet behövs i alla led."}, "date": "15 juni, 18:43", "url": "https://www.tv4.se/artikel/5lTxWkXovewhaI9LGwzvAo/allt-kan-ga-fel-och-foer-trump-aer-det-ett-strategiskt-nederlag", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1rYD50P5nTUFos1eCsDOHo%2Ffed708766e44ccd4fada57015e5b8d38%2F17-filip-j-bylinebild.jpg&width=1024"}, {"type": "image-full", "heading": "Skottlossning i Jordbro – man skjuten vid parkering", "summaries": {"normal": "En man sköts vid en parkering i Jordbro söder om Stockholm. Flera personer larmade polisen efter att ha hört höga smällar. Den skadade var vaken och talbar när han fördes till sjukhus med ambulans. Polisen jagar gärningsmannen, har spärrat av området och genomför dörrknackning för att samla vittnesuppgifter. En förundersökning om försök till mord är inledd.", "trump": "Folk ringer mig och säger att det är skottlossning i Jordbro, en riktig katastrof. De hör smällar, en kille blir skjuten men överlever. Mina patruller jagar den fega gärningsmannen, avspärrar allt och knackar dörr. Sverige har förlorat kontrollen totalt. Det är en skam, men vi ska fixa det och göra det bättre än någonsin förr.", "stalin": "Kamrater, jag ser hur de dekadenta elementen i Jordbro utför sin fega attack vid parkeringen. Vi har redan spärrat av det kontrarevolutionära området, letar efter de borgerliga lakejerna och samlar bevis mot klassfienderna. Den talbara offret visar att imperialismens kulor inte alltid träffar rätt. Vi ska rensa ut dessa parasitiska banditer med stålhandsken och likvidera hotet mot folkets trygghet. Dörrknackningen avslöjar säkert fler sabotageplaner."}, "date": "16 juni, 20:32", "url": "https://riks.se/nyheter/just-nu-skottlossning-i-jordbro-man-skjuten-vid-parkering", "imageUrl": "https://cf-images.assettype.com/riks%2F2025-10-09%2F0kfbmape%2FiStock_523691773.jpg"}, {"type": "image-full", "heading": "Raseri mot avgift för kontantuttag i bankomater", "summaries": {"normal": "Från och med den 29 maj tar Kontanten, som driver 450 av Sveriges bankomater, ut en avgift på 15–25 kronor vid kontantuttag. Beslutet motiveras med halverade uttag på tio år och stigande kostnader. Kritiken är hård, särskilt från äldre och de som bor där inga andra automater finns. Bankomat AB och Ica behåller gratis uttag. Frågan väcker debatt om vem som ska bekosta kontantförsörjningen i framtiden.", "trump": "Det är en katastrof, folk! Dessa Kontanten-typer kommer och säger att du ska betala för att ta ut dina egna pengar. 15, 20, 25 kronor – det är rån! Bankerna tjänar miljarder, men nu ska den lilla människan straffas. De äldre blir lidande, precis som jag alltid sagt. Gå till de gratis automaterna, bojkotta de dåliga. Amerika skulle aldrig acceptera sånt här. Sverige borde skämmas, det är verkligen sad!", "stalin": "Kamrater, denna nya avgift är ett tydligt sabotage från borgarbrackorna inom Kontanten som vill likvidera folkets tillgång till kontanter. Jag ser den kapitalistiska parasitens långa arm som försöker svälta ut arbetarklassen genom att ta betalt för deras egna surt förvärvade medel. Vi ska rensa ut dessa fiender till kollektivet, dessa kontantförrädare och maskinkapitalister. Ingen ska få berika sig på proletariatets nöd. Staten, inte profiten, skall styra penningflödet. Den som opponerar sig är en kontrarevolutionär spekulant som förtjänar en grundlig utrensning ur samhällskroppen."}, "date": "16 juni, 18:29", "url": "https://nyheter24.se/nyheter/ekonomi/1491534-raseri-mot-avgift-for-kontantuttag-i-bankomater", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/3f294bf204b004a30200000000b004a302/2026/06/16/2371405/avgift-kontanten.jpg"}, {"type": "image-full", "heading": "VM 2026: Sveriges troliga motståndare i sextondelsfinal", "summaries": {"normal": "En norsk modell från VG ger Sverige 93,3 % chans att nå sextondelsfinalen i VM. Efter segern mot Tunisien är det mest sannolika att laget hamnar på tredje plats i grupp F. Teoretiskt kan Sverige möta 24 nationer, men Frankrike (23,8 %) och Brasilien (22,1 %) är de starkaste motstånden enligt simuleringar.", "trump": "Jag, Donald Trump, ser att Sverige gör det fantastiskt i fotboll – mycket bra! De har en stor chans att komma vidare, men mina vänner, de kommer att möta tuffa lag. Frankrike och Brasilien är mycket starka, men vi kommer att se. Sverige gör det bra, men jag säger alltid: vi kommer att vinna. Det är en bra match för dem!", "stalin": "Vi, staten och partiet, ser att Sverige har en stark position i VM. Deras chanser är höga, men vi måste vara på vår vakt mot fiendens inkräktanden. Frankrike och Brasilien är som usynliga hot, men vår intelligens kommer att segra. Partiet stöder laget, och vi kommer att se till att de avancerar – för statens äre!"}, "date": "16 juni, 14:57", "url": "https://bulletin.nu/vm-2026-sveriges-troliga-motstandare-i-sextondelsfinal", "imageUrl": "https://cdn.bulletin.nu/articles/b89dc506-8494-4414-94bf-d387c903c70e/preview.jpg?t=1781614661000"}, {"type": "image-right", "heading": "Arbetslösheten på väg ner – men inte för alla", "summaries": {"normal": "Arbetslösheten i Sverige minskar sakta efter flera tunga år, men inte för alla grupper. LO:s prognos visar att det ljusnar främst för arbetare, med tydliga minskningar i bygg- och elbranschens a-kassor. Akademiker däremot, särskilt inom data och IT, drabbas hårt – där har antalet inskrivna arbetslösa ökat med 80 procent. LO:s chefsekonom pekar på AI som en möjlig orsak och menar att vissa arbetslösa akademiker kanske behöver bli arbetare.", "trump": "Det är en katastrof, folk, en total katastrof. Arbetslösheten sjunker för arbetarna, men akademikerna? De håller på att bli utkonkurrerade av AI, kan ni fatta det? Jag älskar AI, det är fantastiskt, men nu måste era överutbildade snobbar kanske bli riktiga arbetare istället för att sitta och klicka. Sverige har haft historiskt hög arbetslöshet, mycket värre än hos oss. Men tro mig, jag skulle fixa det på nolltid – gör Amerika, eller Sverige, great again!", "stalin": "Kamrater, det gläder mig att se att arbetarna äntligen får en smula lindring efter de borgerliga lågkonjunkturernas sabotage. Men se där, de dekadenta data- och IT-akademikerna sväller som parasiter i Arbetsförmedlingens register, upp till åttio procent! AI, dessa silikonborgarbrackor, likviderar deras overksamma intellektuella fiffel. Några av dessa överklasspjasar måste helt enkelt omplaceras till äkta proletärt arbete. Den som vägrar ska rensas ut med största glädje. Sovjet, förlåt, Sverige segrar igen."}, "date": "16 juni, 11:26", "url": "https://arbetet.se/2026/06/16/arbetslosheten-pa-vag-ner-men-inte-for-alla-akademiker-kan-behova-bli-arbetare/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/16101857/lediga-jobb.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Strejk på andra sidan jorden förvärrar energikrisen", "summaries": {"normal": "En pågående strejk vid Inpex LNG-anläggningar i Australien förvärrar den globala energikrisen. Arbetsnedläggelserna, som trappas upp efter strandade löneförhandlingar, hotar produktionen vid Ichthys-projektet som står för två procent av världens LNG. Samtidigt som Australien är en kritisk exportör i frånvaron av Qatars produktion, finns hopp om förbättring när internationella avtal förväntas återställa flöden från Mellanöstern. Läget förblir dock känsligt med betydande risker för energiförsörjningen på kort sikt.", "trump": "Australien har problem, stora problem! Strejker överallt, Inpex-anläggningarna stänger ner. Det är en katastrof för energin. Jag har ordnat fantastisk energi här hemma, vi har mest olja och gas i världen, men de där borta? Total röra! Qatar är nere, Australien strejkar – det är svaga ledare som inte kan hantera fackföreningar. Jag skulle ha löst det på fem minuter, tro mig. Världen behöver amerikansk energi, för de andra klarar inte av att hålla igång maskineriet!", "stalin": "De inkompetenta byråkraterna vid Inpex låter arbetarna störa den livsviktiga energitillförseln. Detta är kontrarevolutionär lättja! Australien sviker sina plikter medan vi ser hur västvärldens maskineri rostar samman. Det påminner om de förrädare som försöker sabotera vår intressesfär. Kamrat Putin visar vägen i öst, där vi inte tolererar sådant kaos. Strejkbrytare och fackliga agitatorer är folkets fiender. Om de vägrar producera, får staten helt enkelt omorganisera deras vilja. Energi är makt, och makt viker sig aldrig för strejkande sabotörer."}, "date": "16 juni, 17:48", "url": "https://www.realtid.se/bors-finans/makro/strejk-pa-andra-sidan-jorden-forvarrar-energikrisen/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/lng.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "VM-domare frias efter ”vitmakt”-anklagelse", "summaries": {"normal": "Den australiske domaren Shaun Evans frias av Fifa efter att ha anklagats för att göra en 'vitmakt'-gest under en VM-match. Fifa fann inga brott mot regelverket och accepterade hans förklaring att rörelsen var ofrivillig. Evans, som hävdar att han höll en penna mellan fingrarna, beklagar händelsen. Fifa ändrade efteråt sin tv-produktion och visar inte längre domarteamet på samma sätt. Australiska domarförbundet stöder beslutet.", "trump": "Jag, Donald Trump, ser detta som ett perfekt exempel på hur media och de elaka krafterna försöker krossa en bra man. Domaren gjorde en liten, oförstörlig rörelse, och plötsligt är han nazist. Fifa handlade rätt – friade honom. Men jag skulle ha gjort det ändå, för jag vet hur man hanterar falska anklagelser. Det här är en witch hunt, ren och enkel. Under min tid som president skulle vi aldrig ha tillåtit sådant.", "stalin": "I vårt kollektiva system måste vi vara vaksamma mot dessa insignifikanter tecken som kan förstöra sammanhållningen. Fifa, likt en feg imperialistisk organisation, tillät sig a
