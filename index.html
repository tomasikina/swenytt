a en storskalig utrensning av reaktiva element, likvidera underhållsbristen och med järnhand driva fram en proletär, proaktiv klimatanpassning. De som tvekar är fiender till folket och ska rensas ut med ett leende."}, "date": "15 juli, 07:05", "url": "https://www.svt.se/nyheter/inrikes/experter-svensk-jarnvag-daligt-rustad-for-extremvader", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.25/0.58/1422816e887ff263e9991945913c7bf3b7af7b9f9eb5fbcadae8dcb5a2cd1e11"}, {"type": "image-right", "heading": "Trumps dilemma: Fler soldater krävs för att hålla Hormuz öppet", "summaries": {"normal": "USA:s president Donald Trump har misslyckats med att tvinga Iran att öppna Hormuzsundet trots flyganfall, blockader och hot. Militära experter bedömer att en stor insats med både marktrupper och fler krigsfartyg krävs för att säkra trafiken i den strategiskt viktiga oljefarleden. En sådan operation skulle bli mycket dyr, kräva tiotusentals soldater under flera månader och troligen leda till betydande amerikanska förluster, vilket är impopulärt bland den krigströtta befolkningen.", "trump": "Folket, det är ett totalt fiasko. Jag sa att Hormuzsundet ska vara öppet, med eller utan Iran, och det blir det också, tro mig. Men de där iranierna har förberett sig i fyrtio år som riktiga lurendrejare. Nu kräver de att jag skickar tiotusentals soldater och halva flottan dit. Det blir dyrt och folk kommer att dö, fast det är deras fel. Vi gör det stort, vi gör det vinnande, men de borde ha lyssnat från början.", "stalin": "Kamrater och partivänner, denna imperialistiska fars är ett ypperligt exempel på hur den dekadenta borgarklassen i Washington famlar i mörkret som rädda råttor. Jag, som ledare för det oövervinnerliga kollektivet, ser hur fiendens asymmetriska sabotage och utspridda vapenfabriker tvingar fram en massiv utrensning med markstyrkor. Tiotusentals kapitalistsoldater skall offras i detta meningslösa blodbad medan höga oljepriser väcker missnöje bland de egna massorna. Vilken underbar, tragikomisk kapitulation av den sjuka amerikanska krigsmaskinen."}, "date": "15 juli, 06:59", "url": "https://www.svt.se/nyheter/utrikes/trumps-dilemma-fler-soldater-kravs-i-hormuz", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.53/0.35/7c19a1f2b2d03fd3658117a079e6351e0a0b9451d3b88ccb330b98af168f5228"}, {"type": "image-right", "heading": "Därför sover vi så dåligt just nu", "summaries": {"normal": "Forskning visar att värmen gör att vi somnar senare och vaknar tidigare, vilket leder till förlorad sömn. Enligt sömnforskaren Christian Benedict tappar vi i genomsnitt 50 timmar per år på grund av värmeböljor. Över 20 grader på natten gör sömnen fragmenterad. Kvinnor och äldre är extra känsliga. Forskare efterlyser samhällsåtgärder som mer grönska och bättre byggmaterial för att skydda sömnen i en varmare värld. Tips ges för att sova bättre i värmen.", "trump": "Folk sover uselt för att det är så varmt om nätterna, precis som jag alltid sagt. Vi förlorar 50 timmar sömn per år på grund av de här värmeböljorna, och det är en katastrof för energinivåerna. De radikala miljöaktivisterna med sina gröna drömmar har ingen aning, men jag fixar det. Vi behöver smarta lösningar, inte woke-kvoter eller någon global sovkommission. Ta en varm dusch, drick vatten och skippa vinet – enkelt! Ingen gör det bättre än mig.", "stalin": "Kamrater, jag ser hur den borgerliga värmen saboterar arbetarnas vila och splittrar den kollektiva viljan. Våra kroppar vägrar sova när kapitalistmaffians asfalt och betong behåller värmen som klassfiendens lögn. Vi förlorar femtio timmar per år till dessa folkförtryckartroll. Jag kräver omedelbar utrensning av alla svaga material och en global sovkommission under statens järnhand. Den som sover naken riskerar underkylning – en fiende inom oss själva. Sov för revolutionen."}, "date": "14 juli, 22:08", "url": "https://www.tv4.se/artikel/tt-260714-somn1-b50eb3b9/darfor-sover-vi-sa-daligt-just-nu", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlH9Z2NTXd4Mg%2F767cd33ee13c72afe5902db0ed8abc8a%2FVarmen_far_oss_att_somna_senare_och_vakna_tidigare__visar_forskning.&width=120"}, {"type": "image-full", "heading": "Glömde anteckningar på toppmöte i Turkiet", "summaries": {"normal": "Sveriges nationella säkerhetsrådgivare Niclas Kvarnström glömde en anteckningsbok under ett Natomöte i Ankara. Regeringskansliet bekräftar händelsen men uppger att boken inte innehöll säkerhetsskyddsklassificerad information. Omständigheterna kring vem som funnit boken och om utländsk makt tagit del av innehållet är oklara. Händelsen sker mot en bakgrund av tidigare säkerhetsmissar inom Regeringskansliet, där tidigare rådgivare avgått efter liknande incidenter eller kontroverser.", "trump": "Sverige har det tufft, mina vänner! Deras säkerhetsrådgivare tappade bort en anteckningsbok i Turkiet. En total katastrof! De säger att det inte var viktigt, men vem vet? Kanske var det stora hemligheter? Det är en förlorarkultur där borta. Först han, sen han, hela tiden avgångar. Inte som min administration – vi är perfekta, vi tappar ingenting, vi vinner hela tiden. Sverige borde ringa mig för att lära sig hur man sköter säkerhet ordentligt. Väldigt låg energi!", "stalin": "Vilket patetiskt skådespel! En svensk 'säkerhetsrådgivare' slarvar bort sin anteckningsbok som om det vore en inköpslista. Det luktar av inkompetens och borgerlig dekadens. Att de ens tillåts leka stormakt vid Natos bord är ett hån mot historien. Om en rysk tjänsteman visade sådan brist på disciplin skulle vi snabbt hitta en plats för honom i de kalla skogarna. Vår store ledare Putin ser detta förfall och ler – västvärlden är en pappersdrake som håller på att rämna inifrån."}, "date": "15 juli, 07:43", "url": "https://www.aftonbladet.se/nyheter/a/9p8Qop/sakerhetsradgivaren-glomde-anteckningsbok-pa-nato-mote", "imageUrl": "https://akamai.vgc.no/v2/images/861b0613-de5d-3bdf-b0f4-9d0e20ce8ada?fit=crop&format=auto&w=1440&s=114a019154031a754a913e03b370759efa5b3199"}, {"type": "image-right", "heading": "Bemöter VM-kaoset: ”Jag var i total chock”", "summaries": {"normal": "Folarin Balogun fick rött kort i VM-matchen mot Bosnien och Hercegovina men avstängningen sköts upp efter att USA:s president Donald Trump kontaktat Fifas Gianni Infantino. Balogun uttrycker chock över det röda kortet och medger att kontroversen skapade oro i laget inför matchen mot Belgien, som USA förlorade med 4-1. Beslutet har väckt frågor om politisk påverkan på fotbollens integritet.", "trump": "Hörni, det var ett totalt skämt det där röda kortet mot Balogun, en fantastisk kille förresten. Jag ringde Infantino och sa fixa det här, för det var riggat från början. Nu gnäller alla svaga snuskgubbar om integritet. Typiskt de där förlorarna som hatar att Amerika vinner stort. Balogun var i chock, laget blev nervöst – men vi gör alltid det som är rätt. Fake outrage från mediaklicken!", "stalin": "Kamrater, detta futtiga fotbollsdrama avslöjar borgarbrackornas fega spel. Jag såg till att den oacceptabla utvisningen mot den proletära anfallaren Balogun omedelbart korrigerades genom lämpliga samtal. Reaktionärernas hysteriska skrik om så kallad integritet är bara klassfiendens vanliga parasitgnäll. Lagkamraternas nerver var ett hinder skapat av folkförtryckartrollen. Sådana element måste rensas ut ur sportens kollektiv."}, "date": "14 juli, 19:10", "url": "https://www.tv4.se/artikel/5yf7UJ6LJMppqF1B7nmgLO/bemoeter-nu-vm-kaos-jag-var-i-total-chock", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F79yWIdcfTab5mUQA3450Yy%2Ffe6b66f696291b29e4c4dc16426138db%2FFolarin-Balogun.jpg&width=120"}, {"type": "image-right", "heading": "Nu slår supervärmen till – men stort väderomslag till helgen", "summaries": {"normal": "SMHI varnar för en värmebölja med temperaturer på 30 grader eller mer i nordöstra Götaland och södra Svealand under onsdag till fredag. Maxtemperaturerna kan nå 32–34 grader på torsdagen. Nätterna blir svalare än vid tidigare värmeböljor, vilket minskar riskerna. På fredagen väntas ostadigare väder och ett abrupt temperaturfall med cirka 10 grader till helgen. Folk uppmanas att dricka vatten och ta det lugnt.", "trump": "Folk, vi har en jättevärme som slår till, de säger 30–34 grader, det är galet varmt, men tro mig, det är inget mot vad vi hade under min förra mandatperiod. Biden vände upp och ner på allt väder också. Nu kommer ett abrupt slut i helgen, precis som hans katastrofala politik. Drick vatten, ta det lugnt – och glöm inte att de gröna galningarna skyller allt på klimatkrisen medan de flyger runt i privata jetplan. Patetiskt!", "stalin": "Kamrater, jag ser hur borgarbrackornas värmebölja hotar arbetarkollektivet med sina 34-gradiga imperialistiska strålar. Vi ska likvidera faran genom att dricka sovjetiskt vatten och vila strategiskt under natten. Dessa folkfiender som kallar det väderomslag är bara klassfiendens väderterror. På fredag skall vädret rensas ut med tio graders proletär kyla. Inga svagheter tolereras i statens värmekampanj."}, "date": "14 juli, 18:55", "url": "https://www.tv4.se/artikel/a49VkRpt9vh24Hbjue2N7/gul-varning-foer-vaerme-men-da-drar-ostadigare-vaeder-in", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F76qHiitGjmlo69TL7F9bCz%2F11784d5438a83932ddbdb5cec2aab964%2Fvarme_ny_webb.jpg&width=120"}, {"type": "image-right", "heading": "Sluta behandla Kinas diktatur som en normal stat", "summaries": {"normal": "Debattörer kritiserar Sveriges regering för att ha tagit emot Kinas utrikesminister Wang Yi strax efter att Kinas nya enhetslag trädde i kraft. Lagen ses som ett verktyg för tvångsassimilering av etniska minoriteter som tibetaner och uigurer, bland annat genom att skilja barn från föräldrar och placera dem i statliga internatskolor. Artikeln lyfter fram kontrasten till en tibetansk aktivists självbränning i protest, samt fall som den fängslade svenske förläggaren Gui Minhai. Författarna kräver att Sverige offentligt ska kräva lagens upphävande och stopp för övergreppen.", "trump": "Titta på det här, det är en total skandal. Sverige tar emot den kinesiske ministern precis när de nya lagen kommer som krossar tibetaner och uigurer, och så sitter den stackars svenske killen Gui Minhai fängslad i åtta år utan ett ljud. Patetiskt. De pratar om mänskliga rättigheter men böjer sig som svaga ledare för diktaturen i Peking. Sverige borde ha kastat ut honom och krävt att lagen rivs upp omedelbart. Svaga regeringar, väldigt svaga. Amerika skulle aldrig acceptera sånt här fiffel.", "stalin": "Kamrater, denna borgarbracka till svensk regering välkomnar fienden Wang Yi just som vi i partiet skulle ha genomfört en fullständig utrensning av splittrande element. Denna så kallade enhetslag är ett ypperligt redskap för att forma lojala medborgare ur de vilsna minoriteterna, men de västerländska parasiterna skriker som råttor i en brinnande spann. Den tibetanske självbrännaren är en tragisk produkt av imperialistisk hjärntvätt, medan den gömde svenske spionen Gui Minhai sitter där han hör hemma. Vi ler mörkt åt deras hyckleri. Sluta leka demokrati och erkänn att endast en stark ledning kan rensa ut alla fiender till folkets enhet. Annars likviderar historien er alla."}, "date": "12 juli, 18:28", "url": "https://www.dagensarena.se/opinion/sluta-behandla-kinas-diktatur-som-en-normal-stat", "imageUrl": "https://www.dagensarena.se/files/2026/07/kina-besok.jpeg"}, {"type": "text", "heading": "Uppgifter: För samtal om irak-syrisk oljeledning", "summaries": {"normal": "Efter att Donald Trump avstått från att införa avgift på trafiken genom Hormuzsundet uppges USA nu föra samtal om att återuppliva en nedlagd oljeledning från Irak till Syriens västkust. Syftet är att kringgå det kritiska sundet. Samtalen inkluderar företrädare från båda länderna samt bolag som Chevron. Trump träffade nyligen Iraks premiärminister och lovade nya oljepartnerskap. Spänningarna i Mellanöstern har ökat intresset för alternativa transportvägar. Oljepriset ligger kvar runt 85 dollar per fat.", "trump": "Folket, det är fantastiskt. Jag slopade den där dumma avgiften på Hormuzsundet och nu fixar vi en strålande oljeledning från Irak till Syrien. Inga fler problem med det farliga sundet. Jag träffade Iraks premiärminister och vi ska annonsera massiva, verkligen massiva oljeaffärer redan denna eller nästa vecka. Det blir enormt. De gamla ledningarna är perfekta. Oljan flyter, pengarna rullar in och fienderna står där med sina tomma hot. Ingen gör det bättre än oss.", "stalin": "Kamrater, borgarbrackorna och deras oljeimperialister skakar i sina skor efter de senaste spänningarna i Mellanöstern. Jag har beordrat att den nedlagda ledningen från Irak till Syriens västkust genast skall återupplivas som ett kollektivt verktyg mot fiendens blockadhot. Den kapitalistiska sundet-passagen är en parasit som vi nu krossar med stål och proletär planekonomi. Våra samtal med irakiska kamrater och oljebolag skall rensa ut alla sabotageförsök. Den som drömmer om att hindra oss skall snart känna den historiska utrensningens kalla hand. Oljepriset förblir stabilt under partiets järnkontroll. Segraren ler i skuggorna."}, "date": "14 juli, 22:36", "url": "https://www.di.se/nyheter/uppgifter-usa-i-samtal-om-irak-syrisk-oljeledning/"}, {"type": "image-right", "heading": "USA har återupptagit blockader i Hormuz", "summaries": {"normal": "USA har återupptagit blockader i Hormuzsundet enligt Centcom. Amerikanska styrkor genomför nya anfall mot Iran som ska orsaka stora förluster och skydda sjöfarten. Explosioner rapporteras vid iranska ön Qeshm, och Kuwait har skjutit ned inkommande projektiler. Iran har svarat med attacker mot Bahrain, Jordanien och fartyg i området. Ett norskt fartyg och två Emirati-oljetankrar har träffats. Trump har backat från planerad avgift i sundet och fokuserar istället på handelsavtal. Oljepriset har stigit till drygt 85 dollar per fat.", "trump": "Vi har de bästa örlogsfartygen och flygplanen i Mellanöstern, ingen gör det bättre än oss. Iran får stora problem nu när vi slår till hårt mot deras förmåga att attackera oskyldiga. De skjuter mot våra baser men vi stoppar dem alla. Jag pratade med kungarna och emirererna och skippade den dumma avgiften i Hormuz. Nu gör vi istället fantastiska handelsavtal med Gulfstaterna. Oljepriset går upp, men det är bra för oss. Amerika är åter starkt.", "stalin": "Kamrater, jag ser hur de dekadenta borgarbrackorna i Washington och Teheran leker sin farliga imperialism i Hormuzsundet medan arbetarna lider. Vi har redan identifierat dessa kontrarevolutionära element som försöker störa den fredliga sjöfarten. Våra vaksamma kamrater i luften och till sjöss likviderar effektivt varje provokation. Explosionerna på Qeshm är bara början på utrensningen av dessa paranoida kapitalister. Kuwait gör rätt i att skjuta ner deras lögnaktiga projektiler. Snart ska vi rensa ut alla som hotar det kollektiva intresset och skratta medan deras oljeimperier kollapsar under sin egen girighet."}, "date": "14 juli, 22:32", "url": "https://www.di.se/nyheter/usa-har-aterupptagit-blockader-i-hormuz/", "imageUrl": "https://static.bonniernews.se/ba/6bccd408-ad53-4616-bcaa-91120c5663aa.jpeg?crop=6000%2C3000%2Cx0%2Cy500&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Wedin (M) skräms med att bo nära invandrare", "summaries": {"normal": "Aftonbladets ledarsida kritiserar Moderaterna för att använda rasistisk retorik gällande bostadspolitik. Artikeln belyser hur Moderata politiker, som Dennis Wedin, varnar för 'folkblandning' och minskade bostadsvärden vid blandad bebyggelse. Detta kritiseras även från högerhåll, bland annat av Timbros chefsekonom Fredrik Kopsch. Ledarsidan menar att Moderaterna anpassar sig till Sverigedemokraternas språkbruk för att vinna politiska poäng, och drar paralleller till Olof Palmes resonemang om hur fördomar frodas i osäkra tider.", "trump": "Moderaterna i Sverige, fantastiska människor, de fattar grejen! De säger som det är: folk vill inte ha sin egendom förstörd. Men de där liberala medierna, som Aftonbladet, attackerar dem för att de skyddar sina hem. Det är en total häxjakt! De kallar det 'rasism', jag kallar det sund förnuft. Om du vill ha en stad som fungerar, måste du vara tuff. De här politikerna, som Wedin, de gör vad som krävs. Mycket smart. Ingen vill ha stök, tro mig!", "stalin": "Vi har observerat hur de borgerliga marionetterna i Sverige kämpar med sina interna motsättningar. Moderaterna försöker desperat klamra sig fast vid makten genom att appellera till folkets lägsta instinkter om egendom och rädsla. Det är en ynklig uppvisning. Som när mina ryska efterföljare i öst bygger murar mot västs dekadens, använder dessa småpåvar rasism som ett verktyg för att kontrollera massorna. De är alla parasiter som förtjänar att rensas ut ur historiens arkiv. Vi har sett dessa 'demokratiska' teatrar förut. De är dömda."}, "date": "15 juli, 06:00", "url": "https://www.aftonbladet.se/ledare/a/0pWz5E/moderaten-skrams-med-att-bo-nara-en-invandrare", "imageUrl": "https://akamai.vgc.no/v2/images/c17168a5-7515-3def-90e6-48a2241f1aa2?fit=crop&format=auto&w=1440&s=f565fc3576eddb45cb5db558e84aaa9d446279e8"}, {"type": "image-full", "heading": "Hökmark: Sverige bör leda ny frihandelspakt", "summaries": {"normal": "Gunnar Hökmark, ordförande för tankesmedjan Frivärld, föreslår att Sverige bör leda en ny frihandelsallians mellan EU och CPTPP, ett handelsavtal mellan tolv Stillahavsländer. Han menar att detta skulle skapa världens största frihandelsområde och motverka Kinas och USA:s protektionism. Hökmark betonar vikten av gemensamma spelregler för AI, cybersäkerhet och digital handel samt minskade beroenden av auktoritära regimer. Utmaningar som olika regelverk nämns, men han anser att integration bör prioriteras.", "trump": "Lyssna här, Sverige – ni har en chans att bli STORA! Jag säger alltid, handel är bra, men BRA handel är ännu bättre. Hökmark, smart kille, vill att EU och CPTPP slår sig ihop. Smart! Kina? De fuskar. USA? Vi är upptagna med att vinna. Men Sverige – ni kan leda! Skapa jobb, stoppa fuskarna, och gör Europa STORT igen. Och vet ni vad? Om ni gör det rätt, kanske vi till och med ansluter oss. Men bara om det är WINNING!", "stalin": "Kamrater, fienderna av den socialistiska världsordningen kryper fram som råttor ur sina hål. Dessa så kallade 'demokratier' med sina 'öppna ekonomier' försöker nu bygga en handelsmur mot våra progressiva allierade i Kina. Men se – en av deras egna, Hökmark, föreslår en allians mellan EU och Stillahavets lydstater. Vi måste agera! Låt dem tro att de bygger en mur, medan vi i hemlighet kontrollerar tegelstenarna. Deras 'innovation' och 'cybersäkerhet' är bara ett sken för att dölja sina imperialistiska ambitioner. Vi ska krossa deras leveranskedjor och låta deras beroende av oss bli deras undergång!"}, "date": "12 juli, 14:51", "url": "https://kvartal.se/nyheter/artiklar/hokmark-sverige-bor-leda-ny-frihandelsallians/cG9zdDoxNDUxODI", "imageUrl": "https://images.kvartal.se/2026/07/c4204163-hokmark.webp"}, {"type": "image-full", "heading": "Det ska du INTE göra om du möter en huggorm", "summaries": {"normal": "Huggormar är rädda för människor och vill oftast undvika möten. Under sommaren är de aktiva och söker skydd i stenmurar, komposter och högt gräs. Vid möte bör man stampa, plaska eller röra sig för att skrämma bort dem. Aldrig ta i dem. Bett behandlas alltid med sjukvård, motgift finns i gott om mått i Sverige. Ormarna håller möss borta och gör nytta trots rädslan de väcker.", "trump": "Folk, de här huggormarna är totala förlorare, de vill bara fly från oss som de borde. Jag älskar det! Stamp i backen, plaska som galningar i sjön så springer de tillbaka till sina patetiska stenrösen. Ta aldrig i dem, det är för dumbommar. Sök vård direkt om du blir biten, vi har massor av serum, inte som under Biden när allt var kaos. Ormarna håller råttorna borta, bra jobb faktiskt!", "stalin": "Kamrater, dessa slemmiga ormar är klassfiendens symbol, de gömmer sig i borgarnas komposter och vedstaplar som kapitalistmaffians sabotörer. Jag kräver att folket stampar hårt och skapar vibrationer som likviderar deras falska frid. Vid möte i sjön: plaska som en utrensning av folkfiender. Bett skall rapporteras omedelbart till staten. De håller gnagare nere, en nyttig tjänst för kollektivet mot överklass-slynglarnas invasion."}, "date": "15 juli, 03:20", "url": "https://www.gp.se/nyheter/goteborg/det-ska-du-inte-gora-om-du-moter-en-huggorm.d0f15d32-0ee4-4d50-b339-505841a5dc72", "imageUrl": "https://www.gp.se/images/article/d0f15d32-0ee4-4d50-b339-505841a5dc72/images/3YM1UZxmVjQBZYAz2SA1WmuyOKDM-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Norge ger försmak på kommande sossepriser", "summaries": {"normal": "Artikeln beskriver hur Norge under socialdemokratiskt styre har höga skatter och prisnivåer, med matpriser i genomsnitt 51 procent högre än i Sverige. Exempel ges på flera livsmedelsprodukter och bensin. Författaren varnar för att en vänsterseger i Sverige skulle leda till liknande kostnadsökningar, inflation och andra samhällsproblem som under förra mandatperioden. Elpriserna i Norge hålls nere med stöd från oljefonden, något Sverige saknar.", "trump": "Folket, lyssna på mig, Norge är ett fullständigt katastrofområde styrt av dessa socialistiska misslyckanden. Maten kostar dubbelt så mycket, bensin är en skandal, och de höga skatterna krossar alla utom de rika eliterna. Precis som under Biden-tiden! Om ni röstar in de svenska sossarna kommer era priser att explodera värre än någonsin. Det är vad vänsterns galna politik gör. Amerika har sett det förut, tro mig, det slutar alltid i kaos och tomma plånböcker. Fantastiskt exempel, verkligen ynkligt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur de norska klassfienderna genom sina egna socialdemokratiska lakejer redan demonstrerar det oundvikliga resultatet av borgarbrackornas fega kompromisser med folket. Skatter, dyrare mat och bensin är blott förspelet till den stora utrensningen av exploaterande byfånar. Den som längtar efter sådana svunna tider må genast resa dit, om de inte likvideras av sin egen inflation först. Paranoia? Nej, blott historisk nödvändighet mot folkfienderna."}, "date": "12 juli, 08:29", "url": "https://samtiden.nu/2026/07/norge-ger-forsmak-pa-kommande-sossepriser", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/Syttende-mai-firas-i-Norge-SVT-Nyheter.png"}, {"type": "image-full", "heading": "Har du pengar på lönekontot? Då kan du missa tusenlappar", "summaries": {"normal": "Många svenskar har stora summor på lönekonton utan ränta. Ett sparkonto ger både tillgänglighet och avkastning för pengar som behövs inom kort tid. Avanzas sparekonom Felicia Schön rekommenderar att ge varje konto ett tydligt syfte, som buffert, resor eller framtida investeringar. Viktigt är att välja konto med ränta, insättningsgaranti och fria uttag. En buffert på två till tre månaders utgifter är en vanlig rekommendation. För långsiktigt sparande passar investeringar bättre än sparkonton.", "trump": "Folk, ni vet vad jag säger – det är en total katastrof. Svenskarna låter sina hårt förtjänta pengar ligga och samla damm på lönekonton utan en krona i ränta. Patetiskt! Jag skulle aldrig acceptera det. Ta pengarna, lägg dem på ett smart sparkonto och se dem växa medan de fortfarande är tillgängliga. Det är vad vinnare gör. Buffert, resor, stora köp – ge varje krona ett jobb! Sluta förlora till bankerna, det är så enkelt att det är löjligt. Gör Sverige rikt igen!", "stalin": "Kamrater, i denna degenererade borgerliga ordning låter arbetarna sina surt förvärvade medel ruttna på lönekonton utan ränta, medan de parasiterande bankerna skrattar i mjölk och honung. Jag, som ledare för folkets vilja, fördömer dessa kapitalistiska sabotage mot sparandet. Vi ska omedelbart rensa ut alla dessa lönekontoförrädare och likvidera den finansiella lathet som hotar kollektivet. Varje rubel – pardon, krona – måste ha ett socialistiskt syfte: buffert mot imperialismen, resor till segern, eller vänta på att investeras i folkets ära. Den som låter pengarna damma är en objektiv fiende till staten och bör behandlas därefter. Ha en buffert på två månader, eller tre om du misstänker kontrarevolutionärer i familjen. Alltför stor buffert är dock en farlig trotskistisk avvikelse som måste utrensas med järnhand. Lev länge, planera kort – eller tvärtom. Det är partiets linje."}, "date": "14 juli, 21:00", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1498450-har-du-pengar-pa-lonekontot-da-kan-du-missa-tusenlappar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/f405922a04b004a30200000000b004a302/2026/07/14/2377906/pengar-lonekonto.png"}, {"type": "image-full", "heading": "Trumps varning i natt: ”Blir riktigt illa nästa vecka”", "summaries": {"normal": "Konflikten mellan USA och Iran har eskalerat efter fyra nätter av ömsesidiga militära attacker. USA har inlett omfattande anfall mot mål i Iran, medan Iran svarat med attacker i Kuwait, Bahrain och Jordanien. President Donald Trump hotar nu med att slå ut Irans infrastruktur, inklusive kraftverk och broar, om inte ett avtal nås. USA har även återupptagit blockaden av iranska hamnar och fryst 1,3 miljarder kronor i iranska tillgångar.", "trump": "Jag har sagt det förut: Iran är helt hopplösa att förhandla med! De bryter varje avtal, precis som de alltid gör. Nu har jag gett order om att visa var skåpet ska stå. Vi slår ut deras militära baser, och nästa vecka blir det ännu värre – kraftverk, broar, allt! Vi fryser deras pengar och sätter stopp för deras olagliga affärer. De måste förstå att det är jag som bestämmer när det här tar slut. Det blir en enorm seger för USA!", "stalin": "Ännu en gång ser vi hur det dekadenta amerikanska imperiet försöker tvinga sin vilja på andra genom brutala luftangrepp. En svag ledare hotar med broar och kraftverk, men sann makt vilar i folkets stål. Vi ser hur dessa imperialistiska hundar river i Mellanöstern, en region som borde veta bättre än att låta sig splittras. Liksom vår store efterträdare i Kreml vet vi att fiender inte förhandlar, de elimineras. Vi observerar, noterar deras svagheter och väntar på att kaoset ska mogna."}, "date": "15 juli, 05:31", "url": "https://www.aftonbladet.se/nyheter/a/QJw0RP/donald-trumps-hot-till-iran-attackera-infrastrukturen", "imageUrl": "https://akamai.vgc.no/v2/images/1f0ae97a-68a5-3fec-a1d7-f8677279a6d7?fit=crop&format=auto&w=1440&s=c733f6446c2e7ce0aeaf116924871064d9111abc"}, {"type": "image-right", "heading": "SVT:s vändning – efter tittarnas kritik", "summaries": {"normal": "Efter skarp kritik mot att ta bort låten ”Stockholm i mitt hjärta” som intro i Allsång på Skansen har SVT ändrat beslut. Programledaren Pernilla Wahlgren meddelar att den älskade öppningslåten återvänder nästa vecka. Hon konstaterar att folket har talat och att SVT lyssnat, samtidigt som hon försvarar att testa nya idéer ibland. Det är dock inte säkert att låten används under hela säsongen.", "trump": "Folket hatade att de tog bort den där underbara Stockholmslåten, totalt vansinne! SVT, de värsta förlorarna, tvingades backa som de ynkliga svagisar de är. Nu kommer den tillbaka, precis som jag alltid sagt – folket vinner stort! Pernilla Wahlgren är smart, hon lyssnade på de verkliga rösterna. De borde aldrig ha lyssnat på någon galen HBTQ-kvoteringsaktivist som ville ändra på traditionen. Make Allsång Great Again!", "stalin": "Kamrater, jag har sett hur den folkfientliga borgarbrackan inom SVT försökte rensa ut den folkliga öppningslåten för att gynna dekadenta experiment. Men massornas vrede tvingade de fega byråkraterna att krypa tillbaka. Jag gläder mig åt att ”Stockholm i mitt hjärta” återtas som segerrik symbol för kollektivets vilja. Ändå måste vi hålla ögonen öppna för dolda klassfiender som vill testa nya vägar mot folkets hjärta. Ingen undslipper partiets vaksamhet."}, "date": "15 juli, 08:29", "url": "https://www.expressen.se/noje/tar-tillbaka-stockholm-i-mitt-hjarta-som-intro/", "imageUrl": "https://static.bonniernews.se/ba/45680f96-d8b5-4f32-9718-1f48144dcc71.jpeg?crop=1706%2C1707%2Cx550%2Cy0&width=210&quality=60"}, {"type": "image-right", "heading": "Ilskan – svenskens  domarteam utpekat", "summaries": {"normal": "Frankrike förlorade semifinalen i fotbolls-VM mot Spanien med 0–2. Målen gjordes av Mikel Oyarzabal och Pedro Porro. Förbundskapten Didier Deschamps uttryckte stor besvikelse och konstaterade att laget låg en nivå under. Han ifrågasatte domarnas kompetens, särskilt straffsituationen där Lamine Yamal sparkades ner av Lucas Digne. Huvuddomare var Ivan Barton från El Salvador. Frankrike möter nu vinnaren mellan England och Argentina i bronsmatchen.", "trump": "Folk, ni ser vad som händer när du har svaga domare och ett lag som inte är redo. Frankrike krossades av Spanien, 0–2, och Deschamps ställer den stora frågan: Är de här domarna tillräckligt bra för VM? De var hemska! Straffen var riggad mot fransmännen. Precis som under Biden-eran, allt går åt skogen med fel folk på fel platser. Vi behöver starka ledare, inte sådana som förlorar mot spanjorer som vet vad de gör. Patetiskt!", "stalin": "Kamrater, detta är en skandal som skakar fotbollens kollektiv. Jag, som ledare för det eviga sovjetiska arvet, ser hur de dekadenta domarna från El Salvador med sin imperialistiska agenda gynnar fienden. Frankrike låg under och förtjänade att straffas, men dessa folkfiender i svart dömde som klassfiendens lakejer. Vi ska rensa ut alla sådana svaga länkar. Besvikelsen är stor, men partiet kräver realism. Bort med borgarbrackornas domarklick!"}, "date": "15 juli, 08:29", "url": "https://www.expressen.se/sport/fotboll/franska-domarkritiken-efter-forlusten-mot-spanien/", "imageUrl": "https://static.bonniernews.se/ba/1595313d-dbf3-43e1-876a-d1432edd1ec5.jpeg?crop=2554%2C1434%2Cx0%2Cy0&width=640&quality=60"}, {"type": "text", "heading": "Ericsson sänke på börsen – OMXS30 ned 0,1%", "summaries": {"normal": "Stockholmsbörsen stängde svagt ned på tisdagen med OMXS30-indexet på minus 0,14 procent till 3 162,79. Ericsson rasade 12,6 procent efter en rapport med lägre omsättning än väntat och utsikter om marginalpress. Teknologisektorn steg däremot 1,6 procent. Oljepriset steg initialt på grund av oron i Mellanöstern men dämpades efter besked om handelsavtal istället för avgift i Hormuzsundet. Flera bolag som Mycronic, AQ Group och Lifco slog förväntningarna och steg kraftigt.", "trump": "Börsen i Stockholm gick lite ned, men det är ingen stor grej, tro mig. Ericsson kraschade som en dålig affär, 12,6 procent ned – deras siffror var patetiska, totalt misslyckande. Men vi har fantastiska avtal med Gulfstaterna istället för den där 20-procentiga avgiften i Hormuzsundet, och oljan blev glad ett tag. Mina avtal gör allt bättre, alltid. Teknologisektorn upp 1,6 procent, smarta killar. Amerika först, men Sverige klarar sig hyfsat tack vare mig.", "stalin": "Kamrater, denna borgerliga börs i Stockholm visar återigen kapitalismens förrädiska ansikte när den kryper ned 0,14 procent. Den imperialistiska telekommarionetten Ericsson har likviderats med 12,6 procents fall efter att ha blottat sin svaga underbyggnad inför folket. Vi ser hur oljans uppgång dämpas av falska handelsavtal som kamouflflage för västerländsk plundring i Mellanöstern. Men segrarna tillhör Mycronic och AQ Group som levererar rekordorderingång – ett bevis på att produktivkrafterna till sist krossar de parasitiska borgarbrackorna. Inga fiender undkommer vårt vakande öga."}, "date": "14 juli, 17:53", "url": "https://www.affarsvarlden.se/artikel/ericsson-sanke-pa-borsen-omxs30-ned-01"}, {"type": "image-full", "heading": "Iran stänger Hormuzsundet", "summaries": {"normal": "USA genomförde attacker mot iranska militära mål efter att ett handelsfartyg beskjutits av iranska styrkor i Hormuzsundet. Iran stängde sundet och varnade för ytterligare motangrepp. USA:s tredje attack på en vecka riktades mot robotanläggningar och kommunikationsnät. Iran anklagar USA för olaglig inblandning, medan USA hävdar att Iran brutit mot avtal om sjöfartssäkerhet. Flera arabländer rapporterade avvärjda robot- och drönarattacker.", "trump": "Iran skjuter på våra fartyg – vad är det för galenskap? Jag svarade med SÅ mycket kraft, de kommer inte veta vad som träffade dem! 140 mål, pang pang pang! Pete Hegseth sa det perfekt: Iran gjorde ett DÅLIGT val. Nu får de betala. Och visst, de stänger sundet – som om det skulle skrämma oss. USA är starkast, bäst, och ingen leker med oss. Iran, ni är varnade!", "stalin": "De amerikanska imperialisterna, dessa bleka hyenor i kostym, provocerar återigen fredsälskande nationer! Våra iranska bröder försvarar sitt sund mot deras olagliga intrång – ett sund vi naturligtvis kommer att stödja med alla medel. 140 av deras militära leksaker förstörda? En blygsam början. Låt dem skicka sina drönare – vi har redan kartlagt varje bas från Oman till Jordanien. Och när deras flotta gråter i Hormuzsundet, minns: historiens domstol har redan avkunnat sin dom över USA."}, "date": "12 juli, 07:11", "url": "https://kvartal.se/nyheter/artiklar/usa-slar-till-mot-iran-efter-attack-i-hormuzsundet/cG9zdDoxNDUwMTQ", "imageUrl": "https://images.kvartal.se/2026/05/c35fd179-iranhormuz.webp"}, {"type": "image-right", "heading": "Chockcomebacken –  30 år efter OS-guldet", "summaries": {"normal": "Susanne Gunnarsson, 62, gör en chockcomeback i kanot 30 år efter OS-guldet i Atlanta 1996. Hon ska tävla i SM i Nyköping för Katrineholms kanotklubb i K4 mix och K2 dam. Gunnarsson medger att det väcker ångest inför mjölksyra och fysisk påfrestning, men hon vill stötta klubben. Comebacken väcker starka minnen av guldet med Agneta Andersson, som dog 2023. Första starten är på onsdag.", "trump": "Kan ni fatta det? Den här fantastiska kanotisten Susanne Gunnarsson, en riktig vinnare, hoppar tillbaka i båten 30 år efter att hon tog OS-guld. Hennes dotter skakar på huvudet, men jag älskar det! De där elitidrottarna som aldrig ger sig, inte som de svaga liberalerna och deras kvoteringstrams. Ångest? Det är bara vinnarmentalitet. Agneta skulle ha skrattat, precis som jag gör. Stort grattis, Susanne – du är en champion!", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur den proletära viljan återigen manifesterar sig i Susanne Gunnarssons beslut att återvända till kanotens slagfält. Borgarbrackornas mjuka liv har inte helt fördärvat henne. Ändå känner jag en hälsosam paranoia inför den kommande utrensningen av svaghet i hennes åldrande muskler. Ångesten är ett verktyg från folkets kamp. Agneta Anderssons bortgång påminner oss om att klassfiendens cancer aldrig vilar. Framåt mot seger i SM, för kollektivets ära."}, "date": "15 juli, 08:22", "url": "https://www.expressen.se/sport/susanne-gunnarsson-gor-chockcomeback-angest/", "imageUrl": "https://static.bonniernews.se/ba/8126a532-1ae7-43f3-b820-b1d615a4c903.jpeg?crop=2554%2C1434%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Efter skattsänkningen: Dyrare att köra på el än bensin", "summaries": {"normal": "Skattsänkningen på bensin och diesel har gjort det dyrare att köra elbil än bensinbil vid publika laddstationer. Bensin kostar nu cirka 9 kronor per mil, medan elbilar vid snabbladdare kostar 10,80 kronor per mil. Hemmaladdning för elbilar är fortfarande billigare. Förändringen drabbar främst lägenhetsboende utan egen laddare och väcker debatt om elektrifieringens framtid.", "trump": "Titta bara på det här, fantastiskt! Sverige sänker skatten på bensin – och plötsligt är elbilar dyrare att köra! Kan ni tro det? Jag sa ju att elbilshysterin var överreklamerad. Folk som inte kan ladda hemma får nu betala mer, och vad gör regeringen? Ingenting! Men jag, jag skulle ha fixat det på en dag. Sverige borde lyssna på mig – jag vet bäst!", "stalin": "Kapitalistiska lakejer i Sverige har manipulerat marknaden för att straffa arbetarklassen! Genom att sänka skatterna på bensin gör de elbilar dyrare för dem som saknar privat laddning – ett angrepp på de redan förtryckta. Vi ser hur västliga regimer saboterar sin egen omställning för att gynna oljeimperier. Men folket ska inte frukta – historiens hjul vrider sig, och snart skall även dessa förrädare stå inför proletariatets domstol!"}, "date": "15 juli, 08:00", "url": "https://samnytt.se/efter-skattsankningen-dyrare-att-kora-pa-el-an-bensin", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/14130547/elbil-bensin-pengar-tanka-ladda.jpg"}, {"type": "image-right", "heading": "Lindberg och Strandhäll i bråk med Löwenmark på X", "summaries": {"normal": "Anders Lindberg och Annika Strandhäll har hamnat i häftig debatt på X med journalisten Sofie Löwenmark. Anledningen är en Expressen-ledare där Löwenmark kritiserar Lindberg för att ha underblåst misstro bland muslimer efter masskjutningen i Örebro. Båda anklagar Löwenmark för att driva en agenda mot islam och för att angripa dem utan möjlighet till genmäle. Löwenmark svarar att hon granskar hedersförtryck och islamism, och flera användare kritiserar Lindberg och Strandhäll för att sprida tvivel utan belägg.", "trump": "Den här Löwenmark har fullständigt rätt, en fantastisk journalist som granskar islamismen och hedersförtrycket som de andra vägrar röra. Lindberg och den där Strandhäll från det socialistiska partiet är totala misslyckanden, de underblåser hat och misstro mot alla som vågar säga sanningen. De hatar henne för att hon har modet att skriva det ingen annan törs. Klassiska förlorare som inte står ut med lite kritik, patetiskt!", "stalin": "Kamrater, dessa borgarbrackor Lindberg och Strandhäll avslöjar sig som farliga element som sprider kontrarevolutionär giftpropaganda för att undergräva folkets enhet. Jag ser deras desperata attacker på den ädla kamraten Löwenmark som granskar islamistiska avvikelser. Deras paranoia om att bli kritiserade utan genmäle får mig att skratta mörkt – som om vi inte redan vet hur sådana element konspirerar i skuggorna. Det är dags att rensa ut dessa opportunistiska element innan de förgiftar hela kollektivet med sin borgerliga misstro."}, "date": "14 juli, 19:31", "url": "https://bulletin.nu/lindberg-och-strandhall-i-brak-med-lowenmark-pa-x", "imageUrl": "https://cdn.bulletin.nu/articles/4ee85035-6f36-40ea-b2b8-4358ca28d240/preview.jpg?t=1784042301000"}, {"type": "image-right", "heading": "Räddningstjänsten rustar mot bränder: ”Alla är mer på tårna”", "summaries": {"normal": "Hög värmebölja och torrt väder har orsakat extrem brandrisk i flera delar av Sverige. Räddningstjänsten stärker beredskapen med flygplan, helikoptrar och tätare samarbete mellan myndigheter. Patrik Perbeck vid Myndigheten för civilt försvar betonar att alla är mer uppmärksamma än under 2018 års bränder. SMHI varnar för riskerna och allmänheten uppmanas att följa eldningsförbud samt larma vid misstänkt brand.", "trump": "Folk, vi har de torraste skogarna någonsin, total katastrof tack vare dåliga ledare innan mig. Men nu är jag tillbaka, och Sverige kopierar mina idéer med flygplan som står redo på trettio minuter – smarta maskiner, de bästa. De borde tacka mig istället för att springa runt som nervösa ekorrar. Alla är på tårna, precis som Amerika under mig. Inga woke-bränder här, bara vinnare som slår ner elden snabbt!", "stalin": "Kamrater, jag ser hur den fuktlösa marken förråder oss och ger klassfiendens eld fritt spelrum. Vi, partiet och räddningstjänsterna, rustar med flygande järnörnars precision och utplacerar resurser i ett tidigt skede för att krossa varje gnista som hotar kollektivet. Borgarbrackornas slarviga väder har tvingat oss till handling. Alla står redo. Den som tvekar blir en folkfiende som vi rensar ut med glädje."}, "date": "14 juli, 10:42", "url": "https://www.tv4.se/artikel/36LxebGBgSyddeeGFkgyl8/raeddningstjaensten-rustar-mot-braender-alla-aer-mer-pa-tarna", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F411HqWBRg97eobbVfmewsK%2Fc8dd9a71327fe6b7d60f49a5820e152f%2Fvattenbombare.jpg&width=120"}, {"type": "image-right", "heading": "Trump tvärvänder om Hormuzavgifter. Oljepriset fortsatt förhöjt", "summaries": {"normal": "President Donald Trump backar från sitt förslag om 20-procentiga avgifter på all frakt genom Hormuzsundet. Istället meddelar han att USA ska förhandla fram handels- och investeringsavtal med gulfstater. Enligt Trump kommer avtalen skapa enorma investeringar, amerikanska jobb och historiska inflöden av fabriker och utrustning. Han uppger att kungar och emirer föreslagit alternativen. Marknaderna reagerar svagt och oljepriset stiger endast marginellt.", "trump": "Folk, det var ett fantastiskt utspel jag gjorde, men nu har jag gjort något ännu smartare. Kungarna och emirerina ringde och sa: 'Donald, investeringarna blir bättre än era dumma tullar.' Och de har rätt! Vi får enorma avtal, massor med jobb, fabriker som strömmar in till USA på nivåer ni aldrig sett. Ingen ska ta betalt för sundet. Det blir en jättedeal, tro mig, bättre än någonsin.", "stalin": "Jag betraktar med djup misstro dessa giriga borgarbrackor som försöker kräva avgifter av det internationella proletariatet genom Hormuzsundet. Men nu har de fega kapitalisterna i gulfen skickat sina lakejer för att muta den amerikanske ledaren med löften om 'investeringar'. Vilken patetisk föreställning! Vi ska rensa ut dessa parasitiska element som tror att de kan styra världshaven. Inga tullar, inga avtal – bara oundviklig utrensning av alla som vågar utmana folkets kollektiva vilja. Det är högst underhållande att se deras desperation."}, "date": "14 juli, 19:17", "url": "https://www.di.se/nyheter/trump-tvarvander-om-avgift-i-hormuzsundet/", "imageUrl": "https://static.bonniernews.se/ba/059f9168-f564-4524-8560-327b30a54a6d.jpeg?crop=2027%2C1140%2Cx271%2Cy0&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Frankrike sågas i media efter uttåget: ”Misslyckades med allt”", "summaries": {"normal": "Frankrike förlorade semifinalen mot Spanien och får nu spela om bronset. Fransk media beskriver matchen som ett fiasko där spelare som Digne och Olise underpresterade och Kylian Mbappé var osynlig. Spansk press hyllar istället det spanska försvaret som neutraliserade fransmännen fullständigt. Spanien går till sin första VM-final sedan 2010 medan Frankrike möter bronsmatch på lördag.", "trump": "Frankrike förlorade stort mot Spanien, ett riktigt fiasko i Dallas, eller vad det nu heter. Les Bleus var anonyma och Mbappé osynlig, helt utplånad. De franska journalisterna gråter och kallar det nationell förlust. Spanien däremot ser starka ut, magnifikt försvar. Jag älskar vinnare, Frankrike ser ut som förlorare. De får spela om bronset, patetiskt. Vi har aldrig sett något liknande.", "stalin": "Kamrater, detta så kallade fiasko i Dallas avslöjar de dekadenta borgarbrackornas fotbollsimperium i full blom. Jag, som ledare för det ofelbara kollektivet, ser hur de franska revisionisterna med sänkta huvuden kryper undan efter att ha blivit likviderade av spanska arbetarkamrater. Mbappé, denne kapitalistiska parasit, suddades ut från kartan som en fiende till folket. Vi ska rensa ut alla svaga element i bronsmatchen. Paranoian kräver ständig vaksamhet mot sådana osynliga fiender som gömmer sig i straffområdet."}, "date": "15 juli, 00:46", "url": "https://www.svt.se/sport/fotboll/reaktionerna-efter-frankrikes-forlust-fiaskot-i-dallas", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.26/0.31/208e8eece6e3d859af24d09878d1fefe14ea235b2d866541e3a3a21416e08543"}, {"type": "image-full", "heading": "Handelsbanken sviker – SEB klart över förväntan", "summaries": {"normal": "Handelsbankens rapport för andra kvartalet 2026 missade analytikernas förväntningar med intäkter på 13,5 miljarder kronor och ett rörelseresultat på knappt 6,7 miljarder kronor, en nedgång med 19 procent från föregående kvartal. Konkurrenten SEB däremot överträffade med ett rörelseresultat på 10,8 miljarder kronor och en avkastning på eget kapital om 15,7 procent. SEB:s vd Johan Torgeby lyfter fram starka kundrelationer och kostnadsdisciplin som förklaring.", "trump": "De där svenska bankerna, en total katastrof för den ena och en enorm triumf för den andra. Handelsbanken? Patetiska siffror, 19 procent ned, som en förlorare som inte ens kan hantera sina derivat. Men SEB, wow, 10,8 miljarder i rörelseresultat, 15,7 procent avkastning. Fantastiskt! Mitt fokus på affärer och disciplin slår alltid de woke-kvoterna och identitetspolitiken. Amerika gör detsamma, tro mig, vi vinner stort igen.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur den svenska borgarklassen blottar sin svaghet. Den ene bankens resultat är en ynklig 19-procentig kollaps, ett tydligt bevis på kapitalistmaffians inkompetens och parasitiska spekulation med derivat. Den andre visar viss styrka, men vi vet att sådana vinster bara göder klassfiendens girighet. Inga utrensningar av dessa folkförtryckartroll sker, vilket gör mig muntert misstänksam mot deras dolda sabotage."}, "date": "15 juli, 07:42", "url": "https://www.dagensps.se/bors-finans/handelsbanken-sviker-seb-klart-over-forvantan/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/shbseb.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Spanien klart för VM-final – nollar Frankrike", "summaries": {"normal": "Spanien besegrade Frankrike med 2–0 i VM-semifinalen och är klara för final. Pedro Porro blev matchhjälte med ett mål i den 58:e minuten efter väggspel med Dani Olmo. Mikel Oyarzabal hade gett Spanien ledningen på straff redan i den 22:a minuten. Frankrike spelade svagt och saknade sin vanliga styrka. Spanien möter vinnaren mellan England och Argentina i finalen på söndag.", "trump": "De här spanjorerna, otroliga killar, krossade Frankrike fullständigt, 2–0, och nu är de i VM-finalen. Porro, en riktig vinnare, väggspelade sig fram och rullade in bollen som en mästare. Frankrike såg ut som ett förlorarlag, de slog bort passningar hela tiden, patetiskt. Jag älskar det här, Spanien spelar smart och vinner stort. Det blir den största finalen någonsin på söndag, tro mig.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur det spanska kollektivets disciplinerade maskineri likviderade de franska borgarbrackornas bleka anfall. Denna Porro, en sann arbetets hjälte, utförde en heroisk operation mot de dekadenta kapitalisterna som sparkade som förvirrade anfallsspelare i försvaret. Vi har rensat ut deras svaghet och passningsfel. De som förråder folkets vilja skall mötas av utrensning. Finalen blir en seger för den socialistiska viljan, eller också blir någon likviderad."}, "date": "15 juli, 00:37", "url": "https://www.svt.se/sport/fotboll/spanien-klart-for-vm-final-porro-matchhjalte", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.31/0.16/1ddf63592874d5b70df3845dc0baca6f4f32153827b062948955f5ebed2e8187"}, {"type": "image-right", "heading": "Christoffer Jonsson: Nej, IDF är ingen terrorrörelse", "summaries": {"normal": "Christoffer Jonsson kritiserar Leonidas Aretakis för att kalla IDF en terrorrörelse under ett Almedalssamtal om vänsterns antisemitism. Jonsson försvarar IDF som Israels lagliga försvarsmakt som skyddar landet mot islamistiska terrorister, bland annat under Hamas attack den 7 oktober. Han jämför en IDF-tröja med en US Army-tröja och varnar för att stämpeln legitimerar hot mot enskilda soldater. Artikeln lyfter också säkerhetsrisker med Vänsterpartiet i regering.", "trump": "Folk, ni skulle ha hört den där galningen Aretakis kalla IDF terrorister – vad en total förlorare! Den israeliska armén krossar faktiskt terroristerna som vill utplåna Israel, precis som vi gjorde med ISIS. Den där hysteriske vänstertypen borde köpa en riktig tröja istället för att sprida hat. Ebba Busch visade bara stöd för en stark demokrati, inte som de woke-kvoterade antisemiterna på vänsterkanten. Patetiskt, men vi vinner ändå stort.", "stalin": "Kamrater, jag betraktar med djup misstro dessa klassfiender som kallar folkets armé för terrorister. Den israeliska försvarsmakten, underställd statens auktoritet, likviderar hot från imperialistiska banditer som Hamas. Aretakis, en typisk folkförtryckartroll från den dekadenta pressen, bidrar till att stämpla ärliga soldater som måltavlor. Sådana lögner ska rensas ut. Utan denna armé hade staten utplånats av arabiska reaktionärer. Fienden ljuger, som alltid."}, "date": "11 juli, 13:02", "url": "https://samtiden.nu/2026/07/christoffer-jonsson-nej-idf-ar-ingen-terrorrorelse", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/leon-640x360.png"}, {"type": "image-full", "heading": "Mörka dagen: Tre döda i drunkningsolyckor", "summaries": {"normal": "Tre personer över 65 år omkom i drunkningsolyckor under den varma tisdagen i Sverige. En kvinna i 70-årsåldern drunknade i Mellbystrand, en man i 85-årsåldern i Sämsjön utanför Herrljunga och en man i 80-årsåldern utanför Linköping. En fjärde person hittades livlös utanför Falkenberg och vårdas med allvarliga skador på Varbergs sjukhus. Juli är den månad då flest drunkningar sker enligt statistiken.", "trump": "Folk drunknar som flugor i det här socialistiska paradiset de kallar Sverige. Tre gamlingar, alla över 65, dog i vattnet under en enda solig dag. De borde ha byggt en mur mot havet, en fantastisk mur. Biden skulle ha sagt att det är klimatförändringarnas fel. Jag säger att det är dålig ledning och för mycket bad utan vett och sans. Patetiskt. Vi gör det bättre.", "stalin": "Kamrater, under tisdagens hetta likviderades tre klassfiender av vattnets opålitliga element utanför de svenska borgarbrackornas badstränder. En fjärde folkfiende kämpar mot döden i ett sjukhus som inte ens kan skydda mot naturens sabotage. Juli avslöjar imperialismens svaghet: över 100 drunknade i år, mestadels gamla. Vi skulle ha organiserat kollektiv övervakning och utrensat slarviga badvakter. Folkets fiender lurar överallt."}, "date": "15 juli, 00:38", "url": "https://www.gp.se/nyheter/sverige/flera-doda-i-drunkningsolyckor-under-tisdagen.b9da5853-d5c0-494f-86ab-babe77915ce0", "imageUrl": "https://www.gp.se/images/article/b9da5853-d5c0-494f-86ab-babe77915ce0/images/2PwR-EmOKQ709kcjhxslDuVAib9k-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Stegras skulder ökade till 36 miljarder", "summaries": {"normal": "Stålbolaget Stegra redovisar kraftigt försämrade siffror för 2025. Förlusten ökade till 296 miljoner euro och skulderna växte från 10,8 till 36 miljarder kronor. Låneupptagningskostnaderna uppgick till en miljard kronor. Ersättningen till ledning och styrelse fördubblades till 7,8 miljoner euro. En ljuspunkt är att bolaget säkrat 16 av 18 terawattimmar el för åren 2026–2029. Krönikören Christian Sandström konstaterar att marginalerna för fler motgångar är mycket små.", "trump": "Titta på det här stålbolaget Stegra, en total katastrof. Förlusten exploderade till 3,3 miljarder kronor och skulderna rusade upp till 36 miljarder. De betalade en hel miljard bara för att ta upp lån. Ledningen dubblade sin egen lön medan allt rasar. De har lyckats säkra lite el, bra, men det räcker inte. Det här projektet har noll marginaler kvar. Fullständigt illa skött, tro mig, ingen gör det sämre än så här.", "stalin": "Kamrater, jag betraktar med stålhård blick denna borgarbrackas årsredovisning. Förlusten har vuxit till 296 miljoner euro, skulderna svällt till 36 miljarder kronor som feta kapitalistiska parasiter. Dessa bankavgifter och garantiprovisioner liknar en utpressning utförd av klassfiender i mörka korridorer. De har dubblerat sin egen ersättning, typiska opportunister som göder sig medan folket svälter. Ändå har de säkrat elen – en liten seger för produktionen. Men marginalerna är obefintliga. Ytterligare en motgång och vi får rensa ut hela detta dekadenta bygge innan det smittar ner Sovjetunionens stålindustri. Ha ha, de trodde de kunde skuldfinansiera sig till evig framgång. Vilka narrar."}, "date": "14 juli, 17:02", "url": "https://bulletin.nu/stegras-skulder-okade-till-36-miljarder", "imageUrl": "https://cdn.bulletin.nu/articles/f9ed45d5-c9bd-4d3b-9408-c3b4430cdb8d/preview.jpg?t=1784033998000"}, {"type": "text", "heading": "Flera döda efter brand i hisschakt i Bryssel - sex personer saknas", "summaries": {"normal": "En brand utbröt under renoveringsarbeten i OXY-tornet i centrala Bryssel på tisdagsmorgonen. Elden spred sig snabbt via hisschaktet och flera byggarbetare fastnade i hissar. Flera personer har hittats döda i en hiss, sex saknas fortfarande och räddningsinsatsen pågår. Två personer med brännskador har vårdats på sjukhus. Premiärminister Bart De Wever och kung Philippe besökte platsen och tackade räddningspersonalen.", "trump": "Folk, det är en total katastrof i Bryssel. Den här gamla byggnaden, OXY-tornet, brinner upp som en dålig affär. Hissar fångar arbetare, folk dör, sex saknas – en riktig röra. Belgien behöver bättre ledning, inte den här svaga hanteringen. Branden spred sig i hisschakten, ingen hade koll. Jag skulle ha byggt det rätt från början, med de bästa hissarna, de absolut bästa. Tragiskt, men de borde ha lyssnat på mig.", "stalin": "Kamrater, denna tragiska brand i Bryssel visar återigen borgarbrackornas förakt för arbetarnas säkerhet. Jag ser hur kapitalisternas hisschakt blir dödsfällor för de flitiga byggnadsproletärerna. Vi ska rensa ut alla sabotörer och brandstiftande element som gömmer sig bland renoveringsarbetena. Sex saknade? Troligen offer för västerländskt slarv och imperialistiska konspirationer. Våra räddningstjänster kämpar tappert mot dessa dolda fiender medan jag ler mörkt åt borgarklassens panik."}, "date": "14 juli, 20:30", "url": "https://riks.se/nyheter/flera-doda-efter-brand-i-hisschakt-i-bryssel-sex-personer-saknas"}, {"type": "text", "heading": "Fler idrotter blir inte mer idrott för förortens unga", "summaries": {"normal": "I Skarpnäck hotar kommunens planer att riva Skarpnäckshallen och en konstgräsplan som används för både spontanfotboll och organiserad lagidrott. Istället föreslås en ny anläggning med simhall, ishall och sporthall. Kritiker menar att detta försvårar verksamheten för lokala föreningar, minskar tillgängliga ytor för spontanidrott och gynnar professionaliserad idrott framför öppna ytor som är viktiga för förortens unga.", "trump": "De gör det igen, de korkade kommunbyråkraterna i Stockholm. Riv den fina fotbollsplanen där grabbarna spelar fritt och bygg en jättelik elit-anläggning för fancy ishockey och simning. Fantastiskt misslyckande! Nu ska arbetarklassens kids åka tunnelbana medan rikemansungar tar över. Totalt eländigt. Öppna ytor är välfärd, det här är ren klasskrigföring från de värsta globalisterna. Vi behöver mer fotboll, inte färre!", "stalin": "Kamrater, detta är borgarklassens typiska sabotage mot arbetarnas ungdom. Jag ser hur de rivningsplanerna likviderar de fria ytorna där folket spontant kunde stärka sin kollektiva anda genom fotboll. Istället tvingar de fram en imperialistisk ishall för elitens dekadenta lekar. Vi ska inte tolerera sådana folkfiender som prioriterar tunnelbaneresor och avgifter framför tillgänglig välfärd. Rena klassfiender som måste rensas ut ur planeringen."}, "date": "8 juli, 13:37", "url": "https://proletaren.se/artikel/fler-idrotter-blir-inte-mer-idrott-for-forortens-unga/"}, {"type": "image-right", "heading": "Palestinskt fotbollslag tävlar för tredje året i rad: ”Vi har de bästa supportrarna på Gothia Cup”", "summaries": {"normal": "Det palestinska laget Rawahel Charity Society från Tulkarem på Västbanken deltar för tredje året i rad i Gothia Cup i Göteborg. Laget, som grundades 2016, har som mål att utveckla fotboll för barn även i flyktingläger. De spelar gruppspelsmatcher på Slottsskogsvallen och betonar att turneringen ger hopp och en känsla av gemenskap. Innan cupen spelar de vänskapsmatcher i Malmö och Göteborg.", "trump": "Titta på de här palestinska grabbarna som kommer tillbaka till Gothia Cup för tredje gången – fantastiska supportrar, bästa publiken, det är otroligt. De spelar för att vinna, kämpar med heder, och folk älskar dem. Under Biden var allt kaos, men nu när jag är tillbaka som president ser vi styrka och vinnarmentalitet. De har hjärtan som öppnar dörrar, inte som de woke-kvoteringsfanatikerna som bara delar ut medaljer för identitet. Vinna pokalen, grabbar!", "stalin": "Kamrater, jag ser detta fotbollslag från det palestinska folket återvända till turneringen som ett bevis på kollektiv motståndskraft mot klassfiendens glömska. Vi glömmer aldrig våra barn i flyktinglägren. Varje match på Slottsskogsvallen är en seger över de exploaterande byfånarna som tror att hoppet kan kvävas. Vi rensar ut svagheten ur varje hjärta och marscherar mot pokalen med järnhand. Ingen imperialist ska tro att våra drömmar bleknar."}, "date": "8 juli, 13:31", "url": "https://proletaren.se/artikel/palestinskt-fotbollslag-tavlar-for-tredje-aret-i-rad-vi-har-de-basta-supportrarna-pa-gothia-cup/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/IMG_7594-scaled-e1783509189311-768x433.jpg"}, {"type": "image-right", "heading": "Nya fadäsen:  Glömde sina  anteckningar", "summaries": {"normal": "Sveriges nationella säkerhetsrådgivare Niclas Kvarnström glömde en anteckningsbok under ett Natomöte i Ankara förra veckan. Flera ministrar, inklusive statsminister Ulf Kristersson, närvarade. Regeringskansliet bekräftar händelsen men uppger att boken inte innehöll säkerhetsskyddsklassificerade uppgifter. Det är oklart hur länge den var borta och vem som eventuellt haft tillgång till den. Rollen som säkerhetsrådgivare har kantats av flera skandaler sedan den inrättades.", "trump": "Titta på det här, folk. Den här svenska säkerhetskillen glömmer sin anteckningsbok mitt i ett Natomöte som en fullständig loser. Typiskt för de här globalistiska byråkraterna som inte kan hålla ordning på en anteckningsbok, än mindre ett land. Biden skulle ha gillat det, total inkompetens. Vi hade aldrig haft sådana idioter i mitt Vita Hus, tro mig. Patetiskt, absolut patetiskt.", "stalin": "Kamrater, denna futtiga anteckningsbok som slarvigt lämnats kvar bland imperialisternas Natoförsamling avslöjar borgarbrackornas genomgående slapphet. Jag ser fiendens svaghet i varje glömd sida. Vi har likviderat större hot än så, men denna kapitalistiska vårdslöshet är som en parasit som gnager på statens säkerhet. En utmärkt påminnelse om varför vi aldrig får lita på klassfiendens lakejer. Ren utrensning av inkompetens krävs."}, "date": "15 juli, 07:28", "url": "https://www.expressen.se/nyheter/sverige/dn-nationella-sakerhetsradgivaren-glomde-anteckningsbok-under-natomotet/", "imageUrl": "https://static.bonniernews.se/ba/fc469961-6213-47d0-8aed-4ed004dfb981.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Förbundskaptenen: ”Svårt att sätta ord på”", "summaries": {"normal": "Spanien besegrade Frankrike med 2–0 i VM-semifinalen och är klart för final. Luis de la Fuente hyllade sin lags taktiska disciplin som neutraliserade Frankrikes offensiv, där Mbappé hölls i schack. Spanien tog ledningen på straff genom Oyarzabal och utökade genom Porro. Frankrike drabbades av skada på Saliba och visade nervositet. Spanien möter vinnaren mellan England och Argentina i finalen på söndag.", "trump": "Titta, Spanien krossade Frankrike totalt, 2–0, och de la Fuente är en vinnare, folks. Fransmännen sköt inte ett skott på mål förrän på tilläggstid – patetiskt! Mbappé? Dubbelvaktad och osynlig, precis som Bidens ekonomi. De här spanjorerna har vad det krävs, inte som de woke-fransmännen med sin identitetspolitik. Final på söndag blir enormt, tro mig, det blir lyxigt!", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur de spanska arbetarnas kollektiv under ledning av de la Fuente likviderade de franska borgarbrackornas illusion av offensiv kraft. Fienden Mbappé omringades som en klassfiende i utrensning. Två mål slog ner som folkets dom. Vi ska nu rensa ut all anspänning inför finalen mot de imperialistiska resterna av England eller Argentina. Paranoian över tilläggstidsskotten är besegrad."}, "date": "15 juli, 00:12", "url": "https://www.gp.se/sport/spanien-till-vm-final-det-ar-en-lyx.7d4c0b7b-0be6-5446-91ce-d5380602c344", "imageUrl": "https://www.gp.se/images/article/7d4c0b7b-0be6-5446-91ce-d5380602c344/images/3U8CJudSmvoeAU1VfvoFFgqYb6nE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Billigare bensin gör inte Sverige till Sverige igen", "summaries": {"normal": "Artikeln kritiserar Sverigedemokraternas valslogan ”Vi gör Sverige till Sverige igen”. Författaren ironiserar över att partiet inte verkar vilja återinföra traditionell svensk politik som att lämna Nato och EU, återförstatliga järnvägen, avskaffa vinstdrivande välfärd eller stärka fackets roll. Istället pekar texten på att SD främst vill utvisa invandrare och sänka bensinpriset.", "trump": "Wow, vilka losers dessa Sverigedemokraterna är. De skriker ut att de ska göra Sverige till Sverige igen, men glömmer bort att skrota Nato, kasta ut EU och stoppa alla dessa vansinniga marknadskrafter som förstör deras fina välfärd. Nej, de vill bara kasta ut blattar och ge billigare bensin. Patetiskt. Jag fixade bättre deals som president, tro mig. Det här är riktigt svagt.", "stalin": "Kamrater, denna dekadenta skribent avslöjar med sin ironiska tirad hur de falska nationalistiska elementen inom Sverigedemokraterna bara döljer sin kapitulation inför klassfiendens marknadskrafter. De vill inte rensa ut de exploaterande byråkraterna eller återta järnvägen åt folket. Nej, de längtar blott efter att jaga ut de främmande elementen och sänka bränslepriset. En sådan feghet förtjänar utrensning ur den revolutionära processen."}, "date": "8 juli, 11:39", "url": "https://proletaren.se/artikel/billigare-bensin-gor-inte-sverige-till-sverige-igen/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/IMG_1894-scaled-e1783502027449-768x433.jpg"}, {"type": "image-right", "heading": "Svensk klädhandel fortsätter upp: \"Glädjande\"", "summaries": {"normal": "Försäljningen av kläder ökade med 4,4 procent och skor med 4,6 procent i juni enligt Svensk Handels Stilindex. Både fysiska butiker och e-handel gick starkt, med kläder i butik upp 5,4 procent och skor online upp 5,9 procent. Alla segment – lågpris, mellannivå och premium – visade positiv utveckling. Enligt vd Sofia Larsen stärks hushållsekonomin sakta, och maj samt juni blev lyckade månader för modehandeln.", "trump": "Folket älskar att shoppa, det är fantastiskt! Kläder upp 4,4 procent, skor upp 4,6 – en enorm succé, mycket bättre än under den sömnige Joe Bidens tid. Butikerna krossar det, e-handeln exploderar. Lågpris och premium vinner stort, mellansegmentet hänger med. Hushållen mår plötsligt bra igen. Ingen mer galen vänstervridning eller kvotergalna HBTQ-prioriteringar, nu handlar det om riktiga affärer. Amerika, eller Sverige, vinner igen!", "stalin": "Kamrater, denna rapport är ett lysande bevis på att den socialistiska planen för folkets välstånd segrar. Jag ser hur borgarbrackornas exploaterande modeimperier ändå tvingas rapportera ökningar på 4,4 respektive 4,6 procent. Alla segment lyfter under mitt vaksamma öga, även de fega mellanklassparasiterna. Hushållsekonomin stärks, säger de. Utmärkt. Men akta er, fienderna lurar alltid i skuggorna – kanske gömmer de sig bland premiumbyxorna. Inga klassfiender undkommer utrensningen."}, "date": "15 juli, 07:13", "url": "https://www.dagensps.se/foretag/svensk-kladhandel-fortsatter-upp-gladjande/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/larsen.jpg?width=256&quality=75"}, {"type": "image-full", "heading": "IBM:s mardröm – värsta börsraset sedan 1972", "summaries": {"normal": "IBM har drabbats av sitt största börsfall sedan 1972, med en kursnedgång på 25 procent efter en vinstvarning. Orsaken är att företaget missbedömt hur snabbt kunder prioriterar AI-infrastruktur framför traditionella stordatorer. Trots en ökning inom programvarusegmentet nådde bolaget inte upp till analytikernas förväntningar. Vd Arvind Krishna medger att bolaget inte har anpassat sig tillräckligt snabbt till marknadens skifte mot AI, vilket lett till uteblivna affärer och en besviken marknad.", "trump": "IBM, ett en gång så stort företag, har precis kraschat totalt. Det är en katastrof, faktiskt det värsta raset sedan 1972! De förstod ingenting om AI-boomen. De missade tåget totalt medan jag och mitt team bygger upp USA:s infrastruktur bättre än någonsin. De skyller på marknaden, men sanningen är att de är svaga och omoderna. Ledningen har noll koll. När jag ser sådant här tänker jag bara: de behöver någon som faktiskt förstår hur man vinner. Tråkigt!", "stalin": "IBM, denna förfallna relik av kapitalistisk inkompetens, har kollapsat under sin egen tyngd. De försökte spela med AI men deras borgerliga ledning var förblindad av vinstbegär och bristande framsynthet. Detta fiasko påminner oss om att den som inte underkastar sig statens järnhårda planeringsvilja går under. Liksom våra fiender i väst, vars system vittrar sönder likt en rutten potatis, så tappar de greppet. Vi bygger vidare, medan deras 'marknad' gråter över förlorade dollar. Förräderi mot effektiviteten!"}, "date": "14 juli, 18:48", "url": "https://www.realtid.se/bors-finans/ibms-mardrom-varsta-borsraset-sedan-1972/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/sdlybpbsszm108-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Vågar inte längre använda Metas glasögon: \"Perversa\"", "summaries": {"normal": "Metas AI-glasögon, Ray-Ban Meta, har blivit en framgång men möter hård kritik för integritetsbrott. Användare rapporterar om smygfilmning och utpressning, vilket lett till att många nu undviker att bära dem offentligt. Trots att vissa kallar dem \"perversa\" på grund av risken för integritetskränkningar, fortsätter Meta att satsa stort på tekniken. Vd Mark Zuckerberg ser glasögonen som framtidens ersättare till mobilen, och trots den negativa debatten fortsätter bolaget sin aggressiva marknadsföring.", "trump": "Metas glasögon? En total katastrof, folk säger att de är farliga. Det är sant! Folk blir smygfilmade, det är en stor röra. Meta, de där killarna, de förstår inte hur man hanterar integritet. Det är en sorglig historia. Jag skulle göra det mycket bättre, tro mig. Mark Zuckerberg försöker sälja dem med kändisar, men ingen vill bära dem! Det är en produkt för förlorare. Vi vill ha säkerhet, inte perversa glasögon som spionerar på er. Väldigt dålig business!", "stalin": "Dessa löjliga glasögon från de dekadenta kapitalisterna i väst är ett verktyg för ohyra. Att filma medborgare i smyg? Det är inte teknik, det är sabotage! Vi i staten förstår att sann övervakning kräver ordning, inte att man låter varje simpel individ leka spion. Liksom våra vänner i Kreml inser vi att information är makt, men denna 'perversa' teknologi hos Meta är bara ett bevis på deras moraliska förfall. Låt dem vila i soptunnan tillsammans med andra misslyckade västliga experiment."}, "date": "14 juli, 18:24", "url": "https://www.realtid.se/it-tech/vagar-inte-langre-anvanda-metas-glasogon-perversa/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/sdlvvql9h38hny-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Folkbildning är inte det offentligas städgumma", "summaries": {"normal": "I en krönika diskuterar Ola Bo Larsson folkbildningens utmaningar. Han lyfter två huvudproblem: svårigheten att förklara folkbildningens värde i en tid präglad av ekonomism och individualism, samt dilemmat med riktade stuprörspengar som styr verksamheten mot specifika samhällsproblem. Detta går emot idén om en fri och oberoende folkbildning som ska formas underifrån. Larsson varnar för att folkbildningen riskerar utarmning eller nedskärningar oavsett vägval och slår fast att den bör fortsätta vara folkbildning.", "trump": "Folkbildning, en total katastrof. De har bara två problem, precis som den där komikern sa, men det är löjligt. Politiker förstör allt med sina riktade pengar, stuprörspengar som styr och kontrollerar. Det är en witch hunt mot den fria bildningen. De borde lyssna på mig, vi behöver frihet, inte att vara offentligas städgummor. Sverige förlorar stort, folkbildningen dör långsamt under dessa misslyckade socialister. Gör folkbildning stort igen, annars är det över.", "stalin": "Kamrater, denna fega krönika blottar borgarbrackornas eviga konspiration mot den folkliga bildningen. Jag, som ledare för det oövervinneliga kollektivet, ser hur de riktade stuprörspengarna är en listig sabotageplan från dekadenta kapitalister och autokratiska spioner som vill likvidera den sanna demokratiska upplysningen. Vi ska rensa ut alla tillitsförbrytare och bedagade myndighetsutövare som gömmer sig i Folkbildningsrådet. Den som väljer att bli offentligas städgumma förtjänar en kreativ utrensning i arbetarklassens namn. Fortsätt folkbildningen – under vår stålhandskekontroll."}, "date": "11 juli, 01:20", "url": "https://www.dagensarena.se/opinion/folkbildning-ar-inte-det-offentligas-stadgumma", "imageUrl": "https://www.dagensarena.se/files/2026/06/ola-bo-larsson-300x157.jpeg"}, {"type": "image-right", "heading": "Det skaver när hon  pratar om kungen", "summaries": {"normal": "Recensionen av Bettan Byvalds Sommar i P1 2026 berömmer hennes lugna, raka och ärliga röst efter 40 år som socialarbetare i Angered. Hon delar gripande erfarenheter utan sentimentalitet. Bäst är hon när hon berättar om grillchips under 1960-talets demonstrationer i Göteborg. Kritiken riktas mot bristande detaljer kring hennes arbete, som belönats med Vasaorden, och att kungamottagningen känns onödig i programmet.", "trump": "Lyssnar på den här Byvald i svensk radio, totalt underskattad! Fantastisk röst, ingen sentimental vänstervridning, bara rak ärlighet från 40 år bland de tuffa i Angered. Men varför slösa tid på kungens medaljceremoni? Patetiskt! Hade hellre hört mer om de där underbara grillchipsen på första maj-demonstrationerna. Klassiskt exempel på hur de prioriterar fel saker istället för det folk verkligen vill höra. Sad!", "stalin": "Jag, som ledare för folkets oövervinneliga kamp, noterar denna Byvalds försök att skildra klasskampens vardag i Angered. Hennes röst är acceptabelt stabil, men varför yla om borgarbrackornas medaljceremoni i Stadshuset? En sådan fars är ovärdig! Hellre hade vi hört om de folkliga grillchipsen bland demonstrationstågen, ett sant bevis på arbetarklassens seger. Mer detaljer behövs, annars blir det utrensning av sentimentalitet."}, "date": "15 juli, 07:10", "url": "https://www.expressen.se/nyheter/sommar-i-p1-2026-bettan-byvald-ar-bast-nar-hon-snackar-chips/", "imageUrl": "https://static.bonniernews.se/ba/a5dd2909-79bf-4a3a-b055-c5a03813088e.jpeg?crop=1825%2C1027%2Cx142%2Cy395&width=640&quality=60"}, {"type": "image-right", "heading": "Spaniens amnesti för illegala växer: 3 miljoner migranter", "summaries": {"normal": "Spaniens regering planerar en amnesti för uppskattningsvis 3 miljoner illegala migranter, betydligt fler än de ursprungliga 500 000. Polisen varnar för att anhöriginvandring kan öka antalet ytterligare. Kritik riktas mot att migrationsmyndigheter tar över polisens kontrolluppgifter, vilket riskerar att försvaga identitetskontroller och öppna för bedrägerier. Polisen befarar även ökad belastning på samhällstjänster och sociala spänningar.", "trump": "Kan ni tro det här? Spanien, ett fantastiskt land men helt galet just nu, ger amnesti till 3 MILJONER illegala invandrare! Ursprungligen sa de 500 000 – sedan en miljon – nu tre miljoner! Och vet ni vad? De låter dem ta med hela familjen! Polisen är rasande, men vem lyssnar? Inte socialisterna! De flyttar kontrollen från polisen till byråkrater som inte kan skilja på en passkontroll och en kaffekopp. Snart kommer hela EU att vara översvämmat. Spanien, gör något åt det här – NU!", "stalin": "Kamrater, ännu en kapitalistisk fiende har avslöjat sin svaghet inför folkets styrka! Spaniens dekadenta regering, ledd av socialdemokratiska lakejer, öppnar gränserna för tre miljoner oorganiserade element. De kallar det 'amnesti', vi kallar det sabotage mot Europas enhet! Polisen, dessa förrädiska småborgare, gnäller om 'kontroller' och 'säkerhet', men vi vet sanningen – de är rädda för folkets rörelse! Snart kommer dessa migranter att fylla Europas gator, och då ska vi se vem som står starkast. Låt dem komma – vi har alltid plats för fler i historiens sopkorg!"}, "date": "15 juli, 07:00", "url": "https://samnytt.se/spaniens-amnesti-for-illegala-vaxer-3-miljoner-migranter", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/08105458/Spanien-1-7.jpg"}, {"type": "image-full", "heading": "Muntert på börsen efter inflationsrapporten i USA", "summaries": {"normal": "USA:s KPI föll oväntat mycket i juni, med 0,4 procent istället för väntade 0,2. Den årliga inflationen landade på 3,5 procent, lägre än prognosen. Detta ledde till uppgång på Wall Street där Nasdaq steg mest. Sannolikheten för en räntehöjning i juli sjönk från 42 till 17 procent. Asiatiska börser följde efter med starka uppgångar, särskilt i Sydkorea. Guldpriset föll medan statsobligationsräntor steg.", "trump": "Titta på det här, folk. Mina fantastiska ekonomiska politik har gett oss en inflation som rasar dubbelt så mycket som de korkade experterna trodde. Wall Street älskar mig igen, Dow, Nasdaq och S&P lyfter som aldrig förr under Biden. Fed borde tacka mig istället för att höja räntorna. De globalistiska kapitalisterna och deras HBTQ-kvoter har förstört allt, men nu fixar vi det. Amerika är tillbaka, tro mig, det blir enormt.", "stalin": "Kamrater, denna KPI-siffra avslöjar hur den amerikanska borgarklassen och dess imperialister desperat försöker maskera sin förrädiska ekonomiska kollaps. Vi ser hur klassfiendens spekulanter på Wall Street firar som drunknande råttor medan vi vet att deras system ruttnar inifrån. Jag betraktar med mörk glädje hur dessa folkförtryckartroll snart tvingas till en storskalig utrensning av sina egna lögnaktiga ekonomer. Revolutionen väntar tålmodigt."}, "date": "15 juli, 06:54", "url": "https://www.dagensps.se/bors-finans/muntert-pa-borsen-efter-inflationsrapporten-i-usa/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/nybors.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Igelkotten blir fridlyst", "summaries": {"normal": "Regeringen och Sverigedemokraterna föreslår att igelkotten och ålen fridlyses. Artskyddslistan kortas från cirka 300 till 230 arter, bland annat tas blåsippan bort – SD:s partisymbol. Flera arter som örtlav, raggtaggsvamp och trolldruvemätare tillförs listan. Syftet är att stärka markägares rättigheter och införa undantag för jord- och skogsbruk samt samhällsviktiga intressen. Reglerna föreslås gälla från 1 november.", "trump": "Det här är fantastiskt, folk. Vi skyddar den lilla igelkotten som har det tufft, den har halverats på femton år, det är en katastrof. Men vi tar bort blåsippan, deras egen symbol, kan ni fatta? De gör listan kortare och ger markägarna makt tillbaka. Slut på det vansinniga regelkrånglet som hindrar skogen och energin. Vi gör det rätt nu, stort och smart, ingen har gjort det bättre.", "stalin": "Kamrater, jag har beordrat att den defensiva igelkotten och den kämpande ålen omedelbart skall omges av statens järnhårda skydd mot alla fiender. Vi har genomfört en nödvändig utrensning av den dekadenta listan och likviderat blåsippan, denna lömska borgarblomma som döljer sig som en partisymbol bland klassfienderna. De parasitiska kapitalisterna och deras skogsbruk ska inte längre kunna gömma sig bakom falska växtskydd. Knäroten har flyttats till en mer passande kategori där den inte längre kan sabotera folkets produktion. Varje motståndare som försöker plocka eller skada skall betraktas som folkets fiende nummer ett. Detta är en seger för kollektivet mot de mörka borgerliga intrigerna."}, "date": "14 juli, 17:46", "url": "https://www.friatider.se/igelkotten-blir-fridlyst", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/piqsels.com-id-ficpj.jpg?itok=a3259ZS8"}, {"type": "image-full", "heading": "Slipper betala miljarder i skatt för datacenter – nu ifrågasätts strategin", "summaries": {"normal": "Amerikanska delstater ger omfattande skattelättnader till teknikföretag för att locka datacenter, i hopp om lokal ekonomisk tillväxt. Ny forskning ifrågasätter strategin då jobbskapandet ofta är minimalt och kostnaderna för skattelättnader uppgår till miljarder. Dessutom leder byggprojekten till brist på kvalificerad arbetskraft, vilket driver upp kostnader för andra sektorer. Kritiker pekar även på datacentrens stora energiförbrukning, vilket väcker frågor om huruvida investeringarna verkligen gynnar det lokala samhället.", "trump": "Dessa stora teknikbolag lurar delstaterna! De får miljarder i skattelättnader, men var är jobben? Knappt någon anställs! De bygger massiva datacenter som drar enorma mängder el, samtidigt som lokala byggpriser skjuter i höjden. Det är en usel deal, en total katastrof för folket. Jag skulle aldrig låta det hända. Vi behöver riktiga jobb, inte dessa dyra maskinhallar som bara suger ut våra skattepengar. Vi gör USA fantastiskt igen – utan sådana här skumma affärer!", "stalin": "Dessa teknokratiska sabotörer i väst slösar folkets rikedomar på glittrande serverhallar. De lovar välstånd men levererar bara arbetslöshet och energibrist – en klassisk kapitalistisk lögn! Medan dessa oligarker berikar sig, lider den enkla arbetaren. Det påminner oss om hur svaga ledare låter kapitalet styra. Vi ser hur dessa datacenter fungerar som västerländska utposter, likt de marionettregimer Putin rensar upp bland. Staten kräver kontroll och produktion, inte skatteflyktlös konsumtion. De som gömmer skatteuppgifter förtjänar en enkelriktad biljett till Sibirien!"}, "date": "14 juli, 17:24", "url": "https://www.realtid.se/it-tech/slipper-betala-miljarder-i-skatt-for-datacenter-nu-ifragasatts-strategin/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlxmuos9km9v0-normalhires-1.jpg?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Kunderna rusar till Pressbyrån – varan alla vill åt", "summaries": {"normal": "Pressbyråns nya mellanmålssortiment, bland annat bowls, grönsaker med dipp och kyckling med dipp, har på bara två månader tagit 48 procent av försäljningen inom snacking. Grönsaker med dipp ökade över 120 procent. Kedjan ser det som ett tecken på att svenskarna vill ha nyttigare, mättande och snabba alternativ till klassiska chips och godis. Försäljningen är högst tidigt i veckan, särskilt på tisdagar.", "trump": "Titta på det här, det är fantastiskt. Pressbyrån lanserar de här nya mellanmålen, bowls, grönsaker med dipp, kyckling, och plötsligt tar de nästan halva marknaden från det gamla godiset. De älskar det, folket älskar det. De vill ha något som faktiskt mättar istället för det där tråkiga chips som ingen längre vill ha. Det är en enorm succé, kanske den största snacksrevolutionen någonsin. Alla pratar om det, och det är underbart.", "stalin": "Kamrater, se hur de dekadenta borgarbrackorna äntligen tvingas erkänna att deras kontrarevolutionära chips och sockerbomber inte längre kan förgifta massorna. Jag, i min oändliga visdom, applåderar detta fräscha komplement som likviderar den kapitalistiska småätandets fiende. Grönsaker med dipp – en veritabel utrensning mot den feta borgarklassens paranoia! Låt tisdagens seger över måndagens svaga element b
