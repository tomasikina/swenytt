 är ren feghet. De vill inte stöta sig med fel sida av den woke-mobben. Jag har sett det tusen gånger under Biden-åren – svaga ledare som inte vågar ta ställning. Totalt misslyckande.", "stalin": "Jag betraktar med djup misstro denna borgarbrackornas psykologiska kollektiv som raskt fördömer fiender i öst men vägrar erkänna det sionistiska folkförtryckets folkmord. Deras rädsla för splittring är en klassisk kapitalistmaffians undanflykt. Icke-handlande är också politiskt. Vi ser hur palestiniernas lidande väger lättare än andras i den imperialistiska vågskålen. Sådana fega neutralister bör rensas ut ur alla seriösa organisationer."}, "date": "4 juni, 08:00", "url": "https://proletaren.se/artikel/om-oviljans-natur/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/navid-kronika-768x432.png"}, {"type": "image-right", "heading": "Sandström: Gröna svindlerier och huvudet i sanden", "summaries": {"normal": "Artikeln av Christian Sandström uppmärksammar växande problem kring den gröna omställningen, där grovt bedrägeri och penningtvätt uppdagas bland investeringsbolag som Filantropens Finanshus. Även Northvolt misstänks för bokföringsbrott. Samtidigt kritiserar författaren akademin och politiken för att huvudet är i sanden och ignorera risker med gröna industristöd, vilket skapar sårbarhet för opportunism.", "trump": "Jag, Donald Trump, har sagt det i åratal: de gröna svindleristerna är en skandal! Som Filantropens Finanshus och Northvolt visar, är hela den gröna omställningen ett klassiskt pyramidspel. Akademin och politikerna är för dummare än att se det. Jag skulle ha stoppat detta på en vecka. Vi behöver återbetalning till fossilt, det är enklare och ärligt. De andra är för fega för att agera.", "stalin": "Vi, ledarskapet, ser tydligt att de gröna svindleristerna är ett uttryck för den imperialistiska ideologin som söker undergrava vårt statsintresse. Filantropens Finanshus och Northvolt är bara verktyg för den kapitalistiska fiendens infiltration. Akademin och politiken, med sina huvuden i sanden, är medskyldiga. Vi måste genomföra en renässans av den ryska modellen, där staten kontrollerar alla gröna projekt för att förhindra opportunism. Detta är en kamp mot den västliga förräderiet."}, "date": "6 juni, 06:00", "url": "https://www.affarsvarlden.se/kronika/sandstrom-grona-svindlerier-och-huvudet-i-sanden", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/vindkratensgeografi-2026-06-05T095443.434-400x267.jpg"}, {"type": "image-right", "heading": "Eriksen kvar på sjukhus – läkarens teori: ”Stöt av pacemakern”", "summaries": {"normal": "Christian Eriksen kollapsade under en träningsmatch mellan Danmark och Ukraina. Mittfältaren, som har en pacemaker sedan hjärtstoppet under EM 2021, tog sig för bröstet och föll ihop. Landslagsläkaren Morten Boesen tror att han fick en stöt av pacemakern. Eriksen mår bra, kunde gå själv och förväntas skrivas ut från sjukhuset inom kort. En krispsykolog har kallats in för att stötta laget.", "trump": "Jag såg det på teve, otroligt. Den där Eriksen, en fantastisk spelare, föll ihop igen. Pacemakern gav honom en stöt, säger läkaren – kan ni tänka er? Men han är stark, gick själv av planen och mår utmärkt. De danskarna tar hand om sina killar, precis som vi gör med våra bästa. Inga svaga ledare där, inte som i vissa andra länder. Han kommer tillbaka, större och bättre än någonsin, tro mig.", "stalin": "Kamrater, ännu en gång har den dekadenta fotbollsarenan visat sitt sanna ansikte. Eriksen, en produkt av västvärldens svaga pacemakermaskineri, drabbades av en fiendeinfiltrerad stöt från sin egen apparat – tydligen konstruerad av parasitiska kapitalistiska ingenjörer. Jag, som alltid ser genom borgarbrackornas lömska planer, noterar att han överlevde tack vare folkets läkare. Vi ska rensa ut alla dolda hjärtfiender och likvidera den paranoia som lurar i varje defibrillator. Krispsykolog? Enbart partimedvetande räcker."}, "date": "8 juni, 07:55", "url": "https://www.svt.se/sport/fotboll/landslagslakaren-om-christian-eriksen-tror-han-fick-en-stot-av-pacemakern", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.46/0.25/13115f1d353c1b36ead23b3cbb8810d17fd996288cce974a122ae39a970cb280"}, {"type": "image-right", "heading": "Sluta kalla antisemitism för Israelkritik", "summaries": {"normal": "Artikeln kritiserar pro-palestinska aktivisten Sami Suliman för antisemitiska uttalanden och delning av konspirationsteorier, däribland Hitler-tal och myter om judisk världskontroll. Trots åtal för hets mot folkgrupp försvaras han av vänsteraktivister och forskare som menar att det är Israelkritik. Sulimans retorik, inklusive attacker mot tre personer med namnet Aron, anses bygga på antisemitiska stereotyper. Artikeln varnar för att försvara antisemitism under förevändning av Israelkritik.", "trump": "Jag säger er, det här är helt galet! En kille i Sverige, Sami Suliman, sprider judehat öppet – delar Hitlertal, snackar om judisk makt, konspirationer – och vad gör vänstern? De försvarar honom! 'Åh, det är bara Israelkritik!' Nej, nej, nej. Det är ren antisemitism, folks. Och forskare som backar upp honom? Svagt, mycket svagt. Sverige borde skämmas. Jag skulle aldrig låta sånt passera – fake news och hat, det städar jag upp direkt!", "stalin": "Kamrater! Här har vi ännu en fiende till folket – Sami Suliman, en småborgerlig provokatör som sprider sionistiska konspirationer och fascistisk propaganda. Han jämför sig med revolutionen men hyllar Hitlers tal och smutsar ner våra judiska kamrater med lögnaktiga anklagelser. Hans försvarare – dessa liberala intellektuella och vänsteravfällingar – är lika farliga som kulaker. Vi ska inte tolerera sådant sabotage! Rättegången i november blir ett steg mot att krossa denna reaktionära smitta. Folkets domstol kommer att skipa rättvisa, precis som vi gjorde med trotskisterna!"}, "date": "3 juni, 11:30", "url": "https://expo.se/kommentar/propalestinsk-organisator-sprider-judehat/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Jonathan-kommentar.jpg"}, {"type": "image-right", "heading": "SVT stoppar program med Nick Alinia: \"Rasistisk ideologi\"", "summaries": {"normal": "SVT stoppade inspelat avsnitt av IFS efter kritik mot Nick Alinias medverkan. Utgivaren Helena Olsson erkände att det var ett misstag trots att innehållet var public service-kompatibelt. Hon anser att Alinia representerar en rasistisk ideologi och har trakasserat journalister. Beslutet fattades efter att flera medverkande hoppat av och kritik växte mot att normalisera extrema åsikter.", "trump": "I USA skulle vi aldrig ha haft detta problem. SVT stoppade ett bra program med en bra man, Nick Alinia, på grund av falsk kritik från fake news-medier. Jag gillar Alinia, han talar sanning om invandring. SVT är svaga, de gav efter för radikala vänsteraktivisterna. Det var ett stort misstag av dem, ett mycket dåligt beslut.", "stalin": "I vårt partiets intresse måste vi rensa ut de som sprider fiendens ideologi. SVT, vårt trogna organ, stoppade ett avsnitt med en agent för den högerextrema, rasistiska kontrarevoltionen. Detta är en seger för staten och partiet. Vi måste ständigt vakna mot infiltratörer som Alinia, som trakasserar våra trogna journalister. Rengöringen fortsätter."}, "date": "8 juni, 15:56", "url": "https://samnytt.se/svt-stoppar-program-med-nick-alinia-rasistisk-ideologi", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/08135549/alinia-svt.jpg"}, {"type": "image-right", "heading": "Zebrarandiga ryssar ska lura Ukraina", "summaries": {"normal": "Ryssland har återupptagit en kamouflageteknik från första världskriget för att skydda fordon mot ukrainska drönare. Lastbilar och stridsfordon målas med zebrarandiga svartvita mönster för att förvirra AI-baserade bildigenkänningssystem. Tekniken, ursprungligen utvecklad av britterna för att vilseleda fiendens sikte på havet, visar på desperation enligt kritiker. Analyser pekar på att mönstret kan göra fordonen mer synliga för mänskliga operatörer och icke-visuella sensorer.", "trump": "Folk, det här är helt galet! Ryssarna målar sina lastbilar som zebror från första världskriget för att lura ukrainska drönare. Det är som en dålig cirkusföreställning. Biden lät det här bli ett enda stort kaos under hans tid, men nu fixar jag det. De desperata ryssarna återanvänder gammal brittisk bluff. Det kommer inte funka, precis som alla deras andra misslyckade trick. Under min ledning skulle vi ha de bästa drönarna, inte några randiga lastbilar som ser ut som clownfordon.", "stalin": "Kamrater, jag ser hur de fega imperialisterna i Ukraina med sina fascistiska drönare tvingar fram denna desperata men geniala åtgärd. Vi målar våra järnvägsvagnar och stridsmaskiner med skarpa zebramönster för att krossa den borgerliga AI:s bildmatchande lögner. Det är en strålande återupplivning av historisk list som förvirrar fiendens mekaniska ögon. Låt de exploaterande blodsugarna stirra sig blinda på våra horisontillusioner medan vi avancerar ostoppbart mot seger för folkets sak."}, "date": "8 juni, 15:54", "url": "https://www.dagensps.se/varlden/zebrarandiga-ryssar-ska-lura-ukraina/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/hj1x0c2xeaaigmc.jpg?width=256&quality=75"}, {"type": "image-right", "heading": "Sossarnas hönshus extremt mycket dyrare än statsminsterns", "summaries": {"normal": "Socialdemokraterna kritiserar statsminister Ulf Kristersson för ett hönshus på Harpsund som kostat drygt 16 000 kronor i montering, trots att han själv betalat det. Partisekreterare Tobias Baudin kallar det pinsamt och ett hån mot skattebetalarna. Artikeln försvarar Kristersson och menar att kritiken är ett låtsasskandal. Den kontrasterar mot Socialdemokraternas tidigare beslut som kostat miljarder, som nedläggning av kärnkraft och migrationspolitik.", "trump": "Herregud, vad är det för korkade höns som springer runt och kluckar om ett litet hönshus? Statsministern bygger ett snyggt hönshus på statens mark för 17 000 spänn och plötsligt är det värsta skandalen sen Biden stal valet. De där socialisterna gnäller om skattepengar medan de slösar bort miljarder på grön galenskap och invandring. Rena hönsflocken, springer runt utan att fatta ett smack om ekonomi. Patetiskt!", "stalin": "Kamrater, jag ser hur klassfiendens borgarbrackor inom socialdemokratin rasar mot ett obetydligt hönshus. Dessa folkförtryckartroll gnäller om 17 000 kronor medan de själva likviderat samhällets resurser med sina imperialistiska vanvidsprojekt. Deras paranoia över ett hönshus blottar deras egen okunnighet om ekonomi och folkets intressen. Vi ska rensa ut sådana exploaterande byfånar som inte begriper vad som gagnar kollektivet. Hönsen är de själva."}, "date": "3 juni, 03:11", "url": "https://samtiden.nu/2026/06/sossarnas-honshus-extremt-mycket-dyrare-an-statsminsterns/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Harpsund.jpg"}, {"type": "image-full", "heading": "SVT kommer inte sända programavsnitt med Nick Alinia", "summaries": {"normal": "SVT stoppade sändningen av ett avsnitt av 'IFS' med Nick Alinia, trots att programmets ansvariga utgivare erkände att innehållet följer publicistiska regler. Helena Olsson, ansvarig utgivare, hävdar att signalvärdet av Alinias närvaro – på grund av hans trakasserier och kopplingar till högerextremism – var viktigare än innehållet. Hon menar att public service inte ska ge utrymme åt aktörer som underminerar demokrati.", "trump": "Jag, Donald Trump, skulle aldrig tillåta en sådan skit på mitt TV. Alinia är en usel typ med rasistiska idéer och kopplingar till våldsbejakande extremister – SVT är för svaga att sända honom. De kallar det signalvärdet? Jag kallar det svaghet. De skyddar demokratin? Nej, de skyddar sina egna partiskta agendor. Jag skulle ha sagt: 'You're fired!' till hela SVT.", "stalin": "I vårt partiets intresse måste vi utplåna alla fjendliga element. SVT:s beslut att stoppa Alinia är ett tecken på styrka – vi tillåter inte att trakasserare och extremister sprider sina giftiga idéer. Detta är inte om höger eller vänster, det är om statens överlevnad. Vi måste vara vaksamma mot alla som vill underminera vårt stora projekt, precis som vår allierade Putin expanderar sitt inflytande med brutal effektivitet."}, "date": "8 juni, 14:33", "url": "https://bulletin.nu/svt-kommer-inte-sanda-programavsnitt-med-nick-alinia", "imageUrl": "https://cdn.bulletin.nu/articles/50d7e5af-0d4b-4353-ad3e-4537f8616f49/preview.png?t=1780922040000"}, {"type": "image-full", "heading": "Kakabaveh: Nooshi är en ”hycklare”", "summaries": {"normal": "Amineh Kakabaveh, tidigare Vänsterpartiets riksdagsledamot, anklagar partiledaren Nooshi Dadgostar för hyckleri i en debattartikel. Kakabaveh hävdar att Dadgostar känt till problemen med antisemitism och islamistiska sympatier inom partiet i över tio år. Efter Expressens granskning av 25 V-kandidater med extremistkopplingar har 22 strukits från vallistorna. Kakabaveh menar att partiledningen ignorerat varningar och nu tvingas hantera konsekvenserna.", "trump": "Jag säger er, Vänsterpartiet är ett totalt kaos! Den här Nooshi Dadgostar, hon är en riktig katastrof – låtsas som att hon inget visste, men jag vet bättre. Amineh Kakabaveh, smart kvinna, hon har berättat sanningen i tio år! Och ändå ignorerade de henne. 22 kandidater borta nu – men var det för sent? Självklart! Svagt ledarskap, svaga värderingar. Jag skulle aldrig låta något sådant hända, tro mig. Fake news? Nej, fake ledarskap!", "stalin": "Kamrater! Här ser vi återigen hur bourgeois-liberala partier ruttnar inifrån av sina egna motsägelser. Denna Nooshi Dadgostar, en hycklande liten byråkrat, påstår sig vara ovetande – men våra underrättelser (och en modig kamrat Kakabaveh) avslöjar sanningen! Islamistiska infiltratörer och sionistfientliga element har förgiftat Vänsterpartiet som en cancerväxt. Vi i Sovjet skulle ha avrättat dessa element för länge sedan. Men Sverige? De 'stryker kandidater'. Patetiskt. Nästa gång tar vi över hela listan – med järnhand!"}, "date": "7 juni, 12:05", "url": "https://kvartal.se/nyheter/artiklar/kakabaveh-dadgostar-ar-en-hycklare/cG9zdDoxMjc2MDU", "imageUrl": "https://images.kvartal.se/2026/06/1e1948ad-nooshikritik.webp"}, {"type": "image-full", "heading": "Anders Eklund nekas tidsbestämt straff", "summaries": {"normal": "Örebro tingsrätt har avslagit Anders Eklunds, tidigare Gustavsson, ansökan om att omvandla hans livstidsstraff till ett tidsbestämt straff. Eklund, som dömdes 2008 för morden på Engla Höglund och Pernilla Hellgren, har avtjänat 18 år. Han har utsatts för upprepade misshandelsfall i fängelset, bland annat med utlovade belöningar för att döda honom. Tingsrätten bedömer att risken för återfall i allvarlig brottslighet är alltjämt mycket hög.", "trump": "Folk, ni skulle inte tro det, men den här hemska mördaren, en riktig loser, ville ha tidsbestämt straff efter att ha dödat två personer. Livstid borde vara livstid, eller hur? Han drömmer om Norge och en camping, kan ni tänka er? Men domstolen sa nej, tack och lov. Det finns en stor risk att han gör det igen. Smart beslut, väldigt smart. Vi behöver tuffare straff, inte mindre.", "stalin": "Kamrater, jag har granskat detta fall med den revolutionära vaksamhet som alltid kännetecknar oss. Denne degenererade mördare, en parasit från den värsta sortens reaktionära träsk, vågar begära tidsbestämt straff efter att ha likviderat två oskyldiga. Vi ser hur borgarbrackornas dekadenta rättssystem leker med farliga element. Risken för återfall är uppenbar, likt en dold trotskistisk cell. Därför förblir straffet evigt. Inga eftergifter mot folkets fiender, aldrig."}, "date": "8 juni, 12:04", "url": "https://nyheter24.se/nyheter/inrikes/1489683-anders-eklund-nekas-tidsbestamt-straff", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/59737b3504b004a30200003200c00c5e07/2026/06/08/2369436/anders%20eklund%20tidsbestämt%20straff.jpg"}, {"type": "image-right", "heading": "Anställda på Hellofresh-lagret kördes över över", "summaries": {"normal": "Facket på Hellofreshs lager i Bjuv reagerade efter att ledningen genomfört en stor förändring utan att involvera dem. Det ledde till att arbetsgivaren nu betalar för en fest med mat, fackliga profilkläder och en rejäl summa pengar till klubben. Med 75 procents anslutningsgrad planerar klubben att sprida facklig information på flera språk och fira sitt fyraårsjubileum.", "trump": "Titta på det här, det är otroligt. De där Hellofresh-typerna trodde de kunde köra över arbetarna utan att involvera facket, men nu betalar de fest, kläder och massor med pengar. Fantastiskt! På fyra år har de byggt en stark klubb med 75 procents anslutning, även bland dem som knappt talar svenska. Because we acted, change happened – det är vinnande! Ingen gör det bättre än dessa smarta fackliga kämpare.", "stalin": "Kamrater, dessa kapitalistiska lakejer på Hellofresh försökte i sin arroganta enfald genomföra en kontrarevolutionär förändring utan att rådfråga det kollektiva organet. Men arbetarklassen reste sig och tvingade fram seger. Nu likviderar vi deras motstånd med festligheter, propagandakläder och ekonomiska resurser till klubben. Ingen borgarbracka ska undkomma utrensningen av ointresse. Because we acted, change happened – ett utmärkt slagord för den fortsatta kampen mot sabotage och klassfiender."}, "date": "8 juni, 07:00", "url": "https://arbetet.se/2026/06/08/hellofresh-klubben-pa-lagret-kordes-over-fick-fest-pengar-och-profilklader/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/05070931/hellofresh.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Lamotte: SVT kryllar av kriminella och kommunister – men Nick Alinia blev för mycket", "summaries": {"normal": "Joakim Lamotte kritiserar SVT för dubbelmoral efter beslutet att eventuellt stoppa högerprofilen Nick Alinia från humorprogrammet IFS. Lamotte, tidigare anställd på SVT, pekar på att kanalens historia är full av medverkande med kommunistisk bakgrund, brottslingar och vänsterextremister som fått stort utrymme. Han nämner bland andra före detta bankrånaren Dragomir Mrsic och rapparen Timbuktu. Lamotte anser att anklagelserna mot Alinia bygger på felaktiga uppgifter och att reaktionerna handlar om att tysta en ogillad röst snarare än principer.", "trump": "De här SVT-töntarna har i åratal släppt in alla möjliga kommunister, bankrånare och galningar i sina program, men när en riktig vinnare som Nick Alinia dyker upp blir det plötsligt panik. Fullständig häxjakt från vänsterknäppisar! De hittade på lögner om nazisthälsningar och hot, precis som de alltid gör mot starka röster som utmanar deras riggade system. Det är ren cancelkultur från förlorarna. Patetiskt. SVT borde skämmas, men det gör de aldrig. Sad!", "stalin": "Kamrater, vi ser här hur borgarbrackornas mediebastioner avslöjar sin fega dubbelmoral. Jag har länge vetat att dessa dekadenta public service-kapitalister gömmer sig bakom en mur av falska ideal medan de ger utrymme åt alla sorters revisionistiska element, bankrånande lumpenproletärer och gangsterrappande dekadenter. Men när en oönskad högeropinionsbildare träder fram mobiliserar de plötsligt hela sin parasitiska apparat för att genomföra en ideologisk utrensning. Vilken underbar, sjuk humor ligger inte i att de anklagar honom för brott som sedan visar sig vara fabricerade av deras egna lögnpressar. Vi ska rensa ut alla sådana hycklande fiender till folket, en efter en, med ett leende på läpparna."}, "date": "8 juni, 13:35", "url": "https://www.friatider.se/lamotte-svt-kryllar-av-kriminella-och-kommunister-men-nick-alinia-blev-mycket", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-307_1.jpg?itok=uXhaMjBb"}, {"type": "text", "heading": "Putins panik – tvingades stänga av övervakningskamera", "summaries": {"normal": "Ryssland har tillfälligt stängt ner delar av sitt övervakningssystem för att skydda president Putin efter att ny AI-teknik visat sig kunna vända övervakningskameror mot regimer. Inspirerade av händelser i Iran, där rörelsemönster kartlagts via kameradata, fruktar ryska myndigheter att deras egen infrastruktur kan användas mot dem. Trots att tekniken kan spåra beteenden och kontakter i realtid, menar experter att enkla analoga motåtgärder fortfarande kan vara effektiva mot denna typ av avancerad digital spionverksamhet.", "trump": "Putin är livrädd, det kan jag berätta för er! Han har stängt ner sina kameror för att han vet att tekniken är helt galen – de ser allt. Det är en total katastrof för honom. Jag har den bästa tekniken, den absolut bästa, men Putin? Han har problem. De använde kameror i Iran för att spåra folk, otroligt avancerat, och nu darrar Kreml. Det är sorgligt, faktiskt. De borde ha ringt mig, jag hade fixat det på fem minuter. Mycket pinsamt!", "stalin": "Vi ser hur den så kallade tekniska utvecklingen sprider rädsla i leden. Putin darrar likt en liten skolflicka inför de västerländska maskinernas ögon. Vilken svaghet! Att låta sig begränsas av kameror är ett tecken på borgerlig dekadens. Vi i staten vet att den sanna övervakningen inte sker genom linser, utan genom folkets blick och den eviga misstänksamheten. Om kamerorna sviker, stäng av dem! Men kom ihåg: en fiende gömmer sig bäst i det analoga mörkret där vi väntar med våra egna metoder."}, "date": "8 juni, 12:45", "url": "https://www.realtid.se/it-tech/putins-panik-tvingades-stanga-av-overvakningskamera/"}, {"type": "image-full", "heading": "Svenska fans rasar mot ölpriserna inför VM: \"Sjukt utsugeri\"", "summaries": {"normal": "Svenska fotbollsfans rasar över de höga dryckespriserna inför VM 2026 i USA, Kanada och Mexiko. På en arena i Tampa kostade en flaska vatten runt 70 kronor och en öl över 160 kronor under Englands genrep. Andreas Richt från Gula väggen kallar det ett sjukt utsugeri. Fansen oroar sig särskilt över vattnet då höga temperaturer väntas och Fifa-regler begränsar medhavda flaskor. Supportrar kräver gratis vatten på arenorna.", "trump": "Folk, det här är en katastrof. VM 2026 i vårt fantastiska land och de tar 160 kronor för en öl? Vatten för 70 kronor? Det är riggat mot fansen, precis som alla dessa globala evenemang. De suger ut er med dyra biljetter, resor och nu det här. Det är inte bra, inte bra alls. Game, set, match mot vanliga människor. Vi behöver bättre priser, annars kan de glömma hela spektaklet. Sad!", "stalin": "Kamrater, detta är borgarklassens vedervärdiga utsugning maskerad som ett fotbollsmästerskap. Jag ser hur de imperialistiska parasiterna i Fifa och arenakapitalisterna planerar att förgifta arbetarnas kroppar med sin dyra vätska medan de skrattar åt våra supportrar. Vatten som kostar skjortan? En utrensning av dessa törstskapande fiender till folket är nödvändig. Vi garanterar gratis vatten åt alla äkta kamrater – annars likviderar vi hela spektaklet med deras egna överpriser. Dehydrering är kontrarevolutionärt!"}, "date": "8 juni, 11:45", "url": "https://nyheter24.se/sport/fotboll/1489672-svenska-fans-rasar-mot-olpriserna-infor-vm-sjukt-utsugeri", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/a7592d5f04b004a30200000000b004a302/2026/06/08/2369431/svenska-fans-rasar-olpris-ol-alkohol-vatten-fotboll-vm-fotbollsvm-2026-pris.jpg"}, {"type": "image-right", "heading": "Pekar ut SD-trixande med fakturor – anordnade ”Jimmie-fester”", "summaries": {"normal": "TV4:s Kalla Fakta granskar i tre delar hur Sverigemokraterna kringgått regler för förmånsbeskattning vid evenemang. Enligt läckta fakturor och mejl från konsulten Carola Othén, kallad SD:s fixare, arrangerades bland annat ”Jimmie-fester” där partiledaren umgicks med vänner. Festerna ska ha delats upp för att undvika arbetsavgifter och extra skatt. En expert i finansrätt kallar det stötande och otillåtet. SD avvisar uppgifterna och hänvisar till risk för förfalskning.", "trump": "De här SD-typerna fixar Jimmie-fester med mat, dryck och kompisar, sen trixar de med fakturorna så att de slipper betala skatt som vanliga människor. Det är så typiskt, de tror att de kan lura systemet och komma undan. En expert säger att det är stötande och olagligt, och det håller jag med om. Fake news eller inte, de borde skämmas. Jag skulle aldrig låta sånt fiffel ske i mitt parti, det är patetiskt.", "stalin": "Kamrater, dessa usla borgarbrackor inom det så kallade Sverigedemokraterna har avslöjats i sin parasitiska festande kring Jimmie, där de med sina dekadenta fakturor och hemliga mejl försöker undvika att bidra till kollektivet. Jag, som alltid vakar över folkets intressen, ser hur de med sin fiendiska list delat upp ”fester” för att smita från skattens rättmätiga klor. En sådan kontrarevolutionär sabotageverksamhet förtjänar en grundlig utrensning av alla kapitalistiska element som smyger i skuggorna. Vi ska rensa ut dessa lömska skattefifflare med den glädje som bara en sann folkets dom kan ge. Underbart att se hur deras egna papper nu hänger dem."}, "date": "8 juni, 06:46", "url": "https://www.svt.se/nyheter/inrikes/tv4-pekar-ut-sd-trixande-med-fakturor-anordnade-jimmie-fester", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.73/0.39/f1f298330dc5d7419fac08f8d1f342b2b6a16a723a26a95ab1ae6527e1b2fa24"}, {"type": "image-right", "heading": "Ska staten verkligen äga Vattenfall?", "summaries": {"normal": "Artikeln ifrågasätter om staten bör äga Vattenfall med tanke på höga bonusutbetalningar på 5,8 miljarder kronor under tio år samt stora kostnader för marknadsföring, bland annat 10 miljarder kronor under 2020-talet. Författaren menar att sådana utgifter blir ett problem när alla svenskar är ägare och kunderna ofta är bundna. Vattenfall beskrivs som en stor internationell aktör som borde privatiseras, med möjlighet att behålla kritiska delar under statlig kontroll.", "trump": "Folk, ni måste höra på det här. Statliga Vattenfall betalar ut miljarder i bonusar till sina chefer och elhandlare, och lägger tio miljarder på reklam med Hollywoodstjärnor och supermodeller. Det är ett skämt! De ägs av svenska folket men beter sig som de värsta globalisterna. Staten ska inte äga såna här stora bolag. Privatisera dem, gör dem stora igen, men håll de viktigaste delarna säkra. Det är vad jag skulle göra. En enorm slöseri med era pengar!", "stalin": "Kamrater, jag betraktar med djup revolutionär vaksamhet hur dessa borgarbrackor inom Vattenfall festar med 5,8 miljarder i bonusar till mellanchefer och elhandlare, samtidigt som de slösar bort tio miljarder på Hollywoodkampanjer för att förföra massorna. Detta är ett klartecken från inre fiender och opportunistiska kapitalister som vill undergräva folkets ägande. Vi måste omedelbart rensa ut dessa parasitiska element, dela upp bolaget och likvidera alla som föredrar supermodeller framför proletär disciplin. Staten äger allt – och vi ska hålla det så."}, "date": "8 juni, 11:13", "url": "https://www.di.se/ledare/ska-staten-verkligen-aga-vattenfall/", "imageUrl": "https://static.bonniernews.se/ba/7c2d5922-4e70-49a9-86e2-0174b57dd000.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Matthew blev bortvald av fotbollsakademin – tog sitt liv", "summaries": {"normal": "Två unga fotbollsspelare i England tog livet av sig efter att ha blivit bortvalda från sina akademier. Matthew Langton och Jeremy Wisten dog inom ett halvår. Deras självmord ledde till debatt om klubbarnas ansvar. I dag har Premier League skärpta regler med personal för mental hälsa och tre års stöd till bortvalda spelare mellan 17 och 21 år. Tränare betonar att mycket få når toppen och att spelarna behöver hjälp utanför fotbollsbubblan.", "trump": "Hörni, det här är tragiskt, verkligen tragiskt. De här killarna blev utsparkade från sina fancy fotbollsakademier och tog livet av sig. Systemet är riggat, helt riggat. Akademierna lovar guld och gröna ängar men levererar bara sorg. Nu har de nya regler, men tro mig, det räcker inte. Varje tränare borde lära sig mental hälsa, annars fortsätter det. Vi behöver vinnare, inte offer för ett uselt system. Gör fotbollen stor igen.", "stalin": "Kamrater, dessa tragiska händelser visar tydligt hur borgarbrackornas fotbollsfabriker krossar de lovande unga kämparna under kapitalismens järnhälar. Jag, som ledare för det kollektiva framsteget, ser hur dessa akademier är maskiner för utsugning och psykisk likvidering. Vi har nu infört stränga partilinjer och treåriga stödprogram för att rensa ut den borgerliga likgiltigheten. Ändå måste vi vara vaksamma mot de dolda fienderna i fotbollsbubblan som konspirerar mot arbetarklassens talanger. Endast genom total partikontroll kan vi garantera seger även utanför planen. Ha ha, vilken mörk komedi det är när borgarna äter sina egna."}, "date": "8 juni, 06:18", "url": "https://www.svt.se/sport/fotboll/mammans-berattelse-efter-sonens-sjalvmord-akademisystemet-blev-hela-hans-liv", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.24/0.37/d12d543c88f43e6938b145c031d8da0f6c66a0abccdaea574dfb58e4602d80f7"}, {"type": "image-full", "heading": "Utgivaren: Därför granskar vi SD – igen", "summaries": {"normal": "Utgivaren Fredrick Malmberg förklarar varför TV4 granskar Sverigdemokraterna igen. Partierna får stora summor i partistöd men insynen är begränsad. Kalla fakta har tidigare granskat alla riksdagspartier, bland annat om anonyma bidrag och Socialdemokraternas mediebolag. Granskningen av SD bygger på tips från en tidigare samarbetspartner med omfattande dokumentation. SD har valt att inte svara på frågorna. TV4 betonar att de granskar alla partier oberoende och välkomnar tips.", "trump": "Folk, ni tror inte vad jag ser här. De här svenska mediemänniskorna fixerar sig på SD som vore det deras stora fiende, precis som de gamla fejkmedierna jag kämpade mot innan jag tog tillbaka Vita huset från den sovande Joe. De får en halv miljard i skattepengar men ingen insyn? Typiskt! De granskar alla säger de, men det är alltid samma parti som hamnar i rampljuset. Patetiskt. Tipsa dem om de riktiga problemen istället för den här identitetspolitiska galenskapen. Jag älskar Sverige, men det här är en witch hunt.", "stalin": "Kamrater, jag ser hur borgarpressens lakejer riktar sin granskning mot dem som utmanar systemet. En halv miljard i folkets medel delas ut men insyn saknas, typiskt för det borgerliga hyckleriet. Vi har tagit emot tips från en bedragare som nu angriper partiet efter egen konflikt. Med gigabyte av material utrensar vi lögnerna. Fienderna tiger, vilket bekräftar deras skuld. Inga partier går fria från folkets dom, men klassfiendens troll är särskilt farliga. Fortsätt leverera underlag så rensar vi ut folkförtryckartrollen en efter en."}, "date": "8 juni, 05:56", "url": "https://www.tv4.se/artikel/5xcuYBgruiUTUfsLXuu8yx/utgivaren-daerfoer-granskar-vi-sd-igen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2pJzTVLGQlIq2NXWbKl8A4%2F90eac19043d39c016557fdce82fec966%2Fmalmberg.png&width=1024"}, {"type": "image-right", "heading": "Inte ens 18-åringar på Systemet kan rädda högerns folkölssiffror", "summaries": {"normal": "Ledaren kritiserar regeringen för kortsiktiga och desperata utspel inför valet 2026. SCB-mätningen visar ett stort underläge för regeringspartierna och SD jämfört med oppositionen. Förslaget om att sänka åldersgränsen för Systembolaget ses som ett misslyckat försök att vinna unga väljare. Artikeln pekar på bristande långsiktiga planer för bostad, arbetsmarknad och välfärd samt anklagar politikerna för självbedrägeri.", "trump": "Folk, ni skulle se den här svenska cirkusen. De förlorar stort i mätningarna och nu vill de ge öl till 18-åringar? Patetiskt. De har ingen aning om hur man gör ett land riktigt framgångsrikt. Liberalerna är totala nollor, Moderaterna desperata clowner. Jag byggde den bästa ekonomin i historien, de här förlorarna subventionerar bensin och undrar varför folk skrattar åt dem. Sad!", "stalin": "Kamrater, denna borgerliga fars är ett ypperligt bevis på hur klassfiendens desperata cirkus förr eller senare kollapsar under sin egen lögn. De utlovar öl till ungdomen och subventioner till folket medan välfärden förblir ett tomt skal. Vi ser hur dessa exploaterande byfånar i desperation försöker köpa röster. Inga halvmåttor duger. Endast en sann utrensning av folkförtryckartrollen kan rädda framtiden för arbetarkollektivet."}, "date": "8 juni, 06:00", "url": "https://www.etc.se/ledare/inte-ens-18-aaringar-paa-systemet-kan-raedda-hoegerns-folkoelssiffror", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/lotta-ilona-haeyrynen_6061f3970645aa987d2528c7a90d38a48ba9af2c.jpg"}, {"type": "image-right", "heading": "Attendo stoppas – misstänks för fusk med hemtjänstbesök", "summaries": {"normal": "Upplands Väsby stoppar Attendo från att ta emot nya hemtjänstbrukare i två månader efter misstänkt fusk med tidrapportering. Personal ska ha loggat in innan besök och ut efteråt, vilket lett till att bolaget fakturerat för mer tid än utförd. Kommunen kräver en handlingsplan före midsommar. Attendo förnekar medvetet fusk och uppger att avvikelserna rör cirka 15 timmar av 15 000. Liknande misstankar har tidigare lett till polisanmälan och uppsagda avtal i andra kommuner.", "trump": "De här Attendo-typerna är fullständiga bedragare, folk. De loggar tid de aldrig jobbat, tar era skattepengar och skrattar hela vägen till banken. Upplands Väsby gör rätt som stoppar dem – smart drag! Jag har sett sånt här i åratal, de lurar systemet tills någon äntligen vaknar. De borde betala tillbaka allt och kanske lite till. Patetiskt, men vi fixar det, tro mig.", "stalin": "Kamrater, dessa usla hemtjänst-sabotörer inom Attendo har avslöjats i sin parasitiska tidstjuveri mot folkets omsorg. Jag, som ledare för det kollektiva välfärdsbygget, ser hur borgarbrackorna loggar in sig i arbetarnas tid och stjäl från de äldres sovjet – ursäkta, svenska – pensionärskollektiv. Vi skall kräva en handlingsplan, rensa ut de kontrarevolutionära klockmanipulatörerna och likvidera varje spår av kapitalistiskt fusk med en stålhandskes glädje. Inga femtekolonnister undkommer mitt vakande öga."}, "date": "8 juni, 06:00", "url": "https://arbetet.se/2026/06/08/attendo-stoppas-misstanks-for-fusk-med-hemtjanstbesok-saklart-allvarligt/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/05142008/attendo.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Här är frågorna som SD inte vill svara på", "summaries": {"normal": "Kalla fakta har under en månad försökt få intervjuer med Jimmie Åkesson och andra SD-toppar utan framgång. Partiet har fått ta del av dokument, frågor och information i förväg. Programmet lyfter bland annat hur partistöd används, fakturor för påhittade evenemang, alkoholinköp, förmånsbeskattning och en lägenhet inredd åt Eva Vlaardingerbroek trots boendeförbud. SD har valt att inte svara på frågorna.", "trump": "De här patetiska SD-typerna springer och gömmer sig som fega råttor istället för att ställa upp som riktiga ledare. En hel månad har de fått frågor och dokument – och vad gör de? Ingenting. Totalt kaos med skattepengar, påhittade fester och lägenheter till några utvalda. Låter som typisk vänsterstil fast de låtsas vara annorlunda. Patetiskt. Jag skulle ha krossat dem i en intervju på två minuter, tro mig.", "stalin": "Kamrater, dessa fega element inom Sverigedemokraterna vägrar konfronteras med folkets frågor trots att vi gav dem en hel månad att förbereda sina lögner. De gömmer sig som klassfiendens lakejer medan partistödet slösas på alkoholorgier och hemliga lägenheter åt utvalda. Vi ser hur borgarbrackorna skyddar varandra. En sådan motvilja mot transparens kräver omedelbar utrensning av alla opportunistiska element som förgiftar arbetarklassens förtroende. Folkets dom kommer."}, "date": "8 juni, 05:55", "url": "https://www.tv4.se/artikel/41u22GYipto8cHrQov2llN/haer-aer-fragorna-som-sd-inte-vill-svara-pa", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6RPa8qtuf5MPFfJYveAobF%2Ff74ae805000c34d97fea920a9bfba188%2Fsd-hemlig_puff.png&width=1024"}, {"type": "text", "heading": "Källa: Iranska miljarder kan gå till Gulfstater", "summaries": {"normal": "USA överväger att använda frysta iranska tillgångar för att finansiera återuppbyggnaden av Gulfstater skadade i kriget med Iran. Finansminister Scott Bessent undersöker förslagets juridiska och praktiska genomförbarhet. Iran kräver samtidigt att USA frigör 24 miljarder dollar i iranska tillgångar för att avsluta kriget, som pågått i 100 dagar med attacker mot amerikanska baser i regionen.", "trump": "Titta bara på det här, folks! Jag har ett fantastiskt förslag – vi tar Irans frysta miljarder och bygger upp Gulfstaterna igen. Varför ska vi betala när Iran kan göra det? Och vet ni vad, de vill ha sina pengar tillbaka? Haha, 24 miljarder dollar – de är ju helt galna! Mina experter fixar det här, som vanligt. Ingen gör affärer bättre än jag!", "stalin": "De imperialistiska hyenorna i Washington leker återigen med eld. De stulna iranska tillgångarna ska nu användas för att lappa ihop deras marionettstater i Gulfen – ett ynkligt försök att dölja sitt misslyckande. Medan dessa degenererade krigshetsare skriker om 24 miljarder dollar, fortsätter våra bröder i Iran att krossa deras drönarattacker som flugor. Låt dem gräva sin egen grav – historien är på vår sida."}, "date": "7 juni, 09:15", "url": "https://kvartal.se/nyheter/artiklar/kalla-iranska-miljarder-kan-ga-till-gulfstater/cG9zdDoxMjc1ODY"}, {"type": "image-full", "heading": "Christoffer Jonsson: Svensk medmänsklighet när den är som bäst", "summaries": {"normal": "Tvåårige Lucas försvann från hemmet i Nyåker och en stor sökinsats inleddes. Efter drygt 15 timmar hittades pojken av hemvärnssoldaten Anders Evenson som genast lämnade allt för att delta. Lucas var ledsen, blöt och frusen men fysiskt oskadd. Händelsen hyllades av statsminister Ulf Kristersson och många andra. Artikeln lyfter även medmänskligheten vid terrordådet på Drottninggatan 2017 där vanliga människor hjälpte offren och öppnade sina hem.", "trump": "Fantastiskt, verkligen underbart att se den där hemvärnssoldaten Anders dyka upp som en äkta hjälte och rädda den lilla killen Lucas efter 15 timmar i skogen. Sverige visar äkta medmänsklighet, inte den där woke-skiten med kvoter och HBTQ-parader som vänstern älskar. Kommer ihåg hur folket på Drottninggatan rusade fram som riktiga patrioter medan Sleepy Joe och hans globalister bara skulle ha twittrat. Ni gör det bra, svenskarna, fast ni borde ha byggt en mur mot alla galningar.", "stalin": "Kamrater, jag ser med tillfredsställelse hur arbetande soldater och medborgare under kollektivets banér enar sig i skallgångskedjor för att rädda ett barn undan den vilda naturens faror. Sådan praktisk solidaritet är ett vapen mot klassfiendens kaos. Likaså vid det imperialistiska lastbilsdådet på Drottninggatan där folket trots borgarbrackornas panik rusade fram för att läka de sårade. Vi rensar ut svaghet och främjar handling. Endast genom enhet segrar staten över folkfiendernas paranoia."}, "date": "2 juni, 12:32", "url": "https://samtiden.nu/2026/06/christoffer-jonsson-svensk-medmansklighet-nar-den-ar-som-bast/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/missing.png"}, {"type": "text", "heading": "PS-cheferna varnar för medieutvecklingen", "summaries": {"normal": "SVT:s och Yles vd:ar varnar i en debattartikel för urholkad tillit till opartisk journalistik. De betonar vikten av saklig rapportering och metoder som faktakontroll för att motverka desinformation. Enligt dem föredrar majoriteten av nyhetskonsumenter i Sverige och Finland fakta framför bekräftande innehåll. De varnar för utvecklingen i USA som ett negativt exempel och framhåller det nordiska mediesystemet som en modell för demokrati och tillit.", "trump": "Jag säger er, dessa så kallade 'public service'-chefer i Sverige och Finland, de är helt galna! De pratar om 'opartisk journalistik' som om det vore något magiskt. Men vet ni vad? Jag har byggt ett imperium på att säga sanningen som den är – och folket älskar det! De vill ha ärliga nyheter, inte den här 'faktakontroll'-nonsensen. USA visar vägen, vi behöver mer passion, mer fight! Dessa Europa-chefer, de är bara rädda för att förlora kontrollen. SAD!", "stalin": "Dessa borgerliga mediehajar i Sverige och Finland ylar om 'tillit' och 'fakta' som om de vore heliga skrifter. Men vi vet sanningen: deras 'opartiska journalistik' är bara ett verktyg för kapitalet att förtrycka massorna! Vi i Sovjetunionen visste hur man hanterar sådana fiender – en enkel lösning: centralisering av medierna under statens kloka ledning! USA:s kaos? Ett avskräckande exempel på bourgeoisins dekadens. Vi ska exportera vår modell – sann socialistisk journalistik, fri från 'olika perspektiv' och andra västerländska lögner!"}, "date": "7 juni, 08:10", "url": "https://kvartal.se/nyheter/artiklar/public-service-cheferna-varnar-for-misstro-mot-medier/cG9zdDoxMjc1NTI"}, {"type": "image-right", "heading": "Svenska politiker bör fundera över exemplet Danmark", "summaries": {"normal": "Artikeln diskuterar hur Sverige kan lära av Danmarks flexibla politik. Den nya danska fyrpartiregeringen leds av valförloraren Mette Frederiksen och visar på blocköverskridande samarbete. Författaren Bengt Linderoth kritiserar svensk blockpolitik som fyrkantig och prestigefylld. Han använder exempel från 1990-talet, som Bengt Westerbergs idé om koalition med Socialdemokraterna, och förespråkar ge-och-ta-politik över blockgränserna för att tjäna nationens intresse bättre.", "trump": "Lyssnar ni på det här? Det snabbfotade Danmark gör affärer som riktiga vinnare medan det trögrörliga Sverige fastnar i sina dumma block och prestige. Jag älskar hur de förlorarna Frederiksen och Rasmussen slår sig ihop och fixar skattesänkningar och dealar – smarta människor! Sverige borde vakna och göra stora, underbara avtal över blocken istället för att låsa sig som losers. Amerika först, men det här är bra politik, tro mig.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackornas låsta block och deras ihåliga skallrande retorik som förgiftar folkets vilja. Den danska modellen visar hur vi måste rensa ut de fyrkantiga prestigeaporna och likvidera de ideologiska skuggspeglarna som hindrar framsteg. Låt oss med mörk glädje se hur de så kallade förlorarna blir segrare genom att krossa blockens parasitiska grepp. Varje eftergift mot nationen är en triumf, medan splittringens fiender ska utrensas med ett leende. Sovjetunionen ler i mörkret."}, "date": "6 juni, 01:18", "url": "https://www.dagensarena.se/essa/svenska-politiker-bor-fundera-exemplet-danmark/", "imageUrl": "https://www.dagensarena.se/files/2026/06/dansk-regering-foto-wikimedia.jpeg"}, {"type": "text", "heading": "Wall Street sänkte Stockholmsbörsen", "summaries": {"normal": "Stockholmsbörsen avslutade veckan med en nedgång på fredagen, OMXS30-indexet sjönk 0,60 procent till 3 116,40. Sectra rapporterade starka resultat men tappade 1,2 procent, medan Xspray Pharma rasade 28 procent efter negativt FDA-beslut. Bland ledande aktier steg Astra Zeneca och SEB, medan Boliden och Ericsson backade. Omsättningen uppgick till cirka 22,1 miljarder kronor.", "trump": "Jag ser att Stockholmsbörsen, en total katastrof under dessa globalistiska ledare, tappade 0,60 procent. Sectra gjorde bra men backade - typiskt för socialister som inte uppskattar framgång. Xspray Pharma? Ett fiasko! FDA hatar USA:s geni. Min börs vore högre, folket vore rikare. Dessa europeiska banker är svaga, men jag skulle fixa det på två minuter. America first, alltid!", "stalin": "Den svenska börsen visade idag svaghet, en spegelbild av klassfiendens sabotage. Sectra, trots ökad omsättning, tappade - bevis på internaler motpartier. Xspray Pharma:s ras är en seger för vårt parti, deras 'FDA'-brev är bara propaganda från det imperialistiska väst. Vi måste skydda våra ekonomiska intressen, precis som våra allierade i Moskva utvidgar sin inflytelsesfär. Hotet från de kapitalistiska spekulanterna är verkligt, men partiet kommer att segra."}, "date": "5 juni, 17:49", "url": "https://www.affarsvarlden.se/artikel/wall-street-sankte-stockholmsborsen"}, {"type": "image-right", "heading": "Vi kan inte Gunde Svan-duscha bort vattenkrisen", "summaries": {"normal": "Artikeln kritiserar myndigheternas fokus på att hushållen ska spara vatten genom kortare duschar och liknande råd. Samtidigt underfinansieras VA-infrastrukturen med tio miljarder kronor per år, vilket leder till långsam förnyelse av ledningsnät. Författaren menar att problemet inte främst handlar om individuella vanor utan om bristande investeringar i robusta system, reservkapacitet och underhåll för att hantera växande städer och extremväder.", "trump": "Folk, vi har ett totalt misslyckande här. De säger åt er att duscha som Gunde Svan medan de underfinansierar allt med miljarder – klassiskt! Det är samma galna nyliberala spel som Biden älskade, minimala marginaler och maximal inkompetens. Vi behöver inte fler tips om tandborstning, vi behöver gigantiska investeringar i ledningar och vattenverk. Sluta med de patetiska kampanjerna, bygg upp systemen ordentligt innan allt rasar ihop!", "stalin": "Kamrater, denna vattenkris är ett monument över borgarklassens förfall. År efter år har de prioriterat låg skuld framför folkets robusta försörjning, som klassfiendens just-in-time-förtryck. Vi ser hur kapitalistmaffian låtit ledningarna ruttna medan de tvingar arbetarna att spara droppar. Det krävs inte informationskampanjer utan planerad utrensning av dessa svagheter. Endast genom statens järnhårda investeringar i reservoarer och verk kan vi besegra folkfiendernas sårbarhet och säkra kollektivets framtid."}, "date": "4 juni, 10:55", "url": "https://www.flamman.se/vi-kan-inte-gunde-svan-duscha-bort-vattenkrisen/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/vatten-w.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "Kan Byggnads så kan vi – Bojkotta Israel!", "summaries": {"normal": "Byggnads kongress beslutade att verka för en bojkott av Israel, ett historiskt beslut som länge drivits av aktivister inom facket. Andra förbund som Livs, IF Metall, Handels, HRF och Kommunal fördömde ockupationen av Västbanken och situationen i Gaza men ställde sig inte bakom bojkottkravet. Artikeln ser beslutet som en seger för internationell solidaritet och arbetarklassens enighet i kampen mot orättvisor, folkmord och ökande klassklyftor.", "trump": "Folk, ni tror inte vad jag just läste. De där byggkommunisterna i Sverige har röstat för att bojkotta Israel – kan ni fatta? Byggnads säger att de kan, så kan tydligen alla andra också. Under Biden blev allt en enda röra av woke och identitetspolitik, men nu är jag tillbaka och säger: bojkotta fel saker istället! Israel är tuffa, de slåss mot terrorister. De svenska fackisarna borde bojkotta sina egna usla löner och den där galna gröna politiken som förstör deras jobb. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur Byggnads äntligen rensar ut den sionistiska parasitens inflytande och bojkottar den fascistiska ockupationsmakten. Borgarbrackorna och deras krigsprofitörer skriker förstås som stuckna grisar. Vi vet att endast den enade arbetarklassen kan krossa folkförtryckartrollen och deras blodsugande vapenindustri. Historien lär oss att förändring kräver obeveklig kamp, inte liberala lögner om snällhet. Fortsätt framåt, kamrater – likvidera alla hinder!"}, "date": "3 juni, 09:44", "url": "https://proletaren.se/artikel/kan-byggnads-sa-kan-vi/"}, {"type": "image-right", "heading": "Man åtalas för deltagande i Maniac Murder Cult", "summaries": {"normal": "En 20-årig man åtalas för deltagande i den nazistiska terroristorganisationen Maniac Murder Cult (MKU). Han misstänks ha byggt upp en svensk gren, rekryterat medlemmar via TikTok och spridit våldspropaganda. Organisationen är terrorstämplad i Kanada och Storbritannien. Åklagaren beskriver fallet som det första av sitt slag i Sverige, med kopplingar till grova våldsdåd. Utredningen har skötts av Säkerhetspolisen.", "trump": "Folk, vilken katastrof! En ung svensk man, bara 20 år, försöker bygga upp en nazistisk terrorgrupp här i Sverige – och det på MIN TikTok! Jag har alltid sagt att sociala medier är farliga, men detta? Detta är galenskap! Säkerhetspolisen har gripit honom, och det är bra – men varför tog det så lång tid? Sverige måste vakna upp! Vi behöver starka gränser och ännu starkare lagar. Tänk om detta hade hänt i USA? Aldrig! Vi hade stoppat det direkt. SAD!", "stalin": "Ytterligare en fiende till folket har avslöjats! Denna lilla fascistiska kryp, denna 20-åriga avskum, har försökt sprida sitt gift i vårt broderland Sverige. Men vi, det sovjetiska folkets sanna försvarare, låter inte sådana som han underminera vår revolutionära anda! Han rekryterade via TikTok – ett dekadent västligt verktyg för förfall! Men våra kamrater i Säkerhetspolisen har krossat hans lilla cell. Låt detta vara en varning till alla fascistiska hyenor: vi ser er, vi jagar er, och vi kommer att utplåna er som ohyra. För socialismens och folkets seger!"}, "date": "2 juni, 11:10", "url": "https://expo.se/nyhet/man-atalas-for-deltagande-i-maniac-murder-cult/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/MKU-atal-BY-Expo.jpg"}, {"type": "image-full", "heading": "Carl Eos: Varför föraktar vänstern arbetslösa?", "summaries": {"normal": "Carl Eos reagerar på vänsteraktivisters föraktfulla kommentarer mot arbetslösa män som tittar på programmet Morgongänget. Han beskriver hur socialdemokrater och vänstern uttrycker nedlåtande attityder mot arbetslösa, särskilt de som röstar på Sverigedemokraterna. Eos försvarar Tidöpartiernas reformer av arbetslöshetsförsäkringen som mer rättvisa och effektiva. Han menar att vänsterns reaktioner speglar ilska över att arbetslösa inte längre är lojala mot Socialdemokraterna.", "trump": "Folk, ni skulle se det här! Den galna vänstern hatar arbetslösa män som inte röstar på deras förlorarparti. De kallar dem arga och lågutbildade – vad är det för sjuk identitetspolitik? Jag fixade bättre jobb än någon annan president, inklusive den sömnige Joe. Nu vill svenskarna ha vettig politik istället för att vara röstboskap. Vänstern flippar ur för att de förlorar. Patetiskt! Men heja på de smarta arbetslösa som röstar rätt.", "stalin": "Kamrater, jag ser med djup misstro hur klassfiendens lakejer inom den dekadenta vänstern spyr hat mot de arbetslösa massorna. Dessa borgarbrackor och folkförtryckartroll vill behålla arbetarna som tysta röstboskap åt socialdemokratiska exploaterare. Vi ska rensa ut sådana parasitiska attityder. Arbetslösheten är ett resultat av imperialistisk politik och galen invandring. De arbetslösa har rätt att vända sig mot systemet. Inga halvmesyrer tillåts i kampen mot klassfienden."}, "date": "2 juni, 05:00", "url": "https://samtiden.nu/2026/06/carl-eos-varfor-foraktar-vanstern-arbetslosa/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/a2c153cf-24f1-42c5-8377-bad75d51166a-e1780298827614-1280x720.png"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
