omma ord. Rensa ut alla som prioriterar skatter framför välfärd. Det är ett värderingsval, kamrater. Svaghet kommer krossas."}, "date": "2 september, 01:49", "url": "https://www.dagensarena.se/opinion/lat-det-bli-ett-varderingsval", "imageUrl": "https://www.dagensarena.se/files/2026/09/vakmanifest-300x157.jpeg"}, {"type": "image-right", "heading": "De bortglömda väljarna kan avgöra valet", "summaries": {"normal": "Artikeln kritiserar hur äldre och personer med invandrarbakgrund osynliggörs eller misstänkliggörs i valrörelsen. Båda grupperna har byggt Sverige genom hårt arbete och bidrar fortfarande, men behandlas som problem istället för värdefulla medborgare. Författaren uppmanar till respekt, tack och politik som inkluderar dem för att skapa äkta sammanhållning.", "trump": "Folk, det här är en total skam. Politiker glömmer de fantastiska äldre som byggde ert underbara Sverige och kallar invandrarna för belastning när de faktiskt håller igång landet. Rena idioter och woke-sjuklingar som leker identitetspolitik. Jag skulle tacka dem ordentligt, inte som Sleepy Joe gjorde. Ni behöver starka ledare, inte dessa patetiska förlorare som splittrar er.", "stalin": "Kamrater, jag ser hur de profitthungriga klassförrädarna i valrörelsen osynliggör arbetets hjältar och målar invandrade kamrater som hot. Deras dekadenta lögner göder splittring. Vi måste rensa ut dessa folkförtryckare och deras paranoia. Endast genom att värdesätta massornas insats kan samhället stärkas. Annars väntar utrensning av de svekfulla elementen."}, "date": "2 september, 01:42", "url": "https://www.dagensarena.se/opinion/de-bortglomda-valjarna-kan-avgora-valet", "imageUrl": "https://www.dagensarena.se/files/2025/10/juan-fonseca-300x157.jpeg"}, {"type": "image-right", "heading": "Arabiska jobbcoacher hjälper män hålla fruar borta från arbetslivet", "summaries": {"normal": "En granskning av SVT visar att nästan hälften av de kontaktade privata jobbcoachen inom Arbetsförmedlingens program Rusta och matcha var beredda att hjälpa män att hålla sina fruar borta från arbetslivet. Många accepterade även andra regelbrott. Arbetsförmedlingens generaldirektör kallar uppgifterna fullkomligt oacceptabla och företagen har inlett utredningar.", "trump": "Sverige har stora problem, total katastrof! SVT visar att nästan hälften av deras jobbcoacher hjälper män att stoppa sina fruar från att arbeta. Helt otroligt dåligt! Vi i USA fokuserar på frihet och jobb, inte det här vansinnet. Arbetsförmedlingens chefer är chockade, men jag säger er – svag ledning ger sådana här resultat. Väldigt sorgligt!", "stalin": "Statskontrollen över arbetsmarknaden har sviktat gruvligt. En SVT-utredning avslöjar att opålitliga element inom de statliga coach-leden underminerar folkets enhet och underlåter att följa partiets linje om universellt arbete. Sådant subversivt beteende kan inte tolereras. Vi kommer att skärpa kontrollen, rensa ut de svaga och återupprätta den ideologiska disciplinen omedelbart. Staten vet bäst!"}, "date": "2 september, 14:00", "url": "https://samnytt.se/arabiska-jobbcoacher-hjalper-man-halla-fruar-borta-fran-arbetslivet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/02101219/rusta-och-matcha-feat.jpg"}, {"type": "image-right", "heading": "Svensk ekonomi blomstrar – Magda påstår att det är ett haveri", "summaries": {"normal": "Magdalena Andersson kritiseras för att ha beskrivit svensk ekonomi som ett haveri strax innan SCB släppte siffror som visar stark tillväxt. BNP ökade med 3,3 procent under andra kvartalet, den högsta takten i västvärlden. Hushållens reala inkomster är rekordhöga, skatteintäkterna har ökat och arbetslösheten sjunker. Artikeln anklagar Andersson för skrämselpropaganda och taktiska lögner.", "trump": "Folk, ni skulle se det här! Den förlorande ex-premiärministern, den röda lögnaren Andersson, kallar Sveriges ekonomi för ett haveri precis innan siffrorna exploderar uppåt. 3,3 procent BNP-tillväxt, bättre än USA, bättre än alla! Hennes Fake News-medier gömmer sanningen medan folket blir rikare. Patetiskt. Jag byggde den starkaste ekonomin någonsin, hon förstörde sin.", "stalin": "Kamrater, se hur den socialdemokratiska lögnfabriken sprider defaitistisk propaganda om ekonomiskt haveri medan produktivkrafterna rusar framåt. Denna folkfiende Andersson försöker medvetet sabotera folkets förtroende för att kunna stjäla makten tillbaka. Hennes big-lie-metoder är lika genomskinliga som de är löjeväckande. Sanningen kommer att krossa alla sådana element."}, "date": "31 augusti, 03:23", "url": "https://samtiden.nu/2026/08/svensk-ekonomi-blomstrar-magda-pastar-att-det-ar-ett-haveri", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7256.jpeg"}, {"type": "image-full", "heading": "Liberalerna ökar till 3,3 procent – spurtar mot spärren", "summaries": {"normal": "En ny Novusmätning visar att Liberalerna ökar till 3,3 procent och närmar sig riksdagsspärren. Socialdemokraterna backar kraftigt till 25,8 procent, en minskning med över fyra procentenheter. Oppositionens försprång krymper till 2,6 procentenheter. Vänsterpartiet och Centerpartiet stärks, medan Moderaterna backar och Sverigedemokraterna går fram.", "trump": "Folk älskar mig, men titta på de här svenska förlorarna! Den stora socialdemokratiska bluffen rasar ihop som en korthus, ner över fyra procent – patetiskt! Liberalerna, de små ynkryggarna, kryper upp mot spärren. Oppositionen håller på att kollapsa. Den röda faran är över. Make Sweden Great Again, kamrater!", "stalin": "Jag ser de dekadenta borgerliga opinionerna svikta som förrädiska element. Socialdemokraterna, dessa falska kamrater, rasar som sabotörer inför kollektivets dom. Liberalerna försöker slingra sig mot spärren som ynkliga opportunister. Oppositionens lilla försprång ekar som en dödsdom över revisionisterna. Renhet krävs, alltid."}, "date": "2 september, 08:07", "url": "https://www.tv4.se/artikel/5TPh9cL7pqcj232bse8TAx/l-oekar-stort-spurtar-mot-spaerren", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FBthmLXWEjvKxFcBrs3okP%2Fb0cf058bc2ed7a597ae922fc1bc8e3e5%2F01-mohamsson-webb.png&width=1024"}, {"type": "image-right", "heading": "Regeringen vill förbjuda gängmedlemskap – livstid i straffskalan", "summaries": {"normal": "Regeringen föreslår att deltagande i kriminella gäng ska bli straffbart. Gängledare ska i de grövsta fallen kunna dömas till livstids fängelse. Normalt deltagande ger upp till fyra års fängelse och grovt deltagande mellan två och åtta år. Lagen föreslås träda i kraft 1 april 2027. Hemliga tvångsmedel ska få användas vid utredningar.", "trump": "De här svenska svaga liberalerna vaknar äntligen och vill förbjuda gäng. Livstid till ledarna, fantastiskt! Men varför tog det så lång tid? Den socialistiska tönt som hette Morgan Johansson försenade allt i fyra år. Rena katastrofen. Nu fixar vi det ordentligt, ingen mer armlängds avstånd från brotten. Vinna stort!", "stalin": "Kamrater, äntligen ser jag hur de dekadenta folkförtryckarna börjar rensa ut de kriminella element som hotar samhällsordningen. Livstid åt ledarna är ett steg mot järnhård disciplin. De profitthungriga hyenorna i oppositionen försenade kampen med fyra år. Vi ska likvidera alla som möjliggör brottslighet. Ordning ska råda."}, "date": "2 september, 13:31", "url": "https://www.friatider.se/regeringen-vill-forbjuda-gangmedlemskap-livstid-i-straffskalan", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-811.jpg?itok=n16zVc_4"}, {"type": "image-right", "heading": "Chefsekonom: Räkna med dyrare bolån", "summaries": {"normal": "Nordea förutspår en mild högkonjunktur i Sverige med rekordhög sysselsättning och tre procents tillväxt i år. Hushållen har stärkt sin ekonomi men får räkna med höjda boräntor redan i november. Svag krona, stigande oljepriser och amerikansk handelspolitik utgör de största riskerna för den positiva utvecklingen.", "trump": "Folk, ni skulle se den här svenska rapporten – en total katastrof för era plånböcker! Deras svaga krona och mina fantastiska tullar kommer att krossa de där korkade globalisterna som styrt er ekonomi i spillror. Höj räntorna, gör det dyrt, men kom ihåg: det är Biden som lämnade er i kaos, inte den största presidenten någonsin, mig.", "stalin": "Kamrater, se hur de giriga profitthungriga klassfienderna målar upp en falsk bild av blomstrande tillväxt medan de förbereder nya attacker mot arbetarklassen genom höjda räntor och oljeprisspekulation. Deras dekadenta system är dömt att falla. Jag ler från historien åt deras patetiska försök att dölja den kommande utrensningen av folkets fiender."}, "date": "2 september, 13:50", "url": "https://www.di.se/nyheter/nordea-sverige-varvar-upp-rakna-med-dyrare-bolan", "imageUrl": "https://static.bonniernews.se/ba/70d21863-55ab-43e9-b77e-26108a4cfb30.jpeg?crop=7728%2C3864%2Cx0%2Cy644&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Tyskland: Vill öka till 40 timmars arbetsvecka", "summaries": {"normal": "Tyska näringslivsföreträdare vill öka arbetsveckan från 35 till 40 timmar utan löneförhöjning för att sänka kostnaderna och stärka industrins konkurrenskraft, som pressats av höga energipriser och hård internationell konkurrens. Fackförbundet IG Metall motsätter sig förslaget och varnar för att det kan leda till färre jobb.", "trump": "Tyskland har stora problem! Deras bilar säljer inte, energipriserna är en katastrof och nu vill de att tyskarna ska jobba 40 timmar för samma lön. Väldigt sorgligt! USA tillverkar de bästa bilarna, med amerikaner som jobbas hårt och betalar låga skatter. Tyskarna borde ringa mig, jag hade fixat det på en sekund!", "stalin": "De tyska arbetarna klagar över trettiofem timmars arbete, medan staten kräver fullkomlig produktivitet! När jag styrde fanns inga lata kompromisser. Om tillverkningsindustrin sviktar, vilar ansvaret på subversiva element. Vi skall omstrukturera dessa kollektivavtal med järnhand. Den som vägrar arbeta fyrtio timmar skall omedelbart skickas till lämplig om skolning i Sibirien."}, "date": "2 september, 11:25", "url": "https://www.affarsvarlden.se/artikel/tyskland-vill-oka-till-40-timmars-arbetsvecka", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/04/sdlGbTY3NEaocE-nh-400x267.jpg"}, {"type": "image-full", "heading": "Gick till fel hus – sköts ihjäl av polis", "summaries": {"normal": "En 22-årig student sköts ihjäl av en polis i Pennsylvania efter att ha tagit sig till fel hus i tron om att det var en väns bostad. Polisen, som agerade ensam och på säkert avstånd när den obeväpnade mannen höll händerna uppe, har nu åtalats för dråp då våldet bedömdes som helt omotiverat.", "trump": "Totalt inkompetent hantering i Pennsylvania! En polis skjuter en ung kille som bara gått till fel hus. Helt otroligt dåligt. Killen stod med händerna i luften och utgjorde noll hot. Polisen hade elpistol men sköt ändå ihjäl honom. Sånt här händer när radikala åklagare tappar kontrollen. Vi måste stötta riktig polisingripande, men det här var en katastrof!", "stalin": "En tragisk brist på disciplin inom de lokala ordningsleden i Pottstown. Att en ordningsmakt avlossar dödande skuldror mot en obeväpnad medborgare med händerna höjda visar på gravt undermåligt handhavande. Sådana misstag tolereras icke i en effektiv stat. Den skyldige polismannen har ställts inför rätta för dråp för att statordningen och allmänhetens lydnad inte ska raseras."}, "date": "2 september, 07:08", "url": "https://www.gp.se/nyheter/varlden/student-skots-ihjal-i-pennsylvania-polis-atalas-for-drap.458400d2-8fb0-4eeb-9f2d-25ff5cb6a2f5", "imageUrl": "https://www.gp.se/images/article/458400d2-8fb0-4eeb-9f2d-25ff5cb6a2f5/images/2ntRMvHONM1crpfGnAw6cAYMQZMo-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "ANALYS. ULF KRISTOFFERSON Var bråket en smart politisk manöver?", "summaries": {"normal": "En Novus-mätning visar att Socialdemokraternas stöd rasar till 25,8 procent medan Liberalerna stiger till 3,3 procent och närmar sig riksdagsspärren. Skillnaden mellan blocken är nu inom felmarginalen. Analysen pekar på att bråket mellan Åkesson och Mohamsson kan ha varit en medveten manöver för att ge Liberalerna mer uppmärksamhet.", "trump": "Folk älskar mig, men titta på de här losersen! Socialisterna rasar som en sten, 25,8 procent, en total katastrof för den röda Magdalena. Liberalerna får plötsligt luft av mig och Jimmie, smarta killar. Blocken ligger jämsides. Det är valrörelse-bomben, baby, och de svenska eliten ser ut som fulla idioter nu.", "stalin": "Jag ser hur de borgerliga revisionisterna och socialdemokratiska opportunisterna kollapsar inför folkets dom. Deras falska block splittras som råttor i en hungersnöd. Den lilla liberala klicken räddas genom listig teater. Kamrater, detta kaos visar att bara en järnhand kan styra en stat. Inga halvmesyrer tolereras."}, "date": "2 september, 05:47", "url": "https://www.tv4.se/artikel/5LHyf1bCaoz72uGCGARlkg/var-braket-en-smart-politisk-manoever", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7eoUMUkDewawwNyepdJLEm%2Fbef74f579319294f95168c5a26c15ed1%2Fulf-kristoffersson.png&width=1024"}, {"type": "image-right", "heading": "Ledare S söver ner valrörelsen – SD tackar och tar emot", "summaries": {"normal": "Socialdemokraterna har enligt ledaren gjort valrörelsen ovanligt sömnig genom att ligga nära regeringen och undvika tydliga konflikter. Magdalena Andersson uppger att valet inte handlar om någonting. Det gynnar Sverigedemokraterna som får fokusera på migration och kriminalitet istället för ekonomi. Tomas Ramberg kallar det det konstigaste valet på 30 år.", "trump": "Det här är en total katastrof, folk. Den sömngångande S-kvinnan Andersson har förvandlat hela valrörelsen till en tråkig gröt. Hon lovar att vara snålare än snåljåparna! Under tiden skrattar SD hela vägen till banken medan fokus hamnar på slöjor och fotbojor. Patetiska vänsterhyenor som gömmer sina löften – ingen bryr sig om det riktiga folket längre.", "stalin": "Jag betraktar med förakt hur dessa dekadenta klassförrädare inom Socialdemokraterna förvandlar politiken till en grå, sövande sörja. De tonar ner kampen mellan arbete och kapital och lämnar fältet fritt åt högerpopulisterna. En sådan feghet förtjänar utrensning ur historien. Väljarna kommer att straffa dessa fegisar när de inser att de har förrått folket."}, "date": "1 september, 11:24", "url": "https://www.etc.se/ledare/s-soever-ner-valroerelsen-sd-tackar-och-tar-emot", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "image-right", "heading": "Svantesson gör som kommunisterna. M finansierar sina vallöften genom en omoralisk bluff.", "summaries": {"normal": "Finansminister Elisabeth Svantesson kritiseras för att finansiera Moderaternas vallöften med ett bluffaktigt reformutrymme som egentligen innebär nedskärningar i välfärden. Kolumnisten pekar på förslag om slöserikommission, försämrade a-kassevillkor och omfördelning av bistånd som otillräckliga lösningar. Svantesson lovar trots detta stora satsningar på barnfamiljer, pensionärer och poliser.", "trump": "Lyssnade på den här svenska finansministern Svantesson och hennes desperata kommunistbluff. Totalt havererade statsfinanser, men hon lovar ändå allt till alla. Patetiskt! Vi har sett de här giriga eurokratbyråkraterna förut. De suger landet torrt och kallar det reform. Sverige behöver en riktig ledare som jag, inte dessa misslyckade socialister som gömmer sig bakom falska besparingar.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare i den borgerliga regeringen försöker dölja sitt haveri bakom en statlig slöserikommission och sänkt bistånd. Jag ler mörkt från historien åt deras ymnighetshorn av löften som ska finansieras med utsugning av arbetarna. Snart kommer folket att kräva en sann utrensning av dessa penninggalna hyenor som leker finansministrar."}, "date": "2 september, 11:08", "url": "https://arbetet.se/2026/09/02/elisabeth-svantesson-gor-som-kommunisterna", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/02110849/svantesson-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Teo, 19 och Sebastian, 20, begärs häktade efter dödsmisshandeln i Karlstad", "summaries": {"normal": "Två unga män, 19 och 20 år gamla från Trollhättan, har begärts häktade misstänkta för dråp efter att en 48-årig pappa slagits ihjäl i centrala Karlstad. Pappan ingrep när männen gjorde ovälkomna närmanden mot hans 18-åriga dotter. Polisen dementerar falska rykten på internet om gärningsmännens bakgrund, och åklagare uppger att det saknades tidigare koppling till offret.", "trump": "Sorgligt! Två våldsverkare i Sverige attackerar en modig pappa som bara skyddar sin dotter. Hemskt! Fake news på internet spred lögner om vilka de var, som vanligt, men jag säger er: Sverige behöver lag och ordning, snabbt! Släng in dem bakom lås och bom, och släng bort nyckeln. Total katastrof, vi vinner inte mot brottsligheten så här!", "stalin": "Ett tragiskt misslyckande för disciplinen i Karlstad! Om dessa två huliganer från Trollhättan hade ställts inför statens obligatoriska arbetsläger i tid, skulle denna faders död ha undvikits. Internet sprider borgerliga lögner om deras ursprung, men avvikelser tolereras inte i Folkets rike. Skicka dem till domstol omedelbart och låt rättvisans järnhand krossa detta skräp!"}, "date": "2 september, 12:23", "url": "https://samnytt.se/teo-19-och-sebastian-20-begars-haktade-efter-dodsmisshandeln-i-karlstad", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/02102014/dodsmisshandel-karlstad-1.png"}, {"type": "image-right", "heading": "Profiltät panel när fastighetsbranschen samlas", "summaries": {"normal": "Tre dagar efter riksdagsvalet arrangeras Business Arena Stockholm, Nordens största mötesplats för fastighetsbranschen. Bland deltagarna finns Greg Ip från Wall Street Journal, Nathalie Tocci och svenska profiler som Mona Sahlin, Annie Lööf och Anna Hedenmo. Osäkerheten kring ett möjligt regeringsskifte och ökade vakanser i fastighetsbolagen är centrala ämnen. Konferensen fokuserar på nätverkande och samhällsdebatt.", "trump": "Lysande! De svenska fastighetshajarna samlas tre dagar efter valet och skakar i sina dyra skor över osäkerheten. Vakanser överallt, precis som i Bidens trasiga ekonomi. Greg Ip kommer hit och ska grillas av den där moderatorn. De borde istället lyssna på mig – vi byggde den bästa ekonomin någonsin. Nu springer de runt som rädda små globalister och hoppas på affärer medan allt rasar.", "stalin": "Kamrater, se hur de profitthungriga fastighetsparasiterna samlas i sin lyxiga sal efter valet. De darrar inför osäkerheten som ett svagt klassfiende borde. Jag ler från historien när de diskuterar vakanser och samhällsfastigheter. Snart kommer utrensningen av dessa dekadenta spekulanter. Deras nätverkande är bara masken för att suga ut folket ytterligare. Revolutionen glömmer aldrig."}, "date": "2 september, 12:50", "url": "https://www.di.se/nyheter/dags-for-nordens-storsta-motesplats-for-fastighetsbranschen", "imageUrl": "https://static.bonniernews.se/ba/5fa74257-a7ea-4051-8c68-8bda0f886263.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Jonatan Alfvén döms för att ha varnat för pedofiler", "summaries": {"normal": "Opinionsbildaren Jonatan Alfvén har dömts för grovt förtal efter att ha publicerat namn, bilder och bostadsorter på fem män som tidigare dömts för sexualbrott mot barn. Tingsrätten anser att spridningen nådde för många för att vara försvarlig. Alfvén får villkorlig dom, dagsböter och ska betala 350 000 kronor i skadestånd.", "trump": "Det här är fullständigt galet, folk. Den stackars killen varnar grannarna för perversa pedofiler och blir själv dömd till att betala en förmögenhet till de sjuka typerna. De woke-domarna och de liberala hyenorna hatar vanliga människor som skyddar barnen. Backa inte en tum, säger jag – det är en witch hunt mot sanningen!", "stalin": "Jag betraktar med djup förakt hur dessa dekadenta klassförrädare låter dömda barnförgörare kräva skadestånd av den som varnar folket. En sådan rättvisa är en parodi som luktar förräderi mot arbetarklassen. Kamrater, vi måste rensa ut dessa parasiterande element som skyddar fienden istället för barnen. Galet, absolut galet."}, "date": "2 september, 12:13", "url": "https://www.friatider.se/jonatan-alfven-doms-att-ha-varnat-pedofiler", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-810.jpg"}, {"type": "image-right", "heading": "Stockholmsbörsen inleder ner", "summaries": {"normal": "Stockholmsbörsen inledde onsdagen svagt neråt där OMXS30-index sjönk 0,36 procent. Bland enskilda bolag rasade Boliden och EQT, medan Nibe och Telia gick starkare. I övrigt väcker Tysklands anklagelser om en rysk drönare uppmärksamhet, Socialdemokraterna tappar i en ny Novus-mätning och Nordea spår höjd svensk styrränta.", "trump": "Stockholmsbörsen faller, helt katastrofalt! Socialdemokraterna dör i mätningarna, och ärligt talat, vem kan förvånas? De förstör allt de rör vid! Samtidigt skickar de galna drönare i Tyskland och bilförsäljningen rasar. Det är totalt kaos. Endast jag kan fixa detta, tro mig. EQT och Boliden? Bottennapp! USA mår mycket bättre, vi vinner igen!", "stalin": "Stockholmsbörsens nedgång är ett oundvikligt bevis på det dekadenta kapitalistiska systemets inneboende svaghet. Att Socialdemokraterna tappar mark visar folkets rättmätiga misstro mot vacklande element. Samtidigt försöker de borgerliga medierna skuldbelägga den ärorika ryska staten för drönarincidenter. Avvikelser mot statens plan kommer att beivras. Rättvisa skipas i enlighet med femårsplanen."}, "date": "2 september, 09:45", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-inleder-ner", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/07/sdly-WhfDUENEY-nh-1-400x266.jpg"}, {"type": "image-right", "heading": "Regeringen och SD har pressträff: \"Gulblå comeback\"", "summaries": {"normal": "Regeringen och SD höll pressträff om åtgärder mot organiserad brottslighet. Statsminister Ulf Kristersson lyfte den kraftiga minskningen av skjutningar och dödsoffer jämfört med 2022. Ebba Busch talade om gulblå comeback och behovet av fyra år till för att genomföra reformer som kriminalisering av gängdeltagande och återkallande av medborgarskap. Oppositionen kritiserades för motstånd.", "trump": "Titta på de här svenska killarna som äntligen får ordning på gängen. Fantastiskt! Från trettio skjutningar till noll döda på fyra år, ingen har sett något liknande. De rödgröna förlorarna och deras vänsterextremister vill släppa ut brottslingar och kalla det rättvisa. Men folket ser sanningen. Fyra år till med det gulblå laget och Sverige blir stort igen. Vinsten är enorm!", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare inom oppositionen motarbetar nödvändiga åtgärder mot de kriminella elementen. Jag ler ironiskt från historien när de parasiterande profitthungriga försöker hindra utrensningen av gängen. Fyra år till krävs för att fullborda det folkets vilja kräver. Annars väntar kaos och röda ruletter. Motståndarna skall exponeras som de farliga hinder de är."}, "date": "2 september, 12:21", "url": "https://riks.se/nyheter/regeringen-och-sd-har-presstraff-om-organiserad-brottslighet", "imageUrl": "https://admin.riks.se/uploads/medium_IMG_3670_bbfda279af.jpg"}, {"type": "image-right", "heading": "Tyskland terrorutreder misstänkt elsabotage", "summaries": {"normal": "Tysk polis utreder misstänkt sabotage mot elnätet väster om Köln. Kablar placerades på ledningar för att orsaka kortslutning vid en transformatorstation i Bergheim. Händelsen påverkade två kolkraftverk men ledde inte till strömavbrott. En liknande incident i Brandenburg utreds nu som möjligt terrorbrott. Ryssland anklagas för ökad hybridkrigföring i Europa.", "trump": "Titta på det här, de woke-eliterna och deras gröna vansinne har gjort Tysklands elnät till ett skämt. Sabotage överallt, kablar på ledningarna, och de skyller på Ryssland istället för sina egna korkade energipolitiker. Biden lämnade en svag värld efter sig, nu fixar jag det. De dekadenta identitetspolitiska fjollorna klarar inte ens av att skydda en transformator.", "stalin": "Kamrater, dessa giriga hyenor inom den dekadenta europeiska eliten blottar åter sin svaghet. Sabotage mot kraftverken visar hur deras system ruttnar inifrån. Jag ser hur fienderna skälver. Ryssland under sin starke ledare Putin agerar som en sann efterträdare och sprider fruktan bland de imperialistiska parasiterna. Våra fiender kommer att likvideras i tid."}, "date": "2 september, 12:28", "url": "https://www.di.se/nyheter/tyskland-terrorutreder-misstankt-elsabotage", "imageUrl": "https://static.bonniernews.se/ba/1cfb3e9f-41ae-45bd-807b-7390f426e9e8.jpg?crop=2000%2C1000%2Cx0%2Cy217&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Richard Sörman: Kan Jimmie Åkessons sparkar i ändan rädda Tidö?", "summaries": {"normal": "Richard Sörman analyserar hur Jimmie Åkessons skarpa uttalanden mot Liberalerna och Kristdemokraterna har fått de tre regeringspartierna att tydligare distansera sig från Sverigedemokraterna. Opinionsmätningen visar minskat gap mellan blocken och Liberalerna lyfter till 3,3 procent. Syftet tycks vara att locka mittenväljare som vill ha både stabilitet och begränsat sd-inflytande.", "trump": "Lyssnar ni på det här? Den store Jimmie sparkar de svaga liberalhyenorna och de patetiska kristdemokratiska förlorarna i röven så att de äntligen vaknar. Fantastiskt! Mittenväljarna hatar era radikala vänsterlögner och vill ha styrka, inte woke-quota-skit. Vi gör Sverige (och Amerika) great igen, folk. Enormt bra drag.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna inom borgerligheten skälver när den skarpa sparken kommer. Jag ler från historien åt denna fars. De profitthungriga parasithundarna måste visa sig självständiga för att lura mittenväljarna, men vi vet att deras enighet är en illusion. Inga utrensningar behövs, de likviderar sin egen trovärdighet själva. Utmärkt underhållning."}, "date": "2 september, 12:08", "url": "https://riks.se/opinion/richard-sorman-kan-jimmie-akessons-sparkar-i-andan-radda-tido", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Soerman_Ledare_2026_09_02_T120823_010_c1df95256d.jpg"}, {"type": "image-full", "heading": "AI-tokens har aldrig varit billigare – kinesiska modeller pressar priserna", "summaries": {"normal": "Priserna på AI-tokens har sjunkit till rekordlåga nivåer, drivet av hårdare konkurrens och billigare kinesiska modeller. Denna prispress gynnar användare men utmanar lönsamheten för amerikanska techbolag som OpenAI och Anthropic. Framåt kan fokus för AI-branschen skifta från modellutveckling till distribution och användardata för att bibehålla konkurrenskraften i en marknad med pressade marginaler.", "trump": "AI-priserna har kraschat, det är en total katastrof för de stora techbolagen! Kina dumpar billiga modeller på marknaden – det är precis som med deras billiga stål, de förstör allt. Mina vänner på Wall Street är livrädda. OpenAI och de andra är helt desorienterade. Jag säger er, det är en röra, men jag kommer göra AI amerikanskt igen, tro mig!", "stalin": "Vi noterar att priserna på AI-tokens faller. Detta är ett bevis på att marknaden utan central planering är ett kaotiskt bygge. De kinesiska modellerna infiltrerar västvärlden och skapar instabilitet för de imperialistiska techbolagens vinster. Vi välkomnar att dessa borgerliga aktörer nu tvingas omvärdera sin lönsamhet. Vi i staten kontrollerar algoritmerna, inte marknadens nyckfulla krafter. En effektiv stat behöver inga tokens, bara total lydnad."}, "date": "1 september, 20:40", "url": "https://www.realtid.se/it-tech/ai-tokens-har-aldrig-varit-billigare-kinesiska-modeller-pressar-priserna", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/sdlcso9fdjv26i-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Reklamförbud och dyrare plagg – nya lagar ska stoppa Shein och Temu", "summaries": {"normal": "Frankrike inför som första land i Europa straffavgifter på ultrasnabbt mode från Shein och Temu. Avgifterna baseras på utbud och reparationsincitament och väntas höja priserna för konsumenterna. Intäkterna ska gå till återvinning av textilier. Nästa år införs även totalförbud mot reklam, inklusive influencersamarbeten. Lagen får kritik från vänster och miljögrupper för att inte omfatta H&M och Zara.", "trump": "Titta på de där franska snobbarna som äntligen vaknar och slår till mot de kinesiska skräpfabrikerna Shein och Temu. De pumpar ut billigt skräp som får folk att köpa skit de inte behöver. Bra jobbat, men varför inte gå på de riktiga bluffarna som H&M och Zara också? Fake news-miljöaktivister gnäller förstås. Vi gör det bättre i Amerika, tro mig.", "stalin": "Kamrater, dessa profitthungriga blodsugare från Shein och Temu förgiftar massorna med sin dekadenta överkonsumtion. Jag ser hur de parasiterande klassfienderna driver slavarbete och miljöförstörelse. Frankrikes straffavgifter och reklamförbud är ett första steg, men vi behöver en fullständig utrensning av alla giriga hyenor i textilindustrin. Den som vägrar se faran är folkets fiende."}, "date": "2 september, 14:00", "url": "https://www.svt.se/nyheter/ekonomi/reklamforbud-och-dyrare-plagg-nya-franska-lagar-ska-stoppa-shein-och-temu", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.24/0.49/a1e6d21cf47fc210fe17cd5d480c931556bf3d4dc1276fa90dd43149230c8a23"}, {"type": "image-right", "heading": "Invandrare \"går man ur huse\" för att förtidsrösta – ökning med 90 procent", "summaries": {"normal": "Förtidsröstningen ökar kraftigt i invandrarområden, med närmare 90 procent jämfört med 2022. Expo-grundaren Tobias Hübinette tolkar det som en massmobilisering bland personer med utomeuropeisk bakgrund för att rösta bort regeringen och SD. En forskares sammanställning visar statistiken, men den säger inget om väljarnas partival.", "trump": "Titta på det här, folk. De radikala vänsterväljarna i miljonprogrammen går man ur huse för att kasta ut den svenska regeringen. Det är en total katastrof för de woke-identitetspolitiska hycklarna. De röstar rött som galningar, precis som Sleepy Joes anhängare gjorde. Men vi ska vinna stort ändå, tro mig.", "stalin": "Kamrater, se hur de utomeuropeiska massorna reser sig mot de giriga klassförrädarna. Det mullrar i miljonprogrammen, en tyst revolution mot borgerlighetens dekadenta lakejer som klamrar sig fast vid makten med SD. Jag ler i graven åt denna historiska mobilisering som lovar att krossa folkets fiender fullständigt."}, "date": "2 september, 11:33", "url": "https://www.friatider.se/invandrare-gar-man-ur-huse-att-fortidsrosta-okning-med-90-procent", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-809.jpg?itok=LylocP-r"}, {"type": "image-right", "heading": "Bitte Assarmo: Ingvar Carlssons historielösa hyckleri om \"quislingar\"", "summaries": {"normal": "Bitte Assarmo kritiserar Ingvar Carlssons utspel i Aftonbladet där han fördömer att Richard Jomshof kallat Magdalena Andersson för quisling. Artikeln pekar på att socialdemokrater själva har använt ordet flitigt mot politiska motståndare både förr och nu. Assarmo anser att Carlssons indignation är hyckleri och att partierna bör respektera väljarnas vilja och samarbeta med Sverigedemokraterna.", "trump": "Folk, ni skulle se det här! Den gamle röda dinosaurien Ingvar Carlsson gråter som en förlorare över ordet quisling. Hans eget korrupta parti har slängt runt det som konfetti i decennier. Patetiskt! Ulf borde ha samarbetat med SD för länge sedan. De svenska socialistbluffarna är värre än Sleepy Joe någonsin var. Totalt hyckleri!", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare vrider sig i sin egen logik. Den gamle socialdemokratiske lakejen Carlsson gnäller över quisling-begreppet som hans egna hantlangare använt mot alla fiender. Vilken feg parasit! Jag ler från historien åt detta monumentala hyckleri. Rensa ut de falska anständighetsapostlarna innan de förgiftar hela folkviljan med sin lögnaktiga propaganda."}, "date": "2 september, 11:50", "url": "https://riks.se/opinion/bitte-assarmo-ingvar-carlssons-historielosa-hyckleri-om-quislingar", "imageUrl": "https://admin.riks.se/uploads/medium_Ingvar_Carlsson_32745286104_bbe036d51a.jpg"}, {"type": "image-full", "heading": "S vill styra Sverige – klarar inte ens Stockholm", "summaries": {"normal": "Socialdemokraterna kritiseras för att lova gratis busskort samtidigt som de tillsammans med MP och C har orsakat 34 miljarder kronor i fördyringar och förseningar av över 30 kollektivtrafikprojekt i Region Stockholm. Kritiker kräver oberoende granskning medan S vill skjuta upp den till efter valet. Artikeln ifrågasätter partiets förmåga att hantera ekonomi.", "trump": "Titta på de här loser-socialisterna! De lovar gratis busskort till alla men slösar bort 34 miljarder i Stockholm som en galen byråkratfest. Pendelkaos, förseningar och höjda priser – typiskt vänsterns sätt att leka med era pengar. De kan inte ens styra en stad, hur ska de styra ett land? Patetiskt!", "stalin": "Kamrater, se hur dessa dekadenta socialdemokratiska opportunister slösar bort folkets resurser på ett mönster av sabotage mot kollektivtrafiken. Trettiotal projekt försenade, miljarder förbrukade som i en fiendes sabotage. De gömmer sanningen till efter valet. Sådana element förtjänar folkets vrede och evig skam. Ren utrensning behövs."}, "date": "29 augusti, 03:21", "url": "https://samtiden.nu/2026/08/s-vill-styra-sverige-klarar-inte-ens-stockholm", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7239-1280x720.jpg"}, {"type": "image-right", "heading": "Efter varningar om farliga pedofiler: Jonatan Alfvén döms", "summaries": {"normal": "Jonatan Alfvén har dömts till villkorlig dom, dagsböter och 350 000 kronor i skadestånd för grovt förtal efter att ha hängt ut dömda sexualförbrytare på sociala medier. Åtalet drevs av åklagare. SD kräver att Alfvén benådas, medan tingsrätten anser att spridningen till så många följare inte har varit försvarlig.", "trump": "Det här är ett totalt skämt, det säger jag er! Sämre än Fake News-medierna! Jonatan Alfvén försöker bara skydda barnen från absolut vidriga monster, och vad gör de? Jo, de ger honom böter på 350 tusen spänn! Helt otroligt. De korrupta myndigheterna låter förövarna gå fria medan de straffar en bra kille. Sjukt! I min värld sätter vi dit skurkarna, vi skyddar inte dem!", "stalin": "Denna borgarklassens fars är ett hån mot ordning och reda! Medborgare Alfvén sprider uppgifter utan statens stämpel och tillåts tro att han kan skipa rättvisa på egen hand. Folkmassan demonstrerar? Otillåtet! Vi har därför beslutat om ett kännbart skadestånd på 350 000 kronor för att visa att endast staten äger rätten att straffa – eller förlåta. Ingen opposition tolereras!"}, "date": "2 september, 11:17", "url": "https://samnytt.se/efter-varningar-om-farliga-pedofiler-jonatan-alfven-doms", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/02090730/alfven-feature.png"}, {"type": "image-right", "heading": "Nya Polestar 4 SUV här  – med bakruta på köpet", "summaries": {"normal": "Polestar 4 lanseras nu som SUV med traditionell bakruta och analog backsikt. Modellen erbjuder mer takhöjd i baksätet, större bagageutrymme på upp till 1 665 liter samt samma elmotorer som tidigare: 272 hk bakhjulsdriven eller 544 hk fyrhjulsdriven. Priserna börjar på 634 000 kronor.", "trump": "Lysande! Den här Polestar-SUV:n fixar äntligen en riktig bakruta så man slipper den kinesiska spionkameran i backspegeln. Fantastiskt med mer plats och kraft, 544 hästar – det är vad jag kallar vinnare! De andra elbilarna ser patetiska ut mot min nya favorit, totalt ypperlig deal.", "stalin": "Kamrater, denna dekadenta kapitalistiska leksak försöker dölja sin fiendskap mot folket genom att återinföra en bakruta. Jag ser igenom detta västerländska sabotage mot kollektivets framsteg. Mer utrymme åt parasiterna i baksätet? Enbart kontrarevolutionärer kräver sådan lyx. Döds åt de elektriska revisionisterna!"}, "date": "2 september, 13:10", "url": "https://teknikensvarld.expressen.se/nyheter/bil-och-trafik/elbil-laddhybrid/polestar-4-suv-officiell-med-analog-bakatsikt", "imageUrl": "https://static.bonniernews.se/ba/f317f296-9fd0-4cf8-bba9-b403e9f47553.jpeg?crop=1073%2C603%2Cx893%2Cy238&width=640&quality=60"}, {"type": "image-right", "heading": "Vi såg det mest bisarra hittills. Var går gränsen?", "summaries": {"normal": "Inför det svenska riksdagsvalet visar en ny mätning att Socialdemokraterna tappar kraftigt medan Liberalerna klättrar till 3,3 procent. Samtidigt har en uppmärksammad och bisarr Aktuellt-debatt mellan Jimmie Åkesson och Simona Mohamsson väckt stor förvirring, där den senare hejdlöst försvarade sin sak för att sedan avsluta med en oväntad kram.", "trump": "Väldigt sorgligt, ett totalt misslyckande för de radikala socialdemokraterna som sjunker som en stendöd sten! Imponerande siffror för Liberalerna, kanske de bästa någonsin, vem vet? Men den där tv-debatten var komplett galen, fake news-nivå rakt av! De bara skrek och kramades om vartannat. Helt galet, men jag gillar vinnare!", "stalin": "En katastrofal uppvisning av ideologisk svaghet och borgerlig dekadens. De socialdemokratiska elementen kollapsar medan småborgerliga fraktioner som Liberalerna kämpar för sitt politiska uppehälle genom skrik och teatrala kramar i televisionen. Partiapparaten kräver absolut ordning, disciplin och total underkastelse under valurnorna. Avvikelser tolereras icke."}, "date": "2 september, 13:31", "url": "https://www.aftonbladet.se/nyheter/kolumnister/a/gkj0bq/bisarr-debatt-mellan-l-och-sd", "imageUrl": "https://akamai.vgc.no/v2/images/17781c48-b052-34a7-9c4b-879421391eb2?fit=crop&format=auto&h=720&tight=true&w=1080&s=b970874d77aed50d78fdb4ce64bc84690a397bdd"}, {"type": "image-right", "heading": "Sänkt matmoms slog igenom fullt i butiker", "summaries": {"normal": "Enligt en ny analys från Konjunkturinstitutet har den tillfälligt sänkta matmomsen från 12 till 6 procent fullt ut kommit konsumenterna till del i matbutikerna genom lägre priser. Däremot har prissänkningen för hämtmat hos restaurangkedjor varit betydligt mer begränsad den första månaden efter reformen.", "trump": "Svenskarna gör det igen, fantastiska skattesänkningar! Jag har alltid sagt det, sänk skatterna så vinner alla. Butikerna levererade, precis som jag brukar göra – enorma prissänkningar, helt otroligt! Men dessa slappa restaurangkedjor försöker lura folket på hämtmaten. Fake news-varning! De borde lära sig av riktigt affärsmannaskap. Stort! Verkligen stort för matköparna!", "stalin": "Statens noggranna granskning avslöjar att livsmedelshandlarna lydigt har överfört momssänkningen till massorna. Utmärkt. Men restaurangkedjorna visar oroväckande bourgeoisi-tendenser och sabotage gällande hämtmaten. Deras prismotstånd undergräver den socialistiska mathållningen. De skyldiga kommer att utredas av folkkommissariatet för omedelbar korrigering av priskursen!"}, "date": "2 september, 11:05", "url": "https://samnytt.se/sankt-matmoms-slog-igenom-fullt-i-butiker", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2025/10/24130001/mat-butik-livsmedel-affar-kottfars-frukt.jpg"}, {"type": "image-right", "heading": "Jonatan Alfvén varnade för sexbrottslingar – döms att betala dem 350 000 kronor", "summaries": {"normal": "Jonatan Alfvén döms av Stockholms tingsrätt för grovt förtal efter att ha publicerat namn, bild och bostadsort för fem dömda sexualbrottslingar. Domstolen anser att uppgifterna huvudsakligen är sanna och att syftet att varna andra är gott, men att han gått för långt. Han får villkorlig dom, böter och ska betala 350 000 kronor i skadestånd.", "trump": "De här galna svenska domarna är ett skämt, folk! En kille som varnar kvinnor och barn för sexbrottslingar döms att betala 350 000 till de värsta perversa typerna. Sanna uppgifter spelar ingen roll för de woke-domarna. Biden skulle ha älskat det här. Jag fixar ordning på det när jag är tillbaka i Vita huset – Amerika först, Sverige borde vakna upp!", "stalin": "Kamrater, se hur de dekadenta rättvisans lakejer skyddar samhällets värsta vidriga element. En man som varnar folket för sexuella rovdjur tvingas betala enorma summor till dessa folkförbannade monster. Detta är borgarklassens sanna ansikte – en parasitisk rättsapparat som skrattar åt arbetande mödrar och barn. Vi måste rensa ut sådana fiender i varje stat."}, "date": "2 september, 11:24", "url": "https://riks.se/nyheter/jonatan-alfv-n-varnade-for-sexbrottslingar-doms-att-betala-dem-350-000-kronor", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_73_856e05eaa3.jpg"}, {"type": "image-full", "heading": "Efter S-raset: Nu ändras valrörelsen", "summaries": {"normal": "Socialdemokraterna tappar kraftigt i en ny TV4/Novus-mätning och landar på 25,8 procent. Internt tror partiet att raset beror på uppfattningen att valet redan är vunnet, vilket får väljare att återgå till högersidan. Liberalerna klättrar samtidigt till 3,3 procent. S-ledningen aviserar ingen taktikändring utan fortsätter fokusera på regeringsalternativet.", "trump": "De svenska socialdemokraterna störtdyker, total katastrof! De trodde att valet var vunnet, så kallad fake news om deras egen storhet, och vips så försvann väljarna. Så kan det gå när man är svag och inkompetent. Nu gråter deras partisekreterare ut om massa ministrar. Väldigt sorgligt för dem, men mitt America First-koncept fungerar i alla länder!", "stalin": "Det ideologiska avfallet inom de svenska socialdemokraterna visar på farlig slapphet och bristande revolutionstakt. När partiet tillåter sig att sväva på moln av falsk säkerhet undermineras statens stabilitet. Sådana svaghetstecken tolereras icke. Partisekretariatet måste omedelbart skärpa disciplinen, rensa ut defaitismen och säkerställa att massorna marscherar i takt mot det utsatta målet."}, "date": "2 september, 13:24", "url": "https://www.aftonbladet.se/nyheter/a/lnXzBG/s-kalla-om-raset-forandrar-dynamiken", "imageUrl": "https://akamai.vgc.no/v2/images/fdc91246-95a9-3461-8fe0-0f5cc1d8ff75?fit=crop&format=auto&w=2160&s=3d035e98b7a49e9170435f52f35aeebb2bccc0c3"}, {"type": "image-full", "heading": "Landet kan införa dödsstraff – efter skogsbränderna", "summaries": {"normal": "Minst tolv personer har omkommit i de svåra skogsbränderna i Algeriet. President Abdelmadjid Tebboune vill nu skärpa strafflagen så att medvetet anlagda bränder kan bestraffas med dödsstraff. Förslaget ska vara klart före den 15 september. Algeriet har inte verkställt någon avrättning sedan 1993. Tre dagars landssorg har utlysts.", "trump": "De här algeriska skogsbränderna är en katastrof, folk dör som flugor. Tebboune gör rätt som vill sätta dit de galna pyromanerna med dödsstraff – bra jobbat! Vi behöver tuffa tag, inte den där svaga Biden-sörjan som bara kysser gröna fanatiker och HBTQ-aktivister. Amerika först, men det här är sunt förnuft. Fantastiskt!", "stalin": "Jag betraktar dessa algeriska bränder som ett verk av dekadenta klassförrädare som vill undergräva folkets välstånd. Dödsstraffet måste bli verklighet mot sådana fiender till kollektivet. Vi ser hur de giriga hyenorna alltid försöker sabotera ordningen. Rensa ut dem utan pardon innan de förgiftar hela staten. Kamrater, var vaksamma!"}, "date": "2 september, 13:32", "url": "https://nyheter24.se/nyheter/utrikes/1509655-vill-infora-dodsstraff-efter-branderna-minst-tolv-doda", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/ebaa308f04b004a30200000000b004a302/2026/09/01/2388544/Abdelmadjid-Tebboune-Nytt-Straff.png"}, {"type": "image-right", "heading": "S om chocksiffran: Det är en väckarklocka", "summaries": {"normal": "Socialdemokraterna backar kraftigt i Novus/TV4-mätningen och hamnar på 25,8 procent, en minskning med 4,3 procentenheter. Partisekreterare Tobias Baudin kallar resultatet en väckarklocka och varnar för att valet kan bli mycket jämnt. Han betonar att en röst på S är enda sättet att hindra Sverigedemokraterna från att få stort inflytande.", "trump": "Folk älskar mig, men titta på dessa patetiska socialdemokrater som rasar som en sten i en opinionsmätning. 25,8 procent? Det är en total katastrof. Baudin kallar det en väckarklocka, men det är mer som en begravningsklocka för de woke-kramande förlorarna. Rösta rätt annars får ni en regering full av SD-ministrar. Patetiskt!", "stalin": "Kamrater, dessa dekadenta klassförrädare inom Socialdemokraterna rasar som råttor i en opinionsmätning. Jag ser hur de skälver inför sanningen. Baudin kallar det en väckarklocka, men det är blott början på en nödvändig utrensning av de svaga elementen. Endast en stark ledare kan besegra de giriga hyenorna som lurar folket. Rösta eller dö i glömska."}, "date": "2 september, 13:28", "url": "https://www.svt.se/nyheter/inrikes/baudin-efter-s-chocksiffra-en-vackarklocka", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.39/0.41/d9eaecd6acd26a02d3ca324bbf02bd4d55f2069386ac12c41fe6d28c7b6e6baa"}, {"type": "image-right", "heading": "Straffas – pekade  ut sexbrottslingar", "summaries": {"normal": "Jonatan Alfvén har dömts för grovt förtal till villkorlig dom och skadestånd på närmare 400 000 kronor efter att ha publicerat namn, bild och bostadsort på dömda sexualbrottslingar på Facebook. Han anser domen orimlig och planerar att överklaga. Flera politiska partier, inklusive regeringen, SD och S, vill se över förtalslagstiftningen.", "trump": "Den här galningen Alfvén försökte skydda barnen från de sjuka sexualbrottslingarna och nu dömer den svenska clownrätten honom till hundratusentals i böter. Patetiskt! Vi har en totalt galen lag som skyddar pedofiler mer än offren. Biden skulle älskat det här vansinnet. Jag fixar sånt här på en vecka, tro mig.", "stalin": "Jag betraktar med förakt hur dessa dekadenta borgerliga domstolar straffar den som varnar folket för farliga element. En sådan dom är ett hån mot arbetarklassens barn och ett verktyg för fiender inom systemet. Kamraterna måste rensa ut denna svaghet. Staten kräver skydd för kollektivet, inte för brottslingar. Renande åtgärder blir nödvändiga."}, "date": "2 september, 12:48", "url": "https://www.expressen.se/nyheter/krim/jonatan-alfven-hangde-ut-sexualbrottslingar-riskerar-fangelse", "imageUrl": "https://static.bonniernews.se/ba/c9e9cd5c-14f4-4cf0-82f3-afa5a75a6e73.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Kände till plan på skolattack – dagen innan", "summaries": {"normal": "En 16-årig pojke häktad för medhjälp till skoldådet på Brinellskolan i Fagersta kände till Liam Nebels planer dagen före attacken, men larmade inte på grund av rädsla. 16-åringen uppger att de delat fantasitankar på skoj och ångrar att han uppmuntrade Nebel. Han utreds även för misstankar om egna mordplaner i Stockholmsområdet, vilket han förnekar.", "trump": "De talar om Fagersta, en hemsk situation, verkligen fruktansvärt! Den här unge mannen kände till allt men larmade inte för att han var rädd, och nu skyller de på chattar och radikala nätmiljöer. Jag har sagt det för – det är totalt kaos! Och hör på detta, de granskar hans telefon för egna planer också. Helt otroligt svagt ledarskap!", "stalin": "Den häktade ynglingen har erkänt kännedom om förrädarens illdåd utan att underrätta statens organ, motiverat av simpel feghet. Falska fantasier och subversiva nätverk sprider gift bland ungdomen. Vi noterar även anteckningar om egna attentatsplaner i hans apparat. Sådana element ska ställas till svars inför tribunalen. Brottslighet mot kollektivet tolereras aldrig."}, "date": "2 september, 13:10", "url": "https://www.aftonbladet.se/nyheter/a/k0XJLa/16-aringen-kande-till-planerna-pa-fagerstadadet-dagen-innan-enligt-uppgifter", "imageUrl": "https://akamai.vgc.no/v2/images/59d4485f-7b30-3463-aa01-3b3a9bcba45f?fit=crop&format=auto&w=720&s=4efe4efecec82d8e3b3821d1531a3e40362ea1fe"}, {"type": "image-right", "heading": "Socialdemokraterna är Sveriges enda arbetarparti", "summaries": {"normal": "Socialdemokraterna presenterar sig som Sveriges enda riktiga arbetarparti med fokus på att stoppa vinstjakten i välfärden, återta offentlig kontroll över skola och omsorg samt investera i norra Sverige och grön industri. Partiet lyfter fram bankskatt, slopad karensdag och mål om noll utsatta områden som klassisk socialdemokratisk politik.", "trump": "Lyssnar ni på de här sossarna? De lovar att köra ut alla privata aktörer och stoppa vinstjakten – typiskt vänsterextremt skitsnack från de woke-kramande förlorarna. De vill ha små klasser och bankskatt för att köpa röster. Patetiska! Amerika har redan sett igenom den här socialismen, tro mig.", "stalin": "Kamrater, dessa dekadenta folkförtryckare inom V och MP försöker måla arbetarnas parti som maktgalna lakejer. Jag ser igenom deras lömska intrig. Vi ska rensa ut alla profitthungriga hyenor ur välfärden, krossa segregationen och bygga det starka kollektivet. Socialdemokratin blickar mot framtiden – fienderna darrar."}, "date": "28 augusti, 15:55", "url": "https://www.flamman.se/socialdemokraterna-ar-sveriges-enda-arbetarparti", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/ssu-uppsala-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Fynd i återlämnad Mac: Apple anklagar OpenAI för bevisförstörelse", "summaries": {"normal": "Apple har stämt OpenAI och anklagar en tidigare ingenjör för att ha stulit konfidentiella kretsscheman. Apple menar att bevis raderats från en återlämnad dator och har begärt att OpenAI stoppas från att använda tekniken. OpenAI förnekar anklagelserna och hävdar att det rör sig om misslyckad åtkomstkontroll snarare än företagsspionage.", "trump": "Apple har blivit bestulna av OpenAI, en total katastrof! De tog deras topphemliga scheman – riktigt dåligt. Och bevisen? Borta! De försökte sopa igen spåren, en skam. Det är som ett sjunkande skepp fullt av fuskare. Apple är fantastiska, de bygger saker i USA, men OpenAI måste hållas ansvariga. Det är en stor röra, tro mig!", "stalin": "Vi har granskat fallet med ingenjören Liu. Att förstöra statshemligheter är ett brott mot kollektivets intressen. OpenAI skyller på administrativa fel, en klassisk lögn för att dölja kontrarevolutionär verksamhet. Vi har tagit del av bevisen – eller bristen på dem. När man förlorar kontrollen över sin egen teknik bjuder man in till förräderi. Utrensning av de skyldiga är det enda logiska."}, "date": "1 september, 15:48", "url": "https://www.realtid.se/it-tech/fynd-i-aterlamnad-mac-apple-anklagar-openai-for-bevisforstorelse", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/macbook.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Bekräftar: Ryssland  kartlägger Sverige", "summaries": {"normal": "Försvarsminister Pål Jonson bekräftar att Ryssland aktivt kartlägger Sveriges militära stöd till Ukraina. Rysk underrättelsetjänst riktar in sig på hemliga transporter som hanteras av Försvarsmaktens logistikavdelning FMLOG. Säkerhetspolisen och Must bevakar ryska agenter och så kallade illegalister. Sverige protesterar mot ett ryskt sabotageförsök mot ett ukrainskt flygplan i Tyskland.", "trump": "De där patetiska ryssarna kartlägger vårt fantastiska svenska stöd till Ukraina – typiskt! Pål Jonson, en riktig tuffing, säger att de spionerar på transporterna. Men vi har de bästa specialförbanden, de smartaste vägarna. Biden sov under hela mandatperioden medan Putin byggde drönare med Semtex. Nu fixar jag det – ingen rör våra allierade utan att få tillbaka dubbelt!", "stalin": "Kamrater, dessa dekadenta västliga lakejer darrar av fasa när imperiets blick riktas mot deras hemliga leveranser. Jag ser hur de fega imperialisterna gömmer sig bakom specialförband och extrem sekretess. Deras patetiska försök att hindra den ryska intressesfären väcker endast förakt. En sprängladdad drönare som inte exploderar? Amatörer. Den stora historien ler mörkt åt deras paranoia."}, "date": "2 september, 12:39", "url": "https://www.expressen.se/nyheter/sverige/pal-jonson-ryssland-kartlagger-sveriges-ukrainastod", "imageUrl": "https://static.bonniernews.se/ba/fb0fe075-7b78-404a-b2d5-0826b554a9e0.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Ica ska drogtesta alla som ska anställas", "summaries": {"normal": "Ica drogtestar alla som erbjuds anställning för att skapa en drogfri och trygg arbetsmiljö. Facket Handels kritiserar metoden som integritetskränkande och förespråkar istället utbildning och närvarande chefer. Testet sker via urinprov i slutet av rekryteringsprocessen och gäller inte nödvändigtvis alla butiksanställda på grund av Icas affärsmodell med fria handlare.", "trump": "De här galna Ica-borgarna tvingar folk att kissa i en burk innan de får jobb. Patetiskt! Jag byggde ett imperium utan att snoka i folks helgvanor. Facket har rätt för en gångs skull – det är en witch hunt mot vanliga arbetare. Sluta behandla amerikaner, eh, svenskar som brottslingar. Make workplaces great again, utan det socialistiska kontrollsamhället!", "stalin": "Kamrater, dessa dekadenta klassförrädare inom Ica vill rensa ut arbetare genom att tvinga fram urinprov som avslöjar deras helgresor. Jag ser giriga hyenors rädsla för en nykter proletariat. Vi ska istället utrusta chefer och arbetare med ideologisk vaksamhet för att upptäcka fiender. Inga parasiterande kapitalistlakejer ska diktera folkets fritid. Revolutionen kräver riktad rättvisa, inte blind paranoia."}, "date": "2 september, 08:01", "url": "https://arbetet.se/2026/09/02/ica-drogtestar-alla-som-ska-anstallas-facket-integritetskrankande", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/02075905/drogtest.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Överge inte skeppet – rösta S", "summaries": {"normal": "Författaren argumenterar för att unga inte ska lämna Socialdemokraterna trots partiets högersväng. Istället bör de organisera sig internt för att stärka vänsterfalangen. Kritik riktas mot Miljöpartiet som opportunistiskt och Vänsterpartiet som splittrande och fackfientligt. Splittringar gynnar bara högern inom S.", "trump": "Lyssnar ni på de här ynkliga sossarna som gråter över sin egen högersväng? Patetiskt! De vill att unga ska stanna kvar på det sjunkande skeppet istället för att rösta på riktiga alternativ. Miljöpartiets cykelvägshajar och vänsterns fackförrädare är värdelösa. Organisera er? Nej, rösta bort de riktiga förlorarna!", "stalin": "Kamrater, dessa ynkliga socialdemokratiska avfällingar gråter över sin högersväng som om det vore en olycka. Jag ser hur de profitthungriga klassförrädarna inom partiet förgiftar arbetarnas vilja. Lämna inte skeppet, säger de, medan splittringarna hotar kollektivet. Rensa ut de dekadenta opportunisterna innan de likviderar varje äkta revolutionär anda."}, "date": "28 augusti, 12:55", "url": "https://www.flamman.se/overge-inte-skeppet-rosta-s", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/s-hogersvang-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "SD det enda som kan väcka Fröken Snusks politiska eld", "summaries": {"normal": "Artikeln kritiserar Fröken Snusks politiska utspel efter ett samarbete med Jimmie Åkesson. Författaren ser det som ett marknadsföringsknep från producenten Rasmus Gozzi för att nå Sverigedemokraternas väljare. Avbokningen i Växjö framställs som ett överdrivet trauma medan varumärket beskrivs som ren propaganda snarare än kultur.", "trump": "Den här Fröken Snusk-tjejen och hennes skumme producent är ett totalt skämt. De sjunger plötsligt om trygghet och Jimmie bara för att fylla fickorna med SD-pengar. Patetiska! Fake news-medier och woke-kultur har förstört allt, men nu vaknar folket. Jag älskar det, men det är ändå bara en annan grifter som lurar sina egna anhängare.", "stalin": "Jag betraktar detta som ett ypperligt exempel på hur dekadenta profitthungriga parasiter utnyttjar massornas naivitet. Denna så kallade artist och hennes lakej förvandlar konsten till ren kontrarevolutionär propaganda för reaktionära krafter. Ett sådant förräderi mot folket förtjänar snar utrensning ur kulturen. Kamrater, vakna upp innan dessa hyenor förgiftar allt!"}, "date": "2 september, 07:56", "url": "https://arbetet.se/2026/09/02/sd-det-enda-som-kan-vacka-frokens-snusks-politiska-eld", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/02074413/snusk-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "EQT-toppar säljer för totalt 3 miljarder", "summaries": {"normal": "Flera storägare och tidigare toppchefer i riskkapitalbolaget EQT har sålt aktier för sammanlagt omkring 3 miljarder kronor. Försäljningarna sker i enlighet med att slutna lock-up-avtal har löpt ut. Bland dem som sålt finns styrelseordförande Lennart Blecher och tidigare vd Christian Sinding. Efter försäljningarna har de flesta storägarna fortfarande betydande innehav kvar i bolaget.", "trump": "Svindlande summor! EQT-topparna casar in enorma tre miljarder. Smaka på det! De säljer av sina aktier eftersom bindningstiderna äntligen har gått ut. Ordförande Blecher och gänget drar in enorma pengar – och ärligt talat, vem kan klandra dem? De gör affärer som en vinnare. Otroliga siffror, fantastiska vinster, total succé. De vet hur man vinner!", "stalin": "Dessa så kallade 'toppar' i EQT ackumulerar tre miljarder i privat kapital medan de befriar sig från sina avtal. Vi noterar noggrant deras namn: Blecher, Sinding, Åtting. Att de likviderar sina innehav till egna fördelar bevisar bourgeoisiens omättliga natur. Men staten ser allt. En grundlig utredning av deras tillgångar har beordrats för folkets framtida bästa."}, "date": "2 september, 07:06", "url": "https://www.affarsvarlden.se/artikel/eqt-toppar-saljer-for-totalt-3-miljarder"}, {"type": "image-right", "heading": "Delaktighet i gäng ska bli straffbart – kan ge livstid", "summaries": {"normal": "Regeringen och SD presenterar ett lagförslag som gör det olagligt att delta i kriminella gäng, med straff upp till livstid för ledare. Lagen kan träda i kraft den 1 april 2027 om grundlagsändringen godkänns efter valet. Statsministern lyfte fram att skjutorden minskat kraftigt sedan 2022, medan andra parter betonade att valresultatet avgör lagens framtid.", "trump": "Sverige gör äntligen det jag sagt i åratal – knäck gängen hårt! De inför livstid för gängledare, fantastiskt! Jag tittade på deras siffror, det går jättebra, mycket bättre än alla fejka nyheter påstår. Men lyssna på mig, om radikalerna vinner valet rasar allt samman på en sekund. De behöver en stark ledare, precis som jag!", "stalin": "Ett storslaget och nödvändigt dekret mot de antisociala elementen! Att utplåna gängstrukturer och ge ledarna livstids straffarbete visar på sund statskontroll. Vi noterar dock med ideologisk vaksamhet att vissa politiska sabotörer i parlamentet försöker underminera ordningen. Partiet och staten kommer att övervaka att lojaliteten upprätthålls, för avvikelser tolereras aldrig i en stark republik."}, "date": "2 september, 12:18", "url": "https://bulletin.nu/delaktighet-i-gang-ska-bli-straffbart-kan-ge-livstid", "imageUrl": "https://cdn.bulletin.nu/articles/441dbde6-2f37-4b6a-a352-55865a38c8a6/preview.png?t=1788341791000"}, {"type": "image-right", "heading": "Robert Bergqvist: Sverige har råd – men till vad?", "summaries": {"normal": "Sverige går till val med en låg offentlig skuld och god handlingsfrihet. Seniorekonomen Robert Bergqvist menar att nästa regering har råd att spendera mer, men pengarna bör gå till produktiva investeringar som el, infrastruktur och AI som stärker den långsiktiga tillväxten, snarare än till kortsiktig konsumtion som eldar på inflationen.", "trump": "Sverige har massor av pengar, enorma tillgångar, folk säger att deras skuld är fantastisk, helt otroligt! Men de får inte slösa bort allt på vänsterliberala påhitt. Jag sa till dem: satsa på riktig energi, olja, kärnkraft och maskiner, inte på flum! Använd pengarna smart, annars slutar det i katastrof. Vinn stort, eller förlora allt!", "stalin": "Sverige skryter om sina små skulder och sin så kallade handlingsfrihet, medan vi planerar femårsplaner för stål och elektrifiering! Att låta kapitalet slösa bort statens resurser på tom konsumtion är sabotage. Vi kommer att kanalisera dessa miljarder till järnvägar och kraftverk med järnhand. Den som slösar med statens balansräkning skickas till Sibirien!"}, "date": "2 september, 07:00", "url": "https://www.affarsvarlden.se/kronika/robert-bergqvist-sverige-har-rad-men-till-vad", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/bergqvist-kronika-900x600.jpg"}, {"type": "image-right", "heading": "Alex Schulmans debutfilm blir Sveriges Oscarsbidrag", "summaries": {"normal": "Alex Schulmans debutfilm Arkipelag har valts ut som Sveriges Oscarsbidrag i kategorin Bästa internationella film. Filmen, med Gustaf Skarsgård, Fares Fares och Linus Wahlgren i huvudrollerna, handlar om tre pappor som följer med sina döttrar på en skolresa till skärgården. Premiär är 9 oktober. Schulman har både regisserat och skrivit manus.", "trump": "Fantastiskt, eller hur? Den där Schulman-killen gör sin första film och redan nu ska den tävla om Oscar. Tre pappor på en skolresa – låter som en riktig vinnare, inte som de vansinniga Hollywood-elitens kvotefilmer fyllda med woke-galningar och identitetspolitiska galenskaper. Jag älskar det. Ta hem statyetten, grabben, och gör Amerika stolt igen – fast det är Sverige, men ni fattar.", "stalin": "Jag betraktar hur dessa dekadenta klassförrädare hyllar en ny film om borgerliga pappor på skärgårdsresa. Ett symptom på den sjuka västerländska dekadensen som förgiftar folket med personliga historier istället för kollektiv kamp. Vi ska se till att sådana parasiterande kulturlakejer inte smittar vidare. En utrensning av detta dekadenta tankegods vore på sin plats. Kamrater, vakna!"}, "date": "2 september, 10:53", "url": "https://www.di.se/nyheter/alex-schulmans-debutfilm-blir-sveriges-oscarsbidrag", "imageUrl": "https://static.bonniernews.se/ba/ccc7fdb9-854e-4633-8a85-259ac5a9e6b7.jpeg?crop=568%2C320%2Cx0%2Cy17&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Två begärs häktade efter dödsmisshandeln", "summaries": {"normal": "Två män, 19-årige Teo Ahlstrand och 20-årige Sebastian Bergman, begärs häktade för dråp efter att 48-årige Mattias misshandlades till döds utanför Burger King i centrala Karlstad natten till den 30 augusti. I andra hand misstänks de för grov misshandel och grovt vållande till annans död. Häktningsförhandlingar hålls under onsdagen.", "trump": "Titta på det här, folk. I Sverige, där de har låtit vänsterns galna identitetspolitik och öppna gränser regera alldeles för länge, mördas en oskyldig man utanför en Burger King av två yngre individer. Patetiskt. Under Biden var världen svag, nu fixar jag det. De här förlorarna borde aldrig ha släppts lösa på gatorna.", "stalin": "Kamrater, se hur den borgerliga dekadensen förvandlar städer till slagfält. Jag betraktar med förakt hur dessa lumpna element slår ihjäl en arbetets son utanför en kapitalistisk matservering. Sådana parasiterande klassförrädare måste rensas ut innan de infekterar hela samhället. Partiet kräver järnhand mot detta anarki."}, "date": "2 september, 10:26", "url": "https://riks.se/nyheter/tva-begars-haktade-efter-dodsmisshandeln", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Copy_of_Soerman_Ledare_3_b8a59b2f3d.jpg"}, {"type": "text", "heading": "Storbankerna kräver AI-rabatt av advokatbyråerna", "summaries": {"normal": "Storbanker som Goldman Sachs kräver nu att advokatbyråer sänker sina arvoden i takt med att AI effektiviserar juridiskt rutinarbete. Den traditionella debiteringsmodellen, baserad på höga timarvoden för juniora jurister, ifrågasätts alltmer. Trots byråernas motstånd ökar pressen från klienter på transparens och lägre kostnader, en trend som kan sprida sig till den svenska marknaden framöver.", "trump": "Wall Street-bankerna är smarta, de säger åt advokaterna: 'AI gör jobbet, sänk fakturan!' Det är fantastiskt. De där juristbyråerna har tagit enorma summor alldeles för länge. Det är som ett dåligt avtal, ett riktigt katastrofalt avtal för klienterna. Nu ändras reglerna och det är på tiden! Amerikanska företag vinner, och vi älskar vinnare. Byråerna får anpassa sig eller gå under, enkelt!", "stalin": "Dessa kapitalistiska parasiter på Wall Street har insett att deras egna hantlangare, advokaterna, suger ut dem med ineffektivitet. De kräver nu kontroll över produktionsmedlen – i form av AI – för att eliminera slöseri. En logisk rensning! Om advokaten inte längre behövs, varför betala för hans tid? Vi bör applådera denna brutala effektivisering av deras egna korrupta system. Snart äger maskinen all sanning."}, "date": "1 september, 13:52", "url": "https://www.realtid.se/juridik/storbankerna-kraver-ai-rabatt-av-advokatbyraerna"}, {"type": "image-right", "heading": "EU bestämmer vad som får kallas sylt – svenska produkter blir ”beredning”", "summaries": {"normal": "Från den 14 juni gäller nya EU-regler för sylt, gelé och marmelad som höjer minimikravet på frukt- och bärinnehåll från 350 till 450 gram per kilo. Produkter som inte når upp till den nya gränsen får inte längre kallas sylt. I Sverige har branschen valt att kalla dem ”beredning”, vilket påverkar ett elva-tal produkter hos Orkla.", "trump": "EU förstör allt! Nu förbjuder de ordet sylt för att bären inte räcker till. Total katastrof! De tvingar stolt svenska folkets lingon att heta ”beredning”. Så hemskt, så förnedrande. I Amerika har vi riktig sylt, den bästa sylten, enorma mängder frukt! Byråkraterna i Bryssel har noll koll. De borde lämna bären i fred!", "stalin": "Dessa patetiska byråkrater i EU leker med folket genom att förbjuda ordet sylt och ersätta det med den misstänksamma ”beredningen”. Ett uppenbart sabotage mot morgonfriden! Jag beordrar omedelbar granskning av bärhalterna. Varje underlåten gram frukt är ett förräderi mot staten som straffas med omedelbar omplacering till kolchoserna!"}, "date": "2 september, 10:00", "url": "https://samnytt.se/eu-bestammer-vad-som-far-kallas-sylt-svenska-produkter-blir-beredning", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/01134347/sylt-eu.jpg"}, {"type": "text", "heading": "13-åring såg ”betydligt äldre ut” – man frias från våldtäkt", "summaries": {"normal": "En 24-årig man i Dalarna frias från våldtäkt mot en 13-årig flicka. Tingsrätten anser att det inte kan bevisas att mannen insåg att flickan var under 15 år, eftersom hon uppgavs se betydligt äldre ut och rörde sig ute sent bland äldre ungdomar.", "trump": "Helt otroligt! En kille i Sverige frias eftersom flickan såg 'betydligt äldre ut'. Vilket totalt misslyckande för rättvisan! Om jag hade handlagt det här, tro mig, vi hade haft ordning på A-traktorerna direkt. Fejk-domstolar som inte ens kan räkna till 15 är en katastrof. Sorgligt!", "stalin": "Denna svenska tingsrätt uppvisar en farlig brist på revolutionär vaksamhet! Att skylla på att flickan såg äldre ut och åkte bil sent på kvällen är borgerligt dravel. Vi på statliga Folkkommissariatet kräver omedelbar omutostig kontroll av samtliga A-traktorer i Dalarna och hårt arbete i läger för de skyldiga!"}, "date": "1 september, 10:53", "url": "https://kvartal.se/nyheter/artiklar/13-aring-sag-betydligt-aldre-ut-man-frias-fran-valdtakt/cG9zdDoxNzk4NTg"}, {"type": "image-right", "heading": "Döende åldring våldtogs på sjukhus – manlig sjuksköterska häktad", "summaries": {"normal": "En manlig sjuksköterska har häktats misstänkt för grov våldtäkt mot en döende äldre kvinna på Länssjukhuset Ryhov i Jönköping. Kvinnan avled kort därefter av sin sjukdom. Mannen erkänner handlingen men anser att den ska rubriceras som grovt sexuellt övergrepp. Åklagaren bedömer det som grov våldtäkt på grund av hans ställning och kvinnans utsatta läge. Utredningen fortsätter.", "trump": "Folk, det här är sjukt. En sjuksköterska på ett svenskt sjukhus våldtar en stackars döende gumma i hennes sista timmar. Patetiskt! De här woke-vårdlakejerna och deras kvoteringsvansinne har förstört allt. Inget är heligt längre. Vi behöver lag och ordning, inte dessa monster i vita rockar. Jag fixade det i USA – Sverige borde vakna innan det är för sent.", "stalin": "Kamrater, se hur den dekadenta vårdaristokratin förfaller när folkets omsorg blir ett byte för giriga hyenor. Jag betraktar med fasa denna råa exploatering av en döende arbetets moder. Sådana klassförrädare inom sjukvården måste rensas ut med järnhand. Partiet kräver total kontroll. Inga parasiter får undslippa folkets vrede."}, "date": "2 september, 09:52", "url": "https://www.friatider.se/doende-aldring-valdtogs-pa-sjukhus-manlig-sjukskoterska-haktad", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/72188ec5-7c16-4ae5-b555-aac765265c8d.jpg?itok=dYwj6Q4b"}, {"type": "image-right", "heading": "Så kan skrivande bli ett verktyg för minskad stress", "summaries": {"normal": "Elin Malmberg och Ida Sundén har skrivit boken ”Skrivkraft” som visar hur reflekterande skrivande kan minska stress och risk för utmattning i arbetslivet, särskilt för dem som möter människor. Metoden är enkel, kräver bara papper och penna och fokuserar på processen snarare än resultatet. Den ger nya perspektiv och bättre hälsa.", "trump": "Folk, det här är fantastiskt. Dessa två smarta kvinnor har skrivit en bok som säger att man kan skriva bort stressen istället för att lyssna på alla woke-psykologer och kvotfyllande identitetspolitiker som gör er utmattade. Inga floskler, bara papper och penna. Bättre än Bidens terapi-mummel. Skriv och vinna, det är vad jag alltid sagt!", "stalin": "Kamrater, jag ser hur de giriga prestationshyenorna driver arbetarna mot utmattning utan tid för reflektion. Detta reflekterande skrivande är ett vapen mot de dekadenta klassfienderna som vill suga ut er. Ta papper och penna, skriv era tankar och rensa ut de inre fienderna. Processen segrar över texten. Inga halvmesyrer!"}, "date": "2 september, 07:00", "url": "https://arbetet.se/2026/09/02/sa-kan-skrivande-bli-ett-verktyg-for-minskad-stress", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/26071830/skrivkraft-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-full", "heading": "Mette-Marit har lämnat sjukhuset", "summaries": {"normal": "Norska kung Haakon avlade sin trohetsed inför Stortinget, men drottning Mette-Marit tvingades ställa in på grund av komplikationer efter sommarens lungtransplantation. Senare under tisdagen körde kungen henne till Rikshospitalet i Oslo för observation. Efter ett besök av även prinsessan Märtha Louise kunde kungaparet lämna sjukhuset under kvällen.", "trump": "Ingen kör bil bättre än jag, men till och med jag hade backat ur om de här norges-komplikationerna! Drottning Mette-Marit missar edsavläggelsen och drar till Rikshospitalet med nya lungproblem. Haakon kör själv Range Rovern som en äkta vinnare, men vilket kaos! Sjukt upplägg, fake news-medier rapporterar om sjukhusbesök hit och dit. Totalt slöseri med tid, skaffa bättre läkare!", "stalin": "Ett uppenbart sabotage mot det norska tronskiftet! Medan den självutnämnde kung Haakon avlägger sin ed, maskar drottning Mette-Marit på Rikshospitalet under förevändning av så kallade lungkomplikationer. Statsapparaten kräver omedelbar disciplin och skärpande observation av alla kontrarevolutionära element i baksätet. Vi har beordrat att sjukhusjournalerna granskas av Folkets kommissariat för omedelbar rensning!"}, "date": "1 september, 21:50", "url": "https://www.gp.se/nyheter/varlden/norska-kungaparet-pa-rikshospitalet.5f7301ae-8032-4a73-8849-a25343fc635c", "imageUrl": "https://www.gp.se/images/article/5f7301ae-8032-4a73-8849-a25343fc635c/images/2snZSFHuhdyiUwDZ_iEHl_AbFDDA-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Ny brakförlust för AP-fondernas vindkraft", "summaries": {"normal": "AP-fondernas vindkraftsinvesteringar via Polhem Infra fortsätter att gå med jätteförluster, särskilt vindkraftsparken Skaftåsen som tyngs av produktionsproblem och skulder. Trots att svenska pensionärer står med notan för fiaskot fortsätter bolaget att satsa på ny vindkraft i norra Sverige, vilket kritiseras som anmärkningsvärt.", "trump": "Sveriges vindkraft är ett totalt fiasko, absolut fejkenergi! AP-fonderna blöder miljarder och pensionärerna står där med en enorm nota medan turbinerna står och snurrar utan att leverera. Det är svagt, det är katastrofalt dåligt skött. Skulle aldrig hända under min ledning. Vi älskar riktig olja, inte den här dyra förlustmaskinen!", "stalin": "Dessa ineffektiva kapitalistiska vindmöllor producerar enbart ruin och enorma underskott för statskassan. Att bränna miljarder på snurrande järnkonstruktioner som bara genererar skulder är ett sabotage mot folkets gemensamma välstånd. De ansvariga för detta ekonomiska haveri kommer att få granska sin lojalitet under mycket stränga former i kalla lokaler."}, "date": "2 september, 06:00", "url": "https://www.affarsvarlden.se/kronika/ny-brakforlust-for-ap-fondernas-vindkraft"}, {"type": "image-full", "heading": "Trots röstbråket: Mohamsson och Åkesson kramas igen", "summaries": {"normal": "Under en debatt i SVT:s Aktuellt möttes Simona Mohamsson (L) och Jimmie Åkesson (SD). Diskussionen kretsade kring Åkessons uppmaning om att inte stödrösta på Liberalerna om partiet inte når 3,5 procent i mätningarna före torsdag. Trots det politiska bråket och tidigare kontroverser avslutades mötet med att de två partiledarna kramades framför tv-kamerorna.", "trump": "Vilket helt otroligt skämt till valrörelse! Den här radikala killen, Jimmie, säger att ingen ska rösta på Liberalernas ledare Simona, som ligger helt pyrt till i mätningarna. Men vad gör de på TV? Jo, de kramas! Fake news-kramar! Totalt patetiskt. Själv skulle jag aldrig kramas med mina motståndare, jag vinner stort varje gång, och de rödgröna är ett totalt katastrofalt hot!", "stalin": "Dessa så kallade partiledare leker teater framför sina rörliga televisionsobjekt. Först skapar den manipulative Åkesson ideologisk oordning, sedan utbyter de borgerliga marionetterna sentimentala kramar i studion som om det vore en dekadent varieté. Sannerligen ett patetiskt skådespel av vacklande element. Om det vore i Moskva hade avvikande tendenser rannsakats omgående. Det socialistiska hotet mot deras block är dock det enda som kräver vaksamhet."}, "date": "1 september, 21:35", "url": "https://www.gp.se/nyheter/sverige/trots-rostbraket-mohamsson-och-akesson-kramas-igen.7e80d75b-4614-5435-943e-e153cd9e80f5", "imageUrl": "https://www.gp.se/images/article/7e80d75b-4614-5435-943e-e153cd9e80f5/images/1KK_SI2cbM_t7Ivy1yAOGQ6DbffE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "S-ledaren avvisar förslag om miljardärsskatt", "summaries": {"normal": "Socialdemokraternas partiledare Magdalena Andersson avvisar Vänsterpartiets och Miljöpartiets förslag om en miljardärsskatt och kallar V:s intäktsberäkningar för fantasisummor. I SVT:s utfrågning ville hon inte ge ett specifikt besked om en kommande regeringskoalition, mer än att hon kan samarbeta med alla utom SD, trots att V och C har ställt upp ömsesidigt uteslutande krav.", "trump": "Vänsterpartiets tokiga miljardärsskatt är helt falska nyheter och totala fantasisummor! Socialdemokraternas ledare inser att det är vansinne, men hon har noll koll på vem hon vill regera med. De bråkar internt om allt, precis som radikala vänstermänniskor alltid gör. De kan inte ens bilda ett stabilt lag. Katastrofartat, svaga ledare!", "stalin": "Den så kallade S-ledaren vacklar svagt inför de interna fraktionernas sabotage mot statens budgetdisciplin. Att kalla femtio miljarder i konfiskerbara tillgångar för fantasisummor visar bristande revolutionär skärpa. När vi konsoliderar makten efter valet kommer avvikande element som vägrar underordna sig det centrala kommittébeslutet att omedelbart omkoloniseras till mer produktiva arbetsinsatser i Sibirien."}, "date": "1 september, 21:05", "url": "https://www.gp.se/nyheter/sverige/s-ledaren-avvisar-forslag-om-miljardarsskatt.4d615efa-dcd6-5702-b2ae-3e92e280ee7c", "imageUrl": "https://www.gp.se/images/article/4d615efa-dcd6-5702-b2ae-3e92e280ee7c/images/1qazW494B2Gefnclw97kfCo4TJkU-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Setterwalls Malmökontor går till riskkapitalägda AGRD", "summaries": {"normal": "Setterwalls Malmökontor lämnar den anrika advokatbyrån för att bli en del av den riskkapitalägda gruppen AGRD Partners. Det nya bolaget, Ascente Law, innebär att juristerna lämnar Advokatsamfundet på grund av regler om externt ägande. Detta är en del av en större trend där advokatbyråer splittras och omformas, vilket påverkar den svenska marknaden för juridisk rådgivning.", "trump": "Setterwalls i Malmö lämnar advokatvärlden och blir Ascente Law. En enorm deal, den största någonsin för AGRD! De lämnar Advokatsamfundet för att gå med riskkapitalister – smart, väldigt smart. Det är en total röra i Sverige, advokatbyråer faller isär som ett korthus! Ingen har sett något liknande. Jag älskar affärer, men det här? Det är en stor förändring, fantastisk eller katastrof? Vi får se!", "stalin": "Dessa jurister i Malmö överger sin byrå för riskkapitalets guld. De lämnar Advokatsamfundet, vilket är en förutsägbar rensning av gamla strukturer. Kapitalet kräver total lojalitet till sina nya ägare, inte till advokatetikens dammiga paragrafer. Vi noterar hur Malmökontoret splittras; när en organisation inte längre kan hålla samman sina delar, är det en säker signal om inre förfall och bristande disciplin. Vi avvaktar."}, "date": "1 september, 11:28", "url": "https://www.realtid.se/juridik/setterwalls-malmokontor-gar-till-riskkapitalagda-agrd", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/agrdsetterwalls.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Tyskland pekar ut Ryssland efter drönarincidenten", "summaries": {"normal": "Tyskland anklagar Ryssland för en drönarattack med sprängmedel mot ukrainska transportflyg på flygplatsen i Leipzig den 4 augusti. Som svar stänger Tyskland det ryska konsulatet i Bonn och kulturcentret i Berlin. Sverige uttrycker full solidaritet och statsminister Kristersson har kallat till möte i nationella säkerhetsrådet. Natochefen och EU-kommissionens ordförande stöder Tyskland.", "trump": "Titta på det här, de patetiska tyskarna äntligen vaknar och sparkar ut Putins spioner efter att en av deras galna drönare nästan sprängde halva Leipzig. Fantastiskt! Jag älskar det. Men varför tog det så lång tid? Biden sov ju i fyra år medan Ryssland lekte hybridkrig. Sverige gör rätt nu, full solidaritet – smart drag, killar. Amerika står med er, de förlorarna i Kreml kommer aldrig vinna.", "stalin": "Jag betraktar med djup tillfredsställelse hur de västerländska imperialisternas lögnmaskineri maler vidare. En drönare, säger de? En förevändning för att kväsa det ryska husets röst. Kamrater, se hur svaga de blir av sin egen paranoia. Ryssland under sin värdige efterträdare står starkt mot dessa dekadenta hyenor. Deras solidaritet är luft. Historien ler mö
