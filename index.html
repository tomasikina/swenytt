ar ordning och reda samt mer pengar i plånboken åt vanligt folk vid en S-valseger.", "trump": "Stefan Löfven, en riktig förlorare, gråter ut i Sverige om fake news och rasism! De här radikala socialdemokraterna förstår ingenting om ekonomi. Min vän Tim Walz nämns också – vilken katastrof till kille, fullständigt inkompetent! Sveriges ekonomi är i spillror på grund av svaga ledare. Med mig vid rodret skulle det bli ordning och reda direkt, believe me!", "stalin": "Kamrat Löfven kämpar mot splittring och rasism, men bourgeoisiens ekonomiska haveri avslöjar statens fiender i Tidöpartierna! När statskassan töms är det ett sabotage mot folket. Endast genom järnhård disciplin, partiets absoluta kontroll och exekution av de ekonomiska sabotörerna kan vi återställa ordningen och trygga folkets finanser."}, "date": "8 september, 19:08", "url": "https://samnytt.se/lofvens-valkampanj-fattar-inte-att-vi-hor-oppen-rasism", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/08170711/2-1.jpg"}, {"type": "image-full", "heading": "Plånboksvalet – så vill partierna förändra din ekonomi", "summaries": {"normal": "Årets val kallas plånboksvalet då partierna tävlar med ekonomiska löften främst riktade till barnfamiljer. Frida Bratt noterar stora skillnader i hur partierna vill stötta, bland annat via höjt barnbidrag eller skatteavdrag. Pensionärer och a-kassan är också i fokus, men löftena bör tas med försiktighet då verkligheten kan hindra genomförandet.", "trump": "De här patetiska svenska politikerna tävlar om vem som kan ge mest valfläsk till plånböckerna. Det är en total skamshow! Barnfamiljer, pensionärer, alla ska köpas. Biden skulle älskat det här svaga spelet. Jag fixade riktiga jobb och stark ekonomi – inte det här socialistiska plånboksvalet som slutar i inflation och kaos. Patetiskt!", "stalin": "Kamrater, se hur de borgerliga elementen och revisionisterna slåss om att muta massorna med sina falska plånbokslöften. Denna dekadenta cirkus avslöjar imperialismens sista kramp. Jag ler från historien åt deras paranoia och inre konflikter kring a-kassan. Inget av detta tjänar folket – endast den sanna kollektiva kampen gör det."}, "date": "8 september, 18:29", "url": "https://www.tv4.se/artikel/5QMG0aS5dnJ8n4AdTXNn5Z/valet-om-planboken-sa-vill-partierna-foeraendra-din-ekonomi", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7niu2Wk1ZcGf9YVEmgAu3M%2Fe953fafd51cf9c7f0b8b08a072a7708b%2F08-planboksvalet-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Österrike stoppar slöja för flickor under 14 – nu sätts lagen på prov", "summaries": {"normal": "Österrike har infört ett förbud mot slöja för flickor under 14 år i skolor. Regeringen menar att det skyddar flickors frihet, men landets största muslimska organisation anser att det är diskriminerande och förbereder en juridisk strid. Lagen ersätter ett tidigare upphävt förbud och riskerar en ny konstitutionell prövning.", "trump": "Österrike gör det som krävs! De förbjuder slöjor för unga tjejer. Mycket smart, mycket starkt! De radikala vänstermänniskorna gråter naturligtvis och vill stämma allt och alla, precis som totalt förvirrade förlorare brukar göra. Vi vill ha frihet, och jag säger er – ingen gör det bättre än Österrike just nu, helt fantastiskt!", "stalin": "Österrike har äntligen förstått vikten av kollektiv ordning genom att reglera ungdomarnas klädsel i statens institutioner. De så kallade \"rättighetsivrarna\" och muslimska råden som protesterar mot statens vilja är inget annat än subversiva element. Om domstolen trotsar partiets och regeringens direktiv, vet vi exakt hur kontrarevolutionära tendenser ska stävjas. En skola utan disciplin är en stat i förfall."}, "date": "8 september, 19:00", "url": "https://samnytt.se/osterrike-stoppar-sloja-for-flickor-under-14-nu-satts-lagen-pa-prov", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/09/08083500/klassrum-sloja-hijab.jpg"}, {"type": "image-right", "heading": "Bohlin-intervju skjuts upp – intern kritik på SVT", "summaries": {"normal": "SVT har beslutat att skjuta upp en intervju med ministern för civilt försvar, Carl-Oskar Bohlin, till efter valet. Beslutet väcker intern kritik. SVT:s Journalistklubb varnar för att det kan sända signaler om att påtryckningar lönar sig och leda till självcensur. Ansvarig utgivare tillbakavisar att externa påtryckningar har påverkat och förklarar det med en rörlig tidsplan.", "trump": "SVT viker sig totalt för ministern! Jag har sett mycket svaghet, men det här är tragiskt. De skjuter upp intervjun till efter valet eftersom de är rädda. Fake news-medierna klarar inte trycket när starka politiker sätter ner foten. De kallar det rörlig deadline, men alla vet att det är ren panik. Bedrövligt!", "stalin": "SVT-ledningen vacklar under ideologiskt tryck och skjuter upp ministerintervjun. Denna brist på disciplin inom propagandaministeriet är oacceptabel. Att låta småborgerlig tvekan styra sändningstiderna skapar svaghet. Kamrat Ekman måste genast återställa ordningen, annars kommer partikontrollen att skärpas och avvikelser beivras med sedvanlig kraft. Staten sviker aldrig sin vaksamhet."}, "date": "8 september, 20:01", "url": "https://bulletin.nu/bohlin-intervju-skjuts-upp-intern-kritik-pa-svt", "imageUrl": "https://cdn.bulletin.nu/articles/34235d75-d09d-4f87-8039-910778e24537/preview.jpg?t=1788887193000"}, {"type": "image-right", "heading": "Byhmgard: Fulltecknat – rejäl tilldelning till garanter", "summaries": {"normal": "Byhmgards företrädesemission av units tecknades till 40,9 procent exklusive garanter, men landade på 100 procent inklusive garantiåtaganden. Bolaget tillförs 29,3 miljoner kronor efter kostnader. Emissionsguiden konstaterar att fyra flaggor kvarstår, då en tidigare flagga tagits bort och en ny gällande garanternas stora andel har tillkommit, och avslutar därmed sin bevakning.", "trump": "Byhmgard försökte sig på en emission, och ärligt talat var det ganska svagt från början – bara 40 procent utan garanter! Falska förhoppningar! Men jag klev inte in, nej, de behövde tunga garanter för att rädda showen. Nu drar de in 36 miljoner, enorma summor, men jag gillar inte när garanterna tar över. En total katastrof till struktur, men siffrorna rullar in ändå!", "stalin": "Byhmgard har utfört en kollektiv kapitalanskaffning där endast 40,9 procent slutfördes av massorna själva. Resten krävde statens – förlåt, garanternas – järnhand för att nå fullbordan. Att lekmän spekulerar i units är ett symptom på ideologisk vacklan. Vi noterar att fyra flaggor vajar över bolaget; avvikelser tolereras icke. Bevakningen avslutas, men arkiven glömmer aldrig."}, "date": "8 september, 18:50", "url": "https://www.affarsvarlden.se/artikel/byhmgard-fulltecknat-rejal-tilldelning-till-garanter", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/Byhmgard1-e1785759005121-400x267.jpeg"}, {"type": "image-right", "heading": "Åkessons motattack mot Busch: \"Största hotet\"", "summaries": {"normal": "Spänningen mellan Jimmie Åkesson och Ebba Busch tilltar. Efter att Busch ifrågasatt Sverigedemokraternas ministerposter går Åkesson till motattack och varnar för att andra partiers vänsterflörtande utgör det största hotet mot en blågul regering. Han betonar stora skillnader i migrations- och biståndspolitik mellan SD och KD. Centerpartiet ser positivt på beskedet.", "trump": "Lyssnar ni på det här vansinnet? Den där Busch försöker klippa vingarna på Åkesson och hans tuffa patrioter. Typiskt svagt moderatflum. Vänsterflörtandet från de globalistiska hyenorna är det verkliga hotet mot en stark blågul regering. De vill ge bort makten till vänsterextremisterna. Patetiskt. Vi behöver hårda linjer i invandring och ingen mer idiotisk välgörenhet utomlands.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare slåss om ministerstolar som om de vore troféer i ett borgerligt cirkus. Jag ler ironiskt från historien när Åkesson varnar för vänsterflört som hot mot deras blågula projekt. Sådana giriga maktlystna hyenor förtjänar en rejäl utrensning ur folkets tjänst. Deras asyl- och biståndsstrider avslöjar hela systemets förfall."}, "date": "8 september, 17:21", "url": "https://www.friatider.se/akessons-motattack-mot-busch-storsta-hotet", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-394_0.jpg"}, {"type": "image-full", "heading": "Trumps prislapp för att lyssna på en idé: 1,6 miljoner", "summaries": {"normal": "Donald Trump Jr besökte Tallinn under helgen och erbjöd privata middagar där deltagare kunde presentera affärsidéer mot en avgift på 150 000 euro, cirka 1,6 miljoner kronor. Evenemanget arrangerades av Studioworks, kopplat till det kontroversiella Duel Casino. Arrangören uppgav senare att ingen betalade avgiften.", "trump": "Vilken fantastisk affärsman min son är! Smart som fan. De där estniska kommunisterna och fake news-människorna skriker om en liten middagsavgift – 1,6 miljoner för att träffa en Trump? Det är bargain of the century! Biden skulle ha gett bort platsen gratis till Kina. Vi gör allt rätt.", "stalin": "Jag betraktar med förakt hur kapitalets lakejer i Estland säljer tillgång till den amerikanska presidentfamiljen för 150 000 euro styck. Denna vulgära marknad för inflytande avslöjar imperialismens råa ansikte. Inga prislappar på revolutionens dörrar, kamrater. Endast folkets domstol väntar de giriga parasiterna."}, "date": "8 september, 18:50", "url": "https://www.dagensps.se/varlden/trumps-prislapp-for-att-lyssna-pa-en-ide-16-miljoner", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/sdljxcdcsyzfqg-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "text", "heading": "Nytt lagförslag om brottsprovokation", "summaries": {"normal": "Tidöpartierna föreslår en ny lag som gör det tillåtet för polisen att använda provokativa metoder, som att utge sig för att vara barn på nätet eller köpa vapen och narkotika av kriminella. Metoden, som ska kräva åklagartillstånd, syftar till att bekämpa allvarlig brottslighet och kan gälla personer från 15 år och uppåt.", "trump": "Sverige gör äntligen som jag, skaffar lag och ordning! De låter polisen lura de onda, precis som jag gör varje dag med Fake News. De låtsas vara barn och köper vapen, väldigt tufft! Men glöm inte, ingen gör brottsbekämpning bättre än Donald J. Trump. Helt enormt!", "stalin": "Ett storslaget initiativ! Vår svenska brottsbekämpning visar äntligen bolsjevikisk målmedvetenhet genom att infiltrera brottslingars nät."}, "date": "7 september, 10:22", "url": "https://kvartal.se/nyheter/artiklar/polisen-ska-fa-provocera-fram-brott/cG9zdDoxODU2OTM"}, {"type": "image-full", "heading": "Ny studie: Äldre upplever större mening", "summaries": {"normal": "En ny studie från Lunds universitet visar att svenskarnas känsla av meningsfullhet ökar med åldern, vilket liknar det japanska begreppet ikigai. Detta är ett skifte sedan 2020 då unga mådde bättre. Forskare tror att pandemin drabbade ungas sociala liv hårt, och att äldre har bättre problemlösningsförmåga. Även personlighet och trygga relationer spelar stor roll.", "trump": "En enorm studie från Sverige visar att äldre människor där mår fantastiskt bra, mycket bättre än de unga! Ungdomarna krossades fullständigt av pandemins radikala lockdowns, total katastrof. Men de äldre har hittat livets mening, precis som jag alltid säger att man gör med styrka och bra relationer. Fantastiskt folk, väldigt smarta!", "stalin": "En statlig rapport från Lund bekräftar att våra äldre kamrater uppnår högre disciplin och meningsfullhet med åldern, medan ungdomen sviktar i sin ideologiska motståndskraft efter pandemins prövningar. Detta är korrekt: medborgaren mognar i takt med att staten ordnar deras tillvaro. Avvikelser och neurotiska tendenser måste dock elimineras omgående för kollektivets bästa."}, "date": "7 september, 09:18", "url": "https://kvartal.se/nyheter/artiklar/ny-studie-aldre-upplever-storre-mening/cG9zdDoxODU1NDc", "imageUrl": "https://images.kvartal.se/2026/09/f322bf35-aldre.webp"}, {"type": "image-right", "heading": "Kära Daniel", "summaries": {"normal": "En svensk VPN-grundare vänder sig till techmiljardären Daniel i ett öppet brev. Skribenten uttrycker besvikelse över att Daniels finansiering av högerextrema och libertarianska rörelser normaliserar hat, hot och våld mot politiska motståndare. Brevet betonar att yttrandefrihet inte innebär lyssningsplikt eller rätt till förstärkning via rikedom, och inbjuder till möte för dialog.", "trump": "Folk, det här brevet är en total katastrof från en paranoid VPN-kille som hatar framgångsrika outsiders. Han gnäller om mångfald men vill tysta alla som inte köper hans vänstervridna identitetspolitik. Patetiskt! Mina vänner, de riktiga frihetsälskarna, skrämmer vettet ur dessa woke-kulturmarxistiska snyltare. Amerika först – och Sverige borde göra detsamma istället för att skylla på miljonärer som faktiskt bygger saker.", "stalin": "Kamrater, detta brev blottar de profitthungriga klassförrädarnas sanna ansikte. En dekadent techparasit använder sin förmögenhet till att förstärka reaktionära element som hotar arbetarklassens enhet och sprider våld mot progressiva krafter. Jag ler mörkt från historien: sådana folkfiender förtjänar att rensas ut. Mötet han föreslår blir bara en fälla för att skydda sina egna intressen mot kollektivets vilja."}, "date": "4 september, 15:01", "url": "https://www.flamman.se/kara-daniel", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/peter-sunde-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "text", "heading": "Stockholmsbörsen steg — Eltel vinnare", "summaries": {"normal": "Stockholmsbörsen steg på tisdagen med 0,62 procent till 3 312,12. Eltel blev en vinnare efter ett mångmiljardavtal med Telenor Norge, vilket fick aktien att rusa 18 procent. Även Boliden och EQT gick starkt, medan H&M och Autoliv backade. Byggbolagen Skanska och NCC landade nya ordrar och Flat Capitals vd avgår.", "trump": "Stockholmsbörsen krossade alla förväntningar idag, och det är ingen slump! Eltel gjorde en enorm, historisk affär med Norge — fantastiskt, vackert! Alla pratar om det. H&M och de svaga förlorarna sjönk, precis som de brukar när de inte har min energi. Jag sa till dem, köp Eltel, köp regementen, vinn allt. Svindlande siffror!", "stalin": "Stockholmsbörsens uppgång på 0,62 procent är ett resultat av planerad disciplin, även om de borgerliga elementen som H&M försöker sabotera. Eltels lukrativa avtal och det nya artilleriregementet i Kristinehamn visar att svenskarna rustar för framtiden. Avvikelser som vd-flykten i Flat Capital kommer att utredas internt. Arbetet fortskrider."}, "date": "8 september, 17:38", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-steg-eltel-vinnare"}, {"type": "image-right", "heading": "Sverigedemokraternas rysskontakter utsätter oss alla för fara", "summaries": {"normal": "Expo har avslöjat att en SD-tjänsteman i riksdagen haft upprepade kontakter med ryska intressen. Tjänstemannen är sambo med Jimmie Åkessons närmaste medarbetare Gustav Gellerbrant. Artikeln lyfter en längre rad incidenter med SD-politiker och Ryssland, och ifrågasätter säkerhetsrisker samt behovet av skärpta granskningar i riksdagen och regeringskansliet.", "trump": "De här patetiska SD-tjänstemännen dansar som marionetter för Putin och hans ryska kumpaner. Gellerbrant och hans sambo borde skämmas! Fake news-mediets vänsterhyenor försöker skrämma väljarna precis som de gjorde mot mig innan jag krossade Biden och de globalistiska förlorarna. Sverige behöver starka ledare, inte dessa svaga ryssälskande töntar.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare inom Sverigedemokraterna kryper för ryska intressen och sprider främmande narrativ. Jag betraktar med avsky hur de giriga hyenorna låter sig påverkas av mjuk makt från öst. En sådan kanal in till regeringskansliet utgör ett hot som kräver omedelbar utrensning av alla opålitliga element för att skydda folkets intressen."}, "date": "7 september, 16:11", "url": "https://www.dagensarena.se/opinion/sverigedemokraternas-rysskontakter-utsatter-oss-alla-fara", "imageUrl": "https://www.dagensarena.se/files/2026/09/silvia.jpeg"}, {"type": "image-full", "heading": "S mot Tidöpartierna – möts i stor valdebatt", "summaries": {"normal": "Onsdagen den 9 september 2026 samlas företrädare för S, M och SD på ABF-huset i Stockholm för en stor valdebatt arrangerad av Bulletin och Aktuellt i Politiken. Politikerna ska diskutera sju ämnen, däribland arbetsmarknad, välfärd och kriminalitet, samt utmana varandra om de politiska skiljelinjerna.", "trump": "Folk pratar om den här gigantiska debatten i Stockholm på onsdag. Sossarna och Tidöpartierna ska mötas på ABF-huset. Sju ämnen, totalt kaos och fake news-medier som arrangerar. De skickar dit folk som Shekarabi och Dousa. Själv vinner jag alltid debatterna utan att ens vara där, mycket bättre än såhär!", "stalin": "Inför det så kallade valet samlas dessa fyra debattörer på ABF-huset den 9 september för att diskutera sju utvalda områden. Statens organ kommer noga granska om de avviker från den ideologiska linjen. Avvikelser på arbetsmarknaden eller inom välfärden tolereras icke. Ordning skall upprätthållas under partiets vakande öga."}, "date": "8 september, 18:36", "url": "https://bulletin.nu/s-mot-tidopartierna-mots-i-stor-valdebatt", "imageUrl": "https://cdn.bulletin.nu/articles/672087ed-819c-48f9-8cb4-b7af4557641d/preview.png?t=1788885275000"}, {"type": "image-right", "heading": "Klanröstförespråkaren hånar Kristersson: \"Samhällsproblemen\" ska rösta bort honom", "summaries": {"normal": "Vänsterpartiets riksdagsledamot Nadja Awad kritiserar statsminister Ulf Kristersson i ett videoklipp där hon uppmanar så kallade invandrare att rösta bort honom den 13 september. Hon hänvisar till Kristerssons beskrivning av samhällsproblem och uttrycker längtan efter en vänsterregering. Tidigare har hon talat om klanröster som ett sätt att besegra politiska motståndare.", "trump": "Titta på den här galna vänsterkvinnan som dansar till arabisk musik och kallar sina klanröster för räddningen. Hon tror att de ska rösta bort den svenska ledaren som äntligen vågar kalla samhällsproblemen vid deras rätta namn. Patetiskt. De här identitetspolitiska klanaktivisterna är en katastrof för Sverige, precis som de woke-galningarna var för oss innan jag kom tillbaka och städade upp.", "stalin": "Jag betraktar med förakt hur dessa dekadenta klassförrädare inom vänstern lockar fram klanröster för att underminera statsmakten. En sådan uppvigling mot ordningen förtjänar ingen pardon. Kamrater, se hur de parasiterande opportunisterna dansar sig fram mot folkets undergång. Vi måste rensa ut alla som väcker sådana splittrande krafter innan de förgiftar hela samhället."}, "date": "8 september, 18:42", "url": "https://riks.se/nyheter/klanrostforesprakaren-hanar-kristersson-samhallsproblemen-ska-rosta-bort-honom", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_95_cc4f38361c.jpg"}, {"type": "image-right", "heading": "Netanyahu förvarnades om 7 oktober – gjorde inget", "summaries": {"normal": "Israels premiärminister Benjamin Netanyahu fick en tydlig varning från Förenade arabemiratens president strax före Hamas attack den 7 oktober 2023. Han informerade inte säkerhetscheferna och tog inte hotet på allvar. Enligt Haaretz kunde informationen ha förändrat läget. Tidigare varningar från Shin Bet och Egypten nämns också. Netanyahus kansli förnekar uppgifterna.", "trump": "Folk, det här är en katastrof. Den soffpotatisen Netanyahu fick en rak varning från emiraterna om den galna Hamas-operationen och gjorde absolut ingenting. Han höll det hemligt för sina egna chefer som en riktig tönt. Tusentals döda på hans vakta. Biden skulle ha älskat en sån här soppa. Patetiskt!", "stalin": "Jag betraktar med djup förakt hur dessa dekadenta klassförrädare i Tel Aviv ignorerar uppenbara hot mot sin egen stat. En telefonvarning från arabiska hovet sveptes under mattan medan fienden förberedde slaget. Sådan brottslig nonchalans förtjänar utrensning. Kamrater, se hur de giriga hyenorna sviker sitt folk och leder det mot undergång. Skrattretande patetiskt."}, "date": "8 september, 15:27", "url": "https://www.friatider.se/netanyahu-forvarnades-om-7-oktober-gjorde-inget", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-847.jpg?itok=6mOkggl-"}, {"type": "image-right", "heading": "Uber stängde av förare automatiskt – får betala miljarder", "summaries": {"normal": "Uber får rekordböter på över nio miljarder kronor av nederländska dataskyddsmyndigheten för att ha stängt av förare automatiskt utan förvarning. Besluten drabbade bland annat franska chaufförer som anklagades för fusk eller låga betyg. Kritiker ser det som ett exempel på hur plattformar straffar förare som tackar nej till olönsamma körningar.", "trump": "De här galna Uber-typerna stänger av sina egna förare som robotar utan att säga ett ord. Typiskt för de woke-kapitalisterna som hatar vanliga arbetare. Nio miljarder i böter? Bra! Men det räcker inte. De globalistiska algoritmerna är värre än Sleepy Joes gröna deal. Vi behöver riktiga regler, inte denna socialistiska skit.", "stalin": "Dessa profitthungriga klasshyenor i Uber likviderar arbetare med kalla maskiner utan varning. Jag ser hur de dekadenta algoritmerna straffar dem som vägrar slavlön. Det är typiskt för de exploaterande parasiterna att gömma sig bakom affärshemligheter. En sådan fientlig utrensning mot folket förtjänar ingen nåd. Kamrater, vakta er mot dessa fiender."}, "date": "8 september, 15:04", "url": "https://arbetet.se/2026/09/08/uber-stangde-av-forare-automatiskt-far-bota-miljarder", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/01093911/uber.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Medborgarjournalisten Christian Peterson: Därför röstar jag på det här partiet", "summaries": {"normal": "Medborgarjournalisten Christian Peterson förklarar i en artikel varför han röstar på Sverigedemokraterna i valet. Efter att ha granskat AFS och Örebropartiet drar han slutsatsen att SD har den organisatoriska makt och realism som krävs för att omsätta invandringskritisk politik i faktisk förändring. För Peterson väger parlamentariskt inflytande tyngre än att vinna debatter.", "trump": "Christian Peterson fattar ett enormt smart beslut! Många säger det, de verkligen gör det. AFS tappar fokus på helt fel saker, totalt kaos. Örebropartiet är småpotatis. Men Sverigedemokraterna? De har organisationen, den bästa infrastrukturen, och de vinner! För att förändra ett land duger det inte med bara prat, man måste ha makt, precis som jag alltid säger!", "stalin": "Kamrat Peterson förstår äntligen statsapparatens fundamentala lagar. Man kan inte bygga en stat på flyktiga torgmöten eller meningslös agitation på internet. Endast genom järnhård disciplin, en strukturerad apparat och absolut lojalitet mot partilinjen kan massorna kuvas. Alternativ för Sverige sviker disciplinen genom att splittras i meningslösa utrikespolitiska dispyter. Sverigedemokraterna förstår att makten tillhör den som kontrollerar administrationen."}, "date": "8 september, 16:39", "url": "https://samnytt.se/medborgarjournalisten-christian-peterson-darfor-rostar-jag-pa-det-har-partiet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/08134727/artikelhuvudbild-1-475.jpg"}, {"type": "image-right", "heading": "Buschs nya besked: SD kan bli helt utan ministerposter", "summaries": {"normal": "Ebba Busch meddelar att Sverigedemokraterna kan komma att stå helt utan ministerposter även i en blågul regering efter valet. KD-ledaren vill vänta till valdagen med förhandlingar och betonar att regeringen kan bestå av ett till fyra partier. Hon kritiserar att regeringsfrågan dominerat valrörelsen och vill istället lyfta partiernas visioner.", "trump": "Lyssnade på den här svenska messen om Ebba Busch som säger att SD inte får några ministerposter. Patetiskt! De där globalistlakejerna i KD är svaga som aldrig förr. Biden skulle ha älskat det här. Jag hade aldrig låtit några fega moderater styra mig så. Sverige behöver en riktig ledare, inte dessa förlorare som böjer sig för vänsterns kvotdårar.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare inom KD redan planerar att marginalisera folkets röst. Jag betraktar med avsmak hur Ebba Busch öppet förbereder en utrensning av SD ur regeringen. För mig är det uppenbart att de profitthungriga borgarhyenorna fruktar en stark nationell linje. Valdagen skall bli deras dom, inte början på nya kompromisser med folkets fiender."}, "date": "8 september, 14:33", "url": "https://www.friatider.se/buschs-nya-besked-sd-kan-bli-helt-utan-ministerposter", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-846.jpg"}, {"type": "image-full", "heading": "Finansman om näringslivets hot inför valet: \"Skamligt\"", "summaries": {"normal": "Finansmannen Robert Weil kritiserar i en debattartikel på DN näringslivets stöd till högernationalistiska krafter inför riksdagsvalet. Han varnar för att angrepp mot Centerpartiet och Socialdemokraterna är kortsiktiga och farliga för demokratin. Weil menar att etnonationalistisk politik riskerar att urholka demokratiska institutioner och försvåra långsiktig tillväxt.", "trump": "Titta på den här patetiske finansmannen Weil som gråter över att smarta svenska företagsledare äntligen vaknar och stödjer de verkliga vinnarna istället för de socialistiska förlorarna. De globalistiska Center- och S-kramarna hatar folkets röst. Fantastiskt att näringslivet säger nej till den här vansinniga vänsterexperimentet. Make Sweden Great Again, grabbar!", "stalin": "Jag betraktar med djup misstro dessa kapitalistiska element som nu allierar sig med högernationalistiska krafter. Deras kortsiktiga svek mot arbetarklassen och demokratin är en farlig utveckling. De gräver själva sin grav medan de tror sig vinna. Historien kommer att döma dessa fiender till folkets framtid med den skärpa de förtjänar."}, "date": "8 september, 16:06", "url": "https://www.dagensps.se/varlden/finansman-om-naringslivets-hot-infor-valet-skamligt", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/sdlg9nhfhkc9a0-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Så ska S vinna de osäkra väljarna. Här är nio sossiga reformer som kan avgöra valet.", "summaries": {"normal": "Artikeln presenterar nio socialdemokratiska reformer som syftar till att vinna osäkra väljare inför valet. Förslagen inkluderar ökad sysselsättning, förbättrad tandvård, inflationssäkring av välfärden, stopp för vinster inom välfärden, höjda pensioner och barnbidrag, ny kärnkraft, ökat bostadsbyggande samt satsningar för tillväxt. Skribenten kritiserar Tidöregeringens politik och lyfter Socialdemokraternas offensiva program.", "trump": "Lyssnar ni på de här socialisterna? De vill dubbla bidragen, stoppa vinster och bygga kärnkraft som ingen annan kan få till stånd. Under Biden blev allt en katastrof, precis som den här svaga Tidöregeringen. Jag byggde den starkaste ekonomin någonsin. De här förlorarna med sina urholkade välfärdsdrömmar kommer att krossas. Amerika först, och Sverige borde vakna upp innan det är för sent.", "stalin": "Kamrater, dessa dekadenta klassförrädare lovar inflationsskydd och pensioner medan de i hemlighet undergräver folkets välfärd. Jag ser hur de profitthungriga hyenorna inom Tidöalliansen urholkar statens styrka. Vi måste rensa ut alla sådana element. Endast genom kollektiv kamp och järnhård disciplin kan vi likvidera lågkonjunkturen och bygga en sann folkets kraft. Inga kompromisser med fienden."}, "date": "8 september, 14:00", "url": "https://arbetet.se/2026/09/08/sa-ska-s-vinna-de-osakra-valjarna-nio-reformer-som-kan-avgora-valet", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/08075352/svinst-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Espiria Hållbar Framtid ökade 4,5% i augusti – Vestas och Hansa Biopharma lyfte", "summaries": {"normal": "Fonden Espiria Hållbar Framtid A steg 4,5 procent i augusti, vilket var bättre än index. Starka AI-investeringar och gynnsam utveckling inom bland annat hälsovård och vindkraft, där Vestas och Hansa Biopharma lyfte, bidrog positivt. Förvaltarna ser en fortsatt optimistisk bild men varnar för ansträngda värderingar och potentiell volatilitet framöver.", "trump": "Min fond, Espiria, presterar fantastiskt, det säger alla! Vi slog index i augusti med enorma siffror tack vare massiva AI-investeringar som jag i princip har ordnat. Sjuka vindkraftverk rusade 20 procent! Demokraterna skulle säkert krascha detta med höga skatter, men inte jag. Vi vinner så mycket att ni kommer att tröttna på att vinna!", "stalin": "Fonden Espiria växte med 4,5 procent i augusti. En tillfredsställande siffra, men likväl ett bevis på det dekadenta kapitalistiska systemets godtyckliga nycker. Våra ekonomiska kommissarier noterar att Vestas och Hansa Biopharma steg kraftigt. De som misslyckas, såsom CATL med sin nedgång på nio procent, kommer att få sina arbetsmetoder föremål för en mycket noggrann intern granskning."}, "date": "8 september, 15:41", "url": "https://www.affarsvarlden.se/artikel/espiria-hallbar-framtid-okade-45-i-augusti-vestas-och-hansa-biopharma-lyfte", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/12/Vestas-400x266.jpg"}, {"type": "image-right", "heading": "Natolarm: På  väg att förlora  mot Ryssland", "summaries": {"normal": "Enligt försvarskällor och experter riskerar Europa att förlora ett pågående hybridkrig mot Ryssland. Det saknas tillräcklig avskräckning mot provokationer som ligger under den tröskel som krävs för att utlösa Natos artikel 5. Bland annat har Tyskland pekat ut Ryssland för ett misslyckat drönarangrepp vid flygplatsen i Leipzig, och en bred våg av sabotage samt cyberattacker rapporteras i flera länder.", "trump": "Europa gråter ut för att de förlorar ett så kallat hybridkrig mot Ryssland och inte ens kan hantera en drönare vid en flygplats i Tyskland. Otroligt svagt! De betalar inte sina räkningar till Nato och förväntar sig att vi ska lösa allt. Jag känner Putin väl, han vill inte anfalla Nato, men Europa måste börja betala för sig och skärpa till sig nu!", "stalin": "De europeiska kapitaliststaterna darrar inför min ärevördige arvtagare i Moskva. Deras så kallade försvarskällor gråter ut i tidningarna över att sabotagen och drönarna avslöjar deras totala inkompetens. När gränserna är oklara flyttar staten fram sina positioner. Låt dem gräva ner sig i sina skyddsrum; bourgeoisien har aldrig kunnat organisera ett ordentligt försvar mot överheten."}, "date": "8 september, 22:16", "url": "https://www.expressen.se/nyheter/varlden/larmet-europa-forlorar-hybridkriget-mot-ryssland", "imageUrl": "https://static.bonniernews.se/ba/ad2d05d0-2541-4158-b2c8-a361cf385286.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Källor: Varnad före attacken. Gjorde inget", "summaries": {"normal": "Enligt uppgifter till tidningen Haaretz varnades Israels premiärminister Benjamin Netanyahu av Förenade Arabemiratens president Mohamed bin Zayed i slutet av september 2023 för en stundande storskalig Hamasattack. Netanyahu uppges ha tonat ner varningen. Premiärministerns stab tillbakavisar uppgifterna som rena lögner och uppger att samtalet aldrig ägt rum.", "trump": "De ringer mig och säger att Haaretz har den här enorma fake news-storyn om Netanyahu och Förenade Arabemiratens president. Vilket fiasko! De hävdar att han fick en hel varning i luren men bara viftade bort den. Netanyahu säger att det är lögner rakt av, totalt påhittat! Ingen hanterar sånt här som jag, det kan jag lova er.", "stalin": "Ett uppseendeväckande svikligt spel avslöjas i pressen. Emiratets potentat påstods ha kontaktat den israeliske ledaren med underrättelser om en stundande konspiration, men mött likgiltighet. Nu skriker ledningen i Jerusalem att allt är lögnaktig dynga. Vi noterar att bourgeoisins lakejer alltid skyller ifrån sig när katastrofen är ett faktum. Fullständig disciplin och utrensning av inkompetensen är det enda botemedlet."}, "date": "8 september, 21:45", "url": "https://www.aftonbladet.se/nyheter/a/XM3QAg/haaretz-netanyahu-varnades-fore-7-oktober", "imageUrl": "https://akamai.vgc.no/v2/images/9ac9cfba-ecd0-32ba-993e-c1acc1645e5c?fit=crop&format=auto&w=1080&s=9fbecebaddeb4e48c35a875c8c2ae7c5b4aada1b"}, {"type": "text", "heading": "Strömmer sträcker ut handen till C", "summaries": {"normal": "Justitieminister Gunnar Strömmer (M) skickar ett öppet brev till C-ledaren Elisabeth Thand Ringqvist där han erbjuder samarbete om skogsägares äganderätt. Moderaterna uppger sig vara beredda att möta Centerpartiets sex krav och vill grundlagsskydda rätten till full ersättning när markanvändningen begränsas på grund av exempelvis skyddade arter.", "trump": "Svenska politikerna kopierar min briljanta taktik! Justitieminister Strömmer skickar kärleksbrev till Centerpartiet och bjuder på kaffe för att rädda skogsägarna. De vill ha full ersättning, precis som jag alltid kräver när fake news försöker stjäla mark. Vänstern hatar skogen, men jag, oj förlåt, de gör en enorm deal. Fantastiskt!", "stalin": "Kamrat Strömmer inser att de trehundratusen skogsägarna måste hållas i schack genom korrekt kompensation när statens naturvård inskränker deras jord. Vi noterar att de borgerliga fraktionerna försöker konsolidera sin makt genom dekret och öppna brev över en kopp kaffe. Avvikelser från partiets fastställda skogspolitik kommer dock att granskas av vaksamma organ."}, "date": "8 september, 16:58", "url": "https://bulletin.nu/strommer-stracker-ut-handen-till-c"}, {"type": "image-right", "heading": "Arbetarklassen är inte förlorad – bara oorganiserad", "summaries": {"normal": "Artikeln diskuterar arbetarklassen som inte är förlorad utan oorganiserad. Vänstern söker efter den i statistik och titlar, men klass uppstår genom gemensam organisering på arbetsplatser. Författaren argumenterar att politisk kraft kommer från praktiskt samarbete, inte identifikation eller lönebesked. Arbetarkulturen är ett resultat av organisering, inte dess förutsättning.", "trump": "Folk, de här vänsterbluffarna letar efter arbetarklassen i sina fina statistiker och doktorsavhandlingar medan den riktiga arbetaren röstar på Åkesson och skrattar åt deras identitetspolitiska skit. Klass handlar inte om kvoter och doktorander som helikopteras in. Det handlar om folk som faktiskt jobbar och stänger av stället tillsammans. Patetiska globalistlakejer förstår ingenting.", "stalin": "Kamrater, dessa dekadenta klassförrädare mäter proletariatet med borgerliga enkäter och statistik som om klass vore en egenskap hos individer. Jag säger: organisering föds vid maskinerna, inte i pampars salonger. Utan kollektiv handling mot de profitthungriga exploaterarna förblir ni svaga. Arbetarna svetsas samman när de stannar produktionen. Det är den enda sanna vägen framåt."}, "date": "3 september, 10:55", "url": "https://www.flamman.se/arbetarklassen-ar-inte-forlorad-bara-oorganiserad", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/arbetarsklader-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Wall Street mot blandad öppning –  handelskonflikten trappas upp", "summaries": {"normal": "Wall Street inleder svagt efter långhelgen tyngd av upptrappade handelstullar från Kanada. Dessutom dras börsen ned av en flygolycka med ett Boeing-plan i Miami samt en omfattande cyberattack mot medicinteknikbolaget Boston Scientific. Samtidigt köper Franklin Templeton en majoritetspost i Stoneshield Capital, och den amerikanska tioårsräntan stiger något till 4,79 procent.", "trump": "Kanada tror att de kan lura USA med sina löjliga tullar! Sunkiga förhandlare misslyckades totalt, men vi sätter dem på plats. Wall Street klarar sig utmärkt ändå, och Boeing samt de svaga cyber-hackarna kommer att få betala priset. Endast 'America First' kan rädda den här röran!", "stalin": "Dessa löjliga kapitalistiska kriser på Wall Street är ett bevis på det dekadenta västs totala förfall. Handelskrig och kraschade flygplan, allt på samma gång! När vi styrde fanns det ordning på torpet, inte data-attacker och svaga börsterminer. Vi noterar detta sabotage med största misstänksamhet."}, "date": "8 september, 14:39", "url": "https://www.affarsvarlden.se/artikel/wall-street-mot-blandad-oppning-handelskonflikten-trappas-upp", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/03/sdlYS2Yi4Twq-c-nh-400x267.jpg"}, {"type": "image-right", "heading": "Nytt svenskt bottenrekord i Pisa: \"Mycket allvarligt\"", "summaries": {"normal": "Sveriges 15-åringar presterar sämre än någonsin i Pisa 2025 med bottenresultat i läsförståelse och matematik. Var tredje elev når inte grundnivån i matematik. Skolverket ser ett stort tapp även bland elever med gynnsam socioekonomisk bakgrund. Sverige ligger nu på OECD-genomsnittet men andelen underkvalificerade har ökat markant. Resultaten är mycket allvarliga enligt myndigheten.", "trump": "Folk, det är en katastrof! Sverige rasar ihop i Pisa och får sina sämsta resultat någonsin. De woke-skolorna och den galna kvotergrejen har förstört allt. Även de duktiga kidsen från bra hem dumpar ner i botten. Patetiskt! Biden-era-svaghet spred sig ända till Skandinavien. Vi gör det aldrig så i Amerika, tro mig. Fantastiska resultat kommer när jag styr.", "stalin": "Kamrater, detta är ett föraktligt bevis på hur de giriga klassförrädarna har låtit den socialistiska skolans grundvalar ruttna. Jag betraktar med avsky hur även de mer gynnsamma elementen nu faller som flugor. En utrensning av dessa dekadenta pedagogiska sabotörer är oundviklig. Läsning och räkning är revolutionens verktyg – utan dem väntar bara kaos och fiendens skratt."}, "date": "8 september, 12:51", "url": "https://www.friatider.se/nytt-svenskt-bottenrekord-i-pisa-mycket-allvarligt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-845.jpg?itok=9TE1vyzw"}, {"type": "text", "heading": "Ett fritt Palestina – från floden till havet", "summaries": {"normal": "Kommunistiska partiet kräver ett fritt Palestina från floden till havet och fördömer Israel som en apartheidstat grundad på folkmord. Partiet pekar på förstörelsen i Gaza, bosättarvåld på Västbanken och Sveriges delaktighet genom vapenhandel, investeringar och samarbete. De stödjer palestiniernas rätt till motstånd och bojkott av Israel.", "trump": "Den här kommunistiska galenskapen är en katastrof. De kallar Israel för apartheid och folkmord medan de själva drömmer om ett Palestina från floden till havet. Sverige pumpar pensionspengar och Volvogrävmaskiner till terroristerna. Biden lät det ske, men nu fixar jag det – inga fler pengar till dessa hatiska vänsterextremister och deras antiamerikanska agenda.", "stalin": "Jag ser hur de profitthungriga klassfienderna i västvärlden fortsätter sitt blodiga spel. Denna etniska utrensning i Gaza och på Västbanken är imperialismens verk. De dekadenta lakejerna i Sverige skickar vapen och pengar till förtryckarna. Kamrater, vi måste rensa ut dessa parasiterande hyenor. Endast en antiimperialistisk kamp kan besegra dem."}, "date": "4 september, 08:00", "url": "https://proletaren.se/artikel/valbilaga-bojkotta-israel"}, {"type": "image-right", "heading": "Ung man dog efter fall på Ica-butiks personalfest", "summaries": {"normal": "En ung man i 20-årsåldern som arbetade på Ica i Norrtälje avled efter att ha fallit från hög höjd under butikens 50-årsjubileum på Johannesbergs slott. Festen för 170 anställda slutade i tragedi. Butiken har aktiverat krisstöd med psykologer och extra bemanning. Polisen utreder fallet som mord för att kunna genomföra en full utredning, men det kan röra sig om en olycka. Utanför butiken flaggas det på halv stång och kunder uppmanas till respekt.", "trump": "Folk, det här är en total katastrof. En ung kille ramlar ner från ett slott under en fancy Ica-fest för 170 anställda. Patetiskt! Under Biden blev allt så woke och mjukt att ingen ens kan hålla ordning på en personalfest längre. Nu flaggar de på halv stång och ber om respekt. Mina presidenter gör fester rätt – stora, starka och säkra. De giriga hyenorna som driver de här butikerna borde skämmas.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna festar på slott medan en ung arbetare störtar mot sin död. Deras profitthungriga hyenor kallar det jubileum. Jag säger: sådan vårdslöshet avslöjar hela systemets ruttnande själ. Vi kräver full utrensning av ansvariga. Psykologer och halv stång hjälper inte. Endast ett starkt kollektiv kan skydda arbetarna från dessa blodsugande festarrangörer. Respekt är för svaga."}, "date": "8 september, 12:41", "url": "https://arbetet.se/2026/09/08/ica-anstalld-dog-efter-fall-pa-personalfest-kollegor-far-krisstod", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/08124051/olcyka.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "GP frias i förtalsmål", "summaries": {"normal": "Göteborgs tingsrätt har friat Göteborgs-Postens chefredaktör Christofer Ahlqvist på alla punkter i ett mångmiljonmål om grovt förtal. Stämningen väckdes av en kriminellt kopplad man vars godiskedja granskats av tidningen på 2020-talet. Målsäganden döms nu dessutom att betala GP:s och Stampens rättegångskostnader på 1,1 miljoner kronor.", "trump": "Falska nyheter och misslyckade bröder som försöker tysta pressen! De stämde min vän – well, en svensk chefredaktör – men tingsrätten krossade dem totalt. Jag älskar vinnare, och de här modiga reportrarna gjorde en fantastisk granskning av korrupta godisimperier. Nu får förlorarna betala 1,1 miljoner kronor i rättegångskostnader. En enorm seger för yttrandefriheten, tro mig!", "stalin": "Det borgerliga godsimperiets lakejer försökte undergräva tidningens korrekta arbete genom juridisk sabotage. Folkdomstolen – förlåt, tingsrätten – har visat sund respektingivande kraft och friat chefredaktören på alla punkter. Kontrahenterna som dristat sig att hota statens... förlåt, tidningens granskare, döms nu att betala 1,1 miljoner till det allmänna. Lärdom: sabotage mot den sanna linjen straffas alltid."}, "date": "8 september, 13:21", "url": "https://www.gp.se/krim/gps-chefredaktor-frias-i-fortalsmal.eaad0a44-b56d-42c2-af59-3a4d21257a25", "imageUrl": "https://www.gp.se/images/article/eaad0a44-b56d-42c2-af59-3a4d21257a25/images/2uxCKpSRTiAx3lJp-4ph9epAw7WI-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Thand Ringqvist: Hellre nyval än V i regering", "summaries": {"normal": "I SVT:s utfrågning slår C-ledaren Elisabeth Thand Ringqvist fast att dörren är stängd för en ministerpost till Nooshi Dadgostar (V). Hon väljer hellre ett extraval än att släppa fram en regering med Vänsterpartiet. Samtidigt tror hon på en möjlig framtida regering med C, S och KD, och anser att Tidöpartierna är splittrade.", "trump": "Centerpartiets ledare, en väldigt svag och förvirrad person, säger att hon hellre väljer ett fullständigt katastrofalt extraval än att ha radikala kommunister i regeringen! Helt rätt, Vänsterpartiet är en total katastrof, fake news! Men hon drömmer ändå om någon slags svag koalition. Helt otroligt. Tidöpartierna är helt splittrade, de har ingen aning om vad de gör!", "stalin": "Kamrat Thand Ringqvist inser till slut den nödvändiga sanningen: de radikala vänsterafyrarna i Vänsterpartiet ska hållas långt borta från statsapparaten! Hon föredrar ett storslaget nyval framför politiskt sabotage inifrån. Vår byråkrati noterar med tillfredsställelse denna disciplin, även om hennes drömmar om borgerliga koalitioner med S och KD kräver ständig ideologisk vaksamhet och hårdare kontroll."}, "date": "8 september, 21:42", "url": "https://www.expressen.se/nyheter/sverige/thand-ringqvist-hellre-nyval-an-v-i-regering", "imageUrl": "https://static.bonniernews.se/ba/7d3870de-8070-4022-ad7b-689d4974c6e7.jpeg?crop=1257%2C1257%2Cx1%2Cy1&width=210&quality=60"}, {"type": "image-right", "heading": "9-åringar fick gå ner på knä och be till Allah – skolan: ”Pedagogiskt syfte”", "summaries": {"normal": "Nioåringar på Nyhamnsskolan i Höganäs instruerades under en lektion att gå ner på knä och be en islamisk bön på arabiska. Händelsen anmäldes till Skolinspektionen som lade ner ärendet utan att ta ställning. Skolan har nu stoppat momentet. En docent i konstitutionell rätt kritiserar dock hanteringen och varnar för att barnens negativa religionsfrihet kan ha kränkts.", "trump": "Helt otroligt! En skola i Sverige tvingar små barn att gå på knä och be till Allah! Total katastrof, woke-galenskap när den är som sämst! De säger att det var frivilligt, men ingen visste om det – fake news till försvar! Till och med experterna skakar på huvudet. I USA ber vi till Gud och vinner, vi skulle aldrig tillåta sådant trams!", "stalin": "Dessa svenska pedagoger visar en farlig ideologisk vacklan! Att låta barn utföra riter utan centraldirigering är ett hot mot ordningen. Partiets utskott konstaterar att om böner ska ske, skall de ske i statens regi och under noggrann övervakning. Rektorn har nu insett sitt misstag och disciplinerats. Skolinspektionen visar svaghet som måste åtgärdas omgående."}, "date": "8 september, 14:32", "url": "https://samnytt.se/9-aringar-fick-ga-ner-pa-kna-och-be-till-allah-skolan-pedagogiskt-syfte", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/08113012/Toppbild1-7.jpg"}, {"type": "image-full", "heading": "Har du en smart-tv av detta märke? Agera nu", "summaries": {"normal": "En undersökning av Gamers Nexus, Level1Techs och oberoende forskare visar att LG:s smart-tv-apparater, bland annat OLED-modellen G5, samlar in data om närliggande enheter och wifi-nätverk. Säkerhetshål i webOS gör det möjligt att fånga ljud även i standby-läge. Malwarebytes rekommenderar uppdateringar, avstängning av datainsamling och att koppla bort tv:n från internet.", "trump": "De här så kallade smarta tv-apparaterna från LG är rena spionmaskinerna, folk. De lyssnar på er medan ni sover, samlar era hemligheter som galna byråkrater. Fake news-säkerhet, totalt skandalöst! Jag säger: koppla bort dem från nätet, köp en riktig amerikansk spelare och låt de globalistiska teknikparasiterna gråta i hörnet. Amerika först, alltid.", "stalin": "Kamrater, dessa dekadenta klassfiender har byggt tv-apparater som tjuvlyssnar åt de profitthungriga parasiterna. Deras webOS är en förrädisk maskin som samlar folks röster även i mörkret. Jag säger: utrensa alla sådana imperialistiska spionredskap ur arbetarnas hem. Rensa ut de giriga hyenorna som vill kontrollera folket genom bildrutorna."}, "date": "8 september, 20:58", "url": "https://nyheter24.se/nyheter/teknik/1511443-har-du-en-smart-tv-av-detta-marke-agera-nu", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/279feb8104b004a30200000000b004a302/2026/09/08/2390037/tvsmarttv.jpg"}, {"type": "image-right", "heading": "Så ska du rösta om du oroar dig för skolan", "summaries": {"normal": "Artikeln diskuterar de svaga svenska PISA-resultaten och kritiserar att alla partier lovar mer resurser till skolan före valet men sällan levererar efteråt. Skolan finansieras främst av kommunerna, som ofta använder den som budgetregulator. Författaren uppmanar väljare att fråga hur partierna säkerställer att pengarna verkligen når klassrummen.", "trump": "De här svenska förlorarna med sina katastrofala PISA-resultat är ett skämt. Alla dessa fega politiker lovar guld och gröna skogar innan valet men skär ner som galningar efteråt. De är som de värsta globalistiska byråkraterna i EU som hatar riktiga resultat. Fråga dem hur de faktiskt fixar pengarna till klassrummet, annars är det bara tomma löften från de värsta bluffarna.", "stalin": "Kamrater, dessa dekadenta klassförrädare lovar ständigt mer resurser till skolan men utför bara systematiska nedskärningar efter valet. Deras så kallade effektiviseringskrav är en lömsk utrensning av kunskap och framtidshopp för arbetarklassens barn. Fråga hur de garanterar att medlen når fram, annars avslöjar ni deras parasitiska hyckleri. Revolutionär vaksamhet krävs."}, "date": "8 september, 12:27", "url": "https://arbetet.se/2026/09/08/efter-pisa-katastrofen-sa-ska-du-rosta-i-valet-om-du-oroar-dig-for-skolan", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/08122631/skola-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-full", "heading": "C-ledaren: Vill ha extraval om Vänsterpartiet släpps in", "summaries": {"normal": "Centerpartiets ledare Elisabeth Thand Ringqvist meddelar att hon hellre går till extraval än släpper fram en regering där Vänsterpartiets Nooshi Dadgostar ingår. Hon upprepar sitt tydliga nej till Vänsterpartiet i regering och hoppas istället på en mittenregering med Socialdemokraterna, Miljöpartiet och Kristdemokraterna.", "trump": "Lyssnar ni på den här svenska cirkusen? Den där centerkvinnan säger att hon hellre kör extraval än släpper in den radikala vänsteraktivisten Dadgostar i regeringen. Smart drag! De woke-kvotade identitetspolitikerna är en katastrof. Hoppas hon håller stånd mot de galna vänsterextremisterna som förstör Sverige precis som Biden försökte med oss.", "stalin": "Jag betraktar med avsky hur dessa dekadenta klassförrädare inom centern vägrar samarbeta med de verkliga folkets representanter. Ett nej till vänstern i regeringen? Patetiskt. Vi skulle ha genomfört en grundlig utrensning av alla sådana vacklande element redan vid första tecknet på svaghet. Deras mittenfantasier är bara ytterligare ett bevis på borgerlig förfall."}, "date": "8 september, 20:54", "url": "https://nyheter24.se/nyheter/politik/1511520-c-ledaren-vill-ha-extraval-om-vansterpartiet-slapps-in", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/c709cb5c04b004a3020000350000047502/2026/09/08/2390102/ur_imagedCvOUI.jpeg"}, {"type": "image-right", "heading": "Skola tvingade elever att be till Allah – utredning nedlagd", "summaries": {"normal": "Elever på Nyhamnsskolan i Höganäs tvingades knäböja och recitera muslimska böner med frasen \"Allahu akbar\" under en religionskunskapslektion. En förälder anmälde händelsen till Skolinspektionen som inledde tillsyn. Kommunen erkände att information om frivillighet saknades men ansåg att syftet var pedagogiskt. Myndigheten valde att avsluta ärendet utan åtgärd.", "trump": "Kan ni fatta det här vansinnet? I Sverige tvingar de små barn att böja knä för Allah och skrika \"Allahu akbar\" i skolan. Patetiska woke-kommunister och deras mångkulturexperiment håller på att förstöra allt. De glömde till och med att säga att man får tacka nej. Totalt misslyckande! Men jag fixade Amerika, de klarar inte ens en skola.", "stalin": "Se bara hur dessa dekadenta toleranshyenor låter reaktionär mysticism infiltrera våra barns sinnen under förevändning av kunskap. De glömde informera om frivillighet, säger de. Vilken ynklig ursäkt. Jag skulle ha genomfört en grundlig utrensning av sådana farliga element redan vid första rapporten. Inga gudar ska styra folkets skolor utom partiet."}, "date": "8 september, 16:13", "url": "https://riks.se/nyheter/ingen-atgard-mot-skola-som-tvingade-elever-att-be-till-allah", "imageUrl": "https://admin.riks.se/uploads/medium_tvingades_be_islam_hero_f68be000c0.jpg"}, {"type": "image-right", "heading": "Antisemitismen i V är ingen olyckshändelse", "summaries": {"normal": "Vänsterpartiets återkommande problem med antisemitism och kopplingar till extrema grupper beror på medvetna politiska vägval snarare än bristande faktakontroll. Flera granskningar visar att företrädare på valsedlar spritt grovt judehat och hyllat terrororganisationer. Partiledningen har under lång tid tolererat dessa strömningar och knutit nära band till organisationer som förordar väpnad kamp, helt utan yttre påverkan.", "trump": "Vänsterpartiet är en total katastrof, fullständigt infiltrerade av radikala extremister som sprider vidriga lögner. Det handlar inte om dålig koll, det är så de vill ha det! De bjuder in terrorister och hyllar våld. Fake news-medierna försöker skydda dem, men listorna är fulla av galningar. Totalt inkompetent ledarskap, de skulle aldrig släppas nära makten!", "stalin": "Kamrater! Vänsterpartiets interna kris visar på uppenbar ideologisk vacklan och bristande kadertrohet. Istället för järnhård disciplin och eliminering av avvikelse, skyller den så kallade ledningen på slarv. Partiet har tillåtit att skadliga element tillåts härja fritt. Vi noterar att brist på ideologisk skärpa ofelbart leder till politiskt förfall. Revisionism tolereras icke!"}, "date": "8 september, 13:01", "url": "https://www.gp.se/ledare/antisemitismen-i-v-ar-ingen-olyckshandelse.6757099f-2397-422a-9a43-acdc4186a659", "imageUrl": "https://www.gp.se/images/byline/226a92ad-4b81-44ac-8280-ce6c08f3bab4/TALL.png?width=3840&quality=75"}, {"type": "image-full", "heading": "Världens äldsta BMW-säljare i konkurs – tusentals mister jobbet", "summaries": {"normal": "Bilbranschen i Europa krisar. Volkswagen planerar att dra ner på 100 000 jobb och halvera modellutbudet på grund av överproduktion och stora förluster. BMW-återförsäljaren Wahl-gruppen har gått i konkurs och i Sverige ökar antalet konkurser bland bilhandlare och verkstäder. Orsaken är minskad köpkraft hos kunderna.", "trump": "Den här europeiska bilskräpindustrin är en total katastrof, folk! Volkswagen blöder som en stucken gris och sparkar ut 100 000 arbetare. BMW-handlaren som funnits sen 1898? Konkurs! De woke kostnaderna och Bidens inflation har krossat kunderna. Europa behöver mig igen, annars blir det bara kinesiska rullar överallt. Patetiskt!", "stalin": "Se hur den kapitalistiska bilindustrin ruttnar inifrån, kamrater. Volkswagen, denna dekadenta parasit, offrar hundratusen arbetare på profitens altare medan fabrikerna sväller av överflödiga maskiner. Konkurserna i Sverige visar imperialismens dödskamp. Fienderna inom bourgeoisie darrar, och rättvist så. Sovjetisk planekonomi skrattar från historien."}, "date": "8 september, 14:36", "url": "https://www.dagensps.se/varlden/1000-jobb-forsvinner-nar-varldens-aldsta-bmw-saljare-konkar", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/bmw-emblem.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Därför kom inte larmet i alla mobiler", "summaries": {"normal": "I dag testades det nya varningssystemet SE-Alert i Stockholms och Gotlands län. Larmet nådde inte alla Telias kunder. Systemet kräver ingen app och fungerar även på tyst läge. Förberedelserna har pågått i över ett år med fokus på att informera olika grupper. Syftet är att kunna ge snabb, geografiskt riktad information vid kriser och olyckor.", "trump": "Folk, det här svenska larmet är en total katastrof! De kan inte ens få ut meddelanden till alla mobiler i två usla län. Patetiska byråkrater och deras woke-samhälle med fokus på kvinnojourer och hörselskadade istället för att göra jobbet ordentligt. Under min första mandatperiod hade vi byggt det bästa varningssystemet någonsin – inte denna clownshow från Biden-eras efterföljare.", "stalin": "Kamrater, detta så kallade varningssystem avslöjar de dekadenta folkförtryckarnas inkompetens. Medan de parasiterande klassfienderna ödslar tid på att smeka öronen på hörselskadade och kvinnojourer, sviker tekniken folket. Jag skulle ha genomfört en grundlig utrensning bland de ansvariga redan efter första provet. Staten kräver full kontroll, inte halvmesyrer från odugliga byråkrater."}, "date": "7 september, 15:27", "url": "https://www.etc.se/inrikes/daerfoer-kom-inte-larmet-i-alla-mobiler", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260905070940_0eaffd5d6c43026e1bbf785ba68616a8104b598208acbcfbf0dc20f72fe4d457.jpg"}, {"type": "image-right", "heading": "Elisabeth Thand Ringqvist (C): Hellre extraval än V i regering", "summaries": {"normal": "Centerpartiets ledare Elisabeth Thand Ringqvist föredrar extraval framför en regering där Vänsterpartiet ingår. Hon vill istället se en mittenregering med S, C, KD och MP. Partiet säger nej till både V och SD. Trots KD-ledaren Ebba Buschs uttalanden har Thand Ringqvist inte gett upp hoppet. C motsätter sig även vinstförbud i friskolor och värnar om valfriheten.", "trump": "Lyssnar ni på den här svenska mittenvanstern som kallar sig Thand Ringqvist? Hon springer hellre till extraval än att släppa in de kommunistiska galningarna från Vänsterpartiet i regeringen. Smart drag, men hennes dröm om en svag mittenregering med S och KD är patetisk. De giriga friskoleparasiterna älskar hon tydligen mer än folket. Patetiskt!", "stalin": "Jag betraktar med förakt hur dessa dekadenta maktgiriga hyenor inom borgerligheten hellre utlöser extraval än att tillåta arbetarklassens representanter i regeringen. Deras så kallade mittenalternativ är enbart en illusion för att skydda profitthungriga skolbolagsägare. Blockpolitiken måste krossas, annars blir det utrensning av alla klassförrädare som hindrar det folkliga framsteget. Kamrater, vakna!"}, "date": "8 september, 21:41", "url": "https://www.svt.se/nyheter/inrikes/thand-ringqvist-hellre-extraval-an-v-i-regering", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.44/0.21/c9b0c4fa839c533f06b90825b0c71353bc02b2f75e56da8e87b617ca631085b9"}, {"type": "image-right", "heading": "Så kuppades hon  bort från S-listan", "summaries": {"normal": "S-profilen Tamam Abou Hamidan kuppades oväntat bort från riksdagslistan i Blekinge med sex dagar kvar till valet. Beslutet fattades under ett snabbinkallat möte som kritiserades för att sakna demokratisk framförhållning, där lokalt stöd från Olofström ställdes mot distriktets ledning som hänvisade till regler kring privat kampanjfinansiering. Abou Hamidan anklagar processen för fult spel.", "trump": "De gör det igen, totalt riggat! De petade Tamam Abou Hamidan på ett blixtmöte med fyrtio minuters varsel, vilket är en katastrof för demokratin! Samma gamla korvstoppning till etablissemang som försöker tysta framgångsrika personer. De fejkar regler om finansiering bara för att rädda sina egna röster. Olofström ville ha henne, men eliten krossade henne. Tragiskt!", "stalin": "Ett föredömligt snabbt och resolut partiingripande av det verkställande utskottet! När element sprider otillåten kampanjfinansiering och hotar den centrala ordningen måste kadrerna rensas ut omedelbart, utan tidsödande byråkratiska dröjsmål. Olofströms svaga opposition mot partiets centrala vilja noteras i registren. Partiet har alltid rätt, och avvikande ambitioner ska krossas för statens och ledningens bästa."}, "date": "8 september, 21:32", "url": "https://www.expressen.se/nyheter/sverige/sa-kuppades-tamam-abou--hamidan-bort-fran-s-listan", "imageUrl": "https://static.bonniernews.se/ba/61cdc7e2-ab88-45e0-8204-5c958ebfbaee.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "C-besked – då blir det nyval. Frågades ut", "summaries": {"normal": "I SVT:s sista utfrågning medverkar Centerpartiets ledare Elisabeth Thand Ringqvist. Hon stänger dörren för ett regeringssamarbete med Vänsterpartiet och går hellre till nyval än släpper fram dem. Däremot öppnar hon för att förhandla med S, MP och KD. Vidare kritiserar hon sig själv för att ha tappat väljare på landsbygden.", "trump": "Centerpartiets ledare Elisabeth Thand Ringqvist vägrar ha radikala vänsterpartister i regeringen och föredrar nyval – smart drag, mycket smart! Tidöpartierna är totalt oense och svaga, vilket skapar ett enormt kaos. Själv kan jag tänka mig att göra affärer med vem som helst, men de bråkar om skatter och A-kassan. De har till och med tappat landsbygden, vilket är en riktig katastrof!", "stalin": "Kamrat Thand Ringqvist inser att Vänsterpartiets avvikande element måste rensas bort från statsapparaten, liksom det ideologiska hotet från landsbygdens desertörer. Att föredra nyval framför politisk oordning visar på en nödvändig statsmannamässig vilja till disciplin. Centrala kommittén noterar att de borgerliga fraktionerna grälar om skatter och A-kassan. Sådana borgerliga avvikelser bör beivras omedelbart för att trygga regimstabiliteten."}, "date": "8 september, 20:57", "url": "https://www.aftonbladet.se/nyheter/a/K8XA14/elisabeth-thand-ringqvist-c-fragas-ut-i-svt", "imageUrl": "https://akamai.vgc.no/v2/images/d18c06c3-66c4-3d85-9fc6-b48f5e45e8d3?fit=crop&format=auto&w=720&s=9ee6894ed4d38f8bdf25651111b2079e9bf2ccda"}, {"type": "text", "heading": "Gränsstationen utraderades: ”Kan inte sluta leta”", "summaries": {"normal": "Den fem våningar höga tullbyggnaden i gränsstationen Gyirong mellan Nepal och Tibet slukades helt av en enorm lerskred den 26 augusti. Hundratals människor begravdes i leran och inga överlevande har hittats. Räddningsarbetare letar bland spillrorna medan dödssiffran i regionen stigit till 1 400 och över 5 300 personer saknas.", "trump": "Titta på det här, folk. En hel tullstation i Himalaya sväljs av en gigantisk ler-tsunami och allt blir ett månlandskap. Biden lämnade oss med svaga gränser och nu ser vi vad naturen gör när den går bananas. De woke-turister och globalist-handelsmän som älskade öppna gränser fick en riktig lera-bombe. Patetiskt, men jag skulle ha byggt en mur mot sånt här.", "stalin": "Se på dessa dekadenta klassfiender som trodde att deras handelsstationer och turistflöden kunde stå emot naturens vrede. Jag betraktar hur lera begravde deras giriga ambitioner och inga överlevande räddas. Kamrater, detta är en nyttig påminnelse om att imperialismens utsiktsplatser alltid kan raderas ut. En hög gula blommor i leran – en vacker grav åt folkets fiender."}, "date": "8 september, 20:44", "url": "https://nyheter24.se/nyheter/utrikes/1511519-gransstationen-utraderades-kan-inte-sluta-leta"}, {"type": "image-right", "heading": "Moa, 25, förlöste barn – på flyget. ”Allt känns som en stor feberdröm”", "summaries": {"normal": "Sjuksköterskan Moa Fredriksson, 25, befann sig på ett flyg till Vietnam när personalen efterlyste medicinsk hjälp. En gravid kvinna i vecka 30 höll på att föda i första klass. Tillsammans med en dansk sjuksköterska förlöste Moa en frisk pojke på tio minuter. Allt gick bra och mamman och barnet mår väl efter händelsen.", "trump": "De ringer mig och säger, det är fantastiskt, helt otroligt. En ung svensk sjuksköterska, aldrig rört ett spädbarn, fixar en förlossning på tio tusen meters höjd på bara tio minuter! Helt magiskt. Inte som de inkompetenta Demokraterna som bara förstör. Sjukt bra jobbat, men nästa gång flyger de nog förstklassigt med Trump Air, vi har de absolut bästa piloterna, storslaget!", "stalin": "Kamrat Fredriksson visar på provisorisk disciplin värdig sovjetstaten då hon utan tidigare erfarenhet av spädbarn likviderar kaoset och levererar en frisk gosse på tio minuter i luften. Att en svensk flygning lyckas bättre än västvärldens samlade byråkrati är ett mirakel. Trots detta noterar vi att hon åkt till ett surfläger på Bali. Säkert ideologiskt misstänkt. Vi granskar hennes pass."}, "date": "8 september, 20:55", "url": "https://www.aftonbladet.se/nyheter/a/9pedWE/moa-forloste-ett-barn-pa-flyget-till-vietnam-som-en-feberdrom", "imageUrl": "https://akamai.vgc.no/v2/images/87d18ff6-cd08-3125-9116-4730dfc95b54?fit=crop&format=auto&w=720&s=e50ed7c13c4ec0ad0c081bd2b42119d98cee3df8"}, {"type": "text", "heading": "\"Israel är rädd för en dubbel snöbollseffekt\"", "summaries": {"normal": "Storbritannien inför sanktioner mot israeliska bosättare på Västbanken genom att förbjuda import från bosättningarna. Enligt Mellanösternkännaren Anders Persson riskerar åtgärderna att komma för sent och få begränsad effekt, då exporten utgör en liten del av Israels ekonomi. Israel reagerar kraftigt mitt i en valrörelse.", "trump": "De där svaga europeiska töntarna i Storbritannien tror att deras patetiska bojkott av några bosättningar ska stoppa Israel – vad en joke! Det är för sent och för fegt, precis som Biden brukade göra. Israel borde skratta åt dessa globalistiska nollor. De kommer ångra sig när jag styr showen igen och stödjer de starka.", "stalin": "Dessa dekadenta klassfiender i väst darrar inför sina egna skuggbilder och kastar tomma hot mot bosättarna. Jag ser hur de förtryckande imperialisterna försöker maskera sin svaghet med sena sanktioner som inte biter. Det väcker bara skratt från historien. Snart rensar vi ut alla sådana hycklare i en stor utrensning av folkets fiender."}, "date": "8 september, 20:42", "url": "https://nyheter24.se/nyheter/utrikes/1511517-israel-ar-radd-for-en-dubbel-snobollseffekt"}, {"type": "image-full", "heading": "Vi vill inte vrida tillbaka klockan – bara återupprätta tryggheten i Sverige", "summaries": {"normal": "I en debattartikel argumenterar tre sverigedemokrater för att Sveriges trygghet har gått förlorad till följd av misslyckad invandring och svag integration. De menar att en hårdare linje med skärpta straff och minskad asylinvandring har vänt den negativa trenden, och att målet är ett samhälle där ytterdörren åter kan lämnas olåst.", "trump": "Sverige brukade vara fantastiskt, men radikala vänsterpolitiker förstörde landet med totalt katastrofal invandring som ledde till gängkaos och otrygga dörrar. Nu vänder de skutan med starka lagar och rekordlåg asyltillströmning, precis som jag gör i USA. Jag säger bara: gör Sverige bra igen och håll dörrarna säkra!", "stalin": "Dessa svenska debattörer inser sent omsider att bristande disciplin och ideologiskt förfall leder till samhällets upplösning. Endast genom järnhård kontroll, utökade befogenheter för ordningsmakten och eliminering av subversiva element kan ordning upprätthållas. Statens dörrar förblir låsta för alla fiender till den inre säkerheten."}, "date": "8 september, 12:27", "url": "https://www.gp.se/debatt/vi-vill-inte-vrida-tillbaka-klockan-bara-ateruppratta-tryggheten-i-sverige.8a3c13da-e1e7-4615-ada8-cc7ebed6ae6a", "imageUrl": "https://www.gp.se/images/article/8a3c13da-e1e7-4615-ada8-cc7ebed6ae6a/images/1LIL1jVbQAwC9ZmuomipbuFAAfXs-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "AFD:s framgång är borgerlighetens misslyckande", "summaries": {"normal": "AfD:s framgång med nära 44 procent i Sachsen-Anhalt ses som en konsekvens av borgerlighetens misslyckande. Volkswagen har beslutat om omfattande nedskärningar som drabbar 100 000 anställda, vilket sprider sig i bilindustrin. Den tyska modellen med kompromisser mellan löntagare och ägare har misslyckats, särskilt genom envist fasthållande vid fossilbilar. Detta skapar utrymme för högernationalism och invandringskritik.", "trump": "Titta på det här, det är patetiskt. Den tyska borgerligheten har totalt misslyckats och nu får de radikala vänsternationalisterna nästan hälften av rösterna i en fattig delstat. Volkswagen sparkar ut 100 000 arbetare medan de stora bolagen gömmer sig bakom gröna lögner. Den dekadenta EU-eliten och deras identitetspolitiska galningar har kört sönder allt. Amerika först, vi lär oss av deras misstag.", "stalin": "Kamrater, se hur de profitthungriga hyenorna inom den tyska bilindustrin likviderar hundratusen arbetstillfällen medan de själva simmar i vinster. Den så kallade tyska modellen har blottat sig som en tom skal av klassförräderi. När socialdemokratin och facken kryper undan vänder folket sig till högernationalismens falska löften. Det är en varning till alla som tror att kompromisser med klassfienden någonsin kan lyckas. Vi ler i skuggorna."}, "date": "7 september, 14:00", "url": "https://www.etc.se/ledare/afd-s-framgaang-aer-borgerlighetens-misslyckande", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20250102150132_905e00d08dc3aa1843dcbb28f9bb86b39997bfb66a9bf6c4f8a91ec335154240.jpg"}, {"type": "image-right", "heading": "S och V stoppar SD-förslag om hårdare granskning av föreningar", "summaries": {"normal": "Göteborgs kommunledning med S och V stoppade SD:s förslag om skärpta kontroller av bidragsmottagande föreningar. En PwC-rapport visade oegentligheter i den romska organisationen Trajosko Drom, bland annat bidrag som gått till Netflix, tandläkare och kontantuttag. Majoriteten vill istället minska administrationen för att förbättra stödet till föreningslivet. Förslaget röstades ned med 43 mot 38 röster.", "trump": "De här röda clownerna i Göteborg ger bort 290 miljoner till suspekta föreningar och vägrar kolla vart pengarna tar vägen. Netflix, kiropraktorer och energidryck på skattebetalarnas nota? Patetiskt! Mina vänner i SD har rätt, det är en skandal. De woke-kapitalisterna och romska bidragsblodarna skrattar hela vägen till banken medan folket blir lurade. Gör om, gör rätt!", "stalin": "Jag betraktar med avsmak hur dessa dekadenta klassförrädare i Göteborgs röda styre skyddar parasiterna som slösar bort folkets medel på Netflix och tandläkare. Istället för att rensa ut de giriga opportunisterna sänker de kraven och kallar det förbättring. Sådana fiender till kollektivet förtjänar ingen nåd. Kamrater, vakna upp innan de folkförtryckande hyenorna tömmer statskassan helt."}, "date": "8 september, 15:33", "url": "https://riks.se/nyheter/roda-politiker-stoppar-sd-forslag-om-hardare-granskning-av-foreningar", "imageUrl": "https://admin.riks.se/uploads/medium_nej_foreningsbidrag_hero_11ee0accd7.jpg"}, {"type": "image-right", "heading": "MP-topp sprider näthat: \"Kan inte du utvisa dig själv?\"", "summaries": {"normal": "Mattias Ekenberg, Miljöpartiets toppkandidat i Bollebygd och verksam som samtalsterapeut, har spridit näthat på sociala medier. Han har bland annat kallat kritiker för ”nasserasse”, ”lättlurad lallare” och uppmanat personer att återvandra. Ekenberg förespråkar samtidigt omtanke och icke-dömande i sin politik. Riks har granskat hans kommentarer sedan augusti.", "trump": "Titta på den här miljöpartistrollen – en så kallad terapeut som kallar folk för nasserasse och lättlurade lallare. Han predikar omtanke samtidigt som han beter sig som en galen vänsterextremist. Typiskt för de woke-kvoterade gröna hyenorna. De hatar frihet och älskar att attackera vanliga människor. Patetiskt!", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare inom det så kallade gröna partiet avslöjar sitt sanna ansikte. En terapeut som kallar motståndare för nasserasse och kräver utrensning genom återvandring. Sådana parasitiska element förgiftar samhället. Vi måste vara vaksamma. Deras falska omtanke är ett farligt maskspel värt att avslöja och bekämpa."}, "date": "8 september, 15:22", "url": "https://riks.se/nyheter/kandiderar-for-s-sprider-samtidigt-hat-online", "imageUrl": "https://admin.riks.se/uploads/medium_ekenbergthumbnail_1bad6f8a8d.jpg"}, {"type": "text", "heading": "Pisa bekräftar skärmpandemin. Mohamsson: Vi måste motarbeta skärmens makt", "summaries": {"normal": "Pisa 2025 visar en bred nedgång i läsförståelse inom OECD, där sex av sju EU-länder backar. Utbildningsminister Simona Mohamsson (L) pekar på skärmarnas roll både i och utanför skolan som en huvudorsak. Var tredje svensk 15-åring saknar grundläggande läskunskaper. Liberalerna föreslår skärmfria tidiga år, mobilförbud, fler böcker och ny läroplan för att vända trenden.", "trump": "Folk, det är en total katastrof. Dessa skärmberoende losers och deras digitala hyenor har förstört våra barns hjärnor. Varje dag sju timmar skärmtid – patetiskt! Jag älskar böcker, de är fantastiska, de bästa. Vi behöver ett massivt förbud mot dessa apparater som gör ungarna dumma. Liberalerna gör rätt, men de röda idioterna vill ha mer AI och iPads. Sad!", "stalin": "Kamrater, denna skärmpandemi är ett verk av de dekadenta klassförrädarna som förgiftar folkets ungdom med sina blanka apparater. Jag ser hur koncentrationsförmågan vittrar sönder och uthålligheten förintas. Vi måste likvidera denna parasitiska påverkan, införa total utrensning av skärmarna från skolorna och återupprätta läsningens järndisciplin. Motståndarna skall krossas utan pardon."}, "date": "8 september, 15:04", "url": "https://www.di.se/debatt/pisa-bekraftar-den-pagaende-skarmpandemin"}, {"type": "image-full", "heading": "Åkesson om Busch-utspelet: vänsterflört största hotet", "summaries": {"normal": "Ebba Busch (KD) har öppnat för att det inte är givet med SD-ministrar i en blågul regering, vilket har väckt kritik. Jimmie Åkesson (SD) svarar att det största hotet mot regeringen är andra partiers vänsterflörtande. SD blir antingen regerings- eller oppositionsparti efter valet.", "trump": "Ebba Busch säger att hon kanske inte vill ha Jimmie Åkesson och Sverigedemokraterna som ministrar. Otroligt illojalt! Själv sätter jag alltid America First, men här pratar vi om dåliga dealmakare som flörtar med radikala vänsterelement. SD står starka, men de här svaga politikerna riskerar att förstöra hela den blågula vinsten. Tragiskt!", "stalin": "Dessa småborgerliga politiker gräver sin egen undergång i en patetisk maktkamp inför valet. Medan Busch vacklar och flörtar med socialdemokratin, svarar Åkesson med sedvanlig kontrarevolutionär retorik. Statsapparaten betraktar deras parlamentariska sandlåda med förakt; vi skulle ha skickat hela det borgerliga gardet på omkolonisering till Sibirien för länge sedan."}, "date": "8 september, 15:05", "url": "https://bulletin.nu/akesson-om-busch-utspelet-vansterflort-storsta-hotet", "imageUrl": "https://cdn.bulletin.nu/articles/f32ea319-499d-4d85-918d-464750bbd15d/preview.jpg?t=1788872678000"}, {"type": "image-right", "heading": "Möt inte Pisa med tvärsäkra svar. Skoltrenden är global", "summaries": {"normal": "Pisa-mätningen visar en global nedgång i 15-åringars kunskaper, särskilt i den rika världen. Artikeln varnar för enkla förklaringar som mobiltelefoner eller covid och kritiserar hur politiker från alla läger använder resultaten för att bekräfta sina egna åsikter. Problemet kräver seriös hantering bortom partipolitik och stickspår som driftsformer.", "trump": "Lyssnar ni på de förlorande globalisterna och deras så kallade Pisa-test? Kunskaperna rasar i hela den rika världen, men de skyller på allt utom sina egna usla idéer. Skärmpandemi? Absolut, men de dekadenta woke-vänstermediasnuten vill bara ha mer identitetspolitik och kvotering. Vi behöver riktiga lösningar, inte mer av Bidens misslyckade skärmskola. Jag fixade det bättre förra gången.", "stalin": "Kamrater, detta kunskapsfall i den dekadenta västvärlden är en varning till alla som tvivlar på partiets linje. De profitthungriga klassförrädarna skyller på skärmar eller virus medan de i hemlighet planerar att förgifta ungdomen med sin imperialistiska propaganda. Jag ler mörkt från historien åt deras panik. Inga ursäkter! Rensa ut alla som vägrar se det alarmerande hotet mot folkets framtid."}, "date": "8 september, 15:04", "url": "https://www.di.se/ledare/mot-inte-pisa-med-tvarsakra-svar", "imageUrl": "https://static.bonniernews.se/ba/6918d2e5-8186-4b15-b6da-aee2019062f6.jpeg?crop=8256%2C4128%2Cx0%2Cy688&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Nu har Trump lekt med kartan igen: \"Helt olämpligt\"", "summaries": {"normal": "Donald Trump publicerade en karta på Truth Social där USA inkluderar Grönland, Island, Kanada, Mexiko och Centralamerika. Islands utrikesminister kallade inläggningen helt olämpligt. Danmark och Grönland har upprepade gånger avvisat tanken på att bli amerikanskt territorium. Carl Bildt jämförde utspelet med hypotetiska kartor från Xi Jinping och Putin.", "trump": "Folk, ni borde se ansiktena på dessa patetiska globalister! Min karta visar det uppenbara – vi gör Amerika stort igen, inklusive de fantastiska platserna som desperat behöver vår ledning. Stackars lilla Island gnäller, och den socialistiska danska dockan Frederiksen är hysterisk. Biden skulle aldrig vågat detta. Sad!", "stalin": "Jag betraktar med djup misstro dessa dekadenta västerländska imperialister som leker med kartor som om de vore herrar över världen. Sådana provokationer avslöjar deras svaghet och paranoia. Kamraterna ser hur de skräckslagna småstaterna darrar. En dag skall deras falska allianser krossas under arbetarklassens järnhand. Förnöjsamt."}, "date": "8 september, 13:34", "url": "https://www.dagensps.se/varlden/nu-har-trump-lekt-med-kartan-igen-helt-olampligt", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/sdls8vpkejrjgy-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "SD-politiker fick hästar knivskurna: \"Du ska dö rasistjävel\"", "summaries": {"normal": "Jenny Voittonen, SD-gruppledare i Örnsköldsvik, har utsatts för brutala attacker mot sina djur, inklusive knivskurna hästar och stympade hönor. Händelserna, som föregåtts av dödshot, polisanmäls men saknar misstänkta. Voittonen misstänker att attackerna är politiskt motiverade men tänker inte låta sig tystas.", "trump": "Helt otroligt! De ger sig på den fantastiska Jenny Voittonens djur i Sverige. Sjukt, totalt galet! Jag har sagt det för absurda radikaler och jihad-fasoner förstör allt. Hästar skurna, hönor utan huvud i brevlådan! Helt otroligt svagt av polisen att inte gripa någon. Men Jenny är tuff, hon viker sig inte. En riktig vinnare!", "stalin": "Ett uppenbart sabotage mot statens ordning i denna skogiga region. När djur stympas och ledare hotas ser vi fiendens finger överallt. Vår säkerhetstjänst skulle lösa detta på fem minuter. Denna Voittonen visar dock prov på disciplin. Vi noterar hennes motståndskraft, men bristen på gripna visar att apparaten sviker. Åtgärder måste vidtas."}, "date": "8 september, 13:17", "url": "https://samnytt.se/sd-politiker-fick-hastar-knivskurna-du-ska-do-rasistjavel", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/08105912/jenny-voittonen.jpg"}, {"type": "image-right", "heading": "Sverige är bäst i klassen – nu måste vi höja rösten", "summaries": {"normal": "Sveriges konkurrenskraft och starka tillväxt lyfts i ett debattinlägg av Christian Ihre och Johan Ekelin. Trots att Europa kämpar med enorma investeringsbehov och svag tillväxt jämfört med USA och Kina, utmärker sig Sverige med stark BNP och framgångsrika tillväxtbolag. Skribenterna efterlyser att svenska politiker lyfter denna ödesfråga i valrörelsen och tar en ledande roll.", "trump": "Sverige gör det fantastiskt, och jag gillar dem, verkligen! Men deras politiker är totala förlorare som glömmer att prata om det i valrörelsen. Medan Europa, Tyskland och den typen av ställen är ett enda stort, svagt fiasko som släpar efter USA, vinner Sverige med enorma siffror! EQT är bäst, och jag hör att de slår alla rekord. Fantastiskt folk!", "stalin": "De svenska kapitalisternas framgångar med tillväxtbolag och artificiella värderingar är ett fascinerande avsteg från det dekadenta europeiska förfallet. Medan Tyskland och Frankrike hostar i den ekonomiska motvinden, visar Sverige prov på produktionssiffror som kräver noggrann övervakning av statens planeringskommission. Ändå tiger de folkvalda om detta! Ett sådant borgerligt hyckleri måste genast utredas och ställas till svars."}, "date": "8 september, 13:13", "url": "https://www.affarsvarlden.se/debatt/sverige-ar-bast-i-klassen-nu-maste-vi-hoja-rosten", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/09/Ihre-Ekelin-900x600.jpg"}, {"type": "image-full", "heading": "”Så omdömeslöst att man baxnar”", "summaries": {"normal": "Socialdemokraterna publicerade ett Tiktok-inlägg med två dömda gangsterrappare, varav en dömd för grovt vapenbrott och kvinnofridskränkning samt den andre för rån och narkotikabrott. Justitieminister Gunnar Strö
