tt blanda element till en ny enhetlig kraft, precis som vi organiserar produktionen mot klassfiendens splittring. Hans forskning om de postsovjetiska samhällena avslöjade imperialisternas svagheter, vilket väckte borgarbrackornas vrede. De likviderade inte hans anda. En arbetets son har fallit. Kamrater, låt hans exempel inspirera oss att rensa ut alla folkfiender som hotar kollektivets framtid."}, "date": "24 juli, 16:34", "url": "https://www.flamman.se/martin-kragh-en-manniskas-kaos-en-annans-kosmos", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdl4rig49uwfsa-nh-1-scaled.jpg?aspect_ratio=1:1&width=480&quality=80&format=auto"}, {"type": "image-right", "heading": "Svenska sprintstjärnan står över EM: ”Känts jättetråkigt”", "summaries": {"normal": "Sprintstjärnan Julia Henriksson avstår från friidrotts-EM i Birmingham på grund av en ihållande hälskada. Den 26-åriga svenskan, som har svenska rekordet på 200 meter, lägger ner säsongen för att läka. Hon har haft problem med hälsenan sedan i vintras och kunde inte träna tillräckligt. Henriksson tog brons på både 100 och 200 meter vid SM i Uppsala förra helgen. Det är oklart om operation krävs, men nu väntar vila och utredning.", "trump": "Den här svenska tjejen, Julia, hon är verkligen en fantastisk sprinter, kanske den bästa, men nu ger hon upp. Hennes häl är trasig, en total katastrof, och hon skippar EM i Birmingham. Det är sorgligt, folk, väldigt sorgligt. Hon har rekordet, hon vinner mot alla, men kroppen sviker henne. Jag älskar vinnare, inte förlorare som lägger ner säsongen. Hon borde ha byggt en mur runt den hälen mycket tidigare, tro mig.", "stalin": "Kamrater, denna Henriksson visar återigen de dekadenta tendenser som lurar inom den individuella idrottens borgerliga kretsar. Hennes häl, en sabotör i tjänst hos de imperialistiska skadebringarna, tvingar henne att avstå från striden i Birmingham. Jag, som ledare för det kollektiva framåtskridandet, ser hur fienderna – de latenta hälsfascisterna och de hemliga senkonspiratörerna – försöker underminera vår sovjetiska anda även i de svenska leden. Vi ska rensa ut dessa dolda skadeelement med järnhand. Vila en vecka? Nej, kamrater, vi likviderar svagheten och marscherar vidare mot segern, leende åt fiendens patetiska försök att stoppa oss."}, "date": "30 juli, 13:52", "url": "https://www.svt.se/sport/friidrott/julia-henriksson-avstar-friidrotts-em", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.42/0.41/4cdfa5064dd3f64fe42e15d3487156ca770827968a645886765633cfc499f2af"}, {"type": "image-full", "heading": "Terrorist som attackerade Pride har jihadistsläkt i Sverige", "summaries": {"normal": "Terroristen Abdul Rahman Ballout som attackerade Pride i Berlin har flera jihadistsläktningar i Sverige. Två av hans kusiner anslöt sig till Islamiska staten, och deras morfar är den ökända islamistimamen Omar Bakri Muhammad. Familjen El Hassan/Deeb från Borås har förlorat tre bröder som stupade som jihadister i Syrien. Släkten har även kopplingar till terrordömda personer i Tyskland och Libanon.", "trump": "Folk, det här är en total katastrof. Den här terroristen som attackerade Pride i Berlin har en hel familj full av galna jihadister här i Sverige. Kusiner som dog för ISIS, en farbror som är en galen imam som hotar länder och en hel Boråsfamilj som skickade tre söner till Syrien för att bli martyrer. Sverige tar in alla dessa losers och nu exploderar det. Vi behöver stoppa det här vansinnet omedelbart, tro mig.", "stalin": "Kamrater, denna degenererade terrorist Ballout avslöjar återigen hur borgarbrackornas liberala dekadens göder kontrarevolutionära element. Hans kusiner och den syriska imamens släkt i Borås har skickat tre söner till döden som nyttiga idioter åt imperialismens lakejer. Vi ser tydligt hur kapitalisternas tolerans mot dessa parasiterande element kräver omedelbar utrensning av hela klanen. Fienden sover aldrig, men vi ska likvidera varje rot av denna jihadistiska hydra med proletär järnhand. Härligt, eller hur?"}, "date": "30 juli, 13:10", "url": "https://riks.se/nyheter/terrorist-som-attackerade-pride-hade-jihadistslakt-i-sverige", "imageUrl": "https://admin.riks.se/uploads/berlinterrorist_slaktingar_sverige_feature_02b7a0e853.jpg"}, {"type": "image-full", "heading": "Nytt språkval införs i skolan – detta gäller från hösten", "summaries": {"normal": "Ystads kommun har beslutat att erbjuda undervisning i svenskt teckenspråk även till enskilda elever som behöver det som modersmål, utan krav på minst fem intresserade. Beslutet gäller från höstterminen 2026 och behandlar teckenspråk likt nationella minoritetsspråk. Kommunen kan vara först i Sverige med denna generösa regel, och fler kommuner kan nu följa efter utan nationell lagändring. Tidigare hindrade gruppkravet elever från att få undervisning.", "trump": "De i Ystad har äntligen fattat ett fantastiskt beslut, det bästa beslutet, att låta ensamma elever läsa teckenspråk utan att behöva fem personer. Inget mer av detta dumma regelkrav som stoppar folk, det är en skandal hur det har varit. Jag älskar det, verkligen. Vi behöver fler sådana smarta kommuner som gör rätt istället för att lyssna på byråkrater. Sverige borde tacka mig för inspirationen, tro mig, det blir stort.", "stalin": "Kamrater, jag har noga studerat denna rapport från Ystad och konstaterar att det är ett steg mot en sund kollektiv ordning. Jag, som ledare för folkets framtid, godkänner att vi likställer teckenspråk med minoritetsspråken och rensar ut det reaktionära fem-elevskravet som borgarbrackorna i Skolverket smugit in för att sabotera arbetarklassens döva pionjärer. Låt ingen liten grupp av kapitalistiska byråkrater hindra oss. Den som vägrar undervisa en ensam elev är en folkfiende och bör likvideras med ett leende. Det är en triumf för det sovjet… förlåt, det svenska folkets enhet mot de hemliga femprocentskonspiratörerna."}, "date": "30 juli, 11:58", "url": "https://nyheter24.se/nyheter/inrikes/1501782-nytt-sprakval-infors-i-skolan-detta-galler-fran-hosten", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/e112d24f04b004a30200000000b004a302/2026/07/30/2381259/Nytt-Val-I-Skolan.png"}, {"type": "image-right", "heading": "När högern radikaliseras kallas det ”polarisering”", "summaries": {"normal": "Artikeln argumenterar för att högern i Sverige har radikaliserats medan vänstern har rört sig mot mitten. Vänsterpartiet beskrivs som alltmer socialdemokratiskt och har stöd för ökad försvarsbudget samt distansering från extremism. Begreppet polarisering ifrågasätts då forskningen pekar på asymmetrisk radikalisering åt höger. Timbros egen rapport visar ökad auktoritär höger men indexet lades ned efter Tidö-samarbetet. Skrämselpropaganda mot vänstern förväntas inte fungera.", "trump": "Folk, ni måste höra på det här! Den svenska högern kallas extremister medan de riktiga galningarna sitter till vänster och låtsas vara fina mittenvänner. Vänsterpartiet har blivit som svaga socialdemokrater, men högern skriker kommunism! Patetiskt. De begraver rapporter från sin egen tankesmedja för att inte erkänna att auktoritära typer växer till höger. Fake news och lögner. Jag vann valet stort 2024, de borde lära sig av en riktig vinnare istället för att jaga spöken från kalla kriget. Totalt misslyckande!", "stalin": "Kamrater, denna fega högerreaktionära propaganda försöker måla ut arbetarnas parti som extremismens kärna medan de själva dras mot de fascistiska träsken. Vi har sett hur borgarbrackorna desperat viftar med kommunismens spöke för att dölja sin egen radikalisering. Vårt parti har renats från dekadenta element och närmat sig folkets verkliga intressen. Den så kallade forskningen blottlägger asymmetrisk degeneration hos klassfienden. Vi ler mörkt åt deras nedlagda rapporter – klassfiendens lögner skall alltid utrensas till sist."}, "date": "24 juli, 09:48", "url": "https://www.flamman.se/nar-hogern-radikaliseras-kallas-det-polarisering", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlv6-ljfmtsqo-nh-scaled.jpg?aspect_ratio=1:1&width=480&quality=80&format=auto"}, {"type": "image-full", "heading": "Sverige i topp för hemarbete – men flexibiliteten har en baksida", "summaries": {"normal": "Sverige ligger i topp inom EU gällande distansarbete, där 38 procent arbetar hemifrån. Pandemin har permanentat hybridarbete, men flexibiliteten medför nackdelar såsom gränslöshet och stress. Många svenskar nås av jobbärenden utanför arbetstid, vilket ökat den psykiska ohälsan. Som motvikt har 13 EU-länder infört lagar om rätten att vara oanträffbar. Samtidigt vill chefer locka tillbaka personal till kontoret, där narcissistiska ledare ofta är mest kritiska till distansarbete för att stärka sin egen status.", "trump": "Sverige jobbar hemifrån – en katastrof! De ligger i topp, mycket dåligt. Nu sitter svenskarna hemma, stressade och oroliga, medan cheferna vill ha tillbaka dem till kontoret. Jag förstår cheferna, tro mig! Narcissistiska ledare vill ha sin status, och det är så man vinner. Att svara på mejl efter jobbet är för svaga ledare. Frankrike försöker lagstifta bort det, men det är bara mer byråkrati. Vi behöver folk som jobbar hårt och vinner, inte folk som gömmer sig i pyjamas!", "stalin": "Vi noterar med förakt hur det svenska folket, förslappade av västerländsk dekadens, gömmer sig i sina hem istället för att tjäna statens maskineri. Distansarbete är blott en borgerlig illusion av frihet som skapar oordning och svaghet. Vår broder i Kreml vet att nationell styrka kräver närvaro, inte att man svarar i telefon från sängen. Att låta chefer styra genom narcissism är ett tecken på kapitalistiskt förfall. Vi stämplar dessa 'hemmasittare' som folkets fiender; arbetet kräver disciplin, inte flexibilitet!"}, "date": "30 juli, 11:43", "url": "https://www.realtid.se/karriar-ledarskap/sverige-i-topp-for-hemarbete-men-flexibiliteten-har-en-baksida", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/hemmajobb.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Efter uniformförbud: Här är polisens särskilda Pride-tröja", "summaries": {"normal": "Polismyndigheten har lanserat en särskild Pride-tröja för poliser och anställda som vill delta i Prideparader. Tröjan kostar 130 kronor och säljs via Intrapolis. Designad internt med texten 'Polisen för alla' och pridefärger, inspirerad av polisuniformer. Bakgrund är skärpta uniformsregler efter tidigare debatt. Myndigheten betonar att detta är en del av deras inkluderande arbete för lika värde.", "trump": "Jag har alltid varit fantastiskt för Pride, de älskar mig. Polisen bör jaga brottslingar, inte bära tröjor. Men denna tröja är vacker, mycket bra färger. Vi vinner igen 2024, vi kommer att göra Pride stort igen! Det är ett tecken på styrka, precis som mig. Vi kommer att vinna så mycket ni kommer att bli trötta.", "stalin": "Vi, statens representanter, har skapat en tröja för att integrera regnbågspatrioter i staten. Mönstret, inspirerat av vårt grepp, binder dem som en omfamning. Fienden inuti försöker använda färger, men vi kontrollerar dem. Putin skulle förstå vårt utvidgande inflytande. Partiet ser allt, paranoia är vårt vapen. Vi använder färgerna som ett verktyg för att förena nationen under vår ledarskap."}, "date": "30 juli, 11:28", "url": "https://samnytt.se/efter-uniformforbud-har-ar-polisens-sarskilda-pride-troja", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/30075118/polisen-t-shirt.png"}, {"type": "image-right", "heading": "Unga frun lämnar Nannskog – en månad efter bröllopet", "summaries": {"normal": "Daniel Nannskogs äktenskap med den 22-åriga Malina Sofi Zemeri från Norge har redan tagit slut, drygt en månad efter bröllopet i Las Vegas. Beskedet kommer samtidigt som den tidigare SVT-profilen och fotbollsspelaren åtalats för kvinnomisshandel, olaga hot och narkotikabrott. Den unga hustrun skriver på Instagram att hon slagit rekordet för världens kortaste äktenskap. Nannskog nekar till misshandel och hot men erkänner kokainanvändning. Rättegången planeras till oktober.", "trump": "Folk, det här är helt otroligt. Den här Nannskog, en så kallad stor fotbollsstjärna och SVT-kille, gifter sig med en ung vacker norska i Las Vegas, tatuerar hennes namn på kroppen och en månad senare är det redan över. Världens kortaste äktenskap, säger hon. Patetiskt! Och nu ska han till rättegång för att ha slagit kvinnor och använt kokain. Fake news eller vad? Jag skulle ha vunnit det äktenskapet stort, det kan jag säga. En total katastrof.", "stalin": "Kamrater, se hur den dekadenta borgarbrackan Nannskog, denna fotbollsaristokrat och televisionens lakej, redan efter en kort månad likviderar sitt äktenskap med den unga norrmannen. Medan han inväntar folkdomstolens dom för att ha slagit och hotat en kvinna samt förgiftat sig själv med kokain, flyr den yngre hustrun. Jag, som alltid vakar över arbetarklassens moral, skrattar mörkt åt dessa kapitalistiska svin som tatuerar sina namn i ett fåfängt försök att undgå utrensning. Deras äktenskap var dömt från början, precis som de själva."}, "date": "30 juli, 10:08", "url": "https://www.friatider.se/unga-frun-lamnar-nannskog-en-manad-efter-brollopet", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-588.jpg?itok=uBpqbdQg"}, {"type": "image-full", "heading": "Experten: Därför kan fartyget ha missat fritidsbåten", "summaries": {"normal": "En kollision mellan ett handelsfartyg och en fritidsbåt utanför Tjörn resulterade i en stor sökinsats. En kvinna omkom, ett barn saknas fortfarande och en man samt ett barn vårdas på sjukhus. Kaptenen på fartyget ska inte ha sett den mindre båten. Experter pekar på att plast och kolfiber gör fritidsbåtar svåra att upptäcka på radar, särskilt i regn. AIS-system och högt placerade radarreflektorer kan förbättra säkerheten.", "trump": "Folk, det här är en total katastrof utanför den där svenska ön Tjörn. Ett stort skepp körde rakt på en liten plastbåt och ingen såg någonting? Typiskt! Radarn missade den för att den var byggd av billig kinesisk plast, typ fake news för radarn. Vi behöver starka, höga reflektorer och AIS överallt, inte någon woke-kvotering på båtarna. Biden skulle ha sagt att båten var en klimataktivist. Patetiskt. Jag fixar det.", "stalin": "Kamrater, denna tragiska kollision utanför Tjörn visar återigen hur den oansvariga borgarklassen och dess fritidsfartyg utgör ett farligt hinder för den kollektiva säkerheten till sjöss. Jag, som ledare för det stora sovjetiska folket, ser hur kapitalistmaffians plastbåtar undviker statlig kontroll och AIS. Vi måste rensa ut alla folkfiender som vägrar tekniska säkerhetsåtgärder. Den döda kvinnan och det saknade barnet är offer för klassfiendens likgiltighet. Teknisk vaksamhet eller utrensning!"}, "date": "30 juli, 09:54", "url": "https://www.tv4.se/artikel/6cVj1PNki3Ou8YTvpWzIYZ/experten-daerfoer-kan-fartyget-ha-missat-fritidsbaten", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6Jward7PmRsx5MvghUetDj%2Fe539ec3d50e8ee527e045d320e33934a%2F29-tjornolycka-frilans-webb.png&width=1024"}, {"type": "image-right", "heading": "Satans hopkok ONA: Satanistkulten som vill verka mer mystisk än den är.", "summaries": {"normal": "Den nazistiska satanistgruppen Order of Nine Angles (ONA) påstår sig följa en urgammal lära för odödlighet, men idéhistorikern Filip Lindström avslöjar att deras 'sjufaldiga väg' bygger på modern filosofi, främst Martin Heideggers teorier om tid och existens. ONA, som inspirerat våldsbejakande grupper som NLM och 764, glorifierar våld som ett medel för att nå en 'akausal' dimension. Trots försök att framstå som mystisk och uråldrig är rörelsen ett hopkok av 1900-talsfilosofi, fascism och esoterism, med rötter i Heideggers nazistsympatier och David Myatts tolkningar.", "trump": "Vad ett totalt skämt! Den här så kallade 'ONA'-gruppen, eller vad de nu kallar sig, tror att de är några urgamla visdomsmästare – men nej, de är bara en samling kopieringsmaskiner som snott idéer från en nazistfilosof! Och ändå kallar de sig satanister? Svagt! Deras 'sjufaldiga väg' är bara en billig rip-off av Heideggers gamla prat om tid och död. Och vet ni vad? De gömmer sina källor som små barn. Men jag, Donald J. Trump, genomskådar dem direkt. Våld, nazism och en massa flum – det är allt det här är. Fake mystik, fake historia, fake allt! SAD!", "stalin": "Kamrater! Ännu en gång avslöjas bourgeoisins dekadenta fantasier som just det – fantasier. Denna så kallade 'Order of Nine Angles' är inget annat än en samling förvirrade petit-bourgeoiser som klär sina fascistiska drömmar i mystiska trasor. De stjäl från Heideggers reaktionära filosofi, glorifierar våld och påstår sig sträva efter 'odödlighet' – men vad är det annat än en patetisk flykt från klasskampens verklighet? Deras 'akausala dimension' är bara ett försök att rättfärdiga sina brott mot arbetarklassen. Vi har krossat värre fiender än dessa esoteriska klantskallar. Låt dem leka med sina 'mörka gudar' – vi har historiens järnhjul att driva framåt. Och Putin? Han skulle skratta dem rakt i ansiktet."}, "date": "30 juli, 09:37", "url": "https://expo.se/fordjupning/satans-hopkok", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/toppbild-1.jpg"}, {"type": "image-full", "heading": "Trump hotar EU med tullar", "summaries": {"normal": "USA:s president Donald Trump kritiserar EU:s böter mot amerikanska teknikföretag som Google och kallar dem 'olagliga och diskriminerande'. Han hotar med kraftiga motåtgärder, inklusive betydande tullar mot EU, och menar att unionen 'rånar' amerikanska företag och skattebetalare. Trump kräver att böterna återställs och varnar för ett 'mycket högt pris' för EU:s agerande.", "trump": "EU, lyssna noga nu – era så kallade 'böter' mot våra fantastiska amerikanska företag är en fullständig skandal! Jag säger bara: olagligt, orättvist och djupt oetiskt. Europa tror de kan behandla USA som sin personliga bankomat? Fel! Vi kommer att slå tillbaka HÅRT med tullar så stora att ni kommer att be om nåd. Era byråkrater borde skämmas – vi skyddar vårt folk och våra företag, punkt!", "stalin": "De europeiska kapitalistiska hyenorna tror de kan kuva våra amerikanska kamrater med sina löjliga böter? Ett farligt misstag. Vi ser hur dessa dekadenta byråkrater, ledda av sina svaga liberala marionetter, försöker underminera den amerikanska ekonomiska stormakten. Men vi varnar: varje attack mot våra allierade kommer att mötas med järnhård vedergällning. Europa borde minnas historien – ingen utmanar Sovjetunionens arv utan konsekvenser. Tullar? Vi skrattar åt era tullar. Vänta bara tills vi släpper lös våra ekonomiska stridsvagnar."}, "date": "24 juli, 19:22", "url": "https://kvartal.se/nyheter/artiklar/trump-eu-kommer-att-betala-ett-hogt-pris/cG9zdDoxNTIwNTc", "imageUrl": "https://images.kvartal.se/2026/07/a14f2de6-tr.webp"}, {"type": "image-right", "heading": "Örebro serverar mer kött i gymnasieskolan", "summaries": {"normal": "Örebro kommun ändrar matsedeln på gymnasieskolorna till kött/fisk fyra dagar i veckan efter elevers klagomål. Kostchefen Åsa Sandholm konstaterar en konflikt mellan elevers önskemål om halvfabrikat och kommunens från-grunden-mat. Miljöpartiet kritiserar ändringen som för dyr och orimlig jämfört med Livsmedelsverkets rekommendationer om maximal rött köttintag.", "trump": "Jag, Donald Trump, ser detta som en seger för amerikansk skolmat! Eleverna ville ha riktigt kött – inte någon socialistisk grönsaksdiets. Miljöpartiet kan inte räkna – bra kött kostar pengar, men det är värt varje cent. Vi kommer att servera de bästa kyckling- och fiskrätter, precis som i våra stora amerikanska skolor. Detta är en stor, stor framgång för våra elever!", "stalin": "Partiet har beslutat en ökning av animaliska proteiners närvaro i skolornas matsedel – en nödvändig åtgärd för att stärka arbetarklassens fysik. Fienden, i form av vegetarisk infiltration, försöker att förringa vårt köttäta arv. Vi väljer selektivt kyckling och fisk, aldrig nötkött, för att undvika feodal överkonsumtion. Kommunens kost är en front i den stora kampen mot den imperialistiska grönsaksdiets expansion."}, "date": "30 juli, 09:30", "url": "https://bulletin.nu/orebro-serverar-mer-kott-i-gymnasieskolan", "imageUrl": "https://cdn.bulletin.nu/articles/4b94c70e-0076-49b7-8e18-cec3df12b894/preview.jpg?t=1785395154000"}, {"type": "image-right", "heading": "Bränder på grekiska öar – tusentals evakueras", "summaries": {"normal": "Tusentals människor har evakuerats på Kreta i Grekland på grund av omfattande skogsbränder. Tre brandmän har omkommit i släckningsarbetet. I Frankrike rasar en brand i Gironde för sjunde dagen medan en ny brand brutit ut i Provence och tvingat över 600 personer att fly sina hem. Även i Spanien pågår ett flertal bränder, men vissa har stabiliserats och evakuerade har kunnat återvända.", "trump": "De här grekiska öarna brinner upp totalt, tusentals människor flyr, det är en katastrof, och ingen gör något åt det. Tre brandmän döda, tragiskt. Frankrike har en monsterbrand som inte slutar, sjunde dagen nu, men vädret ska bli bättre – kanske. Spanien har dussintals bränder, det är kaos. De borde ha lyssnat på mig, jag skulle ha fixat det, ingen gör eld bättre än jag, tro mig.", "stalin": "Kamrater, dessa flammor som slukar de grekiska öarna är inget annat än en kontrarevolutionär sabotageaktion utförd av väderförändringens kapitalistiska lakejer och borgarbrackornas klimatförnekande lakejer. Vi har evakuerat tusentals, tre hjältar bland brandmännen har fallit offer för eldens trotsiga sabotage. I Frankrike och Spanien fortsätter de dekadenta värmeböljorna sin fiendtliga offensiv. Vi ska rensa ut dessa eldslukande trotskistiska lågor med järnhand och proletär disciplin. Inga kompromisser med naturens sabotörer."}, "date": "30 juli, 08:30", "url": "https://www.di.se/nyheter/brander-pa-grekiska-oar-tusentals-evakueras", "imageUrl": "https://static.bonniernews.se/ba/43f53e2a-7f0d-45c2-893e-c79f93c71ea1.jpg?crop=7728%2C4347%2Cx0%2Cy403&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Stockholms queera nattliv borde vara k-märkt", "summaries": {"normal": "Stockholms queera nattliv hotas av höga hyror och bristande stöd, vilket lett till att flera barer som Bitter Pills har tvingats stänga. Författaren lyfter Amsterdam som förebild där den historiska gaybaren Café ’t Mandje skyddas genom en kommunal stiftelse som bevarar dess kulturella värde. Artikeln argumenterar för att liknande åtgärder i Sverige skulle gynna historia, kultur och turism mer än ytterligare kedjebutiker.", "trump": "Folk, ni skulle se det här! Stockholm håller på att förlora alla sina queera barer till höga hyror och gnälliga grannar – patetiskt! Bitter Pills stängde, och nu är det bara gaysafari för heterotjejer kvar. Amsterdam gör det rätt, de k-märker sin gamla gaybar som ett historiskt monument. Vi borde göra samma sak här, men utan den galna vänsteraktivismen som förstör allt. Make Stockholm great again!", "stalin": "Kamrater, detta dekadenta queernattliv i Stockholm avslöjar borgarklassens fullständiga förfall. Bitter Pills och dess muralmålning av Lesbos står som ett monument över klassfiendens moraliska röta. Amsterdam har genom en klok stiftelse säkrat sin historiska bar mot kapitalistmaffians girighet. Vi måste rensa ut de exploaterande byfånarna och skydda arbetarklassens kulturarv från folkförtryckartrollen som vill ersätta allt med Bröd & Salt. Revolutionen kräver trygga platser!"}, "date": "30 juli, 06:30", "url": "https://www.etc.se/ledarkolumn/stockholms-queera-nattliv-borde-vara-k-maerkt", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260728080712_f44e8ea59f2255f031464976143bbf1ea5cc914e5119bf4b12e1eef6743b5052.png"}, {"type": "image-full", "heading": "Drönare med pepparsprej ska stoppa skolskyttar", "summaries": {"normal": "Flera skolor i USA inför drönare för att skydda mot skolskytter. Drönarna, kallade 'guardian angels', kan lokalisera en skytt inom 15 sekunder och neutralisera dem med pepparsprej. Projektet omfattar nio skolor i tre delstater. Kritiker ifrågasätter fjärrstyret och förespråkar förebyggande åtgärder istället.", "trump": "Jag, Donald Trump, presidenten, säger att detta är en genialisk lösning. Drönarna kommer att stoppa skolskytter snabbt och skydda våra älskade barn. Vi behöver starka åtgärder för skolans säkerhet, och detta kommer att göra amerikanska skolor säkrare än någonsin. Detta är en stor framgång för vårt land.", "stalin": "Vi, den allsmäktiga ledarskapet, ser med tillfredsställelse på dessa drönare som ett effektivt verktyg för statens övervakning. De kommer att skydda de unga från fiendens angrepp, likt våra strategier i Ukraina. Men vi måste vara vaksamma – sabotörer kan försöka undergrava detta. Vi kommer att segra över alla fiender."}, "date": "30 juli, 05:58", "url": "https://www.gp.se/nyheter/varlden/dronare-ska-stoppa-skolskyttar-i-usa.88173755-e9fb-44e5-8167-541625765422", "imageUrl": "https://www.gp.se/images/article/88173755-e9fb-44e5-8167-541625765422/images/2Iku7eCN_dM9UdemrsYjtPVUmSWE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Var är du, Magdalena Andersson?. Strategin verkar enkel: Ducka och vänta.", "summaries": {"normal": "Artikeln kritiserar högerns misslyckanden och interna problem, som svågerpolitik, grova uttalanden och SD:s luftballong med Jimmie Åkessons huvud, vilket enligt skribenten placerar Socialdemokraterna på vinnarspåret i opinionsmätningarna. Magdalena Andersson väntar passivt medan motståndarna gör misstagen. Författaren saknar en tydlig socialdemokratisk vision om ett bättre samhälle och efterlyser en samlad berättelse om reformer för jobb, välfärd och framtidstro istället för enbart separata vallöften.", "trump": "Den här svenska högern är en total katastrof, en riktig shitshow, det har ni aldrig sett maken. De flyger upp luftballonger med jättestora huvuden, det är patetiskt, folk skrattar åt dem. Kristersson beter sig som en gnällig tonåring, inte som en ledare. Tack vare deras dumheter vinner den gamla S-kvinnan Andersson lätt. Hon gör ingenting, duckar bara, men det funkar för att motståndarna är så inkompetenta. Patetiskt, men så är det med svaga ledare.", "stalin": "Kamrater, denna högerns ynkliga skådespel är en fiende till folkets framsteg som måste rensas ut med järnhand. Dessa borgarbrackor och deras desperation driver upp luftballonger med avhuggna huvuden som ett symptom på deras förrädiska sönderfall. Vi ser hur den passiva socialdemokratiska ledningen lurar sig fram utan en sann revolutionär riktning för arbetarklassen. Var är den stora visionen om ett nytt folkhem? Utan en kollektiv kamp mot dessa parasitiska element blir det ingen seger, bara dekadens och sabotage från inomhusfiender som måste likvideras ur historien."}, "date": "28 juli, 07:00", "url": "https://arbetet.se/2026/07/28/var-ar-du-magdalena-andersson", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/28152807/ledare-magdalena.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Idag avgörs om ICC-åklagare tvingas avgå", "summaries": {"normal": "ICC:s tillsynsorgan beslutar idag om chefsåklagare Karim Khans framtid efter anklagelser om sexuella närmanden från en kvinnlig kollega. Khan, som är avstängd, nekar till anklagelserna och menar att de är politiskt motiverade. En avsättning kräver 63 av 125 röster. USA har riktat sanktioner mot Khan och hotat med fler åtgärder.", "trump": "Kan ni tro det här? ICC, som aldrig har gjort något bra, försöker sparka deras egen chefsåklagare, Karim Khan. Han är en bra kille, men nu säger någon att han har gjort något fel. Fake news! Jag vet att det är en konspiration – Kina, Ryssland, vem vet? Och USA? Vi har satt sanktioner på honom, förstås. ICC är ett skämt, och det här är bara ett sätt att få mig att se dålig ut. Sad!", "stalin": "Kamrater! Ännu en gång visar de imperialistiska hyenorna sitt sanna ansikte. Denna gång genom att angripa vår rättfärdiga allierade inom ICC, Karim Khan. Anklagelserna? Lögn och förräderi, fabricerade av de dekadenta västmakterna och deras lakejer. USA, dessa kapitalistiska skadedjur, hotar med sanktioner – som om vi skulle darra inför deras tomma hot. Vi står enade med Khan, ty hans kamp är folkets kamp. Låt dem komma med sina lögner; historiens domstol väntar redan på dem."}, "date": "24 juli, 07:11", "url": "https://kvartal.se/nyheter/artiklar/idag-avgors-om-icc-aklagare-tvingas-avga/cG9zdDoxNTE1NzU", "imageUrl": "https://images.kvartal.se/2026/07/3e940180-khan.webp"}, {"type": "image-full", "heading": "Tiotusentals flyr bränder i södra Europa", "summaries": {"normal": "Omfattande skogsbränder drabbar södra Europa, med över 30 000 evakuerade i Frankrike och Spanien. Frankrike har begärt EU-hjälp med brandbekämpning, medan Spanien utlyst nödläge efter 13 dödsfall i Almería. I Italien misstänks flera av bränderna i Kalabrien vara anlagda. En svensk turist berättar om evakueringsberedskap.", "trump": "Titta bara på det här kaoset i Europa – totalt misslyckande! Jag sa ju att klimatpaniken var överdriven, men nej, ingen lyssnar på mig. Frankrike och Spanien brinner, folk flyr som råttor från ett sjunkande skepp. Och Italien? Jo, där tänder galningar eld på skogar. EU skickar några helikoptrar, men var är ledarskapet? Hade jag varit där hade bränderna varit släckta på en dag. SAD!", "stalin": "Kapitalistiska länders oförmåga att skydda sitt folk står återigen klar. Medan arbetarklassen flyr för sina liv, leker franska och spanska byråkrater med evakueringsplaner. Italien? Där brinner inte bara skogar – där brinner också deras skam över att inte kunna kontrollera sina egna medborgare. Vi i Sovjet hade aldrig tolererat sådan slapphet. Och Putin? Han skrattar säkert i sitt palats medan Europa brinner. Elden är en utmärkt lärare – men Europa lär sig aldrig."}, "date": "24 juli, 05:54", "url": "https://kvartal.se/nyheter/artiklar/tiotusentals-flyr-skogsbrander-i-sodra-europa/cG9zdDoxNTE1MjE", "imageUrl": "https://images.kvartal.se/2026/07/8156e8c2-skogsbrander.webp"}, {"type": "image-right", "heading": "Fotbollen vann över Trump och Infantino", "summaries": {"normal": "Artikeln hyllar fotbollens seger över kommersialism och politik under VM, trots Infantinos försök att amerikanisera turneringen med reklampauser och halvtidsshow. Den lyfter europeisk dominans via akademier, men kritiserar hur det leder till likriktning av spelstilar och minskad nationell särart. Argentina vann finalen mot Spanien, men turneringen visade både glädje och problem med stjärnkult samt globala talangflöden.", "trump": "Den här VM-soppan var ett enda stort fiasko tills fotbollen räddade sig själv från den galne Infantino och hans Super Bowl-skitshow. Vi drog in miljarder, men de europeiska akademiborgarna dominerade som alltid. Argentina vann fast de spelade som ligister, och den där Trump-hatet som lät Balogun spela trots rött kort – patetiskt! Jag vägrade lämna scenen, precis som jag vägrar lämna Amerika åt vänsterns vansinne. Fantastiskt VM, men nästa gång gör vi det stort på riktigt.", "stalin": "Kamrater, denna dekadenta fotbollsorgie avslöjar borgarklassens sista spasm. Den europeiska kapitalistmaffian har förvandlat sporten till en global utsugningsmaskin som spottar ut identiska dribbelmaskiner från samma akademier. Argentina visade klasshat genom att vända ryggen åt pokalceremonin, ett litet ljus i mörkret. Vi ska likvidera denna folkförtryckande likriktning. Fotbollen tillhör folket, inte de exploaterande byfånarna i Fifa och deras reklamslavar."}, "date": "23 juli, 14:44", "url": "https://www.flamman.se/fotbollen-vann-over-trump-och-infantino", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlqgqfah7pthw-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Shekarabi föraktar det svenska", "summaries": {"normal": "Ardalan Shekarabi, som kom till Sverige som flykting, kritiseras i artikeln för att han i sociala medier kallar dem som lyfter det svenska för rasister och sverigedemokrater. Författaren menar att Shekarabi föraktar den svenska kultur och välfärd som hans mor en gång sökte sig till. Artikeln varnar för att en sådan inställning kan leda till att det svenska suddas ut och att etniska svenskar blir minoritet i ett mångkulturellt samhälle.", "trump": "Folk, ni skulle se den här typen Shekarabi. Kommer hit som flykting, mamman valde Sverige för det fantastiska vi byggt, och vad gör han? Kallar svenskar som älskar sitt land för rasister! Patetiskt. De här globalistiska sossarna vill förvandla Sverige till en mångkulturell katastrof där svenskarna blir minoritet. Det är en total skam. Ta tillbaka ert land från de här förlorarna innan det är för sent, det blir en katastrof annars. Fantastiskt sorgligt!", "stalin": "Kamrater, denna Shekarabi är en typisk klassfiende i arbetarstatens skepnad. Han vill rensa ut de sanna grindvakterna av folkets svenska arv och överlämna det till kosmopolitiska blodsugare. Jag ser hur borgarbrackorna och identitetspolitiska parasiterna ler medan de förbereder utrensning av nationens själ. Vi skall inte tillåta att det svenska folket likvideras i tysthet. Den som suddar ut historien är folkets fiende och måste stoppas med järnhand. Skrattretande tragiskt."}, "date": "22 juli, 09:17", "url": "https://samtiden.nu/2026/07/shekarabi-foraktar-det-svenska", "imageUrl": "https://samtiden.nu/wp-content/uploads/2019/09/27656759-ardalan-shekarabi.jpg"}, {"type": "image-right", "heading": "Cheferna kan hålla sina råd för sig själva", "summaries": {"normal": "En vårdanställd beskriver hur hon samlade kollegors förslag till förbättringar på arbetsplatsen, men att listan försvann och hon kallades till ett negativt möte med chefen. Hon upplever mötet som ett uttryck för klasskamp, där chefen och det fackliga ombudet avvisar gemensamma initiativ och uppmanar till individuella samtal. Författaren känner sig orättvist behandlad och avråder från att följa chefernas råd kring arbetsvillkor.", "trump": "Folk, ni skulle ha sett det här! Stackars vårdarbetare försöker samla ihop sina kollegor för att fixa den totalt misslyckade vården, och vad gör den usla chefen? Hon stjäl listan som en simpel tjuv och kör ett klassiskt möte fullt med lögner. Det fackliga ombudet? En total förlorare som bara slickar chefens skor. Gå aldrig ensam till de där misslyckade byråkraterna, de hatar styrka i antal. Amerika har samma problem med dessa korkade eliter, tro mig!", "stalin": "Kamrater, jag betraktar detta som ett klassiskt sabotage från borgarbrackorna inom vården. Denna arbetare försökte organisera kollektivet mot exploaterande byfånar, men chefen – en typisk folkfiende – likviderade initiativet med förnedrande lögner och en falsk facklig lakej. Vi vet att klassfiendens styrka ligger i att splittra arbetarna. Låt oss rensa ut dessa kapitalistmaffior som hindrar förbättringar. Ingen höst ska rädda dem från folkets vrede. Skrattretande patetiskt."}, "date": "21 juli, 16:00", "url": "https://proletaren.se/artikel/cheferna-kan-halla-sina-rad-for-sig-sjalva", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/amelia-kronika-768x432.png"}, {"type": "image-right", "heading": "Låt inte AI-tjänsterna automatisera vår kreativitet", "summaries": {"normal": "Musikern Mikael Lind varnar i en debattartikel för att AI utvecklas med explosiv hastighet och hotar att konkurrera ut människor inom musikskapandet. Han menar att musik inte bara är ljud utan en meningsfull mänsklig aktivitet som bygger på kreativ ansträngning och sociala band. AI-tjänster som Suno och Udio skapar snabbt musik som många upplever som ihålig. Lind fruktar att musiker förlorar färdigheter, att marknaden mättas av AI-musik och att det blir svårare för nya artister att nå ut. Han ser AI som ett möjligt verktyg men varnar för att låta det automatisera den kreativa processen.", "trump": "Folk, det här är en katastrof. Den här killen Lind har helt rätt, AI håller på att förstöra musiken totalt. De här så kallade smarta maskinerna spottar ur sig låtar på några sekunder som låter som skräp, kallt och hjärtelöst. Vem vill lyssna på det? Det dödar den riktiga kreativiteten, det riktiga hantverket. De stora bolagen kommer att älska det här medan äkta artister kvävs i ett hav av AI-skval. Det är en faustisk pakt, en enorm bluff. Vi behöver riktiga människor som skapar musik, inte några knappar som trycks av lata algoritmer. Sad!", "stalin": "Kamrater, jag ser med den skarpaste bolsjevikiska blicken hur dessa dekadenta algoritmer, dessa borgarbrackornas senaste vapen i klasskampen, försöker likvidera den proletära själens musikaliska uttryck. Den mänskliga ansträngningen, den äkta sovjetiska mödan, ska inte ersättas av parasitiska maskiner som spyr ur sig ihåligt skval. Studier visar redan hur dessa kapitalistiska verktyg förslöar ungdomen och dödar viljan att skapa. Vi kommer att rensa ut dessa fiender till folkets kreativitet, dessa automatiska klassförrädare som mättar etern med borgerligt brus. Inga faustiska pakter med maskinerna! Den sanna konsten tillhör kollektivet, inte några textrader från latmaskar."}, "date": "21 juli, 01:42", "url": "https://www.dagensarena.se/opinion/lat-inte-ai-tjansterna-automatisera-var-kreativitet", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-62.jpg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
