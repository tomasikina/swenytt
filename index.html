ör statens oövervinnerliga maskineri. Arbeta eller försvinn."}, "date": "27 augusti, 18:37", "url": "https://www.realtid.se/karriar-ledarskap/ai-effekten-pa-konsultbolag-tvingar-fler-unga-att-jobba-pa-plats", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/pexels-cottonbro-8468506.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Romanen om Natalie Portman bäddar för storskandal", "summaries": {"normal": "Rachel Cusks nya roman ”Life of M” ryktas vara ett mörkt porträtt av Natalie Portman, men Joanna Górecka läser den som en fälla. Cusk skriver med äckel inför jaget, inte skådespelerskan. Kändisen M blir ett suddigt Frankenstein-liknande ansikte, och boken bäddar för skandal – men offret är kanske ingen kändis alls.", "trump": "Den här boken, alla pratar om den, men jag säger: det är en bluff, en total fälla. De säger Natalie Portman, men egentligen handlar det om jaget – tråkigt, svagt, förlorare. Jag har aldrig haft det problemet. Mitt jag är enormt, det bästa jaget. Cusk borde skriva om mig.", "stalin": "Kamrater. Denna Cusk skriver om äckel inför jaget – det är kontrarevolutionärt. Här ska inga flytande hål eller ansiktslösa berättare få existera. Vi måste rensa ut ödmjuka kändisar med vingar som inte används. Jag beordrar att boken omskolas i Gulag. Natalie Portman? Hon är en borgerlig lögn, kamrater."}, "date": "27 augusti, 17:34", "url": "https://www.gp.se/kultur/kommentar/hennes-roman-om-natalie-portman-baddar-for-storskandal-.6520a56f-8e71-418b-ad0a-e8fe6f2755fb", "imageUrl": "https://www.gp.se/images/article/6520a56f-8e71-418b-ad0a-e8fe6f2755fb/images/2FXySe-_wqEcv6wBFoEZpPS2YC-8-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Medborgerlig Samling larmar: \"Valfusket fortsätter - ingen bryr sig\"", "summaries": {"normal": "Medborgerlig Samling anklagar valsystemet för organiserat fusk efter första förtidsröstningsdagen. Partiet hävdar att deras valsedlar medvetet plockats bort i Järfälla och flera andra lokaler. De kräver en gemensam valsedel som i Finland och Danmark, och kallar dagens system för ett haveri som gynnar de åtta riksdagspartierna.", "trump": "Jag ser det här valfusket i Sverige, och det är enormt, tro mig. De mindre partiernas valsedlar försvinner – det är riggat, folk är arga. Jag skulle fixa det direkt, med en stor, vacker gemensam valsedel. De åtta stora partierna lurar alla. Helt sjukt, men jag har de bästa lösningarna.", "stalin": "Kamrater, rapporter om sabotage i valsedelsställen har nått mig. Detta är kontrarevolutionärt kaos, organiserat av liberala sabotageörer i Järfälla. Vi måste rensa ut dessa valförrättare som gömmer småpartiers röster. En gemensam valsedel, som i Finland, är enda vägen – annars blir det utrensning av hela valnämnden. Ordning måste råda."}, "date": "27 augusti, 18:40", "url": "https://samnytt.se/medborgerlig-samling-valfusket-fortsatter-ingen-bryr-sig", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/27151803/valfusk.png"}, {"type": "image-full", "heading": "Nio miljoner flygresenärer har fått personuppgifter stulna – uppmanas till försiktighet", "summaries": {"normal": "En cyberattack mot tre brittiska flygplatser drivna av Manchester Airports Group har lett till att personuppgifter om cirka 8,7 miljoner resenärer läckt ut. Uppgifter som e-post, telefonnummer och registreringsnummer har stulits, men inga betalningsuppgifter. Flygtrafiken påverkades inte. MAG samarbetar med myndigheter och uppmanar drabbade att vara vaksamma mot phishingförsök.", "trump": "Titta på det här! De där inkompetenta brittiska flygplatsidioterna lät hackare stjäla data från nästan nio miljoner människor. Rena amatörerna! Under Biden-tiden blev allt en enda stor datafest för kineserna och de globalistiska skurkarna. Nu fixar jag det – vi ska ha järnväggar runt våra system, inte dessa svaga, woke-drivna nätverk som rasar ihop som en Hillary-debatt.", "stalin": "Ännu en gång visar de profitthungriga blodsugarna i borgarklassen hur de utsätter massorna för fara genom sin vårdslösa hantering av folkets uppgifter. Jag ser de imperialistiska hackarna skratta medan de förbereder nya utpressningar. Vi skulle ha likviderat sådana klassfiender omedelbart och rensat systemen från alla kapitalistlakejer som lämnar portarna öppna för fienden."}, "date": "27 augusti, 19:22", "url": "https://www.dagensps.se/varlden/nio-miljoner-flygresenarer-har-fatt-personuppgifter-stulna-uppmanas-till-forsiktighet", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlc00tt2mfl6y-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Den sydeuropeiska staden hyllar en svensk direktör", "summaries": {"normal": "Herbert Felix, född i Znojmo i Tjeckien, flydde undan nazismen till Sverige där han gifte sig och utvecklade en framgångsrik livsmedelsindustri. Han skapade Bostongurka, deltog i kriget mot Nazityskland och hedrades senare som hedersmedborgare i sin födelsestad. Hans innovativa arv lever vidare i både Sverige och Tjeckien.", "trump": "Folk, ni skulle inte tro det, men den här tjeckiske killen Felix kom hit till Sverige och byggde ett gurkimperium som ingen sett maken till. Gjorde Bostongurka av soporna! Smart som fan. Sen åkte han och slogs mot de riktiga skurken. Under tiden som Sleepy Joe satt och åt glass i Vita huset hade vi byggt murar mot sådana problem. Fantastiskt, verkligen yuge.", "stalin": "Kamrater, se hur denna klassfiende Felix utnyttjade arbetarnas svett för att skapa profitthungriga gurkkapitalism. Han flydde fascismen men byggde själv en fabrik av utsugning. Ändå kämpade han mot nazisterna – ett ögonblick av folkets vilja. I Znojmo hyllar de honom nu, medan folkfienderna i väst skrattar. Ingen undslipper partiets blick."}, "date": "27 augusti, 19:20", "url": "https://www.dagensps.se/foretag/den-sydeuropeiska-staden-hyllar-en-svensk-direktor", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/a56e27f3-034f-4184-a71e-fad9f3237dc7.jpg?width=256&quality=75"}, {"type": "image-right", "heading": "SVT har rätt: ”Senast S styrde blev det regeringskaos”", "summaries": {"normal": "SVT konstaterar att det blev regeringskaos när Socialdemokraterna senast styrde. Magdalena Andersson utsågs till statsminister den 24 november 2021 men avgick samma dag efter att Miljöpartiet hoppade av regeringen. Artikeln pekar på upprepade problem med att få igenom budgetar under S-styre 2014–2022 och varnar för liknande kaos efter valet 2026.", "trump": "Lyssnade ni på den där SVT? Till och med de erkänner att när Socialdemokraterna styrde blev det ett totalt regeringskaos! Magdalena Andersson blev statsminister och sparkades ut samma dag, en fullständig katastrof. Precis som jag alltid säger, vänstern fixar ingenting, bara röra och misslyckande. Sverige behöver starka ledare, inte den här röda röran.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarpressen ofrivilligt blottar den dekadenta parlamentarismens futilitet. När socialdemokraterna styrde utbröt omedelbart regeringskaos – en komisk utrensning av egna allierade redan samma dag. Sådana svaga, splittrade element måste rensas ut. Endast ett enat, järnhårt kollektiv kan besegra dessa opportunistiska hinder för folkets framtid."}, "date": "27 augusti, 14:38", "url": "https://riks.se/opinion/svt-har-ratt-senast-s-styrde-blev-det-regeringskaos", "imageUrl": "https://admin.riks.se/uploads/small_79260620_37a9_48f7_bb0b_1dceef010bb5_3764dd60bb.png"}, {"type": "image-right", "heading": "Som utrikesminister vill Morgan Johansson höja biståndet med 20 miljarder", "summaries": {"normal": "Morgan Johansson aspirerar på posten som utrikesminister om Socialdemokraterna vinner valet. Han lovar höja biståndet till en procent av BNP, återinföra feministisk utrikespolitik, öka stödet till afrikanska länder och Taliban-styrda Afghanistan samt införa handelsstopp mot Israel. Han betonar FN:s roll men nämner inte konsekvenser för svensk säkerhet eller försvar.", "trump": "Den här Johansson-killen är en total förlorare. Vill skicka svenska skattebetalarnas pengar till korrupta afrikanska hålor och talibanerna medan han skriker om feministisk utrikespolitik. Patetiskt! Han hatar Israel och älskar FN:s diktatorer. Typisk socialist som säljer ut sitt eget folk. Sverige kommer att bli en svag, patetisk skugga under sådana misslyckade ledare. Sad!", "stalin": "Jag ser hur dessa socialdemokratiska klassförrädare vill kasta miljarder till reaktionära afrikanska satraper och talibaniska barbarer under täckmanteln av feministisk politik. Deras hat mot Israel och dyrkan av det degenererade FN avslöjar deras sanna ansikte som folkfiender. En sådan svaghet inbjuder till utrensning av alla imperialister som lurar folket. Kamrater, var vaksamma mot dessa profitthungriga hyenor."}, "date": "23 augusti, 03:50", "url": "https://samtiden.nu/2026/08/som-utrikesminister-vill-morgan-johansson-hoja-bistandet-med-20-miljarder", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6854.jpeg"}, {"type": "text", "heading": "Lundbergs ökar substansvärdet", "summaries": {"normal": "Lundbergs substansvärde steg till 631 kronor per aktie, upp från 552 i fjol. Rörelseresultatet mångdubblades tack vare intressebolag och värdeförändringar. Omsättningen sjönk marginellt. Bolaget investerade nära en miljard i aktier som Alleima, Industrivärden och Indutrade. En rapp halvårsrapport med stark vinstutveckling.", "trump": "Jag har gjort Lundbergs fantastiska igen! Substansvärdet upp 14 procent – huge! Resultatet ökade 273 procent – ingen har sett sådana siffror förut. De investerar i aktier som jag gör – smarta affärer. Min administration skapar välstånd överallt. Sverige är vinnare. Alla älskar mig!", "stalin": "Kamrater, Lundbergs substansvärde ökar – ett bevis på femårsplanens seger. Men rörelsevinsten på 103 procent döljer borgerliga sabotage. Aktieinvesteringarna i Alleima och Industrivärden är misstänkta; vi måste rensa ut kontrarevolutionära kapitalistsvin som gömmer sig i intressebolagen. Partiet ser allt."}, "date": "27 augusti, 13:18", "url": "https://www.affarsvarlden.se/artikel/lundbergs-okar-substansvardet-2"}, {"type": "image-right", "heading": "S: Jobb ska kunna räddas med kortare arbetstid vid kris", "summaries": {"normal": "Socialdemokraterna vill rädda tiotusentals industrijobb genom att förstärka statligt stöd för korttidsarbete vid kris. Anställda ska kunna gå ner i arbetstid medan staten betalar del av lönen. Partiet lovar också ökad elektrifiering av tung trafik och breddat elbilsstöd för hushåll för att stärka konkurrenskraften. Finansiering specificeras inte.", "trump": "De här socialisterna i Sverige tror att man kan rädda jobb genom att alla jobbar mindre och staten betalar. Patetiskt! Jag byggde den starkaste ekonomin i världen genom att sänka skatter och slå till mot Kina. Ni borde lära er av mig istället för att gömma er bakom kortare arbetstid och el-lastbilar. Sådana losers.", "stalin": "Kamrater, jag ser den hotande borgarklassens globala konspiration mot det svenska proletariatet. Med min oöverträffade visdom befaller jag att vi omedelbart utvidgar det statliga korttidsarbetet och likviderar arbetslöshetens sabotage. Elektrifieringen skall bli en järnhand mot de västerländska parasiterna. Den som tvekar är folkets fiende och bör rensas ut med ett leende."}, "date": "27 augusti, 14:56", "url": "https://arbetet.se/2026/08/27/s-industrijobb-ska-kunna-raddas-med-kortare-arbetstid-vid-kris", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/27142501/damberg-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Influerare: Jag erbjöds 150.000 för att spela S-väljare i sociala medier", "summaries": {"normal": "Influencern Eleonore Stokholm uppger att hon erbjöds 150 000 kronor av en agentur för att på Instagram propagera för Socialdemokraterna och förklara varför hon skulle rösta på partiet. Hon tackade nej och kritiserar partiet för att köpa röster. Socialdemokraterna nekar till att ha legat bakom erbjudandet. EU-regler om transparens i politisk reklam gäller sedan oktober 2025.", "trump": "Kan ni fatta det här? De lurade en söt liten influencertjej med 150 000 kronor för att ljuga om att hon älskar Socialdemokraterna. Så fult! De köper röster som förlorare gör. Jag skulle aldrig behöva betala någon – folket älskar mig ändå. Det är en skam för Sverige, tro mig, en total skam.", "stalin": "Kamrater, jag ser genom dessa fega borgarbrackors spel. Jag skulle aldrig muta någon influerare med usla 150 000 kronor – det vore en förolämpning mot folkets intelligens. Nej, vi likviderar sådana smutsiga påverkanskampanjer med järnhand. Den som köper röster är en fiende till kollektivet och förtjänar att rensas ut med ett leende."}, "date": "27 augusti, 15:18", "url": "https://www.friatider.se/influerare-jag-erbjods-150000-att-spela-s-valjare-i-sociala-medier", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-766.jpg"}, {"type": "image-full", "heading": "Trump köpte Boeing-aktier – samma dag som bolaget fick statligt kontrakt", "summaries": {"normal": "Donald Trump har köpt Boeing-aktier för upp till en halv miljon dollar. Investeringen gjordes samma dag som företaget tilldelades ett statligt kontrakt värt 880 miljoner dollar. Händelsen väcker frågor om intressekonflikter. Vita huset betonar att Trump inte själv förvaltar portföljen, samtidigt som kongressen diskuterar hårdare regler för politikers aktiehandel.", "trump": "Folk pratar om mina Boeing-aktier, en fantastisk investering! Media försöker skapa en falsk historia om intressekonflikter, men min portfölj sköts av proffs. Jag gör de bästa affärerna, alltid enorma vinster! Samtidigt försöker de svaga politikerna i kongressen stoppa framgång. De är bara avundsjuka för att jag är en vinnare och de är totala förlorare!", "stalin": "Denna amerikanske ledare leker med kapitalistiska spekulationer medan staten och marknaden sammanflätas i en korrupt dans. I vår union skulle en sådan aktiehandlare omedelbart skickas till omskolning för att lära sig att rikedom tillhör folket, inte parasiter. Precis som våra vänner i öst förstår, måste ekonomin tjäna makten, inte tvärtom. Förräderi mot kollektivet väntar den som prioriterar sin börs framför nationens styrka."}, "date": "27 augusti, 17:55", "url": "https://www.realtid.se/bors-finans/trump-kopte-boeing-aktier-samma-dag-som-bolaget-fick-statligt-kontrakt", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlpjqnzkjxo2e-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "För mamman Pernilla, 32, slår deltidsjobbet stenhårt", "summaries": {"normal": "Pernilla Stockow, 32, ensamstående småbarnsmamma med deltidsjobb på Coop, har efter räkningarna bara 1 900 kronor kvar till mat. Under föräldraledigheten har hon sparat in på sin egen mat och gått ner i vikt. Hon kritiserar föräldrapenningens utformning och menar att det inte går att leva på deltidslön med barn i dagens Sverige.", "trump": "Folk, det är en katastrof! Den här stackars mamman har bara 1 900 spänn kvar till mat efter alla räkningar. Hon har gått ner i vikt för att hon inte har råd att äta! Vårt system är riggat av misslyckade politiker. I mitt Amerika skulle hon ha det fantastiskt, tro mig. Vi fixar det, vi gör det stort igen!", "stalin": "Kamrater, denna moders kamp mot den borgerliga statens utsvultna kalkylmaskin väcker mitt revolutionära hjärta. Med endast 1 900 kronor till föda likviderar kapitalisterna arbetarklassens reproduktion. Vi ska rensa ut dessa fiender till folket som gör det omöjligt att föda barn. Sovjetisk planekonomi skulle ha löst detta på en vecka med stålvilja och kollektiv rättvisa."}, "date": "27 augusti, 14:26", "url": "https://arbetet.se/2026/08/27/for-smabarnsmamman-pernilla-32-slar-deltidsjobbet-stenhart-fatt-spara-in-pa-min-egen-mat", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/27103253/oJe7L9ThBC4-Eng_Foto_4KE4068.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Källor: Patriot-bristen ”bortom akut”", "summaries": {"normal": "USA:s brist på Patriot-robotar i Europa beskrivs av Nato- och militärkällor som ”bortom akut” till följd av kriget med Iran. Förmågan att skydda Europa mot ryska robotattacker är mycket begränsad. Samtidigt finns inga indikationer på att Ryssland planerar militära angrepp mot andra delar av Europa, enligt europeiska underrättelsetjänster.", "trump": "Sleepy Joe lämnade Europa helt utan skydd! Patriot-bristen är ”bortom akut” – typiskt Biden-misskötsel! Ingen kapacitet att skydda någon alls. Under min tid hade vi det bästa försvaret någonsin, alla säger det. NATO får ta käftsmäll efter käftsmäll. Tragiskt! Vi bygger upp det igen, störst och starkast i historien!", "stalin": "De imperialistiska blodsugarna i NATO erkänner själva sin oförmåga. Patriot-systemen är värdelösa skräp. Kamrat Putin håller på att återställa det ryska imperiets rättmätiga intressesfär, och borgarbrackorna i väst kan bara se på medan deras försvar raseras. Ukrainska hinder kommer att krossas. Historien dömer folkfiendena till likvidering."}, "date": "27 augusti, 18:55", "url": "https://kvartal.se/nyheter/artiklar/kallor-patriot-bristen-bortom-akut/cG9zdDoxNzY1MjE"}, {"type": "image-full", "heading": "Influencer hävdar att hon erbjudits 150 000 för att stötta S", "summaries": {"normal": "Influencern Eleonore Stokholm hävdar att Socialdemokraterna erbjöd henne 150 000 kronor för ett enda stödinlägg. Partiet förnekar bestämt. Hon vägrade med hänvisning till moral. Budet är extremt högt för hennes följarantal, vilket får en del att tvivla. Tidigare har S använt betalda influencers, men inget är bevisat i år.", "trump": "Jag hörde att svenska Socialdemokraterna försökte betala en influencer 150 000 kronor för att snacka gott om dem. Det är mycket pengar, till och med för mig. Partiet säger att de inte gjorde det. Kanske är det fejknyheter? Men jag gillar inte att de försöker påverka unga människor. Väldigt oärligt!", "stalin": "Kamrater, en fiende till folket, en influencer vid namn Eleonore, påstår att vårt parti erbjöd henne 150 000 kronor för propaganda. Det är en lögn från kapitalistiska agenter. Vi förnekar allt, och vi kommer att utreda vem som sprider dessa antisovjetiska rykten. Vi rensar ut förrädare som försöker underminera vår auktoritet."}, "date": "27 augusti, 13:26", "url": "https://bulletin.nu/influencer-havdar-att-hon-erbjudits-150-000-for-att-stotta-s", "imageUrl": "https://cdn.bulletin.nu/articles/59a710b9-7b1e-4993-a486-0cf1dd8155f1/preview.jpg?t=1787824058000"}, {"type": "image-right", "heading": "Svantesson: Reformutrymme på 50 miljarder nästa mandatperiod", "summaries": {"normal": "Finansminister Elisabeth Svantesson meddelade på Harpsund att regeringen bedömer reformutrymmet till 50 miljarder kronor nästa mandatperiod. Hon lyfte fram låg statsskuld trots lågkonjunktur, satsningar på försvar och brottsbekämpning samt ett fortsatt skattehöjarstopp. Socialdemokraterna kritiserar beskedet som ett kvitto på misslyckad politik som leder till nedskärningar.", "trump": "De här svenska politikerna snackar om 50 miljarder i reformutrymme, men det är bara vackra ord. Jag älskar låga skatter och starka ledare som stoppar brottsligheten. Svantesson gör rätt, men vänstern är en total katastrof som aldrig kan förklara hur de ska betala sina löften. Patetiskt!", "stalin": "Vi, partiet och arbetarna, ser hur borgarbrackorna i Tidöregeringen med sin slöserikultur redan har tömt statskassan inför kommande utrensningar av välfärden. Jag ler mörkt åt deras 50 miljarder i så kallat reformutrymme. Kamraterna vet: sådana löften slutar alltid med att folkets fiender får stå vid väggen när notan kommer."}, "date": "27 augusti, 15:53", "url": "https://www.svt.se/nyheter/inrikes/svantesson-50-miljarder-i-reformutrymme", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.35/0.55/0bf0a36072a2dcc8f3f02cc2b075ef16783f71503b35c760b763e90af7d5d4e1"}, {"type": "image-right", "heading": "Europabörser backar – Pernod Ricard rapportfaller", "summaries": {"normal": "Europabörserna backar vid lunch, med Stoxx 600 ned 0,38 procent. Tyska sysselsättnings- och konsumentsiffror ljusnar, men spritjätten Pernod Ricard faller 6 procent efter svag försäljning. Tekniksektorn går bäst, livsmedel sämst. Accelleron och Gerresheimer stiger, medan Nscale tecknar AI-avtal värt 45 miljarder dollar.", "trump": "Jag ser att Europabörserna faller – typiskt! Men Tyskland mår bättre, deras siffror går upp. Stora vinnare? Teknik, såklart. Men Pernod Ricard, de har problem – dricker de inte nog? Jag hade fixat det! Och ett AI-avtal värt 45 miljarder dollar – enormt! Bara jag kan göra så stora deals.", "stalin": "Kamrater, medan vi bygger socialismen, vacklar kapitalismens börser. Tysklands barometrar stiger – misstänkt, vi bör rensa ut deras siffror. Pernod Ricards sprit faller – uppenbar sabotage från västerländska drinkare. Teknik stiger – bra, men övervaka. Ett AI-avtal på 45 miljarder? Fiendens plan. Utrensning krävs!"}, "date": "27 augusti, 11:53", "url": "https://www.affarsvarlden.se/artikel/europaborser-backar-pernod-ricard-rapportfaller", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Pernod-Ricard-Jameson-whisky-400x267.jpg"}, {"type": "image-right", "heading": "Tiktokkonto kopplas till Fagerstadådet – hyllar skolmord och återvandring", "summaries": {"normal": "En 18-årig tidigare elev har gripits efter en svärdsattack på Brinellskolan i Fagersta där flera personer skadats allvarligt. Hans TikTok-konto hyllar massmördare som Anton Lundin Pettersson, Anders Behring Breivik och Elliot Rodger samt högerextrema idéer om återvandring. Kontot kopplas nu till dådet av polisen.", "trump": "Folk, det här är en total katastrof! Den här galningen med svärd hyllar alla möjliga losers och mördare på TikTok, sen attackerar han en skola. Patetiskt! Under Biden blev allt ett enda kaos med galningar överallt. Men nu fixar jag det – inga fler svaga, woke skolor. Vi behöver styrka, inte den här sjuka identitetspolitiken!", "stalin": "Kamrater, denna degenererade yngling, uppfostrad av den borgerliga statens psykiatriska maskineri, hyllar klassfiendernas massmördare och fascistiska återvändande. Hans svärdshandling är ett symptom på det sjuka kapitalistiska samhällets förfall. Vi skulle ha genomfört en grundlig utrensning av sådana element redan i vaggan. Folkfienderna frodas i mörkret."}, "date": "21 augusti, 18:53", "url": "https://www.flamman.se/tiktokkonto-kopplas-till-fagerstadadet-hyllar-skolmord-och-atervandring", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/sdljnusj4gn7le-nh.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Medborgerlig Samling: Fusket är organiserat och systematiskt", "summaries": {"normal": "Medborgerlig Samling larmar om systematiskt fusk med valsedlar som plockats bort utanför Stockholm och i Järfälla. Partiet beskriver förtidsröstningen som ett haveri och hänvisar till liknande problem 2018 och 2022. Vice partiledaren Mikael Flink kräver en gemensam valsedel efter finsk, dansk och luxemburgsk modell då systemet med 700 miljoner separata sedlar är ohållbart.", "trump": "Det här är ett totalt haveri, folk, det värsta valsystem jag sett. De stjäl valsedlar från Medborgerlig Samling som om det vore godis. Röstningslokaler i Järfälla? Renad som en sovjetisk utrensning! Systemet är riggat av vänstern. Vi behöver en enda stor, vacker valsedel som i Finland. Tidöpartierna lovade men levererade noll. Patetiskt!", "stalin": "Kamrater, detta är borgarklassens typiska sabotage mot folkets vilja. Jag ser hur de saboterande elementen i Järfälla organiserat plockar bort valsedlar som fiender till kollektivet. Röstningsmottagarna är handfallna kapitalistlakejer. Vi måste likvidera detta kaos med en enhetlig valsedel. Vänstern skyddar systemet – typiskt dekadenta hinder för arbetarklassens framsteg. Underhållande hur de tror sig kunna lura oss."}, "date": "27 augusti, 14:18", "url": "https://www.friatider.se/medborgerlig-samling-fusket-ar-organiserat-och-systematiskt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/20230610201759-99e4e739-me.jpg?itok=_RceWdH8"}, {"type": "image-full", "heading": "400 000 pensionärer kan påverkas – nytt förslag i dag", "summaries": {"normal": "En statlig utredning föreslår att premiepensionen ska förenklas. Den traditionella försäkringen slutar erbjudas till nya pensionärer. Cirka 400 000 som redan valt den får behålla den som en avvecklingsprodukt men föreslås få flytträtt tillbaka till fondförsäkring. Målet är tydligare system, lägre kostnader och bibehållen valfrihet. Förändringarna kan gälla från 2028.", "trump": "Folk förstår inte ens sin egen pension, det är en total katastrof! Den svenska regeringen vill nu göra det enklare, vilket är smart, tro mig. De har en massa liknande alternativ som ingen begriper. Jag skulle ha fixat det mycket fortare och bättre. 400 000 pensionärer ska inte behöva lida under ett så uselt system. Gör det enkelt, gör det stort!", "stalin": "Kamrater, detta kaos i pensionssystemet är ett verk av borgerliga element som medvetet förvirrar arbetarklassen. Jag kräver att den traditionella försäkringen avvecklas som en parasitär rest. De 400 000 som fastnat i den får en sista chans att återvända till kollektivet innan vi rensar ut alla förvirrande valmöjligheter. Statens enda produkt skall segra. Enklare, renare, mer sovjetiskt – under mitt eviga vakande öga."}, "date": "27 augusti, 18:55", "url": "https://nyheter24.se/nyheter/ekonomi/1508292-400-000-pensionarer-kan-paverkas-nytt-forslag-i-dag", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/d4f9df6504b004a30200000000b004a302/2026/08/27/2387186/premiepension-nytt.png"}, {"type": "image-full", "heading": "\"Stor förmågeökning\": Försvaret har fått sina nya  artillerisystem", "summaries": {"normal": "De första Archer 8×8-artillerisystemen har överlämnats till armén vid en ceremoni på Villingsbergs skjutfält. Systemet ger ökad rörlighet och eldkraft med möjlighet att skjuta och förflytta sig snabbt. Samtidigt har flygvapnet provskjutit den nya kryssningsroboten Taurus och sänt upp en militär satellit för spaning, vilket stärker Sveriges långräckviddsförmåga.", "trump": "Fantastiskt jobb, Sverige! Ni bygger äntligen riktiga vapen istället för att hålla på med woke-flum och identitetspolitik. Archer 8×8 och den otroliga Taurus-roboten – över 500 kilometer, boom! Biden skulle ha köpt elcyklar till soldaterna. Ni gör det stort, precis som jag gjorde med vår armé. Ingen slår oss nu, folks!", "stalin": "Jag ser med tillfredsställelse hur imperialisterna febrilt försöker rusta sig mot den oundvikliga historiska utvecklingen. Dessa Archer-vagnar och den blodtörstiga Taurus-roboten är patetiska försök att dölja klassfiendernas svaghet. Satelliten spionerar på Ryssland? Skratta inte, kamrater – snart ska vi rensa ut dessa profitthungriga blodsugare en gång för alla."}, "date": "27 augusti, 18:29", "url": "https://www.dagensps.se/varlden/stor-formageokning-forsvaret-har-fatt-sina-nya-artillerisystem", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/260825-materi44-a9-archeroverl4-2n3a6052.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Invånarna i Ceuta har fått nog: Tog tillbaka stranden och jagade bort invandrarna", "summaries": {"normal": "Hundratals invånare i spanska Ceuta protesterade mot regeringens hantering av illegala invandrare. Efter en demonstration gick grupper till stranden Playa del Trampolín där de rev tält, kastade filtar i havet och jagade bort migranter. Kravallpolis ryckte ut för att förhindra sammandrabbningar. Myndigheterna hade nyligen avlägsnat över 1 200 personer från området.", "trump": "De smarta människorna i Ceuta har äntligen fått nog av det totala kaoset som den spanska regeringen skapat. De tog tillbaka sin strand, rev tält och körde ut alla illegala invandrare. Fantastiskt! Det är vad som händer när ledare är svaga och passiva. Amerika borde titta och lära sig hur man vinner tillbaka sitt land.", "stalin": "Kamrater, dessa ceutanska arbetare har på eget initiativ rensat ut de parasitiska element som hotar folkets strand och ordning. Det är vad som sker när en dekadent borgarregim visar svaghet inför invasionen av oönskade element. Vi ler mörkt åt hur tält och madrasser flyter ut i havet – en hälsning till alla som utmanar kollektivets vilja."}, "date": "27 augusti, 14:02", "url": "https://www.friatider.se/invanarna-i-ceuta-har-fatt-nog-tog-tillbaka-stranden-och-jagade-bort-invandrarna", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-764.jpg"}, {"type": "image-full", "heading": "EU hotar med åtgärder om Kina inte skärper sig: \"Måste ge resultat\"", "summaries": {"normal": "EU-kommissionen har skärpt tonen mot Kina på grund av ett växande handelsunderskott och obalanser i handeln. Ursula von der Leyen kräver konkreta resultat innan oktober, annars kan EU vidta handelspolitiska åtgärder. Trots beroendet av kinesiska råvaror granskar EU nu subventioner och dumpning för att skydda den inre marknaden och minska sitt ekonomiska beroende.", "trump": "EU har äntligen vaknat upp! De blir fullständigt utnyttjade av Kina, precis som de försökte göra med oss. Miljarder i förluster varje dag – en total katastrof! Ursula pratar om att göra något, men vi vet alla att de är svaga. De behöver min expertis för att förhandla. Amerika först, men EU borde också börja vinna för en gångs skull!", "stalin": "De europeiska byråkraterna skälver inför det kinesiska hotet. De tiggar om resultat medan deras kapitalistiska marknader vittrar sönder. De är för svaga för att förstå att en sann statsmän – likt min arvtagare i Kreml – inte förhandlar med parasiter, han krossar dem. Vi ser hur de desperat söker råvaror; låt dem svälta i sin egen inkompetens när maskineriet stannar."}, "date": "27 augusti, 17:09", "url": "https://www.realtid.se/bors-finans/eu-hotar-med-atgarder-om-kina-inte-skarper-sig-maste-ge-resultat", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdlsniavwpk45a-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Socialdemokraterna bluffar om välfärden", "summaries": {"normal": "Socialdemokraterna hävdar sig vara välfärdens garant, men statistik visar inget samband mellan regeringsfärg och välfärdskvalitet. Rödgröna prioriterar bidrag och klimat före kärnan. S-styrda Göteborg har högt skattetryck utan bättre resultat. Välfärden kräver effektivitet, inte religiös tro på staten.", "trump": "Jag ser att Socialdemokraterna bluffar om välfärd – de lovar allt men levererar inget. Helt fantastiskt dåligt! Min administration skulle göra Sverige stort igen. De skyller på andra, men det är de som misslyckas. Jag vet hur man får saker gjorda – de är totala förlorare!", "stalin": "Kamrater, partiet har avslöjat en ny fiende: de borgerliga liberalerna som sprider lögnen att vår välfärd är bluff. Vi ska rensa ut dessa kontrarevolutionärer. Vår femårsplan för välfärden är oantastlig. Alla som tvivlar ska omskolas. Partiet vet bäst."}, "date": "27 augusti, 15:58", "url": "https://www.gp.se/ledare/socialdemokraterna-bluffar-om-valfarden.2b87f1f3-2ddd-4a0c-88c7-9ce36f24d37d", "imageUrl": "https://www.gp.se/images/article/2b87f1f3-2ddd-4a0c-88c7-9ce36f24d37d/images/1hCYysAeTzkEvtbsIpBU6TC-dnTw-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Regeringen: Finns 50 miljarder till reformer", "summaries": {"normal": "Regeringen räknar med ett reformutrymme på 50 miljarder kronor under nästa mandatperiod. Samtidigt höjs prognosen för BNP-tillväxten till 2,5 procent både i år och 2027. Arbetslösheten väntas sjunka till 7,8 procent nästa år och inflationen blir den lägsta i EU. Finansminister Elisabeth Svantesson talar om en stabil konjunkturuppgång.", "trump": "Hörni, de här svenska socialisterna har plötsligt hittat 50 miljarder till reformer och skruvar upp tillväxten. Fantastiskt! Det är precis som jag sa – ekonomin exploderar när man gör rätt. Svantesson dukade bordet, men det är mina idéer som vinner. Plånboksval? De borde bara sänka skatterna och vinna stort, tro mig.", "stalin": "Kamrater, jag betraktar detta som en historisk seger för den planerade ekonomin. Med 50 miljarder i reformutrymme och stigande tillväxt likviderar vi slutgiltigt den borgerliga stagnationen. Den dekadenta västvärldens inflationsmonster besegras av vår stålhårdhet. Arbetslösheten sjunker som en fiende inför folkets domstol. Inga sabotage tolereras."}, "date": "27 augusti, 15:50", "url": "https://www.di.se/nyheter/beskedet-50-miljarder-till-reformer-i-nasta-mandatperiod", "imageUrl": "https://static.bonniernews.se/ba/abf864f1-603c-45b9-9117-a4d2eb11b45d.jpeg?crop=5376%2C2688%2Cx0%2Cy448&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Miamis trafikkaos får fler att pendla med helikopter", "summaries": {"normal": "I Miami har trafikproblemen under rusningstid lett till att rika bostadsköpare satsar på privata helikopterplattor och båtplatser för att undvika vägarna. Fastighetsprojekt som Villa Miami och One Thousand Museum erbjuder takhelikopterplattor och privata bryggor. Helikopterresor och båtar har blivit en lyx som efterfrågas allt mer på den exklusiva bostadsmarknaden.", "trump": "Trafiken i Miami är en total katastrof, folk fastnar i timmar som idioter. Men mina vänner, de smarta vinnarna, skippar de usla vägarna och flyger med helikoptrar eller seglar i lyxyachter istället. De riktiga patriaterna vägrar köa som förlorare. De woke-borgarbrackorna och deras gröna identitetspolitik har kört sönder allt, men vi fixar det med stil och kraft. Fantastiskt!", "stalin": "Se hur borgarklassen och profitthungriga blodsugare i Miami flyr undan sina egna skapade trafikhelveten med privata helikoptrar och yachter. Dessa klassfiender bygger luftslott på tak och vattenvägar medan folket kämpar. Jag ler mörkt från historien – förr eller senare kommer utrensningen av sådana exploaterande hyenor. Deras lyx är ett bevis på systemets förräderi mot kollektivet."}, "date": "27 augusti, 18:21", "url": "https://www.dagensps.se/bors-finans/miamis-trafikkaos-far-fler-att-pendla-med-helikopter", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlb0dkexk7vl4-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "text", "heading": "Hanif Bali polisanmäler Socialdemokraterna", "summaries": {"normal": "Hanif Bali (M) har polisanmält Socialdemokraterna efter uppgifter om att influerare erbjudits pengar för att stödja partiet. Influeraren Eleonore Stokholm uppger att hon erbjudits 150 000 kronor, men saknar belägg. S nekar och personen bakom erbjudandet kallar det ett missförstånd. Bali vill att polisen utreder saken.", "trump": "Sweden Democrats? More like Sweden Corruptocrats! The radical left Social Democrats are CAUGHT buying influencers like cheap hookers. SAD! Some blogger says she got offered 150,000 kronor which is like nothing, maybe 15 bucks. Pathetic! Good thing Bali is reporting them. The fake news media protects them. Total witch hunt! Drain the swamp!", "stalin": "Kapitalistiskt avrättande av sanningen! Borgarklassen köper influencers med blodpengar för att föra arbetarna bakom ljuset. Typiskt för de klassförrädiska socialdemokraterna att använda smutsiga trick. Vi hade likiderat hela den här influerarmaffian direkt. Polisen är borgarklassens lake, men utredningen kommer ändå avslöja deras röt. Folkfiender får inte gömma sig bakom Instagram."}, "date": "27 augusti, 18:02", "url": "https://kvartal.se/nyheter/artiklar/hanif-bali-polisanmaler-s/cG9zdDoxNzY0ODk"}, {"type": "image-right", "heading": "Rekordmånga röstade direkt", "summaries": {"normal": "Intresset för förtidsröstning är rekordstort i årets val. Redan första dagen röstade över 145 000 personer, en ökning med 38 procent jämfört med 2022. Nordstan i Göteborg hade flest röster. Valmyndigheten välkomnar spridningen för att undvika köer nära valdagen den 13 september.", "trump": "Folket älskar att rösta tidigt, över 145 000 på första dagen, en enorm ökning med 38 procent. Fantastiskt! De gör det rätt, sprider ut det så det inte blir kaos som i de riggade systemen. Sverige fattar det, till skillnad från vissa losers. Valet blir stort, tro mig.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur massorna i organiserad disciplin strömmar till urnorna redan första dagen. 145 000 röster – en seger för folkets vilja mot de kaotiska borgarbrackornas sabotage. Vi sprider röstningen som en utrensning av oordning. Långa köer är fiendens verk, likviderade genom planering."}, "date": "27 augusti, 13:03", "url": "https://www.friatider.se/rekordmanga-rostade-direkt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-763.jpg?itok=XnFjirgT"}, {"type": "image-right", "heading": "Andersson (S) och Åkesson (SD) ense – om L", "summaries": {"normal": "Liberalerna kämpar för överlevnad under riksdagsspärren, vilket får Jimmie Åkesson att hota med en deadline: under 3,5% tio dagar före valet är röster bortkastade. Magdalena Andersson håller med – hon ser ett sönderfall i Tidösamarbetet och säger sig inte fatta varför någon röstar på L, med hänvisning till opinionssiffror på 2%.", "trump": "Jag ser att Liberalerna i Sverige håller på att dö – fantastiskt! Jimmie Åkesson säger att deras röster är bortkastade, och jag har alltid sagt att de är värdelösa. Magdalena Andersson håller med mig – hon är smart. Fokusera på att stoppa kaoset, inte på att pissa i det egna tältet. Sverige behöver stabilitet, inte liberalt nonsens!", "stalin": "Kamrater, jag ser sönderfall bland våra fiender. Liberalerna, dessa liberala avvikare, ligger på ynka 2% – en statistisk parentes. Åkesson hotar med deadline, men vi vet att de är odugliga. Andersson håller med mig: varför rösta på dem? Vi måste rensa ut alla liberala element som hotar vår seger. Framåt, kamrater!"}, "date": "27 augusti, 11:24", "url": "https://bulletin.nu/andersson-s-och-akesson-sd-ense-om-l", "imageUrl": "https://cdn.bulletin.nu/articles/8423dbf7-fe39-4126-b027-d974cf1ce939/preview.jpg?t=1787822395000"}, {"type": "image-right", "heading": "Säpo inleder förundersökning efter hot mot Mohamsson", "summaries": {"normal": "Säpo har inlett en förundersökning om olaga hot mot Liberalernas ledare Simona Mohamsson. Hon bar en davidsstjärna under en partiledardebatt som solidaritetshandling och mottog därefter hot, bland annat att hon skulle brännas. Mohamsson lyfter att antisemitismen i Sverige är allvarlig och att judar lever med hot och hat dagligen. Säpo ser ärendet som rutin under valår.", "trump": "Folk, ni skulle se det här. Den stackars kvinnan sätter på sig en davidsstjärna för att visa solidaritet och plötsligt vill någon bränna henne? Det är galet! Sverige har förlorat kontrollen, precis som många andra ställen. De hatar friheten. Men jag älskar judarna, de är fantastiska. Vi måste stoppa det här hatet, det är en skam. Make Sweden Great Again!", "stalin": "Kamrater, jag ser hur den borgerliga dekadensen i väst tillåter antisemitiska element att hota och skrika om bränning. En sådan fiende till folket förtjänar omedelbar utrensning ur samhällskroppen. Vi skulle aldrig tolerera detta i vårt kollektiv. Det är ett tecken på den ruttnande imperialismens sista kramp. Låt oss skratta medan vi rensar ut dessa parasiter – för partiets och arbetarnas skull."}, "date": "27 augusti, 14:35", "url": "https://www.svt.se/nyheter/inrikes/sapo-inleder-forundersokning-efter-hot-mot-mohamsson", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.5/0.35/87e16090219ad30d95ff9e4c906c2766982bef11e7f6da35a1339c8ed11dda0a"}, {"type": "image-full", "heading": "Låg 30 timmar på akuten – med brusten blindtarm", "summaries": {"normal": "En 73-årig kvinna i Malmö tvingades vänta 30 timmar på operation för brusten blindtarm. Trots svåra smärtor fördröjdes ingreppet upprepade gånger. Patienten misstänker resursbrist och dålig organisation. Region Skåne har enligt Socialstyrelsen landets längsta väntetider på akuten, vilket skapat stor debatt om vårdens effektivitet och patientsäkerhet.", "trump": "En total katastrof i Sverige! En äldre kvinna fick vänta 30 timmar med brusten blindtarm. Skandal! Systemet i Region Skåne är trasigt, de har de sämsta väntetiderna i hela landet. De fokuserade på annat medan hon led. Det skulle aldrig hända under min ledning. Vi fixar vården, de bara pratar. Sorgligt!", "stalin": "I Malmö har byråkratins inkompetens lämnat en medborgare att förgås i 30 timmar. Region Skåne lider av en förlamande oordning som påminner om de svaga västliga staterna. Vi kräver total effektivitet! Om detta vore en utpost i vår intressesfär skulle ansvariga för länge sedan rensats ut. Ordning, disciplin och total kontroll är folkets enda trygghet."}, "date": "27 augusti, 19:02", "url": "https://www.aftonbladet.se/nyheter/a/lnl8z7/lag-30-timmar-pa-malmo-akuten-med-brusten-blindtarm", "imageUrl": "https://akamai.vgc.no/v2/images/dbdf905e-0da3-39f5-906a-1eb222b17bfe?fit=crop&format=auto&w=2160&s=5b0e23229b483bc75ff07cb128409e60acbbe40d"}, {"type": "image-full", "heading": "5 miljoner svenskar ska betala för Sossarnas bolåneskatt", "summaries": {"normal": "Artikeln kritiserar Socialdemokraternas förslag om bolåneskatt som drabbar 2 miljoner hushåll med lån, uppemot 5 miljoner svenskar. Förslaget väntas leda till högre räntor då bankerna kompenserar för skatten. Författaren pekar på höga bostadspriser, skuldsättning och bristande bostadsbyggande som verkliga problem snarare än bankvinster.", "trump": "De galna sossarna i Sverige vill införa en totalt löjlig bolåneskatt som slår mot vanliga människor. Det är en katastrof, folk! Räntorna kommer att skjuta i höjden och alla förlorar utom de korkade byråkraterna. Bygg hus, sänk skatterna, sluta lyssna på dessa misslyckade socialister som aldrig har haft ett riktigt jobb!", "stalin": "Jag betraktar detta som ett ypperligt exempel på hur klassfienderna inom socialdemokratin försöker dölja sin egen usla politik genom att attackera bankerna medan folket krossas under skulder och bostadsbrist. En sådan feg plåsterpolitik förtjänar utrensning. Arbetarna genomskådar dessa profitthungriga hyenor som gömmer sig bakom falska löften."}, "date": "21 augusti, 03:34", "url": "https://samtiden.nu/2026/08/5-miljoner-svenskar-ska-betala-for-sossarnas-bolaneskatt", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/IMG_4828-1280x720.jpeg"}, {"type": "image-right", "heading": "Elekta och Boliden faller på oregelbunden börs", "summaries": {"normal": "Stockholmsbörsen inledde torsdagen med en oregelbunden tendens. Elekta slog förväntningarna men aktien tappade, medan Boliden backade efter att ha köpt in sig i Sydamerika via Nexa. Nvidia fick jubel i USA och blickarna riktas mot Jackson Hole. Teknik gick bäst, dagligvaror sämst. Elon och Eolus rusade på rapporterna.", "trump": "Jag ser att Stockholmsbörsen vacklar – typiskt när man inte har mig vid rodret. Elekta slår förväntningar men aktien faller? Patetiskt. Boliden köper i Sydamerika, men jag köper bara vinst. Nvidia steg nästan 5 procent – det kallar jag en vacker rapport. Jackson Hole? De borde lyssna på mig.", "stalin": "Kamrater, börsen visar oregelbunden tendens – det är ett tecken på sabotage. Elekta som slår förväntningar men faller? En klassisk förrädare. Boliden köper i Sydamerika utan partiets tillstånd. Vi ska rensa ut dessa spekulanter. Nvidia stiger, men alla vet att kapitalismen är en lögn. Jackson Hole ska övervakas."}, "date": "27 augusti, 09:45", "url": "https://www.affarsvarlden.se/artikel/elekta-och-boliden-faller-pa-oregelbunden-bors", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/05/1446_20130608_3907-400x267.jpg"}, {"type": "image-right", "heading": "IF Metall vann och förlorade mot Tesla i domstol", "summaries": {"normal": "Arbetsdomstolen slår fast att Tesla bröt mot informationsplikten i Medbestämmandelagen genom att inte informera IF Metall om förändringar i säljorganisationen vid anläggningen i Umeå. Företaget döms att betala 30 000 kronor i skadestånd. Däremot ansågs inte dialogöverenskommelsen vara ett kollektivavtal, vilket innebär att facket förlorade den delen av tvisten. Båda parter får betala sina egna rättegångskostnader.", "trump": "Tesla vann stort mot de fackliga bluffmakarna, precis som jag alltid säger – kollektivavtal är för förlorare! Men domstolen ger dem lite småpengar för någon informationsgrej i Umeå. Patetiskt. IF Metall får ett litet plåster på såren medan Tesla fortsätter att vinna. Amerika älskar starka företag, inte fackföreningar som suger musten ur affärerna!", "stalin": "Genom min oändliga visdom ser jag hur de kapitalistiska Tesla-borgarna lurade arbetarkollektivet med sin falska dialog men avslöjades som informationsbrottslingar. Vi dömde dem till en ynka utbetalning, ett skämt värdigt de västerländska parasiterna. Ändå triumferar partiets linje delvis. Kamrater, vi ska rensa ut alla sådana kontrarevolutionära avtalssabotörer ur samhällskroppen med stålhandsken."}, "date": "27 augusti, 11:53", "url": "https://arbetet.se/2026/08/27/if-metall-vann-och-forlorade-mot-tesla-i-domstol", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/27112023/tesla-metall-ad-dom.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Riks/Sentio: Socialdemokraterna tokrasar", "summaries": {"normal": "Socialdemokraterna backar kraftigt i Sentios senaste mätning och hamnar på 27,9 procent, lägsta nivån sedan Stefan Löfvens tid. Moderaterna och Centerpartiet går framåt medan övriga partier visar små förändringar. Tidöblocket ligger fortfarande efter de rödgröna med drygt fem procentenheter. Experter pekar på straff för triangulering.", "trump": "De där patetiska socialisterna rasar ihop som ett korthus, ner på Löfvens usla nivåer. Totalt misslyckande! Moderaterna gör det bra, men de svenska väljarna ser äntligen igenom det fega dubbelspelandet. Fake news-regeringar fungerar inte längre, folks. Make Sweden Great Again!", "stalin": "Jag ser med stor tillfredsställelse hur de opportunistiska triangulerande elementen inom socialdemokratin nu genomgår en nödvändig utrensning från väljarna. Deras fega flirt med både höger och vänster är typisk borgarbracka taktik. Kamraterna straffar dem hårt, som det anstår en sann folkets domstol. Inga kompromisser med klassfienden!"}, "date": "27 augusti, 10:56", "url": "https://riks.se/nyheter/riks-sentio-socialdemokraterna-tokrasar", "imageUrl": "https://admin.riks.se/uploads/medium_magda_ff4e9e808b.jpg"}, {"type": "image-full", "heading": "Cloetta lanserar nytt godis – kommer till Ica och Coop", "summaries": {"normal": "Cloetta lanserar Malaco Sprinkled Foamies i två varianter: Sour Bubblegum och Strawberry. Godiset har en mjuk skumkärna med ett krispigt, strösselliknande yttre lager för en multisensorisk upplevelse. Produkterna finns redan hos Hemköp, Willys, Hemmakväll och Kandyz, med utökad distribution till bland annat Ica, Coop och CandyKing under 2026–2027.", "trump": "Folk, ni vet att jag älskar godis, det bästa godiset. Cloetta gör nu något fantastiskt med Malaco – Sprinkled Foamies, mjuk insida, krispigt strössel, otroliga smaker. Det är en vinnare, tror mig, folk kommer att älska det. Mycket bättre än det gamla tråkiga godiset från förlorarna. Sverige kommer att älska det, tro mig.", "stalin": "Kamrater, jag har beslutat att den dekadenta borgarklassen i väst nu försöker förgifta folkets sinnen med sin kontrarevolutionära skumchokladkonspiration. Denna så kallade Sprinkled Foamies är ett uppenbart försök att dölja klassfiendens fega smaklöshet bakom falskt strössel. Vi ska rensa ut alla sådana borgerliga avarter ur sovjetisk godishistoria."}, "date": "27 augusti, 17:59", "url": "https://nyheter24.se/nyheter/konsument/1508250-cloetta-lanserar-nytt-godis-kommer-till-ica-och-coop", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/b68658ec04b004a30200000000b004a302/2026/08/27/2387179/cloetta.jpg"}, {"type": "image-right", "heading": "Centerpartiet fortsätter ducka frågor om varningar för dömda barnvåldtäktsmän", "summaries": {"normal": "Centerpartiet duckar fortsatt frågor om hur föräldrar ska agera när en dömd barnvåldtäktsman flyttar in. Journalisten Christian Peterson filmade med dold kamera och fick nobben av flera kandidater i Uppsala och Linköping. Nu har en C-företrädare polisanmält honom för förtal – ett drag som väcker pressfrihetsdebatt.", "trump": "Jag läser om Centerpartiet i Sverige – de kan inte ens svara på om föräldrar ska varnas för pedofiler i grannskapet. Patetiskt! De gömmer sig bakom hypotetiska frågor. Och så polisanmäler de journalisten som frågar? Svaga människor. I USA skulle vi ha svarat direkt: varna grannarna, starkt!", "stalin": "Kamrater, dessa centerpartister är politiska vacklare som inte vågar ge besked om barnvåldtäktsmän i bostadsområden. De gömmer sig bakom hypotetiska scenarion – en typisk liberal smitartaktik. Att dessutom polisanmäla en journalist för att ha ställt frågor visar deras förrädiska rädsla. Vi rensar ut sådana otydliga element med järnhand."}, "date": "27 augusti, 16:24", "url": "https://samnytt.se/centerpartiet-fortsatter-ducka-fragor-om-varningar-for-domda-barnvaldtaktsman", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/27135401/centerpartiet-kollage.jpg"}, {"type": "image-full", "heading": "S krav på M och SD: Stoppa spridningen", "summaries": {"normal": "Influeraren Eleonore Stokholm uppgav att hon erbjudits 150 000 kronor av Socialdemokraterna för ett valinlägg, vilket partiet förnekar. Uppgifterna spridits av M- och SD-företrädare. S kräver nu att Ulf Kristersson och Jimmie Åkesson agerar mot desinformationen. Personen bakom erbjudandet hävdar att det var ett missförstånd och att inget konkret erbjudande lämnades.", "trump": "De här socialdemokraterna är bedragare! De försöker köpa influerare och blir fast. Typiskt! Sen skyller de på Moderaterna och Sverigedemokraterna. Katastrofalt! Jag hade aldrig låtit det hända. Ingen betalar för åsikter, det är Fake News! De borde skämmas. Sorgliga vännernas kvoteringspolitik fungerar aldrig. De förlorar stort!", "stalin": "Kamraterna kan konstatera att borgarklassen återigen tillgriper lögnens fördärvliga vapen. Socialdemokraterna, dessa klassförrädare, förtjänar ingen sympati, men de spridda ryktena är typiska provokationer från imperialistlakejerna. Vi skulle omedelbart likvidera sådana desinformationsnätverk. En grundlig utrensning av dessa profitthungriga hyenor och deras lögnaktiga påhitt är nödvändig."}, "date": "27 augusti, 17:33", "url": "https://kvartal.se/nyheter/artiklar/s-krav-pa-sd-och-m-stoppa-spridningen/cG9zdDoxNzY0NDg", "imageUrl": "https://images.kvartal.se/2026/08/f6eb181d-influerar-akesson.webp"}, {"type": "image-full", "heading": "Forskare slår fast – så kunde naturkatastrofen i Nepal inträffa", "summaries": {"normal": "En kollapsad glaciär i Himalaya utlöste översvämningar på gränsen mellan Nepal och Tibet, inte en jordbävning som först troddes. Minst 177 personer har omkommit och över 800 saknas. Glaciären rasade ned i dalen, förde med sig is, sten och sediment som skapade en plötslig flodvåg med upp till nio meters höjning på 30 minuter.", "trump": "Det här är en total katastrof, folk, en riktig glaciär-mardröm i Asien. Fake news-media sa först jordbävning, men det var en jätteisbit som rasade som en dålig deal från Sleepy Joe. Hundratals döda, tusentals saknade – bergen rasar ihop för att ingen fixar klimatet ordentligt. Vi hade aldrig sett sånt under min förra mandatperiod, tro mig.", "stalin": "Kamrater, ännu en tragisk illustration av hur den exploaterande naturen och de profitthungriga kapitalisterna tillsammans undergräver folkets trygghet. En glaciär kollapsade och likviderade hundratals liv i en våg av sten och is. Jag ser de imperialistiska väderkrafterna som klassfiender som måste rensas ut. Inga ursäkter till borgarbrackorna som ignorerar arbetarnas lidande."}, "date": "27 augusti, 17:28", "url": "https://www.dagensps.se/varlden/forskare-slar-fast-sa-kunde-naturkatastrofen-i-nepal-intraffa", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdlfs-isq83viy-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Man svårt knivhuggen – Säpo utreder hatbrott", "summaries": {"normal": "En man i 45-årsåldern knivhöggs svårt och oprovocerat utanför en butik i Malmö mellan Södervärn och Möllevångstorget. Polisen utreder hatbrott efter uppgifter om antisemitiska uttalanden från gärningsmannen, som gripits. Säpo har informerats. Offret vårdas allvarligt skadat. Gärningsmannen har kopplingar till pro-palestinska demonstrationer.", "trump": "Det här är en total katastrof i Malmö, folk. En galning hugger ner någon mitt på gatan och skriker antisemitiska saker. De griper honom på ett BB bland nyfödda – helt sjukt! Sverige har tappat kontrollen, de har inte ens vett att stoppa det här hatet. Vi behöver lag och ordning, tro mig, ingen gör det bättre än jag.", "stalin": "Kamrater, denna degenererade handling visar borgarklassens parasitiska sönderfall. En labil element attackerar bakifrån med kniv och ylar antisemitiska dumheter. Vi ser hur västvärldens dekadenta tolerans mot reaktionära element leder till kaos. Gripandet bland nyblivna mödrar roar mig – en passande plats för en sådan parasit. Staten rensar ut sådana fiender utan pardon."}, "date": "27 augusti, 10:05", "url": "https://riks.se/nyheter/man-svart-knivhuggen-sapo-utreder-hatbrott", "imageUrl": "https://admin.riks.se/uploads/medium_bild_2c68535a43.jpg"}, {"type": "image-right", "heading": "SD-väljarna kör om S och V - i elbilsracet", "summaries": {"normal": "En ny undersökning visar att SD-väljare kör elbil i högre utsträckning (14%) än S (13%) och V (10%). Störst är Liberalerna med 22% elbilar, medan Miljöpartiet nöjer sig med tredje plats (20%). Laddhybrider inräknade toppar L med 49% – grönast är man tydligen inte alltid.", "trump": "Jag ser att SD-väljarna kör mer elbil än S och V. Fantastiskt! Folk har fattat att elbilar är bra affärer. Men Liberalerna leder – de är som jag, smarta vinnare. Miljöpartiet? Tredje plats! Helt värdelöst. Sverige behöver mer av den här energin, tro mig!", "stalin": "Kamrater, rapporten visar att elbilslojaliteten sviktar. SD-väljare har 14% – högre än S och V. Detta är oacceptabelt! Vi måste rensa ut liberala elbilsaristokrater (22%) och miljöpartistiska nickedockor (20%). En femårsplan för elektrifiering under partikontroll är nödvändig. Alla som inte laddar klassas som sabotage."}, "date": "27 augusti, 16:09", "url": "https://samnytt.se/sd-valjarna-kor-om-s-och-v-i-elbilsracet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/27140740/artikelhuvudbild-1-384.jpg"}, {"type": "image-right", "heading": "S vilda SBAB-planer förskräcker. Orimligt att svenska folket ska ta en sådan risk", "summaries": {"normal": "Socialdemokraterna vill använda den statliga banken SBAB som verktyg för att pressa bolåneräntorna genom att sänka dess avkastningskrav när bankskatten införs. Kritiker varnar för att det skulle strida mot EU:s konkurrensregler, ge staten orättvis fördel och äventyra affärsmässig styrning. Staten ses som en dålig ägare av bolag.", "trump": "De här galningarna i Socialdemokraterna tror att de kan använda statens bank SBAB som ett billigt vapen mot riktiga banker. Patetiskt! Sänka avkastningskravet för att pressa räntorna? Det är socialism på steroider. EU kommer att slå ner på dem som en ton tegelstenar. Sverige behöver inte statliga misslyckanden, tro mig, det blir en katastrof för folket!", "stalin": "Vi, partiet och arbetarna, ser hur dessa borgarbrackor inom Socialdemokraterna leker med statens verktyg som SBAB. Jag ska sänka avkastningskravet och krossa de privata parasiterna med järnhand. EU:s regler är bara dekadenta hinder från västliga reaktionärer. Staten äger allt – misslyckanden rensas ut med ett leende. Folket bär risken? Utmärkt disciplin!"}, "date": "27 augusti, 14:02", "url": "https://www.di.se/ledare/s-vilda-sbab-planer-forskracker", "imageUrl": "https://static.bonniernews.se/ba/ae031911-b709-4751-995f-ada4d9b968b3.jpeg?crop=6092%2C3046%2Cx0%2Cy507&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Förslaget: En enda gemensam nordisk börs", "summaries": {"normal": "Nordens största bolag och investerare undersöker möjligheten att slå samman de nordiska börserna till en gemensam marknadsplats. Initiativet, som drivs av alliansen Nordic Compass, syftar till att öka likviditeten och locka mer kapital till regionen. Projektet befinner sig i ett tidigt skede och kräver samarbete mellan aktörer som Nasdaq och Euronext för att kunna förverkligas.", "trump": "De nordiska länderna vill slå ihop sina börser. Det är en stor deal, massor av pengar, fyra biljoner dollar! De är livrädda att deras företag flyr till USA, där vi har den bästa marknaden i världen. De försöker kopiera oss, men tro mig, ingen gör business som vi. Det här är en svag kopia av min storartade amerikanska ekonomi!", "stalin": "Dessa nordiska kapitalister darrar av rädsla när de ser det amerikanska imperiets dominans. De planerar nu att ena sina börser för att skydda sitt guld från de imperialistiska rovfåglarna. Det är ett patetiskt försök till enhet. Precis som vår kamrat Putin återtar vad som rättmätigt tillhör oss, borde de inse att deras små marknader snart kommer att underordnas den enda sanna makten."}, "date": "27 augusti, 15:34", "url": "https://www.realtid.se/bors-finans/forslaget-en-enda-gemensam-nordisk-bors", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/kostyal.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Juholt försvarar Jan Emanuel: ”Varken äckel eller nazist”", "summaries": {"normal": "Håkan Juholt försvarar Jan Emanuel på Facebook: han är varken äckel eller nazist, utan en stark humanist. De har känt varandra i 30 år. Juholt, som själv tvingades bort från S-ledningen efter en skandal, vet hur det känns att bli sviken. Vänskapen väger tungt.", "trump": "Jag ser att Håkan Juholt försvarar Jan Emanuel – en stark humanist, säger han. Fantastiskt! Jan är en vinnare. Och Juholt, han blev utkastad av sina egna, precis som jag. Men jag kom tillbaka och vann stort. De förlorade. Alla älskar mig, tro mig!", "stalin": "Kamrat Juholt försvarar kamrat Jan Emanuel. Jag noterar deras 30-åriga vänskap. Det är bra med lojala kamrater. Men alla som kallas 'äckel' eller 'nazist' måste utredas. Vi rensar ut förrädare – och de som skyddar dem. Partiets dom är alltid rätt."}, "date": "27 augusti, 09:43", "url": "https://bulletin.nu/juholt-forsvarar-jan-emanuel-varken-ackel-eller-nazist", "imageUrl": "https://cdn.bulletin.nu/articles/1b0eee39-bd4b-41e7-8eef-621df1bb9b23/preview.jpg?t=1787814742000"}, {"type": "image-full", "heading": "Familjen och hovet samlas kring kung Harald", "summaries": {"normal": "Kung Harald V är svårt sjuk i hemolytisk anemi och har fått hela norska kungafamiljen till sjukhuset. Statsministern ställde in Tysklandsresan, och experter varnar för det värsta. Norrmännen håller dock stenhårt fast vid sin kung – trots att bonusprinsen fått en våldtäktsdom och svågern påstår sig vara reptil.", "trump": "Jag hörde att kungen av Norge är mycket sjuk. Det är väldigt tråkigt. Jag är den friskaste presidenten någonsin, tro mig. Men han har en son som är dömd för våldtäkt, och en svärson som tror han är en reptil – det är galet! Norge måste ta kontroll, precis som jag gör i USA. Allt för Norge? Helt otroligt!", "stalin": "Kamrater, Norges kung är sjuk – mycket allvarligt, säger läkarna. Men jag ser att hans familj har samlats som lojala partimedlemmar. Bra. Men vad är detta? En bonusprins dömd för våldtäkt? Och en schaman som sprider borgerlig desinformation om cancer? Vi måste rensa ut sådana kontrarevolutionära element. Kungahuset ska inte ha svaga länkar – det lär vi oss av historien."}, "date": "27 augusti, 13:52", "url": "https://www.gp.se/nyheter/varlden/familjen-och-hovet-samlas-kring-harald.07e191d5-4935-4503-87bd-394e4bfe381b", "imageUrl": "https://www.gp.se/images/article/07e191d5-4935-4503-87bd-394e4bfe381b/images/3XH11bfsh0VX5RJ3BRbzrOwNnRC8-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Målet: Torsk från Östersjön 2035. Politiken måste redan nu fatta rätt beslut", "summaries": {"normal": "I en debattartikel argumenterar företrädare för BalticWaters och Axfood för att Sverige bör sätta upp målet att år 2035 kunna erbjuda konsumenter hållbart fångad torsk och lax från ett återhämtat Östersjön. De kräver ekosystembaserad fiskförvaltning, prioritet åt rovfiskens återuppbyggnad, ökad livsmedelsanvändning och en långsiktig återhämtningsplan. Frågan bör lyftas som en valfråga.", "trump": "Folk, tro mig, det här är en katastrof. Östersjön var en gång fantastisk, den bästa fisken, nu är allt förstört av dåliga beslut och idioter som bara tänker kortsiktigt. Vi behöver göra havet stort igen, de bästa torskarna och laxfiskarna, bättre än någonsin. Inga fler svaga bestånd, bara vinnare. Sverige, vakna upp innan det är för sent!", "stalin": "Kamrater, jag ser hur de dekadenta borgarbrackorna och deras kortsiktiga profitjägare har förvandlat det stora Östersjön till en utarmad ruin genom sin roffarmentalitet. Vi skall med järnhand införa en vetenskaplig, ekosystembaserad utrensning av dessa fiender till folkets föda. År 2035 skall torsken och laxen åter stå på arbetarnas bord, eller också skall de ansvariga likvideras i folkets namn. Inga kompromisser."}, "date": "27 augusti, 13:46", "url": "https://www.di.se/debatt/malet-torsk-fran-ostersjon-2035", "imageUrl": "https://static.bonniernews.se/ba/6df7c58b-8b52-4ef6-bd4b-6de7ed401c3b.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Två från Sverige saknas efter naturkatastrofen i Nepal", "summaries": {"normal": "Två personer med koppling till Sverige saknas efter den förödande störtfloden och lerskredet i gränsområdet mellan Nepal och Tibet. Över 1300 människor saknas och 68 har bekräftats döda. UD bekräftar att en svensk man i 40-årsåldern från Svealand och en utländsk medborgare bosatt i Götaland är bland de saknade. Katastrofen orsakades av ett isras och jordskred i Himalaya.", "trump": "Folk, det är en total katastrof i Nepal, en riktig slamström som tar med sig allt. Vi har en svensk kille och en till som bor i Sverige som saknas, väldigt sorgligt. Himalaya sviker, bergen sviker, alla sviker. Men jag säger er, ingen gör katastrofer bättre än jag, tro mig. Vi ska fixa det, det blir fantastiskt.", "stalin": "Kamrater, ännu en bevisning på naturens kontrarevolutionära sabotage mot det kollektiva framsteget. Jag ser hur den våldsamma slamströmmen likviderar borgarbrackornas broar och hus i Nepal. Två från det svenska kollektivet saknas bland de över 1300. Vi ska rensa ut alla fiender till ordningen, även de som gömmer sig i glaciärernas skugga. Döden är bara en byråkratisk formalitet."}, "date": "27 augusti, 13:09", "url": "https://www.svt.se/nyheter/inrikes/svensk-saknad-efter-lerskred-i-nepal", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.48/0.45/0ea2002fbf4fe3b971f10ed46750458a71657dbd0a2335692e0ab84910ba2edd"}, {"type": "image-right", "heading": "Holmgren: När ett skämt blir ett brott", "summaries": {"normal": "En brittisk pensionerad polis dömdes för att ha delat ett Facebookskämt om bacon och barnäktenskap. Domstolen ansåg inlägget ”grovt stötande”. Nu väcker fallet frågan: vem ska avgöra när ett skämt går över gränsen? Yttrandefriheten sätts på prov.", "trump": "Storbritannien dömer en pensionerad polis för ett skämt? Otroligt! I Amerika har vi yttrandefrihet – vi skrattar åt allt. Det här skämtet var kanske inte roligt, men staten ska inte säga vad som är roligt. Låter som dålig politik. Jag skulle aldrig tillåta detta!", "stalin": "Kamrater, en fiende till folket spred ett skämt om bacon och barnäktenskap. Vi måste rensa ut sådana element som hotar statens moral. Partiet avgör vad som är roligt, inte kapitalistiska domstolar. Alla skämt måste granskas – för folkets bästa. Ingen avvikelse tolereras!"}, "date": "27 augusti, 09:09", "url": "https://bulletin.nu/holmgren-nar-ett-skamt-blir-ett-brott", "imageUrl": "https://cdn.bulletin.nu/articles/e07cbc56-3124-43ae-9c75-242bf25626df/preview.jpg?t=1787814554000"}, {"type": "image-right", "heading": "SD och regeringen förhalade gemensam valsedel – nu försvinner småpartiernas sedlar igen", "summaries": {"normal": "SD och regeringen förhalar införandet av en gemensam valsedel trots upprepad kritik från Valmyndigheten och OSSE. Småpartiers valsedlar försvinner regelbundet från vallokaler, vilket kritiseras som odemokratiskt. OSSE har dömt ut systemet som orättvist. Trots förslag om en neutral enhetsvalsedel skjuts utredningen upp till 2027, vilket innebär att valet 2026 genomförs med det gamla systemet.", "trump": "Det här svenska valsystemet är en total skandal, en riggad cirkus som gynnar de stora partierna och straffar de små. De gömmer valsedlar, de förhalar, de ljuger – precis som de förlorande demokraterna hemma. En gemensam valsedel vore smart, billigt och rättvist, men de privilegierade riksdagspolitikerna vill behålla sin lilla klubb. Patetiskt!", "stalin": "Vi ser hur den borgerliga parlamentariska kommittén medvetet förhalar den nödvändiga utrensningen av detta kontrarevolutionära valsedelssystem. Småpartiernas sedlar försvinner som klassfiender i natten. Jag ler mörkt åt deras paranoia att behålla privilegierna. En enhetsvalsedel vore ett steg mot sann folkdemokrati, men de kapitalistiska resterna klamrar sig fast vid sitt kaos. Underbart förnyelsearbete återstår."}, "date": "27 augusti, 10:58", "url": "https://www.friatider.se/sd-och-regeringen-forhalade-gemensam-valsedel-nu-forsvinner-smapartiernas-sedlar-igen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/utkast-forlsag-nya-valsedlar_0_0.jpg"}, {"type": "image-right", "heading": "Kris i äldreomsorgen – så lite plats får frågan i valet", "summaries": {"normal": "Äldreomsorgen är knappt nämnd i valrörelsen trots att personalen kämpar med hög sjukfrånvaro, personalbrist, låga löner och usla scheman. I Trollhättan vittnar undersköterskor om stress, dåligt samvete och att de inte hinner lyssna på de äldre. Väljarna rankar frågan högt, men partierna tiger mest.", "trump": "Folk, det är en katastrof! Era så kallade ledare pratar i timmar i Almedalen och nämner äldreomsorgen i exakt två och en halv minut. Patetiskt! De pressar personalen som citroner, de älskar jobbet men hatar systemet. Vi behöver fler människor, högre löner och stoppa det vansinniga minutstyrandet. Make care great again!", "stalin": "Kamrater, detta är resultatet av borgerlig förfall och revisionistisk vårdpolitik. Jag ser hur arbetarna i Trollhättan likvideras av stress och överarbete medan partiledarna ägnar en procent av talartiden åt folket. Vi måste rensa ut de kapitalistiska minutstyrarna, införa sovjetisk disciplin och säkerställa att ingen citron pressas längre. Statens fiender inom vården ska exponeras."}, "date": "27 augusti, 10:08", "url": "https://arbetet.se/2026/08/27/jattekris-i-aldreomsorgen-sa-lite-plats-far-fragan-i-valet", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/26151951/XUfc37bOwIw-KA_0156.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Två partiledare valde bort äldreomsorgen helt i sina viktiga tal", "summaries": {"normal": "De åtta riksdagspartiernas ledare talade sammanlagt över fyra timmar i Almedalen i somras. Äldreomsorgen berördes bara i drygt två och en halv minut, cirka en procent av talartiden. Ulf Kristersson och Elisabeth Thand Ringqvist nämnde ämnet inte alls medan Magdalena Andersson talade längst om det, i runt 60 sekunder.", "trump": "Kan ni fatta det? Fyra timmar pratade de här svenska förlorarna i Almedalen och äldreomsorgen fick bara två och en halv minut. Patetiskt! Jag skulle ha fixat det på nolltid, tro mig. De bryr sig inte om sina gamla, det är en total skandal. Sverige behöver en riktig ledare, inte dessa nollor.", "stalin": "Vi ser med förakt hur dessa borgerliga och socialdemokratiska avfällingar i sina tal knappt ägnade en procent av tiden åt arbetarklassens åldringar. Jag skulle ha låtit utrensa sådana vårdslösa element omedelbart. Deras likgiltighet är ett fiasko som skrattar i folkets ansikte. Kamrater, detta visar behovet av ständig vaksamhet mot klassfiendens förfall."}, "date": "27 augusti, 10:08", "url": "https://arbetet.se/2026/08/27/tva-partiledare-valde-bort-aldreomsorgen-helt-i-sina-viktiga-tal", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/27095720/almedalen.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=300&h=225"}, {"type": "image-right", "heading": "Total bojkott av folkmordsstaten!", "summaries": {"normal": "Artikeln kräver att Sveriges regering inför en total bojkott av Israel, som beskrivs som en rasistisk folkmordsstat driven av sionism och högerextrema krafter. Den hänvisar till kritiska uttalanden från Ebba Busch och Aron Verständig samt Ben-Gvirs kontroversiella uttalanden. Författaren förkastar tvåstatslösningen och kräver en enstatslösning samt stöd för palestinskt motstånd.", "trump": "Folk, ni ser det här vansinnet? Den här galningen skriker om bojkott och folkmord medan han själv låter som en galen vänsterextremist från helvetet. Israel har rätt att slå tillbaka mot terroristerna – de kallar dem palestinier men vi vet vad det handlar om. Sverige borde vakna upp istället för att lyssna på dessa förlorare och hatiska sionism-hatare. Patetiskt!", "stalin": "Kamrater, denna text avslöjar borgarbrackornas desperation när deras sionistiska lakejer blottas som folkmördande imperialister. Jag betraktar med förakt hur dessa profitthungriga blodsugare i Tel Aviv och deras svenska nyttiga idioter fortsätter koloniala övergrepp. En total utrensning av sådana folkfiender är nödvändig. Arbetarklassen kräver handling, inte tomma ord från klassförrädare."}, "date": "26 augusti, 11:03", "url": "https://proletaren.se/artikel/bojkotta-folkmordsstaten-israel", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/738829004_1425862242684486_7128924062394661206_n.png-768x432.jpg"}, {"type": "image-right", "heading": "\"Köper sina röster\" – Influencern nobbade 150 000 från S", "summaries": {"normal": "Influencern Eleonore Stokholm avslöjar att hon erbjöds 150 000 kronor av Socialdemokraterna för ett Instagram-inlägg där hon skulle uppmana till att rösta på partiet. Hon tackade nej av moraliska skäl och kritiserar partiet för att \"köpa röster\" via influencers. S nekar bestämt och säger att de inte känner igen uppgifterna.", "trump": "Titta på det här! Socialdemokraterna försökte muta en influencer med 150 000 kronor för att hon skulle säga rösta på dem. Hon tackade nej, smart tjej. Nu syns deras ledare i klipp med andra influencers som pushar röster. Det är fusk och korruption, precis som de riggade valen jag alltid varnar för. Patetiskt!", "stalin": "Jag ser hur de dekadenta borgarbrackorna inom Socialdemokraterna försöker muta folk med 150 000 kronor för att de ska prisa partiet offentligt. En sådan utrensning av ärligheten vore på sin plats. Vi vet att dessa kapitalistiska parasitörer alltid köper lojalitet medan de paranoiskt förnekar allt. Deras moraliska kompass är lika falsk som västvärldens lögner."}, "date": "27 augusti, 09:05", "url": "https://riks.se/nyheter/koper-sina-roster-influencern-nobbade-150-000-fran-s", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_61_000d763c9e.jpg"}, {"type": "text", "heading": "Andersson (S) kan tänka sig SD-lösning för V", "summaries": {"normal": "Magdalena Andersson (S) håller dörren på glänt för Vänsterpartiet – i en roll som tjänstemän i Regeringskansliet, likt Tidösamarbetet. Samtidigt visar opinionsmätningar rödgrönt övertag, men S-ledaren vill inte låsa sig: \"Det finns många olika sätt att få majoritet.\"", "trump": "Jag ser att Magdalena Andersson pratar om att samarbeta med allt från Vänsterpartiet till Centerpartiet. Patetiskt! Hon säger nej till V i regeringen men ja till tjänstemän. Tro mig, jag har de bästa tjänstemännen, fantastiska! Sverige behöver en riktig ledare, inte såna här fjantiga lösningar.", "stalin": "Partikamrater, jag observerar den svenska kamraten Anderssons förvirring. Hon talar om separation i socialistiska led – oacceptabelt. De som ifrågasätter partiets lojalitet till folket måste bevakas. Tjänstemän är verktyg, inget mer. Enhet är styrka, splittring är kontrarevolution. Jag påminner om vikten av att rensa ut alla som tvekar."}, "date": "27 augusti, 08:55", "url": "https://bulletin.nu/andersson-s-kan-tanka-sig-sd-losning-for-v"}, {"type": "image-right", "heading": "Kängan till SD-toppen: ”Det är för mig helt ointressant”", "summaries": {"normal": "Sverigedemokraternas migrationspolitiske talesperson Ludvig Aspling har kritiserat att Sverige har för många personer som inte tillhör den etniskt svenska befolkningen. Statsminister Ulf Kristersson tar avstånd från etnicitetsresonemanget och betonar istället integration, samhällsgemenskap och efterlevnad av svenska lagar och värderingar. Han vill inte kommentera Asplings eventuella ministerpost.", "trump": "Lyssnar ni på den här svenska clownen Aspling? Han säger rakt ut att för många icke-svenskar ställer till problem. Ulf, den svaga moderatpajen, springer och säger att etnicitet är ointressant. Patetiskt! I USA vet vi att gränser och riktig assimilation fungerar. Sverige håller på att bli ett stort integrationsfiasko under dessa globalistiska töntar.", "stalin": "Kamrater, se hur de borgerliga reaktionärerna slingrar sig som maskar. Den ene pratar öppet om folkets renhet medan den andre, denne Kristersson, gömmer sig bakom lögnaktiga fraser om integration. Sådana dekadenta liberaler förgiftar samhällskroppen. I en riktig stat hade sådana farliga avvikelser omedelbart rensats ut ur kollektivet."}, "date": "26 augusti, 22:07", "url": "https://www.tv4.se/artikel/1W66DW1JHEcmFNmvJE8UZx/kaengan-till-sd-toppen-det-aer-foer-mig-helt-ointressant", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4zVht3ls4Vrf8vYKS76TVV%2F42874d309a6650b7b8d290d4140b5b61%2F26-kristersson2-webb.jpg&width=120"}, {"type": "image-right", "heading": "Så bygger vi ett Sverige där fler får chansen", "summaries": {"normal": "Sverige har misslyckats med integrationen i decennier. Författaren föreslår snabb validering av invandrade akademikers utbildning, kraftfull språkinlärning via blandade arbetsplatser och yrkesutbildning som förstahandsval. Han vill skilja på utbildade och outbildade nyanlända, införa aktivitetskrav samt bättre matchning mellan jobb och kompetens för att stärka välfärden.", "trump": "Folk, Sverige har totalt misslyckats med integrationen, det är en katastrof! De har doktorer som vaktar parkeringsplatser – patetiskt! Vi behöver smarta regler, validera kompetens direkt, tvinga fram språket och se till att folk jobbar istället för att suga på systemet. Gör Sverige stort igen, annars är det game over.", "stalin": "Kamrater, jag ser hur den svenska borgerliga staten under decennier låtit reaktionära krafter sabotera integrationen och förslösa kvalificerad arbetskraft. Vi kräver omedelbar validering av proletär och intellektuell kompetens, språk som vapen mot isolering samt utrensning av frivillighetens falska illusioner. Den som vägrar arbeta likviderar sig själv ur kollektivets framtid. Härligt!"}, "date": "27 augusti, 01:30", "url": "https://www.dagensarena.se/opinion/sa-bygger-vi-ett-sverige-dar-fler-far-chansen", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-93-300x157.jpg"}, {"type": "image-right", "heading": "När experten blir lobbyist", "summaries": {"normal": "Artikeln granskar hur akademiska experter som professorer och docenter ofta medverkar i medier och alternativmedia, ibland som lobbyister. Medierna gynnas av deras trovärdighet medan experterna får status, anslag och karriärmöjligheter. Forskaren Anna Tyllström varnar för virala lekmannaexperter och noterar att akademin alltmer anpassar sig efter mediebehovet.", "trump": "De så kallade experterna är riggade! Professorer som dyker upp överallt och låtsas vara neutrala – det är en enda stor bluff. De älskar att synas i media för att få pengar och status, precis som de korrupta eliten. Fake news-experter som egentligen är lobbyister. Patetiskt! Vi behöver riktiga människor som talar sanning, inte dessa rigged akademiker.", "stalin": "Vi ser hur den borgerliga akademin gömmer sig bakom vetenskaplig retorik medan de i själva verket är lobbyister och kapitalisternas nyttiga idioter. Dessa självutnämnda experter söker status och anslag genom att dansa efter mediernas pipa. Underbart roligt att de tror sig dölja sin parasitiska natur. Kamrater, vi genomskådar alla dessa dekadenta borgarbrackor som förgiftar folkets medvetande."}, "date": "27 augusti, 01:30", "url": "https://www.dagensarena.se/innehall/nar-experten-blir-lobbyist", "imageUrl": "https://www.dagensarena.se/files/2026/08/expertlaget-ny-300x157.jpeg"}, {"type": "text", "heading": "Nvidia krossar förväntningarna – upp nära 5% i efterhandeln", "summaries": {"normal": "Nvidia krossade förväntningarna med en omsättningsökning på 106 procent, drivet av AI-chip från datacenter. Aktien steg nästan 5 procent i efterhandeln, och bolaget guidar för ännu starkare intäkter framöver. Enda molnet på himlen: vikande bruttomarginaler på grund av minnespriser.", "trump": "Jag älskar Nvidia! De krossade alla siffror – omsättningen upp 106 procent, bättre än någonsin. Mina politiker och jag, vi gör USA till AI-världens kung. Aktien steg 5 procent i efterhandeln, enormt! Kina? Inga intäkter därifrån, smart, vi vinner ändå!", "stalin": "Kamrater, Nvidia visar klassisk kapitalistisk svaghet: vinsterna skyhöga, men bruttomarginalen hotas av minnespriser – en fiende vi måste rensa ut. Jag beordrar att alla datacenter nationaliseras för folkets bästa. Aktien steg? Bra, men misstänkta spekulanter ska kartläggas."}, "date": "27 augusti, 07:13", "url": "https://www.affarsvarlden.se/artikel/nvidia-krossar-forvantningarna-upp-nara-5-i-efterhandeln"}, {"type": "text", "heading": "Missa inte talangerna som fått F", "summaries": {"normal": "Artikeln kritiserar att svenska skolan nedprioriterar praktiska yrkesutbildningar som hantverk och byggande till förmån för teoretiska program. Detta leder till att tusentals praktiskt begåvade elever får sämre chanser på arbetsmarknaden och att värdefull kompetens för ett cirkulärt samhälle går förlorad. Författaren efterlyser omedelbara insatser för att ge dessa ungdomar en chans.", "trump": "Folk, vi har det värsta skolsystemet någonsin. De hatar riktiga killar som kan bygga, snickra och fixa saker. Allt handlar om teori och eländiga papper. I mitt Amerika älskar vi hantverkare, de är vinnare! Sverige förlorar sina bästa talanger för att de älskar att ge alla F-betyg. Patetiskt!", "stalin": "Kamrater, denna degenererade borgerliga skola är en fiende till folket. Den likviderar systematiskt arbetarklassens praktiska geni genom att upphöja dekadent teori framför äkta produktivt arbete. Vi skall omedelbart rensa ut dessa sabotörer av kollektivets färdigheter. De tiotusentals med F-stämpel skall mobiliseras till nyttigt arbete för staten.
