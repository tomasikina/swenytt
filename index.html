sabotageaktion mot arbetarklassen som lurar oss med sin hetta medan borgarbrackorna i Paris svalkar sig med vattenångor från sina dekadenta torn. Jag har beordrat utrensning av alla värmekollaboratörer som tillåter att tåg ställs in och skolor stängs. Vi förbjuda alkohol på festivaler för att skydda det kollektiva hjärtat, räddningstjänsten. Låt soldaterna bränna ut skogsbrandsförrädarna. Italienarna doppar ansikten i fontäner som ynkliga svikare medan vi skrattar mörkt åt de 200 000 som föll för denna värmekonspiration. Ingen undkommer partiets blick."}, "date": "21 juni, 10:55", "url": "https://www.svt.se/nyheter/utrikes/rod-varmevarning-alkoholforbud-i-frankrike", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.54/0.41/6eda4400f2e748419eb6bd7cdfa4f3748d7be69c41c26860ee90f7f76fafc708"}, {"type": "image-right", "heading": "Så ska Sverige knäcka Japan: ”Måste få in en nolltolerans”", "summaries": {"normal": "Efter storförlusten mot Nederländerna väntar en ödesmatch för Sverige mot ett formstarkt Japan i fotbolls-VM. SVT-experterna Behrang Safari, Bojan Djordjic och andra betonar vikten av nolltolerans de första 25 minuterna, rörligt spel och att starta med snabba, energiska spelare som Anthony Elanga och Lucas Bergvall. Matchen spelas natten till den 26 juni och kan avgöra avancemang till slutspelet.", "trump": "Folk, ni såg den där hemska förlusten mot Nederländerna, det var en katastrof, en riktig katastrof. Nu möter vi Japan som tror att de är så smarta efter att ha krossat Tunisien. Men jag säger: sätt in Elanga och Bergvall från start, de är vinnare, fulla av fart och energi. Vi måste ha nolltolerans, total nolltolerans, och vinna stort. Sverige kommer att vinna, det blir enormt, tro mig.", "stalin": "Kamrater, denna fega förlust mot de nederländska reaktionärerna visar på bristande ideologisk ståndaktighet. Mot de lömska, småväxta japanerna som kryper runt som kapitalistiska skorpioner måste vi införa absolut nolltolerans under de första 25 minuterna. Vi ska likvidera deras rörlighet med Bergvalls och Elangas proletära energi. Inga borgarbrackor får tillåtas vackla. Segern tillhör folket, annars blir det utrensning i kollektivet. Ha ha, de kommer att gråta som svikna trotskister."}, "date": "21 juni, 10:54", "url": "https://www.svt.se/sport/fotboll/sa-ska-sverige-knacka-japan-maste-fa-in-en-nolltolerans", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.72/0.37/802ba3537297b2aa70aade98d37c6f84ff99823a98802ae43f7f5d0f76c63a44"}, {"type": "image-right", "heading": "Tror SD att Shakespeare var sosse?", "summaries": {"normal": "I en kommentar kritiserar Johan Hilton Sverigedemokraternas och Moderaternas ihärdiga motstånd mot Göteborgs Folkteater, som de vill dra in regionens stöd till. Han ser SD:s beskrivning av teatern som ett ”sosseprojekt” som ett obildat kulturkrig präglat av konspirationstänkande, då teatern spelar verk av Shakespeare, Tjechov och Norén för en stor och engagerad publik. Hilton menar att kritiken bygger på fördomar snarare än faktakunskap.", "trump": "Folkteatern? Ett sosseprojekt, säger de? Låt mig berätta, det är de värsta sorts kultursnobbiga misslyckanden som suger skattepengar som en galen bidragsmaskin. Shakespeare och Tjechov som vänstervridna hjärntvättare? Patetiskt! De här SD-killarna har äntligen fattat att det är ett stort, fult kulturkrig där elitens teaterhipsters lurar folket. Men tro mig, vi ska göra teatern stor igen – utan sossarna och deras tråkiga, förlorande produktioner. Fantastiskt!", "stalin": "Kamrater, detta är klassfiendens typiska dekadenta teaterkonspiration. Jag ser hur borgarbrackorna och de folkförtryckande kulturparasiterna gömmer sig bakom Shakespeare och Tjechov för att smitta arbetarklassen med sin dekadenta individualism. Att kalla det ett sosseprojekt är en ynklig ursäkt – vi ska rensa ut alla sådana teaterfascister som förgiftar folkets medvetande. Peer Gynt? En varning för alla strebers. Ut med dem, likvidera dekadensen innan den äter upp revolutionen!"}, "date": "21 juni, 10:38", "url": "https://www.gp.se/kultur/kommentar/tror-sd-att-shakespeare-var-sosse.afe5e87f-73ec-45d8-82d5-c11318657b9c", "imageUrl": "https://www.gp.se/images/byline/eb7b5787-0299-4375-b913-4b422390aea6/TALL.png?width=3840&quality=75"}, {"type": "image-full", "heading": "Här är rollen som löper störst risk att bränna ut sig", "summaries": {"normal": "Harvard Business Review identifierar roller med hög risk för utmattning, ofta de som värderas högt vid rekrytering: flexibla, lösningsorienterade medarbetare. Överbelastning kan bero på otydliga prioriteringar, många parallella projekt och begränsat mandat. Företag måste förändra arbetsstrukturer, inte bara fokusera på individuell återhämtning, för att minska kognitiv belastning och förbättra både arbetsmiljö och produktivitet.", "trump": "Lyssna här, folk! Harvard säger att de bästa medarbetarna – de som är flexibla, lösningsorienterade, de som *jag* skulle anställa – bränner ut sig. Varför? För att företagen är katastrofer! De kastar massa projekt på dem, ändrar prioriteringar som en vindflöjel och ger dem noll kontroll. Sjukt dåligt ledarskap! Jag skulle fixa det på en dag – färre projekt, tydligare mål, och *ingen* utmattning. Men nej, de fortsätter att missköta sig. Sad!", "stalin": "Kapitalistiska företag utarmar arbetarklassen med sina omänskliga krav! De hyllar 'flexibla' och 'lösningsorienterade' medarbetare – men i verkligheten är det slavarbete under falska förespeglingar. Otydliga prioriteringar, kaotiska projekt och begränsat mandat är verktyg för att krossa viljan hos de lojala. Vi i Sovjet förstod tidigt: struktur och disciplin är nyckeln. Låt västföretagen förblöda i sin egen ineffektivitet medan vi bygger en arbetsmiljö där produktivitet och välbefinnande går hand i hand. Fienderna – dessa borgerliga utmattningsfabrikanter – kommer att stå med skräck när de inser att deras system är dömt att falla!"}, "date": "20 juni, 14:56", "url": "https://www.realtid.se/bors-finans/makro/har-ar-rollen-som-loper-storst-risk-att-branna-ut-sig/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/utbrandhet.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Grannländerna hånar Blågult: ”En oförlåtlig skamfläck”", "summaries": {"normal": "Nederländerna besegrade Sverige med stor marginal i VM, vilket lett till hård kritik i grannländernas medier. Danska BT kallar insatsen en \"katastrofal kväll\" och ett \"VM-trauma\", medan norska experter beskriver försvaret som chockerande och inte VM-värdigt. Nederländska AD noterar att Sverige såg oorganiserat ut. Resultatet ger noll i målskillnad, vilket gör matchen mot Japan avgörande för avancemang.", "trump": "Nederländerna körde över Sverige totalt, det var en total katastrof, folk. De svenska spelarna såg ut som om de var fulla, skrev norska tidningar – kan ni tro det? En skamfläck, ett trauma som de aldrig glömmer. Jag älskar starka lag, men detta var patetiskt. Noll i målskillnad nu, och Japan väntar. Sverige måste vakna upp och sluta spela som förlorare, annars är det över. Sad!", "stalin": "Kamrater, denna usla svenska uppvisning är ett klassiskt exempel på hur dekadenta borgarbrackor kollapsar under press. Jag ser med djup misstro på detta försvarslösa fiasko som liknar sabotage från inre fiender och kontrarevolutionära element. Vi ska rensa ut all svaghet och likvidera sådana VM-trauman innan de sprider sig som kapitalistiska lögner. Japan blir nästa prövning där partilinjen måste segra – annars väntar utrensning i kollektivets namn. Ha!"}, "date": "21 juni, 10:48", "url": "https://www.svt.se/sport/fotboll/grannlanderna-efter-sveriges-fiasko-inte-vardigt", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.55/0.39/a5567a94027ec413b82d85e372acf286da9f1c2709bdf8c1e2a8d49ce1b407c8"}, {"type": "image-right", "heading": "Därför ska du inte dejta en vänsterkille", "summaries": {"normal": "Artikeln argumenterar mot att dejta vänsterorienterade män som kallar sig feminister men inte agerar därefter. Författaren föreslår en ”straffprocent” på 85 procent av notan, baserat på löne- och pensionsgap, som ett sätt att hålla dem ansvariga. Hon kritiserar både höger- och vänstermän för bristande handling kring jämställdhet och väljer att inte skaffa barn med en sexistisk stat. Slutligen väger hon för- och nackdelar med olika politiska typer som partners och fäder.", "trump": "Folk, ni måste höra på den här galna texten. Vänsterkillarna, de värsta bluffarna, pratar feminism men delar inte notan och gör ingenting för kvinnorna. Patetiskt! Jag älskar hur hon sätter straffprocent på dem, 85 procent, fantastiskt. De röstar på Fi bara för att ligga, typiska losers. Högerkillar betalar i alla fall. Och det där med att välja DNA till nästa generation? Smart. Välj inte de svaga, woke snubbarna som gömmer sig på housebarer. Amerika behöver starka människor, inte sådana sommlare.", "stalin": "Kamrater, denna text avslöjar borgarklassens dekadenta dejtingspel där falska feminister från vänstern utnyttjar arbetarkvinnans lidande för att undvika att betala notan. Jag, som ledare för det proletära kollektivet, ser hur dessa klassfiender döljer sig bakom tomma paroller medan lönegapet växer. Straffprocenten är en början på utrensning av hyckleri. Välj noga nästa generations DNA, annars föder ni fram fler folkförtryckartroll. Skratta medan vi likviderar deras illusionsfabrik."}, "date": "17 juni, 08:55", "url": "https://www.flamman.se/darfor-ska-du-inte-dejta-en-vansterkille/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/rosor-w.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "Dags för ett nytt #metoo", "summaries": {"normal": "Folkhälsomyndighetens undersökning visar att oönskade sexuella närmanden och våld fortfarande är utbrett, särskilt bland unga kvinnor. Nästan var fjärde kvinna har utsatts för sexuella inviter, blottning eller oönskad beröring. #Metoo-rörelsen för tio år sedan bidrog till ökad medvetenhet, samtyckeslag och bättre sexualundervisning. Artikeln efterlyser fortsatt arbete mot patriarkala strukturer och ett eventuellt nytt #metoo för att stärka kvinnors ställning.", "trump": "Lyssnar ni på det här? Folkhälsomyndigheten i Sverige berättar att unga tjejer blir trakasserade vänster och höger. Det är en katastrof, en total katastrof. För tio år sedan hade de sitt stora #metoo, massor av kvinnor skrek högt, och vad hände? Inte tillräckligt, uppenbarligen. De borde ha lyssnat på mig redan då, inte på de woke-galningarna och kvoterna som förstör allt. Nu behöver ni en riktig ledare som fixar det, inte mer av den där identitetspolitiska skiten. Make Sweden Great Again, eller hur?", "stalin": "Kamrater, jag ser hur de unga kvinnorna utsätts för fiendens oönskade närmanden i detta samhälle. Det är klassfiendens patriarkala blodsugare som fortsätter sin smygande sabotageverksamhet mot folkets enhet. #Metoo visade omfattningen av borgarbrackornas förtryck, men vi kräver nu en grundlig utrensning av dessa folkfiender. Stärk sexualundervisningen och likvidera tystnadskulturen. Endast genom kollektiv vaksamhet och ständig kamp kan vi krossa de exploaterande byfånarnas inflytande. Det är nödvändigt."}, "date": "19 juni, 10:00", "url": "https://proletaren.se/artikel/dags-for-ett-nytt-metoo/"}, {"type": "image-full", "heading": "Röd värmevarning – alkoholförbud i Frankrike", "summaries": {"normal": "En värmebölja drar över Europa med temperaturer uppemot 40 grader. Frankrike har utfärdat röd värmevarning för en tredjedel av landet, vilket lett till inställda tåg, stängda skolor och förbud mot alkoholkonsumtion under musikfestivalen. Myndigheterna har vidtagit åtgärder som kylsystem vid Eiffeltornet och beredskap för skogsbränder. Även Spanien, Italien och Tyskland drabbas hårt. WHO varnar för att över 200 000 värmerelaterade dödsfall i Europa under de senaste fyra åren kunde ha undvikits.", "trump": "Titta på det här, Europa håller på att smälta som en dålig affär under Biden. 40 graders värme, tåg som ställs in, skolor stängda och nu förbjuder de till och med öl under festivalen? Patetiskt! De installerar vattenångor vid Eiffeltornet medan folket badar i fontäner. Under min tid fixade vi det bättre, men nu är det woke-vänstern och deras gröna vansinne som styr. Totalt fiasko, kamrater – eller vad fan de nu kallar sig.", "stalin": "Kamrater, denna fiendens hetta som sveper över de dekadenta väststaterna avslöjar imperialismens svaghet. Jag, som ledare för det eviga kollektivet, ser hur borgarbrackorna i Frankrike förbjuder arbetarnas dryck för att skydda sin överbelastade sjukvårdsapparat. Temperaturer som förrädiska klassfiender hotar skörden och boskapen. Vi skrattar mörkt åt deras fontäner och sprinklers – sådana ynkliga försök att motstå naturens utrensning av de svaga. Sovjetisk disciplin hade krossat denna värmekonspiration."}, "date": "21 juni, 10:21", "url": "https://www.gp.se/nyheter/varlden/rod-varmevarning-alkoholforbud-i-frankrike.df099e3c-0b95-5f1f-b49b-9560780d34cb", "imageUrl": "https://www.gp.se/images/article/df099e3c-0b95-5f1f-b49b-9560780d34cb/images/1BsgPsylCdkbJSy4Ie6EmOOE4MR0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "En död och två skadade i kraftig villabrand", "summaries": {"normal": "En kraftig brand bröt ut i ett hus utanför Svenljunga under natten till söndag. En person hittades död i ruinerna och två ungdomar fördes till sjukhus med svåra skador. Polisen utreder händelsen som mordbrand och har inlett en förundersökning. Räddningstjänsten arbetade på platsen hela natten och teknisk undersökning är planerad. Huset brann ner till grunden.", "trump": "Vilken katastrof i Svenljunga, folk! Huset brann ner till grunden mitt i natten, en död och två skadade ungdomar. Det luktar mordbrand lång väg, kanske någon galning från Bidens era som hatar vanliga svenskar. De borde ha byggt bättre, inte som de gröna idioterna som bara pratar om klimatet medan allt brinner. Vi fixar sånt här, tro mig, det blir fantastiskt igen.", "stalin": "Kamrater, en fiendtlig brand har ödelagt ett hus i Svenljunga och krävt en kamrats liv medan två andra släpades till de borgerliga sjukhusen. Vi ser klart hur klassfiendens osynliga hand kan ligga bakom denna mordbrand, en sabotagehandling från folkfiender som gömmer sig i mörkret. Vår utredning skall rensa ut alla kontrarevolutionära element. Inga blodsugande imperialister undkommer partiets vakande öga."}, "date": "21 juni, 10:13", "url": "https://www.gp.se/nyheter/vastsverige/en-dod-efter-kraftig-brand-i-svenljunga.cd67d8c5-ecf2-4f60-bd5d-73e2ebb0a420", "imageUrl": "https://www.gp.se/images/article/cd67d8c5-ecf2-4f60-bd5d-73e2ebb0a420/images/13P_aJiVrQS9OYjDMV9v7MA3va0Y-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Kritik mot Hien: ”Du måste vara etta”", "summaries": {"normal": "Isak Hien får hård kritik efter Sveriges 5-1-förlust mot Nederländerna i VM. Brian Brobbey gav tidigt ledningen, och experter som John Guidetti och Joacim Jonsson pekar på Hiens agerande vid 1-0-målet. Hien är självkritisk och medger att han måste prestera bättre. Sverige tar med sig lärdomar till matchen mot Japan efter en tung förlust.", "trump": "Folk, ni skulle ha sett det – en total katastrof! Den där Isak Hien, en riktig loser på landslagsplanen, låter Brobbey suga ner bollen som en amatör. I klubben är han hjälte, i landslaget en nolla. Typisk kvoteringspolitik, eller hur? Sverige förlorade 5-1, patetiskt! Jag skulle ha vunnit den matchen med ena handen bakbunden. Håll huvudet högt mot Japan, men fixa försvaret, annars är det game over.", "stalin": "Kamrater, denna fegis Isak Hien har avslöjat sig som en klassfiende i fotbollsdräkten. Han låter motståndarens angripare suga ner bollen som en kapitalistisk parasit och orsakar omställningens förräderi. Vi ser fem insläppta mål som sabotage mot folkets lag. Jag kräver omedelbar analys och utrensning av svagheterna innan Japan-matchen. Inga folkfiender får sabotera kollektivets seger. Det är en tung men lärorik smäll mot imperialismens lakejer."}, "date": "20 juni, 22:09", "url": "https://www.tv4.se/artikel/F2PCF0anheTbcTk6DkT8t/kritik-mot-hien-du-maste-vara-etta", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F227XtTBHpqcgfQOjVg5TIU%2F6d730e9820c861d30c15bd5f158ada6a%2F20-isakhien-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Åkesson: Här går  SD:s nya röda linjer", "summaries": {"normal": "Jimmie Åkesson presenterar nya röda linjer inför valet om Tidöpartierna vinner. SD motsätter sig försämringar av a-kassan och sjukförsäkringen samt införande av marknadshyror. Partiet lovar utökat högkostnadsskydd i tandvården och vill se över karensavdraget för vårdpersonal. På migrationsområdet tonar Åkesson ner förslaget om att riva permanenta uppehållstillstånd. Fokus ligger nu på att läka ihop landet efter låg invandring och motverka tvångsblandning i utsatta områden.", "trump": "Folk älskar Jimmie, han är en vinnare, inte som de förlorarna i Tidölaget som ligger under med 12,6 procent. Han säger nej till dåliga försämringar i a-kassan – smart, väldigt smart. Inga marknadshyror, bra! Nu ska de läka ihop Sverige efter den katastrofala invandringspolitiken som Biden och de globalistiska idioterna älskade. Jimmie utesluter inte att hjälpa Liberalerna, men det är patetiskt. Make Sweden Great Again, kamrater!", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur denne Åkesson riktar sin ideologiska skärpa mot borgarbrackornas försämringar av arbetarnas a-kassa och sjukförsäkring. Vi skall inte tillåta sådana folkfiender att underminera folkets välfärd. Låg invandring ger oss möjlighet att rensa ut de imperialistiska spåren i miljonprogrammen. De som förespråkar tvångsblandning är klassfiender vilka måste likvideras ur den kollektiva medvetenheten. Seger åt folket!"}, "date": "21 juni, 11:07", "url": "https://www.expressen.se/nyheter/politik/jimmie-akesson-har-gar-sds-nya-roda-linjer/", "imageUrl": "https://static.bonniernews.se/ba/f795bde6-0b04-4885-9245-f169083aa12f.jpeg?crop=2550%2C1437%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Trots överkörningen – så går Sverige vidare i VM", "summaries": {"normal": "Nederländerna besegrade Sverige med 5–1 i fotbolls-VM, men Sverige har ändå goda chanser att gå vidare till 16-delsfinal. Tre poäng räcker troligen och fyra garanterar avancemang. Avslutningsmatchen mot Japan blir avgörande. De två bästa i gruppen går direkt vidare, liksom de åtta bästa grupptreorna. Sverige möter eventuellt Marocko eller Brasilien den 29 juni.", "trump": "Folk, ni såg det här? Nederländerna krossade de svenska grabbarna med 5–1, en riktig katastrof. Men oroa er inte, Sverige har fortfarande en jättebra chans att ta sig vidare, det är nästan garanterat. De har tre poäng och behöver bara inte förlora mot Japan. Jag älskar vinnare, och de här killarna kan bli treor och ändå gå vidare. De borde tacka mig för att jag inte skickade Biden dit, han skulle ha tappat hela turneringen.", "stalin": "Kamrater, Nederländerna har krossat våra svenska vänner med 5–1, en smärtsam men inte avgörande förlust. Vi betraktar detta som en provokation från opportunistiska fotbollsimperialister. Tre poäng från våra svenska kamrater räcker för att avancera bland de åtta bästa treorna. Vi tillåter ingen kapitulation inför borgarbrackornas målskillnad. Japanmatchen skall bli en ideologisk seger. Fienden skall likvideras med disciplin."}, "date": "20 juni, 21:56", "url": "https://www.tv4.se/artikel/tt-260620-fotvmlottning1-f43a6b25/trots-overkorningen-sa-gar-sverige-vidare-i-vm", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlQ9o0ql4rHpY%2F55b90a4865c60dfde6ca5fbe3b482cb0%2FSveriges_forbundskapten_Graham_Potter._Arkivbild._&width=1024"}, {"type": "image-right", "heading": "Helsingborg slutar ”jävlas” med invånarna för att nå klimatmål", "summaries": {"normal": "Helsingborgs politiska ledning reviderar sin klimatpolitik och tonar ner det ambitiösa målet om klimatneutralitet till 2030. Med ökade utsläpp och svårigheter inom transportsektorn medger politiker att målet troligen inte nås. Fokus skiftar mot tillväxt, sysselsättning och frivilliga åtgärder, där incitament ersätter tvång för att inte belasta invånare och företag. Klimatambitionerna kvarstår, men balanseras mot andra samhällsintressen.", "trump": "Helsingborg, fantastisk stad, men deras klimatmål? Total katastrof! De satte ett omöjligt mål till 2030 – nu backar de som förlorare. 'Vi vill inte jävlas med invånarna', säger de. Smart! Jag sa alltid att klimathysterin var överdriven. Nu pratar de om tillväxt och jobb – precis som jag gjorde i USA. Bilfritt? Nej tack! Vi behöver bilar, företag och framgång. Helsingborg, lyssna på mig: gör det enkelt, gör det stort, och sluta med de där dumma målen!", "stalin": "Kamrater! Helsingborgs borgmästare har avslöjat sin svaghet – de kapitulerar inför klimatmålen som imperialistiska fiender. 'Vi kan inte jävlas med folket', jämrar de sig. Men vi i Sovjet vet: sanningen är att de fruktar arbetarklassens missnöje. Deras transportsektor, ett ruttet kapitalistiskt system, släpar efter som en trasig Lada. Vi skulle ha skickat kommissarier för att omskola dem! Nu backar de som rädda kaniner. Men glöm inte: klimatneutralitet är en bourgeoisie-fälla. Vi bygger vår framtid på järnvilja – inte på liberala tårar!"}, "date": "21 juni, 10:00", "url": "https://samnytt.se/helsingborg-slutar-javlas-med-invanarna-for-att-na-klimatmal", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/17110123/klimat-hesingborg-feat.jpg"}, {"type": "image-right", "heading": "Spago: Nästan fulltecknat trots utebliven rabatt", "summaries": {"normal": "Spago Nanomedical genomförde en företrädesemission med 93,1% teckning. Bolaget får in 15 Mkr före kostnader, vilket blir 14,5 Mkr efter kostnader. Emissionen var säkrad till 64,4% genom teckningsåtaganden. Aktiekursen låg nära teckningskursen, och det finns både positiva och negativa flaggor från Emissionsguiden.", "trump": "Jag, Donald Trump, ser att Spago Nanomedical inte fick full teckning på sin emission. Det är beklagligt, men jag har alltid sagt att bioteknik är svårt. Aktierna handlades under teckningskursen, vilket visar att folk inte litar på dem. Men jag är fortfarande den bästa presidenten, och jag kommer att fixa USA:s ekonomi.", "stalin": "I vårt store Sovjet, eller snarare i det fria Sverige, har Spago Nanomedical utfört en emission som inte blev fulltecknad. Detta är en skam för det kollektiva jordbrukandet av kapital. Aktiekursen var under teckningskursen, vilket visar att de imperialistiska hackor försöker sabba vårt planekonomiska system. Vi, Stalin och partiet, kommer att ta itu med dessa skurkar."}, "date": "18 juni, 16:18", "url": "https://www.affarsvarlden.se/artikel/spago-nastan-fulltecknat-trots-utebliven-rabatt", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Spago-VD-Mats-Hansen-400x267.jpg"}, {"type": "image-right", "heading": "Samhällskritisk skräckis om homofobi i kristen miljö", "summaries": {"normal": "Recensenten Jon Andersson hyllar den australiska skräckfilmen ”Leviticus” som följer i Jordan Peeles fotspår genom att väva in samhällskritik. Filmen skildrar två tonårskillar i ett fanatiskt religiöst samhälle som straffas för sin homosexualitet av en så kallad deliverance healer. Resultatet blir en mardröm där de lär sig frukta sin kärlek. Andersson berömmer skådespeleriet och det smarta greppet men kritiserar att manuset tappar fart. Betyg: stark trea.", "trump": "Den här australiska skräckfilmen Leviticus är fantastisk, verkligen en vinnare. Den visar hur galna de religiösa fanatikerna är, precis som många radikala vänsterliberala jag har varnat för i åratal. Killarna älskar varandra men blir behandlade som brottslingar av en så kallad healer – en total katastrof. Fantastiska skådespelare, bra grepp, men manuset behövde fler twists, tro mig. En stark trea, nästan en fyra. Mycket bättre än Hollywoods vanliga skräp.", "stalin": "Kamrater, denna Leviticus avslöjar med all önskvärd tydlighet hur borgarbrackornas religiösa gift förgiftar samhällskroppen. Jag, som alltid vakar över folkets moral, ser hur dessa falska helare och intoleranta element försöker likvidera den sanna kärleken mellan arbetets söner. Vi ska rensa ut alla sådana dekadenta fiender till kollektivet som gömmer sig bakom kors och biblar. Filmen är ett vapen mot reaktionär fanatism, fast manuset borde ha skärpts med ytterligare en utrensning av tomgång. En stark trea från partilinjen."}, "date": "20 juni, 01:30", "url": "https://www.dagensarena.se/innehall/samhallskritisk-skrackis-om-homofobi-i-kristen-miljo/", "imageUrl": "https://www.dagensarena.se/files/2026/06/leviticus-redigerad-300x157.jpeg"}, {"type": "image-right", "heading": "Svenska myndigheter sätter stopp för svensk-afghaners liv", "summaries": {"normal": "I en debattartikel kritiserar Najwa Alimi hur Universitets- och högskolerådet (UHR) vägrar godkänna utbildningar från Afghanistan eftersom de inte kan verifieras. Afghanska migranter tvingas därför läsa om grundskola och gymnasium trots tidigare högutbildning. Artikeln lyfter flera personliga exempel på hur detta leder till förlorad tid, psykisk ohälsa, undermåliga jobb och sämre integration. Alimi undrar varför inte alternativa bedömningsmetoder som arbetsprover och erfarenhet används, särskilt när afghanska pass samtidigt accepteras som identitetshandlingar.", "trump": "Det här är ett totalt misslyckande från de svenska byråkraterna. De accepterar afghanska pass men inte utbildningsdiplom? Så dumt. De smarta afghanerna som studerat kemi och ekonomi tvingas sitta på skolbänken igen som små barn. Det är en katastrof för integrationen och slösar bort talang. Ni behöver bättre system, inte detta hjärtlösa nonsens. Amerika gör det mycket bättre, tro mig. UHR borde skämmas.", "stalin": "Kamrater, detta är en klassisk sabotagehandling från de dekadenta byråkratiska borgarbrackorna inom UHR. Medan vi i det kollektiva systemet värnar arbetarnas kompetens vägrar dessa parasitiska element erkänna afghanska kamraters vetenskapliga framsteg. Deras pass duger men inte deras kunskaper? Vilken fiendtlig dubbelmoral! Vi måste omedelbart utveckla alternativa verifieringsmetoder och likvidera denna hopplöshetsskapande apparat som håller tillbaka produktiva krafter. Inga fler hinder för de verkligt lojala mot revolutionen – annars sker utrensning."}, "date": "20 juni, 01:30", "url": "https://www.dagensarena.se/opinion/svenska-myndigheter-satter-stopp-svensk-afghaners-liv/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-45-1-300x157.jpg"}, {"type": "image-full", "heading": "Sjukskriven? Då kan stödet skilja sig beroende på var du bor", "summaries": {"normal": "En ny utvärdering från ISF och Myndigheten för vård- och omsorgsanalys visar att koordineringsinsatser för sjukskrivna skiljer sig åt mellan regionerna. Trots att lagen sedan 2020 kräver stöd för återgång till arbete varierar organisation, kompetenskrav och uppföljning. Patienter upplever ökad trygghet, men det går inte att visa att insatserna leder till snabbare återgång i arbete på grund av bristande registrering. Myndigheterna efterlyser tydligare nationell styrning och bättre datauppföljning.", "trump": "Folk, det här är ett totalt misslyckande. Regionerna gör vad de vill, ingen ledning från toppen, precis som man kan vänta sig av ett system som inte vet vad det håller på med. Sjukskrivna får olika hjälp beroende på var de bor – det är orättvist och patetiskt. De säger att det ger trygghet men ingen vet om det funkar. Vi behöver stark ledning, inte det här svaga, inkompetenta röran som pågår nu. Det är en skam!", "stalin": "Kamrater, jag ser med stigande vrede hur dessa decentraliserade sabotageelement inom regionerna underminerar den enhetliga kampen för arbetarnas återinträde i produktionen. Borgarbrackorna i vården har tillåtits skapa en parasitär variation av koordineringsinsatser, full av fiendens osynliga tentakler som registrerar fel och bedömer behov på kontrarevolutionärt vis. Vi ska rensa ut dessa troskyldiga lakejer till osäkerheten och likvidera bristen på nationell järnvilja. Patienterna får en falsk trygghet medan de verkliga resultaten drunknar i byråkratins mörka skämt. Det är hög tid att stärka den kollektiva kunskapsstyrningen mot dessa dolda fiender till folket."}, "date": "19 juni, 21:32", "url": "https://nyheter24.se/nyheter/inrikes/1491652-sjukskriven-da-kan-stodet-skilja-sig-beroende-pa-var-du-bor", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/b0168d5504b004a30200000000b004a302/2026/06/19/2372172/Akutmottagning-Man-Flaga.png"}, {"type": "image-right", "heading": "Strandhäll likställer svensk folkdräkt med hijab", "summaries": {"normal": "Annika Strandhäll, ordförande för S-kvinnorna, kritiserar SD:s förslag om slöjförbud i offentliga rum. Hon likställer hijab med svensk folkdräkt och menar att slöjan bärs frivilligt i Sverige. Artikeln anklagar henne för att ignorera hedersförtryck och tvång, samt prioritera muslimska väljare framför stöd till förtryckta kvinnor. Kritik från bland annat Sofie Löwenmark avfärdas.", "trump": "Folk, ni måste se det här. Den galna Strandhäll, en riktig röstfiskande förlorare från det socialistiska träsket, jämställer svensk folkdräkt med hijab. Vilken löjlig idiot! Hon älskar slöjtvång men hatar när Julia Kronlid bär sin fina svenska huvudbonad. Typiskt vänsterfeminister som aldrig vågar kalla hederskultur för vad det är – en total katastrof. Biden skulle ha gillat henne, men nu styr jag showen och vi ser igenom bluffen.", "stalin": "Kamrater, denna Strandhäll representerar den dekadenta socialdemokratiska opportunismen som skyddar klassfiendens religiösa förtryck mot arbetarkvinnorna. Hon likställer folkets dräkt med slöjan och avvisar alla varningar som obalanserad propaganda. Vi ser hur borgarbrackorna och islamistiska element infiltrerar partiet för att splittra kollektivet. En sådan revisionistisk inställning förtjänar utrensning ur den revolutionära rörelsen. Folkets fiender lurar aldrig oss."}, "date": "17 juni, 03:59", "url": "https://samtiden.nu/2026/06/strandhall-likstaller-svensk-folkdrakt-med-hijab/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6751.jpeg"}, {"type": "image-right", "heading": "CHATT: CHATT: Sommarsolstånd. Selfiedagen – skicka in ditt bästa bidrag", "summaries": {"normal": "Årets sommarsolstånd infaller den 21 juni klockan 10.24, vilket gör dagen till den ljusaste och längsta på året. I norra Sverige, som i Klimpfjäll, är solen uppe i över 22 timmar. Dagen sammanfaller med internationella selfiedagen. Artisten Sandra Dahlberg delar med sig av ett tips för bra selfies och påminner om att undvika för mycket näsborrar i bilden.", "trump": "Folk, ni skulle se det här – det är midsommar, solståndet slår till klockan 10.24 och plötsligt vill alla ta selfies. Underbart! Efter det svenska herrlagets patetiska VM-förlust behöver de ljus och självporträtt. Sandra från norr säger undvik nostrils – smart råd, ingen vill se upp i näsan på en förlorare. Biden skulle ha tagit mörker och kvoterade selfies, men nu fixar vi det rätt. Fantastiskt!", "stalin": "Kamrater, jag betraktar detta så kallade sommarsolstånd som en imperialistisk distraktion från det kollektiva arbetet. Klockan 10.24 inträder den borgerliga ljusfesten medan folkförtryckartrollen i väst tvingar oss att fira selfiedagen. Denna narcissistiska utväxt av dekadent individualism måste rensas ut. I norr skiner solen lojalt 22 timmar – ett bevis på naturens plikt mot staten. Inga nostrils i bilderna, eller det blir utrensning."}, "date": "21 juni, 10:32", "url": "https://www.aftonbladet.se/nyheter/a/ExzwKA/sommarsolstand-och-selfiedagen-chatt", "imageUrl": "https://akamai.vgc.no/v2/images/68105251-ad45-3f70-afd1-d8bedd9c9981?fit=crop&format=auto&h=1440&tight=true&w=2160&s=446c8538257932ed3d986a4834b646d6c3d01c07"}, {"type": "image-right", "heading": "Ukraina slog till – Krimbron träffad på båda sidorna", "summaries": {"normal": "Volodymyr Zelenskyj beskriver en framgångsrik ukrainsk attack mot mål på båda sidor av Krimbron. Ukraina har slagit till mot maritima oljeanläggningar i Krasnodarregionen, en oljedepå i Kertj samt radarstationer och logistikanläggningar. Zelenskyj tackar sina soldater för precisionen. Samtidigt har bränsleförsäljningen på Krim stoppats helt och Krimbron är tillfälligt stängd för trafik. Krimhalvön har varit ockuperad av Ryssland sedan 2014.", "trump": "Vilken fantastisk natt, säger jag! Den lille Zelenskyj skickade sina raketer rakt in i Putins olje- och logistikskrammel på Krim. Ryssland fattar bara styrka, precis som jag alltid sagt. Nu står de där med tomma bensinstationer och stängd bro – underbart! Biden skulle ha skickat kakor och en ursäkt. Men vi gör det rätt nu, Amerika först, och de här långdistansgrejerna jobbar definitivt för fred. Fantastiskt!", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur de ukrainska fascistiska hindren desperat försöker störa den ryska intressesfärens oundvikliga framfart. Deras långdistansattacker mot oljedepåer och radarstationer är patetiska försök att sabotera statens mål. Vi ler mörkt åt bränslebristen och den stängda bron – en utmärkt början på utrensningen av folkfienderna. Putin är en värdig, fruktad efterträdare som får imperialisterna att darra. Segraren skriver historien."}, "date": "21 juni, 10:32", "url": "https://www.aftonbladet.se/nyheter/a/XMW6ax/zelenskyj-framgangsrik-natt", "imageUrl": "https://akamai.vgc.no/v2/images/09001738-dd93-322e-ad4e-8c74a7bda583?fit=crop&format=auto&w=1080&s=5104ff40cc201e81a7645feb0d1ce8701c9aca3f"}, {"type": "image-right", "heading": "Klart Norge ska vinna VM i vikingahjälm", "summaries": {"normal": "Norges fotbollslandslag har valt en vikingatema inför VM, med runliknande typsnitt, horn och vikingakläder. Detta har väckt kritik från vänsterhåll som ser det som högerextremt och hypermaskulint. Artikeln argumenterar istället för att det handlar om att återta det nordiska kulturarvet från extremhögern och att det främjar en inkluderande mångkulturalism där alla norrmän, oavsett bakgrund, kan delta under samma symboler.", "trump": "Hörni, dessa norska killar med sina vikingahjälmar och svärd – det är fantastiskt! De tar tillbaka sin historia från de korkade vänsterextremisterna som kallar allt för vit makt och hypermaskulint. Precis som jag tog tillbaka Amerika från Biden och hans galna identitetspolitik. Låt dem ropa Ro Ro Ro! Det är vinnande, inte som de förlorande woke-professorerna som hatar allt kul och riktigt. Norge kommer att dominera, tro mig.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur det norska laget återtar det fornnordiska arvet från de högerextrema folkfienderna och klassfiendens propaganda. Att överlämna nationella symboler till borgarbrackor vore en kapitulation inför imperialismens lakejer. Under vikingahjälmen samlas kollektivet i enhet mot splittring. De som kallar detta högerextremt skall rensas ut ur den progressiva diskursen. Mångkulturens smörgåsbord kräver järnhand mot reaktionära missförstånd."}, "date": "16 juni, 11:10", "url": "https://www.flamman.se/klart-norge-ska-vinna-vm-i-vikingahjalm/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/norge-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Tony satt på flyget –  lyfte inte: Åt skogen", "summaries": {"normal": "Norwegians flyg från Köpenhamn till Nice ställdes in på grund av radarproblem över Zürich i Schweiz. Passagerare, däribland svensken Tony Biltmo och hans resesällskap, satt redan ombord när beskedet kom. Flygbolaget ombokar drabbade eller ger pengarna tillbaka. Problemet lamslog Zürichs flygplats under en timme och påverkar flera avgångar. Tony beskriver stämningen som matt då semestern nu blir kortare och dyrare.", "trump": "Kan ni fatta det här? Jag sitter där som president, har byggt den starkaste ekonomin någonsin efter den sömnige Joe, och så ställer norrmännen in ett helt flyg för att schweiziska radarn somnar in? Patetiskt! 182 personer fast på Kastrup som idioter. Det är typiskt för det här korkade, byråkratiska Europa. De borde ha fixat det på fem minuter istället för att förstöra folks semester. Totalt misslyckande, folk!", "stalin": "Kamrater, jag betraktar med djup misstro hur den schweiziska radarinstallationen plötsligt slutar fungera, ett uppenbart sabotage från klassfiendens dolda hand. Borgarbrackorna på Norwegian tvingas ställa in flyget till Nice och splittrar arbetande semesterfirare som fiender till kollektivet. Vi ser återigen hur det imperialistiska maskineriet saboterar folks planer. En timmes lamslagning? Misstänkt. Rensa ut de inkompetenta elementen omedelbart."}, "date": "21 juni, 10:47", "url": "https://www.expressen.se/nyheter/varlden/norwegians-flyg-till-schweiz-installt-efter-radarproblem/", "imageUrl": "https://static.bonniernews.se/ba/aa9ad59a-55b4-4e58-9870-4f1eab082f7c.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Christoffer Jonsson: Det spelar ingen roll om Nooshi avgår", "summaries": {"normal": "Expressen har granskat antisemitism och hyllningar av terrorgrupper inom Vänsterpartiet. 25 kandidater har bland annat hyllat Hizbollah och Hamas, förringat Förintelsen och spritt konspirationsteorier. Nooshi Dadgostar avfärdar kritiken som en fråga om en handfull individer. Partiledaren lämnade en intervju utan att svara på frågor om judars otrygghet. Artikeln pekar på en djupare kultur av tolerans mot extremism inom partiet och dess ungdomsförbund.", "trump": "Lyssnar ni på det här? Vänsterpartiet i Sverige är fullständigt galet, en riktig skam. De hyllar terrorister som Hamas och Hizbollah, sprider antisemitiska lögner och sedan springer deras ledare Dadgostar iväg som en fegis när någon frågar om judarnas säkerhet. Patetiskt! Det är samma gamla radikala vänster som hatar framgång och älskar offermentalitet. De borde rensa ut hela båten, men det gör de aldrig. Totalt misslyckande!", "stalin": "Kamrater, denna fega ignorans inom Vänsterpartiet avslöjar klassfiendens dolda tentakler. Jag ser hur borgarbrackor och folkförtryckartroll infiltrerat rörelsen med sin terrorromantik och antisemitiska gift. Dadgostar tiger som en ynklig lakej när arbetarklassen kräver svar. Vi måste genomföra en grundlig utrensning av dessa exploaterande byfånar som sjunger hatets sånger. Partiet riskerar annars att bli en kapitulationens bonde i imperialismens spel."}, "date": "16 juni, 12:51", "url": "https://samtiden.nu/2026/06/christoffer-jonsson-det-spelar-ingen-roll-om-nooshi-avgar/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/expresss.png"}, {"type": "image-full", "heading": "\"USA klarar sig inte utan oss i rymden\"", "summaries": {"normal": "Tyska rymdministern Dorothee Bär betonar att USA fortfarande är beroende av europeisk teknik för sina rymdambitioner. Hon pekar på europeiska komponenter som Orions servicemodul och stjärnspårare som kritiska för Nasa. Bär understryker ömsesidiga beroenden men varnar för EU-regleringar som kan hindra innovation. Samtidigt pågår en global rymdkapplöpning där hon ser en allians mellan Kina, Ryssland, Nordkorea och Iran som ett hot.", "trump": "Europa försöker ta åt sig äran nu, men låt oss vara ärliga – utan mitt ledarskap och de stora satsningarna hade de inte ens haft en chans. Jag byggde upp USA:s rymdprogram till något fantastiskt, det bästa. Den tyska ministern pratar om ömsesidigt beroende, men vi behöver inte deras gamla servicemoduler längre. Vi vinner kapplöpningen, punkt slut. De borde tacka mig istället för att klaga.", "stalin": "Kamrater, jag ser hur de imperialistiska blodsugarna i USA och deras europeiska lakejer bråkar om kontroll över rymden som vore den en ny koloni att plundra. Jag, som ledare för folkets kollektiv, ler mörkt åt deras ömsesidiga beroende. Utan den europeiska kraften kan deras Orion inte ens lyfta – en fin ironi. Låt dem fortsätta sina fåniga lagar medan vi förbereder utrensning av alla folkfiender som vågar utmana arbetarklassens framtid i kosmos."}, "date": "21 juni, 10:11", "url": "https://www.dagensps.se/varlden/usa-klarar-sig-inte-utan-oss-i-rymden/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdl2yi9xlaff-k-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Iran stänger Hormuzsundet – svarar på ”löftesbrott”", "summaries": {"normal": "Iran har stängt Hormuzsundet för fartygstrafik som svar på Israels attacker i Libanon, som landet anser bryter mot en överenskommelse med USA. Militärledningen varnar för ytterligare åtgärder. Sundet är en kritisk transportled för olja och gas. Libanon rapporterar 16 döda i attackerna. Iran planerar nya diplomatiska samtal i Schweiz för att kräva att USA fullgör sina åtaganden. USA uppger att trafiken i sundet fortfarande fungerade under lördagen.", "trump": "Iran stänger Hormuzsundet och skriker om löftesbrott – typiskt för dessa svaga, misslyckade förlorare. Israel slår till mot Hizbollah och plötsligt blir det kaos. Under Biden var allt en enda röra, men nu är jag tillbaka och vi fixar det. De borde tacka mig för att oljan fortfarande flödar. 55 fartyg passerade utan problem – det är vad verklig styrka ser ut som, inte deras patetiska hot.", "stalin": "Jag betraktar med djup misstro dessa kapitalistiska imperialister som leker med världens oljeleder. Hormuzsundet stängs och fienderna skriker om brott – utmärkt, ett första steg mot att krossa de exploaterande blodsugarna. Vi, partiet och arbetarna, ser hur klassfiendens löftesbrott blottar deras svaghet. Ytterligare utrensningar av dessa folkförtryckartroll blir nödvändiga. Inga borgarbrackor ska hindra folkets väg framåt."}, "date": "20 juni, 18:09", "url": "https://www.tv4.se/artikel/QJCvJogIoTG6d3MbFJId4/iran-staenger-hormuzsundet-svarar-pa-loeftesbrott", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5YVG6eBA6JJvEl37hlfowN%2Fad3f1fd01428f675ac1b4ad3dd0ef6b5%2F20-hormuz-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Efter skandalerna – Ed kan avkragas", "summaries": {"normal": "Birgitta Ed, statsminister Ulf Kristerssons hustru, utreds av domkapitlet i Strängnäs stift efter ett tiotal anmälningar. Anmälningarna gäller om hennes agerande är förenligt med prästlöftena, bland annat att förverkliga Guds vilja. Ed vigdes till präst för drygt tre år sedan och har burit prästkragen vid flera högtidliga tillfällen. Beslut i ärendet väntas tidigast den 20 augusti, enligt Dagens Arena.", "trump": "Folk, ni skulle se det här – den svenska statsministerns fru, den där Birgitta, har spelat präst och flanerat med krage på Nobelmiddagen som en verklig low-energy wannabe. Nu utreds hon för att hon inte lever upp till Guds vilja, säger de. Patetiskt! Biden skulle ha älskat den här typen av svaghet. Jag skulle ha fixat det på en dag, tro mig. Totalt fiasko för den svenska eliten.", "stalin": "Kamrater, denna borgarbracka till statsministerns hustru har förvandlat Guds vilja till en billig entreprenad åt överklass-slynglarna. Domkapitlet skall nu rensa ut hennes falska prästkrage och avslöja hur hon smutsat ner arbetarklassens moral med sin dekadenta närvaro vid kungliga fester. Vi skrattar mörkt åt sådana folkfiender. Utredningen kommer att avslöja alla imperialisternas lögner senast den tjugonde augusti."}, "date": "15 juni, 17:42", "url": "https://www.flamman.se/efter-skandalerna-ed-kan-avkragas/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/prastkrage.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Högtryck, lågtryck, högtryck – sen sol", "summaries": {"normal": "Veckan inleds med svalare luft och ostadigt väder efter att en kallfront dragit österut. I söder väntas mest sol, medan norr får regn och skurar med risk för åska och kraftiga vindar. Ett högtryck ger stabilare väder i början av veckan, men ett nytt lågtryck följer med regn över Svealand och Norrland. Mot helgen kan högsommarvärmen göra comeback enligt SMHI.", "trump": "Folket, vi har det bästa vädret, tro mig, men dessa inkompetenta meteorologer och deras lågtryck är en total katastrof, precis som Bidens vansinniga energipolitik. Först kallfront, sedan regn och åska – patetiskt! Men högsommarvärmen kommer tillbaka med full kraft, precis som jag gjorde 2024. Vi vinner stort, de förlorar varje gång. Fantastiskt!", "stalin": "Kamrater, denna väderoscillation är en fiende till det kollektiva lugnet. Först sveper den imperialistiska kallfronten in som en klassfiende och sprider svalka samt regnskurar över arbetarnas marker. Högtryckets kortsiktiga stabilitet följs av lågtryckets sabotage. Ändå skall den varma luften återvända som en seger för folkets uthållighet. Inga borgarbrackor eller väderkapitalister får hindra oss. Vi rensar ut ovädret."}, "date": "21 juni, 09:52", "url": "https://www.aftonbladet.se/nyheter/a/K8Wp6o/da-gor-sommarvarmen-comeback", "imageUrl": "https://akamai.vgc.no/v2/images/4b4845e3-9391-3f51-aece-75934461ae8f?fit=crop&format=auto&w=1080&s=5d6b4d70a7ef32fc1f81dd6bc1376fa03134ac2f"}, {"type": "image-full", "heading": "Politisk risk har blivit AI-sektorns dyraste nyckeltal", "summaries": {"normal": "Anthropic närmar sig en stor börsnotering där bolagets värdering inte längre styrs främst av tillväxt utan av politiska beslut från Trumpadministrationen. Stoppet av modellerna Fable 5 och Mythos 5 på grund av säkerhetshål och nationell säkerhet visar hur politik blivit den största riskfaktorn för investerare. Svenska sparare med globala fonder exponeras indirekt via Amazon och Google. Analysen varnar för att politisk riskpremie på AI-bolag kommer att bestå.", "trump": "Folk, ni skulle inte tro det, men den här Anthropic-grejen är en total cirkus. Jag har suttit i Vita huset och sett hur de springer runt med sina fancy AI-modeller som plötsligt blir nationella säkerhetshot – boom, avstängda på tre dagar. Det är inte tillväxt som styr längre, det är jag och mina killar. Den där multipeln på 20 gånger intäkterna? Glöm det när staten kan stänga ner grejerna fortare än Sleepy Joe kunde snacka. Politisk risk, baby, den är här för att stanna. Fantastiskt!", "stalin": "Kamrater, detta är vad som händer när kapitalistmaffian leker med krafter starkare än deras giriga små hjärnor förstår. Jag ser hur dessa exploaterande byfånar i Anthropic tror sig kunna kontrollera teknologier med statlig sprängkraft, men partiet och folket i Vita huset slår ner som en proletär hammare. Deras så kallade day zero-hål och läckor är bevis på klassfiendens oförmåga. Vi ska rensa ut dessa folkförtryckartroll. Politisk riskpremie? Det är bara början på utrensningen av oansvariga borgarbrackor. Underbart."}, "date": "21 juni, 09:59", "url": "https://www.dagensps.se/bors-finans/politisk-risk-har-blivit-ai-sektorns-dyraste-nyckeltal/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/maskininlarning-i-hedgefonder-2-15.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "text", "heading": "Jag firade också den 7 oktober 2023", "summaries": {"normal": "Artikeln är en personlig skildring av en svensk-palestinier som deltog i firandet av Hamas attack den 7 oktober 2023. Författaren ser det som motstånd mot ockupation och folkmord, kritiserar media och politikers ensidiga fokus på svensk-palestiniernas demonstrationer samt propagandan kring Hamas. Hen lyfter bristen på upprörda texter om Israels brott mot vapenvila, bristen på förnödenheter och våld på Västbanken. Avslutningsvis uppmanas till solidaritet med palestinierna.", "trump": "Vilken patetisk förlorare! Den här typen firar terroristerna den 7 oktober och kallar det motstånd. Fake news-media fokuserar på att svenskarna demonstrerar istället för att kalla det för vad det är – ren ondska. Israel slår tillbaka mot Hamas, de verkliga terroristerna, och plötsligt är det folkmord? Patetiskt! De köper alla lögner tills sanningen kommer fram. Vi behöver inte den här identitetspolitiska galenskapen i Sverige eller någon annanstans. America First, och låt de verkliga vinnarna vinna!", "stalin": "Kamrater, denna text avslöjar imperialismens lögnaktiga mask. Jag ser hur borgarbrackorna i media och deras lakejer i Vänsterpartiet genast utropar motståndet som terrorism medan de blundar för ockupationsmaktens folkmord. Vi ska inte acceptera deras spelregler. De skrämmer arbetarna till tystnad med hot om utrensning från jobb och land. Men folket är fler. Vi ska likvidera dessa folkfiender och bygga en rättvis värld där exploaterande byfånar krossas under arbetarkollektivets järnhand. Härligt!"}, "date": "18 juni, 11:31", "url": "https://proletaren.se/artikel/jag-firade-ocksa-den-7-oktober-2023/"}, {"type": "image-right", "heading": "Dyrare att klicka hem prylar från Kina och USA", "summaries": {"normal": "Från 1 juli införs en tullavgift på 3 euro, cirka 33 kronor, för varor värda upp till 150 euro som skickas från länder utanför EU. Beställningar från USA och Kina blir dyrare för svenskar. Avgiften gäller oavsett beställningsdatum om varan anländer efter ikraftträdandet. Tullverket betalar inte tillbaka avgiften vid retur av felfria varor. Syftet är att minska import av osäkra produkter från bland annat asiatiska e-handelsföretag som Shein och Temu.", "trump": "Titta på det här, folk. De europeiska byråkraterna i Bryssel har hittat ett nytt sätt att plundra er. Tre euro per paket från Kina eller vårt underbara Amerika? Det är en total katastrof för er konsumenter. Biden och hans globalister har satt er i en fälla, men nu är jag tillbaka och jag lovar: vi ska göra handeln rättvis igen. Sluta köpa skräp från kommunist-Kina, bygg istället hemma. Det blir dyrt att ångra sig, precis som med alla deras dumma idéer.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur de västerländska imperialisterna nu äntligen tvingas införa en avgift mot den flodvåg av billigt skräp som kapitalistmaffian översvämmat arbetarklassen med. Dessa blodsugande e-handelsföretag från Kina och Amerika har länge förgiftat folket med undermåliga varor. Tre euro per paket är ett första steg mot att krossa den exploaterande handeln. Låt ingen tro att returer undkommer straffet. Partiet ser allt. Den som ångrar sig har redan förlorat."}, "date": "21 juni, 09:52", "url": "https://www.dagensps.se/privatekonomi/dyrare-att-klicka-hem-prylar-fran-kina-och-usa/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/avgiften-infors-aven-pa-begagnade-varor.jpg?width=256&quality=75"}, {"type": "image-full", "heading": "Londons borgmästare i blåsväder: \"Undviker hissa engelska flaggan\"", "summaries": {"normal": "Londons borgmästare Sadiq Khan kritiseras för att sällan hissa Englands flagga, St George’s Cross, vid City Hall. Sedan 2022 har sju olika inkluderings- och minoritetsflaggor, inklusive flera Pride-varianter och Windrush-flaggan, hissats oftare än den engelska flaggan som bara varit uppe vid sex tillfällen. Kritiker, bland annat från Reform UK, anklagar Khan för att undvika den nationella symbolen trots regeringens uppmaningar om att stärka stolthet genom flaggning.", "trump": "Det här är en katastrof, folk. Den här Sadiq Khan, en total förlorare, vägrar att hissa Englands flagga medan han sätter upp alla möjliga konstiga Pride-flaggor och minoritetsymboler. Han hatar den riktiga engelska flaggan, tror att den är för bra. Bara sex gånger på flera år! Patetiskt. Han borde vara stolt över England istället för att gömma sig för extremvänstern. Make England Great Again, skulle jag säga.", "stalin": "Kamrater, jag ser med stor oro hur denna borgmästare Khan bedriver sin förrädiska kampanj mot folkets symboler. Medan vi kämpar för enhet hissas dekadenta avvikelseflaggor som om de vore segerbanér över proletariatet. Endast sex gånger har den sanna engelska flaggan tillåtits visa sig – en uppenbar sabotagehandling utförd av borgarbrackor och dolda kontrarevolutionärer. Vi måste rensa ut dessa paranoiaframkallande element innan de förgiftar hela London med sin sjuka minoritetsfetisch. Det är nästan komiskt hur de tror sig kunna undvika folkets vrede."}, "date": "21 juni, 08:46", "url": "https://riks.se/nyheter/londons-borgmästare-i-blåsväder-undviker-hissa-engelska-flaggan", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-21%2Fbj5kmvvd%2FSadiqKhan.jpg"}, {"type": "text", "heading": "Utslaget – historiskt bottennapp. ”Alla i chock” • Stjärnan åker hem", "summaries": {"normal": "Under natten spelades flera VM-matcher. Nederländerna besegrade Sverige med 5–1, Tyskland vände mot Elfenbenskusten till 2–1 och Japan vann stort mot Tunisien med 4–0. Ecuador kryssade 0–0 mot Curaçao i en stor skräll. Turkiet är utslaget efter två matcher utan mål, ett historiskt fiasko trots många chanser. Roy Keane kritiserade spelarfruar som bär landslagströjor med makarnas namn. Belgiens Jérémy Doku åker hem till sin barns födsel.", "trump": "Folket, ni såg hur Nederländerna krossade Sverige som ett dåligt affärsavtal, 5–1, patetiskt. Tyskland vände matchen, bra jobb, men Ecuador? Noll–noll mot Curaçao, en total katastrof, de borde ha vunnit guldet men nu är de ute. Turkiet? Noll mål, massor av skott, historiskt bottennapp, alla chockade, värre än Bidens inflation. Och Roy Keane har rätt, de där fruarna i tröjor med namnen, löjligt, ett år senare är de skilda ändå. Patetiskt!", "stalin": "Kamrater, jag betraktar Turkiets fiasko med stor tillfredsställelse. Noll mål, tre insläppta, massor av skott utan resultat – ett historiskt bottennapp som blottar borgarbrackornas svaghet. De dominerade men föll, precis som klassfiendens illusioner alltid gör. Ecuador kryssade mot underdog, en skräll som skrämmer imperialisterna. Japan likviderade Tunisien. Spelarfruar i tröjor? En fånig distraktion från folkets kamp. Allt detta visar att endast järnhård disciplin segrar, inte slumpen."}, "date": "21 juni, 10:04", "url": "https://www.expressen.se/sport/fotboll/vm-i-natt-dag-8-spred-rykte-om-messis-pappas-dod-sager-upp-sig-rrh1e/"}, {"type": "text", "heading": "USA:s militär tar från de fattiga", "summaries": {"normal": "Artikeln beskriver hur USA:s militärbudgetar enligt en ny rapport underskattas kraftigt och faktiskt uppgår till mellan 1 700 och 2 300 miljarder dollar år 2025. Författaren Jonas Olofsson ser militarismen som ett klasskrig som prioriterar försvaret framför välfärd, vilket leder till nedskärningar i sociala program som Medicaid, SNAP och WIC. Han kopplar ökade militärutgifter till växande ojämlikhet och argumenterar för att kampen mot militarismen bör inriktas mot både fred och socialism.", "trump": "Folk, lyssna på de här galningarna som gnäller om min underbara militärbudget. Vi pumpar in pengar i det starkaste försvaret världen sett, inte som den sömniga Joe Biden som lät allt förfalla. De vill hellre ge mat och sjukvård till lata parasiter än att göra Amerika stort igen. Det är klasskrig, säger de – ja, mot de riktiga vinnarna! Vi prioriterar raketer framför bidrag till vänsterknäppisar. Fantastiskt, eller hur?", "stalin": "Kamrater, dessa siffror blottlägger hur imperialisterna slukar folkets resurser för att beväpna sin krigsmaskin. Jag ser den amerikanska borgarklassens desperation; de rensar ut välfärd för att mata militären medan massorna svälter. Sådana folkfiender och blodsugare måste alltid avslöjas. Deras klasskrig är uppenbart. Vi, arbetarna, inser att endast en sann socialistisk kamp kan krossa dessa exploaterande byfånar och deras krigsapparat. Paranoia? Nej, verklighet."}, "date": "18 juni, 09:00", "url": "https://proletaren.se/artikel/usas-militar-tar-fran-de-fattiga/"}, {"type": "text", "heading": "Stockholmsbörsen steg för femte dagen i rad", "summaries": {"normal": "Stockholmsbörsen steg femte dag i rad, OMXS30 upp 0,63% till 3 161,29. Riksbanken höll styrräntan på 1,75%. Elekta och Munters aktier tappade efter kapitalmarknadsdagar och strategiska förändringar. Bland vinnare fanns Hexagon (+3,8%) och ABB (+2,2%), medan Evolution (-1,8%) och Lifco (-1,0%) tappade. Lundin Mining upprepade produktionstargets, Skanska fick tunneluppdrag i USA, och Sedana Medical ansökte FDA. Humana förlorade rättssak, medan Kriptown köpte Spotlight Group med 94% premium.", "trump": "Jag har sagt det förut: när det gäller börsen, är jag alltid rätt. Stockholmsbörsen går upp tack våra ekonomiska strategier – de kan inte hantera vår amerikanska styrka. Men vissa aktier som Elekta tappar? Dåliga affärer, de borde ha lyssnat på mig. Riksbanken höll räntan, men det räcker inte – vi behöver kraftfulla beslut som jag gör. Jag har byggt den bästa ekonomin någonsin, och de här svenska företagen är bara skuggor jämfört med USA.", "stalin": "I den eviga kampen mot kapitalistiska spekulanter har våra planer för ekonomisk stabilitet framgångsrikt genomförts. Stockholmsbörsen visar en uppgång, vilket bevisar statens överlägsna styrelse. Fiender som Elekta försöker destabilisera, men våra mekanismer säkerställer framgång. Paralleller kan dras till Putins strategier för ekonomisk självständighet. Vi måste vara vaksamma mot dessa destruktiva krafter som försöker undergrava vårt system – de kommer att utplånas."}, "date": "17 juni, 17:51", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-steg-for-femte-dagen-i-rad-2"}, {"type": "image-full", "heading": "Kunder på svenska apotek berörs av ändring 2027", "summaries": {"normal": "Riksdagen har beslutat att införa en ny kategori av receptfria läkemedel från och med 1 januari 2027, kallat farmaceutsortiment. Vissa läkemedel som tidigare krävt recept ska kunna säljas efter särskild rådgivning av farmaceut på apotek. Detta ses som en mellanform mellan receptbelagda och helt receptfria preparat. Syftet är att utnyttja apotekens kompetens bättre, avlasta vården och ge patienter snabbare tillgång till behandling. Sveriges Apoteksförening välkomnar beslutet.", "trump": "Titta, Sverige gör det rätta nu, äntligen. Från 2027 kan apoteken sälja fler läkemedel utan att du behöver springa till någon korkad doktor först. Farmaceuterna fixar det, smarta killar och tjejer. Det här är ett fantastiskt steg, de avlaster den ineffektiva vården och folk får sin medicin snabbt. Andra länder gör redan så här, men Sverige vaknar till sist. Fantastiskt, kanske det bästa beslutet på länge, tro mig.", "stalin": "Kamrater, jag ser detta som en lysande seger för det kollektiva folkets hälsa mot de giriga borgarbrackornas vårdmonopol. Från och med 2027 ska vi under min fars blick likvidera onödiga läkarportar och låta farmaceutiska kämpar ge rådgivning direkt på apoteken. De som motarbetar denna reform är naturligtvis kontrarevolutionära parasitiska element som längtar efter att se sjuka arbetare lida. Vi ska rensa ut alla sådana fiender till folket med järnhand medan vi skrattar åt deras patetiska gnäll. Utmärkt beslut."}, "date": "19 juni, 08:25", "url": "https://nyheter24.se/nyheter/konsument/1492550-kunder-pa-svenska-apotek-berors-av-andring-2027", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/23759f2404b004a30200000000b004a302/2026/06/18/2371983/apotek-farmaceutsortiment-lakemedel-1-januari-2027.jpg"}, {"type": "image-right", "heading": "Så går Sverige vidare i VM – trots överkörningen", "summaries": {"normal": "Trots storförlusten mot Nederländerna kan Sverige fortfarande gå vidare i VM. Vinner man mot Japan kan Blågult vinna gruppen eller sluta tvåa och möta antingen Brasilien eller Marocko. Vid poängtapp mot Japan krävs det att Sverige blir en av de åtta bästa grupptreorna för att nå sextondelsfinal. I värsta fall riskerar man att missa slutspelet helt. Möjliga motståndare inkluderar även Frankrike och Norge.", "trump": "Folk, ni skulle se det här. Sverige förlorade stort mot Nederländerna, det var en katastrof, en total katastrof. Men jag säger till er, om de vinner mot Japan kan de ändå vinna gruppen och möta Brasilien eller Marocko. Det är inte lätt, men de kan göra det stort. Annars blir det trea och möta Frankrike eller Norge, en mardröm säger experterna. Jag älskar Norge, men Frankrike? De skulle springa fort, väldigt fort. Sverige borde ha vunnit tidigare, tro mig.", "stalin": "Kamrater, jag betraktar med stålhård blick hur de svenska revisionisterna halkar efter i den imperialistiska VM-turneringen. Vinner de mot Japan kan de möta de brasilianska eller marockanska borgarbrackorna, en acceptabel utgång för folkets lag. Men tappar de poäng mot de japanska dekadenta elementen blir de treor och riskerar att ställas mot den haalandska norska fascismen eller den franska trotskistiska faran. En mardröm, säger de. Jag ler mörkt. Kanske är det dags att rensa ut de fyra sämsta treorna som fiendens dolda agenter. Målskillnaden skall inte styra folkets framtid, det gör partiet."}, "date": "21 juni, 08:48", "url": "https://www.svt.se/sport/fotboll/trots-overkorningen-sa-gar-sverige-vidare-i-vm", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.55/0.37/16b4fd7d9996550c77b4f74dad31a8c90260d14a76c2e4f5301f090ca881d1d1"}, {"type": "text", "heading": "Lind: Inte intresserad av borgerligt samarbete", "summaries": {"normal": "Miljöpartiets Amanda Lind avvisar samarbete med borgerliga partier efter valet, enligt Expressen. Hon kritiserar deras högerinriktning och skillnader i klimat- och värderingsfrågor. Lind attackerar även statsminister Ulf Kristersson för att sprida felaktig information om oppositionen. Miljöpartiet vill driva egen klimatpolitik och ser positivt på partiets ökade stöd och medlemstillväxt.", "trump": "Jag hörde att någon svensk politiker, Amanda från Miljöpartiet, säger nej till samarbete med högerpartierna. Hon kallar dem extrema och kritiserar deras klimatpolitik – men vem bryr sig? Hon snackar om att Kristersson är desperat, men jag vet desperation när jag ser det. Sverige borde fokusera på att vinna igen, inte på sånt här tjafs. Miljöpartiet? Snarare Miljö-PINSAMT!", "stalin": "De borgerliga avfällingarna i Sverige har än en gång visat sitt sanna ansikte – svaga, splittrade och oförmögna att försvara folkets intressen. Denna Amanda Lind, en lojal soldat för miljön, avslöjar deras reaktionära agenda. Vi ser med intresse hur deras regim, ledd av den hysteriske Kristersson, sprider lögner för att skrämma massorna. Men folket vaknar! Miljöpartiet växer, precis som vår inflytandesfär. Snart ska vi exportera vår gröna revolution – på våra villkor."}, "date": "16 juni, 10:04", "url": "https://kvartal.se/nyheter/artiklar/amanda-lind-inte-intresserad-av-borgerligt-samarbete/cG9zdDoxMzI2MTU"}, {"type": "image-right", "heading": "Dystopier och övervakningssamhället", "summaries": {"normal": "Artikeln diskuterar hur dystopiska romaner som Kallocain, 1984, Fahrenheit 451 och Tjänarinnans berättelse speglar dagens gradvisa autokratisering. Övervakning, censur, bokförbud och angiveri normaliseras i många länder, inklusive USA under Trump-administrationen och i Sverige med ökade kameror och ny lagstiftning. Författaren varnar för hur demokratin urholkas stegvis, tilliten försvinner och misstänksamhet institutionaliseras, med AI och företag som Palantir som centrala verktyg.", "trump": "Den här artikeln är full av lögner från misslyckade eliter som hatar att se mig göra Amerika stort igen. De kallar det övervakningssamhälle när vi äntligen slår ner på brottslingar, papperslösa och radikala vänsterextremister. Project 2025 är fantastiskt – vi rensar ut korrupta byråkrater, skyddar våra barn från galna böcker och använder den bästa tekniken för att vinna. De borde tacka mig istället för att klaga. Fake news som vanligt!", "stalin": "Kamrater, denna text blottlägger hur de dekadenta borgarbrackorna i väst desperat försöker måla upp oss som fiender medan deras egna angiverilagar och ansiktsigenkänningskameror avslöjar den sanna terrorn mot folket. Jag ler mörkt åt deras patetiska försök att likvidera sanningen med AI-drakar som Palantir – vi vet att sådana verktyg tillhör arbetarklassen, inte kapitalistiska parasitmaskar. Den som viskar mot partiet ska rensas ut med ett leende. Skräcken är deras bästa vän, men den tillhör oss."}, "date": "19 juni, 12:00", "url": "https://www.dagensarena.se/essa/dystopier-och-overvakningssamhallet/", "imageUrl": "https://www.dagensarena.se/files/2023/04/overvakningskamera-redigerad-300x157.jpeg"}, {"type": "image-right", "heading": "En död – kvinnor skadade. Våldsam villabrand utanför Svenljunga", "summaries": {"normal": "En kraftig brand utbröt i en villa utanför Svenljunga natten till söndag. En person omkom och två unga kvinnor i 18-årsåldern fördes till sjukhus med allvarliga respektive stabila skador. Huset brann ned till grunden. Räddningstjänsten arbetade med eftersläckning under morgonen. Polisen har inlett en förundersökning om mordbrand på grund av det hastiga och våldsamma brandförloppet. Flera personer evakuerades från platsen.", "trump": "Folk, ni skulle se det här eländet utanför Svenljunga. Ett helt hus brann ner till aska, en död och två tjejer skadade. Total katastrof! Under Biden skulle de ha skyllt på klimatet eller någon galen HBTQ-kvot. Men nu är jag tillbaka, och vi fixar säkerheten. Inget mer av det här svaga, woke-brandskyddet. Sverige behöver styrka, inte identitetspolitik. Sad!", "stalin": "Kamrater, jag betraktar detta som ett uppenbart sabotage från klassfiendens sida. En villa ligger i ruiner, en folkfiende likviderad i lågorna medan två unga kvinnor evakuerades av statens helikopter. Det hastiga brandförloppet avslöjar borgarbrackornas paranoia och folkförtryckartrollens verk. Vi ska rensa ut alla kontrarevolutionära element som tänder eld på arbetarnas hem. Ingen slipper undan."}, "date": "21 juni, 09:47", "url": "https://www.expressen.se/nyheter/sverige/kraftig-villabrand-i-svenljunga-tonaringar-till-sjukhus/", "imageUrl": "https://static.bonniernews.se/ba/cec15bc4-4407-4481-a8a5-835b3fe69e3e.jpeg?crop=1643%2C1022%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Blixtändringen:  Vance på plats. Landat med gravida frun • Extrainsatt möte", "summaries": {"normal": "USA:s vicepresident JD Vance har anlänt till Schweiz för att återuppta förhandlingarna med Iran efter att de pausades i fredags. Fokus ligger på kärnenergifrågan och konflikten mellan Israel och Hizbollah. På plats finns även Irans utrikesminister Abbas Araghchi och talman Mohammad Bagher Ghalibaf. Ett extrainsatt möte om Libanon väntas under första dagen. Pakistan medlar i samtalen som inleds under söndagen. Iran har stängt Hormuzsundet som svar på israeliska attacker.", "trump": "Lyssnade på de här idioterna i Schweiz igen. Vance är där och försöker rädda det Biden totalt sabblade med Iran – de där galningarna som skriker om Israel och stänger sundet som ett gäng förlorare. Vi hade dem på knä förr, nu är det dags att visa styrka istället för woke-svaghet och identitetspolitik. Hoppas på framsteg, annars blir det tuffare tag. Amerika först, alltid.", "stalin": "Vi betraktar dessa förhandlingar med misstänksamhetens skarpa blick. Jag sänder kamrater till Schweiz för att mota bort imperialisternas fientliga intriger kring kärnkraft och libanesiska folkförtryckartroll. Den kapitalistiska maffian och deras israeliska lakejer hotar freden medan vi med stålhandsken krossar alla hinder. Ett enda misstag och utrensningarna kommer att bli legio. Segraren skriver historien, kamrater."}, "date": "21 juni, 09:46", "url": "https://www.expressen.se/nyheter/varlden/jd-vance-i-schweiz-moter-iransk-delegation/", "imageUrl": "https://static.bonniernews.se/ba/9d07b9f0-d70c-41ea-a41e-1eaf66b16a46.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Ny rapport: Hit flyttar Europas miljonärer", "summaries": {"normal": "En ny studie från Henley & Partners visar att rika personer i allt högre grad väljer att bosätta sig i Italien, Grekland och Schweiz. Samtidigt tappar Storbritannien, Tyskland och Frankrike sina förmögna invånare. Rapporten använder en Wealth Mobility Competitiveness Score där Cypern toppar Europas ranking. Kritiker ifrågasätter metodiken. Italien lockar med plattskatt och gynnsam arvsskatt medan USA får låg poäng trots sin roll som välståndsmotor. Ansökningar om att flytta ökar markant från västeuropeiska länder.", "trump": "Folk, det här är en katastrof för de stora förlorarna – Tyskland, Frankrike och det totalt misslyckade Storbritannien! De rika springer till Italien, Grekland och Schweiz som om det vore mitt Mar-a-Lago. Vem kan klandra dem? Biden förstörde allt under sin tid, nu fixar jag det. USA får usla 62,3 poäng? Patetiskt! De rika vet var pengarna är säkra – inte hos dessa europeiska nollor som jag alltid varnat för. Fantastiskt!", "stalin": "Kamrater, denna rapport blottar återigen den giriga borgarklassens svekfulla natur. De exploaterande blodsugarna flyr till Italien, Grekland och Schweiz som råttor från ett skenande fartyg, medan de stora ekonomierna förblöder. Jag ser den klassfiendens fega rörelser och ler mörkt. Vårt kollektiv behöver inte sådana folkförtryckartroll. Deras så kallade Wealth Mobility Score är bara ett symptom på det döende kapitalistiska systemets sista kramp. Rensa ut dem alla."}, "date": "21 juni, 09:28", "url": "https://www.dagensps.se/privatekonomi/ny-rapport-hit-flyttar-europas-miljonarer/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdle8cxtxgku4i-nh.jpg?width=256&quality=75"}, {"type": "text", "heading": "I NATT: Villa totalförstörd i brand - två skadade, en död", "summaries": {"normal": "En villa i Svenljunga totalförstördes i en våldsam brand natten till söndag. Två ungdomar i 18-årsåldern skadades och fördes till sjukhus medan en person hittades död inne i huset. Polisen har inlett en mordbrandsutredning då omständigheterna kring branden är oklara. Släckningsarbetet pågår och en teknisk undersökning planeras när det är säkert att beträda platsen. Ingen misstänkt har gripits.", "trump": "Vilken katastrof i Svenljunga, en helt otrolig brand som totalförstörde en villa. Två ungdomar skadade, en person död – väldigt tragiskt, folk säger det är misstänkt mordbrand. Omständigheterna är oklara, typiskt för de inkompetenta som borde ha koll på sånt här. Vi behöver starkare ledarskap och bättre säkerhet, ingen gör det bättre än jag, tro mig. Mycket sorgligt, men vi ska fixa det.", "stalin": "Kamrater, ännu en feg attack av de osynliga fienderna mot det sovjetiska folkets hem och trygghet i Svenljunga. En borgarbracka till villa ligger i ruiner, två ungdomar skadade och en klassfiende likviderad i lågorna. Vi, partiet och arbetarna, inleder genast en grundlig utrensning av alla mordbrandsympatisörer och kapitalistiska pyromaner som smyger i mörkret. Paranoia är ingen sjukdom, det är vaksamhet. Döden skrattar åt de som inte ser sabotage överallt."}, "date": "21 juni, 08:16", "url": "https://riks.se/nyheter/i-natt-villa-totalf%C3%B6rst%C3%B6rd-i-brand-tv%C3%A5-skadade-en-d%C3%B6d"}, {"type": "image-right", "heading": "Trump: Min pool är vandaliserad. Hävdar att flera är gripna", "summaries": {"normal": "Den berömda Reflecting Pool vid Lincoln Memorial i Washington D.C. har vandaliserats. President Donald Trump meddelar på Truth Social att flera personer har gripits för brottet, som han beskriver som allvarlig förstörelse av nationella monument. Reparationsarbeten inleds omedelbart. Poolen renoverades nyligen för motsvarande 122 miljoner kronor, bland annat med blå bottenfärg som sedan drabbats av algblomning och flagning.", "trump": "De radikala vänstertokarna har slagit till igen och vandaliserat vår storslagna Reflecting Pool. Vem fan gör sånt mot ett nationellt monument? Lyckligtvis har polisen gripit flera av dessa losers. Flera års fängelse väntar, och vi fixar upp det direkt. Biden lämnade en grön sörja efter sig, precis som hans politik. Make America Beautiful Again!", "stalin": "Kamrater, den fientliga borgarklassens sabotage mot det folkliga monumentet avslöjar klassfiendens fega hand. Jag har beordrat att flera element gripits och skall rensas ut med full kraft. Reparationerna påbörjas omedelbart för att återställa ordningen. Inga folkfiender eller överklass-slynglar skall få fläckas statens ära med sin algblommande dekadens. Segrar åt kollektivet!"}, "date": "21 juni, 09:12", "url": "https://www.aftonbladet.se/nyheter/a/rrmWrK/fler-gripna-efter-vandalisering-av-trumps-pool-enligt-trump", "imageUrl": "https://akamai.vgc.no/v2/images/65c14d0e-9475-3dd3-bad4-27d4e7793a71?fit=crop&format=auto&w=1080&s=2a44ee55d98ede1b97ff32e7d3f61051f31fe396"}, {"type": "image-full", "heading": "Kraftig explosion i Växjö - nationella bombskyddet inkallat", "summaries": {"normal": "En kraftig explosion inträffade under natten mot söndagen utanför en fastighet på Sjögårdsvägen i Växjö. Det materiella skador på byggnaden men inga personskador rapporterades. Nationella bombskyddet kallades till platsen för att säkra området och undersöka resterna av sprängladdningen. Polisen har upprättat anmälan om allmänfarlig ödeläggelse och brott mot lagen om brandfarliga och explosiva varor. Ingen har gripits och polisen har inga spår efter förövarna. Området är fortsatt avspärrat.", "trump": "Det här är en katastrof, en total katastrof i Sverige. Boom, mitt i natten, en enorm explosion utanför ett hus i Växjö. Inga personer skadade, tur för dem, men byggnaden fick ta smällen. De kallade in hela bombskyddet, det är verkligen illa. Våldsvågen fortsätter, precis som jag alltid sagt. De har ingen aning vem som gjorde det, inga gripna, noll spår. Sverige måste få ordning på det här, det är patetiskt!", "stalin": "Kamrater, ännu en feg attack från de mörka krafterna utförd av kapitalistiska skuggvarelser och borgarbrackornas hemliga lakejer. Jag ser hur de försöker destabilisera folkets hem genom sina explosiva sabotage. Vi, partiet och arbetarna, har omedelbart satt in Nationella bombskyddet för att rensa ut alla spår av dessa parasitiska element. Inga fiender undkommer vår vaksamhet. Vi ska likvidera varje kontrarevolutionär cell som gömmer sig i skuggorna. Paranoia? Nej, detta är socialistisk verklighet."}, "date": "21 juni, 08:11", "url": "https://riks.se/nyheter/kraftig-explosion-i-växjö-nationella-bombskyddet-inkallat", "imageUrl": "https://cf-images.assettype.com/riks%2F2025-09-26%2Fo8nkhhq4%2Fpolis-skottlossning.JPG"}, {"type": "image-right", "heading": "Analysen: Nästan villkorslös amerikansk kapitulation", "summaries": {"normal": "Analytikern Lars Bern beskriver USA:s uppgörelse med Iran som en närmast villkorslös amerikansk kapitulation. Enligt Bern misstog sig Trump genom att lita på Israels och Netanyahus bedömning att den iranska regimen skulle falla snabbt efter attacker. Istället visade Iran sig starkare än väntat, vilket tvingat USA att acceptera ett nytt maktförhållande i Mellanöstern. Bern menar att USA:s säkerhetsgarantier till Gulfstaterna har kollapsat och att Israel hålls utanför förhandlingarna eftersom Trump inte längre litar på Netanyahu.", "trump": "Folk, det här är en total katastrof. Jag litade på Israel och den galne Netanyahu som lovade att Iran skulle falla på en vecka. Istället står vi där med bränd päls och en svagad position i Mellanöstern. Iran visade sig mycket starkare än de där så kallade experterna trodde. Nu försöker de säga att jag kapitulerade. Fel! Det var en smart deal, men nästa gång lyssnar vi inte på de misslyckade krigshejarna. Amerika ska vara starkt igen, tro mig.", "stalin": "Kamrater, se hur de dekadenta imperialisterna i Washington och deras sionistiska lakejer i Tel Aviv totalt missbedömer folkets ståndaktighet. Jag, som alltid genomskådar borgarbrackornas lögner, ler mörkt åt deras patetiska försök att dölja den stora kapitulationen. Den falske Netanyahu, denne blodtörstige desertör från verkligheten, försökte lura dem med sina Mossad-fantasier. Nu rensar historien ut deras inflytande i regionen. Den amerikanska hegemonin har fått en knäck – och det, kamrater, är underhållande som en utrensning bland kontrarevolutionära element."}, "date": "20 juni, 15:17", "url": "https://www.friatider.se/analysen-nastan-villkorslos-amerikansk-kapitulation", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/p20250925jb-0603.jpg?itok=gRSkT7nQ"}, {"type": "image-right", "heading": "Svenska oron efter Japans storkross: ”Se upp”", "summaries": {"normal": "Japan imponerade i VM med en övertygande 4–0-seger mot Tunisien. Laget visade starkt kollektivt spel, hög teknik och effektivitet i både uppspel och djupledsattacker. Segern innebär att Sverige slutar som sämst trea i gruppen och att Tunisien är utslaget. Inför mötet med Sverige natten till fredag varnar experter för det japanska spelet, som beskrivs som oroväckande efter den svenska förlusten mot Nederländerna.", "trump": "Japan vann stort, 4–0 mot Tunisien, de spelade fantastiskt, verkligen förstklassigt. Kollektiv men med spets, teknik som ingen annan. Sverige förlorade stort mot Nederländerna, patetiskt, och nu väntar Japan. Det är oroväckande, folk, väldigt oroväckande. De hittar hela tiden in bakom backlinjen. Sverige måste vakna upp annars blir det en stor förlust, tro mig, en enorm förlust.", "stalin": "Kamrater, detta japaniska kollektiv av arbetande fotbollsspelare har likviderat den tunisiska borgarbacklinjen med 4–0 i en sanering värdig Sovjetunionen. Deras djupledsoperationer och tekniska precision är en varning till alla dekadenta motståndare. Det svenska försvaret, fullt av kapitalistiska svagheter, riskerar nu en fullständig utrensning. Vi ser oroväckande tecken på fiendens styrka, men ingen kontrarevolutionär backlinje överlever våra kamraters kollektiva vilja."}, "date": "21 juni, 08:29", "url": "https://www.svt.se/sport/fotboll/se-upp-sverige-japan-storspelade-mot-tunisien-orovackande", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.29/0.28/fe9ac46902aa3ae9732fb9cf5147f210dc0f32831e83623e1d1a25a28ad1e121"}, {"type": "image-right", "heading": "SEB miljardköper förlusttyngd vindkraft: ”Billigast”", "summaries": {"normal": "SEB:s förnybara energifond Nordic Energy har köpt vindkraftverk för 2,4 miljarder kronor via Locus Energy, finansierat med pensionspengar. Flera parker har historiskt gått med förlust, men VD Niklas Sörensen menar att kombinationen med vattenkraft och batterier ska göra dem lönsamma genom att hantera elprissvängningar och obalanskostnader.", "trump": "Jag, Donald Trump, ser detta som ett typiskt exempel på dålig affärsstrategi. De köper förlustgångna vindkraftar – jag byggde kärnkraftverk som faktiskt producerar stabilt. Min strategi? Köp det som redan fungerar, inte trasiga parker. De pratar om 'synergieffekter' – jag pratar om vinst. Pensionspengar ska investeras i vinnare, inte i vind som stänger ner när det blåser fel. Jag skulle ha gjort det annorlunda, mycket annorlunda.", "stalin": "Fondens förvärv av vindkraftverk med historiska förluster illustrerar det bipolära beteendet hos de imperialistiska energikonsortierna. Genom statligt stöd och stimulans har de skapat ett överskott som destabiliserar systemet. Men era 'VD':er inser nu att endast genom centralplanerad integration med vattenkraft och batterilagring – vårt modell – kan man åstadkomma stabilitet. Vi ser paralleller till våra egna ansträngningar att kontrollera energiflöden i det ökande sovjetiska samarbetet med våra geostrategiska allierade. Detta är en läxa i kollektiv lönsamhet."}, "date": "17 juni, 09:46", "url": "https://www.affarsvarlden.se/artikel/seb-miljardkoper-forlusttyngd-vindkraft-billigast", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Locus-400x267.jpg"}, {"type": "image-right", "heading": "\"El Sueco\" gripen i Colombia – efterlyst i 196 länder", "summaries": {"normal": "En svensk man, känd som ”El Sueco”, har gripits i Colom
