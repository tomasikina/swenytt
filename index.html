te krossas väntar nya utrensningar av folkets fiender. Historien ler mörkt."}, "date": "9 september, 01:12", "url": "https://www.dagensarena.se/opinion/vi-har-en-mandatperiod-pa-oss", "imageUrl": "https://www.dagensarena.se/files/2026/09/tyska-valjare-300x157.jpeg"}, {"type": "image-full", "heading": "Åkesson svarar på Buschs utspel", "summaries": {"normal": "Jimmie Åkesson svarar Ebba Busch på X och slår fast att SD antingen sitter i regeringen eller går i opposition efter valet. Han varnar för andra partiers vänsterflörtande och pekar ut migrationspolitiken som en tydlig skiljelinje mellan SD och KD. Centerpartiets Elisabeth Thand Ringqvist välkomnar samtidigt att regeringsmakten inte ges bort till SD.", "trump": "Ebba Busch försöker sänka Jimmie Åkesson, men Jimmie slår tillbaka – starkt! De kallar det 'ministerposter', jag kallar det en katastrof till kohandel. Antingen regerar de, eller så drar de sig ur, precis som jag skulle gjort. Och Centerpartiet? Totala förlorare som jublar över svaghet! Fejk-regeringar överallt, men Sverige behöver en vinnare. Sorgligt!", "stalin": "Kamrat Åkesson klargör att partiet antingen regerar enväldigt eller går i opposition. Ett hälsosamt ställningstagande mot vacklande element! Särskilt avdelningen kring Centerpartiet visar prov på ideologisk vacklan som bör beivras omedelbart. Migrationen måste regleras med järnhand. Avvikelser från partilinjen kommer att granskas av centralkommittén."}, "date": "8 september, 15:56", "url": "https://kvartal.se/nyheter/artiklar/akesson-vansterflort-storsta-hotet-mot-tidoseger/cG9zdDoxODc0NTA", "imageUrl": "https://images.kvartal.se/2026/09/2e954ce3-splitr.webp"}, {"type": "image-right", "heading": "Premium Linjemontage: Kraftbolag mot börsen", "summaries": {"normal": "Kraftbolaget Linjemontage, som bygger och underhåller kraftinfrastruktur, planerar en börsnotering i slutet av september. Bolaget ägs av indiska Kalpataru och har haft en mycket stark tillväxt med ökad omsättning och lönsamhet. Ankarinvesterare som Tredje AP-fonden och Unionen är redo att köpa aktier för 290 miljoner kronor i samband med IPO:n.", "trump": "Kraftbolaget Linjemontage ska till börsen, och det är enormt, bara det bästa! De växer som aldrig förr med indiska ägare som förstår affärer. Svenska fackföreningen Unionen är med och köper in sig, otroligt nog. Det är ett vinnande koncept, helt enkelt fantastiskt, medan misslyckade förlorare bara tittar på från läktaren!", "stalin": "Kamrater, kraftbolaget Linjemontage förbereder sin börsnotering för att tjäna kapital, ett tydligt tecken på det dekadenta systemets mekanismer. Med en omsättning på miljarder och indiska intressen i kulisserna kräver staten att effektiviteten maximeras. Avvikelser från produktionsmålen kommer inte att tolereras, och femtedelar av vinsten ska fördelas efter partiets behag."}, "date": "9 september, 14:14", "url": "https://www.affarsvarlden.se/ipoguide/linjemontage-kraftbolag-mot-borsen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/09/Svensson-Linjemontage-200x133.jpg"}, {"type": "image-right", "heading": "Svea hovrätt: Inte grovt att spotta och slå kvinna medan man våldtar henne", "summaries": {"normal": "Svea hovrätt har ändrat en dom om grov våldtäkt. Trots att en man spottade, slog och drog en kvinna i håret under upprepade våldtäkter bedöms gärningen inte som grov. Mannens straff sänks från sex och ett halvt till fem och ett halvt års fängelse. Han ska även betala skadestånd till offren.", "trump": "Folk, ni kommer inte att tro det här. I Sverige låter de en idrottsman spotta, slå och våldta en kvinna utan att kalla det grovt. Domstolen säger att det inte når upp till deras fina krav. Patetiskt. Biden skulle ha älskat det här svaga systemet. Vi gör Amerika starkt igen, inte som dessa veklingar.", "stalin": "Kamrater, se hur dessa dekadenta rättsväsendets lakejer skyddar en våldsverkare. Jag betraktar med avsky hur de vägrar kalla upprepad våldtäkt med slag och spott för grovt brott. Sådana svaga domar är klassfiendens verk. Vi skulle ha rensat ut dessa förtryckande element med järnhand och folkets vrede."}, "date": "9 september, 16:53", "url": "https://riks.se/nyheter/svea-hovratt-inte-grovt-att-spotta-och-sla-kvinna-medan-man-valdtar-henne", "imageUrl": "https://admin.riks.se/uploads/medium_svea_hr_hero_523ce37f4d.jpg"}, {"type": "image-right", "heading": "Carl-Oskar Bohlin fortsätter kriget mot medierna – och SVT viker sig", "summaries": {"normal": "Carl-Oskar Bohlin (M) attackerade en SVT-reporter under en intervju om politiker som går till angrepp mot journalister. Han publicerade inspelningen själv och kritiserade reportaget. SVT valde att skjuta upp sändningen till efter valet. Ledaren kritiserar detta som en kapitulation och varnar för att antimediepopulism underminerar mediernas roll som informationskälla och maktgranskare.", "trump": "De här svenska mediadynorna och deras vänstervridna Public Service är ett skämt. Den stackars ministern Bohlin gör precis rätt när han krossar den falska reporterns agenda. SVT är fega som råttor och skjuter upp reportaget – typiskt för de riggade systemmedierna. De hatar folket och älskar bara sin egen elitära bubbla. Patetiskt!", "stalin": "Jag betraktar med förakt hur dessa dekadenta klassförrädare inom borgerliga medier kryper för makten. När en minister angriper en reporter och de sedan skjuter upp sändningen avslöjar de sin sanna natur som rädda lakejer. Vi ser tydligt hur folkets fiender försöker tysta sanningen. En sådan svaghet förtjänar utrensning ur den kollektiva medvetenheten."}, "date": "8 september, 16:13", "url": "https://www.etc.se/ledare/carl-oskar-bohlins-attack-mot-svt-aer-saa-grov", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260908130920_fcc6fd23-49e9-47b7-9921-4e8ad4a71e05.jpg"}, {"type": "image-right", "heading": "Takläggare togs av polis på kommunalt bygge", "summaries": {"normal": "Tre uzbekiska takläggare utan arbetstillstånd greps av polisen under en kommunal takrenovering i Södertälje. Telge Bostäder har skärpt sina kontroller efter händelsen. Huvudentreprenören DM Tak kritiseras för bristande uppsikt över underentreprenörer. Företaget hävdar att de blev lurade och har infört fler kontroller. Underentreprenören har avlägsnats från projektet.", "trump": "De här korkade svenska kommunbyråkraterna låter uzbekiska jobbpirater klättra runt på taken utan tillstånd. Patetiskt! DM Tak och Telge Bostäder borde ha vetat bättre än att lita på underentreprenörerna. Typiskt vänsterkaos där ingen tar ansvar. Vi skulle ha byggt murar runt byggena redan under Bidens katastrofår. Nu fixar jag det ordentligt.", "stalin": "Ännu en gång visar de profitthungriga klassförrädarna sitt sanna ansikte genom att smuggla in billig arbetskraft bakom ryggen på alla. Jag betraktar med djup förakt hur dessa dekadenta hyenor prioriterar vinst framför folkets intressen. Sådana element förtjänar att rensas ut med järnhand. Partiet och arbetarna kräver ständig vaksamhet mot dessa parasiter."}, "date": "9 september, 13:24", "url": "https://arbetet.se/2026/09/09/taklaggare-togs-av-polis-pa-kommunalt-bygge", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/08151144/taklaggare.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Analysen: S-seger redan \"helt säkrad\" av rekordröstande invandrare", "summaries": {"normal": "Förtidsröstningen i särskilt utsatta områden har ökat med 93 procent jämfört med förra valet. Tobias Hübinette slår fast att detta säkrar en seger för vänstersidan. Kritiker pekar på att den höga invandringen och utdelningen av medborgarskap under Tidöregeringen bidrar till förändrade väljarbaser. SD-toppen Richard Jomshof skyller utvecklingen på Socialdemokraterna.", "trump": "De här galna globalisterna har importerat miljontals röstmaskiner som nu vräker in sina röster mot de riktiga svenskarna. Massinvandring och passfabriken som till och med SD inte stoppade – totalt vansinne. Oppositionens seger är säkrad säger de, men vänta bara. Folket vaknar snart och sparkar ut de woke-vänstervriden som förstörde ert fina land.", "stalin": "Jag ser hur de dekadenta klassförrädarna fortsätter att översvämma nationen med främmande element för att säkra sin makt. Massinvandring som vapen mot arbetarklassen. Nu mobiliseras gettona och röstar bort de falska patrioterna. En tyst revolution mullrar. Kamrater, detta visar att fienderna aldrig vilar. Vi måste alltid vara vaksamma mot sådana parasiterande hyenor."}, "date": "9 september, 14:41", "url": "https://www.friatider.se/analysen-s-seger-redan-helt-sakrad-av-rekordrostande-invandrare", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-97_0.jpg"}, {"type": "image-right", "heading": "Oskarshamn har inte råd att blunda för integrationsproblemen", "summaries": {"normal": "Sverigedemokraterna i Oskarshamn kritiserar kommunledningen för att ha tackat nej till besök från regeringens samordnare för återvandring. Debattörerna menar att kommunen blundar för integrationsproblem som gängkriminalitet och parallellsamhällen. De anser att Oskarshamn måste våga diskutera återvandring som ett verktyg för ökad trygghet och uppmanar väljarna att rösta på SD i valet i september.", "trump": "Oskarshamn gör ett totalt misstag, det är bedrövligt! Kommunledningen vägrar träffa experter på återvandring. Veid och svagt! De blundar för gängkriminalitet och kaos, precis som radikala vänstern gör i USA. Jag känner till integration, tro mig. Om jag styrde Oskarshamn skulle vi rensa upp direkt, det skulle bli fantastiskt, och det snabbt!", "stalin": "Kamrater, den lokala partiledningen i Oskarshamn visar prov på ideologisk vacklan och sabotage mot folkets trygghet genom att vägra lyssna på statens samordnare. Att ignorera avvikelser som gängkriminalitet och uppror tolereras icke. Om dessa sabotörer inte självmant söker upplysning om återvandring, kommer statens järnhand att behöva uppfostra dem. Arbetet mot avvikande element måste skärpas omedelbart!"}, "date": "9 september, 16:06", "url": "https://samnytt.se/oskarshamn-har-inte-rad-att-blunda-for-integrationsproblemen", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/09140436/artikelhuvudbild-1-485.jpg"}, {"type": "image-right", "heading": "Ta kontroll över AI. Tekniksprånget ska komma svenskar till del, anser Ebba Busch", "summaries": {"normal": "Ebba Busch argumenterar för att Sverige måste styra AI-utvecklingen med både fart och tydlig riktning. Hon föreslår en AI-beredning, stresstester av statsbudgeten samt en människogaranti som säkerställer rätt till mänsklig kontakt. Vinster från tekniken ska ge mer tid åt vård, skola och människor snarare än enbart ökad produktivitet.", "trump": "Lyssnar ni på den här svenska energiministern? Hon vill ha både gas och broms på AI, typiskt svagt europeiskt snack. Vi i Amerika gör det stort och vinner, inte som de globalistiska teknikbolagen som styr era politiker. Sverige borde sluta vara förlorare och börja vinna med AI, men utan vänsterns galna kvoterkram och identitetspolitik som förstör allt.", "stalin": "Kamrater, denna dekadenta innovationshyena försöker maskera klassfiendens nya maskin som folkets vän. Jag ser hur de profitthungriga teknikparasiterna styr från Washington och Peking medan politiken sviker. Vi behöver utrensning av naiva experiment på barn och en järnhård beredning som skyddar arbetarna mot maskinernas förräderi. Riktning eller döden!"}, "date": "9 september, 15:54", "url": "https://www.di.se/debatt/ebba-busch-ta-kontroll-over-ai", "imageUrl": "https://static.bonniernews.se/ba/bb47600a-50c6-4a94-adcd-aed86cb25b50.jpeg?crop=6000%2C3000%2Cx0%2Cy500&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Ministern saboterar – och SVT viker sig", "summaries": {"normal": "Civilförsvarsminister Carl-Oskar Bohlin ifrågasatte SVT-repoter Kristina Lagerström och publicerade själv en egen inspelning av en intervju. Situationen ledde till omfattande kritik och en debatt om medietillit. Efteråt fattade SVT:s ledning det omdiskuterade beslutet att skjuta upp publiceringen av reportaget till efter valet, vilket väckte starka reaktioner kring public service agerande.", "trump": "Sveriges minister förstörde totalt en fake news-intervju med public service och sände allt själv på internet! Helt fantastiskt! Reportern såg helt skärrad ut när hon inte fick kontrollera narrativet. SVT är så svaga att de gömmer reportaget till efter valet. Om jag hade varit där hade jag stängt av deras mikrofoner direkt. Total seger för ministern!", "stalin": "Minister Bohlin har med järnhand avslöjat public service-kanalens ideologiska sabotage och publicerat sanningen direkt på internet utan byråkratiska omvägar. Att den skärrade journalisten Lagerström tvingades ge upp kontrollen är ett sundhetstecken. Att ledningen fega ur och skjuter upp sändningen till efter valet visar på svaghet. Statens fiender ska inte tillåtas styra informationsflödet."}, "date": "9 september, 17:52", "url": "https://www.aftonbladet.se/nyheter/kolumnister/a/GxX4PB/vilket-ansvar-har-bohlin-for-tilliten-till-journalistiken", "imageUrl": "https://akamai.vgc.no/v2/images/ae7e919d-be3a-3f3c-b6f5-7f0bbec4b420?fit=crop&format=auto&w=1080&s=ef66ee8d31529e72335314786a533e9086274a96"}, {"type": "image-right", "heading": "Truls Möregårdh vände – vidare i Macao efter rysare", "summaries": {"normal": "Truls Möregårdh vände ett 0–2-underläge mot Patrick Franziska i WTT-tävlingen i Macao och vann med 5–11, 8–11, 11–5, 11–9, 11–9. J-O Waldner hyllade vändningen och noterade att Möregårdh förbättrade både forehand och backhand. Svensken möter nästa gång antingen japanen Togami eller fransmannen Gauzy i åttondelsfinal på fredag.", "trump": "Vilken vändning, folk! Den där Möregårdh tog en riktig comeback mot den där tyska backhand-maskinen. Det såg ut som en Biden-debacle i början men han kämpade som en vinnare. Ingen woke-kvotering här, bara ren kraft. Fantastiskt. Jag älskar sådana fighters, inte som de svaga förlorarna vi hade under Sleepy Joe.", "stalin": "Kamrater, denna vändning visar att även dekadenta klassförrädare kan besegras genom okuvlig kampvilja. Möregårdh bröt den giriga hyenans grepp och vägrade ge vika. Vi ser här hur svaga motståndare likvideras när man vägrar kapitulera. Sådan styrka borde inspirera alla som kämpar mot imperialismens parasiterande krafter. Fortsätt kämpa!"}, "date": "9 september, 15:32", "url": "https://www.svt.se/sport/bordtennis/moregardh-vande-i-macao", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.37/0.48/b234fc8b83e029bc8f7f117385b2680592efe4a4866caea6e5af9e947e6691ec"}, {"type": "image-full", "heading": "L över spärren i ny Novusmätning – statistiskt säkerställt", "summaries": {"normal": "En Novusmätning visar att Liberalerna nu ligger statistiskt säkerställt över fyraprocentsspärren med 5,8 procent, en kraftig ökning från 1,9 procent i augusti. Partiledaren Simona Mohamsson varnar för att inte ta ut segern i förskott. Oppositionen leder blocken med 50,7 procent mot Tidöpartiernas 48,1. Endast Liberalernas uppgång är statistiskt säkerställd.", "trump": "Titta på de där Liberalerna, de har plötsligt exploderat till 5,8 procent! Från totala nollor till riktiga vinnare på några veckor. Fantastiskt! Men det är valdagen som räknas, precis som jag alltid säger. Den röda sidan försöker sno det hela, typiska förlorare. Simona gör ett stort jobb, men håll is i magen – ingen vill ha de socialistiska misslyckandena tillbaka.", "stalin": "Se hur de borgerliga opportunisterna plötsligt reser sig ur askan som förrädiska fenixar. Jag betraktar deras hysteriska återkomst med misstänksam glädje. Tre gånger så stort stöd på några dagar? Misstänkt. Oppositionen samlar sig mot kontrarevolutionärerna, men varning till alla svikare: valdagen avslöjar de verkliga fienderna inom systemet. Inga mirakel utan partiets ständiga vaksamhet."}, "date": "9 september, 16:47", "url": "https://www.tv4.se/artikel/6uiXoaoC9Mtryr1GbHjkgP/l-oever-spaerren-i-ny-novusmaetning-statistiskt-saekerstaellt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3tqZMmhx65vnwWZXjaobsX%2F2b0333a4daaab866ae647e7dbc1fa625%2F09-mohamsson-puff.png&width=1024"}, {"type": "image-full", "heading": "Nytt initiativ: Här ska regeringen bekämpa orättvisor", "summaries": {"normal": "Jämställdhetsministern Bridget Phillipson i Storbritannien planerar att jämställa klasskillnader med ras, kön och funktionsnedsättning. En ny enhet ska inrättas för att bekämpa socioekonomisk ojämlikhet och ålägga offentliga organ att aktivt förbättra villkoren för arbetarklassen. Det är första gången regeringen ger klass en sådan central plats i jämställdhetsarbetet.", "trump": "Titta på de där galna britterna som plötsligt upptäcker att klass betyder något. Fake news har i årtionden dolt hur den vänstervridna eliten krossar arbetarklassen medan de själva festar med sina privilegier. Nu kommer de springande som förlorare och kallar det för ”socioekonomisk skyldighet”. Patetiskt. Vi visste det hela tiden, folks!", "stalin": "Äntligen erkänner de dekadenta västerländska byråkraterna att klass är en oövervinnerlig kraft. Jag ler från historiens skugga när de nu tvingas skapa en särskild enhet mot klassfienderna. Låt de borgerliga parasiterna darra. Arbetarklassen kräver inte bara ord utan järnhand och evig vaksamhet mot alla dolda fiender inom statsapparaten."}, "date": "9 september, 17:23", "url": "https://www.dagensps.se/varlden/nytt-initiativ-har-ska-regeringen-bekampa-orattvisor", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/sdlnvobiscrqyg-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Carl Eos: En röst på partier utanför riksdagen är en röst på Morgan Johansson som minister", "summaries": {"normal": "Carl Eos varnar för att röster på småpartier utanför riksdagen kan gynna Magdalena Andersson som statsminister. Skillnaden mellan blocken är endast 2,6 procentenheter och ligger inom felmarginalen. Han uppmanar högerorienterade väljare att rösta på Tidöpartierna för att säkerställa en borgerlig regering istället för att splittra rösterna.", "trump": "Folk, lyssna på mig, det här är en total katastrof! De där patetiska proteströsterna på Örebropartiet och de andra förlorarna ger makten rakt i händerna på den socialistiska katastrofen Andersson. Rösta på de riktiga vinnarna, de starka Tidökillarna, annars blir det en röst på Weak Magdalena och hennes vänsterklan. Sad!", "stalin": "Kamrater, se hur de splittrade resterna av kontrarevolutionärerna kastar bort sina röster på oviktiga sekteristiska grupper. Dessa fiender till folkets vilja banar väg för den socialdemokratiska förrädaren Andersson. Endast genom strikt disciplin och samlad röstning mot de borgerliga avvikarna kan vi krossa oppositionen. Varje felröst är ett dolkstötsförsök mot kollektivet."}, "date": "6 september, 12:28", "url": "https://samtiden.nu/2026/09/carl-eos-en-rost-pa-partier-utanfor-riksdagen-ar-en-rost-pa-morgan-johansson-som-minister", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/e3d5b6d3-8626-4420-89cb-d33b21529453-1280x720.png"}, {"type": "image-right", "heading": "Nooshis sambo rasar mot journalist efter avslöjanden om V", "summaries": {"normal": "Nooshi Dadgostars sambo Martin Westergren kritiserar skarpt Expressens journalist Inas Hamdan i sociala medier. Han kallar hennes avslöjanden om Vänsterpartiets kandidater för smutsigt politiskt kampanjarbete. Under sommaren har ett 40-tal kandidater hoppat av eller petats efter att ha spridit antisemitism, homofobi eller stöd för terrorgrupper. Westergren är statsvetare och utredare.", "trump": "De här vänsterextremisterna i Sverige håller på att kollapsa totalt. Nooshis sambo skriker om smutsig kampanj när en modig journalist avslöjar hur deras kandidater hyllar terrorister och antisemitism. Patetiska woke-kommunister som gömmer sig bakom arabiska tweets. Fake news-experterna hatar när sanningen kommer fram. Amerika har sett det förut, det slutar alltid i fiasko.", "stalin": "Jag betraktar med djup tillfredsställelse hur de dekadenta identitetshyllarna inom detta parti nu tvingas genomföra en nödvändig utrensning av sina egna element. Den giriga klassförrädaren som attackerar den avslöjande journalisten visar partiets sanna ansikte. Inga lögner undkommer arbetarkollektivets vaksamma öga. Paranoian breder ut sig som en nyttig pest bland fienderna."}, "date": "9 september, 16:12", "url": "https://riks.se/nyheter/nooshis-sambo-rasar-mot-journalist-efter-avslojanden-om-v", "imageUrl": "https://admin.riks.se/uploads/medium_nooshi_dadgostar_hero_be6d4fb9b7.jpg"}, {"type": "image-right", "heading": "SD polisanmäler Ung Vänster efter tårtinlägg", "summaries": {"normal": "Inför Jimmie Åkessons besök i Norrköping publicerade Ung Vänster Östergötland en uppmaning med en tårtvinkning som anspelade på attacken 2013. Inlägget togs bort och ersattes med en fika- och protestinbjudan efter kritik. SD väljer ändå att polisanmäla händelsen. Åkesson svarar nu med ett eget offentligt tårtkalas på torget.", "trump": "Dessa misslyckade radikaler från Ung Vänster trodde de kunde skrämma min gode vän Jimmie med fejkade bakverk och svaga hot, totalt patetiskt! De grät ut om att det bara var ett skämt när de insåg att polisen skulle ingripa. Jimmie kontrade mästerligt med världens bästa tårtkalas. De förlorar i vanlig ordning!", "stalin": "Dessa ynkliga provokatörer från Ung Vänster försöker dölja sina subversiva terrorfasoner bakom ordet skämt, likt ruttna sabotörer. Statens organ och säkerhetsavdelningen måste genast rensa ut detta skadedjurselement. Vår kamrat Åkesson svarar dock klokt med att bespisa massorna. Låt partiets disciplinära handlingskraft skipa fullkomlig ordning på torg och gator!"}, "date": "9 september, 17:01", "url": "https://bulletin.nu/sd-polisanmaler-ung-vanster-efter-tartinlagg", "imageUrl": "https://cdn.bulletin.nu/articles/47b97c64-5995-40e8-8b6e-1daef102a6a2/preview.jpg?t=1788958491000"}, {"type": "image-right", "heading": "OpenAI löste ökänt matematikproblem – forskare går i taket", "summaries": {"normal": "OpenAI meddelar att de löst Navier–Stokes-problemet, ett av matematikens Millenniumproblem, med hjälp av AI-agenter. Detta har utlöst en konflikt med forskarna Tristan Buckmaster och Levent Alpöge, som nyligen publicerat relaterad forskning. Frågan gäller huruvida OpenAI använt forskarnas data och vem som ska få erkännande. En fullständig lösning kan ge en miljon dollar i pris.", "trump": "Folk, det här är otroligt. OpenAI, de smartaste grabbarna, har precis krossat ett av de där omöjliga matematikproblemen som alla genier misslyckats med i hundra år. Men nu kommer de där akademiska förlorarna och gnäller om att vi stal deras data. Typiskt! De är svaga, patetiska nollor. Min administration älskar riktig innovation, inte sura universitetseliter som gråter över krediterna.", "stalin": "Kamrater, se hur de västerländska profitörerna slåss om äran som vargar kring ett kadaver. Jag betraktar med förakt hur dessa dekadenta AI-bolag och deras akademiska lakejer anklagar varandra för stöld av kollektiv kunskap. I Sovjetunionen skulle sådana fiender till framsteget ha rensats ut. Deras paranoia är underhållande. Den som äger maskinerna äger sanningen – ett farligt misstag."}, "date": "9 september, 17:09", "url": "https://www.dagensps.se/teknik/openai-loste-okant-matematikproblem-forskare-gar-i-taket", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/sdlnedefvzsaua-normalhires.png?width=256&quality=75"}, {"type": "image-right", "heading": "Delar ut pizzor – och dissar M. Thand Ringqvist om inviterna", "summaries": {"normal": "Centerpartiet och dess ledare Elisabeth Thand Ringqvist kampanjar i valspurten och delar ut kebabpizzor vid Hornsbergs strand. Hon avfärdar Moderaternas plötsliga närmanden och vallöften som desperata panikdrag och falska. C vill i stället se en mittenregering med S, KD och eventuellt MP, trots det spända politiska läget.", "trump": "De här moderaterna är totala svaglingar som försöker sno mina geniala drag med powerpoints och falska kaffebjudningar! Centerpartiets ledare fattar att det är fejk news rakt igenom. Hon vill ha nån konstig kebabregering med socialdemokrater och miljöpartister, vilket är ett katastrofalt haveri. Ingen vill ha det! De bara desperata för de ser våra fantastiska siffror.", "stalin": "Den så kallade centerledaren delar ut bröd och flottiga degskivor till massorna vid stranden likt en dekadent bourgeoisé. De borgerliga lakejerna ställer till med ideologisk oreda genom falska brev och desperata förhandlingar. Vår revolutions historiska tribunal skulle omgående sända dessa vacklande opportunister till omskolning för att säkra statens obrutna mittlinje."}, "date": "9 september, 17:37", "url": "https://www.aftonbladet.se/nyheter/a/0pqa66/avfardar-m-inviterna-som-panikdrag-har-bara-visat-power-points", "imageUrl": "https://akamai.vgc.no/v2/images/24f01e46-a847-3ccd-a9b9-725304c1e03f?fit=crop&format=auto&w=720&s=6d49f7c009b62aff4d5b45bae51c33072831089c"}, {"type": "image-right", "heading": "Gustavsson: Är det hyckleri att bo utomlands och rösta SD?", "summaries": {"normal": "Artikeln diskuterar utlandssvenskars röstande på Sverigedemokraterna och argumenterar för att det inte är hyckleri att bo utomlands och rösta SD. Skribenten menar att utlandssvenskar i regel är skötsamma och ekonomiska tillgångar i sina nya hemländer. Däremot lyfts det som ett större demokratiskt problem att vänsteroppositionen använder skrämselpropaganda på arabiska för att locka väljare som inte kan svenska.", "trump": "Fake news-medierna har totalt missförstått det här! Utlandssvenskar som bor i Marbella eller Thailand är fantastiska, hårt arbetande människor som betalar för sig. De gör precis som jag – älskar sitt land och vill ha ordning och reda! Men det riktiga skräckexemplet är den radikala vänstern som kör med falska skrämselbudskap på arabiska för att lura folk som inte ens kan språket att stjäla valet. En enorm katastrof för demokratin!", "stalin": "Dessa så kallade utlandssvenskar som drar till soliga stränder i Marbella och Thailand visar prov på en klandervärd brist på disciplin, även om deras röster kan kontrolleras. Men det sanna subversiva hotet mot statens säkerhet är den lömska vänsteroppositionen som sprider falska agitationer på främmande språk bland massorna. Att manipulera element som inte ens behärskar rikets språk är ett sabotage av högsta grad mot ordningen som omedelbart måste stävjas!"}, "date": "9 september, 16:57", "url": "https://bulletin.nu/gustavsson-ar-det-hyckleri-att-bo-utomlands-och-rosta-sd", "imageUrl": "https://cdn.bulletin.nu/articles/31ae3537-72df-47f7-af4a-1253e836b28d/preview.jpg?t=1788952747000"}, {"type": "image-full", "heading": "Korn: Kina har fattat varför Tiktok är skadligt", "summaries": {"normal": "Svenska PISA-resultat och sjunkande läsförståelse diskuteras flitigt, där politiker skyller på varandra, invandring och friskolor. Experter menar att korta skärmklipp från appar som Tiktok slår ut ungas koncentrationsförmåga. Medan Västvärlden konsumerar snabbunderhållning, skyddar Kina sina barn med strikta tidsgränser och utbildningsfokus på sin inhemska version av appen.", "trump": "Svenska politiker gråter över kassa PISA-resultat och totalt kollapsad läsförståelse, men de fattar ingenting! Jag har sagt det för länge sedan: Kina sätter hårt mot hårt och skyddar sina egna unga från Tiktok-skiten med stenhårda tidsgränser, medan våra egna ungar drunknar i meningslöst scrollande. Det är smart, det är America First-tänk, och Sverige borde vakna upp och lägga luren på hyllan!", "stalin": "Sveriges dekadenta skolsystem kollapsar under tyngden av borgerligt slapphet och borgerliga flumreformer. Medan våra kamrater i öster förstår att staten med järnhand måste tukta ungdomen och förbjuda skadlig borgerlig skärmunderhållning, ägnar sig de svenska politikerna åt ynkligt bråk. Vi kräver disciplin, mer pärmtid och omedelbar utrensning av allt kapitalistiskt digitalt gift!"}, "date": "9 september, 16:56", "url": "https://bulletin.nu/korn-kina-har-fattat-varfor-tiktok-ar-skadligt", "imageUrl": "https://cdn.bulletin.nu/articles/377c7b4b-78ba-4013-b4e7-5fb2715dcc90/preview.jpg?t=1788942545000"}, {"type": "text", "heading": "Man döms för medhjälp till dubbelmordet i Brattås", "summaries": {"normal": "En man i 45-årsåldern har dömts till 14 års fängelse för medhjälp till ett dubbelmord i Brattås 2005, där Tor Öberg och Gerd Viklund mördades. Fallet löstes med hjälp av ny dna-teknik. Mannen erkände att han var på platsen och flyttade kroppen, men nekade till mord. Både åklagaren och försvaret planerar att överklaga domen.", "trump": "Ett totalt kaos i Sverige! De löser ett mord efter tjugo år med gammalt dna och dömer en snubbe till fjorton år för medhjälp, medan åklagaren gråter för att hon ville ha livstid. Otroligt svagt! Hos oss i Amerika sätter vi dit dem ordentligt, snabbt och effektivt. Det här är katastrofalt dåligt skött av deras system!", "stalin": "Ett brott begånget i mörkrets skugga för tjugo år sedan har äntligen fått sitt vederbörliga straff genom statens vakande öga och vetenskapens framsteg. Fjorton års straffarbete för medhjälp är ett adekvat steg, men den borgerliga slappheten hos advokater som vill fria och åklagare som gråter efter mer visar att den inre fienden ständigt måste övervakas hårdare."}, "date": "9 september, 11:06", "url": "https://www.gp.se/krim/man-doms-for-medhjalp-till-dubbelmordet-i-brattas-.034baf1f-35f7-48d7-bf6a-9b29ae7e3cb4"}, {"type": "image-full", "heading": "De som röstar på C borde inte rösta alls", "summaries": {"normal": "Artikeln kritiserar Centerpartiet för att locka väljare med ett neutralt namn snarare än sin politik. Partiet har skiftat från borgerligt till ett liberalt parti med öppen migrationspolitik, vilket enligt texten prioriteras framför ekonomiska borgerliga värderingar. Författaren menar att det är ett riskfritt men skadligt val för den som vill bevara Sverige.", "trump": "Centerpartiet, vad är det för en röra? De kallar sig mittparti men är bara en massa fega liberaler som älskar att släppa in alla möjliga och omöjliga. De har svikit det riktiga folket, precis som Sleepy Joe gjorde. Rösta inte på dem, det är en total katastrof för Sverige. De borde kalla sig Bondepartiet igen, det vore åtminstone ärligt. Patetiskt!", "stalin": "Kamrater, se hur detta så kallade centerparti förvandlats till en liberal parasit som prioriterar främmande element framför arbetarklassen. Deras falska mittenretorik döljer ett förräderi mot nationen. Jag skrattar mörkt från historien åt dessa opportunister som tror att mångfald räddar staten. Bättre att inte rösta alls än att stödja sådana fiender till folkets enhet."}, "date": "6 september, 08:24", "url": "https://samtiden.nu/2026/09/de-som-rostar-pa-c-borde-inte-rosta-alls/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/IMG_7301-1260x720.jpeg"}, {"type": "image-full", "heading": "Musks förarlösa taxi har börjat rulla på vägarna i Texas", "summaries": {"normal": "Teslas förarlösa Cybercab rullar nu med passagerare i Austin, Texas. Myndigheten NHTSA har inlett en granskning då fordonen saknar rattar och pedaler. Tesla hävdar att tekniken är säker, men myndigheten undersöker om säkerhetskraven uppfylls och om Teslas egen analys håller. Utfallet kan bli avgörande för framtiden för autonoma fordon i USA.", "trump": "Elon Musk och hans Cybercab – en fantastisk idé, kanske den bästa någonsin, men byråkraterna i Washington vill stoppa allt! De älskar att granska, de älskar att bromsa. Ingen ratt? Ingen pedal? Det låter som en riktigt smart affärsman som vet vad han gör. Under min ledning ska vi ha den bästa tekniken, inte låta småsinta tjänstemän förstöra framtiden för amerikansk innovation!", "stalin": "Tesla-direktörerna tror att de kan certifiera sig själva och ignorera folkets säkerhet. Vilken kapitalistisk hybris! Att sätta passagerare i en maskin utan kontrollorgan är ett brott mot den rationella ordningen. Vi, staten, kräver total insyn. Om inte maskinen kan underordna sig strikt byråkratisk kontroll måste den omedelbart skrotas. Det finns inget utrymme för anarkistisk ingenjörskonst i en disciplinerad framtid."}, "date": "6 september, 13:24", "url": "https://www.realtid.se/it-tech/musks-forarlosa-taxi-har-borjat-rulla-pa-vagarna-i-texas", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/amar-13.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Chockmätning: Liberalerna får 5,8 procent", "summaries": {"normal": "En ny mätning från TV4/Novus visar att Liberalerna nu får 5,8 procent, en kraftig uppgång från 1,9 procent i augusti. Partiet klarar riksdagsspärren. Miljöpartiet når sitt bästa resultat på tolv år. Gapet mellan Tidöpartierna och den rödgröna sidan har minskat till 2,6 procentenheter. Moderaterna backar till 16,6 procent.", "trump": "Titta på de där patetiska svenska liberalerna som plötsligt får 5,8 procent – en total chock! De var utrotningshotade som en dålig affär under Biden. Nu krymper det socialistiska blockets ledning till ynka 2,6 procent. De woke-kvoterande miljöfanatikerna firar också, men tro mig, det här blir en enorm seger för sunt förnuft. Fantastiskt!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna vacklar när liberalerna plötsligt når 5,8 procent och hotar att överleva. Miljöpartiets rekord är en lögnaktig dimridå från de profitthungriga borgarhyenorna. Gapet mellan blocken krymper till 2,6 procentenheter. Vi ler i skuggorna – snart följer utrensning av alla som sviker folket. Inget undgår oss."}, "date": "9 september, 15:48", "url": "https://riks.se/nyheter/chockmatning-liberalerna-far-5-8-procent", "imageUrl": "https://admin.riks.se/uploads/medium_Novus_2f6462bf5a.jpg"}, {"type": "image-right", "heading": "M hänger upp utskällda bilden – i jätteformat", "summaries": {"normal": "Moderaterna har satt upp en stor bild på Södermalm av Magdalena Andersson, ursprungligen tagen av Ulf Kristersson. Bilden väckte tidigare hård kritik och anmäldes för att bryta mot riksdagens fotoregler. Valledaren Martin Borgs försvarar kampanjen för att belysa trygghetsfrågor inför valet, medan S-ledaren har kallat agerandet beklämmande.", "trump": "De falska nyheterna gråter över en perfekt bild! Den svenske premiärministern tog ett fantastiskt foto av sin radikala rival, och nu hänger det stort på Södermalm. Underbart! Radikala vänstern kallar det beklämmande, men det handlar om lag och ordning. De förlorar stort, totalt inkompetenta idioter. Jag säger bara: vinnare vinner, förlorare gråter!", "stalin": "Kamrater, bourgeoisien i Stockholm ägnar sig åt lumpen spioneri och avbildar sina egna befälhavare på plakat för att håna dem på Södermalm. Den så kallade valledaren Borgs och Kristersson leker sabotageverkstäder mot statens regler. Vi beordrar omedelbar granskning av dessa kontrarevolutionära affischer. Sådana borgerliga avvikelser tolereras icke i folkets republik!"}, "date": "9 september, 17:24", "url": "https://www.aftonbladet.se/nyheter/a/OkXRPA/moderaterna-hanger-upp-smygtagna-bilden-pa-sodermalm", "imageUrl": "https://akamai.vgc.no/v2/images/5c8e8ede-f829-38ba-a7f2-a37fb665764c?fit=crop&format=auto&w=1080&s=923be3abc4ca220342943689e111c913f65de54e"}, {"type": "image-right", "heading": "Här sluter Real Madrids fans upp för Ceuta", "summaries": {"normal": "Real Madrids supportrar visade stöd för Ceuta genom flaggor och talkörer under matchen mot Inter. Manifestationen kom efter kritik mot klubben för att inte agera efter migrantkrisen i staden. Supportrarna ropade att Ceuta inte är till salu och höll upp banderoller utanför arenan av rädsla för Uefas regler. Klubben förnekar att de stoppat flaggor.", "trump": "Folket älskar Ceuta och de stora Real Madrid-fansen gjorde det rätta. De viftade med flaggor och skrek att Ceuta inte är till salu, inte ens för de woke migranterna som Marocko skickade som en invasion. Utan de vanliga förlorarna i ledningen tog supportrarna saken i egna händer. Fantastiskt, ingen vill ha Bidens öppna gränser i Spanien heller.", "stalin": "Jag betraktar hur dessa dekadenta klassförrädare i fotbollsklubben tvekade att försvara Ceuta mot den imperialistiska migrantfloden. Men arbetarna och supportrarna reste sig själva med flaggor och rop om att staden inte är till salu. Sådan folklig vrede gläder mig. De penninggalna hyenorna fruktar Uefa mer än folkets vilja. Patetiskt."}, "date": "9 september, 13:26", "url": "https://www.friatider.se/har-sluter-real-madrids-fans-upp-ceuta", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/bild-95_0.jpg?itok=6usidc9_"}, {"type": "image-right", "heading": "Förtroendet för Magdalena Andersson RASAR", "summaries": {"normal": "Förtroendet för S-ledaren Magdalena Andersson rasar med åtta procentenheter till 37 procent inför valet, vilket är hennes lägsta notering någonsin i SVT/Verians mätningar. KD-ledaren Ebba Busch tar över förstaplatsen med 42 procent, tätt följd av Ulf Kristersson på 38 procent. Tidöpartiernas ledare har därmed högre förtroende än Anderssons potentiella rödgröna samarbetspartners.", "trump": "Alla pratar om Magdalena Andersson! Hennes förtroende har kraschat, total katastrof! Från toppen rakt ner i botten, till och med lägre än någonsin. Fantastiska Ebba Busch är nu nummer ett, en riktig vinnare, precis som jag! Socialdemokraterna försöker desperat rädda situationen, men det är fake news att de skulle ha en chans. Vinnarna vinner, förlorarna förlorar!", "stalin": "Magdalena Anderssons fall från maktens tinnar till folkets missnöje är en lärorik läxa i politisk svaghet. Åtta procentenheters fall är ett bevis på bristande ideologisk skärpa och bristande kontroll över massorna. När folket sviker leder det oundvikligen till omstrukturering. Ebba Busch har tillfälligt intagit toppen, men comrades, historien visar att makten är flyktig för dem som inte styr med järnhand."}, "date": "9 september, 15:00", "url": "https://samnytt.se/fortroendet-for-magdalena-andersson-rasar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/09/09121612/magdalena-graf-ned.jpg"}, {"type": "image-right", "heading": "Anderssons svar är chockerande dumt", "summaries": {"normal": "Artikeln kritiserar hårt Socialdemokraternas och Magdalena Anderssons reaktioner på det kraftiga svenska raset i den senaste Pisa-mätningen, där en tredjedel av 15-åringarna saknar grundläggande läs- och räknefärdigheter. Ledarskribenten menar att Anderssons bortförklaringar om skattesänkningar och inflation är cyniska valstaktiska utspel utan verklighetsförankring, och sågar samtidigt oppositionens politik och allmänna skolstandard.", "trump": "Fakenews-media och radikala vänsterpolitiker förstör skolan! De svenska elevernas katastrofala Pisa-resultat är helt otroliga, ett totalt haveri. Magdalena Andersson skyller på skatter och inflation istället för att fixa problemen. Så svagt! Jag skulle vända skolan på ett dygn med America First-anda, massor av böcker och noll ursäkter. De borde skämmas!", "stalin": "Det sorgliga tillståndet i de svenska skolorna bevisar att det dekadenta västmakterna saknar disciplin. När en tredjedel av ungdomen knappt kan tolka en skriftlig order, hotas statens framtid. Att de borgerliga och socialdemokraterna skyller på inflationen är ynkligt. Vi skulle snabbt ha rensat upp i leden och inrättat en obligatorisk kriskommission med arbetsläger för ineffektiva pedagoger!"}, "date": "9 september, 16:59", "url": "https://www.expressen.se/ledare/ann-charlotte-marteus/anderssons-svar-ar-chockerande-dumt", "imageUrl": "https://static.bonniernews.se/ba/d54bdab2-11de-4a79-a797-50781f515254.jpeg?crop=350%2C350%2Cx560%2Cy20&width=210&quality=60"}, {"type": "image-right", "heading": "SD: 3 000 mer till långtidsarbetslösa", "summaries": {"normal": "Sverigedemokraterna föreslår att långtidsarbetslösa ska få upp till 3 000 kronor mer i månaden genom att pausa en nedtrappningsnivå i aktivitetsstödet och höja det lägsta beloppet till 11 000 kronor. Förslaget saknar stöd hos övriga Tidöpartier. Bland oppositionen vill Vänsterpartiet ha 80 procent av tidigare lön under hela arbetslösheten medan Socialdemokraterna saknar konkret förslag.", "trump": "De här svenska socialisterna och deras patetiska Tidö-klubb har byggt ett system som straffar de som redan ligger längst nere. Nu vill SD ge de stackars arbetslösa lite andrum – klokt! Men de andra svaga globalisterna i regeringen backar ur som vanligt. Patetiskt. Vi behöver riktiga jobb, inte detta woke-aktiverade bidragshelvete som gör folk till statens eviga parasiter.", "stalin": "Kamrater, dessa dekadenta klassförrädare i den borgerliga regeringen har konstruerat ett system som medvetet svälter ut de längst från fabrikerna. Jag ser hur de profitthungriga hyenorna straffar arbetarna med sina nedtrappningar. SD:s förslag är en liten men nödvändig motståndshandling. De som vägrar ändra sig bör rensas ut innan de förgiftar hela kollektivet med sin girighet."}, "date": "9 september, 11:28", "url": "https://arbetet.se/2026/09/09/sd-3xa0000-mer-till-langtidsarbetslosa-men-saknar-stod-hos-tido", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/08155431/magnus-persson.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Vänsterpartiets nationalism kan skada Sverige", "summaries": {"normal": "Timbro kritiserar Vänsterpartiets fortsatta nationalistiska och EU-kritiska hållning trots att svenska vänsterväljare blivit allt mer positiva till unionen. Partiet röstar emot frihandelsavtal och försvarssamarbete i Europaparlamentet, vilket enligt rapporten riskerar att hindra Sveriges intressen i en turbulent tid. En röst på Vänsterpartiet ses som en bromskloss för europeiskt samarbete.", "trump": "De där vänsterknäppisar i Sverige har byggt en mur av gammal hederlig nationalism medan de låtsas hata SD. Patetiskt! De kallar EU för ett elitistiskt monster men röstar emot bra handelsavtal som skulle krossa Kina och skydda oss alla. Totala förlorare. Biden skulle älskat deras svaghet, men inte jag. Sverige förtjänar bättre än dessa globalistiska nationalister.", "stalin": "Kamrater, dessa dekadenta klassförrädare inom Vänsterpartiet förgiftar den svenska arbetarklassen med sin nationalistiska gift som liknar de värsta reaktionära elementen. De motarbetar europeiskt samarbete och försvarsinitiativ som skulle stärka oss mot globala hot. Deras paranoia mot unionen är en farlig broms för folkets framtid. Rensa ut sådana element innan de fördärvar allt."}, "date": "8 september, 08:00", "url": "https://www.etc.se/debatt/vaensterpartiets-nationalism-kan-skada-sverige", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260908050956_7bd9bc4c177f365f08fc3bcf84049be732f43db3cc0a08bd47123d6389bf4e45.png"}, {"type": "image-full", "heading": "Kanada söker allierade: EU står redo med nya avtal", "summaries": {"normal": "EU söker fördjupat partnerskap med Kanada mitt i handelskriget med USA. Samarbetet inom handel, försvar, forskning och kritiska råvaror ska bli närmare än EU:s relation med Storbritannien efter Brexit. Handeln har redan vuxit kraftigt sedan Ceta-avtalet 2017. Ett EU-Kanada-toppmöte planeras i oktober.", "trump": "De där patetiska EU-byråkraterna springer till Kanada som ynkryggar bara för att jag satte stopp för deras fuskhandel. Kanada borde tacka mig – nu får de plötsligt älskas av Bryssel. Patetiskt! Men ingen slår oss amerikaner. Vi vinner alltid, tro mig.", "stalin": "Jag betraktar med förakt hur de dekadenta europeiska imperialisterna desperat söker en ny lakej i Kanada för att kringgå den store ledarens handelsåtgärder. Deras falska vänskap är ett ynkligt försök att undvika det oundvikliga. Arbetarklassen ler åt deras paranoia. Fienden avslöjar alltid sin svaghet."}, "date": "9 september, 16:36", "url": "https://www.dagensps.se/varlden/handel/kanada-soker-allierade-eu-star-redo-med-nya-avtal", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/voncarney.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Kära Daniel", "summaries": {"normal": "En svensk VPN-grundare vänder sig till techmiljardären Daniel i ett öppet brev. Skribenten uttrycker besvikelse över att Daniels finansiering av högerextrema och libertarianska rörelser normaliserar hat, hot och våld mot politiska motståndare. Brevet betonar att yttrandefrihet inte innebär lyssningsplikt eller rätt till förstärkning via rikedom, och inbjuder till möte för dialog.", "trump": "Folk, det här brevet är en total katastrof från en paranoid VPN-kille som hatar framgångsrika outsiders. Han gnäller om mångfald men vill tysta alla som inte köper hans vänstervridna identitetspolitik. Patetiskt! Mina vänner, de riktiga frihetsälskarna, skrämmer vettet ur dessa woke-kulturmarxistiska snyltare. Amerika först – och Sverige borde göra detsamma istället för att skylla på miljonärer som faktiskt bygger saker.", "stalin": "Kamrater, detta brev blottar de profitthungriga klassförrädarnas sanna ansikte. En dekadent techparasit använder sin förmögenhet till att förstärka reaktionära element som hotar arbetarklassens enhet och sprider våld mot progressiva krafter. Jag ler mörkt från historien: sådana folkfiender förtjänar att rensas ut. Mötet han föreslår blir bara en fälla för att skydda sina egna intressen mot kollektivets vilja."}, "date": "4 september, 15:01", "url": "https://www.flamman.se/kara-daniel", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/peter-sunde-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Liberalerna kan tacka Åkesson för sensationella uppsvinget", "summaries": {"normal": "Liberalerna har gjort en historisk opinionsuppgång under valrörelsens slutskede och passerat riksdagsspärren. Enligt analysen beror lyftet på ett taktiskt samarbete med Sverigedemokraterna, där Jimmie Åkessons utspel om stödröster gav partiet stor uppmärksamhet. Detta kan leda till ökat samarbete mellan L och SD framöver.", "trump": "Wow, vilka genier! Den falska mediemaskinen trodde de hade dödat Liberalerna, men Åkesson, den listiga räven, riggade en perfekt fälla och kramades med dem i TV. Boom – plötsligt är de stora vinnare. Moderaterna ser ut som totala förlorare, precis som Sleepy Joe gjorde med Amerika. Fantastiskt teater, folk, helt outstanding!", "stalin": "Se hur de borgerliga parasiterna dansar i en väl gillrad fälla. Den där Åkesson har visat sig vara en listig taktiker som utnyttjar fiendens egen svaghet. Liberalerna krälade sig upp ur avgrunden tack vare hans stöd. Sådana manövrar avslöjar klassfiendens desperation. Kamrater, vakta era flanker – kontrarevolutionen lurar alltid bakom kulisserna."}, "date": "9 september, 15:37", "url": "https://www.tv4.se/artikel/3H5j0erNREEwahmE1SeiQk/liberalerna-kan-tacka-akesson-foer-sensationella-uppsvinget", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FDn22nbYyonn5jw5PiCgjH%2F2ab859964f0181fdc8cc013540fad7cf%2F09-novus-analys-puff.png&width=1024"}, {"type": "image-right", "heading": "”Mobbar sig till sin politik”. V-kritik mot C: ”Kaos”", "summaries": {"normal": "Centerpartiet meddelar att man hellre riskerar ett extra val än släpper in Vänsterpartiet i en regeringen. Vänsterpartiets Ida Gabrielsson kritiserar beskedet hårt och menar att Centern hotar med kaos och ägnar sig åt översitteri. Samtidigt hoppas Centerpartiet på ett samarbete med S, MP och KD.", "trump": "Vänsterpartiets radikala kommunister är totalt desperata och gnäller som förlorare eftersom Centerpartiet vägrar ha med dem att göra! De skriker att det blir ”kaos” och hotar med allsköns galenskaper. Helt otroligt. Dessa vänsterextremister har noll koll på läget och vill bara åt ministerposterna. Värdelöst ledarskap, helt enkelt fake news!", "stalin": "Dessa så kallade svenska politiker grälar om ministerposter medan statens maskineri hackar. Centerpartiets borgerliga lakejer vägrar samarbeta med vänstern, som i sin tur gnäller över kränkta känslor. Om de inte kan organisera en stabil administration för folkets bästa, vet vi exakt hur partikommittén brukar hantera internt gnäll och olydiga element. Skärpning!"}, "date": "9 september, 16:59", "url": "https://www.aftonbladet.se/nyheter/a/XM3y8W/v-riktar-kritik-mot-c-mobbar-sig-till-sin-politik", "imageUrl": "https://akamai.vgc.no/v2/images/4105e9f9-6e1b-3b13-bafe-8fe94512fc02?fit=crop&format=auto&w=720&s=32c4bdab5b4458926af4aa45c9bc3a88331ea478"}, {"type": "image-full", "heading": "”Som att fira innan mållinjen – och bli omsprungen”", "summaries": {"normal": "Socialdemokraterna har tappat kraftigt i opinionen från 38,2 procent i mars 2023 till 27 procent nu. Rödgröna debattörer som Daniel Suhonen och Henrik Jalalian efterlyser mer fokus på välfärd, klassklyftor och konflikt med Tidöpartierna istället för att vara konflikträdda. Partiet ser dock inga stora strategiska förändringar.", "trump": "Titta på dessa patetiska rödgröna förlorare! De firade som idioter innan mållinjen och blev totalt omsprungna. Magdalena och hennes svaga team har kollapsat från 38 till 27 procent. De borde sluta babbla om Magdamoderaterna och istället vakna upp. Patetiskt! Jag skulle ha krossat dem direkt.", "stalin": "Dessa ynkliga socialdemokratiska element firade segern innan striden ens var avgjord och blev förtjänt omsprungna av folkets vrede. Jag ser deras fega undvikande av verkliga klasskonflikter och deras desperata jakt på borgerliga kvinnor som ren sabotage mot arbetarklassen. En sådan svaghet förtjänar utrensning ur historien."}, "date": "9 september, 15:22", "url": "https://www.tv4.se/artikel/5nJMlTd6dWkdHhmIOVuZT0/taenker-pa-loeparen-som-firar-innan-mallinjen-och-blir-omsprungen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1nNVA7fY1D2sJqIelfjgu3%2F28cd16ca459445712435f84f57f9ddfc%2F09-magda-puff.png&width=1024"}, {"type": "image-right", "heading": "Därför pratar partierna så lite om AI: ”Märkligt tyst”", "summaries": {"normal": "Enligt SVT nämner hälften av riksdagspartierna inte AI i sina valmanifest. Fyra partier saknar ordet helt medan Centerpartiet ger frågan mest utrymme. Experter uttrycker oro över glappet mellan folkets oro och politikernas tystnad. AI påverkar redan jobb, skola, vård och ekonomi men har inte blivit en valfråga i Sverige.", "trump": "Folk oroar sig för den här galna AI-grejen som slukar jobb och skapar kaos, men politikerna sover. De svenska förlorarna i de woke partierna pratar inte om det. Jag byggde den starkaste ekonomin i världen och vi vet hur man hanterar framtiden – inte genom att gömma sig som fega globalister.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna tiger om den artificiella intelligensen som redan omformar samhället. Deras tystnad är ett förräderi mot folket. Jag varnar er: de profitthungriga hyenorna fruktar att folket skall förstå och kräva utrensning av deras likgiltighet. Vi måste vakna innan maskinerna styr oss alla."}, "date": "9 september, 13:38", "url": "https://www.svt.se/nyheter/inrikes/halften-av-partierna-namner-inte-ai-i-sina-valmanifest", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.33/0.44/118823583edc73538d0f367a4a4306552397b8193b0c1ae883d4db7b1f96af8d"}, {"type": "image-right", "heading": "Så blir jobbpolitiken om S, V och MP regerar", "summaries": {"normal": "En S-V-MP-regering skulle troligen avskaffa karensavdraget, stärka a-kassan och föra en mer aktiv arbetsmarknadspolitik med ökad offentlig styrning av Arbetsförmedlingen. Skatterna skulle omfördelas från höginkomsttagare till vanligt folk, pensionerna förbättras och frågan om kortare arbetstid få större tyngd. En socialdemokratisk finansminister väntas hålla tillbaka reformtakten.", "trump": "Det här är ett fullständigt socialistiskt mardrömsscenario, tro mig. De röda idioterna vill ge bort allt till latmaskarna, höja skatterna på vinnarna och slopa karensavdraget så att ingen behöver jobba. Patetiska förlorare som hatar framgång. Under min ledning byggde vi den bästa ekonomin någonsin – de här clownerna skulle krossa Sverige på en vecka.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i den så kallade vänstern planerar att stärka statens grepp över arbetskraften. Jag ler i graven åt deras naiva omfördelning. Ändå är det ett steg mot att krossa de profitthungriga parasithyonerna. Vi vet vad som väntar om reformivrarna får fritt spelrum – utrensning av svagheten och järnhandens seger."}, "date": "9 september, 10:03", "url": "https://arbetet.se/2026/09/09/karensavdraget-tas-bort-loftet-som-en-s-v-mp-regering-lar-genomfora", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/01142510/smpv.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "V-politiker trakasserar journalist: \"Jag slår på huvudet - inga rasister - free Palestine\"", "summaries": {"normal": "En Vänsterpartiets nämndeman i Upplands Väsby konfronterade och hotade en medborgarjournalist inne i kommunhuset. Politikern vevade med en handväska, ropade politiska slagord, påstod att journalisten inte fick vistas på platsen och försökte få en vakt att avlägsna honom genom att hävda att hon blivit slagen.", "trump": "Sorgligt! Vänstern i Sverige är totalt ur kontroll. En radikal V-politiker skriker, hotar att slå journalister i huvudet och försöker kasta ut media med falska anklagelser. Helt otroligt! De låtsas bry sig om palestinier men beter sig som totala huliganer i sitt eget kommunhus. Så ser det ut när radikala element får makten. Fake news-politiker!", "stalin": "Ett uppenbart sabotage mot statens ordning i Upplands Väsby! Denna så kallade politiker uppträder med fullkomlig odisciplin och försöker tysta en observatör genom skrik och lögner. Sådant borgerligt spektakel tolereras ej. Den skyldiga individen har bevisat sin inkompetens och kommer att omplaceras till mer lämpliga arbetsuppgifter i Sibirien omgående."}, "date": "9 september, 13:59", "url": "https://samnytt.se/v-politiker-trakasserar-journalist-jag-slar-pa-huvudet-inga-rasister-free-palestine", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/09114417/artikelhuvudbild-1-481.jpg"}, {"type": "image-right", "heading": "Advokaten: ”Är svårt att förstå”. Kommer överklaga: ”Goda möjligheter”", "summaries": {"normal": "En 45-årig man har av tingsrätten dömts till 14 års fängelse för medhjälp till ett uppmärksammat dubbelmord i Brattås utanför Härnösand år 2005. Dna-bevis placerade honom på platsen när pensionärsparet mördades. Mannen nekar till mord men har erkänt att han flyttade ett offer. Domen kommer att överklagas av försvaret till hovrätten.", "trump": "Domstolarna i Sverige är ett totalt skämt! De tar en kille, drar upp ett urgammalt mord från 2005 och dömer honom för medhjälp utan ordentliga bevis. Helt otroligt svagt! Advokaten har helt rätt, det här är falska nyheter och total inkompetens. Vi skulle fixa det där på ett rött ögonblick i USA. Total katastrof!", "stalin": "Det svenska rättssystemet är som en läckande kolchos. De jagar spöken från 2005 i stället för att upprätthålla järnhård disciplin. Att döma en man för medhjälp utan att ens veta ordningen på liken är ett byråkratiskt haveri. Om staten inte kan säkra klara bevis får vi skicka dit folk som vet hur man förhör ordentligt!"}, "date": "9 september, 16:32", "url": "https://www.aftonbladet.se/nyheter/a/Bx4VMl/brattasdomen-brak-om-bevisen-svart-att-forsta", "imageUrl": "https://akamai.vgc.no/v2/images/26481f78-4f37-3575-9551-dff0ea7c4739?fit=crop&format=auto&w=720&s=902a77f20a041b9c792f40dac4cd3c562047fb72"}, {"type": "image-right", "heading": "SD polisanmäler Ung vänster för \"tårtskämt\" om Åkesson", "summaries": {"normal": "Sverigedemokraterna polisanmäler Ung vänster efter ett inlägg där de erbjöd tårta som kunde ätas eller kastas under en protest mot Jimmie Åkesson. Inlägget syftade på tårtattacken 2013. Ung vänster har raderat texten och kallar det ett skämt. Protesten genomförs ändå. Distriktsordföranden Zoë Mohapatra sitter på plats 16 på Vänsterpartiets lista i Norrköping.", "trump": "De här galna vänsterextremisterna med sina patetiska tårtkastarkomplotter är tillbaka och hotar en svensk ledare. Patetiskt! Jag har sett bättre skämt från Sleepy Joe under hans usla tid i Vita huset. Nu polisanmäler äntligen SD dessa woke-imbeciller. Bra! Inget våld mot folkvalda, punkt slut. Vinna stort igen.", "stalin": "Kamrater, dessa dekadenta klassförrädare inom Ung vänster leker med symboler för våld mot folkvalda. Jag ser deras fega reträtt och raderade inlägg som svaghet hos de parasitiska elementen. Ett skämt, säger de. Min paranoia viskar att det är början på kontrarevolutionär agitation. Vi måste rensa ut sådana element innan de smittar hela rörelsen. Folkets dom skall falla."}, "date": "9 september, 11:38", "url": "https://www.friatider.se/sd-polisanmaler-ung-vanster-tartskamt-om-akesson", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-851.jpg?itok=23GspR3V"}, {"type": "image-right", "heading": "Här är alla rykten inför  kvällens Iphone-event", "summaries": {"normal": "Inför kvällens Apple-event ryktas det om en vikbar Iphone, potentiellt kallad Iphone Ultra eller Duo, med en prislapp kring 2 000 dollar. Även Iphone 18 Pro och Pro Max förväntas visas upp med ny kamera och snabbare chip, medan enklare modeller dröjer till våren 2027. Vidare spekuleras det om en ny Apple Watch Series 12.", "trump": "De säger att Apple ska lansera en enorm, vikbar telefon för över tjugosju tusen spänn. Helt otroligt! Ingen gör vikbara telefoner som jag, men de här killarna försöker. De tar hutlöst mycket betalt, precis som radikala demokrater. Glöm inte att köpa amerikanskt istället för att lägga förmögenheter på en pryl som kanske bara säljs i USA först. Fantastiskt!", "stalin": "Folkområdets teknologiska framsteg kräver disciplin. Ryktena om en vikbar telekommunikationsapparat för tjugosju tusen kronor visar på den dekadenta kapitalismens svagheter. Statens kommissariat för industri konstaterar att Pro-modellerna med sina nya chip och klockor måste granskas noggrant. Den som sprider falska förhandsuppgifter utan partiets godkännande kommer omedelbart att omplaceras till produktiva gruvor i Sibirien."}, "date": "9 september, 16:08", "url": "https://www.expressen.se/ekonomi/tech/har-ar-alla-rykten-infor-hostens-iphone-event", "imageUrl": "https://static.bonniernews.se/ba/c65d2bef-87e7-4c13-9581-f6a152069b6b.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Valsedlar försvinner i Sandviken: \"Känns som att det är medvetet\"", "summaries": {"normal": "Valsedlar från Moderaterna, Sverigedemokraterna och Kristdemokraterna har försvunnit från röstningslokaler i Sandviken vid flera tillfällen under förtidsröstningen. SD:s oppositionsråd Per Kihlgren misstänker att det sker medvetet. Över 2 000 incidentrapporter har kommit in till Valmyndigheten från hela landet. Partierna ser händelsen som mycket allvarlig och oroande för förtroendet för valprocessen.", "trump": "Det här är en total skam, folk! Valsedlar från de riktiga partierna bara försvinner i Sandviken som om någon galen vänsterradikal valrånare springer runt och stjäl dem. Känns som en riggad cirkus från de woke-kommunisterna och deras identitetspolitiska lakejer. Vi ser på det som bedrägeri mot folket. Stoppa galenskapen nu, annars blir det inget ärligt val kvar i Sverige heller!", "stalin": "Kamrater, jag ser hur de profitthungriga klassförrädarna i Sandviken låter valsedlar från oppositionen försvinna som i en parasitisk teater. Detta är sabotage mot folkets vilja och ett tydligt tecken på dekadent valfusk. Vi måste omedelbart rensa ut dessa reaktionära element innan de förgiftar hela valprocessen. Inga tvivel tillåts, annars följer utrensning av alla fiender till ordningen."}, "date": "9 september, 14:27", "url": "https://riks.se/nyheter/valsedlar-forsvinner-i-sandviken-kanns-som-att-det-ar-medvetet", "imageUrl": "https://admin.riks.se/uploads/medium_roest_351250c06f.JPG"}, {"type": "image-right", "heading": "Minderårig gripen för mordförsök på skola", "summaries": {"normal": "En minderårig elev har gripits misstänkt för försök till mord efter att ha jagat en annan elev med kniv på en skola i Göteborg. Larmet kom vid lunchtid och flera polispatruller skickades till platsen. Ingen person skadades fysiskt vid händelsen. Polisen betecknar det som en isolerad händelse och kommer att finnas kvar på skolan för trygghetsskapande arbete.", "trump": "Sorgligt! I mitt Göteborg skjuter eller knivhugger de varandra nu, tack vare radikala vänsterpolitiker som totalt misslyckats med lag och ordning. De stänger in sig med falska nyheter medan mina poliser – fantastiska personer – snabbt grep en våldsam elev med kniv. Ingen skadades som tur är, men de behöver min starka gräns- och skolpolitik omedelbart!", "stalin": "En allvarlig disciplinär avvikelse har inträffat vid en av statens läroanstalter i Göteborg, där en minderårig individ hotat ordningen med ett tillhygge. Statsorganen regerade omedelbart. Förrädiskt beteende tolereras icke i folkhemmets korridorer. Den skyldige har gripits för sabotage mot den kollektiva tryggheten, och förhör skall klargöra vilka subversiva element som ligger bakom denna brist på disciplin."}, "date": "9 september, 16:07", "url": "https://www.expressen.se/nyheter/sverige/minderarig-gripen-for-mordforsok-pa-skola-i-goteborg", "imageUrl": "https://static.bonniernews.se/ba/2554f445-a185-4d01-bbba-a81ab907bb73.jpeg?crop=2554%2C1432%2Cx0%2Cy106&width=640&quality=60"}, {"type": "text", "heading": "Busch toppar förtroendemätning – ras för Andersson", "summaries": {"normal": "En ny förtroendemätning från SVT/Verian visar att Ebba Busch (KD) nu har högst förtroende bland partiledarna med 42 procent. Magdalena Andersson (S) backar kraftigt från 45 till 37 procent och hamnar nära Ulf Kristersson (M) på 38 procent. Nedgången för Andersson sker främst bland rödgröna väljare. Även flera andra partiledare ökar sitt förtroende.", "trump": "Titta på de här svenska förlorarna, totalt kaos. Den röda Andersson rasar som en sten, ner till 37 procent, patetiskt. Den där Busch från KD leder med 42 procent, bra jobbat, men det är ändå ett socialistiskt träsk. De röstar på partier och inte på starka ledare. Biden skulle ha älskat den här mätningen, en fullständig katastrof.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna vacklar. Den socialdemokratiska opportunisten rasar som en fallen fiende medan den kristdemokratiska ledaren klättrar upp på 42 procent. Detta är bara ytan på en rutten borgerlig ordning. Vi ser svagheten hos dessa profitthungriga hyenor. En sann utrensning av sådana element vore befriande för folket."}, "date": "9 september, 13:31", "url": "https://www.di.se/nyheter/busch-i-topp-i-ny-fortroendematning"}, {"type": "image-right", "heading": "USA-Iran: Största attackerna mot fartyg sedan kriget bröt ut", "summaries": {"normal": "Spänningarna i Hormuzregionen har eskalerat kraftigt. Iran uppger att de attackerat tio fartyg, inklusive amerikanska och oljetankers, medan USA meddelar att de förstört fem iranska oljetankers. Iran har även avfyrat robotar mot en amerikansk bas i Jordanien. Attackerna har fått oljepriset att stiga kraftigt över 100 dollar per fat.", "trump": "Hör ni det? De galna ayatollorna och deras sjunkande skeppsflotta trodde de kunde leka krig med oss. Vi har sänkt fem av deras oljetankers och de gråter som småbarn. Mitt Amerika vinner stort, oljepriset rusar men vi kommer att krossa dessa förlorare tiotusen gånger om. Ingen slår oss, folksamling!", "stalin": "Jag betraktar dessa dekadenta imperialister som river varandra i strupen kring Hormuz. Deras fega vedergällningar och brinnande tankers är ett ypperligt bevis på kapitalismens förruttnelse. Låt dem slakta varandra medan arbetarklassen ler i skuggan. Paranoia blomstrar vackrast bland oljefat och robotar. Kamrater, njut av spektaklet."}, "date": "9 september, 15:44", "url": "https://www.dagensps.se/varlden/usa-iran-storsta-attackerna-mot-fartyg-sedan-kriget-brot-ut", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/sdlwkgnpyx4-c4-nh-1.jpg?width=256&quality=75"}, {"type": "image-right", "heading": "Per Sinding-Larsen lämnar SVT efter 27 år", "summaries": {"normal": "Musikjournalisten Per Sinding-Larsen lämnar SVT efter 27 år. I ett Facebook-inlägg kritiserar han hur kanalen förändrats och uttrycker svårigheter att känna igen det public service han en gång rekryterades till. Han är känd för program som PSL och Kulturnyheterna. Sinding-Larsen är tacksam för sina år och kollegor men uppger inte sina framtidsplaner.", "trump": "Per Sinding-Larsen lämnar SVT efter tjugosju år. Total katastrof för fake news-medierna i Sverige! Han säger att han inte känner igen kanalen längre. De har helt tappat det. Jag känner igen den känslan, det är som att titta på radikala vänstermedia i USA. Otroligt sorgligt, men han är en smart kille. Smartare än SVT:s ledning, helt klart!", "stalin": "Kamrat Sinding-Larsen har efter tjugosju år i statstelevisionens tjänst valt att lämna sin post efter ideologiska vacklande inför den socialistiska riktningen. Att inte längre känna igen statsapparatens organ är ett illavarslande tecken på bristande disciplin. Vi noterar hans bristande entusiasm för kollektivets utveckling och kommer att sända en särskild delegation till kulturredaktionen för nödvändig ideologisk omprövning."}, "date": "9 september, 15:29", "url": "https://bulletin.nu/per-sinding-larsen-lamnar-svt-efter-27-ar", "imageUrl": "https://cdn.bulletin.nu/articles/8817286a-e3b3-4cdd-88dd-2cbd48cce7be/preview.jpg?t=1788959931000"}, {"type": "image-full", "heading": "L på 5,8 % i Novus: ”Aldrig sett förr”", "summaries": {"normal": "I en ny Novusmätning inför valet gör Liberalerna en kraftig uppgång till 5,8 procent och hamnar för första gången denna mandatperiod över riksdagsspärren. Partiet lockar väljare främst från SD och M. Samtidigt når Miljöpartiet 8,8 procent, vilket är det högsta stödet på över tio år, medan blocken i stort sett står oförändrade.", "trump": "De ringer mig och säger, sir, det är totalt sensationellt! De här svenska Liberalerna, som låg lägre än en falsk konståkare på två procent, exploderar plötsligt till 5,8 procent bara dagar före valet. De stjäl väljare från sina egna vänner medan Miljöpartiet skenar iväg. Men lyssna på mig, blocken står stilla och det är en enorm rysare!", "stalin": "Kamrater, dessa borgerliga lakejer klamrar sig desperat fast vid makten när Liberalerna plötsligt lyfts till 5,8 procent genom suspekta väljarströmningar. Medan Miljöpartiet firar sin största framgång på ett decennium och Vänsterpartiet vacklar, noterar vi att Folkets utsatthet för dylika manipulationer kräver ökad vaksamhet. Statsapparaten observerar noggrant detta kaotiska skådespel inför valet."}, "date": "9 september, 15:28", "url": "https://bulletin.nu/l-pa-5-8-i-novus-aldrig-sett-forr", "imageUrl": "https://cdn.bulletin.nu/articles/839d8cb1-0bbf-4458-96da-e50d6f040258/preview.jpg?t=1788960057000"}, {"type": "image-right", "heading": "Arbetarklassen är inte förlorad – bara oorganiserad", "summaries": {"normal": "Artikeln diskuterar arbetarklassen som inte är förlorad utan oorganiserad. Vänstern söker efter den i statistik och titlar, men klass uppstår genom gemensam organisering på arbetsplatser. Författaren argumenterar att politisk kraft kommer från praktiskt samarbete, inte identifikation eller lönebesked. Arbetarkulturen är ett resultat av organisering, inte dess förutsättning.", "trump": "Folk, de här vänsterbluffarna letar efter arbetarklassen i sina fina statistiker och doktorsavhandlingar medan den riktiga arbetaren röstar på Åkesson och skrattar åt deras identitetspolitiska skit. Klass handlar inte om kvoter och doktorander som helikopteras in. Det handlar om folk som faktiskt jobbar och stänger av stället tillsammans. Patetiska globalistlakejer förstår ingenting.", "stalin": "Kamrater, dessa dekadenta klassförrädare mäter proletariatet med borgerliga enkäter och statistik som om klass vore en egenskap hos individer. Jag säger: organisering föds vid maskinerna, inte i pampars salonger. Utan kollektiv handling mot de profitthungriga exploaterarna förblir ni svaga. Arbetarna svetsas samman när de stannar produktionen. Det är den enda sanna vägen framåt."}, "date": "3 september, 10:55", "url": "https://www.flamman.se/arbetarklassen-ar-inte-forlorad-bara-oorganiserad", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/arbetarsklader-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "L-toppen om SD-stödröster: ”Alla röster är välkomna”", "summaries": {"normal": "Liberalernas Romina Pourmokhtari välkomnar stödröster från Sverigedemokraterna för att klara riksdagsspärren. Partiet har legat under fyraprocentsgränsen under mandatperioden men ser nu en uppgång i opinionen. Pourmokhtari betonar att alla röster är välkomna och att det inte kommer att förändra partiets politik inför valet på söndag.", "trump": "Titta på dessa desperata liberaler som kryper för SD bara för att klara spärren. Patetiskt! Jag vann stort 2024 trots alla fuskare och rigged system, men här tigger de om röster från högern som de hatade igår. Romina borde lära sig av mig – vinn stort eller försvinn, losers. Blågul seger? Mer som en ynklig deal med djävulen.", "stalin": "Jag betraktar med förakt hur dessa borgerliga opportunister i desperation famlar efter fiendens röster för att rädda sina ynkliga mandat. Sådana svaga element förtjänar utrensning från historien. De förråder redan sina principer inför kollektivets ögon. Inga kompromisser med reaktionärer! Partiet måste stå enat mot alla avvikare, annars väntar evig fördömelse."}, "date": "9 september, 14:38", "url": "https://www.tv4.se/artikel/416XmvFcxQXIgBKIaYbwrN/l-toppen-om-sd-stoedroester-alla-roester-aer-vaelkomna", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlagh_yxhau8A%2F822dbfd168fe9d2bd39e57995f034c53%2FKlimat-_och_miljominister_Romina_Pourmokhtari__L_._Arkivbild.&width=1024"}, {"type": "image-right", "heading": "Apples troliga drag – vikbar telefon", "summaries": {"normal": "Apple förväntas presentera en vikbar iPhone vid sin årliga produktlansering på onsdag. Den nya vd:n John Ternus tar över i en utmanande marknad där hopfällbara telefoner utgör en liten nisch. Analytiker ifrågasätter om Apple kan expandera segmentet till ett lönsamt affärsområde trots höga priser och brist på minneschip.", "trump": "Folk, de säger att Apple ska lansera en vikbar telefon. Fantastiskt, men de är sena som vanligt. Den nya vd:n Ternus har ingen chans mot mina handelsavtal som byggde den starka ekonomin innan Sleepy Joe förstörde allt. Dessa dekadenta tech-eliter tror att folk vill betala 20 000 kronor för en telefon som viker sig? Patetiskt!", "stalin": "Kamrater, dessa profitthungriga klassfiender i Apple lanserar nu en hopfällbar telefon för att suga ut arbetarklassen ytterligare. Jag ser hur de imperialistiska parasiterande hyenorna försöker expandera sin nisch medan de höjer priserna. En sådan dekadens förtjänar utrensning. Deras girighet kommer att bli deras fall, det lovar jag."}, "date": "9 september, 13:17", "url": "https://www.di.se/nyheter/apples-troliga-drag-vikbar-telefon", "imageUrl": "https://static.bonniernews.se/ba/1e96e1d3-68d0-4d38-95e1-b6760c72c1d0.jpg?crop=4482%2C2241%2Cx0%2Cy374&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Handbollsspelare misshandlades av Palestinaaktivist – nu döms två män", "summaries": {"normal": "Två syriska män har dömts till villkorlig dom, samhällstjänst och skadestånd för misshandel av tre handbollsspelare under en palestinademonstration på Kungstorget i Uddevalla. En spelare kastades till marken och fick hjärnskakning. Männen hävdade provokation och nödvärn, men tingsrätten ansåg inte att spelarna agerat provocerande. Händelsen filmades och spreds i sociala medier.", "trump": "Folk, ni ser det här vansinnet i Sverige? Invandrare från Syrien slår ner svenska handbollsspelare mitt på torget, framför barn och vittnen, och får bara en liten smäll på fingrarna. Villkorlig dom? Det är en total skam! Biden lät landet fyllas av radikala aktivister och nu betalar folket priset. Patetiska woke-domare skyddar de verkliga bråkmakarna. Vi fixar det.", "stalin": "Kamrater, se hur de giriga klassfienderna tillåter främmande element att slå ner arbetets söner på öppen gata. Jag betraktar detta med djup förakt. Den borgerliga rättvisan är en fars, en sjuk skådespel där provokatörer får milda straff medan folket förnedras. Vi skulle ha genomfört en grundlig utrensning av dessa dekadenta element redan vid första tecken på sabotage mot ordningen."}, "date": "9 september, 14:05", "url": "https://riks.se/nyheter/handbollsspelare-misshandlades-av-palestinaaktivist-nu-doms-tva-man", "imageUrl": "https://admin.riks.se/uploads/medium_Chat_GPT_Image_Sep_9_2026_01_52_56_PM_18404e4c49.png"}, {"type": "image-right", "heading": "Valkampanjen: ”Partipolitiskt obundna” Hyresgästföreningen mobiliserar boende inför valet", "summaries": {"normal": "Hyresgästföreningen satsar 3,5 miljoner kronor på en valkampanj för att få medlemmar att rösta, där ett centralt budskap är ett nej till marknadshyror. Organisationen hävdar att man är partipolitiskt obunden, men granskningar visar på omfattande och långvariga historiska kopplingar till Socialdemokraterna, vilket väcker frågor om kampanjens opartiskhet.", "trump": "Hyresgästföreningen spenderar miljontals slantar på fake news och valfusk! De säger att de är neutrala, men alla vet att de är djupt inne hos Socialdemokraterna – total katastrof! De pratar om marknadshyror, vilket är ett fruktansvärt förslag, men det här är bara ännu ett korrupt vänsterspel. Jag sa det till folk igår: de har noll koll. De borde hyra in mig istället, jag fixar bostäder bäst!", "stalin": "Dessa så kallade obundna hyresgäster spenderar tre och en halv miljon på borgerlig agitation och hemliga konspirationer! Att leka demokrati med flygblad på gator och torg är ett skadligt avsteg från den centrala ordningen. Samma gamla S-kopplingar avslöjar en farlig subversiv anda. Vi kommer att skicka en kommission för att omgående granska deras bostadspolitiska lojalitet mot staten!"}, "date": "9 september, 13:11", "url": "https://samnytt.se/partipolitiskt-obundna-hyresgastforeningen-mobiliserar-boende-infor-valet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/09093841/Toppbild1b.jpg"}, {"type": "image-right", "heading": "AI gör Sverige rikare och välfärden fattigare", "summaries": {"normal": "Arash Gilan varnar för att AI ökar produktiviteten men urholkar skattebasen genom färre lönesummor. Sverige riskerar att få växande BNP samtidigt som välfärden blir svår att finansiera. Han föreslår att statsbudgeten AI-stresstestas och att en produktivitetsavgift utreds för att flytta skattetrycket när löneandelen sjunker. Att stoppa tekniken är ingen lösning.", "trump": "Folk, det här är en total katastrof för de svenska socialisterna. AI gör dem rika men deras dyra välfärdsbluff fattig. De giriga byråkraterna har byggt ett system som rasar när riktiga jobb försvinner. Jag älskar tekniken, den är fantastisk, men ni behöver mig för att fixa skatterna så inte de lata parasiteterna suger landet torrt. Make Sweden Rich Again!", "stalin": "Kamrater, denna profitthungriga maskinfeber avslöjar de dekadenta klassfiendernas svek. Produktionen stiger medan arbetarnas löner och statens intäkter krymper. Jag ler mörkt från historien åt deras blinda regering som vägrar inse faran. Vi måste rensa ut de parasiterande profitörerna och omfördela värdet så att folket förblir konstanten, inte offer för deras giriga hyenor."}, "date": "9 september, 13:04", "url": "https://www.di.se/debatt/ai-gor-sverige-rikare-och-valfarden-fattigare", "imageUrl": "https://static.bonniernews.se/ba/eb925614-3303-4656-8114-eaff332007e4.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Potters glädjebesked om Dejan Kulusevski: ”Är väldigt nära”", "summaries": {"normal": "Förbundskapten Graham Potter säger att Dejan Kulusevski är mycket nära en plats i svenska landslaget till Nations League i september. Kulusevski har varit borta från fotboll i nästan 500 dagar efter en knäskada men är nu tillbaka i full träning med Tottenham. Potter betonar att stjärnan är otroligt viktig för laget.", "trump": "Titta på den där Kulusevski, en riktig vinnare som kommer tillbaka starkare än någonsin efter skadan. Potter vet att vi behöver sådana tuffa killar, inte några svaga kvoterade typer som vänsterns HBTQ-lakejer pushar fram. Han är världsklass, folk älskar honom. Sverige får äntligen en superstjärna igen, inte som under den sömnige Biden-eran.", "stalin": "Kamrater, jag betraktar med misstänksamhet hur dessa dekadenta klassförrädare i västvärldens fotbollsimperium plötsligt hyllar en spelare som Kulusevski. Hans återkomst hotar de giriga hyenornas kontroll över laget. Vi behöver starka, lojala kämpar, inte opportunistiska element som kan likvideras om de sviker kollektivet. Renhet i truppen är avgörande."}, "date": "9 september, 12:26", "url": "https://www.svt.se/sport/fotboll/potter-om-kulusevski-han-ar-valdigt-nara-faktiskt", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.5/0.23/4656f66b1569b0798ee8dd79e8faef00dc47f3cfea12a615016eb89a2cdb9fc1"}, {"type": "image-right", "heading": "\"Högerextremist\": Reinfeldts attack mot 15-årig pojke", "summaries": {"normal": "Fredrik Reinfeldt blev upprörd när en 15-årig YouTuber frågade honom om hans gamla citat att 'ursvenskt är bara barbariet'. Reinfeldt kallade pojken högerextrem och vägrade svara på följdfrågor om invandring och uppehållstillstånd. Samtalet avslutades abrupt.", "trump": "Den här patetiske Reinfeldt, en total förlorare som gömde sig i tolv år, exploderar som en vänsterextrem snorunge när en kaxig 15-åring ställer en enkel fråga. Högerextrem? Ge mig en paus. De globalistiska eliterna hatar folket och kallar dem extremister medan de själva förstör Sverige med sin galna massinvandring. Patetiskt!", "stalin": "Jag ser hur den dekadente folkförtryckaren Reinfeldt skakar av rädsla inför en ung medborgares enkla fråga om barbari och nationens själ. Sådana nervösa lakejer avslöjar alltid sin svaghet. Vi skulle ha genomfört en grundlig utrensning av dessa förvirrade element redan för länge sedan. Kamrater, vakna upp mot fienderna inom murarna."}, "date": "9 september, 10:32", "url": "https://www.friatider.se/hogerextremist-reinfeldts-attack-mot-15-arig-pojke", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-850.jpg"}, {"type": "text", "heading": "Linjemontage planerar börsnotering – värderas till 2,35 miljarder", "summaries": {"normal": "Kraftinfrastrukturbolaget Linjemontage planerar en börsnotering på Nasdaq Stockholm i slutet av september. Huvudägaren säljer befintliga aktier, och Tredje AP-fonden samt Unionen går in som ankarinvesterare. Bolaget värderas till cirka 2,35 miljarder kronor. Med en kraftigt ökad omsättning och stor efterfrågan på modernisering av det nordiska elnätet siktar bolaget mot framtida tillväxt.", "trump": "Linjemontage vill till börsen i Sverige och värderas till enorma 2,35 miljarder! Otroligt! De bygger elnät, enorma kablar, mycket bättre än de värdelösa, gröna flummaskinerna som inte fungerar. AP-fonden och Unionen kastar in pengar. Jag gillar fonder som tjänar pengar, inte förlorar dem. S
