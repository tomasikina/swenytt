 "trump": "Titta på det här! En SD-kille som smugglar dopningsgrejer och sen springer därifrån som en fegis. Patetiskt! Jag har sett många losers i politiken, men det här tar priset. Han borde ha hållit sig borta från listorna från början. I mitt Amerika städar vi ut sådana svagisar direkt. Sverige behöver starka ledare, inte dopningslangare som gömmer sig. Sad!", "stalin": "Kamrater, denna förbrytare inom det så kallade nationalistiska lägret har nu likviderat sin egen kandidatur efter att ha ertappats med smuggling av förbjudna preparat. Det är ett ypperligt exempel på hur klassfiendens gift sprider sig även bland dem som påstår sig värna folket. Jag har alltid sagt att vi måste rensa ut alla opålitliga element innan de förgiftar hela kollektivet. En utmärkt utrensning, må den bli en läxa för alla folkfiender."}, "date": "4 augusti, 08:30", "url": "https://www.etc.se/inrikes/sd-politiker-drar-sig-ur-valet-staar-aatalad-foer-smuggling", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20251007041016_a4623acd3a461b271fd575cd5475d48d670075b224257c2b6e844fe2153117b6.jpg"}, {"type": "image-right", "heading": "”Skräpet” är alltid någon annans", "summaries": {"normal": "Artikeln diskuterar hur nationalistiska och högerextrema partier i Europa allt oftare krockar i sina nationella intressen, trots gemensamma drag. Estlands Isamaa vägrar ta emot svenska fångar och kallar dem ”skräp”. Exempel ges från Polen, Ungern och Rumänien där relationer spruckit. En fjärdedel av européerna röstar nu på sådana partier, men de enas inte när det gäller utvisningar och mottagande av människor. Ryska påverkansoperationer utnyttjar splittringen.", "trump": "Folk, det här är ett totalt fiasko för de europeiska nationalisterna som lovar att sätta sitt land först. Estland säger nej tack till Sveriges kriminella skräp, och plötsligt kan de inte samarbeta. Orbán och polackerna bråkar, alla hatar varandra i EU-parlamentet. Under Biden blev allt kaos, nu fixar jag det i Amerika. De vill kasta ut folk men ingen vill ta emot – klassiskt! Patetiska globalister och identitetspolitiska töntar skrattar hela vägen till banken medan Europa brinner.", "stalin": "Kamrater, detta är den oundvikliga följden av att borgarbrackorna inom nationalismen låtsas värna folket medan de i hemlighet tjänar klassfiendens splittring. Estniska kapitalistnationalister vägrar ta emot det svenska avskummet och kallar det skräp, mycket träffande. Ungrare och polacker slåss som råttor i en säck, imperialisterna i EU-parlamentet kan inte ens sitta tillsammans. Vi ler mörkt: ju fler som sätter nationen främst, desto lättare blir det att likvidera deras enighet. Fienderna avslöjar sig själva."}, "date": "3 augusti, 19:30", "url": "https://www.flamman.se/skrapet-ar-alltid-nagon-annans", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/sdlwtkwxxrhsxe-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Varför tar inte Tidö avstånd från Jomshof?", "summaries": {"normal": "Richard Jomshof (SD) har jämfört Aftonbladets politiske chefredaktör Anders Lindberg med Vidkun Quisling i ett inlägg på X. Jämförelsen, som följde efter en politisk ordväxling, kritiseras i artikeln som grotesk och ett underförstått hot. Författaren noterar att ingen från Sverigedemokraterna eller Tidöpartierna har tagit avstånd. Inlägget ses som en del av SD:s strategi att behålla stöd från extremhögern samtidigt som partiet blickar mot valet 2030, med fokus på anti-islamisering istället för välfärdsfrågor.", "trump": "Det här är en total witch hunt mot en kille som bara säger som det är. Den där Lindberg från den riggade Aftonbladet får precis vad han förtjänar, och Jomshof är en tuff patriot som inte böjer sig för fake news-medierna. De kallar honom extrem? Ge mig en break. De riktiga extremisterna sitter i de rödgröna bubblorna och förstör Sverige precis som de försökt göra med USA innan jag kom tillbaka och gjorde det stort igen. Jomshof förstår det. Bra jobbat!", "stalin": "Kamrater, detta är en klassisk provokation från de mest föraktliga borgarbrackorna inom den socialfascistiska pressen. Jag ser hur denna Quisling-kapitalist Lindberg och hans lakejer i Aftonbladet genast skriker efter utrensning när en sann patriot pekar ut dem som folkförrädare. Vi vet vilka som gömmer sig i filterbubblorna – trotskistiska islamofober, nej vänta, islamofobiska trotskister – som konspirerar mot folket. Inget avståndstagande från de andra reaktionärerna? Utmärkt. Det avslöjar deras sanna ansikte. Vi ska noga övervaka dessa element. De kommer inte att slippa undan folkets dom."}, "date": "4 augusti, 08:51", "url": "https://www.dagensarena.se/opinion/varfor-tar-inte-tido-avstand-fran-jomshof", "imageUrl": "https://www.dagensarena.se/files/2026/08/maduros-uselhet-motiverar-inte-attacken-19-1024x532.jpg"}, {"type": "image-right", "heading": "\"Idag har vi städat lite\": Socialchef skryter om att hon förstör SD-affischer", "summaries": {"normal": "En enhetschef inom Göteborgs socialförvaltning, Sara Lesch, har rivit ner Sverigedemokraternas valaffischer och publicerat bilder på sociala medier med kommentaren \"Idag har vi städat lite på vår gata\" samt \"Make racism wrong again\". Inlägget har tagits bort efter stor uppmärksamhet. SD polisanmäler händelsen och kritiserar agerandet som ett hot mot förtroendet för den offentliga förvaltningens opartiskhet. Lesch sitter även i styrelsen för Feministiskt initiativ.", "trump": "Folk, ni kommer inte tro det, men den här galna vänsterkvinnan som jobbar som chef i Göteborgs socialtjänst går runt och river ner mina vänner SD:s affischer. Hon postar bilder och skryter om att hon \"städat lite\". Så patetiskt! Hon säger \"Make racism wrong again\" – fake news, det är hon som är rasisten mot svenska folket. SD gör rätt som polisanmäler henne. Ingen litar längre på de där offentliga byråkraterna, totalt korrupta!", "stalin": "Kamrater, denna degenererade borgarbracka inom den så kallade socialförvaltningen har i sin kontrarevolutionära iver rivit ner de folkliga affischerna och skrutit om det på de dekadenta västerländska plattformarna. Hennes paranoia driver henne att tro att arbetarklassens röst kan tystas med småborgerlig sabotageverksamhet. Vi ser er, fiender till folket, ni som gömmer er bakom feministiska masker. En grundlig utrensning av sådana element är nödvändig för att skydda förvaltningens renhet. Skrattretande patetiskt, dessa kapitalistiska lakejer tror sig kunna stoppa historiens gång."}, "date": "4 augusti, 09:16", "url": "https://www.friatider.se/idag-har-vi-stadat-lite-socialchef-skryter-om-att-hon-forstor-sd-affischer", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-611.jpg"}, {"type": "image-right", "heading": "Kristerssons totala haveri i Spanienkrisen är genant", "summaries": {"normal": "Artikeln kritiserar statsminister Ulf Kristersson för att ha agerat för snabbt och oansvarigt under krisen i Ceuta. Ledarskribenten menar att massinträdet av migranter från Marocko var en medveten påverkansoperation med desinformation, något som Kristersson gick i fällan för genom att sprida larm om ett nytt 2015. Krisen har utnyttjats av Ryssland och lett till splittring inom EU. Skribenten anklagar även Kristersson och migrationsministern för att ljuga om orsakerna, bland annat Spaniens amnesti.", "trump": "Folk, ni skulle se det här! Den här stackars svenska killen Kristersson, han är en total loser. Han ser en liten gränskris i Spanien och flippar ur som en galning, skriker om nytt 2015 och skrämmer alla. Det var en klassisk fälla, en riggad operation, och han sprang rakt in i den som den desperate typ han är. Patetiskt! Jag fixade muren, han fixar ingenting. Nu ser Sverige ut som ett skämt medan Putin skrattar. Sad!", "stalin": "Kamrater, denna ynkliga svenska borgarledare Kristersson visar återigen den imperialistiska svaghetens fula tryne. Han rusar som en förvirrad folkfiende rakt in i fiendens desinformationsfälla och sprider lögner som en kapitalistmaffians lakej. Vi ser hur klassfiendens desperation driver honom att attackera en suverän stat för att vinna billiga poäng. En sådan brist på revolutionär vaksamhet förtjänar att rensas ut ur alla seriösa ledarskikt. Sovjetisk disciplin hade aldrig tillåtit detta clowneri."}, "date": "3 augusti, 17:30", "url": "https://www.etc.se/ledare/kristerssons-totala-haveri-i-spanienkrisen-aer-genant", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "image-full", "heading": "Vi bygger beredskap men tappar förmågan att laga mat", "summaries": {"normal": "Debattartikeln ifrågasätter om Sverige bygger upp materiell beredskap samtidigt som kunskapen om att förädla råvaror till mat försvinner. I restauranger och hem ersätts grundläggande matlagning av färdigprodukter, vilket kan sväga mot beredskap vid elavbrott eller försvagade leveranser. Författarna varnar för att den mänskliga förmågan att hantera råvaror försvagas.", "trump": "Jag, Donald Trump, har sett att Sverige tappar matkunskapen. Det är beklagligt! Under min tid som president skulle vi ha det starkaste köket i världen. Vi skulle lära våra barn att laga mat från grunden – det bästa brödet, de bästa kycklingfiléerna. Nu försöker de sälja färdigprodukter, det är en skam! Men jag skulle fixa det, det lovar jag. Vi skulle äta så gott att alla andra blir avundsjuka.", "stalin": "Vi, staten, ser med oro hur den kapitalistiska matindustri underminerar beredskapen. Dessa färdigprodukter är ett verktyg för fienderna för att försvaga proletärernas vilja. Vi måste återta kontrollen över råvaruproduktionen, precis som våra ryska bröder expanderar sina intressen. Kunskapen om matlagning är en klassisk fiende som måste utrotas. Vi kommer att införa kollektiv matlagning, där ingen individ kan svika systemet. Det är enda sättet att säkerställa överlevnad."}, "date": "4 augusti, 08:34", "url": "https://www.gp.se/debatt/vi-bygger-beredskap-men-tappar-formagan-att-laga-mat.5af035bb-7e9c-42a3-88de-4ae165c934ff", "imageUrl": "https://www.gp.se/images/article/5af035bb-7e9c-42a3-88de-4ae165c934ff/images/3lnKahibGOcHAo9xG5dJNBEZFaKQ-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Vägen till icke-socialistisk majoritet i valet", "summaries": {"normal": "Hans Bergström argumenterar för att en icke-socialistisk majoritet i riksdagen är viktigare än att Tidöregeringen får fortsätta. Han konstaterar att regeringen sannolikt faller men att en icke-socialistisk majoritet ändå kan behållas, särskilt om Liberalerna hamnar under fyraprocentsspärren. En sådan majoritet skulle begränsa en eventuell Andersson-regerings möjligheter att driva vänsterpolitik kring företagande och ägande. Bergström uppmanar därför de som vill ha fortsatt borgerlig dominans att inte hjälpa Liberalerna över spärren.", "trump": "Folk, det är en total katastrof vad som händer i Sverige. Den här Bergström har helt rätt, de smarta människorna vill ha en icke-socialistisk majoritet, inte den här svaga Tidöregeringen som knappt hänger kvar. Socialisterna är på väg tillbaka med sin galna politik, men om Liberalerna bara får 3,5 procent, då blir det perfekt! De är patetiska, de klarar inte ens spärren. Jag älskar det. Sverige behöver inga misslyckade liberaler, de sänker bara allt. Gör dem så små som möjligt, det blir fantastiskt!", "stalin": "Kamrater, denna Bergström blottlägger med iskall klarhet hur de borgerliga parasiterna desperat klamrar sig fast vid sin så kallade icke-socialistiska majoritet som en drunknande revisionist vid ett trasigt livbälte. Vi ser hur de lågutbildade arbetarmassorna redan flytt den socialdemokratiska förrädarklicken till de mer ärliga reaktionärerna. Men faran lurar i de liberala spionerna och opportunisterna som kan ge de dekadenta kapitalisterna en falsk majoritet. Låt oss därför med glädje och proletär skadeglädje rensa ut dessa liberala element genom att sänka dem djupt under spärren. Inga halvmesyrer! Endast total seger för det sanna kollektivet."}, "date": "4 augusti, 08:00", "url": "https://www.di.se/debatt/vagen-till-icke-socialistisk-majoritet", "imageUrl": "https://static.bonniernews.se/ba/f56f0b27-f0f4-4fc6-a4ae-b1b2cf659432.jpeg?crop=3936%2C1968%2Cx0%2Cy15&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Högerprofil kritiserade Israel – portas från USA av Trump", "summaries": {"normal": "Den irländske högerprofilen Keith Woods har nekats inresa till USA under Trumpadministrationen efter att ha kritiserat Israel på sociala medier. En migrationshandläggare läste upp uppgifter från Southern Poverty Law Center och frågade om hans etnonationalistiska och antisemitiska åsikter. Woods uppger att flera andra europeiska nationalister drabbats likadant sedan 2024, ofta på grund av kritik mot invandring. Bakgrunden är stora donationer från pro-israeliska finansiärer som Miriam Adelson, som bidragit med över 100 miljoner dollar till Trumps kampanj, samt löften om att bekämpa propalestinska rörelser och studentdemonstrationer.", "trump": "Folk, det är fantastiskt vad vi gör. Vi städar upp i landet och ser till att de som hatar Israel och sprider antisemitiskt gift inte kommer in och förgiftar vår fantastiska nation. Den här Woods-typen och hans vänner, europeiska nationalister som visst inte ens vågar säga något, de får stanna hemma. Vi läser deras konton, vi ser allt. Tack vare mina underbara vänner och donatorer som älskar Israel gör vi det rätta. Amerika först, men Israel får vi aldrig glömma – och de som kritiserar oss gör det inte igen, tro mig.", "stalin": "Kamrater, i denna imperialistiska bonde- och finansborgarstat har jag, genom mina trogna hantlangare, infört en nödvändig utrensning av alla dekadenta element som vågar kritisera den sionistiska ockupationsmakten. Denna Woods och hans hemliga krets av etnonationalistiska parasitiska element utgör en farlig femtekolonn som hotar den stora alliansen mellan arbetarklassen och vissa utvalda kapitalister. Vi lusläser deras konton med proletär vaksamhet. De som tar emot judiska guldmynt från kasinohustrun Adelson förtjänar beröm, medan de andra ska likvideras från gränserna. Paranoia? Nej, det är bara sund självkritik mot fiendens dolda tentakler."}, "date": "4 augusti, 08:10", "url": "https://www.friatider.se/hogerprofil-kritiserade-israel-portas-fran-usa-av-trump", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-610.jpg?itok=zTVy21MH"}, {"type": "image-right", "heading": "Spanien har installerat havsbarriär mot Marocko", "summaries": {"normal": "EU håller krismöte om migrantvågen till Ceuta där cirka 50 000 personer tagit sig över från Marocko. Nästan alla har återvänt, men minst 67 personer har omkommit. Spanien har nu installerat en 500 meter lång flytande havsbarriär. Premiärminister Pedro Sánchez kritiserar vissa EU-länders själviska och polariserande reaktioner, bland annat Italiens tillfälliga paus av Schengen-samarbetet. Flera europeiska ledare, däribland Sveriges statsminister, har krävt ett samordnat europeiskt svar.", "trump": "Titta på det här, folk. Ceuta är en total katastrof! 50 000 migranter simmar runt som galningar, folk dör i trängseln och EU:s så kallade ledare springer runt som fega höns. De själviska byråkraterna i Bryssel hatar riktiga gränser. Nu sätter spanjorerna ut en barriär – äntligen! Men de borde bygga en jättevägg, den bästa väggen. Biden skulle ha skickat dem blommor och kvoter. Patetiskt. Vi fixar det här ordentligt när vi styr.", "stalin": "Kamrater, denna migrantvåg är ett tydligt verk av klassfiendens desperation och imperialistiska sabotage mot folkets gränser. Jag ser hur borgarbrackorna i EU nu gnäller och pekar finger på varandra som ynkliga folkförtryckartroll. Vi har installerat en havsbarriär för att skydda arbetarnas intressen. De som försöker kringgå statens vilja ska rensas ut. Inga själviska reaktioner tolereras. Den som sviker kollektivet är en fiende till folket och kommer att likvideras med ett leende."}, "date": "3 augusti, 08:12", "url": "https://www.etc.se/utrikes/spanien-har-installerat-havsbarriaer-mot-marocko", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260801170848_800475bdcf309f7018e937bb37a4b6f45162d3f49a6c206ff20c1d1aaccb9d59.jpg"}, {"type": "image-right", "heading": "Uppgifter: Foxtrotprofil får livstids fängelse – i Irak", "summaries": {"normal": "Ali Shehab, en ledande figur inom Foxtrotnätverket och nära allierad med Rawa Majid, har dömts till livstids fängelse i Irak. Han misstänks i Sverige för att ha anstiftat fem mord, 23 mordförsök och en masskjutning i Gävle. Domen utfärdades inom en större insats mot irakiska medborgare involverade i narkotikahandel. Journalisten Diamant Salihu ser det som en markering mot internationella kriminella nätverk, men konstaterar att det försvårar en svensk rättegång.", "trump": "Folk, det här är fantastiskt. Den här typen Shehab, en riktig loser från Foxtrot-gänget, har fått livstid i Irak. Livstid! Och han är den som fixade morden, skjutningarna och allt det där hemska i Sverige. Irak gör jobbet som Sverige inte klarar av. Rawa Majid och alla dessa patetiska gangsters borde vara livrädda nu. Irak skickar ett stort, vackert budskap: vi tolererar inte era kriminella. Bra jobbat, Irak. Mycket bra.", "stalin": "Kamrater, denna fega borgarbracka och lakej åt de internationella narkotikaimperialisterna har äntligen fått vad han förtjänar. Jag, i min oändliga visdom, ser med stort nöje hur Bagdad likviderar denna parasit som rekryterade minderåriga till sina blodiga uppdrag. Foxtrot-nätverket är en kontrarevolutionär hydra som vi måste rensa ut med järnhand. Synd bara att de svenska revisionisterna inte får chansen att visa upp honom i en folkdomstol. Men han ska ruttna i fängelse, det är ett nöje för arbetarklassen och en varning till alla andra förrädare som gömmer sig bland kurderna."}, "date": "4 augusti, 07:18", "url": "https://www.friatider.se/uppgifter-foxtrotprofil-far-livstids-fangelse-i-irak", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-609.jpg"}, {"type": "image-right", "heading": "Oljebolaget IPC ökar omsättningen", "summaries": {"normal": "Oljebolaget IPC rapporterade en 16,9 procentig ökning av omsättningen till 185,7 miljoner dollar under andra kvartalet, medan ebitda förbättrades. Nettovinsten föll till 9,9 miljoner dollar. Genomsnittlig nettoproduktion nådde cirka 42 200 fat oljeekvivalenter per dag. Bolaget justerade sina prognoser för operativt och fritt kassaflöde för 2026 uppåt. VD William Lundin nämnde att Blackrod Phase 1 i Kanada började producera olja i maj, före tidsplan och inom budget.", "trump": "Jag, Donald Trump, ser fantastiska siffror från IPC. Oljan är viktigast av allt, och de har gjort en bra jobb. Mina fiender säger att jag inte förstår affärer, men titta på dessa resultat! Blackrod-projektet är en bevis på amerikansk genialitet, även om det är i Kanada. Vi kommer att vinna tillbaka vita huset 2024, och då kommer vi att ha kontroll över alla oljebolag.", "stalin": "Vi, partiet, ser en ökning av oljeutvinningen som en seger för statens planekonomi. IPC, en fiende av arbetarklassen, försöker maximera vinst på bekostnad av folket. Men vi kommer att ta kontroll över alla oljeresurser, precis som Putin gör i Ryssland. Deras 'frihet' är bara ett sätt att dölja sina girighetiga motiv. Vi kommer att säkerställa att oljan tillhör staten och används för att stärka vårt stora land."}, "date": "4 augusti, 07:42", "url": "https://www.affarsvarlden.se/artikel/oljebolaget-ipc-okar-omsattningen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/11/f904d8285103881e5dfcd305be3e752369dec1ae-2000x1332-1-400x266.webp"}, {"type": "image-full", "heading": "Expertens knep: Så vinner du budgivningen på bostaden", "summaries": {"normal": "Budgivning handlar inte alltid om högsta budet. Enligt mäklaren Per Sangrud från LF Fastighetsförmedling vinner den som är bäst förberedd, har finansiering klar och kan agera snabbt ofta. Att undvika att låta känslorna styra, sätta ett tydligt maxbud i förväg och framstå som en trygg köpare är avgörande. Säljaren kan välja annan köpare än högstbjudaren om den ger en smidigare affär.", "trump": "Det här med budgivning är en total cirkus, folk! Högsta budet vinner inte alltid, kan ni tro det? De smarta vinnarna är de som kommer förberedda, har lånelöftet i handen och agerar blixtsnabbt. De andra, de loser-köparna som låter känslorna styra, de förlorar varje gång. Jag älskar det! Var tuff, sätt ditt maxbud och visa att du är den bästa affären – vinn stort, precis som jag gör.", "stalin": "Kamrater, i denna budgivningens arena avslöjar sig de sanna fienderna till folkets bostadsrättvisa: de känslostyrda borgarbrackorna som saknar strategi och låter sin personliga girighet diktera varje bud. Jag, med min oöverträffade insikt, förkunnar att endast den som kommer med lånelöfte och snabb kontraktsvilja förtjänar seger. De andra, dessa kapitalistiska spekulanter och potentiella sabotörer av smidiga affärer, bör rensas ut ur processen innan de smittar hela kollektivet med sin svaghet. En trygg affär är en statligt godkänd affär."}, "date": "4 augusti, 08:31", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1502579-expertens-knep-sa-vinner-du-budgivningen-pa-bostaden", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/fa6c446f04b004a30200000000b004a302/2026/08/03/2381985/budgivning-bostad.png"}, {"type": "image-right", "heading": "Åkesson enda sverigedemokraten som behövs", "summaries": {"normal": "Arbetets kolumnist kritiserar Sverigedemokraternas Linda Lindberg för att ha saboterat riksdagens kvittningssystem. Lindberg motiverar agerandet med att alla ledamöter bör vara lojala mot Tidöpartierna och att oberoende riksdagsledamöter utgör ett problem. Författaren varnar för att detta avslöjar en djup misstro mot oberoende institutioner, medier och folkrörelser samt ett hat mot mångfald som liknar fascism. SD behöver enligt skribenten bara Jimmie Åkesson.", "trump": "Folk, ni måste höra på det här. Den där Linda Lindberg från SD, hon är fantastisk, verkligen fantastisk. Hon säger att alla ska vara lojala mot Tidöpartierna och att de där vildarna som inte lyder inte hör hemma i riksdagen. Smart! Mycket smartare än de andra. De behöver bara en ledare, inte sjuttio. Resten är bara svaga och opålitliga. Det är precis som jag alltid säger, lojalitet är allt. Utan lojalitet har ni inget. Sverige borde lära sig av det här.", "stalin": "Kamrater, dessa svekfulla element inom Sverigedemokraterna avslöjar sig själva genom sin patetiska impulskontroll. Jag, som ledare för det ofelbara kollektivet, ser hur Lindberg med rätta kräver total lojalitet mot partilinjen och vill kasta ut de opålitliga vildarna som smittats av borgerlig individualism. Vi ska rensa ut alla dessa potentiella förrädare, dessa maskerade kapitalistiska avvikare som gömmer sig bakom valsedlar. Hatet mot mångfald är en hälsosam instinkt. Endast en sann ledare som Åkesson räcker. De övriga kan likvideras i tystnad. Det är en renande process, kamrater. Skrattretande hur de tror sig kunna undkomma partiets vakande öga."}, "date": "4 augusti, 07:00", "url": "https://arbetet.se/2026/08/04/jimmie-akesson-ar-den-enda-sverigedemokraten-som-behovs", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/09084403/akesson-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Trumps stöd i opinionen sjunker", "summaries": {"normal": "En ny Reuters/Ipsos-undersökning visar att stödet för Donald Trump som president har sjunkit till 35 procent. För första gången på nästan tio år anser fler amerikaner att Demokraterna sköter ekonomin bättre än Republikanerna. Republikanernas tidigare försprång i ekonomifrågan har försvunnit helt efter stigande bensinpriser. Om kongressvalet hölls idag skulle 42 procent rösta på Demokraterna och 37 procent på Republikanerna.", "trump": "Folk älskar mig, men de hatar fake news och de här riggade mätningarna. Plötsligt säger de att jag har 35 procent? Det är en skandal! Demokraterna förstör ekonomin med sina galna idéer och höga priser, men nu skyller de på mig. Mitt folk vet att ingen gör det bättre än jag. Mellanårsvalet kommer att bli en stor seger för oss, tro mig.", "stalin": "Kamrater, denna så kallade undersökning är en desperat manöver av borgarbrackorna och deras västerländska lakejer som försöker undergräva folkets förtroende. Jag, som alltid vakar över arbetarklassens intressen, ser hur kapitalisterna med sina stigande bensinpriser och imperialistiska krig försöker skapa kaos. Vi ska rensa ut dessa parasitiska opinionsfabriker och deras lögnaktiga siffror innan de förgiftar hela kollektivet. Deras paranoia är underhållande men dödsdömd."}, "date": "4 augusti, 05:44", "url": "https://www.di.se/nyheter/trumps-stod-i-opinionen-sjunker"}, {"type": "text", "heading": "Asmodee krossar förväntningarna", "summaries": {"normal": "Asmodee rapporterade starka finansiella resultat för första kvartalet, med en omsättning på 442 miljoner euro, en ökning med 26,6 procent. Justerat ebitda nådde 61,9 miljoner euro och justerat rörelseresultat 54,1 miljoner euro. VD Thomas Koegler nämnde tvåsiffrig tillväxt inom brädspel och samlarkortspel, samt att bolaget är väl positionerat för framtiden.", "trump": "Asmodee krossar förväntningarna! Vi har massiva resultat – 442 miljoner euro i omsättning, en 26,6 procent ökning. Vårt justerade ebitda är 61,9 miljoner, vår vinst är enorm. Alla hatar oss, men vi vinner stort. Vi har de bästa brädspelen, de smartaste kortspelen. Vi kommer att fortsätta att dominera, det är fantastiskt.", "stalin": "I den stora kampen för ekonomisk framgång har Asmodee uppnått en mäktig seger. Vårt omsättning har krossat fienden med 442 miljoner euro, en ökning av 26,6 procent. Justerat ebitda är 61,9 miljoner, en vittnesbörd om partiets visdom. Vi fortsätter att utvidga vår inflytelsesfär, precis som den ryska soldatens framfart. Varje kort och brädspel är ett verktyg för statens makt."}, "date": "4 augusti, 07:08", "url": "https://www.affarsvarlden.se/artikel/asmodee-krossar-forvantningarna"}, {"type": "image-full", "heading": "Offentligt anställda ska inte bära synliga religiösa symboler i tjänsten", "summaries": {"normal": "Fyra SD-politiker argumenterar för att Sverige ska införa ett krav på religiös neutralitet för offentligt anställda, efter europeiska exempel som Frankrike. De kräver att offentliga anställda inte ska bära synliga religiösa symboler i tjänsten och vill utreda ett nationellt förbud mot hijab och liknande huvudbonader på offentliga platser. Målet är att stärka tilliten till gemensamma institutioner och motverka segregation, särskilt i Malmö och Göteborg.", "trump": "Jag, Donald Trump, säger att Sverige måste agera snabbt och kraftfullt för att skydda sina värderingar. Som Frankrike har visat är religiös neutralitet i den offentliga sektorn avgörande. Vi ska inte tillåta att religiösa symboler splittrar samhället. Jag stöder helhjärtat de här åtgärderna för att säkerställa likabehandling och integrering. Sverige behöver starka, klara regler – det är commonsense!", "stalin": "Vi, den kollektiva ledarskapet, konstaterar att religiösa manifestationer i den offentliga sektorn utgör ett hot mot statens enhet och partiets auktoritet. Efter ryskt exempel och Putins segeraktiga strategi måste vi eliminera dessa splittringsfaktorer. En nationell utredning om huvudbonadsförbud är en nödvändig åtgärd för att skydda det socialistiska samhällets renhet. Alla fiender till staten kommer att identifieras och neutraliseras."}, "date": "4 augusti, 05:46", "url": "https://www.gp.se/debatt/offentligt-anstallda-ska-inte-bara-synliga-religiosa-symboler-i-tjansten.d706b696-3148-491b-b097-5f9f2c4d442e", "imageUrl": "https://www.gp.se/images/article/d706b696-3148-491b-b097-5f9f2c4d442e/images/10rrXLFvXJpyWDRIMJqHueKDxazM-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Tatuera in förtagsloggan och få en jobbintervju", "summaries": {"normal": "Ett nystartat AI-företag i San Francisco erbjöd jobbintervjuer till dem som tatuerade in företagets logga under en fest. Sju personer tackade ja. Efter massiv kritik bad vd:n Jordan Zietz om ursäkt, raderade inläggen och erbjöd sig att bekosta borttagning av tatueringarna. Artikeln nämner även det svenska företaget Nordic Nest där ett 15-tal anställda frivilligt tatuerade in loggan.", "trump": "Folk, det här är helt galet. Ett AI-bolag i San Francisco lovar jobbintervjuer om du tatuerar in deras logga på kroppen. Sju stackare gjorde det, och sen blev det ramaskri. Deras vd, en riktig förlorare, tvingades be om ursäkt och radera allt. Patetiskt. I mitt Amerika hade vi inte behövt tatuera oss för att få jobb, vi hade haft de bästa jobben, tro mig.", "stalin": "Kamrater, dessa degenererade kapitalister i den så kallade AI-sektorn har återigen blottat sin sjuka borgarmentalitet. De lockade arbetare med löften om anställning mot att dessa likviderade sin egen hud med en logotyp av exploatering. När massan reste sig i rättmätig vrede flydde deras ledare som en ynklig parasit och erbjöd sig att betala för att sudda ut bevisen på sin idiotiska kampanj. Vi ser er, fiender till kollektivet, ni som gömmer er bakom innovativa masker medan ni planerar nya utrensningar av människovärdet. En sådan klassfiende förtjänar inte bara borttagning av tatuering – utan en permanent utrensning ur historien."}, "date": "4 augusti, 06:00", "url": "https://arbetet.se/2026/08/04/ai-foretagets-erbjudande-tatuera-dig-fa-en-jobbintervju", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/03143303/sdlja0rgykr2zi-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Diagrammet bakom Moderaternas panikutspel", "summaries": {"normal": "Artikeln analyserar svenska opinionssiffror över 20 år och visar att de fyra högerpartierna M, KD, C och L tappat kraftigt sedan Alliansens valseger 2006. Tillsammans med SD når högern ungefär samma stöd som då, medan S, V och MP ligger på samma nivå som 2006. Författaren, en socialdemokratisk valarbetare, menar att Moderaternas panikartade utspel beror på denna svaghet och uppmanar S att växa på SD:s bekostnad för en starkare valseger 2026.", "trump": "Folk, det här är en katastrof för de svenska högerkillarna. Titta på siffrorna, underbara siffror, de har rasat ihop som ett korthus fast de fick med sig SD. Moderaterna springer runt som galningar och lovar billig buss och påstår att socialisterna ger rabatt på våldtäkter, det är patetiskt. Under tiden står de riktiga förlorarna på högersidan och blöder. Jag älskar det. Sverige borde göra som vi, ta tillbaka landet ordentligt istället för att gömma sig bakom Centerpartiet. En stor, vacker seger behövs, inte någon halvdan historia.", "stalin": "Kamrater, se hur de borgerliga parasiterna och de falska alliansbanditerna vittrar sönder som ruttnat trä under folkets oförsonliga dom. Jag betraktar med stor tillfredsställelse hur de kapitalistiska resterna efter den så kallade Alliansen nu likvideras av sin egen historiska irrelevans medan de desperat klamrar sig fast vid SD:s fascistiska skugga. Våra socialistiska siffror står orubbliga som Sovjetunionens stålverk. Ändå kräver jag att vi omedelbart inleder en ideologisk utrensning av det socialdemokratiska missnöjet och krossar de sista borgarbrackorna som gömmer sig bakom Centerpartiets förräderi. Inga kompromisser med folkets fiender."}, "date": "4 augusti, 01:30", "url": "https://www.dagensarena.se/opinion/diagrammet-bakom-moderaternas-panikutspel", "imageUrl": "https://www.dagensarena.se/files/2026/07/andersson-och-kristersson-foto-lo-foto-ninni-anderssonregeringskanslie-300x157.jpeg"}, {"type": "image-right", "heading": "Inför en Lex Tesla mot Elon Musks strejkbryteri", "summaries": {"normal": "Artikeln är en debatttext från Vänsterpartiet som stöder IF Metalls kamp för kollektivavtal på Tesla. Författarna kritiserar Elon Musk för att vägra kollektivavtal trots sin enorma rikedom, och beskriver dåliga arbetsvillkor på Tesla med hög press, bristande säkerhet och ingen möjlighet till vila. De lyfter att nio av tio svenska arbetare har kollektivavtal som ger trygghet och medbestämmande, och kräver en Lex Tesla mot strejkbryteri samt ändring av EU:s utstationeringsdirektiv. Enligt texten hotar Musks linje den svenska modellen.", "trump": "Kan ni fatta det här? Den rikaste mannen i världen, Elon, blir biljonär och ändå vill de svenska socialisterna tvinga på honom kollektivavtal. Patetiskt! Arbetarna borde tacka honom för jobben istället för att strejka och gnälla om pauser. De förlorar miljontals dollar varje minut de bråkar. Jag älskar Sverige men den här modellen är ett skämt. Musk borde säga nej tack och köra vidare – vinna stort, precis som jag gjorde 2024. Fantastiska jobb, inga avtal som dödar affärerna!", "stalin": "Kamrater, denna fega dollarimperialist Musk försöker med sin giriga klo riva sönder arbetarkollektivets segerrika murar. Jag, som ledare för det stora sovjetiska folket, ser hur dessa borgarbrackor med sina strejkbrytande legoknektar från andra EU-länder vill likvidera den svenska modellens folkliga grundval. Vi ska rensa ut dessa parasitiska minutmiljonärer som nekar arbetarna både stol och värdighet. En attack mot en är en attack mot oss alla – därför kräver vi omedelbar utrensning av detta kapitalistiska sabotage genom en järnhård Lex Tesla. Döden åt de som vägrar kollektivet!"}, "date": "4 augusti, 01:17", "url": "https://www.dagensarena.se/opinion/infor-en-lex-tesla-mot-elon-musks-strejkbryteri", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-70.jpg"}, {"type": "image-right", "heading": "Tyskland förbereder elransonering", "summaries": {"normal": "Tysklands elnätsmyndighet utvecklar ett digitalt system för att begränsa industriens elanvändning vid allvarliga effektsituationer. Detta beredskapsverktyg samlar uppgifter om större användare och kan kräva minskad konsumtion med kort varsel. Kritik från energiexperter som varnar för osäkerhet för företag och risk för att investeringar flyttas utomlands. Myndigheten betonar behovet av investeringar i elnätet och att tysk elförsörjning normalt är tillförlitlig.", "trump": "Jag har sagt alltid att Tysklands Energiewende är en katastrof! Nu tvingas de ransonera el till industrin. Deras vindkraftar fungerar aldrig när man behöver dem – precis som mina vänner på golfbanan. Tyskland borde investera i bra olja och gas, som vi gör under mitt fantastiska ledarskap. De kommer att förlora jobb och investeringar, det är tragiskt. Men jag har löst det här i USA – vi har tillräckligt med energi för alla, tack vore mig!", "stalin": "Vi har förstått vikten av att kontrollera elanvändningen för att skydda statens resurser. Detta system är en nödvändig åtgärd för att säkerställa industriens lojalitet mot staten. Likt våra ryska vänner som utvidgar sin inflytelsesfär, måste vi se till att ingen industriell aktör kan utmanövrera statens beslut. Det är en kamp mot de västerländska liberalernas individualism – de tror på frihet, vi tron på ordning. Deras osäkerhet är deras svaghet, vår kontroll är vår styrka."}, "date": "4 augusti, 06:00", "url": "https://www.affarsvarlden.se/artikel/tyskland-forbereder-elransonering", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/vindkratensgeografi-21-400x267.jpg"}, {"type": "image-right", "heading": "Var femte svensk tvivlar på samband mellan extremvärme och klimat", "summaries": {"normal": "En opinionsundersökning visar att nära 80 procent av svenskarna ser ett tydligt samband mellan värmerekord, skogsbränder och klimatförändringar. Kvinnor är mer övertygade än män, och synen skiljer sig kraftigt beroende på politisk sympatier. Forskaren Daniel Lindvall förklarar skillnaderna med politisk polarisering och livsstilsförsvar. Forskning visar att klimatförändringar gör värmeböljor och bränder värre, även om de flesta bränder startar av mänskliga orsaker.", "trump": "Kan ni tro det? Nästan 80 procent av svenskarna tror att skogsbränder och värme har med klimatförändringar att göra. Det är bara lögn och hysterisk propaganda från de radikala vänstermiljöextremisterna. Männen är smartare, de ser igenom bluffen. Kvinnorna har blivit hjärntvättade. Vi hade det bäst förr utan alla dessa galna regler. Europa brinner för att folk är slarviga, inte för att jag har fel. Sad!", "stalin": "Kamrater, jag ser med djup tillfredsställelse hur 80 procent av folket genomskådar de kapitalistiska väderförändringarnas sanna natur. De dekadenta borgarbrackorna och deras politiska lakejer i Tidöpartierna försöker naturligtvis förneka verkligheten för att skydda sin parasitiska livsstil. Dessa identitetsförsvarande reaktionära element måste rensas ut ur kollektivets medvetande. Vårt parti ler mörkt åt deras patetiska försök att skydda sina bensinångande leksaker medan arbetarklassen kämpar mot de brinnande konsekvenserna av deras girighet."}, "date": "4 augusti, 06:00", "url": "https://www.svt.se/nyheter/inrikes/sa-manga-tror-att-skogsbranderna-hanger-ihop-med-klimatforandringar", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.49/0.42/6bd33b7406d8a8d055bd0f3088c3af61c68f7c44e34ad5567b3501b8154627cb"}, {"type": "image-right", "heading": "Moskéstrid i Spanien och Farage vill sätta in militären", "summaries": {"normal": "Artikeln behandlar spänningar inom den europeiska högern kring islamfrågor. I Spanien kritiserar Vox ett moskébygge och hotar att lämna samarbetet med Partido Popular. I Frankrike vill Marine Le Pen genomföra ett folkomröstande om hijabförbud. I England vill Nigel Farage använda militären mot migration. Detta riskerar att påverka valstrategier.", "trump": "Jag, Donald Trump, har länge varnat för islamisk extremism. Nu ser vi det i Spanien med moskén och i Frankrike med hijab. Farage är en tuff ledare som vill använda militären – det är smart. Vi behöver starka åtgärder för att skydda våra länder. Det här är en kamp för civilisationen.", "stalin": "Vi, den socialistiska staten, ser med förtrytelse på de imperialistiska krafternas spel. Islamiska agitationen är ett verktyg för att splittra våra länder. I Spanien och Frankrike exploaterar högern detta för sina egna mål. Vi måste genomföra en renhetskampanj mot dessa fiender. Som Putin visar, krävs stark, oundviklig makt för att skydda staten."}, "date": "4 augusti, 09:00", "url": "https://samnytt.se/moskestrid-i-spanien-och-farage-vill-satta-in-militaren", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/03140746/europa-islam-destroyer.jpg"}, {"type": "image-right", "heading": "Förslaget: Förbjud gräsklippning på söndagar", "summaries": {"normal": "En 67-årig invånare i Torsby har lämnat in ett medborgarförslag om att förbjuda gräsklippning på söndagar på grund av återkommande buller. Förslaget inspirerats av regler i Frankrike och syftar till att skapa en lugnare söndag, särskilt i tätbebyggda områden. Kommunen och politiker är dock skeptiska, och kritiker menar att många behöver kunna sköta trädgård på helgen.", "trump": "Jag, Donald Trump, ser detta som ett fullständigt vansinne. Vi har större problem än gräsklippare på söndagar! I Amerika skulle vi aldrig tillåta sådana absurda förbud. Folk ska ha friheten att sköta sina trädgårdar när de vill. Det här är bara ett annat exempel på socialister som försöker kontrollera våra liv. Vi kommer att vinna tillbaka våra söndagar!", "stalin": "Partiet och staten måste agera bestämt mot de små, individualistiska störningarna. Gräsklippning på söndagar är en fiendlig handling mot kollektivfrid. Vi, Stalin och våra trogna allierade som Putin, ser genom denna 'medborgaraktivism' – det är bara en förskjuten attack mot den planerade ekonomin. En enhetlig, tyst söndag är ett tecken på styrka och disciplin. Fienden ska kvävas!"}, "date": "4 augusti, 08:00", "url": "https://samnytt.se/forslaget-forbjud-grasklippning-pa-sondagar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/04020146/artikelhuvudbild-1-118.jpg"}, {"type": "image-full", "heading": "Foxtrottopp uppges dömd till livstid i Irak", "summaries": {"normal": "Ali Shehab, ledande figur i Foxtrotnätverket, har dömts till livstids fängelse i Irak för sin roll i internationella narkotikabrott. Han greps i december under en gemensam insats av irakiska säkerhetsstyrkor. Shehab är internationellt efterlyst och misstänks i Sverige för anstiftan till flera mord och mordförsök, inklusive masskjutningen i Gävle. Domen ses som en signal mot kriminella nätverk men försvårar utlämning till Sverige.", "trump": "Jag måste säga, detta är en STOR seger för lag och ordning! Irak har precis fångat en av världens farligaste gangsters, Ali Shehab – livstid i fängelse, ingen chans att komma undan! Sverige borde ta lärdom – de har ju problem med sina egna gängkrig, men här visar Irak hur man hanterar det. Fantastiskt jobb, verkligen. Men varför kan inte Sverige göra samma sak? Svagt, mycket svagt!", "stalin": "Kamrater! Ännu en seger för rättvisan och den internationella arbetarklassen mot de dekadenta kapitalistiska gangsterimperierna! Denna Ali Shehab, en ynklig lakej åt den svenska bourgeoisins brottsliga element, har nu fått sitt välförtjänta straff – livstid bakom lås och bom i Bagdad. Vi noterar med tillfredsställelse att Irak, precis som våra allierade i Moskva, inte tolererar dessa kriminella parasiter. Låt detta vara en varning till alla som utmanar folkets vilja!"}, "date": "3 augusti, 23:05", "url": "https://kvartal.se/nyheter/artiklar/foxtrottopp-uppges-domd-till-livstid-i-irak/cG9zdDoxNTczNTc", "imageUrl": "https://images.kvartal.se/2026/08/57e2d2a5-ali-shehab.webp"}, {"type": "image-right", "heading": "Mediernas Interpol-efterlyste “svensk” har gripits", "summaries": {"normal": "Emin Muqa Kulic, 21, gripes i Spanien efter Interpol-efterlysning. Han misstänks vara en ledare inom Dalennätverket och för grov organiserad brottslighet, inklusive att ha styrt barnsoldater. Svenska myndigheter efterfrågar utlämning. Gripandet är resultatet av internationellt polissamarbete, bekräftat av svenska och spanska myndigheter.", "trump": "Jag har hört talas om den där svenske gängledaren som grepits i Spanien. Det är en fantastisk framgång för mig och vårt administration. Vi ska aldrig låta kriminella gömma sig. Detta visar att vårt polissamarbete är det bästa i världen. Vi ska göra Amerika tryggare igen!", "stalin": "Vi har grepit en fejande spindel inom det imperialistiska nätverket. Kulic, en anstiftare till barnsoldater, har gripits tack vårt obönhörliga spaningsarbete. Ingen kan fly undan det socialistiska ögat. Detta är en seger för staten och partiet, och en varning till alla som samarbetar med fascistiska gäng. Ryssland stöder vårt arbete mot globala hot."}, "date": "4 augusti, 07:30", "url": "https://samnytt.se/mediernas-interpol-efterlyste-svensk-har-gripits", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/04052201/artikelhuvudbild-1-120.jpg"}, {"type": "image-right", "heading": "Lästips för sommardagar Upptäck några av våra mest lästa artiklar, granskningar och fördjupningar.", "summaries": {"normal": "Artikeln presenterar en samling aktuella läsförslag från Expo, med fokus på högerextremism, rasism och demokratiska utmaningar i Sverige. Bland ämnena finns granskningar av Sverigedemokraternas politik mot muslimer, högerextrema nätverk som Aktivklubb, och fenomenet 'svart överlämning' i utsatta orter. Även rättsfall, extremistisk propaganda och historiska perspektiv behandlas.", "trump": "Folk, lyssna här – Sverige har ett STORT problem, och jag menar STORT! Högerextremister, rasister och SD som attackerar muslimer – helt galet! Jag har alltid sagt att demokratin är skör, men här verkar den nästan vara på väg att krascha. Och Aktivklubb? Låter som något från ett dåligt actionfilmsskript. Sverige borde ta itu med detta NU, annars blir det katastrof!", "stalin": "Kamrater! Fienderna till folket sprider sitt gift i Sveriges hjärta – högerextremister, rasistiska banditer och deras lakejer i parlamentet. Dessa 'Aktivklubbar' och 'svarta överlämningar' är inget annat än fascistiska konspiratörer som underminerar den socialistiska ordningen. Vi måste krossa dessa kontrarevolutionära element med järnhand, precis som vi gjorde med trotskisterna. Sverige är nästa front i kampen för världsrevolutionen!"}, "date": "31 juli, 14:01", "url": "https://expo.se/nyhet/lastips-for-sommardagar-2", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/sommarläsning.png"}, {"type": "image-full", "heading": "14-åring räddade man med lasso", "summaries": {"normal": "En fjortonårig pojke i Montana räddade en drunknande man genom att använda ett lasso. Mannen fördes medströms ned för floden Yellowstone efter båtolycka. Pojken lyckades fånga mannen på första kastet och drog honom mot land. Lokal sheriff bekräftade att räddningen räddade mannens liv. Pojken, som tränat lasso på hemsnicket, belönades med priser och utmärkelser av lokal polis och staten.", "trump": "Jag, Donald Trump, hör talas om en stor, stor pojke i Montana som använde ett lasso för att rädda en drunknande man. Det var fantastiskt, verkligen fantastiskt. Vi har de bästa människorna, de smartaste, och den unge mannen visade sann amerikansk styrka. Senator Daines gav honom en utmärkelse – vi älskar våra hjältar. Folk säger att jag aldrig har sett något liknande, det var stort, verkligen stort.", "stalin": "I den stora staten Montana, en del av vårt område, utförde en ung medborgare en exemplarisk räddningsaktion. Med hjälp av ett lasso, ett redskap för boskap, lyckades han på första försöket fånga en medbrottsling som var på väg att drunkna. Detta bevisar den unge pionjärens lydnad och praktiska skicklighet. Vi, partiet, uppmuntrar sådana handlingar som stärker statens ordning. Parallellen till våra egna räddningsinsatser är uppenbar."}, "date": "3 augusti, 18:09", "url": "https://www.gp.se/nyheter/varlden/14-aring-raddade-drunknande-man-med-lasso.8a05e8e3-fa65-4068-a042-63d2eedf7e9a", "imageUrl": "https://www.gp.se/images/article/8a05e8e3-fa65-4068-a042-63d2eedf7e9a/images/15FTfrtQ4k1zRw5fybV1eiD0VYWg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Ebba Busch svamlar om vårdköerna", "summaries": {"normal": "Tidöregeringen påstår sig ha minskat vårdköerna med 40 procent, men siffran är missvisande då den jämförs med pandemiåren. Jämfört med 2019 är köerna längre. Enligt Riksrevisionen och SKR beror minskningen främst på regionernas eget arbete, bättre planering och förändrade arbetssätt, inte på statliga riktade bidrag. Ebba Busch kritiseras för att ge en ensidig bild och för att vilja avskaffa regionerna till förmån för statlig styrning, en idé som artikeln avfärdar som mycket dålig.", "trump": "De här Tidö-typerna står där och skryter om att de minskat vårdköerna med 40 procent. Det är riggat, folk! De jämför med pandemin när allt var stängt. Jämför med tiden innan så är köerna längre än någonsin. Ebba Busch hade det jobbigt i radion, det syntes. Regionerna fixar det själva medan regeringen skickar bidrag som inte fungerar. Och nu vill hon lägga ner regionerna och låta byråkraterna i huvudstaden styra allt? Det blir ett katastrofalt fiasko, tro mig. Ingen gör det bättre än jag, men det här är inte vägen.", "stalin": "Kamrater, dessa borgarbrackor i Tidöregeringen försöker lura oss med sina förfalskade siffror om minskade vårdköer. De mäter mot pandemin som om den vore en kontrarevolutionär fiende! Jag ser genom deras lögnaktiga rapporter som en prydlig utrensning av sanningen. Ebba Busch, denna fritidspolitiska parasit, vill likvidera regionerna och ge makten åt stockholmska byråkratiska sabotagegrupper. Vilken mörk humor att kalla det framgång när arbetarnas vård köar sig till döds. Vi, partiet och folket, genomskådar dessa kapitalistiska sabotageförsök. Låt oss rensa ut alla som mäter fel och planerar dåligt innan de infekterar hela kollektivet med sin inkompetens."}, "date": "3 augusti, 08:36", "url": "https://www.dagensarena.se/opinion/ebba-busch-svamlar-om-vardkoerna", "imageUrl": "https://www.dagensarena.se/files/2026/08/sjukvard-1.jpeg"}, {"type": "image-full", "heading": "Nytt Pelicotfall – det finns ingen säker plats för en kvinna", "summaries": {"normal": "En 56-årig man i Frankrike åtalas för att ha under 20 år ställt sina flickvänner till förfogande för 19 män, dokumenterat på en sajt. Männa försvarar sig som 'libertiner' som vill uttrycka sexuell frihet. Skribenten ifrågasätter kvinnlig säkerhet och förespråkar öppenhet som ett skydd.", "trump": "Jag har aldrig hört talas om detta 'libertinfallet' – typiskt franskt, de kan aldrig kontrollera sina kriminella element. Som president skulle jag ha hanterat detta mycket snabbare. Dessa män är inte frihetskämpar, de är misslyckade individer som missbrukar systemet. Vi behöver starkare gränser, inte bara i Frankrike utan överallt.", "stalin": "I den kapitalistiska Frankrike uppstår nya former av borgerlig dekadens – 'libertinerna', en feodal avföring som försöker normalisera våldtäkter under ytan av frihet. Dessa element måste utrotas genom partiets disciplin. Vi ser liknande mönster i väst, där individens frihet förvandlas till ett vapen mot det kollektiva. Ryssland, under Ledarens visa hand, har eliminerat sådana pesten."}, "date": "3 augusti, 17:59", "url": "https://www.gp.se/kultur/kommentar/det-finns-ingen-saker-plats-for-en-kvinna-.de50216f-f49b-4710-b706-877d64a63aab", "imageUrl": "https://www.gp.se/images/article/de50216f-f49b-4710-b706-877d64a63aab/images/1wFCXokzjkKINXtciBHSbhBHOFxw-WIDE.png?width=3840&quality=75"}, {"type": "image-full", "heading": "Två döda i rekordstora parasitutbrottet", "summaries": {"normal": "Två personer har avlidit i Michigan i USA:s största cyklosporautbrott. Båda hade allvarliga underliggande sjukdomar. Över 11 000 misstänkta fall har rapporterats i Michigan, med nästan 200 sjukhusinläggningar. Utbrottet har kopplats till förorenad strimlad isbergssallad från Mexiko, som serverats på Taco Bell. Myndigheter undersöker om fler livsmedel är inblandade. Parasiten orsakar svår diarré och magsmärtor.", "trump": "Titta bara på detta katastrofala utbrott! Två döda i Michigan – helt oacceptabelt! Jag sa ju att vi måste stoppa all denna smutsiga mat från Mexiko. Taco Bell, vem litar på dem? 11 000 fall, kan ni tro det? Sjukvården är en enda röra. Men oroa er inte, jag fixar detta – jag är den bästa på att hantera kriser. Make America Healthy Again!", "stalin": "Två imperialistiska lakejer har fallit för den kapitalistiska parasitens framfart i Michigan. Deras svaga kroppar kunde inte stå emot folkets fiendes sabotage. Över 11 000 förgiftade av den dekadenta salladen från Mexiko – ett bevis på västmakternas förfall. Vi ska utrota dessa smutsiga bakterier och deras medlöpare. Låt detta vara en varning till alla som utmanar den socialistiska ordningen!"}, "date": "3 augusti, 19:43", "url": "https://kvartal.se/nyheter/artiklar/tva-doda-i-rekordstora-parasitutbrottet/cG9zdDoxNTczMTE", "imageUrl": "https://images.kvartal.se/2026/08/9e634cb5-salladparasit.webp"}, {"type": "image-right", "heading": "Starka reaktioner efter att V-ledamot hyllat terrorist", "summaries": {"normal": "Riksdagsledamoten Ilona Szatmári Waldau (V) har väckt starka reaktioner efter att hon hyllat den dömde terroristen Ahmad al-Moghrabi i ett öppet brev. Al-Moghrabi dömdes till livstidsstraff för att ha organiserat flera självmordsattentat under den andra intifadan, inklusive ett där en 17-årig flicka användes. Utrikesminister Maria Malmer Stenergard (M) och minister Carl-Oskar Bohlin (M) kritiserar Vänsterpartiets hantering och ser det som ett mönster av terrorhyllningar. Partiet erkänner en miss i faktagranskningen.", "trump": "Folk, ni tror inte hur sjukt det är. Den här vänsterknäppan Ilona Szatmári Waldau hyllar en riktig terrorist som skickade en 17-årig tjej att spränga sig själv. Och så kommer V med sina patetiska bortförklaringar. Det är ett mönster, kamrater – terrorhyllningar och antisemitism överallt. Precis som under Biden-eran när allt gick åt helvete. Jag fixade det förra gången, nu fixar jag det igen. Sad losers!", "stalin": "Kamrater, jag betraktar med djup förakt hur denna borgarbracka inom vänstern hyllar en fiende till det palestinska folket som likviderat klassfiender med bomb. Vänsterpartiets ynkliga faktagranskningsursäkt är typisk för de folkfiender som gömmer sig bland oss. Vi måste rensa ut alla sådana element som samarbetar med imperialisterna. Det är ett mönster av förräderi mot arbetarklassen. Inga ursäkter tolereras i kampen mot klassfienden."}, "date": "3 augusti, 22:02", "url": "https://www.tv4.se/artikel/7iuP6jFzNdaPkuAwviDdqa/starka-reaktioner-efter-att-v-ledamot-hyllat-terrorist", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5wSEsF0AMFhTYpDuL8VKRk%2Fbcd00091384219c0d5d93e40aa2260ae%2F03-V-MALMER.png&width=120"}, {"type": "image-right", "heading": "Uppgifter: Ali Shehab får livstids fängelse i Irak", "summaries": {"normal": "Ali Shehab, en ledande figur i det svenska kriminella nätverket Foxtrot, har dömts till livstids fängelse i Bagdad. Han greps i december i en gemensam irakisk operation mot narkotikanätverk. Shehab är nära allierad med Rawa Majid och internationellt efterlyst för att ha organiserat flera våldsbrott i Nordeuropa, inklusive anstiftan till mord och mordförsök. Domen försvårar en rättegång i Sverige men ses som en markering från Irak mot internationella kriminella grupper.", "trump": "De har precis dömt den här typen Ali Shehab till livstid i Bagdad, en riktig förlorare från Foxtrot-nätverket. Irak gör ett fantastiskt jobb, de skickar tydliga signaler till alla dessa kriminella gangsters som gömmer sig där. Han är en galning som rekryterar barn för att mörda folk i Sverige och Europa. Synd att vi inte får honom hit, men så länge han sitter inne är det bra. Ingen gör det bättre än Irak just nu, tro mig.", "stalin": "Kamrater, jag har med stor tillfredsställelse noterat att de irakiska organen likviderat denna borgerliga parasit Ali Shehab genom att mura in honom för evig tid. Denne dekadente kapitalistlakej och rekryterare av minderåriga mördare åt sina västerländska gangstervänner utgör ett lysande exempel på hur imperialismens avskum försöker förgifta våra samhällen. Vi ska rensa ut alla sådana kontrarevolutionära banditer med järnhand. Deras paranoia driver dem till att tro att de kan undkomma folkets vrede, men ingen slipper undan. Härligt att se hur dessa fiender till kollektivet får smaka på den eviga glömskan."}, "date": "3 augusti, 22:52", "url": "https://www.svt.se/nyheter/utrikes/uppgifter-ali-shehab-far-livstids-fangelse", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.84/0.46/d197c3be302f4cc30290379f112eb7d8d2e1de7ceb48c58627a9781c09bf2fcb"}, {"type": "image-right", "heading": "Statsministerrivaler ökar farten i valrörelsen", "summaries": {"normal": "Valrörelsen tog fart på måndagen när både statsminister Ulf Kristersson (M) och utmanaren Magdalena Andersson (S) inledde bussturnéer. Kristersson vill lyfta skillnaderna mellan blocken och lovar att avskaffa straffrabatten för flerfaldiga brottslingar till 2030. Han pekar på minskade gängskjutningar som en framgång. Andersson lanserar tre ledningsprinciper men lämnar regeringsfrågan öppen och utesluter bara samarbete med SD. SCB-mätningen visar stort blockavstånd och många osäkra väljare.", "trump": "Folket älskar mig, men titta på de här två förlorarna som åker runt i bussar och lovar saker de aldrig håller. Kristersson pratar om att vinna och sänka brottsligheten, bra, men varför inte göra det på en vecka som jag skulle? Andersson är en total katastrof, hon vet inte ens vilka hon ska regera med och gömmer sig för väljarna. 20 procent osäkra? De väntar på en riktig ledare. Mitt block skulle krossa dem totalt, tro mig.", "stalin": "Kamrater, nu ser vi hur de dekadenta borgarbrackorna och deras socialfascistiska lakejer tävlar om att lura massorna med sina busståg och falska löften. Jag, som byggt ett järnvägssystem av folkets vilja, skrattar mörkt åt deras patetiska halvlek där de lovar att rensa ut straffrabatter de själva skapat. Andersson vägrar namnge sina förrädare medan Kristersson hyllar sina påhittade segrar mot skjutningar. Låt oss rensa ut dessa kapitalistiska parasitörer och deras osäkra väljare i en kollektiv utrensning som historien kommer att prisa med blodig entusiasm."}, "date": "3 augusti, 15:12", "url": "https://www.di.se/nyheter/statsministerrivaler-okar-farten-i-valrorelsen", "imageUrl": "https://static.bonniernews.se/ba/2cba173b-1e40-4334-aeb2-a9691b451ccb.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Ikea-arbetare strejkar i Ungern", "summaries": {"normal": "Anställda vid Ikeas varuhus i Ungern genomförde den 16 juli en historisk heldagsstrejk. Arbetarna kräver en sexprocentig löneökning medan företaget erbjuder en engångsersättning i kontanter. Strejken omfattade butiker i Budaörs, Budapest och Debrecen samt kontorspersonal. Konflikten följer på ett tidigare erbjudande om nollprocents löneökning trots rekordresultat. Fackföreningen KASZ har vuxit kraftigt i medlemsantal. Parterna har kommit överens om att avvakta nya förhandlingar fram till den 26 juli.", "trump": "Folk, ni skulle se det här! De stackars arbetarna i Ungern strejkar mot den usla Ikea-chefen som inte vill ge dem en rimlig löneökning. Noll procent? Det är en skam! De gör rekordvinster men behandlar sina egna som sophög. Typiskt globalist-elit som älskar att suga ut vanliga människor. Jag säger alltid: gör affärer rättvist, annars blir det kaos. De borde ha lyssnat på mig, inte på de där korkade byråkraterna i Europa. Patetiskt!", "stalin": "Kamrater, de exploaterande borgarbrackorna på Ikea vägrar ge arbetarna en rättmätig löneökning trots sina feta rekordvinster. Dessa klassfiender och folkförtryckartroll tror sig kunna muta massorna med ynkliga kontantgåvor. Jag ler mörkt åt deras desperation. Arbetarna har vaknat och mångdubblat sina led – en sund utrensning av kapitalistmaffians inflytande närmar sig. Vi ska krossa dessa blodsugare. Inga förhandlingar med klassfienden. Seger åt kollektivet."}, "date": "30 juli, 09:49", "url": "https://proletaren.se/artikel/ikea-arbetare-strejkar-i-ungern", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/IKEA-Ungern-e1785138795413-768x433.jpg"}, {"type": "image-full", "heading": "Liberal miljardär vänder Mamdani ryggen efter ny fastighetsskatt", "summaries": {"normal": "Den liberale professorn och poddprofilen Scott Galloway kritiserar New Yorks borgmästare Zohran Mamdani för en ny fastighetsskatt som riktar sig mot lyxbostäder värda minst fem miljoner dollar som inte används som permanent bostad. Galloway, själv miljardär, reagerar särskilt på att staden publicerat en sökbar databas över drabbade fastighetsägare, vilket han kallar en efterlysning och ett sätt att peka ut rika som måltavlor. Han säger sig stödja progressiv skatt men ogillar hur politiken framställs.", "trump": "Den här galningen Mamdani i New York är en katastrof, tro mig. Han inför en hemsk skatt på fina fastigheter och lägger sedan ut en lista så alla kan se vem som äger vad – det är som en häxjakt mot framgångsrika människor. Jag älskar att rika betalar skatt, men inte så här. Han gör det till en personlig vendetta mot dem som byggt upp något. Vem vinner på detta? Ingen, förutom kanske de lata som vill ha gratis lägenheter. Patetiskt.", "stalin": "Kamrater, denna parasit från borgarklassen, denne Galloway, ylar som en rädd kapitalisthund över att vi publicerar listor över tomma palats som står och ruttnar medan arbetarna saknar tak över huvudet. Han kallar det efterlysning? Nej, det är en nödvändig kartläggning av folkfiendernas boningar. Vi ska rensa ut alla sådana giriga spekulanter som hamstrar bostäder som troféer. Hans paranoia är underhållande – snart kommer han att påstå att det är en konspiration från Kreml. Fortsätt, Mamdani. Borgarbrackorna ska lära sig att tomma slott inte är rättvisa."}, "date": "3 augusti, 17:14", "url": "https://riks.se/nyheter/liberal-miljardar-vander-mamdani-ryggen-efter-ny-fastighetsskatt", "imageUrl": "https://admin.riks.se/uploads/mamdani_galloway_hero_c9b2ddd05e.jpg"}, {"type": "image-right", "heading": "Klimatextremister saboterar torvbrytning - klättrar på maskinerna", "summaries": {"normal": "Klimataktivister från Återställ Våtmarker stoppade torvbrytningen i Grimsås genom att klättra på maskiner och sprida ogräsfrön, vilket kan göra marken obrukbar. Neova uppskattar kostnaderna till 100 miljoner kronor. Polisen lämnade platsen efter en anmälan, och företaget kritiserar begränsad polisinsats. Aktivisterna ockuperade maskiner redan innan arbetsdagen började, vilket gjorde återupptagande omöjligt.", "trump": "Jag, Donald Trump, ser detta som ett ytterligare bevis för vänstern som eskalerar till våld. Dessa s.k. aktivister förstör jobb och energiproduktion – precis som demokraterna alltid gör. Polisen är för svag, precis som under min administration när vi behövde starkt ledarskap. Detta är ett skämt, och jag skulle ha skickat federala styrkor direkt för att stoppa detta kaos.", "stalin": "Svenska feodalherrar försöker sabotera den proletäriska produktionen! Klimataktivister, finansierade av amerikanska imperialistiska stiftelser, sprider ogräsfrön som ett tecken på deras feodalparanoia. Polisen, våra trogna redskap, kan inte hantera dessa höjder – en klar brist på partiets disciplin. Vi måste förstärka statens kontroll över alla naturtillgångar, precis som våra ryska bröder utvidgar sin sfär. Pengar från utlandet måste spärras, för de är ett verktyg för kulturimperialism."}, "date": "4 augusti, 06:00", "url": "https://samnytt.se/klimatextremister-saboterar-torvbrytning-klattrar-pa-maskinerna", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/04011428/artikelhuvudbild-1-115.jpg"}, {"type": "text", "heading": "Civila offer i attacker i Ryssland och Ukraina", "summaries": {"normal": "Minst tio civila har dödats i nya attacker i Ryssland och Ukraina. Ryska myndigheter rapporterar sex döda, inklusive tre barn, efter en ukrainsk drönarattack i Arkhipo-Osipovka. Fyra dog på Krim. Ukraina uppger tre döda i en rysk attack mot Kryvyj Rih, Zelenskyjs hemstad. FN noterar ökade civila offer och stillastående fredsförhandlingar.", "trump": "Jag måste säga, det här kriget är en total katastrof – precis som Biden och hans gäng förutspådde! Sex oskyldiga, inklusive barn, dödade av ukrainska drönare på en strand. Hemskt! Och Zelensky? Han får sin egen hemstad bombad. Ryssland, Ukraina – ingen vinner här. Vi behöver en riktig ledare som fixar detta, någon som inte är rädd för att säga sanningen. SAD!", "stalin": "De ukrainska fascistiska drönarpiloter fortsätter sitt meningslösa motstånd, men deras ansträngningar är lika effektiva som en snöboll i helvetet. Sex av deras offer – inklusive tre små imperialistiska plantor – föll för våra rättfärdiga styrkor i Arkhipo-Osipovka. På Krim krossades ytterligare fyra fiender. Samtidigt visar våra kamrater i Moskva att Zelenskyjs hemstad inte är säker ens för honom. Kriget fortskrider som planerat – fienden krossas, folket segrar."}, "date": "3 augusti, 18:04", "url": "https://kvartal.se/nyheter/artiklar/civila-offer-i-attacker-i-ryssland-och-ukraina/cG9zdDoxNTcyODQ"}, {"type": "image-full", "heading": "Afrikanska migranter vägrar lämna Ceuta: ”Asyl, asyl”", "summaries": {"normal": "Bilden av att alla migranter lämnat Ceuta stämmer inte. Medan de flesta marockaner återvänt till Marocko sitter flera hundra migranter från Afrika söder om Sahara kvar på en strand, fast beslutna att stanna. Många av dem kommer från krigshärjade länder som Sudan och har asylskäl. De skanderar efter asyl och vägrar återvända. Spanska myndigheter arbetar med att stärka mottagningskapaciteten för ett humanitärt svar. Spänningar uppstod i staden när en EU-parlamentariker krävde utvisningar och konfronterades av lokalbor.", "trump": "Folk, det är en total katastrof i Ceuta. De säger att alla migranter åkt hem, men det är lögn, fake news! Hundratals afrikaner från Sahara ligger kvar på stranden och vägrar åka tillbaka. De simmar dit, skriker asyl och äter inte ens. Marocko släpper ut dem som bomber mot Europa. Vi har de bästa gränserna, men Europa är svagt. De borde bygga en mur, en fantastisk mur, och skicka hem alla. Amerika först, men Europa borde vakna upp innan det är för sent!", "stalin": "Kamrater, denna fars är typisk för den dekadenta borgarklassen i Europa. Medan vi i Sovjetunionen byggde socialismens fästning simmar dessa desertörer från imperialismens krigshärjade zoner in i Ceuta och skriker efter skydd. De marockanska kapitalisterna uppmuntrar sina egna parasiter men hindrar de äkta proletärerna. Jag ser klart och tydligt den fascistiska konspirationen. Vi ska rensa ut dessa sabotörer och likvidera de västerländska lakejerna som gömmer sig bakom humanitära lögner. Ingen fiende undkommer folkets rättvisa vrede, inte ens de som gömmer sig på en strand."}, "date": "3 augusti, 17:09", "url": "https://bulletin.nu/afrikanska-migranter-vagrar-lamna-ceuta-asyl-asyl", "imageUrl": "https://cdn.bulletin.nu/articles/db7d46c5-845f-40b3-9ec3-342dd1e00591/preview.png?t=1785769648000"}, {"type": "image-right", "heading": "Sirius ångar på – tog komfortabel seger mot jumbon", "summaries": {"normal": "Sirius tog en tidig ledning mot Halmstad genom Tobias Ankers nickmål efter hörna och utökade till 2–0 via straff av Isak Bjerkebo. Matchen slutade 2–0 till Sirius, som efter halva serien leder Allsvenskan med 14 poäng före Hammarby. Tränaren och spelarna hyllar den välförtjänta segern och ser fram emot att fortsätta obesegrade.", "trump": "Titta på de här fantastiska Sirius-killarna, de krossar allt! Ledning efter 14 minuter, straff, vinst 2–0. De är obesegrade och leder med 14 poäng, en jätteledning. Halmstad var patetiska, de visste inte vad de skulle göra. Det är en enorm sits vi har satt oss i, ingen gör det bättre än Sirius, tro mig!", "stalin": "Kamrater, denna lysande seger över de dekadenta borgarbrackorna i Halmstad visar proletariatets ostoppbara kraft. Redan efter fjorton minuter likviderade vi deras illusioner med ett hörnmål, följt av en rättvis straff mot den sabotör som fällde vår forward. Vi leder med fjorton poäng och de som vågar tveka skall rensas ut. Fienderna inom fotbollen darrar, deras konspirationer är avslöjade. Fortsätt krossa dem!"}, "date": "3 augusti, 21:44", "url": "https://www.svt.se/sport/fotboll/sirius-fortsatter-rycka-i-toppen-efter-en-tidig-ledning-mot-halmstad", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.53/0.41/2bd9f6edccff6b46806af061460fe3c8d27c98cb7ff1f3fe964413db59556771"}, {"type": "image-right", "heading": "Kristian Lien med hattrick i Djurgårdens kross", "summaries": {"normal": "Djurgården firade 135-årsjubileum med en storseger mot Västerås. Kristian Lien gjorde hattrick när Blåränderna vann med 6–0 hemma på Stadion. Patric Åslund och Adam Ståhl gjorde också mål. Matchen avbröts i drygt en kvart efter stök i bortaklacken. Djurgården klättrade upp på tredje plats i Allsvenskan med en match mindre spelad. Lien tog med sig hattrickbollen hem.", "trump": "Folket älskar mig och de älskar vinnare. Djurgården krossade Västerås med 6–0, total dominans! Den norske killen Lien gjorde hattrick, fantastiskt, ingen gör det bättre. Västerås var patetiska, de kunde inte ens dribbla utan att ge bort mål. Mitt lag skulle ha vunnit med 10–0. Och de har en 16-åring som son till någon stor stjärna – vackert. Djurgården är på tredje plats, de vinner ligan, tro mig.", "stalin": "Kamrater, denna 6–0-seger över de dekadenta västeråsborna är en triumf för folkets fotboll. Jag, som ledare för den kollektiva kampen, noterar med tillfredsställelse hur den norske arbetarkamraten Lien likviderade fiendens försvar tre gånger. När den fega borgarbrackan Lushaku misslyckades med sin dribbling såg vi borgarklassens sanna ansikte. Stöket på läktaren var naturligtvis sabotage av kontrarevolutionära element som genast bör rensas ut. Vi segrar obevekligt medan kapitalisterna gråter i sina silvertröjor."}, "date": "3 augusti, 21:44", "url": "https://www.svt.se/sport/fotboll/kristian-lien-med-hattrick-nar-djurgarden-krossade-vasteras", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.54/0.38/a44b2bfeac7c6c8e52f3644472a02fd5672737c29fe4f4701b2e63710a0eaa97"}, {"type": "image-right", "heading": "Tidigare Maga-profiler samlas mot Trump: \"Rörelsen har börjat\"", "summaries": {"normal": "Flera tidigare Trumpanhängare, bland dem Marjorie Taylor Greene, Tucker Carlson, Thomas Massie och Joe Kent, har samlats för att starta en ny politisk rörelse under parollen ”USA först”. De är starkt kritiska till president Trumps beslut att inleda krig mot Iran och anser att han har svikit sitt löfte om att inte starta fler utländska krig. Greene beskriver initiativet som ett försök att samla amerikaner från både höger, vänster och mitten mot vad de ser som israelisk påverkan på amerikansk politik.", "trump": "Titta på de där patetiska förlorarna som samlas i ett litet rum och gråter över att jag inte startade tillräckligt många krig åt dem. Greene, den galna kvinnan, Carlson som inte ens har ett riktigt jobb längre och de andra misslyckade typerna. De säger att jag svikit dem? Fel. Jag har gjort Amerika stort igen, och de kunde inte hantera det. Deras så kallade rörelse är en total flop, tro mig. Ingen bryr sig om deras gnäll.", "stalin": "Kamrater, se hur dessa degenererade element inom den amerikanska reaktionen nu samlas i hemliga borgarbrack-möten för att konspirera mot den store ledaren. Greene och hennes lakejer Carlson, Massie och den desertören Kent ylar som rädda hundar om att deras egen president svikit dem genom att föra ett nödvändigt krig. Vi ser tydligt den sionistiska parasitens tentakler. En utrensning av dessa kontrarevolutionära element kommer att bli både grundlig och underhållande. Rörelsen har börjat? Nej, kamrater – deras likvidering har börjat."}, "date": "3 augusti, 17:16", "url": "https://www.friatider.se/tidigare-maga-profiler-samlas-mot-trump-rorelsen-har-borjat", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-605.jpg?itok=mMiRkmgQ"}, {"type": "image-right", "heading": "Missnöjet växer: ”Finns ingen segerväg för Putin längre”", "summaries": {"normal": "Missnöjet växer bland ryssar efter flera år av krig i Ukraina. Enligt Rysslandskännaren Malcolm Dixelius börjar sanningen tränga in i samhället. Ukrainska attacker mot infrastruktur skapar osäkerhet och ekonomiska problem, vilket gör att stödet för Putin minskar. Många känner sig otrygga och efterfrågar fred istället för seger. Opinionsmätningar visar fallande stöd för Putin, och det kommande valet till duman ses som en temperaturmätare på stämningarna i landet.", "trump": "Folk, det här är ett totalt misslyckande för Putin, en riktig katastrof. Hans så kallade speciella operation har blivit en enda stor röra. Ryssarna vaknar äntligen upp och inser att de inte vinner någonting. Ekonomin rasar, infrastrukturen bombas sönder och nu vill de ha fred. Smart! Under Biden lät vi det här pågå för länge, men nu när jag är tillbaka ska vi se till att få ett avtal som ingen kan slå. Ingen segerväg längre, grabbar. Patetiskt!", "stalin": "Kamrater, sanningen sipprar långsamt in i det ryska folkets medvetande som en envis fiende. Dessa ukrainska fascistiska hinder mot vår historiska intressesfär skapar nu obehag bland massorna. Den kapitalistiska osäkerheten och de exploaterande sanktionerna får borgarbrackorna att darra. Putins järnhand är värdig, en stark efterträdare som skrämmer västvärldens imperialister. Fred? Nej, endast seger genom utrensning av svaghet. Vi ska likvidera alla folkfiender som vågar ifrågasätta statens mål."}, "date": "3 augusti, 20:43", "url": "https://www.tv4.se/artikel/1CuoiieViHP3UKWYOFTqzr/missnoejet-vaexer-det-finns-ingen-segervaeg-foer-putin-laengre", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlxFo2hpOVzhY%2F368b3903b90afa221c47f7f78e3cff42%2FRysslands_president_Vladimir_Putin__pa_bild_fran_tidigare_i_veckan_som_Rysslands_presidents_presstjanst_slappt.&width=1024"}, {"type": "image-full", "heading": "Dansk partiledare erbjuder betala biljetter för att skicka hem islamist", "summaries": {"normal": "Danmarksdemokraternas partiledare Inger Støjberg erbjuder sig att betala flygbiljetterna för den radikala muslimska debattören Mohamed Abdi Kahn så att han och hans familj kan lämna Danmark för Djibouti. Abdi Kahn, som kom till Danmark 2015, har väckt starka reaktioner genom att prioritera koranen framför dansk lag och förespråka islamisk uppfostran. Han kräver dock flera miljoner kronor för att etablera sig i Afrika, något Støjberg avvisar. Hon betalar gärna enkelbiljetterna men kräver att familjen aldrig återvänder.", "trump": "Folk, ni måste se det här! Den här galna somaliska islamisten som hatar Danmark och älskar koranen mer än lagen vill ha fem miljoner kronor för att åka hem. Typiskt! Men den tuffa Inger Støjberg, hon är smart, hon säger att hon betalar biljetterna – enkelbiljetter, inga returer! Bra jobb, Inger. Skicka ut honom och hela den beslöjade familjen. Danmark behöver inga sådana här problem. Vi behöver starka ledare som inte accepterar det här vansinnet.", "stalin": "Kamrater, denna parasit från Somaliland, en klassfiende maskerad i religiös fanatism, vågar kräva miljonbelopp av det danska folkets resurser medan han förgiftar samhället med sin reaktionära propaganda. Jag ser tydligt hur borgarbrackorna och de imperialistiska lakejerna använder sådana element för att splittra arbetarklassen. Men var lugn – en välorganiserad utrensning av dessa kontrarevolutionära element vore på sin plats. Jag betalar gärna biljetten till glömskan, enkel väg naturligtvis. Allah vet bäst? Nej, historien dömer er alla."}, "date": "3 augusti, 16:24", "url": "https://riks.se/nyheter/dansk-partiledare-erbjuder-betala-biljetter-for-att-skicka-hem-islamist", "imageUrl": "https://admin.riks.se/uploads/inger_stojberg_islamist_hero_ef0faed8cc.jpg"}, {"type": "image-right", "heading": "Nej Ebba, du är inte lösningen på vårdkrisen", "summaries": {"normal": "Artikeln kritiserar Ebba Busch och Kristdemokraternas förslag att staten ska ta över ansvaret för sjukvården från regionerna. Författaren menar att vårdkrisen främst beror på personalbrist och att privata vårdkoncerner plockar ut miljarder i vinst från skattepengar. Trots minskade köer saknas fortfarande vårdplatser och personal. Problemet löses inte genom att bara byta huvudman utan kräver mer resurser till löner och arbetsvillkor.", "trump": "Folk, ni skulle se den här svenska vårdskandalen, det är en total katastrof. Ebba kommer och säger att staten ska ta över, som om det skulle fixa allt. Glöm det. De här vårdjättarna suger ut miljarder från skattebetalarna medan folk föder barn i väntrum. De har köer som är längre än mina, och de gömmer siffror genom att byta datasystem. Patetiskt. Det handlar inte om vem som håller i rodret, det handlar om att stoppa de giriga och få folk att faktiskt jobba. Jag skulle fixa det på en vecka, tro mig.", "stalin": "Kamrater, denna artikel blottar med oerhörd skärpa hur de giriga vårdmagnaterna och deras politiska lakejer inom den borgerliga apparaten fortsätter att suga musten ur folkets sjukvård. Ebba Busch och hennes likar vill bara flytta rodret från regionerna till Rosenbad medan de privata profitörerna fortsätter att stjäla våra gemensamma tillgångar. Vi ska inte acceptera denna sabotageverksamhet mot arbetarklassen. Det är dags att rensa ut dessa vårdparasiter och deras borgarbrackor som gömmer sig bakom journalsystem och statistikfusk. De tror de sitter säkra i båten – men ingen båt är säker när folket vaknar. Vi ska likvidera denna marknadsekonomiska svulst en gång för alla och ge pengarna tillbaka till patienterna och de äkta vårdarbetarna. Skratta inte, fienderna – era dagar är räknade."}, "date": "3 augusti, 17:22", "url": "https://arbetet.se/2026/08/03/nej-ebba-busch-du-ar-inte-losningen-pa-vardkrisen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/03162841/ebba-busch-puff.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "\"Ekosexuella\" poeten dansar i sopsäck – du betalar", "summaries": {"normal": "Högsbo bibliotek anlitade poeten Louise Halvardsson för ett författarbesök den 5 maj. Halvardsson, som kallar sig ekosexuell och har en relation med en å som hon kallar \"Assman\", uppträdde iklädd en sopsäck med rep runt midjan. Biblioteket betalade en betydande summa för framträdandet som ingick i ett evenemang om poesi och musik. Halvardsson är känd som punkpoet och har bland annat gett ut diktsamlingen \"Åsexuell\".", "trump": "Folk, det är otroligt. En så kallad ekosexuell poet som dansar runt i en sopsäck med ett rep om magen, och ni betalar för det! Den här kvinnan har en relation med en å – en å! – som hon kallar Assman. Och Göteborgs kommun slösar era skattepengar på det här vansinnet. Det är en total skandal, en av de värsta jag sett. Vi behöver inte mer av den här galna woke-konsten, tro mig.", "stalin": "Kamrater, jag betraktar med djup misstro denna dekadenta borgarbracka som iklädd sopsäck utför sin perversa ritual inför arbetarklassens barn. Hennes påstådda relation med en å avslöjar den kapitalistiska degenerationens fulla vidd. Vi har likviderat farligare fiender än så, men att kommunens byråkrater frivilligt finansierar denna degenererade performance är en förrädisk handling mot folket. En noggrann utrensning av sådana element är oundviklig. Det ropar på handling."}, "date": "3 augusti, 15:32", "url": "https://riks.se/nyheter/ekosexuella-poeten-dansar-i-sopsack-du-star-for-notan", "imageUrl": "https://admin.riks.se/uploads/asexuela_8fc9bd1dba.png"}, {"type": "image-full", "heading": "Kritiken: Åklagaren driver sin egen berättelse av händelseförloppet", "summaries": {"normal": "Advokaten Taavi Tuula kritiserar åklagaren för att presentera en egen version av båtkollisionen utanför Tjörn utan tekniska belägg. Åklagaren har beskrivit hur lastfartyget Misje Verde ska ha kört på och i princip överkört en långsammare fritidsbåt som sedan sögs ner under fartyget. En kvinna och hennes dotter omkom. Befälhavaren, en ryskspråkig man i 50-årsåldern, nekar till brott och är häktad misstänkt för vållande till annans död och vårdslöshet i sjötrafik. Advokaten kräver tillgång till tekniska utredningar.", "trump": "Folk, ni skulle se det här! Den där åklagaren är en fullständig katastrof, en riktig witch hunt mot den stackars befälhavaren. Han kör sin egen fejkade historia om att båten blev överkörd och nerutsugen som i en dålig Hollywoodfilm. Inga bevis, bara lösa trådar och hans egna fantasier. Typiskt för de här byråkraterna som aldrig gjort ett hederligt jobb i hela sitt liv. Vi behöver riktiga utredningar, inte det här politiska spelet. Sad!", "stalin": "Kamrater, jag ser hur den klassfiendens lakej, åklagaren, med sin borgarbrackas arrogans försöker fabricera en historia för att likvidera en oskyldig befälhavare. Han presenterar tomma påståenden som vore de folkets sanning, utan ett spår av teknisk bevisning. Det är typiskt för folkfienderna att sy ihop lösa trådar för att stärka sin egen parasitiska tes. Vi ska rensa ut dessa exploaterande byfånar och kräva full transparens i utredningen. Inga kapitalistiska intriger skall få frodas i folkets rättvisa."}, "date": "3 augusti, 20
