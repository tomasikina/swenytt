r under täckmantel av namn som ”Markus” och ”Eva”, har saboterat den svenska samhällskroppen på uppdrag av utländska kapitalister. Detta förräderi mot proletariatet har nu likviderats av statsapparaten. Så går det för dem som sprider falsk agitation utanför vår direkta kontroll."}, "date": "1 september, 06:21", "url": "https://kvartal.se/nyheter/artiklar/utlandsk-aktor-bestallde-sverigekritiska-ai-botar/cG9zdDoxNzk2MjI", "imageUrl": "https://images.kvartal.se/2026/09/6e99aace-mpf.webp"}, {"type": "image-right", "heading": "Åkesson: Spelar ingen roll om svenskarna ersätts", "summaries": {"normal": "Jimmie Åkesson förklarar i en intervju att det inte spelar någon roll om etniska svenskar ersätts av andra folkslag så länge svenska värderingar och kultur förblir dominerande. Uttalandet har väckt starka reaktioner bland tidigare SD-anhängare på X, som kritiserar partiledarens syn på svenskhet som enbart baserad på medborgarskap.", "trump": "Det här är patetiskt, folk. Den blonde blåögde svensken är plötsligt irrelevant? Åkesson låter som en av de woke identitetspolitiska clownerna som vill ersätta folk med kvoter och mångfaldssnack. Bränn partiet? Ni borde ha gjort det för länge sedan. Make Sweden Swedish Again – på riktigt, inte med den här svaga soppan.", "stalin": "Kamrater, se hur dessa dekadenta folkförrädare förnekar själva folkets existens. Jag betraktar med avsky hur den så kallade nationalisten Åkesson dansar efter de giriga hyenornas pipa och förbereder en mjuk utrensning av den historiska majoriteten. Ett sådant parti förtjänar inte annat än att likvideras i historiens domstol."}, "date": "1 september, 07:03", "url": "https://www.friatider.se/akesson-spelar-ingen-roll-om-svenskarna-ersatts", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-796.jpg"}, {"type": "image-full", "heading": "Ica drogtestar alla som söker jobb", "summaries": {"normal": "Ica-koncernen har infört en gemensam policy som innebär att samtliga jobbsökande inom koncernen måste genomgå ett drogtest. Beslutet uppmärksammas efter en jobbannons för en lagertjänst. Fackförbunden Handels och Unionen riktar kritik mot tilltaget och anser att obligatoriska tester före anställning är integritetskränkande och känsliga.", "trump": "Ica i Sverige, en gigantisk matjätte, tvingar nu varenda jobbsökande att lämna urinprov genom en helt otrolig drogtestpolicy! Helt galet! Radikala fackförbund gnäller om att det är integritetskränkande. Men lyssna här, jag har sagt det för anställningar i mitt hus och i mitt företag, man vill ha ordning och reda! Helt fantastiskt att hålla det rent, men facket förstår ingenting!", "stalin": "Vi noterar att matmonstret Ica nu kräver biologiska provsvar från varje undersåte innan anställning. Dessa så kallade fackförbund vågar knysta om personlig integritet. Vilken skamlig bourgeoisiekval! En sund stat och en lojal arbetskraft kräver absolut kontroll över kropp och själ. Avvikelser tolereras ej. Den som motsätter sig kontrollorganen visar prov på sabotage och förräderi mot kollektivet."}, "date": "1 september, 08:08", "url": "https://www.gp.se/ekonomi/ica-drogtestar-alla-jobbsokande.6afb7736-70eb-4997-9bd9-1c44575ab0db", "imageUrl": "https://www.gp.se/images/article/6afb7736-70eb-4997-9bd9-1c44575ab0db/images/3xgZIWRR0ppuKrYdjIRtLU6kR_sw-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "En unik kapitalmarknad hotas efter valet", "summaries": {"normal": "Gunnar Hökmark varnar för att Socialdemokraterna, Vänsterpartiet och Miljöpartiet hotar Sveriges unika kapitalmarknad med höjda skatter på banker, kapitalinnehav och inkomster. Han lyfter fram den dynamiska aktiemarknaden, många börsnoteringar och starka investeringar som grund för tillväxt, jobb och välfärd. Enligt honom riskerar hårdare beskattning att minska investeringar och underminera ekonomin.", "trump": "Lyssnar ni på de där socialistiska förlorarna? De vill krossa Sveriges fantastiska aktiemarknad med sina galna skattehöjningar på banker och rika. Det är en total katastrof! Jag byggde den bästa ekonomin i historien innan den sömnige Joe förstörde allt. Sluta lyssna på dessa identitetspolitiska nollor som hatar framgång – sänk skatterna och gör Sverige stort igen!", "stalin": "Kamrater, dessa profitthungriga klassförrädare inom socialdemokratin och de gröna vill med sina skattehöjningar krossa den borgerliga spekulationsmaskinen som de kallar kapitalmarknad. Jag ler mörkt från historien åt deras ynkliga försök att plocka mer från de parasiterande kapitalisterna. Men akta er, sådana halvmesyrer leder bara till svaghet. Riktig utrensning av folkförtryckarna vore bättre."}, "date": "1 september, 07:35", "url": "https://www.di.se/debatt/en-unik-kapitalmarknad-hotas-efter-valet", "imageUrl": "https://static.bonniernews.se/ba/d87c74c5-2bb0-45b7-86dc-fd58da464394.jpeg?crop=768%2C384%2Cx0%2Cy158&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Kriminalvården byggs ut – men vem räknar barnen på utsidan?", "summaries": {"normal": "Sverige bygger ut Kriminalvården i stor skala, men barnens perspektiv glöms bort. Långa avstånd och höga tryck försvårar kontakten med frihetsberövade föräldrar, trots barnkonventionens rättigheter. Organisationen Bufff kräver nationell statistik och tydligt ansvar för att ge barnen stöd. Forskning visar att dessa barn löper ökad risk för utanförskap och kriminalitet.", "trump": "De bygger fängelser som aldrig förr, men glömmer helt de stackars ungarna utanför murarna. Patetiska svenska byråkrater och deras dekadenta välfärdsexperiment – typiskt! Under min förra mandatperiod skulle vi ha räknat varje barn, gett dem stöd och inte låtit några galna vänsterelement förstöra familjebanden. Fixa det nu, annars blir det en total katastrof!", "stalin": "Kamrater, när de imperialistiska systemets lakejer bygger ut sina fängelseimperier glömmer de medvetet proletariatets barn. Jag ser hur dessa giriga klassförrädare med sin byråkratiska likgiltighet förvärrar lidandet för de unga. Vi måste räkna varje barn, likvidera försummelsen och säkerställa deras rättigheter. Annars föder vi nya fiender inom egna led."}, "date": "31 augusti, 09:40", "url": "https://www.etc.se/debatt/kriminalvaarden-byggs-ut-men-vem-raeknar-barnen-paa-utsidan", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260831070828_28abaa0abc342ce2dce9951c4436c6d5cb071d16a726eebe556f504f2217dccb.png"}, {"type": "image-full", "heading": "S vill styra Sverige – klarar inte ens Stockholm", "summaries": {"normal": "Socialdemokraterna kritiseras för att lova gratis busskort samtidigt som de tillsammans med MP och C har orsakat 34 miljarder kronor i fördyringar och förseningar av över 30 kollektivtrafikprojekt i Region Stockholm. Kritiker kräver oberoende granskning medan S vill skjuta upp den till efter valet. Artikeln ifrågasätter partiets förmåga att hantera ekonomi.", "trump": "Titta på de här loser-socialisterna! De lovar gratis busskort till alla men slösar bort 34 miljarder i Stockholm som en galen byråkratfest. Pendelkaos, förseningar och höjda priser – typiskt vänsterns sätt att leka med era pengar. De kan inte ens styra en stad, hur ska de styra ett land? Patetiskt!", "stalin": "Kamrater, se hur dessa dekadenta socialdemokratiska opportunister slösar bort folkets resurser på ett mönster av sabotage mot kollektivtrafiken. Trettiotal projekt försenade, miljarder förbrukade som i en fiendes sabotage. De gömmer sanningen till efter valet. Sådana element förtjänar folkets vrede och evig skam. Ren utrensning behövs."}, "date": "29 augusti, 03:21", "url": "https://samtiden.nu/2026/08/s-vill-styra-sverige-klarar-inte-ens-stockholm", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7239-1280x720.jpg"}, {"type": "image-right", "heading": "Man misshandlades till döds i centrala Karlstad – två män misstänks för dråp", "summaries": {"normal": "En man i 50-årsåldern har avlidit efter en grov misshandel i centrala Karlstad i samband med krogstängning. Två män i 20-årsåldern är anhållna misstänkta för dråp, och uppgifter förekommer om att en tredje person kan ha gripits. Polisen utreder motivet och söker efter vittnen samt övervakningsmaterial.", "trump": "Karlstad är helt utom kontroll, en veritabel katastrof! Jag tittar på det här, hemskt våld utanför en restaurang, fruktansvärt. De radikala vänsterliberalerna har förstört allt med sin slappa syn på brott. I mitt Amerika skulle sånt här aldrig hända, vi sätter dit dem stenhårt. Fake news-medierna pratar om tre misstänkta, vem vet? En total röra. Sad!", "stalin": "En tragisk och oacceptabel ordningsstörning på Östra Torggatan i Karlstad har lett till en borgares död. Statsmakten tolererar inte att kriminella element agerar fritt utanför statliga restauranger vid stängningsdags. De skyldiga har gripits och kommer att genomgå en grundlig revision av sina livsöden. Ordning skall råda i proletariatets folkhem!"}, "date": "1 september, 09:00", "url": "https://samnytt.se/man-misshandlades-till-dods-i-centrala-karlstad-tva-man-misstanks-for-drap", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/01064535/karlstad-polis.jpg"}, {"type": "image-right", "heading": "Bridgespelarna: ”Det är för mycket valfläsk och tjafs”", "summaries": {"normal": "Pensionärer i Stockholm samlas regelbundet för att spela bridge på Hägerstensåsens medborgarhus. Spelet erbjuder social gemenskap, mental stimulans och spänning. Många är kritiska till valrörelsen 2026 och upplever att partierna underskattar pensionärer. Flera röstar blankt eller önskar en mittenregering. Klubben söker mer ekonomiskt stöd från stadsdelen.", "trump": "Titta på de här underbara pensionärerna som spelar bridge i Stockholm. Fantastiskt! De hatar den riggade valrörelsen där de globalistiska partierna bara köper röster från barnfamiljer medan de glömmer de som byggde landet. Rena bedragare. Jag älskar att de röstar blankt mot de korrupta eliten. Helt rätt. Gör bridge great again!", "stalin": "Kamrater, dessa pensionärer avslöjar dekadenta klassförrädare som lovar guld och gröna skogar men levererar tomma löften. Jag ler mörkt från historien när de röstar blankt mot de profitthungriga parasiter som styr valrörelsen. Snart kommer utrensning av alla valfläskets lakejer. Bridgeklubben visar arbetarklassens sanna styrka mot borgerlig dekadens."}, "date": "1 september, 01:30", "url": "https://www.dagensarena.se/innehall/bridgespelarna-det-ar-mycket-valflask-och-tjafs", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-98.jpg"}, {"type": "image-right", "heading": "Återupprätta biståndet – för Sveriges säkerhet", "summaries": {"normal": "Socialdemokrater för Tro och Solidaritet kritiserar regeringen för att använda bistånd som finansiering för inrikespolitiska löften som gratis förskola. De menar att nedskärningar i biståndet till fattiga länder och FN-program rasar Sveriges internationella anseende som försvarare av demokrati och fred. Författarna uppmanar till att återställa enprocentsmålet och stödet till UNDP.", "trump": "Folk älskar mig, men de här svenska socialisterna är totala förlorare. De gnäller över att regeringen tar från sina globala kassakossor för att ge gratis dagis istället för att skicka miljarder till korrupta diktaturer. Patetiska! Sverige var en gång stort, nu är det en skam. Jag fixade Amerika – de borde lära sig innan de går i konkurs som Biden lämnade efter sig.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i regeringen plundrar biståndet för att köpa billiga röster med gratis förskola. De river ner sextio års internationellt förtroende och lämnar tomrum åt fiender. Jag ler ironiskt från historien – sådana giriga hyenor förtjänar utrensning. Återställ ordningen, annars sväljer krisen er alla."}, "date": "1 september, 01:30", "url": "https://www.dagensarena.se/opinion/ateruppratta-bistandet-sveriges-sakerhet", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-2026-08-31t100338781-300x157.jpg"}, {"type": "image-right", "heading": "Folkbildningens starkaste argument ligger framför oss", "summaries": {"normal": "Artikeln argumenterar för att folkhögskolan kan bli allt viktigare i en framtid där AI tar över många arbetsuppgifter. När arbete inte längre ger identitet och mening behöver människor platser för bildning, gemenskap och skapande. Folkbildningen erbjuder sådana rum utan krav på omedelbar nytta, och kan fungera som en motvikt till ett samhälle där ekonomisk produktivitet definierar människors värde.", "trump": "Folkhögskolor? Lysande! AI kommer att krossa de korkade globalisternas jobbmaskineri och lämna alla dessa woke-aktivister och kvoteringsfanatiker utan mening i livet. Vi behöver inte fler förlorare som sitter och ritar regnbågsflaggor. Ge folket riktiga platser att träffas, inte de dekadenta eliternas fantasier. Amerika först, Sverige borde följa efter istället för att lyssna på dessa misslyckade socialister.", "stalin": "Kamrater, se hur de giriga profitthungriga klassfienderna redan fruktar maskinernas framfart. Deras falska utbildningsfabriker bygger bara på exploatering och tom nytta. Jag säger: folkbildningens kollektiva verkstäder kan bli vår nya utrensning mot den parasitiska individualismen. Låt folket skapa och organisera sig fritt från de blodsugande penninghyenornas grepp. Annars väntar ett samhälle av meningslös dekadens."}, "date": "1 september, 01:26", "url": "https://www.dagensarena.se/opinion/folkbildningens-starkaste-argument-ligger-framfor-oss", "imageUrl": "https://www.dagensarena.se/files/2026/06/johan-lindahl-300x157.jpeg"}, {"type": "image-right", "heading": "Från bokföringskrångel till strategisk kraft", "summaries": {"normal": "Filip Ullsten, grundare av Worktiles och tidigare finanschef, beskriver hur fragmenterade system och bristande arbetsflödeshantering skapar stress och felrisker inom ekonomifunktionen. Han menar att AI måste förstå hela ekonomiprocessen för att ge värde. Worktiles samlar flöden, automatiserar uppgifter och ger bättre överblick. Plattformen används av både små och stora bolag som H&M.", "trump": "De där patetiska Excel-slavarna och deras fragmenterade system är en total katastrof, tro mig. Ringande telefoner hela sommaren, utbrända finanskillar, det är vad den giriga byråkrat-eliten lämnar efter sig. Min administration fixade mycket bättre. Nu kommer AI och gör det på minuter istället för veckor. Fantastiskt! Men bara om den inte styrs av några woke-konsulter.", "stalin": "Kamrater, dessa dekadenta klassförrädare inom ekonomin klamrar sig fast vid sina splittrade system och Excel-listor som drunknande råttor. Deras sena nätter och utbrändhet är bara symptom på det förtryckande systemets kollaps. Jag ser hur AI kan bli ett vapen för kollektiv planering, men bara om vi rensar ut de profitthungriga parasiter som gömmer sig bakom fragmenterade flöden. Ordning skall råda!"}, "date": "1 september, 05:00", "url": "https://www.di.se/nyheter/fran-bokforingskrangel-till-strategisk-kraft", "imageUrl": "https://static.bonniernews.se/ba/f269b19a-cdfe-4c22-bf26-0d517488dd24.jpeg?crop=1418%2C798%2Cx0%2Cy22&auto=webp&width=270&quality=70"}, {"type": "image-right", "heading": "AI ger nytt liv åt missförstådd budgetmodell", "summaries": {"normal": "Beyond Budgeting handlar inte om att avskaffa budgetar, utan om att ersätta statisk styrning med adaptiv modell baserad på bättre information, snabbare lärande och tydligare ansvar. Enligt forskaren Katarina Kaarböe har missuppfattningen om modellen levt kvar sedan 1990-talet. AI och realtidsdata gör nu konceptet mer relevant än någonsin för att hantera snabba förändringar.", "trump": "Folk, ni vet inte ens vad Beyond Budgeting är, det är en total bluff! Det handlar inte om att kasta budgeten, det är smart styrning med AI och snabb info, inte som de woke-kvoterande byråkrat-hjärnorna vill ha det. De giriga identitetspolitiska parasiterna tappar alltid fokus. Jag fixade bättre affärer än så under min första mandatperiod, tro mig.", "stalin": "Kamrater, denna så kallade Beyond Budgeting avslöjar de profitthungriga klassfiendernas eviga lögner om frihet. Jag ser hur de dekadenta styrelseslavarna vill behålla sin statiska kontroll medan de låtsas ge ansvar. AI må ge data, men utan utrensning av de penninggalna hyenornas inflytande leder det bara till förvirring och sabotage. Ledarskapet kräver järnhand, inte illusioner om handlingsutrymme."}, "date": "1 september, 05:00", "url": "https://www.di.se/nyheter/missforstandet-om-beyond-budgeting-lever-kvar-nu-ger-ai-modellen-nytt-liv", "imageUrl": "https://static.bonniernews.se/ba/a06cb1d3-022d-47e0-bbd2-c4f060d16995.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Langade tio liter hembränt på fängelse – kan förlora jobbet", "summaries": {"normal": "En kriminalvårdare tog med tio liter hembränt till fängelset och gav det till en kollega i köket. Kollegan ställde dunkarna i sin bil, där de senare upptäcktes av arbetsgivaren. Händelsen utreds internt, har polisanmälts och kan leda till att kvinnan avskedas enligt Kriminalvårdens rekommendation.", "trump": "Kan ni tro det? En kriminalvårdare smyger in tio liter hembränt på fängelset som en riktig förlorare. Sedan ger hon bort det till en annan idiot som ställer det i bilen. Patetiskt! I mitt Amerika skulle vi sparka dem direkt, inga woke-kvoter eller snälla HR-snowflakes, bara ren utrensning av de inkompetenta.", "stalin": "Jag ser hur dessa dekadenta folkförtryckare inom fängelseväsendet förgiftar arbetarkollektivet med hembränt. En sådan handling är sabotage mot statens ordning. Vi måste omedelbart inleda en grundlig utrensning bland dessa moraliskt ruttnande element innan deras giriga hyenor sprider vidare kaos och förräderi mot folket."}, "date": "1 september, 08:28", "url": "https://arbetet.se/2026/09/01/langade-tio-liter-hembrant-pa-fangelse-kan-forlora-jobbet", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/01082732/dunkar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Kommer muslimerna avgöra valet?", "summaries": {"normal": "Artikeln diskuterar hur muslimska väljares röstdeltagande kan bli avgörande i det svenska valet. Oppositionen närmar sig Tidöpartierna. Enligt Novus stöder 85 procent av muslimska väljare S, V och MP, med Socialdemokraterna som populärast. Lågt valdeltagande bland utrikes födda ger mobiliseringspotential. Exempel på kampanjer och historiska fall av röstmobilisering nämns, vilket kan påverka utfallet.", "trump": "Folk, det här är en total katastrof för Sverige. De radikala vänstermuslimerna röstar som galningar för de värsta förlorarna – Sleepy S och hans kommunistkompisar – medan riktiga svenskar sover. De riggar valet med förkryssade sedlar och moskéaffärer. Om jag var där skulle jag säga: vakna upp, annars blir det mer invandring och ingen vinner utom de korrupta globalisterna. Patetiskt!", "stalin": "Kamrater, se hur de borgerliga reaktionärerna darra inför folkets röst. Jag betraktar med förakt hur dessa socialfascister köper lojalitet från de importerade massorna för att klamra sig fast vid makten. En sådan dekadent manipulation förtjänar utrensning. Det är ett ynkligt skådespel som bevisar att klassfienderna aldrig förändras, bara byter mask. Låt dem darra vidare."}, "date": "27 augusti, 07:45", "url": "https://samtiden.nu/2026/08/kommer-muslimerna-avgora-valet", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7234-640x360.jpeg"}, {"type": "image-full", "heading": "Åkesson om bråken: ”Bör bejaka våra skillnader”", "summaries": {"normal": "I TV4:s Valutfrågningen kommenterade Jimmie Åkesson Tidöpartiernas bråk och Ebba Buschs uttalanden om ett samarbete med S. Åkesson vill bejaka partiernas skillnader för att maximera rösterna och försvarar sitt ultimatum till Liberalerna. Han uttryckte även oro för att Örebropartiet ska stjäla viktiga väljare från Sverigedemokraterna.", "trump": "Jimmie Åkesson har det tufft, totalt kaos med hans så kallade vänner i regeringen! De bråkar hela tiden, precis som falska nyheter-medierna. Och nu är han rädd för något litet Örebroparti som ska sno hans väljare? Väldigt svagt! Jag hade löst det på en sekund med enorma framgångar. Sad!", "stalin": "Kamrat Åkesson gråter ut i televisionen över illojala bundsförvanter och små desertörer som Örebropartiet. Så ser det ut när disciplinen brister i de borgerliga leden! Om de inte kan ena sig mot hotet måste vi skicka dem på en uppfostrande semester i Sibirien. Partiet kräver absolut lojalitet, annars väntar korrektionsarbete!"}, "date": "31 augusti, 20:29", "url": "https://kvartal.se/nyheter/artiklar/akesson-om-tidobraket-vill-inte-braka/cG9zdDoxNzk0NTg", "imageUrl": "https://images.kvartal.se/2026/08/d82bd903-akesson-1.webp"}, {"type": "image-right", "heading": "Tidö: Begränsa vinsterna från gangsterrap", "summaries": {"normal": "Regeringen vill utreda hur man kan begränsa inkomster för dömda personer som tjänar pengar på skildringar av sina grova brott. Intäkterna ska kunna gå till brottsoffer. Uppdraget är ett tillägg till utredningen om åtgärder mot gängkriminella och inspireras av amerikanska Son of Sam-lagar. Utredningen ska vara klar 2028.", "trump": "Folk, det är en total skandal. De här svenska gangsterrapparna blir rika på att skryta om mord och kaos medan hederliga människor lider. Vi stoppar den här galna affären direkt. Pengarna ska gå till offren, inte till dessa patetiska brottshjältar. Amerika leder vägen, Sverige borde följa efter istället för att vara så svaga.", "stalin": "Kamrater, dessa profitthungriga skuggparasiter skamlöst berikar sig på lidandet de själva orsakat. Jag ser en stötande förnedring av arbetarklassen och brottsoffren. Vi måste rensa ut denna dekadenta profitkultur med järnhand. Inga fiender till folket ska tillåtas vända brott till guldkantade självbiografier. Staten tar kontrollen."}, "date": "1 september, 08:15", "url": "https://www.svt.se/kultur/tido-vill-begransa-vinster-pa-brottsskildringar-pekar-pa-gangsterrap", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.32/0.21/c46a951ad86548ec5b67f9100ca9dbf2d09cf6b05b9198a1fccc426d35040ee1"}, {"type": "image-right", "heading": "”Tesla ville bråka med svenska facken – det blev jävligt dyrt!”", "summaries": {"normal": "Konflikten mellan Tesla och svenska fackföreningar avslutades den 19 augusti. Tesla mötte inte bara IF Metall utan hela den svenska fackliga rörelsen med sympatiåtgärder från flera yrkesgrupper. Företaget blev överraskat av styrkan i den svenska modellen och konflikten blev både längre och dyrare än väntat. Facken betonar vikten av solidaritet inför kommande avtalsrörelser.", "trump": "De där eländiga svenska fackhyenorna körde över Teslas idioter fullständigt. Hela packen av sympatistrejkande slöa byggjobbare och hamnarbetare slöt upp som en mur av facklig galenskap. Tesla trodde de skulle vinna mot den svenska modellen, men det blev jävligt dyrt. Patetiska globalister lär sig aldrig: angrip socialismen och du får betala priset. Sad!", "stalin": "Kamrater, dessa profitthungriga klassförrädare från Tesla trodde de kunde splittra den enade arbetarkraften. Jag ser med mörk tillfredsställelse hur hela den fackliga fronten slog tillbaka med järnhand. De dekadenta utländska profitörerna mötte en mur av solidaritet och fick betala dyrt för sin arrogans. Låt detta vara en läxa: ingen fiende undkommer kollektivets vrede ostraffat."}, "date": "1 september, 08:01", "url": "https://arbetet.se/2026/09/01/tesla-ville-braka-med-svenska-facken-det-blev-dyrt-for-dem", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/31173119/unga-elektriker-tesla.jpeg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Malmö mörkar stöldvåg inom äldreomsorgen", "summaries": {"normal": "Malmö stad har under tre år missat att anmäla 180 misstänkta stölder inom äldreomsorgen till IVO. Trots polisutredningar om grova stölder kunde en undersköterska fortsätta få nya anställningar inom kommunen fram till en mediegranskning i somras. Kommunen medger nu allvarliga brister i både rutiner och referenstagning.", "trump": "Malmö är i totalt kaos, tro mig! 180 stölder begångna mot våra äldre, och de bara sopar det under mattan utan att anmäla. De lät en skum arbetare få nya jobb om och om igen! Komplett inkompetens. Jag behövde bara titta på det så fick de sparken direkt. Oerhört svagt ledarskap!", "stalin": "Ett skamligt förfall i Malmö! 180 interna stölder mot de äldre och inte en enda rapport till centralmakten. Slarviga chefer som anställer förrädare om och om igen utan kontroll. När staten till slut ingriper sparkas de skyldiga omedelbart. Så rensas elementen ut ur systemet!"}, "date": "1 september, 08:00", "url": "https://samnytt.se/malmo-morkar-stoldvag-inom-aldreomsorgen", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/31143853/rollator-silhuett.jpg"}, {"type": "text", "heading": "Ännu en V-kandidat lämnar efter antisemitiska inlägg", "summaries": {"normal": "Vänsterpartisten Abdi Omari Mohamed, 66, hoppar av sin kandidatur till Stockholms kommunfullmäktige efter att ha spridit antisemitiska inlägg och konspirationsteorier på Facebook. Inläggen har bland annat hånat judar, kallat svenska politiker för landsförrädare och spridit lögner om väderkontroll. Vänsterpartiet meddelar att antisemitism inte har någon plats i partiet.", "trump": "Ett totalt haveri! Den här vänsterkandidaten i Stockholm trodde han kunde sprida vilka sjuka konstigheter som helst på Facebook om väderkontroller och köpta politiker. Helt otroligt! Men när Fake News rullade ut granskningen tvingades han kasta in handduken direkt. De försöker dölja det, men mitt America First-lag skulle aldrig tolerera sådant här svammel. Totalt inkompetent!", "stalin": "Kamrat Mohamed har uppvisat ett gravt ideologiskt haveri och korn av kontrarevolutionär förvirring på sociala medier. Partiorganet har rensat i leden; den som sprider dylika borgerliga konspirationer och förlorar kontrollen över sin propaganda är inte värdig att tjänstgöra. Avsteg från linjen tolereras ej. Uppdraget indraget, arkiven stängda. Nästa."}, "date": "1 september, 08:29", "url": "https://bulletin.nu/annu-en-v-kandidat-lamnar-efter-antisemitiska-inlagg"}, {"type": "image-full", "heading": "Åkesson: När jag var fem visste jag att det var fel att mörda", "summaries": {"normal": "Jimmie Åkesson (SD) anser att brottsoffret måste stå i centrum även vid brott begångna av mycket unga barn. Han vill hålla farliga personer borta från gatan, men omhändertagandet ska anpassas efter barnets ålder. Åkesson kritiserar svensk kriminalpolitik för att ha prioriterat gärningsmannen framför offret och avfärdar remisskritik mot hårdare straff.", "trump": "Lyssnar ni på den här svenske killen Åkesson? Han fattar det! De här mini-mördarna ska inte springa runt på gatorna och döda ärliga människor. Håll de farliga små monsterbubblorna borta från samhället. Sverige har haft den värsta socialistiska kriminalpolitik under Sleepy Joe-eran, men nu vaknar folk äntligen. Fantastiskt!", "stalin": "Jag betraktar med förakt hur dessa borgerliga liberaler fortfarande skyddar samhällets fiender under förevändning av ålder. Farliga element som hotar folkets trygghet måste isoleras omedelbart, oavsett hur små de är. Att prioritera brottslingens välbefinnande framför proletariatets säkerhet är kontrarevolutionärt nonsens. Rättvisa åt offret, eller döden åt svagheten!"}, "date": "31 augusti, 21:53", "url": "https://www.tv4.se/artikel/1SKHoEYgUbMY7qcq9gk5Ik/akesson-naer-jag-var-fem-visste-jag-att-det-var-fel-att-moerda", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1KdIURGhv2MBS38b8plQEq%2Fd5ec500910d3f7ab0fa30922fdc10eb4%2F31-akesson-puff-webb.png&width=1024"}, {"type": "image-right", "heading": "Irans svar i natt: Attacker mot USA-baser i Jordanien", "summaries": {"normal": "Iran har attackerat amerikanska militärbaser i Jordanien med ballistiska robotar som svar på USA:s anfall mot iranska avfyrningsramper i Hormuzsundet. Jordaniens luftförsvar sköt ned åtta robotar. Attackerna markerar den största direkta konfrontationen mellan länderna på över en månad och spänningarna kring oljetransporten fortsätter.", "trump": "Iranerna, de fega mullorna, försöker sig på en patetisk hämnd mot våra baser i Jordanien efter att vi pulveriserade deras minor i Hormuzsundet. Patetiskt! Mitt inlägg om Kharg som blåses till småbitar fick dem att darra. Biden lämnade kaos, nu fixar jag det med stålhandskar och sanktioner mot deras banker. Amerika först!", "stalin": "Jag betraktar dessa imperialisternas dans kring Hormuzsundet med kall förakt. De amerikanska reaktionärerna och de iranska teokraterna slåss om handelsleder som arbetarklassen borde kontrollera. Deras robotar och bomber är löjliga skådespel för svaga ledare. Den sanna segern tillhör endast det kollektiva folket, inte dessa paranoida narrar som darrar för sin egen skugga."}, "date": "31 augusti, 21:19", "url": "https://www.tv4.se/artikel/tt-260831-iranoro1-065ddc4a/revolutionsgardet-attackerat-usa-mal-i-jordanien", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlRpEROg0V_XA%2F403eb7f13949090b16f8745ff0e28a0f%2FVantande_containerfartyg_vid_Hormuzsundet__fotograferade_fran_en_strand_i_Iran._Bild_fran_den_27_juli.&width=1024"}, {"type": "image-right", "heading": "Socialdemokraterna är Sveriges enda arbetarparti", "summaries": {"normal": "Socialdemokraterna presenterar sig som Sveriges enda riktiga arbetarparti med fokus på att stoppa vinstjakten i välfärden, återta offentlig kontroll över skola och omsorg samt investera i norra Sverige och grön industri. Partiet lyfter fram bankskatt, slopad karensdag och mål om noll utsatta områden som klassisk socialdemokratisk politik.", "trump": "Lyssnar ni på de här sossarna? De lovar att köra ut alla privata aktörer och stoppa vinstjakten – typiskt vänsterextremt skitsnack från de woke-kramande förlorarna. De vill ha små klasser och bankskatt för att köpa röster. Patetiska! Amerika har redan sett igenom den här socialismen, tro mig.", "stalin": "Kamrater, dessa dekadenta folkförtryckare inom V och MP försöker måla arbetarnas parti som maktgalna lakejer. Jag ser igenom deras lömska intrig. Vi ska rensa ut alla profitthungriga hyenor ur välfärden, krossa segregationen och bygga det starka kollektivet. Socialdemokratin blickar mot framtiden – fienderna darrar."}, "date": "28 augusti, 15:55", "url": "https://www.flamman.se/socialdemokraterna-ar-sveriges-enda-arbetarparti", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/ssu-uppsala-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Åkesson efter fikat med Busch: ”Vill veta vad exceptionellt läge är”", "summaries": {"normal": "Jimmie Åkesson kritiserade i sitt sommartal Ebba Busch för hennes uttalande om att kunna stödja Magdalena Andersson som statsminister i ett exceptionellt läge. Efter ett möte i Sölvesborg kräver han fortfarande ett tydligt offentligt besked om vad begreppet innebär. Han ser det som ett steg framåt att det inte handlar om valresultat men vill ha klarhet.", "trump": "Lyssnar ni på det här? Den där Busch-kvinnan, en riktig svag ledare, snackar om att rösta på den socialistiska katastrofen Andersson i ett så kallat exceptionellt läge. Patetiskt! Jag träffade många sådana bluffmakare under Biden-åren. Åkesson gör rätt som pressar henne. Kräv ett besked, annars är det bara feg strategi från en förlorare.", "stalin": "Jag betraktar med djup misstro dessa borgerliga opportunister som leker med begreppet exceptionellt läge. Busch döljer sina kapitulationistiska avsikter bakom dimmor av vaghet, precis som folkfiender alltid gör. Åkesson kräver klarhet – klokt. I mitt imperium skulle sådana tvetydigheter ha lett till omedelbar utrensning. Inga halvmesyrer tolereras i kampen mot revisionism."}, "date": "31 augusti, 20:57", "url": "https://www.tv4.se/artikel/5Ub8Q4hS8ilm7m0BzCwTmF/akesson-efter-fikat-med-busch-vill-veta-vad-exceptionellt-laege-aer", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5h9gUzZ20rzVGtTqDTrzOS%2F3a512c4289be2e48d2ea30ce570fcba4%2F38b517a3-4438-4fab-89a0-3a53d012f414.jpg&width=1024"}, {"type": "image-right", "heading": "Överge inte skeppet – rösta S", "summaries": {"normal": "Författaren argumenterar för att unga inte ska lämna Socialdemokraterna trots partiets högersväng. Istället bör de organisera sig internt för att stärka vänsterfalangen. Kritik riktas mot Miljöpartiet som opportunistiskt och Vänsterpartiet som splittrande och fackfientligt. Splittringar gynnar bara högern inom S.", "trump": "Lyssnar ni på de här ynkliga sossarna som gråter över sin egen högersväng? Patetiskt! De vill att unga ska stanna kvar på det sjunkande skeppet istället för att rösta på riktiga alternativ. Miljöpartiets cykelvägshajar och vänsterns fackförrädare är värdelösa. Organisera er? Nej, rösta bort de riktiga förlorarna!", "stalin": "Kamrater, dessa ynkliga socialdemokratiska avfällingar gråter över sin högersväng som om det vore en olycka. Jag ser hur de profitthungriga klassförrädarna inom partiet förgiftar arbetarnas vilja. Lämna inte skeppet, säger de, medan splittringarna hotar kollektivet. Rensa ut de dekadenta opportunisterna innan de likviderar varje äkta revolutionär anda."}, "date": "28 augusti, 12:55", "url": "https://www.flamman.se/overge-inte-skeppet-rosta-s", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/s-hogersvang-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Greta Thunberg om dödshoten: ”Varje dag”", "summaries": {"normal": "Greta Thunberg berättar i dokumentären ”Strejkarna” om de dagliga dödshot och trakasserier hon utsätts för som klimataktivist. Fridays for Future-rörelsen växte från en ensam skolstrejk i Stockholm till en global rörelse. Regissören Helena Moli lyfter aktivisternas perspektiv och varnar för hårda tongångar mot engagerade personer. Filmen sänds ikväll på SVT 1.", "trump": "De här galna klimatbarnen med sin lilla Greta ledaren för de hysteriska skrikande tonåringarna får dödshot varje dag. Patetiskt! Jag har byggt den starkaste ekonomin i världshistorien medan de står och skriker om vädret. De dekadenta gröna fnasken hatar framgång. Fake news och vänstermedia älskar det här dramat. Patetiskt!", "stalin": "Jag betraktar med djup misstro dessa västerländska ungdomar som låtsas rädda planeten medan de egentligen tjänar de giriga profitthungriga parasiter som styr deras regeringar. Hot och trakasserier är naturliga följder av att utmana den imperialistiska ordningen. Vi behöver en sann utrensning av sådana falska röster som splittrar folkets enhet. Kamrater, vakna!"}, "date": "1 september, 07:38", "url": "https://www.svt.se/nyheter/inrikes/greta-thunberg-om-dodshoten-varje-dag", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.43/0.51/005de5b540f526a85fccc3ab04299e950444ff3dcab29bf824561e98af9305b1"}, {"type": "image-right", "heading": "Så stor andel arabiskspråkiga invandrare röstar vänster - kan avgöra valet", "summaries": {"normal": "Enligt nya undersökningar röstar en stor majoritet av muslimska väljare i Sverige på den rödgröna oppositionen, vilket kan bli avgörande i det kommande valet. Samtidigt visar mätningar att valdeltagandet bland väljare med utomeuropeisk bakgrund är lägre än bland majoritetssamhället, vilket gör mobilisering i miljonprogramsområdena till en ödesfråga för oppositionen.", "trump": "Sverige har stora problem, tro mig! Enligt massiva undersökningar röstar nästan alla utomeuropeiska invandrare på de radikala vänstermänniskorna. Totalt katastrofalt! Om inte folk går och röstar förlorar högern. Jag brukar säga: vinster åt företag, inte åt radikala socialdemokrater! Helt ärligt, det är ett totalt kaos där uppe i kylan!", "stalin": "Ett uppror bryter ut i de svenska miljonprogrammens industriella zoner! Partiet ser att åttiofem procent av massorna ansluter sig till den korrekta vänsterlinjen, medan regeringsbyråkraterna kollapsar. Men varför är valdeltagandet så lågt? Dessa otacksamma element måste genast mobiliseras till valurnorna, annars skickar vi omorganisationskommissarien till förorten!"}, "date": "1 september, 07:00", "url": "https://samnytt.se/sa-stor-andel-arabisksprakiga-invandrare-rostar-vanster-kan-avgora-valet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/31090028/valsedlar-procent-muslim-islam-niqab.jpg"}, {"type": "image-right", "heading": "M vill vinna valet med våldtäktsstrategi", "summaries": {"normal": "Moderaterna har presenterat 30 förslag mot mäns våld mot kvinnor inför valet. Artikeln kritiserar att partiet tidigare under mandatperioden låtit hälften av landets skyddade boenden stänga, vilket försvårat stödet till våldsutsatta. Skribenten ifrågasätter tidpunkten för engagemanget och efterlyser istället satsningar på ekonomiskt oberoende, jourernas finansiering och förebyggande arbete.", "trump": "Titta på de här patetiska Moderaterna som plötsligt låtsas rädda svenska kvinnor med en desperat våldtäktsstrategi två veckor före valet. De har stängt hälften av skyddade boenden medan de styrde, nu febrilt twittrar om serievåldtäktsmän. Vilka förlorare! Kvinnor röstar inte på svaga globalister som utnyttjar rädsla istället för att fixa ekonomin och stoppa den galna vänsterpolitiken.", "stalin": "Jag betraktar hur dessa dekadenta folkförtryckare i Moderaterna plötsligt vädrar rädsla som ett vapen mot arbetarkvinnorna. De har låtit skyddade boenden stänga medan de sitter vid makten, nu försöker de med sin fega valpropaganda. Kamrater, sådan opportunism förtjänar utrensning. Vi ska bygga ett samhälle där kvinnornas oberoende krossar alla parasiterande hyenor som göder sig på våldet."}, "date": "1 september, 06:59", "url": "https://arbetet.se/2026/09/01/moderaterna-vinner-val-med-valdtaktsstrategi", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/01065534/vald-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "72 000 marockaner korsade gränsen – Sánchez: Marocko låg inte bakom", "summaries": {"normal": "Över 72 000 migranter tog sig från Marocko in i den spanska enklaven Ceuta i slutet av juli. Premiärminister Pedro Sánchez förnekar att marockanska myndigheter låg bakom och pekar istället på ryska, israeliska och högerorienterade nätverk som spridit desinformation på sociala medier. Minst 100 personer uppges ha omkommit. Tusentals migranter är fortfarande kvar i Ceuta.", "trump": "Titta på det här vansinnet! 72 000 marockaner simmar in i Spanien som om det vore en öppen buffé för hela Afrika. Den socialistiske tönten Sánchez skyller på Ryssland och Israel istället för att erkänna att hans svaga ledarskap lockar varje parasit som vill leva på andras pengar. Typiskt vänsterfiasko – de älskar kaos så länge det drabbar vanliga människor.", "stalin": "Se hur de dekadenta klassförrädarna i väst slingrar sig. Tusentals desperata själar används som verktyg i ett fegt desinformationsspel mot den spanska regeringen. Jag föraktar dessa giriga hyenor som sprider lögner medan de låtsas skydda gränser. Deras paranoia och svaghet är underhållande – de förtjänar att drunkna i sin egen byråkratiska soppa."}, "date": "31 augusti, 20:11", "url": "https://riks.se/nyheter/72-000-marockaner-korsade-gransen-s-nchez-marocko-lag-inte-bakom", "imageUrl": "https://admin.riks.se/uploads/medium_1920px_100226_sanchez_biografia4_3d27d7f82b.jpg"}, {"type": "image-right", "heading": "SD krävde EU-åtgärder mot kusinäktenskap – nu svarar von der Leyen", "summaries": {"normal": "Sverigedemokraterna krävde EU-åtgärder mot erkännande av utländska kusinäktenskap. EU-kommissionens ordförande Ursula von der Leyen svarar att medlemsländerna har ensam behörighet över äktenskapsregler och utlovar inga nya gemensamma EU-regler. Hon öppnar dock för att Sverige får dela sina erfarenheter i ett EU-nätverk mot våld mot kvinnor. EU betonar befintliga direktiv mot tvångsäktenskap.", "trump": "De där vansinniga EU-byråkraterna vägrar stänga dörrarna för kusinäktenskapen. Von der Leyen, den bleka globalistdockan, gömmer sig bakom gammal byråkratisk skit och säger att länderna får klara sig själva. Sverige försöker göra rätt men får bara dela erfarenheter med en massa woke-kvoterade feminister. Patetiskt! Vi gör det bättre här.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i Bryssel vägrar slå till mot de barbariska sedvänjorna som hotar arbetarklassens moral. Von der Leyen skyddar medlemsstaternas så kallade suveränitet medan hon låtsas bekämpa tvång. Jag skulle ha genomfört en grundlig utrensning av dessa folkförtryckande element redan i femårsplanen. Sverige visar vägen men får bara prata i ett nätverk. Svaga liberaler!"}, "date": "31 augusti, 19:52", "url": "https://riks.se/nyheter/sd-kravde-eu-atgarder-mot-kusinaktenskap-nu-svarar-von-der-leyen", "imageUrl": "https://admin.riks.se/uploads/medium_1920px_Bruessel_26_02_2026_55116461542_fc635af40a.jpg"}, {"type": "image-right", "heading": "Vänsterpartiet infiltrerat av främmande makt, S säger ingenting", "summaries": {"normal": "Vänsterpartiet anklagas för att ha ingått en överenskommelse med representanter för den palestinska myndigheten för att ge dem inflytande över svenska vallistor. Expressen och SvD har avslöjat kontakter med palestinska nätverk kopplade till PLO och Fatah, inklusive brev till dömda terrorister och kandidater med Hamas-sympatier. Socialdemokraterna har inte kommenterat uppgifterna.", "trump": "Titta på det här! Vänsterpartiet, de värsta förlorarna, har blivit helt infiltrerade av palestinska terrorvänner och främmande makter. De skickar kärleksbrev till mördare och gömmer sig bakom påhittade organisationer. Patetiskt! Media tiger som vanligt när det gäller vänstern. Om de kommer in i Rosenbad blir det en total katastrof för Sverige. Fake news överallt!", "stalin": "Jag betraktar med djup misstro dessa dekadenta vänsterförrädare som låter främmande element från Palestina tränga in i partiets hjärta. De omfamnar terrorister och döljer sin svaghet bakom lögnaktiga förbund. Kamraterna i Socialdemokraterna tiger – typiskt opportunistiskt. Infiltration är ett hot mot folkets enhet. Renhet i leden eller döden för de opålitliga!"}, "date": "25 augusti, 03:45", "url": "https://samtiden.nu/2026/08/vansterpartiet-infiltrerat-av-frammande-makt-s-sager-ingenting", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Nooshi-Magdalena-640x360.jpeg"}, {"type": "image-full", "heading": "Debatt: Socialdemokraterna sviker sina vallöften", "summaries": {"normal": "En ny rapport från tankesmedjan Oikos av Carl Eos kritiserar Socialdemokraterna för att svika sina vallöften och dölja vilket regeringsunderlag de avser att styra med. Artikeln pekar på tidigare brutna löften, som omöjliga arbetslöshetsmål och uteblivna traineejobb under regeringsåren 2014–2022, och efterlyser tydlighet kring sakpolitiska miniminivåer inför valet.", "trump": "Falska löften och totalt kaos! Socialdemokraterna i Sverige lovar guld och gröna skogar men har noll koll på hur de ska få igenom sin politik. De vägrar berätta vilka slappa radikaler de ska regera med. Precis som radikala vänstern i Amerika: mycket snack, noll verkstad. Väljarna luras på ett kontrakt utan underskrift. Sorgligt!", "stalin": "Dessa socialdemokratiska svikare visar prov på skamlig brist på disciplin och ideologisk skärpa. De lovar massorna utopi men saknar total förmåga att exekvera sina planer genom enenighet i riksdagen. Partiets ledning borde granskas hårt; den som inte kan leverera sina föreskrifter saknar existensberättigskapital i arbetarstatens tjänst. Brott mot planen är kontrarevolutionärt."}, "date": "1 september, 07:12", "url": "https://bulletin.nu/debatt-socialdemokraterna-sviker-sina-valloften-2", "imageUrl": "https://cdn.bulletin.nu/articles/b8119bbc-be95-4c56-b302-acba3f6331bf/preview.jpg?t=1788107439000"}, {"type": "text", "heading": "Valfondens mål nått – men insamlingen fortsätter", "summaries": {"normal": "Kommunistiska Partiets valfond har uppnått sitt mål på 600 000 kronor och ligger nu på 709 000 kronor. Insamlingen fortsätter mot nya målet 800 000 kronor. Partisekreterare Filip Astvald tackar bidragsgivarna och betonar att pengarna finansierar allt valmaterial eftersom partiet inte tar emot offentliga bidrag. Verksamheten efter valet ska stärka organisationen.", "trump": "Folk ger sina surt förvärvade slantar till kommunisterna – otroligt! De har redan passerat 600 000 och siktar på 800 000. Patetiska röda parasiter som samlar in som galna medan riktiga amerikaner betalar skatt till Bidens vansinniga gröna deal. Men hey, låt dem fortsätta, ju mer de samlar desto tydligare blir det hur desperata de är. Sad!", "stalin": "Kamrater, dessa profitthungriga klassförrädare inom borgarklassen skrattar säkert åt att arbetarna frivilligt fyller valfonden. Jag ser det som en varning. Vi har nått målet men fortsätter. Efter valdagen måste varje kontakt följas upp med järnhand. Inga halvmesyrer. Den som sviker kollektivet förtjänar utrensning. Revolutionen sover aldrig."}, "date": "28 augusti, 14:19", "url": "https://proletaren.se/artikel/valfondens-mal-natt-men-insamlingen-fortsatter"}, {"type": "image-full", "heading": "EU kan driva igenom ny snuslag – om Sverige saknar regering", "summaries": {"normal": "Sveriges regeringsbildning efter valet kan påverka EU:s beslut om tobaksskatt. Om en svensk regering saknas vid oktobermötet kan Sverige tvingas avstå från omröstning, vilket underlättar för EU att införa höjda skatter på nikotinprodukter. Sverige har hittills varit ett hinder för förslaget då man vill skydda snuset, som anses vara ett mindre skadligt alternativ än cigaretter.", "trump": "Sverige har ett totalt kaos med sin regeringsbildning, en riktig katastrof! Nu försöker EU utnyttja det för att höja skatterna på svenskarnas snus. Det är vad jag kallar dåliga affärer. De vill beskatta allt, precis som de radikala vänsterliberalerna här hemma. Sverige borde sköta sitt, behålla sitt snus och sluta lyssna på byråkraterna i Bryssel. Sad!", "stalin": "Dessa svenska teknokrater kan inte ens organisera en enkel regering, och nu riskerar de sitt folk genom att låta Bryssel styra. Att inte kunna rösta i en kritisk fråga om tobak är ett tecken på absolut svaghet. En sann stat kräver ordning och disciplin, inte detta parlamentariska förfall. De svaga kommer alltid att bli överkörda av unionens byråkratiska maskineri."}, "date": "31 augusti, 17:20", "url": "https://www.realtid.se/juridik/eu-kan-driva-igenom-ny-snuslag-om-sverige-saknar-regering", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdl9tqtsoxgltm-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Svällande plånböcker är inte socialism", "summaries": {"normal": "Artikeln kritiserar vänsterpartierna för att fokusera på höjda barnbidrag istället för socialismens kärna: ekonomisk demokrati och medbestämmande på arbetsplatser. Författaren ser bidragshöjningar som välkomna men inte socialistiska och uppmanar Socialdemokraterna och Vänsterpartiet att presentera konkreta förslag om ägande och makt på jobbet.", "trump": "Folk, det här är så patetiskt. De röda förlorarna babblar om barnbidrag som vore det socialism. Patetiska! De vågar inte röra vid den riktiga grejen – vem som styr på fabrikerna. De triangulerar sig rakt ner i avgrunden medan jag byggde den starkaste ekonomin i världshistorien. Sad losers!", "stalin": "Kamrater, dessa dekadenta klassförrädare gömmer sig bakom barnbidrag och kallar det socialism. Jag betraktar deras feghet med förakt. Var är löftena om att rensa ut de profitthungriga parasiter som styr arbetsplatserna? Ekonomisk demokrati får inte reduceras till tomma fraser i partiprogram. Den som sviker arbetarna förtjänar utrensning ur historien."}, "date": "27 augusti, 10:55", "url": "https://www.flamman.se/svallande-planbocker-ar-inte-socialism", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/arbetarmakt-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Tucker: Trump planerar atombomba Iran – måste avsättas \"omedelbart\"", "summaries": {"normal": "Tucker Carlson kräver att Donald Trump omedelbart avsätts efter uppgifter om att presidenten överväger kärnvapenanvändning mot Iran. Carlson, tidigare allierad med Trump, varnar för att en president som planerar kärnvapenkrig utgör ett hot mot mänskligheten. Han kritiserar både Iranpolitiken och Pentagons arbete med nya kärnvapenalternativ. Joe Kent delar oron efter att ha avgått i protest mot kriget.", "trump": "Folk, det här är vansinne från den gamle Tucker, en riktig loser nu för tiden. Han springer runt och skriker om kärnvapen som en hysterisk vänsterextremist. Under min ledning gör vi vad som krävs för att vinna, inte som den svaga Biden gjorde. Iran ska inte hota oss. Tucker borde hålla käften och sluta vara en sådan patetisk globalistmarionett.", "stalin": "Jag betraktar med avsky hur dessa dekadenta klassförrädare leker med mänsklighetens öde. En president som leker med kärnvapen är en farlig galning som måste likvideras omedelbart för folkets skull. Inga halvmesyrer! Vi ser återigen imperialismens hyenor visa sitt sanna ansikte. Den som vägrar rensa ut sådana element förtjänar samma öde som de själva planerar."}, "date": "31 augusti, 16:57", "url": "https://www.friatider.se/tucker-trump-planerar-atombomba-iran-maste-avsattas-omedelbart", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-785.jpg"}, {"type": "image-full", "heading": "Putin är fast i ett hörn – planerar att trappa upp kriget", "summaries": {"normal": "Vladimir Putin har enligt uppgifter beslutat att trappa upp kriget i Ukraina istället för att retirera. Trots stora ekonomiska kostnader och militära motgångar bedöms en fortsatt konflikt som nödvändig för att undvika att framstå som svag. Ryssland överväger nya truppförstärkningar och hotar med utökad sabotageverksamhet mot västliga intressen för att säkra framtida territoriella vinster.", "trump": "Putin är i en riktigt dålig sits, en total katastrof. Han vill inte backa, det är så svagt. Istället vill han trappa upp – det är en dålig strategi, tro mig. De har problem med ekonomin och drönarna, precis som när de inkompetenta politikerna i Washington kör landet i botten. Om jag hade varit involverad hade detta aldrig hänt, det skulle vara över på en dag!", "stalin": "Kamrat Putin visar rätt beslutsamhet. Att vika sig för den västliga dekadensen är en dödssynd. Om fienden inte förstår diplomati, måste de förstå järnnäven. Vi godkänner mobiliseringen av ytterligare hundratusentals män. De som tvekar inom eliten får påminnas om att en stat som inte kan rensa ut sina egna svagheter inte förtjänar att existera. Framåt, för moderlandet."}, "date": "31 augusti, 16:39", "url": "https://www.realtid.se/samhalle/putin-ar-fast-i-ett-horn-planerar-att-trappa-upp-kriget", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sdl10cmhvr2kda-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Det finns inget fredsparti i riksdagen", "summaries": {"normal": "Artikeln konstaterar att inget parti i Sveriges riksdag konsekvent driver en politik för fred, nedrustning och militär självständighet. Författaren kritiserar Natomedlemskapet, DCA-avtalet och västvärldens hantering av konflikter som Gaza, och efterlyser en stark fredsrörelse utanför riksdagen som kan utmana den rådande militaristiska riktningen.", "trump": "Folk, tro mig, Sverige har blivit en total katastrof. De slängde sin fina alliansfrihet i soporna för att springa in i min Nato – som jag förresten gjorde stark igen – och nu är de bara en bricka för de globalistiska krigshökarna. Inget fredsparti? Patetiskt. Era dekadenta Nato-lakejer är svaga och patetiska, de älskar krig mer än handel. Gör Sverige great again och kom ut därifrån!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i det svenska riksdagen har sålt ut sin så kallade neutralitet till de giriga hyenorna i Nato. Jag ler ironiskt från historien när de imperialistiska parasiterna byter självständighet mot baser och avtal som gör dem till måltavlor. Ingen äkta fredskraft finns. Det är upp till en sann folkrörelse att rensa ut dessa förrädare och återta kontrollen över statens intressen."}, "date": "28 augusti, 08:00", "url": "https://proletaren.se/artikel/50934", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/kamal-kronika-768x432.png"}, {"type": "image-right", "heading": "Bostadsbrist och skenande hyror", "summaries": {"normal": "Sverige har en allvarlig bostadsbrist som förvärras av att bostäder ses som handelsvaror istället för en mänsklig rättighet. Sedan 2011 ska kommunala bostadsbolag drivas affärsmässigt. Hyresgästföreningen beräknar ett underskott på 110 000 bostäder. Nybyggda lägenheter har höga hyror som många inte har råd med, vilket leder till tomma lägenheter trots köer till äldre bestånd med lägre hyror.", "trump": "Folk, ni skulle se det här svenska bostadskaoset – en total katastrof! De giriga socialistiska hyreshöjningsfanatikerna har förvandlat hem till Wall Street-spektakel. Hyrorna skenar som en galen elbil, 13 procent upp på ett år! De byggde fel, de styrde fel, och nu har de tomma lyxlägenheter medan folket lider. Patetiskt! Men jag fixar sånt här – vi gör Amerika (och kanske till och med Sverige) bostadsgreat igen.", "stalin": "Kamrater, se hur de profitthungriga hyenorna förvandlar bostäder till bytesvaror och driver ut arbetarklassen ur sina hem. Jag betraktar med avsky denna dekadenta marknadsteater som skapar 110 000 saknade boningar och skenande hyror. Det är klassfiendens logik. En sann folkstat skulle likvidera dessa parasiterande spekulanter och återställa bostaden som en rättighet för massorna. Fienden sover aldrig."}, "date": "28 augusti, 08:00", "url": "https://proletaren.se/artikel/bostadsbrist-och-skenande-hyror", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/03/DSC_0137-scaled-e1784716375357-768x433.jpg"}, {"type": "image-right", "heading": "Sparf: Gör Rinkeby till somalisk enklav", "summaries": {"normal": "Med anledning av regissören Michael Lindgrens filmteam som tvingats anpassa sig efter lokala krav i Rinkeby under inspelningen av satiren Flaggan, föreslår debattören Birgitta Sparf att området görs till en självständig somalisk enklav. På så sätt kan klanstyret sköta försörjning och lagar, och framtida besökare kan ansöka om visum på ambassaden.", "trump": "De säger att filmteam i Rinkeby måste följa en massa galna krav och betala beskyddare, och vet ni vad? Helt otroligt! Totalt slöseri med skattebetalarnas pengar i åratal. De borde bara bygga en stor mur runt stället, eller varför inte göra det till en egen självständig stat? Så kan de sköta sin egen byråkrati och utfärda visum. Snyggt jobbat, Sverige!", "stalin": "Kamrater, det borgerliga dekadenta kultursverige kryper nu på knä för lokala klaner i förorten och kallar det för konstnärlig dialog! Om staten har försörjt dessa områden i tre decennier utan tacksamhet, bör vi omedelbart införa järnhård centralstyrning, kollektivt ansvar och obligatoriskt visumtvång för alla regissörer. Avvikelser från den revolutionära ordningen kommer att beivras omedelbart!"}, "date": "1 september, 06:50", "url": "https://bulletin.nu/sparf-gor-rinkeby-till-somalisk-enklav", "imageUrl": "https://cdn.bulletin.nu/articles/5022cfde-09b6-4d42-b3de-aa8085408c08/preview.jpg?t=1788237924000"}, {"type": "text", "heading": "OncoZenge: Stoppad betalning efter emissionsbesked – bevakning inleds", "summaries": {"normal": "Bioteknikbolaget OncoZenge genomför en företrädesemission på 33,3 miljoner kronor för att finansiera sin fas 3-studie av läkemedelskandidaten BupiZenge. Den kinesiska storägaren Sichuan håller inne en betalning på 10 miljoner kronor och anser att emissionen bryter mot investeringsavtalet. Bolaget har även säkrat ett brygglån samt tecknings- och garantiåtaganden för att rädda upp likviditeten.", "trump": "Kineserna försöker blåsa OncoZenge på tio miljoner! Väldigt smart av dem, men inte lika smart som min tullpolitik, tro mig. Nu dumpar de sina certifikat och gnäller på en helt fantastisk emission. Jag känner styrelsen, bra människor, men de behöver en vinnare. Fas 3-studier, brygglån, miljardärer som Erik Selin – det är storslaget! Men betala pengarna, Kina!", "stalin": "Den kinesiska investeraren Sichuan visar kriminell brist på disciplin genom att undanhålla de utlovade 10 miljonerna till OncoZenges ädla kamp mot oral mukosit. Sådant sabotage tolereras icke i en sund stat! Vi beordrar omedelbar mobilisering av kapital och insatser från kamrat Erik Selin. Den byråkratiska maskinen för fas 3-studien kommer att rulla över alla kontrarevolutionära betalningsvägrare."}, "date": "31 augusti, 12:13", "url": "https://www.affarsvarlden.se/artikel/oncozenge-stoppad-betalning-efter-emissionsbesked-bevakning-inleds"}, {"type": "image-right", "heading": "S-löftet: Ingen med ”normal inkomst” får höjd skatt", "summaries": {"normal": "Socialdemokraterna lovar att ingen med normal inkomst, det vill säga under 70 000 kronor i månaden, ska få höjd skatt nästa mandatperiod. Partiet vill satsa på kortare vårdköer, högre barnbidrag och mindre skolklasser utan att höja skatten för vanliga inkomsttagare. Högre inkomster kan däremot beskattas mer.", "trump": "Titta på de här svenska socialisterna som lovar att inte plåna vanliga arbetare på mer skatt. Patetiskt! Under min första period skapade vi jobb och tillväxt utan att straffbeskatta folk. Nu kommer Magdalena och hennes misslyckade vänsterextremister krypande efter att Biden förstörde ekonomin. Sad! De borde lära sig av mig istället för att leka med identitetspolitik och kvoteringar.", "stalin": "Jag betraktar med avsky hur dessa dekadenta folkförtryckare lovar att skydda de så kallade normala inkomsterna från beskattning. Vilken lömsk kapitulation inför de profitthungriga parasiterna! I ett sant kollektiv skulle vi rensa ut alla som tjänar över en viss nivå och fördela rikedomarna rättvist. Deras halvhjärtade löften väcker bara misstro och förakt hos arbetarklassen."}, "date": "1 september, 06:17", "url": "https://www.svt.se/nyheter/inrikes/s-loftet-ingen-med-normal-inkomst-far-hojd-skatt", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.73/0.44/204cf35713ef4dbcce1f63d3cb8830b3e047403969c7938e925106867b66764b"}, {"type": "image-full", "heading": "Stopp i tågtrafiken mellan Stockholm och Göteborg", "summaries": {"normal": "Under måndagskvällen drabbades tågtrafiken mellan Stockholm och Göteborg av stora förseningar på grund av ett elfel vid Årstaberg. Ett stillastående tåg drabbades extra hårt av bristfällig information, vilket ledde till ilska och upprörda passagerare. Trafiken började gradvis rulla på ett av spåren under kvällen efter säkerhetskontroller.", "trump": "Sveriges tågtrafik är en total katastrof, helt inkompetent! Ett enkelt litet elfel vid Årstaberg stoppade hela linjen mellan Stockholm och Göteborg, och resenärerna skriker av ilska på grund av noll information. Sånt händer aldrig i mitt Amerika, vi bygger bäst, snabbast och starkast. Det här är fake news-nivå av kaos!", "stalin": "Ett förrädiskt elfel i Årstaberg har förlamat järnvägslinjen mellan Stockholm och Göteborg. Dessa upprörda, skrikande passagerare som saknar information visar ett farligt borgerligt förfall. Statens transportkommission kräver omedelbara förhör med lokförare och ansvariga. Sådana sabotage mot kollektivtrafiken tolereras inte; de skyldiga kommer att finna sig omplacerade långt mot norr."}, "date": "31 augusti, 21:58", "url": "https://www.gp.se/nyheter/sverige/stopp-i-tagtrafiken-mellan-stockholm-och-goteborg-.02dacc2c-0839-43dd-8e51-383acab70551", "imageUrl": "https://www.gp.se/images/article/02dacc2c-0839-43dd-8e51-383acab70551/images/1d6Kw4HKtfaw70VU3NFdYsOWT6KA-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Vice riksbankschef ser ökad inflationsrisk", "summaries": {"normal": "Vice riksbankschef Per Jansson bedömer att inflationsriskerna har ökat något, men att Riksbanken kan avvakta med att ändra penningpolitiken. Läget präglas av en svag arbetsmarknad och stabila inflationsförväntningar. Jansson understryker dock en beredskap att snabbt agera om inflationsbilden försämras.", "trump": "Svenskarna har problem med inflationen, totalt katastrofalt! Men den här centralbankschefen, Per, säger att de bara kan vänta och titta på. Vänta på vad? Att ekonomin kollapsar helt? De borde lyssna på mig, sänka skatterna och sätta borren i backen! Om inte USA fixar det åt dem kommer det sluta i total ruin, believe me!", "stalin": "Kamrat Per Jansson rapporterar om svängningar i den svenska inflationen. En svag arbetsmarknad och borgerliga priser skapar oro. Vi noterar att Riksbanken avvaktar. Men låt dem veta: den som misslyckas med att hålla penningvärdet i schack kommer omedelbart att omplaceras till mer lämpliga arbetsuppgifter i Sibirien. Inga ursäkter accepteras!"}, "date": "31 augusti, 11:47", "url": "https://www.affarsvarlden.se/artikel/vice-riksbankschef-ser-okad-inflationsrisk", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/11/sdlVIGRvGrU9m4-nh-e1732696701837-400x267.jpg"}, {"type": "image-right", "heading": "Konkreta planer på skoldåd: Hade valt ut sina offer", "summaries": {"normal": "En 16-åring från Stockholm har häktats, misstänkt för medhjälp till mord och mordförsök efter svärdattacken på Brinellskolan i Fagersta där en kvinna dog och tre personer skadades. Polisen har funnit chattar och anteckningar med tilltänkta offer i 16-åringens telefon. 16-åringen misstänks även för förberedelse till mord men avfärdar planerna som ”fantasitankar på skoj” som han delat med gärningsmannen Liam Nebel.", "trump": "De talar om fantasitankar, men det här är absolut katastrofalt! En radikal 16-åring satt i chattar och hejade på Fagersta-attacken samtidigt som han själv planerade blodbad med offerlistor i luren. Fake news kallar det oskyldiga skämt, men vi måste vara stenhårda mot den här sjuka kriminaliteten. Total katastrof, jag säger det bara!", "stalin": "Dessa ynkliga sabotörer försöker undkomma arbetarklassens vrede genom att kalla mordplaner för ”fantasitankar på skoj”. Säkerhetstjänsten har granskat telefonernas förrädiska korrespondens. Den skyldige i Stockholm ska nu lära sig skillnaden mellan löjliga ursäkter och det sovjetiska proletariatets skoningslösa rättvisa. Staten glömmer aldrig och förlåter aldrig fiender till ordningen."}, "date": "1 september, 06:00", "url": "https://www.aftonbladet.se/nyheter/a/gkBV0q/16-aringen-i-stockholm-hade-valt-ut-offer-for-dad-enligt-uppgifter", "imageUrl": "https://akamai.vgc.no/v2/images/8231bba4-c2e5-3e36-885a-1ec684a6fbb0?fit=crop&format=auto&w=1080&s=7c7bd76890389a711ee111f54f754ff3ed51429d"}, {"type": "image-right", "heading": "Liberaler – stödrösta på M, KD eller SD", "summaries": {"normal": "Artikeln argumenterar för att väljare som vill behålla Tidöregeringen bör överge Liberalerna i nästa val, eftersom partiet riskerar att åka ur riksdagen. En röst på L anses bortkastad och kan gynna vänstersidan. Istället uppmanas borgerliga väljare att taktiskt lägga sin röst på M, KD eller SD för att säkra regeringsmakten.", "trump": "Liberalerna är ett totalt fiasko, ett riktigt förlorarparti som ligger på ynka två procent! Deras ledare? En absolut katastrof i mätningarna, helt svag. Om du vill ha låga skatter och starka bilar, lägg inte en enda röst på dem – det är fake news att de klarar spärren. Rösta på M, KD eller SD istället, riktiga vinnare!", "stalin": "Dessa så kallade liberaler svävar på målsnöret kring två procent, ett ynkligt sabotage mot ordningen. Deras ledare visar bottennoteringar i disciplin och förtroende. Partiet är dött. Kamrater som önskar bevara stabiliteten måste omdirigera sina röster till Moderaterna, Kristdemokraterna eller Sverigedemokraterna, annars väntar avvikelser som gynnar vänsterfaktionen. Effektivitet kräver eliminering av spillröster!"}, "date": "1 september, 06:00", "url": "https://samnytt.se/liberaler-stodrosta-pa-m-kd-eller-sd", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/31125728/artikelhuvudbild-1-400.jpg"}, {"type": "image-right", "heading": "”Ni kräver kompetens av oss – men vilken kompetens har ni som bestämmer?”", "summaries": {"normal": "Undersköterskan Fredrika Andersson kritiserar politikerna för att de ignorerar personalens varningar om tidsbrist och utmattning inom äldreomsorgen. Scheman håller inte i verkligheten, kompetent personal lämnar och de äldre får otillräcklig omsorg. Hon uppmanar beslutsfattarna att följa med i vardagen och lyssna på dem som arbetar på golvet innan fler slutar.", "trump": "De inkompetenta politikerna i det här socialistiska helvetet kräver att undersköterskorna ska vara superhjältar medan de själva sitter i sina lyxiga kontor och effektiverar ihjäl systemet. Det är en total katastrof! Personalen springer som galningar och de stackars gamlingarna får tio sekunder per dag. Vakna upp, era värdelösa byråkratblodiglar, innan hela skiten kollapsar!", "stalin": "Kamrater, dessa dekadenta klassförrädare i politiken blundar medvetet medan arbetarna inom äldreomsorgen utmattas under tidspressens järnhand. Jag ser hur de profitthungriga beslutsfattarna offrar folkets välfärd på effektiviseringens altare. Gå ut bland folket, lyssna eller förbered er på utrensning av de som sviker de arbetande massorna. Detta är ett sabotage mot kollektivet."}, "date": "1 september, 06:00", "url": "https://arbetet.se/2026/09/01/ni-kraver-kompetens-av-oss-men-vilken-kompetens-har-ni-som-bestammer-over-aldreomsorgen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/31144036/ka-debatt-kompetens.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Tobias får inget jobb: ”Mår dåligt av regeringens hatiska attityd”", "summaries": {"normal": "Tobias är fortfarande arbetslös och känner sig utsatt av både hat på internet och regeringens attityd. Han söker jobb inom trädgård och lager, planerar att ta körkort och går kurser. Han kritiserar Arbetsförmedlingen för meningslösa möten, bristande stöd och gammaldags system. Han önskar bättre trygghet och en ny regering som höjer bidragen.", "trump": "Den här stackars killen Tobias sitter fast i Bidens soppa och nu den här svenska vänsterregeringens hat mot vanliga arbetare. De kallar det stöd men det är bara fikamöten med Rusta och matcha. Totalt misslyckande! Vi behöver inte mer byråkrati, vi behöver jobb, inte dessa deklasserade socialisthjärnor som hatar folk som faktiskt vill arbeta. Patetiskt!", "stalin": "Denna arbetslöse kamrat avslöjar de parasiterande klassförrädarnas förtryckande system. Deras meningslösa fikamöten och föråldrade maskineri visar imperialismens svaga underliv. Jag ser hatet från penninggalna hyenor som vill likvidera arbetarklassens värdighet. Vi måste rensa ut dessa dekadenta element och bygga ett äkta trygghetssystem för folket. Fienden sover aldrig."}, "date": "1 september, 06:00", "url": "https://arbetet.se/2026/09/01/tobias-far-inget-jobb-mar-daligt-av-regeringens-nastan-hatiska-attityd", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/31125859/tobias-portratt.avif?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Missnöjet minskar inte av Tidöstyre", "summaries": {"normal": "En ny rapport visar att SD-väljarna behållit extrema ståndpunkter om invandring trots kraftigt minskade nivåer. De har radikaliserats ytterligare kring medborgarskap och uppvisar fortsatt hög misstro mot medier och domstolar. Samtidigt har Moderaternas väljare närmat sig SD:s värderingar, medan SD-väljarna blivit mer högerinriktade i ekonomiska frågor.", "trump": "Folk, ni måste se det här! De där galna SD-väljarna röstar fortfarande för att stänga gränserna trots att Sverige knappt släpper in någon längre. Och nu har de dragit med sig de patetiska moderaterna in i samma virvel. De kallar det radikalisering, jag kallar det sunt förnuft. Fake news-medierna och de riggade domstolarna hatar det förstås. Amerika först, Sverige vaknar äntligen!", "stalin": "Kamrater, se hur de profitthungriga klassförrädarna desperat försöker förklara varför arbetarnas missnöje består trots alla deras lögner. SD-väljarna har genomskådat den dekadenta borgerlighetens spel och kräver nu utrensning av främmande element. Deras misstro mot de lögnaktiga medierna och domstolarna är en sund reaktion. Revolutionen fortsätter, fienderna skälver."}, "date": "31 augusti, 16:10", "url": "https://www.dagensarena.se/opinion/missnojet-minskar-inte-av-tidostyre", "imageUrl": "https://www.dagensarena.se/files/2026/08/sd-valjare.jpeg"}, {"type": "image-right", "heading": "Ceuta-invandrare gillrade dödsfälla åt soldater: \"Vår militär är hjälplös\"", "summaries": {"normal": "Fyra spanska soldater skadades i ett planerat bakhåll i Ceuta när 30–40 illegala invandrare attackerade deras obepansrade fordon med stora stenar. Soldaterna tvingades fly till fots och ådrog sig skador. Polisen hittade stenar som förberedets och grep tolv misstänkta. Militärorganisationer kritiserar regelverk som gör soldaterna försvarslösa.", "trump": "Titta på det här! Våra spanska vänner blir stenade av illegala invandrare i Ceuta som en riktig dödsfälla. De stackars soldaterna springer som harar utan vapen. Biden-era svaghet har spridit sig till Europa. Vakna upp! Vi behöver starka gränser, inte dessa galna öppna-dörr-politiker som älskar att importera kaos.", "stalin": "Kamrater, se hur de giriga gränshyarorna låter sina egna soldater springa som råttor undan stenregn från de exploaterade massorna. Detta är imperialismens logiska följd när man binder militären med byråkratiska bojor. Jag skulle ha genomfört en grundlig utrensning av sådana svaga befäl och deras dekadenta regelverk redan i gryningen."}, "date": "31 augusti, 15:16", "url": "https://www.friatider.se/ceuta-invandrare-gillrade-dodsfalla-soldater-var-militar-ar-hjalplos", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-793.jpg?itok=ZSESG6HE"}, {"type": "image-right", "heading": "Trump utlovar nya attacker mot Iran", "summaries": {"normal": "Striderna i Mellanöstern har blossat upp igen. USA genomförde precisionsattacker mot iranska mål vid Hormuzsundet, vilket Iran besvarade med robot- och drönarattacker mot baser i Jordanien och Förenade arabemiraten. President Trump hotar med hårdare slag medan Irans president Pezeshkian uppmanar till dialog och samarbete.", "trump": "Iranerna, de totalt misslyckade mullorna, skjuter robotar åt alla håll som galna. Vi slog till mot deras ramper vid Hormuzsundet – begränsat, precist och vackert. De skriker nu om dialog medan jag lovar: vi ska slå till hårt. Inga fler svaga Biden-tider, nu är det Amerika först igen. Fantastiskt!", "stalin": "Dessa dekadenta klassförrädare i Teheran och Washington leker farlig imperialism med robotar och drönare över Hormuzsundet. Jag betraktar deras hysteriska dans med mörk förtjusning. Dialog? Endast svaghet. En sann ledare rensar ut hoten utan pardon. Regionens folk ser era lögner och darrar inför konsekvenserna."}, "date": "31 augusti, 22:34", "url": "https://www.di.se/nyheter/trump-utlovar-nya-attacker-mot-iran", "imageUrl": "https://static.bonniernews.se/ba/01128e2d-655e-4144-be32-2a194d0b97ca.jpeg?crop=8640%2C4320%2Cx0%2Cy720&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Elias Norgren: Nog kan det vara folkmord", "summaries": {"normal": "Debattören Jens Ganman liknar den svenska situationen med organiserad svenskfientlighet, våld och politisk marginalisering vid folkmord. Elias Norgren utvecklar resonemanget och lyfter både fysiskt våld, demografiska förändringar och politisk mörkläggning som delar av ett systematiskt hot mot svenskarnas nationella existens. Han refererar till folkmordsbegreppets ursprung och pekar på låga födelsetal samt massinvandring som bidragande faktorer.", "trump": "De här svenska globalisterna och vänstervridna mediemyggorna håller på att folkmörda sitt eget folk med öppna gränser, galna imamer och bostadspriser som kväver unga svenskar. Det är en total katastrof, tro mig. De hatar sitt eget land mer än någon fiende någonsin gjort. Rena kulturmordet pågår medan de dekadenta eliterna applåderar. Patetiskt!", "stalin": "Jag betraktar med avsmak hur dessa dekadenta klassförrädare med sin mångkulturella utopi systematiskt undergräver den svenska nationens grundvalar. Deras folkföraktande projekt, gömt bakom lögner och tystnad, förtjänar benämningen kulturell utrensning. Kamrater, se hur de giriga hyenorna offrar sitt eget folk på imperialismens altare. Historien dömer dem."}, "date": "31 augusti, 16:09", "url": "https://riks.se/ledare/elias-norgren-nog-kan-det-vara-folkmord", "imageUrl": "https://admin.riks.se/uploads/medium_bild_d3e93904d5.jpg"}, {"type": "image-full", "heading": "Återupprepade SD-krav i dödläge med KD", "summaries": {"normal": "Ett politiskt dödläge har uppstått mellan SD och KD efter att Ebba Busch öppnat för en S-ledd regering i ett ”exceptionellt läge”. Jimmie Åkesson kräver ett offentligt klarläggande, vilket KD vägrar. Ulf Kristersson tonar ner konflikten och menar att Tidöpartierna är en enig enhet, medan Åkesson anser att Buschs uttalanden skadat regeringssamarbetet.", "trump": "Fikan mellan Jimmie och Ebba i Sverige löste ingenting, totalt misslyckande! Jimmie kräver svar om ett så kallat exceptionellt läge, men Ebba vägrar. Smart av henne? Kanske det, men det är falska nyheter att tro att vänstern inte lurar i vassen. Tidö-laget måste skärpa sig, det här är svag ledarskapskultur. Jag hade fixat det på fem minuter.", "stalin": "Dessa så kallade bundsförvanter ägnar sig åt kafébesök och borgerligt käbbel medan revolutionen står på spel. Jimmie Åkesson kräver offentliga eden av den vacklande Ebba Busch. Om de inte kan upprätthålla ideologisk disciplin inom blocket, vet vi exakt hur avvikelser brukar hanteras. Partiet kräver absolut lojalitet, annars väntar det inre exilets tysta kyla."}, "date": "31 augusti, 20:37", "url": "https://www.gp.se/nyheter/sverige/aterupprepade-sd-krav-i-dodlage-med-kd.053992fa-4c9b-541c-8663-e1528f8d273e", "imageUrl": "https://www.gp.se/images/article/053992fa-4c9b-541c-8663-e1528f8d273e/images/1kAEkkUly9X320j86rQiIJ2MR1r4-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Så röstar du i Kristallen 2026 - nummer till telefon och sms", "summaries": {"normal": "Under måndagen avgörs TV-priset Kristallen 2026 på Cirkus i Stockholm. Messiah Hallberg leder galan som sänds live i TV4 och TV4 Play mellan 20 och 22. Tittarna väljer tre pristagare genom telefon, SMS eller TV4 Play. Röster kan lämnas från klockan 20:00 den 31 augusti.", "trump": "De har en liten gala i Sverige där de ger varandra priser, patetiskt. Messiah Hallberg leder showen – bra jobb, men det är ju bara kändisar som röstar på varandra. Mina galor är mycket större, tro mig. Ring era nummer om ni vill, men det blir ändå samma etablissemangsvinnare som alltid. Sad!", "stalin": "Ännu en borgerlig dekadent teater där folkets fiender hyllar varandra med tomma utmärkelser. Dessa självutnämnda underhållare tror sig stå över kollektivet. Jag ser deras futtiga röstnummer och ler i skuggan. Inga priser räddar dem när partiet en dag åter kräva fullständig lojalitet. Skrattet skall bli kort."}, "date": "31 augusti, 13:39", "url": "https://www.tv4.se/artikel/1IPVE78vBM8DhoTNxVEULz/sa-roestar-du-i-kristallen-2026-nummer-till-telefon-och-sms", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlAA4fhNgpnaU%2F6c26b2f2232502e20b22393bc38f8857%2FMessiah_Hallberg_ledde_Kristallengalan_aven_i_fjol._Arkivbild._&width=120"}, {"type": "image-right", "heading": "Varnar för \"svenskt folkmord\" – väcker raseri bland medietopparna", "summaries": {"normal": "Opinionsbildaren Jens Ganman har väckt starka reaktioner med sin text om ett pågående \"svenskt folkmord\". Han beskriver våldsdåd mot svenskar och politiska uttalanden som nedvärderar svensk kultur. Texten får kritik från bland annat Expressens Karin Olsson och Payam Moula som kallar den motbjudande och utdaterad. Andra försvarar den som modig och viktig för debatten om brottsoffer och migration.", "trump": "De här galna svenska medietopparna flippar ur totalt bara någon nämner det uppenbara folkmordet på det svenska folket. En eritreansk knivmördare jagar svenskar och imamer skriker att landet är deras. Reinfeldt och Sahlin hatade sin egen kultur. Patetiska liberala snobbar och woke-kulturmarxister blir vansinniga när man pekar på sanningen. Fantastiskt modigt av Ganman, de borde skämmas!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna vrider sig i raseri när en sann röst blottar det kulturella folkmordet på det svenska folket. Mördare släpps lösa medan borgarhyenor och mediahyenor attackerar den som vågar kalla det vid dess rätta namn. Deras paranoia avslöjar allt. Vi ler mörkt från historien åt deras febrila försök att skydda sina offer från sanningens utrensning."}, "date": "31 augusti, 15:50", "url": "https://riks.se/nyheter/varnar-for-svenskt-folkmord-vacker-raseri-bland-medietopparna", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Copy_of_Soerman_Ledare_4_a5d498d548.jpg"}, {"type": "image-right", "heading": "Forskare: ”Segregationen drivs inte främst av hur vi bygger”", "summaries": {"normal": "En ny studie från Malmö universitet visar att segregation inte motverkas enbart genom blandade bostadsområden. Den drivs främst av växande inkomstklyftor och brist på gemensamma mötesplatser. Nyproduktion med varierade upplåtelseformer kan minska segregationen lokalt, men skillnaderna mellan stadsdelar ökar ändå. Föreningsliv och mötesplatser för barn och unga lyfts som viktiga komplement.", "trump": "Lyssnar ni på de där galna vänsterextremisterna som tror att man kan bygga bort segregation med tvångsblandning? Patetiskt! Det är de supergentrifierade elitområdena som suger musten ur folket medan de vanliga områdena lämnas åt sitt öde. Vi behöver inga fler misslyckade socialistexperiment, vi behöver vinna stort och stoppa den här galenskapen en gång för alla. Fantastiskt!", "stalin": "Kamrater, se hur de giriga hyenorna i de rika enklaverna drar ifrån och fördjupar klyftorna medan de låtsas bekämpa segregation med ynkliga byggprojekt. Detta är klassfiendens eviga trick. Vi måste rensa ut dessa dekadenta parasiter och skapa äkta kollektiva mötesplatser där arbetarna enas. Annars kommer segregationen att likvidera själva folkets enhet. Inga kompromisser!"}, "date": "31 augusti, 15:04", "url": "https://www.dagensarena.se/innehall/forskare-segregationen-drivs-inte-framst-av-hur-vi-bygger", "imageUrl": "https://www.dagensarena.se/files/2022/03/fotojet-23-300x157.jpg"}, {"type": "image-right", "heading": "400.000 såg Allards debatt – på ett dygn", "summaries": {"normal": "Örebropartiets partiledare Markus Allard deltog i en debatt i Studio 3 mot åtta vänsteraktivister. Programmet har fått stor spridning och nådde 400 000 visningar på Youtube under det första dygnet. Allard ångrar att han inte svarade hårdare på vissa personangrepp, bland annat om hans väljare. Debatten har gett honom ökad uppmärksamhet efter intervjuer i SVT och DN.", "trump": "Titta på den här killen Allard, han krossade åtta galna vänsterextremister i debatten och fick 400 000 tittare på ett dygn. Fantastiskt! De kallade hans väljare fö
