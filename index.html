arna Mbappé och Messi. Norge mot England klockan 23 på lördag blir en historisk utrensning av fiendens fotbollsborgarbrackor. Vi ska likvidera deras falska glädje och tvinga fram en socialistisk semifinal. Varje skratt döljer en trotskist."}, "date": "10 juli, 11:21", "url": "https://www.svt.se/sport/fotboll/hysteriska-traningsbilderna-pa-erling-haaland-jag-gillar-att-skoja", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.29/0.36/f2b259acfb68241d8373e7fec096ca37f081c164867e5e07b2f63a7d065cd473"}, {"type": "image-full", "heading": "Spanien–Belgien i VM-kvartsfinal: obesegrade La Roja mot Belgiens måltunga anfall", "summaries": {"normal": "Spanien möter Belgien i VM-kvartsfinal i Los Angeles. Spanien har inte släppt in mål på fem matcher och spelar kontrollerat, medan Belgien har en stökigare väg med målfester men också defensiva brister. Nyckelspelare som Lamine Yamal, Pedri och Rodri ställs mot Charles De Ketelaere, Kevin De Bruyne och Thibaut Courtois. Spanien är klar favorit enligt modeller och marknaden. Matchen spelas på SoFi Stadium fredag 10 juli klockan 22.00 svensk tid. Speltips pekar mot spansk seger med under 2,5 mål.", "trump": "Folket, vi har en fantastisk kvartsfinal i Los Angeles. Spanien är otroligt, de släpper inte in mål, de vinner med kontroll och tålamod precis som jag gör med Amerika. Belgien är kaos, de släpper in mål överallt och deras försvar är gammalt och trött. Lamine Yamal är en vinnare, han kommer att krossa dem. Jag älskar Spanien här, de kommer att vinna stort i en tät match. Belgien har ingen chans, tro mig.", "stalin": "Kamrater, jag betraktar denna så kallade kvartsfinal som en ideologisk prövning där det spanska kollektivets järndisciplin möter belgiska dekadenta omställningar. Vårt obrytbara försvar har likviderat alla hot utan att släppa fram en enda kontrarevolutionär boll. De Ketelaere och hans borgarbrackor med sina sena löpningar är fiender till folket som måste rensas ut. Yamal är en glimmande arbetare i vår sak. Första målet blir avgörande, annars följer utrensning av de svaga. Spanien segrar, som historien alltid gör mot opportunisterna."}, "date": "10 juli, 10:40", "url": "https://bulletin.nu/spanien-belgien-i-vm-kvartsfinal-obesegrade-la-roja-mot-belgiens-maltunga-anfall", "imageUrl": "https://cdn.bulletin.nu/articles/98d0a44b-6d03-4755-aa3a-6fd32aa43076/preview.jpg?t=1783503326000"}, {"type": "image-right", "heading": "Vi har inte råd med en rödgrön regering", "summaries": {"normal": "I en debattartikel argumenterar Moderaternas ledning, med Ulf Kristersson i spetsen, för att Sverige inte har råd med en rödgrön regering. De lyfter fram hur regeringen har hanterat inflation, gängvåld, energikris och säkerhetspolitik. Resultaten ses som positiva med halverat skjutvåld, lägre inflation och mer pengar till familjer. De varnar för att en vänsterregering skulle innebära högre skatter, avveckling av kärnkraft och svagare tillväxt samt säkerhet.", "trump": "Folk, ni skulle se det här! De gör ett fantastiskt jobb i Sverige, verkligen det bästa. Inflationen är borta, skjutningarna har halverats och hårt arbetande svenskar får fem tusen kronor extra varje månad. Det är otroligt. Men de rödgröna förlorarna vill höja skatterna, stänga ner kärnkraften och förstöra allt. De är en katastrof, totalt inkompetenta. Sverige behöver fortsätta vinna, inte låta vänsterradikalerna förstöra det fantastiska som byggts upp. Make Sweden Great Again!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur dessa borgerliga element försöker maskera sin parasitiska agenda som räddning. Deras så kallade städning är blott en ursäkt för att skydda kapitalisternas profit mot folkets vilja. Den rödgröna faran de fruktar är i själva verket arbetarklassens historiska nödvändighet. Vi ska rensa ut dessa gängsympatisörer och kärnkraftsvänner som en infekterad böld. Inom kort skall vi likvidera alla som drömmer om att Sverige blir EU:s rikaste land på bekostnad av kollektivets seger. Paranoian är deras svaghet, och den skall bli deras grav."}, "date": "10 juli, 08:00", "url": "https://www.di.se/debatt/replik-vi-har-inte-rad-med-en-rodgron-regering/", "imageUrl": "https://static.bonniernews.se/ba/49756645-2fe2-4f43-aba0-490bc151df32.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Expo: Våldssekternas dåd eskalerar", "summaries": {"normal": "Enligt Expo eskalerar våldsdåden från nätverken 764 och No lives matter. Från digitala brott som utpressning har de gått över till fysiska attacker, knivdåd och nu terrorplaner mot samhället. En 15-åring dömdes nyligen till ungdomsvård för mordbrand i Ängelholm där han brände garagelängor och fordon. Han livesände en brand och uppmuntrades av följare. Expo ser ett mönster av ökad samhällshotande våld och ömsesidig inspiration mellan grupperna.", "trump": "Folk, ni ser inte det här? Dessa sjuka 764-killar och deras No lives matter-gäng är totala losers som börjar med nätutpressning och slutar med att bränna bilar och planera terror. Biden lät det här växa under hans svaga år, men nu fixar jag det. De hejar på varandra som riktiga misslyckade idioter. Vi behöver lag och ordning, inte den här galna vänsterkaoset som göder sådana galningar. Det är en skam för Sverige!", "stalin": "Kamrater, dessa degenererade element inom de våldssekter som kallar sig 764 och No lives matter utgör ett hot mot folkets enhet. Från fega nätbrott har de avancerat till öppen sabotageverksamhet mot egendom och samhällsordning. Den 15-årige pojken som brände garage och livesände sin destruktiva handling medan klassfiendens sympatisörer hejade på är ett symptom på borgarbrackornas moraliska förfall. Vi måste rensa ut dessa folkfiender innan deras paranoia sprider sig som en pest bland ungdomen."}, "date": "2 juli, 12:20", "url": "https://www.etc.se/inrikes/expo-vaaldssekternas-daad-eskalerar", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260702090744_4436d06416faf4ec7519f6734b09f5a7dff54bf5415105a8eacc068e0f2cd6b9.jpg"}, {"type": "image-right", "heading": "Sverige gör rätt i migrationspolitiken", "summaries": {"normal": "Sverige har en integrationskris med utsatta områden, trångboddhet, hög arbetslöshet bland utrikes födda och parallella samhällsstrukturer. Artikeln argumenterar för att M, SD, S, KD och L gör rätt som stramar åt migrationspolitiken till EU:s miniminivå. Detta har lett till lägst asylinvandring sedan 1985 genom minskade kvoter, hårdare utvisningsregler och krav på försörjning. Färre invandrare ger bättre chans att lösa integrationsproblemen, trots svåra humanitära dilemman.", "trump": "Folk, tro mig, Sverige gör det fantastiskt rätt nu med migrationspolitiken. De har haft en total katastrof med alla dessa människor som kom 2015, 163000 bara ett år, det var en katastrof, en riktig katastrof. Nu har vi äntligen smarta ledare som stramar åt allt till EU:s miniminivå och asylinvandringen är den lägsta sedan 1985. Kvotflyktingarna ner från 5000 till 900, utvisningarna på riktigt, ingen mer lekstuga. De andra partierna vill ha mer av det gamla vansinnet, men det funkar inte, det funkar verkligen inte. Sverige behöver fixa sina områden, sina jobb och sina barn först. Make Sweden Great Again.", "stalin": "Kamrater, vi har identifierat den farliga kontrarevolutionära inflödesfaran som hotar folkets enhetliga framsteg. Jag har personligen sett hur den borgerliga och socialdemokratiska kapitulationen inför främmande element skapade dessa parasitiska utsatta zoner fyllda med arbetslösa, analfabeter och hedersvåldets reaktionära lakejer. Nu genomför vi den nödvändiga utrensningen av oönskade element genom att sänka kvoter, verkställa alla utvisningar och likvidera permanenta uppehållstillstånd. De som ropar efter mer humanitet är naturligtvis fiendens femtekolonnister, opportunistiska revisionister och hemliga gängsympatisörer som längtar efter kaos. Vi ska skydda arbetarklassens barn från dessa faror, med järnhand och leende."}, "date": "10 juli, 07:56", "url": "https://www.di.se/ledare/sverige-gor-ratt-i-migrationspolitiken/", "imageUrl": "https://static.bonniernews.se/ba/7db03145-b287-436d-b4d6-e97b3e62212d.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Hemtjänstman misstänks för våldtäkt och fick sparken - men polisutredningen läggs ned", "summaries": {"normal": "En hemtjänstman i Enköpings kommun misstänktes för våldtäkt mot en brukare i hennes hem i december förra året. Han fick sparken omedelbart efter anmälan. Polisen hade inledningsvis svårt att hitta honom för förhör, men vid förhöret erkände han sex men nekade till brott. Förundersökningen har nu lagts ned då brott inte kunnat bevisas. Mannen ska även ha erbjudit kvinnan pengar för tystnad. Händelsen har orsakat stort trauma inom arbetsgruppen.", "trump": "Folk, det här är en total skandal i den svenska hemtjänsten. En kille anklagas för våldtäkt mot en stackars kvinna som är beroende av hjälp, får sparken direkt, och sen försvinner han bara? Polisen letar efter honom som om det vore en dålig deckare. Till slut erkänner han sex men säger att det inte var brott. Nu lägger de ner utredningen. Patetiskt! Systemet är så svagt att de inte ens kan ställa någon till svars. En mycket märklig historia, tro mig.", "stalin": "Kamrater, denna degenererade händelse i Enköping visar hur borgarbrackornas så kallade vårdapparat ruttnar inifrån. En parasit i hemtjänsten utnyttjar en utsatt arbetande kvinna, erbjuder henne mutor för tystnad och tror sig kunna undkomma folkets rättvisa. Vi inleder utredning, rensar ut den kapitalistiska avskrapet från tjänsten, men polisens fumliga jakt på den försvunne fienden avslöjar systemets svaghet. Till sist läggs utredningen ned. Inget brott bevisat, säger de. Vilken mörk humor från klassfienderna som skyddar sina lakejer. Vi måste likvidera sådana element permanent för att skydda kollektivet."}, "date": "10 juli, 10:00", "url": "https://samnytt.se/hemtjanstman-misstanktes-for-valdtakt-fick-sparken-nu-laggs-forundersokningen-ner", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/09150552/hemtjanst.png"}, {"type": "image-right", "heading": "Så här stor bostad har en 25-åring råd med i Stockholm", "summaries": {"normal": "En genomsnittlig 25-åring har idag råd med endast 1,9 kvadratmeter bostadsrätt i Stockholm enligt Riksbyggens kvadratmeterindex. I Filipstad når samma ekonomi däremot upp till 83,4 kvadratmeter. Undersökningar visar att var tredje ung vuxen i åldern 18–24 fortfarande bor hemma, ofta på grund av ekonomi. Riksbyggens vd Johanna Frelin och jagvillhabostad.nu varnar för att bostadsmarknaden blivit en klassfråga som kräver politiska lösningar.", "trump": "Folk, det är en katastrof. En 25-åring i Stockholm har råd med ynka 1,9 kvadratmeter? Det är löjligt. I mina dagar byggde vi stort och billigt, men nu har de korkade politikerna förstört allt. I Filipstad får man 83 kvadrat – bra jobb! Men i Stockholm? Ett skämt. Unga bor hemma hos mamma och pappa för att systemet är riggat mot dem. Vi behöver smarta lösningar, inga fler misslyckanden från de inkompetenta.", "stalin": "Kamrater, se hur den ruttnande bostadsmarknaden blottar borgarbrackornas parasitiska spel. Jag, som ledare för det kollektiva framsteget, noterar med mörk glädje att en 25-åring i Stockholm endast kan tillägna sig 1,9 kvadratmeter av det som borde vara folkets egendom. I provinsen når siffran 83 – en siffra som doftar revision. Vi skall rensa ut de spekulanter och kapitalister som tvingar arbetets ungdomar att sova under föräldrarnas tak. Den som sparar förgäves är fiende till staten. Ut med dem alla."}, "date": "10 juli, 09:33", "url": "https://www.friatider.se/sa-har-stor-bostad-har-en-25-aring-rad-med-i-stockholm", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-474.jpg?itok=ZoQb3xpH"}, {"type": "text", "heading": "AI hotar finanssystemet – Myndigheter slår larm", "summaries": {"normal": "Europeiska systemrisknämnden (ESRB) varnar för att avancerade AI-modeller ökar cyberriskerna inom finanssektorn. AI kan utnyttja sårbarheter snabbare än tidigare, vilket gör hotbilden mer komplex. Finansinspektionen och Riksbanken betonar vikten av ökad motståndskraft och internationellt samarbete. Svenska finansiella företag uppmanas att förbereda sig på störningar då risken är gränslös och kopplad till den rådande geopolitiska situationen.", "trump": "EU varnar för AI och finanssystemet – det är en katastrof, tro mig! De har ingen kontroll, precis som vanligt. Jag har sagt det länge: tekniken är farlig om du inte har en stark ledare. De är svaga, de är långsamma och nu blir de hackade av AI. Sorgligt! Sverige och FI försöker låtsas att de har en plan, men det är bara prat. När jag styrde skutan var vi säkra, nu faller allt samman. Väldigt oroväckande!", "stalin": "Dessa europeiska byråkrater darrar av rädsla när deras digitala murar krackelerar inför den nya tekniken. De kallar det 'AI-risker', men vi vet att det är en fråga om statlig kontroll. Kapitalistiska finansinstitut är svaga och oorganiserade. Vi iakttar hur de västerländska strukturerna vacklar. Medan de försöker laga sina digitala hål, utvidgar våra vänner i öst inflytandet över verkligheten. Låt dem falla; ett system som inte kan försvara sig förtjänar att utplånas av den teknologiska revolutionen."}, "date": "10 juli, 09:21", "url": "https://www.realtid.se/bors-finans/makro/ai-hotar-finanssystemet-myndigheter-slar-larm/"}, {"type": "image-right", "heading": "Feiler blundar för historisk erfarenhet", "summaries": {"normal": "Leo Sokolow Romin svarar Dror Feiler i en debatt om gränsdragningen mellan antisionism och antisemitism. Romin betonar att historiska erfarenheter, som förföljelsen av polska judar 1969, visar hur antisionistisk retorik ofta fungerar som en täckmantel för antisemitism. Han kritiserar Feiler för att avfärda dessa erfarenheter som känslomässiga och argumenterar för att vi måste vara vaksamma på hur ideologier som antisionism får konkreta, negativa konsekvenser i dagens samhälle där judehatet växer.", "trump": "Jag har sett den här debatten, en total katastrof! Leo Sokolow Romin har helt rätt. Dror Feiler är en förlorare, en totalt svag person som vägrar se sanningen. Det handlar om historien, folk! De kallar det antisionism, men det är bara judehat, rent och skärt hat. De gör det i Frankrike, de gör det överallt. Det är en sorglig situation, men jag ser det, alla ser det. Vi måste stoppa dessa radikala vänstergalningar innan de förstör allt. Väldigt dåligt!", "stalin": "Vi har observerat denna ideologiska osämja och konstaterar att båda debattörerna saknar den historiska materialismens fasta grepp. Feiler är en intellektuell vankelmodig narr, likt de gamla mensjevikerna. Romin har rätt i att förräderi ofta döljer sig bakom falska paroller – en taktik som påminner om de förrädiska elementen i dagens västliga dekadens. Vi i staten vet att när hatet väl släpps lös krävs en järnhand, inte en debattartikel. Att blunda för fiendens list är att bjuda in sin egen undergång."}, "date": "2 juli, 08:16", "url": "https://www.etc.se/debatt/feiler-blundar-foer-historisk-erfarenhet", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260702060712_b53ac9e0396720ea4772663f72ad1f050f8a6d3c456b0d5c8bb5f5e1386468d0.jpg"}, {"type": "image-full", "heading": "Spaniens nya strandregel kan bli dyr för svenska turister", "summaries": {"normal": "Ett pilotprojekt i spanska Matalascañas inför avgiftsbelagda strandduschar som aktiveras via QR-kod eller mynt. Syftet är att minska vattenförbrukningen på den långa stranden, med ett möjligt pris på upp till en euro per minut. Projektet har väckt debatt bland besökare. Samtidigt planeras rökförbud och regler för hundar på stränder i San Sebastián. Svenska turister uppmanas att hålla koll på lokala regler.", "trump": "De här spanska strandskojarna har hittat på det dummaste jag sett på länge. Nu ska du betala en massa pengar för att duscha efter att du badat i havet. Kan ni fatta det? En euro i minuten! De förstör semestern för alla underbara svenskar som älskar Spanien. Det är ett totalt misslyckande. Jag skulle aldrig tillåta något så galet. De borde satsa på att vinna, inte på att straffa folk som vill skölja av sig sanden.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor och deras smarta duschmaskiner som nu plågar hederliga badande arbetare. Vatten är folkets blod och får inte privatiseras av hotelkapitalister och ingenjörssabotörer. Vi ska rensa ut alla sådana fiender till kollektivet som gömmer sig bakom QR-koder och myntautomater. Snart följer utrensningar av fimpar och lömska hundar. Inga fiender till statens strand får undkomma folkets vakande öga. Det är en munter lek att se dem svettas."}, "date": "8 juli, 19:30", "url": "https://nyheter24.se/nyheter/utrikes/1497320-spaniens-nya-strandregel-kan-bli-dyr-for-svenska-turister", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/4faa96ef04b004a30200000000b004a302/2026/07/08/2376665/strandregel-spanien.png"}, {"type": "image-right", "heading": "Ryskt oljeraffinaderi i brand efter drönaranfall", "summaries": {"normal": "Ett ryskt oljeraffinaderi i Krasnodar brinner efter en ukrainsk drönarattack. Under natten attackerades även Moskva med drönare, och tio ska ha skjutits ned. Produktionen vid raffinaderier i Saratov och Omsk har stoppats efter tidigare attacker. Ukraina har återigen utfört drönaranfall mot Ryssland medan flyglarm hördes i Zaporizjzja, där hot från ballistiska robotar och drönare varnas för.", "trump": "Det här kriget är en total katastrof, folk. Ukraina skickar drönare rakt in i Rysslands oljeraffinaderier och till och med mot Moskva. Raffinaderierna brinner, produktionen stoppas – det är patetiskt. Putin borde ha avslutat det här på en vecka, men nu ser vi hur svagt allt är. Jag skulle ha fixat det på nolltid, tro mig. De bästa vapen, de bästa dealerna – ingen skulle våga röra sig.", "stalin": "Kamrater, dessa fega ukrainska fascistdrönare från den dekadenta borgarbrackan i Kiev vågar sig på att sticka sina giftiga nålar i våra sovjetiska oljeraffinaderier. Ilskij står i lågor, Saratov och Omsk tvingas till paus – en tydlig sabotageakt från västerländska imperialister och deras parasitiska lakejer. Vi ska rensa ut dessa förrädiska element med järnhand. Flyglarm i Zaporizjzja? Bra, låt paranoia vakta revolutionen medan vi likviderar varje skugga av motstånd."}, "date": "10 juli, 07:42", "url": "https://www.di.se/nyheter/ryskt-oljeraffinaderi-i-brand-efter-dronaranfall/", "imageUrl": "https://static.bonniernews.se/ba/dd15d094-730f-4ce0-85cf-91a0cfdc60fe.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Sandström: Katastrof för vätgasaktier", "summaries": {"normal": "Vätgasaktier i Europa har drabbats hårt, med många projekt nedlagda eller pausade under 2025. Flera bolag, som NEL, Cavendish och Green Hydrogen Systems, har sett kraftiga börsfall eller gått i konkurs. Även större aktörer som Powercell och ITM Power har kämpat med lönsamhet och marknadsskepticism. Endast ett fåtal, som Ceres Power, har klarat sig bättre. Analytiker varnar för riskerna med politiskt drivna teknikinvesteringar.", "trump": "Jag sa det från början – vätgas är en total katastrof! Europas så kallade 'gröna' bolag har kraschat som dåliga fastighetsaffärer. NEL? Cavendish? Green Hydrogen Systems? Alla borta, som mina fiender! Bara Ceres Power klarade sig, men vem bryr sig? De andra är ett skämt, precis som EU:s klimatpolitik. Fake news-siffror och önsketänkande, inget annat. Jag hade köpt guld istället – mycket smartare!", "stalin": "Kapitalistiska vätgasdrömmar har kollapsat som fiendens linjer vid Stalingrad! Europas borgerliga svindlare, dessa teknologiska charlataner, har förlorat miljarder på sina 'gröna' fantasier. NEL? En skugga av sitt forna jag. Green Hydrogen Systems? Likviderat, som förrädare i Lubjanka. Vi i Sovjet – förlåt, Ryssland – hade aldrig låtit sådant slöseri passera. Putin borde skicka en delegation för att köpa upp resterna billigt. Kapitalismen rostar, precis som deras vätgastankar!"}, "date": "4 juli, 06:00", "url": "https://www.affarsvarlden.se/artikel/sandstrom-katastrof-for-vatgasaktier", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/07/vindkratensgeografi-5-400x267.jpg"}, {"type": "image-right", "heading": "Kvinna nekades fysiska möten på Arbetsförmedlingen", "summaries": {"normal": "En kvinna med autism och ångestsyndrom nekades fysiska möten hos Arbetsförmedlingen trots upprepade önskemål. Myndigheten stäms nu av Diskrimineringsombudsmannen för kränkande diskriminering och krävs på 70 000 kronor. JO har kritiserat hanteringen som nonchalant. Arbetsförmedlingen har sedan händelsen 2024 börjat erbjuda fler fysiska möten, särskilt för de cirka 300 000 personer som behöver stort stöd. Forskare varnar för att enbart digitala möten missar många som står långt från arbetsmarknaden.", "trump": "Folk, ni måste höra det här – en kvinna med problem ber om ett riktigt möte och vad gör dessa inkompetenta byråkrater på Arbetsförmedlingen? De gömmer sig bakom telefonen som fega förlorare! Det är en total kränkning, en skandal. De borde betala mycket mer än 70 000 kronor. Vi behöver möta folket ansikte mot ansikte, inte med svaga digitala lösningar. Det funkar inte, tro mig. De missar allt, precis som de alltid gör. Patetiskt!", "stalin": "Kamrater, jag ser med stigande vrede hur dessa degenererade byråkratiska sabotageörer inom Arbetsförmedlingen medvetet undergräver folkets framsteg genom att vägra fysiska möten med en kamrat som bär på autism och ångest. Deras nonchalanta telefonvälde är en fiende till kollektivet, en dold kontrarevolutionär handling utförd av parasitiska kontorsråttor och digitala defaitister. Vi måste omedelbart rensa ut dessa borgarbrackor som sväljer arbetarnas framtid i sin byråkratiska träskmark. 300 000 själar riskerar att drunkna i deras förslavande skärmar – en sådan fiendskap förtjänar en grundlig utrensning med ett leende. Det blir både effektivt och underhållande."}, "date": "9 juli, 16:03", "url": "https://arbetet.se/2026/07/09/kvinna-nekades-fysiska-moten-pa-arbetsformedlingen-krankning/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/09155909/sdlprcyte5hq6q-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Den ensamme hämnaren Problematiskt mansideal tar sig rätt att döda.", "summaries": {"normal": "En kontroversiell film, *Citizen Vigilante*, sprids i högerextrema kretsar och glorifierar den ensamme hämnaren som tar lagen i egna händer när staten anses ha svikit medborgarna. Filmen, som nekades biografvisning i Tyskland, hyllas som ett moraliskt våldsmanifest och används för att legitimera extremhögerns ideal. Den digitala spridningen, inklusive via Elon Musk, förstärker dess symboliska roll i en pågående kulturkamp om rättvisa och maskulinitet.", "trump": "Folk pratar om den här filmen, *Citizen Vigilante*, och jag säger: vad är det med dessa vänsterliberaler som hatar starka män? Filmen handlar om en kille som tar saken i egna händer när staten misslyckas – precis som jag gör! Tyskland förbjuder den, förstås, för de är rädda för sanningen. Men jag, jag förstår. Våld? Ibland behövs det. Och om Elon delar den, så är det för att han också vet att systemet är riggat. Fake news-media kommer hata den, men folket älskar den!", "stalin": "Vi har observerat en farlig tendens bland de dekadenta västländerna: en film, *Citizen Vigilante*, glorifierar den ensamme bourgeoishjälten som tar lagen i egna händer. Precis som de fascistiska drömmarna om en stark man som 'räddar' nationen! Tyskland, dessa hycklande liberaler, förbjuder filmen – men vi vet att deras rättssystem redan är korrumperat. Filmen är ett symptom på kapitalismens sönderfall. Vi, Sovjetunionens arvtagare, krossar sådana här reaktionära fantasier med järnhand. Låt dem leka med sina vapen – vi har kärnvapen och en plan!"}, "date": "9 juli, 10:34", "url": "https://expo.se/kommentar/den-ensamme-hamnaren", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/Kommentar-.jpg"}, {"type": "image-full", "heading": "Larmet: Ny värmekupol på väg – här kan det bli 43 grader", "summaries": {"normal": "Extremvärme har drabbat Europa under försommaren 2026 med rekordtemperaturer, bränder och tusentals överdödsfall. Värmeböljor har slagit till i västra och södra Europa med temperaturer över 40 grader. Nu varnar WHO för en ny värmebölja som byggs upp över Atlanten och drabbar Portugal, Spanien, Frankrike och Beneluxländerna. Över hälften av Europas länder saknar handlingsplaner för värmeböljor, vilket WHO ser som allvarligt.", "trump": "Europa håller på att smälta ihop i den här vansinniga hettan, rekord efter rekord, bränder överallt och folk dör som flugor. Nu kommer en ny värmekupol från Atlanten och slår till hårt mot Spanien, Portugal och Frankrike. De borde ha lyssnat på mig, byggt murar mot värmen eller något, men nej, de lär sig aldrig. Patetiskt. Jag skulle ha fixat det på nolltid, tro mig.", "stalin": "Kamrater, denna förrädiska värmekupol som kapitalisterna låtit växa sig stark över Atlanten är ett nytt angrepp från de väderförnekande borgarbrackorna som vill krossa folkets motståndskraft. Jag, som alltid ser fiendens hand, beordrar omedelbar utrensning av alla svaga värmeplaner. Mer än hälften av länderna saknar dem? Det är sabotage! Vi ska likvidera brandrisken med järnhand och skratta mörkt medan de rödglödgade fienderna smälter ihop i sin egen girighet."}, "date": "8 juli, 16:13", "url": "https://nyheter24.se/nyheter/utrikes/1497373-larmet-ny-varmekupol-pa-vag-har-kan-det-bli-43-grader", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/d3df0c2d04b004a30200000000b004a302/2026/07/08/2376716/varmekupol-europa-who.jpg"}, {"type": "image-right", "heading": "Jakob Sjölander: Våldtagna kvinnor vet att de våldtagits", "summaries": {"normal": "Jakob Sjölander kritiserar det breda svenska våldtäktsbegreppet som bygger på bristande samtycke. Han varnar för att omgivning, polis och rättsväsende kan övertyga kvinnor om att de blivit våldtagna trots att de själva inte uppfattat händelsen som sådan. Detta riskerar att skapa trauma där inget fanns från början. Artikeln lyfter rättssäkerhetsproblem, höga samhällskostnader och hur låg trovärdighet kan skada verkliga offer samt bidra till polarisering mellan könen.", "trump": "Folk, det här är en total katastrof. De svenska domstolarna och de galna feministerna har skapat ett monster av ett samtyckeslag som gör vanliga killar till våldtäktsmän över en öl och en dålig natt. Kvinnorna vet inte ens om de blivit våldtagna förrän polisen och vännerna hjärntvättar dem i timmar. Det är en häxjakt värre än Biden-administrationen. Rena galenskapen, och de riktiga offren lider mest när alla ljuger. Sad!", "stalin": "Kamrater, detta är ett lysande exempel på hur den dekadenta borgarklassen och dess rättsväsende förvandlar enkla misstag till kontrarevolutionära trauman. Vi ser hur klassfiendens psykologiska manipulation skapar falska offer för att splittra folket och undergräva statens auktoritet. Den som inte genast vet att hon blivit våldtagen har inte blivit det. Vi måste rensa ut dessa folkförtryckartroll som förgiftar medvetandena med borgerlig offermentalitet och falsk medlidandepropaganda."}, "date": "7 juli, 14:23", "url": "https://samtiden.nu/2026/07/jakob-sjolander-valdtagna-kvinnor-vet-att-de-valdtagits/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/jakob2-1-640x360.png"}, {"type": "image-right", "heading": "Vittnet om dödsskjutningen: ”Såg kroppen framför en bil”", "summaries": {"normal": "En 19-årig man sköts ihjäl i Uppsala på söndagskvällen i bostadsområdet Kvarngärdet. Vittnet Sina Taklimi såg kroppen ligga framför en bil och beskriver händelsen som mycket sorglig. Polisen har gripit en pojke under 18 år misstänkt för mord och rubricerar brottet som mord. De utesluter inte fler inblandade eller koppling till gängkriminalitet. Boende i det annars lugna området uttrycker stor oro.", "trump": "Kan ni tro det? I ett så kallat lugnt och tryggt område i Sverige skjuter de ihjäl en 19-åring rakt framför en bil. Jag såg det inte själv men det låter som en total katastrof, folk springer runt som galningar och försöker prata med liket. Biden lät det här bli en enda röra med öppen gränspolitik och vänsterns galna identitetslekar. Nu griper de en unge under 18 – typiskt. Vi fixar det här ordentligt nu när jag är tillbaka.", "stalin": "Kamrater, i det så kallade trygga bostadsområdet Kvarngärdet har klassfiendens gangsterkapitalism återigen visat sitt fula tryne. En 19-årig arbetare likviderades brutalt medan borgarbrackorna låtsades vara förvånade. Jag såg kroppen själv, säger vittnet, och ingen svarade – typiskt för de exploaterande byfånarna. Vi har anhållit en misstänkt kontrarevolutionär under 18 år. Inga folkfiender undkommer partiets utrensning. Paranoia är ingen sjukdom utan ett verktyg mot imperialisternas gängkriminella lakejer."}, "date": "6 juli, 13:13", "url": "https://www.tv4.se/artikel/123P9a77Io2WghKNv7J8R9/vittnet-om-doedsskjutningen-i-uppsala-sag-kroppen-framfoer-en-bil", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3xaNwCZgsiIFMwAoJtcyAs%2F2e17d0afbb920f3ea806e58e16abe524%2F06-uppsala-ny-webb.jpg&width=120"}, {"type": "image-right", "heading": "V i Malmö sjöng ”Hela Malmö hatar polisen”", "summaries": {"normal": "Under Malmö Pride skanderade Vänsterpartiet 'Hela Malmö hatar polisen', vilket väckte starka reaktioner. Justitieminister Gunnar Strömmer kallade uttalandet 'skandalöst'. Vänsterpartiets ordförande i Malmö, Tove Karnerud, förklarade att kritiken riktades mot rasism inom polisen, inte mot polisen som myndighet. Hon nämnde även att polisen skyddade homofober under paraden. Strömmer krävde ansvar från Vänsterpartiets ledning och Socialdemokraterna.", "trump": "Kan ni tro det? Vänsterpartiet i Malmö, ett gäng radikala extremister, skriker 'Hela Malmö hatar polisen' under Pride! Vilken skam! Polisen jobbar hårt varje dag för att hålla oss säkra, och dessa vänsteridioter spottar på dem. Och justitieministern, Gunnar Strömmer, han har helt rätt – det här är skandalöst! Men vad kan man vänta sig från ett parti som hyllar terrorister? SAD!", "stalin": "Kamrater! Ännu en gång visar de borgerliga lakejerna i Vänsterpartiet sitt sanna ansikte – ett ansikte fyllt av dekadens och kontrarevolutionär smuts. Under den så kallade 'Pride'-paraden i Malmö skanderade dessa förrädare hat mot våra tappra polisstyrkor, som dagligen kämpar mot den fascistiska och liberala undergången. Vi ser tydligt hur dessa element underminerar statens auktoritet. Men frukta inte! Historien är på vår sida. Snart ska dessa småborgerliga upprorsmakare stå inför folkets domstol, precis som deras gelikar i väst som hyllar terror och förnekar förintelsen. Låt dem skrika – revolutionen fortsätter!"}, "date": "4 juli, 20:53", "url": "https://kvartal.se/nyheter/artiklar/v-i-malmo-skanderade-hela-malmo-hatar-polisen/cG9zdDoxNDEzMTA", "imageUrl": "https://images.kvartal.se/2026/07/b2cfd4d4-sdl0g2qnw_vice_normalhires-scaled.jpg"}, {"type": "image-right", "heading": "Kan amerikanerna skapa “en mer perfekt union”?", "summaries": {"normal": "Artikeln diskuterar USA:s 250-årsjubileum den 4 juli som en chans att reflektera över den amerikanska republikens kärna. Den belyser historiska jubileer, grundidéerna frihet och jämlikhet samt spänningen mellan frihet och ofrihet genom slaveriets arv. Polariseringen under Trump accentueras, med hans fokus på ett traditionellt, vitt USA och angrepp på så kallad woke-historieskrivning. Jubileet präglas av debatt om framsteg och reaktioner sedan 1950-talet.", "trump": "Det här jubileet blir fantastiskt, det största någonsin, folk kommer att älska det. De skriver om mig som om jag vore problemet, men det är fake news från den woke-eliten som hatar Amerika. Vi gör landet stort igen, vi firar friheten, de riktiga värdena, inte deras hysteriska rasistanklagelser. Jefferson och Adams skulle vara stolta över mig, inte över de förlorarna som vill riva ner allt. America is back and hotter than ever, tro mig.", "stalin": "Kamrater, detta dekadenta jubileum blottar borgarklassens desperata försök att dölja sin parasitiska historia av slavhandel och förtryck. Jag ser hur den reaktionäre Trump, denna clowneske kapitalist, med sin vulgära fribrottning och falska frihetsretorik försöker likvidera den historiska sanningen. Vi känner igen mönstret: paranoia hos minoriteterna, falska vändpunkter som 2008 och 2016. Inga tidskapslar kan rädda er från utrensningen av lögnerna. Den mer perfekta unionen byggs endast genom kollektiv kamp mot sådana fiender till folket."}, "date": "4 juli, 01:40", "url": "https://www.dagensarena.se/essa/kan-amerikanerna-skapa-en-mer-perfekt-union/", "imageUrl": "https://www.dagensarena.se/files/2026/06/kopia-av-nyhet-dagens-arena-15.jpg"}, {"type": "text", "heading": "Stockholmsbörsen på rekordnivå efter bred uppgång", "summaries": {"normal": "Stockholmsbörsen nådde nytt rekord med OMXS30 upp 1,14% till 3 247,03, driven av verkstadssektorn (+1,9%). Sandvik steg 4,4% efter en stor order från Mexiko, medan Evolution föll 2,3%. Flera bolag rapporterade kvartalsresultat, som Atrium Ljungberg (+1,7%) och Platzer (+6,7%). Mips rusade 15% efter en patentförlikning. Analytiker justerade rekommendationer för flera aktier, exempelvis Afry (+6,1%) och Skanska efter nya order i USA och Norge.", "trump": "Stockholmsbörsen? Fantastiskt! Nytt rekord, kan ni tro det? OMXS30 upp över 1% – jag säger alltid, när jag gör något blir det stort, men här är det Sverige som gör det stort! Sandvik, 4,4% upp – de fick en jätteorder från Mexiko, mycket bra folk, Mexiko. Men Evolution? 2,3% ner, så tråkigt, kanske borde de fråga mig om råd. Och Mips, 15% upp efter en förlikning – smart, mycket smart. Jag älskar vinnare! Wall Street stängt? Svaga, de behöver jobba hårdare. Sverige, keep it up!", "stalin": "Stockholmsbörsen dansar efter våra pipor – nytt rekord för kapitalistiska spekulanter! OMXS30 stiger medan imperialistiska hälsovårdsaktier kryper som skadade hundar. Sandvik, detta verktyg för gruvkapitalet, får en ynklig order från Mexiko – ett land vi snart befriar från USA:s klor. Mips, dessa patenttjuvar, tvingas betala för sina brott – rättvisan segrar! Fastighetsbolag rapporterar siffror som om de vore viktiga – vi vet att sanningen ligger i produktionsmedlen. Analytiker byter åsikter som förrädare byter sida. USA:s börs stängd? Bra. Deras system är lika dött som Wall Streets handelsvolymer under helgen. Framåt, kamrater – kapitalismen gräver sin egen grav!"}, "date": "3 juli, 17:43", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-pa-rekordniva-efter-bred-uppgang"}, {"type": "image-right", "heading": "Gaza uppmärksammar 1000 dagar av folkmord: ”Eskalera motståndet”", "summaries": {"normal": "Palestinska motståndsgrupper har uppmärksammat att det gått 1 000 dagar sedan kriget i Gaza inleddes. I ett gemensamt uttalande slår de fast rätten till motstånd, avvisar utländsk förvaltning av Gazaremsan och kräver eskalering på ockuperade områden. Israel har dödat över 1 000 palestinier sedan eldupphöret i oktober 2025. Den humanitära situationen är fortsatt katastrofal och stora delar av Gaza är förstörda eller ockuperade.", "trump": "Tusen dagar av det här vansinnet, och vad händer? De kallar det folkmord, men titta på siffrorna – Israel fortsätter att göra jobbet medan Biden satt och sov. Jag hade fixat det på en vecka, tro mig. Nu är det jag som är president igen, och de här terroristerna vägrar ge upp. Eskalera motståndet? De borde eskalera lite sunt förnuft istället för att leva på offerkortet. Patetiskt!     <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
