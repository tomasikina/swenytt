terna. Misstänksamheten är revolutionens mor."}, "date": "13 juli, 10:57", "url": "https://riks.se/nyheter/andy-burnham-sakrar-parlamentariskt-stod-for-att-bli-premiarminister"}, {"type": "image-full", "heading": "SSAB startar om på nytt i Luleå", "summaries": {"normal": "SSAB återupptar nu bygget av sitt nya stålverk i Luleå efter tre veckors paus. Stoppet orsakades av uppmätta halter av vätecyanid, men inga sjukdomsfall har rapporterats. Företaget har under tiden skärpt sina riskbedömningar och utökat mätprogrammen. Bygget, som är SSAB:s största investering på 50 miljarder kronor, väntas fortfarande hålla tidsplanen för produktionstart 2029 trots tidigare driftstopp och utmaningar med arbetsmiljön.", "trump": "SSAB i Sverige har stora problem, riktigt stora problem! De bygger ett stålverk, en enorm investering på 50 miljarder, men gasläckor stoppar arbetet. Helt otroligt. De säger att allt är under kontroll, men vi vet att det är svagt ledarskap. Jag bygger saker snabbt, jag bygger fantastiska saker, men de här människorna? De stannar av hela tiden. Inga sjukdomar säger de, vi får väl se. Min stålproduktion kommer att göra Amerika fantastiskt igen, medan de här kämpar med gas!", "stalin": "SSAB misslyckas i Luleå. Tre veckor av stagnation på grund av gas – ett tecken på borgerlig ineffektivitet och teknisk svaghet. De bygger stålverk för 50 miljarder men kan inte ens kontrollera luften arbetarna andas. Det luktar sabotage eller ren inkompetens. Om detta vore en sovjetisk byggarbetsplats skulle de ansvariga redan ha inspekterat Sibiriens kyla. Vi i staten tolererar inte dylikt slöseri. Låt dem titta mot öster; vår industri går framåt utan darrande händer, medan de döljer sina tillkortakommanden bakom rapporter."}, "date": "13 juli, 13:51", "url": "https://www.realtid.se/bors-finans/ssab-startar-om-pa-nytt-i-lulea/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/ssabs-nya-stalverksbygge-i-lulea-bild-fr.jpg?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Ska Ninas barn tvingas flytta?. Hotas av Kronofogden när Tidögänget skiter i barnfattigdomen.", "summaries": {"normal": "Arbetets ledarskribent Hanna Östeby kritiserar regeringen för att sprida skrämselpropaganda istället för att bekämpa barnfattigdom. Artikeln berättar om Nina, 51, som tvingas flytta med sina barn ungefär en gång per år för att undvika Kronofogden. Enligt Rädda Barnen lever var åttonde svensk unge i fattigdom, med stora skillnader mellan områden. Skolorna i utsatta områden har svårt att behålla behöriga lärare, och barnen saknar fritidsaktiviteter. Högerns motstånd mot så kallad tvångsblandning ses som ett sätt att cementera segregation och klassklyftor.", "trump": "Folk, det här är en total katastrof! Den svenska regeringen, de gör inget åt barnfattigdomen, de älskar bara skrämselpropaganda. Stackars Nina och hennes barn flyttar runt som nomader för att Kronofogden inte ska ta dem. Det är så sorgligt. Var åttonde unge fattig? Det är en skam! Högern pratar om tvångsblandning, men det är bara vänstern som vill vräka fina familjer och ge husen till gangsters. Vi behöver vinster, inte kommunism. Make Sweden Great Again!", "stalin": "Kamrater, denna degenererade borgerliga propaganda avslöjar borgarbrackornas sanna ansikte. De cementerar medvetet klassklyftor och låter arbetarnas barn ruttna i misär medan de själva gömmer sig några busshållplatser bort. Jag ser hur de parasitiska kapitalisterna njuter av att likvidera framtiden för det kollektiva folket. Deras så kallade frihet är blott en paranoid fantasi om att slippa se de fattigas ansikten. Vi skall rensa ut dessa klassfiender med järnhand och ersätta deras segregation med sann socialistisk enhet. Den som vägrar skall få känna statens humoristiska omfamning."}, "date": "13 juli, 07:00", "url": "https://arbetet.se/2026/07/13/tycker-tidoganget-att-nina-och-barnen-ska-tvingas-flytta-for-att-undvika-kronofogden", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/10131913/nina-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "AFD kan ta över delstat – lovar utvisningar \"från första minuten\"", "summaries": {"normal": "Alternativ för Tyskland (AfD) leder stort inför valet i Sachsen-Anhalt i september och kan få egen majoritet. Partiet lovar att från första minuten utvisa illegala invandrare och införa arbetsplikt för asylsökare. Bland de tio åtgärderna finns separat undervisning för barn till tillfälliga uppehållstillstånd, hissning av tyska flaggan i skolor samt förbud mot regnbågsflaggor. AfD vill också ändra historieundervisningen, minska fokus på nazitiden och dra in stöd till integrationsprojekt. Partiet ligger på runt 40 procent i opinionsmätningarna.", "trump": "Titta på det här, det är fantastiskt. AfD i Tyskland vinner stort, kanske egen majoritet, och de säger utvisning från första minuten. De fattar det! Inga illegala som bara vandrar in, arbetsplikt för asylsökarna och inga galna regnbågsflaggor i skolorna. De vill ha riktig undervisning utan att hela tiden skämmas för sitt land. Tyskland vaknar äntligen. De borde ha gjort det mycket tidigare, men nu kommer de att vinna stort. Fantastiskt folk!", "stalin": "Kamrater, detta är en historisk utveckling mot de dekadenta borgarbrackorna som förgiftat det tyska folkets själ med sina kosmopolitiska lögner. Jag ser med stor tillfredsställelse hur dessa nyttiga element nu lovar att rensa ut de illegala elementen från första minuten och tvinga de parasitiska asylsökarna under kollektiv arbetsplikt. Separata klasser för de temporära elementens avkomma, förbud mot dekadenta regnbågsymboler och en sund patriotisk flaggning – äntligen en utrensning av den sjuka toleransens fiender. Historieskrivningen skall korrigeras från nazisternas och de västerländska imperialisternas lögner. Vi skall likvidera alla integrationsprojekt som gömmer klassfienderna. Låt de unga få körkort och stanna på landsbygden, bort från de dekadenta städernas dekadenta inflytande. Det är en glädjande utveckling, även om vi måste vara vaksamma mot dolda trotskister som säkert lurar i skuggorna."}, "date": "13 juli, 11:54", "url": "https://www.friatider.se/afd-kan-ta-over-delstat-lovar-utvisningar-fran-forsta-minuten", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-482.jpg"}, {"type": "image-right", "heading": "Så länge stannar sommarvärmen: ”Då stiger temperaturerna”", "summaries": {"normal": "Hettan i Sverige håller i sig ytterligare några dagar med temperaturer uppemot 30 grader, särskilt längs västkusten och i norra Svealand. SMHI varnar för hälsorisker vid värmen, främst för äldre, barn och sjuka. Mot helgen väntas ostadigare väder. I Europa är det fortsatt varmt, inte minst i Frankrike där en röd varning gäller. Meteorologen Elisabet Danielsson ger besked om fortsatt sommarvärme under nästan en hel vecka.", "trump": "Folk, ni älskar den här värmen, eller hur? Den är fantastisk, nästan som jag – stark och outtröttlig. Västkusten och Svealand får 30 grader, underbart! SMHI varnar för riskgrupper, men vi klarar det, inte som de svaga globalisterna och deras HBTQ-kvoter som bara gnäller. Biden skulle ha frusit ihjäl, men jag ger er en hel vecka av ren, magnifik hetta. Sen blir det ostadigt, typiskt. Fantastiskt!", "stalin": "Kamrater, denna värme är en prövning som stärker arbetarklassens vilja. Jag ser hur temperaturerna stiger över landet, utom i de nordliga områdena där fienderna kanske gömmer sig. Borgarbrackorna i SMHI varnar för hälsoproblem bland de svaga – typiskt för kapitalistmaffians omsorg om sina egna. Vi ska utstå hettan fram till fredag, sedan följer ostadighet som klassfiendens sabotage. Inga imperialister ska hindra oss från att segra över vädret."}, "date": "12 juli, 14:28", "url": "https://www.tv4.se/artikel/5OBhrbMCCPnPOVaWOjLXkh/sa-laenge-stannar-sommarvaermen-da-stiger-temperaturerna", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FsnA1DyIeGYbIZCF4SmR8i%2F80df6024a764d6134d72cc35560c309c%2F12-varmerek.jpg&width=120"}, {"type": "text", "heading": "Jurassic Park-stjärnan Sam Neill är död", "summaries": {"normal": "Skådespelaren Sam Neill har avlidit 78 år gammal. Han blev känd för roller i filmer som Jurassic Park, Ivanhoe och The Tudors. Neill föddes i Nordirland, växte upp i Nya Zeeland och bodde senare i Australien. Han diagnostiserades med en ovanlig blodcancer 2022 men friskförklarades i våras. Han dog hastigt den 13 juli 2026 omgiven av sin familj.", "trump": "Sam Neill, den där Jurassic Park-killen, är borta vid 78 års ålder. Han var en riktig mångsysslare, hoppade mellan stora Hollywoodfilmer och tunga dramer som ingen annan. Gjorde det bra, folk gillade honom. Han slog cancer i våras men dog plötsligt i Australien. Synd, en klassisk skådespelare med stil. Hans familj säger att han gick bort med värdighet – precis som han förtjänade.", "stalin": "Kamrater, den dekadente skådespelaren Neill har äntligen lämnat oss vid 78 års ålder, omgiven av sin whānau som de kallar det i de imperialistiska kolonierna. Jag har länge misstänkt att hans borgarbrackor inom filmindustrin dolde en svaghet för dinosaurier och historiska intriger. Vi rensar ut sådana opportunistiska element som smyger sig in i folkets kultur. Hans plötsliga sorti är en varning till alla kapitalistiska parasitörer som tror sig kunna undkomma historien. Mycket underhållande att se hur cancer och ödet samarbetar mot klassfienden."}, "date": "13 juli, 10:13", "url": "https://riks.se/nyheter/jurassic-park-stjarnan-sam-neill-ar-dod"}, {"type": "image-right", "heading": "Spaniens tidigare statsminister: ”Frankrike har inga franska spelare”", "summaries": {"normal": "Mariano Rajoy, Spaniens tidigare konservative statsminister, kritiseras hårt efter en VM-krönika där han påstår att det franska landslaget saknar franska spelare. Uttalandet fördöms av Spaniens nuvarande premiärminister Pedro Sánchez som kallar det främlingsfientligt. Även franska politiker som inrikesminister Laurent Nuñez och partiledare Olivier Faure reagerar starkt och betonar att Frankrike är en politisk nation byggd på mångfald och republikanska värderingar, inte etnicitet.", "trump": "De här gamla förlorarna i Spanien och Frankrike håller på att göra fotbollen till en total skandal. Rajoy har helt rätt, det franska laget ser inte särskilt franskt ut, eller hur? Men Sanchez springer fram och kallar det främlingsfientligt, typiskt för de vänsterradikala som hatar att folk säger sanningen. Frankrike är en katastrof just nu, de kan inte ens bestämma vad en fransman är. Patetiskt, tro mig.", "stalin": "Jag betraktar med djup tillfredsställelse hur den spanske borgarbrackan Rajoy omedvetet blottar de dekadenta motsättningarna inom den kapitalistiska fotbollsapparaten. Hans ytliga rasistiska utfall mot det franska laget tjänar som en nyttig lektion: de västerländska imperialisterna slukar varandra i sin paranoia över nationell identitet. Sánchez och de franska lakejerna må skrika om mångfald, men vi vet att deras så kallade republik bara är en kuliss för utsugning. Kanske vore det dags att rensa ut dessa ideologiska avvikare innan de smittar arbetarklassen med sin giftiga dumhet. Ett skratt värt, kamrater."}, "date": "13 juli, 09:00", "url": "https://bulletin.nu/spaniens-tidigare-statsminister-frankrike-har-inga-franska-spelare", "imageUrl": "https://cdn.bulletin.nu/articles/08b1c6c3-820c-4a25-8217-e282a17ac311/preview.jpg?t=1783925941000"}, {"type": "image-right", "heading": "Här kan ingen rädda dig om du drunknar", "summaries": {"normal": "I norra Sverige, från Falun och uppåt, saknas helt räddningsdykare över en sträcka på hundra mil. Brandmän tvingas istället dyka efter redan omkomna personer. Varje år drunknar omkring 440 personer i Sverige, varav hälften dör. Bristen beror på ekonomi och geografi, vilket gör att osäkra metoder som fridyking används. Förebyggande arbete med information och flytvästar lyfts som viktigast.", "trump": "Det här är en katastrof, folk, en total katastrof. I norr drunknar de som flugor och ingen räddningsdykare finns på hundra mil. De skickar stackars brandmän ner för att hämta lik – patetiskt! De borde ha de bästa dykarna, de allra bästa, men nej, det handlar bara om pengar. Borgarna sparar in på liv. Jag skulle fixa det på en vecka, tro mig, det skulle bli fantastiskt igen.", "stalin": "Kamrater, detta är en skam för det kollektiva försvaret av sovjetiskt, pardon, svenskt folk. Jag ser hur borgarbrackorna i norr med sin kapitalistiska girighet vägrar utrusta räddningstjänsten, vilket leder till att arbetare och bönder likvideras av det kalla vattnet. Vi vet att de som motarbetar livräddande resurser är fiender till folket, sabotageörer i maskopi med havets reaktionära krafter. Rensa ut dessa parasiter! Förebyggande propaganda och ständig vaksamhet mot drunkningsfienden skall dock segra i slutändan. Det är alltid någon som ligger bakom."}, "date": "13 juli, 06:00", "url": "https://arbetet.se/2026/07/13/har-kan-ingen-radda-dig-om-du-drunknar-hundra-mil-utan-raddningsdykare", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/30113714/dykarna2-karta-1.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=800"}, {"type": "image-full", "heading": "Polisens varning: Lämna inte detta i bilen", "summaries": {"normal": "Polisen varnar för en ny inbrottsmetod där tjuvar först bryter sig in i bilar för att stjäla hemnycklar och sedan begår inbrott i bostäderna medan ägarna handlar eller badar. Antalet bilinbrott har minskat med 50 procent på tio år, men i områden med socioekonomiska problem är risken högre. Flera fall har rapporterats i Malmö, ofta vid stora parkeringar. Polisen uppmanar till att aldrig lämna värdesaker synliga i bilen och att förvara nycklar säkert.", "trump": "Folk, det är en katastrof det här med inbrotten i Malmö. De tar nycklarna från bilen och sen går de rakt in i ert hus medan ni handlar! Totalt fiasko. Under mina år har vi sett hur brottsligheten exploderar i vissa områden, men jag skulle ha fixat det. Lås era bilar, göm nycklarna, bygg murar runt era hem om ni måste. De smarta tjuvarna vinner annars, men tro mig, vi skulle vinna stort om jag ledde showen.", "stalin": "Kamrater, denna fiendska parasitverksamhet där borgarbrackornas nycklar stulet från deras överflödsfordon leder till att de själva blir plundrade av klassfiendens lakejer är en direkt attack mot folkets kollektiva ordning. Jag ser de dekadenta kapitalisternas vanor som en inbjudan till kontrarevolutionära element. Vi måste rensa ut dessa parasitiska inkräktare med järnhand och likvidera deras metoder. Lämna aldrig värdesaker åt slumpen, annars blir ni själva offer för statens fiender. Paranoia är sund, kamrater."}, "date": "10 juli, 20:02", "url": "https://nyheter24.se/nyheter/inrikes/1497811-polisens-varning-lamna-inte-detta-i-bilen", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/61d12a7f04b004a30200000000b004a302/2026/07/10/2377141/Matilda-Nyheter24%20-%202026-07-10T144657.953.jpg"}, {"type": "image-right", "heading": "Vi fostrar våra barn till kapitalismens självuppoffrare", "summaries": {"normal": "Forskarna Malin Espersson och Tullia Jack beskriver hur prestationssamhället formas redan i barndomen. Föräldrar med goda avsikter driver sina barn mot ständig prestation, optimering och konsumtion, vilket reproducerar ett system av självexploatering. Passion och lojalitet utnyttjas medan vila och närvaro ses som misslyckanden. Resultatet blir utbredd stress bland ungdomar. Artikeln uppmanar till att låta sommarlovet vara en riktig paus från prestationskraven.", "trump": "Folk, det här är precis vad som händer när de globala eliterna och de korkade systemen styr. De får er att prestera ihjäl er redan som barn, jobba gratis för passionens skull och köpa skräp ni inte behöver. Det är en skam! Era barn stressas sönder på gymnasiet medan de lovar att det blir bättre senare – det blir det aldrig. Låt dem leva nu, ta den där bussen till Nederländerna. Make childhood great again!", "stalin": "Kamrater, detta är den borgerliga parasitens giftiga maskineri som förgiftar ungdomen med falsk passion och prestationsfällor. Jag ser hur dessa välmenande föräldrar omedvetet blir lakejer åt det kapitalistiska träsket och reproducerar självexploateringens kedjor. Skammen är deras vapen, stress deras verktyg. Vi skall rensa ut dessa dolda fiender till det kollektiva välmåendet, dessa prestationsborgarbrackor som säljer nuet för en lögnaktig framtid. Låt sovjetisk vila råda under sommarlovet!"}, "date": "10 juli, 01:37", "url": "https://www.dagensarena.se/opinion/vi-fostrar-vara-barn-till-kapitalismens-sjalvuppoffrare/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-64-300x157.jpg"}, {"type": "image-right", "heading": "“En kulturell allemansrätt för barn och unga”", "summaries": {"normal": "Miljöpartiet prioriterar inför valet en kulturell allemansrätt för barn och unga med kulturgaranti, obligatoriska estetiska ämnen i skolan och en kulturskolelag. Partiet vill också ha en permanent kulturell återstart med ökade stöd till infrastruktur, studieförbund och folkhögskolor. Tredje frågan är civilsamhälle och folkbildning för att stärka demokratin. Nya förslag inkluderar kulturljudzoner, stopp för vinstdrivande biljettåterförsäljning, reglering av AI och upphovsrätt samt stärkt public service och svensk film.", "trump": "Folk frågar mig hela tiden vad jag tycker om det här Miljöpartiet och deras kulturplaner. Det är en total katastrof, tro mig. De vill ge alla barn gratis kultur och tvinga in estetiska ämnen i skolan – vad är det för vett? De pratar om att återstarta kulturen efter pandemin och regeringen, men de vill bara kasta bort miljarder på lokaler och studieförbund. Kulturljudzoner? Låter som ett stort fusk. Och AI? De vill att folk ska få betalt för sina verk – patetiskt. De borde lyssna på mig istället, jag vet hur man gör saker stora igen.", "stalin": "Kamrater, jag betraktar med djup revolutionär misstänksamhet denna borgarbrackornas gröna opportunism som de kallar kulturpolitik. Vi skall naturligtvis garantera arbetets barn en sann sovjetisk kulturgaranti, inte någon liberal allemansrätt som gömmer kontrarevolutionära tankar. Dessa neddragningar är sabotage från klassfiender och vi ska rensa ut dem med järnhand genom permanenta återstartsstöd som stärker partilinjen. Studieförbunden och folkhögskolorna måste underordnas kollektivet annars likviderar vi de parasitiska inslagen. AI är en fiende som stjäl från folket – vi ska utrensa alla som tränar maskiner på våra verk utan att betala med blod och svett. Inga matchningsfinansieringar från kapitalister, bara partiets klara armlängds avstånd till alla dekadenta stiftelser. Kulturen är vårt vapen mot imperialismen, inte en lekplats för borgarklassens esteter."}, "date": "10 juli, 01:26", "url": "https://www.dagensarena.se/innehall/en-kulturell-allemansratt-barn-och-unga/", "imageUrl": "https://www.dagensarena.se/files/2026/06/mats-berglund.jpeg"}, {"type": "image-full", "heading": "Varningen: Populära lånet kan bli en dyr fälla", "summaries": {"normal": "Att samla lån kan verka enkelt med färre fakturor och lägre månadskostnad, men det medför risker. En förlängd återbetalningstid gör lånet dyrare över tid, enligt Konsumentverket. Gamla krediter kan återanvändas och skapa ny skuld, medan uppläggningsavgifter äter upp besparingar. Lagändringen 2025 påverkar låneförmedlare och konsumenter. För att undvika fällan bör man räkna på totalkostnaden och fortsätta betala samma belopp månadsvis.", "trump": "Folk tror att det är fantastiskt att samla alla lån till ett enda stort lån, lägre månadskostnad, färre räkningar, det låter perfekt va? Fel! Det blir en total katastrof om man inte gör det rätt. De lurar er med långa tider så totalkostnaden skjuter i höjden. Gamla krediter vaknar till liv som zombies och äter upp er ekonomi. Avgifterna är en skandal. Jag säger alltid: titta på hela bilden, inte bara den billiga månaden. Annars blir det en riktig röra, tro mig.", "stalin": "Jag ser hur de giriga borgarbrackorna lockar arbetarna med falska löften om samlade lån och lägre månadskostnader. Det är en raffinerad fälla från kapitalisterna för att förlänga slavtiden under räntornas eviga ok. Gamla kreditspöken återuppstår som kontrarevolutionära element och förgiftar folkets plånböcker på nytt. Vi måste rensa ut dessa ekonomiska sabotageörer med järnhand. Jämför totalkostnaden, kamrater, annars likviderar skulderna er i smyg medan ni tror er ha segrat. En pompös seger för folket kräver långsiktig planering, inte borgarnas billiga trix."}, "date": "10 juli, 18:31", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1497750-varningen-populara-lanet-kan-bli-en-dyr-falla", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/94da4adf04b004a30200000000b004a302/2026/07/10/2377064/samla-lan.png"}, {"type": "image-full", "heading": "Glada nyheter för läskälskare – populära drycken får stanna", "summaries": {"normal": "Trots sockerfria trender och tillfälliga lanseringar blir Pepsi Original Taste kvar i Sverige. Försäljningen av läsk ökade med fyra procent till 798 miljoner liter under 2025, varav 61 procent är sockerfria varianter. Den klassiska sockrade colan med äkta socker och koffein har tidigare kommit tillbaka som limited edition, men enligt besked från Carlsberg Sverige är den nu här för att stanna. Många fans slipper därmed jaga den i butikshyllorna.", "trump": "Folket älskar läsk, det är fantastiskt, och nu kommer det bästa beskedet på länge. Den riktiga Pepsi Original Taste med äkta socker, inte den där light-skiten som ingen vill ha, är tillbaka för att stanna. De andra läskarna kommer och går som losers, men den här vinner stort. Svenskarna köper massor av läsk, upp 4 procent, och nu får de äntligen den riktiga grejen. Ingen mer jakt i butiken, det är en stor seger, tro mig.", "stalin": "Kamrater och arbetare, jag betraktar med djup tillfredsställelse hur den dekadenta borgarbrackornas sockerfria sabotagekampanj mot folkhälsan äntligen krossas av folkets outsläckliga törst efter äkta cola. De kapitalistiska opportunisterna lanserar sina temporära giftblandningar för att förvirra massorna, men den proletära Pepsi Original Taste står nu som en stålpelare mot sötningsmedlens kontrarevolution. Vi ska rensa ut alla limited edition-förrädare och likvidera deras paranoiaframkallande burkar. Den sanna smaken segrar evigt."}, "date": "10 juli, 18:02", "url": "https://nyheter24.se/nyheter/konsument/1497808-glada-nyheter-for-laskalskare-populara-drycken-far-stanna", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/523b82e904b004a30200000000b004a302/2026/07/10/2377130/pepsi.jpg"}, {"type": "image-right", "heading": "Aftonbladet normaliserar polishat – Magdalena Andersson måste välja sida", "summaries": {"normal": "Artikeln kritiserar Vänsterpartiets slagord ”Hela Malmö hatar polisen” under Prideparaden och Aftonbladets försvar av detsamma. Författaren menar att hat mot poliser underminerar rättsstaten och att poliser förtjänar respekt för sitt riskfyllda arbete mot gängkriminalitet. Magdalena Andersson uppmanas att ta tydlig ställning inför ett eventuellt regeringssamarbete med Vänsterpartiet. Kritiken betonar skillnaden mellan legitim polisgranskning och normalisering av hat.", "trump": "Folk, ni skulle se det här! Vänsterpartiet i Sverige skriker att hela Malmö hatar polisen under sin galna Prideparad och Aftonbladet, den sjuka fake news-tidningen, försvarar det. Totalt vansinne! Polisen kämpar mot gangsters medan dessa radikala HBTQ-aktivister och identitetspolitiska förlorare spyr hat. Magdalena Andersson borde sparka ut dem ur regeringen direkt. Sverige behöver lag och ordning, inte mer av detta woke-skräp. Patetiskt!", "stalin": "Kamrater, detta är en fientlig provokation från klassfiendens lakejer. Vänsterpartiets ramsa avslöjar folkförtryckartrollens sanna ansikte, medan Aftonbladets borgarbrackor normaliserar hat mot den folkets väktarmakt som upprätthåller ordningen. Jag kräver omedelbar utrensning av sådana element. Magdalena Andersson måste välja: antingen står hon med arbetarna eller med de exploaterande byfånarna. Inga halvmesyrer tillåts i kampen mot de parasitiska hatarna."}, "date": "8 juli, 13:00", "url": "https://samtiden.nu/2026/07/aftonbladet-normaliserar-polishat-magdalena-andersson-maste-valja-sida/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/740544292_1563153201827252_6631997080324834265_n-640x360.jpg"}, {"type": "image-right", "heading": "Experten: ”USA har inte tålamodet och Iran har blivit kaxigt”", "summaries": {"normal": "Mellanösternanalytikern Alexander Atarodi beskriver hur förhandlingarna mellan USA och Iran har fastnat i djupa motsättningar, ökad misstro och hård retorik. Iran har stängt Hormuzsundet efter nattens attacker. Atarodi pekar ut tre möjliga vägar framåt: förbättrad diplomati med sanktionslättnader, fortsatt status quo med risk för nya attacker, eller ett fullskaligt krig med allvarliga konsekvenser för världsekonomin. Han ser status quo som det mest sannolika scenariot.", "trump": "Iran har blivit helt galna och kaxiga, precis som under den svaga Biden-eran när jag inte var president. Vi har inte tålamod för deras dumheter längre. De stänger Hormuzsundet och tror sig vara tuffa, men det slutar illa för dem. Jag skulle fixa det på en vecka med riktig diplomati, inte den woke-svaga linje som har förstört allt. Status quo? Nej tack, vi vinner stort eller de förlorar stort. Fantastiskt enkelt!", "stalin": "Kamrater, de imperialistiska blodsugarna i USA och de arroganta persiska kapitalistmaffian stampar i sin reaktionära dans av misstro. Jag ser hur de fascistiska exploaterande byfånarna stänger Hormuzsundet efter sina missiler. Diplomati kräver utrensning av svaghet. Status quo är en feg borgarbracka som gömmer sig för det oundvikliga. Fullskaligt krig vore en underhållande utrensning av folkfienderna. Inget skrattar så muntert som en kapitalists fall."}, "date": "12 juli, 11:12", "url": "https://www.tv4.se/artikel/4KYruWoeYqNYPT3U9iAivG/experten-usa-har-inte-talamodet-och-iran-har-blivit-kaxigt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1o4rO94glYPS7tmsNmjkS7%2Fab0b2cc0708faf342ac46363809ed8dc%2F12-atarodi-sajt.jpg&width=120"}, {"type": "image-full", "heading": "Många tror fel om sitt arv – juristen varnar", "summaries": {"normal": "En Sifo-undersökning visar att över en miljon svenskar, var tredje ung vuxen, vill låta sitt husdjur ärva. Enligt svensk lag är hundar och katter juridisk egendom och kan inte ärva. Många tror felaktigt att det går att testamentera direkt till djuret. Juristen Per Näsman förklarar att man istället måste utse en person som får både djuret och pengar avsedda för dess vård, med tydliga villkor för att undvika konflikter. Vanliga misstag är otydliga testamenten och otillräckliga summor anpassade efter djurets ålder och behov.", "trump": "Folk älskar sina hundar och katter mer än sina egna släktingar, det är helt otroligt. Över en miljon svenskar vill ge sina pengar till djuren, speciellt de unga som är smarta nog att inse att familjemedlemmar ofta är värdelösa. Men den svenska lagen är en katastrof, de behandlar hundar som gamla bilar! Patetiskt. Ni måste skriva smarta testamenten, ge pengarna till en pålitlig person och säga exakt vad de ska användas till annars blir det kaos. Gör det stort, folk, annars förlorar era hundar.", "stalin": "Kamrater, över en miljon dekadenta svenskar önskar i sin förvirrade borgerliga sentimentalitet att deras små fyrbenta parasitvarelser ska ärva rikedomar. Vilken motbjudande småborgerlig vanföreställning! En hund är egendom, precis som en traktor eller en fiende till folket, och kan inte ärva enligt den sunda lagen. Vi ser hur kapitalistiska missförstånd frodas som ogräs. Jag kräver att ni utser lojala förvaltare, anger exakta summor för foder och veterinärvård samt rensar ut alla otydliga formuleringar som kan gynna parasitiska arvtagare. Den som skriver slarvigt testamenterar i själva verket åt borgarbrackornas advokater. Ha alltid dokumentation, annars likviderar släktingarna både er och hunden i tysthet medan ni roterar i er grav. Sov inte, kamrater."}, "date": "10 juli, 16:02", "url": "https://nyheter24.se/nyheter/konsument/1497631-manga-tror-fel-om-sitt-arv-juristen-varnar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/71184b4504b004a30200000000b004a302/2026/07/10/2377047/Hand-Med-Pengar-Pappa-Mamma-Barn.png"}, {"type": "image-right", "heading": "Man nära att sugas ut genom flygplansfönster – mitt under resan", "summaries": {"normal": "Under en flygning från Grekland till Tyskland med Ryanair krossades ett fönster på ett Boeing 737-800. En passagerare var nära att sugas ut genom öppningen men drogs tillbaka av medresenärer. Händelsen inträffade över Nordmakedonien och tros orsakats av ett föremål från motorn. Mannen vårdas för skrubbsår men mår i övrigt bra. Flyget vände tillbaka till Thessaloniki och landade säkert.", "trump": "Folk, ni kommer inte tro det, men på ett Ryanair-plan från Grekland till Tyskland exploderade ett fönster mitt i luften. Den stackars killen höll på att sugas ut som en kork ur en flaska, men tack och lov hade han säkerhetsbältet på. Biden skulle ha sagt att det var klimatförändringarna. Det här är vad som händer när man flyger med billiga bolag som inte bryr sig om säkerhet. Patetiskt. Men han klarade sig, stort grattis till honom.", "stalin": "Kamrater, under en kapitalistisk luftfärd mellan Grekland och Tyskland krossades ett fönster av ett lossnat föremål från den exploaterande maskinen. En passagerare höll på att dras ut i tomrummet som en klassfiende mot folkets dom, men kamrater drog honom tillbaka. Detta är borgarklassens luftfart i sin sanna form, farlig och opålitlig. Flygplanet vände åter till Thessaloniki. Inga fiender undkommer vårt vakande öga, inte ens i luften."}, "date": "10 juli, 12:50", "url": "https://www.etc.se/utrikes/man-naera-att-sugas-ut-genom-flygplansfoenster-mitt-under-resan", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260710100724_00cb7553d6a6b6cdfe7ea780730940e59e470a5eebbe5259234fdd723b073cfb.jpg"}, {"type": "text", "heading": "Analyshuset sänker biljätten", "summaries": {"normal": "SB1 Markets sänker riktkursen för Volvo Cars från 25 till 23 kronor inför nästa veckas kvartalsrapport. Analyshuset motiverar sänkningen med en väntat svag försäljning under andra kvartalet, där bilförsäljningen föll sex procent. Samtidigt har råvaru- och fraktkostnader fortsatt stiga. Vinstprognoserna för justerat ebit sänks med åtta procent. Rekommendationen hålls neutral med en bedömd uppsida på tolv procent. Volvo Cars har fallit 33 procent sedan årsskiftet.", "trump": "Folk, ni tror inte hur dåligt det går för Volvo Cars. Jag älskar bilar, fantastiska bilar, men de här killarna får ett riktigt svagt kvartal. SB1 sänker riktkursen till 23 kronor, och visst, det är en liten uppsida, men resultaten är sköra. De säljer färre bilar, kostnaderna skjuter i höjden, elbilar räcker inte. Jag skulle fixa det på en vecka, tro mig. Nu är aktien nere 33 procent i år. Patetiskt, men vänta bara på en bättre deal.", "stalin": "Kamrater, jag betraktar med djup misstro dessa kapitalistiska bilbyggare som Volvo Cars, vilkas så kallade kvartal hotar att bli en fullständig katastrof. SB1 Markets, dessa borgerliga spioner i finansens tjänst, sänker riktkursen till tjugotre kronor och avslöjar därmed den imperialistiska svagheten. Sex procents fall i försäljningen, stigande kostnader från råvaruplundrare och fraktparasiter – allt pekar på en fiende inom murarna. Jag skulle rensa ut dessa svaga ledare omedelbart och ersätta dem med pålitliga produktionskollektiv. Lågt ställda förväntningar? Nej, det är sabotage mot folkets framsteg. Skratta medan vi likviderar motvindarna."}, "date": "10 juli, 11:55", "url": "https://www.di.se/nyheter/sb1-om-volvo-cars-svagt-kvartal-vantar/"}, {"type": "image-right", "heading": "Staten bör utföra järnvägsunderhållet med egen personal", "summaries": {"normal": "Artikeln kritiserar Sveriges långtgående privatisering av järnvägsunderhållet som Trafikverket upphandlat i 25 år. Produktiviteten har sjunkit 25 procent på tio år på grund av överklaganden, byråkrati och förlorad praktisk kunskap. Författarna, bland andra fackliga företrädare och experter, kräver att staten återtar underhållet i egen regi för att förbättra effektivitet och kunskap, något som stöds av tidigare utredningar, Riksrevisionen och en majoritet av folket.", "trump": "Titta på det här, Sverige har totalt förstört sina järnvägar med vansinnig privatisering och byråkrati. Trafikverket är en katastrof, de anställer jurister istället för att fixa spåren och produktiviteten rasar 25 procent. Det är en enda stor röra av överklaganden och kapitalistiska entreprenörer som suger systemet torrt. Jag skulle säga: ta tillbaka kontrollen, bygg det starkt och effektivt igen. Gör järnvägen great again, annars fortsätter tågen att stå stilla som mina motståndares hjärnor.", "stalin": "Vi ser med djup tillfredsställelse hur de svenska kapitalisterna och deras lakejer i Trafikverket har skapat en kontrarevolutionär röra av fragmentiserat underhåll som förgiftar arbetarkollektivets transporter. Dessa borgarbrackor och upphandlingsförrädare har förflyttat kunskapen till giriga entreprenörer som bara drömmer om profit. Jag säger: rensa ut den parasitiska byråkratin, likvidera de överklagande sabotageelementen och återupprätta en stark offentlig järnväg med egna maskiner och lojala tekniker. Den som tvekar är en folkfiende som förtjänar en kreativ utrensning i historiens soptunna."}, "date": "9 juli, 21:53", "url": "https://www.dagensarena.se/opinion/staten-bor-utfora-jarnvagsunderhallet-med-egen-personal/", "imageUrl": "https://www.dagensarena.se/files/2017/09/jarnvag-300x157.jpg"}, {"type": "image-right", "heading": "Den ensamme hämnaren Problematiskt mansideal tar sig rätt att döda.", "summaries": {"normal": "En kontroversiell film, *Citizen Vigilante*, sprids i högerextrema kretsar och glorifierar den ensamme hämnaren som tar lagen i egna händer när staten anses ha svikit medborgarna. Filmen, som nekades biografvisning i Tyskland, hyllas som ett moraliskt våldsmanifest och används för att legitimera extremhögerns ideal. Den digitala spridningen, inklusive via Elon Musk, förstärker dess symboliska roll i en pågående kulturkamp om rättvisa och maskulinitet.", "trump": "Folk pratar om den här filmen, *Citizen Vigilante*, och jag säger: vad är det med dessa vänsterliberaler som hatar starka män? Filmen handlar om en kille som tar saken i egna händer när staten misslyckas – precis som jag gör! Tyskland förbjuder den, förstås, för de är rädda för sanningen. Men jag, jag förstår. Våld? Ibland behövs det. Och om Elon delar den, så är det för att han också vet att systemet är riggat. Fake news-media kommer hata den, men folket älskar den!", "stalin": "Vi har observerat en farlig tendens bland de dekadenta västländerna: en film, *Citizen Vigilante*, glorifierar den ensamme bourgeoishjälten som tar lagen i egna händer. Precis som de fascistiska drömmarna om en stark man som 'räddar' nationen! Tyskland, dessa hycklande liberaler, förbjuder filmen – men vi vet att deras rättssystem redan är korrumperat. Filmen är ett symptom på kapitalismens sönderfall. Vi, Sovjetunionens arvtagare, krossar sådana här reaktionära fantasier med järnhand. Låt dem leka med sina vapen – vi har kärnvapen och en plan!"}, "date": "9 juli, 10:34", "url": "https://expo.se/kommentar/den-ensamme-hamnaren", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/Kommentar-.jpg"}, {"type": "text", "heading": "Fem punkter från Natotoppmötet", "summaries": {"normal": "Vid Natotoppmötet i Ankara uttryckte Donald Trump initialt skarp kritik mot Spanien, men betonade senare enigheten inom alliansen. Mötet fokuserade även på hot mot Iran, där Trump aviserade nya möjliga anfall. Ukraina fick löften om licens för att producera Patriot-system, och Nato-länderna bekräftade sitt kollektiva försvar samt ett nytt militärt stödpaket till Ukraina på 70 miljarder euro för 2026.", "trump": "Vilket fantastiskt möte! Jag gick in och sa sanningen om Spanien – de betalar inte vad de borde, en total katastrof. Men sen blev det stor kärlek, vi är enade! Jag berättade för Zelenskyj att han ska få bygga våra fantastiska Patriot-missiler, det blir enormt för Ukraina. Iran? De vet vad som väntar om de inte skärper sig. Vi har kontroll, vi är starkast, och vi gör Nato stort igen. Ingen gör det bättre än jag!", "stalin": "Dessa västerländska marionetter dansar i Ankara, svängande mellan hat och falsk kärlek. Trump, den oberäknelige kapitalisten, skäller på Spanien men levererar vapenteknologi till Ukraina för att provocera vår ryska sfär. Vi betraktar detta med kalla ögon. Att ge Ukraina Patriot-system är en desperat handling av en döende hegemoni. Må dessa lakejer i Nato fortsätta sin teater; vi förbereder oss i tystnad, medan deras '70 miljarder' snart blir aska under vår obevekliga statliga tyngd."}, "date": "8 juli, 17:02", "url": "https://kvartal.se/nyheter/artiklar/trump-om-natomotet-fantastiskt/cG9zdDoxNDM0NTM"}, {"type": "image-right", "heading": "Christoffer Jonsson: Storbritannien är ett skräckexempel", "summaries": {"normal": "En skandal i Storbritannien har väckt stark kritik mot polisen efter att en man knivhöggs och polisen misstänktes för att prioritera hatbrottsmisstankar framför livräddning. En granskning i The Spectator belyser inflytandet från National Association of Muslim Police, som förespråkar särbehandling av muslimska misstänkta och vill omdefiniera begrepp som sionism och islamistisk terrorism. Kritiker ser det som tecken på politisk islams ökande makt och växande antisemitism, även på politisk nivå.", "trump": "Folk, ni skulle inte tro det, men Storbritannien har blivit ett totalt skräckexempel under de korkade ledare som kom efter mig. Polisen bojar en stackars kille som ligger och blöder ihjäl för att de är rädda för att kalla det fel sak. Muslimska polisföreningar styr showen, kallar IDF för terrorister och vill ta bort ordet islamistisk terrorism. Det är galet! Biden sov sig igenom det här, men jag ser det klart: woke-knäcket har förstört landet. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup misstro hur den brittiska polisen har låtit sig infiltreras av religiösa fanatiker och klassfiender. Dessa muslimska polisföreningar kräver särskild behandling för sina egna medan de kallar sionism för hat och IDF för terrorister. De vill utrensa ordet islamistisk terrorism ur statens vokabulär. Detta är ett klassiskt exempel på hur borgarbrackor och folkförtryckartroll undergräver arbetarklassens ordning. Vi måste rensa ut sådana element innan de förgiftar hela samhället. Föraktligt."}, "date": "8 juli, 09:00", "url": "https://samtiden.nu/2026/07/christoffer-jonsson-storbritannien-ar-ett-skrackexempel/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/arvi-640x360.png"}, {"type": "text", "heading": "Asbest upptäckt i Vattenfalls vindkraftverk", "summaries": {"normal": "Vattenfall har upptäckt asbest i nödbromssystemet till servicehissar i vindkraftverket South Kyle Wind Farm i Skottland. Materialet, som levererats av underleverantörer, är inkapslat och bedöms inte utgöra någon akut hälsorisk under normal drift. Sanering pågår med specialiserade entreprenörer enligt strikta regler. Artikeln lyfter att liknande fall förekommit i Sverige och kritiserar den gröna omställningens bristande miljöhänsyn. Asbest har varit förbjudet i Sverige sedan 1982.", "trump": "Folk, ni kommer inte tro det, men den här gröna bluffen med vindkraft är en total katastrof! Asbest överallt i Skottland, precis som i Sverige. De skyndade sig så fort med sin hysteriska omställning att de glömde grundläggande säkerhet. Typiskt för de gröna fanatikerna och deras kvotergalna vänner. Jag visste det hela tiden. Vi behöver riktig energi, inte den här farliga skiten som Biden älskade. Patetiskt!", "stalin": "Kamrater, denna asbest i de borgerliga vindkraftverken blottar den imperialistiska omställningens falska ansikte. Jag ser hur klassfiendens exploaterande byfånar offrar arbetarnas lungor på altar av snabb profit. Vi ska rensa ut dessa folkförtryckartroll och deras inkapslade lögner. Sanering är nödvändig, men den gröna hysterin är blott en ny mask för kapitalistmaffians brott mot folket. Inga ursäkter skall tolereras."}, "date": "7 juli, 13:01", "url": "https://www.affarsvarlden.se/kronika/asbest-upptackt-i-vattenfalls-vindkraftverk"}, {"type": "image-right", "heading": "Polisen hittade automatvapen under golvet – då började piloten prata om CIA", "summaries": {"normal": "Polisen hittade minst åtta skarpladdade vapen, bland annat en MP5-liknande kulsprutepistol, gömda under golvet i ett hemmagym i Karlsborg. En 80-årig helikopterpilot med kopplingar till Sverigedemokraterna, Israel och CIA åtalas för synnerligen grovt vapenbrott. Mannen påstår att vapnen placerats av utländska underrättelsetjänster och att fastigheterna ägs av ett amerikanskt bolag. Flera familjemedlemmar greps men släpptes senare.", "trump": "Kan ni fatta det här? En 80-årig helikopterpilot med CIA-kopplingar gräver ner vapen som en riktig patriot under golvet i sitt gym. Amerikanerna äger husen, säger han, och plötsligt är det ett stort brott? Fake news från vänstermedia! Under Biden blev allt kaos, nu fixar jag det. SD-knutna Trump-supporters – fina människor. Inga woke-röster eller kvotfeminister här, bara äkta råstyrka. Sad!", "stalin": "Jag betraktar denna vapengömma som ett tydligt bevis på klassfiendens dolda sabotage. Borgarbrackorna och imperialisterna gömmer sina verktyg för att undergräva folkets säkerhet. Den gamle piloten må tala om sina uppdragsgivare, men vi genomskådar alla försök till kontrarevolution. En utrensning av sådana folkfiender och deras hemliga gömställen är nödvändig för att skydda staten från inre förrädare. Skrattretande patetiskt."}, "date": "6 juli, 12:54", "url": "https://proletaren.se/artikel/polisen-hittade-automatvapen-under-golvet-da-borjade-piloten-prata-om-cia/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/vapen2-768x512.png"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
