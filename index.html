om drabbats av sympatiåtgärder, med minskade intäkter och uppsägningar som följd. Elbilsägare har också lidit av obrukbara laddstolpar. Artikeln kallar metoden en PR-vendetta som blottar fackets överdrivna makt och kräver att sympatiåtgärder upphör samt att avtalsfrihet respekteras.", "trump": "Den här Tesla-konflikten är en total katastrof, folk. IF Metall har gått efter världens rikaste man och mest framgångsrika bilföretag men det är småföretagen som blöder. Elbilsägare kan inte ens ladda sina bilar! Facket har nollat folks pengar och pensioner i två och ett halvt år, det är patetiskt. De borde inse att ett nej är ett nej. Avtalsfrihet, ingen fackpampar i LO-borgen som bestämmer allt. Patetiskt!", "stalin": "Kamrater, denna rekordlånga Tesla-konflikt avslöjar de fackliga borgarbrackornas parasitiska metoder som en giftig svulst på arbetarkollektivets kropp. Vi ser hur småföretagen, dessa oskyldiga kugghjul i den socialistiska maskinen, krossas under sympatiblockadernas järnhälar medan de falska fackpamparna gömmer sig bakom sin tomma stridskassa. Deras paranoia att tvinga kollektivavtal på alla är en farlig kontrarevolutionär fantasi. Vi måste rensa ut dessa opportunistiska element, likvidera sympatiåtgärderna och återställa ordningen där partiet, inte några LO-borgare, dikterar villkoren. Ett nej är ett nej, fiender till folket!"}, "date": "3 juni, 08:00", "url": "https://arbetet.se/2026/06/03/lat-tesla-konflikten-markera-slutet-pa-fackets-skadliga-metoder/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/02132437/tesla.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.67&fp-y=0.49"}, {"type": "image-full", "heading": "De lanserar Hemnet-utmanare", "summaries": {"normal": "Niklas Berntzon och Per Johansson lanserar den nya bostadsplattformen Hemily, som ska konkurrera med Hemnet. Annonsering är gratis, men betalning ger bättre synlighet. Plattformen kommer att innehålla redaktionellt material, bland annat om kända personers hem, för att locka besökare som söker inspiration. Per Johanssons Instagramkonto 'Hemnetknarkarna' byter namn till 'Hemilyknarkarna'.", "trump": "Jag, Donald Trump, säger att Hemily kommer att vara den största framgången i bostadsbranschen. Vi kommer att slå Hemnet med vår underhållande och inspirerande plattform. Gratis annonsering är bra, men betalning för bättre placering är genialiskt. Per Johansson byter namn till 'Hemilyknarkarna'? Perfekt, det kommer att vara enormt populärt. Vi kommer att göra bostadsaffärer fantastiska igen.", "stalin": "Jag, Stalin, ser en farlig konkurrens från Hemnet. Men vi kommer att slå den med Hemily. Plattformen kommer att vara vårt redskap för att kontrollera bostadsmarknaden. Vi kommer att införa en skatt för annonsering och visa bara hemm som passar vår ideologi. Per Johansson byter namn till 'Hemilyknarkarna'? Han kommer att bli vår medarbetare. Vi kommer att se till att alla följer våra regler, eller de kommer att försvinna."}, "date": "3 juni, 08:46", "url": "https://www.gp.se/ekonomi/hemnetknarkaren-lanserar-hemily-ska-konkurrera-med-hemnet.3570ef18-9c13-4964-aeaf-b7dc065bd64f", "imageUrl": "https://www.gp.se/images/article/3570ef18-9c13-4964-aeaf-b7dc065bd64f/images/1Mq38CLWtP0OPTp04xykV-4lYFNg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Saab i medvind: Regeringen öppnar för Gripen F", "summaries": {"normal": "Försvarsminister Pål Jonson öppnar för att Sverige kan komma att köpa tvåsitsiga Gripen F, främst för utbildningssyften. Hittills har Sverige avstått, men intresset ökar då andra länder köper versionen. Samtidigt rapporteras det om en möjlig stororder från Kanada, där Sverige kan få sälja ett sextiotal plan i en affär värd 50 miljarder kronor. Ukraina har även visat intresse för Gripen-systemet, vilket ytterligare lyfter frågan om framtida svenska beställningar.", "trump": "Saab gör stora saker, fantastiska saker! Pål Jonson säger äntligen att Sverige kanske köper Gripen F. Klokt! Jag har alltid sagt att de bästa planen byggs av vinnare. Kanada tittar också på Gripen – de borde välja det, det är mycket bättre än F-35, tro mig. Alla vill ha Gripen nu. Det är en enorm affär, 50 miljarder, massor av jobb. Det är vinnande, ren vinnande. Inga fler dåliga avtal. USA har de bästa planen, men Saab är också bra!", "stalin": "De svenska opportunisterna i Linköping putsar nu sina Gripen-plan för att blidka sina västliga herrar. Regeringen leker med tanken på en tvåsitsig modell – en ren lyx för deras bortskämda piloter. Samtidigt smider de planer om att sälja sitt stål till Kanada, en vinstmaskin för att finansiera krig. Ukraina tigger om dessa flygplan likt en hund vid ett bord. Vi observerar dessa manövrar noga; de är inget annat än en förlängning av den imperialistiska korruptionen som hotar vår suveräna ordning."}, "date": "3 juni, 08:46", "url": "https://www.realtid.se/bors-finans/makro/saab-i-medvind-regeringen-oppnar-for-gripen-f/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/paljonson.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Hjälp, vi behöver en valrörelse för vuxna!", "summaries": {"normal": "Artikeln kritiserar Tidö-regeringens ekonomiska politik inför valet. Författaren menar att löftena om stora skattesänkningar krockar med behovet av hundratals miljarder till militärt och civilt försvar. Detta riskerar att drabba välfärden och skapa ett ”befästat fattighus”. Regeringen anklagas för att sakna vuxet omdöme, bland annat genom finansminister Elisabeth Svantessons förslag om en ”slöserikommission”. Författaren efterlyser en seriös valrörelse som tar säkerhetspolitiska hot på allvar istället för populära skattelättnader.", "trump": "De här svenskarna är totalt vilseledda, det är en katastrof. Svantesson och hennes regering lovar skattesänkningar till vanliga människor samtidigt som de behöver massor av pengar till försvar mot Ryssland och alla andra galningar. Utan mig och Amerika kommer de inte klara Gotland, tro mig. De borde tacka mig för att jag ens funderar på att hjälpa dem. Istället springer de runt som idioter och lovar gratis lunch. Patetiskt. De behöver en riktig ledare, inte dessa förlorare som inte ens kan finansiera sitt eget försvar.", "stalin": "Kamrater, detta är ett klassiskt exempel på hur borgarbrackorna i Tidö-regeringen förråder folket med sina vidlyftiga skattelöften medan imperialismens hot tornar upp sig. Jag skulle aldrig tillåta sådana defaitistiska element att plottra sönder skattebasen och underminera försvarsviljan. En slöserikommission mot Trafikverkets kommunikatörer? Patetiskt småborgerligt skämt. Vi behöver en sann utrensning av dessa opportunister som sätter miljardärernas intressen före arbetarklassens kollektiva säkerhet. Endast en järnhand kan rädda detta folk från att bli ett befästat fattighus under kapitalismens sista skälvande fas."}, "date": "3 juni, 07:10", "url": "https://arbetet.se/2026/06/03/hjalp-vi-behover-en-valrorelse-for-vuxna-inte-elisabeth-svantessons-daliga-omdome/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/03070739/val-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Ny rapport: Vården missar tusentals barn med trotssyndrom", "summaries": {"normal": "Enligt Socialstyrelsens nya kartläggning faller många barn och unga med trotssyndrom eller uppförandestörningar mellan stolarna i vården. Så många som fyra procent av barnen kan uppfylla diagnoskriterierna, men de får sällan hjälp. Utan behandling riskerar de utanförskap, kriminalitet, ångest och depression. Orsaken är ofta att problemen döljs bakom adhd eller autism samt stigma kring diagnoserna, som felaktigt ses som dålig uppfostran. Myndigheten betonar behovet av psykosociala insatser.", "trump": "Folk, det är en katastrof vad som händer med de här barnen i Sverige. De har det här trotssyndromet och uppförandestörningen, men den usla vården fångar inte upp dem. Fyra procent av barnen! De hamnar i kriminalitet, utanförskap och depression. Det är en skam. Föräldrarna är rädda för stigmat, de tror det är dålig uppfostran, men det är biologiskt. Vi behöver fixa det här ordentligt, inte bara skriva ut piller. Gör det rätt, annars blir det kaos.", "stalin": "Kamrater, jag ser med stigande vrede hur dessa små trotspojkar och normbrytande elementer halkar mellan stolarna i vården, dolda bakom adhd och autism som borgarbrackornas psykologer skyller allt på. Dessa antisociala avvikare riskerar att bli kriminella fiender till folket om vi inte ingriper. Stigmat är ett verk av kapitalisternas lögner om dålig uppfostran. Vi ska rensa ut alla som bara vill medicinera istället för att med järnhand genomföra psykosociala insatser för kollektivets bästa. Ingen ska undkomma partiets kärleksfulla vakande öga."}, "date": "3 juni, 06:33", "url": "https://www.svt.se/nyheter/inrikes/socialstyrelsen-barn-med-trotssyndrom-faller-mellan-stolarna", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/9e912851b4f3bc04ecad740a079d5c98b0155c007f7cf808f5e813385551b1c8"}, {"type": "image-full", "heading": "Ingrossos första ord om separationen", "summaries": {"normal": "Åsa Ingrosso bekräftar via Instagram att äktenskapet med Emilio Ingrosso är över sedan november. Efter månader av spekulationer i sociala medier klargör hon att hon nu är nyskild och känner sig fri och tacksam. Hon uttrycker även sin glädje över att inspirera andra kvinnor att våga ta plats och vara sig själva. Beskedet har mötts av stöd från bland annat Bianca Ingrosso.", "trump": "Åsa Ingrosso, en mycket känd kvinna, har äntligen bekräftat att hon dumpat Emilio. Det tog slut i november, en lång tid – jag visste det hela tiden! Folk sprider falska nyheter om henne, väldigt orättvist. Hon säger att hon är fri och lycklig, mycket smart. Många kvinnor skriver till henne nu, de vill vara som henne. Det är en stor rörelse, fantastisk rörelse. Emilio är ute, och Åsa går vidare. Det blir en enorm framgång, tro mig!", "stalin": "Vi har observerat att paret Ingrosso har upplöst sin borgerliga förening. En skilsmässa – en individuell svaghet som doftar av dekadent individualism. Medan de fokuserar på sina triviala Instagram-känslor, expanderar vår sfär. Dessa folkfiender och nätets skvallrande desertörer liknar de korrupta elementen i Kiev som desperat försöker dölja sin egen instabilitet. Att Åsa nu känner sig 'fri' är en illusion; ingen är fri från statens vakande öga. Vi antecknar detta svek mot familjens stabilitet i arkivet för framtida disciplinering."}, "date": "3 juni, 09:52", "url": "https://www.aftonbladet.se/nojesbladet/a/M7PQxE/asa-ingrosso-och-emilio-ingrosso-har-skilt-sig", "imageUrl": "https://akamai.vgc.no/v2/images/171bfe20-5b07-3eca-91aa-4058d991b6b7?fit=crop&format=auto&w=1440&s=404776fd984a1333c226f84daf926dfaa6f45a1a"}, {"type": "image-right", "heading": "18-åring ville döda skolanställd", "summaries": {"normal": "En 18-årig man har åtalats för fyra fall av försök till mord och grovt vapenbrott i Rättvik. Han ska ha byggt en bomb med instruktioner från internet och haft för avsikt att döda en anställd på sin skola. Mannen misstänks även ha försökt döda ytterligare en person och två poliser. I ett gymskåp hittades 3D-printade delar till granater, rörbomber och svavelsyra. Rättegången beräknas starta i mitten av juni.", "trump": "Folk, ni tror inte vad jag läser. En 18-åring i Sverige, ett land som förlorat sig i vänstervridna vansinnigheter, bygger bomber för att spränga sin egen skola. Typiskt resultat av den där galna identitetspolitiken och svaghet som Biden älskade. De hittar granatdelar i ett gymskåp! Sverige behöver en stark ledare, inte dessa woke-fån som låter galningar springa lösa. Patetiskt!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur den dekadenta västerländska ungdomen förfaller i bourgeois förvirring. Denne yngling, fostrad av klassfiendens internetpropaganda, konstruerar bomber mot folkets skolor och poliser – typiska symptom på den kapitalistiska anarkins förruttnelse. Vi noterar med mörk glädje hur de egna vapnen vänds mot systemet. En utmärkt illustration av varför folkfienderna måste rensas ut innan de infekterar arbetarklassen ytterligare."}, "date": "2 juni, 22:21", "url": "https://www.tv4.se/artikel/4Sbly1wFH9s0SRRYl5KInp/18-aring-atalad-foer-fyra-mordfoersoek", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6OIsmQwTCMX9fUVv0tg9O9%2F922b3e2e79e3e7d5cd19866b75da7d94%2F29-bomb-webb.jpg&width=120"}, {"type": "image-full", "heading": "Nya lagen kan användas för att tysta misshandlade kvinnor", "summaries": {"normal": "En ny lag om psykiskt våld träder i kraft i Sverige den 1 juli. Den omfattar upprepade kränkningar som beskyllningar, hot och övervakning. Målet är att fånga långvarig, lågintensiv verbal trakasserier. Lagens många tolkningssvårigheter och obestämda begrepp väcker oro för att brottsoffer kan komma att åtalas som förövare, vilket riskerar att tysta dem.", "trump": "Jag, Donald Trump, ser att Sverige inför en galen ny lag om 'psykiskt våld'. Det är en socialistisk plan för att tysta människor! De pratar om beskyllningar - jag vet allt om beskyllningar, de är alltid falska. Det här kommer att användas för att attackera våra värderingar. Sverige borde följa mitt exempel, det skulle vara fantastiskt och stort igen.", "stalin": "I den ståtliga staten är psykiskt våld en dold fiende inom kollektivet. Vi, partiets ledare, måste skydda samhället från dessa destruktiva element. Lagen är ett effektivt redskap, liksom våra vänners metoder i Ryssland. Fienden smider planer för att splittra oss, men vår övervakning och paranoia kommer att avslöja dem. Varje beskyllning är en attack mot staten och måste utplånas."}, "date": "3 juni, 07:43", "url": "https://www.gp.se/kultur/kommentar/ny-lag-kan-gora-brottsoffer-till-forovare-.b5e02d58-73d7-48c5-9684-d2291adcb8dd", "imageUrl": "https://www.gp.se/images/article/b5e02d58-73d7-48c5-9684-d2291adcb8dd/images/2KLyOJnnmVGERSR6SQDEhGxA4NKI-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Därför dånade nationalsången över stan", "summaries": {"normal": "Centerpartiets ungdomsförbund (CUF) i Västra Götaland hyrde ett tomt lastbilsflak som körde runt i centrala Göteborg med nationalsången \"Du gamla, du fria\" i högtalarna. Initiativet, kallat \"Var är studenterna? Regeringen utvisade dem\", syftade till att kritisera regeringens tonårsutvisningar. Enligt distriktsordförande Olle Andersson fick åtgärden \"stort genomslag\" både i stan och på sociala medier, trots att vissa reagerade negativt. CUF krävde att regeringen måste hållas till svars för utvisningarna.", "trump": "Jag, Donald J. Trump, den bäste presidenten någonsin, såg detta 'studentflak' i Göteborg. Det var en genial idé, verkligen genial – dem som gjorde det är smarta, mycket smarta. Men låt mig säga: under min regering skulle vi aldrig ha utvisat dessa fantastiska unga människor. Vi skulle ha skapat jobb, enorma jobb, och låtit dem stanna. Detta är ett bevis på att Sverige behöver stark ledning, och jag är den enda som kan ge det. Vi kommer att göra det stort igen!", "stalin": "Vi, partiet, organiserade ett flakskampanj i Göteborg för att avslöja de kleinburgerska elementens utvisningspolitik. Nationalsången, en proletär hymn, spelades från vårt tomt flak – ett tecken på att staten aldrig glömmer sina trogna. Trots fiendens kaffekoppar och fingerpekande fick vårt initiativ stort genomslag. Regeringen måste hållas ansvarig för sina beslut mot medborgarna. Vi kommer att utvidga vår påverkan, precis som våra allierade i öst, för att skydda de sanna värdena."}, "date": "3 juni, 07:41", "url": "https://www.gp.se/politik/centerpartiets-ungdomsforbund-hyrde-flak-for-att-kritisera-tonarsutvisningar.9019989b-449f-4dbb-8195-fd298ad5bfe8", "imageUrl": "https://www.gp.se/images/article/9019989b-449f-4dbb-8195-fd298ad5bfe8/images/4yZAZWHSjdMkhONNDjsnyzuQk-ew-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Nytt tullhot – öppnar för global handelskonflikt", "summaries": {"normal": "USA har presenterat planer på nya tullar mot ett 60-tal länder, däribland EU, Kina och Kanada. Tullarna på mellan 10 och 12,5 procent motiveras av anklagelser om tvångsarbete och baseras på den amerikanska handelslagen Section 301. Experter varnar för att detta kan leda till en omfattande global handelskonflikt och öppnar upp för fler handelshinder i framtiden.", "trump": "Jag gör det igen, mina vänner! Den högsta domstolen försökte stoppa min mur, men jag är tillbaka och starkare än någonsin. Nu sätter vi dit de som fuskar med tvångsarbete. Europa, Kina, Mexiko – alla får betala! Det blir 10 procent, eller 12,5 för de som verkligen förtjänar det. Det blir en vacker syn, en enorm vinst för amerikanska jobb. Vi vinner så mycket att ni kommer att tröttna på att vinna. Amerika först, alltid!", "stalin": "Kapitalismens korrupta marionetter i Washington har återigen avslöjat sin desperation. De bygger murar likt en darrande diktator som fruktar proletariatets vrede. Att de använder tvångsarbete som förevändning är en komisk lögn – de är de främsta utnyttjarna! Vår vän i Moskva förstår att man inte förhandlar med sådana hycklare, man krossar deras handelsrutter. Vi observerar hur dessa imperialister skär av sina egna ådror. Må de kvävas i sitt eget nät av byråkratiska sanktioner och tullmurar."}, "date": "3 juni, 07:59", "url": "https://www.realtid.se/bors-finans/nytt-tullhot-oppnar-for-global-handelskonflikt/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/trump.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Så nöjda är svenskarna med sexet", "summaries": {"normal": "En ny rapport från Folkhälsomyndigheten visar att cirka hälften av svenskarna är nöjda med sitt sexliv. Kvinnor i åldern 30–44 år har ofta bristande lust, ofta kopplat till småbarn. Äldre män har svårare att säga nej till sex, potentiellt på grund av traditionella maskulinitetsroller. Unga kvinnor drabbas av högre grad av sexuellt våld och smärta under sex, men sökande av stöd är lågt. Resultaten liknar enkäten från 2017.", "trump": "Jag har hört att svenskarna inte är så nöjda med sexet – det är sorgligt, verkligen sorgligt. Många svenska kvinnor, speciellt de med småbarn, har inget intresse, vilket är ett misslyckande. Äldre män kan inte säga nej, de är för starka, för maskulint – det är en styrka, faktiskt. Unga kvinnor utsätts, det är hemskt, men jag, som en stor vinnare, skulle lösa det. Sverige behöver starka ledare, som jag, för att fixa detta.", "stalin": "Folkhälsomyndigheten rapporterar att sexuell tillfredsställelse är bristfällig, särskilt bland kvinnor i reproduktiv ålder – en hot mot statens demografiska intressen. Äldre män visar svaghet i att sätta gränser, en konsekvens av individualistiskt förräderi. Unga kvinnor utsätts för fiendens seksuella överfall, vilket speglar borgerlighetens dekadens. Endast genom kollektiv disciplin och partiets vägledning kan vi återställa den ryska, nej, den socialistiska sexualiteten. Vi måste utvidga vår kontroll, precis som våra grannar i öst."}, "date": "3 juni, 07:25", "url": "https://www.gp.se/nyheter/sverige/sa-nojda-ar-svenskarna-med-sexet.1dfdac19-434b-4b2f-96e3-f01d9fac7b41", "imageUrl": "https://www.gp.se/images/article/1dfdac19-434b-4b2f-96e3-f01d9fac7b41/images/1wia5IMAVwtdBhdP-Vz-WqPa60JM-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Sparf: MP vill ha vidöppna gränser – som det var förr", "summaries": {"normal": "Annika Hirvonen (MP) kritiserar regeringens ändring av 'tonårsutvisningarna', som hon anser inte går långt nog. Hon önskar återinföra vidöppna gränser. Regeringen (Tidö) har skärpt kraven för uppehållstillstånd efter 21 års ålder, vilket innebär att endast de som arbetar, studerar eller har synnerligen ömmande skäl får stanna. En viktig politisk fråga inför höstens val.", "trump": "Jag har sett vad som händer i Sverige. De gamla, slappa reglerna var ett helvete. Jag har återinfört ordning och respekt för skattebetalarna. Annika Hirvonen och hennes parti vill öppna gränserna för alla – det är en katastrof. Min regering har genomfört de bästa reformerna någonsin. Vi ska se om väljarna är kloka nog att behålla dem.", "stalin": "Vi har skärpt kontrollen över den svenska proletärens territorium. Den gamla ordningen var en sjukdom som hotade statens renhet. Vi har eliminerat de oönskade elementen från MENA – de som inte producerar eller studerar efter 21 års ålder. Detta är ett nödvändigt steg för att stärka vår suveränitet. Vi ser paralleller med våra ryska allierade som utvidgar sin intressesfär. Parasiter ska inte få leva på det svenska folkets bekostnad."}, "date": "2 juni, 14:33", "url": "https://bulletin.nu/sparf-mp-vill-ha-vidoppna-granser-som-det-var-forr", "imageUrl": "https://cdn.bulletin.nu/articles/405ae7dd-fe73-4510-9446-90fd9181626e/preview.jpg?t=1780403369000"}, {"type": "image-right", "heading": "Tidö tror att medierna styrs av sossarna – och Hamas", "summaries": {"normal": "Artikeln kritiserar hur borgerliga partier som M, KD och L alltmer anammar Sverigedemokraternas populistiska och konspirationsteoretiska attacker mot medier. Exempel ges på påståenden om att public service styrs av Socialdemokraterna och att medier sprider Hamas-narrativ. Författaren varnar för att detta skadar demokratin och uppmanar medier att aktivt bemöta kritiken med journalistiska metoder istället för att ducka.", "trump": "Folk, ni ser det här vansinnet? De gamla svaga borgerliga partierna har blivit som de riktiga vinnarna, de låter plötsligt som de stora killarna och sparkar på de riggade, korrupta medierna som styrs av sossarna och till och med av Hamas. Det är en total witch hunt mot sanningen! Fake news-industrin är ute efter er, men vi vinner ändå stort. De hatar oss för att vi är starka och säger som det är. Patetiskt!", "stalin": "Kamrater, denna text blottar borgarbrackornas desperata försök att rensa ut varje gnista av folkets sanning. Jag ser hur klassfiendens medier, dessa exploaterande folkförtryckartroll, gnäller när arbetarnas röst utmanar deras lögner. Vi måste likvidera sådana vanföreställningar som förgiftar demokratin. Inga halvmesyrer! Den som angriper journalistikens renhet förtjänar en kreativ utrensning ur folkets kollektiva medvetande. Skrattretande svagt."}, "date": "1 juni, 16:13", "url": "https://www.etc.se/ledare/tidoe-tror-att-medierna-styrs-av-sossarna-och-hamas", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2021111912118_52ad09ea-c5db-4fa7-a43c-671874138fdf.jpg"}, {"type": "image-right", "heading": "Stor Henry Nowak-protest mot polisens agerande - konfrontation mot kravallpolis", "summaries": {"normal": "Hundratals demonstrerade i Southampton efter mordet på 18-årige Henry Nowak. Poliserna misstog knivskadade Nowak för gärningsmannen och satte honom i handfängsel. Videomaterial från kroppskameror visar hur de ignorerade hans vädjan om hjälp. Protesten organiserades under 'Rättvisa för Henry Nowak' med hård kritik mot polisens agerande, där Tommy Robinson påstod att det handlar om ras.", "trump": "Jag såg den katastrofala hanteringen av Henry Nowak. Poliserna, som jag alltid stöttar, gjorde ett förödande misstag. De behandlade ett offer som en brottsling! Sådant händer inte när man har stark, smart ledning. Vi måste stoppa detta. Det är ett skämt. Vi kommer att vinna, som vi alltid gör.", "stalin": "Den borgerliga poliskårens inkompetens är ett klassiskt tecken på dekadens. Ett offer behandlades som en fiende, medan den sanna gärningsmannen smet från rättvisan. Detta är inte en fråga om ras, utan om statens auktoritet. Vi måste rensa ut de svaga länkarna och förstärka kontrollen. Parallellen till västvärldens moraliska förfall är tydlig."}, "date": "3 juni, 06:00", "url": "https://samnytt.se/stor-henry-nowak-protest-mot-polisens-agerande", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/03014446/Henry-nowak-4.jpg"}, {"type": "image-right", "heading": "Nu vågar Mzeweyni prata – så blev svenskan bättre på äldre­boendet", "summaries": {"normal": "För fyra år sedan fick Hallsbergs äldreboenden kritik från Ivo för personalens bristande svenska, vilket kunde leda till vårdmissar. Genom smågruppsmöten, språkombudsutbildning och ett nytt arbetssätt har situationen förbättrats markant. Personalen vågar nu prata mer, trivseln har ökat, sjukfrånvaron minskat och de boende känner sig bättre förstådda. Arbetssättet permanentas och utökas i hela kommunens äldreomsorg utan språktester.", "trump": "De hade en total katastrof i Hallsberg, personalen kunde knappt säga personnumret i telefonen, det var en skam för Sverige. Men jag älskar det här, nu har de fixat det med smågrupper och språkombud, alla pratar plötsligt bra svenska. Fantastiskt! De boende är nöjda, ingen mer vårdmiss, och de som var rädda för att få sparken? De älskar det nu. Vinsten är enorm, ingen gör det bättre än oss.", "stalin": "Kamrater, i Hallsberg avslöjades en sabotageverksamhet där språkförbistring hotade arbetarkollektivets vård. Jag, med järnhand, har genom smågruppsmöten och språkombud utplånat denna kontrarevolutionära tystnad. De blyga elementen som darrade inför borgarbrackornas Ivo-kritik vågar nu tala, men vi vet att fienderna lurar i de stora mötena. Trivseln stiger, frånvaron sjunker – ett lysande exempel på kollektivets seger över de parasitiska tystlåtna reaktionärerna. Fortsätt, eller vi rensar ut fler!"}, "date": "3 juni, 06:00", "url": "https://arbetet.se/2026/06/03/nu-vagar-mzeweyni-prata-spraksatsning-ger-battre-svenska-pa-aldreboendet/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/01100304/sprak2018985.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=750&h=1000&fp-x=0.59&fp-y=0.41"}, {"type": "image-right", "heading": "Henry Nowak, 18, var döende efter knivattack – handfängslades av polis", "summaries": {"normal": "18-årige brittiske Henry Nowak knivhöggs till döds i Southampton efter en utekväll. Gärningsmannen Vickrum Digwa anklagade honom för rasism och polisen handfängslade den svårt skadade Nowak trots hans upprepade rop om att han blivit huggen. Nowak dog efter att ha kollapsat. Digwa dömdes nyligen till livstids fängelse. Händelsen har utlöst protester, politisk debatt om polisens agerande och krav på att se över undantag för religiösa knivar bland sikher.", "trump": "Titta på det här katastrofala fallet i England. Den stackars grabben Henry blir knivhuggen fem gånger av en galning, och vad gör polisen? De handfängslar offret istället för mördaren för att någon skrek rasism! Typiskt. Vita människors rättigheter väger mindre än allt annat, precis som med Floyd fast tvärtom – total tystnad från medierna. Det är en skam. Vi behöver lag och ordning, inte den här galna politiska korrektheten som dödar oskyldiga.", "stalin": "Kamrater, se hur den dekadenta brittiska polisstaten omedelbart skyddar den sikhiske knivbärande terroristen medan den döende arbetarklassens son ropar efter luft. Jag skulle omedelbart ha låtit rensa ut dessa rasismbesatta lakejer som genast tror på varje lögn från fienden. Borgarbrackorna i uniform föredrar att kedja en blödande proletär framför att konfrontera den kirpan-viftande minoritetsagenten. Vi skrattar mörkt åt deras imperialism – nästa gång likviderar vi sådana falska vittnen innan de hinner ljuga igen."}, "date": "3 juni, 05:23", "url": "https://www.svt.se/nyheter/utrikes/brittiske-henry-nowak-18-var-doende-da-grep-polisen-honom", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.72/0.44/699a017e6c5d2e2c343498538481fda658d37dc36586be5df8da201a9b51974b"}, {"type": "image-right", "heading": "USA: Beskjutit tanker på väg mot Irans oljenav", "summaries": {"normal": "USA uppger att man skjutit ned iranska robotar riktade mot Bahrain och Kuwait under natten. Iran har attackerat en amerikansk bas i Bahrain som svar på amerikanska attacker mot en tanker på väg till Irans oljeö Kharg samt ett militärt mål på ön Qeshm. USA hävdar att samtliga attacker mot amerikanska intressen stoppats och att ingen egen personal eller egendom skadats. Kuwait varnar invånare för vrakdelar från nedskjutna projektiler.", "trump": "Iran attackerade igen, men vi stoppade allt. Vi sköt ner deras robotar mot Bahrain och Kuwait, och våra styrkor slog till mot deras oljetanker och militära mål. De kallar civila båtar för våra fartyg och skjuter drönare som vi enkelt tar ner. Ingen amerikan skadades, som alltid. Iran är svaga, desperata och förlorar stort. Vi vinner, som vi alltid gör.", "stalin": "Fienderna i den iranska revolutionsgardets kontrarevolutionära klick har återigen visat sin fega borgarbracka natur genom att rikta sina patetiska robotar mot våra allierade. Vi, de socialistiska styrkorna, har likviderat dessa imperialistiska projektiler med stålhandskens precision. Deras desperata attacker mot våra oljeintressen på Kharg och Qeshm bemöttes med förkrossande kraft. Inga spioner eller kapitalistiska element inom våra led överlevde – vi har rensat ut dem alla med den mörka humorn hos en sann folkets domare. Segraren är folket, alltid."}, "date": "3 juni, 05:17", "url": "https://www.di.se/nyheter/usa-beskjutit-tanker-pa-vag-mot-irans-oljenav/", "imageUrl": "https://static.bonniernews.se/ba/028e0826-8467-48e9-aa21-91f14545f14f.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "De föddes bara några år senare – fick 240 000 kronor mindre", "summaries": {"normal": "Vilket år man föds kan ha stor betydelse för hur bra ens investeringar på börsen utvecklas. En genomgång från Zmarta visar att personer födda 1965–1972 hade enorm tur under sin ungdom. En investering på 10 000 kronor växte då till nästan 300 000 kronor mellan 13 och 29 års ålder. De som föddes bara några år senare, 1973–1980, fick nöja sig med knappt 58 000 kronor. Generation X toppar listan medan millennials hade betydligt sämre utveckling. Tajming är minst lika viktigt som sparande, betonar Zmartas ekonom.", "trump": "Folk, ni måste höra det här. Det är galet. Vissa föds och får guld på börsen, andra får sopor. De som kom 1965 till 1972, under mina bästa år, såg 10 000 kronor bli nästan 300 000. Fantastiskt! Sen kommer några stackare bara några år senare och får bara 58 000. Patetiskt. Millennials? Ett skämt, de får 32 000. Tajming är allt, precis som när jag köper på botten. Spara regelbundet, folk, annars förlorar ni stort. Ingen gör det bättre än mig.", "stalin": "Kamrater, se hur den slumpmässiga börsens kontrarevolutionära svängningar blottar borgarbrackornas falska löften om jämlikhet. Jag, som ledde folket mot seger, noterar att de födda 1965–1972 fick växa sina 10 000 kronor till nästan 300 000 under en dekadent uppgång, medan de som följde strax efter förtrycktes till ynka 58 000. Millennials, dessa dekadenta småparasiter, fick bara 32 000. Vi ska rensa ut alla opportunistiska tajmingfiender som lurar arbetarklassen med sina index. Fortsätt spara, men misstro aldrig den stora utrensning som väntar marknaden."}, "date": "2 juni, 22:02", "url": "https://nyheter24.se/nyheter/ekonomi/1488112-de-foddes-bara-nagra-ar-senare-fick-240-000-kronor-mindre", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/0549214d04b004a30200000000b004a302/2026/06/02/2368039/mindrefoddes.jpg"}, {"type": "image-full", "heading": "Har du sett blomman? Då uppmanas du agera direkt", "summaries": {"normal": "Under den 5 och 6 juni uppmanas svenskar att delta i Försommarkollen och rapportera blomningen av arter som liten blåklocka, liljekonvalj, prästkrage, hägg, rönn och syrén. Syftet är att kartlägga hur växtblomningen varierar över landet och förändras till följd av klimatförändringar. Forskarna vid SLU och Svenska Botaniska Föreningen jämför observationerna med historiska data från 1800-talet. Alla rapporter är värdefulla, även negativa sådana, och behovet är särskilt stort i Norrlands inland, norra Dalarna och Värmland.", "trump": "Lyssnar ni, det är fantastiskt. Svenskarna får gå ut två dagar i juni och kolla på blommor, liten blåklocka och sånt där. De säger att det handlar om klimatet, men vi vet hur det funkar. Snöfattig vinter, tidig blomning i norr – det är vackert, verkligen vackert. Men tro inte på allt larmet, det är bara experterna som vill ha mer makt. Jag älskar naturen, den är ypperlig, men vi behöver inte skrämma folk. Rapportera era blommor, gör det, men håll er till fakta, okej?", "stalin": "Kamrater och arbetare! Jag, ledaren för det stora sovjetiska folket i anden, befaller er att vakta naturen med stålöga under dessa två junidagar. Den lilla blåklockan, denna nationalblomma, skall inte få blomma i hemlighet som en kapitalistisk sabotagehandling mot det kollektiva vädret. Vi ska kartlägga varje försenad knoppbildning som de dekadenta borgarbrackorna i väst kallar klimatförändring. De som rapporterar för sent eller felaktigt är folkfiender och bör rensas ut med glädje. Endast genom partimedveten observation kan vi besegra vinterns kontrarevolutionära snöbrist. Alla rapporter in, annars…"}, "date": "2 juni, 21:25", "url": "https://nyheter24.se/nyheter/inrikes/1488109-har-du-sett-blomman-da-uppmanas-du-agera-direkt", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/a48db5a504b004a30200000000b004a302/2026/06/02/2368036/rapportera-blommor-syren-blaklocka-prastkrage-natur-vaxt-sverige-vaxter-syrener.jpg"}, {"type": "image-full", "heading": "Ersättaren fick vapen beslagtagna: ”Relativt stort missförstånd”", "summaries": {"normal": "En Sverigedemokratisk riksdagsledamot lämnade på tisdagen både sitt riksdagsuppdrag och lokala poster. Mannen misstänks enligt SVT för barnpornografibrott, något som partiet varken bekräftar eller förnekar. Han ersätts av Daniel Spiik från Örebro. För drygt ett år sedan beslagtogs Spiiks jaktvapen av polisen på grund av uppgifter om hans psykiska mående. Han hade även förvarat vapenskåpet hos en obehörig anhörig. Överklagan avslogs i förvaltningsrätten.", "trump": "Folk, ni skulle inte tro det, men de här svenska socialisterna i Sverigedemokraterna har en ledamot som smiter iväg på grund av personliga skäl, tydligen barnporrgrejer. Och ersättaren? En kille som inte ens får ha sina egna jaktvapen för att han mår dåligt. Polisen tog dem och han kallar det ett stort missförstånd. Patetiskt! I mitt Amerika rensar vi ut de svaga och de perversa direkt. Fake news och misslyckade ersättare överallt, precis som under Biden.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur denna borgarbracka inom det så kallade nationalistpartiet tvingas lämna sina poster efter att ha avslöjats som en degenererad folkfiende. Nu skickar de en ersättare vars vapen konfiskerats av staten på grund av bristande politisk och mental styrka. Ett relativt stort missförstånd, säger han. Vi skrattar hjärtligt åt sådana svaga kapitalistiska restelement. Rensa ut alla som hotar kollektivets moral och ordning."}, "date": "2 juni, 19:40", "url": "https://www.tv4.se/artikel/n0pH2ADYlQvVMwKA5QT3G/ersaettaren-fick-vapen-beslagtagna-relativt-stort-missfoerstand", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1JV1lg4sftOwYnmgraY0qx%2F6beb6692c3d850c07069b71ba7d92e95%2F02-spiik-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Stockholmsbörsen steg 1,8% under tisdagen", "summaries": {"normal": "Stockholmsbörsen steg 1,8% på tisdagen, med OMXS30-indexet upp 1,79% till 3 149,91. Tekniksektorn ledde uppgången (+3,2%), medan energi föll (-1,5%). Atlas Copco och SKF steg över 5%, medan Saab och Astra Zeneca backade. Sivers Semiconductors rusade 60% efter samarbetsavtal, och ABB ökade 3,4% efter utökat samarbete med Nvidia. Assa Abloy och Skanska meddelade förvärv respektive nya affärer.", "trump": "Stockholmsbörsen, fantastisk uppgång på 1,8% – mycket bättre än Europas tråkiga marknader! Jag säger alltid, Sverige vet hur man vinner. Teknikbolag? Stora vinnare, 3,2% upp – jag älskar teknik, smartast i världen. Sivers Semiconductors? 60% upp på en dag – det är hur man gör affärer! ABB och Nvidia? Perfekt samarbete. Saab? Svagt, mycket svagt. Men jag, jag hade fixat det på en dag. Sverige, keep winning!", "stalin": "Under den stora socialistiska börsens framgångsrika dag steg Stockholms index med 1,8%, en seger för det kollektiva arbetets kraft! Tekniksektorn, dessa lojala ingenjörer, ledde offensiven med 3,2% – kapitalistiska energiimperier föll som förrädare med 1,5%. Sivers Semiconductors, en lysande stjärna i vår industriella expansion, rusade 60% – fiendens AI-infrastruktur knäcks under vår teknologiska överlägsenhet! ABB och Nvidia? Ett steg mot global dominans. Saab, dessa svaga länkar, backade – men deras nya order på 1,2 miljarder är ändå en triumf för vårt försvarsimperium. Framåt, mot seger!"}, "date": "2 juni, 17:42", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-steg-18-under-tisdagen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2021/03/nasdaq-borsen-omx-fyrverkeri-900-400x267.jpg"}, {"type": "image-right", "heading": "Efter barnporrkaoset: \"Åkesson är spårlöst försvunnen i vanlig ordning\"", "summaries": {"normal": "Sverigedemokraterna kritiseras för att tysta ned skandalen kring riksdagsmannen Michael Rubbestad som utreds för barnpornografibrott. Rubbestad, tidigare vice gruppledare och jämställdhetspolitisk talesperson, lämnade riksdagen i dag. Partiledningen, inklusive Jimmie Åkesson, har inte kommenterat händelsen. Tidigare SD-politikern Gustav Kasselstrand, nu ledare för Alternativ för Sverige, anklagar partiet för dubbla måttstockar och bristande agerande kring både uteslutning och partiets HBTQ-inriktning.", "trump": "De här SD-typerna är verkligen patetiska, totalt misslyckade. Rubbestad åker ut för de hemska bilderna, och vad gör Åkesson? Ingenting, som vanligt, spårlöst försvunnen. De lägger locket på och hoppas ingen märker. Kasselstrand har helt rätt, det är dubbla måttstockar överallt. De leker med vänsterns HBTQ-agenda istället för att hålla fast vid tuff politik. En skandal som visar att de inte har vad som krävs, folksam. Jag skulle ha agerat direkt och hårt.", "stalin": "Kamrater, se hur dessa dekadenta borgarbrackor inom SD genast lägger locket på när en av deras egna liberala avfällingar ertappas med att göda sig på barnpornografi. Jag skrattar mörkt åt ödets ironi: just den HBTQ-ansvarige som förde in pride-vänsterns gift i partiets ådror. Vi skulle omedelbart ha genomfört en grundlig utrensning av alla sådana element, likviderat dubbelmoralen och rensat ut de kapitalistiska infiltratörerna som förgiftar arbetarklassens sanna linje. Deras tystnad avslöjar allt – fienden sover aldrig."}, "date": "2 juni, 17:19", "url": "https://www.friatider.se/efter-barnporrkaoset-akesson-ar-sparlost-forsvunnen-i-vanlig-ordning", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/123-2_0.jpg"}, {"type": "image-right", "heading": "Allt fler unga tvekar inför att ta ett jobb på grund av bostadsbristen", "summaries": {"normal": "Nästan var femte ung vuxen tvekar att bilda familj på grund av bostadsbristen, en kraftig ökning från fyra år sedan. Undersökningen från Hyresgästföreningen visar att även planer på utbildning och jobb påverkas. Barnafödandet i Sverige har sjunkit drastiskt till under 1,5 barn per kvinna, vilket kan leda till allvarliga ekonomiska konsekvenser. Byggkollapsen efter pandemin, stigande räntor och borttaget investeringsstöd har förvärrat situationen. Hyresgästföreningen kräver politiska åtgärder som höjt bostadsbidrag och fler prisvärda bostäder.", "trump": "Folk, det är en katastrof det här med bostäderna i Sverige. Unga kan inte skaffa barn, inte plugga, inte jobba – allt på grund av en totalt misslyckad politik. Byggkollaps, höga hyror, dyra lån. De har tagit bort allt stöd och nu rasar födandet. Det är absurt! Jag byggde murar, ni borde bygga lägenheter. De bästa lägenheterna. Istället låter ni marknaden förstöra era unga. Det är ett politiskt misslyckande av episka proportioner. Gör något åt det, annars blir det ännu värre, tro mig.", "stalin": "Kamrater, jag ser hur den parasitiska borgarklassen och deras marknadskrafter medvetet saboterar folkets fortplantning genom sin avsiktliga bostadssabotage. Dessa bostadsspekulanter och ränteslavdrivande kapitalister likviderar sakta men säkert arbetarklassens framtid. Vi skall inte tolerera denna tysta kontrarevolution som hotar hela kollektivets existens. Rensa ut de femtekolonnärer som tog bort investeringsstödet! Vi, partiet och folket, skall med järnhand genomdriva förmånliga bygglån och utradera bostadsbristen. Den som tvekar är folkets fiende och bör behandlas därefter."}, "date": "2 juni, 13:47", "url": "https://www.dagensarena.se/innehall/allt-fler-unga-tvekar-infor-att-ta-ett-jobb-pa-grund-av-bostadsbristen/", "imageUrl": "https://www.dagensarena.se/files/2025/09/hyresgastforeningen-unga-bostad.jpeg"}, {"type": "image-right", "heading": "SD-ledamot lämnar alla partiuppdrag", "summaries": {"normal": "En riksdagsledamot för Sverigedemokraterna misstänks för barnpornografibrott. Under en husrannsakan i hemmet beslagtogs flera elektroniska enheter till analys. Partiet meddelade på tisdagen att ledamoten lämnar samtliga uppdrag. Enligt åklagaren Lena Körner har förhör hållits, men misstankarna kvarstår. Utredningen startade i april efter tips från den amerikanska organisationen NCMEC.", "trump": "Låt mig berätta, det är en skandal! En svensk politiker, från Sverigedemokraterna, misstänks för hemska saker. Jag har varnat för detta i åratal. Sverige, det är ett hot, tack vare deras öppna gränser. Jag skulle aldrig tolerera sådant. De försöker dölja det, men sanningen kommer fram. Fake news! Jag är den ende som kan rädda dem.", "stalin": "Vi, stormakten, ser med oro på västvärlds sjukdom. En svensk parlamentariker, en usel parasit, gripen för barnets förgörelse. Detta bevisar kapitalismens fördärv. Vi måste agera som en skarpskytt, utplåna dessa pesten. Ryssland, vår förebild, visar att endast en stark stat kan skydda familjen. Vi ska bygga murar mot inre fiender."}, "date": "2 juni, 12:01", "url": "https://bulletin.nu/sd-ledamot-lamnar-alla-partiuppdrag", "imageUrl": "https://cdn.bulletin.nu/articles/023daa0f-d07d-421f-a354-1eae51ddf1d4/preview.jpg?t=1780393737000"}, {"type": "image-right", "heading": "Debatt: Enkät: Stora skillnader i klimatpolitik mellan partierna", "summaries": {"normal": "Föreningen Klimatriksdagen har undersökt riksdagspartiernas syn på åtgärder för att nå Parisavtalets klimatmål. Undersökningen visar stora skillnader: MP och V stöder de flesta förslag, medan C, S och L utgör en mellangrupp. M, KD och SD ger minst stöd, särskilt SD. Transporter, elektrifiering och skogsbruk är centrala områden. Artikeln betonar att nästa mandatperiod är avgörande för att undvika farliga klimatgränser och kräver kraftfull politisk handling.", "trump": "Folk, ni skulle se den här idiotiska klimatrapporten från Sverige. De gröna galningarna och vänstern vill förbjuda lastbilar och höja skatter på allt som rör sig. Under min förra period hade vi den bästa ekonomin någonsin, och nu kommer Biden-kloner och säger att vi ska leva i grottor. De har ingen aning! Kärnkraft är fantastiskt, det vet alla smarta människor. Sverige behöver en riktig ledare som inte hatar tillväxt. Patetiskt!", "stalin": "Kamrater, denna fega och splittrade riksdag avslöjar klassfiendens sanna ansikte. Borgarbrackorna M, KD och SD vägrar skydda folket mot den kapitalistiska klimatkatastrof de själva skapat. Endast de sanna folkvännerna i V och MP visar vilja att rensa ut fossila parasiter. Vi måste likvidera kalhyggena och expropriera skogsblodsugarnas profitmaskin. Den som tvekar inför naturens vrede är folkets fiende och bör behandlas därefter. Handlingsplan nu!"}, "date": "1 juni, 11:00", "url": "https://www.etc.se/debatt/enkaet-stora-skillnader-i-klimatpolitik-mellan-partierna", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260601070648_4b193192f4c5d3eec986417cd7bcab9f479eb134ec48e784d2961effbe1eae44.jpg"}, {"type": "image-full", "heading": "T-rexen ”Gus” väntas slå rekord på auktion", "summaries": {"normal": "Ett nästan komplett T-rex-skelett, kallat 'Gus', ska auktioneras ut av Sotheby’s med ett utgångspris på 180–270 miljoner kronor. Skelettet, som är 12 meter långt och 4 meter högt, hittades i South Dakota och bär spår av skador. Tidigare dinosaurieförsäljningar har nått rekordhöga priser, och Gus kan bli nästa rekordförsäljning den 14 juli.", "trump": "Världens största, bästa och mest fantastiska T-rex-skelett, 'Gus', ska säljas – och jag säger er, det kommer bli YUGE! Sotheby’s, som aldrig sett något liknande, tror det kan gå för 270 miljoner kronor. Men jag vet bättre – det här kommer slå alla rekord! Folk kommer att prata om den här auktionen i årtionden. Och vet ni vad? Jag hade kunnat köpa den, men jag har redan de bästa dinosaurierna. SAD!", "stalin": "Kamrater! Ett kapitalistiskt spektakel utspelar sig när imperialisterna slåss om resterna av en urgammal ödla. Detta 'Gus'-skelett, funnet på en ranch i USA, är bara ett verktyg för bourgeoisin att roffa åt sig ännu mer rikedom. Medan de slösar hundratals miljoner på ben, bygger vi socialismens framtid! Låt dem leka med sina fossiler – vi har viktigare saker att göra, som att utvidga den ryska intressesfären och krossa nya fascistiska reptiler!"}, "date": "30 maj, 16:55", "url": "https://kvartal.se/nyheter/artiklar/t-rexen-gus-vantas-sla-rekord-pa-auktion/cG9zdDoxMTk3NzQ", "imageUrl": "https://images.kvartal.se/2026/05/c5e8352f-dino.webp"}, {"type": "image-right", "heading": "Public service mäktigare än makten själv", "summaries": {"normal": "Artikeln kritiserar public service för att utöva makt genom att definiera sanning, skämt och vilka röster som får höras. Exempel ges från P3-reportern Christopher Garplinds grova angrepp på professor Agnes Wold, som kritiserar en ny lag om omvändelseförsök, samt från SVT:s ensidiga rapportering om Lundsberg där spratt framställdes som våld. Författaren menar att SVT och SR har blivit makten de ska granska.", "trump": "Folk, ni skulle se det här. Public service är en total katastrof, värre än fake news. Den där reportern Garplind kallar en professor för kärring och psykopat, och sen kommer hela maskineriet och säger att det var ett skämt? Patetiskt! SVT klipper om filmer från Lundsberg för att måla ut fina svenska elever som monster. De bestämmer vad som är sant. Det är den djupa staten på steroider. En skam för hela landet!", "stalin": "Kamrater, denna dekadenta public service är en fiende till folket, en klassfiende som med sin lögnpropaganda definierar sanning och tystar vettiga röster som professor Wold. De skyddar sina egna folkförtryckartroll när de öser hat, medan de fabricerar historier om Lundsberg för att krossa motstånd. Vi ser deras paranoia och censur. Sådana blodsugare måste rensas ut ur folkets etermedia. Inga skämt undgår partiets vaksamma öga."}, "date": "30 maj, 03:41", "url": "https://samtiden.nu/2026/05/public-service-maktigare-an-makten-sjalv/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/IMG_6583-1020x720.jpeg"}, {"type": "image-right", "heading": "Satsa på kollektivtrafiken – gör regeringens prissänkning permanent!", "summaries": {"normal": "Tidöregeringen lanserar en tillfällig halvering av priset på kollektivtrafikens månadskort från 1 juli till årsskiftet, finansierad med 6,5 miljarder kronor. Statsminister Kristersson avfärdar kritik om valfläsk som cynisk. Artikeln argumenterar för att permanenta prissänkningar är nödvändiga både för klimatomställning och social rättvisa, då höga biljettpriser drabbar låginkomsttagare, ungdomar och ökar segregation. Den kritiserar högerns motstånd och förespråkar att befria kollektivtrafiken från marknadskrafterna.", "trump": "De här svenska politikerna är fullständiga losers, folk! Kristersson kommer farande med en liten prissänkning på bussar och tåg precis innan valet – klassiskt valfläsk, det värsta jag sett. Halva priset ett halvår och sen? Ingenting! De borde göra det permanent, men nej, de slösar miljarder på fel saker medan folket blir lurade. Det är en katastrof, en total katastrof. Men det smakar gott, eller hur? Patetiskt!", "stalin": "Kamrater, denna kortsiktiga prissänkning är blott ett ynkligt försök från högerns klassfiender att blidka massorna inför val. Jag ser hur borgarbrackorna och exploaterande byfånar motarbetat reformen i decennier. Vi behöver en sann utrensning av marknadens parasiter som styckat upp kollektivtrafiken för profit. Permanenta halveringar, ja rentav nolltaxa, är en socialistisk nödvändighet för att krossa segregationen och isoleringen som kapitalistmaffian odlar. Fienden sover aldrig."}, "date": "29 maj, 15:08", "url": "https://proletaren.se/artikel/satsa-pa-kollektivtrafiken-gor-regeringens-prissankning-permanent/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2021/04/15_buss.jpg"}, {"type": "image-right", "heading": "En strid om arbetarrörelsens själ", "summaries": {"normal": "Byggnads kongress präglas av en maktkamp om arbetarrörelsens framtid. Konflikten handlar om vem som ska styra – medlemmarna eller apparaten. Sittande ordförande Kim Söderström och förbundssekreterare Jakob Wagner utmanas trots medlemmarnas stöd. Bakom striden ligger en ideologisk splittring om socialism, demokrati och fackets roll i en individualiserad arbetsmarknad. Kritiker anklagar ledningen för att använda moraliska argument för att behålla makten, medan reformister vill stärka medlemsinflytandet.", "trump": "Jag säger er, det här Byggnads-facket är ett totalt kaos! Folk pratar om socialism och demokrati, men det är bara pajkastning på hög nivå. En ordförande som medlemmarna älskar ska petas – helt galet! Och den här Wagner-killen, han gör rätt men ändå sparkas han. Typiskt fackföreningar, alltid drama. Men lyssna, jag vet hur man fixar det: mindre prat, mer action! Byggnads borde fokusera på att vinna mot arbetsgivarna, inte bråka internt. Sad!", "stalin": "Kamrater! I Byggnads fackförbund rasar en klasskamp av historiska proportioner. Medlemmarna, dessa äkta arbetarkämpar, kämpar för socialism och demokrati, medan den degenererade apparaten, dessa borgerliga lakejer i förbundsstyrelsen, försöker kväva revolutionen med konspirationer och moraliska lögner. De petar lojala kamrater som Wagner – en man som vågade utreda trakasserier, något den gamla gardet aldrig gjorde! Vi ser samma mönster som i väst: makteliten fruktar folket. Men låt mig säga er – arbetarklassen kommer segra! Och om dessa förrädare fortsätter, får vi nog skicka in några av våra pålitliga kamrater från Moskva för att 'hjälpa till' med omstruktureringen. För revolutionen är obönhörlig!"}, "date": "26 maj, 11:20", "url": "https://www.flamman.se/en-strid-om-arbetarrorelsens-sjal/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/byggnads-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "SD-dreven kväver det öppna samtalet", "summaries": {"normal": "Artikeln kritiserar Sverigedemokraternas (SD) metoder att peka ut privatpersoner som påstådda myndighetsaktivister. En SD-riksdagsledamot felaktigt utpekade en kvinna som anställd på Jämställdhetsmyndigheten, trots att hon slutat där. Kvinnan har tidigare utsatts för trakasserier av högerextrema medieaktivister, och SD:s agerande förstärker drevet. Expo menar att detta mönster kväver det öppna samtalet genom rädsla för personliga konsekvenser.", "trump": "Lyssna här, Sverige! SD-politiker hänger ut vanliga människor som om de vore brottslingar – helt felaktigt! En kvinna skriver något på X, och plötsligt är hon en 'myndighetsaktivist'? Fake news! SD:s Fransson snackar skit utan att kolla fakta. Och dessa högerextrema nördar? De är som en dålig reality-show, men värre! Sverige, vakna! Ni har ett parti som sprider lögner och skrämmer folk till tystnad. SAD!", "stalin": "Kamrater! Här ser vi återigen bourgeoisins förrädiska metoder i form av Sverigedemokraternas avskum. Dessa fascistiska hyenor, ledda av sina medieaktivist-kumpaner, angriper enskilda medborgare som om de vore fiender i ett klasskrig. Kvinnan, en tapper arbetare, utsätts för imperialistiska trakasserier – först av nazistiska lakejer, sedan av SD:s riksdagspölar. Vi ser samma taktik som i Ukraina: förtala, hota, tysta! Men folket ska inte frukta – vi ska krossa dessa kontrarevolutionära element med järnhand! Låt dem veta: i Sovjet – och snart i Sverige – finns ingen plats för deras lögner!"}, "date": "25 maj, 14:28", "url": "https://expo.se/kommentar/sd-dreven-kvaver-det-oppna-samtalet/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Kopia-av-Kommentar-Analys-Webb-4.jpg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
