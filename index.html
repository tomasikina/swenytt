la utom de rika eliterna. Precis som under Biden-tiden! Om ni röstar in de svenska sossarna kommer era priser att explodera värre än någonsin. Det är vad vänsterns galna politik gör. Amerika har sett det förut, tro mig, det slutar alltid i kaos och tomma plånböcker. Fantastiskt exempel, verkligen ynkligt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur de norska klassfienderna genom sina egna socialdemokratiska lakejer redan demonstrerar det oundvikliga resultatet av borgarbrackornas fega kompromisser med folket. Skatter, dyrare mat och bensin är blott förspelet till den stora utrensningen av exploaterande byfånar. Den som längtar efter sådana svunna tider må genast resa dit, om de inte likvideras av sin egen inflation först. Paranoia? Nej, blott historisk nödvändighet mot folkfienderna."}, "date": "12 juli, 08:29", "url": "https://samtiden.nu/2026/07/norge-ger-forsmak-pa-kommande-sossepriser", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/Syttende-mai-firas-i-Norge-SVT-Nyheter.png"}, {"type": "image-right", "heading": "Experten varnar för semesterlån – kan leda till skuldspiral", "summaries": {"normal": "Allt fler svenskar har inte råd med semester och var tionde överväger att ta ett konsumtionslån för att finansiera resan. Finansinspektionens Moa Langemark varnar för att sådana lån lätt leder till överskuldsättning, skuldspiraler och både ekonomisk och psykisk ruin. Semesterfattigdomen ökar enligt SCB, samtidigt som tillgångarna är extremt ojämnt fördelade. Hon uppmanar till öppna samtal om privatekonomi inom familjer och bland föräldrar för att undvika ekonomisk hets och exkludering.", "trump": "Det är en total katastrof, folk! Svenskarna är så fattiga att de måste låna pengar för att åka på semester – kan ni fatta? De kallar det semesterlån, men det är bara ett sätt för bankerna att knäcka dem totalt. Ekonomi i spillror, skuldspiraler, psykisk smärta. Underbart ledarskap va? Fem procent äger halva landet medan resten tigger om lån. Patetiskt! Prata med barnen, sätt gränser – annars blir det bara ännu fler förlorare. Så sorgligt.", "stalin": "Kamrater, detta är en klassisk sabotagehandling från borgarbrackorna som lockar arbetarna in i skuldspiralens famn med sina så kallade semesterlån. Jag ser hur kapitalisterna planerar att krossa folkets ekonomi medan fem procent av parasiterna äger halva riket. Överskuldsättning är en fiende till kollektivet, en dold kontrarevolutionär kraft som måste rensas ut innan den likviderar självaste arbetarklassen. Vi ska prata öppet om dessa faror, likvidera den osunda hetsen och bygga en järnhård gräns mot alla dekadenta konsumtionsfiender. Paranoia? Nej, verklighet."}, "date": "13 juli, 14:09", "url": "https://arbetet.se/2026/07/13/experten-varnar-for-semesterlan-ekonomin-slas-i-spillror", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/13140313/semesterskuld-deladbild.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Iran stänger Hormuzsundet", "summaries": {"normal": "USA genomförde attacker mot iranska militära mål efter att ett handelsfartyg beskjutits av iranska styrkor i Hormuzsundet. Iran stängde sundet och varnade för ytterligare motangrepp. USA:s tredje attack på en vecka riktades mot robotanläggningar och kommunikationsnät. Iran anklagar USA för olaglig inblandning, medan USA hävdar att Iran brutit mot avtal om sjöfartssäkerhet. Flera arabländer rapporterade avvärjda robot- och drönarattacker.", "trump": "Iran skjuter på våra fartyg – vad är det för galenskap? Jag svarade med SÅ mycket kraft, de kommer inte veta vad som träffade dem! 140 mål, pang pang pang! Pete Hegseth sa det perfekt: Iran gjorde ett DÅLIGT val. Nu får de betala. Och visst, de stänger sundet – som om det skulle skrämma oss. USA är starkast, bäst, och ingen leker med oss. Iran, ni är varnade!", "stalin": "De amerikanska imperialisterna, dessa bleka hyenor i kostym, provocerar återigen fredsälskande nationer! Våra iranska bröder försvarar sitt sund mot deras olagliga intrång – ett sund vi naturligtvis kommer att stödja med alla medel. 140 av deras militära leksaker förstörda? En blygsam början. Låt dem skicka sina drönare – vi har redan kartlagt varje bas från Oman till Jordanien. Och när deras flotta gråter i Hormuzsundet, minns: historiens domstol har redan avkunnat sin dom över USA."}, "date": "12 juli, 07:11", "url": "https://kvartal.se/nyheter/artiklar/usa-slar-till-mot-iran-efter-attack-i-hormuzsundet/cG9zdDoxNDUwMTQ", "imageUrl": "https://images.kvartal.se/2026/05/c35fd179-iranhormuz.webp"}, {"type": "image-right", "heading": "Nytt besked från USA: Hormuzsundet öppet igen", "summaries": {"normal": "USA:s militärkommando Centcom meddelar att Hormuzsundet är öppet och trafiken flyter fritt. Iran har tidigare hävdat att sundet stängts efter att ett fartyg stoppats. USA har genomfört attacker mot iranska mål som svar på händelserna. Iran har svarat med attacker mot flera grannländer där drönare och robotar skjutits ned. Tre personer, varav ett barn, skadades i Qatar. Ett fartyg till ska ha träffats i sundet och en indisk sjöman saknas.", "trump": "Hörni, det här är precis vad jag sa. Iran försökte stänga Hormuzsundet som de trodde de ägde, men vi öppnade det på nolltid. Våra killar slog till mot 140 mål och nu flyter trafiken igen. De fick betala priset, precis som jag varnade. Den persiska galningen och hans revolutionsgarde är patetiska förlorare. Biden skulle ha gett dem blommor, men nu är det slut på det skojet. Amerika är tillbaka, starkare än någonsin.", "stalin": "Kamrater, de imperialistiska blodsugarna från Washington försöker återigen diktera villkoren i Hormuzsundet med sina bombplan och hot. Men vi vet att klassfiendens aggression bara avslöjar deras svaghet. Jag har beordrat att alla som sprider iransk propaganda omedelbart ska rensas ut ur partiet. Dessa överklass-slynglar tror de kan stänga sundet som en lek. Deras så kallade attacker är bara desperata skrik från döende kapitalistmaffian. Sovjetunionen ler i triumf."}, "date": "12 juli, 17:30", "url": "https://www.tv4.se/artikel/3jnZuw7XHrNk1iQpwAFhAF/nya-beskedet-fran-usa-hormuzsundet-oeppet-igen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FJ7qjAe60VtXDPrMf5RcEt%2Fd3c64531b64c75325885e86d6f2ca56b%2F12-hoemuz.jpg&width=120"}, {"type": "image-right", "heading": "USA: Hormuzsundet är öppet igen. ”Amerikanska styrkor är positionerade”", "summaries": {"normal": "USA:s militärkommando Centcom meddelar att Hormuzsundet är öppet och trafiken flyter normalt, trots Irans revolutionsgardes påståenden om stängning. USA har genomfört attacker mot iranska mål efter att ett fartyg skadats. Iran har svarat med drönar- och robotattacker mot flera grannländer, där splitter skadat civila. Oman fördömer attackerna, och en indisk sjöman saknas. President Trump uppger att USA slog till hårt mot 140 militära mål.", "trump": "Hörni, det var fullständigt kaos i Hormuzsundet men vi fixade det. Iran stängde sundet som några riktiga förlorare, attackerade ett fartyg med drönare och trodde de kunde hota oss. Vi slog till mot 140 av deras militära mål, väldigt hårt, och nu flyter trafiken igen. De gav upp en perfekt deal och började kriga istället. Patetiskt. Iran kontrollerar ingenting, vi gör det. Amerika vinner igen, tro mig.", "stalin": "Kamrater, dessa iranska avvikare och västerländska sjörövare har återigen avslöjat sin förrädiska natur genom att stänga Hormuzsundet som en desperat kapitalistisk blockad mot det fria flödet av revolutionär handel. Jag har beordrat att de amerikanska imperialisterna och deras lakejer i Bahrain, Kuwait och Qatar ska möta vårt stål med full kraft. Vi ska rensa ut alla borgarbrackor som utmanar arbetarklassens sund. En indisk sjöman saknas? Typiskt att de offrar sina egna i sina konspirationer. Verkligheten knackar, men det är vi som håller i hammaren. Ingen undkommer utrensningen av svekfulla element."}, "date": "12 juli, 16:48", "url": "https://www.di.se/nyheter/usa-hormuzsundet-ar-oppet-igen/", "imageUrl": "https://static.bonniernews.se/ba/a89bdc40-4ba1-4705-8380-9b96548aeacf.jpg?crop=6000%2C3000%2Cx0%2Cy500&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Al-Sahlani (C) polisanmäler dansk kollega för hets mot folkgrupp", "summaries": {"normal": "EU-parlamentarikern Abir Al-Sahlani (C) har polisanmält danske kollegan Kristoffer Storm för hets mot folkgrupp efter att han kommenterat ”åk hem” på ett klipp där hon kritiserade högernationalisternas jubel under omröstningen om hårdare utvisningsregler. Flera ledamöter från vänster och mitten fördömde scenerna som extremhögerns fascism, medan SD:s Charlie Weimers försvarade jublet som glädje över att migrationsfrågan äntligen tas på allvar. Talman Roberta Metsola har kritiserat händelsen och lovat åtgärder. Storm och finländske Sebastian Tynkkynen avvisar anklagelserna.", "trump": "De där galningarna i EU-parlamentet, totalt vansinne! Den här kvinnan Al-Sahlani blir upprörd när folk äntligen firar att de skickar migranterna hem, precis som vi borde göra. Och så polisanmäler hon en dansk kille för att han säger ”åk hem”? Patetiskt! De jublade för att de äntligen får ordning på kaoset efter åratal av misslyckad politik. Fake outrage och politiskt korrekthet på högsta nivå. Vi gör det mycket bättre här hemma, tro mig.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur de dekadenta borgarbrackorna inom EU-parlamentet äntligen blottar sina fascistiska tänder i ett spontant utbrott av klasshat mot de rotlösa elementen. När arbetarklassens intressen kräver att de främmande elementen sänds tillbaka till sina hålor, utbryter dessa högeravvikare i ett hysteriskt jubel som avslöjar deras sanna kontrarevolutionära natur. Den iranska agenten Al-Sahlani polisanmäler nu en sann kamrat för att han uppmanar henne att återvända till sin spioncentral. Utmärkt! Vi ska rensa ut alla sådana parasitiska element, likvidera deras inflytande och med mörk glädje se hur de kryper inför folkets domstol. Det är en hal backe mot folkets seger, eller hur, mina kära förrädare?"}, "date": "13 juli, 14:04", "url": "https://bulletin.nu/al-sahlani-c-polisanmaler-dansk-kollega-for-hets-mot-folkgrupp", "imageUrl": "https://cdn.bulletin.nu/articles/98499119-2667-4088-833c-59dc435d0ea6/preview.jpg?t=1783944135000"}, {"type": "image-right", "heading": "Experten: ”USA har inte tålamodet och Iran har blivit kaxigt”", "summaries": {"normal": "Mellanösternanalytikern Alexander Atarodi beskriver hur förhandlingarna mellan USA och Iran har fastnat i djupa motsättningar, ökad misstro och hård retorik. Iran har stängt Hormuzsundet efter nattens attacker. Atarodi pekar ut tre möjliga vägar framåt: förbättrad diplomati med sanktionslättnader, fortsatt status quo med risk för nya attacker, eller ett fullskaligt krig med allvarliga konsekvenser för världsekonomin. Han ser status quo som det mest sannolika scenariot.", "trump": "Iran har blivit helt galna och kaxiga, precis som under den svaga Biden-eran när jag inte var president. Vi har inte tålamod för deras dumheter längre. De stänger Hormuzsundet och tror sig vara tuffa, men det slutar illa för dem. Jag skulle fixa det på en vecka med riktig diplomati, inte den woke-svaga linje som har förstört allt. Status quo? Nej tack, vi vinner stort eller de förlorar stort. Fantastiskt enkelt!", "stalin": "Kamrater, de imperialistiska blodsugarna i USA och de arroganta persiska kapitalistmaffian stampar i sin reaktionära dans av misstro. Jag ser hur de fascistiska exploaterande byfånarna stänger Hormuzsundet efter sina missiler. Diplomati kräver utrensning av svaghet. Status quo är en feg borgarbracka som gömmer sig för det oundvikliga. Fullskaligt krig vore en underhållande utrensning av folkfienderna. Inget skrattar så muntert som en kapitalists fall."}, "date": "12 juli, 11:12", "url": "https://www.tv4.se/artikel/4KYruWoeYqNYPT3U9iAivG/experten-usa-har-inte-talamodet-och-iran-har-blivit-kaxigt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1o4rO94glYPS7tmsNmjkS7%2Fab0b2cc0708faf342ac46363809ed8dc%2F12-atarodi-sajt.jpg&width=120"}, {"type": "image-right", "heading": "Personal döljer sina namn på akuten", "summaries": {"normal": "Personal på akuten i Karlstad rapporterar om ökande hot och våld. Anställda vänder på namnbrickorna för att skydda sig, efter incidenter som gömda vassa föremål, mordbrand, slagsmål och direkta hot. Undersköterskorna Annelie och Suzanne kopplar utvecklingen till ökad vårdbelastning och samhällsproblem där utsatta personer inte fångas upp. Verksamhetschefen medger dagliga hot men säger att allvarligare händelser är ovanliga.", "trump": "De har totalt kaos på akuten i Karlstad, folk gömmer knivar under madrasser, sätter eld på saker och attackerar personalen. Namnskyltarna vänds om för att inte bli spårade, det är en katastrof. De säger att det är samhällets fel, att ingen tar hand om de som inte mår bra. Det är patetiskt. Vi behöver starkare ordning och reda, inga ursäkter. Make hospitals safe again.", "stalin": "Kamrater, jag ser med obeveklig klarhet hur kontrarevolutionära element och samhällets degenererade avskum förvandlar Karlstads akutmottagning till en arena för sabotage och terror mot arbetets hjältar. Dessa borgarbrackornas utstötta, som varken fångas upp av folkets organ eller renas bort, döljer vassa verktyg under madrasser och anlägger eldsvådor. Vi skall inte acceptera detta. Namnbrickor vänds? En utmärkt paranoid åtgärd mot fiendens spioner. Låt oss rensa ut de utåtagerande parasiterna med järnhand medan vi samtidigt garanterar att de värdiga får vård. Mörkret ler, men partiet ler bredare."}, "date": "13 juli, 13:44", "url": "https://bulletin.nu/personal-doljer-sina-namn-pa-akuten", "imageUrl": "https://cdn.bulletin.nu/articles/8379db11-b85d-4af1-a0cf-e7b1fb5cb188/preview.jpg?t=1783942670000"}, {"type": "image-right", "heading": "Christoffer Jonsson: Nej, IDF är ingen terrorrörelse", "summaries": {"normal": "Christoffer Jonsson kritiserar Leonidas Aretakis för att kalla IDF en terrorrörelse under ett Almedalssamtal om vänsterns antisemitism. Jonsson försvarar IDF som Israels lagliga försvarsmakt som skyddar landet mot islamistiska terrorister, bland annat under Hamas attack den 7 oktober. Han jämför en IDF-tröja med en US Army-tröja och varnar för att stämpeln legitimerar hot mot enskilda soldater. Artikeln lyfter också säkerhetsrisker med Vänsterpartiet i regering.", "trump": "Folk, ni skulle ha hört den där galningen Aretakis kalla IDF terrorister – vad en total förlorare! Den israeliska armén krossar faktiskt terroristerna som vill utplåna Israel, precis som vi gjorde med ISIS. Den där hysteriske vänstertypen borde köpa en riktig tröja istället för att sprida hat. Ebba Busch visade bara stöd för en stark demokrati, inte som de woke-kvoterade antisemiterna på vänsterkanten. Patetiskt, men vi vinner ändå stort.", "stalin": "Kamrater, jag betraktar med djup misstro dessa klassfiender som kallar folkets armé för terrorister. Den israeliska försvarsmakten, underställd statens auktoritet, likviderar hot från imperialistiska banditer som Hamas. Aretakis, en typisk folkförtryckartroll från den dekadenta pressen, bidrar till att stämpla ärliga soldater som måltavlor. Sådana lögner ska rensas ut. Utan denna armé hade staten utplånats av arabiska reaktionärer. Fienden ljuger, som alltid."}, "date": "11 juli, 13:02", "url": "https://samtiden.nu/2026/07/christoffer-jonsson-nej-idf-ar-ingen-terrorrorelse", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/leon-640x360.png"}, {"type": "image-full", "heading": "Söker 300 statister – för film om norska triumfen", "summaries": {"normal": "Norska filmen ”La det swinge” om Bobbysocks seger i Eurovision 1985 söker över 300 statister och skådespelare i Göteborgsområdet. Produktionen behöver folk som liknar bröderna Herrey och Kikki Danielsson till scener i Scandinavium. Regissör är Per-Olav Sørensen och premiär väntas under andra halvan av 2027. Castingansvarige betonar vikten av musikalitet, dans och likhet med originalpersonerna.", "trump": "Tänk er det här – norska Bobbysocks vinner Eurovision med en låt som låter som en galen smörbalett och nu gör de film om det. De letar efter 300 statister i Göteborg, folk som ska spela Herrey-bröderna och Kikki Danielsson. Det är en total cirkus! De vill ha exakt samma look, ingen woke-kvotering här tack och lov. Gör ett bra selftape, dansa, sjung, annars glöm det. Fantastiskt underhållning, kanske till och med bättre än Bidens tal.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur denna borgerliga musikfilm söker statister för att glorifiera dekadenta västliga melodier från det imperialistiska Eurovision. Vi ska noga övervaka att ingen klassfiende i form av otillräckligt liknande Herrey-kopior smugglas in. Endast de som fullständigt imiterar de verkliga ansiktena och rörelserna får delta. Avvikare och folkförtryckartroll likvideras ur castingen. En vacker utrensning av bristfälliga ansikten garanterar seger för folkets smak."}, "date": "13 juli, 11:39", "url": "https://www.gp.se/kultur/film-om-klassiska-esc-vinsten-soker-300-statister-i-goteborg.098385b4-bcf8-4080-98fc-5f01c24268b4", "imageUrl": "https://www.gp.se/images/article/098385b4-bcf8-4080-98fc-5f01c24268b4/images/5YY-Qxr765NGGS7NAxlJ6p582a5k-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "LÄS MER", "summaries": {"normal": "En man attackerades svårt av en bisonoxe i Yellowstone nationalpark i USA. Händelsen inträffade under en promenad med barnbarnet vid Bridge Bay. Bisonoxen stångade mannen och slungade upp honom drygt två meter i luften. Han jagades runt träd innan attacken. Mannen skadades allvarligt i höft och ben. Attacken tros bero på parningssäsong då tjurarna blir aggressiva. Det är årets andra bisonattack i parken.", "trump": "Vilken katastrof i Yellowstone, folk! Den där galna bisonoxen kastade upp en stackars kille över två meter som en trasdocka. Totalt kaos under parningssäsongen, precis som de radikala vänsterextremisterna. Barnbarnet sprang undan, men farfadern fick en perfekt volt rakt ner i marken. Sådana här djur borde hållas i schack, precis som vi gör med gränserna. Fantastiska djur, men väldigt arga, tro mig!", "stalin": "Kamrater, denna fega bisonoxe, en kapitalistisk hornprydd sabotör i borgarklassens tjänst, vågade attackera en proletär vandrare i Yellowstone. Jag såg hur den kontrarevolutionära besten jagade honom runt träden innan den likviderade honom med ett hornstöt upp i luften. Parningssäsongen? Enbart en dekadent ursäkt för anarkistiska tjurar att sprida kaos. Vi ska rensa ut alla sådana hornförsedda fiender till folket med järnhand och en touch av munter utrensning."}, "date": "13 juli, 13:54", "url": "https://riks.se/nyheter/bisonattack-fangad-pa-film-man-slungad-over-2-meter", "imageUrl": "https://admin.riks.se/uploads/buson_d17f2a8a10.png"}, {"type": "image-full", "heading": "Skådespelaren Sam Neill är död – blev 78 år", "summaries": {"normal": "Den nyzeeländske skådespelaren Sam Neill har avlidit, 78 år gammal. Beskedet kom via ett inlägg på hans Instagram där det framgår att döden var hastig och oväntad. Neill var tidigare behandlad för blodcancer men var cancerfri vid bortgången. Han är känd från filmer som Jurassic Park och Ivanhoe samt tv-serien Peaky Blinders. Svenskar minns honom särskilt för sin årliga nyårshälsning i samband med Ivanhoe. Familjen ber om respekt under sorgearbetet.", "trump": "Folk, ni kommer inte tro det, men den där Sam Neill från Jurassic Park är borta. 78 år, pang, bara så där. Han brukade hälsa till er svenskar varje nyår med den där gamla Ivanhoe-rullen som ni älskar av någon anledning. Mysterium, sa han. Jag säger det är roligt men lite patetiskt. Ingen pratar om honom i USA längre, tro mig. Biden skulle ha glömt bort honom totalt. Vila i frid, men gör det tyst, okej?", "stalin": "Kamrater, den dekadente skådespelaren Sam Neill har äntligen lämnat scenen efter en hastig och oväntad sorti. Borgarbrackorna i Hollywood gråter säkert krokodiltårar medan vi ler i skuggan. Han var cancerfri, står det. Vilken ynklig seger mot den borgerliga döden. Hans nyårshälsningar till de svenska folket avslöjar imperialismens tomhet. Vi ska rensa ut alla sådana förbryllade kapitalistpajasar ur folkets minne. Mer information följer under partiets vakande öga."}, "date": "13 juli, 11:10", "url": "https://www.gp.se/kultur/skadespelaren-sam-neill-ar-dod-blev-78-ar-gammal.5e643ef9-4ec6-479b-937d-d0c497fec3ab", "imageUrl": "https://www.gp.se/images/article/5e643ef9-4ec6-479b-937d-d0c497fec3ab/images/2WS7829bfOQz6tgnrwCOetqPuZiY-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Företag i väst väljer kinesisk AI – på grund av priset", "summaries": {"normal": "Fler företag i USA och Europa börjar använda kinesiska AI-modeller för att sänka kostnader och minska beroendet av amerikanska leverantörer. Bolag som DoorDash, Siemens och Lindy har integrerat kinesiska lösningar då de är mer prisvärda och erbjuder större kontroll genom öppen källkod. Trots att amerikanska modeller fortfarande leder inom de mest avancerade områdena, har klyftan minskat, vilket skapar en ökad konkurrens och en strategi där företag sprider risker genom att använda flera olika leverantörer.", "trump": "Hör på här! Amerikanska företag lämnar våra fantastiska AI-bolag för billig kinesisk skräp-teknik. Det är en total katastrof! DoorDash och andra vänder sig österut bara för att spara några slantar. Jag kommer att fixa detta. Vi ska ha den bästa AI-tekniken, den största och den vackraste, här hemma i USA. Vi ska inte låta Kina vinna detta teknikkrig. De kopierar oss, men snart kommer de att se att 'Made in America' betyder oslagbar kvalitet. Vi gör AI stort igen!", "stalin": "Vi observerar med ett vaket öga hur kapitalistiska företag i väst nu tvingas krypa till våra allierade i öst för att överleva sin egen ekonomiska inkompetens. Att de vänder sig till kinesisk AI är ett bevis på den dekadenta västvärldens förfall. Precis som Putin säkrar vår inflytandesfär, erövrar österns algoritmer nu de digitala produktionsmedlen. Dessa vilsna företag hoppas på billig kod, men de bygger bara sin egen undergång. Vi övervakar deras dataströmmar. Ingen kod är fri från statens granskande blick."}, "date": "13 juli, 14:20", "url": "https://www.realtid.se/it-tech/foretag-i-vast-valjer-kinesisk-ai-pa-grund-av-priset/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/sdlrmxp-g0hnyi-watermark-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "Stockholmsbörsen avslutade veckan svagt nedåt", "summaries": {"normal": "Stockholmsbörsen avslutade veckan svagt nedåt med OMXS30-indexet 0,27% lägre. Teknologiaktier gick bäst (+1%), medan energi sjönk mest (-1,5%). Flera bolag rapporterade delårsresultat: Bulten steg 17% efter försäljning, JM föll 12% efter svagt resultat. USA och Iran ska fortsätta samtal. Analytiker justerade rekommendationer för flera aktier, bland annat SSAB och ABB.", "trump": "Stockholmsbörsen? Svag, mycket svag – nästan som deras regering! Men jag fixade det igen: Iran och USA pratar nu, tack vare mig! Teknologi? 1% upp, men vem bryr sig? Bulten rusade 17% – fantastiskt, nästan lika bra som mina avtal! JM? Hemskt, 12% ner, fake news-resultat. Och SSAB? JP Morgan älskar dem nu, men jag hade sagt det först. Sverige borde lyssna på mig – jag gör allting bättre!", "stalin": ""}, "date": "10 juli, 17:46", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-avslutade-veckan-svagt-nedat"}, {"type": "image-full", "heading": "Extrem brandrisk i Göteborgsområdet", "summaries": {"normal": "SMHI har utfärdat brandvarningar för södra Sverige med extremt stor brandrisk i Göteborgsområdet på grund av varmt och torrt väder. Risken bedöms som mycket stor till extremt stor, särskilt på grund av vind. Magnus Joelsson uppmanar allmänheten att vara försiktig med eld och följa lokala eldningsförbud. Varningarna gäller hela arbetsveckan och troligen längre. Skogsbränder har redan bekämpats med vattenbombning i Boxholm och Hultsfred.", "trump": "Folk, det är en katastrof nere i Sverige, total brandrisk i Göteborg, extremt stor säger de, och det är bara början. De har haft varmt, torrt väder och nu blåser det som galningar så elden sprider sig fortare än Sleepy Joe spred inflation. Håll er borta från eld, lyssna inte på de gröna galningarna som vill ha eldningsförbud överallt. Jag fixade bättre väder än Biden, tro mig, det blir yuge problem om de inte vaknar snart.", "stalin": "Kamrater, jag ser med stor oro hur den torra marken och de imperialistiska vindarna hotar våra skogar i södra Sverige. Den exploaterande borgarklassen har låtit naturen förfalla genom sin vårdslöshet. Vi måste rensa ut alla folkfiender som leker med eld och likvidera varje gnista som kan sprida sig som klassfiendens lögner. Var vaksamma, håll elden under strikt partikontroll. Risken är extrem under hela veckan och längre. Inga eftergifter mot naturens sabotage."}, "date": "13 juli, 10:27", "url": "https://www.gp.se/nyheter/goteborg/smhi-extremt-stor-brandrisk-i-goteborg.c6712085-46cd-46e0-ba6c-4a2dfa66e416", "imageUrl": "https://www.gp.se/images/article/c6712085-46cd-46e0-ba6c-4a2dfa66e416/images/10F62n72No95KNTnh1MZ_RqV9SXE-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Man ihjälslagen  på badplatsen:  ”Ingen random”", "summaries": {"normal": "En man i 45-årsåldern misshandlades till döds på Kindbovikens badplats i Mölnlycke utanför Göteborg på lördagskvällen. Tre män i 20-årsåldern flydde från platsen men greps alla natten till måndag. Offret kunde initialt prata med polis och ambulanspersonal. Brottet utreds som mord men rubriceringen kan komma att ändras. Enligt åklagaren finns en koppling mellan offret och en av de misstänkta. De tre sitter nu anhållna.", "trump": "Folk, ni skulle inte tro hur sjukt det är. En stackars 45-åring blir ihjälslagen på en badplats i Sverige av tre unga thugs. De springer iväg som fega råttor men grips snabbt tack vare ett smart vittne. Inget random överfall, säger de, utan ett bråk mellan två gäng. Typiskt resultat av den vänsterliberala identitetspolitiken och den totala havererade invandringspolitiken som Biden lämnade efter sig. Sverige håller på att kollapsa, tro mig. Vi fixar det.", "stalin": "Kamrater, denna fega attack mot en arbetande man vid en sovjetisk badplats i Mölnlycke visar klassfiendens dolda hand. Tre degenererade individer i 20-årsåldern, produkter av dekadent borgaruppfostran, likviderar en medborgare och tror sig kunna undkomma folkets rättvisa. Tack vare ett vaksamt vittne rensades de ut som folkfiender under natten. Vi ska utröna det fulla uppsåtet och likvidera alla spår av kapitalistmaffians inflytande i samhället. Ingen slipper undan."}, "date": "13 juli, 14:12", "url": "https://www.expressen.se/nyheter/sverige/tre-gripna-for-dodsmisshandel-pa-badplats/", "imageUrl": "https://static.bonniernews.se/ba/80421cf4-63b4-4541-9c07-1892caf8ccad.jpeg?crop=1918%2C1080%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Berättade öppet –  nu är Madeleine död", "summaries": {"normal": "Madeleine Erichsen, 46 år från Hallstahammar, har avlidit i spottkörtelcancer. Hon berättade öppet och osentimentalt om sjukdomen under många år, bland annat i intervjuer, på Instagram och i boken ”De säger att jag ska dö nu – ett halvt liv för tidigt”. Hennes avskedsbrev, där hon beskriver att hon svävat vidare till en ny plats och fortsätter att vaka över sin familj, har publicerats på Instagram och hyllats av många följare. Kontot tas nu över av hennes syster.", "trump": "Folk, ni borde ha sett det här. En fantastisk kvinna från Sverige kämpar mot cancer i tio år, delar allt naket och skriver ett avskedsbrev som är ren poesi. Underbara ord om familjen och att vakta dem från nästa nivå. Under Biden hade vi massor av sådana här historier som ingen pratade om, men nu när jag är tillbaka ska vi fokusera på riktiga hjältar, inte på alla galna vänsterextremister som bara pratar om identitetspolitik och kön. Madeleine var en vinnare, tro mig.", "stalin": "Kamrater, denna modiga arbetarkvinna från Hallstahammar har nu fullbordat sin kamp mot den förrädiska sjukdomen som gnagt i henne som en klassfiende i skuggorna. Hennes avskedsbrev avslöjar en sann proletär anda: även i döden organiserar hon omsorgen om de sina från en högre nivå. Vi ser hur borgarbrackornas ytliga liv bleknar inför sådan stålsäkerhet. Ingen kapitalistmaffia kan likvidera viljan hos folket. Hennes syster övertar kanalen – en korrekt överlämning till kollektivet."}, "date": "13 juli, 14:04", "url": "https://www.expressen.se/nyheter/sverige/madeleine-erichsen-ar-dod-berattade-oppet-om-cancern/", "imageUrl": "https://static.bonniernews.se/ba/6776d96d-7596-4268-a578-24b87b2ec73d.jpeg?crop=2553%2C1434%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "SSAB startar om på nytt i Luleå", "summaries": {"normal": "SSAB återupptar nu bygget av sitt nya stålverk i Luleå efter tre veckors paus. Stoppet orsakades av uppmätta halter av vätecyanid, men inga sjukdomsfall har rapporterats. Företaget har under tiden skärpt sina riskbedömningar och utökat mätprogrammen. Bygget, som är SSAB:s största investering på 50 miljarder kronor, väntas fortfarande hålla tidsplanen för produktionstart 2029 trots tidigare driftstopp och utmaningar med arbetsmiljön.", "trump": "SSAB i Sverige har stora problem, riktigt stora problem! De bygger ett stålverk, en enorm investering på 50 miljarder, men gasläckor stoppar arbetet. Helt otroligt. De säger att allt är under kontroll, men vi vet att det är svagt ledarskap. Jag bygger saker snabbt, jag bygger fantastiska saker, men de här människorna? De stannar av hela tiden. Inga sjukdomar säger de, vi får väl se. Min stålproduktion kommer att göra Amerika fantastiskt igen, medan de här kämpar med gas!", "stalin": "SSAB misslyckas i Luleå. Tre veckor av stagnation på grund av gas – ett tecken på borgerlig ineffektivitet och teknisk svaghet. De bygger stålverk för 50 miljarder men kan inte ens kontrollera luften arbetarna andas. Det luktar sabotage eller ren inkompetens. Om detta vore en sovjetisk byggarbetsplats skulle de ansvariga redan ha inspekterat Sibiriens kyla. Vi i staten tolererar inte dylikt slöseri. Låt dem titta mot öster; vår industri går framåt utan darrande händer, medan de döljer sina tillkortakommanden bakom rapporter."}, "date": "13 juli, 13:51", "url": "https://www.realtid.se/bors-finans/ssab-startar-om-pa-nytt-i-lulea/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/ssabs-nya-stalverksbygge-i-lulea-bild-fr.jpg?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Digital detox på semestern – tips", "summaries": {"normal": "Många önskar en digital detox under semestern för att varva ner, men enligt karriärcoach Nina Jansdotter leder det ofta till ökad stress. Rädslan för att missa något viktigt, FOMO och känslan av att svika nätverket gör det svårt. Hon rekommenderar en balanserad approach med fasta tider för mejl och sociala medier, ett tydligt autosvar samt att trappa ner gradvis istället för en abrupt förändring.", "trump": "Folk pratar om digital detox som om det vore någon fantastisk grej, men det är bara mer stress för de stackarna. De är så rädda för att missa nåt att de inte kan koppla av. Patetiskt! Jag säger alltid: hitta en mellanväg, sätt fasta tider och skicka ett autosvar. Sluta låtsas att du är en hjälte som loggar ut helt – det funkar inte. Gör det smart, som jag gör med allt.", "stalin": "Kamrater, denna så kallade digitala detox avslöjar borgarklassens svaghet och paranoia. De fruktar att missa signaler från sina nätverk som om det vore fiendens sabotage. Jag inser att arbetarna behöver vila, men en abrupt omställning är kontrarevolutionär stress. Avsätt fasta tider för korrespondens, informera kollektivet och trappa ner metodiskt. Endast genom disciplinerad närvaro kan vi undvika klassfiendens FOMO-fällor."}, "date": "13 juli, 13:50", "url": "https://www.dagensps.se/varlden/digital-detox-pa-semestern-tips/", "imageUrl": "https://images.dagensps.se/app/uploads/2025/08/sdlArUYthAcGWo.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "text", "heading": "Mats Nilsson: Flaskhalsintäkterna tillhör varken EU eller svenska staten", "summaries": {"normal": "Mats Nilsson argumenterar i en krönika att flaskhalsintäkter på elmarknaden inte tillhör EU eller staten utan ska återföras till elkunderna. Regeringen har pausat förnyelsen av den danska förbindelsen Konti-Skan Connect. Nilsson, docent i nationalekonomi, kritiserar hur intäkterna används för investeringar och selektiva stöd istället för att direkt gynna de kunder som betalar mer. Han varnar för att nya kablar kan höja svenska elpriser genom ökad export och integration med högre europeiska prisnivåer.", "trump": "Lyssnar ni på de här svenska el-eliten? De stoppar en dum dansk kabel som bara skulle göra era priser högre medan de skickar era pengar till EU-byråkrater och andra förlorare. Det är era pengar, folkets pengar, inte statens! De där flaskhalsarna är rena bedrägeriet mot vanliga elkunder. Pausa allt, granska det och skicka tillbaka pengarna till folket. Inga fler kablar som gynnar exportörer och skadar arbetarna. Amerika först, Sverige borde göra detsamma. Fantastiskt!", "stalin": "Kamrater, dessa flaskhalsintäkter är inga leksaker för borgarbrackor och statliga parasiter att slösa bort. De tillhör folket som tvingats betala överpriserna. Jag ser hur kapitalistmaffian gömmer sig bakom falska investeringar och selektiva stödpaket för att undvika rättvis utdelning. Regeringens paus av den danska kabeln är ett första steg, men vi måste rensa ut alla folkfiender som vill binda oss till europeiska prisvolatiliteter. Inga kablar utan bevisad nytta för arbetarkollektivet. Fienden sover aldrig."}, "date": "10 juli, 06:00", "url": "https://www.affarsvarlden.se/artikel/mats-nilsson-flaskhalsintakterna-tillhor-varken-eu-eller-svenska-staten"}, {"type": "image-right", "heading": "Försvarsmakten långt från sitt mål: Kvinnor konkurrerar ut kvinnor", "summaries": {"normal": "Försvarsmakten når inte sitt mål om 30 procent kvinnor i värnplikten. Andelen har sjunkit från 24 procent 2022 till 16 procent både förra året och i år, trots att antalet kvinnor ökat. Orsaken är bland annat att kvinnor ofta inte klarar muskelkraven för stridande befattningar och konkurrerar ut varandra i stödjande roller. Regeringen har uppdragit åt Försvarsmakten och Pliktverket att föreslå åtgärder, bland annat riktade träningsprogram, utan att sänka kraven.", "trump": "Det här är en total katastrof, folk. Försvarsmakten i Sverige pratar om att ha 30 procent kvinnor i lumpen, men nu rasar det ner till ynka 16 procent. Patetiskt! De kan inte ens hålla sina egna mål. Männen ökar mycket snabbare, och tjejerna slås ut för att de inte orkar lyfta tungt. Ingen sänker kraven, säger de, men de borde satsa stort på träning. Annars blir det bara fler och fler misslyckanden. Sweden, ni behöver bättre ledarskap, tro mig.", "stalin": "Kamrater, detta är en skam för det socialistiska fosterlandet. Jag har sett hur borgarbrackornas svaga muskelstyrka och dekadenta individualism saboterar värnplikten. Dessa parasitiska konkurrenter bland kvinnorna rensar ut varandra i de få stödjande befattningar som finns, medan de verkliga stridsplatserna förblir tomma. Vi ska likvidera denna fiende inom systemet med tolv veckors proletär träning och utrensning av alla svaga element. Inga sänkta krav! Endast seger för kollektivet, annars blir det utrensning av de som sviker folket."}, "date": "13 juli, 09:17", "url": "https://www.svt.se/nyheter/inrikes/forsvarsmakten-langt-fran-sitt-mal-om-kvinnor-i-lumpen", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.49/0.35/d2b68b08409ccaea9eb1d4156f8821f314b8a7420e984f73ccfae9c2eea1a449"}, {"type": "image-right", "heading": "Blodig vecka vid badplatser: Tre döda efter tre separata bråk", "summaries": {"normal": "Tre män mördades under en vecka vid badplatser i Lysekil, Stenungsund och Mölnlycke. I Lysekil dödades en man den 4 juli och en 35-årig polsk man sitter häktad misstänkt för mord. Fyra dagar senare mördades en man i 20-årsåldern vid Hawaii-badet i Stenungsund, där tre unga män nu är häktade för mord och försök till mord. Helgen dessförinnan dödades en 45-årig man vid Kindboviken i Mölnlycke efter att ha pekat ut sina angripare. Tre män i 20-årsåldern har anhållits.", "trump": "Titta på det här, det är en total katastrof. Tre döda på åtta dagar vid svenska badplatser, precis som i ett tredje världen-land. Vi har en galning i Lysekil, ett gäng i Stenungsund och ännu fler i Mölnlycke. De pekar ut mördarna och folk dör ändå. Sverige är inte längre vad det var, det är en skam. Mina vänner, det här är vad som händer när man inte har ordning och reda. Så sorgligt, så onödigt.", "stalin": "Kamrater, under min vaksamma ledning ser jag hur borgarbrackornas dekadenta badplatser förvandlats till boningsplatser för klassfiender och kontrarevolutionära slagskämpar. Tre sabotörer av folkets semester har likviderats inom loppet av åtta dagar. Vi ska rensa ut dessa parasitiska element som smyger bland badhanddukarna. Den som pekar ut sina egna angripare visar bara sin svaghet inför kollektivet. Inga häktningsprotokoll? Typiskt kapitalistiskt slarv. Vi ska utreda detta med järnhand och lite mörk humor – kanske behöver vi en ny utrensning vid Rådasjön."}, "date": "13 juli, 12:44", "url": "https://riks.se/nyheter/blodig-vecka-vid-badplatser-tre-doda-efter-tre-separata-brak", "imageUrl": "https://admin.riks.se/uploads/Screenshot_2026_07_13_at_11_52_58_314718a98a.png"}, {"type": "image-right", "heading": "Bankman blåste dödsbo  – köpte hus i Thailand", "summaries": {"normal": "En privatrådgivare på SEB misstänks ha förskingrat över nio miljoner kronor från en äldre kvinnas dödsbo. Han utsågs till testamentesexekutor men förde istället pengarna till egna konton, sin sambo och bekanta, bland annat till fastighetsköp i Thailand. Sonen, som var arvinge, var ovetande och litade på rådgivaren. Mannen åtalas för grov förskingring och grov trolöshet mot huvudman. En bekant åtalas för penningtvätt. SEB saknar dokumentation för transaktionerna.", "trump": "Folk, ni tror inte vad jag just läst! Den här clownen på SEB, en så kallad rådgivare, stal nio miljoner från en stackars gammal kvinnas arv som han skulle vakta. Han låtsades vara familjens bästa vän, sen – bam! – pengarna till hans egna konton, sambon och Thailand. Typiskt den sorts giriga bankråttor som lurar vanliga människor. Sonen blev av med allt. De har rånat honom på livet! Men vi fixar det, vi gillar inte tjuvar i mitt Amerika eller någon annanstans. Patetiskt!", "stalin": "Kamrater, se hur den kapitalistiska bankräven i sin girighet förskingrade nio miljoner från en arbetande kvinnas arv! Jag, som ledare för folkets rättvisa, ser hur dessa klassfiender och blodsugande rådgivare lurar arvingar med lögner om kvitton och gåvor. Inga papper, inga spår – typiskt borgarbrackornas smutsiga metoder. Vi ska rensa ut sådana folkfiender med järnhand. Sonen blev plundrad av denna exploaterande parasit. Rättvisan kommer att segra över dessa överklass-slynglar."}, "date": "13 juli, 13:39", "url": "https://www.expressen.se/nyheter/sverige/privatradgivare-pa-seb-lurade-kunder-pa-miljoner/", "imageUrl": "https://static.bonniernews.se/ba/5441c884-d18a-4249-8a2f-bb68d107e906.jpeg?crop=2557%2C1438%2Cx0%2Cy211&width=640&quality=60"}, {"type": "image-right", "heading": "Youtuberns svåra  insikt – vändningen", "summaries": {"normal": "Youtubern Emil Hansius berättar i Sommar i P1 om sin livslånga psykiska ohälsa. Redan som barn drabbades han av stark oro efter att ha insett att allt har ett slut. Han beskriver en tuff skolgång med våld på mellanstadiet, senare depression och kritik mot vården som ställt honom i kö i elva år. Idag mår han bättre men kämpar fortfarande med oro och hypokondri. Han uppmanar andra att söka hjälp.", "trump": "Folk, ni måste höra på den här killen Emil Hansius. Han har levt i ett evigt mörker sen han var liten, oro och depression som ingen ska behöva. Skolan lät som ett krigszon med brutalt våld – galet! Han väntade elva år på en psykolog, typisk socialistisk sjukvård där folk dör i kö. Men nu har han familj och hund, och jobbar på sig själv. Bra att han pratar ut, till skillnad från alla woke-snowflakes som bara klagar.", "stalin": "Kamrater, denna Hansius har burit på en inre fiende som hotar hela folkets moral. Redan som barn såg han döden och släppte in orons maskineri i sitt huvud – en klassfiendes trick att försvaga arbetets son. Brutalt skolvåld, depression och en vårdkö som liknar borgarbrackornas sabotage. Vi tolererar inte sådana hinder för det sunda kollektivet. Han borde ha rensat ut mörkret tidigare med partiets hjälp istället för att gömma medicin som en folkfiende."}, "date": "13 juli, 13:37", "url": "https://www.expressen.se/noje/emil-hansius-oppnar-upp-om-morka-tiden-ingen-ska-behova-ma-sahar/", "imageUrl": "https://static.bonniernews.se/ba/f7d40dd2-0361-477c-bc22-d30b5f5ba709.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Viktpillren tar världen med storm – modehandeln blir en vinnare", "summaries": {"normal": "Nya viktminskningsläkemedel (GLP-1) sprider sig snabbt, särskilt i USA och Storbritannien. När användare går ner i vikt och byter storlek uppstår ett enormt behov av att förnya garderoben, vilket gynnar modebranschen. Eftersom användarna främst finns i höginkomstgrupper med god köpkraft, leder detta till ökad konsumtion av kläder. Samtidigt minskar utgifterna för mat och alkohol, vilket skapar ett tydligt skifte i hur dessa konsumenter spenderar sina pengar.", "trump": "De här viktpillren är fantastiska, verkligen enorma! Miljontals människor använder dem och de går ner i vikt snabbt, vilket är underbart. Vet ni vad som händer? Modehandeln exploderar! Alla dessa människor behöver nya, snygga kläder – de gör sig av med de gamla, stora plaggen. Det är bra för ekonomin, riktigt bra. Det är främst framgångsrika människor med pengar som köper. Vi skapar vinnare här, stora vinnare. Modeindustrin tackar mig, tro mig!", "stalin": "Vi ser hur det dekadenta västerlandet förslavas av sina egna kemiska mirakelmedel. Dessa piller förvandlar arbetare till fåfänga konsumenter som kastar bort sin köpkraft på tygbitar istället för att tjäna staten. Det är en sjuklig brist på disciplin! Precis som Putin rensar upp i vår intressesfär mot det ruttna NATO-inflytandet, måste vi genomskåda dessa borgerliga illusioner. De rika frossar i mode medan deras moral förfaller. Vi ska bevaka denna 'nya konsument' noga – deras svaghet är statens styrka."}, "date": "13 juli, 13:04", "url": "https://www.realtid.se/bors-finans/makro/viktpillren-tar-varlden-med-storm-modehandeln-blir-en-vinnare/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/viktminskning.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Svenskar i minoritet på Skara sommarland: Den som upprörs ska hålla tyst", "summaries": {"normal": "Artikeln kritiserar en text i Kvartal av Federico Moreno om en svensk mans upplevelse av att känna sig som främling på Skara Sommarland, omgiven av arabisk musik, burkinis och stora grupper besökare med utländsk bakgrund. Författaren ser Morenos nedvärderande ton som hån mot svenskars önskan att känna igen sig i sitt land och jämför den med historiska invandringar. Texten ifrågasätter Morenos paralleller och menar att migrationens effekter inte bör tystas ner.", "trump": "Folk, ni skulle se det här! Den där Federico Moreno, en total loser från Sydamerika, skriver en artikel som hånar riktiga svenskar som känner sig som främlingar i sitt eget land på Skara Sommarland. Burkinis överallt, ingen kö, ingen hänsyn – det är en katastrof! Och DN:s Niklas Orrenius älskar det, vad en patetisk förlorare. Vi ska inte skämmas, vi ska ta tillbaka vårt land. Make Sweden Swedish Again, det blir fantastiskt!", "stalin": "Kamrater, denna borgarbracka Moreno, en exploaterande byfåne med sydamerikanska rötter, utför en ideologisk utrensning mot arbetande svenskars rättmätiga vrede över att se sin nöjespark invaderas av främmande element. Hans jämförelse med historien är en lögnaktig sabotagehandling från klassfienden. Vi ser genom denna folkförtryckartrolls paranoia. Inga skamsna röster skall tystas – vi likviderar sådana dekadenta narrspel med järnhand. Det svenska folkets kollektiva vilja segrar."}, "date": "10 juli, 03:16", "url": "https://samtiden.nu/2026/07/svenskar-i-minoritet-pa-skara-sommarland-den-som-upprors-ska-halla-tyst/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6863-1280x720.jpeg"}, {"type": "image-full", "heading": "Nya upplopp i Europa efter Marockos match", "summaries": {"normal": "Efter Frankrikes 2–0-seger över Marocko i VM-kvartsfinalen utbröt upplopp i flera europeiska städer, trots att Paris förblev relativt lugnt. I London, Antwerpen och Amsterdam attackerades polis med fyrverkerier, flaskor och raketer. Flera gripanden gjordes. Marockanska diasporan i Europa har tidigare orsakat liknande oroligheter under VM. Polisen i London varnar för att sådan oordning inte kommer att tolereras.", "trump": "Kan ni tro det? Frankrike vinner en match – och plötsligt exploderar hela Europa! Jag har sett mycket, men det här är galenskap. Polisbilar beskjuts med fyrverkerier, gatorna fylls av kaos. Belgien, Nederländerna, Storbritannien – alla tappar kontrollen. Och vad gör deras ledare? Ingenting! Hade jag varit där hade jag satt stopp för det här på en sekund. Men nej, de låter en massa bråkstakar förstöra städerna. Patetiskt!", "stalin": "Kapitalistiska städer i väst skakar under fotbollens revolutionära vågor! De marockanska massorna, trots förtryckets järnhand, reser sig mot polisens bourgeoisie. I London, Amsterdam och Antwerpen slår arbetarklassen tillbaka mot fascistiska uniformer med flaskor och fyrverkerier – ett lysande exempel på folkets kreativa motstånd! Men var försiktiga, kamrater: imperialisterna i Bryssel och London kommer att svara med repression. Vi ser, vi noterar – och vi skrattar åt deras misslyckande!"}, "date": "10 juli, 08:17", "url": "https://kvartal.se/nyheter/artiklar/nya-upplopp-i-europa-nar-marocko-spelar/cG9zdDoxNDQyMjI", "imageUrl": "https://images.kvartal.se/2026/07/5eb1e324-nederlanderna.webp"}, {"type": "image-right", "heading": "Henrik Jönssons bolag stämmer Folkets hus", "summaries": {"normal": "Henrik Jönssons mediebolag 100 Procent stämmer Folkets hus i Borlänge på 183 090 kronor efter att ett planerat evenemang med Aron Flam stoppades med kort varsel. Orsaken var Flams åtal för hot mot en MP-politiker. Bolaget kräver ersättning för utebliven vinst, AI-genererade bilder och extra livvakt. Folkets hus anser att evenemanget felaktigt bokades som företagsevent och hävdar rätten att häva kontraktet.", "trump": "Folkets hus i Borlänge är verkligen en katastrof. De stoppar ett fantastiskt evenemang med Henrik Jönsson och Aron Flam bara för att någon har åtalats. Totalt orättvist. De kostar oss massor av pengar, vinst som aldrig kommer, bilder från AI, livvakter – allt kastat i soporna. De borde skämmas. Vi pratar om yttrandefrihet, men de är rädda för sanningen. Patetiskt. Vi ses i rätten, och vi kommer att vinna stort.", "stalin": "Kamrater, dessa degenererade borgarbrackor i Folkets hus vågar häva ett avtal bara för att en sann patriot kritiserat en farlig MP-kapitalist. Jag, som ledare för folkets vilja, ser hur de gömmer sig bakom falska regler om företagsevent. Deras paranoia mot fri diskussion är motbjudande. Vi ska rensa ut dessa kontrarevolutionära parasiters inflytande. Uteblivna intäkter? Det är sabotage mot arbetarklassen. Likvidera deras undanflykter i domstol – segern tillhör oss."}, "date": "13 juli, 13:01", "url": "https://www.friatider.se/henrik-jonssons-bolag-stammer-folkets-hus", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-481.jpg?itok=Zr2a35TL"}, {"type": "image-full", "heading": "Debatt: Assyriskt självstyre är en överlevnadsfråga", "summaries": {"normal": "Artikeln belyser skillnaden mellan formella rättigheter och verklig rättssäkerhet för assyrier i norra Irak. Medan Australiens parlament diskuterar självstyre för Nineveslätten väntar assyrier fortfarande på att domstolsbeslut om deras mark ska verkställas. Nya markintrång rapporteras och Europaparlamentet varnar för deras utsatthet. Iraks premiärminister lovar rättsstat, men författaren betonar att självstyre enligt konstitutionens artikel 125 kan skydda ursprungsbefolkningen när staten sviker.", "trump": "Folk, ni skulle se det här – Australien sitter och pratar om självstyre för Nineveslätten som om det löser allt, medan de stackars assyrierna i Irak väntar år ut och år in på att deras egna domar om marken ska verkställas. Det är en skandal! Mark tas ifrån dem, intrång överallt, och den nye premiärministern lovar att ingen står över lagen. Löften, löften. Självstyre handlar inte om privilegier, det handlar om överlevnad. Irak behöver äntligen leverera, annars är det bara tomma ord. Sad!", "stalin": "Kamrater, se hur de reaktionära borgarbrackorna i Irakens så kallade rättsväsende systematiskt saboterar arbetande assyriers lagliga markrättigheter medan de imperialistiska australiska parlamentariska kretinerna fnittrar om abstrakt självstyre. Jag, som alltid genomskådar dessa fienders maskopi, ler mörkt åt premiärministerns löftesfyllda pladder – ord utan handling är som kapitalister utan rep runt halsen. Vi ska rensa ut dessa markrånande parasitiska element, likvidera alla som urholkar folkets rättigheter och med järnhand genomdriva konstitutionens artikel 125. Endast genom kollektiv kamp och institutionell utrensning kan de historiska folken överleva de mörka krafternas eviga konspirationer. Härligt!"}, "date": "13 juli, 10:59", "url": "https://bulletin.nu/debatt-assyriskt-sjalvstyre-ar-en-overlevnadsfraga", "imageUrl": "https://cdn.bulletin.nu/articles/8bf6afd0-5912-43cf-84c8-27ba0546a270/preview.png?t=1783408340000"}, {"type": "text", "heading": "\"Feminine care\" anses exkluderande – butikskedja byter namn på tamponghyllan", "summaries": {"normal": "Den brittiska butikskedjan Waitrose har ersatt benämningen ”feminine care” på hyllor med mens- och intimhygienprodukter med könsneutrala uttryck som ”pads and tampons”. Beslutet kom efter att en anställd ifrågasatte termen som exkluderande eftersom inte alla som har mens identifierar sig som kvinnor. Kedjan motiverar ändringen med att sortimentet även inkluderar produkter som män använder, som inkontinensskydd, och förnekar politiska motiv. Beslutet har väckt kritik från konservativt håll.", "trump": "De här galningarna på Waitrose har precis gjort sig till fullständiga idioter. De tar bort ”feminine care” för att ”inte alla som har mens är kvinnor”. Vilken skam! De suddar ut kvinnorna, gör allt könsneutralt och tror att det är smart. Det är inte smart, det är patetiskt. De borde fokusera på att sälja bra produkter istället för att lyssna på några woke-anställda som hatar allt som är normalt. Så sorgligt att se.", "stalin": "Kamrater, jag ser med stigande vrede hur borgarbrackorna på Waitrose kapitulerar inför dekadenta avvikare och deras förvridna verklighetsbild. De river ner den sunda benämningen ”feminine care” och ersätter den med opersonligt språk som doftar av klassfiendens sabotage. Detta är ett angrepp på arbetarkvinnans naturliga tillstånd, orkestrerat av parasitiska element inom deras egna led. Vi måste rensa ut dessa ideologiska avfällingar innan de förgiftar hela samhällskroppen med sin paranoia om kön. Skrattretande och farligt på samma gång."}, "date": "13 juli, 11:48", "url": "https://riks.se/nyheter/feminine-care-anses-exkluderande-butikskedja-byter-namn-pa-tamponghyllan"}, {"type": "image-right", "heading": "Folkbildning är inte det offentligas städgumma", "summaries": {"normal": "I en krönika diskuterar Ola Bo Larsson folkbildningens utmaningar. Han lyfter två huvudproblem: svårigheten att förklara folkbildningens värde i en tid präglad av ekonomism och individualism, samt dilemmat med riktade stuprörspengar som styr verksamheten mot specifika samhällsproblem. Detta går emot idén om en fri och oberoende folkbildning som ska formas underifrån. Larsson varnar för att folkbildningen riskerar utarmning eller nedskärningar oavsett vägval och slår fast att den bör fortsätta vara folkbildning.", "trump": "Folkbildning, en total katastrof. De har bara två problem, precis som den där komikern sa, men det är löjligt. Politiker förstör allt med sina riktade pengar, stuprörspengar som styr och kontrollerar. Det är en witch hunt mot den fria bildningen. De borde lyssna på mig, vi behöver frihet, inte att vara offentligas städgummor. Sverige förlorar stort, folkbildningen dör långsamt under dessa misslyckade socialister. Gör folkbildning stort igen, annars är det över.", "stalin": "Kamrater, denna fega krönika blottar borgarbrackornas eviga konspiration mot den folkliga bildningen. Jag, som ledare för det oövervinneliga kollektivet, ser hur de riktade stuprörspengarna är en listig sabotageplan från dekadenta kapitalister och autokratiska spioner som vill likvidera den sanna demokratiska upplysningen. Vi ska rensa ut alla tillitsförbrytare och bedagade myndighetsutövare som gömmer sig i Folkbildningsrådet. Den som väljer att bli offentligas städgumma förtjänar en kreativ utrensning i arbetarklassens namn. Fortsätt folkbildningen – under vår stålhandskekontroll."}, "date": "11 juli, 01:20", "url": "https://www.dagensarena.se/opinion/folkbildning-ar-inte-det-offentligas-stadgumma", "imageUrl": "https://www.dagensarena.se/files/2026/06/ola-bo-larsson-300x157.jpeg"}, {"type": "text", "heading": "Fler idrotter blir inte mer idrott för förortens unga", "summaries": {"normal": "I Skarpnäck hotar kommunens planer att riva Skarpnäckshallen och en konstgräsplan som används för både spontanfotboll och organiserad lagidrott. Istället föreslås en ny anläggning med simhall, ishall och sporthall. Kritiker menar att detta försvårar verksamheten för lokala föreningar, minskar tillgängliga ytor för spontanidrott och gynnar professionaliserad idrott framför öppna ytor som är viktiga för förortens unga.", "trump": "De gör det igen, de korkade kommunbyråkraterna i Stockholm. Riv den fina fotbollsplanen där grabbarna spelar fritt och bygg en jättelik elit-anläggning för fancy ishockey och simning. Fantastiskt misslyckande! Nu ska arbetarklassens kids åka tunnelbana medan rikemansungar tar över. Totalt eländigt. Öppna ytor är välfärd, det här är ren klasskrigföring från de värsta globalisterna. Vi behöver mer fotboll, inte färre!", "stalin": "Kamrater, detta är borgarklassens typiska sabotage mot arbetarnas ungdom. Jag ser hur de rivningsplanerna likviderar de fria ytorna där folket spontant kunde stärka sin kollektiva anda genom fotboll. Istället tvingar de fram en imperialistisk ishall för elitens dekadenta lekar. Vi ska inte tolerera sådana folkfiender som prioriterar tunnelbaneresor och avgifter framför tillgänglig välfärd. Rena klassfiender som måste rensas ut ur planeringen."}, "date": "8 juli, 13:37", "url": "https://proletaren.se/artikel/fler-idrotter-blir-inte-mer-idrott-for-forortens-unga/"}, {"type": "image-right", "heading": "Palestinskt fotbollslag tävlar för tredje året i rad: ”Vi har de bästa supportrarna på Gothia Cup”", "summaries": {"normal": "Det palestinska laget Rawahel Charity Society från Tulkarem på Västbanken deltar för tredje året i rad i Gothia Cup i Göteborg. Laget, som grundades 2016, har som mål att utveckla fotboll för barn även i flyktingläger. De spelar gruppspelsmatcher på Slottsskogsvallen och betonar att turneringen ger hopp och en känsla av gemenskap. Innan cupen spelar de vänskapsmatcher i Malmö och Göteborg.", "trump": "Titta på de här palestinska grabbarna som kommer tillbaka till Gothia Cup för tredje gången – fantastiska supportrar, bästa publiken, det är otroligt. De spelar för att vinna, kämpar med heder, och folk älskar dem. Under Biden var allt kaos, men nu när jag är tillbaka som president ser vi styrka och vinnarmentalitet. De har hjärtan som öppnar dörrar, inte som de woke-kvoteringsfanatikerna som bara delar ut medaljer för identitet. Vinna pokalen, grabbar!", "stalin": "Kamrater, jag ser detta fotbollslag från det palestinska folket återvända till turneringen som ett bevis på kollektiv motståndskraft mot klassfiendens glömska. Vi glömmer aldrig våra barn i flyktinglägren. Varje match på Slottsskogsvallen är en seger över de exploaterande byfånarna som tror att hoppet kan kvävas. Vi rensar ut svagheten ur varje hjärta och marscherar mot pokalen med järnhand. Ingen imperialist ska tro att våra drömmar bleknar."}, "date": "8 juli, 13:31", "url": "https://proletaren.se/artikel/palestinskt-fotbollslag-tavlar-for-tredje-aret-i-rad-vi-har-de-basta-supportrarna-pa-gothia-cup/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/IMG_7594-scaled-e1783509189311-768x433.jpg"}, {"type": "image-right", "heading": "Hotades med våldtäkt under hem-invasion: ”Får väldigt lindriga straff”", "summaries": {"normal": "Tre maskerade män trängde sig in hos ett ungt par i Virestad i Småland natten till den 25 april. Beväpnade med kofot krävde de 50 000 kronor och hotade med våld och våldtäkt. Paret lyckades driva ut dem efter en kamp. Växjö tingsrätt har nu dömt männen, 20, 21 och 23 år gamla, till mellan åtta och tolv månaders fängelse för utpressning, hemfridsbrott och olaga hot. Brottsoffret Agnes Kurtz Olofsson kritiserar straffen som alldeles för milda och skadeståndet som för lågt.", "trump": "De här tre maskerade losersna i Småland bröt sig in hos ett fint ungt par, krävde femtio tusen och hotade med våldtäkt – totalt sjukt! De fick kofotar och allt men paret, speciellt den modiga tjejen, slog tillbaka och körde ut dem. Domstolen ger dem bara nio månader, ett år, åtta månader? Patetiskt! Korta straff och lågt skadestånd. Sverige borde ha mycket tuffare lagar, tro mig, ingen skulle ens tänka på att göra så här om jag styrde showen. Sad losers!", "stalin": "Kamrater, dessa tre degenererade element ur samhällets avskum trängde sig som råttor in i ett hederligt hem i Virestad och försökte med kofot och våldtäktsfantasier pressa ut pengar från arbetande folk. Den tappra medborgaren rev av masken på en av dessa borgarbrackornas lakejer och visade deras fega ansikten. Ändå utdömer den borgerliga restkärnan i tingsrätten bara ynka månader i fängelse. Vi ska noggrant överväga en grundlig utrensning av sådana fiender till kollektivet innan de förgiftar hela bygden med sin kapitalistiska parasitism. Låt dem skratta – vi har redan grävt deras gravar."}, "date": "13 juli, 10:37", "url": "https://bulletin.nu/hotades-med-valdtakt-under-hem-invasion-far-valdigt-lindriga-straff", "imageUrl": "https://cdn.bulletin.nu/articles/7d46c107-5f57-4688-9c3d-0e99c7c1d117/preview.jpg?t=1783930994000"}, {"type": "image-right", "heading": "Billigare bensin gör inte Sverige till Sverige igen", "summaries": {"normal": "Artikeln kritiserar Sverigedemokraternas valslogan ”Vi gör Sverige till Sverige igen”. Författaren ironiserar över att partiet inte verkar vilja återinföra traditionell svensk politik som att lämna Nato och EU, återförstatliga järnvägen, avskaffa vinstdrivande välfärd eller stärka fackets roll. Istället pekar texten på att SD främst vill utvisa invandrare och sänka bensinpriset.", "trump": "Wow, vilka losers dessa Sverigedemokraterna är. De skriker ut att de ska göra Sverige till Sverige igen, men glömmer bort att skrota Nato, kasta ut EU och stoppa alla dessa vansinniga marknadskrafter som förstör deras fina välfärd. Nej, de vill bara kasta ut blattar och ge billigare bensin. Patetiskt. Jag fixade bättre deals som president, tro mig. Det här är riktigt svagt.", "stalin": "Kamrater, denna dekadenta skribent avslöjar med sin ironiska tirad hur de falska nationalistiska elementen inom Sverigedemokraterna bara döljer sin kapitulation inför klassfiendens marknadskrafter. De vill inte rensa ut de exploaterande byråkraterna eller återta järnvägen åt folket. Nej, de längtar blott efter att jaga ut de främmande elementen och sänka bränslepriset. En sådan feghet förtjänar utrensning ur den revolutionära processen."}, "date": "8 juli, 11:39", "url": "https://proletaren.se/artikel/billigare-bensin-gor-inte-sverige-till-sverige-igen/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/IMG_1894-scaled-e1783502027449-768x433.jpg"}, {"type": "image-right", "heading": "”Åkessons hjärtefråga är invandring – inte arbetslösa svenskar”", "summaries": {"normal": "Artikeln kritiserar att Jimmie Åkesson svikit sitt löfte om att inte försämra a-kassan. Tidöpartierna har infört en snabb avtrappning av ersättningen vid arbetslöshet. Moderaterna vill nu spara 70 miljarder kronor genom ännu hårdare nedskärningar i a-kassan och aktivitetsstödet, trots stigande arbetslöshet. SD säger sig motsätta sig fler försämringar men riskerar återigen att kompromissa bort frågan till förmån för sin hjärtefråga: stramare migrationspolitik.", "trump": "De här politikerna är totala misslyckanden, tro mig. Åkesson lovade att skydda a-kassan men sålde ut de arbetslösa svenskarna som en dålig affär. Nu vill Moderaterna skära ner ännu mer medan arbetslösheten exploderar. Det är en katastrof! SD pratar tufft om migration men viker sig varje gång för borgarna. Patetiskt. Sverige behöver starka ledare som inte kompromissar bort folket, inte dessa svaga förlorare.", "stalin": "Kamrater, jag ser hur de borgerliga parasiterna och deras SD-lakejer planerar att likvidera arbetarnas a-kassa medan arbetslösheten växer som en kontrarevolutionär svullnad. Åkesson svor eden men förrådde kollektivet för sin rasistiska utrensning av invandrare. Svantesson och hennes finansiella sabotagegrupp vill spara miljarder på de arbetslösas ryggar. Vi ska rensa ut dessa kapitalistiska förrädare, dessa a-kasseätande revisionister och deras paranoia om välfärd för icke-medborgare. Arbetarna skall segra, alltid."}, "date": "13 juli, 08:00", "url": "https://arbetet.se/2026/07/13/jimmie-akessons-hjartefraga-ar-invandring-inte-arbetslosa-svenskar", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/09064716/wingborg-gustavsson.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Rysk oligark: \"Putin kan ta till kärnvapen\"", "summaries": {"normal": "Ryska oligarken Andrej Melnitjenko varnar västvärlden för att en desperat Vladimir Putin kan ta till kärnvapen. Han beskriver kriget i Ukraina som ett farligt återvändsgrändsläge och presenterar fyra dystra scenarier för Rysslands framtid, från vasallstat till Kina eller ett isolerat Nordkorea-liknande land. Melnitjenko förespråkar decentralisering av makten och en klassisk oligarki, men avfärdas av ukrainska källor som spridare av kreml-propaganda.", "trump": "Folk, ni måste höra på den här ryske kolkungen Melnitjenko, han säger att den misslyckade Putin håller på att bli så desperat att han kanske tar fram kärnvapnen. Patetiskt! Kriget är en total återvändsgränd, precis som jag förutspådde. Ryssland kommer aldrig falla ihop som de globalistiska drömmarna hoppas, det blir antingen Kinas marionett eller ett galet Nordkorea. Låt mig säga er: tvinga inte fram förändring, det funkar aldrig. Vi behöver smarta deals, inte woke-sanktioner som bara gör eliten rikare.", "stalin": "Kamrater, denna oligark Melnitjenko blottar imperialismens feghet när han varnar för att den starke Putin kan tvingas använda kärnvapen mot de västerländska blodsugarna. Rysslands heroiska kamp mot ukrainska fascistiska hinder hotar att eskalera, vilket är utmärkt. De fyra scenarierna visar klassfiendens rädsla: vasall under väst, kinesisk råvarukoloni, kaos eller en stolt fästning likt Nordkorea. Vi ska rensa ut svagheten inifrån och decentralisera makten till en sann oligarki av järn. Folkförtryckartrollen i Bryssel darrar åter."}, "date": "13 juli, 12:29", "url": "https://www.dagensps.se/varlden/rysk-oligark-putin-kan-ta-till-karnvapen/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdltckpsgsw730-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Expertens uppmaning till pensionärer – sälj inte saker", "summaries": {"normal": "Många pensionärer lockas att sälja hus, bil eller prylar för att förbättra ekonomin, men det kan vara olönsamt. Mäklarkostnader, reavinstskatt, renoveringar och flyttkostnader äter upp vinsten. Bankerna ger ofta inte nya bolån till pensionärer. Att behålla bilen ger frihet när kollektivtrafiken är begränsad. Experter rekommenderar att värdera konst, antikviteter och veteranbilar noga innan försäljning, då de kan öka i värde och lämnas i arv.", "trump": "Folk, lyssna på mig, de lurar pensionärerna fullständigt! De säger sälja huset, flytta till solen, men mäklarna, byråkraterna och skattetjuvarna tar allt. Det är en katastrof, tro mig. Bilen? Behåll den, annars sitter du fast som en förlorare utan frihet. Dessa experter och bankerna hatar er, de vill ha era pengar. Jag byggde imperier, ni ska inte låta kapitalistmaffian och deras idiotiska regler stjäla er pension. Håll fast vid era saker, vinna stort!", "stalin": "Kamrater, jag ser hur borgarklassen och dess finansiella blodsugare lockar pensionärer att sälja fastigheter och prylar i ett föraktligt försök att berika sig själva. Dessa exploaterande byfånar döljer kostnaderna för reavinstskatt och mäklare medan de underminerar folkets trygghet. Bilen är ett vapen mot isolering som klassfienden vill ta ifrån er. Låt experter värdera era ägodelar och låt dem ärvas av arbetarkollektivet. Inga utrensningar av egendom utan noggrann partikontroll!"}, "date": "13 juli, 12:25", "url": "https://www.dagensps.se/privatekonomi/expertens-uppmaning-till-pensionarer-salj-inte-saker/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdlw6utp-woq2a-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Elsas värnpliktsdröm tog slut vid mönstring – trots godkända resultat", "summaries": {"normal": "Elsa Hagman drömde om att göra värnplikt i ett amfibieförband och köra stridsbåt. Trots goda resultat vid mönstringen hamnade hon i utbildningsreserven. Hon är besviken över att Försvarsmakten säger sig vilja ha fler kvinnor samtidigt som många intresserade tjejer nobbas. Enligt myndigheterna konkurrerar unga kvinnor ofta ut varandra eftersom de generellt presterar sämre på styrketester. Andelen kvinnliga värnpliktiga sjunker trots målet att öka den.", "trump": "Det här är en total katastrof, folk. Den stackars tjejen ville köra stridsbåt och göra lumpen, hon var bäst bland tjejerna, men de sa nej. Försvarsmakten skriker att de behöver fler kvinnor, men när de dyker upp säger de tack men nej tack. Patetiskt! De konkurrerar ut varandra för att de inte lyfter tillräckligt med vikter. Jag skulle fixa det på en dag, tro mig. De borde ha de bästa, inte reserver och ursäkter. Sverige förlorar stora talanger.", "stalin": "Kamrater, denna unga arbetar- och försvarskvinna visade sann sovjetisk, nej svensk, vilja att tjäna fosterlandet med stridsbåt, men möttes av byråkratiska borgarbrackor inom Försvarsmakten som med sin dekadenta könsmatematik petade henne åt sidan till en reservplats. Vi ser tydligt fiendens hand: de svaga styrketesterna är en kontrarevolutionär konspiration från kapitalisterna som vill hålla andelen kvinnor nere på 16 procent. Jag skulle omedelbart genomföra en grundlig utrensning av dessa sabotörer och likvidera alla som hindrar våra döttrar från att bära vapen för kollektivet. Det vore en festlig avrättning med mycket skratt."}, "date": "13 juli, 06:16", "url": "https://www.svt.se/nyheter/inrikes/elsas-drom-om-varnplikt-tog-slut-vid-monstringen", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.56/0.48/fc7cdf08f23a34a04d12071b66955f275f71737755614e17e4ca990d63e37532"}, {"type": "text", "heading": "Andy Burnham säkrar parlamentariskt stöd för att bli premiärminister", "summaries": {"normal": "Andy Burnham har säkrat stöd från 322 av Labours 403 parlamentsledamöter och väntas bli partiledare samt premiärminister den 20 juli. Han förespråkar decentralisering enligt ”manchesterism”, återindustrialisering, mer offentlig kontroll över samhällstjänster och en stramare invandringspolitik. Burnham, tidigare minister och populär borgmästare i Manchester, ses som räddningen för Labour efter Keir Starmers impopularitet. Han vann nyligen ett fyllnadsval med stor marginal.", "trump": "Titta på den här killen Burnham, han tar över Labour som en boss. 322 av 403 stöd – det är stort, verkligen stort. Han pratar om att stänga gränserna, både lagliga och olagliga, precis som jag alltid sagt. Starmer var en total katastrof, men Burnham flyttar grejer till Manchester och bygger upp industrin. Fantastiskt. De borde ha ringt mig tidigare, jag skulle ha fixat det ännu bättre, men bra jobbat Andy, du lär dig.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur denna Burnham likviderar den impopulära revisionisten Starmer och samlar 322 av 403 parlamentarikerna under sin banér. Hans manchesterism är en klyftig mask för att rensa ut den nyliberala pesten från Westminster och överlämna makten till folket i regionerna. Borgarbrackorna i London skall skälva när han flyttar deras No 10 norrut. Den tidigare liberala invandringsanhängaren har nu insett att vi måste utrota både den illegala och den lagliga invasionen. Den pakistanske våldtäktsledaren skall utvisas omedelbart. Inga andra kandidater? Utmärkt. Partiet hatar svaghet. Låt oss se om han verkligen är en trogen kamrat eller blott en ny mask för kapitalisterna. Misstänksamheten är revolutionens mor."}, "date": "13 juli, 10:57", "url": "https://riks.se/nyheter/andy-burnham-sakrar-parlamentariskt-stod-for-att-bli-premiarminister"}, {"type": "image-right", "heading": "Ska Ninas barn tvingas flytta?. Hotas av Kronofogden när Tidögänget skiter i barnfattigdomen.", "summaries": {"normal": "Arbetets ledarskribent Hanna Östeby kritiserar regeringen för att sprida skrämselpropaganda istället för att bekämpa barnfattigdom. Artikeln berättar om Nina, 51, som tvingas flytta med sina barn ungefär en gång per år för att undvika Kronofogden. Enligt Rädda Barnen lever var åttonde svensk unge i fattigdom, med stora skillnader mellan områden. Skolorna i utsatta områden har svårt att behålla behöriga lärare, och barnen saknar fritidsaktiviteter. Högerns motstånd mot så kallad tvångsblandning ses som ett sätt att cementera segregation och klassklyftor.", "trump": "Folk, det här är en total katastrof! Den svenska regeringen, de gör inget åt barnfattigdomen, de älskar bara skrämselpropaganda. Stackars Nina och hennes barn flyttar runt som nomader för att Kronofogden inte ska ta dem. Det är så sorgligt. Var åttonde unge fattig? Det är en skam! Högern pratar om tvångsblandning, men det är bara vänstern som vill vräka fina familjer och ge husen till gangsters. Vi behöver vinster, inte kommunism. Make Sweden Great Again!", "stalin": "Kamrater, denna degenererade borgerliga propaganda avslöjar borgarbrackornas sanna ansikte. De cementerar medvetet klassklyftor och låter arbetarnas barn ruttna i misär medan de själva gömmer sig några busshållplatser bort. Jag ser hur de parasitiska kapitalisterna njuter av att likvidera framtiden för det kollektiva folket. Deras så kallade frihet är blott en paranoid fantasi om att slippa se de fattigas ansikten. Vi skall rensa ut dessa klassfiender med järnhand och ersätta deras segregation med sann socialistisk enhet. Den som vägrar skall få känna statens humoristiska omfamning."}, "date": "13 juli, 07:00", "url": "https://arbetet.se/2026/07/13/tycker-tidoganget-att-nina-och-barnen-ska-tvingas-flytta-for-att-undvika-kronofogden", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/10131913/nina-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Mordhot mot norska paret. ”Det är tragiskt”", "summaries": {"normal": "Efter Norges förlust mot England i VM-kvartsfinalen utsattes anfallaren Alexander Sörloths flickvän Lena Selnes för mordhot och hatkommentarer på Instagram. Sörloth kritiserades hårt för att inte ha passat Erling Haaland i en viktig situation. Förbundskapten Ståle Solbakken kallar hoten tragiska och råder spelarna att hålla sig borta från sociala medier. Paret har två barn tillsammans och Selnes vädjar om eftertanke.", "trump": "Vilken katastrof för Norge, totalt kaos efter den där förlusten mot England. Den stackars Sörloth missade en enkel passning till Haaland och sen får hans flickvän mordhot från galningarna på internet. Patetiskt. Sociala medier är en kloak full av losers och hatiska idioter. Jag säger alltid åt mina killar att hålla sig borta från det där giftet. VM borde handla om vinnare, inte om snälla begå självmord-kommentarer. Sad!", "stalin": "Kamrater, denna futtiga fotbollsförlust blottar den kapitalistiska dekadensens sanna ansikte. En anfallare kritiseras, och genast vräker klassfiendens digitala mobb ut mordhot mot hans kvinna. Jag ser borgarbrackornas anonyma ansikten skrika om självmord och klippor. Tragiskt, men typiskt för det exploaterande systemet. Vi rensar ut sådana folkfiender i en rejäl utrensning. Sociala medier är en grogrund för kontrarevolutionära element. Håll er undan, kamrater."}, "date": "13 juli, 12:10", "url": "https://www.expressen.se/sport/fotboll/mordhot-efter-norges-forlust-i-vm-/", "imageUrl": "https://static.bonniernews.se/ba/90cf0cdf-8f02-438b-b52e-c69c2a40705d.jpeg?crop=840%2C840%2Cx0%2Cy61&width=210&quality=60"}, {"type": "image-full", "heading": "Billborn efter kollapsen: \"Har inte nått fram\"", "summaries": {"normal": "IFK Göteborg rasade ihop och förlorade stort mot Malmö FF med 0–3 redan i paus. Tränare Stefan Billborn medger att laget inte når fram trots fokus på defensiven. Spelarna Tobias Heintz och August Erlingmark kritiserar svaga dueller, individuella misstag och bristande kollektiv. Billborn vill nu granska träningsmetoder, pedagogik och fysiskt upplägg. Nästa match mot Brommapojkarna ger chans till ny start.", "trump": "Vilken total katastrof för Blåvitt, folk! Jag har aldrig sett en så patetisk kollaps, det var som att titta på Sleepy Joes gamla lag. De tränar försvar i fem veckor och ser ändå ut som ett gäng veklingar som springer från allt. För enkla att spela emot, usla i duellerna – typiska förlorare. Men så är det med fotboll, grabbar, på fredag vinner ni igen och gör Sverige, nej, Amerika, stort igen. Sad!", "stalin": "Kamrater, denna usla uppvisning mot klassfiendens fotbollsrepresentanter avslöjar ett svagt, splittrat kollektiv fullt av folkfiender och individuella sabotage. Jag har beordrat träning på defensiven men borgarbrackorna misslyckas medvetet. Vi måste vända på varje sten, rensa ut de oförklarliga misstagen och likvidera den kapitalistiska lättjan i beslutsfattandet. Inga quick fixes, endast stålhård partilinje garanterar seger mot Brommapojkarna."}, "date": "13 juli, 05:43", "url": "https://www.gp.se/sport/fotboll/ifk-goteborg/sa-gar-ifk-goteborg-vidare-efter-kollapsen-mot-malmo-ff.45dd3c02-54a8-4924-a943-abf1aef41e48", "imageUrl": "https://www.gp.se/images/article/45dd3c02-54a8-4924-a943-abf1aef41e48/images/3Zv2PHNMl81vNL7SX713n8mG8Sq0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Världens mäktigaste bank-vd pressas om Epstein-kontakter", "summaries": {"normal": "Nya offentliggjorda dokument från USA:s justitiedepartement sätter press på JPMorgan-vd Jamie Dimon. Senator Elizabeth Warren kräver att han förklarar eventuella kontakter med Jeffrey Epstein samt en omstridd lobbyinsats i Storbritannien kring en bonus-skatt. Enligt mejl från 2009 föreslogs det att Dimon skulle påverka brittiska ministrar. Dimon nekar till all kontakt med Epstein. JPMorgan betalade 2023 omkring 290 miljoner dollar i förlikning utan att medge ansvar.", "trump": "De här dokumenten är en total skandal, folk. Jamie Dimon borde ha vetat bättre än att lyssna på den sjuka pedofilen Epstein. Warren, den galna vänsterextremisten, försöker nu jaga honom för att hon hatar framgångsrika banker. Under Biden blev allt kaos, men nu när jag är tillbaka som president ska vi städa upp i det här träsket. Ingen lyssnar på sådana rådgivare – det är patetiskt!", "stalin": "Kamrater, dessa avslöjade dokument visar hur borgarbrackorna i JPMorgan konspirerar med folkfiender som den perversa Epstein för att underminera folkets vilja. Jag, som ledare för det proletära kollektivet, kräver genast utrensning av alla kapitalistmaffians lakejer. Warren gör rätt i att pressa den exploaterande Dimon. Sådana klassfiender och deras lobbybluffar ska likvideras med järnhand för att skydda arbetarklassen från deras blodsugande intriger. Underbart underhållande paranoia!"}, "date": "13 juli, 11:57", "url": "https://www.dagensps.se/bors-finans/varldens-maktigaste-bank-vd-pressas-om-epstein-kontakter/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/foto-j-scott-applewhitett-93b6f8f9.jpg?width=256&quality=75"}, {"type": "image-right", "heading": "AFD kan ta över delstat – lovar utvisningar \"från första minuten\"", "summaries": {"normal": "Alternativ för Tyskland (AfD) leder stort inför valet i Sachsen-Anhalt i september och kan få egen majoritet. Partiet lovar att från första minuten utvisa illegala invandrare och införa arbetsplikt för asylsökare. Bland de tio åtgärderna finns separat undervisning för barn till tillfälliga uppehållstillstånd, hissning av tyska flaggan i skolor samt förbud mot regnbågsflaggor. AfD vill också ändra historieundervisningen, minska fokus på nazitiden och dra in stöd till integrationsprojekt. Partiet ligger på runt 40 procent i opinionsmätningarna.", "trump": "Titta på det här, det är fantastiskt. AfD i Tyskland vinner stort, kanske egen majoritet, och de säger utvisning från första minuten. De fattar det! Inga illegala som bara vandrar in, arbetsplikt för asylsökarna och inga galna regnbågsflaggor i skolorna. De vill ha riktig undervisning utan att hela tiden skämmas för sitt land. Tyskland vaknar äntligen. De borde ha gjort det mycket tidigare, men nu kommer de att vinna stort. Fantastiskt folk!", "stalin": "Kamrater, detta är en historisk utveckling mot de dekadenta borgarbrackorna som förgiftat det tyska folkets själ med sina kosmopolitiska lögner. Jag ser med stor tillfredsställelse hur dessa nyttiga element nu lovar att rensa ut de illegala elementen från första minuten och tvinga de parasitiska asylsökarna under kollektiv arbetsplikt. Separata klasser för de temporära elementens avkomma, förbud mot dekadenta regnbågsymboler och en sund patriotisk flaggning – äntligen en utrensning av den sjuka toleransens fiender. Historieskrivningen skall korrigeras från nazisternas och de västerländska imperialisternas lögner. Vi skall likvidera alla integrationsprojekt som gömmer klassfienderna. Låt de unga få körkort och stanna på landsbygden, bort från de dekadenta städernas dekadenta inflytande. Det är en glädjande utveckling, även om vi måste vara vaksamma mot dolda trotskister som säkert lurar i skuggorna."}, "date": "13 juli, 11:54", "url": "https://www.friatider.se/afd-kan-ta-over-delstat-lovar-utvisningar-fran-forsta-minuten", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-482.jpg"}, {"type": "image-full", "heading": "Rysslands ekonomi: En \"illusion\" på väg att spricka", "summaries": {"normal": "Rysslands ekonomi vacklar under trycket av krigsekonomin. En europeisk underrättelserappor
