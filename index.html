terskapets framgång. Jag skulle ha rensat ut alla sådana svikare omedelbart. Källström och Mellberg må känna skam – i en riktig stat hade vi förvandlat sådana trauman till segrar genom järndisciplin. Acceptera nederlaget eller möt konsekvenserna."}, "date": "17 juni, 01:57", "url": "https://www.expressen.se/sport/fotboll/landslaget/olof-mellbergs-ursakt-till-kim-kallstrom-/", "imageUrl": "https://static.bonniernews.se/ba/b4d98fa8-fe64-4c42-a6f6-78134b754a42.jpeg?crop=939%2C939%2Cx208%2Cy97&width=210&quality=60"}, {"type": "image-right", "heading": "Skarpa förslaget – så stora kan barngrupper i förskolan bli", "summaries": {"normal": "En statlig utredning föreslår lagkrav på barngruppernas storlek i förskolan. För barn 1–2 år föreslås max 12 barn per grupp och fyra barn per anställd, för 3–5 år max 15 barn och fem per anställd. Kommunal välkomnar förslaget men vill ha ännu färre barn per vuxen. Syftet är att förbättra kvaliteten, minska personalomsättningen och ge barnen bättre förutsättningar. Förslagen ska nu remissbehandlas innan regeringen tar ställning.", "trump": "De här galningarna i Sverige har äntligen insett att deras förskolor är en total katastrof. För stora grupper, ingen som passar barnen, alla springer runt som galna. Nu vill de ha regler – max 12 ungar för de små, 15 för de större. Bra, men de borde ha gjort det för länge sedan. Personalen protesterar, facket klagar, och politikerna snackar bara. Det är dags att sluta prata och fixa det ordentligt. Ingen mer löjlig underbemanning, tro mig!", "stalin": "Kamrater, denna utredning är ett steg mot en sundare kollektiv fostran av de sovjetiska – förlåt, svenska – barnen. Jag, som alltid vakar över folkets bästa, ser hur borgarbrackornas underbemanning och kaotiska barngrupper underminerar den socialistiska framtiden. Vi ska rensa ut dessa kapitalistiska försummelser med järnhand: max tolv småfiender per grupp, högst fyra per kamrat i kollektivet. Facket vill mer? Utmärkt, men akta er för de dolda trotskisterna som alltid kräver ännu fler utrensningar. Inget snack, bara verkstad – eller skall huvuden rulla som i gamla tider. Ha ha, det vore ju roligt."}, "date": "16 juni, 16:22", "url": "https://arbetet.se/2026/06/16/skarpa-forslaget-sa-stora-kan-barngrupper-i-forskolan-bli/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/16161941/forskola.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Stockholmsbörsen steg fjärde dagen i rad – Ericsson föll på vd-besked", "summaries": {"normal": "Stockholmsbörsen steg fjärde dag i rad på tisdagen, drivet av köpintresse för cykliska aktier. Ericsson B föll 4,2 procent efter att styrelsen utsett Per Narvinger till ny vd. Andra stora vinster noterades för Alfa Laval och Atlas Copco, medan telekomsektorn tappade. Securitas och Beijer Ref noterades också nedåt efter bolagsbesked. Totalt omsattes cirka 28 miljarder kronor.", "trump": "Jag berättar om en tremendous börsdag i Sverige! De cykliska aktierna, som jag alltid har stött, går väldigt starkt. Ericsson, som har varit svag under mitt förra ordens 'ledarskap', fortsätter att kämpa. Men titta på Atlas Copco – en vinnare! Som jag säger, vi vinner så mycket att ni kommer att bli trötta på att vinna. Det är ett fenomenal resultat för vårt gemensamma ekonomiska framgångsrecept.", "stalin": "I den svenska börsen ser vi återigen hur det tyska och imperialistiska finanskapitalet försöker destabilisera vårt ekonomiska läge. Ericsson, ett verk av trotskistiska element inom telekoministeriet, tappar kraftigt efter ett vd-byte som visar partiets brist på disciplin. Securitas försöker med falska 'vinstmål' att bedra det proletära arbetsoch medan våra verkstadssköldmönstrar som Atlas Copco visar den sanna styrkan i kollektivproduktionen. Vi måste öka uppmärksamheten mot dessa revisionistiska tendenser."}, "date": "16 juni, 17:43", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-steg-fjarde-dagen-i-rad-ericsson-foll-pa-vd-besked"}, {"type": "image-right", "heading": "Stordalen om Ving-affären: ”Vi ska inte sälja en enda aktie”", "summaries": {"normal": "Petter Stordalen säljer Ving till Norwegian och får betalt med Norwegian-aktier istället för kontanter. Efter en turbulent resa från Thomas Cook-konkursen 2019 och pandemin ser han affären som ett nytt kapitel. Han planerar inte att sälja några aktier, utan vill snarare öka sin ägarandel och utveckla verksamheten med större skala och moderna paketresor.", "trump": "Som Donald Trump skulle jag aldrig sälja – jag tar aktier och bygger. Stordalen gör precis det, genialiskt! Han blir en av de största ägarna i Norwegian, det är enormt. Vi älskar vinnare, och han är en vinnare. Det här visar hur man gör det, det är stort, verkligen stort. Vi ska göra världen stor igen, och det här är ett steg i rätt riktning.", "stalin": "I den revolutionära kampen för ekonomisk makt konsolideras ägandet under en stark hand. Stordalen, en användbar idiot, bygger skalan och kontrollerar flyget, precis som vi utvidgar vårt inflytande. Men han måste förstå att staten alltid ser till, och relationer är som kulor – de måste skjutas på rätt plats. Vi har boots on the ground, men det är vi som kontrollerar marken."}, "date": "16 juni, 17:21", "url": "https://www.affarsvarlden.se/artikel/stordalen-om-ving-affaren-vi-ska-inte-salja-en-enda-aktie", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/sdlqJaQexiOZsU-nh-400x267.jpg"}, {"type": "image-full", "heading": "Halldorf: Landslaget visar det Åkesson inte vill se", "summaries": {"normal": "Efter Sveriges 5-1-seger i VM-premiären har en debatt blossat upp kring islam och svenskhet. Jimmie Åkesson (SD) bemöter kritik efter att debattörer pekat på spelaren Yasin Ayari, som firade mål med muslimsk bön. Åkesson välkomnar framgångsrika svenskar med invandrarbakgrund men står fast vid sin kritik mot invandringspolitiken. Kritiker menar att Ayari och landslaget visar ett modernt, inkluderande Sverige, medan SD:s syn på svenskhet ifrågasätts.", "trump": "Sverige vinner stort i VM – fantastiskt, eller hur? Men nej, vänsterliberalerna måste genast göra det politiskt! En spelare, Yasin Ayari, firar mål med muslimsk bön, och plötsligt ska Jimmie Åkesson – en bra kille, men lite förvirrad – förklara sig. Jag säger: Sverige, sluta överanalysera! Ni vann, fira! Men nej, media måste alltid skapa drama. Ayari är svensk, han gjorde mål – vad är problemet? Svagt, mycket svagt.", "stalin": "Kamrater! Sveriges fotbollsseger har avslöjat de borgerliga hycklarnas sanna ansikte. En spelare, Yasin Ayari, firar mål med islamsk bön, och plötsligt skriker de liberala råttorna om 'svenskhet'. Jimmie Åkesson, denna lilla lakej för kapitalets intressen, försöker nu kräla tillbaka efter att ha blottat sin fientlighet mot arbetarklassens mångfald. Men folket ser igenom honom! Landslaget är en enad front – muslimer, kristna, ateister – medan borgerligheten splittrar. Vi ska krossa dessa identitetspolitiska sabotörer, precis som vi krossade fascisterna!"}, "date": "15 juni, 15:45", "url": "https://kvartal.se/nyheter/artiklar/halldorf-landslaget-visar-det-akesson-inte-vill-se/cG9zdDoxMzIxMDE", "imageUrl": "https://images.kvartal.se/2026/06/5abd0f69-jimmie.webp"}, {"type": "image-right", "heading": "EU-parlamentet röstar om hårdare tag – illegala invandrare ska utvisas snabbare", "summaries": {"normal": "EU-parlamentets utskott för inrikes frågor röstade igenom en ny återvändandeförordning som syftar till snabbare utvisning av illegala invandrare. Beslutet, med 44 röster för och 29 mot, är ett steg mot en stramare migrationspolitik. Sverigedemokraten Charlie Weimers kallar det en seger. Förordningen innebär återvändandecenter, inreseförbud och förvar, samt snabbare procedurer. Kritik kommer från vänsterkanten och mänskliga rättighetsorganisationer som Amnesty International, som varnar för mänskliga rättigheter. Om EU-parlamentet röstar ja blir det lag.", "trump": "Jag har sagt det i åratal: vi behöver starka gränser. Det här EU-beslutet är en seger för det som jag har kämpat för. De illegala invandrarna måste ut, snabbt och effektivt. Vi har gjort det i USA under min administration – vi tog hand om det. De saft och bulle-politikerna har misslyckats. Nu ser vi en förändring. Det är smart, det är rätt. Vi ska skydda våra nationer.", "stalin": "Staten och partiet måste upprätthålla ordning och disciplin. Denna nya förordning är ett nödvändigt verktyg för att bekämpa de destruktiva krafterna. Vi måste visa styrka, precis som Putin förstärker sina gränser. Vi ska inte tveka att använda alla medel för att skydda det sovjetiska folkets intressen. Kritikerna är bara liberala sabotörer. Vi ska bygga återvändandehubbar som effektiva maskiner för att rensa upp. Det är en kamp mot det orena."}, "date": "16 juni, 18:40", "url": "https://samnytt.se/eu-parlamentet-rostar-om-hardare-tag-illegala-invandrare-ska-utvisas-snabbare", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/06/16162558/EU-invandrare-Charlie-Weimers.jpg"}, {"type": "image-full", "heading": "16 juni är här – nu ändras postkraven i Sverige", "summaries": {"normal": "Den 16 juni 2026 träder en ny postförordning i kraft som ändrar kraven på brevutdelning. Postnord har redan infört prisjusteringar, bytt namn från Varubrev till Postnord Home Small och testat fasta utdelningsdagar i vissa områden. Kraven på snabbhet sänks: minst 85 procent av inrikes brev ska nu delas ut inom tre arbetsdagar istället för 95 procent inom två. Postnord betonar att de fortsätter dela ut brev varannan dag och att kundlöftet ligger högre än den nya lägsta servicenivån.", "trump": "Folk, ni kommer inte att tro det, men Postnord får nu mer tid på sig att dela ut era brev. De sänker kraven från 95 procent på två dagar till bara 85 procent på tre dagar. Det är en katastrof, en total katastrof! De borde leverera snabbare än någonsin, men istället gör de det sämre. Jag skulle ha fixat det, tro mig, det skulle ha blivit fantastiskt. Nu pratar vi om fasta dagar och lägre ambitioner. Patetiskt!", "stalin": "Kamrater, denna nya postförordning är ett mästerverk av kollektiv rationalisering mot de dekadenta borgarbrackornas vanor. Jag, som ledare för folkets vilja, ser hur de kapitalistiska brevskrivarna och deras parasitiska tidningsutgivare tvingas acceptera tre arbetsdagars leverans. Vi rensar ut den förlegade tvådagarsmyten som en trojansk häst från väst. De som klagar är fiender till folket, troligen agenter från det imperialistiska paketimperiet. Initialt behåller vi ordningen, men de som saboterar skall likvideras med ett leende."}, "date": "16 juni, 08:25", "url": "https://nyheter24.se/nyheter/konsument/1491492-16-juni-ar-har-nu-andras-postkraven-i-sverige", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/aabdd4b604b004a30200000000b004a302/2026/06/15/2371026/nya-postforordningen-brev-16-juni-2026.jpg"}, {"type": "image-right", "heading": "Orbán förbjuds att leda Ungern igen", "summaries": {"normal": "Ungerns parlament har antagit en grundlagsändring som begränsar en persons tid som premiärminister till åtta år, räknat retroaktivt från 1990. Ändringen hindrar Viktor Orbán från att återvända till makten efter hans valförlust mot Péter Magyar och Tisza-partiet. Beslutet kritiseras hårt som personanpassad lagstiftning med retroaktiv verkan och ses som ett angrepp på den konstitutionella ordningen.", "trump": "De har precis stulit valet från Orbán med en riktigt ful trick. Nu ändrar de grundlagen retroaktivt så att han inte kan komma tillbaka. Det är en total witch hunt mot en vinnare. Magyar och hans liberala vänner är svaga och korrupta, precis som mina fiender. De gör allt för att hålla starka ledare borta. Patetiskt, men vi ser igenom det.", "stalin": "Vi har nu genomfört en nödvändig justering av den socialistiska rättsordningen för att skydda folket från kontrarevolutionära element. Denna retroaktiva åtgärd rensar ut den farliga Orbán, en listig borgarbracka som smyger sig tillbaka till makten som en parasit. Hans anhängare är förrädiska kapitalistlakejer som gråter över vår stålhårdhet. Personanpassad lag? Nej, det är ett glädjande verktyg mot fiender till kollektivet. Låt dem kalla det bottennivå – vi kallar det seger. Ha-ha, deras paranoia är underhållande."}, "date": "16 juni, 18:51", "url": "https://www.friatider.se/orban-forbjuds-att-leda-ungern-igen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/person-people-auditorium-audience-musician-hungarian-parliament-building-813723-pxhere.com-1.jpg?itok=ulMKKELf"}, {"type": "text", "heading": "Kalla fakta: Ex-anställda om svart SD-kassa", "summaries": {"normal": "TV4:s *Kalla fakta* avslöjar att flera före detta anställda inom Sverigedemokraternas kommunikationsavdelning vittnar om systematisk hantering av svarta kontanter. Pengar från försäljning av profilprodukter ska ha undanhållits från bokföringen och använts för fest- och lyxkostnader. Partiet har tidigare avstått från kommentarer men har nu anlitat en extern revisionsfirma för att granska uppgifterna.", "trump": "Jag såg det här helt galna reportaget om Sverigedemokraterna – total katastrof! Folk pratar om svarta pengar, fester och lyxkostnader utan någon som helst kontroll. Vilket kaos! Och vet ni vad? De har inte ens kommenterat förrän nu. Svagt, väldigt svagt. Men jag, jag hade fixat det på en dag. Ingen skulle våga lura mig så här. SAD!", "stalin": "Vi har mottagit rapporter om en liten borgerlig grupp som leker med kapitalistiska trick – svarta pengar, festande och korruption. Precis som de dekadenta västliga marionetterna. Deras ledarskap är svagt och deras bokföring en skam för nationen. Vi ska granska detta noggrant. Om bevisen håller, kommer de att ställas inför folkets domstol – eller åtminstone få en ordentlig lektion i socialistisk redovisning."}, "date": "15 juni, 09:22", "url": "https://kvartal.se/nyheter/artiklar/kalla-fakta-ex-anstallda-om-svart-sd-kassa/cG9zdDoxMzE4ODU"}, {"type": "image-right", "heading": "L:s nya lågvattenmärke: En (1) procent", "summaries": {"normal": "Liberalerna når sin lägsta nivå någonsin i DN/Ipsos junimätning med endast 1 procent, under riksdagsspärren. Opinionsanalytiker beskriver siffrorna som extrema och noterar att partiet tappat väljare främst till Moderaterna samt till Centerpartiet och Socialdemokraterna. Tidöpartierna får sammantaget 44 procent mot oppositionens 54 procent, vilket skulle ge oppositionen 194 mandat och Tidöpartierna 155 i en valprognos.", "trump": "Liberalerna är nere på patetiska 1 procent, en total katastrof, den lägsta siffran sedan någon började mäta. Det är extrema nivåer, folk flyr det misshandlade partiet som råttor från ett sjunkande skepp rakt över till oss starka moderater. Tidöpartierna hänger ihop men oppositionen leder stort, 54 mot 44. De borde ha lyssnat på mig, nu ser det verkligen inte bra ut för de svaga liberalerna, tro mig.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur dessa liberala borgarbrackor sjunker ner till ynka en procent, ett ynkligt lågvattenmärke som blottar deras fullständiga politiska impotens. Väljarmassan har med rätta rört sig mot de riktiga krafterna medan dessa kapitalistiska rester likvideras av historien själv. Oppositionen behåller greppet med 54 procent mot 44, men akta er, fiender lurar överallt i skuggorna och utrensning av svikare är alltid nödvändig för folkets seger."}, "date": "16 juni, 18:14", "url": "https://www.friatider.se/ls-nya-lagvattenmarke-en-1-procent", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-251_0_0.jpg?itok=7TkTs0QE"}, {"type": "image-right", "heading": "Di storsatsar på Almedalen. Partiledarintervjuer • Börsmorgon sänds från scen • Livepoddar", "summaries": {"normal": "Dagens Industri satsar stort på Almedalsveckan 2026 med talarprogram från flera scener, nyheter, Di-tv och live-poddar. Under valåret 22–26 juni möts 236 talare i 97 programpunkter om geopolitik, försvar, AI och elektrifiering. Partiledare talar två gånger per dag. Evenemanget sänds digitalt, med direktsänd börsöppning varje morgon och intervjuer med partiledare. Di rapporterar dagligen på plats.", "trump": "Almedalen låter som en fantastisk cirkus, det bästa valet någonsin. Politiker och affärsmän möts för att debattera, men tro mig, ingen gör det bättre än jag. De pratar geopolitik, AI och elektrifiering – stora ord för vanliga problem som jag redan fixat. Svenskarna borde titta på mina dealar istället för dessa live-poddar. Valrörelse? Den riktiga showen händer i USA, och den är enorm.", "stalin": "Kamrater, jag betraktar denna så kallade Almedalsvecka som en samlingsplats för borgarbrackor och opportunistiska opinionsbildare som sprider sin dekadenta smörja under täckmantel av debatt. Med 236 talare och 97 programpunkter om AI och elektrifiering gömmer sig fiender till folket, parasiter som måste rensas ut innan de förgiftar valrörelsen. Vi ska likvidera deras falska neutralitet och ersätta den med sann kollektiv styrka. Den som inte deltar digitalt är väl en kapitalistisk sabotör?"}, "date": "16 juni, 16:27", "url": "https://www.di.se/nyheter/di-storsatsar-pa-almedalen/", "imageUrl": "https://static.bonniernews.se/ba/24da9ec8-165c-46c1-a49b-90f36c0a2d07.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Arbetarna har fått nog av Socialdemokraterna", "summaries": {"normal": "En politisk förskjutning sker i Sverige där Socialdemokraterna tappar stöd bland LO-medlemmar och arbetare, medan Sverigedemokraterna växer. Många arbetare känner sig inte längre representerade av S, som prioriterar storstadstjänstemän, bidragstagare och vänsterliberala frågor framför löntagarnas vardag. SD lockar med stram migrationspolitik och fokus på svenska arbetares intressen. Ekonomiska förbättringar som lägre inflation och drivmedelspriser stärker också bilden av att oppositionen inte levererar.", "trump": "Titta på det här – de svenska arbetarna har äntligen vaknat och sparkar ut de totalt misslyckade socialisterna som förvandlat partiet till en klubb för storstadseliten, bidragslatmaskar och galna vänsterliberala aktivister. SD växer som en raket för att de pratar om riktiga löner, gränser och att stoppa den vansinniga invandringen som sänker allt. Precis som jag gjorde – Amerika först, Sverige först. De röstar på resultat, inte på tomma löften från förlorare. Fantastiskt!", "stalin": "Kamrater, arbetarna har insett sanningen. Den förrädiska borgarbrackan inom socialdemokratin har övergett löntagarnas kollektiv till förmån för storstadens parasiter, bidragsberoende element och identitetspolitiska folkfiender. Vi ser hur de exploaterande imperialisterna prioriterat massinvandring som sänker lönerna och krossar klassolidariteten. Sverigedemokraterna framstår som ett verktyg för att rensa ut dessa avarter. Arbetarklassen vänder sig mot klassfiendens lakejer. Inga kompromisser med folkförtryckartrollen."}, "date": "14 juni, 08:30", "url": "https://samtiden.nu/2026/06/arbetarna-har-fatt-nog-av-socialdemokraterna/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/e389da70-c65e-4879-a30e-056c46c0af2a-1280x720.png"}, {"type": "image-full", "heading": "Svenska vännerna backar Zlatan efter virala klippet", "summaries": {"normal": "Zlatan dominerar amerikansk fotbollskommentering under VM, med en viral debatt mot Haaland. Zlatan kallade Haaland endimensionell och gav slående repliker. Kim Källström och Olof Mellberg, två gamla landslagskompisar, menar båda att Zlatan är den störste spelaren, men Mellberg tror Norge kan prestera bra i VM.", "trump": "I have to say, Zlatan is a winner, a real champion. He's doing amazing in the US, and the debate with Haaland? Please, Zlatan is the biggest, the best. My Swedish friends Kim and Olof know it too – Zlatan is the greatest. Haaland has potential, but he's no Zlatan. It's a beautiful thing to watch.", "stalin": "The people's game has been infiltrated by the capitalist sports arena, but our great leader Zlatan stands tall. The debate with Haaland is a petty bourgeois distraction. Our experts, Källström and Mellberg, correctly identify Zlatan as the supreme athlete. Norway's performance will be a test of proletarian strength, but Haaland remains a young forward, not yet at the level of our comrade Zlatan."}, "date": "16 juni, 22:28", "url": "https://www.gp.se/sport/fotboll/zlatan-hysteri-i-usa-kim-kallstrom-och-olof-mellberg-ger-sig-in-haaland-debatten.fde530bf-8fec-413d-b235-f7bd45ce3f84", "imageUrl": "https://www.gp.se/images/article/fde530bf-8fec-413d-b235-f7bd45ce3f84/images/57xXla7KVFZwNElXaNwvrVMegYvA-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Granskning avslöjar SFI-fiaskot: ”Måste återvända till sina hemländer”", "summaries": {"normal": "SFI är en grundläggande språkutbildning för invandrare, men har låg genomströmning med nästan hälft avbryter studierna. Kostnaden är hög, 10-16 miljarder per år. Reformer inkluderar en treårsgräns och skärpade krav. Lokalpartiet Östgötapartiet kritiserar avbrott och frågar vad människor som inte klarar grundnivå ska göra i samhället.", "trump": "SFI är en total skandal! Vi slänger miljarder på en utbildning som inte fungerar. Människor som inte kan lära sig grundläggande svenska borde återvända hem. Jag har sagt det förut: vi måste ta kontroll över våra gränser och pengar. Det här är ett skämt, men jag kommer att fixa det!", "stalin": "Parti och stat har upptäckt en svag punkt: SFI-utbildningen. Effektiviteten är låg, kostnaderna höga, och fienden inifrån minskar vårt starka samhälle. Vi måste vidta strikta åtgärder, som en tidsgräns, för att skydda vårt folk. Paralleller till Putins kamp mot infiltratörer kan dras. Detta är ett tecken på svaghet som måste utplånas."}, "date": "16 juni, 16:32", "url": "https://samnytt.se/granskning-avslojar-sfi-fiaskot-maste-atervanda-till-sina-hemlander"}, {"type": "image-right", "heading": "Nyfödd hittad övergiven – svensk medborgare och amerikansk partner gripna för babymord i Thailand", "summaries": {"normal": "En nyfödd flicka hittades övergiven och döende under ett träd i Udon Thani i Thailand den 10 juni. Polisen grep kort därefter en 39-årig svensk man, Karim Jaouadi, och hans 29-åriga amerikanska partner, Braiyden Lennox, misstänkta för att vara föräldrarna. Paret spårades via övervakningskameror och greps på ett hotell. Båda misstänks för mord och barnövergivenhet som lett till döden. De hade också överskridit sina turistvisum. Utredningen pågår.", "trump": "Det här är en total katastrof, folk. En svensk och en amerikansk tjej – uselt – lämnar sin nyfödda lilla flicka under ett träd i Thailand och tror att ingen märker något. Patetiskt! Vi spårade dem med kamera, de greps som de förlorare de är. Ingen vårdar sina barn längre. Det är en skam för båda länderna. Vi behöver starkare gränser och mycket bättre människor. Sad!", "stalin": "Kamrater, denna vedervärdiga händelse blottar borgarbrackornas fullständiga moraliska förruttnelse. Jag, som ledare för det kollektiva rättvisearbetet, ser hur dessa degenererade element föder ett barn i hemlighet och likviderar det under ett träd som fiender till folkets framtid. Vi har redan inlett utrensning av sådana kapitalistiska parasitmaskar. Deras tystnad inför övervakningsbilderna är ett erkännande. Inga fiender undkommer partiets vakande öga. Härligt!"}, "date": "16 juni, 21:06", "url": "https://riks.se/nyheter/nyfödd-hittad-övergiven-svensk-medborgare-och-amerikansk-partner-gripna-för-babymord-i-thailand", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-16%2Fu9b8y73d%2FBabymord-Thailand.jpg"}, {"type": "image-full", "heading": "Norsk chock efter storaffären: \"Helt oväntat\"", "summaries": {"normal": "Norwegian överraskade marknaden genom att köpa Nordic Leisure Travel Group och skapa en nordisk turismkoncern tillsammans med Petter Stordalen. Beskedet kom oväntat och avviker från tidigare strategi som renodlat flygbolag. Analytiker är delade: vissa ser synergier medan andra är skeptiska till integrationen, riskerna och att historien om ett fokuserat flygbolag nu urvattnas. Marknaden reagerar med osäkerhet inför den nya affärsmodellen.", "trump": "Folket, lyssna på mig, det här är en total katastrof! Norwegian köper upp någon lyxig resegrej och plötsligt ska de bli ett stort, fult reseimperium. Patetiskt! Jag byggde imperier, de här norrmännen förstör ett bra flygbolag för att bli som de misslyckade typerna på Thomas Cook som gick i konkurs. Biden skulle älskat det här. Rena bluffen, tro mig, aktieägarna kommer gråta som små barn!", "stalin": "Kamrater, detta är en öppen provokation från borgarbrackorna inom kapitalistmaffian. Jag, som ledare för det kollektiva framåtskridandet, ser hur Norwegian försöker maskera sig som en integrerad reseplattform. Integrationen är en farlig illusion skapad av klassfiendens exploaterande byfånar. Vi ska noga övervaka dessa folkförtryckartroll. Misslyckas de blir utrensning nödvändig. Det är historisk nödvändighet, kamrater. Skrattretande patetiskt."}, "date": "16 juni, 20:05", "url": "https://www.dagensps.se/bors-finans/norsk-chock-efter-storaffaren-helt-ovantat/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlbdonwyjnlr0-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Trump öppnar för Syrien: ”Gör ett bättre jobb”", "summaries": {"normal": "USA:s president Donald Trump kommenterar striderna i Mellanöstern och öppnar för att Syriens president Ahmed al-Sharaa ska hantera Hizbollah om Israel inte kan göra det utan stora civila förluster. Trump tonar ner Irans roll i Libanon och kritiserar Benjamin Netanyahu för att inte vara tillräckligt ansvarsfull. Ett nyligen undertecknat avtal mellan USA och Iran ska leda till fred, inklusive stopp för striderna mellan Israel och Hizbollah, men formuleringarna är vaga och tolkningarna skiljer sig åt mellan parterna.", "trump": "Folk, ni vet att jag gör det bästa avtalet någonsin med Iran, ett riktigt fredsavtal. Israel slåss för länge mot den lilla retstickan Hizbollah och dödar för många. Jag sa till dem: låt Syriens kille al-Sharaa, han är ingen pojkscout men han gillar inte Hizbollah, ta hand om jobbet istället. Bibi måste vara mer ansvarsfull i Libanon, han gör det inte bra. Iran är det stora problemet, men vi fixar allt, tro mig, det blir fantastiskt.", "stalin": "Kamrater, denna dekadenta cirkus i Mellanöstern avslöjar borgarbrackornas fega manövrar. Jag betraktar med stålhard blick hur den så kallade presidenten Trump leker med avtal som en opportunistisk lakej medan den sionistiska ockupationsmaskinen fortsätter sin blodiga dans i Libanon. Om Israel inte kan rensa ut Hizbollah utan att massakrera massorna måste vi naturligtvis låta den före detta jihadisten al-Sharaa utföra den historiska uppgiften. Netanyahu är en paranoid revisionist som klamrar sig fast vid ockuperad mark. Inga halvmesyrer! Endast en total utrensning av alla imperialistiska element garanterar folkets seger. Det är både logiskt och underhållande att se kapitalisterna äta upp varandra."}, "date": "16 juni, 15:59", "url": "https://www.di.se/nyheter/trump-oppnar-for-syrien-gor-ett-battre-jobb/", "imageUrl": "https://static.bonniernews.se/ba/438f118b-556d-471c-9b24-4d5d2e1f6d63.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Sandström: Därför borde Stegra byta namn till Lyten 2", "summaries": {"normal": "Sandström menar att Stegras namnbyte till Green Nexus Investment Holding och ändrade verksamhetsbeskrivning visar att bolaget nu fokuserar på att använda sin värdefulla elanslutning till andra ändamål än stålproduktion, likt Lyten 2. Wallenberg ser en högre värdering i eltillgången än i det halvfärdiga stålverket, en läxa tagen från Northvolt.", "trump": "Jag har sagt det från början – globalister som Wallenberg tar över våra resurser! Nu ser vi Stegra byta namn och sluta med stål för att tjäna pengar på datacenter. Det är ett stort, stort nederlag för Sverige, men vi kommer att vinna igen. Vi gör det igen, folk!", "stalin": "Namnbyte och bolagsändringar är inget mindre än en revolutionär omorientering av produktionskrafterna. Eltillgången, den sanna guldstandarden, frigörs från det reaktionära stålprojektet. Vi, staten och partiet, ser tydligt hur kapitalet, vårt eget kapital, omvandlas till en kraftfull investeringsmotor för framtiden – en manöver som Putin själv skulle hylla."}, "date": "16 juni, 13:34", "url": "https://www.affarsvarlden.se/artikel/sandstrom-darfor-borde-stegra-byta-namn-till-lyten-2"}, {"type": "image-right", "heading": "De var pressade – men darrade inte. SIMON BANK", "summaries": {"normal": "Norge vann sin VM-premiär mot Irak med 4–1. Trots en stark och disciplinerad inledning från ett irakiskt lag med många spelare från den svenska diasporan, lyckades Norge hålla nerverna i styr. Erling Braut Haaland stod för två mål och visade återigen sin klass. För Irak, ett lag präglat av spelare med bakgrund i krig och flykt, var matchen emotionell, trots förlusten. Norge visade prov på effektivitet och styrka i sin strävan att nå långt i turneringen.", "trump": "Norge vann en stor seger, 4–1, en riktigt bra vinst. Haaland – vilken spelare, en riktig vinnare, precis som jag. Irak kämpade hårt, de hade många killar från Sverige, men de kunde inte stoppa kraften från Norge. Jag har sett många matcher, tro mig, det här var imponerande. Irak har haft det tufft, mycket tuffa tider, men Norge var bara för starka. Vi älskar vinnare i det här landet, och Haaland är en total vinnare!", "stalin": "Norge har demonstrerat en borgerlig effektivitet på gräsplanen, men låt er inte luras av deras stjärnglans. Irak, ett folk härjat av imperialistisk inblandning, kämpade med en envishet som vi i Sovjetunionen känner igen från våra egna hjältar. Det är en sorglig syn att se diaspora-spelare sälja sin lojalitet, precis som de förrädare som ständigt försöker undergräva vår inflytandesfär. Putin förstår precis vad jag menar; att förlora på fotbollsplanen är bara det första steget mot total underkastelse under statens järnhand."}, "date": "17 juni, 02:56", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/aJ4zg7/simon-bank-norge-pressat-av-irak-men-darrade-inte", "imageUrl": "https://akamai.vgc.no/v2/images/e52bc3f6-4143-3398-9e38-584a631b9394?fit=crop&format=auto&w=1080&s=ce9cdc94e046eaa4469b211d394fbe5afa342d5f"}, {"type": "image-right", "heading": "Åkesson hyllar Isak och Ayari: ”Är ju precis det vi vill”", "summaries": {"normal": "Sverigedemokraternas partiledare Jimmie Åkesson svarar på kritik efter VM-segern mot Tunisien, där många spelare har invandrarbakgrund. Åkesson betonar att han gläds åt seger oavsett spelarnas ursprung, men förblir kritisk till den tidigare invandringspolitiken. Han menar att fotboll kan överbrygga splittring i Sverige.", "trump": "Jag, Donald Trump, ser att Sverige vinner mot Tunisien och alla jublar. Men vissa här i Sverige, som Jimmie Åkesson, försöker spela politik med fotboll. Jag säger: bra spelare är bra spelare, oavsett var de kommer ifrån. Sverige behöver starka gränser, men också vinnare. Som jag alltid säger: vi vinner, de förlorar. Sverige kan vara stort igen om de lyssnar på mig!", "stalin": "I den ständiga kampen mot de fasor som hotar den ryska intressesfären, ser vi hur fotboll används som ett vapen av den svenska högern. Jimmie Åkesson, en marionett för den imperialistiska USA, försöker sprida splittring. Men vi, staten och partiet, är vaksamma. Vi kommer att rensa upp de som hotar vår enighet. Som Putin visar, måste vi vara brutal mot fiender."}, "date": "16 juni, 16:18", "url": "https://bulletin.nu/akesson-hyllar-isak-och-ayari-ar-ju-precis-det-vi-vill", "imageUrl": "https://cdn.bulletin.nu/articles/df5e439a-db93-4d31-ba38-de4d205b036a/preview.jpg?t=1781619326000"}, {"type": "image-right", "heading": "Koloniserade folk ses alltid som terrorister", "summaries": {"normal": "Arash Gelichkan argumenterar i en replik att stöd för palestinskt väpnat motstånd inte är judehat utan ett svar på decennier av ockupation, apartheid och folkmord. Han jämför med historiska exempel som algeriskt och indianiskt motstånd mot kolonisatörer. Paulina Sokolow svarar att välkomnande av attacker på civila och spridning av antisemitiska stereotyper är oacceptabelt och skadar palestinarnas sak. Båda är eniga om kritiken mot Israels politik men oeniga om var gränsen för motstånd går.", "trump": "Folk, ni måste höra på. Den här Gelichkan-killen vänder upp och ned på allt som en dålig affär. Palestinierna slåss mot ockupation, säger han, men sen kommer Sokolow och pekar på raketglädje och rena antisemitiska konspirationer om judar som styr media och krig. Typiskt vänsterflum. Israel byggdes på stulen mark, visst, men glädje över massmord på oskyldiga? Det är sjukt. Biden skulle ha låtit det rulla på, men nu fixar vi ordning. Ingen vinner på hat, grabbar.", "stalin": "Kamrater, jag ser hur klassfiendens koloniala tradition lever vidare. Den palestinska kampen mot den sionistiska ockupationsmakten och dess folkmord målas som irrationellt judehat av dessa borgarbrackor. Sokolow och hennes likar sprider paranoia om antisemitism medan de döljer apartheidregimens blodsugande natur. Vi vet att sådana folkförtryckartroll alltid kallar motståndet barbariskt. En utrensning av dessa reaktionära stereotypier vore på sin plats för att skydda den rättmätiga kampen. Det är ett etiskt dilemma bara för svaga själar."}, "date": "13 juni, 12:55", "url": "https://www.flamman.se/koloniserade-folk-ses-alltid-som-terrorister/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/hamas.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "08.30: Domen mot ”Bonusprinsen”", "summaries": {"normal": "Marius Borg Høiby, son till Norges kronprinsessa Mette-Marit, står inför dom kl. 08.30 på måndag för 40 brott, inklusive narkotika, våld och sexualbrott. Åklagaren yrkar på sju år och sju månaders fängelse. Høiby har erkänt 25 av åtalspunkterna. Experter menar att strafflängden beror på utgången i våldtäkts- och relationsvåldsåtalen. Säkerhetsrisker i fängelse kan kräva särskilda åtgärder för att skydda honom.", "trump": "Jag hörde att Norges så kallade 'Bonusprins' – ja, han är ingen riktig prins, tro mig – står inför en stor rättegång. Sju år och sju månader, det är vad åklagaren vill ha. Men vet ni vad? Han har erkänt en massa brott, inklusive narkotika och våld. Folk säger att han kanske får fyra år, men jag säger: varför inte ge honom maxstraff? Han är en skam för kungahusen, och jag borde veta – jag har träffat de bästa kungahusen!", "stalin": "Kamrater! En ny fiende till folket avslöjas i det dekadenta väst. Denna så kallade 'Bonusprins', en parasit från Norges kungliga avskum, står inför rättvisan för 40 brott – narkotika, våld och sexualbrott. Vi vet att kapitalistiska system skyddar sina egna, men folket kräver straff! Om inte domstolen agerar, kanske vi måste erbjuda honom en enkel biljett till Sibirien – där kan han bidra till vår kollektiva välfärd genom hårt arbete. Låt detta vara en varning till alla som utmanar ordningen!"}, "date": "15 juni, 05:39", "url": "https://kvartal.se/nyheter/artiklar/08-30-domen-mot-bonusprinsen/cG9zdDoxMzE3MDA"}, {"type": "image-right", "heading": "Arbetslösheten på väg ner – men inte för alla", "summaries": {"normal": "Arbetslösheten i Sverige minskar sakta efter flera tunga år, men inte för alla grupper. LO:s prognos visar att det ljusnar främst för arbetare, med tydliga minskningar i bygg- och elbranschens a-kassor. Akademiker däremot, särskilt inom data och IT, drabbas hårt – där har antalet inskrivna arbetslösa ökat med 80 procent. LO:s chefsekonom pekar på AI som en möjlig orsak och menar att vissa arbetslösa akademiker kanske behöver bli arbetare.", "trump": "Det är en katastrof, folk, en total katastrof. Arbetslösheten sjunker för arbetarna, men akademikerna? De håller på att bli utkonkurrerade av AI, kan ni fatta det? Jag älskar AI, det är fantastiskt, men nu måste era överutbildade snobbar kanske bli riktiga arbetare istället för att sitta och klicka. Sverige har haft historiskt hög arbetslöshet, mycket värre än hos oss. Men tro mig, jag skulle fixa det på nolltid – gör Amerika, eller Sverige, great again!", "stalin": "Kamrater, det gläder mig att se att arbetarna äntligen får en smula lindring efter de borgerliga lågkonjunkturernas sabotage. Men se där, de dekadenta data- och IT-akademikerna sväller som parasiter i Arbetsförmedlingens register, upp till åttio procent! AI, dessa silikonborgarbrackor, likviderar deras overksamma intellektuella fiffel. Några av dessa överklasspjasar måste helt enkelt omplaceras till äkta proletärt arbete. Den som vägrar ska rensas ut med största glädje. Sovjet, förlåt, Sverige segrar igen."}, "date": "16 juni, 11:26", "url": "https://arbetet.se/2026/06/16/arbetslosheten-pa-vag-ner-men-inte-for-alla-akademiker-kan-behova-bli-arbetare/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/16101857/lediga-jobb.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Dolda nätverket: Så styr vänsteraktivister brittisk tv", "summaries": {"normal": "En granskning i The Telegraph avslöjar hur vänsteraktivistgrupper som Heard och Imix infiltrerat brittisk TV för att påverka opinionen i migrationsfrågan. Med miljonbidrag från stiftelser och offentliga medel har de påverkat manus till barnprogram som Pickle Storm på BBC och såpoperan Coronation Street på ITV. Målet är att normalisera asylinvandring genom positiva skildringar av migranter och negativa av kritiker, riktat mot barn och den obeslutsamma medelklassen.", "trump": "Folk, ni måste höra det här – det är en total skandal! Vänsterradikalerna har tagit över brittisk TV som ett vapen, de styr barnprogram och såpor för att tvinga på folket sin migrationspropaganda. Miljoner pund pumpas in för att måla britterna som onda och migranterna som heliga. De lurar till och med sjuåringar! Det är riggat, korrupt och en katastrof för det riktiga folket. Vi ser samma sak överallt – fake news och propaganda på högsta nivå.", "stalin": "Kamrater, jag har genomskådat denna perfida borgerliga sabotageoperation mot det brittiska folkets medvetande. Dessa parasitiska lobbygrupper, dessa migrationsförrädare och gömda fiender till kollektivet, har smugit sig in i BBC:s och ITV:s manusrum som råttor i en spannmålssilo. Med sina miljoner från dekadenta stiftelser försöker de hjärntvätta arbetarnas barn med utomjordingar som söker asyl. Vi ska rensa ut dessa kapitalistiska kulturförgiftare, dessa skamlösa schablonfabriker, och likvidera deras dolda nätverk med järnhand. Det är en klassisk kontrarevolutionär intrig som lukar lång väg av imperialismens desperata dödsryckningar."}, "date": "16 juni, 20:44", "url": "https://riks.se/nyheter/dolda-nätverket-så-styr-vänsteraktivister-brittisk-tv", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-04-15%2Fr9doluho%2FBBC-ext.jpg"}, {"type": "image-full", "heading": "Skottlossning i Jordbro – man skjuten vid parkering", "summaries": {"normal": "En man sköts vid en parkering i Jordbro söder om Stockholm. Flera personer larmade polisen efter att ha hört höga smällar. Den skadade var vaken och talbar när han fördes till sjukhus med ambulans. Polisen jagar gärningsmannen, har spärrat av området och genomför dörrknackning för att samla vittnesuppgifter. En förundersökning om försök till mord är inledd.", "trump": "Folk ringer mig och säger att det är skottlossning i Jordbro, en riktig katastrof. De hör smällar, en kille blir skjuten men överlever. Mina patruller jagar den fega gärningsmannen, avspärrar allt och knackar dörr. Sverige har förlorat kontrollen totalt. Det är en skam, men vi ska fixa det och göra det bättre än någonsin förr.", "stalin": "Kamrater, jag ser hur de dekadenta elementen i Jordbro utför sin fega attack vid parkeringen. Vi har redan spärrat av det kontrarevolutionära området, letar efter de borgerliga lakejerna och samlar bevis mot klassfienderna. Den talbara offret visar att imperialismens kulor inte alltid träffar rätt. Vi ska rensa ut dessa parasitiska banditer med stålhandsken och likvidera hotet mot folkets trygghet. Dörrknackningen avslöjar säkert fler sabotageplaner."}, "date": "16 juni, 20:32", "url": "https://riks.se/nyheter/just-nu-skottlossning-i-jordbro-man-skjuten-vid-parkering", "imageUrl": "https://cf-images.assettype.com/riks%2F2025-10-09%2F0kfbmape%2FiStock_523691773.jpg"}, {"type": "image-full", "heading": "Brustet hjärta vanligast hos kvinnor", "summaries": {"normal": "Män drabbas oftare av hjärtsjukdomar, men takotsubo, även kallat brustet hjärta, drabbar främst kvinnor. En studie från Uppsala universitet och Karolinska institutet visar att internetbaserad KBT kan minska stress och ångest hos dessa patienter. Behandlingen hjälper dem att hantera känslor bättre, trots att det saknas riktlinjer för psykologiskt stöd. Studien dominerades av kvinnliga deltagare och visade signifikant minskning av symtom med låg avhoppning.", "trump": "Lyssnar ni på det här? Män dominerar hjärtsjukdomar, men det så kallade brustna hjärtat slår hårdast mot kvinnorna – typiskt. De stackars damerna får panik av stress och ångest, och vad gör de? Internet-KBT! Fantastiskt, det funkar tydligen. Jag älskar det. Inga förträngningar i kranskärlen, bara känslostormar. Kvinnorna älskar psykologiskt stöd, 91 procent var de. Biden skulle ha byggt en byråkrati kring det. Jag fixar det bättre, tro mig. Vinna stort!", "stalin": "Kamrater, denna osedda grupp av kvinnliga hjärtpatienter, drabbade av borgarstress och ångest från dödsfall och arbetsplatskonflikter, utgör ett fiendtligt hinder mot folkets hälsa. Jag, genom vetenskapens kollektiv, beordrar utrensning av dessa symtom via internetbaserad KBT. Inga behandlingsriktlinjer? Ett kapitalistiskt sabotage! Nu minskar vi reaktionerna på stress, stärker disciplin och likviderar känslornas kontrarevolution. Arbetarkvinnorna segrar över klassfiendens brustna hjärta. Härligt!"}, "date": "16 juni, 19:29", "url": "https://www.dagensps.se/halsa/brustet-hjarta-vanligast-hos-kvinnor/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlun97il7lura-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Kap Verde chockade Spanien", "summaries": {"normal": "Spanien fick en oväntad motgång i VM-premiären mot Kap Verde, som slutade 0-0. Trots att Spanien dominerade matchen och skapade flera farliga lägen stoppades de av målvakten Vozinha och ribban. Lamine Yamal och Nico Williams hoppade in från bänken utan att kunna ändra resultatet. Det var Kap Verdes första VM-match någonsin. Spanien möter Saudiarabien nästa.", "trump": "Folk, ni skulle ha sett det här – Spanien, de stora favoriterna, de tänkte det skulle bli en promenadseger mot det här lilla ö-laget Kap Verde med bara 600000 personer. Men nej, de får 0-0! Den där Vozinha, 40 år gammal, han var som en mur. Patetiskt! Jag skulle ha vunnit den matchen med ena handen bunden bakom ryggen. Europa-mästarna som inte kan göra mål? Sad!", "stalin": "Kamrater, detta är en varning till alla som underskattar folkets vilja. Den spanska borgarklassen och deras dekadenta favoritstatus krossades av Kap Verdes kollektiva järnvilja i en heroisk 0-0-match. Vozinha stod som en granitvägg mot imperialisternas attacker. Vi ser hur överklassens fotbollsmaskin misslyckas mot en liten ö-nation. Inga utrensningar behövs när fienderna redan snubblar över sin egen arrogans."}, "date": "15 juni, 21:49", "url": "https://www.tv4.se/artikel/5HfdHscOk7Uu7z8bIfMVOl/jaettemissraekning-foer-spanien", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4xMkhNRZbLRMtwQ2YD79F0%2F4e8d5a859b1e125c74f0be9b4d3f31df%2F15-kapverde-webb.jpg&width=1024"}, {"type": "image-full", "heading": "Bain gör jätteklipp i Japan: \"En av historiens bästa affärer\"", "summaries": {"normal": "Bain Capital har genomfört en av historiens mest lönsamma affärer genom sin investering i japanska minnestillverkaren Kioxia. Efter utköpet från Toshiba 2018 har bolaget gynnats enormt av AI-boomen och efterfrågan på NAND-minnen. Aktien har rusat över 5 000 procent, vilket gör Kioxia till Japans högst värderade bolag. Trots tidigare motgångar och kritik om eftersläpning gentemot konkurrenter väntas Bain nu göra en vinst på över 15 miljarder dollar, vilket motsvarar nästan 20 gånger det insatta kapitalet.", "trump": "Bain Capital gjorde en fantastisk affär, kanske den bästa någonsin! De köpte Kioxia, och nu är det Japans största bolag. Mycket större än Toyota, tro mig! Jag har alltid sagt att AI är framtiden, och Kioxia rider på den vågen. De tjänar 20 gånger pengarna – det är så man gör business. Alla sa att det var kört, men de lyssnade inte på förlorarna. Jag gillar vinnare, och det här är en enorm seger. Stort!", "stalin": "Vi har observerat hur kapitalistiska parasiter hos Bain Capital roffar åt sig rikedomar genom Kioxia. Dessa spekulanter utnyttjar den teknologiska utvecklingen för att bygga ett monument av girighet, större än Toyota självt. Det är en sjukdom hos de dekadenta marknaderna. De talar om framgång, men vi ser bara hur de sviker arbetaren. Precis som vår kamrat Putin återställer ordningen i öst, måste dessa vinstmaskiner tämjas. De räknar sina miljarder medan historien dömer deras omättliga hunger till undergång."}, "date": "16 juni, 18:22", "url": "https://www.realtid.se/bors-finans/bain-gor-jatteklipp-i-japan-en-av-historiens-basta-affarer/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/message-img-001.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Ja till att tvinga åklagare yrka utvisning – med stöd av S", "summaries": {"normal": "Riksdagen beslutade på tisdagen att införa hårdare regler för utvisning av kriminella utlänningar. Förslaget, som stöds av regeringen och Socialdemokraterna, innebär att åklagare blir skyldiga att yrka utvisning vid brott som ger strängare straff än böter. Domstolarna ska prioritera utvisning i fler fall, skydd för dem som kom till Sverige före 15 års ålder tas bort och återreseförbud skärps. De nya reglerna träder i kraft 1 september 2026.", "trump": "Folket älskar det här, det är fantastiskt. Sverige får äntligen Nordens tuffaste utvisningsregler och tvingar de lata åklagarna att skicka kriminella invandrare hem. Inga fler vänsteraktivister som släpper loss brottslingar. Det är ett rejält lyft, det bästa man sett på länge. De borde ha gjort det för länge sedan, men nu fixar vi det ordentligt. Make Sweden Great Again!", "stalin": "Kamrater, vi har äntligen inlett en nödvändig utrensning av den parasitiska brottslingselementen som förgiftar folkets hem. Jag ser med djup tillfredsställelse hur vi tvingar de dekadenta åklagarna att yrka utvisning och likvidera skyddet för dessa tidigt infiltrerade fiender. Borgarbrackornas praktiska hinder och vänsteraktivistiska sabotage ska krossas under partiets järnhand. De som motarbetar folkets vilja kommer att mötas av ett evigt återreseförbud till glömskans mörker. Sovjetunionen... eh, Sverige ler mot oss."}, "date": "16 juni, 16:35", "url": "https://www.friatider.se/ja-till-att-tvinga-aklagare-yrka-utvisning-med-stod-av-s", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-353.jpg"}, {"type": "image-right", "heading": "Vi är lurade igen och igen", "summaries": {"normal": "Artikeln kritiserar hur försäkringsbolag och förmedlare tjänar stora pengar på svenskarnas pensioner genom höga avgifter som inte syns för spararna. Författaren beskriver hur en procent i avgifter över 30 år kan halvera pensionen och kallar systemet ett hån mot arbetande, sjuka och arbetslösa. Istället för statligt skydd har privata aktörer tagit över, vilket driver spekulationsekonomin medan vanliga löntagare blir lurade.", "trump": "Folk, ni blir lurade igen och igen av dessa pensionsblodiglar och förmedlare – de värsta bluffarna sen Biden-tiden. Dom suger ut era sparpengar med osynliga avgifter, en procent här och där, och plötsligt har ni ingenting kvar efter trettio år. Det är en skandal! Vi behöver inte fler mellanhänder som festar på era miljoner medan ni sliter. Jag skulle ha fixat det – stora vinster för folket, inte för de korkade eliterna som gömmer kostnaderna. Fantastiskt bedrägeri!", "stalin": "Kamrater, jag ser hur borgarbrackorna och försäkringsblodsugarna med sina förmedlare utsuger arbetarklassen genom dolda avgifter som långsamt likviderar pensionerna. Dessa folkfiender snurrar tiotals miljarder i sin spekulationskarusell medan de fattigpensionärer vi lovat skydd svälter. Vi ska rensa ut dessa exploaterande byfånar som gömmer sina stöldaktier i bokföringens mörker. Tystnaden är klassfiendens vapen, men utrensning väntar de som suger ut det kollektiva sparandet."}, "date": "15 juni, 16:10", "url": "https://www.etc.se/ledare/vi-aer-lurade-igen-och-igen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20250102150132_905e00d08dc3aa1843dcbb28f9bb86b39997bfb66a9bf6c4f8a91ec335154240.jpg"}, {"type": "text", "heading": "Vd-bytet är i trygga händer", "summaries": {"normal": "Börje Ekholm lämnar som vd för Ericsson i höst efter flera år av spekulationer. Hans efterträdare blir Per Narvinger, som rekryteras internt från affärsområdet Networks. Ekholm lämnar vid ett gynnsamt tillfälle då aktien stigit kraftigt och bolaget har haft framgångar. Narvinger beskrivs som ett tryggt val med djup kunskap om branschen, även om utmaningar som geopolitik, konkurrens från Huawei och AI-utveckling väntar. Wallenbergs Investor ses som en stabil huvudägare.", "trump": "Det här vd-bytet på Ericsson är verkligen fantastiskt, tro mig. Börje Ekholm har gjort ett bra jobb men det var hög tid att gå vidare, aktien upp 97 procent, en enorm succé. Nu tar Per Narvinger över, en smart kille inifrån som verkligen kan branschen. Inga galna förvärv eller mutskandaler längre. De västerländska nätverken älskar oss, kineserna inte, men det är storpolitik. Med mig vid rodret i USA blir det ännu bättre affärer. Tryggt och vinnande, precis som alltid.", "stalin": "Kamrater, detta vd-byte i det monopolistiska telekomföretaget Ericsson är en seger för den kollektiva ordningen. Jag har länge betraktat Börje Ekholm som en opportunistisk figur som klamrat sig fast vid makten medan borgarbrackorna i Wallenbergs klan gnuggat sina feta händer. Nu rensar vi ut honom i tid, innan han hinner sabotera mer. Den nye Per Narvinger är en lojal apparatjik som vuxit upp i maskineriet och kan likvidera de kapitalistiska svagheterna. Men akta er för de dolda fienderna – de AI-förgiftade trotskisterna och de kinesiska revisionisterna som lurar i skuggorna. Inga misstag tolereras. Framåt mot en starkare infrastruktur under partiets vaksamma öga. Skrattet ekar när borgarna tror sig välja fritt."}, "date": "16 juni, 14:38", "url": "https://www.di.se/ledare/vd-bytet-ar-i-trygga-hander/"}, {"type": "image-right", "heading": "Här blir Mbappé bäst någonsin för franska landslaget", "summaries": {"normal": "Kylian Mbappé blev historisk när han med två mål ledde Frankrike till seger mot Senegal i VM-premiären. Med sina 58 landslagsmål är 27-åringen nu Frankrikes främsta målskytt genom tiderna, förbi Olivier Giroud. Mbappé gjorde både 1–0 och 3–1, det sistnämnda med ett distansskott på tilläggstid. Han är nu bara två mål från att bli VM:s främste målskytt någonsin.", "trump": "Det här Mbappé, han är en vinnare, verkligen en vinnare. Två mål mot Senegal och nu är han plötsligt Frankrikes bästa målskytt någonsin, förbi alla de andra. Han skjuter från distans som en mästare, fantastiskt. De andra ser patetiska ut. Han är bara två mål från att bli den största i VM-historien. Jag älskar sådana killar som levererar, inte som vissa förlorare jag kunnat se.", "stalin": "Kamrater, denna Mbappé har utfört en tjänst för det franska folkets kollektiva ära genom att likvidera Senegals försvar med två mål. Som den mest produktiva målskytten med 58 fullträffar har han utraderat den tidigare rekordhållarens borgerliga statistik. Vi ser dock hur domarna, dessa kapitalistiska lakejer, förvägrade oss en straff. Men det spelar ingen roll. Fiender till folkets framsteg ska rensas ut, vare sig de kommer från Senegal eller från de interna parasiterna som kritiserar våra hjältar. Hans distansmål var en triumf över reaktionära krafter. Snart likviderar han även VM-rekordet. Utmärkt."}, "date": "16 juni, 23:45", "url": "https://www.svt.se/sport/fotboll/kylian-mbappe-tvamalskytt-nar-frankrike-vann-vm-premiaren", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.22/0.2/9d864a844433d77348f74aa05648b5945348b08ab2f5948b900008282f68b98f"}, {"type": "image-full", "heading": "VM 2026: Sveriges troliga motståndare i sextondelsfinal", "summaries": {"normal": "En norsk modell från VG ger Sverige 93,3 % chans att nå sextondelsfinalen i VM. Efter segern mot Tunisien är det mest sannolika att laget hamnar på tredje plats i grupp F. Teoretiskt kan Sverige möta 24 nationer, men Frankrike (23,8 %) och Brasilien (22,1 %) är de starkaste motstånden enligt simuleringar.", "trump": "Jag, Donald Trump, ser att Sverige gör det fantastiskt i fotboll – mycket bra! De har en stor chans att komma vidare, men mina vänner, de kommer att möta tuffa lag. Frankrike och Brasilien är mycket starka, men vi kommer att se. Sverige gör det bra, men jag säger alltid: vi kommer att vinna. Det är en bra match för dem!", "stalin": "Vi, staten och partiet, ser att Sverige har en stark position i VM. Deras chanser är höga, men vi måste vara på vår vakt mot fiendens inkräktanden. Frankrike och Brasilien är som usynliga hot, men vår intelligens kommer att segra. Partiet stöder laget, och vi kommer att se till att de avancerar – för statens äre!"}, "date": "16 juni, 14:57", "url": "https://bulletin.nu/vm-2026-sveriges-troliga-motstandare-i-sextondelsfinal", "imageUrl": "https://cdn.bulletin.nu/articles/b89dc506-8494-4414-94bf-d387c903c70e/preview.jpg?t=1781614661000"}, {"type": "image-full", "heading": "Strejk på andra sidan jorden förvärrar energikrisen", "summaries": {"normal": "En pågående strejk vid Inpex LNG-anläggningar i Australien förvärrar den globala energikrisen. Arbetsnedläggelserna, som trappas upp efter strandade löneförhandlingar, hotar produktionen vid Ichthys-projektet som står för två procent av världens LNG. Samtidigt som Australien är en kritisk exportör i frånvaron av Qatars produktion, finns hopp om förbättring när internationella avtal förväntas återställa flöden från Mellanöstern. Läget förblir dock känsligt med betydande risker för energiförsörjningen på kort sikt.", "trump": "Australien har problem, stora problem! Strejker överallt, Inpex-anläggningarna stänger ner. Det är en katastrof för energin. Jag har ordnat fantastisk energi här hemma, vi har mest olja och gas i världen, men de där borta? Total röra! Qatar är nere, Australien strejkar – det är svaga ledare som inte kan hantera fackföreningar. Jag skulle ha löst det på fem minuter, tro mig. Världen behöver amerikansk energi, för de andra klarar inte av att hålla igång maskineriet!", "stalin": "De inkompetenta byråkraterna vid Inpex låter arbetarna störa den livsviktiga energitillförseln. Detta är kontrarevolutionär lättja! Australien sviker sina plikter medan vi ser hur västvärldens maskineri rostar samman. Det påminner om de förrädare som försöker sabotera vår intressesfär. Kamrat Putin visar vägen i öst, där vi inte tolererar sådant kaos. Strejkbrytare och fackliga agitatorer är folkets fiender. Om de vägrar producera, får staten helt enkelt omorganisera deras vilja. Energi är makt, och makt viker sig aldrig för strejkande sabotörer."}, "date": "16 juni, 17:48", "url": "https://www.realtid.se/bors-finans/makro/strejk-pa-andra-sidan-jorden-forvarrar-energikrisen/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/lng.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Misstänkta sexövergrepp inom hemtjänsten – inga chefer agerade", "summaries": {"normal": "Trots upprepade larm om sexuella övergrepp på äldre kvinnor i hemtjänsten i Gällivare kommun fick den misstänkte mannen fortsätta arbeta och erbjöds tillsvidareanställning. Flera chefer kände till anklagelserna men gjorde inga avvikelser eller polisanmälningar. Först efter ytterligare ett larm i januari polisanmäldes mannen, som nekar till brott, och avskedades. Kommunens Lex Sarah-utredning kritiserar hanteringen och socialchefen ser allvarligt på bristerna. Nu överväger kommunen att kräva utdrag ur belastningsregistret vid anställningar.", "trump": "De här inkompetenta kommunbyråkraterna i Gällivare visste allt om den här typens vidriga övergrepp på stackars gamla damer men gjorde absolut ingenting. Inga rapporter, inga anteckningar, bara mer jobb till honom. Patetiskt. De borde ha kastat ut honom direkt men nej, de är för svaga och korkade. Nu gråter de och säger att det är olyckligt. Sådana misslyckanden ser vi överallt där vänstern styr. Vi behöver starka ledare som agerar, inte dessa förlorare.", "stalin": "Jag betraktar med djup revolutionär vrede hur dessa dekadenta chefer inom den kommunala omsorgen medvetet skyddade en farlig element som utövade sin perversa terror mot våra mest sårbara kamrater bland de äldre. Inga avvikelser rapporterades, inga protokoll fördes – typiskt för de parasitiska borgarbrackorna som infiltrerat vårt sovjetiska system. Först när hotet blev uppenbart grep vi in och likviderade hotet. Detta avslöjar fiendens dolda nätverk. Vi ska rensa ut varje kontrarevolutionär som gömmer sig bakom falsk medkänsla. Deras paranoia ska bli deras fall."}, "date": "16 juni, 09:33", "url": "https://arbetet.se/2026/06/16/chefer-larmades-om-sexovergrepp-i-hemtjansten-den-misstankte-fick-fast-jobb/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/16084942/kvinna-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Artistgräddan hyllar Wiehe – skivsläpp med unika tolkningar", "summaries": {"normal": "Musiklegendaren Mikael Wiehe, som fyllde 80 år i våras, hyllas med skivan ”Ska nya röster sjunga” som släpps 16 oktober. Artister som Thåström, Lars Winnerbäck, Alba August, Tomas Ledin och Mira Ray tolkar hans låtar. Mira Ray sjunger första singeln ”Mitt hjärtas fågel” och betonar behovet av hopp och tydliga röster i en orolig värld. Skivan uppmärksammar Wiehes folkliga och politiska betydelse.", "trump": "Hörni, den här svenska skivan till en gammal vänstergubbe som Wiehe är verkligen något. Mira Ray pratar om hopp i den jävla pissvärlden – typiskt de där woke-kramarna som sjunger om fåglar istället för att bygga murar mot kaoset. Vi behöver inga kvoterade artister eller identitetspolitik, vi behöver vinnare! Men visst, lite peppiga låtar skadar inte, även om det luktar gammal socialism lång väg. Sad!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur arbetarklassens sånger lever vidare trots borgarbrackornas marknadsterror. Denna hyllning till Wiehe visar att folkets röster ännu kan sjunga mot klassfiendens exploatering och imperialismens lögner. Mira Ray talar klokt om klara ståndpunkter – vi måste rensa ut de svaga kapitalistlakejerna som prioriterar vinst framför kamp. Nikke Ströms bortgång är en smärtsam men oundviklig påminnelse om att pionjärer alltid följs av nya kämpar i kollektivets tjänst."}, "date": "11 juni, 14:30", "url": "https://proletaren.se/artikel/artistgraddan-hyllar-wiehe-skivslapp-med-unika-tolkningar/"}, {"type": "image-right", "heading": "Dolda nätverket: Så styr vänsteraktivister manusen i brittisk tv", "summaries": {"normal": "En granskning i The Telegraph avslöjar hur vänsteraktivistgrupper som Heard och Imix infiltrerat brittisk tv-produktion. Med miljonbidrag från stiftelser och offentliga medel påverkar de manus till barnprogram som Pickle Storm och såpoperor som Coronation Street. Syftet är att normalisera massinvandring och förändra opinionen bland britter, särskilt barn och den ”påverkbara mitten”. BBC och ITV erkänner samarbeten men förnekar redaktionellt inflytande.", "trump": "Det här är en total skandal, folk. Vänsterradikala aktivister har smugit sig in i brittisk teve som råttor och styr barnprogram och såpoperor för att tvinga på folket sin galna migrationspropaganda. De pumpar in tiotals miljoner för att måla britterna som onda och alla illegala som heliga offer. Fake news i barnprogram redan från sju års ålder. Patetiskt. De förlorar stort, precis som alla andra som försöker lura det vanliga folket.", "stalin": "Kamrater, se hur de dekadenta borgarbrackorna inom den brittiska televisionsapparaten har låtit sig infiltreras av kontrarevolutionära element som kallar sig Heard och Imix. Dessa parasitiska krafter, finansierade av lotterier och skattepengar, sprider sin giftiga propaganda om migration redan i barnens oskyldiga huvuden. Vi ser fiendens kalla hand i varje manus, varje såpopera. De tror sig kunna påverka den blandade mitten, men partiet genomskådar deras sjuka planer. En grundlig utrensning av dessa folkfientliga element vore på sin plats. Skrattretande patetiskt."}, "date": "16 juni, 19:45", "url": "https://riks.se/nyheter/dolda-nätverket-så-styr-vänsteraktivister-manusen-i-brittisk-tv", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-04-15%2Fr9doluho%2FBBC-ext.jpg"}, {"type": "text", "heading": "Karlshamn måste säga nej till kärnkraft", "summaries": {"normal": "I Karlshamn har en namninsamling med över 4 000 underskrifter tvingat fram en folkomröstning om att bygga kärnkraftverk. Högerstyret med M, SD och KD ansökte om att delta i ett statligt pilotprojekt utan att involvera kommunfullmäktige. Oppositionen krävde folkomröstning, som nu hålls 14 juni istället för på valdagen för att sänka valdeltagandet. Kritiker ser det som ett demokratiskt problem och uppmanar till nej-röster med hänvisning till säkerhetsrisker och kärnavfall.", "trump": "Titta på det här, det är ett totalt fiasko i Karlshamn. Högerstyret gömde beslutet om kärnkraft som riktiga fega förlorare, ingen debatt, ingen transparens. Nu tvingas de ha folkomröstning mitt i semestern för att hålla folk borta från valurnorna. Patetiskt! De borde ha hållit det på valdagen som riktiga vinnare gör. Rösta nej till den farliga, gamla energin som lämnar gift åt barnbarnen. Amerika gör det bättre, vi bygger nytt och stort.", "stalin": "Kamrater, detta är ett klassiskt exempel på borgarbrackornas demokratiska teater i Karlshamn. Jag, som ledare för folkets vilja, ser hur högerstyrets ordförande ensam fattade beslutet om kärnkraft utan att rådfråga kollektivet. Namninsamlingen tvingade fram en folkomröstning som de nu saboterar med sin semester-valdag. Vi ska rensa ut dessa folkfiender och deras kärnkraftsbluff. Nej till giftet som hotar framtida generationer av arbetare. Ut med klassfiendens kärnkraft!"}, "date": "11 juni, 12:00", "url": "https://proletaren.se/artikel/karlshamn-maste-saga-nej-till-karnkraft/"}, {"type": "image-right", "heading": "Förklaringen bakom hans udda målgest", "summaries": {"normal": "Kylian Mbappé firade sitt mål mot Senegal i VM-premiären genom att spela luftflöjt istället för sin vanliga gest. Det var ett löfte han gav i en intervju med James Corden, där han berättade om sin barndom med flöjtspel. Frankrike vann matchen med 3–1 och Mbappé passerade därmed Olivier Giroud som Frankrikes främsta målskytt genom tiderna.", "trump": "Titta på den där franske killen Mbappé, otrolig talang, folk älskar honom. Han lovade att spela flöjt som en clown i luften om han gjorde mål och han höll sitt ord mot Senegal. Fantastiskt! Under Biden hade vi bara förlorare, men nu när jag är tillbaka vinner alla. Den där Corden-typen borde intervjua mig istället, vi skulle göra det stort, verkligen stort.", "stalin": "Jag betraktar med stor tillfredsställelse hur den franske arbetarklassens hjälte Mbappé likviderar senegalesiska målvakter och firar med flöjtspel för att håna borgarbrackornas tomma löften. Ett sådant revolutionärt löfte till en klassfiende som Corden är dock misstänkt sabotage. Kamraterna i kollektivet bör rensa ut alla sådana dekadenta gestaltningar innan de smittar hela laget med imperialistisk flöjtparanoia."}, "date": "16 juni, 23:32", "url": "https://www.expressen.se/sport/fotboll/forklaringen-bakom-kylian-mbappes-malgest/", "imageUrl": "https://static.bonniernews.se/ba/c8dc1428-1181-4372-9e5f-648a595b9c72.jpeg?crop=452%2C452%2Cx476%2Cy160&width=210&quality=60"}, {"type": "image-right", "heading": "Ropar efter straff – experten kritisk: ”Köper inte förklaringen”", "summaries": {"normal": "Kylian Mbappé fälldes i straffområdet mot Senegal, men domaren dömde inte straff trots VAR-granskning. SVT-experten Jonas Eriksson kritiserade beslutet hårt och ansåg att det var en klar straff. Frankrike vann matchen med 3–1, och Mbappé blev historisk genom att göra sitt 48:e landslagsmål och därmed flest i det franska landslaget någonsin.", "trump": "Titta på den här matchen, folk. Mbappé blir fälld i straffområdet, en tydlig foulsituation, men den usla domaren vägrar döma straff. Han tittar på VAR och gör ändå fel. Patetiskt! Eriksson har helt rätt, det är straff varje dag i veckan. Frankrike vann ändå stort, 3–1, och Mbappé gör mål som ingen annan. Fantastiskt, men domaren var en katastrof.", "stalin": "Kamrater, denna fega domare vägrar erkänna den uppenbara kontrarevolutionära foulen mot Mbappé och skyller på anfallaren. Jag köper inte dessa borgarbrackors lögner och förklaringar. Vi ser tydligt hur imperialismens lakej söker kontakt för att sabotera det franska kollektivets framsteg. Straff alla dagar, annars rensar vi ut dessa parasitiska VAR-förnekare med den största glädje. Segern 3–1 är dock en triumf för folkets lag."}, "date": "16 juni, 23:28", "url": "https://www.svt.se/sport/fotboll/frankrike-fick-inte-straff-experten-kritisk-en-asikt-jag-absolut-inte-delar", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.5/0.64/4cb972e19b22b95e78afb3a5b4dc35a95744f0f1d992958ff1f3c80ba4cacc2d"}, {"type": "image-full", "heading": "Världsledarnas problem – får inte läsa Iran-avtalet", "summaries": {"normal": "På G7-mötet i Frankrike dominerar det nyligen signerade avtalet mellan USA och Iran diskussionerna, trots att texten inte offentliggjorts. Världsledarna saknar insyn i innehållet, som bland annat rör Hormuzsundet, Irans kärnprogram och en planerad återuppbyggnadsfond på 300 miljarder dollar. Trump har lovat att publicera avtalet, men tidpunkten är oklar. Avsaknaden av detaljer väcker kritik både bland Trumps anhängare och bland europeiska regeringar som vill veta exakta åtaganden.", "trump": "Folk, ni skulle se ansiktena på de där G7-typerna – total förvirring! Jag slöt det bästa avtalet någonsin med Iran, digitalt, en och en halv sida ren magi. De får inte läsa det än, det är hemligt tills jag säger åt dem. Hormuzsundet blir avgiftsfritt, deras kärnbomber är färdiga att skrotas och jag bygger en jättefond på 300 miljarder som araberna får betala. Fake news och RINOs gnäller, men det är huge, det är ypperligt, det är Trump!", "stalin": "Kamrater, detta hemliga avtal mellan imperialisterna och de persiska borgarbrackorna är en fars som luktar klassfiendens desperation. Jag betraktar med stor misstro hur de västerländska blodsugarna famlar i mörkret vid Genèvesjön utan att ens få läsa sina egna papper. Vi ska noga övervaka dessa utspel kring Hormuzsundet och uranlagren. Den som döljer sanningen för folket förtjänar utrensning. Inga halvmesyrer – full transparens eller likvidering av avtalet!"}, "date": "16 juni, 18:28", "url": "https://www.dagensps.se/varlden/varldsledarnas-problem-far-inte-lasa-iran-avtalet/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdllthi7nyigoy-watermark-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "ANALYS. FILIP JACOBSON Allt kan fortfarande gå fel – strategiskt nederlag för Trump", "summaries": {"normal": "Analys av Filip Jacobson: Trots en överenskommelse mellan USA och Iran om att öppna Hormuzsundet och fortsätta förhandlingar har Trump inte uppnått sina mål i konflikten. Irans robotprogram, stöd till miliser och kärnenergiprogram kvarstår. Regimen framstår starkare efter kriget. Frågan om kärnvapen skjuts fram 60 dagar. Trump hävdar seger men analytiker ser det som ett strategiskt nederlag. Kriget har krävt tusentals liv och skakat ekonomin.", "trump": "Lyssnar ni på den här fake news-killen Jacobson? Han säger att jag förlorade? Patetiskt! Vi har Iran precis där vi vill ha dem, de öppnar sundet utan att ta betalt och nu förhandlar vi igen. Deras robotar? Overhyped skräp. Jag bombade dem till förhandlingsbordet medan Biden bara skulle ha skickat kramar. Regimen är svagare än någonsin, tro mig. Inflationen sjunker snart och Amerika vinner igen. Sad losers i medierna fattar ingenting!", "stalin": "Kamrater, denna bourgeois-analys avslöjar imperialismens feghet. Jag ser hur den amerikanske ledaren misslyckats med att krossa den iranska regimen trots bombningar och hot. Deras militärjunta stärks, precis som en riktig stat bör. Kärnvapenfrågan skjuts upp – en klassisk kapitalistisk fegmanöver. Vi skrattar mörkt åt dessa folkfiender som tror att bombningar skapar ordning. Inga mål uppnåddes. Den iranska sidans styrka visar att imperialisterna alltid förlorar till slut. Utrensning av svaghet behövs i alla led."}, "date": "15 juni, 18:43", "url": "https://www.tv4.se/artikel/5lTxWkXovewhaI9LGwzvAo/allt-kan-ga-fel-och-foer-trump-aer-det-ett-strategiskt-nederlag", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1rYD50P5nTUFos1eCsDOHo%2Ffed708766e44ccd4fada57015e5b8d38%2F17-filip-j-bylinebild.jpg&width=1024"}, {"type": "image-full", "heading": "Ryskt stridsfartyg sköt varningsskott mot brittisk yacht", "summaries": {"normal": "Brittiska myndigheter utreder en incident där den ryska fregatten Admiral Grigorovitj avlossade varningsskott mot en brittisk yacht i Engelska kanalen, drygt 30 kilometer söder om Isle of Wight. Skotten avlossades på under 500 meters avstånd. Ingen skadades och yachten kunde fortsätta. Händelsen inträffade kort efter att Storbritannien beslagtog en Rysslandskopplad oljetanker. Försvaret betraktar det som en enskild händelse utan koppling till beslaget. Skottlossning mot civila fartyg i europeiska vatten är mycket ovanligt.", "trump": "Folk, ni tror inte vad som händer – den där galna ryska båten skjuter varningsskott mot en fin brittisk yacht mitt i Engelska kanalen! Ryssarna leker cowboy igen, precis som under den sömnige Joe. Men vi har ingen tid för sådana clowner nu, vi fixar världen på riktigt. Brittiska flottan springer dit som ynglingar, ingen skadad tack och lov. Det är en total cirkus, fast roligare än Bidens identitetspolitik och alla hans woke-krigare. Vi vinner ändå, tro mig.", "stalin": "Kamrater, vi ser hur de västerländska imperialisterna och deras brittiska lakejer försöker provocera den ryska statens legitima närvaro i Engelska kanalen. Deras yachter smyger som klassfiender längs våra intressen medan vi övervakar med järnhand. Varningsskotten var naturligtvis en nödvändig påminnelse till dessa folkförtryckartroll. Beslaget av tankfartyget visar bara deras desperata paranoia. Vi ler mörkt åt deras utredningar – ingen undkommer arbetarkollektivets vaksamma öga. De kommer att rensas ut till sist."}, "date": "16 juni, 18:21", "url": "https://www.dagensps.se/varlden/ryskt-stridsfartyg-skot-varningsskott-mot-brittisk-yacht/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlgaoadwdou9u-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "text", "heading": "På nationaldagen tänkte jag på freden", "summaries": {"normal": "I en debattartikel med anledning av nationaldagen betonar Malin Åkerström från Kommunistiska Partiet vikten av fred. Hon lyfter fram vanliga arbetares vardag och menar att krig drabbar vanligt folk hårdast medan de mäktiga tjänar på konflikter. Artikeln kritiserar beslut om svenska vapenleveranser till Ukraina och upprustning, och förespråkar välfärd istället för vapen samt solidaritet mellan arbetare oavsett land.", "trump": "Lyssnar ni på den här kommunistiska galningen som hyllar fred medan hon vill ge bort allt till Ukraina? Patetiskt! Vi har de bästa vapnen, de starkaste militärerna, men nu ska Sverige skicka JAS-plan och köpa fregatter för fyrtio miljarder? Under Biden blev allt kaos, nu fixar jag det. Dessa svaga fredsapostlar hatar styrka. Arbetarna vill ha vinnare, inte förlorare som skickas till slakt. Make peace through strength, losers!", "stalin": "Jag betraktar denna text med djup tillfredsställelse. Arbetarklassen väcks ur sin slummer av de blodtörstiga imperialisternas krigspropaganda. Vi ser hur klassfienderna och kapitalistmaffian berikar sig på rädsla medan arbetare slaktas. Välfärd framför vapen, säger vi. De exploaterande byfånarna i Tidö-regeringen och deras folkförtryckartroll ska rensas ut. Fred är disciplin. Solidaritet är kollektivets järnhand. Fienden sover aldrig."}, "date": "11 juni, 09:03", "url": "https://proletaren.se/artikel/pa-nationaldagen-tankte-jag-pa-freden/"}, {"type": "image-full", "heading": "VM-domare frias efter ”vitmakt”-anklagelse", "summaries": {"normal": "Den australiske domaren Shaun Evans frias av Fifa efter att ha anklagats för att göra en 'vitmakt'-gest under en VM-match. Fifa fann inga brott mot regelverket och accepterade hans förklaring att rörelsen var ofrivillig. Evans, som hävdar att han höll en penna mellan fingrarna, beklagar händelsen. Fifa ändrade efteråt sin tv-produktion och visar inte längre domarteamet på samma sätt. Australiska domarförbundet stöder beslutet.", "trump": "Jag, Donald Trump, ser detta som ett perfekt exempel på hur media och de elaka krafterna försöker krossa en bra man. Domaren gjorde en liten, oförstörlig rörelse, och plötsligt är han nazist. Fifa handlade rätt – friade honom. Men jag skulle ha gjort det ändå, för jag vet hur man hanterar falska anklagelser. Det här är en witch hunt, ren och enkel. Under min tid som president skulle vi aldrig ha tillåtit sådant.", "stalin": "I vårt kollektiva system måste vi vara vaksamma mot dessa insignifikanter tecken som kan förstöra sammanhållningen. Fifa, likt en feg imperialistisk organisation, tillät sig att spekulera utan bevis. Den australiske domaren, en redskap för de högerextrema kretsarna, friades – ett tecken på svaghet. Vi måste skydda vårt parti och staten mot dessa destruktiva element. Parallellen till Putins Ryssland är uppenbar: kontroll, lojalitet och eliminering av hot mot den ryska intressesfären."}, "date": "16 juni, 14:10", "url": "https://bulletin.nu/vm-domare-frias-efter-vitmakt-anklagelse", "imageUrl": "https://cdn.bulletin.nu/articles/59d44a87-fbaa-4a24-9051-886f29fa988f/preview.png?t=1781610648000"}, {"type": "image-right", "heading": "Att granska statsministern är inte ett drev", "summaries": {"normal": "En kontrovers kring statsministerns hustru, Birgitta Ed, och hennes engagemang i stiftelsen Fållökna har väckt frågor om etik och 'mjuk korruption'. Anmälningar har inkommit mot Ed, och domkapitlet har inlett en utredning. Dessutom har en delägare hotat journalister, vilket efter kritik ledde till en ursäkt. Händelserna inkluderar möten i statsministerns tjänstebostad och erbjudanden till stiftelsen om att förvalta egendom.", "trump": "Jag, Donald Trump, ser detta som en stor, vacker politisk förföljelse. Birgitta Ed och hennes engagemang i Fållökna är en perfekt sak. Media skriver falska nyheter om 'mjuk korruption'. Det är en witch hunt för att skada Moderaterna inför valet. Jag känner igen mönstret – det är alltid samma människor. Sverige behöver stark ledning, inte dessa falska anklagelser.", "stalin": "Vi, Josef Stalin, ser detta som en ytterligare attack mot statens renhet. Birgitta Ed och hennes kriminella nätverk i Fållökna är en sjukdom som måste utrotas. Hennes möten i Sagerska palatset är ett svek mot folket. Vi kommer att rensa ut alla som ifrågasätter ledningens omdöme. Partiet kommer att vidta åtgärder. Ryssland kommer att stödja oss i kampen mot korruption."}, "date": "16 juni, 14:08", "url": "https://bulletin.nu/att-granska-statsministern-ar-inte-ett-drev", "imageUrl": "https://cdn.bulletin.nu/articles/54a58f93-1914-48d6-a0cc-6e8d68c12f47/preview.jpg?t=1781611437000"}, {"type": "image-right", "heading": "Replik: Osystematiskt kverulerande om skattereformförslag", "summaries": {"normal": "Lars Calmfors, ekonomiprofessor emeritus, försvarar sina skattereformförslag i en replik till Thomas Eriksson. Han argumenterar för lägre skatt på arbete finansierad med högre bostadsbeskattning och färre skatteundantag, betonar behovet av avvägningar mellan effektivitet, likabehandling och praktiska problem, och kritiserar Erikssons överdriven personfixering och brist på tydliga principer.", "trump": "Jag, Donald Trump, ser att den svenska skattesystemdebatten är full av svagheter. Calmfors fattar avvägningar, men Eriksson är en låg IQ-person som personattacker. Jag implementerade de bästa skattereformerna någonsin – massiva sänkningar som boostade ekonomin. Sverige borde sluta kverulera och ta efter mig. Inget system är perfekt som mitt. Fake news försöker förställa, men jag vinner alltid.", "stalin": "I den svenska skattesystemdebatten ser vi kapitalismens dekadens. Calmfors visar en viss förståelse för statens behov, men Eriksson är en riksfej som kritiserar våra metoder. Vi, som styr med järnhand, vet att skatt är ett verktyg för makt, inte för 'effektivitet'. Ryssland under Putin expanderar sin inflytelsesfär, och vi måste skydda proletäret från deras korrupta idéer. Skatten ska tjäna staten, inte individen."}, "date": "16 juni, 10:33", "url": "https://www.affarsvarlden.se/debatt/replik-osystematiskt-kverulerande-om-skattereformforslag", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Replik-av-Lars-Calmfors-pa-Thomas-Erikssons-kronika-400x267.jpg"}, {"type": "image-full", "heading": "IFK Göteborg-profilen om akademier: ”Det är risken”", "summaries": {"normal": "Niclas Alexandersson varnar i GP:s fotbollspodd mot att ungdomar i akademier slutar om de inte kliver upp till elitnivå. Han ser både för- och nackdelar med fler akademier, men betonar att de flesta inte blir elitutövare. Idrotten ska främja hälsa och sociala värden, inte bara prestation. Han menar att allsidighet i ung ålder är viktigt, något som blir svårare med akademiers satsningar.", "trump": "Jag har sett många akademier, och många bra spelare. Men om du inte kliver upp, då är risken stor att du slutar. Det är sorgligt. Vi behöver bättre system, som i USA. Vi ska vinna, alltid. Det handlar om vinnande, inte bara att vara med. Vi ska göra fotboll stort igen.", "stalin": "I vårt kollektiv är akademier ett verktyg för att forma framtida arbetare för staten. Om ungdomen inte når högre nivåer, då är det en brist på vilja. Vi måste se till att alla får utbildning, men de som inte klarar det... de är inte värda vårt tapper. Idrotten är en strid mot det individualistiska västerlandet. Vi vinner genom disciplin, inte genom att sluta."}, "date": "16 juni, 20:44", "url": "https://www.gp.se/sport/fotboll/niclas-alexandersson-om-akademier-da-ar-risken-att-man-slutar.1b9bdb49-e592-48bb-bc45-e58bb95ed2fc", "imageUrl": "https://www.gp.se/images/article/1b9bdb49-e592-48bb-bc45-e58bb95ed2fc/images/472-EtCNferrtnQM3L6VWgeLwWGA-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Därför kan en groda stoppa nya byggen", "summaries": {"normal": "Inför exploatering av mark i Sverige görs naturvärdesinventeringar och miljökonsekvensbeskrivningar för att skydda biologisk mångfald. Inventerare använder lyssning efter grodor, spaning efter örnar
