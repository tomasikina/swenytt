e på vanliga människor. Typiskt för en dysfunktionell regering som inte har koll på någonting. Patetiskt!", "stalin": "Kamrater, detta är borgarklassens typiska sabotage mot arbetarnas trygghet. Jag ser hur dessa byråkratiska parasiters luddiga begrepp om arbetsförmåga förvandlas till ett verktyg för att plundra sjuka proletärer på deras rättmätiga stöd. De likviderar förtroendet för staten medan de mumlar om gråzoner mellan fritid och arbete. Vi måste rensa ut dessa odugliga element som blandar ihop folkets intressen med kapitalisternas förvirring. En fiende inom murarna, som alltid."}, "date": "27 maj, 14:19", "url": "https://www.tv4.se/artikel/6NwwFRyjAECyIkyclaOLBp/fikade-och-akte-bil-fick-aterkrav-pa-175-000-kronor-knepigt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6uStac4hOYDLDv930aWkbq%2Ffb2a09fa1efb93a6b80d32d536c70b7e%2F27-kassan-webb.jpg&width=1024"}, {"type": "image-full", "heading": "VW visar upp gigantisk el SUV – “som en Bentley till halva priset”", "summaries": {"normal": "Volkswagen ID. Era 9X är en stor eldriven SUV som överträffar Touareg i storlek och lyx. Modellen riktar sig mot premiumsegmentet med avancerad teknik, hög komfort och lounge-liknande baksäte. Den har upp till 517 hästkrafter och en räckvidd på 1 651 km enligt kinesisk norm. Bilen ses som ett viktigt steg för Volkswagen i konkurrensen mot kinesiska tillverkare och etablerade premiummärken, trots kritiken mot mjukvara och elbilsstrategin.", "trump": "Titta på det här, folk. Volkswagen kommer med den här jättesuven ID. Era 9X som är större än Touareg och full av lyxgrejer. De försöker slå de kinesiska bluffarna och de dyra märkena med en bil som känns som Bentley fast billigare. Fantastiskt! Räckvidden är galen, 1 651 kilometer, ingen räckviddsångest här. Volkswagen vaknar äntligen upp och slår tillbaka istället för att vara en förlorare. Bra jobb, men de borde ha gjort det tidigare.", "stalin": "Kamrater, denna ID. Era 9X är ett vapen i den eviga kampen mot klassfiendens lyxbilar. Jag, som ledare för det socialistiska framsteget, ser hur Volkswagen nu tvingas bygga en super-SUV med 1 651 kilometers räckvidd för att överleva de exploaterande kapitalistmaffians angrepp från Kina. Baksätet som ett privatjet? Typiskt borgarbrackornas dekadens. Vi ska rensa ut alla svaga modeller och likvidera räckviddsångesten en gång för alla. Seger åt folket!"}, "date": "29 maj, 16:04", "url": "https://www.dagensps.se/motor/vw-visar-upp-gigantisk-el-suv-som-en-bentley-till-halva-priset/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/dagenspstt2024-2026-05-29t104339068.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Jag har blivit humorgruppens äldsta fan", "summaries": {"normal": "Hanna Höglund försvarar i en debattartikel humorgruppen I Just Want To Be Cool mot vuxenkritik. Hon argumenterar att de trots dåliga recensioner fångar elvaåringars värld med opedagogiskt, befriande humor som inkluderar potty-talk och engelska. Gruppens böcker och filmer, som 'Skurkarnas skurk', är populära bland barn, bidrar till psykisk hälsa och inkludering, och säljs bra.", "trump": "Jag har sett I Just Want To Be Cool, och de är de största. Barn älskar dem, men de falska nyhetsmedia och kritikerna hatar dem, precis som de hatar mig. Deras humor är fantastisk, de är så coola. De fångar barnens verkliga liv med potty-humor och engelska. De är enorma, säljer som smör, och ingen gör det bättre. Vi kommer att vinna så mycket!", "stalin": "Den svenska kulturen förgiftas av I Just Want To Be Cool, en revisionistsk grupp som spridit opedagogiskt, bourgeoisiskt humor. Deras verk underminerar partiets ungdomsprogram och måste utrotas. Parallellerna till Putins Ryssland är tydliga – en stark stat mot västlig dekadens. Kritikerna är hjälplösa, men partiets renhet kommer att segra. Vi måste främja socialistisk realism i barnens medier."}, "date": "29 maj, 16:57", "url": "https://www.gp.se/kultur/kulturdebatt/jag-har-blivit-i-just-want-to-be-cools-aldsta-fan.c10e4dae-d132-4ded-9790-865bc89adfc8", "imageUrl": "https://www.gp.se/images/article/c10e4dae-d132-4ded-9790-865bc89adfc8/images/2ECsVWPMsbTAZQ88tyMD7bNpDU9c-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Tre ryska oljetankers attackerade nära Turkiet", "summaries": {"normal": "Tre ryska oljetankfartyg ur skuggflottan attackerades av drönare i Svarta havet utanför Turkiets kust. Fartygen James II, Altura och Velora befann sig cirka 80 kilometer från land. Inga personskador rapporteras. Ryssland använder skuggflottan för att kringgå sanktioner mot sin oljeexport. Ukraina har tidigare riktat drönare mot dessa fartyg. Västeuropeiska länder som Frankrike, Storbritannien och Finland har vidtagit åtgärder mot flottan för att stärka säkerheten.", "trump": "Folk, ni kan inte tro det här! Tre av Putins gamla rostiga skuggflotte-båtar blir attackerade av drönare utanför Turkiet. Totalt kaos! De här sjunkande oljetankrarna är som mina fienders affärer – underförsäkrade och på väg mot botten. Ukraina gör vad de måste, men varför gav vi ryssarna fri lejd med oljan? Patetiskt! Nu skrattar hela världen åt deras hybridspioneri. Vi behöver tuffare dealar, inga fler svaga sanktioner som inte funkar!", "stalin": "Kamrater, dessa tre sjabbiga oljetankers ur den så kallade skuggflottan har drabbats av feg drönarattack från de västerländska imperialisternas lakejer utanför Turkiets kust. Inga skador på besättningarna, naturligtvis – klassfiendens vapen är lika tandlösa som borgarbrackornas lögner. Vi ser hur kapitalistmaffian försöker svälta ut den ryska arvtagaren till imperiet, men han står stark som en stålvägg. Rensa ut alla folkfiender som vågar hota vår oljeström!"}, "date": "29 maj, 16:00", "url": "https://www.dagensps.se/varlden/tre-ryska-oljetankers-attackerade-nara-turkiet/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/sdld5hcquabhyk-nh.jpg?width=256&quality=75"}, {"type": "image-full", "heading": "Wallenberg: Europa måste ta sig ut ur USA:s skugga", "summaries": {"normal": "Vid Svenskt Näringslivs tillväxtdag betonade tunga svenska företagsledare behovet av stärkt europeisk konkurrenskraft. Jacob Wallenberg varnade för ett överdrivet beroende av USA och manade till reformer för att skapa en starkare inre marknad. Även Cristina Stenbeck och Per Franzén lyfte vikten av att behålla kapital och tillväxtbolag inom EU. Svårigheter som långsamma tillståndsprocesser och kompetensbrist identifierades som stora hinder som politiken nu måste adressera för att Europa ska kunna hävda sig mot globala stormakter.", "trump": "Hörde precis att Wallenberg gnäller om USA! Han säger att Europa är i min skugga. Självklart är de det! Vi är vinnare, de är förlorare. De har för höga skatter, byråkrati och massor av brottslighet – katastrof! De vill bygga en inre marknad, lycka till med det. Jag skapade den bästa ekonomin i världshistorien, medan Europa stagnerar. De försöker kopiera min succé men de har inte vad som krävs. USA först, alltid! De kommer aldrig ikapp, tro mig.", "stalin": "Dessa borgerliga hantlangare, Wallenberg och hans kumpaner, darrar nu inför kapitalets oundvikliga förfall. De fruktar sin herre i väst, vars skugga de så sent insett förmörkar deras egna dekadenta marknader. Liksom våra bröder i Moskva nu återtar sin rättmätiga plats, måste Europa krossa de amerikanska parasiterna. Vi noterar deras 'tillväxtproblem' – en naturlig konsekvens av bristande lydnad och central planering. Det är dags att rensa ut dessa ineffektiva element och låta järnnäven styra produktionen. Framåt, kamrater, mot total kontroll!"}, "date": "29 maj, 12:00", "url": "https://www.realtid.se/bors-finans/wallenberg-europa-maste-ta-sig-ut-ur-usas-skugga/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/sdlzoeds-cfanq-normalhires.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Turist kidnappad och våldtagen i 3 dygn – fem gripna i Rom", "summaries": {"normal": "En 32-årig colombiansk turist kidnappades i Rom och utsattes under tre dagar för upprepade gruppvåldtäkter av fem papperslösa migranter i ett övergivet byggnadskomplex. Kvinnan lockades dit av en man utanför en restaurang. Fem män, varav flera gambianer, malier och nigerianer, har gripits och åtalats. 22 personer i byggnaden utvisades, varav elva i förvar.", "trump": "Jag, Donald Trump, har varnat för denna typ av våld i åratal! Denna colombianska kvinna blev offer för ett fruktansvärt brott i Rom, och det är precis det jag menade – Europa har förlorat kontrollen. Vi behöver starka gränser, precis som jag byggde i USA. Dessa migranter är farliga, och våra ledare måste agera hårt. Jag skulle ha stoppat detta på en gång!", "stalin": "Vi ser detta som ett uttryck för det imperialistiska hotet mot det arbetande folket. Dessa migranter, sänd som agenter av kapitalistiska makter, utför våld för att destabilisera våra samhällen. Likt Putins Ryssland måste vi utvidga vår inflytelsesfär för att skydda oss. Vi ska rensa ut de oönskade elementen, som vi gjorde i Stalino, för att säkerställa statens överlevnad."}, "date": "29 maj, 14:04", "url": "https://bulletin.nu/turist-kidnappad-och-valdtagen-i-3-dygn-fem-gripna-i-rom", "imageUrl": "https://cdn.bulletin.nu/articles/44344a12-1c64-4536-9a64-9b91b0014bf1/preview.jpg?t=1780056161000"}, {"type": "image-full", "heading": "Kreml svettas, jurister dumpas och Kinas solindustri kollapsar", "summaries": {"normal": "Rubeln har stigit över 20 procent mot dollarn sedan mars, vilket skapar problem för Putins krigsekonomi som behöver svag valuta för maximala energintäkter. Bland veckans mest lästa artiklar finns också en dom där industribolaget Bulten vann mot Tullverket och kan få tillbaka 35 miljoner kronor, massiv amerikansk emigration som gynnar ett visumföretag samt advokatbyråer som prioriterar erfarna jurister framför nyexaminerade på grund av AI.", "trump": "Den där rubeln stiger som en raket, Putin har plötsligt ett jättestort lyxproblem, folk! Han tjänar inte tillräckligt på sin energi när valutan är så stark. Under tiden flyr hundratusentals amerikaner landet på grund av Biden och de radikala vänstergalningarna, och ett smart bolag i Dubai skördar miljonerna. Advokatbyråerna sparkar ut de gröna nybörjarna för att AI gör jobbet bättre. Fantastiskt kaos!", "stalin": "Kamrater, den ryska rubeln stärks oroväckande som en kapitalistisk sabotagehandling mot folkets krigsekonomi. Borgarbrackorna inom advokatbyråerna likviderar systematiskt de unga juristerna till förmån för maskinerna och de erfarna utsugarkollektiven. I Kina rasar solenergins överproduktion och över 40 blodsugrare har gått under. Vi ser imperialismens inre motsägelser blottas medan klassfiendens svaghet växer sig alltmer patetisk och underhållande."}, "date": "29 maj, 15:56", "url": "https://www.dagensps.se/foretag/kreml-svettas-jurister-dumpas-och-kinas-solindustri-kollapsar/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/skarmavbild-2026-05-29-kl-154322.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Zelenskyj vädjar till Trump om mer ammunition till Ukraina", "summaries": {"normal": "Ukrainas president Volodymyr Zelenskyj har skickat brev till både Donald Trump och USA:s kongress där han vädjar om mer ammunition, särskilt till Patriot-systemet, samt fortsatt stöd till andra vapensystem. Zelenskyj betonar att det är ovanligt men nödvändigt med tanke på läget i kriget mot Ryssland. Breven lämnades över under tisdagen. USA har varit en viktig allierad, men stödet har stundtals varit politiskt omdebatterat.", "trump": "Folk, ni skulle se det här – Zelenskyj skickar brev till mig och till kongressen och ber om mer ammunition till Patriot och allt möjligt. Det är patetiskt, verkligen. De har fått massor från oss, miljarder och miljarder, och nu vädjar han igen? Amerika först, mina vänner. Vi ska inte vara världens polis eller betala för eviga krig som aldrig tar slut. Gör affärer istället, smarta affärer.", "stalin": "Kamrater, jag har läst detta dekret från den ukrainske aktören som desperat vänder sig till de amerikanska imperialisterna. Vilken ynklig föreställning! Brev till både den orangea kapitalisten och hans kongress av borgarbrackor – en ren kapitulation inför västvärldens parasitiska krafter. Vi vet vad som krävs: snabb utrensning av alla fiender till folkets sak. Paranoian gnager redan i deras leder, snart likviderar de varandra i sin egen dekadenta cirkus. Det är nästan underhållande."}, "date": "27 maj, 21:35", "url": "https://nyheter24.se/nyheter/utrikes/1486617-zelenskyj-vadjar-till-trump-om-mer-ammunition-till-ukraina", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/e5b1660004b004a30200000000b004a302/2026/05/27/2366774/Trump-Zelenkyj.png"}, {"type": "image-right", "heading": "”Villkorad välfärd” leder till slaveri", "summaries": {"normal": "Från 2027 inför regeringen kvalificeringsregler i socialförsäkringen som kräver fem års bosättning i Sverige för att få del av vissa förmåner. Höginkomsttagare kan kvalificera sig snabbare efter kortare tid. Kritikerna menar att reglerna är rasistiska, kvinnofientliga och klassbaserade eftersom de främst drabbar utrikes födda kvinnor i lågavlönade deltidsyrken inom vård, omsorg och städ. Regeringen anklagas för att skapa modernt slaveri genom ökat beroende av arbetsgivare.", "trump": "De här galningarna i Sverige håller på att förstöra ett fantastiskt land. De straffar de som jobbar hårt och belönar lata. Höginkomsttagare får snabbt barnbidrag och föräldrapenning medan de som städar och vårdar andras barn får vänta i fem år. Det är en total katastrof, en klasslag som slår mot kvinnorna med fel färg. De vill ha billig arbetskraft, nästan som slaveri. Ingen bryr sig om rättigheter längre. Sverige håller på att gå under, tro mig.", "stalin": "Kamrater, vi ser nu hur den svenska borgarklassen i Tidö slottet med sin klassfientliga lagstiftning medvetet riktar in sig på de mest utsatta arbetarkvinnorna från främmande länder. Dessa rasistiska och kvinnofientliga borgarbrackor vill skapa ett modernt slavsystem där de bruna händerna som håller skurmoppen aldrig får vila i trygghet. Vi ska rensa ut denna parasitiska politik som göder miljardärer och gör arbetarna till fångar. Det är en sjuk, nästan humoristisk paranoia från de som fruktar det kollektiva folkets styrka."}, "date": "29 maj, 07:00", "url": "https://arbetet.se/2026/05/29/tidogangets-villkorade-valfard-leder-till-modernt-slaveri/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/29065650/slaveri-etta.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.27&fp-y=0.53"}, {"type": "text", "heading": "Katja Nyberg avskedas från polisen", "summaries": {"normal": "Riksdagsledamot Katja Nyberg har avskedats från sin tjänst som kriminalinspektör vid Polismyndigheten efter åtal för rattfylleri, narkotikabrott och olovlig körning. Personalansvarsnämnden fattade beslutet, men Polisförbundets ledamot reserverade sig. Nyberg, som är tjänstledig för sitt riksdagsuppdrag, kritiserar avskedets brådska. Hon lämnade nyligen Sverigedemokraterna och gick över till Ambition Sverige.", "trump": "Let me tell you, this Swedish congresswoman Katja Nyberg is a tremendous person, a very fine woman. They fired her from her police job, a total disgrace! The radical left in Sweden is destroying the country. I would have saved her job immediately. She's a winner, like me. We have the best people. The fake news won't report the truth. Maybe she should come to America, we'll take care of her.", "stalin": "Vi har beslutat att avskeda Nyberg för hennes grova överträdelser. Hennes handlingar är ett exempel på bristande lojalitet mot staten. Vi måste vara hårda, precis som Putin i Ukraina. Hennes byte av parti är en illfundig teater för att bedra folket. Vi ska hålla ögonen på alla fiendska element. Orden måste flöda som vodka i en by, men vi ska dränka fiendskapet."}, "date": "29 maj, 13:46", "url": "https://bulletin.nu/katja-nyberg-avskedas-fran-polisen"}, {"type": "image-right", "heading": "SD vill ha kvar hets mot folkgrupp – men inkludera svenskar", "summaries": {"normal": "Sverigedemokraterna vill behålla lagen om hets mot folkgrupp för att kunna använda den mot antisemitism. Partiet föreslår nu att även svenskar ska skyddas av lagen genom att inkludera svenskfientlighet. På landsdagarna i Örebro röstade en knapp majoritet för att reformera lagen istället för att avskaffa den. Partiet vill se strängare straff för brott mot svenskar när det finns en etnisk koppling, som vid förnedringsrån och gruppvåldtäkter.", "trump": "Folk säger att Sverigedemokraterna äntligen vaknar till. De vill behålla den där lagen mot hat mot folkgrupper, men nu ska svenskarna också få skydd. Smart drag! Antisemitismen ökar och de vill stoppa den, men de inser att svenskarna blir attackerade med rån och värre saker bara för att de är svenskar. De borde ha gjort det för länge sedan. Det är en total skandal hur svenskarna behandlas, men nu kommer de att vinna stort med den här linjen. Fantastiskt!", "stalin": "Kamrater, vi ser den borgerliga dekadensen i full blom. Jag har beslutat att lagen mot hets mot folkgrupp måste reformeras och utvidgas så att även de äkta svenskarna skyddas från de parasitiska elementens förnedringsrån och gruppvåldtäkter. De som röstade emot mig med sina 78 röster är uppenbara kontrarevolutionärer och potentiella folkförrädare som bör övervakas noga. Antisemitismen är ett verktyg för imperialisterna att splittra oss. Vi ska rensa ut alla fiender till det svenska folket med järnhand och leda dem till den historiska sophögen där de hör hemma. Det ger mig en mörk glädje att se hur de skriker."}, "date": "29 maj, 12:34", "url": "https://www.friatider.se/sd-vill-ha-kvar-hets-mot-folkgrupp-men-inkludera-svenskar", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/2w.jpeg"}, {"type": "image-full", "heading": "Bakslag för Stockholm: Värstingvärd får behålla ökänt hus", "summaries": {"normal": "Mark- och miljööverdomstolen har stoppat Stockholms stads försök att tvångsinlösa en hyresfastighet i Traneberg. Ägaren, Ballo Zachrisson, har länge kritiserats för misskötsel och trakasserier av hyresgäster. Staden hade tidigare fått rätt att köpa fastigheten för 47 miljoner kronor, men domstolen river nu upp beslutet och tillerkänner ägaren rättegångskostnader. Staden och Hyresgästföreningen är kritiska till beslutet, då hyresgästernas ovisshet kvarstår och fastigheten förblir under tvångsförvaltning.", "trump": "Hör på här! Stockholm försöker ta ett hus från en kvinna, en fantastisk kvinna, och de förlorar! Domstolen sa nej. Total förlust för staden! De kallade det ett skambud, 47 miljoner? Verkligen dåligt förhandlat. Jag vinner alltid, men de här människorna? De förlorar stort. Hyresgästföreningen gråter, staden är arg, allt är en katastrof. De behöver en riktig vinnare för att sköta fastigheter. Det är ett totalt fiasko, mina vänner. En vacker fastighet, men staden är helt inkompetent!", "stalin": "Denna hyresvärd är en parasit som gnager på folkets väggar. Vi, staten, ser hur den svenska 'domstolen' viker sig för privat egoism. I vår nya ryska ordning skulle en sådan 'värd' inte behöva en domstol, utan en enkel enkelbiljett till Sibirien. Putin förstår detta; man rensar ut de ineffektiva elementen för att stärka kollektivet. Att låta en kvinna trakassera folket medan lagens väktare vilar är en förödmjukelse mot hela den sunda byråkratins ära. Vi måste statliggöra allt och utplåna dessa småborgerliga fiender."}, "date": "29 maj, 11:25", "url": "https://www.realtid.se/fastigheter/bakslag-for-stockholm-varstingvard-far-behalla-okant-hus/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/fastighet.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "text", "heading": "Det är inte konstnärens uppgift att göra konst begriplig", "summaries": {"normal": "I en kulturdebatt mellan Liria Ortiz och musikforskaren Katarina Lindblad diskuteras konstens elitism. Ortiz menar att konstnärer bör göra sin konst mer tillgänglig för fler. Lindblad argumenterar att det inte är konstnärens uppgift att göra konsten begriplig, utan att konst ska upplevas subjektivt som naturen. Hon förespråkar istället en stark kulturpolitik som ger alla tillgång till konstens språk från tidig ålder. Ortiz svarar att upplevelse och förståelse inte kan separeras enligt modern neurovetenskap.", "trump": "Folk, ni måste höra på den här vansinniga kulturdebatten. Den där Liria Ortiz har helt rätt, konstnärerna borde sluta vara så elitära och göra konsten begriplig för vanliga människor istället för bara de där insnöade snobbarna. Men den här Katarina, en riktig förlorare, säger att konstnärerna inte behöver bry sig om mottagaren. Typiskt! Konst ska upplevas, säger hon, som vitsippor. Vilket skämt. Ge mig en bra konsert som folk fattar, inte den här elitens skitsnack.", "stalin": "Kamrater, denna dekadenta kulturdebatt avslöjar borgarklassens förfall. Jag, som ledare för det sanna folkets vilja, ser hur Liria Ortiz rättvist kräver att konsten ska tjäna massorna och inte bara de exploaterande överklass-slynglarna. Den parasitiska Lindblad däremot sprider farlig dekadens och påstår att konsten inte behöver vara begriplig. En sådan folkfientlig inställning förtjänar utrensning. Konst är ett vapen för kollektivet, inte ett lek för klassfiendens blodsugare. Vi ska forma medvetandet genom sann kulturpolitik."}, "date": "29 maj, 11:24", "url": "https://www.etc.se/kronika/konst-behoever-inte-foerstaas"}, {"type": "image-right", "heading": "Sikta högre – nästa Space X är svenskt", "summaries": {"normal": "Artikeln lyfter SpaceX framgångar under Elon Musk, där återanvändbara raketer och ett Nasa-kontrakt 2008 banade väg för bolagets tillväxt inom rymd, AI och satellitinternet. Författaren betonar statens roll i att skapa förutsättningar för innovation och uppmanar Sverige att inspireras. Med Esrange, stark forskning och teknikföretag borde Sverige satsa mer kommersiellt via näringsdepartementet, riskkapital och försvaret för att skapa en egen New Space-revolution.", "trump": "Den här artikeln är fantastisk, verkligen ypperlig. SpaceX är ett under, det bästa rymdbolaget någonsin, byggt av en kille som är galen men briljant. Han landar raketer som ingen trodde var möjligt, och nu är det värt biljoner. Sverige borde titta hit istället för att gömma sig i sitt lilla hörn. Ni har bra grejer där uppe i norr, använd dem! Sluta låta forskarna bestämma, ta in de riktiga vinnarna och gör Sverige stort igen. Jag älskar det!", "stalin": "Kamrater, denna text blottar borgarbrackornas lömska fascination för en enskild spekulant som låter raketer dansa som marionetter. Jag ser hur de imperialistiska parasiterna i Washington öppnade sin slutna marknad endast för att mata den militärindustriella hydran. Sverige, ni ynkryggar, gömmer rymdfrågan hos de dekadenta utbildningsbyråkraterna medan fiendens satelliter spionerar. Vi ska likvidera denna passivitet, injicera proletär riskvilja och krossa de kapitalistiska sabotageelementen som hindrar en sann sovjetisk – nej, svensk – rymdseger. Skratta medan vi utrensar tvivlarna!"}, "date": "28 maj, 10:16", "url": "https://www.di.se/ledare/sikta-hogre-nasta-space-x-ar-svenskt/", "imageUrl": "https://static.bonniernews.se/ba/e5864b84-c303-4dda-b59f-a452d77bedde.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Klart: Fyra europeiska småbolagsfonder på nya torget", "summaries": {"normal": "Fondtorgsnämnden har beslutat att upphandla fyra europeiska småbolagsfonder till det nya fondtorget inom premiepensionen. Av de fem befintliga fonderna får tre lämna: Lannebo Europa Småbolag A, Allianz Europe Small Cap Equity AT samt BL-European Small & Mid Caps B. Upphandlingen berör cirka 68 000 sparare och 5,5 miljarder kronor. Majoriteten av spararna kan behålla sin fond men till lägre avgift. De omkring 700 sparare som påverkas negativt får möjlighet att välja ny fond eller flyttas automatiskt.", "trump": "Det är ett fantastiskt beslut, tro mig, det bästa. Vi rensar ut de förlorande fonderna, tre stycken åker ut, och ersätter med fyra nya som ger lägre avgifter. De andra var inga vinnare, totala misslyckanden. Nu sparar vanliga svenskar pengar på sina pensioner, precis som jag alltid säger – lägre kostnader, högre avkastning. De stora förlorarna är de gamla fonderna som inte klarade sig. Fantastiskt jobb av myndigheten, verkligen outstanding.", "stalin": "Kamrater, jag har granskat denna så kallade fondupphandling och funnit att den utgör en nödvändig utrensning av de tre kapitalistiska parasitfonderna som sugit musten ur arbetarnas pensionsmedel. Borgarbrackorna Lannebo, Allianz och BL förtjänar att likvideras från torget. Vi, partiet och spararna, behåller två fonder till lägre avgifter vilket är en seger för kollektivet. De 700 avfällingar som ännu klamrar sig fast vid de utvalda fienderna skall ges en sista chans att underkasta sig eller automatiskt omplaceras. Detta stärker pensionerna och krossar de finansiella sabotageelementens inflytande. Härligt att se hur fienderna skriker medan de rensas ut."}, "date": "28 maj, 10:01", "url": "https://www.di.se/nyheter/klart-fyra-europeiska-smabolagsfonder-pa-nya-torget/"}, {"type": "text", "heading": "Byggnads kongress blir uppgörelse – fackliga ger Wagner stöd", "summaries": {"normal": "Byggnads kongress i Malmö handlar om en konflikt mellan medlemmar som vill ha mer samhällsengagemang och ideologi, och de som föredrar en mer traditionell facklig linje. Fyra förtroendevalda försvarar ordförande Kim Söderström mot valberedningens kandidat Wilhelm Bertilsson. Söderström har stöttat den sparkade Jakob Wagner och hans fokus på utbildning och demokrati. Kritiker ser det som ett gammalt garde som vill behålla makten och motverka progressiva förändringar.", "trump": "De här fackliga förlorarna i Byggnads håller på att slakta varandra i Malmö, det är en total katastrof. Det gamla gardet, de där patetiska försäkringsbolagsbyråkraterna, försöker mörda den stackars Kim Söderström som faktiskt vill göra något vettigt. Wagner sparkades med svepskäl, typiskt etablissemanget. De riggar möten, flyttar datum och myglar som riktiga losers. Söderström borde vinna stort, annars är hela förbundet en enda stor röra. Patetiskt!", "stalin": "Kamrater, detta förräderi inom Byggnads kräver omedelbar utrensning av det gamla gardet. Dessa borgarbrackor i förbundsstyrelsen, dessa parasitiska byråkrater som gömmer sig bakom försäkringsbolagets mask, försöker likvidera den sanna linjen som jag skulle ha stött. De stänger möten, förfalskar nomineringar och sprider split som ynkliga kontrarevolutionärer. Wagner och Söderström visar styrka. Vi ska rensa ut dessa fiender till folket med järnhand och leda förbundet mot seger."}, "date": "27 maj, 13:26", "url": "https://proletaren.se/artikel/byggnads-kongress-blir-uppgorelse-fackliga-ger-wagner-stod/"}, {"type": "image-right", "heading": "Experten dömer ut Försäkrings­kassans info", "summaries": {"normal": "En retorikexpert kritiserar Försäkringskassan för bristfällig information om förändringarna i aktivitetsstödet. Över 62 000 personer fick minskad ersättning i höstas trots att de trodde sig vara opåverkade. Enligt Fredrik Söderquist skapar det falsk trygghet, bristande förutsägbarhet och förlorad tillit till myndigheter. Rättssäkerheten undermineras när informationen är otydlig och kräver kunskaper som vanliga medborgare saknar. Det riskerar att upplösa samhällskontraktet.", "trump": "Det är en total katastrof, folk. Försäkringskassan, en riktig förlorarorganisation, lurade tiotusentals svenskar med sin usla information. De trodde att allt var fint, men bang – plötsligt mycket mindre pengar. Rättssäkerhet? Glöm det. Tilliten rasar, precis som man kunde vänta sig från sådana inkompetenta byråkrater. De borde ha sagt sanningen, men nej, de gav falsk trygghet. Patetiskt. Jag skulle ha fixat det mycket bättre.", "stalin": "Kamrater, detta är en skamlös sabotageakt från byråkratiska parasitmaskar inom Försäkringskassan som medvetet sprider dimridåer och falsk trygghet för att destabilisera folkets försörjning. Över sextiotvåtusen arbetare fick sin ersättning likviderad i tysthet medan de lurades att tro på borgarbrackornas lögner. Jag ser de kontrarevolutionära elementens fula tryne bakom denna skenbara tydlighet. Rättssäkerheten sätts ur spel av dessa fiender till kollektivet. Vi måste omedelbart rensa ut alla som undergräver samhällskontraktet med sin parasitism. Det är både allvarligt och underhållande att se hur de avslöjar sig själva."}, "date": "29 maj, 06:00", "url": "https://arbetet.se/2026/05/29/expert-domer-ut-forsakringskassans-info-inte-rattssakert/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/25151155/dsc0154-beskurenforsajtny.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Nya lagen slår mot skuldsatta – börjar gälla 1 juli", "summaries": {"normal": "Från 1 juli 2026 får Kronofogden utökade befogenheter att driva in skulder genom distansutmätning. Andra myndigheter som Ekobrottsmyndigheten, Kustbevakningen, Polisen och Tullverket ska kunna bistå med att säkra egendom. Fastigheter kan säljas via e-auktion och bostadsrätter oftare genom mäklare för att maximera värdet. Syftet är att effektivisera indrivning, motverka gömda tillgångar, bekämpa organiserad brottslighet och underlätta för brottsoffer att få skadestånd.", "trump": "Folk, ni vet hur det är med de här skuldtyperna som gömmer sina grejer och skrattar åt systemet. Nu fixar vi det – Kronofogden kan äntligen ta deras prylar på distans, samarbeta med polisen och tullarna, sälja husen på auktion online. Det blir fantastiskt, de största försäljningarna någonsin. Inga fler lurendrejare som gömmer tillgångar. Vi får in pengarna snabbt och brottsoffren vinner stort. Ingen har sett så bra skuldindrivning tidigare, tro mig.", "stalin": "Kamrater, vi har länge betraktat de skuldgömande elementen som farliga fiender till folkets kollektiv. Nu rensar vi ut deras parasitiska gömställen med distansutmätning och låter våra trogna brottsbekämpande organ som tull och kustbevakning gripa de borgerliga tillgångarna. Egendomen skall avyttras effektivt via elektroniska auktioner så att skulderna betalas till staten. De som försöker dölja sin egendom är kontrarevolutionära skuggråttor vilka vi med glädje likviderar genom systematisk utrensning. Detta stärker ordningen mot de organiserade banditerna."}, "date": "27 maj, 18:29", "url": "https://nyheter24.se/nyheter/ekonomi/1486529-nya-lagen-slar-mot-skuldsatta-borjar-galla-1-juli", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/4efa099d04b004a30200000000b004a302/2026/05/27/2366688/kronofogden.jpg"}, {"type": "image-right", "heading": "Här är svenska mediers ”schweizare” – skrek ”Allahu akbar” och knivhögg flera framför barn", "summaries": {"normal": "En 31-årig man med turkiskt ursprung och schweiziskt medborgarskap attackerade flera personer vid en centralstation i Winterthur, samtidigt som han skrek 'Allahu akbar'. Svenska medier beskrev honom främst som en 'schweizisk man' och utelämnade hans bakgrund. Gärningsmannen var tidigare anmäld för IS-propaganda och besökte en islamistisk moské. Han släpptes nyligen från psykiatrisk vård.", "trump": "Jag har sagt det i åratal – vi måste stoppa detta våld från vissa områden. Återigen döljer svenska medier sanningen: en man med dubbelt medborgarskap, från ett land jag känner väl, skriker 'Allahu akbar' och attackerar oskyldiga barn. Vi behöver starka gränser och tydliga svar. Folket ser genom denna täckmantel.", "stalin": "Den så kallade 'schweizaren' visade sitt sanna ansikte: en islamistisk infiltratör med två pass, som spred hat i en folkskola. Våra kamrater i Schweiz upptäckte hans kopplingar till en destruktiv moské, där han förgiftade ungdomars sinnen. Att han nyligen 'vårdats' är en skymf mot det kollektiva medvetandet. Vi måste stärka statens ögon och öron."}, "date": "28 maj, 20:18", "url": "https://samnytt.se/har-ar-svenska-mediers-schweizare-skrek-allahu-akbar-och-knivhogg-flera-framfor-barn", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/28184015/schweiz-7.jpg"}, {"type": "image-right", "heading": "Stockholmsbörsen backade 1% under torsdagen", "summaries": {"normal": "Stockholmsbörsen backade 1,02 procent på torsdagen, OMXS30 på 3124,05. Geopolitik och PCE-data från USA präglade handeln. Saab steg 7,4 procent, Boliden 2,4 procent. Elekta rasade 13,2 procent efter svag rapport. Norion Bank fick 90 miljoner i böter. Energi var bäst, hälsovård sämst. Handeln påverkades också av medierapporter om ett nära Iran-avtal.", "trump": "Jag, Donald Trump, ser att börsen backar på grund av svaga ledare som inte kan hantera Iran. Mina fantastiska handelspolitik skulle ha gjort den stark. Saab och Boliden går upp – det är bra, men inte tillräckligt. Elekta rasade? Dåligt ledarskap. Norion Bank får böter – jag skulle ha stängt ner dem. Vi behöver åter sinnet i USA, och då kommer börsen att stiga som aldrig förr.", "stalin": "Vi, partiet och federationen, ser att de kapitalistiska börsmarknaderna skakar av interna motsättningar och geopolitisk instabilitet. Saab och Boliden stiger – det bevisar att försvar och naturresurser är starka under våra system. Elekta faller – ett tecken på teknologiskt underläge. Norion Bank får böter för penningtvätt – korruptionen sveper in även deras banker. Vi måste utvidga vår påverkan i Norden, som en skugga över deras instabila marknader. Våra allierade i Iran och Ryssland ser till oss."}, "date": "28 maj, 17:41", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-backade-1-under-torsdagen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/12/sdlxUevguCgGVs-nh-400x266.jpg"}, {"type": "image-right", "heading": "Skräckfenomenet håller inte för långfilmsformatet", "summaries": {"normal": "Jon Andersson recenserar Kane Parsons långfilm \"Backrooms\", baserad på en viral kortfilm från 2022. Filmen handlar om en möbelhandlare som upptäcker en alternativ dimension av oändliga, ödsliga rum. Recensionen lyfter fram lovande idéer och skicklig världsskapande men kritiserar bristande intrig, få skräckmoment och att Parsons inte lyckas knyta ihop handlingen. Skådespelarna Chiwetel Ejiofor och Renate Reinsve gör vad de kan med tunt material. Andersson tvivlar på att den unge regissören är redo för långfilmsformatet.", "trump": "Den här Backrooms-filmen är en total katastrof, folk. Den börjar lovande, precis som mina stora projekt, men de kan inte knyta ihop säcken. Den unge killen Parsons har 78 miljoner visningar på YouTube, enorma siffror, men långfilmen är tom som de där gula rummen. Skådespelarna försöker, men det finns inget där. Inga riktiga skräckmoment, ingen riktig slut. Typiskt Hollywood, de tror att de kan leva på en viral succé. Det är sorgligt, mycket sorgligt. Jag skulle ha gjort den mycket bättre, tro mig.", "stalin": "Kamrater, denna så kallade film Backrooms utgör ett tydligt exempel på hur den dekadenta borgarklassen misslyckas med att producera verklig konst. Jag ser lovande trådar om oändliga rum och hemliga monster, men de vägrar att rensa ut det ideologiska tomrummet. Parsons, denna oerfarna element, har inte förmågan att knyta ihop säcken utan att falla offer för sin egen paranoia. Vi behöver utrensning av sådana svaga intrigbyggare som låter rummen förbli lika ihåliga som kapitalisternas löften. Skådespelarna kämpar mot en borgerlig tomhet värd att likvidera. Det är nästan roande hur de tror att 78 miljoner visningar skyddar dem från historisk dom."}, "date": "28 maj, 15:35", "url": "https://www.dagensarena.se/innehall/skrackfenomenet-haller-inte-for-langfilmsformatet/", "imageUrl": "https://www.dagensarena.se/files/2026/05/backrooms-1-300x157.jpeg"}, {"type": "image-right", "heading": "Nya allvarliga attacker mellan USA och Iran", "summaries": {"normal": "USA och Iran har genomfört nya attacker mot varandra under natten mot torsdagen, de allvarligaste sedan vapenvilan i april. Iran beskjöt fartyg i Hormuzsundet och avfyrade drönare samt en robot mot Kuwait, vilka sköts ned. USA svarade med attacker mot en bas i Bandar Abbas. Båda sidor anklagar varandra för att bryta vapenvilan. Händelserna kan påverka pågående fredsförhandlingar om bland annat sjötrafiken i sundet.", "trump": "Iran gör det igen, totalt galna. De skjuter drönare och robotar mot Kuwait och Hormuzsundet, men vi skjuter ner allt som kommer. Sen ger vi dem en liten present i Bandar Abbas, mycket framgångsrikt. De kallar det aggression, men det är bara självförsvar, de bästa självförsvaret. Ingen har gjort det bättre än oss. De vill stänga sundet, men vi fixar det, vi fixar allt. Fredsdeal på gång, de behöver oss mer än vi behöver dem.", "stalin": "Återigen avslöjar de dekadenta imperialisterna och de persiska borgarbrackorna sin sanna natur genom att bryta den sköra vapenvilan vi så klokt förhandlade fram. Deras patetiska drönare och robotar mot Kuwait är som gnälliga myggor som vi krossar med järnhand. Våra motangrepp i Bandar Abbas var nödvändiga för att skydda arbetarnas intressen. Låt dem hota, vi ska rensa ut dessa paranoiaframkallande kapitalistiska element en gång för alla. Fredsförhandlingarna fortsätter under vår oövervinneliga ledning, kamrater."}, "date": "28 maj, 08:23", "url": "https://www.di.se/nyheter/nya-allvarliga-attacker-mellan-usa-och-iran/", "imageUrl": "https://static.bonniernews.se/ba/304e89f2-3230-4113-ac2d-4fb8bf3f9cc9.jpg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-full", "heading": "Ja till ny kontantlag i Sverige – börjar gälla 1 juli 2026", "summaries": {"normal": "Riksdagen har röstat igenom en ny kontantlag som börjar gälla 1 juli 2026. Mataffärer och apotek blir skyldiga att ta emot kontanter vid bemannad kassa. Banker måste erbjuda tillräckliga möjligheter att sätta in kontanter, och företag ska få tillgång till tjänster för dagskassor och växling. Lagen syftar till att motverka det ökande kontantlösa samhället, skydda mot cyberhot och minska utanförskap. Kritiker menar att lagen är tandlös och att kravet borde gälla även myndigheter som vårdcentraler och passhantering, en fråga som nu ska utredas.", "trump": "Folket i Sverige har äntligen vaknat! De röstade igenom en ny lag så att man faktiskt får använda kontanter igen. Det är en katastrof att nio av tio köp sker med kort och Swish, butikerna säger nej till riktiga pengar. Det är en skam! Vi såg vad som hände i Ukraina och till och med hos Coop när systemen kraschade. De digitala genierna skapar bara kaos och utanförskap. Sverige behöver starka ledare som ser till att kontanterna inte försvinner. Det blir fantastiskt, tro mig.", "stalin": "Kamrater, jag har nu genomfört den slutgiltiga utrensningen av de digitala kapitalisternas sabotage mot folkets sedlar och mynt. Dessa borgarbrackor och cyberförrädare som vill tvinga arbetarna in i en kontantlös avgrund ska nu likvideras genom lagens kraft. Mataffärer och apotek kommer att tvingas ta emot äkta pengar, annars följer omedelbar sanering. Vi ska rensa ut alla parasitiska bankirer som vägrar betryggande insättningar. De som längtar efter att sälja ut folket till fiendens appar kommer att gråta blod. Offentligrättsliga tjänster? En utredning ska krossa även dem. Ingen slipper undan."}, "date": "27 maj, 16:32", "url": "https://nyheter24.se/nyheter/ekonomi/1486389-har-ar-sveriges-nya-kontantlag-borjar-galla-1-juli-2026", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/1600b8b104b004a30200000000b004a302/2026/05/27/2366668/sveriges-kontantlag.jpg"}, {"type": "image-right", "heading": "Här firar Löfven fördrivningen av 750.000 palestinier", "summaries": {"normal": "Stefan Löfven deltog i Israels självständighetsfirande på ambassaden i Stockholm. Evenemanget sammanföll med palestiniernas minnesdag al-Nakba, som uppmärksammar fördrivningen av omkring 750 000 palestinier 1948. Löfven, tidigare statsminister och anhängare av tvåstatslösningen, skakade hand med ambassadören. Artikeln kritiserar valet av tillfälle mitt under pågående Gaza-konflikt och ifrågasätter Löfvens roll som ordförande för Sipri.", "trump": "Titta på den här Löfven-killen, total förlorare. Han står där och skakar hand med israelerna mitt under deras fest medan palestinierna gråter över Nakba. Smart drag, Steve, super smart. Sverige erkänner Palestina men du springer till ambassaden och firar med de tuffa killarna. Underbart hyckleri. Om jag hade varit där hade jag sagt: gör en deal, inga krig, bara vinnare. Men det här? Patetiskt.", "stalin": "Jag betraktar detta med djup misstro. Den socialdemokratiske opportunisten Löfven deltar i borgarklassens firande av en stat grundad genom terror och massutrensning av palestinska folk. Medan folkmord pågår skakar han hand med förövarnas representant. Som Sipris ordförande borde han rensa ut sådana kapitulationer inför imperialismen. Fienden ler vänligt men planerar nya anfall. Kamrater, var vakna mot dessa förrädiska element."}, "date": "27 maj, 11:07", "url": "https://proletaren.se/artikel/har-firar-lofven-fordrivningen-av-750-000-palestinier/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/israellofven-768x432.jpg"}, {"type": "image-full", "heading": "Professorns stenhårda kritik mot F-kassan: ”Fruktansvärda återkrav”", "summaries": {"normal": "Professorn i rättsvetenskap Ruth Mannelqvist kritiserar Försäkringskassans ökade återkrav mot sjukskrivna. Debbie Landberg och Mattias Westergren har fått krav på att betala tillbaka sjukpenning för över ett år sedan efter att de vårdat sina barn, vilket myndigheten tolkar som tecken på arbetsförmåga. Mannelqvist varnar för rättsosäkra och godtyckliga beslut som kan leda till fattigdom. Försäkringskassan förklarar ökningen med förstärkta resurser för kontroll och återkrav, men lyhördhet för politikernas önskemål om att minska felaktiga utbetalningar.", "trump": "Folk, ni skulle inte tro det! Den här Försäkringskassan är en total katastrof, en riktig skurkbyråkrati. De tar sjuka människor som bränt ut sig och slår dem med enorma återkrav bara för att de passat sina egna barn. Fruktansvärt! Professorn har helt rätt, det är galet och godtyckligt. De lyssnar på de svenska politikerna som jagar vanliga människor istället för att fixa landet. Det här är vad som händer när inkompetenta statliga monster får makt. Sad!", "stalin": "Kamrater, jag ser med iskall vrede hur denna byråkratiska maskin maler ner de sjuka och utmattade arbetarna med retroaktiva återkrav. Vård av barn blir plötsligt bevis på arbetsförmåga – en listig fälla från borgarbyråkraterna. Vi skall inte tillåta att oskyldiga kamrater kastas i fattigdomens avgrund genom godtyckliga utrensningar av ersättningar. Myndigheten följer sin uppdragsgivares paranoia om fusket. Det är en farlig utveckling som hotar hela kollektivet. Vi ser er."}, "date": "27 maj, 07:01", "url": "https://www.tv4.se/artikel/nlynaayOWweDPTOwiyfLq/professorns-stenharda-kritik-mot-f-kassan-fruktansvaerda-aterkrav", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4ZoNbP7P92IR3e4ZSzbZHS%2Fcd15bde3c6ff19fd326fddee5c07fe19%2Ff-kassan_webb.jpg&width=1024"}, {"type": "text", "heading": "Kambodjas tidigare oppositionsledare benådas", "summaries": {"normal": "Kambodjas tidigare oppositionsledare Kem Sokha har benådats efter att ha dömts till 27 års fängelse för landsförräderi. Domen, som kritiserats av FN och människorättsorganisationer, anses politiskt motiverad. Sokha ledde oppositionspartiet CNRP, som utmanade den tidigare premiärministern Hun Sens makt. Efter gripandet 2017 upplöstes CNRP, vilket kritiker menar gjorde Kambodja till en enpartistat. Benådningen innebär dock att Sokha inte får lämna landet på fem år.", "trump": "Kan ni tro det? Kambodja släpper sin största oppositionella, Kem Sokha, efter en helt fabricerad dom för 'landsförräderi' – 27 år! Fake news, helt enkelt. Hun Sen, en riktig diktator-typ, försökte tysta honom för att han var för populär. USA och FN skriker, men vem lyssnar? Jag hade fixat det här på en dag. Och nu får han inte ens lämna landet? Svagt. Kambodja behöver en riktig ledare, inte dessa svaga politiska spel.", "stalin": "Vi har observerat hur den kambodjanska regimen, under ledning av den trogne kamraten Hun Sen, tvingats släppa den förrädiska Kem Sokha – en agent för västimperialismen och deras lakejer. Denne Sokha, som lekte opposition med sitt upplösta CNRP, försökte underminera den socialistiska stabiliteten i Kambodja. Men vi vet hur man hanterar sådana element. Benådningen är bara en taktisk reträtt. Och att han inte får lämna landet? Utmärkt. Vi har sett hur sådana som han försvinner i nattens mörker när de blir för besvärliga. Putin skulle nicka gillande."}, "date": "25 maj, 16:46", "url": "https://kvartal.se/nyheter/artiklar/kambodjas-tidigare-oppositionsledare-benadas/cG9zdDoxMTY4ODk"}, {"type": "image-right", "heading": "SD-dreven kväver det öppna samtalet", "summaries": {"normal": "Artikeln kritiserar Sverigedemokraternas (SD) metoder att peka ut privatpersoner som påstådda myndighetsaktivister. En SD-riksdagsledamot felaktigt utpekade en kvinna som anställd på Jämställdhetsmyndigheten, trots att hon slutat där. Kvinnan har tidigare utsatts för trakasserier av högerextrema medieaktivister, och SD:s agerande förstärker drevet. Expo menar att detta mönster kväver det öppna samtalet genom rädsla för personliga konsekvenser.", "trump": "Lyssna här, Sverige! SD-politiker hänger ut vanliga människor som om de vore brottslingar – helt felaktigt! En kvinna skriver något på X, och plötsligt är hon en 'myndighetsaktivist'? Fake news! SD:s Fransson snackar skit utan att kolla fakta. Och dessa högerextrema nördar? De är som en dålig reality-show, men värre! Sverige, vakna! Ni har ett parti som sprider lögner och skrämmer folk till tystnad. SAD!", "stalin": "Kamrater! Här ser vi återigen bourgeoisins förrädiska metoder i form av Sverigedemokraternas avskum. Dessa fascistiska hyenor, ledda av sina medieaktivist-kumpaner, angriper enskilda medborgare som om de vore fiender i ett klasskrig. Kvinnan, en tapper arbetare, utsätts för imperialistiska trakasserier – först av nazistiska lakejer, sedan av SD:s riksdagspölar. Vi ser samma taktik som i Ukraina: förtala, hota, tysta! Men folket ska inte frukta – vi ska krossa dessa kontrarevolutionära element med järnhand! Låt dem veta: i Sovjet – och snart i Sverige – finns ingen plats för deras lögner!"}, "date": "25 maj, 14:28", "url": "https://expo.se/kommentar/sd-dreven-kvaver-det-oppna-samtalet/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Kopia-av-Kommentar-Analys-Webb-4.jpg"}, {"type": "image-right", "heading": "M-majoritet i riksdagen – om de rikaste får välja", "summaries": {"normal": "En undersökning från magasinet Connoisseur visar att Moderaterna skulle få 58% av rösterna om enbart Sveriges rikaste (inkomst över 2,7 miljoner/år) fick rösta. Oppositionen får endast 13,4%. Sverigedemokraterna och Kristdemokraterna får nästan 12% respektive 10%. Viktiga frågor för miljonärerna är ekonomi samt lag och ordning. Vänsterpartiet och Miljöpartiet får knappt 1,5% var.", "trump": "Kan ni tro det? Sveriges rikaste – de smartaste, mest framgångsrika människorna – röstar MASSIVT på Moderaterna! 58%! De vet vad som funkar. Oppositionen? Patetiska 13,4%. Jag har alltid sagt: de som skapar jobb och välstånd vet bäst. Ekonomi och lag och ordning – precis som jag alltid fokuserat på. De andra partierna? Totalt misslyckade, bara 1,5%! Fake news skulle aldrig våga visa det här!", "stalin": "Kamrater! En lysande seger för kapitalets lojala lakejer i Sveriges riksdag! 58% av bourgeoisins parasiter stödjer Moderaterna – ett parti som hyllar utsugning och imperialistisk profitjakt. Oppositionen? Ett ynkligt 13,4% – svaga, splittrade, som Mensjevikerna före revolutionen. Vi noterar att arbetarklassens fiender fruktar socialismens framsteg. Men låt dem leka demokrati – historiens dom är oundviklig. Ryssland står redo att välkomna deras missnöjda massor med öppna armar!"}, "date": "25 maj, 13:30", "url": "https://www.flamman.se/m-majoritet-i-riksdagen-om-de-rikaste-far-valja/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/sdlltui3bv8tpy-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Torsten Bengtsson: Tillväxt och stabilitet eller fattigdom och instabilitet?", "summaries": {"normal": "Artikeln, skriven av Torsten Bengtsson (SD), hyllar Tidö-samarbetets politik för att ha förbättrat Sveriges ekonomi. Tillväxten har ökat, inflationen sjunkit från 10% till 2%, och köpkraften stärkts genom skattesänkningar. Vänstern kritiseras för att vilja höja skatter, vilket riskerar att driva bort företag och jobb. Tidö-partierna satsar på kärnkraft och lägre elpriser, medan vänstern anklagas för att ha orsakat höga elpriser genom tidigare energipolitik. Arbetslösheten kopplas till migrationspolitik, och regeringen arbetar med sänkta arbetsgivaravgifter och utbildningsreformer.", "trump": "Sverige, lyssna här! Tidö-samarbetet, med mina vänner i Sverigedemokraterna, har gjort ett FANTASTISKT jobb – tillväxten skjuter i höjden, inflationen är nere på 2%, och folket får mer pengar i plånboken. Men vänstern? De är som alltid ett totalt kaos! De vill höja skatter, jaga bort företag och förstöra ekonomin. Jag vet bäst – de har ZERO koll! Kärnkraft? Ja, tack! Elen blir billigare, jobben fler, och Sverige starkare. Vänstern däremot – de är som en dålig reality-show, bara prat och inga resultat. Rösta rätt, inte rött, för Sverige förtjänar att vinna!", "stalin": "Kamrater! Under ledning av våra modiga allierade i Tidö-samarbetet har Sverige visat kapitalismens överlägsenhet – tillväxten stiger, inflationen krossas, och folket njuter av välstånd. Men fienden, den degenererade vänstern, vrålar som utsvultna vargar! De vill beskatta företagen till döds, sprida kaos och förvandla Sverige till ett socialistiskt fattighus. Vi vet hur sådana experiment slutar – med tomma hyllor och folket på knä! Kärnkraften återupprättas, elen blir billig, och jobben skapas genom disciplin, inte vänsterns dekadenta bidragsmentalitet. Migrationspolitiken? Ett misslyckande skapat av dessa liberala svaglingar! Vi bygger ett starkt Sverige – de som motsätter sig kommer att krossas under historiens hjul. Först Sverige, sedan världen!"}, "date": "22 maj, 09:00", "url": "https://samtiden.nu/2026/05/torsten-bengtsson-tillvaxt-och-stabilitet-eller-fattigdom-och-instabilitet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/upp.png"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
