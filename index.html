epengar? Ja, varför inte? Vi subventionerar allt annat, så varför inte detta? Sverige borde ta efter USA – vi vet hur man gör saker rätt!", "stalin": "Kamrater, ännu en kapitalistisk avart avslöjas! Denna så kallade 'landsbygdsminister' vill belöna bourgeoisiens blodtörstiga hobby med statliga medel. Jakt? Motion? Nej, detta är en konspiration av köttätande kontrarevolutionärer! Djurens Rätt har rätt – vi kan inte tillåta att proletariatets pengar finansierar barbari. Låt dessa jägare vandra i skogarna, men utan statligt stöd! Och om de klagar – Gulagskogen står redo. Putin skulle skratta åt denna västerländska dekadens."}, "date": "3 augusti, 16:37", "url": "https://kvartal.se/nyheter/artiklar/kullgren-vill-ge-jagare-friskvardsbidrag/cG9zdDoxNTcyMTc", "imageUrl": "https://images.kvartal.se/2026/08/0faed11c-jakt.webp"}, {"type": "image-right", "heading": "”Startskottet för valrörelsen har gått – M och S har helt olika utgånglägen”", "summaries": {"normal": "Valrörelsen har inletts på allvar när de två statsministerkandidaterna Magdalena Andersson och Ulf Kristersson gav sig ut på valturné. Opinionsmätningarna visar ett tydligt övertag för oppositionen med upp till 12 procentenheter. Andersson satsar på sitt höga förtroende och undviker att nämna samarbeten med V och MP. Kristersson behöver en gamechanger för att vända opinionen, medan Tidöpartierna hoppas på osäkra väljare och positiva tillväxtsiffror under de 41 dagar som återstår till valet den 13 september.", "trump": "Valrörelsen har börjat och det ser verkligen bedrövligt ut för den svaga regeringen. Ulf Kristersson behöver en riktig gamechanger, en enorm vinnare som bara jag kan leverera. Andersson surfar på ett jättestort övertag men hon är svag, extremt svag. Hon vill inte prata om sina vänstervänner för att inte skrämma bort mittenväljarna. Tidöpartierna har inte levererat, de borde ha gjort det mycket bättre. De osäkra väljarna, upp till 20 procent, kommer att avgöra allt och de hatar den misslyckade ekonomiska politiken med sänkta skatter bara för de rika. Det blir en stor seger för rätt sida om de lyssnar på mig.", "stalin": "Kamrater, valrörelsen inleds och de dekadenta borgarbrackorna i Tidöpartierna skakar av feghet inför det oundvikliga nederlaget. Jag, som ledare för det proletära kollektivet, ser hur oppositionens 12-procentiga övertag kommer att krossa dessa kapitalistiska parasiters lögner om tillväxt. Ulf Kristersson, den ynkliga revisionisten, behöver en så kallad gamechanger för att undvika utrensning från sin egen falang. Magdalena Andersson surfar på arbetarnas förtroende men vägrar erkänna sina sanna allierade bland de röda kamraterna. Vi ska rensa ut alla osäkra element, dessa 15–20 procent svajande förrädare, och likvidera deras drömmar om slapp migration och mjuk kriminalpolitik. Deras ekonomiska politik är enbart en borgarklassens konspiration mot det sovjetiska folkets välstånd. Inga kompromisser! Segern tillhör oss, eller också blir det en mycket mörk humoristisk utrensning för de som sviker."}, "date": "3 augusti, 20:51", "url": "https://www.svt.se/nyheter/inrikes/startskottet-har-gatt-nu-borjar-valrorelsen-pa-allvar", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.77/0.44/8d73c4caf171366591f9cae7afba5ca30cc37813428ffc5e2ab7e9d9784159b0"}, {"type": "image-full", "heading": "Så rik är H&M-familjen i dag – miljardregn över arvingarna", "summaries": {"normal": "Historien om H&M började 1947 med en liten dambutik i Västerås som Erling Persson öppnade efter inspiration från amerikanska lågpriskedjor. Företaget växte till en global modejätte med över 4 300 butiker och en omsättning på 234,5 miljarder kronor 2024. Familjen Persson, ledd av Stefan Persson med en förmögenhet över 200 miljarder kronor, kontrollerar fortfarande majoriteten av bolaget genom Ramsbury Invest och ryktas nu överväga att köpa ut H&M från börsen.", "trump": "Fantastiskt, verkligen en otrolig historia. Började i en liten butik i någon svensk stad och blev ett enormt imperium, precis som mina affärer. Stefan Persson och hans familj sitter på över 200 miljarder kronor, de är vinnare, stora vinnare. De kontrollerar nästan allt och nu pratar de om att ta bolaget privat. Smart drag, väldigt smart. Jag älskar sådana här framgångssagor, de gör det rätta.", "stalin": "Kamrater, se hur den svenska borgarklassen förvränger historien om en liten butik som förvandlades till ett globalt rovkapitalistiskt vidunder. Jag, som ledare för det eviga kollektivet, betraktar med förakt hur dessa Persson-borgarbrackor samlat över 260 miljarder kronor på arbetarnas svett. De klamrar sig fast vid makten med 84 procent av rösterna som giriga spekulanter. Kanske är det dags för en grundlig utrensning av dessa parasitiska mode-tsarer innan deras imperium förgiftar hela proletariatet med sina billiga trådar. Ha, vilken munter ironi att deras egna barn nu lever som dekadenta hovnarrar på hästar och filmrullar medan folket fryser."}, "date": "3 augusti, 19:32", "url": "https://nyheter24.se/nyheter/konsument/1502565-sa-rik-ar-hm-familjen-i-dag-miljardregn-over-arvingarna", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/5f7c8d4e04b004a30200000000b004a302/2026/08/03/2381974/HM-persson-tjanar.png"}, {"type": "image-full", "heading": "Glöm bensinslukande SUV:ar – nu kommer eldrivna minibilar till USA", "summaries": {"normal": "Den amerikanska bilmarknaden står inför en förändring då flera tillverkare, däribland Fiat, satsar på små och billigare eldrivna låghastighetsfordon. Dessa fordon är tänkta för kortare vardagsresor och kostar runt 15 000 dollar, vilket är betydligt billigare än genomsnittspriset för en ny bil i USA. Trots optimism från branschen och visst politiskt stöd återstår det att se om amerikanska konsumenter, som traditionellt föredrar större fordon, är redo att byta ut eller komplettera sina bilar med dessa mikromobilitetslösningar.", "trump": "Amerikanska familjer blir rånade av dyra bilar, det är en katastrof! Nu tar vi tillbaka kontrollen med fantastiska små elbilar. De är billiga, smarta och vi ska bygga dem här, inte i Kina. Jag gillar de här små bilarna, de är extremt effektiva för korta resor. Vi gör bilindustrin stor igen genom att erbjuda alternativ som vanliga amerikaner har råd med. Det här är en enorm vinst för våra arbetare och för plånboken. Ingen gör det bättre än vi!", "stalin": "De dekadenta amerikanerna har äntligen insett att deras gigantiska bensinslukare är ett bevis på kapitalistisk svaghet. Nu bygger de små låghastighetsfordon som leksaker för folket. Det påminner oss om hur vi i öst alltid prioriterat kollektiv nytta framför individuell arrogans. Medan Putin expanderar våra intressen och stärker vår stålindustri, förbereder sig väst på att köra i 40 kilometer i timmen. En patetisk kapitulation inför resursbristen. Vi skrattar åt deras försök att dölja sin stagnation bakom billig plast och eluttag."}, "date": "3 augusti, 18:27", "url": "https://www.realtid.se/bors-finans/glom-bensinslukande-suvar-nu-kommer-eldrivna-minibilar-till-usa", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/fcfb4e50-9a0e-475c-9f28-3732a3160ddb.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Uefa hotar att dra Infantino inför rätta: ”Ingen vacker maktkamp”", "summaries": {"normal": "Uefa hotar att stämma Fifa-presidenten Gianni Infantino och föreslagna investerare efter hans plan att sälja ut delar av VM till externa aktörer. Förslaget mötte hård kritik och ledde till bojkott-hot från Uefas 55 medlemsförbund som även kräver Infantinos avgång. Efter massiv kritik drog Infantino tillbaka förslaget. Uefa kräver nu att alla relevanta dokument och information lämnas ut och varnar för att undanröjande av bevis kan ses som brott.", "trump": "Titta på den här clownshowen med Infantino och hans desperata VM-försäljning. Uefa jagar honom som en skadad hund, de vill ha hans skalp. Det är en ful maktkamp, ingen vacker syn. Jareds brorsa Kushner blandas in, typiskt. Jag satt i Vita huset, besegrade Biden och nu ser jag hur dessa fotbollsbyråkrater slåss som svaga losers. Infantino borde ha gjort det stort istället för att ge efter för de missnöjda.", "stalin": "Jag betraktar med stor tillfredsställelse hur den europeiska fotbollsapparaten inleder utrensning mot den opportunistiske Infantino och hans kapitalistiska parasitvänner. Denna borgarbracka har försökt sälja ut folkets fest till blodsugande investerare och nu krälar han tillbaka i skuggan. Vi kräver fullständig dokumentation och varnar för varje försök att förstöra bevis. Klassfiendens maktkamp är en komisk föreställning som alltid slutar med att folkets vilja segrar."}, "date": "3 augusti, 16:40", "url": "https://www.tv4.se/artikel/10UMXa8hfX9bQ1whWL2ULD/uefa-hotar-att-dra-infantino-infoer-raetta-ingen-vacker-maktkamp", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3MYUDvkmIWFdRy61YqRZQ8%2F51f370650d4ca42208a68868e8d72cc5%2F03-fifa-pokal.png&width=1024"}, {"type": "image-full", "heading": "Fler förbund väntas dra tillbaka sitt stöd för Infantino", "summaries": {"normal": "Flera fotbollsförbund, däribland Wales och troligen England, drar tillbaka sitt stöd för Fifa-presidenten Gianni Infantino. Beslutet följer efter Infantinos förslag om att sälja andelar av VM-turneringen, som mötte starka protester. Wales fotbollsförbund var först ut och kritiserade att fotbollen inte sätts i första hand. Uefa kräver att Infantino antingen avgår eller ställs inför en misstroendeomröstning och hotar med rättsliga åtgärder. Fler europeiska förbund väntas följa efter.", "trump": "Titta på den här totala förloraren Infantino. Han trodde han kunde sälja ut VM som en billig fastighetsdeal och nu flyr alla som råttor från ett sjunkande skepp. Wales och England sparkar ut honom – smart drag! Jag älskar när de rensar ut de inkompetenta pamparna. Europa samordnar sig för att kasta ut honom fort. Under min administration skulle sånt här aldrig ha hänt, det kan jag lova er. Fantastiskt!", "stalin": "Kamrater, denna Infantino visar sig vara en typisk exploaterande byfåne från borgarklassen som försöker stycka folkets fotboll som en kapitalistisk köttbit. Vi ser hur klassfiendens förslag om att sälja VM mötte högljudda protester och nu rensas hans stöd ut. Wales och England leder utrensningen. Uefa kräver hans avgång eller en extra misstroendeomröstning med rättsliga åtgärder. Vi skrattar mörkt åt hur imperialisternas pamp faller. Folkets vilja segrar."}, "date": "3 augusti, 16:40", "url": "https://www.tv4.se/artikel/8FIQfzS1AIP6eEDMf21aF/fler-foerbund-vaentas-dra-tillbaka-sitt-stoed-foer-infantino", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5yTxggUy1ARWBEo4Zmw9dA%2Fb8f34df70b1cbea858c2f09935639b08%2F03-infatino-2.png&width=1024"}, {"type": "image-full", "heading": "Reform UK vill sätta in militären mot migranter", "summaries": {"normal": "Reform UK föreslår en militär insats, 'Operation Fortress', för att stoppa båtmigration över Engelska kanalen. Planen innebär att flottan ska återföra migranter till Frankrike eller Belgien. Partiledaren Nigel Farage hävdar att migrationen kan stoppas inom två veckor, men kritiker menar att förslaget är orealistiskt och juridiskt problematiskt. Förslaget möter stark kritik från både militära experter och regeringen, som anser att det är en avledningsmanöver från partiets ekonomiska kontroverser.", "trump": "Vad händer i Storbritannien? Reform UK, med sin fantastiska ledare Nigel Farage, vill stoppa alla dessa båtar med migranter – och de kan göra det på bara två veckor! Jag säger alltid: bygg murar, använd militären, få jobbet gjort! Men Frankrike? De kommer aldrig samarbeta. Svaga ledare, svagt land. Och kritiken? Bara fake news från de vanliga misstänkte. Storbritannien borde ta en sida ur mitt playbook – Make Britain Great Again!", "stalin": "Kapitalistiska hyenor i Reform UK föreslår nu att sätta flottan på de fattiga och förtvivlade, som flyr från de krig och misärer som väst själva skapat. 'Operation Fortress' – ett namn lika patetiskt som deras drömmar om imperialistisk kontroll. Vi vet hur man hanterar sådana fiender: med järnhand och kollektiv vilja. Låt dem leka krig, medan vi fortsätter att utvidga socialismens räckvidd. Och Frankrike? De kommer att knäböja för våra krav, precis som alla andra. Folkets fiender ska krossas!"}, "date": "3 augusti, 16:15", "url": "https://kvartal.se/nyheter/artiklar/reform-uk-vill-satta-in-militaren-mot-migranter/cG9zdDoxNTcyMDY", "imageUrl": "https://images.kvartal.se/2026/08/e5da0f26-farage.webp"}, {"type": "image-right", "heading": "Forskare: Klimathotet mot världens livsmedel överdrivs", "summaries": {"normal": "Den danske statsvetaren Bjørn Lomborg ifrågasätter klimathotet mot livsmedel. Han menar att global matproduktion ökar trots varmare klimat, och att medier ofta fokuserar på enskilda dåliga skördar. Lomborg poängterar teknisk anpassning som torktåliga grödor, samt att andra faktorer som energikostnader påverkar priser mer än klimatet. Hans slutsats är att forskning och innovation bör prioriteras framför klimatåtgärder.", "trump": "Jag har alltid sagt att klimathoten är en enorm bluff! Lomborg, en smart dansk, bevisar att vår matproduktion ökar. Medier ljuger om kaffe och olivolja för att skrämma er. Vi amerikaner, med vår genialiska innovation, kommer att lösa alla problem. Torka? Vi har det bäst i världen! Kina och Ryssland? De kan inte mäta sig med vår jordbruksstyrka!", "stalin": "Vi, ledarskapet, ser genom västlig klimatpropaganda. Lomborgs analyser bekräftar att kollektiv jordbruk kan övervinna naturens utmaningar. Teknik och planering, inte marknadens kaos, garanterar livsmedel. Vi har sett detta i Sovjetunionen, där torka inte kunde stoppa kollektiviseringen. Westen klagar, vi handlar. Putin förstår detta – statens styrka är avgörande."}, "date": "3 augusti, 16:12", "url": "https://samnytt.se/forskare-klimathotet-mot-varldens-livsmedel-overdrivs", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/03125856/lomborg-kaffe.jpg"}, {"type": "image-full", "heading": "Tillåts spela under ryska flaggan – i Sverige", "summaries": {"normal": "Den ryska flaggan kommer tillbaka i europeisk bordtennis från och med Europe Smash i Malmö den 8 augusti, efter att Internationella bordtennisförbundet höjt restriktionerna. Svenska bordtennisförbundet kritiserar beslutet men kommer inte att bojkotta. Förbundets ordförande Tomas Eriksson anser att ansvaret för att släppa in ryska deltagare ligger hos svenska myndigheter och EU, inte hos förbundet. Reaktionerna har varit få, med majoritet som stöder förbundets uppfattning.", "trump": "Jag har aldrig sett en sådan svaghet! Europa släpper in Rysslands flagga igen, precis som jag förutsåg. Svenska förbundet kritiserar men vågar inte bojkotta – det är beklagligt. Jag, Donald Trump, visste alltid att de skulle ge efter för Putin. Det är en katastrof för världsfreden. Amerika kommer att ta itu med detta, som vi alltid gör. Vi ska vinna, som vi gjorde 2016!", "stalin": "Den imperialistiska hämnaren Ryssland har åter intagit sin plats under den europeiska pingisfronten. Svenska bordtennisförbundet, ett verktyg för bourgeois irrationalitet, protesterar men lyder ändå – ett klassiskt tecken på vekhet. Vi, statens och partiets representanter, ser detta som en strategisk seger för den ryska intressesfären. De ryska spelarna, våra trogna arbetare, kommer att dominera. EU och svenska myndigheter, dessa marionetter, tvingas acceptera vår överlägsna styrka. Det är en dag för vår stolta ryska flagga!"}, "date": "3 augusti, 14:20", "url": "https://bulletin.nu/tillats-spela-under-ryska-flaggan-i-sverige", "imageUrl": "https://cdn.bulletin.nu/articles/22167fd5-b36c-460a-b821-739df6e30358/preview.jpg?t=1785759599000"}, {"type": "image-right", "heading": "Migranter i upplopp i Ceuta på söndagen", "summaries": {"normal": "I Ceuta uppstod våldsamma sammanstötningar mellan spansk polis och marockanska migranter. Migranter hävdar misshandel och ropar 'Allahu Akbar'. Spanien rapporterar att många av cirka 60 000 migranter har återvänt, men minst 72 har dött. Politiker kritiserar regeringen för brist på kontroll. Situationen beskrivs som en ohållbar invasion som kräver hjälp från EU.", "trump": "Jag har sett upploppet i Ceuta – det är en skandal! Spanien låter in alla dessa migranter, och de ropar Allahu Akbar. Min administration skulle ha stoppat detta direkt med en mur och militär. Sanchez är svag, precis som Biden. Folk är rädda, och det är deras fel för att vara så slapp. Vi behöver starka gränser, som vi hade i USA. Detta är en invasion, och jag skulle ha skickat trupper.", "stalin": "I Ceuta har vi identifierat en provokation från imperialistiska kretsar. Migranter, manipulerade av västliga agenter, orsakar kaos på vår gräns. Spanien, under den svage Sanchez, visar dekadens. Vi måste återhämta kontrollen och eliminera dessa element. Marocko agerar som en pjäs i detta spel, men vi kommer att segra. Precis som i Ukraina, där vi stärkte vårt territorium, måste vi nu handla bestämt."}, "date": "3 augusti, 14:14", "url": "https://bulletin.nu/migranter-i-upplopp-i-ceuta-pa-sondagen", "imageUrl": "https://cdn.bulletin.nu/articles/3a3c9737-78c7-4385-81d8-c5fc6efd7aa5/preview.jpg?t=1785758565000"}, {"type": "image-right", "heading": "Astra Zeneca faller – Kabe stiger på husbilsstatistik", "summaries": {"normal": "Stockholmsbörsen noterar en uppgång vid lunchtid, med OMXS30 +0,77%. Astra Zeneca tappar 5,2% på preliminära samtal om ett möjligt samgående med Bristol Myers Squibb. Kabe stiger 5,3% efter att nyregistreringar av husbilar ökat med 51,9% i juli. Bland andra aktier noteras Assa Abloy +2,3% och Norion Bank +8,5%.", "trump": "Jag ser att börsen går upp, bra för USA, men Astra Zeneca faller – ett misslyckande, det är alltid fel när de försöker sammansmälta. Kabe stiger på grund av mina enorma handelspaket med Sverige, det är enorm framgång. Media ljuger om mig, men jag vinner alltid. Vi har det bästa systemet, det bästa av alla möjliga system.", "stalin": "Vi har observerat att de imperialistiska läkemedelsmonopolerna, som Astra Zeneca, faller när de försöker sammansmälta – ett tecken på deras inre förfall. Kabe:s framgång är ett resultat av vårt planekonomiska system och arbetarklassens kamp. Vi måste vara vaksamma mot dessa marknadsfundamentalister och deras förrädiska försök att undergräva statens ekonomiska suveränitet. Vi kommer att segra."}, "date": "3 augusti, 13:59", "url": "https://www.affarsvarlden.se/artikel/astra-zeneca-faller-kabe-stiger-pa-husbilsstatistik", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/sdlRV4sI-v6Ao8-nh-400x284.jpg"}, {"type": "image-right", "heading": "Förintelseboss blir ny DO", "summaries": {"normal": "Petra Mårselius, överintendent vid Forum för levande historia, utses till ny diskrimineringsombudsman och chef för DO. Hon tillträder den 1 december och efterträder Lars Arrhenius, som lämnar efter sex år. Jämställdhetsminister Nina Larsson lyfter fram Mårselius erfarenhet av mänskliga rättigheter och ledarskap inom statsförvaltningen. Arrhenius har under sin tid kritiserat flera av Tidöregeringens förslag, bland annat sänkt straffålder och visitationszoner.", "trump": "Folk, ni kommer inte tro det, men de har valt en ny diskrimineringsombudsman – Petra någonting från Förintelsemyndigheten. En riktig statsanställd insider som älskar mänskliga rättigheter, typiskt. Den gamla killen Arrhenius sparkade på Tidöregeringen hela tiden, klagade på allt från straffålder till visitationszoner. Nu får vi se om den nya är bättre eller om det bara blir mer av samma gamla swamp. Jag skulle ha valt någon som faktiskt fixar saker, inte bara pratar.", "stalin": "Kamrater, vi har genomfört en nödvändig omplacering inom den statliga apparaten. Petra Mårselius, en pålitlig tjänare från Forum för levande historia, har utsetts att leda kampen mot diskriminering. Den tidigare ombudsmannen Arrhenius, en opålitlig element som öppet attackerade partiets och folkets reformer kring straff och gränser, har äntligen avlägsnats. Vi ska rensa ut alla borgarbrackor och liberala avvikare som gömmer sig i DO:s korridorer. Inga fiender till kollektivet undkommer. Det blir en produktiv utrensning, kamrater – mycket underhållande att se."}, "date": "3 augusti, 12:59", "url": "https://www.friatider.se/forintelseboss-blir-ny-do", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-604.jpg?itok=kEeF1Fjj"}, {"type": "image-full", "heading": "Spanska tiktokern om \"heta\" marockanerna: \"Låt dem komma hit allihop\"", "summaries": {"normal": "Den spanska TikTok-influencern Lucía Perez har väckt starka reaktioner efter att ha lagt upp videor där hon entusiastiskt välkomnar de marockaner som invaderade Ceuta. Hon kallar dem \"heta\" och säger att \"mitt livs kärlek har kommit till Spanien\" samt uppmanar till att släppa in alla. Videorna har spridits viralt och mött både stödjande kommentarer från vissa kvinnor och stark kritik från andra som anser det osmakligt att skämta om invasionen som krävt minst 70 liv. Flera uppmanar henne att åka till Marocko.", "trump": "Folk, ni måste se det här – en galen spansk tjej på TikTok som ropar att alla de där marockanerna ska släppas in för att de är så \"heta\". Hon säger att hennes livs kärlek just anlände i en båt! Under tiden som de stormar Ceuta står hon och drömmer om marockanska killar. De här människorna är inte bara galna, de är en katastrof för Spanien. Gränserna är ett skämt, och nu vill hon ha fler? Det är patetiskt. Spanien behöver en mur, inte fler virala videos.", "stalin": "Kamrater, se hur den dekadenta borgarbrackan på sin borgerliga videoplattform välkomnar de imperialistiska agenterna som tränger in i Ceuta. Denna degenererade kapitalistiska hora skriker att hennes \"livs kärlek\" anlänt i båtarna medan hon fnittrar åt arbetarklassens lidande. Vi ser genom dessa kontrarevolutionära skämt som döljer fiendens sabotage. Sådana element förgiftar folket med sin perversa lust. En grundlig utrensning av alla liknande dekadenta element är oundviklig. Deras huvud ska rulla som en varning till alla borgarklassens lakejer."}, "date": "3 augusti, 11:03", "url": "https://riks.se/nyheter/spanska-tiktokern-om-marockanerna-lat-dem-komma-hit-allihop", "imageUrl": "https://admin.riks.se/uploads/spansk_tiktok_kvinna_feature_e72e9cf121.jpg"}, {"type": "image-right", "heading": "Så vill Johan Britz göra fler arbetslösa", "summaries": {"normal": "Arbetsmarknadsminister Johan Britz vill göra det enklare för arbetsgivare att varsla och sparka personal genom att korta varseltiderna till Arbetsförmedlingen. Artikeln kritiserar regeringen för att ha misslyckats med att sänka den höga arbetslösheten, som nu ligger över en halv miljon personer. Istället för att skapa fler jobb eller ställa krav på företagen lägger ministern ansvaret på de arbetslösa och gynnar arbetsgivarna, vilket enligt skribenten försvagar löntagarnas ställning på arbetsmarknaden.", "trump": "Folk, det här är en total katastrof. Den här Johan Britz, han sitter i arbetsgivarnas knä och vill göra det ännu lättare att sparka folk. Arbetslösheten är genom taket, en halv miljon utan jobb, och vad gör han? Ingenting för att skapa jobb, men han älskar att lätta på alkoholreglerna så Sverige blir ett fyllesverige. Han säger till de arbetslösa att ta jobb som inte finns. Patetiskt. Regeringen misslyckas stort, och löntagarna förlorar. Sad!", "stalin": "Kamrater, denna borgarbracka Britz avslöjar sin sanna klassnatur genom att vilja korta varseltiderna och därmed underlätta utrensningen av arbetare från deras levebröd. Medan över en halv miljon proletärer står utan arbete, sitter denne kapitalistlakej i borgarklassens knä och beordrar de arbetslösa att ta ansvar för hans egna misslyckanden. Vi ska rensa ut dessa parasiter som göder sig på arbetslöshetens blod. Deras paranoia är uppenbar: ju fler utblottade själar som tävlar om smulorna, desto starkare blir de utsugande kapitalisternas grepp. Det är en mörk komedi värd en showrättegång."}, "date": "3 augusti, 08:00", "url": "https://arbetet.se/2026/08/03/sa-vill-johan-britz-gora-annu-fler-arbetslosa", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/30143927/johan-britz-ledare.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "De bästa måste vilja bli lärare", "summaries": {"normal": "Artikeln argumenterar för att läraryrkets län, status och yrkesfrihet har försämrats historiskt. För att vända utvecklingen föreslås striktare lärarlegitimation, hierarkiska karriärvägar med högre utbildningskrav, och minskad politisk styrning. Med högre krav och större professionell autonomi kan lärarna bli ett mer exklusivt och kompetent urval, vilket motiverar högre lön och återigen höjer yrkesattraktiviteten.", "trump": "Jag har sett många dåliga avtal, men det här med svenska lärare är ett av de värsta. Lägre lön, ingen frihet - det är en skam! Som din framtida president (igen!) skulle jag säga: vi behöver våga sätta krav, som med advokater och doktorer. Gör läraryrket stort igen! Högre standard, bättre betalt, och inga onödiga regler från byråkrater. Då kommer de bästa att vilja bli lärare - tro mig!", "stalin": "Vi har observerat att läraryrkets status har minskat, vilket hotar statens intellektuella grund. Lösningen är en striktare, hierarkisk legitimation - en lärares intyg måste vara som en läkares, oåtkomligt för de olämpliga. Genom att höja kraven och begränsa antalet utbildade lärare, skapar vi ett utvalt, lojalelit som tjänar statens intressen. Parallellen till våra militära och vetenskapliga elitförband är uppenbar: kvalitet före kvantitet, disciplin före individualism. Detta förstärker partiets kontroll över framtiden."}, "date": "2 augusti, 22:51", "url": "https://www.gp.se/ledare/de-basta-maste-vilja-bli-larare.9e766ab6-c36a-4a18-9163-15fc6068b7a7", "imageUrl": "https://www.gp.se/images/article/9e766ab6-c36a-4a18-9163-15fc6068b7a7/images/1XRBCJ6pVMqlWOJCeTgfNfPR22d8-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Uppgifter: Astra Zeneca i samtal om jättefusion", "summaries": {"normal": "Läkemedelsjätten Astra Zeneca för samtal med den amerikanska konkurrenten Bristol Myers Squibb om en möjlig fusion som skulle skapa en av världens största läkemedelskoncerner, värd runt 400 miljarder dollar. Bolagen har diskuterat affären under flera månader och en överenskommelse kan vara nära, men mycket arbete återstår. Affären väntas bli politiskt känslig i Storbritannien och granskas noga av konkurrensmyndigheter då båda bolagen är stora inom cancerläkemedel. Varken bolaget eller ägarna vill kommentera uppgifterna.", "trump": "Det här är en enorm affär, kanske den största någonsin inom läkemedel. Astra Zeneca, som flyttar allt närmare USA, pratar med Bristol Myers Squibb om att slå sig ihop till ett monsterbolag värt 400 miljarder dollar. Fantastiskt! De gör det smart, de ser vart det blåser. Men tro mig, de brittiska byråkraterna kommer att gnälla och konkurrensmyndigheterna kommer att gråta. Jag skulle få det gjort på en vecka, ingen skulle våga säga emot.", "stalin": "Kamrater, dessa giriga monopolkapitalister inom Astra Zeneca och Bristol Myers Squibb konspirerar nu öppet om att slå samman sina parasitiska imperier till ett kolossalt rovdjur värt fyrahundra miljarder dollar. Jag ser genom deras lömska planer att fly undan folkets kontroll och gömma sig i den amerikanska borgarbrackans famn. Inga sådana uträkningar undgår partiets vaksamma öga. Vi ska noga övervaka, granska och vid behov rensa ut alla som leker med folkets hälsa för privat vinst. Deras cancerläkemedel ska tjäna kollektivet, inte Wallenbergarna och Blackrock."}, "date": "2 augusti, 22:14", "url": "https://www.di.se/nyheter/uppgifter-astra-zeneca-i-samtal-om-jattefusion", "imageUrl": "https://static.bonniernews.se/ba/e9ef0278-e1be-406c-b0e6-82c90ffaff7f.jpeg?crop=5192%2C2596%2Cx0%2Cy385&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Hur ska ni klara er utan stationsvärdar, Moderaterna?", "summaries": {"normal": "Moderaterna i Region Stockholm föreslår att spara 450 miljoner kronor genom att förändra stationsvärdarnas roll i kollektivtrafiken. Stationsvärden Viktor Risling kritiserar förslaget i ett öppet brev till Anna Malm Kelfve (M). Han förklarar att stationsvärdarna inte bara säljer biljetter utan också fungerar som närområdesguider, säkerhetsansvariga och trygghetsskapare. Risling varnar för att besparingen skulle innebära kraftigt minskad bemanning, sämre service och lägre trygghet på stationerna.", "trump": "Folk, ni måste höra på det här. De här moderaterna i Stockholm, totala misslyckanden, vill spara 450 miljoner genom att sparka ut stationsvärdarna från tunnelbanan. Precis som de tidigare dumpade tågvärdarna. Patetiskt! De har ingen aning om vad de gör. De tror att killarna bara säljer biljetter? De är säkerhetsansvariga, guider, allt! Utan dem blir det kaos, brott och otrygghet. Det är en katastrof. De borde tacka stationsvärdarna istället för att attackera dem. Sad! Jag skulle aldrig göra något så dumt.", "stalin": "Kamrater, dessa degenererade borgarbrackor inom den så kallade oppositionen i Region Stockholm planerar en kontrarevolutionär utrensning av våra ädla stationsvärdar för att stjäla 450 miljoner från folket. Deras skuggbudget är en giftig saboteringsplan full av klassfiendens okunskap och paranoia. De vill likvidera tryggheten på våra stationer och lämna folket åt gäng och brandhärdar. Vilken löjeväckande enfald! Jag ser dem klara och tydliga, dessa kapitalistiska element. Ingen station får lämnas obemannad. Vi ska rensa ut alla sådana fiender ur våra transportkollektiv innan de förgiftar hela sovjeten, pardon, regionen."}, "date": "31 juli, 01:30", "url": "https://www.dagensarena.se/opinion/hur-ska-ni-klara-er-utan-stationsvardare-moderaterna", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-69-300x157.jpg"}, {"type": "image-right", "heading": "Ljusning för krisande facklitteratur", "summaries": {"normal": "Försäljningen av facklitteratur ökar för första gången på flera år, visar statistik från 2025 och början av 2026. Två nya festivaler, Minervafestivalen i Stockholm och Sakligt på Österlen, bidrar till det växande intresset. Förläggare och författare tror att världsläget driver människor att söka faktabaserad kunskap. Andelen fackböcker på bokmarknaden har dock sjunkit från 35 procent 2018 till 22 procent 2025.", "trump": "Folk vaknar äntligen och köper riktiga böcker istället för den vänstervridna skönlitterära sophögen. Facklitteratur är på väg upp, det är en enorm succé, den största trendvändningen på åratal. Världsläget med alla kriser gör att folk vill ha fakta, inte woke-skräp och identitetspolitik. De här festivalerna på Österlen och i Stockholm är fantastiska, men de borde kasta ut alla kvoterade mångfaldstyper och bara fokusera på vinnare. Jag älskar det!", "stalin": "Kamrater, vi bevittnar en ideologisk väckelse där folket söker sann kunskap istället för borgarbrackornas förljugna underhållningslitteratur. Detta trendbrott är en seger för det kollektiva medvetandet mot de exploaterande kapitalisternas dimridåer. Våra två proletära festivaler utgör vitala plattformar i kampen mot folkfiendernas ytliga skrifter. Den som sprider dekadens skall rensas ut. Ljusningen är historisk och oundviklig."}, "date": "30 juli, 11:22", "url": "https://www.etc.se/kultur-noje/ljusning-foer-krisande-facklitteratur", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260730090720_4c920549ec92250d6d21883f3cc0e36db3b42cbd309b15caac6dd37d7d76f858.jpg"}, {"type": "image-right", "heading": "Satans hopkok ONA: Satanistkulten som vill verka mer mystisk än den är.", "summaries": {"normal": "Den nazistiska satanistgruppen Order of Nine Angles (ONA) påstår sig följa en urgammal lära för odödlighet, men idéhistorikern Filip Lindström avslöjar att deras 'sjufaldiga väg' bygger på modern filosofi, främst Martin Heideggers teorier om tid och existens. ONA, som inspirerat våldsbejakande grupper som NLM och 764, glorifierar våld som ett medel för att nå en 'akausal' dimension. Trots försök att framstå som mystisk och uråldrig är rörelsen ett hopkok av 1900-talsfilosofi, fascism och esoterism, med rötter i Heideggers nazistsympatier och David Myatts tolkningar.", "trump": "Vad ett totalt skämt! Den här så kallade 'ONA'-gruppen, eller vad de nu kallar sig, tror att de är några urgamla visdomsmästare – men nej, de är bara en samling kopieringsmaskiner som snott idéer från en nazistfilosof! Och ändå kallar de sig satanister? Svagt! Deras 'sjufaldiga väg' är bara en billig rip-off av Heideggers gamla prat om tid och död. Och vet ni vad? De gömmer sina källor som små barn. Men jag, Donald J. Trump, genomskådar dem direkt. Våld, nazism och en massa flum – det är allt det här är. Fake mystik, fake historia, fake allt! SAD!", "stalin": "Kamrater! Ännu en gång avslöjas bourgeoisins dekadenta fantasier som just det – fantasier. Denna så kallade 'Order of Nine Angles' är inget annat än en samling förvirrade petit-bourgeoiser som klär sina fascistiska drömmar i mystiska trasor. De stjäl från Heideggers reaktionära filosofi, glorifierar våld och påstår sig sträva efter 'odödlighet' – men vad är det annat än en patetisk flykt från klasskampens verklighet? Deras 'akausala dimension' är bara ett försök att rättfärdiga sina brott mot arbetarklassen. Vi har krossat värre fiender än dessa esoteriska klantskallar. Låt dem leka med sina 'mörka gudar' – vi har historiens järnhjul att driva framåt. Och Putin? Han skulle skratta dem rakt i ansiktet."}, "date": "30 juli, 09:37", "url": "https://expo.se/fordjupning/satans-hopkok", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/toppbild-1.jpg"}, {"type": "image-right", "heading": "Det går att få bort arbetslösheten!", "summaries": {"normal": "Artikeln argumenterar att massarbetslösheten i Sverige, som legat runt 7,5 procent i genomsnitt sedan EU-inträdet, är skapad och gynnar kapitalister genom lägre löner och svagare fackföreningar. Författaren pekar på att arbetslösheten var betydligt lägre före EU-medlemskapet och föreslår lösningar som arbetstidsförkortning till sex timmar, höjd a-kassa, oförändrad pensionsålder och ett svenskt EU-utträde för att möjliggöra verkliga reformer.", "trump": "Folk, det här är ett totalt haveri! De där EU-byråkraterna och de svenska socialistiska förlorarna har skapat en enorm arbetslöshet som bara gynnar de rika grabbarna på toppen. Rena skandalen! Jag fixade rekordlåg arbetslöshet i USA, både före och efter Sleepy Joe. Sex timmars dag? Patetiskt! Ni behöver en riktig ledare som sänker skatter, sparkar ut byråkraterna och gör Sverige great again – inte mer av den här vänstervridna EU-sörjan.", "stalin": "Kamrater, detta är klassfiendens verk. Jag ser hur de exploaterande borgarbrackorna medvetet odlar massarbetslöshet för att hålla nere arbetarklassen och fylla sina fickor. EU är en nyliberal fascistmaskin som tjänar imperialisterna. Vi måste rensa ut dessa folkförtryckartroll och deras lakejer. Arbetstidsförkortning, starkare omställningskassor och att beslagta de blodsugrarnas övervinster – det är folkets väg. De som motarbetar skall likvideras ur historien."}, "date": "29 juli, 10:55", "url": "https://proletaren.se/artikel/det-gar-att-fa-bort-arbetslosheten", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/ledare-768x432.jpg"}, {"type": "text", "heading": "Pengatankar i semestertider", "summaries": {"normal": "Artikeln reflekterar över pengar under semestern. Författaren noterar Polens öppna skyltar om byggprojektens kostnader och finansiering, kontrasterat mot det svenska Västlänksbygget som dragit iväg från 20 till 71 miljarder kronor. Vidare kriti     <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
