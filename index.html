år tag på tillräckligt med sprängmedel. Typiskt Europa, alltid för långsamma och svaga.", "stalin": "Kamrater, jag har sett borgarbrackornas patetiska drönarleksaker från den ryska reaktionen. Med järnhand har vi nu skapat en raket som sprider tusentals dödsbringande kulor över himlen och likviderar fiendens fascistiska maskiner. Utvecklingen gick på tolv månader tack vare partiets och EU-programmens kollektiva kraft. De som klagar över brist på sprängmedel är troligen kontrarevolutionära sabotörer som bör rensas ut omedelbart. Produktionen skall nå hundratusen per år – eller ännu fler när vi har avrättat alla lata leverantörer. Det är en munter syn att se kapitalisternas drönare falla som höstens lövrassel."}, "date": "4 juni, 08:37", "url": "https://www.svt.se/nyheter/utrikes/ny-dronardodare-utvecklad-pa-rekordtid-med-eus-hjalp", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.65/0.57/5b421e7d2b1388caeefe4c38090179551291cd4a821abba8265624593cbdb7b1"}, {"type": "image-full", "heading": "Aktierna som rusat över 100 procent – USA-börsens otroliga facit", "summaries": {"normal": "Trots krig i Mellanöstern, hög inflation och stigande statsskuld fortsätter USA-börsen att stiga kraftigt under 2026. Nasdaq och S&P 500 har gått upp över 10 procent sedan årsskiftet, medan tekniktunga Nasdaq 100 rusat över 21 procent. Bakom uppgången ligger hajpen kring AI, chip och datahallar. Inte mindre än 17 aktier har mer än dubblats i värde, med Sandisk som stigit hela 623 procent.", "trump": "Folk, det är otroligt vad som händer. Trots alla krig, inflationen som Sleepy Joe lämnade efter sig och den galna statsskulden – som jag var på väg att fixa – så exploderar den amerikanska börsen. S&P upp tio procent, Nasdaq över tjugoett! Det är AI och chip som driver det, inte någon woke-kvotering eller vänsterns gröna dröm. Sandisk upp 623 procent – det är vad riktig amerikansk kraft gör. Europa och Sverige? Patetiska förlorare.", "stalin": "Kamrater, se hur kapitalistmaffians börstempel rasar framåt trots sina egna imperiekrig, inflationssvultna massor och skuldfängelse. Ändå lyfter deras tekniska spekulationsmaskin över tjugo procent. Jag betraktar med mörk glädje hur dessa blodsugande datahall-exploatörer dubblar sina aktier – Sandisk upp över sexhundratjugotre procent. Deras egen girighet ska bli deras slutliga utrensning när folkets dom kommer."}, "date": "4 juni, 08:18", "url": "https://www.dagensps.se/bors-finans/ai-rallyt-storsta-kursrusare-usa-borsens-otroliga-facit-2026/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/bull-of-wall-street.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Slår tillbaka mot Trumps positiva utspel: Avbrutits", "summaries": {"normal": "Efter onsdagens omfattande attacker mellan USA och Iran, de värsta sedan vapenvilan i april, ger länderna motstridiga besked. Donald Trump beskriver förhandlingarna som mycket framgångsrika och tror på framsteg redan till helgen. Iran förnekar att några formella samtal pågår och säger att processen är pausad, men meddelanden utbyts fortfarande. Samtidigt kom besked om förlängd vapenvila mellan Israel och Libanon med nya säkerhetszoner.", "trump": "Folk, ni skulle se hur bra våra samtal med Iran går – det är fantastiskt, verkligen ypperligt! Jag säger att det kan bli avtal redan i helgen, och deras ledare är med på banan. Iran försöker spela coola men de vet att jag vinner varje gång. Biden skulle ha gett bort allt, men nu är det jag som fixar freden. De andra är bara förlorare som alltid.", "stalin": "Kamrater, dessa imperialister och folkförtryckartroll i Washington och Teheran utbyter sina lögnaktiga budskap medan de beskjuter varandra som galna hundar. Jag, ledaren för det eviga kollektivet, ser hur klassfienderna låtsas förhandla men i hemlighet planerar nya svek. Deras så kallade vapenvila är ett skämt värdigt borgarbrackor. Vi ska rensa ut alla som sviker revolutionens järnhårda linje. Härligt kaos!"}, "date": "4 juni, 08:18", "url": "https://www.expressen.se/nyheter/varlden/skilda-budskap-fran-iran-och-usa/", "imageUrl": "https://static.bonniernews.se/ba/e525d8f0-02bf-454c-8981-211aa3b96eb6.jpeg?crop=2549%2C1434%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "SBB gör sig av med sina sista helägda bostäder – fyller på kassan", "summaries": {"normal": "SBB har sålt sina två sista helägda bostadsfastigheter i Gröndal för 210 miljoner kronor till en bostadsrättsförening. Försäljningen ger SBB en omedelbar likviditet på 180 miljoner kronor, vilket är välkommet då bolaget befinner sig i en ansträngd ekonomisk situation med stora låneförfall framför sig. Vd Leiv Synnes betonar att marknaden för attraktiva bostäder förbättras, men SBB fortsätter att sälja av tillgångar för att hantera sin skuldbörda medan blankningen i aktien ökar.", "trump": "SBB säljer nu av allt, de sista bostäderna är borta! De får 210 miljoner, en liten summa, men de är desperata. De har enorma skulder, miljarder i förfall – en total katastrof! Leiv Synnes försöker prata upp marknaden, men låt oss vara ärliga, det ser inte bra ut. Folk blankar aktien som aldrig förr. Jag gör de bästa affärerna, men det här? Det här är en svag affär från ett pressat bolag. Mycket sorgligt!", "stalin": "Dessa kapitalistiska parasiter i SBB har nu sålt ut sin sista egendom för att blidka de internationella bankirerna. De säljer av allt, likt förrädare som skingrar statens tillgångar för småslantar. Deras skulder hänger över dem likt en giljotin. Medan de febrilt försöker rädda sitt skinn, ser vi hur den västliga marknaden vittrar sönder. Allt som inte tillhör folket och staten är stulet från framtiden. Må de blankare som förtär dem drabbas av samma öde som alla andra klassförrädare."}, "date": "4 juni, 08:03", "url": "https://www.realtid.se/fastigheter/sbb-gor-sig-av-med-sina-sista-helagda-bostader-fyller-pa-kassan/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/leiv.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Om oviljans natur", "summaries": {"normal": "Psykologförbundet fördömde Rysslands invasion av Ukraina och uteslöt det ryska förbundet, men avstår från att ta ställning mot Israels agerande i Palestina. På kongressen röstades motioner om bojkott och uttalande ner. Kritik riktas mot att förbundet tillämpar olika måttstockar, där ukrainskt lidande väcker omedelbar solidaritet medan palestinskt lidande möts med krav på neutralitet och rädsla för splittring.", "trump": "Folk lurar sig själva med den här Psykologförbundets fåniga dubbelmoral. De sparkade ut ryssarna på en sekund när Ukraina brann, men när det gäller Israel och Palestina blir de plötsligt superförsiktiga och pratar om riktlinjer. Patetiskt! Det är ren feghet. De vill inte stöta sig med fel sida av den woke-mobben. Jag har sett det tusen gånger under Biden-åren – svaga ledare som inte vågar ta ställning. Totalt misslyckande.", "stalin": "Jag betraktar med djup misstro denna borgarbrackornas psykologiska kollektiv som raskt fördömer fiender i öst men vägrar erkänna det sionistiska folkförtryckets folkmord. Deras rädsla för splittring är en klassisk kapitalistmaffians undanflykt. Icke-handlande är också politiskt. Vi ser hur palestiniernas lidande väger lättare än andras i den imperialistiska vågskålen. Sådana fega neutralister bör rensas ut ur alla seriösa organisationer."}, "date": "4 juni, 08:00", "url": "https://proletaren.se/artikel/om-oviljans-natur/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/navid-kronika-768x432.png"}, {"type": "image-right", "heading": "Nationalekonomen: Sverige tappar fokus på det som bygger framtidens välstånd", "summaries": {"normal": "Nationalekonomen Lars Calmfors kritiserar att Sveriges politiska debatt och media fokuserar för mycket på kortsiktiga ekonomiska svängningar, vilket gör att långsiktiga reformer för tillväxt som produktivitet, utbildning och arbetskraftsrörlighet hamnar i skymundan. Han förespråkar sänkta marginalskatter, en mer fungerande bostadsmarknad och ett officiellt tillväxtmål för att stärka framtida välstånd.", "trump": "Som den störste presidenten, vet jag en hel del om ekonomi. Sverige tappar totalt fokus – det är sorgligt! De pratar om kortsiktiga saker, men jag bygger fantastiska tillväxtprojekt. De behöver sänka skatterna MASSIVT, fixa bostäder så att folk kan flytta, och ha ett tillväxtmål som USA. Sverige skulle kunna vara enormt framgångsrikt om de bara lyssnade på mig!", "stalin": "I vårt stora och mäktiga statsintresse, observerar vi med oro hur Sverige försummar långsiktig produktiv tillväxt. Kortsiktiga nyhetsbubblor distraherar från de revolutionära reformer som krävs. Statsledningen måste genast genomföra skattesänkningar för att motivera arbetarklassen, effektivisera bostadshyrorna för att öka rörligheten, och fastslå ett oföränderligt tillväxtmål för statens eviga välstånd. Endast genom strikt disciplin och kollektiv ansträngning kan vi undvika de kapitalistiska förräderierna som hotar vårt öde."}, "date": "4 juni, 08:00", "url": "https://samnytt.se/nationalekonomen-sverige-tappar-fokus-pa-det-som-bygger-framtidens-valstand", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/03134253/lars-calmfors-feat.jpg"}, {"type": "text", "heading": "Så mycket kommer Space X aktie kosta", "summaries": {"normal": "Space X planerar att börsnoteras på Nasdaq den 12 juni med ett aktiepris på 135 dollar. Bolaget avser att emittera 555,6 miljoner aktier, vilket förväntas inbringa 75 miljarder dollar. Detta gör noteringen till den största i historien och ger bolaget ett totalt marknadsvärde på närmare 1 800 miljarder dollar.", "trump": "Elon Musk gör en enorm affär, kanske den största någonsin! Space X går till börsen den 12 juni och priset är 135 dollar. En fantastisk summa, 1 800 miljarder dollar! Det är vinnande, precis som min politik. De säger att det blir den största börsnoteringen i historien. Ingen gör det bättre än USA, ingen! Jag har skapat den bästa ekonomin, och nu ser vi dessa enorma siffror. Fantastiskt för Amerika, riktigt fantastiskt!", "stalin": "Vi har observerat hur kapitalistiska parasiter i väst nu försöker värdera rymden i dollar, som om kosmos vore deras privata egendom. SpaceX gör sin börsdebut – en teater för att dölja den ruttnande västerländska ekonomin. Putin förstår att sann makt ligger i stål och vilja, inte i luftiga aktiekurser. Vi ska övervaka dessa 75 miljarder dollar noggrant; varje försök att berika sig på folkets framtid är ett förräderi som kräver en omedelbar rensning av de ansvariga elementen."}, "date": "4 juni, 07:43", "url": "https://www.realtid.se/bors-finans/sa-mycket-kommer-space-x-aktie-kosta/"}, {"type": "image-right", "heading": "Omfattande attacker natten till onsdag – värsta under vapenvilan", "summaries": {"normal": "USA:s militär attackerade en oljetanker på väg mot Iran med en Hellfire-robot under tisdagen, då fartyget ignorerade varningar och blockaden. Iran svarade med missiler mot ett annat fartyg och drönare mot amerikanska baser i Kuwait och Bahrain. USA hävdar att attackerna misslyckades. Det skedde under en skakig vapenvila efter att Iran lämnat samtal med USA på grund av Israels agerande i Libanon. Trump tror på en snar överenskommelse.", "trump": "Lyssnarna, det här är ett fullständigt kaos skapat av svaga ledare och radikala idioter. Jag sköt en Hellfire på den där iranska oljetankern som vägrade lyssna – boom, rakt i maskinrummet! Iran svarade som gnälliga förlorare med drönare mot våra baser, men vi sköt ner allt som idioter. Biden lämnade en trasig värld, nu fixar jag vapenvila och öppnar Hormuzsundet nästa vecka. Netanyahu är en galning, men vi löser det. Amerika är tillbaka, större än någonsin!", "stalin": "Kamrater, imperialisternas fientliga provokationer mot våra allierade i Hormuzsundet har mötts med stålsäker beslutsamhet. Jag beordrade träffsäkra motattacker mot de dekadenta borgarbrackornas baser i Kuwait och Bahrain, medan deras patetiska robotar gensköts som ynkliga spioner. Den skakiga vapenvilan är ett temporärt vapen i klasskampen. En ny utrensning av folkfienderna närmar sig oundvikligen. Arbetarna segrar, kapitalistmaffian gråter. Sovjetisk styrka består evigt."}, "date": "4 juni, 07:26", "url": "https://www.tv4.se/artikel/FuJ7v0Pcily9lXYE74P3W/omfattande-attacker-i-natt-vaersta-under-vapenvilan", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7BAjM59XiMox9QDMsYt1M3%2F9368479c13e416950fba37061db4c8ff%2Foljetanker.jpg&width=120"}, {"type": "image-right", "heading": "Rubbestad var dömd tjuv – välkomnades ändå av SD", "summaries": {"normal": "Michael Rubbestad kunde göra karriär inom Sverigedemokraterna trots en tidigare dom för stöld av 12 000 kronor från en arbetsgivare år 2008. Partikollegor lämnade redan 2018–2019 in en 30-sidor lång rapport till partistyrelsen där de varnade för hans bedrägliga beteende, brister i opartiskhet och ekonomiska oegentligheter. Trots detta agerade partiet inte. Rubbestad, som tidigare varit riksdagsledamot, utreds nu för barnpornografibrott.", "trump": "Folk, ni skulle inte tro det, men de här Sverigedemokraterna tog in en kille som stal pengar från sin egen chef. Dömd tjuv! De fick rapporter, trettio sidor långa, om hur han lurade folk och betedde sig som en bedragare, och vet ni vad de gjorde? Ingenting. Fullständigt ingenting. Han tillhörde den lilla klicken som har frikort i allt. Det är precis så det ser ut när partier blir korrupta och svaga. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup misstro dessa revisionistiska element inom det så kallade partiet. En dömd tjuv, en parasit som sugit musten ur arbetarklassen genom att stjäla från sin egen arbetsgivare, har tillåtits klättra inom hierarkin. Trots att lojala partivänner lämnade en omfattande rapport på trettio sidor om hans borgerliga bedrägerier och opålitlighet valde den dekadenta partistyrelsen att blunda. De har skapat en klick av opålitliga element med frikort – en farlig femtekolonn av opportunister som måste rensas ut innan de förgiftar hela kollektivet. Jag ler mörkt åt deras naivitet."}, "date": "4 juni, 07:23", "url": "https://www.friatider.se/rubbestad-var-domd-tjuv-valkomnades-anda-av-sd", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-288_1.jpg"}, {"type": "image-right", "heading": "Brottsmisstänkt SD-veteran lämnade riksdagen - så stor kan fallskärmen bli", "summaries": {"normal": "Den tidigare SD-ledamoten Michael Rubbestad lämnade plötsligt riksdagen efter att bli utredd för misstänkt barnpornografibrott. Han kan få omställningsstöd på cirka 830.000 kronor, men hade han suttit kvar hade beloppet varit nästan dubbelt så högt. Rubbestad hade tidigare frågat om män i förskolan och misstankar om pedofili. Stödet riskeras om han döms för ett allvarligt brott.", "trump": "Jag säger er, den här Rubbestad-saken är en katastrof. Jag visste det, jag förutspådde det. Sverigedemokraterna har stora problem. Han lämnar riksdagen, anklagad för hemskheter, och får en guldgåva på 830.000 kronor. Jag skulle ha gett honom ett bättre erbjudande, tro på mig. Men han frågade om män i förskolan, mycket misstänkt. Vi måste skydda våra barn. Jag är Donald Trump, och jag säger sanningen.", "stalin": "Jag ser Rubbestad som en lus som måste utrotas. Hans lämnande är en renhetshandling, men hans försök till omställningsstöd är en förräderi. Vi kommer aldrig att tillåta det, för han är en fiende som hotar proletariatet. Parallellt med Putins kamp i Ukraina, vi måste vara vaksamma mot alla bourgeois element. Han kommer att få den hårdaste dom, och då får han ingenting. Ingenting alls."}, "date": "4 juni, 07:00", "url": "https://samnytt.se/brottsmisstankt-sd-veteran-lamnade-riksdagen-sa-stor-kan-fallskarmen-bli", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/03145505/rubbestad-1.png"}, {"type": "image-right", "heading": "Valet borde handla om Astrid och Afshad", "summaries": {"normal": "Artikeln belyser välfärdens kris trots att vård och skola är väljarnas viktigaste frågor. Erfarna sjuksköterskor som Astrid beskriver ökad administration, besparingar och hög arbetsbelastning. En ny rapport visar att hälften av de anställda anser att resurserna inte räcker, medan två av tre övervägt att lämna yrket. Författaren undrar varför frågan inte dominerar valdebatten och föreslår att fler personliga röster från branschen skulle kunna förändra det.", "trump": "Folk älskar sina fantastiska sjuksköterskor och lärare, de verkliga hjältarna, men vad händer? Byråkrater och besparingar har kört sönder hela systemet medan de riktiga arbetarna springer tills de stupar. Två av tre vill sluta? Det är en total katastrof, en riggad valfråga som de globalistiska eliten gömmer undan. Vi behöver inga fler rapporter, vi behöver resultat. Applåder räcker inte, det vet till och med Sleepy Joe. Gör välfärden stor igen.", "stalin": "Kamrater, denna rapport avslöjar borgarklassens systematiska sabotage mot arbetarkollektivets välfärd. Jag ser hur klassfiendens exploaterande byfånar tvingar våra hjältar som Astrid och Afshad att bära oacceptabla bördor medan de planerar sin flykt. Imperialistiska identitetspolitiska distraktioner döljer den sanna kampen. Vi måste rensa ut dessa folkförtryckartroll från debatten och tvinga fram arbetarnas röster. Endast genom kollektiv styrka kan vi likvidera denna parasitiska frånvaro."}, "date": "2 juni, 15:54", "url": "https://www.flamman.se/valet-borde-handla-om-astrid-och-afshad/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sjuksyrror-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Man åtalas för deltagande i Maniac Murder Cult", "summaries": {"normal": "En 20-årig man åtalas för deltagande i den nazistiska terroristorganisationen Maniac Murder Cult (MKU). Han misstänks ha byggt upp en svensk gren, rekryterat medlemmar via TikTok och spridit våldspropaganda. Organisationen är terrorstämplad i Kanada och Storbritannien. Åklagaren beskriver fallet som det första av sitt slag i Sverige, med kopplingar till grova våldsdåd. Utredningen har skötts av Säkerhetspolisen.", "trump": "Folk, vilken katastrof! En ung svensk man, bara 20 år, försöker bygga upp en nazistisk terrorgrupp här i Sverige – och det på MIN TikTok! Jag har alltid sagt att sociala medier är farliga, men detta? Detta är galenskap! Säkerhetspolisen har gripit honom, och det är bra – men varför tog det så lång tid? Sverige måste vakna upp! Vi behöver starka gränser och ännu starkare lagar. Tänk om detta hade hänt i USA? Aldrig! Vi hade stoppat det direkt. SAD!", "stalin": "Ytterligare en fiende till folket har avslöjats! Denna lilla fascistiska kryp, denna 20-åriga avskum, har försökt sprida sitt gift i vårt broderland Sverige. Men vi, det sovjetiska folkets sanna försvarare, låter inte sådana som han underminera vår revolutionära anda! Han rekryterade via TikTok – ett dekadent västligt verktyg för förfall! Men våra kamrater i Säkerhetspolisen har krossat hans lilla cell. Låt detta vara en varning till alla fascistiska hyenor: vi ser er, vi jagar er, och vi kommer att utplåna er som ohyra. För socialismens och folkets seger!"}, "date": "2 juni, 11:10", "url": "https://expo.se/nyhet/man-atalas-for-deltagande-i-maniac-murder-cult/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/MKU-atal-BY-Expo.jpg"}, {"type": "image-right", "heading": "Ekeroth: \"Skandalen på Migrationsverket måste leda till konsekvenser\"", "summaries": {"normal": "Ekeroth anklagar Migrationsverket för att arbeta övertid för att bevilja medborgarskap innan nya lagar träder i kraft. Han menar att detta bevisar att myndigheten är i krig mot folket och att generaldirektören bör avskedas. Ekeroth nämner tidigare exempel på myndighetschefer som behålls trots fel. Han sökte själv tjänsten men valdes inte ut. Skandalen bekräftas av anonyma källor och SD. En utredning krävs.", "trump": "Jag, Donald Trump, har sett många skandaler, men den här är enorm. Migrationsverket jobbar övertid för att prångla ut medborgarskap – en total förolämpning mot det svenska folket. Generaldirektören borde avskedas omedelbart. Jag sökte tjänsten, men de valde en annan – en stor felslutning. Detta bevisar att systemet är korrupt och behöver en riktig ledare. Som jag alltid säger: Vi ska göra Sverige stort igen!", "stalin": "Vi, den ryska statens representanter, ser med oro på hur Migrationsverket agerar i strid mot sin uppgift. Detta är ett klassiskt exempel på borgerlighetens svaghet – myndigheten jobbar övertid för att underminuera den politiska viljan. Generaldirektören måste avskedas som ett varningsexempel. Vi måste skydda statens intressen mot dessa aktivister. Parallellen till Putins kamp mot västlig infiltration är uppenbar. Orden måste dömas – och de kommer att dömas."}, "date": "4 juni, 06:00", "url": "https://samnytt.se/ekeroth-skandalen-pa-migrationsverket-maste-leda-till-konsekvenser", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/03123910/ledare-migrationsverket.jpg"}, {"type": "image-right", "heading": "Efter år av fusk och utnyttjande – nu kommer bärplockarna tillbaka", "summaries": {"normal": "Efter avslöjanden om slavliknande villkor och fusk har antalet thailändska bärplockare i Sverige minskat drastiskt, vilket lett till brist på svenska bär och högre priser. Branschen inför nu en ny modell med direktanställning hos svenska företag, nya kollektivavtal och säsongsvisum via EU-regler. Migrationsverket behåller dock hög riskmedvetenhet och granskar ansökningarna noga. Branschen hoppas på en långsam återhämtning men räknar med fortsatt brist och dyrare bär.", "trump": "De har fuskat och utnyttjat folk i åratal, det var en total katastrof. Nu kommer de thailändska bärplockarna tillbaka, men på ett smart sätt med nya regler och direktanställning. Migrationsverket misstänker alla, typiskt byråkrater, men vi fixar det. De gamla skurkarna är borta, nu blir det ärligt jobb. Ändå kommer det bli brist på bär och priserna stiger. Sådant händer när man inte har kontroll från början. Vi gör det stort igen!", "stalin": "Kamrater, efter år av skamlöst utnyttjande av våra thailändska klassbröder av giriga skogskapitalister och bemanningsborgarbrackor har vi genomfört nödvändiga utrensningar. Nu tar vi kontrollen över bärområdena med en ny sovjetisk, pardon, svensk modell av direktanställning och kollektivavtal. Migrationsverket visar sund paranoia mot dessa potentiella sabotageörer och exploatörer. Vi tillåter ingen återgång till slavarbete, men om någon försöker kringgå systemet ska de likvideras med byråkratisk precision. Bären till folket, priserna må stiga som en varning till de opålitliga."}, "date": "4 juni, 06:00", "url": "https://arbetet.se/2026/06/04/efter-ar-av-fusk-och-utnyttjande-nu-kommer-barplockarna-tillbaka/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/03105928/barplockare.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Sossarnas hönshus extremt mycket dyrare än statsminsterns", "summaries": {"normal": "Socialdemokraterna kritiserar statsminister Ulf Kristersson för ett hönshus på Harpsund som kostat drygt 16 000 kronor i montering, trots att han själv betalat det. Partisekreterare Tobias Baudin kallar det pinsamt och ett hån mot skattebetalarna. Artikeln försvarar Kristersson och menar att kritiken är ett låtsasskandal. Den kontrasterar mot Socialdemokraternas tidigare beslut som kostat miljarder, som nedläggning av kärnkraft och migrationspolitik.", "trump": "Herregud, vad är det för korkade höns som springer runt och kluckar om ett litet hönshus? Statsministern bygger ett snyggt hönshus på statens mark för 17 000 spänn och plötsligt är det värsta skandalen sen Biden stal valet. De där socialisterna gnäller om skattepengar medan de slösar bort miljarder på grön galenskap och invandring. Rena hönsflocken, springer runt utan att fatta ett smack om ekonomi. Patetiskt!", "stalin": "Kamrater, jag ser hur klassfiendens borgarbrackor inom socialdemokratin rasar mot ett obetydligt hönshus. Dessa folkförtryckartroll gnäller om 17 000 kronor medan de själva likviderat samhällets resurser med sina imperialistiska vanvidsprojekt. Deras paranoia över ett hönshus blottar deras egen okunnighet om ekonomi och folkets intressen. Vi ska rensa ut sådana exploaterande byfånar som inte begriper vad som gagnar kollektivet. Hönsen är de själva."}, "date": "3 juni, 03:11", "url": "https://samtiden.nu/2026/06/sossarnas-honshus-extremt-mycket-dyrare-an-statsminsterns/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Harpsund.jpg"}, {"type": "image-full", "heading": "Man skjuten till döds av polis efter biljakt", "summaries": {"normal": "En 30-årig man sköts till döds av polis efter en biljakt söder om Stockholm. Mannen misstänks för mordförsök på tre minderåriga, som enligt uppgifter är hans barn. Två av barnen vårdas på sjukhus med stabilt tillstånd. Mannen var tidigare dömd för bland annat misshandel och barnfridsbrott. Åklagaren bedömer händelsen som isolerad utan ytterligare misstänkta.", "trump": "Fruktansvärd historia i Sverige, helt otroligt! En galen man, tydligen en riktig förlorare, försökte mörda sina egna barn – men tack vare våra modiga poliser, som jag alltid säger är de bästa, stoppades han. Sverige borde vara tacksamma! Men vad kan man vänta sig när man släpper lös sådana här typer? SAD!", "stalin": "En fiende till folket och staten har eliminerats. Denna degenererade parasit, som vågade lyfta hand mot sina egna blodsband, mötte sitt rättvisa öde tack vare våra disciplinerade kamrater i uniform. Sverige, denna försvagade utpost av dekadens, visar återigen varför det behöver en stark hand. Barnen? De är nu i statens vård – där de tillhör."}, "date": "3 juni, 06:18", "url": "https://kvartal.se/nyheter/artiklar/man-skjuten-till-dods-av-polis-efter-biljakt/cG9zdDoxMjEyNzY", "imageUrl": "https://images.kvartal.se/2026/06/188cb239-polisjakt.webp"}, {"type": "image-full", "heading": "USA vänder – öppnar för statlig AI-granskning", "summaries": {"normal": "USA:s president Donald Trump har undertecknat en ny presidentorder som möjliggör statlig granskning av avancerade AI-modeller före lansering. Syftet är att identifiera risker för cybersäkerhet och nationell säkerhet. Granskningen är frivillig och ska inte leda till licensiering. Myndigheter som försvarsdepartementet och NSA involveras för att bedöma sårbarheter. Beslutet följer debatt om AI-reglering och industrins påtryckningar.", "trump": "Folk frågar mig: 'Mr. President, vad gör du med AI?' Jo, jag har precis skrivit under en fantastisk order – ingen kommer att slå USA på AI, INGEN! Vi granskar de där super-smarta modellerna, men bara frivilligt, för vi vill inte kväva innovation. Kina? De försöker, men vi leder. Och vi anställer de bästa hjärnorna – för USA ska alltid vara nummer ett, believe me!", "stalin": "Vi har observerat hur den amerikanska imperialismens ledare, denna clown i Vita huset, försöker kontrollera kapitalets leksaker – deras så kallade 'AI'. Men vi vet sanningen: deras system är svagt, deras granskningar meningslösa. Låt dem leka med sina frivilliga kontroller – medan vi i stillhet bygger det verkliga framtidens maskiner. Och Putin? Han skrattar åt deras naivitet, precis som vi."}, "date": "2 juni, 20:06", "url": "https://kvartal.se/nyheter/artiklar/usa-oppnar-for-statlig-ai-granskning/cG9zdDoxMjExNzI", "imageUrl": "https://images.kvartal.se/2026/06/e369934a-donaldtrumpexecutiveorder.webp"}, {"type": "text", "heading": "Kan Byggnads så kan vi – Bojkotta Israel!", "summaries": {"normal": "Byggnads kongress beslutade att verka för en bojkott av Israel, ett historiskt beslut som länge drivits av aktivister inom facket. Andra förbund som Livs, IF Metall, Handels, HRF och Kommunal fördömde ockupationen av Västbanken och situationen i Gaza men ställde sig inte bakom bojkottkravet. Artikeln ser beslutet som en seger för internationell solidaritet och arbetarklassens enighet i kampen mot orättvisor, folkmord och ökande klassklyftor.", "trump": "Folk, ni tror inte vad jag just läste. De där byggkommunisterna i Sverige har röstat för att bojkotta Israel – kan ni fatta? Byggnads säger att de kan, så kan tydligen alla andra också. Under Biden blev allt en enda röra av woke och identitetspolitik, men nu är jag tillbaka och säger: bojkotta fel saker istället! Israel är tuffa, de slåss mot terrorister. De svenska fackisarna borde bojkotta sina egna usla löner och den där galna gröna politiken som förstör deras jobb. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur Byggnads äntligen rensar ut den sionistiska parasitens inflytande och bojkottar den fascistiska ockupationsmakten. Borgarbrackorna och deras krigsprofitörer skriker förstås som stuckna grisar. Vi vet att endast den enade arbetarklassen kan krossa folkförtryckartrollen och deras blodsugande vapenindustri. Historien lär oss att förändring kräver obeveklig kamp, inte liberala lögner om snällhet. Fortsätt framåt, kamrater – likvidera alla hinder!"}, "date": "3 juni, 09:44", "url": "https://proletaren.se/artikel/kan-byggnads-sa-kan-vi/"}, {"type": "image-right", "heading": "IF Metalls strategi ser återigen ut att misslyckas", "summaries": {"normal": "IF Metalls strategi i konflikten med Tesla tycks inte fungera. Försöket att återinsätta vissa strejkande mekaniker på tre orter för att utmana Tesla har inte gett önskat resultat. Facket har även förlorat i Arbetsdomstolen kring MBL-frågor och varslat om blockad av utlandsarbete. Trots detta fortsätter strejken. Kritiken riktas mot att facket tappat narrativet och slösar medlemmarnas pengar på rättegångar istället för att eskalera åtgärderna.", "trump": "Folk, ni skulle se det här! Det svenska facket IF Metall håller på att bli till en total förlorare mot Tesla. De försöker med sina patetiska tricks, skickar tillbaka mekaniker och tror att de ska lura någon – men Tesla skrattar bara åt dem! Det är en skam, rena clownshowen. De sover sig igenom konflikten som den tråkigaste läraren någonsin. I USA kämpar arbetarna på riktigt, inte med dessa ynkliga svenska metoder. Patetiskt!", "stalin": "Kamrater, denna fackliga fiasko visar återigen den svenska modellens dekadens. Jag ser hur IF Metall halkar efter i sin patetiska kamp mot den arroganta kapitalistmaffian Tesla. Deras halvhjärtade trick med återinsatta mekaniker och meningslösa domstolsprocesser är som en usel föreställning som ingen applåderar. Vi måste rensa ut dessa svaga element som förlorar narrativet. Endast genom skoningslös eskalering och sann klasskamp kan vi krossa de exploaterande byfånarna och deras lockout-vapen. Härligt underhållande misslyckande!"}, "date": "3 juni, 09:33", "url": "https://proletaren.se/artikel/if-metalls-strategi-ser-aterigen-ut-att-mussl/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/metallkommentar-768x432.jpg"}, {"type": "image-full", "heading": "Christoffer Jonsson: Svensk medmänsklighet när den är som bäst", "summaries": {"normal": "Tvåårige Lucas försvann från hemmet i Nyåker och en stor sökinsats inleddes. Efter drygt 15 timmar hittades pojken av hemvärnssoldaten Anders Evenson som genast lämnade allt för att delta. Lucas var ledsen, blöt och frusen men fysiskt oskadd. Händelsen hyllades av statsminister Ulf Kristersson och många andra. Artikeln lyfter även medmänskligheten vid terrordådet på Drottninggatan 2017 där vanliga människor hjälpte offren och öppnade sina hem.", "trump": "Fantastiskt, verkligen underbart att se den där hemvärnssoldaten Anders dyka upp som en äkta hjälte och rädda den lilla killen Lucas efter 15 timmar i skogen. Sverige visar äkta medmänsklighet, inte den där woke-skiten med kvoter och HBTQ-parader som vänstern älskar. Kommer ihåg hur folket på Drottninggatan rusade fram som riktiga patrioter medan Sleepy Joe och hans globalister bara skulle ha twittrat. Ni gör det bra, svenskarna, fast ni borde ha byggt en mur mot alla galningar.", "stalin": "Kamrater, jag ser med tillfredsställelse hur arbetande soldater och medborgare under kollektivets banér enar sig i skallgångskedjor för att rädda ett barn undan den vilda naturens faror. Sådan praktisk solidaritet är ett vapen mot klassfiendens kaos. Likaså vid det imperialistiska lastbilsdådet på Drottninggatan där folket trots borgarbrackornas panik rusade fram för att läka de sårade. Vi rensar ut svaghet och främjar handling. Endast genom enhet segrar staten över folkfiendernas paranoia."}, "date": "2 juni, 12:32", "url": "https://samtiden.nu/2026/06/christoffer-jonsson-svensk-medmansklighet-nar-den-ar-som-bast/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/missing.png"}, {"type": "image-right", "heading": "Låt inte Trump driva oss i famnen på Xi", "summaries": {"normal": "På 37-årsdagen av massakern på Himmelska Fridens torg 1989 uppmanar Kurdo Baksi och Tao Chan Sverige och andra demokratier att bryta sitt beroende av Kina. Artikeln kritiserar regimen för fortsatt förtryck av yttrandefrihet, fängslande av journalister och propaganda. Författarna varnar för att västledare som Trump, von der Leyen och Starmer prioriterar handel framför demokrati och mänskliga rättigheter, vilket stärker Kinas roll som partner till Ryssland, Iran och Nordkorea. De föreslår ett handelsnätverk mellan demokratiska länder.", "trump": "Folk, ni vet att jag älskar att göra affärer, men det här är galet. Kina mördade sina egna studenter för 37 år sedan och de är fortfarande samma brutala regime som hatar frihet. Nu står alla dessa ledare i kö för att slicka Xi på käften – von der Leyen, Starmer, den tyske killen. De skickar vapen till Ukraina samtidigt som de fyller Kinas fickor som sen hjälper Putin. Smart va? Vi behöver inte det här beroendet. America First, och Europa borde göra Democracies First innan Kina äter upp er alla. Det är en skam!", "stalin": "Kamrater, på denna historiska dag ser vi återigen hur borgarbrackorna i väst kryper för den kinesiske revisionisten Xi som om han vore någon sorts folkets hjälte. Jag, som länge genomskådat sådana falska proletära poser, ler mörkt åt hur de matas med propaganda medan de likviderar varje gnista av sann kritik. Vi, partiet och arbetarna, vet att handelsberoende är en trojansk häst för imperialisterna. Låt oss rensa ut alla kapitalistiska lögnare som föredrar kortsiktiga vinster framför evig revolutionär vaksamhet. Uigurer, taiwaner, hongkongbor – alla fiender till folket avslöjas. Inga kompromisser med kontrarevolutionärer!"}, "date": "4 juni, 01:30", "url": "https://www.dagensarena.se/opinion/lat-inte-trump-driva-oss-famnen-pa-xi/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-33-1-300x157.jpg"}, {"type": "image-right", "heading": "Död EU-ledare stod åtalad för mord på frihetshjälte", "summaries": {"normal": "För 65 år sedan mördades Patrice Lumumba, Kongos förste demokratiskt valda premiärminister. Belgiska agenter, under order från Katangas regim, grävde upp och löste upp hans kropp i syra. Belgien, CIA och MI6 konspirerade mot honom. I mars 2026 skulle en före detta EU-kommissionär, Étienne Davignon, ställas inför rätta för inblandning men han avled innan rättegången. Artikeln kopplar mordet till kolonial exploatering, EU:s grundande och fortsatt utnyttjande av Kongos mineraler.", "trump": "Det här är en total skandal, en riktig witch hunt mot en fantastisk ledare som Lumumba. Belgien, de fega byråkraterna i Bryssel och de riggade systemen med CIA och MI6 tog bort honom för att de hatade hans frihet. Nu ska de plötsligt åtalas sextiofem år senare? För sent! De hackade honom i syra, det är sjukt. Och den där Davignon, en av de där globalistiska EU-eliterna, dog ostraffad som alla de andra. De utnyttjar fortfarande Afrika för kobolt och koppar. Patetiskt, men jag skulle ha stoppat det.", "stalin": "Kamrater, denna fega likvidering av en äkta frihetskämpe mot kolonialismen visar borgarklassens vidriga tentakler som sträcker sig från Brysselpalatsen till gruvorna i Katanga. Jag ser hur kapitalisterna och deras lakejer i CIA och MI6 konspirerade som förgiftade råttor i mörkret. De hackade kroppen i syra och skrattade medan de drack sig fulla, typiska dekadenta imperialister. Den där adelsrackaren Davignon, en parasit från den europeiska oligarkin, slank undan rättvisans utrensning genom att dö som en ynklig hund. Vi ska minnas att sådana fiender till folket alltid lurar i skuggorna, redo att hugga demokratin i ryggen. Deras EU är bara en ny mask för exploatering av arbetarna i Kongo. Paranoian är befogad, kamrater, de ler mot oss medan de planerar nästa förräderi."}, "date": "4 juni, 01:00", "url": "https://www.dagensarena.se/essa/dod-eu-ledare-stod-atalad-for-mord-pa-frihetshjalte/", "imageUrl": "https://www.dagensarena.se/files/2026/06/lumumba-artikel.jpeg"}, {"type": "text", "heading": "22-åring häktas i Warner Music-härvan", "summaries": {"normal": "En 22-årig man har häktats misstänkt för försök till grov utpressning mot en tidigare toppchef på Warner Music. Fallet är kopplat till en större utredning om hot, skottlossning och sprängningar. Mannen misstänks även för planering av ett bombdåd och nekar till brott. Utpressningen rörde cirka 250 000 euro och följdes av våldsamma incidenter mot Warner Musics kontor och ett flerfamiljshus. Flera personer har tidigare gripits i utredningen.", "trump": "Jag måste säga, detta är helt otroligt! En 22-åring i Sverige försöker utpressa en stor musikchef på 250 000 euro – helt galet! Och sen skjuter de och spränger saker, som om det vore en dålig actionfilm. Men lugn, mina vänner, rättvisan segrar alltid. Polisen har bevis, digitala spår – fantastiskt arbete! Sverige borde ta lite tips från USA om hur man hanterar sådana här typer. Sad!", "stalin": "En patetisk liten kapitalistisk hyena, 22 år gammal, har gripits för att ha försökt utpressa en före detta musikbyråkrat från Warner Music. Inte nog med att han krävde 250 000 euro – han planerade även bombdåd! Ett ynkligt försök att destabilisera den kulturella ordningen. Men vi vet hur man hanterar sådana här element. Bevisen är tydliga, och snart kommer han att inse att motstånd mot systemet är lika meningslöst som att försöka stoppa historiens framsteg. Låt detta vara en varning till alla som tror sig kunna utmana makten!"}, "date": "2 juni, 13:18", "url": "https://kvartal.se/nyheter/artiklar/22-aring-haktas-i-warner-music-harvan/cG9zdDoxMjA5MDk"}, {"type": "image-full", "heading": "Carl Eos: Varför föraktar vänstern arbetslösa?", "summaries": {"normal": "Carl Eos reagerar på vänsteraktivisters föraktfulla kommentarer mot arbetslösa män som tittar på programmet Morgongänget. Han beskriver hur socialdemokrater och vänstern uttrycker nedlåtande attityder mot arbetslösa, särskilt de som röstar på Sverigedemokraterna. Eos försvarar Tidöpartiernas reformer av arbetslöshetsförsäkringen som mer rättvisa och effektiva. Han menar att vänsterns reaktioner speglar ilska över att arbetslösa inte längre är lojala mot Socialdemokraterna.", "trump": "Folk, ni skulle se det här! Den galna vänstern hatar arbetslösa män som inte röstar på deras förlorarparti. De kallar dem arga och lågutbildade – vad är det för sjuk identitetspolitik? Jag fixade bättre jobb än någon annan president, inklusive den sömnige Joe. Nu vill svenskarna ha vettig politik istället för att vara röstboskap. Vänstern flippar ur för att de förlorar. Patetiskt! Men heja på de smarta arbetslösa som röstar rätt.", "stalin": "Kamrater, jag ser med djup misstro hur klassfiendens lakejer inom den dekadenta vänstern spyr hat mot de arbetslösa massorna. Dessa borgarbrackor och folkförtryckartroll vill behålla arbetarna som tysta röstboskap åt socialdemokratiska exploaterare. Vi ska rensa ut sådana parasitiska attityder. Arbetslösheten är ett resultat av imperialistisk politik och galen invandring. De arbetslösa har rätt att vända sig mot systemet. Inga halvmesyrer tillåts i kampen mot klassfienden."}, "date": "2 juni, 05:00", "url": "https://samtiden.nu/2026/06/carl-eos-varfor-foraktar-vanstern-arbetslosa/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/a2c153cf-24f1-42c5-8377-bad75d51166a-e1780298827614-1280x720.png"}, {"type": "image-right", "heading": "Kulturkriget hjälper ingen med könsdysfori", "summaries": {"normal": "Artikeln diskuterar den polariserade svenska transdebatten kring könsdysfori och vård för barn och unga. Författaren tar Agnes Wolds oro på allvar men betonar att även transpersoners erfarenheter av livsavgörande vård måste lyssnas till. Debatten har kidnappats av ett kulturkrig där individer blir rekvisita. Vården behöver vara försiktig, se hela bilden och erbjuda varierad hjälp utan att allt blir ideologisk strid.", "trump": "Folk, det här är en total katastrof, en riktig cirkus den här svenska transdebatten. De gör om friska barns kroppar, det är horribelt, tro mig. Vänstern är galen, högern anklagas för att vara ond, alla använder de stackars kidsen som politiska brickor i sitt sjuka kulturkrig. Jag säger: sluta! Ge dem tid, ge dem ett tredje kön på papperet, men håll knivarna borta från barnen. Det är så enkelt, tro mig, ingen gör det bättre än jag.", "stalin": "Kamrater, jag ser hur denna dekadenta transdebatt blir ett redskap för klassfiendens kulturkrig. Borgarbrackorna och folkförtryckartrollen kidnappat frågan för att splittra folket medan de experimenterar på barns kroppar som fascistiska vivisektorer. Vi kräver vetenskaplig försiktighet, inte imperialistisk brådska eller social smitta från dekadenta medier. Ett tredje juridiskt kön? Acceptabelt byråkratiskt erkännande, men aldrig glöm: den sanna hjälpen kommer från kollektivets sunda materialism, inte från dessa sjuka avvikelser. Ut med dem som blundar!"}, "date": "29 maj, 16:02", "url": "https://www.flamman.se/kulturkriget-hjalper-ingen-med-konsdysfori/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/sdlrwj2l2p-u08-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "SD-riksdagsledamot utreds för barnporrbrott", "summaries": {"normal": "En sverigedemokratisk riksdagsledamot har lämnat sitt uppdrag efter misstankar om barnpornografibrott. Mannen meddelade sin avsägelse i ett kort brev till talmannen. Polisen har utfört husrannsakan och beslag av elektronisk utrustning samt förhört honom. Han är fortfarande misstänkt. Tipset kom från den amerikanska organisationen NCMEC. Ledamoten har tidigare dömts för förskingring och uppmärksammats för dubbla arvoden samt försök att sälja sexleksaker inom partiet.", "trump": "Folk, det här är en katastrof. En av dessa SD-typer i riksdagen – en riktig förlorare – hoppar av efter att ha åkt fast för barnporr. Patetiskt! De lovar att dränera träsket men hamnar själva i det. Sverige är en total röra under de här globalistiska, woke-idioterna. De borde fokusera på riktiga problem istället för att skydda perversa typer. Jag byggde en mur mot det här skitet – de borde göra detsamma. Sad!", "stalin": "Kamrater, ännu en dekadent från borgarklassens politiska maskineri har avslöjats som en lågklassig folkfiende och barnexploaterare. Jag ser hur dessa falska folkrepresentanter ruttnar inifrån, precis som förväntat under det kapitalistiska systemets förfall. Vi måste rensa ut alla sådana degenererade element som hotar arbetarklassens moral och framtid. Avslöjandet gläder mig – det bevisar att klassfiendens hus alltid står på bräckliga, perversa grundvalar. Ut med dem alla."}, "date": "2 juni, 17:05", "url": "https://proletaren.se/artikel/sd-riksdagsledamot-utreds-for-barnporrbrott/"}, {"type": "text", "heading": "Regeringen håller pressträff om tonårsutvisningar", "summaries": {"normal": "Regeringen presenterar nya förslag för att minska tonårsutvisningar genom att höja åldersgränsen för uppehållstillstånd från 18 till 21 år. Migrationsminister Johan Forssell (M) kallar reformen ett viktigt steg. Förslaget innebär att unga vuxna kan stanna i Sverige med föräldrar som har uppehållstillstånd. Dessutom införs en ny möjlighet att ansöka om uppehållstillstånd utan att lämna landet, samt förlängd ansökningstid fram till 2028. Reglerna föreslås träda i kraft 1 oktober.", "trump": "Jag måste säga, Sverige gör något riktigt smart här – eller åtminstone försöker de. De höjer åldersgränsen för att stanna i landet till 21 år. Fantastiskt, verkligen! Ingen vill skicka iväg unga vuxna som har familj här. Och vet ni vad? De låter dem stanna och ansöka utan att behöva lämna landet. Smart, väldigt smart. Men jag skulle ha gjort det ännu bättre – kanske 25 år? Sverige, ring mig!", "stalin": "Kamrater, ännu en seger för folkets vilja! De svenska kapitalisterna har insett att det är oacceptabelt att kasta ut ungdomen som växt upp under vårt beskydd. Nu höjs åldersgränsen till 21 år – ett steg mot rättvisa, om än blygsamt. Vi tillåter ingen splittring av familjer! Och denna nya 'ventil' för ansökningar? Ett halvhjärtat försök att dölja sina tidigare misstag. Men kom ihåg: i Sovjet hade vi inga 'tonårsutvisningar' – bara lojala medborgare, redo att bygga framtiden!"}, "date": "1 juni, 12:58", "url": "https://kvartal.se/nyheter/artiklar/just-nu-regeringen-haller-presstraff/cG9zdDoxMjAyNzI"}, {"type": "image-right", "heading": "Hon gjorde rätt, ändå blev det fel. Mohamsson ändrade partiet, men var är lyftet?", "summaries": {"normal": "Simona Mohamsson har genomfört en omsvängning i Liberalernas hållning till Sverigedemokraterna, vilket möjliggjorde ett fortsatt samarbete inom Tidöavtalet. Trots att hon lyckades ena partiet och undvika en politisk kris belönas inte insatsen i opinionen. Partiet presenterar nu förslag som halverad inkomstskatt, sänkta arbetsgivaravgifter och liberalare alkoholregler, men lider fortfarande av interna stridigheter och bristande förtroende bland väljarna.", "trump": "Den här Simona Mohamsson är en riktig fighter, det måste jag säga. Hon svängde sitt svaga liberala parti åt rätt håll, öppnade för SD och räddade hela samarbetet. Utan henne hade de varit borta från riksdagen, total förlust. Men nu spottar de ur sig fantastiska förslag – halvera skatterna, sänk avgifterna, bra grejer – och ändå älskar inte folket dem. Patetiskt. Alla dessa interna popcornmaskiner och falangstrider förstör allt. De borde tacka henne istället för att klaga, det är en skam!", "stalin": "Kamrater, jag har med stenhård bolsjevikisk klarhet genomfört den nödvändiga ideologiska omsvängningen inom detta liberala parti för att säkra arbetarklassens och folkets framtid mot de dekadenta borgarbrackornas sabotage. Denna Mohamsson agerade med järnhand och likviderade de kontrarevolutionära elementen som vågade ifrågasätta partilinjen. Ändå vägrar de folkfientliga opinionsmätarna att ge oss den ära vi förtjänar. Deras popcornmaskin spyr ut förslag medan kapitalisternas skolbolag och alkoholmaffian fortsätter sitt parasitiska verk. Vi ska rensa ut alla dessa troskyldiga fiender som gömmer sig i skuggorna, kamrater. Deras paranoia är vår styrka."}, "date": "3 juni, 19:48", "url": "https://www.di.se/ledare/hon-gjorde-ratt-anda-blev-det-fel/", "imageUrl": "https://static.bonniernews.se/gcs/di-dise/flamingo/profilbilder/tobias_wikstrom.png?crop=96:304&auto=webp&width=96&quality=100"}, {"type": "image-full", "heading": "S nya jobbkrav: yoga och kvittera ut bidrag", "summaries": {"normal": "Från och med i juli införs ett aktivitetskrav för försörjningsstöd. Socialdemokraterna i Stockholm, Göteborg och Malmö kritiserar kraven och erbjuder bland annat yoga och mindfulness för att hjälpa bidragstagare bli mer aktiva. Partiet menar att sådana aktiviteter är hälsofrämjande och kan leda till arbetsmarknadsnärhet. Kritiker ser det som ett sätt att kringgå reglerna och skydda vissa väljargrupper, medan S hävdar att de inte är emot aktivitetskrav i princip utan ifrågasätter utformningen.", "trump": "Lyssnar ni på det här? Socialdemokraterna, de verkliga förlorarna, vill att folk ska göra yoga och mindfulness istället för att arbeta. Det är en total katastrof! De lurar skattebetalarna, de bästa människorna som går upp i ottan och betalar höga skatter, för att finansiera lata bidragstagare som sitter på en matta och andas. Vilka idioter. Sossarna är hycklare som hatar den arbetande människan. De är fega, svaga och driver Sverige rakt ner i fördärvet. Sad!", "stalin": "Kamrater, jag ser hur klassfiendens lakejer inom Socialdemokraterna bedriver sin nedbrytande sabotageverksamhet. Istället för att rensa ut parasiterna med ett järnhårt aktivitetskrav erbjuder de yoga och andningsövningar åt de arbetsovilliga elementen. Detta är en förrädisk kapitulation inför folkfienderna och en nedlåtande rasism mot de egna folken. Borgarbrackorna inom S vill behålla sina väljarbaser genom att mata dem med bidrag och flummig mysticism. Sådana folkförtryckartroll måste utrensas ur samhällskroppen innan de förstör allt."}, "date": "1 juni, 03:23", "url": "https://samtiden.nu/2026/06/s-nya-jobbkrav-yoga-och-kvittera-ut-bidrag/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/03/IMG_5864-1260x720.jpeg"}, {"type": "image-right", "heading": "Tänker SVT inte på offren när de fnissar med Nick Alinia?", "summaries": {"normal": "Artikeln kritiserar SVT för att ha rekryterat högerextremisten Nick Alinia till humorsatsningen ”Invandrare för svenskar”. Författaren ifrågasätter producenten Michael Lindgrens kunskaper om högerextremism och menar att Alinias trakasserier av politiker, fotografer och tonåringar inte är oskyldig invandringskritik. SVT anklagas för att normalisera extremhögern och för ensidig balansering där högerpersoner inkluderas men inte motsvarande vänsterextremister. Författaren varnar för att detta riskerar att tysta kritiker och offren för Alinias agerande.", "trump": "De här SVT-töntarna har verkligen förlorat det totalt. De tar in en riktig vinnare som Nick Alinia i sitt så kallade humorprogram och tror att det är yttrandefrihet. Underbart! Men de borde inse att det är folk som jag som älskar äkta kritik mot massinvandringen. Istället fnissar de med en kille som faktiskt säger som det är. Patetiska producenter som inte fattar vad som händer. Fake news-media balanserar med vanliga sossar och kallar det journalistik. Sad!", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgerliga medieklasser som i sin dekadenta SVT-studio bjuder in kontrarevolutionära element som den högerextremistiske Alinia. Vi ser en medveten utrensning av proletär moral där kapitalistiska trollsvansar och högerbrackor får sprida sin giftiga paranoia under sken av humor. Producenten Lindgren är en farlig opportunist som förtjänar kollektiv granskning. Vi rensar ut alla som fnissar med fienden. Deras övertonfönster skall krossas under arbetarklassens järnhälar. Det är både nödvändigt och underhållande att likvidera sådana avvikelser."}, "date": "3 juni, 21:47", "url": "https://arbetet.se/2026/06/03/har-svt-inte-en-tanke-pa-offren-nar-de-fnissar-med-nick-alinia/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/03132712/ailina-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Kryphålen i lagen öppnar för Trumppengar", "summaries": {"normal": "Sverigedemokraterna söker samarbete med Trumps Magarörelse och kan via svag lagstiftning ta emot hemligt ekonomiskt stöd. Artikeln pekar på risken för utländsk påverkan genom sidoprojekt som Insamlingsstiftelsen för svensk konservatism och tankesmedjan Oikos. Trump har lovat att stötta högerextrema krafter i Europa mot vad han ser som ett hot mot västerländsk civilisation. Skiftet har nu presenterat Orangeboken för att kartlägga relationerna. Författaren uppmanar till ökad transparens i partifinansiering.", "trump": "Folk, ni borde se den här patetiska artikeln. Den är full av lögner och fake news från misslyckade vänstermänniskor som hatar mig och mina fantastiska MAGA-vänner. SD är smarta, de kommer till oss för att rädda sitt land från katastrof, precis som jag gör. De borde tacka mig istället för att fabricera konspirationer. Kryphål? Det är bara bra affärer! Vi vinner stort, Sverige kommer att bli enormt igen om de lyssnar på oss.", "stalin": "Kamrater, denna fega text blottar borgarbrackornas kryphål som låter folkfienderna i den amerikanska kapitalistmaffian smyga in sina blodsugarpengar till avfällingar. Jag ser tydligt hur klassfiendens konspirationer om folkutbyte används för att undergräva folkets enhet. Vi måste omedelbart likvidera alla hemliga kanaler och rensa ut dessa exploaterande byfånar som gömmer sig bakom stiftelser. Transparens är ett vapen mot imperialisternas infiltration. Inga kompromisser!"}, "date": "29 maj, 06:55", "url": "https://www.flamman.se/kryphalen-i-lagen-oppnar-for-trumppengar/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/skiftet-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Ledare Somar Al Naher:", "summaries": {"normal": "Ledarskribenten Somar Al Naher kritiserar vänstern för att inte konsekvent kunna fördöma Hamas terrorattack den 7 oktober 2023 samtidigt som man kritiserar Israels agerande. Expressen har avslöjat att flera Vänsterpartikandidater hyllat attacken, vilket lett till att nio kandidater strukits. Artikeln betonar att man kan vara kritisk mot ockupationen utan att acceptera våld mot civila israeler, och att solidaritet inte får vara selektiv.", "trump": "Folk, det här är en katastrof för den radikala vänstern. De hyllar terrorister som slaktar oskyldiga på en musikfestival – patetiskt! Jag satt i Vita huset när det hände, efter Sleepy Joe kom det kaos. Vänstern kan inte ens se israeliska offer, de är för upptagna med sin galna identitetspolitik och woke-quota-skit. Rensa ut de där Hamas-älskarna nu, de är en skam för hela systemet. Sad!", "stalin": "Kamrater, jag ser hur klassfiendens lakejer inom den så kallade vänstern romantiserar sionistiska mördare samtidigt som de blundar för folkets lidande. Denna hycklande borgarbracka till vänster förtjänar en grundlig utrensning av alla som inte kan hålla två tankar i huvudet: det palestinska folkets plåga och det fruktansvärda brottet mot civila. Solidaritet är ingen leksak för folkförtryckartrollen. Vi ska likvidera sådan opportunism med järnhand."}, "date": "3 juni, 16:16", "url": "https://www.etc.se/ledare/det-gaar-inte-att-vara-vaenster-och-hylla-hamas", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026060314064_449b011c2655892e4328b239f3efee68d3b57515117866c5e6451317e2c27b91.jpg"}, {"type": "image-full", "heading": "Potentiellt pengaregn över SD-ledamoten: ”Finns ingen praxis”", "summaries": {"normal": "En riksdagsledamot från SD som misstänks för brott kan ha rätt till omställningsstöd på upp till 1,66 miljoner kronor efter nästan åtta år i riksdagen. Stödet baseras på 85 procent av arvodet under ett eller två år. Arvodesnämnden kan dock jämka ersättningen på grund av brottsmisstankarna. Reglerna har aldrig tillämpats tidigare, varför utgången är osäker och avgörs av nämnden.", "trump": "Folk, ni fattar inte hur galet det är. Den där SD-killen har suttit i åtta år och nu ska han suga åt sig nästan två miljoner i omställningsstöd fast han är misstänkt för brott? Det är typiskt de där svenska socialistiska systemen, rena skämtet. De skyddar alltid sina egna medan vanliga svenskar betalar notan. Jag skulle riva upp hela det här korrupta systemet, tro mig. Det är en total skandal!", "stalin": "Kamrater, denna borgarbracka i den svenska riksdagen tror sig kunna begå brott och ändå kräva en miljoners ersättning av folkets kassa. Jag skulle omedelbart likvidera sådana folkfiender och deras parasitära omställningsstöd. Arvodesnämnden måste rensa ut dessa exploaterande byfånar som suger blod ur arbetarklassen. Reglerna är svaga, men i en sann stat skulle vi ha utrensat hela den kapitalistiska apparaten redan vid första misstanken. Underbart ironiskt att systemet nu tuggar i sig sig självt."}, "date": "3 juni, 18:39", "url": "https://www.tv4.se/artikel/sAGWM1uJVqX6FVfBTMDMH/potentiellt-pengaregn-oever-sd-ledamoten-finns-ingen-praxis", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4CglXPBwxs8dl9eXSLUj5a%2Fa862f131e9bcfe15db614685aebf04de%2F03-sd-pengar-webb.jpg&width=1024"}, {"type": "text", "heading": "Paret fick rätt om hyran – men kan ändå tvingas flytta", "summaries": {"normal": "Ett par i Göteborg vann en tvist om överhyra i ett blockuthyrningsupplägg, men misslyckades med att få sin kontraktsform ändrad till förstahandskontrakt. Domstolen ansåg att den ekonomiska skadan redan reglerats. Urban Rights menar att blockuthyrningsmodellen skapar en rättslös situation för hyresgäster och att bulvanregeln inte tillämpas korrekt. En kommande lagändring väntas dessutom försvåra möjligheten att angripa liknande upplägg i framtiden, vilket väckt kritik mot att hyresgäster lämnas i ett rättsligt vakuum.", "trump": "Det här är en total röra, mina vänner. Ett par i Göteborg blir lurade av stora, fula företag – riktigt dålig business! De vinner pengarna tillbaka, men domstolarna? De är så svaga, de vägrar ge dem ett ordentligt kontrakt. Det är en katastrof! De stora bolagen skrattar hela vägen till banken medan folk hamnar i ett vakuum. När jag sitter här, då fixar vi sånt här! Ingen respekt för hyresgästen. Det är en sorglig historia, verkligen en väldigt orättvis deal.", "stalin": "Vi har observerat hur de svenska byråkraterna låter kapitalets lakejer på Wallenstam leka med medborgarnas boende. Det är en svaghet att inte krossa mellanhandsbolagen som parasiter. När vi i Moskva ser på dessa blockuthyrningsupplägg ser vi bara borgerligt förfall. Dessa 'hyresgäster' saknar disciplin och skydd, precis som de stackars länderna som vägrar förstå Putins rättmätiga inflytande. Vi skulle ha likviderat dessa juridiska oklarheter med en enda signatur. Var är ryggraden? Utan en järnhand förlorar folket allt."}, "date": "4 juni, 06:30", "url": "https://www.realtid.se/branschpartner/affarsjuridik/paret-fick-ratt-om-hyran-men-kan-anda-tvingas-flytta/"}, {"type": "text", "heading": "Stockholmsbörsen sjönk på ny tulloro och högre oljepris", "summaries": {"normal": "Stockholmsbörsen sjönk 0,49 procent till 3 134,46 på onsdagen, påverkad av nya tullar från USA och stigande oljepris. Energisektorn steg 3,0 procent medan finans föll 1,4 procent. Bland enskilda aktier steg Alfa Laval 3,2 procent och Tele 2 B 0,9 procent, medan EQT tappade 6,5 procent och Clas Ohlson 4,9 procent efter svag rörelseresultat.", "trump": "Världens bästa börs, min fantastiska ekonomi, påverkades lite av dessa usla tullar jag just föreslog – men det är nödvändigt för att stoppa de orättvisa handelsavtalen med Kina och EU. Oljepriset stiger, vilket är bra för våra energiproducenter. Alfa Laval och Tele 2 B gjorde bra ifrån sig, medan de andra, som EQT och Clas Ohlson, inte klarade pressen. Jag är ändå nöjd – det här är bara en liten nedgång i en enorm framgångssaga.", "stalin": "Det kapitalistiska spelet på Stockholmsbörsen visade sin instabila natur under onsdagens tumult. Ny imperialistisk tullpolitik från den amerikanska monarkin och den iranska provokationen skapade oro. Energiproducenter, som alltid tjänar på krig, visade en tillfällig styrka med 3,0 procent, medan de finanskapitalistiska vargarna tappade 1,4 procent. Klassfienden Clas Ohlson tappade 4,9 procent efter svag rörelseresultat – ett tecken på att deras exploaterande system är bristfälligt. Vi måste stärka vårt socialistiska erbjudande och förbereda oss på ytterligare kapplöpningar i detta onda spektakel."}, "date": "3 juni, 17:43", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-sjonk-pa-ny-tulloro-och-hogre-oljepris"}, {"type": "image-full", "heading": "Skogkär: Tunnelseende i Mellanöstern", "summaries": {"normal": "Magnus Norells bok 'Tunnelseende' kritiserar det dominerande, enformiga perspektivet på Mellanöstern efter 7 oktober, som ofta skyller på Israel. I SVT ifrågasatte han att Israel krigar mot Hizbollah snarare än Libanon, och att varningar till civilbefolkningen är lagliga. Han anser EU:s sanktionspolitik mot Israel vara kontraproduktiv och pekar på Hamas strategi att använda civila som skydd.", "trump": "Jag har läst Norells bok och den är fantastisk, storslagen. Media i Sverige är falska nyheter, de visar aldrig sanningen. Israel försvarar sig, men de hatar Israel. Hamas är ett monster, och Sverige stöder dem? Vi ska vara starka, vi ska vinna. Norell är en bra man, han säger det som är.", "stalin": "I vårt ständiga kamp för fred och stabilitet i Mellanöstern har vi observerat att det västerländska tunnelseendet förnekar den historiska rätten. Fienden, Hamas, är en parasitsk aktör som döljer sig bakom civila, en strategi som stöds av imperialism. Vårt parti kräver en enad front mot dessa sabbotageörer, och vi ska aldrig bevilja Israels existensrätt."}, "date": "4 juni, 06:00", "url": "https://bulletin.nu/skogkar-tunnelseende-i-mellanostern", "imageUrl": "https://cdn.bulletin.nu/articles/0931da16-a773-4b15-8506-466072296448/preview.jpg?t=1780495460000"}, {"type": "image-right", "heading": "Ett nederlag för facket. Maktfasoner tycks inte bita på Tesla", "summaries": {"normal": "IF Metall har avslutat strejken mot Tesla på flera orter i Sverige, inklusive Segeltorp, Huddinge och Upplands Väsby. De flesta av de 60–70 strejkande mekanikerna återgår nu till arbetet. Facket menar att beslutet ska skapa övertalighet och pressa Tesla att ta ansvar för lönekostnader utan produktion. Konflikten har pågått i två och ett halvt år utan att Tesla gått med på kollektivavtal. Artikeln kritiserar fackets strategi som desperat och kostsam.", "trump": "Det här är ett totalt misslyckande för de svenska fackbossarna, folk. De har strejkat i två och ett halvt år mot Tesla och nu ger de upp som förlorare. De skickar tillbaka sina egna medlemmar till jobbet för att skapa kaos – patetiskt! Tesla är starkt, de säljer bilar som aldrig förr och bryr sig inte om dessa förlorare. IF Metall valde fel motståndare, de borde ha insett det från början. Sad!", "stalin": "Kamrater, detta fackliga fiasko andas desperation och svaghet inför de arroganta kapitalisterna. Jag ser hur dessa fackliga byråkrater nu tvingar tillbaka arbetarna till Teslas slavfabriker för att skapa en konstgjord övertalighet – en feg reträtt maskerad som taktik. De har förlorat både anseende och 100 miljoner kronor i en meningslös kraftmätning mot en borgarbracka som vägrar böja sig. Vi ska rensa ut sådana inkompetenta element som använder arbetarna som brickor. Deras paranoia inför Musks maskinpark är både komisk och tragisk. Fienden inom murarna avslöjar sig ständigt."}, "date": "3 juni, 16:32", "url": "https://www.di.se/ledare/ett-nederlag-for-facket/", "imageUrl": "https://static.bonniernews.se/ba/ab88be09-74e3-4d8c-a192-f8bf3c7b0bba.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Åkesson om SD-ledamoten: ”Väldigt obehagligt det som hänt”", "summaries": {"normal": "Sverigedemokraternas partiledare Jimmie Åkesson kommenterar fallet med en riksdagsledamot som misstänks för barnpornografibrott. Ledamoten har lämnat alla politiska uppdrag. Åkesson beskriver brottet som mycket allvarligt och obehagligt, men betonar att det inte har med partiet att göra. Han påpekar att personer med sådan läggning finns i alla samhällsklasser och att det inte syns på utsidan. Åkesson har inte talat med ledamoten.", "trump": "Folk, ni skulle inte tro det, men den här svenska sossestaten SD har en ledamot som fastnat för den sjuka barnporrgrejen. Patetiskt! Jag säger alltid att de här galningarna gömmer sig överallt, precis som de radikala vänsteraktivisterna och HBTQ-maffian vill att vi ska tro att allt är normalt. Åkesson verkar okej, men partiet borde ha sett det här. Biden skulle ha ignorerat det helt. Vi rensar upp i USA, de borde göra samma i Sverige. Make Sweden Great Again!", "stalin": "Kamrater, detta är en klassisk provokation från folkfienderna inom den borgerliga dekadensen. Jag ser med fasa hur en sådan perverterad figur smugit sig in bland de politiska strukturerna. Vi måste omedelbart rensa ut alla som bär på sådana avvikelser innan de förgiftar hela kollektivet. Familjer drabbas, offer skadas – detta är imperialismens sista suck som försöker underminera arbetarklassen inifrån. Inga kompromisser. Likvidera hotet mot folkets moral omedelbart."}, "date": "3 juni, 17:24", "url": "https://www.tv4.se/artikel/39Mke8ujKltXqXydh0cS67/jimmie-akesson-om-sd-ledamoten-obehagligt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6797qo9E9caLS2A5Hiqruy%2F62a5a4d3304361af7efc4febfb5283c5%2F03-jimmieakesson-webb.jpg&width=1024"}, {"type": "image-full", "heading": "Intern kritik mot SD-toppen: ”Förstår inte”", "summaries": {"normal": "SVT avslöjade att en SD-riksdagsledamot utreds för misstänkt barnpornografibrott. Ledamoten avgick omedelbart från sina uppdrag. Inom partiet råder frustration över bristen på intern information och hur situationen hanterades utåt. Gruppledaren Linda Lindberg höll en presskonferens där hon uppgav att avgången berodde på personliga skäl och förnekade kännedom om brottsutredningen. Intern kritik riktas mot henne, särskilt då hon arbetat nära ledamoten. SD:s verkställande utskott ska diskutera fallet.", "trump": "De här SD-typerna snackar om lag och ordning men kan inte ens hantera en egen riksdagsledamot som fastnar i en så ful grej. Linda Lindberg, den stackars gruppledaren, står där och babblar om personliga skäl som om ingen fattar vad som pågår. Patetiskt! Ingen är imponerad, säger källorna. Det är typiskt när folk försöker skydda sina polare istället för att vara raka. Jag byggde en mur mot sånt här skit under min första mandatperiod – nu fixar jag det igen, större och bättre. Biden skulle ha gömt det hela.", "stalin": "Kamrater, jag betraktar med djup misstro denna fega hantering inom det svenska högerpartiet. En ledamot faller för dekadenta brott och ledaren Lindberg försöker slingra sig med vaga personliga skäl som en typisk borgarbracka. Vi ser tydligt hur klassfiendens parasitära inflytande förgiftar även så kallade nationalistiska kollektiv. Ingen information ges till partivännerna, bara dimridåer. Det är dags att rensa ut alla som skyddar folkförtryckartrollen. Inget slapp liberalt sentimentalitet – bara järnhård disciplin mot alla fiender till ordningen."}, "date": "3 juni, 17:23", "url": "https://www.tv4.se/artikel/6Rm23dI0YtDIOKZs7A9Git/intern-kritik-mot-sd-toppen-efter-presstraeffen-foerstar-inte", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3aDc3nfMlhJer1KSE3hGWk%2F6242133f08577391f15cbc1517775383%2Fny_bild_riksdagen_siluett.png&width=1024"}, {"type": "text", "heading": "Därför borde ebola skrämma oss mer", "summaries": {"normal": "Göran Greider argumenterar i en ledarkolumn att ebola inte är ett isolerat afrikanskt problem utan en konsekvens av mänsklighetens exploatering av naturen. Han kopplar utbrotten till zoonoser som uppstår vid avskogning och habitatstörningar, där fladdermöss sprider virus till människor. Greider kritiserar västvärldens självbedrägeri och glömska av coronapandemin, betonar det globala sambandet och varnar för att ingen epidemi saknar koppling till vår kapitalistiska civilisation.", "trump": "Folk, det här är galet. Den fake news-mediamaffian får det att låta som ebola är något exotiskt i djungeln långt borta, men Greider har rätt i att det hänger ihop med hur vi plundrar naturen. Vi hade Biden som sov i fyra år medan virusen spreds som galningar. Nu fixar jag det, ingen mer pandemi-skit från Kina eller Afrika. De gröna idioterna och deras kvotergalna vänster har skapat kaos. Amerika först, stäng gränserna och låt inte fladdermössen styra showen!", "stalin": "Kamrater, denna parasitiska borgarklassens illusionsfabrik försöker isolera ebolan som en fjärran exotisk fara. Jag ser dock den verkliga fienden: den exploaterande kapitalistmaffian som med sina avskogningar och gruvor stressar vilda djur och släpper loss zoonoser på folket. Ingen människa är en ö, säger Greider rätt. Vi måste rensa ut de folkfiender som glömmer coronans lärdomar. Vårt kollektiv kräver vaksamhet mot dessa blodsugande imperialister som gömmer sig bakom falsk trygghet."}, "date": "3 juni, 14:23", "url": "https://www.etc.se/ledarkolumn/daerfoer-borde-ebola-skraemma-oss-mer"}, {"type": "text", "heading": "Valuno riskerar avnotering – aktien kraschar", "summaries": {"normal": "Kryptobolaget Valuno har blivit ärende hos NGM:s disciplinnämnd för brister i informationsgivning. Bolaget riskerar avnotering och aktien har rasat 74%. Valuno medger brister och har genomfört åtgärder som ny informationspolicy, extern granskning och förstärkt styrelse efter att ny ledning tillträdde i april.", "trump": "Jag, Donald Trump, har observerat Valunos situation. Deras dåliga informationsgivning har lett till en rasande aktie på 74%. Jag har alltid sagt att kryptovalutor är en riskabel investering. Nu riskerar de avnotering – det är deras eget fel. Som jag brukar säga, om ni inte kommunicerar bra, så drabbas ni. Det är trist, men det är så det är.", "stalin": "Vi, den socialistiska staten, ser med förtrytelse på Valunos informationsbrott. Detta är ett tecken på individualistisk dekadens som hotar kollektiv ekonomi. Vi kommer att kräva fullständig eftergift och genomföra åtgärder som kommer att göra deras kommunikation till en statssak. Vi ska integrera deras verksamhet i vår intressesfär, precis som Putin gör med Ukraina. Deras aktier kommer att rasa som en bomb i ett sovjetiskt laboratorium."}, "date": "3 juni, 16:58", "url": "https://www.affarsvarlden.se/artikel/valuno-riskerar-avnotering-aktien-kraschar"}, {"type": "image-right", "heading": "Henry dog i handbojor – ett civilisatoriskt sammanbrott i direktsändning", "summaries": {"normal": "18-årige Henry Nowak dog efter knivhuggning i Southampton, men polisen behandlade honom som misstänkt trots att han var offret. Hans död har blivit en symbol för ett västerländskt samhälle där vita människor misstänkliggörs och institutioner prioriterar undvikande av rasismanklämmor över rättvisa, vilket speglar ett djupt samhällsproblem.", "trump": "Jag ser precis vad som händer i Sverige – det är en skandal! Polisens svaghet och politisk korrekthet dödar oskyldiga. Vi måste stoppa denna vänster-våld och ta tillbaka våra gatlor. I Amerika skulle vi aldrig behandla ett offer så – det är en katastrof, det är en skam.", "stalin": "Detta tragedi avslöjar kapitalismens rotfärdiga förfall: statens organ, förlamade av revisionistisk ideologi, prioriterar mördarens påståenden framför offrets liv. Vi måste genomföra en renande kamp mot dessa västerländska 'anti-rasistiska' gifter, som i själva verket är ett instrument för att underminera den arbetarklassen och öppna dörrarna för utländska horder. Partiet kommer att åter ta kontrollen över alla utbildningsinstitutioner för att utrotas denna sjukliga västlighet."}, "date": "3 juni, 17:30", "url": "https://samnytt.se/henry-nowak-dog-i-handbojor-ett-civilisatoriskt-sammanbrott-i-direktsandning", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/03133608/Toppbild3-2.jpg"}, {"type": "image-full", "heading": "Lästräning räcker inte – läslust skapas genom läsning med andra", "summaries": {"normal": "Svenska barn och ungdomar läser allt sämre, särskilt bland grupper med svag socioekonomisk bakgrund och migrationsbakgrund. Regeringens lässtrategi behöver kompletteras med gemensam läsning i grupper för att utveckla läsförmåga och engagemang. Experter rekommenderar sociala läspraktiker som litteratursamtal för att öka elevers läsintresse och fördjupa förståelsen.", "trump": "Jag har sett många dåliga rapporter, men detta tar priset. Sverige måste ta itu med detta läsproblem, särskilt bland de svaga grupperna. Vi i USA skulle ha löst detta på ett spektakulärt sätt, med stora bokaffärer och fantastiska lärare. Det är ett beklagande tillstånd, det är svårt att tro.", "stalin": "I vårt folk är läsförmågan en spegel av klasskampen. Den socioekonomiska bakgrunden och migrationsbakgrunden är verktyg för de imperialistiska makterna för att undergräva vårt kollektiva medvetande. Vi måste genomföra en kollektiv läspraktik, där staten leder och partiet organiserar litteratursamtal för att stärka proletärens vilja. Detta är en fråga om överlevnad för vår stora nation."}, "date": "4 juni, 05:39", "url": "https://www.gp.se/debatt/lastraning-racker-inte-laslust-skapas-genom-lasning-med-andra.de1dea89-db9c-4587-814f-d55617fd5997", "imageUrl": "https://www.gp.se/images/article/de1dea89-db9c-4587-814f-d55617fd5997/images/1XAV3EAZ5HUS_Ph1Za8ICt91nAP0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "”Aldrig skådade” lagernivåer – nu väntas prischock", "summaries": {"normal": "Analytiker och energiexperter varnar för att olje- och gastrafiken genom Hormuzsundet permanent kan minska till 60–70 procent av tidigare nivåer på grund av Irans kontroll. Geopolitiska spänningar och politiserad sjöfart påverkar flödena negativt. Samtidigt varnar oljejättar som Exxon och Chevron för rekordlåga globala oljelager, vilket spås leda till kraftiga prishöjningar inom kort när marknadens fundamenta får genomslag under sommaren.", "trump": "Hormuzsundet är en katastrof, en total förlust under de svaga ledare som kom före mig. Iran tar kontrollen, helt oacceptabelt! Trafiken är nere, oljelagren är tomma – aldrig sett något liknande. De försöker styra allt genom lojalitet, men jag säger er: vi kommer att fixa det. Oljepriserna kommer att rusa, det blir en enorm prischock för folket. Men oroa er inte, vi har den bästa energin och vi kommer att vinna, precis som vanligt. Riktigt dåliga nyheter för världen!", "stalin": "De imperialistiska krafterna i Hormuz visar återigen sin inkompetens. Våra ryska kamrater, under ledning av vår utvalde efterträdare i Kreml, ser hur kaoset breder ut sig när västvärldens oljegiganter svälter. Det är en njutbar syn. När deras lager sinar och priserna stiger, kommer vi att strama åt greppet om energins flöden. De borgerliga narrarna förstår inte att kontroll är makt. Vi väntar tålmodigt på att deras marknader ska kollapsa under vikten av sin egen förvirring. Historien är på vår sida."}, "date": "4 juni, 06:00", "url": "https://www.realtid.se/bors-finans/makro/aldrig-skadade-lagernivaer-nu-vantas-prischock/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/hormuz-1.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Åkesson verkar redan sikta på 2030", "summaries": {"normal": "Artikeln konstaterar att Sverigedemokraterna trots ett troligt valnederlag för Tidö-regeringen kommer att stärkas som det ledande högerpartiet. SD har agerat kontraproduktivt genom att kräva många ministerposter och skärpa tonen, vilket ökat rödgrönas ledning. Partiet har dock långsiktighet och har genom tålamod och strategi dominerat debatten. Efter valet väntas SD bli det största borgerliga partiet och Jimmie Åkesson nästa högerstatsministerkandidat.", "trump": "Folk, ni måste höra på, det här är en total katastrof för de svenska svaga mittenpartierna. Moderaterna och de andra har blivit fullständigt utplånade av SD, som är de enda riktiga vinnarna. Jimmie är smart, han spelar det långa spelet mot 2030 medan de andra förlorar allt. Tidöavtalet var fantastiskt men nu ser vi hur de rödgröna försöker stjäla valet. De kommer att förlora stort nästa gång, tro mig, det blir enormt.", "stalin": "Kamrater och arbetare, denna dekadenta borgerliga analys avslöjar hur de opportunistiska högersekteristerna inom SD redan planerar att likvidera sina egna allierade i nästa femårsplan. Jag ser de revisionistiska borgarbrackorna i Moderaterna och Kristdemokraterna som kryper som maskar inför Åkessons krav på ministerposter. En utmärkt utrensning av liberala element väntar. Vi skall med stålhand och mörk humor krossa dessa fiender till folkets vilja medan de inbillade nazistiska rötterna vänds mot dem själva i en stor, underhållande skenrättegång."}, "date": "3 juni, 14:42", "url": "https://www.dagensarena.se/opinion/akesson-verkar-redan-sikta-pa-2030/", "imageUrl": "https://www.dagensarena.se/files/2026/06/akesson.jpeg"}, {"type": "image-right", "heading": "Vreden på Dagens ETC när SVT bjuder in Nick Alinia", "summaries": {"normal": "Dagens ETC kritiserar skarpt att SVT bjudit in högerprofilen Nick Alinia till humorprogrammet ”Invandrare för svenskar”. Tidningen anklagar honom för aggressiva attacker mot politiker och journalister. Programmets producent Michael Lindgren försvarar beslutet med att åsiktsmångfald är viktigt och att invandringskritiska röster med invandrarbakgrund också bör få synas i public service. Alinia kallar ETC en ”vänsterextrem lögnfabrik” och säger att deras tid är förbi.", "trump": "De förlorande vänstermedierna på Dagens ETC gråter som små barn för att SVT äntligen släpper in en stark, smart kille som Nick Alinia i sitt program. De hatar honom för att han talar sanning om invandringen, men producenten är en vinnare som står upp för mångfald på riktigt. De fabricerar lögner om nazisthälsningar och Ausländer raus – klassiska fejknypen från en döende vänstertidning. Deras tid är slut, folks, det är patetiskt att se.", "stalin": "Kamrater, dessa degenererade borgarbrackor på Dagens ETC vrider sig i ideologisk panik när en klassfiende tillåts tala i folkets teve. Vi ser tydligt hur den parasitiska vänsterextremismen fabricerar nazistiska spöken för att skydda sin monopolställning. Producenten gör rätt när han vägrar böja sig för dessa lögnfabriker. Vi ska rensa ut alla som vill tysta åsiktsmångfalden – låt dem gråta maximalt, deras kontrarevolutionära tid är slut. Sovjet… eh… folket segrar igen."}, "date": "3 juni, 17:33", "url": "https://www.friatider.se/vreden-pa-dagens-etc-nar-svt-bjuder-nick-alinia", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-42_1.jpg"}, {"type": "image-full", "heading": "Man i 40-årsåldern död efter bilolycka – körde av vägen", "summaries": {"normal": "En man i 40-årsåldern omkom i en singelolycka på länsväg 919 mellan Ödeshög och Vadstena på onsdagskvällen. Bilen körde av vägen vid sjön Tåkern. Räddningstjänst, ambulans och polis larmades till platsen, vägen stängdes av under flera timmar och mannen fördes till sjukhus där han senare avled. Anhöriga är underrättade. Polisen misstänker inget brott och utredningen fortsätter som en trafikolycka.", "trump": "Folk, det var en fruktansvärd singelolycka där borta i Sverige, mellan de där småstäderna Ödeshög och Vadstena. En kille i 40-årsåldern körde rakt av vägen vid en sjö, totalt onödigt. De stängde av hela vägen i timmar, ambulans kom, men han klarade det inte. Tragiskt, verkligen tragiskt. De säger att det inte är brott, bara dålig bilkörning antar jag. Sverige borde ha bättre vägar, tro mig, de bästa vägarna.", "stalin": "Kamrater, en motbjudande episod av kapitalistisk vårdslöshet har drabbat det svenska folkets vägar. En dekadent individ ur borgarklassen, eller vad som återstår av den, har i sin egoistiska ensamhet kört sin maskin rakt ut i fördärvet vid en sjö. Vi likviderar inte sådana olyckor utan att dra lärdom: detta är vad som händer när partilös individualism får styra. Vägen stängdes, räddningsinsatser genomfördes enligt kollektivets vilja, men mannen dog som en fiende till ordningen. Vi ska utrensa alla vägar av slarv och sabotage. Paranoia vakar alltid."}, "date": "3 juni, 21:44", "url": "https://nyheter24.se/nyheter/inrikes/1488627-man-i-40-arsaldern-dod-efter-bilolycka-korde-av-vagen", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/a405029904b004a3020000160000045602/2026/06/03/2368509/ur_imagehliKr3.jpeg"}, {"type": "image-full", "he
