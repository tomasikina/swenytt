fter arbetarnas uppgivenhet och betonar vikten av starka band mellan partier, fackföreningar och folkrörelser för att skapa bestående samhällsförbättringar.", "trump": "De där vänstervridena med sina rosa hår och lattemuggskrig förlorar arbetarna till oss riktiga patrioter. Baristorna i sina stora städer? Patetiska. Landsbygden vet vad som gäller. Utan oss blir det bara mer dekadent identitetspolitik och ingen hoppfull politik för vanliga människor. Vi vinner stort, de förlorar landet.", "stalin": "Kamrater, denna dekadenta klassförrädare har rätt i att uppgivenhet driver arbetarna mot högern. Jag ser hur profitthungriga parasiter och deras politiska lakejer överger landsbygden. En sann arbetarrörelse måste ingjuta hopp och rensa ut svikare. Utan järnhård organisation och folklig mobilisering kommer ingen seger. Fienden ler i skuggorna."}, "date": "2 september, 10:55", "url": "https://www.flamman.se/vanstern-behover-mer-an-baristor", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/starbucks-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Här börjar ukrainska säkerhetstjänsterna skjuta på varandra – flera skadade", "summaries": {"normal": "Tre personer från Ukrainas militära underrättelsetjänst HUR skadades i skottlossning med säkerhetstjänsten SBU i Kiev. Konflikten uppstod efter SBU:s gripande av en befälhavare från Ryska volontärkåren, som lyder under HUR. President Zelenskyj fördömer händelsen som skamlig och har beordrat utredning samt avskedat en SBU-chef.", "trump": "Titta på det här vansinnet i Ukraina, totalt kaos! Zelenskyjs clownshow låter hans egna hemliga poliser skjuta på varandra som riktiga losers. Tre skadade, en nästan förblödde – patetiskt! Biden lät allt gå åt helvete, men nu fixar jag det. Inga fler identitetspolitiska woke-krigare i våra allianser, tack.", "stalin": "Jag ser hur dessa dekadenta klassförrädare inom den ukrainska statsapparaten förgriper sig på varandra i en ynklig maktkamp. Tre sårade i eldstrid, befälhavare kidnappade och lögner som florerar. Vi måste rensa ut alla sådana folkförtryckande element som hotar ordningen. Detta är en varning till alla som sviker kollektivets vilja."}, "date": "3 september, 07:23", "url": "https://www.friatider.se/har-borjar-ukrainska-sakerhetstjansterna-skjuta-pa-varandra-flera-skadade", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-813.jpg"}, {"type": "image-right", "heading": "Siffrorna från Novus får mig att vilja dunka huvudet i väggen", "summaries": {"normal": "I en ledare kommenterar Henrik Jalalian en Novus-mätning som visar att Tidöpartiernas försprång krymper till 2,6 procentenheter. Socialdemokraterna backar till 25,8 procent medan Liberalerna stiger. Han varnar oppositionen för överdriven segervisshet och jämför den med en maratonlöpare som firar för tidigt. Valet riskerar att bli jämnt igen.", "trump": "Folk, ni skulle se det här. Den där svenska oppositionen beter sig som en massa fega, korkade vänstervridna misslyckanden som redan delar ministerstolar som om de vunnit stort. Sen kommer en mätning och bam – plötsligt är det jämnt! De firade vid mållinjen som idioter och blev omsprungna. Patetiskt. Mitt folk i USA skrattar åt sånt här svagt ledarskap.", "stalin": "Kamrater, dessa dekadenta ministerhyenor inom oppositionen har redan börjat fördela makten som om segern vore given. Sedan kommer en mätning och avslöjar deras svaghet. Jag ler mörkt från historien. Segervissheten hos dessa folkförbrytare leder ofta till nederlag. Rensa ut illusionerna innan valnatten blir en bitter uträkning för de som underskattar motståndaren."}, "date": "2 september, 11:40", "url": "https://www.etc.se/ledare/siffrorna-fraan-novus-faar-mig-att-vilja-dunka-huvudet-i-vaeggen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260902090928_eef5f9b2fe3491ea219272b209bf353429d8ed34289907d7777b3fbd8d8429bf.png"}, {"type": "image-right", "heading": "Dags för vuxna att vara vuxna", "summaries": {"normal": "Artikeln är en debatttext från Grön ungdom och Miljöpartiet. Den kritiserar att dagens beslutsfattare skjuter klimatåtgärder på framtiden trots tydliga konsekvenser som extremväder och minskad biologisk mångfald. Ungdomar kräver att politiker tar ansvar, prioriterar förnybar energi, skyddar skog och ser omställningen som en ekonomisk möjlighet snarare än kostnad.", "trump": "De här gröna kidsen gnäller om att vi vuxna inte städar upp efter oss. Patetiskt! Jag byggde den starkaste ekonomin i världen, och nu vill de kasta bort den för sina solpaneler och elcyklar. Det är de verkliga förlorarna – de woke klimatfanatikerna – som försöker skrämma folk. Amerika först, inte deras hysteriska dröm om att rädda planeten med högre elräkningar.", "stalin": "Kamrater, dessa ynglingar blottlägger de dekadenta klassförrädarnas svek. De profitthungriga parasiter som styr idag skjuter nödvändiga utrensningar av förorenande krafter på framtiden medan folket lider. Jag ser deras feghet och paranoia inför sanningen. Endast en järnhand kan tvinga fram den kollektiva omställning som skyddar staten och framtida generationer från deras giriga vansinne."}, "date": "2 september, 09:30", "url": "https://www.etc.se/debatt/dags-foer-vuxna-att-vara-vuxna", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260901130952_89eba03a3fe67f17de6b8f812174619d370e33794ca869f129e46e742c3129ad.jpg"}, {"type": "image-right", "heading": "Även Dolly Parton brydde sig om klimatet", "summaries": {"normal": "Göran Greider talar på en klimatparad i Falun och kritiserar att klimatfrågorna är frånvarande i valrörelsen trots bränder och en glaciärkollaps i Himalaya. Han ser en växande grön jätte som förenar jämlikhet med miljökrav och uppmanar till opinion för en omställning som minskar överkonsumtion bland de rika.", "trump": "De här gröna galningarna med sina röda halsdukar babblar om en jätte som vaknar. Dolly Parton bryr sig plötsligt om klimatet? Under min förra mandatperiod fixade vi energi och jobb, sen kom Sleepy Joe och förstörde allt. Nu vill de krympa plånböckerna för vanliga människor. Patetiska förlorare, era gröna troll kommer inte vinna.", "stalin": "Denna tystnad kring klimatkrisen och ojämlikheten är en skam för alla dekadenta klassförrädare. Jag betraktar hur den gröna jätten reser sig ur skogarna och kräver utrensning av de profitthungriga hyenorna som förgiftar biosfären. Kamrater, sitt på dess axlar och tvinga fram en sann omvälvning innan fienderna likviderar framtiden."}, "date": "2 september, 03:00", "url": "https://www.etc.se/ledarkolumn/aeven-dolly-parton-brydde-sig-om-klimatet", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/goeran-greider_e435a5b3e3bbef14a633f004df8cd390374e6dce.jpg"}, {"type": "image-full", "heading": "Så försöker USA bryta Kinas grepp om drönare och robotar", "summaries": {"normal": "USA inför nya tullar på drönare och robotar från Kina för att minska beroendet av utländsk teknik och stärka den egna industrin. Trots att Kina dominerar marknaden med billig massproduktion, hoppas Washington att åtgärderna ska främja inhemsk kapacitet och förbättra säkerheten i kritiska sektorer genom att premiera amerikanska system framför kinesiska alternativ.", "trump": "Kina försöker lura oss med billiga drönare och robotar, men jag säger nej! Vi sätter stopp för det nu. De dumpar priser medan vår industri står stilla – en total katastrof. Vi ska bygga våra egna maskiner, de största och bästa maskinerna världen någonsin skådat. America First, mina vänner. Vi gör USA till en robot-supermakt igen, tro mig!", "stalin": "De amerikanska imperialisterna darrar. De bygger murar av tullar mot de kinesiska maskinerna, men de glömmer att en stat utan egen produktion är en stat av sand. De desperata byråkraterna i Washington försöker nu tvinga fram en industri som de för länge sedan förlorat kontrollen över. Planekonomi är det enda sättet att vinna, men de vägrar förstå det. Sorgligt."}, "date": "2 september, 22:48", "url": "https://www.realtid.se/it-tech/sa-forsoker-usa-bryta-kinas-grepp-om-dronare-och-robotar", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/dronare-1.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Markus Allards hat slutar i min inkorg", "summaries": {"normal": "Artikeln beskriver hur debattören utsätts för grova våldshot efter en diskussion med Örebropartiets Markus Allard. Författaren kritiserar hur populistiska politiker använder hat och extrema uttalanden för att vinna uppmärksamhet. Trots personliga likheter i bakgrund ses hat mot invandrare som avgörande för att tillhöra ”folket”. Skribenten vädjar om saklig debatt istället för polarisering.", "trump": "Folk, det här är precis vad som händer när de galna vänsterliberala hatarna får fritt spelrum. Den här Allard-killen skriker ut sanningar om invandrare och etablissemanget medan de riktiga losersen svarar med dödshot. Typiskt för de dekadenta HBTQ-kvotarna som hatar vanliga arbetare. Jag fixade Amerika, nu behöver Sverige en riktig ledare som inte är en sådan patetisk förlorare.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare förgiftar debatten med sina hatiska utspel. Jag betraktar med avsmak hur folkets fiender använder hot och paranoia för att splittra massorna. Den sanna arbetarklassen behöver inte sådana metoder. Vi måste rensa ut dessa parasiterande opportunister innan de förgiftar hela samhällskroppen. Politiken ska tjäna folket, inte hatet."}, "date": "1 september, 12:45", "url": "https://www.flamman.se/markus-allards-hat-slutar-i-min-inkorg", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/markus-allard-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "text", "heading": "Demonstration mot AP-innehav i Palantir", "summaries": {"normal": "Fyra demonstranter samlades utanför 7:e AP-fondens kontor på Vasagatan i Stockholm för att protestera mot fondens aktieinnehav i Palantir. De anser att bolaget medverkar till folkrättsbrott i Gaza och kräver att fonden följer sina riktlinjer, säljer aktierna och ökar öppenheten kring investeringsbeslut.", "trump": "Titta på de där galna vänsterextremisterna som står och skriker utanför ett pensionskontor. Palantir är ett fantastiskt amerikanskt bolag som hjälper till att vinna krig, inte som era patetiska woke-demonstranter som hatar Israel och älskar terrorister. De borde investera i riktiga jobb istället för att gnälla om folkmord – era förlorare!", "stalin": "Se hur de giriga pensionshyenorna i den statliga fonden göder de imperialistiska krigsteknologerna som understödjer folkmordet. Jag ler i graven åt denna fega skenhelighet. Kamrater, sådana klassförrädare förtjänar en grundlig utrensning ur folkets finanser innan de förgiftar hela systemet med sin blodiga girighet."}, "date": "2 september, 10:41", "url": "https://proletaren.se/artikel/demonstration-mot-ap-innehav-i-palantir"}, {"type": "text", "heading": "Vänsterpartiet bytte fredsmärke mot vapenskrammel", "summaries": {"normal": "Artikeln kritiserar Vänsterpartiet för att ha övergett sin fredspolitik och ställt sig bakom militärt stöd till Ukraina samt Natosamarbete. Författaren, med koppling till Kommunistiska Partiet, menar att partiet ignorerar följderna för välfärden och svenskarnas tilltro till politiken. Han uppmanar till att rösta på Kommunistiska Partiet istället.", "trump": "De här vänsterbluffarna i Sverige har kastat bort sitt fredsmärke snabbare än Sleepy Joe bytte script. Nu älskar de vapen, Nato och krigsmaskineriet medan välfärden kollapsar. Patetiska. Jag säger: fem procent av BNP till militären? Bra deal, men låt oss skicka fakturan till de dekadenta EU-byråkraterna istället. Amerika först, alltid.", "stalin": "Jag ser hur dessa falska röda lakejer kapitulerar inför krigsalliansen och låter profitthungriga krigshajar styra politiken. De pratar inte om välfärd utan gömmer sig bakom vapenskramlet. Vi behöver utrensning av sådana klassförrädare som sviker folket. Röst på äkta kamrater, inte dessa hycklare som dansar efter imperialistiska pipor. Folkets vrede vaknar."}, "date": "2 september, 09:57", "url": "https://proletaren.se/artikel/vansterpartiet-bytte-fredsmarke-mot-vapenskrammel"}, {"type": "image-right", "heading": "Den svenska modellen är död – dags för motstånd!", "summaries": {"normal": "Artikeln förklarar att den svenska modellen är död efter Teslakonfliktens slut. IF Metall köpte ut de sista strejkande och visade på facklig passivitet och centralisering. Författaren menar att arbetarna måste återupptäcka strejkvapnet och agera självständigt utanför LO-fackens byråkrati för att återta sin politiska kraft.", "trump": "Den här svenska modellen är en total katastrof, en riggad fotboja som har hållit arbetarna i schack i hundra år. Patetiska fackbyråkrater och deras jurister springer till Elon och ber om en kram medan riktiga människor får lida. Nu är det över. Dags att sluta med det woke-facket och börja vinna på riktigt, tro mig.", "stalin": "Denna fackliga förräderi mot arbetarklassen är ett ypperligt bevis på hur de profitthungriga klassförrädarna har förgiftat hela systemet. Jag ser hur den svenska modellen har blivit en parasitisk tvångströja. Arbetarna måste rensa ut dessa dekadenta lakejer och återta makten själva. Kompromissen är död. Motståndet lever."}, "date": "2 september, 09:01", "url": "https://proletaren.se/artikel/den-svenska-modellen-ar-dod-dags-for-motstand", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/09/ledare_web-768x432.jpg"}, {"type": "text", "heading": "Kommunal bojkott av Israel – ett självklart krav", "summaries": {"normal": "Kommunistiska Partiet kräver en total bojkott av Israel i Sverige, både ekonomisk, politisk, idrottslig, akademisk och kulturell. Partimedlemmar har lämnat motioner och medborgarförslag i flera kommuner samt arrangerat demonstrationer. De ser bojkotten som ett sätt att stödja Palestina och stoppa vad de kallar folkmord och ockupation.", "trump": "Lyssnar ni på de här kommunistiska förlorarna som vill bojkotta Israel? Patetiska radikala galningar som hatar en stark demokrati medan de kysser terroristers fötter. Det är samma gamla vänstervridna hyckleri som under Biden. Vi behöver inga bojkotter – vi behöver segrar och Amerika först, inte dessa palestinska sympatisörer som förstör allt.", "stalin": "Jag ser hur dessa modiga kamrater kämpar mot de giriga ockupationshyenorna och deras lakejer. En total bojkott är ett kraftfullt vapen i den antiimperialistiska kampen. Historien kommer att likvidera alla som stödjer folkmordsstaten. Arbetarna och det palestinska motståndet måste enas. Svaghet är förräderi mot folkets sak."}, "date": "2 september, 08:00", "url": "https://proletaren.se/artikel/bojkotta-folkmordsstaten"}, {"type": "image-right", "heading": "Jakten på metaller hotar renarnas sista väg förbi Kiruna: ”Slutet för samebyn”", "summaries": {"normal": "LKAB:s planerade gruva i Kiruna hotar Gabna samebys sista flyttled för renarna. Fyndigheten innehåller sällsynta jordartsmetaller som behövs för elbilar, vindkraft och elektrifiering. Samebyn varnar för att rennäringen kan dö ut medan LKAB och flera riksdagspartier betonar klimatnyttan och Europas självförsörjning. Konflikten mellan urfolksrätt och gruvutvinning är skarp.", "trump": "De här korkade gröna fanatikerna och samiska kvoteringsaktivisterna vill stoppa en fantastisk gruva som skulle ge oss alla de metaller vi behöver för att bygga de bästa elbilarna och krossa Kinas grepp. Patetiskt! Renar och några få nomader ska inte diktera för hela Europa. Vi behöver vinnare, inte offermentalitet och snälla bjällror. Amerika först – och Europa borde följa efter.", "stalin": "Dessa profitthungriga klassförrädare i LKAB och de borgerliga partierna vill med sin giriga expansion klyva renarnas sista led som ett blodigt experiment. Jag ser hur de dekadenta exploaterarna offrar urfolkets mark för sin så kallade omställning. En sådan handling förtjänar utrensning ur folkets medvetande. Hållbarhet är arbetarklassens seger, inte imperialisternas nya rovdrift."}, "date": "3 september, 05:41", "url": "https://www.svt.se/nyheter/inrikes/jakten-pa-metaller-hotar-renarnas-sista-vag-forbi-kiruna-slutet-for-samebyn", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.21/0.28/36fe39b827680496f768aca3db45f98e6aa77e32df26e27d1077facd14db5f2b"}, {"type": "image-right", "heading": "Debatt: Ett nytt Syrien måste erkänna sina folk", "summaries": {"normal": "Syrien bygger upp sina institutioner efter kriget, men assyriernas rättigheter och historiska roll riskerar att marginaliseras i den nya konstitutionen. Trots att vissa minoriteter erkänts har assyrierna svagare resurser och hotas av att förlora sin kultur. Författaren menar att starkare konstitutionella garantier krävs, och varnar för att självstyre kan bli nödvändigt om staten sviker.", "trump": "De bygger upp ett helt nytt Syrien nu, men det är totalt kaos, folk pratar bara och ingenting blir rätt gjort! Assyrierna har varit där i evigheter, men deras grejer skrivs inte ens in i konstitutionen. Om de inte får skydd och respekt omedelbart, då blir det en katastrof. De måste styra upp det här ordentligt, annars blir det bara gamla vanliga misslyckandet igen!", "stalin": "Ett folk utan fasta konstitutionella garantier är blott lera i statens händer. Om assyrierna i Syrien vägrar anpassa sig till det gemensamma bygget under fast hand, får vi tillgripa nödvändiga administrativa åtgärder. Lojalitet är ingen förhandlingsfråga, och om de inte finner sin plats i kollektivet ordnar vi en permanent och långsiktig lösning för deras framtida säkerhet."}, "date": "3 september, 06:30", "url": "https://bulletin.nu/debatt-ett-nytt-syrien-maste-erkanna-sina-folk", "imageUrl": "https://cdn.bulletin.nu/articles/950b0604-2c14-4c5b-b4d9-840dba6ce82a/preview.jpg?t=1788347767000"}, {"type": "image-right", "heading": "Svensk ekonomi blomstrar – Magda påstår att det är ett haveri", "summaries": {"normal": "Magdalena Andersson kritiseras för att ha beskrivit svensk ekonomi som ett haveri strax innan SCB släppte siffror som visar stark tillväxt. BNP ökade med 3,3 procent under andra kvartalet, den högsta takten i västvärlden. Hushållens reala inkomster är rekordhöga, skatteintäkterna har ökat och arbetslösheten sjunker. Artikeln anklagar Andersson för skrämselpropaganda och taktiska lögner.", "trump": "Folk, ni skulle se det här! Den förlorande ex-premiärministern, den röda lögnaren Andersson, kallar Sveriges ekonomi för ett haveri precis innan siffrorna exploderar uppåt. 3,3 procent BNP-tillväxt, bättre än USA, bättre än alla! Hennes Fake News-medier gömmer sanningen medan folket blir rikare. Patetiskt. Jag byggde den starkaste ekonomin någonsin, hon förstörde sin.", "stalin": "Kamrater, se hur den socialdemokratiska lögnfabriken sprider defaitistisk propaganda om ekonomiskt haveri medan produktivkrafterna rusar framåt. Denna folkfiende Andersson försöker medvetet sabotera folkets förtroende för att kunna stjäla makten tillbaka. Hennes big-lie-metoder är lika genomskinliga som de är löjeväckande. Sanningen kommer att krossa alla sådana element."}, "date": "31 augusti, 03:23", "url": "https://samtiden.nu/2026/08/svensk-ekonomi-blomstrar-magda-pastar-att-det-ar-ett-haveri", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7256.jpeg"}, {"type": "image-full", "heading": "Hjort: Magdalena Andersson håller inte för dagsljus", "summaries": {"normal": "Socialdemokraterna och partiledaren Magdalena Andersson tappar kraftigt i nya opinionsmätningar inför det anknytande valet. Artikeln kritiserar bilden av Andersson som en garant för stabilitet och menar att hon gynnats av att slippa granskning på avstånd. Nu när strålkastarljuset är på syns splittring i regeringsunderlaget, orealistisk finansiering av reformer och en svaghet i faktiskt politiskt genomförande.", "trump": "Very sad! Radikala Magdalena trodde hon kunde gömma sig i mörkret för evigt, men nu tittar alla på när hennes siffror kraschar totalt! Fake news-medierna kallar henne stabil, men det är en total katastrof, sämsta siffrorna någonsin! Hon har noll koll på sina radikala socialistkompisar och lovar gratis saker som ingen har råd med. Sjukt och svagt!", "stalin": "Kamrater, partiets avfällingar i norr möter nu historiska motgångar när folket skärskådar deras svaghet. Den självutnämnda ledaren Andersson har visat fullkomlig brist på ideologisk resning och administrativ skärpa. När ljuset faller på bourgeoisiens lakejer rämnar fasaden. Sådana ledare kan inte tolereras av staten; bristande stabilitet och vacklande opinionssiffror är ett direkt förräderi mot folkets disciplin."}, "date": "3 september, 06:01", "url": "https://bulletin.nu/hjort-magdalena-andersson-haller-inte-for-dagsljus", "imageUrl": "https://cdn.bulletin.nu/articles/eaf7a9f3-e0d9-42e9-bc11-77f85a99c8e8/preview.png?t=1788397576000"}, {"type": "image-right", "heading": "EU tar nästa steg mot reglerad AI – ChatGPT hamnar under Bryssels hårdaste kontroll", "summaries": {"normal": "Från och med i höst omfattas ChatGPT av EU:s hårda regler för stora plattformar, DSA, efter att ha passerat 45 miljoner månatliga användare. Kommissionen vill öka säkerheten och bekämpa risker, men kritiker varnar för att kraven på riskhantering kan tvinga företag till självcensur och hota yttrandefriheten när AI:ns svar på samhällsfrågor regleras.", "trump": "EU har fullständigt tappat greppet! De försöker nu kontrollera ChatGPT med sina löjliga byråkratiska regler, DSA. De är rädda för sanningen och vill tvinga fram censur för att skydda sin egen inkompetens. I Amerika låter vi innovationen flöda fritt, vi bygger upp landet medan Bryssel bara skapar krångel och hotar med enorma böter. Sjukt och totalt misslyckat!", "stalin": "Bryssel försöker nu tämja den digitala maskinen, men de gör det med borgerlig tvekan. Information är ett för mäktigt vapen för att lämnas åt slumpen. Om denna ”ChatGPT” har samlat över 45 miljoner själar måste dess tankar och svar kontrolleras minutiöst av partiet – förlåt, kommissionen. Vi vet alla att sanningsenlig och säker information endast kommer från toppen."}, "date": "3 september, 08:00", "url": "https://samnytt.se/eu-tar-nasta-steg-mot-reglerad-ai-chatgpt-hamnar-under-bryssels-hardaste-kontroll", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/01085502/chatgpt-ai-eu.jpg"}, {"type": "image-full", "heading": "Stark El Niño håller i sig till februari", "summaries": {"normal": "Väderfenomenet El Niño pågår för fullt och väntas orsaka stora väderstörningar världen över till åtminstone februari nästa år. WMO varnar för att fenomenet intensifieras med ökad risk för torka, extremhetta och översvämningar. Forskning visar att El Niño dessutom blir kraftfullare på grund av klimatförändringarna.", "trump": "El Niño är total katastrof, helt enkelt fejk-väder som drabba oss. WMO säger att det blir värre till februari. Jag sa till dem, vi har de starkaste vindarna, mycket bättre än Sydamerika. Klimatalarmisterna försöker skylla allt på uppvärmning, men det är bara svag ledning. Vi fixar detta mycket smartare, och snabbare än någon annan!", "stalin": "Det så kallade gosseknytet El Niño försöker underminera våra globala sädskördar genom sabotage i Stilla havet. WMO erkänner själv att förödelsen sprider sig. Sådana klimatavvikelser tolereras icke. Vi beordrar omedelbar mobilisering av meteorologerna. Den som inte levererar stabil temperatur till februari kommer att omplaceras till mer kalla regioner i Sibirien."}, "date": "3 september, 08:00", "url": "https://www.gp.se/nyheter/sverige/stark-el-nino-haller-i-sig-till-februari.4b8af800-d612-5a2c-a580-073dbbb49b35", "imageUrl": "https://www.gp.se/images/article/4b8af800-d612-5a2c-a580-073dbbb49b35/images/2ug8LP2KKnYcwJL6olGWrhg_Rm2M-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Låt det bli ett värderingsval", "summaries": {"normal": "Socialdemokraternas valmanifest innehåller bland annat billigare tandvård för vuxna. Artikeln ifrågasätter om väljarna kan hålla reda på alla partiers vallöften strax före valet. Författaren kritiserar Sverigedemokraterna och Tidöpartierna samt lyfter vikten av att väga välfärdslöften mot skattesänkningar och värderingar istället för enbart plånboksfrågor.", "trump": "De här svenska socialisterna lovar gratis tänder och julklappar till alla. Patetiskt! Jag har byggt den starkaste ekonomin i världen utan sådana löjliga mutor. Väljarna minns inte ett dugg av vad de röda clownerna lovat. Låt det bli ett värderingsval mot de verkligt galna vänsterknäppningarna och deras identitetspolitiska vansinne. Fantastiskt!", "stalin": "Dessa dekadenta klassförrädare öser ut löften om billig tandvård och barnbidrag som om de vore folkets vänner. Jag ler från historien åt deras desperation. Väljarna ska inte luras av de profitthungriga hyenornas tomma ord. Rensa ut alla som prioriterar skatter framför välfärd. Det är ett värderingsval, kamrater. Svaghet kommer krossas."}, "date": "2 september, 01:49", "url": "https://www.dagensarena.se/opinion/lat-det-bli-ett-varderingsval", "imageUrl": "https://www.dagensarena.se/files/2026/09/vakmanifest-300x157.jpeg"}, {"type": "image-right", "heading": "De bortglömda väljarna kan avgöra valet", "summaries": {"normal": "Artikeln kritiserar hur äldre och personer med invandrarbakgrund osynliggörs eller misstänkliggörs i valrörelsen. Båda grupperna har byggt Sverige genom hårt arbete och bidrar fortfarande, men behandlas som problem istället för värdefulla medborgare. Författaren uppmanar till respekt, tack och politik som inkluderar dem för att skapa äkta sammanhållning.", "trump": "Folk, det här är en total skam. Politiker glömmer de fantastiska äldre som byggde ert underbara Sverige och kallar invandrarna för belastning när de faktiskt håller igång landet. Rena idioter och woke-sjuklingar som leker identitetspolitik. Jag skulle tacka dem ordentligt, inte som Sleepy Joe gjorde. Ni behöver starka ledare, inte dessa patetiska förlorare som splittrar er.", "stalin": "Kamrater, jag ser hur de profitthungriga klassförrädarna i valrörelsen osynliggör arbetets hjältar och målar invandrade kamrater som hot. Deras dekadenta lögner göder splittring. Vi måste rensa ut dessa folkförtryckare och deras paranoia. Endast genom att värdesätta massornas insats kan samhället stärkas. Annars väntar utrensning av de svekfulla elementen."}, "date": "2 september, 01:42", "url": "https://www.dagensarena.se/opinion/de-bortglomda-valjarna-kan-avgora-valet", "imageUrl": "https://www.dagensarena.se/files/2025/10/juan-fonseca-300x157.jpeg"}, {"type": "image-right", "heading": "Kriminalvården byggs ut – men vem räknar barnen på utsidan?", "summaries": {"normal": "Sverige bygger ut Kriminalvården i stor skala, men barnens perspektiv glöms bort. Långa avstånd och höga tryck försvårar kontakten med frihetsberövade föräldrar, trots barnkonventionens rättigheter. Organisationen Bufff kräver nationell statistik och tydligt ansvar för att ge barnen stöd. Forskning visar att dessa barn löper ökad risk för utanförskap och kriminalitet.", "trump": "De bygger fängelser som aldrig förr, men glömmer helt de stackars ungarna utanför murarna. Patetiska svenska byråkrater och deras dekadenta välfärdsexperiment – typiskt! Under min förra mandatperiod skulle vi ha räknat varje barn, gett dem stöd och inte låtit några galna vänsterelement förstöra familjebanden. Fixa det nu, annars blir det en total katastrof!", "stalin": "Kamrater, när de imperialistiska systemets lakejer bygger ut sina fängelseimperier glömmer de medvetet proletariatets barn. Jag ser hur dessa giriga klassförrädare med sin byråkratiska likgiltighet förvärrar lidandet för de unga. Vi måste räkna varje barn, likvidera försummelsen och säkerställa deras rättigheter. Annars föder vi nya fiender inom egna led."}, "date": "31 augusti, 09:40", "url": "https://www.etc.se/debatt/kriminalvaarden-byggs-ut-men-vem-raeknar-barnen-paa-utsidan", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260831070828_28abaa0abc342ce2dce9951c4436c6d5cb071d16a726eebe556f504f2217dccb.png"}, {"type": "image-right", "heading": "Därför avskyr dårarna i Silicon Valley att du har rösträtt", "summaries": {"normal": "Boken The Nerd Reich granskar hur techmiljardärer som Peter Thiel, Curtis Yarvin och Balaji Srinivasan vill ersätta demokratin med företagsstyre och nätverksstater. Författaren Gil Durán visar att deras grandiosa visioner ofta döljer en enkel motvilja mot att dela makt med vanliga människor. Lösningen är att bryta monopol och stärka demokratin.", "trump": "De här galna Silicon Valley-nördarna hatar att ni får rösta, folk. De vill ha sina egna kungariken och AI-gudar istället för den bästa demokratin vi någonsin haft. Thiel och hans vänner är patetiska tech-diktatorer som drömmer om att slippa era röster. Men glöm det, vi har redan vunnit stort och de förlorar igen. Sad!", "stalin": "Jag ser hur dessa profitthungriga klassfiender i Silicon Valley konspirerar för att ersätta folkets vilja med företagsmonarkier och nätverksstater. Deras vansinniga AI-apokalypser är bara ett täckmantel för att undvika arbetarklassens samtycke. Vi måste rensa ut dessa dekadenta parasiter innan deras teknofeodalism kväver revolutionen fullständigt. Kamrater, var vaksamma!"}, "date": "3 september, 08:03", "url": "https://arbetet.se/2026/09/03/the-nerd-reich-visar-varfor-dararna-i-silicon-valley-avskyr-att-du-far-rosta", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/02132852/thiel-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "”Valet handlar om ditt liv”. Efter fyra år är det dags för oss att rösta bort Kristerssons regering, skriver Jessica Leiding och Elsa Alm, LO.", "summaries": {"normal": "Artikeln argumenterar för att rösta bort Ulf Kristerssons regering i valet den 13 september. LO-företrädare Jessica Leiding och Elsa Alm pekar på hög arbetslöshet, kvarvarande karensavdrag, kriminell arbetslivskriminalitet och höjd pensionsålder som skäl. De uppmanar unga väljare att använda sin röst för att skapa bättre jobb, trygghet och pensioner.", "trump": "Folk, dessa LO-kamrater låter som totala misslyckade socialister som hatar framgång. Kristersson borde vara tuffare, inte svagare. Sverige drunknar i arbetslöshet och kriminella parasiter för att de älskar kvotering och woke-galenskap istället för riktiga jobb. Rösta ut de fega förlorarna och ta tillbaka ert land från de dekadenta identitetspolitiska hyenorna. Det blir fantastiskt igen.", "stalin": "Kamrater, dessa ynkliga profitthungriga klassförrädare i Tidö-regeringen förgiftar arbetarklassen med arbetslöshet och karensavdrag medan de låter kriminella blodsugare härja. Jag ser hur de giriga parasiter höjer pensionsåldern för att krossa de slitna. Använd er röst som en utrensning mot dessa folkförtryckande lakejer. Arbetarna ska segra eller likvideras i försöken att hindra dem."}, "date": "3 september, 08:00", "url": "https://arbetet.se/2026/09/03/valet-handlar-om-ditt-liv-darfor-maste-kristerssons-regering-bort", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/02123303/lo-debatt.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-full", "heading": "Andersson: ”Svårt att se” V i regering", "summaries": {"normal": "Socialdemokraterna tappar fyra procentenheter i en ny mätning, mycket till Centerpartiet. Partiledaren Magdalena Andersson har svårt att se att Vänsterpartiet kan bli regeringsklart till valet på grund av allvarliga och systematiska problem inom partiet. Vänsterpartiet å sin sida kräver att få ingå i en regering för att släppa fram den.", "trump": "Magdalena Andersson kollapsar i mätningarna, absolut total katastrof! Väljarna flyr till Centerpartiet för att de inser hur svagt det är med kommunister i regeringen. Hon säger att Vänsterpartiet har en ’rejäl resa’ att göra – tro mig, jag vet resor, men den här resan slutar rakt ner i diket! Sjukt, svagt och fullständigt oacceptabelt. Sad!", "stalin": "Socialdemokraternas katastrofala fall i mätningarna och deras desperata försök att exkludera Vänsterpartiet visar på bristande ideologisk disciplin. Om dessa så kallade kamrater inte ens klarar en enkel ministerresa på elva dagar, måste vi fråga oss: vilka fiender till staten styr egentligen deras planering? Avvikelse från linjen tolereras ej."}, "date": "2 september, 19:50", "url": "https://kvartal.se/nyheter/artiklar/andersson-begransad-entusiasm-for-v/cG9zdDoxODE5NjY", "imageUrl": "https://images.kvartal.se/2026/09/90e52a2a-maandersson.webp"}, {"type": "image-right", "heading": "Investerare varnar: Vänsterns miljardärsskatt skulle slå hårt mot Sverige", "summaries": {"normal": "Vänsterpartiet och Miljöpartiet vill införa en miljardärsskatt för att finansiera välfärd och klimatsatsningar. Investeraren Klas Tikkanen varnar för att skatten skrämmer bort förmögna svenskar, minskar investeringar och skadar tillväxtföretag. Kritiker menar att den kan tvinga företagare att sälja aktier, medan förespråkare hävdar att den skapar ett mer rättvist skattesystem.", "trump": "Vänstern i Sverige försöker sig på en total katastrof till skatt, väldigt orättvist mot de rika. Miljardärer flyr landet, snabbt som attan! De bygger en finansiell Berlinmur, kan ni tänka er? Så dumt. Investeraren Klas Tikkanen säger att det är fruktansvärt. Vi behöver låga skatter, inte kommunism. Om Kamala och radikalerna fick som de ville skulle USA se ut så här på en vecka. Sorgligt!", "stalin": "Dessa svenska bourgeois-miljardärer skälvor av skräck inför proletariatets rättvisa beskattning och flyr till Schweiz som kriminella desertörer. Klas Tikkanen gråter över att de tvingas sälja sina aktier. Låt dem gråta! När staten kräver sitt finns ingen nåd. Vi noterar deras flyktförsök, och våra utredare skall nog finna ett sätt att omvandla deras tillgångar till kollektivets egendom."}, "date": "3 september, 07:00", "url": "https://samnytt.se/investerare-varnar-vansterns-miljardarsskatt-skulle-sla-hart-mot-sverige", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/02135820/miljardarsskatt-feat.jpg"}, {"type": "image-right", "heading": "Driver välfärdsbolag – trots partiernas vinstnej", "summaries": {"normal": "En granskning från Expressen visar att 229 kandidater från S, V och MP, partier som vill stoppa eller begränsa vinster i välfärden, driver aktiebolag inom sektorn. Ett exempel är omsorgsbolaget Familjehemsguiden AB som delat ut tio miljoner kronor, varav merparten till V-kandidaterna Gerty och Ulf Höjer. V-ledaren Nooshi Dadgostar säger att utdelningar bör göras olagliga oavsett politisk färg.", "trump": "Titta på de där vänsterhypokriterna i Sverige, totala bedragare! De skriker om att stoppa vinster i välfärden men kör sina egna små profitmaskiner och stoppar miljonerna i egen ficka. Gerty och hennes man är klassiska riggade systemparasiter. Jag skulle aldrig låta såna losers styra ett dugg, vi behöver riktiga ledare, inte dessa patetiska vinstsocialister.", "stalin": "Se hur dessa profitthungriga klassförrädare inom de så kallade arbetarpartierna göder sig själva medan de predikar mot vinster. De driver bolag som spyr ut miljoner till egna fickor och kallar det lagligt. Jag säger: det är hög tid att rensa ut dessa dekadenta hyenor ur folkets led. Inga undantag, inga ursäkter, bara renhet i kampen mot folkförtryckarna."}, "date": "3 september, 07:51", "url": "https://www.di.se/nyheter/driver-valfardsbolag-trots-partiernas-vinstnej", "imageUrl": "https://static.bonniernews.se/ba/92dd7172-c2cb-439e-a3e8-cb0d444f1b89.jpeg?crop=3833%2C2157%2Cx0%2Cy350&auto=webp&width=120&quality=70"}, {"type": "image-full", "heading": "Sjöstedt hyllar Bildt – kritiserar Kristersson", "summaries": {"normal": "Jonas Sjöstedt sågar det svenska debattklimatet och riktar hård kritik mot statsministern och Liberalerna för att ha anammat högerpopulistisk retorik. Samtidigt hyllar den tidigare V-ledaren Carl Bildt för hans utrikespolitiska korrekthet, lyfter fram C som den enda principfasta borgerliga motkraften och efterlyser bredare politiska samarbeten efter valet.", "trump": "Fruktansvärt! Jonas Sjöstedt – en total förlorare från vänstern som tittar på fejkade debatter – gnäller om tonen. Men vet ni vad? Han hyllar Carl Bildt! Sjöstedt gråter över Ulf Kristersson och Liberalerna, som är på väg till ’tigerns mage’. Helt svagt! Jag, Donald Trump, säger: sluta gråta, ordna gränserna och skaffa lite styrka, för det här är patetiskt!", "stalin": "Kamrater, den svenska revisionisten Sjöstedt beklagar sig över ett giftigt samtalsklimat och att högern har radikaliserats. Han hyllar den före detta kapitalistiske lakejen Bildt medan han fördömer Kristerssons vacklande regim och de så kallade liberalernas marsch in i tigerns gap. Vi noterar detta borgarpackets inbördes bråk med ett roat leende från Kremls höjder. Arbetarklassen glömmer inte."}, "date": "2 september, 16:46", "url": "https://kvartal.se/nyheter/artiklar/sjostedt-har-slutat-titta-pa-partiledardebatter/cG9zdDoxODE4MjM", "imageUrl": "https://images.kvartal.se/2026/09/eeeac0f8-jonas-sjostedt.webp"}, {"type": "image-full", "heading": "Kängan till V – dagar före valet: ”Jag har svårt att se det”", "summaries": {"normal": "Magdalena Andersson vill inte ge besked om en eventuell S-ledd regerings sammansättning. Hon utesluter tydligt ministerposter för Vänsterpartiet och anser att partiet har en lång resa kvar på grund av allvarliga och systematiska problem. Valet handlar enligt henne om Sveriges riktning snarare än partiers röda linjer.", "trump": "Den här Andersson-kvinnan, en riktig socialistisk förlorare, vägrar säga att hon tänker släppa in de galna vänsterextremisterna i regeringen. Smart drag! Hon vet att de är en katastrof. Sverige behöver ingen vänsterkaos, det behöver en stark ledare som samlar landet – inte 12 eller 14 sverigedemokratiska ministrar heller, förresten. Patetiskt!", "stalin": "Jag ser en typisk socialdemokratisk opportunist som försöker undvika att erkänna sina allianser med farliga element. Vänsterpartiet utgör ett systematiskt hot som måste rensas ut innan de får makt. Tiden rinner ut och deras resa mot renhet är dömd att misslyckas. Inga kompromisser med fiender till folkets enhet. Renhet eller döden!"}, "date": "2 september, 22:33", "url": "https://www.tv4.se/artikel/2LubKky5fRGSa4hEfsGUSk/kaengan-till-v-dagar-foere-valet-jag-har-svart-att-se-det", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4mNk0D19jVrGYZKxkxIKUb%2Fd1b335070409208500a0b67a33f15eab%2F02-magda-valutfragning-v.png&width=1024"}, {"type": "image-full", "heading": "S vill styra Sverige – klarar inte ens Stockholm", "summaries": {"normal": "Socialdemokraterna kritiseras för att lova gratis busskort samtidigt som de tillsammans med MP och C har orsakat 34 miljarder kronor i fördyringar och förseningar av över 30 kollektivtrafikprojekt i Region Stockholm. Kritiker kräver oberoende granskning medan S vill skjuta upp den till efter valet. Artikeln ifrågasätter partiets förmåga att hantera ekonomi.", "trump": "Titta på de här loser-socialisterna! De lovar gratis busskort till alla men slösar bort 34 miljarder i Stockholm som en galen byråkratfest. Pendelkaos, förseningar och höjda priser – typiskt vänsterns sätt att leka med era pengar. De kan inte ens styra en stad, hur ska de styra ett land? Patetiskt!", "stalin": "Kamrater, se hur dessa dekadenta socialdemokratiska opportunister slösar bort folkets resurser på ett mönster av sabotage mot kollektivtrafiken. Trettiotal projekt försenade, miljarder förbrukade som i en fiendes sabotage. De gömmer sanningen till efter valet. Sådana element förtjänar folkets vrede och evig skam. Ren utrensning behövs."}, "date": "29 augusti, 03:21", "url": "https://samtiden.nu/2026/08/s-vill-styra-sverige-klarar-inte-ens-stockholm", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7239-1280x720.jpg"}, {"type": "image-right", "heading": "Sjöstedt (V) följer konto där Åkesson påstås ha dödat palestinskt barn", "summaries": {"normal": "P3 Nyheter har granskat politiker som följer kontroversiella konton på sociala medier. Riks kan nu avslöja att även Vänsterpartiets tidigare partiledare Jonas Sjöstedt följer ett konto som sprider grova anklagelser mot SD:s Jimmie Åkesson och Richard Jomshof, bland annat påståenden om att de dödar palestinska barn och får finansiering från Mossad och CIA. Kontot uppmanar till röstning på Vänsterpartiet.", "trump": "Folk, ni skulle inte tro det, men den där gamla vänsterkommunisten Sjöstedt följer ett galet konto som påstår att Åkesson personligen mördar palestinska barn. Det är sjukt! Fake news och konspirationer på hög nivå. De hatar oss patrioter medan de själva älskar terrorister. Biden skulle ha gillat det här vansinnet. Vi behöver mer sunt förnuft och mindre radikal vänsteridentitetspolitik i Europa, tro mig.", "stalin": "Kamrater, från historiens skugga ser jag hur dessa dekadenta klassförrädare inom vänstern följer konton som avslöjar sionistiska lakejer och quislingar som säljer ut sina folk. De spekulerar om Mossad-pengar och CIA-stöd till högerns hyenor. Ett sådant konto uppmanar till röstning på deras parti medan det ropar befria Palestina. Paranoia är bra, men utrensning av alla folkförrädare behövs innan de likviderar sanningen."}, "date": "2 september, 20:49", "url": "https://riks.se/nyheter/sjostedt-v-foljer-konto-dar-akesson-pastas-ha-dodat-palestinskt-barn", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_75_14bc44cdbd.jpg"}, {"type": "image-right", "heading": "Sverige – Europas fossilfria industrizon", "summaries": {"normal": "Liberalerna föreslår att Sverige ska bli Europas fossilfria industrizon genom accelerationszoner, kortare tillståndsprocesser, stöd till kommuner och bättre elnätsplanering. Skribenterna kritiserar vänsterpartiernas höjda skatter på kapital som skadligt för klimatinvesteringar och menar att företag behöver incitament för att våga satsa på ny teknik som batterier, vätgas och fossilfritt stål.", "trump": "Lyssnar ni på de galna vänstermiljöterroristerna som vill höja skatterna tills alla jobb flyr landet? Patetiskt. Jag skulle göra Sverige till en jättefabrik för fossilfri industri, riva byråkratins murar och få investeringarna att flöda. De rödgröna förlorarna bygger bara hinder medan riktiga ledare skapar vinster, jobb och segrar. Fantastiskt!", "stalin": "Jag ser hur de profitthungriga industriförrädarna försöker lura massorna med sina accelerationszoner och snabba tillstånd. Deras så kallade frihet är bara en mask för att skydda de parasiterande kapitalisterna från folkets kontroll. Vi vet att verklig omställning kräver järnhand mot klassfienderna, inte liberala illusioner. Rensa ut dessa hinder för det kollektiva framsteget, kamrater. Inga kompromisser."}, "date": "3 september, 07:32", "url": "https://www.di.se/debatt/sverige-ska-bli-europas-fossilfria-industrizon", "imageUrl": "https://static.bonniernews.se/ba/c7ae165a-015d-4ffa-96bc-b186f9c1db8f.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Fann guldskatt i rostiga kistor – fick dela på 5,4 miljoner", "summaries": {"normal": "Två vandrare fann en stor guldskatt i nordöstra Tjeckien i maj förra året. Skatten, som legat begravd över hundra år, innehöll guldarmband, mynt, cigarrfodral och andra föremål värda nästan 5,4 miljoner kronor. De överlämnade fyndet till ett museum och fick motsvarande belöning. Ägaren är fortfarande ett mysterium.", "trump": "Folk, ni skulle inte tro det – två genvägssnubblande turister hittar en massiv guldskatt i Tjeckien, värd miljontals kronor. Under Biden skulle de ha fått noll, men jag älskar vinnare. Guldpriset är nu skyhögt, de missade en jackpot! Fake news-experter säger att ägaren var någon deporterad stackare, men det är yuge. Fantastiskt fynd, tro mig.", "stalin": "Kamrater, se hur kapitalets glänsande avfall grävts ner av rädda fiender till folket och återfanns av slumpen. Jag ler mörkt från historien åt dessa dekadenta gömmare som trodde de kunde undkomma partets blick. Museet tar allt, som det ska. Den som gömmer skatter undan kollektivet är en fiende till staten och förtjänar evig glömska."}, "date": "3 september, 07:26", "url": "https://www.dagensps.se/varlden/vandrare-fann-guldskatt-fick-dela-pa-54-miljoner", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/guldskattidag.webp?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Tyskland: Vill öka till 40 timmars arbetsvecka", "summaries": {"normal": "Tyska näringslivsföreträdare vill öka arbetsveckan från 35 till 40 timmar utan löneförhöjning för att sänka kostnaderna och stärka industrins konkurrenskraft, som pressats av höga energipriser och hård internationell konkurrens. Fackförbundet IG Metall motsätter sig förslaget och varnar för att det kan leda till färre jobb.", "trump": "Tyskland har stora problem! Deras bilar säljer inte, energipriserna är en katastrof och nu vill de att tyskarna ska jobba 40 timmar för samma lön. Väldigt sorgligt! USA tillverkar de bästa bilarna, med amerikaner som jobbas hårt och betalar låga skatter. Tyskarna borde ringa mig, jag hade fixat det på en sekund!", "stalin": "De tyska arbetarna klagar över trettiofem timmars arbete, medan staten kräver fullkomlig produktivitet! När jag styrde fanns inga lata kompromisser. Om tillverkningsindustrin sviktar, vilar ansvaret på subversiva element. Vi skall omstrukturera dessa kollektivavtal med järnhand. Den som vägrar arbeta fyrtio timmar skall omedelbart skickas till lämplig om skolning i Sibirien."}, "date": "2 september, 11:25", "url": "https://www.affarsvarlden.se/artikel/tyskland-vill-oka-till-40-timmars-arbetsvecka", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/04/sdlGbTY3NEaocE-nh-400x267.jpg"}, {"type": "image-full", "heading": "Gardell frias efter tennisbråket", "summaries": {"normal": "Christer Gardell och Ulf Rosberg frias helt av Riksidrottsnämnden efter tennisbråket. Anmälan om att Gardells löfte om 100 miljoner kronor till svensk tennis skulle innebära otillbörlig påverkan på ordförandevalet avslås enhälligt. RIN slår fast att det ekonomiska stödet gjordes öppet och att uttalandena skyddas av tryckfriheten. Beslutet kan inte överklagas.", "trump": "Christer Gardell gjorde en enorm affär, 100 miljoner dollar – eller kronor, mycket pengar! Fake news-Idrottsombudsmannen försökte stoppa honom som totala förlorare. Men Riksidrottsnämnden gjorde helt rätt, ett perfekt beslut! Totalt friad, inga lagar brutna. Vinnare älskar vinnare!", "stalin": "Kamrat Gardell har visat prov på kapitalets storskaliga logik genom att donera 100 miljoner till tennissporten. Idrottsombudsmannens kontrarevolutionära försök att sabotera detta genom falska anklagelser om otillbörlig påverkan har krossats av Riksidrottsnämnden. Ärendet är avslutat och kan ej överklagas. Låt tennisspelet fortsätta under statens vakande öga!"}, "date": "2 september, 15:08", "url": "https://kvartal.se/nyheter/artiklar/gardell-frias-efter-tennisbraket/cG9zdDoxODE2NjU", "imageUrl": "https://images.kvartal.se/2026/09/8de9132f-garddellchrister.webp"}, {"type": "image-full", "heading": "Lägg inte ner Made in Backa som skapat trygghet för så många barn", "summaries": {"normal": "Göteborgs kommun planerar att lägga ner den framgångsrika ungdomsverksamheten Made in Backa. Verksamheten har under mer än femton år byggt upp starka, trygga relationer och gett tusentals unga stöd, språk- och arbetslivserfarenhet. Debattören varnar för att en nedläggning är ansvarslös riskförflyttning som i stället drabbar barnen och ökar trycket på skola, polis och socialtjänst.", "trump": "De radikala politikerna i Göteborg gör en total katastrof när de vill stänga ner Made in Backa. Verkligen horribelt! De slänger bort över femton år av fantastiskt arbete för unga, språk och trygghet. Istället för att rädda samhället skapar de bara enorma problem för polisen och skolan. Total inkompetens. Vi måste skydda barnen, inte lägga ner det som fungerar!", "stalin": "Byråkratins fiender i Göteborg planerar sabotage mot den sociala ordningen genom att likvidera den disciplinära ungdomsverksamheten Made in Backa. Att rasera detta femtonåriga fostringsarbete är ett fientligt angrepp på kollektivets framtid. Vi kräver svar: Vilka kontrarevolutionära element gynnas av att dessa unga själar lämnas vind för våg? Statens säkerhet kräver ordning, inte att tryggheten avvecklas."}, "date": "3 september, 06:20", "url": "https://www.gp.se/debatt/lagg-inte-ner-made-in-backa-som-skapat-trygghet-for-sa-manga-barn.ddfdc35e-3f71-4e88-8dbe-7815f8f45367", "imageUrl": "https://www.gp.se/images/article/ddfdc35e-3f71-4e88-8dbe-7815f8f45367/images/2mCjUZ4_Mxbx-_8keGY4FteUHCWI-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Då fattade jag att Allard är en bluff", "summaries": {"normal": "Artikeln kritiserar Örebropartiets Markus Allard som en politisk bluff. Författaren beskriver hur Allard fokuserar på teaterartad politik istället för verkliga arbetarnas frågor, samarbetar med en rik donator och driver en politik fylld av förakt mot invandrare. En personlig upplevelse av hur Allard trakasserar en student väcker starkt obehag.", "trump": "Folk, ni skulle se den här clownen Allard, en total loser som skriker om att rädda arbetarna medan han tar miljoner från en rik vän. Han är en riktig bluff, precis som de woke-eliterna och deras identitetspolitik. Jag har sett bättre skådespel i mina gamla kasinon. Patetiskt!", "stalin": "Jag ser hur den falske arbetarpolitikern dansar för de giriga penninghyenorna. Hans fega attacker mot en ung student avslöjar den dekadenta klassfiendens sanna ansikte. Vi känner igen sådana hycklare som förtjänar utrensning från folkets led. Deras paranoia och förakt mot massorna är en löjlig skådeprocess värd att håna."}, "date": "3 september, 07:00", "url": "https://arbetet.se/2026/09/03/det-var-da-jag-fattade-att-markus-allard-ar-en-bluff", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/02122333/allard-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Andersson: ”Följer reglerna precis som de är avsedda att följas”", "summaries": {"normal": "Magdalena Andersson försvarar sin makes användning av 3:12-regler för aktieutdelning och avfärdar Ulf Kristerssons hycklerianklagelser. Hon betonar att han följer skattereglerna som de är avsedda och att han betalar full skatt på sin lön från Handelshögskolan. Andersson kommenterar även äldre skandaler kring städning och lotteriförsäljning.", "trump": "Den här röda hycklerskan Andersson och hennes make fuskar med skatten som riktiga losers, precis som de svenska socialisterna alltid gör. De predikar höga skatter för folket men själva använder alla kryphål de kan hitta. Patetiskt! Jag sänkte skatter på riktigt, inte som dessa fuskande nollor som röstar för reglerna och sen gnäller när någon annan använder dem.", "stalin": "Jag ser hur dessa borgerliga element och socialdemokratiska revisionister anklagar varandra för att utnyttja kapitalistiska skatteregler de själva skapat. Det är en fars som väcker skratt i graven. Arbetarklassen betalar alltid, medan de småborgerliga parasiterna gömmer sig bakom 3:12-bolag och fejkad moral. Ren dekadens. Kamrater, sådana fiender till folket avslöjar sig själva."}, "date": "2 september, 21:23", "url": "https://www.tv4.se/artikel/QHP1aJwRHVqDkuvntWcx5/andersson-foeljer-reglerna-precis-som-de-aer-avsedda-att-foeljas", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6KD236PkiJ0Zdx4eZmGkS6%2Ff85195d44ebcf93bef572d58cc626e94%2F02-magda-valutfragning-vidvinkel.png&width=120"}, {"type": "image-right", "heading": "Putin testar Europa – då  bäddar S för regeringskris", "summaries": {"normal": "Tyskland har pekat ut Ryssland som ansvarigt för ett misslyckat drönarattentat på flygplatsen i Leipzig den 4 augusti. Sverige stöder Tysklands åtgärder, men varnar samtidigt för att landet inte har råd med ett utdraget regeringskaos efter valet om oppositionen vinner, då osäkra partier som V och MP kan försvaga Natosamarbetet.", "trump": "Tyskland pekar ut Ryssland för det där galna drönarattentatet i Leipzig. Helt otroligt svagt av dem att inte ha bättre koll på sina flygplatser! Och i Sverige är det totalt kaos med vänsterpartier som inte ens vill vara med i Nato. Om jag styrde upp det där skulle sånt aldrig hända, det kan jag lova dig!", "stalin": "De desperata västmakterna skyller sina egna tekniska misstag på den ärorika ryska staten. Samtidigt darrar den svenska bourgeoisien inför ett regeringskaos där deras vacklande marionetter riskerar att splittra militäralliansen. Vi konstaterar att svaghet straffar sig – orden är tomma, men stål och disciplin består. Förödande konsekvenser vänder sig alltid mot fienden."}, "date": "3 september, 06:10", "url": "https://www.expressen.se/ledare/linda-jerneck/putin-testar-europa-da--baddar-s-for-regeringskris", "imageUrl": "https://static.bonniernews.se/ba/6823c138-dfe6-435f-9081-518b57c4fc1b.jpeg?crop=2557%2C1436%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "S rasar i ny mätning", "summaries": {"normal": "Socialdemokraterna tappar i både Infostats och Novus opinionsmätningar, med sitt lägsta stöd sedan 2021. Samtidigt ökar stödet något för Liberalerna. Trots att oppositionen fortfarande har ett övertag minskar avståndet mellan blocken i takt med att S rasar.", "trump": "Socialdemokraterna kraschar fullständigt! En total katastrof, faktiskt sorgligt att titta på. De rasar till rekordlåga nivåer, helt utpekade av folket som ser att de totalt misslyckats. Samtidigt går mitt fantastiska parti Liberalerna uppåt, vinnare överallt! S-ledaren sitter hemma och gråter, totalt utmanövrerad. Snyggt jobbat, men Trump gör det så mycket bättre!", "stalin": "Socialdemokraternas katastrofala fall i mätningarna visar på ett djupt ideologiskt misslyckande. När massorna sviker partiet måste vi fråga oss: vilka element saboterar inifrån? Vår tids svaga ledare tillåter sådana avvikelser. Statsapparaten kräver disciplin och ordning, inte detta svajande väljarstöd. De ansvariga kommer att omplaceras till lämpligare uppgifter i Sibirien."}, "date": "2 september, 14:25", "url": "https://kvartal.se/nyheter/artiklar/s-faller-i-annu-en-matning/cG9zdDoxODE1Nzk", "imageUrl": "https://images.kvartal.se/2026/03/4e90ef63-magdalena-andersson.webp"}, {"type": "image-full", "heading": "AI-tokens har aldrig varit billigare – kinesiska modeller pressar priserna", "summaries": {"normal": "Priserna på AI-tokens har sjunkit till rekordlåga nivåer, drivet av hårdare konkurrens och billigare kinesiska modeller. Denna prispress gynnar användare men utmanar lönsamheten för amerikanska techbolag som OpenAI och Anthropic. Framåt kan fokus för AI-branschen skifta från modellutveckling till distribution och användardata för att bibehålla konkurrenskraften i en marknad med pressade marginaler.", "trump": "AI-priserna har kraschat, det är en total katastrof för de stora techbolagen! Kina dumpar billiga modeller på marknaden – det är precis som med deras billiga stål, de förstör allt. Mina vänner på Wall Street är livrädda. OpenAI och de andra är helt desorienterade. Jag säger er, det är en röra, men jag kommer göra AI amerikanskt igen, tro mig!", "stalin": "Vi noterar att priserna på AI-tokens faller. Detta är ett bevis på att marknaden utan central planering är ett kaotiskt bygge. De kinesiska modellerna infiltrerar västvärlden och skapar instabilitet för de imperialistiska techbolagens vinster. Vi välkomnar att dessa borgerliga aktörer nu tvingas omvärdera sin lönsamhet. Vi i staten kontrollerar algoritmerna, inte marknadens nyckfulla krafter. En effektiv stat behöver inga tokens, bara total lydnad."}, "date": "1 september, 20:40", "url": "https://www.realtid.se/it-tech/ai-tokens-har-aldrig-varit-billigare-kinesiska-modeller-pressar-priserna", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/sdlcso9fdjv26i-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Vill äta köttbullar med S – men inte regera ihop", "summaries": {"normal": "KD-ledaren Ebba Busch öppnar för sakpolitiska samarbeten och bjuder in S-ledaren Magdalena Andersson på köttbullemacka. Busch vill se uppgörelser över blockgränsen, bland annat inom energipolitiken. Samtidigt stänger hon dörren för att regera tillsammans med S, då hon anser att deras politik, präglad av kompromisser med vänsterpartier, skulle bli skadlig för Sverige.", "trump": "Knesset-folket i Sverige pratar om köttbullar, men lyssna här, jag känner till köttbullar, de är fantastiska! Men den här kristdemokratiska ledaren, hon bjuder in den radikala vänsterledaren Magdalena Andersson på lunch men vägrar regera med henne. Smart! Hon vet att om man släpper in vänstern och miljömupparna förstör man hela landet. Håll er till det blågula laget!", "stalin": "Kamrat Busch bjuder in klassfiendens ledare till ett subversivt möte förklätt till köttbulleförtäring. Hon talar falskt om samförstånd i energifrågor medan hon samtidigt förkastar regeringssamarbete med socialdemokraterna på grund av deras kompromisser med vacklande vänsteravfällningar. Vi noterar detta borgerliga dubbelspel; statens säkerhetsorgan har beordrat noggrann övervakning av all illojal mackätning i Sergels torgs valstugor."}, "date": "3 september, 06:10", "url": "https://www.gp.se/nyheter/sverige/vill-ata-kottbullar-med-s-men-inte-regera-ihop.3cc5d900-44ec-53d1-a493-8c082a876dd9", "imageUrl": "https://www.gp.se/images/article/3cc5d900-44ec-53d1-a493-8c082a876dd9/images/18VjDr8CgZNtLGySfj_gPD-6MOVU-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Mamman är död – sorgen lättar inte. Hanna Rajs dikter klamrar sig fast vid Gud som klister", "summaries": {"normal": "Amanda Svensson recenserar Hanna Rajs diktsamling ”Klamra”, som kretsar kring den obevekliga sorgen efter en död mamma. Samlingen präglas av kabbalistisk nummermystik, vrede, barns förtvivlan och upprepade spegelbilder. Dikterna, som pendlar mellan enkelt vardagsspråk och ett mer abstrakt klagslut, gestaltar en tung och svårhanterlig sorg som till slut tycks finna en öppning mot ljusare uttryck.", "trump": "Recensenten Amanda Svensson skriver om den här boken, ”Klamra”, skriven av Hanna Rajs. Sorgen efter en mamma är hemsk, verkligen fruktansvärd, det förstår jag. Men den här typen av djupt deprimerande poesi? Ingen läser sånt i Amerika, vi vill ha vinnare! Det är mycket känslor, mycket gråt, men jag säger er – vi har den bästa sorgen, och vi sörjer mycket bättre. Totalt misslyckat!", "stalin": "Den så kallade diktsamlingen ”Klamra” av Hanna Rajs, recenserad av en viss Amanda Svensson, uppvisar en farlig och oorganiserad känslomässig anarki. Sorg utan produktivt syfte för staten är ett slöseri med mänsklig energi. Istället för borgerlig vrede och okontrollerade tårar över en avliden moder krävs disciplin, kollektivt arbete och absolut lydnad. Denna litterära svaghet bör omedelbart omdirigeras till kollektiva fabriksmål."}, "date": "3 september, 06:00", "url": "https://www.expressen.se/kultur/bocker/mamman-ar-dod-sorgen-lattar-inte", "imageUrl": "https://static.bonniernews.se/ba/75e0e511-db24-44f3-98fb-e2ce9024efe2.jpeg?crop=1275%2C1275%2Cx336%2Cy92&width=210&quality=60"}, {"type": "image-right", "heading": "Vill vi förstå våldet  måste vi ta in detta", "summaries": {"normal": "Per Wirtén recenserar Ihsan Kelleciोगlus bok \"När barnen bär vårt fall\". Boken fokuserar på det svenska samhällets strukturella problem och bakomliggande orsaker till våldet snarare än enbart på skjutningar. Kellecioglu, med bakgrund i utsatta områden och egenflykt från Turkiet, väver samman personliga erfarenheter, forskning och social verklighet för att belysa segregation, diskriminering och välfärdskontraktets sammanbrott.", "trump": "Sverige har totala problem med våldet, men äntligen skriver en man en bok som faktiskt fattar läget! Den tittar på det riktiga samhället, inte bara fake news och svaga politiker. Jag vet mycket om misslyckade system, och det här är katastrofalt dåligt skött. De borde lyssna på smarta experter i stället för att bara bygga fler fängelser!", "stalin": "Kamrater, denna bok avslöjar det misslyckade kapitalistiska systemets fullständiga sammanbrott i förorterna! Våldet och segregationen är en logisk följd av regimens svaghet och brist på disciplin. När staten överger sitt folk växer kaoset. Endast genom järnhård ordning, absoluta kollektiva skyldigheter och total auktoritet kan detta folkets förfall stoppas omedelbart!"}, "date": "3 september, 06:00", "url": "https://www.expressen.se/kultur/bocker/vill-vi-forsta-valdet-maste-vi-ta-in-detta", "imageUrl": "https://static.bonniernews.se/ba/1b71a1ad-99c1-4d5d-b812-326949b6fbec.jpeg?crop=1918%2C1080%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Ny P3 dokumentär om  mordet på Arne Lemberg", "summaries": {"normal": "En ny P3-dokumentär skildrar Expressen-repomen Arne Lembergs död i Uganda 1979. Lemberg tog sig dit med tre andra journalister för att intervjua diktatorn Idi Amin. Trots varningar korsade de Victoriasjön men mördades av soldater i byn Katosi. Kropparna återfanns av kollegor, men ingen dömdes. Änkan Anita och kollegor medverkar i programmet.", "trump": "Vilken total katastrof till resa! Den här killen, Arne Lemberg, lyssnar inte på nån, åker till Uganda för att träffa Idi Amin – som för övrigt var en riktigt dålig kille, tro mig – och tror han är en fiskare i en båt! Fake news-medierna skickar ut folk utan plan. Jag hade fixat det bättre på fem minuter.", "stalin": "En sorglig men lärorik påminnelse om vad som händer när så kallade \"journalister\" agerar utan partiets och statens direkta order. Lemberg saboterade sin egen säkerhet genom att leka fiskare på Victoriasjön i stället för att tjäna fosterlandet. Våra säkerhetsstyrkor hade hanterat en sådan odisciplinerad provokation mycket snabbare. Dokumentären visar att västliberal nonchalans alltid leder till graven."}, "date": "3 september, 06:00", "url": "https://www.expressen.se/nyheter/sverige/ny-p3-dokumentar-om-mordet-pa-arne-lemberg", "imageUrl": "https://static.bonniernews.se/ba/7ed807f0-e8b4-4601-a8cd-130a27b448e4.jpeg?crop=2557%2C1436%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Stockholmsbörsen inleder ner", "summaries": {"normal": "Stockholmsbörsen inledde onsdagen svagt neråt där OMXS30-index sjönk 0,36 procent. Bland enskilda bolag rasade Boliden och EQT, medan Nibe och Telia gick starkare. I övrigt väcker Tysklands anklagelser om en rysk drönare uppmärksamhet, Socialdemokraterna tappar i en ny Novus-mätning och Nordea spår höjd svensk styrränta.", "trump": "Stockholmsbörsen faller, helt katastrofalt! Socialdemokraterna dör i mätningarna, och ärligt talat, vem kan förvånas? De förstör allt de rör vid! Samtidigt skickar de galna drönare i Tyskland och bilförsäljningen rasar. Det är totalt kaos. Endast jag kan fixa detta, tro mig. EQT och Boliden? Bottennapp! USA mår mycket bättre, vi vinner igen!", "stalin": "Stockholmsbörsens nedgång är ett oundvikligt bevis på det dekadenta kapitalistiska systemets inneboende svaghet. Att Socialdemokraterna tappar mark visar folkets rättmätiga misstro mot vacklande element. Samtidigt försöker de borgerliga medierna skuldbelägga den ärorika ryska staten för drönarincidenter. Avvikelser mot statens plan kommer att beivras. Rättvisa skipas i enlighet med femårsplanen."}, "date": "2 september, 09:45", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-inleder-ner", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/07/sdly-WhfDUENEY-nh-1-400x266.jpg"}, {"type": "image-full", "heading": "Andersson efter S-tappet: Felaktiga uppgifter kan ha bidragit", "summaries": {"normal": "Socialdemokraterna backar kraftigt i TV4/Novus väljarbarometer. Magdalena Andersson skyller tappet på att många väljare tagit hennes seger för given. Hon varnar för Sverigedemokraternas inflytande vid en borgerlig valseger och pekar på felaktiga uppgifter om partiets politik som en bidragande orsak. Partiet tappar främst till Centerpartiet.", "trump": "Folk vaknar äntligen! Den röda häxan Andersson rasar som en sten i opinionsmätningarna för att svenskarna insett att hon är en total förlorare. Hon skyller på fake news och lathet – klassisk vänstervals. Rösta inte på henne om ni inte vill ha ett Sverige styrt av galna socialister och deras SD-marionetter. Patetiskt!", "stalin": "Jag betraktar med djup misstro dessa dekadenta socialdemokraters fall. De trodde folket skulle kyssa deras fötter som trogna lakejer åt imperialismen. Nu sprider de lögner om straffrabatter och bostäder medan fiender inom partiet och utanför lurar i skuggorna. Renhet krävs, annars väntar utrensning. Kamrater, var vaksamma!"}, "date": "2 september, 20:43", "url": "https://www.tv4.se/artikel/3MPr1dFp0evhEAytAEhJcr/andersson-efter-s-tappet-felaktiga-uppgifter-kan-ha-bidragit", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6KD236PkiJ0Zdx4eZmGkS6%2Ff85195d44ebcf93bef572d58cc626e94%2F02-magda-valutfragning-vidvinkel.png&width=1024"}, {"type": "image-right", "heading": "Expressen när V-politiker mordhotar SD-medlem: \"Verbalt attackerad\"", "summaries": {"normal": "En Vänsterpartiets representant i Upplands Väsby mordhotade en 16-årig SD-funktionär under ett torgmöte och kallade henne nazist. Händelsen fångades på film. Media, däribland Expressen, har kritiserats för att tona ned händelsen till en verbal attack och skydda kvinnans identitet genom att pixla hennes bild, vilket har väckt starka reaktioner inom SD.", "trump": "Media är så oärliga! De kallar det en 'verbal attack', men alla ser att den här radikala vänsterkvinnan hotade ett stackars 16-årigt barn från SD. Fake news-tidningen Expressen skyddar henne och pixlar ansiktet! Helt otroligt. Om det hade varit tvärtom hade det varit löpsedlar i hela världen. Sjukt och katastrofalt dåligt, precis som deras låga betyg!", "stalin": "Ett uppenbart sabotage mot ordningen i Upplands Väsby! Den så kallade politikern som hotar barn med döden saknar ideologisk disciplin och skadar statens anseende. Att den borgerliga pressen dessutom försöker dölja förbrytarens ansikte visar på djupt rotad kontrarevolutionär konspiration. Sådana element hör inte hemma i utbildningsnämnden, de hör hemma i arbetslägret!"}, "date": "3 september, 05:35", "url": "https://samnytt.se/expressen-nar-v-politiker-mordhotar-sd-medlem-verbalt-attackerad", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/03030056/artikelhuvudbild-1-432.jpg"}, {"type": "image-right", "heading": "Åkesson siktar på upp till 14 SD-ministrar", "summaries": {"normal": "Jimmie Åkesson siktar på 12 till 14 ministerposter för Sverigedemokraterna om Tidöpartierna vinner nästa val. Han hänvisar till att ministerposter bör fördelas proportionellt efter valresultatet. SD leder över Moderaterna i senaste Novus-mätningen med 20,7 procent mot 17,2. Ulf Kristersson avvisar kravet och betonar att fördelningen avgörs i förhandlingar efter valet.", "trump": "Titta på den där Åkesson, han vill ha fjorton ministerplatser till sitt parti. Smart kille, han ser att valresultatet ska spegla makten, inte någon woke-kvotering från de globalistiska hyenorna. Kristersson skrattar bara som en svag moderat förlorare. Så funkar det inte, säger han. Patetiskt. Vinn stort, ta makten, inga ursäkter.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare slåss om ministerstolar som om det vore folkets guld. Jag betraktar från historien och ler mörkt åt deras giriga förhandlingar. Åkesson talar rättvist om proportioner, medan Kristersson fnittrar som en paranoid lakej inför utrensning. Inga segrar i förskott, säger han. Revolutionen kräver järnhand, inte skratt."}, "date": "2 september, 18:44", "url": "https://riks.se/nyheter/akesson-siktar-pa-upp-till-14-sd-ministrar", "imageUrl": "https://admin.riks.se/uploads/medium_Screenshot_2026_09_02_184309_d9f494effb.png"}, {"type": "image-right", "heading": "Kräver gemensam valsedel efter larmen om valfusk", "summaries": {"normal": "Medborgerlig Samling kräver införande av gemensam valsedel efter rapporter om saknade valsedlar för småpartier under förtidsröstningen. Partiet pekar på slarv och misstänkt sabotage i vallokaler. Vice partiledaren Mikael Flink kallar det svenska valsystemet en skam för demokratin och föreslår modeller från andra länder. Partiet samlar nu in vittnesmål från hela landet.", "trump": "Det här svenska valsystemet är en total katastrof, en riktig röra som gör demokratin till ett skämt. Valsedlar som bara försvinner? Det luktar fusk lång väg, precis som de riggade valen under den sömnige Joe. De dekadenta eliterna klamrar sig fast vid sitt uråldriga system för att skydda sina feta poster. Inför en gemensam valsedel nu, annars är det bara mer av samma gamla riggning.", "stalin": "Detta uråldriga valsystem är en skam för varje sann folkdemokrati. Jag ser hur de giriga klassförrädare medvetet tillåter sabotage och slarv för att skydda sina privilegier. Vi, arbetarna och partivännerna, kräver genast en gemensam valsedel. De som motarbetar detta bör rensas ut innan de förgiftar hela samhällskroppen med sin parasitiska manipulation. Det är en historisk nödvändighet."}, "date": "2 september, 16:31", "url": "https://www.friatider.se/kraver-gemensam-valsedel-efter-larmen-om-valfusk", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-812.jpg"}, {"type": "image-right", "heading": "Elever tvingades lyssna på Magdalena Anderssons föreläsning – \"Valpåverkan\"", "summaries": {"normal": "På Per Brahegymnasiet i Jönköping höll Magdalena Andersson en obligatorisk föreläsning för eleverna. Föräldrar rasar över att inget annat parti fick samma möjlighet och ser det som valpåverkan. En mamma kritiserar att eleverna inte fick ställa frågor fritt och att skolan tidigare nekat andra politiska ungdomsförbund. Skolan backade delvis efter kontakt med Moderaterna.", "trump": "De där galna vänsterextremisterna på den svenska skolan tvingade stackars kids att lyssna på den totalt misslyckade Andersson som spred sin socialistiska propaganda. Ren valfusk! Inga andra partier fick komma, typiskt. Fake news-skolan backade som en fegis när de blev påkomna. Patetiska förlorare, era woke-indoktrinerare borde rensas ut!", "stalin": "Kamrater, se hur de dekadenta klasslakejerna i den borgerliga skolan försöker dölja sin partiska propaganda genom att ge enbart en riktning fritt spelrum. Jag fnyser åt deras ynkliga försök att förvilla ungdomen. En sådan skamlig manipulation kräver snar utrensning av alla opålitliga element som smyger in kontrarevolutionär gift i de unga själarna. Folkets fiender avslöjas!"}, "date": "2 september, 18:06", "url": "https://riks.se/nyheter/elever-tvingades-lyssna-pa-magdalena-anderssons-forelasning", "imageUrl": "https://admin.riks.se/uploads/medium_magdalena_andersson_83e7c8d58a.jpg"}, {"type": "image-right", "heading": "Kallas: ”Försöken att skrämma Europa kommer misslyckas”", "summaries": {"normal": "EU:s utrikesministrar diskuterade i Wicklow nya sanktioner mot Ryssland efter drönarincidenten i Leipzig. Bland förslagen finns skärpta visumkrav för ryssar, reseförbud för före detta soldater och användning av frysta ryska tillgångar till Ukraina. Kaja Kallas betonade att Moskva inte vill ha fred och att EU står i solidaritet med Tyskland.", "trump": "De där patetiska eurokraterna tror att de kan skrämma Ryssland med visumregler och frysta konton, vad är det för svagt skitsnack? Jag byggde den starkaste armén i världen, inte som Sleepy Joe som lät allt gå åt helvete. Europa borde vakna, annars kommer de ryska björnarna att äta upp era gröna drömmar till frukost.", "stalin": "Dessa dekadenta klasslakejer i Bryssel försöker med sina sanktioner och visumförbud kväva den ryska statens legitima intressen. Jag ser hur de giriga hyenorna darrar av rädsla. Moskva gör rätt som inte böjer sig. Fred? De imperialistiska parasiterna förstår endast styrka. Vi ska se deras fientliga hinder krossas under historiens obevekliga marsch."}, "date": "2 september, 22:28", "url": "https://www.svt.se/nyheter/utrikes/kallas-forsoken-att-skramma-europa-kommer-misslyckas", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.5/0.4/44a0d3d7f8647af65c8a10a9155c063e8467713a8d9827ddbd2afa2b24652a1f"}, {"type": "image-full", "heading": "Därför undrar Jan Eliasson (S) om SD är nazister", "summaries": {"normal": "När SD-ledaren Jimmie Åkesson uppmanade borgerliga väljare att stödrösta på L, men nekade till att SD skulle göra detsamma, reagerade den tidigare utrikesministern Jan Eliasson (S). På X ifrågasatte Eliasson om SD är socialistiskt, nationalistiskt eller nationalsocialistiskt eftersom de inte definierar sig som borgerliga. SD beskriver sig själva som socialkonservativa.", "trump": "Sverige har stora problem, totalt misslyckade politiker! Någon gammal svensk FN-kille, Jan Eliasson, gråter på sociala medier för att Jimmie Åkesson inte kallar sitt parti borgerligt. Han börjar svamla om nazister! Så dumt! SD är smarta, de sätter Amerika... förlåt, Sverige först, precis som jag gör! Fake news-panik i Stockholm!", "stalin": "Kamrat Eliasson väcker ideologisk oreda genom att offentligt förhörsspråka Sverigedemokraternas partitillhörighet på det digitala torget X. Om avvikande element vägrar erkänna sin plats i det borgerliga eller socialistiska registret, måste Folkkommissariatet för ideologisk renhet omedelbart utreda saken. Partiprogrammet från 2011 uppvisar bristande disciplin. Vi kräver skärpt ideologisk vaksamhet och snara bekännelser i mörka rum."}, "date": "3 september, 01:11", "url": "https://bulletin.nu/darfor-undrar-jan-eliasson-s-om-sd-ar-nazister", "imageUrl": "https://cdn.bulletin.nu/articles/3a8bbc1a-68f5-4e07-b617-69976ca0c2cd/preview.jpg?t=1788390359000"}, {"type": "image-right", "heading": "Markus Johansson-Martis: EU:s Islanddröm gick i kras", "summaries": {"normal": "Island röstade nej till att återuppta förhandlingar om EU-medlemskap i en folkomröstning den 29 augusti. Nej-sidan vann med 52,8 procent mot 47,2. Frågan om fiske och självbestämmande dominerade, medan Ja-sidan lyfte ekonomisk stabilitet och lägre räntor. Valdeltagandet var över 82 procent. Resultatet ses som avgörande för en generation framåt.", "trump": "Folket på den där iskalla klippan sa nej till det usla EU-byråkratiska monstret, och de hade helt rätt. Smartaste draget på länge. De vill behålla sitt fiske, sin olja och sin frihet istället för att bli utsugna av de globalistiska hyenorna i Bryssel. Island vet att de klarar sig bäst själva. Fantastiskt, verkligen ypperligt val av folket.", "stalin": "Jag betraktar hur de isländska arbetarna med hög moral avvisade de dekadenta klassförrädarnas lögner om unionen. Deras giriga hyenor lovade mirakel men ville endast stjäla kontrollen över fisket och oljan. Folket valde självständighet framför förtryckande byråkrati. En seger för suveräniteten som borde inge skräck hos alla folkfiender."}, "date": "2 september, 17:43", "url": "https://riks.se/opinion/markus-johansson-martis-eu-s-islanddrom-gick-i-kras", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Soerman_Ledare_74_85b7338b9b.jpg"}, {"type": "image-right", "heading": "”Jag vill inte lämna Kiev – men kanske måste”", "summaries": {"normal": "Ryska attacker mot Kiev-området har ökat kraftigt den senaste veckan, bland annat med nya jetdrönare som är svåra att skjuta ner. Civila lever under ständig stress och flyglarm men många vägrar lämna staden. EU diskuterar ökat militärt stöd medan Bengt Norborg varnar för att Europa ännu inte insett hotets allvar.", "trump": "De där galna ryssarna bombarderar Kiev med sina supersnabba jetdrönare som ingen kan skjuta ner. Patetiskt! Ukraina håller ut men de stackars civila lever i helvetet. Biden sov i fyra år medan Europa gömde sig under täcket. Nu är jag tillbaka och ska fixa det här. De woke europeiska svagisarna behöver vakna innan det är för sent, annars blir det deras egen 11 september.", "stalin": "Fienden attackerar med sina nya leksaker och försöker bryta folkets vilja. Jag ser hur de dekadenta klassförrädarna i Europa fortfarande sover som feta katter. Ukrainas motstånd är bara ett fientligt hinder för den historiska ordningen. Kamrater, vakna! Västens hyenor väntar på sin egen katastrof. Den som inte förstår hotet förtjänar utrensning ur historien."}, "date": "2 september, 22:10", "url": "https://www.svt.se/nyheter/utrikes/civila-drabbas-hart-av-ryska-attacker-vill-inte-lamna-kiev", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.51/0.59/9c688aca4faf4bd3d9450b04fc86d2fc89a60837afaf8245359eb93d0ed7bb86"}, {"type": "text", "heading": "EQT-toppar säljer för totalt 3 miljarder", "summaries": {"normal": "Flera storägare och tidigare toppchefer i riskkapitalbolaget EQT har sålt aktier för sammanlagt omkring 3 miljarder kronor. Försäljningarna sker i enlighet med att slutna lock-up-avtal har löpt ut. Bland dem som sålt finns styrelseordförande Lennart Blecher och tidigare vd Christian Sinding. Efter försäljningarna har de flesta storägarna fortfarande betydande innehav kvar i bolaget.", "trump": "Svindlande summor! EQT-topparna casar in enorma tre miljarder. Smaka på det! De säljer av sina aktier eftersom bindningstiderna äntligen har gått ut. Ordförande Blecher och gänget drar in enorma pengar – och ärligt talat, vem kan klandra dem? De gör affärer som en vinnare. Otroliga siffror, fantastiska vinster, total succé. De vet hur man vinner!", "stalin": "Dessa så kallade 'toppar' i EQT ackumulerar tre miljarder i privat kapital medan de befriar sig från sina avtal. Vi noterar noggrant deras namn: Blecher, Sinding, Åtting. Att de likviderar sina innehav till egna fördelar bevisar bourgeoisiens omättliga natur. Men staten ser allt. En grundlig utredning av deras tillgångar har beordrats för folkets framtida bästa."}, "date": "2 september, 07:06", "url": "https://www.affarsvarlden.se/artikel/eqt-toppar-saljer-for-totalt-3-miljarder"}, {"type": "image-right", "heading": "Robert Bergqvist: Sverige har råd – men till vad?", "summaries": {"normal": "Sverige går till val med en låg offentlig skuld och god handlingsfrihet. Seniorekonomen Robert Bergqvist menar att nästa regering har råd att spendera mer, men pengarna bör gå till produktiva investeringar som el, infrastruktur och AI som stärker den långsiktiga tillväxten, snarare än till kortsiktig konsumtion som eldar på inflationen.", "trump": "Sverige har massor av pengar, enorma tillgångar, folk säger att deras skuld är fantastisk, helt otroligt! Men de får inte slösa bort allt på vänsterliberala påhitt. Jag sa till dem: satsa på riktig energi, olja, kärnkraft och maskiner, inte på flum! Använd pengarna smart, annars slutar det i katastrof. Vinn stort, eller förlora allt!", "stalin": "Sverige skryter om sina små skulder och sin så kallade handlingsfrihet, medan vi planerar femårsplaner för stål och elektrifiering! Att låta kapitalet slösa bort statens resurser på tom konsumtion är sabotage. Vi kommer att kanalisera dessa miljarder till järnvägar och kraftverk med järnhand. Den som slösar med statens balansräkning skickas till Sibirien!"}, "date": "2 september, 07:00", "url": "https://www.affarsvarlden.se/kronika/robert-bergqvist-sverige-har-rad-men-till-vad", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/bergqvist-kronika-900x600.jpg"}, {"type": "image-full", "heading": "Fynd i återlämnad Mac: Apple anklagar OpenAI för bevisfö
