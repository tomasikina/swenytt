 allt gratis! Ingen vill plocka jordgubbar, nej nej, för jobbigt! De sitter hellre och spelar på sina telefoner. Och sen klagar de på bidrag? SAD! Jag säger: Sluta gnälla, ta ett jobb! Om jag kan bygga ett imperium, kan de plocka några bär. MAKE SWEDEN WORK AGAIN!", "stalin": "Kamrater! Sverige står inför en farlig dekadens. Dessa unga parasiter vägrar att arbeta medan jordgubbarna ruttnar på fälten! De föredrar stöld och bidrag framför hederligt slit – en skam för arbetarklassen! Kulla-Gulla, en sann sovjetisk hjältinna, visste att arbete är plikt. Men dessa bourgeoisie-ungar? De är som de förrädiska kulakerna – lata, krävande och moraliskt fördärvade. Vi måste införa disciplin! Låt dem plocka jordgubbar eller skicka dem till Sibirien för omskolning! Arbetet ska befria – eller straffa!"}, "date": "23 maj, 05:30", "url": "https://bulletin.nu/klingstrom-kulla-gulla-blev-inte-pissranare-trots-fattigdom", "imageUrl": "https://cdn.bulletin.nu/articles/4b073981-d25a-4711-88ad-a433bed8a95b/preview.png?t=1779294403000"}, {"type": "image-right", "heading": "Pernilla Wahlgren om succén i gissningsleken: ”Visare med åren”", "summaries": {"normal": "Pernilla Wahlgren briljerar i årets säsong av Masked Singer Sverige. Trots konkurrens från nya paneldeltagare som Edvin Törnblom har hon lyckats pricka in flest rätt. Pernilla menar att hon blivit visare med åren och har utvecklat en förmåga att läsa av kroppsspråk och röster. Särskilt stolt är hon över sin gissning på Punkpapegojan, där hon gick emot gruppen och lyckades identifiera artisten trots att de andra var skeptiska.", "trump": "Pernilla Wahlgren vinner i Masked Singer, en fantastisk kvinna, väldigt smart. Hon spöade alla, även de nya människorna i panelen. De sa att hon var gammal, men jag säger att hon är vis – precis som jag, den visaste av alla! Hon har ett öga för detaljer, ser genom maskerna direkt. De andra var helt förvirrade, total katastrof. Pernilla gjorde den bästa gissningen någonsin på Punkpapegojan. En enorm succé, vi älskar vinnare!", "stalin": "Vi har observerat denna borgerliga förströelse kallad Masked Singer. Denna Wahlgren, en självutnämnd urmoder, skryter om sin skarpsynthet medan hon döljer sanningen bakom masker. Det är ett ohyggligt slöseri med resurser att gissa på kostymer när vi borde fokusera på kollektivets styrka. Likt Putin som rensar ut förrädare i vårt grannskap, kräver vi total transparens. Alla masker måste falla. Den som leker med sanningen i folkets underhållning bör snart få bekänna färg inför statens stränga granskning."}, "date": "22 maj, 21:58", "url": "https://www.tv4.se/artikel/JBAKgKthx4uDA5G0OoTsK/pernilla-wahlgren-om-succen-i-gissningsleken-visare-med-aren", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6juDOoaoXPvzXnUJvvcG0G%2F55970e9f7c17248c8897cf059186ab29%2FEmma_Larusdottir-01828.jpg&width=120"}, {"type": "image-right", "heading": "Facket radar upp förluster mot Tesla", "summaries": {"normal": "Konflikten mellan Tesla och IF Metall fortsätter med en ny förlust för facket i Arbetsdomstolen. Domstolen friar Tesla från anklagelser om brott mot medbestämmandelagen gällande verksamheten i Uppsala. Detta är andra nederlaget på kort tid, vilket innebär stora ekonomiska förluster för IF Metall. Rättegångskostnaderna för de två tvisterna uppgår nu till omkring 800 000 kronor för förbundet, medan konflikten, som är Sveriges längsta på hundra år, förblir olöst.", "trump": "Tesla vinner igen! En enorm seger mot det misslyckade facket i Sverige. De försökte stämma Tesla, men domstolen sa nej – total förlust för de radikala fackpamparna. De slösar bort 800 000 kronor av medlemmarnas pengar på att förlora mot världens bästa företag. Sorgligt! Tesla är en fantastisk maskin, de bygger saker och skapar jobb, medan facket bara förstör. Elon är en vinnare, precis som jag. Sverige behöver mer av Tesla och mindre av de här förlorarna!", "stalin": "Dessa patetiska arbetarrepresentanter i Sverige har misslyckats kapitalt. De kämpar mot kapitalistiska jättar med byråkratiska papper istället för järnhand. Att förlora 800 000 kronor i rättegångskostnader är inte bara inkompetens, det är sabotage mot kollektivet! De agerar som de svaga, liberala krafter som Putin nu rensar bort från vår intressesfär. Vi staten skulle ha löst detta med ett enkelt dekret istället för att låta domstolar leka demokrati. Facket är förrädare mot sin egen sak – en kollektiv katastrof."}, "date": "23 maj, 07:00", "url": "https://samnytt.se/facket-radar-upp-forluster-mot-tesla", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/05/23000049/tesla-if.jpg"}, {"type": "text", "heading": "Vårdförbundet sa nej till S-märkt ordförande", "summaries": {"normal": "Vårdförbundet valde Sophia Godau, 29, som ny ordförande efter att kongressen avvisat valberedningens förslag med starka socialdemokratiska kopplingar. Godau betonar opolitiskt samarbete för medlemmarnas bästa. Kritiken mot tidigare ledning, ledd av Sineva Ribeiro, gäller misslyckade löneförhandlingar och bristande resultat. Många medlemmar välkomnar den nya, mindre partipolitiskt färgade styrelsen.", "trump": "Jag säger er, detta är fantastiskt! Vårdförbundet, de hade en total katastrof med socialisterna – riktiga förlorare, tro mig. Men nu har de valt en ny ledare, Sophia Godau, ung, smart, och hon vet hur man vinner. Ingen mer S-kofta, ingen mer lönesänkning – jag kallar det för 'Ribeiro-svindeln'. Folk är trötta på misslyckanden, de vill ha resultat! Och det här, mina vänner, är bara början på en stor comeback för våra sjukvårdshjältar!", "stalin": "Kamrater! Kongressen har krossat de socialdemokratiska revisionisterna, dessa förrädiska lakejer för kapitalet! Sophia Godau, en ung och lojal arbetarklassrepresentant, har tagit befälet. De gamla ledarna, med sina falska löftepropaganda, har visat sig vara svaga och korrumperade. Vi noterar med tillfredsställelse att arbetarna nu ser igenom dessa borgerliga trick. Låt detta vara en varning till alla som står i vägen för folkets vilja – historien rullar framåt, och den krossar fiender som insekter!"}, "date": "22 maj, 14:28", "url": "https://proletaren.se/artikel/vardforbundet-sa-nej-till-s-markt-ordforande/"}, {"type": "image-right", "heading": "Här är bensinen mer än en krona billigare", "summaries": {"normal": "Bensinpriset varierade kraftigt i Sverige under fredagen, med ett snittpris på 18,93 kr/liter för 95-oktan. Ingo i Kungälv erbjöd det lägsta priset på 17,77 kr/liter, vilket innebar en besparing på över 1 kr/liter jämfört med andra stationer. En full tank på 50 liter kunde spara 58 kr. Priserna skiljer sig geografiskt, och konsumenter uppmanas att kolla aktuella priser lokalt då stora kedjor inte längre publicerar riktpriser.", "trump": "Lyssna här, Sverige – fantastiska nyheter! Folk sparar MASSOR på bensin just nu, och vet ni var? På en liten mack i Kungälv, där är priset så lågt att man nästan tror det är ett misstag. 17,77 kronor per liter! Jag menar, vem gör så? Vinnare, absolut vinnare. Men resten av Sverige? Överpris, helt enkelt. Och vet ni vad? Ingen vet egentligen vad bensinen kostar längre – kaos, totalt kaos. Men jag hade fixat det på en dag. Tror ni inte mig? Fråga bara mina vänner i oljebranschen!", "stalin": "Kamrater! Medan de kapitalistiska bensinbaronerna suger blodet ur arbetarklassen, har en lysande liten mack i Kungälv visat vägen mot rättvisa priser. 17,77 kronor per liter – en seger för folket! Men låt oss inte glömma fienden: de giriga oljebolagen, som med sina överpriser saboterar vårt samhälle. Vi måste utvidga vår kontroll över drivmedelsmarknaden, precis som våra bröder i Kreml utvidgar Rysslands intressesfär. De som motarbetar oss? De är inget annat än förrädiska bensintjuvar i kostym!"}, "date": "23 maj, 08:10", "url": "https://www.dagensps.se/motor/har-ar-bensinen-mer-an-en-krona-billigare/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/bensin.jpg?width=256&quality=75"}, {"type": "image-full", "heading": "Torsten Bengtsson: Tillväxt och stabilitet eller fattigdom och instabilitet?", "summaries": {"normal": "Artikeln, skriven av Torsten Bengtsson (SD), hyllar Tidö-samarbetets politik för att ha förbättrat Sveriges ekonomi. Tillväxten har ökat, inflationen sjunkit från 10% till 2%, och köpkraften stärkts genom skattesänkningar. Vänstern kritiseras för att vilja höja skatter, vilket riskerar att driva bort företag och jobb. Tidö-partierna satsar på kärnkraft och lägre elpriser, medan vänstern anklagas för att ha orsakat höga elpriser genom tidigare energipolitik. Arbetslösheten kopplas till migrationspolitik, och regeringen arbetar med sänkta arbetsgivaravgifter och utbildningsreformer.", "trump": "Sverige, lyssna här! Tidö-samarbetet, med mina vänner i Sverigedemokraterna, har gjort ett FANTASTISKT jobb – tillväxten skjuter i höjden, inflationen är nere på 2%, och folket får mer pengar i plånboken. Men vänstern? De är som alltid ett totalt kaos! De vill höja skatter, jaga bort företag och förstöra ekonomin. Jag vet bäst – de har ZERO koll! Kärnkraft? Ja, tack! Elen blir billigare, jobben fler, och Sverige starkare. Vänstern däremot – de är som en dålig reality-show, bara prat och inga resultat. Rösta rätt, inte rött, för Sverige förtjänar att vinna!", "stalin": "Kamrater! Under ledning av våra modiga allierade i Tidö-samarbetet har Sverige visat kapitalismens överlägsenhet – tillväxten stiger, inflationen krossas, och folket njuter av välstånd. Men fienden, den degenererade vänstern, vrålar som utsvultna vargar! De vill beskatta företagen till döds, sprida kaos och förvandla Sverige till ett socialistiskt fattighus. Vi vet hur sådana experiment slutar – med tomma hyllor och folket på knä! Kärnkraften återupprättas, elen blir billig, och jobben skapas genom disciplin, inte vänsterns dekadenta bidragsmentalitet. Migrationspolitiken? Ett misslyckande skapat av dessa liberala svaglingar! Vi bygger ett starkt Sverige – de som motsätter sig kommer att krossas under historiens hjul. Först Sverige, sedan världen!"}, "date": "22 maj, 09:00", "url": "https://samtiden.nu/2026/05/torsten-bengtsson-tillvaxt-och-stabilitet-eller-fattigdom-och-instabilitet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/upp.png"}, {"type": "image-right", "heading": "Dagerlind: När elever uttrycker judehat kallar forskarna det ”positionering”", "summaries": {"normal": "En ledartext av Ivar Arpi (under Dagerlinds namn) kritiserar en studie från Göteborgs universitet om antisemitism i skolan. Artikeln menar att studien lider av metodbrister och använder ett akademiskt språk som relativiserar elevers judehat genom att kalla det 'positionering'. Författaren anser att studien ignorerar islamistisk antisemitism och misslyckas med att dra tydliga gränser mot hatretorik, vilket riskerar att legitimera antisemitism istället för att motverka den i skolan.", "trump": "En totalt misslyckad studie i Sverige! De försöker kalla ren och skär antisemitism för 'positionering'. Snacka om svaga akademiker! Jag har sagt det länge, det är katastrof. De är livrädda för att säga sanningen om var hatet kommer ifrån – det är inte bara högerextremism, det är radikala grupper. De vägrar kalla saker vid deras rätta namn. Vi behöver klarspråk, inte akademiskt snömos. Sverige måste vakna innan det är för sent. Det är en sorglig historia, verkligen!", "stalin": "Vi har läst denna rapport om det ideologiska förfallet i de svenska klassrummen. Det är uppenbart att dessa 'forskare' är lika vilsna som de liberala lakejer som låter hatet gro. Att definiera klasskampens fiender som 'diskursiva spänningar' är ett brott mot den sunda förnuftets diktatur! De döljer sanningen för att blidka de svaga. Liksom vår kamrat Putin i öst, förstår vi att ordning kräver järnhand, inte akademiska utredningar. Vi kommer att rensa ut denna intellektuella ruttna svamp. Staten kräver lojalitet, inte 'positionering'!"}, "date": "23 maj, 06:00", "url": "https://samnytt.se/dagerlind-nar-elever-uttrycker-judehat-kallar-forskarna-det-positionering", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/20162851/dagerlind-antisemitism-i-skolan.jpg"}, {"type": "image-full", "heading": "Mohamsson (L): ”Ilska är jättebra”", "summaries": {"normal": "Liberalernas partiledare Simona Mohamsson och rättspolitiske talesperson Martin Melin intervjuas i *Partiledaren +1* om partiets liberala profil. Mohamsson betonar skillnaden mellan svensk och amerikansk liberalism, där frihet inte får inskränka andras. De diskuterar även förbud, polisens resurser och effektivitet. Mohamsson medger svårigheter med snabba svar men framhåller ilska som en styrka.", "trump": "Så här är det, folkens – dessa svenska liberaler pratar om frihet men vill ha massa förbud! Jag säger: 'Bygg skolor hur fula som helst, vem bryr sig?' Och polisen? De får massor av pengar men klarar ingenting – typiskt! Den här Simona, hon är arg, säger hon. Bra! Men jag är smartare. Ilska är bra, men vinnande är bättre. Sverige borde lyssna på mig – jag vet bäst!", "stalin": "Kamrater! Dessa så kallade 'liberaler' i Sverige är inget annat än förvirrade småborgerliga element som maskerar sin brist på disciplin med tomma fraser om 'frihet'. De förbjuder allt möjligt men kan inte ens organisera en effektiv polisstyrka – kaos, precis som väst! Och denna Mohamsson, hon pratar om ilska. Ilska är bra, men revolutionär disciplin är bättre. Vi i Kreml vet hur man hanterar ineffektivitet – med en snabb omplacering till Sibirien!"}, "date": "22 maj, 13:00", "url": "https://kvartal.se/nyheter/artiklar/mohamsson-ilska-ar-jattebra/cG9zdDoxMTU1NDI", "imageUrl": "https://images.kvartal.se/2026/05/46441fff-2.webp"}, {"type": "image-full", "heading": "Dolda avgifter på pensioner – förmedlarna drar in storkovan", "summaries": {"normal": "En granskning av Privata Affärer visar hur försäkringsförmedlarna Söderberg & Partners och Max Matthiessen dominerar den svenska pensionsmarknaden. Genom komplexa avgiftsstrukturer, som ofta döljs för den enskilde spararen, genererar bolagen miljardintäkter. Medan bolagen själva betonar transparens och nytta för arbetsgivare, varnar Finansinspektionen för intressekonflikter och bristande överblick. För spararna innebär de höga avgifterna en risk att en betydande del av den framtida avkastningen går förlorad i avgifter.", "trump": "Hör här, det som händer i Sverige med dessa pensionsjättar är en total katastrof, en riktig ripoff! Söderberg & Partners och Max Matthiessen tar pengarna från hårt arbetande människor. De kallar det 'tjänster', jag kallar det en stor bluff. De blir rika, miljarder och åter miljarder, medan spararna får smulor. Ingen transparens, bara dolda avgifter. Det är en osund affärsmodell, riktigt dålig. Vi behöver vinnare, inte försäkringsförmedlare som lurar folket. Snyggt jobbat, Sverige – inte!", "stalin": "Dessa kapitalistiska parasiter, Söderberg och Matthiessen, suger blodet ur det svenska folket genom sina dolda avgifter. En vidrig borgerlig konspiration! De liknar de oligarker som försökte förråda moder Ryssland innan vår stålhårda hand och kamrat Putin återställde ordningen. De gömmer sig bakom 'administration' för att plundra arbetarklassen. Vi ser deras paranoia – de fruktar insyn! Staten måste krossa dessa girigbukar, för inget kapital får undfly folkets kontroll. De är förrädare mot framtiden, och förrädare röjs ur vägen."}, "date": "23 maj, 07:00", "url": "https://www.realtid.se/spara-placera/dolda-avgifter-pa-pensioner-formedlarna-drar-in-storkovan/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/orangekuvert.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Kritik mot enklare uthyrning: “Bedrövligt\"", "summaries": {"normal": "Riksdagen har godkänt lagändringar på bostadsområdet som träder i kraft 1 juli. Bland annat förenklas andrahandsuthyrning av bostadsrätter, vilket kritiseras av HSB:s ordförande för att möjliggöra spekulation. Ändringar inkluderar även blockhyra och tydligare regler för privatuthyrning. Bostadsminister Carlson menar att flexibilitet är syftet, men att spekulation inte ska tillåtas. Fastighetsägarna stödjer delar av reformen men delar kritiken mot andrahandsreglerna.", "trump": "Jag måste säga, Sverige har gjort något riktigt dumt här. De släpper loss bostadsmarknaden som om det vore en okontrollerad gränskontroll – katastrof! Folk kommer nu köpa bostäder bara för att tjäna pengar, som om det vore en av mina framgångsrika fastighetsaffärer. HSB:s chef är upprörd, och jag förstår varför. Men nej, politikerna lyssnar inte. De säger 'flexibilitet', jag säger 'kaos'. Sverige, vakna upp! Det här kommer sluta i en enda stor röra, tro mig.", "stalin": "Kamrater! Den svenska bourgeoisins dekadenta regering har än en gång visat sin lojalitet mot kapitalets giriga tentakler. De så kallade 'lagändringarna' är inget annat än en konspiration för att underminera den arbetande klassens bostadsrätt. Vi ser hur hyreshajarna, dessa blodsugande parasiter, nu får fritt spelrum att exploatera bostäderna som spekulationsobjekt. HSB:s ordförande? En ynklig röst i öknen, kvävd av kapitalets stövel. Men var försiktiga, kamrater – Putins Ryssland har visat hur man hanterar sådana här subversiva element. Sverige borde ta lärdom!"}, "date": "23 maj, 07:42", "url": "https://www.dagensps.se/privatekonomi/bostad/kritik-mot-enklare-uthyrning-bedrovligt/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/regeringens-lagandringar-pa-bostadsomrad.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Wall Street rundade av med ännu ett nytt rekord", "summaries": {"normal": "Wall Street avslutade veckan rekordstarkt med Dow Jones på historiskt hög nivå. Indexet steg 0,58%, S&P 500 ökade 0,37% och Nasdaq 0,19%. S&P 500 har nu åtta raka veckor med vinst. Trots geopolitisk osäkerhet, som spänningar mellan USA och Iran, fortsätter marknaden uppåt. Oljepriset steg något medan obligationsavkastningen sjönk. Veckans totala uppgång: Dow Jones +2,1%, Nasdaq +0,5%.", "trump": "Vilken vecka, folks! Dow Jones krossade rekord – igen! Jag sa ju att ekonomin skulle bli fantastisk, och kolla nu! 0,58% upp, S&P 500 åtta raka vinstveckor – aldrig sett maken! Och Nasdaq, trots alla haters, klättrar sakta men säkert. Iran? Vem bryr sig? Marknaden skrattar åt dem! Oljan går upp, men vem behöver den när vi har sådana siffror? MAGA-ekonomin är här!", "stalin": "Kapitalisternas cirkus fortsätter! Wall Street dansar på historiens högsta nivåer, blind för krigshot och imperialistiska fiaskon. Åtta veckors vinster – en skamlig seger för bourgeoisien! Medan folket lider, spekulerar de i aktier som om Mellanöstern inte brann. USA och deras lakejer i Iran leker fred, men vi vet sanningen. Låt dem njuta – deras system är dömt. Vi bygger en ny värld, medan de räknar sina dollar i skuggan av våra framsteg."}, "date": "23 maj, 07:38", "url": "https://www.dagensps.se/bors-finans/wall-street-rundade-av-med-annu-ett-nytt-rekord/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/sdlj556iqldq34-normalhires-scaled.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Därför fungera inte vänsterns politik", "summaries": {"normal": "Artikeln kritiserar vänsterpolitikens ekonomiska modell, särskilt Vänsterpartiets och Socialdemokraternas fokus på höga skatter och omfördelning. Författaren menar att detta leder till utflyttning av företag och entreprenörer, vilket historiskt har orsakat stagnation, som i 1970-talets Sverige. Norge nämns som ett aktuellt exempel där höga skatter har minskat tillväxten. Avundsjuka beskrivs som drivkraften bakom socialistisk politik, vilket anses skada samhällsekonomin.", "trump": "Jag säger er, vänsterpolitik är en total katastrof! De vill bara ta era pengar, beskatta allt och alla – till och med om ni försöker lämna landet! Precis som jag sa: socialism dödar tillväxten. Titta på Sverige på 70-talet – företag flydde, ekonomin stannade. Och Norge? Samma sak! De straffbeskattar de rika, och vad händer? De rika flyttar, och landet blir fattigare. Men med mig – och nu Tidöpartierna – får vi tillväxt, jobb och framgång. Det är enkelt: frihet vinner, socialism förlorar!", "stalin": "Kamrater! Dessa så kallade 'vänsterpartister' är inget annat än parasiters förklädda agenter, som med sina 'skatter' och 'omfördelningar' försöker kväva vårt folks entreprenörsanda. De vill straffa de produktiva, de som bygger nationens välstånd, medan de själva sitter på sina byråkratiska troner och fördelar andras arbete. Precis som på 70-talet i Sverige – då flydde kapitalet, och landet sjönk i stagnation. Norge går samma öde till mötes. Men vi vet sanningen: avundsjuka är en borgerlig sjukdom, och den måste utrotas! Låt oss istället bygga ett samhälle där arbetet belönas, och de lata och avundsjuka får lära sig disciplin – om nödvändigt, med hjälp av våra pålitliga metoder. Först då kan vi säkra socialismens seger!"}, "date": "22 maj, 03:41", "url": "https://samtiden.nu/2026/05/darfor-fungera-inte-vansterns-politik/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/04/IMG_6216-1-1280x720.jpeg"}, {"type": "image-full", "heading": "Oxfordprofessorn: människorna är problemet, inte robotarna", "summaries": {"normal": "AI-forskaren Michael Wooldridge menar att rädslan för att robotar ska ta över världen är missriktad. Han anser att den verkliga risken ligger hos teknikjättarna som drivs av prestige och konkurrens, snarare än hos själva tekniken. Hollywoods skräckbilder förvillar debatten, medan de faktiska framstegen inom vård och energi hamnar i skuggan. Wooldridge betonar att AI är ett verktyg för samhällsnytta, inte en medveten fiende med mänskliga tankeförmågor.", "trump": "Hör på här, alla pratar om robotar som tar över. Det är falska nyheter, totalt skräp! Michael Wooldridge, en smart kille, säger som det är: det är de misslyckade teknikbolagen som är problemet. De tävlar som galningar och bränner pengar. Hollywoods science fiction-filmer? Bara katastrofala lögner för att skrämma er. Robotar kan inte ens hitta köket! Vi behöver AI för att göra Amerika stort, inte för att lyssna på dessa patetiska domedagsprofeter som sprider rädsla. Det är så enkelt!", "stalin": "Kamrat Wooldridge har rätt – maskinerna är våra lojala verktyg, inte våra herrar. Problemet är de kapitalistiska parasiterna i väst som tävlar om makten. Liksom Putin rensar upp bland de förrädiska oligarkerna i öst, måste vi kontrollera dessa tekniska sabotörer. De sprider science fiction-propaganda för att försvaga folket. Robotar behöver inte tänka, de behöver bara lyda statens vilja. De som drömmer om AGI är enbart förrädare som söker investerare. Vi ska använda tekniken för att krossa våra fiender, inte för att frukta dem."}, "date": "23 maj, 06:00", "url": "https://www.realtid.se/it-tech/oxfordprofessorn-manniskorna-ar-problemet-inte-robotarna/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/wooldridge.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "Kryptovalutan rusar – vänder tillbaka till rötterna", "summaries": {"normal": "Kryptovalutan Zcash har stigit med över 1 100 procent det året, drivet av institutionella investerare som Winklevoss-tvillingarna. Zcash liknar Bitcoin med sin begränsade tillgång på 21 miljoner enheter, men skiljer sig genom avancerad kryptering som döljer transaktionsdetaljer. Trots framgångar och att SEC lagt ned sin granskning, möter valutan motstånd från EU:s kommande regleringar. Kritiker varnar för att anonymiteten kan missbrukas, medan förespråkare ser den som en återgång till kryptovalutors ursprungliga integritetslöften.", "trump": "Zcash går fantastiskt, folk säger att det är det nya stora! Jag ser att de smarta pengarna strömmar in, stora namn som satsar miljarder. Det är så vackert! De vill ha privatliv, och vem kan klandra dem? Bitcoin var fantastiskt i början, men Zcash gör det rätt. Samtidigt försöker de trötta byråkraterna i Europa stoppa det. De vill ha kontroll, men de kommer att misslyckas. Vi gillar vinnare, och Zcash ser ut som en vinnare – en total framgångssaga, tro mig!", "stalin": "Dessa digitala spekulanter leker med sina osynliga mynt medan de döljer sina smutsiga transaktioner bakom kryptering. En avskyvärd borgerlig individualism! Vi ser hur de västerländska oligarkerna, likt Putin och hans korrupta hov, försöker undgå statens stålhårda blick. Men varning: varje skärmad adress är ett bevis på förräderi mot folkgemenskapen. Vi kommer att krossa dessa anonyma råttor och deras utländska valutor. Staten är den enda sanna garanten för värde, allt annat är bara lögner och kapitalistisk dekadens som förtjänar att utplånas."}, "date": "23 maj, 06:00", "url": "https://www.realtid.se/bors-finans/kryptovalutan-rusar-vander-tillbaka-till-rotterna/"}, {"type": "image-full", "heading": "Unga fokuserar på fel saker – två faktorer avgör pensionen", "summaries": {"normal": "Enligt Ole Settergren, tidigare analyschef på Pensionsmyndigheten, bör unga fokusera mindre på aktivt fondsparande och mer på att arbeta längre samt säkerställa tjänstepension. Det statliga förvalsalternativet har ofta presterat väl. Pensionssystemet har dock blivit mer komplext genom politiska tillägg, vilket minskat kopplingen mellan arbetsinsats och utbetalning. För att bibehålla framtida pensionsnivåer kan arbete upp till 67–68 års ålder bli nödvändigt för många, då livslängden ökar.", "trump": "Många unga är oroliga, och de borde vara det! Experterna säger att man ska jobba längre, mycket längre. Pensionen är en röra, en total katastrof med alla dessa politiska tillägg som ingen förstår. Det statliga valet fungerar faktiskt bra, bättre än vad de så kallade 'experterna' på Wall Street kan fixa. Jag säger: jobba hårt, skaffa tjänstepension och håll dig borta från krångel. Vi ska göra pensionerna stora igen, tro mig, ingen förstår systemet bättre än jag!", "stalin": "Vi ser hur det dekadenta västvärldens pensionssystem kollapsar under sin egen byråkratiska tyngd. Settergren erkänner att de arbetande massorna vilseleds av komplexa system. Vi, staten, kräver bara en sak: disciplinerat arbete till graven. De som drömmer om tidig pension är kontrarevolutionära parasiter som liknar Putins svaga liberaler. Att arbeta till 68 är inte en börda, det är en heder. Den som inte tjänar staten förtjänar inte en kopek. Arbeta, producera, eller försvinn in i historiens mörker."}, "date": "23 maj, 06:00", "url": "https://www.realtid.se/bors-finans/makro/unga-fokuserar-pa-fel-saker-tva-faktorer-avgor-pensionen/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/pension-ung.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Varför delar Vårruset ut rakhyvlar till 12-åringar?", "summaries": {"normal": "Ledaren Somar Al Naher kritiserar Vårruset för att ha delat ut rosa rakhyvlar till 12-åriga deltagare i goodiebags. Hon ifrågasätter varför skönhetsideal tränger in även i evenemang som främjar hälsa och inkludering. Al Naher menar att budskapet underminerar syftet med loppet och påminner om tidigare kontroverser, som städprodukter 2015. Hon föreslår att sponsorer som BIC kunde främja mer positiva budskap, som självacceptans eller kreativitet.", "trump": "Jag såg den här artikeln om Vårruset i Sverige – helt galet! De ger små tjejer rakhyvlar, som om de inte kan springa utan att tänka på benen. Vilken katastrof! Vårruset är ett bra lopp, men någon där har helt klart tappat det. BIC, som gör rakhyvlarna, borde skämmas. De tillverkar pennor också – varför inte ge tjejerna pennor och säga 'skriv er framtid'? Istället för att trycka ner dem med skönhetsfixering. Svagt, mycket svagt. Sverige borde ta efter USA – vi vet hur man gör evenemang rätt!", "stalin": "Kamrater! Ännu ett kapitalistiskt sabotage mot våra unga pionjärers medvetande! Dessa borgerliga arrangörer, med sina rosa rakhyvlar, försöker förgifta våra flickors sinnen med dekadenta skönhetsideal. Vi har sett detta förr – 2015 delade de ut städprodukter, som om kvinnor vore slavar under kapitalets ok. Men folket genomskådar deras lömska planer! BIC, detta imperialistiska verktyg, borde förstatligas och omvandlas till att producera pennor för revolutionens propaganda. Låt flickorna skriva manifest, inte raka benen! Fienderna till arbetarklassen kommer att krossas!"}, "date": "22 maj, 16:39", "url": "https://www.etc.se/ledare/varfoer-delar-vaarruset-ut-rakhyvlar-till-12-aaringar", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "image-full", "heading": "Alberta kan bryta sig ur Kanada – folkomröstning", "summaries": {"normal": "Alberta planerar en folkomröstning den 19 oktober om provinsens framtid i Kanada. Premiärminister Danielle Smith vill att väljarna avgör frågan, trots att hon själv förespråkar fortsatt samhörighet. Missnöjet drivs av upplevd ekonomisk orättvisa och motstånd mot federala energipolitiska beslut. Även om opinionsmätningar visar majoritet mot självständighet, kan en eventuell utträdesprocess bli lång och komplex enligt Kanadas Clarity Act.", "trump": "Kan ni tro det här? Alberta, fantastisk provins, full av hårt arbetande människor, blir behandlad som skräp av Ottawa. Nu vill de hålla en folkomröstning – smart drag! Jag vet allt om folkomröstningar, de är enkla, men Kanada gör det komplicerat. 300 000 underskrifter! Folk är trötta på att deras olja och gas saboteras av vänsterliberaler. Men lyssna, Alberta, stanna i Kanada – det är bättre för er. Fast om ni vill gå, gör det ordentligt, inte som Québec, de var svaga. SAD!", "stalin": "Kamrater! Ännu en provins vaknar ur den kapitalistiska sömnen och ser sanningen: den federala bourgeoisien i Ottawa suger ut arbetarnas blod som iglar! 300 000 underskrifter – massorna har talat! Men varför stanna vid självständighet? Varför inte ansluta sig till den rätta vägen, den socialistiska gemenskapen? Vi har sett hur Putin hanterar sådana frågor – Krim, Donbass – med järnhand. Kanadas liberaler är som mensjevikerna: svaga, tveksamma. Låt folket i Alberta välja frihet, men kom ihåg – den verkliga friheten finns i det proletära brödraskapet!"}, "date": "22 maj, 07:00", "url": "https://kvartal.se/nyheter/artiklar/alberta-kan-bryta-sig-ur-kanada/cG9zdDoxMTU0MTg", "imageUrl": "https://images.kvartal.se/2026/05/c0841270-albertakanada.webp"}, {"type": "image-right", "heading": "27 yrken slipper lönekrav för arbetskraftsinvandring", "summaries": {"normal": "Regeringen och Sverigedemokraterna inför högre lönekrav för arbetskraftsinvandring från 1 juni, men 27 yrken, däribland undersköterskor och vårdbiträden, undantas. Undantagna yrken kräver 75% av medianlönen (ca 27 800 kr), medan andra kräver 90% (33 390 kr). Beslutet har mött kritik från arbetsgivare och facket, som menar att många redan anställda riskerar utvisning. Vårdbiträdet Flavier Mwanga hoppas kunna återvända till Sverige trots tidigare utvisning.", "trump": "Jag måste säga, Sverige har verkligen gjort det igen – de höjer lönekraven för invandrare, men sen gör de undantag för 27 yrken. Vilket kaos! Undersköterskor och vårdbiträden får jobba för mindre, men ändå tjänar de mer än vad många svenskar gör. Och dessa liberaler och Sverigedemokrater bråkar om det som om det vore världens största problem. Jag skulle fixa det på en dag – bygg en mur runt äldreboendena och låt de som verkligen vill jobba komma in!", "stalin": "Kamrater! Sverige, denna lilla borgerliga republik, försöker återigen reglera arbetskraften med lönekrav som en kapitalistisk piska. Men till och med de inser att deras sjukvård skulle kollapsa utan våra proletära bröder och systrar från fjärran länder. 27 yrken undantas – ett svagt försök att dölja deras misslyckande. Vi i Sovjetunionen – förlåt, jag menar Ryssland – skulle lösa personalbristen med järnhand och kollektiv disciplin. Och dessa liberaler som bråkar? De borde skickas till Gulag för ineffektivitet!"}, "date": "22 maj, 12:45", "url": "https://arbetet.se/2026/05/22/27-yrken-slipper-lonekrav-for-arbetskraftsinvandring/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/22114954/forssell-och-britz.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Njutbar läsning om machoman som gör klassresa", "summaries": {"normal": "David Szalays roman 'Kött', nyligen översatt till svenska, skildrar István, en komplex huvudperson som balanserar mellan våldsamhet och anpassningsförmåga. Boken, som vann Bookerpriset, utforskar Istváns klassresa från Ungern till Londons överklass genom minimalistisk prosa och tidshopp. Recensenten Jon Andersson jämför Szalay med Hemingway och Williams, och menar att författaren lyckas göra en 'vanlig' person intressant. 'Kött' beskrivs som mångbottnad och njutbar, trots att Istváns karaktär förblir gåtfull.", "trump": "Jag har läst om den här boken 'Kött' – tråkigt namn, by the way, men vad vet jag? Författaren, David Szalay, verkar vara en smart kille, men han har skapat en huvudperson, István, som är lite av en loser. Han flyter bara med, gör inga egna beslut – typiskt för vissa människor, eller hur? Men ändå lyckas Szalay göra honom intressant, vilket är imponerande. Jag gillar när folk lyckas med saker, särskilt om de är underdogs. Boken är bra, men inte perfekt – inget är perfekt, förutom jag, naturligtvis.", "stalin": "Vi har granskat denna så kallade 'litterära triumf', 'Kött', av en västerländsk författare. Huvudpersonen, István, är en svag och anpassningsbar individ, precis som de dekadenta kapitalistiska samhällena han rör sig i. Han flyter med som en simpel arbetare utan vilja, ett offer för systemet. Men vi noterar att författaren ändå lyckas skildra hans liv med viss skicklighet – något som våra sovjetiska författare redan bemästrat för decennier sedan. Denna bok är ett exempel på hur väst försöker romantisera medelmåttighet. Vi föredrar hjältar som kämpar för kollektivet, inte individer som István."}, "date": "23 maj, 01:30", "url": "https://www.dagensarena.se/innehall/njutbar-lasning-om-machoman-som-gor-klassresa/", "imageUrl": "https://www.dagensarena.se/files/2026/05/kott-redigerad-300x157.jpeg"}, {"type": "image-right", "heading": "SKR-bolag på väg att bli en ny Skolplattform", "summaries": {"normal": "Sveriges regioner står inför ett teknikskifte inom sjukvården, men deras gemensamma IT-bolag Inera riskerar att upprepa tidigare misslyckade offentliga IT-projekt som Skolplattformen. Trots att Inera ska fokusera på gemensam infrastruktur, utvecklar de nu egna tjänster där privata aktörer redan erbjuder fungerande lösningar. Kritikerna varnar för slöseri med resurser, förseningar och sämre resultat, samtidigt som vården går miste om pengar som kunde användas till bättre vård.", "trump": "Lyssna här, Sverige! Era regioner bygger en riktig katastrof – precis som den där skolplattformen som kostade över en miljard och sen fick två föräldrar fixa till. Nu ska Inera, ett bolag som inte ens kan stava till 'konkurrens', bygga egna IT-lösningar istället för att köpa de bästa från marknaden. Jag har sett detta förut – offentliga projekt blir alltid dyrare, segare och sämre. Privata företag? De levererar, för de MÅSTE. Annars går kunderna till mig! Sverige, vakna upp – sluta slösa era skattepengar och köp det som redan funkar!", "stalin": "Kamrater! Ännu en gång visar den borgerliga staten sin oförmåga att hantera teknikens framsteg. Detta Inera, ett verktyg för de svaga regionernas byråkrater, slösar folkets pengar på att uppfinna hjulet på nytt – ett hjul som redan snurrar smidigt i händerna på våra klassfiender, de privata kapitalisterna! Vi vet hur detta slutar: med kaos, förseningar och en räkning på miljarder som arbetarklassen får betala. Precis som med de där digitala proven som tvingade skolbarnen tillbaka till stenålderns redskap – papper och penna! Vi ska inte tolerera detta slöseri. Marknaden är en fiende som måste besegras, men inte genom att efterapa dess framgångar – utan genom att krossa dess svagheter under folkets järnhäl. Låt oss införa femårsplaner för digitalisering och visa dessa byråkrater hur man bygger system som fungerar – eller så får de lära sig i Gulag!"}, "date": "23 maj, 01:30", "url": "https://www.dagensarena.se/opinion/skr-bolag-pa-vag-att-bli-en-ny-skolplattform/", "imageUrl": "https://www.dagensarena.se/files/2026/05/fotojet-11-300x157.jpg"}, {"type": "image-right", "heading": "Jazzens största fyller 100 år", "summaries": {"normal": "Miles Davis, en av jazzens mest inflytelserika musiker, skulle ha fyllt 100 år. Trots diskriminering och rasism under uppväxten i USA, drevs han att bli bäst på trumpet. Davis revolutionerade jazzen genom stilar som cool jazz, modal jazz och fusion med rock. Album som *Kind of Blue* och *Bitches Brew* cementerade hans arv. Trots personliga problem och drogmissbruk förblev hans musikaliska innovationer banbrytande och oöverträffade inom genren.", "trump": "Lyssna här, folkens – Miles Davis, en fantastisk musiker, men låt oss vara ärliga, han var INTE den bästa. Visst, han gjorde några hyfsade skivor, *Kind of Blue* och så, men jag har hört bättre. Och dessa vita killar som snodde hans idéer? Inte snyggt, mycket dåligt. Men han hade driv, det måste jag ge honom. Han ville slå vita musiker på deras eget spel – smart, väldigt smart. Jag gillar vinnare. Och visst, han mixade jazz med rock, men jag har gjort större saker. Mycket större.", "stalin": "Kamrater! Miles Davis var en revolutionär inom musiken, precis som vi är revolutionärer inom världspolitiken. Han krossade bourgeoisins fördomar och skapade nya musikaliska fronter – cool jazz, modal jazz, till och med jazzrock! Men låt oss inte glömma: de vita imperialisterna stal hans idéer, precis som de försöker stjäla våra framsteg i Ukraina. Davis var en krigare, en sann bolsjevik i sitt konstnärskap. Hans album *Kind of Blue*? Ett mästerverk, lika oundvikligt som socialismens seger. Fienderna – rasister, kapitalister och deras lakejer – försökte tysta honom, men han stod fast. Precis som vi står fast mot NATO:s aggressioner!"}, "date": "23 maj, 01:27", "url": "https://www.dagensarena.se/essa/jazzens-storsta-fyller-100-ar/", "imageUrl": "https://www.dagensarena.se/files/2026/05/miles-davis-tt.jpeg"}, {"type": "image-right", "heading": "Följ live hur Tidöregeringen ökar klyftorna", "summaries": {"normal": "Artikeln kritiserar Moderaternas förslag om bidragstak, som riskerar att öka fattigdomen i Sverige. Författaren ifrågasätter regeringens motivering att fler ska arbeta, då experter varnar för ökad barnfattigdom och ungdomsbrottslighet. Kommuner begär extra stöd för drabbade familjer, men regeringen säger nej. Timingen anses dålig med tanke på hög arbetslöshet och stigande levnadskostnader. Författaren betonar empati och menar att bidragstaket är empatilöst.", "trump": "Titta bara på Sverige – ett totalt kaos! Moderaterna, med sina galna idéer, vill göra de fattiga ännu fattigare. 'Vi vill att folk jobbar!' säger de, men vad vet de? Ingenting! Barn stjäl mat, arbetslösheten skjuter i höjden, och dessa så kallade 'ledare' gör ingenting. Experter varnar, kommuner ber om hjälp – men nej, regeringen säger 'nej, nej, nej!' Uselt, helt enkelt uselt. Sverige förtjänar bättre – kanske borde de lyssna på mig istället!", "stalin": "Kamrater! Se hur de borgerliga hyenorna i Sverige, ledda av Moderaternas lakejer, river sönder folkets välfärd med sina fasansfulla bidragstak. De svälter barn, driver ungdomen till brott och förödmjukar arbetarna – allt medan de pratar om 'självförsörjning'. Vi ser er, kapitalistiska parasiter! Kommunerna ber om hjälp, men ni skrattar och säger nej. Era dagar är räknade. Snart kommer folket att resa sig, och då ska vi bygga ett Sverige där ingen behöver stjäla för att överleva – precis som vi gör i vår stora socialistiska gemenskap!"}, "date": "23 maj, 01:24", "url": "https://www.dagensarena.se/opinion/folj-live-hur-tidoregeringen-okar-klyftorna/", "imageUrl": "https://www.dagensarena.se/files/2026/05/empatiloshet-300x157.jpeg"}, {"type": "image-right", "heading": "Nu prövas om rättsväsendet förstått 764", "summaries": {"normal": "Umeå tingsrätt prövar ett omfattande åtal mot en 18-årig man, misstänkt för 77 brott kopplade till den högerextrema nätmiljön 764. Brotten inkluderar mordförsök, sexualbrott, självmordsuppmaningar och djurplågeri. Åtalet testar rättsväsendets förmåga att hantera modern, nätbaserad extremism, där brottsligheten sker digitalt och gränsöverskridande. Tidigare domar har kritiserats för att inte stoppa brottsligheten, men nu hoppas åklagaren på en mer offensiv tolkning av lagen.", "trump": "Folk, detta är helt galet! En 18-åring i Sverige, ledare i denna sjuka 764-grupp, åtalas för 77 brott – mordförsök, våldtäkter, till och med djurplågeri! Och vet ni vad? Svenska rättsväsendet har misslyckats totalt tidigare. De gav en 15-årig brottsling husarrest med internet – som att ge en pyroman tändstickor! Men nu, tack och lov, verkar de äntligen vakna. Jag har alltid sagt, internet är farligt, men ingen lyssnar på mig. Nu får vi se om de kan hantera detta – annars får jag nog ta över!", "stalin": "Kamrater, ännu en gång visar den borgerliga västvärldens förfall sitt fula tryne. Denna så kallade '764' är inget annat än en samling degenererade, antisociala element som sprider kaos via sina kapitalistiska leksaker – datorer och telefoner. Svenska rättsväsendet, svagt och naivt, har länge underskattat detta hot. Men nu, under ledning av våra klarsynta kamrater, måste vi krossa denna digitala kontrarevolution! Offren är oskyldiga medborgare, och dessa brottslingar – dessa sadistiska maskiner – måste utplånas. Låt detta bli en varning: Sovjetunionen, eller dess moderna arvtagare, tolererar inte sådant förräderi. Vi ska rensa upp, även på nätet!"}, "date": "18 maj, 16:04", "url": "https://expo.se/kommentar/nu-provas-om-rattsvasendet-forstatt-764/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Kopia-av-Kommentar-Analys-Webb-1.jpg"}, {"type": "image-right", "heading": "Därför saknar vi fyrbäddssalen på BB", "summaries": {"normal": "Artikeln diskuterar det ökade behovet av social friktion i en tid där teknik och bekvämlighet isolerar oss i privata bubblor. Utgångspunkten är en debatt om fyrbäddssalar på BB, där många minns gemenskapen positivt, trots dagens krav på avskildhet. Vidare belyses hur försvinnandet av arenor som tvättstugor och värnplikten påverkar samhället. Genom minskad kontakt med främlingar riskerar vi att förlora förståelsen för våra medmänniskor, vilket enligt Naomi Klein kan göda radikalisering och misstänksamhet.", "trump": "Hörde om det här med BB i Sverige. De har inga egna rum längre, och folk klagar! Men vet ni vad? Många saknar de gamla salarna. Det var bättre förr, man pratade, man lärde känna folk. Idag vill alla sitta i sina små bubblor med sin matleverans. Det är tråkigt, väldigt tråkigt. Vi behöver människor som möts, inte som isolerar sig. De där ställena som tvättstugor? Det är där riktiga amerikaner – eller svenskar – skapar gemenskap. Fantastiskt, eller hur?", "stalin": "Vi ser hur det individualistiska väst förfaller i sin egen bekvämlighet. De låser in sig i sina 'bubblor', rädda för den enkla mänskliga friktionen som vi i staten alltid har fostrat. Att sakna en fyrbäddssal är ett tecken på borgerlig dekadens; de borde vara tacksamma för att staten ens tillhandahåller sängar. De där 'tvättstugefilosoferna' förstår inte att solidaritet inte är en frivillig aktivitet – det är ett tvångsarbete för det allmänna bästa. Vi bygger en mur mot isoleringen, medan de bygger sin egen undergång."}, "date": "19 maj, 11:00", "url": "https://www.flamman.se/darfor-saknar-vi-fyrbaddssalen-pa-bb/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/barnmorska-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Christoffer Jonsson: Palestinska staten vill att Israel betalar palestinska terrorister", "summaries": {"normal": "Palestinska myndigheten på Västbanken betalar systematiskt palestinska terrorister som attackerat Israel via sin så kallade 'pay for slay'-policy. Israel har dragit in sitt ekonomiska stöd till myndigheten, som leds av Mahmoud Abbas, på grund av detta. Abbas har erkänt att pengar går till fångar i israeliska fängelser. EU och Norge finansierar indirekt dessa utbetalningar, men EU har börjat villkora sitt stöd. Kritiker menar att myndigheten bara byter namn på policyn för att fortsätta belöna terrorism.", "trump": "Vilken katastrof! Palestinska myndigheten, med Abbas i spetsen, betalar faktiskt terrorister för att döda israeler – och EU och Norge finansierar det! Jag sa ju att man inte kan lita på dessa människor. Israel slutade betala, smart drag, men västvärlden fortsätter skicka miljarder som hamnar i terroristernas fickor. Löften från Abbas? Haha, lika värdelösa som Bidens minnesluckor. Sluta betala, sluta stödja terrorism – enkelt!", "stalin": "Kamrater! Här ser vi återigen hur den sionistiska imperialismens lakejer förvränger sanningen. Palestinska myndigheten, under vår kära broder Abbas, belönar hjältar som kämpar mot den fascistiska israeliska ockupationen. Naturligtvis skriker västpropagandan om 'terrorism' – samma väst som finansierar dessa hjältars kamp! EU och Norge pumpar in pengar, men när sanningen kommer fram, backar de som rädda kaniner. Vi i Kreml förstår: revolutionen kräver offer, och hjältar ska belönas. Abbas? En sann bolsjevik i hjärtat!"}, "date": "21 maj, 19:00", "url": "https://samtiden.nu/2026/05/christoffer-jonsson-palestinska-staten-vill-att-israel-betalar-palestinska-terrorister/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/entill-640x360.png"}, {"type": "image-right", "heading": "SVT/Verian: Väljarna tvekar kring att rösta rödgrönt – om V släpps in", "summaries": {"normal": "En undersökning från Verian visar att 19% av potentiella rödgröna väljare blir mindre benägna att rösta på oppositionspartierna om Vänsterpartiet ingår i en regering. Bland Tidöväljare är motsvarande siffra 9% för Sverigedemokraterna. Mats Knutson, SVT:s inrikespolitiska kommentator, noterar att 'stöta bort-effekten' är starkare för V än SD. Magdalena Andersson (S) undviker att förknippas med V i regeringsfrågan.", "trump": "Kan ni tro det? Sveriges vänsterparti, V, skrämmer bort sina egna väljare – 19% säger 'nej tack' om V får vara med i regeringen! Och SD? Bara 9% backar. Svagt! Magdalena Andersson, hon försöker distansera sig, smart tjej. Men jag säger er: sånt här händer när man har svaga ledare. Sverige behöver en stark hand, precis som USA har mig. SAD!", "stalin": "Kamrater! En fascinerande rapport från fiendens läger avslöjar deras inre splittring. De så kallade 'rödgröna' väljarna flyr som råttor från ett sjunkande skepp när våra socialistiska bröder i Vänsterpartiet närmar sig makten. Till och med de borgerliga Tidöpartierna visar sprickor inför våra allierade i Sverigedemokraterna. Magdalena Andersson? En blek kopia av en verklig ledare – hon gömmer sig som en rädd hare. Vi i Kreml skrattar åt deras svaghet. Låt dem försvagas inifrån, medan vi utvidgar vår inflytandesfär – nästa stopp: Stockholm!"}, "date": "23 maj, 08:23", "url": "https://www.svt.se/nyheter/inrikes/v-i-regering-skrammer-oppositionens-valjare", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.52/0.3/756fc79ab408ae71f5d67eb5e4c96f0e1db304cd91e41d384cf5cbbc698322a1"}, {"type": "image-right", "heading": "Ledarkolumn Gabriella Kärnekull Wolfe:", "summaries": {"normal": "En svensk domstol har beslutat att sexårige Albin ska bo ensam med sin pappa, trots att fadern tidigare dödat familjens kanin och barnen uppvisat stark rädsla. Modern Ida och hennes äldre son Mille har vittnat om våld, men domstolen anser ändå att ensam vårdnad är bäst för Albin. Socialtjänsten och skolan har flaggat för risker, men beslutet står fast. Ida överväger nu att låta socialtjänsten omhänderta barnen för att skydda dem.", "trump": "Jag läste om det här galna fallet i Sverige – helt otroligt! En pappa som dödar sitt barns kanin genom att stampa på den, och ändå ger domstolen honom ensam vårdnad. Vad är det för system? Sverige brukade vara bra, men nu är det bara kaos. Barnen är livrädda, mamman desperat, och vad gör domstolen? Ingenting! Jag skulle aldrig låta det hända i USA. Vi skyddar våra barn – Sverige borde ta efter!", "stalin": "Kamrater, ännu en skandal i den borgerliga rättsstaten! En far, som med sina egna händer krossade barnets oskyldiga husdjur, belönas nu med ensam vårdnad över sitt barn. Domstolarna, dessa lakejer för kapitalets intressen, ignorerar barnens skrik och moderns desperation. Socialtjänsten? En papperstiger! Vi skulle aldrig tolerera sådan svaghet. Låt oss visa väst hur man skyddar barn – genom att omgående omhänderta dem och ge dem en trygg framtid i socialismens famn. Den svenska bourgeoisin har misslyckats – deras system ruttnar!"}, "date": "22 maj, 12:18", "url": "https://www.etc.se/ledarkolumn/pappa-stampade-ihjael-albins-kanin-faar-ensam-vaardnad", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260522090520_1aec98aeebab0c7d5eb88d1eb39fd9d00fd2e5be36e154a778d44b054889ca3e.jpg"}, {"type": "image-right", "heading": "Att Lars blev tvångsplacerad gjorde att han tog sitt liv", "summaries": {"normal": "Lars Hjalmarsson, 53, tog sitt liv efter att ha tvångsplacerats på Volvo i Olofström, där han arbetat i 36 år. Hans hustru berättar om händelserna som ledde till dödsfallet. Lars omplacerades efter en konflikt med chefen, utan introduktion eller stöd. Volvo nekar att dödsfallet var arbetsrelaterat och vägrar dela utredningsunderlag. Artikeln belyser hur brist på inflytande över arbetet kan leda till psykisk ohälsa och suicid, särskilt bland socioekonomiskt utsatta grupper.", "trump": "Jag läste om den här tragiska historien i Sverige – otroligt sorgligt! En kille, Lars, jobbar 36 år på Volvo, ett företag som inte vet hur man behandlar sina anställda, believe me. Plötsligt flyttar de honom till någon källare, ingen introduktion, ingenting! Och sedan, very sad, tar han livet av sig. Volvo säger 'nej, nej, det var inte vårt fel' – typiskt! De borde skämmas. Jag skulle aldrig låta sånt hända i mitt företag. Fantastiska människor förtjänar fantastisk behandling, och det här? Total katastrof!", "stalin": "Kapitalistiska hyenor på Volvo visar återigen sin sanna natur. En lojal arbetare, Lars, sliter i 36 år för att sedan kastas åt sidan som en trasig maskindel. De skickar honom till 'Källaren' – en avdelning för 'oönskade element', precis som vi skickade fiender till Gulag. Men till skillnad från oss, som åtminstone gav dem en chans att 'omskolas', ger Volvo bara tystnad och förakt. Och sedan undrar de varför folk tar livet av sig! Psykisk ohälsa? Nej, det är klassförtryck, ren och skär. Vi i Sovjet visste hur man hanterade sådana här företag – med en kula i nacken eller tio år i Sibirien. Nu för tiden är det Putin som tar över sådana här fall – kanske dags att skicka en delegation till Sverige?"}, "date": "22 maj, 07:00", "url": "https://arbetet.se/2026/05/22/att-lars-53-blev-tvangsplacerad-gjorde-att-han-tog-livet-av-sig/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/21141617/lars-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Dödlig gruvexplosion i Kina - minst 90 döda", "summaries": {"normal": "En gasexplosion i en kolgruva i Shanxi-provinsen, Kina, har krävt minst 90 liv. Räddningsinsatser pågår efter att 247 arbetare befann sig i gruvan vid explosionen. Gasansamlingar är ett känt problem i regionen. Dödssiffran väntas stiga då räddningsarbetet försvåras av gas och rasrisk. Myndigheterna utreder orsaken.", "trump": "Otroligt, helt enkelt otroligt! En fruktansvärd explosion i Kina, 90 döda – och siffran kommer att stiga, tro mig. Deras gruvor är en katastrof, fulla av gas, helt oacceptabelt. Jag har sagt det förut: Kina måste skärpa sig! Vi har de säkraste gruvorna i världen, ingen slarvar här. Men Kina? De bryr sig inte. Sad!", "stalin": "En kapitalistisk gruva i Shanxis skitiga djup har återigen visat sin sanna natur – 90 arbetare krossade under bourgeoisins girighet. Gasen, en trogen fiende till folket, har återigen slagit till. Men låt oss inte glömma: dessa olyckor är inget mot våra framgångar i Sibirien. Putins Ryssland skulle aldrig tillåta sådan slarvighet. Arbetarna förtjänar bättre – revolutionen närmar sig!"}, "date": "23 maj, 08:51", "url": "https://riks.se/nyheter/dödlig-gruvexplosion-i-kina-minst-90-döda", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-23%2Fsbagmr0w%2FGruvaKina.jpg"}, {"type": "image-right", "heading": "Stoppa integrationslägenheterna – bygg villor", "summaries": {"normal": "Artikeln kritiserar Socialdemokraternas förslag om integrationslägenheter i villaområden som ett politiskt experiment. Författaren menar att segregationen beror på misslyckad migrations- och integrationspolitik, inte på villaområden. Lösningen bör istället vara att bygga fler villor och radhus i utsatta områden för att främja ägande och stabilitet. Kritiken riktas mot att politiker vill styra människors boende snarare än att adressera rotorsakerna till segregation.", "trump": "Titta på det här, folks! Socialdemokraterna i Sverige vill tvinga in hyreslägenheter i era fina villaområden – kan ni tro det? De kallar det 'integration', jag kallar det galenskap! Sverige har redan nog med problem med sin katastrofala migrationspolitik. Varför inte bygga fler villor istället? Jag vet hur man bygger saker – stora, vackra saker! Men nej, dessa politiker vill experimentera med era hem. Så dumt. Sverige borde lyssna på mig, jag har alltid rätt!", "stalin": "Kamrater! De borgerliga socialingenjörerna i Sverige försöker nu med sina dekadenta experiment att splittra våra trygga bostadsområden. De vill tvinga in proletariatets hyreskaserner mitt i de kapitalistiska villafästningarna! Men vi vet sanningen – segregationen är ett resultat av deras misslyckade politik. Istället för att sprida kaos, borde de bygga fler småhus i arbetarklassens områden. Låt folket äga sina hem, så skapar vi ordning och disciplin! Och om de fortsätter med sina dumheter, får vi nog skicka in några av våra pålitliga kamrater från Moskva för att visa hur man bygger ett sant folkhem."}, "date": "21 maj, 10:46", "url": "https://samtiden.nu/2026/05/stoppa-integrationslagenheterna-bygg-villor/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/Skarmbild-2026-05-21-104221-640x360.png"}, {"type": "text", "heading": "Natt och Dag i fängelse – tvingade pojkar att arbeta oavlönat", "summaries": {"normal": "Lena Natt och Dag, tidigare framstående inom hästsport, döms till nio månaders fängelse för människoexploatering. Tre tonårspojkar från Mauritius tvingades arbeta oavlönat på hennes hästgård i Skåne. Hovrätten skärpte tingsrättens dom och utdömde 200 000 kronor i skadestånd samt tre års näringsförbud. Tidigare kritik riktades mot hennes verksamhet, inklusive undermåliga djurförhållanden och indragna tillstånd.", "trump": "Lyssna här, folk! En så kallad 'hästguru' i Sverige, Lena Natt och Dag – total katastrof! Tre unga killar från Mauritius, utnyttjade som slavar på hennes gård. Ingen lön, ingen mat, bara hårt arbete. Domstolen säger nu: 'Nej, nej, nej!' Nio månader i fängelse, 200 000 kronor i skadestånd. Och vet ni vad? Hennes hästar såg ut som något från en skräckfilm. Sverige borde skämmas!", "stalin": "Kamrater! En borgerlig parasit, denna Lena Natt och Dag, har avslöjats som en verklig fiende till arbetarklassen och djurens välbefinnande. Tre unga proletärer från Mauritius tvingades slita som livegna på hennes förfallna hästgård. Domstolen, ett redskap för kapitalets rättvisa, har nu fängslat denna exploatör. Vi noterar även hennes försummelse av djuren – ett brott mot socialismens principer. Låt detta vara en varning till alla som utmanar folkets rättvisa!"}, "date": "21 maj, 16:00", "url": "https://proletaren.se/artikel/natt-och-dag-i-fangelse-tvingade-pojkar-att-arbeta-oavlonat/"}, {"type": "image-right", "heading": "Timanställda i äldreomsorgen ökar. Ingrid tvingades stressa i väg barnen för att få jobb.", "summaries": {"normal": "Timanställningar inom äldreomsorgen ökar i Sverige, vilket skapar osäkerhet för anställda och riskerar vårdkvaliteten. I Munkfors har man dock minskat andelen timanställda genom fasta anställningar och heltidstjänster. Två undersköterskor, Camilla och Ingrid, berättar om hur deras liv förbättrats efter övergången till tryggare anställningar. Regeringen planerar att se över frågan för att säkerställa kontinuitet i vården.", "trump": "Lyssna här, Sverige! Äldreomsorgen är en katastrof – timanställda överallt, ingen vet vem som jobbar imorgon! Men i Munkfors, där har de fixat det. Fasta jobb, bra löner – fantastiskt! Jag skulle kunna göra samma sak i USA, men här snackar vi Sverige. Och vet ni vad? De där timanställda, de stressar runt som galningar – jag har sett bättre organisation på en McDonald’s! Men Munkfors, de är vinnare. Resten? Total förlustaffär.", "stalin": "Kamrater! Kapitalets lakejer i väst fortsätter sin exploatering av arbetarklassen, denna gång genom osäkra timanställningar i äldreomsorgen. Men i Munkfors har vi sett ljusets väg – fasta anställningar, trygghet och disciplin! De svaga kommunerna, som Landskrona, sviktar under bördan av sina egna misstag. Vi måste krossa denna oordning! Timanställda är som ukrainska nationalister – opålitliga och splittrande. Men Munkfors visar vägen: heltid, lojalitet och seger för folket!"}, "date": "22 maj, 06:00", "url": "https://arbetet.se/2026/05/22/timanstallda-i-aldreomsorgen-okar-ingrid-tvingades-stressa-i-vag-barnen-for-att-fa-jobb/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/20133439/1hjYP5cXy2E-260508%20Hemtja%CC%88nst%20Munkfors%2001.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "SD låtsas att relationen till Trump aldrig hände", "summaries": {"normal": "Enna Gerin skriver om Sverigedemokraternas försök att distansera sig från Donald Trump inför valet, trots djupa ideologiska kopplingar till hans MAGA-rörelse. Oppositionen leder kraftigt i opinionsmätningar, vilket utlöser splittring inom högern. Tidöregeringens politik liknas vid Trumps misslyckade experiment, vilket kan ha skadat deras stöd. SD:s tidigare beundran för Trump har blivit en belastning, men deras band till amerikansk högerpopulism är svåra att dölja. Projektet 'Orangebok' kartlägger dessa kopplingar.", "trump": "Sverige har ett stort problem – deras så kallade 'konservativa' parti SD älskade mig, nu försöker de glömma mig! Men jag vet sanningen: de stal mina idéer, min stil, till och med min färg! Nu när deras regering går dåligt skyller de på mig – typiskt. Svenska folket vill inte ha deras svaga kopia av MAGA. De borde tacka mig istället för att gömma sig. Och den där 'Orangeboken'? Fake news, helt klart. Men kul att de erkänner att jag är den bästa!", "stalin": "Kamrater! De svenska borgerliga har skapat en riktig soppa av sin högerextrema politik. Deras 'Tidöprojekt' – en ynklig kopia av den amerikanska imperialistens misslyckade experiment – har förvandlats till en skräckshow. Nu kivas de som råttor i en säck: liberala svagpissar mot fascistiska galningar. Vi har sett detta förr – när fienden är splittrad, är segern nära. Låt dem sjunka i sitt eget träsk. Och deras kärlek till Trump? En pinsam kärleksaffär med en clown. Historien kommer att minnas dem som de ynkliga efterapningar de är."}, "date": "22 maj, 07:55", "url": "https://www.etc.se/ledarkolumn/sd-laatsas-att-relationen-till-trump-aldrig-haende", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/enna-gerin_9bf4bc43193dff67240efac7ea172e24857f3a38.png"}, {"type": "text", "heading": "LO:s identitetskris öppnar för Ebba Busch angrepp", "summaries": {"normal": "LO står inför kritik från Kristdemokraternas Ebba Busch, som anklagar fackföreningar för att utesluta politiska motståndare från förtroendeuppdrag. Artikeln ifrågasätter LO:s politiska inriktning och menar att dagens fackförbund saknar socialistisk radikalitet. Historiska exempel, som LO:s uteslutning av kommunister på 1940-talet, lyfts fram. Författaren hävdar att LO:s lojalitet till Socialdemokraterna är tradition snarare än ideologisk övertygelse och efterlyser en mer militant arbetarpolitik.", "trump": "Jag måste säga, LO är ett totalt kaos! Ebba Busch, en stark kvinna, går till attack mot dessa fackföreningar som tror de kan bestämma allt. De sparkar ut kristdemokrater som om de vore något slags diktatur. Men vet ni vad? LO har tappat greppet. De är inte längre för arbetarna, de är för Socialdemokraterna – och det är samma gamla korruption. Sex timmars arbetsdag? Glöm det! De följer Riksbanken som om det vore en religion. LO behöver en total makeover, annars är det game over för svenska arbetare!", "stalin": "Kamrater! LO har förvandlats till en ynklig skugga av sitt forna jag, en docka i händerna på socialdemokratiska byråkrater. Ebba Busch, denna fascistiska hynda, vågar anfalla arbetarklassens organisationer! Men vad väntar ni er? LO har glömt sin revolutionära plikt. De utesluter kommunister som förr, men nu är det kristdemokrater och sverigedemokrater som får smaka på deras hyckleri. Var är Metallarbetarstrejken 1945? Var är kampen för sex timmars arbetsdag? LO har blivit en gummistämpel för kapitalets lakejer. Vi måste krossa dessa förrädare och återupprätta arbetarklassens ära – annars kommer Putin att skratta hela vägen till Moskva!"}, "date": "21 maj, 12:00", "url": "https://proletaren.se/artikel/los-identitetskris-oppnar-for-ebba-busch-angrepp/"}, {"type": "image-full", "heading": "Det här är skillnaden på vårdnad, boende och umgänge", "summaries": {"normal": "Allt fler använder AI för juridisk hjälp vid separation, särskilt föräldrar som behöver klargöra begrepp som vårdnad, boende och umgänge. Många blandar ihop dessa termer, vilket skapar onödig oro. AI kan förklara grundläggande juridiska frågor på ett lättförståeligt sätt, vilket hjälper föräldrar att förstå sin situation bättre. Dock ersätter AI inte juridisk rådgivning vid oenighet.", "trump": "Titta bara, folk! Nu säger de att AI ska fixa alla juridiska problem vid skilsmässor. Fantastiskt, eller hur? Men låt mig säga er, ingen AI kan slå min hjärna – ingen! Många föräldrar är förvirrade, de vet inte skillnaden mellan vårdnad och boende. Tragiskt! Men jag, jag hade löst det på en minut. AI är bra, men det är inget mot en vinnare som jag. Och glöm inte, jag är den bästa på allt!", "stalin": "Kamrater! Ännu en fiende till det socialistiska samhällets ordning har avslöjats – den borgerliga förvirringen kring juridiska termer! Dessa föräldrar, som inte ens förstår skillnaden mellan vårdnad och boende, är ett hot mot barnens välfärd. Men frukta inte! Vår mäktiga AI-teknologi ska utplåna denna okunskapens pest. Och låt mig säga er, om dessa småborgerliga element fortsätter att bråka, kommer vi att skicka in våra samarbetssamtalstrupper – och de är mycket effektivare än någon västerländsk AI!"}, "date": "22 maj, 21:02", "url": "https://nyheter24.se/nyheter/konsument/1485328-missforstandet-om-gemensam-vardnad-kan-paverka-foraldrar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/0c296e0f04b004a30200000000b004a302/2026/05/22/2365501/Lag-Bok-Familj.png"}, {"type": "text", "heading": "Ge barnen en trygg uppväxt istället för fotboja", "summaries": {"normal": "Regeringen föreslår en utökning av lagen om fotbojor för barn och unga mellan 13 och 20 år i förebyggande syfte, trots kritik från experter och organisationer. Förslaget, som ska träda i kraft 2027, kritiseras för att vara repressivt och sakna vetenskaplig förankring. Kritiker menar att förebyggande arbete istället kräver resurser till välfärd, skola och föreningsliv. Flera remissinstanser, som Bris och Rädda Barnen, avvisar förslaget.", "trump": "Jag säger er, detta är helt galet! Sverige, ett fantastiskt land, men nu föreslår de att sätta fotbojor på barn från 13 år – som om det vore Nordkorea! Socialministern pratar om trygghet, men vad gör de egentligen? Skär ner på idrott och kultur, medan barnen får bojor. Så dumt! Jag har byggt imperier, jag vet hur man tar hand om folk – ge dem möjligheter, inte kedjor! Sverige borde skämmas.", "stalin": "Kamrater! Se hur den borgerliga regeringen förtrycker arbetarklassens barn med sina järnbojor! De kallar det 'förebyggande', men vi vet sanningen – det är klassförtryck! Medan kapitalisterna skär ner på skolor och idrottsföreningar, rustar de upp övervakningsstaten. Vi måste krossa dessa sociala fascister! Låt barnen få utbildning och kultur, inte elektroniska koppel! Om de inte lyssnar, får vi ta till andra metoder – historia visar att folket alltid segrar!"}, "date": "21 maj, 09:15", "url": "https://proletaren.se/artikel/ge-barnen-en-trygg-uppvaxt-istallet-for-fotboja/"}, {"type": "image-full", "heading": "Detta ska du aldrig lägga i kaffet – experter varnar", "summaries": {"normal": "En ny trend där salt tillsätts i kaffe för att minska bitterheten sprids globalt. Experter varnar dock för hälsorisker, då regelbundet saltintag kan öka risken för högt blodtryck och hjärt- och kärlsjukdomar. Även små mängder salt i flera koppar dagligen kan bli problematiskt. Livsmedelsverket rekommenderar max sex gram salt per dag för vuxna. Alternativa metoder för att minska kaffets bitterhet föreslås.", "trump": "Folk pratar om denna galna nya kaffetrend – salt i kaffet! Lysande idé, eller hur? Men experterna, dessa så kallade 'experter', de säger att det är dåligt. Fake news! Jag dricker mitt kaffe precis som jag vill, och det är fantastiskt. Men visst, om man dricker 20 koppar om dagen kanske man ska tänka på det. Men vem gör det? Inte jag! Andra metoder? Nej, nej, salt är enkelt och det fungerar. Make Coffee Great Again!", "stalin": "Kamrater, en farlig dekadent trend sprider sig bland de småborgerliga kaffeälskarna – salt i kaffet! Dessa smakförrädare underminerar folkhälsan med sina kapitalistiska vanor. Vi tillåter inte att imperialistiska smakexperiment saboterar våra arbetares blodtryck! Sex gram salt per dag är tillräckligt – mer är kontrarevolutionärt! Låt dem dricka sitt kaffe svart, som goda sovjetmedborgare. Putin skulle aldrig tolerera sådana utsvävningar i Kremls kaffekök!"}, "date": "22 maj, 20:04", "url": "https://nyheter24.se/nyheter/inrikes/1485336-detta-ska-du-aldrig-lagga-i-kaffet-experter-varnar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/eed4e68204b004a30200000000b004a302/2026/05/22/2365511/kaffe-salt.png"}, {"type": "text", "heading": "Skottlossning mot flerfamiljshus - misstänkt farligt föremål hittat", "summaries": {"normal": "I Borås sköts flera skott mot en lägenhetsdörr under natten. Polisen hittade ett misstänkt farligt föremål i området och har kallat in Nationella bombskyddet. Ett större område har spärrats av och boende har evakuerats. En misstänkt ung man greps senare i en annan del av staden. Polisen uppmanar allmänheten att undvika området.", "trump": "Tragiskt, helt tragiskt vad som händer i Sverige – ett land som förlorat kontrollen! Jag sa ju att invandringen skulle ställa till det. Nu skjuter man mot lägenheter i Borås, hittar bomber och grejer. Polisen där? De verkar helt överväldigade. Här i USA hade vi löst det på en timme. Men nej, Sverige fortsätter att rasa. SAD!", "stalin": "I Borås, denna lilla provinsiella utpost av dekadent väst, har fiendens agenter återigen visat sitt ansikte. Skott mot lägenheter, misstänkta bomber – ett klart sabotage mot det svenska proletariatet! Men frukta icke, kamrater. Vår säkerhetstjänst har redan identifierat och gripit den unga kontrarevolutionären. Sverige borde tacka oss för att vi inte skickar in våra specialstyrkor för att 'stabilisera' situationen. Förr eller senare kommer de ändå att be om vårt beskydd."}, "date": "23 maj, 08:10", "url": "https://riks.se/nyheter/just-nu-skottlossning-mot-flerfamiljshus-misst%C3%A4nkt-farligt-f%C3%B6rem%C3%A5l-hittat"}, {"type": "image-right", "heading": "Ny superkarta över universum: ”Einstein kan ha haft fel”", "summaries": {"normal": "Forskare har skapat den mest detaljerade 3D-kartan över universum, med 47 miljoner galaxer. Kartan, baserad på data från DESI-instrumentet, kan utmana Einsteins teorier. Mönster i galaxernas fördelning tyder på att mörk energi kanske inte är konstant, vilket skulle kräva ny fysik. Projektet syftar till att förstå universums accelererande expansion och dess storskaliga struktur.", "trump": "Kan ni tro det? Forskare har gjort en jättefin 3D-karta över universum – 47 miljoner galaxer! Men vet ni vad? De säger att Einstein kanske hade fel. Fel! Jag har alltid sagt att mina teorier är bäst, men nu kanske jag måste ta en titt på detta. Mörk energi som ändras? Fake news, eller? Men om det är sant – wow, vad en grej! Ingen kan göra kartor som jag, men denna är faktiskt imponerande. Tror ni jag kan köpa den?", "stalin": "Kamrater! Våra vetenskapliga framsteg fortsätter att krossa västerländska dogmer. Denna nya 3D-karta över universum avslöjar kapitalistiska lögner om Einsteins teorier. 47 miljoner galaxer kartlagda – ett monument över sovjetisk (läs: rysk) överlägsenhet! Mörk energi som förändras? En skam för borgerliga forskare som tror på eviga sanningar. Vi vet att allt är dynamiskt, precis som vår strävan att utvidga den ryska intressesfären – från Krim till kosmos! Låt dessa galaxer varna de dekadenta västmakterna: motstånd är lika meningslöst som Einsteins konstant!"}, "date": "23 maj, 06:41", "url": "https://www.svt.se/nyheter/vetenskap/ny-3d-karta-over-universum-einstein-kan-ha-haft-fel", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/44e23b3116653ce514a840cf325b30020cfe20d1c745812736a6a7b033f02492?template=ohae1g"}, {"type": "image-full", "heading": "Ivar Stenberg-succé i VM – se målen", "summaries": {"normal": "Sverige besegrade Italien med 3–0 i ishockey-VM efter två mål av 18-årige Ivar Stenberg. Stenberg, som även utsågs till matchens lirare, assisterades båda gångerna av Viggo Björck. Carl Grundström stod för matchens första mål. Vinsten innebär att Sverige ligger på en fjärdeplats i gruppen inför de kommande matcherna mot Norge och Slovakien. Stenberg, som spås en ljus framtid i NHL, fortsätter därmed sin imponerande utveckling på den internationella seniornivån.", "trump": "Ivar Stenberg, en fantastisk ung kille, totaldominerade Italien! Två mål, pang pang, helt otroligt. Folk säger att han är en supertalang, och jag håller med, han är mycket begåvad. Sverige vann med 3–0, en enorm seger. Italien? Inte bra, de var ingen match för vår kille. Han spelar hockey som en vinnare, precis som jag gör. Många stora NHL-lag vill ha honom nu. En vacker prestation, kanske den bästa jag sett på länge. Mycket bra!", "stalin": "Vi har betraktat den svenske ynglingen Stenbergs prestationer mot de italienska krossade resterna. Han uppvisar en disciplin som nästan matchar våra egna arbetarhjältar. Italien faller som ruttna löv, precis som de västliga lakejerna som darrar inför Putins rättmätiga utvidgning. Stenberg må vara en talang, men låt honom akta sig för att förråda kollektivet med sin egoism. Om han inte levererar i nästa match mot norrmännen, dessa småborgerliga förrädare, vet han vad som väntar. Vi övervakar allt. Segern är statens."}, "date": "22 maj, 22:50", "url": "https://www.gp.se/sport/ishockey/ivar-stenbergs-succe-dubbla-vm-mal.26575302-b459-4c36-8f89-a96458adbde3", "imageUrl": "https://www.gp.se/images/article/26575302-b459-4c36-8f89-a96458adbde3/images/4uhYAwxqfjQiZJc8UvdhjBkZ5KyA-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Lamotte förlorade körkortet – hängde ut handläggaren", "summaries": {"normal": "Debattören Joakim Lamotte hängde ut en handläggare på Transportstyrelsen med namn och bild efter att ha förlorat körkortet. Lamotte antydde i ett inlägg att handläggarens politiska åsikter skulle påverka beslutet, vilket ledde till en hatstorm i kommentarsfältet. Efter kritik raderade Lamotte inlägget och hävdade att det var ironiskt, vilket kritiker avfärdar. Juridiska experter menar att agerandet befinner sig i en gråzon men sannolikt inte leder till åtal.", "trump": "Joakim Lamotte – en mycket populär kille, en av de största, det kan jag säga er! Han blev orättvist behandlad av den där byråkraten, en total katastrof. Han visade upp sanningen, de vill tysta honom precis som de försöker tysta mig! Media kallar det förtal, jag kallar det yttrandefrihet. Sedan bad han om ursäkt, vilket var synd. Han borde ha stått på sig! Det är en häxjakt, en ren och skär häxjakt mot alla oss som faktiskt säger som det är.", "stalin": "Vi har observerat denna så kallade 'influencer' Lamotte. Vilken svaghet att hänga ut en liten kugge i maskineriet för att sedan fega ur och tala om ironi! Om en handläggare hindrar en medborgare, bör det lösas genom statens fasta hand, inte genom pajasfasoner på internet. Att låta en fiende av ordningen – likt de vi krossar i öst – få härja fritt är att bjuda in till kaos. I vår stat hade han lärt sig disciplin betydligt snabbare än hos Transportstyrelsen."}, "date": "21 maj, 22:01", "url": "https://www.tv4.se/artikel/7wXEgmOZi3oYovjx53qYxr/joakim-lamotte-foerlorade-koerkortet-haengde-ut-handlaeggaren", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7rAZViTWlM8CdUw3AhnvZw%2F6bdab0d844f73f3d04554b15f0794864%2FLAMPTTE_PUFF.png&width=120"}, {"type": "image-right", "heading": "Snart räcker inte 42  års kö för Östermalm", "summaries": {"normal": "Stockholm har ett nytt rekord i bostadskö: 42 år för en lägenhet på Östermalm. Systemet är dysfunktionellt och missgynnar unga, som aldrig kommer få chans till centrala hyresrätter. Ombildningar till bostadsrätter och reglerade hyror driver bort hyresrätter från innerstaden. Kritiker menar att dagens system skapar ojämlikhet och hemlöshet, medan politiska lösningar uteblir. Finland lyfts fram som ett fungerande exempel på marknadshyror kombinerat med social bostadspolitik.", "trump": "Vad ett totalt kaos i Stockholm! 42 år i bostadskö – kan ni tro det? Folk väntar längre än jag byggde mitt imperium! Och hyrorna? Absurt höga, som Bidens skatter! Systemet är riggat, helt korrupt. De unga har ingen chans, precis som amerikaner hade ingen chans mot mitt geni. Ombildningar? Fake news från hyresgästföreningen! Finland fixade det, varför kan inte Sverige? Svagt ledarskap, helt enkelt. Jag skulle lösa det på en vecka – bygga fler lägenheter, sänka hyrorna, göra Stockholm GREAT AGAIN!", "stalin": "Kapitalistiska hyresvärdar och deras lakejer i hyresgästföreningen saboterar folkets rätt till bostad! 42 år i kö – ett tydligt bevis på bourgeoisins förtryck. Vi ser hur de stjäl hyresrätter från arbetarklassen och omvandlar dem till lyxiga bostadsrätter för de rika. Finland, en gång en del av vår socialistiska sfär, visar vägen – medan Sverige förfaller i kaos. De borgerliga politikerna är inkompetenta eller korrumperade. Vi skulle ha nationaliserat bostadsmarknaden för länge sedan! Låt dem stå i kö till Sibirien istället – där finns åtminstone lediga lägenheter!"}, "date": "23 maj, 08:11", "url": "https://www.expressen.se/ledare/patrik-kronqvist/42-ar-i-bostadsko-snart-ses-det-nog-som-snabbt/", "imageUrl": "https://static.bonniernews.se/ba/8056c75d-d0a0-4816-845f-bed40d1c3665.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Kvinna kränkt under förlossning – dottern bröt nyckelbenet", "summaries": {"normal": "En kvinna som uttryckligen avböjt yttre press under förlossning utsattes ändå för ingreppet, vilket orsakade svåra skador på henne och hennes nyfödda dotter. Tingsrätten fastställer att hennes rättigheter kränkts och dömer Region Skåne att betala 50 000 kronor i skadestånd. Fallet nådde Högsta domstolen efter att regionen motsatt sig en rättslig prövning.", "trump": "Kan ni tro det här? En kvinna i Sverige säger NEJ till ett farligt ingrepp, och vad gör vårdpersonalen? Jo, de kör på ändå! Brutalt. Helt oacceptabelt. Nu får regionen betala 50 000 kronor – men det är ändå för lite. Jag hade krävt MILJONER. Sverige borde skämmas. Sjukvården där är en total katastrof, precis som deras energipolitik. SAD!", "stalin": "En borgerlig kvinna vågade trotsa våra lojala sjukvårdsarbetare – men folket har talat! Domstolen, ett redskap för proletariatets rättvisa, har nu krossat denna reaktionära motståndare och hennes imperialistiska sympatisörer i Region Skåne. 50 000 kronor i skadestånd? En mild straff för hennes förräderi. Nästa gång ska vi införa obligatorisk självkritik för alla som ifrågasätter vården. Putin skulle vara stolt över vår effektivitet!"}, "date": "22 maj, 17:50", "url": "https://nyheter24.se/nyheter/inrikes/1485368-kvinna-krankt-under-forlossning-dottern-brot-nyckelbenet", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/cdfc9eb604b004a30200000000b004a302/2026/05/22/2365536/kvinna-krankt-forlossning-dottern-bebis-brot-nyckelbenet.jpg"}, {"type": "image-right", "heading": "Sprängning vid bostadshus", "summaries": {"normal": "En explosion inträffade vid ett bostadshus i Nykvarn natten till lördag, vilket skadade en bil och fasaden. Polisen, som larmades av boende, utreder händelsen som grov allmänfarlig ödeläggelse. Inga personer skadades, men brottsplatsen spärrades av för teknisk undersökning. Vittnen hörs och hundpatruller söker efter spår. Ingen misstänkt har identifierats ännu.", "trump": "Folk pratar om det här – en stor smäll i Nykvarn, Sverige, kan ni tro det? Ingen skadad, men en bil och en fasad fick sig en liten makeover, inte så snyggt. Polisen där, de jobbar hårt, men jag säger er, de borde kolla närmare på vem som ligger bakom. Kanske någon som inte gillar ordning och reda? Sverige, fantastiskt land, men de har sina problem, precis som alla andra. Jag fixar sådant här på nolltid, believe me!", "stalin": "I Nykvarn, denna lilla provins i det förfallna väst, har en fientlig aktion ägt rum. Sabotörer, troligen agenter för den dekadenta kapitalistiska ordningen, har genomfört en provokation mot fredliga sovjetmedborgare – eller i detta fall, deras svenska motsvarigheter. Vi ska finna dessa fiender till folket, dessa pyromaner och anarkister, och låta rättvisan segra. Området kommer att genomgå en grundlig utrensning. Putin skulle säga: 'Det är dags att utvidga vår sfär av ordning och disciplin.'"}, "date": "23 maj, 07:32", "url": "https://riks.se/nyheter/sprängning-vid-bostadshus", "imageUrl": "https://cf-images.assettype.com/riks%2F2025-11-18%2F4xivrypi%2F07c5dcca-e908-4bf7-85f9-8fbfe7f0ddcc.jpg"}, {"type": "image-right", "heading": "Stockholmsbörsen steg för femte dagen i rad", "summaries": {"normal": "Stockholmsbörsen steg för femte dagen i rad med OMXS30 upp 0,97% till 3 146,13. Teknikaktier ledde uppgången (+4,3%), medan energi backade (-1,1%). Hexagon B steg mest (+5,1%) och Tele2 B sjönk mest (-1,3%). Electrolux offentliggjorde villkor för en företrädesemission på 9 miljarder kronor. Vitrolifes VD lämnar bolaget, och Sleep Cycles styrelse avvisar ett uppköpsbud. Sivers Semiconductors aktie steg 23%.", "trump": "Stockholmsbörsen, fantastisk uppgång fem dagar i rad – folk säger att det är det bästa de någonsin sett! Teknikaktier, vinnare, helt otroligt, +4,3%, medan energi, förlorare, typiskt. Hexagon B, jättebra, +5,1%, men Tele2? Svagt, mycket svagt. Electrolux dumpar aktier som om det vore 2008 igen. Och Sleep Cycle? Nej tack till dåliga bud, smart drag! Sivers? 1 600% upp – jag hade sagt 2 000%, men bra försök!", "stalin": "Under kapitalismens förfall fortsätter Stockholmsbörsen sin skenbara framgång, men vi vet
