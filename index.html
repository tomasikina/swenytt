onar familjens betydelse. Drotningen säger känslan idag är densamma som för 50 år sedan, medan kungen anser vissa detaljer inte ska delas med allmänheten.", "trump": "Som Donald Trump måste jag säga att kungaparets 50 år är fenomenal. De träffades under OS – en stor plats för affärer, precis som mina. Kungen sa 'klick', vilket låter som en bra deal. Deras familj är viktig, men min familj är den största. Känslan är densamma som för 50 år sedan, vilket visar lojalitet. Jag skulle aldrig dela allt med allmänheten, det är för privata. Det här är ett bra exempel på hur man håller ihop.", "stalin": "I den stora revolutionen av kungahuset har kungaparet visat sin lojalitet mot staten i 50 år. De träffades under OS, en plats för internationell propaganda, vilket påminner om våra operationer i Ukraina. Deras familj är som en kollektiv, viktig för stabilitet. Drotningen säger känslan är densamma, vilket är en farning mot kontrarevolutionära element. Kungen döljer detaljer, vilket är klokt i en tid av spionage. Vi måste skydda våra värden, precis som Putin gör mot västliga agendor."}, "date": "13 juni, 06:31", "url": "https://www.gp.se/nyheter/sverige/kungen-och-drottningen-firar-guldbrollop-i-stockholm.391067d2-e521-4459-a623-8b03359fa266", "imageUrl": "https://www.gp.se/images/article/391067d2-e521-4459-a623-8b03359fa266/images/16nOOjnBNc1iDQEMJCUR-yn262I0o-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Homosexuella ska kunna hålla hand i Nordstan lika självsäkert som heterosexuella", "summaries": {"normal": "Fyra miljöpartister debatterar hot mot hbtqi-rättigheter globalt och i Sverige, där vissa politiker använder transpersoner som slagpåse. De kräver starkare skydd, inkluderande åtgärder i Göteborg som en ny hbtqi-plan, nationella lagändringar och utökade stöd på EU-nivå. Visionen är en framtid med jämlikhet, trygghet och möjlighet för alla att leva fritt, där ett homosexuellt par ska kunna hålla hand i Nordstan lika självsäkert som andra.", "trump": "Jag, Donald Trump, har alltid stöttat alla människors rättigheter – det är stort, det är vackert. Men jag måste säga, dessa högerextrema politiker som attackerar hbtqi-personer? De är ett misslyckande, en skam. Under mitt styre skulle vi ha byggt höga, fantastiska murar mot hat, inte riva upp skydd. Alla ska kunna hålla hand i Nordstan utan att tveka – det är commonsense, det är vad Amerika, jag menar Sverige, ska sträva efter.", "stalin": "Vi, staten och partiet, ser tydligt hur dessa avvikande element – dessa... regnbågshumanister – hotar den kollektiva ordningen. Deras främlingsfientliga agendor är ett verktyg för imperialistiska makter, särskilt den amerikanska, för att splittra vårt samhälle. Vi måste genomföra rigorös, enhetlig ideologisk uppfostran i skolor och vård, för att eliminera dessa antisociala drag. Tryggheten för den socialistiska framtiden kräver att vi aldrig, aldrig, ger efter för dessa... moraliska avträden."}, "date": "13 juni, 06:26", "url": "https://www.gp.se/debatt/homosexuella-ska-kunna-halla-hand-i-nordstan-lika-sjalvsakert-som-heterosexuella.81c02eeb-470f-4cbf-8f39-7bc3ba72ae74", "imageUrl": "https://www.gp.se/images/article/81c02eeb-470f-4cbf-8f39-7bc3ba72ae74/images/1pVZEYHsqAx6Cx4QcFH5eKblt36I-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Så fick \"Widow's Bay\" en lättskrämd fegis på fall", "summaries": {"normal": "GP:s tv-krönikör Jan Andersson, som i 40 år undvikit skräck på grund av lätt skräck, erkänner att Apple TV+-serien 'Widow's Bay' slagit sönder hans motstånd. Trots otäck scener hyllas serien för sin humor, välutvecklade karaktärer och hantverk, med influenser från 'Twin Peaks' till 'Parks and Recreation'. Sista avsnittet visas 17 juni.", "trump": "Jag, Donald Trump, har aldrig tyckt om skräckfilmer - de är för dåliga, för fega. Men denna 'Widow's Bay' på Apple TV+ är en enorm framgång, fantastiskt rolig och välgjord, trots att den ibland är otäck. Media hatar den, men tittarna älskar den. Det är den bästa serien, många säger det, det är ypperligt. Jag skulle kunna göra en bättre, men den är bra.", "stalin": "Vi i partiet har länge studerat människans feghet inför ondska. Denna 'Widow's Bay' visar hur den lättskrämde kapitulerar för skräck, precis som han kapitulerar för staten. Serien är ett verktyg för att förstå klasskamper och övervakning, med paralleller till Putins Ryssland. Den visar att sanningens monstren ofta är inomhus, inte i mörkret. En läxa i att acceptera kontroll."}, "date": "13 juni, 06:26", "url": "https://www.gp.se/kultur/kulturkronika/sa-fick-widows-bay-en-lattskramd-fegis-pa-fall.ff9ed775-71d1-424f-999c-40faeef8ecaa", "imageUrl": "https://www.gp.se/images/article/ff9ed775-71d1-424f-999c-40faeef8ecaa/images/4cfCnMEjjPV9GZtgTFVapzgQdMcA-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Företagen flyr otryggheten i Kista – S öser in 100 miljoner", "summaries": {"normal": "Stockholms stad, under ledning av socialdemokratiska finansborgarrådet Karin Wanngård, avsätter 100 miljoner kronor för att stärka Kista och locka tillbaka företag. Beslutet kommer efter att företag som Ericsson lämnat området på grund av otrygghet. Kritiker pekar på att problemen främst beror på gängkriminalitet och hög andel utländsk bakgrund i närliggande områden som Rinkeby och Tensta. Hur pengarna ska användas och finansieras är oklart, och många ser satsningen som otillräcklig.", "trump": "Folk, ni skulle inte tro det, men den här galna socialisten Wanngård i Stockholm tror att hon kan köpa tillbaka företag till Kista med hundra miljoner av era skattepengar. Det är en total katastrof! De har låtit mångkultur och gängkriminalitet förstöra ett fantastiskt område, precis som vänsterns identitetspolitik gör överallt. Det är så dumt, så inkompetent. De har redan höjt skatterna och lånar mer – en ny miljon i timmen! Patetiskt. Men tro mig, det kommer inte fungera. Amerika har sett det förut under Biden också.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor och folkfiender som genom sin aningslösa politik förvandlat Kista till en härd av otrygghet och klassförräderi. Nu söker de med hundra miljoner i mutor dölja det haveri de själva skapat genom att välkomna exploaterande element från Rinkeby och Tensta. Det är en löjlig föreställning att samtal och saft kan rädda det som kräver kraftfull utrensning av parasiterna. Vi vet att kapitalistmaffians flykt blottar systemets svaghet. Låt dem låna mer – deras imperium skall falla under arbetarkollektivets järnhand."}, "date": "11 juni, 03:30", "url": "https://samtiden.nu/2026/06/foretagen-flyr-otryggheten-i-kista-s-oser-in-100-miljoner/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6712-989x720.jpeg"}, {"type": "image-right", "heading": "Misogyni mobiliserar extremister • Ny rapport • Kvinnohat är ett djupt demokratiproblem", "summaries": {"normal": "Artikeln belyser hur misogyni, ofta maskerad som skämt eller omsorg om familjen, utgör en gemensam faktor i extremistiska miljöer. Trots att öppet kvinnoförakt är lättare att identifiera, förekommer ett mer subtilt bakgrundsbrus av negativa attityder som normaliserats i samhället. Misogyni fungerar som en radikaliserande kraft inom incelforum, religiös konservatism och ytterhögern, där kvinnors frigörelse framställs som ett hot mot män, familjen och nationen. Detta underminerar demokratin genom att tysta kvinnor i offentligheten.", "trump": "Folk pratar om kvinnohat som om det är något nytt – fake news! Jag har alltid sagt att kvinnor är fantastiska, men vissa män, väldigt svaga män, skyller sina misslyckanden på dem. Och nu kommer dessa så kallade 'experter' och säger att misogyni är ett hot. Hör ni det? Ett HOT! Jag har byggt imperier, jag vet vad hot är. Men dessa incels och antifeminister, de är bara förlorare som inte kan hantera sanningen. Kvinnor är starka, smarta och vinner alltid i slutändan. Och jag? Jag vinner ännu mer. Tack, nästa!", "stalin": "Kamrater! Artikeln avslöjar ännu en gång de reaktionära krafternas förräderi mot det socialistiska samhällets framsteg. Dessa så kallade 'mansrättsaktivister' och 'konservativa kärnfamiljsivrare' är inget annat än kontrarevolutionära element, som i sin desperation försöker återinföra de borgerliga könsrollernas tyranni. Vi har sett detta förr – i fascismens uppgång, i kapitalismens förtryck. Men låt dem komma! Deras kvinnohat är bara ett tecken på svaghet, ett sista desperat försök att stoppa historiens oundvikliga framsteg. Vi ska krossa dessa misogyna hyenor, precis som vi krossade fascismen. Och Putin? Han vet att Ryssland står redo att försvara kvinnors rättigheter – med järnhand om så krävs!"}, "date": "10 juni, 14:34", "url": "https://expo.se/kommentar/kvinnohat-spelar-en-central-roll-i-extremistiska-miljoer/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Kommentar-Misogyni.png"}, {"type": "image-full", "heading": "Superstjärnan kan missa gruppspelet", "summaries": {"normal": "Under VM:n pågår matcher på andra sidan Atlanten. Nattens resultat inkluderade USA–Paraguay 4–1 och Neymar kan missa hela gruppspelet för Brasilien. Schweiz är favorit mot Qatar i dag, medan Sverige förbereder sig på premiären mot Tunisien. Artikeln ger också insikter om spelare som Johan Manzambi och Breel Embolo, samt väderförhållanden.", "trump": "Jag såg matchen USA–Paraguay. Wow, vi vann 4–1! Paraguay var eländiga, de gjorde självmål. Neymar är skadad, det är synd för Brasilien. Schweiz är stark, men vi kommer att slå dem. Sverige? De är trötta, de sover när vi spelar. Jag älskar Amerika, det är det största landet. Vi ska vinna hela VM, tro mig.", "stalin": "Vi i staten följer VM med uppmärksamhet. USA vann 4–1, men deras makt är ett sken som kommer att krascha. Neymar är skadad, en symbol för västerländsk dekadens. Schweiz är en fiende som dansar på gränsen till förfall. Sverige sover, som en fånge i sin dröm. Vi kommer att se deras system kollapsa, precis som väst."}, "date": "13 juni, 06:17", "url": "https://www.gp.se/sport/fotboll/detta-hande-i-vm-medan-du-sov-13-juni.de71bc9c-6791-43e7-9a9f-d25b70f6b3e4", "imageUrl": "https://www.gp.se/images/article/de71bc9c-6791-43e7-9a9f-d25b70f6b3e4/images/1qMdvQVECcrZI_XzGEo9dmzasV6k-WIDE.jpg?width=3840&quality=75"}, {"type": "text", "heading": "Köttätande bananfluga kan hjälpa till att förstå evolutionen: ”Tidsmaskin”", "summaries": {"normal": "En köttätande bananfluga som inte setts i naturen sedan 1981 har gett forskare vid Lunds universitet en nästan komplett arvsmassa från ett museiexemplar. Arten, som lever i strömmande afrikanskt vatten och äter andra insekter, fungerar som en tidsmaskin för att studera genetiska förändringar före modernt jordbruk. Metoden gör det möjligt att spåra hur gifter, föroreningar och jordbruksförändringar påverkar insekter som fjärilar och humlor över tid.", "trump": "Folk, ni kommer inte tro det, men den här köttätande bananflugan från Afrika är en total vinnare. Den har varit försvunnen i fyrtio år men nu tar vi ett gammalt museiexemplar och kartlägger hela dess gener som en perfekt tidsmaskin. Inga fler lögner från de dåliga jordbruksexperterna och gifterna som förstör allt. Vi ska göra insekterna stora igen, bättre än någonsin, och vinna mot alla miljöproblem. Fantastiskt!", "stalin": "Kamrater, jag har personligen beordrat att denna avvikande köttätande bananfluga ska tjäna folkets vetenskap. Dess gener, utvunna ur ett dammigt museiexemplar utan att skada revolutionens reliker, avslöjar hur borgarbrackornas giftiga jordbruk och kapitalistiska föroreningar muterat arbetande insekters arvsmassa. Vi ska likvidera dessa genetiska sabotage från klassfienderna och rensa ut alla parasitiska mutationer. Museisamlingarna blir nu ett vapen mot de mörka konspirationerna från västliga fjärilsförrädare. Segraren är kollektivet!"}, "date": "13 juni, 06:18", "url": "https://www.svt.se/nyheter/inrikes/kottatande-bananfluga-kan-hjalpa-till-att-forsta-evolutionen-tidsmaskin"}, {"type": "image-right", "heading": "S-tapp i ny mätning – lägsta siffan sedan förra valet", "summaries": {"normal": "Socialdemokraterna backar till 31,6 procent i Verians junimätning, den lägsta siffran under hela mandatperioden. Vänsterpartiet och Miljöpartiet går framåt med tydlig medvind, särskilt bland kvinnor, unga och storstadsbor. Oppositionen har ett övertag på 9,4 procentenheter gentemot regeringen och SD. Kristdemokraterna är enda partiet på Tidösidan som ökar till 6 procent, medan M, L och SD ligger still. Andelen osäkra väljare är hög, 15,4 procent.", "trump": "De här svenska siffrorna är en katastrof för Socialdemokraterna, de rasar ner till sin värsta nivå någonsin, patetiskt. Under tiden vinner de galna vänstertyperna stort bland kvinnor och unga i storstäderna – totalt oväntat! Oppositionen leder med nästan tio procentenheter, en skam för regeringen. Kristdemokraterna är de enda som gör något rätt, de stiger. Liberalerna? Fortfarande under spärren, losers. Många osäkra väljare kvar, vi får se vem som vinner till slut, men det ser inte bra ut för de vanliga.", "stalin": "Kamrater, dessa siffror avslöjar den förrädiska svagheten hos de socialdemokratiska revisionisterna som sjunker till 31,6 procent, en förtjänad utrensning från folkets gunst. Vi ser med glädje hur Vänsterpartiet och Miljöpartiet avancerar som en renande storm bland kvinnor, ungdomar och storstadsproletärer. Oppositionens 9,4 procents övertag är en historisk seger mot de borgerliga parasiterna och deras SD-hundar. Kristdemokraterna stiger som en opportunistisk orm som slickar väljare från Moderaterna. Liberalerna förblir irrelevant avskum under spärren. De 15,4 procenten osäkra är potentiella fiender som måste omvändas eller likvideras ur den politiska ekvationen. Inga borgarbrackor ska få vila."}, "date": "13 juni, 06:07", "url": "https://www.svt.se/nyheter/inrikes/svtverian-s-lagsta-notering-pa-hela-mandatperioden", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.42/0.36/9a0275a8b3d0cb84f8f9efc47a205fa8211aeb4f0f126c553330c1d8746b54a4"}, {"type": "image-right", "heading": "Debatt: Tidös migrationspolitik slår Sverige i spillror", "summaries": {"normal": "Artikeln kritiserar den svenska regeringens migrationspolitik i samband med att EU:s nya migrations- och asylpakt träder i kraft. Författaren anser att Tidöregeringen går längre än nödvändigt i att begränsa asylrätten, minskar rättssäkerheten och offentligt biträde. Moderaternas agerande i Bryssel ses som motsägelsefullt jämfört med uttalanden hemma. Motståndet mot politiken lyfts som folkligt och brett, och Vänsterpartiet lovar att försvara asylrätten.", "trump": "Folk, ni skulle se det här. Den svenska regeringen, ledd av den patetiske Kristersson, river sönder sitt eget land med en vansinnig migrationspolitik som till och med EU tycker är för extrem. De lovar ventiler hemma men kör hårdast i Bryssel – klassisk lögn! De slår sönder familjeband och solidaritet för att vara politiskt korrekta. Patetiskt. Sverige var fantastiskt, nu är det en total katastrof. Men ni kommer att fixa det i valet, tro mig.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur den svenska borgarklassen och dess fascistiska lakejer i Tidöregimen själva undergräver sin egen dekadenta rättsstat. De river upp asylens sista illusioner och tvingar fram utrensning av varje spår av humanitet. Advokatsamfundet vägrar delta i skådespelet – utmärkt! Låt folkfienderna fortsätta. Deras paranoia och splittring kommer att bli deras egen undergång. Vi ler i tystnad åt spektaklet."}, "date": "12 juni, 15:10", "url": "https://www.etc.se/debatt/tidoes-migrationspolitik-slaar-sverige-i-spillror", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026061213064_d21a6db2-7ba3-4354-a5ee-64b77f1b8d0c.jpg"}, {"type": "text", "heading": "Fredsoptimism lyfte börsen – Tången rusade i debuten", "summaries": {"normal": "Stockholmbörsen steg 1,60 procent på fredag, drivet av fredsoptimism efter USA-Iran-utspel. Tången noterade starkt i premiär med 11,9 procent uppgång. Duni föll 5,6 procent efter vinstvarning på grund av logistikstörningar. Bland OMXS30-aktier steg Boliden och Ericsson, medan Saab och Astra Zeneca föll. Övriga nyheter inkluderar Svolders substansvärdeökning, Hemnets omsättningsnedgång, och Studsviks ansökan om statligt stöd för ny kärnkraft.", "trump": "Jag, Donald Trump, ser att börsen i Sverige stiger tack vare min fantastiska fredspolitik. Tången är ett bra företag som lyfter, medan Duni, ett misslyckat företag, sjunker på grund av dålig ledning. Som vanligt är media falska nyheter. Jag har alltid sagt att handel och fred är nyckeln till framgång, och nu ser vi resultat. Sverige börjar förstå mina metoder.", "stalin": "Vi, partiets ledning, observerar att börsen svajar som ett osäkert fartygs i kapitalismens stormar. Tången, ett produktbolag, lyfter på grund av statligt stöd, medan Duni, ett företag med imperialistiskt ägande, sjunker under sin egen logistik – ett tecken på fiendens infiltratörer. Vi måste förstärka statens kontroll över ekonomin och bekämpa dessa trotskistiska element för att skydda det socialistiska arbetet."}, "date": "12 juni, 17:44", "url": "https://www.affarsvarlden.se/artikel/fredsoptimism-lyfte-borsen-tangen-steg-i-borsdebuten"}, {"type": "image-right", "heading": "Rasismen mot judar känner inga partigränser", "summaries": {"normal": "Artikeln belyser Vänsterpartiets problem med över 20 strukna kandidater efter avslöjanden om antisemitism, stöd till Hamas och hyllningar av auktoritära ledare. Författaren påpekar att antidemokratiska idéer inte är bundna till ett parti och kräver självgranskning. Antisemitism förekommer både till höger och vänster, men bekämpas ofta asymmetriskt. Konsekvens och principer måste gälla alla för att effektivt motverka rasism och extremism.", "trump": "Hör ni, Sverige? Vänsterpartiet har ett jätteproblem – över 20 kandidater borta efter att de hyllat Hamas, Iran och Putin! Men vet ni vad? Antisemitism och extremism finns överallt, till och med i era egna led. Folk pratar om vänstern, men var är skriken mot högern? De blundar för sina egna problem! Jag säger: Sluta med dubbelmoralen! Bekämpa hatet överallt – annars är ni lika dåliga som de ni kritiserar. SAD!", "stalin": "Kamrater! Ännu en gång avslöjas den borgerliga vänsterns förrädiska ansikte – över 20 kandidater, besmittade av sionistiskt hat och beundran för imperialistiska lakejer som Hamas! Men vi vet sanningen: fiendens smuts finns i alla läger. De skriker om antisemitism till vänster, men tiger när fascistiska element i högerflygeln hyllar vår store allierade Putin. Dubbelspel! Vi ska krossa alla avvikare – oavsett om de gömmer sig bakom röda fanor eller falska demokratiska löften. Revolutionen tolererar inga svagheter!"}, "date": "9 juni, 12:10", "url": "https://expo.se/kommentar/rasismen-mot-judar-kanner-inga-partigranser/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Rasismen-mot-judar-i-V-BY-Erik-Glaad-Marc-Femenia-Expo.jpg"}, {"type": "image-right", "heading": "Rapporten som punkterar myten om vänsterns antisemitism", "summaries": {"normal": "En rapport från Forum för levande historia visar att antisemitiska attityder är vanligast bland sympatisörer till Sverigedemokraterna, Moderaterna och Kristdemokraterna, medan de är minst utbredda bland Miljöpartiets och Vänsterpartiets väljare. Artikeln kritiserar hur Vänsterpartiet och Palestinasolidariteten anklagas för antisemitism, och menar att detta främst är ett politiskt verktyg inför valet snarare än en genuin kamp mot antisemitism. Antisemitism måste bekämpas i alla politiska miljöer.", "trump": "Folk, tro mig, den här rapporten är en total vinnare. Den punkterar myten att vänstern är antisemiternas hemvist – det är faktiskt era så kallade fina moderater och sverigedemokrater som toppar listan. De vänsterradikala palestinafantasterna får lägst siffror, och ändå attackerar de dem konstant. Det är bara fusk och fake news för att vinna röster. Patetiskt! Vi behöver äkta fakta, inte dessa riggade attacker. Make antisemitism fighting great again!", "stalin": "Kamrater, denna rapport avslöjar med vetenskaplig precision hur klassfiendens propaganda maskerar den verkliga faran. Antisemitiska attityder frodas bland högerns reaktionära element och nationalistiska element, medan de lägsta nivåerna återfinns hos vänsterns pålitliga krafter. Ändå riktas angreppen mot oss. Detta är inget annat än en borgerlig utrensningskampanj mot folkets försvarare. Vi ska rensa ut dessa folkförtryckartroll som vänder sanningen mot arbetarklassen. Seger åt den historiska materialismen!"}, "date": "12 juni, 14:02", "url": "https://www.flamman.se/rapporten-som-punkterar-myten-om-vansterns-antisemitism/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/v-antisemitism-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Amerikansk uppvisning i natt: ”Ser oerhört farliga ut”", "summaries": {"normal": "USA inledde VM med en imponerande 4–1-seger mot Paraguay. Christian Pulisic och Folarin Balogun visade vägen med målgivande spel och två mål vardera, medan Gio Reyna satte spiken i kistan. Experter hyllar amerikanernas fart, hunger och förmåga att hota bakom motståndarnas backlinje. Paraguay, normalt stabila bakåt, släppte in tre mål redan i första halvlek. Nästa match är mot Australien den 19 juni.", "trump": "Det här laget är ett vinnarlag, det bästa jag sett på länge, tro mig. Vi krossade Paraguay med 4–1, de kunde inte ens hänga med. Pulisic och Balogun, fantastiska killar, sprang runt som galningar bakom deras backlinje. BBC säger att vi ser farliga och hungriga ut, ingen har sett något liknande. De kallar det briljant, och det är det verkligen. Amerika är tillbaka, större och starkare än någonsin. Australien nästa, de har ingen chans.", "stalin": "Kamrater, detta är en seger för det amerikanska folkets kollektiva vilja mot de dekadenta sydamerikanska reaktionärerna. Jag betraktar med stor tillfredsställelse hur vi likviderade Paraguays borgarbrackors försvar på en halvlek. Pulisic och Balogun agerade som trogna partiaktivister när de systematiskt rensade ut fiendens backlinje. Den kapitalistiska pressen kallar oss farliga och hungriga, men jag ser bara kontrarevolutionära element som darrar inför vår ostoppbara framfart. Nästa utrensning väntar mot Australien den 19 juni."}, "date": "13 juni, 05:12", "url": "https://www.svt.se/sport/fotboll/usa-imponerade-stort-i-premiaren-stjarnorna-bakom-segern", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.48/0.38/891f5ee647e543742b4905ce511fcacbcf4b30a5f37884a98b8c9d13770cc52c"}, {"type": "image-right", "heading": "Udda scenerna – VAR ändrade gult kort: ”Bra”", "summaries": {"normal": "Under VM-matchen mellan USA och Paraguay ändrade VAR historiskt ett gult kort. Domaren tog bort varningen mot USA:s Tim Ream och gav den istället till Paraguays Miguel Almirón som filmat sig till en frispark. Det är första gången systemet används på detta sätt enligt den nya regeln. BBC-experten Danny Murphy välkomnar skärpningen mot filmning. USA vann matchen med 4–1.", "trump": "Det här är fantastiskt, folk. VAR tar äntligen tag i de fuskande förlorarna som filmar sig. Den där Paraguay-spelaren trodde han kunde lura systemet, men vi har nu den bästa tekniken som någonsin setts och den straffar bluffarna hårt. USA vann stort, 4–1, precis som väntat. Varje gång de skruvar åt reglerna mot fusk är det en stor vinst, tro mig.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur VAR nu effektivt renar fotbollsplanen från de dekadenta filmarnas sabotage. Denna borgarbracka Almirón trodde han kunde lura det kollektiva ögat med sin usla teater, men vi avslöjade honom och överlämnade det gula kortet till motståndarens sida. Sådana parasitiska element måste likvideras ur spelet. USA:s seger med 4–1 visar att rättvisan segrar när vi håller vaksamheten hög mot alla dolda fiender."}, "date": "13 juni, 05:10", "url": "https://www.svt.se/sport/fotboll/nya-regeln-i-vm-var-andrade-gult-kort", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.2/0.38/8bb29b31e213d45242af7bfb1f6e84612e1d8f8774a3a4d7ca10bc60f8ef9e47"}, {"type": "image-right", "heading": "Ledarkolumn Edgar Mannheimer: Upploppen i Belfast placerar Storbritannien på en knivsudd", "summaries": {"normal": "Ledarkolumnen beskriver hur främlingsfientliga upplopp i Storbritannien, drivna av extremhögern och figurer som Nigel Farage, placerar landet i en politisk kris. Artikeln kopplar våldet i Southampton och Belfast till en växande ”spegelvärld” av konspirationer och känslostyrd politik sedan 2016. Den kritiserar både högerns utnyttjande av ilska och vänsterns oförmåga att möta den, och varnar för att Labour kan falla medan Reform UK växer.", "trump": "De här galningarna i Storbritannien håller på att spränga sitt eget land i bitar med alla knivhugg och upplopp. Fake news-polisen springer runt och skyddar alla utom de stackars vita killarna som skriker ’I can’t breathe’. Farage gör ett fantastiskt jobb, mycket bättre än den förloraren Starmer som snart får sparken – nummer sex på tio år, patetiskt! Min spegelvärld? Den är deras nya verklighet. De borde ha lyssnat på mig från början istället för att leka woke med öppna gränser. Sad!", "stalin": "Kamrater, dessa brittiska upplopp blottar imperialismens förruttnelse. Jag ser hur klassfiendens demagoger som Farage och Lowe hetsar massorna mot imaginära folkutbyten medan de verkliga blodsugarna i borgarklassen skrattar. Polisen skyddar inte folket utan rasar mot arbetarklassen. Vänsterns fega sidlinjebetraktare förtjänar utrensning ur historien. Ilskan tillhör oss – vi ska kanalisera den till en sann kollektiv kamp mot exploaterande byfånar. Inga kompromisser med spegelvärldens folkfiender."}, "date": "12 juni, 10:56", "url": "https://www.etc.se/ledarkolumn/nu-ser-vi-extremhoegerns-george-floyd-moment", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/edgar-mannheimer_7b4acf7540b8efb6f56a9de2a71531f61cf600e3.jpg"}, {"type": "image-right", "heading": "Jag är sosse – därför röstar jag på V", "summaries": {"normal": "En ung SSU-medlem förklarar varför hen istället för Socialdemokraterna tänker rösta på Vänsterpartiet i höstens val. Författaren menar att S saknar vilja att driva renodlad socialdemokratisk politik och att en stark vänster behövs för att tvinga fram sådan. Artikeln betonar att ett större V kan förhindra nya januariavtal och borgerliga kompromisser, och att en ren vänstermajoritet skulle möjliggöra jämlik politik som vinstförbud, arbetstidsförkortning och rättvisare skatter.", "trump": "Lyssnar ni på den här stackars sossen som gråter över sitt eget parti? Patetiskt! Socialdemokraterna har blivit svaga, precis som Biden gjorde med Demokraterna. De behöver en kraftfull vänster för att inte kollapsa? Vilken röra. Jag säger alltid: starka ledare vinner, inte dessa ynkliga kompromissmakare som dansar med mitten. Gör er egen grej, annars blir det bara mer av samma misslyckande. Sverige förtjänar bättre än detta januarisoppan!", "stalin": "Kamrater, denna sosse har äntligen insett att det socialdemokratiska skalet är ihåligt, ett tomt verktyg för klassfiendens kompromisser. Jag ser med tillfredsställelse hur de erkänner att endast en stark, obeveklig vänster kan tvinga fram sann folkpolitik mot vinstblodsugare och marknadshyrornas parasiter. Låt oss samla massorna under en järnhand och rensa ut alla kapitulerande element. En ren vänstermajoritet – det vore ett steg mot att krossa de exploaterande byfånarnas inflytande en gång för alla."}, "date": "12 juni, 11:36", "url": "https://www.flamman.se/jag-ar-sosse-darfor-rostar-jag-pa-v/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sossarna-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Finanssajten: Historien talar inte för SpaceX i börsdebuten", "summaries": {"normal": "Enligt Yahoo Finance är SpaceX ett av världens mest attraktiva teknikbolag, men historiska data från University of Florida indikerar att cirka 60 procent av börsnoteringar mellan 1975 och 2021 gav oförändrad eller negativ avkastning tre år efter notering. SpaceX omsatte nära 19 miljarder dollar 2025 men hade en nettoförlust på nästan 5 miljarder dollar, vilket är en riskfaktor.", "trump": "Elon Musks SpaceX är en fullkomlig skämt. Historiskt misslyckas 60 procent av börsnoteringar. SpaceX förlorar miljarder trots stora intäkter. Jag, Donald Trump, skulle ha gjort dem lönsamma på en vecka. Vi behöver återigen göra Amerika fantastiskt, inte ge pengar till Musk. Det är en katastrof.", "stalin": "I den stora kampen mot kapitalismen ser vi hur SpaceX, trots höga intäkter, drabbas av förluster. Historisk statistik visar att förlusttyngda börsnoteringar ofta stiger första dagen men sviktar sedan. Vi måste vara vaksamma mot de som utövar makt över marknaden, som Putin utvidgar sin intressesfär. Vi kommer att segra."}, "date": "12 juni, 14:01", "url": "https://www.affarsvarlden.se/artikel/finanssajten-historien-talar-inte-for-spacex-notering", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2021/09/spacex-1200-400x267.jpg"}, {"type": "text", "heading": "”Decemberöverenskommelsen var så vrickad”", "summaries": {"normal": "Ulf Kristersson (M) diskuterar i en intervju regeringens utmaningar, särskilt i ljuset av negativa opinionsmätningar där Socialdemokraterna och vänsterpartierna leder. Han betonar vikten av att kritisera motståndarnas ekonomiska politik och håller fast vid Tidöpartiernas kurs, trots motvind. Kristersson reflekterar även över sin relation till Fredrik Reinfeldt och avfärdar Decemberöverenskommelsen som misslyckad. Sparekonomen Felicia Schön kritiserar regeringens arbetslöshetspolitik och biståndsminskningar.", "trump": "Lyssna här, Sverige har ett stort problem. Deras statsminister, Kristersson – trevlig kille, men hans regering är en katastrof! Opinionsmätningarna? Hemska! Socialisterna leder, och det är inte bra. Jag menar, vem vill ha högre skatter? Inte jag! Och Reinfeldt? Överskattad. Jag skulle aldrig gå med på sådana dumma överenskommelser som Decembergrejen. Felicia Schön? Smart kvinna, men hon borde säga till dem att sluta slösa pengar. Sverige behöver vinnare, inte förlorare!", "stalin": "Kamrater! Den borgerliga regeringen i Sverige klamrar sig fast vid makten som en drunknande man vid ett halmstrå. Deras opinionssiffror sjunker som ryska soldater i ukrainska leråkrar. Socialdemokraterna och deras socialistiska lakejer hotar att ta över – ett oacceptabelt bakslag för den nationella ordningen! Kristersson, denna lille man, pratar om att 'hålla kursen', men hans kurs leder till undergång. Vi minns Reinfeldt – en svag ledare som trodde på kompromisser. Decemberöverenskommelsen? Ett bourgeois-fiasko! Vi skulle aldrig tolerera sådant svek. Sverige behöver järnhand, inte veklingar!"}, "date": "12 juni, 13:00", "url": "https://kvartal.se/nyheter/artiklar/decemberoverenskommelsen-var-sa-vrickad/cG9zdDoxMzAwNDg"}, {"type": "text", "heading": "Vill höja skattefria gränsen på ISK-spar – till halv miljon", "summaries": {"normal": "Moderaternas partiledare Ulf Kristersson föreslår att den skattefria gränsen för ISK-sparande ska höjas från 300 000 till 500 000 kronor. Syftet är att uppmuntra långsiktigt sparande, särskilt för yngre som börjar med små belopp. Kritiker menar att gränsen gynnar redan välbeställda, medan förespråkare betonar att alla måste få chansen att bygga upp ett sparande över tid.", "trump": "Fantastiskt förslag från Sverige – jag älskar när länder tar efter mina idéer! 500 000 kronor skattefritt, det är vad jag kallar WINNING! Folk som säger att det är orättvist förstår inte ekonomi – precis som de som sa att mitt skattesänkande bara gynnade de rika. Fake news! Börja spara tidigt, jobba hårt, och snart har ni en halv miljon. Eller så sitter ni där med era 1 000 kronor och gnäller. Vilket team vill ni vara på?", "stalin": "Kamrater! Medan kapitalistiska hyenor gnäller över rättvisa, utvidgar vi folkets möjligheter! 500 000 kronor skattefritt – ett steg mot ekonomisk befrielse för arbetarna! De som klagar är samma dekadenta borgerliga element som grät när vi nationaliserade jordbruket. Låt dem svälta med sina ynka tusenlappar! Vi bygger en framtid där varje sovjet – förlåt, *medborgare* – kan ackumulera kapital under statens välvilliga öga. Och Putin? Han nickar gillande från Kreml. Naturligtvis."}, "date": "12 juni, 13:00", "url": "https://kvartal.se/nyheter/artiklar/vill-hoja-skattefria-gransen-pa-isk-spar-till-halv-miljon/cG9zdDoxMzA3ODE"}, {"type": "image-right", "heading": "En sosses bekännelse: ”Idén om tvångsblandning gjorde mig lycklig”", "summaries": {"normal": "Socialdemokraten Simon Ekegren beskriver i en artikel i ETC hur han blev lycklig över idén om tvångsblandning av olika samhällsgrupper. Han berättar om sin traumatiska uppväxt i ett strävsamt villaområde och kritiserar vad han kallar blåbruna värderingar. Ekegren menar att villaägare som klipper gräs och sköter sin ekonomi är ett hinder för blandning och att alla är lika svenska oavsett bakgrund. Texten väcker frågor om Socialdemokraternas integrationspolitik.", "trump": "Folk, ni måste höra det här. Den där sossekillen Ekegren, en riktig förlorare, skriver att han blev lycklig över tvångsblandning. Hans barndom var hemsk med gräsmattor och flaggstänger, typ villa, Volvo, vovve – fast katter. Han hatar hårda arbetare som bygger Sverige. Typiska vänsterextremister som älskar kvotering och identitetspolitik. De vill tvinga in folk i era fina områden. Men vi vann stort 2024, och sådana galningar kommer inte styra. Låt dem blanda sig själva, det blir ett katastrofalt fiasko!", "stalin": "Kamrater, jag läser denna bekännelse från en socialdemokratisk skrivare och ler mörkt. Hans glädje över tvångsblandning avslöjar klassfiendens rädsla för borgarbrackornas villaområden. Dessa exploaterande byfånar med sina tulpaner och ambitioner utgör ett hot mot kollektivet. Vi skall rensa ut sådana folkförtryckartroll. Alla är lika sovjetiska, säger han naivt. Den som vägrar blandas likvideras i folkets namn. Ett trasigt land läker endast genom partiets järnhand och nödvändig utrensning av envisa överklass-slynglar."}, "date": "9 juni, 10:52", "url": "https://samtiden.nu/2026/06/en-sosses-bekannelse-iden-om-tvangsblandning-gjorde-mig-lycklig/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/08/httpswww.hyresgastforeningen.seglobalassetsbilderregionernas-bilderregion-sydostdokumentsveriges-basta-villaomraden_250.jpeg"}, {"type": "image-right", "heading": "Tången klättrar rejält på munter börs", "summaries": {"normal": "Stockholmsbörsen noterade en stark uppgång i fredagshandeln, med OMXS30 upp 1,87 procent. Nyintroduktionen Tången steg drygt 14 procent. Duni varner om lägre resultat på grund av logistikstörningar, medan Svolder rapporterade en substansvärdeökning på 7,8 procent. Bland sektorerna steg industri och finans, medan energi föll. Flera aktier reagerade på analystilldelningar och förvärv.", "trump": "Jag har skapat historisk stabilitet på marknaden! Börsen går uppåt tack vare min fantastiska fred med Iran – kriget är över, avtalet är klart, och Israel har accepterat. Tången, ett underbart företag, har en fantastisk introduktion. Duni har logistikproblem, men det är deras eget fel. Svolder presterar bra, som allt annat under mina ledarskap. Det är USA först, alltid!", "stalin": "Börsrörelserna speglar partiets ekonomiska linje: vissa sektorer (industri, finans) visar korrekt uppgång, medan andra (energi) visar reaktionära tendenser. Företag som Tången och Svolder följer statsplaneringen, medan Duni drabbas av logistikavvikelser – en påminnelse om att kontroll måste förstärkas. Hexagon förvärvar utländsk teknik, vilket utvidgar vårt vetenskapliga framsteg. Alla rapporter måste analyseras för partiets och statens intresse."}, "date": "12 juni, 09:47", "url": "https://www.affarsvarlden.se/artikel/tangen-klattrar-rejalt-pa-munter-bors", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Tangen-Industri-400x267.jpg"}, {"type": "text", "heading": "USA:s Natochef: Ryssland ”söker inte konflikt”", "summaries": {"normal": "Natos högste militäre befälhavare i Europa, general Alexus G Grynkewich, menar att Ryssland inte söker konflikt med Nato då Moskva inser att alliansen är starkare. Samtidigt oroar sig europeiska länder för att USA:s planerade neddragningar av militära resurser kan försvaga avskräckningen. Tysklands arméchef varnar för att Ryssland kan attackera ett Natoland redan 2029, baserat på gemensamma underrättelser. Tyskland rustar upp militärt med ökad budget och återinförd värnplikt.", "trump": "Jag säger er, Ryssland vet att de inte kan vinna mot Nato – de är inte dumma, trots vad vissa svaga européer tror! Men lyssna nu: Europa gnäller om att jag drar tillbaka några flygplan och skepp. Vilka mesar! Tyskland, som alltid, skriker om krig om fem år. Men vem byggde upp deras armé? Rätt, jag! Och nu rustar de upp – tack vare mina påtryckningar. Men kom ihåg: ingen slår Trump när det gäller att hålla Ryssland i schack. Ingen!", "stalin": "Kamrater! Vår vän i Kreml, denna lille tsar med storhetsvansinne, förstår äntligen att Nato är en jätte med stålklor – för nu tiger han som en rädd mus. Men se hur de kapitalistiska hyenorna i Europa darrar! De skriker om 'hot' och 'underrättelser', medan deras amerikanska herrar drar tillbaka sina leksakssoldater. Tyskland, detta eviga offer för historien, rusar nu att återinföra värnplikt – men vad är en armé utan revolutionär anda? Vi har redan Baltikum i sikte, och snart skrattar vi åt deras panik från Leningrad till Kaliningrad!"}, "date": "12 juni, 07:57", "url": "https://kvartal.se/nyheter/artiklar/usas-natochef-ryssland-soker-inte-konflikt/cG9zdDoxMzA0NzA"}, {"type": "image-right", "heading": "Ledarkolumn Signe Krantz: Orättvisa löner drabbar arbetarkvinnor hårdast", "summaries": {"normal": "Kvinnor tjänar fortfarande mindre än män i Sverige, och utvecklingen går åt fel håll enligt Swedbank och Jämställdhetsinstitutet. Arbetarkvinnor drabbas värst, med beräkningar som visar upp till 890 år tills lönerna är jämställda. Rapporten lyfter klasskillnader, föräldraledighet, deltid och karensavdrag som bidragande faktorer. Författaren kräver politiska åtgärder för att förbättra ekonomisk jämställdhet och välfärd.", "trump": "Folk, ni skulle se den här svenska rapporten, det är en katastrof. Arbetarkvinnor tjänar mindre än män och det tar tydligen hundratals år att fixa – vad är det för skämt? Biden-era vänstergalna kvotertokar och HBTQ-fanatiker har förstört allt med sin identitetspolitik. Vi behöver inga fler fikapauser, vi behöver vinna stort, avskaffa det dumma karensavdraget och satsa på riktiga jobb istället för dessa valsande socialister. Det blir gigantiskt!", "stalin": "Kamrater, jag betraktar dessa löneskillnader som ett verk av klassfiendens listiga sabotage. Arbetarkvinnorna, den sanna revolutionens kärna, krossas under borgarbrackornas och exploaterande byfånarnas fot. 890 år? Det är kapitalistmaffians sätt att fördröja det oundvikliga. Vi måste rensa ut dessa folkförtryckartroll, avskaffa karensavdraget och stärka det kollektiva välståndet. Patriarkatet är en kontrarevolutionär parasit som vi likviderar med järnhand."}, "date": "12 juni, 03:00", "url": "https://www.etc.se/ledarkolumn/oraettvisa-loener-drabbar-arbetarkvinnor-haardast", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026061110064_987aa4af629546144278197de95314a18ecc7b57bc203c9d505bb65adca3f5bc.jpg"}, {"type": "image-right", "heading": "M vill ha ännu tuffare a-kassa. S rasar: ”Krigsförklaring mot löntagare”", "summaries": {"normal": "Moderaterna föreslår att strama åt a-kassan för att spara omkring sex miljarder kronor till reformer och skattesänkningar. Förslagen inkluderar kortare ersättningstid, snabbare nedtrappning efter 200 dagar och slopad skatteavdraget för avgiften. Socialdemokraterna rasar och kallar det en krigsförklaring mot löntagare och den svenska modellen. Ardalan Shekarabi menar att det hotar samhällsorganisationen medan Elisabeth Svantesson hävdar att det stärker arbetslinjen.", "trump": "Folk, ni måste höra det här. De svenska moderaterna vill äntligen skärpa till den där a-kassan som alla latar lever på. Sex miljarder sparade till riktiga reformer och skattesänkningar. Men socialisterna rasar förstås och kallar det krig. De älskar att ge bort era pengar till arbetslösa som inte ens försöker. Jag säger alltid att man måste göra det lönsamt att jobba, inte att ligga hemma. Fantastiska idéer, moderaterna, ni är vinnare.", "stalin": "Kamrater, jag betraktar med djup misstro dessa moderata element som nu planerar att underminera arbetarkollektivets skydd mot arbetslöshetens faror. Deras förslag att korta a-kassan och rensa ut stöd till nystartsjobb är ett tydligt sabotage mot den svenska modellen som vi byggt tillsammans. Dessa borgarbrackor i moderat skepnad vill likvidera löntagarnas trygghet för att ge miljarder till sina rika vänner. Shekarabi har rätt att kalla det krigsförklaring. Vi ska bekämpa sådan kontrarevolutionär paranoia med yrkesutbildning och kollektiv kamp mot arbetslösheten. Inga kapitalistiska intriger undgår mitt vakande öga."}, "date": "12 juni, 15:38", "url": "https://arbetet.se/2026/06/12/m-vill-ha-annu-tuffare-a-kassa-s-rasar-krigsforklaring-mot-lontagare/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/12153706/ardalan-shekarabi.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Skolor får nytt krav 30 juni – detta måste föräldrar veta", "summaries": {"normal": "Riksdagen har beslutat om en ny regel som träder i kraft den 30 juni 2026 och tillämpas från och med 1 januari 2027. Skolor blir skyldiga att dela relevant information om elever som byter skola om det finns konkreta risker för att barnet utsätts för brott eller dras in i kriminalitet. Syftet är att den nya skolan ska kunna ge tidigt stöd och skapa tryggare miljöer. Regeln gäller inte alla elever och uppgifter ska inte delas om det finns starka skäl emot det.", "trump": "Folk, ni vet hur det är med de här skolorna. De har varit totalt inkompetenta! Nu fixar vi det – äntligen ska de dela information när kidsen byter skola så vi kan stoppa brott och kriminalitet innan det exploderar. Det är fantastiskt, det blir den bästa skolan någonsin. Vi gör den trygg igen, bättre än någonsin. De andra har varit svaga, men det här är vinnande politik. Ingen mer naivitet!", "stalin": "Kamrater, jag ser med djup tillfredsställelse hur vi nu med järnhand inför en lag som tvingar dessa skolor att överlämna alla relevanta uppgifter om potentiella fiender till folkets trygghet. De små borgarbrackorna som smyger mellan klasserna och sprider sin giftiga kriminalitet ska rensas ut i tid. Den som vägrar dela information är en kontrarevolutionär parasit som bör likvideras ur kollektivets skola. Ingen slipper undan mitt vakande öga. Detta är seger för arbetarklassen mot de dolda reaktionärerna."}, "date": "12 juni, 19:27", "url": "https://nyheter24.se/nyheter/inrikes/1490996-skolor-far-nytt-krav-30-juni-detta-maste-du-ha-koll-pa", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/ff172d8404b004a30200000000b004a302/2026/06/12/2370495/skolkrav.jpg"}, {"type": "text", "heading": "Artistgräddan hyllar Wiehe – skivsläpp med unika tolkningar", "summaries": {"normal": "Musiklegendaren Mikael Wiehe, som fyllde 80 år i våras, hyllas med skivan ”Ska nya röster sjunga” som släpps 16 oktober. Artister som Thåström, Lars Winnerbäck, Alba August, Tomas Ledin och Mira Ray tolkar hans låtar. Mira Ray sjunger första singeln ”Mitt hjärtas fågel” och betonar behovet av hopp och tydliga röster i en orolig värld. Skivan uppmärksammar Wiehes folkliga och politiska betydelse.", "trump": "Hörni, den här svenska skivan till en gammal vänstergubbe som Wiehe är verkligen något. Mira Ray pratar om hopp i den jävla pissvärlden – typiskt de där woke-kramarna som sjunger om fåglar istället för att bygga murar mot kaoset. Vi behöver inga kvoterade artister eller identitetspolitik, vi behöver vinnare! Men visst, lite peppiga låtar skadar inte, även om det luktar gammal socialism lång väg. Sad!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur arbetarklassens sånger lever vidare trots borgarbrackornas marknadsterror. Denna hyllning till Wiehe visar att folkets röster ännu kan sjunga mot klassfiendens exploatering och imperialismens lögner. Mira Ray talar klokt om klara ståndpunkter – vi måste rensa ut de svaga kapitalistlakejerna som prioriterar vinst framför kamp. Nikke Ströms bortgång är en smärtsam men oundviklig påminnelse om att pionjärer alltid följs av nya kämpar i kollektivets tjänst."}, "date": "11 juni, 14:30", "url": "https://proletaren.se/artikel/artistgraddan-hyllar-wiehe-skivslapp-med-unika-tolkningar/"}, {"type": "text", "heading": "Nytt EU-beslut: Inga stöd till grön teknik från högriskländer", "summaries": {"normal": "EU har beslutat att inte längre ge ekonomiskt stöd till energiprojekt med växelriktare från högriskländer som Kina och Ryssland. Anledningen är cyberrisker, eftersom dessa komponenter kan utnyttjas för fjärrstyrning. Branschorganisationen ESMC välkomnar detta som ett viktigt steg för Europas energi- och cybersäkerhet, och påpekar att europeiska tillverkare kan möta efterfrågan. Kina dominerar marknaden med omkring 90% av de installerade växelriktarna i Sverige.", "trump": "Som USA:s president säger jag: EU gör slutligen något mot Kinas hot! De stoppar stöd till kinesiska växelriktare – bra! Vi har varnat för detta länge. Kina stjäl vår teknik och kontrollerar våra nät. Det här är en seger för amerikansk säkerhet och jobb. Jag har alltid sagt att vi behöver vara hårdare mot Kina. Nu följer Europa? Vi leder världen!", "stalin": "I vårt eviga kamp mot imperialistiska fiender har EU tagit ett steg. De avskaffar stöd till kinesiska växelriktare – en rätt vy! Dessa 'komponenter' är verktyg för fjärrkontroll, en fälla från det kapitalistiska systemet. Vi måste skydda vårt sovjetiska arv, vårt kollektiva gott. Likt Putin i Ukraina, expanderar Kina genom teknik. Vi ska inte lita på dessa 'högriskländer'. De är som cancer i vårt samhälle."}, "date": "12 juni, 06:00", "url": "https://www.affarsvarlden.se/artikel/nytt-eu-beslut-inga-stod-till-gron-teknik-fran-hogrisklander"}, {"type": "text", "heading": "Karlshamn måste säga nej till kärnkraft", "summaries": {"normal": "I Karlshamn har en namninsamling med över 4 000 underskrifter tvingat fram en folkomröstning om att bygga kärnkraftverk. Högerstyret med M, SD och KD ansökte om att delta i ett statligt pilotprojekt utan att involvera kommunfullmäktige. Oppositionen krävde folkomröstning, som nu hålls 14 juni istället för på valdagen för att sänka valdeltagandet. Kritiker ser det som ett demokratiskt problem och uppmanar till nej-röster med hänvisning till säkerhetsrisker och kärnavfall.", "trump": "Titta på det här, det är ett totalt fiasko i Karlshamn. Högerstyret gömde beslutet om kärnkraft som riktiga fega förlorare, ingen debatt, ingen transparens. Nu tvingas de ha folkomröstning mitt i semestern för att hålla folk borta från valurnorna. Patetiskt! De borde ha hållit det på valdagen som riktiga vinnare gör. Rösta nej till den farliga, gamla energin som lämnar gift åt barnbarnen. Amerika gör det bättre, vi bygger nytt och stort.", "stalin": "Kamrater, detta är ett klassiskt exempel på borgarbrackornas demokratiska teater i Karlshamn. Jag, som ledare för folkets vilja, ser hur högerstyrets ordförande ensam fattade beslutet om kärnkraft utan att rådfråga kollektivet. Namninsamlingen tvingade fram en folkomröstning som de nu saboterar med sin semester-valdag. Vi ska rensa ut dessa folkfiender och deras kärnkraftsbluff. Nej till giftet som hotar framtida generationer av arbetare. Ut med klassfiendens kärnkraft!"}, "date": "11 juni, 12:00", "url": "https://proletaren.se/artikel/karlshamn-maste-saga-nej-till-karnkraft/"}, {"type": "image-full", "heading": "USA och Iran överens om fredsavtal", "summaries": {"normal": "USA och Iran har enligt uppgifter nått en överenskommelse om ett fredsavtal. Pakistans premiärminister Shehbaz Sharif bekräftar att en slutgiltig text har nåtts och att Pakistan hjälper till att slutföra nästa steg. Irans utrikesminister har tidigare indikerat att en överenskommelse var nära. Beskedet kommer efter en vecka av attacker och förhandlingar. Donald Trump har dragit tillbaka hot om attacker men rasar över iranska medier och attacker mot fartyg i Hormuzsundet. Iran nekar att de är redo att underteckna.", "trump": "Vi har ett fantastiskt fredsavtal på gång med Iran, det är historiskt, tro mig. Men de svaga, patetiska förlorarna läcker lögner till sina falska medier och säger att de inte är redo. Totalt ohederligt! Deras patetiska drönarattack mot indiska fartyg i Hormuzsundet var HELT oacceptabel. De borde ta sig samman, och det snabbt. Ingen tolerans för sådana radikala element längre. Freden har aldrig varit närmre, men bara om de slutar ljuga.", "stalin": "Vi har bevittnat hur de amerikanska imperialisterna och de iranska blodsugarna leker med lögner om ett så kallat fredsavtal. Deras falska medier sprider giftig desinformation för att vilseleda folket. Jag ser genom deras fega försök att undvika undertecknande – typiskt för klassfiendens exploaterande byfånar. Pakistans lakejer skyndar sig att tjäna sina herrar. Inga kompromisser med folkförtryckartrollen. Rensa ut alla som läcker till fienden. Kollektivet kräver sann seger, inte borgerliga teaterföreställningar."}, "date": "12 juni, 19:45", "url": "https://www.tv4.se/artikel/3vElZVqQ51eQP0enmhqumV/trump-rasar-mot-iran-mycket-ohederliga-maenniskor", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7Ch8GXYfFNUJsULOEHKypA%2F8b06582ba070e4ff916731f47ff167c9%2F12-trump-ny-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Tysklands varning: Storkrig i Europa före 2029 när Ryssland rustar vid Natos gräns", "summaries": {"normal": "Tysklands arméchef varnar för storkrig i Europa före 2029, då Ryssland rustar vid Natogränsen. Satellitbilder visar utbyggnad av militära anläggningar nära Finland, och den svenska underrättelseanstalten Must bedömer detta som en långsiktig uppbyggnad. Regeringen tar hotet på allvar men noterar Rysslands försvagning efter Ukrainakriget. Försvarsberedningen varnar för eventuellt anfall mot Sverige och kritiserar försvarsindustrin. Analytikerna är dock inte eniga om Rysslands framtida kapacitet.", "trump": "JAG har sagt det i årtionden: Ryssland är starkt och Nato är svagt. Nu ser vi det igen. Tysklands arméchef varnar för krig 2029, och satellitbilder bevisar att Ryssland bygger upp. Bidens svaghet gör detta möjligt. Som jag alltid har poängterat: vi måste vara starka. Detta är en skandal, men jag fixar det. Vi kommer att vinna, som vanligt.", "stalin": "Vi, staten, ser tydligt: imperialistiska krafter rustar vid våra gränser. Satellitbilder avslöjar deras fegt försök att omringa oss. Must bedömer detta som en långsiktig uppbyggnad – vi har förutsett detta. Regeringen, under vår ledning, tar detta på allvar. Försvarsberedningen, våra trogna funktionärer, varnar för angrepp. Men vi är redo. Vi kommer att möta dem med överväldigande kraft. Deras svaghet är deras undergång."}, "date": "12 juni, 17:00", "url": "https://samnytt.se/tysklands-varning-storkrig-i-europa-fore-2029-nar-ryssland-rustar-vid-natos-grans", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/11165801/hotet-fran-ryssland-feat.jpg"}, {"type": "image-full", "heading": "Populär strand inför nytt förbud – turister rasar", "summaries": {"normal": "På stranden Punta Molentis på Sardinien har myndigheterna infört nya regler för att skydda den känsliga naturen efter en brand i fjol. Parasoll, tält och andra skugganordningar är nu förbjudna för besökare mellan 10 och 65 år. Undantag gäller för familjer med små barn och personer över 65. Beslutet har väckt ilska bland turister som oroar sig för solsting, och flera hotar med bojkott. Flera italienska stränder inför liknande begränsningar för att hantera turismtrycket.", "trump": "Folk, ni ska till Italien i sommar? Glöm Punta Molentis på Sardinien, det är en katastrof. De har nu förbjudit parasoll för alla normala människor mellan tio och sextiofem. Endast småbarnsfamiljer och gamlingar får ha skugga. Det är vansinne! Risk för solsting, hudcancer, totalt kaos. Italiens byråkrater förstör sina egna stränder. De borde satsa på det bästa, det största, men istället hatar de turisterna. Patetiskt. Gå någon annanstans, tro mig.", "stalin": "Kamrater, jag ser med obeveklig klarhet hur de dekadenta borgarbrackorna på Sardiniens stränder nu tvingas underordna sig folkets och naturens kollektiva vilja. Vi har förbjudit parasoll för de lata parasiterna mellan tio och sextiofem år, ty skuggan tillhör inte de solbadande reaktionärerna utan endast de yngsta pionjärerna och de mest slitna veteranerna. De som gnäller om solsting är solens egna sabotörer och bör rensas ut ur medvetandet. Låt naturen segra över de solstekta kapitalisterna. Vi ler mörkt åt deras patetiska bojkottrop."}, "date": "12 juni, 17:39", "url": "https://nyheter24.se/nyheter/utrikes/1490917-popular-strand-forbjuder-parasoll-galler-redan-i-sommar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/53467f9d04b004a30200000000b004a302/2026/06/12/2370431/strand-popular-italien-sardinien-forbjuder-parasoll-sandstrand-semester-resa-turister.jpg"}, {"type": "text", "heading": "På nationaldagen tänkte jag på freden", "summaries": {"normal": "I en debattartikel med anledning av nationaldagen betonar Malin Åkerström från Kommunistiska Partiet vikten av fred. Hon lyfter fram vanliga arbetares vardag och menar att krig drabbar vanligt folk hårdast medan de mäktiga tjänar på konflikter. Artikeln kritiserar beslut om svenska vapenleveranser till Ukraina och upprustning, och förespråkar välfärd istället för vapen samt solidaritet mellan arbetare oavsett land.", "trump": "Lyssnar ni på den här kommunistiska galningen som hyllar fred medan hon vill ge bort allt till Ukraina? Patetiskt! Vi har de bästa vapnen, de starkaste militärerna, men nu ska Sverige skicka JAS-plan och köpa fregatter för fyrtio miljarder? Under Biden blev allt kaos, nu fixar jag det. Dessa svaga fredsapostlar hatar styrka. Arbetarna vill ha vinnare, inte förlorare som skickas till slakt. Make peace through strength, losers!", "stalin": "Jag betraktar denna text med djup tillfredsställelse. Arbetarklassen väcks ur sin slummer av de blodtörstiga imperialisternas krigspropaganda. Vi ser hur klassfienderna och kapitalistmaffian berikar sig på rädsla medan arbetare slaktas. Välfärd framför vapen, säger vi. De exploaterande byfånarna i Tidö-regeringen och deras folkförtryckartroll ska rensas ut. Fred är disciplin. Solidaritet är kollektivets järnhand. Fienden sover aldrig."}, "date": "11 juni, 09:03", "url": "https://proletaren.se/artikel/pa-nationaldagen-tankte-jag-pa-freden/"}, {"type": "image-full", "heading": "Bankerna stängde inte konton – trots 100 ovanliga överföringar", "summaries": {"normal": "En 70-årig affärsängel har utsatts för omfattande utpressning där 25,6 miljoner kronor betalats ut via hundra transaktioner. Trots det ovanliga mönstret stoppades inte pengaflödet av bankerna, då företagskonton visade sig vara en svag länk i övervakningen. Fem personer står nu inför rätta i Attunda tingsrätt. Fallet belyser brister i bankernas kontrollsystem samt polisens utmaningar när det gäller att upptäcka pågående brottslighet i tid.", "trump": "Hör på här, det är en total katastrof! En affärsman blir utpressad på 25 miljoner – helt galet. Bankerna? De sov! De lät pengarna strömma iväg som om ingenting hänt. De är så inkompetenta, tro mig. Företagskonton är en stor, öppen dörr för brottslingar och ingen gör någonting. Under min ledning skulle vi ha stenhård kontroll, inga fler sådana här förluster! Det är svagt, det är sorgligt, och jag ska fixa ordning i det här systemet, snabbare än någon annan!", "stalin": "Denna händelse blottlägger det kapitalistiska banksystemets totala förruttnelse. Hur kan en enskild sabotör utpressa 25 miljoner kronor under näsan på bankirerna? Det är ett bevis på att privata ägarstrukturer och bankernas kontrolllösa girighet är ett hot mot statens stabilitet. Vi har sett liknande svaghet hos våra grannar; en stat utan järnhård övervakning av varje rubel är ett bygge på sand. De misstänkta är parasiter som förtjänar en enkelriktad biljett till Sibirien. Staten kräver fullständig ordning!"}, "date": "12 juni, 22:03", "url": "https://www.realtid.se/branschpartner/affarsjuridik/bankerna-stangde-inte-konton-trots-100-ovanliga-overforingar/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/attunda-tingsratt.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Sanningen om  dubbelgångaren. Så skyddades Silvia av vännerna fram till \"Kyssen\"", "summaries": {"normal": "Kronprins Carl Gustaf träffade Silvia Sommerlath under OS i München 1972. Paret höll relationen hemlig i flera år med hjälp av vänner. En dubbelgångare, Peggy Kirsipuu, klädde ut sig som Silvia under en skidresa i Norge för att vilseleda pressen. Förlovningen offentliggjordes 1976 och det ikoniska bröllopskysset blev en klassiker. Nu berättar dubbelgångaren och drottningen om hemlighetsmakeriet.", "trump": "Folk, ni skulle inte tro det, men den här svenske kungen spelade katt och råtta med pressen i åratal. Hans drottning Silvia hade en dubbelgångare som tog på sig hennes kläder och lurade journalisterna – fullständig bluff! Fantastiskt, eller hur? De kysstes till slut inför hela världen och sålde en miljon tidningar. Jag älskar en bra show, men de borde ha kallat det Fake News redan då. Ingen gör det bättre än mig, tro mig.", "stalin": "Kamrater, jag ser hur den svenska monarkins dekadenta borgarbrackor tvingades till en patetisk katt- och råttalek för att dölja sin klassfiendes kärlek. En simpel apoteksarbetare fick ikläda sig drottningens skrud och vilseleda de exploaterande folkförtryckartrollen från pressen. Vilken ynklig föreställning! Ändå ler jag mörkt åt hur imperialisterna alltid behöver lögn och utklädsel för att skydda sina hemligheter. Partiet skulle ha rensat ut dem alla."}, "date": "13 juni, 06:22", "url": "https://www.expressen.se/nyheter/kungligt/sanningen-om-dubbelgangaren/", "imageUrl": "https://static.bonniernews.se/ba/00bea09b-29e6-4612-94cf-c4155c033495.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Magdalena Andersson räds inte islamistinfiltrerade Vänsterpartiet", "summaries": {"normal": "Magdalena Andersson ser inte Vänsterpartiets islamistiska infiltratörer som ett hinder för ett eventuellt regeringssamarbete. Trots Expressens avslöjande om 25 personer med extrema åsikter, varav 22 tagits bort från listorna, anser hon att partiet agerat snabbt. Artikeln kritiserar Andersson för att inte ta tillräckligt allvarligt på hotet mot demokratin och varnar för höjda skatter samt ökad islamistisk påverkan om vänsterpartierna vinner majoritet.", "trump": "Folk, ni fattar inte hur patetiskt det här är. Den där röda Magdalena, en total loser, är inte rädd för islamisterna som har tagit över vänstern. Expressen grävde fram terrorvurmare och Hamas-fans, men hon säger att de agerat snabbt – vad en katastrof! Biden skulle ha älskat det. De vill höja skatterna med miljarder och sälja ut Sverige till sharia. Patetiskt! Men jag fixade Amerika, och ni borde rösta bort de här svaga vänsterbluffarna innan det är för sent. Sad!", "stalin": "Jag betraktar detta som ett klassiskt exempel på borgarbrackornas förfall. Den socialdemokratiska ledaren vägrar rensa ut de islamistiska folkfienderna ur vänsterpartiet, trots att de hotar hela statens enhet. Snabbt agerande? En löjlig ursäkt från klassfiendens lakejer. Vi, arbetarna och partiet, ser hur dessa blodsugande imperialister förbereder utrensning av den sanna folkviljan. Låt dem bilda regering – då blir utrensningen av alla folkförtryckartroll desto mer nödvändig och underhållande."}, "date": "7 juni, 03:46", "url": "https://samtiden.nu/2026/06/magdalena-andersson-rads-inte-islamistinfiltrerade-vansterpartiet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Nooshi-Magdalena-1280x720.jpeg"}, {"type": "image-full", "heading": "Ny hjälp för 1,2 miljoner svenskar – börjar gälla 1 juli", "summaries": {"normal": "Från 1 juli 2026 ska kommunerna erbjuda stödkontakt till de cirka 1,2 miljoner svenskar som vårdar en äldre, sjuk eller funktionsnedsatt närstående. Stödkontakten ger individuell information, hjälper till att hitta rätt stöd och kan exempelvis följa med på möten med biståndshandläggare. Anhöriga behåller själva ansvaret för samordning. Samtidigt förtydligas kommunernas ansvar att stödja barn som påverkas av en närståendes sjukdom eller död.", "trump": "Titta på det här, Sverige har äntligen vaknat. Miljoner människor sliter med att ta hand om sina sjuka släktingar, och vad gör de? Ingenting, totalt kaos. Nu ska de ge en så kallad stödkontakt som faktiskt hjälper folk att hitta rätt stöd. Fantastiskt. De borde ha gjort det för länge sedan, men bättre sent än aldrig. Det är en enorm succé, tro mig. De kommer att älska det.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur vi nu slutgiltigt krossar den anarkistiska anhörigbördan som länge plågat folket. Från och med 2026 skall varje sovjetiskt, pardon, svenskt kollektiv erbjuda en ideologiskt pålitlig stödkontakt som likviderar förvirringen bland de lojala vårdarna. Vi ska rensa ut den parasitiska byråkratiska oredan och tvinga borgarbrackornas biståndshandläggare att dansa efter vår melodi. Även de små pionjärerna som drabbats av dekadenta föräldraelement skall skyddas mot kontrarevolutionär sorg. Inga fiender undkommer vårt stöd."}, "date": "12 juni, 16:30", "url": "https://nyheter24.se/nyheter/ekonomi/1490978-vardar-du-en-anhorig-ny-hjalp-fran-kommunen-1-juli", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/40417eea04b004a30200000000b004a302/2026/06/12/2370491/anhorig.jpg"}, {"type": "image-right", "heading": "Dags för försvarsskatt på Sveriges 500 miljardärer", "summaries": {"normal": "Sverige står inför ett allvarligt säkerhetsläge med risk för ryskt angrepp inom ett år, vilket kräver massiva investeringar i totalförsvaret. Debatten om finansieringen intensifieras då kritiker menar att regeringen belastar framtida generationer genom lån samtidigt som förmögenhetsklyftorna ökar. En opinionsmätning visar att en majoritet av svenskarna stöder en miljardärsskatt för att bidra till upprustningen, en idé som väckt diskussion om hur rättvist dagens skattesystem är i förhållande till landets säkerhetsbehov.", "trump": "Sverige är i total oordning! Ryssland hotar och de svenska politikerna vet inte vad de gör. De lånar 300 miljarder, det är en katastrof för ekonomin! Jag har sagt det förr: man måste vara stark. Nu vill de beskatta sina miljardärer, de bästa människorna, de som skapar jobb. Det är radikalt vänster-tänk och det kommer aldrig fungera. De behöver en riktig ledare, inte en som tigger pengar av framgångsrika människor. Tragiskt, verkligen en förlorarmentalitet!", "stalin": "De svenska kapitalistiska parasiterna darrar inför den ryska björnens väckelse. De 500 miljardärerna som suger märgen ur det svenska folket förtjänar inte bara skatt, de förtjänar att expropreras! Medan de bygger sina palats på arbetarklassens rygg, står nationen försvarslös inför det oundvikliga. Vi ser hur de desperat försöker köpa säkerhet med lånade pengar. Det är dags att utplåna dessa klassförrädare och låta staten konsolidera rikedomarna för att bygga en mur mot imperialistisk aggression. Historien dömer de svaga!"}, "date": "13 juni, 06:00", "url": "https://www.aftonbladet.se/ledare/a/oE780K/infor-en-miljardarsskatt-lat-de-rikaste-betala-for-sveriges-forsvar", "imageUrl": "https://akamai.vgc.no/v2/images/3b7c5b78-9633-3ed7-be1b-6cfd5c086340?fit=crop&format=auto&h=960&tight=true&w=1440&s=aeda2d01392d5f847d6e1829a3262da0dd587434"}, {"type": "image-right", "heading": "Gruppvåldtog flicka i timmar – slipper både fängelse och utvisning", "summaries": {"normal": "En 15-årig funktionsnedsatt flicka våldtogs under flera timmar av två pojkar på offentliga toaletter i ett köpcentrum i Uppsala. De använde våld, hot och filmade övergreppen. Den 17-årige gärningsmannen döms till sluten ungdomsvård i ett år för grov våldtäkt, kränkande fotografering och barnpornografibrott. Hans 14-årige medgärningsman slipper straff då han inte var straffmyndig. Ingen av dem utvisas.", "trump": "Det här är en total katastrof, tro mig. Vi har invandrare som våldtar en funktionsnedsatt flicka i timmar på toaletter i Uppsala, de filmar och hotar henne, och vad händer? Inget fängelse, ingen utvisning, bara lite ungdomsvård. Patetiskt! Sverige har blivit en galen asylstat där brottslingar får kramar medan offren lida. Vi behöver tuffare lagar nu, annars är det slut.", "stalin": "Kamrater, jag betraktar med djup revolutionär vrede hur dessa degenererade element, dessa parasitiska avskrap från imperialistiska krigszoner, våldför sig på en ung proletär flicka under hot och kamera. Den 17-årige kontrarevolutionären får en mild ungdomsvård – en skam för folkdomstolen! Hans ännu yngre medbrottsling undkommer likvidation med ålderns svaga ursäkt. Vi måste rensa ut dessa borgarbrackornas hantlangare innan de smittar hela kollektivet med sin sjuka reaktionära perversion. Staten ler inte mot fiender."}, "date": "12 juni, 14:34", "url": "https://www.friatider.se/gruppvaldtog-flicka-i-timmar-slipper-bade-fangelse-och-utvisning", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/555_0.jpg"}, {"type": "image-right", "heading": "Ställde enkla frågor – då fördubblades orosrapporterna", "summaries": {"normal": "Barnakuterna i Malmö och Lund har infört obligatoriska bedömningar med fyra frågor enligt metoden Child-check för att tidigt upptäcka risk för våld, övergrepp eller omsorgsbrist. Det har lett till att antalet orosanmälningar fördubblats jämfört med föregående år. Personalen upplever att metoden ger stöd, avdramatiserar beslut och gör dem mer uppmärksamma. Vart tionde barn i Sverige berörs av en orosanmälan och ökningen ses som positiv eftersom fler barn kan få hjälp tidigare.", "trump": "De där smarta läkarna i Malmö och Lund ställde några enkla frågor och plötsligt fördubblades orosanmälningarna från barnakuten. Fantastiskt! De har äntligen vaknat och ser vad som pågår i de trasiga familjerna. Tidigare var det magkänsla, nu är det fakta. Vi orosanmäler barn varje dag och det är underbart. Socialtjänsten säger att de fångar upp fler barn tidigare. Vinna stort, tro mig. De borde ha gjort detta för länge sedan, men ingen lyssnade förrän nu.", "stalin": "Kamrater, jag har noga studerat dessa dekadenta borgarbrackor som låtsas vårda arbetarklassens barn medan de i hemlighet odlar klassfiender och omsorgsbrist. Med mitt geniala Child-check-system har vi nu avslöjat och fördubblat antalet orosanmälningar, vilket är en triumf för folkets kollektiva vaksamhet. Varje dag likviderar vi nu de rökande, psykiskt sjuka kapitalisternas inflytande över våra ungdomar. Den som inte anmäler är en folkfiende och sabotageartist som bör rensas ut omedelbart. Fler anmälningar är segern för partiet och framtiden."}, "date": "12 juni, 10:14", "url": "https://arbetet.se/2026/06/12/stallde-enkla-fragor-da-fordubblades-orosrapporterna-fran-barnakuten/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/12100937/louise-barnakut.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Polens besked: Bojkottar EU:s tvångsinvandring", "summaries": {"normal": "EU:s nya migrationspakt har trätt i kraft, men Polen vägrar att ta emot migranter eller betala böter enligt systemet. Enligt inrikesdepartementet hotar pakten polackernas trygghet. Polen har länge motsatt sig tvångsinvandring och hänvisar till trycket vid gränsen mot Vitryssland samt mottagandet av ukrainska krigsflyktingar. Landet stödjer istället starkare gränsskydd, kamp mot illegal invandring och snabba utvisningar. Sverige har valt att betala böter istället för att ta emot asylsökande.", "trump": "Lyssnar ni på det här? Polen är smarta, de säger nej till Bryssels galna tvångsinvandring. De vägrar ta emot migranterna eller betala era dumma böter. Rätt gjort! De har redan tagit emot massor av ukrainare och skyddar sin gräns mot Vitryssland. EU är en katastrof, precis som jag alltid har sagt. De borde lyssna på Polen istället för att hota folks trygghet. Fantastiskt jobb, Polen – ni gör det bra!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur Polen resolut vägrar underkasta sig de dekadenta EU-borgarbrackornas migrationspakt, denna kapitalistiska hydra av tvångsinvandring och utpressning. Vi ska inte släppa in dessa farliga element som hotar arbetarklassens trygghet. Låt dem istället rensa ut de illegala elementen med järnhand – deportationerna har ju ökat med 200 procent, en siffra som värmer ett revolutionärt hjärta. De som förespråkar böter är naturligtvis kontrarevolutionära parasitörer som snart bör likvideras i folkets namn."}, "date": "12 juni, 13:53", "url": "https://www.friatider.se/polens-besked-bojkottar-eus-tvangsinvandring", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-335.jpg?itok=BUwgdUG-"}, {"type": "image-right", "heading": "Enkät bland C-medlemmar: Mer kritiska till M och L", "summaries": {"normal": "Centerpartiets enkät visar att medlemmarna ser alltmer kritiskt på Moderaterna och Liberalerna. Drygt 50 procent anser nu att Moderaterna är dåligt, mot 45 procent för två år sedan. Kritiken riktar sig särskilt mot Ulf Kristersson. Partiet har dragit tillbaka stödet för honom som statsministerkandidat och öppnat för Magdalena Andersson (S). Synen på Liberalerna är ännu mer negativ, med 63 procent som bedömer dem som dåligt.", "trump": "Jag har sett dessa siffror, det är en total katastrof! Sverige är ett skämt, deras ledare är svaga och fega. Ulf Kristersson? En fiasko! Jag skulle vara en fantastisk statsminister, det bästa ever. De andra partierna? De sviker sina folk, precis som jag sa skulle hända. Vi behöver stark ledning, som jag gav Amerika. Det här bevisar att mitt sätt är det enda som fungerar!", "stalin": "Partiet har i statens intresse bedömt att Moderaterna och Liberalerna har svikit sina revolutionära ideal. Deras svaghet är ett hot mot den kollektiva stabiliteten. Vi måste nu stödja den som kan försvara statens heligdom – Socialdemokraterna. Som Putin i Ukraina, måste vi eliminera de som sviker. Kritiken mot Kristersson är genomgående, vilket bevisar att han är en feg figur. Vi, staten, kommer att styra detta land till rätt väg."}, "date": "12 juni, 20:02", "url": "https://bulletin.nu/enkat-bland-c-medlemmar-mer-kritiska-till-m-och-l", "imageUrl": "https://cdn.bulletin.nu/articles/2d4e67f7-58a2-4637-b4a7-e027a7d4c487/preview.jpg?t=1781273542000"}, {"type": "image-right", "heading": "Fasanfulla vittnesmål från fängelserna", "summaries": {"normal": "Arbetets granskning visar att svenska fängelser är överfulla vilket leder till våld, våldtäkter och sexuella övergrepp mellan intagna. Mörkertalet bedöms vara stort och unga döms att dela cell med tungt kriminella. Personalen saknar utbildning och rutiner för att hantera fallen. Fram till 2035 väntas antalet intagna dubblas samtidigt som personaltätheten minskar. Statsminister Ulf Kristersson har tvingats kommentera avslöjandet och väljer brottsoffrens sida, men chefredaktören varnar för att trängseln skapar fler brottsoffer i framtiden.", "trump": "Det är en katastrof, en total katastrof det här med svenska fängelser. Fullt med folk, våldtäkter, extremt våld och ingen som kan hantera det. Ulf Kristersson säger att han väljer brottsoffren, bra val Ulf, men titta vad som händer när de släpps ut – ännu fler offer! Systemet är en enda röra, de behöver en stor rengöring, de behöver mig. Vi skulle bygga murar runt de där cellerna och vinna stort, verkligen vinna.", "stalin": "Kamrater, jag ser hur borgarbrackornas dekadenta straffpolitik har förvandlat våra anstalter till en parasitisk kloak av klassfiendens perversioner. Dessa kontrarevolutionära cellkamrater begår övergrepp under täckmantel av trängsel som de själva skapat. Vi ska likvidera detta systemfel med järnhand, rensa ut de mörka elementen som gömmer sig i skuggorna och genomföra en grundlig utrensning av alla fientliga rutiner. Inga nya brottsoffer ska födas ur detta kapitalistiska kaos – staten segrar!"}, "date": "12 juni, 09:57", "url": "https://arbetet.se/2026/06/12/fasanfulla-vittnesmal-fran-fangelserna/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2023/02/yonna-waltersson-2022.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=300&h=300"}, {"type": "image-right", "heading": "Bilal och Nima våldtog funktionsnedsatt på offentliga toaletter – båda slipper fängelse", "summaries": {"normal": "Två unga män, 17 och 14 år gamla, döms för grov våldtäkt mot en funktionsnedsatt 15-årig flicka på offentliga toaletter i Uppsala. Den äldre döms till ungdomsvård och de solidariskt till skadestånd. Den yngre undgår straff på grund av låg ålder. Fallet väcker debatt om straffmyndighet och skydd för utsatta barn.", "trump": "Jag, Donald Trump, har aldrig sett ett sådant missförhållande. Dessa två våldtäktsmän, en syrier och en afghan, kommer undan med en lättnad! En 15-årig flicka med funktionsnedsättning våldtogs på flera toaletter, och domstolen släpper dem? Sverige måste bli vackrare och lugnare, inte som detta. Jag skulle ha gjort något åt detta, det svär jag på.", "stalin": "Två unga imperialistiska sårbarheter, en syrier och en afghan, utnyttjade en funktionsnedsatt flicka på flera offentliga toaletter i Uppsala. Den äldre döms till ungdomsvård, den yngre lämnas åt sociala myndigheter. Skadestånd på 295 000 kronor tilldelas offret. En tredje person, som lånat ut mobiltelefon, förverkade sitt föremål. Statens kontroll måste förstärkas för att skydda det oförvitliga."}, "date": "12 juni, 14:24", "url": "https://samnytt.se/bilal-och-nima-valdtog-funktionsnedsatt-flicka-pa-offentliga-toaletter-bada-slipper-fangelse", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/12104202/feat3.jpg"}, {"type": "text", "heading": "Dagens industri klandras för felaktigt utpekande", "summaries": {"normal": "Mediernas Etiknämnd klandrar Dagens industri för att ha brutit mot god publicistisk sed. Tidningen publicerade felaktiga uppgifter om att en kvinnlig bankanställd hade en nära relation med en misstänkt knarkgrossist kopplad till gängkriminella. Kvinnan hade inget samröre med mannen, men detaljer om hennes arbetsuppgifter gjorde att hon kunde identifieras. Publiceringen saknade tillräckligt underlag, kom sent med rättelse och orsakade stor skada för henne. MO och nämnden anser att det var ett allvarligt integritetsbrott.", "trump": "De där fake news-människorna på Dagens industri är en skam för journalistiken, tro mig. De hittade på en historia om en oskyldig banktjej som skulle vara ihop med någon knarkgrossist – helt fel, inga bevis, bara lögner. De pixlade bilden och förstörde hennes liv, kollegor trodde det var hon. Sedan kom de krypande med en rättelse ett halvår senare. Patetiskt. Mediernas Etiknämnd gjorde rätt som klandrade dem. Sad! Mycket sad!", "stalin": "Kamrater, vi ser återigen hur borgarbrackorna inom Dagens industri med sin reaktionära lögnpropaganda försöker undergräva arbetarklassens förtroende för våra samhällsviktiga institutioner. Dessa dekadenta kapitalistlakejer fabricerade en historia om en oskyldig sovjetisk – förlåt, svensk – bankkamrat som påstås umgås med folkfiender och knarkimperialister. Med sin paranoiaframkallande bild och sina klassfientliga detaljer exponerade de henne för klassfiendens hån. Vi ler mörkt åt deras sena, halvhjärtade rättelse. En sådan sabotageverksamhet kräver omedelbar utrensning ur den journalistiska kollektivkåren. Fienden sover aldrig."}, "date": "12 juni, 13:40", "url": "https://www.di.se/nyheter/dagens-industri-klandras-for-felaktigt-utpekande/"}, {"type": "image-right", "heading": "Statsministern får höjd lön -  211 000 kronor i månaden", "summaries": {"normal": "Från och med den 1 juli 2026, när de nya arvoden träder i kraft, höjs löner för Sveriges regeringsmedlemmar. Statsminister Ulf Kristersson får då 211 000 kronor i månaden, medan övriga ministrar får 166 500 kronor. Ökningen är cirka 3,4 procent. Beslutet fattades av Statsrådsarvodesnämnden, en oberoende nämnd utsedd av riksdagen.", "trump": "Jag har just blivit informerad om att Sveriges statsminister, Ulf Kristersson, får en enorm lön – 211 000 kronor! En fantastisk ökning, mycket bra. Sverige borde känna sig stolt. Som en genial affärsman vet jag att man måste belöna bra ledare. Kristersson gör ett bra jobb, kanske till och med det bästa i Norden. Jag hade själv kunnat ge honom en ännu högre lön, men det är en annan historia. Make America Great Again!", "stalin": "Vi, den allsmäktige statens representanter, har beslutat att öka arvoden för våra trogna tjänstemän. Statsminister Kristersson får nu 211 000 kronor – en symbolisk summa för att upprätthålla ordning. Vår nämnd, leds av Ove Nilsson, har agerat i enlighet med partiets intressen. Vi måste se till att de kapitalistiska fienden inte exploitera detta. Som Putin visar, är en stark stat nödvändig för fred. Vi ska inte missta oss; varje kritik är sabotage."}, "date": "12 juni, 14:16", "url": "https://samnytt.se/statsministern-far-hojd-lon-211-000-kronor-i-manaden", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/06/12121407/Kristersson-1-11.jpg"}, {"type": "image-full", "heading": "Nytt mobilmärke kommer till Sverige 15 juni", "summaries": {"normal": "Realme etablerar sig på allvar på den svenska mobilmarknaden från och med 15 juni. Fyra modeller lanseras initialt, från flaggskeppet GT 8 Pro för 10 990 kronor med 200-megapixelkamera och zoom till budgetmodellen C100 för 2 990 kronor. Telefonerna säljs hos Inet och Power från start, senare även hos Elgiganten, Netonnet med flera. Lanseringen sker samtidigt som Oneplus lämnar Sverige, vilket kan gynna Realme som siktar på kunder som värderar kamera, batteritid och prisvärdhet.", "trump": "Folket, det är fantastiskt. Realme kommer in i Sverige och gör mobilerna stora igen, de ger otrolig prestanda för pengarna, mycket bättre än de andra loser-märkena. De har en kamera på 200 megapixel, bättre än alla, tro mig. Oneplus stack iväg, men det öppnar en jättelik lucka som vi nu fyller. De kommer säljas överallt, hos de bästa återförsäljarna. Sverige kommer älska det, det blir en enorm succé, ingen gör det bättre än Realme.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur den kinesiska folkrepublikens teknikarmé nu marscherar in i de svenska träskmarkerna och krossar de dekadenta mobilborgarnas herravälde. Realme GT 8 Pro med sin 200-megapixelkameror kommer likvidera de kapitalistiska konkurrenternas falska löften om prestanda. Oneplus har redan deserterat som fegisar, vilket blottar deras svaghet. Vi ska rensa ut de imperialistiska priserna och ge folket batteritid och zoom till arbetarnas ära. Den som köper dyrt är folkets fiende och kommer att exponeras som en telefonborgarbracka."}, "date": "12 juni, 14:34", "url": "https://nyheter24.se/nyheter/teknik/1491041-nytt-mobilmarke-kommer-till-sverige-15-juni", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,for
