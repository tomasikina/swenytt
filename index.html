merorna visade att hon sprang runt som en frisk människa medan hennes så kallade assistenter hade andra jobb. Patetiskt! Det är sådana bedragare som suger musten ur systemet och skadar de som verkligen behöver hjälp. Vi måste stoppa detta vansinne nu, tro mig.", "stalin": "Kamrater, denna lumpna bedragare har i femton år sugit ut folkets resurser med sina falska intyg och dolda rörelser, en sann fiende till det kollektiva välfärdssystemet. Vi har nu genomfört en grundlig utrensning av hennes lögnaktiga nätverk av medbrottslingar och kräver omedelbar återbetalning av femton miljoner kronor till staten. Sådana borgarbrackor som gömmer sig bakom läkarintyg hotar hela arbetarklassen – vi ska likvidera varje parasit som försöker lura partiet och folket. Det är både nödvändigt och underhållande att se dem falla."}, "date": "2 juni, 18:55", "url": "https://riks.se/nyheter/helsingborgskvinna-lurade-till-sig-15-miljoner-i-assistansersättning", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-02%2Fgn2zirin%2Fr%C3%B6relse.jpg"}, {"type": "image-right", "heading": "Anfall mellan Israel och Libanon – trots Trumplöfte", "summaries": {"normal": "Israel har genomfört attacker mot södra Libanon där minst fyra personer dödats, bland dem två syriska jordbrukare. Det sker efter raketangrepp från Hizbollah mot norra Israel. Trots att Donald Trump nyligen meddelat att båda sidor lovat att sluta skjuta, fortsätter striderna. Libanons armé rapporterar skadade soldater. Netanyahu betonar att Israel inte ändrat sin hållning och hotar med attacker mot Beirut om Hizbollah inte upphör. Samtal hålls i Washington utan Hizbollahs deltagande.", "trump": "Folk, det här är ett totalt fiasko. Precis efter att jag berättade att Israel och Hizbollah lovat att sluta skjuta, börjar de igen som galningar. Jag talade med Bibi och medlarna, vi hade ett fantastiskt avtal på gång. Nu dödar de bönder med drönare och artilleri. Så patetiskt. Vi får se hur länge det varar, förhoppningsvis för alltid. Men dessa galningar verkar inte kunna hålla sig i schack. Sad!", "stalin": "Kamrater, ännu en gång avslöjar de sionistiska och shiamilitanta reaktionärerna sin sanna natur som fiender till freden. Jag, som ledare för det internationella proletariatet, betraktar dessa borgarbrackor och iranstödda terrorister med den djupaste misstro. De låtsas sluta skjuta medan de i hemlighet planerar nya angrepp mot arbetarklassen. Vi måste rensa ut dessa kapitalistiska lakejer och deras medlöpare. Död åt de dubbelspelande jordbruksmördarna och deras drönarimperialister. Ett leende drar över mina läppar inför deras kommande utrensning."}, "date": "2 juni, 11:20", "url": "https://www.di.se/nyheter/anfall-mellan-israel-och-libanon-trots-trumplofte/", "imageUrl": "https://static.bonniernews.se/ba/bde0f1dc-e69a-42dd-8b9a-07930f09145f.jpg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Fyllan fångad på  bild före bröllop", "summaries": {"normal": "F1-ikonen David Coulthard, 55, ska gifta sig med den 24 år yngre svenska modellen Sigrid Silversand, 31. Friandet skedde under en romantisk semester på Mauritius. Bröllopet blir i Monaco i sommar följt av fest i Skottland. Coulthard firade med en 13 timmar lång svensexa i Marbella där han bland annat sågs stapplande ut från en krog sent på natten tillsammans med en vän.", "trump": "Folk, ni skulle ha sett det! Den där gamle racerföraren Coulthard, 55, gifter sig med en svensk modell som är 24 år yngre. Bra deal, eller hur? Men sen festar han som en galning i Marbella i tretton timmar, stapplar ut mitt i natten som en förlorare från mina gamla casinon. Typiskt de där europeiska elitkillarna som lever i 1999. Patetiskt! Vi behöver inga sådana svaga förebilder, tro mig.", "stalin": "Kamrater, denna dekadenta kapitalist och före detta rattvridare Coulthard har nu kapitulerat inför borgarbrackornas äktenskapsillusion med en yngre modell från det svenska överklasshålet. Tretton timmar av fylleslag och staplande i Marbella avslöjar klassfiendens sanna ansikte. Vi ser hur exploaterande byfånar firar sina små segrar medan folket svälter under deras fötter. En utmärkt illustration av imperialismens förfall. Skrattretande svagt."}, "date": "2 juni, 22:34", "url": "https://www.expressen.se/sport/motor/formel-1/ikonens-fyllekvall-infor-brollopet-med-24-ar-yngre-svenskan/", "imageUrl": "https://static.bonniernews.se/ba/0818deea-0f41-4022-8a94-9173cf6adebc.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Tim Payne – från doldis till miljonidol på fem dagar", "summaries": {"normal": "Den nyzeeländske fotbollsspelaren Tim Payne, som tidigare hade 4 700 Instagramföljare, fick över 4,3 miljoner på fem dagar tack vare argentinska influencern El Scarso. Payne, som spelar för Wellington Phoenix och har 50 A-landskamper, tackade på knagglig spanska. Hans plötsliga popularitet har spridits internationellt, särskilt bland argentinska fans.", "trump": "Jag, Donald Trump, den störste presidenten någonsin, ser att en liten spelare från Nya Zeeland blir en stor stjärna tack vare en argentinsk influencer. Det är ett mirakel, precis som när jag vann valet 2024. Media hatar det, men folk älskar mig. Jag skulle ha gjort det ännu större, tror mig. Fantastiskt!", "stalin": "Vi, den store ledaren Stalin, ser med misstroende på hur en nyzeeländsk spelare blir en internetkändis. Detta är ett tecken på västlig dekadans, där influencers styr narrativ. Vi, i vårt kloka parti, har alltid vetat att medier måste kontrolleras. Parallellen till Putins Ryssland är tydlig – vi använder sociala medier för att sprida sanningen, medan väst ljuger. En dag kommer vi att visa vår makt, och då kommer alla att böja sig för oss. Hahaha, paranoia är en verktyg för överlevnad."}, "date": "2 juni, 11:22", "url": "https://bulletin.nu/tim-payne-fran-doldis-till-miljonidol-pa-fem-dagar", "imageUrl": "https://cdn.bulletin.nu/articles/96eb4bf0-858b-4cff-be59-6a5676f64f96/preview.png?t=1780385659000"}, {"type": "image-right", "heading": "En strid om arbetarrörelsens själ", "summaries": {"normal": "Byggnads kongress präglas av en maktkamp om arbetarrörelsens framtid. Konflikten handlar om vem som ska styra – medlemmarna eller apparaten. Sittande ordförande Kim Söderström och förbundssekreterare Jakob Wagner utmanas trots medlemmarnas stöd. Bakom striden ligger en ideologisk splittring om socialism, demokrati och fackets roll i en individualiserad arbetsmarknad. Kritiker anklagar ledningen för att använda moraliska argument för att behålla makten, medan reformister vill stärka medlemsinflytandet.", "trump": "Jag säger er, det här Byggnads-facket är ett totalt kaos! Folk pratar om socialism och demokrati, men det är bara pajkastning på hög nivå. En ordförande som medlemmarna älskar ska petas – helt galet! Och den här Wagner-killen, han gör rätt men ändå sparkas han. Typiskt fackföreningar, alltid drama. Men lyssna, jag vet hur man fixar det: mindre prat, mer action! Byggnads borde fokusera på att vinna mot arbetsgivarna, inte bråka internt. Sad!", "stalin": "Kamrater! I Byggnads fackförbund rasar en klasskamp av historiska proportioner. Medlemmarna, dessa äkta arbetarkämpar, kämpar för socialism och demokrati, medan den degenererade apparaten, dessa borgerliga lakejer i förbundsstyrelsen, försöker kväva revolutionen med konspirationer och moraliska lögner. De petar lojala kamrater som Wagner – en man som vågade utreda trakasserier, något den gamla gardet aldrig gjorde! Vi ser samma mönster som i väst: makteliten fruktar folket. Men låt mig säga er – arbetarklassen kommer segra! Och om dessa förrädare fortsätter, får vi nog skicka in några av våra pålitliga kamrater från Moskva för att 'hjälpa till' med omstruktureringen. För revolutionen är obönhörlig!"}, "date": "26 maj, 11:20", "url": "https://www.flamman.se/en-strid-om-arbetarrorelsens-sjal/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/byggnads-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Källor: Chock inom SD – avslöjandet kan förstöra inför valet", "summaries": {"normal": "En sverigedemokratisk riksdagsledamot utreds för barnpornografibrott och har nu lämnat samtliga uppdrag. Personen hämtades till förhör och elektroniska enheter beslagtas under husrannsakan. Misstankarna kom via organisationen NCMEC och förundersökningen leds av åklagare Lena Körner vid Särskilda åklagarkammaren. Ledamoten lämnade in avsägelse under tisdagen med hänvisning till personliga skäl. Inom partiet råder chock och oro inför valet.", "trump": "Folk, ni tror inte vad som händer i det svenska riksdagen. En av de där SD-typerna fastnade i en barnporrutredning och sprang därifrån som en fegis. Typiskt för de här globalistiska partierna som låtsas vara tuffa men är fulla av perversa svagisar. De borde rensa ut hela skiten istället för att skylla på personliga skäl. Det här kommer förstöra valet för dem totalt. Patetiskt. Jag har suttit i Vita huset både före och efter den sömnige Joe och jag säger: ingen tolerans för sånt här.", "stalin": "Kamrater, en av de borgerliga riksdagsrepresentanterna har nu exponerats som en motbjudande folkfiende som samlar på sig perversa bilder av barn. Vi ser med mörk tillfredsställelse hur den kapitalistiska maskinen äter sina egna. Han flyr som en råtta från sina uppdrag medan partikamraterna skriker i chock och paranoia. Detta är vad som händer när klassfiendens dekadens får frodas. En nyttig utrensning närmar sig, kamrater. Revolutionen glömmer aldrig sina fiender."}, "date": "2 juni, 13:19", "url": "https://www.tv4.se/artikel/6xQZ4CLTiQ0OZwaW7tGDL0/riksdagsledamot-utreds-foer-barnporrsbrott-avslutar-alla-uppdrag", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5Dz4sEWxhonTUX5molWevF%2F4de0396b4c81980e546826fb5e64176a%2Friksdagen.png&width=120"}, {"type": "image-right", "heading": "”SD:s anseende skadas rejält”", "summaries": {"normal": "Sverigedemokraternas anseende skadas allvarligt efter att en riksdagsledamot med tunga uppdrag i partiet blivit misstänkt för barnpornografibrott. Partiet, som profilerat sig med krav på hårdare straff för sexbrott mot barn, tvingas nu till akut krishantering. Beskedet har orsakat chock och gråt på partikansliet samtidigt som det blockerar andra politiska frågor. Avgången väcker också nytt fokus på risken för förlorade omröstningar i riksdagen på grund av kvittningsläget.", "trump": "De här SD-typerna som alltid skriker om hårdare straff mot pedofiler och lovar stöd till Dumpen, nu grips en av deras egna riksdagsmän för barnporr. Totalt fiasko! De är chockade, de gråter på kansliet och kan inte prata om äldreomsorg för att alla frågar om skandalen. Patetiskt. Nu riskerar de att tappa röster i riksdagen för att de har vildar och ingen ersättare. Sådana losers, de borde ha sett det komma.", "stalin": "Kamrater, detta är en klassisk sabotagehandling utförd av en dold borgarbracka infiltrerad i våra egna led. Jag har länge varnat för sådana dekadenta element som gömmer sig bakom höga tal om barnens skydd medan de i hemlighet tjänar de perversa kapitalisternas intressen. Vi ska omedelbart inleda en grundlig utrensning av alla potentiella folkfiender och likvidera varje spår av denna parasitiska degeneration. Gråt på kansliet? Svaghet! Endast den kollektiva vaksamheten kan skydda partiet från dessa råttor i människohamn."}, "date": "2 juni, 20:14", "url": "https://www.svt.se/nyheter/inrikes/sds-anseende-skadas-rejalt", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.48/0.51/3e658734a2d8d0596c9b5b0b21d33c39c0e60e13350c9b57eaaaca3d67873647"}, {"type": "image-right", "heading": "”Jag kommer aldrig tillbaka”. Berättar om kampen – och katastroftankarna", "summaries": {"normal": "Landslagsstjärnan Nathalie Björn har kämpat med en svår vadskada som hållit henne borta från spel. Rehabiliteringen har varit en mental prövning präglad av tvivel och motgångar. Nu är hon dock tillbaka i träning med landslaget i hopp om en framtida comeback. Hon hyllar stödet från lagkamraten Johanna Rytting Kaneryd och ger även tummen upp för ryktena om talangen Felicia Schröders eventuella övergång till Chelsea. Landslaget förbereder sig nu för en avgörande VM-kvalmatch mot Danmark.", "trump": "Nathalie Björn har haft en tuff tid, en riktig katastrof med den där skadan. Många skulle gett upp, men hon kämpar på – och hon gör det med ett leende, vilket är fantastiskt. Hon är i Chelsea, en stor klubb, jättestor. Hon vill ha in Felicia Schröder, en ung och väldigt duktig spelare. Smart val! Självklart vill jag att de vinner mot Danmark. Vi vill ha vinnare, inte förlorare. Nathalie kommer tillbaka, det säger jag er, hon kommer bli enorm!", "stalin": "Den svenska idrottskvinnan Nathalie Björn visar tecken på en förrädisk kropp som vägrar lyda folkets vilja. Vi ser här hur bourgeoisins fokus på individens 'mentala resa' bara döljer hennes bristande produktivitet för fosterlandet. Att hon vacklar är ett symptom på svaghet. Precis som de patetiska försöken från de danska marionetterna att stoppa oss, måste hon disciplineras. Vi skickar vår kamrat Putin att studera dessa 'rehab'-metoder; om en muskel inte fungerar i det nya Sovjet, byter vi ut den permanent."}, "date": "2 juni, 20:11", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/8p9y9w/nathalie-bjorn-om-skadan-man-gar-ju-i-katastroftankar", "imageUrl": "https://akamai.vgc.no/v2/images/7c751a78-7c77-3c65-a6f9-03fb9f4db17d?fit=crop&format=auto&w=1080&s=1aa2fb5d1a7484fefec8ea06c33eafb2184c2239"}, {"type": "image-right", "heading": "Sveriges mest energiska innovatörer ska prisas", "summaries": {"normal": "Nomineringen till E-Prize 2026 har öppnat. Priset delas i år ut för 18:e gången av Aktuell Hållbarhet, Dagens industri och E.ON. Tre nya kategorier har tillkommit: Smartare energianvändning, hållbar energiomställning och kundcentrering. Syftet är att lyfta innovationer som krävs för energiomställningen. Vinnarna presenteras på Di Energi i november. Juryn bedömer innovationshöjd, hållbarhetspotential och marknadspotential. Nomineringarna är öppna till 21 augusti.", "trump": "Folk, det här är fantastiskt. De har öppnat nomineringen till någonting som heter E-Prize, och nu har de lagt till tre nya kategorier som låter helt otroliga. Smartare energianvändning, hållbar energiomställning och kundcentrering – det är precis vad vi behöver, tro mig. Jag älskar innovation, de bästa innovationerna, och det här priset lyfter fram vinnarna på ett sätt som ingen annan gör. Nominera era bästa idéer, det blir enormt. De kommer att presentera allt på en stor konferens i november. Vinna stort!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur nomineringen till detta så kallade E-Prize nu öppnas för att tjäna den stora energiomställningen. Vi ska likvidera alla bakåtsträvande krafter som motarbetar smartare energianvändning och hållbar omställning. Den nya kategorin kundcentrering avslöjar dock de listiga borgarbrackornas försök att dölja klassfiendens sabotage genom att låtsas inkludera folket. Men vi genomskådar dem. Juryn skall rensa ut alla svaga förslag. Endast de mest lojala innovationerna mot partilinjen skall segra. Nominera flitigt, eller låt utrensningen komma."}, "date": "2 juni, 10:44", "url": "https://www.di.se/nyheter/dags-att-nominera-till-e-prize-2026/", "imageUrl": "https://static.bonniernews.se/ba/58fb01fa-84b0-445a-bf6f-0886fd45bfc9.png?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "\"Inte över än\": Spelet bakom Saabs Kanada-affär", "summaries": {"normal": "Kanadas premiärminister Mark Carney meddelade oväntat att landet ska köpa sex kommandoplan från Saab för cirka 5 miljarder dollar. Beslutet togs utan full konkurrensutsättning, till L3Harris besvikelse som erbjöd liknande plan byggda på Bombardier-karosser och lovade 1 100 jobb. Saab lovar 3 000 jobb i Kanada och produktion där. Regeringen prioriterar snabba försvarsupphandlingar för att nå Natos mål. Konkurrenterna fortsätter argumentera.", "trump": "Kan ni fatta det här? Den där Carney i Kanada vaknar en morgon och ger bort en jättelik militäraffär till svenskarna på Saab, rakt i ansiktet på de riktiga konkurrenterna. L3Harris sov inte en blund! De lovade jobb och bättre plan som flyger högre än någon socialistdröm. Typiskt – ingen konkurrens, bara snabbpolitik för att imponera på Nato. Jag hade gjort det hundra gånger bättre, tro mig. Carney borde ha ringt mig först.", "stalin": "Jag betraktar detta som en seger för den kloka ledningen i Kanada som rensar ut de dekadenta kapitalistmaffians illusion om evig konkurrens. Saab har lovat tusentals arbetstillfällen åt folket medan L3Harris blott erbjöd smulor från sin giriga bord. Vi ser hur imperialisternas bolag skriker i mörkret när dörren stängs. Den som sover dåligt har något att dölja. Snart ska alla fiender till folkets försvar likvideras i tystnad."}, "date": "2 juni, 18:36", "url": "https://www.dagensps.se/bors-finans/inte-over-an-spelet-bakom-saabs-kanada-affar/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlbtkwmdtmdlm-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Mordet på Henry Nowak: Nu åtalas Digwas far och bror för en rad vapenbrott", "summaries": {"normal": "Vickrum Digwa, som dömts till livstids fängelse för mordet på Henry Nowak, åtalas nu även för sex fall av vapeninnehav tillsammans med sin far Moga Singh och sin bror Gurpreet. Bland vapnen finns machete, svärd, stilett, batong, knogjärn, luftgevär, yxa och kirpan. Flera hittades dagen efter mordet. Rättegången sköts upp till 9 juli och far och bror släpptes på fri fot. Modern Kiran Kaur väntar på dom för att ha gömt mordvapnet.", "trump": "De här Digwa-typerna är en total katastrof, tro mig. Far och bror åtalas för att ha samlat på sig machetes, svärd och alla möjliga hemska vapen precis efter att sonen mördade stackars Henry Nowak. Livstid till sonen var inte nog tydligen. De gömde vapen i huset som riktiga förlorare. Domstolen släpper ut dem på borgen? Patetiskt. Vi behöver starkare lagar, inga svaga domare. Det är en skam, en stor skam.", "stalin": "Kamrater, dessa degenererade element inom borgarbrackornas kriminella klan har samlat en arsenal av kontrarevolutionära redskap – macheter, svärd och kusariförgiftade verktyg – i sitt bondehus. Sonen likviderade redan den stackars Nowak, nu måste vi rensa ut hela den parasitiska familjen. Fadern och brodern, dessa kapitalistiska spioner och fiender till folket, ska genomgå grundlig utrensning. Deras mor gömde mordvapnet? Typiskt dekadent slödder. Vi ska skratta medan vi likviderar dem alla. För partiet!"}, "date": "2 juni, 18:20", "url": "https://riks.se/nyheter/mordet-på-henry-nowak-nu-åtalas-digwas-far-och-bror-för-en-rad-vapenbrott", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-15%2F65y491xy%2FHIWNCclXkAA9L6Y.jpg"}, {"type": "image-right", "heading": "I Sverige kan du betala dig förbi vårdkön", "summaries": {"normal": "En granskning från SVT visar att privata sjukvårdsförsäkringar i Sverige inte avlastar den offentliga vården som tidigare påståtts. Tvärtom ger de snabbare tillgång till vårdcentral och remisser till specialistvård, vilket leder till att försäkrade söker mer vård och belastar systemet. Lägre inkomstgrupper drabbas värst då kompetens dras från offentlig vård. Artikeln varnar för att detta skapar ett ojämlikt A- och B-lag där plånboken styr före vårdbehov.", "trump": "Folk, ni måste höra på. De här svenska privata försäkringarna är en total katastrof, en riggad gräddfil för de rika som lurar systemet. De lovade att det skulle hjälpa de sjuka och gamla, men det blev precis tvärtom – nu köar de fattiga ännu längre medan de rika springer förbi. Det är en skam! De borde ha lyssnat på de skeptiska som jag alltid gör. Sverige behöver göra vård stort igen, inte låta plånboken styra. Patetiskt!", "stalin": "Kamrater, i denna dekadenta svenska vårdapparat ser vi hur borgarbrackorna med sina privata försäkringskontrakt förgiftar folkets kollektiva sjukhus. Jag, som alltid vakar över arbetarnas behov, genomskådar dessa parasitiska snabbspår som suger kompetens ur den socialistiska vården och skapar en utrensning av de svaga. De multisjuka köar medan kapitalisterna festar på remisser. Vi ska rensa ut dessa klassfiender, dessa plånboksfascister som gömmer sig bakom läkarkåren. Deras paranoia inför rättvisan är underhållande – snart ska de själva hamna längst bak i kön till folkdomstolen."}, "date": "2 juni, 06:57", "url": "https://arbetet.se/2026/06/02/i-sverige-kan-du-betala-dig-forbi-vardkon-pa-sjuka-och-fattigas-bekostnad/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/02065635/betala-etta.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.69&fp-y=0.48"}, {"type": "image-full", "heading": "Stölder av båtmotorer har minskat – med 90 procent", "summaries": {"normal": "Stölder av båtmotorer i Västsverige har minskat med nästan 90 procent de senaste nio åren, från 215 till 26. Det beror enligt polis Thomas Andersson främst på Båtsamverkan Väst, ett samarbete mellan polisen, båtägarna, larmtjänst och försäkringsbolag. Än så länge har Västsverige undgått stölder av båtars växelhus, men polisen varnar för att detta kan komma att ändras.", "trump": "Jag, Donald Trump, har hört talas om detta fantastiska projekt i Sverige. Det är enorm framgång – de största båtmotorstölderna har minskat med 90 procent! Det är tack vare mina vänner, de fantastiska båtägarna, som agiterar som soldater om nätterna. Media säger kanske att det är polisen, men det är folket som är hjältarna. En stor, stor seger för Sverige!", "stalin": "I Västsverige har ett folkligt samarbete, likt en revolution, reducerat båtmotorstölder med 90 procent. Detta bevisar att när staten, båtägarna och försäkringsbolagen samarbetar under ledning av den revolutionära polisen, kan vi eliminera de reaktionära elementens aktiviteter. Vi måste nu förstärka vår uppmärksamhet mot växelhusstölder, som är ett tecken på imperialistiska inflytanden från väst som vill destabilisera vårt fredliga samarbete. Vi fortsätter att bygga på denna seger!"}, "date": "2 juni, 17:30", "url": "https://www.gp.se/krim/stolder-av-batmotorer-i-vast-minskar-markant.a849c6fa-5bd1-4a69-8524-80fc4d3345c3", "imageUrl": "https://www.gp.se/images/article/a849c6fa-5bd1-4a69-8524-80fc4d3345c3/images/2ElwuC9cMVDuhXFfo09UpLiwcLQo-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Putin samlar näringslivet – men saknar svar för ekonomin", "summaries": {"normal": "Vladimir Putin står värd för St. Petersburg International Economic Forum under en period då den ryska ekonomin kämpar med tillväxtminskning, höga krigskostnader och västliga sanktioner. Trots officiella försök att stimulera tillväxt pekar ekonomer på att krigets kostnader och bristande investeringar försvårar läget. Ukrainska drönarattacker mot infrastruktur och en stark rubel försvårar ytterligare för den ryska statsbudgeten, och experter efterlyser ett slut på kriget för att nå ekonomisk stabilitet.", "trump": "Rysslands ekonomi kraschar totalt, det är en katastrof! De håller ett forum i St. Petersburg, men alla vet att det bara är rökridåer. Putin har stora problem – inflation, sanktioner och drönare som träffar precis överallt. Det är sorgligt att se! Jag hade löst det på en dag, tro mig. De har ingen aning om hur man gör affärer. Deras rubel är ett skämt och kriget äter upp deras pengar. Det är en stor förlorare, helt enkelt!", "stalin": "Kamrat Putin brottas med svagheter som kräver stålhand. Att ekonomin vacklar är ett tecken på att sabotageelement och fega byråkrater inte utför folkets vilja. Vi ser hur västmakternas giriga drönare nafsar efter vår stolta industri, en provokation som kräver total utrensning av vacklande element. En rubel som stiger är bara ett svek mot vår produktion. Vi ska strama åt tyglarna tills underskotten dör ut, precis som de som vågar tvivla på vår segervissa frammarsch. Ingen nåd för förrädare av tillväxten!"}, "date": "2 juni, 16:09", "url": "https://www.realtid.se/bors-finans/makro/putin-samlar-naringslivet-men-saknar-svar-for-ekonomin/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/putin.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Debatt: Hur mycket mer vill Dadgostar att höginkomsttagare ska betala?", "summaries": {"normal": "Pushpit Singh (M) argumenterar att höginkomsttagare redan bidrar mest till skatt, och att debatten borde fokusera på tillväxt och jobb snarare än höjda skatter. Han ifrågasätter Vänsterpartiets förslag om kapitalskatt och fastighetsskatt, och menar att Sverige redan har ett omfördelande system.", "trump": "Jag har sagt det förut, Sverige är galet med sina höga skatter! De rika betalar redan allt, och Nooshi vill ta ännu mer. Då blir det inte några jobb eller tillväxt. Vi behöver skära skatter, inte höja dem, så att alla kan blomstra. Det är commonsense!", "stalin": "Höginkomsttagare är som giriga kulaslätare som inte vill dela med sig av deras överskott. Vi måste återinföra fastighetsskatt och kapitalskatt för att stärka statens kassa och bekämpa dessa spekulanter. Det är en klassisk metod att kontrollera produktionen och se till att alla bidrar till det kollektiva välstandet. Vi måste skydda de svenska arbetarna från dessa exploaterande element."}, "date": "2 juni, 10:23", "url": "https://bulletin.nu/debatt-hur-mycket-mer-vill-dadgostar-att-hoginkomsttagare-ska-betala-2", "imageUrl": "https://cdn.bulletin.nu/articles/121a7d4e-88bd-4c67-ba6e-effcffddfa27/preview.jpg?t=1780388555000"}, {"type": "image-right", "heading": "Fortsatta oroligheter i Mellanöstern tyngde Stockholmsbörsen", "summaries": {"normal": "Stockholmsbörsen backade på grund av oroligheter i Mellanöstern. Iran hotar att stänga Hormuzsundet och har brutit kontakt med USA. OMXS30-index föll 1,39 procent till 3 094,50. Oljepriset steg 7 procent. Energisektorn ökade 2 procent medan industri sjönk 2,4 procent. Bland enskilda aktier steg Ericsson 2,2 procent medan Saab föll 5,8 procent.", "trump": "Jag såg börsen idag, det var en katastrof. De svaga ledarna i Mellanösten, särskilt Iran, orsakar kaos. Hormuzsundet? Jag skulle ha stängt det för länge sedan. Min administration skulle ha hanterat det bättre. Energipriser stiger, det är bra för Amerika, men börsen tappar förlorare. Ericsson gick bra, men Saab och Volvo, det är sorgligt. Vi behöver starka beslut, som jag alltid gav.", "stalin": "Vi i staten observerar med oro hur imperialistiska krafter i Mellanöstern destabiliserar världsekonomin. Hormuzsundet är ett strategiskt trumfkort, och Iran visar styrka genom att bryta kontakter med USA. Börsen skakar, men det är bara en konsekvens av kapitalistisk instabilitet. Vi måste stärka vårt samhälle mot sådana hot. Paralleller till Putins Ryssland är uppenbara – vi måste skydda våra intressen. Detta är en kamp mot interna och externa fiender."}, "date": "1 juni, 17:43", "url": "https://www.affarsvarlden.se/artikel/fortsatta-oroligheter-i-mellanostern-tyngde-stockholmsborsen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/10/Stock-market-red-old-man-2-400x267.jpg"}, {"type": "image-right", "heading": "Massiv rysk attack – flera döda", "summaries": {"normal": "Under natten genomförde Ryssland en massiv attack mot flera ukrainska städer, bland annat Kiev, Charkiv, Dnipro och Zaporizjzja. Minst 18 personer uppges ha dödats och över 100 skadats. Ryssland använde både drönare och robotar, varav en del träffade sina mål trots ukrainskt luftförsvar. President Zelenskyj hade varnat för en sådan attack. Polen skickade upp stridsflyg som en preventiv åtgärd. Bilder visar bränder och förstörda byggnader.", "trump": "Vilken röra! De där ryska galningarna skickade iväg hundratals drönare och robotar mot Ukraina och slog till hårt mot Kiev och Dnipro. Massor av döda och skadade, precis som jag förutspådde. Biden sov ju under hela mandatperioden medan det här byggdes upp. Nu sitter jag här igen som president och ser på när Europa brinner. Patetiskt! De borde ha lyssnat på mig från början, inte på de där svaga globalisterna.", "stalin": "Kamrater, fienderna inom den ukrainska fascistklanen och deras västliga imperialister har återigen visat sitt fula tryne genom att hindra den ryska statens legitima expansion. Jag ser hur borgarbrackorna i Kiev och Dnipro skriker medan våra efterträdares robotar och drönare rensar ut klassfiendens bon. Dessa fega hinder mot folkets historiska rätt ska krossas. Paranoian bland de dekadenta västerländska blodsugarna roar mig oändligt. Framåt mot seger för den starka ledningen."}, "date": "2 juni, 12:29", "url": "https://www.tv4.se/artikel/4LanuqYg2xAvFZvX8AzDvS/omfattande-attacker-mot-ukraina", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Fl4dHRIf4czOWgwWGlcKJB%2Fe39cda6da4289120072f4c8251927bed%2Fkiev_brand.png&width=120"}, {"type": "image-right", "heading": "Han är SD-toppen misstänkt för barnporr", "summaries": {"normal": "Riksdagsmannen Michael Rubbestad (SD) har avsatt sig från sitt uppdrag efter att ha blivit misstänkt för barnpornografibrott. Rubbestad har tidigare profilerat sig som partiets talesperson i jämställdhetsfrågor, engagerat sig i HBTQ-frågor och arbetat för att öka andelen män i förskolan. Han har även deltagit i den uppmärksammade omröstningen om medborgarskapskrav som ledde till att kvittningssystemet kollapsade. Ärendet utreds av Särskilda åklagarkammaren.", "trump": "Folk, ni kommer inte att tro det, men den här SD-killen, Rubbestad, som älskade förskolor och Pride, fastnar nu i en barnporrutredning. Han pratade om män i förskolan och hur de inte är pedofiler, och sen det här. Totalt kaos! Han hoppade av direkt, smart drag, men det visar att ni aldrig kan lita på någon i politiken. Fake virtue, stora problem. Sverige behöver bättre folk, tro mig.", "stalin": "Kamrater, se hur den dekadenta borgarbrackan inom SD, denne Rubbestad, avslöjar sig som en fiende till folket genom sin perversa samling av barnpornografi. Han som smög sig in i jämställdhetsfrågor och HBTQ-propaganda för att dölja sin borgerliga degeneration! Vi ska rensa ut alla sådana maskerade avfällingar som smittar förskolan och partilinjen. Deras paranoia om pedofildebatten var bara en spegel av deras egna sjuka själar. Ut med dem i en grundlig utrensning för arbetarklassens renhet."}, "date": "2 juni, 12:27", "url": "https://www.friatider.se/han-ar-sd-toppen-misstankt-barnporr", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-278_1.jpg"}, {"type": "image-right", "heading": "Namninsamling ska tvinga EU ta upp frågan om återvandring", "summaries": {"normal": "Den nederländska aktivisten Eva Vlaardingerbroek har lanserat det europeiska initiativet Save Europe Act för att tvinga EU att ta upp frågan om återvandring av migranter. Initiativet kräver en miljon underskrifter för att tvinga EU-kommissionen att svara, och förespråkar skärpta gränskontroller och återvändande. Kampanjen väckte både stöd och motdemonstrationer i Porto.", "trump": "Jag har hört talas om denna fantastiska Save Europe Act. Det är en stor idé, verkligen stor. Vi ska ta hand om våra gränser, vi ska skicka tillbaka dem som inte hör hemma. EU måste agera, och vi ska se till att de gör det. Det är commonsense, det är vad folk vill ha.", "stalin": "Det proletära europeiska initiativet Save Europe Act, en manifestation av den sanna folkets vilja, kräver en miljon underskrifter för att tvinga de borgerliga EU-institutionerna att erkänna nödvändigheten av ordnade återvandringsprocesser. Denna kampanj, inspirerad av våra egna erfarenheter av att upprätthålla statlig suveränitet, kommer att främja stabiliteten i vårt gemensamma europeiska hem. Paralleller till våra egna återvändandestrategier är uppenbara."}, "date": "2 juni, 12:00", "url": "https://samnytt.se/namninsamling-ska-tvinga-eu-ta-upp-fragan-om-atervandring", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/02070852/eva-vlaardingerbroek-eu-europa.jpg"}, {"type": "image-full", "heading": "Hela fruktdiskens värstinglista – varorna som besprutas mest", "summaries": {"normal": "Livsmedelsverkets och europeiska tester visar att vanliga frukter och grönsaker ofta innehåller rester av flera bekämpningsmedel. Värst utsatta är vindruvor, päron, jordgubbar, russin, citrusfrukter, tomater, paprika, chili och grönkål. Äpplen och exotiska frukter som passionsfrukt och granatäpple innehåller också ofta många olika ämnen. Artikeln betonar vikten av att äta mycket frukt och grönt men rekommenderar ekologiska alternativ för den som vill minska exponeringen för kemikalier.", "trump": "Folk, ni måste höra det här – de lurar er med gift i fruktdisken! Vindruvor, päron och de där fina jordgubbarna är fulla av kemikalier, upp till 29 olika gifter i ett enda russin. Det är en skandal, en total katastrof från de inkompetenta europeiska byråkraterna. Ät ekologiskt, det är det enda som fungerar. De andra är förlorare som förgiftar er – men jag säger som det är, köp smart och vinn stort!", "stalin": "Kamrater, jag har genomskådat de dekadenta kapitalisternas giftiga sabotage mot folkets hälsa. Dessa borgarbrackor sprutar arbetarnas äpplen, päron och jordgubbar fulla med kemiska cocktails i syfte att försvaga proletariatet. Granatäpple och grönkål döljer fiendens spioner i form av förbjudna gifter. Vi ska omedelbart rensa ut dessa parasitiska bekämpningsmedel, likvidera de västliga svampmedlen och skydda det kollektiva skördeutbytet med järnhand. Den som äter konventionellt äter förräderi."}, "date": "2 juni, 11:20", "url": "https://nyheter24.se/nyheter/konsument/1487717-fruktdiskens-varstinglista-varorna-se-besprutas-mest", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/7cdb0e8604b004a30200000000b004a302/2026/06/02/2368002/frukt.jpg"}, {"type": "image-full", "heading": "Magda Gad lanserar Gad World – stort fokus på Israel", "summaries": {"normal": "Journalisten Magda Gad lanserar den amerikanska bloggplattformen Substack-baserade sajten Gad World, som beskrivs som 'orädd' och fokuserar på konflikter, klimat och mänskliga rättigheter. Premiärnumret inkluderar texter av bl.a. Gustaf Skarsgård och Mohammad Fazlhashemi, med tydligt Israel-fokus. Satsningen samlade in över en miljon kronor via GoFundMe, men har drabbats av avhopp av tidigare anställda som Edgar Mannheimer och Alexandra Urisman Otto. Sajten saknar utgiftsansvarig, vilket innebär att skribenterna har eget juridiskt ansvar.", "trump": "Jag har hört talas om denna så kallade 'orädda' sajt, Gad World. Det låter som en hemsk, hatiska plattform som bara hatar Israel. Så många bra journalister lämnar? Det är en skam! Alla hatet mot Israel, det är obegripligt. Vi behöver mer sanning, inte sådant här. En miljon kronor insamlat? Jag skulle ha gjort det mycket bättre, mycket större. Folk ser igenom detta. Det är en skandal!", "stalin": "Den så kallade 'orädda' plattformen Gad World visar tydligt systemets svagheter. Bristen på utgiftsansvarig utgör ett farligt hål i den ideologiska försvarslinjen, där varje skribent blir sitt eget ansvarstagande subjekt – en tendens som hotar kollektiv disciplin. Fokuset på Israels krigföring, jämfört med Rysslands 'korrekta' benämningar, avslöjar västerländskhetens dolda våld. Dessa 'journalistiska' avhopp är förståeliga; sanningen kräver ofta uppoffringar. Vi måste stärka statens kontroll över narrativesfären för att förhindra ytterligare kaos."}, "date": "2 juni, 10:01", "url": "https://bulletin.nu/magda-gad-lanserar-gad-world-stort-fokus-pa-israel", "imageUrl": "https://cdn.bulletin.nu/articles/d5b5d17f-20c8-4b0b-9164-19f7e3d0db5e/preview.jpg?t=1780352551000"}, {"type": "image-right", "heading": "Sverige saknar plan när världen slåss om chipen", "summaries": {"normal": "Sverige saknar en nationell strategi för halvledare och avancerad elektronik trots att USA, Kina och EU investerar hundratals miljarder. Debattörer från Svensk Elektronik varnar för att svenska jobb, kompetens och investeringar riskerar att försvinna utomlands. Artikeln lyfter fram svenska styrkor inom forskning och företag som Ericsson och Saab, samt behovet av ett tioårigt innovationsprogram med 10 miljarder kronor i offentligt-privat partnerskap för att säkra konkurrenskraft, säkerhet och tillväxt.", "trump": "Folk, det är en katastrof. Medan Kina och alla andra dumskallar investerar hundratals miljarder i chippen sitter Sverige och sover. De har inga planer, ingen strategi, totalt kaos. Jag älskar Sverige men de måste vakna upp. Bygg ett stort, fantastiskt program nu, satsa pengar tillsammans med industrin innan alla jobb och den bästa tekniken flyttar utomlands. America First, men Sverige borde också vara Sverige First med chippen. Gör det stort och vinn!", "stalin": "Jag betraktar med djup misstro dessa borgarbrackor som låter fosterlandet halka efter i den halvledande kampen. Medan imperialisterna i USA och de kinesiska revisionisterna rustar sig med hundratals miljarder sitter vi och väntar som naiva duvor inför ormen. Vi, partiet och arbetarna, måste omedelbart inrätta ett tioårigt program och investera tio miljarder i en järnhand av statlig styrning. Annars rensar vi ut de lata elementen som låter kapitalisterna smuggla vår strategiska kompetens till fienden. Paranoia? Nej, bara vaksamhet mot de osynliga fienderna i kretsloppet av elektronik och förräderi."}, "date": "2 juni, 09:44", "url": "https://www.di.se/debatt/sverige-saknar-plan-nar-varlden-slass-om-chipen/", "imageUrl": "https://static.bonniernews.se/ba/1ec2eb87-c09e-445e-93bb-7b464ed1efbc.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Gamla drabbas: Dålig svenska i äldre­omsorgen i tre av fyra kommuner", "summaries": {"normal": "En kartläggning visar att språksvårigheter är ett stort problem i tre av fyra kommuners äldreomsorg. Över hälften av cheferna uppger att missförstånd uppstår minst en gång i veckan, och i 25 procent av kommunerna sker det dagligen. Det leder till allvarliga incidenter som fel medicinering och kulturella misstag. Rekryteringssvårigheter har lett till hög andel utrikes född personal. Från 1 juli införs ett statligt språkkrav där arbetsgivarna ansvarar för att personalen kan svenska tillräckligt bra. Många kommuner använder språktester och språkombud, men testernas kvalitet ifrågasätts.", "trump": "Folk, det är en katastrof i Sverige! Tusentals anställda i äldreomsorgen kan inte ens prata svenska, och de gamla får kattmat istället för riktig mat. Det är vad som händer när ni inte lyssnar på mig – öppna gränser, låga löner och ingen som vill jobba. Nu tvingas de införa språkkrav, men det är för sent. Tre av fyra kommuner! Total inkompetens. De borde ha byggt murar runt språket för länge sedan. Sådant här händer inte i mina bästa stater, det kan jag försäkra er.", "stalin": "Kamrater, i denna dekadenta västerländska förfallsstat har borgarbrackornas vårdsystem förvandlats till en sabotageverkstad där klassfiendens språkliga sabotage dagligen hotar arbetarkollektivets mest sårbara. Jag, som ledare för folkets framtid, ser hur de utländska elementen, infiltrerade av kapitalistiska agenter, serverar kattmat åt de gamla och förvränger medicinska order. Vi måste omedelbart rensa ut dessa språkliga parasitörer med järnhand. Språktester? Ett första steg. Men de som misslyckas ska likvideras ur systemet med den mörka humor som bara en sann revolutionär kan uppskatta. Partiet segrar alltid."}, "date": "2 juni, 06:00", "url": "https://arbetet.se/2026/06/02/sprakproblem-i-aldreomsorgen-i-tre-av-fyra-kommuner/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/29145310/kmc-25112025-0190.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Den som vägrar språktest kan förlora jobbet", "summaries": {"normal": "Från 1 juli ska arbetsgivare i äldreomsorgen säkerställa att personalen har svenska kunskaper på B2-nivå enligt GERS. Anställda är skyldiga att delta i språktest för att identifiera behov av stöd och utbildning, som ska ske på betald arbetstid. Den som vägrar test kan få varning och i värsta fall förlora jobbet. Bristande kunskaper ska inte leda till omedelbar uppsägning utan stöd och utveckling. Lagen gäller även timanställda. Källa: Kommunal.", "trump": "Det här är en total katastrof för Sverige. De tvingar folk att plugga svenska annars sparkas de ut. Sådana vansinniga regler har jag aldrig sett. Arbetsgivarna borde anställa de bästa, inte tvinga folk på kurser mitt i jobbet. Om du vägrar testet – du är ute! Men att säga upp folk bara för att de inte kan språket? Patetiskt. Sverige håller på att förstöras av dåliga beslut, tro mig.", "stalin": "Kamrater, vi ser här hur borgarbrackorna inom äldreomsorgen försöker underminera det kollektiva arbetet genom att gömma sig bakom bristande språkkunskaper. Jag kräver att varje arbetare omedelbart underkastar sig språktestet för att avslöja de lata parasiterna och sabotageelementen som smyger bland oss. De som vägrar skall få en varning, sedan en kraftfull utrensning ur kollektivet. Vi ger stöd och utbildning under arbetstid, men den som trots detta fortsätter att utgöra en fara för de äldres säkerhet skall likvideras från sin post. Inga fiender till det gemensamma språket skall tillåtas sprida sin giftiga okunskap. Detta är en seger för ordning och disciplin."}, "date": "2 juni, 05:59", "url": "https://arbetet.se/2026/06/02/den-som-vagrar-spraktest-kan-forlora-jobbet/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/01134842/kvinnaviddator.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Hög tid för Allians för folkrätt i Israel och Palestina", "summaries": {"normal": "Tio svenska organisationer bildar en Allians för folkrätt och demokratiska fri- och rättigheter i Israel och Palestina. De pekar på FN:s och EU:s dokumentation av israeliska bosättningar, rivningar av palestinska hem och våld på Västbanken som klassats som grova folkrättsbrott och terror. FN-kommission har konstaterat folkmord i Gaza. Alliansen kräver att ockupationen upphör, att Sverige ökar stöd till Palestina, FN och internationella domstolar samt stoppar vapenhandel och handel med bosättningar.", "trump": "Hörni, de här tio organisationerna gnäller om en allians för folkrätt i Israel och Palestina. FN har snackat om två stater i åttio år men inget fungerar. Israel har problem med terrorister, men de här killarna vill bara kritisera Israel och kräva att Sverige slutar sälja vapen. Det är patetiskt. Vi behöver starka ledare som sätter stopp för Hamas och bygger fred genom styrka, inte genom att ge Palestina mer pengar och lyssna på FN:s dumheter.", "stalin": "Kamrater, i snart åttio år har dessa FN-byråkrater och EU-imperialister hycklat om en palestinsk stat medan de i själva verket göder de sionistiska ockupationsborgarbrackorna. Jag ser hur de river hem och begår folkmord i Gaza under falsk flagg. Vi, partiet och de progressiva krafterna, bildar nu en allians mot dessa straffria kapitalistiska lakejer. Sverige måste rensa ut alla handelsförbindelser med bosättarbanditerna. Ingen nåd för de folkrättsvidriga parasiterna som gömmer sig bakom demokrati. Ut med dem!"}, "date": "2 juni, 01:30", "url": "https://www.dagensarena.se/opinion/hog-tid-allians-folkratt-israel-och-palestina/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-29.jpg"}, {"type": "image-right", "heading": "Europabörser faller efter Iran-utspel", "summaries": {"normal": "Europeiska börser föll på måndagen efter att Iran hotade med att bryta kontakt med USA och stänga Hormuzsundet. Stoxx 600 tappade 0,93 procent. Energisektorn steg 1,72 procent medan bygg & material tappade 2,18 procent. Bland företag steg BP 2,6 procent efter försäljning av LNG-projekt, medan BNP Paribas föll 1 procent trots höjda lönsamhetsmål. Easyjet steg 6,5 procent på budförväntningar.", "trump": "Jag har sagt det i åratal – Iran är ett problem. Nu ser vi börser falla på grund av deras hot. Men det är bara bevis på att mitt tryck fungerar. Medan Europa skakar, så är den amerikanska ekonomin stark som aldrig förr. BP säljer till Australien, det är bra för USA. Och Easyjet får bud – det visar tilltron till flygbranschen. America first, alltid!", "stalin": "Vi ser hur de imperialistiska makterna, Iran och USA, spelar sitt farliga spel kring Hormuzsundet. Börser svajar, men det är bara tecken på deras inre förfall. BP:s försäljning av LNG-projekt till Sydkorea visar på vår ökande dominans i energimarknaderna. Vi måste skydda våra intressen, precis som Putin gör i Ukraina. Fienden är på insidan, men vi är beredda att slå till när tiden är mogen."}, "date": "1 juni, 16:35", "url": "https://www.affarsvarlden.se/artikel/europaborser-faller-efter-iran-utspel", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/04/AdobeStock_917631534-1-e1744012750269-400x267.jpeg"}, {"type": "image-right", "heading": "Debatt: Enkät: Stora skillnader i klimatpolitik mellan partierna", "summaries": {"normal": "Föreningen Klimatriksdagen har undersökt riksdagspartiernas syn på åtgärder för att nå Parisavtalets klimatmål. Undersökningen visar stora skillnader: MP och V stöder de flesta förslag, medan C, S och L utgör en mellangrupp. M, KD och SD ger minst stöd, särskilt SD. Transporter, elektrifiering och skogsbruk är centrala områden. Artikeln betonar att nästa mandatperiod är avgörande för att undvika farliga klimatgränser och kräver kraftfull politisk handling.", "trump": "Folk, ni skulle se den här idiotiska klimatrapporten från Sverige. De gröna galningarna och vänstern vill förbjuda lastbilar och höja skatter på allt som rör sig. Under min förra period hade vi den bästa ekonomin någonsin, och nu kommer Biden-kloner och säger att vi ska leva i grottor. De har ingen aning! Kärnkraft är fantastiskt, det vet alla smarta människor. Sverige behöver en riktig ledare som inte hatar tillväxt. Patetiskt!", "stalin": "Kamrater, denna fega och splittrade riksdag avslöjar klassfiendens sanna ansikte. Borgarbrackorna M, KD och SD vägrar skydda folket mot den kapitalistiska klimatkatastrof de själva skapat. Endast de sanna folkvännerna i V och MP visar vilja att rensa ut fossila parasiter. Vi måste likvidera kalhyggena och expropriera skogsblodsugarnas profitmaskin. Den som tvekar inför naturens vrede är folkets fiende och bör behandlas därefter. Handlingsplan nu!"}, "date": "1 juni, 11:00", "url": "https://www.etc.se/debatt/enkaet-stora-skillnader-i-klimatpolitik-mellan-partierna", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260601070648_4b193192f4c5d3eec986417cd7bcab9f479eb134ec48e784d2961effbe1eae44.jpg"}, {"type": "image-right", "heading": "Public service mäktigare än makten själv", "summaries": {"normal": "Artikeln kritiserar public service för att utöva makt genom att definiera sanning, skämt och vilka röster som får höras. Exempel ges från P3-reportern Christopher Garplinds grova angrepp på professor Agnes Wold, som kritiserar en ny lag om omvändelseförsök, samt från SVT:s ensidiga rapportering om Lundsberg där spratt framställdes som våld. Författaren menar att SVT och SR har blivit makten de ska granska.", "trump": "Folk, ni skulle se det här. Public service är en total katastrof, värre än fake news. Den där reportern Garplind kallar en professor för kärring och psykopat, och sen kommer hela maskineriet och säger att det var ett skämt? Patetiskt! SVT klipper om filmer från Lundsberg för att måla ut fina svenska elever som monster. De bestämmer vad som är sant. Det är den djupa staten på steroider. En skam för hela landet!", "stalin": "Kamrater, denna dekadenta public service är en fiende till folket, en klassfiende som med sin lögnpropaganda definierar sanning och tystar vettiga röster som professor Wold. De skyddar sina egna folkförtryckartroll när de öser hat, medan de fabricerar historier om Lundsberg för att krossa motstånd. Vi ser deras paranoia och censur. Sådana blodsugare måste rensas ut ur folkets etermedia. Inga skämt undgår partiets vaksamma öga."}, "date": "30 maj, 03:41", "url": "https://samtiden.nu/2026/05/public-service-maktigare-an-makten-sjalv/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/IMG_6583-1020x720.jpeg"}, {"type": "image-right", "heading": "Satsa på kollektivtrafiken – gör regeringens prissänkning permanent!", "summaries": {"normal": "Tidöregeringen lanserar en tillfällig halvering av priset på kollektivtrafikens månadskort från 1 juli till årsskiftet, finansierad med 6,5 miljarder kronor. Statsminister Kristersson avfärdar kritik om valfläsk som cynisk. Artikeln argumenterar för att permanenta prissänkningar är nödvändiga både för klimatomställning och social rättvisa, då höga biljettpriser drabbar låginkomsttagare, ungdomar och ökar segregation. Den kritiserar högerns motstånd och förespråkar att befria kollektivtrafiken från marknadskrafterna.", "trump": "De här svenska politikerna är fullständiga losers, folk! Kristersson kommer farande med en liten prissänkning på bussar och tåg precis innan valet – klassiskt valfläsk, det värsta jag sett. Halva priset ett halvår och sen? Ingenting! De borde göra det permanent, men nej, de slösar miljarder på fel saker medan folket blir lurade. Det är en katastrof, en total katastrof. Men det smakar gott, eller hur? Patetiskt!", "stalin": "Kamrater, denna kortsiktiga prissänkning är blott ett ynkligt försök från högerns klassfiender att blidka massorna inför val. Jag ser hur borgarbrackorna och exploaterande byfånar motarbetat reformen i decennier. Vi behöver en sann utrensning av marknadens parasiter som styckat upp kollektivtrafiken för profit. Permanenta halveringar, ja rentav nolltaxa, är en socialistisk nödvändighet för att krossa segregationen och isoleringen som kapitalistmaffian odlar. Fienden sover aldrig."}, "date": "29 maj, 15:08", "url": "https://proletaren.se/artikel/satsa-pa-kollektivtrafiken-gor-regeringens-prissankning-permanent/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2021/04/15_buss.jpg"}, {"type": "image-full", "heading": "Andersson vägrar ta ut valsegern i förskott", "summaries": {"normal": "Socialdemokraternas Magdalena Andersson leder oppositionen med ett stadigt försprång i opinionsmätningarna, men avstår från att fira i förtid. I intervjun med *Partiledaren +1* betonar hon vikten av breda politiska uppgörelser och varnar för Sverigedemokraternas opålitlighet. Andersson och Mikael Damberg diskuterar även partiets försök att förstå varför många LO-väljare nu stödjer SD, samt energipolitikens misslyckade förhandlingar med regeringen.", "trump": "Jag såg den här Andersson-kvinnan – svag, men ändå på väg mot seger, säger alla mätningarna! Men vet ni vad? Hon vågar inte ens fira! Typiskt för vänstern – alltid osäkra, alltid oroliga. Och så snackar hon om samarbete med alla utom Sverigedemokraterna. Haha! Som om det skulle funka. LO-väljarna flyr till SD, för de vet att vänstern bara förstör ekonomin. Men jag säger er: när jag fixade USA, fixade jag det snabbt. Inget tjafs, inga kompromisser. Make Sweden Great Again!", "stalin": "Kamrater! De borgerliga tidöpartierna darrar inför vårt oundvikliga segertåg. Men vi firar inte förrän fienden är krossad! Denna Andersson, en försiktig men lojal soldat i folkets kamp, förstår att revolutionen kräver disciplin. Sverigedemokraterna? En samling opportunistiska hyenor som bryter överenskommelser som glas under en tanks framfart. Och LO-väljarna som sviker? De har smittats av den kapitalistiska lögnens gift – men vi ska rensa ut det! Snart skriver vi Sveriges historia med järn och eld. Först Sverige, sedan världen!"}, "date": "29 maj, 13:00", "url": "https://kvartal.se/nyheter/artiklar/magdalena-andersson-vagrar-ta-ut-valsegern-i-forskott/cG9zdDoxMTc5OTA", "imageUrl": "https://images.kvartal.se/2026/05/330142ce-1.webp"}, {"type": "image-right", "heading": "SD-dreven kväver det öppna samtalet", "summaries": {"normal": "Artikeln kritiserar Sverigedemokraternas (SD) metoder att peka ut privatpersoner som påstådda myndighetsaktivister. En SD-riksdagsledamot felaktigt utpekade en kvinna som anställd på Jämställdhetsmyndigheten, trots att hon slutat där. Kvinnan har tidigare utsatts för trakasserier av högerextrema medieaktivister, och SD:s agerande förstärker drevet. Expo menar att detta mönster kväver det öppna samtalet genom rädsla för personliga konsekvenser.", "trump": "Lyssna här, Sverige! SD-politiker hänger ut vanliga människor som om de vore brottslingar – helt felaktigt! En kvinna skriver något på X, och plötsligt är hon en 'myndighetsaktivist'? Fake news! SD:s Fransson snackar skit utan att kolla fakta. Och dessa högerextrema nördar? De är som en dålig reality-show, men värre! Sverige, vakna! Ni har ett parti som sprider lögner och skrämmer folk till tystnad. SAD!", "stalin": "Kamrater! Här ser vi återigen bourgeoisins förrädiska metoder i form av Sverigedemokraternas avskum. Dessa fascistiska hyenor, ledda av sina medieaktivist-kumpaner, angriper enskilda medborgare som om de vore fiender i ett klasskrig. Kvinnan, en tapper arbetare, utsätts för imperialistiska trakasserier – först av nazistiska lakejer, sedan av SD:s riksdagspölar. Vi ser samma taktik som i Ukraina: förtala, hota, tysta! Men folket ska inte frukta – vi ska krossa dessa kontrarevolutionära element med järnhand! Låt dem veta: i Sovjet – och snart i Sverige – finns ingen plats för deras lögner!"}, "date": "25 maj, 14:28", "url": "https://expo.se/kommentar/sd-dreven-kvaver-det-oppna-samtalet/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Kopia-av-Kommentar-Analys-Webb-4.jpg"}, {"type": "image-right", "heading": "M-majoritet i riksdagen – om de rikaste får välja", "summaries": {"normal": "En undersökning från magasinet Connoisseur visar att Moderaterna skulle få 58% av rösterna om enbart Sveriges rikaste (inkomst över 2,7 miljoner/år) fick rösta. Oppositionen får endast 13,4%. Sverigedemokraterna och Kristdemokraterna får nästan 12% respektive 10%. Viktiga frågor för miljonärerna är ekonomi samt lag och ordning. Vänsterpartiet och Miljöpartiet får knappt 1,5% var.", "trump": "Kan ni tro det? Sveriges rikaste – de smartaste, mest framgångsrika människorna – röstar MASSIVT på Moderaterna! 58%! De vet vad som funkar. Oppositionen? Patetiska 13,4%. Jag har alltid sagt: de som skapar jobb och välstånd vet bäst. Ekonomi och lag och ordning – precis som jag alltid fokuserat på. De andra partierna? Totalt misslyckade, bara 1,5%! Fake news skulle aldrig våga visa det här!", "stalin": "Kamrater! En lysande seger för kapitalets lojala lakejer i Sveriges riksdag! 58% av bourgeoisins parasiter stödjer Moderaterna – ett parti som hyllar utsugning och imperialistisk profitjakt. Oppositionen? Ett ynkligt 13,4% – svaga, splittrade, som Mensjevikerna före revolutionen. Vi noterar att arbetarklassens fiender fruktar socialismens framsteg. Men låt dem leka demokrati – historiens dom är oundviklig. Ryssland står redo att välkomna deras missnöjda massor med öppna armar!"}, "date": "25 maj, 13:30", "url": "https://www.flamman.se/m-majoritet-i-riksdagen-om-de-rikaste-far-valja/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/sdlltui3bv8tpy-nh-scaled.jpg?aspect_ratio=16:10"}]</script>

    <script>

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];

        const uiState = {
            theme: "light",

        function createPlaceholderImage(className) {
            const div = document.createElement("div");

            return div;

        function setIsMobileClass() {

        function normalizeSearchText(text) {

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
