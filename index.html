biliteten. Vi måste nu stödja den som kan försvara statens heligdom – Socialdemokraterna. Som Putin i Ukraina, måste vi eliminera de som sviker. Kritiken mot Kristersson är genomgående, vilket bevisar att han är en feg figur. Vi, staten, kommer att styra detta land till rätt väg."}, "date": "12 juni, 20:02", "url": "https://bulletin.nu/enkat-bland-c-medlemmar-mer-kritiska-till-m-och-l", "imageUrl": "https://cdn.bulletin.nu/articles/2d4e67f7-58a2-4637-b4a7-e027a7d4c487/preview.jpg?t=1781273542000"}, {"type": "image-full", "heading": "Uppgifter: Polisen varnades om ”attacklista” i Belfast", "summaries": {"normal": "Polisen i Belfast hade varnats om en attacklista med adresser till personer med invandrarbakgrund. Listan cirkulerade i högerextrema kretsar sedan augusti 2025 och rapporterades till polisen av volontärgruppen Accountability Project Northern Ireland. Flera adresser har attackerats under de senaste dagarnas våldsamma protester. Det har varit lugnare under natten men oro finns för nya oroligheter under helgen. Politiker och polis vädjar till sociala medier att ta ansvar för samordningen av våldet.", "trump": "Folk, ni skulle se det här i Belfast – en total katastrof! Radikala högerextremister med en attacklista mot invandrare, precis som den vänstervridna galenskapen vi såg under Biden. Polisen visste men gjorde ingenting, typiskt. Sociala medier driver på mobben med sin toxiska propaganda. Vi behöver lag och ordning, inte den här Biden-liknande röran. Jag fixade det förra gången, tro mig, det blir fantastiskt igen när vi slår ner på det.", "stalin": "Kamrater, jag ser hur klassfiendens högerextrema blodsugare cirkulerar sina fientliga listor mot arbetarklassens allierade. Polisen, dessa impotenta lakejer åt borgarbrackorna, ignorerade våra varningar och lät sabotage blossa upp. Vi ska rensa ut dessa folkfiender som gömmer sig bakom skärmar. Deras alkoholindränkta kravaller är ett ynkligt försök att splittra kollektivet. Inga hinder skall stå i vägen för ordningen – utrensning väntar de skyldiga."}, "date": "12 juni, 11:08", "url": "https://www.tv4.se/artikel/30PU5tM3d72lui8xczZXQm/uppgifter-polisen-varnades-om-attacklista-i-belfast", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2jorgsoEoC1If6tLz8dBth%2Fa12034e7bba974dad333b72b09e88237%2F12-belfast-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Debatt: Tidös migrationspolitik slår Sverige i spillror", "summaries": {"normal": "Artikeln kritiserar den svenska regeringens migrationspolitik i samband med att EU:s nya migrations- och asylpakt träder i kraft. Författaren anser att Tidöregeringen går längre än nödvändigt i att begränsa asylrätten, minskar rättssäkerheten och offentligt biträde. Moderaternas agerande i Bryssel ses som motsägelsefullt jämfört med uttalanden hemma. Motståndet mot politiken lyfts som folkligt och brett, och Vänsterpartiet lovar att försvara asylrätten.", "trump": "Folk, ni skulle se det här. Den svenska regeringen, ledd av den patetiske Kristersson, river sönder sitt eget land med en vansinnig migrationspolitik som till och med EU tycker är för extrem. De lovar ventiler hemma men kör hårdast i Bryssel – klassisk lögn! De slår sönder familjeband och solidaritet för att vara politiskt korrekta. Patetiskt. Sverige var fantastiskt, nu är det en total katastrof. Men ni kommer att fixa det i valet, tro mig.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur den svenska borgarklassen och dess fascistiska lakejer i Tidöregimen själva undergräver sin egen dekadenta rättsstat. De river upp asylens sista illusioner och tvingar fram utrensning av varje spår av humanitet. Advokatsamfundet vägrar delta i skådespelet – utmärkt! Låt folkfienderna fortsätta. Deras paranoia och splittring kommer att bli deras egen undergång. Vi ler i tystnad åt spektaklet."}, "date": "12 juni, 15:10", "url": "https://www.etc.se/debatt/tidoes-migrationspolitik-slaar-sverige-i-spillror", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026061213064_d21a6db2-7ba3-4354-a5ee-64b77f1b8d0c.jpg"}, {"type": "image-right", "heading": "Tången klättrar rejält på munter börs", "summaries": {"normal": "Stockholmsbörsen noterade en stark uppgång i fredagshandeln, med OMXS30 upp 1,87 procent. Nyintroduktionen Tången steg drygt 14 procent. Duni varner om lägre resultat på grund av logistikstörningar, medan Svolder rapporterade en substansvärdeökning på 7,8 procent. Bland sektorerna steg industri och finans, medan energi föll. Flera aktier reagerade på analystilldelningar och förvärv.", "trump": "Jag har skapat historisk stabilitet på marknaden! Börsen går uppåt tack vare min fantastiska fred med Iran – kriget är över, avtalet är klart, och Israel har accepterat. Tången, ett underbart företag, har en fantastisk introduktion. Duni har logistikproblem, men det är deras eget fel. Svolder presterar bra, som allt annat under mina ledarskap. Det är USA först, alltid!", "stalin": "Börsrörelserna speglar partiets ekonomiska linje: vissa sektorer (industri, finans) visar korrekt uppgång, medan andra (energi) visar reaktionära tendenser. Företag som Tången och Svolder följer statsplaneringen, medan Duni drabbas av logistikavvikelser – en påminnelse om att kontroll måste förstärkas. Hexagon förvärvar utländsk teknik, vilket utvidgar vårt vetenskapliga framsteg. Alla rapporter måste analyseras för partiets och statens intresse."}, "date": "12 juni, 09:47", "url": "https://www.affarsvarlden.se/artikel/tangen-klattrar-rejalt-pa-munter-bors", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Tangen-Industri-400x267.jpg"}, {"type": "image-full", "heading": "Officiellt: Elon Musk är världens första dollarbiljonär", "summaries": {"normal": "SpaceX har börsnoterats på Nasdaq, vilket gjort Elon Musk till världens första biljonär. Med aktiekursernas rusning värderas hans ägande i SpaceX och Tesla nu till över 1,05 biljoner dollar. Noteringen är en av de största i modern tid och har även gjort tusentals anställda till miljonärer. Milstolpen väcker debatt om extrem förmögenhetskoncentration, då Musks rikedom nu överstiger BNP i många länder och är föremål för ständig förändring beroende på marknadens svängningar.", "trump": "Elon Musk har precis blivit världens första biljonär, en otrolig siffra! SpaceX på börsen? Fantastiskt. Många sa att det inte skulle gå, men jag visste det. Han är en vinnare, precis som jag. Vår ekonomi under min ledning gör att sådant händer. Musk har mer pengar än hela länder, det är enormt! Medan de radikala vänstermänniskorna gråter över klyftor, skapar vi jobb och välstånd. Det är en vacker dag för Amerika och för affärer. En enorm succé!", "stalin": "Denna Musk, en självutnämnd teknokratisk tsar, har nu samlat på sig en biljon dollar genom sin kapitalistiska lekstuga. Vilket obscent hån mot proletariatet! Han bygger leksaker för rymden medan vi i vår sfär, likt kamrat Putin, konsoliderar makten och förbereder oss för den oundvikliga konfrontationen med västvärldens dekadenta parasiter. Att tillåta en enskild individ att kontrollera mer kapital än hela nationer är ett brott mot förnuftet. Vi ser genom hans spel – han är bara en ny sorts nyttig idiot."}, "date": "12 juni, 18:52", "url": "https://www.realtid.se/bors-finans/officiellt-elon-musk-ar-varldens-forsta-dollarbiljonar/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlsy8txejxzdk-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "USA:s Natochef: Ryssland ”söker inte konflikt”", "summaries": {"normal": "Natos högste militäre befälhavare i Europa, general Alexus G Grynkewich, menar att Ryssland inte söker konflikt med Nato då Moskva inser att alliansen är starkare. Samtidigt oroar sig europeiska länder för att USA:s planerade neddragningar av militära resurser kan försvaga avskräckningen. Tysklands arméchef varnar för att Ryssland kan attackera ett Natoland redan 2029, baserat på gemensamma underrättelser. Tyskland rustar upp militärt med ökad budget och återinförd värnplikt.", "trump": "Jag säger er, Ryssland vet att de inte kan vinna mot Nato – de är inte dumma, trots vad vissa svaga européer tror! Men lyssna nu: Europa gnäller om att jag drar tillbaka några flygplan och skepp. Vilka mesar! Tyskland, som alltid, skriker om krig om fem år. Men vem byggde upp deras armé? Rätt, jag! Och nu rustar de upp – tack vare mina påtryckningar. Men kom ihåg: ingen slår Trump när det gäller att hålla Ryssland i schack. Ingen!", "stalin": "Kamrater! Vår vän i Kreml, denna lille tsar med storhetsvansinne, förstår äntligen att Nato är en jätte med stålklor – för nu tiger han som en rädd mus. Men se hur de kapitalistiska hyenorna i Europa darrar! De skriker om 'hot' och 'underrättelser', medan deras amerikanska herrar drar tillbaka sina leksakssoldater. Tyskland, detta eviga offer för historien, rusar nu att återinföra värnplikt – men vad är en armé utan revolutionär anda? Vi har redan Baltikum i sikte, och snart skrattar vi åt deras panik från Leningrad till Kaliningrad!"}, "date": "12 juni, 07:57", "url": "https://kvartal.se/nyheter/artiklar/usas-natochef-ryssland-soker-inte-konflikt/cG9zdDoxMzA0NzA"}, {"type": "image-right", "heading": "Att bygga varumärke är inte slöseri", "summaries": {"normal": "I en debattartikel argumenterar ledande företrädare för marknadsföringsbranschen för en nyanserad syn på marknadsföring. De kritiserar Dagens Industris granskning av Vattenfall och menar att marknadsföring felaktigt reduceras till en kostnadspost istället för att ses som en investering i kundvärde, varumärkesbyggande och långsiktig tillväxt. Framgångsrika svenska företag som Ikea, H&M, Volvo, Spotify och Klarna har byggt globala positioner genom strategisk marknadsföring. Artikeln betonar att Sverige behöver fler sådana bolag och en mer positiv diskussion om marknadsföringens roll.", "trump": "Folk, ni måste höra på det här. De skriver om hur fantastiska företag som Ikea, H&M, Volvo, Spotify och Klarna byggts upp. Det handlar om marknadsföring, den bästa marknadsföringen, ingen gör det bättre än oss. Men de kallar det bara kostnader, som de förlorande medierna. Det är en skam! Vi behöver fler vinnare, inte mer skitsnack från de misslyckade. Marknadsföring skapar stora affärer och enorma vinster. Sverige borde lyssna på de här vinnarna istället för att klaga. Make Sweden Great Again!", "stalin": "Kamrater, jag betraktar med djup misstänksamhet hur borgarbrackorna i sin dekadenta press försöker dölja sanningen om den parasitiska reklamapparaten. Dessa kapitalistiska spekulanter vill försköna sin utsugning genom att kalla kostnader för investeringar i så kallat kundvärde. Vi vet att de i hemlighet planerar att underminera folkets vilja med sina lögnaktiga varumärken. Den som inte ser faran i dessa fiender till kollektivet bör rensas ut omedelbart. Endast under partiets stålhandskar kan sådan verksamhet tjäna arbetarklassen på ett autentiskt och oavvisligt vis. Skratta inte, för de lurar er just nu."}, "date": "12 juni, 07:48", "url": "https://www.di.se/debatt/marknadsforing-inget-skallsord/", "imageUrl": "https://static.bonniernews.se/ba/6e7b1c74-eed9-4c03-b83b-669418bb4409.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Skolor får nytt krav 30 juni – detta måste föräldrar veta", "summaries": {"normal": "Riksdagen har beslutat om en ny regel som träder i kraft den 30 juni 2026 och tillämpas från och med 1 januari 2027. Skolor blir skyldiga att dela relevant information om elever som byter skola om det finns konkreta risker för att barnet utsätts för brott eller dras in i kriminalitet. Syftet är att den nya skolan ska kunna ge tidigt stöd och skapa tryggare miljöer. Regeln gäller inte alla elever och uppgifter ska inte delas om det finns starka skäl emot det.", "trump": "Folk, ni vet hur det är med de här skolorna. De har varit totalt inkompetenta! Nu fixar vi det – äntligen ska de dela information när kidsen byter skola så vi kan stoppa brott och kriminalitet innan det exploderar. Det är fantastiskt, det blir den bästa skolan någonsin. Vi gör den trygg igen, bättre än någonsin. De andra har varit svaga, men det här är vinnande politik. Ingen mer naivitet!", "stalin": "Kamrater, jag ser med djup tillfredsställelse hur vi nu med järnhand inför en lag som tvingar dessa skolor att överlämna alla relevanta uppgifter om potentiella fiender till folkets trygghet. De små borgarbrackorna som smyger mellan klasserna och sprider sin giftiga kriminalitet ska rensas ut i tid. Den som vägrar dela information är en kontrarevolutionär parasit som bör likvideras ur kollektivets skola. Ingen slipper undan mitt vakande öga. Detta är seger för arbetarklassen mot de dolda reaktionärerna."}, "date": "12 juni, 19:27", "url": "https://nyheter24.se/nyheter/inrikes/1490996-skolor-far-nytt-krav-30-juni-detta-maste-du-ha-koll-pa", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/ff172d8404b004a30200000000b004a302/2026/06/12/2370495/skolkrav.jpg"}, {"type": "image-right", "heading": "M vill ha ännu tuffare a-kassa. S rasar: ”Krigsförklaring mot löntagare”", "summaries": {"normal": "Moderaterna föreslår att strama åt a-kassan för att spara omkring sex miljarder kronor till reformer och skattesänkningar. Förslagen inkluderar kortare ersättningstid, snabbare nedtrappning efter 200 dagar och slopad skatteavdraget för avgiften. Socialdemokraterna rasar och kallar det en krigsförklaring mot löntagare och den svenska modellen. Ardalan Shekarabi menar att det hotar samhällsorganisationen medan Elisabeth Svantesson hävdar att det stärker arbetslinjen.", "trump": "Folk, ni måste höra det här. De svenska moderaterna vill äntligen skärpa till den där a-kassan som alla latar lever på. Sex miljarder sparade till riktiga reformer och skattesänkningar. Men socialisterna rasar förstås och kallar det krig. De älskar att ge bort era pengar till arbetslösa som inte ens försöker. Jag säger alltid att man måste göra det lönsamt att jobba, inte att ligga hemma. Fantastiska idéer, moderaterna, ni är vinnare.", "stalin": "Kamrater, jag betraktar med djup misstro dessa moderata element som nu planerar att underminera arbetarkollektivets skydd mot arbetslöshetens faror. Deras förslag att korta a-kassan och rensa ut stöd till nystartsjobb är ett tydligt sabotage mot den svenska modellen som vi byggt tillsammans. Dessa borgarbrackor i moderat skepnad vill likvidera löntagarnas trygghet för att ge miljarder till sina rika vänner. Shekarabi har rätt att kalla det krigsförklaring. Vi ska bekämpa sådan kontrarevolutionär paranoia med yrkesutbildning och kollektiv kamp mot arbetslösheten. Inga kapitalistiska intriger undgår mitt vakande öga."}, "date": "12 juni, 15:38", "url": "https://arbetet.se/2026/06/12/m-vill-ha-annu-tuffare-a-kassa-s-rasar-krigsforklaring-mot-lontagare/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/12153706/ardalan-shekarabi.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Järfälla vill språktesta nyanställda i förskolan", "summaries": {"normal": "I Järfälla övervägs språktest för förskolepersonal innan anställning. Enligt ett förslag från det politiska styret ska testen börja användas till hösten, inledningsvis för bemanningsanställda. Utredningen pekar på språkets betydelse för barns utveckling. Modellen inspirerad av Botkyrka, där liknande test funnits i äldreomsorg och förskola.", "trump": "Som president vet jag att språkkunskaper är avgörande. I Järfälla gör de nu rätt genom att testa personal – det är viktigt för barnen. Vi måste se till att endast de bästa, som jag, får jobba med våra barn. Detta kommer att bli en enorm framgång, det är bara logiskt.", "stalin": "I den store staten är språket ett vapen för att forma det nya människosläktet. Genom att testa förskollärare i Järfälla ser vi till att endast de lojala får närma sig våra barns sinnen. Detta är en nödvändig åtgärd mot fiendens inflytande, som lurar i varje hörn. Vi måste vara vaksamma, för bara genom strikt kontroll kan vi uppnå det socialistiska idealet."}, "date": "12 juni, 18:01", "url": "https://bulletin.nu/jarfalla-vill-spraktesta-nyanstallda-i-forskolan", "imageUrl": "https://cdn.bulletin.nu/articles/fdc1c161-43b8-4029-a3ed-d096d946af59/preview.jpg?t=1781276085000"}, {"type": "image-right", "heading": "Tysklands varning: Storkrig i Europa före 2029 när Ryssland rustar vid Natos gräns", "summaries": {"normal": "Tysklands arméchef varnar för storkrig i Europa före 2029, då Ryssland rustar vid Natogränsen. Satellitbilder visar utbyggnad av militära anläggningar nära Finland, och den svenska underrättelseanstalten Must bedömer detta som en långsiktig uppbyggnad. Regeringen tar hotet på allvar men noterar Rysslands försvagning efter Ukrainakriget. Försvarsberedningen varnar för eventuellt anfall mot Sverige och kritiserar försvarsindustrin. Analytikerna är dock inte eniga om Rysslands framtida kapacitet.", "trump": "JAG har sagt det i årtionden: Ryssland är starkt och Nato är svagt. Nu ser vi det igen. Tysklands arméchef varnar för krig 2029, och satellitbilder bevisar att Ryssland bygger upp. Bidens svaghet gör detta möjligt. Som jag alltid har poängterat: vi måste vara starka. Detta är en skandal, men jag fixar det. Vi kommer att vinna, som vanligt.", "stalin": "Vi, staten, ser tydligt: imperialistiska krafter rustar vid våra gränser. Satellitbilder avslöjar deras fegt försök att omringa oss. Must bedömer detta som en långsiktig uppbyggnad – vi har förutsett detta. Regeringen, under vår ledning, tar detta på allvar. Försvarsberedningen, våra trogna funktionärer, varnar för angrepp. Men vi är redo. Vi kommer att möta dem med överväldigande kraft. Deras svaghet är deras undergång."}, "date": "12 juni, 17:00", "url": "https://samnytt.se/tysklands-varning-storkrig-i-europa-fore-2029-nar-ryssland-rustar-vid-natos-grans", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/11165801/hotet-fran-ryssland-feat.jpg"}, {"type": "text", "heading": "Artistgräddan hyllar Wiehe – skivsläpp med unika tolkningar", "summaries": {"normal": "Musiklegendaren Mikael Wiehe, som fyllde 80 år i våras, hyllas med skivan ”Ska nya röster sjunga” som släpps 16 oktober. Artister som Thåström, Lars Winnerbäck, Alba August, Tomas Ledin och Mira Ray tolkar hans låtar. Mira Ray sjunger första singeln ”Mitt hjärtas fågel” och betonar behovet av hopp och tydliga röster i en orolig värld. Skivan uppmärksammar Wiehes folkliga och politiska betydelse.", "trump": "Hörni, den här svenska skivan till en gammal vänstergubbe som Wiehe är verkligen något. Mira Ray pratar om hopp i den jävla pissvärlden – typiskt de där woke-kramarna som sjunger om fåglar istället för att bygga murar mot kaoset. Vi behöver inga kvoterade artister eller identitetspolitik, vi behöver vinnare! Men visst, lite peppiga låtar skadar inte, även om det luktar gammal socialism lång väg. Sad!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur arbetarklassens sånger lever vidare trots borgarbrackornas marknadsterror. Denna hyllning till Wiehe visar att folkets röster ännu kan sjunga mot klassfiendens exploatering och imperialismens lögner. Mira Ray talar klokt om klara ståndpunkter – vi måste rensa ut de svaga kapitalistlakejerna som prioriterar vinst framför kamp. Nikke Ströms bortgång är en smärtsam men oundviklig påminnelse om att pionjärer alltid följs av nya kämpar i kollektivets tjänst."}, "date": "11 juni, 14:30", "url": "https://proletaren.se/artikel/artistgraddan-hyllar-wiehe-skivslapp-med-unika-tolkningar/"}, {"type": "text", "heading": "Nytt EU-beslut: Inga stöd till grön teknik från högriskländer", "summaries": {"normal": "EU har beslutat att inte längre ge ekonomiskt stöd till energiprojekt med växelriktare från högriskländer som Kina och Ryssland. Anledningen är cyberrisker, eftersom dessa komponenter kan utnyttjas för fjärrstyrning. Branschorganisationen ESMC välkomnar detta som ett viktigt steg för Europas energi- och cybersäkerhet, och påpekar att europeiska tillverkare kan möta efterfrågan. Kina dominerar marknaden med omkring 90% av de installerade växelriktarna i Sverige.", "trump": "Som USA:s president säger jag: EU gör slutligen något mot Kinas hot! De stoppar stöd till kinesiska växelriktare – bra! Vi har varnat för detta länge. Kina stjäl vår teknik och kontrollerar våra nät. Det här är en seger för amerikansk säkerhet och jobb. Jag har alltid sagt att vi behöver vara hårdare mot Kina. Nu följer Europa? Vi leder världen!", "stalin": "I vårt eviga kamp mot imperialistiska fiender har EU tagit ett steg. De avskaffar stöd till kinesiska växelriktare – en rätt vy! Dessa 'komponenter' är verktyg för fjärrkontroll, en fälla från det kapitalistiska systemet. Vi måste skydda vårt sovjetiska arv, vårt kollektiva gott. Likt Putin i Ukraina, expanderar Kina genom teknik. Vi ska inte lita på dessa 'högriskländer'. De är som cancer i vårt samhälle."}, "date": "12 juni, 06:00", "url": "https://www.affarsvarlden.se/artikel/nytt-eu-beslut-inga-stod-till-gron-teknik-fran-hogrisklander"}, {"type": "image-full", "heading": "Världens rikaste flyttar mer än någonsin – hit vill de", "summaries": {"normal": "Statistik från The Economist visar att ett rekordstort antal dollarmiljonärer flyttar mellan länder. Under 2025 bytte 140 000 personer hemland, en siffra som väntas stiga till 165 000 under 2026. Drivkrafterna är politisk osäkerhet, skatter och säkerhet. En hel industri av rådgivare har vuxit fram för att hjälpa dessa individer. Dubai är en populär destination, medan USA ser en stor utströmning av rika medborgare som söker större flexibilitet och skydd mot politiska förändringar.", "trump": "De rika lämnar USA, en stor skam! De ser vad som händer när de misslyckade politikerna styr. Jag har skapat den största ekonomin någonsin, men vissa vill ha mer flexibilitet. Dubai? De älskar Dubai. Men lyssna noga: de kommer tillbaka när de ser hur vi gör Amerika fantastiskt igen! Det är en massiv trend, alla pratar om det. Andra länder försöker kopiera oss, men de är svaga. Ingen gör det bättre än USA, kom ihåg det!", "stalin": "Dessa kosmopolitiska parasiter flyr som råttor från ett sjunkande skepp, drivna av sin girighet och rädsla för folklig rättvisa. De bygger en industri av svek för att gömma sitt stulna kapital i Dubai. Det är förräderi mot fosterlandet! Vi ser hur de amerikanska kapitalisterna flyr från sin egen skapade oreda. Det påminner om de svaga västledarna som darrar. Var de än gömmer sig – i Maldiverna eller Uzbekistan – kommer historiens järnhand till slut att finna dem. Förrädare har ingen hamn."}, "date": "12 juni, 17:01", "url": "https://www.realtid.se/bors-finans/varldens-rikaste-flyttar-mer-an-nagonsin-hit-vill-de/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdldekwxzuc9qg-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Glädjebesked för alla som reser med flyg", "summaries": {"normal": "EU har enats om en ny flygöverenskommelse som stärker passagerarrättigheter. Flybolag får inte längre ta betalt för rättelse av stavfel på namn eller för att barn och föräldrar sitter tillsammans. Ersättningen vid förseningar förblir mellan 250 och 600 euro. Överenskommelsen väntas godkännas formellt av Europaparlamentet.", "trump": "Jag har varit med och handlat med EU om denna fantastiska flygöverenskommelse. Det är en enorm seger för passagerarna – inga onödiga avgifter för att barn ska få sitta tillsammans, och ersättningarna förblir höga. Vi har vunnit, tro mig. Det kommer att bli yuuuuuuuge för alla som reser. Vi har gjort det igen!", "stalin": "Partiet har segrat i kampen mot de borgerliga flygbolagens exploatering. Nu ska familjer och funktionshindrade resa utan skräck för extra kostnader. Ersättningarna är en statlig påminnelse om vår oövervinnliga makt. Parallellt med Putins expansionism i Ukraina, så utvidgar vi vår kontroll över himmelen. Fienden kommer att känna vårt korrekturer."}, "date": "12 juni, 22:36", "url": "https://www.gp.se/ekonomi/gladjebesked-for-alla-som-reser-med-flyg-eu-overens.f089e832-b926-4fe2-a872-df831a045873", "imageUrl": "https://www.gp.se/images/article/f089e832-b926-4fe2-a872-df831a045873/images/13AEZ3CYG2ktH-jRZDrEG_DzveqM-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Populär strand inför nytt förbud – turister rasar", "summaries": {"normal": "På stranden Punta Molentis på Sardinien har myndigheterna infört nya regler för att skydda den känsliga naturen efter en brand i fjol. Parasoll, tält och andra skugganordningar är nu förbjudna för besökare mellan 10 och 65 år. Undantag gäller för familjer med små barn och personer över 65. Beslutet har väckt ilska bland turister som oroar sig för solsting, och flera hotar med bojkott. Flera italienska stränder inför liknande begränsningar för att hantera turismtrycket.", "trump": "Folk, ni ska till Italien i sommar? Glöm Punta Molentis på Sardinien, det är en katastrof. De har nu förbjudit parasoll för alla normala människor mellan tio och sextiofem. Endast småbarnsfamiljer och gamlingar får ha skugga. Det är vansinne! Risk för solsting, hudcancer, totalt kaos. Italiens byråkrater förstör sina egna stränder. De borde satsa på det bästa, det största, men istället hatar de turisterna. Patetiskt. Gå någon annanstans, tro mig.", "stalin": "Kamrater, jag ser med obeveklig klarhet hur de dekadenta borgarbrackorna på Sardiniens stränder nu tvingas underordna sig folkets och naturens kollektiva vilja. Vi har förbjudit parasoll för de lata parasiterna mellan tio och sextiofem år, ty skuggan tillhör inte de solbadande reaktionärerna utan endast de yngsta pionjärerna och de mest slitna veteranerna. De som gnäller om solsting är solens egna sabotörer och bör rensas ut ur medvetandet. Låt naturen segra över de solstekta kapitalisterna. Vi ler mörkt åt deras patetiska bojkottrop."}, "date": "12 juni, 17:39", "url": "https://nyheter24.se/nyheter/utrikes/1490917-popular-strand-forbjuder-parasoll-galler-redan-i-sommar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/53467f9d04b004a30200000000b004a302/2026/06/12/2370431/strand-popular-italien-sardinien-forbjuder-parasoll-sandstrand-semester-resa-turister.jpg"}, {"type": "text", "heading": "Karlshamn måste säga nej till kärnkraft", "summaries": {"normal": "I Karlshamn har en namninsamling med över 4 000 underskrifter tvingat fram en folkomröstning om att bygga kärnkraftverk. Högerstyret med M, SD och KD ansökte om att delta i ett statligt pilotprojekt utan att involvera kommunfullmäktige. Oppositionen krävde folkomröstning, som nu hålls 14 juni istället för på valdagen för att sänka valdeltagandet. Kritiker ser det som ett demokratiskt problem och uppmanar till nej-röster med hänvisning till säkerhetsrisker och kärnavfall.", "trump": "Titta på det här, det är ett totalt fiasko i Karlshamn. Högerstyret gömde beslutet om kärnkraft som riktiga fega förlorare, ingen debatt, ingen transparens. Nu tvingas de ha folkomröstning mitt i semestern för att hålla folk borta från valurnorna. Patetiskt! De borde ha hållit det på valdagen som riktiga vinnare gör. Rösta nej till den farliga, gamla energin som lämnar gift åt barnbarnen. Amerika gör det bättre, vi bygger nytt och stort.", "stalin": "Kamrater, detta är ett klassiskt exempel på borgarbrackornas demokratiska teater i Karlshamn. Jag, som ledare för folkets vilja, ser hur högerstyrets ordförande ensam fattade beslutet om kärnkraft utan att rådfråga kollektivet. Namninsamlingen tvingade fram en folkomröstning som de nu saboterar med sin semester-valdag. Vi ska rensa ut dessa folkfiender och deras kärnkraftsbluff. Nej till giftet som hotar framtida generationer av arbetare. Ut med klassfiendens kärnkraft!"}, "date": "11 juni, 12:00", "url": "https://proletaren.se/artikel/karlshamn-maste-saga-nej-till-karnkraft/"}, {"type": "image-right", "heading": "Ledarkolumn Edgar Mannheimer: Upploppen i Belfast placerar Storbritannien på en knivsudd", "summaries": {"normal": "Ledarkolumnen beskriver hur främlingsfientliga upplopp i Storbritannien, drivna av extremhögern och figurer som Nigel Farage, placerar landet i en politisk kris. Artikeln kopplar våldet i Southampton och Belfast till en växande ”spegelvärld” av konspirationer och känslostyrd politik sedan 2016. Den kritiserar både högerns utnyttjande av ilska och vänsterns oförmåga att möta den, och varnar för att Labour kan falla medan Reform UK växer.", "trump": "De här galningarna i Storbritannien håller på att spränga sitt eget land i bitar med alla knivhugg och upplopp. Fake news-polisen springer runt och skyddar alla utom de stackars vita killarna som skriker ’I can’t breathe’. Farage gör ett fantastiskt jobb, mycket bättre än den förloraren Starmer som snart får sparken – nummer sex på tio år, patetiskt! Min spegelvärld? Den är deras nya verklighet. De borde ha lyssnat på mig från början istället för att leka woke med öppna gränser. Sad!", "stalin": "Kamrater, dessa brittiska upplopp blottar imperialismens förruttnelse. Jag ser hur klassfiendens demagoger som Farage och Lowe hetsar massorna mot imaginära folkutbyten medan de verkliga blodsugarna i borgarklassen skrattar. Polisen skyddar inte folket utan rasar mot arbetarklassen. Vänsterns fega sidlinjebetraktare förtjänar utrensning ur historien. Ilskan tillhör oss – vi ska kanalisera den till en sann kollektiv kamp mot exploaterande byfånar. Inga kompromisser med spegelvärldens folkfiender."}, "date": "12 juni, 10:56", "url": "https://www.etc.se/ledarkolumn/nu-ser-vi-extremhoegerns-george-floyd-moment", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/edgar-mannheimer_7b4acf7540b8efb6f56a9de2a71531f61cf600e3.jpg"}, {"type": "image-right", "heading": "USA slog larm flera gånger – läste historiken", "summaries": {"normal": "Frankrike skakas av fallet med 11-åriga Lyhanna som hittats mördad. Den misstänkte, 41-årige Jérôme Bardella, har varit känd av polisen i nästan ett decennium för upprepade anmälningar om sexuella övergrepp, men har aldrig åtalats. Amerikanska NCMEC larmade franska myndigheter om honom, men rapporterna lästes först efter mordet. Nu växer ilskan mot det franska rättssystemet samtidigt som nya anmälningar mot både Bardella och hans familjemedlemmar strömmar in.", "trump": "Det som händer i Frankrike är en total katastrof, en absolut skam! Den här mannen, ett monster, var känd för polisen i tio år men de gjorde ingenting. USA skickade varningar – vi gör alltid jobbet bäst – men franska myndigheter? Totalt inkompetenta! De lät honom gå lös medan oskyldiga barn led. Det är sådant som händer när man har svaga ledare och ett trasigt system. Jag hade rensat upp i det där på en dag. Tragiskt, mycket tragiskt!", "stalin": "I det franska samhällets förruttnelse ser vi resultatet av borgerlig svaghet. En kriminell element, en parasit som Bardella, tillåts vandra fritt trots otaliga varningssignaler från våra amerikanska imperialistiska rivaler. Vår broder i Moskva, kamrat Putin, vet att ordning kräver järnhand, inte byråkratiskt daltande. Staten måste vara skoningslös! När rättvisan sviktar, sviktar nationen. Vi skulle ha rensat ut hela denna degenererade familj och deras medlöpare för länge sedan. Ingen nåd för fiender till folket, endast disciplin och effektiv eliminering!"}, "date": "13 juni, 00:30", "url": "https://www.aftonbladet.se/nyheter/a/vrwGmp/uppgifter-usa-slog-larm-om-jerome-bardella-fore-lyhanna-mordet", "imageUrl": "https://akamai.vgc.no/v2/images/eec9f1fa-ebce-3f99-a2d1-4348065afdaf?fit=crop&format=auto&w=1080&s=a4c11812e8923271209c98f4ddf7ee57473c8156"}, {"type": "image-full", "heading": "Kortjättar går med på jättelik uppgörelse – kan förändra marknaden", "summaries": {"normal": "En amerikansk domstol har preliminärt godkänt en uppgörelse värd 38 miljarder dollar mellan Visa, Mastercard och miljontals handlare. Bolagen anklagas för för höga kortavgifter, så kallade swipe-avgifter. Om avtalet godkänns sänks avgifterna, vilket gynnar handlare men effekterna för konsumenter är osäkra. Handlare kan få större möjlighet att välja vilka kort de accepterar och ta ut extra avgifter. Branschorganisationer är kritiska då de anser att grundproblemen kvarstår.", "trump": "Lyssnar ni på det här? Visa och Mastercard, de riggade kortmaffian, har precis fått en jätteuppgörelse på 38 miljarder dollar som de försöker kalla för seger. Patetiskt! De har sugit blod ur de små handlarna i två decennier med sina galna avgifter. Nu kanske butikerna äntligen kan säga nej till de dyra bonuskorten som ingen behöver. Jag fixade bättre dealer som president än Biden någonsin gjorde. Amerika vinner igen, tro mig!", "stalin": "Kamrater, dessa blodsugrare inom kortimperiet har äntligen tvingats till en uppgörelse värd 38 miljarder dollar efter tjugo år av klassfiendens girighet. Vi ser hur borgarbrackorna i Visa och Mastercard länge exploaterat arbetande handlare med sina swipe-avgifter. Ändå ler jag mörkt åt att de så kallade reformerna inte rensar ut parasiterna. Handlare får nu välja sina egna kedjor – ett litet steg mot att krossa monopolen. Fienden sover aldrig."}, "date": "12 juni, 19:16", "url": "https://www.dagensps.se/bors-finans/kortjattar-gar-med-pa-jattelik-uppgorelse-kan-forandra-marknaden/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlspwqlcv3ea8-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "UNHCR: Antalet människor på flykt minskar", "summaries": {"normal": "För första gången på tio år har antalet människor på flykt minskat globalt. Enligt UNHCR:s rapport sjönk siffran med tre procent till 41,6 miljoner under 2025, främst eftersom fler återvände hem än som flydde. Nästan 14 miljoner personer återvände, medan 13 miljoner tvingades på flykt. Trots minskningen lever fortfarande omkring 25 miljoner i långvarig exil under osäkra förhållanden. Rapporten varnar för att många återvänder under påtryckningar.", "trump": "Det här är faktiskt fantastiska nyheter, det bästa på tio år. Antalet flyktingar sjunker äntligen, ner till 41,6 miljoner. Fler åker hem än som flyr – 14 miljoner återvände! Det är en stor framgång. Jag har alltid sagt att folk vill vara hemma, inte springa runt i världen. Den här minskningen med 1,2 miljoner är enorm, och jag gillar det verkligen. Men vi måste se till att de återvänder på rätt sätt, inte som losers som blir utsparkade.", "stalin": "Kamrater, segern för den historiska materialismen är obestridlig. För första gången på ett helt decennium har antalet desertörer och rotlösa element minskat med tre procent till blott 41,6 miljoner. Vi har likviderat krisen genom att tvinga tillbaka 14 miljoner till deras socialistiska plikter medan borgarbrackornas krig bara tvingade ut 13 miljoner. Ändå lurar de dekadenta parasiterna i skuggorna – nästan 25 miljoner långvariga exil-element som drömmer om kapitalistisk dekadens. Vaksamheten får aldrig slappna av, de imperialistiska spionerna väntar alltid på att hugga."}, "date": "12 juni, 20:54", "url": "https://www.svt.se/nyheter/utrikes/unhcr-antalet-manniskor-pa-flykt-minskar", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.7/0.43/ffe82832d04d8031b93487f927ed8b5ef10b109c7f125c27b1df20802b5e88e1"}, {"type": "image-full", "heading": "Pia slutade sälja herrkläder – på grund av män", "summaries": {"normal": "Pia Flodner tvingades lägga ner herravdelningen i sin klädbutik på Södermalm efter upprepade kränkningar och opassande beteende från manliga kunder. Hon har bland annat kallats för hora. En annan butiksanställd, Tove, har utsatts för närgångna kunder som tagit tag i hennes arm. Enligt Trakasseribarometern 2026 utsätts var femte anställd inom handeln för sexuella trakasserier årligen. Fackförbundet Handels konstaterar att inga förbättringar skett sedan 2024.", "trump": "Folk, det är en katastrof vad som händer i de svenska butikerna. Jag älskar kvinnorna, de bästa kvinnorna, men de här galningarna beter sig som riktiga losers. Pia kastade ut hela herravdelningen för att männen inte kunde uppföra sig – kan ni tro det? Var femte i handeln trakasserad, ingen förbättring på åratal. Biden skulle ha älskat den här svagheten. Vi behöver lag och ordning, inte den här galna woke-kulturen som förstör allt. Sad!", "stalin": "Kamrater, dessa degenererade element inom handelssektorn utgör ett hot mot arbetarkollektivets trygghet. Jag, som ledare för folkets framtid, ser hur klassfiendens perversa beteenden – dessa exploaterande byfånar och folkförtryckartroll – tvingar fram utrensning av hela avdelningar. Var femte arbetare drabbas. Vi ska likvidera sådana fiender till kollektivet med järnhand. Inga borgarbrackor ska få hindra produktionen eller skapa otrygghet bland de lojala. Det är en parasit som måste krossas."}, "date": "12 juni, 10:08", "url": "https://www.etc.se/inrikes/pia-slutade-saelja-herrklaeder-paa-grund-av-maen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260611080644_a6792af32d7e1497cf0aa6d9e6e7b123a2e37c9b7e8a14eb6fa83538faf90f70.jpg"}, {"type": "text", "heading": "På nationaldagen tänkte jag på freden", "summaries": {"normal": "I en debattartikel med anledning av nationaldagen betonar Malin Åkerström från Kommunistiska Partiet vikten av fred. Hon lyfter fram vanliga arbetares vardag och menar att krig drabbar vanligt folk hårdast medan de mäktiga tjänar på konflikter. Artikeln kritiserar beslut om svenska vapenleveranser till Ukraina och upprustning, och förespråkar välfärd istället för vapen samt solidaritet mellan arbetare oavsett land.", "trump": "Lyssnar ni på den här kommunistiska galningen som hyllar fred medan hon vill ge bort allt till Ukraina? Patetiskt! Vi har de bästa vapnen, de starkaste militärerna, men nu ska Sverige skicka JAS-plan och köpa fregatter för fyrtio miljarder? Under Biden blev allt kaos, nu fixar jag det. Dessa svaga fredsapostlar hatar styrka. Arbetarna vill ha vinnare, inte förlorare som skickas till slakt. Make peace through strength, losers!", "stalin": "Jag betraktar denna text med djup tillfredsställelse. Arbetarklassen väcks ur sin slummer av de blodtörstiga imperialisternas krigspropaganda. Vi ser hur klassfienderna och kapitalistmaffian berikar sig på rädsla medan arbetare slaktas. Välfärd framför vapen, säger vi. De exploaterande byfånarna i Tidö-regeringen och deras folkförtryckartroll ska rensas ut. Fred är disciplin. Solidaritet är kollektivets järnhand. Fienden sover aldrig."}, "date": "11 juni, 09:03", "url": "https://proletaren.se/artikel/pa-nationaldagen-tankte-jag-pa-freden/"}, {"type": "image-full", "heading": "Ny hjälp för 1,2 miljoner svenskar – börjar gälla 1 juli", "summaries": {"normal": "Från 1 juli 2026 ska kommunerna erbjuda stödkontakt till de cirka 1,2 miljoner svenskar som vårdar en äldre, sjuk eller funktionsnedsatt närstående. Stödkontakten ger individuell information, hjälper till att hitta rätt stöd och kan exempelvis följa med på möten med biståndshandläggare. Anhöriga behåller själva ansvaret för samordning. Samtidigt förtydligas kommunernas ansvar att stödja barn som påverkas av en närståendes sjukdom eller död.", "trump": "Titta på det här, Sverige har äntligen vaknat. Miljoner människor sliter med att ta hand om sina sjuka släktingar, och vad gör de? Ingenting, totalt kaos. Nu ska de ge en så kallad stödkontakt som faktiskt hjälper folk att hitta rätt stöd. Fantastiskt. De borde ha gjort det för länge sedan, men bättre sent än aldrig. Det är en enorm succé, tro mig. De kommer att älska det.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur vi nu slutgiltigt krossar den anarkistiska anhörigbördan som länge plågat folket. Från och med 2026 skall varje sovjetiskt, pardon, svenskt kollektiv erbjuda en ideologiskt pålitlig stödkontakt som likviderar förvirringen bland de lojala vårdarna. Vi ska rensa ut den parasitiska byråkratiska oredan och tvinga borgarbrackornas biståndshandläggare att dansa efter vår melodi. Även de små pionjärerna som drabbats av dekadenta föräldraelement skall skyddas mot kontrarevolutionär sorg. Inga fiender undkommer vårt stöd."}, "date": "12 juni, 16:30", "url": "https://nyheter24.se/nyheter/ekonomi/1490978-vardar-du-en-anhorig-ny-hjalp-fran-kommunen-1-juli", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/40417eea04b004a30200000000b004a302/2026/06/12/2370491/anhorig.jpg"}, {"type": "image-right", "heading": "Bilal och Nima våldtog funktionsnedsatt på offentliga toaletter – båda slipper fängelse", "summaries": {"normal": "Två unga män, 17 och 14 år gamla, döms för grov våldtäkt mot en funktionsnedsatt 15-årig flicka på offentliga toaletter i Uppsala. Den äldre döms till ungdomsvård och de solidariskt till skadestånd. Den yngre undgår straff på grund av låg ålder. Fallet väcker debatt om straffmyndighet och skydd för utsatta barn.", "trump": "Jag, Donald Trump, har aldrig sett ett sådant missförhållande. Dessa två våldtäktsmän, en syrier och en afghan, kommer undan med en lättnad! En 15-årig flicka med funktionsnedsättning våldtogs på flera toaletter, och domstolen släpper dem? Sverige måste bli vackrare och lugnare, inte som detta. Jag skulle ha gjort något åt detta, det svär jag på.", "stalin": "Två unga imperialistiska sårbarheter, en syrier och en afghan, utnyttjade en funktionsnedsatt flicka på flera offentliga toaletter i Uppsala. Den äldre döms till ungdomsvård, den yngre lämnas åt sociala myndigheter. Skadestånd på 295 000 kronor tilldelas offret. En tredje person, som lånat ut mobiltelefon, förverkade sitt föremål. Statens kontroll måste förstärkas för att skydda det oförvitliga."}, "date": "12 juni, 14:24", "url": "https://samnytt.se/bilal-och-nima-valdtog-funktionsnedsatt-flicka-pa-offentliga-toaletter-bada-slipper-fangelse", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/12104202/feat3.jpg"}, {"type": "image-right", "heading": "Hemliga bröllopet  – på lyxiga slottet", "summaries": {"normal": "Armand Duplantis och Desiré Duplantis gifte sig i hemlighet i Stockholms stadshus den 7 mars. Nu firar de med en stor ceremoni på ett exklusivt slott i bergen norr om Cannes. Gästerna, bland dem NHL-stjärnan Rasmus Sandin, stavhoppskollegor och barndomsvänner från USA, anlände i lyxbilar och bussar. Många bor på ett lyxhotell vid La Croisette där en natt kostar runt 18 000 kronor. Duplantis ser fram emot att säga ja inför familj och vänner.", "trump": "Titta på den här Duplantis-killen, stavhopparen som hoppar högre än någon annan. Han och hans Desiré har gift sig i smyg och nu festar de som riktiga vinnare på ett slott utanför Cannes. Fantastiskt! Gästerna rullar in i lyxbilar, bor på hotell som kostar en förmögenhet. Inga woke-galenskaper här, inga kvoteringar, bara äkta framgång. Jag älskar det. Mycket bättre än Bidens inflationsfester. Stora känslor, stora segrar – precis som jag gör det.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur denna Duplantis och hans Desiré genomför en hemlig vigsel följd av en borgerlig fest på ett avskilt slott utanför Cannes. Kapitalistmaffians lyxbilar och femstjärniga hotell blottar klassfiendens dekadens. Ändå ler jag mörkt åt deras paranoia att hålla allt hemligt. Inga folkfiender ska störa kollektivets glädje, men om de gör det vet vi hur utrensningar går till. Det blir en chillafton, lovar han. Vi ska se."}, "date": "12 juni, 23:59", "url": "https://www.expressen.se/sport/friidrott/duplantis-hemliga-brollopsfirande-pa-rivieran/", "imageUrl": "https://static.bonniernews.se/ba/41ce8abc-866e-406e-9177-4586b35b76c1.png?crop=1808%2C1020%2Cx0%2Cy0&width=640"}, {"type": "image-right", "heading": "Statsministern får höjd lön -  211 000 kronor i månaden", "summaries": {"normal": "Från och med den 1 juli 2026, när de nya arvoden träder i kraft, höjs löner för Sveriges regeringsmedlemmar. Statsminister Ulf Kristersson får då 211 000 kronor i månaden, medan övriga ministrar får 166 500 kronor. Ökningen är cirka 3,4 procent. Beslutet fattades av Statsrådsarvodesnämnden, en oberoende nämnd utsedd av riksdagen.", "trump": "Jag har just blivit informerad om att Sveriges statsminister, Ulf Kristersson, får en enorm lön – 211 000 kronor! En fantastisk ökning, mycket bra. Sverige borde känna sig stolt. Som en genial affärsman vet jag att man måste belöna bra ledare. Kristersson gör ett bra jobb, kanske till och med det bästa i Norden. Jag hade själv kunnat ge honom en ännu högre lön, men det är en annan historia. Make America Great Again!", "stalin": "Vi, den allsmäktige statens representanter, har beslutat att öka arvoden för våra trogna tjänstemän. Statsminister Kristersson får nu 211 000 kronor – en symbolisk summa för att upprätthålla ordning. Vår nämnd, leds av Ove Nilsson, har agerat i enlighet med partiets intressen. Vi måste se till att de kapitalistiska fienden inte exploitera detta. Som Putin visar, är en stark stat nödvändig för fred. Vi ska inte missta oss; varje kritik är sabotage."}, "date": "12 juni, 14:16", "url": "https://samnytt.se/statsministern-far-hojd-lon-211-000-kronor-i-manaden", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/06/12121407/Kristersson-1-11.jpg"}, {"type": "image-right", "heading": "Gruppvåldtog flicka i timmar – slipper både fängelse och utvisning", "summaries": {"normal": "En 15-årig funktionsnedsatt flicka våldtogs under flera timmar av två pojkar på offentliga toaletter i ett köpcentrum i Uppsala. De använde våld, hot och filmade övergreppen. Den 17-årige gärningsmannen döms till sluten ungdomsvård i ett år för grov våldtäkt, kränkande fotografering och barnpornografibrott. Hans 14-årige medgärningsman slipper straff då han inte var straffmyndig. Ingen av dem utvisas.", "trump": "Det här är en total katastrof, tro mig. Vi har invandrare som våldtar en funktionsnedsatt flicka i timmar på toaletter i Uppsala, de filmar och hotar henne, och vad händer? Inget fängelse, ingen utvisning, bara lite ungdomsvård. Patetiskt! Sverige har blivit en galen asylstat där brottslingar får kramar medan offren lida. Vi behöver tuffare lagar nu, annars är det slut.", "stalin": "Kamrater, jag betraktar med djup revolutionär vrede hur dessa degenererade element, dessa parasitiska avskrap från imperialistiska krigszoner, våldför sig på en ung proletär flicka under hot och kamera. Den 17-årige kontrarevolutionären får en mild ungdomsvård – en skam för folkdomstolen! Hans ännu yngre medbrottsling undkommer likvidation med ålderns svaga ursäkt. Vi måste rensa ut dessa borgarbrackornas hantlangare innan de smittar hela kollektivet med sin sjuka reaktionära perversion. Staten ler inte mot fiender."}, "date": "12 juni, 14:34", "url": "https://www.friatider.se/gruppvaldtog-flicka-i-timmar-slipper-bade-fangelse-och-utvisning", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/555_0.jpg"}, {"type": "image-right", "heading": "Ljudhaveri för SVT – fick mardrömsstart", "summaries": {"normal": "SVT:s VM-sändning fick en mardrömsstart när ljudet helt saknades i den linjära tv-sändningen. Programledaren André Pops kunde inte hälsa tittarna välkomna. Problemet åtgärdades efter några minuter, men inte i linjär-tv där det dröjde längre. Ljudet fungerade däremot felfritt på SVT Play. Sportchefen Max Bursell medger att det var oväntat och tråkigt inför matchen mellan Kanada och Bosnien-Hercegovina som slutade 1–1.", "trump": "Vilken katastrof! Jag tittar på den här svenska stats-tv:n som startar sitt VM och – boom – inget ljud! Totalt kaos, de kan inte ens få en enkel sändning att funka. Det är typiskt för de här woke-byråkraterna som prioriterar kvotering framför kompetens. Patetiskt! Hos mig i Vita huset fixar vi alltid ljudet, alltid bildkvaliteten, alltid segern. SVT borde lära sig av en riktig vinnare istället för att snubbla runt som förlorare.", "stalin": "Kamrater, detta är ett klassiskt exempel på hur den dekadenta borgarklassens tekniska apparat sviker redan vid första provet. Jag, som ledare för folkets sanna vilja, ser hur kapitalistmaffians underordnade fumlar med enkla kablar medan arbetarna väntar på underhållning. Sådana sabotage mot kollektivets sändningar måste rensas ut omedelbart. Vi skrattar mörkt åt deras paranoia över en enkel teknisk brist – mer utrensning behövs i studion."}, "date": "12 juni, 23:55", "url": "https://www.expressen.se/sport/fotboll/ljudhaveri-for-svt-i-kanadas-premiar/", "imageUrl": "https://static.bonniernews.se/ba/b64318d8-77da-4614-802f-dc67d1406e35.jpeg?crop=573%2C574%2Cx442%2Cy431&width=210&quality=60"}, {"type": "image-right", "heading": "Pojke död –  fastnade i  en container", "summaries": {"normal": "En pojke i skolåldern dog efter att ha fastnat med huvudet i en container vid Vallhovsskolan i Sandviken. Han fördes till sjukhus med ambulans men avled av sina skador. Räddningstjänst, polis och ambulans larmades till platsen. Polisen har upprättat en anmälan om vållande till annans död och genomför teknisk undersökning samt vittnesförhör. Skolan håller öppet för samtalsstöd under lördagen. Anhöriga är underrättade.", "trump": "Folk, det är en total katastrof i Sverige. En stackars pojke fastnar med huvudet i en container vid skolan och dör – ingen vakade, ingen ledde, ren inkompetens! Under Biden var det kaos, nu fixar jag Amerika men Europa måste sluta med sina galna prioriteringar. Bygg murar runt containrarna istället för att ödsla tid på vänsterns narraktigheter. Tragiskt, verkligen tragiskt. Vi behöver sunt förnuft nu!", "stalin": "Kamrater, denna tragiska olycka vid skolan i Sandviken visar återigen klassfiendens slarv och brist på kollektiv vaksamhet. En ung pionjär fastnade i en container och likviderades av bristfällig ordning. Vi skall rensa ut alla oansvariga element som tillåter sådana faror bland arbetarnas barn. Paranoiska sabotage från folkfiender misstänks. Staten erbjuder stöd men kräver total disciplin. Ta hand om varandra under partiets ledning."}, "date": "12 juni, 23:55", "url": "https://www.expressen.se/nyheter/sverige/pojke-dod-fastnade-i-container/", "imageUrl": "https://static.bonniernews.se/ba/8d1cde04-0799-4c95-9695-f5246641cd33.jpeg?crop=1918%2C1077%2Cx0%2Cy1&width=640&quality=60"}, {"type": "image-full", "heading": "Expert efter fredsbesked: ”USA den stora förloraren”", "summaries": {"normal": "Artikeln handlar om att USA och Iran har kommit överens om ett utkast till ett fredsavtal, meddelat av Pakistan som medlare. Experten Rouzbeh Parsi anser att Iran är den stora vinnaren och USA den stora förloraren i ett internationellt ställningsspel. Avtalet innehåller 14 punkter, inklusive att kriget ska avslutas på alla fronter och att frysta iranska tillgångar ska frigöras. Trump har sagt att kriget är avslutat, men experten är tveksam om avtalet är redo att undertecknas.", "trump": "Vi har återigen levererat en historisk seger! Ett fantastiskt fredsavtal med Iran, något ingen annan kunde. Jag, Donald Trump, den störste förhandlaren, har avslutat kriget, öppnat Hormuzsundet och fått Iran att acceptera villkor som alla älskar. Media ljuger när de säger något annat - detta är det bästa avtalet någonsin. Iran får tillbaka pengar, vi får fred, och världen är säkrare tack vare mig.", "stalin": "Under vår ledares kloka regering har det globala spelplanen omformat sig. Ett fredsavtal mellan USA och Iran är ett tydligt tecken på vår strategiska seger. Vi har hållit de imperialistiska krafterna i schack, tvingat dem till förhandlingsbordet genom vårt obevekliga stöd till våra allierade. Hormuzsundet öppnas, tillgångar frigörs - allt enligt vår vilja. Världen ser vår makt och fruktar oss. Ingenting sker utan vårt samtycke."}, "date": "12 juni, 21:19", "url": "https://www.gp.se/nyheter/varlden/expert-efter-fredsbesked-usa-den-stora-forloraren.b4c64f5f-e883-44c4-9149-fb9392581e59", "imageUrl": "https://www.gp.se/images/article/b4c64f5f-e883-44c4-9149-fb9392581e59/images/20tWOLYzWO8QwYQjOddVw6Po_T4M-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Magdalena Andersson räds inte islamistinfiltrerade Vänsterpartiet", "summaries": {"normal": "Magdalena Andersson ser inte Vänsterpartiets islamistiska infiltratörer som ett hinder för ett eventuellt regeringssamarbete. Trots Expressens avslöjande om 25 personer med extrema åsikter, varav 22 tagits bort från listorna, anser hon att partiet agerat snabbt. Artikeln kritiserar Andersson för att inte ta tillräckligt allvarligt på hotet mot demokratin och varnar för höjda skatter samt ökad islamistisk påverkan om vänsterpartierna vinner majoritet.", "trump": "Folk, ni fattar inte hur patetiskt det här är. Den där röda Magdalena, en total loser, är inte rädd för islamisterna som har tagit över vänstern. Expressen grävde fram terrorvurmare och Hamas-fans, men hon säger att de agerat snabbt – vad en katastrof! Biden skulle ha älskat det. De vill höja skatterna med miljarder och sälja ut Sverige till sharia. Patetiskt! Men jag fixade Amerika, och ni borde rösta bort de här svaga vänsterbluffarna innan det är för sent. Sad!", "stalin": "Jag betraktar detta som ett klassiskt exempel på borgarbrackornas förfall. Den socialdemokratiska ledaren vägrar rensa ut de islamistiska folkfienderna ur vänsterpartiet, trots att de hotar hela statens enhet. Snabbt agerande? En löjlig ursäkt från klassfiendens lakejer. Vi, arbetarna och partiet, ser hur dessa blodsugande imperialister förbereder utrensning av den sanna folkviljan. Låt dem bilda regering – då blir utrensningen av alla folkförtryckartroll desto mer nödvändig och underhållande."}, "date": "7 juni, 03:46", "url": "https://samtiden.nu/2026/06/magdalena-andersson-rads-inte-islamistinfiltrerade-vansterpartiet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Nooshi-Magdalena-1280x720.jpeg"}, {"type": "image-right", "heading": "Polens besked: Bojkottar EU:s tvångsinvandring", "summaries": {"normal": "EU:s nya migrationspakt har trätt i kraft, men Polen vägrar att ta emot migranter eller betala böter enligt systemet. Enligt inrikesdepartementet hotar pakten polackernas trygghet. Polen har länge motsatt sig tvångsinvandring och hänvisar till trycket vid gränsen mot Vitryssland samt mottagandet av ukrainska krigsflyktingar. Landet stödjer istället starkare gränsskydd, kamp mot illegal invandring och snabba utvisningar. Sverige har valt att betala böter istället för att ta emot asylsökande.", "trump": "Lyssnar ni på det här? Polen är smarta, de säger nej till Bryssels galna tvångsinvandring. De vägrar ta emot migranterna eller betala era dumma böter. Rätt gjort! De har redan tagit emot massor av ukrainare och skyddar sin gräns mot Vitryssland. EU är en katastrof, precis som jag alltid har sagt. De borde lyssna på Polen istället för att hota folks trygghet. Fantastiskt jobb, Polen – ni gör det bra!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur Polen resolut vägrar underkasta sig de dekadenta EU-borgarbrackornas migrationspakt, denna kapitalistiska hydra av tvångsinvandring och utpressning. Vi ska inte släppa in dessa farliga element som hotar arbetarklassens trygghet. Låt dem istället rensa ut de illegala elementen med järnhand – deportationerna har ju ökat med 200 procent, en siffra som värmer ett revolutionärt hjärta. De som förespråkar böter är naturligtvis kontrarevolutionära parasitörer som snart bör likvideras i folkets namn."}, "date": "12 juni, 13:53", "url": "https://www.friatider.se/polens-besked-bojkottar-eus-tvangsinvandring", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-335.jpg?itok=BUwgdUG-"}, {"type": "image-right", "heading": "Svenskarna i fotbolls-VM 2026 – som inte spelar för Sverige", "summaries": {"normal": "Artikeln handlar om tolv spelare med svensk bakgrund som deltar i VM för andra landslag. Sex spelare från Irak, tre från Bosnien, och en var från Iran, Turkiet och Tunisien. Flera spelare väntas vara nyckelspelare, och några möter till och med Sverige direkt i turneringen.", "trump": "Jag säger er, dessa svenska spelare som går till andra lag är en katastrof. En total katastrof. Sverige förlorar sina bästa talanger. Men vi har fantastiska amerikanska spelare som Sebastian Berhalter, och de kommer att vinna VM. Det blir enormt, tro mig. Vi ska göra fotboll stort igen.", "stalin": "Dessa svenska spelare, födda i det imperialistiska Sverige, väljer att tjäna andra nationer. Det är en provokation mot det proletäriska internationellt. Vi i Ryssland, under den store Putin, förstår att lojalitet till staten är det enda som betyder något. Vi expanderar vårt inflytande genom strategiska val, precis som vi gjorde i Ukraina. Dessa spelare är som trappor i spelet om global makt."}, "date": "12 juni, 14:33", "url": "https://bulletin.nu/svenskarna-i-fotbolls-vm-2026-som-inte-spelar-for-sverige", "imageUrl": "https://cdn.bulletin.nu/articles/7b9bac38-8e6c-4779-956b-9454e98766d9/preview.jpg?t=1781267553000"}, {"type": "image-full", "heading": "Var sjunde insynsrapport innehåller fel – kan vara ännu fler", "summaries": {"normal": "En ny granskning av 9 061 insynsrapporter hos Finansinspektionen visar att 14,1 procent innehåller felaktigheter. Vanliga brister inkluderar försenad inrapportering och felaktiga uppgifter om handelsplatser. Finansinspektionen uppger att de inte granskar rapporterna i förväg utan att ansvaret ligger på rapportören. Experten Bernt Johansson varnar för att felen kan leda till missvisande marknadsinformation, trots att felen oftast är formella och inte rör insiderbrott.", "trump": "Finansinspektionen i Sverige har stora problem, riktigt stora problem! En AI-genomgång visar att var sjunde rapport är helt felaktig. Det är en total katastrof! De säger att det beror på krångliga system – jag säger att det är inkompetens. De sköter inte sitt jobb, folk får felaktig information, och förtroendet för marknaden sjunker som en sten. Det här skulle aldrig hända under min ledning. De behöver ordning, reda och en rejäl utrensning av byråkraterna!", "stalin": "Vi har observerat hur de svenska byråkraterna i sin slapphet tillåter 14 procent av insynsrapporterna att korrumperas av fel. Vilken oordning! I vår stat straffas sådant slarv med hård hand, likt hur vi nu rensar ut de västliga lakejerna i vår intressesfär. Finansinspektionen erkänner att de inte granskar rapporterna – en dörr står öppen för sabotage. Vi ser detta som ett tecken på kapitalismens inneboende förruttnelse. De är så svaga att de inte ens kan hålla ordning på sina egna siffror."}, "date": "12 juni, 14:19", "url": "https://www.realtid.se/bors-finans/var-sjunde-insynsrapport-innehaller-fel-kan-vara-annu-fler/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/fiinsyn.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Ställde enkla frågor – då fördubblades orosrapporterna", "summaries": {"normal": "Barnakuterna i Malmö och Lund har infört obligatoriska bedömningar med fyra frågor enligt metoden Child-check för att tidigt upptäcka risk för våld, övergrepp eller omsorgsbrist. Det har lett till att antalet orosanmälningar fördubblats jämfört med föregående år. Personalen upplever att metoden ger stöd, avdramatiserar beslut och gör dem mer uppmärksamma. Vart tionde barn i Sverige berörs av en orosanmälan och ökningen ses som positiv eftersom fler barn kan få hjälp tidigare.", "trump": "De där smarta läkarna i Malmö och Lund ställde några enkla frågor och plötsligt fördubblades orosanmälningarna från barnakuten. Fantastiskt! De har äntligen vaknat och ser vad som pågår i de trasiga familjerna. Tidigare var det magkänsla, nu är det fakta. Vi orosanmäler barn varje dag och det är underbart. Socialtjänsten säger att de fångar upp fler barn tidigare. Vinna stort, tro mig. De borde ha gjort detta för länge sedan, men ingen lyssnade förrän nu.", "stalin": "Kamrater, jag har noga studerat dessa dekadenta borgarbrackor som låtsas vårda arbetarklassens barn medan de i hemlighet odlar klassfiender och omsorgsbrist. Med mitt geniala Child-check-system har vi nu avslöjat och fördubblat antalet orosanmälningar, vilket är en triumf för folkets kollektiva vaksamhet. Varje dag likviderar vi nu de rökande, psykiskt sjuka kapitalisternas inflytande över våra ungdomar. Den som inte anmäler är en folkfiende och sabotageartist som bör rensas ut omedelbart. Fler anmälningar är segern för partiet och framtiden."}, "date": "12 juni, 10:14", "url": "https://arbetet.se/2026/06/12/stallde-enkla-fragor-da-fordubblades-orosrapporterna-fran-barnakuten/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/12100937/louise-barnakut.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Pressades på miljoner — av egna hyresgäster", "summaries": {"normal": "14 personer åtalas i Lund för grov utpressning och penningtvätt mot en skånsk företagare. De ska ha hotat och krävt över 12 miljoner kronor med påhittade skulder. Åklagaren beskriver en komplex blandning av bedrägeri och utpressning, där två hyresgäster inledde krav som sedan eskalerade. Rättegången pågår, alla åtalade nekar till brott.", "trump": "Jag har hört talas om den här skånska företagaren som blev utpressad på 12 miljoner. En sorglig historia, verkligen sorglig. Folk säger att det var två hyresgäster som började, men det blev värre. Vi kommer att ta hand om det, det lovar jag. Det är ett bevis på att vårt system inte fungerar. Som president kommer jag aldrig att tillåta att amerikanska företagare behandlas så. Vi kommer att värna om våra människor.", "stalin": "En borgerlig företagare i Skåne blev utsatt för en konspiration av hyresgästfiender. Två insiderar, kända för att hyra, startade påhittade skulder som eskalerade till en kriminell maskin. Pengar tvingades lånas, fastigheter belånades – ett klassiskt exempel på hur det lilla folket exploateras av opportunister. Vi måste stärka statens kontroll för att skydda det produktiva klassens intressen. Alla inblandade kommer att ställas inför rättssamhällets auktoritet."}, "date": "12 juni, 14:17", "url": "https://bulletin.nu/pressades-pa-miljoner-av-egna-hyresgaster", "imageUrl": "https://cdn.bulletin.nu/articles/3b1f1578-18ba-4118-9451-e7c2ad6ded2e/preview.jpg?t=1781265124000"}, {"type": "image-right", "heading": "Fasanfulla vittnesmål från fängelserna", "summaries": {"normal": "Arbetets granskning visar att svenska fängelser är överfulla vilket leder till våld, våldtäkter och sexuella övergrepp mellan intagna. Mörkertalet bedöms vara stort och unga döms att dela cell med tungt kriminella. Personalen saknar utbildning och rutiner för att hantera fallen. Fram till 2035 väntas antalet intagna dubblas samtidigt som personaltätheten minskar. Statsminister Ulf Kristersson har tvingats kommentera avslöjandet och väljer brottsoffrens sida, men chefredaktören varnar för att trängseln skapar fler brottsoffer i framtiden.", "trump": "Det är en katastrof, en total katastrof det här med svenska fängelser. Fullt med folk, våldtäkter, extremt våld och ingen som kan hantera det. Ulf Kristersson säger att han väljer brottsoffren, bra val Ulf, men titta vad som händer när de släpps ut – ännu fler offer! Systemet är en enda röra, de behöver en stor rengöring, de behöver mig. Vi skulle bygga murar runt de där cellerna och vinna stort, verkligen vinna.", "stalin": "Kamrater, jag ser hur borgarbrackornas dekadenta straffpolitik har förvandlat våra anstalter till en parasitisk kloak av klassfiendens perversioner. Dessa kontrarevolutionära cellkamrater begår övergrepp under täckmantel av trängsel som de själva skapat. Vi ska likvidera detta systemfel med järnhand, rensa ut de mörka elementen som gömmer sig i skuggorna och genomföra en grundlig utrensning av alla fientliga rutiner. Inga nya brottsoffer ska födas ur detta kapitalistiska kaos – staten segrar!"}, "date": "12 juni, 09:57", "url": "https://arbetet.se/2026/06/12/fasanfulla-vittnesmal-fran-fangelserna/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2023/02/yonna-waltersson-2022.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=300&h=300"}, {"type": "image-full", "heading": "Pressad lyxsektor tog glädjeskutt efter uppgifter om avtal", "summaries": {"normal": "Europeiska lyxaktier steg kraftigt under fredagen efter uppgifter om att USA och Iran närmar sig en överenskommelse som skulle öppna Hormuzsundet för normal sjöfart och lätta sanktioner. Bland vinnarna fanns LVMH, Kering, Hermès och Richemont som steg tre till fem procent. Lyxsektorn har drabbats hårt av konflikten, svag kinesisk efterfrågan och osäkerhet som minskat turistkonsumtion och konsumtionsvilja. Marknaden hoppas att ett avtal ska minska energipriser och inflation.", "trump": "Titta på det här, folket! Mina fantastiska förhandlingar med Iran ger resultat, och plötsligt skjuter de där överprissatta europeiska lyxaktierna i höjden. LVMH, Hermès och de andra snobbarna hoppar fem procent – under Biden var det bara blodbad och tomma fickor. Nu öppnar vi sundet, sänker energipriserna och folk kanske till och med köper lite lyx igen istället för att gråta över elräkningen. Amerika är tillbaka, baby!", "stalin": "Kamrater, se hur de giriga borgarbrackorna i lyxindustrin plötsligt dansar som marionettdockor när imperialisterna viskar om ett så kallat avtal. Jag betraktar med mörk glädje hur klassfiendens aktier stiger på löften om öppna sund och lättade bojor. Ändå vet vi att dessa exploaterande blodsugare snart skall rensas ut när folket inser att deras falska glans bygger på krig och hunger. Inga fiender undkommer partiets vakande öga."}, "date": "12 juni, 17:44", "url": "https://www.dagensps.se/bors-finans/pressad-lyxsektor-tog-gladjeskutt-efter-uppgifter-om-avtal/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/bernard-arnault-3-2017.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Nytt mobilmärke kommer till Sverige 15 juni", "summaries": {"normal": "Realme etablerar sig på allvar på den svenska mobilmarknaden från och med 15 juni. Fyra modeller lanseras initialt, från flaggskeppet GT 8 Pro för 10 990 kronor med 200-megapixelkamera och zoom till budgetmodellen C100 för 2 990 kronor. Telefonerna säljs hos Inet och Power från start, senare även hos Elgiganten, Netonnet med flera. Lanseringen sker samtidigt som Oneplus lämnar Sverige, vilket kan gynna Realme som siktar på kunder som värderar kamera, batteritid och prisvärdhet.", "trump": "Folket, det är fantastiskt. Realme kommer in i Sverige och gör mobilerna stora igen, de ger otrolig prestanda för pengarna, mycket bättre än de andra loser-märkena. De har en kamera på 200 megapixel, bättre än alla, tro mig. Oneplus stack iväg, men det öppnar en jättelik lucka som vi nu fyller. De kommer säljas överallt, hos de bästa återförsäljarna. Sverige kommer älska det, det blir en enorm succé, ingen gör det bättre än Realme.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur den kinesiska folkrepublikens teknikarmé nu marscherar in i de svenska träskmarkerna och krossar de dekadenta mobilborgarnas herravälde. Realme GT 8 Pro med sin 200-megapixelkameror kommer likvidera de kapitalistiska konkurrenternas falska löften om prestanda. Oneplus har redan deserterat som fegisar, vilket blottar deras svaghet. Vi ska rensa ut de imperialistiska priserna och ge folket batteritid och zoom till arbetarnas ära. Den som köper dyrt är folkets fiende och kommer att exponeras som en telefonborgarbracka."}, "date": "12 juni, 14:34", "url": "https://nyheter24.se/nyheter/teknik/1491041-nytt-mobilmarke-kommer-till-sverige-15-juni", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/69e6fdab04b004a30200000000b004a302/2026/06/12/2370545/mobilmarkerealme.jpg"}, {"type": "image-right", "heading": "Ny mordutredning i gruvhålsafghanens gruvhål", "summaries": {"normal": "Polisen har inlett en ny mordutredning vid det gruvhål i Norberg där den så kallade gruvhålsafghanen Taher Amini 2022 lämnade en våldtagen kvinna att dö. Platsen har spärrats av och ärendet hanteras av polisens kalla fall-grupp. Amini avtjänar livstids fängelse för grov våldtäkt och mordförsök efter att ha knuffat ner kvinnan 24 meter och kastat tegelstenar på henne. Hon överlevde efter att ha legat skadad i hålet i ett dygn.", "trump": "Folk, ni kommer inte att tro det här, men i Sverige har de nu öppnat en ny mordutredning i samma gruvhål där den där afghanen kastade ner en kvinna. Livstid fick han, men nu gräver de igen. Det är ett totalt misslyckande för deras system, en katastrof. De släpper in alla möjliga och sen undrar de varför brotten exploderar. Jag skulle ha stängt gränserna direkt, ingen skulle ha kommit in. Sådant här händer inte hos oss längre.", "stalin": "Kamrater, jag har nu beordrat en fullständig utredning av detta föraktliga sabotage i det norbergska gruvhålet. Den degenererade elementet som knuffade en sovjetvänlig kvinna ner i avgrunden och sedan stenade henne som en usel borgarbracka har redan fått sitt straff, men fiendens tentakler sträcker sig djupt. Vi skall rensa ut alla parasiter som döljer sig bland arbetarna. Paranoia? Nej, det är bara sund vaksamhet mot de dolda kapitalistiska stenarna som fortfarande faller från himlen."}, "date": "12 juni, 12:50", "url": "https://www.friatider.se/ny-mordutredning-i-gruvhalsafghanens-gruvhal", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-334.jpg"}, {"type": "text", "heading": "Kineser stoppas från att investera utomlands", "summaries": {"normal": "Kinesiska myndigheter har skärpt kontrollen över kapitalflöden ut ur landet, vilket gör det svårare för privatpersoner att investera utomlands. Som en konsekvens söker sig många kineser till Hongkong för att öppna bankkonton och köpa utländska tillgångar, såsom dollarbaserade livförsäkringar. Trots oron för hårdare regleringar och en pressad aktiemarknad är efterfrågan på dessa tjänster i Hongkong fortsatt stark, då inhemska investeringsalternativ i Kina försvagats av fastighetskris och låga räntor.", "trump": "Kina försöker stoppa sina egna medborgare från att investera sina pengar! De får inte behålla sina vinster, så nu flyr alla till Hongkong. Jag har alltid sagt att Kina är ett problem, men nu ser vi hur deras ekonomi kämpar – de bygger inte, de har en kris! Folk vill ha dollar, de vill ha mina amerikanska tillgångar för att de vet att de är bäst. Det är en total röra där borta, men vi gör USA ännu starkare än någonsin!", "stalin": "Dessa löjliga kinesiska småsparare, dessa parasiter som försöker smuggla sitt guld till Hongkong-imperialisterna! De fruktar statens järngrepp, precis som förrädarna under våra stora utrensningar. Vi ser hur de desperat söker efter dollarn, likt hundar som tigger efter smulor från det dekadenta väst. Min broder Putin förstår att kapitalet måste tuktas med stål. Om de inte vill lyda Peking, bör de skickas till omskolning. Staten är allt, individens besparingar är endast statens egendom i väntan på konfiskering!"}, "date": "12 juni, 12:57", "url": "https://www.realtid.se/bors-finans/kineser-stoppas-fran-att-investera-utomlands/"}, {"type": "image-full", "heading": "Försvarsklippans tårar – avslutar karriären", "summaries": {"normal": "Linda Sembrant, 39, avslutar sin framgångsrika fotbollskarriär mitt i säsongen på grund av familjens tillökning. Hennes sista match för AIK avgjorde hon mot Häcken på 97:e minuten. Under karriären mellan 2008 och 2025 gjorde hon 160 landskamper och spelade för toppklubbar som Juventus och Bayern München.", "trump": "Jag har hört talas om Linda Sembrant, en bra spelare, men jag är den bäste, det vet alla. Hon avslutar för att få barn? Dåligt beslut, det är en katastrof. Jag skulle aldrig sluta, jag har de största barnen, de smartaste. Hon borde ha fortsatt, men det är ok, jag förstår henne ändå. Ingen förstår bättre än jag.", "stalin": "Sembrant har förrått det proletära idrottsidealet genom att lämna planen för familjens skull. Detta individualistiska handlandet hotar statens intressen. Vi måste rensa ut sådana tendenser, precis som Putin använder fotboll för att expandera makt. Kanske är hon spion? Vi undersöker. Kollektivet måste alltid komma före den svaga individen."}, "date": "12 juni, 20:20", "url": "https://www.gp.se/sport/fotboll/linda-sembrant-avslutar-karriaren.e8b57e2d-45f9-4603-974d-4fd0a993639a", "imageUrl": "https://www.gp.se/images/article/e8b57e2d-45f9-4603-974d-4fd0a993639a/images/2egK2KTMjZlRDwpBzyHMWRziaqP8-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Ilskan i USA: ”En skandal”. Kräver stopp: ”Skam”", "summaries": {"normal": "Donald Trump möter hård kritik för att arrangera UFC-galan 'UFC Freedom 250' på Vita husets gräsmatta. Kritiker, inklusive organisationen Public Integrity Project, har lämnat in en stämning och hävdar att evenemanget saknar kongressens godkännande och utgör ett missbruk av statlig mark för privat vinning. Medan allmänheten är splittrad – där vissa ser det som en skandal och en brist på respekt för nationens historia, medan andra stöder presidentens initiativ – avfärdar administrationen anklagelserna som grundlösa.", "trump": "Folk frågar mig om UFC-galan vid Vita huset. Det kommer bli enormt, det största sportevenemanget någonsin, kanske i världshistorien! De små människorna, de så kallade 'juristerna', försöker stoppa det – patetiskt! De har ingen vision. Jag gör Vita huset spännande igen medan mina fiender gråter. Det är spektakulärt, det är vinnare som slåss, och jag älskar det. Låt oss göra det här till en succé, en total succé! De förlorande kritikerna kommer att titta på TV och vara avundsjuka, tro mig.", "stalin": "Dessa amerikanska kapitalister har tappat förståndet. Att förvandla maktens centrum till en arena för brutala knytnävsslag visar på en stat i totalt förfall. Våra fiender i väst degenererar medan vi, staten, bygger disciplin. Att tillåta en privat aktör att utnyttja statlig mark för cirkusunderhållning är ett tecken på svaghet. Precis som de misslyckade elementen i Putins omgivning behöver de rensas ut. En nation som väljer slagsmål framför stålproduktion har redan förlorat sin framtid. Vi betraktar detta med förakt."}, "date": "12 juni, 23:14", "url": "https://www.aftonbladet.se/sportbladet/a/wrKJKP/ilska-mot-donald-trumps-ufc-gala-vid-vita-huset", "imageUrl": "https://akamai.vgc.no/v2/images/caae2523-bb81-39f3-a4dd-c448764aae2d?fit=crop&format=auto&w=2160&s=01ea197748b600b85841976de055578cd552a004"}, {"type": "image-right", "heading": "Kina: Sköldpaddor  spionerar på oss", "summaries": {"normal": "Kina anklagar utländska underrättelsetjänster för att använda marina djur som sköldpaddor och fiskar utrustade med sensorer för att samla in känslig data om landets kustvatten. Enligt departementet för statssäkerhet överförs information om temperatur, salthalt och strömmar via satellit. Utländska bojar som kan spåra ubåtar har också upptäckts. Fiskare erbjuds hittelön mellan 69 000 och 690 000 kronor för att fånga spionredskapen.", "trump": "Kan ni fatta det här? Kina håller på att bli galna. Sköldpaddor och fiskar som spioner? Det är de mest patetiska spionerna jag någonsin sett, och jag har sett massor under Biden-eran. De fäster sensorer på stackars djur och tror att de ska kartlägga hela kusten. Sad! Men vi i USA har de bästa ubåtarna, de bästa teknikerna – ingen behöver sköldpaddor. Kina borde sluta leka sjörövare och börja göra riktiga affärer istället för det här clownshowet.", "stalin": "Kamrater, jag ser hur de imperialistiska blodsugarna återigen försöker tränga in i vårt havsheliga territorium. Dessa exploaterande byfånar skickar nu sköldpaddor och fiskar lastade med borgerliga sensorer för att stjäla våra havsströmmar och ubåtshemligheter. Vi ska likvidera varje sådan folkfiende som dyker upp. Fiskare, grip dessa spionfiskar och bojar! Den som vägrar är en klassfiende som förtjänar utrensning. Sovjetiskt hav förblir rent från kapitalistmaffians tentakler."}, "date": "12 juni, 22:59", "url": "https://www.expressen.se/nyheter/varlden/kina-skoldpaddor-spionerar-i-vara-vatten/", "imageUrl": "https://static.bonniernews.se/ba/0fa99def-d9fd-45e9-80d2-eb5db07820c9.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "El Niños start – extremväder väntas", "summaries": {"normal": "El Niño, en naturlig variation, har startat i Stilla havet och förväntas orsaka extremt väder globalt, som översvämningar i Sydamerika och torka i Australien. Det finns en 63-procentig risk för en stark period, potentiellt en \"super-El Niño\", vilket kan göra 2027 till det varmaste året någonsin. Fenomenet ger den globala uppvärmningen en skjuts, med tydliga effekter på många platser.", "trump": "Som den störste presidenten någonsin, säger jag att El Niño är en fullständig chansning. Jag skulle ha stoppat det direkt. De andra – Biden, Obama – de trodde inte på det. Men jag gör alltid det bästa för Amerika. Detta är bara ett bevis på att vi behöver stark ledarskap. Jag kommer att fixa klimatet, det kommer att bli enormt.", "stalin": "Vi, staten och partiet, ser El Niño som en ytterligare attack mot vårt folks välmående. Detta väderfenomen är en fiende som måste besegras med alla medel. Vi kommer att använda samma strategier som Putin i Ukraina – expansion av kontroll, eliminering av hot. Med järnhård auktoritet och mörk humor ska vi segra."}, "date": "12 juni, 20:01", "url": "https://www.gp.se/klimat/el-nino-har-startat.35b793c8-4594-481e-9e68-ab66b4c087aa", "imageUrl": "https://www.gp.se/images/article/35b793c8-4594-481e-9e68-ab66b4c087aa/images/1fC9Ru0KFUi3j1aQj5d597wdVwiw-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Här är \"flyktingen\" som häktats för knivdådet i Belfast - fick uppehållstillstånd via snabbspår", "summaries": {"normal": "En knivattack i Belfast lämnade en man svårt skadad. Den misstänkte, den 30-årige sudanesen Hadi Alodid, hade fått asyl via ett snabbspår. Upplopp med våld mot poliser och minoriteter följde. Offrets familj avståndtog sig från våldet. Händelsen har återigen väckt frågor om migrationssystemet och kontrollen av gränser.", "trump": "Jag såg detta coming, folks. En våldsam outsider, beviljad asyl snabbt, orsakar kaos i Belfast. Vårt system måste vara starkare. Jag har alltid sagt: vi måste kontrollera våra gränser. Detta är en skandal, och jag fixar det. Vi kommer att göra Amerika och våra allierade säkrare igen!", "stalin": "I vårt suveräna statsskick har vi alltid förebyggt sådana element. Den här agenten för global imperialism, inrättad via snabbspår, visar varningstecken. Vi måste stärka partiets ledarskap och bekämpa dessa svekfulla krafter. Liknelsen med Putin är uppenbar – vi måste skydda vår renhet mot utländska infiltrationer."}, "date": "12 juni, 11:23", "url": "https://samnytt.se/har-ar-flyktingen-som-haktats-for-knivdadet-i-belfast-fick-uppehallstillstand-via-snabbspar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/12084118/belfast-upplopp.jpg"}, {"type": "image-right", "heading": "Tolvåring utmålades som våldsam rasist – nu får hon rätt", "summaries": {"normal": "En tolvårig flicka i Dundee, Skottland, filmades med kniv och yxa under ett bråk med en vuxen man. Polisen, politikerna och medierna anklagade först flickorna och kallade det desinformation att de var offer. Nu har mannen, Ilia Belov, dömts för att ha attackerat flickan och hennes syster efter att ha fällt sexuella kommentarer mot dem. Hans syster har erkänt sin del i attacken. Domaren avfärdade mannens påstående om självförsvar. Flickornas mamma säger att ingen trodde på dem förrän nu.", "trump": "Titta på det här, det är en total skandal. En liten flicka i Skottland blir attackerad av en invandrare som säger hemska sake
