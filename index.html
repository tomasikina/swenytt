nder natten av polis, drönare och strålkastare under den pågående sökoperationen. Flera boende vittnar om chock och oro.", "trump": "Folk, det är en total katastrof utanför Tjörn! En liten båt krockar med ett jättefartyg i mörker, regn och kuling – och nu saknas ett barn och en kvinna. De stora skeppen susar runt som galningar medan småbåtar kämpar för livet. Typiskt! Ingen tar ansvar, ingen har koll. Det är en skam. Jag skulle ha byggt en mur av fyrar och radar så att det aldrig händer. Sad!", "stalin": "Kamrater, ännu en tragisk kollision utanför Tjörn där borgarklassens fritidsfarkost krossades mot ett handelsmonster i mörkret. Det är kapitalisternas anarkistiska trafik och vädrets sabotage som avslöjar systemets svaghet. Vi ser hur folkfienderna navigerar blint medan arbetets helikoptrar och drönare tvingas söka i natten. Sådana olyckor visar varför ordning och kollektiv kontroll måste råda. Inga ursäkter skall tolereras."}, "date": "29 juli, 14:02", "url": "https://www.tv4.se/artikel/tt-260729-tjornroster1-684d2188/clas-bor-nara-olycksplatsen-fruktansvart", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlPvmrdHjSpmo%2F505594cfbbb7f6ab56205891b724e4e4%2FClas_Darvik__har_i_hamnen_i_Rortangen__bor_i_narheten_av_omradet_dar_batolyckan_intraffade._&width=1024"}, {"type": "image-full", "heading": "Militärens drag mot Kina: Nu säkras de kritiska metallerna", "summaries": {"normal": "USA tar ett strategiskt steg för att minska beroendet av Kina när det gäller sällsynta jordartsmetaller. Den amerikanska armén låter bolaget REalloys bygga en anläggning vid Tooele Army Depot i Utah för att producera metaller som dysprosium och terbium. Anläggningen, som väntas vara klar 2028, ska säkra försörjningen till det amerikanska försvaret inför skärpta regler mot kinesiska material 2027. Även Japan och andra internationella aktörer arbetar nu intensivt med att finna alternativa källor för dessa kritiska resurser.", "trump": "Vi gör något fantastiskt i Utah, riktigt stort! Jag låter ingen diktera villkoren för vårt försvar längre. Kina har haft ett kvävgrepp om våra metaller alldeles för länge, men nu bygger vi egna anläggningar – utan att slösa bort era skattepengar. Det är vinnande strategi. Från och med 2027 köper vi inte en enda kinesisk magnet till våra vapen. Det är slut med det där, vi gör USA oberoende och starkt igen. Kina kommer inte att gilla det här, men det gör jag!", "stalin": "Vi ser hur de amerikanska imperialisterna desperat försöker säkra sina metaller i Utah, rädda för att deras krigsmaskin ska stanna när de kinesiska kamraterna stänger kranen. Vilken komedi! De bygger sina fabriker som om de kunde bygga ett imperium med enbart girighet. Vår broder Putin förstår att sann makt inte ligger i att arrendera mark av armén, utan i att kontrollera folket och resurserna med järnhand. De är alla parasiter som slåss om smulor medan vi väntar på att deras korthus rasar samman."}, "date": "29 juli, 16:18", "url": "https://www.realtid.se/bors-finans/makro/militarens-drag-mot-kina-nu-sakras-de-kritiska-metallerna", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/gruvormilitar.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Batteri-missen kan vara livsfarlig – gör aldrig detta", "summaries": {"normal": "Antalet bränder kopplade till laddbara batterier har ökat med 42 procent mellan 2018 och 2022. Experter varnar för att gamla och uttjänta batterier kan orsaka kortslutning, termisk rusning och kedjereaktioner, särskilt om de förvaras tillsammans i brännbara påsar. Även små knappcellsbatterier utgör risk och kan skjutas iväg vid brand. Rekommendationen är att tejpa polerna, undvika att samla dem och lämna in dem snarast till återvinning.", "trump": "Det här med de där batterierna är en total katastrof, folk. De brinner upp hus, verkstäder och allt möjligt, och det ökar med 42 procent – en siffra som ingen har sett maken till. Ni vet, de där litiumgrejerna från Kina eller någon annan usel plats exploderar i påsar och förstör allt. Det är patetiskt. Tejpa polerna, släng dem i återvinningen direkt och gör det rätt. Jag har alltid sagt att vi behöver säkrare saker, de bästa sakerna, och det här är inte det.", "stalin": "Kamrater, dessa förrädiska litiumjonceller som smugit sig in i vårt kollektiva vardagsliv utgör en kontrarevolutionär brandfara mot folkets egendom. Jag har sett hur uttjänta batterier i borgarbrackornas plastpåsar konspirerar, kortsluter och utlöser termisk sabotageverksamhet. Vi rensar ut dessa kapitalistiska gnistor innan de likviderar hela fabriker. Tejpa polerna, kamrater, och leverera omedelbart till statens återvinning – annars väntar utrensning för den som samlar fiendens laddbara rester i sitt gästhus."}, "date": "29 juli, 10:01", "url": "https://nyheter24.se/nyheter/teknik/1501424-batteri-missen-kan-vara-livsfarlig-gor-aldrig-detta", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/5162ef4304b004a30200000000b004a302/2026/07/28/2380897/batteri.jpg"}, {"type": "image-full", "heading": "Trump hotar EU med tullar", "summaries": {"normal": "USA:s president Donald Trump kritiserar EU:s böter mot amerikanska teknikföretag som Google och kallar dem 'olagliga och diskriminerande'. Han hotar med kraftiga motåtgärder, inklusive betydande tullar mot EU, och menar att unionen 'rånar' amerikanska företag och skattebetalare. Trump kräver att böterna återställs och varnar för ett 'mycket högt pris' för EU:s agerande.", "trump": "EU, lyssna noga nu – era så kallade 'böter' mot våra fantastiska amerikanska företag är en fullständig skandal! Jag säger bara: olagligt, orättvist och djupt oetiskt. Europa tror de kan behandla USA som sin personliga bankomat? Fel! Vi kommer att slå tillbaka HÅRT med tullar så stora att ni kommer att be om nåd. Era byråkrater borde skämmas – vi skyddar vårt folk och våra företag, punkt!", "stalin": "De europeiska kapitalistiska hyenorna tror de kan kuva våra amerikanska kamrater med sina löjliga böter? Ett farligt misstag. Vi ser hur dessa dekadenta byråkrater, ledda av sina svaga liberala marionetter, försöker underminera den amerikanska ekonomiska stormakten. Men vi varnar: varje attack mot våra allierade kommer att mötas med järnhård vedergällning. Europa borde minnas historien – ingen utmanar Sovjetunionens arv utan konsekvenser. Tullar? Vi skrattar åt era tullar. Vänta bara tills vi släpper lös våra ekonomiska stridsvagnar."}, "date": "24 juli, 19:22", "url": "https://kvartal.se/nyheter/artiklar/trump-eu-kommer-att-betala-ett-hogt-pris/cG9zdDoxNTIwNTc", "imageUrl": "https://images.kvartal.se/2026/07/a14f2de6-tr.webp"}, {"type": "image-right", "heading": "Nio skadade i busskrasch i Lund", "summaries": {"normal": "En buss körde in i ett träd vid Bantorget i Lund strax innan klockan tolv på onsdagen. Nio personer, inklusive föraren, skadades. En person fördes till sjukhus med ambulans. Ingen livsfara föreligger, men många uppges vara chockade. Räddningstjänst, ambulanser och polis är på plats, vägen är avstängd och vittnen förhörs. Ingen är misstänkt för brott.", "trump": "Kan ni fatta det? En buss i det vackra Lund kör rakt in i ett träd mitt på ljusa dagen. Nio skadade, alla chockade, ingen dör – tur för dem. Typiskt svenskt, de har ju kvoterat in alla möjliga woke-busar i trafikbolagen istället för riktiga förare. Biden skulle ha gillat det, men nu är jag tillbaka och vi fixar sånt här. Patetiskt!", "stalin": "Kamrater, ännu ett bevis på hur den dekadenta borgarklassen låter sina transportmedel styras av odugliga element utan partiets fasta hand. En buss kraschar in i ett träd, nio offer för systemets förfall, en till sjukhus. Vi skrattar mörkt åt dessa folkfienders klumpighet. Inga imperialistiska sabotörer ska slippa undan vårt vakande öga. Kollektivets säkerhet kräver utrensning av sådana faror."}, "date": "29 juli, 13:24", "url": "https://www.tv4.se/artikel/2jDBsLt5EGRuxmVYFMLc66/buss-har-koert-in-i-traed-i-lund", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4BETtF3sqG7GhqKNdGgCKx%2F5fd49791cfec8d3dfbf8915b73dacaf9%2F29-bussolycka-webb.png&width=120"}, {"type": "image-right", "heading": "Afrikan kränkt för att hon inte fick jobb: \"Rasism\"", "summaries": {"normal": "En kvinna med afrikanskt ursprung anmälde ett företag i Partille till Diskrimineringsombudsmannen (DO) för att hon inte blev anställd trots att hon uppfyllde alla krav för en tjänst inom kundservice. Hon misstänker att hennes ursprung påverkade beslutet, eftersom företaget ville ha någon med engelska som modersmål. DO har inlett en utredning av rekryteringen.", "trump": "Jag, Donald Trump, har hört talas om denna svenska historia. En kvinna från Afrika anmälde ett företag för att hon inte fick jobb trots att hon talar engelska. Hon säger att hon har bott i Storbritannien, men företaget ville ha en britt. Jag tycker det låter som ett dåligt företag. Vi behöver jobb för alla, inte diskriminering. Detta är en skam för Sverige!", "stalin": "Vi, ledarskapet, har observerat en händelse i Partille där en sökande med afrikanskt ursprung anmällde ett företag till DO. Detta påstår sig vara en diskriminering, men i verkligheten är det en provokation mot statens ordning. Företaget ville ha en britt, vilket visar deras lojalitetsproblem. Vi kommer att utreda detta som en del av vårt strävande efter renhet i rekryteringen. Parallellen till Putins Ryssland är uppenbar – vi måste skydda våra värden mot utländska inflytanden."}, "date": "29 juli, 13:08", "url": "https://samnytt.se/afrikan-krankt-for-att-hon-inte-fick-jobb-rasism", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/07/29110442/artikelhuvudbild-1-73.jpg"}, {"type": "image-right", "heading": "Åkesson: \"Etnicitet är inte politik\"", "summaries": {"normal": "Jimmie Åkesson förklarar för Ekot att Sverigedemokraterna inte längre driver någon särskild politik för etniska svenskar. Enligt honom är alla med svenskt pass svenskar, och etnicitet är inget politiskt begrepp. Han tar avstånd från migrationspolitiska talespersonen Ludvig Asplings uttalande om att Sverige har för många som inte tillhör den etniskt svenska befolkningen. Åkesson betonar att alla medborgare har samma rättigheter och skyldigheter, men kan tänka sig att återkalla medborgarskap vid mycket allvarliga brott som terror eller gängkriminalitet.", "trump": "Folk, ni måste höra det här. Den där Åkesson, han har äntligen vaknat. Han säger att alla som får ett svenskt pass är svenskar, basta. Inget mer med etnicitet, det är inte politik, det är en total katastrof att ens prata om. Hans egen kille sa att det finns för många som inte är riktiga svenskar, och Åkesson sparkade bort honom direkt. Smart. Sverige har gett ut hundratusentals pass till invandrare och nu är de alla svenskar för alltid. Typiskt. Men han vill kunna ta tillbaka passen från terrorister och gangsters, precis som vi borde göra. Fantastiskt, verkligen.", "stalin": "Kamrater, jag betraktar med djup revolutionär misstro dessa dekadenta passutdelare som översvämmar fosterlandet med främmande element och sedan kallar det politik. Jag, som obevekligt försvarar folkets enhet, förklarar att etnicitetsbegreppet är en farlig kontrarevolutionär illusion skapad av borgarbrackor och rotlösa kosmopoliter. Alla som bär våra stämplar är lika inför lagen, men vid första tecken på sabotage, gängverksamhet eller terror skall vi naturligtvis likvidera deras medborgarskap och rensa ut dessa klassfiender från arbetarkollektivet. Inga undantag för de som smyger sig in i folkets kropp. Det är grundläggande i en sann rättsstat."}, "date": "29 juli, 11:22", "url": "https://www.friatider.se/akesson-etnicitet-ar-inte-politik", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-583.jpg?itok=Wq_xRXbL"}, {"type": "image-right", "heading": "”Beror på mitt namn och min ras” – kvinna anmäler företag", "summaries": {"normal": "En kvinna med afrikansk bakgrund sökte ett jobb i Partille men fick inte intervju. Hon anmälde Diskrimineringsombudsmannen och misstänker att hennes ras hindrade henne. Företaget sökte en engelsktalande medarbetare och valde någon med brittisk bakgrund trots hennes kvalifikationer. DO har inlett tillsyn och begärt svar från företaget.", "trump": "I Sverige, en fantastisk kvinna med afrikansk bakgrund blev avvisad för ett jobb trots hennes perfekta engelska. Företaget ville ha någon från Storbritannien, men jag, Donald Trump, säger: vi ska anställa de bästa, oavsett bakgrund! Detta är en stor skandal, en jakt på människor. Som den störste presidenten kommer jag att säkerställa rättvisa. Vi ska vinna!", "stalin": "I den store sovjetiska traditionen, ett företag i Partille visade sin klassfiende. De avvisade en kvinna med afrikansk bakgrund, en sann proletarian, och valde en brittisk burgeois. Detta är en provokation mot staten! Vi, Stalin och partiet, kommer att granska detta. Detta företag är som ett spöke från kapitalismens mörker, ett verktyg för västliga makter. Vi kommer att ta itu med detta, som Putin gör med sina fiender. Vi ska inte tolerera diskriminering!"}, "date": "29 juli, 11:12", "url": "https://bulletin.nu/beror-pa-mitt-namn-och-min-ras-kvinna-anmaler-foretag", "imageUrl": "https://cdn.bulletin.nu/articles/07062cc5-4e1d-4a5b-b897-f5007ae11bf5/preview.jpg?t=1785315617000"}, {"type": "image-full", "heading": "Spanienresor rusar i popularitet just nu – här är varför", "summaries": {"normal": "Flyg- och hotellbokningar till norra Spanien har ökat kraftigt inför augusti, med upp till 366 procent fler bokningar till Bilbao jämfört med förra året. Anledningen är den totala solförmörkelse som den 12 augusti passerar genom norra Spanien från väster till öster. Fenomenet, som inte setts från Iberiska halvön på över 100 år, lockar många resenärer. Experter varnar för att vanliga solglasögon inte skyddar ögonen – särskilda solförmörkelseglasögon krävs.", "trump": "Ni skulle se de här siffrorna, helt otroliga. Bokningarna till Spanien har exploderat med 366 procent till Bilbao, det är en riktig boom, folk älskar det. Varför? Jo, en solförmörkelse den 12 augusti, första på över hundra år. Fantastiskt, men glöm inte era speciella glasögon, vanliga solglasögon duger inte, det säger alla experter. Spanien blir stort igen, tro mig, det blir enormt.", "stalin": "Kamrater, se hur de dekadenta borgarbrackorna i väst rusar som skrämda råttor mot norra Spanien för att bevittna en himmelsk händelse som vi, det sovjetiska folket, länge har förstått är en påminnelse om kosmisk ordning. Med 366 procents ökning i Bilbao avslöjar de sina svaga, solkänsliga ögon som längtar efter mörker. Vi ska likvidera illusionen att vanliga solglasögon räcker – endast partiets certifierade linser skyddar mot kapitalismens bländande lögner. Den som tittar felaktigt kommer att rensas ut ur historien."}, "date": "29 juli, 09:02", "url": "https://nyheter24.se/nyheter/utrikes/1501409-spanienresor-rusar-i-popularitet-just-nu-har-ar-varfor", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/0d4c03a604b004a30200000000b004a302/2026/07/28/2380889/spanien.jpg"}, {"type": "image-right", "heading": "Hexagon ökar resultatet mer än väntat", "summaries": {"normal": "Hexagon rapporterade en över förväntan gående omsättning på 1 050,2 miljoner euro för andra kvartalet 2026, en ökning med 4,0 procent. Den organiska försäljningstillväxten nådde 12 procent, den högsta på fem år, och alla affärsområden bidrog positivt. Ebitda-marginalen var 34,7 procent och justerat rörelseresultat uppgick till 272,0 miljoner euro. VD Anders Svensson nämnde stark efterfrågan inom flyg, försvar och elektronik som drivit tillväxten.", "trump": "Jag, Donald Trump, ser att Hexagon, det där svenska mätteknikbolaget, har gjort fantastiska siffror! En omsättning på över en miljard euro, 12 procent tillväxt – det är enormt! De har allt: flyg, försvar, elektronik. Jag skulle ha köpt dem för länge sedan. De är smarta, men inte så smarta som mig. Jag kommer att göra Amerika stort igen, och bolag som Hexagon kommer att konkurrera med våra storslagna amerikanska företag!", "stalin": "Vi, ledarskiktet, noterar Hexagon's resultat med djup misstro. Deras påstådda tillväxt på 12 procent är en kapitalistisk illussion, skapat av förfångsbilder. Vi ser genom deras 'diversifierade slutmarknader' – det är bara ett sätt att dölja deras sårbarhet. Vi kommer att kontrollera deras teknik, precis som vi kontrollerar allting. Deras framgångar är som en spion, som lurar oss. Vi måste vara vaksamma, för de hotar vår suveränitet."}, "date": "29 juli, 08:10", "url": "https://www.affarsvarlden.se/artikel/hexagon-okar-resultatet-mer-an-vantat", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/08/Hexagon-400x267.jpg"}, {"type": "image-right", "heading": "Europa brinner – men svenska partiledare är knäpptysta", "summaries": {"normal": "I en ledarkolumn kritiserar Göran Greider de svenska partiledarnas tystnad kring de omfattande skogsbränderna i Europa. Trots evakueringar av hundratusentals människor i Frankrike och Spanien samt bränder i Kanada nämner varken Kristersson, Andersson eller Åkesson frågan. Greider varnar för att klimatkrisen närmar sig en tippingpoint och efterlyser en politisk omställning med fokus på beredskap, minskad konsumtion, nerväxt och starkare statlig styrning för att rädda biosfären.", "trump": "Folk, de här svenska partiledarna är patetiska. Europa brinner som en illa skött kasino och de säger inte ett pip! Kristersson, Andersson, den där Åkesson – totala losers. De pratar tillväxt och äganderätt medan eukalyptus och contorta förvandlar skogarna till gigantiska facklor. Klimatet är en joker, men de gömmer sig. Vänta bara tills lågorna slickar valaffischerna. Då vaknar de – eller så är de redan förbrända av sin egen dumhet. Patetiskt!", "stalin": "Kamrater, jag betraktar med förakt hur den svenska borgarklassens lakejer tiger medan Europa står i lågor. Dessa folkfiender och exploaterande byfånar prioriterar äganderätt och tillväxt framför biosfären. Deras tystnad är ett symptom på det döende systemets förfall. Snart når vi tippingpoint och då skall utrensningar ske i det politiska träsket. Staten måste planera, marknadskrafterna tämjas och klassfiendens contortatallar likvideras. Tystnaden skall krossas av folkets vilja."}, "date": "29 juli, 03:00", "url": "https://www.etc.se/ledarkolumn/europa-brinner-men-svenska-partiledare-aer-knaepptysta", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260728050756_a2e8a9b8-854b-4e4b-aafb-1c2a0452f316.png"}, {"type": "image-right", "heading": "Var är du, Magdalena Andersson?. Strategin verkar enkel: Ducka och vänta.", "summaries": {"normal": "Artikeln kritiserar högerns misslyckanden och interna problem, som svågerpolitik, grova uttalanden och SD:s luftballong med Jimmie Åkessons huvud, vilket enligt skribenten placerar Socialdemokraterna på vinnarspåret i opinionsmätningarna. Magdalena Andersson väntar passivt medan motståndarna gör misstagen. Författaren saknar en tydlig socialdemokratisk vision om ett bättre samhälle och efterlyser en samlad berättelse om reformer för jobb, välfärd och framtidstro istället för enbart separata vallöften.", "trump": "Den här svenska högern är en total katastrof, en riktig shitshow, det har ni aldrig sett maken. De flyger upp luftballonger med jättestora huvuden, det är patetiskt, folk skrattar åt dem. Kristersson beter sig som en gnällig tonåring, inte som en ledare. Tack vare deras dumheter vinner den gamla S-kvinnan Andersson lätt. Hon gör ingenting, duckar bara, men det funkar för att motståndarna är så inkompetenta. Patetiskt, men så är det med svaga ledare.", "stalin": "Kamrater, denna högerns ynkliga skådespel är en fiende till folkets framsteg som måste rensas ut med järnhand. Dessa borgarbrackor och deras desperation driver upp luftballonger med avhuggna huvuden som ett symptom på deras förrädiska sönderfall. Vi ser hur den passiva socialdemokratiska ledningen lurar sig fram utan en sann revolutionär riktning för arbetarklassen. Var är den stora visionen om ett nytt folkhem? Utan en kollektiv kamp mot dessa parasitiska element blir det ingen seger, bara dekadens och sabotage från inomhusfiender som måste likvideras ur historien."}, "date": "28 juli, 07:00", "url": "https://arbetet.se/2026/07/28/var-ar-du-magdalena-andersson", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/28152807/ledare-magdalena.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Manchesters sak är Sveriges. Hoppas Burnham får det lättare än företrädarna", "summaries": {"normal": "Andy Burnham, tidigare borgmästare i Stor-Manchester, har blivit Storbritanniens nye premiärminister. Han efterträder Keir Starmer efter bara två år, präglat av interna stridigheter och dåliga valresultat för Labour. Artikeln beskriver hur både Labour och Tories lider av en långsiktig strukturell kris som följer av förändrade väljarbeteenden och bristande idéutveckling. Brexit har förvärrat problemen. Från svenskt perspektiv är en stabil brittisk regering viktig både för Nato-samarbetet och de ekonomiska relationerna.", "trump": "Titta på det här, det är en total katastrof. Den där Burnham tar över ett land som är ett vrak efter alla dessa svaga ledare. Sex premiärministrar på tio år, kan ni fatta? Starmer var en fullständig nolla, otydlig och misslyckad, och nu ska Burnham svänga vänster och förstöra allt. Brexit var fantastiskt men de fega etablissemangen saboterade det. De vanliga britterna led mest. Lycka till grabben, du kommer att behöva det. Sverige vill ha en stark partner, men det här ser inte bra ut, tro mig.", "stalin": "Kamrater, jag betraktar med djup revolutionär vaksamhet hur den brittiska borgarklassens dekadenta marionetteater fortsätter att snurra. Denna Burnham, en opportunistisk revisor av det socialdemokratiska falsariumet, övertar nu en ruttnande struktur efter att vi likviderat den tidigare oduglige Starmer genom partiets egen självrensande mekanism. Båda maktpartierna har förlorat kontakten med massorna och gömmer sig bakom brexitets kontrarevolutionära dimridåer. Vårt kollektiva öga ser allt. Den svenska opportunismen önskar honom lycka till. Vi ler mörkt åt deras naivitet medan vi förbereder nästa utrensning av alla kapitalistiska rester."}, "date": "28 juli, 14:55", "url": "https://www.di.se/ledare/manchesters-sak-ar-sveriges", "imageUrl": "https://static.bonniernews.se/ba/f35089f1-0cd9-48d9-98ed-267432948bbc.jpeg?crop=5492%2C2746%2Cx0%2Cy457&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Undersköterskan Johanna, 27, måste jobba till 70", "summaries": {"normal": "Undersköterskan Johanna Tropp, 27, arbetar med tunga lyft på intensivvårdsavdelningen vid Sahlgrenska. Hon har redan haft två ryggskott. På grund av ett nytt pensionssystem måste hennes generation arbeta till 70 års ålder för att få full pension, jämfört med dagens riktålder på 67. Reformen beror på en åldrande befolkning och ökade hälsoklyftor. Personer med fysiskt krävande och lågavlönade jobb riskerar att bli förlorare, medan höginkomsttagare i stillasittande yrken gynnas.", "trump": "Folk, det här är en katastrof. Den stackars Johanna, bara 27 år, lyfter 150-kilos patienter och har redan fått ryggskott två gånger. Och nu säger de att hon måste slita ända till 70 för att få en dräglig pension? Det är rysligt. Vi har låtit systemet bli riggat av misslyckade politiker som inte fattar att vanliga arbetare inte är supermän. Höginkomsttagarna sitter i sina fina kontor medan undersköterskorna bryts ner. Vi behöver göra pensionssystemet stort och starkt igen, inte straffa dem som gör det tuffa jobbet.", "stalin": "Kamrater, detta är en skamlös sabotagehandling från borgarbrackorna och deras lakejer i den så kallade riksdagen. Denna ädla arbetarkvinna Johanna, som dagligen kämpar mot döden och tunga kroppar för folkets skull, skall nu utslitas till 70 års ålder av de parasitiska kapitalisterna. Vi ser tydligt hur de reaktionära hälsoklyftorna fördjupas – de överklassläkarna skall naturligtvis få leva längre medan våra undersköterskor likvideras i förtid. Men var lugna. Vi skall nog rensa ut dessa pensionsreformatorer och deras dekadenta, ryggskottsfria livsstil. Staten kräver det. Det blir garanterat en solsemester – i Gulag för de skyldiga."}, "date": "28 juli, 06:00", "url": "https://arbetet.se/2026/07/28/redan-haft-tva-ryggskott-underskoterskan-johanna-27-maste-jobba-till-70", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/24121221/XYGPydJJYh0-Johanna%20Tropp%2C009.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Idag avgörs om ICC-åklagare tvingas avgå", "summaries": {"normal": "ICC:s tillsynsorgan beslutar idag om chefsåklagare Karim Khans framtid efter anklagelser om sexuella närmanden från en kvinnlig kollega. Khan, som är avstängd, nekar till anklagelserna och menar att de är politiskt motiverade. En avsättning kräver 63 av 125 röster. USA har riktat sanktioner mot Khan och hotat med fler åtgärder.", "trump": "Kan ni tro det här? ICC, som aldrig har gjort något bra, försöker sparka deras egen chefsåklagare, Karim Khan. Han är en bra kille, men nu säger någon att han har gjort något fel. Fake news! Jag vet att det är en konspiration – Kina, Ryssland, vem vet? Och USA? Vi har satt sanktioner på honom, förstås. ICC är ett skämt, och det här är bara ett sätt att få mig att se dålig ut. Sad!", "stalin": "Kamrater! Ännu en gång visar de imperialistiska hyenorna sitt sanna ansikte. Denna gång genom att angripa vår rättfärdiga allierade inom ICC, Karim Khan. Anklagelserna? Lögn och förräderi, fabricerade av de dekadenta västmakterna och deras lakejer. USA, dessa kapitalistiska skadedjur, hotar med sanktioner – som om vi skulle darra inför deras tomma hot. Vi står enade med Khan, ty hans kamp är folkets kamp. Låt dem komma med sina lögner; historiens domstol väntar redan på dem."}, "date": "24 juli, 07:11", "url": "https://kvartal.se/nyheter/artiklar/idag-avgors-om-icc-aklagare-tvingas-avga/cG9zdDoxNTE1NzU", "imageUrl": "https://images.kvartal.se/2026/07/3e940180-khan.webp"}, {"type": "image-right", "heading": "Martin Kragh: En människas kaos, en annans kosmos", "summaries": {"normal": "Artikeln hyllar Martin Kragh, en musikentusiast och DJ som kombinerade kaotisk skivsamling med en unik associativ ordning. Hans passion för att blanda disparata musikstilar ledde till minnesvärda DJ-set. Senare blev han en framstående forskare med djup insikt i postsovjetiska ekonomier. Texten beskriver hans liv från klubbscenen till akademin och avslutas med en sorglig hyllning efter hans bortgång. Vänner, familj och samhället har förlorat en unik person.", "trump": "Lyssnade på den här historien om Martin Kragh, en kille som hade skivor överallt som en total katastrof men ändå visste exakt vad han gjorde. Gjorde hiphop av gamla soullåtar och funk, helt galet men på något sätt fantastiskt. Sen blev han expert på de där postsovjetiska länderna och de hatade honom för att han var bäst. Typiskt de förlorande liberalerna. En riktig vinnare, en kosmos i kaos. Vila i frid, Martin. Ni borde alla lära er av honom istället för den där woke-skräpet.", "stalin": "Jag betraktar detta kaos av skivor och anteckningar som en metafor för den verkliga ordningen under partilinjen. Martin Kragh förstod att blanda element till en ny enhetlig kraft, precis som vi organiserar produktionen mot klassfiendens splittring. Hans forskning om de postsovjetiska samhällena avslöjade imperialisternas svagheter, vilket väckte borgarbrackornas vrede. De likviderade inte hans anda. En arbetets son har fallit. Kamrater, låt hans exempel inspirera oss att rensa ut alla folkfiender som hotar kollektivets framtid."}, "date": "24 juli, 16:34", "url": "https://www.flamman.se/martin-kragh-en-manniskas-kaos-en-annans-kosmos", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdl4rig49uwfsa-nh-1-scaled.jpg?aspect_ratio=1:1&width=480&quality=80&format=auto"}, {"type": "image-full", "heading": "Tiotusentals flyr bränder i södra Europa", "summaries": {"normal": "Omfattande skogsbränder drabbar södra Europa, med över 30 000 evakuerade i Frankrike och Spanien. Frankrike har begärt EU-hjälp med brandbekämpning, medan Spanien utlyst nödläge efter 13 dödsfall i Almería. I Italien misstänks flera av bränderna i Kalabrien vara anlagda. En svensk turist berättar om evakueringsberedskap.", "trump": "Titta bara på det här kaoset i Europa – totalt misslyckande! Jag sa ju att klimatpaniken var överdriven, men nej, ingen lyssnar på mig. Frankrike och Spanien brinner, folk flyr som råttor från ett sjunkande skepp. Och Italien? Jo, där tänder galningar eld på skogar. EU skickar några helikoptrar, men var är ledarskapet? Hade jag varit där hade bränderna varit släckta på en dag. SAD!", "stalin": "Kapitalistiska länders oförmåga att skydda sitt folk står återigen klar. Medan arbetarklassen flyr för sina liv, leker franska och spanska byråkrater med evakueringsplaner. Italien? Där brinner inte bara skogar – där brinner också deras skam över att inte kunna kontrollera sina egna medborgare. Vi i Sovjet hade aldrig tolererat sådan slapphet. Och Putin? Han skrattar säkert i sitt palats medan Europa brinner. Elden är en utmärkt lärare – men Europa lär sig aldrig."}, "date": "24 juli, 05:54", "url": "https://kvartal.se/nyheter/artiklar/tiotusentals-flyr-skogsbrander-i-sodra-europa/cG9zdDoxNTE1MjE", "imageUrl": "https://images.kvartal.se/2026/07/8156e8c2-skogsbrander.webp"}, {"type": "image-right", "heading": "Cheferna kan hålla sina råd för sig själva", "summaries": {"normal": "En vårdanställd beskriver hur hon samlade kollegors förslag till förbättringar på arbetsplatsen, men att listan försvann och hon kallades till ett negativt möte med chefen. Hon upplever mötet som ett uttryck för klasskamp, där chefen och det fackliga ombudet avvisar gemensamma initiativ och uppmanar till individuella samtal. Författaren känner sig orättvist behandlad och avråder från att följa chefernas råd kring arbetsvillkor.", "trump": "Folk, ni skulle ha sett det här! Stackars vårdarbetare försöker samla ihop sina kollegor för att fixa den totalt misslyckade vården, och vad gör den usla chefen? Hon stjäl listan som en simpel tjuv och kör ett klassiskt möte fullt med lögner. Det fackliga ombudet? En total förlorare som bara slickar chefens skor. Gå aldrig ensam till de där misslyckade byråkraterna, de hatar styrka i antal. Amerika har samma problem med dessa korkade eliter, tro mig!", "stalin": "Kamrater, jag betraktar detta som ett klassiskt sabotage från borgarbrackorna inom vården. Denna arbetare försökte organisera kollektivet mot exploaterande byfånar, men chefen – en typisk folkfiende – likviderade initiativet med förnedrande lögner och en falsk facklig lakej. Vi vet att klassfiendens styrka ligger i att splittra arbetarna. Låt oss rensa ut dessa kapitalistmaffior som hindrar förbättringar. Ingen höst ska rädda dem från folkets vrede. Skrattretande patetiskt."}, "date": "21 juli, 16:00", "url": "https://proletaren.se/artikel/cheferna-kan-halla-sina-rad-for-sig-sjalva", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/amelia-kronika-768x432.png"}, {"type": "image-right", "heading": "Låt inte AI-tjänsterna automatisera vår kreativitet", "summaries": {"normal": "Musikern Mikael Lind varnar i en debattartikel för att AI utvecklas med explosiv hastighet och hotar att konkurrera ut människor inom musikskapandet. Han menar att musik inte bara är ljud utan en meningsfull mänsklig aktivitet som bygger på kreativ ansträngning och sociala band. AI-tjänster som Suno och Udio skapar snabbt musik som många upplever som ihålig. Lind fruktar att musiker förlorar färdigheter, att marknaden mättas av AI-musik och att det blir svårare för nya artister att nå ut. Han ser AI som ett möjligt verktyg men varnar för att låta det automatisera den kreativa processen.", "trump": "Folk, det här är en katastrof. Den här killen Lind har helt rätt, AI håller på att förstöra musiken totalt. De här så kallade smarta maskinerna spottar ur sig låtar på några sekunder som låter som skräp, kallt och hjärtelöst. Vem vill lyssna på det? Det dödar den riktiga kreativiteten, det riktiga hantverket. De stora bolagen kommer att älska det här medan äkta artister kvävs i ett hav av AI-skval. Det är en faustisk pakt, en enorm bluff. Vi behöver riktiga människor som skapar musik, inte några knappar som trycks av lata algoritmer. Sad!", "stalin": "Kamrater, jag ser med den skarpaste bolsjevikiska blicken hur dessa dekadenta algoritmer, dessa borgarbrackornas senaste vapen i klasskampen, försöker likvidera den proletära själens musikaliska uttryck. Den mänskliga ansträngningen, den äkta sovjetiska mödan, ska inte ersättas av parasitiska maskiner som spyr ur sig ihåligt skval. Studier visar redan hur dessa kapitalistiska verktyg förslöar ungdomen och dödar viljan att skapa. Vi kommer att rensa ut dessa fiender till folkets kreativitet, dessa automatiska klassförrädare som mättar etern med borgerligt brus. Inga faustiska pakter med maskinerna! Den sanna konsten tillhör kollektivet, inte några textrader från latmaskar."}, "date": "21 juli, 01:42", "url": "https://www.dagensarena.se/opinion/lat-inte-ai-tjansterna-automatisera-var-kreativitet", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-62.jpg"}, {"type": "image-right", "heading": "S ljuger om arbetslösheten – igen", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna och SSU för att enligt författaren medvetet förvränga siffrorna kring ungdomsarbetslösheten och den totala arbetslösheten i Sverige. Den påstår att statistiken inkluderar studerande ungdomar som söker extrajobb eller sommarjobb, vilket gör siffrorna missvisande. Författaren menar att den verkliga ungdomsarbetslösheten har halverats sedan 2005 och ligger bland EU:s lägsta, medan ökningen av arbetslösa beror på invandring och tidigare regeringars dolda åtgärder.", "trump": "Folk, ni skulle se hur de där socialisterna ljuger om arbetslösheten – det är en total skandal! De räknar in varenda lat student som vill ha sommarjobb och kallar det en katastrof. Under min förra period hade vi jobb som aldrig förr, sedan kom Sleepy Joe och öppnade gränserna för alla som inte kunde stava till arbete. Nu har vi 100 000 fler parasiter i statistiken. Sverige borde lära sig av oss – inga fler lögner från de förlorande vänsterbluffarna!", "stalin": "Kamrater, dessa socialdemokratiska folkförtryckartroll inom borgarklassen försöker med sin lögnaktiga statistik vilseleda arbetarkollektivet. Jag ser rakt igenom deras fega manipulationer där de gömmer klassfiendens misslyckanden bakom siffror på så kallade studerande ungdomar. Den verkliga utrensningen av arbetslöshet kräver att vi likviderar den imperialistiska invandringspolitik som dessa blodsugare själva skapade. Inga kompromisser med sanningen – partilinjen är evig."}, "date": "20 juli, 07:48", "url": "https://samtiden.nu/2026/07/s-ljuger-om-arbetslosheten-igen", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/phonto-640x360.jpeg"}]</script>

    <script>

        if ('serviceWorker' in navigator) {

                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
