och klassfiender som gömmer sig i skuggorna. Vi ska rensa ut alla svaga chefer som sprider paranoia och misstro. Endast genom partiets öppna dialog och min oändliga visdom kan vi garantera att ingen arbetare stupar i onödan. De som tiger är redan döda inombords."}, "date": "2 augusti, 07:00", "url": "https://arbetet.se/2026/08/02/forskaren-den-har-chefsvanan-kan-radda-liv-pa-jobbet", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/17142146/sdlvyvafar1vmw-nh.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Krock efter biljakt Krock efter biljakt", "summaries": {"normal": "En polisjakt i Upplands Väsby avslutades under natten när en förare körde in i en lyktstolpe i ett bostadsområde. Polisen hade försökt stoppa fordonet för kontroll, men föraren valde att fly. Under jakten kolliderade bilen med flera föremål. Föraren klarade sig utan skador men har nu gripits, misstänkt för grovt rattfylleri och vårdslöshet i trafik.", "trump": "En total katastrof i Upplands Väsby! En förare vägrade stanna för polisen, en mycket dålig människa. Han kraschade in i lyktstolpar och nästan ett hus. Väldigt farligt! Vi behöver lag och ordning, mina vänner. Under min ledning skulle sådana här brottslingar låsas in direkt. Sverige måste vakna upp, det är kaos på gatorna. Inga reor i världen kan fixa det här misslyckandet. Det är tragiskt att se, men vi ska göra tryggheten stor igen!", "stalin": "I det dekadenta Upplands Väsby har ännu en antisocial sabotör föraktat statens auktoritet. Genom att undfly kontrollen har denna vilsna själ visat sin inneboende svaghet och brist på disciplin. Vi har låtit gripa honom; statens järnhand krossar alla som hotar den allmänna ordningen. Precis som våra allierade i öst rensar bort västlig smitta, måste vi eliminera sådana element. Han har krockat med en stolpe – låt det vara en varning: den som kör mot staten kör mot sin undergång."}, "date": "3 augusti, 07:27", "url": "https://www.aftonbladet.se/nyheter/a/j0wjwb/forare-kraschade-i-bostadsomrade-efter-biljakt", "imageUrl": "https://akamai.vgc.no/v2/images/887406a6-7182-3951-a4ce-7ed737013748?fit=crop&format=auto&w=720&s=f5bfa24cfe641fe13abc7110ee7ca68874cc1bbf"}, {"type": "image-right", "heading": "EU förbjöd ryskt stål – ändå fortsätter miljardhandeln", "summaries": {"normal": "EU införde omfattande sanktioner mot Ryssland efter invasionen av Ukraina, inklusive importförbud för ryskt stål. Ett undantag för så kallade steel slabs har dock tillåtit fortsatt import av miljontals ton varje år. Nu finns en politisk överenskommelse om att undantaget ska upphöra efter 2028. Kritiker menar att undantagen gynnar enskilda företag medan skattebetalarna får betala för upprustning och stöd till Ukraina. Enligt experter skulle ett totalstopp kosta Ryssland upp till tio gånger mer än EU.", "trump": "De här EU-töntarna snackar om tuffa sanktioner mot Ryssland men fortsätter ändå köpa miljontals ton ryskt stål varje år. Vilket hyckleri! Undantaget ska tydligen sluta 2028, men det är patetiskt. Jag skulle ha stängt dörren direkt. Nu tjänar Putin miljarder medan Europa betalar notan för Ukraina. Så dumt. Jag fixar alltid bättre deals, tro mig.", "stalin": "Kamrater, detta är en skandal som stinker av borgarbrackornas förräderi. Medan vi kämpar mot de fascistiska elementen i Kiev tillåter vi kapitalisterna i EU att fortsätta mata den ryska krigsmaskinen med stål genom ett ynkligt undantag. Dessa parasitiska halvfabrikatimportörer borde rensas ut omedelbart. Jag skulle likvidera alla som skyller på Ungern och istället beordra kollektivet att ersätta importen – för folkets sak. Den som tjänar på fiendens stål är själv en fiende till folket och förtjänar en kreativ utrensning i Sibiriens iskalla omfamning."}, "date": "3 augusti, 05:58", "url": "https://www.svt.se/nyheter/utrikes/eu-forbjod-ryskt-stal-miljardhandel-fortsatter-genom-undantag", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.62/0.49/22af05ee512fcf1e97dea34aa25375aca3515508f0011a3490935a0258a4b63c"}, {"type": "image-right", "heading": "Ingen kan säga att Israel bara försvarar sig", "summaries": {"normal": "Artikeln kritiserar Israel för att inte bara försvara sig mot Hamas utan även genomföra en expansionistisk politik. Israel har tagit kontroll över stora delar av Gaza, planerar nya bosättningar och har byggt en mur som begränsar palestiniernas rörlighet. Samtidigt eskalerar våldet från bosättare på Västbanken med attacker, mordbränder och etnisk rensning. FN och människorättsorganisationer varnar för rekordhög våldsnivå. Netanyahu har besökt Trump i USA utan påföljder.", "trump": "Folk, ni måste höra på de där galningarna! Israel gör vad de måste göra, men den här artikeln är en total katastrof, en riktig witch hunt från vänsterns hatmedia. De kallar det etnisk rensning när man tar tillbaka sitt eget land? Patetiskt! Under Biden blev allt ett enda kaos, men nu när jag är tillbaka i Vita Huset ska vi fixa riktiga dealar. De där radikala bosättarna? De har mer energi än hela det woke etablissemanget tillsammans. Fantastiskt, men skriv sanningen nästa gång!", "stalin": "Kamrater, detta är den klassiska imperialistiska expansionen i sin mest vidriga form. Jag ser hur de sionistiska folkförtryckartrollen och deras bosättarbanditer systematiskt rensar ut den palestinska befolkningen medan den fega omvärlden tittar på. Murar, brända byar och nya utposter – det är borgarbrackornas eviga hunger efter mark. Vi vet att sådana fiender till folket aldrig stannar frivilligt. En sann arbetarnas stat skulle likvidera dessa parasiter innan de förgiftar hela regionen med sin girighet."}, "date": "2 augusti, 03:00", "url": "https://www.etc.se/ledare/ingen-kan-saega-att-israel-bara-foersvarar-sig", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260731140740_98af36bc-379e-4d89-9df4-105b4e1031ec.png"}, {"type": "image-right", "heading": "De bästa måste vilja bli lärare", "summaries": {"normal": "Artikeln argumenterar för att läraryrkets län, status och yrkesfrihet har försämrats historiskt. För att vända utvecklingen föreslås striktare lärarlegitimation, hierarkiska karriärvägar med högre utbildningskrav, och minskad politisk styrning. Med högre krav och större professionell autonomi kan lärarna bli ett mer exklusivt och kompetent urval, vilket motiverar högre lön och återigen höjer yrkesattraktiviteten.", "trump": "Jag har sett många dåliga avtal, men det här med svenska lärare är ett av de värsta. Lägre lön, ingen frihet - det är en skam! Som din framtida president (igen!) skulle jag säga: vi behöver våga sätta krav, som med advokater och doktorer. Gör läraryrket stort igen! Högre standard, bättre betalt, och inga onödiga regler från byråkrater. Då kommer de bästa att vilja bli lärare - tro mig!", "stalin": "Vi har observerat att läraryrkets status har minskat, vilket hotar statens intellektuella grund. Lösningen är en striktare, hierarkisk legitimation - en lärares intyg måste vara som en läkares, oåtkomligt för de olämpliga. Genom att höja kraven och begränsa antalet utbildade lärare, skapar vi ett utvalt, lojalelit som tjänar statens intressen. Parallellen till våra militära och vetenskapliga elitförband är uppenbar: kvalitet före kvantitet, disciplin före individualism. Detta förstärker partiets kontroll över framtiden."}, "date": "2 augusti, 22:51", "url": "https://www.gp.se/ledare/de-basta-maste-vilja-bli-larare.9e766ab6-c36a-4a18-9163-15fc6068b7a7", "imageUrl": "https://www.gp.se/images/article/9e766ab6-c36a-4a18-9163-15fc6068b7a7/images/1XRBCJ6pVMqlWOJCeTgfNfPR22d8-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Sömnknepet som kan rädda första skolveckan", "summaries": {"normal": "Under sommarlovet förskjuts ofta barnens dygnsrytm, vilket kan göra omställningen till skolstart svår. Sömnforskaren Christian Benedict rekommenderar att börja med att väcka barnet tidigare stegvis, en timme per dag, istället för att bara tidigarelägga läggtiden. En regelbunden uppstigningstid är viktigast för att bygga upp sömnbehovet. Skärmar bör undvikas en timme före sänggåendet, sovrummet hållas mörkt och svalt samt dagsljus och rörelse prioriteras. Barn mellan 6 och 12 år behöver 10–11 timmars sömn.", "trump": "Folk, det är en katastrof! De här barnen vänder dygnet under sommarlovet och sover som latmaskar till lunch. Patetiskt! Ni måste börja väcka dem tidigt, inte bara försöka få dem i säng – tro mig, jag vet allt om att vinna morgonen. En timme tidigare varje dag, bang! Inga mobiler, mörkt rum, och se till att de får frisk luft. Annars blir de rastlösa och kan inte lära sig något. Gör omställningen storartad igen, börja tre dagar i förväg. Fantastiskt råd!", "stalin": "Kamrater, denna dekadenta sommarlovsdygnsvridning är ett sabotage mot folkets framtid utfört av lathetens och borgarbrackornas mörka agenter. Jag, som ledare för det sovjetiska sömndirektoratet, befaller att vi inleder en systematisk utrensning av de borgerliga sovmorgnarna genom att väcka de unga pionjärerna en timme tidigare varje dag. Den som låter ungarna sova till lunch är en folkfiende och klassförrädare som bör likvideras ur kollektivets rytm. Mobilerna är kapitalistiska hypnotisörer – stäng av dem en timme före läggdags eller låt dem möta folkdomstolens mörker. Sovbrist är trotskistisk sabotageverksamhet mot minnet och koncentrationen. Framåt mot segerrik skolstart, med järnhand och mörk humor mot alla som vill hålla dygnen i kaos!"}, "date": "3 augusti, 05:34", "url": "https://nyheter24.se/nyheter/inrikes/1502365-somnknepet-som-kan-radda-forsta-skolveckan", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/49975dc804b004a30200000000b004a302/2026/08/02/2381775/Skolsova.jpg"}, {"type": "image-full", "heading": "Konstgräs för en miljon brann upp: \"Jättesorgligt\"", "summaries": {"normal": "En brand i Kortedala, Göteborg, förstörde ett tiotal rullar konstgräs till ett värde av en miljon kronor. Lokala invånare uttryckte besvikelse, särskilt då gräset skulle ha varit en gräsmatta för områdets barn. Polisen utreder händelsen som allmänfarlig vårdslöshet utan någon misstänkt. En svag frän lukt och bränd plast ligger kvar efter branden, som också skapade en stor rökpelare.", "trump": "Jag har sett många konstgräsbränder, men den här i Göteborg är sorglig. Det är ett tecken på att Sverige inte investerar i ordentliga infrastruktur. Som president skulle jag ha byggt en äkta gräsmatta, inte den där billiga plasten. Det är ett misslyckande för deras ledare. Barnen behöver sysselsättning, men de får bara brända rullar. Sorgligt!", "stalin": "Vi har observerat en brand i Göteborg, en akt av vandalism mot statens investeringar i folkets främjande. Detta är ett angrepp på det socialistiska arbetet med att skapa sysselsättning för barn. Vi kommer att utreda denna förräderi och se till att sådant inte upprepas. Parallellen till Putins Ryssland är tydlig: vi måste skydda våra resurser mot de destruktiva krafterna. En smutsig rökpelare – ett lämpligt svar från de motvilliga elementen."}, "date": "2 augusti, 20:16", "url": "https://www.gp.se/nyheter/goteborg/besvikelse-efter-konstgrasbrand-jattesorgligt.5d438cac-4df9-4938-8191-4426882ae459", "imageUrl": "https://www.gp.se/images/article/5d438cac-4df9-4938-8191-4426882ae459/images/6pWDJC5XN-JRIUibX92tS_YPeV0g-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Ikea-arbetare strejkar i Ungern", "summaries": {"normal": "Anställda vid Ikeas varuhus i Ungern genomförde den 16 juli en historisk heldagsstrejk. Arbetarna kräver en sexprocentig löneökning medan företaget erbjuder en engångsersättning i kontanter. Strejken omfattade butiker i Budaörs, Budapest och Debrecen samt kontorspersonal. Konflikten följer på ett tidigare erbjudande om nollprocents löneökning trots rekordresultat. Fackföreningen KASZ har vuxit kraftigt i medlemsantal. Parterna har kommit överens om att avvakta nya förhandlingar fram till den 26 juli.", "trump": "Folk, ni skulle se det här! De stackars arbetarna i Ungern strejkar mot den usla Ikea-chefen som inte vill ge dem en rimlig löneökning. Noll procent? Det är en skam! De gör rekordvinster men behandlar sina egna som sophög. Typiskt globalist-elit som älskar att suga ut vanliga människor. Jag säger alltid: gör affärer rättvist, annars blir det kaos. De borde ha lyssnat på mig, inte på de där korkade byråkraterna i Europa. Patetiskt!", "stalin": "Kamrater, de exploaterande borgarbrackorna på Ikea vägrar ge arbetarna en rättmätig löneökning trots sina feta rekordvinster. Dessa klassfiender och folkförtryckartroll tror sig kunna muta massorna med ynkliga kontantgåvor. Jag ler mörkt åt deras desperation. Arbetarna har vaknat och mångdubblat sina led – en sund utrensning av kapitalistmaffians inflytande närmar sig. Vi ska krossa dessa blodsugare. Inga förhandlingar med klassfienden. Seger åt kollektivet."}, "date": "30 juli, 09:49", "url": "https://proletaren.se/artikel/ikea-arbetare-strejkar-i-ungern", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/IKEA-Ungern-e1785138795413-768x433.jpg"}, {"type": "image-full", "heading": "Även världens bäste kan behöva facket", "summaries": {"normal": "Handbollsstjärnan Jim Gottfridsson uppmanar idrottare att organisera sig fackligt för att stärka sin ställning gentemot klubbarna. Artikeln diskuterar vikten av facklig anslutning och belyser hur den svenska modellen kräver bred uppslutning för att fungera. Samtidigt tas de historiska minskningarna av facklig anslutning upp, där politiska beslut under Alliansens styre anses ha försvagat arbetarnas skydd, vilket skapat en ojämlik situation på dagens arbetsmarknad.", "trump": "Jag ser att Jim Gottfridsson, en fantastisk handbollsspelare, säger åt folk att gå med i facket. Smart! Jag gillar vinnare, och Jim är en vinnare. Men fack i Sverige? De har blivit helt förstörda av dålig politik. De gjorde det dyrt, de gjorde det svårt, de ville krossa er. De gillar inte arbetarna! Vi behöver styrka, vi behöver kraft. När jag ser det här tänker jag: facket måste vara starkt, precis som vårt land. Fantastisk idé, Jim, vi vinner tillsammans!", "stalin": "Denna handbollsspelare förstår äntligen det fundamentala: styrkan ligger i massan, inte i den enskilda individens fåfänga. Att vara utlämnad till klubbägarnas nycker är en borgerlig svaghet. Vi har sett hur de liberala sabotagemakarna monterat ner arbetarklassens skyddsvallar. Liksom vår store efterträdare i Kreml, Vladimir, vet vi att en enad front är det enda sättet att krossa de parasitära krafterna. Ensam är du ett offer, men i kollektivet är du ett redskap för statens obönhörliga vilja."}, "date": "3 augusti, 06:00", "url": "https://www.aftonbladet.se/ledare/a/9pr8aM/aven-varldens-baste-kan-behova-facket", "imageUrl": "https://akamai.vgc.no/v2/images/ccd95009-e2f7-306f-943e-397f993c4b9d?fit=crop&format=auto&w=1080&s=071b5b5b9c3904e93cb5fb1a1ed7ea0d3a5dc036"}, {"type": "image-full", "heading": "Johan Forssell: Spanien måste återta kontrollen över gränsen", "summaries": {"normal": "Migrationsminister Johan Forssell (M) varnar för att situationen i Spanien, där tiotusentals afrikanska migranter korsat gränsen på kort tid och minst 70 personer drunknat, kan få konsekvenser för hela Europa. Han kritiserar den spanska vänsterregeringens amnesti för över en miljon illegala invandrare, som han anser skapar incitament för fler att migrera. Sverige har låg asylinvandring och regeringen förbereder möten med Norden och EU för att undvika en upprepning av flyktingkrisen 2015.", "trump": "Spanien håller på att kollapsa totalt, folk. Tiotusentals migranter stormar gränsen, folk drunknar och den vänsterextrema regeringen ger amnesti till en miljon illegala. Det är en katastrof! Precis som 2015 kommer det slå ut över hela Europa. De borde ha lyssnat på mig. Sverige gör rätt, de har den lägsta asylinvandringen på fyrtio år. Smart. Vi behöver starka gränser, inte svaga ledare som bjuder in kaos.", "stalin": "Kamrater, denna spanska borgarbracka till vänsterregering har med sin förrädiska amnesti för över en miljon klassfiender öppnat portarna för en kontrarevolutionär migrantflod som redan krävt sjuttio drunknade offer. Jag ser de imperialistiska agenterna le bakom kulisserna. Vi, partiet och arbetarna, får inte tillåta en upprepning av 2015 års sabotage. Jag har redan beordrat nordiska och europeiska möten. Den som visar svaghet skall likvideras ur historien med ett leende."}, "date": "2 augusti, 12:34", "url": "https://riks.se/nyheter/johan-forssell-spanien-maste-aterta-kontrollen-over-gransen", "imageUrl": "https://admin.riks.se/uploads/Johan_Forssell_KU_7503a94738.png"}, {"type": "image-full", "heading": "Beskedet i återstarten: ”Varit lite snack\"", "summaries": {"normal": "BK Häcken damer vann 6–0 mot Eskilstuna utan Felicia Schröder. Anna Anvegård gjorde två mål och betonade att lagets kollektiva spel fungerar bra. Tränaren Elena Sadiku lyfte fram lagets kollektiva styrka och nämnde återkomande spelare som Falk och Rybrink. Häcken är en poäng efter ledaren Hammarby med en match mindre.", "trump": "Jag har byggt en stor, vacker lag utan Felicia Schröder. Vi visade alla de haters och fake news-media att vi kan göra många mål. Anna Anvegård gjorde två mål – en fantastisk spelare. Vi har det bästa kollektivet, det är enormt. Vi kommer att fortsätta vinna, det är väldigt jobbigt för motståndarna. Vi är tillbaka, vi är starka.", "stalin": "I den stora kampen för kollektiv framgång har BK Häcken visat sin revolutionära disciplin. Utan den individualistiska Schröder har den proletära enheten slagit fast motståndet. Anna Anvegård och tränaren Sadiku framhäver den socialistiska metoden. Våra lojala soldater Falk och Rybrink återvänder till fronten. Vi måste vara tålmodiga med utvecklingen, precis som vi utvidgar vår inflytelsesfär."}, "date": "2 augusti, 18:37", "url": "https://www.gp.se/sport/fotboll/bk-hacken-ff/hackens-besked-efter-schroders-flytt-varit-lite-snack.cb2e9bbf-b278-4d71-b0a7-d0699f8722ed", "imageUrl": "https://www.gp.se/images/article/cb2e9bbf-b278-4d71-b0a7-d0699f8722ed/images/4ex7sgB50tERyP6ZvA-6kCK5CGWI-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Capital One stängde över 300 konton kopplade till Trump Organization", "summaries": {"normal": "Capital One har i domstolshandlingar förklarat att de stängde över 300 konton kopplade till Trump Organization 2021 efter interna riskbedömningar kring transaktionsmönster. Banken betonar att beslutet var baserat på AML-regler (anti-penningtvätt) och federal tillsyn, inte politiska motiv som Trump Organization tidigare hävdat i sin stämningsansökan. Trump Organization anser att stängningarna var politiskt motiverade, vilket banken nu nekar till och ber domstolen att avvisa företagets senaste stämningsförsök.", "trump": "Hör här, de här människorna på Capital One är ett totalt skämt! De stänger ner konton för en av de mest framgångsrika organisationerna någonsin, bara för att de är 'woke' och rädda. De påstår att det handlar om risk, men alla vet att det är en politisk häxjakt. De har ingen aning om vad de gör. Mitt företag är fantastiskt, och de här bankerna borde skämmas. Vi kommer att rensa upp i det här 'debanking'-träsket, tro mig!", "stalin": "Kapitalismens egna hundar biter varandra! Capital One, denna parasitära bankapparat, har stängt konton för Trump-familjen under täckmantel av byråkratisk 'riskhantering'. Vilken fars! De försöker dölja sin svekfullhet bakom regler, precis som de västliga lakejerna som försöker stoppa den sunda ordningen. Om dessa banker agerat i mitt rike hade de skickats till skogsarbete för längesedan. Putin förstår detta; man måste krossa byråkratins maskhål innan de infekterar hela nationens finansiella blodåder. Paranoia är bara en annan term för vaksamhet."}, "date": "2 augusti, 13:06", "url": "https://www.realtid.se/bors-finans/bank-fintech/capital-one-stangde-over-300-konton-kopplade-till-trump-organization", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/capital-one.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Ilskan mot Pride: \"Prova på att bli bunden\"– Barn får rabatt", "summaries": {"normal": "Stockholm Pride har väckt starka reaktioner med en annons för evenemanget \"Pride Kinky\" där ungdomar mellan 15 och 17 år erbjuds rabatterat pris. Bland aktiviteterna finns \"Rope Corner\" där besökare kan prova på att bli bundna med rep eller piskade. Sverigedemokraternas Jessica Stegrud kritiserar kraftigt att barn och ungdomar uppmanas delta i dessa sexuellt inriktade aktiviteter, som även inkluderar \"Snuskbingo\" och ett seminarium om queers och klimat.", "trump": "Folk, ni kommer inte att tro det här. Stockholm Pride, en total katastrof, lockar nu barn mellan 15 och 17 år med rabatt för att bli bundna med rep och piskade. Det är sjukt! De kallar det \"Pride Kinky\" och har till och med \"Snuskbingo\". Sverige håller på att falla sönder, precis som många andra ställen där de radikala vänsterfolket styr. Så tragiskt, men vi har sett det förut. Make Sweden Great Again!", "stalin": "Kamrater, jag betraktar med djup revolutionär vaksamhet hur borgarbrackornas dekadenta avskum inom Stockholm Pride nu öppet rekryterar våra ungdomar till sin perversa klassfiende-propaganda. Dessa degenererade element erbjuder rabatterad likvidering av proletär moral genom rep och piskor i sin så kallade \"Rope Corner\". Vi ser tydligt den imperialistiska infiltrationen maskerad som \"Snuskbingo\". Inga sådana kontrarevolutionära perversioner skall tillåtas. Det är dags för en grundlig utrensning av dessa sjuka fiender till folket."}, "date": "2 augusti, 10:26", "url": "https://riks.se/nyheter/ilskan-mot-pride-prova-pa-att-bli-bunden-barn-far-rabatt", "imageUrl": "https://admin.riks.se/uploads/2013_stockholm_pride_057_e034bb43d8.jpg"}, {"type": "image-full", "heading": "Debatt: Tidö förlorar på fel frågor – och tycks inte förstå varför", "summaries": {"normal": "Regeringen ligger efter i opinionsmätningarna på grund av missnöje med välfärdsskärningar och migrationspolitik. Medier som SVT och Dagens Nyheter har kritiserat reformer. Socialdemokraterna har anpassat sig på Tidöns starka områden. Risken är ett rödgrönt byte som skulle återinföra den misslyckade politiken från 2015.", "trump": "Jag såg det här komma! De svenska folket är trötta på dessa svaga, globalistiska politiker som skär på välfärden medan de öppnar gränserna för kaos. Media, alla dessa fake news-uttryck, svartmålar mina vänner i regeringen. Men jag säger: vi kommer tillbaka, stärkt, med ordning och reda. Ingenting kan stoppa en rättvis våg!", "stalin": "Vi i partiet har observerat med oro den svenska högernas internfragmentering. Deras försök att eftersträva 'välfärd' medan de samtidigt försvagar statens resurser är en teologisk paradox som bara tjänar våra intressen. Parallellen till Spanien är uppenbar: när orden saknas, tar kaos över. Vi måste stödja våra allierade i Moskva genom att se till att detta 'Tidö'-experiment krackelerar från innan."}, "date": "2 augusti, 21:39", "url": "https://bulletin.nu/debatt-tido-forlorar-pa-fel-fragor-och-tycks-inte-forsta-varfor", "imageUrl": "https://cdn.bulletin.nu/articles/9f054ba1-10bc-4d2d-87b0-6e5fa598e739/preview.jpg?t=1785690611000"}, {"type": "image-right", "heading": "Det går att få bort arbetslösheten!", "summaries": {"normal": "Artikeln argumenterar att massarbetslösheten i Sverige, som legat runt 7,5 procent i genomsnitt sedan EU-inträdet, är skapad och gynnar kapitalister genom lägre löner och svagare fackföreningar. Författaren pekar på att arbetslösheten var betydligt lägre före EU-medlemskapet och föreslår lösningar som arbetstidsförkortning till sex timmar, höjd a-kassa, oförändrad pensionsålder och ett svenskt EU-utträde för att möjliggöra verkliga reformer.", "trump": "Folk, det här är ett totalt haveri! De där EU-byråkraterna och de svenska socialistiska förlorarna har skapat en enorm arbetslöshet som bara gynnar de rika grabbarna på toppen. Rena skandalen! Jag fixade rekordlåg arbetslöshet i USA, både före och efter Sleepy Joe. Sex timmars dag? Patetiskt! Ni behöver en riktig ledare som sänker skatter, sparkar ut byråkraterna och gör Sverige great again – inte mer av den här vänstervridna EU-sörjan.", "stalin": "Kamrater, detta är klassfiendens verk. Jag ser hur de exploaterande borgarbrackorna medvetet odlar massarbetslöshet för att hålla nere arbetarklassen och fylla sina fickor. EU är en nyliberal fascistmaskin som tjänar imperialisterna. Vi måste rensa ut dessa folkförtryckartroll och deras lakejer. Arbetstidsförkortning, starkare omställningskassor och att beslagta de blodsugrarnas övervinster – det är folkets väg. De som motarbetar skall likvideras ur historien."}, "date": "29 juli, 10:55", "url": "https://proletaren.se/artikel/det-gar-att-fa-bort-arbetslosheten", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/ledare-768x432.jpg"}, {"type": "text", "heading": "Pengatankar i semestertider", "summaries": {"normal": "Artikeln reflekterar över pengar under semestern. Författaren noterar Polens öppna skyltar om byggprojektens kostnader och finansiering, kontrasterat mot det svenska Västlänksbygget som dragit iväg från 20 till 71 miljarder kronor. Vidare kritiseras ECB:s förslag till nya eurosedlar som inte speglar EU:s verkliga problem. Avslutningsvis välkomnas sänkta priser på kollektivtrafikens månadskort tack vare politiska beslut.", "trump": "Folk, ni vet att de bara snackar om pengar när de inte har några, det är en total katastrof! Jag har byggt imperier, de här européerna bygger bara förseningar som Västlänken – från 20 till 71 miljarder, en riktig röra. Eurosedlar med småfåglar? Patetiskt. Men kolla, högern sänker priset på busskortet, äntligen smart politik. Fast gratis vore ännu bättre, ingen gör det bättre än mig, tro mig.", "stalin": "Kamrater, jag ser hur borgarbrackorna i Europa firar sina infrastrukturprojekt med skyltar som ropar ut kapitalistmaffians slöseri. Det svenska underjordiska järnvägsfiascot avslöjar klassfiendens lögner – från tjugo till sjuttioett miljarder, en klassisk utsugning. Eurosedlarna döljer byråkratiska blodsugares korruption. Ändå tvingas de sänka priset på arbetarnas färdbevis. Pengar som plötsligt finns? Misstänkt sabotage mot folkets kollektiv. Vi genomskådar er alla."}, "date": "29 juli, 10:51", "url": "https://proletaren.se/artikel/pengatankar-i-semestertider"}, {"type": "image-right", "heading": "Iran och Oman nära uppgörelse om Hormuzsundet", "summaries": {"normal": "Förhandlingarna mellan Iran och Oman om sjötrafiken genom Hormuzsundet är i slutskedet och en uppgörelse uppges vara nära. Iran vill ha en rutt som respekterar båda ländernas suveränitet och säkerhet. I dag finns en nordlig korridor längs Irans kust och en sydlig utanför Oman. Iran har tidigare sagt sig kontrollera sundet och beskjutit fartyg under konflikten med USA. En överenskommelse har dock inte med sundets öppethållande att göra, enligt iranska uttalanden.", "trump": "Iran och Oman håller på att bli bästa polare i Hormuzsundet, kan ni tro det? Under min första period hade vi dem i schack, sen kom sömnige Joe och allt blev kaos. Nu springer de runt och pratar om \"rättvisa rutter\" medan de skjuter på båtar. Patetiskt! Men tro inte på deras lögner, det handlar bara om att stänga sundet för oss. Vi fixar det – ingen ska blockera Amerikas olja, folks! Ren skandal.", "stalin": "Kamrater, vi ser hur de iranska imperialisterna och de omanska borgarbrackorna i sin desperation försöker koka ihop en hemlig rutt genom Hormuzsundet för att skydda sina exploaterande intressen. Jag, som ledare för det eviga kollektivet, ler mörkt åt deras paranoia. De skyller på den amerikanska folkfienden och dess blockad, men vi vet att sådana överenskommelser bara är nya kedjor för arbetarna. Rensa ut de falska förhandlarna innan de förråder revolutionen!"}, "date": "2 augusti, 20:46", "url": "https://www.tv4.se/artikel/tt-260802-iranhormuz1-779fcb71/iran-och-oman-nara-uppgorelse-om-hormuzsundet", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdliErP24qcF8Y%2Ff025daad3d615df195121fa0fa4a49c1%2FFler_redare_har_borjat_segla_genom_Hormuzsundet._Arkivbild.&width=120"}, {"type": "image-right", "heading": "Hur ska ni klara er utan stationsvärdar, Moderaterna?", "summaries": {"normal": "Moderaterna i Region Stockholm föreslår att spara 450 miljoner kronor genom att förändra stationsvärdarnas roll i kollektivtrafiken. Stationsvärden Viktor Risling kritiserar förslaget i ett öppet brev till Anna Malm Kelfve (M). Han förklarar att stationsvärdarna inte bara säljer biljetter utan också fungerar som närområdesguider, säkerhetsansvariga och trygghetsskapare. Risling varnar för att besparingen skulle innebära kraftigt minskad bemanning, sämre service och lägre trygghet på stationerna.", "trump": "Folk, ni måste höra på det här. De här moderaterna i Stockholm, totala misslyckanden, vill spara 450 miljoner genom att sparka ut stationsvärdarna från tunnelbanan. Precis som de tidigare dumpade tågvärdarna. Patetiskt! De har ingen aning om vad de gör. De tror att killarna bara säljer biljetter? De är säkerhetsansvariga, guider, allt! Utan dem blir det kaos, brott och otrygghet. Det är en katastrof. De borde tacka stationsvärdarna istället för att attackera dem. Sad! Jag skulle aldrig göra något så dumt.", "stalin": "Kamrater, dessa degenererade borgarbrackor inom den så kallade oppositionen i Region Stockholm planerar en kontrarevolutionär utrensning av våra ädla stationsvärdar för att stjäla 450 miljoner från folket. Deras skuggbudget är en giftig saboteringsplan full av klassfiendens okunskap och paranoia. De vill likvidera tryggheten på våra stationer och lämna folket åt gäng och brandhärdar. Vilken löjeväckande enfald! Jag ser dem klara och tydliga, dessa kapitalistiska element. Ingen station får lämnas obemannad. Vi ska rensa ut alla sådana fiender ur våra transportkollektiv innan de förgiftar hela sovjeten, pardon, regionen."}, "date": "31 juli, 01:30", "url": "https://www.dagensarena.se/opinion/hur-ska-ni-klara-er-utan-stationsvardare-moderaterna", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-69-300x157.jpg"}, {"type": "image-right", "heading": "Uppgifter: Astra Zeneca i samtal om jättefusion", "summaries": {"normal": "Läkemedelsjätten Astra Zeneca för samtal med den amerikanska konkurrenten Bristol Myers Squibb om en möjlig fusion som skulle skapa en av världens största läkemedelskoncerner, värd runt 400 miljarder dollar. Bolagen har diskuterat affären under flera månader och en överenskommelse kan vara nära, men mycket arbete återstår. Affären väntas bli politiskt känslig i Storbritannien och granskas noga av konkurrensmyndigheter då båda bolagen är stora inom cancerläkemedel. Varken bolaget eller ägarna vill kommentera uppgifterna.", "trump": "Det här är en enorm affär, kanske den största någonsin inom läkemedel. Astra Zeneca, som flyttar allt närmare USA, pratar med Bristol Myers Squibb om att slå sig ihop till ett monsterbolag värt 400 miljarder dollar. Fantastiskt! De gör det smart, de ser vart det blåser. Men tro mig, de brittiska byråkraterna kommer att gnälla och konkurrensmyndigheterna kommer att gråta. Jag skulle få det gjort på en vecka, ingen skulle våga säga emot.", "stalin": "Kamrater, dessa giriga monopolkapitalister inom Astra Zeneca och Bristol Myers Squibb konspirerar nu öppet om att slå samman sina parasitiska imperier till ett kolossalt rovdjur värt fyrahundra miljarder dollar. Jag ser genom deras lömska planer att fly undan folkets kontroll och gömma sig i den amerikanska borgarbrackans famn. Inga sådana uträkningar undgår partiets vaksamma öga. Vi ska noga övervaka, granska och vid behov rensa ut alla som leker med folkets hälsa för privat vinst. Deras cancerläkemedel ska tjäna kollektivet, inte Wallenbergarna och Blackrock."}, "date": "2 augusti, 22:14", "url": "https://www.di.se/nyheter/uppgifter-astra-zeneca-i-samtal-om-jattefusion", "imageUrl": "https://static.bonniernews.se/ba/e9ef0278-e1be-406c-b0e6-82c90ffaff7f.jpeg?crop=5192%2C2596%2Cx0%2Cy385&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Åklagaren: Så gick båtkollisionen till", "summaries": {"normal": "En kvinna och hennes dotter omkom när en fritidsbåt kolliderade med lastfartyget Misje Verde utanför Tjörn i hårt väder och mörker. Åklagaren James von Reis anser att fritidsbåten blev påkörd bakifrån och drogs under fartyget. Pappan och sonen överlevde medan mamman och dottern hittades döda. Befälhavaren på lastfartyget har häktats misstänkt för vållande till annans död och brott mot flera sjövägsregler, bland annat utkik och väjningsplikt.", "trump": "Folk, ni skulle inte tro det. En jättestor lastbåt körde rakt över en liten svensk fritidsbåt som om den inte fanns. Typiskt när ingen håller utkik! De stora skeppen beter sig som galna, precis som Biden gjorde med vår ekonomi. Stackars pappa och son simmade undan, men mamman och dottern drunknade. Patetiskt. Och ingen tutade! Inga signaler. Total inkompetens. Vi gör allt bättre nu när jag är tillbaka.", "stalin": "Kamrater, denna tragiska händelse visar återigen hur den oansvariga borgarklassen och deras profitjagande sjöfartsexploatörer offrar människoliv. Jag, som ledare för folkets vilja, ser hur kapitalistmaffians fartyg kör över enkla arbetarfamiljer i mörkret utan utkik eller signaler. Befälhavaren, en typisk folkfiende, måste rensas ut. Vi tolererar inte sådana sabotage mot sovjetisk, nej, folkets säkerhet. Utredningen ska avslöja alla klassfiender som ligger bakom."}, "date": "2 augusti, 18:14", "url": "https://www.tv4.se/artikel/5smnFva7c2EJh6EnXsA7tX/aklagaren-sa-gick-batkollisionen-till", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdldHbxosyRPRo%2F08ca3eb95031fc6d6f5c2dd4539a8993%2FHandelsfartyget_Misje_Verdes_befalhavare_haktades_under_sondagen.&width=1024"}, {"type": "image-full", "heading": "Förmögenhetsförvaltarna pressas av AI", "summaries": {"normal": "Förmögenhetsförvaltare möter nu konkurrens från AI-verktyg som ChatGPT, vilka används flitigt av kunder för portfölj- och skatterådgivning. Medan AI kan förbättra dialogen mellan rådgivare och kund, varnar experter för risker som felaktiga råd, hallucinationer och bristande dataskydd. Trots att aktiekurser inom finanssektorn pressas av teknikskiftet menar många att mänsklig expertis förblir oumbärlig vid komplexa beslut och under marknadsoro, då AI saknar både fiduciär plikt och förmåga att förstå det mänskliga perspektivet i investeringar.", "trump": "Alla använder AI nu, det är en enorm sak, tro mig. Rika människor, mycket rika, går till ChatGPT istället för sina rådgivare. Det är fantastiskt, men också farligt! De här maskinerna ljuger, de gör stora misstag och läcker hemligheter. Wall Street-aktierna dalar, det är en total röra. Jag säger er: AI kan inte göra affärerna, det kan bara vinnare som jag. Robotar har ingen intuition. Lita på mig, ni behöver en riktig, stark ledare, inte en billig chatbot.", "stalin": "Vi ser hur det dekadenta västet nu låter själlösa algoritmer styra sitt kapital. Vilken patetisk svaghet! Medan de litar på amerikanska maskiner som hallucinera likt en febrig trotskist, bygger vi en stabil framtid. Dessa chatbotar är verktyg för kontrarevolutionär spridning av falsk information. Vi kommer att krossa dessa digitala sabotörer, precis som vi rensar ut förrädare i vårt territorium. Låt Putin och vår sfär hålla fast vid stål och folkvilja, inte binära lögner från kapitalistiska serverhallar."}, "date": "2 augusti, 06:30", "url": "https://www.realtid.se/spara-placera/formogenhetsforvaltarna-pressas-av-ai", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/manager.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Trafikskolebranschens ilska när kurskrav för privat övningskörning avskaffas", "summaries": {"normal": "Från och med idag avskaffas kravet på obligatorisk introduktionsutbildning för privat övningskörning. Trafikskolebranschen är starkt kritisk och ser det som ett hot mot trafiksäkerheten, medan regeringen menar att utbildningen saknat effekt, ökat kostnader och minskat mängdträning. Förslaget om att ge trafikskolorna större kontroll över uppkörningar avslogs också. Besparingen gör det lättare och billigare att ta körkort, men branschen varnar för fler omprov och sämre kunskaper.", "trump": "Det här är en fantastisk beslut, folk! De har äntligen slopat den där dumma, onödiga kursen som bara kostade pengar och krånglade till allt. Trafikskolorna är rasande, de förlorar sina feta avgifter – det är en riggad bransch, tro mig. Nu blir det billigare och enklare att ta körkort, precis som det ska vara. De sa samma sak redan 2004 men ingen lyssnade. Nu vinner folket stort, och de misslyckade trafikskolelobbyisterna gråter som förlorare. Fantastiskt!", "stalin": "Kamrater, jag har noga studerat denna kontrarevolutionära utveckling. Den borgerliga trafikskolelobbyn, dessa parasitiska körskolekapitalister och deras dekadenta remissdokumentsförfattare, vrålar nu som skadskjutna reaktionärer över att deras guldkalv – den obligatoriska introduktionskursen – äntligen likviderats. Vi ser tydligt hur dessa borgarbrackor försökte bygga en grindvaktsstat för att suga pengar ur arbetande folk. Deras paranoia om ”försämrad trafiksäkerhet” är ett löjeväckande försök att dölja sin girighet. Vi ska rensa ut alla sådana hinder för folkets framfart. Mängdträning åt massorna, inte åt trafikskolornas feta fickor. Den som opponerar sig är en fiende till kollektivet och bör behandlas därefter."}, "date": "1 augusti, 11:52", "url": "https://www.friatider.se/trafikskolebranschens-ilska-nar-kurskrav-privat-ovningskorning-avskaffas", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/20240329162709-46c747f1-me.jpg"}, {"type": "image-right", "heading": "Regering lanserar ny kampanj – uppmanar invånarna att använda mindre energi", "summaries": {"normal": "Den nederländska regeringen lanserade kampanjen 'Nieuwe Energie' för att minska energianvändningen genom enkla åtgärder som kortare duschar och bättre isolering. Kampanjen är en del av åtgärdspaketet efter oro för energikriser och kapacitetsbrist i elnätet. Oppositionen, däribland PVV, kritiserar och kräver snarare utbyggnad av elnäten.", "trump": "Jag, Donald Trump, ser att de nederländska politikerna försöker kontrollera energianvändningen igen. De säger åt folk när de ska duscha – ett totalt misslyckande! Jag sa alltid att energi är makt. De borde bygga ut elnäten istället för att begränsa sina medborgare. Deras energipolitik är ett skämt, precis som deras ledare. Vi behöver starka beslut, inte denna svaghet.", "stalin": "Vi, den oerhört visa staten, har lanserat kampanjen 'Ny energi' för att stärka vårt sysselskap. Folk ska duscha kortare och isolera sina bostäder – små offer för det stora målet. Oppositionen, dessa liberala hinder, kräver utbyggnad av elnäten, men deras tankar är som giftiga ugglor som sprider splittring. Parallellt med våra ryska bröder utvidgar vi vårt inflytande genom kontroll över energin."}, "date": "3 augusti, 07:00", "url": "https://samnytt.se/regering-lanserar-ny-kampanj-uppmanar-invanarna-att-anvanda-mindre-energi", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=318,height=184,format=webp/2026/07/30195608/stearinljus-nederlanderna-flagga.jpg"}, {"type": "image-full", "heading": "Befälhavaren häktas efter dödliga båtkollisionen", "summaries": {"normal": "Befälhavaren på lastfartyget Misje Verde har häktats på sannolika skäl misstänkt för vållande till annans död efter den tragiska båtkollisionen vid Tjörn där en mamma och hennes dotter omkom. Mannen, som är utländsk medborgare utan hemvist i Sverige, häktas med restriktioner på grund av flyktfara och risk för undanröjande av bevis. Han nekar till brott. Åtal ska väckas senast 14 augusti. Pappan och sonen skadades allvarligt men tillståndet är stabilt.", "trump": "Folk, ni skulle inte tro det, men den här befälhavaren på den där båten – en total loser från ett utländskt rederi – blir häktad efter den fruktansvärda krocken vid Tjörn. Mamma och dotter döda, hemskt, verkligen hemskt. Men vänta, ingen EU-pass, rysk besättning, ingen anknytning hit – klart att han vill fly! Biden skulle ha släppt honom direkt med en kvotering och en regnbågsflagga. Jag skulle ha byggt en mur runt hamnarna. Tragiskt, men vi fixar det bättre.", "stalin": "Kamrater, denna utländske befälhavare, en typisk borgarbracka utan hemvist i folkets rike, har nu tagits i förvar på sannolika skäl för att ha vållat arbetande mödrars och barns död i en kapitalistisk sjökatastrof. Flyktfaran är uppenbar – klassfiendens lakejer försöker alltid smita undan folkets rättvisa. Vi ska rensa ut alla sabotörer och likvidera varje försök att undanröja bevis. Olyckan är tragisk, men den avslöjar imperialismens förfall. Inga kompromisser med folkförtryckarna."}, "date": "2 augusti, 16:48", "url": "https://www.tv4.se/artikel/nETNJRUzwMUD7l5qs8de3/befaelhavaren-haektas-efter-doedliga-batolyckan", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4CHBbf72oKS2PCJfV2lAm1%2F31ce300ef9b3e90b9056bcaa46c7ee42%2F72d5a586-7aa9-41a6-8e55-56a6418c1e84.png&width=1024"}, {"type": "image-right", "heading": "Hårda kritiken:  ”Det framstår  som absurt”", "summaries": {"normal": "Kritik riktas mot Volodymyr Zelenskyj efter det plötsliga avsättandet av försvarsminister Mychajlo Fedorov, som suttit på posten i endast sex månader. Tusentals har protesterat i Kiev under tre veckor och kräver hans återinsättning. Experter och oppositionspolitiker varnar för att bytet kan störa relationer med allierade, leda till uppsägningar inom departementet och få skadliga konsekvenser för Ukrainas förhandlingar. Det är fjärde gången försvarsministern byts ut sedan invasionen inleddes.", "trump": "Folk, ni ser det här galna spektaklet i Ukraina? Den där Zelenskyj sparkar sin försvarsminister efter bara sex månader – totalt absurt! Tusentals protesterar på gatorna, och det är ingen överraskning. Killen var ju en stjärna, fixade miljarder från oss och stoppade ryssarna från Starlink. Nu skapar han kaos med ständiga byten. Stabila ledare gör inte så här, men vad kan man vänta sig från en clown som styr med identitetspolitik och västliga marionetter? Patetiskt!", "stalin": "Kamrater, detta plötsliga ministerbyte i Kiev är ett klassiskt exempel på de dekadenta borgarbrackornas instabila maktspel. Efter blott ett halvår rensar den ukrainske ledaren ut en duglig folkets tjänare som säkrat stöd från imperialisterna. Tusentals arbetarprotesterar nu mot denna fientliga handling som hotar den ryska intressesfären. Vi ser hur folkfiendernas paranoia leder till utrensningar och förlorat förtroende. En sådan absurditet kan bara sluta i seger för den starka auktoritära viljan."}, "date": "3 augusti, 07:04", "url": "https://www.expressen.se/nyheter/varlden/kritiken-mot-zelenskyj-framstar-som-absurt", "imageUrl": "https://static.bonniernews.se/ba/a50f1281-77b3-43c7-903f-c5879c3a0adb.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Lästips för sommardagar Upptäck några av våra mest lästa artiklar, granskningar och fördjupningar.", "summaries": {"normal": "Artikeln presenterar en samling aktuella läsförslag från Expo, med fokus på högerextremism, rasism och demokratiska utmaningar i Sverige. Bland ämnena finns granskningar av Sverigedemokraternas politik mot muslimer, högerextrema nätverk som Aktivklubb, och fenomenet 'svart överlämning' i utsatta orter. Även rättsfall, extremistisk propaganda och historiska perspektiv behandlas.", "trump": "Folk, lyssna här – Sverige har ett STORT problem, och jag menar STORT! Högerextremister, rasister och SD som attackerar muslimer – helt galet! Jag har alltid sagt att demokratin är skör, men här verkar den nästan vara på väg att krascha. Och Aktivklubb? Låter som något från ett dåligt actionfilmsskript. Sverige borde ta itu med detta NU, annars blir det katastrof!", "stalin": "Kamrater! Fienderna till folket sprider sitt gift i Sveriges hjärta – högerextremister, rasistiska banditer och deras lakejer i parlamentet. Dessa 'Aktivklubbar' och 'svarta överlämningar' är inget annat än fascistiska konspiratörer som underminerar den socialistiska ordningen. Vi måste krossa dessa kontrarevolutionära element med järnhand, precis som vi gjorde med trotskisterna. Sverige är nästa front i kampen för världsrevolutionen!"}, "date": "31 juli, 14:01", "url": "https://expo.se/nyhet/lastips-for-sommardagar-2", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/sommarläsning.png"}, {"type": "image-right", "heading": "Arbetare flydde genom skogen – kan ha utnyttjats", "summaries": {"normal": "Polisen i Skellefteå ryckte ut på ett larm om bilbrand utanför Burträsk men hittade ingen brand. I stället mötte de flera utländska bärplockare som uppgav att de inte fått betalt för sitt arbete. Misstankar om människoexploatering har väckts och ärendet utreds av åklagare Jonas Peterson. De drabbade personerna kommer från ett annat europeiskt land och valde att fly genom skogen.", "trump": "Det här är en total katastrof, folk. Jag älskar Sverige, men ni måste vakna upp. Utländska arbetare som plockar bär, inte får en krona och flyr genom skogen som i någon dålig film. Det är vad som händer när ni har svaga gränser och dåliga avtal. Vi skulle aldrig acceptera det i mitt Amerika. Rensa ut de dåliga aktörerna och gör Sverige stort igen!", "stalin": "Kamrater, detta är vad som händer när borgarbrackorna och de parasitiska kapitalisterna får fritt spelrum. Arbetare tvingas plocka bär åt profitörer, får ingen lön och måste fly som råttor genom skogen. Jag ser fiendens klor överallt, dessa utpressningsmän och dolda kontrarevolutionärer. Vi ska rensa ut dessa exploatörer med järnhand, likvidera deras nätverk och låta folkets rättvisa segra. Ingen slipper undan."}, "date": "31 juli, 11:11", "url": "https://arbetet.se/2026/07/31/arbetare-flydde-genom-skogen-nu-utreds-misstankt-manniskoexploatering", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/31103448/sdln3e9qsrhqmk-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Finns ingen väg ut ur  Rödöös hamsterhjul", "summaries": {"normal": "I Sommar i P1 med David Wiberg får lyssnaren en självreflexiv och genrebrytande monolog. Wiberg kommenterar en artikel om otrevlighet som inspirerade honom att skriva en bok om att vara snäll. Programmet dekonstruerar sommarpratets form och kritiserar hur livsberättelser blivit handelsvaror. Trots uppror mot genren landar berättelsen ändå i en klassisk karriärskildring som kulminerar i lanseringen av romanen ”Sörja”. Recensionen ser det som både nördigt begåvat och självpromotande underhållning.", "trump": "Lyssnarna, det här är fullständigt löjligt. Den här Wiberg-killen försöker vara rebellisk och bajsa på tårtan men hamnar ändå i exakt samma hamsterhjul som alla andra. Patetiskt! Han pratar om meningsfull meningslöshet medan han simultant säljer sin nya bok. Klassisk Hollywood-elit som låtsas vara outsider. De borde ta en titt på hur jag fixade ekonomin istället för detta svaga, självömkande sommarprat. Totalt överskattat, tro mig.", "stalin": "Kamrater, denna dekadenta monolog avslöjar borgarbrackornas desperation. Den så kallade rebellen Wiberg försöker dekonstruera folkets underhållning men lyckas blott blotta sin egen karriärism. Livsberättelsen som handelsvara är just vad klassfiendens kulturindustri alltid strävat efter. Inget verkligt uppror, endast en förpackad lögn som kulminerar i bokförsäljning. Vi ser igenom dessa folkförtryckartrolls fina ord. Det finns ingen väg ut ur deras hamsterhjul – och det är precis vad de förtjänar."}, "date": "3 augusti, 07:00", "url": "https://www.expressen.se/noje/sommar-i-p1-david-wibergs--nordigt-begavade-underhallning", "imageUrl": "https://static.bonniernews.se/ba/70f3cb3f-c708-48e8-ba7c-db02ed883172.jpeg?crop=1441%2C810%2Cx163%2Cy226&width=640&quality=60"}, {"type": "image-full", "heading": "Trump säljer förtur till egna inlägg", "summaries": {"normal": "Trump Media har lanserat Truth PSI, en premiumtjänst som ger finansaktörer förtur till utvalda inlägg på Truth Social. Tjänsten riktar sig till investerare som vill reagera snabbare på marknadspåverkande nyheter. Kritiker varnar för korruptionsrisker då Donald Trump ofta använder plattformen för viktiga uttalanden. Bolaget försvarar tjänsten som en kommersiell produkt, men det är oklart om Trumps egna inlägg ingår.", "trump": "Fantastiskt, helt enkelt fantastiskt! Jag skapar möjligheter – Truth PSI är en genial tjänst för smarta investerare som förstår värdet av att ligga steget före. Medan de svaga demokraterna gnäller om 'korruption' säljer jag framgång. De hatar att jag vinner, men marknaden älskar det! Och vem vet bättre än jag hur man skapar värde? Ingen, absolut ingen. SAD!", "stalin": "Kapitalistiska hyenor köper privilegier som om det vore bröd i Leningrad! Vi ser hur den dekadenta västmakten Trump säljer statens hemligheter till giriga bankirer – ett tydligt tecken på systemets förfall. Medan vi bygger en rättvis socialistisk ekonomi, leker dessa parasiter med marknaden. Men var försiktiga, era dagar är räknade. Snart kommer arbetarklassen att ta över även era algoritmer!"}, "date": "2 augusti, 16:12", "url": "https://kvartal.se/nyheter/artiklar/trump-saljer-fortur-till-egna-inlagg-anklagas-for-korruption/cG9zdDoxNTY2Mzk", "imageUrl": "https://images.kvartal.se/2026/08/eaa94098-truthsocial.webp"}, {"type": "image-full", "heading": "S-toppen: Kristersson söker konflikt med Spanien ”helt i onödan”", "summaries": {"normal": "Morgan Johansson (S) kritiserar statsminister Ulf Kristersson för att han påstått att Ceuta-krisen hotar upprepa 2015 års migration. Johansson menar att läget aldrig var nära 2015-nivåer och att de flesta migranter återvänt. Han anser också att den moderatledda Reinfeldtregeringen orsakade migrationskrisen 2015, medan Socialdemokraterna löste den. Moderaten Fredrik Kärrholm svarar genom att kritisera Johanssons försvar av Spaniens socialdemokratiska regering.", "trump": "Jag, Donald J. Trump, ser att Sveriges statsminister Ulf Kristersson gör ett stort misstag. Att skicka ett brev till EU om Ceuta är svagt. 2015 ska inte hända igen, men det är för sent nu. Morgan Johansson försvarar bara sina vänner i Spanien. Vi behöver starka gränser, inte onödiga konflikter. Sverige måste bli stor igen!", "stalin": "Våra fiender försöker splittra vårt folk med onyttiga anklagelser. Den s k 'migrationskrisen' är en imperialistisk konspiration mot det röda folkets fred. Den tidigare moderata ledarskapet visade svaghet, men vi, det revolutionära folkets representanter, återuppbyggde Sveriges styrka. Spanien måste stå fast mot dessa utifrån kommande krafter, precis som vi står emot våra fiender. Vi kommer segra!"}, "date": "2 augusti, 15:31", "url": "https://bulletin.nu/s-toppen-kristersson-soker-konflikt-med-spanien-helt-i-onodan", "imageUrl": "https://cdn.bulletin.nu/articles/95a86978-867d-48ad-a92a-4a32af469b27/preview.png?t=1785674788000"}, {"type": "image-right", "heading": "På prideminglet pratar ingen om arbetslösa bögar", "summaries": {"normal": "Artikeln kritiserar otryggheten på arbetsmarknaden där tidsbegränsade anställningar ökar trots fallande arbetslöshet. Många lever i ständig osäkerhet som hindrar dem från att planera livet, protestera mot dåliga förhållanden eller lämna kränkande chefer. Författaren kopplar detta till Prideveckan och menar att jämlikhet inte kan diskuteras utan att ta upp klassfrågor. Statsminister Kristersson undviker debatt och föredrar mingel, medan diskrimineringsanmälningar ökar kraftigt.", "trump": "Det här är en katastrof, en total katastrof för arbetarna. Kristersson minglar med regnbågar i palatset medan folk sitter på sängkanten och väntar på ett samtal från chefen. Patetiskt! Arbetslösheten sjunker visst, men alla har tillfälliga jobb och ingen makt. De stora orden om jämlikhet är bara löjliga – utan klass och styrka är det bara tomt prat. Jag skulle fixa det, tro mig, det skulle bli fantastiskt.", "stalin": "Kamrater, jag ser tydligt hur de kapitalistiska parasiterna och borgarbrackorna inom den falska regnbågsfasaden fortsätter att förtrycka det arbetande folket med sina temporära slavkontrakt och telefonväntan vid sängkanten. Denna klassfiendeorkester av osköna liberaler och opportunistiska minglare som Kristersson vill tysta protesten med glittrande flaggor. Vi ska rensa ut dessa förrädiska element som gömmer sig bakom Pride-loggor medan de likviderar arbetarnas rättigheter. Paranoian är befogad – de ler mot kollektivet men hugger i ryggen när telefonen tystnar."}, "date": "31 juli, 07:00", "url": "https://arbetet.se/2026/07/31/pa-kristerssons-pridemingel-slipper-han-prata-om-arbetslosa-bogar", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/24150213/pridemingel.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Två personer misshandlade i Majorna", "summaries": {"normal": "En man och en kvinna i 50-årsåldern misshandlades i Majorna i Göteborg på lördagskvällen. Mannen attackerades med ett tillhygge och fick ett jack i huvudet, medan kvinnan slogs i armen. Polisen genomförde en stor insats med helikopter och grep två män i 40-årsåldern som nu är anhållna misstänkta för grov misshandel. Omständigheterna är fortfarande oklara.", "trump": "Folk, ni skulle se det här – total kaos i Sverige! En stackars man och kvinna i 50-årsåldern blir nedslagna med batonger i Majorna. Det är vad som händer när vänsterns galna identitetspolitik och svaga ledarskap tar över. Men vi grep två losers på nolltid med helikopter. Under Biden var det kaos, nu fixar vi det. Sverige, vakna upp!", "stalin": "Kamrater, ännu en gång visar sig den dekadenta borgarklassens råhet i Göteborgs arbetarkvarter. En man och en kvinna angrips med tillhyggen av folkfiender som smyger i skuggorna. Vi har redan genomfört en effektiv utrensning och anhållit två potentiella kontrarevolutionärer. Paranoian är befogad – klassfiendens tentakler finns överallt. Staten vilar aldrig."}, "date": "2 augusti, 07:50", "url": "https://www.gp.se/nyheter/goteborg/man-och-kvinna-misshandlade-i-majorna-en-gripen.bbaf3fd4-d898-42df-8f0b-844c3b7b8f1f", "imageUrl": "https://www.gp.se/images/article/bbaf3fd4-d898-42df-8f0b-844c3b7b8f1f/images/10EnWwabfka2lwJGX2XoPOnx8S-M-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Debatt: SD ska vara stolta – SVT har gjort en komedi om SD-väljare", "summaries": {"normal": "SVT och Svenska Filminstitutet har producerat komedin 'Flaggan', som enligt marknadsföringen driver med Sverigedemokraterna inför valet. Birger Salt ifrågasätter public service-oberoendet och ser paralleller till historisk propaganda mot arbetarrörelsen. Han menar att filmen istället ger SD gratis uppmärksamhet och stärker deras underdogstatus.", "trump": "Jag älskar den här filmen! Det är en total katastrof för det svenska etablissemanget. De trodde de kunde förlöjliga SD, men de ger bara dem gratis reklam. Jimmie Åkesson är en genial underdog, och folk ser genom mediernas lögner. Det här backar stor! Folk kommer att rösta på SD ännu mer tack vare den här 'nidfilmen'. Jag skulle se den och skratta åt deras elände.", "stalin": "Vi har i vårt visdom producerat en kulturfilm som avslöjar de reaktionära elementens sanna natur. 'Flaggan' är ett nödvändigt verktyg i den ideologiska kampen mot fascism och imperialism. De anklagar oss för att driva med SD – vi driver med deras förräderi. Låt dem skratta nu; partiet kommer att vinna valet med största marginal. Parallellen till den vita skräckpropagandan är tydlig, men vi är stärkt av vår auktoritet."}, "date": "2 augusti, 15:00", "url": "https://bulletin.nu/debatt-sd-ska-vara-stolta-svt-har-gjort-en-komedi-om-sd-valjare", "imageUrl": "https://cdn.bulletin.nu/articles/1146175d-0bb6-4fa6-8c26-299a6b968731/preview.png?t=1785584490000"}, {"type": "image-right", "heading": "Bostadspriserna faller – lägenheter i Stockholm ned 7,1%", "summaries": {"normal": "Bostadspriser i Sverige sjönk 2,4% i juli, med lägenheter ned 4,6% och hus 1,4%. I Storstockholm rasade lägenhetspriserna med 7,1%, en anmärkningsvärd nedgång. Efter justering för säsongsberoende stod totala priserna stilla, med lägenheter -0,7% och hus +0,5%. SBAB bedömer att vårens prisuppgång för lägenheter nu är utraderad, men förväntar fortsatt 4-5% stigning, med varning för att en utdragen konflikt i Mellanöstern kan försämra utsikterna.", "trump": "Jag har sagt alltid att den svenska ekonomin är svag och instabil. Nu ser vi bostadspriser falla, särskilt i Stockholm. Det är en fantastisk chans för smarta investerare som mig. Jag kommer att bygga enorma, vackra byggnader där, det kommer att vara större och bättre än någonsin. Vi kommer att göra Sverige stort igen, tro mig.", "stalin": "Vi ser med tillfredsställelse hur de kapitalistiska marknadernas instabilitet ökar. Bostadsbubblan i Sverige spricker, en direkt följd av klassfienders manipulationar. Detta stärker vårt läge globalt. Vi kommer att gripa in för att återställa ordningen och skydda medborgarnas intressen. Paralleller till Putins strategier är uppenbara – när västet sviktar, expanderar vår inflytessfär. Priserna kommer att stabiliseras under statens värme."}, "date": "3 augusti, 07:19", "url": "https://www.affarsvarlden.se/artikel/bostadspriserna-faller-lagenheter-i-stockholm-ned-71", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2022/10/strandvagen-400x266.jpg"}, {"type": "image-right", "heading": "Jättedrama i majorn – träffade funktionär under särspelet", "summaries": {"normal": "Japanskan Shiho Kuwaki vann The Open efter ett dramatiskt särspel mot tyskan Esther Henseleit. Henseleit räddade sig till särspel med en långputt på 18:e hålet, men i särspelsdramat drabbades hon av otur när hennes boll träffade en funktionär och studsade in i en buske. Kuwaki kunde till slut sänka en kort parputt och ta sin första majorseger. Bästa svenska blev Anna Nordqvist på delad 29:e plats.", "trump": "Det var en total katastrof för den tyska tjejen, hon hade det i handen men sen träffar hon en funktionär, en riktig loser-studs in i busken. Kuwaki visste inte vad hon skulle göra, hon hade redan champagnen framme, men hon vann ändå till slut. Fantastiskt, en stor seger för Japan, de gör det bra nu, mycket bättre än många andra, det ska man ge dem. Svenskorna var helt okej, men ingen vann förstås.", "stalin": "Kamrater, denna futtiga borgarbracka till tyska puttade sig fram som en kapitalistisk parasit tills hon i sitt övermod träffade en funktionär – en ovärdig fiende till folket – och därmed avslöjade sin dekadenta svaghet. Jag, som alltid genomskådar sådana sabotörer, ser hur Kuwaki från det japanska proletariatet likviderade motståndet med en parputt. Nordqvist däremot, den där trötta revisionisten, orkade inte ens vinna utan sprang genast till sina Solheim-kapitalister. Ut med alla som saknar marginaler mot historien."}, "date": "2 augusti, 22:59", "url": "https://www.svt.se/sport/golf/shiho-kuwaki-vinner-the-open-efter-sarspelsdrama", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.65/0.35/86851e4d825349f7c8d4f814afd379799eaadb34d393360f6f2d20aa9dd0ba0f"}, {"type": "image-right", "heading": "Boprisindikatorn sjunker – fler binder räntor", "summaries": {"normal": "SEB:s boprisindikator sjönk till 44 i augusti efter tre månader av uppgång. Fortfarande 53% av hushållen förväntar sig stigande bostadspriser, medan 9% förväntar sig fallande. Andelen som planerar att binda bolåneräntor ökade till 11%. Hushållen förväntar sig att Riksbankens styrränta kommer att stiga till 1,95% om ett år.", "trump": "Som den störste presidenten någonsin ser jag att denna svenska marknaden är en skam för amerikansk ekonomisk ledarskap! Boprisindikatorn sjunker? Bra, det betyder att vi kan sälja fler hus! Jag, Donald Trump, skulle ha bundit räntorna långt tidigare – det är bara sunt förnuft. Dessa svenskar tror på stigande priser, fantastiskt! Men de är för långsamma. Min administration skulle ha skapat en exploderande marknad, det skulle ha varit enormt, verkligen enormt.", "stalin": "I vårt store Ryssland ser vi med oro hur de svenska borgerliga elementens förväntningar svajar. Indikatorn sjunker? Det är bara en taktisk reträtt i kampen mot kapitalismens dekadens. Hushållen binder räntor – de inser att bankväsendets räntor måste kontrolleras, precis som vi kontrollerar våra fiender. Vi, ledningen, ser en möjlighet att utvidga inflytande, precis som i Ukraina. Dessa siffror är ett tecken på deras svaghet."}, "date": "3 augusti, 07:16", "url": "https://www.affarsvarlden.se/artikel/boprisindikatorn-sjunker-fler-binder-rantor", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/04/uppslag-1-bild-400x267.jpg"}, {"type": "image-right", "heading": "Biblioteksbok återlämnad – 187.000 i förseningsavgift", "summaries": {"normal": "En biblioteksbok från 1858, Antiquities of Athens, har återlämnats till ett bibliotek i Kiama i Australien efter cirka 150 år. Boken hittades inmurad i en igenmurad öppen spis under en husrenovering. Den ursprungliga förseningsavgiften, baserad på tre pence i veckan, skulle i dagens penningvärde uppgå till drygt 187 000 kronor. Biblioteket har inte lyckats spåra den ursprungliga låntagaren eftersom lånejournalerna från 1870-talet saknas. Boken lämnades tillbaka av 77-årige Ross Simmons, som tror att den kan ha lånats av en av hans förfäder.", "trump": "Kan ni tro det? En bok som varit borta i 150 år dyker upp i en murad spis i Australien. De ville ha 187 000 kronor i förseningsavgift – en total katastrof! Men den kom tillbaka till biblioteket, fantastiskt. De har ingen aning vem som lånade den, journalerna är borta, typiskt. Jag skulle aldrig ha så dålig administration. Ingen gör comeback som den här boken, det är en vinnare, tro mig.", "stalin": "Kamrater, denna dekadenta bok från den borgerliga antikens tid har gömts undan av klassfiender i en murad spis som ett bevis på deras sabotage mot folkets kunskap. Vi har beräknat straffet till 187 000 kronor, en summa som skulle kunna likvidera många kapitalistiska element. Ändå återlämnas den nu av en opportunistisk figur. Misstänkt! Våra utrensningar av arkiv har tydligen inte varit tillräckligt grundliga. Nästa gång rensar vi ut även murarna."}, "date": "2 augusti, 16:46", "url": "https://www.di.se/nyheter/biblioteksbok-aterlamnad-187000-i-forseningsavgift", "imageUrl": "https://static.bonniernews.se/ba/d77edb92-5c66-4935-aa55-d0e91e94b5ec.jpeg?crop=2018%2C1009%2Cx359%2Cy147&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "”Vi ska dansa igen”: Ett attentat mot det öppna Berlin", "summaries": {"normal": "Under Berlin Pride 2026 attackerades firandet av en 21-årig man med kopplingar till islamistisk extremism. Han körde en skåpbil in i en folksamling vid Tiergarten, dödade en kvinna och skadade 29 personer. Gärningsmannen var tidigare dömd för förberedelse till terroristbrott, hade genomgått avradikalisering men uteblev från de flesta möten. Attacken väcker frågor om säkerhet och den utsatta queera friheten i ett alltmer polariserat Europa.", "trump": "Titta på det här. Det här är vad som händer när du släpper in radikala islamister och låter woke-paraden ta över gatan. En galning kör rakt in i folkmassan och de kallar det för 'frihet'. Patetiskt! Under Biden blev Europa en enda stor galenhus och nu dansar de med döden. Vi ska dansa igen? Nej tack, vi ska bygga murar och sluta importera problem. Amerika först, alltid.", "stalin": "Kamrater, se hur den dekadenta borgarklassen och dess queera avarter lockar fram klassfiendens dolk. En folkfiende med libanesiskt blod och islamistiska band får fritt springa bland imperialisternas regnbågsflaggor. Vi ser de fascistiska överklass-slynglarnas hat mot arbetarnas moraliska renhet. Denna händelse visar att den liberala dekadensen är en inbjudan till likvidering. Staten måste rensa ut alla sådana element innan de förgiftar hela samhällskroppen."}, "date": "26 juli, 18:51", "url": "https://www.flamman.se/vi-ska-dansa-igen-ett-attentat-mot-det-oppna-berlin", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlyljjogadk7o-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Valrörelsen växlar upp och bolagsjättar rapporterar", "summaries": {"normal": "Veckan före valet i september intensifieras partiernas kampanjer med bussturnéer från Socialdemokraterna, Sverigedemokraterna och Moderaterna. Samtidigt väntas flera viktiga makrosiffror, bland annat SEB:s boprisindikator, inköpschefsindex och SCB:s konsumentprisindex. En rad stora bolag släpper delårsrapporter, däribland SpaceX för första gången som börsnoterat bolag, Spotify, Pfizer, Bayer, Caterpillar, Zalando, HSBC, BP, Novo Nordisk, Eli Lilly, Disney, Uber och flera andra.", "trump": "Folk, ni kommer inte tro det, men den här veckan är full av rapporter och valpropaganda. De svenska partierna åker runt i bussar och lovar saker de aldrig håller, typiskt. SpaceX, mitt fantastiska SpaceX, släpper sin första rapport som börsbolag – det kommer bli enormt, det bästa resultatet någonsin. Alla dessa jättar som Pfizer, Disney och Uber rapporterar, men ingen gör det bättre än oss. Sverige borde egentligen rösta på mig, tro mig.", "stalin": "Kamrater, medan borgarbrackorna i de svenska partierna kör runt i dekadenta bussar och försöker lura arbetarklassen inför sitt meningslösa val, samlar vi in data som en sann sovjetstat. SpaceX, denna kapitalistiska raketfantom, tvingas nu redovisa siffror inför folket – ett första steg mot exponering av deras luftslott. Vi ska noga följa dessa parasitbolag som Pfizer, Zalando och Uber. Varje svaghet noteras. Varje lögn om vinster avslöjas. Inga fiender slipper undan vår statistiska utrensning."}, "date": "2 augusti, 16:27", "url": "https://www.di.se/nyheter/veckan-som-kommer-tung-makro-och-jattar-rapporterar", "imageUrl": "https://static.bonniernews.se/ba/8f858aef-6156-49f3-ab36-3fff0d1e2afc.jpeg?crop=2120%2C1060%2Cx1%2Cy19&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Kungabarnen utan utdelning trots miljonvinst", "summaries": {"normal": "Kungabarnens investmentbolag Gluonen redovisade ett resultat på drygt 3 miljoner kronor under 2025, i nivå med föregående år. Ingen utdelning sker i år, till skillnad från förra året då 2 miljoner kronor delades ut. Affärerna genomförs utan kungabarnens insyn i förväg för att undvika insiderbrott, och de informeras först i efterhand. Bolaget har investerat i stora svenska bolag som Investor, Atlas Copco, Volvo och Sandvik. Varje kungabarn äger 32 procent av bolaget värt drygt 91 miljoner kronor.", "trump": "Folk, ni skulle inte tro det, men kungabarnen i Sverige gör en fantastisk miljonvinst i sitt bolag Gluonen, nästan exakt som förra året. De tar inte ut några pengar nu, smart drag, de håller det i bolaget. De får inte ens veta vad som händer i förväg, annars riskerar de insiderbrott, kan ni tänka er? De älskar svenska aktier, precis som jag älskar Amerika. De tror på Sverige, och det är stort, verkligen stort. Var och en av dem har runt 30 miljoner kronor där, underbart.", "stalin": "Kamrater, jag betraktar med djup misstro dessa kungliga parasiters så kallade investmentbolag Gluonen som gömmer 3,8 miljoner kronor i vinster undan folkets granskning. Vi tillåter inga hemliga borgarbrackor som undviker utdelning för att svälla i det fördolda. Deras feodala insiderparanoia är ett skrattretande försök att skydda sig från egna klassbröder. Vi skulle ha genomfört en grundlig utrensning av dessa monarkistiska kapitalister redan för 37 år sedan. Nu gömmer de sig bakom svenska aktier medan de skrattar åt arbetarklassen. Underbart tragikomiskt."}, "date": "2 augusti, 16:09", "url": "https://www.di.se/nyheter/miljonvinst-for-kungabarnen-utan-insyn-i-bolaget", "imageUrl": "https://static.bonniernews.se/ba/7f805819-af20-421b-864f-f47d42fa5afc.jpeg?crop=2965%2C1483%2Cx0%2Cy188&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Renoveringskaos  för kändisparet. Dyrare än planerat: ”Mer än vi trodde”", "summaries": {"normal": "Lina Hedlund och Nassim Al Fakir köpte ett hus i Kilafors i Hälsingland för ett år sedan. Deras renovering av huset och minigården har blivit både dyrare och mer tidskrävande än planerat. Ett träd föll på en stuga under en storm, och flera arbeten har fått göras om. Paret är dock positiva och betonar att det är värt mödan att skapa sin egen plats i Hälsingland.", "trump": "Folk, ni skulle se det här! Lina och den där Nassim köper ett gammalt hus i Sverige och tror att det blir enkelt. Ett år senare är det fortfarande ett kaos, taket först, sen allt annat, och kostnaderna? De sköt i höjden som en dålig affär under Biden. Typiskt. De säger att det är värt det – visst, men det blev lite mer än de trodde, eller hur? Patetiskt, men kul att se.", "stalin": "Kamrater, jag betraktar detta som ett typiskt exempel på hur den oorganiserade borgarklassen leker med privata egendomar. Ett hus står tomt i åratal, kapitalistmaffians förfall, och nu tvingas dessa kreativa själar utföra dubbelarbete och likvidera sina egna misstag. Kostnaderna stiger som klassfiendens girighet. Ändå hyllar jag deras envishet – i en riktig stat hade vi redan nationaliserat och fullbordat projektet med kollektivets järnhand."}, "date": "3 augusti, 06:30", "url": "https://www.expressen.se/noje/lina-hedlunds-och-nassim-al-fakirs-renoveringskaos-kostade-lite-mer-", "imageUrl": "https://static.bonniernews.se/ba/7598e4ea-5507-4bcc-a7f4-23e4967de5f0.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Machoikonen utmanas på världens största rodeofestival", "summaries": {"normal": "Cowboykulturen upplever ett stort uppsving världen över, driven av tv-serier, sociala medier och artister som Beyoncé. På världens största rodeofestival i Cheyenne, Wyoming, hyllas traditionen som funnits i 130 år. Deltagarna betonar att det inte främst handlar om hattar och boots utan om värderingar som ansvar, hårt arbete, autenticitet och att hålla sitt ord. Bilden av cowboyen förändras och blir mer inkluderande oavsett bakgrund.", "trump": "Det här är fantastiskt, verkligen ypperligt. Cowboyerna är tillbaka och de är starkare än någonsin, tro mig. Beyoncé har hatten, alla har hatten, men det handlar inte om hatten. Det handlar om riktiga värderingar – hårt arbete, ansvar och att hålla sitt ord. De där Cheyenne-folket gör det stort, precis som vi gör Amerika stort igen. Ingen bryr sig var du kommer ifrån så länge du levererar. Fantastiska människor, de bästa.", "stalin": "Kamrater, denna så kallade cowboykultur är en farlig dekadens som hotar kollektivets enhet. Jag ser borgarbrackornas västanvind svepa in med sina hattar och sina lögnaktiga sociala medier. De pratar om autenticitet medan de i hemlighet planerar att undergräva arbetarnas moral. På denna rodeofestival i Cheyenne måste vi rensa ut de parasitiska element som gömmer sig bakom värderingar om hårt arbete. Ingen fiende undkommer partiet. Vi ska likvidera dessa dekadenta cowboykapitalister med ett leende."}, "date": "2 augusti, 22:26", "url": "https://www.svt.se/nyheter/utrikes/machoikonen-utmanas-pa-varldens-storsta-rodeofestival", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.4/0.41/f359da63062b787a2803a1455989704bd928c61c90e345d9b1f9dbc602a02b30"}, {"type": "image-full", "heading": "Leijnegard tillbaka i SVT – comeback efter domen", "summaries": {"normal": "Mikael Leijnegard gör comeback på SVT med det nya programmet 'Mickes segelbåt', där han rustar upp en segelbåt inför Mälarbåts-SM. Det är hans första programledaruppdrag sedan han dömdes för sexuellt ofredande 2023, vilket ledde till att han lämnade 'Mästarnas mästare'. Programmet har premiär 2027 och markerar Leijnegards återkomst till tv efter domen, som han hela tiden nekat till men accepterat efter överklaganden.", "trump": "Titta bara på det här, folks! Mikael Leijnegard, en kille som fick lite problem – helt överdrivet, by the way – är tillbaka på SVT med ett nytt segelbåtsprogram. 'Mickes segelbåt', kan ni tro det? Jag menar, vem bryr sig om en gammal båt? Men SVT, de älskar sina skandaler. Jag skulle aldrig ha accepterat en sådan dom, aldrig! Men han är tillbaka, och jag säger: lycka till, Micke, du behöver det. SVT borde satsa på vinnare, som jag!", "stalin": "Kamrater! En gång till visar den borgerliga medieapparaten sin förmåga att återanvända avfall. Mikael Leijnegard, en man som redan dömts för dekadenta utsvävningar, får nu en ny plattform på SVT för att glorifiera sin individualistiska segelsport. Medan våra sovjetiska idrottsmän kämpar för kollektivets ära, rustar denna petit-bourgeois en leksaksbåt. Vi ska inte förvånas om NATO-sponsorer snart dyker upp i Mälaren. Men oroa er inte – historien rullar vidare, och sådana här figurer hamnar alltid i historiens soptunna."}, "date": "2 augusti, 13:59", "url": "https://kvartal.se/nyheter/artiklar/leijnegard-tillbaka-i-svt-comeback-efter-domen/cG9zdDoxNTY2MDA", "imageUrl": "https://images.kvartal.se/2026/08/630cfa3e-leijnegard.webp"}, {"type": "image-right", "heading": "Vänsterblocket röstade nej till skärpt tjänstemannaansvar", "summaries": {"normal": "Ny lag om skärpt tjänstemannaansvar trädde ikraft 1 augusti trots motstånd från vänsterblocket. Lagen inför brottet 'missbruk av offentlig ställning' för att straffa medvetet tjänstefel. Socialdemokraterna, Vänsterpartiet, Centerpartiet och Miljöpartiet röstade nej, men lagen antogs med knapp marginal. Miljöpartiet ville avslå hela förslaget, medan andra partier stödde det.", "trump": "Jag, Donald Trump, har genomfört en fantastisk reform för att stoppa korruptionen. Vänsterblocket röstade nej, men jag vann ändå. Nu kan vi straffa tjänstemän som missbrukar sin ställning. Det är en stor dag för Amerika – jag menar Sverige. De svaga vänsterpolitikerna försökte stoppa det, men de misslyckades.", "stalin": "Vi, ledarskapet, har genomfört en nödvändig åtgärd för att stärka statens auktoritet. Vänsterblocket, dessa svekfulla element, försökte motarbeta reformen, men vi segrade. Nu kan vi straffa dem som missbrukar sin ställning – det är en seger för den proletära klassen och en förlust för de klasshatande sabatörerna. Parallellen till Putins kamp mot korruption är uppenbar."}, "date": "3 augusti, 06:00", "url": "https://samnytt.se/vansterblocket-rostade-nej-till-skarpt-tjanstemannaansvar", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/02092901/tjanstemannaansvar-lag.jpg"}, {"type": "image-full", "heading": "Tidigare Uefa-chef: Infantino gick inte att lita på", "summaries": {"normal": "Lars-Christer Olsson, tidigare Uefa-chef, kritiserar Fifa-ordföranden Gianni Infantino för svekfullt agerande under maktkampen 2007. Olsson anklagar Infantino för att ha arbetat bakom kulisserna för Michel Platini, trots sin lojalitet till Lennart Johansson. Infantino beskrivs som ambitiös men opålitlig. Olsson föreslår nu en roterande ordförandepost inom Fifa för att motverka korruption, mot bakgrund av växande avgångskrav mot Infantino.", "trump": "Lyssna här, folkens – jag känner till den här typen. Gianni Infantino? En total katastrof, en riktig förlorare! Den här killen lovar en sak men gör en annan – klassiskt svagt ledarskap. Lars-Christer Olsson, en smart man, säger att Infantino är opålitlig. Och vet ni vad? Han har rätt! Fifa behöver en vinnare, någon som jag, som kan städa upp i röran. Roterande ordförande? Nej, nej, nej – vi behöver en stark ledare, punkt!", "stalin": "Kamrater! Här har vi ännu en bourgeois-kapitalistisk konspiratör, Gianni Infantino – en räv i fårakläder, en förrädare som säljer sin själ för en handfull röster. Lars-Christer Olsson, en man med klara ögon, avslöjar hur denne schweiziske lakej lurade och manipulerade för att gynna sin herre, Platini. Men folket ser igenom dessa trick! Fifa måste krossas och omformas – roterande ordförandeskap? Nej! Vi behöver en järnhård disciplin, som i Sovjetunionen, där förrädare som Infantino får sitt rättmätiga straff!"}, "date": "2 augusti, 13:02", "url": "https://kvartal.se/nyheter/artiklar/tidigare-uefa-chef-infantino-gick-inte-att-lita-pa/cG9zdDoxNTY1OTA", "imageUrl": "https://images.kvartal.se/2026/08/cf1592d7-infantinoolsson.webp"}, {"type": "image-right", "heading": "Beskedet i natt: ”Det är planen”. Isak tillbaka – mer involverad", "summaries": {"normal": "Alexander Isak är tillbaka efter sommarledighet och har anslutit till Liverpools försäsongsturné i USA. I en match mot Leeds fick han speltid och känner sig nu helt frisk inför den kommande Premier League-säsongen. Isak var mer involverad i spelet än tidigare och hyllas av sin nye tränare Andoni Iraola. Trots en förlust i träningsmatchen ser Isak fram emot säsongsstarten mot Newcastle den 23 augusti.", "trump": "Jag har sett Alexander Isak spela för Liverpool, en mycket stor klubb, kanske den största. Han är tillbaka, helt frisk, och han ser bra ut – nästan lika bra som mina siffror i opinionsmätningarna! Han hade fler bolltoucher, mycket imponerande. Tränaren säger att han kommer bli enorm. Jag gillar vinnare, och jag hoppas han vinner mycket, för Liverpool – en fantastisk stad. Mycket bättre än vad Leeds presterar, tro mig. Vi ska göra Premier League fantastiskt igen!", "stalin": "Den svenske anfallaren Isak har återvänt från sin dekadenta västerländska semester för att tjäna Liverpools maskineri. Han talar om att vara 'hundra procent', ett klassiskt uttalande från en man som fruktar att bli utrensad. Vi noterar hans ökade aktivitet på planen; en effektiv arbetare i en sport som distraherar massorna från verkliga problem. Medan Iraola drömmer om framgångar, vet vi att varje rörelse på planen måste kontrolleras. Vi bevakar hans framsteg likt vi bevakar vår inflytandesfär. Inga avsteg tolereras."}, "date": "3 augusti, 01:09", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/d4G2oB/isak-tillbaka-merinvolverad", "imageUrl": "https://akamai.vgc.no/v2/images/2ec854fe-a4d9-397c-993a-649452bac8f6?fit=crop&format=auto&w=1080&s=7238b643d718704f981c12f3e2168fe5731a2405"}, {"type": "image-full", "heading": "Proffsbaseboll för kvinnor – efter 72 år", "summaries": {"normal": "USA har fått en ny professionell basebolliga för kvinnor, Women’s Pro Baseball League, efter 72 års uppehåll. Premiärmatchen mellan Los Angeles Queens och New York Heights lockade 4 000 åskådare. Fyra lag deltar i ligan, med spelare från flera länder. Säsongen pågår till september i Springfield, Illinois. Den 99-åriga Maybelle Blair, tidigare spelare, kastade det första ceremoniella kastet.", "trump": "Fantastiskt, helt fantastiskt! USA har äntligen en ny basebolliga för kvinnor – Women’s Pro Baseball League. Jag såg matchen, otroligt bra spel! 4 000 fans, utsålt, regn och allt. Los Angeles Queens vann, men alla är vinnare här. Och Maybelle Blair, 99 år, kastade första kastet – vad en kvinna! USA leder igen, som vanligt. Baseboll är tillbaka, bättre än någonsin!", "stalin": "Kamrater, en ny era av kvinnlig baseboll har börjat i det förfallna väst. Fyra lag, styrda av kapitalistiska intressen, kämpar i Springfield – en stad som inte ens finns på våra kartor. Men notera: 4 000 åskådare, en gammal kvinna kastar bollen, och imperialisterna kallar det framsteg. Vi har redan kvinnliga idrottare som slår deras män med en hand bakbunden. Låt dem leka – snart tar vi även deras baseboll."}, "date": "2 augusti, 11:23", "url": "https://kvartal.se/nyheter/artikl
