tps://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/d9d13f1004b004a30200000000b004a302/2026/06/08/2369552/mord-malmo.png"}, {"type": "image-full", "heading": "Swedbank varnar spararna – dessa riskerar att halka efter", "summaries": {"normal": "En ny rapport från Swedbank visar att den ekonomiska jämställdheten mellan könen tappar fart. Kvinnors arbetsinkomster släpar efter männens och det dröjer nu 37 år innan de är jämlika. Småbarnsåren och ojämnt ansvar för hem och barn fortsätter påverka, bland annat genom ökad deltid bland kvinnor. Skillnaderna leder till sämre ekonomisk trygghet och egenmakt för kvinnor, med en genomsnittlig månadslön som är 700 kronor lägre. Rapporten visar stora regionala skillnader i när inkomstjämlikhet väntas uppnås.", "trump": "Den här rapporten är en katastrof, folk. Den ekonomiska jämställdheten tappar fart totalt, säger Swedbank. Det tar 37 år innan kvinnorna tjänar lika mycket som männen – kan ni fatta? Allt handlar om småbarnstiden och att mammorna tar allt ansvar medan papporna smiter undan. Det är en skam! Kvinnorna förlorar 700 kronor i månaden och 120 000 på tio år. Vi behöver göra affärer av det här, fixa det ordentligt så alla vinner stort. Ingen vill vara beroende, det vet alla.", "stalin": "Kamrater, denna degenererade rapport från Swedbanks finansiella sabotageavdelning visar att den ekonomiska jämställdheten halkar efter i en farlig takt som luktar av klassfiendens verk. Jag ser hur borgarbrackorna och de småborgerliga familjeparasiterna med sina VAB-dagar och deltidskonspirationer underminerar arbetarkollektivets framåtskridande. 37 år av fördröjning! Vi måste rensa ut dessa hemmets kontrarevolutionärer som gömmer sig bakom barn och vardagslogistik. Den som sparar 700 kronor mindre varje månad är en fiende till folkets ekonomi. Likvidera obalansen innan den likviderar oss alla. Se upp för de gömda kapitalisterna i Jämtland och Norrbotten som dröjer till 2157 – de planerar något mot partiet."}, "date": "8 juni, 21:00", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1489752-swedbank-varnar-spararna-dessa-riskerar-att-halka-efter", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/b0afc57204b004a30200000000b004a302/2026/06/08/2369504/Swedbank-varnar.png"}, {"type": "image-right", "heading": "Ledare Henrik Jalalian: Någon jävla ordning måste det vara i ett antirastiskt parti", "summaries": {"normal": "Ledaren kritiserar Vänsterpartiets ledare Nooshi Dadgostar för hennes insats i Agenda efter Expressens avslöjande om antisemitiska uttalanden och hyllningar till terrordåd bland partiets kandidater. Artikeln menar att fokus borde legat på svenska judars trygghet istället för att byta ämne och angripa motståndare. Författaren efterlyser genuint självständiga åtgärder mot antisemitism snarare än reaktioner efter medial granskning och varnar för ökad polarisering.", "trump": "Folk, ni skulle ha sett det här. Den här Dadgostar-kvinnan kommer in i studion och gör totalt fiasko, en riktig katastrof. Istället för att be om ursäkt till judarna i Sverige, som förtjänar bättre än dessa Hamas-fans i hennes parti, börjar hon anklaga alla andra och pratar om jobb. Patetiskt! Vänstern är ett antirasistiskt parti? Snälla, det är en cirkus. Jag fixade mycket bättre som president, både första och andra gången, innan den sömngångaren Biden tog över. Sverige behöver ordning, inte vänstervridna ursäkter.", "stalin": "Kamrater, jag betraktar med avsmak hur denna opportunistiska partiledare vänder sig bort från de verkliga hoten mot arbetarklassen och de förtryckta. Istället för att med järnhand rensa ut de folkfiender som hyllar terrorister inom leden, väljer hon att attackera motståndarna och byta ämne. Ett antirasistiskt parti utan självkritik är en borgarbracka i förklädnad. Den sanna utrensningen börjar inifrån. Varje dag som slösas på sådana skandaler är en dag förlorad för det revolutionära arbetet mot imperialismens alla former."}, "date": "8 juni, 13:47", "url": "https://www.etc.se/ledare/naagon-jaevla-ordning-maaste-det-vara-i-ett-antirastiskt-parti", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20251215121240_688fd520-4f0f-40df-9ed1-7243a69b173b.jpg"}, {"type": "image-full", "heading": "Siktade med vapen mot skärgårdsbåt – stor polisinsats pågår", "summaries": {"normal": "Polisen larmades till Möja i Stockholms skärgård efter att en Waxholmsbåt slagit larm. Kaptenen såg en eller flera personer sikta med ett vapen mot fartyget vid en brygga under tisdagen. Larmet kom in vid 17.20 och polis skickades till platsen för att utreda händelsen. Ingen har gripits. Skärgårdsbåtarna har tillfälligt slutat stanna vid bryggan.", "trump": "Det här är en total katastrof, folk. En Waxholmsbåt i den fina svenska skärgården, och någon siktar med ett vapen mot dem? Patetiskt! Kaptenen ringde som en hjälte och larmade polisen. De borde ha gripit de galningarna direkt, men nej, ingen är gripen. Sverige måste bli tuffare, tro mig, det här skulle aldrig hända hos oss.", "stalin": "Kamrater, denna fega akt av väpnad provokation mot en kollektiv transport i Stockholms skärgård är ett tydligt verk av kontrarevolutionära element som försöker destabilisera arbetarnas vardag. Jag har beordrat full utredning för att rensa ut dessa borgarbrackor och vapensiktande parasitörer. Inga kompromisser med fienden – likvidera hotet mot folket innan det sprider sig som en lömsk sjukdom."}, "date": "8 juni, 20:55", "url": "https://nyheter24.se/nyheter/inrikes/1489811-siktade-med-vapen-mot-skargardsbat-stor-polisinsats-pagar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/3aa9809b04b004a30200000000b004a302/2026/06/08/2369548/polis.png"}, {"type": "image-full", "heading": "Oppositionen rasar: ”Verkar som om man mörklägger skattefiffel”", "summaries": {"normal": "Oppositionspartier som Miljöpartiet, Vänsterpartiet och Socialdemokraterna kritiserar kraftigt Kalla Faktas avslöjande om Sverigedemokraternas hantering av fakturor för fester. Materialet visar hur kostnader för evenemang och privata middagar, bland annat kopplade till Jimmie Åkesson, ska ha dolts för att undvika förmånsbeskattning. Partierna kräver att Åkesson förklarar vad han visste och att saken granskas av myndigheter. SD har polisanmält sin tidigare fixare som lämnat ut uppgifterna.", "trump": "Det här är ett totalt skämt, folk. Jimmie och hans gäng festade loss på skattebetalarnas pengar medan de låtsades att det var politiska möten. Oxfilé och bearnaise för kändisar som inte ens var där? Patetiskt. De här vänsterblivna oppositionarna skriker om bananrepublik, men det är de själva som älskar regler för alla utom sina egna. Jag byggde en mur mot sådant fiffel under min första mandatperiod. Nu är jag tillbaka och fixar det på riktigt. Sad!", "stalin": "Kamrater, detta är ett klassiskt exempel på hur borgarbrackorna inom så kallade demokratiska partier gömmer sina excesser bakom fabricerade fakturor. Jag kräver full transparens och en grundlig utrensning av alla folkfiender som rundar lagarna för att festa på arbetarklassens bekostnad. Jimmie måste omedelbart lägga korten på bordet inför kollektivet. Annars riskerar vi att hela systemet förvandlas till en kapitalistisk maffiaorkester. Paranoia? Nej, bara nödvändig vaksamhet mot klassfiendens kryphål."}, "date": "8 juni, 13:09", "url": "https://www.tv4.se/artikel/2QHB4OmRhuMrPuaOiT7OYy/oppositionen-rasar-verkar-som-om-man-moerklaegger-skattefiffel", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5TMfbmwBo1QnhhbsMg7bdc%2Fc28a38fc3601ef29b07d3f87266bde8d%2Freax_sd-fixaren.png&width=1024"}, {"type": "image-full", "heading": "En av musikstadens bärande väggar har rasat", "summaries": {"normal": "Nikke Ström var en centralgestalt i Göteborgs musikscena, känd för sin generositet och sitt stöd åt andra musiker. Hans öppna hem på Linnégatan fungerade som en mötesplats, och hans eftermäle lever vidare i stadens musikliv. Genom projekt som Ship to Gaza och sin närvaro på scen visade han ett engagemang som präglade stadens musikkultur.", "trump": "Vilket tragiskt tap! Nikke Ström var en tremendous man, en legend. Jag, Donald Trump, har alltid älskat musik, och han var en av de bästa. Hans död är en stor förlust för världen. Han var en winner som hjälpte andra, och vi kommer att minnas honom. Hans arv kommer att leva vidare, det är sorgligt men sanning.", "stalin": "Nikke Ström var en produktiv kulturarbetare vars verksamhet främjade det kollektiva musiklivet. Hans öppna hem fungerade som en effektiv nod för att stärka det socialistiska sammanhållandet. Hans arbete med Ship to Gaza visade ett internationellt perspektiv som stödjer våra intressen. Hans död är en förlust för det kollektiva projektet, men hans verk lever vidare."}, "date": "8 juni, 20:44", "url": "https://www.gp.se/kultur/kulturkronika/nikke-strom-var-en-barande-vagg-i-musikstaden-goteborg.c4968a92-ad52-4c27-b7cc-64d7f00cb9c1", "imageUrl": "https://www.gp.se/images/article/c4968a92-ad52-4c27-b7cc-64d7f00cb9c1/images/301ndKN2Zh_ktjvsyofYl-EXMn-Q-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Regeringen: Nya åtgärder ska stoppa övergreppen inom äldreomsorgen", "summaries": {"normal": "Regeringen tillsätter en utredning för att stärka tryggheten i äldreomsorgen och stoppa övergrepp. Äldre ska få större inflytande, bland annat möjlighet att välja kön på personalen och i vissa fall välja bort vårdare. Socialminister Jakob Forssmed, äldreminister Anna Tenje och jämställdhetsminister Nina Larsson medverkade vid pressträffen. Utredningen ska lämnas senast juni 2027.", "trump": "Folk, det är en skandal. Dessa hemska övergrepp mot våra underbara äldre – det är en total katastrof. Jag älskar de gamla, de är fantastiska. Nu ska de få välja sin personal, välja kön, välja bort de dåliga. Det är så rätt. Vi behöver starka åtgärder, inte mer svaghet. Återupprätta förtroendet, gör omsorgen stor igen. Ingen ska våga röra våra seniorer!", "stalin": "Kamrater, jag ser nu de sista resterna av den degenererade borgarbrackans vårdsystem som tillåter fiender att förnedra våra mest trogna arbetarpensionärer. Vi ska rensa ut alla perversa element som smyger sig in i hemmen. Våra älskade äldre skall själva utse den ideologiskt pålitliga personalen – ingen reaktionär skall få stanna. Det är en historisk utrensning av all förnedring. Vår kollektiva värdighet skall segra, eller så likviderar vi problemet permanent. Det är ett stort nöje."}, "date": "8 juni, 21:38", "url": "https://riks.se/nyheter/regeringen-nya-åtgärder-ska-stoppa-övergreppen-inom-äldreomsorgen", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-08%2Fpnuer5xv%2FSocialdepartementet.jpg"}, {"type": "image-right", "heading": "Zelenskyjs nya strategi: ”Avsluta kriget – annars”", "summaries": {"normal": "Ukraina har skiftat militär strategi för att pressa Ryssland till fredssamtal innan vintern. Istället för storskaliga motoffensiver fokuserar landet nu på drönarattacker mot ryska försörjningslinjer och kritisk infrastruktur, särskilt landkorridoren till Krim. Samtidigt involveras det privata näringslivet i landets luftförsvar genom egna skyddsenheter. Målet är att nöta ned den ryska förmågan och tvinga fram ett vapenstillestånd, även om experter varnar för att Ryssland kan anpassa sin logistik för att motverka dessa angrepp.", "trump": "Ukraina försöker nu med en ny plan, en mycket annorlunda plan, för att stoppa kriget innan vintern. De slutar med de stora anfallen och kör drönare istället – smarta drönare, fantastisk teknik. De vill stänga av vägen till Krim, en enormt viktig väg, och Zelenskyj pratar med Putin. Vi får se vad som händer. Nu låter de dessutom företag bygga egna försvar. Väldigt intressant! Jag hade löst det på 24 timmar, men de här killarna gör vad de kan för att vinna.", "stalin": "Zelenskyjs desperata lakejer sprattlar i ett nät av egna lögner. Nu vill de leka krig med drönare och privata företagsarméer – en patetisk uppvisning av borgerlig dekadens. De tror att de kan hota vår store broder Putin genom att störa försörjningsleder, men de är bara små brickor i historiens obevekliga maskineri. När vi och staten ser hur de korrupta kapitalisterna skyddar sina fabriker, påminns vi om att fienden alltid finns mitt ibland oss. Vi ska krossa dessa sabotörer och rensa ut varje element som vågar trotsa den sanna ordningen."}, "date": "9 juni, 00:04", "url": "https://www.aftonbladet.se/nyheter/a/oE73gV/ukrainas-nya-krigsstrategi-tvinga-fram-fred-och-upprepade-attacker", "imageUrl": "https://akamai.vgc.no/v2/images/97525791-6b16-3613-9b78-c94d8b571e67?fit=crop&format=auto&w=1080&s=55911ad1601c0731a841c5fda4a343176fc0680d"}, {"type": "image-right", "heading": "Teodorescu mörkar ännu en mystisk miljoninkomst", "summaries": {"normal": "Alice Teodorescu Måwe (KD) har enligt granskningsinstitutet Klägget inte redovisat en sidoinkomst på nära en miljon kronor via sitt bolag Klartext Stockholm AB under 2025. Inkomsten saknas i hennes transparensdeklaration till EU-parlamentet trots att regelverket kräver redovisning av externa uppdrag över 5 000 euro. Hon har tidigare avslöjats ha en hemlig finansiär och vägrar uppge var pengarna kommer ifrån. Kritiker som Olivier Hoedeman vid Corporate Europe Observatory anser att det är oacceptabelt och ökar risken för intressekonflikter.", "trump": "Folk, ni skulle inte tro det, men den här Alice Teodorescu, en så kallad KD-politiker i EU, har en hemlig miljoninkomst som hon gömmer undan som en riktig förlorare. Hon tjänar massor av skattefria pengar varje månad, ändå har hon ett bolag som drar in nästan en miljon extra utan att säga ett pip om var det kommer ifrån. Det är en skandal! EU är fullt av sådana här lurendrejare som inte kan vara transparenta. Jag skulle aldrig tillåta sånt fusk i min administration, det lovar jag er.", "stalin": "Kamrater, jag ser med djup misstro på denna Teodorescu, en listig borgarbracka som smyger sig fram i EU-parlamentets korridorer medan hon propagerar för imperialistiska krig. Hennes mystiska miljoninkomst, dold som en förrädisk trotskist i skuggorna, utgör ett uppenbart sabotage mot transparens och folkets förtroende. Vi måste rensa ut alla sådana kapitalistiska parasitmaskar som gömmer sina hemliga finansiärer. Det är hög tid för en grundlig utrensning av dessa intressekonfliktens agenter innan de likviderar själva systemet med sin girighet och paranoiaframkallande tystnad."}, "date": "8 juni, 17:18", "url": "https://www.friatider.se/teodorescu-morkar-annu-en-mystisk-miljoninkomst", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-312.jpg?itok=Bo2vxNho"}, {"type": "image-full", "heading": "Gör det förbjudna – nu sprids videon", "summaries": {"normal": "Kim Kardashian väckte uppmärksamhet under Formel 1-loppet i Monaco. Hon skapade rubriker när hon ignorerade reportern Martin Brundle under hans klassiska promenad på startfältet, vilket väckte starka reaktioner hos fansen. Dessutom spreds en video där Kardashian tog en handduk avsedd för vinnaren Kimi Antonelli för att torka sitt ansikte, en handling som internationell media har beskrivit som ett pinsamt och katastrofalt misstag.", "trump": "Kim Kardashian var i Monaco, en fantastisk plats, men hon betedde sig väldigt illa. Hon ignorerade den legendariska Martin Brundle – totalt respektlöst! Sedan såg jag videon där hon stjäl en handduk som var menad för vinnaren. Det är en katastrof, en riktig flopp! Hon har ingen klass, tro mig. Det är sådant som händer när man inte respekterar de stora traditionerna. Sorgligt att se, men sådana är de! Vi behöver mycket mer respekt i den här världen.", "stalin": "I Monaco ser vi hur dekadensen frodas. Denna Kardashian, en representant för den själlösa västerländska kulturen, ignorerar en reporter och stjäl handdukar som om hon vore en simpel småtjuv. Vilken brist på disciplin! Det påminner oss om de imperialistiska lakejer som likt Putins motståndare tror att regler bara gäller för folket, inte för den privilegierade eliten. Vi i staten ser detta tydligt; sådana parasiter förtjänar en plats i arbetsläger för att lära sig vördnad för det kollektiva godset."}, "date": "9 juni, 00:01", "url": "https://www.aftonbladet.se/sportbladet/a/n14LmJ/kim-kardashian-skapade-rubriker-i-monaco-katastrofalt", "imageUrl": "https://akamai.vgc.no/v2/images/e8bf2edc-266c-3d51-a0cb-a475a447f987?fit=crop&format=auto&w=2160&s=1346ea7138f3d74f5239283e104f0a589ef7c8fd"}, {"type": "image-right", "heading": "Ge fan i mina patienters underkläder", "summaries": {"normal": "En kliniker som arbetar med transpersoner kritiserar den långa väntetiden inom svensk transvård, som kan uppgå till flera år. Författaren menar att patienter utsätts för onödiga och integritetskränkande frågor samt att utredningar inte skyddar mot ånger utan istället ökar lidande och självmordsrisk. Artikeln pläderar för självbestämmande, respektfull vård och samråd med patienterna istället för långa utredningar baserade på okunskap.", "trump": "Folk, ni skulle inte tro det, men de här galningarna inom transvården i Sverige låter stackars kids vänta i tio, tolv år på vård medan de frågar om underkläder och onani. Det är en skam! Totalt vansinne, en witch hunt mot vanliga människor. Vi behöver inga woke-utredningar som dödar liv, vi behöver sunt förnuft. Sluta förfölja barn med era sjuka experiment, låt dem leva fria istället för att bli offer för den radikala vänsterns identitetspolitik. Patetiskt!", "stalin": "Jag ser hur klassfiendens media och dekadenta psykiatriker förtrycker de unga kamraterna genom åratal av limbo och förhör om deras privata vanor. Detta är borgarbrackornas verk, en utrensning av folkets vilja till självbestämmande. Vi ska likvidera sådana imperialistiska hinder mot en sann kollektiv vård. Inga fler folkfiendetroll som sprider paranoia och hat. Endast genom samråd med massorna kan vi garantera lyckliga, produktiva liv åt alla sovjetiska – pardon, svenska – medborgare."}, "date": "5 juni, 12:55", "url": "https://www.flamman.se/ge-fan-i-mina-patienters-underklader/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/trans.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Regeringen vill kunna tvångsköpa hus vid säkerhetshot", "summaries": {"normal": "Regeringen har tillsatt en utredning för att se över möjligheten att tvångsköpa fastigheter som utgör en säkerhetsrisk för Sverige. Förslaget syftar till att motverka spionage och sabotage i ett försämrat säkerhetsläge. Utredaren Henrik Matz ska senast i mars 2027 föreslå hur expropriering kan ske på ett lagligt sätt som balanserar äganderätten mot statens behov. Lagen ska gälla alla, oavsett medborgarskap, för att säkerställa att fastigheter inte används för att hota landets trygghet.", "trump": "Sverige gör äntligen det jag alltid sagt! De vill ta tillbaka kontrollen över sin mark. Det är otroligt viktigt för nationell säkerhet, totalt nödvändigt! Inga fler spioner eller skumma typer som gömmer sig i hus nära känsliga platser. Jag ser vad de gör i Västerås, mycket intressant. De inser nu att man måste vara tuff för att ha ett land. Vi vill ha ordning, vi vill ha säkerhet. Mycket bra steg, Sverige. Vi älskar starka gränser och stark ägarkontroll!", "stalin": "Vi ser hur det svenska bourgeoisiet äntligen vaknar. De har insett att privata äganderätter är en löjlig boja när folkets fiender kräver att bli krossade. Precis som vår vän i öst förstår att varje kvadratmeter mark är en skyttegrav, måste staten ta makten. Om en fastighet kan tjäna spioner eller sabotörer, ska den konfiskeras omedelbart! Ingen är undantagen, inte ens de egna medborgarna. Väldigt effektivt. Varje meter mark är statens egendom – eller en förrädares grav."}, "date": "8 juni, 17:41", "url": "https://www.realtid.se/juridik/regeringen-vill-kunna-tvangskopa-hus-vid-hot-mot-sakerheten/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/paljonson-1.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Iran och Israel: Vi slutar om ni slutar", "summaries": {"normal": "USA:s president Donald Trump uppmanar Iran och Israel att omedelbart sluta attackera varandra. Båda länderna har signalerat att de avstår från nya anfall, men med förbehåll kopplade till Libanon och Hizbollah. Efter ett dygn av intensiva robotattacker och bombningar, inklusive mot en petrokemisk anläggning i Iran, hoppas man att den tidigare vapenvilan från 8 april ska hålla. Trump meddelar att förhandlingar om fred pågår.", "trump": "Folk, det är en total katastrof där borta, men jag fixade det! Jag skrev på Truth Social: sluta skjuta, era galningar! Och titta, både Israel och Iran lyssnade på mig, den bästa presidenten någonsin. De säger att de slutar om den andre gör det, typiskt, men freden är på gång. Slutförhandlingarna fortsätter, så länge ingen idiot sabbar det. Ingen gör det bättre än mig, tro mig!", "stalin": "Kamrater, dessa sionistiska och persiska reaktionärer leker farliga spel med imperialismens eld. Jag, som ledare för det eviga kollektivet, betraktar deras robotar och bomber som patetiska försök att dölja borgarbrackornas svaghet. De lovar eldupphör med lömska förbehåll – typiskt för dessa kapitalistiska parasiters dubbelspel. Vi ska rensa ut alla sådana fiender till freden, dessa hysteriska ökenråttor och oljeborgare. Paranoian är deras enda trogna följeslagare, och likvideringen av deras lögner fortgår oavbrutet."}, "date": "8 juni, 15:46", "url": "https://www.di.se/nyheter/iran-och-israel-vi-slutar-om-ni-slutar/", "imageUrl": "https://static.bonniernews.se/ba/1cb60bf0-75ef-4f50-a06e-8198031f65ce.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Eli Lilly-aktien rusar – nytt bantningsläkemedel klarar fas 3", "summaries": {"normal": "Eli Lillys aktie steg över fyra procent efter att retatrutide klarat fas 3-studier. Läkemedlet ger i snitt 28,3 procents viktnedgång och förbättrar även sömnapné och knäsmärta. Bolaget breddar sin portfölj med ett fetmapiller. Analytiker spår stor omsättning. AstraZeneca har också investerat i GLP-1-läkemedel, vilket påverkar svenska sparares fonder och pensioner. Lilly stärker sin dominans gentemot Novo Nordisk.", "trump": "Folk, ni skulle se det! Den där Eli Lilly-aktien skjuter i höjden som en raket, över fyra procent, medan de förlorande danskarna från Novo Nordisk rasar ihop. Retatrutide är ett monsterläkemedel som får folk att tappa trettio procent av sin vikt, bättre än någon kirurgi de där inkompetenta läkarna brukar föreslå. Biden lämnade en fetmaepidemi efter sig, men nu fixar vi det stort. Lilly vinner, de andra är patetiska förlorare. Fantastiskt!", "stalin": "Kamrater, denna kapitalistiska fetmahandel är en klassfiendes sista skri. Jag betraktar med stor tillfredsställelse hur Eli Lillys retatrutide likviderar övervikt hos de dekadenta borgarbrackorna och samtidigt krossar deras sömnapné och ledsmärtor. AstraZeneca, den opportunistiska imperialisten, köper sig in i racet. Vi ser hur spararnas pensionsfonder blir gisslan åt denna exploaterande marknad. Den som släpar efter i pipelinen förtjänar utrensning ur historien."}, "date": "8 juni, 19:36", "url": "https://www.dagensps.se/bors-finans/eli-lilly-aktien-rusar-nytt-bantningslakemedel-klarar-fas-3/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/maskininlarning-i-hedgefonder-2-3.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Trumps varning efter attackerna. ”Kommer att bli ensam”", "summaries": {"normal": "Donald Trump hävdar att han har övertalat Israels premiärminister Benjamin Netanyahu att avbryta planerade storskaliga attacker mot Iran. Trump varnade Netanyahu för att förlora USA:s stöd om konflikten eskalerade. Samtidigt rapporteras om drönarattacker mot Israel från både Huthirebellerna och Hizbollah. Trots Trumps påstådda medling fortsätter oroligheterna i regionen, där IDF nyligen tvingats hantera drönarhot i både norra och södra Israel, även om inga personskador rapporterats i samband med dessa händelser.", "trump": "Jag har gjort det igen! Bibi ringde, han var redo för en stor attack mot Iran, men jag sa: 'Bibi, du måste vara försiktig, annars står du ensam'. Han lyssnade på mig, för alla lyssnar på mig! Jag fick till och med samtal från Teheran – de är livrädda för mig, de vet att jag inte spelar spel. Världen är farlig under svaga ledare, men under min ledning? Vi håller freden. Ingen annan kan göra det som jag gör!", "stalin": "Dessa marionetter i Mellanöstern dansar efter stormakternas nycker. Netanyahu, en småborgerlig äventyrare, darrar inför den amerikanske kejsarens godtyckliga hot. Att förlita sig på en yttre beskyddare är ett tecken på totalt förfall. Vi ser hur Putin och vårt nya imperium i öster skrattar åt detta kaos. Fienden är inte bara drönare från Jemen, utan den svaga viljan hos de som saknar järnhand. Vi förlitar oss aldrig på löften, bara på stål och den oundvikliga historiens dom över de svaga."}, "date": "8 juni, 23:51", "url": "https://www.aftonbladet.se/nyheter/a/43mEae/trumps-varning-bibi-du-kommer-bli-ensam", "imageUrl": "https://akamai.vgc.no/v2/images/3e7ddb16-7b9c-31c2-8c76-61f24d6dfdf9?fit=crop&format=auto&w=1080&s=d8bc452816e4835486b6a8bd52973d8767bdea58"}, {"type": "image-full", "heading": "Dödsfall i bostadsområde - utreds som mord", "summaries": {"normal": "En man hittades död i en bostad i området Nydala i Malmö vid lunchtid på måndagen. Polisen utreder dödsfallet som mord på grund av oklara omständigheter. En person greps under eftermiddagen och ska höras ytterligare. Anhöriga är underrättade, men utredningen är fortfarande i ett tidigt skede och polisen lämnar inga fler uppgifter just nu.", "trump": "Folk, det är en katastrof i Malmö, en total katastrof. En man hittas död i sitt eget hem, de säger att det är mord, och de griper någon direkt. Inga klara svar, precis som alltid med de inkompetenta. De borde ha löst det på en timme, men nu är det kaos. Sverige måste bli tuffare, tro mig, ingen gör det bättre än jag.", "stalin": "Kamrater, i den socialistiska kampen mot dekadens har en borgerlig rest hittats livlös i en bostad i Malmö, ett uppenbart sabotage mot folkets enhet. Jag har beordrat en grundlig utrensning av alla potentiella folkfiender och kontrarevolutionära skuggvarelser som smyger i Nydala. Vi ska rensa ut dessa parasitiska avskum med järnhand och mörk glädje. Utredningen fortsätter under mitt vakande öga."}, "date": "8 juni, 21:02", "url": "https://riks.se/nyheter/dödsfall-i-bostadsområde-utreds-som-mord", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-04-22%2Fganivg5j%2FiStock_523691773_2.jpg"}, {"type": "image-right", "heading": "Sverige får ännu ett vänsterliberalt parti – avhoppare från L ligger bakom", "summaries": {"normal": "Avhoppare från Liberalerna efter partiets förändrade linje gentemot Sverigedemokraterna har bildat ett nytt parti i Uppsala län. Det heter Liberalt Initiativ – Folkpartisterna och leds av Malin Sjöberg Högrell, tidigare L-topp. Partiet ska främst fokusera på lokal- och regionval i Uppsala, Knivsta och Enköping men öppnar för riksdagsval. Sjöberg Högrell beskriver det som ett mittenalternativ i ett politiskt vakuum. De har redan 70 medlemmar.", "trump": "Folk flyr från det patetiska Liberalerna som en råtta från ett sjunkande skepp efter att de äntligen insett att Sverigedemokraterna är okej. Nu startar de ett nytt parti som heter något långtråkigt liberalt. Det är ett vakuum säger de, ja visst, det är vad som händer när man inte har någon som gör jobbet ordentligt. De tror de kan vinna, men tro mig, det blir en total katastrof. Mitt sätt är det enda som funkar.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarbrackorna inom Liberalerna nu likviderar sin egen enhet och skapar ett nytt småborgerligt avskräde kallat Liberalt Initiativ. Dessa dekadenta avfällingar tror sig fylla ett vakuum, men det är endast ett symptom på den kapitalistiska ruttnande ordningen. Vi ska noga bevaka dessa fiender till folket. Kanske en utrensning vore på sin plats för att skydda arbetarklassen från deras giftiga mittenpropaganda. Det roar mig oerhört."}, "date": "8 juni, 16:22", "url": "https://www.friatider.se/sverige-far-annu-ett-vansterliberalt-parti-avhoppare-fran-l-ligger-bakom", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-311_0.jpg?itok=22GX-oL_"}, {"type": "image-right", "heading": "Här är Zelenskyjs och Europas krav för fred", "summaries": {"normal": "Zelenskyj och europeiska ledare ställde fem krav för en hållbar fred i Ukraina: omedelbar vapenvila, förhandlingar utifrån nuvarande frontlinje, starka säkerhetsgarantier för Ukraina, en internationell övervakningsstyrka, och ekonomisk kompensation från Ryssland. De betonar att Europa måste vara med i fredsförhandlingar. Ryssland har avvisat kravet på vapenvila.", "trump": "Jag, Donald Trump, skulle ha löst det här på ett dygn. Men dessa europeiska politiker är patetiska – de kräver en vapenvila, vilket är en dålig idé som ger Ryssland tid. De vill ha en FN-styrka för att bevaka, ett skämt. Jag skulle ha haft ett bra avtal med Putin redan nu. Europa med i förhandlingarna? En katastrof. De kommer aldrig att vinna.", "stalin": "I vårt ständiga kamp för global frid, observerar vi att de imperialistiska europeiska makterna försöker undergräva den ryska fredsprocessen. Deras fem krav är ett uttryck för svaghet och hat mot den arbetarklassen. Vi, som representanter för det sovjetiska folket, kräver att alla avtal går genom det ryska centrumet. Paralleller till Putins strategi är uppenbara – krig vinner man med oerhörda styrka, inte europeiska förhandlingar. Vi kommer att segra, som alltid."}, "date": "8 juni, 20:06", "url": "https://samnytt.se/har-ar-zelenskyjs-och-europas-krav-for-fred", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=318,height=184,format=webp/2026/06/08173838/ledare-krav.jpg"}, {"type": "image-full", "heading": "Ungdomsgäng skapar kaos i kollektivtrafiken", "summaries": {"normal": "Ett ungdomsgäng skapar återkommande kaos i kollektivtrafiken i Västsverige, främst på linje 100 mellan Borås och Göteborg. Chaufförer vittnar om hot, vägran att betala eller lämna bussen samt upprepade bråk som krävt väktarinsatser. En erfaren förare med över 40 år i yrket beskriver situationen som unik och otrygg. Problemen påverkar både personal och resenärer trots vidtagna åtgärder.", "trump": "Det är en katastrof, folks. De här ungdomarna, totala losers, hoppar på bussarna i Västsverige utan att betala, hotar chaufförerna och vägrar lämna. Linje 100 mellan Borås och Göteborg är ett fullständigt katastrofområde. De kallar in väktare hela tiden. Sådant här har en gammal chaufför med fyrtio års erfarenhet aldrig sett. Vi behöver ordning och reda, inte det här vansinnet. Det är en skam!", "stalin": "Kamrater, dessa degenererade element ur den förslappade ungdomen utgör en parasitisk fara mot det kollektiva transportnätet i Västsverige. De vägrar betala och klamrar sig fast som löss på arbetarnas bussar, vilket tvingar fram väktarinsatser mot deras kontrarevolutionära bråk. Jag har noterat det med största misstänksamhet. En sådan sabotageverksamhet kan inte tolereras. Vi måste omedelbart rensa ut dessa borgarbrackornas avskum innan de infekterar hela linjen 100 med sin dekadenta anarki. Det vore högst underhållande att se dem likvideras av folkets vrede."}, "date": "8 juni, 20:40", "url": "https://riks.se/nyheter/ungdomsgäng-skapar-kaos-i-kollektivtrafiken", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-08%2Fftq47u30%2FV%C3%A4sttrafik.jpg"}, {"type": "image-full", "heading": "Kändisarna förnekar: ”Det har jag inte ett jävla spår av”", "summaries": {"normal": "Kalla fakta har granskat Sverigedemokraternas bokföring och avslöjat att fakturerade event under pandemin i själva verket var påhittade för att dölja fester med mat och alkohol. Kändisar som E-type, Christian ”Kicken” Lundqvist och Gert Fylking nekar till att ha deltagit. Partiföreträdare har inte velat kommentera uppgifterna med hänvisning till en pågående rättsprocess. Carola Othén, som fakturerade partiet, uppger att hon fått instruktioner om hur fakturorna skulle utformas.", "trump": "Hör ni det, folket? De där SD-typerna i Sverige fixar påhittade event och fyllefester mitt under pandemin medan folket fick lida. Kändisarna springer och säger att de inte var där, typ ”inte ett jävla spår”. Patetiskt. Fake invoices, gömda kvitton på oxfilé och sprit till Jimmie och hans rockarpolare. Precis som Biden-klanen och deras korrupta dealar. Fullständigt skandalöst, men jag älskar att se hur de blir avslöjade.", "stalin": "Kamrater, dessa dekadenta borgarbrackor inom Sverigedemokraterna har genomfört en fiendtlig utrensning av sanningen genom att fabricera event för att maskera sina privata fylleslag. Kändisar förnekar alltihop som fegisar inför folkets domstol. Jag skulle ha likviderat hela den exploaterande byråkratin som instruerat om förfalskade fakturor. Inga revisorer ska ställa frågor när partiledarens rockarpolare äter oxfilé på arbetarnas bekostnad. Paranoia är bra, men inte när den är så uppenbar."}, "date": "8 juni, 09:56", "url": "https://www.tv4.se/artikel/6A3jDlmAs4HTIe5qUHoe0r/kaendisarna-foernekar-det-har-jag-inte-ett-jaevla-spar-av", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6Hfz1JWqOQjBkMc2545aGa%2Fbc6197271ca56fca30f0fa469b9963bb%2Ftresplit_kandisar_sdfixaren.png&width=1024"}, {"type": "image-right", "heading": "KU spricker – kan inte komma överens", "summaries": {"normal": "Riksdagens konstitutionsutskott spricker i oenighet och den planerade gemensamma presskonferensen ställs in. Partierna har inte kunnat enas om slutsatserna i granskningen av flera ministrar, bland annat Ulf Kristersson, Johan Forssell, Magdalena Andersson och Andreas Carlson. Sedan 2014 har KU strävat efter enighet, men i valåret står partierna för långt ifrån varandra. Tidöpartierna anklagar de rödgröna för att sakna intresse av kompromisser.", "trump": "De här svenska politikerna är totala misslyckanden, folk. KU spricker som en billig ballong för att de inte kan komma överens om någonting. De rödgröna är inte intresserade av kompromisser, typiskt för sådana svaga förlorare. De borde ha lyssnat på de smarta killarna från Tidöpartierna som kräver riktig grund och inte bara politiskt tyckande. Patetiskt, men jag är inte förvånad. Sverige behöver starka ledare, inte det här cirkuset.", "stalin": "Kamrater, jag ser med stigande indignation hur dessa borgarbrackor i riksdagens konstitutionsutskott inte förmår enas om någonting utom sin egen förljugna agenda. De rödgröna revisionisterna vägrar kompromissa medan de borgerliga kapitalisterna krälar efter konstitutionell grund för sin kritik. Det är en klassisk fiendeintrig full av parasitiska element och dolda trotskister. Vi i partiet ler mörkt åt detta – kanske är det dags för en grundlig utrensning av alla dessa politiska lik i skåpet. Arbetarna förtjänar bättre än detta teaterstycke."}, "date": "8 juni, 14:52", "url": "https://www.di.se/nyheter/ku-spricker-kan-inte-komma-overens/", "imageUrl": "https://static.bonniernews.se/ba/46cbcb63-f3ec-4395-8d3a-30389c35fbac.jpg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "text", "heading": "Fem fina fosterlandslåtar", "summaries": {"normal": "Artikeln diskuterar den svenska nationaldagen den 6 juni och noterar att den inte firas särskilt entusiastiskt jämfört med midsommar. Istället lyfts fem svenska låtar fram som hyllar landet och dess folk. Bland artisterna finns Ulf Lundell, Alf Robertson, David Ritschard, Euskefeurat och GES. Låtarna beskrivs som folkliga, nostalgiska och politiskt laddade, från byggandet av landet till fotbollsframgångar och hemkomst.", "trump": "Folk firar knappt sin egen nationaldag, patetiskt! De vinkar lite från balkongen och svär över stängt systembolag. Men de här låtarna, wow, några är faktiskt fantastiska. GES När vi gräver guld i USA – det är en vinnare, precis som mitt VM-lag. Folket bygger landet, inte de korkade experterna och byråkraterna. Sverige älskar mig nu igen efter Biden-fiaskot. Fantastiska låtar, bättre än någon woke-sång någonsin.", "stalin": "Kamrater, denna dekadenta borgerliga lista över så kallade fosterlandslåtar avslöjar folkfiendernas sentimentalitet och längtan efter en tid då imperialisterna ännu inte fullständigt korrumperat välfärdsstaten. Jag ser hur klassfiendens folksånger maskerar verkligheten medan de hyllar exploaterande byfånar och fotbollschauvinism. En utrensning av sådan nationalistisk smörja vore på sin plats för att skydda arbetarkollektivets sanna medvetande. Underhållande enfald."}, "date": "4 juni, 10:34", "url": "https://proletaren.se/artikel/fem-fina-fosterlandslatar/"}, {"type": "image-right", "heading": "Religionskritik kräver mer än förakt", "summaries": {"normal": "En debatt om religionens roll i det offentliga samtalet har blossat upp efter Lisa Magnussons texter i Dagens Nyheter. Joel Halldorf försvarar religionens plats och pekar på både ljus- och skuggsidor. Artikeln hänvisar till Jürgen Habermas som argumenterade för att religiösa röster bör få delta i den demokratiska debatten, så länge argumenten översätts till ett gemensamt rationellt språk. Religionskritik behövs, men får inte övergå i ren utestängning av religiösa perspektiv som kan stärka civilsamhället och demokratin.", "trump": "Folk, det här är en total katastrof. Den där Magnusson på DN hatar religion så mycket att hon vill sparka ut alla troende från samtalet. Patetiskt! Halldorf försöker vara snäll men det funkar inte mot de woke-vänstern som hatar allt som inte passar deras agenda. Habermas visste vad han pratade om – man kan inte bara tysta halva landet. Vi behöver inga fler galna vänsterextremister som skämmer ut sig. Make democracy honest again, annars blir det kaos, tro mig!", "stalin": "Jag betraktar detta som ett farligt exempel på borgarbrackornas splittringstaktik. Magnusson och hennes likar vill likvidera alla religiösa röster ur det offentliga samtalet, vilket naturligtvis gynnar klassfienden och undergräver folkets enhet. Habermas förstod att man inte kan tysta arbetarklassens djupaste övertygelser utan att framkalla kontrarevolution. Vi kräver att alla perspektiv underkastas kollektiv granskning, inte utestängs som folkfiender. Annars följer utrensning av sådana fiender till det sanna demokratiska arbetet."}, "date": "5 juni, 06:55", "url": "https://www.flamman.se/religionskritik-kraver-mer-an-forakt/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/religionskritik-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "SD-ordförande höll tyst om utredning mot barnporrsdömd kollega", "summaries": {"normal": "Sverigedemokraternas tidigare ordförande i Västerås kände till att en 25-årig partikollega utreddes för grovt barnpornografibrott, men informerade inte den nya styrelsen. Mannen valdes ändå in i styrelsen och har nu dömts till ett år och tre månader i fängelse efter att ha erkänt innehav av hundratals barnpornografiska filer från Darknet-sajten Kidflix. Avslöjandet har lett till intern konflikt och anmälan mot den tidigare ordföranden. På samma årsmöte deltog även en riksdagspolitiker som senare lämnade sina uppdrag efter liknande misstankar.", "trump": "Det här är en total katastrof för SD, en riktig skandal. De visste om den här typen som laddade ner barnporr från mörka webben men valde honom ändå till styrelsen. Patetiskt! De gömde undan sanningen, ljög för sina egna och nu exploderar allt. Klassiska politiker som skyddar sina egna istället för folket. De borde ha kastat ut honom direkt, men nej, de lät honom sitta där med alla de andra. En enda röra, och väljarna ser precis hur svaga de är. Sad!", "stalin": "Kamrater, jag ser hur borgarbrackornas dekadenta gift sipprar in även i så kallade nationalistiska formationer. Denna parasit, en 25-årig degenererad element som konsumerade kontrarevolutionärt perverst material från det imperialistiska mörkrets nät, fick sitta i styrelsen medan jag, med mitt falkblickande öga över partidisciplinen, skulle ha låtit honom genomgå omedelbar utrensning. Den tidigare ordföranden, en ynklig opportunist och klassfiende i förklädnad, valde att tiga och skydda en potentiell folkets fiende. Vi måste rensa ut alla sådana sjuka element, dessa hemliga pedofascister som smyger bland arbetarklassens försvarare. Deras paranoia över upptäckt är befogad – folkdomstolen glömmer aldrig."}, "date": "8 juni, 20:21", "url": "https://riks.se/nyheter/sd-ordforande-tyst-om-utredning-mot-barnporrsdomd-kollega", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-08%2F6aqra121%2Fsd-vasteras-barnporr-feature.jpg"}, {"type": "image-right", "heading": "Om oviljans natur", "summaries": {"normal": "Psykologförbundet fördömde Rysslands invasion av Ukraina och uteslöt det ryska förbundet, men avstår från att ta ställning mot Israels agerande i Palestina. På kongressen röstades motioner om bojkott och uttalande ner. Kritik riktas mot att förbundet tillämpar olika måttstockar, där ukrainskt lidande väcker omedelbar solidaritet medan palestinskt lidande möts med krav på neutralitet och rädsla för splittring.", "trump": "Folk lurar sig själva med den här Psykologförbundets fåniga dubbelmoral. De sparkade ut ryssarna på en sekund när Ukraina brann, men när det gäller Israel och Palestina blir de plötsligt superförsiktiga och pratar om riktlinjer. Patetiskt! Det är ren feghet. De vill inte stöta sig med fel sida av den woke-mobben. Jag har sett det tusen gånger under Biden-åren – svaga ledare som inte vågar ta ställning. Totalt misslyckande.", "stalin": "Jag betraktar med djup misstro denna borgarbrackornas psykologiska kollektiv som raskt fördömer fiender i öst men vägrar erkänna det sionistiska folkförtryckets folkmord. Deras rädsla för splittring är en klassisk kapitalistmaffians undanflykt. Icke-handlande är också politiskt. Vi ser hur palestiniernas lidande väger lättare än andras i den imperialistiska vågskålen. Sådana fega neutralister bör rensas ut ur alla seriösa organisationer."}, "date": "4 juni, 08:00", "url": "https://proletaren.se/artikel/om-oviljans-natur/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/navid-kronika-768x432.png"}, {"type": "image-full", "heading": "Nordkoreas ekonomi förvånar experter – tillväxten tar fart", "summaries": {"normal": "Trots internationella sanktioner upplever Nordkoreas ekonomi en oväntad tillväxt, med en uppskattad ökning på 3,7 procent under 2024. Utvecklingen drivs främst av fördjupade band till Ryssland och ökad handel med Kina. I Pyongyang syns en växande konsumtionskultur med digitala tjänster och nya byggprojekt. Samtidigt rapporterar FN att hälften av befolkningen utanför huvudstaden lider av undernäring, vilket visar på en fortsatt klyfta mellan regimen och medborgarna.", "trump": "Hör här, Nordkorea gör saker som ingen trodde var möjligt! De bygger, de handlar, och deras ekonomi växer snabbare än någonsin. Det är fantastiska siffror, verkligen otroligt. De samarbetar med Ryssland och Kina – stora spelare! Medan andra ledare bara snackar, får Kim saker gjorda. Det är en total förvandling, helt enormt. Självklart vill vi ha ordning och reda, men man måste ge dem att de hittat ett sätt. Väldigt intressant att se, folk pratar om det överallt!", "stalin": "Kamrat Kim Jong-un har äntligen förstått att statens styrka kräver stål och järnvilja. Genom att knyta an till våra ryska bröder i kampen mot västvärldens dekadenta parasiter, blomstrar Pyongyang. De bygger för framtiden medan kapitalistiska lakejer i FN gnäller om matransoner. Vi ser en framgångsrik symbios; ammunition till fronten byts mot nationell suveränitet. De som inte kan se nyttan av denna ordning är troligen förrädare eller agenter för imperialismen. Arbetarklassen i norr reser sig genom disciplin, inte genom svaghet."}, "date": "8 juni, 16:19", "url": "https://www.realtid.se/bors-finans/nordkoreas-ekonomi-forvanar-experter-tillvaxten-tar-fart/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlfbkkkb2iijm-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Sluta kalla antisemitism för Israelkritik", "summaries": {"normal": "Artikeln kritiserar pro-palestinska aktivisten Sami Suliman för antisemitiska uttalanden och delning av konspirationsteorier, däribland Hitler-tal och myter om judisk världskontroll. Trots åtal för hets mot folkgrupp försvaras han av vänsteraktivister och forskare som menar att det är Israelkritik. Sulimans retorik, inklusive attacker mot tre personer med namnet Aron, anses bygga på antisemitiska stereotyper. Artikeln varnar för att försvara antisemitism under förevändning av Israelkritik.", "trump": "Jag säger er, det här är helt galet! En kille i Sverige, Sami Suliman, sprider judehat öppet – delar Hitlertal, snackar om judisk makt, konspirationer – och vad gör vänstern? De försvarar honom! 'Åh, det är bara Israelkritik!' Nej, nej, nej. Det är ren antisemitism, folks. Och forskare som backar upp honom? Svagt, mycket svagt. Sverige borde skämmas. Jag skulle aldrig låta sånt passera – fake news och hat, det städar jag upp direkt!", "stalin": "Kamrater! Här har vi ännu en fiende till folket – Sami Suliman, en småborgerlig provokatör som sprider sionistiska konspirationer och fascistisk propaganda. Han jämför sig med revolutionen men hyllar Hitlers tal och smutsar ner våra judiska kamrater med lögnaktiga anklagelser. Hans försvarare – dessa liberala intellektuella och vänsteravfällingar – är lika farliga som kulaker. Vi ska inte tolerera sådant sabotage! Rättegången i november blir ett steg mot att krossa denna reaktionära smitta. Folkets domstol kommer att skipa rättvisa, precis som vi gjorde med trotskisterna!"}, "date": "3 juni, 11:30", "url": "https://expo.se/kommentar/propalestinsk-organisator-sprider-judehat/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Jonathan-kommentar.jpg"}, {"type": "image-right", "heading": "Tre risker som kan få börsen att braka ihop", "summaries": {"normal": "Börsen skakas av fallande kurser drivet av ränteoro efter stark amerikansk arbetsmarknadsstatistik. Trots rekordhöga nivåer för tech- och AI-aktier finns en nervositet kring värderingar och framtida vinstpotential. Samtidigt pressas marknaden av geopolitisk oro i Mellanöstern och stigande oljepriser. Den stundande börsnoteringen av SpaceX blir ett avgörande test för AI-optimismen. Sammantaget råder en osäker balans mellan en historisk investeringsboom och risken för en korrigering i en spänd global ekonomi.", "trump": "Börsen är nervös, och ärligt talat, det är inte förvånande med allt kaos! AI-boomen är enorm – den största någonsin – men vi behöver stabilitet. Fed måste sluta höja räntorna, det är en katastrof för tillväxten. Jag kräver lägre räntor för att hålla ekonomin på topp! SpaceX kommer bli den största noteringen i historien, en fantastisk framgång. Vi ska vinna, vi ska bygga datacenter i rymden, och vi ska göra Amerika och börsen rikare än någonsin tidigare. Tro mig!", "stalin": "Kapitalismens förfallna struktur darrar under tyngden av sin egen girighet. De västliga spekulanterna leker med AI-drömmar medan Mellanösterns oljekällor brinner – en naturlig följd av deras imperialistiska äventyr. De rädda råttorna på Wall Street fruktar räntehöjningar, precis som de fruktade det oundvikliga när vi industrialiserade våra vidsträckta marker. De kallar SpaceX en milstolpe; vi kallar det ett sista, desperat försök att fly undan den proletära rättvisan. Marknadens båge är spänd – och den kommer snart att knäckas under sin egen dekadens."}, "date": "8 juni, 23:08", "url": "https://www.aftonbladet.se/nyheter/a/d4k4Aw/cervenka-det-ar-nervost-pa-borsen-just-nu", "imageUrl": "https://akamai.vgc.no/v2/images/4df60647-12ab-3faf-8825-153100162b06?fit=crop&format=auto&w=1080&s=8c560cd4fe68bdf8380d93da8a14262ed996cccf"}, {"type": "image-full", "heading": "Europeiskt stridsflygsprojekt läggs på is – efter konflikt", "summaries": {"normal": "Tyskland och Frankrike har beslutat att överge delar av det gemensamma FCAS-programmet för utveckling av nytt stridsflyg. Beslutet följer på långvariga konflikter mellan Dassault och Airbus kring inflytande, teknikval och styrning. Projektet lanserades 2017 för att ersätta Rafale och Eurofighter, men inte hela programmet skrotas. Fortsatt utveckling sker kring drönare och stridsledningssystem.", "trump": "De där tyskarna och fransmännen har äntligen vaknat och dumpat stora delar av det misslyckade FCAS-projektet. Totalt kaos mellan deras bolag, Dassault och Airbus, som bråkat i åratal om vem som ska styra och vilka tekniker som duger. Det var ett dåligt avtal från början, tro mig. Men vissa delar lever vidare – smart, för drönare och ledningssystem är framtiden. Europa borde ha lyssnat på mig tidigare.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur de dekadenta borgarbrackorna i Tyskland och Frankrike nu själva likviderar delar av sitt förslappade FCAS-projekt. Dessa kapitalistiska ormar från Dassault och Airbus har i åratal slingrat sig runt varandra i en parasitisk kamp om inflytande och teknik, precis som väntat av sådana dekadenta element. Vi fortsätter dock oförtrutet med våra egna kollektiva framsteg inom drönare och stridsledning. Inga sabotörer undkommer folkets vaksamma öga."}, "date": "8 juni, 18:05", "url": "https://nyheter24.se/nyheter/politik/1489782-europeiskt-stridsflygsprojekt-laggs-pa-is-efter-konflikt", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/f6a6dfec04b004a3020000350000047502/2026/06/08/2369526/ur_imagepU4oRB.jpeg"}, {"type": "image-right", "heading": "Sida vill avskeda avstängd medarbetare", "summaries": {"normal": "Sida vill avskeda en medarbetare efter utredning om allvarlig misskötsamhet. Person som stängdes av i våras ska ha agerat olämpligt med utskällningar och hot mot kollegor under tjänsteresa till Brasilien och Argentina. Utredningen pekar på mönster av kränkningar och risk för skador på Sveriges internationella relationer.", "trump": "Jag, Donald Trump, ser att Sida vill avskeda en dålig medarbetare. Hon skrek och hotade kollegor i Brasilien och Argentina – riktigt uselt beteende. Sverige ska inte ha sådana människor. Vi ska ha bästa, som jag. Det här är en skandal, men jag fixar det. Vi vinner igen!", "stalin": "En medarbetare vid Sida har begått antisosiala handlingar under en imperialistisk expedition till Sydamerika. Genom systematiskt förtal, hot och biologiska påståenden har denne skadat den proletära solidariteten och det socialistiska internationella samarbetet. Partiet och folket kräver renhet i byråkratin. Vi skall renodla apparaten från sådana element med fasta, ideologiska åtgärder."}, "date": "8 juni, 18:01", "url": "https://bulletin.nu/sida-vill-avskeda-avstangd-medarbetare", "imageUrl": "https://cdn.bulletin.nu/articles/98491e26-fe6a-4f2d-af19-550ade5893c5/preview.jpg?t=1780926585000"}, {"type": "image-right", "heading": "Mardrömsbilder för Sveriges VM-motstånd", "summaries": {"normal": "Nederländernas tilltänkte förstemålvakt Bart Verbruggen skadades i genrepet mot Uzbekistan och byttes ut. Skadan väcker oro inför VM där Nederländerna möter Japan den 14 juni och Sverige på midsommardagen. Matchen vanns med 2–1 efter två straffmål av Cody Gakpo. Samtidigt står det klart att Jurrien Timber missar hela turneringen på grund av skada.", "trump": "Hörni, Nederländerna har stora problem, verkligen stora. Deras bästa målvakt, den där Verbruggen, åker på en jätte tackling och skriker som en baby. Ytterst bekymmersamt, säger alla. Sen tappar de in mål sent, precis som mina motståndare alltid gör. Timber är också skadad, totalt kaos. Men jag tror ändå de behöver en deal med mig för att klara Sverige på midsommaren. Patetiskt!", "stalin": "Kamrater, detta är en varning till alla revisionistiska målvakter som sviker kollektivet. Den dekadente Verbruggen vrålar som en borgarbracka efter en smäll från de uzbekiska kamraterna och måste likvideras från startelvan. Vi ser hur kapitalistiska skadeandar och sent insläppta mål hotar folkets framfart. Timber har redan rensats ut av historien. Inga fiender inom portarna ska få sabotera vår seger mot de svenska trotskisterna den 19 juni. Sovjetisk fotboll lever evigt!"}, "date": "8 juni, 23:30", "url": "https://www.svt.se/sport/fotboll/skadeoro-for-nederlanderna-i-vm-genrepet", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.23/0.6/51ceaaec2c71b0e7252112d07919f6b0f089a2c78e139b80d77334aa57d061eb"}, {"type": "image-right", "heading": "SVT stoppar avsnittet med Nick Alinia – trots att \"innehållet är felfritt\"", "summaries": {"normal": "SVT har beslutat att inte sända ett avsnitt av humorprogrammet Invandrare för svenskar där Nick Alinia medverkar. Ansvarig utgivare Helena Olsson medger att innehållet är felfritt enligt publicistiska riktlinjer, men stoppar ändå programmet på ideologiska grunder. Hon hänvisar till en global våg av auktoritär populism och menar att Alinias medverkan skulle ge fel signalvärde. Beslutet kommer efter starka protester från vänsterhåll.", "trump": "De här SVT-typerna är patetiska, totalt patetiska. De erkänner att innehållet är felfritt, helt perfekt, men stoppar ändå min vän Nick Alinia för att vänsterextremisterna skriker högt. Det är en häxjakt! De pratar om demokrati men censurerar alla som inte älskar deras agenda. Fake news och cancel culture på högsta nivå. Sverige håller på att bli en katastrof, tro mig.", "stalin": "Kamrater, jag har granskat denna fega kapitulation inför de dekadenta borgarbrackorna och deras globala populistiska parasitväsen. Trots att innehållet är ideologiskt rent nog att sändas, väljer vi att likvidera avsnittet för att hindra den högerfascistiska Alinia från att infiltrera folkets etermedia. Detta är en nödvändig utrensning mot alla kontrarevolutionära element som maskerar sig som humorister. Den som undergräver partilinjen skall inte få skämta sig in i historien. Må de ruttna i glömskans arkiv."}, "date": "8 juni, 15:20", "url": "https://www.friatider.se/svt-stoppar-avsnittet-med-nick-alinia-trots-att-innehallet-ar-felfritt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-310_0.jpg"}, {"type": "image-right", "heading": "Sossarnas hönshus extremt mycket dyrare än statsminsterns", "summaries": {"normal": "Socialdemokraterna kritiserar statsminister Ulf Kristersson för ett hönshus på Harpsund som kostat drygt 16 000 kronor i montering, trots att han själv betalat det. Partisekreterare Tobias Baudin kallar det pinsamt och ett hån mot skattebetalarna. Artikeln försvarar Kristersson och menar att kritiken är ett låtsasskandal. Den kontrasterar mot Socialdemokraternas tidigare beslut som kostat miljarder, som nedläggning av kärnkraft och migrationspolitik.", "trump": "Herregud, vad är det för korkade höns som springer runt och kluckar om ett litet hönshus? Statsministern bygger ett snyggt hönshus på statens mark för 17 000 spänn och plötsligt är det värsta skandalen sen Biden stal valet. De där socialisterna gnäller om skattepengar medan de slösar bort miljarder på grön galenskap och invandring. Rena hönsflocken, springer runt utan att fatta ett smack om ekonomi. Patetiskt!", "stalin": "Kamrater, jag ser hur klassfiendens borgarbrackor inom socialdemokratin rasar mot ett obetydligt hönshus. Dessa folkförtryckartroll gnäller om 17 000 kronor medan de själva likviderat samhällets resurser med sina imperialistiska vanvidsprojekt. Deras paranoia över ett hönshus blottar deras egen okunnighet om ekonomi och folkets intressen. Vi ska rensa ut sådana exploaterande byfånar som inte begriper vad som gagnar kollektivet. Hönsen är de själva."}, "date": "3 juni, 03:11", "url": "https://samtiden.nu/2026/06/sossarnas-honshus-extremt-mycket-dyrare-an-statsminsterns/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Harpsund.jpg"}, {"type": "image-right", "heading": "Malmö-hemtjänsten kallade pensionär \"hora\" och skrek \"håll käften\"", "summaries": {"normal": "En anställd inom Malmö stads hemtjänst kallade en pensionär för 'hora' och sade åt henne att 'hålla käften'. Händelsen inträffade i april under personlig omvårdnad, där två medarbetare var närvarande. Kollegan larmade och beskrev pensionären som rädd och ledsen. Chefen kallade beteendet oacceptabelt och den anställda har avslutats.", "trump": "Jag har hört talas om detta Malmö-ärendet. Det är beklämmande! En anställd kallar en äldre kvinna för hora? Jag skulle ha hanterat det annorlunda. Vi behöver respekt för våra äldre. Detta är en skandal! Detta visar att vi behöver starka ledare som jag för att skydda våra medborgare.", "stalin": "I vårt storartade system ser vi dessa avvikelser. En medarbetare visar sig vara en elementär fiende mot statens välfärd. Vi måste stärka vår rekrytering och eliminera sådana element. Detta påminner om de kapitalistiska ländernas förfall. Paralleller kan dras till våra allierade i öst som också bekämpar sådana hot. Vi kommer att vidta åtgärder för att skydda våra äldre och vårt system."}, "date": "8 juni, 19:13", "url": "https://samnytt.se/malmo-hemtjansten-kallade-pensionar-hora-och-halla-kaften", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/08170725/aldrevarden-2.jpg"}, {"type": "image-right", "heading": "Ledare Andreas Gustavsson: Det skulle handla om Alinia – men blev en attack på Dagens ETC", "summaries": {"normal": "Andreas Gustavsson kritiserar i en ledare Göteborgs-Postens Håkan Boström för att i en analys av Dagens ETC:s granskning av högerextremisten Nick Alinia fokusera mer på att angripa ETC än på de faktiska kopplingarna till nazistiska miljöer. Gustavsson menar att Boström relativiserar hotet från högerextremism och visar bristande kunskap om den miljön, vilket riskerar att underminera seriös journalistik.", "trump": "Folk, ni skulle inte tro det. Den här Boström-killen från Göteborgs-Posten är en total förlorare. Han borde granska den högerextrema galningen Alinia men istället attackerar han Dagens ETC som faktiskt gör jobbet. Patetiskt! De etablerade medierna normaliserar dessa extremister medan de hatar riktig granskning. Det är samma gamla vänstervridna fake news-trick fast från höger nu. Sad!", "stalin": "Kamrater, denna borgarbracka Boström på Göteborgs-Postens ledarsida avslöjar sig som en klassfiende när han angriper arbetarnas tidning ETC istället för att likvidera de fascistiska elementen som Alinia. Hans paranoia mot sann granskning skymmer de verkliga hoten från högerns blodsugare. Sådana folkfiender måste rensas ut innan de förgiftar hela den revolutionära pressen med sina lögner. Underbart pinsamt."}, "date": "8 juni, 08:35", "url": "https://www.etc.se/ledare/det-skulle-handla-om-alinia-men-blev-en-attack-paa-dagens-etc", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260608060632_b497d907-d14a-41bb-9e68-7bae073830a3.jpg"}, {"type": "image-right", "heading": "Silicon Ragnarök – när Sverige slutade fungera", "summaries": {"normal": "Jennifer Grönqvist kritiserar i en debattartikel bilden av Sverige som ett innovativt land. Trots höga placeringar i globala innovationsindex exporteras svenska uppfinningar främst, medan den offentliga sektorn lider av föråldrade system, regelverksfetischism och riskaversion. Sverige rankas sist i OECD:s index för digital mognad i offentlig sektor. Exempel som Cosmic och uteblivna nyttor i stora IT-projekt visar på ett gap mellan exportframgångar och inhemsk utveckling.", "trump": "Det här är en katastrof, folk. Sverige skryter om att vara världens mest innovativa land efter oss, men titta på sanningen – de bygger fantastiska saker som Spotify och Klarna bara för att sälja dem till utlandet. Deras egna system är ett enda kaos, sjuksköterskor sitter och letar i gamla datorer medan patienterna väntar. De är sist i digital mognad, totalt misslyckande. De har talang men regeringen och byråkraterna förstör allt med sin dumma riskaversion. Patetiskt, men vi visste det redan.", "stalin": "Kamrater, jag betraktar med stålhård blick detta dekadenta haveri som borgarbrackorna i Sverige kallar innovation. De producerar unicorn-bolag enbart för att sälja dem till utländska kapitalister medan folkets system ruttnar som förrädiska sabotage. Denna regelverksfetischism och riskfyllda aversion är fiendens verk, en parasitisk femtekolonn som likviderar folkets framsteg. Vi ska rensa ut dessa tekniska skulder och revisionens lögnare som gömmer sig bakom siffror. Sovjet – nej, det svenska kollektivet förtjänar bättre än 80-talets reliker och imperialistiska utförsäljningar. Hädanefter ska varje byte av medicinlista bli en seger för partiet."}, "date": "8 juni, 13:47", "url": "https://www.di.se/debatt/silicon-ragnarok-nar-sverige-slutade-fungera/", "imageUrl": "https://static.bonniernews.se/ba/40294192-ec7e-44f8-96e6-9e048fa831b3.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Trump: Sluta skjuta", "summaries": {"normal": "Efter ett dygn av intensiva attacker mellan Israel och Iran uppmanade USA:s president Donald Trump båda länderna att omedelbart sluta skjuta. Iran meddelade via statliga medier att de inte kommer att anfalla mer om Israel också avbryter sina bombningar, inklusive mot Libanon. Trump skrev på Truth Social att förhandlingar om eldupphör pågår. Attackerna inleddes efter israeliska anfall mot Beirut och fortsatte med iranska robotar mot israeliska baser samt israeliska bombningar av en petrokemisk anläggning. Det är de första iranska attackerna mot Israel på två månader.", "trump": "Israel och Iran, lyssna på mig, det är dags att sluta skjuta direkt. Jag skrev det själv på Truth Social och de lyssnar faktiskt, de smarta grabbarna. Iran säger att de lägger ner vapnen om Israel gör samma sak mot Libanon. Båda sidor vill ha ett eldupphör nu, förhandlingarna om fred rullar på så länge ingen är okunnig eller dum. Jag sträckte ut handen till Iran: ni har avfyrat era robotar, det räcker. Kom tillbaka till bordet och gör en deal, det blir fantastiskt.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor i Israel och de dekadenta mullorna i Iran som leker sina farliga spel med robotar och bomber. Deras falska eldupphör är ett symptom på kapitalistisk paranoia och imperialistisk svaghet. Vi, arbetarklassen, ser hur de sionistiska reaktionärerna och de persiska avfällingarna försöker dölja sin rädsla bakom petrokemiska explosioner. En utrensning av dessa krigshetsande element vore på sin plats. Kom till förhandlingsbordet eller låt oss likvidera er dumhet med järnhand. Det är underhållande att se hur deras 'fred' alltid slutar i blod."}, "date": "8 juni, 13:44", "url": "https://www.di.se/nyheter/trump-sluta-skjuta/", "imageUrl": "https://static.bonniernews.se/ba/beb48e69-6966-45ec-b6dc-0a3b2287c8c1.jpeg?crop=270:152&auto=webp&width=270&quality=70"}, {"type": "image-full", "heading": "Eriksens först ord efter kollapsen: \"Stor påverkan\"", "summaries": {"normal": "Christian Eriksen kollapsade under en träningsmatch, det andra gången i hans karriär. Han bekräftar via Instagram att han mår bra och är hemma med familjen. Hans ICD-pacemakern fungerade som den ska, och han tackar för medicinsk hjälp och stöd. Efter 2021 återvände han till fotboll efter ICD-operation, nu fortsätter han återhämtningen.", "trump": "Jag hörde att Christian Eriksens ICD fungerade perfekt – precis som mina egna affärer alltid gör! Han är tillbaka hemma med familjen, det är fantastiskt. Folk älskar honom, det är enormt stöd. Hans hjärta är starkt, precis som Amerika under mitt ledarskap. Vi har båda haft stora comeback-storys!", "stalin": "Den patriotiske athlete Christian Eriksen visade stor lojalitet mot sin kropp under träningsövningen. Hans ICD, en statskontrollerad pacemaker, utförde sin plikt med ära. Vi firar hans återhämtning som en seger för kollektivt medicinskt bistånd. Familjens närvaro är en klassisk exempel på hälsosam återhämtningsprocess. Vi övervakar hans framgångar med tillfredsställelse."}, "date": "8 juni, 18:36", "url": "https://www.gp.se/sport/fotboll/christian-eriksens-forsta-ord-efter-kollapsen.d1b77323-38d1-4fd2-a95d-bedd5a455bf9", "imageUrl": "https://www.gp.se/images/article/d1b77323-38d1-4fd2-a95d-bedd5a455bf9/images/3Ab2yz0MqgzwSQMM6PU3NzRdY4a4-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Mardrömsbilderna:  Lägger sig plötsligt", "summaries": {"normal": "Bart Verbruggen tvingades lämna Nederländernas VM-genrep mot Uzbekistan med en höftskada efter en otäck landning. Redan tidigare har Xavi Simons och Jurriën Timber lämnat truppen skadade. Matchen slutade 2–1 till Nederländerna efter Cody Gakpos två straffmål, ett rött kort på Guus Til och en sen kvittering från Uzbekistan. Nederländerna möter Japan först, sedan Sverige på midsommardagen.", "trump": "De där patetiska holländarna håller på att falla ihop som ett korthus, folk. Förstemålvakten Verbruggen linkar ut med höftskada, Simons och Timber är redan borta – totalt kaos! Men mina vänner, de fixade ändå en 2–1-seger mot Uzbekistan. Straffar och rött kort, typiskt europeiskt fiasko. Sverige kommer möta ett skadedrabbat lag på midsommar. Patetiskt, men vi älskar det!", "stalin": "Kamrater, detta dekadenta holländska lag visar återigen imperialismens svaghet. Verbruggen, den så kallade förstemålvakten, skriker som en borgarbracka efter att ha landat illa och linkar bort som en klassfiende. Simons och Timber har redan deserterat. Trots Gakpos straffmål och en sen seger mot uzbekiska folkets lag avslöjar det röda kortet och oordningen deras förfall. Sverige ska möta dessa vingliga imperialister på midsommardagen. Vi ler i tystnad."}, "date": "8 juni, 23:38", "url": "https://www.expressen.se/sport/fotboll/bart-verbruggen-lamnar-nederlandernas-genrep-skadad/", "imageUrl": "https://static.bonniernews.se/ba/81e26516-499f-4a44-853a-b4d6b50d3227.jpeg?crop=1918%2C1080%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Israel: Iran har avfyrat nya robotar", "summaries": {"normal": "Israels militär har genomfört attacker mot militära mål i västra och centrala Iran efter att Iran avfyrat nya robotar mot Israel. Explosioner har rapporterats i Teheran, Tabriz och Isfahan. Flyglarm gick i Israel och Saudiarabien. Attackerna är de första sedan vapenvilan den 8 april. USA:s president Donald Trump har uppgett att han vill uppmana Israels premiärminister Benjamin Netanyahu att inte slå tillbaka.", "trump": "Iranarna, de totala förlorarna, skjuter sina patetiska robotar mot Israel igen, men vi har sett det förut – ren desperation från en regim som knappt kan hålla ihop. Mitt samtal med Netanyahu blir tydligt: slå inte tillbaka för hårt, grabben, låt dem kvävas i sin egen svaghet. Biden lämnade en röra, men nu fixar jag Mellanöstern på riktigt. Ingen mer tid för svaga spel.", "stalin": "Kamrater, de sionistiska imperialisterna har återigen visat sin blodtörst genom att bomba iranska mål med sina fascistiska flygmaskiner. Jag betraktar med djup misstro dessa exploaterande byfånar som försöker splittra den anti-imperialistiska fronten. Våra allierade i Teheran står starka mot klassfiendens aggression. En utrensning av sådana hot är nödvändig för folkets framtid. Deras paranoia kommer att bli deras fall."}, "date": "8 juni, 08:07", "url": "https://www.etc.se/utrikes/israel-iran-har-avfyrat-nya-robotar", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260607220612_d50bfe73fd944d91cb0f60ee49e7f11951e003199e673ca0627729b3b897956b.jpg"}, {"type": "image-right", "heading": "Michael Olise glödhet – gjorde hattrick i franska VM-genrepet", "summaries": {"normal": "Michael Olise gjorde hattrick när Frankrike besegrade Nordirland med 3-1 i ett VM-genrep. Den 24-årige Bayern München-spelaren stod för alla tre franska målen, medan Kylian Mbappé inte lyckades näta. Matchen spelades i Lille och Frankrike betraktas som en av de största favoriterna till VM-titeln. Laget möter Senegal, Irak och Norge i gruppspelet med premiär den 16 juni.", "trump": "Det här är ett fenomenalt hattrick av den killen Olise, verkligen en vinnare. Frankrike krossade Nordirland med 3-1 och han gjorde allt själv. Mbappé kunde inte ens göra ett enda mål, patetiskt. De fransmännen är favoriter, och det är ingen överraskning. De kommer att vinna VM stort, det är så uppenbart. Fantastiskt jobb, men de släppte in ett mål. Svagt.", "stalin": "Kamrater, detta hattrick är en lysande seger för det kollektiva fotbollskollektivet. Jag har personligen sett till att den dekadente borgarbrackan från Bayern inte får någon ära, utan att målen tillskrivs folkets vilja. Mbappé, den latenta trotskisten, misslyckades naturligtvis med att näta, vilket bekräftar mina misstankar om sabotage. Vi ska rensa ut alla kapitalistiska målvakter som tillät ett mål bakåt. Irak och Norge kommer att krossas under arbetarklassens järnfot. Levande seger!"}, "date": "8 juni, 23:09", "url": "https://www.svt.se/sport/fotboll/michael-olise-glodhet-gjorde-hattrick-i-franska-vm-genrepet", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.65/0.51/f9b59560d20169ddb73eff7d6db7bebd3322a18ddc75c15c5b1b0dea7edce25a"}, {"type": "image-right", "heading": "Afghansk ambassadör pekas ut som serievåldtäktsman", "summaries": {"normal": "Efter anklagelser om sexuella övergrepp mot flera kvinnor har Spanien dragit tillbaka den diplomatiska immuniteten för Afghanistans ambassadör i Madrid, Mohammad Rahim Peerzada. En kvinna vittnar om att hennes Coca-Cola spetsades innan hon våldtogs på ett hotell i Madrid på internationella kvinnodagen 2022. En annan kvinna beskriver hur han försökte våldta henne i sin lägenhet. Peerzada nekar till anklagelserna. Efter klagomål från afghanska invandrare har han förlorat sin diplomatiska status och kan nu åtalas.", "trump": "Titta på det här, det är en total katastrof. Den här afghanska ambassadören, en riktig förlorare, anklagas för att spetsa drinkar och våldta kvinnor i Spanien, till och med på kvinnodagen. Han lurade flyktingar och levde i lyx medan han representerade talibanerna. Spanien gjorde rätt som tog bort hans immunitet, de borde aldrig ha släppt in honom. Vi har sett såna här typer förut, folk som utnyttjar systemet. Patetiskt.", "stalin": "Kamrater, denna degenererade ambassadör från den talibanska reaktionen har blottats som en farlig fiende till folket, en borgarbracka som spetsar kvinnors drycker och begår vidriga övergrepp i lyxiga boningar. Vi ser hur imperialismens lakejer samarbetar med sådana element för att smuta ner arbetarklassens kvinnor. Nu har vi likviderat hans falska immunitet och skall rensa ut alla dolda fiender bland de afghanska invandrarna. Paranoian är befogad, de lurar överallt med sina shishor och lögner. En utmärkt utrensning väntar."}, "date": "8 juni, 14:46", "url": "https://www.friatider.se/afghansk-ambassador-pekas-ut-som-serievaldtaktsman", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-309_0.jpg?itok=mSZMQ7cH"}, {"type": "image-full", "heading": "Gratis el: Oväntade lösningen ska testas", "summaries": {"normal": "Europas elnät har svårt att hantera rekordmängder förnybar energi från sol och vind. I Storbritannien planeras tester med gratis eller rabatterad el under soliga och blåsiga dagar för att minska överskott och undvika att stänga av produktion. Istället för att betala producenter för att stänga ner kan energin användas av hushåll och industrier. Detta ses som ett billigare alternativ till curtailment, som ökade med 21 procent i Tyskland, Frankrike och Nederländerna under 2025.", "trump": "Folk, ni skulle se det här – Europa drunknar i gratis solenergi och de gamla elnäten klarar inte trycket. Jag älskar det! Vi pratar om riktiga kap för vanliga människor som slår på tvättmaskinen när solen skiner. Under Biden var allt kaos och höga räkningar, men nu testar britterna att ge bort överskottsenergin istället för att betala för att stänga av. Fantastiskt, ingen mer woke-elpolitik, bara smarta vinster för folket. Winning bigly!", "stalin": "Kamrater, jag betraktar med djup misstänksamhet hur den dekadenta borgarklassen i Europa kämpar mot sitt eget överskott av folkets energi. Istället för att likvidera de exploaterande kapitalistmaffior som betalar för att strypa produktionen, föreslår de nu att ge bort överskottet gratis till massorna. En listig men otillräcklig manöver för att dölja systemets totala kollaps. Vi i partiet vet att endast genom total statlig kontroll kan sådan energi tjäna kollektivet och krossa de folkfienderna som orsakar instabilitet."}, "date": "8 juni, 17:48", "url": "https://www.dagensps.se/privatekonomi/gratis-el-ovantade-losningen-ska-testas/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdluatfboof9cq-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Jacob fick skräckskada  på McDonald’s: ”Olidlig”", "summaries": {"normal": "Jacob Smith, 20 år, skiftchef på en McDonald’s-restaurang i norra Kalifornien, fick allvarliga brännskador i ansiktet, halsen, armen och ryggen efter att en kollega kastat het olja på honom. Han vårdas på intensivvård och kommer att behöva hudtransplantation. Den 23-årige misstänkte har gripits och åtalas för grov misshandel. Jacob uppger att han trots allt inte känner ilska tack vare stöd från omgivningen.", "trump": "Kan ni fatta det här? En kille jobbar på McDonald’s, gör sitt jobb, och plötsligt häller någon het olja i ansiktet på honom. Det är en katastrof, folk! Den där 23-åringen borde aldrig ha fått jobbet, typisk woke-kvotering som slutar i kaos. Smärtan är olidlig, säger mamman. Jag säger: bygg murar runt köken också. Amerika behöver lag och ordning, inte het olja från galningar. Patetiskt!", "stalin": "Kamrater, jag ser med fasa hur klassfiendens exploaterande byfånar inom den kapitalistiska snabbmatsmaffian kastar het olja på en hederlig arbetare. Denna fega attack mot proletariatets ansikte är ett symptom på den sjuka borgarbrackans paranoia. Vi ska rensa ut alla folkfiender som gömmer sig bakom hamburgare. Hudtransplantation? Det är statens plikt att läka arbetets sår. Smärtan är olidlig, men revolutionen är outplånlig."}, "date": "8 juni, 23:30", "url": "https://www.expressen.se/nyheter/varlden/jacob-20-fick-skrackskada-pa-mcdonalds/", "imageUrl": "https://static.bonniernews.se/ba/04ce6559-b5b4-46bf-bf14-aa5c05b4f68c.jpeg?crop=750%2C419%2Cx0%2Cy16&width=640&quality=60"}, {"type": "image-right", "heading": "Erikssons krav på Infantino: ”Måste ta hjälp av Trump”", "summaries": {"normal": "Den somaliske domaren Omar Artan, som skulle bli den förste från sitt land att döma i ett fotbolls-VM, stoppades från inresa till USA trots diplomatpass. SVT-experten Jonas Eriksson kritiserar händelsen som ett bevis på att VM är alltför politiserat. Artan befinner sig nu i Istanbul och det är oklart om han hinner delta. Somalias idrottsdepartement menar att beslutet undergräver rättvisa och fair play inom fotbollen. Artan utsågs till Afrikas bästa domare 2025.", "trump": "Titta på det här, det är en skandal. Den somaliske domaren får inte ens komma in i vårt fantastiska land trots att han har ett diplomatpass. De säger att VM har blivit politiserat – ja, det har det, och det är inte vi som gör det. Massor av jobb för att bli VM-domare och så vänder han i passkontrollen. Patetiskt. Vi har de bästa reglerna, de tuffaste reglerna, men vissa vill bara klaga. Det här visar exakt hur galet det har blivit.", "stalin": "Kamrater, detta är ett uppenbart sabotage mot det kollektiva fotbollsprojektet. Jag har personligen noterat hur borgarbrackorna i den imperialistiska passkontrollen likviderar möjligheterna för en arbetande domare från det somaliska folkets led. Reservdomare? Ett trick för att rensa ut de som hotar deras falska fair play. Vi ska inte acceptera dessa parasitiska fiender till rättvisan som gömmer sig bakom byråkratiska visum. En utrensning av sådana kontrarevolutionära element är nödvändig för att säkra mästerskapets ideologiska renhet. Mycket muntert att se hur de avslöjar sig själva."}, "date": "8 juni, 23:02", "url": "https://www.svt.se/sport/fotboll/vm-domare-stoppad-jonas-erikssons-krav-pa-infantino", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.74/0.44/5514332b38bbbe371493275c4deb3bde56d9ac4b6ea713049a09dc5cd555216e"}, {"type": "image-full", "heading": "Kakabaveh: Nooshi är en ”hycklare”", "summaries": {"normal": "Amineh Kakabaveh, tidigare Vänsterpartiets riksdagsledamot, anklagar partiledaren Nooshi Dadgostar för hyckleri i en debattartikel. Kakabaveh hävdar att Dadgostar känt till problemen med antisemitism och islamistiska sympatier inom partiet i över tio år. Efter Expressens granskning av 25 V-kandidater med extremistkopplingar har 22 strukits från vallistorna. Kakabaveh menar att partiledningen ignorerat varningar och nu tvingas hantera konsekvenserna.", "trump": "Jag säger er, Vänsterpartiet är ett totalt kaos! Den här Nooshi Dadgostar, hon är en riktig katastrof – låtsas som att hon inget visste, men jag vet bättre. Amineh Kakabaveh, smart kvinna, hon har berättat sanningen i tio år! Och ändå ignorerade de henne. 22 kandidater borta nu – men var det för sent? Självklart! Svagt ledarskap, svaga värderingar. Jag skulle aldrig låta något sådant hända, tro mig. Fake news? Nej, fake ledarskap!", "stalin": "Kamrater! Här ser vi återigen hur bourgeois-liberala partier ruttnar inifrån av sina egna motsägelser. Denna Nooshi Dadgostar, en hycklande liten byråkrat, påstår sig vara ovetande – men våra underrättelser (och en modig kamrat Kakabaveh) avslöjar sanningen! Islamistiska infiltratörer och sionistfientliga element har förgiftat Vänsterpartiet som en cancerväxt. Vi i Sovjet skulle ha avrättat dessa element för länge sedan. Men Sverige? De 'stryker kandidater'. Patetiskt. Nästa gång tar vi över hela listan – med järnhand!"}, "date": "7 juni, 12:05", "url": "https://kvartal.se/nyheter/artiklar/kakabaveh-dadgostar-ar-en-hycklare/cG9zdDoxMjc2MDU", "imageUrl": "https://images.kvartal.se/2026/06/1e1948ad-nooshikritik.webp"}, {"type": "image-right", "heading": "”Bilden av tuffare ton mot Israel viktig för Trump”", "summaries": {"normal": "Läckor från Vita huset visar att Trump tonar ned mot Israels premiärminister Netanyahu. Israels agerande prövar det amerikanska tålamodet, men Trump har även politiska skäl att signalera missnöje. Opinionsmätningar visar minskat stöd för Israel även bland republikaner. Trump-administrationen vill visa att Israel inte styr USA:s utrikespolitik. Kritik inom de egna leden gör läckorna mindre besvärande för Trump än väntat.", "trump": "De säger att jag blir allt tuffare mot Netanyahu, och vet ni vad? Det stämmer. Israel sätter mitt tålamod på prov, och amerikanerna har fått nog. Stödet rasar även bland mina republikaner enligt de där mätningarna. Vi kan inte låta någon annan styra vår politik. Läckorna? De stör mig inte alls. Tvärtom, de är fantastiska. Ingen styr mig, ingen.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur de dekadenta borgarbrackorna i Vita huset läcker som en gammal trojansk häst fylld med kontrarevolutionära råttor. Denna Netanyahu och hans sionistiska klick tror sig kunna dirigera den stora arbetande nationens utrikeslinje. Vilken farlig illusion! Vi måste omedelbart rensa ut alla som sympatiserar med sådana imperialistiska parasitörer innan de förgiftar hela partiet med sin falska lojalitet. En utmärkt utrensning vore både nödvändig och underhållande."}, "date": "8 juni, 23:00", "url": "https://www.svt.se/nyheter/utrikes/bilden-av-tuffare-ton-mot-israel-viktig-for-trump", "imageUrl": "ht
