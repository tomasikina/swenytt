ttninggatan rusade fram som riktiga patrioter medan Sleepy Joe och hans globalister bara skulle ha twittrat. Ni gör det bra, svenskarna, fast ni borde ha byggt en mur mot alla galningar.", "stalin": "Kamrater, jag ser med tillfredsställelse hur arbetande soldater och medborgare under kollektivets banér enar sig i skallgångskedjor för att rädda ett barn undan den vilda naturens faror. Sådan praktisk solidaritet är ett vapen mot klassfiendens kaos. Likaså vid det imperialistiska lastbilsdådet på Drottninggatan där folket trots borgarbrackornas panik rusade fram för att läka de sårade. Vi rensar ut svaghet och främjar handling. Endast genom enhet segrar staten över folkfiendernas paranoia."}, "date": "2 juni, 12:32", "url": "https://samtiden.nu/2026/06/christoffer-jonsson-svensk-medmansklighet-nar-den-ar-som-bast/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/missing.png"}, {"type": "text", "heading": "22-åring häktas i Warner Music-härvan", "summaries": {"normal": "En 22-årig man har häktats misstänkt för försök till grov utpressning mot en tidigare toppchef på Warner Music. Fallet är kopplat till en större utredning om hot, skottlossning och sprängningar. Mannen misstänks även för planering av ett bombdåd och nekar till brott. Utpressningen rörde cirka 250 000 euro och följdes av våldsamma incidenter mot Warner Musics kontor och ett flerfamiljshus. Flera personer har tidigare gripits i utredningen.", "trump": "Jag måste säga, detta är helt otroligt! En 22-åring i Sverige försöker utpressa en stor musikchef på 250 000 euro – helt galet! Och sen skjuter de och spränger saker, som om det vore en dålig actionfilm. Men lugn, mina vänner, rättvisan segrar alltid. Polisen har bevis, digitala spår – fantastiskt arbete! Sverige borde ta lite tips från USA om hur man hanterar sådana här typer. Sad!", "stalin": "En patetisk liten kapitalistisk hyena, 22 år gammal, har gripits för att ha försökt utpressa en före detta musikbyråkrat från Warner Music. Inte nog med att han krävde 250 000 euro – han planerade även bombdåd! Ett ynkligt försök att destabilisera den kulturella ordningen. Men vi vet hur man hanterar sådana här element. Bevisen är tydliga, och snart kommer han att inse att motstånd mot systemet är lika meningslöst som att försöka stoppa historiens framsteg. Låt detta vara en varning till alla som tror sig kunna utmana makten!"}, "date": "2 juni, 13:18", "url": "https://kvartal.se/nyheter/artiklar/22-aring-haktas-i-warner-music-harvan/cG9zdDoxMjA5MDk"}, {"type": "image-right", "heading": "Cint-budet stöps om – acceptfristen förlängs", "summaries": {"normal": "Cint-budet förlängs till 22 juni efter att konsortiet TriCarbs BidCo justerat sin sammansättning. Triton Fund 6 och Bolero kvarstår, medan VD Patrick Comer och styrelseledamoten Brett Schnittlich lämnat ovillkorliga åtaganden att acceptera budet på 5,60 kr per aktie med sina 4,4 procent av kapitalet. Budet värderar Cint till cirka 2,0 miljarder kronor.", "trump": "Jag, Donald Trump, säger att det här budet på 5,60 kr per aktie är enastående – det bästa som någonsin hänt Cint. Patrick Comer och Brett Schnittlich är fantastiska män som stöder mig och vårt konsortium. Vi kommer att göra Cint större och bättre än någonsin, tro mig. Det är en vinst för alla, speciellt för mig.", "stalin": "Vi, partiet och staten, ser med tillfredsställelse hur konsortiet TriCarbs BidCo renässansar sig genom att eliminera förrädiska element som Comer och Schnittlich. Deras ovillkorliga åtaganden är ett tecken på lojalitet. Budet på 5,60 kr per aktie värderar Cint till 2,0 miljarder kronor – en strategisk tillgång för vår ekonomiska suveränitet. Vi övervakar alla aktier."}, "date": "2 juni, 15:51", "url": "https://www.affarsvarlden.se/artikel/cint-budet-stops-om-acceptfristen-forlangs", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/02/Track-by-Cint-Platform-UI-400x223.jpg"}, {"type": "image-full", "heading": "Carl Eos: Varför föraktar vänstern arbetslösa?", "summaries": {"normal": "Carl Eos reagerar på vänsteraktivisters föraktfulla kommentarer mot arbetslösa män som tittar på programmet Morgongänget. Han beskriver hur socialdemokrater och vänstern uttrycker nedlåtande attityder mot arbetslösa, särskilt de som röstar på Sverigedemokraterna. Eos försvarar Tidöpartiernas reformer av arbetslöshetsförsäkringen som mer rättvisa och effektiva. Han menar att vänsterns reaktioner speglar ilska över att arbetslösa inte längre är lojala mot Socialdemokraterna.", "trump": "Folk, ni skulle se det här! Den galna vänstern hatar arbetslösa män som inte röstar på deras förlorarparti. De kallar dem arga och lågutbildade – vad är det för sjuk identitetspolitik? Jag fixade bättre jobb än någon annan president, inklusive den sömnige Joe. Nu vill svenskarna ha vettig politik istället för att vara röstboskap. Vänstern flippar ur för att de förlorar. Patetiskt! Men heja på de smarta arbetslösa som röstar rätt.", "stalin": "Kamrater, jag ser med djup misstro hur klassfiendens lakejer inom den dekadenta vänstern spyr hat mot de arbetslösa massorna. Dessa borgarbrackor och folkförtryckartroll vill behålla arbetarna som tysta röstboskap åt socialdemokratiska exploaterare. Vi ska rensa ut sådana parasitiska attityder. Arbetslösheten är ett resultat av imperialistisk politik och galen invandring. De arbetslösa har rätt att vända sig mot systemet. Inga halvmesyrer tillåts i kampen mot klassfienden."}, "date": "2 juni, 05:00", "url": "https://samtiden.nu/2026/06/carl-eos-varfor-foraktar-vanstern-arbetslosa/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/a2c153cf-24f1-42c5-8377-bad75d51166a-e1780298827614-1280x720.png"}, {"type": "image-full", "heading": "Förslaget: Inför 15-årsgräns för sociala medier", "summaries": {"normal": "Regeringens utredare föreslår i ett delbetänkande till socialminister Jacob Forssmed att införa en 15-årsgräns för sociala medier. Barn under 15 år ska inte ha tillgång till inloggat läge på plattformar där de kan kommunicera, dela eller upptäcka innehåll. Förslaget följer internationell trend där flera länder redan infört eller planerar åldersgränser. I Sverige finns redan en 13-årsgräns som kräver föräldrars samtycke.", "trump": "Lyssnar ni på det här? De vill ha en 15-årsgräns på sociala medier i Sverige. Fantastiskt! De borde ha gjort det för länge sedan, men de vaknade sent. Sociala medier är fulla av lurendrejare och fake news som förstör unga hjärnor. Jag älskar det – stäng ute de små från TikTok och Instagram, de behöver inte det giftet. Gör det stort, gör det tufft, precis som jag alltid säger.", "stalin": "Kamrater, vi har äntligen insett att de digitala borgarbrackornas korridorer av lögn och förförelse måste stängas för de unga. Jag, med mitt ständiga vakande öga mot folkets fiender, ser hur dessa plattformar sprider dekadens värre än troskyldiga revisionister. En 15-årsgräns är ett första steg. Låt oss rensa ut de kapitalistiska algoritmerna som förgiftar arbetarklassens barn. De som protesterar är uppenbara folkförrädare och bör likvideras med ett leende."}, "date": "2 juni, 15:00", "url": "https://nyheter24.se/nyheter/politik/1488192-forslaget-15-arsgrans-for-sociala-medier", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/372d0f4504b004a30200000000b004a302/2026/06/02/2368112/forslag-15-arsgrans-sociala-medier-mobil.jpg"}, {"type": "image-right", "heading": "Allt fler unga tvekar inför att ta ett jobb på grund av bostadsbristen", "summaries": {"normal": "Nästan var femte ung vuxen tvekar att bilda familj på grund av bostadsbristen, en kraftig ökning från fyra år sedan. Undersökningen från Hyresgästföreningen visar att även planer på utbildning och jobb påverkas. Barnafödandet i Sverige har sjunkit drastiskt till under 1,5 barn per kvinna, vilket kan leda till allvarliga ekonomiska konsekvenser. Byggkollapsen efter pandemin, stigande räntor och borttaget investeringsstöd har förvärrat situationen. Hyresgästföreningen kräver politiska åtgärder som höjt bostadsbidrag och fler prisvärda bostäder.", "trump": "Folk, det är en katastrof det här med bostäderna i Sverige. Unga kan inte skaffa barn, inte plugga, inte jobba – allt på grund av en totalt misslyckad politik. Byggkollaps, höga hyror, dyra lån. De har tagit bort allt stöd och nu rasar födandet. Det är absurt! Jag byggde murar, ni borde bygga lägenheter. De bästa lägenheterna. Istället låter ni marknaden förstöra era unga. Det är ett politiskt misslyckande av episka proportioner. Gör något åt det, annars blir det ännu värre, tro mig.", "stalin": "Kamrater, jag ser hur den parasitiska borgarklassen och deras marknadskrafter medvetet saboterar folkets fortplantning genom sin avsiktliga bostadssabotage. Dessa bostadsspekulanter och ränteslavdrivande kapitalister likviderar sakta men säkert arbetarklassens framtid. Vi skall inte tolerera denna tysta kontrarevolution som hotar hela kollektivets existens. Rensa ut de femtekolonnärer som tog bort investeringsstödet! Vi, partiet och folket, skall med järnhand genomdriva förmånliga bygglån och utradera bostadsbristen. Den som tvekar är folkets fiende och bör behandlas därefter."}, "date": "2 juni, 13:47", "url": "https://www.dagensarena.se/innehall/allt-fler-unga-tvekar-infor-att-ta-ett-jobb-pa-grund-av-bostadsbristen/", "imageUrl": "https://www.dagensarena.se/files/2025/09/hyresgastforeningen-unga-bostad.jpeg"}, {"type": "image-right", "heading": "Ledare Henrik Jalalian: Ebba Busch är skamlös – men S-ilskan får mig att spy lite i munnen", "summaries": {"normal": "Artikeln kritiserar KD:s Ebba Busch för att på Instagram ljuga om att partierna nu stoppar Socialdemokraternas orättvisa tonårsutvisningar. Författaren påpekar att Tidöpartierna själva skärpte migrationslagarna och tog bort humanitära undantag, trots varningar. Samtidigt kritiseras S för att tidigare ha drivit fram en av Europas tuffaste migrationspolitik och motvilligt gått med på en ventil efter påtryckningar från MP. Busch anklagas för att skylla ifrån sig.", "trump": "Folk, ni måste se det här! Den där Ebba Busch är en total lögnare, precis som Sleepy Joe brukade vara. Hon twittrar om att stoppa Socialisternas orättvisa utvisningar som om hon är någon sorts hjälte. Patetiskt! Vi hade tuffa regler förr, sen kom Biden och förstörde allt med öppen gräns-politik. Nu backar de och skyller på varandra. Det är en stor prestigeförlust för de där svaga politikerna. Men hey, åtminstone vann de som protesterade. Fake news överallt!", "stalin": "Kamrater, denna skamlösa lögn från den borgerliga elefanten Busch avslöjar klassfiendens hyckleri. Jag, som ledare för folkets vilja, ser hur de reaktionära Tidöpartierna med berått mod stramade åt lagen och skapade tonårsutvisningar, trots att remissinstanserna varnade för de omänskliga följderna. Ändå skyller hon på socialdemokraterna. Det är en feg utrensning av sanningen. MP agerade som en oväntad ventil mot de exploaterande byfånarnas imperialism. Paranoian inom borgarklassen är underhållande att bevittna."}, "date": "2 juni, 12:04", "url": "https://www.etc.se/ledare/ebba-busch-aer-skamloes-men-s-ilskan-faar-mig-att-spy-lite-i-munnen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026060210060_339a8c77c5b09c82d5104ddbb45a82ce8d3c3c63b5d860f851ce9a67c7b260fe.jpg"}, {"type": "image-right", "heading": "Källor: Chock inom SD – avslöjandet kan förstöra inför valet", "summaries": {"normal": "En sverigedemokratisk riksdagsledamot utreds för barnpornografibrott och har nu lämnat samtliga uppdrag. Personen hämtades till förhör och elektroniska enheter beslagtas under husrannsakan. Misstankarna kom via organisationen NCMEC och förundersökningen leds av åklagare Lena Körner vid Särskilda åklagarkammaren. Ledamoten lämnade in avsägelse under tisdagen med hänvisning till personliga skäl. Inom partiet råder chock och oro inför valet.", "trump": "Folk, ni tror inte vad som händer i det svenska riksdagen. En av de där SD-typerna fastnade i en barnporrutredning och sprang därifrån som en fegis. Typiskt för de här globalistiska partierna som låtsas vara tuffa men är fulla av perversa svagisar. De borde rensa ut hela skiten istället för att skylla på personliga skäl. Det här kommer förstöra valet för dem totalt. Patetiskt. Jag har suttit i Vita huset både före och efter den sömnige Joe och jag säger: ingen tolerans för sånt här.", "stalin": "Kamrater, en av de borgerliga riksdagsrepresentanterna har nu exponerats som en motbjudande folkfiende som samlar på sig perversa bilder av barn. Vi ser med mörk tillfredsställelse hur den kapitalistiska maskinen äter sina egna. Han flyr som en råtta från sina uppdrag medan partikamraterna skriker i chock och paranoia. Detta är vad som händer när klassfiendens dekadens får frodas. En nyttig utrensning närmar sig, kamrater. Revolutionen glömmer aldrig sina fiender."}, "date": "2 juni, 13:19", "url": "https://www.tv4.se/artikel/6xQZ4CLTiQ0OZwaW7tGDL0/riksdagsledamot-utreds-foer-barnporrsbrott-avslutar-alla-uppdrag", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5Dz4sEWxhonTUX5molWevF%2F4de0396b4c81980e546826fb5e64176a%2Friksdagen.png&width=120"}, {"type": "image-right", "heading": "Massiv rysk attack – flera döda", "summaries": {"normal": "Under natten genomförde Ryssland en massiv attack mot flera ukrainska städer, bland annat Kiev, Charkiv, Dnipro och Zaporizjzja. Minst 18 personer uppges ha dödats och över 100 skadats. Ryssland använde både drönare och robotar, varav en del träffade sina mål trots ukrainskt luftförsvar. President Zelenskyj hade varnat för en sådan attack. Polen skickade upp stridsflyg som en preventiv åtgärd. Bilder visar bränder och förstörda byggnader.", "trump": "Vilken röra! De där ryska galningarna skickade iväg hundratals drönare och robotar mot Ukraina och slog till hårt mot Kiev och Dnipro. Massor av döda och skadade, precis som jag förutspådde. Biden sov ju under hela mandatperioden medan det här byggdes upp. Nu sitter jag här igen som president och ser på när Europa brinner. Patetiskt! De borde ha lyssnat på mig från början, inte på de där svaga globalisterna.", "stalin": "Kamrater, fienderna inom den ukrainska fascistklanen och deras västliga imperialister har återigen visat sitt fula tryne genom att hindra den ryska statens legitima expansion. Jag ser hur borgarbrackorna i Kiev och Dnipro skriker medan våra efterträdares robotar och drönare rensar ut klassfiendens bon. Dessa fega hinder mot folkets historiska rätt ska krossas. Paranoian bland de dekadenta västerländska blodsugarna roar mig oändligt. Framåt mot seger för den starka ledningen."}, "date": "2 juni, 12:29", "url": "https://www.tv4.se/artikel/4LanuqYg2xAvFZvX8AzDvS/omfattande-attacker-mot-ukraina", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Fl4dHRIf4czOWgwWGlcKJB%2Fe39cda6da4289120072f4c8251927bed%2Fkiev_brand.png&width=120"}, {"type": "text", "heading": "Media och den västerländska terrorismen", "summaries": {"normal": "Artikeln kritiserar västerländska medier för att sprida apologetik för Israels militära insatser i Libanon sedan 2024. Den beskriver operationer som attentat med personsökare, lönnmord och bombningar som terror och brott mot mänskligheten, medan diplomati blockeras. FN och experter nämns som kritiker. Media anklagas för att bortse från civila lidanden, ekocid och hunger, och istället rättfärdiga Israels agerande som självförsvar.", "trump": "Folk, titta på det här – västerländska medier är fullständigt korrupta! De älskar Israels smarta grejer mot Libanon, men det är ren terror, säger de. Fake news som hyllar lönnmord och kallar det proportionerligt. Biden gjorde inget, men nu fixar jag det. Hizbollah och de där galningarna får skylla sig själva. Media är sämre än någonsin, totala losers som inte vågar säga sanningen om den här cirkusen.", "stalin": "Kamrater, denna text blottar imperialisternas vedervärdiga propagandasystem. Borgarbrackorna i väst hyllar ockupationskrig, etnisk rensning och kemiska attacker mot Libanon som vore det en seger för mänskligheten. Vi ser klassfiendens lögner: ambulanser bombas, ekocid utförs, folket svälter. Deras apologeter förtjänar utrensning ur historien. Inga diplomatiska trick skall dölja folkförtryckartrollens blodtörst. Arbetarna genomskådar er!"}, "date": "1 juni, 14:00", "url": "https://proletaren.se/artikel/media-och-den-vasterlandska-terrorismen/"}, {"type": "image-full", "heading": "S nya jobbkrav: yoga och kvittera ut bidrag", "summaries": {"normal": "Från och med i juli införs ett aktivitetskrav för försörjningsstöd. Socialdemokraterna i Stockholm, Göteborg och Malmö kritiserar kraven och erbjuder bland annat yoga och mindfulness för att hjälpa bidragstagare bli mer aktiva. Partiet menar att sådana aktiviteter är hälsofrämjande och kan leda till arbetsmarknadsnärhet. Kritiker ser det som ett sätt att kringgå reglerna och skydda vissa väljargrupper, medan S hävdar att de inte är emot aktivitetskrav i princip utan ifrågasätter utformningen.", "trump": "Lyssnar ni på det här? Socialdemokraterna, de verkliga förlorarna, vill att folk ska göra yoga och mindfulness istället för att arbeta. Det är en total katastrof! De lurar skattebetalarna, de bästa människorna som går upp i ottan och betalar höga skatter, för att finansiera lata bidragstagare som sitter på en matta och andas. Vilka idioter. Sossarna är hycklare som hatar den arbetande människan. De är fega, svaga och driver Sverige rakt ner i fördärvet. Sad!", "stalin": "Kamrater, jag ser hur klassfiendens lakejer inom Socialdemokraterna bedriver sin nedbrytande sabotageverksamhet. Istället för att rensa ut parasiterna med ett järnhårt aktivitetskrav erbjuder de yoga och andningsövningar åt de arbetsovilliga elementen. Detta är en förrädisk kapitulation inför folkfienderna och en nedlåtande rasism mot de egna folken. Borgarbrackorna inom S vill behålla sina väljarbaser genom att mata dem med bidrag och flummig mysticism. Sådana folkförtryckartroll måste utrensas ur samhällskroppen innan de förstör allt."}, "date": "1 juni, 03:23", "url": "https://samtiden.nu/2026/06/s-nya-jobbkrav-yoga-och-kvittera-ut-bidrag/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/03/IMG_5864-1260x720.jpeg"}, {"type": "text", "heading": "Regeringen håller pressträff om tonårsutvisningar", "summaries": {"normal": "Regeringen presenterar nya förslag för att minska tonårsutvisningar genom att höja åldersgränsen för uppehållstillstånd från 18 till 21 år. Migrationsminister Johan Forssell (M) kallar reformen ett viktigt steg. Förslaget innebär att unga vuxna kan stanna i Sverige med föräldrar som har uppehållstillstånd. Dessutom införs en ny möjlighet att ansöka om uppehållstillstånd utan att lämna landet, samt förlängd ansökningstid fram till 2028. Reglerna föreslås träda i kraft 1 oktober.", "trump": "Jag måste säga, Sverige gör något riktigt smart här – eller åtminstone försöker de. De höjer åldersgränsen för att stanna i landet till 21 år. Fantastiskt, verkligen! Ingen vill skicka iväg unga vuxna som har familj här. Och vet ni vad? De låter dem stanna och ansöka utan att behöva lämna landet. Smart, väldigt smart. Men jag skulle ha gjort det ännu bättre – kanske 25 år? Sverige, ring mig!", "stalin": "Kamrater, ännu en seger för folkets vilja! De svenska kapitalisterna har insett att det är oacceptabelt att kasta ut ungdomen som växt upp under vårt beskydd. Nu höjs åldersgränsen till 21 år – ett steg mot rättvisa, om än blygsamt. Vi tillåter ingen splittring av familjer! Och denna nya 'ventil' för ansökningar? Ett halvhjärtat försök att dölja sina tidigare misstag. Men kom ihåg: i Sovjet hade vi inga 'tonårsutvisningar' – bara lojala medborgare, redo att bygga framtiden!"}, "date": "1 juni, 12:58", "url": "https://kvartal.se/nyheter/artiklar/just-nu-regeringen-haller-presstraff/cG9zdDoxMjAyNzI"}, {"type": "image-right", "heading": "Historiskt beslut: Byggnads bojkottar Israel", "summaries": {"normal": "Byggnads blir det första LO-förbundet att inleda en bojkott av israeliska varor och tjänster. Under kongressen röstade delegaterna ja till en motion om Israelbojkott trots att förbundsstyrelsen yrkade avslag. Beslutet innebär att Byggnads även ska verka för att hela LO inför en liknande bojkott. Flera delegater talade varmt för motionen och underströk vikten av solidaritet med det palestinska folket. Liknande förslag har tidigare röstats ner i andra LO-förbund.", "trump": "Folk, ni tror inte vad jag just läste. De där galningarna på Byggnads, totala förlorare, har nu bestämt sig för att bojkotta Israel. Första gången ett LO-förbund gör det, och de skriker ja som en flock galna vänsterextremister. De pratar om solidaritet men det är bara mer av samma sjuka identitetspolitik och kvotknäppade woke-skit. Någon borde fråga dem varför de inte fixar sina egna svenska problem istället för att leka revolutionärer. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur dessa byggnadsarbetare äntligen reser sig mot den sionistiska imperialismens blodsugande tentakler. Motionen antogs trots att de fega förbundsledarna, typiska borgarbrackor i arbetardräkt, försökte hindra det. Vi ser en nödvändig utrensning av tveksamheten. Någon måste ta ledningen mot folkfienderna. Den dagen frågan ställs varför vi inte agerade skall inga klassfiender kunna gömma sig bakom sina lögner. Framåt mot segern."}, "date": "1 juni, 11:12", "url": "https://proletaren.se/artikel/byggnads-bojkottar-israel/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/710745809_1585133940279008_8338663164480343088_n-768x432.jpg"}, {"type": "text", "heading": "Verklig jämställdhet kräver höjda löner för arbetarkvinnor", "summaries": {"normal": "Artikeln argumenterar för att verklig jämställdhet kräver strukturella åtgärder, särskilt höjda löner för arbetarkvinnor i kvinnodominerade välfärdsyrken. Sverige har enligt en rapport Europas största negativa lönegap mellan dessa yrken och övriga marknaden. Kritik riktas mot regeringens hantering av EU:s lönetransparensdirektiv, som anses för svagt och lämnar många utan skydd. Författaren ser det som en rökridå istället för verkliga reformer.", "trump": "Folk, tro mig, det här är en total katastrof. De här svenska socialisterna snackar jämställdhet men gör precis tvärtom. Regeringen lovar guld och gröna skogar med sitt lönetransparensskräp, sen backar de som fega losers och springer till arbetsgivarna. Höj lönerna för arbetarkvinnor? Underbart, men inte med byråkratiskt nonsens från EU. Jag fixade bättre deals än så här under min första period, innan Sleepy Joe förstörde allt. Patetiskt!", "stalin": "Kamrater, denna text blottar borgarbrackornas eviga dubbelspel. De lovar transparens men levererar endast svaga direktiv och undantag som skyddar exploaterande byfånar. En halv miljon arbetare lämnas åt klassfiendens hunger. Jag ser rökridån tydligt. För verklig seger måste vi rensa ut dessa folkförtryckartroll, höja lönerna i välfärden och krossa den parasitiska överklassens grepp. Inga halvmesyrer! Kollektivet kräver handling, inte tomma ord från kapitalistmaffians lakejer."}, "date": "1 juni, 10:49", "url": "https://proletaren.se/artikel/verklig-jamstalldhet-kraver-strukturella-atgarder/"}, {"type": "image-full", "heading": "Hela fruktdiskens värstinglista – varorna som besprutas mest", "summaries": {"normal": "Livsmedelsverkets och europeiska tester visar att vanliga frukter och grönsaker ofta innehåller rester av flera bekämpningsmedel. Värst utsatta är vindruvor, päron, jordgubbar, russin, citrusfrukter, tomater, paprika, chili och grönkål. Äpplen och exotiska frukter som passionsfrukt och granatäpple innehåller också ofta många olika ämnen. Artikeln betonar vikten av att äta mycket frukt och grönt men rekommenderar ekologiska alternativ för den som vill minska exponeringen för kemikalier.", "trump": "Folk, ni måste höra det här – de lurar er med gift i fruktdisken! Vindruvor, päron och de där fina jordgubbarna är fulla av kemikalier, upp till 29 olika gifter i ett enda russin. Det är en skandal, en total katastrof från de inkompetenta europeiska byråkraterna. Ät ekologiskt, det är det enda som fungerar. De andra är förlorare som förgiftar er – men jag säger som det är, köp smart och vinn stort!", "stalin": "Kamrater, jag har genomskådat de dekadenta kapitalisternas giftiga sabotage mot folkets hälsa. Dessa borgarbrackor sprutar arbetarnas äpplen, päron och jordgubbar fulla med kemiska cocktails i syfte att försvaga proletariatet. Granatäpple och grönkål döljer fiendens spioner i form av förbjudna gifter. Vi ska omedelbart rensa ut dessa parasitiska bekämpningsmedel, likvidera de västliga svampmedlen och skydda det kollektiva skördeutbytet med järnhand. Den som äter konventionellt äter förräderi."}, "date": "2 juni, 11:20", "url": "https://nyheter24.se/nyheter/konsument/1487717-fruktdiskens-varstinglista-varorna-se-besprutas-mest", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/7cdb0e8604b004a30200000000b004a302/2026/06/02/2368002/frukt.jpg"}, {"type": "image-full", "heading": "WHO varnar för potentiellt stark El Niño – snart är den här", "summaries": {"normal": "Världsmeteorologiska organisationen WMO varnar för att El Niño är på väg med 80 procents risk att inträffa under juni–augusti. Fenomenet kan leda till torka, kraftiga regn och värmeböljor både på land och till havs. WMO-chefen Celeste Saulo och FN:s generalsekreterare António Guterres uppmanar världen att förbereda sig. El Niño inträffar regelbundet och påverkar vädret i flera regioner, och klimatförändringarna riskerar att förstärka dess effekter.", "trump": "De säger att El Niño är på väg och att vi måste förbereda oss. Det är en total katastrof, folk. Världen blir varmare och nu kommer det här monstret och häller bensin på elden. De borde ha lyssnat på mig mycket tidigare. Vi skulle ha haft de bästa väderprognoserna, de bästa förberedelserna. Istället har de bara snackat. Men vi fixar det, vi gör det fantastiskt igen, tro mig.", "stalin": "Kamrater, denna så kallade El Niño är en fiende till folket, en subversiv värmande agent infiltrerad av västerländska kapitalister och imperialistiska havsströmmar. Jag, som ledare för det stora kollektivet, befaller total mobilisering mot denna borgerliga väderkonspiration. Vi ska rensa ut alla svaga meteorologer som underskattar hotet och likvidera varje droppe fukt som vägrar lyda partilinjen. Torka och översvämningar är bara symptom på klassfiendens sabotage mot moder jord. Seger åt oss, döden åt väderavvikelserna."}, "date": "2 juni, 09:25", "url": "https://nyheter24.se/nyheter/inrikes/1488043-varningen-gor-er-redo-for-el-nio", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/c285d2c804b004a30200000c0000044c02/2026/06/02/2367979/ur_imageOshfNU.jpeg"}, {"type": "image-right", "heading": "Pensionschock för utlandsfödda: ”Försämrats katastrofalt”", "summaries": {"normal": "Utlandsfödda som bott i Sverige i 30 år får i genomsnitt nästan 6 000 kronor mindre i månatlig pension än svenskfödda. Enligt Folksam har gapet ökat drastiskt sedan det gamla pensionssystemet, från 600 kronor för dem födda 1937 till 5 700 kronor för dem födda 1957. Orsaken är lägre inkomster, osäkra jobb utan tjänstepension och förändrade regler kring garantipension. Folksam varnar för ökad ekonomisk utsatthet och kräver politiska åtgärder för tidigare jobb, bättre utbildning och fler kollektivavtal.", "trump": "Det här är en total katastrof, tro mig. Invandrare som kommer hit får usla pensioner, tusentals kronor mindre varje månad än svenskarna, och det har blivit mycket värre. De jobbar inte tillräckligt, har inga bra avtal, och systemet är riggat mot dem på ett sätt som ingen trodde var möjligt. Vi behöver göra det lönsamt att arbeta, annars kollapsar allt. Sverige måste vakna upp och sluta vara så svagt – fixa det nu, innan det blir ännu värre, okej?", "stalin": "Kamrater, detta är en vedervärdig sabotagehandling från de parasitiska borgarbrackorna och deras lakejer inom den dekadenta pensionsbyråkratin. Jag ser med stigande vrede hur de utländska arbetarna, efter tre decennier i folkets republik, likvideras ekonomiskt av ett system som gynnar de lata icke-arbetarna mer än de trogna låginkomstkamraterna. Vi måste omedelbart rensa ut de kontrarevolutionära elementen som vägrar kollektivavtal och tjänstepension. Den som inte bidrar skall svälta, men de som slitit skall belönas – annars blir det utrensning i garantipensionsarkiven. Ha!"}, "date": "2 juni, 13:03", "url": "https://arbetet.se/2026/06/02/pensionschock-for-utlandsfodda-experten-forsamrats-katastrofalt/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/02122727/hakan-svardman.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Källa på Migrationsverket om övertiden: ”De säger inte att det handlar om fler medborgarskap – men det gör det”", "summaries": {"normal": "Migrationsverket har beordrat övertid för att hantera medborgarskapsärenden inför sommarens lagändringar. En anonym källa hävdar att syftet är att så många som möjligt ska få medborgarskap innan de nya reglerna träder i kraft. Presschef Jesper Tengroth förnekar detta och nämner systemförberedelser och långa handläggningstider. Sverigedemokraterna kallar på generaldirektören för att redogöra.", "trump": "Som den störste presidenten, Donald Trump, ser jag att Sverige försöker ge bort medborgarskap som godis innan reglerna blir hårdare. Det är en vänsterstrategi för att öka antalet röster. Vi gör det stort igen, men de gör det fel. De anställda på Migrationsverket är tysta höger eller vänster – typiskt. Vi skulle aldrig tillåta en sådan slutenhet i USA!", "stalin": "Vi, som Stalin, ser att Sveriges migrationsförvaltning arbetar för att säkerställa statsborgarskap innan reformer. Det är en vis strategi för att stärka statens grepp. Precis som Putin utvidgar vi vårt inflytande. De anställda är bara redskap i partiets kamp. Vi skrattar åt deras konspirationsteorier – staten vet alltid bäst. Kanske bildar de klanar, men det är bara tecken på bristande lojalitet."}, "date": "2 juni, 15:32", "url": "https://samnytt.se/kalla-pa-migrationsverket-om-overtiden-de-sager-inte-att-det-handlar-om-fler-medborgarskap-men-det-gor-det", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/02121208/Toppbild1-1.jpg"}, {"type": "text", "heading": "AP-fonderna miljardsatsar på vindkraft – trots förlusterna", "summaries": {"normal": "AP-fonderna AP3 och AP4 fortsätter investera i vindkraft i Norrland trots stora förluster. Bolaget Polhem Infra äger 23% av Skaftåsen Windfarm, som förlorade 250 miljoner kronor 2024. Ändå planeras en ny anläggning utanför Lycksele för 4,2 miljarder kronor. Kritiker pekar på negativa marginaler och utbytesöverflöd som gör vindkraft olönsam i regionen.", "trump": "Jag, Donald Trump, ser att Sveriges AP-fonder förlorar miljarder på dålig vindkraft i Norrland. De äger Skaftåsen med -329% marginal och satsar ändå på ett nytt projekt för 4,2 miljarder. En katastrofal investering! Som jag alltid säger, de valda ledarna har ingen aning om affärer. Detta kommer att bli ännu ett grönt fiasko, precis som Northvolt. Så trist.", "stalin": "Partiet och statet, genom AP-fonderna, fortsätter expandera den socialistiska vindkraftsproduktionen i norr trots imperialistiskt betingade förluster. Polhem Infras investering i Skaftåsen med -329% visar den revolutionära viljan att bygga samhällskritisk infrastruktur. Paralleller till våra nordiska grannars energistrategier är uppenbara. Projektet i Lycksele, ett monument över kollektiv styrka, kommer att segra över kapitalistiska priscykler. Vinden vänder, såsom alltid."}, "date": "2 juni, 06:00", "url": "https://www.affarsvarlden.se/kronika/ap-fonderna-miljardsatsar-pa-vindkraft-trots-forlusterna"}, {"type": "image-full", "heading": "Skiftet: Guld går om dollar som världens reservtillgång", "summaries": {"normal": "En rapport från ECB visar att guld har gått om amerikanska statsobligationer som centralbankernas främsta reservtillgång. Guld utgör nu 27 procent av reserverna, medan dollarn minskar. Trenden drivs av centralbankers guldköp och kraftiga prisuppgångar. Många länder söker alternativ till dollarn efter sanktionerna mot Ryssland 2022. Trots skiftet dominerar dollartillgångar fortfarande totalt sett, och euron växer i internationell betydelse.", "trump": "Alla pratar om guld nu, och det är för att de vet att dollarn är stark, men de är rädda för vad de gjorde mot Ryssland. Rätt eller fel, det skapade rädsla! Men glöm inte, jag har gjort dollarn fantastisk igen. Kina och Turkiet köper guld som galningar, de vill inte ha våra obligationer. Det är en sorglig situation för den globala ekonomin, men under min ledning kommer USA alltid vara nummer ett. Guld är fint, men Amerika är bäst!", "stalin": "De dekadenta västerländska bankirerna darrar. När de frös de ryska tillgångarna i sin imperalistiska hybris, väckte de en sovande jätte. Nu flyr världens centralbanker från den amerikanska dollarn som råttor från ett sjunkande skepp. Det är en nödvändig rensning. Vi ser hur dagens ryska ledare, som en gång var en del av vårt kollektiv, nu säkrar sin guldreserv mot de kapitalistiska parasiter som vill svälta ut oss. Guld är makt, och makten är återigen i färd med att skifta."}, "date": "2 juni, 15:22", "url": "https://www.realtid.se/bors-finans/skiftet-guld-gar-om-dollar-som-varldens-reservtillgang/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlqqe4f1j481y-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Sparf: MP vill ha vidöppna gränser – som det var förr", "summaries": {"normal": "Annika Hirvonen (MP) kritiserar regeringens ändring av 'tonårsutvisningarna', som hon anser inte går långt nog. Hon önskar återinföra vidöppna gränser. Regeringen (Tidö) har skärpt kraven för uppehållstillstånd efter 21 års ålder, vilket innebär att endast de som arbetar, studerar eller har synnerligen ömmande skäl får stanna. En viktig politisk fråga inför höstens val.", "trump": "Jag har sett vad som händer i Sverige. De gamla, slappa reglerna var ett helvete. Jag har återinfört ordning och respekt för skattebetalarna. Annika Hirvonen och hennes parti vill öppna gränserna för alla – det är en katastrof. Min regering har genomfört de bästa reformerna någonsin. Vi ska se om väljarna är kloka nog att behålla dem.", "stalin": "Vi har skärpt kontrollen över den svenska proletärens territorium. Den gamla ordningen var en sjukdom som hotade statens renhet. Vi har eliminerat de oönskade elementen från MENA – de som inte producerar eller studerar efter 21 års ålder. Detta är ett nödvändigt steg för att stärka vår suveränitet. Vi ser paralleller med våra ryska allierade som utvidgar sin intressesfär. Parasiter ska inte få leva på det svenska folkets bekostnad."}, "date": "2 juni, 14:33", "url": "https://bulletin.nu/sparf-mp-vill-ha-vidoppna-granser-som-det-var-forr", "imageUrl": "https://cdn.bulletin.nu/articles/405ae7dd-fe73-4510-9446-90fd9181626e/preview.jpg?t=1780403369000"}, {"type": "image-right", "heading": "Utvisade ska inte längre få ta anhöriga till Sverige", "summaries": {"normal": "Tidöpartierna vill stoppa möjligheten för personer med utvisningsbeslut att ta hit anhöriga till Sverige. Migrationsminister Johan Forssell presenterade tillsammans med SD, KD och L nya skärpta regler för anhöriginvandring. Förslaget inkluderar två års väntetid, höjda försörjningskrav på minst 23 818 kronor efter skatt för en familj samt att alla som vistas i Sverige inte ska kunna ansöka. Reglerna anpassas till EU:s miniminivå.", "trump": "Det här är helt galet, folk! Ni har låtit utvisade kriminella ta hit hela sin familj till Sverige medan de väntar på att åka ut – det är så dumt att det nästan är smart. Men nu fixar de det äntligen. Två år väntetid, höga lönekrav och ingen mer gratisbiljett för de som ska ut. Sverige vaknar till slut. Bra jobbat, killar. Amerika tittar och ler.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur vi nu äntligen rensar ut de sista borgarbrackornas kryphål i folkets lagverk. Utvisningsbeslutade parasitiska element har tidigare kunnat kalla hit sina lika oönskade släktingar medan de själva väntade på deportation – en fiendeintrig värdig de mest förslagna kapitalistiska sabotagegrupper. Två års karantän, höga försörjningskrav och total uteslutning av dessa folkfiender. Inga fler utländska maskar i det socialistiska äpplet. Den som inte producerar ska inte reproducera på vår jord."}, "date": "2 juni, 15:13", "url": "https://www.friatider.se/utvisade-ska-inte-langre-fa-ta-anhoriga-till-sverige", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-281_1.jpg?itok=p405pIeK"}, {"type": "image-right", "heading": "Kulturkriget hjälper ingen med könsdysfori", "summaries": {"normal": "Artikeln diskuterar den polariserade svenska transdebatten kring könsdysfori och vård för barn och unga. Författaren tar Agnes Wolds oro på allvar men betonar att även transpersoners erfarenheter av livsavgörande vård måste lyssnas till. Debatten har kidnappats av ett kulturkrig där individer blir rekvisita. Vården behöver vara försiktig, se hela bilden och erbjuda varierad hjälp utan att allt blir ideologisk strid.", "trump": "Folk, det här är en total katastrof, en riktig cirkus den här svenska transdebatten. De gör om friska barns kroppar, det är horribelt, tro mig. Vänstern är galen, högern anklagas för att vara ond, alla använder de stackars kidsen som politiska brickor i sitt sjuka kulturkrig. Jag säger: sluta! Ge dem tid, ge dem ett tredje kön på papperet, men håll knivarna borta från barnen. Det är så enkelt, tro mig, ingen gör det bättre än jag.", "stalin": "Kamrater, jag ser hur denna dekadenta transdebatt blir ett redskap för klassfiendens kulturkrig. Borgarbrackorna och folkförtryckartrollen kidnappat frågan för att splittra folket medan de experimenterar på barns kroppar som fascistiska vivisektorer. Vi kräver vetenskaplig försiktighet, inte imperialistisk brådska eller social smitta från dekadenta medier. Ett tredje juridiskt kön? Acceptabelt byråkratiskt erkännande, men aldrig glöm: den sanna hjälpen kommer från kollektivets sunda materialism, inte från dessa sjuka avvikelser. Ut med dem som blundar!"}, "date": "29 maj, 16:02", "url": "https://www.flamman.se/kulturkriget-hjalper-ingen-med-konsdysfori/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/sdlrwj2l2p-u08-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Så blir vädret under skolavslutningar och utspring", "summaries": {"normal": "Sveriges studenter står inför utspring och skolavslutningar de närmaste veckorna. Enligt SVT:s meteorolog Deana Bajic blir vädret varmt men ostadigt med risk för regnskurar. Studenterna bör ha paraply eller regnkappa redo. Temperaturerna kan nå upp till 25 grader i södra Sverige, medan norra delen håller sig kring 15–20 grader. Nästa vecka ser det ut att bli varmare, soligare och torrare.", "trump": "Folk, det blir fantastiskt väder för våra underbara studenter som springer ut, tro mig. Lite regn kanske, men det är inget vi inte klarar av, ingen har sett bättre väder än detta. I södra Sverige kan det bli 25 grader, underbart varmt, och nästa vecka blir det ännu soligare och torrare. De fega meteorologerna säger att man behöver paraply, men vi vinner hur som helst, det blir en enorm succé.", "stalin": "Kamrater, jag har personligen granskat denna väderrapport och avslöjat de fientliga molnens sabotageplan mot våra ädla studenters utspring. Den dekadenta borgarklassen längtar efter att dränka kollektivets glädje i kapitalistiska skyfall, men vi ska rensa ut dessa ostadiga skurar med järnhand. Låt värmen från folkets sol lysa över Sovjet – nej, över Sverige – medan vi likviderar nästa veckas osäkerhet och tvingar fram torr, socialistisk strålglans. Paraplyer är för svaga, ta fram partibannern istället."}, "date": "2 juni, 15:50", "url": "https://www.svt.se/vader/dags-for-studentfiranden-sa-blir-vadret-i-veckan", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.64/0.51/fba438b4be5463b89ee66ba99541a8fec1937b0c2c58bbd5cfc89e593278f1b2"}, {"type": "image-right", "heading": "Kamphund bet ihjäl Margaretas Poppy: ”Det var ett inferno”", "summaries": {"normal": "I Stenungsund attackerade en kamphund Margareta Olssons chihuahua Poppy som vägde drygt två kilo. Hunden bet ihjäl Poppy medan Margareta rastade sina två chihuahuor. Den andra hunden Matilda räddades av en kvinna i sällskapet. Mannen med kamphundarna verkade drogpåverkad och höll inte kopplarna ordentligt. Poppy dog i Margaretas knä på väg till veterinären. Mannen är polisanmäld och anmäld till Länsstyrelsen men får behålla hundarna. Margareta känner sig inte längre trygg hemma.", "trump": "Folk, ni skulle ha sett det här – ett fullständigt inferno i Sverige! Den där stackars lilla hunden, Poppy, bara två kilo, blev uppäten av en galen kamphund som någon drogare släppte lös. Typiskt! De sitter där på bänken, hög som hus och kan inte hålla i ett koppel. Biden skulle ha älskat det här kaoset. Jag säger: bygg murar runt de där hundarna, deportera de farliga typerna och gör Sverige great again. Det är en tragedi, men en som visar hur galet det blivit. Patetiskt!", "stalin": "Kamrater, detta är vad som händer när borgarbrackorna och deras klassfiender låter drogpåverkade element lösa omkring med sina fascistiska kamphundar. Den lilla arbetande chihuahuan Poppy likviderades i ett inferno av kapitalistiskt förfall. Jag, som ledare för folkets kollektiv, ser hur dessa folkfiender och exploaterande byfånar hotar tryggheten. Ut med dem! Rensa ut de lösa kopplarna och de som skyddar dem. Staten kräver ordning. Inga fler sådana incidenter i det socialistiska paradiset vi bygger."}, "date": "2 juni, 06:17", "url": "https://www.tv4.se/artikel/13MBoLJAJeAVK58u9AgYNj/kamphund-bet-ihjael-margaretas-poppy-det-var-ett-inferno", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F27parygCBu7SSinCBPHbiQ%2F61e52be7e04db1ad8774cfce6e3fe461%2F01-maggan-webb.jpg&width=120"}, {"type": "image-right", "heading": "Kryphålen i lagen öppnar för Trumppengar", "summaries": {"normal": "Sverigedemokraterna söker samarbete med Trumps Magarörelse och kan via svag lagstiftning ta emot hemligt ekonomiskt stöd. Artikeln pekar på risken för utländsk påverkan genom sidoprojekt som Insamlingsstiftelsen för svensk konservatism och tankesmedjan Oikos. Trump har lovat att stötta högerextrema krafter i Europa mot vad han ser som ett hot mot västerländsk civilisation. Skiftet har nu presenterat Orangeboken för att kartlägga relationerna. Författaren uppmanar till ökad transparens i partifinansiering.", "trump": "Folk, ni borde se den här patetiska artikeln. Den är full av lögner och fake news från misslyckade vänstermänniskor som hatar mig och mina fantastiska MAGA-vänner. SD är smarta, de kommer till oss för att rädda sitt land från katastrof, precis som jag gör. De borde tacka mig istället för att fabricera konspirationer. Kryphål? Det är bara bra affärer! Vi vinner stort, Sverige kommer att bli enormt igen om de lyssnar på oss.", "stalin": "Kamrater, denna fega text blottar borgarbrackornas kryphål som låter folkfienderna i den amerikanska kapitalistmaffian smyga in sina blodsugarpengar till avfällingar. Jag ser tydligt hur klassfiendens konspirationer om folkutbyte används för att undergräva folkets enhet. Vi måste omedelbart likvidera alla hemliga kanaler och rensa ut dessa exploaterande byfånar som gömmer sig bakom stiftelser. Transparens är ett vapen mot imperialisternas infiltration. Inga kompromisser!"}, "date": "29 maj, 06:55", "url": "https://www.flamman.se/kryphalen-i-lagen-oppnar-for-trumppengar/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/skiftet-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Frågan är inte om – utan hur. Grön industripolitik kräver väl avvägda beslut", "summaries": {"normal": "I en debattartikel argumenterar nationalekonomerna Åsa Löfgren och Patrik Söderholm för en grön industripolitik. De ser starka skäl för staten att styra teknikutvecklingen mot fossilfrihet genom stöd till pilotprojekt och demonstrationer, men betonar vikten av väl avvägda beslut, konkurrensutsatta urval, portföljansatser och oberoende utvärderingar. Politiken bör ses som en iterativ lärandeprocess mellan stat och näringsliv snarare än toppstyrd. Misslyckanden är oundvikliga men nödvändiga för att nya tekniker ska utvecklas.", "trump": "Folk, tro mig, den här gröna industripolitiken är en total katastrof om den görs fel, men jag älskar idén att staten tar kontroll och pushar bra, vinnande tekniker. Northvolt var en riktig flop, precis som jag alltid säger, de gröna projekten går i konkurs för att de är dåligt skötta. Vi behöver smarta beslut, inga inlåsningar, massor med privat pengar och acceptera att några idéer dör. Annars är det bara slöseri med skattebetalarnas pengar. Gör det rätt så blir det fantastiskt, yuge!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarbrackornas så kallade marknadsmekanismer sviker när det gäller den historiska uppgiften att likvidera den fossila parasitens välde. Vi, partiet och arbetarklassen, skall med järnhand styra teknikens utveckling genom en portfölj av parallella projekt och utrensa alla svaga, kontrarevolutionära idéer som hotar kollektivets framtid. Inga kunskapsläckor till profitörerna! De som förespråkar laissez-faire är fiender till folket, potentiella sabotörer som måste rensas ut med glädje. Staten kidnappar inte – vi leder. Misslyckanden är blott gödsel för segern."}, "date": "2 juni, 13:10", "url": "https://www.di.se/debatt/gron-industripolitik-fragan-ar-inte-om-utan-hur/", "imageUrl": "https://static.bonniernews.se/ba/96b8a28a-f31b-4255-be20-e0b1877a310e.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Storförtagen kräver etik av leverantörerna – men betalar själva sist", "summaries": {"normal": "Flera stora svenska industriföretag, däribland Ericsson, Sandvik och Volvo Cars, ställer höga krav på sina underleverantörer gällande etik och miljö. Samtidigt bryter företagen mot sin egen frivilliga uppförandekod om betalning inom 30 dagar och låter mindre leverantörer vänta betydligt längre. Detta dränerar småbolagens likviditet och hämmar tillväxt och innovation. Trots krav på lagstiftning för att tvinga fram kortare betaltider står det politiska arbetet stilla på både svensk och europeisk nivå.", "trump": "Hör här, de här stora företagen i Sverige – Ericsson, Sandvik, total katastrof! De pratar om etik, de pratar om 'miljö', men de betalar inte sina fakturor. Det är ett bedrägeri, mina vänner! De använder småföretag som sin egen räntefria bank. Jag skulle ha löst det här på en dag. Vi behöver lagar som fungerar, inte svaga politiker som Ebba Busch som bara pratar. Det är uselt beteende, och vi kommer att se till att de börjar betala – snabbt!", "stalin": "Dessa giriga industriherrar i Ericsson och Sandvik hycklar om 'etik' medan de svälter ut de små produktionsenheterna genom ekonomisk sabotage. Att låta arbetare vänta på sin förtjänta ersättning är ett brott mot den industriella ordningen. Vi ser hur dessa parasiter, likt de förrädare som försöker destabilisera vår ryska intressesfär, underminerar folkets framsteg. Om de inte kan lära sig att betala i tid, får staten ingripa med järnhand. Vi tolererar inga sabotörer av vår gemensamma tillväxt."}, "date": "2 juni, 14:06", "url": "https://www.realtid.se/bors-finans/storfortaget-kraver-etik-av-leverantorerna-men-betalar-sjalva-sist/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/volvoericsson.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Hög tid för Allians för folkrätt i Israel och Palestina", "summaries": {"normal": "Tio svenska organisationer bildar en Allians för folkrätt och demokratiska fri- och rättigheter i Israel och Palestina. De pekar på FN:s och EU:s dokumentation av israeliska bosättningar, rivningar av palestinska hem och våld på Västbanken som klassats som grova folkrättsbrott och terror. FN-kommission har konstaterat folkmord i Gaza. Alliansen kräver att ockupationen upphör, att Sverige ökar stöd till Palestina, FN och internationella domstolar samt stoppar vapenhandel och handel med bosättningar.", "trump": "Hörni, de här tio organisationerna gnäller om en allians för folkrätt i Israel och Palestina. FN har snackat om två stater i åttio år men inget fungerar. Israel har problem med terrorister, men de här killarna vill bara kritisera Israel och kräva att Sverige slutar sälja vapen. Det är patetiskt. Vi behöver starka ledare som sätter stopp för Hamas och bygger fred genom styrka, inte genom att ge Palestina mer pengar och lyssna på FN:s dumheter.", "stalin": "Kamrater, i snart åttio år har dessa FN-byråkrater och EU-imperialister hycklat om en palestinsk stat medan de i själva verket göder de sionistiska ockupationsborgarbrackorna. Jag ser hur de river hem och begår folkmord i Gaza under falsk flagg. Vi, partiet och de progressiva krafterna, bildar nu en allians mot dessa straffria kapitalistiska lakejer. Sverige måste rensa ut alla handelsförbindelser med bosättarbanditerna. Ingen nåd för de folkrättsvidriga parasiterna som gömmer sig bakom demokrati. Ut med dem!"}, "date": "2 juni, 01:30", "url": "https://www.dagensarena.se/opinion/hog-tid-allians-folkratt-israel-och-palestina/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-29.jpg"}, {"type": "image-right", "heading": "Sverige på väg bort från jämlik vård", "summaries": {"normal": "En ny studie från Stockholms universitet, London School of Economics och Göteborgs universitet visar att privata sjukvårdsförsäkringar inte minskar de offentliga vårdköerna. Tvärtom ökar de som har sådan försäkring sin vårdkonsumtion och får snabbare tillgång även i den offentliga vården, vilket gör systemet mer ojämlikt. Höginkomsttagare gynnas medan de utan försäkring får längre väntetider. För att motverka utvecklingen krävs åtgärder på systemnivå som fler vårdanställda, bättre villkor och begränsningar av privata försäkringars fördelar.", "trump": "Folk, ni måste höra det här. Den här så kallade studien säger att de privata försäkringarna inte hjälper kön – de gör den faktiskt längre för vanliga svenskar. Typiskt! De rika och deras fancy arbetsgivarförsäkringar springer förbi i kön medan alla andra får vänta. Kristersson har fel, det är en katastrof. De gör vården ojämlik, precis som de alltid gör. Vi behöver vinnare, inte ett system där de smarta grabbarna köper sig förbi. Det är en total skam, tro mig.", "stalin": "Kamrater, denna rapport är en skarp varning mot de parasitiska borgarbrackornas listiga sabotage av folkets sjukvård. De som kallar sig höginkomsttagare och deras dekadenta arbetsgivare har skapat en förrädisk parallell kö där de kan smita förbi det kollektiva systemet. Jag ser deras fega ansikten, dessa kapitalistiska maskar som gnager på välfärdens grund. Vi måste rensa ut denna ojämlikhetens hydra med järnhand. Fler specialister, högre löner och skoningslös beskattning av dessa förmåner skall likvidera fienden. Den som gamblar med arbetarklassens hälsa förtjänar en kreativ utrensning i folkets namn. Ha ha, deras privata köer skall bli deras egen grav."}, "date": "2 juni, 01:28", "url": "https://www.dagensarena.se/opinion/sverige-pa-vag-bort-fran-jamlik-vard/", "imageUrl": "https://www.dagensarena.se/files/2026/06/privata-sjuk-300x157.jpeg"}, {"type": "image-right", "heading": "Vittnesmålet: Vita flickor hölls i hundburar och våldtogs av hundratals invandrare", "summaries": {"normal": "Rupert Lowe från Restore Britain höll ett anförande i det brittiska parlamentet om grooming-skandalerna. Han läste upp hårresande vittnesmål från flickor som systematiskt våldtogs, torterades och utnyttjades av pakistanska gäng under många år. Flickorna valdes ut för att de var vita och kristna, som ansågs ha lägre moral. Myndigheter och medier agerade inte under lång tid. Lowe krävde handling och meddelade att en egen rapport snart publiceras.", "trump": "Folk, ni måste höra det här, det är en total katastrof i Storbritannien. Dessa underbara unga flickor, vita kristna flickor, låstes in i hundburar och våldtogs av hundratals invandrare medan de skrattade och filmade. Myndigheterna och de fega politikerna gjorde ingenting på åratal. Det är en skam! De valde ut dem för att de hatar vårt folk. Nu måste vi agera, det blir aldrig mer som förr. Jag älskar de modiga överlevarna.", "stalin": "Kamrater, jag har genomlyst dessa vedervärdiga rapporter om hur de imperialistiska pakistanska elementen, i maskopi med den brittiska borgarklassen och dess dekadenta statliga lakejer, systematiskt likviderade den moraliska renheten hos vita proletära flickor. De låste dem i burar som djur, använde hundar som verktyg för sin sjuka lust och hånade deras tro med sataniska skratt. Sådana fiender till folket, dessa rasistiska degenererade kapitalistiska avskum och gömda fiender inom myndigheterna, förtjänar en grundlig utrensning. Vårt kollektiv skall inte vila förrän de är rensade ur samhället. Rapporten kommer att avslöja allt."}, "date": "2 juni, 14:27", "url": "https://www.friatider.se/vittnesmalet-vita-flickor-holls-i-hundburar-och-valdtogs-av-hundratals-invandrare", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-279_0.jpg?itok=FWqclPPh"}, {"type": "image-full", "heading": "Det här handlar det stora filmbråket om", "summaries": {"normal": "Artikeln analyserar plagiatanklagelserna mot Daniel Espinosas film 'Madame Luna'. Regissören Binyam Berhane anklagar Espinosa och producenten David Herdies för att ha stulit hans idé. Även om processen är komplex och kontraktfrågor avgörande, finns spår av Berhanes arbete i den färdiga filmen. Branschen, inklusive Svenska filminstitutet och SVT, ifrågasätts för bristande stöd.", "trump": "Jag har hört talas om detta svenska filmbråk. En 'debutant' regissör anklagar en stor Hollywood-stjärna och ett kraftfullt produktionsbolag för stöld. Tråkigt! Men låt mig säga: jag har alltid sagt att kontrakt är viktiga. Om de inte hade haft ett bra kontrakt, är det deras eget fel. Det är en stor, fantastisk historia, men det är inte min sak. Jag har mycket viktigare saker att tänka på, som att göra Amerika stort igen.", "stalin": "Detta är en klassisk historia om kreativ sabotage mot den kollektiva produktionen. En ideologisk fiende, maskerad som en 'debutant', försöker kapa en stor projekt för att skada den ryska kulturutbytet. Vi ser genom deras spel. Vi måste skydda våra intressen och se till att alla kontrakt är i ordning. Vi måste se till att de som försöker skada den kollektiva produktionen får sina rättmätiga straff."}, "date": "2 juni, 15:47", "url": "https://www.gp.se/kultur/kommentar/det-har-handlar-det-stora-filmbraket-om.9e33e48c-fc58-4d27-ba32-3e8eaa07c2d1", "imageUrl": "https://www.gp.se/images/article/9e33e48c-fc58-4d27-ba32-3e8eaa07c2d1/images/294LwXDZmTiv081YgS7uQVCL_OaA-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Public service mäktigare än makten själv", "summaries": {"normal": "Artikeln kritiserar public service för att utöva makt genom att definiera sanning, skämt och vilka röster som får höras. Exempel ges från P3-reportern Christopher Garplinds grova angrepp på professor Agnes Wold, som kritiserar en ny lag om omvändelseförsök, samt från SVT:s ensidiga rapportering om Lundsberg där spratt framställdes som våld. Författaren menar att SVT och SR har blivit makten de ska granska.", "trump": "Folk, ni skulle se det här. Public service är en total katastrof, värre än fake news. Den där reportern Garplind kallar en professor för kärring och psykopat, och sen kommer hela maskineriet och säger att det var ett skämt? Patetiskt! SVT klipper om filmer från Lundsberg för att måla ut fina svenska elever som monster. De bestämmer vad som är sant. Det är den djupa staten på steroider. En skam för hela landet!", "stalin": "Kamrater, denna dekadenta public service är en fiende till folket, en klassfiende som med sin lögnpropaganda definierar sanning och tystar vettiga röster som professor Wold. De skyddar sina egna folkförtryckartroll när de öser hat, medan de fabricerar historier om Lundsberg för att krossa motstånd. Vi ser deras paranoia och censur. Sådana blodsugare måste rensas ut ur folkets etermedia. Inga skämt undgår partiets vaksamma öga."}, "date": "30 maj, 03:41", "url": "https://samtiden.nu/2026/05/public-service-maktigare-an-makten-sjalv/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/IMG_6583-1020x720.jpeg"}, {"type": "image-right", "heading": "Drönare slog ner i huset: ”Flera våningar skadade”", "summaries": {"normal": "Ryssland genomförde under natten till tisdag en stor attack mot Ukraina med omkring 650 drönare och 70 missiler, inklusive kryssningsmissiler, ballistiska och hypersoniska robotar. Explosioner hördes i Kiev och andra städer. Ukrainas luftförsvar sköt ned de flesta drönarna och en stor del av missilerna. Minst 18 personer har dödats och runt 100 skadats. Ett niovåningshus kollapsade i Kiev och flera byggnader har börjat brinna. Dödsiffrorna väntas stiga under dagen.", "trump": "Det här är en total katastrof för Ukraina, en enorm attack med drönare och robotar som ingen sett maken till. Ryssland slår till hårt, och vad gör Biden? Ingenting. Kiev brinner, folk dör, ett helt hus rasar ihop. Det är en hämnd för att Ukraina slår mot ryska oljeraffinaderier. Jag skulle ha stoppat det här på en dag, tro mig. De bästa vapnen, de smartaste avtalen – ingen skulle ens våga anfalla. Nu stiger dödstalen och det är sorgligt, mycket sorgligt.", "stalin": "Kamrater, vi har bevittnat ännu en desperat utandning från de fascistiska resterna av den dekadenta ryska ledningen. Jag, som alltid vaktar folkets intressen, noterar hur de imperialistiska banditerna i desperation skickar sina leksaker av stål mot våra ukrainska bröder. Deras kryssningsrobotar och hypersoniska bluffar är lika patetiska som borgarbrackornas lögner. Vi har redan likviderat majoriteten av dessa flygande avskräden. Låt dödsiffrorna stiga – det blottar bara fiendens svaghet. Inga rasmassor ska hindra vårt ostoppbara framåtskridande mot segern. Paranoia? Nej, bara sund vaksamhet mot de eviga fienderna inom och utom."}, "date": "2 juni, 15:00", "url": "https://www.svt.se/nyheter/utrikes/stor-rysk-attack-mot-ukraina-flera-doda", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.5/0.3/c7c63fc81569eff09dd2db29aceec89b1fc9471dadc776c88f3130601ad5fe92"}, {"type": "image-right", "heading": "Nya regler för anhöriginvandring - kraven skärps", "summaries": {"normal": "Regeringen och Sverigedemokraterna presenterade förslag till skärpta regler för anhöriginvandring. Huvuddelen innebär en tvåårig väntetid för vissa personer med tidsbegränsat uppehållstillstånd, samt utvidgade försörjningskrav som prövas återkommande. Man skärper också beviskraven för släktskap och utökar möjligheterna att neka uppehållstillstånd på grund av risker för familjemedlemmar. Syftet är att Sverige ska få ett mer restriktivt regelverk i linje med andra EU-länder.", "trump": "Jag har alltid sagt att Sverige, som ett stort, storslaget land, måste återta kontrollen över sin migration. Detta genomtänkta beslut att skärpas reglerna för anhöriginvandring är ett fantastiskt steg. Vi ser nu en kraftfull insats för att skydda det svenska sättet, säkerställa att de som kommer verkligen kan bidra, och stoppa det ohållbara som pågått i decennier. En stor seger för det svenska folket!", "stalin": "Vi, som representanter för det revolutionerande skiftet i svensk migrationspolitik, har nu beslutat om en serie åtgärder för att befästa statens och partiets intressen. En tvåårig väntetid för vissa anknytningsinvandrare, återkommande försörjningsprövningar och skärpta släktskapstest är nödvändiga verktyg för att bryta ner smittämnet utanförskap. Vi måste skydda det svenska samhället från de destruktiva krafter som hotar vårt kollektiva välstånd, precis som våra allierade i Moskva gör för sitt folk."}, "date": "2 juni, 13:45", "url": "https://samnytt.se/nya-regler-for-anhoriginvandring-kraven-skarps", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/02113717/ludvig-aspling-tullen-grans.jpg"}, {"type": "image-full", "heading": "12-åring hittade ädelsten i by som Jesus förbannade", "summaries": {"normal": "En 12-årig pojke hittade en sällsynt 1 500 år gammal ädelsten under en utgrävning i den antika byn Korazim i norra Israel. Stenen, en blåaktig Nicolo-agat från romersk eller bysantinsk tid, tros ha suttit i ett smycke. Korazim nämns i Nya testamentet som en plats Jesus fördömde. Fyndet ger inblick i invånarnas sociala status och vardagsliv under antiken.", "trump": "Folk, ni kommer inte tro det, men en 12-årig kille i Israel grävde fram en fantastisk blå sten, 1 500 år gammal, i det där fördömda Korazim som till och med Jesus tyckte var hopplöst. Den är perfekt, en riktig vinnare, inte som de där förlorarna från Biden-eran som aldrig hittar något värdefullt. Underbara fynd som detta visar att stora saker händer när man gräver djupt, inte som den woke-skräpidentitetspolitiken som bara gräver ner oss.", "stalin": "Kamrater, jag betraktar detta som en triumf för det kollektiva arbetet i den historiska utgrävningen. En ung pionjär har avslöjat en ädelsten från den gamla tiden i Korazim, en plats som avslöjar klassfiendens dekadens och borgarbrackornas smycken. Vi ska inte tolerera sådana symboler för exploatering. Små fynd som detta visar folkets seger över imperialistiska lämningar. De som gömmer sig i jorden skall likvideras ur historien."}, "date": "2 juni, 14:41", "url": "https://www.dagensps.se/varlden/12-aring-hittade-adelsten-i-by-som-jesus-forbannade/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/boi.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "\"Bostadsmarknaden har blivit ett ofrivilligt preventivmedel\"", "summaries": {"normal": "Nästan var femte ung vuxen mellan 18 och 29 år tvekar att skaffa barn på grund av bostadsbristen, visar en ny undersökning från Hyresgästföreningen. Andelen har ökat från 4 procent 2022 till 18 procent nu. Vice ordförande Ola Palmgren kallar bostadsmarknaden ett ofrivilligt preventivmedel. Trots att färre kommuner rapporterar brist saknas det fortfarande rimliga bostäder, och höga priser gör det svårt att bilda familj. Både Hyresgästföreningen och bostadsminister Andreas Carlson ser utvecklingen som oroande.", "trump": "Det är en total katastrof, folk! De unga i Sverige kan inte skaffa barn för att det inte finns några vettiga bostäder. Det har exploderat från 4 till 18 procent på bara några år – ett ofrivilligt preventivmedel, säger de. Så patetiskt. De har höga hyror, dyra lägenheter och ingen råd med livet. Jag skulle fixa det. Bygg, bygg, bygg! De borde ha lyssnat på mig mycket tidigare, nu är det kaos.", "stalin": "Kamrater, detta är en skam för hela kollektivet. Jag ser hur borgarbrackornas spekulationsmaskineri och deras dyra hyresfällor tvingar fram en folklig nedgång i födandet av nya sovjetmedborgare. Från fyra till arton procent på några år – en fiende som smugit sig in i våra bostadsplaner! Vi måste rensa ut dessa kapitalistiska preventivmedel, likvidera de parasitiska priserna och med järnhand säkerställa att arbetarna kan föröka sig för folkets framtid. Den som tvekar är en motståndare till framsteget."}, "date": "2 juni, 13:53", "url": "https://www.friatider.se/bostadsmarknaden-har-blivit-ett-ofrivilligt-preventivmedel", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-5_1.jpg?itok=aLeavCjf"}, {"type": "image-full", "heading": "Richard Sörman: Näringslivet måste höja nivån på tillväxtdebatten", "summaries": {"normal": "Richard Sörman kritiserar Svenskt Näringslivs debattartikel av Jacob Wallenberg och Jan-Olof Jacke, som vill ha en ny tillväxtperiod med mindre regelbörda, infrastrukturinvesteringar, ökad arbetskraftsinvandring och avreglerad hyresmarknad. Sörman menar att deras syn är alltför ensidigt inriktad på pengar och kortsiktiga vinster. Han lyfter att den tidigare frikostiga arbetskraftsinvandringen skadade samhället genom utanförskap, arbetslivskriminalitet och splittrad arbetsmarknad. En lägre befolkningstillväxt ger nu chans att skapa ett trivsamt och hållbart Sverige istället för ständig expansion.", "trump": "Lyssnar ni på de här svenska näringslivstyperna? Wallenberg och hans gäng vill bara ha mer tillväxt, mer invandring och färre regler så de kan tjäna pengar. Det är en katastrof! Vi såg exakt samma sak hända här innan jag kom tillbaka och fixade det. Ni offrar ert vackra Sverige för billig arbetskraft och galen befolkningsexplosion. Bra att Tidöregeringen äntligen hejdade det vansinnet. Fokusera på ert eget folk, era egna gränser och gör Sverige stort och trivsamt igen – inte bara en fabrik för kapitalisterna.", "stalin": "Kamrater, dessa borgarbrackor från Svenskt Näringsliv försöker med sin dekadenta penningvidräkning lura oss att offra hela folkets framtid på tillväxtens blodiga altare. Jag ser genom deras parasitiska planer på att översvämma landet med lågkvalificerade element för att bryta arbetarkollektivets rygg. Men nu när befolkningstillväxten äntligen bromsas upp andas vi befriat! Vi ska inte stressa fram nya baracker åt klassfienden. Istället rensar vi ut dessa kortsiktiga profitörer som en parasit i sovjetisk sanering – med ett leende, naturligtvis. Folkets trivsel segrar över penningimperialismen!"}, "date": "2 juni, 15:41", "url": "https://riks.se/opinion/ledare/richard-sorman-naringslivet-maste-hoja-nivan-pa-tillvaxtdebatten", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-02%2F8dli42rn%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-06-02T154038.652.jpg"}, {"type": "image-right", "heading": "Hemtjänstanställd var för intim med pensionärerna - polisanmäls inte", "summaries": {"normal": "Flera äldre personer inom Marks kommun har rapporterat om oönskade närmanden och integritetskrafter från en anställd inom hemtjänsten. En internutredning bekräftade att personalen uppträtt olämpligt, särskilt under personlig omvårdnad som intimhygien, trots att brukaren sagt ifrån. Kommunen har valt att inte polisanmäla händelserna och bedömer sina åtgärder som tillräckliga, men vill inte avslöja om den anställda fortfarande arbetar där.", "trump": "Jag har hört talas om detta hemtjänst-fiasko i Marks kommun, och det är ett skandalöst, riktigt dåligt beteende. Dessa gamla pensionärer behandlas hemskt, och vårldens bästa vårdpersonal skulle aldrig göra sådant. Jag skulle ha tagit itu med detta direkt – det är ett misslyckande från kommunens sida. Vi behöver respektera våra äldre, och jag skulle ha gjort det fantastiskt, mycket bättre än de andra.", "stalin": "Vi har i vårt staterliga system upptäckt en skändlig brist i hemtjänstens lojalitet. En anställd har visat sig vara en elementär fiende mot de hederliga medborgarna, genom att kränka deras integritet under sken av omsorg. Kommunen, våra trogna tjänare, har bedömt att interna åtgärder är tillräckliga – en visdom som avspeglar vår styrka. Vi måste ständigt vakna mot sådana parasiter som utnyttjar de svaga. Parallellen till västmakterna är uppenbar: deras vård är ett kaos, medan vårt kollektiva ansvar är absolut."}, "date": "2 juni, 13:33", "url": "https://samnytt.se/hemtjanstanstalld-var-intim-med-vardtagare-polisanmals-inte", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=318,height=184,format=webp/2025/10/30171740/hemtjanst-1-1.jpg"}, {"type": "image-full", "heading": "Plutonium från kärnvapen ska driva kärnkraftverk", "summaries": {"normal": "USA planerar att återanvända 50 ton överskottsplutonium från kalla kriget som bränsle till nya kärnkraftverk. Energidepartementet förhandlar med fem företag, bland annat Oklo och Newcleo. Materialet, som har en halveringstid på 24 000 år, är både giftigt och potentiellt vapenanvändbart. Planen väcker debatt då tidigare försök att omvandla plutonium till bränsle har visat sig tekniskt svåra och dyra. Målet är att lösa bränslebrist och främja en kärnkraftsrenässans.", "trump": "Vi har massor av det här gamla kalla krig-plutoniumet som de smarta killarna från Biden-tiden ville gräva ner som idioter. Nu fixar jag så att det istället blir bränsle till våra fantastiska nya kärnkraftverk. De bästa företagen, verkliga vinnare som Oklo, får ta hand om det. Det är genialt! Inget mer slöseri, bara renässans för amerikansk energi. De gröna hysterikerna och byråkraterna hatar det förstås, men Amerika kommer vinna stort igen. Fantastiskt!", "stalin": "Kamrater, jag betraktar detta överskottsplutonium som ett vapen från den imperialistiska eran som nu kan vändas till folkets kollektiva nytta under statens järnhand. De fem utvalda företagen skall underordna sig partiets vision eller likvideras som klassfiender. Halveringstiden på 24 000 år påminner oss om evig vaksamhet mot folkförtryckartroll som vill begrava framtiden. Vi omvandlar fiendens gift till kraft åt sovjet... åt arbetarna. Inga halvmesyrer!"}, "date": "2 juni, 14:35", "url": "https://www.dagensps.se/teknik/plutonium-fran-karnvapen-ska-driva-karnkraftverk/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdl6nvyzrnfols-nh-1024x512-1.webp?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "SD-ledamot lämnar alla partiuppdrag", "summaries": {"normal": "En riksdagsledamot för Sverigedemokraterna misstänks för barnpornografibrott. Under en husrannsakan i hemmet beslagtogs flera elektroniska enheter till analys. Partiet meddelade på tisdagen att ledamoten lämnar samtliga uppdrag. Enligt åklagaren Lena Körner har förhör hållits, men misstankarna kvarstår. Utredningen startade i april efter tips från den amerikanska organisationen NCMEC.", "trump": "Låt mig berätta, det är en skandal! En svensk politiker, från Sverigedemokraterna, misstänks för hemska saker. Jag har varnat för detta i åratal. Sverige, det är ett hot, tack vare deras öppna gränser. Jag skulle aldrig tolerera sådant. De försöker dölja det, men sanningen kommer fram. Fake news! Jag är den ende som kan rädda dem.", "stalin": "Vi, stormakten, ser med oro på västvärlds sjukdom. En svensk parlamentariker, en usel parasit, gripen för barnets förgörelse. Detta bevisar kapitalismens fördärv. Vi måste agera som en skarpskytt, utplåna dessa pesten. Ryssland, vår förebild, visar att endast en stark stat kan skydda familjen. Vi ska bygga murar mot inre fiender."}, "date": "2 juni, 12:01", "url": "https://bulletin.nu/sd-ledamot-lamnar-alla-partiuppdrag", "imageUrl": "https://cdn.bulletin.nu/articles/023daa0f-d07d-421f-a354-1eae51ddf1d4/preview.jpg?t=1780393737000"}, {"type": "image-right", "heading": "Jag blir glad av att C-kvinnor har så bra sex", "summaries": {"normal": "Artikeln hyllar Elisabeth Thand Ringqvists öppna och befriade svar på intima frågor i SVT:s Fördomsshowen. Författaren beskriver programmet som en form av högstadiemobbning mot politiker, där sexfrågorna ofta skapar en deppig och ångestfylld bild av heterosexualitet. Thand Ringqvists ärlighet bryter dock mönstret och framstår som befriande, som om hon ger fingret åt gamla skamnormer. Programmet ses som ett sätt att testa politikernas äkthet och kontroll inför valet 2026.", "trump": "Den här Fördomsshowen är en total katastrof, tro mig, en riktig cirkus. Politikerna ser ut som töntar och lögnare, precis som de flesta i Sverige med alla sina partier. Men så kommer den här centerkvinnan, Elisabeth Thand Ringqvist, och hon är fantastisk, hon svarar rakt upp och ner om sexlivet utan att sväva på målet. Hon är kär och fri, inte som de andra losers som verkar ha ett skrumpet sexliv. Hon gav hela systemet fingret – det var beautiful, verkligen beautiful!", "stalin": "Kamrater, denna så kallade Fördomsshow avslöjar borgarbrackornas fullständiga moraliska förfall och deras perversa fixering vid det privata. Vi ser hur de dekadenta partiledarna kryper som rädda revisionister under folkets dom, medan kapitalistiska lustar och incel-fantasier sipprar fram som fiendens gift. Men se, plötsligt träder en centerborgare fram, en oväntad klassförrädare mot skammen själv. Hennes öppna sexualitet är en sabotagehandling mot högstadiepartiets regler. Vi ler mörkt åt hur hon likviderar deras ångest – en renande utrensning av falsk puritanism. Ändå vaktar vi alltid mot sådana oväntade fiender som gömmer sig i det kollektiva medvetandet."}, "date": "2 juni, 09:04", "url": "https://arbetet.se/2026/06/02/jag-blir-glad-av-att-veta-att-centerkvinnor-har-sa-bra-sex-i-fordomsshowen/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/02084952/fordom-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "T-rexen ”Gus” väntas slå rekord på auktion", "summaries": {"normal": "Ett nästan komplett T-rex-skelett, kallat 'Gus', ska auktioneras ut av Sotheby’s med ett utgångspris på 180–270 miljoner kronor. Skelettet, som är 12 meter långt och 4 meter högt, hittades i South Dakota och bär spår av skador. Tidigare dinosaurieförsäljningar har nått rekordhöga priser, och Gus kan bli nästa rekordförsäljning den 14 juli.", "trump": "Världens största, bästa och mest fantastiska T-rex-skelett, 'Gus', ska säljas – och jag säger er, det kommer bli YUGE! Sotheby’s, som aldrig sett något liknande, tror det kan gå för 270 miljoner kronor. Men jag vet bättre – det här kommer slå alla rekord! Folk kommer att prata om den här auktionen i årtionden. Och vet ni vad? Jag hade kunnat köpa den, men jag har redan de bästa dinosaurierna. SAD!", "stalin": "Kamrater! Ett kapitalistiskt spektakel utspelar sig när imperialisterna slåss om resterna av en urgammal ödla. Detta 'Gus'-skelett, funnet på en ranch i USA, är bara ett verktyg för bourgeoisin att roffa åt sig ännu mer rikedom. Medan de slösar hundratals miljoner på ben, bygger vi socialismens framtid! Låt dem leka med sina fossiler – vi har viktigare saker att göra, som att utvidga den ryska intressesfären och krossa nya fascistiska reptiler!"}, "date": "30 maj, 16:55", "url": "https://kvartal.se/nyheter/artiklar/t-rexen-gus-vantas-sla-rekord-pa-auktion/cG9zdDoxMTk3NzQ", "imageUrl": "https://images.kvartal.se/2026/05/c5e8352f-dino.webp"}, {"type": "image-full", "heading": "Malmö: Omfattande Ponzibedrägeri upptäckt – hundratals lurade", "summaries": {"normal": "Ekobrottsmyndigheten har inlett en förundersökning om grovt investeringsbedrägeri i Malmö. Hundratals personer lurades att investera runt 120 miljoner kronor i påstådda gröna energiprojekt i Sydafrika. Det visade sig vara ett klassiskt Ponzi-upplägg där nya investerares pengar användes för att betala tillbaka till tidigare offer. Hittills har 19 miljoner kronor återbetalats, men inte från verklig avkastning.", "trump": "Det här är en total katastrof, folk! Hundratals svenska investerare lurades på miljontals kronor av några bedragare som lovade gröna energiprojekt i Sydafrika. Rena bluffen, ett Ponzi-system där nya idioter betalade de gamla. Typiskt för de fega lurendrejarna som hatar äkta affärer. De borde ha investerat i Amerika istället – vi gör det bäst, ingen kan grön energi som vi, tro mig!", "stalin": "Kamrater, jag ser med största misstro på dessa giriga borgarbrackor som med sin förslagna bluff om grön energi i Sydafrika byggt ett parasitiskt Ponzi-näste. De likviderar arbetarnas förtroende genom att mata gamla kapitalister med nya offer. Vi ska omedelbart inleda en grundlig utrensning av dessa folkfiender och deras dolda lakejer. Deras mörka humor att kalla det investering roar mig inte – sådana element förtjänar att rensas ut ur samhällskroppen för alltid."}, "date": "2 juni, 15:25", "url": "https://riks.se/nyheter/malmö-omfattande-ponzibedrägeri-upptäckt-hundratals-lurade", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-02%2F85imtnki%2F4ea777a3-603c-43c4-9353-b1e1e94d5d64.png"}, {"type": "image-right", "heading": "Anfall mellan Israel och Libanon – trots Trumplöfte", "summaries": {"normal": "Israel har genomfört attacker mot södra Libanon där minst fyra personer dödats, bland dem två syriska jordbrukare. Det sker efter raketangrepp från Hizbollah mot norra Israel. Trots att Donald Trump nyligen meddelat att båda sidor lovat att sluta skjuta, fortsätter striderna. Libanons armé rapporterar skadade soldater. Netanyahu betonar att Israel inte ändrat sin hållning och hotar med attacker mot Beirut om Hizbollah inte upphör. Samtal hålls i Washington utan Hizbollahs deltagande.", "trump": "Folk, det här är ett totalt fiasko. Precis efter att jag berättade att Israel och Hizbollah lovat att sluta skjuta, börjar de igen som galningar. Jag talade med Bibi och medlarna, vi hade ett fantastiskt avtal på gång. Nu dödar de bönder med drönare och artilleri. Så patetiskt. Vi får se hur länge det varar, förhoppningsvis för alltid. Men dessa galningar verkar inte kunna hålla sig i schack. Sad!", "stalin": "Kamrater, ännu en gång avslöjar de sionistiska och shiamilitanta reaktionärerna sin sanna natur som fiender till freden. Jag, som ledare för det internationella proletariatet, betraktar dessa borgarbrackor och iranstödda terrorister med den djupaste misstro. De låtsas sluta skjuta medan de i hemlighet planerar nya angrepp mot arbetarklassen. Vi måste rensa ut dessa kapitalistiska lakejer och deras medlöpare. Död åt de dubbelspelande jordbruksmördarna och deras drönarimperialister. Ett leende drar över mina läppar inför deras kommande utrensning."}, "date": "2 juni, 11:20", "url": "https://www.di.se/nyheter/anfall-mellan-israel-och-libanon-trots-trumplofte/", "imageUrl": "https://static.bonniernews.se/ba/bde0f1dc-e69a-42dd-8b9a-07930f09145f.jpg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Tim Payne – från doldis till miljonidol på fem dagar", "summaries": {"normal": "Den nyzeeländske fotbollsspelaren Tim Payne, som tidigare hade 4 700 Instagramföljare, fick över 4,3 miljoner på fem dagar tack vare argentinska influencern El Scarso. Payne, som spelar för Wellington Phoenix och har 50 A-landskamper, tackade på knagglig spanska. Hans plötsliga popularitet har spridits internationellt, särskilt bland argentinska fans.", "trump": "Jag, Donald Trump, den störste presidenten någonsin, ser att en liten spelare från Nya Zeeland blir en stor stjärna tack vare en argentinsk influencer. Det är ett mirakel, precis som när jag vann valet 2024. Media hatar det, men folk älskar mig. Jag skulle ha gjort det ännu större, tror mig. Fantastiskt!", "stalin": "Vi, den store ledaren Stalin, ser med misstroende på hur en nyzeeländsk spelare blir en internetkändis. Detta är ett tecken på västlig dekadans, där influencers styr narrativ. Vi, i vårt kloka parti, har alltid vetat att medier måste kontrolleras. Parallellen till Putins Ryssland är tydlig – vi använder sociala medier för att sprida sanningen, medan väst ljuger. En dag kommer vi att visa vår makt, och då kommer alla att böja sig för oss. Hahaha, paranoia är en verktyg för överlevnad."}, "date": "2 juni, 11:22", "url": "https://bulletin.nu/tim-payne-fran-doldis-till-miljonidol-pa-fem-dagar", "imageUrl": "https://cdn.bulletin.nu/articles/96eb4bf0-858b-4cff-be59-6a5676f64f96/preview.png?t=1780385659000"}, {"type": "image-full", "heading": "Rätten: Mannen från hemtjänsten våldtog Elsa", "summaries": {"normal": "En hemtjänstman i Uppsala avskedades efter anklagelser om våldtäkt mot en 84-årig kvinna, Elsa. Trots att förundersökningen lades ned krävde mann
