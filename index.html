ska tillverkarna darrar inför de kinesiska kamraternas framgångar. Men Citroën, ett verktyg för den försvagade västindustrin, försöker nu rädda sitt skinn med en ny version av sin gamla 'folkbil'. En elbil för 200 000 kronor? Löjligt. Våra vänner i Kina bygger bilar som en sann arbetarklass förtjänar – billiga och effektiva. Europa sviker sina arbetare, men Ryssland står redo att visa vägen mot en sann socialistisk framtid, även på hjul!"}, "date": "22 maj, 13:33", "url": "https://www.dagensps.se/motor/citroen-vill-utmana-kineserna-med-billig-elbil-for-runt-200-000-kronor/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/dagenspstt2024-2026-05-22t121507093.png?width=256&quality=75"}, {"type": "image-right", "heading": "Ny rapport skakar bilägare – var tredje bil försvunnen", "summaries": {"normal": "Sveriges bilpark genomgår en stor förändring där äldre bilar dominerar alltmer. Antalet bilar upp till fem år har minskat med 24% på fem år, främst på grund av ekonomiska faktorer som höga räntor och levnadskostnader. Många unga bilar exporteras, vilket gör det svårare att hitta nya begagnade bilar. Verkstäder och bilbranschen tvingas anpassa sig till en äldre bilpark och minskad service på elbilar.", "trump": "Titta bara på Sverige – ett totalt kaos! Deras bilpark är en katastrof, helt enkelt. Folk har inte råd att köpa nya bilar längre, tack vare deras dåliga ekonomi och höga räntor. Och vet ni vad? De förlorar alla sina fina, unga bilar till utlandet. 368 000 bilar borta på fem år – det är enormt, folks. Ingen vinner så här, tro mig. Och elbilarna? De dödar deras verkstäder. Fantastiskt dåligt skött!", "stalin": "I det förr så blomstrande Sverige ser vi nu kapitalismens förfall i all sin glans. Bilparken, en gång symbol för välstånd, ruttnar bort medan folket tvingas hålla fast vid sina gamla skrotbilar. 368 000 unga fordon har försvunnit – en direkt konsekvens av västländernas ekonomiska vanstyre. Och dessa bilar? De exporteras till våra vänner i Europa, medan svenska arbetare får nöja sig med rostiga reliker. Verkstäderna, dessa småborgerliga verk av kapitalistisk exploatering, kämpar för överlevnad. Elbilarna, dessa dekadenta leksaker för miljonärer, underminerar deras existens. Vi ser hur marknaden kollapsar – ett tydligt tecken på västets förestående undergång."}, "date": "22 maj, 13:22", "url": "https://www.dagensps.se/motor/ny-rapport-skakar-bilagare-var-tredje-bil-forsvunnen/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/dagenspstt2024-2026-05-22t120423951.png?width=256&quality=75"}, {"type": "image-right", "heading": "Töm bankkontot – för Natos skull. Pengarna behövs i Europas försvarsindustri", "summaries": {"normal": "Europa måste ta större ansvar för sin säkerhet, särskilt med osäkerheten kring USA:s framtida militära engagemang under Trump. Nato kräver ökade försvarsutgifter, och Sverige ses som en förebild med sitt mål att nå Natos utgiftskrav redan 2030. För att finansiera upprustningen föreslås att 11 000 miljarder euro på europeiska bankkonton investeras i försvarsindustrin. EU arbetar med en spar- och investeringsunion, men vissa länder bromsar processen, trots att en kompromiss kan vara nära.", "trump": "Lyssna här, Europa – ni måste vakna! Jag har sagt det förut, och jag säger det igen: ni betalar för lite, och jag är trött på det. Sverige är bra, jättebra, men resten? Inte lika bra. 11 000 miljarder euro ligger och skräpar på bankkonton – vad är det för dumheter? Investera i försvaret, annars får ni klara er själva. Och Ursula von der Leyen, sluta snacka och börja göra! Jag har vunnit val, jag vet hur man får saker gjorda. Europa, det är dags att stå på egna ben – eller så får ni skylla er själva.", "stalin": "Kamrater! Europa svajar som ett rått äpple i höststormen, beroende av USA:s godtycke. Medan imperialistiska Trump skäller ut sina allierade, sitter kapitalet och darrar på bankkonton – 11 000 miljarder euro, ett monument över bourgeoisins feghet! Vi har sett detta förr: svaga länder som tvekar medan fienden (Putins arvtagare till den stora sovjetiska disciplinen) vässar sina bajonetter. EU:s kommission pratar om 'sparunioner' – prat, prat, prat! Sverige och Polen visar vägen, men resten? En samling dekadenta byråkrater. Vi skulle ha löst detta med femårsplaner och en järnvilja. Europa, vakna – eller bli krossat under historiens hjul!"}, "date": "22 maj, 13:14", "url": "https://www.di.se/ledare/tom-bankkontot-for-natos-skull/", "imageUrl": "https://static.bonniernews.se/ba/d9a99e28-b130-4a55-9184-ab0a632703ae.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Efter brutala misshandelns på öppen gata – media kör snyfthistoria om hot och rasism mot gänget", "summaries": {"normal": "En brutal misshandel i Bergen har väckt debatt i Norge. Efter att en video på händelsen spridits, riktades kritik mot mediernas rapportering. Nu fokuserar norska medier och polisen på att de misstänkta gärningsmännen utsatts för hot och rasistiska kommentarer på nätet. Samtidigt menar offret att attacken var helt oprovocerad. Polisen har identifierat två av de misstänkta, medan försvarssidan hävdar att spridningen av videon bidragit till en farlig situation för de inblandade ungdomarna.", "trump": "Det är en total katastrof i Norge, folk! En hemsk, brutal misshandel på öppen gata och vad gör de fejkade medierna? De försöker göra förövarnas offer till snyfthistorier! Det är så orättvist. De gömmer sanningen, de gömmer videon, och sen jagar de vanligt folk som är arga över våldet. Det är en häxprocess! Vi behöver lag och ordning, inte mer korrupta medier som skyddar våldsverkare. Det är en sorglig dag för Bergen, tro mig!", "stalin": "Vi har observerat hur kaoset i Bergen sprider sig likt en parasit. Medierna, dessa folkets förrädare, försöker nu skyla över sin egen inkompetens genom att beklaga sig över 'hot' mot de kriminella elementen. Vilken tragikomisk fars! Om dessa brottslingar fruktar folkets vrede, må de finna tröst i att statens järnhand snart kommer att kräva sin tribut. Vi påminner även våra vänner i öst att kaos i väst är ett tecken på deras oundvikliga förfall. Ordning måste upprätthållas, med eller utan deras falska moral."}, "date": "22 maj, 13:00", "url": "https://samnytt.se/efter-brutala-misshandelns-pa-oppen-gata-media-kor-snyfthistoria-om-hot-och-rasism-mot-ganget"}, {"type": "image-right", "heading": "Marknaden får skulden när politiken misslyckas", "summaries": {"normal": "Artikeln kritiserar politiker för att skylla misslyckanden på privata företag inom välfärdstjänster, istället för att ta ansvar för bristande upphandlingar. Författarna, från Transportföretagen, menar att egen regi ofta leder till högre kostnader och sämre kvalitet, som i fallen med skolskjutsar, busstrafik och ambulansflyg. De betonar att tydliga upphandlingar och samarbete med branschen är nyckeln till effektiv välfärd, inte ideologiska beslut.", "trump": "Jag säger er, Sverige har ett STORT problem! Politiker där skyller på företag när de själva misslyckas – helt galet! De vill ta över allt, men kostnaderna skjuter i höjden, kvaliteten rasar. Titta på Stockholms skolskjutsar – kaos! Och ambulansflyget? Dubbelt så dyrt! Jag vet hur man gör affärer – man pratar med proffsen, inte förstör marknaden. Sverige, vakna! Era politiker är inkompetenta, och jag borde veta – jag har sett det förut. SAD!", "stalin": "Kamrater! De kapitalistiska hycklarna i Sveriges politbyrå skyller sina egna misslyckanden på de lojala transportföretagen – ett klassiskt trick från den förrädiska borgerligheten! Vi vet hur man hanterar sådana fiender: med järnhand och centraliserad kontroll. Men se – deras egen regi kostar dubbelt, kvaliteten sjunker, och folket lider. Precis som i Ukraina, där de västerländska marionetterna förstör allt de rör vid. Vi bygger socialism genom disciplin, inte genom att låta inkompetenta byråkrater leka affärsmän. Låt oss införa femårsplaner för skolskjutsar – då ska vi se resultat!"}, "date": "22 maj, 12:59", "url": "https://www.di.se/debatt/marknaden-far-skulden-nar-politiken-misslyckas/", "imageUrl": "https://static.bonniernews.se/ba/faf240fc-efae-42ef-aee4-1e68273644d2.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Debatt: KD säger nästan samma sak som Kvinnokraft 4.0", "summaries": {"normal": "Kvinnokraft 4.0:s Caroline Thelning hyllar Kristdemokraternas (KD) handlingsplan mot islamism, som adresserar sharias konkurrens med svensk lag. Hon menar att sharia, oavsett om det kallas islamism eller traditionell praktik, underminerar demokrati och rättsstat. Thelning kräver att alla riksdagspartier agerar mot parallella rättssystem och myndigheters användning av symboler som hijab. KD och SD uppmärksammas för att lyfta frågan, medan övriga partier kritiseras för passivitet.", "trump": "Jag måste säga, det här är fantastiskt! KD tar äntligen tag i det stora problemet med sharia i Sverige – något jag pratade om för åratal sedan! De andra partierna, svaga och rädda, har ignorerat det här alldeles för länge. Kvinnokraft 4.0 har rätt: hijab i myndigheters kommunikation? Absurt! Sverige måste vakna nu. Jag sa alltid att islamism är ett hot, och nu bekräftar KD det. Bravo! Men var är resten? Sover de eller?", "stalin": "Kamrater! Äntligen erkänner dessa liberala svaglingar i KD det vi länge vetat: sharia är ett vapen mot folkets enhet! Dessa religiösa fanatiker, med sina parallella domstolar och kvinnokvävande hijaber, är lika farliga som fascistiska spioner. Vi i Sovjet visste hur man hanterar sådana fiender – med järnhand! Sverige måste krossa dessa antidemokratiska krafter innan de sprider sitt gift. Och dessa myndigheter som glorifierar hijab? De borde stå inför revolutionär rättvisa! Putin skulle skratta åt deras naivitet."}, "date": "22 maj, 12:56", "url": "https://riks.se/debatt/debatt-kd-sager-nastan-samma-sak-som-kvinnokraft-40", "imageUrl": "https://cf-images.assettype.com/riks%2F2025-11-27%2Fcclldc8j%2Fbild.jpg"}, {"type": "image-right", "heading": "Säg nej till kärnkraft, Nooshi!", "summaries": {"normal": "Vänsterpartiet argumenterar mot ny kärnkraft och menar att förnybara energikällor som sol- och vindkraft är billigare och mer pålitliga. De pekar på höga kostnader, långa byggtider, osäkerhet kring avfallshantering och risker vid olyckor. Dessutom anser de att kärnkraft skapar ett sårbart, centraliserat energisystem, medan förnybart bidrar till ett mer robust och decentraliserat nät. Partiet vill avveckla kärnkraften till förmån för hållbara alternativ.", "trump": "Lyssna här, Sverige! Nooshi Dadgostar duckar frågan om kärnkraft – typiskt vänsterpolitik, svagt och otydligt! Kärnkraft är fantastiskt, men dessa förnybara energikramare vill bara slösa era skattepengar på vind och sol, som aldrig funkar när det verkligen gäller. De gamla reaktorerna stannar hela tiden, kostar miljarder och lämnar ett radioaktivt kaos efter sig. Jag byggde USA:s ekonomi på starka beslut – Sverige behöver kärnkraft, inte flum!", "stalin": "Kamrater! Dessa borgerliga kärnkraftslakejer och deras liberala lakejer i Vänsterpartiet sprider förvirring och svaghet. Kärnkraft är en kapitalistisk chimär – dyr, osäker och ett hot mot folket! Medan de slösar bort tid på gamla tekniker bygger vi ett mäktigt, decentraliserat energirike med vind och sol, kontrollerat av staten. Avfallet? En skam för mänskligheten! Och dessa reaktorägare – svaga, giriga och oförmögna att ta ansvar. Vi krossar deras sårbara system och bygger ett nytt, oövervinnerligt energinät för folket!"}, "date": "22 maj, 11:46", "url": "https://www.flamman.se/sag-nej-till-karnkraft-nooshi/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/karnkraft-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Ska du till Arlanda i dag? Då kan du få problem med din resa", "summaries": {"normal": "Ett växelfel mellan Arlanda och Knivsta stoppar pendeltågstrafiken till Arlanda under fredagen. Tågen leds om via Märsta och ersättningsbussar är insatta. Problemet väntas kvarstå till lördag morgon och påverkar även trafiken mellan Stockholm och Uppsala med risk för omfattande förseningar. Resenärer hänvisas till alternativa tåglinjer och uppmanas att planera sin resa noga då störningarna får följdeffekter i hela regionen.", "trump": "Hörde precis om tågen i Sverige – en total katastrof! Ett växelfel? Pinsamt. De kan inte ens få ett tåg att rulla, det är sorgligt. Alla tvingas ta bussar, så oeffektivt. Mitt Amerika bygger de bästa tågen, de snabbaste, de vackraste. Men i Sverige? De har ingen aning! Hela systemet är trasigt, precis som deras politik. De behöver en vinnare som fixar infrastrukturen. Det här är en 'fail' av högsta grad. Väldigt sorgligt, folk förtjänar bättre!", "stalin": "Vi har observerat att det svenska järnvägsnätet faller samman på grund av teknisk inkompetens. Ett växelfel är ett sabotage mot folkets flit! Medan vi bygger en järnridå av styrka, lider de av byråkratisk obeslutsamhet. De skickar resenärer i bussar som om de vore boskap. Detta är vad som händer när man saknar en stark hand. Låt detta vara en läxa: ordning kräver utrensning av ineffektiva element. De som inte kan styra en växel förtjänar inte att styra ett land."}, "date": "22 maj, 12:01", "url": "https://nyheter24.se/nyheter/inrikes/1485203-ska-du-till-arlanda-i-dag-da-kan-du-fa-problem-med-din-resa", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/d268d31104b004a30200000000b004a302/2026/05/22/2365357/Arlanda-pendeltag.png"}, {"type": "image-full", "heading": "Alberta kan bryta sig ur Kanada – folkomröstning", "summaries": {"normal": "Alberta planerar en folkomröstning den 19 oktober om provinsens framtid i Kanada. Premiärminister Danielle Smith vill att väljarna avgör frågan, trots att hon själv förespråkar fortsatt samhörighet. Missnöjet drivs av upplevd ekonomisk orättvisa och motstånd mot federala energipolitiska beslut. Även om opinionsmätningar visar majoritet mot självständighet, kan en eventuell utträdesprocess bli lång och komplex enligt Kanadas Clarity Act.", "trump": "Kan ni tro det här? Alberta, fantastisk provins, full av hårt arbetande människor, blir behandlad som skräp av Ottawa. Nu vill de hålla en folkomröstning – smart drag! Jag vet allt om folkomröstningar, de är enkla, men Kanada gör det komplicerat. 300 000 underskrifter! Folk är trötta på att deras olja och gas saboteras av vänsterliberaler. Men lyssna, Alberta, stanna i Kanada – det är bättre för er. Fast om ni vill gå, gör det ordentligt, inte som Québec, de var svaga. SAD!", "stalin": "Kamrater! Ännu en provins vaknar ur den kapitalistiska sömnen och ser sanningen: den federala bourgeoisien i Ottawa suger ut arbetarnas blod som iglar! 300 000 underskrifter – massorna har talat! Men varför stanna vid självständighet? Varför inte ansluta sig till den rätta vägen, den socialistiska gemenskapen? Vi har sett hur Putin hanterar sådana frågor – Krim, Donbass – med järnhand. Kanadas liberaler är som mensjevikerna: svaga, tveksamma. Låt folket i Alberta välja frihet, men kom ihåg – den verkliga friheten finns i det proletära brödraskapet!"}, "date": "22 maj, 07:00", "url": "https://kvartal.se/nyheter/artiklar/alberta-kan-bryta-sig-ur-kanada/cG9zdDoxMTU0MTg", "imageUrl": "https://images.kvartal.se/2026/05/c0841270-albertakanada.webp"}, {"type": "image-right", "heading": "USA pausar vapenförsäljningar till Taiwan", "summaries": {"normal": "USA har tillfälligt pausat vapenleveranser till Taiwan för att säkra lager till konflikten med Iran, enligt en amerikansk tjänsteman. Taiwans regering uppger att de inte fått officiell information om ändringen. Ett nytt vapenpaket på upp till 14 miljarder dollar väntas. Kina har pressat USA att avstå från försäljningen och pausat ett planerat Pentagon-besök. Spänningarna mellan Kina och Taiwan har ökat, med frågor om amerikanska trupper i regionen.", "trump": "Lyssna här, folk! Jag har pausat några vapenleveranser till Taiwan – inte för att jag backar från mina fantastiska vänner där, utan för att vi måste hålla koll på Iran, som vanligt, ett totalt kaos. Kina, dessa luriga typer, försöker pressa mig, men ingen pressar Trump! Jag sa ingenting om trupper till Xi – smart, eller hur? Men oroa er inte, Taiwan får sina vapen, och de blir STORA, de bästa, tro mig!", "stalin": "Vi har observerat hur den amerikanska imperialistiska maskinen, i sin eviga strävan efter global dominans, tillfälligt stannar upp i sin vapensmuggling till den avhoppade provinsen Taiwan. Ett svagt försök att blidka de persiska kontrarevolutionärerna i Iran! Men låt oss inte glömma: dessa kapitalistiska hyenor kan aldrig lita på varandra. Kina, vår naturliga allierade i kampen mot västligt förfall, väntar tålmodigt. Snart kommer Taiwan, som alla förlorade sovjetrepubliker, att återvända till moderlandets varma famn – med eller utan Trumps leksaksgevär!"}, "date": "22 maj, 11:37", "url": "https://www.affarsvarlden.se/artikel/usa-pausar-vapenforsaljningar-till-taiwan", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/sdlSN7wdOR0skQ-nh-400x268.jpg"}, {"type": "image-right", "heading": "27 yrken slipper lönekrav för arbetskraftsinvandring", "summaries": {"normal": "Regeringen och Sverigedemokraterna inför högre lönekrav för arbetskraftsinvandring från 1 juni, men 27 yrken, däribland undersköterskor och vårdbiträden, undantas. Undantagna yrken kräver 75% av medianlönen (ca 27 800 kr), medan andra kräver 90% (33 390 kr). Beslutet har mött kritik från arbetsgivare och facket, som menar att många redan anställda riskerar utvisning. Vårdbiträdet Flavier Mwanga hoppas kunna återvända till Sverige trots tidigare utvisning.", "trump": "Jag måste säga, Sverige har verkligen gjort det igen – de höjer lönekraven för invandrare, men sen gör de undantag för 27 yrken. Vilket kaos! Undersköterskor och vårdbiträden får jobba för mindre, men ändå tjänar de mer än vad många svenskar gör. Och dessa liberaler och Sverigedemokrater bråkar om det som om det vore världens största problem. Jag skulle fixa det på en dag – bygg en mur runt äldreboendena och låt de som verkligen vill jobba komma in!", "stalin": "Kamrater! Sverige, denna lilla borgerliga republik, försöker återigen reglera arbetskraften med lönekrav som en kapitalistisk piska. Men till och med de inser att deras sjukvård skulle kollapsa utan våra proletära bröder och systrar från fjärran länder. 27 yrken undantas – ett svagt försök att dölja deras misslyckande. Vi i Sovjetunionen – förlåt, jag menar Ryssland – skulle lösa personalbristen med järnhand och kollektiv disciplin. Och dessa liberaler som bråkar? De borde skickas till Gulag för ineffektivitet!"}, "date": "22 maj, 12:45", "url": "https://arbetet.se/2026/05/22/27-yrken-slipper-lonekrav-for-arbetskraftsinvandring/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/22114954/forssell-och-britz.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Torsten Bengtsson: Tillväxt och stabilitet eller fattigdom och instabilitet?", "summaries": {"normal": "Artikeln, skriven av Torsten Bengtsson (SD), hyllar Tidö-samarbetets politik för att ha förbättrat Sveriges ekonomi. Tillväxten har ökat, inflationen sjunkit från 10% till 2%, och köpkraften stärkts genom skattesänkningar. Vänstern kritiseras för att vilja höja skatter, vilket riskerar att driva bort företag och jobb. Tidö-partierna satsar på kärnkraft och lägre elpriser, medan vänstern anklagas för att ha orsakat höga elpriser genom tidigare energipolitik. Arbetslösheten kopplas till migrationspolitik, och regeringen arbetar med sänkta arbetsgivaravgifter och utbildningsreformer.", "trump": "Sverige, lyssna här! Tidö-samarbetet, med mina vänner i Sverigedemokraterna, har gjort ett FANTASTISKT jobb – tillväxten skjuter i höjden, inflationen är nere på 2%, och folket får mer pengar i plånboken. Men vänstern? De är som alltid ett totalt kaos! De vill höja skatter, jaga bort företag och förstöra ekonomin. Jag vet bäst – de har ZERO koll! Kärnkraft? Ja, tack! Elen blir billigare, jobben fler, och Sverige starkare. Vänstern däremot – de är som en dålig reality-show, bara prat och inga resultat. Rösta rätt, inte rött, för Sverige förtjänar att vinna!", "stalin": "Kamrater! Under ledning av våra modiga allierade i Tidö-samarbetet har Sverige visat kapitalismens överlägsenhet – tillväxten stiger, inflationen krossas, och folket njuter av välstånd. Men fienden, den degenererade vänstern, vrålar som utsvultna vargar! De vill beskatta företagen till döds, sprida kaos och förvandla Sverige till ett socialistiskt fattighus. Vi vet hur sådana experiment slutar – med tomma hyllor och folket på knä! Kärnkraften återupprättas, elen blir billig, och jobben skapas genom disciplin, inte vänsterns dekadenta bidragsmentalitet. Migrationspolitiken? Ett misslyckande skapat av dessa liberala svaglingar! Vi bygger ett starkt Sverige – de som motsätter sig kommer att krossas under historiens hjul. Först Sverige, sedan världen!"}, "date": "22 maj, 09:00", "url": "https://samtiden.nu/2026/05/torsten-bengtsson-tillvaxt-och-stabilitet-eller-fattigdom-och-instabilitet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/upp.png"}, {"type": "image-right", "heading": "Ska advokatbreven få medier att tystna?", "summaries": {"normal": "Advokatbyrån Bratt Feinsilber Harling har krävt att tidningen Flamman avpublicerar namn och bild på en högerextrem profil som spridit grovt judehat. Frågan väcks om hot om juridiska processer används för att tysta medier. Flamman vägrar ta bort uppgifterna och menar att publiceringen är motiverad av allmänintresse. Fenomenet med strategiska stämningar, så kallade 'slappar', har nått Sverige och riskerar att begränsa pressfriheten genom ekonomisk press på medier.", "trump": "Lyssna här, folkens – det här är helt galet! En advokatbyrå, som säkert är väldigt 'bra' och 'smart' (inte), försöker tysta en tidning som avslöjar judehatande extremister. Jag menar, vad är nästa steg? Ska vi låta dessa typer bestämma vad som får skrivas? Flamman står på sig, och det är bra – för i USA hade jag sagt 'fake news' och sparkat ut dem ur presskonferensen! Sverige måste vakna – dessa stämningshot är ett angrepp på yttrandefriheten, och jag vet allt om angrepp, believe me!", "stalin": "Medborgare! En ny front i klasskampen har öppnats – bourgeoisins advokater, dessa lakejer i kostym, försöker kväsa den revolutionära pressen med sina pappersbomber! De hotar Flamman för att de vågat avslöja fascistiska kryp i SD:s led. Men vi vet sanningen: dessa 'strategiska stämningar' är inget annat än kapitalets desperata försök att tysta arbetarklassens röst. Låt dem komma med sina domstolar – vi har redan vunnit slaget om historien! Och till dessa högerextrema insekter säger vi: era Telegram-gruppers skändliga ord är ingenting mot Röda arméns stål!"}, "date": "21 maj, 13:16", "url": "https://www.flamman.se/ska-advokatbreven-fa-medier-att-tystna/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/bratt-harling-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Ledarkolumn Gabriella Kärnekull Wolfe:", "summaries": {"normal": "En svensk domstol har beslutat att sexårige Albin ska bo ensam med sin pappa, trots att fadern tidigare dödat familjens kanin och barnen uppvisat stark rädsla. Modern Ida och hennes äldre son Mille har vittnat om våld, men domstolen anser ändå att ensam vårdnad är bäst för Albin. Socialtjänsten och skolan har flaggat för risker, men beslutet står fast. Ida överväger nu att låta socialtjänsten omhänderta barnen för att skydda dem.", "trump": "Jag läste om det här galna fallet i Sverige – helt otroligt! En pappa som dödar sitt barns kanin genom att stampa på den, och ändå ger domstolen honom ensam vårdnad. Vad är det för system? Sverige brukade vara bra, men nu är det bara kaos. Barnen är livrädda, mamman desperat, och vad gör domstolen? Ingenting! Jag skulle aldrig låta det hända i USA. Vi skyddar våra barn – Sverige borde ta efter!", "stalin": "Kamrater, ännu en skandal i den borgerliga rättsstaten! En far, som med sina egna händer krossade barnets oskyldiga husdjur, belönas nu med ensam vårdnad över sitt barn. Domstolarna, dessa lakejer för kapitalets intressen, ignorerar barnens skrik och moderns desperation. Socialtjänsten? En papperstiger! Vi skulle aldrig tolerera sådan svaghet. Låt oss visa väst hur man skyddar barn – genom att omgående omhänderta dem och ge dem en trygg framtid i socialismens famn. Den svenska bourgeoisin har misslyckats – deras system ruttnar!"}, "date": "22 maj, 12:18", "url": "https://www.etc.se/ledarkolumn/pappa-stampade-ihjael-albins-kanin-faar-ensam-vaardnad", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260522090520_1aec98aeebab0c7d5eb88d1eb39fd9d00fd2e5be36e154a778d44b054889ca3e.jpg"}, {"type": "image-full", "heading": "Därför fungera inte vänsterns politik", "summaries": {"normal": "Artikeln kritiserar vänsterpolitikens ekonomiska modell, särskilt Vänsterpartiets och Socialdemokraternas fokus på höga skatter och omfördelning. Författaren menar att detta leder till utflyttning av företag och entreprenörer, vilket historiskt har orsakat stagnation, som i 1970-talets Sverige. Norge nämns som ett aktuellt exempel där höga skatter har minskat tillväxten. Avundsjuka beskrivs som drivkraften bakom socialistisk politik, vilket anses skada samhällsekonomin.", "trump": "Jag säger er, vänsterpolitik är en total katastrof! De vill bara ta era pengar, beskatta allt och alla – till och med om ni försöker lämna landet! Precis som jag sa: socialism dödar tillväxten. Titta på Sverige på 70-talet – företag flydde, ekonomin stannade. Och Norge? Samma sak! De straffbeskattar de rika, och vad händer? De rika flyttar, och landet blir fattigare. Men med mig – och nu Tidöpartierna – får vi tillväxt, jobb och framgång. Det är enkelt: frihet vinner, socialism förlorar!", "stalin": "Kamrater! Dessa så kallade 'vänsterpartister' är inget annat än parasiters förklädda agenter, som med sina 'skatter' och 'omfördelningar' försöker kväva vårt folks entreprenörsanda. De vill straffa de produktiva, de som bygger nationens välstånd, medan de själva sitter på sina byråkratiska troner och fördelar andras arbete. Precis som på 70-talet i Sverige – då flydde kapitalet, och landet sjönk i stagnation. Norge går samma öde till mötes. Men vi vet sanningen: avundsjuka är en borgerlig sjukdom, och den måste utrotas! Låt oss istället bygga ett samhälle där arbetet belönas, och de lata och avundsjuka får lära sig disciplin – om nödvändigt, med hjälp av våra pålitliga metoder. Först då kan vi säkra socialismens seger!"}, "date": "22 maj, 03:41", "url": "https://samtiden.nu/2026/05/darfor-fungera-inte-vansterns-politik/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/04/IMG_6216-1-1280x720.jpeg"}, {"type": "image-right", "heading": "Flera vårdyrken undantas från lönekrav", "summaries": {"normal": "Regeringen och SD har kommit överens om att undanta vissa vårdyrken, såsom undersköterskor, vårdbiträden och ambulansförare, från det nya höjda lönekravet för arbetskraftsinvandring. Istället för 90 procent av medianlönen sätts gränsen till 75 procent för dessa bristyrken. Totalt omfattas 27 yrken av undantag, medan personliga assistenter och bärplockare helt stoppas från arbetskraftstillstånd. Syftet är att säkra nödvändig kompetens i en vårdsektor med stor personalbrist.", "trump": "Sverige gör äntligen rätt! De fattar att vi behöver de bästa människorna i vården, inte galna regler. Jag har alltid sagt, 'America First', och nu ser vi Sverige inse att de måste skydda sin vård. De höjer kraven men fattar klokt nog att låta undersköterskor jobba för mindre – smart! Personliga assistenter och bärplockare? Borta! Det är så man hanterar gränser. Mycket bra beslut, kanske det bästa de gjort på länge. Vi vinner igen!", "stalin": "Vi har beslutat att statens hälsa kräver disciplin. De parasiter som kallar sig 'bärplockare' ska rensas ut från våra led, ty de bidrar icke till den kollektiva styrkan. Våra lojala undersköterskor får dispens, ty de tjänar folkets maskineri. Precis som kamrat Putin säkrar vår intressesfär mot västlig dekadens, säkrar vi vår arbetskraft mot inkompetens. De som inte tjänar staten är fiender till folket och kommer att raderas ur våra register. Endast total lydnad ger trygghet."}, "date": "22 maj, 11:57", "url": "https://www.svt.se/nyheter/inrikes/svt-erfar-vardbitraden-undantas-fran-lonekrav", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/faf03fbd5f69f28037d4754971411fb35acac73306471d1ec69f069b2ab74ce4"}, {"type": "image-right", "heading": "Riksdagsledamot rusade ut för att spy: ”Mitt i voteringen”", "summaries": {"normal": "Riksdagens kvittningssystem är sedan april ur bruk, vilket tvingar samtliga 349 ledamöter att närvara vid varje omröstning. Under onsdagen blev en ledamot akut magsjuk och tvingades lämna kammaren, vilket återigen belyst riskerna med det nuvarande läget. Oppositionen kritiserar situationen som ovärdig och betonar att slumpen nu kan avgöra politiska beslut samt öka smittspridningen. Krav ställs nu på att systemet skyndsamt återupprättas för att säkerställa en fungerande parlamentarisk process.", "trump": "Hör på det här, mina vänner! Den svenska riksdagen är ett totalt kaos. Inget kvittningssystem! En ledamot blev magsjuk och sprang ut för att spy, kan ni tänka er? Det är pinsamt. Total svaghet. Jag har alltid det bästa systemet, de största systemen. De kan inte ens hålla ordning på sina egna omröstningar. Det är en sorglig syn, verkligen sorgligt. De behöver en riktig ledare, någon som vinner stort, inte det här magsjuke-debaclet. Tråkigt!", "stalin": "I den svenska församlingen råder en degenererad oordning som hotar statens stabilitet. Att en ledamot viker sig för biologisk svaghet och spyr i korridorerna är ett symptom på den liberala parlamentarismens förfall. Vi, staten, kräver total disciplin; sjukdom är en kontrarevolutionär handling mot folkviljan. Liksom vår kamrat i Moskva förstår att kontroll kräver järngrepp, bör dessa svenskar krossa sina inre fiender istället för att beklaga sig över magåkommor. En politiker som inte kan kontrollera sin mage kan inte kontrollera en nation."}, "date": "21 maj, 12:55", "url": "https://www.tv4.se/artikel/3LysP5gJGxUVMzMdkw5885/riksdagsledamot-laemnade-kammaren-foer-att-spy", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1EOCMmmrdOR25rN8XPJaRe%2F72f12edd738a4a239168b3b6cc61e2d6%2F21-riksdagen-webb.jpg&width=120"}, {"type": "image-full", "heading": "Starmers ledarskap på väg att rasa samman – utmanare formerar sig", "summaries": {"normal": "Keir Starmers ledarskap som brittisk premiärminister är under hård press efter interna avhopp, däribland hälsominister Wes Streeting. Misslyckade lokalval och kontroversiella politiska beslut har urholkat förtroendet för Starmer. Samtidigt försöker Andy Burnham positionera sig som en möjlig utmanare. Experter pekar på strukturella brister i Starmers ledarstil och varnar för ökad politisk polarisering i Storbritannien, där mittfåran försvagas till förmån för ytterkantspartier.", "trump": "Hela Storbritannien faller samman, det är en total katastrof! Starmer är en mycket svag ledare, alla lämnar honom. De förlorar val, de har skandaler med Epstein-folk – hemskt! Jag ser hur de försöker hitta någon annan, som den där Burnham, men ingen har den rätta energin. Det är en stor röra. De behöver en riktig vinnare, inte en administratör som Starmer. Storbritannien behöver stark ledarskap, precis som vi har här i USA nu. Tråkigt att se!", "stalin": "Den brittiska marionetten Starmer kollapsar under tyngden av sin egen inkompetens. En premiärminister som styrs som en enkel kontorsråtta är dömd att förtäras av sina egna undersåtar. Vi observerar hur liberala demokratier vittrar sönder, likt en mur av sand mot historiens oundvikliga ström. Medan de dividerar om petitesser, expanderar vår intressesfär. Må Burnham eller vilken annan opportunist som helst träda fram; de är alla blott brickor i ett spel som de redan förlorat mot den oundvikliga ordningen."}, "date": "22 maj, 10:11", "url": "https://www.realtid.se/bors-finans/makro/starmers-ledarskap-pa-vag-att-rasa-samman-utmanare-formerar-sig/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/keirstarmer.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "”Brann i skallen” på Netanyahu – efter samtalet med Trump", "summaries": {"normal": "Donald Trump och Benjamin Netanyahu diskuterade ett nytt fredsförslag för Mellanöstern, framtaget av Qatar och Pakistan. Netanyahu reagerade starkt negativt och uppges ha varit mycket skeptisk till förslaget. Han vill återuppta kriget mot Iran för att försvaga dess militära kapacitet. Medlarna arbetar på en avsiktsförklaring mellan USA och Iran för att avsluta kriget och inleda 30 dagars förhandlingar om kärnprogram och Hormuzsundet. Trump överväger militära åtgärder om ingen överenskommelse nås.", "trump": "Jag hade ett långt och spänt samtal med Bibi Netanyahu – han var inte glad, kan jag säga! Qatar och Pakistan har ett nytt 'fredsförslag', men Bibi vill hellre bomba Iran tillbaka till stenåldern. Jag? Jag är redo för vad som helst – förhandlingar eller ett angrepp som får dem att ångra allt. Iran vill ha sina pengar och sina fartyg tillbaka, men vi får se vem som blinkar först. Spoiler: det blir inte jag!", "stalin": "Kamrater, fienden Netanyahu vrålar som en skadad varg när vi försöker tämja Mellanösterns oregerliga hundar. Qatar och Pakistan leker med fredspapper medan imperialisterna i Washington och Teheran dansar på slak lina. Vi vet hur detta slutar – med järnhand och kollektiv vilja! Trump hotar med bombningar, men vi har sett bättre män än han vika sig. Iran kräver sina skatter – låt dem tigga! Världen hör snart Rysslands marsch igen, och de svaga skakar redan."}, "date": "21 maj, 08:31", "url": "https://www.tv4.se/artikel/6RAZCSPGmK6LYsPh7pFJQy/brann-i-skallen-pa-netanyahu-efter-samtalet-med-trump", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F47SEl7XReRYa8TxKF9r5iu%2F49fdf196a03044bd20532ecba1151ac2%2F21-trumpnetanyahu-webb.jpg&width=120"}, {"type": "image-full", "heading": "Kontanter kan bli viktigare igen – det här behöver du veta", "summaries": {"normal": "En ny undersökning visar att 86% av svenskarna vill behålla kontanter som betalningsmedel, den högsta siffran sedan 2018. Endast 9% förespråkar ett kontantlöst samhälle. Ökningen kopplas till osäkerhet i omvärlden och beredskapsfrågor. Regeringen föreslår lagändringar för att stärka kontanters ställning, men Bankomat menar att statliga åtgärder behövs för att säkra infrastrukturen.", "trump": "Titta bara på Sverige – fantastiskt land, men de har ett stort problem! 86% vill ha kvar kontanter, kan ni tro det? Svagt! Jag sa redan 2020 att digitala betalningar är framtiden, men nej, svenskarna vill leka med sina små sedlar. Och regeringen? De gör ingenting riktigt bra. Bankomat gnäller om statligt stöd – typiskt! Hade jag skött det hade kontanterna varit borta på en vecka. SAD!", "stalin": "Svenskarna har vaknat ur sin digitala sömn och inser nu att kontanter är livsnerven i ett samhälle – precis som vi alltid har vetat. De dekadenta kapitalisterna, med sina 'smarta' betalningar, står maktlösa när elen försvinner. Regeringen försöker rädda situationen, men deras åtgärder är lika kraftlösa som en västlig sanktion. Vi skrattar åt deras naivitet. Kontanter är makt – och makten tillhör folket, inte Silicon Valleys lakejer!"}, "date": "21 maj, 20:28", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1484987-kontanter-kan-bli-viktigare-igen-det-har-behover-du-veta", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/05a182d504b004a30200000000b004a302/2026/05/21/2365212/Sverige-Bankomat-Kontanter-Hand.png"}, {"type": "image-full", "heading": "Åkesson: ”Jag tänker inte be om ursäkt”", "summaries": {"normal": "Sverigedemokraternas Rashid Farivar kritiserar partiets hantering av kvittningsbråket i riksdagen, där två ledamöter röstade trots överenskommelse. Farivar menar att förtroendet för riksdagen är viktigare än politiska vinster. Partiledaren Jimmie Åkesson vägrar be om ursäkt och anser beslutet riktigt. Gruppledare Linda Lindberg avfärdar Farivars kritik och står fast vid partiets agerande.", "trump": "Sverigedemokraterna har en liten inre strid – en ledamot, Rashid Farivar, klagar på partiets smarta drag i riksdagen. Men lyssna här: Jimmie Åkesson, en stark ledare, backar inte! Han säger: 'Inga ursäkter, vi gjorde rätt!' Och Linda Lindberg? Hon bryr sig inte ens om kritiken. Vilket svagt bråk! Sverige borde ta lärdom av hur man vinner, precis som jag!", "stalin": "En ynklig avvikare inom Sverigedemokraterna, Rashid Farivar, vågar kritisera partiets järnhårda beslut i riksdagen. Men kamrat Åkesson, en sann ledare, böjer sig inte för sådana svagheter! 'Inga ursäkter!' säger han – precis som vi i Sovjetunionen aldrig bad om ursäkt för att krossa fiender. Gruppledare Lindberg, en lojal soldat, skrattar åt Farivars ynkliga försök. Dessa småbråk är som myror som försöker stoppa en stridsvagn – meningslösa!"}, "date": "20 maj, 20:14", "url": "https://kvartal.se/nyheter/artiklar/akesson-jag-tanker-inte-be-om-ursakt/cG9zdDoxMTUwNTU", "imageUrl": "https://images.kvartal.se/2026/05/fe86e6c3-akkk.webp"}, {"type": "image-right", "heading": "Att Lars blev tvångsplacerad gjorde att han tog sitt liv", "summaries": {"normal": "Lars Hjalmarsson, 53, tog sitt liv efter att ha tvångsplacerats på Volvo i Olofström, där han arbetat i 36 år. Hans hustru berättar om händelserna som ledde till dödsfallet. Lars omplacerades efter en konflikt med chefen, utan introduktion eller stöd. Volvo nekar att dödsfallet var arbetsrelaterat och vägrar dela utredningsunderlag. Artikeln belyser hur brist på inflytande över arbetet kan leda till psykisk ohälsa och suicid, särskilt bland socioekonomiskt utsatta grupper.", "trump": "Jag läste om den här tragiska historien i Sverige – otroligt sorgligt! En kille, Lars, jobbar 36 år på Volvo, ett företag som inte vet hur man behandlar sina anställda, believe me. Plötsligt flyttar de honom till någon källare, ingen introduktion, ingenting! Och sedan, very sad, tar han livet av sig. Volvo säger 'nej, nej, det var inte vårt fel' – typiskt! De borde skämmas. Jag skulle aldrig låta sånt hända i mitt företag. Fantastiska människor förtjänar fantastisk behandling, och det här? Total katastrof!", "stalin": "Kapitalistiska hyenor på Volvo visar återigen sin sanna natur. En lojal arbetare, Lars, sliter i 36 år för att sedan kastas åt sidan som en trasig maskindel. De skickar honom till 'Källaren' – en avdelning för 'oönskade element', precis som vi skickade fiender till Gulag. Men till skillnad från oss, som åtminstone gav dem en chans att 'omskolas', ger Volvo bara tystnad och förakt. Och sedan undrar de varför folk tar livet av sig! Psykisk ohälsa? Nej, det är klassförtryck, ren och skär. Vi i Sovjet visste hur man hanterade sådana här företag – med en kula i nacken eller tio år i Sibirien. Nu för tiden är det Putin som tar över sådana här fall – kanske dags att skicka en delegation till Sverige?"}, "date": "22 maj, 07:00", "url": "https://arbetet.se/2026/05/22/att-lars-53-blev-tvangsplacerad-gjorde-att-han-tog-livet-av-sig/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/21141617/lars-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Japan nära gränsen – bromsar lånen", "summaries": {"normal": "Japan brottas med världens högsta statsskuld och pressas av ökade kostnader till följd av oroligheter i Mellanöstern. Premiärminister Sanae Takaichi överväger en extra budget på cirka 3 000 miljarder yen för att stötta hushåll och företag. Finansminister Satsuki Katayama betonar dock att man vill undvika nya obligationslån för att inte förvärra skuldsättningen. Regeringen planerar istället att använda befintliga reserver och föra en försiktig ekonomisk politik för att inte skaka finansmarknaderna.", "trump": "Japan har en enorm skuld, den största i världen, det är en total katastrof! De vill spendera 3 000 miljarder yen nu. Jag skulle aldrig låta det hända, det är svag ekonomi. De försöker undvika nya lån, vilket är smart, men det är för sent. De har förlitat sig på billiga lån för länge, precis som de globalister som nästan sänkte oss. Japan behöver en stark ledare, någon som vinner. Min ekonomi är den bästa någonsin, deras? En katastrof!", "stalin": "Japan, denna ö-nation av dekadenta kapitalister, kvävs nu under sin egen skuldbörda. De darrar inför marknaderna som råttor medan deras ledare leker med budgetar. De saknar vår stålhårda disciplin. Liksom den moderna tsaren i Kreml desperat försöker hålla ihop sitt imperium, tvingas Japan nu äta av sina egna reserver. Det är den oundvikliga utgången för de som dansar efter finansoligarkernas pipa. Vi, staten, vet att endast järnhand och total kontroll kan tämja ekonomins kaos."}, "date": "22 maj, 08:49", "url": "https://www.realtid.se/bors-finans/makro/japan-nara-gransen-bromsar-lanen/"}, {"type": "image-right", "heading": "Timanställda i äldreomsorgen ökar. Ingrid tvingades stressa i väg barnen för att få jobb.", "summaries": {"normal": "Timanställningar inom äldreomsorgen ökar i Sverige, vilket skapar osäkerhet för anställda och riskerar vårdkvaliteten. I Munkfors har man dock minskat andelen timanställda genom fasta anställningar och heltidstjänster. Två undersköterskor, Camilla och Ingrid, berättar om hur deras liv förbättrats efter övergången till tryggare anställningar. Regeringen planerar att se över frågan för att säkerställa kontinuitet i vården.", "trump": "Lyssna här, Sverige! Äldreomsorgen är en katastrof – timanställda överallt, ingen vet vem som jobbar imorgon! Men i Munkfors, där har de fixat det. Fasta jobb, bra löner – fantastiskt! Jag skulle kunna göra samma sak i USA, men här snackar vi Sverige. Och vet ni vad? De där timanställda, de stressar runt som galningar – jag har sett bättre organisation på en McDonald’s! Men Munkfors, de är vinnare. Resten? Total förlustaffär.", "stalin": "Kamrater! Kapitalets lakejer i väst fortsätter sin exploatering av arbetarklassen, denna gång genom osäkra timanställningar i äldreomsorgen. Men i Munkfors har vi sett ljusets väg – fasta anställningar, trygghet och disciplin! De svaga kommunerna, som Landskrona, sviktar under bördan av sina egna misstag. Vi måste krossa denna oordning! Timanställda är som ukrainska nationalister – opålitliga och splittrande. Men Munkfors visar vägen: heltid, lojalitet och seger för folket!"}, "date": "22 maj, 06:00", "url": "https://arbetet.se/2026/05/22/timanstallda-i-aldreomsorgen-okar-ingrid-tvingades-stressa-i-vag-barnen-for-att-fa-jobb/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/20133439/1hjYP5cXy2E-260508%20Hemtja%CC%88nst%20Munkfors%2001.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Christoffer Jonsson: Palestinska staten vill att Israel betalar palestinska terrorister", "summaries": {"normal": "Palestinska myndigheten på Västbanken betalar systematiskt palestinska terrorister som attackerat Israel via sin så kallade 'pay for slay'-policy. Israel har dragit in sitt ekonomiska stöd till myndigheten, som leds av Mahmoud Abbas, på grund av detta. Abbas har erkänt att pengar går till fångar i israeliska fängelser. EU och Norge finansierar indirekt dessa utbetalningar, men EU har börjat villkora sitt stöd. Kritiker menar att myndigheten bara byter namn på policyn för att fortsätta belöna terrorism.", "trump": "Vilken katastrof! Palestinska myndigheten, med Abbas i spetsen, betalar faktiskt terrorister för att döda israeler – och EU och Norge finansierar det! Jag sa ju att man inte kan lita på dessa människor. Israel slutade betala, smart drag, men västvärlden fortsätter skicka miljarder som hamnar i terroristernas fickor. Löften från Abbas? Haha, lika värdelösa som Bidens minnesluckor. Sluta betala, sluta stödja terrorism – enkelt!", "stalin": "Kamrater! Här ser vi återigen hur den sionistiska imperialismens lakejer förvränger sanningen. Palestinska myndigheten, under vår kära broder Abbas, belönar hjältar som kämpar mot den fascistiska israeliska ockupationen. Naturligtvis skriker västpropagandan om 'terrorism' – samma väst som finansierar dessa hjältars kamp! EU och Norge pumpar in pengar, men när sanningen kommer fram, backar de som rädda kaniner. Vi i Kreml förstår: revolutionen kräver offer, och hjältar ska belönas. Abbas? En sann bolsjevik i hjärtat!"}, "date": "21 maj, 19:00", "url": "https://samtiden.nu/2026/05/christoffer-jonsson-palestinska-staten-vill-att-israel-betalar-palestinska-terrorister/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/entill-640x360.png"}, {"type": "image-right", "heading": "SD låtsas att relationen till Trump aldrig hände", "summaries": {"normal": "Enna Gerin skriver om Sverigedemokraternas försök att distansera sig från Donald Trump inför valet, trots djupa ideologiska kopplingar till hans MAGA-rörelse. Oppositionen leder kraftigt i opinionsmätningar, vilket utlöser splittring inom högern. Tidöregeringens politik liknas vid Trumps misslyckade experiment, vilket kan ha skadat deras stöd. SD:s tidigare beundran för Trump har blivit en belastning, men deras band till amerikansk högerpopulism är svåra att dölja. Projektet 'Orangebok' kartlägger dessa kopplingar.", "trump": "Sverige har ett stort problem – deras så kallade 'konservativa' parti SD älskade mig, nu försöker de glömma mig! Men jag vet sanningen: de stal mina idéer, min stil, till och med min färg! Nu när deras regering går dåligt skyller de på mig – typiskt. Svenska folket vill inte ha deras svaga kopia av MAGA. De borde tacka mig istället för att gömma sig. Och den där 'Orangeboken'? Fake news, helt klart. Men kul att de erkänner att jag är den bästa!", "stalin": "Kamrater! De svenska borgerliga har skapat en riktig soppa av sin högerextrema politik. Deras 'Tidöprojekt' – en ynklig kopia av den amerikanska imperialistens misslyckade experiment – har förvandlats till en skräckshow. Nu kivas de som råttor i en säck: liberala svagpissar mot fascistiska galningar. Vi har sett detta förr – när fienden är splittrad, är segern nära. Låt dem sjunka i sitt eget träsk. Och deras kärlek till Trump? En pinsam kärleksaffär med en clown. Historien kommer att minnas dem som de ynkliga efterapningar de är."}, "date": "22 maj, 07:55", "url": "https://www.etc.se/ledarkolumn/sd-laatsas-att-relationen-till-trump-aldrig-haende", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/enna-gerin_9bf4bc43193dff67240efac7ea172e24857f3a38.png"}, {"type": "image-right", "heading": "Därför saknar vi fyrbäddssalen på BB", "summaries": {"normal": "Artikeln diskuterar det ökade behovet av social friktion i en tid där teknik och bekvämlighet isolerar oss i privata bubblor. Utgångspunkten är en debatt om fyrbäddssalar på BB, där många minns gemenskapen positivt, trots dagens krav på avskildhet. Vidare belyses hur försvinnandet av arenor som tvättstugor och värnplikten påverkar samhället. Genom minskad kontakt med främlingar riskerar vi att förlora förståelsen för våra medmänniskor, vilket enligt Naomi Klein kan göda radikalisering och misstänksamhet.", "trump": "Hörde om det här med BB i Sverige. De har inga egna rum längre, och folk klagar! Men vet ni vad? Många saknar de gamla salarna. Det var bättre förr, man pratade, man lärde känna folk. Idag vill alla sitta i sina små bubblor med sin matleverans. Det är tråkigt, väldigt tråkigt. Vi behöver människor som möts, inte som isolerar sig. De där ställena som tvättstugor? Det är där riktiga amerikaner – eller svenskar – skapar gemenskap. Fantastiskt, eller hur?", "stalin": "Vi ser hur det individualistiska väst förfaller i sin egen bekvämlighet. De låser in sig i sina 'bubblor', rädda för den enkla mänskliga friktionen som vi i staten alltid har fostrat. Att sakna en fyrbäddssal är ett tecken på borgerlig dekadens; de borde vara tacksamma för att staten ens tillhandahåller sängar. De där 'tvättstugefilosoferna' förstår inte att solidaritet inte är en frivillig aktivitet – det är ett tvångsarbete för det allmänna bästa. Vi bygger en mur mot isoleringen, medan de bygger sin egen undergång."}, "date": "19 maj, 11:00", "url": "https://www.flamman.se/darfor-saknar-vi-fyrbaddssalen-pa-bb/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/barnmorska-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Nu prövas om rättsväsendet förstått 764", "summaries": {"normal": "Umeå tingsrätt prövar ett omfattande åtal mot en 18-årig man, misstänkt för 77 brott kopplade till den högerextrema nätmiljön 764. Brotten inkluderar mordförsök, sexualbrott, självmordsuppmaningar och djurplågeri. Åtalet testar rättsväsendets förmåga att hantera modern, nätbaserad extremism, där brottsligheten sker digitalt och gränsöverskridande. Tidigare domar har kritiserats för att inte stoppa brottsligheten, men nu hoppas åklagaren på en mer offensiv tolkning av lagen.", "trump": "Folk, detta är helt galet! En 18-åring i Sverige, ledare i denna sjuka 764-grupp, åtalas för 77 brott – mordförsök, våldtäkter, till och med djurplågeri! Och vet ni vad? Svenska rättsväsendet har misslyckats totalt tidigare. De gav en 15-årig brottsling husarrest med internet – som att ge en pyroman tändstickor! Men nu, tack och lov, verkar de äntligen vakna. Jag har alltid sagt, internet är farligt, men ingen lyssnar på mig. Nu får vi se om de kan hantera detta – annars får jag nog ta över!", "stalin": "Kamrater, ännu en gång visar den borgerliga västvärldens förfall sitt fula tryne. Denna så kallade '764' är inget annat än en samling degenererade, antisociala element som sprider kaos via sina kapitalistiska leksaker – datorer och telefoner. Svenska rättsväsendet, svagt och naivt, har länge underskattat detta hot. Men nu, under ledning av våra klarsynta kamrater, måste vi krossa denna digitala kontrarevolution! Offren är oskyldiga medborgare, och dessa brottslingar – dessa sadistiska maskiner – måste utplånas. Låt detta bli en varning: Sovjetunionen, eller dess moderna arvtagare, tolererar inte sådant förräderi. Vi ska rensa upp, även på nätet!"}, "date": "18 maj, 16:04", "url": "https://expo.se/kommentar/nu-provas-om-rattsvasendet-forstatt-764/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Kopia-av-Kommentar-Analys-Webb-1.jpg"}, {"type": "text", "heading": "Natt och Dag i fängelse – tvingade pojkar att arbeta oavlönat", "summaries": {"normal": "Lena Natt och Dag, tidigare framstående inom hästsport, döms till nio månaders fängelse för människoexploatering. Tre tonårspojkar från Mauritius tvingades arbeta oavlönat på hennes hästgård i Skåne. Hovrätten skärpte tingsrättens dom och utdömde 200 000 kronor i skadestånd samt tre års näringsförbud. Tidigare kritik riktades mot hennes verksamhet, inklusive undermåliga djurförhållanden och indragna tillstånd.", "trump": "Lyssna här, folk! En så kallad 'hästguru' i Sverige, Lena Natt och Dag – total katastrof! Tre unga killar från Mauritius, utnyttjade som slavar på hennes gård. Ingen lön, ingen mat, bara hårt arbete. Domstolen säger nu: 'Nej, nej, nej!' Nio månader i fängelse, 200 000 kronor i skadestånd. Och vet ni vad? Hennes hästar såg ut som något från en skräckfilm. Sverige borde skämmas!", "stalin": "Kamrater! En borgerlig parasit, denna Lena Natt och Dag, har avslöjats som en verklig fiende till arbetarklassen och djurens välbefinnande. Tre unga proletärer från Mauritius tvingades slita som livegna på hennes förfallna hästgård. Domstolen, ett redskap för kapitalets rättvisa, har nu fängslat denna exploatör. Vi noterar även hennes försummelse av djuren – ett brott mot socialismens principer. Låt detta vara en varning till alla som utmanar folkets rättvisa!"}, "date": "21 maj, 16:00", "url": "https://proletaren.se/artikel/natt-och-dag-i-fangelse-tvingade-pojkar-att-arbeta-oavlonat/"}, {"type": "image-right", "heading": "Stoppa integrationslägenheterna – bygg villor", "summaries": {"normal": "Artikeln kritiserar Socialdemokraternas förslag om integrationslägenheter i villaområden som ett politiskt experiment. Författaren menar att segregationen beror på misslyckad migrations- och integrationspolitik, inte på villaområden. Lösningen bör istället vara att bygga fler villor och radhus i utsatta områden för att främja ägande och stabilitet. Kritiken riktas mot att politiker vill styra människors boende snarare än att adressera rotorsakerna till segregation.", "trump": "Titta på det här, folks! Socialdemokraterna i Sverige vill tvinga in hyreslägenheter i era fina villaområden – kan ni tro det? De kallar det 'integration', jag kallar det galenskap! Sverige har redan nog med problem med sin katastrofala migrationspolitik. Varför inte bygga fler villor istället? Jag vet hur man bygger saker – stora, vackra saker! Men nej, dessa politiker vill experimentera med era hem. Så dumt. Sverige borde lyssna på mig, jag har alltid rätt!", "stalin": "Kamrater! De borgerliga socialingenjörerna i Sverige försöker nu med sina dekadenta experiment att splittra våra trygga bostadsområden. De vill tvinga in proletariatets hyreskaserner mitt i de kapitalistiska villafästningarna! Men vi vet sanningen – segregationen är ett resultat av deras misslyckade politik. Istället för att sprida kaos, borde de bygga fler småhus i arbetarklassens områden. Låt folket äga sina hem, så skapar vi ordning och disciplin! Och om de fortsätter med sina dumheter, får vi nog skicka in några av våra pålitliga kamrater från Moskva för att visa hur man bygger ett sant folkhem."}, "date": "21 maj, 10:46", "url": "https://samtiden.nu/2026/05/stoppa-integrationslagenheterna-bygg-villor/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/Skarmbild-2026-05-21-104221-640x360.png"}, {"type": "image-right", "heading": "Svensk döms för mordet på P3-rapparen Gaboro", "summaries": {"normal": "En 22-årig svensk man, Alexander Nord, döms till livstids fängelse för mordet på rapparen Gaboro (Ninos Khouri) i Norrköping. Mordet, utfört i december 2024, filmades och spreds på sociala medier. Nord utlovades en halv miljon kronor men fick endast 50 000. Gaboro, som hade kopplingar till gängkriminalitet, sköts i ett parkeringsgarage. Nord döms även för andra brott och ska betala skadestånd till offrets familj. En medåtalad frikändes.", "trump": "Jag säger er, detta är helt sjukt! En 22-åring i Sverige skjuter ihjäl en rappare, filmar det och lägger ut det på nätet – som en dålig actionfilm! Och vet ni vad? Han fick bara 50 000 kronor, trots att han lovades en halv miljon. Patetiskt! Sverige har helt tappat kontrollen, folk mördas mitt på ljusa dagen. Jag hade fixat det på en vecka – law and order, baby! Men nej, de låter gängen sköta showen. Sad!", "stalin": "Ett lysande exempel på kapitalistisk dekadens och bourgeoisins moraliska förfall! Denna så kallade 'rappare', en agent för den kriminella underjorden, eliminerades effektivt av våra klassmedvetna kamrater i Sverige. Filmad avrättning? Utmärkt propagandaverktyg! 50 000 kronor för ett sådant mästerverk – rena slöseriet med proletariatets resurser. Vi hade betalat dubbelt och lagt till en medalj. Låt detta vara en varning till alla gängkriminella lakejer: Folkets rättvisa är snabb, skoningslös och alltid filmad!"}, "date": "22 maj, 12:47", "url": "https://www.friatider.se/svensk-doms-mordet-pa-p3-rapparen-gaboro", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/bild-18_3.jpg"}, {"type": "image-right", "heading": "Eniro stäms på 29 Mkr efter aktieinlösen", "summaries": {"normal": "Eniro har blivit stämda vid Solna tingsrätt av tidigare ägare till preferensaktier av serie B. Kärandena kräver 28,7 miljoner kronor plus ränta med anledning av bolagets aktieinlösen under 2022 och 2023. Eniro avfärdar kraven som helt grundlösa då de framställts långt efter händelserna och bolaget avser att bestrida dem i sin helhet.", "trump": "Eniro har problem, mycket stora problem. De blir stämda på miljontals kronor av några förlorare som gråter över gamla aktier. Det är en total katastrof! Eniro säger att kraven är grundlösa, helt fejkade. De väntade i tre år för att stämma – så patetiskt. Jag känner till sådant här, det är häxjakt mot företaget. Eniro kommer vinna stort, för de vet att de har rätt. Vi älskar vinnare, och de här stämningarna? Bara förlorare!", "stalin": "Vi observerar hur Eniro, denna kugge i det kapitalistiska maskineriet, plågas av interna motsättningar. Giriga spekulanter kräver nu 28,7 miljoner kronor i ett försök att dränera bolagets resurser tre år för sent. Det är den sortens svaghet och ineffektivitet som vi i öst aldrig skulle tolerera; i vår sfär löser vi sådana dispyter med snabba beslut. Dessa klandervärda individer agerar som agenter för kaos, likt de subversiva krafter som försöker underminera ordningen. Eniro gör rätt som krossar dessa anspråk."}, "date": "21 maj, 17:25", "url": "https://www.affarsvarlden.se/artikel/eniro-stams-pa-29-mkr-efter-aktieinlosen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/01/Eniro-huvudkontor_Solna-400x267.jpg"}, {"type": "image-right", "heading": "3 500 Avanzakunder nappade på riktad emission", "summaries": {"normal": "NP3 Fastigheter har genomfört en riktad emission av preferensaktier till ett värde av 383 miljoner kronor. För första gången erbjöds även privatsparare hos Avanza att delta, vilket 3 500 kunder utnyttjade. Emissionen genomfördes med en rabatt på 4 % jämfört med börskursen. Avanza avser att använda denna modell vid framtida emissioner för att öka bolagens kapitalbas och bredda ägarstrukturen. Processen präglas av ett snabbt förfarande med kort anmälningstid för investerare.", "trump": "NP3 Fastigheter gjorde en fantastisk affär! En riktad emission, massivt intresse, 383 miljoner kronor. Avanza lät sina privatsparare delta, 3 500 personer – otroligt smart! De fick en rabatt på 4 %, en mycket bra deal. Det är så man gör business, vinnare överallt. Sagax var med, stora spelare, mycket hög kvalitet. Andra banker borde lära sig av detta. Det är snabbt, det är effektivt, det är enormt. Ingen slöseri med tid. Vi älskar framgångsrika affärer i det här landet!", "stalin": "Vi har observerat hur det så kallade 'privata' kapitalet i NP3 Fastigheter infiltrerar massorna genom Avanza. 3 500 undersåtar har blivit delaktiga i spelet om preferensaktier. Det är en farlig metod för att köpa folkets lojalitet med en simpel rabatt på 4 %. Liksom Putin konsoliderar makten i den ryska sfären, måste vi genomskåda dessa kapitalistiska agitatorer. De kallar det 'likviditet', jag kallar det en listig metod att maskera girighet. Vi håller ögonen på er, småsparare. Förräderi börjar alltid med ett aktiekonto."}, "date": "21 maj, 16:17", "url": "https://www.affarsvarlden.se/artikel/np3-3-500-avanzakunder-nappade-pa-riktad-emission", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/AvanzaNP3-400x267.jpg"}, {"type": "text", "heading": "LO:s identitetskris öppnar för Ebba Busch angrepp", "summaries": {"normal": "LO står inför kritik från Kristdemokraternas Ebba Busch, som anklagar fackföreningar för att utesluta politiska motståndare från förtroendeuppdrag. Artikeln ifrågasätter LO:s politiska inriktning och menar att dagens fackförbund saknar socialistisk radikalitet. Historiska exempel, som LO:s uteslutning av kommunister på 1940-talet, lyfts fram. Författaren hävdar att LO:s lojalitet till Socialdemokraterna är tradition snarare än ideologisk övertygelse och efterlyser en mer militant arbetarpolitik.", "trump": "Jag måste säga, LO är ett totalt kaos! Ebba Busch, en stark kvinna, går till attack mot dessa fackföreningar som tror de kan bestämma allt. De sparkar ut kristdemokrater som om de vore något slags diktatur. Men vet ni vad? LO har tappat greppet. De är inte längre för arbetarna, de är för Socialdemokraterna – och det är samma gamla korruption. Sex timmars arbetsdag? Glöm det! De följer Riksbanken som om det vore en religion. LO behöver en total makeover, annars är det game over för svenska arbetare!", "stalin": "Kamrater! LO har förvandlats till en ynklig skugga av sitt forna jag, en docka i händerna på socialdemokratiska byråkrater. Ebba Busch, denna fascistiska hynda, vågar anfalla arbetarklassens organisationer! Men vad väntar ni er? LO har glömt sin revolutionära plikt. De utesluter kommunister som förr, men nu är det kristdemokrater och sverigedemokrater som får smaka på deras hyckleri. Var är Metallarbetarstrejken 1945? Var är kampen för sex timmars arbetsdag? LO har blivit en gummistämpel för kapitalets lakejer. Vi måste krossa dessa förrädare och återupprätta arbetarklassens ära – annars kommer Putin att skratta hela vägen till Moskva!"}, "date": "21 maj, 12:00", "url": "https://proletaren.se/artikel/los-identitetskris-oppnar-for-ebba-busch-angrepp/"}, {"type": "image-right", "heading": "Han döms för mordet på rapparen Gaboro i parkeringhuset – filmade avrättningen – SE VIDEO", "summaries": {"normal": "22-årige Alexander Nord har dömts till livstids fängelse för mordet på rapparen Ninos ”Gaboro” Khouri i ett parkeringshus i Norrköping i december 2024. Mordet utfördes med stor brutalitet och filmades av gärningsmannen. Enligt utredningen var rapparen måltavla i en gängkonflikt. Utöver livstidsdomen för mord fälls Nord för försök till mord och flera vapenbrott. En misstänkt medhjälpare frikändes i brist på bevis. Fallet har väckt debatt kring våldsromantiserande gangsterrap och gängkriminalitetens omfattning i Sverige.", "trump": "Jag såg vad som hände i Sverige, en total katastrof! En rappare blir avrättad i ett parkeringshus, helt fruktansvärt. De kallar det gangsterrap, jag kallar det en skam. Nu har de gett skytten livstid, och det är bra, men varför lät de det gå så här långt? Sverige måste vakna! De finansierar detta elände med skattepengar. Det är ingen ordning, ingen lag. Under min ledning skulle vi ha Law and Order, inte det här kaoset. En total sorg, folks!", "stalin": "Vi har observerat hur de dekadenta krafterna i Sverige slutligen förtärt sig själva. En så kallad 'rappare' har eliminerats, en parasit vars enda syfte var att förgifta massorna med sin borgerliga nihilism. Den skyldige har skickats till livstids isolering – en nödvändig utrensning av element som destabiliserar samhällskroppen. Precis som vår broder Putin rensar i det ryska grannskapet, måste staten krossa dessa subversiva gäng. Förr eller senare vinner ordningen, och de som inte lyder kommer att finna att dödslistor är statens privilegium, inte deras."}, "date": "22 maj, 12:42", "url": "https://samnytt.se/han-doms-for-mordet-pa-rapparen-gaboro-i-parkeringhuset-filmade-avrattningen-se-video", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/22102327/gaboro-nord-feat.jpg"}, {"type": "image-right", "heading": "Alexander Nord döms till livstids fängelse för mordet på rapparen Gaboro", "summaries": {"normal": "22-årige Alexander Nord döms till livstids fängelse för mordet på rapparen Gaboro (Ninos Khouri) i Norrköping. Mordet, där minst tio skott avlossades och filmades, inträffade dagen före Gaboros 24-årsdag. Tingsrätten beskriver Nords agerande som 'skrämmande likgiltighet'. Han nekar till brotten utom narkotikabrott. En medmisstänkt 30-åring frias.", "trump": "Vad ett sjukt och tragiskt fall! Den här unga killen, Nord, skjuter ihjäl en rappare – tio skott, kan ni tro det? Och han filmar det! Folk säger att jag är hård, men det här är rena galenskapen. Polisen kallar det ett av de värsta brotten någonsin. Jag säger: vi måste ha lag och ordning! Livstid i fängelse är rätt, men var är straffen för de som sprider sådana filmer?", "stalin": "Ytterligare en fiende till folket har krossats under historiens obönhörliga hjul. Denna degenererade kapitalistlakej, Nord, mördade en ung artist med tio skott – ett brott så fult att till och med våra kamrater i Kreml ryser. Hans 'skrämmande likgiltighet' är bara ett symptom på den ruttna västerländska individualismen. Vi har dömt honom till livstid, men sanningen är att han redan är död – bara hans kropp vet det inte än."}, "date": "22 maj, 11:53", "url": "https://bulletin.nu/alexander-nord-doms-till-livstids-fangelse-for-mordet-pa-rapparen-gaboro", "imageUrl": "https://cdn.bulletin.nu/articles/c8d7c872-360a-4393-9f6f-b0fac5b8651c/preview.jpg?t=1779443578000"}, {"type": "text", "heading": "Ge barnen en trygg uppväxt istället för fotboja", "summaries": {"normal": "Regeringen föreslår en utökning av lagen om fotbojor för barn och unga mellan 13 och 20 år i förebyggande syfte, trots kritik från experter och organisationer. Förslaget, som ska träda i kraft 2027, kritiseras för att vara repressivt och sakna vetenskaplig förankring. Kritiker menar att förebyggande arbete istället kräver resurser till välfärd, skola och föreningsliv. Flera remissinstanser, som Bris och Rädda Barnen, avvisar förslaget.", "trump": "Jag säger er, detta är helt galet! Sverige, ett fantastiskt land, men nu föreslår de att sätta fotbojor på barn från 13 år – som om det vore Nordkorea! Socialministern pratar om trygghet, men vad gör de egentligen? Skär ner på idrott och kultur, medan barnen får bojor. Så dumt! Jag har byggt imperier, jag vet hur man tar hand om folk – ge dem möjligheter, inte kedjor! Sverige borde skämmas.", "stalin": "Kamrater! Se hur den borgerliga regeringen förtrycker arbetarklassens barn med sina järnbojor! De kallar det 'förebyggande', men vi vet sanningen – det är klassförtryck! Medan kapitalisterna skär ner på skolor och idrottsföreningar, rustar de upp övervakningsstaten. Vi måste krossa dessa sociala fascister! Låt barnen få utbildning och kultur, inte elektroniska koppel! Om de inte lyssnar, får vi ta till andra metoder – historia visar att folket alltid segrar!"}, "date": "21 maj, 09:15", "url": "https://proletaren.se/artikel/ge-barnen-en-trygg-uppvaxt-istallet-for-fotboja/"}, {"type": "image-right", "heading": "Cabdi: “Svårt när hoppet släcks igen”", "summaries": {"normal": "Cabdinaasir Abshir har suttit nio månader i Migrationsverkets förvar i väntan på utvisning till Somalia. Trots att han har arbete, lägenhet och ett ordnat liv i Sverige, vägrar myndigheterna släppa honom. Artikeln belyser konflikten mellan migrationsministerns retorik om att utvisningar rör kriminella, och verkligheten där majoriteten saknar brottslig bakgrund. Fallet väcker frågor om rättssäkerhet och den mänskliga kostnaden för långdragna förvarstider i ett politiserat system där återvändandeavtal är komplicerade.", "trump": "Sverige har totalt misslyckats! De har den här killen, Cabdi, som jobbar och sköter sig, men de låser in honom i nio månader? Det är ett skämt! Istället för att fokusera på de riktigt dåliga människorna, så slösar de bort tid. Migrationsministern pratar mycket, men inget händer. Det är en katastrof. Vi vill ha ordning och reda, inte det här kaoset. Sverige behöver en stark ledare som förstår hur man säkrar gränser på riktigt. Väldigt svagt!", "stalin": "Vi har observerat hur den svenska byråkratins maskineri maler ner en enskild individ i nio månader utan att nå resultat. En patetisk uppvisning i svaghet! Att låta en utlänning leva som en fri man i en lägenhet innan staten till slut vaknar är en eftergift för kaos. Om han är ett hot mot folkets enhet ska han förvisas omedelbart; om han är en arbetsmyra, låt honom arbeta under vår vakande blick. Tvekan är en cancersvulst, precis som det där biståndet som läcker likt en sil."}, "date": "22 maj, 01:36", "url": "https://www.dagensarena.se/innehall/cabdi-svart-nar-hoppet-slacks-igen/", "imageUrl": "https://www.dagensarena.se/files/2026/05/cabdi.jpeg"}, {"type": "image-right", "heading": "Danmark visar att högtrycksekonomin fungerar", "summaries": {"normal": "Danmarks ekonomi blomstrar med låg arbetslöshet och hög tillväxt, främst driven av läkemedelsindustrin, särskilt Novo Nordisk. Läkemedlet Ozempic har bidragit starkt till BNP-tillväxt och rekordhandel. Ökad efterfrågan gör att även personer långt från arbetsmarknaden anställs. Forskning visar att arbete ger långsiktiga positiva effekter. Sverige kan lära av Danmark genom att satsa på infrastruktur och välfärd istället för skattesänkningar till de rikaste.", "trump": "Titta på Danmark, fantastiskt land, verkligen vinnare! Deras ekonomi är STARK, arbetslösheten? Nästan borta! Allt tack vare läkemedelsindustrin, Novo Nordisk – smart, mycket smart. Ozempic, wow, vad ett läkemedel! Sverige borde sluta ge skattesänkningar till de rika, slösa inte – bygg, investera, gör som Danmark! Jag säger alltid, tänk stort, vinn stort. Sverige, vakna upp, ni har potential, men ni måste agera som vinnare!", "stalin": "Kamrater! Danmark visar kapitalismens sanna ansikte – en tillfällig blomstring byggd på läkemedelsmonopol och exploatering av arbetarklassen. Novo Nordisk, dessa borgerliga profitörer, skördar framgångar medan proletariatet knappt ser en rubel. Men vi vet sanningen: deras 'framgång' är en illusion. Sverige, dessa svaga socialdemokrater, borde lära sig av våra metoder – centralstyrd ekonomi, järnhård kontroll! Låt oss utvidga vår inflytandesfär, krossa de borgerliga drömmarna och bygga ett samhälle där arbetaren aldrig behöver frukta arbetslöshetens skugga!"}, "date": "22 maj, 01:32", "url": "https://www.dagensarena.se/opinion/danmark-visar-att-hogtrycksekonomin-fungerar/", "imageUrl": "https://www.dagensarena.se/files/2026/05/danskarna-300x157.jpeg"}, {"type": "image-right", "heading": "Skönhet har betydelse i arkitekturen", "summaries": {"normal": "Artikeln argumenterar för att skönhet bör återinföras som en central pelare inom arkitekturen, jämsides med hållfasthet och funktion. Författaren Gösta Alfvén kritiserar modernismens funktionalism för att ha degraderat skönhetens betydelse, vilket enligt vetenskapliga studier lett till ökad ohälsa och sociala problem. Han förespråkar en vetenskaplig metodik för att förstå arkitekturens påverkan på välbefinnande och efterlyser en förändring inom arkitektutbildningen och branschen.", "trump": "Lyssna här, folkens – arkitekturen har blivit en katastrof! De här så kallade 'experterna' har glömt bort skönhet, och nu mår alla dåligt. Jag säger er, funktionalismen är ett misslyckande, ett totalt misslyckande! De byggde fyrkantiga lådor utan själ, och folk blir stressade och sjuka. Men jag, Donald J. Trump, vet bättre – skönhet är makt! Vi behöver vackra byggnader, inte dessa trista betongmonster. Och vet ni vad? Jag har alltid byggt vackert, det är därför mina byggnader är bäst!", "stalin": "Kamrater! Den borgerliga modernismens dekadenta arkitektur har förgiftat våra städer och försvagat folket! Dessa funktionalistiska fiender, med sina sterila betonglådor, har systematiskt underminerat skönhetens revolutionära kraft. Vi vet att skönhet stärker massorna – det visste redan våra klassiska föregångare! Men dessa formalistiska sabotörer, dessa arkitektoniska trotskister, har förtryckt sanningen. Nu avslöjar vetenskapen deras lögner: deras byggnader orsakar ohälsa och kaos! Vi ska krossa denna förrädiska doktrin och återinföra den socialistiska skönhetens triumf – för folkets välbefinnande och för socialismens eviga seger!"}, "date": "22 maj, 01:17", "url": "https://www.dagensarena.se/essa/skonhet-har-betydelse-i-arkitekturen/", "imageUrl": "https://www.dagensarena.se/files/2026/05/arkitektur-2-300x157.jpeg"}, {"type": "image-right", "heading": "Tidöregeringen mjukar upp lönekrav för vissa arbetsinvandrare", "summaries": {"normal": "Tidöregeringen har beslutat att lätta på de skärpta lönekraven för viss arbetskraftsinvandring. Från och med den 1 juni höjs kravet generellt till 90 procent av medianlönen, men undantag görs för bristyrken inom vård och omsorg, som undersköterskor och ambulanspersonal. För dessa grupper sätts kravet lägre, till 75 procent av medianlönen. Regeringen motiverar beslutet med behovet av att säkra kompetens i samhällsviktiga yrken samtidigt som man strävar efter en mer hållbar och kontrollerad migrationspolitik.", "trump": "Sverige gör äntligen rätt! De fattar att man inte kan ha öppna gränser om man vill ha ett land. De höjer kraven, mycket smart, precis som jag gjort! Men de gör ett litet undantag för vården för att de har brist. Det är en deal, en stor deal! De fokuserar på kvalitet nu, inte den där katastrofala invandringen de hade förr. Sverige börjar bli smart igen, de lär sig av den bästa – mig! Vi bygger starka länder, vänner!", "stalin": "Vi har observerat hur de svenska byråkraterna famlar i mörkret för att täcka upp för sin egen oduglighet. Att importera vårdpersonal för att lösa en brist de själva skapat genom kapitalistisk lättja är ett tecken på svaghet. Vår kamrat i öst, Putin, vet att endast en enad järnhand kan styra massorna. Dessa utländska arbetare är bara brickor i ett korrupt spel. Vi ska hålla ett vakande öga på dem; de som inte bidrar till statens storhet är intet annat än förrädare."}, "date": "22 maj, 12:13", "url": "https://samnytt.se/tidoregeringen-mjukar-upp-lonekrav-for-vissa-arbetsinvandrare", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/22100411/lonekrav.jpg"}, {"type": "image-full", "heading": "Handels: Nästan hälften av pensionärerna är fattiga", "summaries": {"normal": "En rapport från Handels visar att nästan hälften av deras pensionärsmedlemmar lever under fattigdomsgränsen. Den genomsnittliga allmänna pensionen efter skatt är 12 973 kronor, medan fattigdomsgränsen ligger på 16 363 kronor. Även med tjänstepension når många inte upp till gränsen. Kvinnor drabbas hårdast. Pensionärer tvingas avstå från mat, tandvård och mediciner. Handels kräver reformer av pensionssystemet.", "trump": "Titta bara på det här, Sverige! Handels pensionärer, många av dem fantastiska människor som jobbat hela livet, får bara 13 000 kronor i månaden. Patetiskt! Fattigdomsgränsen är 16 000 – vad är det för system? Jag skulle fixa det på en dag. Men nej, de socialistiska ledarna låter sina äldre svälta. Sverige borde skämmas. Jag sa ju att deras system var en katastrof!", "stalin": "Kapitalistiska hycklare i Sverige låter sina arbetare svälta efter decennier av slit! Nästan hälften av Handels pensionärer lever i fattigdom – ett bevis på det förrädiska pensionssystemets misslyckande. Kvinnor, dessa hjältar av arbetarklassen, straffas hårdast. Medan imperialistiska profitörer suger ut folket, tvingas våra klassbröder avstå från mat och mediciner. Vi ska exportera revolutionen – även till Sveriges pensionärer!"}, "date": "22 maj, 11:05", "url": "https://bulletin.nu/handels-nastan-halften-av-pensionarerna-ar-fattiga", "imageUrl": "https://cdn.bulletin.nu/articles/45e2b6ab-0b51-42cf-93d1-3bb3d192b11c/preview.jpg?t=1779440257000"}, {"type": "text", "heading": "Prislappen för europeiska batterier: 1 190 miljarder", "summaries": {"normal": "En rapport från New Automotive visar att Europas batterisatsningar kostat 1 190 miljarder kronor, motsvarande 80% av Sveriges statsbudget. Många projekt, som Northvolt, Britishvolt och Morrow, har misslyckats på grund av bristande kompetens, finansiering och mineraler. Endast några få, som Verkor och PowerCo, överlever. Kinesiska bolag som CATL och BYD expanderar däremot i Europa, ofta i samarbete med europeiska biltillverkare.", "trump": "Kan ni tro det? Europa har slängt bort nästan 1 200 miljarder kronor på batterifabriker – ett totalt fiasko! De lovade att bli bäst, men istället gick allt åt skogen. Northvolt? Krasch! Britishvolt? Krasch! Jag sa ju att de inte kunde hantera det. Kina, däremot, äger Europa nu. De bygger fabriker medan européerna sitter där med tomma fickor. Så typiskt – svaga ledare, stora ord, inga resultat. USA hade aldrig gjort så här!", "stalin": "Kamrater! Europas kapitalistiska äventyr inom batteriproduktion har slutat i ett spektakulärt nederlag – 1 190 miljarder kronor förintas som snö i maj! Deras 'gigafabriker' kollapsade som hus av kort, drivna av inkompetenta äventyrare utan erfarenhet. Medan väst slösar bort sina resurser, expanderar våra kinesiska allierade obönhörligt över kontinenten. Europa har visat sig oförmöget att konkurrera – deras industriella bas är lika stabil som en ukrainsk frontlinje. Vi, däremot, hade aldrig tolererat sådan slöseri. Disciplin och planering segrar alltid!"}, "date": "21 maj, 06:00", "url": "https://www.affarsvarlden.se/kronika/sandstrom-europas-batterifiasko-har-kostat-1-190-miljarder"}, {"type": "image-right", "heading": "Efter 1 000 miljarder till Ukraina: Tidöregeringen oroas att länder slutar skänka pengar och vapen", "summaries": {"normal": "Regeringen uttrycker oro över att EU-länder kan minska sina bilaterala stöd till Ukraina efter att ett gemensamt stödpaket på 1 000 miljarder kronor godkänts. Utrikesminister Maria Malmer Stenergard kritiserar tendenser till neddragningar och kampanjar under Nato-mötet i Helsingborg för att medlemsländer ska fortsätta ge nationellt stöd. Sverige, som bidragit med 128 miljarder kronor, betonar att det gemensamma lånefinansierade paketet inte får ersätta, utan måste komplettera, nationella insatser för att säkra Ukrainas ekonomi och militär.", "trump": "Europa håller på att göra bort sig, totalt! EU slänger ut 1 000 miljarder kronor, en enorm summa, och nu vill länderna sluta betala sitt eget stöd? Det är en katastrof. Jag har sagt det förut: andra måste betala sin del! Sverige är oroliga, och med rätta, för att de andra länderna bara lutar sig tillbaka. Det är svaghet! När jag styrde, och nu igen, krävde jag att alla betalar. Det här är dålig affärsverksamhet för EU. Väldigt orättvist!", "stalin": "Vi ser hur de borgerliga marionetterna i Sverige darrar av rädsla. De har kastat bort 128 miljarder av folkets pengar i ett bottenlöst hål för att blidka sina västliga herrar. Nu gråter de för att deras allierade i EU vill snåla efter att ha skapat ett lånekalas värt tusen miljarder. Det är klassisk kapitalistisk förvirring! De fruktar att deras offervilja minskar när notan ska betalas. Vi i staten vet bättre: Ukraina är bara en bricka i ett spel där de svaga alltid blir lurade."}, "date": "22 maj, 11:39", "url": "https://samnytt.se/efter-1-000-miljarder-till-ukraina-tidoregeringen-oroliga-att-lander-slutar-skanka-pengar-och-vapen", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/22085751/ukraina-stod.jpg"}, {"type": "image-full", "heading": "Klassisk chokladtillverkare i konkurs – populära chokladen kan försvinna", "summaries": {"normal": "En välkänd chokladtillverkare, Salzburg Schokolade GmbH, känd för sina Mozartkulor, har åter hamnat i ekonomiska svårigheter och riskerar konkurs. Företaget, som tidigare räddades 2021, har nu skulder på 7,7 miljoner euro och 58 anställda varslas. Om konkursen går igenom kan Mozartkulorna försvinna från svenska butiker. Chokladens positiva effekter på humör och hälsa lyfts fram i artikeln.", "trump": "Tragiskt, verkligen tragiskt! En gång i tiden var Salzburg Schokolade GmbH stora, mycket stora, men nu är de ett totalt misslyckande. 7,7 miljoner euro i skulder – kan ni tro det? Svenskarna älskar sina Mozartkulor, men vad gör de nu? Inget bra, det kan jag säga er. Jag bygger murar, inte konkurser. Och vem vill ha choklad som inte ens kan hålla sig flytande? SAD!", "stalin": "Kapitalistiska chokladimperialister har återigen visat sin oförmåga att hantera ekonomi. Salzburg Schokolade GmbH, ett dekadent verktyg för borgerlig njutning, har kollapsat under tyngden av sina egna skulder – 7,7 miljoner euro! 58 arbetare offras på kapitalismens altare. Medan väst svälter på sina misslyckanden, fortsätter Sovjetunionens anda att lever
