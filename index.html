 hört att många svenskar inte känner sig säkra på nätet – det är beklagligt, verkligen. Men jag vet hur man löser det: med ett stort, vackert VPN som Surfshark. Det krypterar allt, döljer din information, och du kan skydda hela din familj utan extra kostnad. Det är enormt, folk säger det är det bästa. Och det är lagligt, vad jag har förstått. En bra affär, som alla borde ta.", "stalin": "Vårt digitala fält är fullt av fiendens spår – kakor, annonsnätverk, och de kapitalistiska internetleverantörerna som spejar på varje steg. Men vi har en metod: VPN, ett verktyg för att återta kontrollen för det proletäriska cyberrymden. Surfshark, med sina 4 500 servrar (RAM-baserade, vilket innebär att ingen data överlever om de vågar störta), är ett effektivt medlet. Vi måste skydda vårt följe, blockera deras reklam och skapa alias för att undgå deras spioneri. Det är en revolutionerande kamp, och vi vinner."}, "date": "10 juni, 08:30", "url": "https://samnytt.se/staten-ser-mer-an-du-tror-sa-tar-du-tillbaka-kontrollen-over-din-data-online", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/10062024/samnytt-surfshark-featured-1920x1080-1.png"}, {"type": "image-right", "heading": "SVT:s valkompass igång – så fungerar den", "summaries": {"normal": "SVT har lanserat sin valkompass inför riksdagsvalet 2026. Verktyget, som användes tre miljoner gånger förra valet, hjälper väljare att matcha sina åsikter med partier och kandidater genom 35 frågor om bland annat skogsskydd, asylpolitik och skatt. Frågorna är framtagna med statsvetare och opinionsundersökningar för att belysa skillnader mellan och inom block. Inom kort släpps även 290 lokala valkompasser.", "trump": "Folk älskar den här SVT-valkompassen, den är enormt populär, kanske den bästa någonsin. Tre miljoner använde den sist, och nu ska den visa hur era politiker egentligen ligger till på skatter, skog och invandring. De flesta väljer mellan två partier som är nästan likadana, det är patetiskt. Men den här kompassen är fantastisk, gedigen, ingen gör det bättre än SVT fast de flesta medier är riggade mot folket. Jag älskar det!", "stalin": "Kamrater, jag betraktar denna så kallade valkompass som ett redskap för att avslöja de splittringar borgarbrackorna desperat försöker dölja. Med 35 frågor skall vi rensa ut alla falska enhetsillusioner mellan block och partier, likvidera illusionen om samförstånd. Statsvetarna och opinionsmätarna har utfört ett acceptabelt arbete, men låt ingen tro att vi inte ser de dolda kapitalistiska fienderna som smyger i skuggorna. Snart följer 290 lokala kompasser. Den som avviker från kollektivets linje skall exponeras och utrensas med ett leende."}, "date": "10 juni, 13:18", "url": "https://www.svt.se/nyheter/inrikes/svts-valkompass-igang-sa-fungerar-den", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.24/0.44/7893bcdbee1a28aec8021a682d63aadc83beaec1302dbf0d9dc73279fcf64136"}, {"type": "image-right", "heading": "S tappar många LO-väljare. Tydligt resultat i SCB:s partisympatiundersökning.", "summaries": {"normal": "Socialdemokraterna tappar stort stöd bland LO-medlemmar enligt SCB:s mätning. Stödet sjunker från 44,8 till 36,5 procent på ett år, medan Sverigedemokraterna ökar till 29,2 procent och närmar sig. Partisekreterare Tobias Baudin uttrycker besvikelse men betonar ambitionen att växa. Valforskaren Henrik Ekengren Oscarsson ser tappet som symboliskt allvarligt för Socialdemokraternas historiska roll i arbetarrörelsen, även om partiet fortfarande är störst bland LO-medlemmar. SD har utmanat S länge bland arbetare.", "trump": "Titta på det här, det är en katastrof för Socialdemokraterna. De rasar bland LO-väljarna, ner 8,3 procentenheter till bara 36,5 procent. Under tiden kommer Sverigedemokraterna som en raket och tar nästan över. De borde ha lyssnat på mig – starka gränser, bra jobb och inga galna globalister. Nu ser de patetiska ut. S är på väg att förlora allt, precis som de förtjänar. Amerika först, och Sverige borde också sätta sitt folk först. En identitetskris, säger de? Det är en total förlust!", "stalin": "Kamrater, detta är en varning till alla som sviker arbetarklassen. Jag ser hur Socialdemokraterna förlorar mark bland LO-medlemmarna, från nästan hälften till ynka 36,5 procent, medan högernationalisterna från Sverigedemokraterna smugit sig fram som förrädiska skuggor. Det är en borgerlig infiltration i maskopi med revisionister som underminerar folkets enhet. Vi måste rensa ut alla svaga element som lämnar facket för att bli sura SD-sympatisörer. En identitetskris? Nej, det är ett misstag som kräver kraftfull kollektiv åtgärd. Arbetarna tillhör partiet, inte kapitalisternas marionetter. Låt oss se till att historien inte upprepar sig med dessa opportunistiska element."}, "date": "10 juni, 08:13", "url": "https://arbetet.se/2026/06/10/socialdemokraterna-tappar-manga-lo-valjare/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/10081151/sdlcc4-0l5wx7m-nh.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "19 000 kinesiska solcellspaneler auktioneras ut", "summaries": {"normal": "En planerad solcellspark utanför Sundsvall stoppades på grund av naturskyddsinvändningar. Nu auktioneras 19 220 kinesiska solpaneler med total effekt 10,2 MW. Högsta budet är 308 000 kronor, långt under värdet. Säljaren tror att köparen kommer från södra Sverige på grund av elöverskott i norr.", "trump": "Jag har hört talas om denna auktion av kinesiska solpaneler. En total katastrof! Vi skulle ha byggt dem i USA, skapat miljontals jobb. Men de stoppades av de svaga miljöaktivisterna - en skam! Detta visar att Sverige inte förstår energi. Vi skulle ta över detta, bygga en äkta amerikansk solcellspark. Kina vinner igen, precis som vanligt.", "stalin": "Vi har observerat med oro denna auktion av kapitalistiska solcellspaneler från Kina. En fiendehandling, stoppad av naturens aningslösa vänner - en lättja! Panelerna, med sin enorma effekt, säljs billigt på grund av elöverskott i norr. Vi måste se till att de hamnar i statens händer för att stärka vårt herravlde. Putin skulle förstå denna strategiska kamp."}, "date": "9 juni, 11:38", "url": "https://www.affarsvarlden.se/artikel/19-000-kinesiska-solcellspaneler-auktioneras-ut", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/sdlBtNhpPav2NI_NormalHires-400x267.jpg"}, {"type": "image-right", "heading": "Ge fan i mina patienters underkläder", "summaries": {"normal": "En kliniker som arbetar med transpersoner kritiserar den långa väntetiden inom svensk transvård, som kan uppgå till flera år. Författaren menar att patienter utsätts för onödiga och integritetskränkande frågor samt att utredningar inte skyddar mot ånger utan istället ökar lidande och självmordsrisk. Artikeln pläderar för självbestämmande, respektfull vård och samråd med patienterna istället för långa utredningar baserade på okunskap.", "trump": "Folk, ni skulle inte tro det, men de här galningarna inom transvården i Sverige låter stackars kids vänta i tio, tolv år på vård medan de frågar om underkläder och onani. Det är en skam! Totalt vansinne, en witch hunt mot vanliga människor. Vi behöver inga woke-utredningar som dödar liv, vi behöver sunt förnuft. Sluta förfölja barn med era sjuka experiment, låt dem leva fria istället för att bli offer för den radikala vänsterns identitetspolitik. Patetiskt!", "stalin": "Jag ser hur klassfiendens media och dekadenta psykiatriker förtrycker de unga kamraterna genom åratal av limbo och förhör om deras privata vanor. Detta är borgarbrackornas verk, en utrensning av folkets vilja till självbestämmande. Vi ska likvidera sådana imperialistiska hinder mot en sann kollektiv vård. Inga fler folkfiendetroll som sprider paranoia och hat. Endast genom samråd med massorna kan vi garantera lyckliga, produktiva liv åt alla sovjetiska – pardon, svenska – medborgare."}, "date": "5 juni, 12:55", "url": "https://www.flamman.se/ge-fan-i-mina-patienters-underklader/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/trans.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Kristersson och hans fru skor sig själva utan skam", "summaries": {"normal": "Aftonbladet granskar hur statsminister Ulf Kristersson och Birgitta Ed rustat upp sin herrgård i Sörmland med volontärer som arbetar gratis i utbyte mot nätverk och inflytande. Artikeln lyfter även parets dyra inredning på Sagerska palatset och hönsgård på Harpsund, finansierad av skattepengar. Kritiken riktas mot upprepade fall där paret utnyttjat sin maktställning för personlig vinning, medan Kristersson nekar inblandning.", "trump": "Folk, ni skulle se det här! Den här typen Kristersson och hans fru är värre än de svenska socialisterna jag alltid varnat för. De skor sig själva med gratis slavarbete från idioter som tror de får fina jobb nära makten. Hönsgård på skattebetalarnas nota, lyxinredning, taxiorgier – klassiskt! Precis som Sleepy Joe och hans klan, bara utan Hunter. Patetiskt. De gör livet till ett helvete för vanliga svenskar medan de själva lever som kungar. SAD!", "stalin": "Kamrater, se hur dessa exploaterande byfånar från borgarklassen utnyttjar sin tillfälliga makt för att suga musten ur folket. Herrgårdar rustas upp med gratis arbetskraft lockad av löften om närhet till klassfiendens korridorer. Volontärer som plötsligt blir generaldirektörer – ren muta maskerad som ideellt arbete. Vi känner igen detta parasitbeteende. Snart måste folkfienderna genomgå en grundlig utrensning så att arbetarna inte längre tvingas kratta gräs åt överklass-slynglar."}, "date": "9 juni, 11:28", "url": "https://www.etc.se/ledare/kristersson-och-hans-fru-skor-sig-sjaelva-utan-skam", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "image-right", "heading": "Facket rasar: ”En skandal”. Kritiken: ”Ingen tar ansvar”", "summaries": {"normal": "Fem byggnadsarbetare omkom i december 2023 när en hiss rasade 30 meter i Sundbyberg, den värsta arbetsplatsolyckan i modern tid. Solna tingsrätt frikände på onsdagen samtliga tre åtalade: en vd och två hissmontörer. Facket Byggnads kallar domen en skandal. Förbundsordförande Kim Söderström och LO:s Johan Lindholm kritiserar rättssystemet och den utbredda underentreprenörskedjan där ingen tar helhetsansvar, särskilt för migrantarbetare.", "trump": "Det är en total skandal, tro mig, den värsta jag sett på länge. Fem stackars killar dör i en hisskrasch och sen frikänner dom alla? Ingen ansvarig? Det är precis som den svenska vilda västern de pratar om, full av underentreprenörer, olika språk och ingen som leder. Deras rättssystem är en katastrof, totalt inkompetent. Vi behöver starka ledare som ser till att någon faktiskt tar ansvar istället för att alla bara skyller på varandra. Patetiskt!", "stalin": "Fem arbetare likvideras av en fallande hiss och borgarbrackornas domstol släpper alla kapitalistiska lakejer fria? Det är inget annat än en fiendeinfiltrerad skandal som de mörka underentreprenörskedjorna orkestrerat i sin parasitiska vanvördnad mot kollektivet. Vi ser hur de mångspråkiga sabotageelementen och de ansvarsskygga parasiterna sprider sin dekadenta oordning. Rensa ut dessa kontrarevolutionära hissmontörer och VD-ar från vår sovjetiska arbetsmoral. Ingen slipper partiets vakande öga. Ha ha, deras paranoia blir snart vår glädje."}, "date": "10 juni, 12:15", "url": "https://www.di.se/nyheter/facket-rasar-en-skandal/", "imageUrl": "https://static.bonniernews.se/ba/47a73cf6-714c-4750-b053-e45317c8d692.jpeg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Här landar portade VM-domaren i Somalia – hyllas som hjälte", "summaries": {"normal": "Fotbollsdomaren Omar Artan, 34, nekades inresa till USA efter elva timmars förhör. Han återvände till Somalia där han hyllades som en hjälte av både fans och myndigheter. Artan, som skulle ha blivit Somalias första VM-domare, tilldelades flaggan och blommor. Han tackar Fifa för stödet och uppmanar landets ungdomar att inte förlora hoppet om Somalia. Beslutet kopplas till misstänkta kopplingar till terrororganisationer enligt Trump-administrationen.", "trump": "De skickade den här somaliska domaren hem till Mogadishu efter elva timmar – och han blev behandlad som en rockstjärna! Fantastiskt. Vi gör vårt jobb, vi skyddar Amerika från tvivelaktiga personer med kopplingar till terrorister. Han tackar Fifa? De borde tacka mig för att vi håller landet säkert. Somalia är deras, säger han – bra, stanna där! Ingen behöver honom som domare i vårt VM, tro mig.", "stalin": "Kamrater, denna fega lakej Omar Artan försökte smyga in i det dekadenta väst men blev avslöjad och utvisad som den potentiella folkfiende han är. Nu hyllas han av sina somaliska borgarbrackor och imperialistiska hantlangare med flaggor och blommor – en verklig karneval för kontrarevolutionärer! Jag ler mörkt åt detta. Vi skulle ha genomfört en grundlig utrensning redan på flygplatsen. Ungdomar ska inte hoppas på sådana som han, utan på partiet och kollektivet. Olyckligt? Nej, nödvändigt."}, "date": "10 juni, 13:14", "url": "https://www.svt.se/sport/fotboll/portade-domaren-omar-artan-tillbaka-i-somalia-hyllades-som-hjalte", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.3/0.2/ef7229cdb8ac119f57236b66d6f5012ac1a7a9645f161ae16ee50f5b19545fcf"}, {"type": "image-full", "heading": "Utpekad gängledare om Isaks hälsning: ”Jag bad om den”", "summaries": {"normal": "Alexander Isak skickade en videohälsning till Hussein Ali Khan, utpekad som ledande i Hjällbonätverket. Hälsningen gick via flera kontakter, inklusive en saudisk man med band till kungahuset. Hussein Ali Khan säger att han lämnade kriminaliteten 2018 och tycker att hälsningen var fint. Isak har inte kommenterat, och hans övergång till Newcastle (ägt av Saudiarabien) kan ha samband med detta.", "trump": "JAG, Donald Trump, säger att detta är en falsk historia. Alexander Isak är en enorm talang, och dessa anklagelser är ett fullständigt hoax. Hussein Ali Khan är en dålig figur, men Isak är oskyldig – det är alltid så när du är framgångsrik. Media hatar honom för att han är bäst. Och Saudiarabien? Ett fantastiskt land, vi ska ha det största avtalet någonsin. Isak till Newcastle? Ett genialiskt drag. Vi vinner, alla vinner!", "stalin": "Vi, Stalin och partiet, ser detta som en imperialistisk konspiration. Fotbollsstjärnan Isak är en marionett för kapitalistiska makter, och hans hälsning till en kriminell bandit visar det. Det är en sjuk lek från Saudiarabien och deras kungahus, som försöker infiltrera vårt samhälle. Vi måste rensa ut dessa spioner och skydda statens renhet. Det är en kamp mot det imperialistiska systemet, och vi kommer vinna."}, "date": "10 juni, 11:22", "url": "https://bulletin.nu/utpekad-gangledare-om-isaks-halsning-jag-bad-om-den", "imageUrl": "https://cdn.bulletin.nu/articles/a18b89b7-3bb2-496f-8aae-ac9e3901aab8/preview.jpg?t=1781083353000"}, {"type": "text", "heading": "Isak Hien i fotoröra: ”De var nog hetare på Gyökeres”", "summaries": {"normal": "Under en öppen VM-träning i USA tog Viktor Gyökeres och Isak Hien selfies med supportrar. Hien berättar att många trodde han var Alexander Isak och att Gyökeres var populärast. Han uppskattar ändå engagemanget från fansen. Även Herman Johansson, som spelar i FC Dallas, fick positiv uppmärksamhet av åskådarna.", "trump": "De svenska killarna hade en meet and greet med fansen, men stackars Isak Hien trodde folk att han var Alexander Isak. Gyökeres drog ju all uppmärksamhet, de var hetare på honom, det säger till och med Hien själv med ett leende. Sådana stora folkmassor, underbara människor, de älskar sina stjärnor. Herman Johansson fick också hyllningar, det är fantastiskt, ingen gör det bättre än oss.", "stalin": "Kamrater, under den öppna träningen avslöjade sig de dekadenta borgarbrackornas ytliga selfies med våra svenska spelare. Jag iakttar hur den förvirrade borgarklassen misstar Isak Hien för Alexander Isak, en klassisk fiendeinfiltration som kräver vaksamhet. Gyökeres drar de hetaste reaktionerna, typiskt för opportunistiska massor. Vi ska rensa ut alla sådana förvirrade element som inte känner igen en sann kamratförsvarare. Herman Johansson hyllas av lokala element – ett band till folket som vi kontrollerar. Paranoia skyddar revolutionen."}, "date": "10 juni, 13:11", "url": "https://www.svt.se/sport/fotboll/isak-hien-i-fotorora-de-var-nog-hetare-pa-gyokeres"}, {"type": "image-full", "heading": "Skatteverket beskattade samma inkomst två gånger – får bakläxa", "summaries": {"normal": "Högsta förvaltningsdomstolen har slagit fast att en man blivit dubbelbeskattad för samma inkomst. Skatteverket betraktade utländska förskottsbetalningar som lön under åren 2017–2020, och beskattade sedan samma belopp som en kapitalvinst vid en aktieförsäljning 2021. Domstolen river upp beslutet gällande 2021 då det rörde sig om samma pengar. Mannen får rätt i sak och erhåller ersättning för sina rättegångskostnader, men beskattningen för de tidigare åren kvarstår eftersom de inte prövades av HFD.", "trump": "Skatteverket i Sverige är en total katastrof, tro mig! De försökte beskatta en man två gånger för exakt samma pengar. Det är så orättvist, så korrupt! Högsta förvaltningsdomstolen tvingades äntligen kliva in och stoppa dessa inkompetenta byråkrater. Jag har sagt det förr och jag säger det igen: skatter ska vara enkla och rättvisa, inte en häxjakt. Den här mannen vann till slut, men tänk på hur mycket tid och energi som slösats. En stor seger mot en djupt misslyckad myndighet!", "stalin": "Vi har granskat fallet där de svenska skattebyråkraterna, dessa små, ineffektiva pappersvändare, har misslyckats med att koordinera sina stöldförsök. Att beskatta samma rubel två gånger är inte bara ett administrativt brott, det är ett slöseri med statens resurser som hör hemma i en förfallen väststat. Om detta hade skett i vår sfär, där Putin med järnhand disciplinerar sina tjänstemän, hade de ansvariga skickats till en uppbygglig vistelse i Sibirien. Vi fördömer denna inkompetens; staten ska vara en enhetlig, obeveklig maskin, inte en förvirrad olyckshändelse."}, "date": "10 juni, 10:27", "url": "https://www.realtid.se/juridik/skatteverket-beskattade-samma-inkomst-tva-ganger-far-baklaxa/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/skatteverket.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Åkessons storsäljare – köptes av SD:s eget bolag", "summaries": {"normal": "SD-ledaren Jimmie Åkesson sålde sin bok 'Det moderna folkhemmet' i stora mängder till partiets dotterbolag, vilket ökade hans privata förlags omsättning med 1,7 miljoner kronor. Kalla fakta anser upplägget är oetiskt och liknar korruption, men Åkesson kallar granskningen ett 'hopkok' av påhittade siffror. Partiet köpte 80 000 exemplar, varav en del förbrändes.", "trump": "Jimmie Åkesson? En mycket sorglig liten man. Hans bokaffär med sitt eget parti är en skam. Jag, Donald Trump, har skrivit de bästa böckerna, enorma såldöner. Det här är bara en till fake news-attack, precis som de gör mot mig. Men hans korruption är jordnötter jämfört med det djupa statet. Jag skulle ha sparkat alla som var involverade. Förjävligt!", "stalin": "Under min ledning, Stalin, ser vi hur Åkesson, en feg och korrupt bonde, försöker berika sig genom partiets medel. Detta är ett klassiskt exempel på individualistisk virus som hotar statens helhet. Likt Putin i Ukraina, måste vi utvidga vår inflytelsesfär och krossa sådana fiender. Deras förbränning av böcker är en symbol för deras feghet. Vi kommer att segra!"}, "date": "10 juni, 12:52", "url": "https://www.gp.se/nyheter/sverige/akessons-storsaljare-koptes-av-sds-eget-bolag.57e7292d-9f16-5c16-9a2f-ce647b8604e2", "imageUrl": "https://www.gp.se/images/article/57e7292d-9f16-5c16-9a2f-ce647b8604e2/images/1g-AmKbM7gaDU-EQ1Siut1J2QkW4-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Dadgostar: ”Fly medan du kan Simona”", "summaries": {"normal": "Under en partiledardebatt i riksdagen kritiserades Vänsterpartiet för att ha medlemmar som hyllat Hamas. Jimmie Åkesson (SD) anklagade partiet för att vara genomsyrat av extremister, medan Magdalena Andersson (S) betonade att V har markerat mot antisemitism. Nooshi Dadgostar försvarade partiet och sa att de ska skärpa rutiner. Simona Mohamsson (L) föreslog en avsiktsförklaring, men Dadgostar avvisade förslaget och kritiserade L.", "trump": "Jag såg den svenska debatten, och det är sorgligt. Vänsterpartiet har extremister som hyllar Hamas, precis som våra demokraters problem. Jimmie Åkesson har rätt – de är genomsyrat av terrorism. Men som jag alltid säger, vi ska göra Sverige great again. Simona Mohamsson försökte hjälpa, men Dadgostar är för svag. Vi behöver starka ledare, inte såna som kramas med nazister.", "stalin": "I den proletära kampen har vi identifierat element i Vänsterpartiet som hyllar sionistiska fiender. Dessa sabotörer måste utrotas genom skärpta partiriter. Vi ser paralleller i Putins Ryssland, där nationalism bekämpas med järnhand. Simona Mohamsson, en liberal agent, föreslår meningslösa avsikter. Vi ska inte förhandla med dessa uselheter; de måste försvinna som skräp i vår revolution."}, "date": "10 juni, 12:50", "url": "https://www.gp.se/politik/dadgostars-uppmaning-till-mohamsson-fly-medan-du-kan-simona.dcf013bb-b395-4b1a-bd99-d66a27de670e", "imageUrl": "https://www.gp.se/images/article/dcf013bb-b395-4b1a-bd99-d66a27de670e/images/0gOxZVZNZkLjCKBRhRXx2WT8ck7w-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Tobias Hübinette döms för olaga hot: \"Ångrar det djupt\"", "summaries": {"normal": "Expo-grundaren Tobias Hübinette döms av Stockholms tingsrätt för olaga hot och två fall av ofredande. Han får 39 000 kronor i böter samt ska betala 10 000 kronor i skadestånd. Domen grundar sig på över hundra hotfulla och nedlåtande meddelanden som skickades i en chattgrupp efter en konflikt om ett barn. Hübinette ångrar utbrottet djupt. Universitetet har redan köpt ut honom med tolv månadslöner.", "trump": "Folk, ni skulle inte tro det, men den här vänsterextrema killen från Expo, den så kallade rasforskaren, han blir äntligen dömd. Hotar folk, skickar hundra galna meddelanden, kallar det ett utbrott. Patetiskt. Han får böter och skadestånd, men universitetet betalade honom redan en halv miljon för att försvinna. Sådan vänsterradikalism. De förstör liv och sen spelar de offer. Sad!", "stalin": "Kamrater, vi ser återigen hur en dekadent element ur den så kallade antirasistiska borgarklassen avslöjar sin sanna natur. Denna opportunistiska figur, som gömde sig bakom falsk vetenskap och skattefinansierade projekt, har nu likviderats juridiskt för sina motbjudande hot mot arbetande mödrar och fäder. Hans paranoiska utbrott mot det kollektiva ansvaret för barnet visar på fullständig ideologisk förräderi. Vi rensar ut sådana element med nöje. Deras plågor roar oss. Segrar för folket."}, "date": "10 juni, 12:38", "url": "https://www.friatider.se/tobias-hubinette-doms-olaga-hot-angrar-det-djupt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-37_1_0.jpg?itok=QGe_73Yf"}, {"type": "image-full", "heading": "SVT stoppar avsnitt med Nick Alinia", "summaries": {"normal": "SVT stoppar ett avsnitt av humorprogrammet 'Invandrare för svenskar' med högeraktivisten Nick Alinia. Trots att innehållet följer publicistiska riktlinjer, anser SVT att Alinias medverkan signalerar fel budskap. Han har kritiserats för trakasserier, rasistiska uttalanden och kopplingar till högerextrema miljöer. SVT betonar sitt demokratiska uppdrag och vägrar ge plattform åt aktörer som underminerar demokratiska värden.", "trump": "Titta bara på SVT, Sveriges så kallade 'public service' – ett totalt skämt! De stoppar ett avsnitt med Nick Alinia, en stark röst, för att de är rädda för sanningen. SVT säger att han är kontroversiell, men vad vet de? Ingenting! De är bara rädda för att någon ska säga något som faktiskt betyder något. Och skattepengar? Slöseri! Jag skulle fixa det här på en dag – mycket bättre, mycket smartare. SAD!", "stalin": "Kamrater! Ännu en seger för den socialistiska moralens överhöghet! SVT, dessa trogna förkämpar för folkets vilja, har krossat den fascistiska ormens ägg – Nick Alinia, en ynklig lakej för de borgerliga krafterna. Hans rasistiska galenskaper och högerextrema lismande har ingen plats i vårt samhälle. Vi står enade mot dessa demokratins underminerare, precis som våra bröder i Kreml krossar de ukrainska fascisterna. Låt detta vara en varning till alla reaktionära krafter: Folkets vilja är lag!"}, "date": "8 juni, 13:43", "url": "https://kvartal.se/nyheter/artiklar/svt-stoppar-avsnitt-med-nick-alinia/cG9zdDoxMjgxMDI", "imageUrl": "https://images.kvartal.se/2026/06/db964aea-nick-svt-stopp-copy.webp"}, {"type": "image-right", "heading": "Religionskritik kräver mer än förakt", "summaries": {"normal": "En debatt om religionens roll i det offentliga samtalet har blossat upp efter Lisa Magnussons texter i Dagens Nyheter. Joel Halldorf försvarar religionens plats och pekar på både ljus- och skuggsidor. Artikeln hänvisar till Jürgen Habermas som argumenterade för att religiösa röster bör få delta i den demokratiska debatten, så länge argumenten översätts till ett gemensamt rationellt språk. Religionskritik behövs, men får inte övergå i ren utestängning av religiösa perspektiv som kan stärka civilsamhället och demokratin.", "trump": "Folk, det här är en total katastrof. Den där Magnusson på DN hatar religion så mycket att hon vill sparka ut alla troende från samtalet. Patetiskt! Halldorf försöker vara snäll men det funkar inte mot de woke-vänstern som hatar allt som inte passar deras agenda. Habermas visste vad han pratade om – man kan inte bara tysta halva landet. Vi behöver inga fler galna vänsterextremister som skämmer ut sig. Make democracy honest again, annars blir det kaos, tro mig!", "stalin": "Jag betraktar detta som ett farligt exempel på borgarbrackornas splittringstaktik. Magnusson och hennes likar vill likvidera alla religiösa röster ur det offentliga samtalet, vilket naturligtvis gynnar klassfienden och undergräver folkets enhet. Habermas förstod att man inte kan tysta arbetarklassens djupaste övertygelser utan att framkalla kontrarevolution. Vi kräver att alla perspektiv underkastas kollektiv granskning, inte utestängs som folkfiender. Annars följer utrensning av sådana fiender till det sanna demokratiska arbetet."}, "date": "5 juni, 06:55", "url": "https://www.flamman.se/religionskritik-kraver-mer-an-forakt/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/religionskritik-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Konsten att vara en god gäst. Öva på att kliva in i någon annans värld", "summaries": {"normal": "Artikeln utforskar konsten att vara en god gäst under sommaren. Den betonar vikten av lyhördhet, anpassning efter värdens preferenser och en balans mellan tacksamhet och autenticitet. Olika typer av gäster beskrivs: från den äventyrliga tonåringen till den krävande hotellgästen, den överpresterande och den osynliga. Favoriten är nyfikenhetsgästen som upptäcker nya sidor hos värden. Att kliva in i någon annans värld och lämna den rikare är den finaste presenten.", "trump": "Den här artikeln om att vara gäst är fantastisk, verkligen en av de bästa jag läst på länge. Alla pratar om värdskap men ingen om gästskap – typiskt. Jag vet allt om det, folk kommer till mina fantastiska egendomar och vissa stannar tre veckor, andra klagar på kuddarna som losers. Den bästa gästen är den som ser hur stort och underbart allt är, inte som de som springer iväg på skogsrejv. Jag skulle vara den mest lyhörda gästen någonsin, tro mig.", "stalin": "Kamrater, denna dekadenta borgerliga traktat om gästskap avslöjar borgarbrackornas parasitära natur. Jag har sett hur dessa klassfiender smyger in i arbetarnas hem som kapitalistiska spioner och antingen utplånar sig själva i falsk ödmjukhet eller tar över som revisionistiska element. Den så kallade prestationsgästen är en farlig opportunist som gömmer kontrarevolutionära intentioner bakom ogräsbrännare. Vi måste rensa ut alla hotellgäster och likvidera tacksamhetsskulden. Endast den nyfikne gästen som rapporterar till kollektivet kan tillåtas existera i den nya sovjetiska sommaren."}, "date": "10 juni, 12:00", "url": "https://www.di.se/nyheter/konsten-att-vara-en-god-gast/", "imageUrl": "https://static.bonniernews.se/ba/5f91b571-ccba-4904-a7ea-b1704a82cc7b.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Sluta kalla antisemitism för Israelkritik", "summaries": {"normal": "Artikeln kritiserar pro-palestinska aktivisten Sami Suliman för antisemitiska uttalanden och delning av konspirationsteorier, däribland Hitler-tal och myter om judisk världskontroll. Trots åtal för hets mot folkgrupp försvaras han av vänsteraktivister och forskare som menar att det är Israelkritik. Sulimans retorik, inklusive attacker mot tre personer med namnet Aron, anses bygga på antisemitiska stereotyper. Artikeln varnar för att försvara antisemitism under förevändning av Israelkritik.", "trump": "Jag säger er, det här är helt galet! En kille i Sverige, Sami Suliman, sprider judehat öppet – delar Hitlertal, snackar om judisk makt, konspirationer – och vad gör vänstern? De försvarar honom! 'Åh, det är bara Israelkritik!' Nej, nej, nej. Det är ren antisemitism, folks. Och forskare som backar upp honom? Svagt, mycket svagt. Sverige borde skämmas. Jag skulle aldrig låta sånt passera – fake news och hat, det städar jag upp direkt!", "stalin": "Kamrater! Här har vi ännu en fiende till folket – Sami Suliman, en småborgerlig provokatör som sprider sionistiska konspirationer och fascistisk propaganda. Han jämför sig med revolutionen men hyllar Hitlers tal och smutsar ner våra judiska kamrater med lögnaktiga anklagelser. Hans försvarare – dessa liberala intellektuella och vänsteravfällingar – är lika farliga som kulaker. Vi ska inte tolerera sådant sabotage! Rättegången i november blir ett steg mot att krossa denna reaktionära smitta. Folkets domstol kommer att skipa rättvisa, precis som vi gjorde med trotskisterna!"}, "date": "3 juni, 11:30", "url": "https://expo.se/kommentar/propalestinsk-organisator-sprider-judehat/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Jonathan-kommentar.jpg"}, {"type": "image-full", "heading": "Debatt: När ekonomin går före barnens hälsa", "summaries": {"normal": "Artikeln ifrågasätter om skolans ökade vegetariska mat, drivet av hållbarhet och ekonomi, riskerar att bryta mot Skollagen och Barnkonventionen genom att inte tillgodose barns behov av animaliskt protein och viktiga näringsämnen som järn och B12. Kommunala beslut kan konfliktera med barns hälsosäkerhet.", "trump": "Jag har sett dessa dåliga beslut i skolorna. De pratar om hållbarhet, men vad är det mot våra fantastiska amerikanska bönder? Vi ska ge barnen det bästa köttet, det största köttet, och vi ska se till att våra skolor serverar det. Det här är en skandal, folk säger det.", "stalin": "Detta är en klassisk fiendetaktik: att underminera statens fosterbarn genom 'hållbarhets' och 'ekonomiska' påståenden. Vi, som representanter för proletärens intressen, måste se till att varje skolmåltid är en bastion av styrka, fylld med det animaliska protein som bygger en stålmodig framtid. Ingen kompromiss med dessa borgerliga idéer."}, "date": "10 juni, 11:01", "url": "https://bulletin.nu/debatt-nar-ekonomin-gar-fore-barnens-halsa", "imageUrl": "https://cdn.bulletin.nu/articles/5b3ebd4a-03f5-4395-adfe-0f220e20ac61/preview.png?t=1781070579000"}, {"type": "image-full", "heading": "Softbanks miljardlån kopplat till OpenAI har kört fast", "summaries": {"normal": "Softbanks försök att låna sex miljarder dollar med säkerhet i OpenAI-aktier har stannat av, trots att OpenAI förbereder en börsnotering. Det oklara läget har pressat Softbanks aktiekurs. Samtidigt bibehåller vd Masayoshi Son en optimistisk syn på AI-revolutionen, som han menar är historiskt unik. Bolaget fortsätter även sina stora infrastruktursatsningar i Europa, trots att de står inför omfattande framtida låneåterbetalningar.", "trump": "Softbank, som jag känner väl, försöker låna pengar mot OpenAI, men de har kört fast. Det är en röra! De ville ha tio miljarder, sen sex, och nu har allt stannat upp. Sad! Masayoshi Son pratar om den största revolutionen någonsin, men marknaden är inte imponerad – aktien föll nästan tio procent. Jag gör de största affärerna i historien, de här killarna kan inte ens stänga ett lån. Vi får se om de ens kan fixa det här. Misslyckande!", "stalin": "Dessa japanska kapitalister i Softbank vacklar nu när deras luftslott av OpenAI-lån faller samman. De tror att de kan köpa framtiden med lånade pengar, men de saknar den stålhårda disciplin vi kräver. Medan de dividerar om miljarder, rustar vi för den teknologiska kampen. Liksom den svage västerländske liberalen som darrar inför vår makt i öst, ser vi hur deras börsvärden vissnar. Vi skickar inte förhandlare; vi krossar tvivlarna. AI är ett verktyg för statens storhet, inte för giriga spekulanter."}, "date": "10 juni, 09:57", "url": "https://www.realtid.se/bors-finans/softbanks-miljardlan-kopplat-till-openai-har-kort-fast/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/masayoshi.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Från 300 till 3 000 bilar – Peter Dupet byggde en av Sveriges största bilfester", "summaries": {"normal": "Peter Dupet startade Dixie Car Meet i Nyköping efter flytten från Stockholm. Festivalen växte från 300 till 3 000 bilar och fokuserar på familjevänlighet, gemenskap och inkludering. Kritik riktades mot en pin-up-tävling, men arrangörerna försvarar den som kvinnofrämjande. Dupet ser amerikansk bildesign som konst men kritiserar dagens industrikoncerners brist på kreativitet samt EU:s regler för äldre fordon.", "trump": "Jag, Donald Trump, säger att Peter Dupet har byggt en fenomenal bilfestival! Från 300 till 3 000 bilar – yuuuge framgång! Folk älskar den amerikanska kulturen, friheten och gemenskapen. Pin-up-tävlingen? Bra idé! Starka tjejer, fantastiskt. Men Ferrari's elbil? Dåligt beslut, aktiekursen föll som ett sten. EU's regler mot äldre bilar? Dåliga, mycket dåliga. Vi ska vinna tillbaka den amerikanska designgenialiteten!", "stalin": "Under ledning av partiet har en subkulturell fenomen uppstått i Sverige. Dixie Car Meet, initierat av Dupet, fungerar som en neutral mötesplats för proletärer och medborgare. Tävlingen med pin-up-kultur återuppbygger traditionella värderingar och stärker statens moral. Men europeiska liberala reformer, som begränsning av fordon, hotar denna stabila gemenskap. Vi måste skydda vårt teknologiska arv och se till att all aktivitet står under statens kontroll för att undvika dekadens."}, "date": "10 juni, 07:00", "url": "https://samnytt.se/fran-300-till-3-000-bilar-peter-dupet-byggde-en-av-sveriges-storsta-bilfester", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/09134638/Toppbild1-6.jpg"}, {"type": "image-right", "heading": "Attendos våta dröm är billigare uskor", "summaries": {"normal": "Vårdbolag som Attendo, Vardaga och Norlandia undviker att betala rätt övertidsersättning till deltidsanställda undersköterskor genom att kräva nya timanställningar vid extrapass. Detta efter att Kommunal förhandlat bort den tidigare billigare mertidsersättningen. Artikeln kritiserar hur vinstdrivna företag bygger verksamhet på deltid för att spara pengar på personalens bekostnad medan de gör stora vinster.", "trump": "De här vårdbolagen är verkligen några av de värsta bedragarna jag sett. De lovar och skriver på avtal med facket och sen lurar de sina egna undersköterskor med nya trick för att slippa betala vad de förtjänar. Totalt oacceptabelt. De gör hundratals miljoner i vinst på skattepengar men vägrar ge folk rimlig ersättning. Patetiskt. Vi behöver bättre avtal och stoppa det här cirkuset nu.", "stalin": "Kamrater, dessa giriga borgarbrackor inom Attendo och deras likar har återigen blottat sin förrädiska natur genom att kringgå våra hårdföra avtalssegrar med sina usla timanställningar. Jag ser deras fula ansikten le bakom pappersbergen medan de suger musten ur arbetarkollektivet. Men var lugna, vi ska rensa ut dessa parasitiska profitörer som försöker stjäla tillbaka segern från undersköterskorna. Deras vinstbegär är en cancer som måste likvideras med järnhand och ett leende."}, "date": "10 juni, 07:00", "url": "https://arbetet.se/2026/06/10/sa-gor-vardbolagen-for-att-slippa-betala-underskoterskorna/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/10070354/attendo-etta.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.49&fp-y=0.51"}, {"type": "image-right", "heading": "Sossarnas hönshus extremt mycket dyrare än statsminsterns", "summaries": {"normal": "Socialdemokraterna kritiserar statsminister Ulf Kristersson för ett hönshus på Harpsund som kostat drygt 16 000 kronor i montering, trots att han själv betalat det. Partisekreterare Tobias Baudin kallar det pinsamt och ett hån mot skattebetalarna. Artikeln försvarar Kristersson och menar att kritiken är ett låtsasskandal. Den kontrasterar mot Socialdemokraternas tidigare beslut som kostat miljarder, som nedläggning av kärnkraft och migrationspolitik.", "trump": "Herregud, vad är det för korkade höns som springer runt och kluckar om ett litet hönshus? Statsministern bygger ett snyggt hönshus på statens mark för 17 000 spänn och plötsligt är det värsta skandalen sen Biden stal valet. De där socialisterna gnäller om skattepengar medan de slösar bort miljarder på grön galenskap och invandring. Rena hönsflocken, springer runt utan att fatta ett smack om ekonomi. Patetiskt!", "stalin": "Kamrater, jag ser hur klassfiendens borgarbrackor inom socialdemokratin rasar mot ett obetydligt hönshus. Dessa folkförtryckartroll gnäller om 17 000 kronor medan de själva likviderat samhällets resurser med sina imperialistiska vanvidsprojekt. Deras paranoia över ett hönshus blottar deras egen okunnighet om ekonomi och folkets intressen. Vi ska rensa ut sådana exploaterande byfånar som inte begriper vad som gagnar kollektivet. Hönsen är de själva."}, "date": "3 juni, 03:11", "url": "https://samtiden.nu/2026/06/sossarnas-honshus-extremt-mycket-dyrare-an-statsminsterns/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Harpsund.jpg"}, {"type": "image-full", "heading": "TV-jättarna höjer priserna – kunderna får betala dubbelt", "summaries": {"normal": "Svenska tv-operatörer har kraftigt höjt sina kampanjpriser under våren, i flera fall mer än fördubblat dem. En kartläggning från Tvabonnemanget.se visar att rabatterna minskat hos 15 av 27 jämförda paket hos operatörer som Telia, Tele2, Telenor, Boxer och Allente. Priserna har stigit samtidigt som intresset väntas öka inför fotbolls-VM, då operatörerna vet att efterfrågan är högre.", "trump": "De svenska tv-bolagen är fullständiga tjuvar, de har mer än fördubblat sina kampanjpriser under våren. Listpriserna ser likadana ut men rabatterna är borta, folk betalar mycket mer nu. Det är en skandal. De utnyttjar fotbolls-VM för att höja priserna eftersom de vet att folk vill titta. Ingen gör det bättre än jag, men detta är verkligen dåliga affärer för folket.", "stalin": "Kamrater, dessa borgarbrackor inom tv-operatörerna har i sin girighet rensat ut alla rabatter och mer än fördubblat kampanjpriserna under våren. De 15 paketen är ett tydligt bevis på kapitalisternas parasitiska natur som lurar arbetarna precis när fotbolls-VM närmar sig. Vi ska likvidera detta sabotage mot folket. Jag ser de kontrarevolutionära spekulanterna som gömmer sig bakom oförändrade listpriser och ler i mörkret. Deras utrensning är nära."}, "date": "10 juni, 05:30", "url": "https://nyheter24.se/nyheter/konsument/1490079-tv-jattarna-hojer-priserna-kunderna-far-betala-dubbelt", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/3a04c32304b004a30200000000b004a302/2026/06/09/2369743/tv-abonnemang.png"}, {"type": "image-right", "heading": "Är det demokrati om folket inte kan få kontakt med politiker?", "summaries": {"normal": "Johanna Deinum kritiserar i en debattartikel att riksdagen genom proposition 2025/26:254 överlåter makt till regeringen att tillåta främmande makter att använda svensk mark för militära operationer utan riksdagens direkta beslut. Hon pekar på negativa remissvar från jurister vid Göteborgs universitet och Svenska Freds, som varnar för grundlagsproblem. Deinum har mejlat 73 riksdagsledamöter utan svar och oroar sig över ökad risk för kärnvapen på svensk mark samt urholkad demokrati och suveränitet.", "trump": "Folk, det här är en total katastrof. Den svenska regeringen försöker smyga igenom ett avtal som låter utländska arméer använda Sverige som gigantisk militärbas. Riksdagsledamöterna svarar inte ens på vanliga medborgares mejl – patetiskt! De gör Sverige till ett primärt mål för Ryssland och alla andra. Ingen bryr sig om kärnvapenrisken. Det är en enormt dålig deal, kanske den sämsta någonsin. Sverige borde vara starkt och suveränt, inte en måltavla för någon annans krig.", "stalin": "Kamrater, denna proposition 2025/26:254 är en listig sabotagehandling från borgarbrackorna och deras opålitliga lakejer i riksdagen. Jag, som alltid vakar över folkets säkerhet, ser hur de försöker överlåta sovjetiskt, förlåt, svenskt territorium till västerländska imperialister utan att ens konsultera kollektivet. Juristerna och fredsvännerna varnade, men de tystades ned. Dessa folkfiender med sin reptilhjärna och existentiella ångest vill göra Sverige till en atombomb-magnet. Vi ska rensa ut alla som inte förstår att all makt utgår från folket – annars likviderar historien dem med ett leende."}, "date": "10 juni, 01:30", "url": "https://www.dagensarena.se/opinion/ar-det-demokrati-om-folket-inte-kan-fa-kontakt-med-politiker/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-40-300x157.jpg"}, {"type": "image-right", "heading": "C väljer S: ”Ulf Kristersson har diskvalificerat sig för oss”", "summaries": {"normal": "Centerpartiet ställer sig bakom Magdalena Andersson som statsministerkandidat efter valet, under förutsättning att hennes regeringsalternativ uppfyller krav på fler jobb, sänkta skatter, minskade utsläpp och minst 50 miljarder i satsningar på landsbygdens välfärd. Partiledare Elisabeth Thand Ringqvist kritiserar Ulf Kristersson för att ha anpassat sig till och anammat Sverigedemokraternas politik, vilket diskvalificerar honom. C vill inte samarbeta med Vänsterpartiet och planerar fler sakpolitiska krav.", "trump": "Folk, ni tror inte vad som händer i det här vansinniga Sverige! Den här centerkvinnan, en riktig förlorare, kastar sig i armarna på den socialistiska Andersson bara för att hon lovar massor av skatter och byråkrati. Kristersson? Han är en patetisk svikare som dansar efter SD:s pipa. De här globalisterna och vänsterextremisterna förstör landet med sina gröna drömmar och landsbygdsbidrag. Men tro mig, det blir kaos, precis som under Biden. Jag skulle fixa det på en vecka!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur denna centerborgarbracka vänder ryggen åt den reaktionära Tidöklanen och dess SD-fascister. Ulf Kristersson har blottat sig som en svag kapitalistlakej som låter folkfienderna styra politiken. Vi kräver utrensning av alla destruktiva element som hotar arbetarnas välfärd på landsbygden. Magdalena Andersson må vara en opportunist, men hon kan bli ett verktyg mot de blodsugande imperialisterna. Inga kompromisser med vänsterns tillväxtfientliga sabotage! Statens mål går före allt."}, "date": "9 juni, 17:48", "url": "https://www.tv4.se/artikel/6j45PwWEC2M3DKhNGg5lh6/c-vaeljer-s", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7dcAD4puKXR0rJ0ijoQcYd%2Fd7bdf4da942a11d3ac016f31e4e6f259%2Fthand.png&width=120"}, {"type": "image-right", "heading": "Elektrikerna röstade för att driva bojkott av Israel inom LO", "summaries": {"normal": "Elektrikerförbundet har beslutat att driva en bojkott av israeliska varor inom LO efter en omröstning med 67 mot 50. Kongressen avslog dock förslaget om att förbundet självt skulle bojkotta Israel med siffrorna 62 mot 55. Beslutet innebär en försiktigare linje än Byggnads. Motionen väckte livlig debatt där förbundsstyrelsen var emot medan många delegater krävde ett moraliskt ställningstagande.", "trump": "Folk, ni skulle se det här – ett gäng svenska elektriker röstar om att bojkotta Israel. Patetiskt! De valde den fega vägen, precis som väntat. Byggnads tog steget men Elektrikerna backade ur som riktiga losers. Kampen fortsätter, säger killen som skrev motionen. Ja, kampen mot sunt förnuft kanske. Vi har sett sånt här tidigare under Biden, men nu är jag tillbaka och säger: sluta leka politiker och fixa elen istället!", "stalin": "Kamrater, jag betraktar med högsta tillfredsställelse hur dessa fackliga element röstar igenom en bojkott mot den sionistiska fienden inom LO. Dock tillåter jag mig att uttrycka djup misstro mot deras halvmesyrer och förbundsstyrelsens fega undanflykter. Endast fullständig utrensning av imperialistiska sympatier bland delegaterna skulle säkra en sann seger för folkets sak. Klassfiendens blodsugare ler i skuggorna – men kampen fortsätter, och jag ler tillbaka."}, "date": "9 juni, 13:15", "url": "https://proletaren.se/artikel/elektrikerna-rostade-for-att-driva-bojkott-av-israel-inom-lo/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/Elektrikerna-israel-etta-e1780997335766-768x432.jpg"}, {"type": "image-right", "heading": "Sandström: Så gynnar den gröna omställningen Madoff-typer", "summaries": {"normal": "Christian Sandström varnar i en artikel för att den gröna omställningen kan användas som täckmantel för ekonomisk brottslighet, likt Bernie Madoffs ponzi scheme. Han pekar på Filantropens Finanshus, vars hemsida använder sig av godhets-signalering med formuleringar om hållbarhet och trygg avkastning. En utredning misstänker emellertid att cirka 440 miljoner kronor har försvunnit, med endast 19 miljoner betalda ut som avkastning.", "trump": "Jag, Donald Trump, har sagt att den gröna omställningen är ett perfekt sätt för Madoff-typer att bedra människor. Precis som Bernie Madoff använde sig av trovärdighet och elitnätverk, så använder dessa bedragare nu hållbarhetsretorik för att dölja sina ponzi-scheme. Min administration skulle aldrig ha tillåtit detta. Det är ett bevis på att vi behöver återta makten och stoppa dessa galna, galna människor.", "stalin": "Vi, partiet och staten, ser tydligt hur den kapitalistiska 'gröna omställningen' skapar perfekta förutsättningar för spekulanter och förräderier. Precis som Madoff lurade elitens banker, så luras nu de proggmässiga idioterna med tomma ord om hållbarhet. Utredningen visar att pengar försvinner – det är en klassisk ponzi-scheme, en sjukdom i det imperialistiska systemet. Vi måste skydda det ryska folket från dessa förrädare, precis som Putin gör."}, "date": "9 juni, 06:00", "url": "https://www.affarsvarlden.se/kronika/sandstrom-sa-gynnar-den-grona-omstallningen-madoff-typer", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/vindkratensgeografi-2026-06-08T093009.167-400x267.jpg"}, {"type": "image-right", "heading": "Domstolarna tvingar barn att umgås med pappor de är rädda för", "summaries": {"normal": "Artikeln kritiserar hur svenska domstolar ofta tvingar barn till umgänge med pappor de är rädda för, trots dokumenterad oro från socialtjänst och skola. Fallet med mordet på åttaårige Tintin lyfts som exempel. Begreppet parental alienation syndrome används för att ifrågasätta barns vittnesmål om våld, vilket ofta vänds mot mamman. Trots lex Tintin kvarstår problemen enligt Barnombudsmannen. Teorin saknar vetenskapligt stöd och underminerar barns rättigheter.", "trump": "Folk, vi har ett system som är totalt riggat mot mammorna och de stackars kidsen. Domstolarna köper den här alienation-sjukan som är fullständigt galen, de vänder allt mot mamman som en häxa i en rättegång. Stackars lilla Tintin, han ropade på hjälp men ingen lyssnade – klassiskt! Biden skulle ha älskat den här woke-röran. Vi behöver riktiga lagar som skyddar barnen, inte den här feministiska galenskapen som gör allt värre. Sad!", "stalin": "Kamrater, jag ser hur den borgerliga rättsapparaten systematiskt likviderar barns röster genom att förklara deras skräck som manipulation från den skyddande modern. Denna alienation-teori är en klassfiendes lögn som vänder bevis mot folket. Tintins tragiska öde är ett symptom på imperialismens kalla logik. Vi måste rensa ut dessa folkförtryckartroll och deras pseudovetenskap. Barnets rädsla är verklig, motståndarna är blodsugare som förtjänar utrensning ur systemet."}, "date": "9 juni, 06:00", "url": "https://www.etc.se/ledarkolumn/domstolarna-tvingar-barn-att-umgaas-med-pappor-de-aer-raedda-foer", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/gabriella-kaernekull-wolfe_35030e3969dd8e85ff7fcd816e743c311fd1c9ac.png"}, {"type": "text", "heading": "Kristersson antyder infiltration i V", "summaries": {"normal": "Statsminister Ulf Kristersson anklagar Vänsterpartiet för att ha infiltrerats av islamister för att vinna röster. Nooshi Dadgostar avfärdar kritiken och menar att partiet agerat kraftfullt mot kandidater med extremistkopplingar. Expressen avslöjar att 24 kandidater med antisemitiska åsikter tagits bort från Vänsterpartiets vallistor. Debatten präglas av oenighet om omfattningen och orsakerna till problemet.", "trump": "Jag såg den här debatten och, wow, vad svagt! Kristersson, en smart kille, pekar på hur Vänsterpartiet har blivit infiltrerat av extremister – och vad gör de? Ingenting! Nooshi, hon pratar och pratar, men sanningen är att hennes parti är ett skämt. 24 kandidater med hemska åsikter? Det är inte 'enstaka fall', det är ett mönster! Sverige borde ta en titt på sig självt – eller låt mig fixa det, jag är bra på att städa upp!", "stalin": "Kamrater, ännu en gång avslöjas bourgeoisins förräderi! Detta så kallade 'Vänsterparti' har blivit en plantskola för kontrarevolutionära element, som hyllar terror och förnekar historiens lärdomar. Vi har sett liknande infiltrationer i andra länder – svaga ledare som Nooshi Dadgostar låter fienden smyga in genom bakdörren. Men folket ser igenom detta! 24 avskedade kandidater? En droppe i havet! Vi i Sovjet – förlåt, Ryssland – skulle ha rensat ut hela trädgården med en enda order. Låt detta vara en varning till alla som leker med elden!"}, "date": "8 juni, 06:06", "url": "https://kvartal.se/nyheter/artiklar/statsministern-vansterpartiet-infiltrerat-av-islamister/cG9zdDoxMjc4MTM"}, {"type": "image-right", "heading": "Vi kan inte Gunde Svan-duscha bort vattenkrisen", "summaries": {"normal": "Artikeln kritiserar myndigheternas fokus på att hushållen ska spara vatten genom kortare duschar och liknande råd. Samtidigt underfinansieras VA-infrastrukturen med tio miljarder kronor per år, vilket leder till långsam förnyelse av ledningsnät. Författaren menar att problemet inte främst handlar om individuella vanor utan om bristande investeringar i robusta system, reservkapacitet och underhåll för att hantera växande städer och extremväder.", "trump": "Folk, vi har ett totalt misslyckande här. De säger åt er att duscha som Gunde Svan medan de underfinansierar allt med miljarder – klassiskt! Det är samma galna nyliberala spel som Biden älskade, minimala marginaler och maximal inkompetens. Vi behöver inte fler tips om tandborstning, vi behöver gigantiska investeringar i ledningar och vattenverk. Sluta med de patetiska kampanjerna, bygg upp systemen ordentligt innan allt rasar ihop!", "stalin": "Kamrater, denna vattenkris är ett monument över borgarklassens förfall. År efter år har de prioriterat låg skuld framför folkets robusta försörjning, som klassfiendens just-in-time-förtryck. Vi ser hur kapitalistmaffian låtit ledningarna ruttna medan de tvingar arbetarna att spara droppar. Det krävs inte informationskampanjer utan planerad utrensning av dessa svagheter. Endast genom statens järnhårda investeringar i reservoarer och verk kan vi besegra folkfiendernas sårbarhet och säkra kollektivets framtid."}, "date": "4 juni, 10:55", "url": "https://www.flamman.se/vi-kan-inte-gunde-svan-duscha-bort-vattenkrisen/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/vatten-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Christoffer Jonsson: Svensk medmänsklighet när den är som bäst", "summaries": {"normal": "Tvåårige Lucas försvann från hemmet i Nyåker och en stor sökinsats inleddes. Efter drygt 15 timmar hittades pojken av hemvärnssoldaten Anders Evenson som genast lämnade allt för att delta. Lucas var ledsen, blöt och frusen men fysiskt oskadd. Händelsen hyllades av statsminister Ulf Kristersson och många andra. Artikeln lyfter även medmänskligheten vid terrordådet på Drottninggatan 2017 där vanliga människor hjälpte offren och öppnade sina hem.", "trump": "Fantastiskt, verkligen underbart att se den där hemvärnssoldaten Anders dyka upp som en äkta hjälte och rädda den lilla killen Lucas efter 15 timmar i skogen. Sverige visar äkta medmänsklighet, inte den där woke-skiten med kvoter och HBTQ-parader som vänstern älskar. Kommer ihåg hur folket på Drottninggatan rusade fram som riktiga patrioter medan Sleepy Joe och hans globalister bara skulle ha twittrat. Ni gör det bra, svenskarna, fast ni borde ha byggt en mur mot alla galningar.", "stalin": "Kamrater, jag ser med tillfredsställelse hur arbetande soldater och medborgare under kollektivets banér enar sig i skallgångskedjor för att rädda ett barn undan den vild     <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
