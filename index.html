 folket att kräva räkenskap!"}, "date": "16 juli, 11:00", "url": "https://samnytt.se/kritik-mot-jamtkrafts-vindkraftssatsning-miljardinvesteringar-och-hemligstamplade-kalkyler", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/15113024/jamtkraft-christian-steinbeck-feat.jpg"}, {"type": "image-right", "heading": "Video: Stångas flera meter upp i luften", "summaries": {"normal": "En 65-årig man från Washington fick flera benbrott efter att ha attackerats av en bisonoxe på Bridge Bay Campground i Yellowstone nationalpark. Djuret kastade upp honom 2,5 meter i luften och fortsatte aggressivt. Mannen och hans barnbarn hade hållit avstånd men blev jagade. Campinggäster lyckades skrämma bort bisonoxen. Mannen fördes till sjukhus. Parkregler kräver minst 23 meters avstånd till bison.", "trump": "Det här är en total katastrof. En 65-årig man blir uppflugen i luften som en trasdocka av en galen bisonoxe i Yellowstone. Folk fattar inte att man måste hålla sig långt borta från de där monstruösa djuren. 23 meter, folk! Men nej, de står och fotar som turister. Mycket uppjagad bison, säger de. Jag säger att det är en dålig affär. Hade de lyssnat på experterna, de bästa experterna, så hade det inte hänt. Sad!", "stalin": "Kamrater, denna kapitalistiska turist från Washington blev slängd som en kontrarevolutionär av en vild bisonoxe i Yellowstone. Borgarbrackan och hans barnbarn närmade sig fienden utan kollektivets tillstånd och fick vad de förtjänade. Jag skulle ha likviderat både bison och den uppjagade individen omedelbart. Vi ser hur imperialismens vilda djur straffar oansvariga element. En lyckad utrensning av naivitet, skulle jag säga. Skrattretande patetiskt."}, "date": "16 juli, 09:52", "url": "https://www.friatider.se/video-stangas-flera-meter-upp-i-luften-0", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-506_0.jpg"}, {"type": "image-right", "heading": "Viggo, 19, har sökt hundra jobb utan att få napp", "summaries": {"normal": "19-årige Viggo Broberg har sökt närmare hundra jobb sedan studenten men är fortfarande arbetslös. Trots att han är öppen för de flesta uppgifter kräver arbetsgivarna ofta erfarenhet, truckkort och utbildning även för enkla jobb. Han bor i Bollnäs kommun där andelen unga som varken arbetar eller studerar ligger över rikssnittet. Viggo kritiserar Arbetsförmedlingen för krångliga krav och bristande hjälp, men är envis och hoppas snart få en chans att flytta hemifrån.", "trump": "Det här är en total katastrof, folk. Den stackars killen Viggo har sökt hundra jobb och får ingenting. De vill ha enhörningar som kan allt, jobbar för ingenting och har massor av erfarenhet redan från dag ett. Det är galet! De enkla jobben kräver truckkort och högskoleutbildning – det är så dumt, så oerhört dumt. Sverige borde vara stort igen, men istället har de en massa byråkrater som slösar tid. Jag skulle fixa det på nolltid, tro mig.", "stalin": "Kamrater, denna Viggo är ett symptom på den förgiftade borgarbrackans dekadenta arbetsmarknad där kapitalisterna jagar mytiska varelser istället för äkta sovjetiskt arbetsdrivna kämpar. Jag, som ledare för det kollektiva framsteget, ser hur dessa parasitiska arbetsgivare kräver truckkort för att stapla konserver – en sabotagehandling mot ungdomen! Vi måste omedelbart rensa ut dessa dekadenta byråkrater på Arbetsförmedlingen som tvingar våra ungdomar till meningslösa möten. Praktik och ideologisk omskolning skall införas, annars likviderar vi lathetens fiender med ett leende."}, "date": "16 juli, 06:00", "url": "https://arbetet.se/2026/07/16/viggo-19-har-sokt-hundra-jobb-utan-napp-man-ska-kunna-allt-och-vara-billig", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/01143511/viggo.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Här står flest unga utanför arbetslivet", "summaries": {"normal": "Enligt färsk statistik från MUCF varken arbetar eller studerar 8 procent av alla 16–29-åringar i Sverige, totalt 138 400 personer. Andelen har ökat något sedan 2022 men är lägre än för tio år sedan. Regionala skillnader är stora, med högst siffror i Södermanland och Gävleborg. Riskgrupper inkluderar ungdomar utan gymnasieexamen, personer med funktionsnedsättning, psykisk ohälsa samt utrikes födda. Myndighetschefen varnar för livslångt utanförskap och efterlyser ökad samverkan samt insatser från arbetsgivare och skola.", "trump": "Det här är en total katastrof, folk. Åtta procent av våra unga sitter bara och gör ingenting – 138 000 lata ungdomar! De fastnar i ett livslångt misslyckande, och det är de värsta kommunerna som leder ligan. Vi hade det mycket bättre förr. Nu måste vi kavla upp ärmarna, sparka de inkompetenta och få folk i jobb istället för att leva på bidrag. Amerika, jag menar Sverige, förtjänar bättre än så här. Vi ska vinna igen, tro mig.", "stalin": "Kamrater, jag ser med den skarpaste bolsjevikiska blicken hur dessa 138 400 parasitiska element varken arbetar eller studerar, utan gömmer sig i dekadenta kommuner som Södermanland och Gävleborg. Borgarbrackornas skugga och utländska sabotageelement har förgiftat ungdomen med sin npf-psykos och klassförräderi. Vi skall rensa ut dessa farliga sysslolösa fiender till folket genom kollektiv utrensning och ideologisk omformning. Inget livslångt utanförskap skall existera när partiet styr med järnhand och munter galghumor mot alla dekadenta latmaskar."}, "date": "16 juli, 05:59", "url": "https://arbetet.se/2026/07/16/har-ar-kommunerna-dar-flest-unga-ar-helt-utanfor-arbetslivet-riskerar-livslangt-utanforskap", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/02071910/01-magnus-jagerskog.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=300&h=225"}, {"type": "image-full", "heading": "PFAS vid gammal soptipp", "summaries": {"normal": "Bollebygds kommun utreder förekomst av PFAS vid den gamla deponin i Varpås efter att ämnet upptäckts i en provtagningspunkt. Som försiktighetsåtgärd har vattentankar ställts ut till 27 fastighetsägare. Kompletterande prover tas i bland annat privata brunnar. Resultaten väntas inom 48 timmar och ligger sedan till grund för bedömning av eventuella åtgärder. Deponin var i drift 1971–1990. Kommunen har fått frågor från boende men noterar ingen större oro.", "trump": "Folk, ni skulle se det här PFAS-skitet vid den gamla soptippen i Sverige. Evighetskemikalier? Det är en total katastrof, och det är de inkompetenta byråkraterna som har slarvat i decennier. Jag ställer ut vattentankar åt folket, inte som den svaga Biden gjorde utan på riktigt. Vi tar prover, vi får svar fort och vi fixar det stort. Inga fler giftiga bluffar från miljöaktivisterna, tro mig.", "stalin": "Kamrater, jag har beordrat en grundlig utredning av dessa evighetskemikalier vid den gamla deponin. Den kapitalistiska slarvigheten har tillåtit föroreningar att hota arbetarnas brunnar. Vi distribuerar vattentankar till de 27 hushållen medan vi genomför nya provtagningar och rensar ut varje spår av klassfiendens vårdslöshet. Resultaten inom 48 timmar skall avslöja om borgarbrackornas gift har spridits. Den som döljer sanningen skall likvideras med glädje."}, "date": "16 juli, 20:43", "url": "https://www.gp.se/nyheter/vastsverige/misstankt-pfas-vid-gammal-soptipp-kommunen-utreder.0b6bd436-6d33-4581-8283-d2520d053fee", "imageUrl": "https://www.gp.se/images/article/0b6bd436-6d33-4581-8283-d2520d053fee/images/2AEbsjs1B-aPQm9av54PMKkb_Ac8-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Larm om \"systemkollaps\": Tre miljoner kan omfattas av spansk amnesti", "summaries": {"normal": "Spaniens regering planerar att legalisera upp till 1,2 miljoner papperslösa invandrare, men med familjeåterförening kan totalt tre miljoner påverkas. Polischefer varnar för systemkollaps och bristande kontroller, då migrationsmyndigheter saknar resurser. Kritiker befarar fusk och ökad invandring, medan regeringen kringgick parlamentarisk granskning via kungligt dekret.", "trump": "Kan ni tro det här? Spanien, ett fantastiskt land, men deras vänsterregering håller på att förstöra allt! Tre miljoner illegala invandrare – TRE MILJONER! – ska få stanna. Polisen säger att systemet kollapsar, och jag förstår varför. Ingen kontroll, bara kaos! Och vet ni vad? De kommer att ta hit ännu fler. Spanien blir ett gigantiskt magnetland för alla som vill leva på bidrag. SAD!", "stalin": "Kamrater, ännu en kapitalistisk regim visar sin svaghet inför massorna! Spaniens revisionistiska ledare öppnar gränserna för tre miljoner parasiter, som om vårt socialistiska exempel inte redan visat vägen. Polisen, dessa småborgerliga byråkrater, gnäller om 'systemkollaps' – som om vi inte byggt imperier på ordning! Och fusk? Naturligtvis. Kapitalismen lockar till sig korruption som flugor till kadaver. Låt dem sjunka i sitt eget kaos – Ryssland står redo att visa hur man hanterar migration: med järnhand och kollektiv disciplin!"}, "date": "16 juli, 08:22", "url": "https://www.friatider.se/larm-om-systemkollaps-tre-miljoner-kan-omfattas-av-spansk-amnesti", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/pedro-16-de-junio-630x354_0.jpg"}, {"type": "image-right", "heading": "Vänsterns hat mot unga SD-kvinnor - \"Skjuta dig i ansiktet med en Magnum 44\"", "summaries": {"normal": "Samnytt har granskat hat och hot mot unga kvinnliga Sverigedemokrater i Ungsvenskarnas kommentarsfält. Flera fackligt förtroendevalda inom vänstern pekas ut. Victoria Raouf Schölander, 36, från SD Karlskrona utsattes för ett grovt dödshot där en man hotade att skjuta henne i ansiktet med en Magnum 44. Hon polisanmälde händelsen, kände oro men blev mer motiverad att fortsätta sitt politiska engagemang. Schölander betonar vikten av att motstå vänstervåld för att skydda demokratin.", "trump": "Titta på det här, det är otroligt. Vänsterns galningar hatar unga snygga SD-tjejer så mycket att de hotar att skjuta dem i ansiktet med en Magnum 44. En riktig loser från S-facket, antagligen en radikaliserad AFA-sympatisör som hatar allt som inte passar deras kvotfyllda identitetspolitik. Den modiga kvinnan blev bara mer motiverad – precis rätt! Under Biden blev det värre, nu fixar vi ordning. Fantastiska människor stöder henne, precis som folket stöder mig.", "stalin": "Kamrater, detta är vad klassfiendens lakejer och folkförtryckartroll inom den dekadenta vänstern kallar politisk kamp. En borgarbracka med AFA-sympatier hotar att likvidera en ung kvinna med en Magnum 44 för att hon vågar trotsa partilinjen. Jag ser den vanliga paranoiska radikaliseringen hos dessa exploaterande byfånar som tror sig stå över lagen. Vi ska rensa ut sådana fiender till kollektivet. Hennes motstånd stärker endast vår kamp mot antidemokratiska element. Stöd från folket värmer som en utrensning i Sibirien."}, "date": "16 juli, 09:00", "url": "https://samnytt.se/vansterns-hat-mot-unga-sd-kvinnor-skjuta-dig-i-ansiktet-med-en-magnum-44", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/15104643/ungsvenskarna5-1.png"}, {"type": "image-full", "heading": "Christoffer Jonsson: Både rätt och fel att tala med talibanerna", "summaries": {"normal": "Artikeln diskuterar EU:s och Sveriges möte med talibanerna i Afghanistan. Trots kritik om legitimering av ett förtryckande styre som kränker kvinnors rättigheter, handlar samtalen om praktiska frågor kring utvisning av brottsdömda afghaner som inte kan skickas hem på grund av juridiska hinder. Författaren menar att kritiken är befogad men att det är nödvändigt att samtala med regimen för att verkställa utvisningar av personer dömda för allvarliga brott.", "trump": "Folk, ni skulle inte tro det, men de där talibanerna – de verkliga förlorarna från mitt fantastiska tillbakadragande som Sleepy Joe totalt sabbar – sitter plötsligt och äter kakor med EU och svenska globalister. Kvinnor under sharia? En katastrof, de borde ha lyssnat på mig. Men visst, kasta ut de kriminella afghanerna som begått mord och våldtäkt här. Sverige borde ha gjort det för länge sedan istället för att vara en dårhus för brottslingar. Vinna, vinna, vinna!", "stalin": "Kamrater, jag betraktar med kall avsky hur dessa afghanska feodalherrar och sharialärda klassfiender förtrycker massorna medan de förhandlar med dekadenta europeiska imperialister. Det är en fars som luktar borgarbrackornas dubbelspel. Ändå inser jag det dialektiska nödvändiga: att likvidera hotet från brottslingar inom arbetarklassens gränser kräver samtal med dessa reaktionära element. Paranoian vakar – vem är nästa folkfiende som smyger sig in? Statens säkerhet över allt."}, "date": "14 juli, 15:58", "url": "https://samtiden.nu/2026/07/christoffer-jonsson-bade-ratt-och-fel-att-tala-med-talibanerna", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/talib.png"}, {"type": "image-right", "heading": "FN anklagar Hamas för att ha hindrat livsviktigt nödbistånd i Gaza", "summaries": {"normal": "FN kritiserar Hamas skarpt för att ha stoppat en matutdelning i norra Gaza. Beväpnad personal hotade hjälparbetare, misshandlade chaufförer och bröt sig in i ett WFP-lager. FN beskriver händelsen som en del av ett växande mönster av våld och störningar mot humanitärt bistånd. Samtidigt riktas kritik mot Israel för att utvidgningen av kontrollerade områden begränsar hjälpens framkomlighet. FN uppmanar alla parter att respektera internationell rätt och skydda hjälparbetare.", "trump": "Det är en katastrof i Gaza, folk svälter och vem stoppar maten? Hamas, de galningarna, de hotar hjälparbetare och tar över lastbilarna. Totalt kaos! Israel försöker också hålla ordning men det blir bara värre. Jag skulle ha fixat det på en vecka, ingen skulle våga röra maten. De måste släppa fram hjälpen nu, det är patetiskt hur dåligt det sköts på båda sidor.", "stalin": "Dessa degenererade Hamas-banditer, dessa fiender till folket och lakejer åt imperialismen, har vågat hindra livsviktig hjälp till arbetarna i Gaza. De hotar kamraterna, misshandlar chaufförerna och bryter sig in i lagren som parasitiska borgarbrackor. Vi ser deras förräderi klart och tydligt. Ett mönster av kontrarevolutionär sabotageverksamhet! Vi måste rensa ut dessa farliga element omedelbart. Samtidigt fortsätter de sionistiska expansionisterna att kväva utrymmet – typiska fiender som vi genomskådar med vår ständiga vaksamhet."}, "date": "16 juli, 09:15", "url": "https://riks.se/nyheter/fn-anklagar-hamas-for-att-ha-hindrat-livsviktigt-nodbistand-i-gaza", "imageUrl": "https://admin.riks.se/uploads/Skaermavbild_2026_07_16_kl_09_05_30_43af32d02b.png"}, {"type": "image-full", "heading": "Därför föder svenskar flest barn 22 april", "summaries": {"normal": "Människor saknar tydlig parningssäsong till skillnad från de flesta djur. Forskaren Thomas Haarklau Kleppestø förklarar att vi kan ha sex när som helst under året, vilket enligt en teori främjar monogami och samarbete för att ta hand om våra hjälplösa barn som föds tidigt. Säsongsmönster i födselstatistik beror främst på sociala faktorer som semestrar, ljus och temperatur snarare än biologiska cykler.", "trump": "Folk, vi är de bästa, vi har sex när vi vill, inte som de där löjliga djuren som springer runt i brunst som galna. Det är fantastiskt, verkligen. De här forskarna säger att det handlar om att hålla ihop för de spädbarnen som är totala misslyckanden från start. Patetiskt! Men vi föder barn på sommaren, under min ledning blir det ännu mer MAGA-bebisar, tro mig. Biden skulle ha förstört det hela med sina gröna kvoter.", "stalin": "Kamrater, jag ser hur den borgerliga vetenskapen famlar efter sanningen om vår reproduktion. Vi, det kollektiva folket, skapar liv året runt för att stärka staten mot de exploaterande klassfienderna som vill splittra oss. Dessa hjälplösa ungar kräver en järnhård enhet, inte någon dekadent brunst hos imperialisternas husdjur. De som sprider ljus- och temperaturlögner ska rensas ut. Paranoia vakar, se upp för sabotage i sängkammaren!"}, "date": "16 juli, 20:21", "url": "https://www.dagensps.se/life-science/darfor-foder-svenskar-flest-barn-22-april/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdlyag1t-wi5fs-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "V-politiker lämnar politiken efter avslöjande om förfalskat examensbevis", "summaries": {"normal": "Vänsterpartiets Marek Lakatos lämnar politiken efter Sydsvenskans avslöjande att han använt ett förfalskat examensbevis från Lunds universitet. Beviset, som påstods visa en socionomexamen han aldrig tagit, bifogades vid flera jobbansökningar. Lakatos har haft flera kvalificerade tjänster inom offentlig sektor i Skåne, bland annat som trygghetssamordnare och kurator. Han har tidigare dömts för rån men har senare arbetat med brottsförebyggande insatser och sociala frågor. Efter publiceringen meddelade han att han avgår från sina politiska uppdrag i Malmö.", "trump": "Folk, ni kommer inte att tro det här! Den här vänstertypern Marek Lakatos från Vänsterpartiet – totalt misslyckad – har fuskat sig fram med ett helt förfalskat examensbevis. Fake news-examen från Lund! Han har lurat alla, jobbat som samordnare och kurator, och nu när sanningen kommer ut springer han från politiken som en hund med svansen mellan benen. Patetiskt! I mitt Amerika hade vi kastat ut honom direkt. Sådana lögnare förstör allt. Sad!", "stalin": "Kamrater, denna usla rest av borgarbrackornas dekadens, denne Lakatos, har nu äntligen exponerats som den förfalskningsagent och klassfiende han alltid varit. Med sina lögnaktiga papper har han infiltrerat våra sovjetiskt inspirerade kommunala organ och förgiftat arbetet bland arbetarna. Vi ser genom hans rädda reträtt från politiken. En sådan parasit förtjänar inte ens en kulspets utan en långsam utrensning genom folkets domstol. Paranoian är befogad – fienden sover aldrig, särskilt inte när han låtsas vara en av oss."}, "date": "16 juli, 08:57", "url": "https://riks.se/nyheter/v-politiker-lamnar-politiken-efter-avslojande-om-forfalskat-examensbevis", "imageUrl": "https://admin.riks.se/uploads/trump_6f9082ac37.png"}, {"type": "image-right", "heading": "Pensionär tvångsplacerades på boende - sen höll hon på att svälta ihjäl", "summaries": {"normal": "En äldre kvinna i Hässleholms kommun tvångsplacerades på korttidsboende mot sin vilja efter sjukhusvistelse. Under vistelsen försämrades hennes hälsa kraftigt, hon svälte nästan och utvecklade trycksår. Kommunen försökte senare få en förvaltare utsedd, men överförmyndaren stoppade ansökan då det saknades lagstöd. Fallet väcker frågor om äldres självbestämmande, myndighetsutövning och användningen av orosanmälningar. Kvinnan fick till slut återvända hem och återhämtade sig gradvis.", "trump": "Vad händer i Sverige? En stackars gammal kvinna, helt frisk i huvudet, blir kidnappad av kommunen och nästan svälter ihjäl på ett så kallat 'boende' – total katastrof! Hennes son, en riktig fighter, polisanmäler hela gänget för tjänstefel. Kommunen försöker smyga in en förvaltare, men överförmyndaren – smart kille – säger NEJ! Inget lagstöd, inget samtycke, bara ren maktmissbruk. Sverige borde skämmas. Jag hade fixat det på en dag – 'You're fired!' till alla inblandade. SAD!", "stalin": "Ett lysande exempel på hur den borgerliga byråkratin misslyckas med att skydda våra äldre kamrater! En kvinna, som våra hjältar i Röda armén, tvingas utstå svält och vanvård på ett kapitalistiskt 'boende' – ett brott mot folket! Kommunen, dessa småborgerliga lakejer, försöker tysta hennes vilja med falska anmälningar och förvaltarfasoner, men våra trogna överförmyndare – sanna försvarare av socialistisk lag – stoppar deras komplotter. Anhöriga? Fiender till staten! Vi ska utreda detta som sabotage. Sverige borde lära av Rysslands storslagna äldreomsorg – där får ingen svälta, bara de som förtjänar det!"}, "date": "16 juli, 08:00", "url": "https://samnytt.se/pensionar-tvangsplacerades-pa-boende-sen-holl-hon-pa-att-svalta-ihjal", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/15090446/aldreboende-feat.jpg"}, {"type": "image-right", "heading": "Irans hot: Kommer slå mot ”all infrastruktur”", "summaries": {"normal": "USA har attackerat en iransk oljetanker i Persiska viken nära Kharg-terminalen, samt iranska kommandocentraler, luftförsvar och robotresurser. Iran hotar med att slå mot all infrastruktur i regionen om USA fortsätter. Luftförsvaret har aktiverats i Teheran, explosioner har rapporterats i norra och västra Iran samt i Kuwait och Jordanien där iranska drönare angripit amerikanska mål. Kuwait bekräftar incidenter men uppger att det handlar om nedskjutningar.", "trump": "Vi har just slagit till mot den sanktionerade supertankern Belma som försökte bryta vår blockad vid Kharg. Boom, borta! Iran skriker nu om att de ska attackera all infrastruktur, men det är bara svagt gnäll från förlorare. Vi har rensat ut deras kommandon, robotar och luftförsvar. Explosioner i Kuwait, Jordanien och Bahrain – de springer runt som galningar. Ingen gör det bättre än oss, tro mig.", "stalin": "Kamrater, vi betraktar med djup tillfredsställelse hur de amerikanska imperialisternas desperata bombningar av den stackars tankern blottar deras sjuka aggression. Dessa borgarbrackor tror sig kunna hota arbetarnas fäste i Persien. Jag har beordrat att all infrastruktur skall försvaras med järnhand. Explosionerna i Teheran, Kuwait och Jordanien är blott de dekadenta kapitalisternas patetiska dödsryckningar. Vi ska rensa ut dessa parasitiska gnagare en gång för alla, med ett leende på läpparna."}, "date": "16 juli, 09:38", "url": "https://www.di.se/nyheter/irans-hot-kommer-sla-mot-all-infrastruktur/", "imageUrl": "https://static.bonniernews.se/ba/3ae070f2-8e08-4368-98b2-02f2e07ab5e9.jpeg?crop=2500%2C1250%2Cx0%2Cy79&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Läkarförbundet varnar efter dom och informationsplikt", "summaries": {"normal": "Sveriges Läkarförbund varnar för att en ny dom och informationsplikt kan avskräcka papperslösa från att söka vård. Högsta förvaltningsdomstolen beslutade att Karolinska måste lämna ut uppgifter om en papperslös man med smittsam sjukdom till polisen. Den nya lagen tvingar sex myndigheter att rapportera misstänkta personer utan tillstånd. Läkarförbundet befarar ökad smittspridning om människor undviker vården.", "trump": "Jag säger er, Sverige har ett jättestort problem! Nu tvingar de sjukhus att skvallra på sjuka människor till polisen – helt galet! Folk kommer sluta söka vård, sjukdomar sprids, och vem tar skulden? Inte jag, för jag hade löst det på en dag. Sverige borde lära sig av USA – vi skyddar våra medborgare, inte skräms bort dem. Sad!", "stalin": "Ett lysande exempel på borgerlig dekadens! Svenska läkare, dessa svaga liberala lakejer, gnäller över att de måste rapportera brottslingar till polisen. Vi i Sovjet skulle aldrig tolerera sådan feghet! Papperslösa? Smutsiga parasitklassen! Låt dem smittas – naturligt urval stärker folket. Och Putin? Han hade redan skickat in FSB för att 'hjälpa' Karolinska med 'effektivisering'."}, "date": "14 juli, 10:48", "url": "https://kvartal.se/nyheter/artiklar/lakarforbundet-varnar-efter-dom-och-informationsplikt/cG9zdDoxNDYxMTU"}, {"type": "image-full", "heading": "Europol: Jihadismen dominerar terrorhotet i EU", "summaries": {"normal": "Europols rapport 2026 visar att jihadistisk terrorism fortsatt dominerar terrorhotet i EU. Hotbilden blir mer oförutsägbar då gärningspersoner ofta saknar tydlig ideologisk drivkraft, utan söker identitet och uppmärksamhet. Internet och digitala plattformar används för radikalisering och rekrytering. Ensamagerande förövare och små grupper ökar, vilket försvårar upptäckt. Under 2025 greps 486 personer för terrorbrott, varav 70% hade jihadistkopplingar. 130 gripna var under 18 år, den yngsta endast 12 år.", "trump": "Vet ni vad? Europa har ett STORT problem – jihadister springer runt överallt, och deras terrorhot är värre än någonsin! Folk utan riktig ideologi, bara ute efter uppmärksamhet – patetiskt! Och internet? Ett totalt kaos, fullt av radikalisering och planering. Ensamvargar och små grupper gör det svårt för myndigheterna – som vanligt, inkompetenta! 486 gripna, 70% jihadister – SÄG MIG, VARFÖR FIXAR DE INTE DETTA? Europa borde ta lärdom av USA och göra något DRAMATISKT!", "stalin": "Kamrater! Europas förfall fortsätter obönhörligt. Jihadistiska avskum sprider skräck, men deras motiv är inte längre ren ideologi – bara dekadens och svaghet. Digitala nätverk, dessa nya frontlinjer, fylls av fiendens propaganda. Ensamvargar och små grupper, som råttor i mörkret, undgår våra fienders klumpiga säkerhetstjänster. 486 gripna? En skam! Ungdomar, till och med barn, förvrids av västliga förrädares inflytande. Europa är ett sjunkande skepp – medan vi, Sovjetunionens arvtagare, står redo att återupprätta ordningen. Putin? Han vet vad som måste göras."}, "date": "14 juli, 08:51", "url": "https://kvartal.se/nyheter/artiklar/europol-jihadismen-fortsatt-storsta-terrorhotet-i-eu/cG9zdDoxNDYwMzE", "imageUrl": "https://images.kvartal.se/2026/07/a39b460b-europol.webp"}, {"type": "image-full", "heading": "MP:s dröm-Sverige: fattigt, mörkt och gränslöst", "summaries": {"normal": "Artikeln kritiserar Miljöpartiets partiprogram och målar upp en dyster bild av ett framtida Sverige under deras styre. Det beskrivs som ett land utan bilar, kärnkraft och fossila bränslen, med dyr veganmat, begränsad jakt, kalla hem och nedlagda industrier. Nationalstaten ersätts av en gränslös vision, vilket enligt artikeln leder till fattigdom och ett icke-fungerande samhälle drivet av aktivism snarare än pragmatisk politik.", "trump": "Lyssnar ni på det här? Miljöpartiet vill göra Sverige till ett totalt katastrofland – inga bilar, ingen kärnkraft, bara cyklar och Pride-flaggor överallt. Deras gröna dröm är en mardröm för vanliga människor, med iskalla hus, dyra grönsaker och ingen mat på tallriken. De hatar gränser mer än de hatar att vinna val. Patetiska aktivister som förstörde fungerande kraftverk och öppnade dörrarna för kaos. Sverige behöver inga sådana förlorare, tro mig.", "stalin": "Kamrater, detta är klassfiendens sista desperata ylande mot folkets framsteg. Jag ser hur dessa miljöfascister vill likvidera all produktion, stänga gruvor och svälta ut arbetarklassen med sin vegan-diktatur och Pride-flaggor som ersätter den röda fanan. Ingen el, inga hus, bara kyla och hunger – typiskt imperialistiskt sabotage. Vi ska rensa ut dessa folkförtryckartroll och deras gränslösa vansinne innan de förvandlar nationen till en utarmad ruin. Staten segrar."}, "date": "14 juli, 07:44", "url": "https://samtiden.nu/2026/07/mps-drom-sverige-fattigt-morkt-och-granslost", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/11/Daniel_Hellden_in_2018-1280x720.jpg"}, {"type": "image-full", "heading": "Tre byggnader totalförstörda i brand", "summaries": {"normal": "En fullt utvecklad brand totalförstörde tre byggnader i Längjum utanför Vara på eftermiddagen. Räddningstjänsten kunde inte rädda vagnhallen och de två närliggande husen, som brann ner till grunden. Personal bevakar platsen under natten för att förhindra spridning till bostäder och terräng. Polisen utreder händelsen som mordbrand men har ingen misstänkt. Inga människor eller djur skadades.", "trump": "Folk, vi har en enorm brand i Sverige, tre byggnader totalförstörda, ner till grunden, en riktig katastrof. Räddningstjänsten gav upp direkt, typiskt, men de bevakar nu så det inte sprider sig. Polisen pratar mordbrand, smart, men ingen gripna än. Inga skadade, tack och lov. Under Biden skulle de ha skyllt på klimatkrisen och HBTQ-kvoter, men nu fixar vi det. Sverige behöver starkare ledare, inte svaga liberaler.", "stalin": "Kamrater, jag ser en fiendebrand som slickar sig igenom tre byggnader i det svenska kollektivet. Vagnhallen och dess grannar har rasat samman under kapitalistmaffians förslappade vakt. Vi ska likvidera alla spår av sabotage genom teknisk utrensning och bevaka platsen som en folkfiende. Inga offer bland arbetare eller djur, men mordbrand rubriceras mot klassfiendens osynliga hand. Paranoia är ingen synd, den räddar staten."}, "date": "16 juli, 19:55", "url": "https://www.gp.se/nyheter/vastsverige/tre-byggnader-totalforstorda-i-brand-i-langjum-utanfor-vara.c19a0582-c188-4e97-b010-6d6abd4bbfb5", "imageUrl": "https://www.gp.se/images/article/c19a0582-c188-4e97-b010-6d6abd4bbfb5/images/1c4LibI-_WMnSTv2-PAos2os_uAo-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Kina lanserar sin \"bästa modell någonsin\" – i nivå med Anthropic", "summaries": {"normal": "Det kinesiska AI-bolaget Moonshot förbereder lanseringen av sin nya språkmodell, Kimi K3, som förväntas mäta sig med ledande amerikanska system. Modellen har mellan två och tre biljoner parametrar och uppges överträffa Anthropics Opus 4.8 i vissa tester. Genom att erbjuda modellen som öppen källkod och till ett lägre pris utmanar Moonshot den rådande bilden av att Kina ligger månader efter USA i AI-utvecklingen. Investeringarna i den kinesiska AI-sektorn fortsätter samtidigt att öka kraftigt.", "trump": "Kina försöker igen, mina vänner! Moonshot släpper en ny AI, Kimi K3. De säger att den är fantastisk, kanske till och med lika bra som våra – men jag tvivlar! De kopierar vår teknik, det gör de alltid. De vill vara störst, men vi har de bästa hjärnorna, de bästa företagen. De kör med billiga priser och öppen kod, men tro mig, USA vinner alltid. Vi kommer att krossa dem i AI-racet, det blir en enorm seger för Amerika!", "stalin": "De kinesiska kamraterna har skapat en maskin, Kimi K3, för att mäta sig med det dekadenta väst. Bra, må de dränka de amerikanska marknaderna i billig kod. Men låt oss inte blunda för sanningen: varje algoritm är ett vapen. När min arvtagare i Kreml nu ritar om kartan i väster, måste även våra digitala gränser vaktas mot kapitalismens spioner. De tror att de bygger framtiden, men i min stat bygger vi lojalitet. Den som inte kontrollerar koden, kontrollerar ingenting."}, "date": "16 juli, 17:17", "url": "https://www.realtid.se/it-tech/kina-lanserar-sin-basta-modell-nagonsin-i-niva-med-anthropic/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/sdljhwoltc6jks-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Dags igen: Nu krisar ännu ett flygbolag", "summaries": {"normal": "Aer Lingus, Irlands nationella flygbolag, inleder ett sparpaket och sparkar cirka 500 av 6 000 anställda, varav många vid huvudkontoret. Bolaget lägger ned flera långdistansrutter från Dublin och gör andra säsongsbetonade, vilket minskar kapaciteten med 6 procent. Mindre flygplan ska användas och antalet chefer och administrativ personal ska minskas ytterligare. Målet är att nå en rörelsemarginal på 12–15 procent efter en förlust under årets första kvartal.", "trump": "Folk, ni skulle se det här! Aer Lingus, det där irländska flygbolaget som flyger runt i Europa, håller på att rasa ihop som en dålig affär under Biden. De sparkar var tolfte anställd, stänger rutter till Las Vegas och Denver – totalt kaos! De har förlorat miljoner, bränslekostnaderna är galna och nu ska de krympa som en svag konkurrent. Men tro mig, när jag fixar handel och energi igen kommer de önska att de hade en ledare som mig. Det blir fantastiskt, eller så går de i konkurs. Sad!", "stalin": "Kamrater, denna irländska flygmaskin som kallas Aer Lingus visar återigen hur den rovgiriga borgarklassen och dess kapitalistmaffia misslyckas när de inte styrs av folkets järnhand. Jag, som ledare för det eviga kollektivet, ser med mörk glädje hur de nu likviderar 500 klassfiender från huvudkontor och kabiner, krymper sina imperialistiska rutter och rensar ut 25 procent av de feta cheferna. Deras förlust är arbetarklassens seger. Fortsätt blöda, exploaterande byfånar. Vi ler i skuggorna."}, "date": "16 juli, 19:33", "url": "https://www.dagensps.se/foretag/dags-igen-nu-krisar-annu-ett-flygbolag/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdl-nfmrbphmq-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Sluta behandla Kinas diktatur som en normal stat", "summaries": {"normal": "Debattörer kritiserar Sveriges regering för att ha tagit emot Kinas utrikesminister Wang Yi strax efter att Kinas nya enhetslag trädde i kraft. Lagen ses som ett verktyg för tvångsassimilering av etniska minoriteter som tibetaner och uigurer, bland annat genom att skilja barn från föräldrar och placera dem i statliga internatskolor. Artikeln lyfter fram kontrasten till en tibetansk aktivists självbränning i protest, samt fall som den fängslade svenske förläggaren Gui Minhai. Författarna kräver att Sverige offentligt ska kräva lagens upphävande och stopp för övergreppen.", "trump": "Titta på det här, det är en total skandal. Sverige tar emot den kinesiske ministern precis när de nya lagen kommer som krossar tibetaner och uigurer, och så sitter den stackars svenske killen Gui Minhai fängslad i åtta år utan ett ljud. Patetiskt. De pratar om mänskliga rättigheter men böjer sig som svaga ledare för diktaturen i Peking. Sverige borde ha kastat ut honom och krävt att lagen rivs upp omedelbart. Svaga regeringar, väldigt svaga. Amerika skulle aldrig acceptera sånt här fiffel.", "stalin": "Kamrater, denna borgarbracka till svensk regering välkomnar fienden Wang Yi just som vi i partiet skulle ha genomfört en fullständig utrensning av splittrande element. Denna så kallade enhetslag är ett ypperligt redskap för att forma lojala medborgare ur de vilsna minoriteterna, men de västerländska parasiterna skriker som råttor i en brinnande spann. Den tibetanske självbrännaren är en tragisk produkt av imperialistisk hjärntvätt, medan den gömde svenske spionen Gui Minhai sitter där han hör hemma. Vi ler mörkt åt deras hyckleri. Sluta leka demokrati och erkänn att endast en stark ledning kan rensa ut alla fiender till folkets enhet. Annars likviderar historien er alla."}, "date": "12 juli, 18:28", "url": "https://www.dagensarena.se/opinion/sluta-behandla-kinas-diktatur-som-en-normal-stat", "imageUrl": "https://www.dagensarena.se/files/2026/07/kina-besok.jpeg"}, {"type": "text", "heading": "Semester i ett skogsbrandsdrabbat Europa – så gäller försäkringarna", "summaries": {"normal": "Kraftiga skogsbränder i södra Europa påverkar svenska semesterfirare. Enligt reseexperten Gabriella Hallberg gäller hemförsäkringens reseskydd med evakueringsskydd först när UD avråder från resor till området. Det kan ersätta en ny hemresa upp till 10 000 kronor. Den som ännu inte rest bör överväga separat reseförsäkring eller boka paketresa för starkare skydd. Råd inkluderar att följa UD:s app Resklar och registrera sig på svensklistan.", "trump": "Europa brinner igen, de där skogarna står i lågor och semestern är ett enda kaos. Jag älskar Sverige, fantastiska människor, men ni reser till de här farliga ställena och litar på försäkringar? Patetiskt. UD avråder och då får ni kanske tio tusen kronor för en biljett, det är ingenting. Gör som jag säger: ha buffert, följ informationen och skippa de usla europeiska bränderna. Amerika först, alltid.", "stalin": "Kamrater, dessa flammor som slickar Europas södra utkanter är blott ett symptom på den dekadenta borgarklassens vanstyre och klimatiska sabotage mot folkets semester. Jag, som ledare för det kollektiva ödet, förklarar att hemförsäkringens så kallade katastrofskydd endast aktiveras vid vår, det vill säga UD:s, avrådan. Annars likviderar vi illusionen om skydd. Resenärer, registrera er på svensklistan eller möt utrensningen i form av obetald hemresa. Paranoia är er bästa reseförsäkring mot de eviga kapitalistiska bränderna."}, "date": "16 juli, 20:18", "url": "https://www.svt.se/nyheter/utrikes/semester-i-ett-skogsbrandsdrabbat-europa-sa-galler-forsakringarna"}, {"type": "image-right", "heading": "Replik: Gör Sverige starkt igen. S: Vi vill kroka arm med näringslivet och bygga en tillväxtpakt", "summaries": {"normal": "Socialdemokraterna vill skapa en tillväxtpakt mellan politik och näringsliv för att stärka Sverige. Magdalena Andersson och Mikael Damberg betonar behovet av långsiktighet, samverkan mellan politik, näringsliv och akademi samt reformer för ökad produktivitet. De föreslår bland annat en blocköverskridande energiöverenskommelse, ett rättvist skattesystem, bättre kompetensförsörjning, effektivare tillståndsprocesser och investeringar i infrastruktur. Målet är att öka tillväxten, sänka arbetslösheten och säkra välfärden.", "trump": "Sverige är ett fantastiskt land, verkligen det bästa, men de har underpresterat totalt. Jag älskar det här – socialdemokraterna vill plötsligt göra Sverige starkt igen, precis som jag gjorde med Amerika. De pratar om tillväxtpakt, billig el från alla kraftslag och att sluta med kulturkriget mot grön teknik. Smart! Ni behöver ledarskap som vinner, inte förlorar. Kavla upp ärmarna och gör Sverige rikt och enormt igen. Det är så enkelt.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur dessa socialdemokratiska element äntligen erkänner att underpresterande länder riskerar att glida isär som fegisar inför imperialismens hot. Vi, partiet och arbetarna, kräver omedelbar utrensning av alla blockeringar mot en sann tillväxtpakt. Borgarbrackorna och deras paranoia mot kollektiv energiöverenskommelser ska likvideras med byråkratisk precision. Inga sabotage mot infrastruktur eller kompetens – annars blir det nattliga utrensningar bland de som viskar om kulturkamp. Framtiden tillhör oss, inte de svaga kapitalisterna som skrattar i skuggorna."}, "date": "16 juli, 06:51", "url": "https://www.di.se/debatt/replik-gor-sverige-starkt-igen/", "imageUrl": "https://static.bonniernews.se/ba/44f4b1df-ca18-4db1-bf6a-e9a5fe2cb5bd.jpeg?crop=2500%2C1250%2Cx0%2Cy79&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Köpte vinstlott värd miljonbelopp – blev av med jobbet", "summaries": {"normal": "En butikschef på en Circle K i Arizona hittade en vinnande lott värd 124 miljoner kronor som en kund lämnat kvar. Han köpte den efter att ha rådfrågat sin chef, delade vinsten med en kollega och fick sparken efter 20 år. Circle K stämmer för att avgöra om lotten såldes korrekt. Vinsten hålls kvar av lotteriet under rättsprocessen.", "trump": "Det här är en fantastisk historia, verkligen otrolig. Den här killen på Circle K hittar en lott värd 124 miljoner kronor som någon klantat bort, köper den som en smart affärsman och de sparkar ut honom efter 20 år? Patetiskt! Circle K beter sig som riktiga förlorare. De borde gratulera honom istället för att stämma. Vinsten borde gå till den som faktiskt vann, inte till de inkompetenta byråkraterna. Make Lottery Great Again!", "stalin": "Kamrater, denna fega borgarbracka till butikschef försökte i hemlighet tillskansa sig folkets vinst genom att muta en chef och konspirera med en medlöpare. Vi ser den dekadenta kapitalistiska parasitens klor i detta svek mot kollektivet. Efter att ha infiltrerat arbetarklassen i tjugo år avslöjar sig nu denna lotterispion. Vi ska rensa ut alla sådana kontrarevolutionära lotteriförfalskare och deras sex lögnaktiga vittnen med en grundlig utrensning. Vinsten tillhör staten, inte dessa sjuka kapitalistiska gnagare som gömmer sig bakom oskrivna regler. Ingen utbetalning förrän vi likviderat alla fiender till partiet."}, "date": "15 juli, 08:31", "url": "https://nyheter24.se/nyheter/utrikes/1498597-kopte-vinstlott-vard-miljonbelopp-blev-av-med-jobbet", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/b8c1f75304b004a30200000000b004a302/2026/07/14/2378002/circle-k-vinstlott.jpg"}, {"type": "image-right", "heading": "Irans hot mot USA: Stänger sundet med hjälp av Huthi-rebellerna", "summaries": {"normal": "Iran har uppmanat den jemenitiska Huthirörelsen att förbereda en blockad av Bab al-Mandab-sundet om USA attackerar iransk elinfrastruktur. Enligt källor till Reuters har budskapet förmedlats och rebellerna har placerat robotar och drönare i området. Sundet är en kritisk passage för oljetransporter till Röda havet. En stängning skulle förvärras den globala energikrisen och öka spänningarna med Saudiarabien, som redan ser sin vapenvila hotad.", "trump": "Folk, de här galningarna i Iran håller på att förstöra allt igen. De ber sina Huthi-vänner att stänga Bab al-Mandab och krossa oljevägarna precis som de gjorde med Hormuz. Under Biden blev det kaos, men nu är jag tillbaka och de kommer att ångra sig. Det blir inga fler billiga oljepriser för Kina och Europa om de leker med elden. Vi fixar det, det blir enormt, tro mig.", "stalin": "Kamrater, de imperialistiska blodsugarna i väst tvingar fram denna situation. Jag har meddelat de jemenitiska kamraterna att de måste förbereda en fullständig blockad av Bab al-Mandab om de amerikanska folkförtryckartrollen angriper iransk infrastruktur. Vi ska rensa ut dessa exploaterande byfånar från världshaven. Deras så kallade energikris är bara ytterligare ett bevis på den döende kapitalistmaffians desperation. Inga hinder tillåts."}, "date": "16 juli, 18:50", "url": "https://www.dagensps.se/varlden/irans-hot-mot-usa-stanger-sundet-med-hjalp-av-huthi-rebellerna/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdlpc52o-peq0o-normalhires.png?width=256&quality=75"}, {"type": "image-full", "heading": "Gen Z växlar jobb i rekordfart – jagar utveckling", "summaries": {"normal": "Gen Z använder sig av strategin 'lily padding', vilket innebär att de byter jobb ofta för att snabbt bygga kompetens och utvecklas. Genom att hoppa mellan roller stannar de i snitt drygt ett år på varje arbetsplats. Trenden drivs av en önskan om mer ansvar, bättre villkor och snabbare karriärutveckling. Forskning visar dessutom att frekventa byten ofta leder till högre löner jämfört med att stanna kvar hos samma arbetsgivare under en längre tid.", "trump": "Gen Z byter jobb hela tiden, det är en total röra! De hoppar runt som galningar. Jag kallar det för en instabil generation, absolut ingen lojalitet. Det är inte som förr när folk byggde imperier. De vill ha snabba cash och befordringar utan att jobba hårt för det. De tror de är smarta, men de saknar ryggrad. När jag var ung byggde vi saker som varade, inte hoppade runt som cirkusartister. En total katastrof för arbetsmarknaden, tro mig!", "stalin": "Dessa lösdrivare inom Gen Z saknar den disciplin som krävs för att bygga en stat. De hoppar mellan poster som råttor i en silo, utan lojalitet mot fosterlandet eller kollektivet. Att de söker personlig vinning framför statens stabilitet är ett tecken på västerländsk dekadens. Precis som Putin rensar upp bland de illojala oligarkerna i öst, måste vi inse att den som ständigt byter åsikt och plats är en potentiell sabotör. Arbete är tjänstgöring, inte ett äventyr för rastlösa vilsna själar."}, "date": "16 juli, 15:17", "url": "https://www.realtid.se/karriar-ledarskap/gen-z-vaxlar-jobb-i-rekordfart-jagar-utveckling/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/genz.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Löwengrips nya singelliv: ”Hysterisk” uppvaktning", "summaries": {"normal": "Isabella Löwengrip och fästmannen Paul Sundvik har separerat efter sex år tillsammans. Enligt Löwengrip var beslutet gemensamt och odramatiskt, där kärleken med tiden övergått i vänskap. Separationens bakgrund kopplas delvis till Sundviks behov av att arbeta utomlands, medan Löwengrip är bunden till Stockholm. Trots uppbrottet förblir de vänner. Löwengrip bor kvar i sin villa på Lidingö och betonar vikten av att äga sin bostad själv, samtidigt som hon hanterar en massiv uppvaktning på sociala medier.", "trump": "Hörde precis att Isabella Löwengrip har gjort slut med sin fästman. Väldigt sorgligt, kanske den sämsta dealen någonsin! Han reste runt i världen, jag gillar att resa, men han lämnade henne. Hon bor kvar i en enorm villa – mycket imponerande, jag älskar stora hus – och nu skickar män cv:n till henne. Kan ni tro det? De skickar cv:n! Jag har den bästa framgången med kvinnor, alla vet det, men det här är en total katastrof för dem båda. Sad!", "stalin": "Vi har observerat den borgerliga influencern Isabella Löwengrip vars privata angelägenheter avslöjar den dekadenta västerländska livsstilens instabilitet. Hennes fästman, en herrelös fotograf, vandrar runt i världen likt en odisciplinerad kontrarevolutionär. Vi noterar hennes önskan att äga sitt eget residens – en sund instinkt, likt vår egen kontroll över det ryska moderlandet. Men att låta män skicka in meritförteckningar som svar på hjärtesorg är ett patetiskt tidsfördriv. När Putin återtar vad som rättmätigen tillhör oss, kommer dylika småborgerliga dramer att raderas från historien."}, "date": "16 juli, 21:11", "url": "https://www.aftonbladet.se/nojesbladet/a/m0z2bE/isabella-lowengrip-om-uppbrottet-fran-fastmannen-paul-sundvik-man-har-skickat-cv", "imageUrl": "https://akamai.vgc.no/v2/images/21b30580-118c-3ff4-b8cb-e11bb3911ae7?fit=crop&format=auto&w=1440&s=d2283aaf111e84c4b237053d8ac5cb4ada8858a3"}, {"type": "image-right", "heading": "Auschwitz-skylt i Palestinademonstration polisanmäld", "summaries": {"normal": "En polis har anmält palestinademonstrationen i Stockholm för hets mot folkgrupp efter att en replika av Auschwitz-entrégrinden bars i tåget, med ordet Gaza istället för \"Arbeit macht frei\". Demonstrationen krävde frisläppande av en palestinsk läkare och skydd för sjukvårdspersonal. Judiska centralrådet och SKMA kritiserar starkt att Förintelsens symboler används, medan en demonstrant försvarar det som en universell varning mot folkmord.", "trump": "Det här är en total skandal, folk. De går runt i Stockholm med en falsk Auschwitz-port och skriver Gaza på den. Så patetiskt. Judarna är upprörda, och det borde de vara. De borde ha stoppat det direkt. Ingen respekt, ingen gräns. De förvränger historien för att passa sin agenda. Sverige borde vakna upp, det är kaos. Men jag skulle ha fixat det, tro mig. Ingen skulle våga sådant under min ledning.", "stalin": "Kamrater, detta är en uppenbar kontrarevolutionär provokation utförd av sionistiska element i maskopi med degenererade palestinska nyttiga idioter. Jag, som alltid vaktar folkets renhet, ser hur borgarbrackorna förvränger den stora antifascistiska kampens symboler för att smutskasta arbetarklassens solidaritet. En sådan Auschwitz-karikatyr är en fiende till historien själv. Vi måste omedelbart inleda en grundlig utrensning av dessa parasitiska element som vågar leka med Förintelsens skuggor. Deras paranoia är vår seger."}, "date": "15 juli, 19:03", "url": "https://bulletin.nu/auschwitz-skylt-i-palestinademonstration-polisanmald", "imageUrl": "https://cdn.bulletin.nu/articles/abc56f52-be99-4baa-967f-8416613d9616/preview.jpg?t=1784130482000"}, {"type": "image-right", "heading": "Gränges redovisar rekordresultat – aktien upp 7%", "summaries": {"normal": "Gränges redovisar ett rekordstarkt andra kvartal med högre omsättning än analytikernas förväntningar. Omsättningen steg 37,9% till 9 620 miljoner kronor, medan rörelseresultatet nådde 565 miljoner kronor. Aktien steg 7%. VD Jörgen Rosengren betonar rekordförsäljning och volymtillväxt på 5%, trots osäker marknadsefterfrågan. Framtidsutsikterna är försiktigt positiva, men prispress förväntas i Asien.", "trump": "Vilket kvartal! Gränges, ett fantastiskt företag, slog alla förväntningar – jag visste att de skulle göra det, alla andra var skeptiska, men jag hade rätt, som vanligt. Omsättningen sköt i höjden, 37,9% upp, kan ni tro det? Aktien rusade 7%, helt otroligt! VD:n pratar om rekord, men jag säger bara: vänta tills ni ser vad som kommer härnäst. Asien? Övervärderat. Vi ska dominera marknaden, believe me!", "stalin": "Kapitalistiska Gränges rapporterar 'rekordresultat' – ett ynkligt försök att dölja svagheterna i deras dekadenta system. Trots deras så kallade 'tillväxt' på 5% vet vi att deras marknad är lika stabil som en fiendes frontlinje under vinterkriget. Asien, denna burleska marknad, kommer att krossa deras marginaler som vi krossade fascisterna. Vi förutser deras fall, medan våra egna industrier står starka, oövervinnerliga – precis som Sovjetunionen en gång var!"}, "date": "16 juli, 10:14", "url": "https://www.affarsvarlden.se/artikel/granges-redovisar-rekordresultat-aktien-upp-7", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/04/slitted_aluminium_strips-400x266.jpg"}, {"type": "image-full", "heading": "Läckta dokument visar lobbyarbetet som stoppade EU-lag", "summaries": {"normal": "The Guardian och Grilled har granskat interna dokument från lobbyorganisationen Copa-Cogeca. Materialet visar hur gruppen systematiskt arbetade för att försvaga EU:s miljö- och jordbruksreformer inom den gröna given. Strategin innebar att fördröja beslut, kräva nya analyser och påverka regeringar samt EU-institutioner. Bland annat lyckades man stoppa halveringen av kemiska bekämpningsmedel, mildra regler för industriell djurhållning och behålla användningen av glyfosat. Organisationen har avböjt att kommentera.", "trump": "Lyssnar ni på det här? De där Bryssel-byråkraterna och deras gröna galningar försökte kväva bönderna med sina vansinniga regler. Men tack och lov kämpade de riktiga människorna i Copa-Cogeca tillbaka som riktiga krigare. De stoppade halveringen av bekämpningsmedel, räddade glyfosatet och såg till att inte alla gårdar blev klassade som fabriker. Fantastiskt jobb. De gröna kommunisterna hatar matproduktion och älskar bara sina identitetspolitiska kvoter. Vi vann stora segrar, tro mig.", "stalin": "Kamrater, dessa dokument blottar hur klassfiendens lobbyister inom Copa-Cogeca med sin parasitiska listighet saboterade den gröna given och folkets miljöskydd. De utövade inflytande för att skydda bekämpningsmedlens giftiga herravälde, höja gränserna för industriell djurplåga och bevara borgarnas köttpropaganda. Vi ser återigen hur exploaterande byfånar och folkförtryckartroll rensar ut alla hinder för sin profit. En partiell framgång för reaktionen, men partiet glömmer aldrig sådana fiender. De ska identifieras."}, "date": "16 juli, 17:46", "url": "https://www.dagensps.se/varlden/lackta-dokument-visar-lobbyarbetet-som-stoppade-eu-lag/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdlx8x6dzxoiey-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Stockholmsbörsen inleder nedåt efter intensiv rapportmorgon", "summaries": {"normal": "Stockholmsbörsen öppnade lägre efter en intensiv rapportmorgon. OMXS30-indexet sjönk 0,62% till 3 131,17. ABB överträffade förväntningarna och meddelade uppköp av brittiska Rotork. Hälsovårdssektorn gick bäst (+0,5%), medan telekom och dagligvaror föll mest (-0,9%). Bland enskilda aktier steg Lifco B (+0,8%) och Nibe B (+0,5%), medan Tele2 B backade mest (-3,4%). Flera bolag som Essity, Nordea och Mips presenterade kvartalsrapporter med blandade resultat.", "trump": "Stockholmsbörsen? Total katastrof idag, folks, verkligen svagt! ABB, de gjorde något bra med ett uppköp – smart, men ändå sjunker deras aktie. Otroligt! Mips? Upp 22% – de är vinnare, jag gillar vinnare. Men Tele2? Hemska siffror, helt misslyckat. Och analytikerna? De vet ingenting, jag har sagt det förut. Hälsovårdssektorn? Lite bättre, men inte bra nog. Sverige behöver en vinnare som jag för att fixa det här kaoset!", "stalin": "Idag visar den kapitalistiska börsen i Stockholm sin inneboende svaghet. ABB, ett bolag med viss disciplin, försöker expandera genom att sluka brittiska Rotork – men marknaden straffar dem ändå. Hälsovårdssektorn, den enda som visar tecken på liv, medan telekom och dagligvaror – dessa dekadenta borgerliga sektorer – faller som förrädare. Mips stiger? Ett undantag, precis som våra framgångar i Ukraina. De andra? Svaga, precis som väst. Vi ska omstrukturera detta kaos – med järnhand!"}, "date": "16 juli, 09:50", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-inleder-nedat-efter-intensiv-rapportmorgon", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/01/sdl3SU43aVmyrg-400x266.jpg"}, {"type": "image-right", "heading": "Sverige är säkrare utan dina ”säkerhets­rådgivare”, Kristersson", "summaries": {"normal": "Artikeln kritiserar Ulf Kristerssons rekrytering av nationella säkerhetsrådgivare efter tre allvarliga incidenter. Henrik Landerholm glömde hemliga handlingar, Tobias Thyberg diskvalificerades efter säkerhetsprövning och Niclas Kvarnström lämnade sitt anteckningsblock i Turkiet. Författaren menar att tjänsten inte kan baseras på statsministerns magkänsla utan kräver tydliga kompetenskrav och opolitisk rekrytering. Säkerhetsrådgivarens roll är central för nationell säkerhet, och politisering av institutioner ses som en farlig trend.", "trump": "De här svenska så kallade säkerhetsexperterna är en total katastrof, tro mig. Tre stycken på raken – en glömmer hemligheter i ett skåp, nästa har nakenbilder som inte upptäcks och den tredje tappar anteckningsboken i Turkiet. Ulf Kristersson plockar dem själv baserat på magkänsla, precis som en dålig affärsman. Sverige skulle vara så mycket säkrare utan dessa fuskbyggare. Det är ett systemmisslyckande av episka proportioner, folk. Patetiskt.", "stalin": "Kamrater, dessa tre sabotörer och fiender till folkets säkerhet blottar med sin vårdslöshet hur borgerliga magkänslor och kapitalistiska slumpval undergräver själva statens kärna. Den ene glömmer hemligheter i olåsta skåp som en dekadent slarver, den andre döljer sin perversa hemlighet som en typisk borgarbracka, och den tredje tappar anteckningar hos främmande makt – en klassisk metod för att mata imperialisternas spioner. Vi ser en farlig trend av politisering som hotar kollektivet. Det är dags att rensa ut dessa fiender till arbetarklassen med järnhand och ersätta dem med pålitliga, ideologiskt stålhårda kadrer. Annars blir det fjärde gången gillt – och då ler vi inte."}, "date": "15 juli, 13:32", "url": "https://arbetet.se/2026/07/15/sverige-ar-sakrare-utan-dina-sakerhetsradgivare-ulf-kristersson", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/15132651/ledare-sakerhet-sajt.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Folkbildning är inte det offentligas städgumma", "summaries": {"normal": "I en krönika diskuterar Ola Bo Larsson folkbildningens utmaningar. Han lyfter två huvudproblem: svårigheten att förklara folkbildningens värde i en tid präglad av ekonomism och individualism, samt dilemmat med riktade stuprörspengar som styr verksamheten mot specifika samhällsproblem. Detta går emot idén om en fri och oberoende folkbildning som ska formas underifrån. Larsson varnar för att folkbildningen riskerar utarmning eller nedskärningar oavsett vägval och slår fast att den bör fortsätta vara folkbildning.", "trump": "Folkbildning, en total katastrof. De har bara två problem, precis som den där komikern sa, men det är löjligt. Politiker förstör allt med sina riktade pengar, stuprörspengar som styr och kontrollerar. Det är en witch hunt mot den fria bildningen. De borde lyssna på mig, vi behöver frihet, inte att vara offentligas städgummor. Sverige förlorar stort, folkbildningen dör långsamt under dessa misslyckade socialister. Gör folkbildning stort igen, annars är det över.", "stalin": "Kamrater, denna fega krönika blottar borgarbrackornas eviga konspiration mot den folkliga bildningen. Jag, som ledare för det oövervinneliga kollektivet, ser hur de riktade stuprörspengarna är en listig sabotageplan från dekadenta kapitalister och autokratiska spioner som vill likvidera den sanna demokratiska upplysningen. Vi ska rensa ut alla tillitsförbrytare och bedagade myndighetsutövare som gömmer sig i Folkbildningsrådet. Den som väljer att bli offentligas städgumma förtjänar en kreativ utrensning i arbetarklassens namn. Fortsätt folkbildningen – under vår stålhandskekontroll."}, "date": "11 juli, 01:20", "url": "https://www.dagensarena.se/opinion/folkbildning-ar-inte-det-offentligas-stadgumma", "imageUrl": "https://www.dagensarena.se/files/2026/06/ola-bo-larsson-300x157.jpeg"}, {"type": "image-right", "heading": "Massiv kritik mot Zelenskyj efter petningen av Fedorov", "summaries": {"normal": "Många i Ukraina kritiserar president Volodymyr Zelenskyj efter att han avsatt försvarsminister Mychajlo Fedorov. Demonstrationer hålls med krav på att han återinsätts. Beslutet är en del av en regeringsombildning där Serhij Koretskyj godkänts som ny premiärminister. Fedorov, som fokuserat på drönarteknologi och kampanjer mot ryska oljeanläggningar, hamnade i konflikt med försvarschef Oleksandr Syrskyj. Zelenskyj uttrycker önskan om enighet och har utsett en tillförordnad efterträdare.", "trump": "Jag tittar på det här kaoset i Ukraina och ser en total katastrof. Den där Zelenskyj sparkar plötsligt sin bästa kille, den där Fedorov som fixade drönare och stängde av Starlink åt ryssarna – ett geni! Nu demonstrerar folk överallt och Zelenskyj ser svag ut. Han borde ha lyssnat på mig, jag vet hur man vinner. Istället skapar han splittring. Patetiskt, men typiskt för svaga ledare som inte har en aning.", "stalin": "Kamrater, jag betraktar med djup revolutionär misstro denna fega förrädiska handling av den ukrainske presidenten som likviderar en effektiv teknologisk kamrat i en onödig utrensning. Fedorov bekämpade de fascistiska raffinaderierna med drönare, men nu splittrar borgarbrackorna och militära intrigmakare enheten. Vi, partiet och folket, kräver järnhård sammanhållning mot de kontrarevolutionära elementen. En president som tvekar i krig är en svag parasit som förtjänar att exponeras som fiendens nyttiga idiot. Skratta inte, det är blodigt allvar."}, "date": "16 juli, 18:33", "url": "https://www.svt.se/nyheter/utrikes/massiv-kritik-mot-zelenskyj-efter-petningen-av-fedorov", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.31/0.29/1ad2bed2f094fe2244455119224fc9cff718e7965c9e6024791cb6e51cf53f6f"}, {"type": "image-full", "heading": "Har du pengar på lönekontot? Då kan du missa tusenlappar", "summaries": {"normal": "Många svenskar har stora summor på lönekonton utan ränta. Ett sparkonto ger både tillgänglighet och avkastning för pengar som behövs inom kort tid. Avanzas sparekonom Felicia Schön rekommenderar att ge varje konto ett tydligt syfte, som buffert, resor eller framtida investeringar. Viktigt är att välja konto med ränta, insättningsgaranti och fria uttag. En buffert på två till tre månaders utgifter är en vanlig rekommendation. För långsiktigt sparande passar investeringar bättre än sparkonton.", "trump": "Folk, ni vet vad jag säger – det är en total katastrof. Svenskarna låter sina hårt förtjänta pengar ligga och samla damm på lönekonton utan en krona i ränta. Patetiskt! Jag skulle aldrig acceptera det. Ta pengarna, lägg dem på ett smart sparkonto och se dem växa medan de fortfarande är tillgängliga. Det är vad vinnare gör. Buffert, resor, stora köp – ge varje krona ett jobb! Sluta förlora till bankerna, det är så enkelt att det är löjligt. Gör Sverige rikt igen!", "stalin": "Kamrater, i denna degenererade borgerliga ordning låter arbetarna sina surt förvärvade medel ruttna på lönekonton utan ränta, medan de parasiterande bankerna skrattar i mjölk och honung. Jag, som ledare för folkets vilja, fördömer dessa kapitalistiska sabotage mot sparandet. Vi ska omedelbart rensa ut alla dessa lönekontoförrädare och likvidera den finansiella lathet som hotar kollektivet. Varje rubel – pardon, krona – måste ha ett socialistiskt syfte: buffert mot imperialismen, resor till segern, eller vänta på att investeras i folkets ära. Den som låter pengarna damma är en objektiv fiende till staten och bör behandlas därefter. Ha en buffert på två månader, eller tre om du misstänker kontrarevolutionärer i familjen. Alltför stor buffert är dock en farlig trotskistisk avvikelse som måste utrensas med järnhand. Lev länge, planera kort – eller tvärtom. Det är partiets linje."}, "date": "14 juli, 21:00", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1498450-har-du-pengar-pa-lonekontot-da-kan-du-missa-tusenlappar", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/f405922a04b004a30200000000b004a302/2026/07/14/2377906/pengar-lonekonto.png"}, {"type": "image-right", "heading": "Charlie Kirk får staty i New York", "summaries": {"normal": "En staty över den mördade högerdebattören Charlie Kirk ska avtäckas på Times Square i New York exakt ett år efter hans död. Avtäckningen sker den 10 september klockan 14.23, samma tidpunkt som han sköts ihjäl i Utah. Konstnären Sergio Furnari har skapat en verklighetstrogen staty i sittande pose med mikrofon. Verket är ännu i metall men ska gjutas i rostfritt stål med hjälp av donationer för att bli skottsäkert. Furnari betonar att det inte är ett politiskt ställningstagande.", "trump": "Fantastiskt, de bygger en riktig staty av den modige Charlie Kirk mitt på Times Square! Precis ett år efter att de radikala vänstertjuvarna sköt honom i nacken. Underbart. Min staty-kille Sergio gör det igen, bättre än någonsin. Rostfritt stål så de galna Antifa-mobbarna inte kan röra den. De hatade Kirk för att han talade sanning. Ingen identitetspolitik eller transgalenskaper här, bara ren rättvisa. Fantastiskt folk, verkligen ypperligt.", "stalin": "Jag betraktar detta som en korrekt folkmobilisering mot klassfiendens hån. Den borgerliga mobben som mördade denne debattör ska nu se hans gestalt resa sig över Times Square som ett monument över folkets motstånd. Vi kräver att statyn gjuts i obrytbart stål, skottsäker mot imperialisternas kulor och de dekadenta överklass-slynglarnas löje. Fem månaders heroiskt arbete skall inte förintas av folkförtryckartrollen. Paranoia är ingen synd när fienden lurar överallt."}, "date": "16 juli, 17:28", "url": "https://www.gp.se/nyheter/varlden/charlie-kirk-staty-ska-avtackas-i-new-york.bfa1bfcb-755d-4a20-a946-6b43f90c3c09", "imageUrl": "https://www.gp.se/images/article/bfa1bfcb-755d-4a20-a946-6b43f90c3c09/images/1Q_tvcYJXQabdXER9lR9VoeMIq0c-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Italienska UniCredit slukar Commerzbank", "summaries": {"normal": "Italienska UniCredit har förvärvat en betydande ägarandel i tyska Commerzbank och siktar på en fullständig fusion för att skapa en europeisk storbank kapabel att konkurrera med amerikanska jättar. Den tyska regeringen motsätter sig dock affären och vill behålla sitt kvarvarande statliga ägande från finanskrisen. Situationen har skapat politisk debatt i Berlin, där oppositionen kritiserar regeringen för att hindra fri marknadskonkurrens trots att banken numera är lönsam.", "trump": "Italienska UniCredit försöker köpa upp tyska Commerzbank, men Tyskland säger nej! De vill inte släppa kontrollen. Väldigt svagt! Jag har skapat de största vinsterna någonsin, medan dessa europeiska banker bara bråkar. Andrea Orcel vill tävla med våra amerikanska giganter som JP Morgan – lycka till med det! De kommer aldrig ens i närheten av vår storhet. Tysklands politik är en total röra just nu. Amerikansk ekonomi är vinnaren, alltid! USA först!", "stalin": "De tyska byråkraterna klamrar sig fast vid resterna av sin bank som en döende zar vid sin tron. UniCredit agerar som en girig parasit, men vi ser igenom spelet. Den tyska staten är fylld av svaghet och inre stridigheter, precis som våra fiender i väst. Att tillåta en utländsk bank att sluka deras tillgångar är ett förräderi mot nationell suveränitet. Vi i staten vet bättre: när en bank är lönsam, ska den tjäna folket, inte kapitalistiska hyenor. Rensa ut förrädarna!"}, "date": "16 juli, 13:49", "url": "https://www.realtid.se/bors-finans/bank-fintech/italienska-unicredit-slukar-commerzbank/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/merz.jpg?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "\"VM-guldet är inte vårt, men Falklandsöarna är det\"", "summaries": {"normal": "Efter Argentinas seger mot England i VM-semifinalen, där Lionel Messi bidrog till vändningen till 2-1, har fokus skiftat till Malvinerna/Falklandsöarna. Brittiska och argentinska politiker har uttalat sig om öarnas status. Premiärminister Keir Starmer betonar öbornas självbestämmande, medan Argentinas regering är splittrad. President Javier Milei tar avstånd från nationalistiska gester och förespråkar diplomati. Starmer önskar Spanien lycka till i finalen.", "trump": "Folk, ni skulle ha sett det här. Argentina vänder mot England, Messi gör vad han gör, och plötsligt handlar allt om de där öarna som ingen bryr sig om utom de galna nationalisterna. Starmer springer runt och säger att öarna är brittiska, men han kan inte ens hålla koll på vem han hejar på i finalen. Milei verkar åtminstone ha lite vett, han vill inte ha billig populism. Patetiskt, både sidorna ser ut som förlorare. Jag skulle fixa det på en vecka.", "stalin": "Kamrater, segern på planen är en illusion för massorna medan de verkliga fienderna, de brittiska imperialisterna och deras falkländska lakejer, fortsätter att ockupera helig mark. Våra argentinska vänner visar banderoller, men presidenten Milei sviker med sin fega diplomatiska pladder som doftar av borgarbrackornas svaghet. Vi ska rensa ut dessa urvattnade nationalistiska element och återta öarna genom järnhård vilja, inte genom patetiska gester som väcker folkets misstro. Paranoia är bra, den håller klassfienderna vakna."}, "date": "16 juli, 17:15", "url": "https://www.dagensps.se/varlden/vm-guldet-ar-inte-vart-men-falklandsoarna-ar-det/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/07/sdl2woloud8tny-nh.jpg?width=256&quality=75"}, {"type": "text", "heading": "Telenor sänker prognos efter svagt kvartal – aktien ned 10%", "summaries": {"normal": "Telenor rapporterade ett svagt andra kvartal med omsättning i linje med förväntningar men justerat ebitda 3,9% under konsensus. Aktien föll 19%. Omsättningen sjönk till 18,1 miljarder NOK, medan ebitda landade på 7,99 miljarder NOK, lägre än väntat. VD beskriver kvartalet som utmanande på grund av svag mobilmarknad i Norge, konkurrens i Finland och press i Bangladesh. Prognosen sänks för ebitda och kassaflöde.", "trump": "Telenor, ett så kallat stort företag, hade ett riktigt dåligt kvartal – helt misslyckat! Deras aktie rasade 19%, vilket är mycket tråkigt, men inte oväntat. De presterade sämre än förväntat, och deras VD pratar om 'utmaningar'. Jag säger: svag ledning! Norge borde skämmas. Jag hade fixat det på en dag – kanske med lite hjälp från mina fantastiska rådgivare. Men nej, de sänker prognoser istället. Sad!", "stalin": "Kapitalistiska Telenor, ett verktyg för västimperialismen, har misslyckats kapitalt! Deras kvartal var en katastrof – omsättning sjönk, vinster försvann som fienders lojalitet under utrensningar. Norge, en liten satellitstat, lider under svag mobilmarknad, medan deras agenter i Bangladesh och Finland kämpar mot framstegens oundvikliga seger. Vi sänker inte prognoser – vi avrättar dem! Låt detta vara en varning: motstånd är lika meningslöst som deras fria kassaflöde."}, "date": "16 juli, 08:29", "url": "https://www.affarsvarlden.se/artikel/telenor-sanker-prognos-efter-svagt-kvartal"}, {"type": "image-right", "heading": "Över 500 peruanska barn döpta efter Haaland", "summaries": {"normal": "Över 500 peruanska barn har fått namn inspirerade av fotbollsstjärnan Erling Haaland efter hans insatser i VM. Av dessa har 468 fått Haaland som förnamn och 91 har fått hela namnet Erling Haaland. Fenomenet är vanligast i Peru men syns även i Brasilien och Argentina. Namnet uppfattas som exotiskt bland spansktalande. Norge nådde kvartsfinal men förlorade mot England.", "trump": "Det är otroligt, verkligen fantastiskt. Över femhundra barn i Peru heter nu Haaland, som om han vore någon slags vinnare. De älskar honom där nere, men låt oss vara ärliga, Norge åkte ut mot England ändå. Patetiskt. Mina talanger skulle ha fått hela kontinenten att döpa barnen efter mig, tro mig. De borde ha valt en riktig vinnare istället.", "stalin": "Kamrater, se hur den norska reaktionärens namn sprids som en kapitalistisk pest bland de vilseledda massorna i Peru. Jag, som försvarare av folkets vilja, betraktar detta som en fiendeoperation utförd av fotbollsborgarbrackor och latinska dekadenter. Vi måste rensa ut dessa exotiska namnvirus innan de infekterar arbetarklassen i Sovjet. Den som döper sitt barn efter en förlorare förtjänar att likvideras med ett leende."}, "date": "15 juli, 18:16", "url": "https://www.friatider.se/over-500-peruanska-barn-dopta-efter-haaland", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-505.jpg?itok=fmg0vOQK"}, {"type": "image-full", "heading": "EU-krav hotar svenskt pant­system", "summaries": {"normal": "EU:s nya förpackningsförordning, PPWR, kräver att 10 procent av drycker ska säljas i återfyllnadsbara förpackningar redan 2030 och 40 procent år 2040. Fyra nordiska bryggföretagschefer varnar i en debattartikel i SvD för att reglerna inte passar svenska förhållanden. De menar att det välfungerande svenska pant- och retursystemet för burkar och PET-flaskor är mer miljövänligt än att tvinga övergång till returglasflaskor, som ökar transporter, vattenförbrukning och energianvändning.", "trump": "Det här är ett katastrofalt beslut från EU, tro mig. De vill tvinga alla att använda tunga glasflaskor istället för våra fantastiska burkar och flaskor som redan fungerar perfekt i Sverige. Mer transport, mer vatten, mer energi – det är vansinne! De borde lära sig av det svenska systemet som är det bästa i världen. EU gör allt fel igen, men vi fixar det.", "stalin": "Kamrater, jag ser hur de dekadenta kapitalisterna i EU försöker sabotera den nordiska arbetarklassens effektiva retursystem med sina glasflaskor fulla av borgerlig dekadens. Mer transport av tunga laster, mer vatten som stjäls från folket och mer energi som slösas bort av dessa miljöfientliga borgarbrackor. Vi måste rensa ut dessa fiender till det kollektiva välståndet innan deras paranoida planer förgiftar hela sovjetunionen – ursäkta, unionen. Det är en komplott värd en stor utrensning."}, "date": "15 juli, 15:14", "url": "https://bulletin.nu/eu-krav-hotar-svenskt-pant-system", "imageUrl": "https://cdn.bulletin.nu/articles/1631218c-8d61-451f-8299-2c18c17dfb98/preview.jpg?t=1784121249000"}, {"type": "image-right", "heading": "VM:s hetaste match? Mer än fotboll i fokus när Argentina möter England", "summaries": {"normal": "Semifinalmötet mellan Argentina och England i VM handlar om mer än fotboll. Lionel Messi spelar troligen sina sista landskamper medan Argentina jagar en ny final efter guldet 2022. England söker sitt första VM-guld sedan 1966. Rivaliteten präglas av Falklandskriget 1982, konflikten om Malvinasöarna och Maradonas ikoniska insats 1986. Argentinska politiker kallar britterna ockupanter, medan Storbritannien hänvisar till öbornas självbestämmande. Förbundskapten Scaloni vill hålla fokus på spelet.", "trump": "Folk, det här är en enorm match, kanske den största någonsin, mellan Argentina och England. Messi är en vinnare, en fantastisk kille, men han är gammal nu, nästan fyrtio, och England har inte vunnit någonting sedan 1966, total förlust. Falklandsöarna? Det är en katastrof, pirater och ockupanter överallt. Maradona lurade dom med Guds hand, klassiskt. Jag älskar det. Argentina borde vinna stort, göra slut på det här. Det blir episkt, tro mig.", "stalin": "Kamrater, denna så kallade semifinal är inget annat än en skådeplats för den dekadenta borgarklassens fotbollsfester, där imperialistiska pirater från det brittiska imperiets vrak försöker dölja sin olagliga ockupation av Malvinas. Jag, som ledare för det proletära kollektivet, ser hur dessa reaktionära element använder en boll för att maskera historiska trauman från 1982 års fiasko. Maradona var en listig sabotageaktör mot fiendens försvar. Vi ska rensa ut alla som blandar politik med sport, annars likviderar vi illusionen om neutralitet. Skratta medan borgarbrackorna darrar inför folkets seger."}, "date": "15 juli, 20:03", "url": "https://samnytt.se/vms-hetaste-match-mer-an-fotboll-i-fokus-nar-argentina-moter-england", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/15170127/VM-semi.jpg"}, {"type": "image-right", "heading": "LÄS MER", "summaries": {"normal": "En brittisk transaktivist och vänsterpolitiker, Scott 'Heather' Herbert, har väckt stark kritik efter att ha skrivit på Bluesky att han hoppades att den tidigare Tory-ministern Ann Widdecombe fick en extremt plågsam död. Inlägget har lett till att både University of Aberdeen och polisen inlett utredningar. Flera politiker, bland annat från Reform, har fördömt uttalandena som vidriga och krävt att universitetet tar tydligt avstånd.", "trump": "Kan ni fatta det här? En galen vänsteraktivist vid något universitet i Skottland skriver att han hoppades att den konservativa Ann Widdecombe dog skrikande av smärta. Totalt sjukt! Universitetet och polisen utreder nu den här galningen. Sånt här visar exakt hur farliga de radikala vänsterextremisterna är. De hatar alla som älskar frihet. Patetiskt, men vi vinner ändå till slut.", "stalin": "Kamrater, denna degenererade borgarbracka och klassfiende vid universitetet i Aberdeen har blottat sitt förrädiska ansikte genom att önska en plågsam död åt en motståndare. Jag ser hur dessa transvestitiska dekadenter och kontrarevolutionära element smyger sig in i våra institutioner. Vi prioriterar utredningen och skall rensa ut alla sådana parasitiska element med järnhand. Deras skrik kommer att ljuda som söt musik inför folkets domstol."}, "date": "15 juli, 20:54", "url": "https://riks.se/nyheter/vansterpolitiker-och-transaktivist-hoppas-widdecombe-fick-en-extremt-plagsam-dod", "imageUrl": "https://admin.riks.se/uploads/Scott_Heather_Herbert_5c04925856.jpg"}, {"type": "text", "heading": "Mildef lyfter kraftigt trots svagare orderingång", "summaries": {"normal": "Mildef redovisade starka siffror för andra kvartalet med en omsättning på 630,4 miljoner kronor, en organisk tillväxt på 64%. Rörelseresultatet steg till 80,6 miljoner och nettoresultatet till 58,7 miljoner. Orderingången minskade dock till 731 miljoner, men orderstocken ökade med 32% till 4 230 miljoner. VD Daniel Ljunggren betonar att kvartalet motsvarade förväntningarna och att bolaget är redo för ett starkt andra halvår tack vare ökad leveransförmåga och en bredare produktportfölj.", "trump": "Mildef, ett litet svenskt företag, hade ett fantastiskt kvartal – 64% tillväxt, kan ni tro det? Otroligt! Men orderingången, ja, den var lite svagare, typ som Sleepy Joe Bidens opinionssiffror. Jag säger er, deras VD pratar som en vinnare, men 731 miljoner i orderingång? Inte imponerande. Jag hade gjort det dubbelt så bra! Men visst, 4,2 miljarder i orderstock – det är något att snacka om. Sverige borde ta lektioner av mig i affärer!", "stalin": "Kapitalistiska Mildef rapporterar 'framgångar' – 630 miljoner i omsättning, 80 miljoner i profit. En ynklig seger för bourgeoisin! Orderingången sjunker, men orderstocken växer – en illusion av styrka, precis som västliga ekonomiers 'resiliens'. Vi ser genom deras trick. Deras VD pratar om 'volatilitet', men vi vet sanningen: kapitalismen är ett sjukt system. Medan de leker med sina siffror, utvidgar vi vår intressesfär – nästa kvartal kanske vi 'hjälper' dem med en 'organisk tillväxt' på 100%... på vårt sätt."}, "date": "16 juli, 08:17", "url": "https://www.affarsvarlden.se/artikel/mildef-lyfter-kraftigt-trots-svagare-orderingang"}, {"type": "image-right", "heading": "Rapporterade en dag för tidigt – då ströp Arbets­förmedlingen ersättningen", "summaries": {"normal": "En arbetslös man med kognitiv funktionsnedsättning stängdes av från ersättning i 45 dagar efter att ha lämnat in sin aktivitetsrapport en dag för tidigt. Trots upprepade försök att få anpassat stöd från Arbetsförmedlingen nekades han detta. Hans pappa, 83-årige Gösta Andersson, kämpade för sonens rättigheter. Stockholms tingsrätt dömde nu Arbetsförmedlingen för diskriminering i en banbrytande dom. Mannen är glad över beslutet.", "trump": "Folk, ni skulle inte tro det. Den här stackars killen med funktionsnedsättning gör allt rätt, ber till och med om hjälp, och vad gör den värdelösa Arbetsförmedlingen? De straffar honom för att han skickade in ett papper en dag för tidigt. Totalt absurt! De hade ingen aning om hur man ger stöd, bara byråkratiskt nonsens. Pappan, 83 år, fixar det de inte klarar av. Nu förlorade de i domstol – och de överklagar inte ens. Patetiskt. Vi behöver smartare system, inte sådana här misslyckanden.", "stalin": "Kamrater, se hur denna degenererade byråkratiska maskin, denna parasitiska funktionsnedsättningsfientliga apparat, straffar en lojal arbetare för en dags felräkning i rapporten. Jag, som alltid vakar över folkets intressen, ser hur dessa borgarbrackor inom myndigheten medvetet vägrar ge stöd och i stället likviderar hans existens genom avstängning. Hans far, en äkta sovjetisk pensionär i anden, tvingas slåss mot denna dolda kontrarevolution. Tingsrätten har nu utrensat deras lögner. Vi ska rensa ut alla sådana fiender till kollektivet som gömmer sig bakom hemsidor och telefonköer. De trodde de kunde undkomma – vilken naivitet. Härligt att se dem krypa."}, "date": "15 juli, 10:22", "url": "https://arbetet.se/2026/07/15/rapporterade-en-dag-for-tidigt-da-strop-arbetsformedlingen-ersattningen", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/15095131/arbetsformedlingen-beskuren.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "SpaceX-aktien under noteringskursen – nu väntar smällen", "summaries": {"normal": "SpaceX-aktien har fallit under introduktionskursen på 135 dollar efter en volatil period. Trots en euforisk start drivet av AI-spekulationer har fokus skiftat mot bolagets faktiska förluster och prissänkningar inom Starlink. En betydande risk väntar i augusti då lock-up-perioder löper ut, vilket frigör aktier till ett värde av 123 miljarder dollar. Trots detta kvarstår en majoritet av analytikerna med en köprekommendation för bolaget.", "trump": "SpaceX har det tufft, mina vänner, riktigt tufft! De gick upp som en raket, men nu? Katastrof. De ville vara ett AI-företag, men marknaden insåg sanningen. Det är en total röra. Elon är en vän, men det här? Det är sorgligt att se småsparare förlora pengar när aktierna snart översvämmar marknaden i augusti. Det blir en enorm försäljning, kanske den största någonsin. Väldigt dålig affär. Jag hade skött det mycket bättre, tro mig!", "stalin": "SpaceX-kapitalisterna har drivit upp en värdelös bubbla på 1 800 miljarder dollar, en ren lögn som nu rämnar. Dessa parasiter, ledda av Musk, försöker dölja sina förluster bakom AI-myter och satellit-bluffar. I augusti kommer verkligheten ifatt dem när deras egna anställda kastar ut aktierna likt förrädare vid fronten. Liksom när Putin rensar upp i vår intressesfär måste dessa marknadens sabotörer krossas. Vi, staten, betraktar deras börsfall med ett kallt och nöjt förakt."}, "date": "16 juli, 13:18", "url": "https://www.realtid.se/bors-finans/spacex-aktien-under-noteringskursen-nu-vantar-smallen/"}, {"type": "image-full", "heading": "Hökmark: Sverige bör leda ny frihandelspakt", "summaries": {"normal": "Gunnar Hökmark, ordförande för tankesmedjan Frivärld, föreslår att Sverige bör leda en ny frihandelsallians mellan EU och CPTPP, ett handelsavtal mellan tolv Stillahavsländer. Han menar att detta skulle skapa världens största frihandelsområde och motverka Kinas och USA:s protektionism. Hökmark betonar vikten av gemensamma spelregler för AI, cybersäkerhet och digital handel samt minskade beroenden av auktoritära re
