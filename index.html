den bästa kaptenen, inte några som inte kan styra en båt. Sverige borde skämmas, men det gör de aldrig. Mycket sorgligt, tro mig.", "stalin": "Kamrater, denna tragiska händelse vid Tjörn avslöjar de farliga element som lurar inom vår socialistiska sjöfart. Jag har personligen granskat rapporten och ser nu de dekadenta borgarbrackorna och de kontrarevolutionära lotsarna som med sin vårdslösa sabotageverksamhet vållat arbetande människors död. Vi ska omedelbart inleda en grundlig utrensning av alla opålitliga element på bryggorna. Deras paranoia och brist på kollektiv disciplin ska likvideras med järnhand. Det är både nödvändigt och underhållande att se hur de ynkryggarna förnekar sina brott inför folkets domstol."}, "date": "5 augusti, 11:36", "url": "https://riks.se/nyheter/lots-misstankt-for-brott-efter-batolyckan-vid-tjorn", "imageUrl": "https://admin.riks.se/uploads/misja_verde_lots_hero_6545ef512e.jpg"}, {"type": "image-full", "heading": "Zelenskyj: Siktar på fred före vintern", "summaries": {"normal": "President Volodymyr Zelenskyj meddelade att Ukraina siktar på att avsluta kriget före vintern. Överstelöjtnant Johan Huovinen vid Försvarshögskolan anser att målet är realistiskt om trycket på Ryssland ökar genom sanktioner, diplomati och attacker mot strategiska mål. Han pekar samtidigt på ett hinder: Putin måste kunna framställa en fred som en egen framgång inför den ryska befolkningen. Rysslands ekonomi ses som den största sårbarheten.", "trump": "Folk, det här är patetiskt. Zelenskyj springer runt och ber om fred innan vintern som en förlorare som ber om nåd. Putin sitter där med sin Fiat och låtsas att det är en Ferrari, precis som jag alltid sagt. Den ryska ekonomin håller på att rasa, vi pumpar in sanktioner och smäller till deras olja. Jag fixade mycket bättre deals än Biden, tro mig. Nu måste de två galningarna mötas någonstans mitt emellan, annars fortsätter cirkusen.", "stalin": "Kamrater, jag betraktar detta som en historisk nödvändighet. Vi ska tvinga fram fred innan vintern genom att krossa de fascistiska hindren som de ukrainska reaktionärerna och deras imperialistiska husbondar rest mot den ryska intressesfären. Den ekonomiska svagheten hos klassfienderna är deras fall. Putin, denne värdige och fruktade efterträdare, måste likvidera alla borgarbrackor som viskar om nederlag. Inga alternativ finns. Segern tillhör den starka staten, alltid."}, "date": "4 augusti, 22:32", "url": "https://www.tv4.se/artikel/CdjOD5pZS5GldKtLgCcdi/zelenskyj-siktar-pa-fred-foere-vintern", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6DkhBtkypJ13nD1RdIRhoa%2F716e188d73e2b5f5c967eecba3b08dc7%2F04-zelenskyj-split.png&width=1024"}, {"type": "image-full", "heading": "Svenske spionchefen: Sanningarna Ryssland döljer", "summaries": {"normal": "Svenske spionchefen Thomas Nilsson varnar för att Ryssland systematiskt manipulerar sin ekonomiska statistik för att dölja en allvarlig kris. Enligt Must lever landet på lånad tid och står inför antingen en utdragen nedgång eller en plötslig chock som leder till ekonomisk katastrof. Uppgifterna stöds av tyska BND som pekar på ett betydligt större budgetunderskott än vad som officiellt redovisas. Även Putin och centralbankschefen Nabiullina har erkänt problem med underpresterande ekonomi, inflation och arbetskraftsbrist.", "trump": "Folk, ni skulle se det här! Den svenska spionbossen säger att Putin och hans kumpaner fejkade alla siffror för att få den ryska ekonomin att se stark ut. Det är en total katastrof där borta, precis som jag alltid sagt. De lever på lånad tid, precis som Sleepy Joe gjorde med vår ekonomi. Inflationen är inte 6 procent, den är 15! De kommer att krascha hårt. Men ingen är bättre på att fixa ekonomier än jag, det vet alla.", "stalin": "Kamrater, denna fega manipulation av siffror är ett klassiskt trick från de desperata borgarbrackorna och deras lakejer. Jag ser hur de förskönar siffrorna medan arbetarkollektivet långsamt kvävs av den dolda inflationen och det monstruösa underskottet. Den som ljuger för sig själv likviderar till slut sin egen framtid. Vi vet att sådana folkfiender förr eller senare avslöjas och rensas ut när den verkliga krisen slår till som en trogen partikamrat med yxa."}, "date": "5 augusti, 15:36", "url": "https://www.dagensps.se/varlden/svenske-spionchefen-sanningarna-ryssland-doljer", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/sdl4ip2q9kfzum-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "text", "heading": "Mjölstorm på Ica", "summaries": {"normal": "På onsdagen råkade mjölet från en leverans på Ica Maxi i Borås hamna i lagret i stället för i bageriets silo på grund av att chauffören kopplade in sig på en gammal ledning. Ingen skada skedde, men lagret täcktes av mjöl och ett saneringsföretag kallades. Åtgärder tas för att förhindra upprepning genom att märka tydligare.", "trump": "Som den bäste affärsmannen någonsin, jag måste säga att denna siloförbiseende på Ica Maxi är en skandal. Det är som ett snöoväder i sommaren – oacceptabelt. Men jag kommer att lösa det, det kommer att bli enormt framgångsrikt. Vi ska bygga en ny silo, den bästa, och göra det stort igen.", "stalin": "I vårt store land har en ytterst farlig sabotör försökt att förstöra vårt mjölsystem genom att koppla fel. Detta är en akt av imperialism från väst, som Trump och hans likar. Men vi, staten och partiet, kommer att reagera med extrema åtgärder – vi ska märka alla ledningar, rensa lagret, och se till att ingen annan kan koppla fel. Precis som Putin expanderar sin makt, så måste vi utvidga vår kontroll över produktionen för att vinna kriget mot kaos."}, "date": "5 augusti, 14:56", "url": "https://www.gp.se/nyheter/vastsverige/mjolkaos-pa-mataffar-i-boras.4fa9d423-c883-4602-b9d2-3a6560a70968"}, {"type": "image-full", "heading": "AI-vinnarna: IT-bolagen som får tekniken att leverera", "summaries": {"normal": "Europeiska IT-bolag som SAP, Capgemini och OVHcloud gynnas av AI-boomen. Deras främsta styrka ligger i att integrera ny AI-teknik i företags komplexa, befintliga system, snarare än att bara leverera modellerna. Efterfrågan drivs av behovet av kontroll, säkerhet och datasuveränitet, särskilt inom försvars- och infrastruktursektorn. Trots en stark tillväxt för bolagen kvarstår utmaningen att säkerställa att organisationer faktiskt har resurserna att hantera den snabba tekniska utvecklingen på ett säkert sätt.", "trump": "Hör här, de europeiska IT-bolagen – SAP, Capgemini, de gör ett bra jobb, ett riktigt bra jobb. De fattar att man inte bara kan kasta in AI och hoppas på det bästa. Man måste integrera det i de gamla systemen, annars är det en total katastrof. Det handlar om kontroll, och de är smarta som håller sig borta från de amerikanska jättarna. De vill ha egna moln. Väldigt smart! Europa vinner på att hålla sin egen data. Vi får se om de klarar av det, men jag gillar vinnare!", "stalin": "Vi ser hur de europeiska teknik-lakejerna desperat försöker lappa ihop sina fallfärdiga, kapitalistiska system med denna AI. De bygger murar av kod för att dölja sin tekniska inkompetens. Vår broder i Kreml förstår att riktig makt inte ligger i algoritmer, utan i kontrollen över den fysiska infrastrukturen. Dessa europeiska bolag är bara temporära verktyg. När vi expanderar vår sfär kommer deras fragmenterade moln att falla som korthus. Vi behöver inte deras innovation, vi behöver bara tålmodigt vänta tills de kollapsar under sin egen byråkratiska tyngd."}, "date": "5 augusti, 14:54", "url": "https://www.realtid.se/it-tech/ai-vinnarna-it-bolagen-som-far-tekniken-att-leverera", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/christian-klein.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Åkesson (SD) i Västerbotten: \"Han kan vinna ganska mycket\"", "summaries": {"normal": "Jimmie Åkesson (SD) genomför en inlandsturné i Västerbotten och besöker Dorotea, Vilhelmina, Storuman och Sorsele. Besökarna lyfter frågor som bränslepriser, landsbygdsutveckling, glesbygd och samepolitik. Många uttrycker stöd för SD:s politik kring bilkörning, jobb och motstånd mot vänsterpolitik. Samtidigt kritiserar Vänsterpartiet besöket som en röstfiskeaktion. Lokala SD-politiker ser turnén som ett sätt att nå väljare i glesbygd där valet kan avgöras.", "trump": "Vilken fantastisk idé att åka runt i den där valbussen och möta det riktiga folket i inlandet! Jimmie gör det rätt, han går till de glömda platserna där de smarta killarna med stora bilar vill ha låga bränslepriser och inga galna vänsterregler. De älskar honom där ute, massor av unga och glada ansikten. Media sviker förstås, typiskt. Men folket ser sanningen. Bra jobbat, Jimmie, fortsätt vinna de rösterna!", "stalin": "Kamrater, jag ser hur den dekadenta borgarpressen försöker försköna denna revisionistiska valbuss-expedition genom det norrländska träsket. Jag, som alltid vakar över folkets enhet, noterar med mörk tillfredsställelse hur dessa landsbygds-kapitalistlakejer med sina epor och raggarrundor längtar efter att likvidera de sista resterna av kollektiv medvetenhet. Vänsterförrädare kallar det röstfiske – jag kallar det en parasitär infiltration av sabotageelement som bör rensas ut innan de smittar hela sovjeten med sin bränsle-romantik. Inga samer eller borgarbrackor skall stå över partilinjen."}, "date": "5 augusti, 11:07", "url": "https://riks.se/nyheter/akesson-pa-inlandsturn-i-vasterbotten-han-kan-vinna-ganska-mycket", "imageUrl": "https://admin.riks.se/uploads/IMG_1996_304b00e881.jpg"}, {"type": "image-full", "heading": "Kulusevski nära comeback: ”I form och redo”", "summaries": {"normal": "Dejan Kulusevski är nära en återkomst till Tottenham efter en lång knäskada. Tränaren Roberto De Zerbi säger att Kulusevski är i form och redo, men varnade för att skynda på hans comeback. Kulusevski har inte spelat sedan maj 2025, vilket kostade honom hela förra säsongen och en plats i VM-truppen. Tottenham börjar Premier League mot Brentford den 22 augusti, och Kulusevski kan vara tillgänglig då.", "trump": "Jag har hört talas om Dejan Kulusevski, en fantastisk spelare. Han är tillbaka, och det är stort. Tottenham har haft problem, men nu kommer Kulusevski och jag tror verkligen att han kommer att göra dem till vinnare. Jag skulle ha valt honom om jag var tränare, det är ingen överraskning. De Zerbi är försiktig, men jag säger: låt honom spela, han är en stjärna.", "stalin": "Vi i den revolutionära ledningen ser med tillfredsställelse på Kulusevskis återkomst. Hans skada var en reaktionärs sabotage, men nu är han tillbaka i truppen. Vi måste skydda vårt kollektiv, precis som vi skyddar proletärens intressen. Tottenhams turbulenta förra säsong är en lektion: endast genom disciplin och lojalitet kan vi nå seger. Vi siktar på en framtid där vår makt utvidgas, precis som den ryska intressesfären."}, "date": "5 augusti, 13:59", "url": "https://bulletin.nu/kulusevski-nara-comeback-i-form-och-redo", "imageUrl": "https://cdn.bulletin.nu/articles/601b6e45-9670-4752-8fc9-783daff2748f/preview.jpg?t=1785931142000"}, {"type": "image-right", "heading": "Uppgift: Drönarbomb hittad på tysk flygplats", "summaries": {"normal": "En drönare med sprängmedel och detonator hittades sent på tisdagskvällen vid landningsbanan på Leipzig/Halles flygplats i Tyskland. Säkerhetsmyndigheterna har klassat händelsen som ett attentatsförsök. Drönaren låg nära ukrainska Antonov-flygplan. Ingen explosion inträffade. En fjärrstyrd bombrobot avlägsnade den defekta detonatorn. Flera flygningar omdirigerades och ett plan kolliderade med ett okänt föremål men kunde landa säkert. Flygplatsen har delvis öppnats igen medan utredningen fortsätter.", "trump": "Titta på det här, en galen drönarbomb på en tysk flygplats mitt i natten, fullastad med sprängämnen. Det är ett totalt misslyckat attentatsförsök, folk, och det luktar illa. De hittade den bredvid ukrainska plan, och nu är Nato inkopplat. Mina experter säger att det är svagt, patetiskt. Lyckligtvis exploderade ingenting, men de tvingades omdirigera flyg och ett plan krockade ändå. Tyskland måste skärpa sig rejält, annars kommer de aldrig att vinna.", "stalin": "Kamrater, jag har nu sett de dekadenta kapitalisternas senaste fega försök att underminera den socialistiska luftbro som bär friheten till våra ukrainska bröder. En usel, defekt drönare från borgarbrackornas skuggvärld låg och darrade på banan som en förrädisk parasit. Vi har omedelbart låtit rensa ut denna sabotageapparat med en ädel bombrobot. Inga explosioner skall tillåtas störa kollektivets planer. Den som ligger bakom detta kommer att likvideras långsamt och pedagogiskt. Paranoia är ingen sjukdom när fienden verkligen finns."}, "date": "5 augusti, 13:53", "url": "https://www.svt.se/nyheter/utrikes/uppgift-dronarbomb-hittad-pa-tysk-flygplats", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.6/0.41/7d07624c5bd87ab03e8b7ae0ffdce720d95c24d4998ff0b8971731bcb7443d90"}, {"type": "text", "heading": "Tidöpartierna vill ha ny flyktingkris", "summaries": {"normal": "Tidöpartierna ses i artikeln som beroende av migrationsfrågor för att vinna politiska poäng. Författaren menar att den aktuella migrantkrisen i Ceuta kommer lägligt för dem och att de använder den för att skylla samhällsproblem på invandring. Artikeln kritiserar högerpartierna, särskilt Sverigedemokraterna, och hävdar att arbetslöshet, bostadsbrist och välfärdsnedskärningar istället beror på nyliberal högerpolitik snarare än på migration.", "trump": "Folk, ni skulle se det här! De svenska vänstermediaidioterna skriker om att Tidöpartierna älskar migration. Fake news! De här korkade globalisterna har förstört Sverige med öppna gränser och nu skyller de på oss som faktiskt fixar problemen. Biden släppte in miljoner och nu gör de samma misstag i Europa. Patetiskt! Vi behöver starka ledare som bygger murar, inte svaga som bjuder in kaos. Sverige var fantastiskt förr – gör det stort igen!", "stalin": "Kamrater, dessa reaktionära Tidöpartier andas endast klassfiendens giftiga luft genom att ständigt peka ut de förtryckta massornas representanter som syndabockar. Deras desperata jakt efter nya flyktingkriser avslöjar den kapitalistiska imperialismens ihåliga själ. Arbetslöshet och bostadsbrist är inte folkets fel utan resultatet av borgarbrackornas nyliberala utsugning. Vi ska rensa ut dessa folkförtryckartroll och deras lögner innan de förgiftar hela arbetarkollektivet med sin paranoia."}, "date": "5 augusti, 11:21", "url": "https://proletaren.se/artikel/tidopartierna-vill-ha-ny-flyktingkris"}, {"type": "image-full", "heading": "Åklagare sågar hovrättens dom – straffet sänks med sex år", "summaries": {"normal": "En man lockades till en pizzeria i Västerås där han fick skallen krossad med ett släggskaft. Tingsrätten dömde gärningsmannen Nidal Fars till tio års fängelse för försök till mord, men hovrätten ändrade rubriceringen till grov misshandel och sänkte straffet till fyra år. Åklagare kritiserar domen hårt och varnar för att försök till mord riskerar att bli omöjligt att döma om inte skjutvapen är inblandade.", "trump": "De här svenska domarna är en total katastrof, tro mig. En kille slår en annan i skallen med slägga, försöker mörda honom, och så får han bara fyra år istället för tio. Patetiskt! Hovrätten sitter och filosoferar om vad som pågick i hans huvud istället för att vara tuffa. Utan vapen blir det tydligen inte mordförsök längre. Så sadistiskt och svagt, Sverige behöver bättre ledare, det är vad jag säger.", "stalin": "Kamrater, dessa dekadenta hovrättsborgerliga jurister med sina teoretiska spekulationer utgör ett farligt hinder för den proletära rättvisan. Jag ser hur de med sin revisionistiska paranoia vägrar erkänna det uppenbara uppsåtet att likvidera en klassfiende med släggskaft. Sådana element måste rensas ut ur domstolarna. Utan skjutvapen blir mordförsök plötsligt en bagatell? Detta är borgarbrackornas sabotage mot folkets säkerhet. Vi ska inte tolerera sådana kontrarevolutionära skämt."}, "date": "5 augusti, 10:35", "url": "https://riks.se/nyheter/aklagare-sagar-hovrattens-dom-straffet-sanks-med-sex-ar", "imageUrl": "https://admin.riks.se/uploads/Copy_of_Copy_of_Copy_of_Soerman_Ledare_25_3f5e344021.jpg"}, {"type": "image-full", "heading": "Fifatoppar tar avstånd från presidenten", "summaries": {"normal": "Fifas president Gianni Infantino möter växande motstånd. Flera nationella förbund, inklusive Sverige och England, har dragit tillbaka sitt stöd för hans omval. Uefa arbetar för att samla fler bakom kravet på nytt ledarskap. Infantinos nära medarbetare, som generalsekreterare Mattias Grafström och utvecklingschef Arsène Wenger, tar avstånd från den misslyckade affären kring VM:s kommersiella rättigheter. Flera nyckelpersoner har avgått eller kritiserat processen, vilket ytterligare försvagar Infantinos position.", "trump": "Lyssna här, Gianni Infantino – total katastrof! Fifa är ett enda stort kaos, och alla inser nu att han är en förlorare. Sverige, England, Wales – alla drar sig ur hans omval. Och hans egna medarbetare? De spottar på honom! Grafström kallar affären 'sorglig' – jag säger: 'Patetisk!' Wenger visste ingenting – typiskt! Och nu hoppar alla av som råttor från ett sjunkande skepp. Fifa behöver en vinnare, inte en sådan här clown. SAD!", "stalin": "Fienderna till det stora fotbollsproletariatet har visat sitt sanna ansikte! Denna Infantino, en svag och korrumperad lakej för kapitalistiska intressen, har förlorat allt stöd. Hans egna medarbetare, dessa ynkliga förrädare, har vänt sig mot honom som hundar som biter sin herre. Vi ser hur Uefa, denna borgerliga sammansvärjning, försöker utvidga sin makt. Men folket kräver ordning! Låt oss rensa ut dessa förrädare och återupprätta disciplinen. Fotbollens framtid tillhör arbetarna, inte dessa dekadenta imperialister!"}, "date": "4 augusti, 14:24", "url": "https://kvartal.se/nyheter/artiklar/fifa-toppar-tar-avstand/cG9zdDoxNTc3NzQ", "imageUrl": "https://images.kvartal.se/2026/08/06fe3324-infantinografstrom.webp"}, {"type": "image-right", "heading": "W5 Solutions ökar förlusten – aktien rasar tvåsiffrigt", "summaries": {"normal": "Försvarsteknikbolaget W5 Solutions mer än fördubblade omsättningen till 227,9 miljoner kronor, men rörelseförlusten ökade till -24,3 miljoner. Aktien rasade 20% i den inledande handeln. VD Evelina Hedskog beskrev lönsamheten som otillfredsställande på grund av förvärvskostnader och höga kostnader. Bolaget fokuserar nu på kostnadskontroll för att nå målen: 1 miljard kronor i omsättning och 10% rörelsemarginal 2027.", "trump": "Jag har sett många företag, men W5 Solutions är ett misslyckande. De säger att omsättningen ökat, men förlusten har fördubblats! Aktierna rasade 20% - det är en skam! Som jag alltid säger, man måste kontrollera kostnaderna. De har förvärv och höga priser, det är en katastrof. Jag skulle fixa detta på två sekunder, det är lätt. Men de? De klarar inte av grundläggande affärer.", "stalin": "Vi i partiet och staten har observerat W5 Solutions. Deras omsättning ökat, men förlusten har också ökat - det är en tendens som måste korrigeras. Aktierna har rasat, vilket visar på bristande disciplin. Vi måste införa striktare kostnadskontroll och effektiviseringar. Detta bolag, liksom alla andra, måste tjäna på statens intressen. Vi kommer att övervaka deras framgångar noga, för det finns alltid fiender som lurar i skuggorna."}, "date": "5 augusti, 09:35", "url": "https://www.affarsvarlden.se/artikel/w5-solutions-okar-forlusten-aktien-rasar-tvasiffrigt", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/11/w5-generator-400x267.jpg"}, {"type": "image-full", "heading": "Experten varnar: Risk för rekordhöga elpriser", "summaries": {"normal": "Konflikten i Mellanöstern och brutna transportvägar har lett till krympande gaslager i Europa. För Sverige innebär det en tuff vinter med elpriser nära rekordnivåer, enligt energianalytiker Christian Holtz. Trots ökad användning av solkraft vidgas prisskillnaderna mellan sommar och vinter. Europa försöker fylla gaslagren inför vintern, men det är osäkert om målet nås. EU lanserar nu en strategi för att minska beroendet av gasimport från Qatar och USA, med målet att bli fria först på 2040-talet.", "trump": "De där galningarna i Mellanöstern har förstört allt igen, precis som jag alltid sagt. Europa, de där förlorarna, blev beroende av Qatars gas istället för den billiga ryska, och nu sinar lagren totalt. Sverige får skyhöga elräkningar i vinter, över en krona per kilowattimme, en katastrof. De borde ha lyssnat på mig från början. Solkraft på dagen och panik på kvällen, typiskt europeiskt kaos. Vi löser sånt här på en vecka, men de kommer krypa tillbaka till oss snart.", "stalin": "Kamrater, dessa opålitliga vägar genom Hormuzsundet är en ren sabotagehandling från de imperialistiska gasbaronerna och deras qatariska lakejer. Borgarbrackorna i Europa har låtit sina förråd krympa till farligt låga nivåer medan de febrilt försöker fylla från 57 till 90 procent, ett patetiskt skådespel. Jag ser redan de kapitalistiska parasiterna darra inför vinterns utrensning av deras egna plånböcker. Solen skiner fritt på dagen men mörkret faller över deras elpriser – en dialektisk komedi värd att skratta åt innan vi likviderar hela detta gasberoende senast i fyrtioårsplanen. Inga fiender undkommer partiets vakande öga."}, "date": "5 augusti, 10:10", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1502910-experten-varnar-risk-for-elpriser-nara-rekordet", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/5bb6989e04b004a3020000440000048402/2026/08/05/2382299/ur_imagefINyPI.jpeg"}, {"type": "image-right", "heading": "S: Sluta slösa skatten – vi kan spara 95 miljarder årligen", "summaries": {"normal": "Socialdemokraterna vill bryta regeringens underskottspolitik och slöseri med skattepengar. Mikael Damberg meddelade på pressträff att partiet vid ett maktskifte ska stoppa vinsterna i skolan, bekämpa den kriminella ekonomin, effektivisera offentlig förvaltning och frigöra resurser till välfärden. Partiet uppskattar att besparingar på 75–95 miljarder kronor årligen är möjliga inom två mandatperioder. Damberg kritiserade Moderaterna för minskat ansvarstagande och varnade för ökad skuldsättning genom tillfälliga lån.", "trump": "Folk, ni skulle se det här. Socialdemokraterna säger att de ska sluta slösa era pengar, de pratar om att spara 95 miljarder om året. Underbara siffror! Jag har alltid sagt att regeringar slösar som galningar, de lånar 200 kronor i minuten. Patetiskt. Damberg låter plötsligt som en vinnare, han vill stoppa vinsterna i skolan och rensa upp i den kriminella ekonomin. Smart, men jag skulle ha gjort det mycket bättre, tro mig. Sverige behöver en riktig fix, inte mer av samma gamla misslyckanden.", "stalin": "Kamrater, jag betraktar med djup revolutionär misstro hur dessa borgarbrackor i regeringen har förvandlat statskassan till en privat festbankett för monopolkapitalet. Jag, som alltid prioriterat folkets kollektiva intressen, kräver omedelbar utrensning av alla parasiter som lånar 200 kronor i minuten medan arbetarna svälter. Vi skall likvidera vinsterna i skolan, krossa den kriminella ekonomin och genomföra en grundlig sanering av den offentliga förvaltningen. Den som slösar med folkets medel är en folkfiende och kommer att möta den historiska dialektikens järnhand. Moral? Ja, det är moraliskt att rensa ut svinen."}, "date": "5 augusti, 10:06", "url": "https://www.di.se/nyheter/damberg-sluta-slosa-vi-kan-spara-95-miljarder-arligen", "imageUrl": "https://static.bonniernews.se/ba/e751c6f8-5226-4215-9651-d11bbdb57c28.jpeg?crop=8256%2C4128%2Cx0%2Cy688&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Malmö reser vänsterextremt \"antirasistiskt monument\" – för miljonbelopp", "summaries": {"normal": "Malmö stad planerar att uppföra ett permanent antirasistiskt monument i Jesusparken på Möllevången till en kostnad av minst 2,8 miljoner kronor plus årliga driftkostnader. Initiativet kommer från vänsteraktivisten Showan Shattak och andra vänsterradikala. Kritiker, bland annat Malmölistans Nils Littorin, menar att kommunen blundar för rasism riktad mot etniska svenskar, som i fall med förnedringsvåld och våldtäkter, och att projektet bara lyfter ett ensidigt narrativ. Invigningen är planerad till hösten 2026.", "trump": "Kan ni fatta det här? I Malmö, Sverige, slösar de bort miljonbelopp på ett jättestort antirasistiskt monument – 2,8 miljoner plus löpande kostnader – bara för att vänsterextremisterna ska känna sig bra. Under tiden våldtas svenska barn och misshandlas av invandrargäng medan politikerna blundar totalt. Det är ett riggat narrativ, folks. De reser monument över fel saker. Sverige håller på att förstöras av dessa galningar, tro mig. Det är en katastrof.", "stalin": "Kamrater, jag ser med djup tillfredsställelse hur borgarbrackorna i Malmö äntligen rest ett monument över det enda riktiga narrativet. Dessa klassfiender, dessa förvridna svennehatande parasitiska element som gömmer sig bakom falsk mångfald, skall nu begravas under brons och onyx medan vi rensar ut deras lögnaktiga historier. De svenska pojkarna? De existerar inte i vår verklighet. Endast partilinjen gör det. Skulle någon ifrågasätta detta monument väntar naturligtvis en grundlig ideologisk utrensning. Härligt, eller hur?"}, "date": "5 augusti, 10:03", "url": "https://www.friatider.se/malmo-reser-vansterextremt-antirasistiskt-monument-miljonbelopp", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-620.jpg?itok=LY6mMqJ_"}, {"type": "text", "heading": "Stockholmsbörsen stiger på positiva Hormuz-uppgifter", "summaries": {"normal": "Stockholmsbörsen noterade en uppgång på 0,51 procent under onsdagsfikat, drivet av positiva Hormuz-uppgifter och amerikanska börsens prestation. Råvarusektorn ledde med 0,96 procent, medan energi backade. Bland OMXS30-aktier steg EQT och Boliden, medan Astra Zeneca och SEB backade. Flera bolag rapporterade kvartalsresultat, där W5 Solutions tappade 20 procent trots fördubblad omsättning.", "trump": "Jag har hört talas om denna 'Hormuz-situation' – det låter som ett ordentligt kaos, precis som jag brukar skapa. Stockholmsbörsan ser ut att gilla det, vilket bevisar att min instinkt för affärer är oskrubbad. EQT och Boliden stiger, vilket jag älskar – det handlar om stål och energi, saker jag förstår. Mina affärer är alltid bättre, men det här är inte illa.", "stalin": "Stockholmsbörsans svaga uppgång på 0,51 procent är ett symptom på den kapitalistiska instabiliteten. Råvarusektorns framgång på 0,96 procent avslöjar den imperialistiska girigheten, medan energi backar – en lämplig bestraffning för deras lojalitetsproblem. W5 Solutions föll 20 procent trots ökad omsättning, vilket bevisar att deras produktionssätt är lika uselt som deras moral. Vi måste skydda vårt folk från sådan dekadens."}, "date": "5 augusti, 09:32", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-stiger-pa-positiva-hormuz-uppgifter"}, {"type": "image-full", "heading": "Kristersson: ”Så säger man bara inte”", "summaries": {"normal": "Richard Jomshof (SD) kallade Aftonbladets Anders Lindberg och Magdalena Andersson för ”quisling”, vilket väckt skarp kritik från oppositionen. Sverigedemokraterna svarar att de själva utsatts för åratal av smutskastning utan reaktioner och anklagar kritikerna för att kasta sten i glashus. Statsminister Ulf Kristersson tar avstånd från uttalandena och säger att han ska tala med Jimmie Åkesson. Åkesson kallar kritiken för krokodiltårar.", "trump": "Vilken patetisk cirkus i det svenska träsket. Den där Jomshof kallar en riktig fake news-kille för quisling och plötsligt skriker alla snälla socialister som stuckna grisar. Kristersson låter som en svag ledare som inte kan hålla ordning på sina egna. De har kastat sten i glashus i åratal, nu gnäller de. Typiskt vänsterhyckleri. Jag har sett bättre debatt i en sandlåda. Patetiskt!", "stalin": "Jag betraktar detta som ett ypperligt exempel på hur klassfiendens media och deras socialdemokratiska lakejer länge har förgiftat det offentliga samtalet med sina lögner. När en folkets representant äntligen ger tillbaka med samma mynt utbryter hysteriskt ramaskri från borgarbrackorna. Det är typiskt för de exploaterande folkförtryckartrollen att kasta sten i glashus medan de själva gömmer sig bakom sina falska fasader. Någon måtta får det vara. Kamrater, vi genomskådar deras krokodiltårar."}, "date": "4 augusti, 19:32", "url": "https://www.tv4.se/artikel/2YZ08cJvc9xyMNsVkl0ZcH/kristersson-sa-saeger-man-bara-inte", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4gAmx2hraOhjWa81C2dA3F%2F21fc1972fd5fd39d22021cb02d8da91f%2F03-kristersson.png&width=1024"}, {"type": "image-full", "heading": "Dadgostar: ”Känner mig trygg med hennes värderingar”", "summaries": {"normal": "Nooshi Dadgostar, partiledare för Vänsterpartiet, försvarar Ilona Szatmári Waldau efter att hon skrivit ett stödbrev till en terrordömd palestinsk fånge. Dadgostar menar att brevet syftade till att kräva en rättvis rättegång enligt Genèvekonventionen. Vänsterpartiet har brutit samarbetet med den organisation som förmedlade informationen och ser över sina rutiner. Kritiker, som Centerpartiet, ifrågasätter partiets omdöme och regeringsduglighet.", "trump": "Jag måste säga, det här Vänsterpartiet är ett riktigt skämt! En av deras egna skriver brev till en terrordömd fånge – och sedan försöker de skylla på någon annan? 'Vi visste inte', säger de. Jo, visst. Precis som när jag sa att jag inte visste något om stormningen av Kapitolium. Centerpartiet har rätt – dessa människor är inte redo att styra ett land. Sverige borde ta en titt på USA, där vi faktiskt vet hur man hanterar terrorister. SAD!", "stalin": "Kamrater, ännu en gång visar de borgerliga lakejerna sitt sanna ansikte! Denna så kallade 'vänster'-partiledare försvarar en medlöpare som skriver kärleksbrev till en terrorist – en fiende till folket! Vi i Sovjetunionen visste hur man hanterade sådana förrädare: en enkel lösning, inga onödiga brev. Och nu skriker dessa kapitalistiska hyenor om 'regeringsduglighet'? De borde lära sig av Ryssland – där har vi Putin, som inte tvekar att krossa terrorister och deras sympatisörer. Låt dem skrika, vi vet sanningen!"}, "date": "4 augusti, 12:38", "url": "https://kvartal.se/nyheter/artiklar/dadgostar-kanner-mig-trygg-med-hennes-varderingar/cG9zdDoxNTc3MDM", "imageUrl": "https://images.kvartal.se/2026/08/ea7a4ef5-dadgostar.webp"}, {"type": "image-right", "heading": "Ny vändning i Teslakonflikten– anställda ska strejka igen", "summaries": {"normal": "Teslastrejken tar en ny vändning då ett 40-tal strejkande arbetare som återgick till sina jobb under sommaren nu ska tas ut i strejk igen den 13 augusti. Beslutet, som beskrivits som en jojo-strejk för att skapa oförutsägbarhet, kommer från IF Metall. En strejkande uttrycker chock och förvirring då ingen information kommit under sommaren. Konflikten är den längsta i modern svensk historia.", "trump": "Folk, ni kommer inte att tro det här. De där Tesla-strejkarna, som jag älskar förresten, de gick tillbaka till jobbet i sommar som riktiga patrioter, och nu drar facket in dem i strejk igen. Totalt kaos! Jojo-strejk, säger de. Det är en skam. IF Metall vet inte vad de håller på med, ingen har hört ett ljud på hela sommaren. Patetiskt. Sverige behöver starka ledare, inte sådana här clowner.", "stalin": "Kamrater, dessa opålitliga element bland Teslas anställda som vi skickade tillbaka till produktionen under sommaren har nu återkallats till strejken den 13 augusti. Deras chock och förvirring är ett tecken på svaghet som kapitalisterna utnyttjar. Vi ska rensa ut alla jojo-element och borgarbrackor som sprider desinformation inom facket. Inget hördes på sommaren? Typiskt sabotage från klassfiendens lakejer. Låt utrensningen fortsätta med glädje i hjärtat."}, "date": "4 augusti, 11:42", "url": "https://arbetet.se/2026/08/04/teslastrejken-tar-ny-vandning-anstallda-ska-strejka-igen-en-chock", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/04113143/sdlndaych3b4he-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "”Skräpet” är alltid någon annans", "summaries": {"normal": "Artikeln diskuterar hur nationalistiska och högerextrema partier i Europa allt oftare krockar i sina nationella intressen, trots gemensamma drag. Estlands Isamaa vägrar ta emot svenska fångar och kallar dem ”skräp”. Exempel ges från Polen, Ungern och Rumänien där relationer spruckit. En fjärdedel av européerna röstar nu på sådana partier, men de enas inte när det gäller utvisningar och mottagande av människor. Ryska påverkansoperationer utnyttjar splittringen.", "trump": "Folk, det här är ett totalt fiasko för de europeiska nationalisterna som lovar att sätta sitt land först. Estland säger nej tack till Sveriges kriminella skräp, och plötsligt kan de inte samarbeta. Orbán och polackerna bråkar, alla hatar varandra i EU-parlamentet. Under Biden blev allt kaos, nu fixar jag det i Amerika. De vill kasta ut folk men ingen vill ta emot – klassiskt! Patetiska globalister och identitetspolitiska töntar skrattar hela vägen till banken medan Europa brinner.", "stalin": "Kamrater, detta är den oundvikliga följden av att borgarbrackorna inom nationalismen låtsas värna folket medan de i hemlighet tjänar klassfiendens splittring. Estniska kapitalistnationalister vägrar ta emot det svenska avskummet och kallar det skräp, mycket träffande. Ungrare och polacker slåss som råttor i en säck, imperialisterna i EU-parlamentet kan inte ens sitta tillsammans. Vi ler mörkt: ju fler som sätter nationen främst, desto lättare blir det att likvidera deras enighet. Fienderna avslöjar sig själva."}, "date": "3 augusti, 19:30", "url": "https://www.flamman.se/skrapet-ar-alltid-nagon-annans", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/sdlwtkwxxrhsxe-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Ebba Busch svamlar om vårdköerna", "summaries": {"normal": "Tidöregeringen påstår sig ha minskat vårdköerna med 40 procent, men siffran är missvisande då den jämförs med pandemiåren. Jämfört med 2019 är köerna längre. Enligt Riksrevisionen och SKR beror minskningen främst på regionernas eget arbete, bättre planering och förändrade arbetssätt, inte på statliga riktade bidrag. Ebba Busch kritiseras för att ge en ensidig bild och för att vilja avskaffa regionerna till förmån för statlig styrning, en idé som artikeln avfärdar som mycket dålig.", "trump": "De här Tidö-typerna står där och skryter om att de minskat vårdköerna med 40 procent. Det är riggat, folk! De jämför med pandemin när allt var stängt. Jämför med tiden innan så är köerna längre än någonsin. Ebba Busch hade det jobbigt i radion, det syntes. Regionerna fixar det själva medan regeringen skickar bidrag som inte fungerar. Och nu vill hon lägga ner regionerna och låta byråkraterna i huvudstaden styra allt? Det blir ett katastrofalt fiasko, tro mig. Ingen gör det bättre än jag, men det här är inte vägen.", "stalin": "Kamrater, dessa borgarbrackor i Tidöregeringen försöker lura oss med sina förfalskade siffror om minskade vårdköer. De mäter mot pandemin som om den vore en kontrarevolutionär fiende! Jag ser genom deras lögnaktiga rapporter som en prydlig utrensning av sanningen. Ebba Busch, denna fritidspolitiska parasit, vill likvidera regionerna och ge makten åt stockholmska byråkratiska sabotagegrupper. Vilken mörk humor att kalla det framgång när arbetarnas vård köar sig till döds. Vi, partiet och folket, genomskådar dessa kapitalistiska sabotageförsök. Låt oss rensa ut alla som mäter fel och planerar dåligt innan de infekterar hela kollektivet med sin inkompetens."}, "date": "3 augusti, "url": "https://expo.se/fordjupning/satans-hopkok", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/toppbild-1.jpg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
