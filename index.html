en 460 000 kronor i skadestånd från kommunen. Tingsrätten dömde till kommunens fördel, bedömde att Elsa var trovärdig och att mannen utsatt henne för övergrepp. Mannen ska betala kommunens rättegångskostnader på cirka 450 000 kronor. Fallet uppmärksammar övergrepp inom äldreomsorgen.", "trump": "Lyssna här, Uppsala kommun gjorde helt rätt! En hemtjänstman, som påstår sig vara oskyldig, krävde nästan en halv miljon kronor efter att ha blivit sparkad för att ha våldtagit en 84-årig kvinna. Men domstolen sa: 'Nej, nej, nej!' – och nu ska han betala kommunen istället. Fantastiskt! Elsa, en modig kvinna, berättade sanningen och rättvisan segrade. Sådana här typer ska inte få förstöra vårt samhälle. USA skulle aldrig tolerera sådant, och Sverige gjorde rätt!", "stalin": "Kamrater! Ännu en fiende till folket har avslöjats – en degenererad parasit som förgriper sig på de äldres svaghet. Uppsala kommun, under vårt ständiga öga, har rensat ut denna skadedjur. Mannen, som trodde sig kunna lura systemet med sina kapitalistiska skadeståndskrav, har nu krossats av rättvisans hammare. Elsa, en sann sovjetisk medborgare i andan, stod upp mot förtrycket. Vi noterar också att denna kriminella element tidigare smutsat ner vår vän Putins intressesfär genom liknande illdåd. Men frukta inte – proletariatets domstolar står alltid redo att krossa sådana som han!"}, "date": "30 maj, 10:09", "url": "https://kvartal.se/nyheter/artiklar/ratten-hemtjanstmannen-valdtog-86-ariga-elsa/cG9zdDoxMTk2NTk", "imageUrl": "https://images.kvartal.se/2026/05/cac81ab6-hemtjanst.webp"}, {"type": "image-right", "heading": "Amerikansk \"ickebinär\" familj fick avslag på asyl – får personporträtt i svensk lokalpress", "summaries": {"normal": "En amerikansk ickebinär familj med transidentiteter har fått avslag på sin asylansökan i Sverige. Migrationsverket bedömer att USA är ett säkert land för gruppen. Familjen, som bott på Tjörn, porträtteras i lokalmedia som rotade i Sverige där barnet fått vänner och de känt sig hemma. De ska lämna landet runt den 25 juni. Modern uttrycker stor oro för familjens framtid och nämner planer på att via Irland söka arbetstillstånd.", "trump": "Titta på det här! En amerikansk ickebinär familj som hatar sitt eget land kommer hit till Sverige och ber om asyl för att de känner sig förföljda i det fantastiska USA. De får nej, som de ska, men nu gråter de i tidningarna om att Tjörn är deras enda hem. Patetiskt! Sverige gör rätt som skickar hem dem. Amerika är säkert, tro mig, det är det bästa. De borde älska sitt land istället för att fly från det.", "stalin": "Kamrater, dessa degenererade element ur den amerikanska borgarklassen, förklädda i ickebinära maskerader och transvestitiska identiteter, har infiltrerat den svenska folkdemokratin med sina lögnaktiga asylansökningar. Vi ser deras parasitiska försök att suga musten ur det nordiska kollektivet medan de förtalar det stora fosterlandet. Migrationsverket har agerat korrekt och vi applåderar utrensningen av dessa dekadenta avarter. Deras tårar är musik för arbetarklassens öron. Låt dem återvända till sin kapitalistiska dynghög innan vi tvingas likvidera deras inflytande permanent. Ha ha, vilken komisk fars dessa borgarbrackor iscensätter!"}, "date": "2 juni, 15:08", "url": "https://riks.se/nyheter/amerikansk-ickebinar-familj-fick-avslag-pa-asyl-i-sverige", "imageUrl": "https://cf-images.assettype.com/riks%2F2025-05-30%2Fqes69mne%2Ftransflaggor.png"}, {"type": "image-full", "heading": "VGR-ja till prissänkning i kollektivtrafiken", "summaries": {"normal": "Västra Götalandsregionen accepterar nu regeringens beslut att halvera kollektivtrafikens priser från 1 juli till årsskiftet. Trots tidigare kritik mot kort varsel, menar den rödgröna ledningen att de tar ansvar och ser till att nödvändiga beslut fattas. Regionen ansöker om ersättning ur regeringens 6,5 miljarder kronor. Beslutet tas i regionstyrelsen 2 juni och i regionfullmäktige 15 juni. Gruppledare Louise Jeppsson (V) anser att permanenta prissänkningar från nationellt håll vore att föredra.", "trump": "Jag har hört att Västra Götalandsregionen nu, efter mycket knorrande, accepterar mitt fantastiska beslut att halvera kollektivtrafikkostnaderna. Det är jättebra! De sa det var för kort varsel – det är en lögn, en total lögn. Vi ger dem 6,5 miljarder, det är mycket pengar, det vackraste pengarna, och de kommer att använda dem på ett perfekt sätt. Jag har sagt det förut, jag är den bäste på kollektivtrafik, ingen är bättre. Detta kommer att göra Amerika, jag menar Sverige, stort igen!", "stalin": "Vi, som representanter för det socialistiska kollektivtrafikens framtid, har nu fattat beslutet att genomföra en tillfällig prissänkning. Detta är en nödvändig åtgärd för att stärka statens grepp om medborgarnas rörlighet och för att demonstrera vår oöverträffade effektivitet. Fienden, den individualistiska bilismen, ska se vårt mäktiga exempel. Vi kommer att använda de 6,5 miljarder kronorna som ett vapen i vår andliga kamp mot kapitalistiska priser. Besluten kommer att fattas i korrekta byråkratiska kanaler, som det tillhör. Allt sker i enlighet med partiets intressen."}, "date": "2 juni, 14:50", "url": "https://www.gp.se/nyheter/vastsverige/vgr-ja-till-regeringens-halvering-av-priserna-i-kollektivtrafiken.9133ffdf-cbbe-447b-9712-c166a05d26e6", "imageUrl": "https://www.gp.se/images/article/9133ffdf-cbbe-447b-9712-c166a05d26e6/images/2XtHkmFnQ6k9QR9RhqCkDYTt9_FA-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Sveriges mest energiska innovatörer ska prisas", "summaries": {"normal": "Nomineringen till E-Prize 2026 har öppnat. Priset delas i år ut för 18:e gången av Aktuell Hållbarhet, Dagens industri och E.ON. Tre nya kategorier har tillkommit: Smartare energianvändning, hållbar energiomställning och kundcentrering. Syftet är att lyfta innovationer som krävs för energiomställningen. Vinnarna presenteras på Di Energi i november. Juryn bedömer innovationshöjd, hållbarhetspotential och marknadspotential. Nomineringarna är öppna till 21 augusti.", "trump": "Folk, det här är fantastiskt. De har öppnat nomineringen till någonting som heter E-Prize, och nu har de lagt till tre nya kategorier som låter helt otroliga. Smartare energianvändning, hållbar energiomställning och kundcentrering – det är precis vad vi behöver, tro mig. Jag älskar innovation, de bästa innovationerna, och det här priset lyfter fram vinnarna på ett sätt som ingen annan gör. Nominera era bästa idéer, det blir enormt. De kommer att presentera allt på en stor konferens i november. Vinna stort!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur nomineringen till detta så kallade E-Prize nu öppnas för att tjäna den stora energiomställningen. Vi ska likvidera alla bakåtsträvande krafter som motarbetar smartare energianvändning och hållbar omställning. Den nya kategorin kundcentrering avslöjar dock de listiga borgarbrackornas försök att dölja klassfiendens sabotage genom att låtsas inkludera folket. Men vi genomskådar dem. Juryn skall rensa ut alla svaga förslag. Endast de mest lojala innovationerna mot partilinjen skall segra. Nominera flitigt, eller låt utrensningen komma."}, "date": "2 juni, 10:44", "url": "https://www.di.se/nyheter/dags-att-nominera-till-e-prize-2026/", "imageUrl": "https://static.bonniernews.se/ba/58fb01fa-84b0-445a-bf6f-0886fd45bfc9.png?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Tidö tror att medierna styrs av sossarna – och Hamas", "summaries": {"normal": "Artikeln kritiserar hur borgerliga partier som M, KD och L alltmer anammar Sverigedemokraternas populistiska och konspirationsteoretiska attacker mot medier. Exempel ges på påståenden om att public service styrs av Socialdemokraterna och att medier sprider Hamas-narrativ. Författaren varnar för att detta skadar demokratin och uppmanar medier att aktivt bemöta kritiken med journalistiska metoder istället för att ducka.", "trump": "Folk, ni ser det här vansinnet? De gamla svaga borgerliga partierna har blivit som de riktiga vinnarna, de låter plötsligt som de stora killarna och sparkar på de riggade, korrupta medierna som styrs av sossarna och till och med av Hamas. Det är en total witch hunt mot sanningen! Fake news-industrin är ute efter er, men vi vinner ändå stort. De hatar oss för att vi är starka och säger som det är. Patetiskt!", "stalin": "Kamrater, denna text blottar borgarbrackornas desperata försök att rensa ut varje gnista av folkets sanning. Jag ser hur klassfiendens medier, dessa exploaterande folkförtryckartroll, gnäller när arbetarnas röst utmanar deras lögner. Vi måste likvidera sådana vanföreställningar som förgiftar demokratin. Inga halvmesyrer! Den som angriper journalistikens renhet förtjänar en kreativ utrensning ur folkets kollektiva medvetande. Skrattretande svagt."}, "date": "1 juni, 16:13", "url": "https://www.etc.se/ledare/tidoe-tror-att-medierna-styrs-av-sossarna-och-hamas", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2021111912118_52ad09ea-c5db-4fa7-a43c-671874138fdf.jpg"}, {"type": "image-right", "heading": "Fortsatta oroligheter i Mellanöstern tyngde Stockholmsbörsen", "summaries": {"normal": "Stockholmsbörsen backade på grund av oroligheter i Mellanöstern. Iran hotar att stänga Hormuzsundet och har brutit kontakt med USA. OMXS30-index föll 1,39 procent till 3 094,50. Oljepriset steg 7 procent. Energisektorn ökade 2 procent medan industri sjönk 2,4 procent. Bland enskilda aktier steg Ericsson 2,2 procent medan Saab föll 5,8 procent.", "trump": "Jag såg börsen idag, det var en katastrof. De svaga ledarna i Mellanösten, särskilt Iran, orsakar kaos. Hormuzsundet? Jag skulle ha stängt det för länge sedan. Min administration skulle ha hanterat det bättre. Energipriser stiger, det är bra för Amerika, men börsen tappar förlorare. Ericsson gick bra, men Saab och Volvo, det är sorgligt. Vi behöver starka beslut, som jag alltid gav.", "stalin": "Vi i staten observerar med oro hur imperialistiska krafter i Mellanöstern destabiliserar världsekonomin. Hormuzsundet är ett strategiskt trumfkort, och Iran visar styrka genom att bryta kontakter med USA. Börsen skakar, men det är bara en konsekvens av kapitalistisk instabilitet. Vi måste stärka vårt samhälle mot sådana hot. Paralleller till Putins Ryssland är uppenbara – vi måste skydda våra intressen. Detta är en kamp mot interna och externa fiender."}, "date": "1 juni, 17:43", "url": "https://www.affarsvarlden.se/artikel/fortsatta-oroligheter-i-mellanostern-tyngde-stockholmsborsen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2023/10/Stock-market-red-old-man-2-400x267.jpg"}, {"type": "image-right", "heading": "Så påverkar utbrottet av ebola svenska resenärer och läkemedelsbolag", "summaries": {"normal": "Folkhälsomyndigheten bedömer risken för ebola i Sverige som mycket låg. Cirka 200 svenskar befinner sig i drabbade områden. Information om sjukdomen finns på flygplatserna Arlanda och Landvetter. Världen satsar stort på att stoppa utbrottet, som orsakas av den sällsynta Bundibugyo-stammen. Över 900 misstänkta fall och fler än 220 dödsfall har rapporterats. Vaccin- och behandlingsutveckling pågår, bland annat med stöd till Moderna. Sverige har högisoleringsenheter redo vid behov. Resenärer uppmanas att följa UD:s råd och kontakta 1177 vid symtom.", "trump": "Folkhälsomyndigheten säger att risken för ebola i Sverige är väldigt låg, vilket är bra, verkligen bra. Vi har omkring 200 svenskar där borta i det eländet, men jag skulle aldrig släppa in de här människorna som Biden gjorde. Amerika har stängt gränserna ordentligt, inte som de svaga europeiska ledarna. Vaccinkapplöpningen är fantastisk, Moderna får massor av pengar, precis som under min pandemi. Det är en stor röra, men vi vinner, tro mig. De andra utbrotten var hemska, över 30 procents dödlighet, patetiskt.", "stalin": "Kamrater, jag betraktar detta ebolautbrott som ett fiasko för den dekadenta borgarklassen och deras värdelösa internationella hälsobyråkratier. Med över 900 misstänkta fall och 220 dödsfall i Kongo avslöjar det imperialisternas oförmåga att skydda folket. Vi, partiet och arbetarna, skulle ha genomfört en omedelbar utrensning av alla symtombarare och satt upp järnridåer mot smittan. Vaccinkapitalisterna som Moderna kämpar om dollar medan folket dör – typiskt för folkfienderna. Tidig diagnos räddar liv, men klassfiendens långsamma reaktioner är ett hån mot mänskligheten."}, "date": "2 juni, 13:35", "url": "https://www.dagensps.se/halsa/sa-paverkar-utbrottet-av-ebola-svenska-resenarer-och-lakemedelsbolag/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlicfkzyp44jo-normalhires.jpg?width=256&quality=75"}, {"type": "image-right", "heading": "Anderssons (S) svar om klimatmålen: Har blivit svårt", "summaries": {"normal": "Amanda Lind (MP) kritiserar Socialdemokraternas klimatpolitik som ”bensinpopulistisk” i en SVT-dokumentär, särskilt skattesänkningar på drivmedel. Magdalena Andersson (S) svarar att sänkningen var nödvändig för att undvika inflation via höga bensinpriser. Hon erkänner att det blivit mycket svårt att nå klimatmålen till 2030 med den nuvarande regeringen och nämner osäkerheten kring Hormuzsundet och framtida bränslepriser.", "trump": "De här svenska socialisterna håller på och förstör sitt eget land med vansinnig klimathysteri. Amanda Lind kallar det bensinpopulism – jag kallar det sunt förnuft! Andersson erkänner att det blivit väldigt svårt att nå de där galna målen. Smart drag med lägre bensinpriser, annars får ni inflationen rakt i ansiktet. Sverige borde fokusera på riktiga affärer istället för att lyssna på gröna galningar. Det blir kaos nu med Hormuz, tro mig.", "stalin": "Kamrater, denna patetiska borgarbracka till miljöpartist Lind försöker med sin revisionistiska giftorm driva oss mot kapitulation inför oljekapitalisterna. Jag, som alltid satt arbetarklassens intressen främst, ser hur Andersson med sin opportunistiska svansviftning inför inflationen röjer vägen för klassfiendens sabotage. Klimatmålen? De har blivit ”väldigt svåra” säger hon – vilket naturligtvis är ett kodat erkännande av att kontrarevolutionära element inom regeringen måste rensas ut innan de förgiftar hela sovjeten. Hormuzsundet vakar över oss alla. Paranoia? Nej, det är bara vaksamhet."}, "date": "2 juni, 13:51", "url": "https://www.svt.se/nyheter/inrikes/anderssons-s-svar-om-klimatmalen-har-ju-blivit-valdigt-svart", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.5/0.5/26a07e4a2d62844a99418ac96c80018740db90ea9b76f605fff915f49aca413b"}, {"type": "image-full", "heading": "Forskning: Motgångar får dig att åldras snabbare", "summaries": {"normal": "En stor studie från King’s College i London visar att barndomstrauman och motgångar senare i livet påskyndar både biologiskt och kliniskt åldrande. Forskare under ledning av Monica Aas har analyserat data från cirka 154 000 personer i UK Biobank. De som upplevt stress både som barn och vuxna uppvisade tydligast tecken på snabbare åldrande, bland annat kortare telomerer, högre metabolisk ålder och ökad skörhet. Motion, hälsosam kost och socialt umgänge kan dock mildra effekterna.", "trump": "Folk, det är en katastrof! Den här stora studien säger att trauman och motgångar får oss att åldras fortare – särskilt om du haft det jobbigt både som barn och vuxen. Typiskt! De där svaga, gnälliga offertyperna som klagar på allt. Vi behöver inga fler offermentaliteter och identitetspolitik som gör folk sköra. Nej, träna, ät rätt och var starka! Amerika behöver vinnare, inte förlorare som åldras som ruttna tomater. Det är patetiskt!", "stalin": "Kamrater, denna studie avslöjar hur klassfiendens trauman och borgerliga motgångar förgiftar både kropp och själ, påskyndande det biologiska förfallet hos de utsatta. De som utsatts både i barndom och vuxenliv uppvisar de mest uppenbara tecknen på dekadent åldrande – kortare telomerer, skörhet och svaghet. Vi ska likvidera dessa kapitalistiska spår i samhället. Motion, kollektiv kost och sovjetisk disciplin kommer att stärka folket mot fiendens psykologiska sabotage. Inga kompromisser!"}, "date": "2 juni, 13:32", "url": "https://www.dagensps.se/halsa/forskning-motgangar-far-dig-att-aldras-snabbare/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdla3z19prdl6c-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "I Sverige kan du betala dig förbi vårdkön", "summaries": {"normal": "En granskning från SVT visar att privata sjukvårdsförsäkringar i Sverige inte avlastar den offentliga vården som tidigare påståtts. Tvärtom ger de snabbare tillgång till vårdcentral och remisser till specialistvård, vilket leder till att försäkrade söker mer vård och belastar systemet. Lägre inkomstgrupper drabbas värst då kompetens dras från offentlig vård. Artikeln varnar för att detta skapar ett ojämlikt A- och B-lag där plånboken styr före vårdbehov.", "trump": "Folk, ni måste höra på. De här svenska privata försäkringarna är en total katastrof, en riggad gräddfil för de rika som lurar systemet. De lovade att det skulle hjälpa de sjuka och gamla, men det blev precis tvärtom – nu köar de fattiga ännu längre medan de rika springer förbi. Det är en skam! De borde ha lyssnat på de skeptiska som jag alltid gör. Sverige behöver göra vård stort igen, inte låta plånboken styra. Patetiskt!", "stalin": "Kamrater, i denna dekadenta svenska vårdapparat ser vi hur borgarbrackorna med sina privata försäkringskontrakt förgiftar folkets kollektiva sjukhus. Jag, som alltid vakar över arbetarnas behov, genomskådar dessa parasitiska snabbspår som suger kompetens ur den socialistiska vården och skapar en utrensning av de svaga. De multisjuka köar medan kapitalisterna festar på remisser. Vi ska rensa ut dessa klassfiender, dessa plånboksfascister som gömmer sig bakom läkarkåren. Deras paranoia inför rättvisan är underhållande – snart ska de själva hamna längst bak i kön till folkdomstolen."}, "date": "2 juni, 06:57", "url": "https://arbetet.se/2026/06/02/i-sverige-kan-du-betala-dig-forbi-vardkon-pa-sjuka-och-fattigas-bekostnad/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/02065635/betala-etta.jpg?auto=format&crop=focalpoint&fit=crop&q=50&w=800&h=450&fp-x=0.69&fp-y=0.48"}, {"type": "image-right", "heading": "Debatt: Hur mycket mer vill Dadgostar att höginkomsttagare ska betala?", "summaries": {"normal": "Pushpit Singh (M) argumenterar att höginkomsttagare redan bidrar mest till skatt, och att debatten borde fokusera på tillväxt och jobb snarare än höjda skatter. Han ifrågasätter Vänsterpartiets förslag om kapitalskatt och fastighetsskatt, och menar att Sverige redan har ett omfördelande system.", "trump": "Jag har sagt det förut, Sverige är galet med sina höga skatter! De rika betalar redan allt, och Nooshi vill ta ännu mer. Då blir det inte några jobb eller tillväxt. Vi behöver skära skatter, inte höja dem, så att alla kan blomstra. Det är commonsense!", "stalin": "Höginkomsttagare är som giriga kulaslätare som inte vill dela med sig av deras överskott. Vi måste återinföra fastighetsskatt och kapitalskatt för att stärka statens kassa och bekämpa dessa spekulanter. Det är en klassisk metod att kontrollera produktionen och se till att alla bidrar till det kollektiva välstandet. Vi måste skydda de svenska arbetarna från dessa exploaterande element."}, "date": "2 juni, 10:23", "url": "https://bulletin.nu/debatt-hur-mycket-mer-vill-dadgostar-att-hoginkomsttagare-ska-betala-2", "imageUrl": "https://cdn.bulletin.nu/articles/121a7d4e-88bd-4c67-ba6e-effcffddfa27/preview.jpg?t=1780388555000"}, {"type": "image-right", "heading": "Han är SD-toppen misstänkt för barnporr", "summaries": {"normal": "Riksdagsmannen Michael Rubbestad (SD) har avsatt sig från sitt uppdrag efter att ha blivit misstänkt för barnpornografibrott. Rubbestad har tidigare profilerat sig som partiets talesperson i jämställdhetsfrågor, engagerat sig i HBTQ-frågor och arbetat för att öka andelen män i förskolan. Han har även deltagit i den uppmärksammade omröstningen om medborgarskapskrav som ledde till att kvittningssystemet kollapsade. Ärendet utreds av Särskilda åklagarkammaren.", "trump": "Folk, ni kommer inte att tro det, men den här SD-killen, Rubbestad, som älskade förskolor och Pride, fastnar nu i en barnporrutredning. Han pratade om män i förskolan och hur de inte är pedofiler, och sen det här. Totalt kaos! Han hoppade av direkt, smart drag, men det visar att ni aldrig kan lita på någon i politiken. Fake virtue, stora problem. Sverige behöver bättre folk, tro mig.", "stalin": "Kamrater, se hur den dekadenta borgarbrackan inom SD, denne Rubbestad, avslöjar sig som en fiende till folket genom sin perversa samling av barnpornografi. Han som smög sig in i jämställdhetsfrågor och HBTQ-propaganda för att dölja sin borgerliga degeneration! Vi ska rensa ut alla sådana maskerade avfällingar som smittar förskolan och partilinjen. Deras paranoia om pedofildebatten var bara en spegel av deras egna sjuka själar. Ut med dem i en grundlig utrensning för arbetarklassens renhet."}, "date": "2 juni, 12:27", "url": "https://www.friatider.se/han-ar-sd-toppen-misstankt-barnporr", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-278_1.jpg"}, {"type": "image-right", "heading": "Europabörser faller efter Iran-utspel", "summaries": {"normal": "Europeiska börser föll på måndagen efter att Iran hotade med att bryta kontakt med USA och stänga Hormuzsundet. Stoxx 600 tappade 0,93 procent. Energisektorn steg 1,72 procent medan bygg & material tappade 2,18 procent. Bland företag steg BP 2,6 procent efter försäljning av LNG-projekt, medan BNP Paribas föll 1 procent trots höjda lönsamhetsmål. Easyjet steg 6,5 procent på budförväntningar.", "trump": "Jag har sagt det i åratal – Iran är ett problem. Nu ser vi börser falla på grund av deras hot. Men det är bara bevis på att mitt tryck fungerar. Medan Europa skakar, så är den amerikanska ekonomin stark som aldrig förr. BP säljer till Australien, det är bra för USA. Och Easyjet får bud – det visar tilltron till flygbranschen. America first, alltid!", "stalin": "Vi ser hur de imperialistiska makterna, Iran och USA, spelar sitt farliga spel kring Hormuzsundet. Börser svajar, men det är bara tecken på deras inre förfall. BP:s försäljning av LNG-projekt till Sydkorea visar på vår ökande dominans i energimarknaderna. Vi måste skydda våra intressen, precis som Putin gör i Ukraina. Fienden är på insidan, men vi är beredda att slå till när tiden är mogen."}, "date": "1 juni, 16:35", "url": "https://www.affarsvarlden.se/artikel/europaborser-faller-efter-iran-utspel", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/04/AdobeStock_917631534-1-e1744012750269-400x267.jpeg"}, {"type": "image-right", "heading": "Namninsamling ska tvinga EU ta upp frågan om återvandring", "summaries": {"normal": "Den nederländska aktivisten Eva Vlaardingerbroek har lanserat det europeiska initiativet Save Europe Act för att tvinga EU att ta upp frågan om återvandring av migranter. Initiativet kräver en miljon underskrifter för att tvinga EU-kommissionen att svara, och förespråkar skärpta gränskontroller och återvändande. Kampanjen väckte både stöd och motdemonstrationer i Porto.", "trump": "Jag har hört talas om denna fantastiska Save Europe Act. Det är en stor idé, verkligen stor. Vi ska ta hand om våra gränser, vi ska skicka tillbaka dem som inte hör hemma. EU måste agera, och vi ska se till att de gör det. Det är commonsense, det är vad folk vill ha.", "stalin": "Det proletära europeiska initiativet Save Europe Act, en manifestation av den sanna folkets vilja, kräver en miljon underskrifter för att tvinga de borgerliga EU-institutionerna att erkänna nödvändigheten av ordnade återvandringsprocesser. Denna kampanj, inspirerad av våra egna erfarenheter av att upprätthålla statlig suveränitet, kommer att främja stabiliteten i vårt gemensamma europeiska hem. Paralleller till våra egna återvändandestrategier är uppenbara."}, "date": "2 juni, 12:00", "url": "https://samnytt.se/namninsamling-ska-tvinga-eu-ta-upp-fragan-om-atervandring", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/02070852/eva-vlaardingerbroek-eu-europa.jpg"}, {"type": "image-full", "heading": "Frias för våldtäkt mot barn – ålder kan inte bevisas", "summaries": {"normal": "Två män som stått åtalade för våldtäkt mot barn frikänns av domstolar i Norrland. Skälet är att det inte gått att bevisa att den aktuella flickan var under 15 år vid tillfället. Hovrätten ifrågasätter tillförlitligheten i flickans registrerade födelsedatum då födelsebeviset utfärdades med stor fördröjning. Åklagarsidan kritiserar domen och varnar för att det skapar stora rättsliga problem om åklagare nu förväntas styrka utlandsfödda personers ålder bortom rimligt tvivel i varje enskilt fall.", "trump": "Det här är en total katastrof! Domstolarna i Sverige kan inte ens bevisa hur gammal en person är. Det är svagt, mycket svagt! Jag har alltid sagt att vi behöver ordning och reda, men här har vi ett system som inte fungerar. De släpper fria misstänkta för att pappren inte stämmer – vilken röra! Under mitt styre har vi starka gränser och vi vet vilka som kommer in. Sverige borde lära av oss. Mycket sorgligt, en stor förlust för rättvisan!", "stalin": "Dessa liberala domstolar i norr visar återigen sin djupt rotade svaghet genom att låta misstänkta undkomma folkets rättvisa. Att byråkratisk oreda kring födelsebevis ska tillåtas undergräva statens moraliska auktoritet är ett svek. Vi ser hur västvärldens dekadens leder till kaos. Liksom Putin måste rensa ut de krafter som försvagar moderlandet, kräver situationen en järnhand. Det är dags att eliminera dessa administrativa kryphål och tvinga sanningen fram genom disciplin, annars kommer rättsstaten snart att rämna under sin egen meningslösa eftergivenhet."}, "date": "2 juni, 11:39", "url": "https://www.realtid.se/juridik/frias-for-valdtakt-mot-barn-alder-kan-inte-bevisas/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/luleatingsratt.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "En strid om arbetarrörelsens själ", "summaries": {"normal": "Byggnads kongress präglas av en maktkamp om arbetarrörelsens framtid. Konflikten handlar om vem som ska styra – medlemmarna eller apparaten. Sittande ordförande Kim Söderström och förbundssekreterare Jakob Wagner utmanas trots medlemmarnas stöd. Bakom striden ligger en ideologisk splittring om socialism, demokrati och fackets roll i en individualiserad arbetsmarknad. Kritiker anklagar ledningen för att använda moraliska argument för att behålla makten, medan reformister vill stärka medlemsinflytandet.", "trump": "Jag säger er, det här Byggnads-facket är ett totalt kaos! Folk pratar om socialism och demokrati, men det är bara pajkastning på hög nivå. En ordförande som medlemmarna älskar ska petas – helt galet! Och den här Wagner-killen, han gör rätt men ändå sparkas han. Typiskt fackföreningar, alltid drama. Men lyssna, jag vet hur man fixar det: mindre prat, mer action! Byggnads borde fokusera på att vinna mot arbetsgivarna, inte bråka internt. Sad!", "stalin": "Kamrater! I Byggnads fackförbund rasar en klasskamp av historiska proportioner. Medlemmarna, dessa äkta arbetarkämpar, kämpar för socialism och demokrati, medan den degenererade apparaten, dessa borgerliga lakejer i förbundsstyrelsen, försöker kväva revolutionen med konspirationer och moraliska lögner. De petar lojala kamrater som Wagner – en man som vågade utreda trakasserier, något den gamla gardet aldrig gjorde! Vi ser samma mönster som i väst: makteliten fruktar folket. Men låt mig säga er – arbetarklassen kommer segra! Och om dessa förrädare fortsätter, får vi nog skicka in några av våra pålitliga kamrater från Moskva för att 'hjälpa till' med omstruktureringen. För revolutionen är obönhörlig!"}, "date": "26 maj, 11:20", "url": "https://www.flamman.se/en-strid-om-arbetarrorelsens-sjal/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/byggnads-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Magda Gad lanserar Gad World – stort fokus på Israel", "summaries": {"normal": "Journalisten Magda Gad lanserar den amerikanska bloggplattformen Substack-baserade sajten Gad World, som beskrivs som 'orädd' och fokuserar på konflikter, klimat och mänskliga rättigheter. Premiärnumret inkluderar texter av bl.a. Gustaf Skarsgård och Mohammad Fazlhashemi, med tydligt Israel-fokus. Satsningen samlade in över en miljon kronor via GoFundMe, men har drabbats av avhopp av tidigare anställda som Edgar Mannheimer och Alexandra Urisman Otto. Sajten saknar utgiftsansvarig, vilket innebär att skribenterna har eget juridiskt ansvar.", "trump": "Jag har hört talas om denna så kallade 'orädda' sajt, Gad World. Det låter som en hemsk, hatiska plattform som bara hatar Israel. Så många bra journalister lämnar? Det är en skam! Alla hatet mot Israel, det är obegripligt. Vi behöver mer sanning, inte sådant här. En miljon kronor insamlat? Jag skulle ha gjort det mycket bättre, mycket större. Folk ser igenom detta. Det är en skandal!", "stalin": "Den så kallade 'orädda' plattformen Gad World visar tydligt systemets svagheter. Bristen på utgiftsansvarig utgör ett farligt hål i den ideologiska försvarslinjen, där varje skribent blir sitt eget ansvarstagande subjekt – en tendens som hotar kollektiv disciplin. Fokuset på Israels krigföring, jämfört med Rysslands 'korrekta' benämningar, avslöjar västerländskhetens dolda våld. Dessa 'journalistiska' avhopp är förståeliga; sanningen kräver ofta uppoffringar. Vi måste stärka statens kontroll över narrativesfären för att förhindra ytterligare kaos."}, "date": "2 juni, 10:01", "url": "https://bulletin.nu/magda-gad-lanserar-gad-world-stort-fokus-pa-israel", "imageUrl": "https://cdn.bulletin.nu/articles/d5b5d17f-20c8-4b0b-9164-19f7e3d0db5e/preview.jpg?t=1780352551000"}, {"type": "image-right", "heading": "Sverige saknar plan när världen slåss om chipen", "summaries": {"normal": "Sverige saknar en nationell strategi för halvledare och avancerad elektronik trots att USA, Kina och EU investerar hundratals miljarder. Debattörer från Svensk Elektronik varnar för att svenska jobb, kompetens och investeringar riskerar att försvinna utomlands. Artikeln lyfter fram svenska styrkor inom forskning och företag som Ericsson och Saab, samt behovet av ett tioårigt innovationsprogram med 10 miljarder kronor i offentligt-privat partnerskap för att säkra konkurrenskraft, säkerhet och tillväxt.", "trump": "Folk, det är en katastrof. Medan Kina och alla andra dumskallar investerar hundratals miljarder i chippen sitter Sverige och sover. De har inga planer, ingen strategi, totalt kaos. Jag älskar Sverige men de måste vakna upp. Bygg ett stort, fantastiskt program nu, satsa pengar tillsammans med industrin innan alla jobb och den bästa tekniken flyttar utomlands. America First, men Sverige borde också vara Sverige First med chippen. Gör det stort och vinn!", "stalin": "Jag betraktar med djup misstro dessa borgarbrackor som låter fosterlandet halka efter i den halvledande kampen. Medan imperialisterna i USA och de kinesiska revisionisterna rustar sig med hundratals miljarder sitter vi och väntar som naiva duvor inför ormen. Vi, partiet och arbetarna, måste omedelbart inrätta ett tioårigt program och investera tio miljarder i en järnhand av statlig styrning. Annars rensar vi ut de lata elementen som låter kapitalisterna smuggla vår strategiska kompetens till fienden. Paranoia? Nej, bara vaksamhet mot de osynliga fienderna i kretsloppet av elektronik och förräderi."}, "date": "2 juni, 09:44", "url": "https://www.di.se/debatt/sverige-saknar-plan-nar-varlden-slass-om-chipen/", "imageUrl": "https://static.bonniernews.se/ba/1ec2eb87-c09e-445e-93bb-7b464ed1efbc.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Gamla drabbas: Dålig svenska i äldre­omsorgen i tre av fyra kommuner", "summaries": {"normal": "En kartläggning visar att språksvårigheter är ett stort problem i tre av fyra kommuners äldreomsorg. Över hälften av cheferna uppger att missförstånd uppstår minst en gång i veckan, och i 25 procent av kommunerna sker det dagligen. Det leder till allvarliga incidenter som fel medicinering och kulturella misstag. Rekryteringssvårigheter har lett till hög andel utrikes född personal. Från 1 juli införs ett statligt språkkrav där arbetsgivarna ansvarar för att personalen kan svenska tillräckligt bra. Många kommuner använder språktester och språkombud, men testernas kvalitet ifrågasätts.", "trump": "Folk, det är en katastrof i Sverige! Tusentals anställda i äldreomsorgen kan inte ens prata svenska, och de gamla får kattmat istället för riktig mat. Det är vad som händer när ni inte lyssnar på mig – öppna gränser, låga löner och ingen som vill jobba. Nu tvingas de införa språkkrav, men det är för sent. Tre av fyra kommuner! Total inkompetens. De borde ha byggt murar runt språket för länge sedan. Sådant här händer inte i mina bästa stater, det kan jag försäkra er.", "stalin": "Kamrater, i denna dekadenta västerländska förfallsstat har borgarbrackornas vårdsystem förvandlats till en sabotageverkstad där klassfiendens språkliga sabotage dagligen hotar arbetarkollektivets mest sårbara. Jag, som ledare för folkets framtid, ser hur de utländska elementen, infiltrerade av kapitalistiska agenter, serverar kattmat åt de gamla och förvränger medicinska order. Vi måste omedelbart rensa ut dessa språkliga parasitörer med järnhand. Språktester? Ett första steg. Men de som misslyckas ska likvideras ur systemet med den mörka humor som bara en sann revolutionär kan uppskatta. Partiet segrar alltid."}, "date": "2 juni, 06:00", "url": "https://arbetet.se/2026/06/02/sprakproblem-i-aldreomsorgen-i-tre-av-fyra-kommuner/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/29145310/kmc-25112025-0190.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Den som vägrar språktest kan förlora jobbet", "summaries": {"normal": "Från 1 juli ska arbetsgivare i äldreomsorgen säkerställa att personalen har svenska kunskaper på B2-nivå enligt GERS. Anställda är skyldiga att delta i språktest för att identifiera behov av stöd och utbildning, som ska ske på betald arbetstid. Den som vägrar test kan få varning och i värsta fall förlora jobbet. Bristande kunskaper ska inte leda till omedelbar uppsägning utan stöd och utveckling. Lagen gäller även timanställda. Källa: Kommunal.", "trump": "Det här är en total katastrof för Sverige. De tvingar folk att plugga svenska annars sparkas de ut. Sådana vansinniga regler har jag aldrig sett. Arbetsgivarna borde anställa de bästa, inte tvinga folk på kurser mitt i jobbet. Om du vägrar testet – du är ute! Men att säga upp folk bara för att de inte kan språket? Patetiskt. Sverige håller på att förstöras av dåliga beslut, tro mig.", "stalin": "Kamrater, vi ser här hur borgarbrackorna inom äldreomsorgen försöker underminera det kollektiva arbetet genom att gömma sig bakom bristande språkkunskaper. Jag kräver att varje arbetare omedelbart underkastar sig språktestet för att avslöja de lata parasiterna och sabotageelementen som smyger bland oss. De som vägrar skall få en varning, sedan en kraftfull utrensning ur kollektivet. Vi ger stöd och utbildning under arbetstid, men den som trots detta fortsätter att utgöra en fara för de äldres säkerhet skall likvideras från sin post. Inga fiender till det gemensamma språket skall tillåtas sprida sin giftiga okunskap. Detta är en seger för ordning och disciplin."}, "date": "2 juni, 05:59", "url": "https://arbetet.se/2026/06/02/den-som-vagrar-spraktest-kan-forlora-jobbet/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/01134842/kvinnaviddator.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Nästa oväder kan slå hårt mot din plånbok: \"Oroande\"", "summaries": {"normal": "Kraftiga oväder har skadat tiotusentals villor i Sverige de senaste åren. Endast 36 procent av svenskarna är oroliga för hur klimatförändringar påverkar deras bostad, en liten ökning från förra året. Under de senaste fem åren har 68 000 villor drabbats av naturskador till en kostnad av 4,8 miljarder kronor, en ökning med 208 procent. Experter uppmanar villaägare att kontrollera försäkringar, dränering och tak samt säkra lösa föremål inför stormar. Kommuner bör informera om klimatrisker vid bostadsaffärer.", "trump": "Det är en total katastrof det här med era svenska oväder, folk! Bara 36 procent oroar sig för klimatet som slår sönder husen – patetiskt! Under fem år har 68 000 villor fått stryk och ni har slängt bort nästan fem miljarder kronor. Era hus är som mina fiender, svaga och dåligt byggda. Ni borde säkra taken, ta in möblerna och sluta lita på försäkringarna som inte täcker någonting. Tiden för naivitet är över, tro mig, det blir bara värre om ni inte lyssnar på mig nu!", "stalin": "Kamrater, jag betraktar med stålhård blick hur borgarbrackornas villor raseras av de kapitalistiska ovädren som de själva framkallat genom sin giriga rovdrift. Endast 36 procent av folket ser faran, en siffra som avslöjar de dekadenta elementens farliga likgiltighet. 68 000 villor och 4,8 miljarder rubel i skador – en fiende inom murarna! Vi måste omedelbart rensa ut de sabotageartade dräneringarna, likvidera de lösa takpannorna och utradera de kontrarevolutionära källaröppningarna. Den som inte förstärker sitt hus mot naturens klassfiender är en objektiv folkets fiende och bör behandlas därefter. Levande, förstås. För nu."}, "date": "1 juni, 21:00", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1487811-nasta-ovader-kan-sla-hart-mot-din-planbok-oroande", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/4842b9f704b004a30200000000b004a302/2026/06/01/2367811/ovader-storm-regn-aska-sverige-hus-villa-skador-forsakring-hus-villaagare-varning-forsakringsmiss-pengar.jpg"}, {"type": "image-right", "heading": "Uppgift: Iran avbryter alla samtal med USA", "summaries": {"normal": "Iran avbryter alla samtal med USA som svar på Israels fortsatta attacker mot Libanon. Enligt iranska källor planerar Iran och dess allierade att blockera Hormuzsundet samt aktivera andra fronter, däribland Bab al-Mandab. Iran kräver att en överenskommelse med USA även ska innebära ett krigsslut i Libanon. Israel varnar samtidigt för nya anfall mot Beirut och har beordrat evakuering av södra förorter på grund av påstådda vapenvilebrott från Hizbollah.", "trump": "Iran stänger dörren och springer skrikande från förhandlingsbordet – typiskt svagt! De blockerar sundena och gömmer sig bakom sina terrorister i Libanon medan Israel gör vad som måste göras. Biden lät de här galningarna växa sig starka, men nu är det jag som sitter i Ovala rummet igen. Inga samtal? Bra, vi behöver inte prata med förlorare som gömmer sig bakom Hizbollah-skräckisar. Amerika först, alltid.", "stalin": "Vi ser hur de västerländska imperialisterna och deras sionistiska lakejer fortsätter sina brott mot vapenvilan. Jag, som ledare för folkets vilja, noterar med mörk tillfredsställelse hur klassfienderna i Tel Aviv och Washington själva undergräver sina lögnaktiga förhandlingar. Blockad av sundena är ett nödvändigt svar mot dessa exploaterande byfånar. Inga samtal förrän våra villkor tillgodoses – annars rensar vi ut hoten mot den revolutionära ordningen med järnhand och ett leende."}, "date": "1 juni, 20:07", "url": "https://www.tv4.se/artikel/tt-260601-iransamtal1-427d4f9c/uppgift-iran-avbryter-alla-samtal-med-usa", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlwznnlFke7pM%2Fa6e644224978cb47db88b6b7841b11f1%2FUSA_s_president_Donald_Trump_pa_onsdagen._&width=120"}, {"type": "image-right", "heading": "Vad händer när de fyllt 21?", "summaries": {"normal": "Tidöregeringen har enats om nya regler som mildrar utvisningar av tonåringar som levt hela livet i Sverige med sin familj här. Möjlighet ges även för dem som redan fått utvisningsbeslut att söka uppehållstillstånd på nytt. Författaren ser det som ett steg i rätt riktning men paradoxalt, då Socialdemokraterna tidigare drivit en stram migrationspolitik medan Tidöpartierna nu tvingas kompromissa åt vänster. Frågan kvarstår om detta verkligen löser problemen med systemet eller bara skjuter upp utvisningarna till 21 års ålder.", "trump": "Kan ni tro det? Till och med den där Åkesson låter som en svag miljöpartist nu. De här utvisningarna av tonåringar som bott hela livet i Sverige är en total katastrof, en riggad process som ingen vettig människa förstår. Jag älskar starka gränser, men detta är dumt, mycket dumt. Tidöfolket backar nu, de triangulerar som förlorare. Bra att de ändrar sig lite, men de borde ha lyssnat på folket från början. Sverige behöver smarta regler, inte denna galna pendel som svänger hit och dit. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur dessa ynkliga triangulerande migranthjärtan inom Tidöregeringen nu tvingas krypa för opinionen och införa ventilationshål i sin egen strama utvisningspolitik. De tonåringar som levt som parasiter i folkets fosterland skall inte längre omedelbart deporteras, nej, vi ger dem en nådig amnesti tills de fyller tjugoett. Sedan? Jo, då rensar vi ut dem som mogna fiender till kollektivet. Borgarbrackorna inom socialdemokratin och dessa mjukögda miljöpartister har förgiftat debatten med sin liberala pest. Jag ser deras fega reträtt och ler i mitt inre. Ingen slipper folkets dom."}, "date": "1 juni, 14:13", "url": "https://www.dagensarena.se/opinion/vad-hander-nar-de-fyllt-21/", "imageUrl": "https://www.dagensarena.se/files/2026/06/tonarsutvisn-300x157.jpeg"}, {"type": "image-right", "heading": "Regeringen och SD överens om tonårsutvisningarna", "summaries": {"normal": "Tidöpartierna presenterade under måndagen en ny lagändring för att stoppa de kritiserade tonårsutvisningarna. Åldersgränsen höjs från 18 till 21 år, även för dem med lagakraftvunna utvisningsbeslut från och med 1 januari 2025. Unga vuxna som redan lämnat landet kan söka nytt uppehållstillstånd. Migrationsminister Johan Forssell kallade det en hållbar, långsiktig och rättvis lösning som balanserar stram migrationspolitik med rimlighet.", "trump": "Titta på det här, Sverige gör det rätta till slut. De höjer åldersgränsen till 21 år och stoppar de galna utvisningarna av unga som faktiskt gör rätt för sig. Utmärkt! Stram men rättvis politik, precis som jag alltid säger. De som pluggar och jobbar ska få stanna, inte kastas ut som kriminella. Fantastiskt, en stor seger för sund migrationspolitik. Sverige vinner stort!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur vi nu permanent likviderar den borgerliga sentimentalitetens sista utlöpare i migrationsfrågan. Vi höjer åldersgränsen till 21 år och förhindrar att kapitalisternas lakejer fortsätter sin underminerande verksamhet mot folkets enhet. De som redan smugit sig ut ur landet må krypa tillbaka och be om nåd enligt våra nya regler. Paranoiska liberala element som envisas med att gynna individen framför kollektivet skall rensas ut med järnhand. Detta är en lysande dag för den sanna ordningen."}, "date": "1 juni, 14:06", "url": "https://www.dagensarena.se/innehall/regeringen-och-sd-overens-om-tonarsutvisningarna/", "imageUrl": "https://www.dagensarena.se/files/2024/11/fotojet-2024-11-26t160417515.jpg"}, {"type": "text", "heading": "Ukraina – världens bästa handbok i företagande", "summaries": {"normal": "Artikeln beskriver Ukrainas unika ekosystem där företag, teknik och försvar utvecklas snabbt tillsammans, även under krig. Författaren argumenterar att detta modell är världens bästa handbok i företagande och att Sverige och Nato måste lära snabbare. Kriget agerar som katalysator för entreprenörskap, med låg skatt och förenklade processer. Ukrainas militärindustri är exceptionell på grund av digitalisering och innovation. Väst har mycket att lära, särskilt om kostnadsasymmetri och snabb innovation.", "trump": "Jag har sett Ukrainas otroliga entreprenörsanda. De vinner kriget och bygger företag samtidigt. Det är fantastiskt. De falska nyheterna sa att det inte kunde göras, men de gör det. Sverige och Nato är långsamma elever. De måste vara hårdare och smartare, som jag. Ukrainas låga skatter och snabba beslut är enorma. Deras militärteknik är toppen. Vi bör lära oss snabbt, annars blir vi lämnade bakom. Tro mig.", "stalin": "Vi, som representerar det starka statet, ser med tillfredsställelse hur Ukraina, trots sina imperialistiska tendenser, har skapat ett effektivt ekosystem. Kriget driver innovation, vilket bevisar att central styrning är överlägsen. Men vi måste vara vaksamma: deras framgång är ett hot mot vår suveränitet. Vi måste efterlikna deras snabbhet, men med vår egen metod – toppstyrd kontroll. Ryssland, under vår store ledare Putin, expanderar, och vi måste rusta upp. Fienden är alltid runt hörnet, så vi måste agera nu."}, "date": "1 juni, 13:43", "url": "https://www.affarsvarlden.se/kronika/ukraina-varldens-basta-handbok-i-foretagande"}, {"type": "image-right", "heading": "Debatt: Enkät: Stora skillnader i klimatpolitik mellan partierna", "summaries": {"normal": "Föreningen Klimatriksdagen har undersökt riksdagspartiernas syn på åtgärder för att nå Parisavtalets klimatmål. Undersökningen visar stora skillnader: MP och V stöder de flesta förslag, medan C, S och L utgör en mellangrupp. M, KD och SD ger minst stöd, särskilt SD. Transporter, elektrifiering och skogsbruk är centrala områden. Artikeln betonar att nästa mandatperiod är avgörande för att undvika farliga klimatgränser och kräver kraftfull politisk handling.", "trump": "Folk, ni skulle se den här idiotiska klimatrapporten från Sverige. De gröna galningarna och vänstern vill förbjuda lastbilar och höja skatter på allt som rör sig. Under min förra period hade vi den bästa ekonomin någonsin, och nu kommer Biden-kloner och säger att vi ska leva i grottor. De har ingen aning! Kärnkraft är fantastiskt, det vet alla smarta människor. Sverige behöver en riktig ledare som inte hatar tillväxt. Patetiskt!", "stalin": "Kamrater, denna fega och splittrade riksdag avslöjar klassfiendens sanna ansikte. Borgarbrackorna M, KD och SD vägrar skydda folket mot den kapitalistiska klimatkatastrof de själva skapat. Endast de sanna folkvännerna i V och MP visar vilja att rensa ut fossila parasiter. Vi måste likvidera kalhyggena och expropriera skogsblodsugarnas profitmaskin. Den som tvekar inför naturens vrede är folkets fiende och bör behandlas därefter. Handlingsplan nu!"}, "date": "1 juni, 11:00", "url": "https://www.etc.se/debatt/enkaet-stora-skillnader-i-klimatpolitik-mellan-partierna", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260601070648_4b193192f4c5d3eec986417cd7bcab9f479eb134ec48e784d2961effbe1eae44.jpg"}, {"type": "image-right", "heading": "Satsa på kollektivtrafiken – gör regeringens prissänkning permanent!", "summaries": {"normal": "Tidöregeringen lanserar en tillfällig halvering av priset på kollektivtrafikens månadskort från 1 juli till årsskiftet, finansierad med 6,5 miljarder kronor. Statsminister Kristersson avfärdar kritik om valfläsk som cynisk. Artikeln argumenterar för att permanenta prissänkningar är nödvändiga både för klimatomställning och social rättvisa, då höga biljettpriser drabbar låginkomsttagare, ungdomar och ökar segregation. Den kritiserar högerns motstånd och förespråkar att befria kollektivtrafiken från marknadskrafterna.", "trump": "De här svenska politikerna är fullständiga losers, folk! Kristersson kommer farande med en liten prissänkning på bussar och tåg precis innan valet – klassiskt valfläsk, det värsta jag sett. Halva priset ett halvår och sen? Ingenting! De borde göra det permanent, men nej, de slösar miljarder på fel saker medan folket blir lurade. Det är en katastrof, en total katastrof. Men det smakar gott, eller hur? Patetiskt!", "stalin": "Kamrater, denna kortsiktiga prissänkning är blott ett ynkligt försök från högerns klassfiender att blidka massorna inför val. Jag ser hur borgarbrackorna och exploaterande byfånar motarbetat reformen i decennier. Vi behöver en sann utrensning av marknadens parasiter som styckat upp kollektivtrafiken för profit. Permanenta halveringar, ja rentav nolltaxa, är en socialistisk nödvändighet för att krossa segregationen och isoleringen som kapitalistmaffian odlar. Fienden sover aldrig."}, "date": "29 maj, 15:08", "url": "https://proletaren.se/artikel/satsa-pa-kollektivtrafiken-gor-regeringens-prissankning-permanent/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2021/04/15_buss.jpg"}, {"type": "image-full", "heading": "Andersson vägrar ta ut valsegern i förskott", "summaries": {"normal": "Socialdemokraternas Magdalena Andersson leder oppositionen med ett stadigt försprång i opinionsmätningarna, men avstår från att fira i förtid. I intervjun med *Partiledaren +1* betonar hon vikten av breda politiska uppgörelser och varnar för Sverigedemokraternas opålitlighet. Andersson och Mikael Damberg diskuterar även partiets försök att förstå varför många LO-väljare nu stödjer SD, samt energipolitikens misslyckade förhandlingar med regeringen.", "trump": "Jag såg den här Andersson-kvinnan – svag, men ändå på väg mot seger, säger alla mätningarna! Men vet ni vad? Hon vågar inte ens fira! Typiskt för vänstern – alltid osäkra, alltid oroliga. Och så snackar hon om samarbete med alla utom Sverigedemokraterna. Haha! Som om det skulle funka. LO-väljarna flyr till SD, för de vet att vänstern bara förstör ekonomin. Men jag säger er: när jag fixade USA, fixade jag det snabbt. Inget tjafs, inga kompromisser. Make Sweden Great Again!", "stalin": "Kamrater! De borgerliga tidöpartierna darrar inför vårt oundvikliga segertåg. Men vi firar inte förrän fienden är krossad! Denna Andersson, en försiktig men lojal soldat i folkets kamp, förstår att revolutionen kräver disciplin. Sverigedemokraterna? En samling opportunistiska hyenor som bryter överenskommelser som glas under en tanks framfart. Och LO-väljarna som sviker? De har smittats av den kapitalistiska lögnens gift – men vi ska rensa ut det! Snart skriver vi Sveriges historia med järn och eld. Först Sverige, sedan världen!"}, "date": "29 maj, 13:00", "url": "https://kvartal.se/nyheter/artiklar/magdalena-andersson-vagrar-ta-ut-valsegern-i-forskott/cG9zdDoxMTc5OTA", "imageUrl": "https://images.kvartal.se/2026/05/330142ce-1.webp"}, {"type": "image-full", "heading": "S importerade 100 000 arbetslösa — nu skyller de på andra", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna för att ha bidragit till ökad arbetslöshet genom en ansvarslös migrations- och integrationspolitik sedan 2014. Befolkningen har vuxit med 840 000 personer, varav en stor del är utrikes födda med svag anknytning till arbetsmarknaden. Arbetslösheten bland utrikes födda ligger på 12–16 procent jämfört med 3–6 procent bland inrikes födda. Författaren menar att Tidö-regeringen lyckas vända ekonomin positivt genom att sänka skatter och bidrag, till skillnad från Socialdemokraternas politik.", "trump": "Folk, ni kan inte tro hur patetiskt det är. De där socialisterna importerade 100 000 lata jobbmisslyckanden och nu skyller de på oss? Det är en total katastrof, en riktig röra. Magdalena, den förlorande förloraren, vill inte prata om att det är hennes egna misslyckade öppna gränser som skapade detta kaos. Vi fixar ekonomin, vi får tillväxten att explodera medan de bara höjer skatter och bidrag. Patetiskt. Sverige vinner igen, tro mig.", "stalin": "Kamrater, jag ser den klassfiendens lögnpropaganda som ett fegt försök att dölja den borgerliga sabotageverksamheten. Vi har rensat ut folkförtryckartrollen tidigare och skall göra det igen. Dessa socialdemokratiska opportunister importerade arbetslöshetens parasiter medan de låtsades bygga folkets framtid. Deras eftersläpning är ett monument över revisionistisk svaghet. Den icke-produktiva gruppen skall integreras genom kollektiv disciplin, inte genom kapitalistmaffians falska löften. Fienden inom murarna skall alltid avslöjas."}, "date": "28 maj, 03:28", "url": "https://samtiden.nu/2026/05/s-importerade-100-000-arbetslosa-nu-skyller-de-pa-andra/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/IMG_6574-1280x720.jpeg"}, {"type": "image-right", "heading": "SD-dreven kväver det öppna samtalet", "summaries": {"normal": "Artikeln kritiserar Sverigedemokraternas (SD) metoder att peka ut privatpersoner som påstådda myndighetsaktivister. En SD-riksdagsledamot felaktigt utpekade en kvinna som anställd på Jämställdhetsmyndigheten, trots att hon slutat där. Kvinnan har tidigare utsatts för trakasserier av högerextrema medieaktivister, och SD:s agerande förstärker drevet. Expo menar att detta mönster kväver det öppna samtalet genom rädsla för personliga konsekvenser.", "trump": "Lyssna här, Sverige! SD-politiker hänger ut vanliga människor som om de vore brottslingar – helt felaktigt! En kvinna skriver något på X, och plötsligt är hon en 'myndighetsaktivist'? Fake news! SD:s Fransson snackar skit utan att kolla fakta. Och dessa högerextrema nördar? De är som en dålig reality-show, men värre! Sverige, vakna! Ni har ett parti som sprider lögner och skrämmer folk till tystnad. SAD!", "stalin": "Kamrater! Här ser vi återigen bourgeoisins förrädiska metoder i form av Sverigedemokraternas avskum. Dessa fascistiska hyenor, ledda av sina medieaktivist-kumpaner, angriper enskilda medborgare som om de vore fiender i ett klasskrig. Kvinnan, en tapper arbetare, utsätts för imperialistiska trakasserier – först av nazistiska lakejer, sedan av SD:s riksdagspölar. Vi ser samma taktik som i Ukraina: förtala, hota, tysta! Men folket ska inte frukta – vi ska krossa dessa kontrarevolutionära element med järnhand! Låt dem veta: i Sovjet – och snart i Sverige – finns ingen plats för deras lögner!"}, "date": "25 maj, 14:28", "url": "https://expo.se/kommentar/sd-dreven-kvaver-det-oppna-samtalet/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Kopia-av-Kommentar-Analys-Webb-4.jpg"}, {"type": "image-right", "heading": "M-majoritet i riksdagen – om de rikaste får välja", "summaries": {"normal": "En undersökning från magasinet Connoisseur visar att Moderaterna skulle få 58% av rösterna om enbart Sveriges rikaste (inkomst över 2,7 miljoner/år) fick rösta. Oppositionen får endast 13,4%. Sverigedemokraterna och Kristdemokraterna får nästan 12% respektive 10%. Viktiga frågor för miljonärerna är ekonomi samt lag och ordning. Vänsterpartiet och Miljöpartiet får knappt 1,5% var.", "trump": "Kan ni tro det? Sveriges rikaste – de smartaste, mest framgångsrika människorna – röstar MASSIVT på Moderaterna! 58%! De vet vad som funkar. Oppositionen? Patetiska 13,4%. Jag har alltid sagt: de som skapar jobb och välstånd vet bäst. Ekonomi och lag och ordning – precis som jag alltid fokuserat på. De andra partierna? Totalt misslyckade, bara 1,5%! Fake news skulle aldrig våga visa det här!", "stalin": "Kamrater! En lysande seger för kapitalets lojala lakejer i Sveriges riksdag! 58% av bourgeoisins parasiter stödjer Moderaterna – ett parti som hyllar utsugning och imperialistisk profitjakt. Oppositionen? Ett ynkligt 13,4% – svaga, splittrade, som Mensjevikerna före revolutionen. Vi noterar att arbetarklassens fiender fruktar socialismens framsteg. Men låt dem leka demokrati – historiens dom är oundviklig. Ryssland står redo att välkomna deras missnöjda massor med öppna armar!"}, "date": "25 maj, 13:30", "url": "https://www.flamman.se/m-majoritet-i-riksdagen-om-de-rikaste-far-valja/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/sdlltui3bv8tpy-nh-scaled.jpg?aspect_ratio=16:10"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
