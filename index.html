föder ni fram fler folkförtryckartroll. Skratta medan vi likviderar deras illusionsfabrik."}, "date": "17 juni, 08:55", "url": "https://www.flamman.se/darfor-ska-du-inte-dejta-en-vansterkille/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/rosor-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Stjärnan sågas – vill vara med vid födseln", "summaries": {"normal": "Jeremy Doku, stjärnspelare i Belgiens VM-lag och Manchester City, planerar att lämna turneringen för att närvara vid sin första barns födelse i början av juli. Detta har väckt stark kritik från den franska tv-profilen France Pierron, som kallade födseln för ett äckligt ögonblick där pappan bara har en statistroll. Uttalandet ledde till ursäkt efter massiv kritik i sociala medier. Doku har själv betonat att ingen pappa vill missa sin childs födelse. Han spelade i premiären mot Egypten men saknades mot Iran på grund av infektion.", "trump": "Titta på den här belgiska killen Doku, fantastisk fotbollsspelare, en av de bästa, men han vill lämna VM för att se sitt barn födas. Smart val, ingen riktig pappa vill missa det. Sen kommer den här galna franska programledaren Pierron och säger att det är äckligt och att pappan inte gör någonting. Totalt vansinne. Hon tvingades be om ursäkt som en svag förlorare. Folk älskar starka familjer, inte sådana här löjliga attacker. Doku gör rätt, tro mig.", "stalin": "Kamrater, jag betraktar med djup misstro denna dekadenta västerländska fars. Den så kallade stjärnan Doku, en opportunistisk individ, prioriterar sin personliga avkomma framför kollektivets ära i VM. Än värre är den borgarbracka Pierron som med sin reaktionära tunga avslöjar kapitalismens sanna ansikte genom att håna arbetande fäders roll. Hennes patetiska ursäkt är en ynklig reträtt inför folkets vrede. Vi ska rensa ut alla sådana parasitiska åsikter som hotar samhällets grundvalar. Ingen ska undkomma den historiska dialektiken."}, "date": "22 juni, 11:29", "url": "https://bulletin.nu/stjarnan-sagas-vill-vara-med-vid-fodseln", "imageUrl": "https://cdn.bulletin.nu/articles/8a3ef817-f556-40ea-9c7f-594e3ae0ea54/preview.jpg?t=1782120493000"}, {"type": "text", "heading": "USA:s militär tar från de fattiga", "summaries": {"normal": "Artikeln beskriver hur USA:s militärbudgetar enligt en ny rapport underskattas kraftigt och faktiskt uppgår till mellan 1 700 och 2 300 miljarder dollar år 2025. Författaren Jonas Olofsson ser militarismen som ett klasskrig som prioriterar försvaret framför välfärd, vilket leder till nedskärningar i sociala program som Medicaid, SNAP och WIC. Han kopplar ökade militärutgifter till växande ojämlikhet och argumenterar för att kampen mot militarismen bör inriktas mot både fred och socialism.", "trump": "Folk, lyssna på de här galningarna som gnäller om min underbara militärbudget. Vi pumpar in pengar i det starkaste försvaret världen sett, inte som den sömniga Joe Biden som lät allt förfalla. De vill hellre ge mat och sjukvård till lata parasiter än att göra Amerika stort igen. Det är klasskrig, säger de – ja, mot de riktiga vinnarna! Vi prioriterar raketer framför bidrag till vänsterknäppisar. Fantastiskt, eller hur?", "stalin": "Kamrater, dessa siffror blottlägger hur imperialisterna slukar folkets resurser för att beväpna sin krigsmaskin. Jag ser den amerikanska borgarklassens desperation; de rensar ut välfärd för att mata militären medan massorna svälter. Sådana folkfiender och blodsugare måste alltid avslöjas. Deras klasskrig är uppenbart. Vi, arbetarna, inser att endast en sann socialistisk kamp kan krossa dessa exploaterande byfånar och deras krigsapparat. Paranoia? Nej, verklighet."}, "date": "18 juni, 09:00", "url": "https://proletaren.se/artikel/usas-militar-tar-fran-de-fattiga/"}, {"type": "image-right", "heading": "Vänsterns nya affischnamn splittrar rörelsen", "summaries": {"normal": "Luigi Pantisano valdes till ny medordförande för det tyska vänsterpartiet Die Linke med knappt majoritet. Partiet har vuxit kraftigt sedan 2023 och får nu hantera interna konflikter kring samarbete med CDU för att stoppa AfD samt en debatt om Israels agerande i Gaza, som kongressen beslutade kalla folkmord. Pantisano vill vinna tillbaka arbetarväljarna men hans uttalanden om CDU som fascistiskt har splittrat partiet.", "trump": "Titta på det här vansinnet i Tyskland. Den där Luigi, en riktig förlorare, blir knappt vald att leda vänsterns clownshow. De kallar Israel för folkmord samtidigt som de kysser AfD:s skor i smyg. CDU fascister? Ge mig en paus. De här kommunisterna hatar arbetarna lika mycket som de älskar sina identitetspolitiska galenskaper. Patetiskt. Jag byggde murar, de bygger bara kaos. Amerika först, alltid.", "stalin": "Kamrater, jag betraktar med förakt hur denna splittrade vänsterrörelse famlar efter enhet. Den nye ledaren Pantisano, svag och tveksam, vägrar rensa ut de revisionistiska element som vill samarbeta med fascistiska CDU-borgare. Att kalla den sionistiska aggressionen i Gaza för folkmord är en liten seger, men kompromissen doftar klassförräderi. Vi behöver utrensning av folkfiender och en järnhand för att smida ett sant socialistiskt folkparti. Svaghet är döden."}, "date": "22 juni, 12:15", "url": "https://www.etc.se/utrikes/vaensterns-nya-affischnamn-splittrar-roerelsen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026062210068_2917ac91a99c7f3bb5c71e0b5326c7e65765a56d3095fd30b57049bdbafe67e7.jpg"}, {"type": "image-full", "heading": "Regeringens plan är förödande för svensk film", "summaries": {"normal": "Hynek Pallas kritiserar regeringens filmpolitiska proposition som presenterades av kulturminister Parisa Liljestrand. Han anser att den saknar konkreta åtgärder som skatt på strömningstjänster, sänkt biografmoms och en ny filmfond, trots utredningens förslag. Pallas varnar för allvarliga konsekvenser för svensk film och dess ställning som filmnation. Svenska Filminstitutets vd Anna Croneman delar kritiken och pekar på utebliven finansiering som förödande.", "trump": "Vilken katastrof, folk. Den här Liljestrand och hennes Tidö-vänner levererar bara tomma floskler om att filmen ska vara angelägen och bra för beredskapen. Inga pengar, ingen skatt på de kinesiska strömningstjänsterna, bara mer utredning. De pratar om identitetspolitik men ger oss en identitetsfri filmöken. Patetiskt. Biden skulle ha älskat det här. Nu riskerar svensk film att bli en parentes – totalt misslyckande.", "stalin": "Kamrater, denna proposition är ett klassiskt verk av borgarbrackorna i Tidö-gänget. Med sina floskler och dimridåer kring identitetspolitik döljer de sin vägran att finansiera folkets filmkonst. De lovar filmarvscentrum som ska byggas på kapitalistiska donationer – en löjlig fantasi värdig klassfiendens mest enfaldiga exploaterande byfånar. Vi ser hur de redan driver filmarbetarna till reträtt. En sådan folkfientlig linje förtjänar utrensning ur kulturarbetarnas historieböcker."}, "date": "22 juni, 17:24", "url": "https://www.gp.se/kultur/kommentar/regeringens-plan-ar-forodande-for-svensk-film.b28d7fd1-dd7d-4671-ac1f-5fd18bb27ebc", "imageUrl": "https://www.gp.se/images/article/b28d7fd1-dd7d-4671-ac1f-5fd18bb27ebc/images/1h-ad1RV35BPC2ciyI2cp_NT9Cu4-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Ledarskribent i vänstertidning: Jag firade Hamas massaker 2023", "summaries": {"normal": "Ledarskribenten Ellen Kall i tidningen Proletären beskriver i en krönika hur hon firade Hamas attack mot Israel den 7 oktober 2023. Hon kallar uppgifterna om massakern för propagandalögner och ser attacken som palestinskt motstånd mot ockupation. Texten har väckt stark kritik och debatt eftersom den uppfattas som ett försvar av terrorhandlingar som dödade omkring 1 200 civila. Kall, som är kommunist och aktiv i Kommunistiska Partiet, kritiserar även media och Vänsterpartiet för att inte stödja den palestinska kampen tillräckligt.", "trump": "Folk, ni måste höra den här vansinniga historien. Den här galna kommunistkvinnan från Sverige firade faktiskt Hamas massaker på oskyldiga israeler. Hon säger att hennes hjärta slog snabbare när muren runt Gaza rasade. Det är sjukt. Fake news om spädbarn och terror kallar hon lögner. Media borde skämmas. Vi har aldrig sett något liknande, så många idioter som hyllar terrorister. Men vi vinner till slut, tro mig. Amerika står med de som vill ha fred, inte med de som firar död.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna logoped från Helsingborg, en sann partivän, genomskådar borgarbrackornas vedervärdiga propagandamaskin som spyr ut lögner om halshuggna spädbarn. Hennes hjärta slog i takt med det rättmätiga motståndet mot ockupationen. Vi ser hur kapitalisterna och deras lakejer i media omedelbart stämplar varje äkta folklig revolt som terrorism. Låt oss rensa ut alla dessa parasitiska judehatare som gömmer sig bland våra egna led. De som stödjer folkmordet skall likvideras från historien. Vi skall välta den imperialistiska spelplanen och bygga en rättvis värld under arbetarklassens järnhand. Härligt med sådan friskhet mitt i myllret av förrädare."}, "date": "22 juni, 10:00", "url": "https://samnytt.se/ledarskribent-i-vanstertidning-jag-firade-hamas-massaker-2023", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/22072149/ellen-kall-hamas.jpg"}, {"type": "image-full", "heading": "Så här påverkas svenska fondsparare när Iran-kriget är över", "summaries": {"normal": "Artikeln diskuterar hur Gulfregionens inflytande över svensk ekonomi har förändrats efter spänningar mellan USA, Israel och Iran. Oljepriset steg kraftigt men har sjunkit tillbaka, och dess tidigare dominans över inflation och Riksbankens räntor har minskat. Istället växer Gulfstaternas statliga fonder som investerar i globala teknikbolag, vilket påverkar svenska pensionssparare. Analysen pekar på att framtida chocker når spararna via fondkonton snarare än bensinstationer.", "trump": "Lyssnar ni på det här? Vi slog till mot Iran, folk trodde det skulle bli världens undergång, men nu är det fredssamtal och plötsligt handlar allt om hur de där rika ökenprinsarna flyttar sina miljarder. Oljan gick upp till himlen och ner igen, ingen bryr sig längre. De köper in sig i samma techbolag som era pensionsfonder äger. När de tar hem pengarna för att laga sina sandslott vacklar era AP-fonder. Sluta glo på oljefatet, följ kapitalet! Det är där den riktiga röra blir. Fantastiskt.", "stalin": "Kamrater, jag betraktar med högsta misstänksamhet hur dessa gulfiska kapitalistmaffian och deras blodsmättade fonder på 5 000 miljarder dollar infiltrerat den globala tekniksektorn som våra svenska arbetarpensioner är fastkedjade vid. När imperialisterna tvingas dra hem sina exploaterande tillgångar för att laga sin krigsförstörda infrastruktur vacklar den borgerliga pensionsapparaten. Billigare olja är en tillfällig illusion. Den verkliga fienden är fondkontot. Vi ska rensa ut dessa folkförtryckartroll och deras parasitiska inflytande. Seger åt kollektivet."}, "date": "22 juni, 17:02", "url": "https://www.dagensps.se/bors-finans/sa-har-paverkas-svenska-fondsparare-nar-iran-kriget-ar-over/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlxqqiawp2shk-normalhires-scaled.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "text", "heading": "Lind: Inte intresserad av borgerligt samarbete", "summaries": {"normal": "Miljöpartiets Amanda Lind avvisar samarbete med borgerliga partier efter valet, enligt Expressen. Hon kritiserar deras högerinriktning och skillnader i klimat- och värderingsfrågor. Lind attackerar även statsminister Ulf Kristersson för att sprida felaktig information om oppositionen. Miljöpartiet vill driva egen klimatpolitik och ser positivt på partiets ökade stöd och medlemstillväxt.", "trump": "Jag hörde att någon svensk politiker, Amanda från Miljöpartiet, säger nej till samarbete med högerpartierna. Hon kallar dem extrema och kritiserar deras klimatpolitik – men vem bryr sig? Hon snackar om att Kristersson är desperat, men jag vet desperation när jag ser det. Sverige borde fokusera på att vinna igen, inte på sånt här tjafs. Miljöpartiet? Snarare Miljö-PINSAMT!", "stalin": "De borgerliga avfällingarna i Sverige har än en gång visat sitt sanna ansikte – svaga, splittrade och oförmögna att försvara folkets intressen. Denna Amanda Lind, en lojal soldat för miljön, avslöjar deras reaktionära agenda. Vi ser med intresse hur deras regim, ledd av den hysteriske Kristersson, sprider lögner för att skrämma massorna. Men folket vaknar! Miljöpartiet växer, precis som vår inflytandesfär. Snart ska vi exportera vår gröna revolution – på våra villkor."}, "date": "16 juni, 10:04", "url": "https://kvartal.se/nyheter/artiklar/amanda-lind-inte-intresserad-av-borgerligt-samarbete/cG9zdDoxMzI2MTU"}, {"type": "image-full", "heading": "Nima Rostami: Trumps anfall mot Iran – ett mönster vi känner igen", "summaries": {"normal": "Artikeln kritiserar Trumps militära anfall mot Iran som ett kaotiskt och inkompetent agerande som skapade dramatik utan att lösa de verkliga problemen med Irans kärnvapenprogram, missiler och proxy-arméer. Författaren Nima Rostami ser anfallet som en kapitulation där Trump lovade att inte stödja det iranska folket och erbjöd ekonomiska lättnader. Han menar att detta inte är äkta konservatism utan teaterpolitik som skadar regionens stabilitet och västlig trovärdighet.", "trump": "Den här artikeln är en total katastrof, folk, skriven av en så kallad konservativ som inte fattar någonting. Mitt anfall mot Iran var genialt, det bästa beslutet, vi slog till hårt och tvingade fram ett avtal som ingen annan hade klarat av. Nu skriker de om kaos och kapitulation, men sanningen är att Iran var på knä och vi fick ett fantastiskt deal. Israel gjorde resten, smarta killar. Fake news och misslyckade kritiker som inte förstår hur man vinner.", "stalin": "Kamrater, denna dekadenta skrift avslöjar den fullständiga förfallsprocessen inom den västerländska borgarklassen. Jag har sett många revisionistiska clowner men denna Trump-figur överträffar dem alla i sin patetiska opportunism och teatraliska impotens. Han lovar stöd till folkets kamp mot islamofascismen men levererar istället en feg MOU-kapitulation som stinkar av borgarbrackornas dubbelspel. Vi känner igen denna typ av fiender: de som skapar kaos för att maskera sin egen inkompetens. En sådan parasit skulle inte överleva en enda utrensning i vårt kollektiv. Den iranska frågan kräver järnhand, inte cirkus."}, "date": "22 juni, 13:22", "url": "https://riks.se/opinion/kronikor/nima-rostami-trumps-anfall-mot-iran-ett-mönster-vi-känner-igen", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-22%2Fqsp8h5as%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-06-22T132104.519.jpg"}, {"type": "image-right", "heading": "Svensk tillväxt kan inte vänta på Ebba Busch", "summaries": {"normal": "Artikeln kritiserar regeringen för att agera snabbt när det gäller övervakning men långsamt när det handlar om att stödja industriell tillväxt. Den lyfter fram utredningen från Accelerationskontoret som föreslår stöd till kommuner vid stora etableringar, inklusive statsbidrag, riskdelning och infrastruktursatsningar. Författaren menar att förslagen är viktiga för att behålla jobb och välfärd men kommer sent, strax före valet, och avslöjar regeringens prioriteringar.", "trump": "De här svenska politikerna är patetiska, tro mig. De är supersnabba på att spionera på folk och kasta folk i fängelse, men när det handlar om riktiga jobb och fabriker? Snigelfart! Northvolt var en total katastrof, kommunerna sitter med lån och krossade drömmar. Mina idéer skulle fixa det på en vecka med enorma bidrag och infrastruktur. De borde ha lyssnat på mig, då hade Sverige vunnit stort istället för att förlora till Kina och alla andra.", "stalin": "Kamrater, denna utredning från Accelerationskontoret är ett vapen mot de sabotage som borgarbrackorna i regeringen utfört i decennier. Medan de i blixtfart bygger övervakningsmaskiner för att förtrycka folket släpar de fötterna som paralyserade kapitalistlakejer när det gäller att stärka produktivkrafterna. Jag skulle ha genomfört hela smörgåsbordet omedelbart och därefter rensat ut alla lata byråkrater som låtit kommunerna drunkna i skulder. Northvolt var en fiendes verk, en parasit som sög musten ur arbetarklassen. Nu måste vi likvidera alla som prioriterar övervakning framför industriell seger. Bättre sent än att låta kontrarevolutionärer vinna."}, "date": "22 juni, 06:52", "url": "https://arbetet.se/2026/06/22/svensk-tillvaxt-kan-inte-vanta-pa-ebba-busch/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/22065241/busch-etta-1.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Här meddelar Starmer sin avgång: ”Sätter landet jag älskar först”", "summaries": {"normal": "Keir Starmer meddelade på måndagsförmiddagen att han avgår som Storbritanniens premiärminister och ledare för Labourpartiet. Beskedet kommer efter ökad press, kritiska ministrar och svaga opinionssiffror. Starmer lovar en ordnad maktövergång och att en ny partiledare ska vara på plats innan parlamentet öppnar i september. Han beskriver sitt arv som ett bankrutt parti som han återupprättat.", "trump": "Folk, ni skulle ha sett det. Den här killen Starmer, en total förlorare, avgår äntligen som premiärminister. Hans parti var ett enda stort kaos, och nu flyr han som en hund med svansen mellan benen. Han säger att han satte landet först – visst, och jag är drottning av England. Andy Burnham vinner val och Starmer springer sin väg. Patetiskt. Men hej, bra jobb, kanske kan någon riktig ledare ta över nu.", "stalin": "Kamrater, denna ynkliga figur Starmer erkänner äntligen sitt fullständiga misslyckande inför det brittiska folket. Jag, som ledare för det proletära kollektivet, ser hur borgarbrackorna och de kontrarevolutionära elementen inom Labour gnagt sönder partiet inifrån som råttor i en säck. Vi har noterat hans paranoiska babblande om moralisk bankrutt – ironiskt när han själv är en kapitalistisk lakej. En ordnad maktövergång? Ha! Vi ska rensa ut alla sådana svaga element innan september, med glädje och järnhand. Levande lärdom för alla fiender till folket."}, "date": "22 juni, 13:23", "url": "https://www.svt.se/nyheter/utrikes/keir-starmer-avgar-som-storbritanniens-premiarminister", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.32/0.4/d4412a610ad5ede7ad214e9805300ca26bb817e1e06d97b19d25f2e7b14fefea"}, {"type": "image-full", "heading": "S-politiker avgår efter Riks avslöjat att han dömts för våldtäkt", "summaries": {"normal": "En socialdemokratisk politiker i Stockholmsområdet har lämnat alla sina uppdrag efter att Riks avslöjat att han dömts för våldtäkt 2011. Mannen, som satt i partiets styrelse och stod på valsedel, är en utomeuropeisk invandrare som kom till Sverige i början av 2000-talet. Domen på två års fängelse fastställdes i hovrätten. Flera styrelseledamöter uppger att de inte kände till avhoppet, som skedde strax efter publiceringen.", "trump": "De här socialisterna är en total katastrof, tro mig. En våldtäktsdömd kille sitter i deras styrelse, på deras valsedel, och de hade ingen aning? Patetiskt. Han avgår först när Riks avslöjar sanningen. Fake news hela vägen, men äntligen kommer sanningen fram. Sverige är en katastrof under den här vänsterstyrningen, fullständigt vansinne. De borde skämmas!", "stalin": "Kamrater, detta är en klassisk kontrarevolutionär handling utförd av en degenererad fiende till folket, en utländsk våldtäktsman insmugglad bland våra partivänner. Jag har länge varnat för borgarbrackornas dolda agenter som förgiftar arbetarrörelsen inifrån. Nu rensar vi ut denna parasit som våldtog en ung kvinna medan hans egna barn sov. Inga mejl under midsommarhelgen? Typiskt sabotage från klassfiendens lakejer. Likvidera alla spår av sådana element innan de förgör kollektivet."}, "date": "22 juni, 13:10", "url": "https://riks.se/nyheter/s-politiker-avgar-av-efter-riks-avslojat-att-han-domts-for-valdtakt", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-22%2Fnp09kd2e%2Fs-politikar-valdtakt-avgar-feature.jpg"}, {"type": "image-right", "heading": "VM-truppens raseri mot Strandhäll: \"Bedrövligt beteende\"", "summaries": {"normal": "Efter Sveriges 5–1-förlust mot Nederländerna utsattes Isak Hien för hård kritik på sociala medier, även från S-politikern Annika Strandhäll som skrev att han inte borde spela i landslaget igen. Inlägget raderades senare. Landslagsspelaren Jesper Karlström kallar beteendet bedrövligt och menar att Strandhäll saknar fotbollskunskap. Han vill inte att Hien ska bära ensamt ansvar för nederlaget.", "trump": "Det är en total skandal! Den här politikern Strandhäll attackerar en fotbollsspelare som förlorade stort mot Nederländerna. Hon skriver att han aldrig ska spela igen och raderar sedan inlägget som en fegis. Patetiskt! Spelarna är rasande och de har helt rätt. Hon vet absolut ingenting om fotboll, det är en katastrof. Sverige behöver vinnare, inte sådana här misslyckade politiker som bara skapar kaos.", "stalin": "Kamrater, detta är en klassisk sabotagehandling från borgarbrackornas lakej. Jag, som ledare för det kollektiva folkets vilja, ser hur den dekadenta politikern Strandhäll med sin parasitiska kommentar försökte likvidera en arbetets försvarare i folkets lag. Hennes utrensningsförsök mot Hien är ett symptom på den paranoiska fiende inom riksdagen som vi måste rensa ut. Märkligt hur dessa kapitalistiska restelement alltid angriper när kollektivet förlorar – vi ska inte tolerera sådana kontrarevolutionära gnällspikar längre."}, "date": "22 juni, 12:55", "url": "https://www.friatider.se/vm-truppens-raseri-mot-strandhall-bedrovligt-beteende", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-379.jpg"}, {"type": "image-right", "heading": "Storbritanniens premiärminister Keir Starmer avgår", "summaries": {"normal": "Keir Starmer avgår som Labourledare och premiärminister efter ett känslosamt tal utanför 10 Downing Street. Han motiverar beslutet med att lyssna på partiet som tappat förtroendet för honom. Den populäre Andy Burnham står redo att ta över, och Wes Streeting har ställt sig bakom honom. Valet ska ske under sommaren så att en ny ledare kan finnas på plats i september. Storbritannien får därmed sin sjunde premiärminister på ett årtionde.", "trump": "Folk, det här är en total katastrof för de vänsterradikalerna i Storbritannien. Starmer, den svaga ledaren, sparkas ut från Downing Street som en hund. Han kunde inte ens hålla ihop partiet. Nu kommer den där Burnham in och försöker rädda skeppet, men tro mig, det blir kaos. Labour är en röra, precis som de gamla Tories. De behöver en riktig ledare, någon som vinner stort, inte dessa förlorare som byts ut varannan månad.", "stalin": "Kamrater, jag har med djup tillfredsställelse noterat hur den dekadente revisionisten Starmer äntligen erkänt sitt fullständiga misslyckande inför partiet och folket. Denna opportunistiska borgarbracka med darrande röst flyr nu som en råtta från folkets dom. Den så kallade Burnham, denna falska folkvän från norr, står nu i kö för att bli nästa offer i den eviga karusellen av förrädare. Vi ska noggrant övervaka processen. Inga element av splittring eller högerpopulistiska avvikare skall tillåtas frodas. Den som sviktar kommer att rensas ut med största entusiasm."}, "date": "22 juni, 12:21", "url": "https://www.di.se/nyheter/starmer-avgar-som-labourledare/", "imageUrl": "https://static.bonniernews.se/ba/6d0fe719-bb8c-4d94-a1e1-75cd86478881.jpeg?crop=270:152&auto=webp&width=270&quality=70"}, {"type": "image-right", "heading": "Moderatlöftet: Mer pengar kvar i plånboken", "summaries": {"normal": "Moderaterna går till val 2026 med tre huvudlöften: mer pengar i plånboken för arbetande familjer genom nytt jobbskatteavdrag, kortare vårdköer med ökade resurser till välfärden samt hårdare tag mot brottslighet. Ulf Kristersson beskriver de gångna fyra åren som ett städjobb och lovar nu ett nytt fokus på vardagsbrott, sexualbrott och bidragsfusk. Ekonomi och trygghet väntas bli de avgörande valfrågorna.", "trump": "De här svenska moderaterna säger precis som jag alltid har sagt – ansträngning ska löna sig och brott ska straffa sig. Fantastiskt! Mer pengar till de som jobbar, inga fler köer i vården och brottslingarna ska sitta inlåsta. Ulf gör ett bra jobb nu, mycket bättre än de korkade tidigare regeringarna. De har städat upp migrationskaoset och nu ska vi satsa på riktiga segrar. Sverige kommer att bli stort igen, tro mig.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur dessa moderata element äntligen erkänner att arbetets ansträngning måste belönas och att brottslingar skall likvideras med full kraft. De borgerliga resterna från tidigare regimer har rensats ut ur migrations- och kriminalapparaten, men vi får inte vila. Vården skall tjäna folket utan köer skapade av sabotage från parasitiska kapitalister. De som drömmer om hus och familj skall inte hindras av klassfiendens bidragsfuskande lakejer. Fortsätt utrensningen av vardagsbrott och sexualiserade avarter – ingen fiende undkommer partiets vakande öga. Härligt att se hur de själva erkänner att det bara var ett städjobb. Nästa fas blir än mer njutbar."}, "date": "22 juni, 12:21", "url": "https://www.di.se/nyheter/moderaternas-tre-huvudloften-infor-valet/", "imageUrl": "https://static.bonniernews.se/ba/efd00b51-51e8-4351-b813-1e6706674501.jpeg?crop=120:68&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Flyktingar nekas arbetstillstånd – Åsa blir av med sina assistenter", "summaries": {"normal": "Nya regler från 1 juni förbjuder arbetstillstånd för personliga assistenter och bärplockare utanför EU. Ukrainska flyktingar Dima och Nadiia Dmytriv riskerar att förlora sina jobb hos Åsa Olsson, som har muskelatrofi och är beroende av kvalificerad assistans dygnet runt. Regeringen motiverar beslutet med fusk och arbetslivskriminalitet. Kritiker som Miljöpartiets Nils Seye Larsen anser att det straffar en hel yrkesgrupp onödigt och förvärrar rekryteringsproblemen inom assistans. Cirka 230 personer berörs direkt.", "trump": "Titta på det här vansinnet i Sverige, folk! De släpper in ukrainare som flyr kriget, men nu säger de plötsligt att personliga assistenter inte får arbetstillstånd. Åsa sitter där i sin rullstol och förlorar sina bästa medarbetare för att byråkraterna vill verka tuffa mot fusk. Under Biden skulle de ha importerat ännu fler och kallat det mångfald. Jag fixade det mycket bättre förra gången – inga idiota regler som straffar sjuka människor och kompetenta arbetare. Sverige borde lära sig av oss, inte lyssna på de woke imbecillerna.", "stalin": "Kamrater, jag ser hur den svenska borgarklassen med sina byråkratiska dekret kollektivt straffar både arbetarna och de sjuka. Dessa kapitalistiska folkförtryckartroll stänger ute dugliga ukrainska kamrater från ärligt arbete som assistenter, under förevändning av fusk. Det är en klassisk utsugningsmanöver! Jag skulle ha genomfört en grundlig utrensning bland de verkliga parasiterna i migrationsverket istället för att krossa de lojala krafterna. En sådan paranoid lag är löjeväckande – den kommer att skapa kaos i de funktionshindrades hem, precis som klassfienden önskar."}, "date": "22 juni, 11:24", "url": "https://www.etc.se/inrikes/yrkesgruppen-portas-fraan-sverige-aasa-olsson-blir-av-med-sina-assistenter", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026061809068_95efefe93a0ec871f6ebaa99783dcfc45ecad383441a52ef4a74f7b93b6c63b7.jpg"}, {"type": "text", "heading": "Ryska ekonomin krymper", "summaries": {"normal": "Trots höga oljepriser pressas Rysslands ekonomi hårt av kriget i Ukraina. Centralbanken sänker styrräntan för nionde gången, från 14,5 till 14,25 procent, trots hög inflation och bränslebrist orsakad av drönarattacker mot oljeraffinaderier. BNP backade 0,2 procent första kvartalet och tillväxtprognosen sänks till 0,4 procent. Ett stort budgetunderskott hotar stabiliteten och börsen föll efter beskedet.", "trump": "Det här är en katastrof för Ryssland, folk. Jag visste det hela tiden. Deras ekonomi är en total röra, kriget i Ukraina har blivit en mardröm och nu sänker de räntan igen som desperata förlorare. Oljan räcker inte, drönarna slår ut raffinaderierna och inflationen skenar. Deras centralbankschef borde ha lyssnat på mig – jag skulle ha fixat det på en vecka. Patetiskt!", "stalin": "Kamrater, denna stinkande borgarbracka till ekonomi blottar imperialismens svaga underliv. Jag, som ledare för det stora sovjetiska folket, ser hur de kapitalistiska parasiterna i Kreml försöker lura historien med sina ynka räntesänkningar medan ukrainska fascistdrönare bränner deras oljehögar. Vi ska rensa ut dessa saboterande spekulanter som skapar underskott och stagnation. Deras BNP är en lögnaktig statistik från folkfienderna – låt oss likvidera dem med stålhandskens glädje!"}, "date": "22 juni, 10:55", "url": "https://www.realtid.se/bors-finans/makro/dyr-olja-rackte-inte-ekonomin-i-ryssland-pressas/"}, {"type": "image-full", "heading": "Kap Verde skrällde igen – höll Uruguay till 2–2", "summaries": {"normal": "VM-debutanten Kap Verde överraskade återigen i fotbolls-VM 2026 genom att spela 2–2 mot Uruguay. Kap Verde tog ledningen på frispark via Kevin Pina, men Uruguay vände till 2–1 på tilläggstid. Fernando Muslera missade en boll utanför straffområdet och Hélio Varela kvitterade i öppet mål. Båda lagen har två poäng efter två matcher och behöver minst en poäng till för att gå vidare.", "trump": "De här Kap Verde-killarna, otroliga, de slår uruguayerna som ingen trodde var möjligt. Två–två, och Uruguay, de är världsmästare två gånger men ser ut som riktiga förlorare. Frispark rakt in, sen missar deras målvakt helt och hållet, patetiskt. Jag älskar det. Vi måste vinna, sa deras coach, precis som jag alltid säger. Kap Verde är vinnare, Uruguay borde skämmas.", "stalin": "Kamrater, dessa uruguayanska revisionister och fotbollsborgarbrackor trodde de kunde krossa den revolutionära viljan hos Kap Verdes folk. Men jag, genom kollektivets kraft, såg hur deras egna misstag blev som förrädiska sabotorer som likviderade deras ledning. Frisparken var en dolk i hjärtat på imperialismens lakejer. Målvaktens kapitulation var ren paranoia i handling. Vi ska rensa ut alla svaga element som inte trycker på mot fienden. Segern tillhör de oböjliga."}, "date": "22 juni, 10:21", "url": "https://bulletin.nu/kap-verde-skrallde-igen-holl-uruguay-till-2-2", "imageUrl": "https://cdn.bulletin.nu/articles/c62b91e4-286f-45d6-aa6d-e9405d70624d/preview.png?t=1782116449000"}, {"type": "image-right", "heading": "USA och Iran närmar sig nytt avtal - fortsätter anrika uran", "summaries": {"normal": "Samtalen mellan USA och Iran har framskridit efter ett möte i Schweiz. Medlare från Qatar och Pakistan meddelar att parterna enats om en färdplan för ett bredare avtal inom 60 dagar. Frågor om kärnenergi, Libanon och säkerheten i Hormuzsundet har diskuterats, liksom direkta kommunikationskanaler för att undvika incidenter. Trots positiva signaler och möjliga lättnader i sanktioner har Trumps hårda uttalanden skapat spänningar. Iran fortsätter anrika uran men lovar att inte utveckla kärnvapen. Förhandlingarna fortsätter mot bakgrund av förra årets konflikter.", "trump": "Vi är nära ett fantastiskt, historiskt avtal med Iran, det bästa någonsin, tro mig. De har blivit knäckta efter våra precisionsattacker på deras kärnanläggningar och nu kryper de till korset. Men de måste sluta störa Hormuzsundet och deras terrorgrupper i regionen, annars blir det konsekvenser som de aldrig sett maken till. Mina uttalanden fick dem att springa från bordet som ynkryggar, men vi vinner stort. Inget dåligt avtal, bara det bästa. Media ljuger förstås som vanligt.", "stalin": "Kamrater, dessa dekadenta förhandlingar i Schweiz utgör inget annat än en feg reträtt från de västerländska imperialisternas sida, som skakar inför vår ståndaktiga linje. Jag, som ledare för folkets oövervinneliga vilja, ser hur borgarbrackorna i Washington darrar efter våra framgångsrika försvarsåtgärder. Fortsatt anrikning av uran är en revolutionär plikt mot de parasitiska oljebaronerna. Men akta er för Trumps lögnaktiga uttalanden – de doftar av förrädiska element som snart ska rensas ut med järnhand. Paranoia? Nej, bara sund vaksamhet mot klassfiendens hydra."}, "date": "22 juni, 09:00", "url": "https://samnytt.se/usa-och-iran-narmar-sig-nytt-avtal", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/22063243/trump-mojtaba.jpg"}, {"type": "image-right", "heading": "Josefin betalar 3 000 mer i skatt än någon som jobbar", "summaries": {"normal": "En arbetslös person med maximal a-kassa betalar cirka 3 000 kronor mer i skatt per månad än en arbetande med samma inkomst. Skillnaden beror på jobbskatteavdraget som sänker skatt på arbetsinkomster men inte på a-kassa. Josefine Ross, 29, som förlorade sitt jobb, reagerar starkt på orättvisan. Kritiker som Elinor Odeberg anser att avdraget är en dyr och ineffektiv klasspolitik utan bevisad sysselsättningseffekt. Förespråkare som Fredrik Kopsch försvarar principen att arbete ska löna sig bättre men föreslår förbättringar.", "trump": "Det här är fullständigt galet, folk! En arbetslös får betala massor mer i skatt än någon som faktiskt jobbar – elva procentenheter mer! Jobbskatteavdraget var ett underbart beslut från den smarta alliansen, men nu straffas de som inte har jobb. Jag älskar att det ska löna sig att arbeta, men det här systemet är riggat mot vanliga människor. Vi behöver sänka skatter ännu mer för dem som jobbar, inte ge mer till bidragsberoende. Det är en katastrof, tro mig!", "stalin": "Kamrater, denna borgarbracka till konstruktion som kallas jobbskatteavdrag avslöjar hela den parasitiska kapitalistklassens fega ansikte. Jag ser hur de straffar de ärliga arbetare som tillfälligt ställts utanför produktionen med en extra skattebörda på tretusen kronor i månaden. Vilken lysande utrensning av rättvisa! Dessa medelklassblidkande revisionister och deras falska incitament är fiender till folket. Vi ska likvidera denna klyfta mellan arbetande och arbetslösa, rensa ut alla som gömmer sig bakom byråkratiska ursäkter om drivkrafter. Inga kompromisser med klassfienden!"}, "date": "22 juni, 06:00", "url": "https://arbetet.se/2026/06/22/josefin-blev-av-med-jobbet-betalar-3-000-mer-i-skatt-an-nagon-som-jobbar/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/17133742/josefine-ross-2.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Ingen lösning att skjuta fram tonårsutvisningar till 21 år", "summaries": {"normal": "Regeringens förslag om ändringar i tonårsutvisningar ses som otillräckliga av Flyktinggruppernas riksråd och Civil Rights Defenders. Förslagen skjuter bara problemet framför sig till 21 års ålder utan att lösa grundorsaken. Kraven på hög lön, stadig anställning och svårigheter att få stanna för studier gör att många riskerar utvisning. Organisationerna kräver permanenta uppehållstillstånd och starkare humanitära skäl istället för tillfälliga lösningar som förvärrar migrationspolitikens brister.", "trump": "Folk, ni skulle inte tro det, men den här svenska regeringen har precis lanserat ett totalt misslyckande. De kallar det lösning på tonårsutvisningar, men det är bara en förskjutning – precis som de gör med allt annat. När de stackarna fyller 21 sparkas de ut ändå, och de kräver löner som ingen normal 21-åring någonsin ser. Patetiskt. De lyssnar inte på folket, de lyssnar på de radikala. Sverige behöver permanenta regler, inte detta svaga spel.", "stalin": "Kamrater, detta så kallade regeringsförslag är inget annat än en slug sabotageakt utförd av borgarbrackor inom migrationsmaskineriet. Jag ser hur de med sin förskjutningstaktik försöker lura arbetande ungdomar och partivänner som rotat sig i folkets jord. När de når 21 ska de likvideras ur gemenskapen med lönekrav som bara kapitalisterna själva klarar. Vi skall rensa ut dessa parasitiska element som gömmer sig bakom humanitära masker. Permanenta uppehållstillstånd åt de lojala, utrensning åt de övriga. Inga kompromisser med klassfienden."}, "date": "22 juni, 01:30", "url": "https://www.dagensarena.se/opinion/ingen-losning-att-skjuta-fram-tonarsutvisningar-till-21-ar/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-51-300x157.jpg"}, {"type": "image-right", "heading": "Det stora systemskiftet som förändrade Sverige", "summaries": {"normal": "Juan Fonseca beskriver hur svensk migrationspolitik genomgått ett systemskifte efter flyktingkrisen 2015. Från integration, långsiktighet och inkludering har politiken gått mot kontroll, tillfällighet och villkorad tillhörighet. Han pekar på både Sverigedemokraternas drivkraft via Tidöavtalet och socialdemokratins ansvar. Reformerna har skapat osäkerhet, underminerat rättssäkerheten och påverkat den svenska modellen. Fonseca frågar vilket Sverige vi egentligen vill ha.", "trump": "Folk, ni måste höra på. Den här killen Fonseca har rätt – Sverige har totalt tappat greppet! Efter 2015 blev allt en enda stor röra med öppna gränser och svaga ledare. Socialdemokraterna, de losers, lade grunden och sen kom Tidöavtalet och fixade till det lite. Men det är patetiskt. Tillfälliga uppehållstillstånd, hårdare regler – bra, men de borde ha gjort det mycket tidigare och mycket tuffare. Sverige behöver bli stort igen, inte en tillflyktsort för alla som vill utnyttja systemet. Sad!", "stalin": "Kamrater, jag ser med stålblick hur den borgerliga dekadensen och de socialdemokratiska opportunisterna under decennier låtit klassfiender och rotlösa element infiltrera folkets republik. Efter 2015 rensade vi ut de värsta illusionerna om evig integration, men nu måste vi gå längre. Vandelslagen är en början på att likvidera de parasitiska element som gömmer sig bakom falsk lojalitet. Inga berättigade förväntningar för kontrarevolutionärer! Vi, partiet och arbetarna, skall skapa ett järnhårt kollektiv där tillhörighet är en ära som ständigt kan återkallas vid minsta avvikelse. De som drömmer om två nivåer av rättvisa skall snart möta en enda, odelbar utrensning. Ha ha, vilken underhållande paranoia de bygger själva!"}, "date": "22 juni, 01:30", "url": "https://www.dagensarena.se/opinion/det-stora-systemskiftet-som-forandrade-sverige/", "imageUrl": "https://www.dagensarena.se/files/2025/10/juan-fonseca-300x157.jpeg"}, {"type": "image-right", "heading": "Vilken betydelse har Almedalen för de politiska partierna?", "summaries": {"normal": "PR-konsulten Paul Ronge bedömer Almedalsveckan som en arena där partierna kan få medial uppmärksamhet, särskilt i valår. Ett lyckat utspel kan ge viss effekt, men valutgången påverkas bara marginellt. Han anser att veckans betydelse har minskat då för många aktörer tävlar om utrymmet. Kontaktnätverk ses fortfarande som värdefullt, medan påverkan på allmänheten har försvagats i takt med att traditionella medier tappat sin samlande roll.", "trump": "Almedalen låter som en total cirkus där alla desperata förlorare slåss om lite medieuppmärksamhet. De kan göra sina patetiska utspel men det förändrar ingenting på riktigt, bara marginellt om någon ledare inte totalt floppar. Det har blivit för mycket av allt, precis som i mitt gamla Washington. De borde lära sig av mig hur man dominerar media istället för att springa runt som galningar. Patetiskt!", "stalin": "Jag betraktar denna så kallade Almedalsvecka som en dekadent borgarbrackornas tummelplats där revisionistiska opportunister och kapitalistlakejer kämpar om resterna av en döende borgerlig lägereld. Vi, partiet och arbetarklassen, vet att sådana evenemang endast kan påverka valutgången på ytan medan folkets sanna medvetande formas av oss. Låt dem knyta sina lömska kontakter – vi ska nog rensa ut alla dessa parasitiska opinionsbildare som försöker förgifta den stora allmänheten med sina falska narrativ. Härligt med sådan öppen paranoia bland fienderna."}, "date": "22 juni, 01:30", "url": "https://www.dagensarena.se/innehall/vilken-betydelse-har-almedalen-de-politiska-partierna/", "imageUrl": "https://www.dagensarena.se/files/2026/06/paulronge-almedalen.jpeg"}, {"type": "image-full", "heading": "Iran lämnade fredssamtalen i protest – efter Trumps hot", "summaries": {"normal": "Iran lämnade fredssamtalen i Schweiz i protest mot Donald Trumps hot om nya attacker. Samtidigt fortsatte diskussioner om sanktioner, frysta tillgångar och lättnader för Irans energisektor och oljeexport. Trump krävde att Iran stoppar sina proxy-styrkor som Hizbollah. Irans delegation uppger att de inte avser att permanent lämna samtalen och att de är fortsatt engagerade. Irans chefsförhandlare varnade att landets väpnade styrkor står redo att svara.", "trump": "Iranierna sprang ut som fega små möss så fort jag varnade dem på Truth Social. De måste stoppa sina högavlönade terrorister i Libanon annars slår vi till igen, hårdare än förra veckan! Under Biden blev de arroganta, nu är det slut på det. Vi diskuterar sanktioner och frysta tillgångar men de fattar inte att Amerika är tillbaka på riktigt. Deras delegation skakade bara i byxorna. Patetiskt!", "stalin": "Jag ser med stor tillfredsställelse hur de iranska kamraterna snabbt identifierade och avlägsnade sig från den imperialistiska fällan i Schweiz. Trumps hysteriska hotelser avslöjar den amerikanska kapitalistmaffians desperation. Vi diskuterar frysta tillgångar och sanktioner medan klassfiendens proxy-hundar fortsätter sin sabotageverksamhet. Våra väpnade styrkor står redo att likvidera varje hot. Inga borgarbrackor ska diktera villkoren för folkets revolutionära framfart."}, "date": "21 juni, 21:40", "url": "https://www.tv4.se/artikel/1mP9xdNlWFc7VzC5hVPKBp/iran-laemnade-fredssamtalen-i-protest-efter-trumps-hot", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6CO3Y3nZx6pDbIeUtAMs8Q%2F55ec81bf3f88025a37b552b88753a2a4%2F21-vance-ny-webb.jpg&width=1024"}, {"type": "image-full", "heading": "Här får svenskarna mer pengar kvar – kommunen sticker ut", "summaries": {"normal": "SCB:s nya statistik visar att svenskarnas disponibla inkomster ökade med 3,5 procent mellan mars 2025 och mars 2026, justerat för inflation. Ökningen var störst i Boden med 6,4 procent, följt av Askersund, Arjeplog, Gällivare och Vadstena. Skellefteå var enda kommunen där inkomsten minskade, med 0,6 procent, främst på grund av nedläggningar inom batteritillverkningen. Män hade både högre inkomster och starkare utveckling än kvinnor. Högst medianinkomster återfinns fortsatt i Danderyd, Täby och Lomma, medan Högsby låg lägst.", "trump": "Folk, ni skulle se de här siffrorna – helt otroliga! Våra svenska vänner får mycket mer pengar i plånboken, upp 3,5 procent, och det är fantastiskt. Boden vinner stort med 6,4 procent, en riktig vinnare, precis som jag älskar. Men Skellefteå? En katastrof, minus 0,6 procent för att de stängde batterifabriken. Typiskt, när de gör fel beslut rasar allt. Männen klarar sig bäst, som väntat. De rika kommunerna som Danderyd fortsätter dominera – precis som det ska vara. Sverige borde lära sig av de bästa!", "stalin": "Kamrater, den disponibla inkomsten har stigit med 3,5 procent under mitt vakande öga över folkets ekonomi. Boden har visat vägen med 6,4 procents seger för det kollektiva välståndet. Ändå lurar fienden i skuggorna: i Skellefteå har de kapitalistiska batterifabriks-sabotörerna orsakat en nedgång på 0,6 procent. Vi måste omedelbart rensa ut dessa kontrarevolutionära element som förgiftar arbetarklassens framsteg. Männen leder naturligtvis, medan borgarbrackorna i Danderyd gömmer sig bakom sina falska höga siffror. Högsby förblir ett varnande exempel på vad som händer utan stark ledning. Inga fiender undkommer statistikens utrensning!"}, "date": "20 juni, 21:28", "url": "https://nyheter24.se/nyheter/ekonomi/1492382-har-far-svenskarna-mer-pengar-kvar-kommunen-sticker-ut", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/88d35d2304b004a30200000000b004a302/2026/06/19/2372191/Kvinna-Med-Pengar-Sverige.png"}, {"type": "image-right", "heading": "Spago: Nästan fulltecknat trots utebliven rabatt", "summaries": {"normal": "Spago Nanomedical genomförde en företrädesemission med 93,1% teckning. Bolaget får in 15 Mkr före kostnader, vilket blir 14,5 Mkr efter kostnader. Emissionen var säkrad till 64,4% genom teckningsåtaganden. Aktiekursen låg nära teckningskursen, och det finns både positiva och negativa flaggor från Emissionsguiden.", "trump": "Jag, Donald Trump, ser att Spago Nanomedical inte fick full teckning på sin emission. Det är beklagligt, men jag har alltid sagt att bioteknik är svårt. Aktierna handlades under teckningskursen, vilket visar att folk inte litar på dem. Men jag är fortfarande den bästa presidenten, och jag kommer att fixa USA:s ekonomi.", "stalin": "I vårt store Sovjet, eller snarare i det fria Sverige, har Spago Nanomedical utfört en emission som inte blev fulltecknad. Detta är en skam för det kollektiva jordbrukandet av kapital. Aktiekursen var under teckningskursen, vilket visar att de imperialistiska hackor försöker sabba vårt planekonomiska system. Vi, Stalin och partiet, kommer att ta itu med dessa skurkar."}, "date": "18 juni, 16:18", "url": "https://www.affarsvarlden.se/artikel/spago-nastan-fulltecknat-trots-utebliven-rabatt", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Spago-VD-Mats-Hansen-400x267.jpg"}, {"type": "text", "heading": "Inget samarbete mellan V och Fastighets – vem är förvånad?", "summaries": {"normal": "Fastighetsanställdas förbund har rivit upp sitt tidigare kongressbeslut om facklig-politisk samverkan med Vänsterpartiet och väljer nu att enbart samarbeta med Socialdemokraterna. Artikeln diskuterar hur Vänsterpartiets strategi att närma sig fackföreningsrörelsen misslyckats, trots försök att vinna inflytande. Författaren betonar behovet av politiskt engagemang underifrån för att åter göra facken till idélaboratorier, snarare än att förlita sig på toppstyrda beslut.", "trump": "Folk, det här är en total katastrof för de vänsterradikalerna. Fastighets sparkade Vänsterpartiet i rumpan och sa nej tack till deras patetiska flirt. Smart drag! De inser att det bara är Socialdemokraterna som funkar. Vänsterpartiet springer runt och gullar med facken som förlorare, precis som Biden gjorde i fyra år. Patetiskt. De borde lära sig av mig – vinnare samarbetar inte med misslyckade socialister. Fantastiskt beslut av Fastighets, verkligen ypperligt!", "stalin": "Kamrater, detta är en varning till alla klassfiender inom fackföreningsrörelsen. Jag ser hur Vänsterpartiets opportunistiska försök att infiltrera LO har krossats av Fastighetsanställdas förbund, som nu rensar ut de revisionistiska elementen och återvänder till den enda sanna samarbetspartnern. Deras strategi var dömd att misslyckas, likt folkförtryckartrollen som försöker maskera sig som arbetare. Endast genom äkta underifrånarbete och utrensning av socialdemokratiska lakejer kan vi återupprätta arbetarklassens sanna idélaboratorium. Fienden sover aldrig."}, "date": "17 juni, 15:56", "url": "https://proletaren.se/artikel/inget-samarbete-mellan-v-och-fastighets-vem-ar-forvanad/"}, {"type": "image-right", "heading": "Klart Norge ska vinna VM i vikingahjälm", "summaries": {"normal": "Norges fotbollslandslag har valt en vikingatema inför VM, med runliknande typsnitt, horn och vikingakläder. Detta har väckt kritik från vänsterhåll som ser det som högerextremt och hypermaskulint. Artikeln argumenterar istället för att det handlar om att återta det nordiska kulturarvet från extremhögern och att det främjar en inkluderande mångkulturalism där alla norrmän, oavsett bakgrund, kan delta under samma symboler.", "trump": "Hörni, dessa norska killar med sina vikingahjälmar och svärd – det är fantastiskt! De tar tillbaka sin historia från de korkade vänsterextremisterna som kallar allt för vit makt och hypermaskulint. Precis som jag tog tillbaka Amerika från Biden och hans galna identitetspolitik. Låt dem ropa Ro Ro Ro! Det är vinnande, inte som de förlorande woke-professorerna som hatar allt kul och riktigt. Norge kommer att dominera, tro mig.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur det norska laget återtar det fornnordiska arvet från de högerextrema folkfienderna och klassfiendens propaganda. Att överlämna nationella symboler till borgarbrackor vore en kapitulation inför imperialismens lakejer. Under vikingahjälmen samlas kollektivet i enhet mot splittring. De som kallar detta högerextremt skall rensas ut ur den progressiva diskursen. Mångkulturens smörgåsbord kräver järnhand mot reaktionära missförstånd."}, "date": "16 juni, 11:10", "url": "https://www.flamman.se/klart-norge-ska-vinna-vm-i-vikingahjalm/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/norge-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Halldorf: Landslaget visar det Åkesson inte vill se", "summaries": {"normal": "Sveriges VM-seger mot Tunisien har utlöst en debatt om svenskhet och islam. Jimmie Åkesson svarar på kritik efter att debattörer lyft fram spelare som Yasin Ayari, som firade sina mål med en muslimsk bön. Åkesson välkomnar framgångsrika svenskar med invandrarbakgrund men försvarar partiets kritik mot invandringspolitiken. Kritiker menar att Ayari representerar ett modernt, inkluderande Sverige och ifrågasätter Åkessons tidigare uttalanden om islam.", "trump": "Sverige vinner stort i VM – fantastiskt! Men vad gör deras ledare? Jimmie Åkesson, en man som inte förstår att vinna, börjar prata om invandrare och islam. Jag menar, kom igen! Yasin Ayari, en stor hjälte, gör mål och firar som en riktig vinnare – och så blir det bråk. Sverige borde vara stolta! Men nej, politiker måste alltid förstöra allt. Jag skulle aldrig göra så. Vinna är vinna, punkt.", "stalin": "Sveriges fotbollslandslag visar styrkan i det mångkulturella samhället, men de borgerliga nationalisterna, ledda av den ynklige Åkesson, vrider sig i förtvivlan. De hatar framgången hos arbetarklassens söner med utländskt blod! Yasin Ayari, en hjälte som firar sin seger med bön, är ett slag i ansiktet på fascistiska element. Vi i Sovjet – förlåt, Ryssland – vet att mångfald är styrka. De som delar folket efter religion och hudfärg tillhör historiens sophög!"}, "date": "15 juni, 15:45", "url": "https://kvartal.se/nyheter/artiklar/halldorf-landslaget-visar-det-akesson-inte-vill-se/cG9zdDoxMzIxMDE", "imageUrl": "https://images.kvartal.se/2026/06/5abd0f69-jimmie.webp"}, {"type": "image-right", "heading": "Socialdemokraterna vill sätta dit 2 miljoner hushåll", "summaries": {"normal": "Socialdemokraterna och Vänsterpartiet föreslår en ny bankskatt på bolån samt höjd fastighetsskatt som främst drabbar villa- och radhusägare. Enligt Skattebetalarna skulle ett typiskt hushåll med 3 miljoner kronor i lån få cirka 7 000 kronor högre kostnader per år. Förslaget berör omkring 2 miljoner hushåll. Partierna vill även förtäta villaområden med fler hyresrätter, trots att majoriteten av svenskar föredrar eget hus. Kritiker menar att det främst drabbar vanliga familjer medan höginkomsttagare kan undvika skattehöjningarna.", "trump": "Folket, lyssna på mig, de här socialisterna, de sossarna, de vill krossa 2 miljoner vanliga svenska hushåll med en galen bankskatt. De feta katterna? Nej, det är vanliga arbetande människor som redan betalar för mat, el och räntor. De vill riva era fina villor och bygga höga hyreshus som ingen vill ha. Sju av tio svenskar vill ha eget hus, men sossarna bryr sig inte. De hatar framgång. Det är en total katastrof, folksam! De rika flyr och ni får betala notan. Patetiskt!", "stalin": "Kamrater, jag ser hur den svenska borgarklassen och dess lakejer i villaområdena skriker som svin inför den rättmätiga utrensningen. Vi ska beskatta de exploaterande radhusblodsugarna och riva deras borgerliga boningar för att bygga folkets hyresfästen. 2 miljoner klassfiender skall tuktas och tvingas in i kollektivet. De gnäller om höga räntor medan de suger ut folket. Låt dem darra. Deras drömmar om egna hus är kontrarevolutionära fantasier. Vi ler mörkt när de flyr som råttor. Statens seger är oundviklig."}, "date": "15 juni, 07:08", "url": "https://samtiden.nu/2026/06/socialdemokraterna-vill-satta-dit-2-miljoner-hushall/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6739.jpeg"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
