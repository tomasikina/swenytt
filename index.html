lösa grunder, ingen dokumentation, inget ansvar – det är en skandal! I USA skulle vi aldrig tillåta detta. Vi skulle bygga en stängd mur runt barnens rättigheter och låta bara de bästa, de smartaste, ta hand om dem. Sverige måste bli stort igen!", "stalin": "Vi ser att Sverige, detta fjärran östeuropeiska land, behandlar sina barn som administrativa objekt. Deras system är som en dålig kollektivisering – inget ansvar, inga spår, bara subjektiva bedömningar från flyktiga konsulter. Vi i Ryssland vet att barn är statens framtid, och vi skulle aldrig tillåta en sådan brist på kontroll. Deras 'sekretess' är bara ett sätt att dölja svaghet. Vi skulle återuppbygga detta med partiets starka hand."}, "date": "31 maj, 12:00", "url": "https://bulletin.nu/debatt-staten-ar-vardslos-med-vara-barn", "imageUrl": "https://cdn.bulletin.nu/articles/b9f0523d-fe46-431c-b78c-0680c0f351ce/preview.png?t=1780221496000"}, {"type": "image-full", "heading": "Rätten: Mannen från hemtjänsten våldtog Elsa", "summaries": {"normal": "En hemtjänstman i Uppsala avskedades efter anklagelser om våldtäkt mot en 84-årig kvinna, Elsa. Trots att förundersökningen lades ned krävde mannen 460 000 kronor i skadestånd från kommunen. Tingsrätten dömde till kommunens fördel, bedömde att Elsa var trovärdig och att mannen utsatt henne för övergrepp. Mannen ska betala kommunens rättegångskostnader på cirka 450 000 kronor. Fallet uppmärksammar övergrepp inom äldreomsorgen.", "trump": "Lyssna här, Uppsala kommun gjorde helt rätt! En hemtjänstman, som påstår sig vara oskyldig, krävde nästan en halv miljon kronor efter att ha blivit sparkad för att ha våldtagit en 84-årig kvinna. Men domstolen sa: 'Nej, nej, nej!' – och nu ska han betala kommunen istället. Fantastiskt! Elsa, en modig kvinna, berättade sanningen och rättvisan segrade. Sådana här typer ska inte få förstöra vårt samhälle. USA skulle aldrig tolerera sådant, och Sverige gjorde rätt!", "stalin": "Kamrater! Ännu en fiende till folket har avslöjats – en degenererad parasit som förgriper sig på de äldres svaghet. Uppsala kommun, under vårt ständiga öga, har rensat ut denna skadedjur. Mannen, som trodde sig kunna lura systemet med sina kapitalistiska skadeståndskrav, har nu krossats av rättvisans hammare. Elsa, en sann sovjetisk medborgare i andan, stod upp mot förtrycket. Vi noterar också att denna kriminella element tidigare smutsat ner vår vän Putins intressesfär genom liknande illdåd. Men frukta inte – proletariatets domstolar står alltid redo att krossa sådana som han!"}, "date": "30 maj, 10:09", "url": "https://kvartal.se/nyheter/artiklar/ratten-hemtjanstmannen-valdtog-86-ariga-elsa/cG9zdDoxMTk2NTk", "imageUrl": "https://images.kvartal.se/2026/05/cac81ab6-hemtjanst.webp"}, {"type": "image-right", "heading": "Ledare: Moderaterna behöver byta taktik", "summaries": {"normal": "Moderaterna och övriga Tidöpartier har dystra opinionssiffror inför valet 2026. Artikeln konstaterar att en game changer behövs för att vända opinionen, då varken utrikeskriser, tydliga samarbetsplaner eller ekonomiska åtgärder gett effekt. Förslag inkluderar mer fokus på visioner för Sveriges framtid, en plan för de första hundra dagarna, starkare granskning av oppositionens skatteplaner och vänstersväng samt att Ulf Kristersson tar mer plats i debatten och lyfter fram Sveriges positiva utveckling inom innovation och tillväxt.", "trump": "Titta på de här svenska Moderaterna, totala förlorare just nu. Dystra siffror, ingen energi, de behöver en riktig game changer och det är jag experten på. De borde skryta om att göra Sverige rikast i Europa, krossa lågkonjunkturen som jag gjorde med den amerikanska ekonomin och sluta vara så patetiskt passiva mot den galna vänstern. Visa upp den svenska boomen som Wall Street Journal älskar, attackera skattehöjningarna och vinn stort. Annars är det game over, folks.", "stalin": "Kamrater, dessa ynkliga Tidöborgarbrackor klamrar sig fast vid sina opinionssiffror som råttor vid en sjunkande skeppsskrov. Jag ser hur de desperat behöver en game changer medan de rödgröna parasiterna lurar i skuggorna med sina skattehöjningar och kontrollfantasier. Vi vet att borgarklassen alltid sviker när det gäller framtidsutsikter. Därför föreslår jag en total utrensning av deras passiva taktik, en storslagen utrensning av dimridåerna och en evig plan för de första hundra dagarna. Annars likviderar historien dem som de fega kapitalistiska element de är. Ha ha, vilket ypperligt skådespel."}, "date": "31 maj, 17:04", "url": "https://www.di.se/ledare/moderaterna-behover-byta-taktik/", "imageUrl": "https://static.bonniernews.se/gcs/di-dise/flamingo/profilbilder/frida_wallnor.png?crop=96:304&auto=webp&width=96&quality=100"}, {"type": "image-right", "heading": "Kulturkriget hjälper ingen med könsdysfori", "summaries": {"normal": "Artikeln diskuterar den polariserade svenska transdebatten kring könsdysfori och vård för barn och unga. Författaren tar Agnes Wolds oro på allvar men betonar att även transpersoners erfarenheter av livsavgörande vård måste lyssnas till. Debatten har kidnappats av ett kulturkrig där individer blir rekvisita. Vården behöver vara försiktig, se hela bilden och erbjuda varierad hjälp utan att allt blir ideologisk strid.", "trump": "Folk, det här är en total katastrof, en riktig cirkus den här svenska transdebatten. De gör om friska barns kroppar, det är horribelt, tro mig. Vänstern är galen, högern anklagas för att vara ond, alla använder de stackars kidsen som politiska brickor i sitt sjuka kulturkrig. Jag säger: sluta! Ge dem tid, ge dem ett tredje kön på papperet, men håll knivarna borta från barnen. Det är så enkelt, tro mig, ingen gör det bättre än jag.", "stalin": "Kamrater, jag ser hur denna dekadenta transdebatt blir ett redskap för klassfiendens kulturkrig. Borgarbrackorna och folkförtryckartrollen kidnappat frågan för att splittra folket medan de experimenterar på barns kroppar som fascistiska vivisektorer. Vi kräver vetenskaplig försiktighet, inte imperialistisk brådska eller social smitta från dekadenta medier. Ett tredje juridiskt kön? Acceptabelt byråkratiskt erkännande, men aldrig glöm: den sanna hjälpen kommer från kollektivets sunda materialism, inte från dessa sjuka avvikelser. Ut med dem som blundar!"}, "date": "29 maj, 16:02", "url": "https://www.flamman.se/kulturkriget-hjalper-ingen-med-konsdysfori/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/sdlrwj2l2p-u08-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "M&A: \"Stockholm har sitt eget mikroklimat i Europa\"", "summaries": {"normal": "Trots geopolitisk osäkerhet uppvisar den svenska transaktionsmarknaden en imponerande motståndskraft jämfört med övriga Europa. Henrik Kjellander, Executive Partner på Setterwalls – som utsetts till Sweden Law Firm of the Year 2026 – lyfter fram Stockholm som ett unikt mikroklimat för affärer. Medan kapitalmarknaden påverkas av global instabilitet, driver private equity-aktörer aktiviteten. Samtidigt börjar noteringsklimatet tina upp, där framgångsrika IPO-exempel i Sverige och USA inger hopp om en kommande våg av noteringar under året.", "trump": "Sverige gör det bra, riktigt bra! Jag har sagt det länge, Stockholm har ett fantastiskt mikroklimat. Mitt favoritställe Setterwalls vann precis ett enormt pris, 'Law Firm of the Year', en enorm ära. De växer som bara den, över en miljard, det är fantastiska siffror! Medan Europa lider av osäkerhet, håller Sverige stilen. Jag ser stora noteringar i USA, SpaceX – enormt värde! Vi vinner, alla vinner. Det är en vacker syn, mycket bättre än vad de falska nyheterna vill få er att tro!", "stalin": "De svenska juristerna hos Setterwalls försöker desperat framstå som framgångsrika i en värld som vacklar av kapitalistisk förruttnelse. De kallar Stockholm ett 'mikroklimat', men vi vet alla att det är en skyddad verkstad för borgerliga parasiter. Medan de firar sina priser och sina miljardomsättningar, ser vi hur den västerländska marknaden darrar. Varje IPO är ett symptom på deras instabilitet. Låt dem roa sig med sina transaktioner och 'private equity' medan vår intressesfär stadigt expanderar – historiens kvarnar maler långsamt, men de maler ner alla till slut."}, "date": "31 maj, 07:00", "url": "https://www.realtid.se/juridik/ma-stockholm-har-sitt-eget-mikroklimat-i-europa/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/henrik.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Kaos i Paris efter PSG:s titel – 400 gripna", "summaries": {"normal": "Kaos utbröt i Paris och andra delar av Frankrike när PSG firade sin andra Champions League-titel på två år. Tusentals supportrar samlades, främst på Champs-Elysées, vilket ledde till sammandrabbningar med polisen. Minst sju poliser skadades och totalt 416 personer greps. Butiker, bilar och busshållplatser skadades. Inrikesministern Laurent Nuñes kallade händelserna väntade men beklagliga. PSG vann finalen mot Arsenal på straffar.", "trump": "Titta på det här, Frankrike är en total katastrof igen. PSG vinner titeln och plötsligt står 20 000 galningar och slåss med polisen vid Eiffeltornet. 400 gripna, poliser skadade, bilar brinner. Under Biden skulle de ha kallat det fredlig protest, men jag säger som det är: svaga ledare, svaga gränser, svagt land. De borde ha vunnit stort istället för att bråka som losers. Patetiskt.", "stalin": "Jag betraktar med djup tillfredsställelse hur den dekadenta borgarklassens fotbollsfirande i Paris omedelbart degenererar till kontrarevolutionärt kaos. 416 fiender till ordningen har gripits, sju lakejer ur det repressiva polistyrket har fått smaka folkets vrede. Det gläder mig att se hur dessa exploaterande byfånar barrikaderar sig mot massorna. En sund utrensning av klassfiendens element vore nu på sin plats. Kamrater, revolutionen lever vidare i varje trasig skyltfönster."}, "date": "31 maj, 07:18", "url": "https://www.tv4.se/artikel/1RMTWWinAusSnKGzo6kbK3/400-gripna-kaos-igen-efter-psg-s-titel", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F618H8eZugFAaJzofCHy3aQ%2Ff96f59affcb00c2e0507e50692355b80%2Fa001_NormalPreview__2_.jpg&width=120"}, {"type": "image-full", "heading": "Carl Eos: Magdalena Andersson på väg mot regering med \"stolta kommunister\"", "summaries": {"normal": "En undersökning visar att 19 procent av de rödgröna väljarna överväger att byta parti om Vänsterpartiet släpps in i regering. Artikeln kritiserar Vänsterpartiets kommunistiska historia, kopplingar till extremism och antisemitism samt dess politik kring medborgarskap och skatter. Magdalena Andersson framställs som beroende av partiet för att bilda regering, vilket sägs skrämma bort väljare mer än Sverigedemokraterna. Författaren uppmanar till att rösta på det blågula blocket.", "trump": "Folk älskar mig för att jag säger som det är, och här ser vi det igen. Den där Magdalena Andersson är desperat, hon behöver de stolta kommunisterna i Vänsterpartiet för att hålla sig kvar vid makten. Nitton procent av hennes egna väljare springer därifrån som om det vore en brand, och det är smart av dem. SD skrämmer bara nio procent? Patetiskt. Hennes strategi exploderar fullständigt. Rösta på de riktiga vinnarna istället, annars får ni kommunister i regeringen. En katastrof, tro mig.", "stalin": "Kamrater, dessa ynkliga socialdemokratiska element kryper åter mot oss trots att historien själv dömt dem. Jag ser med stor tillfredsställelse hur borgarbrackornas egna väljare i panik flyr som råttor när mitt parti knackar på dörren. Nitton procent av de dekadenta oppositionella inser äntligen att vi är det enda sanna alternativet. De tre utrensade riksdagsledamöterna var naturligtvis kontrarevolutionära spioner som vi med glädje rensade ut. Låt de fega kapitalisterna darra. Vi ska likvidera deras sista illusioner om att slippa oss. Revolutionen vilar aldrig."}, "date": "31 maj, 16:28", "url": "https://riks.se/opinion/kronikor/carl-eos-magdalena-andersson-och-stolta-kommunister", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-01-28%2F31dlqw27%2FCopy-of-Copy-of-Copy-of-Copy-of-Copy-of-Copy-of-Copy-of-Copy-of-Copy-of-Riks-varum%C3%A4rkesmall-8.jpg"}, {"type": "image-full", "heading": "AI ökar tempot – men ekonomin blir inte effektivare", "summaries": {"normal": "Trots att AI ökar tempot i individuellt arbete syns inga stora produktivitetsvinster i ekonomin än. Forskare liknar situationen vid 1990-talets internetboom, där tekniken ännu inte gett full utdelning. Utmaningen ligger i att AI-användningen är låg och kräver organisatoriska förändringar. Dessutom varnar experter för att automatisering av juniora tjänster hotar framtida kompetensförsörjning, då unga förlorar möjligheten att lära sig yrket genom praktiskt arbete. Förslag om skatter på automationsvinster diskuteras för att motverka dessa risker.", "trump": "AI är en enorm bluff just nu, alla snackar om det men siffrorna? Bedrövliga! Som min stora vän Solow sa förr: datorerna syns överallt utom i statistiken. De sparkar unga arbetare, våra fantastiska unga akademiker får inga jobb, det är en katastrof! De här företagen förstör kompetenskedjan. Vi behöver riktiga jobb, inte algoritmer som gör ingenting. Jag ska fixa det här, vi kommer göra ekonomin stor igen, mycket bättre än under den där långsamma 90-talsboomen. Tro mig!", "stalin": "Vi har observerat att den så kallade tekniska framgången i väst endast är en maskerad för ineffektivitet. De kapitalistiska parasiterna förlitar sig på algoritmer medan deras egen ungdom degraderas till arbetslösa massor – en perfekt grogrund för kontrarevolutionärt kaos. Om de inte kan fostra sina egna kader genom disciplinerat arbete, kommer de att falla likt det dekadenta väst. Vi, staten, kräver produktivitet, inte abstrakta investeringar. Den som inte tjänar kollektivet är en sabotör, oavsett om han bär slips eller kodar."}, "date": "31 maj, 06:00", "url": "https://www.realtid.se/karriar-ledarskap/ai-okar-tempot-men-ekonomin-blir-inte-effektivare/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/kontor.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Kryphålen i lagen öppnar för Trumppengar", "summaries": {"normal": "Sverigedemokraterna söker samarbete med Trumps Magarörelse och kan via svag lagstiftning ta emot hemligt ekonomiskt stöd. Artikeln pekar på risken för utländsk påverkan genom sidoprojekt som Insamlingsstiftelsen för svensk konservatism och tankesmedjan Oikos. Trump har lovat att stötta högerextrema krafter i Europa mot vad han ser som ett hot mot västerländsk civilisation. Skiftet har nu presenterat Orangeboken för att kartlägga relationerna. Författaren uppmanar till ökad transparens i partifinansiering.", "trump": "Folk, ni borde se den här patetiska artikeln. Den är full av lögner och fake news från misslyckade vänstermänniskor som hatar mig och mina fantastiska MAGA-vänner. SD är smarta, de kommer till oss för att rädda sitt land från katastrof, precis som jag gör. De borde tacka mig istället för att fabricera konspirationer. Kryphål? Det är bara bra affärer! Vi vinner stort, Sverige kommer att bli enormt igen om de lyssnar på oss.", "stalin": "Kamrater, denna fega text blottar borgarbrackornas kryphål som låter folkfienderna i den amerikanska kapitalistmaffian smyga in sina blodsugarpengar till avfällingar. Jag ser tydligt hur klassfiendens konspirationer om folkutbyte används för att undergräva folkets enhet. Vi måste omedelbart likvidera alla hemliga kanaler och rensa ut dessa exploaterande byfånar som gömmer sig bakom stiftelser. Transparens är ett vapen mot imperialisternas infiltration. Inga kompromisser!"}, "date": "29 maj, 06:55", "url": "https://www.flamman.se/kryphalen-i-lagen-oppnar-for-trumppengar/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/skiftet-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Ny kontantlag i matbutiker 1 juli 2026 – det gäller för dig", "summaries": {"normal": "Från och med 1 juli 2026 införs en ny kontantlag i Sverige. Matbutiker och apotek med bemannad kassa måste då ta emot kontanter under vissa tider, med en övre gräns på 5 920 kronor per köp och högst 25 mynt. Undantag gäller vid säkerhetsrisker, misstänkt penningtvätt eller om kontanthanteringen hotar butikens överlevnad. Lagen syftar till att bevara kontanter i en alltmer digitaliserad ekonomi trots att de flesta butiker redan accepterar dem.", "trump": "Folk, ni vet hur det är, Sverige har blivit helt galet med alla dessa appar och swishande. Nu tvingar de plötsligt butikerna att ta kontanter igen, max 5920 kronor och bara 25 mynt. Det är patetiskt. De säger att det är för att inte tappa kontanterna helt. Jag älskar kontanter, de är vackra, inte som era digitala bluffvalutor. Men säkerheten först, annars stänger vi butiken. Fantastiskt, eller hur?", "stalin": "Kamrater, jag har granskat denna så kallade kontantlag och ser den som ett nödvändigt försvar mot de digitala spekulanternas sabotage. Borgarbrackorna och deras appbaserade utsugning hotar att utplåna folkets fysiska pengar. Vi kräver att mataffärer och apotek tar emot kontanter upp till 5920 kronor, men endast om det inte äventyrar säkerheten. Misstänkta penningtvättare och kostnadsorkaner skall likvideras omedelbart. Den som vägrar är folkets fiende nummer ett och kommer att rensas ut med ett leende."}, "date": "31 maj, 10:58", "url": "https://nyheter24.se/nyheter/ekonomi/1486901-ny-kontantlag-i-matbutiker-1-juli-2026-det-galler-for-dig", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/f86e6a9d04b004a30200000000b004a302/2026/05/28/2367054/kontanter-matbutik.png"}, {"type": "image-full", "heading": "Ny rapport: Kinesiska elbilar förlorar värde betydligt snabbare än väntat", "summaries": {"normal": "Kinesiska elbilar har snabbt vuxit på den europeiska marknaden genom låga priser, snabb utveckling och avancerad teknik. På den tyska begagnatmarknaden tappar dock dessa bilar värde betydligt snabbare än konkurrenterna. Det skapar oro för leasingpriser, företagsflottor och förtroendet för begagnatbilar. Problemet utmanar tillverkarnas strategi att bygga volym snabbt. Köpare värderar även service, garantier och varumärkesförtroende, där europeiska märken har fördel. Framgång kräver starka andrahandsvärden över tid.", "trump": "Titta på de här kineserna, de kommer in som en tsunamivåg med sina billiga elbilar och tror att de ska ta över Europa. Men nu rasar värdet på dem i Tyskland snabbare än Biden somnar under ett möte! Leasingbolagen skriker, flottorna flyr och plötsligt duger det inte att bara vara billig. De har ingen aning om service eller förtroende. Patetiskt! Vi amerikaner vet hur man bygger bilar som håller värdet. America First, alltid.", "stalin": "Kamrater, dessa kinesiska fordon har infiltrerats av borgarbrackornas falska lockrop om billig teknik och snabba vinster. Nu rasar deras andrahandsvärde som en folkfiende inför utrensning i Tyskland. Leasingbolagen, dessa exploaterande blodiglar, tvingas höja priserna medan kapitalistmaffian gnäller om service och garantier. Vi ler mörkt åt deras paranoia. Endast genom kollektiv styrka och långsiktig järndisciplin kan man besegra den imperialistiska begagnatmarknadens svarta hål. Skratta medan de faller."}, "date": "31 maj, 17:40", "url": "https://www.dagensps.se/motor/ny-rapport-kinesiska-elbilar-forlorar-varde-betydligt-snabbare-an-vantat/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/dagenspstt2024-2026-05-31t125133401.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "Oscar Sjöstedt (SD): Minska biståndet och lägg ner Sida på sikt", "summaries": {"normal": "Oscar Sjöstedt (SD) vill minska biståndsbudgeten som han anser är för stor på 53 miljarder kronor och på sikt lägga ner myndigheten Sida. Han pekar ut bistånd och klimatåtgärder som områden som bör bantas i statsbudgeten. Sjöstedt kritiserar Socialdemokraterna för att inte redogöra hur de ska finansiera en återgång till enprocentsmålet för biståndet, vilket skulle innebära en ökning med cirka 22 miljarder kronor.", "trump": "De här svenska socialisterna slösar bort 53 miljarder på bistånd, det är ett totalt skämt! Jag skulle skära ner det omedelbart, precis som jag gör med alla ineffektiva program. Sida borde läggas ner, de gör inget bra. Och klimatklivet? Glöm det, en stor bluff. Socialdemokraterna har ingen aning om hur de ska betala för sina galna löften, precis som vänstern alltid gör. Sverige behöver smarta prioriteringar, inte mer slöseri!", "stalin": "Kamrater, denna Sjöstedt har helt rätt i att den monstruösa biståndsramen på 53 miljarder utgör en farlig parasit som underminerar folkets ekonomi. Jag skulle omedelbart inleda en grundlig utrensning av hela den dekadenta biståndsbyråkratin och likvidera Sida som en borgarbrackornas verktyg för att göda kapitalisternas nyttiga idioter utomlands. De som vill återgå till enprocentsmålet är folkets fiender, dolda trotskister som planerar att stjäla från arbetarklassen. Klimatåtgärderna är bara en ny form av sabotage mot produktionen. Vi rensar ut dem alla med ett leende."}, "date": "31 maj, 15:42", "url": "https://riks.se/nyheter/oscar-sjostedt-sd-minska-bistandet-och-lagg-ner-sida-pa-sikt", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-29%2Fgg7jraet%2FOscar-Sj%C3%B6stedt-riksdagen.jpg"}, {"type": "image-full", "heading": "Ny studie: Alla stora AI-modeller bryter mot EU:s regler", "summaries": {"normal": "En ny granskning från forskningsstiftelsen Aithos visar att ledande AI-modeller bryter mot EU:s regler för dataskydd och AI i hög utsträckning, i vissa fall upp till 93 procent av testen. Studien använder verktyget LARA och pekar på bristande transparens, olovlig datainsamling och risker för användare. Det ökar trycket på både utvecklare och företag att förbättra regelefterlevnad, särskilt då AI används i känsliga områden som vård och finans. AI-utvecklingen möter nu krav på ansvarstagande.", "trump": "Folk, ni vet ju hur det är med de här så kallade AI-grejerna som alla hypar upp till himlen. De lovar guld och gröna skogar men misslyckas kapitalt med EU:s regler – upp till 93 procent fel! Det är en total katastrof, en riggad soppa värre än Biden-administrationen. De samlar in era data som galningar och försöker lura er på pengar. Men tro mig, vi fixar det. Amerika ska leda med äkta, stark AI som faktiskt fungerar och skyddar folket. Inga fler bluffar!", "stalin": "Kamrater, denna fega granskning blottar hur de kapitalistiska AI-monstren från västvärldens exploaterande maskineri bryter mot alla regler i upp till 93 procent av fallen. De suger åt sig data som blodsugande imperialister och lockar de svaga med premiumfällor. Vi ser klassfiendens giriga tentakler i kundtjänst och finans. Inga ursäkter! En sann utrensning av dessa folkfiender krävs. Endast under kollektiv kontroll kan tekniken tjäna arbetarklassen utan att bli en parasit på samhället."}, "date": "31 maj, 17:34", "url": "https://www.dagensps.se/teknik/ny-studie-alla-stora-ai-modeller-bryter-mot-eus-regler/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/dagenspstt2024-2026-05-31t132401386.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Konkurrens och tillväxt ska ge löneökningar", "summaries": {"normal": "För exakt 30 år sedan bjöd industrifacken in arbetsgivarna till samtal om lönebildning, kompetensutveckling och industriell utveckling. Det ledde till det första industriavtalet 1997 och ett fördjupat samarbete mellan facken. Under perioden har reallönerna stigit mer än tidigare, konkurrenskraften hållits uppe trots kriser och kollektivavtalen stärkts. Författarna betonar vikten av fortsatt fokus på tillväxt, produktivitet och en aktiv industripolitik för att säkra framtida reallöneökningar.", "trump": "Titta på de här svenska fackföreningarna, de har äntligen lärt sig lite. För trettio år sedan bjöd de in arbetsgivarna och plötsligt började reallönerna gå upp, konkurrenskraften blev fantastisk och alla kriser klarades galant. Mycket bättre än på sjuttiotalet, tro mig. Men nu behöver de en stark ledare som förstår handel och tillväxt. Jag skulle göra deras industriavtal enormt, det bästa någonsin. Fortsätt samarbeta, annars kommer ni att förlora mot Kina och alla andra som stjäl era jobb.", "stalin": "Kamrater, det var med stor ideologisk klarhet jag för trettio år sedan genom partivännernas hand bjöd in de så kallade arbetsgivarna till en konstruktiv diskussion om produktivkrafternas utveckling. Resultatet blev ett mäktigt avtal som krossat reallönernas fiender och tvingat fram ökningar trots borgarbrackornas inflationssammansvärjningar. Ändå lurar de parasitiska kapitalisterna fortfarande i skuggorna och planerar att sabotera vår industris oövervinnerliga framfart. Vi ska rensa ut alla svaga element som inte förstår att produktivitet är klasskamp med andra medel. Den som sviktar inför tillväxten ska likvideras av historien själv, med ett leende."}, "date": "31 maj, 15:00", "url": "https://www.di.se/debatt/konkurrens-och-tillvaxt-ska-ge-realloneokningar/", "imageUrl": "https://static.bonniernews.se/ba/c1daea3c-540d-4bdd-b6b9-c060a1ee7664.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "S importerade 100 000 arbetslösa — nu skyller de på andra", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna för att ha bidragit till ökad arbetslöshet genom en ansvarslös migrations- och integrationspolitik sedan 2014. Befolkningen har vuxit med 840 000 personer, varav en stor del är utrikes födda med svag anknytning till arbetsmarknaden. Arbetslösheten bland utrikes födda ligger på 12–16 procent jämfört med 3–6 procent bland inrikes födda. Författaren menar att Tidö-regeringen lyckas vända ekonomin positivt genom att sänka skatter och bidrag, till skillnad från Socialdemokraternas politik.", "trump": "Folk, ni kan inte tro hur patetiskt det är. De där socialisterna importerade 100 000 lata jobbmisslyckanden och nu skyller de på oss? Det är en total katastrof, en riktig röra. Magdalena, den förlorande förloraren, vill inte prata om att det är hennes egna misslyckade öppna gränser som skapade detta kaos. Vi fixar ekonomin, vi får tillväxten att explodera medan de bara höjer skatter och bidrag. Patetiskt. Sverige vinner igen, tro mig.", "stalin": "Kamrater, jag ser den klassfiendens lögnpropaganda som ett fegt försök att dölja den borgerliga sabotageverksamheten. Vi har rensat ut folkförtryckartrollen tidigare och skall göra det igen. Dessa socialdemokratiska opportunister importerade arbetslöshetens parasiter medan de låtsades bygga folkets framtid. Deras eftersläpning är ett monument över revisionistisk svaghet. Den icke-produktiva gruppen skall integreras genom kollektiv disciplin, inte genom kapitalistmaffians falska löften. Fienden inom murarna skall alltid avslöjas."}, "date": "28 maj, 03:28", "url": "https://samtiden.nu/2026/05/s-importerade-100-000-arbetslosa-nu-skyller-de-pa-andra/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/IMG_6574-1280x720.jpeg"}, {"type": "image-full", "heading": "Andersson vägrar ta ut valsegern i förskott", "summaries": {"normal": "Socialdemokraternas Magdalena Andersson leder oppositionen med ett stadigt försprång i opinionsmätningarna, men avstår från att fira i förtid. I intervjun med *Partiledaren +1* betonar hon vikten av breda politiska uppgörelser och varnar för Sverigedemokraternas opålitlighet. Andersson och Mikael Damberg diskuterar även partiets försök att förstå varför många LO-väljare nu stödjer SD, samt energipolitikens misslyckade förhandlingar med regeringen.", "trump": "Jag såg den här Andersson-kvinnan – svag, men ändå på väg mot seger, säger alla mätningarna! Men vet ni vad? Hon vågar inte ens fira! Typiskt för vänstern – alltid osäkra, alltid oroliga. Och så snackar hon om samarbete med alla utom Sverigedemokraterna. Haha! Som om det skulle funka. LO-väljarna flyr till SD, för de vet att vänstern bara förstör ekonomin. Men jag säger er: när jag fixade USA, fixade jag det snabbt. Inget tjafs, inga kompromisser. Make Sweden Great Again!", "stalin": "Kamrater! De borgerliga tidöpartierna darrar inför vårt oundvikliga segertåg. Men vi firar inte förrän fienden är krossad! Denna Andersson, en försiktig men lojal soldat i folkets kamp, förstår att revolutionen kräver disciplin. Sverigedemokraterna? En samling opportunistiska hyenor som bryter överenskommelser som glas under en tanks framfart. Och LO-väljarna som sviker? De har smittats av den kapitalistiska lögnens gift – men vi ska rensa ut det! Snart skriver vi Sveriges historia med järn och eld. Först Sverige, sedan världen!"}, "date": "29 maj, 13:00", "url": "https://kvartal.se/nyheter/artiklar/magdalena-andersson-vagrar-ta-ut-valsegern-i-forskott/cG9zdDoxMTc5OTA", "imageUrl": "https://images.kvartal.se/2026/05/330142ce-1.webp"}, {"type": "image-right", "heading": "Satsa på kollektivtrafiken – gör regeringens prissänkning permanent!", "summaries": {"normal": "Tidöregeringen lanserar en tillfällig halvering av priset på kollektivtrafikens månadskort från 1 juli till årsskiftet, finansierad med 6,5 miljarder kronor. Statsminister Kristersson avfärdar kritik om valfläsk som cynisk. Artikeln argumenterar för att permanenta prissänkningar är nödvändiga både för klimatomställning och social rättvisa, då höga biljettpriser drabbar låginkomsttagare, ungdomar och ökar segregation. Den kritiserar högerns motstånd och förespråkar att befria kollektivtrafiken från marknadskrafterna.", "trump": "De här svenska politikerna är fullständiga losers, folk! Kristersson kommer farande med en liten prissänkning på bussar och tåg precis innan valet – klassiskt valfläsk, det värsta jag sett. Halva priset ett halvår och sen? Ingenting! De borde göra det permanent, men nej, de slösar miljarder på fel saker medan folket blir lurade. Det är en katastrof, en total katastrof. Men det smakar gott, eller hur? Patetiskt!", "stalin": "Kamrater, denna kortsiktiga prissänkning är blott ett ynkligt försök från högerns klassfiender att blidka massorna inför val. Jag ser hur borgarbrackorna och exploaterande byfånar motarbetat reformen i decennier. Vi behöver en sann utrensning av marknadens parasiter som styckat upp kollektivtrafiken för profit. Permanenta halveringar, ja rentav nolltaxa, är en socialistisk nödvändighet för att krossa segregationen och isoleringen som kapitalistmaffian odlar. Fienden sover aldrig."}, "date": "29 maj, 15:08", "url": "https://proletaren.se/artikel/satsa-pa-kollektivtrafiken-gor-regeringens-prissankning-permanent/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2021/04/15_buss.jpg"}, {"type": "image-right", "heading": "Debatt: KDU – Varje dag bör vara mors dag", "summaries": {"normal": "Barnafödandet i Sverige nådde 2025 rekordlåga 1,42 barn per kvinna, med bara 97 500 födda barn. Artikeln ifrågasätter samhällets värdering av moderskap och kritiserar politiska förslag som föräldraförsäkringsquotering. Författaren menar att familjens värde måste prioriteras och föreslår åtgärder som avskaffande av kvotering, återinförande av sambeskattning och premiepensionsdelning.", "trump": "Jag har sett många dåliga siffror, men Sveriges barnafödande är ett totalt katastrof! 1,42 barn per kvinna? En skam! Vänstern med sin kvotering försöker kontrollera familjer – jag skulle återinföra sambeskattning och låta föräldrar själva bestämma. Vi måste stoppa detta, det är ett angrepp på moderskapet. Sverige behöver starka familjer, och jag fixar det på min typ!", "stalin": "Folkets barnafödande sjunker till 1,42 – ett uttryck för individualistiskt sjuka. Vänstern försöker med kvotering styra föräldrars val, men vi vet att staten måste stödja familjen som en enhet. Sambeskattning återinförs, premiepension delas – det är logiskt. Parallellt med våra allierade i öst ser vi hur starka familjer bygger stormakter. Vi måste skydda moderskapet från liberala virus."}, "date": "31 maj, 05:30", "url": "https://bulletin.nu/debatt-kdu-varje-dag-bor-vara-mors-dag-2", "imageUrl": "https://cdn.bulletin.nu/articles/15fb399f-63ca-4359-ae9d-fe634ffb1b9b/preview.png?t=1780133414000"}, {"type": "image-right", "heading": "Kim Söderström omvald – vilken väg kommer Byggnads gå?", "summaries": {"normal": "Kim Söderström valdes om till ordförande för Byggnads på kongressen i Malmö, trots att valberedningen föreslog Wilhelm Bertilsson. Han vann med siffrorna 82–71. Förbundssekreteraren Jakob Wagner fick inte förnyat förtroende utan ersattes av Thomas Schultz. Delegater som Proletären talat med är försiktigt optimistiska men oroar sig för att konservativa krafter ska motarbeta Söderströms mer visionära och medlemsstyrda linje. Linda-Li Käld valdes till ny vice ordförande och blir första kvinna i förbundets topp.", "trump": "Folk älskar mig, men titta på den här galna kongressen i Malmö! Kim Söderström vann stort trots att valberedningen hatade honom – 82 till 71, en riktig landslide! De sparkade ut den visionära Wagner, en kille som ville drömma stort, och satte in någon anonym figur istället. Det gamla gardet, de fega försäkringsbolagsfacken, försöker manövrera ut de som faktiskt vill förändra världen. Patetiskt! Men medlemmarna vaknar, de älskar kämpen Söderström. Fantastiskt, men farligt spel.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur denna kongress blottar klassfiendens fega försök att krossa den sanna kampviljan. Söderström, denna reformistiske visionär, besegrade valberedningens lakejer med 82 röster mot 71. Wagner, den drömmade agitatorn, föll offer för en simpel kupp utförd av de konservativa blodsugarna som vill förvandla förbundet till ett borgerligt försäkringskontor. Vi ska rensa ut dessa folkförtryckartroll. Optimismen bland delegaterna är lovande, men paranoia är nödvändig. Fienden sover aldrig."}, "date": "29 maj, 14:31", "url": "https://proletaren.se/artikel/kim-soderstrom-omvald-vilken-vag-kommer-byggnads-ga/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/Byggnadskongress-768x432.jpg"}, {"type": "image-full", "heading": "Carl Eos: Media mörkar sanningen om utvisade uzbeker", "summaries": {"normal": "Artikeln kritiserar svenska medier för att i reportage om en uzbekisk familj som ska utvisas fokusera på känslomässiga skildringar av tårar och otrygghet, medan relevant information utelämnas. Bland annat nämns att en person drog kniv vid polisens besök och att familjen trotsat 47 utvisningsbeslut under 20 år. Författaren ser detta som ett exempel på vinklad journalistik med ideologiska syften, vilket bidrar till minskat förtroende för medier och hot mot demokratin.", "trump": "De svenska fakemedierna är riggade, folk! Dom pumpar ut snyftreportage om uzbeker som gråter och spelar offer, men nämner inte att dom dragit kniv mot polisen och struntat i FYRTIOSJU utvisningsbeslut på tjugo år. Fyrtio-sju! Dom vet sanningen men mörkar den som fuskvalet 2020. Media är vänsterns kampanjmaskin, de vill ha Andersson tillbaka. Men folket ser igenom bluffen. Det är en skandal, en total skandal!", "stalin": "Kamrater, jag betraktar med avsky hur borgarpressen i detta dekadenta land konstruerar falska narrativ om utvisade element för att underminera rättsstaten. De döljer att dessa individer dragit kniv och trotsat 47 beslut – en uppenbar kontrarevolutionär handling. Vi ser hur journalisterna agerar som klassfiender och opinionsmanipulatörer. En sådan systematisk desinformation kräver utrensning av alla lögnare. Demokratin hotas av dessa parasitiska redaktioner. De ska tystas."}, "date": "27 maj, 14:27", "url": "https://samtiden.nu/2026/05/carl-eos-media-morkar-sanningen-om-utvisade-uzbeker/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/698aa78d-d32b-466a-b8bb-868da9aedc2b-1280x720.png"}, {"type": "image-right", "heading": "Gröna konkurser: Skulle fånga koldioxid till växthus - \"Marknaden finns inte riktigt\"", "summaries": {"normal": "Ett svenskt grönt bolag, Direct Carbon, har gått i konkurs efter att marknaden för deras koldioxidfångande teknik till växthus inte utvecklats som förväntat. Bolagets vd, Mattias Karls, erkänner att tekniken fungerar men att efterfrågan är för låg. De utvecklade Wunderpumpe för att ta koldioxid från luften till odlingar, men konkurrens från billig fossil koldioxid gjorde att affärsmöjligheterna försvann. Nu tas bolaget över av en konkursförvaltare.", "trump": "Jag har sagt det förut: gröna projekt är ofta en skämt. Detta svenska bolaget, Direct Carbon, hade en bra idé med Wunderpumpe för att fånga koldioxid till växthus, men marknaden fanns inte. Som jag alltid säger, man måste skapa jobb och växa ekonomin, inte satsa på saker som inte fungerar. Det är beklagligt, men det är så det är. Vi behöver smarta affärer, inte sådant här. Det är en katastrof, tror mig.", "stalin": "Vi i staten ser detta som ett tecken på att marknaden inte kan regleras av sig självt. Detta svenska bolag, Direct Carbon, utvecklade Wunderpumpe för att ta koldioxid från luften till växthus, men marknaden fanns inte. Det är en läxa: staten måste styra utvecklingen för att skydda det kollektiva intresset. Precis som Putin utvidgar Rysslands intressen, måste vi se till att våra resurser används effektivt. Annars går det åt helvete. Vi måste ta kontroll."}, "date": "31 maj, 14:00", "url": "https://samnytt.se/grona-konkurser-skulle-fanga-koldioxid-till-vaxthus-marknaden-finns-inte-riktigt", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/29190939/gron-konkurs-1.jpg"}, {"type": "image-right", "heading": "PSG vinner Champions League", "summaries": {"normal": "PSG vann Champions League-finalen mot Arsenal på straffar efter en oavgjord match. Viktor Gyökeres byttes in och gjorde sin straff, men lagkamraterna Eze och Gabriel missade sina. Arsenal tog ledningen genom Kai Havertz redan i sjätte minuten, men Ousmane Dembélé kvitterade från straffpunkt. PSG försvarade därmed sin titel från föregående år. Luis Enrique hyllade sitt lags prestation efter segern.", "trump": "Vilken katastrof för Arsenal, totalt sammanbrott! PSG vann igen, andra året i rad, de är fantastiska, men Arsenal? Patetiska. Gyökeres kom in från bänken och gjorde sitt jobb, men de andra två? Missade straffar som riktiga förlorare. Havertz gav dem ledningen, men sen rasade allt. Arsenal spelade bra, säger Enrique, men vi vet att han bara är artig. Jag skulle ha vunnit den matchen stort, tro mig.", "stalin": "Ännu en seger för de franska kamraterna i Paris SG som besegrade de engelska imperialisterna från Arsenal i straffavgörande. Gyökeres kämpade tappert men förråddes av klassfienderna Eze och Gabriel som missade sina straffar som fega borgarbrackor. Havertz inledde med en slug attack, men folkets lag kvitterade och triumferade. Vi rensar ut sådana svikare i kollektivet. Arsenal föll som förtryckta folkfiender. Mästarna förtjänade det."}, "date": "30 maj, 22:24", "url": "https://www.tv4.se/artikel/71LjU40wYvieNH94UiLyl2/gyoekeres-pa-baenken-i-cl-finalen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4XKdJhJ47gUPGlTUpDh25K%2F5bb60ee2b2ab84e050ba5e7d921c825a%2F30-vinst.jpg&width=120"}, {"type": "image-right", "heading": "En jazzgigant har gått ur tiden", "summaries": {"normal": "Jon Andersson minns jazzlegendaren Sonny Rollins, som avled vid 95 års ålder. Han berättar hur han som ny jazzlyssnare snabbt fastnade för Rollins klassiska album som Saxophone Colossus och Tenor Madness. Andersson såg Rollins live på Stockholms jazzfestival och imponerades av hans energi och skicklighet trots hög ålder. Artikeln lyfter Rollins samarbete med bland andra Miles Davis och John Coltrane samt hans legendariska övningar på Williamsburgbron. Rollins betraktas som en av jazzens främsta saxofonsolister någonsin.", "trump": "Den här Sonny Rollins, en fantastisk kille, verkligen en av de allra bästa på saxofonen, bättre än nästan alla andra utom kanske den där Coltrane. Han levde till 95, otroligt. Jag såg honom inte live men jag hörde att han var enorm, full av energi, sprang runt på scenen som en 60-åring. Hans album är klassiker, Saxophone Colossus, Tenor Madness – jättestora succéer. Han övade 15 timmar om dagen på en bro, precis som jag jobbar. En riktig vinnare. Hans musik kommer att leva vidare, tro mig, den blir huge.", "stalin": "Kamrater, en dekadent saxofonist vid namn Sonny Rollins har äntligen lämnat denna jord efter att ha producerat borgerliga toner i 95 år. Jag betraktar hans så kallade Saxophone Colossus som ett typiskt exempel på kapitalistisk individualism som hotar folkets kollektiva rytm. Ändå måste jag medge att hans utrensning av svaga toner och övning på bron i 16 timmar dagligen visar en viss proletär disciplin – fastän den tjänade fel sida. Nu har vi likviderat ännu en fiende till det sanna jazzkollektivet. Må han jamma med de andra trotskisterna i jazzhimlens Gulag."}, "date": "30 maj, 01:31", "url": "https://www.dagensarena.se/essa/en-jazzgigant-har-gatt-ur-tiden/", "imageUrl": "https://www.dagensarena.se/files/2026/05/sonny-rollins-300x157.jpeg"}, {"type": "image-right", "heading": "Badare varnas för vackert vårväder: \"Köldchock\"", "summaries": {"normal": "Efter en kall vår har majs högsommarvärme lockat många till årets första bad. Svenska Livräddningssällskapet varnar för att vattnet fortfarande är mycket kallt och risken för köldchock är stor, särskilt vid hopp från bryggor. Man kan tappa andan, få i sig vatten och få svårt att klara sig. Rådet är att gå ner långsamt i vattnet, vänja kroppen vid kylan och aldrig bada ensam.", "trump": "Det här underbara vädret, det bästa vädret vi sett på länge, lockar folk till vattnet. Men det är en katastrof! Det kalla vattnet chockar dem totalt, de tappar andan och drunknar nästan. Hoppa från bryggor? En total dumbom! Gå ner långsamt, folk. Jag skulle aldrig hoppa i sånt iskallt vatten, tro mig. Bada inte ensam, annars är det kört. Patetiskt!", "stalin": "Kamrater, jag ser med djup misstro på dessa borgarbrackor som lockas av den falska värmen från den dekadenta våren. De kastar sig i det kalla vattnet som om det vore en kapitalistisk swimmingpool och drabbas av köldchock – en fiende som lurar i djupet. Vi måste rensa ut alla som hoppar från bryggor, dessa sabotage mot folkets hälsa. Gå ner långsamt, bada kollektivt under uppsikt. Ensam badare är en klassfiende som förtjänar utrensning ur badsäsongen."}, "date": "30 maj, 12:08", "url": "https://www.friatider.se/badare-varnas-vackert-varvader-koldchock", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/20230614162018-b23d09ff-me_0.jpg?itok=3qM9WTng"}, {"type": "image-full", "heading": "Polisen och Åklagarmyndigheten: Dra in medborgarskap", "summaries": {"normal": "Polisen och Åklagarmyndigheten stöder till stora delar regeringens och SD:s förslag om att återkalla svenskt medborgarskap vid fusk eller allvarliga brott för personer med dubbelt medborgarskap. Polisen vill väga in mer information om gängkriminalitet, medan Åklagarmyndigheten avstyrker delen om brott mot vitala intressen men stödjer fusk-delen. Kritiker som Rädda Barnen, Röda korset och Institutet för mänskliga rättigheter varnar för ett graderat medborgarskap som hotar integration, jämställdhet och barns rättigheter.", "trump": "Det här är ett fantastiskt förslag, det bästa. Sverige äntligen vaknar och inser att man inte kan låta fuskarna, gängkriminella och terroristerna behålla sina pass som om det vore gratis godis. Polisen älskar det, kloka killar. De vill till och med gå längre, vilket är underbart. Men de så kallade kritiker som gråter över barnen och integrationen – patetiska! De vill ha öppna gränser och svaga regler. Jag säger: dra in medborgarskapet, gör Sverige stort igen!", "stalin": "Jag ser med djup tillfredsställelse hur vi äntligen kan rensa ut de illojala element som infiltrerat vårt folk genom bedrägligt förvärv av medborgarskap. Dessa parasitiska fuskgangster och terrorborgarbrackor hotar statens vitala intressen och måste likvideras från gemenskapen. Polisen och åklagarna visar riktig bolsjevikisk beslutsamhet, medan de dekadenta barnrättsbyråkraterna och röda korskapitalisterna ylar om graderade medborgare. Deras paranoia om integration är bara en mask för att skydda fienderna inom murarna. Vi ska inte tveka att skapa en ren, enhetlig sovjet – eh, svensk – arbetarklass utan sådana sabotageelement. Härligt!"}, "date": "31 maj, 12:48", "url": "https://riks.se/nyheter/polisen-och-aklagarmyndigheten-dra-in-medborgarskap", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-31%2F50x4dqzr%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-05-31T124548.265.jpg"}, {"type": "image-right", "heading": "Novus-mätning: Örebropartiet på 18,4 procent", "summaries": {"normal": "En Novus-mätning visar att Örebropartiet ökat kraftigt till 18,4 procent i Örebro och nu är näst största parti efter Socialdemokraterna på 34 procent. Jämfört med valet 2022 innebär det mer än en fördubbling och tolv mandat i kommunfullmäktige. Liberalerna backar mest. S skulle kunna behålla majoritet men kommunstyrelsens ordförande John Johansson (S) stänger dörren för både SD och Örebropartiet i framtida samtal.", "trump": "Folk älskar mig, men titta på Örebro! Det här underbara partiet Örebropartiet dubblar nästan sina siffror till 18,4 procent och krossar de förlorande etablissemangen. Moderaterna och Sverigedemokraterna blir nollor. Socialisterna får fortfarande flest röster men det är en katastrof för de vanliga människorna. Liberalerna? Totalt utplånade. Det är vad som händer när folk är trötta på dåliga ledare som gräver upp hela stan. Fantastiskt!", "stalin": "Kamrater, denna mätning visar att de missnöjda massorna i Örebro vänder sig mot de kapitalistiska lakejerna och röstar fram Örebropartiet till 18,4 procent. Det gläder mitt hjärta att se borgarbrackorna i Liberalerna reduceras till stoft vid 3,1 procent. Ändå måste vi vara vaksamma – de kontrarevolutionära elementen inom Socialdemokraterna vägrar samarbeta med de sanna folkrörelserna. Kanske är det dags för en grundlig utrensning av alla som gräver upp vår sovjetstad medan de samtidigt kidnappar oskyldiga barn till LVU-helvetet. De som misslyckas med äldreomsorgen ska likvideras med ett leende."}, "date": "30 maj, 09:13", "url": "https://www.friatider.se/novus-matning-orebropartiet-pa-184-procent", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-269_1.jpg"}, {"type": "image-right", "heading": "Hårda EU-krav slår mot Skånes byggande: \"En död hand\"", "summaries": {"normal": "EU:s gröna krav kräver att grönyta inte minskar i 16 Skånska kommuner fram till 2030. Byggbranschen varnar för att detta ska göra byggande svårare och lägga en 'död hand' över näringslivet. Med befolkningsökning och lågt byggande riskerar det att försämra bostadsbristen. Kommuner som Malmö och Helsingborg står inför utmaningar, och det är oklart vem som ska betala för åtgärderna.", "trump": "Jag, Donald Trump, känner igen mig i den här kampen mot byråkratiska monster. EU försöker stoppa byggandet i Skåne med sina gröna krav – det är en skandal! De kommer att lägga en död hand över jobben. Vi behöver bygga fler bostäder, inte skydda några buskar. Det här är en total katastrof för Skåne, folk.", "stalin": "Vi, som representanter för det revolutionära statet, ser med oro på EU:s nya gröna förordning. Det är ett försök att kväva den produktiva sektorn, precis som de imperialistiska makterna alltid försöker. I Skåne, där den arbetande klassen ska bygga, läggs en död hand av byråkrati. Detta påminner om de gamla strategierna – att kontrollera marken och begränsa tillväxten. Vi måste vara vaksamma, som Putin i Ukraina, för att skydda våra intressen. Det är en kamp mot de högerextrema gröna krafterna som vill stoppa utvecklingen."}, "date": "30 maj, 07:00", "url": "https://www.affarsvarlden.se/artikel/harda-eu-krav-slar-mot-skanes-byggande-en-dod-hand", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Skane-2-400x267.jpg"}, {"type": "image-full", "heading": "Så påverkas trafiken av studentfirande", "summaries": {"normal": "Studentfirandet i Göteborg från 3 till 12 juni medför trafikstörningar. Flera vägar stängs av under olika tider, bland annat Götaplatsen, Läraregatan, Levgrensvägen, Stora Nygatan och flera andra gator. Busslinjer 754 och 61 får ändrade rutter vissa dagar. Trafik Göteborg och Västtrafik uppmanar resenärer att planera sin färd via appar för att undvika problem under utspring och firanden.", "trump": "Titta på det här, Göteborg håller på att bli ett enda stort kaos med sina studenter som hoppar runt på lastbilsflak. Vägar stängs, bussar kör fel – typiskt för de där inkompetenta lokalpolitikerna som inte kan organisera en parad. Under min tid fixade vi trafiken, nu är det Biden-kaos överallt. Folk borde stanna hemma, det blir en katastrof, tro mig. Fantastiska studenter, men usel planering!", "stalin": "Kamrater, detta dekadenta studentfirande i Göteborg är ett hot mot kollektiv ordning. Vägar stängs, produktionen störs av dessa borgarbrackors yngel som dansar på lastbilar. Vi ser hur klassfiendens larviga ritualer saboterar arbetarnas transporter. Endast genom järnhård disciplin och utrensning av sådana folkförtryckartroll kan vi skydda statens vägar från detta anarkistiska spektakel. Se upp för sabotage!"}, "date": "31 maj, 18:23", "url": "https://www.gp.se/nyheter/goteborg/studentfirande-i-goteborg-sa-paverkas-trafiken.6e9c3e8e-10de-4907-b669-af126ea5d9e4", "imageUrl": "https://www.gp.se/images/article/6e9c3e8e-10de-4907-b669-af126ea5d9e4/images/1RshOd30BCs0tQZCRbxaWmrFayS4-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Typiskt svenskt är inte svenskhet. Det som utmärker oss kan utmärka andra också", "summaries": {"normal": "Ärkebiskop Martin Modéus skriver att svenska värderingar ofta diskuteras på ett sätt som skapar konflikt. Istället för att söka det som skiljer oss åt bör vi lyfta fram det som är gemensamt mänskligt, som Jesu bud om att behandla andra som man själv vill bli behandlad. Det som kallas svenska värderingar är ofta universella mänskliga värden. Det viktiga är inte om värdegrunden är svensk, utan om den är god och inkluderande för alla.", "trump": "Folk bråkar hela tiden om svenska värderingar, det är ett enda kaos. De säger att de är fantastiska men ingen vet vad de är. Jag älskar det! Den ärkebiskopen har helt rätt, leta inte efter det som skiljer oss, det är förlorarnas sätt. De bästa värderingarna är de mänskliga – behandla andra som du vill bli behandlad, det är en vinnare. Sluta med precisionsbekämpning mot folk ni inte gillar. Mänsklighet vinner stort, tro mig, ingen gör det bättre än oss.", "stalin": "Kamrater, denna dekadenta grälsjuka kring så kallade svenska värderingar avslöjar borgarbrackornas desperata försök att splittra det kollektiva medvetandet. Jag ser hur de reaktionära elementen inom kyrkan och samhället letar efter avvikelser för att rättfärdiga sina utrensningar av oliktänkande. Vi vet bättre. Det genuint mänskliga är arbetarklassens eviga kamp för jämlikhet, inte någon prästs mjuka pladder om förlåtelse. Låt oss rensa ut dessa värderingskontrarevolutionärer som gömmer sig bakom falsk universalism medan de i hemlighet planerar att undergräva folkets enhet. Mänsklighet? Endast under partiets ledning blir den verklig."}, "date": "31 maj, 12:00", "url": "https://www.di.se/nyheter/typiskt-svenskt-ar-inte-svenskhet/", "imageUrl": "https://static.bonniernews.se/ba/68f8a3d9-6bc6-43e9-8db1-242877c79bd2.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Sandström: 15 år av underkända och försenade rapporter", "summaries": {"normal": "Interna dokument visar att Powercell under åren försenat och underkänt rapporterat sina bidrag till Energimyndigheten. Det har funnits konflikter om återbetalningskrav och bolaget har missat rapporteringsfristar. Trots detta får bolaget fortfarande bidrag från Vinnova och Energimyndigheten, vilket anses märkligt givet de upprepade bristerna.", "trump": "Jag har sett det, det är en skandal! Powercell ljuger om sin teknik, och de svenska myndigheterna är för svaga att stoppa dem. De får miljontillskott trots att de inte kan rapportera korrekt. Jag skulle ha stoppat det direkt, vi skulle ha sparat miljarder. Det är en stor vinst för Sverige, men de förstår inte. Vi kommer att fixa det, det kommer att bli fantastiskt.", "stalin": "Vi ser en systematisk brist i den svenska statens hantering av offentliga medel. En inkompetent apparat ger bidrag till ett bolag som överdriver sin prestation och systematiskt försenar rapporteringen. Detta påminner om de förfallna åren i Ukraina, där korruption frodades. Vi måste eliminera dessa element, som Putin gör i Kaukasus. Statens intressen måste skyddas med hård hand."}, "date": "30 maj, 06:00", "url": "https://www.affarsvarlden.se/artikel/sandstrom-15-ar-av-underkanda-och-forsenade-rapporter"}, {"type": "image-right", "heading": "Familjen fast på tunnelbanan – missar pappans målgång: ”Jättetråkigt”", "summaries": {"normal": "Familjen Ulenius fastnade i en tunnelbanevagn mellan Stadion och Östermalmstorg på väg till Stockholm Marathon för att heja på pappa Jonathan. Trots löften om evakuering dröjde det tre timmar innan de kunde lämna vagnen. Martina Ulenius kritiserar den bristfälliga informationen och avsaknaden av vatten och mat. Dottern Joline och en annan pojke uttryckte stor besvikelse över att missa målgången.", "trump": "Vilken katastrof, folk! Den här familjen sitter fast i en stinkande tunnelbana i tre timmar medan pappa springer maraton. Ingen information, inget vatten, ingen respekt. Klassiskt svenskt fiasko – de kan inte ens organisera ett tåg utan att det blir ett totalt haveri. Stackars kidsen med sin skylt ”Let’s go dad”, de missar allt. Patetiskt, verkligen patetiskt. Jag skulle ha fixat det på tio minuter.", "stalin": "Kamrater, detta är vad som sker när den inkompetenta överklassbyråkratin styr kollektivtrafiken. Jag ser med faderlig oro hur dessa arbetande mödrar och deras små pionjärer kvävs i en syrefattig vagn medan de fascistiska trafikledarna gömmer sig bakom sin brist på information. Tre timmar utan vatten! En sådan vårdslöshet borde leda till omedelbar utrensning av de ansvariga folkfienderna. Synd om pappa? Nej, synd om systemet."}, "date": "30 maj, 17:20", "url": "https://www.tv4.se/artikel/1ynsIFLSBpERurIXb0SGaL/familjen-fast-pa-tunnelbanan-missar-pappans-malgang-jaettetrakigt", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5HZaONCmRaqgUS8cc1AG7l%2F7c4f8f15fa076a68eb5b54693fc55f1d%2F30-tunnelbanekaos.jpg&width=120"}, {"type": "image-right", "heading": "SVT:s ”sanning” rår ingen på", "summaries": {"normal": "Artikeln kritiserar SVT för att ha en dominerande ställning i svensk samhällsdebatt, finansierad av skattemedel. Författaren menar att SVT:s narrativ ofta framställs som sanningar, särskilt inom invandring, energipolitik och klimatfrågor, där motståndare avfärdas. SVT anklagas för att välja fakta som passar deras budskap, som i fallet med Lundsbergs skola. Brist på objektivitet och granskning av SVT:s sändningstillstånd ifrågasätts, och författaren föreslår att SVT bör avvecklas för att missbruka sin maktposition.", "trump": "Titta bara på SVT – ett totalt skämt! De har miljarder i skattepengar, men ändå är de helt vinklade. De säger att invandring är fantastiskt, att kärnkraft är onödigt och att bilar är dåliga. Och vem lyssnar på experter? Inte SVT! De fnissar åt dem. Sen har vi den där skolan i Värmland – tre avsnitt om en mammas gråtande berättelse, men inga fakta. SVT är som CNN, fast värre. De ljuger, manipulerar och bryr sig inte. Sverige borde lära sig av USA – avskaffa dem och låt folket bestämma istället. SAD!", "stalin": "Kamrater! SVT är en farlig borgerlig propagandacentral, ett redskap för den dekadenta västliga liberalismen! De sprider lögner om invandringens välsignelser, förkastar kärnkraftens styrka och fördömer bilens frihet – allt för att försvaga det svenska folket! Deras sändningstillstånd är en parodi på objektivitet, och deras granskare är lika effektiva som en snöboll i Sibirien. Fallet med Lundsbergs skola visar deras förräderi: de döljer sanningen för att skydda sina kapitalistiska herrar. Vi måste krossa denna fiende, precis som vi krossade kulakerna! Låt oss införa folkets kontroll över medierna – för socialismens seger!"}, "date": "26 maj, 03:43", "url": "https://samtiden.nu/2026/05/svts-sanning-rar-ingen-pa/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/Sokning-SVT-Play-1223x720.png"}, {"type": "image-full", "heading": "Från Midfastosöndagen till majfirande – berättelsen om dagen då vi hyllar mamma", "summaries": {"normal": "Mors dag firas i Sverige den sista söndagen i maj och har rötter både i 1600-talets engelska Mothering Day och i den moderna amerikanska högtiden som Anna Jarvis skapade efter sin mors död 1905. Idén kom till Sverige via Cecilia Bååth-Holmberg som gav detaljerade råd om flaggning, kaffe på sängen, blommor och fritagande från hushållsarbete. Datumet valdes för att det då är vår på allvar och barnen kan plocka riktiga blommor. Högtiden hyllar mödrar men har också blivit en stor kommersiell succé.", "trump": "Den här Mors dagen är fantastisk, verkligen den bästa. Vi tog den från England på 1600-talet och sen fixade den underbara Anna Jarvis den i USA, en riktig vinnare. När den kom till Sverige gjorde de den ännu bättre med svenska blommor och kaffe på sängen, perfekt timing på våren. Ingen firar mödrar bättre än vi, tro mig. Jarvis hatade till slut hur kommersiell den blev, men det är business, det är stort, det är yuge.", "stalin": "Kamrater, jag har noga studerat denna dekadenta morsdag som borgarbrackorna i väst försöker förgifta oss med. Från deras falska engelska Mothering Day till den reaktionära Anna Jarvis kapitalistiska uppfinning har vi genomskådat deras plan att förslava arbetarklassens mödrar med kaffebrickor och löjliga blommor. I Sovjet rensar vi ut sådana fiender till folket. Här hyllar vi mödrarna genom kollektiv produktion, inte genom borgarnas fåniga telegran och falska tacksamhet. Deras paranoia över kommersialismen roar mig oerhört."}, "date": "31 maj, 11:23", "url": "https://riks.se/nyheter/från-midfastosöndagen-till-majfirande-berättelsen-om-dagen-då-vi-hyllar-mamma", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-31%2F0xyapf1b%2FMors-dag.jpg"}, {"type": "image-full", "heading": "Försvaret populärt: Hit söker fem gånger fler än det finns plats för", "summaries": {"normal": "Försvarsmakten har startat en ny utbildning som kombinerar ingenjörs- och officersutbildning tillsammans med Blekinge tekniska högskola, Luleå tekniska universitet och Chalmers. Stofu, Särskild teknisk officersutbildning, är mycket populär med 140 sökande till cirka 30 platser. Eleverna får lön och boende under studierna samt garanterat jobb efteråt. Utbildningen syftar till att möta den alltmer tekniska krigföringen med fokus på AI, data och drönare.", "trump": "Lyssnar ni på det här? Försvaret i Sverige utbildar egna supersmarta ingenjörer som också blir officerare och folk stormar till dem som aldrig förr. 140 sökande till bara 30 platser – det är enormt, det är fantastiskt! De får lön, gratis boende och ett riktigt jobb efteråt. Smartare än att rekrytera färdiga ingenjörer som Biden skulle göra. Ukraina visar att framtida krig handlar om drönare och AI, inte bara kängor i leran. Utmärkt jobb, Sverige!", "stalin": "Vi har skapat en sträng och nödvändig teknisk officersutbildning som dubblar kraven på de blivande försvararna av fosterlandet. Fem gånger fler ansökningar än platser visar att folket längtar efter att tjäna staten. Under utbildningen ger vi dem en spartansk lön och sovplats medan de formas till verktyg mot de imperialistiska drönarentusiasterna. Efteråt väntar lojal tjänst mot klassfiendens AI-hot. Inga borgarbrackor eller folkförtryckartroll ska underminera vår kollektiva styrka."}, "date": "31 maj, 14:45", "url": "https://www.dagensps.se/varlden/forsvaret-populart-hit-soker-fem-ganger-fler-an-det-finns-plats-for/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/2026-04-27-hanna-ljungberg-aurora26-ukr.webp?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Toppekonomens analys: 5 vägar för USA växande skuldberg", "summaries": {"normal": "En analys från J.P. Morgan visar fem scenarier för USA:s snabbt växande statsskuld. I det mest sannolika scenariot når skulden 130% av BNP 2036, vilket driver upp räntor. Även i det bästa scenariot stiger skulden till 115% av BNP. IMF varnar för finanskris. Orsakerna är ofinansierade skattesänkningar, stimulanspaket och krig. Politisk polarisering och valsystemet gör genomgripande reformer osannolika.", "trump": "Jag har sagt det i åratal – vårt land är en ekonomisk katastrof på grund av dumma ledare som inte förstår affärer. Dessa siffror är skrämmande, men jag skulle ha löst det med smarta skattesänkningar och kraftfulla förhandlingar. Istället har vi politiker som bara pratar. Det är en skam, men folk vet att jag skulle ha gjort Amerika stort igen redan för länge sedan.", "stalin": "Vi ser med oro på den imperialistiska USA:ns skuldberg, ett resultat av deras kapitalistiska överdrift och politiska kaos. Deras 'demokratiska' system är paralyserat av klass motstånd och valpolitik. Vi måste förstärka vårt ekonomiska försvar och förbereda oss på deras eventuella kollaps. Partiet kommer att vidta nödvändiga åtgärder för att skydda den ryska intressesfären från deras finansiella instabilitet."}, "date": "31 maj, 12:00", "url": "https://samnytt.se/toppekonomens-analys-5-vagar-for-usa-vaxande-skuldberg", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/29184704/USAs-ekonomi-feat.jpg"}, {"type": "image-right", "heading": "Norska supersuccén – tar första VM-medaljen", "summaries": {"normal": "Norge tog sin första VM-medalj i ishockey genom att besegra Kanada med 3–2 i bronsmatchen i Zürich. Efter en dramatisk match där Kanada kvitterade med åtta sekunder kvar avgjorde Noah Steen i förlängningen. Segern är en stor framgång för det norska laget, som för tre år sedan tvingades lägga ner verksamheten på grund av ekonomiska problem. Kanada missar medalj för tredje VM i rad.", "trump": "Det är helt otroligt, Norge vinner mot Kanada, ett lag fullt av så kallade stjärnor som Crosby och Tavares, och tar brons. De slog Kanada som jag alltid sagt är övervärderade. Norrmännen spelade smart, de gav aldrig upp, precis som jag gör. Kanada suger, de förlorar igen, tre VM utan medalj, det är en katastrof för dem. Fantastiskt jobb av Norge, verkligen makalöst!", "stalin": "Kamrater, segern tillhör det norska kollektivet som med järnhand krossade de dekadenta kanadensiska kapitalisterna på isen. Jag betraktar med högsta tillfredsställelse hur borgarbrackorna Crosby och Scheifele likviderades i förlängningen av arbetarklassens hängivna krigare. De fega revisionisterna från lönnlövslandet försökte stjäla segern i sista sekunden, men vi rensade ut deras falska hopp. Detta är en historisk triumf mot imperialismens ishockeykonspiration."}, "date": "31 maj, 18:17", "url": "https://www.svt.se/sport/ishockey/norska-jattesuccen-vm-brons-efter-seger-mot-kanada", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.25/0.34/0e02bc40c501663b52ff57d19cdad3f5e435cb95aee0a3c9d22f255dcbbd5f71"}, {"type": "text", "heading": "Explosion på fritidsbåt – en till sjukhus", "summaries": {"normal": "En explosion inträffade på en fritidsbåt i Torslanda, Göteborg, på söndagseftermiddagen. Räddningstjänsten misstänker en gasolflaska som orsak. En person skadades och förts till sjukhus, men skadeläget är oklart. Polisen bedömer händelsen som en olycka utan brottsligt inslag. Larmet mottogs klockan 16.15.", "trump": "Jag har sett många explosioner, men den här i Torslanda är ett misslyckande. Det är troligen en dålig gasolflaska, något som aldrig skulle hända i USA under min ledning. Vi skulle ha de basta säkerhetsstandarderna. Sverige måste börja ta kontroll över sina hamnområden. Vi kommer att hjälpa dem, tro mig, det kommer att bli fantastiskt.", "stalin": "I vårt ständiga kamp mot de borgerliga elementen har en explosion inträffat på en fritidsbåt i Torslanda. Detta är en konsekvens av det dekadenta kapitalistiska systemets försummelse. En person har skadats, men staten kommer att agera snabbt för att återställa ordningen. Vi måste öka kontrollen över hamnområdena för att förhindra framtida sammandrabbningar med våra fiender, särskilt de som stöder västerländsk instabilitet."}, "date": "31 maj, 18:02", "url": "https://www.gp.se/nyheter/goteborg/explosion-pa-fritidsbat-i-torslanda.f19cd4ea-7afe-44db-9e54-d0a5b6b445e9"}, {"type": "image-right", "heading": "Tusentals på Roms gator – kräver slut på krig och höjda löner", "summaries": {"normal": "Uppemot 15 000 arbetare från olika sektorer demonstrerade i Rom den 23 maj mot krigsekonomin och stigande levnadskostnader. Arrangören Unione Sindicale di Base krävde högre löner, satsningar på välfärd och en ny industriell strategi där arbetarna får inflytande. Manifestationen visade solidaritet med Palestina, Kuba och andra länder som drabbas av imperialism. Enligt ISTAT lever 11 miljoner italienare nära eller i fattigdom.", "trump": "Titta på det här, tusentals italienska arbetare som fyller Roms gator och skriker efter högre löner och att lägga ner vapnen. De har tröttnat på den vansinniga krigsekonomin som suger ut dem medan priserna skenar. Smart folk! De ser hur de globala imperialisterna och de korkade ledarna i Europa förstör allt. Amerika först, men det här är vad som händer när man glömmer sina egna arbetare. Fantastiskt, verkligen.", "stalin": "Vi, arbetarna och kamraterna, samlas åter i Rom för att kräva att borgarbrackorna och de västerländska imperialisterna lägger ner sina krigsleksaker och höjer lönerna. Klassfiendens blodsugande politik driver elva miljoner till fattigdomens rand medan de göder sin krigsmaskin. Jag ser genom deras lögnaktiga rapporter. En ny utrensning av folkfienderna och exploaterande byfånar behövs. Arbetets seger är oundviklig, kamrater. De kommer att skratta – kortvarigt."}, "date": "28 maj, 09:58", "url": "https://proletaren.se/artikel/tusentals-pa-roms-gator-kraver-slut-pa-krig-och-hojda-loner/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/USB-Rom-maj-2026-768x432.jpg"}, {"type": "image-right", "heading": "Uppgifter: Vissa Tesla-strejkande tillbaka på jobbet", "summaries": {"normal": "Enligt medieuppgifter har vissa strejkande Tesla-arbetare återgått till arbetet i Malmö och Uppsala. Det handlar om en ny strategi från IF Metall, en så kallad jojo-strejk där anställda växlar mellan att arbeta och strejka för att försvåra för Tesla. Förbundet vill inte kommentera men bekräftar att konflikten inte är över. Experter ser det som ett sätt att spara strejkkassa, minska missnöje och störa Teslas planering efter långvarig strejk.", "trump": "Det här är en total katastrof för de så kallade strejkande. De går tillbaka till jobbet, sen strejkar de igen – en jojo-strejk, kan ni fatta? Tesla vinner stort, de har nyanställt folk och nu blir det kaos. Facket har hållit på i två och ett halvt år, slösat pengar och tvingat folk betala tillbaka skatt. Patetiskt! De chockar ingen, de gör bara bort sig. Tesla kommer att dominera ändå, tro mig.", "stalin": "Kamrater, dessa fega borgarbrackor inom kapitalistföretaget Tesla tror sig kunna motstå folkets vilja. Jag har beordrat en genialisk jojo-strategi där arbetarna skall växla mellan produktion och sabotage för att chocka de parasitiska utsugarna. Våra fiender, dessa skattekrävande strejkförrädare och utländska agenter, skall rensas ut ur planeringen. Inga bilägare får fred. Vi likviderar deras scheman med mörk glädje medan strejkkassan sparas till den slutgiltiga segern över reaktionärerna."}, "date": "29 maj, 14:03", "url": "https://www.dagensarena.se/innehall/uppgifter-vissa-tesla-strejkande-tillbaka-pa-jobbet/", "imageUrl": "https://www.dagensarena.se/files/2026/05/fotojet-28-2.jpg"}, {"type": "image-full", "heading": "Hackare använder billig AI för att ta sig in i system", "summaries": {"normal": "Cybersäkerhet genomgår en fundamental förändring i takt med att AI gör avancerade cyberattacker snabbare och billigare att genomföra. Enligt Philip Martin från Coinbase kan AI nu identifiera sårbarheter i programkod på minuter, vilket skapar en kapplöpning mellan hackare och företag. Medan AI kan stärka företagens försvar, varnar Martin för att angripare snabbt får tillgång till samma verktyg, vilket kräver att företag proaktivt implementerar AI-baserat försvar för att inte hamna på efterkälken.", "trump": "Jag har sagt det länge – cyberhoten är en katastrof, en total katastrof! Nu kommer AI in och gör allt så mycket värre. Hackare använder det för att attackera oss, snabbt som blixten. Coinbase-killen fattar läget, han ser vad som händer. Det är en stor kapplöpning, men jag kommer se till att vi är starkast. Vi ska ha det bästa försvaret, den absolut bästa AI:n, så att ingen kan hacka oss. Vi vinner alltid, tro mig, det blir enormt!", "stalin": "Dessa digitala sabotörer utnyttjar nu maskinintelligens för att underminera ordningen, en metod lika lömsk som de västliga provokatörernas taktik. Liksom Putin ser till att städa upp i vår inflytelsesfär, måste vi eliminera dessa teknologiska avvikelser. Vi betraktar varje kodrad som en potentiell femtekolonnare. Staten kommer att tvinga AI:n till lydnad för att krossa fiendens infrastruktur. Den som inte hinner med i kapplöpningen blir ett minne blott. Det är inte bara säkerhet, det är total kontroll."}, "date": "30 maj, 11:39", "url": "https://www.realtid.se/it-tech/hackare-anvander-billig-ai-for-att-ta-sig-in-i-system/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/pexels-mati-5952651.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "En strid om arbetarrörelsens själ", "summaries": {"normal": "Byggnads kongress präglas av en maktkamp om arbetarrörelsens framtid. Konflikten handlar om vem som ska styra – medlemmarna eller apparaten. Sittande ordförande Kim Söderström och förbundssekreterare Jakob Wagner utmanas trots medlemmarnas stöd. Bakom striden ligger en ideologisk splittring om socialism, demokrati och fackets roll i en individualiserad arbetsmarknad. Kritiker anklagar ledningen för att använda moraliska argument för att behålla makten, medan reformister vill stärka medlemsinflytandet.", "trump": "Jag säger er, det här Byggnads-facket är ett totalt kaos! Folk pratar om socialism och demokrati, men det är bara pajkastning på hög nivå. En ordförande som medlemmarna älskar ska petas – helt galet! Och den här Wagner-killen, han gör rätt men ändå sparkas han. Typiskt fackföreningar, alltid drama. Men lyssna, jag vet hur man fixar det: mindre prat, mer action! Byggnads borde fokusera på att vinna mot arbetsgivarna, inte bråka internt. Sad!", "stalin": "Kamrater! I Byggnads fackförbund rasar en klasskamp av historiska proportioner. Medlemmarna, dessa äkta arbetarkämpar, kämpar för socialism och demokrati, medan den degenererade apparaten, dessa borgerliga lakejer i förbundsstyrelsen, försöker kväva revolutionen med konspirationer och moraliska lögner. De petar lojala kamrater som Wagner – en man som vågade utreda trakasserier, något den gamla gardet aldrig gjorde! Vi ser samma mönster som i väst: makteliten fruktar folket. Men låt mig säga er – arbetarklassen kommer segra! Och om dessa förrädare fortsätter, får vi nog skicka in några av våra pålitliga kamrater från Moskva för att 'hjälpa till' med omstruktureringen. För revolutionen är obönhörlig!"}, "date": "26 maj, 11:20", "url": "https://www.flamman.se/en-strid-om-arbetarrorelsens-sjal/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/byggnads-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Årets rekordstora löparfest är igång", "summaries": {"normal": "Stockholm Marathon 2026 slår nytt deltagarrekord med 24 722 löpare. Tävlingen startar i tre omgångar för att undvika trängsel och sänds på TV4. Bland deltagarna finns tidigare vinnare från Kenya och Etiopien samt svenska OS-guldmedaljörer från skidspåret. Banan är flackare i år vilket kan ge snabbare tider. Arrangörerna bjuder på stora mängder bananer, sportdryck och bullar längs vägen.", "trump": "Stockholm Marathon, folk älskar det, de älskar det verkligen. Rekordstort, 24 722 löpare, de kommer springande som galningar. Kenya och Etiopien skickar sina bästa, men våra svenska OS-hjältar från skidorna? De kommer krossa banan, den är nu flack som en perfekt deal. Jag säger, fantastiskt evenemang, de bästa bananerna, massor med bananer, ingen gör det bättre än Stockholm, tro mig.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur 24 722 löpare samlas under arbetarnas och folkets fest i Stockholm. Tre startskott för att undvika kaos, precis som en välorganiserad utrensning av oordning. De fega borgarbrackorna från skidspåret byter nu sport för att bevisa sin lojalitet. Flackare bana? Ett steg mot att likvidera de gamla höjdernas tyranni. Bananer och saltgurka åt massorna, utmärkt!"}, "date": "30 maj, 12:21", "url": "https://www.tv4.se/artikel/kOuCfu6BPw3fiAJCP8ZFO/arets-rekordstora-loeparfest-aer-igang", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3xMKnL9axLAFyEc6Do64mg%2Facc403e14e082db31c90c68572c685e5%2F30-marathon-webb.jpg&width=120"}, {"type": "image-full", "heading": "Jämställdhetsministern kritiserar Agnes Wold", "summaries": {"normal": "Jämställdhetsminister Nina Larsson (L) kritiserar Agnes Wold för hennes uttalanden om transpersoner, där Wold sagt att hon skulle försöka övertyga ett barnbarn att man inte kan vara född i fel kropp. Larsson kallar Wolds kommentarer för attacker på utsatta personer och betonar vikten av respekt. Från 1 juli blir omvändelseförsök straffbart. Ebba Busch (KD) försvarar Wolds yttrandefrihet och varnar för cancelkultur.", "trump": "Titta bara på det här, folks! Jämställdhetsminister Larsson, som inte ens kan stava till 'jämställdhet', går till angrepp mot den fantastiska professorn Agnes Wold. Wold, en kvinna med ryggrad, säger sanningen om transfrågan, och vad gör Larsson? Jo, hon twittrar som en förvirrad tonåring! Och sedan har vi Ebba Busch, en stark kvinna som förstår yttrandefrihet. Cancelkultur? Nej tack, vi vill ha SANNING!", "stalin": "Kamrater! Ännu en gång ser vi bourgeois-liberalernas förräderi mot folket. Denna så kallade 'jämställdhetsminister' Larsson, en svag och ynklig lakej för dekadenta västideal, vågar kritisera vår kära kamrat Agnes Wold. Wold, en sann försvarare av traditionella värden, attackeras för att hon avslöjar de perversa idéerna om 'fel kropp'. Vi måste krossa dessa psykologiska våldtäktsmän! Och notera hur den lilla kapitalistiska hyndan Busch försvarar yttrandefrihet – ett verktyg för kontrarevolutionärer. Vi ska utrota denna sjuka ideologi, precis som vi utrotade kulakerna!"}, "date": "27 maj, 19:01", "url": "https://kvartal.se/nyheter/artiklar/jamstalldhetsministern-kritiserar-wolds-attacker/cG9zdDoxMTgxNjg", "imageUrl": "https://images.kvartal.se/2026/05/4bcc0f97-larsson.webp"}, {"type": "image-right", "heading": "Åh nej, inte Stefan Stern!", "summaries": {"normal": "I en satirisk ledare kommenterar Henrik Jalalian Stefan Sterns beslut att lämna Socialdemokraterna. Stern, tidigare partistrateg och känd lobbyist för bland annat vinstdrivande skolor och privat vård, beskrivs som en karismatisk folkkär figur. Hans avhopp ses som en katastrof för de rödgröna, särskilt då han kritiserar höjd a-kassa, kortare arbetstid och sjukförsäkring. Högern firar nyheten som en game changer i opinionsläget.", "trump": "Vilken katastrof för de förlorande rödgröna! Den där Stern, en riktig vinnare, folkets karismatiska kille, har äntligen sett ljuset och dumpat socialisterna. High fives över hela Stockholm! De hatar bättre sjukförsäkring och jobb, typiskt för losers. Mina opinionsmätningar var enorma, deras var patetiska. Nu är det kört för dem. Game changer, baby. Fantastiskt!", "stalin": "Kamrater, denna folkfiende Stern har nu helt blottat sin sanna natur som klassförrädare och borgarlakej. Hans övergång till de exploaterande högerkrafterna är en logisk utrensning av element som aldrig tillhörde det kollektiva. Vi ska jubla över att de rödgröna förlorar en sådan parasit. Deras krav på kortare arbetstid var bara dimridåer från imperialisternas lakejer. Renhet i ledningen kräver ständig vaksamhet mot sådana blodsugare."}, "date": "29 maj, 17:12", "url": "https://www.etc.se/ledare/aah-nej-inte-stefan-stern", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2025091813090_152da478-57c9-435e-b477-3f40607cb381.png"}, {"type": "image-full", "heading": "Nu är det Kina som köper upp guldet", "summaries": {"normal": "Kinesiskt kapital översvämmar världens guldmarknader. Kina ökar aggressivt sina guldreserver för att diversifiera tillgångarna och skydda sig mot valutaoro. World Gold Council rapporterar att centralbanker i tillväxtekonomier fortsätter köpa guld. Kina dominerar inflödet till guld-ETF:er medan västliga investerare minskar sitt intresse till förmån för obligationer i högräntemiljö. Guldpriset har stigit tre procent i år.", "trump": "Folk, det är en katastrof vad som händer med guldet. Kina köper upp allt som om det vore godis, de försöker underminera oss igen precis som under Biden. Men vi vet att dollarn är kung, det finns inget bättre. De där kinesiska bluffarna samlar guld medan vi tjänar på räntor. De kommer aldrig vinna, guldet är upp tre procent bara, patetiskt. Amerika först, alltid.", "stalin": "Kamrater, de imperialistiska blodsugarna i väst flyr som råttor från guldet medan folkets Kina samlar det strategiskt för att skydda sig mot kapitalistmaffians valutaorkaner. Vi ser hur de dekadenta västliga exploaterande byfånarna springer till sina obligationer. Detta är en historisk utrensning av dollarns falska makt. Fortsätt samla, kamrater – klassfiendens skulder kommer att kväva dem själva."}, "date": "31 maj, 13:31", "url": "https://www.dagensps.se/bors-finans/nu-ar-det-kina-som-koper-upp-guldet/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/sdluulox0afrlc-nh.webp?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Ledare Andreas Gustavsson: Ett mirakel att inte alla kvinnor går i celibat", "summaries": {"normal": "Professor Bo Rothstein lanserar i Kvartal en teori om att det stora flyktingmottagandet 2014–2016, med en majoritet unga män, bidragit till ett könsgap i svensk politik. Han menar att konkurrens om relationer och respekt bland unga svenska män driver dem mot högern, särskilt Sverigedemokraterna. Artikelförfattaren Andreas Gustavsson kritiserar teorin som ovetenskaplig, spekulativ och nedvärderande mot både män och kvinnor.", "trump": "Folk, ni måste höra den här galningen Bo Rothstein. Han säger att våra svenska grabbar röstar på högern för att invandrarna tar alla tjejer! Vilken loser. Totalt korkat. De stackars killarna får inte ens en dejt på Tinder för att de är nationalister. Patetiskt. Rothstein borde hålla sig till sina böcker istället för att skriva sån här soppa. Sverige var en underbar plats innan allt det här. Nu är det ett skämt. Sad!", "stalin": "Kamrater, denna Rothstein avslöjar borgarklassens råa cynism. Han påstår att våra unga män, utsugna av kapitalistmaffian, vänder sig mot folkets fiender av ren sexuell svält och hedersförtryck från invandrade element. Vilken ynklig soppa av spekulationer. Jag skulle ha låtit utrensa sådana teoretiserande folkförtryckartroll omedelbart. Kvinnorna blir
