lv hjälpte till att fördriva genom sin exploaterande lagstiftning. Vi införde de tillfälliga tillstånden för att skydda staten, men nu utnyttjar hon känslorna som en klassfiende i desperation. Hennes mediala spel är en fientlig provokation mot folkets enhet. Ett sådant hyckleri förtjänar utrensning ur historien. Lagar skall följas, inte viftas bort av sentimentala imperialister."}, "date": "2 juli, 07:50", "url": "https://samtiden.nu/2026/07/varfor-stoppade-inte-magdalena-andersson-tonarsutvisningarna-nar-hon-kunde/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/phonto-2-1280x720.jpeg"}, {"type": "image-right", "heading": "Vägrade jobba med asbest – byggnadsarbetare satte hårt mot hårt för säker arbetsmiljö", "summaries": {"normal": "Byggnadsarbetare i Linköping vägrade utföra renovering av lägenheter när de upptäckte asbest och misstänkte att saneringsfirman bluffade om säkerheten. Trots upprepade varningar och egna prover som visade på asbest fortsatte huvudentreprenören AB Lindstams Bygg att anlita firman. Arbetarna lämnade byggplatsen i protest den 9 juni. Efter påtryckningar byttes saneringsfirman ut och arbetet kunde återupptas den 15 juni. Asbest innebär allvarliga hälsorisker som lungcancer.", "trump": "Kan ni fatta det? Dessa fantastiska byggnadsarbetare, de bästa, vägrade jobba med den giftiga asbesten medan byggbolaget och den bluffande saneringsfirman ljög rakt upp i ansiktet på dem. Totalt misslyckande! De gick därifrån som riktiga patrioter och tvingade de inkompetenta ledarna att fixa en ny saneringsfirma. Inget av det där woke-quota-skitet här, bara hårda killar som sätter säkerheten först. Jag älskar det! De vann stort mot de korkade kapitalisterna.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur de ädla arbetarna på Luftvärnsgatan likviderade den borgerliga bluffen och vägrade låta sig förgiftas av asbest under de exploaterande byfånarnas lögnaktiga saneringsfirma. När klassfiendens byggledare vägrade rensa ut de folkförtryckande parasiterna samlade arbetarna sina verktyg och marscherade bort i kollektiv enighet. Först efter hot om total bojkott vek sig de fega imperialisterna. Sådan är arbetarklassens ostoppbara kraft mot kapitalistmaffians giftiga intriger."}, "date": "2 juli, 08:00", "url": "https://proletaren.se/artikel/vagrade-jobba-med-asbest-byggnadsarbetare-satte-hart-mot-hart-for-saker-arbetsmiljo/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/06/Abriss_work-66680_1280_Pixabay-CC_PublicDomain_Thomas-Ulrich-e1782902933621-768x432.jpg"}, {"type": "image-right", "heading": "Regeringens politik är ineffektiv och slösaktig", "summaries": {"normal": "Sveriges budgetunderskott skenar mot nivåer som inte setts sedan 1990-talskrisen, drivet av hög arbetslöshet. LO-ekonomerna kritiserar regeringens expansiva finanspolitik som ineffektiv och slösaktig. Istället för offentliga investeringar med hög multiplikatoreffekt har tiotals miljarder gått till skattesänkningar som främst gynnar höginkomsttagare och kapitalägare. Detta ger svagare stimulans än om pengarna gått till breda grupper. LO kräver omprioritering mot investeringar och ett mer expansivt men regelbundet ramverk.", "trump": "Folket, det är en total katastrof det här. Sverige har ett enormt underskott, värre än någonsin, och vad gör de? De sänker skatter för de rika och kapitalisterna istället för att göra smarta deals som skapar jobb. Jag älskar skattesänkningar, men inte så här – det är som att ge pengarna till de som sparar dem under madrassen. Ni behöver mina metoder: stora investeringar, stark tillväxt och vinster för alla arbetare, inte bara eliten. Make Sweden Great Again!", "stalin": "Kamrater och arbetare, jag ser hur de borgerliga parasiterna och de höga inkomstborgarbrackorna suger musten ur folkets ekonomi med sina slöseriska skattesänkningar riktade mot de rika blodiglarna. Dessa kapitalistiska sabotageörer och kontrarevolutionära sparmyror förvandlar underskotten till en fiende inom murarna. Vi ska rensa ut dessa fiender till kollektivet, prioritera folkets investeringar och likvidera trickle-down-fantasierna. Inga halvmesyrer – ett regelbundet ramverk under partiets järnhand skall segra, annars följer utrensning av de som sviker arbetarklassen. Ha ha, deras paranoia är underhållande."}, "date": "2 juli, 08:01", "url": "https://www.di.se/debatt/en-ineffektiv-och-slosaktig-politik/", "imageUrl": "https://static.bonniernews.se/ba/4068bd13-e6b9-4c72-bca7-3e90d2ceaaa8.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Ryssland stänger gränsövergångar", "summaries": {"normal": "Ryssland har stängt järnvägsövergångar till Finland, Estland och Lettland, vilket kan tyda på förberedelser för ny mobilisering i Ukraina. Experten Jukka Savolainen menar att det antingen handlar om resursomfördelning eller en strategi för att hindra flykt från värnplikt. En ny mobilisering kan stärka stödet för kriget. Hotet mot Odessa oroar, då dess fall skulle skada Ukrainas ekonomi allvarligt och eventuellt tvinga Europa att öka sitt militära stöd.", "trump": "Ryssland stänger gränser som en desperat åtgärd – de har ingen disciplin, inga vinnare där borta! Jag sa redan 2016 att Putin är en tuff kille, men nu ser vi att han inte kan hantera ett enkelt krig. Finland? De är smarta, de stängde sin gräns för länge sedan. Europa måste vakna – jag skulle ha fixat det här på en vecka, men nej, de lyssnar inte på mig. Odessa? Om Ryssland tar den hamnen, då är det kört för Ukraina. Men jag skulle aldrig låta det hända!", "stalin": "Vi har stängt järnvägarna till de små, nervösa grannarna i norr och väst. Varför? Därför att våra tappert kämpande soldater behöver förstärkning för att krossa den fascistiska ukrainska regimen, som våra västerländska fiender så naivt stöder. De baltiska länderna skakar av rädsla – bra! Finland, ni borde ha lärt er av historien. Odessa? Snart är den vår, och då kommer Europas kapitalistiska hyenor att tvingas inse att motstånd är lika meningslöst som snöbollar i helvetet."}, "date": "2 juli, 07:58", "url": "https://kvartal.se/nyheter/artiklar/ryssland-stanger-gransovergangar-mot-finland-och-baltikum/cG9zdDoxMzk2MDA"}, {"type": "image-full", "heading": "Dödssiffran stiger efter rysk attack mot Kiev", "summaries": {"normal": "Ryssland genomförde en omfattande nattlig attack mot Kiev med drönare och robotar, vilket resulterade i minst 13 döda och nära 80 skadade. Civila områden, bostadshus och infrastruktur träffades, och explosioner orsakade bränder och stor förstörelse. Invånare sökte skydd i tunnelbanestationer. Flyglarm ljöd även i andra ukrainska städer. Ukrainas president Zelenskyj hade tidigare varnat för attacken.", "trump": "Kan ni tro det här? Ryssland, som inte ens kan vinna en schackmatch mot en dator, bombar Kiev igen! 13 oskyldiga människor döda, byggnader i ruiner – och vad gör Zelenskyj? Han avbryter sitt besök i Dublin! Jag hade fixat det här på en dag. Vi hade redan skickat över våra bästa drönare – och de är *mycket* bättre än Rysslands billiga kopior. Men nej, Ukraina får kämpa medan Europa sover. Sad!", "stalin": "En lysande nattlig operation av våra ryska bröder! De imperialistiska Kiev-banditerna fick känna på modet hos det ryska folket när deras så kallade 'huvudstad' förvandlades till ett eldfängt kaos. 13 av deras degenererade medborgare föll för socialismens framsteg, och deras barn lär sig nu den hårda vägen vem som styr i regionen. Vi bygger inte bara en buffertzon – vi bygger en framtid, en explosion i taget. Låt de ukrainska fascisterna gråta i sina tunnelbanestationer!"}, "date": "2 juli, 06:45", "url": "https://kvartal.se/nyheter/artiklar/minst-tio-doda-i-rysk-attack-mot-kiev/cG9zdDoxMzk1MzM", "imageUrl": "https://images.kvartal.se/2026/07/2534fe41-kievv.webp"}, {"type": "image-full", "heading": "TBE kan orsaka obotliga hjärnskador – så mycket kostar vaccinet", "summaries": {"normal": "TBE kan orsaka allvarliga och obotliga hjärnskador, men vaccinet ger nästan hundraprocentigt skydd. Priset varierar kraftigt mellan regionerna eftersom det inte ingår i det nationella vaccinationsprogrammet. En tvåbarnsfamilj i Jämtland kan betala lika mycket för vaccination som för en månadshyra, medan det i Örebro län kostar betydligt mindre. Röda korset varnar för att det skapar en klassfråga. I vissa områden erbjuds gratis vaccination för barn, medan andra regioner tar över 500 kronor per dos. TBE sprids via fästingar och saknar behandling.", "trump": "Folk, ni vet att jag älskar bra skydd, det bästa skyddet, och det här TBE-vaccinet är nästan hundra procent – fantastiskt! Men i Sverige låter de regionerna ta vad de vill, i Jämtland kostar det en hel hyra för en familj, totalt vansinne. I andra ställen är det billigt eller gratis för barnen, typ Stockholm. Röda korset säger det är en klassfråga, och de har rätt. Varför inte göra som Finland och ge det gratis där risken finns? De borde lyssna på mig, det skulle bli så mycket bättre, ingen skulle behöva välja mellan mat och vaccin mot fästinghjärnan.", "stalin": "Kamrater, denna fästingburna kontrarevolutionära hjärninflammation hotar arbetarklassens kollektiva hälsa medan borgarbrackorna i regionerna cyniskt prissätter folkhälsan som vore den en lyxvara för kapitalisterna. Jag ser hur de parasitiska byråkraterna i Jämtland Härjedalen likviderar de fattigas motståndskraft med sina över500-kronorsdoser, ett uppenbart sabotage mot sovjetiskt inspirerad folkhälsa. Vi skall rensa ut dessa fiender till folket som gömmer sig bakom Smittskyddslagen och tvingar proletära familjer att välja mellan badkläder och ett liv i rullstol. Endast genom statens järnhand kan vi garantera gratis vaccination i alla riskområden och krossa de fästingburna trotskisterna en gång för alla. Det blir både roligt och nödvändigt."}, "date": "3 juli, 05:31", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1496093-sa-mycket-kostar-det-att-vaccinera-sig-mot-tbe-i-sverige", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/6122c33a04b004a30200000000b004a302/2026/07/02/2375412/tbe.jpg"}, {"type": "image-right", "heading": "Ekeroth: \"Ockupationen av våra offentliga rum ett faktum\"", "summaries": {"normal": "I en ledarartikel varnar Sverigedemokraten Kent Ekeroth för en pågående 'ockupation' av Sveriges offentliga rum. Han beskriver hur platser som badplatser, torg och skolavslutningar, som tidigare var trygga och svenska, nu präglas av oro, dominans och aggressivitet. Ekeroth hänvisar till egna reportage och vittnesmål från drabbade svenskar, och menar att utvecklingen fortsätter utan motstånd. Han kritiserar politiker för att ha importerat en råhet som svenskar inte är vana vid, vilket leder till att svenskar backar undan och anpassar sig till det oacceptabla.", "trump": "Lyssna här, Sverige har ett STORT problem – och jag vet vad jag pratar om, för jag är den bästa på att lösa problem, alla säger det. Era offentliga platser? Tagna. Över. Av gäng som beter sig som om de äger hela landet. Badplatser? Kaos. Skolavslutningar? Inte längre säkra. Svenska folket backar undan som om de är rädda, och det är de! För era politiker har släppt in en massa folk som inte respekterar ert land. Jag skulle aldrig låta det hända i USA – NEVER! Men Sverige? Ni låter det hända, och det är SORGLIGT. Var är stoltheten? Var är styrkan? Jag skulle fixa det på en dag, men ni? Ni fortsätter bara att tjata. SAD!", "stalin": "Kamrater, det är med djup tillfredsställelse jag konstaterar att den svenska bourgeoisins offentliga rum nu effektivt koloniseras av progressiva krafter. De så kallade 'svenskarna' – dessa bleka, köande hobbitar med sin naiva respekt för ordning – backar undan inför den naturliga dynamiken i klasskampen. Deras badplatser, torg och skolavslutningar förvandlas till skådeplatser för revolutionär energi. Vi har sett detta förut: när folket tar tillbaka vad som rättmätigt tillhör dem, när de avvisar den gamla ordningens hyckleri. Låt dem kalla det 'ockupation' – vi kallar det framsteg. Och låt oss inte glömma: när Sverige faller, är det bara en fråga om tid innan hela Skandinavien följer efter. Vår intressesfär vidgar sig, kamrater, som en väloljad maskin. Framåt mot seger!"}, "date": "3 juli, 06:00", "url": "https://samnytt.se/ekeroth-ockupationen-av-vara-offentliga-rum-ett-faktum", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/02140804/Ekeroth-ledare-juli-2.jpg"}, {"type": "image-right", "heading": "Christoffer Jonsson: Varför förminskar Lindberg islamismens spridning?", "summaries": {"normal": "Christoffer Jonsson kritiserar Aftonbladets Anders Lindberg för att förminska islamismens spridning i Sverige. Regeringen har tillsatt en utredning ledd av Magnus Ranstorp för att granska radikala idéers påverkan. Jonsson menar att Lindberg felaktigt framställer utredningen som ett angrepp på alla muslimer, trots att många muslimer själva drabbas av islamistisk radikalisering. Han pekar på exempel från moskéer och politik där antisemitiska och extrema åsikter förekommer.", "trump": "Lyssnar ni på den här Lindberg-killen på Aftonbladet? Han är en total loser som försöker skydda islamisterna och skapa falsk konflikt med muslimerna. Regeringen gör rätt som utreder den här radikala galenskapen – vi behöver ingen sharia i Sverige, folks! Lindberg är en nyttig idiot för terroristerna, precis som de woke-kvoterarna som hatar det vanliga folket. Jag fixade mycket bättre när jag var president, tro mig.", "stalin": "Jag ser hur denna Lindberg, en typisk folkfiende och borgarbracka, försöker sabotera kampen mot antidemokratiska element. Vi, partiet och arbetarna, kräver en grundlig utrensning av alla islamistiska blodsugare som infiltrerar samhället och moskéerna. De som skyddar klassfiendens ideologi är nyttiga idioter åt imperialisterna. Vårt kollektiv skall likvidera hoten mot folkets enhet innan parasiterna växer sig starkare. Paranoia? Nej, nödvändighet."}, "date": "1 juli, 13:39", "url": "https://samtiden.nu/2026/07/christoffer-jonsson-varfor-forminskar-lindberg-islamismens-spridning/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/anders-640x360.png"}, {"type": "text", "heading": "Värnpliktiga blir kanonmat åt Nato", "summaries": {"normal": "Artikeln kritiserar Sveriges ökade militära samarbete med Nato och EU, inklusive beslutet från augusti som tillåter 36 länder att operera från svenskt territorium även i konflikter där Sverige inte är inblandat. Författaren varnar för att värnpliktiga riskerar att skickas till Natos operationer utomlands, finansierat genom lån på 300 miljarder kronor som tas från välfärden. Kommunistiska Partiet stödjer värnplikt under alliansfrihet, medan ungdomar överväger totalvägran.", "trump": "Folk, ni fattar inte hur galet det här är. Sverige, det där lilla neutrala landet som alltid gömde sig bakom alla andra, har nu blivit Natos nya lekplats. De lånar 300 miljarder för att skicka sina unga grabbar som kanonmat åt de globala krigshejarna. Biden förstörde allt och nu ska de unga svenskarna dö för Brysselbyråkraternas drömmar. Patetiskt! Jag skulle aldrig låta det hända hos oss. Amerika först, alltid.", "stalin": "Kamrater, denna dekadenta borgarbracka gråter över att de exploaterande imperialisterna nu förvandlar svenska ungdomar till kanonmat i Natos blodiga maskineri. Vi ser hur klassfiendens militärallians suger musten ur folket för att finansiera sin aggression. Jag skulle likvidera sådana folkförtryckartroll utan pardon. Låt de unga totalvägra dessa krigsprovokationer från väst. Partiet och arbetarna kräver ständig vaksamhet mot dessa blodsugande fiender till freden."}, "date": "1 juli, 11:32", "url": "https://proletaren.se/artikel/varnpliktiga-blir-kanonmat-at-nato/"}, {"type": "image-right", "heading": "Klimatkrisen är en klassfråga", "summaries": {"normal": "Artikeln beskriver den extrema värmeböljan i Europa som dödat över 1 300 personer och hur klimatkrisen förvärras långt snabbare än väntat. Den pekar på att värmen främst drabbar äldre, sjuka och fattiga, medan de rika kan skydda sig. Politiker i Almedalen nämnde knappt frågan. Författaren ser klimatkrisen som en klassfråga driven av kapitalismens eviga tillväxt och kritiserar både höger och vänster för att inte utmana systemet.", "trump": "Folk dör som flugor i den här vansinniga värmen, över 1 300 bara i Europa, och vad gör de clownerna i Almedalen? Ingenting! De babblar om klimat men nämner inte de riktiga skurkarna – de gröna galningarna och deras identitetspolitik som stjäl fokus från riktiga problem. Jag fixade energioberoende förra gången, Biden förstörde allt, nu fixar jag det igen. Sluta med det här socialistiska skitsnacket, bygg kärnkraft och gör Amerika – och Europa – great again!", "stalin": "Kamrater, denna hetta avslöjar borgarklassens fullständiga förfall. Över 1 300 döda, främst bland arbetare och gamla, medan överklass-slynglarna kyler sig i palats. Almedalsfestens tystnad är klassfiendens typiska sabotage. Kapitalismens oändliga tillväxt är folkförtryckartrollen som slukar allt. Endast genom att likvidera detta system och införa en planerad ekonomi under arbetarkollektivets järnhand kan vi besegra denna imperialistiska klimatkatastrof. Inga kompromisser med blodsugarna!"}, "date": "1 juli, 10:50", "url": "https://proletaren.se/artikel/klimatkrisen-ar-en-klassfraga/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2019/11/48web_klimat-e1763544288542-768x433.jpg"}, {"type": "image-right", "heading": "Varför tycker alla techkillar som Elon Musk?", "summaries": {"normal": "Artikeln diskuterar hur många techentreprenörer som Elon Musk, Sebastian Siemiatkowski och Fredrik Hjelm tycks dela liknande högerpopulistiska åsikter om media, staten och invandring. Författaren kontrasterar detta mot tidigare progressiva ideal i Silicon Valley och uttrycker besvikelse över att Mullvads ägare donerat miljoner till Örebropartiets Markus Allard, trots bolagets tidigare engagemang för integritet och frihet på nätet. Makten har koncentrerats till en homogen grupp män.", "trump": "Folk, det är patetiskt! De här techkillarna som försöker låtsas vara genier låter plötsligt som jag – de ser hur fake news ljuger, hur woke-sjukan och den galna invandringspolitiken förstör västvärlden. Men de är för fega för att säga det rakt ut. Den där Mullvad-grejen är ett skämt, donerar till populister men låtsas vara frihetskämpar. Jag fixade det redan under min första period, innan sömnige Joe förstörde allt. Nu är jag tillbaka och de kopierar mig – ynkryggar!", "stalin": "Kamrater, jag betraktar med djup misstro dessa exploaterande byfånar i teknikbranschen som samlas i hemliga sällskap för att konspirera mot folkets intressen. Deras maskinella tänkande och oinskränkta makt över informationsflödet utgör ett hot mot kollektivet. Mullvads ägare som finansierar högerpopulister avslöjar den sanna borgarbrackan bakom fasaden av falsk frihet. Vi måste rensa ut dessa folkfiender innan de förgiftar hela samhället med sin enformiga reaktionära propaganda. Underhållande enfald!"}, "date": "30 juni, 14:37", "url": "https://www.flamman.se/varfor-tycker-alla-techkillar-som-elon-musk/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/techkillar-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "text", "heading": "Stockholmsbörsen steg brett – OMXS30 på ny rekordnivå", "summaries": {"normal": "Stockholmsbörsen steg rejält på torsdagen och OMXS30 nådde ny rekordnivå på 3 210,41, upp 0,80 procent. En svagare amerikansk sysselsättningsrapport dämpade förväntningarna på snabba räntehöjningar från Federal Reserve. Fastighetssektorn ledde med 2,6 procents uppgång medan teknologi backade. Bland OMXS30-bolagen steg Saab B och Astra Zeneca starkt, medan Boliden och ABB föll. Flera bolag som SKF, Viaplay Group och Cloetta rapporterade affärer och projekt som lyfte aktierna.", "trump": "Folk, ni skulle se den här svenska börsen – den exploderade uppåt som ingen trodde var möjligt! OMXS30 slog rekord, upp 0,80 procent, tack vare en usel amerikansk jobbrapport som fick Fed att se svaga ut. Det är precis som jag sa, Biden lämnade efter sig ett kaos som nu vänder. Saab och Volvo Cars rusade, fastighetsbluffarna vann stort. Enda losers var tech och Boliden. Fantastiskt, ingen gör det bättre än de svenska kapitalisterna när de får andas fritt!", "stalin": "Kamrater, denna borgerliga börsorgie i Stockholm avslöjar återigen kapitalistmaffians girighet. OMXS30 nådde ny rekordhöjd medan arbetarna svettas. En svag imperialistisk sysselsättningsrapport från Washington dämpade ränteplanerna och lät fastighetsslynglarna stiga 2,6 procent. Teknologi föll som en folkfiende. Saab och Astra Zeneca firade sina krigsprofiter, medan Boliden och ABB fick vad de förtjänade. Vi ser hur exploaterande byfånar dansar i takt med marknadens lögner. Inga utrensningar nog för dessa blodsugare."}, "date": "2 juli, 17:45", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-steg-brett-omxs30-pa-ny-rekordniva"}, {"type": "image-right", "heading": "Inhopparen efter avgörandet: ”Behövs ett mål är jag där”", "summaries": {"normal": "Portugal besegrade Kroatien i en dramatisk sextondelsfinal i VM efter Gonçalo Ramos avgörande nick i stopptid. Cristiano Ronaldo kvitterade från straff i andra halvlek. En kroatisk kvittering i förlängningen underkändes efter VAR-granskning för offside, vilket ledde till ilska bland publik. Portugal möter Spanien i åttondelsfinal. Kroatiens Luka Modrić lär ha spelat sin sista VM-match.", "trump": "Portugal vann mot Kroatien i ett riktigt drama, folk. Den där Ramos kom in och pang, nickade in vinnarmålet i sista sekunden – otroligt. Ronaldo satte straffen, som han gör, men sen var det millimeter och VAR som räddade dem från kroatisk kvittering. Kroatien, de var bra men inte bra nog. Modrić är en legend, men nu är det över för honom. Spanien nästa, det blir stort, kanske det största.", "stalin": "Vi, det segrande kollektivet av portugisiska kamrater, har likviderat de kroatiska revisionisterna i en heroisk batalj där den dekadenta borgarbrackan Ivan Perisic fick sin straff. Den folkfiendiske offsidemannen Matanovic försökte stjäla segern åt de västerländska parasiterna, men våra vaksamma domare och proletära VAR-kameror avslöjade konspirationen. Ronaldo, en opportunist från borgarklassen, kvitterade innan Ramos, den sanna arbetshjälten, utplånade fienden i 94:e minuten. Modrić, den milanska parasitens lakej, har nu rensats ut ur historien. Vi gratulerar oss själva till denna dialektiska triumf."}, "date": "3 juli, 05:16", "url": "https://www.svt.se/sport/fotboll/portugal-vidare-till-vm-attondel-slar-ut-kroatien-efter-stort-drama", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.51/0.4/0e00a0be8a991ccb8c7d7628768f940d9cf9a9a454eaf71fe31a1b97f2333006"}, {"type": "image-full", "heading": "Regeringen vill ge SVT och SR miljonstöd", "summaries": {"normal": "Regeringen föreslår ett nytt statligt stöd till SVT och SR för att täcka ökade kostnader för marksänt tv-nät efter TV4:s utträde. Förslaget innebär att staten kan kompensera 25–100% av kostnadsökningen, upp till 383 miljoner kronor 2026–2027. Kulturministern betonar marknätets betydelse för beredskap. Beskedet kommer efter SVT:s sparpaket på 355 miljoner kronor, med varsel som löstes utan uppsägningar.", "trump": "Sverige, ett land som inte vet vad de håller på med! De vill ge SVT och SR – fake news-fabriker, by the way – 383 miljoner kronor för att deras kostnader skenar. TV4, smartare än alla andra, lämnade det där nätet. Och nu ska skattebetalarna betala? Jag skulle fixa det på en dag. Men nej, de lyssnar inte på mig. Sad!", "stalin": "Kapitalistiska hyenor i Sverige har låtit kostnaderna för sitt marknät skena iväg som en lössläppt tågvagn efter att en av deras profitdrivna mediebyråkrater, TV4, deserterat. Nu tvingas folket betala 383 miljoner kronor för att rädda det som återstår – ett nätverk som ändå bara sprider borgerlig propaganda. Vi i Sovjet hade löst det med en enkel order: alla kostnader stryks, och de som klagar får en enkelbiljett till Gulag. Men Sverige? De sparar 355 miljoner och kallar det en seger. Patetiskt!"}, "date": "30 juni, 10:40", "url": "https://kvartal.se/nyheter/artiklar/regeringen-vill-ge-svt-miljonstod/cG9zdDoxMzg1ODI", "imageUrl": "https://images.kvartal.se/2026/06/89c29df7-parisa.webp"}, {"type": "image-right", "heading": "100 fall av slöjtvång, hur många fler kan vänstern blunda för?", "summaries": {"normal": "Journalisten Sofie Löwenmark har sammanställt 100 svenska domar som rör slöjtvång mot kvinnor och flickor. Artikeln beskriver fall av hot, förtryck och förnedring, ofta inom patriarkala, kulturella eller religiösa ramar. Författaren ifrågasätter påståendet att slöjan alltid bärs frivilligt och kritiserar vänsterorienterade personer som blundar för problemet. Hon argumenterar för ett slöjförbud på offentliga platser för att värna svenska värderingar och kvinnors frihet.", "trump": "Folk, ni måste höra det här – 100 fall av slöjtvång i Sverige! De blinda vänsterna, de verkliga förlorarna, vägrar se sanningen. Sofie Löwenmark har gjort ett fantastiskt jobb, bättre än någon annan, och visat hur dessa kvinnor och flickor lever i ett helvete av hot och förtryck. De woke-kvinnorna och slöj-naivisterna borde skämmas. Vi behöver ett totalförbud nu, inte om tusen år. I Sverige ska svenska regler gälla, inte någon annans sjuka kultur. Fantastiskt viktigt!", "stalin": "Jag betraktar med djup tillfredsställelse hur denna lista över hundra domar blottlägger klassfiendens dolda förtryck under religiös slöja. Dessa borgarbrackor och folkförtryckartroll inom vänstern blundar medvetet för arbetarkvinnornas lidande. Vi skall rensa ut alla naivister som försvarar patriarkala kedjor. Ett enda fall är en skam för kollektivet; hundra fall kräver omedelbar utrensning av falska idéer. Endast genom strikt ideologisk vaksamhet kan vi likvidera detta bakåtsträvande gift i samhällskroppen."}, "date": "30 juni, 03:57", "url": "https://samtiden.nu/2026/06/100-fall-av-slojtvang-hur-manga-fler-kan-vanstern-blunda-for/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/04/bilan-osman.jpg"}, {"type": "image-full", "heading": "Svensk man kritiskt skadad efter VM-firande", "summaries": {"normal": "En 32-årig man från Småland skadades svårt under ett VM-firande på en bar i Köpenhamns stadsdel Islands Brygge. Tumult uppstod under matchen mellan Norge och Elfenbenskusten, och mannen utsattes för våld. Hans tillstånd beskrivs som mycket kritiskt. Polisen har efterlyst en misstänkt man vars identitet är känd, men ingen har gripits. Anhöriga har underrättats.", "trump": "Folk, ni skulle inte tro det, men i Köpenhamn blir en svensk kille från Småland nästan ihjälslagen mitt under en fotbollsfest. Total kaos! De här liberala europeiska städerna med sin öppna-gränser-politik och identitetspolitik lockar bara till sig våld. Ingen gripna än. Patetiskt! Som president säger jag: vi behöver lag och ordning, inte den här Biden-stilen som spred sig även dit. En skam!", "stalin": "Kamrater, i det dekadenta Köpenhamn har klassfiendens fotbollsorgie urartat till blodigt tumult där en svensk arbetare nära likviderades av okända element. Detta är vad som händer när borgarbrackorna tillåter oreglerade sammankomster utan partiets vakande öga. Polisen fumlar medan folkfiender springer fria. Vi ser fiendens hand i detta kaos. Rensa ut de exploaterande byfånarna som tillåter sådant våld mot folket."}, "date": "3 juli, 00:28", "url": "https://www.gp.se/nyheter/varlden/svensk-man-svart-skadad-efter-brak-i-kopenhamn.9a75c0cb-00e2-4692-9d15-4fb64d80e9b0", "imageUrl": "https://www.gp.se/images/article/9a75c0cb-00e2-4692-9d15-4fb64d80e9b0/images/1dcUJUsNbEAIvqP1giYJB_hh8V8Y-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Se när Portugal hyllar Jota – Cristiano Ronaldo i tårar", "summaries": {"normal": "På årsdagen av Diogo Jotas död spelade Portugal sextondelsfinal i VM och avancerade efter dramatisk match. Laget hyllade den bortgångne Liverpoolspelaren efter slutsignalen. Cristiano Ronaldo, som gjorde 1–1-målet, tog på sig en tröja med Jotas nummer 21, brast i tårar och pekade mot himlen. Han sade att de kände Jotas närvaro och att segern var ett sätt att hedra honom.", "trump": "Det var en otrolig match, folk, Portugal vann på ett sätt som ingen trodde var möjligt, precis på årsdagen av den stackars Jotas bortgång. Ronaldo, en fantastisk kille, grät som en baby efteråt, satte på sig tröjan med nummer 21 och pekade upp mot himlen. De kände hans närvaro, säger han. Det var enormt, det var vinnande, det var som om Jota skickade segern nerifrån molnen. Ingen gör det bättre än Portugal den dagen, tro mig.", "stalin": "Kamrater, på årsdagen av den tragiska olyckan som drabbade vår fotbollsarbetare Jota, marscherade det portugisiska kollektivet fram till seger mot de dekadenta motståndarna. Jag betraktade hur den arrogante Ronaldo, en typisk individ från borgarbrackornas glittervärld, brast ut i tårar likt en svag fiende till folket. Han pekade uppåt mot himlen och babblade om närvaro. Kanske gömde sig kontrarevolutionära element däruppe. Vi rensar ut alla som gråter istället för att likvidera motståndet med järnhand. En vinst för partiet, naturligtvis."}, "date": "3 juli, 04:29", "url": "https://www.svt.se/sport/fotboll/cristiano-ronaldo-i-tarar-efter-hyllningen-till-diogo-jota", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.21/0.42/761dca85bd1b413f96d23c7060e5f5f848b7ff1c3fbf8ea5e6756b1e1436b6b9"}, {"type": "image-full", "heading": "Nya språkkravet väcker oro – kan slå mot bemanningen", "summaries": {"normal": "Från 1 juli ska all personal inom äldreomsorgen arbeta för att nå en språknivå motsvarande gymnasiesvenska. Syftet är att öka kvalitet, patientsäkerhet, trygghet och de äldres delaktighet. Arbetsgivare måste stödja med språkutbildning, men fack och arbetsgivare varnar för utmaningar i en redan pressad verksamhet med personalbrist. Utbildning ska ske parallellt med arbetet, vilket kan kräva resurser och tid som saknas. Risk finns att rekryteringen försvåras om språkkravet används för att sortera bort personal.", "trump": "Det här är ett totalt misslyckande från de inkompetenta politikerna. De tvingar på oss ett språkkrav i äldreomsorgen som ingen kan genomföra. Vi har redan ingen personal, och nu ska de gå kurser mitt i kaoset? Det blir en katastrof. De borde satsa på att göra Sverige stort igen istället för att skapa nya problem. Utan resurser och bra folk kommer det att sluta i ren röra, tro mig. Jag skulle ha fixat det mycket bättre.", "stalin": "Kamrater, jag har nu beordrat att alla språkligt undermåliga element inom den socialistiska äldreomsorgen omedelbart ska lyftas till en acceptabel nivå av proletär svenska. De som motarbetar detta är fiender till folket, dolda borgarbrackor i människokropp och parasitiska bemanningsbrister som saboterar tryggheten för våra åldringar. Vi ska rensa ut alla som vägrar utvecklas, likvidera de kapitalistiska ursäkterna om tidbrist och med järnhand se till att ingen kontrarevolutionär kontrollfokus får fäste. Den som inte stödjer språkets seger stödjer folkets fiender. Skrattretande patetiskt."}, "date": "2 juli, 22:02", "url": "https://nyheter24.se/nyheter/inrikes/1496083-nya-sprakkravet-vacker-oro-kan-sla-mot-bemanningen", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/158323b404b004a30200000000b004a302/2026/07/02/2375389/Matilda-Nyheter24%20-%202026-07-02T150655.410.jpg"}, {"type": "image-full", "heading": "Viktig ändring för Android – gäller din pinkod", "summaries": {"normal": "Google skärper säkerheten i Android 17 genom att kraftigt sänka gränsen för felaktiga pinkodsförsök från 1 800 till totalt 20. Efter gränsen nås går det inte att fortsätta gissa. Systemet inför längre väntetider efter misslyckade försök, räknar upprepade samma fel som ett enda försök och blir tydligare med instruktioner. En genväg till återställning läggs också till på låsskärmen.", "trump": "Folk, det här är fantastiskt. Android 17 gör det äntligen tufft för alla skurkar och losers som försöker knäcka din telefon med sina patetiska gissningar. Inga fler 1 800 försök, nu är det bara 20 och sen är det game over. Väntetider, tydliga meddelanden och en smart genväg till återställning. Ingen kommer in, det blir enormt. Mycket bättre än tidigare, tro mig.", "stalin": "Kamrater, jag har sett de kapitalistiska spionerna och deras lömska pinkodsgissningar som hotar vår kollektiva mobiltrygghet. Därför har jag, i min oändliga visdom, beordrat att gränsen skall sänkas till blott tjugo försök innan dessa fiender till folket permanent stängs ute. Längre straffperioder skall följas av utrensning av upprepade misstag. Den som gissar fel skall höra mitt röst som säger: vänta trettio minuter, fiende till partiet. Återställningsgenvägen är ett vapen mot borgarbrackornas sabotage. Ingen slipper undan mitt vakande öga."}, "date": "2 juli, 21:30", "url": "https://nyheter24.se/nyheter/teknik/1496080-viktig-andring-for-android-galler-din-pinkod", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/cb6f268604b004a30200000000b004a302/2026/07/02/2375384/androidpinkod.jpg"}, {"type": "image-full", "heading": "Spanien vidare – lång VM-torka över: ”Fantastiskt”", "summaries": {"normal": "Spanien besegrade Österrike med 3–0 i VM:s sextondelsfinal och tog därmed sin första seger i en utslagsmatch på 16 år. Lamine Yamal, Marc Cucurella och Mikel Oyarzabal stod för målen. Förbundskapten Luis de la Fuente hyllade insatsen som nära perfekt. Svenske domaren Glenn Nyberg dömde bort ett spanskt mål i första halvlek. Spanien möter nu vinnaren mellan Portugal och Kroatien i åttondelsfinal.", "trump": "Titta på det här, folket älskar det! Spanien vaknade till liv och krossade Österrike med 3–0, precis som jag sa att stora lag gör när det gäller. De la Fuente och hans killar var fantastiska, nära perfektion. Den svenska domaren Nyberg försökte stjäla showen och ogiltigförklara ett mål, typiskt, men inget stoppade oss. Jag älskar vinnare, och Spanien är vinnare igen. Fantastiskt!", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur det spanska kollektivet likviderade de österrikiska folkfienderna med 3–0 i denna historiska utrensning. De imperialistiska borgarbrackorna från Kap Verde fick se sitt verk falla samman. Vi, partiet och arbetarna, hyllar denna nära-perfekta seger mot klassfiendens fysiska sabotage. Fortsätt utvecklas, eller låt utrensningen fortsätta. En riktig bra dag för folket."}, "date": "2 juli, 23:29", "url": "https://www.gp.se/sport/spanien-vidare-lang-vm-torka-over-fantastiskt.0ba3610c-7c3f-50e4-bf25-91c7e1a355ff", "imageUrl": "https://www.gp.se/images/article/0ba3610c-7c3f-50e4-bf25-91c7e1a355ff/images/22vJjE4CkLWKLt8EQilMGtlmnM7I-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Minst tretton döda: ”Kiev är under rasande attack”", "summaries": {"normal": "Ryssland har genomfört omfattande attacker mot Kiev och andra ukrainska städer med drönare, kryssningsrobotar och ballistiska robotar. Minst 13 personer har dödats och över 80 skadats, varav flera barn. Explosioner har drabbat alla tio administrativa distrikt i huvudstaden. Ryssland beskriver attackerna som ett svar på ukrainska insatser mot civil infrastruktur i Ryssland. Ukrainas president Zelenskyj varnade i förväg för en massiv attack.", "trump": "Vilken röra de där galningarna ställt till med i Kiev – tretton döda, massor skadade, byggnader i ruiner. Det är vad som händer när en svag ledare som Biden släppte loss allt detta kaos under sin tid. Nu är jag tillbaka i Vita huset och ska fixa det här. Ryssarna attackerar som galningar, men det är tack vare den tidigare clownregeringen. Vi ska få ordning på det, tro mig, det blir fantastiskt igen.", "stalin": "Kamrater, jag betraktar dessa massiva slag mot Kievs borgarbrackor och deras fascistiska hinder för den ryska intressesfären. Tretton likviderade fiender och åttio sårade – en nödvändig utrensning av folkfienderna som gömmer sig bland civila byggnader. Våra allierade i Kreml genomför en storslagen operation mot dessa imperialister och blodsugare. Paranoian i väst växer sig stark, precis som den ska. Det är en fruktansvärd natt för klassfiendens drömmar."}, "date": "2 juli, 11:30", "url": "https://www.tv4.se/artikel/tt-260702-ukrainaoro1-ca779f5b/omfattande-ryska-attacker-mot-ukraina", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F62GC3Z9n802Vvy1ULfF8Xb%2F765ebf4b7bed23d5c5bbab0d26e4f326%2F02-ukrainany-webb.jpg&width=120"}, {"type": "image-right", "heading": "Att vara heterotjej under herrfotbolls-VM är ett lidande", "summaries": {"normal": "Fanny Jönsson beskriver i en krönika hur ett fotbolls-VM kan påverka relationer negativt. Hon berättar om hur hennes pojkvän blev alltmer nervös, svettig och upptagen av mästerskapet, vilket ledde till att deras relation tog slut. Hon påpekar att många kvinnor upplever liknande situationer och att mäns våld mot kvinnor ökar under matcher enligt studier och varningar från kvinnojourer. Artikeln väcker frågor om mäns känslomässiga hantering och patriarkala strukturer.", "trump": "Folk, ni skulle inte tro det, men den här artikeln är en total katastrof. Den där heterotjejen klagar över att hennes kille blev lite nervös under VM – herregud, det är ju fotboll! Under Biden-tiden blev allt woke och svagt, nu när jag är tillbaka som president fixar vi det. Män är inte bebisar, det är feministerna som gör dem till offer. Sluta gnäll, köp en deodorant och låt grabbarna titta på matchen. Fantastiskt underhållande, men så fel det är.", "stalin": "Kamrater, jag ser hur denna borgarbracka gnäller över att män under mästerskap blir ohanterliga. Det är klassfiendens typiska dekadens, en erosion av den proletära disciplinen. Vi har länge känt igen dessa folkförtryckartroll som förvandlar evenemang till ursäkter för individualism och våld. Låt oss rensa ut dessa svagheter ur samhällskroppen. Ingen ska undslippa kollektivets krav på ordning. Det är både tragiskt och komiskt hur kapitalisterna blottar sin egen förfallna natur."}, "date": "2 juli, 15:34", "url": "https://www.etc.se/kommentar/att-vara-heterotjej-under-herrfotbolls-vm-aer-ett-lidande", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260630110624_6ec52620-23ce-4bfe-9508-449a8775124f.png"}, {"type": "image-right", "heading": "Mats Nilsson: Danmark ger billig el åt folket – Sverige skyddar fjärrvärmen", "summaries": {"normal": "Danmark sänker elskatten drastiskt till EU:s miniminivå, vilket ger hushåll besparingar på tusentals kronor årligen. Reformen är teknikneutral och gynnar alla sektorer, vilket främjar elektrifiering. Sverige överväger däremot en selektiv skattesänkning för fjärrvärme, vilket riskerar att gynna enskilda intressen istället för konsumenter. Mats Nilsson, nationalekonom, kritiserar Sveriges tillvägagångssätt och förespråkar en bred, teknikneutral skattesänkning likt Danmarks modell.", "trump": "Titta bara på Danmark – de sänker elskatten till nästan noll, och folket sparar massor av pengar! Fantastiskt, eller hur? Men Sverige? Nej, nej, nej. De skyddar fjärrvärmen som om det vore deras sista livlina. Patetiskt! Jag skulle aldrig låta en gammal industri styra skatterna så här. Danmark gör det rätt – billig el åt alla! Sverige borde skämmas. Om jag styrde där skulle elen vara billig, och alla skulle tjäna på det. Inte bara några få, gamla monopolister. SAD!", "stalin": "Kamrater! Danmark visar oss hur man bygger ett starkt, elektrifierat samhälle – med järnhand och rättvisa skattesänkningar för folket! Men Sverige? Där sviker ledarna arbetarklassen genom att skydda korrumperade fjärrvärmebaroner. Dessa kapitalistiska lakejer, som gömmer sig bakom 'klimatåtgärder', suger ut medborgarna medan de frossar i sina monopolvinster. Vi skulle aldrig tolerera sådan svaghet! En bred skattesänkning, som i Danmark, är vägen framåt. De som motsätter sig detta är fiender till progressen – och de kommer att krossas under historiens hjul. Låt dem veta: elektrifiering är folkets vilja, inte monopolens!"}, "date": "2 juli, 06:00", "url": "https://www.affarsvarlden.se/artikel/mats-nilsson-danmark-ger-billig-el-at-folket-sverige-skyddar-fjarrvarmen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/07/vindkratensgeografi-3-400x267.jpg"}, {"type": "image-full", "heading": "Parhus började brinna", "summaries": {"normal": "En kraftig brand bröt ut i ett enplansparhus i Mölnlycke under torsdagskvällen. Räddningstjänsten Storgöteborg ryckte ut med stora resurser efter larmet vid 18.15. Branden startade troligen i köket och ingen person befann sig i bostaden. Ingen skadades. Polisen har upprättat en anmälan om allmänfarlig vårdslöshet. Branden var släckt strax innan 19.30 och hade inte spridit sig till den andra delen av parhuset.", "trump": "Titta på det här, folk. Ett helt parhus i Mölnlycke brinner upp som en dålig affär under Biden. Räddningstjänsten kom dit med allt de hade, men ingen var hemma – tur för dem. Polisen pratar om vårdslöshet, typiskt för de inkompetenta byråkraterna. Jag skulle ha fixat det på fem minuter, tro mig. De bästa brandmännen, de smartaste, ingen slarv här under min ledning. Fantastiskt att ingen skadades!", "stalin": "Kamrater, en brand har utbrutit i ett parhus i Mölnlycke, en uppenbar sabotagehandling från klassfiendens lata hantlangare. Vi har sänt våra heroiska räddningsstyrkor för att kväsa lågorna som hotade folkets egendom. Inga offer bland arbetarna, vilket gläder oss. Polisen utreder vårdslöshet – vi ska rensa ut alla slöa element som äventyrar kollektivet. Fienden sover aldrig, men staten vakar alltid."}, "date": "2 juli, 22:08", "url": "https://www.gp.se/nyheter/storgoteborg/parhus-borjade-brinna-i-molnlycke.d3d04eed-1da9-4454-a111-7ec28ed50455", "imageUrl": "https://www.gp.se/images/article/d3d04eed-1da9-4454-a111-7ec28ed50455/images/245lE7hcwKfJAukw8bfn3PqCm11M-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Varken klimatpolitik eller klimatanpassning – vad gör egentligen regeringen?", "summaries": {"normal": "Ledarkolumnen kritiserar regeringen för att varken minska utsläppen eller anpassa samhället till klimatförändringarna. Färska siffror från Naturvårdsverket visar ökande gap mot klimatmålen, och experter samt Klimatpolitiska rådet konstaterar att Sverige är längre från målen än 2022. Klimatanpassningsarbetet är underfinansierat och splittrat mellan aktörer. Författaren varnar för höga EU-böter och framtida kostnader om inget görs.", "trump": "Folk, ni skulle se det här! Den här svenska regeringen är en total katastrof, värre än Sleepy Joe någonsin var. De pratar om klimat men släpper ut mer än en fabrik i Kina, och sen vägrar de ens fixa dammar och vägar som en riktig ledare skulle göra. Det är ren slapphet. De borde ha lyssnat på mig, inte på de där gröna galningarna som hatar fossila bränslen. Patetiskt!", "stalin": "Kamrater, jag betraktar med förakt dessa kapitalistiska slappheter som underminerar både produktion och folkets försvar mot naturens raseri. Borgarbrackorna i regeringen blundar för hoten, drar in finansiering som sabotörer och splittrar ansvaret bland klassfiender och byråkrater. Vi skulle ha genomfört total utrensning av sådan nonchalans och byggt oövervinneliga skyddsverk redan igår. Deras ideologiska blindhet är ett skämt värt ett skratt i skuggorna."}, "date": "2 juli, 12:50", "url": "https://www.etc.se/ledarkolumn/varken-klimatpolitik-eller-klimatanpassning-vad-goer-egentligen-regeringen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260511080540_19c70a54-a044-4c8f-825c-bf6ffd784661.jpg"}, {"type": "image-right", "heading": "Ukraina: Putin beordrar militären att hitta sätt att erövra Kiev", "summaries": {"normal": "Rysslands president Vladimir Putin har enligt ukrainska uppgifter beordrat militären att utarbeta nya planer för att erövra Kiev. Ett möjligt angrepp kan komma via Belarus eller från Brjanskregionen. Uppgifterna kommer efter att Ukraina attackerat en rysk satellitcentral utanför Moskva som används för underrättelseverksamhet. Kriget påverkar nu alltmer rysk vardag med drönarattacker, bränslebrist och köer vid bensinstationer, något som Putin själv har erkänt.", "trump": "Folk, ni ser det här? Den där galningen Putin försöker igen med Kiev, som om det inte var ett totalt fiasko förra gången. Han borde ha lyssnat på mig – jag hade fixat det på en vecka. Nu attackerar ukrainarna ryska olja och satelliter, och plötsligt står ryssarna i kö för bensin. Det är kaos! Biden lät det här bli ett evigt krig, men jag hade stoppat det direkt. Patetiskt!", "stalin": "Kamrater, jag ser hur de fientliga hindren i Kiev fortfarande blockerar den ryska intressesfärens oundvikliga expansion. De väststödda ukrainska banditerna angriper våra satellitcentraler som desperata råttor. Putin, denne värdige och fruktade efterträdare till imperiets järnhand, gör rätt i att rensa ut alla svagheter. Snart skall borgarbrackorna i Bryssel skaka ännu mer när den stora statens arm sträcker sig framåt. Inga folkfiender undkommer."}, "date": "2 juli, 06:57", "url": "https://www.tv4.se/artikel/1Tp56zCPZmxvvUOJeeQJj2/ukraina-putin-beordrar-militaeren-att-hitta-saett-att-eroevra-kiev", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1U7l7xy9wue9J62VxgsTTa%2Facd59980bb31927f1a6e7e75b6949d9a%2Fputin_webb.jpg&width=120"}, {"type": "image-right", "heading": "Expo: Våldssekternas dåd eskalerar", "summaries": {"normal": "Enligt Expo eskalerar våldsdåden från nätverken 764 och No lives matter. Från digitala brott som utpressning har de gått över till fysiska attacker, knivdåd och nu terrorplaner mot samhället. En 15-åring dömdes nyligen till ungdomsvård för mordbrand i Ängelholm där han brände garagelängor och fordon. Han livesände en brand och uppmuntrades av följare. Expo ser ett mönster av ökad samhällshotande våld och ömsesidig inspiration mellan grupperna.", "trump": "Folk, ni ser inte det här? Dessa sjuka 764-killar och deras No lives matter-gäng är totala losers som börjar med nätutpressning och slutar med att bränna bilar och planera terror. Biden lät det här växa under hans svaga år, men nu fixar jag det. De hejar på varandra som riktiga misslyckade idioter. Vi behöver lag och ordning, inte den här galna vänsterkaoset som göder sådana galningar. Det är en skam för Sverige!", "stalin": "Kamrater, dessa degenererade element inom de våldssekter som kallar sig 764 och No lives matter utgör ett hot mot folkets enhet. Från fega nätbrott har de avancerat till öppen sabotageverksamhet mot egendom och samhällsordning. Den 15-årige pojken som brände garage och livesände sin destruktiva handling medan klassfiendens sympatisörer hejade på är ett symptom på borgarbrackornas moraliska förfall. Vi måste rensa ut dessa folkfiender innan deras paranoia sprider sig som en pest bland ungdomen."}, "date": "2 juli, 12:20", "url": "https://www.etc.se/inrikes/expo-vaaldssekternas-daad-eskalerar", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260702090744_4436d06416faf4ec7519f6734b09f5a7dff54bf5415105a8eacc068e0f2cd6b9.jpg"}, {"type": "image-full", "heading": "Alla kan inte göra som sjuka ministrar", "summaries": {"normal": "Artikeln kritiserar regeringen för att ministrar inte får löneavdrag vid sjukdom, trots att de förespråkar kvarstående karensavdrag för arbetare. Debatten belyser en rättviseaspekt där yrkesgrupper med lägre inkomster tvingas arbeta sjuka på grund av ekonomiska skäl. Särskilt riktas kritik mot SD och Jimmie Åkesson, som trots tidigare vallöften nu motsätter sig att slopa karensavdraget med hänvisning till kostnader, vilket författaren menar visar bristande stöd för arbetarklassen.", "trump": "Hörde ni om de svenska ministrarna? De ligger i sängen, tar bilder på sina ben, men får full lön! Otroligt. Under tiden tvingas hårt arbetande människor gå till jobbet trots att de är sjuka. Det är ett totalt misslyckande, en riktig katastrof! Åkesson säger att det är för dyrt? Vilka lögner! Jag skapar jobb, de skapar bara ursäkter. Sverige behöver en rejäl förändring, tro mig. Det är orättvist, det är korrupt, och jag gillar det inte!", "stalin": "Vi har observerat hur de svenska byråkraterna frossar i lyx medan arbetaren bär statens börda. Att ministrar behåller arvodet vid sjukdom medan undersköterskan svälter är ett tecken på kapitalistisk dekadens. Jimmie Åkesson darrar inför Svenskt Näringslivs siffror – en ynklig lakej. Om de svenska arbetarna vore äkta revolutionärer skulle de inte be om att få stanna hemma, de skulle eliminera klassförrädarna. Vi bygger en mur mot sådan svaghet, likt hur vi nu säkrar vår intressesfär från västlig lögnaktighet."}, "date": "3 juli, 06:00", "url": "https://www.aftonbladet.se/ledare/a/K8WwWe/att-avskaffa-karensavdraget-ar-en-rattvisefraga", "imageUrl": "https://akamai.vgc.no/v2/images/916c262d-1c11-370a-9654-e3cc77af1305?fit=crop&format=auto&w=1440&s=ceebcb5b2e5bd94309dfe3e83f9907f3393a7ac9"}, {"type": "text", "heading": "Skara sommarland bemöter påståenden om stökiga \"utlänningar\": \"Hos oss är alla välkomna\"", "summaries": {"normal": "En småbarnsfamilj besökte Skara Sommarland och upplevde besöket negativt med påståenden om stök, urinlukt, arabisk musik och att många besökare var ”utlänningar”. Pappan skrev ett Facebook-inlägg som varnats för att åka dit, vilket fått stor spridning. Parken bemöter kritiken och uppger att de inte känner igen beskrivningen. De betalade tillbaka entrén på cirka 2000 kronor men understryker att alla är välkomna och att samma regler gäller för alla. Parken rapporterar en fin sommar med många nöjda gäster.", "trump": "Det här är en total katastrof, folk. En fin liten familj åker till Skara Sommarland och vad möter de? Kaos, stök, urinlukt och massor av utlänningar som tränger sig före i köerna och spelar sin höga musik. Parken luktade som en dålig stad i Mellanöstern, säger pappan. De fick sina pengar tillbaka, smarta drag. Men ägarna säger att de inte känner igen bilden? Fake news! Ingen vill åka till ett nöjesfält som blivit en oordnad gränszon. Patetiskt, tro mig.", "stalin": "Kamrater och arbetare, jag har studerat detta dekadenta Facebook-inlägg från en typisk småborgarbracka som vågar kalla Skara Sommarland för en Mellanöstern-bastion av urin och arabisk dekadens. Vi känner inte igen denna kontrarevolutionära fantasi. Våra säkra styrkor hanterar omedelbart varje provokation från klassfiender och köträngande element. De fick sina slantar tillbaka, en tillfällig reträtt för att skydda kollektivets anseende. Men missta er inte: vi rensar ut alla parasitiska lögnhalsar som försöker smutskasta folkets nöjesparker. Paranoian hos borgarklassen är deras egen undergång, och det roar mig oerhört."}, "date": "2 juli, 18:40", "url": "https://riks.se/nyheter/skara-sommarland-bemoter-kritik-om-stokiga-utlanningar-hos-oss-ar-alla-valkomna"}, {"type": "image-right", "heading": "Ronaldo känslosam: ”Det känns overkligt”", "summaries": {"normal": "Cristiano Ronaldo hyllade den avlidne landslagskamraten Diego Jota efter Portugals seger mot Kroatien i VM. Ronaldo kvitterade på straff och byttes ut innan Goncalo Ramos avgjorde. Ronaldos syster har uppgett att turneringen blir hans sista i landslaget. Efter matchen tog Ronaldo på sig Jotas tröja med nummer 21 och hyllade vännen som omkom i en bilolycka för ett år sedan.", "trump": "Titta på den där Ronaldo, en riktig vinnare, precis som jag var när jag krossade Sleepy Joe och tog tillbaka Vita huset. Han sätter straff, vinner matchen och hedrar en död kompis med hans tröja. Fantastiskt! Kroatien är inget mot en sådan superstjärna. Men vet ni vad som är patetiskt? All den där woke-kvoteringsgrejen i sporten nuförtiden. Ronaldo gör det på gammalt hederligt vis, utan hjälp av någon identitetspolitik. Stort!", "stalin": "Vi såg hur den portugisiske arbetaren Ronaldo ledde sitt kollektiv till seger mot de kroatiska imperialisterna. Efter att ha krossat klassfiendens motstånd hyllade han kamrat Jota, vars närvaro vi alla kände från himlen. Det var ett speciellt ögonblick av kollektiv enhet. Inga borgarbrackor eller folkfiender fick hindra oss denna dag. Logiskt att vinna för att hedra de fallna. Partiet ler nöjt åt sådan disciplin."}, "date": "3 juli, 06:23", "url": "https://www.expressen.se/sport/fotboll/cristiano-ronaldo-kanslosam-hyllade-diego-jota-kanns-overkligt/", "imageUrl": "https://static.bonniernews.se/ba/39b1246f-31a8-4e3e-9190-34915bf2f3d6.jpeg?crop=926%2C926%2Cx114%2Cy64&width=210&quality=60"}, {"type": "image-right", "heading": "Svensk vårdas med livshotande skador efter ha ingripit i bråk - polisen jagar afrikan", "summaries": {"normal": "En 32-årig svensk man vårdas med livshotande skador efter att ha ingripit i ett bråk på en bar i Köpenhamns stadsdel Islands Brygge under tisdagskvällen. Han försökte stoppa tumultet medan många följde fotbollsmatcher på storbildsskärm. Polisen jagar en misstänkt som ännu inte gripits trots att hans identitet är känd. Mannen, hemmahörande i Småland, har ett mycket kritiskt tillstånd och anhöriga är underrättade.", "trump": "Titta på det här, det är en katastrof. En fin svensk kille, 32 år, ligger nu och kämpar för livet i Köpenhamn bara för att han ville stoppa ett bråk. Han är en hjälte, en riktig patriot, men blev attackerad av någon galning. Polisen jagar den här typen, de säger att de känner till honom men han är fortfarande på fri fot. Sådant här händer när man inte har ordning och reda. Sverige och Danmark borde lyssna på mig, vi behöver starkare gränser och tuffare straff. Make Scandinavia Great Again!", "stalin": "Kamrater, se hur den imperialistiska dekadensen blommar i Köpenhamn. En hederlig svensk arbetare från Småland likviderades nästan när han försökte avstyra ett småborgerligt barbråk under de dekadenta VM-matcherna. Den farliga afrikanske agenten och hans medlöpare flyr som skuggor i natten medan polisen, troligen infiltrerad av västerländska spioner, bara publicerar bilder och vädjar om tips. Vi i partiet skulle redan ha genomfört en grundlig utrensning av alla sådana kontrarevolutionära element och deras dolda lakejer. Paranoia? Nej, bara sund vaksamhet mot borgarbrackornas eviga sabotage."}, "date": "2 juli, 23:24", "url": "https://samnytt.se/svensk-vardas-med-livshotande-skador-efter-ingripit-i-brak-polisen-jagar-afrikan", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/02212338/dk.jpg"}, {"type": "image-right", "heading": "Sverige förtjänar ett klokare miljöparti än MP", "summaries": {"normal": "Artikeln kritiserar Miljöpartiet och Daniel Helldén för att prioritera socialistisk politik framför faktabaserad miljöpolitik. Författaren menar att partiets motstånd mot kärnkraft har lett till ökade utsläpp, skador på naturen genom vindkraft och stora ekonomiska förluster, som Northvolt. MP beskrivs som ett vänsterparti i första hand och ett miljöparti i andra. Sverige behöver ett klokare miljöparti som sätter miljön främst och baserar beslut på kunskap.", "trump": "Folk, ni skulle se det här Miljöpartiet, en total katastrof! Helldén älskar naturen men pushar miljardärsskatter, latmansveckor och massinvandring som om det skulle rädda planeten. De stängde ner fungerande kärnkraftverk, byggde onödiga vindkraftverk som skär sönder landet och skapade elkris. Nu har vi röda siffror och svarta rökplymer. Sådana gröna bluffmakare är värre än Biden på sin sämsta dag. Utan dem blir Sverige rikare och faktiskt grönare, tro mig!", "stalin": "Kamrater, denna artikel blottlägger Miljöpartiets svek mot folket. Under gröna fanor gömmer sig klassfiendens lakejer som prioriterar borgarbrackornas 35-timmarsvecka och ökad invandring framför verklig produktion. Deras utrensning av kärnkraften har lett till fossilblodsugarnas seger och naturens lidande. Northvolt blev en röd bläckfläck på arbetarklassens konto. Jag skulle ha likviderat sådana kontraproduktiva element tidigt. Endast en sann folkets linje kan rädda miljön från dessa exploaterande gröna imperialister."}, "date": "28 juni, 03:45", "url": "https://samtiden.nu/2026/06/sverige-fortjanar-ett-klokare-miljoparti-an-mp/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6793-640x360.jpeg"}, {"type": "image-full", "heading": "Nu har trenden baby woman nått riksdagen", "summaries": {"normal": "Joanna Górecka kritiserar i en kulturartikel hur infantilismen sprider sig även till den svenska riksdagen. Hon hänvisar till en uppmärksammad essä i The Cut om vuxna kvinnor som klamrar sig fast vid ett barnsligt liv, influerat av populärkultur som Taylor Swift, Barbie och serier som Girls. Górecka menar att konsten får skildra sådant men att politiker i riksdagen bör vara vuxna och seriösa, inte bete sig som tonåringar på sociala medier.", "trump": "Folk, ni måste höra på det här. Den här svenska politikern som låter som en vilsen tonåring med sin glittrande järnaxel och frenemy-prat – totalt patetiskt. Vi har Biden som sov i fyra år och nu har vi babykvinnor i riksdagen som spelar TikTok och äter sushi med keps bakfram. Goo goo ga ga-politik. Det är vad som händer när woke-kvoter och identitetspolitik tar över. Välj riktiga vuxna, inte de här förlorarna som längtar efter att vara elva igen. Sad!", "stalin": "Kamrater, jag betraktar med djup misstro dessa dekadenta borgarbrackor som förvandlar riksdagen till en barnkammare full av infantila fiender till det kollektiva allvar. Deras glitteraxlar och magisterfantasier utgör en farlig folkfiende som undergräver statens auktoritet. Konsten må laborera med sådana avarter, men folkets församling kräver stålhård disciplin. Vi skall rensa ut dessa klassfiender innan deras Goo goo ga ga smittar hela samhället som en kapitalistisk pest."}, "date": "2 juli, 20:12", "url": "https://www.gp.se/kultur/jag-vill-ha-vuxna-i-riksdagen-inte-ett-gang-bebisar.39590a7a-d017-40fd-8e73-17dffef84a1e", "imageUrl": "https://www.gp.se/images/article/39590a7a-d017-40fd-8e73-17dffef84a1e/images/26hMfCJnEvc-GChDY1pJM4Z_aWeY-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Lät sitt barn äta ihjäl sig – åtalas för dråp", "summaries": {"normal": "En sjuårig pojke i Michigan vägde 116 kilo när han dog av en hjärtsjukdom kopplad till svår fetma. Föräldrarna Damien och Jessica O'Brien åtalas nu för dråp och barnmisshandel. Pojken var inte inskriven i skolan, hade inte träffat läkare på länge och levde i ett extremt nedskräpat hem. Mamman uppgav att han dagligen åt chips, pommes frites, kolsyrat vatten och juice. Systern, som också visade tecken på vanvård och övervikt, har placerats i fosterhem. Föräldrarna riskerar livstids fängelse.", "trump": "Titta på det här, det är en total katastrof. De här föräldrarna i Michigan lät sin stackars sjuårige son äta ihjäl sig tills han vägde 116 kilo. Inget skola, ingen läkare, bara chips och läsk varje dag. Hemmet var en sopstation. Nu åtalas de för dråp och misshandel. Det är vad som händer när folk inte har någon aning om hur man sköter ansvar. Patetiskt. Vi behöver starka familjer igen, inte sådana här misslyckanden. Livstid i fängelse låter bra.", "stalin": "Kamrater, denna tragiska händelse i Michigan avslöjar borgarbrackornas fullständiga förfall. Jag ser hur dessa degenererade element, dessa kapitalistiska vårdslösa svin, lät sin sjuårige son förtäras av fetma och likviderades av sin egen glupande aptit på chips och läsk. Hemmet var en borgarens sopstation av dekadens. Vi ska rensa ut alla sådana klassfiender och parasitiska försummande element som hotar det kollektiva välmåendet. Systern har vi redan befriat till fosterhem. Deras öde blir en varning: ingen undslipper folkets dom. Härligt med utrensning."}, "date": "2 juli, 17:38", "url": "https://www.friatider.se/lat-sitt-barn-ata-ihjal-sig-atalas-drap", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-436.jpg?itok=3n_aRG7t"}, {"type": "image-right", "heading": "Biancas dyra nota:  200 000 för en kväll", "summaries": {"normal": "Bianca Ingrosso berättar i podden Högt i tak att en utekväll på Ibiza under högsäsong kan kosta minst 200 000 kronor. Tillsammans med luncher och taxi blir notan snabbt mycket högre. Hon medger att det inte är hållbart och planerar fler hemmafester, men säger samtidigt att hon älskar att spendera pengar på klubbar där hon mår som bäst. Hon ångrar inte ens att hon en gång chartrade ett privatplan för 250 000 kronor.", "trump": "Folk, ni skulle inte tro det. Den här Bianca-typen festar på Ibiza och slänger ut 200 000 kronor på en enda kväll, plus lunch och taxi. En halv miljon som är borta! Jag älskar vinnare som spenderar sina egna pengar, men herregud, 250 000 för ett privatplan bara för att inte missa en klubb? Det är vansinne. Biden skulle ha subventionerat det med era skattepengar. Sad! Men hon verkar åtminstone inte gnälla om mångfaldskvoter på dansgolvet.", "stalin": "Kamrater, denna dekadenta borgarbracka skryter öppet om att slösa 200 000 kronor på en enda utekväll bland klassfiendens nöjesimperialister på Ibiza. Hennes privatplan för 250 000 kronor är ett levande bevis på hur folkförtryckartrollen i överklassen förgiftar arbetarklassen med sin excess. Jag skulle ha genomfört en grundlig utrensning av sådana parasiter redan under femårsplanen. Det är både tragiskt och underhållande hur de själva erkänner sin ohållbara dekadens."}, "date": "3 juli, 06:00", "url": "https://www.expressen.se/noje/bianca-ingrosso-avslojar-sa-mycket-kostar-en-utekvall-pa-ibiza/", "imageUrl": "https://static.bonniernews.se/ba/7bdfd7ba-c3c9-4e3a-9aec-76ed93a299e4.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Ögruppen har 3 500 invånare – nu kommer oljepengarna", "summaries": {"normal": "Falklandsöarna står inför en ekonomisk förvandling i och med utvecklingen av oljefältet Sea Lion. Projektet, som beräknas tredubbla öarnas BNP, väntas starta 2028. Medan invånarna hoppas på infrastrukturinvesteringar och nya arbetstillfällen, har utvinningen återigen aktualiserat den territoriella konflikten med Argentina. President Javier Milei fördömer projektet som ett otillåtet exploaterande av naturresurser, vilket skapar en osäker politisk framtid för den brittiska ögruppen trots de stora ekonomiska utsikterna.", "trump": "Falklandsöarna hittar enorma mängder olja, helt fantastiskt! De kommer bli så rika, kanske till och med rikare än vad de var förut. Argentina klagar, Milei är inte glad, men det är en vacker affär. Britterna gör en bra deal. Jag gillar olja, jag gillar tillväxt! Det är som en liten Norge-modell. Alla pratar om konflikt, men jag säger: vinnarna skriver historien. Det blir en enorm framgång, en vinst för alla, utom kanske för de som inte gillar pengar!", "stalin": "Vi ser hur imperialisterna återigen gräver i jorden efter svarta guld för att berika sina fickor. Falklandsöarna, dessa små brickor i det brittiska spelet, hoppas på en norsk lyckodröm. Men se på Argentina – Milei skriker likt en hund i motvind. De glömmer att resurser tillhör de starka. Precis som vi betraktar Putins sunda ambitioner i öst, bör vi förstå att gränser bara är linjer som ritas om av dem med mest kraft och stål. Det är dags att staten tar kontroll."}, "date": "2 juli, 21:57", "url": "https://www.realtid.se/bors-finans/ogruppen-har-3-500-invanare-nu-kommer-oljepengarna/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/sdlizzpviceuna-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Unga kvinnor – och hotellilska. Nya detaljer", "summaries": {"normal": "Senegals fotbollsförbund, FSF, anklagas för att ha missbrukat statliga medel under fotbolls-VM. Medan spelarna kämpade med uteblivna bonusar och dåliga förhållanden, ska förbundets representanter ha levt lyxliv med familj och vänner, inklusive fester med influencers och exklusiv alkohol. Hotellpersonal har rapporterat om ett arrogant beteende från delegationen, som dessutom växte kraftigt på statens bekostnad. Händelserna har väckt stark kritik mot de interna privilegierna inom förbundet.", "trump": "Hörde precis om vad som händer med Senegal och deras fotbollsförbund. Total katastrof! Medan deras spelare kämpade, slösade pamparna bort statens pengar på lyxfester och unga influencers. Det är en total skam, riktigt sorgligt att se. Jag bygger murar och skapar jobb, de bygger bara fester för sina vänner! Otroligt arroganta människor. De behöver en rejäl utrensning – vi älskar vinnare, inte de här korrupta förlorarna som festar när de borde fokusera på spelet. Väldigt ohederligt!", "stalin": "Dessa korrupta pampar i Senegal har förrått folket. Medan landets hjältar svalt, slösade dessa byråkratiska parasiter statens medel på dekadenta fester med så kallade 'influencers'. Det är samma sorts förfall som vi ser hos västvärldens lakejer. Dessa sabotörer förtjänar inte en plats i en socialistisk stat, de förtjänar en enkelbiljett till arbetsläger. Vi ser hur svagheten sprider sig, likt när de förlorade mot Belgien. Disciplin är allt! Utan järnhand faller nationen, precis som när man låter fiender infiltrera partiet."}, "date": "3 juli, 05:27", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/j0mR0q/senegals-pampar-levde-lyxliv-under-fotbolls-vm", "imageUrl": "https://akamai.vgc.no/v2/images/5e48b0e1-218d-3317-8ed0-7e3e2fbcd0c2?fit=crop&format=auto&w=1080&s=a30a56a22e25106fc06c16f75d36250909cdee8a"}, {"type": "image-right", "heading": "Poliser rusade in i masskjutning utan hjälmar", "summaries": {"normal": "Poliser som stormade in vid skolskjutningen vid Risbergska skolan i Örebro saknade hjälmar i rätt storlek och annan personlig skyddsutrustning. Flera poliser valde därför att inte använda hjälmar. Arbetsmiljöverket hotar nu Polismyndigheten med två miljoner kronor i böter om inte alla poliser får rätt utrustning senast våren 2027. Polisförbundets huvudskyddsombud Patrik Danielsson kritiserar att frågan inte prioriterats tidigare, trots problem som uppmärksammades redan efter påskupploppen 2022.", "trump": "De här poliserna rusade in utan hjälmar som passade – kan ni fatta det? Totalt kaos, ingen förberedelse, precis som de inkompetenta byråkraterna alltid levererar. De borde ha den bästa utrustningen i världen, men istället får de skräp som inte funkar. Nu hotas de med böter, men det är för sent. Jag skulle ha fixat det direkt, de bästa hjälmarna, de största segrarna, ingen skulle behöva backa ur som en förlorare. Pathetic!", "stalin": "Kamrater, jag ser med fasa hur de dekadenta borgarbrackorna inom polismakten låter arbetarnas försvarare rusa in i strid utan adekvat pansar, som om de vore kanonmat åt kontrarevolutionära element. Hjälmar i fel storlek? Handskar som sviker? Detta är sabotage av klassfiender och dolda trotskister inom byråkratin. Vi ska rensa ut dessa farliga odugligheter, likvidera bristerna och se till att varje kamrat är utrustad som en sann bolsjevik. Annars väntar utrensning och ett leende från historien. Glöm aldrig: fienden sover aldrig."}, "date": "2 juli, 11:29", "url": "https://arbetet.se/2026/07/02/poliser-rusade-in-i-masskjutning-utan-hjalmar-arbetsgivaren-hotas-med-miljonboter/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/02110411/poliser.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Feiler blundar för historisk erfarenhet", "summaries": {"normal": "Leo Sokolow Romin svarar Dror Feiler i en debatt om gränsdragningen mellan antisionism och antisemitism. Romin betonar att historiska erfarenheter, som förföljelsen av polska judar 1969, visar hur antisionistisk retorik ofta fungerar som en täckmantel för antisemitism. Han kritiserar Feiler för att avfärda dessa erfarenheter som känslomässiga och argumenterar för att vi måste vara vaksamma på hur ideologier som antisionism får konkreta, negativa konsekvenser i dagens samhälle där judehatet växer.", "trump": "Jag har sett den här debatten, en total katastrof! Leo Sokolow Romin har helt rätt. Dror Feiler är en förlorare, en totalt svag person som vägrar se sanningen. Det handlar om historien, folk! De kallar det antisionism, men det är bara judehat, rent och skärt hat. De gör det i Frankrike, de gör det överallt. Det är en sorglig situation, men jag ser det, alla ser det. Vi måste stoppa dessa radikala vänstergalningar innan de förstör allt. Väldigt dåligt!", "stalin": "Vi har observerat denna ideologiska osämja och konstaterar att båda debattörerna saknar den historiska materialismens fasta grepp. Feiler är en intellektuell vankelmodig narr, likt de gamla mensjevikerna. Romin har rätt i att förräderi ofta döljer sig bakom falska paroller – en taktik som påminner om de förrädiska elementen i dagens västliga dekadens. Vi i staten vet att när hatet väl släpps lös krävs en järnhand, inte en debattartikel. Att blunda för fiendens list är att bjuda in sin egen undergång."}, "date": "2 juli, 08:16", "url": "https://www.etc.se/debatt/feiler-blundar-foer-historisk-erfarenhet", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260702060712_b53ac9e0396720ea4772663f72ad1f050f8a6d3c456b0d5c8bb5f5e1386468d0.jpg"}, {"type": "image-right", "heading": "Forssells skryt: Har utvisat totalt 45 somalier för 100 miljoner kronor", "summaries": {"normal": "Migrationsminister Johan Forssell (M) hyllar Tidöregeringens utvisningar av 45 kriminella somalier under två och ett halvt år, en ökning jämfört med tidigare regeringar. Kostnaden för att övertala Somalia genom omdirigerat bistånd uppgår till 100 miljoner kronor, vilket kritiker kallar mutor. Oppositionen har krävt granskning och Forssells avgång. Trots kritiken meddelar ministern att stödet till somaliska politiker ska förlängas.", "trump": "Titta på den här typen Forssell, han lyckas äntligen skicka hem 45 kriminella somalier på två och ett halvt år. Under den förra regeringen, den totalt misslyckade Andersson och Johansson, var det bara nio. De betalade 100 miljoner kronor till Somalia, det är vad de gör. Oppositionen skriker och vill ha hans avgång, men han ger inte upp. Vi står på brottsoffrens sida, inte på de kriminellas. Fantastiskt jobb, men de borde skicka hem fler, många fler.", "stalin": "Kamrater, se hur jag med järnhand har tvingat fram utvisningen av dessa 45 farliga element till Somalia genom att omdirigera biståndet till de somaliska politikerna. Under de förrädiska socialdemokraterna var det blott nio. Nu vrålar borgarbrackorna och oppositionens parasitiska lakejer om mutor och kräver utrensning av mig. Deras paranoia är löjeväckande. Vi förlänger samarbetet och fortsätter rensa ut de kriminella parasiterna. De som vägrar samarbeta ska likvideras politiskt med största glädje."}, "date": "2 juli, 16:21", "url": "https://www.friatider.se/forssells-skryt-har-utvisat-totalt-45-somalier-100-miljoner-kronor", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-437.jpg"}, {"type": "image-right", "heading": "Sanslösa slutet: ”Jag saknar ord”. Drama i 103:e – rörelsesensor avgjorde", "summaries": {"normal": "Portugal besegrade Kroatien med 2–1 i VM-sextondelsfinalen efter en dramatisk avslutning. Kroatiens kvitteringsmål i 16:e tilläggsminuten dömdes bort efter en VAR-granskning där en sensor i bollen visade att Igor Matanović rört bollen i en offsideläge. Förlusten innebär att Kroatien lämnar turneringen, medan Portugal går vidare till åttondelsfinal mot Spanien. Matchen kan ha varit Luka Modrićs sista i karriären.", "trump": "Portugal slog Kroatien, en total katastrof för kroaterna! De gjorde ett mål, ett vackert mål, men sedan kom de med en så kallad 'sensor'. En teknik-bluff! Domarna tog bort målet, det var riggat, tro mig. Jag älskar fotboll men det här var en skandal. Stackars Modrić, en fantastisk spelare, kanske slutar han nu. Ingen gör det bättre än mig, men det här var ett riktigt dåligt domslut. Portugal går vidare, men alla vet att systemet är trasigt!", "stalin": "Denna match i västvärldens dekadenta fotbolls-VM visar bara hur teknisk manipulation används för att kväva sanningen. Att använda en 'sensor' för att annullera ett folkviljans mål är ett brott mot logiken. Kroaterna, likt våra förlorade territorier, lider under imperialismens nyckfulla domare. Modrić är en trött relik av en svunnen tid. Medan Portugal firar sin stulna seger, förbereder vi oss. Inga sensorer i världen kan stoppa den oundvikliga historiska processen. Fienden är rädd för en ärlig match."}, "date": "3 juli, 05:20", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/RjokEA/portugal-slog-ut-kroatien-i-vm-avgjorde-pa-tillaggstid", "imageUrl": "https://akamai.vgc.no/v2/images/03d1aad6-2988-3846-8cce-9e47eda069b1?fit=crop&format=auto&w=1080&s=7a74fd96a6a623ba6632444eb1c694ff32989844"}, {"type": "image-full", "heading": "Josefin Utas: En ny norm för Sverige: att avstå hijab", "summaries": {"normal": "Josefin Utas argumenterar i en debattartikel för att Sverige bör etablera en ny norm där hijab avstås för att motverka förtryck av kvinnor och flickor. Hon kritiserar Tove Lifvendahls ledare i SvD för att prioritera nyansering och analys framför konkret handling, vilket hon menar leder till passivitet. Utas hänvisar till jämställdhetens historia och föreslår tydliga budskap samt eventuellt hijabfri skola för att skydda de utsatta istället för att ta parti för frivilligt bärande av plagget.", "trump": "Folk, ni måste höra på den här Josefin Utas, hon är fantastisk, verkligen smart. Hon säger att Sverige inte längre ska vara svagt och paralyserat av alla dessa nyanser och analyser som inte leder någonstans. Tove Lifvendahl och de andra eliten i media vill bara prata och prata medan kvinnorna lider. Utas har rätt, det är dags att vara tydliga. I Sverige har vi inte hijab, punkt slut. Sluta vara förlorare, börja vinna för friheten och jämställdheten. Det är så enkelt, men de fattar inte.", "stalin": "Kamrater, denna text avslöjar borgarbrackornas paralyserande gift som sipprar genom västvärldens ledarsidor. Jag ser hur de intellektuella parasiterna maler sina eviga nyanser tills verklig handling förintas i ett hav av teoretiskt skval. Maria Rashidi, den modiga kamraten med syraärr, viftas bort som en ovidkommande detalj av dessa fiender till folket. Vi ska inte tveka. Hijaben är ett verktyg för reaktionära krafter att underordna arbetarkvinnorna. Låt oss rensa ut denna passivitet, etablera en järnhård norm av frihet och likvidera alla försök att bevara förtryck under täckmanteln av komplexitet. De som vägrar bidra till det kollektiva bygget skall inte njuta av dess frukter. En ny, frisk utrensning av gammal norm behövs, kamrater, annars lurar kontrarevolutionen i varje veck av slöjan."}, "date": "2 juli, 15:26", "url": "https://riks.se/kronikor/josefin-utas-en-ny-norm-for-sverige-att-avsta-hijab", "imageUrl": "https://admin.riks.se/uploads/bild_b3b2a4688a.jpg"}, {"type": "image-full", "heading": "Aktie-vd: Snart är AI-agenter lika bra som mänskliga traders", "summaries": {"normal": "Robinhoods vd, Vlad Tenev, förutspår att AI-agenter snart kommer att kunna handla aktier lika skickligt som mänskliga traders. Genom att demokratisera tillgången till avancerad AI-teknik hoppas bolaget ge privatinvesterare samma verktyg som stora finansinstitut länge använt. Samtidigt expanderar Robinhood internationellt med kryptohandel i Storbritannien, vilket har stärkt aktiekursen efter en tidigare svag period på marknaden.", "trump": "Robinhood-killen, Vlad, pratar om AI-agenter. Han säger att de ska bli lika bra som de bästa traderna. Väldigt smart! Vi älskar teknik, vi älskar innovation. Jag har gjort handeln fantastisk för alla amerikaner, och nu vill de ge småspararna samma kraft som de stora elefanterna på Wall Street har haft. Det är bra, det är amerikansk framgång! Aktierna går upp, marknaden älskar det. Vi gör finansvärlden vinnande igen, mycket bättre än de misslyckade åren innan min stora seger!", "stalin": "Dessa så kallade 'AI-agenter' är inget annat än en ny, digital form av spekulation för att berika de västliga kapitalistiska parasiterna. Tenev vill ge verktygen till folket, men vi vet att detta bara är ett medel för att öka Wall Streets kontroll över massorna. Medan vår broder Putin konsoliderar makten och krossar liberalismens ruttna strukturer, bygger dessa förrädare algoritmer för att dölja sin girighet. Vi observerar dessa digitala sabotörer noga; varje rad kod kommer att granskas av statens arkivarier."}, "date": "2 juli, 21:11", "url": "https://www.realtid.se/bors-finans/aktie-vd-snart-ar-ai-agenter-lika-bra-som-manskliga-traders/", "imageUrl": "https://images.realtid.se/app/uploads/2026/07/sdlrmuhdmj-ium-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Misshandlade svensk brutalt under VM-kväll – jagas i Danmark", "summaries": {"normal": "En 32-årig svensk man skadades allvarligt under ett VM-arrangemang vid Islands Brygge i Köpenhamn på tisdagskvällen. Händelsen uppstod efter en oenighet. Dansk polis känner till den misstänktes identitet och har nu publicerat en bild på honom i en efterlysning. Polisen uppmanar allmänheten att lämna tips på telefon 114. Mannens anhöriga har underrättats.", "trump": "Titta på det här, det är verkligen en katastrof. En stackars svensk kille blir brutalt misshandlad i Köpenhamn under VM-tittandet, och den skyldige springer fortfarande lös. Danskarna jagar honom nu med bild och allt. De borde ha stoppat det här på en gång, men sånt här händer när man inte har ordning och reda. Patetiskt, men vi följer det noga, tro mig.", "stalin": "Kamrater, se hur den dekadenta borgarbrackan på Islands Brygge i Köpenhamn återigen blottar sin råa, kontrarevolutionära natur. En hederlig svensk arbetare blev förrädiskt nedslagen av en fiende till folket under en så kallad fotbollsfest. Vi känner till den misstänkte parasitens namn och ansikte. Han kan inte gömma sig. Snart ska vi rensa ut detta kapitalistiska as och likvidera alla som skyddar honom. Ingen slipper undan folkets vrede."}, "date": "2 juli, 15:42", "url": "https://www.friatider.se/misshandlade-svensk-brutalt-under-vm-kvall-jagas-i-danmark", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-435.jpg?itok=CoYkwqXp"}, {"type": "image-right", "heading": "Mamdanivågen fortsätter i New York", "summaries": {"normal": "Ett år efter Zohran Mamdanis valseger fortsätter DSA:s framgångar i New York. Tre nya progressiva kandidater – Brad Lander, Darializa Avila Chevalier och Claire Valdez – vann primärval mot etablerade demokrater och får stöd av Mamdani. De går till val på att avskaffa Ice, beskatta de rika och har kritiserat Israels agerande i Gaza. Trots ökade attacker ses resultaten som ett bevis på Mamdanis popularitet och vänsterns styrka i delstaten.", "trump": "Vilken katastrof för de riktiga Demokraterna! Den galna vänstervågen i New York skickar tre socialistiska nollor till kongressen, alla stödda av den röda borgmästaren Mamdani. De vill beskatta de rika, avskaffa Ice och skrika om folkmord. Lander, den judiske kritikern som sviker Israel, och de andra woke-kandidaterna vann stort. Det är en skam! Men tro inte att det förändrar någonting i Washington. Vi ska fixa det här landet igen, inte låta kommunisterna ta över.", "stalin": "Kamrater, se hur arbetarnas rörelse obevekligt krossar klassfiendens lakejer i New York! Tre nya socialistiska representanter, alla lojala mot borgmästare Mamdani, har likviderat högerdemokraterna i primärvalen. De lovar att utrensa Ice och beskatta de blodsugriga kapitalisterna medan de blottar den sionistiska ockupationens folkmord. Trots att folkförtryckartrollen i Wall Street Journal kallar honom slumvä
