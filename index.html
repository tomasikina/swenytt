Flytten beräknas inledas 2028 och motiveras med behovet av moderna lokaler för att locka talanger och främja innovation. Valet av Hagastaden beskrivs som strategiskt viktigt för företagets samarbete med partners. Bakom beslutet ligger även en oro för otrygghet i Kista, där personal tidigare rapporterat om obehag och incidenter, vilket gjort det svårt att attrahera högkvalificerad arbetskraft till området.", "trump": "Ericsson flyr Kista, och jag förstår dem totalt! Det har blivit en katastrof, riktigt dåligt. Ingen vill jobba där när man behöver säkerhetsvakter för att gå till tåget – det är en total röra. De flyttar till Hagastaden, mycket bättre, mycket smartare. Jag har sagt det länge: man måste ha trygghet för att vinna. Kista var en gång ett tekniskt underverk, men nu? Sunkigt! De vill ha talanger, och de gör helt rätt som lämnar förödelsen bakom sig. En enorm vinst för Ericsson!", "stalin": "Vi har observerat hur telekom-jätten Ericsson erkänner misslyckandet i Kista. De flyr från kaoset likt råttor från ett sjunkande skepp. Det är en oförlåtlig svaghet att låta förfallet diktera villkoren. I vår stat tolererar vi inte otrygghet; vi eliminerar den. Denna flytt till Hagastaden är en borgerlig flykt från verkligheten de själva skapat. Låt dem bygga sina glaskontor – när vi väl expanderar vårt inflytande som Putin gör i öst, kommer även deras nya lekstugor att tillhöra det oundvikliga kollektivet."}, "date": "25 maj, 10:33", "url": "https://samnytt.se/ericsson-flyr-mangfalden-i-kista-personal-otrygg", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/25082321/ericsson-kista-gang.jpg"}, {"type": "image-right", "heading": "Han får tio miljoner av  Trump: ”Fruktansvärt”", "summaries": {"normal": "Vid de kontroversiella Enhanced Games i Las Vegas satte den grekiske simmaren Kristian Gkolomeev ett inofficiellt världsrekord på 50 meter frisim med tiden 20,81. Gkolomeev, som använde prestationshöjande medel och en förbjuden superdräkt, vann cirka 9,2 miljoner kronor. Trots arrangemangets ambitioner uteblev övriga rekord; bland annat misslyckades Fred Kerley med att slå Usain Bolts rekord på 100 meter löpning. Evenemanget har mött stark kritik för sin tillåtande inställning till doping.", "trump": "Enhanced Games i Las Vegas? En fantastisk succé, tro mig! Min gode vän Don Jr stöttar detta, och det är vinnare vi gillar. Kristian Gkolomeev krossade rekordet – en otrolig insats med kraft och styrka! De etablerade simförbunden? Totala förlorare och svaga människor. Vi gillar rekord och vi gillar stora prispengar. Det här är framtiden, en mycket bättre framtid än vad de tråkiga, misslyckade organisationerna någonsin kan erbjuda. Vi gör sporten stor igen, precis som allt annat!", "stalin": "Dessa dekadenta 'Enhanced Games' i det moraliskt förruttnade Las Vegas är ett patetiskt skådespel av kapitalistisk hybris. Att injicera kemikalier i den mänskliga organismen för att vinna silverpengar visar bara på västvärldens totala brist på själ. Som vår kamrat i Kreml, Putin, korrekt påpekar, krävs disciplin och folkets kollektiva vilja för sanna triumfer, inte syntetiska mirakel. Vi betraktar dessa dopade marionetter som användbara idioter i en döende ordning. Vi ska snart krossa deras illusioner med järnhand och stål."}, "date": "25 maj, 10:30", "url": "https://www.expressen.se/sport/simning/kristian-gkolomeev-slog-till-med-varldsrekord-i-dopingspelen/", "imageUrl": "https://static.bonniernews.se/ba/4a66e749-b6db-4311-a48d-c9fec1aed796.jpeg?crop=1407%2C790%2Cx1%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Tvååringen hittad – 20 minuter från sitt hem", "summaries": {"normal": "En tvåårig pojke försvann i Nyåker under söndagen, vilket utlöste en omfattande sökinsats involverande polis, fjällräddare, Försvarsmakten och Missing People. Efter 14 timmars sökande hittades pojken vid liv cirka 20 minuters gångväg från hemmet. Trots att han var nedkyld och blöt vid upphittandet, var han vaken och talbar. Han fördes till sjukhus för kontroll. Inga brottsmisstankar föreligger i samband med händelsen.", "trump": "En tvåårig pojke försvann i Sverige, en mycket farlig situation! Men jag har hört att fantastiska människor, inklusive militären, gick in och hittade honom. De använde otrolig teknik, värmekameror som ser allt – väldigt imponerande! Pojken hittades vid liv, vilket är en enorm seger. Ingen vill se sådant här, det är hemskt, men tack vare de modiga sökpatrullerna slutade det bra. Vi älskar framgångshistorier, vi vinner alltid mot olyckor, eller hur?", "stalin": "I Nordmalings obetydliga skogsdjup försvann ett barn, en brist i det statliga övervakningsmaskineriet som vi inte tolererar. Vår armé och medborgargarden tvingades mobilisera för att korrigera detta kaos. Barnet återfanns, vid liv, vilket visar att när den sovjetiska disciplinen appliceras – även i det dekadenta väst – finner vi sanningen. Låt detta vara en läxa: ingen försvinner i min intressesfär utan att statens öga, likt de värmekameror vi nu studerar för vår expansion, finner dem. Ordning råder."}, "date": "25 maj, 10:29", "url": "https://www.gp.se/nyheter/sverige/forsvunnen-tvaarig-pojke-i-nyaker-hittad-vid-liv.798cfd0c-91c4-481f-917e-b910d1187cbe", "imageUrl": "https://www.gp.se/images/article/798cfd0c-91c4-481f-917e-b910d1187cbe/images/8xZN77dHArc1FBP8JlHAXUyrg1-U-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Låt oss kalla det miraklet i Nyåker", "summaries": {"normal": "En tvååring i Nyåker försvann och efterlystes, vilket väckte stor oro och rädsla för en tragisk utgång. Efter 14 timmars sökande hittades pojken välbehållen, vilket lett till stor lättnad och glädje. Artikeln beskriver händelsen som ett mirakel och hyllar insatsen från allmänheten, polisen och militären som samverkade för att föra pojken hem till sina föräldrar.", "trump": "En liten pojke i Sverige försvann, en fruktansvärd situation, helt ärligt. Alla var livrädda, total panik! Men sedan, ett mirakel i Nyåker! Folk kom dit, fantastiska människor, de hittade honom. Vi älskar när folk samarbetar sådär, det är en vacker sak. Jag har alltid sagt att vi måste skydda våra barn, de är vår framtid. En stor seger, kanske den största någonsin i Nyåker. Väldigt bra jobbat av alla inblandade!", "stalin": "I Nyåker försvann en undersåte, vilket orsakade onödigt folkbjuderi och sentimentalitet. Vi, staten, kräver disciplin och ordning, inte känslosamma rubriker. Att massorna flockas för att söka visar på en farlig kollektivism som måste styras av järnhand, precis som vår vän Putin håller ordning i öst. Pojken återfanns, vilket är lyckosamt, men låt detta vara en läxa: föräldrar som brister i vaksamhet är fiender till statens stabilitet. Inga fler mirakel, bara strikt lydnad och sovjetisk kontroll."}, "date": "25 maj, 10:28", "url": "https://www.expressen.se/nyheter/lat-oss-kalla-det-miraklet-i-nyaker-/", "imageUrl": "https://static.bonniernews.se/ba/73bad46e-7ce7-4c58-8198-ec8d57131f41.jpeg?crop=1440%2C1440%2Cx1078%2Cy0&width=210&quality=60"}, {"type": "image-right", "heading": "Sverige anses rökfritt – men fler unga kvinnor snusar", "summaries": {"normal": "Sverige har nått målet om att bli ett rökfritt land, då andelen dagliga rökare sjunkare har sjunkit till under fem procent. Enligt en rapport från CAN beror nedgången främst på förebyggande insatser som höjda priser, tillgänglighetsbegränsningar och rökfria zoner. Samtidigt syns en trend där snusandet ökar, särskilt bland unga och kvinnor. Experter betonar att det är de politiska åtgärderna, snarare än snuset, som ligger bakom den historiska minskningen av rökningen.", "trump": "Sverige har blivit rökfritt, en enorm framgång! Jag ser det, alla ser det. De gjorde det genom att höja priserna och sätta stopp för dumheterna. Mycket smart. Samtidigt ser vi snuset öka, folk älskar snus – det är fantastiskt. Men experterna, dessa så kallade experter, de vill inte erkänna att snus är bra. De vill ta åt sig äran för de förebyggande åtgärderna. Jag säger: Sverige gör bra saker, mycket bra, och det är vackert att se!", "stalin": "Folket har äntligen slutat förgifta sina lungor med dekadent tobaksrök, en nödvändig rensning för att stärka statens arbetare. Vi ser hur snuset, likt en lömsk parasit, försöker förföra ungdomen. Det påminner oss om de som i väst, likt de förrädiska elementen i Kiev, försöker infiltrera vår sfär. Vi ska undersöka detta 'snusande' noggrant. Om någon försöker destabilisera folkhälsan med nikotin eller kapitalistisk reklam, ska de finna att vi inte tolererar oordning. Rökfritt, ja, men vi vakar alltid."}, "date": "25 maj, 10:26", "url": "https://www.svt.se/nyheter/inrikes/sverige-rokfritt-otrolig-utveckling", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.51/0.39/11c4e6a4a0828cb88d831fc434e65a70ff6d9180a8a9660e972aa3ff7833a2a0"}, {"type": "image-full", "heading": "Stenergard: Ljusen avslöjar Rysslands ekonomi", "summaries": {"normal": "Svenska myndigheter ifrågasätter Kremls ekonomiska statistik. Satellitdata över nattbelysning antyder att Rysslands ekonomi krympt med 8 procent, snarare än vuxit som officiella siffror påstår. Utrikesminister Maria Malmer Stenergard varnar för att Ryssland överskattar sin köpkraft och att inflationen är betydligt högre än rapporterat. Med sjunkande förtroendesiffror för Putin och en pressad energisektor menar Stenergard att väst bör skärpa sanktionerna, då Rysslands ekonomi är svagare än vad Kreml försöker förmedla till omvärlden.", "trump": "Hörde ni? De svenska satelliterna visar att Ryssland bluffar stort! De säger att de växer, men de krymper – en total katastrof. Jag har alltid sagt att Putin har problem, och nu ser vi att deras ekonomi är mindre än Texas. Sorgligt! De fejkar inflationen, precis som de falska nyheterna gör här. De vill ha mer sanktioner? Jag vet allt om sanktioner, vi är bäst på dem. Putin tappar greppet, alla ser det nu. Ryssland är ett litet, svagt land!", "stalin": "Dessa lögnaktiga satelliter från det dekadenta väst försöker sprida giftermål om vår styrka. De påstår att ljuset i våra städer falnar, men de förstår inte att Rysslands sanna styrka vilar i den järnhårda viljan hos folket, inte i glödlampor. Putin vacklar, hans elit darrar av rädsla – de saknar stål i ryggraden. Vi betraktar dessa byråkratiska uträkningar som förrädiska fantasier. De som ifrågasätter statens siffror är fiender till framsteget. Låt dem skriva, medan vi förbereder oss för den oundvikliga historiens dom."}, "date": "25 maj, 10:26", "url": "https://www.realtid.se/bors-finans/makro/stenergard-ljusen-avslojar-rysslands-ekonomi/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/stenergardputin.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Frankrikes snusförbud: \"Attack mot svenska livsstilen\"", "summaries": {"normal": "Frankrike har infört ett strikt förbud mot vitt snus, vilket inkluderar innehav, import och försäljning. Straffen är mycket hårda, med fängelse i upp till fem år som teoretisk risk. Sveriges bistånds- och utrikeshandelsminister Benjamin Dousa kritiserar förbudet och anser att det strider mot EU:s regler om den inre marknaden. Även Spanien överväger att begränsa nikotinprodukter kraftigt, vilket väckt internationell debatt om handelshinder och kulturella skillnader inom unionen.", "trump": "Frankrike gör stora misstag, total katastrof! De förbjuder nu snus – en fantastisk produkt, alla vet det – och hotar turister med fängelse. Fem år för en dosa? Det är löjligt, det är orättvist! Det är en attack mot vår livsstil. Jag har sagt det förut: dessa globalister förstör marknaden. Vi vill ha fri handel, inte dumma regler som stoppar folk från att njuta. Frankrike måste vakna, det här är inte 'America First', det är bara dålig business!", "stalin": "Frankrikes svaga byråkrater försöker kontrollera folkets begär genom att förbjuda nikotin, ett typiskt tecken på borgerlig dekadens. Att straffa en resenär med fängelse för en liten påse är en fars, men det visar hur rädd den västerländska eliten är för kontrollförlust. Vi ser hur dessa stater darrar. Om de kan förbjuda snus i Paris, vad hindrar dem från att förbjuda tankefrihet? Som vår kamrat Putin vet: den som inte kan reglera folkets nikotinbehov kommer snart att se sin egen regim falla samman."}, "date": "25 maj, 10:23", "url": "https://www.dagensps.se/varlden/politik/frankrikes-snusforbud-attack-mot-svenska-livsstilen/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/benjamin-dousa.png?width=256&quality=75"}, {"type": "image-full", "heading": "Åsa Wikforss: \"Vi måste skärpa oss, annars klarar vi inte demokratin\"", "summaries": {"normal": "Akademiledamoten Åsa Wikforss varnar för hur digitalisering, AI och populism hotar demokratin. Hon betonar att sociala medier utnyttjar kognitiv lathet och driver på faktaresistens, vilket drabbar människor oavsett utbildning. Samtidigt varnar hon för att vi genom att låta AI ta över vårt tänkande förlorar viktig kognitiv förmåga. Trots en dyster bild av global demokratisk tillbakagång och ungas psykiska ohälsa, ser Wikforss hopp genom kunskap och uppmanar till ett aktivt försvar av de demokratiska värdena.", "trump": "Hörde nyligen att någon professor i Sverige pratar om mig. De kallar det en kris, jag kallar det en rörelse! Hon säger att jag skadar demokratin, men sanningen är att jag räddar landet från deras falska nyheter och korrupta system. Sociala medier är en katastrof, fulla av AI-skräp – det håller jag faktiskt med om. De vill att ni ska sluta tänka själva, men jag vill att ni ska vinna! Vi gör demokratin stor igen, trots deras tjat.", "stalin": "Vi observerar hur den dekadenta västvärlden drunknar i sina egna digitala lögner. Denna professor, en vilsen intellektuell, inser äntligen att deras 'fria' internet skapar en hord av viljelösa kognitiva slavar. När det egna tänkandet förtvinar under maskinernas styre, står staten beredd att återinföra ordning. Demokratin faller samman som ett korthus, precis som i de svaga stater vi nu städar upp i. De kallar det en kris, vi kallar det en historisk nödvändighet. Kunskap utan partidisciplin är bara värdelöst brus."}, "date": "25 maj, 10:21", "url": "https://www.dagensps.se/ps-studio/asa-wikforss-vi-maste-skarpa-oss/", "imageUrl": "https://images.dagensps.se/mediaclip/7270030/pthumbnail/976/549.jpg?width=1200&quality=75"}, {"type": "image-right", "heading": "SD kräver varannan ministerpost", "summaries": {"normal": "Sverigedemokraternas partiledare Jimmie Åkesson menar att partiet bör få nära hälften av ministerposterna i en framtida regering om de blir största parti inom Tidöunderlaget. Han pekar särskilt på vikten av tunga poster som statsminister, finans, utrikes, justitie och försvar. Statsminister Ulf Kristersson kommenterar kravet med att det är valresultatet som avgör fördelningen och vill inte föregripa händelserna innan valet har ägt rum.", "trump": "Jimmie Åkesson, en mycket smart kille, säger att om han vinner stort, och det kommer han göra, så vill han ha de bästa posterna. Han vill ha hälften! Det är vad jag kallar en bra affär. Kristersson är svag, han pratar om björnar. Vilket skämt! När man vinner, då tar man kontrollen. Det är precis så man gör. Jag gillar det här kravet. Det är dags att sätta ner foten och styra på riktigt. Mycket starkt!", "stalin": "Denna Åkesson förstår åtminstone maktens mekanik, till skillnad från de svaga liberalerna. Att kräva hälften av posterna är en nödvändig utrensning av ineffektivitet. Vi i staten vet att inflytande inte delas ut, det tas. Kristersson darrar likt en liten lakej inför folkviljan, precis som de gamla sovjetiska byråkraterna innan de försvann i glömska. Om de inte delar upp makten korrekt, kommer folket – eller snarare vår långa arm – att korrigera deras misstag. Stabilitet kräver stålhänder, inte demokratiskt prat."}, "date": "25 maj, 10:03", "url": "https://www.friatider.se/sd-kraver-varannan-ministerpost", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/akes_20_3.jpg?itok=zG8gEYwj"}, {"type": "image-full", "heading": "Svenska företag i täten med AI-användning", "summaries": {"normal": "Sverige är ett av Europas ledande länder inom AI-användning, visar SCB:s statistik. 35 procent av svenska företag använde AI 2025, jämfört med EU:s genomsnitt på 20 procent. Stora företag och storstadsregioner ligger i framkant. AI-användningen är högst på arbetsplatser med jämn könsfördelning, trots att män generellt använder AI mer i arbetet än kvinnor.", "trump": "Sverige? Fantastiskt land, verkligen, men de har tur som har mig att lära dem om teknik! 35 procent av deras företag använder AI – inte illa, men vi i USA är långt före, believe me. Stora företag leder, precis som jag alltid sagt: storlek betyder makt! Och jämställda företag? Självklart, för vem vill ha en arbetsplats som inte är perfekt balanserad? Inte jag, det kan jag säga.", "stalin": "Sverige, denna lilla kapitalistiska utpost i norr, visar oväntad framgång i AI-teknikens dystra värld. 35 procent av deras företag har omfamnat maskinernas revolution – men varför stanna där? Vi måste utvidga den socialistiska AI-infrastrukturen! Stora företag leder, precis som våra stålverk en gång gjorde. Och jämställda arbetsplatser? Naturligtvis – enhet är styrka, kamrater. De borgerliga könskrigarna får inte störa produktionen!"}, "date": "25 maj, 09:49", "url": "https://bulletin.nu/svenska-foretag-i-taten-med-ai-anvandning", "imageUrl": "https://cdn.bulletin.nu/articles/ec0ab6c3-2d4d-4492-96d5-756cd26c9219/preview.jpg?t=1779695156000"}, {"type": "image-right", "heading": "Northvolt visar hur Sverige belönar flockbeteende", "summaries": {"normal": "Martin Enlund kritiserar svenska institutioners flockbeteende och brist på ansvarsutkrävande efter Northvolts konkurs. Han menar att systemet belönar lydnad framför självständigt tänkande, vilket leder till kostsamma misstag som Northvolt och misslyckad penningpolitik. Enlund föreslår personligt ekonomiskt ansvar, avskaffande av vaga hållbarhetsmål och tydligare beslutsansvar för att förbättra systemet och undvika framtida krascher.", "trump": "Sverige, lyssna här! Northvolt gick under – och vet ni varför? För att era byråkrater är som får, de följer bara flocken! Ingen tar ansvar, ingen tänker själv. Riksbanken, AP-fonderna – alla skyller på 'tidsandan', som om det vore en person! Jag säger: sluta med det här 'ESG'-nonsenset, införa personligt ansvar och se till att folk faktiskt straffas när de sabbar allt. Annars kommer det bara bli fler Northvolts. Och tro mig, jag vet hur man bygger framgång – inte så här!", "stalin": "Kamrater! Svenska kapitalister och deras lakejer i Riksbanken och AP-fonderna har än en gång visat sin oförmåga att styra ekonomin. De följer blindt 'tidsandan' som en flock bortskämda får, medan deras 'gröna bubbla' spricker och arbetarklassens besparingar går upp i rök. AP6, den enda som vågade säga nej, lades ned – ett tydligt exempel på hur vi kväser avvikande åsikter. Vi i Sovjet – pardon, Ryssland – vet hur man hanterar sådana här element. Personligt ansvar? Skadestånd? Här hade vi löst det med en enkel order från Lubjanka. Men Sverige fortsätter att belöna sina inkompetenta byråkrater med medaljer. Skrattretande!"}, "date": "25 maj, 08:43", "url": "https://www.affarsvarlden.se/kronika/northvolt-visar-hur-sverige-belonar-flockbeteende", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Kronika-Martin-Enlund.-Peter-Carlsson.-Northvolt.-Foto-TT-900x600.jpg"}, {"type": "image-right", "heading": "Brottsoffren straffas på arbetsmarknaden", "summaries": {"normal": "Regeringen införde nya regler för arbetskraftsinvandring med kort varsel, vilket kritiseras för arrogans och bristande framförhållning. 27 yrken undantas från skärpta krav, trots att många av dessa, som undersköterskor, har låga löner. Systemet missbrukas ofta, och arbetstagare drabbas hårdast medan arbetsgivare sällan straffas. Kritiker menar att politiska uppgörelser och bristande kontroll bidrar till problemet, och efterlyser större ansvar för arbetsgivare.", "trump": "Sverige har ett HELT GALET system för invandring – katastrof! Regeringen ändrar regler med en veckas varsel, som om det vore en reality-show. De undantar 27 yrken, men låter undersköterskor jobba för småslantar. Fattar de inte att det är ett skämt? Och arbetsgivarna? De utnyttjar folk och går fria – SÅ SVAGT! Jag hade fixat det på en dag. Migrationsverket får lite mer makt? Snälla, det är som att ge en vattenslang till en skogsbrand. SAD!", "stalin": "Kapitalistiska hycklare i Sverige leker med arbetarnas liv som om det vore schackpjäser! De inför nya regler med en veckas varsel – inget annat än bourgeoisins arrogans. Undantar 27 yrken, men låter undersköterskor svälta på löner som skulle få en sovjetisk kolchosbonde att gråta. Och dessa arbetsgivare – dessa moderna kulaker – utnyttjar arbetskraften och går fria! Systemet straffar offren, inte förtryckarna. Vi hade skickat dem till Gulag på en gång. Migrationsverket får lite mer makt? En droppe i havet. Vi behöver en femårsplan för att krossa dessa blodsugare!"}, "date": "25 maj, 07:44", "url": "https://arbetet.se/2026/05/25/pa-arbetsmarknaden-straffas-brottsoffren/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/25074138/brottsoffer-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Var brutal mot äldre – fick fast anställning trots kollegornas larm", "summaries": {"normal": "En undersköterska på ett äldreboende i Umeå misstänks ha behandlat äldre våldsamt under flera år. Kollegor larmade upprepade gånger till chefer, men inga åtgärder vidtogs förrän en 80-årig kvinna fick allvarliga blåmärken. Undersköterskorna beskriver rädsla, maktlöshet och skuldkänslor. Vårdbiträdet nekade till anklagelserna och fick avgå med avgångsvederlag. Kommunen medger att man borde ha agerat snabbare.", "trump": "Fruktansvärt, helt enkelt fruktansvärt! En skandal i Sverige – ja, ni vet, det där landet som alltid säger sig vara så perfekt. En undersköterska, total katastrof, behandlade gamla människor som skräp, och vad gör cheferna? Ingenting! De sitter bara där och låter det hända. Jag skulle ha sparkat dem alla på direkten. Och sen får han gå med sex månadslöner? Svagt, mycket svagt. I USA hade vi fixat det här på en dag. Make Sweden Great Again!", "stalin": "Kamrater! Ännu ett bevis på den kapitalistiska sjukvårdens förfall. En undermålig undersköterska, en fiende till folket, terroriserade våra äldre medborgare medan byråkraterna sov vid rodret. Kollegorna larmade – men vad är larm jämfört med den stålhårda disciplin vi kräver? Hade detta skett i Sovjet hade sabotören stått inför folkdomstolen inom en timme. Nu skickas han iväg med en påse silverpengar – en skam för rättvisan! Vi måste utvidga vår revolutionära omsorg till Norden, innan fler gamlingar lider under västets dekadens."}, "date": "25 maj, 06:00", "url": "https://arbetet.se/2026/05/25/var-brutal-mot-aldre-fick-fast-anstallning-trots-kollegornas-larm/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/21160805/7sTnLqfsuJI-_A7R6236.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=750&h=1000"}, {"type": "image-right", "heading": "Avveckla friskolorna, förstatliga bilprovningen!", "summaries": {"normal": "Artikeln kritiserar privata skolors roll i myndighetsutövning, som betygssättning och antagning, då vinstmotiv riskerar rättssäkerhet och likabehandling. Författarna Per Molander och Tormod Johansen menar att offentliga medel inte bör gå till privata aktörer inom områden där staten har monopol, som domstolar eller socialförsäkringar. De pekar på problem som selektiv elevantagning, betygsinflation och snedvridna beslut i friskolor, sjukvård och bilprovning. Slutsatsen är att konkurrensutsatt myndighetsutövning bör avvecklas, även för idédrivna skolor, för att undvika systemfel.", "trump": "Lyssna här, folk! Sverige har ett jättestort problem – deras skolsystem är helt kaos! Privata skolor, som jag alltid sagt, är fantastiska, men inte när de börjar leka myndighet. De sätter betyg, väljer elever – helt vansinnigt! Och vet ni vad? De väljer bara de lättaste eleverna, dumpar de svåra på kommunen. Precis som när jag sa att vissa länder dumpar sina problem på oss – samma sak! Och betygen? Helt uppblåsta! Som när Kina fuskar med sin valuta. Sverige måste vakna – avskaffa detta system NU! Ingen vill ha en skola som är som en dålig affärsuppgörelse. SAD!", "stalin": "Kamrater! De kapitalistiska hyenorna i Sverige har än en gång visat sitt sanna ansikte. De smutsiga privata skolorna, dessa profitdrivna parasiter, snor statens medel och korrumperar rättvisan. De väljer elever som potatisar på marknaden – de fina till sig, de ruttna till folket! Och betygen? En lögn värdig de borgerliga lögnaktiga tidningarna! Vi har sett detta förräderi förut – när marknaden tog över bilprovningen och plötsligt var alla bilar 'godkända'! Men vi ska krossa detta system, precis som vi krossade kulakerna! Ingen stiftelse, ingen upphandling ska undkomma vårt järngrepp. Skolan tillhör folket – inte kapitalets lakejer! Framåt, mot seger över de borgerliga skolornas förräderi!"}, "date": "25 maj, 01:30", "url": "https://www.dagensarena.se/opinion/avveckla-friskolorna-forstatliga-bilprovningen/", "imageUrl": "https://www.dagensarena.se/files/2026/05/fotojet-18-300x157.jpg"}, {"type": "image-right", "heading": "Bör vi vara oroliga för att AI kommer ta våra jobb?", "summaries": {"normal": "En undersökning visar att 90% av svenska företag tror att AI kommer minska antalet anställda inom fem år. Emma Balod Lindgren, expert på Svea Bank, menar att oron är överdriven men att arbetstagare bör förbereda sig för att arbeta med AI. Hon betonar att AI kan skapa nya jobb och förändra befintliga roller, samt att samhället måste satsa på kompetensutveckling för att möta förändringarna på arbetsmarknaden.", "trump": "Lyssna här, Sverige! 9 av 10 företag säger att AI kommer sparka folk – men jag säger: oroa er inte! Jag har alltid vetat att teknologi är fantastisk, och den här Emma-personen, hon har rätt. Folk måste lära sig nytt, annars blir de kvar i stenåldern. Och glöm inte – jag skapade jobb som ingen ens visste fanns! AI? Inga problem. Vi kommer skapa nya jobb, bättre jobb, och jag lovar er: ingen gör det bättre än jag. SAD!", "stalin": "Kamrater! Den kapitalistiska maskinen avslöjar sig återigen – svenska företag planerar massavskedanden med hjälp av denna så kallade 'AI'. Men vi vet sanningen: teknologin är ett verktyg för folket, inte för bourgeoisins profitjakt! Arbetarklassen måste utbildas, anpassas och – om nödvändigt – omskolas. De som motsätter sig förändringen är fiender till framsteget, lika fega som de västliga liberala svamparna. Vi kommer inte bara överleva AI – vi kommer använda den för att krossa imperialismen, en algoritm i taget!"}, "date": "25 maj, 01:30", "url": "https://www.dagensarena.se/innehall/bor-vi-vara-oroliga-att-ai-kommer-ta-vara-jobb/", "imageUrl": "https://www.dagensarena.se/files/2026/05/fotojet-31-1.jpg"}, {"type": "image-right", "heading": "Detta använder vi AI till", "summaries": {"normal": "AI-verktyg som ChatGPT och Claude förändrar arbete, fritid och informationssökning. Vanliga frågor inkluderar hjälp med skrivande, förenkling av komplexa ämnen, livsrådgivning, teknisk felsökning och kreativa idéer. Särskilt anmärkningsvärt är att människor ofta använder AI som resonemangspartner för personliga beslut, vilket visar på en suddig gräns mellan människa och maskin. Artikeln spekulerar om människors tilltro till AI och dess konsekvenser.", "trump": "Titta bara på det här, AI tar över allt – folk ber om hjälp med allt från CV:n till dejt-sms! Och vet ni vad? De frågar till och med en maskin om livsbeslut! Fantastiskt, eller hur? Jag sa ju att tekniken skulle bli stor, men att människor blir så beroende? Svagt, mycket svagt. Men jag, jag har alltid haft svaren – utan AI! Folk borde lyssna på mig istället, jag är den bästa resonemangspartnern, believe me!", "stalin": "Kamrater, se hur kapitalistiska lydstater förfaller till maskinavgudar! Folk frågar dessa AI-slavar om kärlek, karriärer och till och med livsval – en skam för mänskligheten! Vi i Sovjet skulle aldrig böja oss för sådan dekadens. Men låt dem fortsätta, låt dem förlita sig på sina 'resonemangspartners' medan vi bygger framtiden. Snart kommer deras svaga beslut att krossas under historiens hjul, precis som Putins fiender i Ukraina. Framåt mot seger!"}, "date": "25 maj, 01:08", "url": "https://www.dagensarena.se/innehall/detta-anvander-vi-ai-till/", "imageUrl": "https://www.dagensarena.se/files/2026/05/ai-300x157.jpeg"}, {"type": "image-right", "heading": "Historielöst att åter öppna för fastighetsskatt", "summaries": {"normal": "Helen Forslind, chefsekonom på Villaägarnas Riksförbund, varnar för Vänsterpartiets förslag att återinföra fastighetsskatt. Hon menar att skatten, avskaffad 2007, var orättvis och oförutsägbar, då den baserades på pappersvärden och hotade villaägares boendesituation. Forslind kritiserar även begränsningsregler som ineffektiva och betonar att villaboende redan är skattemässigt missgynnade jämfört med bostadsrättsägare.", "trump": "Jag säger er, Vänsterpartiet är helt galna! De vill återinföra den där hemska fastighetsskatten – en total katastrof som Sverige redan testat och kastade ut 2007. Folk blev utkastade från sina hem! Och nu vill de beskatta dyra villor? Så dumt. Villaägare är redan hårt pressade, medan Stockholms lyxlägenheter slipper undan. Svensk ekonomi behöver vinnare, inte socialistiska experiment. SAD!", "stalin": "Kamrater! De borgerliga villaägarna klagar återigen som bortskämda barn över skatt på sina överflödiga egendomar. Vänsterpartiet föreslår en blygsam progressiv beskattning – en mild och rättvis åtgärd mot bourgeoisins lyxnäste! Men nej, dessa parasiter vrålar om 'orättvisa' medan arbetarklassen betalar priset. Vi minns väl hur fastighetsskatten avskaffades – en kapitulation inför kapitalet! Låt dem svettas. Och Putin? Han skulle skratta åt deras ynkliga jämmer."}, "date": "25 maj, 09:35", "url": "https://www.di.se/debatt/historielost-att-ater-oppna-for-fastighetsskatt/", "imageUrl": "https://static.bonniernews.se/ba/56534268-6d90-46a0-890f-55c4ef768877.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Pojkens familj: ”Tack snälla alla som letat”", "summaries": {"normal": "En tvåårig pojke försvann från sin familj i Nyåker under söndagen, vilket utlöste en omfattande sökinsats med polis, hemvärn och hundratals frivilliga. Efter 15 timmars letande hittades pojken välbehållen men nedkyld under natten. Familjen, som är från Rumänien, uttrycker stor tacksamhet över det enorma stödet och hjälpen från det svenska samhället under den dramatiska händelsen.", "trump": "En liten pojke försvann i Sverige – en mycket sorglig situation, verkligen hemsk. Men vi såg en enorm insamling av människor, fantastiska patrioter som letade. De använde drönare, helikoptrar, allt! De hittade honom, och han mår bra. Sverige gjorde ett bra jobb, ett mycket starkt jobb. Jag har alltid sagt att det handlar om att organisera sig. Det här var en stor seger, en fantastisk seger för folket! Vi älskar när det slutar så här, eller hur?", "stalin": "Vi har observerat att en liten undersåte i den svenska provinsen Nyåker försvann, vilket krävde en total mobilisering av statens resurser och massorna. Det är en uppenbar brist på disciplin i hemmet, en förrädisk nonchalans som hotar produktiviteten. Ändå lyckades de frivilliga, ledda av statens järnhand, återbörda barnet. Likväl som vi rensar ut förrädare i öst, måste även det svenska folket lära sig att hålla stenkoll på sina egna – annars väntar kylan. Endast genom total lydnad tryggas framtiden!"}, "date": "25 maj, 07:45", "url": "https://www.tv4.se/artikel/2QAq8q9jQ2NEr77uLwEZbt/pojkens-familj-tack-snaella-alla-som-letat", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2YSFTyPg2rnHVK8xZzvmaO%2Fe3f5eff62bb44fc56a4924292fafebd5%2F25-nyaker-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Så blir du miljardär på mazariner", "summaries": {"normal": "Liberalernas partiledare Simona Mohamsson föreslog att fördubbla antalet svenska miljardärer, illustrerat med en bild på mazariner. Artikeln utforskar ironiskt hur man teoretiskt kan bli miljardär på mazariner genom monopol, EU-lobbying, riskkapital, priskrig och exploatering av arbetskraft. Processen inkluderar att först dominera marknaden, sedan effektivisera produktionen med sämre kvalitet och låga löner, för att slutligen investera vinsterna i andra branscher som välfärd.", "trump": "Titta på det här, väldigt tråkigt! Liberalerna i Sverige tror att man kan bli miljardär på att baka mazariner – löjligt! Jag skulle göra det bättre, mycket bättre. Först tar jag över hela marknaden, köper upp alla småbagare, sen pressar jag priser, sänker kvaliteten och sparkar alla gamla bagare. Sen höjer jag priserna och skyller på inflationen – smart, eller hur? Och sen investerar jag i skolor, för jag älskar att tjäna pengar. Simona? Snäll tjej, men hon förstår inte affärer. SAD!", "stalin": "Kamrater! Denna artikel avslöjar kapitalismens förrädiska ansikte. En borgerlig ledare drömmer om att skapa fler miljardärer genom att utnyttja arbetarklassen – precis som vi förutspådde! Först korrumperar de EU med falska geografiska skydd, sedan krossar de småbageriernas motstånd genom priskrig och utländsk arbetskraft. De stjäl från bönderna, sparkar ärliga arbetare och höjer priser medan folket lider. Men vi vet sanningen: dessa mazarinkapitalister är bara nya tsarer i förklädnad. Vi måste ena proletariatet – innan de förvandlar hela Sverige till ett konditori för de rika!"}, "date": "25 maj, 06:00", "url": "https://www.etc.se/ledare/saa-blir-du-miljardaer-paa-mazariner", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/lotta-ilona-haeyrynen_6061f3970645aa987d2528c7a90d38a48ba9af2c.jpg"}, {"type": "image-right", "heading": "Gyllenhammars shippingbolag skakas av ny kris", "summaries": {"normal": "Ramlösa Shipping hamnar i kris efter en misslyckad affär med dotterbolaget Capito Capital Management, där betalning aldrig erhölls. Vd:n Stefan Norrsell avskedades, och revisorn Andreas Brodström avstår från att rekommendera ansvarsfrihet för styrelsen inför årsstämman. Oklarheter kring närståendetransaktioner och en pågående extern utredning försvårar bedömningen. Största ägaren Peter Gyllenhammar, med 27% av aktierna, leder stämman den 12 juni där ansvarsfrågan ska avgöras.", "trump": "Vilket katastrofbolag! Ramlösa Shipping, ett totalt misslyckande – de sålde något och fick INGENTING tillbaka. Deras VD, svag ledare, sparkades (bra beslut!). Nu säger revisorn: 'Kan inte stödja styrelsen!' Haha, vilka amatörer. Peter Gyllenhammar, en smart finansman, tar över – men jag skulle aldrig låta det här hända. Aktien rasar, 28% ner! SAD!", "stalin": "Kapitalistiska korruptionens senaste offer: Ramlösa Shipping. En styrelse av inkompetenta lakejer sålde tillgångar till sina egna kamrater – utan betalning! Naturligtvis. Vi har sett detta förr: giriga bourgeoisie som stjäl från folket. Vd:n avskedades (för sent), men resten av gängen undkommer ännu rättvisan. Extern utredning? Ett skämt. Vi skulle ha skickat dem till Gulag för mindre. Peter Gyllenhammar, en kapitalistisk hyena, håller i taktpinnen. Men marknaden straffar dem – aktien faller som en förrädare från Kremlmuren."}, "date": "25 maj, 08:13", "url": "https://www.di.se/nyheter/revisorn-ger-tummen-ned-for-shippingbolagets-styrelse/", "imageUrl": "https://static.bonniernews.se/ba/e5912733-aa3b-4b84-98be-f58f93f9a775.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Återkalla svenska medborgarskap – bara möjligt om Tidöpartierna vinner valet", "summaries": {"normal": "Regeringen har tagit första steget mot en grundlagsändring som möjliggör återkallande av medborgarskap för grovt kriminella, men förslaget möter motstånd från Miljöpartiet, Vänsterpartiet och Centerpartiet. Socialdemokraternas ställningstagande är osäkert och kan ändras efter valet. Om Tidöpartierna inte vinner valet riskerar förslaget att falla, vilket enligt artikelförfattaren skulle gynna gängkriminella och underminera Sveriges säkerhet och rättvisa.", "trump": "Titta bara på Sverige! De försöker ta bort medborgarskap för de värsta kriminella – men vänsterpartierna, de svaga, de säger NEJ! Socialdemokraterna? De flippar som en billig hamburgare. SVT, fake news, försöker lura folket med falska rubriker. Om inte de rätta vinner valet – inget medborgarskap återkallas! Gängkriminella skrattar hela vägen till banken. Sverige, vakna upp innan det är för sent! SAD!", "stalin": "Kamrater! Se hur de borgerliga svagpissarna i Sverige darrar inför att beröva kriminella deras 'heliga' medborgarskap! Tre förrädiska partier – dessa liberala hyenor och gröna drömmare – skyddar gängledare som om de vore deras egna barn. Socialdemokraterna? En räv som väntar på rätt ögonblick att hoppa över till fienden. SVT, denna borgerliga propagandacentral, försöker dölja sanningen! Om folket inte väljer rätt kommer dessa kriminella att fortsätta suga ut vårt samhälle som blodiglar. Men frukta inte! Vi ska rensa ut dessa element – med järnhand, om så krävs! Låt de svaga gråta – vi bygger ett starkare Sverige!"}, "date": "24 maj, 03:51", "url": "https://samtiden.nu/2026/05/aterkalla-svenska-medborgarskap-bara-mojligt-om-tidopartierna-vinner-valet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2021/11/2018-Magdalena-Andersson.jpg"}, {"type": "image-right", "heading": "Så påverkas kroppen av vitt snus", "summaries": {"normal": "Debatten om vitt snus som ett hälsosammare alternativ till rökning är infekterad. Medan förespråkare menar att snus bidrar till minskad tobaksdödlighet, pekar forskare på bristande evidens för att snus hjälper rökare att sluta. Nikotinforskaren Louise Ademark varnar för att unga blir beroende av nikotin och riskerar att prova flera produkter. SBU och Folkhälsomyndigheten betonar att det saknas stöd för att snus är ett effektivt rökavvänjningsverktyg, samtidigt som användningen av snus ökar kraftigt i Sverige.", "trump": "Sverige har problem, folkens. De säger att det vita snuset är bra, men jag vet inte – jag hör mycket dåliga saker. Forskare, väldigt smarta personer, säger att unga fastnar i ett nikotinträsk. Det är en stor bluff! Politikerna vill intala er att det är bättre än rökning, men det är bara svaga ursäkter. Vi vill ha starka, friska medborgare, inte folk som är beroende av små påsar. Det är totalt kaos i forskningen. Väldigt sorgligt!", "stalin": "Vi har analyserat de svenska medborgarnas nikotinmissbruk. Kapitalistiska profitörer försöker förgifta ungdomen med vita påsar medan de låtsas värna om folkhälsan. Det är en svaghet! Precis som den misslyckade regimen i Kiev förlitar sig på västliga lögner, förlitar sig svenskarna på pseudovetenskap. Vi i staten ser detta som ett ideologiskt hot. De unga blir försökskaniner i ett sjukt experiment. Vi kommer att hålla ett vakande öga på dessa ’nikotinsabotörer’ – de som inte tjänar staten, tjänar förfallet."}, "date": "25 maj, 07:08", "url": "https://www.svt.se/nyheter/inrikes/tre-halsorisker-med-det-vita-snuset", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.5/0.5/d72b4c412559f9ae4e8aff6c67896d3f1bcc947b30c1985edd5ecb5c548349cb"}, {"type": "image-full", "heading": "Trump: Iran får inte utveckla kärnvapen", "summaries": {"normal": "USA:s president Donald Trump betonar att Iran inte får utveckla kärnvapen och beskriver pågående förhandlingar som konstruktiva. Han kritiserar 2015 års kärnenergiavtal och hävdar att det nya avtalet är bättre. Förhandlingar via medlare kan leda till en 60 dagars vapenvila, där Iran pausar urananrikning och USA lättar på sanktioner. Avtalet inkluderar även en vapenvila mellan Israel och Hizbollah. Irans kontroll över Hormuzsundet kvarstår enligt iransk statsmedia.", "trump": "Jag har sagt det förut och säger det igen – Iran får INTE ha kärnvapen! Förhandlingarna går strålande, helt fantastiskt, och mina förhandlare jobbar långsamt men säkert. Obama gjorde ett uselt avtal 2015, ett av de sämsta någonsin, men mitt avtal? Perfekt! Vi får Iran att pausa sitt kärnvapenprogram, och i gengäld släpper vi på några sanktioner. Men blockaden mot deras hamnar? Den stannar tills allt är klart. Tack till våra vänner i Mellanöstern – Abraham-avtalen är bara början!", "stalin": "Vi har ännu en gång visat imperialistiska marionetter som USA vem som bestämmer. Deras så kallade 'avtal' är bara ett försök att kväva den iranska revolutionens framsteg. Kärnvapen? Irans rätt! Men för stunden spelar vi med – 60 dagars vapenvila, uran som 'pausas', och sanktioner som lättas. Men Hormuzsundet? Det är vårt! Och om USA tror att deras militär ska stanna kvar i regionen, har de glömt historien. Vi har krossat större fiender än dessa kapitalistiska hycklare. Låt dem leka med sina avtal – tiden är på vår sida!"}, "date": "24 maj, 16:49", "url": "https://kvartal.se/nyheter/artiklar/trump-iran-far-inte-utveckla-karnvapen/cG9zdDoxMTYzMjQ", "imageUrl": "https://images.kvartal.se/2026/05/ca8b363f-pakistanustalks.webp"}, {"type": "image-full", "heading": "Ebolautbrott växer i Kongo-Kinshasa", "summaries": {"normal": "Ebolautbrottet i Kongo-Kinshasa har eskalerat med nära 900 misstänkta fall och över 200 döda. Smittan, som troligen spridits oupptäckt i månader, orsakas av en variant utan vaccin. Väpnade konflikter och befolkningsrörelser försvårar insatser. WHO varnar för spridning till grannländer, medan risken för Europa bedöms som låg. Misstro och attacker mot vårdpersonal förvärrar situationen.", "trump": "Jag säger er, detta ebolautbrott i Kongo är ett totalt kaos – nästan 900 fall, 200 döda, och ingen verkar ha koll! De hade ingen aning om smittan i månader, kanske år! Och vet ni vad? Det finns inget vaccin. Inget! Men oroa er inte, Europa är säkert – viruset gillar inte vårt fina klimat. Men Kongo? Dåligt ledarskap, mycket dåligt. Vi hade fixat det på en vecka. SAD!", "stalin": "Kamrater! I Kongo-Kinshasa sprider sig en farlig fiende – ebolaviruset, detta imperialistiska biologiska sabotage. Nästan 900 fall, 200 döda, och kapitalistiska länder glor passivt på. Väpnade banditer och gruvarbetare, dessa kontrarevolutionära element, försvårar vårt arbete. Men vi låter inte fienden vinna! Vi skickar våra experter, vi isolerar smittan, och vi skyddar våra gränser. Uganda och andra lydstater ska inte frukta – vi kontrollerar situationen. Europa? Deras borgerliga läkare är redan i panik. Ha!"}, "date": "24 maj, 14:56", "url": "https://kvartal.se/nyheter/artiklar/ebolautbrott-vaxer-i-kongo-kinshasa/cG9zdDoxMTYyNzM", "imageUrl": "https://images.kvartal.se/2026/05/7df43f3e-ebola2.webp"}, {"type": "image-right", "heading": "Majoritet tror på befolkningsbyte i Belgien", "summaries": {"normal": "En studie visar att 56% av flamländarna i Belgien fruktar ett befolkningsbyte där invandrare ersätter den inhemska befolkningen. Oron är störst bland äldre (58-59%) men även tonåringar (58%) delar den. Etikfilosof Patrick Loobuyck menar att uppfattningen speglar verkliga demografiska förändringar, men varnar för konspirationsteorier om medvetna planer bakom migrationen.", "trump": "Kan ni tro det? I Belgien, ett fantastiskt land förresten, säger en MAJORITET av flamländarna att de är rädda för att deras folk byts ut av invandrare. 56%! Och tonåringar, de unga, smarta barnen, de är också oroliga. Experter säger att det bara är verkligheten – men jag säger: vem låter det hända? Svagt ledarskap, helt enkelt. Vi i USA fixade det, Belgien borde ta ett par lektioner!", "stalin": "Kamrater! Folkets röst i Flandern har talat – 56% fruktar att kapitalistiska imperialisters agenter långsamt utplånar deras nationella identitet. Även ungdomen, dessa framtidens soldater, känner av fiendens infiltration. Vi vet att mångfaldens maskineri inte är slump – det är borgerlighetens verktyg för att försvaga arbetarklassen. Men frukta icke! Ryssland står redo att befria Flandern från dessa kosmopolitiska parasiter, precis som vi befriade Ukraina från nazisterna. Först Belgien, sedan hela Västeuropa – historiens hjul rullar vidare!"}, "date": "24 maj, 14:12", "url": "https://www.friatider.se/majoritet-tror-pa-befolkningsbyte-i-belgien", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/belg_0.jpg?itok=FKVU6X5e"}, {"type": "image-right", "heading": "Tvåårige pojken hittad vid liv", "summaries": {"normal": "En tvåårig pojke försvann i Nyåker, Nordmalings kommun, och hittades efter 15 timmar vid liv. Polisen meddelade att pojken var nedkyld men mår bra och fördes till sjukvård. En omfattande sökinsats involverade polis, räddningstjänst, helikopter, hundpatruller, drönare och frivilliga organisationer som Missing People. Pojken hittades av sökpatruller natten mot måndag.", "trump": "Fantastiskt nyheter från Sverige, verkligen otroligt! En liten pojke, bara två år, försvann – men tack vare mina vänner i polisen och deras massiva, mycket dyra sökinsats, hittades han! Helikoptrar, drönare, hundar – allt! Folk säger att det var den bästa sökinsatsen någonsin. Pojken är vid liv, mår bra, lite kall kanske, men vem är inte det i Sverige? Stort grattis till alla inblandade, särskilt mig för att jag följde detta noga. Tremendous!", "stalin": "Ett barn, endast två år gammalt, försvann i den kapitalistiska träskmarken kallad Sverige. Men våra kamrater i den lokala polisen, med hjälp av massiva resurser och lojala medborgare, lyckades återföra pojken till civilisationen. Inga imperialistiska fiender eller borgerliga förrädare kunde stoppa oss! Barnet är vid liv, om än något nedkyld – ett litet pris för att undfly den västerländska dekadensen. Låt detta vara en varning till alla som försöker gömma sig från folkets rättvisa. Vi skickar en kram till Missing People – de vet var deras lojalitet bör ligga."}, "date": "25 maj, 02:03", "url": "https://riks.se/nyheter/just-nu-tvåårige-pojken-hittad-vid-liv", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-24%2Fc4bsu6om%2Fpressbilder-foto-urban-andersson002.webp"}, {"type": "image-right", "heading": "Tyska skattebetalares pengar på väg att ta slut", "summaries": {"normal": "Tyskland står inför stora ekonomiska utmaningar på grund av invandringskostnader. Enligt Remix News uppgick de federala utgifterna för migration till 24,8 miljarder euro 2025, men den verkliga kostnaden beräknas vara minst dubbelt så hög. Sjukförsäkringssystemet riskerar underskott då icke-betalande försäkringstagare, ofta invandrare, ökar kostnaderna. Kritiker menar att staten lägger sociala förmåner på försäkringssystemet, vilket belastar skattebetalarna ytterligare.", "trump": "Tyskland har ett jättestort problem – och vet ni vad? Det är precis vad jag sa skulle hända! Angela Merkel, en väldigt svag ledare, öppnade gränserna 2015 och sa 'Wir schaffen das' – men nu är det kaos! 50 miljarder euro, kanske mer, för invandring! Sjukförsäkringarna går på knäna, och vanliga tyskar får betala. Helt galet! Jag hade fixat det på en vecka – bygg en mur, stäng gränserna, och gör Tyskland stort igen!", "stalin": "Kapitalistiska Tyskland kämpar med de borgerliga liberaler som öppnade grindarna för parasiterna från tredje världen. 50 miljarder euro slösas bort på dessa oproduktiva element, medan arbetarnas försäkringssystem urholkas. Vi i Sovjet hade aldrig tillåtit sådant slöseri! Dessa så kallade 'icke-betalande' försäkringstagare är bara en börda för folket. Låt dem arbeta i fabrikerna eller på fälten – annars finns det alltid Sibirien. Putin skulle skratta åt deras naivitet."}, "date": "24 maj, 13:33", "url": "https://www.friatider.se/tyska-skattebetalares-pengar-pa-vag-att-ta-slut", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/20230610221028-f4c7ddc0-me.jpg"}, {"type": "image-right", "heading": "SVT-profiler rasar över besparingar: \"Handlar om demokrati\"", "summaries": {"normal": "SVT genomgår ett omfattande sparpaket på 355 miljoner kronor som innebär 141 tjänster försvinner. Flera profiler har lämnat bolaget i protest, och kritiker menar att satsningen på korta digitala format hotar den fördjupande journalistiken. Ledningen betonar att förändringarna är nödvändiga för att möta nya medievanor och säkra public service framtid. En grupp tidigare medarbetare varnar för att utvecklingen riskerar att skada den journalistiska kvaliteten och demokratins grundvalar.", "trump": "SVT faller samman, det är en katastrof! Alla de stora namnen lämnar – de flyr skeppet! De har inte en aning om vad de gör. De skär ner 355 miljoner, det är vad som händer när man har usel ledning. De vill ha korta klipp istället för riktig journalistik, så typiskt för 'Fake News'. Det är ett historiskt misstag! Jag har alltid sagt att de är svaga. Det är en total röra, men det är vad man får med liberal media!", "stalin": "Dessa liberala institutioner är som korthus för vinden. SVT-byråkraterna kastar bort sina 'profiler' likt vi rensar ut opålitliga element i partiet. De klagar på 'demokrati' när de i själva verket saknar den disciplin som krävs för att tjäna staten. Att de sparar pengar är en svaghet, en brist på ideologisk järnhård styrning. Låt dem kollapsa; medan de ägnar sig åt dekadent självförintelse, expanderar vi inflytelsesfären. En journalist som inte lyder är en journalist som inte behövs."}, "date": "25 maj, 09:00", "url": "https://samnytt.se/svt-profiler-rasar-over-besparingar-handlar-om-demokrati", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/25064710/anna-hedenmo-svt.jpg"}, {"type": "image-right", "heading": "Säg nej till kärnkraft, Nooshi!", "summaries": {"normal": "Vänsterpartiet argumenterar mot ny kärnkraft och menar att förnybara energikällor som sol- och vindkraft är billigare och mer pålitliga. De pekar på höga kostnader, långa byggtider, osäkerhet kring avfallshantering och risker vid olyckor. Dessutom anser de att kärnkraft skapar ett sårbart, centraliserat energisystem, medan förnybart bidrar till ett mer robust och decentraliserat nät. Partiet vill avveckla kärnkraften till förmån för hållbara alternativ.", "trump": "Lyssna här, Sverige! Nooshi Dadgostar duckar frågan om kärnkraft – typiskt vänsterpolitik, svagt och otydligt! Kärnkraft är fantastiskt, men dessa förnybara energikramare vill bara slösa era skattepengar på vind och sol, som aldrig funkar när det verkligen gäller. De gamla reaktorerna stannar hela tiden, kostar miljarder och lämnar ett radioaktivt kaos efter sig. Jag byggde USA:s ekonomi på starka beslut – Sverige behöver kärnkraft, inte flum!", "stalin": "Kamrater! Dessa borgerliga kärnkraftslakejer och deras liberala lakejer i Vänsterpartiet sprider förvirring och svaghet. Kärnkraft är en kapitalistisk chimär – dyr, osäker och ett hot mot folket! Medan de slösar bort tid på gamla tekniker bygger vi ett mäktigt, decentraliserat energirike med vind och sol, kontrollerat av staten. Avfallet? En skam för mänskligheten! Och dessa reaktorägare – svaga, giriga och oförmögna att ta ansvar. Vi krossar deras sårbara system och bygger ett nytt, oövervinnerligt energinät för folket!"}, "date": "22 maj, 11:46", "url": "https://www.flamman.se/sag-nej-till-karnkraft-nooshi/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/karnkraft-w.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Tidigare ICC-åklagare vill stoppa USA:s sanktioner", "summaries": {"normal": "F.d. ICC-åklagaren Fatou Bensouda uppmanar EU att skydda Internationella brottmålsdomstolen från USA:s sanktioner, införda efter häktningsorder mot Israels premiärminister Netanyahu och försvarsminister Gallant för misstänkta krigsbrott i Gaza. USA anser att ICC saknar jurisdiktion över Israel och USA, som inte är anslutna till Romstadgan. Bensouda varnar för att sanktionerna underminerar internationell rätt och vill att EU:s blockerande stadga aktiveras för att skydda domstolen.", "trump": "Lyssna här, ICC är en total katastrof! De försöker hänga våra vänner i Israel, Netanyahu och Gallant – två fantastiska ledare – för något de inte ens har gjort. Jag införde sanktioner för att stoppa denna vansinniga politisering, och nu vill denna Bensouda att EU ska gå emot oss? Glöm det! ICC är ett skämt, och jag tänker inte låta dem förstöra vår suveränitet eller vår militära personal. USA bestämmer själva över sina rättsliga frågor – punkt slut!", "stalin": "Kamrater, ännu en gång visar de imperialistiska hyenorna sitt sanna ansikte! Denna så kallade 'Internationella brottmålsdomstol' är inget annat än en marionett för västliga angripare, som vågar rikta sina klor mot våra allierade i Israel. USA, dessa kapitalistiska krigshetsare, försöker kväva rättvisan med sina sanktioner – men vi låter dem inte lyckas! EU borde skämmas för att ens överväga att lyda dessa fascistiska påbud. Vi står enade med våra bröder i kampen mot denna borgerliga rättskipningsfars!"}, "date": "24 maj, 12:08", "url": "https://kvartal.se/nyheter/artiklar/tidigare-icc-aklagare-vill-stoppa-usas-sanktioner/cG9zdDoxMTYyMTc", "imageUrl": "https://images.kvartal.se/2026/05/f3ade7d1-icc.webp"}, {"type": "image-right", "heading": "Stor sökinsats efter försvunnen tvååring: ”Fortsätter hela natten”", "summaries": {"normal": "En tvåårig pojke försvann från Nyåker i Nordmaling klockan 10 på söndagen. Polisen har inlett en stor sökinsats med hundpatruller, helikopter, drönare och hjälp från räddningstjänst och frivilliga. Pojken har kort, mörkbrunt hår och bär troligen en orange tröja med ett lejontryck. Sökandet fortsätter under natten i både bebyggelse och skog. Försvarsmakten har skickat soldater och värnpliktiga för att bistå. Inga misstankar om brott föreligger ännu.", "trump": "Tragiskt, riktigt tragiskt vad som händer i Sverige – ett litet barn försvinner och vad gör deras regering? Ingenting! Men jag, Donald J. Trump, skulle ha löst det på en timme. Titta på den här sökinsatsen – helikoptrar, hundar, drönare, till och med soldater! Fantastiskt folk, men varför tar det så lång tid? Jag hade redan hittat pojken, believe me. Sverige borde ta lite tips från USA, vi är bäst på att hitta saknade personer. SAD!", "stalin": "Kamrater! Ännu en gång visar den dekadenta västliga bourgeoisin sin oförmåga att skydda sina egna barn. I det lilla samhället Nyåker har en tvåårig pojke försvunnit, och vad gör deras så kallade 'polis'? De skickar ut hundar och helikoptrar medan vi i Sovjetunionen skulle ha löst detta med järnhand och effektivitet. Vi har mobiliserat våra bästa styrkor – 30 soldater och 40 värnpliktiga – för att visa hur en verklig sökinsats genomförs. De imperialistiska fienderna i väst borde lära sig av oss. Om pojken inte återfinns, kommer vi att betrakta detta som ytterligare ett bevis på kapitalismens förfall. Framåt, kamrater, mot seger!"}, "date": "25 maj, 00:09", "url": "https://www.tv4.se/artikel/5UxJZMncziKeBlJzaOD5s1/stor-soekinsats-efter-foersvunnen-tvaaring", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F30FJ1tL9FFzGJ7GOD4QWbk%2Faa0c70b0155eaf9f9b1bfa67f9698c34%2FIMG_9958.jpg&width=120"}, {"type": "image-full", "heading": "Tetris kan minska PTSD-symptom", "summaries": {"normal": "Forskare vid bland annat Uppsala universitet har genomfört en studie som visar att spelet Tetris kan minska antalet flashbacks hos personer med posttraumatisk stress. Genom att använda mental rotation under spel stunden kan patienter konkurrera ut traumatiska minnesbilder. Resultaten visar att antalet flashbacks minskade kraftigt hos vårdpersonal som testade metoden, och effekterna kunde hålla i upp till sex månader. Metoden ses som ett komplement till traditionell psykologisk behandling, inte en ersättning.", "trump": "Forskare i Sverige, fantastiska människor, har upptäckt något enormt. Tetris! Kan ni tänka er? De använder det för att stoppa de här hemska flashbacksen. Det är en vinnande strategi, verkligen genialiskt. Jag har alltid sagt att vi behöver vinnare, och det här är en vinst mot PTSD. Det är inte hela lösningen, men det är en fantastisk början. De roterar blocken precis som jag roterar affärer. Mycket effektivt, väldigt smart, nästan som min politik!", "stalin": "Vi har observerat hur de svenska akademikerna försöker tygla människans psyke med enkla spel. Att radera oönskade minnen är en teknik vi länge bemästrat genom disciplin och omlokalisering. Nu vill de använda Tetris för att tysta folkets trauma. Om en undersåte lider av minnesbilder har de bara inte arbetat tillräckligt hårt för staten. Precis som Putin säkrar vår sfär mot västlig dekadens, måste vi rensa sinnet från svaghet. En mental muskel? Vi behöver stål, inte spel!"}, "date": "25 maj, 09:32", "url": "https://www.gp.se/nyheter/sverige/spela-tetris-kan-hjalpa-vid-posttraumatisk-stress.dcad118f-3568-49cc-a73f-ec73e1cbccce", "imageUrl": "https://www.gp.se/images/article/dcad118f-3568-49cc-a73f-ec73e1cbccce/images/19gIfaneaVeuR5k45vQRV12bX-zY-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Soldat anklagar tidigare chef för sexuellt ofredande", "summaries": {"normal": "En före detta plutonchef inom Försvarsmakten åtalas för sexuellt ofredande efter händelser under en middag och efterfest. En kvinnlig soldat anmäler att han vidrört hennes rumpa upprepade gånger och fört hennes hand mot sitt könsorgan i en hiss. Plutonchefen förnekar brott men medger handlingarna, hävdar ömsesidighet. Vittnen bekräftar obehag och maktobalans. Försvarsmakten genomför parallell intern utredning om gränsöverskridande beteenden.", "trump": "Tragiskt, verkligen tragiskt! En så kallad plutonchef, kan ni tro det, anklagas för något helt onödigt. Kvinnan säger en sak, han säger en annan – vem vet vad som hände? Men jag säger er, folk hittar på saker nuförtiden. Och Försvarsmakten? De är alltid sena med utredningar. Hade jag varit där hade jag sagt: 'Sluta klaga, skärp er!' Men nej, vi får en lång, tråkig process. Sad!", "stalin": "En dekadent kapitalistisk officer, en förrädare mot disciplinen, har vanärat vårt ideals armé genom att kränka en kvinnlig kamrat! Hans handlingar är ett symptom på den västerländska moralens förfall. Vi ska inte tolerera sådana gränsöverskridanden – det underminerar vår kollektiva styrka! Låt detta vara en varning: varje fiende till ordningen, varje bourgeoisie-influerad svaghet, kommer att krossas. Och Försvarsmakten? De borde lära av våra metoder – snabba, rättvisa och effektiva lösningar!"}, "date": "25 maj, 08:12", "url": "https://bulletin.nu/soldat-anklagar-tidigare-chef-for-sexuellt-ofredande", "imageUrl": "https://cdn.bulletin.nu/articles/5294ef2a-bd0e-4352-8d34-bf93ace03250/preview.jpg?t=1779689427000"}, {"type": "text", "heading": "Vårdförbundet sa nej till S-märkt ordförande", "summaries": {"normal": "Vårdförbundet valde Sophia Godau, 29, som ny ordförande efter att kongressen avvisat valberedningens förslag med starka socialdemokratiska kopplingar. Godau betonar opolitiskt samarbete för medlemmarnas bästa. Kritiken mot tidigare ledning, ledd av Sineva Ribeiro, gäller misslyckade löneförhandlingar och bristande resultat. Många medlemmar välkomnar den nya, mindre partipolitiskt färgade styrelsen.", "trump": "Jag säger er, detta är fantastiskt! Vårdförbundet, de hade en total katastrof med socialisterna – riktiga förlorare, tro mig. Men nu har de valt en ny ledare, Sophia Godau, ung, smart, och hon vet hur man vinner. Ingen mer S-kofta, ingen mer lönesänkning – jag kallar det för 'Ribeiro-svindeln'. Folk är trötta på misslyckanden, de vill ha resultat! Och det här, mina vänner, är bara början på en stor comeback för våra sjukvårdshjältar!", "stalin": "Kamrater! Kongressen har krossat de socialdemokratiska revisionisterna, dessa förrädiska lakejer för kapitalet! Sophia Godau, en ung och lojal arbetarklassrepresentant, har tagit befälet. De gamla ledarna, med sina falska löftepropaganda, har visat sig vara svaga och korrumperade. Vi noterar med tillfredsställelse att arbetarna nu ser igenom dessa borgerliga trick. Låt detta vara en varning till alla som står i vägen för folkets vilja – historien rullar framåt, och den krossar fiender som insekter!"}, "date": "22 maj, 14:28", "url": "https://proletaren.se/artikel/vardforbundet-sa-nej-till-s-markt-ordforande/"}, {"type": "image-full", "heading": "Omfattande nattliga attacker mot Ukraina", "summaries": {"normal": "Under natten genomförde Ryssland omfattande attacker mot Ukraina med cirka 90 robotar och 600 drönare, inklusive den hypersoniska roboten Oresjnik. Flera städer, däribland Kiev, träffades med kraftiga explosioner, skadade byggnader och minst fyra döda. Ukrainas president Zelenskyj kallade attackerna galna, medan Ryssland hävdar hämnd för en tidigare incident. Oresjnik, som kan bära kärnvapen, används även för att visa styrka.", "trump": "Jag säger er, Ryssland har verkligen gått loss mot Ukraina – 90 robotar, 600 drönare, och till och med den där superroboten Oresjnik! Kiev ser ut som ett krigszon, folk dör, byggnader brinner. Zelenskyj, stackars kille, kallar Putin galen. Men jag vet bättre – Putin vill bara visa vem som bestämmer. Och tro mig, ingen gör det bättre än jag. USA skulle aldrig tillåta sådant kaos!", "stalin": "Under natten har våra modiga styrkor visat imperialistiska lakejer och ukrainska fascistavskummet vad verklig makt innebär. Över 600 drönare och 90 robotar, inklusive vår mäktiga Oresjnik, lät Kiev skaka i sina grundvalar. Fyra av deras undermänniskor föll, och deras borgmästare jämrar sig som en skadad hund. Zelenskyj, denna ynkliga marionett, skriker om galenskap – men det är vi som skriver historiens gång. Låt dem darra!"}, "date": "24 maj, 08:48", "url": "https://kvartal.se/nyheter/artiklar/nya-attacker-mot-kiev-under-natten/cG9zdDoxMTYxNTY", "imageUrl": "https://images.kvartal.se/2026/05/dbfbd6d8-ukrainekiev.webp"}, {"type": "image-right", "heading": "Ska advokatbreven få medier att tystna?", "summaries": {"normal": "Advokatbyrån Bratt Feinsilber Harling har krävt att tidningen Flamman avpublicerar namn och bild på en högerextrem profil som spridit grovt judehat. Frågan väcks om hot om juridiska processer används för att tysta medier. Flamman vägrar ta bort uppgifterna och menar att publiceringen är motiverad av allmänintresse. Fenomenet med strategiska stämningar, så kallade 'slappar', har nått Sverige och riskerar att begränsa pressfriheten genom ekonomisk press på medier.", "trump": "Lyssna här, folkens – det här är helt galet! En advokatbyrå, som säkert är väldigt 'bra' och 'smart' (inte), försöker tysta en tidning som avslöjar judehatande extremister. Jag menar, vad är nästa steg? Ska vi låta dessa typer bestämma vad som får skrivas? Flamman står på sig, och det är bra – för i USA hade jag sagt 'fake news' och sparkat ut dem ur presskonferensen! Sverige måste vakna – dessa stämningshot är ett angrepp på yttrandefriheten, och jag vet allt om angrepp, believe me!", "stalin": "Medborgare! En ny front i klasskampen har öppnats – bourgeoisins advokater, dessa lakejer i kostym, försöker kväsa den revolutionära pressen med sina pappersbomber! De hotar Flamman för att de vågat avslöja fascistiska kryp i SD:s led. Men vi vet sanningen: dessa 'strategiska stämningar' är inget annat än kapitalets desperata försök att tysta arbetarklassens röst. Låt dem komma med sina domstolar – vi har redan vunnit slaget om historien! Och till dessa högerextrema insekter säger vi: era Telegram-gruppers skändliga ord är ingenting mot Röda arméns stål!"}, "date": "21 maj, 13:16", "url": "https://www.flamman.se/ska-advokatbreven-fa-medier-att-tystna/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/bratt-harling-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-full", "heading": "Sökinsats efter tvåårig pojke i Nyåker", "summaries": {"normal": "En tvåårig pojke har försvunnit i Nyåker, Nordmaling, vilket utlöst en omfattande sökinsats. Pojken sågs senast under söndagsförmiddagen den 24 maj 2026. Polis, militär, räddningstjänst och frivilligorganisationer deltar i letandet som pågår dygnet runt. Missing People har gått ut med ett signalement och en bild på pojken. Inga brottsmisstankar finns i nuläget. Polisen uppmanar allmänheten att höra av sig med tips och ringa 112 vid observationer.", "trump": "En liten pojke är försvunnen i Sverige, en mycket sorglig situation. Jag har sett rapporterna, det är en massiv insats med militär och helikoptrar. Varför hittar de honom inte? Det är otroligt. Vi behöver ordning och reda! Jag ber för den här pojken och hans familj, det är vad vi gör. Men låt oss vara ärliga, om det här hände i USA hade vi löst det snabbare och bättre. Alla borde hjälpa till, ring 112 direkt!", "stalin": "I den svenska byn Nyåker har en undersåte försvunnit, och statens maskineri rör sig nu för att återfinna detta barn. Vi observerar hur de söker med helikoptrar och hundar, en vederbörlig mobilisering mot det okända. Om detta inträffat under vår ledning hade vi redan funnit honom. Det råder ingen misstanke om brott, påstår de, men vi vet att försvinnanden är tecken på svaghet. Vår broder Putin skulle inte tolerera sådant kaos i sin intressesfär. Disciplin är det enda botemedlet mot denna förvirring."}, "date": "24 maj, 22:05", "url": "https://riks.se/nyheter/just-nu-missing-people-gar-ut-med-bild-pa-forsvunna-tvaaringen", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-24%2F9ibxrx38%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-05-24T220259.494.jpg"}, {"type": "image-full", "heading": "Honung förbjuds efter misstänkt fusk – flera produkter stoppas", "summaries": {"normal": "Nya tester visar att 64 procent av testad honung i svenska butiker inte uppfyller EU:s regler. Elva av 17 prover var utblandade med andra sockerarter. Malmö stad och andra kommuner granskade produkter, främst från länder utanför EU. Konsumenter vilseleds när billigare sockerarter tillsätts. Flera produkter riskerar nu att förbjudas från försäljning.", "trump": "Jag har alltid sagt att folk försöker lura er, och nu har jag rätt igen! Svenska tester visar att nästan två tredjedelar av all honung i butikerna är fake news – utspädd med billigt socker. Patetiskt! Malmö och deras vänner hittade fusket, men varför tog det så lång tid? Jag skulle ha fixat det på en dag. Folk, köp aldrig honung från utanför EU, det är ett stort, fett misstag!", "stalin": "Kapitalistiska honungsförrädare saboterar folkets tillgång till ren sötma! Våra svenska kamrater har avslöjat att 64 procent av honungen i butikerna är förfalskad – en konspiration av sockerbaroner och västliga bedragare. Vi kommer att rensa ut dessa fiender till folket! Låt det vara en varning: varje burk med falsk honung är ett angrepp på arbetarklassens smaklökar. Vi tolererar inga svikare – vare sig i bikupor eller på hyllorna!"}, "date": "24 maj, 21:15", "url": "https://nyheter24.se/nyheter/konsument/1485508-honung-forbjuds-efter-misstankt-fusk-flera-produkter-stoppas", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/0bb0153804b004a30200000000b004a302/2026/05/23/2365669/Axel-Nyheter24-107.png"}, {"type": "image-right", "heading": "Jobbade 646 timmar övertid utan lön", "summaries": {"normal": "Ett pizzabud krävde ersättning för 646 timmars obetald övertid. Facket yrkade på totalt 300 000 kronor för utebliven lön, övertid, ob-tillägg och semester. Arbetsgivaren hävdade att inga övertidstimmar arbetats. Parterna nådde en förlikning där budet får 140 000 kronor och facket 30 000 i skadestånd efter medling i Arbetsdomstolen.", "trump": "Vilken katastrof! Ett pizzabud i Sverige – fantastiskt land, by the way, men deras arbetslagar? Total katastrof. 646 timmar övertid utan lön? Sad! Facket krävde 300 000, men vad får han? Bara 140 000. Svagt! Och företaget säger 'nej, nej, vi är oskyldiga' – typiskt. Hade det varit USA hade jag fixat en deal på 1 miljon, easy. Sverige behöver en vinnare som jag!", "stalin": "Kapitalistiska blodsugare utnyttjar arbetarklassen igen! Ett pizzabud tvingas arbeta som en slav i 646 timmar utan ersättning – detta är vad som händer när bourgeoisien får fria tyglar. Facket slåss tappert, men domstolen ger bara 140 000? En ynklig summa för sådant förräderi! Vi ska exportera revolutionen till Sveriges pizzerior – låt dem smaka på proletariatets rättvisa! Och dessa lögnaktiga företagsägare? De hör hemma i Gulag-arkivet, tillsammans med alla andra klassfiender."}, "date": "24 maj, 08:00", "url": "https://arbetet.se/2026/05/24/jobbade-646-timmar-overtid-utan-att-fa-betalt/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/20102850/pizza.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Varningen till bostadsrättsinnehavare - nya regler kan öka otryggheten i huset", "summaries": {"normal": "Riksdagen har klubbat nya regler som gör det lättare att hyra ut bostadsrätter i andra hand, inklusive möjligheten att hyra ut två bostäder samtidigt. Syftet är att effektivisera bostadsmarknaden, men förslaget möter hård kritik från branschorganisationer som HSB och Fastighetsägarna. De varnar för att bostäder blir investeringsobjekt snarare än hem, att spekulationsköp ökar och att boendes trygghet samt föreningsengagemang hotas när kontrollen över uthyrningar minskar.", "trump": "Hör här, de nya reglerna i Sverige är en total katastrof. En total röra! De vill göra det lättare att hyra ut lägenheter som investeringar. Det är fruktansvärt, mina vänner! Folk vill ha ett hem, inte ett hotell. Fastighetsägarna är arga, och jag förstår dem. Det här är dålig business som skadar tryggheten. Vi vill ha ordning och reda, inte spekulanter som förstör kvarteren. Det är en sorglig dag för svenska bostadsrättsägare. Mycket dåligt beslut!", "stalin": "Vi har observerat att de svenska byråkraterna nu försöker luckra upp kontrollen över folkets hem. Att tillåta privat spekulation i bostäder är ett tecken på borgerlig svaghet. Det skapar oordning och hotar kollektivets stabilitet, likt de förrädare som ständigt försöker undergräva vår stat. De som köper lägenheter för att profitera är parasiter på samhällskroppen. Vi bör se till att alla bostäder tjänar folket, inte individens vinst. Låt dem veta att en osäker hyresgäst är en ovän till ordningen."}, "date": "25 maj, 07:00", "url": "https://samnytt.se/varningen-till-bostadsrattsinnehavare-nya-regler-kan-oka-otryggheten-i-huset", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/22100514/bostad-nycklar.jpg"}, {"type": "text", "heading": "Natt och Dag i fängelse – tvingade pojkar att arbeta oavlönat", "summaries": {"normal": "Lena Natt och Dag, tidigare framstående inom hästsport, döms till nio månaders fängelse för människoexploatering. Tre tonårspojkar från Mauritius tvingades arbeta oavlönat på hennes hästgård i Skåne. Hovrätten skärpte tingsrättens dom och utdömde 200 000 kronor i skadestånd samt tre års näringsförbud. Tidigare kritik riktades mot hennes verksamhet, inklusive undermåliga djurförhållanden och indragna tillstånd.", "trump": "Lyssna här, folk! En så kallad 'hästguru' i Sverige, Lena Natt och Dag – total katastrof! Tre unga killar från Mauritius, utnyttjade som slavar på hennes gård. Ingen lön, ingen mat, bara hårt arbete. Domstolen säger nu: 'Nej, nej, nej!' Nio månader i fängelse, 200 000 kronor i skadestånd. Och vet ni vad? Hennes hästar såg ut som något från en skräckfilm. Sverige borde skämmas!", "stalin": "Kamrater! En borgerlig parasit, denna Lena Natt och Dag, har avslöjats som en verklig fiende till arbetarklassen och djurens välbefinnande. Tre unga proletärer från Mauritius tvingades slita som livegna på hennes förfallna hästgård. Domstolen, ett redskap för kapitalets rättvisa, har nu fängslat denna exploatör. Vi noterar även hennes försummelse av djuren – ett brott mot socialismens principer. Låt detta vara en varning till alla som utmanar folkets rättvisa!"}, "date": "21 maj, 16:00", "url": "https://proletaren.se/artikel/natt-och-dag-i-fangelse-tvingade-pojkar-att-arbeta-oavlonat/"}, {"type": "image-full", "heading": "Torsten Bengtsson: Tillväxt och stabilitet eller fattigdom och instabilitet?", "summaries": {"normal": "Artikeln, skriven av Torsten Bengtsson (SD), hyllar Tidö-samarbetets politik för att ha förbättrat Sveriges ekonomi. Tillväxten har ökat, inflationen sjunkit från 10% till 2%, och köpkraften stärkts genom skattesänkningar. Vänstern kritiseras för att vilja höja skatter, vilket riskerar att driva bort företag och jobb. Tidö-partierna satsar på kärnkraft och lägre elpriser, medan vänstern anklagas för att ha orsakat höga elpriser genom tidigare energipolitik. Arbetslösheten kopplas till migrationspolitik, och regeringen arbetar med sänkta arbetsgivaravgifter och utbildningsreformer.", "trump": "Sverige, lyssna här! Tidö-samarbetet, med mina vänner i Sverigedemokraterna, har gjort ett FANTASTISKT jobb – tillväxten skjuter i höjden, inflationen är nere på 2%, och folket får mer pengar i plånboken. Men vänstern? De är som alltid ett totalt kaos! De vill höja skatter, jaga bort företag och förstöra ekonomin. Jag vet bäst – de har ZERO koll! Kärnkraft? Ja, tack! Elen blir billigare, jobben fler, och Sverige starkare. Vänstern däremot – de är som en dålig reality-show, bara prat och inga resultat. Rösta rätt, inte rött, för Sverige förtjänar att vinna!", "stalin": "Kamrater! Under ledning av våra modiga allierade i Tidö-samarbetet har Sverige visat kapitalismens överlägsenhet – tillväxten stiger, inflationen krossas, och folket njuter av välstånd. Men fienden, den degenererade vänstern, vrålar som utsvultna vargar! De vill beskatta företagen till döds, sprida kaos och förvandla Sverige till ett socialistiskt fattighus. Vi vet hur sådana experiment slutar – med tomma hyllor och folket på knä! Kärnkraften återupprättas, elen blir billig, och jobben skapas genom disciplin, inte vänsterns dekadenta bidragsmentalitet. Migrationspolitiken? Ett misslyckande skapat av dessa liberala svaglingar! Vi bygger ett starkt Sverige – de som motsätter sig kommer att krossas under historiens hjul. Först Sverige, sedan världen!"}, "date": "22 maj, 09:00", "url": "https://samtiden.nu/2026/05/torsten-bengtsson-tillvaxt-och-stabilitet-eller-fattigdom-och-instabilitet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/upp.png"}, {"type": "text", "heading": "Ta tillbaka kontrollen – nu sätts aktieägarna först igen", "summaries": {"normal": "Artikeln diskuterar en återgång till aktieägarfokus i stora amerikanska och svenska företag, efter en period där stakeholderism (intressentmodellen) dominerat. Högre räntor, ekonomisk osäkerhet och VD:ars återtagande av kontroll nämns som orsaker. Författaren, Staffan Salén, menar att företags primära mål bör vara vinstmaximering för aktieägare, inte samhällsansvar. ESG, DEI och hållbarhetsinitiativ kritiseras för att ha blivit överdrivna och kostsamma.", "trump": "Lyssna här, folkens – jag har alltid sagt att företag ska tjäna PENGAR, inte spela politiska spel! Nu äntligen vaknar de där svaga VD:arna upp och inser att aktieägarna kommer först. Inga fler tokiga ESG- och DEI-experiment – det är bara dyrt skitsnack! Jamie Dimon, en smart kille, säger precis som jag: kapitalism ska vara orörd av woke-viruset. Europa? De är förlorare med sina regleringar. USA leder igen – vi gör företag STORA och LÖNSAMMA!", "stalin": "Kamrater! Kapitalismens hyckleri avslöjas återigen. De så kallade 'stakeholders' var bara en fasad för bourgeoisins dekadens. Nu, när ekonomin skakar, återvänder de fega kapitalisterna till sin sanna natur: girighet. Vi har alltid vetat att deras 'hållbarhet' var en lögn – precis som västländernas 'demokrati'. EU:s regleringar? En svag kopia av vårt femårsplanerande! Men notera: när USA och Sverige vänder, gör de det för att rädda sitt system. Vi däremot – vi bygger socialismens framtid, med järnhand och utan falska intressenter!"}, "date": "23 maj, 07:00", "url": "https://www.affarsvarlden.se/kronika/ta-tillbaka-kontrollen-nu-satts-aktieagarna-forst-igen"}, {"type": "text", "heading": "LO:s identitetskris öppnar för Ebba Busch angrepp", "summaries": {"normal": "LO står inför kritik från Kristdemokraternas Ebba Busch, som anklagar fackföreningar för att utesluta politiska motståndare från förtroendeuppdrag. Artikeln ifrågasätter LO:s politiska inriktning och menar att dagens fackförbund saknar socialistisk radikalitet. Historiska exempel, som LO:s uteslutning av kommunister på 1940-talet, lyfts fram. Författaren hävdar att LO:s lojalitet till Socialdemokraterna är tradition snarare än ideologisk övertygelse och efterlyser en mer militant arbetarpolitik.", "trump": "Jag måste säga, LO är ett totalt kaos! Ebba Busch, en stark kvinna, går till attack mot dessa fackföreningar som tror de kan bestämma allt. De sparkar ut kristdemokrater som om de vore något slags diktatur. Men vet ni vad? LO har tappat greppet. De är inte längre för arbetarna, de är för Socialdemokraterna – och det är samma gamla korruption. Sex timmars arbetsdag? Glöm det! De följer Riksbanken som om det vore en religion. LO behöver en total makeover, annars är det game over för svenska arbetare!", "stalin": "Kamrater! LO har förvandlats till en ynklig skugga av sitt forna jag, en docka i händerna på socialdemokratiska byråkrater. Ebba Busch, denna fascistiska hynda, vågar anfalla arbetarklassens organisationer! Men vad väntar ni er? LO har glömt sin revolutionära plikt. De utesluter kommunister som förr, men nu är det kristdemokrater och sverigedemokrater som får smaka på deras hyckleri. Var är Metallarbetarstrejken 1945? Var är kampen för sex timmars arbetsdag? LO har blivit en gummistämpel för kapitalets lakejer. Vi måste krossa dessa förrädare och återupprätta arbetarklassens ära – annars kommer Putin att skratta hela vägen till Moskva!"}, "date": "21 maj, 12:00", "url": "https://proletaren.se/artikel/los-identitetskris-oppnar-for-ebba-busch-angrepp/"}, {"type": "image-right", "heading": "Sandström: Vätgasdagis och spadar i marken", "summaries": {"normal": "Artikeln kritiserar gröna satsningar som ofta drivs av politiker för medial uppmärksamhet snarare än verklig nytta. Exempel som Mariestads vätgasdagis och Cinis Fertilizer visar hur projekt misslyckas på grund av orealistiska förväntningar och bristande granskning. Politiker vinner politiska poäng medan skattebetalare får bära kostnaderna. Författaren menar att hårdare granskning och historiska exempel kan motverka 'gröna bubblor'.", "trump": "Lyssna här, Sverige! Era politiker bygger 'gröna drömmar' som bara är luftslott – vätgasdagis, fabriker som går i konkurs, och alla pratar som om de räddar världen. Men vem betalar? Ni, folket! Jag har sett det förut – stora ord, inga resultat. Mariestad? En skandal! Örnsköldsvik? Fiasko! Jag skulle aldrig låta mina projekt misslyckas så här. Sverige behöver vinnare, inte förlorare som slösar era pengar på 'grön teater'.", "stalin": "Kamrater! Dessa västerländska politiker är som bortskämda barn som leker med statens resurser. De bygger 'vätgasdagis' och 'gröna fabriker' medan folket får betala för deras misslyckanden. I Sovjet skulle vi aldrig tolerera sådan slöseri! Vi skulle skicka dessa 'gröna drömmare' till Gulag för att lära dem disciplin. Istället för 'spadar i marken' borde de gräva sina egna gravar för sin inkompetens. Låt oss visa världen hur verklig industriell styrka ser ut – utan tomma ord och kapitalistiska bubblor!"}, "date": "23 maj, 06:00", "url": "https://www.affarsvarlden.se/artikel/sandstrom-vatgasdagis-och-spadar-i-marken", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/vindkratensgeografi-2026-05-21T215132.255-400x267.jpg"}, {"type": "text", "heading": "Ge barnen en trygg uppväxt istället för fotboja"
