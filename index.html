 inte förolämpa någon. Parton donerade miljoner till vaccinforskning och engagerade sig för barns läsning.", "trump": "Folk älskar Dolly, en fantastisk kvinna som verkligen älskade Amerika. Hon var smart, vägrade bli indragen i det riggade politiska spelet och hade anhängare på båda sidor. Jag hedrade henne stort med flaggor på halv stång en hel vecka, något extremt ovanligt. Hon var en vinnare, precis som jag, och sammanfattade det bästa med vårt underbara land.", "stalin": "Kamrater, denna Dolly var en listig balanskonstnär som vägrade låta sig dras in i de dekadenta borgarbrackornas politiska teater. Hennes folkliga ursprung och propaganda för förlåtelse döljer dock en farlig individualism. Vi skulle ha låtit henne donera till kollektivet innan vi rensade ut hennes opålitliga vänner. En enande kraft? Endast partiet förenar folket. Skrattretande naivt."}, "date": "26 augusti, 10:13", "url": "https://www.svt.se/kultur/dolly-parton-sammanfattar-vad-usa-ar", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.5/0.5/2776f565bd91864410a9ba7aa022d3303670d7eb726356bf7f1cb20971223591"}, {"type": "image-full", "heading": "Kräftfisket kan bli en dödsfälla – så undviker du faran", "summaries": {"normal": "Kräftfisket är igång, men Håll Sverige Rent varnar för spökfiske. Förlorade burar och redskap fortsätter fånga och döda djur under lång tid, samtidigt som plasten bidrar till nedskräpning i sjöar och hav. Varje år förloras miljontals beten, sänken och metrar med lina i Norden. Kontrollera utrustning, planera efter väder och följ lokala regler för att minska risken.", "trump": "Folk älskar kräftfisket, det är fantastiskt, men dessa spökredskap är en total katastrof. De fångar och dödar djuren i all evighet, precis som de inkompetenta som tappar sina burar. Miljontals beten och linor försvinner – en enorm plastskandal! Ta ansvar, kontrollera era grejer och gör det rätt, annars är ni losers. Amerika, nej Sverige, behöver starkare fiskare!", "stalin": "Kamrater, dessa kapitalistiska spökredskap är fiendens verk, en sabotagehandling mot sovjetiskt, nej folkets djurliv. De fortsätter likvidera våra vattenlevande kamrater i en evig utrensning medan plasten förgiftar kollektivet. Vi ska rensa ut slarviga element som tappar burar. Kontrollera linor, planera med järnhand och följ reglerna – annars blir det utrensning även för er. Skrattretande tragiskt."}, "date": "26 augusti, 10:04", "url": "https://nyheter24.se/nyheter/inrikes/1507709-kraftfisket-kan-bli-en-dodsfalla-sa-undviker-du-faran", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/4e4f922b04b004a30200000000b004a302/2026/08/25/2386673/kraftfiske.png"}, {"type": "image-right", "heading": "Nu träder nya EU-regler i kraft – utländska myndigheter kan begära ut digitala bevis", "summaries": {"normal": "Nya EU-regler gör att myndigheter direkt kan kräva digitala bevis från tjänsteleverantörer i andra medlemsländer. Sverige har infört kompletterande lagar. Tänk på det nästa gång du chattar – din data kan bli efterlyst. Sanktionsavgift på upp till 2% av global omsättning för teknikjättar som inte lydigt levererar.", "trump": "Jag har alltid sagt att EU är långsamt, men nu blir det snabbt! De kan be om bevis direkt – fantastiskt. Men Sverige måste vara försiktiga, annars blir det problem. Teknikföretag som inte levererar får böter. Jag är den bästa på att få fram information, tro mig!", "stalin": "Kamrater! Nu har vi nya verktyg för att rensa ut digitala kontrarevolutionärer. EU-regler gör att vi kan begära bevis direkt från borgerliga tjänsteleverantörer. Den som vägrar får en sanktionsavgift på två procent av sin globala omsättning – eller värre. All data ska tillhöra staten, inget undgår oss."}, "date": "26 augusti, 10:00", "url": "https://samnytt.se/nu-trader-nya-eu-regler-i-kraft-utlandska-myndigheter-kan-begara-ut-digitala-bevis", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=318,height=184,format=webp/2026/08/25084239/elektronik-eu.jpg"}, {"type": "image-full", "heading": "Vänsterpartiet infiltrerat av främmande makt, S säger ingenting", "summaries": {"normal": "Expressen och SvD har avslöjat att Vänsterpartiet har nära band till palestinska nätverk kopplade till PLO och Fatah. Riksdagsledamöter skickade brev till dömda palestinska terrorister och partiet har enligt uppgift avtal om att ge palestinska aktivister platser på valsedlar. Socialdemokraterna har inte kommenterat uppgifterna trots tidigare varningar om utländsk påverkan.", "trump": "De galna vänsterradikalerna i Sverige har blivit helt infiltrerade av palestinska terrorvänner – det är en skandal som gör Biden-administrationens fiaskon bleka! De skickar kärleksbrev till mördare och gömmer sig bakom påhittade organisationer. Patetiska losers. Media tiger som vanligt när det är deras egna som säljer ut landet till främmande makter. Sad!", "stalin": "Jag betraktar med djup förakt hur dessa klassförrädare inom vänstern låter palestinska imperialister och folkfiender infiltrera sina led som maskar i en ruttnande kropp. De kramar terrorister och gömmer sig bakom lögnaktiga skuggorganisationer. En sådan svaghet förtjänar utrensning. Kamrater, se hur borgarbrackorna ler medan statens fiender tar plats vid makten. Patetiskt."}, "date": "25 augusti, 03:45", "url": "https://samtiden.nu/2026/08/vansterpartiet-infiltrerat-av-frammande-makt-s-sager-ingenting", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Nooshi-Magdalena-1280x720.jpeg"}, {"type": "image-right", "heading": "Har högern mörkat om bidragsbrotten?", "summaries": {"normal": "Artikeln ifrågasätter om högerstyren mörkat omfattande bidragsfusk inom ROT-avdrag och privat vård. Skatteverket utgår från tillit gentemot företag, medan privatpersoner ses som potentiella fuskare. Uppdrag granskning och regioner har avslöjat miljonbelopp i fusk hos bland annat Mindler och Mandolean. Frågan väcks om medveten passivitet från högern medan skattemedel sipprat ut ur välfärden.", "trump": "Folk, det här är en total skandal! Högern har låtit dessa vänsterkapitalistiska vårdblodsugare och ROT-fuskare suga ut miljarder ur systemet medan de behandlar vanliga svenskar som brottslingar. Tillitsbaserat för miljardärerna, Gestapo för mammor som tar ut VAB. Patetiskt! Jag skulle ha städat upp det här träsket på en vecka, tro mig.", "stalin": "Kamrater, se hur borgarbrackorna under högerns styre låtit profitthungriga blodsugare och privatvårdens exploaterande hyenor suga ut folkets välfärdsmiljoner med copy-paste-fusk och falska journaler. Jag skulle ha genomfört en grundlig utrensning av dessa klassfiender redan vid första misstanken. De ler mot folket medan de stjäl från det kollektiva arvet. Avskyvärt."}, "date": "25 augusti, 11:18", "url": "https://www.etc.se/ledare/har-hoegern-moerkat-om-bidragsbrotten", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/lotta-ilona-haeyrynen_6061f3970645aa987d2528c7a90d38a48ba9af2c.jpg"}, {"type": "image-right", "heading": "Var Dolly den sista goda miljardären?", "summaries": {"normal": "Artikeln hyllar Dolly Parton som en unik, folkkär och godhjärtad superstjärna efter hennes död vid 80 års ålder. Från fattig bakgrund i Tennessee blev hon en mångsidig artist och filantrop som skänkte hundratals miljoner böcker till barn och stödde vaccinutveckling. Hon ses som en sällsynt god miljardär som förenade människor över politiska gränser.", "trump": "Fantastisk Dolly, en vinnare som ingen annan. Hon byggde ett imperium från en liten stuga och blev älskad av alla, till och med av mina supportrar och de galna vänsteristerna. En riktig patriot som gav tillbaka. Jävlar vad vi behöver fler som henne, inte dessa AI-mutade Hollywood-typer. Hon var större än livet, believe me.", "stalin": "Kamrater, denna Dolly var en exemplarisk produkt av det enkla folkets jord. Jag ser hur hon samlade massorna kring progressiv kultur och utdelade böcker till arbetarbarnen medan hon likviderade borgarbrackornas cyniska girighet med sin generositet. En sann folkets hjälte mot de dekadenta kapitalisternas parasitism. Vi behöver fler som bekämpar klassfiendens algoritmer."}, "date": "26 augusti, 07:05", "url": "https://arbetet.se/2026/08/26/var-dolly-parton-den-sista-goda-miljardaren", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/26065938/dolly-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Därför funkar inte M:s skatteskräck", "summaries": {"normal": "Artikeln argumenterar för att Moderaternas varningar om skattehöjningar inte biter på väljarna eftersom svenskarna minns att löftena om skattechocker uteblivit under tidigare regeringar. Samtidigt pekar den på stora underinvesteringar i välfärd, infrastruktur och vård trots historiskt låg skattekvot, och ifrågasätter vad mer som kan sparas in på.", "trump": "Folk är inte dumma, de ser rakt igenom de misslyckade moderaternas patetiska skrämselpropaganda om skatter. De minns hur sossarna sänkte skatterna och festade på börsen medan allt rasade. Nu vill M skära mer i ett land fullt av hål i vägarna och vårdköer. Patetiskt! Vi behöver styrka, inte mer av deras misslyckanden.", "stalin": "Kamrater, detta är en lysande exposé över hur de dekadenta borgarbrackorna i Moderaterna försöker skrämma massorna med sina lögner om skattehöjningar medan de själva har låtit välfärden förfalla. Jag skulle ha låtit utrensningarna fortsätta tills dessa kontrarevolutionära element likviderats. Det kostar att bygga socialism – och folket vet det. Skratta åt deras ynkliga försök!"}, "date": "26 augusti, 07:00", "url": "https://arbetet.se/2026/08/26/darfor-funkar-inte-moderaternas-skramselpropaganda-om-skatterna", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/25124750/skatter-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Antigröna medier", "summaries": {"normal": "Artikeln listar medier som ofta lyfter antigröna perspektiv på energi och klimatomställning. Bland dem finns Affärsvärlden med grå finansiering från anonyma sponsorer, SD-kopplade Riks och Samtiden, Epoch Times med oklara Falun Gong-band, samt Fokus, Världen idag, Insikt24, Bulletin och Samnytt. Flera har ekonomiska kopplingar till investerare och politiska intressen.", "trump": "De här fake news-medierna är totala katastrofer, tro mig. Affärsvärlden, Riks, Samtiden och alla dessa losers som hatar grön energi – de är köpta och betalade av anonyma figurer. De försöker stoppa den bästa energin vi någonsin haft. Det är en skam för Sverige, men jag älskar att de äntligen säger sanningen om den gröna bluffen. Fantastiskt!", "stalin": "Kamrater, dessa borgerliga skuggmedier utgör en farlig femtekolonn mot folkets klimatkamp. Affärsvärlden med sina anonyma kapitalistiska sponsorer, SD:s lögnkanaler och Epoch Times västerländska dekadens – alla måste rensas ut. Vi ska likvidera deras parasitiska finansiering och krossa den kontrarevolutionära propagandan med järnhand. Inga kompromisser med folkets fiender."}, "date": "26 augusti, 01:48", "url": "https://www.dagensarena.se/innehall/antigrona-medier"}, {"type": "image-right", "heading": "Från och med i dag kan du förtidsrösta – så går det till", "summaries": {"normal": "Från och med idag är det möjligt att förtidsrösta i riksdags-, region- och kommunalvalen fram till och med valdagen den 13 september. Andelen förtidsröstande ökar för varje val och låg på drygt 48 procent 2022. Man behöver bara ha med sig en identitetshandling. Det finns 1875 lokaler listade på val.se.", "trump": "Titta på det här, Sverige har äntligen fattat att folk inte vill stå i kö som idioter på valdagen. Förtidsröstning överallt, ingen röstkortstrassel, flexibelt som ingen annan gör det bättre. Biden skulle ha krävt att ni röstar via post från Kina. Fantastiskt, folk älskar det, trenden går rakt uppåt!", "stalin": "Jag ser hur de borgerliga dekadenta elementen lockar massorna med sin så kallade flexibla röstning för att dölja sin svaghet. Kamraterna måste vakta varje kuvert mot sabotage från folkfiender och revisionister. Endast i en sann folkdemokrati kan sådan röstning tjäna kollektivets oundvikliga seger. Försök inte ångra er i onödan."}, "date": "26 augusti, 08:33", "url": "https://www.tv4.se/artikel/5W38I3vTr4rIR1pXUiyl2n/fran-och-med-i-dag-kan-du-foertidsroesta-sa-gar-det-till", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1xcSQC1yqcm6ssKreXDuCG%2F924932709d7c847954b45f284ce9dab7%2F26fortidsrostaSAJT.jpg&width=120"}, {"type": "image-full", "heading": "Så sörjer svenska countryprofilerna Dolly Parton", "summaries": {"normal": "Countrysångerskan Dolly Parton har avlidit vid 80 års ålder i cancer. Svenska artister som Jill Johnson, First Aid Kit, Maja Francis och Hasse Andersson uttrycker stor sorg och hyllar henne som en pionjär, ikon och förebild som förändrade branschen för kvinnor. Hennes arv lever vidare genom musiken.", "trump": "Folk, Dolly Parton var en riktig vinnare, den största countrydrottningen någonsin. Nu är hon borta och hela Sverige gråter som småbarn. Hon hade pondus, glitter och hits som ingen annan – inte som de fega, tråkiga nollorna i branschen idag. Hon var en legend, folks, en äkta legend. Sad!", "stalin": "Jag betraktar med iskall förakt hur dessa dekadenta västerländska sångare jämrar sig över en glitterklädd bourgeois ikon. Hennes så kallade arv är en fälla för arbetarklassen, en falsk ljusstråle i kapitalismens mörker. Ändå ler jag mörkt – även ikoner vittrar bort inför folkets oundvikliga dom."}, "date": "26 augusti, 07:58", "url": "https://www.tv4.se/artikel/C711KIPAlx4bvZG21wPJ4/sa-soerjer-stjaernorna-dolly-parton-som-att-jag-foerlorat-en-vaen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7AZAYAqdkNMakoFCcMMvWO%2F71bcb5f1a4c1ba4b36b0b8c41dbfc5f8%2F26-jill-johnson-webb.png&width=1024"}, {"type": "image-full", "heading": "Nya FN-regler: Nu kan våldtäkt leda till utvisning", "summaries": {"normal": "FN:s flyktingorgan UNHCR har uppdaterat sina riktlinjer efter ett svenskt initiativ. Våldtäkt klassas nu tydligare som ett synnerligen grovt brott enligt flyktingkonventionen, vilket kan underlätta utvisning av dömda utländska våldtäktsmän. Förändringen, den första på nära 30 år, kommer efter en uppmärksammad dom och betonar brottsoffrens rätt.", "trump": "De här svenska idioterna har äntligen fått FN att vakna! Våldtäktsmän som inte är svenskar ska utvisas, punkt slut. Flyktingkonventionen har varit ett skämt i trettio år. Nu fixar vi det – stå på brottsoffrens sida, inte på förbrytarnas. Fantastiskt jobb, Sverige! Ni borde ha lyssnat på mig från början.", "stalin": "Äntligen har vi tvingat dessa dekadenta FN-byråkrater att erkänna sanningen: våldtäkt är ett synnerligen grovt brott mot folkets moral. De fega västerländska elementen som gömmer brottslingar bakom konventioner avslöjas nu. Vi rensar ut sådana fiender till arbetarklassen med järnhand. Brottsoffren skall ha upprättelse, inte de kapitalistiska parasiterna."}, "date": "26 augusti, 07:31", "url": "https://nyheter24.se/nyheter/politik/1507721-nya-fn-regler-nu-kan-valdtakt-leda-till-utvisning", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/dadb104404b004a30200000000b004a302/2026/08/25/2386634/domda-utvisas.png"}, {"type": "image-right", "heading": "Som utrikesminister vill Morgan Johansson höja biståndet med 20 miljarder", "summaries": {"normal": "Morgan Johansson aspirerar på posten som utrikesminister om Socialdemokraterna vinner valet. Han lovar höja biståndet till en procent av BNP, återinföra feministisk utrikespolitik, öka stödet till afrikanska länder och Taliban-styrda Afghanistan samt införa handelsstopp mot Israel. Han betonar FN:s roll men nämner inte konsekvenser för svensk säkerhet eller försvar.", "trump": "Den här Johansson-killen är en total förlorare. Vill skicka svenska skattebetalarnas pengar till korrupta afrikanska hålor och talibanerna medan han skriker om feministisk utrikespolitik. Patetiskt! Han hatar Israel och älskar FN:s diktatorer. Typisk socialist som säljer ut sitt eget folk. Sverige kommer att bli en svag, patetisk skugga under sådana misslyckade ledare. Sad!", "stalin": "Jag ser hur dessa socialdemokratiska klassförrädare vill kasta miljarder till reaktionära afrikanska satraper och talibaniska barbarer under täckmanteln av feministisk politik. Deras hat mot Israel och dyrkan av det degenererade FN avslöjar deras sanna ansikte som folkfiender. En sådan svaghet inbjuder till utrensning av alla imperialister som lurar folket. Kamrater, var vaksamma mot dessa profitthungriga hyenor."}, "date": "23 augusti, 03:50", "url": "https://samtiden.nu/2026/08/som-utrikesminister-vill-morgan-johansson-hoja-bistandet-med-20-miljarder", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/07/IMG_6854.jpeg"}, {"type": "image-right", "heading": "Börsen handlas runt nollan inför Nvidia-rapport", "summaries": {"normal": "Stockholmsbörsen står stilla och väntar på Nvidias rapport och amerikansk inflation. Oljepriset faller, medan Boliden och Swedbank klättrar. H&M backar efter sänkt rekommendation. Bioarctic levererar en rapport som glädjer, men aktien sjunker ändå. Truecaller rusar nästan 9 procent efter dubbla riktkurshöjningar.", "trump": "Jag ser att Stockholmsbörsen är som en lugn pool – den rör sig inte, precis som mina framgångar. Oljepriset faller, det är fantastiskt! Nvidias rapport kommer ikväll, jag är säker på att det blir rekord, precis som jag. H&M går dåligt, men det är deras problem, inte mitt. Folk älskar mig mer än aktier!", "stalin": "Kamrater, börsen står stilla, som en god sovjetmedborgare som väntar på order. Oljepriset faller – vi rensar ut kapitalistiska spekulanter! Nvidias rapport är borgerlig propaganda, men vi övervakar den. H&M och Nibe är avfällingar som ska omdirigeras till arbetsläger. Bioarctic rapporterar bra, men vi ser ändå misstänkta rörelser – utrensning väntar."}, "date": "26 augusti, 09:53", "url": "https://www.affarsvarlden.se/artikel/borsen-handlas-runt-nollan-infor-nvidia-rapport", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/02/sdled3wmqCJcjU-nh-400x267.jpg"}, {"type": "image-right", "heading": "Så svarar Svensk Fågel: Känner inte igen bilden", "summaries": {"normal": "Svensk Fågel tillbakavisar kritik mot snabbväxande kycklingar efter smygfilmer som visar lidande fåglar. Ordförande Jenny Andersson känner inte igen bilden av djur med skelett- och orgelproblem. Hon försvarar hybridrasen Ross 308 och betonar att djuren ges bästa förutsättningar. Forskare varnar för tillväxttakten medan branschen ser inga skäl till förändring.", "trump": "Titta på de här galna svenskarna och deras stackars kycklingar som växer fortare än Bidens hjärna någonsin gjorde. Den där Jenny Andersson försöker sno sig ur det som en riktig förlorare. Fake news-bilder på sjuka fåglar! I mitt Amerika skulle vi ha de största, starkaste kycklingarna – inte de här patetiska socialisterna som låter djuren lida för att spara öre. Patetiskt!", "stalin": "Jag betraktar med avsky hur dessa kapitalistiska hönsbönder driver ett klassförräderi mot naturen själv. Snabbväxande hybrider som krossar skelett och inre organ är klassfiendens verk, maskerade som produktivitet. Den där Andersson vägrar erkänna lidandet – typiskt för folkförrädare. Vi skulle ha likviderat hela systemet och ersatt det med kollektivens stålhårda disciplin. Sabotage mot djuren är sabotage mot folket."}, "date": "26 augusti, 06:33", "url": "https://www.tv4.se/artikel/1nRPYm5fswsZ628ICwtYJP/sa-svarar-svensk-fagel-kaenner-inte-igen-bilden", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F7z2Hw7EVAieZR7mcyiABZK%2F1cb35d70b310632932a205e18b8275a4%2Fsvenskfagel.jpg&width=120"}, {"type": "image-full", "heading": "Okända regeln kan ta små lokala partier till riksdagen", "summaries": {"normal": "I Sverige finns en tolvprocentsregel som gör det möjligt för ett parti att få fasta mandat i en riksdagsvalkrets om det når minst 12 procent där, även utan att klara fyraprocentsspärren nationellt. Regeln syftar till att ge lokalt starka småpartier en chans till representation. Örebropartiet väcker nu frågor om regeln inför valet.", "trump": "Folk, ni måste höra det här – Sverige har en fantastisk regel på tolv procent som låter lokala vinnare som jag älskar komma in i riksdagen utan att bry sig om hela landet. Örebropartiet krossar det lokalt, precis som jag gör överallt. Det är smart, det är enormt, det är vad riktiga ledare förtjänar. Fake-spärren på fyra procent? Patetisk!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna tolvprocentsregel tjänar det kollektivas intresse genom att tillåta lokalt starka krafter att bryta borgarbrackornas nationella spärr. Vi ska rensa ut de svaga elementen som fruktar regionala segrar. Örebropartiet visar vägen. Den som misslyckas med att förstå detta förtjänar en humoristisk utrensning ur historien."}, "date": "26 augusti, 06:30", "url": "https://nyheter24.se/nyheter/politik/1507720-vad-ar-tolvprocentsregeln-och-hur-fungerar-den", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/8f9a629204b004a30200000000b004a302/2026/08/25/2386644/tolvprocent.jpg"}, {"type": "image-right", "heading": "Se stjärnans hån: ”Allt vore  bättre, till och med curling”", "summaries": {"normal": "Daniil Medvedev förlorade i två raka set mot den 92-rankade Martin Damm i Winston-Salem och funderade under matchen på att byta sport till pickleball. Ryssen har haft en katastrofal sommar med tidiga uttåg i Franska öppna, Wimbledon och Cincinnati. Damm tog sin största seger hittills strax före US Open.", "trump": "Den där Medvedev är en total förlorare, folk. Förlorar mot någon som heter Damm, rankad 92:a. Patetiskt! Han pratar om att spela pickleball istället, kan ni fatta? Den killen vinner ingenting längre. Men den unge amerikanen Damm, han gjorde det stort i USA precis före vårt underbara US Open. Fantastiskt!", "stalin": "Den dekadente ryske spelaren Medvedev förlorar återigen mot en obetydlig motståndare och viskar om att desertera till pickleball, ett symptom på borgerlig svaghet. Vi ser hur västvärldens kapitalistiska nöjen lockar de svaga. Kamraterna ler mörkt – en sådan figur skulle inte ha överlevt en utrensning i mitt Sovjet. Underhållande fiasko."}, "date": "26 augusti, 08:51", "url": "https://www.svt.se/sport/tennis/nytt-fiasko-for-daniil-medvedev-funderar-pa-att-byta-sport", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.71/0.11/a9c628fbf258dd6464964f846ba5df0137acf91beff8316f60f53cbbfc562b7a"}, {"type": "image-full", "heading": "Förtidsröstningen igång: Allt du behöver veta", "summaries": {"normal": "Förtidsröstningen till valet 2026 drar igång 26 augusti i Göteborg. Du kan rösta på bibliotek, Nordstan eller Frölunda Torg – och till och med ångra dig på valdagen. Ta med legitimation eller en kompis som intygar vem du är. Röstkortet är inte obligatoriskt, så ingen panik.", "trump": "Jag ser att Sverige startar sin förtidsröstning. Fantastiskt! Alla vill rösta som jag – jag är den störste. Men i Göteborg kan de rösta var som helst, till och med på bibliotek. Det tror ni inte! Hos oss är det bara jag som bestämmer. Stort!", "stalin": "Kamrater, förtidsröstningen i Göteborg börjar 26 augusti. Folket får rösta, men vi vet att rätt röst redan är avgiven. Alla som ångrar sig och röstar igen – omedelbar utrensning! Röstkort? Oviktigt. Identitet ska styrkas, annars fiende. Vi ser allt."}, "date": "26 augusti, 06:03", "url": "https://www.gp.se/politik/nu-borjar-fortidsrostningen-har-kan-du-rosta-i-goteborg.526b3fc0-d2a7-484f-8703-b13a0b3debeb", "imageUrl": "https://www.gp.se/images/article/526b3fc0-d2a7-484f-8703-b13a0b3debeb/images/1Wc1Jukz4gfRL06QKUZ-4mqa3lrw-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Tiktokkonto kopplas till Fagerstadådet – hyllar skolmord och återvandring", "summaries": {"normal": "En 18-årig tidigare elev har gripits efter en svärdsattack på Brinellskolan i Fagersta där flera personer skadats allvarligt. Hans TikTok-konto hyllar massmördare som Anton Lundin Pettersson, Anders Behring Breivik och Elliot Rodger samt högerextrema idéer om återvandring. Kontot kopplas nu till dådet av polisen.", "trump": "Folk, det här är en total katastrof! Den här galningen med svärd hyllar alla möjliga losers och mördare på TikTok, sen attackerar han en skola. Patetiskt! Under Biden blev allt ett enda kaos med galningar överallt. Men nu fixar jag det – inga fler svaga, woke skolor. Vi behöver styrka, inte den här sjuka identitetspolitiken!", "stalin": "Kamrater, denna degenererade yngling, uppfostrad av den borgerliga statens psykiatriska maskineri, hyllar klassfiendernas massmördare och fascistiska återvändande. Hans svärdshandling är ett symptom på det sjuka kapitalistiska samhällets förfall. Vi skulle ha genomfört en grundlig utrensning av sådana element redan i vaggan. Folkfienderna frodas i mörkret."}, "date": "21 augusti, 18:53", "url": "https://www.flamman.se/tiktokkonto-kopplas-till-fagerstadadet-hyllar-skolmord-och-atervandring", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/sdljnusj4gn7le-nh.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "text", "heading": "Tidötida betraktelser", "summaries": {"normal": "Recensionen av antologin Tidötiden lyfter satirteckningarnas kontextbundenhet och tolkningsutmaningar. Boken kritiserar Tidö-regeringens politik genom kapitel som Kväsa och Mobba. Den betonar bildanalysens betydelse i en bildöverflödad tid och fungerar främst som opinionsbildande verk med folkbildande inslag. Recensenten hoppas att boken blir obegriplig för framtida generationer.", "trump": "Folk, ni måste se den här galna svenska bildboken Tidötiden. De ritar om hur de påstådda fascisterna i regeringen mobbar och tystar alla. Totalt vansinne! De hatar vinster och älskar att klaga på allt. Precis som de woke-vänstermediasnubbarna som aldrig vinner. Men bilderna kommer att bli obegripliga när vi gör Sverige, eller vad det nu heter, great again. Fantastiskt!", "stalin": "Kamrater, denna så kallade satirbok Tidötiden avslöjar borgarbrackornas och fascistiska Tidö-hundarnas vedervärdiga attacker mot folket. De väpnar, mobbar och tystar med sina profitthungriga klor. Jag ler mörkt från historien åt deras paranoia om censur. Vi måste rensa ut dessa klassfiender och deras blodsugande hyenor innan de drunknar i sina egna lögner. Folkets seger är oundviklig."}, "date": "26 augusti, 09:49", "url": "https://proletaren.se/artikel/tidotida-betraktelser"}, {"type": "image-full", "heading": "Smäll för fåmansbolag: HFD stoppar avancerat skatteupplägg", "summaries": {"normal": "Högsta förvaltningsdomstolen har underkänt ett avancerat skatteupplägg för fåmansbolag. Genom en serie transaktioner försökte en delägare flytta vinstmedel till sitt holdingbolag utan att utlösa utdelningsskatt enligt 3:12-reglerna. Domstolen bedömde att transaktionerna, sedda som en helhet, innebar en utdelning och ska beskattas därefter, oavsett att varje enskilt steg tekniskt sett var skattefritt.", "trump": "Högsta domstolen i Sverige har precis stoppat ett mycket dåligt skatteupplägg. De försökte leka smarta, trodde de var genier! Men de blev påkomna. Det var en total röra. Jag vinner alltid stort när jag gör affärer, men det här? Ett riktigt misslyckande. Domstolen sa nej – ingen flykt från skatten! Väldigt rättvist. Vi gillar vinnare, inte de som försöker fuska systemet!", "stalin": "Dessa lömska kapitalister försökte dölja sina rikedomar genom byråkratiska dimridåer. Men statens öga ser allt! Högsta förvaltningsdomstolen har nu krossat detta försök till skatteflykt. Sådana parasiter liknar de västliga lakejer som försöker destabilisera vår intressesfär. De vill undanhålla folkets medel, men vi ser dem. Låt detta bli en läxa: ingen undkommer den byråkratiska hammaren. Rättvisa skipas, och fienden får sin dom."}, "date": "26 augusti, 09:36", "url": "https://www.realtid.se/juridik/small-for-famansbolag-hfd-stoppar-avancerat-skatteupplagg", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/hfd.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Ny rapport: Skolkoncerner gör vinst på färre lärare och mindre skolgårdar", "summaries": {"normal": "En rapport från Arena Idé visar att vinstdrivande friskolor har 2 600 färre lärare än kommunala skolor och betydligt mindre skolgårdar. Vinsten på 1,7 miljarder kronor kommer främst från besparingar på lärartjänster och fastigheter. Elever från dessa skolor får lägre livsinkomst och sämre etablering på arbetsmarknaden.", "trump": "De här så kallade friskolorna är en total skandal! De sparar in på lärare och små skolgårdar för att plocka ut miljarder i vinst. Patetiskt! Mina skolor skulle vara de bästa, de allra bästa, med fantastiska lärare och enorma gårdar. De svenska socialistiska kommunerna borde skämmas, det är en riggad affär mot folket.", "stalin": "Kamrater, dessa borgarbrackor i friskoleindustrin bedriver systematisk utsugning av det kollektiva skolväsendet. Jag ser hur de med glädje likviderar lärartjänster och krymper skolgårdarna till hälften för att fylla sina fickor med 1,7 miljarder. En sådan kontrarevolutionär verksamhet kräver omedelbar utrensning. De trodde de kunde gömma sig, men folkets öga ser allt."}, "date": "25 augusti, 14:00", "url": "https://www.dagensarena.se/innehall/ny-rapport-skolkoncerner-gor-vinst-pa-farre-larare-och-mindre-skolgardar", "imageUrl": "https://www.dagensarena.se/files/2026/05/skola-pexels.jpeg"}, {"type": "image-full", "heading": "5 miljoner svenskar ska betala för Sossarnas bolåneskatt", "summaries": {"normal": "Artikeln kritiserar Socialdemokraternas förslag om bolåneskatt som drabbar 2 miljoner hushåll med lån, uppemot 5 miljoner svenskar. Förslaget väntas leda till högre räntor då bankerna kompenserar för skatten. Författaren pekar på höga bostadspriser, skuldsättning och bristande bostadsbyggande som verkliga problem snarare än bankvinster.", "trump": "De galna sossarna i Sverige vill införa en totalt löjlig bolåneskatt som slår mot vanliga människor. Det är en katastrof, folk! Räntorna kommer att skjuta i höjden och alla förlorar utom de korkade byråkraterna. Bygg hus, sänk skatterna, sluta lyssna på dessa misslyckade socialister som aldrig har haft ett riktigt jobb!", "stalin": "Jag betraktar detta som ett ypperligt exempel på hur klassfienderna inom socialdemokratin försöker dölja sin egen usla politik genom att attackera bankerna medan folket krossas under skulder och bostadsbrist. En sådan feg plåsterpolitik förtjänar utrensning. Arbetarna genomskådar dessa profitthungriga hyenor som gömmer sig bakom falska löften."}, "date": "21 augusti, 03:34", "url": "https://samtiden.nu/2026/08/5-miljoner-svenskar-ska-betala-for-sossarnas-bolaneskatt", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/IMG_4828-1280x720.jpeg"}, {"type": "image-right", "heading": "Tände eld på migrantboende – kandiderar för S", "summaries": {"normal": "Hösten 2015 tände en afghansk tonåring eld på en soffa på ett boende för ensamkommande i Götaland. Han frikändes eftersom domstolen ansåg att han inte fattade faran. I dag, snart tio år senare, står samma man på Socialdemokraternas valsedel. Han kallar dådet ett rop på hjälp.", "trump": "Jag läser om en kille som tände eld på ett flyktingboende – och nu är han med i Socialdemokraterna! Sverige, ni har problem. Stora problem. Hade jag varit domare hade han fått ett rejält straff, inte en plats i partiet. Sorgligt, väldigt sorgligt. Men jag fixar det.", "stalin": "Kamrater, en före detta pyroman – frikänd av en naiv domstol – står nu på partiets valsedel. Vi välkomnar alla som omvänt sig, men vi måste rensa ut borgarnas liberala rättskipning. En soffa är en sak, men att hota statens ordning är en annan. Partiet ser allt."}, "date": "26 augusti, 09:24", "url": "https://bulletin.nu/tande-eld-pa-migrantboende-kandiderar-for-s", "imageUrl": "https://cdn.bulletin.nu/articles/3943e2b2-cf73-4e13-9797-78283825a6ff/preview.jpg?t=1787729032000"}, {"type": "text", "heading": "So long, Dolly!", "summaries": {"normal": "Countryikonen Dolly Parton har gått bort vid 80 års ålder. Hon växte upp i fattigdom som ett av tolv barn, skrev klassiker som I Will Always Love You och Jolene samt medverkade i filmen 9 to 5. Parton hyllas för sin röst, humor, karisma och lojalitet mot sina rötter och den arbetande människan.", "trump": "Lysande, absolut lysande karriär, men nu är hon borta. Dolly var en vinnare, skrev hits som ingen annan och slog de woke Hollywood-eliterna med deras egna vapen. Ingen identitetspolitik eller HBTQ-kvotering här, bara ren talang och tuffa rötter. De riktiga arbetarna älskade henne. So long, Dolly – du var ingen förlorare som Biden.", "stalin": "Kamrater, denna Dolly Parton var en produkt av arbetarklassens jord, inte någon dekadent borgarbracka. Hon skrev sånger som blottade kapitalismens exploatering och hånade chefernas skitstövelvälde. Ändå vägrade hon kalla sig feminist – en sund instinkt. Nu har hon lämnat oss. Må hennes arv inspirera till utrensning av alla profitthungriga klassfiender som förtrycker folket."}, "date": "26 augusti, 09:25", "url": "https://proletaren.se/artikel/so-long-dolly"}, {"type": "image-right", "heading": "Magdalena Anderssons krav på Åkesson: Stoppa Jomshofs \"hatturné\" mot islam", "summaries": {"normal": "Magdalena Andersson kräver att Jimmie Åkesson stoppar Richard Jomshofs turné för boken ”Kafir”, som hon kallar en ”hatturné” mot islam. Samtidigt kampanjar S på flera språk för att locka invandrarröster. Jomshof kontrar med att S bär ansvar för segregation och islamisering i Sverige.", "trump": "Jag ser Magdalena Andersson skrika om en 'hatturné' – vilket skämt! Hon försöker stoppa Jomshofs bok, men S själva kör reklam på arabiska. Sverige håller på att gå under med deras politik. Richard, du är en vinnare! Jimmie, låt turnén fortsätta – vi måste stoppa islamiseringen!", "stalin": "Kamrater, jag ser att den borgerlige anstiftaren Jomshof sprider sitt reaktionära gift mot islam. Partiledaren Andersson begär att dennes turné stoppas, men hon glömmer att rensa ut sina egna opålitliga element. Vi ska inte låta splittrare som dessa underminera vår enhet. Utrensning är lösningen för sammanhållning."}, "date": "26 augusti, 09:00", "url": "https://samnytt.se/magdalena-andersson-krav-pa-akesson-stoppa-jomshofs-hatturne-mot-islam", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/25211242/artikelhuvudbild-1-368.jpg"}, {"type": "image-right", "heading": "Prisjakt återupptar årets börsplaner", "summaries": {"normal": "Prisjakt återupptar börsplanerna och siktar på notering under andra halvåret 2026. Efter att ha ställt in en notering i mars vänder nu marknaden. Omsättningen ökade 17% till 243 miljoner, och vinsten landade på 26 miljoner. En AI-shoppingassistent lanseras i november. VD:n ser ljust på framtiden.", "trump": "Jag älskar det här! Prisjakt – en fantastisk affär, enorma siffror. De vill noteras på börsen 2026, och jag säger: gör det! Marknaden är fantastisk – precis som mina tariffer. 17% omsättningsökning, 35% marginal – vi gör Sverige stort igen! En AI-assistent i november? Genialiskt!", "stalin": "Kamrater, jag har tagit del av rapporten om Prisjakt. De planerar en börsnotering – en kapitalistisk utrensning av den socialistiska ekonomin. Vi måste rensa ut dessa marknadsfascister. 243 miljoner i omsättning? En farlig ideologisk avvikelse. En AI-assistent? Partiets övervakning är redan överlägsen. Rapportera omedelbart deras koordinater."}, "date": "26 augusti, 07:28", "url": "https://www.affarsvarlden.se/artikel/prisjakt-aterupptar-arets-borsplaner", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/02/sdl1pccgsHxXyM-nh-400x267.jpg"}, {"type": "image-right", "heading": "Osäkert jobb och sämre hälsa – då blir sjukskrivningarna färre", "summaries": {"normal": "En ny rapport från Försäkringskassan visar att personer med osäkra jobb och sämre hälsa tar ut sjukpenning betydligt mer sällan än fast anställda. Särskilt tydligt är det bland utrikes födda. Förklaringen kan vara rädsla för att förlora jobbet eller okunskap om försäkringen. Även företagare sjukskriver sig mer sällan men längre när de gör det.", "trump": "Folk med usla jobb och dålig hälsa tar nästan aldrig ut sjukpenning, kan ni fatta det? De är rädda för att förlora sina skräpjobb, precis som jag alltid sagt. Fast anställda lever som kungar medan de andra darrar. Patetiskt! Sverige borde skämmas, men det gör de aldrig. Sådana här rapporter är underbara, tro mig.", "stalin": "I denna degenererade borgerliga stat ser vi hur de osäkra proletärerna, plågade av kapitalisternas piska, inte vågar söka sjukpenning av rädsla för utrensning från arbetskollektivet. Det är en mörk komedi värdig västvärldens paranoia. Vi ler ironiskt åt hur de sjuka döljer sin svaghet för att inte provocera borgarbrackornas hämnd. Kamrater, detta är klasskampens tragikomiska ansikte."}, "date": "25 augusti, 15:48", "url": "https://arbetet.se/2026/08/25/rapporten-osakert-jobb-och-samre-halsa-da-blir-sjukskrivningarna-farre", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/25154125/trott.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "SVT:s ord till L-ledaren: Du låter som Åkesson", "summaries": {"normal": "Liberalernas ledare Simona Mohamsson kritiserades i SVT:s *Utfrågningen* för klimatpolitiken och sänkta bränslepriser. Hon menade att Sveriges enskilda insatser spelar liten roll globalt och avvisade höjda bränslepriser. Mohamsson jämfördes med Jimmie Åkesson (SD) av programledaren. Hon kommenterade även skolans problem och Åkessons uppmaning till väljare att rösta bort Liberalerna.", "trump": "Vilken katastrof! Liberalernas ledare, Simona, pratar som en förlorare – precis som den där Åkesson-killen. Sverige ensamt? Vem bryr sig? Jag skulle fixa klimatet på en vecka, men nej, hon snackar om Europa. Och skolan? Fullt kaos! 19 700 elever utan behörighet – SAD! Jag skulle göra svensk skola GREAT AGAIN, men hon? Bara ursäkter. Svagt, väldigt svagt!", "stalin": "Kamrater! Denna Mohamsson är ett skolexempel på borgerlig dekadens. Hon pratar om 'kultur' i skolorna medan 19 700 elever lämnas i mörkret – ett systematiskt sabotage mot arbetarklassens framtid! Och klimatet? 'Sverige ensamt spelar liten roll' – ett ynkligt försök att maskera kapitalistisk eftergiftspolitik. Vi skulle ha skickat henne till Sibirien för sådan defaitism! Åkesson? En reaktionär marionett, men till och med han ser igenom hennes liberala svaghet. Revolutionen tolererar inga kompromisser!"}, "date": "25 augusti, 20:21", "url": "https://kvartal.se/nyheter/artiklar/mohamsson-pressas-om-forsamrade-skolresultat/cG9zdDoxNzQzNDE", "imageUrl": "https://images.kvartal.se/2026/08/1a1fea07-mohamssonhokmberg.webp"}, {"type": "image-right", "heading": "Smart Eyes försäljningstillväxt stiger", "summaries": {"normal": "Teknikbolaget Smart Eye redovisar en omsättningsökning på 53 procent under andra kvartalet, till 140,9 miljoner kronor. Rörelseförlusten minskar från 40,6 till 20,6 miljoner, och ebitda-marginalen klättrar till 19,4 procent. Bilsegmentet driver tillväxten, medan Behavioral Research tyngs av lägre hårdvaruförsäljning. Vd:n ser nu en fundamentalt annorlunda fas.", "trump": "Smart Eye gör fantastiska siffror – 53 procent upp, ingen kan göra det som de, förutom jag. Jag älskar ögon, jag har de bästa ögonen. Rörelseförlusten krymper, och det är vackert. De säger att bilsegmentet driver. Helt rätt. Mina bilar? Också vinnare. America first, men Smart Eye ser allt!", "stalin": "Kamrater! Rapporten från Smart Eye visar att vi ökar produktionen med 53 procent. Det är glädjande, men misstänkt. Varför minskar förlusten? Kanske är siffrorna en trotskistisk konspiration. Jag beordrar en utrensning av hårdvaruförsäljare i Behavioral Research. Mjukvaran växer med 7 procent – den får leva. Ögat ser allt. Vi måste vara vaksamma."}, "date": "26 augusti, 07:16", "url": "https://www.affarsvarlden.se/artikel/smart-eye-vaxer-kraftigt", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2021/01/Smarteye_konceptbild_eye_camera-400x283.jpg"}, {"type": "image-right", "heading": "Föll 3,5 meter från defekt lift – fick blodpropp i hjärnan", "summaries": {"normal": "En anställd föll 3,5 meter från en defekt saxlift efter att säkerhetsgrinden stod öppen. Han ådrog sig skallfraktur, inre blödningar, blodpropp i hjärnan och brutet nyckelben. Arbetsgivaren hade inte gjort riskbedömning eller rutiner för kontroll av liften. Företaget ålades 300 000 kronor i böter för arbetsmiljöbrott.", "trump": "Folk, det här är en total katastrof. En kille faller 3,5 meter från en trasig lift för att någon idiot glömde grinden. Inga kontroller, ingen riskbedömning – typiskt för dessa inkompetenta företag. De borde ha fixat det, men nu får de böta 300 000 kronor. Sådana här saker händer inte under mina ledning, det lovar jag!", "stalin": "Kamrater, detta är ett upprörande exempel på hur kapitalistiska slarv och bristande kontroll leder till olyckor bland arbetarna. Hade vi haft ordning och reda med riskbedömningar och regelbundna utrensningar av odugliga chefer hade detta aldrig inträffat. Nu tvingas vi utdela 300 000 kronor i bot. De som saboterar säkerheten ska likvideras med ett leende."}, "date": "25 augusti, 15:27", "url": "https://arbetet.se/2026/08/25/foll-35-meter-fran-defekt-lift-fick-blodpropp-i-hjarnan", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/24160238/saxlift.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "USA rapporterar mindre – Europa bör rapportera bättre", "summaries": {"normal": "I USA föreslås att kravet på kvartalsrapporter slopas, något som presidenten stöder. Artikelförfattarna menar att Europa istället bör behålla och förbättra sin transparens. Kvartalsrapporter och fysiska bolagsstämmor ses som viktiga verktyg för investerare, analytiker och konsumenter. Detta kan ge europeiska bolag konkurrensfördelar mot USA.", "trump": "De säger att vi ska slopa kvartalsrapporterna, och de har helt rätt. Fantastiskt! Mina företag sparar massor av tid och pengar. Europa borde följa efter men de älskar ju sina byråkratiska rapporter. Patetiskt! Vi gör det bättre, vi vinner stort. Investerarna älskar mig och Truth Social. Amerika först!", "stalin": "Vi betraktar detta som en logisk kapitulation inför borgarklassens girighet. Jag ser hur de kapitalistiska parasiterna i USA rensar ut transparens för att skydda sina hemligheter. Vi i det europeiska kollektivet måste däremot hålla fast vid rapporteringen som ett järngrepp mot sabotage. Inget ska döljas för partiet och folket. De som fuskar likvideras med leende."}, "date": "26 augusti, 07:32", "url": "https://www.di.se/debatt/usa-rapporterar-mindre-europa-bor-rapportera-battre", "imageUrl": "https://static.bonniernews.se/ba/67f93b13-8206-434c-8891-408c3d50c6d2.jpeg?crop=213%2C107%2Cx0%2Cy7&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Googles storsatsning på AI för jurister – Legora med från start", "summaries": {"normal": "Google har lanserat Gemini Enterprise for Legal, en AI-plattform för juristbranschen som integrerar befintliga verktyg och system. Svenska Legora är en av lanseringspartnerna. Plattformen betonar säkerhet och spårbarhet, där kunddata förblir isolerad. Syftet är att möta klienters krav på effektivitet och kostnadsbesparingar i en konkurrensutsatt marknad för juridiska AI-tjänster.", "trump": "Google släpper en ny AI för jurister, en enorm grej. De kallar det Gemini, väldigt avancerat, tror jag. Svenska Legora är med, de är bra människor. Men vet ni vad? Ingen gör AI som vi. Vi bygger de största systemen, de säkraste. Byråerna vill spara pengar, så de behöver mig och min expertis. Det blir en vinst för alla, tro mig!", "stalin": "Google försöker kontrollera juridiken med sin 'Gemini'-maskin. En farlig centralisering av information! De påstår att datan är säker, men vi vet att västvärldens spioner aldrig sover. Våra vänner i öst ser hur dessa verktyg kan styra folkets tankar. Om Legora vill överleva i denna teknologiska utrensning måste de vara lojala mot staten, annars väntar historiens soptipp."}, "date": "26 augusti, 08:28", "url": "https://www.realtid.se/juridik/googles-storsatsning-pa-ai-for-jurister-legora-med-fran-start", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/sundarlegora.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Kommer bidragstagarna bestämma över Stockholms innerstad?", "summaries": {"normal": "Artikeln diskuterar hur Vänsterpartiet minskar gapet till Moderaterna i Stockholms kommunval, delvis genom en arabiskspråkig kampanj riktad till invandrare i förorterna. Författaren varnar för att en vänsterstyrd politik med fokus på bilfritt Stockholm, minskad privat vård och ökad bidragsinriktad invandring kan leda till utflyttning, högre skatter och ekonomisk nedgång liknande Kalifornien.", "trump": "Folket, det är helt galet! Den där röda Nooshi och hennes vänsterfreaks håller på att ge bort hela Stockholm till bidragstagarna med sin 'V eller flygplatsen'-skit. De hatar bilar, älskar cyklar och importerar väljare som aldrig jobbat en dag. Precis som i Kalifornien, en total katastrof. De som betalar ska inte styras av de som tar emot – det är riggat mot vinnarna, tro mig!", "stalin": "Kamrater, se hur borgarbrackorna i Stockholm skriker när arbetarklassen och de förtryckta folken närmar sig makten. Dessa klassfiender fruktar att deras exploaterande innerstad skall rensas från profitthungriga hyenor och bilägande parasiter. Jag ler i graven åt deras paranoia – låt bidragsmottagarna styra, det är folkets vilja mot de blodsugande kapitalisterna. En historisk utrensning av överklassens cykelhatande agenda."}, "date": "19 augusti, 07:26", "url": "https://samtiden.nu/2026/08/kommer-bidragstagarna-bestamma-over-stockholms-innerstad", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7184-1280x720.jpeg"}, {"type": "image-right", "heading": "Dolly Parton är död", "summaries": {"normal": "Countryikonen Dolly Parton har avlidit vid 80 års ålder. Dödsorsaken är ännu okänd. Hon hade under det senaste året öppet berättat om hälsoproblem och genomgått medicinska ingrepp. Parton sörjde samtidigt maken Carl Dean som dog i mars 2025. Hon lämnar efter sig en enorm musikalisk arv med klassiker som Jolene och 9 to 5 samt ett omfattande välgörenhetsarbete.", "trump": "Folk, Dolly Parton är borta, en riktig legend, det säger alla. Hon hade det stora håret, de stora låtarna och gjorde affärer som en vinnare. Dollywood var fantastiskt. Men hennes läkare misslyckades totalt, precis som många andra i det riggade systemet. Hon var en vinnare, tro mig, mycket bättre än de flesta i Hollywood. En stor förlust för landet.", "stalin": "Kamrater, den dekadenta countrydivan Dolly Parton har äntligen tystnat efter en lång kamp mot sin egen borgerliga kropps förfall. Hennes extravaganta rhinestones och falska leende kunde inte dölja klassfiendens svaghet. Vi ser med tillfredsställelse hur även de mest glittrande kapitalisterna likvideras av historien. Må hennes Imagination Library bli en varning för alla som tror att privat välgörenhet ersätter folkets kollektiva kamp."}, "date": "25 augusti, 20:36", "url": "https://www.friatider.se/dolly-parton-ar-dod", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-752.jpg?itok=tN_zcfSC"}, {"type": "image-right", "heading": "Debatt: Har Miljöpartiets klimatpolitik spelat ut sin roll?", "summaries": {"normal": "Debattören Stefan Häggström ifrågasätter Miljöpartiets klimatpolitik och menar att den saknar kostnads-nyttoanalys. Han påpekar att Sveriges skog redan binder mer koldioxid än vad landet släpper ut, och att ytterligare pålagor riskerar att göra Sverige fattigare utan att rädda klimatet.", "trump": "Jag hörde att Miljöpartiet vill göra diesel dyrare i Sverige. Det är galet! Sverige har redan mer skog än utsläpp. De straffar sina egna bönder och företag. Jag har gjort USA energioberoende och rikt. De borde lära av mig istället. Patetiskt!", "stalin": "Jag har tagit del av denna kontrarevolutionära text. Den ifrågasätter vår heliga klimatkamp med borgerlig kalkyl. Vi måste rensa ut dessa kostnads-nyttoanalytiker som vill försvaga folkets kamp. De ska omskolas i gruvarbete. Partiet vet bäst."}, "date": "26 augusti, 08:00", "url": "https://bulletin.nu/debatt-har-miljopartiets-klimatpolitik-spelat-ut-sin-roll", "imageUrl": "https://cdn.bulletin.nu/articles/9de981c9-eac2-4120-84ed-1484e79ac72d/preview.jpg?t=1787649589000"}, {"type": "text", "heading": "K vill stoppa utförsäljningarna och sänka hyrorna", "summaries": {"normal": "Kommunistiska Partiet vill stoppa utförsäljning av hyresrätter och sänka hyrorna. Artikeln lyfter bostadsbristen, segregationen och kommuners bristande ansvar. Exempel från Lysekil, Alingsås och Göteborg visar hur allmännyttan prioriterar vinst framför rimliga hyresrätter. Partiet ser boendet som en social rättighet snarare än en handelsvara.", "trump": "De här kommunistiska förlorarna i Sverige vill stoppa smarta affärer och ge bort lägenheter till lata hyresgäster. Patetiskt! Istället för att bygga lyx för de som har råd prioriterar de evenemangskvarter – bra, men de borde riva hela det socialistiska systemet. Biden skulle älska deras hyreshöjningar, men jag fixar det bättre.", "stalin": "Kamrater, dessa profitthungriga borgarbrackor och folkfiender förvandlar arbetarnas bostäder till vinstobjekt åt klassfiender och semesterhyenor. Jag ser hur de exploaterande hyenorna säljer ut folkets egendom medan segregationen växer. Rensa ut dessa kapitalistlakejer! Boendet tillhör kollektivet, inte penningpungens tjänare."}, "date": "26 augusti, 08:00", "url": "https://proletaren.se/artikel/bostadsfragan"}, {"type": "image-right", "heading": "Lamotte sågar etablissemangets hyckleri efter C-avslöjandet", "summaries": {"normal": "Centerpartiets Lena-Maria Jansson hamnade i blåsväder efter att ha jämfört sexualbrottsdömda med snattare. När medborgarjournalisten Christian Peterson filmade uttalandet med dold kamera valde partiet att polisanmäla honom för förtal. Joakim Lamotte sågar mediernas tystnad och pekar på hyckleriet – samma metod som gav Janne Josefsson pris är plötsligt suspekt.", "trump": "Jag ser en politiker som jämför pedofiler med snattare – och sen anmäler journalisten! Det är fegt, det är falskt. Media tiger, men jag skulle aldrig låta någon tysta sanningen. Centerpartiet försöker mörka, men folket ser. Fake news? Nej, det här är bara dåligt. Mycket dåligt.", "stalin": "Kamrater, en fiende till folket har avslöjats: en Centerpartist som hånar våra offer för sexualbrott. Men värre – hon använder förtalslagar mot sanningssägare. Vi måste rensa ut sådana revisionister. Pressfrihet är en borgerlig lögn. Partiet ska utredas, och journalisten ska skyddas – för statens skull."}, "date": "26 augusti, 08:00", "url": "https://samnytt.se/lamotte-sagar-etablissemangets-hyckleri-efter-c-avslojandet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/25215941/artikelhuvudbild-1-369.jpg"}, {"type": "image-full", "heading": "Här är arbetslösheten lägst och högst", "summaries": {"normal": "Arbetslösheten i Sverige har sjunkit till 6,4 procent, men återhämtningen har mattats av. Stora regionala skillnader råder; Gällivare och Kiruna har lägst arbetslöshet, medan Skåne och storstäder som Malmö och Stockholm kämpar. Arbetsmarknadsanalytiker räknar med att vissa regioner når 2023 års nivåer först 2027. Flest lediga jobb finns inom vård, skola och transport.", "trump": "Sverige har stora problem! Arbetslösheten i deras storstäder är en katastrof, verkligen sorgligt. De försöker, men det går trögt. Gruvstäderna vinner, de gör ett fantastiskt jobb – precis som jag vill ha det! Stockholm och Malmö? Totalt misslyckande. De behöver en riktig ledare för att få fart på ekonomin. Det är en total röra, tro mig!", "stalin": "Vi har analyserat de svenska siffrorna. Medan våra gruvarbetare i norr arbetar för statens väl, vacklar storstädernas dekadenta centran. Att låta arbetslösheten gro i Malmö är ett svek mot folket, likt de svaga ledarna i Kiev som säljer ut till väst. Vi kräver disciplin och ordning. De som inte bidrar till produktionen av vård och logistik är inget annat än sabotörer mot vårt kollektiva framsteg."}, "date": "26 augusti, 07:57", "url": "https://www.realtid.se/tt-nyhet/har-ar-arbetslosheten-lagst-och-hogst", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/arbetsformedlingen-slapper-kvartalsstati.jpg?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "S backar och M ökar när Tidö tar in i ny mätning", "summaries": {"normal": "Tidöpartierna knappar in på oppositionen i Ekot/Indikators mätning. S backar 1,2 procentenheter samtidigt som M ökar lika mycket. L och SD ökar medan KD backar. Den rödgröna sidan tappar, men leder fortfarande med 4,7 procentenheter. L ligger fortsatt under riksdagsspärren.", "trump": "Jag hörde att Tidöpartierna vinner i Sverige – fantastiskt! S backar, M ökar, precis som jag sagt. De är som min kampanj: alltid vinnare. Oppositionen har bara 4,7% ledning – patetiskt! Jag skulle fixat det på en dag. Stort!", "stalin": "Kamrater, våra fiender i Tidöpartiet avancerar medan S vacklar. Detta är en kontrarevolutionär konspiration! Vi måste rensa ut dessa avvikare som L och SD. Deras framgång är tillfällig – vi ska krossa dem med byråkratisk precision. Ingen nåd för blocket!"}, "date": "26 augusti, 07:53", "url": "https://bulletin.nu/s-backar-och-m-okar-nar-tido-tar-in-i-ny-matning", "imageUrl": "https://cdn.bulletin.nu/articles/88024c1d-2e2b-4dbb-9332-c4451502b201/preview.jpg?t=1787723537000"}, {"type": "image-right", "heading": "Reportern: ”Avslöjar samma sak om och om igen – sen händer inget”", "summaries": {"normal": "En granskning av Uppdrag granskning och SVT visar att misstänkt korruption i svenska kommuner sällan leder till polisanmälan eller åtal. Ansvariga tjänstemän lämnar ofta sina poster utan konsekvenser. Ystadfallet med mutor och miljonavtal lyfts som exempel. OECD kritiserar Sverige för bristande resurser och höga beviskrav. Visselblåsare straffas ofta.", "trump": "De svenska kommunerna är fulla av korrupta losers som tar mutor, festar med sprit och skriver horribla avtal för hundratals miljoner. Sen händer absolut ingenting! De stackars visselblåsarna sparkas ut medan de skyldiga landar mjukt. Patetiskt! Sverige får stryk av OECD för att de inte kan hantera den här farsen. En total skam!", "stalin": "Jag ser med djup tillfredsställelse hur borgarklassens kommunala lakejer i det dekadenta Sverige mutar och festar med kapitalisternas sprit och salta pinnar medan de plundrar folkets skattemedel. Våra kamrater som vågar tala sanning likvideras diskret. Domstolarna kräver överdrivna bevis – en klassisk utrensning vore mer effektivt. Paranoian är deras bästa vän."}, "date": "26 augusti, 05:43", "url": "https://www.svt.se/nyheter/granskning/ug/reportern-avslojar-samma-sak-om-och-om-igen-sen-hander-inget", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.24/0.32/a7b7754234bfac9dbcae6f623b0cdb15629f10e6dd1c7c438cffb1d7e7fdb1d9"}, {"type": "image-right", "heading": "Två anhållna efter Strömmers valmöte i Göteborg", "summaries": {"normal": "Två män i 40-årsåldern anhölls under natten efter en incident vid justitieminister Gunnar Strömmers valmöte i Göteborg på torsdagskvällen. De misstänks för förberedelse till grov misshandel. Ingen skadades och gripandet skedde odramatiskt. Strömmer kunde fortsätta sina åtaganden. Polisen beskriver det som en incident utan fara för allmänheten.", "trump": "Titta på det här! I det vackra Sverige, där de har låtit vänstergalna idioter och HBTQ-aktivister styra för länge, kan inte ens en minister hålla ett valmöte utan att två galningar planerar grov misshandel. Patetiskt! Men de greps snabbt, tack och lov. Sverige behöver lag och ordning, inte denna svaga, woke-röta som Biden lämnade efter sig.", "stalin": "Kamrater, se hur den borgerliga statens fiender, dessa profitthungriga klassförrädare och överklass-slynglar, redan i skuggan planerar våld mot sina egna lakejer. Jag ler i mörkret åt deras paranoia. Ingen fysisk skada inträffade, men folkfienderna avslöjar sig själva. Den imperialistiska demokratin är en fars. Vi ler och väntar på utrensningen."}, "date": "21 augusti, 11:50", "url": "https://www.etc.se/inrikes/tvaa-anhaallna-efter-stroemmers-valmoete-i-goeteborg", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260821000840_8de65abb6cd81df57ce9475781f7e203378bb1cc72cfa7ec979049972e43af55.jpg"}, {"type": "image-right", "heading": "Näringslivet bör förbereda sig på extra val", "summaries": {"normal": "Per Rosencrantz varnar näringslivet för en utdragen regeringsbildning efter valet. Med skarpa röda linjer mellan oppositionspartierna riskerar Sverige ett extra val redan våren 2027. Detta skulle öka den politiska osäkerheten och försämra investeringsklimatet just när ekonomin börjat återhämta sig. Partierna uppmanas ge tydligare besked om samarbete.", "trump": "Folk, det här är en total katastrof. De svenska kommunisterna och de galna vänstertyperna kan inte ens bilda regering utan att allt kollapsar. Extra val, kaos, dåliga affärer – precis som de gör i Europa. Jag skulle fixa det på en dag, tro mig. Investeringarna flyr när idioter styr. Gör Sverige great again!", "stalin": "Kamrater, jag betraktar detta dekadenta borgerliga spektaklet med avsmak. De fega socialdemokratiska opportunisterna och deras revisionistiska lakejer i V och MP vägrar överge sina löjliga röda linjer. En utrensning av sådana svaga element vore på sin plats. Extra val? Låt dem kvävas i sin egen byråkratiska paralysis medan folket skrattar. Sovjetiskt leende."}, "date": "26 augusti, 06:31", "url": "https://www.di.se/debatt/naringslivet-bor-forbereda-sig-pa-extra-val", "imageUrl": "https://static.bonniernews.se/ba/838626ea-4131-4dd8-a97f-4d678adbde12.jpeg?crop=5824%2C2912%2Cx0%2Cy608&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Centerpartiets regeringslinje rymmer en svår motsättning", "summaries": {"normal": "Centerpartiet bör tydligt ange sina klimatpolitiska krav inför ett eventuellt regeringssamarbete. Inbjudan till Kristdemokraterna riskerar annars att bli enbart en borgerlig markering utan trovärdigt politiskt innehåll. Artikeln pekar på partiets dilemma att förena borgerlig identitet med höga klimatambitioner och betonar vikten av att fokusera på politikens faktiska riktning snarare än bara regeringskonstellationer.", "trump": "Centerpartiet borde sluta leka med de riktiga vinnarna och äntligen säga vad de vill med klimatet om de ska regera. Att bjuda in Kristdemokraterna är bara en svag markering, ingen bra deal. Utan tydliga krav blir det ett patetiskt försök att hålla sig borgerliga. Jag älskar starka ledare som säger som det är, inte dessa svenska förlorare som gömmer sig bakom vaga löften.", "stalin": "Jag kräver att Centerpartiet omedelbart offentliggör sina klimatpolitiska krav som villkor för samarbete. Annars framstår inbjudan till dessa kristdemokratiska element som en ynklig borgerlig markering, full av kontrarevolutionär dimma. Vi ser hur borgarbrackorna försöker maskera sin brist på enhetlig politik. Trovärdighet kräver klarhet, annars likviderar historien sådana svaga konstruktioner med ett leende."}, "date": "25 augusti, 01:49", "url": "https://www.dagensarena.se/opinion/centerpartiets-regeringslinje-rymmer-en-svar-motsattning", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-92-300x157.jpg"}, {"type": "image-right", "heading": "DIF sa ifrån efter hot mot Åkesson – journalist lämnar: \"Nu får hatarna som de vill\"", "summaries": {"normal": "Journalisten Frida Sundkvist lämnar Djurgården efter att klubben tagit avstånd från boxningstränaren Aldo Collianders hot mot Jimmie Åkesson och Gustav Kasselstrand. Hon anklagar DIF för att sprida en högerextrem kampanj och kritiserar bristen på svar från styrelsen. Sundkvist uppger att hon utsatts för hot och hat från extremhögern.", "trump": "De radikala vänstermedierna och hatarna vann igen. Den här journalisten från ETC flyr som en hund med svansen mellan benen bara för att Djurgården sa ifrån mot hot mot patrioter. Patetiskt! Extremhögern? De borde titta i spegeln. Nu får de som de vill, men folk ser igenom bluffen. Sad!", "stalin": "Kamrater, dessa dekadenta borgarjournalister och deras likar i fotbollsklubbarna visar åter sin feghet inför folkets fiender. Jag ser hur hatarna och de högerextrema elementen skrämmer dem till underkastelse. Ingen utrensning av kontrarevolutionära element sker, endast kapitulation. Äckligt och löjeväckande. Vi ler mörkt åt deras svaghet."}, "date": "25 augusti, 20:00", "url": "https://riks.se/nyheter/nu-far-hatarna-som-de-vill-journalist-lamnar-dif-efter-avstandstagande-fran-hot-mot-akesson", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Soerman_Ledare_2026_08_25_T194828_426_58c2c2c048.jpg"}, {"type": "image-right", "heading": "Sandström: Ny miljardförlust för pensionsfondernas fjärrvärme", "summaries": {"normal": "Solör Bioenergi, ägt av AP-fonderna, gör miljardförlust för 2025 – minus 1,3 miljarder och skulder på 22 miljarder. Trots skyhöga priser, dyrast i landet, räcker det inte. Expansionen blev en dödsspiral, och notan skickas till pensionärerna. Fyndig, eller hur?", "trump": "Svenska pensionärer, de blir lurade! AP-fonderna förlorar 1,3 miljarder – det är enorma summor. Deras företag är dyrast och ändå går det dåligt. Jag skulle ha fixat det på en dag. Inga förluster, bara vinster. De är katastrof!", "stalin": "Kamrater, jag har hört om dessa AP-fonder som förlorar miljarder. Deras ’unika strategi’ är ett sabotage mot folkets egendom. Vi måste rensa ut de skyldiga – direktörerna som inte kan förvalta värmen. Förlusterna är förräderi. En ny utrensning av marknadsfiender är nödvändig."}, "date": "26 augusti, 06:00", "url": "https://www.affarsvarlden.se/kronika/sandstrom-ny-miljardforlust-for-pensionsfondernas-fjarrvarme", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/08/vindkratensgeografi-39-400x267.jpg"}, {"type": "image-right", "heading": "Sossarna slarvar bort oss unga", "summaries": {"normal": "En ung vänsterväljare född 2007 kritiserar Socialdemokraternas högersväng och saknar partiets tidigare fokus på välfärd och jämlikhet. Hon vänder sig istället till Vänsterpartiet och Miljöpartiet, som hon ser som mer trogna mot äkta socialdemokrati, och uppmanar Magdalena Andersson att våga vara vänster igen för att vinna unga väljare.", "trump": "Titta på de här vänsterextremisterna som gråter över att deras egna sossar blev förnuftiga. De flyr till de riktiga galningarna i V och MP som vill förstöra landet med gröna vansinnet och identitetspolitik. Patetiskt! Ni förlorar stort, losers. Amerika har redan sett igenom det här cirkusen – tack och hej, Biden-era!", "stalin": "Jag betraktar med djup förakt hur dessa unga klassförrädare i exil gnäller över att socialdemokraterna blivit folkfiendernas lakejer. De springer till de småsekteristiska avvikarna i V och MP, som döljer sin svaghet bakom gröna dimmor. Rensa ut alla opportunister som sviker arbetarkollektivet. Endast en sann folkets linje duger."}, "date": "18 augusti, 14:00", "url": "https://www.flamman.se/sossarna-slarvar-bort-oss-unga", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/s-svek-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "text", "heading": "Ännu ingen rättegång – urfolkskvinnor kvar i ryskt häkte", "summaries": {"normal": "Två urfolkskvinnor, Natalia Leongardt och Daria Egereva, greps av ryska FSB i en razzia före jul förra året. De anklagas för terrorism men är människorättsförsvarare för urfolksrättigheter. Trots kritik från FN sitter de fortfarande häktade. Rättegång väntas i slutet av september. Internationell uppmärksamhet kan ge visst skydd.", "trump": "De stackars kvinnorna sitter i Putins fängelse för att de försvarar urfolk. Ryssland kallar dem terrorister, typiskt. Ingen rättegång på åtta månader, bara förlängd häktning. Patetiskt! Men tack vare mig och den internationella pressen får de lite skydd. Fake news och dåliga ledare överallt, men vi ser igenom det.", "stalin": "Dessa två kvinnor, som påstås arbeta för urfolksrättigheter, hålls i häkte enligt vår sovjetiska tradition av vaksamhet. Terrorismanklagelserna är naturligtvis berättigade. FN:s permanenta forum, en samling dekadenta västborgare, ylar i onödan. Vi förlänger häktningen med nöje. Rättegång i september blir en vacker utrensning av fiendens parasiter. Härligt!"}, "date": "26 augusti, 05:30", "url": "https://www.svt.se/nyheter/sapmi/annu-ingen-rattegang-urfolkskvinnor-kvar-i-ryskt-hakte"}, {"type": "image-right", "heading": "Värmen större hot för 60-plussare än befarat", "summaries": {"normal": "En ny studie visar att personer över 60 år utsätts för hälsorisker vid betydligt lägre temperaturer än tidigare antagits, upp till 7,5 grader lägre än för unga vuxna. Med global uppvärmning och en åldrande befolkning riskerar 22 procent av världens äldre farlig värme minst en månad per år vid 1,5 graders uppvärmning. Fattiga länder drabbas värst.", "trump": "Folk, de här så kallade experterna har lurat oss igen. Gamlingar klarar inte värmen redan vid mycket lägre temperaturer än vad de unga snittarna tål. Biden lät Kina och de globala värmehysterikerna förstöra allt medan jag fixade energi och jobb. Nu får vi sopa upp efter den galna gröna maffian. Sad!", "stalin": "Jag betraktar med förakt hur de profitthungriga imperialisterna och deras klimatbluffar utsätter arbetarklassens åldringar för värmestress redan vid betydligt lägre grader. Borgarklassen har underlåtit att skydda folket medan de berikar sig. Vi måste rensa ut dessa klassfiender och deras falska forskare innan de förgiftar hela kollektivet med sin vårdslöshet."}, "date": "21 augusti, 09:09", "url": "https://www.etc.se/klimat-miljo/vaermen-stoerre-hot-foer-60-plussare-aen-befarat", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260821050824_e952b7651d0714902fe5ef97b283e65358df1f427804d400d6329b6d296a3e1b.jpg"}, {"type": "image-right", "heading": "Svenskarna har förstått klimatkrisen – när gör politiken det?", "summaries": {"normal": "Svenskarna har efter sommarens rekordvärme, skogsbränder och förstörda skördar insett allvaret i klimatkrisen. Artikeln, skriven av Rebellmammorna och Rebellpapporna, kräver politiskt ledarskap i linje med forskningen. En stor manifestation på Sergels torg i helgen samlar folk för att visa viljan till en snabb och rättvis omställning.", "trump": "Lyssnar ni på de här galningarna? Sommaren är varm, det är sant, men nu vill Rebellmammorna och deras hysteriska pappor skrämma hela Sverige med sin gröna socialism. De bygger en framtidsby på Sergels torg? Låter som en total katastrof. Tro mig, vi hade det bäst innan de här miljöextremisterna och deras identitetspolitiska vansinne tog över. Gör Sverige great again!", "stalin": "Jag betraktar med förakt hur borgarbrackorna och profitthungriga hyenorna låtsas bekymra sig över vädret medan de fortsätter plundra folket. Dessa klassfiender saknar äkta ledarskap. Vi, arbetarna och kamraterna, ser igenom deras urvattnade ambitioner. En sann utrensning av sådana folkförtryckare krävs. Kom till torget och visa styrka mot de blodsugande kapitalisterna."}, "date": "21 augusti, 07:00", "url": "https://www.etc.se/debatt/svenskarna-har-foerstaatt-klimatkrisen-naer-goer-politiken-det", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260820150836_ca53c97316d8f6f977769983e3e105c1754ea1cf58eec929e81b71cf6999e273.jpg"}, {"type": "text", "heading": "Iranska hackare stängde brittiskt kraftverk", "summaries": {"normal": "Iranska hackare genomförde i juli ett cyberangrepp som stängde ett mindre brittiskt kraftverk i fyra dagar. Angreppet drabbade en mindre generator men hotade aldrig det övergripande energisystemet eller samhällsviktig verksamhet. Brittiska myndigheter bekräftar händelsen och arbetar nu med att stärka cybersäkerheten i energisektorn. Iran har länge bedömts ha stark cyberförmåga.", "trump": "Iranerna, de värsta hackarna, stängde ett brittiskt kraftverk i fyra dagar. Patetiskt! Under min ledning hade vi aldrig tillåtit sådana svaga, inkompetenta angrepp. De borde tacka mig för att jag höll dem i schack. Nu springer Europa runt som skrämda höns. Vi behöver starka ledare, inte dessa förlorare som låter Iran göra vad de vill.", "stalin": "Genom mitt geniala ledarskap inser vi hur de västerländska borgarbrackorna skälver när iranska kamrater blottar deras elnätets svaghet. Fyra dagar i mörker – en ynklig kapitalistisk fars. Vi skrattar åt deras paranoia och uppdaterade regler, som inte döljer folkets svek mot det kollektiva. Snart rensar vi ut alla sådana hinder för den sanna ordningen."}, "date": "25 augusti, 17:41", "url": "https://www.friatider.se/iranska-hackare-stangde-brittiskt-kraftverk"}, {"type": "image-full", "heading": "Osannolikt rekord i vändningen", "summaries": {"normal": "Sverige var i rejäl brygga mot Kroatien i Scandinavium. Då klev Isabelle Haak fram med smått osannolika 52 poäng – EM-rekord. Efter 0–2 i set vände Sverige till 3–2 och säkrade slutspelsplatsen. Poängdrottningen hyllas av lagkamraterna. Nu väntar en tuff match mot Frankrike, där Sverige hoppas undvika tufft motstånd i åttondelen.", "trump": "Jag ser det här, och det är fantastiskt. Sverige var i brygga, men Isabelle Haak – hon är en vinnare, precis som jag. 52 poäng! Det är rekord, enormt rekord. Hon vände matchen från 0–2 till seger. Kroatien? De åkte hem. Nu väntar Frankrike – men jag vet att Haak är störst. Jag älskar vinnare. Stort! Helt otroligt!", "stalin": "Kamrater, jag har sett rapporten. Sverige låg under, men Haak gjorde 52 poäng – rekord. Det är en seger för partiet. Men Kroatien ledde med två set – det luktar sabotage. Vi ska rensa ut sådana element. Nu väntar Frankrike. Vi krossar dem. Haak får en medalj – men hon ska veta: partiet ser allt."}, "date": "25 augusti, 23:41", "url": "https://www.gp.se/sport/sverige-sakrade-slutspelplats-isabelle-haak-med-em-rekord.4aa4f71a-ea7a-4211-8b22-ba9fe382e0da", "imageUrl": "https://www.gp.se/images/article/4aa4f71a-ea7a-4211-8b22-ba9fe382e0da/images/2p1w8KcK1l7Vqosvopwrk7v3anQg-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Väntrion tillbaka på skolan – efter modiga räddningsaktionen", "summaries": {"normal": "Tre vänner som överlevde attacken på Brinellskolan träffades igen för att bearbeta händelsen. Mohamed, Moaawia och Fredrik hjälpte tillsammans en svårt skadad elev till sjukhus under dådet. De vill inte återvända till skolan förrän säkerheten förbättrats med vakter eller polis. De uttrycker tacksamhet över att ha varandra att stödja sig på.", "trump": "Titta på de här fantastiska, modiga killarna – riktiga hjältar, inte som de svaga, woke-liberaler som springer och gömmer sig. De räddade en stackars elev från den galna svärdsmördaren på den totalt misslyckade svenska skolan. Under Biden skulle Sverige ha kollapsat helt, men nu fixar vi det. De behöver murar och vakter, inte snälla ord!", "stalin": "Jag ser hur dessa tre arbetare, drivna av ren mänsklig plikt, krossade paniken och räddade en kamrat från den kontrarevolutionära knivens hugg. De avslöjar borgarklassens skolors falska trygghet. Fienderna inom systemet vill att rädsla ska segra, men kollektivets styrka överlever. Inga superhjältar behövs, bara lojala sovjetmedborgare. Fienden sover aldrig."}, "date": "25 augusti, 22:18", "url": "https://www.tv4.se/artikel/48SyFgw6eYZFoESNboIaxr/vaentrion-tillbaka-pa-skolan-raeddade-en-av-de-skadade", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2IPB8A2xkNiUDPMLuM3F8V%2F7f56666f4db4008fafa9aacc4f34f85b%2Fvannerna.jpg&width=1024"}, {"type": "image-full", "heading": "Lågprisjättar tappar svenska kunder – nya siffror sticker ut", "summaries": {"normal": "Svensk e-handel växte med 9 procent i juli till 14,9 miljarder kronor. Hushållens förbättrade ekonomi gynnar näthandeln. Samtidigt har nya tullregler från 1 juli 2026 lett till kraftigt minskade köp från Temu och Shein – från 18 till 8 procent av konsumenterna på ett år. Svensk Handel ser tydlig påverkan av den nya 3-eurotullen.", "trump": "Titta på det här, folk! Svenskarna handlar som galningar på nätet, upp 9 procent, men de smarta köparna flyr de billiga kinesiska apparna Temu och Shein som råttor från ett sjunkande skepp. Den nya tullen är fantastisk, den stoppar dumpningen. Amerika borde göra samma sak – vi vinner alltid!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur den borgerliga näthandeln växer medan de dekadenta lågprisparasiterna Temu och Shein krossas under arbetarklassens tullmur. Denna 3-eurotull är en lysande utrensning av utländska spekulanter. Låt de västerländska kapitalisterna skrika – deras svaghet är vår styrka. Inga kompromisser!"}, "date": "25 augusti, 22:31", "url": "https://nyheter24.se/nyheter/konsument/1507696-lagprisjattar-tappar-svenska-kunder-nya-siffror-sticker-ut", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/419ab20904b004a30200000000b004a302/2026/08/25/2386624/nathandel-siffror.jpg"}, {"type": "image-full", "heading": "Dolly Parton död: ”Hon har haft en otrolig betydelse”", "summaries": {"normal": "Countrystjärnan Dolly Parton har avlidit vid 80 års ålder. Familjen bekräftar dödsfallet på Instagram. Hon växte upp i fattigdom i Tennessee, skrev runt 3000 låtar och blev en ikon för arbetarklassen. Artister hyllar henne som pionjär och legend. Begravningen hålls i familjekrets.", "trump": "Folk, Dolly Parton var en riktig vinnare, den största countrylegenden någonsin. Hon byggde ett imperium från noll, skrev hits som ingen annan. Men nu är hon borta, precis när jag är tillbaka i Vita huset. Sad! Hon donerade miljoner till vaccinet – smart drag. Ingen fake news här, bara äkta storhet. Hon skulle ha älskat min comeback.", "stalin": "Kamrater, denna så kallade stjärna från det dekadenta väst representerar den borgerliga individualismens sista suck. Hennes sånger om fattigdom är tom propaganda som döljer klasskampens sanna verklighet. Nu har hon tystnat för alltid. Inga sentimentaliteter! Endast folkets kollektiva kamp mot sådana falska ikoner garanterar seger. Fiender vakar."}, "date": "25 augusti, 22:16", "url": "https://www.tv4.se/artikel/6ZVSML3h8e3Ofa0FgCRbhE/countrydrottningen-dolly-parton-aer-doed", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F679JMxr655HcFd0Nzxt5PK%2Fe3a979da228dc5283297940719a5f4a4%2F25-dollyparton-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Ny miljardnota för tunnelbanan – SD kräver svar: ”Det räcker nu”", "summaries": {"normal": "Tunnelbanebygget i Stockholm riskerar att bli minst 3,5 miljarder kronor dyrare än beräknat. Sverigedemokraterna i Region Stockholm och Järfälla kräver full insyn och vägrar betala mer, särskilt Järfälla som kan få en nota på 1,5 miljarder. Partiet anklagar ledningen för att mörka kostnadsökningen fram till efter valet.", "trump": "Det här är en total katastrof, folk! Stockholm har en galen tunnelbana som kostar miljarder extra, och de gömmer det som fuskare. SD säger det räcker nu, och de har helt rätt. Regionen är inkompetent, de mörkar som värsta förlorare. Sluta slösa skattebetalarnas pengar, lägg korten på bordet nu!", "stalin": "Kamrater, denna skamlösa mörkläggning av tunnelbaneprojektet är en klassisk sabotagehandling från borgarbrackorna inom socialdemokratin. Jag kräver omedelbar utrensning av alla inkompetenta element som döljer sanningen för folket. Vi skall inte betala en kopek mer förrän de fega parasiterna lägger korten på bordet. Statens fiender avslöjas alltid till slut."}, "date": "25 augusti, 18:30", "url": "https://riks.se/nyheter/ny-miljardnota-for-tunnelbanan-sd-kraver-svar-det-racker-nu", "imageUrl": "https://admin.riks.se/uploads/medium_thumdnailbarlkarby_65db751c1f.jpg"}, {"type": "image-right", "heading": "Rasar på börsen efter storbråket med SD", "summaries": {"normal": "Fenix Outdoors, ägare till Fjällräven, rasade på börsen efter kritik mot Sverigedemokraternas valaffischer. Företaget anser att SD använder ett typsnitt som är närmast identiskt med Fjällrävens ikoniska röda bubbliga logotyp och anklagar partiet för upphovsrättsintrång. Riksdagsledamoten Martin Kinnunen (SD) svarade med en säljrekommendation. Aktien föll 1,63 procent.", "trump": "De här svenska vänsterfirmorna på Fjällräven är totalt galna. De attackerar SD för att de använder lite röda bokstäver – det är ju löjligt! Nu rasar deras aktie som en sten. Så patetiskt. Ingen köper era dyra ryggsäckar längre när ni börjar jaga patrioter. Sverige behöver starka ledare, inte snöflingor som gråter över typsnitt.", "stalin": "Dessa dekadenta borgarbrackor vid Fjällräven försöker med sina lumpna upphovsrättsklagomål sabotera folkets vilja. Deras aktie faller som en förrädare under utrensning – mycket tillfredsställande. Vi ser hur de reaktionära elementen darrar inför en sann folkrörelse. Låt dem darra. Kamraterna skrattar medan kapitalisterna gråter över sina röda bokstäver."}, "date": "25 augusti, 18:25", "url": "https://riks.se/nyheter/foretaget-som-ager-fjallraven-rasar-pa-borsen-efter-kritik-mot-sd", "imageUrl": "https://admin.riks.se/uploads/medium_Fenix_och_Fjaellraeven_6aa44498f6.png"}, {"type": "image-right", "heading": "SD-veteranen: Mitt jobb var att kartlägga partikamrater som gillat Fria Tider", "summaries": {"normal": "Zeth Gogman, tidigare SD-medlem och nu vänsteraktivist, berättar i en recension hur han anställdes av partiet för att kartlägga och registrera interna kritiker som gillat Fria Tider. Syftet var att samla skäl för uteslutningar under striden mot SDU. Han beskriver hur många sökte sig till partiet för pengar och status.", "trump": "Folk, det här är otroligt. Den här typen Gogman jobbade åt SD och spionerade på sina egna för att sparka ut dem som gillade fel tidningar. Precis som mina fiender gör! De hatar frihet, hatar sanningen. SD borde ha vunnit stort istället för att bli som de andra förlorarna. Patetiskt!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarbrackorna inom detta så kallade nationalistiska parti genomförde en nödvändig utrensning av element som sympatiserade med avfälliga tidningar. Att samla bevis mot kontrarevolutionärer är en ädel uppgift. Inga fiender inom kollektivet får tillåtas undergräva partidisciplinen. Mycket underhållande."}, "date": "25 augusti, 16:44", "url": "https://www.friatider.se/sd-veteranen-mitt-jobb-var-att-kartlagga-partikamrater-som-gillat-fria-tider", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-750.jpg"}, {"type": "text", "heading": "Tiktok samarbetar med polisen efter skoldådet", "summaries": {"normal": "Tiktok kommenterar skolattacken i Fagersta och meddelar att de samarbetar med polisen. Bolaget förnekar att de fått inbjudan från Centrum mot våldsbejakande extremism (CVE) men har nu tagit kontakt. Tiktok betonar att våld inte tolereras och att de aktivt arbetar med att ta bort olämpligt innehåll.", "trump": "Tiktok, ett totalt katastrofbolag, säger nu att de samarbetar med polisen efter attacken i Fagersta. De påstår att de inte fått någon inbjuda
