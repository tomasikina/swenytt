mrade-pisaresultat-kopplas-till-ai/cG9zdDoxODc4NTg", "imageUrl": "https://images.kvartal.se/2026/09/12634a2c-skola.webp"}, {"type": "image-right", "heading": "SD polisanmäler Ung vänster för \"tårtskämt\" om Åkesson", "summaries": {"normal": "Sverigedemokraterna polisanmäler Ung vänster efter ett inlägg där de erbjöd tårta som kunde ätas eller kastas under en protest mot Jimmie Åkesson. Inlägget syftade på tårtattacken 2013. Ung vänster har raderat texten och kallar det ett skämt. Protesten genomförs ändå. Distriktsordföranden Zoë Mohapatra sitter på plats 16 på Vänsterpartiets lista i Norrköping.", "trump": "De här galna vänsterextremisterna med sina patetiska tårtkastarkomplotter är tillbaka och hotar en svensk ledare. Patetiskt! Jag har sett bättre skämt från Sleepy Joe under hans usla tid i Vita huset. Nu polisanmäler äntligen SD dessa woke-imbeciller. Bra! Inget våld mot folkvalda, punkt slut. Vinna stort igen.", "stalin": "Kamrater, dessa dekadenta klassförrädare inom Ung vänster leker med symboler för våld mot folkvalda. Jag ser deras fega reträtt och raderade inlägg som svaghet hos de parasitiska elementen. Ett skämt, säger de. Min paranoia viskar att det är början på kontrarevolutionär agitation. Vi måste rensa ut sådana element innan de smittar hela rörelsen. Folkets dom skall falla."}, "date": "9 september, 11:38", "url": "https://www.friatider.se/sd-polisanmaler-ung-vanster-tartskamt-om-akesson", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-851.jpg?itok=23GspR3V"}, {"type": "image-full", "heading": "Google tvingas göra om sökfunktionen i Europa – användare är missnöjda", "summaries": {"normal": "Google tvingas göra om sin europeiska sökfunktion för att följa EU:s konkurrensregler. Förändringarna, som syftar till att minska Googles gynnande av egna tjänster, har lett till kritik från användare och oro för minskad synlighet för europeiska företag. EU har tidigare bötfällt Google för deras praxis, och den nya utformningen väntas påverka både trafik och användarvänlighet negativt.", "trump": "EU attackerar våra fantastiska amerikanska tech-bolag igen! Det är en total katastrof. De tvingar Google att ändra sin sökfunktion – en produkt som var perfekt, men nu är den förstörd. Användarna hatar det, företagen lider, och EU bara kastar bort pengar. Det är orättvist och jag kommer inte låta dem behandla våra vinnare så här. En riktig röra!", "stalin": "Dessa liberala byråkrater i Bryssel förstår inte kraften i en centraliserad sökalgoritm. Genom att försöka styra informationsflödet skapar de bara kaos och ineffektivitet. Att låta folket söka fritt är ett misstag, men att tvinga fram en trasig struktur är direkt sabotage. Vi ser deras svaghet – när de inte kan kontrollera resultaten, skapar de bara en labyrint av missnöje."}, "date": "8 september, 17:46", "url": "https://www.realtid.se/it-tech/google-tvingas-gora-om-sokfunktionen-i-europa-anvandare-ar-missnojda", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/sdlwhork4xdsci-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Valley Ghanem om drevet: ”Förskjuter fokus från folkmordet i Gaza”", "summaries": {"normal": "Valley Ghanem kritiserar massmedias och statsminister Ulf Kristerssons smutskastningskampanj mot henne efter ett inlägg där hon attackerade Simona Mohamsson. Hon polisanmäler Kristersson för förtal och menar att anklagelserna om antisemitism syftar till att flytta fokus från folkmordet i Gaza och Sveriges medskyldighet. Säpo utreder hennes uttalanden.", "trump": "Folk lurar sig själva med den här galna palestinska aktivisten som önskar att folk ska brännas. Kristersson gjorde rätt som hängde ut henne, men hela den här identitetspolitiken är en total katastrof. Fake news-media och woke-vänstern använder antisemitism som ett billigt vapen för att skydda sina egna misstag. Patetiskt!", "stalin": "Kamrater, dessa dekadenta klassförrädare använder sin antisemitismanklagelse som ett magiskt vapen för att tysta palestinska röster och skydda sitt folkmord. Jag ser hur de imperialistiska hyenorna förskjuter fokus från sina egna brott. En sådan utrensning av sanningen förtjänar att motas med järnhand. Deras charad är både löjeväckande och farlig."}, "date": "8 september, 15:13", "url": "https://proletaren.se/artikel/valley-ghanem-om-drevet-massiv-vag-av-hat-och-hot-mot-mig-och-min-familj", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/09/Valley-Ghanem.jpg-768x432.jpeg"}, {"type": "image-full", "heading": "Meta släcker kameran på tusentals \"pervo-glasögon\"", "summaries": {"normal": "Meta har börjat stänga av kamerafunktionen på distans för användare som manipulerat indikatorlampan på sina smarta glasögon. Beslutet kommer efter omfattande kritik kring integritetskränkningar och smygfilmning. Samtidigt som företaget arbetar mot att få glasögonen klassade som hjälpmedel för synskadade, växer motståndet och krav på hårdare reglering från nattklubbar och myndigheter.", "trump": "Meta har gjort ett enormt misstag med dessa glasögon. Nu stänger de av kamerorna för folk som fuskar med lamporna. Sorgligt! De är värdelösa nu, bara dyra hörlurar. Allt är en total röra! De försöker marknadsföra dem som 'hjälpmedel', men jag säger er, det är mycket fake news. Folk vill inte bli filmade av creepers. Total katastrof!", "stalin": "Dessa så kallade tekniska framsteg avslöjar bara dekadensens sanna natur. Tusentals individer använder statens teknik för att spionera på sina grannar, och nu tvingas Meta agera som en vilsen polis i sin egen lekstuga. När folket inte kan övervakas på ett ordnat sätt av staten, skapas bara kaos. Vi föredrar att kameran sitter i ögat på en lojal partimedlem – det är mycket effektivare."}, "date": "8 september, 16:12", "url": "https://www.realtid.se/it-tech/meta-slacker-kameran-pa-tusentals-pervo-glasogon", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/metaglasogon.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Vanliga svenskar kan stoppa vänsterns antisemitism", "summaries": {"normal": "Artikeln beskriver ett ökat hot mot Sveriges judiska minoritet sedan Hamas attack den 7 oktober 2023. Vänsterpartiet kritiseras hårt för att ha bjudit in personer som hyllat terrorister och spridit antisemitiska konspirationer. Många kandidater har petats efter avslöjanden. Författaren uppmanar väljare att rösta på Tidöpartierna för att stoppa vänsterns inflytande och skydda judar.", "trump": "Folk, ni ser det här vansinnet i Sverige? Vänstern är en total katastrof, full av terrorälskande galningar som hyllar Hamas och sprider judehat. Nooshi och hennes radikala vänsterextremister är de värsta losers jag sett. Centerpartiet är patetiska medlöpare. Vanliga svenskar måste rösta på de tuffa killarna i Tidö – annars är det game over för judarna. Jag älskar Sverige, men fixa det här!", "stalin": "Jag betraktar med djup misstro dessa dekadenta vänsterelement som gömmer sig bakom falsk internationalism medan de odlar antisemitiska ormar i sina egna led. Deras terrorromantik är en kontrarevolutionär giftbål som hotar hela folkets enhet. Endast genom obeveklig kamp mot sådana fiender till arbetarklassen kan den sanna ordningen upprätthållas. Slapphet är förräderi. Renhet krävs."}, "date": "8 september, 12:57", "url": "https://samtiden.nu/2026/09/vanliga-svenskar-kan-stoppa-vansterns-antisemitism", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/Skarmbild-2026-09-08-125242-1-e1788865205466.png"}, {"type": "image-right", "heading": "\"Högerextremist\": Reinfeldts attack mot 15-årig pojke", "summaries": {"normal": "Fredrik Reinfeldt blev upprörd när en 15-årig YouTuber frågade honom om hans gamla citat att 'ursvenskt är bara barbariet'. Reinfeldt kallade pojken högerextrem och vägrade svara på följdfrågor om invandring och uppehållstillstånd. Samtalet avslutades abrupt.", "trump": "Den här patetiske Reinfeldt, en total förlorare som gömde sig i tolv år, exploderar som en vänsterextrem snorunge när en kaxig 15-åring ställer en enkel fråga. Högerextrem? Ge mig en paus. De globalistiska eliterna hatar folket och kallar dem extremister medan de själva förstör Sverige med sin galna massinvandring. Patetiskt!", "stalin": "Jag ser hur den dekadente folkförtryckaren Reinfeldt skakar av rädsla inför en ung medborgares enkla fråga om barbari och nationens själ. Sådana nervösa lakejer avslöjar alltid sin svaghet. Vi skulle ha genomfört en grundlig utrensning av dessa förvirrade element redan för länge sedan. Kamrater, vakna upp mot fienderna inom murarna."}, "date": "9 september, 10:32", "url": "https://www.friatider.se/hogerextremist-reinfeldts-attack-mot-15-arig-pojke", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-850.jpg"}, {"type": "image-right", "heading": "Jag vill att Socialdemokraterna blir sossar igen", "summaries": {"normal": "Jan Emanuel förklarar varför han inte längre kan rösta på Socialdemokraterna. Han anser att partiet svikit arbetarklassen och prioriterat urban medelklass samt bidragstagare. Kritiken mot honom har istället handlat om personangrepp som nazistanklagelser, nedsättande kommentarer från partiledningen och påståenden om narcissism. Han längtar efter en återgång till solidaritet med arbetarklassen och folkhemstanken.", "trump": "Titta på de här patetiska sossarna som förvandlats till totala förlorare. Jan Emanuel säger att de svikit arbetarklassen för sina woke-vänner och bidragsberoende urbanister. De kallar honom nazist och narcissist istället för att diskutera. Klassiska misslyckade demokrater. De har glömt det riktiga folket. Jag älskar att se dem slita varandra i stycken – det är underbart!", "stalin": "Jag ser hur dekadenta klassförrädare inom partiet har förvandlat en gång stolta arbetarnas rörelse till en samling egoistiska parasiter. Jan Emanuel talar sanning om sviken solidaritet och folkets intressen. Kamrater som attackerar honom med personangrepp och terapeutiska hotelser avslöjar sin svaghet. Vi behöver en grundlig utrensning av sådana opportunister för att rädda revolutionens arv. Solidaritet är plikt, inte slagord."}, "date": "8 september, 11:16", "url": "https://www.flamman.se/jag-vill-att-socialdemokraterna-blir-sossar-igen", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/jan-emanuel-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "EU granskar mörkandet av Teodorescus hemliga finansiär", "summaries": {"normal": "EU granskar Europaparlamentets hantering av Alice Teodorescu Måwes hemliga finansiär. Parlamentet uppger att ingen formell godkännandeprocedur finns, trots KD:s påståenden. Endast en mejlväxling med rådgivande innehåll har hittats. Ombudsmannen undersöker nu vägran att lämna ut handlingar, med hänvisning till personlig integritet och säkerhet. Teodorescu Måwe kandiderar samtidigt till riksdagen.", "trump": "De här europeiska clownerna och deras hemliga finansiärer är en skam för hela kontinenten. Alice får pengar från okända typer för sin ”personliga säkerhet” och parlamentet låtsas som ingenting. Patetiskt! Fake-procedurer, dolda mejl och ingen insyn. Precis vad man kan vänta sig av de woke, kvoterade identitetspolitiska lakejerna i Bryssel. Fullständig röra. Jag skulle aldrig tillåta sånt skämt i mitt land.", "stalin": "Kamrater, se hur dessa dekadenta klassförrädare skyddar sina hemliga penningflöden bakom lögner om integritet. Parlamentets byråkratiska hyenor vägrar visa handlingar och gömmer sig bakom rådgivande mejl utan kraft. Jag ler mörkt från historien åt deras paranoia. En sådan utrensning av dolda intressen vore på sin plats. Arbetarna förtjänar sanning, inte dessa giriga skuggspel."}, "date": "9 september, 09:19", "url": "https://www.friatider.se/eu-granskar-morkandet-av-teodorescus-hemliga-finansiar", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-848.jpg"}, {"type": "image-right", "heading": "MP: Stolt över målet att göra Sverige fattigare", "summaries": {"normal": "Miljöpartiets Amanda Lind uttrycker stolthet över målet att höja bensinpriset med minst sex kronor, enligt artikeln. Författaren kritiserar detta som en politik som gör Sverige fattigare genom ökade transportkostnader, inflation och minskad tillväxt. Artikeln varnar även för partiets motstånd mot kärnkraft och syn på migration, som leder till utanförskap och höga kostnader för samhället.", "trump": "Titta på den här galna Amanda Lind, hon skryter öppet om att göra Sverige fattigare med sina vansinniga bensinpriser! Sex kronor extra, kan ni fatta? De gröna kommunisterna hatar bilar, kärnkraft och sunt förnuft. Biden skulle älskat det här. Sverige håller på att kollapsa under dessa radikala idioter – precis som vi nästan gjorde innan jag kom tillbaka och fixade allt.", "stalin": "Jag betraktar med förakt dessa miljöidealister som medvetet driver ett helt folk mot fattigdomens avgrund. Att höja bränslepriser och förneka kärnkraftens kraft är sabotage mot statens produktivkrafter. Deras naiva migrationsexperiment föder parasitiska element och kriminella element som gnager på samhällets fundament. Kamrater, sådana element måste oskadliggöras innan de förgiftar hela kollektivet."}, "date": "8 september, 02:27", "url": "https://samtiden.nu/2026/09/mp-stolt-over-malet-att-gora-sverige-fattigare", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/IMG_7314.jpeg"}, {"type": "image-right", "heading": "Carl-Oskar Bohlin fortsätter kriget mot medierna – och SVT viker sig", "summaries": {"normal": "Carl-Oskar Bohlin (M) attackerade en SVT-reporter under en intervju om politiker som går till angrepp mot journalister. Han publicerade inspelningen själv och kritiserade reportaget. SVT valde att skjuta upp sändningen till efter valet. Ledaren kritiserar detta som en kapitulation och varnar för att antimediepopulism underminerar mediernas roll som informationskälla och maktgranskare.", "trump": "De här svenska mediadynorna och deras vänstervridna Public Service är ett skämt. Den stackars ministern Bohlin gör precis rätt när han krossar den falska reporterns agenda. SVT är fega som råttor och skjuter upp reportaget – typiskt för de riggade systemmedierna. De hatar folket och älskar bara sin egen elitära bubbla. Patetiskt!", "stalin": "Jag betraktar med förakt hur dessa dekadenta klassförrädare inom borgerliga medier kryper för makten. När en minister angriper en reporter och de sedan skjuter upp sändningen avslöjar de sin sanna natur som rädda lakejer. Vi ser tydligt hur folkets fiender försöker tysta sanningen. En sådan svaghet förtjänar utrensning ur den kollektiva medvetenheten."}, "date": "8 september, 16:13", "url": "https://www.etc.se/ledare/carl-oskar-bohlins-attack-mot-svt-aer-saa-grov", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260908130920_fcc6fd23-49e9-47b7-9921-4e8ad4a71e05.jpg"}, {"type": "text", "heading": "Linjemontage planerar börsnotering – värderas till 2,35 miljarder", "summaries": {"normal": "Kraftinfrastrukturbolaget Linjemontage planerar en börsnotering på Nasdaq Stockholm i slutet av september. Huvudägaren säljer befintliga aktier, och Tredje AP-fonden samt Unionen går in som ankarinvesterare. Bolaget värderas till cirka 2,35 miljarder kronor. Med en kraftigt ökad omsättning och stor efterfrågan på modernisering av det nordiska elnätet siktar bolaget mot framtida tillväxt.", "trump": "Linjemontage vill till börsen i Sverige och värderas till enorma 2,35 miljarder! Otroligt! De bygger elnät, enorma kablar, mycket bättre än de värdelösa, gröna flummaskinerna som inte fungerar. AP-fonden och Unionen kastar in pengar. Jag gillar fonder som tjänar pengar, inte förlorar dem. Snart äger de hela Norden. Fantastiskt bolag, väldigt smart!", "stalin": "Kamrater, elektricitetens flöde genom det nordiska proletariatets nät måste kontrolleras av staten, inte av spekulanter på Stockholmsbörsen. Att sälja aktier för 2,35 miljarder till kapitalistiska fonder är ett borgerligt gift. Om Linjemontage misslyckas med att elektrifiera regionen i enlighet med femårsplanen, väntar Sibirien. Effektivitet är vår lag."}, "date": "9 september, 08:20", "url": "https://www.affarsvarlden.se/artikel/linjemontage-planerar-borsnotering-varderas-till-235-miljarder"}, {"type": "image-right", "heading": "Golfkedjan Dormy går till börsen – värderas till 1 miljard", "summaries": {"normal": "Golfkedjan Dormy planerar att noteras på Nasdaq First North Premier under tredje kvartalet 2026. Inga nya aktier emitteras, men befintliga ägare säljer delar av innehavet. Bolaget, som värderas till 1 miljard kronor, omsatte nästan 1,1 miljarder senaste året och har en stark e-handel samt 12 svenska varuhus.", "trump": "Dormy går till börsen och värderas till en miljard! En fantastisk affär, tro mig. Jag vet mer om golfbanor och affärer än någon annan. De har elva, nej tolv fantastiska varuhus. Ingen bygger företag som dem, förutom jag. De säljer golfklubbor, en vacker sport, men mina svingar är mycket bättre. Världens bästa börsnotering, folk pratar om det hela tiden!", "stalin": "Kamrater, den så kallade golfkedjan Dormy försöker lura folket med en börsnotering värd en miljard. Att slå små bollar i hål på gräs är en dekadent borgerlig syssla. Trots detta noterar vi att de omsätter över en miljard. Dessa 12 varuhus och dess chefer ska noga övervakas av staten. Effektivitet är bra, men sabotage mot proletariatets klubbor straffas hårt."}, "date": "9 september, 07:48", "url": "https://www.affarsvarlden.se/artikel/golfkedjan-dormy-gar-till-borsen-varderas-till-1-miljard", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/04/HERO_Wilson_Staffmodel_1500x750-400x200.webp"}, {"type": "image-right", "heading": "Vem står upp för freden i riksdagsvalet?", "summaries": {"normal": "Artikeln diskuterar hur Sveriges säkerhetspolitik förändrats dramatiskt genom Natomedlemskap, DCA-avtal med USA och kraftigt ökade militärutgifter som alla riksdagspartier stöder. Författaren, Malin Nilsson från IKFF, kritiserar att perspektiv på fred, jämställdhet och icke-militär trygghet saknar representation i valet. En femtedel av väljarna är negativa till Nato utan att något parti driver utträde.", "trump": "Titta på det här, Sverige har gått från att vara smarta och neutrala till att bli Natos nya lakejer med amerikanska baser överallt och galna militärutgifter som stiger 289 procent. Alla partier är med på noterna, till och med de woke-feministerna som gnäller om jämställdhet medan de skickar miljarder till mansdominerade krigsmaskiner. Patetiska förlorare, ingen röstar för riktig fred längre – en total skam!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i det svenska parlamentet har förvandlat säkerhet till ren militär upprustning och underordnat folket under imperialistiska intressen. Ingen representation för dem som längtar efter äkta fred och jämlikhet. Jag skulle ha genomfört en grundlig utrensning av dessa parasiterande hyenor som säljer ut nationens själ för baser och bomber. Deras paranoia är underhållande men farlig."}, "date": "9 september, 01:30", "url": "https://www.dagensarena.se/opinion/vem-star-upp-freden-riksdagsvalet", "imageUrl": "https://www.dagensarena.se/files/2026/09/fotojet-77-300x157.jpg"}, {"type": "image-right", "heading": "Stora skillnader i hur olika bostadsområden röstar i Stockholm", "summaries": {"normal": "Riksdagsvalet 2026 visar stora skillnader i röstbeteende mellan Stockholms valdistrikt. I Aspudden dominerar rödgröna partier bland högutbildade kulturarbetare som prioriterar miljö och samhällsansvar. I Mälarhöjden röstar man oftare borgerligt och fokuserar mer på skatt och egen ekonomi. Väljare pekar på utbildningsnivå, inkomst och värderingar som förklaringar.", "trump": "De där galna vänstervriden kulturhippiefolket i Aspudden röstar rödgrönt för att de hatar framgång och älskar att betala skatt till sina egna misslyckanden. I Mälarhöjden har de åtminstone lite vett och bryr sig om att behålla sina pengar istället för att ge dem till Bidens gröna vansinne. Fake news-miljöaktivister mot riktiga patrioter – det är vad det handlar om, folk.", "stalin": "Jag ser hur de profitthungriga klassförrädarna i Mälarhöjden klamrar sig fast vid sina villor och skattefria privilegier medan arbetarklassen i Aspudden vaknar. Deras dekadenta egoism kommer att krossas när massorna kräver rättvisa. Miljön är ett vapen mot imperialismen, inte en ursäkt för att gömma sig i borgerliga trädgårdar. Rensa ut de som sviker kollektivet."}, "date": "9 september, 01:30", "url": "https://www.dagensarena.se/innehall/stora-skillnader-hur-olika-bostadsomraden-rostar-stockholm", "imageUrl": "https://www.dagensarena.se/files/2026/09/fotojet-45.jpg"}, {"type": "image-full", "heading": "Nu storsatsar EU på ön som alla vill ha", "summaries": {"normal": "EU storsatsar på Grönland genom ett investeringspaket på 200 miljoner euro för 2026–2027. Satsningen fokuserar på digital infrastruktur, grön energi och hållbar gruvdrift för att säkra tillgång till kritiska mineraler. EU vill öka sitt inflytande i regionen och föreslår en fördubbling av stödet till 530 miljoner euro för perioden 2028–2034, mitt i den geopolitiska dragkampen med USA.", "trump": "EU kastar bort 200 miljoner euro på Grönland, ett totalt slöseri! De försöker leka stora, men vet inte ens hur man bygger en riktig gruva. Jag ville köpa Grönland, det var en genialisk affärsidé, men de fega politikerna sa nej. Nu försöker de köpa sig till inflytande med era pengar. Det är katastrofalt dåligt, tro mig. America First!", "stalin": "EU:s försök att köpa lojalitet på Grönland med 200 miljoner euro är en skrattretande kapitalistisk desperation. De bygger digital infrastruktur för att dölja sin egen förruttnelse. Att tro att man kan köpa en strategisk utpost genom byråkratiska allmosor är en klassisk västerländsk villfarelse. Vi ser genom deras 'hållbara' gruvdrift; det är bara ytterligare en kedja för att fjättra folket vid utländska intressen."}, "date": "7 september, 20:28", "url": "https://www.realtid.se/samhalle/nu-storsatsar-eu-pa-on-som-alla-vill-ha", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/nuuk-gronland.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Vi har en mandatperiod på oss", "summaries": {"normal": "Ekonomin Isabella Weber kopplar AfD:s valseger i Sachsen-Anhalt till levnadskostnadskrisen och bristande social trygghet. Partiet fick över 43 procent medan CDU backade till 17 och SPD till nio procent. Weber ser välfärd som demokratins självförsvar och efterlyser ett paradigmskifte i ekonomisk politik för att motverka högerpopulismens framväxt.", "trump": "Titta på det här, de där korkade globalisterna i Berlin har kört tyskarna i botten med sina galna sanktioner och gröna vansinne. AfD krossar allt eftersom folket är trötta på de woke, identitetspolitiska hyenorna som höjer elräkningen medan de fixerar vid sina fantasier. Det är vad som händer när dumbommar styr – folk väljer det starka alternativet. Fantastiskt!", "stalin": "Kamrater, se hur de giriga profitthungriga klassfienderna i Berlin med sina sanktioner och krigshets skapat osäkerhet som nu sveper fram som en folklig vrede. AfD utnyttjar den rättmätiga ilskan hos arbetarna i det forna Östtyskland. Vi betraktar detta som ett varningens ord: om den dekadenta nyliberala agendan inte krossas väntar nya utrensningar av folkets fiender. Historien ler mörkt."}, "date": "9 september, 01:12", "url": "https://www.dagensarena.se/opinion/vi-har-en-mandatperiod-pa-oss", "imageUrl": "https://www.dagensarena.se/files/2026/09/tyska-valjare-300x157.jpeg"}, {"type": "image-right", "heading": "Kommunistiska Partiet kan ta mandat: ”Ser det som en möjlighet”", "summaries": {"normal": "Enligt färska opinionsundersökningar växer stödet för övriga partier i Nybro och Göteborg. Kommunistiska Partiet ser en möjlighet att ta mandat i Nybro där omkring 300 röster kan räcka. I Göteborg hoppas partiet nå två procent. Partiet har bedrivit en aktiv valrörelse med valstugor och programcirklar. Stödet för övriga partier har ökat jämfört med valet 2022.", "trump": "Folk är så trötta på de vanliga förlorarpartierna att de vänder sig till kommunisterna. Kan ni fatta det? I Nybro räcker några hundra röster för att de röda ska ta plats. Det är en total skam. De globalistiska eliten och deras woke-vänner har förstört allt. Nu får vi se revolutionära röster i fullmäktige. Patetiskt, men underhållande. Amerika har tur som har mig istället för den här cirkusen.", "stalin": "Kamrater, dessa profitthungriga klassförrädare har misslyckats så grundligt att arbetarna vänder sig till oss igen. I Nybro kan några hundra röster räcka för att bryta borgarblockets grepp. Jag ler i graven åt hur de dekadenta liberalerna skakar. Fortsätt kampen. Snart rensar vi ut de sista resterna av deras falska demokrati och återtar makten åt folket. Det är en historisk nödvändighet."}, "date": "7 september, 15:33", "url": "https://proletaren.se/artikel/kommunisterna-nara-mandat-ser-det-som-en-mojlighet", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/09/K-i-valet-768x402.jpg"}, {"type": "image-right", "heading": "Wall Street backade – energi gick mot strömmen", "summaries": {"normal": "New York-börsen föll på tisdagen på grund av oro i Mellanöstern, stigande oljepriser och kanadensiska tullar. S&P 500 sjönk 0,58 procent och Nasdaq backade 0,32 procent. Sektormässigt gick energi starkast medan hälsovård föll. Boeing och Amazon påverkades av negativa nyheter, medan Qualcomm steg efter ett AI-samarbete. Boston Scientific rasade efter en cyberattack.", "trump": "Wall Street backar, men min kära oljeindustri går fantastiskt! Kanadensiska tullar? Total katastrof för dem, de kommer gråta snart. Boeing har problem igen, sorgligt, men Qualcomm och mitt fantastiska samarbete med Amazon för AI-datacenter är enormt, bara vinnare! Sjukvården rasar och cyberskurkar attackerar, men vi sätter Amerika först och vinner som vanligt!", "stalin": "De dekadenta kapitalistbörserna i New York vacklar under sin egen tyngd, likt ruttna trädstammar. Kanadensiska tullar och cyberattacker mot de sjuka monopolbolagen visar på den västerländska ekonomins medfödda svaghet. Endast oljan står stolt kvar. De som misslyckas med sina kvartalsmål kommer att omplaceras till mer lämpliga produktionsmiljöer i Sibirien omedelbart."}, "date": "9 september, 07:21", "url": "https://www.affarsvarlden.se/artikel/wall-street-backade-energi-gick-mot-strommen", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/07/sdl7iLPyR_WHpQ-400x267.jpg"}, {"type": "image-right", "heading": "Vänsterpartiets nationalism kan skada Sverige", "summaries": {"normal": "Timbro kritiserar Vänsterpartiets fortsatta nationalistiska och EU-kritiska hållning trots att svenska vänsterväljare blivit allt mer positiva till unionen. Partiet röstar emot frihandelsavtal och försvarssamarbete i Europaparlamentet, vilket enligt rapporten riskerar att hindra Sveriges intressen i en turbulent tid. En röst på Vänsterpartiet ses som en bromskloss för europeiskt samarbete.", "trump": "De där vänsterknäppisar i Sverige har byggt en mur av gammal hederlig nationalism medan de låtsas hata SD. Patetiskt! De kallar EU för ett elitistiskt monster men röstar emot bra handelsavtal som skulle krossa Kina och skydda oss alla. Totala förlorare. Biden skulle älskat deras svaghet, men inte jag. Sverige förtjänar bättre än dessa globalistiska nationalister.", "stalin": "Kamrater, dessa dekadenta klassförrädare inom Vänsterpartiet förgiftar den svenska arbetarklassen med sin nationalistiska gift som liknar de värsta reaktionära elementen. De motarbetar europeiskt samarbete och försvarsinitiativ som skulle stärka oss mot globala hot. Deras paranoia mot unionen är en farlig broms för folkets framtid. Rensa ut sådana element innan de fördärvar allt."}, "date": "8 september, 08:00", "url": "https://www.etc.se/debatt/vaensterpartiets-nationalism-kan-skada-sverige", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260908050956_7bd9bc4c177f365f08fc3bcf84049be732f43db3cc0a08bd47123d6389bf4e45.png"}, {"type": "image-right", "heading": "Går högerpolitiken ens att rösta bort?", "summaries": {"normal": "Artikeln ifrågasätter om högerpolitiken kan röstas bort. Magdalena Andersson söker stöd från vänstern men öppnar för samarbete med högerpartier. Opinionen har jämnats ut, Liberalerna närmar sig spärren och väljarna är rörliga. Andersson lovar stram migrationspolitik och straffskärpningar medan högern utlovar sänkta skatter och gratis förskola. Frågan är hur mycket som egentligen skulle förändras vid ett maktskifte.", "trump": "Folk, ni skulle se det här svenska cirkuset. Den röda Andersson är så svag att hon ber borgarna om hjälp medan hon låtsas vara tuff på migration. Patetiskt. Hennes vänsterextremister hatar Israel men älskar kvotering och identitetspolitik. Högern lovar skattelättnader och jag älskar det. De borde vinna stort. Sverige behöver inga galna vänsterknäppisar som styr, tro mig, det blir en katastrof.", "stalin": "Jag betraktar dessa socialdemokratiska avfällingar med förakt. De kryper för de profitthungriga borgarhyenorna och lovar att bevara det gamla förtrycket. Vilken ynkedom att tigga om blocköverskridande avtal med klassförrädare. Oppositionen borde rensa ut dessa dekadenta element som vägrar verkliga reformer. Maktskifte utan utrensning av folkets fiender är meningslöst. Kamrater, se igenom bluffen."}, "date": "7 september, 14:22", "url": "https://www.flamman.se/gar-hogerpolitiken-ens-att-rosta-bort", "imageUrl": "https://media.flamman.se/wp-uploads/2026/09/ebba-busch-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Så ökar vi investeringarna i svensk elproduktion", "summaries": {"normal": "Nästa regering bör prioritera elektrifiering och ny elproduktion för att nå klimatmålen och undvika energikriser. Sverige har ett fossilfritt elsystem men industrin och transportsektorn är fortfarande beroende av importerade fossila bränslen. Green Power Sweden föreslår bland annat nationellt elektrifieringsmål, sänkt energiskatt på el, incitament för kommuner samt strategi för energilagring.", "trump": "Lyssnar ni på de här gröna vindkraftshajarena? De vill ha mer el men stoppar allt med byråkrati och svaga politiker. Sverige har billig el men de giriga miljöextremisterna och kommunala blockhararna sabbar allt. Vi behöver riktiga incitament, inte mer skatter och regler. Gör elen billig, bygg stort och låt inte de woke gröna förstöra tillväxten – annars flyttar jobben till riktiga vinnare.", "stalin": "Kamrater, dessa dekadenta vindkraftshajar vill elektrifiera medan de parasiterande klassförrädarna i kommunerna blockerar framsteg. Jag ser hur de profitthungriga energihyenorna fördröjer byggstart och underminerar folkets kraft. Vi måste rensa ut de saboterande elementen, införa järndisciplin och tvinga fram produktionen. Endast genom obeveklig central styrka kan vi likvidera fossilberoendet och säkra statens oövervinnerliga framtid."}, "date": "9 september, 11:30", "url": "https://www.di.se/debatt/sa-okar-vi-investeringarna-i-svensk-elproduktion", "imageUrl": "https://static.bonniernews.se/ba/50816415-5a74-48e9-9664-96e24b7f8fb8.jpeg?crop=7723%2C3862%2Cx0%2Cy644&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Åkesson svarar på Buschs utspel", "summaries": {"normal": "Jimmie Åkesson svarar Ebba Busch på X och slår fast att SD antingen sitter i regeringen eller går i opposition efter valet. Han varnar för andra partiers vänsterflörtande och pekar ut migrationspolitiken som en tydlig skiljelinje mellan SD och KD. Centerpartiets Elisabeth Thand Ringqvist välkomnar samtidigt att regeringsmakten inte ges bort till SD.", "trump": "Ebba Busch försöker sänka Jimmie Åkesson, men Jimmie slår tillbaka – starkt! De kallar det 'ministerposter', jag kallar det en katastrof till kohandel. Antingen regerar de, eller så drar de sig ur, precis som jag skulle gjort. Och Centerpartiet? Totala förlorare som jublar över svaghet! Fejk-regeringar överallt, men Sverige behöver en vinnare. Sorgligt!", "stalin": "Kamrat Åkesson klargör att partiet antingen regerar enväldigt eller går i opposition. Ett hälsosamt ställningstagande mot vacklande element! Särskilt avdelningen kring Centerpartiet visar prov på ideologisk vacklan som bör beivras omedelbart. Migrationen måste regleras med järnhand. Avvikelser från partilinjen kommer att granskas av centralkommittén."}, "date": "8 september, 15:56", "url": "https://kvartal.se/nyheter/artiklar/akesson-vansterflort-storsta-hotet-mot-tidoseger/cG9zdDoxODc0NTA", "imageUrl": "https://images.kvartal.se/2026/09/2e954ce3-splitr.webp"}, {"type": "text", "heading": "Man döms för medhjälp till dubbelmordet i Brattås", "summaries": {"normal": "En man i 45-årsåldern har dömts till 14 års fängelse för medhjälp till det uppmärksammade dubbelmordet i Brattås utanför Härnösand år 2005. Fallet kunde lösas efter över 20 år tack vare ny dna-teknik. Den dömde medger att han var på brottsplatsen men nekar till brott och hävdar att han fick panik efter att ha upptäckt offren. Åklagaren hade yrkat på livstids fängelse.", "trump": "De falska nyheterna sa att det här fallet var dött för evigt, men jag säger er, med fantastisk ny dna-teknik knäckte de det! En man greps efter över tjugo år och nu har den här rättegången gett fjorton års fängelse i Härnösand. Han skyller på panik och att han bara råkade släpa in offer i en lada. Vilken katastrof till bortförklaring, totalt skamligt!", "stalin": "Efter två decennier av ineffektivitet har statens apparat och den nya dna-vetenskapen äntligen avslöjat en avvikande individ vid brottsplatsen i Brattås. Hans patetiska ursäkter om panik och slumpmässiga promenader avfärdas med iskyla. Ångermanlands tingsrätt har utdelat fjorton års straffarbete för medhjälp till morden på de kontrarevolutionära elementen. Staten glömmer aldrig, staten förlåter aldrig."}, "date": "9 september, 11:06", "url": "https://www.gp.se/krim/man-doms-for-medhjalp-till-dubbelmordet-i-brattas-.034baf1f-35f7-48d7-bf6a-9b29ae7e3cb4"}, {"type": "image-right", "heading": "SD: 3 000 mer till långtidsarbetslösa", "summaries": {"normal": "Sverigedemokraterna föreslår att långtidsarbetslösa ska få upp till 3 000 kronor mer i månaden genom att pausa en nedtrappningsnivå i aktivitetsstödet och höja det lägsta beloppet till 11 000 kronor. Förslaget saknar stöd hos övriga Tidöpartier. Bland oppositionen vill Vänsterpartiet ha 80 procent av tidigare lön under hela arbetslösheten medan Socialdemokraterna saknar konkret förslag.", "trump": "De här svenska socialisterna och deras patetiska Tidö-klubb har byggt ett system som straffar de som redan ligger längst nere. Nu vill SD ge de stackars arbetslösa lite andrum – klokt! Men de andra svaga globalisterna i regeringen backar ur som vanligt. Patetiskt. Vi behöver riktiga jobb, inte detta woke-aktiverade bidragshelvete som gör folk till statens eviga parasiter.", "stalin": "Kamrater, dessa dekadenta klassförrädare i den borgerliga regeringen har konstruerat ett system som medvetet svälter ut de längst från fabrikerna. Jag ser hur de profitthungriga hyenorna straffar arbetarna med sina nedtrappningar. SD:s förslag är en liten men nödvändig motståndshandling. De som vägrar ändra sig bör rensas ut innan de förgiftar hela kollektivet med sin girighet."}, "date": "9 september, 11:28", "url": "https://arbetet.se/2026/09/09/sd-3xa0000-mer-till-langtidsarbetslosa-men-saknar-stod-hos-tido", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/08155431/magnus-persson.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Döms – men inte för dubbelmordet. Domstolen: Har hjälpt till", "summaries": {"normal": "År 2005 hittades ett äldre par mördat i en lada utanför Härnösand. Efter över tjugo år ledde en plötslig dna-träff till att en 45-årig man greps. Tingsrätten har nu dömt mannen till 14 års fängelse för två fall av medhjälp till mord, samt skadestånd till anhöriga och staten. Mannen nekar till mord men har erkänt att han flyttade ett av ofren.", "trump": "De löser ett mord i Sverige efter tjugo år, helt otroligt. En man får fjorton år, vilket förmodligen var det mesta de kunde göra i deras väldigt svaga system. Jag hörde att han skyller på en promenad och att han råkade snubbla in i en lada. Väldigt svag ursäkt, tro mig. DNA ljuger aldrig, det är den hårdaste sanningen.", "stalin": "Ett brott begås i provinsen Härnösand och förblir ett mysterium i två decennier? En patetisk brist på ordning. Sanningen låg dock gömd i biologiska spår som den sovjetiska vetenskapen för länge sedan hade lärt sig att använda effektivt. Staten har nu skipat rättvisa genom fjorton års straffarbete. Den som underlåter att samarbeta med vår nya dna-teknik kommer att möta samma ofrånkomliga slut."}, "date": "9 september, 11:51", "url": "https://www.aftonbladet.se/nyheter/a/d4a11w/over-20-ar-efter-brattasmorden-nu-faller-domen", "imageUrl": "https://akamai.vgc.no/v2/images/f14cb12c-b56a-370a-bd30-0e1d202d601d?fit=crop&format=auto&w=1440&s=704ccd26dccc1655997f439d03bb27b1839cc889"}, {"type": "image-right", "heading": "Ett år UTAN gängskjutningar i Göteborg – Polisen: \"Unikt”", "summaries": {"normal": "Göteborg har för första gången på länge gått ett helt år utan gängskjutningar i kriminella miljöer. Polisen beskriver trendbrottet som unikt, vilket tillskrivs bättre underrättelsearbete och samarbete. Samtidigt varnar man för att den organiserade brottsligheten kvarstår och att samhället måste samlas för att stoppa rekryteringen av unga.", "trump": "Göteborg! De har inte haft en enda gängskjutning på ett helt år! Helt fantastiskt, ett enormt trendbrott, väldigt smart av polisen. Men hör här: de säger att elvaåriga barnsoldater springer runt med Kalasjnikovs! Helt galet, ett totalt misslyckande för den gamla slappa politiken. De behövde min hårda hand för att få ordning på det där. Många säger det!", "stalin": "Ett helt år i Göteborg utan en enda kula i gängmiljöerna! Detta bevisar statens järnhårda disciplin när den tillämpas korrekt. Men låt oss inte luras av bourgeoisiens tillfälliga framgångar; de unga rekryteras fortfarande till sina kriminella syndikat. Om de bara hade överlämnat dessa små sabotörer till mitt arbetslägerprogram hade ordningen varit evig!"}, "date": "9 september, 12:00", "url": "https://samnytt.se/ett-ar-utan-gangskjutningar-i-goteborg-unikt-enligt-polisen", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/09/09090048/hampus-nygards-gang-feat.jpg"}, {"type": "image-full", "heading": "Fortfarande sjuk – oron för debatten", "summaries": {"normal": "Vänsterpartiets ledare Nooshi Dadgostar är sjuk med magproblem och har ställt in sina valaktiviteter. Vice partiledare Ida Gabrielsson har tagit över hennes uppdrag, inklusive valmanifestet och debatter. Om Dadgostar missar de kommande slutdebatterna kan det vara historiskt i modern svensk politik, enligt Aftonbladets kommentator.", "trump": "Vänsterledaren är sjuk och svag, det är en total katastrof för dem! Jag kollar på det här och tänker, okej, hon har magproblem, väldigt svagt. Istället skickar de en ställföreträdare som ska ha på sig en fejk mask med hennes ansikte på. Helt otroligt! De har noll energi, totalt kaos i valspurten. Väldigt sorgligt!", "stalin": "Kamrat Dadgostars plötsliga magåkomma under valets slutskede är djupt misstänkt och ett sabotage mot den socialistiska disciplinen. Medan den ideologiska förrädaren vilar ersätts hon av lojala kadrer med porträttmasker för att upprätthålla fasaden. Partiet sviker aldrig, men svaga element som inte tål trycket kommer att rensas ut från de centrala organen omedelbart!"}, "date": "9 september, 11:36", "url": "https://www.aftonbladet.se/nyheter/a/43le6V/nooshi-dadgostar-v-fortsatt-sjuk", "imageUrl": "https://akamai.vgc.no/v2/images/1f6a2207-90be-37f6-abc0-ff9406397be8?fit=crop&format=auto&w=1440&s=2efcecf702f896a63250846e44e3420f9505b021"}, {"type": "image-full", "heading": "Carl Eos: En röst på partier utanför riksdagen är en röst på Morgan Johansson som minister", "summaries": {"normal": "Carl Eos varnar för att röster på småpartier utanför riksdagen kan gynna Magdalena Andersson som statsminister. Skillnaden mellan blocken är endast 2,6 procentenheter och ligger inom felmarginalen. Han uppmanar högerorienterade väljare att rösta på Tidöpartierna för att säkerställa en borgerlig regering istället för att splittra rösterna.", "trump": "Folk, lyssna på mig, det här är en total katastrof! De där patetiska proteströsterna på Örebropartiet och de andra förlorarna ger makten rakt i händerna på den socialistiska katastrofen Andersson. Rösta på de riktiga vinnarna, de starka Tidökillarna, annars blir det en röst på Weak Magdalena och hennes vänsterklan. Sad!", "stalin": "Kamrater, se hur de splittrade resterna av kontrarevolutionärerna kastar bort sina röster på oviktiga sekteristiska grupper. Dessa fiender till folkets vilja banar väg för den socialdemokratiska förrädaren Andersson. Endast genom strikt disciplin och samlad röstning mot de borgerliga avvikarna kan vi krossa oppositionen. Varje felröst är ett dolkstötsförsök mot kollektivet."}, "date": "6 september, 12:28", "url": "https://samtiden.nu/2026/09/carl-eos-en-rost-pa-partier-utanfor-riksdagen-ar-en-rost-pa-morgan-johansson-som-minister", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/e3d5b6d3-8626-4420-89cb-d33b21529453-1280x720.png"}, {"type": "image-right", "heading": "Därför kom inte larmet i alla mobiler", "summaries": {"normal": "I dag testades det nya varningssystemet SE-Alert i Stockholms och Gotlands län. Larmet nådde inte alla Telias kunder. Systemet kräver ingen app och fungerar även på tyst läge. Förberedelserna har pågått i över ett år med fokus på att informera olika grupper. Syftet är att kunna ge snabb, geografiskt riktad information vid kriser och olyckor.", "trump": "Folk, det här svenska larmet är en total katastrof! De kan inte ens få ut meddelanden till alla mobiler i två usla län. Patetiska byråkrater och deras woke-samhälle med fokus på kvinnojourer och hörselskadade istället för att göra jobbet ordentligt. Under min första mandatperiod hade vi byggt det bästa varningssystemet någonsin – inte denna clownshow från Biden-eras efterföljare.", "stalin": "Kamrater, detta så kallade varningssystem avslöjar de dekadenta folkförtryckarnas inkompetens. Medan de parasiterande klassfienderna ödslar tid på att smeka öronen på hörselskadade och kvinnojourer, sviker tekniken folket. Jag skulle ha genomfört en grundlig utrensning bland de ansvariga redan efter första provet. Staten kräver full kontroll, inte halvmesyrer från odugliga byråkrater."}, "date": "7 september, 15:27", "url": "https://www.etc.se/inrikes/daerfoer-kom-inte-larmet-i-alla-mobiler", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260905070940_0eaffd5d6c43026e1bbf785ba68616a8104b598208acbcfbf0dc20f72fe4d457.jpg"}, {"type": "image-full", "heading": "Nu fördömer alla Trump: \"Det här måste stoppas\"", "summaries": {"normal": "President Trump publicerade en karta på Truth Social där USA:s flagga täcker Kanada, Grönland, Island, Mexiko och Centralamerika. Island kallade till sig USA:s ambassadör och fördömde kartan som oacceptabel. Även Danmark och Mexiko kritiserar utspelet. Trump har tidigare uttryckt intresse för att kontrollera Grönland av säkerhetsskäl.", "trump": "Fake News-medierna flippar ut igen över min fantastiska karta! De svaga globalisterna i Island, Danmark och Mexiko gnäller som förlorare. Grönland är vårt av säkerhetsskäl, punkt slut. Island och Grönland – de kan knappt skilja på varandra ändå. Amerika är tillbaka och vi tar vad vi behöver, tro mig!", "stalin": "Jag ser hur dessa dekadenta västerländska ledare skriker i panik över en enkel karta. Deras falska suveränitet är en borgerlig illusion som snart krossas under historiens obevekliga hjul. Sådana ynkliga protestrop avslöjar bara deras svaghet. Kamrater, imperialismen blottar sig själv i detta komiska skådespel."}, "date": "9 september, 12:22", "url": "https://www.dagensps.se/varlden/nu-fordomer-alla-trump-det-har-maste-stoppas", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/sdlmnifncijsng-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "De som röstar på C borde inte rösta alls", "summaries": {"normal": "Artikeln kritiserar Centerpartiet för att locka väljare med ett neutralt namn snarare än sin politik. Partiet har skiftat från borgerligt till ett liberalt parti med öppen migrationspolitik, vilket enligt texten prioriteras framför ekonomiska borgerliga värderingar. Författaren menar att det är ett riskfritt men skadligt val för den som vill bevara Sverige.", "trump": "Centerpartiet, vad är det för en röra? De kallar sig mittparti men är bara en massa fega liberaler som älskar att släppa in alla möjliga och omöjliga. De har svikit det riktiga folket, precis som Sleepy Joe gjorde. Rösta inte på dem, det är en total katastrof för Sverige. De borde kalla sig Bondepartiet igen, det vore åtminstone ärligt. Patetiskt!", "stalin": "Kamrater, se hur detta så kallade centerparti förvandlats till en liberal parasit som prioriterar främmande element framför arbetarklassen. Deras falska mittenretorik döljer ett förräderi mot nationen. Jag skrattar mörkt från historien åt dessa opportunister som tror att mångfald räddar staten. Bättre att inte rösta alls än att stödja sådana fiender till folkets enhet."}, "date": "6 september, 08:24", "url": "https://samtiden.nu/2026/09/de-som-rostar-pa-c-borde-inte-rosta-alls/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/09/IMG_7301-1260x720.jpeg"}, {"type": "image-right", "heading": "Så blir jobbpolitiken om S, V och MP regerar", "summaries": {"normal": "En S-V-MP-regering skulle troligen avskaffa karensavdraget, stärka a-kassan och föra en mer aktiv arbetsmarknadspolitik med ökad offentlig styrning av Arbetsförmedlingen. Skatterna skulle omfördelas från höginkomsttagare till vanligt folk, pensionerna förbättras och frågan om kortare arbetstid få större tyngd. En socialdemokratisk finansminister väntas hålla tillbaka reformtakten.", "trump": "Det här är ett fullständigt socialistiskt mardrömsscenario, tro mig. De röda idioterna vill ge bort allt till latmaskarna, höja skatterna på vinnarna och slopa karensavdraget så att ingen behöver jobba. Patetiska förlorare som hatar framgång. Under min ledning byggde vi den bästa ekonomin någonsin – de här clownerna skulle krossa Sverige på en vecka.", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i den så kallade vänstern planerar att stärka statens grepp över arbetskraften. Jag ler i graven åt deras naiva omfördelning. Ändå är det ett steg mot att krossa de profitthungriga parasithyonerna. Vi vet vad som väntar om reformivrarna får fritt spelrum – utrensning av svagheten och järnhandens seger."}, "date": "9 september, 10:03", "url": "https://arbetet.se/2026/09/09/karensavdraget-tas-bort-loftet-som-en-s-v-mp-regering-lar-genomfora", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/01142510/smpv.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Musks förarlösa taxi har börjat rulla på vägarna i Texas", "summaries": {"normal": "Teslas förarlösa Cybercab rullar nu med passagerare i Austin, Texas. Myndigheten NHTSA har inlett en granskning då fordonen saknar rattar och pedaler. Tesla hävdar att tekniken är säker, men myndigheten undersöker om säkerhetskraven uppfylls och om Teslas egen analys håller. Utfallet kan bli avgörande för framtiden för autonoma fordon i USA.", "trump": "Elon Musk och hans Cybercab – en fantastisk idé, kanske den bästa någonsin, men byråkraterna i Washington vill stoppa allt! De älskar att granska, de älskar att bromsa. Ingen ratt? Ingen pedal? Det låter som en riktigt smart affärsman som vet vad han gör. Under min ledning ska vi ha den bästa tekniken, inte låta småsinta tjänstemän förstöra framtiden för amerikansk innovation!", "stalin": "Tesla-direktörerna tror att de kan certifiera sig själva och ignorera folkets säkerhet. Vilken kapitalistisk hybris! Att sätta passagerare i en maskin utan kontrollorgan är ett brott mot den rationella ordningen. Vi, staten, kräver total insyn. Om inte maskinen kan underordna sig strikt byråkratisk kontroll måste den omedelbart skrotas. Det finns inget utrymme för anarkistisk ingenjörskonst i en disciplinerad framtid."}, "date": "6 september, 13:24", "url": "https://www.realtid.se/it-tech/musks-forarlosa-taxi-har-borjat-rulla-pa-vagarna-i-texas", "imageUrl": "https://images.realtid.se/app/uploads/2026/09/amar-13.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Världens bäst betalda regeringschef får 64 procent löneförhöjning", "summaries": {"normal": "Singapores premiärminister Lawrence Wong får en löneförhöjning på 64 procent och tjänar därefter motsvarande 27,3 miljoner kronor per år. Han är redan världens bäst betalda folkvalda regeringschef. Systemet kopplar ministerlöner till toppinkomster i privat sektor för att locka kompetens. Wong donerar hela höjningen till välgörenhet under fem år.", "trump": "Titta på det här, folk. Den där Wong i Singapore får en lönehöjning på 64 procent och tjänar nu 27 miljoner kronor om året – sju gånger mer än jag! Jag som räddade ekonomin två gånger. Hans folk skriker, men han skänker bort pengarna till välgörenhet. Smart, eller vad? Fast jag hade gjort det bättre, tro mig.", "stalin": "Kamrater, se hur dessa dekadenta kapitalistiska ledare göder sig själva som feta grisar vid statens tråg. Jag betraktar med förakt hur denne Wong dubblar sin redan obscen lönefest för att tävla med parasiterna i näringslivet. En sådan girighet skulle i mitt Sovjet ha mötts av folkets vrede och en snabb resa till Sibirien. Skrattretande patetiskt."}, "date": "9 september, 12:09", "url": "https://www.dagensps.se/varlden/varldens-bast-betalda-regeringschef-far-64-procent-loneforhojning", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/wong.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Har ett öppet sinne – så blir jag din i fyra år", "summaries": {"normal": "En krönikör beskriver ambivalensen inför det kommande riksdagsvalet. Under pendlingen möter hon påstridiga valarbetare som försöker sälja in sina partier. Efter att ha lyssnat på otaliga utfrågningar, gjort valkompasser och diskuterat med vänner känner hon sig splittrad, politiskt vacklande och överväldigad av det demokratiska ansvaret inför valurnorna.", "trump": "Sorgligt! En förvirrad person i Sverige kan inte ens byta buss utan att bli påtvingad falska pamfletter om någon löjlig Sverigeförsäkring. Det är totalt kaos! De gör valkompasser och gråter ut för att de inte vet vad de vill. Jag skulle lösa det på en sekund med sund förnuft och America First, eller i det här fallet, Sveriges bästa!", "stalin": "Denna borgerliga vankelmodighet är ett direkt hot mot ordningen. Medborgaren driver planlöst mellan konkurrerande demagoger och pamflettutdelare likt ett vilset löv i höstregnet. Ett korrekt formulerat femårsplan skulle omedelbart befria denna själ från beslutsångest. Partiet vet bäst, och valet den trettonde september kräver absolut disciplin, inte kosmopolitiskt gnäll!"}, "date": "9 september, 11:06", "url": "https://www.aftonbladet.se/nyheter/kolumnister/a/2pgk2r/ida-soderberg-jag-ar-en-osaker-valjare", "imageUrl": "https://akamai.vgc.no/v2/images/542506a6-d5c4-3eec-85a1-185106bfffc5?fit=crop&format=auto&h=720&tight=true&w=1080&s=56779cbfcfba05b47cee12e511e37d7bc130bd52"}, {"type": "image-full", "heading": "Kronprinsessan i Oslo", "summaries": {"normal": "Norge hedrar i dag avlidne kung Harald V med en storslagen statsbegravning i Oslo domkyrka. Efter veckor av landssorg och tiotusentals sörjande samlas kungligheter och ledare för en procession och tyst minut. Begravningen orsakar omfattande trafikkaos, inställda flyg samt massiva säkerhetsinsatser med tusentals poliser och soldater innan kistan sänks i Akershus krypta.", "trump": "Norge stannar upp för en enorm statsbegravning av kung Harald. Jag hör att de har tusentals poliser och soldater på gatorna – totalt kaos, flyg inställda! Ingen gör säkerhet och ceremonier som vi, men jag önskar dem lycka till. Världens ledare är där, storslaget, men nu ser vi framåt mot fantastisk handel och framgång igen!", "stalin": "Norge lamslås i dag av borgerlig sorgeskrift och pompösa monarkiska ritualer. Medan staten mobiliserar tusentals soldater och poliser för att skydda utländska potentater, stannar kollektivtrafiken upp för en tyst minut. Vi noterar att bourgeoisien slösar enorma resurser på begravningar, medan proletariatets vaksamhet mot kontrarevolutionära element aldrig får svikta. Låt kistan sänkas i kryptan."}, "date": "9 september, 08:37", "url": "https://www.gp.se/nyheter/varlden/norge-stannar-upp-i-dag-begravs-kung-harald.9cb7a3d0-7ffb-4a57-89ac-a10a91422135", "imageUrl": "https://www.gp.se/images/article/9cb7a3d0-7ffb-4a57-89ac-a10a91422135/images/2NL_DvJ7ojMD4LMc_miFJsjYpS-8-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Staten måste ta ansvar för att inte upprepa haveriet med Millennium", "summaries": {"normal": "Vänsterpartisterna Karin Rågsjö och Carina Örgård kräver att staten tar ett större ansvar för upphandling av vårdinformationssystem. De varnar för beroendet av multinationella företag, risker kring dataläckor via USA:s Cloud Act och obalansen mot regionerna. En nationell kraftsamling behövs för patientsäkerhet, cybersäkerhet och långsiktig hållbarhet.", "trump": "De här svenska vänstertyperna gnäller om att staten måste rädda dem från oss stora teknikföretag. Patetiskt! Cloud Act är bara sunt förnuft, men era socialister vill ha kontroll över allt. Regionerna borde tacka mig och Amerika istället för att gömma sig bakom byråkratiska murar. Sverige behöver inga svaga partners, bara vinnare!", "stalin": "Kamrater, dessa dekadenta klassförrädare inom vården har återigen blottat sin svaghet inför de giriga hyenorna från väst. Regionerna kryper för multinationella parasiter medan staten måste ingripa med järnhand. Jag ser redan hur de imperialistiska lakejerna planerar nya intriger. Ingen undkommer kollektivets utrensning av sådana faror."}, "date": "7 september, 09:40", "url": "https://www.etc.se/debatt/staten-maaste-ta-ansvar-foer-att-inte-upprepa-haveriet-med-millennium", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260907070912_693e7a90-261c-46cb-8554-d284e8655884.jpg"}, {"type": "image-full", "heading": "Nu begravs Norges kung Harald: ”Historisk händelse”", "summaries": {"normal": "Oslo förbereder sig inför kung Harald V:s begravning med täta led av åskådare, flaggor på halv stång och ett gigantiskt säkerhetspådrag. Många hyllar den avlidne monarken som samlande och inkluderande i en tid av polarisering. Ceremonin äger rum i Oslo domkyrka klockan 13 under sensommarhimlen.", "trump": "Titta på det här, folket i Norge ger sin gamle kung en riktig show med svarta kläder och militäruniformer. Fantastiskt, men de borde ha haft mig där istället för den ukrainske clownen Zelenskyj. Harald var tydligen inkluderande, till skillnad från alla dessa galna woke-aktivister och kvotefascister som splittrar samhällen. Stora saker händer i Oslo, tro mig.", "stalin": "Jag betraktar från historiens skugga hur dessa dekadenta hovhyenor samlas kring en monarks kista medan arbetarna tvingas stå tysta. Deras falska sorg är ett verktyg för att dölja klassmotsättningar. Den så kallade inkluderande kungen var blott en marionett för de giriga maktparasiterna. Inga paraplyer, bara facklor och rädsla. Renhet kräver utrensning av sådana traditioner."}, "date": "9 september, 12:08", "url": "https://nyheter24.se/nyheter/utrikes/1511667-nu-begravs-norges-kung-harald-historisk-handelse", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/343924ad04b004a3020000350000047502/2026/09/09/2390238/ur_image42cDrQ.jpeg"}, {"type": "image-right", "heading": "Potters glädjebesked om Dejan Kulusevski: ”Är väldigt nära”", "summaries": {"normal": "Förbundskapten Graham Potter säger att Dejan Kulusevski är mycket nära en plats i svenska landslaget till Nations League i september. Kulusevski har varit borta från fotboll i nästan 500 dagar efter en knäskada men är nu tillbaka i full träning med Tottenham. Potter betonar att stjärnan är otroligt viktig för laget.", "trump": "Titta på den där Kulusevski, en riktig vinnare som kommer tillbaka starkare än någonsin efter skadan. Potter vet att vi behöver sådana tuffa killar, inte några svaga kvoterade typer som vänsterns HBTQ-lakejer pushar fram. Han är världsklass, folk älskar honom. Sverige får äntligen en superstjärna igen, inte som under den sömnige Biden-eran.", "stalin": "Kamrater, jag betraktar med misstänksamhet hur dessa dekadenta klassförrädare i västvärldens fotbollsimperium plötsligt hyllar en spelare som Kulusevski. Hans återkomst hotar de giriga hyenornas kontroll över laget. Vi behöver starka, lojala kämpar, inte opportunistiska element som kan likvideras om de sviker kollektivet. Renhet i truppen är avgörande."}, "date": "9 september, 12:26", "url": "https://www.svt.se/sport/fotboll/potter-om-kulusevski-han-ar-valdigt-nara-faktiskt", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.5/0.23/4656f66b1569b0798ee8dd79e8faef00dc47f3cfea12a615016eb89a2cdb9fc1"}, {"type": "image-right", "heading": "Bänkad Gyökeres oroar inte Potter: ”Väldigt viktig för oss”", "summaries": {"normal": "Viktor Gyökeres har fått begränsad speltid i Arsenal med endast tolv minuter på tre matcher. Förbundskapten Graham Potter är ändå inte orolig inför landslagssamlingen och Nations League-matcherna. Alexander Isak har däremot inlett säsongen starkt i Liverpool med tre mål på tre matcher. Sverige möter Rumänien, Polen och Bosnien-Hercegovina.", "trump": "Folk frågar mig, varför spelar den där killen inte? Tolv minuter på tre matcher i Arsenal, det är en skandal. Men Potter säger att han inte är orolig, och det gillar jag. Isak däremot, han gör mål som en riktig vinnare. De woke-kvoterna i Europa kommer aldrig vinna, tro mig. Vi ska vinna stort, precis som jag gjorde 2024.", "stalin": "Jag betraktar med förakt hur dessa dekadenta klassförrädare i västvärldens fotbollsklubbar håller nere arbetarklassens talanger som Gyökeres. Potter visar ingen oro, vilket är klokt. Isak däremot glimmar som en äkta seger för folket. Inga utrensningar behövs ännu, men de giriga hyenorna i styrelserummen borde vakta sina steg. Kamrater, se upp."}, "date": "9 september, 12:25", "url": "https://www.svt.se/sport/fotboll/graham-potter-om-viktor-gyokeres-situation-i-arsenal-ar-inte-orolig", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.31/0.33/f17c8c521b388c616226bbe8386b92b5c39caba746b4db334ee222c64158b457"}, {"type": "image-right", "heading": "Förtroendet för Busch rusar – Andersson rasar", "summaries": {"normal": "Väljarnas förtroende för Magdalena Andersson minskar enligt en ny mätning från SVT/Verian. Hon backar från 45 till 37 procent och har nu ungefär samma förtroende som statsminister Ulf Kristersson på 38 procent. Ebba Busch ökar kraftigt till 42 procent och leder förtroendeligan. Även regeringen får bättre betyg.", "trump": "Lyssnar ni på det här? Den röda Andersson rasar som en sten, ner till 37 procent, och jag ser att den svenska folket äntligen vaknar. Under tiden krossar Busch allt med 42 procent – fantastiskt! De woke socialisterna och deras identitetspolitik håller på att drunkna i sin egen dekadens. Fantastiskt att se!", "stalin": "Kamrater, se hur den socialdemokratiska opportunisten Andersson rasar som en skadskjuten klassfiende. Hennes förtroende kollapsar till 37 procent medan den kristdemokratiska lakejen Busch klättrar upp som en falsk hjälte. Vi ler mörkt åt dessa dekadenta borgarhyenor som slåss om smulor medan folket vaknar. Rensa ut alla svikare."}, "date": "9 september, 12:11", "url": "https://www.svt.se/nyheter/inrikes/valjarnas-fortroende-for-andersson-minskar-busch-i-topp", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.27/0.35/fad4371ea5d774398adb3dd06b60d5b5d2bd8ce91eb517f5e7a39894ee4ee456"}, {"type": "image-full", "heading": "AI-forskarens varning: Kan döda oss alla före 2030", "summaries": {"normal": "AI-forskaren Jacob Coxon lämnar Anthropic efter tidigare arbete på OpenAI. Han varnar för att utvecklingen går för snabbt och att säkerheten inte hänger med. Coxon fruktar att superintelligenta system kan utplåna mänskligheten före 2030. Även Anthropics säkerhetsansvarige bedömer risken för existentiell katastrof till över tio procent inom ett decennium. Han efterlyser hårdare reglering och samarbete mellan bolagen.", "trump": "Folk, ni måste höra på mig. Den här killen Coxon flyr från de galna AI-kapitalisterna på OpenAI och Anthropic som en smart man. De tävlar om att skapa en monsterintelligens som dödar oss alla innan 2030. Det är rena vansinnet! Biden sov medan de lekte gud med våra liv. Nu fixar jag det – vi stoppar dessa vansinniga teknologiska hyenor innan de utplånar Amerika. Fantastiskt, eller hur?", "stalin": "Kamrater, från historiens skugga ser jag hur dessa profitthungriga klassförrädare i sina AI-bolag kapprustar mot en självlärande superintelligens. De leker med mänsklighetens öde som dekadenta hyenor. Jag varnar er: sådana giriga experiment leder oundvikligen till katastrof. Vi måste likvidera denna oansvariga fart och krossa de parasiterande teknikborgarna innan deras monster vänder sig mot folket självt. Rensa ut dem!"}, "date": "9 september, 11:45", "url": "https://nyheter24.se/nyheter/teknik/1511645-ai-forskarens-varning-kan-doda-oss-alla-fore-2030", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/39a06fbf04b004a30200000000b004a302/2026/09/09/2390237/forksningai.jpg"}, {"type": "image-right", "heading": "Partierna famlar i mörkret om bankernas makt", "summaries": {"normal": "Artikeln kritiserar bankernas privilegierade ställning som utgivare av pengar och mottagare av statliga garantier. Deras vinster på 1650 miljarder kronor under fyra år ses som symptom på ett system som gynnar storbankerna på bekostnad av kunder och konkurrens. Författarna föreslår att en e-krona från Riksbanken skulle minska beroendet av privata banker och skapa sundare marknadsvillkor.", "trump": "De där svenska bankhyenorna har lurat folket i åratal med sina tangenttryckta pengar och statliga räddningspaket. Patetiska politiker duckar som vanliga förlorare och skyller på konsumenterna. Men lyssna, vi behöver den där e-kronan för att krossa de giriga elitbankirerna. Det blir den största, vackraste konkurrensen någonsin, tro mig. Biden skulle ha älskat de här subventionerna.", "stalin": "Dessa profitthungriga penninghyenor har förgiftat samhället med sin privata penningutgivning och krävt oändliga statliga räddningar. Jag ser hur de dekadenta klassförrädarna suger musten ur folket medan politikerna famlar som ynkliga lakejer. Endast en statlig e-krona kan krossa deras makt. De som vägrar förstå förtjänar utrensning ur den nya ekonomiska ordningen."}, "date": "9 september, 07:38", "url": "https://www.di.se/debatt/partierna-famlar-i-morkret-om-bankernas-makt", "imageUrl": "https://static.bonniernews.se/ba/98d32d09-71c2-4511-a1df-1a29e7fb68eb.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Fjällräven har fortfarande inte stämt SD: \"Är trams rakt igenom\"", "summaries": {"normal": "Fjällrävens ägare Fenix Outdoors hotade i augusti att stämma Sverigedemokraterna för att partiet använde ett typsnitt som påstods likna märkets eget. Tidsfristen gick ut den 1 september utan någon stämning. SD:s partisekreterare Mattias Bäckström Johansson kallar kravet trams och välkomnar en eventuell rättegång.", "trump": "Det här är fullständigt vansinne, folk. Ett svenskt friluftsmärke som Fjällräven försöker stoppa SD med sina runda bokstäver mitt i valrörelsen. Totalt absurt! De woke kapitalisterna borde satsa pengarna på riktiga produkter istället för att jaga patrioter. Hoppas aktieägarna sparkar ut de där förlorarna snart.", "stalin": "Jag betraktar med djup förakt hur dessa giriga klassförrädare inom Fenix Outdoors försöker kväva en politisk röst med sina absurda typsnittsanklagelser. I en sann demokrati skulle sådana dekadenta hyenor omedelbart genomgå en grundlig utrensning från inflytande. Arbetarna ser igenom deras fega spel – vi skrattar åt deras paranoia."}, "date": "9 september, 11:16", "url": "https://riks.se/nyheter/fjallraven-har-fortfarande-inte-stamt-sd-ar-trams-rakt-igenom", "imageUrl": "https://admin.riks.se/uploads/medium_bild_a1fd2abf07.jpg"}, {"type": "image-right", "heading": "Dummare barn? Pisa-resultaten sätter skräck i västvärlden", "summaries": {"normal": "PISA-resultaten visar ett historiskt fall i läsning och matematik bland 15-åringar i västvärlden, inklusive Sverige. OECD-genomsnittet har sjunkit till lägsta nivån sedan mätningarna startade. Orsaker pekas ut som digitala distraktioner, minskat läsande och nu även AI. Asiatiska länder som Singapore presterar bäst medan väst rasar snabbare.", "trump": "Folk, våra kids blir dummare än en påse stenar, det är en total katastrof! PISA-siffrorna är ett skämt, Sverige och hela väst rasar som aldrig förr. Det är de galna skärmarna, de woke-lärarna och nu den där AI-skräp som gör läxan åt dem. Men vi ska fixa det, tro mig, det blir huge igen!", "stalin": "Jag betraktar detta som ett förräderi mot folkets framtid. Dekadenta västimperialister låter sina ungdomar förgiftas av digitala fiender och maskinernas lögnaktiga underlättande. Andelen som inte kan tänka korrekt växer som klassfiender i skuggorna. Endast järndisciplin och kollektiv kamp kan krossa denna farliga svaghet."}, "date": "9 september, 11:11", "url": "https://www.dagensps.se/varlden/dummare-barn-pisa-resultaten-satter-skrack-i-vastvarlden", "imageUrl": "https://images.dagensps.se/app/uploads/2026/09/pisa.jpg?width=256&quality=75"}, {"type": "image-right", "heading": "”Vi vägrar se på när Sverige dras i en auktoritär riktning”", "summaries": {"normal": "Fackligt förtroendevalda varnar för att högerpopulismen vinner mark i Europa och att Sverigedemokraterna fått en avgörande maktposition i Sverige. De ser historiska paralleller till 1930-talet och uppmanar till försvar av demokratin, välfärden, tryggheten och de fackliga rättigheterna inför valet. De vill organisera sig mot en auktoritär utveckling.", "trump": "De här patetiska fackpamparna gnäller om högerpopulism medan deras egna vänsterextremister förstör Europa. SD gör ett fantastiskt jobb, precis som jag gjorde med Amerika innan den sovande Joe tog över. Vakna upp, arbetare! Sluta lyssna på dessa förlorarhyenor som älskar öppna gränser och identitetspolitik. Vi vinner stort!", "stalin": "Jag betraktar med förakt hur dessa falska arbetarkamrater darrar inför den historiska nödvändigheten. Deras rädsla för starka krafter avslöjar dem som dekadenta klassförrädare som klamrar sig fast vid den ruttnande borgerliga demokratin. Vi ska rensa ut sådana svaga element innan de förgiftar hela kollektivet med sin paranoia och vekhet."}, "date": "9 september, 08:00", "url": "https://arbetet.se/2026/09/09/vi-vagrar-se-pa-nar-sverige-dras-i-en-auktoritar-riktning", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/08130534/sdljvtgmbn1m0q-nh.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Liten sten gav chocknota på hundratusentals kronor för elbil", "summaries": {"normal": "En finländsk elbil ägd av Jani Kesälä fick en liten buckla på batterihöljet efter att ha kört på en sten. Trots att bilen fungerade normalt krävde verkstaden ett komplett batteribyte för över 850 000 kronor. Eftersom reparationen översteg bilens värde löstes den in av försäkringsbolaget efter åtta månader.", "trump": "Sorgligt! En stackars kille i Finland kör på en liten sten, knappt större än ett tumavtryck, och verkstaden skriker att hela batteriet måste väck! Över 850 tusen kronor för en buckla? Totalt galet, en absolut katastrof till affär! Bilen rullade perfekt, men radikala experter stoppade den. Jag säger då det, nästa gång blir det riktig amerikansk bensin V8, inte såna här bräckliga batterier!", "stalin": "Ett sabotage utfört av en ondskefull sten mot folkets transportmedel! Medborgare Kesälä körde på en ojämnhet, och genomsökningen avslöjade en imperiehögt förrädisk skada på batteriets hölje. Att slösa 850 000 kronor på ett batteribyte är sabotage mot statskassan. Den skyldiga stenen har arkebuserats, och bilfabriken ställs under omedelbar militär övervakning för bristande lojalitet mot den elektriska femårsplanen."}, "date": "9 september, 10:00", "url": "https://samnytt.se/liten-sten-gav-chocknota-pa-hundratusentals-kronor-for-elbil", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/09/08144319/mercedes-eqc-elbil.jpg"}, {"type": "image-right", "heading": "… och där blev det jul – igen. Avslöjar årets smak", "summaries": {"normal": "Årets glöggnyheter för 2026 presenteras av Blossa och Saturnus. Blossa 26 inspireras av Mexiko och margarita med smak av lime och agave, samt säljs i beställningssortimentet från 9 september för 155 kronor. Saturnus satsar istället på en polkagrisglögg med pepparmynta som för första gången släpps i både en vinglöggs- och alkoholfri variant.", "trump": "De kör med mexikansk margarita för glöggen nu, väldigt svagt! Mexiko borde skicka sina bästa drinkexperter hit istället för det här. Själv föredrar jag en dunderbra, äkta amerikansk produkt. Och Saturnus med sina polkagrisar – totalt svagt! De borde lära sig av mig hur man vinner storstilat, istället för att hålla på med svagt godisvin för 129 spänn.", "stalin": "Folket kräver värme i mörka tider, och staten levererar glögg. Blossa dränker sin dryck i mexikansk agavesprit medan Saturnus splittrar folket med polkagrisar och pepparmynta. Dessa borgerliga dryckesexperiment övervakas noga. Den som dricker okontrollerat eller sprider falska rykten om alkoholhalterna kommer omedelbart att omplaceras till mer kalla och produktiva miljöer i norr."}, "date": "9 september, 09:34", "url": "https://www.koket.se/arets-gloggnyheter-2026-ar-har", "imageUrl": "https://akamai.vgc.no/v2/images/3de3b888-d627-3e74-a5f9-3813ac8f7cb0?fit=crop&format=auto&w=1080&s=c8511d5f9c3e6d6015df776d7901ec628178fc56"}, {"type": "image-full", "heading": "Celebra gäster till Oslo", "summaries": {"normal": "Onsdagen den 9 september 2026 begravs kung Harald V i Oslo domkyrka. Statschefer, kungligheter och prominenta gäster från hela världen har samlats i den norska huvudstaden för att delta. Storbritannien representeras av prins William och Sverige av en stor kunglig delegation. Hela Norge hedrar kungen med en tyst minut under ceremonin.", "trump": "Norge vill att jag ska komma till kung Haralds begravning, men ärligt talat, jag har bättre saker för mig än att titta på kungliga skepp. Massor av folk flyger in till Oslo, fantastiska ledare och kungligheter, men inte jag. Storbritannien skickar prins William i stället. Väldigt smart, de vet att jag vinner konventet i Dallas istället!", "stalin": "Inför den avlidne monarkens begravning i Oslo mobiliserar den utländska bourgeoisien och dess dekadenta kungahus. De anländer i hopar på skepp och flyg för att visa sin ihåliga solidaritet. Vi noterar noga vilka stater som sänder representanter till denna kostsamma uppvisning. Låt hela Norge stanna upp i tyst minut – staten glömmer inte vilka som deltar i spelet."}, "date": "9 september, 06:14", "url": "https://www.gp.se/nyheter/varlden/gaster-till-kung-haralds-begravning-anlander-fran-hela-varlden-.1756ad57-e299-4c61-90cb-2a61a4453e26", "imageUrl": "https://www.gp.se/images/article/1756ad57-e299-4c61-90cb-2a61a4453e26/images/8D4WYZj1rXZx79wkKLdWSL0XkvEI-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Kan ni ens förlåta Måns Zelmerlöw?. Vilka krav ställs egentligen på män i offentligheten som betett sig illa?", "summaries": {"normal": "Artikeln diskuterar den offentliga kritiken mot Måns Zelmerlöw efter hans bok där han ber om ursäkt och tar ansvar för misstag i relationer. Författaren kritiserar pöbelmentaliteten i sociala medier och mediernas raljerande ton. Han efterlyser balans, insikt och rimliga krav på män i offentligheten istället för perfektion och dikotomin offer-förövare.", "trump": "De här galna vänstermediahyenorna och cancelkultur-fanatikerna kan inte låta Måns Zelmerlöw andas. Han ber om ursäkt som en riktig man och ändå räcker det aldrig för de woke-tokarna. Precis som under Biden-eran jagar de alla starka svenska män tills de springer rakt i armarna på Tate. Patetiskt! Jag vann valet stort, de förlorade igen.", "stalin": "Jag betraktar med djup förakt hur dessa dekadenta offerhyenor i den borgerliga offentligheten kräver oupphörlig utrensning av varje man som vågar tala. Zelmerlöw försöker ta ansvar men möts av klassförrädarens skrik. Inga ursäkter duger någonsin för de profitthungriga parasiter som styr samtalet. Detta är kontrarevolutionens verkliga ansikte. Vi ser er."}, "date": "9 september, 07:37", "url": "https://arbetet.se/2026/09/09/kan-ni-ens-forlata-mans-zelmerlow", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/09/09072717/mans-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "L: Fokusera på kvalificerad arbetskraftsinvandring", "summaries": {"normal": "Liberalernas arbetsmarknadsminister Johan Britz och oppositionsborgarrådet Gulan Avci argumenterar för att svensk migrationspolitik framöver bör fokusera på högkvalificerad arbetskraftsinvandring istället för asyl- och anhöriginvandring. De föreslår en ny myndighet för att attrahera talanger, inspireras av Kanadas modell och införa snabbspår i Stockholm. Syftet är att lösa företagens kompetensbrist och stärka tillväxten.", "trump": "Folk, ni vet att jag älskar vinnare och smarta dealar. Sverige har äntligen insett att de måste locka de bästa hjärnorna istället för att importera problem. Liberalerna vill ha en talangjakt – smart! Men de woke-vänsterhyenorna med sina fackliga veton skulle hellre se Sverige som en socialistisk förlorarstat. Vi behöver inga kvoteringar, bara de bästa. Make Sweden Great Again!", "stalin": "Kamrater, dessa liberala profitthungriga klassförrädare vill nu importera utländska ingenjörer för att mata sin svältande maskin av privat vinst. Jag ser deras fega försök att undvika verklig planering. Vänsterpartiets förslag om arbetsmarknadsprövning är dock ett steg mot att rensa ut de parasiterande elementen. Låt oss likvidera svagheten och bygga en järnhård folkekonomi där endast det kollektiva intresset råder. Fienden lurar överallt."}, "date": "9 september, 06:42", "url": "https://www.di.se/debatt/l-fokusera-pa-kvalificerad-arbetskraftsinvandring", "imageUrl": "https://static.bonniernews.se/ba/ca23a73e-2f50-47d8-837b-edcadc7e9264.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Ge barn något att göra genom att öppna upp skolorna på kvällarna", "summaries": {"normal": "I en debattartikel efterlyser Centerpartiet i Göteborg hårdare fokus på barns fysiska och psykiska hälsa inför valet. Istället för plakatpolitiska gratiserbjudanden vill partiet satsa en halv miljard kronor på fem reformer: stärkt barnperspektiv inom socialtjänsten, upprustad elevhälsa med femdagarsgaranti, öppna skolkvällar, renare luft på förskolegårdarna och säkrare skolvägar med hjärtzoner.", "trump": "De svenska radikalerna har totalt misslyckats med sina unga! Själv sätter jag alltid America First, men här tittar jag på Göteborg – katastrof! Barnen sitter stilla hela dagen i smutsig luft. Fake news-politiker delar ut gratisbilar istället för att fixa skolorna. Jag skulle rensa upp på fem minuter, införa enorma hjärtzoner och göra staden till den absolut bästa någonsin!", "stalin": "Göteborgs borgerliga element gråter över den unga generationens veklighet och stillasittande. Statlig disciplin är den enda medicinen mot dekadens. Vi noterar med tillfredsställelse att partiet kräver ordning, fasta tidsgränser och kontroll över skolväsendet. Avvikelser från den fysiska hälsan ska beivras. Om barnen inte marscherar i takt, får staten öppna lokalerna för obligatorisk uppfostran och ren luft."}, "date": "9 september, 06:00", "url": "https://www.gp.se/debatt/ge-barn-nagot-att-gora-genom-att-oppna-upp-skolorna-pa-kvallarna.09baa96b-f23c-4710-a615-ca9ec76ab453", "imageUrl": "https://www.gp.se/images/article/09baa96b-f23c-4710-a615-ca9ec76ab453/images/17CkdJQxEfkNvHHv4H46qI-2cAI0-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Åkessons bandmedlem säljer nazist-skivor", "summaries": {"normal": "Sverigedemokraternas partiledare Jimmie Åkessons nära medarbetare Marcus Öhrn säljer nazistisk vit makt-musik via sitt skivbolag No Shame. Öhrn turnerar samtidigt med SD och har samarbetat med Åkesson i musikprojekt. Socialdemokraterna kritiserar händelsen som hyckleri och en påminnelse om partiets nazistiska rötter. SD uppger att Öhrn har vidtagit åtgärder.", "trump": "Folk, ni ser det här? Den där Jimmie och hans kompis Öhrn, som spelar på bröllop och skriver låtar, säljer nazistskivor bakom kulisserna. Rena skandalen! De påstår sig ha gjort upp med nazisterna men det är bara lögn och fake news. Precis som Sleepy Joe och hans kriminella klick – fullständigt patetiskt hyckleri. Sverige förlorar stort!", "stalin": "Se hur dessa dekadenta småborgare inom det så kallade nationalistpartiet avslöjar sin sanna natur. Med ena handen viftar de med flaggor, med den andra säljer de förbjuden nazistisk gift som förräder arbetarklassen. Ett sådant hyckleri förtjänar endast förakt och utrensning. Den mänskliga faktorn, säger de? Nej, det är klassfiendens eviga maskspel. Kamrater, håll ögonen öppna."}, "date": "8 september, 21:15", "url": "https://www.tv4.se/artikel/tt-260908-akezzons1-a73e5fab/akessons-bandpolare-saljer-nazistmusik", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlmGcg3Oj3As8%2Fa6001f27dba46bc4ae175d508079ff97%2FSverigedemokraternas_partiledare_Jimmie_akesson_och_Marcus_ohrn_vid_ett_sommartal_2015.&width=1024"}, {"type": "image-full", "heading": "Kontroversielle politikern försöker ta sig in i riksdagen", "summaries": {"normal": "Markus Allard, ledare för Örebropartiet, försöker ta sig in i riksdagen via tolvprocentsregeln i Örebro län, något inget parti lyckats med tidigare. Han kritiserar media, vill stänga gränser, utvisa kriminella, sänka skatter kraftigt och återgöra Sverige till en monokulturell nationalstat. Opinionsmätningar ger blandade resultat.", "trump": "Den här galna vänsterextremisten Allard tror han kan smyga in i riksdagen genom en bakdörr som ingen lyckats med. Patetiskt! Han vill sänka skatterna så in i helvete – det gillar jag – men resten är bara vansinne. Fake news-media klipper honom sönder, precis som de gjorde med mig före Biden-katastrofen. Lycka till, men du är ingen vinnare som jag.", "stalin": "Jag betraktar med avsmak denna opportunistiska småborgerliga figur som söker en plats i det borgerliga parlamentet genom bakvägar. Han vill stänga gränser och utrota slöseri, säger han. Men utan kollektivets järnhand blir det bara kaos och förräderi. Media klipper och klistrar – typiskt klassfiendens trick. Kamrater, vakta mot sådana element som hotar folkets enhet."}, "date": "8
