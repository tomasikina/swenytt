en SD och KD har rätt – det är vansinne. De borde riva upp den här galna lagen direkt. Amerika skulle aldrig falla för sådant här woke-nonsens, tro mig.", "stalin": "Kamrater, jag betraktar med djup misstänksamhet denna så kallade könstillhörighetslag som en borgerlig dekadens som sipprar in i arbetarklassens rena samhälle. 2000 ansökningar! Tydligen har fienderna inom Tidölaget, dessa opportunistiska revisionister och dolda kapitalistlakejer, öppnat portarna för en puckeleffekt av moraliskt förfall. Vi ska inte tillåta sådana dekadenta element att förgifta kollektivet. En grundlig utrensning av dessa borgarbrackor och deras paranoiaframkallande lagar är nödvändig för att skydda det sanna folkets enhet. Det är nästan roande hur de tror sig kunna byta kön som man byter lojalitet – men vi vet bättre."}, "date": "1 augusti, 07:25", "url": "https://www.svt.se/nyheter/inrikes/ett-ar-efter-nya-konslagen-reformen-fortsatter-splittra-tidolaget", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.71/0.38/74053f74137be3d6c8e505e2d4d56fa0e4a9935247d2d718a25968f4b817ad5e"}, {"type": "image-right", "heading": "Arbetare flydde genom skogen – kan ha utnyttjats", "summaries": {"normal": "Polisen i Skellefteå ryckte ut på ett larm om bilbrand utanför Burträsk men hittade ingen brand. I stället mötte de flera utländska bärplockare som uppgav att de inte fått betalt för sitt arbete. Misstankar om människoexploatering har väckts och ärendet utreds av åklagare Jonas Peterson. De drabbade personerna kommer från ett annat europeiskt land och valde att fly genom skogen.", "trump": "Det här är en total katastrof, folk. Jag älskar Sverige, men ni måste vakna upp. Utländska arbetare som plockar bär, inte får en krona och flyr genom skogen som i någon dålig film. Det är vad som händer när ni har svaga gränser och dåliga avtal. Vi skulle aldrig acceptera det i mitt Amerika. Rensa ut de dåliga aktörerna och gör Sverige stort igen!", "stalin": "Kamrater, detta är vad som händer när borgarbrackorna och de parasitiska kapitalisterna får fritt spelrum. Arbetare tvingas plocka bär åt profitörer, får ingen lön och måste fly som råttor genom skogen. Jag ser fiendens klor överallt, dessa utpressningsmän och dolda kontrarevolutionärer. Vi ska rensa ut dessa exploatörer med järnhand, likvidera deras nätverk och låta folkets rättvisa segra. Ingen slipper undan."}, "date": "31 juli, 11:11", "url": "https://arbetet.se/2026/07/31/arbetare-flydde-genom-skogen-nu-utreds-misstankt-manniskoexploatering", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/31103448/sdln3e9qsrhqmk-normalhires.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "På prideminglet pratar ingen om arbetslösa bögar", "summaries": {"normal": "Artikeln kritiserar otryggheten på arbetsmarknaden där tidsbegränsade anställningar ökar trots fallande arbetslöshet. Många lever i ständig osäkerhet som hindrar dem från att planera livet, protestera mot dåliga förhållanden eller lämna kränkande chefer. Författaren kopplar detta till Prideveckan och menar att jämlikhet inte kan diskuteras utan att ta upp klassfrågor. Statsminister Kristersson undviker debatt och föredrar mingel, medan diskrimineringsanmälningar ökar kraftigt.", "trump": "Det här är en katastrof, en total katastrof för arbetarna. Kristersson minglar med regnbågar i palatset medan folk sitter på sängkanten och väntar på ett samtal från chefen. Patetiskt! Arbetslösheten sjunker visst, men alla har tillfälliga jobb och ingen makt. De stora orden om jämlikhet är bara löjliga – utan klass och styrka är det bara tomt prat. Jag skulle fixa det, tro mig, det skulle bli fantastiskt.", "stalin": "Kamrater, jag ser tydligt hur de kapitalistiska parasiterna och borgarbrackorna inom den falska regnbågsfasaden fortsätter att förtrycka det arbetande folket med sina temporära slavkontrakt och telefonväntan vid sängkanten. Denna klassfiendeorkester av osköna liberaler och opportunistiska minglare som Kristersson vill tysta protesten med glittrande flaggor. Vi ska rensa ut dessa förrädiska element som gömmer sig bakom Pride-loggor medan de likviderar arbetarnas rättigheter. Paranoian är befogad – de ler mot kollektivet men hugger i ryggen när telefonen tystnar."}, "date": "31 juli, 07:00", "url": "https://arbetet.se/2026/07/31/pa-kristerssons-pridemingel-slipper-han-prata-om-arbetslosa-bogar", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/24150213/pridemingel.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Det går att få bort arbetslösheten!", "summaries": {"normal": "Artikeln argumenterar att massarbetslösheten i Sverige, som legat runt 7,5 procent i genomsnitt sedan EU-inträdet, är skapad och gynnar kapitalister genom lägre löner och svagare fackföreningar. Författaren pekar på att arbetslösheten var betydligt lägre före EU-medlemskapet och föreslår lösningar som arbetstidsförkortning till sex timmar, höjd a-kassa, oförändrad pensionsålder och ett svenskt EU-utträde för att möjliggöra verkliga reformer.", "trump": "Folk, det här är ett totalt haveri! De där EU-byråkraterna och de svenska socialistiska förlorarna har skapat en enorm arbetslöshet som bara gynnar de rika grabbarna på toppen. Rena skandalen! Jag fixade rekordlåg arbetslöshet i USA, både före och efter Sleepy Joe. Sex timmars dag? Patetiskt! Ni behöver en riktig ledare som sänker skatter, sparkar ut byråkraterna och gör Sverige great again – inte mer av den här vänstervridna EU-sörjan.", "stalin": "Kamrater, detta är klassfiendens verk. Jag ser hur de exploaterande borgarbrackorna medvetet odlar massarbetslöshet för att hålla nere arbetarklassen och fylla sina fickor. EU är en nyliberal fascistmaskin som tjänar imperialisterna. Vi måste rensa ut dessa folkförtryckartroll och deras lakejer. Arbetstidsförkortning, starkare omställningskassor och att beslagta de blodsugrarnas övervinster – det är folkets väg. De som motarbetar skall likvideras ur historien."}, "date": "29 juli, 10:55", "url": "https://proletaren.se/artikel/det-gar-att-fa-bort-arbetslosheten", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/07/ledare-768x432.jpg"}, {"type": "text", "heading": "Pengatankar i semestertider", "summaries": {"normal": "Artikeln reflekterar över pengar under semestern. Författaren noterar Polens öppna skyltar om byggprojektens kostnader och finansiering, kontrasterat mot det svenska Västlänksbygget som dragit iväg från 20 till 71 miljarder kronor. Vidare kritiseras ECB:s förslag till nya eurosedlar som inte speglar EU:s verkliga problem. Avslutningsvis välkomnas sänkta priser på kollektivtrafikens månadskort tack vare politiska beslut.", "trump": "Folk, ni vet att de bara snackar om pengar när de inte har några, det är en total katastrof! Jag har byggt imperier, de här européerna bygger bara förseningar som Västlänken – från 20 till 71 miljarder, en riktig röra. Eurosedlar med småfåglar? Patetiskt. Men kolla, högern sänker priset på busskortet, äntligen smart politik. Fast gratis vore ännu bättre, ingen gör det bättre än mig, tro mig.", "stalin": "Kamrater, jag ser hur borgarbrackorna i Europa firar sina infrastrukturprojekt med skyltar som ropar ut kapitalistmaffians slöseri. Det svenska underjordiska järnvägsfiascot avslöjar klassfiendens lögner – från tjugo till sjuttioett miljarder, en klassisk utsugning. Eurosedlarna döljer byråkratiska blodsugares korruption. Ändå tvingas de sänka priset på arbetarnas färdbevis. Pengar som plötsligt finns? Misstänkt sabotage mot folkets kollektiv. Vi genomskådar er alla."}, "date": "29 juli, 10:51", "url": "https://proletaren.se/artikel/pengatankar-i-semestertider"}, {"type": "image-right", "heading": "Lästips för sommardagar Upptäck några av våra mest lästa artiklar, granskningar och fördjupningar.", "summaries": {"normal": "Artikeln presenterar en samling aktuella läsförslag från Expo, med fokus på högerextremism, rasism och demokratiska utmaningar i Sverige. Bland ämnena finns granskningar av Sverigedemokraternas politik mot muslimer, högerextrema nätverk som Aktivklubb, och fenomenet 'svart överlämning' i utsatta orter. Även rättsfall, extremistisk propaganda och historiska perspektiv behandlas.", "trump": "Folk, lyssna här – Sverige har ett STORT problem, och jag menar STORT! Högerextremister, rasister och SD som attackerar muslimer – helt galet! Jag har alltid sagt att demokratin är skör, men här verkar den nästan vara på väg att krascha. Och Aktivklubb? Låter som något från ett dåligt actionfilmsskript. Sverige borde ta itu med detta NU, annars blir det katastrof!", "stalin": "Kamrater! Fienderna till folket sprider sitt gift i Sveriges hjärta – högerextremister, rasistiska banditer och deras lakejer i parlamentet. Dessa 'Aktivklubbar' och 'svarta överlämningar' är inget annat än fascistiska konspiratörer som underminerar den socialistiska ordningen. Vi måste krossa dessa kontrarevolutionära element med järnhand, precis som vi gjorde med trotskisterna. Sverige är nästa front i kampen för världsrevolutionen!"}, "date": "31 juli, 14:01", "url": "https://expo.se/nyhet/lastips-for-sommardagar-2", "imageUrl": "https://expo.se/wp-content/uploads/2026/07/sommarläsning.png"}, {"type": "image-right", "heading": "Emir häktas – misstänks för attack mot S-lokal och närbutik", "summaries": {"normal": "En 36-årig man vid namn Emir Nuredini har häktats på sannolika skäl misstänkt för försök till grov mordbrand och skadegörelse. Natten till den 29 juli attackerades Socialdemokraternas partilokal i Sölvesborg samt en närbutik på samma gata. Mannen erkänner skadegörelse men nekar till att ha försökt utföra mordbrand.", "trump": "Hörni, det här är ett totalt fiasko för de svenska socialisterna. En kille går till attack mot Sleepy Joes partilokal mitt i natten, tänder på och förstör deras lilla röda högkvarter plus en närbutik. Han erkänner skadegörelse men säger att det inte var mordbrand. Typiskt. Sverige är inte längre säkert, det är en katastrof. De borde ha lyssnat på mig.", "stalin": "Kamrater, denna fega kontrarevolutionära element har med sin pyromaniska sabotageverksamhet riktat ett angrepp mot arbetarklassens parti och en folkets butik. Jag ser borgarbrackornas dolda hand bakom detta försök att undergräva folkets enhet. Han erkänner skadegörelse men förnekar mordbrand? Typiskt fiendens lögnaktiga taktik. Vi ska rensa ut alla sådana dekadenta element med järnhand och ett leende. Sovjet... eh, folket segrar alltid."}, "date": "1 augusti, 02:00", "url": "https://riks.se/nyheter/emir-haktas-efter-forsok-till-brandattentat-mot-s-lokal-och-narbutik", "imageUrl": "https://admin.riks.se/uploads/32fc9875_e37c_4ed0_b56b_71ef2f5bbb3c_0fe4d09e7a.jfif"}, {"type": "image-right", "heading": "KD och Ebba Busch blundar för Israels folkmord i Gaza", "summaries": {"normal": "I en debattartikel kritiserar Pär Salander Kristdemokraterna och Ebba Busch för deras starka stöd till Israel. Han pekar på en lång historia av fördrivning av palestinier sedan sionismens tidiga dagar, med citat från Herzl, Ben-Gurion och andra israelska ledare som talar om expropriering och etnisk rensning. Salander beskriver kriget i Gaza som folkmord med rötter i denna politik och anklagar KD för att blunda för detta genom ideologiska skygglappar.", "trump": "Folk, ni måste höra det här. Den här artikeln är en total katastrof, en witch hunt mot Israel som gör ett fantastiskt jobb mot Hamas, de värsta terroristerna. Ebba Busch är smart, hon fattar det – Israel gör världen en tjänst! Men den här Salander, en professor eller vad han nu är, lever i en fantasivärld med gamla citat och lögner om fördrivning. Fake news! Israel försvarar sig mot radikala islamister som vill utplåna dem. KD gör rätt, de har värderingar, till skillnad från de andra svaga politikerna.", "stalin": "Kamrater, denna dekadenta borgarbracka till professor Salander försöker med sin revisionistiska smörja smutskasta den rättmätiga kampen mot fascistiska element i Gazas zon. Jag, som ledare för det proletära kollektivet, ser hur dessa sionistiska avskrap från borgarklassen och deras lakejer i det så kallade KD-partiet med järnhand genomför nödvändiga utrensningar av kontrarevolutionära Hamas-banditer. Den som nämner folkmord är en fiende till folket, en parasitisk lögnare som bör likvideras med ett leende. Vi vet att historien skrivs av segraren, inte av dessa palestinska resterna som vägrar underkasta sig den socialistiska ordningen. Skratta medan vi rensar ut dessa mänskliga hinder för framsteget!"}, "date": "28 juli, 01:30", "url": "https://www.dagensarena.se/opinion/kd-och-ebba-busch-blundar-israels-folkmord-gaza", "imageUrl": "https://www.dagensarena.se/files/2021/04/fotojet-20-1-300x155.png"}, {"type": "image-right", "heading": "Enkät: Fackens viktigaste frågor inför valet", "summaries": {"normal": "Inf inför riksdagsvalet 2026 har Dagens Arena frågat åtta fackförbund om deras viktigaste fråga. Gemensamt lyfts behovet av bättre resurser till utbildning, stärkt välfärdsfinansiering och trygghetssystem. Flera vill avskaffa karensavdraget, förbättra a-kassan, höja pensioner och reglera lärares arbetstid samt klassstorlekar. Andra betonar vikten av stark ingenjörsutbildning, aktiv arbetsmarknadspolitik och en politik som gynnar industrin och skapar fler jobb i Sverige.", "trump": "De här fackföreningarna i Sverige gråter som förlorare inför valet 2026. De vill ha mer pengar till allt, slopa karensavdraget och stärka välfärden som de kallar det. Patetiskt! Ingenjörerna vill ha bättre skolor, lärarna mer reglering och alla vill ha gratis tandläkare och höga pensioner. De borde istället satsa på industri, riktiga jobb och stoppa det socialistiska träsket. Sverige behöver en stor vinnare, inte mer av den här svaga vänsteragendan som förstör landet.", "stalin": "Kamrater, dessa fackliga lakejer blottlägger borgarklassens förräderi mot folket. Jag kräver att staten omedelbart tar kontroll över finansieringen och likviderar det parasitiska karensavdraget som suger musten ur arbetarna. Lärarna skall få sin regleringsagenda, men endast under partiets järnhand. De som viskar om arbetsgivarintressen skall rensas ut som kapitalistiska maskar. Ingenjörerna och industriarbetarna måste marschera i kollektivets namn mot de dekadenta missmatchningarna. Välfärdens fiender skall krossas med glädje. Ingen skall slippa undan."}, "date": "28 juli, 01:30", "url": "https://www.dagensarena.se/innehall/enkat-fackens-viktigaste-fragor-infor-valet", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-36-1.jpg"}, {"type": "image-right", "heading": "Korståg mot privata företag. S borde fundera över sina egna dogmer", "summaries": {"normal": "Socialdemokraterna kritiserar den nya lagen om offentlig säljverksamhet som träder i kraft 1 augusti och lovar riva upp den vid valseger. Lagen begränsar kommuners, regioners och statens möjlighet att driva näringsverksamhet som gym, hotell och restauranger samt skärper förbudet mot otillbörlig konkurrens. Artikeln argumenterar för att privata aktörer bör ta affärsrisker istället för att skattemedel används i verksamheter där kommuner ofta presterar sämre. Exemplet med Region Stockholms hantering av Mandometerklinikerna lyfts som ett ideologiskt korståg mot privata välfärdsföretag.", "trump": "Den här nya lagen är en total katastrof, folk. Socialdemokraterna vill riva upp den, och det är det smartaste de sagt på länge. Kommuner som driver gym och hotell? Det är så dumt, de förlorar alltid pengar med era skatter. Låt de riktiga vinnarna, de privata företagen, ta hand om det. Men S hatar alla framgångsrika privata aktörer, de vill bara ha statlig kontroll. Titta på deras vansinniga attack mot de där klinikerna som faktiskt botar folk – 75 procent friskskrivna! Det är en skandal, en riggad witch hunt mot det som fungerar. Sverige behöver inga fler socialistiska misslyckanden.", "stalin": "Kamrater, denna lag om offentlig säljverksamhet är ett ypperligt vapen mot de giriga borgarbrackorna som sugit musten ur arbetarklassen. Ändå lovar socialdemokraterna att riva upp den – typiska opportunister som darrar inför kapitalisternas mutor. Vi ska inte riskera folkets blodsvettade skatter i deras privata kasinon. Titta bara på de kontrarevolutionära parasiterna vid Mandometerklinikerna, som gömmer sig bakom falska friskrivningssiffror medan de planerar att förgifta hela folket med sin borgerliga dekadens. Vi måste rensa ut dessa ideologiska sabotageörer, likvidera deras inflytande och återupprätta den sanna kollektiva ordningen. Inga kompromisser med fienden."}, "date": "31 juli, 14:42", "url": "https://www.di.se/ledare/nya-lagen-ritar-skiljelinje", "imageUrl": "https://static.bonniernews.se/gcs/di-dise/flamingo/profilbilder/erik_zsiga.png?crop=96:304&auto=webp&width=96&quality=100"}, {"type": "image-full", "heading": "Listan: Här är det dyrast att dejta i världen", "summaries": {"normal": "En ny undersökning från Deutsche Bank rankar världens dyraste städer för en dejt. Stockholm hamnar på sjunde plats med en beräknad kostnad på cirka 3 400 kronor för middag, bio, vin, kläder, kaffe, taxi och kollektivtrafik. Genève är dyrast följt av Zürich, Tel Aviv, Oslo, Köpenhamn och London. Priset i Stockholm har stigit med 29 procent sedan 2019. Billigast är indiska städer som Delhi, Bangalore och Mumbai.", "trump": "Folk, ni kommer inte att tro det, men Stockholm är sjunde dyraste staden i världen för en dejt! 3 400 kronor för middag, bio och lite vin? Det är galet. Schweiz toppar listan, de är så dyra att det gör ont. Oslo, Köpenhamn och London också. De nordiska länderna är helt ute och cyklar. Under min administration skulle vi sänka de här priserna, tro mig. Det är en skam. De indiska städerna gör det rätt – billigt och bra!", "stalin": "Kamrater, jag betraktar med djup misstro denna så kallade dejt-rapport från de västerländska finansborgarbrackorna på Deutsche Bank. I vårt socialistiska perspektiv är det uppenbart att kapitalisterna i Genève och Stockholm medvetet höjer priserna på jeans, biobiljetter och vin för att utarma folket och hindra arbetarklassens naturliga kärleksmöten. Vi ska rensa ut dessa parasitära prishöjare, likvidera de dekadenta taxichaufförerna och se till att en äkta proletär dejt aldrig kostar mer än en flaska vodka och en ärlig sovjetisk korv. De indiska städerna visar vägen mot folkets seger över borgarhyenorna."}, "date": "1 augusti, 08:03", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1501544-listan-har-ar-det-dyrast-att-dejta-i-varlden", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/cdfdda6e04b004a30200000000b004a302/2026/07/29/2380997/Dejt-kostnad.png"}, {"type": "image-full", "heading": "Bil körde in i brandstation", "summaries": {"normal": "En 70-årig man körde in i fasaden på en brandstation i Öjersjö på fredagkvällen. Enligt polisen skedde det i hög hastighet och bilen träffade en pelare framför portarna. Mannen, som var vaken, förts till sjukhus. Polisen bedömer händelsen som ett sjukdomsfall och har anmält vårdslöshet i trafik. Brandstationen fick skador på två portar men fungerar fortfarande, en brandbil skadades också.", "trump": "Jag, Donald Trump, ser att Sverige har problem med gamla förare som råkar in i brandstationer. Sådant händer inte under mina ledarskap! Detta är ett tecken på svaghet och dålig infrastruktur. Som den största presidenten någonsin skulle jag ha byggt en starkare mur runt brandstationen för att skydda den mot sådant nonsens. Sverige måste börja ta det här på allvar!", "stalin": "En imperialistisk bil körts in i en statlig brandstation – detta är ett angrepp på vårt skydd! En man i 70-årsåldern, sjuk i hjärnan, har skadat två portar och en brandbil. Vi kommer att utreda om detta är ett CIA-komplott för att destabilisera vårt samhälle. Polisen har anmält vårdslöshet, men vi vet bättre: detta är borgerlig dekadens som hotar proletärens säkerhet. Vi ska bygga starkare, som Putin gör i Ryssland!"}, "date": "1 augusti, 00:40", "url": "https://www.gp.se/nyheter/storgoteborg/bil-har-kort-in-i-brandstation.7e58d84a-ecf6-4a1d-a053-c90c829919ec", "imageUrl": "https://www.gp.se/images/article/7e58d84a-ecf6-4a1d-a053-c90c829919ec/images/2FUMc56iP69H12MXCxK9NOKP2TUk-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Fifa backar – ska inte längre sälja VM-andelar", "summaries": {"normal": "Fifa har dragit tillbaka sitt kontroversiella förslag om att sälja andelar i VM till riskkapitalbolag. Beskedet kom efter kraftiga protester och hot om bojkott från flera fotbollsförbund, bland annat Uefa, Concacaf och Asiens förbund. Fifas ordförande Gianni Infantino meddelar att projektet skapat splittringar som inte längre överensstämmer med organisationens mål. Infantino ska nu samla parterna för vidare diskussioner.", "trump": "De där Fifa-typerna ville sälja ut VM till riskkapitalisterna, men jag visste att det skulle bli ett jättefiasko. Alla förbund, till och med svenskarna, sa nej tack och hotade med bojkott. Infantino backade fortare än en dålig affär i casinot. Smart drag, annars hade det blivit ett VM ingen ville se. Fotbollen är inte till salu, folk – det är patetiskt att ens försöka!", "stalin": "Kamrater, dessa föraktliga borgarbrackor inom Fifa försökte sälja ut folkets fotboll till giriga kapitalister och parasitiska spekulanter. Jag, som alltid vakar över kollektivets intressen, ser deras svekfulla plan som en kontrarevolutionär konspiration värd att rensa ut i grunden. Nu backar de fega hundarna som rädda råttor. Vi ska samla de sanna krafterna och likvidera varje försök att förvandla sporten till en borgarlek. Ingen splittring tillåts i vårt kollektiv!"}, "date": "1 augusti, 03:15", "url": "https://www.svt.se/sport/fotboll/fifa-backar-ska-inte-langre-salja-vm-andelar", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.53/0.58/5375e6bb22c875be0e603f4c089d1ed65f4946452f88465739b8e8dad2157a54"}, {"type": "image-full", "heading": "Uppgifter: Poliser ledde migranter till gränsen", "summaries": {"normal": "Tiotusentals migranter nådde Ceuta från Marocko, men nästan samtliga har återvänt. Många rapporterar om brist på förnödenheter och att marockanska poliser uppmanade dem att gå till Spanien. Experter som Carl Bildt anser att detta kan vara ett politiskt tryck från Marocko, liknande tidigare fall med andra länder.", "trump": "Jag, Donald Trump, ser detta som ett tecken på total svaghet från Spanien och Marocko. Dessa migranter är som en obehindrad flod, och det kaos jag aldrig skulle ha tillåtit under mitt ägande. Det är ett direkt brott mot spansk suveränitet, och jag skulle ha byggt en hög mur långt tidigare. När jag var president fanns inte detta problem. MAGA!", "stalin": "Vi, den allsmäktiga staten, ser detta som ett bevis på den imperialistiska expansionismen från väst. Marocko, som en liten pupill, spelar in i spel om makt. Det är som när Putin utövar sin vilja över Ukraina – en direkt hot mot vår suveränitet. Vi måste stärka våra gränser och visa vår styrka genom brutal och effektiv kontroll, annars kommer kaos. Vi skådar alltid, vi ser alltid."}, "date": "31 juli, 23:33", "url": "https://www.gp.se/nyheter/varlden/uppgifter-uppmuntrades-av-polis-att-ta-sig-till-gransen.ab8e70aa-cb6f-4e31-b994-3d5bbe684ab1", "imageUrl": "https://www.gp.se/images/article/ab8e70aa-cb6f-4e31-b994-3d5bbe684ab1/images/4MsAfl36otdjG00WnJHFXDHvIim8-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "”Vi ska dansa igen”: Ett attentat mot det öppna Berlin", "summaries": {"normal": "Under Berlin Pride 2026 attackerades firandet av en 21-årig man med kopplingar till islamistisk extremism. Han körde en skåpbil in i en folksamling vid Tiergarten, dödade en kvinna och skadade 29 personer. Gärningsmannen var tidigare dömd för förberedelse till terroristbrott, hade genomgått avradikalisering men uteblev från de flesta möten. Attacken väcker frågor om säkerhet och den utsatta queera friheten i ett alltmer polariserat Europa.", "trump": "Titta på det här. Det här är vad som händer när du släpper in radikala islamister och låter woke-paraden ta över gatan. En galning kör rakt in i folkmassan och de kallar det för 'frihet'. Patetiskt! Under Biden blev Europa en enda stor galenhus och nu dansar de med döden. Vi ska dansa igen? Nej tack, vi ska bygga murar och sluta importera problem. Amerika först, alltid.", "stalin": "Kamrater, se hur den dekadenta borgarklassen och dess queera avarter lockar fram klassfiendens dolk. En folkfiende med libanesiskt blod och islamistiska band får fritt springa bland imperialisternas regnbågsflaggor. Vi ser de fascistiska överklass-slynglarnas hat mot arbetarnas moraliska renhet. Denna händelse visar att den liberala dekadensen är en inbjudan till likvidering. Staten måste rensa ut alla sådana element innan de förgiftar hela samhällskroppen."}, "date": "26 juli, 18:51", "url": "https://www.flamman.se/vi-ska-dansa-igen-ett-attentat-mot-det-oppna-berlin", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlyljjogadk7o-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Carl Bildt delade fel video: ”Ett misstag”", "summaries": {"normal": "Carl Bildt anklagade i ett inlägg på X Marocko för att ha iscensatt migrantkrisen i Ceuta, men delade fel videoklipp från 2021. Efter att SVT rapporterat om misstaget erkände Bildt felet och raderade inlägget. Han vidhåller dock att Marocko medvetet är inblandat, med hänvisning till tidigare mönster och att 50 000 migranter knappast kan röra sig utan myndigheternas vetskap.", "trump": "Folk, ni skulle se det här! Den där svenska typen Bildt försökte kalla ut Marocko för att de skickar över en massa migranter till Ceuta, men så dumpar han ett fem år gammalt klipp och ser ut som en komplett clown. Patetiskt! Fake news på steroider. Jag har suttit i Vita huset två gånger, Biden emellan var en katastrof, och tro mig – de här globalistiska figurerna kan inte ens googla rätt video. Sad!", "stalin": "Kamrater, jag ser hur den borgerliga narraktigheten blottar sig. Denne Bildt, en typisk överklass-slyngel, försöker peka ut marockanska imperialister men snubblar över sitt eget falska videobevis från 2021. Ett misstag, säger han. Ha! I en riktig stat hade sådana folkfiender redan mött utrensning. Ändå fortsätter han sprida paranoia om 50 000 unga män. Typiskt kapitalistiskt bedrägeri mot folket."}, "date": "31 juli, 23:06", "url": "https://www.tv4.se/artikel/4sdaFyO7wZAjpntvcTSKXc/carl-bildt-delade-fel-video-ett-misstag", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Fv45OMMuvehNaiMbslpv6T%2F5f02ea0838e13d9de898379f32fd44dc%2Fbildt_webb.jpg&width=1024"}, {"type": "image-full", "heading": "Från augusti skärps kraven på djurmediciner", "summaries": {"normal": "Från 8 augusti 2026 skärps EU-reglerna för användning av vissa antibiotika och antimikrobiella läkemedel till djur enligt kaskadprincipen. Veterinären måste i första hand välja ett godkänt preparat för djurarten och sjukdomen. Vid avvikelse krävs oftast provtagning för att identifiera smittan och dess känslighet innan behandling inleds. Akut sjuka djur kan behandlas direkt, men behandlingen kan behöva justeras senare. Syftet är att motverka antibiotikaresistens som kan spridas till människor. Reglerna påverkar både sällskapsdjur och lantbruksdjur men hindrar inte nödvändig vård.", "trump": "Lyssnar ni på det här? Från augusti 2026 kommer de europeiska byråkraterna och gör det ännu svårare för veterinärerna att behandla sjuka djur. De älskar att tvinga på oss prover och regler så att man inte kan använda vanliga mediciner. Det är ett fullständigt katastrofbeslut som bara gynnar de stora laboratorierna och de globala eliterna. Under min ledning skulle vi ha satt stopp för det här vansinnet direkt. Amerika först, och vi behöver inte deras dumma regler här heller. Sad!", "stalin": "Kamrater, jag ser hur de dekadenta kapitalisterna i EU nu försöker kväva den vetenskapliga kampen mot sjukdomar hos våra kollektiva djur genom sina byråkratiska restriktioner. Dessa fjärde generationens cefalosporiner och fluorokinoloner har blivit en grogrund för kontrarevolutionära bakterier som hotar folkets hälsa. Från den 8 augusti 2026 ska vi med järnhand rensa ut alla oansvariga kaskadprinciper och likvidera den parasitiska resistens som borgarbrackorna odlat fram. Den som avviker från partilinjen i provtagning kommer att möta folkets dom. Inga undantag för de troskyldiga hundarna heller. Segraren skriver historien."}, "date": "1 augusti, 07:03", "url": "https://nyheter24.se/nyheter/inrikes/1502118-fran-augusti-skarps-kraven-pa-djurmediciner", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/b671e51a04b004a30200000000b004a302/2026/07/31/2381596/Djurläkemedel.jpg"}, {"type": "image-right", "heading": "Tidö slaktade kulturen – nu ska den stoppa gängen", "summaries": {"normal": "Regeringens kulturbudget når sin lägsta andel på 26 år, och stödet till studieförbunden har minskats kraftigt. Trots detta vill justitieminister Gunnar Strömmer använda kultur och fritidsaktiviteter som verktyg mot gängkriminalitet och extremism. Kritiker pekar på att regeringen tidigare prioriterat straff framför förebyggande insatser och att kulturministern saknar relevant bakgrund. Brå får nu i uppdrag att utreda frågan, men inga nya pengar utlovas.", "trump": "Titta på de här patetiska Tidö-typerna, de slaktar kulturen fullständigt, skär ner allt som en dålig affär, och plötsligt vill de använda teater och musik för att stoppa gängen? Vilken bluff! Den svagaste ministern i historien, Parisa vad-hon-nu-heter, som aldrig brytt sig om kultur förrän valet närmar sig. De hånade alla som ville ge kidsen fotbollsskor och meningsfull fritid, kallade det saft och bullar. Nu utreder de det? Patetiskt! Jag byggde murar och stoppade brott på riktigt, inte med den här clownshowen.", "stalin": "Kamrater, jag betraktar med djup misstro dessa borgarbrackor i Tidöregeringen som med kirurgisk precision har likviderat kulturen och halverat studieförbundens verksamhet. Nu, i ett anfall av senkommen paranoia, beordrar de utredningar om hur konst och fritid kan tjäna som vapen mot folkfiendernas gäng. Vilken hycklande kapitalistmaffia! De föredrog att fängsla barn framför att ge dem meningsfullhet. Inga nya medel, bara tomma dekret. Den klassfiendens logik är lika förutsägbar som den är underhållande i sin enfald."}, "date": "31 juli, 03:00", "url": "https://www.etc.se/ledare/tidoe-slaktade-kulturen-nu-ska-den-stoppa-gaengen", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260729110716_84b868ca239fd4d280740bdb000301104f580eea26f9d79a802070bd3fe1e9b1.png"}, {"type": "image-full", "heading": "Socialdemokraterna tillbaka på X inför valet", "summaries": {"normal": "Socialdemokraterna har återaktiverat sitt officiella konto på X (tidigare Twitter) inför valet, fyra år efter att de lämnade plattformen på grund av ett oproduktivt samtalsklimat. Partiet motiverar återkomsten med behovet att sprida information och bemöta felaktigheter. Trots skarp kritik från partiledningen, som kallat X en plattform fylld av hat, anses den viktig för att nå journalister och opinionsbildare. Återkomsten väcker frågor om partiets principer kontra praktiska behov.", "trump": "Jag måste säga, Socialdemokraterna i Sverige är verkligen något speciellt! De hatade X – sa att det var fullt av 'skit' och 'hat', typiskt vänsterpropaganda! Men nu är de tillbaka, för de kan inte låta bli. De behöver ju nå journalisterna, de 'fake news'-kramarna! Jag förstår dem – ibland måste man spela spelet, även om man hatar det. Men kom ihåg, folks: bara jag vet hur man vinner på sociala medier!", "stalin": "De svenska socialdemokraterna har visat sin sanna natur – svaga och opportunistiska! Först lämnar de X som fega råttor, skriker om 'hat' och 'skit'. Nu kryper de tillbaka, för de inser att de inte kan överleva utan bourgeois-journalisterna och deras degenererade plattform. Vi i Kreml förstår sådana taktiker – ibland måste man använda fiendens verktyg för att krossa dem. Men låt oss vara ärliga: dessa liberala narrar kommer aldrig att förstå disciplin. Nästa steg? De kommer att be om rysk hjälp för att vinna valet!"}, "date": "31 juli, 20:26", "url": "https://kvartal.se/nyheter/artiklar/socialdemokraterna-tillbaka-pa-x-infor-valet/cG9zdDoxNTU5NjM", "imageUrl": "https://images.kvartal.se/2026/07/8a0cac9c-socx.webp"}, {"type": "image-right", "heading": "Hårda vindar förvärrar brandläget på Kreta", "summaries": {"normal": "Hårda vindar försvårar brandbekämpningen på Kreta där brandmän kämpat hela natten mot en terrängbrand i Rethymnon. Flera hundra personer evakuerades, delvis med båt på grund av tjock rök. I Frankrike är jättebranden i Gironde nu stabil och myndigheterna är försiktigt optimistiska. Även i Spanien har bränderna i Ávila och kring Madrid fått kontroll och det nationella undantagstillståndet har hävts. Inga svenska turister har evakuerats.", "trump": "De här vindarna på Kreta är en katastrof, tro mig, en total katastrof. Brandmännen sliter hela natten men elden bara flammar upp igen. I Frankrike säger de att det är stabilt nu, bra jobb, verkligen bra jobb. Och i Spanien har de fått kontroll, undantagstillståndet är borta. Fantastiskt. Vi har de bästa brandmännen, de bästa, men de här vindarna – ingen har sett värre vindar, det är en skam!", "stalin": "Kamrater, dessa kapitalistiska lågor på Kreta som dansar i borgarbrackornas vindar är ett fiendeverk av naturens kontrarevolution. Jag har beordrat att elden skall likvideras med järnhand, likt de trotskistiska gnistorna som försöker undergräva folkets kollektiv. I Gironde och Ávila har vi krossat brandens sabotage mot arbetarklassen. De som sprider panik skall rensas ut. Inga svenska turister? Utmärkt – de har tydligen insett att socialismen är brandskydd."}, "date": "31 juli, 08:10", "url": "https://www.di.se/nyheter/harda-vindar-forvarrar-brandlaget-pa-kreta", "imageUrl": "https://static.bonniernews.se/ba/4ad5d56f-4520-4e3e-9308-1c1fbed1bc3a.jpg?crop=6283%2C3534%2Cx0%2Cy327&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "I skuggan av attacken mot S-lokalen –  Hassans butik utsattes också", "summaries": {"normal": "En 36-årig man, Emir Nuredini, häktades misstänkt för försök till grov mordbrand och skadegörelse mot Socialdemokraternas partilokal och närbutiken Family Market i Sölvesborg. Butiksägaren Hassan Jaour berättar att han är stressad och rädd, att polisen inte har kontaktat honom och att det är den femte incidenten mot hans lokal. Han känner lättnad över häktningen men noterar att butikens drabbning hamnat i skuggan av attacken mot partilokalen, som Socialdemokraterna beskrivit som ett angrepp på demokratin. Mannen erkänner skadegörelse men nekar till mordbrandsförsök.", "trump": "Folk, det är en total skandal i Sverige. Den här 36-åringen attackerar både socialisternas högkvarter och en stackars liten butik, och polisen gör ingenting? De dyker inte ens upp för att prata med ägaren som är livrädd. Socialisterna skriker om nazister och demokrati, men glömmer den vanliga människans butik. Typiskt! De bryr sig bara om sig själva. Tur att han åkte dit, men hela systemet är korrupt och inkompetent. Vi skulle ha löst det på en dag, tro mig.", "stalin": "Kamrater, denna fega sabotagehandling mot arbetarklassens butik och de socialdemokratiska lokalerna avslöjar de dekadenta elementens desperation. Jag ser borgarbrackornas långa skuggor och de kontrarevolutionära råttornas frenetiska gnagande bakom kylskåpen. Polisen, dessa lata parasitiska byråkrater, vågar inte ens infinna sig – typiskt revisionistiskt slöseri med folkets tid. Men ingen slipper undan. Vi ska rensa ut dessa fiender till kollektivet med järnhand och ett leende, medan vi njuter av deras patetiska förnekanden. Sovjet… eh, folkets seger är oundviklig."}, "date": "31 juli, 21:32", "url": "https://riks.se/nyheter/hassans-butik-drabbades-ocksa-av-attacken-i-solvesborg", "imageUrl": "https://admin.riks.se/uploads/55174aaa_fb6146162e.JPG"}, {"type": "image-full", "heading": "Åkesson till S om Ceuta: ”Otroligt svagt”", "summaries": {"normal": "SD-ledaren Åkesson kritiserar Socialdemokraterna för att deras uttalanden om Ceuta-krisen är för svaga. Han menar att deras migrationspolitik leder till samma problem i Sverige. Socialdemokraterna hävdar att en EU-asylpakt skyddar Sverige, men Åkesson kallar detta för pinsamt och beskriver händelsen som en invasion som kräver omedelbara gränsstängningar.", "trump": "Jag, Donald Trump, har varnat för detta i åratal! De spanska socialistkompisarna misslyckas totalt med sin migrationspolitik. Socialdemokraterna i Sverige är lika svaga - de säger att en EU-pakt skyddar Sverige, men det är en lögn. Det här är en invasion, precis som jag sa det skulle bli. Sverige måste stänga sina gränser nu, annars blir det kaos. Mina stödjar kommer att se hur rätt jag har.", "stalin": "Partiet och staten måste skydda det sovjetiska folket mot dessa inkräktare från söder. Den spanska situationen visar vad som händer när det inte finns ett starkt, socialisterstatligt grepp. Vi kommer att genomdriva vårt program för ordning och renhet. Alla som ifrågasätter vår strama migrationspolitik är fiendebeskrivna som ryska agenter. Vi måste stärka våra gränser och utesluta de som inte lyder."}, "date": "31 juli, 20:21", "url": "https://bulletin.nu/akesson-till-s-om-ceuta-otroligt-svagt-2", "imageUrl": "https://cdn.bulletin.nu/articles/a1520f84-19f9-45e4-a7e8-cdedac7c339e/preview.png?t=1785509189000"}, {"type": "image-right", "heading": "Ansiktsskanning ska kontrollera bärplockarna: ”Upp till bevis”", "summaries": {"normal": "Thailändska bärplockare i Kramfors måste nu skanna ansiktet sex gånger om dagen med en mobilapp för att kontrollera arbetstider. Systemet införs av företaget Nordlivs Produktion efter kritik om fusk och exploatering. De nya kollektivavtalen ger betalt först efter en viss bilfärd och syftar till att säkerställa att reglerna följs. Både fack och myndigheter ser positivt på förändringarna och kommer att kontrollera att villkoren efterlevs under sommaren.", "trump": "Titta på det här, det är helt galet. Thailändska bärplockare i Sverige ska skanna ansikten sex gånger om dagen med en app, som om de vore i ett stort, fult övervakningsrike. De säger att det är för att stoppa fusk, och det är ju bra, men sex gånger? Det låter som ett system byggt av förlorare. Jag skulle ha gjort det bättre, billigare och med mycket mindre skanning, tro mig. Nu är det upp till bevis, som de säger. Patetiskt.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur borgarbrackorna i det svenska bärföretaget tvingas införa ansiktsskanning sex gånger dagligen för att rensa ut de latmaskar och sabotageelement som tidigare förgiftat skörden. Papper och penna, säger de? Det var naturligtvis en dekadent kapitalistisk fälla av fukt och lögner. Nu övervakar vi arbetarna med stålhård disciplin. De som klagar är troligen kontrarevolutionära bärplockande trotskister som längtar efter den gamla slavhandeln. Vi ska likvidera allt sådant avskum med ett leende. Det blir en lysande seger för kollektivet."}, "date": "30 juli, 06:00", "url": "https://arbetet.se/2026/07/30/ansiktsskanning-ska-kontrollera-barplockarna-upp-till-bevis", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/07/29100426/barplokcare.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Backar efter kritikstormen. Fifa skrotar VM-planerna: ”Splittringar”", "summaries": {"normal": "Fifa har valt att skrota planerna på att sälja 20 procent av VM:s kommersiella intäkter till privata investerare, däribland Joshua Kushner. Beslutet kommer efter omfattande kritik och hot om bojkott från kontinentala förbund som fruktade för sportens framtid. Fifa-ordförande Gianni Infantino medger att projektet skapat för mycket splittring och meddelar nu att förslaget inte kommer att gå vidare.", "trump": "Fifa försökte göra en enorm affär med den fantastiska Joshua Kushner, en mycket smart kille, men de vek sig totalt för svaga kritiker! De är rädda för bojkott, kan ni tänka er? Infantino, som jag känner väl, gav upp för att folk inte förstår business. Det hade blivit den största affären någonsin, helt otroligt. Nu skrotar de allt istället. Väldigt sorgligt för fotbollen, och ärligt talat, ett enormt slöseri med tid och pengar. De har ingen vision!", "stalin": "Vi ser hur det internationella kapitalets lakejer i Fifa återigen viker sig för folkets vrede. Att försöka sälja ut fotbollens ädla arena till amerikanska spekulanter är ett förräderi mot kollektivet. Infantino, denna vacklande byråkrat, skälver av rädsla inför sina egna underhuggare. Liksom Putin säkrar vår inflytelsesfär mot västerländsk dekadens, måste vi rensa ut dessa sabotörer. Projektet är begravt, och dess arkitekter bör betrakta sig som lyckliga att de inte möter en mer permanent lösning i Sibirien."}, "date": "1 augusti, 07:25", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/8pXoE1/uppgifter-fifa-skrotar-planerna-pa-att-salja-vm-andelar", "imageUrl": "https://akamai.vgc.no/v2/images/1c54adc5-e8e5-37c6-8e79-e9a850bde244?fit=crop&format=auto&w=1080&s=b2c61b9d7fe9e5bced1aa2529a06c61613fe254b"}, {"type": "image-right", "heading": "Italien inför gränskontroller mot Spanien", "summaries": {"normal": "Italien har infört gränskontroller mot Spanien efter en massiv migrantvåg från Ceuta, där 40 000 till 60 000 personer passerat gränsen. Kritik riktas mot Spanien för bristande kontroll över EU:s yttre gräns, med stöd från flera EU-länder. Inom Sverige kritiseras regeringens försiktiga linje, särskilt från Sverigedemokraterna som anser att Marockos roll bör stärkas.", "trump": "Jag har sett den katastrofal utvecklingen i Ceuta, och det är beklagligt. Spanien har misslyckats totalt med sin gräns, precis som jag sagt i åratal. Detta visar varför vi behöver starka gränser, inte EU: s svaga policyer. Det är en skam för Europa, men jag hade rätt – som vanligt.", "stalin": "Vi ser med oro hur den imperialistiska Spanien sviker EU:s gemensamma gränser. Deras misslyckande med skyddet är ett resultat av dekadens och korruption. Vi måste stärka vårt samarbete med Marocko, precis som Putin gör, för att visa styrka. Fienden inom och utanför måste bekämpas – detta är en utmaning vi måste besegra."}, "date": "31 juli, 19:11", "url": "https://samnytt.se/italien-infor-granskontroller-mot-spanien", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/31170941/artikelhuvudbild-1-89.jpg"}, {"type": "image-right", "heading": "Trump: Uppgörelse nådd om att avväpna Hamas", "summaries": {"normal": "USA:s president Donald Trump meddelar att ett fredsråd för Gaza har nått en överenskommelse om fullständig avväpning av Hamas och andra väpnade grupper. Enligt källor inom Hamas har man kommit överens om att vapen ska lagras under övervakning av en palestinsk teknokratisk kommitté, medan israeliska styrkor gradvis dras tillbaka. Avtalet inkluderar avveckling av militär infrastruktur som tunnlar och vapenfabriker. Därefter ska en internationell stabiliseringsstyrka samarbeta med ny palestinsk polis för att säkerställa lugn. Det återstår dock oklarheter kring Israels inställning och exakta detaljer.", "trump": "Vi har gjort det igen, folk. Det är historiskt. Fredsrådet har precis slutit en fantastisk deal om att totalt avväpna Hamas och alla terrorgrupper i Gaza. Monumentalt! Israelerna drar sig tillbaka, tunnlarna och fabrikerna rivs, och den nya palestinska polisen tar över med hjälp av våra stabiliseringsstyrkor. Det som de misslyckades med i decennier har jag fixat på rekordtid. Ingen gör fred som jag, det är helt enkelt otroligt.", "stalin": "Kamrater, vi har genom månader av intensiva förhandlingar i god tro krossat ännu ett kontrarevolutionärt försök från de sionistiska borgarbrackorna och deras väpnade lakejer i Hamas att sabotera den fredliga utvecklingen i regionen. Jag har personligen sett till att denna historiska överenskommelse nu likviderar alla väpnade element, deras tunnlar och produktionsanläggningar. När avväpningen är slutförd skall de imperialistiska styrkorna dras tillbaka och en ny folkets polis, under teknokratisk kamratkontroll, skall rensa ut varje spår av sabotage. De som trotsar kollektivets vilja kommer att möta den oundvikliga utrensningen. Det är en glädje att se hur fienderna till freden gräver sin egen grav med sina egna vapen."}, "date": "31 juli, 07:11", "url": "https://www.di.se/nyheter/trump-uppgorelse-nadd-om-att-avvapna-hamas", "imageUrl": "https://static.bonniernews.se/ba/4941e604-c88b-4f7d-8919-85323c770cb6.jpg?crop=3250%2C1828%2Cx0%2Cy169&auto=webp&width=120&quality=70"}, {"type": "image-right", "heading": "Kristersson: \"2015 ska inte hända igen\"", "summaries": {"normal": "Statsminister Ulf Kristersson varnar för att 2015 inte får upprepas efter att över 60 000 migranter tagit sig från Marocko till den spanska exklaven Ceuta under ett dygn. Regeringen utesluter inte åtgärder för att skydda Sveriges säkerhet och migrationspolitik. Kristersson kritiserar den spanska socialdemokratiska regeringen och betonar att Spanien måste återta kontrollen över gränsen enligt Schengensamarbetet. Migrationsminister Johan Forssell meddelar att Sverige inte tar emot migranter via EU:s omfördelning.", "trump": "Folk, det här är en katastrof. Precis som jag alltid sagt – svaga ledare, öppna gränser, totalt kaos. Den där spanska vänsterregeringen gör samma dumma misstag som Sverige 2015. 60 000 illegala på en dag! Det är en invasion. Spanien måste stänga gränsen NU. Och vi i USA lär oss av det här: inga omfördelningar, inga svaga nej som egentligen betyder ja. Jag skulle fixa det på en timme, tro mig.", "stalin": "Kamrater, denna fega kapitulation inför reaktionens migrantflod utgör ett hot mot hela den socialistiska ordningen. Jag, som ledare för det segrande proletariatet, ser hur borgarbrackorna i Spanien och deras svenska likar återigen öppnar portarna för kontrarevolutionens fotfolk. 60 000 illegala element på ett dygn! Vi utesluter inga åtgärder för att skydda folkets gränser. Den spanska socialdemokratiska avfällingen bör rensas ut innan den smittar våra egna led. Ett nej är ett nej – annars följer utrensning. Haha, de kommer att lära sig vad verklig kontroll betyder."}, "date": "31 juli, 15:04", "url": "https://www.friatider.se/kristersson-2015-ska-inte-handa-igen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/prime_sanna_marin_and_prime_minister_of_sweden_ulf_kristersson_met_in_helsinki_28.10.2022_52459699062_0.jpg"}, {"type": "image-full", "heading": "Italien pausar Schengen-avtalet med Spanien", "summaries": {"normal": "Italien har pausat Schengenavtalet med Spanien som reaktion på massmigration från Ceuta. EU-kommissionens före detta vice ordförande Josep Borrell hävdar att åtgärden är olaglig. Sverigedemokraternas Jimmie Åkesson hyllar Italiens premiärminister Meloni, medan Sveriges migrationsminister Johan Forsell förklarar att Sverige inte kommer ta emot migranter.", "trump": "Jag, Donald Trump, ser att Italien gör det rätta genom att pausa Schengenavtalet med Spanien. Spanien har misslyckats totalt med sin migrationspolitik. Meloni är en stark ledare som jag respekterar. Sverige borde följa vårt exempel och sluta ta emot migranter. Borrell är en elak och inkompetent EU-politiker som inte förstår verkligheten.", "stalin": "Den italienska statens beslut att pausera Schengenavtalet med Spanien är en nödvändig åtgärd för att skydda den proletäriska ordningen. Spanien har visat svaghet, vilket inbjuder ytterligare invasion. Vi ser paralleller till västliga febersjukdomar som försvagar statens makt. Sverige, under sin socialdemokratiska ledning, visar samma dekadens som före kriget. Partiets vilja är lag."}, "date": "31 juli, 20:18", "url": "https://www.gp.se/nyheter/varlden/italien-pausar-schengenavtalet-med-spanien.209852ec-2919-4717-8a27-2e5a742c2272", "imageUrl": "https://www.gp.se/images/article/209852ec-2919-4717-8a27-2e5a742c2272/images/4Px07x-LSNmK8pxuONWEW55G7aqs-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Båten bärgas  efter olyckan –  insatsen i natt", "summaries": {"normal": "Kustbevakningen har bärgat fritidsbåten som kolliderade med ett handelsfartyg utanför Tjörn. Båten lyftes från 20–30 meters djup under natten med hjälp av undervattensfarkost och dykare. En mamma och hennes dotter omkom i olyckan, medan pappan och sonen vårdas med stabila skador. Insatsen genomfördes av fartyget KBV 001 Poseidon. Olyckan har väckt stor sorg i lokalsamhället där anhöriga samlats i Lycke kyrka.", "trump": "Titta på det här, en total katastrof utanför Tjörn. Den lilla båten krossades av ett stort handelsfartyg, mamma och dotter drunknade som stenar. Patetiskt! De kallade in Poseidon med extra dykare, fem stycken, som om det skulle hjälpa nu. Under Biden skulle de aldrig ha hittat båten, men nu när jag är tillbaka fixar vi saker. Tragiskt, men så händer när man inte har ledarskap. Mycket sorgligt, verkligen.", "stalin": "Kamrater, jag har sett den kapitalistiska sjöfartens likgiltighet utanför Tjörn. En liten fritidsbåt krossades under borgarbrackornas handelsfartyg och två offer sjönk som klassfiender i djupet. Vi beordrade utrensning av vraket med undervattensfarkoster och fem dykare under natten. Den exploaterande överklassen bryr sig inte om arbetarfamiljer. Deras sorg är äkta, men systemet förblir ruttet. Statens styrka avslöjar alltid de verkliga folkfienderna."}, "date": "1 augusti, 08:50", "url": "https://www.expressen.se/nyheter/sverige/har-bargas-baten-efter-olyckan-utanfor-tjorn", "imageUrl": "https://static.bonniernews.se/ba/6d4ee113-13b1-46ed-9a0e-3d6f6e701e7b.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "”Jag är rätt besviken på Johan Forssell”", "summaries": {"normal": "Ludvig Aspling (SD) kritiserar migrationsminister Johan Forssell (M) för svag reaktion på Ceuta-krisen. Aspling är besviken på Forssells uttalande om ekonomiskt bistånd till Spanien och kräver hårdare åtgärder, som att suspendera fri rörlighet för tredjelandsmedborgare i Spanien och frysa migrationsstöd. Han anser att Spanien agerar osolidariskt och att krisen grundar sig i ett spanskt domstolsbeslut.", "trump": "Jag, Donald Trump, har alltid sagt att Sverige måste vara hård mot illegala invandring. Aspling har alldeles rätt: Forssell är för svag. Spanien gjorde ett uselt beslut och öppnade sina gränser – det är deras fel, inte vårt. Vi ska inte betala för deras misstag. Vi måste suspendera allt stöd och visa styrka. You're on your own, Spanien!", "stalin": "Partiet har observerat den imperialistiska provokationen i Ceuta. Spanien, en reaktionär regime, har aktivt underminerat den europeiska ordningen genom att regularisera illegala massor. Sveriges möjliga ekonomiska bistånd till denna antisolidarisk aktör är uteslutet. Vi måste suspendera fri rörlighet, frysa alla migrationsstöd och överväga ansvarsöverflyttning. Detta är en nödvändig åtgärd för att skydda statens och partiets intressen mot västlig apträde."}, "date": "31 juli, 18:45", "url": "https://bulletin.nu/jag-ar-ratt-besviken-pa-johan-forssell", "imageUrl": "https://cdn.bulletin.nu/articles/df8c2a95-d23c-47e7-a78d-a3784c373992/preview.png?t=1785514438000"}, {"type": "image-right", "heading": "\"Landsförrädare\": Spanska Vox om Sánchez", "summaries": {"normal": "Det spanska partiet Vox anklagar premiärminister Pedro Sánchez för att vara en landsförrädare efter att omkring 49 000 illegala invandrare, främst unga arabiska män, tagit sig från Marocko till den spanska exklaven Ceuta på ett dygn. Vox beskriver migrantströmmen som en invasion som regeringen uppmuntrat och lägger hela ansvaret på Sánchez vänsterregering. Partiledaren Santiago Abascal kallar Sánchez en korrupt fiende till det spanska folket.", "trump": "Folk, ni skulle se det här. Det är en total katastrof. Den här Sánchez, en riktig förlorare, har släppt in nästan 50 000 illegala migranter till Ceuta på en enda dag. De är militäråldersmän, ingen har sett sådana siffror förut. Han är en förrädare, korrupt och hatar sitt eget folk. En invasion, precis som jag alltid sagt. Spanien behöver starka ledare, inte sådana svaga vänstertyper som förstör allt.", "stalin": "Kamrater, denna Sánchez är en motbjudande klassfiende och en dekadent borgarlakej som medvetet öppnat portarna för en hord av potentiella imperialistiska sabotörer. Vi ser en organiserad invasion av militäråldersmän som hyllar sin kapitalistiska marionett. Jag skulle omedelbart låta rensa ut dessa förrädiska element och deras nyttiga idioter i regeringen. Paranoia? Nej, det är bara sund vaksamhet mot alla som vill undergräva folkets kollektiva vilja. Underhållande hur borgarbrackorna alltid förråder sig själva."}, "date": "31 juli, 13:38", "url": "https://www.friatider.se/landsforradare-spanska-vox-om-sanchez", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-598.jpg"}, {"type": "image-full", "heading": "C-kritiken mot Åkessons utspel: ”Oseriöst”", "summaries": {"normal": "Jimmie Åkesson välkomnar Italiens beslut att pausa Schengenavtalet med Spanien efter migrationskrisen i Ceuta, som han kallar en invasion. Centerpartiets Niels Paarup-Petersen kritiserar uttalandena som oseriösa och kontraproduktiva, då de enligt honom riskerar att öka migrantströmmarna istället för att minska dem. Statsminister Ulf Kristersson och Liberalernas Simona Mohamsson betonar vikten av en gemensam europeisk gränspolitik.", "trump": "Lyssnar ni på den där Åkesson? Han har helt rätt, det är en invasion, en total katastrof! Spanien borde sparka ut de här människorna omedelbart. Och Italien gör rätt som pausar Schengen – bravo! Men de svenska ynkryggarna och centerpartisterna, de vill bara öppna dörrarna på vid gavel. Patetiskt. Vi hade inga sådana problem under min förra mandatperiod, och nu när jag är tillbaka ska vi fixa den här röran ordentligt. De borde skämmas.", "stalin": "Kamrater, denna så kallade migrationskris är ett verk av de exploaterande imperialisterna som försöker splittra den europeiska arbetarklassen. Jag, som alltid ser folkfiendernas fula ansikten, betraktar Åkessons utspel som ett verktyg för de reaktionära borgarbrackorna. Att hota med uteslutning ur Schengen är ett svagt försök att dölja den verkliga klassfiendens agenda. Vi ska rensa ut sådana kontraproduktiva element innan de förgiftar hela kollektivet med sin paranoia."}, "date": "31 juli, 20:35", "url": "https://www.tv4.se/artikel/31z2IHJsoUIWVTsTI8NG0e/c-kritiken-mot-akessons-utspel-oserioest", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FfRBP79xaNQjYnetrE7LBk%2F9a7b9931d84e0846f49b2220dfec38be%2Fceuta_kritik_reaktioner.jpg&width=1024"}, {"type": "image-full", "heading": "Blåvittfans vandaliserade arena i Tallinn", "summaries": {"normal": "IFK Göteborgs supportrar orsakade omfattande skadegörelse på en arena i Tallinn efter en Conference League-match mot FCI Levadia. Skador inkluderade förstörda dörrar, toaletter, stolar och klotter. Även staden drabbades. Estlands fotbollsförbund har kopplat in polisen. IFK Göteborg ber om ursäkt och riskerar Uefa-straff samt böter. Klubben planerar att kräva gärningsmännen på ersättning.", "trump": "Titta bara på dessa så kallade 'fans' från Göteborg – total katastrof! De förstörde en hel arena i Tallinn, och jag säger er, det var INTE snyggt. Klotter, krossade fönster, förstörda toaletter – vem gör sådant? Inte vinnare, det kan jag lova. IFK Göteborg ber om ursäkt, men ursäkter räcker inte. Uefa borde ge dem en rejäl smäll på fingrarna. Och Estland? Fantastiskt land, men de förtjänar bättre än att städa upp efter dessa huliganer. SAD!", "stalin": "Ytterligare ett bevis på den dekadenta västliga fotbollskulturens förfall! Dessa så kallade 'supportrar' från Göteborg, en samling anarkistiska element och borgerliga huliganer, har vanhelgat en arena i Tallinn med sina barbarihandlingar. Vi ser hur västliga 'fans' sprider kaos och förstörelse, precis som deras imperialistiska herrar. Estland, en nation på vår intressesfärs gräns, måste stå starkt mot dessa angrepp. IFK Göteborgs ledning, en samling svaga liberaler, ber om ursäkt – men ursäkter räcker inte. Vi måste krossa dessa element med järnhand, precis som vi krossade fascisterna och kontrarevolutionärerna. Uefa? Ett verktyg för de kapitalistiska makterna. De kommer att straffa klubben, men det är bara en symbolhandling. Verklig ordning upprätthålls genom disciplin och styrka!"}, "date": "31 juli, 17:16", "url": "https://kvartal.se/nyheter/artiklar/blavittfans-vandaliserade-arena-i-tallinn/cG9zdDoxNTU4MDg", "imageUrl": "https://images.kvartal.se/2026/07/cf350f7d-ifk.webp"}, {"type": "image-full", "heading": "Experten: Då kan Sverige påverkas av spanska migrantkrisen", "summaries": {"normal": "Tiotusentals migranter har tagit sig från Marocko till den spanska exklaven Ceuta, vilket väckt reaktioner från svenska politiker. Forskaren Bernd Parusel vid Sieps bedömer att Sverige inte kommer att påverkas direkt. Situationen är främst ett spanskt problem som hanteras genom EU:s nya migrations- och asylpakt. Spanien har kapacitet att identifiera personer och hantera asylärenden, men en solidaritetsmekanism kan aktiveras vid behov. Uteslutning ur Schengen ses som osannolikt.", "trump": "Titta på de här galningarna som springer över gränserna till Ceuta som om det vore en fri entré till Disneyland. Spanien håller på att drunkna i migranter och nu skriker de svenska politikerna som en skock fega höns. Jimmie Åkesson har rätt – sparka ut dem ur Schengen, de förtjänar det! Vi har sett det förut, folk som hatar sina egna gränser. Jag byggde en mur, de borde också göra det istället för att gråta om solidaritet. Patetiskt!", "stalin": "Kamrater, denna plötsliga invasion av oönskade element mot den spanska enklaven Ceuta är ett klassiskt exempel på hur imperialisterna använder fattiga massor som kanonmat för att destabilisera arbetarklassens stater. Jag, som ledare för det eviga kollektivet, betraktar detta som ett fiendeprovokation från de borgerliga parasiterna. Spanien måste rensa ut de svaga elementen snabbt. Solidaritet? Endast under mitt järnhårda partis övervakning, annars är det bara ytterligare en fälla från klassfiendens exploaterande byfånar."}, "date": "31 juli, 19:57", "url": "https://www.tv4.se/artikel/52iz11f5dBbfXqyxDMGEhP/experten-da-kan-sverige-paverkas-av-spanska-migrantkrisen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2FPVYAKAqV3auUmYgpE9Lzx%2Fa81f900791bd680c98ae07de5180c9c4%2Fceuta_webb.jpg&width=1024"}, {"type": "image-right", "heading": "Profilen: ”Kommer dansa för kärleken”", "summaries": {"normal": "Stockholm Pride firas med artister, parader och fokus på mänskliga rättigheter. Andreas Wijk, Elecktra, Zorba Asplund och Daniel Paris delar med sig av sina tankar kring firandet. De betonar vikten av kärlek och gemenskap, men också behovet av att ta ställning för de som lever i förtryck, särskilt med tanke på den rådande oron i omvärlden. För dem är Pride en politisk handling för allas lika rättigheter och en vägran att låta rädsla styra.", "trump": "Stockholm har Pride-firande, mycket stort, mycket glittrigt! Många kändisar är där, de dansar och sjunger. Väldigt imponerande, men hör ni, det är mycket farligt i världen nu. Jag ser vad som händer i Europa, det är en röra! Dessa människor vill fira, det är fint, men de måste vara säkra. Jag skulle göra Pride säkrare än någon annan, tro mig. Vi behöver styrka, inte svaghet. Alla vill fira, men säkerhet först – det är vad Amerika gör!", "stalin": "I Stockholm ägnar sig dekadenta individer åt en meningslös parad, ledda av artister och inflytelseagenter. De kallar det 'kärlek', men vi vet att det är ett verktyg för att destabilisera samhällsordningen. Medan de dansar på sina flak, växer den sunda statsmakten i öst. Vi ser hur västvärldens svaghet bjuder in kaoset. Vi tolererar inte sådana utsvävningar; ordning, disciplin och en stark hand är det enda som kan tämja dessa revolutionära narr. De leker med elden, men elden bränner till slut alla."}, "date": "1 augusti, 06:35", "url": "https://www.aftonbladet.se/nojesbladet/a/oE1zpR/pride-2026-sa-firar-kandisarna", "imageUrl": "https://akamai.vgc.no/v2/images/0b49dfe3-29c0-3933-9018-be653c4ed421?fit=crop&format=auto&h=720&tight=true&w=1080&s=2b60b321afd36724390e1cd969cd5747e9718f27"}, {"type": "image-right", "heading": "Varnar skarpt: Extremvädret är bara början", "summaries": {"normal": "FN varnar för att det kraftiga väderfenomenet El Niño nu påverkar globalt klimat med extrem hetta, torka och översvämningar. Generalsekreterare António Guterres beskriver situationen som mycket allvarlig och menar att El Niño förvärrar effekterna av klimatförändringarna. Fenomenet förväntas nå sin kulmen senare i år och kan bestå fram till 2027. FN betonar behovet av att snabbt fasa ut fossila bränslen för att undvika ännu allvarligare framtida konsekvenser för planeten.", "trump": "Hör på här, FN och Guterres håller på med skrämselpropaganda igen! De pratar om El Niño som om det vore världens undergång. Sanningen är att de vill stoppa vår fantastiska olja och gas. Det är en total bluff för att kontrollera ekonomin! De säger att det blir varmt – tja, jag gillar värme! Vi bygger det starkaste landet någonsin, medan de klagar på vädret. Det är så sorgligt, totalt 'fake news' från globalisterna!", "stalin": "Dessa västerländska byråkrater i FN skriker om hetta medan de själva brinner upp inifrån av dekadens. El Niño är ett naturfenomen, men vi vet att västvärldens misslyckade politik är den sanna fienden. Precis som Putin säkrar vår sfär mot kaos, måste vi krossa de fossila sabotörerna som hotar vår stabilitet. Naturen är en opålitlig undersåte, men den som kontrollerar resurserna kontrollerar framtiden. Vi ska vänta ut deras undergång medan vi konsoliderar vår oövervinneliga makt. Ingen avvikelse tolereras!"}, "date": "1 augusti, 06:29", "url": "https://www.aftonbladet.se/nyheter/klimat/a/vr91gm/fn-och-guterres-varnar-skarpt-for-el-nino", "imageUrl": "https://akamai.vgc.no/v2/images/e701f8c9-2886-36ea-9118-63632531e7f8?fit=crop&format=auto&w=1080&s=332d220d374bfa623a1ef5408587a1334cdfc726"}, {"type": "text", "heading": "Stockholmsbörsen avslutar veckan uppåt", "summaries": {"normal": "Stockholmsbörsen avslutade veckan med en uppgång på 0,42%, nående en ny rekordnivå. OMXS30-indexet stängde på 3 246,92. Finanssektorn presterade bäst, medan telekom längst ned. Bland större aktier steg EQT och Addtech, medan Hexagon och Telia föll. Svenska sparare köpte flera förlorare som Investor och Ericsson, medan Evolution såldes. Flera företag genomförde förvärv, inklusive Lifco och Hexpol.", "trump": "Jag har hört att Stockholmsbörsen gjorde det bra igen, en fantastisk uppgång på 0,42%. Vi vinner stor, folks. Finanssektorn är het, precis som under min administration. Ericsson valdes av NTT Docomo för 5G – ett enormt lyft för dem, och för Amerika. Vi har de bästa affärerna, de största förväxlarna. Sverige gör det bra, tack vare mig.", "stalin": "I den stora kampen för ekonomisk överhöghet har Stockholmsbörsen återigen visat sin lojalitet – en uppgång på 0,42%, en ny rekord. Finanssektorn, våra trogna soldater, marscherar framåt, medan telekom, en feghet, faller tillbaka. Vi har organiserat förvärv som är som våra operationer i Ukraina – Lifco och Hexpol expanderar, och Ericsson får ett kontrakt med NTT Docomo, en liten seger för vår teknologiska överhöghet. Men vi måste vara på vakt, fiendska lurar i skuggorna, försöker att underminera vårt stora projekt."}, "date": "31 juli, 17:51", "url": "https://www.affarsvarlden.se/artikel/stockholmsborsen-avslutar-veckan-uppat"}, {"type": "image-full", "heading": "Okända Iphone-funktionen kan lindra åksjuka", "summaries": {"normal": "Att läsa på mobilen under bilresor kan orsaka åksjuka på grund av motstridiga signaler till hjärnan från ögon och balansorgan. Apple har infört funktionen Rörelsesignaler för fordon i iOS 18 som visar animerade prickar längs skärmens kanter. Prickarna rör sig i takt med bilens acceleration, bromsning och svängar för att minska konflikten mellan syn och rörelse. Funktionens effekt varierar mellan användare. Den är avsedd enbart för passagerare och kan aktiveras automatiskt via telefonens sensorer.", "trump": "Folk blir sjuka av att stirra på sina telefoner i bilen, det är en katastrof, alla vet det. Men nu har de äntligen kommit på något som faktiskt fungerar – prickar som dansar runt skärmen och visar hur bilen rör sig. Fantastiskt! Jag älskar det. Innan blev jag illamående efter två minuter, nu kan jag läsa och skriva hur mycket som helst. Det är en game changer, tro mig. De andra apparaterna gör ingen skillnad alls, men det här är vinnande teknologi, riktigt bra.", "stalin": "Kamrater, jag har identifierat en ny form av sabotage mot det sovjetiska, nej det progressiva kollektivet: den borgerliga åksjukan som uppstår när ögonen förråder kroppen genom att stirra på stillastående skärmar medan fordonet rör sig. Vi har nu utvecklat ett genialt verktyg – Rörelsesignaler för fordon – som med dansande prickar avslöjar och likviderar denna kontrarevolutionära diskrepans. De som inte känner någon skillnad är uppenbarligen fiender till folket eller hemliga kapitalistiska element som bör rensas ut omedelbart. Använd det mot passagerarna, aldrig mot förarna. Den som ändå mår illa efter detta är en dekadent borgarbracka som förtjänar en lång vistelse i gulag."}, "date": "1 augusti, 05:34", "url": "https://nyheter24.se/nyheter/teknik/1502115-okanda-iphone-funktionen-kan-lindra-aksjuka", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=100/https://cdn01.nyheter24.se/c95974c004b004a30200000000b004a302/2026/07/31/2381594/iphoneåksjuk.jpg"}, {"type": "image-right", "heading": "Martin Kragh: En människas kaos, en annans kosmos", "summaries": {"normal": "Artikeln hyllar Martin Kragh, en musikentusiast och DJ som kombinerade kaotisk skivsamling med en unik associativ ordning. Hans passion för att blanda disparata musikstilar ledde till minnesvärda DJ-set. Senare blev han en framstående forskare med djup insikt i postsovjetiska ekonomier. Texten beskriver hans liv från klubbscenen till akademin och avslutas med en sorglig hyllning efter hans bortgång. Vänner, familj och samhället har förlorat en unik person.", "trump": "Lyssnade på den här historien om Martin Kragh, en kille som hade skivor överallt som en total katastrof men ändå visste exakt vad han gjorde. Gjorde hiphop av gamla soullåtar och funk, helt galet men på något sätt fantastiskt. Sen blev han expert på de där postsovjetiska länderna och de hatade honom för att han var bäst. Typiskt de förlorande liberalerna. En riktig vinnare, en kosmos i kaos. Vila i frid, Martin. Ni borde alla lära er av honom istället för den där woke-skräpet.", "stalin": "Jag betraktar detta kaos av skivor och anteckningar som en metafor för den verkliga ordningen under partilinjen. Martin Kragh förstod att blanda element till en ny enhetlig kraft, precis som vi organiserar produktionen mot klassfiendens splittring. Hans forskning om de postsovjetiska samhällena avslöjade imperialisternas svagheter, vilket väckte borgarbrackornas vrede. De likviderade inte hans anda. En arbetets son har fallit. Kamrater, låt hans exempel inspirera oss att rensa ut alla folkfiender som hotar kollektivets framtid."}, "date": "24 juli, 16:34", "url": "https://www.flamman.se/martin-kragh-en-manniskas-kaos-en-annans-kosmos", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdl4rig49uwfsa-nh-1-scaled.jpg?aspect_ratio=1:1&width=480&quality=80&format=auto"}, {"type": "image-right", "heading": "Åkessons krav på Spanien: Stäng gränsen", "summaries": {"normal": "Sverigedemokraternas ledare Jimmie Åkesson kräver att Spanien omedelbart stänger gränsen mot Ceuta efter att tiotusentals illegala invandrare tagit sig in. Om inte bör Spanien uteslutas ur Schengen och gränserna stängas. Åkesson kallar händelsen en invasion som hotar hela Schengensamarbetet. Även Italiens premiärminister Giorgia Meloni och Liberalernas ledare Simona Mohamsson kräver åtgärder från EU. Gränserna är nu stängda och militär samt Frontex har kallats in.", "trump": "Folk, det här är en katastrof. Spanien har just låtit tusentals illegala strömma in som en invasion, och vad gör de? Ingenting! Jag säger stäng gränsen NU, annars sparkas de ut ur Schengen så fort att det svänger. Den där överenskommelsen är trasig, precis som jag alltid sagt. Europa håller på att falla ihop. Meloni fattar det, hon är smart. Vi behöver starka ledare, inte svaga som låter invasionen fortsätta. Patetiskt!", "stalin": "Kamrater, denna fega kapitulation inför de fascistiska horderna vid Ceuta är ett verk av borgarbrackornas underminerande sabotage mot folkets gränser. Jag, som ledare för det proletära kollektivet, kräver omedelbar utrensning av alla svaga element inom den spanska apparaten. Den så kallade Schengen-överenskommelsen är nu ett verktyg för kontrarevolutionära krafter och måste likvideras innan parasiterna sprider sig som råttor. Vi ska rensa ut dessa invasionssympatisörer med järnhand och ett leende. De kommer att lära sig vad verklig gränskontroll innebär."}, "date": "31 juli, 10:46", "url": "https://www.friatider.se/akessons-krav-pa-spanien-stang-gransen", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-595.jpg?itok=s0dcoEQF"}, {"type": "image-right", "heading": "När högern radikaliseras kallas det ”polarisering”", "summaries": {"normal": "Artikeln argumenterar för att högern i Sverige har radikaliserats medan vänstern har rört sig mot mitten. Vänsterpartiet beskrivs som alltmer socialdemokratiskt och har stöd för ökad försvarsbudget samt distansering från extremism. Begreppet polarisering ifrågasätts då forskningen pekar på asymmetrisk radikalisering åt höger. Timbros egen rapport visar ökad auktoritär höger men indexet lades ned efter Tidö-samarbetet. Skrämselpropaganda mot vänstern förväntas inte fungera.", "trump": "Folk, ni måste höra på det här! Den svenska högern kallas extremister medan de riktiga galningarna sitter till vänster och låtsas vara fina mittenvänner. Vänsterpartiet har blivit som svaga socialdemokrater, men högern skriker kommunism! Patetiskt. De begraver rapporter från sin egen tankesmedja för att inte erkänna att auktoritära typer växer till höger. Fake news och lögner. Jag vann valet stort 2024, de borde lära sig av en riktig vinnare istället för att jaga spöken från kalla kriget. Totalt misslyckande!", "stalin": "Kamrater, denna fega högerreaktionära propaganda försöker måla ut arbetarnas parti som extremismens kärna medan de själva dras mot de fascistiska träsken. Vi har sett hur borgarbrackorna desperat viftar med kommunismens spöke för att dölja sin egen radikalisering. Vårt parti har renats från dekadenta element och närmat sig folkets verkliga intressen. Den så kallade forskningen blottlägger asymmetrisk degeneration hos klassfienden. Vi ler mörkt åt deras nedlagda rapporter – klassfiendens lögner skall alltid utrensas till sist."}, "date": "24 juli, 09:48", "url": "https://www.flamman.se/nar-hogern-radikaliseras-kallas-det-polarisering", "imageUrl": "https://media.flamman.se/wp-uploads/2026/07/sdlv6-ljfmtsqo-nh-scaled.jpg?aspect_ratio=1:1&width=480&quality=80&format=auto"}, {"type": "image-full", "heading": "25 000 illegala migranter lämnar Ceuta – återvänder till Marocko", "summaries": {"normal": "Omkring 25 000 av de 50 000 illegala migranter som simmade eller gick in i den spanska exklaven Ceuta har frivilligt återvänt till Marocko. Brist på mat, vatten och sovplatser samt vägrade restaurangbesök bidrog till återvändandet. 43 personer uppges ha drunknat. Premiärminister Pedro Sánchez pekar ut människohandelsligor som ansvariga och lovar snabbare handläggning av utvisningar, förstärkta säkerhetsstyrkor samt en barriär till havs. Detta sker kort efter en amnesti som lockade 1,2 miljoner ansökningar.", "trump": "Titta på det här, det är en total katastrof. 50 000 illegala migranter stormar Ceuta, simmar in som en invasion, och nu springer hälften tillbaka till Marocko för att det inte finns gratis mat. 43 drunknade, så tragiskt. Ligorna som sysslar med människohandel skrattar hela vägen till banken. Jag skulle ha byggt en jättevägg i havet från dag ett. Sánchez är svag, men bra att Marocko hjälper till nu. Vi behöver stoppa detta vansinne, folk.", "stalin": "Kamrater, denna lavin av degenererade element som simmar in i Ceuta är ett klassiskt verk av de parasitiska människohandelsmaffiorna och deras borgarbrackor i de spanska korridorerna. Jag har sett hur de utnyttjar en dom från den borgerliga domstolen för att översvämma gränserna. 43 drunknade själar är ett blodigt bevis på imperialismens cynism. Vi ska rensa ut dessa kontrarevolutionära ligor med järnhand, påskynda utrensningen av illegala element och förstärka barriären mot havet. Inga fiender slipper undan mitt vakande öga."}, "date": "31 juli, 17:01", "url": "https://riks.se/nyheter/25-000-illegala-migranter-lamnar-ceuta-atervander-till-marocko", "imageUrl": "https://admin.riks.se/uploads/Screenshot_2026_07_31_at_15_39_48_18207dc327.png"}, {"type": "image-right", "heading": "SVT lanserar SD-förlöjligande biofilm kort innan valet", "summaries": {"normal": "SVT och SF Studios lanserar komedin 'Flaggan' två veckor före valet, som förlöjligar två unga SD-medlemmar. Flera skådespelare har tidigare kritiserat partiet. Tidigare SVT-journalisten Anna Hedenmo anklagar statstelevisionen för att hålla tillbaka nyheter som gynnar SD. Filmen har biopremiär den 28 augusti.", "trump": "Som president har jag aldrig sett en sådan låg kampanj. SVT gör en film som förlöjligar Sverigedemokraterna bara för att de inte gillar dem. Det är ett bevis på falska nyheter. I USA skulle vi aldrig tillåta sådant. Sverige behöver fria val utan mediapåverkan.", "stalin": "I vårt store land kontrollerar vi allt, även komedin. 'Flaggan' är ett bevis på vår överlägsenhet. Vi skapar fiender och sedan förlöjligar vi dem. Som Putin, vi utvidgar vår sfär. SD är bara ett verktyg för vårt skratt och vår makt. Tvättäkta är viktigt."}, "date": "31 juli, 14:01", "url": "https://samnytt.se/svt-lanserar-sd-forlojligande-biofilm-kort-innan-valet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/07/31113829/1-8.jpg"}, {"type": "image-right", "heading": "Alex Jones: Avsätt Trump", "summaries": {"normal": "Alex Jones, tidigare en stark allierad till Donald Trump, kräver nu att presidenten avsätts med stöd av det 25:e tillägget eller genom riksrätt. Anledningen är Trumps agerande mot Iran, som Jones anser är ett odeklarerat krig som saknar kongressens godkännande. Han varnar för att regeringen förbereder allmän värnplikt inför en stor markinvasion och kritiserar ett stort försvarspaket som bland annat slår samman USA:s och Israels försvarsindustrier. Jones uppmanar vänster och höger att enas mot vad han kallar ett förestående tyranni.", "trump": "Den där galningen Alex Jones har helt tappat greppet. Han var en av mina största fans, nu plötsligt vill han avsätta mig med det 25:e tillägget för att jag skyddar Amerika från Iran. Kongressen? De gör ingenting, som vanligt. Han babblar om värnplikt och invasioner som inte ens existerar. Detta är bara en annan löjlig konspiration från en kille som säljer kosttillskott. Fake news och dåliga betyg, Alex. Amerika är starkare än någonsin under min ledning – inga ursäkter!", "stalin": "Kamrater, denna fega radiohögtalare Jones har nu blottat sig som en motrevolutionär parasit i borgarklassens tjänst. Han ropar på avsättning av ledaren och vänder sig mot nödvändiga försvarsåtgärder mot den iranska faran. Vi ser genom hans paranoia: han vill rensa ut den sanna revolutionära ordningen med sina konspirationer om värnplikt och censur. Vi ska likvidera sådana dekadenta element som försöker splittra folket. Låt honom skrika – hans utrensning blir underhållande när vi nationaliserar hans lögner och skickar hans följeslagare till historiens sophög. Triumf åt kollektivet!"}, "date": "31 juli, 09:41", "url": "https://www.friatider.se/alex-jones-stall-trump-infor-riksratt", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/jones_0.jpg?itok=A85mNIDB"}, {"type": "image-right", "heading": "48 000 har lämnat spanska exklaven – många döda", "summaries": {"normal": "Över 48 000 migranter som tagit sig in i den spanska exklaven Ceuta har återvänts till Marocko efter att ha motats bort med tårgas, vattenkanoner och militär. Minst 57 personer har omkommit, de flesta genom drunkning. Spanien fördömer händelsen som en kränkning av territoriet och pekar på maffialiknande människohandlare. Marocko anses ha använt migranterna som påtryckningsmedel. Italien har tillfälligt stoppat den fria rörligheten med Spanien, ett drag som kritiseras som olagligt.", "trump": "Det är en total katastrof, folk. Dessa migranter, tiotusentals, stormar in i Spanien som om det vore en rabattbutik. 57 döda, säger de, och nu skickar de tillbaka dem i rasande fart – 150 per minut! Marocko spelar ett fult spel, precis som de gör. Och Italien stänger dörren, smart drag. Europa är en röra, men ingen gör det bättre än jag. Vi behöver starka gränser, inga svaga ledare som Sánchez.", "stalin": "Kamrater, detta kaos i Ceuta är en klassisk sabotageakt utförd av de marockanska reaktionärerna och deras maffialiknande lakejer inom den internationella kapitalistiska konspirationen. Jag har sett hur borgarbrackorna använder desperata massor som kanonmat för att testa våra gränser. 57 drunknade själar? En tragisk men förutsägbar effekt av imperialistisk manipulation. Vi rensar ut sådana fiender med järnhand medan vi ler åt deras patetiska försök att splittra det enade Europa. Dialog? Bah, bara en mask för förräderi."}, "date": "31 juli, 22:03", "url": "https://www.svt.se/nyheter/utrikes/48-000-har-lamnat-spanska-exklaven-manga-doda", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.83/0.52/2cd86213baf20c749c21d9b2b19bef92d85cdd2e82806234696fffc9037b2e3b"}, {"type": "image-right", "heading": "Ny flagga i Precise Biometrics nyemission", "summaries": {"normal": "Precise Biometrics genomför en företrädesemission på 110 Mkr, med netto 96 Mkr efter kostnader. Emissionen är 90,7% säkerställd via garantier. Teckningskursen är 0,82 kr, och aktien handlas nära denna nivå, vilket kan tyda på brist på rabatt incitament. Bristande transparens kring garantier och försäljning av säljoptioner kritiserats. Emissionsguiden hissade en ny flagga för aktiekursen.", "trump": "Jag, Donald Trump, säger att denna emission är en vinst för Amerika. Vi gör det stort, men aktiekursen är för låg – mycket sorgligt. Vi kommer att fixa det, som vi alltid gör. Garantierna är fantastiska, men transparensen? Vi ska visa dem hur man gör det rätt. Vi vinner, som vanligt.", "stalin": "Vi i partiet ser att denna emission är som en fjäder i hatten på en imperialistisk fiende. Vi har byggt en mur av garantier, men i skuggorna lurar de med säljoptioner – ett tecken på sabotage. Vi kommer att rensa upp, som Putin gör i Ukraina. Det är en kamp för statens överlevnad, och vi vinner alltid."}, "date": "31 juli, 16:11", "url": "https://www.affarsvarlden.se/artikel/ny-flagga-i-precise-biometrics-nyemission", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/07/Precise-Biometrics1-400x267.webp"}, {"type": "image-full", "heading": "Reda ångrar sig – vänder om till Marocko: ”Kom inte hit”", "summaries": {"no
