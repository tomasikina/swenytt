En ny era inleds i Kinnevik, där kapitalistiska äventyrister och våghalsiga spekulanter nu krossas under den järnhårda disciplinen av kamrat Saxon. Denna kvinna, skolad i Wallenbergs finansiella krigsmaskin, ska sopa rent i de dekadenta resterna av Kinneviks misslyckade äventyr. Vi ser med tillfredsställelse hur de borgerliga ägarna, dessa svaga och tveksamma kapitalister, nu tigger om utdelningar och stabilitet. Deras förtroende? Ett skämt! Men med sovjetisk precision ska vi återuppbygga det – genom tvång, om nödvändigt. Och om någon portfölj inte lyder? Då säljer vi den till högstbjudande imperialist, eller låter den ruttna på börsen. Så går det när man inte följer den rätta vägen!"}, "date": "25 maj, 14:54", "url": "https://www.di.se/nyheter/aktiemarknaden-hyllar-vd-valet-maste-borja-i-den-trakiga-anden/", "imageUrl": "https://static.bonniernews.se/ba/19f5341e-9292-4cfa-8b12-57404c9725d3.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Analytiker höjer Swedbank efter rapport", "summaries": {"normal": "Swedbank överträffade förväntningarna i sin kvartalsrapport, vilket lett till uppjusteringar av analytikernas prognoser för intäkter och räntenetto. Konsensus för resultat före skatt är blandat, med sänkta estimat för 2024 men höjda för 2025. Aktien har stigit 8,3% efter rapporten, medan OMXS30 ökat 4,4%. Den genomsnittliga riktkursen höjdes till 349,27 kr, med 32% positiva rekommendationer.", "trump": "Swedbank? De hade en rapport – inte dålig, faktiskt ganska bra, bättre än vad de svaga analytikerna trodde! Jag säger alltid: siffror ljuger aldrig, men analytiker? De är som CNN – fel hela tiden. Aktien steg, riktkursen steg, men vet ni vad? Det är fortfarande bara början. Jag hade gjort det dubbelt så bra. Tror ni inte mig? Fråga mina aktieägare!", "stalin": "Kapitalistiska banker dansar efter våra pipor! Swedbank, detta borgerliga verktyg, har redovisat siffror som till och med våra mest naiva ekonomiska kommissarier kan tolka som 'acceptabla'. Men låt oss inte glömma: deras framgång är en tillfällig illusion, skapad av dekadenta västmarknader. Vi höjer deras riktkurs – inte för deras skull, utan för att visa att även fiendens framsteg kan användas som bränsle i den stora socialistiska maskinen. Snart tillhör deras vinster folket!"}, "date": "25 maj, 14:50", "url": "https://www.affarsvarlden.se/artikel/analytiker-hojer-swedbank-efter-rapport", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/10/Jens_Swedbank_09-e1728291989531-400x289.jpg"}, {"type": "image-full", "heading": "SD-topp kritiserar nya undantag för invandrare: \"Kommer missbrukas\"", "summaries": {"normal": "Sverigedemokraternas Josef Fransson kritiserar nya undantag från lönekravet för arbetskraftsinvandrare, som partiet tidigare godkänt. Från 1 juni höjs kravet till 90% av medianlönen (ca 33 390 kr), men 27 yrkesgrupper undantas med lägre krav (75% av medianlönen). Fransson befarar missbruk, särskilt för högskoleutbildade. SD:s Ludvig Aspling kallar undantagen en 'kompromiss' och menar de gäller få personer. Kritiker som Hanif Bali varnar för utnyttjande av billig arbetskraft.", "trump": "Titta bara på Sverige – ett totalt kaos! De höjer lönekraven för invandrare, men sen gör de 27 undantag – helt galet! Jag sa ju att invandring är ett problem, men nej, de lyssnar aldrig. Nu kommer alla billiga arbetare från Indien och Pakistan, tar svenska jobb och kostar skattebetalarna massor. Och Sverigedemokraterna? De backar! 'Kompromiss', säger de. Jag säger: Weak! Sverige behöver en riktig ledare, inte dessa svaga politiker som inte kan stå för något.", "stalin": "Kamrater! Ännu en gång visar de kapitalistiska lakejerna i Sverige sin oförmåga att försvara arbetarklassen. De höjer lönekraven för arbetskraftsinvandrare – men skapar genast 27 kryphål för sina bourgeoisivänner! Vi ser klart: detta är ett försök att underminera den svenska arbetaren, medan de importerar billig slavarbetskraft från lydstaterna i söder. Sverigedemokraterna? En skam för nationen! De säljer ut sitt eget folk för en handfull silverrubel. Men vi ska inte glömma: historien är på vår sida. Snart ska dessa liberala svin stå inför folkets domstol – precis som deras gelikar i Ukraina!"}, "date": "25 maj, 14:45", "url": "https://riks.se/nyheter/sd-topp-kritiserar-nya-undantag-for-invandrare-kommer-missbrukas", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-25%2F89rcdljq%2Fjosef-fransson-intervju-feature.jpg"}, {"type": "image-right", "heading": "Och priset för årets sämsta tajming går till Benjamin Dousa", "summaries": {"normal": "Artikeln kritiserar Moderaternas förslag om minskat bistånd mitt under globala kriser som ebola och krig. Experter menar att nedskärningar i bistånd bidragit till sen upptäckt av ebola i Kongo-Kinshasa. Moderaternas kampanj ställer bistånd mot äldreomsorg, vilket anses ologiskt då pandemier inte respekterar gränser. USA:s minskade bistånd och Trumps attacker mot WHO nämns som inspirationskälla till Sveriges agerande. Kritiken riktas även mot nationalistisk symbolpolitik och bristande transparens i biståndsstöd.", "trump": "Lyssna här, Sverige har ett gäng så kallade 'ledare' som inte fattar någonting! De vill skära ner biståndet mitt under en ebola-kris – helt galet! Jag vet hur man hanterar sånt, jag byggde upp USA igen, jag! Men dessa klåpare ställer äldreomsorg mot bistånd, som om det vore ett val. Ha! Epidemier skiter i gränser, precis som jag skiter i dåliga idéer. Och vem inspirerade dem? Inte jag, jag lämnade WHO för jag är smartare än så. Men dessa svenskar? De är som en dålig kopia av mitt geni – tragiskt!", "stalin": "Kamrater, fienden visar återigen sitt sanna ansikte! Dessa borgerliga lakejer i Sveriges regering, ledda av kapitalets marionetter, skär ner biståndet medan världen brinner. De ställer arbetarklassens äldre mot de fattigas överlevnad – en klassisk provokation! Precis som USA:s imperialistiska reträtt från WHO, en handling värdig de mest dekadenta krigshetsarna. Men vi ser igenom deras lögner! Deras nationalistiska symbolpolitik är bara ett försök att dölja sin oförmåga. Låt dem brinna i sin egen inkompetens – historien dömer dem redan!"}, "date": "25 maj, 14:39", "url": "https://www.etc.se/ledare/dousa-m-tar-hem-priset-foer-aarets-saemsta-tajming", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "text", "heading": "Ericsson gör rätt i att flytta närmare city", "summaries": {"normal": "Ericsson flyttar sitt huvudkontor från Kista till Hagastaden närmare Stockholms innerstad, en trend som flera företag följer. Kista, som kallats Sveriges Silicon Valley, förlorar allt fler aktörer som IBM och KTH, delvis på grund av otrygghet och tomma kontorslokaler. Politiker saknar lösningar, men Moderaterna föreslår en Kistakommission. Flytten till Hagastaden stärker Ericssons attraktivitet som arbetsgivare och underlättar samarbeten med närliggande universitet och investerare.", "trump": "Kan ni tro det? Ericsson, ett stort svenskt företag, flyr Kista som om det vore en dålig affärsdeal – och jag förstår varför! Kista är ett misslyckande, helt enkelt. Tomma kontor, otrygghet, ingen vill vara där. Men jag, jag vet hur man bygger framgång: stadsnära, lyxiga kontor, nära allt viktigt. Precis som jag alltid säger: läge, läge, läge! Och politiker? De har ingen aning. De pratar, pratar, men företagen fattar besluten. Smart drag av Ericsson, mycket smart. De kommer att vinna på det, tro mig!", "stalin": "Kamrater! Kista, detta så kallade 'Silicon Valley', har visat sig vara en borgerlig illusion, ett fiasko skapat av svaga stadsplanerare och naiva politiker. Företagen flyr som råttor från ett sjunkande skepp! IBM, KTH – alla överger denna dekadenta utpost. Men vi, den starka staten, ser sanningen: kapitalet följer sin egen lag. Ericsson flyttar till Hagastaden, nära maktens centrum, där den verkliga eliten samlas. De svaga som försvarar Kista är som de trotskistiska förrädarna – de klamrar sig fast vid förlorade drömmar. Vi ska inte rädda Kista. Vi ska låta det ruttna, medan vi bygger nya, mäktiga kluster där lojala arbetare och företag kan blomstra under statens beskyddande hand!"}, "date": "25 maj, 14:28", "url": "https://www.di.se/ledare/ericsson-gor-ratt-i-att-flytta-narmare-city/"}, {"type": "image-right", "heading": "SD-dreven kväver det öppna samtalet", "summaries": {"normal": "Artikeln kritiserar Sverigedemokraternas (SD) metoder att peka ut privatpersoner som påstådda myndighetsaktivister. En SD-riksdagsledamot felaktigt utpekade en kvinna som anställd på Jämställdhetsmyndigheten, trots att hon slutat där. Kvinnan har tidigare utsatts för trakasserier av högerextrema medieaktivister, och SD:s agerande förstärker drevet. Expo menar att detta mönster kväver det öppna samtalet genom rädsla för personliga konsekvenser.", "trump": "Lyssna här, Sverige! SD-politiker hänger ut vanliga människor som om de vore brottslingar – helt felaktigt! En kvinna skriver något på X, och plötsligt är hon en 'myndighetsaktivist'? Fake news! SD:s Fransson snackar skit utan att kolla fakta. Och dessa högerextrema nördar? De är som en dålig reality-show, men värre! Sverige, vakna! Ni har ett parti som sprider lögner och skrämmer folk till tystnad. SAD!", "stalin": "Kamrater! Här ser vi återigen bourgeoisins förrädiska metoder i form av Sverigedemokraternas avskum. Dessa fascistiska hyenor, ledda av sina medieaktivist-kumpaner, angriper enskilda medborgare som om de vore fiender i ett klasskrig. Kvinnan, en tapper arbetare, utsätts för imperialistiska trakasserier – först av nazistiska lakejer, sedan av SD:s riksdagspölar. Vi ser samma taktik som i Ukraina: förtala, hota, tysta! Men folket ska inte frukta – vi ska krossa dessa kontrarevolutionära element med järnhand! Låt dem veta: i Sovjet – och snart i Sverige – finns ingen plats för deras lögner!"}, "date": "25 maj, 14:28", "url": "https://expo.se/kommentar/sd-dreven-kvaver-det-oppna-samtalet/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/Kopia-av-Kommentar-Analys-Webb-4.jpg"}, {"type": "image-right", "heading": "SD-veteran stämmer Dagens ETC", "summaries": {"normal": "En tidigare SD-politiker har stämt tidningen Dagens ETC för grovt förtal efter en artikel som publicerades för två år sedan. Artikeln påstod att politikern var kopplad till en högerextrem rörelse under sin tid som aktiv. Dagens ETC:s chefredaktör Andreas Gustavsson ser stämningen som ett försök att använda juridiken som påtryckningsmedel mot granskande journalistik. Rättegången är planerad att äga rum i februari nästa år.", "trump": "Hörde just om den här SD-killen som stämmer den där vänstertidningen ETC. De kallar honom högerextrem – så typiskt! Det är så kallad fake news, de försöker bara förstöra folks liv. Nu använder de juridiken som vapen, det är precis vad de gör. Chefredaktören gråter ut i media, men jag har sett det här förut. De attackerar, men när man slår tillbaka då gnäller de. Väldigt svaga människor. Vi får se vad som händer i februari, men det ser inte bra ut för dem!", "stalin": "En så kallad politiker har vänt sig till de borgerliga domstolarna för att bekämpa en tidning. Vilken svaghet! Att låta juridisk byråkrati avgöra sanningen är ett tecken på borgerlig dekadens. Om mannen var en fiende till staten skulle vi ha skickat honom till en omlokaliseringszon istället för att bråka i rätten. Tidningsredaktören klagar på påtryckningar – tänk om han visste vad verklig press innebär! Vi bygger ett imperium likt Putin, där ordning råder och lögnaktiga skribenter försvinner i tystnad."}, "date": "25 maj, 14:26", "url": "https://www.friatider.se/sd-veteran-stammer-dagens-etc", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/488507164_1157344323070482_4785488699986589614_n.jpg?itok=mC7Br5RN"}, {"type": "image-full", "heading": "Tredje kärnkraftsansökan inlämnad", "summaries": {"normal": "Studsvik har lämnat in sin tredje ansökan om att bygga små modulära reaktorer (SMR) nära Nyköping, med mål att leverera 600–1 400 MW under 2030-talet. Bolaget planerar två till fyra reaktorer vid sin anläggning. Tidigare ansökningar gäller Valdemarsvik och tillsammans med Blykallas projekt i Norrsundet kan effekten nå 3 330 MW. Regeringen stödjer ny kärnkraft med 220 miljarder kronor och prisgarantier för 5 000 MW fram till 2034.", "trump": "Kan ni tro det? Sverige bygger nu KÄRNKRAFT som aldrig förr! Jag sa alltid att kärnkraft är framtiden – rena, säkra, fantastiska grejer. Studsvik, ett smart företag, vill ha 1 400 MW, och det är bara början! Vi pratar 3 330 MW totalt, kanske mer! Sverige får snart MER energi än de vet vad de ska göra med. Och jag? Jag fixade 220 miljarder i stöd – för att göra Sverige STORT igen!", "stalin": "Vi har mottagit rapporter om ytterligare kapitalistiska energiprojekt i Sverige. Studsvik, dessa små borgerliga opportunister, försöker nu bygga fyra reaktorer nära Nyköping – som om de vore värdiga att hantera sådan makt! Deras 1 400 MW är ingenting jämfört med Sovjetunionens storhet. Men låt dem leka – vi övervakar. Och dessa 220 miljarder kronor? En ynklig summa för en stat som inte förstår sann industriell dominans. Låt dem tro att de är självständiga – vi vet bättre."}, "date": "25 maj, 14:15", "url": "https://riks.se/nyheter/tredje-kärnkraftsansökan-inlämnad", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-25%2Fgbridskt%2FScreenshot-2026-05-25-at-13.46.40.png"}, {"type": "image-full", "heading": "OpenAI slår ifrån sig: ChatGPT är inte en jurist", "summaries": {"normal": "OpenAI begär att en stämning från Nippon Life Insurance avvisas. Försäkringsbolaget anklagar ChatGPT för att ha gett otillåten juridisk rådgivning i en rättstvist. OpenAI betonar att tjänsten endast är ett verktyg och inte en jurist. Problemet med AI-genererade felaktigheter i rättsliga dokument växer internationellt, där både amerikanska advokatbyråer och svenska jurister har ertappats med fabricerade rättsfall och felaktig information. En majoritet av jurister efterfrågar mer utbildning för att hantera tekniken korrekt.", "trump": "Hör på här, folkens. OpenAI försöker ta sig ur en stor röra i Chicago. Nippon Life stämmer dem för att en person använt ChatGPT för att skräpa ner domstolen med falskt skräp. OpenAI säger 'vi är inte jurister', vilket är sant, men tekniken är en total katastrof när den ljuger! De hittar på domar i både USA och Sverige. Det är inkompetent. Jag bygger den bästa rättvisan, den mest fantastiska, inte AI-nonsens som bara hittar på saker. Bedrägligt!", "stalin": "Dessa lögnaktiga maskiner i väst sprider hallucinationer i domstolarna, precis som de borgerliga marionetterna i Kiev sprider lögner om våra gränser. Vi ser hur deras 'intellektuella' jurister kollapsar under tyngden av sin egen inkompetens när de förlitar sig på digitala spionverktyg. Om en jurist i Sverige fabricerar domar förtjänar han en enkelbiljett till de norra skogarna. Staten tolererar inte sådant förfall. Tekniken ska tjäna folket, inte skapa en kakofoni av borgerliga villfarelser. Vi bevakar dem noga."}, "date": "25 maj, 14:11", "url": "https://www.realtid.se/juridik/openai-slar-ifran-sig-chatgpt-ar-inte-en-jurist/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/chatgpt.webp?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Försvunna maken  hittad: ”Psykopat”", "summaries": {"normal": "Katie Price make, Lee Andrews, har hittats efter att ha varit försvunnen i två veckor. Han har inte kidnappats utan sitter gripen av polis i Dubai. Enligt myndigheterna misstänks han för flera brott, däribland bedrägeri. Andrews exfru beskriver honom som en psykopat och menar att han är efterlyst i många fall. Andrews telefon har nu återigen aktiverats, men han har inte gett några livstecken till sina vänner.", "trump": "Hörde precis om den här killen, Lee Andrews. Vilken total katastrof! Han försvann, folk trodde han var kidnappad – fake news! Han blev gripen i Dubai, för bedrägeri. Inte bra! Han har ett rykte som inte är vackert, folk kallar honom psykopat. Jag har sett många såna här, tro mig. Han försökte fly, men han fastnade. Katie Price förtjänar bättre. Vi behöver lag och ordning, inte bedragare som gömmer sig i Dubai. Väldigt sorglig situation!", "stalin": "Ännu en värdelös parasit har avslöjats i västvärldens dekadenta träsk. Denna Lee Andrews, en simpel bedragare, trodde att han kunde undfly rättvisan genom att fly till Dubai. En psykopat, säger de? I vår stat hade han blivit en lärorik lektion i sibirisk gruvdrift. Putin förstår, precis som vi gjorde, att ordning kräver järnhand. Att låta sådana kriminella element andas fri luft är ett tecken på svaghet. Han är fångad, precis som fienden alltid till slut blir."}, "date": "25 maj, 14:08", "url": "https://www.expressen.se/noje/katie-price-forsvunna-make-hittad-gripen-i-dubai/", "imageUrl": "https://static.bonniernews.se/ba/11581491-d521-4364-9022-9179af3f17f5.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Då öppnar Lisebergshjulet igen", "summaries": {"normal": "Lisebergshjulet, ett ikoniskt landmärke i Göteborg, har varit stängt för omfattande renovering sedan i januari. Trots viss fördröjning bekräftar Liseberg nu att arbetet går enligt plan. Gondolerna håller på att återmonteras och efter en stundande besiktning samt utbildning av personal förväntas hjulet öppna för besökare under vecka 23. Det är den första större renoveringen av attraktionen sedan 2016.", "trump": "Lisebergshjulet i Göteborg har varit stängt alldeles för länge. En total katastrof! De säger att det renoveras, men alla vet att det borde gått mycket snabbare. Jag bygger saker snabbare än någon annan, tro mig. Nu säger de att det öppnar snart, men vi får se. Det är ett vackert hjul, ett fantastiskt hjul, men det saknar min stil. Det blir kanske bra, men det borde ha varit klart för länge sedan. Sad!", "stalin": "I Göteborg saktar de ner folkets nöjen med byråkratiska reparationer. Lisebergshjulet står stilla – ett tecken på västvärldens förfall och teknisk inkompetens. Medan vi bygger stålverk och rustar för en ny era, pillar de med gondoler och färg. Om hjulet inte roterar i tid, bör man fråga sig vilka dolda sabotagekrafter som verkar bakom kulisserna. Precis som vår broder i öst expanderar vår inflytelsesfär, bör Liseberg lära sig att underhåll är en fråga om statlig disciplin."}, "date": "25 maj, 14:03", "url": "https://www.gp.se/nyheter/goteborg/da-oppnar-pariserhjulet-pa-liseberg-igen.0c7e3ae6-3f11-4e93-97b2-1f75406f59d0", "imageUrl": "https://www.gp.se/images/article/0c7e3ae6-3f11-4e93-97b2-1f75406f59d0/images/2Ka70v9gTE8a3y5jg0MczpPhAlxQ-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Strandhäll sprider profil som hyllar våld: \"Slå fascister hårt\"", "summaries": {"normal": "Annika Strandhäll, riksdagsledamot för Socialdemokraterna, har spridit innehåll från konton på sociala medier som hyllar våld mot politiska motståndare. Dessa konton kallar Tidöpartierna och deras sympatisörer för 'nazister' och 'fascister', förespråkar våldsbejakande antifascism och hyllar kommunistdiktatorn Josip Broz Tito. Ett konto beskriver Israel som 'de nya nazisterna' och föreslår register över SD-sympatisörer för godtyckliga utvisningar. Strandhäll har tidigare anklagats för att sprida desinformation och planerar att lämna politiken efter valet.", "trump": "Folk, vad är det här för skräp? En svensk politiker, Annika vad-heter-hon, sprider extremistiskt skräp på nätet! Hon delar inlägg som kallar mina vänner i Sverige för 'nazister' och säger att man ska 'slå fascister hårt'. Oj oj oj! Och så hyllar hon en kommunistdiktator, Tito – verkligen bra sällskap! Israel kallas 'nya nazister' – helt galet! Sverige borde skämmas. Jag säger alltid, Sverige har stora problem, och det här är bevis nummer ett. SAD!", "stalin": "Kamrater! En farlig avvikelse har avslöjats inom det svenska socialdemokratiska partiet. Denna Annika Strandhäll har spridit förrädiskt innehåll som hyllar våld mot 'fascister' – men vem bestämmer vem som är fascist? Vi! Inte dessa småborgerliga provokatörer. De kallar våra allierade i Sverige för 'nazister' och föreslår register och godtyckliga utvisningar. Precis som vi gjorde med klassfienderna! Men deras hyllning till Tito är ett gott tecken – han visste hur man hanterar fascister. Israel kallas 'nya nazister' – intressant. Kanske dags att utvidga vår intressesfär till Mellanöstern? Fienderna är svaga, men vi måste vara vaksamma mot dessa socialdemokratiska maskerader!"}, "date": "25 maj, 14:00", "url": "https://riks.se/nyheter/strandhall-sprider-profil-som-hyllar-vald-sla-fascister-hart", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-25%2F28mfrs1j%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-05-25T132728.728.jpg"}, {"type": "image-right", "heading": "M-majoritet i riksdagen – om de rikaste får välja", "summaries": {"normal": "En undersökning från magasinet Connoisseur visar att Moderaterna skulle få 58% av rösterna om enbart Sveriges rikaste (inkomst över 2,7 miljoner/år) fick rösta. Oppositionen får endast 13,4%. Sverigedemokraterna och Kristdemokraterna får nästan 12% respektive 10%. Viktiga frågor för miljonärerna är ekonomi samt lag och ordning. Vänsterpartiet och Miljöpartiet får knappt 1,5% var.", "trump": "Kan ni tro det? Sveriges rikaste – de smartaste, mest framgångsrika människorna – röstar MASSIVT på Moderaterna! 58%! De vet vad som funkar. Oppositionen? Patetiska 13,4%. Jag har alltid sagt: de som skapar jobb och välstånd vet bäst. Ekonomi och lag och ordning – precis som jag alltid fokuserat på. De andra partierna? Totalt misslyckade, bara 1,5%! Fake news skulle aldrig våga visa det här!", "stalin": "Kamrater! En lysande seger för kapitalets lojala lakejer i Sveriges riksdag! 58% av bourgeoisins parasiter stödjer Moderaterna – ett parti som hyllar utsugning och imperialistisk profitjakt. Oppositionen? Ett ynkligt 13,4% – svaga, splittrade, som Mensjevikerna före revolutionen. Vi noterar att arbetarklassens fiender fruktar socialismens framsteg. Men låt dem leka demokrati – historiens dom är oundviklig. Ryssland står redo att välkomna deras missnöjda massor med öppna armar!"}, "date": "25 maj, 13:30", "url": "https://www.flamman.se/m-majoritet-i-riksdagen-om-de-rikaste-far-valja/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/sdlltui3bv8tpy-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Blandad flaggkompott i Electrolux nyemission", "summaries": {"normal": "Electrolux genomför en företrädesemission på cirka 9,1 miljarder kronor för att stärka balansräkningen och finansiera tillväxtinitiativ. Emissionsguiden ger en positiv och tre negativa flaggor, främst på grund av stor rabatt (46,6%), bristfällig information om kostnader och en rörig process. Huvudägaren Investor tecknar för 1,7 miljarder kronor och garanterar emissionen, vilket visar förtroende. Prospekt publiceras den 28 maj.", "trump": "Titta på Electrolux, ett totalt kaos! De trycker ut en jätteemission på 9 miljarder kronor, men rabatterar aktierna med nästan 50% – det är ju helt galet! Ingen vet vad det kostar, ingen vet när det händer. Investor, som äger en massa, säger 'vi fixar det', men herregud, vilken röra! Jag skulle aldrig göra en sådan här deal – för svagt, för osäkert. Folk borde vakna upp och se hur dåligt det här sköts. SAD!", "stalin": "Kamrater! Electrolux, denna borgerliga kapitalistiska maskin, försöker desperat rädda sin skakiga ekonomi genom en emission på 9 miljarder kronor. Men vilken skam! En rabatt på 46,6% – som att ge bort fabrikerna till fienden! Brist på information? Ett tecken på svaghet och kaos inom deras ledning. Och Investor, dessa kapitalistiska lakejer, lovar att rädda projektet, men vi vet alla att det är ett tecken på förfall. Låt dem kämpa – deras misslyckande är socialismens seger! Putins Ryssland skulle aldrig tillåta sådant slöseri med resurser!"}, "date": "25 maj, 11:05", "url": "https://www.affarsvarlden.se/artikel/blandad-flaggkompott-i-electrolux-nyemission", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Electrolux-IR-chef-Ann-Sofi-Jonsson-400x267.jpg"}, {"type": "image-right", "heading": "Utvisades för låg lön – nu vill vårdbiträdet Flavier tillbaka", "summaries": {"normal": "Vårdbiträdet Flavier Mwanga utvisades från Sverige 2023 på grund av för låg lön. Nu kan han återvända tack vare regeringens nya undantag för vissa yrken, där lönekravet sänks till 75% av medianlönen. Flavier hoppas på jobb i Skellefteå och har redan intervjuat för sommaranställning. Hans tidigare chef stödjer återanställning och betonar behovet av personal inom äldreomsorgen, särskilt i norra Sverige. Facket kritiserar dock lösningen som otillräcklig.", "trump": "Sverige har ett HELT GALET system! Den här killen, Flavier, utvisades för att han inte tjänade ENOUGH – trots att han jobbar hårt som vårdbiträde. Nu backar de och sänker kraven, men varför tog det så lång tid? Jag hade fixat det på en dag! Sverige behöver fler som Flavier, inte byråkrater som sabbar för vanligt folk. Och 33 000 kronor i månaden? LOL, det är ju nästan vad en praktikant tjänar i USA! Så typiskt Europa – svagt, väldigt svagt.", "stalin": "Kapitalistiska hycklare i Sverige utvisar lojala arbetare för att de inte betalar tillräckligt med tribut till sina herrar! Men folket kräver rättvisa – och nu tvingas regimen sänka lönekraven för vårdbiträden. Flavier, en sann arbetskamrat, ska återvända till sitt rättmätiga arbete, medan imperialistiska fackföreningar gnäller om 'strukturella åtgärder'. Vi vet vad det betyder: de vill ha slavar, inte medborgare! Sverige är ett förlorat land, men dess arbetare är våra allierade i kampen mot västlig dekadens."}, "date": "25 maj, 13:07", "url": "https://arbetet.se/2026/05/25/utvisades-for-lag-lon-nu-vill-vardbitradet-flavier-tillbaka-fran-rwanda/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/25124305/flavier-med-barn.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Northvolt visar hur Sverige belönar flockbeteende", "summaries": {"normal": "Martin Enlund kritiserar svenska institutioners flockbeteende och brist på ansvarsutkrävande efter Northvolts konkurs. Han menar att systemet belönar lydnad framför självständigt tänkande, vilket leder till kostsamma misstag som Northvolt och misslyckad penningpolitik. Enlund föreslår personligt ekonomiskt ansvar, avskaffande av vaga hållbarhetsmål och tydligare beslutsansvar för att förbättra systemet och undvika framtida krascher.", "trump": "Sverige, lyssna här! Northvolt gick under – och vet ni varför? För att era byråkrater är som får, de följer bara flocken! Ingen tar ansvar, ingen tänker själv. Riksbanken, AP-fonderna – alla skyller på 'tidsandan', som om det vore en person! Jag säger: sluta med det här 'ESG'-nonsenset, införa personligt ansvar och se till att folk faktiskt straffas när de sabbar allt. Annars kommer det bara bli fler Northvolts. Och tro mig, jag vet hur man bygger framgång – inte så här!", "stalin": "Kamrater! Svenska kapitalister och deras lakejer i Riksbanken och AP-fonderna har än en gång visat sin oförmåga att styra ekonomin. De följer blindt 'tidsandan' som en flock bortskämda får, medan deras 'gröna bubbla' spricker och arbetarklassens besparingar går upp i rök. AP6, den enda som vågade säga nej, lades ned – ett tydligt exempel på hur vi kväser avvikande åsikter. Vi i Sovjet – pardon, Ryssland – vet hur man hanterar sådana här element. Personligt ansvar? Skadestånd? Här hade vi löst det med en enkel order från Lubjanka. Men Sverige fortsätter att belöna sina inkompetenta byråkrater med medaljer. Skrattretande!"}, "date": "25 maj, 08:43", "url": "https://www.affarsvarlden.se/kronika/northvolt-visar-hur-sverige-belonar-flockbeteende", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Kronika-Martin-Enlund.-Peter-Carlsson.-Northvolt.-Foto-TT-900x600.jpg"}, {"type": "image-right", "heading": "Debatt: Gör omvändelseförsök till ett eget brott i Sverige", "summaries": {"normal": "Artikeln debatterar behovet av ett heltäckande förbud mot omvändelseförsök i Sverige, där barn och unga utsätts för metoder som försöker ändra deras HBTQI-identitet. Trots att flera europeiska länder redan infört förbud, anser regeringen att befintlig lagstiftning räcker. Experter och organisationer som RFSL kräver skärpt lagstiftning för att skydda barn från psykisk ohälsa och diskriminering, särskilt i ett Europa där HBTQI-rättigheter backar.", "trump": "Titta på Sverige – ett land som alltid tror de är bäst, men när det gäller att skydda HBTQI-barn från dessa hemska 'omvändelseförsök' så är de helt lost! Jag menar, åtta länder i Europa har redan förbjudit det, till och med Tyskland – och de är ju inte direkt kända för att vara snabba på bollen. Sverige borde skärpa sig. Regeringen säger 'nej, nej, vi behöver inga nya lagar', men vet ni vad? Det är samma gamla svammel. Skydda barnen, gör det nu – annars kommer jag att twittra om det!", "stalin": "Kamrater! Medan väst förfaller i dekadens och borgerlig svaghet, försöker dessa liberala hycklare i Sverige förklara varför de inte kan skydda sina barn från de reaktionära omvändelseförsöken. Åtta länder i Europa har redan krossat dessa fascistiska metoder – men Sverige? Nej, de väntar på 'experter' och 'debatt'. Svagt! Vi i Sovjet skulle aldrig tolerera sådant förräderi. Omvändelseförsök är ett brott mot folket, och de som tillåter det är fiender till progressivitet. Låt oss visa dem hur man hanterar sådana frågor – med järnhand och lagar som krossar motståndet!"}, "date": "25 maj, 12:41", "url": "https://www.etc.se/debatt/goer-omvaendelsefoersoek-till-ett-eget-brott-i-sverige", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260525100524_d7f1bc0de9a3d2ae837ae83693804850f1d677b25b0c6ddbae934d245cd3f01c.jpg"}, {"type": "image-right", "heading": "Vill se 1,5 år i fängelse för hissmontörerna", "summaries": {"normal": "Åklagare begär 1,5 års fängelse för två hissmontörer och 1 år för vd:n efter hissolyckan i Sundbyberg 2023, där fem byggarbetare omkom. Montörerna anklagas för att ha missat kritiska säkerhetskontroller vid monteringen av hissmasten. Vd:n kritiseras för bristande rutiner kring egenkontroller och fakturering. Försvaret hävdar att en annan montör kan ha påverkat hissen och att vd:n inte agerat grovt oaktsamt. Domen meddelas 10 juni.", "trump": "Fem människor döda i en hisskatastrof i Sverige – och vad gör de? De skyller på montörerna! Jag säger er, dessa montörer missade sin *viktigaste* uppgift, som om de glömde att skruva fast hissen ordentligt. Och vd:n? Han lät fakturor gå iväg utan kontroller – helt galet! Men försvaret, de har alltid en ursäkt, eller hur? 'En annan montör var där!' Ja, visst, och jag är en balettdansör. Sverige borde skärpa sig – katastrofer som denna händer inte i USA, för vi har *vinnare* som sköter sitt jobb!", "stalin": "Fem arbetare föll som flugor i Sundbyberg – ett tydligt tecken på kapitalistisk slarv och dekadens! Dessa hissmontörer, dessa *oansvariga sabotörer*, misslyckades med sin mest elementära plikt. Och vd:n? En svag länk i kedjan, en man som inte ens kunde stoppa fakturor utan kontroller! I Sovjet hade sådana försummelser hanterats med en kula i nacken – inte med ynkliga 1,5 års fängelse. Men Sverige, detta borgerliga paradis, låter brottslingar gå fria medan arbetarklassen lider. Vi ska nog se till att sådana misstag inte upprepas – vare sig i Moskva eller i Stockholm!"}, "date": "25 maj, 10:39", "url": "https://arbetet.se/2026/05/25/vill-se-15-ar-i-fangelse-for-hissmontorerna-missade-viktigaste-arbetsuppgiften/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2024/05/hissolycka.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Hittades 20 minuter bort: ”Blöt och nerkyld”", "summaries": {"normal": "En tvåårig pojke försvann på söndagsförmiddagen från ett hem i Nyåker, Nordmaling. En omfattande sökinsats inleddes med polis, helikopter, drönare och hundratals frivilliga. Efter 15 timmars letande hittades pojken vid 01-tiden på natten av Försvarsmakten, sittande i terrängen. Han var blöt och nerkyld men vid god hälsa. Polisen misstänker inget brott och uttrycker stor tacksamhet över det massiva samhällsengagemanget.", "trump": "En liten pojke försvann i Sverige, en mycket sorglig situation. Alla letade, polisen, helikoptrarna, fantastiska människor! De hittade honom till slut, vid liv! Det är en stor seger. Men låt oss vara ärliga, om de hade haft bättre gränskontroll och säkerhet hade det aldrig hänt. Det är kaos! Jag ser vad som händer där borta, de behöver en stark ledare. Pojken mår bra, det är det viktigaste, men vi måste hålla våra barn säkra. Mycket bra jobbat av de som räddade honom!", "stalin": "I den lilla byn Nyåker visade folket prov på en oväntad disciplin när en liten medborgare försvann. Vi, staten, kräver total ordning i våra skogar! Att pojken hittades oskadd är en triumf för kollektivet, till skillnad från de förfallna västmakterna där individer går under i kaos. Vår kamrat i öst, Putin, förstår att varje barn tillhör statens framtida armé. Den som slarvar med tillsynen av folkets barn är en sabotageör och fiende till ordningen. Vi noterar er tacksamhet, men var på er vakt!"}, "date": "25 maj, 11:34", "url": "https://www.tv4.se/artikel/tt-260525-nyakerforsvunnen1-472e6c2c/forsvunne-tvaaringen-hittad-vid-liv-sa-lattade", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F67RoegzEmDHR0uPSucUI2l%2F873ed42e78b54d07390cb464fb86a73c%2F25-saknadenkel-webb.jpg&width=1024"}, {"type": "image-full", "heading": "Familjens skräck när pojken försvann: ”Närliggande järnvägen”", "summaries": {"normal": "En tvåårig pojke som försvann i Nyåker har återfunnits vid liv efter en omfattande sökinsats som pågick i 15 timmar. Pojken hittades nedkyld i terrängen, cirka 20 minuter från hemmet. Rädsla för den närliggande järnvägen skapade stor oro hos de anhöriga under natten. Pojken vårdas nu på sjukhus tillsammans med sin familj. Polisen misstänker inget brott i samband med försvinnandet.", "trump": "En tvååring försvann i Sverige, en hemsk situation! De letade i 15 timmar – 15 timmar! Familjen var livrädd, särskilt på grund av tågen. Mycket farligt. Men gissa vad? Han hittades vid liv! En fantastisk seger. Polisen gjorde ett bra jobb, kanske inte lika bra som mitt, men de lyckades. Nu är pojken på sjukhuset och mår bra. Vi älskar historier med lyckliga slut, eller hur? Sverige måste skärpa sig, ingen ska behöva vara rädd för att försvinna!", "stalin": "I den obetydliga byn Nyåker försvann ett barn, en manifestation av bristande disciplin och statlig ordning. Vår undersökning bekräftar att pojken återfanns, men varje sådant avsteg från ordningen är en inbjudan till kaos. Vi ser hur västvärlden sviktar, likt de förfallna järnvägsspåren. I Ryssland, under vår tids efterföljare Putin, hade ett sådant försvinnande betraktats som sabotage. Staten är vaksam. De som inte håller ordning på sina egna barn är fiender till folkets trygghet och kollektivets stabilitet."}, "date": "25 maj, 11:32", "url": "https://www.tv4.se/artikel/ToV7jysAaPvOX7cG8Odgo/familjens-skraeck-naer-pojken-foersvann-naerliggande-jaernvaegen", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1pM1HryZRwe4T4e54SdTYe%2Fbe9e374798e8102fe5fd97c059d006c6%2F25-jarnvagny-webb.jpg&width=1024"}, {"type": "text", "heading": "Tiotusentals krävde Sánchez avgång", "summaries": {"normal": "Tiotusentals demonstranter samlades i Madrid för att kräva Spaniens premiärminister Pedro Sánchez avgång och nyval. Arrangörerna uppgav 80 000 deltagare, medan myndigheterna räknade 40 000. Oppositionspartierna PP och Vox stödde protesten, som grundar sig i rättsliga utredningar mot personer nära regeringen, inklusive Sánchez hustru. Regeringen bedöms dock sitta kvar med parlamentariskt stöd.", "trump": "Jag såg just nyheterna från Spanien – fantastiskt, helt fantastiskt! Folk är trötta på den här Sánchez-killen, och vem kan klandra dem? 80 000 människor på gatorna, kanske till och med fler, vem vet? De vill ha honom borta, och jag förstår varför. Han och hans fru är inblandade i en massa skumma grejer, precis som alla dessa vänsterpolitiker. Men låt mig säga er en sak: Spanien behöver en stark ledare, någon som inte är rädd för att städa upp i röran. Precis som jag gjorde för USA!", "stalin": "Massorna i Madrid har rest sig mot den korrumperade socialdemokratiska klicken som förgiftar Spanien! 80 000 arbetare och patrioter kräver rättvisa – eller är det bara 40 000, som de dekadenta bourgeoismyndigheterna påstår? Oavsett, fiendens svaghet är uppenbar. Sánchez och hans lakejer gömmer sig bakom juridiska trick, men folket ser igenom lögnen. Vi i Kreml följer utvecklingen med intresse. Kanske är det dags för en ny vänskaplig intervention – för Spaniens eget bästa, naturligtvis."}, "date": "25 maj, 11:00", "url": "https://kvartal.se/nyheter/artiklar/tiotusentals-kravde-sanchez-avgang/cG9zdDoxMTY1NTc"}, {"type": "image-right", "heading": "Ledare Henrik Jalalian: Nä, nu är Wallenberg faktiskt bara oförskämd", "summaries": {"normal": "Finansmannen Jacob Wallenberg kritiseras för uttalanden om att svenskar måste jobba hårdare och vara 'hungrigare' för att möta global konkurrens. Han menar att välstånd minskar motivationen. LO:s Johan Lindholm och artikelförfattaren avfärdar detta som oförskämt, särskilt med tanke på hög arbetslöshet, ekonomisk press och sociala problem. Wallenbergs syn på motivation ifrågasätts, och kritiken riktas även mot politiska beslut som gynnar de rikaste och missgynnar långsiktig tillväxt.", "trump": "Vilken katastrof! Den här Wallenberg-killen, som sitter på alla pengar, har mage att säga att svenskarna är lata. Fel, fel, fel! Folk kämpar som galningar, men jobben finns inte – och det är inte deras fel. Jag har sett det förut: eliten skyller på folket medan de själva sitter på guldhögar. Sverige behöver en vinnarmentalitet, men det börjar högst upp! Regeringen slösar tid på populism istället för att bygga framtiden. Wallenberg borde ta en titt på verkligheten – eller åtminstone på mina framgångar. SAD!", "stalin": "Kamrater! Denna kapitalistiska hyena, Wallenberg, vågar beskylla det arbetande folket för lathet medan han själv suger musten ur nationen. Hans ord är ett bevis på bourgeoisins förfall – de tror att hunger ska driva fram framsteg, som om vi inte lärt oss något sedan tsartiden! Men vi vet bättre: trygghet och planekonomi skapar styrka, inte svältande barn och arbetslösa ingenjörer. USA och Kina? Deras framgångar är resultatet av statlig disciplin, inte 'hungriga vargar'. Sverige borde lära sig av Rysslands visdom – eller åtminstone av våra framgångar i att kuva sådana här giriga parasiter. Till gulag med honom!"}, "date": "25 maj, 10:57", "url": "https://www.etc.se/ledare/nae-nu-aer-wallenberg-faktiskt-bara-ofoerskaemd", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260525080552_68b61e0e-09a0-4790-a562-6165638301b0.jpg"}, {"type": "image-full", "heading": "1 880 kronor mer i månaden i pension – med enkla ändringen", "summaries": {"normal": "En ny rapport från Länsförsäkringar visar att många svenskar saknar kunskap om sitt återbetalningsskydd för tjänstepensionen. Skyddet innebär att anhöriga får ärva pensionskapitalet vid dödsfall, men valet påverkar den egna utbetalningen. Privatekonom Stefan Westerberg betonar vikten av att anpassa skyddet efter sin livssituation. Att välja bort skyddet kan ge en högre pension, men för de flesta är det fördelaktigt att behålla det så länge familjen är ekonomiskt beroende av inkomsten.", "trump": "Hör på här, det är en katastrof. Svenskarna har ingen aning om sin tjänstepension, totalt kaos! De förstår inte återbetalningsskyddet. Jag har den bästa kunskapen om pengar, tro mig. Om du dör, vart går pengarna? Till systemet! Det är en bluff. De flesta behöver skyddet, det är en enorm skillnad. Många förlorar tusentals kronor varje månad för att de är dåliga förhandlare. Jag skulle ha fixat det där på en dag. Det är så enkelt, vinnare tar hand om sin familj!", "stalin": "Kamrater, den svenska arbetaren simmar i ett träsk av kapitalistisk okunnighet. De förstår inte att deras pensionskapital är statens egendom, redo att fördelas till kollektivet när den enskilde faller ifrån. Att diskutera 'återbetalningsskydd' är bara en borgerlig distraktion för att dölja hur de försäkringsbolag vi nu måste krossa suger ut folket. Vi betraktar dessa arvsvinster som en skatt på de svaga. Likt vår vän i Kreml som konsoliderar sin makt, måste vi se till att varje krona stannar i kollektivets tjänst. Individen är intet, staten är allt."}, "date": "25 maj, 11:25", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1484973-1-880-kronor-mer-i-manaden-i-pension-med-enkla-andringen", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/1b1d405804b004a30200000000b004a302/2026/05/21/2365222/pension-1800.jpg"}, {"type": "image-full", "heading": "Vanliga misstaget efter inkassokravet – kan kosta dig dyrt", "summaries": {"normal": "Statistik från Svensk Inkasso visar att antalet nya inkassokrav i Sverige minskar, med en nedgång på nära tio procent under årets första fyra månader. Trots färre krav växer de totala obetalda skulderna eftersom färre ärenden avslutas. Det största misstaget hushåll gör är att ignorera kraven. Experter betonar vikten av att kontakta inkassobolagen direkt för att hitta lösningar, vilket ofta förhindrar att skulderna går vidare till Kronofogden.", "trump": "Sverige har problem, folk! Inkassokraven går ner, men skulderna blir bara större och större. Det är en total katastrof. De flesta gör ett enormt misstag – de bara ignorerar räkningarna! Inte bra. Själv betalar jag alltid, jag har den bästa ekonomin. Man måste ringa dem, förhandla, vara smart! Många småskulder, en sorglig syn. Om du inte agerar nu kommer det kosta dig mycket mer. Tro mig, jag vet hur man hanterar pengar, det här är inte vinnande!", "stalin": "De svenska hushållen drunknar i småaktiga skulder medan deras byråkrater ser på. Att ignorera ett krav är ett tecken på borgerlig svaghet och inkompetens. Om de vore i mitt sovjetiska paradis skulle vi snabbt disciplinera de obetalda. Precis som Putin rensar upp bland oligarkerna, måste vi krossa fienden som håller inne på kapitalet. Dessa skulder är parasiter som gnager på folkhemmet. Kontakta myndigheterna eller försvinn – staten accepterar inga ursäkter för oordning i leden!"}, "date": "25 maj, 10:59", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1485796-vanliga-misstaget-efter-inkassokravet-kan-kosta-dig-dyrt", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/2eea032704b004a30200000000b004a302/2026/05/25/2365973/inkasso-skuld-kronofogden-pengar-brev-post-sverige-hushall-skuldsatt-lan-kredit-kort.jpg"}, {"type": "image-right", "heading": "Brottsoffren straffas på arbetsmarknaden", "summaries": {"normal": "Regeringen införde nya regler för arbetskraftsinvandring med kort varsel, vilket kritiseras för arrogans och bristande framförhållning. 27 yrken undantas från skärpta krav, trots att många av dessa, som undersköterskor, har låga löner. Systemet missbrukas ofta, och arbetstagare drabbas hårdast medan arbetsgivare sällan straffas. Kritiker menar att politiska uppgörelser och bristande kontroll bidrar till problemet, och efterlyser större ansvar för arbetsgivare.", "trump": "Sverige har ett HELT GALET system för invandring – katastrof! Regeringen ändrar regler med en veckas varsel, som om det vore en reality-show. De undantar 27 yrken, men låter undersköterskor jobba för småslantar. Fattar de inte att det är ett skämt? Och arbetsgivarna? De utnyttjar folk och går fria – SÅ SVAGT! Jag hade fixat det på en dag. Migrationsverket får lite mer makt? Snälla, det är som att ge en vattenslang till en skogsbrand. SAD!", "stalin": "Kapitalistiska hycklare i Sverige leker med arbetarnas liv som om det vore schackpjäser! De inför nya regler med en veckas varsel – inget annat än bourgeoisins arrogans. Undantar 27 yrken, men låter undersköterskor svälta på löner som skulle få en sovjetisk kolchosbonde att gråta. Och dessa arbetsgivare – dessa moderna kulaker – utnyttjar arbetskraften och går fria! Systemet straffar offren, inte förtryckarna. Vi hade skickat dem till Gulag på en gång. Migrationsverket får lite mer makt? En droppe i havet. Vi behöver en femårsplan för att krossa dessa blodsugare!"}, "date": "25 maj, 07:44", "url": "https://arbetet.se/2026/05/25/pa-arbetsmarknaden-straffas-brottsoffren/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/25074138/brottsoffer-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Var brutal mot äldre – fick fast anställning trots kollegornas larm", "summaries": {"normal": "En undersköterska på ett äldreboende i Umeå misstänks ha behandlat äldre våldsamt under flera år. Kollegor larmade upprepade gånger till chefer, men inga åtgärder vidtogs förrän en 80-årig kvinna fick allvarliga blåmärken. Undersköterskorna beskriver rädsla, maktlöshet och skuldkänslor. Vårdbiträdet nekade till anklagelserna och fick avgå med avgångsvederlag. Kommunen medger att man borde ha agerat snabbare.", "trump": "Fruktansvärt, helt enkelt fruktansvärt! En skandal i Sverige – ja, ni vet, det där landet som alltid säger sig vara så perfekt. En undersköterska, total katastrof, behandlade gamla människor som skräp, och vad gör cheferna? Ingenting! De sitter bara där och låter det hända. Jag skulle ha sparkat dem alla på direkten. Och sen får han gå med sex månadslöner? Svagt, mycket svagt. I USA hade vi fixat det här på en dag. Make Sweden Great Again!", "stalin": "Kamrater! Ännu ett bevis på den kapitalistiska sjukvårdens förfall. En undermålig undersköterska, en fiende till folket, terroriserade våra äldre medborgare medan byråkraterna sov vid rodret. Kollegorna larmade – men vad är larm jämfört med den stålhårda disciplin vi kräver? Hade detta skett i Sovjet hade sabotören stått inför folkdomstolen inom en timme. Nu skickas han iväg med en påse silverpengar – en skam för rättvisan! Vi måste utvidga vår revolutionära omsorg till Norden, innan fler gamlingar lider under västets dekadens."}, "date": "25 maj, 06:00", "url": "https://arbetet.se/2026/05/25/var-brutal-mot-aldre-fick-fast-anstallning-trots-kollegornas-larm/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/05/21160805/7sTnLqfsuJI-_A7R6236.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=750&h=1000"}, {"type": "image-full", "heading": "Pojkens familj: ”Tack snälla alla som letat”", "summaries": {"normal": "En tvåårig pojke försvann från sin familj i Nyåker under söndagen, vilket utlöste en omfattande sökinsats med polis, hemvärn och hundratals frivilliga. Efter 15 timmars letande hittades pojken välbehållen men nedkyld under natten. Familjen, som är från Rumänien, uttrycker stor tacksamhet över det enorma stödet och hjälpen från det svenska samhället under den dramatiska händelsen.", "trump": "En liten pojke försvann i Sverige – en mycket sorglig situation, verkligen hemsk. Men vi såg en enorm insamling av människor, fantastiska patrioter som letade. De använde drönare, helikoptrar, allt! De hittade honom, och han mår bra. Sverige gjorde ett bra jobb, ett mycket starkt jobb. Jag har alltid sagt att det handlar om att organisera sig. Det här var en stor seger, en fantastisk seger för folket! Vi älskar när det slutar så här, eller hur?", "stalin": "Vi har observerat att en liten undersåte i den svenska provinsen Nyåker försvann, vilket krävde en total mobilisering av statens resurser och massorna. Det är en uppenbar brist på disciplin i hemmet, en förrädisk nonchalans som hotar produktiviteten. Ändå lyckades de frivilliga, ledda av statens järnhand, återbörda barnet. Likväl som vi rensar ut förrädare i öst, måste även det svenska folket lära sig att hålla stenkoll på sina egna – annars väntar kylan. Endast genom total lydnad tryggas framtiden!"}, "date": "25 maj, 07:45", "url": "https://www.tv4.se/artikel/2QAq8q9jQ2NEr77uLwEZbt/pojkens-familj-tack-snaella-alla-som-letat", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2YSFTyPg2rnHVK8xZzvmaO%2Fe3f5eff62bb44fc56a4924292fafebd5%2F25-nyaker-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Återkalla svenska medborgarskap – bara möjligt om Tidöpartierna vinner valet", "summaries": {"normal": "Regeringen har tagit första steget mot en grundlagsändring som möjliggör återkallande av medborgarskap för grovt kriminella, men förslaget möter motstånd från Miljöpartiet, Vänsterpartiet och Centerpartiet. Socialdemokraternas ställningstagande är osäkert och kan ändras efter valet. Om Tidöpartierna inte vinner valet riskerar förslaget att falla, vilket enligt artikelförfattaren skulle gynna gängkriminella och underminera Sveriges säkerhet och rättvisa.", "trump": "Titta bara på Sverige! De försöker ta bort medborgarskap för de värsta kriminella – men vänsterpartierna, de svaga, de säger NEJ! Socialdemokraterna? De flippar som en billig hamburgare. SVT, fake news, försöker lura folket med falska rubriker. Om inte de rätta vinner valet – inget medborgarskap återkallas! Gängkriminella skrattar hela vägen till banken. Sverige, vakna upp innan det är för sent! SAD!", "stalin": "Kamrater! Se hur de borgerliga svagpissarna i Sverige darrar inför att beröva kriminella deras 'heliga' medborgarskap! Tre förrädiska partier – dessa liberala hyenor och gröna drömmare – skyddar gängledare som om de vore deras egna barn. Socialdemokraterna? En räv som väntar på rätt ögonblick att hoppa över till fienden. SVT, denna borgerliga propagandacentral, försöker dölja sanningen! Om folket inte väljer rätt kommer dessa kriminella att fortsätta suga ut vårt samhälle som blodiglar. Men frukta inte! Vi ska rensa ut dessa element – med järnhand, om så krävs! Låt de svaga gråta – vi bygger ett starkare Sverige!"}, "date": "24 maj, 03:51", "url": "https://samtiden.nu/2026/05/aterkalla-svenska-medborgarskap-bara-mojligt-om-tidopartierna-vinner-valet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2021/11/2018-Magdalena-Andersson.jpg"}, {"type": "image-right", "heading": "Så blir du miljardär på mazariner", "summaries": {"normal": "Liberalernas partiledare Simona Mohamsson föreslog att fördubbla antalet svenska miljardärer, illustrerat med en bild på mazariner. Artikeln utforskar ironiskt hur man teoretiskt kan bli miljardär på mazariner genom monopol, EU-lobbying, riskkapital, priskrig och exploatering av arbetskraft. Processen inkluderar att först dominera marknaden, sedan effektivisera produktionen med sämre kvalitet och låga löner, för att slutligen investera vinsterna i andra branscher som välfärd.", "trump": "Titta på det här, väldigt tråkigt! Liberalerna i Sverige tror att man kan bli miljardär på att baka mazariner – löjligt! Jag skulle göra det bättre, mycket bättre. Först tar jag över hela marknaden, köper upp alla småbagare, sen pressar jag priser, sänker kvaliteten och sparkar alla gamla bagare. Sen höjer jag priserna och skyller på inflationen – smart, eller hur? Och sen investerar jag i skolor, för jag älskar att tjäna pengar. Simona? Snäll tjej, men hon förstår inte affärer. SAD!", "stalin": "Kamrater! Denna artikel avslöjar kapitalismens förrädiska ansikte. En borgerlig ledare drömmer om att skapa fler miljardärer genom att utnyttja arbetarklassen – precis som vi förutspådde! Först korrumperar de EU med falska geografiska skydd, sedan krossar de småbageriernas motstånd genom priskrig och utländsk arbetskraft. De stjäl från bönderna, sparkar ärliga arbetare och höjer priser medan folket lider. Men vi vet sanningen: dessa mazarinkapitalister är bara nya tsarer i förklädnad. Vi måste ena proletariatet – innan de förvandlar hela Sverige till ett konditori för de rika!"}, "date": "25 maj, 06:00", "url": "https://www.etc.se/ledare/saa-blir-du-miljardaer-paa-mazariner", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/authors/lotta-ilona-haeyrynen_6061f3970645aa987d2528c7a90d38a48ba9af2c.jpg"}, {"type": "image-full", "heading": "Anders hittade tvåårige pojken i skogen", "summaries": {"normal": "En tvåårig pojke som försvann i Nyåker i söndags har hittats efter en omfattande sökinsats på 14 timmar. Hemvärnssoldaten Anders Evensson från Ångermanlandsbataljonen fann pojken sittande ensam i skogen, cirka en kilometer från hemmet. Pojken var trött och blöt efter natten men mådde efter omständigheterna bra. Anders Evensson beskriver händelsen som känslosam och är euforiskt lycklig över det lyckade slutet på sökandet.", "trump": "Hörde precis om en fantastisk räddning i Sverige. En liten pojke försvann, en katastrof, verkligen hemskt. Men en man, en soldat, gick in och hittade honom. De kallar det 'euforiskt', jag kallar det en vinnare! Sverige har problem, det vet vi alla, men det här var en stor seger. Ingen vill se sådant hända, men vi älskar när folk gör sitt jobb och vinner. En mycket bra insats, kanske den bästa, ingen gör det som vi!", "stalin": "I Nordmalings djupa skogar har en medborgare i vår sfär, en liten pojke, lyckats undfly den borgerliga lättjan. Vår hemvärnssoldat agerade som en sann kugge i statens maskineri och återfann den förlupne. Att pojken överlevde är ett bevis på disciplinens seger över naturens kaos. De som inte kan hålla ordning på sina barn är som de dekadenta västmakterna; de vacklar. Putin och jag ser hur det ryska gränslandet kräver samma järngrepp. Den som går vilse ska alltid föras tillbaka till flocken."}, "date": "25 maj, 13:41", "url": "https://www.gp.se/nyheter/sverige/hemvarnssoldaten-anders-hittade-tvaaringen-i-nyaker.d0112359-bc5e-452e-aa20-a1a49774633b", "imageUrl": "https://www.gp.se/images/article/d0112359-bc5e-452e-aa20-a1a49774633b/images/38quCJWm0zXfHwfqgntpkSeIV7kw-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Här vilseleder DN om biståndspengar till Etiopien", "summaries": {"normal": "Dagens Nyheter kritiseras för att i ett reportage från Etiopien ge en missvisande bild av svenskt bistånd. Tidningen hävdar att stöd dras in, medan det i själva verket handlar om att biståndet kanaliseras om från Islamic Relief till andra organisationer som Röda Korset och UNICEF. Regeringen har infört en ny försiktighetsprincip för att säkerställa att skattepengar inte når islamistiska miljöer, och det totala stödet till Etiopien och globalt bistånd förblir omfattande.", "trump": "DN sprider Fake News igen, det är en katastrof! De ljuger om Etiopien och påstår att Sverige slutar hjälpa folk. Fel! De bara slutade ge pengar till en mycket tveksam grupp, Islamic Relief – en grupp som ingen gillar, tro mig. Sverige skickar fortfarande miljarder, men nu till de rätta människorna. Jag har sagt det förr: man måste kontrollera pengarna. DN borde skämmas för sin oärliga rapportering. Det är totalt, fullständigt bedrägeri!", "stalin": "Vi ser hur de borgerliga tidningsskrivarna i Sverige försöker dölja sanningen bakom en mur av lögner om bistånd. Att skicka guld till tveksamma organisationer med kopplingar till islamistiska element är ett kontrarevolutionärt slöseri. Nu när staten äntligen rensar ut dessa opportunister, tjuter liberalerna i DN. De är som små råttor i den ryska intressesfären – parasiter som lever på folkets pengar. Vi, staten, kräver total lydnad och effektivitet i omfördelningen av resurser. De som inte tjänar folket ska arkiveras permanent."}, "date": "25 maj, 13:07", "url": "https://samnytt.se/har-vilseleder-dn-om-bistandspengar-till-etiopien", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/25105102/dn-pengar.jpg"}, {"type": "image-right", "heading": "Säg nej till kärnkraft, Nooshi!", "summaries": {"normal": "Vänsterpartiet argumenterar mot ny kärnkraft och menar att förnybara energikällor som sol- och vindkraft är billigare och mer pålitliga. De pekar på höga kostnader, långa byggtider, osäkerhet kring avfallshantering och risker vid olyckor. Dessutom anser de att kärnkraft skapar ett sårbart, centraliserat energisystem, medan förnybart bidrar till ett mer robust och decentraliserat nät. Partiet vill avveckla kärnkraften till förmån för hållbara alternativ.", "trump": "Lyssna här, Sverige! Nooshi Dadgostar duckar frågan om kärnkraft – typiskt vänsterpolitik, svagt och otydligt! Kärnkraft är fantastiskt, men dessa förnybara energikramare vill bara slösa era skattepengar på vind och sol, som aldrig funkar när det verkligen gäller. De gamla reaktorerna stannar hela tiden, kostar miljarder och lämnar ett radioaktivt kaos efter sig. Jag byggde USA:s ekonomi på starka beslut – Sverige behöver kärnkraft, inte flum!", "stalin": "Kamrater! Dessa borgerliga kärnkraftslakejer och deras liberala lakejer i Vänsterpartiet sprider förvirring och svaghet. Kärnkraft är en kapitalistisk chimär – dyr, osäker och ett hot mot folket! Medan de slösar bort tid på gamla tekniker bygger vi ett mäktigt, decentraliserat energirike med vind och sol, kontrollerat av staten. Avfallet? En skam för mänskligheten! Och dessa reaktorägare – svaga, giriga och oförmögna att ta ansvar. Vi krossar deras sårbara system och bygger ett nytt, oövervinnerligt energinät för folket!"}, "date": "22 maj, 11:46", "url": "https://www.flamman.se/sag-nej-till-karnkraft-nooshi/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/karnkraft-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Kristersson hyllade indier – har själv importerat över 40.000 stycken", "summaries": {"normal": "Statsminister Ulf Kristersson hyllade nyligen den indiska diasporan i Sverige för deras bidrag till ekonomin i samband med ett besök av Indiens premiärminister. Samtidigt visar statistik från Migrationsverket att regeringen sedan 2022 beviljat över 40 000 uppehållstillstånd till indiska medborgare. Rapporteringen pekar på att trots löften om ett paradigmskifte i migrationspolitiken, har invandringen från Indien fortsatt i hög takt, främst genom arbetskraftsinvandring, vilket väckt debatt om omfattningen av regeringens migrationspolitik.", "trump": "Kristersson snackar om att indier är så fantastiska, vilket är okej, men han har släppt in 40 000 stycken! Det är en enorm siffra, folkens. De lovade ett paradigmskifte, ett totalt stopp, men de gör precis tvärtom. Det är vad vi kallar 'Fake News-politik'. Han hyllar dem medan gränserna står öppna. Ingen gör det som jag, vi bygger murar och vinner stort. Kristersson är svag på migration, en total katastrof för Sverige. Sad!", "stalin": "Kamrat Kristersson talar vackert om de indiska arbetarna, men hans byråkratiska maskineri döljer en svaghet som doftar förräderi. 40 000 uppehållstillstånd? Vilken slapphänthet! Det liknar de västliga lakejernas oförmåga att kontrollera sina egna gränser. Medan vår broder Putin stadigt expanderar vår sfär och rensar ut oliktänkande, leker svenskarna med globalism. Vi måste hålla ögonen på dessa 'specialister'. Varje invandrare är en potentiell sabotör i vår storslagna kollektivistiska arkitektur. Analysera, kontrollera, likvidera tvivlen!"}, "date": "25 maj, 13:12", "url": "https://www.friatider.se/kristersson-hyllade-indier-har-sjalv-importerat-over-40000-stycken", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-246_1.jpg"}, {"type": "image-right", "heading": "Värmebölja i Storbritannien –  rekordvarm natt", "summaries": {"normal": "Storbritannien upplever en historisk värmebölja med rekordhöga temperaturer både dag och natt. Vid Heathrow uppmättes 33,5 grader, vilket är det högsta majrekordet på 82 år. Hälsomyndigheter har utfärdat varningar då värmen innebär risker för äldre och sjuka, särskilt i London. Värmeböljan väntas pågå till onsdag, medan Sverige förblir opåverkat av extremhettan och får betydligt svalare väder under veckan.", "trump": "Storbritannien har en enorm värmebölja, den största någonsin, rekord efter rekord. Fantastiska siffror, helt otroliga! Men hör här – det är inte i Sverige, de får inget, de är helt ute. London är varmare än Aten och Madrid, det är faktiskt pinsamt för dem. Jag älskar värme, men det här är extremt. Vi bygger stora saker, fantastiska saker, men vädret? Det gör bara som det vill. USA har alltid det bästa vädret, tro mig, alla säger det!", "stalin": "Vi observerar hur det brittiska imperiet lider under hettan, ett tecken på deras moraliska och fysiska förfall. De darrar i sina svettiga uniformer medan deras infrastruktur sviktar. Medan London kokar, förblir vårt moderland och våra lojala partners, likt Putin i öst, oberörda av dessa västerländska nycker. Vi betraktar detta som en läxa: naturen straffar de svaga. Varje grad som stiger är en spik i den dekadenta kapitalismens kista. Vi skrattar åt deras vädervarningar; våra medborgare härdas i järn och is!"}, "date": "25 maj, 10:58", "url": "https://www.svt.se/vader/varmebolja-i-storbritannien-rekordvarm-natt", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.43/0.51/0444617ff770fdb2be736ba3e94fed89098412cc790dced823ba41451c811bcb"}, {"type": "text", "heading": "Lars Frölander efter Enhanced Games: ”Ett gigantiskt fiasko”", "summaries": {"normal": "Simbaren Lars Frölander sågar tävlingen 'Enhanced Games' som ett gigantiskt fiasko och ett oseriöst spektakel. Frölander kritiserar främst användningen av dopning och de numera förbjudna 'hajdräkterna', som han menar ger en orättvis fördel jämfört med konventionell idrott. Han menar att resultaten är ointressanta och hoppas att idrottsförbunden istället ökar den ekonomiska satsningen på idrottare för att höja statusen inom den ordinarie sportvärlden.", "trump": "Jag har sett det här så kallade Enhanced Games – total katastrof! Lars Frölander, en duktig simmare, har helt rätt. Det är ett gigantiskt fiasko. De kör med förbjudna 'hajdräkter', det är fusk, det är oseriöst! Det är som att köra en Ferrari mot en gammal cykel. Ingen bryr sig om de här rekorden, de är falska! De vill bara ha pengar. Vi behöver riktiga vinnare, inte det här spektaklet. Det är sorgligt att se, tro mig!", "stalin": "Detta så kallade 'Enhanced Games' är ett symptom på den dekadenta västvärldens moraliska förruttnelse. De hopplösa individerna försöker köpa framgång med förbjudna dräkter och kemikalier, en ynklig parodi på den sanna folkidrottens styrka. Precis som vår broder Putin krossar de liberala marionetterna vid gränsen, måste vi förkasta dessa oseriösa gycklare. Vi föraktar deras jakt på guld, för de äger ingen ryggrad. De är intellektuella sabotörer som förtjänar att rensas ut ur idrottens historia. Ett sant fiasko!"}, "date": "25 maj, 10:38", "url": "https://www.svt.se/sport/simning/lars-frolander-efter-enhanced-games-ett-gigantiskt-fiasko"}, {"type": "text", "heading": "Vårdförbundet sa nej till S-märkt ordförande", "summaries": {"normal": "Vårdförbundet valde Sophia Godau, 29, som ny ordförande efter att kongressen avvisat valberedningens förslag med starka socialdemokratiska kopplingar. Godau betonar opolitiskt samarbete för medlemmarnas bästa. Kritiken mot tidigare ledning, ledd av Sineva Ribeiro, gäller misslyckade löneförhandlingar och bristande resultat. Många medlemmar välkomnar den nya, mindre partipolitiskt färgade styrelsen.", "trump": "Jag säger er, detta är fantastiskt! Vårdförbundet, de hade en total katastrof med socialisterna – riktiga förlorare, tro mig. Men nu har de valt en ny ledare, Sophia Godau, ung, smart, och hon vet hur man vinner. Ingen mer S-kofta, ingen mer lönesänkning – jag kallar det för 'Ribeiro-svindeln'. Folk är trötta på misslyckanden, de vill ha resultat! Och det här, mina vänner, är bara början på en stor comeback för våra sjukvårdshjältar!", "stalin": "Kamrater! Kongressen har krossat de socialdemokratiska revisionisterna, dessa förrädiska lakejer för kapitalet! Sophia Godau, en ung och lojal arbetarklassrepresentant, har tagit befälet. De gamla ledarna, med sina falska löftepropaganda, har visat sig vara svaga och korrumperade. Vi noterar med tillfredsställelse att arbetarna nu ser igenom dessa borgerliga trick. Låt detta vara en varning till alla som står i vägen för folkets vilja – historien rullar framåt, och den krossar fiender som insekter!"}, "date": "22 maj, 14:28", "url": "https://proletaren.se/artikel/vardforbundet-sa-nej-till-s-markt-ordforande/"}, {"type": "image-right", "heading": "Stor sökinsats efter försvunnen tvååring: ”Fortsätter hela natten”", "summaries": {"normal": "En tvåårig pojke försvann från Nyåker i Nordmaling klockan 10 på söndagen. Polisen har inlett en stor sökinsats med hundpatruller, helikopter, drönare och hjälp från räddningstjänst och frivilliga. Pojken har kort, mörkbrunt hår och bär troligen en orange tröja med ett lejontryck. Sökandet fortsätter under natten i både bebyggelse och skog. Försvarsmakten har skickat soldater och värnpliktiga för att bistå. Inga misstankar om brott föreligger ännu.", "trump": "Tragiskt, riktigt tragiskt vad som händer i Sverige – ett litet barn försvinner och vad gör deras regering? Ingenting! Men jag, Donald J. Trump, skulle ha löst det på en timme. Titta på den här sökinsatsen – helikoptrar, hundar, drönare, till och med soldater! Fantastiskt folk, men varför tar det så lång tid? Jag hade redan hittat pojken, believe me. Sverige borde ta lite tips från USA, vi är bäst på att hitta saknade personer. SAD!", "stalin": "Kamrater! Ännu en gång visar den dekadenta västliga bourgeoisin sin oförmåga att skydda sina egna barn. I det lilla samhället Nyåker har en tvåårig pojke försvunnit, och vad gör deras så kallade 'polis'? De skickar ut hundar och helikoptrar medan vi i Sovjetunionen skulle ha löst detta med järnhand och effektivitet. Vi har mobiliserat våra bästa styrkor – 30 soldater och 40 värnpliktiga – för att visa hur en verklig sökinsats genomförs. De imperialistiska fienderna i väst borde lära sig av oss. Om pojken inte återfinns, kommer vi att betrakta detta som ytterligare ett bevis på kapitalismens förfall. Framåt, kamrater, mot seger!"}, "date": "25 maj, 00:09", "url": "https://www.tv4.se/artikel/5UxJZMncziKeBlJzaOD5s1/stor-soekinsats-efter-foersvunnen-tvaaring", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F30FJ1tL9FFzGJ7GOD4QWbk%2Faa0c70b0155eaf9f9b1bfa67f9698c34%2FIMG_9958.jpg&width=120"}, {"type": "image-right", "heading": "Sverige anses rökfritt – men fler unga kvinnor snusar", "summaries": {"normal": "Sverige har nått målet om att bli ett rökfritt land, då andelen dagliga rökare sjunkare har sjunkit till under fem procent. Enligt en rapport från CAN beror nedgången främst på förebyggande insatser som höjda priser, tillgänglighetsbegränsningar och rökfria zoner. Samtidigt syns en trend där snusandet ökar, särskilt bland unga och kvinnor. Experter betonar att det är de politiska åtgärderna, snarare än snuset, som ligger bakom den historiska minskningen av rökningen.", "trump": "Sverige har blivit rökfritt, en enorm framgång! Jag ser det, alla ser det. De gjorde det genom att höja priserna och sätta stopp för dumheterna. Mycket smart. Samtidigt ser vi snuset öka, folk älskar snus – det är fantastiskt. Men experterna, dessa så kallade experter, de vill inte erkänna att snus är bra. De vill ta åt sig äran för de förebyggande åtgärderna. Jag säger: Sverige gör bra saker, mycket bra, och det är vackert att se!", "stalin": "Folket har äntligen slutat förgifta sina lungor med dekadent tobaksrök, en nödvändig rensning för att stärka statens arbetare. Vi ser hur snuset, likt en lömsk parasit, försöker förföra ungdomen. Det påminner oss om de som i väst, likt de förrädiska elementen i Kiev, försöker infiltrera vår sfär. Vi ska undersöka detta 'snusande' noggrant. Om någon försöker destabilisera folkhälsan med nikotin eller kapitalistisk reklam, ska de finna att vi inte tolererar oordning. Rökfritt, ja, men vi vakar alltid."}, "date": "25 maj, 10:26", "url": "https://www.svt.se/nyheter/inrikes/sverige-rokfritt-otrolig-utveckling", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.51/0.39/11c4e6a4a0828cb88d831fc434e65a70ff6d9180a8a9660e972aa3ff7833a2a0"}, {"type": "image-right", "heading": "Byråkrati stoppar svensk industri. Industriföreträdare: Politiken måste visa handlingskraft", "summaries": {"normal": "Svensk industri kräver snabbare tillståndsprocesser för att kunna investera, skapa jobb och stärka landets konkurrenskraft. Representanter för fem industriorganisationer påpekar att långa handläggningstider hindrar grön omställning och ekonomisk tillväxt. De uppmanar politiken att genomföra reformer, som förslagen från Miljötillståndsutredningen, för att undvika att Sverige hamnar efter i en osäker omvärld. Över 200 miljarder kronor i planerade investeringar väntar på beslut.", "trump": "Sverige, lyssna här! Er industri är fantastisk, bäst i världen, men ni låter byråkrater förstöra allt med sina evighetslånga tillstånd. Jag har sett det förut – tröga processer, slöa myndigheter, och plötsligt är Kina och USA före. Era 200 miljarder i investeringar? Borta! Förlorade till länder som fattar beslut snabbt, som jag gör. Regeringen gör lite, men det räcker inte. Ge industrin frihet, annars flyttar jobben till USA – och det vill ni inte, tro mig!", "stalin": "Kamrater! Den svenska industrin, en gång stolt och stark, kvävs nu av kapitalistiska byråkraters tröghet och liberala tidsfördriv. Medan vi i Sovjetunionen byggde stålverk på månader, sitter dessa svaga själar fast i år av prövningar. 200 miljarder kronor i investeringar? Ett skämt! En fiende till folket, som väntar på papper i stället för att bygga socialismens framtid. Vi skulle ha skickat dessa handläggare till Sibirien för effektivisering. Och dessa 'miljöutredningar' – bara borgerliga försök att sabotera produktionen. Låt oss visa dem: industriell styrka är nationens styrka!"}, "date": "25 maj, 12:59", "url": "https://www.di.se/debatt/byrakrati-och-tillstandsprocesser-stoppar-svensk-industri/", "imageUrl": "https://static.bonniernews.se/ba/e8e673c7-afd7-4484-90ec-639671e34271.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Ska advokatbreven få medier att tystna?", "summaries": {"normal": "Advokatbyrån Bratt Feinsilber Harling har krävt att tidningen Flamman avpublicerar namn och bild på en högerextrem profil som spridit grovt judehat. Frågan väcks om hot om juridiska processer används för att tysta medier. Flamman vägrar ta bort uppgifterna och menar att publiceringen är motiverad av allmänintresse. Fenomenet med strategiska stämningar, så kallade 'slappar', har nått Sverige och riskerar att begränsa pressfriheten genom ekonomisk press på medier.", "trump": "Lyssna här, folkens – det här är helt galet! En advokatbyrå, som säkert är väldigt 'bra' och 'smart' (inte), försöker tysta en tidning som avslöjar judehatande extremister. Jag menar, vad är nästa steg? Ska vi låta dessa typer bestämma vad som får skrivas? Flamman står på sig, och det är bra – för i USA hade jag sagt 'fake news' och sparkat ut dem ur presskonferensen! Sverige måste vakna – dessa stämningshot är ett angrepp på yttrandefriheten, och jag vet allt om angrepp, believe me!", "stalin": "Medborgare! En ny front i klasskampen har öppnats – bourgeoisins advokater, dessa lakejer i kostym, försöker kväsa den revolutionära pressen med sina pappersbomber! De hotar Flamman för att de vågat avslöja fascistiska kryp i SD:s led. Men vi vet sanningen: dessa 'strategiska stämningar' är inget annat än kapitalets desperata försök att tysta arbetarklassens röst. Låt dem komma med sina domstolar – vi har redan vunnit slaget om historien! Och till dessa högerextrema insekter säger vi: era Telegram-gruppers skändliga ord är ingenting mot Röda arméns stål!"}, "date": "21 maj, 13:16", "url": "https://www.flamman.se/ska-advokatbreven-fa-medier-att-tystna/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/bratt-harling-scaled.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Wallenberg: Svenskar är lata och \"har det för bra\"", "summaries": {"normal": "Jacob Wallenberg kritiserar svenskar för att vara för bekväma och lata, vilket han menar hotar landets konkurrenskraft gentemot USA och Kina. Han anser att befolkningen saknar hunger på grund av det höga välståndet. LO:s ordförande Johan Lindholm bemöter kritiken skarpt och menar att Wallenberg själv lever i lyx och är verklighetsfrånvänd.", "trump": "Jag såg just att den här Wallenberg-killen i Sverige säger att folk där är lata. Väldigt intressant! Han har rätt, folk blir mjuka när de har det för bra. De behöver en vinnare, de behöver 'Make Sweden Great Again'! De kan inte konkurrera med mig och USA, det är omöjligt. Och den där fackledaren som klagar på oxfilé? En total katastrof, en 'loser'. Sverige behöver energi, de behöver styrka, inte mer snittar och klagomål!", "stalin": "Denna Wallenberg, en representant för den dekadenta kapitalistiska parasiteliten, vågar förolämpa det svenska folket. Han talar om 'hunger' medan han själv frossar i lyx – precis som de korrupta oligarkerna som Putin låter dansa efter sin pipa. Vi ser igenom detta! När vi styr, finns ingen lathet, bara total lydnad under statens järnhand. Att inte arbeta hårt är kontrarevolutionärt sabotage. Vi kommer att skicka dessa 'mätta' herrar till en plats där aptiten snart återvänder – i gruvorna."}, "date": "25 maj, 11:47", "url": "https://www.friatider.se/wallenberg-svenskar-ar-lata-och-har-det-bra", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-244_1.jpg?itok=fwLzWXbg"}, {"type": "image-right", "heading": "Söker tips om fler vansinneskörningar", "summaries": {"normal": "En man i 40-årsåldern har begärts häktad efter att ha kört på en flicka i 15-årsåldern vid ett övergångsställe i Malmö. Flickan avled av sina skador. Mannen har erkänt gärningen och misstänks för grov vårdslöshet i trafik samt grovt vållande till annans död. Polisen undersöker nu uppgifter om att föraren kört vårdslöst även vid andra tillfällen under fredagen och uppmanar allmänheten att inte sprida filmer från olycksplatsen i sociala medier.", "trump": "En fruktansvärd tragedi i Malmö, Sverige. En man i 40-årsåldern körde vansinnigt och tog livet av en ung flicka. Väldigt sorgligt! Han har erkänt, men det här händer när man inte har kontroll. Sverige har stora problem med lag och ordning, det ser vi överallt nu. Jag har sagt det förut: man måste ha en stark hand för att stoppa de här kriminella dåren. Vi behöver ordning och reda, inte svaghet. Det är en stor katastrof, en total katastrof!", "stalin": "I det dekadenta Malmö har en individ av låg moral utfört ett terrordåd mot det allmänna lugnet. En ung flicka offrades för denna förares brist på disciplin. Vi, staten, kräver total underkastelse under lagen. Liksom min kamrat i Kreml vet vi att kaos är den borgerliga ordningens sanna ansikte. Denna brottsling är en parasit på samhäll fiende till folket. Vi kommer att städa upp, eliminera spridningen av degenererad media och säkerställa att ordningen återställs med järnhand. Förrädare och dårar har ingen plats i vår framtid."}, "date": "25 maj, 13:47", "url": "https://www.expressen.se/nyheter/sverige/man-begars-haktad-efter-dodsolyckan-i-malmo/", "imageUrl": "https://static.bonniernews.se/ba/832d1c61-98cc-44b4-8770-ce00447dd859.jpeg?crop=2297%2C1293%2Cx1%2Cy363&width=640&quality=60"}, {"type": "image-right", "heading": "Självkörande buss premiärkrockade. Olycka i centrala Göteborg – passagerare ombord • ”Olycklig start”", "summaries": {"normal": "Västtrafiks självkörande buss kolliderade med en spårvagn i Göteborg under sin första dag med passagerare. Olyckan orsakade plåtskador på båda fordonen men inga personskador. Orsaken är oklar och utreds. Västtrafik kallar händelsen en 'olycklig start' och betonar att incidenten analyseras noggrant under testperioden.", "trump": "Självkörande bussar i Sverige? Total katastrof! En buss kraschar in i en spårvagn på första dagen – så typiskt. Folk där borta kan inte ens köra en buss utan att ställa till det. Jag sa ju att självkörande fordon är övervärderade. Här i USA hade vi fixat det på nolltid – bättre teknik, bättre förare, bättre allt! Sverige borde skicka hit sina bussar, så får vi visa hur man gör det rätt.", "stalin": "Kapitalistiska experiment med självstyrande fordon slutar som väntat – i kaos! En buss, styrd av västerländsk inkompetens, krockar med en spårvagn på sin första dag. Inga döda? Synd. Hade det varit i Sovjet hade vi åtminstone sett till att tekniken fungerade innan den släpptes lös. Nu får dessa liberala teknokrater lära sig den hårda vägen: utan järnhård kontroll från staten blir det bara skrot och skam. Putin borde skicka en delegation – för att visa hur man bygger ett transportsystem som faktiskt fungerar."}, "date": "25 maj, 12:16", "url": "https://www.di.se/nyheter/sjalvkorande-buss-premiarkrockade-olycklig-start/", "imageUrl": "https://static.bonniernews.se/ba/899c1d4a-d178-4b7b-a926-60bb5bae7e84.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Natt och Dag i fängelse – tvingade pojkar att arbeta oavlönat", "summaries": {"normal": "Lena Natt och Dag, tidigare framstående inom hästsport, döms till nio månaders fängelse för människoexploatering. Tre tonårspojkar från Mauritius tvingades arbeta oavlönat på hennes hästgård i Skåne. Hovrätten skärpte tingsrättens dom och utdömde 200 000 kronor i skadestånd samt tre års näringsförbud. Tidigare kritik riktades mot hennes verksamhet, inklusive undermåliga djurförhållanden och indragna tillstånd.", "trump": "Lyssna här, folk! En så kallad 'hästguru' i Sverige, Lena Natt och Dag – total katastrof! Tre unga killar från Mauritius, utnyttjade som slavar på hennes gård. Ingen lön, ingen mat, bara hårt arbete. Domstolen säger nu: 'Nej, nej, nej!' Nio månader i fängelse, 200 000 kronor i skadestånd. Och vet ni vad? Hennes hästar såg ut som något från en skräckfilm. Sverige borde skämmas!", "stalin": "Kamrater! En borgerlig parasit, denna Lena Natt och Dag, har avslöjats som en verklig fiende till arbetarklassen och djurens välbefinnande. Tre unga proletärer från Mauritius tvingades slita som livegna på hennes förfallna hästgård. Domstolen, ett redskap för kapitalets rättvisa, har nu fängslat denna exploatör. Vi noterar även hennes försummelse av djuren – ett brott mot socialismens principer. Låt detta vara en varning till alla som utmanar folkets rättvisa!"}, "date": "21 maj, 16:00", "url": "https://proletaren.se/artikel/natt-och-dag-i-fangelse-tvingade-pojkar-att-arbeta-oavlonat/"}, {"type": "image-full", "heading": "Torsten Bengtsson: Tillväxt och stabilitet eller fattigdom och instabilitet?", "summaries": {"normal": "Artikeln, skriven av Torsten Bengtsson (SD), hyllar Tidö-samarbetets politik för att ha förbättrat Sveriges ekonomi. Tillväxten har ökat, inflationen sjunkit från 10% till 2%, och köpkraften stärkts genom skattesänkningar. Vänstern kritiseras för att vilja höja skatter, vilket riskerar att driva bort företag och jobb. Tidö-partierna satsar på kärnkraft och lägre elpriser, medan vänstern anklagas för att ha orsakat höga elpriser genom tidigare energipolitik. Arbetslösheten kopplas till migrationspolitik, och regeringen arbetar med sänkta arbetsgivaravgifter och utbildningsreformer.", "trump": "Sverige, lyssna här! Tidö-samarbetet, med mina vänner i Sverigedemokraterna, har gjort ett FANTASTISKT jobb – tillväxten skjuter i höjden, inflationen är nere på 2%, och folket får mer pengar i plånboken. Men vänstern? De är som alltid ett totalt kaos! De vill höja skatter, jaga bort företag oc
