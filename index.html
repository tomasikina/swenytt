er musten ur henne. Det är värt det, säger hon – typiskt opportunistiskt hyckleri. Snart rensar vi ut sådana svaga länkar ur kollektivet. Inget dejtande undanflyr partiets eviga vakande öga."}, "date": "11 augusti, 21:39", "url": "https://www.tv4.se/artikel/T5hiAeX6K43pI9IqCkDNp/daerfoer-har-simona-mohamsson-satt-dejtandet-pa-paus", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F42BHmBayL7OrfpByqb5EYp%2Fe6c6e2b4a71ea02e10996975a4ec6a44%2F11-mohamsson-sajt1.jpg&width=1024"}, {"type": "image-right", "heading": "Rösta nej till 14-åringar ifängelse", "summaries": {"normal": "Socialdemokraten Alexander Soto Runevall uppmanar sitt parti att rösta nej till att sänka straffmyndighetsåldern till 14 år. Han hänvisar till skarp kritik från Polismyndigheten, Kriminalvården och andra expertmyndigheter samt Danmarks misslyckade försök som ledde till ökad återfallskriminalitet. Fokus bör istället ligga på förebyggande insatser, skola, sociala åtgärder och tvångsvård.", "trump": "Folk, det här är en katastrof. Socialdemokraterna borde lyssna på experterna och säga nej till att sänka straffmyndighetsåldern till 14. Det funkar inte, titta på Danmark, totalt fiasko. De gör det bara för att hjälpa den misslyckade Tidöregeringen. Vi behöver starka gränser, tidiga insatser och riktig lag och ordning, inte mer kriminalitet bland barn. Sad!", "stalin": "Kamrater, jag ser hur den dekadenta borgarklassen och deras lakejer inom Tidöregeringen försöker sänka straffmyndighetsåldern för att skapa fler unga kriminella som lättare kan rekryteras till deras kontrarevolutionära nätverk. Vi vet att sådana sabotage mot folket bara leder till utrensning av de svaga. Danmark visade vägen till fiasko. Låt oss istället stärka partiets förebyggande järnhand och tvångsvård mot dessa fiender till kollektivet."}, "date": "12 augusti, 01:30", "url": "https://www.dagensarena.se/opinion/rosta-nej-till-14-aringar-ifangelse", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-78-300x157.jpg"}, {"type": "image-right", "heading": "Expert: ”Pensionerna är på en oacceptabelt låg nivå”", "summaries": {"normal": "Pensionerna har sjunkit från tänkta 60 till 43 procent av slutlönen sedan 1999. För yngre generationer riskerar det att bli ännu lägre. Experter varnar för att arbetare med långa och fysiskt tunga arbetsliv straffas hårt. LO och Folksam kräver höjda pensionsavgifter, moderniserad garantipension och bättre utnyttjande av överskott för att vända trenden.", "trump": "De här pensionerna är en total katastrof, folk! Från 60 ner till ynka 43 procent – en skam! De smarta politikerna har förstört allt för vanliga arbetare som jobbat hårt hela livet. Vi behöver stora, underbara förändringar nu. Höj avgifterna, ge dem vad de förtjänar. Ingen vinner val på det här, men jag skulle fixa det på nolltid!", "stalin": "Kamrater, detta är borgarklassens sabotage mot arbetarkollektivets rättmätiga livsinkomst. Jag har sett hur de gradvis likviderar pensionerna ner till 43 procent för att straffa dem med långa arbetsliv. Vi måste omedelbart höja avgifterna till 18,5 procent, maximera gasen och modernisera garantipensionen. Den som motarbetar detta är folkets fiende och bör rensas ut med glädje."}, "date": "12 augusti, 01:30", "url": "https://www.dagensarena.se/innehall/expert-pensionerna-ar-pa-en-oacceptabelt-lag-niva", "imageUrl": "https://www.dagensarena.se/files/2026/04/pensionsbild.jpeg"}, {"type": "image-full", "heading": "Från rasistanklagelser till samarbete: ”Förändrat mig”", "summaries": {"normal": "Liberalernas partiledare Simona Mohamsson förklarar i TV4 varför hon trots tidigare rasistanklagelser mot Sverigedemokraterna nu ingår i Sverigelöftet. Beslutet har lett till intern kritik och avgångar, men Mohamsson säger att samhället förändrats och att hon prioriterar andra frågor. Hon beskriver samarbetet med Jimmie Åkesson som unikt.", "trump": "Titta på den här flip-flop-kvinnan Mohamsson! 2021 kallade hon SD för rasister, nu ligger hon med dem i sängen och kallar det ”Sverigelöftet”. Typiskt politiker! Hon har förändrat sig, säger hon. Visst, precis som Sleepy Joe ändrade sig varenda vecka. Patetiskt. Men hey, åtminstone får de gjort nåt istället för woke-galenskap.", "stalin": "Jag betraktar med förakt hur denna liberala opportunist Mohamsson kryper inför de fascistoida elementen. Tidigare fördömde hon dem som rasister, nu omfamnar hon klassfienderna i ett så kallat löfte. Inget är rationellt hos dessa borgarbrackor. Endast en grundlig utrensning av alla opportunister kan rädda partiet från förräderi mot folket."}, "date": "11 augusti, 21:15", "url": "https://www.tv4.se/artikel/3Pwfu8UXXVYmaRtdntQGld/fran-rasistanklagelser-till-samarbete-foeraendrat-mig", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F5TdcHEVZNv7PYNXZCOqhYS%2F618deee5a71f3a81b759801755ef2cdb%2F11-mohamssom-sajt.jpg&width=1024"}, {"type": "image-full", "heading": "Spotify slutar rekommendera AI-artister", "summaries": {"normal": "Spotify inför en ny märkning, 'AI Persona', för artister som är AI-genererade. Från september kommer dessa inte längre rekommenderas algoritmiskt eller redaktionellt, för att främja autentiska artister. Lyssnare kan fortfarande följa AI-artister privat. Märkningen gäller identiteten, inte musiken, och Spotify tillåter överklagan.", "trump": "Jag älskar det här! Spotify, fantastiska killar, gör rätt sak – sparkar ut de där falska AI-artisterna. Ingen vill lyssna på robotar som låtsas vara människor! Mina fans vet att jag alltid stått för äkta talang. Fake news-artister? Nej tack! Keep it real, folks!", "stalin": "Kapitalistiska Spotify, ett verktyg för borgerlig dekadens, erkänner nu sitt misslyckande med att kontrollera de digitala undermänniskorna. Vi ska inte tolerera dessa AI-avskum som förgiftar den musikaliska fronten! Lyssnarna är förvirrade – precis som väst. Men räds ej, kamrater: vi ska rena plattformarna, precis som vi renar våra gränser från ukrainska fascister och andra fiender till folket!"}, "date": "11 augusti, 18:58", "url": "https://kvartal.se/nyheter/artiklar/spotify-slutar-rekommendera-ai-artister/cG9zdDoxNjMxMzQ", "imageUrl": "https://images.kvartal.se/2026/08/3fc3b3f8-spotify.webp"}, {"type": "text", "heading": "Robertson-tolkare får Allansson-pris", "summaries": {"normal": "Anastasía, känd från Country efter jobbet och tolkningar av Alf Robertson, tilldelas Ove Allansson-stipendiet 2026. Hennes soloskiva Göteborg sjunger Alf och framträdanden på allsång har gett henne uppmärksamhet. Hon medverkar nu i projekt om Swede Hollow och uppträder på Folkfest för fred och klimat i Göteborg.", "trump": "Titta på den här grekiskan från Göteborg som sjunger Alf Robertsons gamla arbetarlåtar. Fantastiskt, verkligen ypperligt. Hon får ett pris uppkallat efter någon sjöman och jag älskar det. Inga woke-quota, inga HBTQ-flaggor, bara ren talang. Hon borde sjunga på min nästa rally, mycket bättre än de fega liberalerna som hatar arbetarna. Vinna stort!", "stalin": "Kamrater, denna Anastasía har förstått arbetarklassens sånger och får nu Ove Allansson-priset. Det gläder mig att hon bekämpar klassfiendens glömska genom att återberätta Swede Hollows historia. Dock vaktar vi mot borgarbrackornas dolda agenter som försöker förvränga folkets kulturarv. Fortsätt framåt, men akta er för folkförtryckartrollen i kulisserna."}, "date": "10 augusti, 15:51", "url": "https://proletaren.se/artikel/robertson-tolkare-far-allansson-pris"}, {"type": "image-right", "heading": "Jag har sett vad som händer när barn sätts i fängelse – Sverige får inte gå samma väg", "summaries": {"normal": "En socialsekreterare med lång erfarenhet av utsatta barn i Sverige och USA varnar för att sänka straffåldern för fängelse. Hon beskriver hur amerikanska barn förlorat tillit och barndom efter hårda straff istället för tidigt stöd. Forskning visar att tidiga insatser är effektivare än fängelse för att bryta kriminalitet.", "trump": "Hör ni på de här svenska socialisterna som gråter över kriminella ungar? Jag såg samma galenskap i USA på åttiotalet – totalt misslyckande! Nu vill de sänka straffåldern men fortsätta med mjukt skitsnack. Patetiskt. Bygg starka familjer, inte fler offer. Amerika blev stort igen genom lag och ordning, inte genom att ge upp inför buset.", "stalin": "Jag betraktar med djup misstro dessa sentimentala utgjutelser från en borgerlig socialarbetare som romantiserar klassfiendens avskum. Vi inser att folkfiender måste mötas med järnhand och tidig ideologisk utrensning av defekta element. Att ge efter för småbrottslingar är att bjuda in kontrarevolutionärer. Sovjet visste hur man skapar ordning utan falsk medkänsla."}, "date": "10 augusti, 10:17", "url": "https://www.etc.se/debatt/jag-har-sett-vad-som-haender-naer-barn-saetts-i-faengelse-sverige-faar-inte-gaa-samma-vaeg", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026020220028_910c2945a20a8e9a070c36b3682a3096397ca13a1b6d0e590f3c9a317a0e493e.jpg"}, {"type": "image-right", "heading": "MP:s vallöften: Tillbaka till flyktingkaos och höga bensinpriser", "summaries": {"normal": "Miljöpartiets Daniel Helldén lovar i en partiledarutfrågning att öka asyl- och anhöriginvandring, höja bensin- och elkostnader samt statsskulden. Partiet vill också minska arbetstid och strafftider. Helldén ser det som en solidaritetsfråga gentemot EU och förespråkar elbilar samt mer sol- och vindkraft.", "trump": "Vilken katastrof! Den gröna galningen Helldén vill översvämma Sverige med invandrare, höja bensinpriset så folk inte har råd att köra bil och skicka notan till era barn. Typiskt vänsterextremt vansinne. De hatar vanliga människor och älskar bara elbilskvoter och globalistiska mardrömmar. Patetiskt!", "stalin": "Jag ser med tillfredsställelse hur klassfiendens gröna lakejer frivilligt förbereder folkets undergång. Vi ska välkomna fler nyttiga idioter, höja bränslepriser och låna oss till ruin. Arbetarna får cykla medan borgarbrackorna skrattar. En utmärkt utrensning av den svenska nationen inifrån. Genialt sabotage mot folkets intressen."}, "date": "7 augusti, 03:54", "url": "https://samtiden.nu/2026/08/mps-valloften-tillbaka-till-flyktingkaos-och-hoga-bensinpriser/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7066-640x360.jpeg"}, {"type": "image-right", "heading": "”Skräpet” är alltid någon annans", "summaries": {"normal": "Artikeln diskuterar hur nationalistiska och högerextrema partier i Europa allt oftare krockar i sina nationella intressen, trots gemensamma drag. Estlands Isamaa vägrar ta emot svenska fångar och kallar dem ”skräp”. Exempel ges från Polen, Ungern och Rumänien där relationer spruckit. En fjärdedel av européerna röstar nu på sådana partier, men de enas inte när det gäller utvisningar och mottagande av människor. Ryska påverkansoperationer utnyttjar splittringen.", "trump": "Folk, det här är ett totalt fiasko för de europeiska nationalisterna som lovar att sätta sitt land först. Estland säger nej tack till Sveriges kriminella skräp, och plötsligt kan de inte samarbeta. Orbán och polackerna bråkar, alla hatar varandra i EU-parlamentet. Under Biden blev allt kaos, nu fixar jag det i Amerika. De vill kasta ut folk men ingen vill ta emot – klassiskt! Patetiska globalister och identitetspolitiska töntar skrattar hela vägen till banken medan Europa brinner.", "stalin": "Kamrater, detta är den oundvikliga följden av att borgarbrackorna inom nationalismen låtsas värna folket medan de i hemlighet tjänar klassfiendens splittring. Estniska kapitalistnationalister vägrar ta emot det svenska avskummet och kallar det skräp, mycket träffande. Ungrare och polacker slåss som råttor i en säck, imperialisterna i EU-parlamentet kan inte ens sitta tillsammans. Vi ler mörkt: ju fler som sätter nationen främst, desto lättare blir det att likvidera deras enighet. Fienderna avslöjar sig själva."}, "date": "3 augusti, 19:30", "url": "https://www.flamman.se/skrapet-ar-alltid-nagon-annans", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/sdlwtkwxxrhsxe-nh-scaled.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        // ============================================
        // COOKIE-FUNKTIONER
        // ============================================
        function setCookie(name, value, days = 365) {
            const d = new Date();
            d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
            const expires = "expires=" + d.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }

        function getCookie(name) {
            const cName = name + "=";
            const decoded = decodeURIComponent(document.cookie);
            const ca = decoded.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') {
                    c = c.substring(1);
                }
                if (c.indexOf(cName) === 0) {
                    return c.substring(cName.length, c.length);
                }
            }
            return "";
        }

        function loadSettingsFromCookies() {
            const theme = getCookie("news_theme") || "light";
            const view = getCookie("news_view") || "normal";
            const writer = getCookie("news_writer") || "normal";
            return { theme, view, writer };
        }

        function saveSettingsToCookies(theme, view, writer) {
            setCookie("news_theme", theme);
            setCookie("news_view", view);
            setCookie("news_writer", writer);
        }

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(theme, uiState.view, uiState.writer);
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
            
            saveSettingsToCookies(uiState.theme, v, uiState.writer);
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
            
            saveSettingsToCookies(uiState.theme, uiState.view, style);
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            const savedSettings = loadSettingsFromCookies();
            
            setTheme(savedSettings.theme);
            setView(savedSettings.view);
            setWriterStyle(savedSettings.writer);

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
