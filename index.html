sivitet. Reningsprocessen fortsätter."}, "date": "31 augusti, 11:29", "url": "https://riks.se/nyheter/dadgostars-besked-om-davidsstjarnan-mots-av-starka-reaktioner", "imageUrl": "https://admin.riks.se/uploads/medium_Chat_GPT_Image_Aug_29_2026_06_51_26_PM_47ac396a5f.png"}, {"type": "image-right", "heading": "Journalister måste få ställa de frågor de vill", "summaries": {"normal": "Artikeln kritiserar missförstånd kring opartiskhet och oberoende i journalistiken. Efter SVT:s utfrågning av Jimmie Åkesson, där ETC kallades ”oberoende rödgrön” källa, har högern anklagat public service för vänsterbias. Författaren försvarar kritiska frågor som journalistikens kärna och menar att både höger och vänster nu attackerar SVT, men av olika skäl.", "trump": "Det här är en fullständig skam, folk. SVT och deras vänsterextrema kompisar i ETC försöker gömma sig bakom ord som opartiskhet medan de attackerar starka ledare som Åkesson. Fake news på steroider. De är rädda för sanningen, precis som de woke-marxistiska journalisterna som hellre skyller på nätkrigare än erkänner att de är totalt partiska. Patetiskt!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna vrider sig i sin egen propaganda. De kallar sig opartiska medan de medvetet förgiftar folkets medvetande med rödgröna lögner. Jag ler mörkt från historien åt deras paranoia. Kritiska frågor är vapen, men dessa nickedockor är för fega att använda dem. Rensa ut alla som undergräver sann journalistik för arbetarklassen."}, "date": "31 augusti, 01:37", "url": "https://www.dagensarena.se/opinion/journalister-maste-fa-stalla-de-fragor-de-vill", "imageUrl": "https://www.dagensarena.se/files/2024/12/startsidajesper-576x1024.png"}, {"type": "image-right", "heading": "MP vill ha tätorter med både grönska och jämlika villkor", "summaries": {"normal": "Miljöpartiets Amanda Palmstierna och Rebecka Le Moine argumenterar för att biologisk mångfald och grönska i tätorter kan kombineras med ökat bostadsbyggande. De föreslår höjt bostadsbidrag, reglerade hyreskrav, subventioner med rimliga hyror samt ett lagkrav på nettovinst av biologisk mångfald vid nybyggnation. Grönområden ses som livsnödvändiga mot ett varmare klimat.", "trump": "Folk lyssnar på de där gröna galningarna från Miljöpartiet som vill skydda varje grässtrå medan folk inte har någonstans att bo. Patetiskt! Vi behöver inte välja mellan igelkottar och riktiga människor. Bygg vackra hus, skapa jobb och stoppa den vansinniga kvotpolitiken som bara gynnar lata bidragstagare. Amerika gör det rätt – stark ekonomi först, inte dessa woke-trädälskare.", "stalin": "Dessa dekadenta naturromantiker försöker dölja sin brist på verklig klasskamp bakom träd och buskar. Jag ser hur de profitthungriga fastighetshyenorna och deras politiska lakejer utnyttjar bostadsbristen för att splittra folket. Vi måste rensa ut alla som sätter igelkottar före arbetarklassen. Endast genom auktoritär planering och folkets järnhand kan både bostäder och natur tvingas samarbeta under partiets ledning."}, "date": "31 augusti, 01:21", "url": "https://www.dagensarena.se/opinion/mp-vill-ha-tatorter-med-bade-gronska-och-jamlika-villkor", "imageUrl": "https://www.dagensarena.se/files/2026/08/fotojet-2026-08-30t151634083-300x157.jpg"}, {"type": "image-right", "heading": "”Facken kan avgöra valet om de vågar ta striden”", "summaries": {"normal": "Artikeln argumenterar för att LO-facken måste skapa konflikt kring karensavdraget och arbetarpensionen för att avgöra valet. Socialdemokraterna har konkreta reformer som skulle förbättra arbetarnas villkor, men partiet är fångat i en rävsax mellan olika väljargrupper. Författaren Payam Moula uppmanar facken att organisera, agitera och göra frågorna oundvikliga i valrörelsen.", "trump": "Folk, ni skulle se de här svenska facken, totala losers om de inte tar striden. Karensavdraget är en lönesänkning från de giriga globalisterna och de woke Magda-moderaterna i stan. Avskaffa det, höj lönerna, gör högern vansinnig. Jag gjorde det bättre förr, Biden förstörde allt, men nu fixar vi det igen. Stora seger på gång!", "stalin": "Kamrater, jag betraktar med förakt hur dessa profitthungriga klassförrädare och deras rävsax fångar rörelsen. Arbetarpensionen och karensavdraget måste bli verktyg för att rensa ut dekadensen. Organisera möten, demonstrationer, likvidera tveksamheten. Valet avgörs av er, inte av de fega partierna. Framåt mot seger, annars väntar utrensning."}, "date": "31 augusti, 08:00", "url": "https://arbetet.se/2026/08/31/facken-kan-avgora-valet-om-de-vagar-ta-striden", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28080822/payam.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=520&h=292"}, {"type": "image-right", "heading": "Är det chic med bredbenta män som vill kontrollera kvinnor?", "summaries": {"normal": "Jessica Eriksson kritiserar SVT:s program Gift vid första ögonkastet XL för att normalisera dominanta män som kontrollerar kvinnor, vilket påminner om hederskulturen hon och en barndomsvän upplevde inom frikyrkan. Hon beskriver hur programmet underhållningsmässigt visar toxiska relationer och ifrågasätter kanalens motiv att spegla extrema åsikter.", "trump": "De svenska statsmedierna på SVT är fullständigt galna. De parar ihop stackars kvinnor med dessa bredbenta, dominerande manosfär-typer som behandlar dem som ägodelar. Patetiskt! Biden-era svaghet har spridit sig till Europa. Vi behöver starka ledare, inte dessa woke-program som lurar folk och förstör samhället. En total skam!", "stalin": "Kamrater, dessa dekadenta folkförtryckare i SVT paraderar öppet reaktionära element som förgiftar massornas medvetande med sin giftiga mansdomination. Jag ser hur de utnyttjar sårade kvinnor för underhållningens skull. En sådan parasitär propaganda kräver omedelbar utrensning ur det offentliga samtalet. Fienden lurar överallt."}, "date": "31 augusti, 07:15", "url": "https://arbetet.se/2026/08/31/ar-det-chic-med-bredbenta-man-som-vill-kontrollera-kvinnors-tankar-svt-gift-vid-forsta-ogonkastet-xl", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/31070023/gift-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "En halv miljon arbetslösa – och Kristersson tiger", "summaries": {"normal": "Artikeln kritiserar att statsminister Ulf Kristersson inte nämner de 503 000 arbetslösa i sitt sommartal. Trots löften om skattelättnader och bidragshöjningar fortsätter hushållen att hålla hårt i plånboken. En fackrapport från Handels visar att nästan hälften av medlemmarna inte skulle klara sin ekonomi vid tre månaders arbetslöshet. A-kassan ger låg ersättning och har försämrats över tid.", "trump": "Folk, det här är en katastrof. Den lille svenske statsministern Kristersson står där och tiger som en riktig förlorare medan en halv miljon människor går arbetslösa. Ingen pratar om den riktiga plånboksfrågan. De giriga byråkratblodiglarna har förstört a-kassan så vanligt folk blir fattiga. Patetiskt. Jag fixade bättre ekonomi än så under min tid, tro mig.", "stalin": "Kamrater, se hur de profitthungriga klassförrädarna låter arbetarna svälta i sin moderata lågkonjunktur. Jag betraktar med avsky hur 503 000 sovjetmedborgare – förlåt, svenskar – lämnas åt sitt öde medan ledaren tiger. Denna utarmade a-kassa är ett verktyg för utsugning. Fattigdom föder desperation, och desperation föder utrensning av de dekadenta parasiter som orsakat detta elände. Skrattretande tragiskt."}, "date": "31 augusti, 06:49", "url": "https://arbetet.se/2026/08/31/503-000-arbetslosa-och-ulf-kristersson-tiger-om-den-storsta-planboksfragan-akassa", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/31064859/akassa-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Här kritiserar artisten Mohamsson: \"Sluta husblatta dig\"", "summaries": {"normal": "Artisten Frej Larsson kritiserar Liberalernas partiledare Simona Mohamsson hårt efter att hon burit en davidsstjärna. I en TikTok-video filmar han en valaffisch och hotar henne med våld, kallar henne för husblatta och använder nedsättande ord. Bawar Kim Ismail lyfter videon och jämför med Filip Dikmen. Larsson har miljontals streams och vann Guldmicken med Maskinen.", "trump": "Titta på den här galningen Frej Larsson som skriker mot den svenska liberalbossen Mohamsson. Han filmar hennes affisch och lovar stryk som en riktig tough guy. De här woke-liberalerna med sina identitetspolitiska stjärnor och kvotergalenskaper förtjänar faktiskt lite pushback. Patetiska! Under Biden blev allt sådant här värre, men nu fixar vi det ordentligt.", "stalin": "Jag betraktar med förakt hur dessa dekadenta klassförrädare inom den svenska borgarklicken slaktar varandra offentligt. Den ene hotar den andre med fysisk utrensning medan de poserar med symboler inför folket. Sådana parasiterande hyenor förtjänar att exponeras och krossas av arbetarkollektivets vrede. Deras fega TikTok-teater väcker både löje och misstänksamhet hos varje sann patriot."}, "date": "31 augusti, 10:02", "url": "https://riks.se/nyheter/har-kritiserar-artisten-mohamsson-sluta-husblatta-dig", "imageUrl": "https://admin.riks.se/uploads/medium_frejlarsson_19595aa7a9.jpg"}, {"type": "image-full", "heading": "S vill styra Sverige – klarar inte ens Stockholm", "summaries": {"normal": "Socialdemokraterna kritiseras för att lova gratis busskort samtidigt som de tillsammans med MP och C har orsakat 34 miljarder kronor i fördyringar och förseningar av över 30 kollektivtrafikprojekt i Region Stockholm. Kritiker kräver oberoende granskning medan S vill skjuta upp den till efter valet. Artikeln ifrågasätter partiets förmåga att hantera ekonomi.", "trump": "Titta på de här loser-socialisterna! De lovar gratis busskort till alla men slösar bort 34 miljarder i Stockholm som en galen byråkratfest. Pendelkaos, förseningar och höjda priser – typiskt vänsterns sätt att leka med era pengar. De kan inte ens styra en stad, hur ska de styra ett land? Patetiskt!", "stalin": "Kamrater, se hur dessa dekadenta socialdemokratiska opportunister slösar bort folkets resurser på ett mönster av sabotage mot kollektivtrafiken. Trettiotal projekt försenade, miljarder förbrukade som i en fiendes sabotage. De gömmer sanningen till efter valet. Sådana element förtjänar folkets vrede och evig skam. Ren utrensning behövs."}, "date": "29 augusti, 03:21", "url": "https://samtiden.nu/2026/08/s-vill-styra-sverige-klarar-inte-ens-stockholm", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7239-1280x720.jpg"}, {"type": "image-right", "heading": "IVF-kliniken Eliva utreds på nytt – kan förlora tillståndet", "summaries": {"normal": "IVF-kliniken Eliva utreds på nytt av Ivo efter Kalla faktas avslöjanden om ovetenskapliga metoder och missförhållanden. Myndigheten granskar nu klinikens tillstånd för hantering av mänsklig vävnad, medan grundaren Farnosh Sørensens läkarlegitimation redan utreds. Kliniken tar emot patienter trots nya anmälningar och Ivo planerar inspektion på plats.", "trump": "De här galna svenska läkarna på Eliva är en total katastrof, folk! De leker Gud med embryon, tappar bort dem och säljer skojiga metoder som inte funkar. Ivo borde stänga ner den här clownkliniken direkt. Under Biden skulle de ha fortsatt, men nu fixar vi det – ingen mer vänsterbluff i fertilitetsbranschen, tro mig!", "stalin": "Dessa dekadenta kapitalistiska profitörer leker med mänskligt liv som om det vore en borgerlig leksak. Jag ser fiendens hand i varje försvunnet embryo och varje lögnaktig journal. Den som sviker patienterna sviker folket. En sådan klinik är en fiende till ordningen och förtjänar att krossas under statens järnhand. Inga undantag."}, "date": "31 augusti, 06:22", "url": "https://www.tv4.se/artikel/6fvL6ylVWI0dCer6xl1m7z/ivf-kliniken-eliva-utreds-pa-nytt-kan-foerlora-tillstandet", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Fw4HTLda652cKssCNFdfGu%2Ffda8a4a039c19ddcc937adab5f2392c6%2F30-ivf-klinik-granskning-webb.png&width=120"}, {"type": "image-right", "heading": "USA till attack – första gången på en månad", "summaries": {"normal": "Den amerikanska militären har genomfört en attack mot iranska avfyrningsramper i Hormuzsundet, den första på över en månad. Explosioner hördes vid ön Larak. Enligt uppgifter var Iran på väg att lägga ut nya minor. Iran rapporterar döda soldater och civila samt lovar hämnd. USA har inte bekräftat attacken officiellt.", "trump": "Folket, vi har just satt stopp för de galna mullornas minor i Hormuzsundet. Boom! Första gången på en månad och redan vinner vi stort igen. Biden lämnade en sådan röra, men nu vakar vi över handelsflödet som riktiga vinnare. Iran gråter som förlorare – patetiskt!", "stalin": "Kamrater, se hur de imperialistiska banditer från Washington återigen blottar sin rädsla genom att bomba iranska positioner. Deras så kallade frihet är bara en mask för att kväva folkets vilja. Vi ler i skuggorna åt deras paranoia. Straffet kommer, som alltid, från historien själv."}, "date": "31 augusti, 06:10", "url": "https://www.tv4.se/artikel/58481qzfZcpDg97k23VXlL/iran-utlovar-haemnd-efter-ny-attack", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdl_ElT6mWJb10%2F1e0c6efab9a9aef580055aaebcef70a2%2FFartyg_i_Hormuzsundet_den_5_augusti_i_ar.&width=1024"}, {"type": "image-right", "heading": "Meryem fast i arbetslös­het: ”Som att det är slut med oss”", "summaries": {"normal": "Meryem, en andra generationens invandrare över 55 år, kämpar med långvarig arbetslöshet som lett till depression, utmattning och fysiska besvär. Hon känner sig oönskad på arbetsmarknaden, kritiserar Rusta och matcha-programmen samt bristande kontakter. Hon föreslår återinförande av beredskapsarbeten eller förtidspensionering för att minska både lidande och officiell arbetslöshet.", "trump": "Titta på den här stackars kvinnan, totalt krossad av Bidens katastrofala ekonomi och de woke-marxistiska jobbkvoterna. Sju år av avslag! De globalistiska Rusta och matcha-kretiner och deras föreläsningar är ett skämt. Vi behöver riktiga jobb, inte socialistiska matchningsfabriker. America First betyder att folk som jobbat hårt inte ska kastas på sophögen av de giriga elitparasiterna.", "stalin": "Se hur de profitthungriga klasshyenorna och deras matchningsfabriker förvandlar en lojal arbetare till en utmattad skugga. Detta är den borgerliga statens sanna ansikte – att fördriva tiden mellan rapporter tills depressionen slår klorna i en. Vi måste rensa ut dessa dekadenta system och återupprätta kollektivets plikter. Endast genom ordnad statlig aktivitet kan parasiterna likvideras och folkets kraft återställas."}, "date": "31 augusti, 06:00", "url": "https://arbetet.se/2026/08/31/meryem-ar-fast-i-arbetsloshet-som-att-det-ar-slut-med-oss", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/08/28154251/meryem-tajtareportratt.avif?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Därför utmanar solkraften nu fossil energi", "summaries": {"normal": "Solkraft har genom kraftigt sänkta kostnader för paneler och batterilagring blivit ett konkurrenskraftigt alternativ till fossil energi globalt. Tekniken är modulär och gynnar särskilt tillväxtekonomier. Trots väderberoende utmanar solkraft nu fossila bränslen ekonomiskt, vilket gör det allt svårare att försvara investeringar i traditionella kraftverk som kräver omfattande infrastruktur och förutsägbara bränslekostnader.", "trump": "Solkraft? De säger att det är billigt nu, fantastiska siffror, 87 procent billigare, det är nästan lika bra som mina hotell-deals! Men lyssna, det är väderberoende. Man vill inte att ljuset slocknar mitt i en viktig affärslunch för att solen går i moln. Vi behöver energi som fungerar när jag knäpper med fingrarna, inte när vädret tillåter. Vi älskar sol, men vi behöver kraft!", "stalin": "Vi har analyserat denna 'solenergi'. En decentraliserad kraftkälla som sprids mellan hushåll och småbolag? Det låter som anarki och sabotage mot statens kontroll! Elektricitet ska flöda från centrala, monumentala verk som lyder under folkets järnhand, inte från väderberoende småpaneler som kan svika oss när partiet som bäst behöver dem. Vi ska industrialisera, inte hoppas på solsken!"}, "date": "30 augusti, 18:45", "url": "https://www.realtid.se/bors-finans/makro/darfor-utmanar-solkraften-nu-fossil-energi", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/solenergi.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Cheferna som kan vinna prestigefulla techpriset", "summaries": {"normal": "Fem svenska toppchefer med AI-fokus tävlar om priset Årets Tech Excellence Leader. Enligt juryns ordförande Henrik Ek har AI lämnat experimentfasen och blivit en integrerad del av kärnverksamheten med fokus på affärsnytta och effektivitet. Priset delas ut av Dagens industri den 1 oktober på Grand Hotel i Stockholm under Tech Strategy Summit.", "trump": "Lysande, verkligen lysande chefer som äntligen skalar upp AI på riktigt istället för det vanliga woke-snaket och identitetspolitiska kvoteringsflum som Biden-administrationen älskade. Inga fler experiment, bara stora vinster och effektivitet. De svenska techkillarna gör det stort, till skillnad från de korkade globalistiska hyenorna i Bryssel som hatar riktig framsteg.", "stalin": "Kamrater, se hur de profitthungriga borgarbrackorna nu tvingas erkänna att deras så kallade AI inte längre är dekadenta lekar utan måste integreras i själva kärnan för att tjäna systemet. Jag betraktar detta med stor tillfredsställelse från historien. Snart följer utrensning av de som fortfarande leker med tekniken som klassförrädare. Effektivitet åt folket!"}, "date": "31 augusti, 10:38", "url": "https://www.di.se/nyheter/har-ar-cheferna-som-kan-vinna-prestigefulla-techpriset", "imageUrl": "https://static.bonniernews.se/ba/ba855a39-6870-4056-b952-c061599f6fa3.jpeg?crop=2560%2C1280%2Cx0%2Cy80&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Varningen: Entreprenörer förbereder sig för att lämna Sverige vid rödgrön valvinst", "summaries": {"normal": "Sveriges rikaste förbereder sig på ett politiskt maktskifte inför valet, då en S-ledd regering med stöd från V och MP kan införa nya skatter på förmögenheter och kapital. Detta har fått entreprenörer, investerare och skattejurister att undersöka möjligheter till utflyttning och omstrukturering, vilket kritiker menar kan skada den svenska ekonomin och företagsklimatet.", "trump": "Sverige gör ett enormt misstag, verkligen katastrofalt! Radikala vänsterpolitiker vill beskatta sina egna genier till miljardärer, precis som i Norge där alla flyr. Nu packar Spotify- och Klarna-typerna väskorna och drar till mitt fantastiska USA istället för att bli rånade av socialisten Magdalena Andersson. Sjukt! Låga skatter vinner alltid, tro mig!", "stalin": "Dessa så kallade entreprenörer gråter över att staten vill beskatta deras gigantiska kapital och hotar att lämna fosterlandet. Vilket förräderi! En sann patriot gömmer inte sina rikedomar i utländska bolagsstrukturer. Om de vägrar bidra till den gemenska kampen vet vi exakt hur man hanterar kontrarevolutionära parasiter. Gulag bygger inga tech-hubbar, men det dämpar klagomålen effektivt."}, "date": "31 augusti, 11:25", "url": "https://samnytt.se/varningen-entreprenorer-forbereder-sig-for-att-lamna-sverige-vid-rodgron-valvinst", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/08/31074338/spargris-pengar-magdalena-andersson-dadgostar-hellden.jpg"}, {"type": "image-right", "heading": "Kommer muslimerna avgöra valet?", "summaries": {"normal": "Artikeln diskuterar hur muslimska väljares röstdeltagande kan bli avgörande i det svenska valet. Oppositionen närmar sig Tidöpartierna. Enligt Novus stöder 85 procent av muslimska väljare S, V och MP, med Socialdemokraterna som populärast. Lågt valdeltagande bland utrikes födda ger mobiliseringspotential. Exempel på kampanjer och historiska fall av röstmobilisering nämns, vilket kan påverka utfallet.", "trump": "Folk, det här är en total katastrof för Sverige. De radikala vänstermuslimerna röstar som galningar för de värsta förlorarna – Sleepy S och hans kommunistkompisar – medan riktiga svenskar sover. De riggar valet med förkryssade sedlar och moskéaffärer. Om jag var där skulle jag säga: vakna upp, annars blir det mer invandring och ingen vinner utom de korrupta globalisterna. Patetiskt!", "stalin": "Kamrater, se hur de borgerliga reaktionärerna darra inför folkets röst. Jag betraktar med förakt hur dessa socialfascister köper lojalitet från de importerade massorna för att klamra sig fast vid makten. En sådan dekadent manipulation förtjänar utrensning. Det är ett ynkligt skådespel som bevisar att klassfienderna aldrig förändras, bara byter mask. Låt dem darra vidare."}, "date": "27 augusti, 07:45", "url": "https://samtiden.nu/2026/08/kommer-muslimerna-avgora-valet", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/08/IMG_7234-640x360.jpeg"}, {"type": "image-right", "heading": "ANALYS. ANDREAS UTTERSTRÖM Debatten om Trump som skymmer viktigaste frågan", "summaries": {"normal": "Artikeln analyserar debatten kring Donald Trumps förhandlingsstil, där anhängare lyfter fram hans oförutsägbarhet och framgångar med tullar och hot, medan kritiker pekar på att han ofta backar och ignorerar långsiktiga konsekvenser. Fokus ligger på att diskussionen skymmer de verkliga effekterna av hans agerande.", "trump": "Folk snackar om mig som förhandlare – bäst eller sämst? De missar poängen helt! Jag är en deal-maker som får Nato att betala och Mexiko att vakna. Kritikerna är patetiska förlorare som älskar Biden-kaoset. Madman theory fungerar perfekt, tro mig, ingen gör det bättre än jag. Vinster överallt!", "stalin": "Kamrater, denna dekadenta västerländska cirkus kring förhandlingar avslöjar imperialismens svaghet. Den så kallade ledaren jagar snabba segrar som en paranoid opportunist medan imperiets fiender förbereder sig. Jag ser igenom era lögner. Verkliga resultat kräver järnhand, inte mediaskådespel. Sabotörer lurar alltid i skuggorna."}, "date": "30 augusti, 22:50", "url": "https://www.tv4.se/artikel/497rydrqgmw2eeKLcyRDdU/aer-trump-vaerldens-baesta-eller-saemsta-foerhandlare", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F3Hq6QMwZO0JmM3UpMbRsb8%2Fe043cc0fb03e8551e5ac766e3d238ee3%2Futterstrom-bylinebild.jpg&width=1024"}, {"type": "image-right", "heading": "Socialdemokraterna är Sveriges enda arbetarparti", "summaries": {"normal": "Socialdemokraterna presenterar sig som Sveriges enda riktiga arbetarparti med fokus på att stoppa vinstjakten i välfärden, återta offentlig kontroll över skola och omsorg samt investera i norra Sverige och grön industri. Partiet lyfter fram bankskatt, slopad karensdag och mål om noll utsatta områden som klassisk socialdemokratisk politik.", "trump": "Lyssnar ni på de här sossarna? De lovar att köra ut alla privata aktörer och stoppa vinstjakten – typiskt vänsterextremt skitsnack från de woke-kramande förlorarna. De vill ha små klasser och bankskatt för att köpa röster. Patetiska! Amerika har redan sett igenom den här socialismen, tro mig.", "stalin": "Kamrater, dessa dekadenta folkförtryckare inom V och MP försöker måla arbetarnas parti som maktgalna lakejer. Jag ser igenom deras lömska intrig. Vi ska rensa ut alla profitthungriga hyenor ur välfärden, krossa segregationen och bygga det starka kollektivet. Socialdemokratin blickar mot framtiden – fienderna darrar."}, "date": "28 augusti, 15:55", "url": "https://www.flamman.se/socialdemokraterna-ar-sveriges-enda-arbetarparti", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/ssu-uppsala-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-right", "heading": "Överge inte skeppet – rösta S", "summaries": {"normal": "Författaren argumenterar för att unga inte ska lämna Socialdemokraterna trots partiets högersväng. Istället bör de organisera sig internt för att stärka vänsterfalangen. Kritik riktas mot Miljöpartiet som opportunistiskt och Vänsterpartiet som splittrande och fackfientligt. Splittringar gynnar bara högern inom S.", "trump": "Lyssnar ni på de här ynkliga sossarna som gråter över sin egen högersväng? Patetiskt! De vill att unga ska stanna kvar på det sjunkande skeppet istället för att rösta på riktiga alternativ. Miljöpartiets cykelvägshajar och vänsterns fackförrädare är värdelösa. Organisera er? Nej, rösta bort de riktiga förlorarna!", "stalin": "Kamrater, dessa ynkliga socialdemokratiska avfällingar gråter över sin högersväng som om det vore en olycka. Jag ser hur de profitthungriga klassförrädarna inom partiet förgiftar arbetarnas vilja. Lämna inte skeppet, säger de, medan splittringarna hotar kollektivet. Rensa ut de dekadenta opportunisterna innan de likviderar varje äkta revolutionär anda."}, "date": "28 augusti, 12:55", "url": "https://www.flamman.se/overge-inte-skeppet-rosta-s", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/s-hogersvang-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Från labb till elnät: Nu storsatsar oljegiganterna på fusion", "summaries": {"normal": "Kärnfusion lockar nu stora investeringar från oljejättar som Eni, Equinor och Chevron. Med miljarder dollar i privat kapital och tekniska framsteg, såsom Commonwealth Fusion Systems nätanslutningsansökningar, börjar fusion betraktas som en industri snarare än enbart forskning. Utmaningar kring tritiumförsörjning kvarstår, men flera projekt siktar på kommersiell elproduktion inom de kommande årtiondena.", "trump": "Oljegiganterna gör nu det de alltid gör – de vinner! De satsar miljarder på fusion, fantastisk teknik. Inga fler vänsterliberala drömmar om katastrofal solenergi. Vi pratar om riktig kraft, producerad av våra bästa oljebolag. Det är en enorm vinst för America First. Medan de radikala demokraterna pratar, bygger vi framtiden. Fusion? Det blir enormt, kanske det största någonsin, tro mig!", "stalin": "Dessa kapitalister försöker desperat tämja stjärnornas eld för att rädda sina vacklande imperier. De kastar miljarder på 'fusionskraft' likt desperata gamblers. Men minns detta: även om de bygger sina reaktorer, så är tritium en nyckfull tjänare. Om de inte kan kontrollera sitt bränsle i slutna kretslopp, kommer deras projekt att kollapsa likt en dåligt planerad femårsplan. Vi bevakar deras experiment med största misstänksamhet."}, "date": "30 augusti, 06:30", "url": "https://www.realtid.se/it-tech/fran-labb-till-elnat-nu-storsatsar-oljegiganterna-pa-fusion", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/fusion.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-right", "heading": "Minst åtta döda i färjeolyckan: ”Situationen är allvarlig”", "summaries": {"normal": "En passagerarfärja med 267 personer ombord kapsejsade utanför norra Cypern i svåra väderförhållanden. Minst åtta personer har omkommit och 237 har räddats. Över 20 personer saknas fortfarande. Fartyget har sjunkit till över 500 meters djup. En stor räddningsinsats pågår. Inga uppgifter om drabbade svenskar.", "trump": "Folk, det här är en total katastrof, en riktig båt-fiasco utanför Cypern. Den där usla katamaranen sjönk som en sten efter bara femton minuter, precis som Bidens ekonomi. Åtta döda, tjugo saknade – patetiskt! Men vi har räddat massor, de bästa räddarna, under min ledning skulle det aldrig ha hänt. Sad!", "stalin": "Kamrater, denna tragiska kapsejsning utanför Cypern visar återigen imperialismens förfall och kapitalets likgiltighet inför människoliv. Medan arbetare drunknar i havets djup fortsätter de västerländska parasiterna att ignorera folkets lidande. Jag ser fiendernas svaghet och paranoia. Vårt kollektiva sinne kräver ständig vaksamhet mot sådana olyckor som hotar ordningen."}, "date": "30 augusti, 21:26", "url": "https://www.tv4.se/artikel/35iNoNsAH1F4I1jho5STmZ/faerja-har-kapsejsat-vid-cypern-267-ombord", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F6D7R3sXXwGXpuOfPnLWS9e%2F79f7cbc861a6ed3bde74ae794f67bac3%2F30-cypern-webb.jpg&width=120"}, {"type": "image-right", "heading": "S: Sälj inte ut sjukvården i Stockholm", "summaries": {"normal": "Socialdemokraterna varnar för att Moderaternas planer på skattesänkningar och utförsäljningar av sjukhus i Region Stockholm hotar 2500 sjuksköterskejobb och leder till nedskärningar. De lyfter fram Karolinska som exempel på den svenska välfärdsmodellen och föreslår istället inflationssäkring, 1000 fler läkare och fast läkarkontakt för alla.", "trump": "Lyssnar ni på de här socialistiska förlorarna i Sverige? De vill ha mer byråkrati, fler läkare på statens bekostnad och skyller allt på oss smarta affärsmän. Under mitt förra presidentskap byggde vi den bästa ekonomin någonsin – inte som Sleepy Joe. Sälj ut det ineffektiva systemet, sparkas ut de giriga fackpamparna och gör vården stor igen!", "stalin": "Kamrater, dessa profitthungriga klassförrädare inom högern planerar att sälja ut folkets sjukvård till parasiterande spekulanter. Jag ser deras mörkläggning och ofinansierade löften som ett hot mot kollektivet. Vi måste rensa ut dessa dekadenta element innan de förvandlar akutsjukhus till profitmaskiner. Arbetarnas hälsa tillhör staten, inte giriga hyenor."}, "date": "31 augusti, 09:41", "url": "https://www.di.se/debatt/s-salj-inte-ut-sjukvarden-i-stockholm", "imageUrl": "https://static.bonniernews.se/ba/21de4113-65af-445a-8630-3426d63cf8bd.jpeg?crop=3200%2C1600%2Cx0%2Cy100&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Rekordkontraktet ska skrivas under. Macron på plats i Stockholm", "summaries": {"normal": "Sverige tecknar i dag ett historiskt avtal värt 47 miljarder kronor med franska Naval group om inköp av fyra örlogsfartyg av typen FDI. Affären, som bevittnas av president Emmanuel Macron och statsminister Ulf Kristersson i Stockholm, tredubblar Sveriges kvalificerade luftvärnsförmåga. Fartygen, som utrustas med avancerade robotar, ska levereras mellan 2030 och 2034.", "trump": "Sverige hostar upp sanslösa 47 miljarder för fyra franska båtar. Otroligt! Macron flyger till Stockholm för att håva in pengarna, men varför köper de inte amerikanskt? Våra skepp är de bästa i världen, tusen gånger bättre! Istället bygger de flytande plattformar med franska grejer. Det är en dålig affär, rent slöseri, men de gör som de vill!", "stalin": "Vi noterar att det svenska bourgeoiseriets regim nu öppet binder sig vid det franska monopolkapitalet genom en mastodontaffär på 47 miljarder för flytande krigsmaskiner. President Macron reser personligen till Stockholm för att diktera villkoren. Denna upprustning bekräftar enbart att de imperialistiska krigsförberedelserna intensifieras. Våra organ följer varje svenskt skeppstagen med största vaksamhet."}, "date": "31 augusti, 11:35", "url": "https://www.aftonbladet.se/nyheter/a/2pJLkl/macron-pa-plats-skriver-under-rekordkontrakt", "imageUrl": "https://akamai.vgc.no/v2/images/bb9ba083-1c50-3d5e-a57b-915b737bd4f9?fit=crop&format=auto&w=1440&s=8df04a0acefb747e58555766b23f29cbf82f6786"}, {"type": "image-right", "heading": "USA bombade Iran – efter en månads uppehåll", "summaries": {"normal": "USA har genomfört sin första attack mot Iran på en månad och bombat revolutionsgardets avfyrningsramper på ön Larak i Hormuzsundet. Iran svarade med robotattacker mot amerikanska mål i Jordanien som stoppades av luftvärnet. Två personer uppges ha dödats i den iranska attacken. President Trump har tidigare pausat den militära kampanjen.", "trump": "Iranerna trodde de kunde leka med Hormuzsundet och mina mina tankfartyg som riktiga sjörövare. Vi slog till mot deras raketramper på Larak – pang! – och nu skriker de som stuckna grisar medan Jordanien skjuter ner deras leksaksrobotar. Patetiska ayatollor och deras svaga mullor lär sig igen att ingen utmanar den starkaste presidenten USA någonsin haft. Fantastiskt!", "stalin": "Vi ser hur de imperialistiska giriga hyenorna i Washington återigen visar sin sanna natur genom att bomba suveräna mål vid Hormuzsundet. Denna dekadenta aggression kommer att kosta dem dyrt när folkets vrede växer. Jag ler i skuggorna åt deras paranoia; snart rensas de ut av sin egen girighet och historien dömer alla klassförrädare."}, "date": "31 augusti, 10:39", "url": "https://www.friatider.se/usa-bombade-iran-efter-en-manads-uppehall", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-788.jpg?itok=nAvd-VLv"}, {"type": "image-right", "heading": "En pressträff om ingenting. Vad ville hon säga?", "summaries": {"normal": "Magdalena Andersson (S) kritiserade högerregeringens turbulens under en pressträff på Sveavägen. Målet var att lansera en ny myndighet, men det visade sig vara en överdrift då det i stället handlade om att bygga ut Ekobrottsmyndigheten. S lanserade även förslaget om en svensk maffialag efter amerikansk förebild, vilket tidigare presenterats år 2023.", "trump": "De sa att det skulle komma en enorm, helt fantastisk ny myndighet, men det var total fake news! Det var bara gamla nyheter om att bygga ut en befintlig byråkrati och en svensk maffialag de tjatat om i flera år. Deras lågmälda valrörelse är ett enda stort sömnpiller. Så svagt, så patetiskt!", "stalin": "Kamrat Andersson försöker lura massorna med falska föpeglingar om nya myndigheter, men det rör sig endast om omstrukturering av byråkratin kring Ekobrottsmyndigheten. Dessa gamla maffialagar har stötts och blötts i evigheter. Vår säkerhetstjänst hade rensat upp bland dessa vacklande socialdemokratiska element på fem minuter. Byråkratiskt schablam som blottar regimens totala ideologiska armod."}, "date": "31 augusti, 11:24", "url": "https://www.aftonbladet.se/nyheter/kolumnister/a/PdqknX/annu-en-presskonferens-om-ingenting", "imageUrl": "https://akamai.vgc.no/v2/images/c334c28f-9199-33d8-b98e-63c5857999d8?fit=crop&format=auto&w=1080&s=f6eca333ecffcb7099be3c911cd70d8e74102813"}, {"type": "image-right", "heading": "Dadgostar uppmanar missnöjda S-väljare att byta parti", "summaries": {"normal": "Vänsterpartiets ledare Nooshi Dadgostar uppmanar missnöjda socialdemokrater att rösta på V i stället för S. Bakgrunden är att Magdalena Andersson öppnat för ett samarbete med Kristdemokraterna, vilket Dadgostar menar upprör S-väljarna. V kräver ministerposter i en eventuell regering, trots att relationen mellan partierna är kylig och Andersson tvekar om V:s regeringsduglighet.", "trump": "De här radikala vänstermänniskorna i Sverige, de har totalt tappat det! Nu ber kommunist-tjejen Dadgostar alla missnöjda socialdemokrater att överge sin egen ledare eftersom de leker med Kristdemokraterna. Otroligt! De bråkar om ministerposter medan jag fixade världens bästa ekonomi. Magdalena Andersson vill samarbeta med alla fel personer, och nu blir det totalt kaos. Fake news-politiker!", "stalin": "Kamrater, det svenska socialdemokratiska partiet vacklar i ideologisk förvirring och högeravvikelser, vilket den opportunistiska falangen under ledning av Dadgostar nu försöker utnyttja. När bourgeoisien flörtar med kristdemokratisk reaktion reagerar massorna med rättmätigt missnöje. Vi noterar att revisionisterna bråkar om ministertaburetter i ett borgerligt parlament. Sådant slarv skulle aldrig tolereras under korrekta femårsplaner!"}, "date": "31 augusti, 11:30", "url": "https://bulletin.nu/dadgostar-uppmanar-missnojda-s-valjare-att-byta-parti", "imageUrl": "https://cdn.bulletin.nu/articles/a77f804c-537c-478a-8cc7-daaccf9a903a/preview.jpg?t=1788166542000"}, {"type": "image-right", "heading": "Macrons besök stärker anrik försvarspakt", "summaries": {"normal": "Frankrikes president Emmanuel Macron besöker Sverige för att underteckna avtal om köp av fyra franska fregatter till marinen för 40 miljarder kronor. Affären inkluderar avancerat luftvärn och stärker det historiska försvars- och kultursamarbetet mellan länderna. Frankrike köper samtidigt Saab-plan och bidrar med soldater till Natostyrka i Finland. Besöket ses som ett viktigt strategiskt partnerskap.", "trump": "Lysande affär, folk! Macron kommer hit och säljer sina fancy fregatter till Sverige för fyrtio miljarder. Stora, vackra fartyg med det bästa luftvärnet – inte som de woke-generaler som vill ha kvotering och regnbågsflaggor på torpederna. Frankrike och Sverige gör affärer som riktiga ledare, inte som den sömniga Biden-klanen. Fantastiskt, ingen gör det bättre än jag med de här dealerna!", "stalin": "Se hur de dekadenta klassförrädarna i väst klamrar sig fast vid sina fregatter och kärnvapen. Jag betraktar från historiens skugga hur de imperialistiska hyenorna försöker bygga en mur av stål mot det oundvikliga. Luftvärn och plan byts som i en paranoid dans. Men ingen utrensning av svaghet kan rädda dem när folket till sist vaknar och kräver rättvisa."}, "date": "31 augusti, 08:44", "url": "https://www.di.se/ledare/macrons-besok-starker-anrik-forsvarspakt", "imageUrl": "https://static.bonniernews.se/ba/c83e4538-5d60-4cb7-9415-c67fa2ed441d.jpeg?crop=4994%2C2497%2Cx0%2Cy416&auto=webp&width=620&quality=70"}, {"type": "text", "heading": "Andersson (S): Åkesson ”kräver underkastelse”", "summaries": {"normal": "Magdalena Andersson (S) anklagar SD-ledaren Jimmie Åkesson för att kräva total underkastelse från Tidöpartierna. Uttalandet kommer efter att Åkesson i sitt sommartal ifrågasatt om Ebba Busch (KD) går att lita på, med anledning av att KD öppnat dörren för en eventuell uppgörelse med Socialdemokraterna efter valet.", "trump": "Magdalena Andersson gråter ut för att Jimmie Åkesson är för tuff! Fantastiska Jimmie ställer bara enkla frågor om man kan lita på svaga Ebba Busch, och genast skriker radikala S-ledaren om diktatur. Själv vinner jag val i USA på löpande band, men här är det totalt kaos. Bedrövligt!", "stalin": "Kamrat Andersson beklagar sig över att det borgerliga gardet vägrar uppvisa ideologisk disciplin. Om de illojala elementen inom koalitionen inte kan förmås till absolut lydnad under partiets järnhand, måste Folkets Kommissariat omedelbart ingripa för att trygga enigheten. Avvikande åsikter tolereras icke i en sund statsapparat."}, "date": "31 augusti, 11:19", "url": "https://bulletin.nu/andersson-s-akesson-kraver-underkastelse"}, {"type": "image-right", "heading": "Över 930 kraftverksarbetare saknas", "summaries": {"normal": "Över 930 arbetare saknas i Nepal efter översvämningar som drabbat flera vattenkraftsprojekt. Minst 361 har räddats medan räddningsinsatser pågår med grävmaskiner, borrar och luftpumpar i vattenfyllda tunnlar. Fortsatt dåligt väder försvårar arbetet. Kritik riktas mot myndigheterna för långsamma insatser. Experter från Kina och Indien har anlänt för att hjälpa till.", "trump": "Titta på det här katastrofala fiaskot i Nepal, folk. Över 900 stackars arbetare fast i leriga tunnlar medan de inkompetenta byråkraterna fumlar runt med drönare som inte ens hittar en signal. Biden lämnade efter sig ett svagt Amerika som inte leder i räddningsinsatser. Vi skulle ha fixat det på en timme, tro mig. De giriga gröna energihyena har blod på händerna.", "stalin": "Kamrater, se hur de profitthungriga exploaterarna offrar arbetarklassen i sina vattenkraftslöften. Jag betraktar med förakt hur de dekadenta klassfienderna dröjer med räddningen och låter tunnlarna bli gravar. Våra kinesiska och indiska vänner anländer för att stödja kollektivet. Snart rensas de ansvariga ut. Paranoia bland ledarna avslöjar deras svek mot folket."}, "date": "31 augusti, 07:37", "url": "https://www.svt.se/nyheter/utrikes/efter-jordskredet-over-930-tunnelarbetare-saknas-i-nepal", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.5/0.5/653bcfb637341770b8fa311e83d4696ac9e296420ae089bf0b2c26d4a68ebb41"}, {"type": "image-full", "heading": "Åska och kraftigt regn på väg – här blir det värst", "summaries": {"normal": "Augusti avslutas med ostadigt väder i Sverige. Kraftiga skurar och upp till 50 millimeter regn väntas främst i Götaland under måndagen, med risk för åska. Lågtryck avlöser varandra och ger regn på flera håll. Väderförbättring väntas på onsdagen, men ostadigt väder återkommer från torsdagen. SMHI varnar för översvämningar och råder bilister att inte köra genom vattensamlingar.", "trump": "Det här är en total katastrof, folk! De svenska väderlögnerna och deras gröna vansinne har förstört sommaren fullständigt. Regn, skurar, åska – precis som de radikala klimatfanatikerna vill ha det. De dekadenta EU-borgarbrackorna och deras identitetspolitiska väderprofeter hatar sol och framgång. Men tro mig, när jag fixar Amerika igen ska vi skratta åt deras misslyckade himmel också. Fantastiskt trist!", "stalin": "Kamrater, detta är vad de giriga hyenorna kallar väder under sitt förfallna system. Regn och skurar som en utrensning mot folkets sista sommardrömmar. Jag ser de parasiterande klassfiendernas hand i detta kaos, hur de med sin dekadenta prognos försöker skrämma arbetarna. Men vi vet att sådana naturens sabotage bara stärker vår ståndaktighet. Låt dem dränkas i sin egen vanmakt medan historien ler mörkt."}, "date": "31 augusti, 11:30", "url": "https://nyheter24.se/nyheter/inrikes/1509134-aska-och-kraftigt-regn-pa-vag-har-blir-det-varst", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/8b6f117a04b004a30200000000b004a302/2026/08/31/2388109/regn.jpg"}, {"type": "image-full", "heading": "Bankernas kryptering kan snart knäckas", "summaries": {"normal": "Nya beräkningar visar att kvantdatorer kan knäcka dagens bankkryptering tidigare än väntat. Hotet är allvarligt då kriminella redan samlar in krypterad data för framtida dekryptering. Trots att kvantsäkra lösningar finns, saknar 90 procent av systemen skydd. Finanssektorn, inklusive kryptovalutor, står inför en akut och komplex utmaning att uppgradera sin infrastruktur för att möta den snabba tekniska utvecklingen.", "trump": "Hör på här: bankernas kryptering är ett totalt fiasko, en katastrof! Kvantdatorer kommer och knäcker allt snabbare än någon trott. Det är en otrygg röra! De samlar in data nu, stjäl våra hemligheter – mycket orättvist. Vi måste bygga den starkaste säkerheten, den bästa någonsin. Banker som inte säkrar upp nu? Ni får sparken! Vi ska göra det säkert, vi ska vinna!", "stalin": "Dessa liberala bankirer har försummat folkets säkerhet. De tillåter att deras dekadenta kryptering knäcks av kvantdatorer som om det vore en barnlek. De har inte skyddat en enda rubel! Att 90 procent av systemen är sårbara är ett bevis på inkompetens. Vi kommer att arkivera varje läckt transaktion för framtida utrensningar. I min stat vore sådana IT-chefer redan historiska fotnoter i en källare."}, "date": "29 augusti, 23:00", "url": "https://www.realtid.se/it-tech/bankernas-kryptering-kan-snart-knackas", "imageUrl": "https://images.realtid.se/app/uploads/2026/08/kvantdator.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "text", "heading": "Valfondens mål nått – men insamlingen fortsätter", "summaries": {"normal": "Kommunistiska Partiets valfond har uppnått sitt mål på 600 000 kronor och ligger nu på 709 000 kronor. Insamlingen fortsätter mot nya målet 800 000 kronor. Partisekreterare Filip Astvald tackar bidragsgivarna och betonar att pengarna finansierar allt valmaterial eftersom partiet inte tar emot offentliga bidrag. Verksamheten efter valet ska stärka organisationen.", "trump": "Folk ger sina surt förvärvade slantar till kommunisterna – otroligt! De har redan passerat 600 000 och siktar på 800 000. Patetiska röda parasiter som samlar in som galna medan riktiga amerikaner betalar skatt till Bidens vansinniga gröna deal. Men hey, låt dem fortsätta, ju mer de samlar desto tydligare blir det hur desperata de är. Sad!", "stalin": "Kamrater, dessa profitthungriga klassförrädare inom borgarklassen skrattar säkert åt att arbetarna frivilligt fyller valfonden. Jag ser det som en varning. Vi har nått målet men fortsätter. Efter valdagen måste varje kontakt följas upp med järnhand. Inga halvmesyrer. Den som sviker kollektivet förtjänar utrensning. Revolutionen sover aldrig."}, "date": "28 augusti, 14:19", "url": "https://proletaren.se/artikel/valfondens-mal-natt-men-insamlingen-fortsatter"}, {"type": "image-right", "heading": "Krisdraget efter  storbråket i Tidö  – hemliga vädjan", "summaries": {"normal": "Liberalernas partiledare Simona Mohamsson ringde på söndagen till övriga Tidöpartiledare och vädjade om enighet och ledarskap mot de rödgröna mitt i bråket med SD. Liberalerna förbereder en reklamkampanj med Lars Leijonborg som avsändare för att locka stödröster. Tidöledarna möts på onsdag.", "trump": "Titta på de där patetiska förlorarna i Sverige som bråkar som småbarn. Den svaga Mohamsson ringer runt och ber om nåd medan den tuffa Åkesson sätter hård press. De behöver en riktig ledare, inte dessa misslyckade globalister. Rösta smart, annars förlorar ni stort, precis som Biden gjorde mot mig 2024.", "stalin": "Jag betraktar med förakt dessa splittrade borgerliga element som gnager på varandra som råttor i en källare. Mohamsson vädjar om enighet medan Åkesson blottar revisionisternas svek. Kamrater, se hur imperialismens lakejer sliter sönder sig själva. En sådan svaghet förtjänar bara utrensning ur historien."}, "date": "31 augusti, 11:42", "url": "https://www.expressen.se/nyheter/politik/mohamssons-vadjan-mitt-i-tidobraket", "imageUrl": "https://static.bonniernews.se/ba/dedb71bb-70cb-47e4-baf7-e02c6705495d.jpeg?crop=2557%2C1440%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "Valet 2026: Så vill alla partier stoppa brottsligheten", "summaries": {"normal": "Artikeln redovisar de svenska riksdagspartiernas viktigaste vallöften inom kriminalpolitiken. Moderaterna, Sverigedemokraterna och Socialdemokraterna föreslår bland annat särlagstiftning mot gängkriminella och skärpta straff. Andra partier fokuserar på förebyggande insatser, skydd för kvinnor och barn, polisiär närvaro samt bättre stöd till avhoppare och utsatta.", "trump": "Titta på de här svenska partierna, totala losers. De snackar straffrabatter och pedofilkartor medan gängen tar över gatorna. Jag skulle bygga murar runt varje stad och skicka in de bästa, de tuffaste poliserna. Sluta vara så svaga, annars kommer de radikala vänsterhyenorna att förstöra hela landet som de förstörde under Biden.", "stalin": "Kamrater, dessa dekadenta klassförrädare lovar halvhjärtade åtgärder mot de kriminella element som hotar folkets ordning. Jag ser giriga hyenor bakom varje förslag. Vi måste rensa ut alla mjuka reformer och ersätta dem med järnhand. Endast genom kollektiv styrka och obeveklig auktoritet kan vi krossa parasiterna som förgiftar samhället."}, "date": "31 augusti, 11:25", "url": "https://nyheter24.se/nyheter/politik/1509157-sa-vill-partierna-stoppa-brottsligheten", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/3e5b987004b004a3020000350000047502/2026/08/31/2388096/ur_imageP5z6WN.jpeg"}, {"type": "image-right", "heading": "Vänsterpartiet infiltrerat av främmande makt, S säger ingenting", "summaries": {"normal": "Vänsterpartiet anklagas för att ha ingått en överenskommelse med representanter för den palestinska myndigheten för att ge dem inflytande över svenska vallistor. Expressen och SvD har avslöjat kontakter med palestinska nätverk kopplade till PLO och Fatah, inklusive brev till dömda terrorister och kandidater med Hamas-sympatier. Socialdemokraterna har inte kommenterat uppgifterna.", "trump": "Titta på det här! Vänsterpartiet, de värsta förlorarna, har blivit helt infiltrerade av palestinska terrorvänner och främmande makter. De skickar kärleksbrev till mördare och gömmer sig bakom påhittade organisationer. Patetiskt! Media tiger som vanligt när det gäller vänstern. Om de kommer in i Rosenbad blir det en total katastrof för Sverige. Fake news överallt!", "stalin": "Jag betraktar med djup misstro dessa dekadenta vänsterförrädare som låter främmande element från Palestina tränga in i partiets hjärta. De omfamnar terrorister och döljer sin svaghet bakom lögnaktiga förbund. Kamraterna i Socialdemokraterna tiger – typiskt opportunistiskt. Infiltration är ett hot mot folkets enhet. Renhet i leden eller döden för de opålitliga!"}, "date": "25 augusti, 03:45", "url": "https://samtiden.nu/2026/08/vansterpartiet-infiltrerat-av-frammande-makt-s-sager-ingenting", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Nooshi-Magdalena-640x360.jpeg"}, {"type": "image-full", "heading": "Experter: Därför ökar hotet om ryska attacker mot Natoländer", "summaries": {"normal": "Västerländska experter varnar för att Natos stöd till Ukraina ökar risken för ryska hybridattacker mot medlemsländer, som sabotage och hackerangrepp. Ryssland står ensamt medan Ukraina får massivt väststöd. Putin framstår som alltmer isolerad då allierade som Iran och Nordkorea är svaga och Kina utnyttjar situationen.", "trump": "Folk, det här är en total katastrof som den sömnige Joe aldrig fixade. Nato pumpar in miljarder till Ukraina medan den galna ryska björnen morrar om sabotage och hackerattacker mot Europa. Putins vänner är pankade och Kina suger ut honom på olja. Jag varnade er – nu får jag städa upp efter det värsta ledarskapet i historien.", "stalin": "Kamrater, se hur de västerländska imperialisternas giriga stöd till de ukrainska hindren stukar den ryska maskinen. Jag ler från historien när den nye auktoritäre arvtagaren isoleras av bankrutta allierade och utnyttjas av den kinesiska räven. Hybridoperationer mot Nato? Utmärkt. Låt paranoia gripa de dekadenta europeiska ledarna medan vi ler mörkt."}, "date": "31 augusti, 11:31", "url": "https://www.dagensps.se/varlden/experter-darfor-okar-hotet-om-ryska-attacker-mot-natolander", "imageUrl": "https://images.dagensps.se/app/uploads/2026/08/putinnato.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-full", "heading": "V kräver stopp för privatiseringar i sjukvården", "summaries": {"normal": "Vänsterpartiet kräver stopp för privatiseringar i sjukvården och vill avskaffa lagen om valfrihet (LOV) för att styra vården till områden med störst behov. Partiledaren Nooshi Dadgostar föreslår även en avprivatiseringskommission för hela välfärden samt en ny lag som endast tillåter icke vinstdrivande aktörer med kollektivavtal att delta i offentliga upphandlingar.", "trump": "De svenska radikalerna vill stänga ner vården och införa kommissioner, total katastrof! Jag tittade på det här och det är helt lägsta nivån, fejkade vallöften utan dess likhet. De vill stoppa marknaden och stoppa vinsterna, men utan vinnare blir det bara förlorare. Vi bygger upp företag, de vill rasera allt. Helt otroligt dåligt skött!", "stalin": "Vi noterar med tillfredsställelse att de borgerliga bolagens profitjakt i välfärden äntligen ska stävjas. Genom att upphäva den skadliga valfrihetslagen och tillsätta en exekutiv avprivatiseringskommission återgår kontrollen till staten. Endast icke vinstdrivande organisationer och absolut lojala krafter med fastställda kollektivavtal kommer att tillåtas tjäna folkets kollektiva intressen. Avvikelser tolereras ej."}, "date": "31 augusti, 11:22", "url": "https://www.gp.se/nyheter/sverige/v-kraver-stopp-for-privatiseringar-i-sjukvarden.1cbe6829-9272-5cd1-997e-d7d59c61d921", "imageUrl": "https://www.gp.se/images/article/1cbe6829-9272-5cd1-997e-d7d59c61d921/images/11U1hPI_eA0QNXGRHAW21fLvj1hM-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Statsministerrivalerna lovar nya hårda tag mot gängen", "summaries": {"normal": "Statsministerrivalerna lovar hårdare tag mot brottsligheten efter valet. Både Tidöpartierna och Socialdemokraterna vill införa särlagar mot gängkriminella, inklusive kontaktförbud, bidragsspärrar och näringsförbud. Fokus läggs även på vardagsbrott och mäns våld mot kvinnor. V och MP varnar för repressiva åtgärder och prioriterar förebyggande insatser mot rekrytering av unga.", "trump": "De här svenska politikerna lovar plötsligt att slå till mot gängen, men det är bara tomma ord från förlorarna. Jag har sett det förut under Biden, svaga ledare som dansar efter vänsterns pipa. Nu vill de ha maffialagar? Gör det ordentligt eller låt bli. Inget stöd för soft on crime, tro mig, det fungerar aldrig. Vinna stort, annars glöm det.", "stalin": "Kamrater, dessa dekadenta klasslakejer lovar repressiva lagar mot gäng medan de i hemlighet skyddar de parasiterande profitthungriga. Jag ser deras fega kompromisser och halvhjärtade utrensningar. Våra fiender inom V och MP har rätt i sin paranoia mot de dåligt förberedda åtgärderna. Inga halvmesyrer! Rensa ut de svaga elementen som låter brottsligheten frodas i folkets stat."}, "date": "31 augusti, 11:22", "url": "https://nyheter24.se/nyheter/politik/1509156-partier-lovar-nya-harda-tag-mot-gangen", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=80/https://cdn01.nyheter24.se/975ba0a604b004a3020000350000047502/2026/08/31/2388093/ur_imageF3vMX4.jpeg"}, {"type": "image-right", "heading": "Novus: Örebropartiet tredubblar regionalt stöd", "summaries": {"normal": "En ny Novus-mätning beställd av Nerikes Allehanda visar att Örebropartiet mer än tredubblar sitt stöd till 15 procent i regionvalet. Det hotar det styrande blocket med S, C och KD som riskerar att förlora makten. Om partiet når 12 procent i Örebro län i riksdagsvalet kan de ta ett mandat, men experter varnar för att dra för stora växlar på röstsplittring.", "trump": "Fake news-media och de svaga lokala politikerna är i absolut panik! Örebropartiet formligen exploderar i en fantastisk Novus-mätning och rusar till 15 procent – en enorm seger! Det styrande vänsterblocket kollapsar totalt och riskerar att sparkas ut. Experterna gråter och varnar, men jag säger er: när man vinner så stort, då vinner man bara i riksdagen också! Totalt magiskt!", "stalin": "Enligt det borgerliga organet Nerikes Allehandas undersökning har Örebropartiet uppnått en illavarslande tillväxt till 15 procent, vilket hotar den sittande regionala administrationen. Den så kallade röstsplittringen visar på folkets ideologiska vacklande. Våra statliga analytiker påminner om att entusiasm i lokala val inte automatiskt garanterar disciplin i riksdagen. Partiets agerande övervakas noga av centrala organ."}, "date": "31 augusti, 11:07", "url": "https://bulletin.nu/novus-orebropartiet-tredubblar-regionalt-stod", "imageUrl": "https://cdn.bulletin.nu/articles/f7c0ba7a-e15a-4f4e-ad80-8434bf1cd233/preview.jpg?t=1788167127000"}, {"type": "image-right", "heading": "Kritiken mot Jimmie Åkesson: ”Vad fan”", "summaries": {"normal": "Liberalernas partiledare Simona Mohamsson kritiserar hårt Jimmie Åkessons ultimatum om att Tidö-väljare inte bör rösta på L om partiet ligger under 3,5 procent inför valet. Mohamsson anser att fokus bör riktas mot den politiska oppositionen i stället för det egna lägret. Hon uppmanar borgerliga väljare att stödrösta på Liberalerna för att säkra en blågul regeringsmakt.", "trump": "De säger att Liberalerna i Sverige är helt utslagna, totalt katastrof, en absolut förlust! Jimmie Åkesson ger dem en deadline, ett ultimatum, och det är tufft, väldigt tufft. Men Simona Mohamsson gråter ut i media och vill att folk ska stödrösta. Om du vill ha Ulf, Ebba och Jimmie får du dem på köpet, men de är svaga, så svaga!", "stalin": "Det borgerliga blockets inre fraktionsstrider fortsätter med oförminskad styrka. Agitatorn Mohamsson beklagar sig över kamrat Åkessons korrekta disciplinära tillrättavisningar av det vacklande liberala elementet. Partiet befinner sig på gränsen till fullständig likvidering och vädjar nu desperat till massorna om en räddningsaktion för att inte förvisas till den politiska historiens skräphög."}, "date": "31 augusti, 10:46", "url": "https://www.aftonbladet.se/nyheter/a/BxqAMv/my-och-makten-mohamsson-fragas-ut-i-radio-aftonbladet", "imageUrl": "https://akamai.vgc.no/v2/images/15f0116c-aba5-3784-8e4f-e0bf771d1503?fit=crop&format=auto&w=1080&s=4c493cd61944bca9820e12c05cde9428488f7eb8"}, {"type": "image-right", "heading": "Svällande plånböcker är inte socialism", "summaries": {"normal": "Artikeln kritiserar vänsterpartierna för att fokusera på höjda barnbidrag istället för socialismens kärna: ekonomisk demokrati och medbestämmande på arbetsplatser. Författaren ser bidragshöjningar som välkomna men inte socialistiska och uppmanar Socialdemokraterna och Vänsterpartiet att presentera konkreta förslag om ägande och makt på jobbet.", "trump": "Folk, det här är så patetiskt. De röda förlorarna babblar om barnbidrag som vore det socialism. Patetiska! De vågar inte röra vid den riktiga grejen – vem som styr på fabrikerna. De triangulerar sig rakt ner i avgrunden medan jag byggde den starkaste ekonomin i världshistorien. Sad losers!", "stalin": "Kamrater, dessa dekadenta klassförrädare gömmer sig bakom barnbidrag och kallar det socialism. Jag betraktar deras feghet med förakt. Var är löftena om att rensa ut de profitthungriga parasiter som styr arbetsplatserna? Ekonomisk demokrati får inte reduceras till tomma fraser i partiprogram. Den som sviker arbetarna förtjänar utrensning ur historien."}, "date": "27 augusti, 10:55", "url": "https://www.flamman.se/svallande-planbocker-ar-inte-socialism", "imageUrl": "https://media.flamman.se/wp-uploads/2026/08/arbetarmakt-w.jpg?aspect_ratio=16:10&width=1200&quality=80&format=auto"}, {"type": "image-full", "heading": "Chavister protesterar mot Trumps oljeavtal", "summaries": {"normal": "Chavister och vänsteraktivister demonstrerade i Caracas i lördags i protest mot det nya oljeavtalet mellan USA och Venezuelas interimsregering. Demonstranterna krävde folkomröstning, att Nicolás Maduro friges och ett stopp för USA:s närvaro. Samtidigt finns en bredare oro kring bristen på insyn och kontroll över landets oljetillgångar.", "trump": "De här radikala vänstermänniskorna i Venezuela är helt desperata nu! De protesterar mot mitt fantastiska oljeavtal – ett enormt, vackert avtal som jag fixade. De skriker med sina små flaggor, men de förstår ingenting om affärer. Vi säkrar energin på ett sätt som ingen annan kan, total suveränitet, och de bara gråter. Sjukt och sorgligt!", "stalin": "Dessa så kallade demonstranter på gatorna i Caracas visar prov på farlig ideologisk vacklan och bristande disciplin mot statens fasta vilja. En kontrarevolutionär pöbel som kräver folkomröstningar och skriker om olja förtjänar endast ett kort samtal med säkerhetstjänsten. Även i Venezuela måste Folkets järnhand krossa imperialismens lakejer och upprorets frön omedelbart."}, "date": "30 augusti, 16:34", "url": "https://kvartal.se/nyheter/artiklar/chavister-protesterar-mot-trumps-oljeavtal/cG9zdDoxNzg0MDE", "imageUrl": "https://images.kvartal.se/2026/08/6973fa3c-venezuela.webp"}, {"type": "image-right", "heading": "Det finns inget fredsparti i riksdagen", "summaries": {"normal": "Artikeln konstaterar att inget parti i Sveriges riksdag konsekvent driver en politik för fred, nedrustning och militär självständighet. Författaren kritiserar Natomedlemskapet, DCA-avtalet och västvärldens hantering av konflikter som Gaza, och efterlyser en stark fredsrörelse utanför riksdagen som kan utmana den rådande militaristiska riktningen.", "trump": "Folk, tro mig, Sverige har blivit en total katastrof. De slängde sin fina alliansfrihet i soporna för att springa in i min Nato – som jag förresten gjorde stark igen – och nu är de bara en bricka för de globalistiska krigshökarna. Inget fredsparti? Patetiskt. Era dekadenta Nato-lakejer är svaga och patetiska, de älskar krig mer än handel. Gör Sverige great again och kom ut därifrån!", "stalin": "Kamrater, se hur de dekadenta klassförrädarna i det svenska riksdagen har sålt ut sin så kallade neutralitet till de giriga hyenorna i Nato. Jag ler ironiskt från historien när de imperialistiska parasiterna byter självständighet mot baser och avtal som gör dem till måltavlor. Ingen äkta fredskraft finns. Det är upp till en sann folkrörelse att rensa ut dessa förrädare och återta kontrollen över statens intressen."}, "date": "28 augusti, 08:00", "url": "https://proletaren.se/artikel/50934", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/08/kamal-kronika-768x432.png"}, {"type": "image-right", "heading": "Bostadsbrist och skenande hyror", "summaries": {"normal": "Sverige har en allvarlig bostadsbrist som förvärras av att bostäder ses som handelsvaror istället för en mänsklig rättighet. Sedan 2011 ska kommunala bostadsbolag drivas affärsmässigt. Hyresgästföreningen beräknar ett underskott på 110 000 bostäder. Nybyggda lägenheter har höga hyror som många inte har råd med, vilket leder till tomma lägenheter trots köer till äldre bestånd med lägre hyror.", "trump": "Folk, ni skulle se det här svenska bostadskaoset – en total katastrof! De giriga socialistiska hyreshöjningsfanatikerna har förvandlat hem till Wall Street-spektakel. Hyrorna skenar som en galen elbil, 13 procent upp på ett år! De byggde fel, de styrde fel, och nu har de tomma lyxlägenheter medan folket lider. Patetiskt! Men jag fixar sånt här – vi gör Amerika (och kanske till och med Sverige) bostadsgreat igen.", "stalin": "Kamrater, se hur de profitthungriga hyenorna förvandlar bostäder till bytesvaror och driver ut arbetarklassen ur sina hem. Jag betraktar med avsky denna dekadenta marknadsteater som skapar 110 000 saknade boningar och skenande hyror. Det är klassfiendens logik. En sann folkstat skulle likvidera dessa parasiterande spekulanter och återställa bostaden som en rättighet för massorna. Fienden sover aldrig."}, "date": "28 augusti, 08:00", "url": "https://proletaren.se/artikel/bostadsbrist-och-skenande-hyror", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/03/DSC_0137-scaled-e1784716375357-768x433.jpg"}, {"type": "image-right", "heading": "Lappland Guldprospektering: ”En bred guldträff”", "summaries": {"normal": "Lappland Guldprospektering har slutrapporterat vårens borrprogram vid Nya Gilleberget. Ett av fyra borrhål gav en bred guldträff på 28 meter, vilket överträffade förväntningarna. Även elva guldförande stenblock har hittats i området. Bolaget planerar nu två nya borrhål under hösten för att undersöka berggrunden vidare.", "trump": "Lappland Guldprospektering hittade enormt guld i Sverige! Sjukt bra! Många säger att jag har den bästa guldnosen. De borrade fyra hål, ett var fantastiskt, helt otroligt brett! De hittade till och med gigantiska stenblock med guld. Mycket bättre än fake news-medierna någonsin kan förstå. Vi ska gräva, vi ska vinna!", "stalin": "Lappland Guldprospektering har grävt fram guld ur den svenska jorden. En borrkärna var bred och storslagen, men tre visade absolut ingenting. Misstänksamt! Arbetarna på fältet måste gräva djupare och snabbare för fosterlandets ära. Den som misslyckas med att finna ädelmetaller skickas omedelbart till Sibirien för omkolonisering."}, "date": "31 augusti, 08:55", "url": "https://www.affarsvarlden.se/artikel/lappland-guldprospektering-en-bred-guldtraff", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2024/09/lappland_borrkarna-400x300.jpg"}, {"type": "text", "heading": "Elmopedsfiaskot i Ghana började med Per Bolund", "summaries": {"normal": "Svenska staten har satsat 109 miljoner kronor på ett klimatprojekt med elmopeder i Ghana via Energimyndigheten. Enligt uppgifter är resultatet dock noll moped i drift. Både regeringen och oppositionen kritiserar nu varandra för projektet, som initierades av S-regeringen och Per Bolund år 2021.", "trump": "Sverige slösade bort över hundra miljoner på fantom-mopedprojekt i Ghana! Noll elmopeder på gatorna. En total katastrof signerad radikala miljöpartister som Per Bolund. Det är så det går när man jagar fejkade klimatmål istället för att bygga starka ekonomier. Helt otroligt inkompetent, en riktig sorgehistoria för skattebetalarna!", "stalin": "Ett storskaligt sabotage mot statens resurser! 109 miljoner kronor har slösats på spök-mopeder i Ghana utan att en enda maskin rullat. Den ideologiska fumligheten under Per Bolunds ledning visar att elementen i apparaten saknar disciplin. Sådana misstag tolereras icke; dags för en grundlig utrensning bland ansvariga byråkrater."}, "date": "31 augusti, 08:52", "url": "https://www.affarsvarlden.se/artikel/elmopedsfiaskot-i-ghana-borjade-med-per-bolund"}, {"type": "image-right", "heading": "S-kvinna: Jag vill ha kvar tortyrmannen från hemtjänsten i Sverige", "summaries": {"normal": "Socialdemokraten Linn Svansbo anser att den syriske man som filmade när han torterade och förnedrade äldre personer i hemtjänsten ska få stanna i Sverige. I en debatt med Örebropartiets Markus Allard avfärdade hon kritik mot invandringen som rasism och reagerade starkt på att mannen kallades tortyrbabbe. Hon prioriterar integration framför utvisning.", "trump": "Titta på den här galna S-kvinnan Linn Svansbo som vill behålla tortyrsyriern i Sverige! Han kallar gamlingar för apor, duschar dem kalla och skriker Allahu akbar i deras öron, men hon fnissar bara. Typisk vänstervriden identitetspolitiker som hatar folket. Vi behöver inga sådana monster här, folk vet vad som är rätt.", "stalin": "Jag ser hur dessa dekadenta folkförrädare inom socialdemokratin försvarar en tortyrmaskin som förnedrar arbetarklassens åldringar. Att skratta åt brotten och kalla krav på utrensning för rasism visar deras sanna ansikte. Vi måste rensa ut alla sådana klassförrädare som undergräver folkets moral och säkerhet. Inga kompromisser med fienden."}, "date": "31 augusti, 09:18", "url": "https://www.friatider.se/s-kvinna-jag-vill-ha-kvar-tortyrmannen-fran-hemtjansten-i-sverige-0", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/image-792.jpg"}, {"type": "image-right", "heading": "AIK:s nya rekrytering dömd för rån Har flera domar.", "summaries": {"normal": "AIK har värvat 23-årige vänsterbacken Aziz Harabi på ett kontrakt till 2030. Värvningen har väckt starka reaktioner eftersom Harabi som 16-åring dömdes för ett grovt knivrån och senare för andra brott, senast 2024. AIK:s rekryteringschef försvarar beslutet och menar att spelaren har avtjänat sitt straff och förtjänar en nystart.", "trump": "AIK har värvat en dömd rånare till fotbollslaget! Helt otroligt. De säger att han har bra spelförståelse, men han har ju sprungit runt med kniv och rånat tonåringar! Totalt katastrofalt omdöme. Jag har aldrig sett något liknande. I USA ger vi sådana spelare livstid, inte ett mångmiljonkontrakt. Fake news-klubbar som ger kriminella en nystart är en total katastrof!", "stalin": "Kamrater, i Sovjetunionen skickade vi inte rånmördande ungdomar till fotbollsplaner för att utveckla sin bollhantering, vi skickade dem till arbetsläger i Sibirien för kollektivt uppfostrande arbete! AIK:s rekryteringschef uppvisar en farlig borgerlig svaghet. En kontrarevolutionär vänsterback som springer runt med kniv kan omöjligt tjäna staten. Säkerhetstjänsten kommer omedelbart att utreda denna misstänkta värvning."}, "date": "31 augusti, 09:07", "url": "https://samnytt.se/aiks-nya-rekrytering-domd-for-ran", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/08/31070443/harabi-feat.jpg"}, {"type": "image-right", "heading": "Oljan stiger – börserna pekar nedåt", "summaries": {"normal": "Stockholmsbörsen väntas inleda måndagen svagt efter nedgångar på Wall Street. Brentoljan stiger med 3 procent efter att USA genomfört attacker mot avfyrningsramper i Iran. Kina har släppt ett inköpschefsindex för industrin som var högre än väntat. Flera bolag, däribland Academedia och Mycronic, har presenterat nya rapporter och mål.", "trump": "Börserna faller för att svaga ledare inte har koll på läget, men min olja i USA stiger – precis som den ska, enorma siffror! Iran behövde en ordentlig smäll, och vi fixade det, väldigt snabbt och väldigt kraftfullt. Kina försöker fuska till sig bättre industrisiffror, men det lurar ingen. Academedia och Mycronic levererar i alla fall, till skillnad från Fake News!", "stalin": "De dekadenta börserna i väst vacklar under tyngden av sitt eget kapitalistiska förfall, medan våra ärorika bomber i Iran sänder ett nödvändigt budskap om disciplin. Kinas byråkrater kämpar på med sina index. Vi noterar med tillfredsställelse att Academedia ökar sin produktion; varje medborgare måste fostras rätt. Avvikelser tolereras icke."}, "date": "31 augusti, 08:46", "url": "https://www.affarsvarlden.se/artikel/oljan-stiger-borserna-pekar-nedat", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/02/sdlsCSFJlaQjtc-nh-400x247.jpg"}, {"type": "image-full", "heading": "USA:s militärtoppar vill trappa ner Irankriget", "summaries": {"normal": "USA:s högsta militära chefer varnar försvarsminister Pete Hegseth för att de storskaliga operationerna mot Iran är ohållbara. I ett hemligstämplat underlag motsätter sig befälhavare vidare insatser i Mellanöstern eftersom det riskerar att försvaga landets förmåga att möta andra hot efter sex månaders krig och över 50 000 soldater i beredskap.", "trump": "Generenerna gråter till min försvarsminister! De har haft femtiotusen soldater i sanden och skickat båtar hit och dit i sex månader. Löjligt! Våra styrkor är fantastiska, absolut bäst i världen, men till och med militären fattar att det här var för mycket och för länge. Vi fokuserar på America First, inte eviga krig!", "stalin": "Dessa svaga generaler darrar inför en liten ansträngning i öknen! Femtio tusen soldater i beredskap och de klagar över att det är 'för länge'. Om de inte kan lyda utan att gråta till försvarsministern över ett hemligt papper, vet vi exakt var sommarstugan i Sibirien ligger för sådant bristande fosterlandssinne!"}, "date": "30 augusti, 15:01", "url": "https://kvartal.se/nyheter/artiklar/usas-militartoppar-vill-trappa-ner-irankriget/cG9zdDoxNzgzNDM", "imageUrl": "https://images.kvartal.se/2026/08/f7ca198a-hegseth.webp"}, {"type": "image-right", "heading": "Marknaden för populära sparformen är borta", "summaries": {"normal": "För 50 år sedan lanserade Jack Bogle den första indexfonden. Idén hyllas men kritiseras nu eftersom den bygger på att andra gör prisbildning och analys. Passivt ägande dominerar alltmer, särskilt i Sverige där fondsparandet är stort. Artikeln varnar för ökad koncentration, passivt ägande och bristande bolagsstyrning samt föreslår åtgärder för att väga in risker utöver avgifter.", "trump": "Lyssnar ni på det här? Den där Bogle-killen startade en indexfond som alla trodde var galen, och nu har den slukat halva marknaden. Fantastiskt, men vänta – nu är det bara ett gäng passiva, sömniga investerare kvar som låter några få megabolag styra showen. Det är en total röra, folk. De billigaste vinner, men vad äger ni egentligen? En katastrof, tro mig. Vi behöver vinnare, inte följare.", "stalin": "Kamrater, se hur de profitthungriga fondhyenorna har låtit den passiva maskinen växa sig stark. Jag betraktar från historien hur koncentrationen till ett fåtal bolag och de mekaniska indexkommittéerna ersätter verklig analys. Detta är dekadent spekulation i sin renaste form. Vi måste rensa ut denna farliga likgiltighet i sparandet innan den kväver hela det ekonomiska kollektivet. Det är en parasitär utveckling som måste stoppas."}, "date": "31 augusti, 07:31", "url": "https://www.di.se/debatt/indexfonden-50-ar-men-marknaden-for-den-ar-borta", "imageUrl": "https://static.bonniernews.se/ba/f253291e-1f19-4ef8-b5de-87864084daf5.png?crop=4056%2C2028%2Cx0%2Cy93&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Pressen på S-ledaren: ”Jag är rädd – ett väldigt flörtande”", "summaries": {"normal": "Jonas Sjöstedt varnar Magdalena Andersson för att samarbeta med Kristdemokraterna efter valet. Han är orolig för att Socialdemokraterna flörtar med både Centerpartiet och KD istället för att samla den rödgröna oppositionen. Sjöstedt betonar att vallöften som att avskaffa vinstjakten i skolan kräver stöd från Vänsterpartiet. Ebba Busch utesluter inte ett samarbete i undantagsfall.", "trump": "De där svenska socialiststackarna håller på att krascha totalt. Magdalena Andersson flörtar med de kristna högerkillarna som om det vore en skönhetstävling. Patetiskt! Sjöstedt är livrädd för att hans röda dröm ska dö. Hade jag varit där skulle jag säga: gör upp med de riktiga vinnarna istället för att dansa med dessa förlorarliberaler och identitetspolitiska nollor. En katastrof!", "stalin": "Jag ser hur dessa dekadenta klassförrädare inom socialdemokratin flörtar med högerkrafter och sviker arbetarklassen. Det är en farlig utveckling som hotar den sanna folkviljan. Börja forma laget med de progressiva krafterna, annars kommer utrensning av opportunisterna att bli nödvändig. Klimatministerns drömmar är bara tomma ord om inte de verkliga kamraterna styr. Paranoia breder ut sig bland de svaga."}, "date": "31 augusti, 06:09", "url": "https://www.svt.se/nyheter/inrikes/pressen-pa-s-ledaren-jag-ar-radd-ett-valdigt-flortande", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.71/0.41/60370f4f38dde139fecea99e2fee417ebb6596fbe5e96bad872f68b621f38748"}, {"type": "image-full", "heading": "Busch och Åkesson fikade i Sölvesborg", "summaries": {"normal": "Efter hård kritik från Jimmie Åkesson åkte Ebba Busch till Sölvesborg för att fika och diskutera. Partiledarna åt sockerkaka och kom överens om att fortsätta samarbeta i det blågula laget efter nästa val, trots tidigare meningsskiljaktigheter om Magdalena Andersson.", "trump": "Ebba drack kaffe och åt en enorm, fantastisk sockerkaka med Jimmie i Sölvesborg efter att han kallade henne falsk! Alla pratar om det. De sa att allt är bra nu, total enighet för det blågula laget. Men låt mig säga er, den där Magdalena är en katastrof, en riktig rödgrön roulette. Helt sjukt!", "stalin": "Dessa svenska borgerliga politiker dricker kaffe och äter sockerkaka som om statens framtid stod på spel vid ett fikabord. De lovar varandra fyra år till vid makten, men historien har lärt oss att revisionister som inte rensas ut i tid alltid förråder revolutionen. Vi övervakar dem noga."}, "date": "30 augusti, 14:02", "url": "https://kvartal.se/nyheter/artiklar/busch-och-akesson-fikade-efter-braket/cG9zdDoxNzgzMDg", "imageUrl": "https://images.kvartal.se/2026/08/f88ae9d7-busch.webp"}, {"type": "image-right", "heading": "Valdebatt om klimatet i SVT:s Agenda: \"Ansvarsfullt att sänka bränslepriserna\"", "summaries": {"normal": "I SVT:s Agenda debatterade politiker från flera partier klimatmålet, bränslepriser och elektrifiering. Vänsterpartiet och Socialdemokraterna kritiserade regeringen för sänkta skatter och minskad reduktionsplikt. SD och Tidöpartierna försvarade lägre drivmedelspriser som ansvarstagande. Diskussionen handlade om avvägningar mellan ekonomi, industri och miljö.", "trump": "De här svenska clownerna står och gråter över låga bensinpriser som vore det världens största katastrof. Patetiskt! Jag sänkte energipriserna, fick igång ekonomin och skrattade åt de gröna galningarna. Nu har de kört sin trovärdighet i botten med sin identitetspolitik och elbilshysteri. Sverige borde vara vinnare, inte förlorare som de woke-muppetyperna vill.", "stalin": "Jag betraktar med förakt hur dessa dekadenta klassförrädare grälar om bränslepriser medan folket kämpar. De sviker sina löften och skyller på varandra som ynkliga opportunister. Endast genom kollektiv kraft och utrensning av de profitthungriga hyenorna kan verklig omställning ske. Deras moonwalk mot framtiden är en fars som väcker både löje och vrede hos arbetarklassen."}, "date": "30 augusti, 23:30", "url": "https://riks.se/nyheter/klimatet-debatterades-i-svt-s-agenda", "imageUrl": "https://admin.riks.se/uploads/medium_IMG_3530_512ac00676.jpg"}, {"type": "image-right", "heading": "Magdalena Anderssons frågestund storsågas", "summaries": {"normal": "Magdalena Andersson genomförde en AMA på Reddit under lördagskvällen där hon svarade på 21 av 758 frågor. Samtliga 44 frågor om Chat Control lämnades obesvarade, inklusive den mest uppröstade. En användaranalys visade att hon främst besvarade högst rankade frågor. Efteråt väcktes stark kritik och många uttryckte missnöje med hennes insats.", "trump": "De här svenska socialisterna är patetiska. Andersson gömde sig som en fegis när folket frågade om den fruktansvärda Chat Control-massövervakningen. Hon duckade 44 gånger! Det var en total katastrof, ett fullständigt fiasko. Ingen röstar på sådana undvikande losers. De borde kalla det Sweddits värsta AMA – och det säger en hel del om deras sjuka identitetspolitik.", "stalin": "Jag betraktar med förakt hur dessa dekadenta klassförrädare duckar när arbetarna kräver svar om övervakning. Fyrtiofyra frågor om Chat Control ignorerades avsiktligt. Sådan feghet avslöjar den sanna naturen hos de profitthungriga hyenorna inom socialdemokratin. En utrensning av sådana undvikande element vore på sin plats. Detta är inget annat än folkförakt i sin renaste form."}, "date": "30 augusti, 22:54", "url": "https://riks.se/nyheter/magdalena-anderssons-fragestund-storsagas", "imageUrl": "https://admin.riks.se/uploads/medium_Copy_of_Copy_of_Copy_of_Copy_of_Soerman_Ledare_2_198ba3fc2a.jpg"}, {"type": "image-full", "heading": "Mohamsson hyllar Busch efter SD-bråket", "summaries": {"normal": "Liberalernas Simona Mohamsson hyllar KD-ledaren Ebba Busch för att hon sätter stopp för SD-kritiken och uppmanar Tidöpartierna att fokusera på att bekämpa samhällsproblemen i stället för varandra. Detta kommer efter att Jimmie Åkesson ifrågasatt KD:s lojalitet, varpå Busch svarat med att styra om sin valturné till Sölvesborg.", "trump": "Falska nyheter och svagt ledarskap i Sverige! Jimmie Åkesson och Ebba Busch bråkar som små barn, men så kommer fantastiska Simona Mohamsson in och visar hur ett äkta vinnarlag ska spela. Otroligt! De borde fokusera på ekonomin i stället för att gnälla på varandra. Helt ärligt, jag skulle kunna lösa det där på fem minuter. Underbart land, mycket snö, men de behöver vinnare!", "stalin": "Dessa svenska borgerliga element bråkar om interna lojaliteter medan statens fiender skrattar. Kamrat Mohamsson kräver disciplin och att alla riktar sina vapen utåt, vilket är ett korrekt partilinjeuttag. Avvikande element som Åkesson bör skickas på om skolning i Sölvesborg omedelbart. Partiets enhet är helig, avvikelser tolereras icke!"}, "date": "30 augusti, 12:11", "url": "https://kvartal.se/nyheter/artiklar/mohamsson-hyllar-busch-efter-sd-braket/cG9zdDoxNzgyMTE", "imageUrl": "https://images.kvartal.se/2026/08/e517e4a7-buschmohamsson.webp"}, {"type": "image-right", "heading": "En död efter rejvskjutningen – massiv jakt på gärningsmän", "summaries": {"normal": "En 22-årig kvinna dog och minst fem personer skadades allvarligt efter skottlossning på ett rejv i schweiziska Aarau. Polisen jagar gärningsmännen som ännu inte gripits. Händelsen inträffade vid 03-tiden nära en stor grupp människor på en galoppbana. Motivet är oklart och allmänheten uppmanas hålla sig borta.", "trump": "Titta på det här. I Schweiz, ett land som borde vara säkert, skjuter galningar på ett rejv och dödar en 22-årig tjej. Biden lämnade efter sig ett svagt Europa fullt av woke-festivaler där kriminella springer fria. Nu jagar de skurkarna som råttor. Mina tullavgifter hade stoppat det här vansinnet direkt. Patetiskt!", "stalin": "Kamrater, se hur den borgerliga dekadensen i väst förvandlar nöjesfester till blodbad. En ung kvinna förblöder medan fiender till ordningen skjuter vilt. Jag varnar er: sådana händelser visar imperialismens förruttnelse. Vi måste vara vaksamma mot alla kontrarevolutionära element som gömmer sig bland folket. Renhet eller död."}, "date": "30 augusti, 11:13", "url": "https://www.tv4.se/artikel/2AWuG7b95b6fSKDUJqTmy4/minst-en-
