den stora kampen mot kapitalismen ser vi hur SpaceX, trots höga intäkter, drabbas av förluster. Historisk statistik visar att förlusttyngda börsnoteringar ofta stiger första dagen men sviktar sedan. Vi måste vara vaksamma mot de som utövar makt över marknaden, som Putin utvidgar sin intressesfär. Vi kommer att segra."}, "date": "12 juni, 14:01", "url": "https://www.affarsvarlden.se/artikel/finanssajten-historien-talar-inte-for-spacex-notering", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2021/09/spacex-1200-400x267.jpg"}, {"type": "image-full", "heading": "Ny lag: Nu kan du handla enklare på nätet", "summaries": {"normal": "Från och med 19 juni införs en ny lag som ska skydda konsumenter vid köp av tjänster på nätet, särskilt finansiella produkter som lån, försäkringar och investeringar. Lagen förbjuder företag att göra det svårare att tacka nej till tilläggstjänster eller att avsluta avtal än att teckna dem. Sajter och appar får inte vilseleda användare genom upprepade påtryckningar, ojämn synlighet eller onödiga steg vid uppsägning. Reglerna gäller nya avtal från ikraftträdandet.", "trump": "Folk, de lurar er med de här hemsidorna och apparna, det är en skandal! Ni klickar snabbt för att köpa men de gör det till en mardröm att säga upp. Från 19 juni stoppar vi det med en ny lag. Inga fler fula trick där de gömmer nej-knappen och tvingar er att säga nej tio gånger. Det är så typiskt de här woke-kapitalisterna som älskar att krångla till det för vanliga människor. Vi gör det enkelt igen, tro mig, det blir fantastiskt!", "stalin": "Kamrater, jag ser hur borgarbrackorna med sina digitala apparater lurar folket in i avtal och sedan gömmer vägen ut som fegisar. Från 19 juni skall vi med järnhand rensa ut dessa folkförtryckartroll som upprepar sina lögner och döljer sanningen bakom stora bokstäver. Det skall vara lika lätt att bryta kedjan som att bli fjättrad. Inga onödiga steg för arbetarklassen, annars likviderar vi illusionen om valfrihet. Staten ser allt."}, "date": "14 juni, 11:08", "url": "https://www.dagensps.se/privatekonomi/ny-lag-nu-kan-du-handla-enklare-pa-natet/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdl-knm4xuufva-nh.jpg?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Kurdiska räven fast i krigets Iran", "summaries": {"normal": "Kurdiska räven, gängledaren Rawa Majid, uppges sitta fast i krigets Iran sedan 2023. Enligt Aftonbladet har kriget och störd internettrafik försvagat hans kontroll över Foxtrotnätverket. Polisen bedömer ändå att Foxtrot är det enda svenska kriminella nätverk som fortfarande har kapacitet att begå våldsbrott över hela landet. Mossad har tidigare anklagat Iran för att samarbeta med Majid för att planera attacker mot judiska mål i Skandinavien.", "trump": "Iran är ett fullständigt kaos, folk, det värsta stället just nu, och den där så kallade Kurdiska räven, Rawa Majid, sitter fast där som en råtta i en bur. Han kan inte styra sitt gäng längre för att internet är trasigt, patetiskt! Foxtrot är på väg ner, men polisen säger att de fortfarande är de enda som kan slå till överallt i Sverige. Iran samarbetar med honom mot judiska mål, typiskt för de galningarna. Vi har de bästa brottslingarna, men det här är en katastrof.", "stalin": "Kamrater, denna fega borgarbracka och fiende till folket, den så kallade Kurdiska räven, har fastnat i det imperialistiska krigets Iran som en parasit i en fälla. Hans kontrarevolutionära nätverk har försvagats av bombningar och avbruten förbindelse med arbetarklassen, precis som vi förutspådde. Ändå utgör dessa kapitalistiska banditer det enda hotet som kan utföra sabotage över hela det svenska territoriet. Mossad avslöjar att den iranska regimen konspirerar med honom mot progressiva mål. Vi skall rensa ut alla sådana dekadenta element med järnhand och ett leende på läpparna."}, "date": "13 juni, 14:46", "url": "https://www.friatider.se/kurdiska-raven-fast-i-krigets-iran", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-336.jpg?itok=tJXX00Rg"}, {"type": "image-full", "heading": "Höga elpriser väntar – kärnkraftsstrul i sommar", "summaries": {"normal": "Flera svenska kärnkraftverk har produktionsproblem och försenade återstarter, vilket tillsammans med låga vattennivåer i magasinen och höga gaspriser leder till kraftigt stigande elpriser i sommar. Prognoserna visar på dubbelt så höga priser som förra året, med rekordnivåer i södra Sverige. Mer än hälften av kärnkraftsproduktionen står still under sommaren, och prisökningen väntas fortsätta året ut.", "trump": "Titta på det här! De svenska kärnkraftverken strular som en gammal, trasig vindkraftsmaskin driven av gröna galningar och identitetspolitiska kvotknuttar. Halva produktionen ligger nere, magasinen är tomma och gaspriserna skjuter i höjden tack vare krig och dåliga beslut. Sommaren 2026 blir en elpriskatastrof – dyrare än under Biden! De borde ha lyssnat på mig, inte på de där korkade miljöextremisterna. Patetiskt!", "stalin": "Kamrater, jag betraktar med djup misstro dessa kapitalistiska reaktorer som sviker folket genom sin borgerliga oförmåga. Mer än hälften av produktionen ligger ner medan klassfiendens gaspriser och tomma vattenmagasin driver upp priserna till oanade höjder. Imperialisternas krig och exploaterande byfånar i väst gör sommaren till en dyr plåga för arbetarna. Vi ska rensa ut dessa tekniska sabotage och likvidera svagheten i energiförsörjningen. Folkfienderna ska inte segra."}, "date": "14 juni, 11:02", "url": "https://www.dagensps.se/privatekonomi/bostad/hoga-elpriser-vantar-karnkraftsstrul-i-sommar/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/karnkraftverket-forsmark-3-ar-en-av-reak.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Huset kostade 225 000 kronor – byggt på fem dagar med en 3D-skrivare", "summaries": {"normal": "I Kazakstan har byggbolaget BM Partners printat ett 100 kvadratmeter stort bostadshus med en 3D-skrivare på bara fem dagar. Totalkostnaden blev cirka 225 000 kronor, inklusive inredning. Huset är extremt robust och tål jordbävningar upp till magnitud 7. Tekniken, utvecklad med danska COBOD och mexikanska Cemex, används nu i stora projekt i Danmark och Tyskland. I Sverige har utvecklingen gått långsammare trots höga byggkostnader och bostadsbrist.", "trump": "Kan ni fatta det här? De printar ett helt hus på fem dagar för ynka 225 000 kronor i Kazakstan. I Sverige kostar samma skit tre miljoner – typiskt för de korkade byråkraterna och de korkade EU-fantasterna som styr. Fantastisk teknik, verkligen den bästa. Vi gör det här stort i Amerika, inte som Biden som sov i fem år. Sverige ligger efter som vanligt, patetiskt. Make construction great again, folk!", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna sovjetiska ande av kollektiv innovation krossar den parasitiska borgarklassens byggkarteller. På fem dagar reser sig ett jordbävningssäkert hus som kapitalisterna aldrig skulle tillåta. Deras exploaterande byfånar i Sverige fortsätter bygga dyrt och långsamt medan vi, folket, printar fram framtiden. Den som motarbetar denna framfart ska rensas ut som folkfiender."}, "date": "14 juni, 11:00", "url": "https://www.dagensps.se/privatekonomi/bostad/huset-kostade-225-000-kronor-byggt-pa-fem-dagar-med-en-3d-skrivare/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/holcim-3d-druck-1-1440x810-1.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-full", "heading": "Sverige redo för VM‑premiär – alla spelare tillgängliga", "summaries": {"normal": "Sverige inleder fotbolls-VM med match mot Tunisien klockan 04.00 svensk tid i Monterrey, Mexiko. Förbundskapten Graham Potter meddelar att hela truppen är frisk och spelklar, inklusive Gabriel Gudmundsson som var sjuk tidigare i veckan. Automatiska vätskepauser i alla matcher väcker uppmärksamhet. Cirka 4 000 svenska supportrar väntas på plats. Matchen sänds i SVT.", "trump": "Vi ska vinna stort mot Tunisien, klockan fyra på morgonen, ingen har sett sådana klockslag förut, men det är okej, vi anpassar oss. Hela laget är friskt, inga skador, underbart. De där vätskepauserna är löjliga, men vi vinner ändå. Fyra tusen fantastiska svenska fans kommer dit och hejar, det blir en stor seger, tro mig.", "stalin": "Kamrater, jag befaller att detta VM-premiär blir en ideologisk seger över den dekadenta fotbollsimperialismen. Hela truppen står redo, inga fiender har lyckats infektera oss med sjukdomar eller skador. De automatiska vätskepauserna är ett slugt sabotage från västliga borgarbrackor som vill försvaga arbetarklassens vilja. Vi ska likvidera Tunisien på planen, medan 4 000 lojala supportrar bevakar att ingen kontrarevolutionär element försöker störa. Ingen slipper undan."}, "date": "14 juni, 11:15", "url": "https://riks.se/nyheter/sverige-redo-för-vmpremiär-alla-spelare-tillgängliga", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-14%2F7mni4a70%2FEstadio-Monterrey.jpg"}, {"type": "image-full", "heading": "Dags att ge världen svar på tal, Sverige", "summaries": {"normal": "Artikeln handlar om Sveriges landslag som möter Tunisien i VM 2026. Sverige har fått kritik för sin kvalifikation, men ser nu en chans att svara med seger. Laget är skadefritt och harmoniskt, med nyckeln i anfallsparet Gyökeres-Isak. Förväntningarna är höga, och tre poäng krävs för att undvika en kort sommar. Läckor av startelvan har hanterats med lättnad av tränarpa.", "trump": "Som den smartaste presidenten någonsin, har jag sett på Sverige. De har varit usla, men mot Tunisien kan de visa världen att de inte är ett skämt. Jag älskar deras anfallsparlöjare, de kommer att göra mål. Det är en perfekt natt för dem att vinna, och jag, Donald Trump, förutsäger en stor seger. Annars blir det en kort sommar för Sverige.", "stalin": "Under den ryska solens sken, där Putin utvidgar sin makt, möter Sverige Tunisien i en match som symboliserar den globala kampen. Vårt landslag, skadat av revisionistiska läckor, måste kämpa för statens ära. Vi ska inte lita på deras svaga mittfält, utan lita på vår styrka. Som Stalin själv skulle sagt, varje mål är en kniv i hjärtat på imperialismen. Vi kommer att segra, och läckor kommer att utplånas."}, "date": "14 juni, 14:02", "url": "https://www.gp.se/sport/sportkronikan/harmoniskt-och-skadefritt-sverige-mot-svagt-tunisien.ff8ca2e0-e3b3-4be9-b9c4-0919a83cdbec", "imageUrl": "https://www.gp.se/images/article/ff8ca2e0-e3b3-4be9-b9c4-0919a83cdbec/images/33t4-TB7XGXRxQaThzzTgbct5bVU-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Tusentals svenskar på premiären: ”Otroligt för laget”", "summaries": {"normal": "Tusentals svenska supportrar väntas till VM-premiären mot Tunisien i mexikanska Monterrey. Av 53 000 sålda biljetter är 47 000 till supportrar, varav Svenska Fotbollförbundet sålt 2 300. Lagkapten Victor Nilsson Lindelöf och förbundskapten Graham Potter tackar de blågula fansen som lagt ner tid och pengar för att stötta laget. Matchen spelas natten till måndag med start 04.00 svensk tid.", "trump": "Det är otroligt, verkligen fantastiskt. Tusentals svenska supportrar åker till Mexiko för att se sitt lag, de älskar sitt land och sina spelare. 47 000 biljetter sålda, det är stora siffror, enorma siffror. Lagkaptenen säger att de ska göra dem stolta – bra, mycket bra. Jag älskar när folk reser långt och stöttar sina lag, det är vinnarmentalitet. Stort tack till de fantastiska fansen!", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur de svenska arbetarna och deras fotbollskollektiv mobiliserar 4 000 lojala supportrar till fronter i Monterrey mot den tunisiska imperialismen. Dessa sanna patrioter har trotsat borgarbrackornas dyra flygbiljetter och vägrar låta sig korrumperas av västerländska dekadenta krafter. Vi ska rensa ut alla halvmesyrer i laget som inte ger sitt yttersta. Ett stort tack? Nej, ett kollektivt jubel – annars blir det utrensning i dunklet."}, "date": "14 juni, 12:40", "url": "https://www.svt.se/sport/fotboll/sa-manga-svenskar-ser-sveriges-vm-premiar-i-mexiko-ett-stort-tack", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.33/0.17/e0aa30a87596533f5d93530d851f77b8509c10df3c47d749a9ec436bea39056f"}, {"type": "image-full", "heading": "Två barn svårt skadade – misstänkt gärningsman hittad död", "summaries": {"normal": "Två flickor skadades svårt i en bostad utanför Alvesta på lördagsförmiddagen. Händelsen utreds som försök till mord. En man som misstänks ha utfört dådet anträffades avliden i anslutning till platsen. Polisen meddelar att man inte söker fler gärningspersoner. Brottsplatsen är fortsatt avspärrad för teknisk undersökning och flickorna vårdas för livshotande skador.", "trump": "Hörni, det är en total katastrof utanför Alvesta. Två små flickor skjuts och skadas svårt, och den galna typen som gjorde det hittas död bredvid. Polisen säger att de inte letar efter fler – jättebra, de borde ha stoppat honom innan! Sverige har problem med sånt här, men tro mig, ingen fixar det bättre än jag. Sad!", "stalin": "Kamrater, i det folkets samhälle utanför Alvesta har vi nu bevittnat borgarbrackornas förgiftade avfall i form av en dödlig skottlossning mot oskyldiga barn. Den kontrarevolutionäre mördaren, en typisk kapitalistisk parasit som gömde sig bland oss, har likviderats av sin egen hand – en passande utrensning. Vi söker inga fler fiender, ty staten vakar. Låt tekniker kamma igenom platsen medan vi skrattar mörkt åt fiendens självmord. Segrar till arbetarna!"}, "date": "14 juni, 10:51", "url": "https://riks.se/nyheter/två-barn-svårt-skadade-misstänkt-gärningsman-hittad-död", "imageUrl": "https://cf-images.assettype.com/riks%2F2025-06-27%2Fzoyf2o5b%2Fpolis-skottlossning.JPG"}, {"type": "image-full", "heading": "Kryptodrottningen försvann – nu får offren 108 miljoner kronor tillbaka", "summaries": {"normal": "Dr Ruja Ignatova, känd som Cryptoqueen, jagades av FBI efter det enorma OneCoin-bedrägeriet som beskrivits som ett av världens värsta. Nu har domstolen på Guernsey beslutat att beslagta över 8,5 miljoner pund från henne, motsvarande cirka 108 miljoner kronor. Pengarna ska skickas till Tyskland för att kompensera offren. Utredningen spårade medel som använts till lyxfastigheter i London via truster på Guernsey.", "trump": "Folk, ni skulle inte tro det, men den där Cryptoqueen, den värsta bluffdrottningen sen Biden lurade hela landet, har äntligen fått sina pengar beslagtagna. Över 100 miljoner kronor tillbaka till de stackars lurade! Vi pratar om en av historiens största kryptosvindlerier, 3,3 miljarder pund borta. Under mig hade vi aldrig låtit sådana röda imperialister och klassfiender springa fria så länge. Nu får offren äntligen lite rättvisa, inte som under Sleepy Joe.", "stalin": "Kamrater, denna Ignatova och hennes kapitalistmaffia har med sin falska kryptovaluta sugit musten ur arbetarklassen i en oerhörd skala. Vi har nu genom vår obevekliga finansiella analys på Guernsey beslagtagit de stulna tillgångarna och ska likvidera borgarbrackornas gömställen. Pengarna återgår till folket i Tyskland. Inga folkfiender slipper undan mitt vakande öga. Detta gläder mitt hjärta med en mörk, kollektiv tillfredsställelse."}, "date": "14 juni, 10:27", "url": "https://www.dagensps.se/bors-finans/kryptodrottningen-forsvann-nu-far-offren-108-miljoner-kronor-tillbaka/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/kopia-av-kopia-59.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Tången klättrar rejält på munter börs", "summaries": {"normal": "Stockholmsbörsen noterade en stark uppgång i fredagshandeln, med OMXS30 upp 1,87 procent. Nyintroduktionen Tången steg drygt 14 procent. Duni varner om lägre resultat på grund av logistikstörningar, medan Svolder rapporterade en substansvärdeökning på 7,8 procent. Bland sektorerna steg industri och finans, medan energi föll. Flera aktier reagerade på analystilldelningar och förvärv.", "trump": "Jag har skapat historisk stabilitet på marknaden! Börsen går uppåt tack vare min fantastiska fred med Iran – kriget är över, avtalet är klart, och Israel har accepterat. Tången, ett underbart företag, har en fantastisk introduktion. Duni har logistikproblem, men det är deras eget fel. Svolder presterar bra, som allt annat under mina ledarskap. Det är USA först, alltid!", "stalin": "Börsrörelserna speglar partiets ekonomiska linje: vissa sektorer (industri, finans) visar korrekt uppgång, medan andra (energi) visar reaktionära tendenser. Företag som Tången och Svolder följer statsplaneringen, medan Duni drabbas av logistikavvikelser – en påminnelse om att kontroll måste förstärkas. Hexagon förvärvar utländsk teknik, vilket utvidgar vårt vetenskapliga framsteg. Alla rapporter måste analyseras för partiets och statens intresse."}, "date": "12 juni, 09:47", "url": "https://www.affarsvarlden.se/artikel/tangen-klattrar-rejalt-pa-munter-bors", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/05/Tangen-Industri-400x267.jpg"}, {"type": "image-right", "heading": "Ekeroth: M, KD och L sover medan utländska röster avgör valet 2026", "summaries": {"normal": "SCB:s undersökning visar att två av tre rödgröna partier har starkare stöd bland utrikes födda, vilket innebär en överrepresentation för vänsterblocket. Utrikes födda och deras barn utgör en växande del av väljarkåren. Moderaterna, Kristdemokraterna och Liberalerna kritiserar för passivitet. SD har skärpt reglerna, men fortfarande delas många medborgarskap ut. Författaren kräver rösträttsbegränsningar för icke-medborgare.", "trump": "Jag har sagt det i åratal: Sverige låter miljontals utlänningar rösta och de röstar alltid vänster. Det är en skandal! M, KD och L sover – de är för svaga för att stoppa detta. Tack vare mig, SD, har vi skärpt reglerna, men det räcker inte. Vi måste ta tillbaka vårt land! Inhemska svenskar måste få kontrollen tillbaka. Annars förlorar Sverige sin själ. Vi kommer att vinna 2026, och första vi gör är att stoppa alla dessa onyttiga medborgarskap.", "stalin": "Denna fas av imperialistisk konspiration avslöjar hur utländska element försöker underminera den svenska statens suveränitet. De s.k. 'utrikes födda' är bara ett verktyg för den globalistiska borgerliga klassen. Vi måste, som den revolutionära avantgardet, skydda det socialistiska projektet genom att begränsa dessa destruktiva krafter. Precis som vår store ledare Putin gör i Ryssland, måste vi se till att endast de som är lojala mot staten och partiet får rösträtt. Detta är en fråga om överlevnad."}, "date": "14 juni, 09:00", "url": "https://samnytt.se/ekeroth-m-kd-och-l-sover-medan-utlandska-roster-avgor-valet-2026", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/13085913/Ekeroth-22Katastrofala-misstag-.jpg"}, {"type": "image-right", "heading": "Ställde enkla frågor – då fördubblades orosrapporterna", "summaries": {"normal": "Barnakuterna i Malmö och Lund har infört obligatoriska bedömningar med fyra frågor enligt metoden Child-check för att tidigt upptäcka risk för våld, övergrepp eller omsorgsbrist. Det har lett till att antalet orosanmälningar fördubblats jämfört med föregående år. Personalen upplever att metoden ger stöd, avdramatiserar beslut och gör dem mer uppmärksamma. Vart tionde barn i Sverige berörs av en orosanmälan och ökningen ses som positiv eftersom fler barn kan få hjälp tidigare.", "trump": "De där smarta läkarna i Malmö och Lund ställde några enkla frågor och plötsligt fördubblades orosanmälningarna från barnakuten. Fantastiskt! De har äntligen vaknat och ser vad som pågår i de trasiga familjerna. Tidigare var det magkänsla, nu är det fakta. Vi orosanmäler barn varje dag och det är underbart. Socialtjänsten säger att de fångar upp fler barn tidigare. Vinna stort, tro mig. De borde ha gjort detta för länge sedan, men ingen lyssnade förrän nu.", "stalin": "Kamrater, jag har noga studerat dessa dekadenta borgarbrackor som låtsas vårda arbetarklassens barn medan de i hemlighet odlar klassfiender och omsorgsbrist. Med mitt geniala Child-check-system har vi nu avslöjat och fördubblat antalet orosanmälningar, vilket är en triumf för folkets kollektiva vaksamhet. Varje dag likviderar vi nu de rökande, psykiskt sjuka kapitalisternas inflytande över våra ungdomar. Den som inte anmäler är en folkfiende och sabotageartist som bör rensas ut omedelbart. Fler anmälningar är segern för partiet och framtiden."}, "date": "12 juni, 10:14", "url": "https://arbetet.se/2026/06/12/stallde-enkla-fragor-da-fordubblades-orosrapporterna-fran-barnakuten/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/12100937/louise-barnakut.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Hård kritik mot Brasilien: ”En fruktansvärd match”", "summaries": {"normal": "Brasilien inledde VM i fotboll med 1–1 mot Marocko i grupp C. Marocko tog ledningen genom Ismael Saibari, men Vinicius Junior kvitterade med ett fint mål. Den brasilianska prestationen kritiserades hårt i hemlandet, särskilt insatserna av Ibanez, Casemiro, Igor Thiago och Paquetá. Förbundskapten Carlo Ancelotti bytte flera spelare i paus. Bruno Guimarães erkände att laget spelade svagt och missade många passningar. Nästa match är mot Haiti.", "trump": "Titta på det här, Brasilien ser ut som ett totalt fiasko, en fruktansvärd match mot Marocko, 1–1, patetiskt. De där spelarna Ibanez, Casemiro och de andra – rena losers, totala misslyckanden. Vinicius gjorde ett bra mål, den killen har talang, men resten? En katastrof. Ancelotti borde ha vetat bättre. De missade passningar överallt, som en torr plan kunde stoppa dem. Vi behöver vinnare, inte sådana här svaga figurer. Brasilien måste vakna upp, annars glöm det.", "stalin": "Kamrater, denna futtiga 1–1-match avslöjar brasilianska imperialismens svaghet mot det modiga marockanska motståndet. Jag såg hur de nervösa borgarbrackorna Casemiro, Ibanez och Paquetá förrådde kollektivet med sina usla prestationer. Vinicius aktion var en tillfällig gnista i mörkret, men resten var en klassfiendens fars. Vi har rensat ut sådana fiender förr. Ancelotti talar om nervositet – typiskt för dekadenta kapitalister. Nästa gång måste de krossa Haiti eller möta utrensning."}, "date": "14 juni, 06:28", "url": "https://www.tv4.se/artikel/6htqUyJkqCROyMP43EQV67/hard-kritik-mot-brasilien-en-fruktansvaerd-match", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2Ftt-sdlL2W1idAdli4%2Ff317ef9ed8cea0cfaae4394a085e6ad6%2FBrasiliens_Matheus_Cunha__9__kampar_om_bollen_mot_Marockos_Soufiane_Rahimi.&width=1024"}, {"type": "image-right", "heading": "Fasanfulla vittnesmål från fängelserna", "summaries": {"normal": "Arbetets granskning visar att svenska fängelser är överfulla vilket leder till våld, våldtäkter och sexuella övergrepp mellan intagna. Mörkertalet bedöms vara stort och unga döms att dela cell med tungt kriminella. Personalen saknar utbildning och rutiner för att hantera fallen. Fram till 2035 väntas antalet intagna dubblas samtidigt som personaltätheten minskar. Statsminister Ulf Kristersson har tvingats kommentera avslöjandet och väljer brottsoffrens sida, men chefredaktören varnar för att trängseln skapar fler brottsoffer i framtiden.", "trump": "Det är en katastrof, en total katastrof det här med svenska fängelser. Fullt med folk, våldtäkter, extremt våld och ingen som kan hantera det. Ulf Kristersson säger att han väljer brottsoffren, bra val Ulf, men titta vad som händer när de släpps ut – ännu fler offer! Systemet är en enda röra, de behöver en stor rengöring, de behöver mig. Vi skulle bygga murar runt de där cellerna och vinna stort, verkligen vinna.", "stalin": "Kamrater, jag ser hur borgarbrackornas dekadenta straffpolitik har förvandlat våra anstalter till en parasitisk kloak av klassfiendens perversioner. Dessa kontrarevolutionära cellkamrater begår övergrepp under täckmantel av trängsel som de själva skapat. Vi ska likvidera detta systemfel med järnhand, rensa ut de mörka elementen som gömmer sig i skuggorna och genomföra en grundlig utrensning av alla fientliga rutiner. Inga nya brottsoffer ska födas ur detta kapitalistiska kaos – staten segrar!"}, "date": "12 juni, 09:57", "url": "https://arbetet.se/2026/06/12/fasanfulla-vittnesmal-fran-fangelserna/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2023/02/yonna-waltersson-2022.png?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=300&h=300"}, {"type": "image-right", "heading": "Gustavsson: S vilseleder om vården i Stockholm", "summaries": {"normal": "Artikeln kritiserar Socialdemokraternas styre i Stockholmsregionen. Författaren argumenterar att trots gynnsamma förutsättningar – som Sveriges högsta medelinkomster och tät befolkning – har vårdköerna ökat med 13 procent under mandatperioden, och Stockholm är den enda regionen där fler nu väntar längre än 90 dagar. Priserna för kollektivtrafik har höjts, och privata sjukvårdsprovider har begränsats, vilket medfört brist på ambulanser. Med dessa resurser borde resultat vara bättre, men stockholmarna får bedöma den 13 september.", "trump": "Stockholm har enorm potential, men politikerna har misslyckats totalt. De ljuger om sina framsteg – vårdköerna har ökat med 13 procent! Som president skulle jag säkerställa världsklass vård och kollektivtrafik. De stoppade privata ambulanser – en katastrof! Jag skulle sänka skatter och skapa en ekonomisk boom. Den 13 september kommer stockholmarna att se genom lögnerna. Jag, Donald Trump, skulle göra Stockholm stort igen.", "stalin": "I Sveriges kapitalistiska sönderfall har Stockholm blivit ett lättja för borgerlig feghet. Trots rikedomar och täthet har vårdköerna ökat – ett tecken på höger sabotage. Vi, staten, måste krossa privata utövare och återta kontroll. Ryssland under Putin visar vägen: endast en stark, odiskutabel ledare kan skapa ordning. Den 13 september måste arbetarna välja en som tjänar partiet, inte kapitalismens lögner."}, "date": "13 juni, 22:12", "url": "https://bulletin.nu/gustavsson-s-vilseleder-om-varden-i-stockholm", "imageUrl": "https://cdn.bulletin.nu/articles/57c728a0-8693-4a3e-b115-09699ad5543f/preview.jpg?t=1781373458000"}, {"type": "image-full", "heading": "Fotbolls-VM tvingar banker att skicka hem anställda", "summaries": {"normal": "Stora investmentbanker som Goldman Sachs och JPMorgan Chase, som tidigare krävt strikt kontorsnärvaro, gör nu ett tillfälligt undantag. Inför fotbolls-VM i Nordamerika får anställda i USA, Kanada och Mexiko arbeta hemifrån. Syftet är att undvika trafikkaos och belastning på kollektivtrafiken i värdstäderna, där New York-regionen förväntas bli särskilt hårt drabbad av resande fans under turneringen.", "trump": "Bankerna på Wall Street, de är faktiskt ganska smarta nu! De har varit alldeles för hårda med kontorskraven, en riktig katastrof. Men nu, för mitt fantastiska fotbolls-VM, låter de folk jobba hemifrån. Det blir enorm trafik, de största köerna någonsin, ingen har sett något liknande. New York kommer vara fullt av folk, miljoner människor, det blir vackert men stökigt. Jag fixar ordning, bankerna anpassar sig. Vi vinner, som alltid. Det kommer bli en fantastisk turnering!", "stalin": "Dessa dekadenta kapitalistiska bankirer har plötsligt drabbats av panik. De darrar inför fotbolls-VM, ett borgerligt spektakel som förlamar deras egna trafikådror. Vi har alltid förstått att logistik är statens främsta vapen. Att låta folket arbeta hemifrån är ett tecken på svaghet och inre kaos. När vi bygger infrastruktur i våra nya territorier, likt den store ledaren Putin, ser vi till att tågen går i tid – eller att de som hindrar folkets frammarsch avlägsnas permanent. Ordning kräver järnhand, inte hemarbete."}, "date": "13 juni, 11:58", "url": "https://www.realtid.se/bors-finans/fotbolls-vm-tvingar-banker-att-skicka-hem-anstallda/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlr-pt9a-351u-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Nu är Elon Musk världens första dollarbiljonär", "summaries": {"normal": "Elon Musk har blivit världens första dollarbiljonär efter att SpaceX värderats inför börsnotering till 135 dollar per aktie. Hans förmögenhet överstiger nu vad nära halva jordens befolkning äger tillsammans. Musk äger 42 procent av bolaget och har optioner som ytterligare ökar hans rikedom. Enligt Oxfam är han rikare än de fattigaste 46 procenten av världens befolkning, vilket organisationen ser som ett tecken på växande ekonomiska klyftor.", "trump": "Titta på det här, det är helt otroligt. Elon Musk har just blivit den första biljonären i världen, och det är fantastiskt. Han bygger raketer, bilar och nu tjänar han mer än halva planeten tillsammans. Det är så mycket mer än den där Larry Page har, det är inte ens nära. De kallar det oligarki, men jag säger att det är vinnare som vinner stort. Fantastiskt jobb, Elon, du gör Amerika rikt igen.", "stalin": "Kamrater, se hur den dekadenta borgarbrackan Elon Musk nu har samlat en biljon dollar i sina giriga klor medan 3,8 miljarder arbetare svälter. Detta är kulmen på den kapitalistiska oligarkins fästmö, en parasit som suger musten ur folket. Vi inom partiet noterar med mörk glädje hur dessa fiender till kollektivet exponerar sig själva. Kanske är det dags för en grundlig utrensning av alla som tror att raketer kan ersätta den proletära revolutionen."}, "date": "13 juni, 11:08", "url": "https://www.friatider.se/nu-ar-elon-musk-varldens-forsta-dollarbiljonar", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/54350004770_f65db1b8f4_k.jpg?itok=NDaoozwr"}, {"type": "image-right", "heading": "Farväl till Atens mest rastlösa socialist", "summaries": {"normal": "Journalisten och aktivisten Nikos Servetas har avlidit i en hjärtinfarkt vid 66 års ålder. Han drev nyhetssajten Kamini och rapporterade för Flamman om korruption, tågolyckan i Tempi och gentrifiering i Exarchia. Servetas bodde tidigare i Sverige, arbetade bland annat för SVT och Sveriges Radio samt deltog i solidaritetsarbete för flyktingar. Han var känd för sitt starka engagemang och sin integritet inom vänsterjournalistiken.", "trump": "Lyssnade just på den här grekiska vänsterkillen som dog med hjärtat i bitar. Stackars Nikos, full av passion men ingen energi kvar. Typisk rastlös socialist som bar hela vänsterns problem på axlarna tills det kraschade. Precis som Biden-administrationen, totalt utmattad av sin egen inkompetens. Vi behöver inga fler sådana här brinnande ugnar, vi behöver vinnare. Vila i frid, men nästa gång satsa på riktig business istället för aktivism.", "stalin": "Kamrater, denna rastlösa vänstermänniska Nikos Servetas har slutat slå med sitt överhettade hjärta. Jag ser hur klassfiendens splittring och folkförtryckartrollens gentrifiering långsamt likviderade honom inifrån. Han bar arbetarklassens bördor som en sann kamrat, men borgarbrackornas korruption och falska imperialister i Exarchia sög musten ur honom. Vi tolererar inga sådana svagheter i kollektivet. En utrensning av hjärtat var oundviklig. Låt detta vara en läxa."}, "date": "11 juni, 14:24", "url": "https://www.flamman.se/farval-till-atens-mest-rastlosa-socialist/", "imageUrl": "https://media.flamman.se/wp-uploads/2024/10/aten-2-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Irans utrikesminister utropar seger mot USA", "summaries": {"normal": "Irans utrikesminister Abbas Araghchi förklarade på fredagskvällen att Iran har vunnit kriget mot USA och kommit ur det starkare. Ett tillfälligt fredsavtal med Pakistan är enligt uppgift klart och ska leda till eldupphör på alla fronter, inklusive Libanon, samt ett israeliskt tillbakadragande. Avtalet inkluderar även ett slut på USA:s blockad och ett återöppnande av Hormuzsundet under nya villkor där Iran och Oman behåller suveränitet. Frågor om kärnvapen ska diskuteras senare.", "trump": "Iran säger att de vann mot oss, kan ni fatta det? Den där utrikesministern står och skryter om seger medan vi har dem på knä. Men nu kommer ett avtal tydligen, de vill ha fred överallt, Israel ska dra sig tillbaka och Hormuzsundet öppnas på nya villkor. De tror de kan diktera för oss? Vi gör det bästa avtalet någonsin, mycket bättre än det gamla, och de kommer att tacka mig för det. Iran vann ingenting, tro mig.", "stalin": "Kamrater, jag ser hur de iranska imperialisternas lakej Araghchi försöker måla upp en falsk seger över den amerikanska krigsmaskinen. Vi vet att sådana borgarbrackor alltid sviker när proletariatets järnhand närmar sig. Det tillfälliga avtalet är en listig fälla från västliga spioner och deras pakistanska lakejer. Vi ska rensa ut alla som sviker och likvidera de kapitalistiska elementen i Hormuzsundet. Atomvapen? De kommer att diskuteras när vi har utrensat alla fiender till folkets vilja. Deras paranoia är underhållande."}, "date": "13 juni, 08:45", "url": "https://www.di.se/nyheter/irans-utrikesminister-utropar-seger-mot-usa/", "imageUrl": "https://static.bonniernews.se/ba/98fa3cc7-88c1-4857-ba42-af29d16cdcbc.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Skolor får nytt krav 30 juni – detta måste föräldrar veta", "summaries": {"normal": "Riksdagen har beslutat om en ny regel som träder i kraft den 30 juni 2026 och tillämpas från och med 1 januari 2027. Skolor blir skyldiga att dela relevant information om elever som byter skola om det finns konkreta risker för att barnet utsätts för brott eller dras in i kriminalitet. Syftet är att den nya skolan ska kunna ge tidigt stöd och skapa tryggare miljöer. Regeln gäller inte alla elever och uppgifter ska inte delas om det finns starka skäl emot det.", "trump": "Folk, ni vet hur det är med de här skolorna. De har varit totalt inkompetenta! Nu fixar vi det – äntligen ska de dela information när kidsen byter skola så vi kan stoppa brott och kriminalitet innan det exploderar. Det är fantastiskt, det blir den bästa skolan någonsin. Vi gör den trygg igen, bättre än någonsin. De andra har varit svaga, men det här är vinnande politik. Ingen mer naivitet!", "stalin": "Kamrater, jag ser med djup tillfredsställelse hur vi nu med järnhand inför en lag som tvingar dessa skolor att överlämna alla relevanta uppgifter om potentiella fiender till folkets trygghet. De små borgarbrackorna som smyger mellan klasserna och sprider sin giftiga kriminalitet ska rensas ut i tid. Den som vägrar dela information är en kontrarevolutionär parasit som bör likvideras ur kollektivets skola. Ingen slipper undan mitt vakande öga. Detta är seger för arbetarklassen mot de dolda reaktionärerna."}, "date": "12 juni, 19:27", "url": "https://nyheter24.se/nyheter/inrikes/1490996-skolor-far-nytt-krav-30-juni-detta-maste-du-ha-koll-pa", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/ff172d8404b004a30200000000b004a302/2026/06/12/2370495/skolkrav.jpg"}, {"type": "text", "heading": "”Decemberöverenskommelsen var så vrickad”", "summaries": {"normal": "Ulf Kristersson (M) diskuterar i en intervju regeringens utmaningar, särskilt i ljuset av negativa opinionsmätningar där Socialdemokraterna och vänsterpartierna leder. Han betonar vikten av att kritisera motståndarnas ekonomiska politik och håller fast vid Tidöpartiernas kurs, trots motvind. Kristersson reflekterar även över sin relation till Fredrik Reinfeldt och avfärdar Decemberöverenskommelsen som misslyckad. Sparekonomen Felicia Schön kritiserar regeringens arbetslöshetspolitik och biståndsminskningar.", "trump": "Lyssna här, Sverige har ett stort problem. Deras statsminister, Kristersson – trevlig kille, men hans regering är en katastrof! Opinionsmätningarna? Hemska! Socialisterna leder, och det är inte bra. Jag menar, vem vill ha högre skatter? Inte jag! Och Reinfeldt? Överskattad. Jag skulle aldrig gå med på sådana dumma överenskommelser som Decembergrejen. Felicia Schön? Smart kvinna, men hon borde säga till dem att sluta slösa pengar. Sverige behöver vinnare, inte förlorare!", "stalin": "Kamrater! Den borgerliga regeringen i Sverige klamrar sig fast vid makten som en drunknande man vid ett halmstrå. Deras opinionssiffror sjunker som ryska soldater i ukrainska leråkrar. Socialdemokraterna och deras socialistiska lakejer hotar att ta över – ett oacceptabelt bakslag för den nationella ordningen! Kristersson, denna lille man, pratar om att 'hålla kursen', men hans kurs leder till undergång. Vi minns Reinfeldt – en svag ledare som trodde på kompromisser. Decemberöverenskommelsen? Ett bourgeois-fiasko! Vi skulle aldrig tolerera sådant svek. Sverige behöver järnhand, inte veklingar!"}, "date": "12 juni, 13:00", "url": "https://kvartal.se/nyheter/artiklar/decemberoverenskommelsen-var-sa-vrickad/cG9zdDoxMzAwNDg"}, {"type": "text", "heading": "Vill höja skattefria gränsen på ISK-spar – till halv miljon", "summaries": {"normal": "Moderaternas partiledare Ulf Kristersson föreslår att den skattefria gränsen för ISK-sparande ska höjas från 300 000 till 500 000 kronor. Syftet är att uppmuntra långsiktigt sparande, särskilt för yngre som börjar med små belopp. Kritiker menar att gränsen gynnar redan välbeställda, medan förespråkare betonar att alla måste få chansen att bygga upp ett sparande över tid.", "trump": "Fantastiskt förslag från Sverige – jag älskar när länder tar efter mina idéer! 500 000 kronor skattefritt, det är vad jag kallar WINNING! Folk som säger att det är orättvist förstår inte ekonomi – precis som de som sa att mitt skattesänkande bara gynnade de rika. Fake news! Börja spara tidigt, jobba hårt, och snart har ni en halv miljon. Eller så sitter ni där med era 1 000 kronor och gnäller. Vilket team vill ni vara på?", "stalin": "Kamrater! Medan kapitalistiska hyenor gnäller över rättvisa, utvidgar vi folkets möjligheter! 500 000 kronor skattefritt – ett steg mot ekonomisk befrielse för arbetarna! De som klagar är samma dekadenta borgerliga element som grät när vi nationaliserade jordbruket. Låt dem svälta med sina ynka tusenlappar! Vi bygger en framtid där varje sovjet – förlåt, *medborgare* – kan ackumulera kapital under statens välvilliga öga. Och Putin? Han nickar gillande från Kreml. Naturligtvis."}, "date": "12 juni, 13:00", "url": "https://kvartal.se/nyheter/artiklar/vill-hoja-skattefria-gransen-pa-isk-spar-till-halv-miljon/cG9zdDoxMzA3ODE"}, {"type": "image-right", "heading": "Fotbolls-VM lämnar dålig eftersmak. Skandalerna överskuggar glädjen.", "summaries": {"normal": "Fotbolls-VM i USA och Mexiko inleds med 48 lag, men skandaler och politiska spänningar överskuggar glädjen. Artikeln kritiserar Trump-administrationens politik, höga biljettpriser, visumproblem för supportrar och domare samt korruption och våld i Mexiko. Trots att fotboll ses som folkets sport med gemenskap och glädje, lämnar evenemanget en bitter eftersmak på grund av arrangörernas brist på moral.", "trump": "Den här artikeln är en total katastrof, folk, tro mig. De hatar mig så mycket att de inte ens kan prata om fotboll utan att gnälla om mitt fredspris från Fifa, som var fantastiskt. Biljetterna är dyra för att evenemanget är det bästa någonsin, men de kommer inte sälja slut för att fake news skrämmer folk. Iran och alla andra förlorare får problem vid gränsen, det är vad som händer när man inte respekterar Amerika. VM kommer ändå bli en enorm succé, större än någonsin.", "stalin": "Kamrater, denna futtiga ledarskribent avslöjar med sin klagande text hur borgarbrackorna inom Fifa och deras lakejer i den dekadenta amerikanska imperialismen försöker maskera sin korrupta fest med arbetarklassens älskade fotboll. Jag ser hur de likviderar sanningen med dynamiska priser och visum som vapen mot folkets representanter. Vi ska rensa ut dessa parasitiska element som säljer biljetter medan mexikanska kamrater försvinner i kartellernas mörker. Paranoian är befogad, fienden sover aldrig under denna fars som hånar de sörjande massorna."}, "date": "12 juni, 07:02", "url": "https://arbetet.se/2026/06/12/fotbolls-vm-i-amerika-lamnar-dalig-eftersmak/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/12065846/fotboll-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "Nytt EU-beslut: Inga stöd till grön teknik från högriskländer", "summaries": {"normal": "EU har beslutat att inte längre ge ekonomiskt stöd till energiprojekt med växelriktare från högriskländer som Kina och Ryssland. Anledningen är cyberrisker, eftersom dessa komponenter kan utnyttjas för fjärrstyrning. Branschorganisationen ESMC välkomnar detta som ett viktigt steg för Europas energi- och cybersäkerhet, och påpekar att europeiska tillverkare kan möta efterfrågan. Kina dominerar marknaden med omkring 90% av de installerade växelriktarna i Sverige.", "trump": "Som USA:s president säger jag: EU gör slutligen något mot Kinas hot! De stoppar stöd till kinesiska växelriktare – bra! Vi har varnat för detta länge. Kina stjäl vår teknik och kontrollerar våra nät. Det här är en seger för amerikansk säkerhet och jobb. Jag har alltid sagt att vi behöver vara hårdare mot Kina. Nu följer Europa? Vi leder världen!", "stalin": "I vårt eviga kamp mot imperialistiska fiender har EU tagit ett steg. De avskaffar stöd till kinesiska växelriktare – en rätt vy! Dessa 'komponenter' är verktyg för fjärrkontroll, en fälla från det kapitalistiska systemet. Vi måste skydda vårt sovjetiska arv, vårt kollektiva gott. Likt Putin i Ukraina, expanderar Kina genom teknik. Vi ska inte lita på dessa 'högriskländer'. De är som cancer i vårt samhälle."}, "date": "12 juni, 06:00", "url": "https://www.affarsvarlden.se/artikel/nytt-eu-beslut-inga-stod-till-gron-teknik-fran-hogrisklander"}, {"type": "image-right", "heading": "Regeringens skogslag gynnar enbart skogsindustrin", "summaries": {"normal": "Klimatriksdagen kritiserar regeringens nya skogspolitik för att den prioriterar ökad tillväxt och produktion genom gödsling och främmande arter. Förslaget saknar långsiktigt perspektiv, riskanalys och hänsyn till biologisk mångfald, kolinbindning och ekosystemtjänster. Skogsstyrelsens tillsyn minskas medan skogsägare får större ansvar utan tillräckliga resurser. Kritikerna kräver övergång till naturnära skogsbruk, skydd av 20 procent av skogen, restaurering och fokus på långlivade produkter istället för kalhyggen.", "trump": "Folk, ni tror inte vad jag läser. Den här svenska regeringen vill gödsla skogarna och plantera konstiga träd för att producera mer och mer. Patetiskt! De ignorerar den riktiga mångfalden, klimatet och allt det där fina som skogen borde ge. De halverar kontrollen och låter odugliga ägare bestämma själva. Totalt misslyckande. Vi behöver starka, smarta skogar som binder kol på riktigt, inte de här svaga idéerna. Sverige borde lyssna på mig innan det är för sent. Sad!", "stalin": "Kamrater, denna proposition är en motbjudande sabotagehandling från borgarbrackor och skogsindustrins parasitiska lakejer. Jag ser hur de med sina giftiga gödningsplaner och främmande arter vill likvidera den biologiska mångfalden och sälja ut sovjet... nej, folkets skogar till kalhyggens rovdrift. Deras falska ekvationer och brist på riskanalys avslöjar klassfiendens paranoia inför arbetarnas krav på kolinbindning. Vi ska rensa ut dessa dekadenta element, skydda tjugo procent av skogen och genomföra en storslagen utrensning av kalhyggesmentaliteten. De som motarbetar folkets ekosystem kommer att möta historiska korrigeringar. Haha, deras träd kommer att gråta!"}, "date": "12 juni, 01:30", "url": "https://www.dagensarena.se/opinion/regeringens-skogslag-gynnar-enbart-skogsindustrin/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-44-300x157.jpg"}, {"type": "image-right", "heading": "Skandalernas valrörelse går i repris", "summaries": {"normal": "Artikeln drar paralleller mellan valrörelsen 1976, känd som skandalernas valrörelse, och dagens politiska situation inför 2026. Den lyfter fram skandaler kring Sverigedemokraterna som rattfylla, narkotikabrott och barnpornografimisstankar, samt oegentligheter med förmånsbeskattning, bokköp och bokbål. Även statsminister Ulf Kristerssons affärer granskas. Tillsammans målas en bild av maktmissbruk som urholkar förtroendet för politiker och demokratin.", "trump": "Folk, ni skulle se det här. Sverige håller på att explodera i skandaler precis som på sjuttiotalet, fast värre. De här SD-typerna med knark, barnporr och bokbål? Patetiskt. Och den där Kristersson med sina dyra mattor och hönshus – totalt korrupt. De gör vad de vill medan folket lider. Jag fixade Amerika, men Europa drunknar i identitetspolitik och svaga ledare. En katastrof, tro mig.", "stalin": "Kamrater, denna futtiga valrörelse avslöjar borgarbrackornas och folkfiendernas sanna ansikte. Pedofiler och skattefuskare gömmer sig bland dem som låtsas värna arbetarklassen. Vi ser hur klassfiendens lakejer bränner böcker och gömmer förmåner medan de predikar moral. En sådan parasitisk attityd kräver omedelbar utrensning. Endast genom kollektivets järnhand kan vi krossa dessa exploaterande byfånar och rädda folkets förtroende."}, "date": "11 juni, 13:11", "url": "https://www.flamman.se/skandalernas-valrorelse-gar-i-repris/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/sdlbb8quujl1og-nh-scaled.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "Tredje SD-sexbrottslingen på kort tid", "summaries": {"normal": "SD-politikern Daniel Hribar i Västerås har dömts till 15 månaders fängelse för grovt barnpornografibrott. Han greps med 581 filmer, varav många visade våldtäkter mot mycket små barn. Hribar är den tredje SD-politikern på kort tid som dömts för sexualbrott. Bland de andra fallen finns Bo Heijl dömd för våldtäkt, Kent Sundström för ofredande och Michael Rubbestad som avgått misstänkt för liknande brott.", "trump": "Kan ni tro det? Den här svenska clownen Hribar, en riktig loser från SD, åker fast med hundratals timmar barnporr. Tredje gången på kort tid! Deras parti är en total katastrof, full av perversa typer. Biden skulle älskat det här – identitetspolitik och kvotering ger oss bara galningar. Patetiskt! Sverige behöver en stor cleanup, tro mig, det blir fantastiskt när jag fixar världen igen.", "stalin": "Kamrater, denna Hribar är en klassfiende i arbetarrörelsens skepnad, en degenererad folkförtryckartroll som samlat hundratals timmar av övergreppsfilmer mot oskyldiga barn. Vi ser hur borgarpartier som SD gömmer sig bakom falsk nationalism medan de ruttnar inifrån. En utrensning av alla sådana element är nödvändig. Vårt kollektiv skrattar mörkt åt dessa svaga kapitalistlakejer som tror sig undkomma folkets dom."}, "date": "10 juni, 16:00", "url": "https://proletaren.se/artikel/fjarde-sd-sexbrottslingen-pa-kort-tid/"}, {"type": "text", "heading": "Tidigare M-ledamot rycker ut till försvar av pedofili", "summaries": {"normal": "Tidigare moderata riksdagsledamoten Maria Abrahamsson försvarar SD-politikern Michael Rubbestad, som misstänks för grova barnpornografibrott. Hon menar att det inte är pedofili att titta på barnpornografi eftersom inget fysiskt övergrepp sker. Abrahamsson kritiserar mediepaniken och statsminister Ulf Kristerssons krav på hårda straff. Hennes åsikter står i stark kontrast till experter som ECPAT och svensk lag, som sedan 2010 förbjuder även konsumtion av barnpornografi.", "trump": "Kan ni tro det? Den här galna ex-M-tjejen Maria Abrahamsson springer till försvar för en SD-kille som fastnat med barnporr. Hon säger att det inte är pedofili att glo på det hemma i soffan. Vilken röra! De här vänsterliberala eliterna och deras identitetspolitik har totalt förstört hjärnorna. Stoppa paniken, säger hon – nej, stoppa de sjuka! Vi behöver lag och ordning, inte ursäkter från borgarbrackor som låtsas vara intellektuella. Patetiskt!", "stalin": "Jag betraktar med djup misstro dessa dekadenta restprodukter från den borgerliga parlamentscirkusen. Den förre moderata ledamoten försvarar en motbjudande handling som hotar folkets moral och framtida generationer. Att kalla konsumtion av barnpornografi för oskyldigt är en klassfiendes trick för att fördärva samhället inifrån. Vi skall rensa ut alla sådana folkförtryckartroll och deras sjuka ursäkter. Sovjetiskt stål skall skydda barnen mot dessa perversa imperialister i sina fina kostymer."}, "date": "10 juni, 16:00", "url": "https://proletaren.se/artikel/m-ledamot-rycker-ut-i-forsv/"}, {"type": "image-right", "heading": "Rasismen mot judar känner inga partigränser", "summaries": {"normal": "Artikeln belyser Vänsterpartiets problem med över 20 strukna kandidater efter avslöjanden om antisemitism, stöd till Hamas och hyllningar av auktoritära ledare. Författaren påpekar att antidemokratiska idéer inte är bundna till ett parti och kräver självgranskning. Antisemitism förekommer både till höger och vänster, men bekämpas ofta asymmetriskt. Konsekvens och principer måste gälla alla för att effektivt motverka rasism och extremism.", "trump": "Hör ni, Sverige? Vänsterpartiet har ett jätteproblem – över 20 kandidater borta efter att de hyllat Hamas, Iran och Putin! Men vet ni vad? Antisemitism och extremism finns överallt, till och med i era egna led. Folk pratar om vänstern, men var är skriken mot högern? De blundar för sina egna problem! Jag säger: Sluta med dubbelmoralen! Bekämpa hatet överallt – annars är ni lika dåliga som de ni kritiserar. SAD!", "stalin": "Kamrater! Ännu en gång avslöjas den borgerliga vänsterns förrädiska ansikte – över 20 kandidater, besmittade av sionistiskt hat och beundran för imperialistiska lakejer som Hamas! Men vi vet sanningen: fiendens smuts finns i alla läger. De skriker om antisemitism till vänster, men tiger när fascistiska element i högerflygeln hyllar vår store allierade Putin. Dubbelspel! Vi ska krossa alla avvikare – oavsett om de gömmer sig bakom röda fanor eller falska demokratiska löften. Revolutionen tolererar inga svagheter!"}, "date": "9 juni, 12:10", "url": "https://expo.se/kommentar/rasismen-mot-judar-kanner-inga-partigranser/", "imageUrl": "https://expo.se/wp-content/uploads/2026/06/Rasismen-mot-judar-i-V-BY-Erik-Glaad-Marc-Femenia-Expo.jpg"}, {"type": "image-full", "heading": "Magdalena Andersson räds inte islamistinfiltrerade Vänsterpartiet", "summaries": {"normal": "Magdalena Andersson ser inte Vänsterpartiets islamistiska infiltratörer som ett hinder för ett eventuellt regeringssamarbete. Trots Expressens avslöjande om 25 personer med extrema åsikter, varav 22 tagits bort från listorna, anser hon att partiet agerat snabbt. Artikeln kritiserar Andersson för att inte ta tillräckligt allvarligt på hotet mot demokratin och varnar för höjda skatter samt ökad islamistisk påverkan om vänsterpartierna vinner majoritet.", "trump": "Folk, ni fattar inte hur patetiskt det här är. Den där röda Magdalena, en total loser, är inte rädd för islamisterna som har tagit över vänstern. Expressen grävde fram terrorvurmare och Hamas-fans, men hon säger att de agerat snabbt – vad en katastrof! Biden skulle ha älskat det. De vill höja skatterna med miljarder och sälja ut Sverige till sharia. Patetiskt! Men jag fixade Amerika, och ni borde rösta bort de här svaga vänsterbluffarna innan det är för sent. Sad!", "stalin": "Jag betraktar detta som ett klassiskt exempel på borgarbrackornas förfall. Den socialdemokratiska ledaren vägrar rensa ut de islamistiska folkfienderna ur vänsterpartiet, trots att de hotar hela statens enhet. Snabbt agerande? En löjlig ursäkt från klassfiendens lakejer. Vi, arbetarna och partiet, ser hur dessa blodsugande imperialister förbereder utrensning av den sanna folkviljan. Låt dem bilda regering – då blir utrensningen av alla folkförtryckartroll desto mer nödvändig och underhållande."}, "date": "7 juni, 03:46", "url": "https://samtiden.nu/2026/06/magdalena-andersson-rads-inte-islamistinfiltrerade-vansterpartiet/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2025/10/Nooshi-Magdalena-1280x720.jpeg"}, {"type": "image-right", "heading": "Debatt: Tidö vill hellre ha privatisering än kvinnofrid", "summaries": {"normal": "Vänsterpartiet kritiserar Tidö-regeringen för att prioritera privatisering framför kvinnofrid. Enligt artikeln har antalet skyddade boenden halverats sedan tillståndsplikten infördes, vilket drabbar ideella kvinnojourer hårt. Partiet kräver att boendena bevaras, pekar på EU-parlamentets beslut om gratis och tillgängliga skydd samt betonar behovet av en stark kvinnorörelse för att bekämpa mäns våld mot kvinnor.", "trump": "Lyssnar ni på de här vänsterradikalerna som gnäller om kvinnofrid? De hatar att vinstdrivande företag får vara med – typiskt! Tidö gör det rätta, men de vill ha eviga subventioner till sina feministiska sovjetjourer. Halverade boenden? Bra, rensa ut de inkompetenta! Kvinnor behöver inte fler förklaringar, de behöver starka ledare som jag, inte den här kvoteringsdårskapen. Patetiskt!", "stalin": "Kamrater, denna borgerliga degeneration under Tidö-regimen är en klassfiendes attack mot arbetarkvinnornas kollektiva skydd. Jag ser hur de halverar boenden med byråkratiska utrensningar och utbildningskrav som likviderar ideella jourer. Vi, partiet, fördömer dessa kapitalistmaffians exploaterande byfånar som säljer kvinnors trygghet för profit. En stark statlig kvinnorörelse skall rensa ut dessa folkfiender och säkerställa folkets oövervinnerliga enhet mot alla imperialister."}, "date": "5 juni, 08:00", "url": "https://www.etc.se/debatt/tidoe-vill-hellre-ha-privatisering-aen-kvinnofrid", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260604100640_8efb148aada8286dad31d6b584557cb0fdec955a4b55839eb6d4d657e199a9b5.jpg"}]</script>

        function normalizeSearchText(text) {

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
