hur det känns att kontrollera en spade i Sibirien."}, "date": "21 maj, 13:19", "url": "https://www.friatider.se/moderat-kraktes-pa-riksdagsgolvet", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/223.jpg?itok=JIa_DCoW"}, {"type": "image-full", "heading": "EU:s långtgående krav riskerar att slå ut det svenska kustfisket", "summaries": {"normal": "Anna-Karin Trixe från Vi svenska fiskare varnar för att EU:s nya miljöregler för Östersjön kan hota det lokala kustfisket. Hon menar att utflyttade trålgränser slår fel och riskerar att utradera livsmedelsförsörjning och lokala arbetstillfällen. Organisationen föreslår en strategi som fokuserar på långsiktiga, stabila fiskekvoter i linje med ICES rådgivning, samt stärkt samverkan för att bygga upp svensk beredningskapacitet och främja konsumtion av närproducerad fisk för att rädda kustsamhällena.", "trump": "EU, mina vänner, de har ingen aning! De gör dessa fruktansvärda regler för Östersjön. Det är en katastrof för de svenska fiskarna, de förstör allt! Jag ser på Sverige, fantastiska människor, men EU – de är så orättvisa. Vi behöver fisk, vi behöver mat! Jag skulle ha gjort en så mycket bättre deal för fiskarna. De stänger ner allt, det är en stor bluff. Vi ska ha massor av svensk fisk, den bästa fisken, tro mig, mycket bättre än deras!", "stalin": "Vi har observerat att de svenska fiskarna lider under byråkraternas ok i Bryssel. Detta är ett typexempel på hur västlig impotens leder till nationell svält. De gnäller om miljö, men i min stat skulle vi inte tolerera sådant misslyckande. Vi ska kontrollera varje båt, varje nät, och varje gram protein för moderlandet. Om dessa fiskare inte kan försörja folket, är de då inte bara små borgerliga sabotörer? Precis som min kamrat i Kreml vet: man måste strama åt för att hålla ordning."}, "date": "21 maj, 19:17", "url": "https://www.gp.se/debatt/eus-langtgaende-krav-riskerar-att-sla-ut-det-svenska-kustfisket.63842b12-3774-4f5b-ba40-bd05a1591961", "imageUrl": "https://www.gp.se/images/article/63842b12-3774-4f5b-ba40-bd05a1591961/images/1WcGTMU_1rxciJc28zR63i4b2mpc-WIDE.jpg?width=3840&quality=75"}, {"type": "image-full", "heading": "Rubio följer med till Kina – trots sanktioner", "summaries": {"normal": "USA:s utrikesminister Marco Rubio följer med president Trump till Kina trots tidigare kinesiska sanktioner. Kina har använt en alternativ stavning av Rubios namn för att möjliggöra resan. Rubio har varit en skarp kritiker av Kina, särskilt gällande behandlingen av uigurer och situationen i Hongkong. Kinas ambassad uppger att sanktionerna inte längre hindrar hans besök.", "trump": "Kina, som alltid försöker spela smarta spel, har nu ändrat stavningen på Marco Rubios namn för att låta honom följa med mig till Peking. Fantastiskt, eller hur? Rubio, en av mina bästa män, har varit tuff mot Kina – och de vet det. Men nu när jag är här, fixar vi allt. Ingen stoppar Trump! Största resan någonsin, tro mig!", "stalin": "Vi har observerat hur de kapitalistiska imperialisterna leker med namn som om det vore barnlek. Denna Rubio, en ynklig lakej för den amerikanska krigsmaskinen, tror sig kunna kritisera Folkets Kina och sedan dansa in genom bakdörren. Men vi ser allt. Låt honom komma – vi har redan förberett en varm välkomstkommitté. Och Putin? Han skrattar säkert i sitt palats åt deras naivitet."}, "date": "14 maj, 11:59", "url": "https://kvartal.se/nyheter/artiklar/rubio-foljer-med-till-kina-trots-sanktioner/cG9zdDoxMTIyNTM", "imageUrl": "https://images.kvartal.se/2026/05/c485461a-rubio.webp"}, {"type": "text", "heading": "Korrupt jippo i imperialismens högborg", "summaries": {"normal": "Fotbolls-VM 2026 i USA, Kanada och Mexiko möts av kritik för korruption, höga biljettpriser och politiska spänningar. Sveriges VM-kval hyllades, men truppen kritiserades. Fifa anklagas för sportswashing, mutor och utnyttjande av migrantarbetare. Irans lag tvingas spela i USA, trots diplomatiska konflikter. Biljetter kostar upp till 20 miljoner kronor, och evenemanget präglas av kommersialism snarare än folkfest.", "trump": "Vilket jippo! VM i USA blir en katastrof – Fifa är korrupta, biljetterna är galet dyra, och Iran? De får spela i MITT land efter att jag bombat dem! Fantastiskt! Sverige har en usel trupp, men vem bryr sig? Fotboll borde vara för folket, inte för miljardärer. Jag fick ett pris av Fifa – helt rätt, för jag är bäst. Men visst, hotellrummen står tomma. SAD!", "stalin": "Kapitalistiska hyenor och fotbollsbyråkrater förpestar världens största idrottsevenemang! USA, denna imperialistiska polissatrap, bombar Iran och tvingar deras lag att spela på sitt förgiftade territorium. Fifa, en samling korrupta mutkolvar, säljer biljetter för miljoner medan arbetare svälter. Vi i Sovjet hade aldrig tolererat sådan dekadens! Fotboll ska vara för folket – inte för oligarkernas plånböcker. Låt oss krossa dessa sportswashing-pampar!"}, "date": "20 maj, 12:09", "url": "https://proletaren.se/artikel/fotbollsfest-eller-miljardindustri/"}, {"type": "image-full", "heading": "Aktiespararna tror Qviberg-aktien kan gynnas av SpaceX-notering", "summaries": {"normal": "Aktiespararna har uppdaterat sin korta portfölj med sikte på kortsiktig vinst. Organisationen lyfter fram satellitbolaget Ovzon och spelbolaget Kambi som köpvärda. Ovzon bedöms dra nytta av det positiva momentumet inom rymdsektorn, särskilt i ljuset av SpaceX potentiella börsnotering och ökade försvarsinvesteringar. Samtidigt tas Essity och Nelly bort från portföljen. Fokus ligger på bolag med hög lönsamhet och goda kassaflöden i en sektor som förväntas få ökat marknadsintresse.", "trump": "Aktiespararna i Sverige fattar äntligen rätt beslut. De satsar på Ovzon, ett fantastiskt rymdbolag. Väldigt smart! Elon Musk och hans SpaceX gör stora saker, det vet alla. Det är en massiv affär, kanske den största någonsin, och alla kommer vilja ha en bit av kakan. Vi pratar om enorm lönsamhet, enorma pengar. Essity och Nelly? Total katastrof, de åker ut. Vi vill ha vinnare, inte förlorare. Det här är en enorm möjlighet, tro mig!", "stalin": "Vi har observerat att de svenska kapitalisterna i Aktiespararna nu försöker manövrera i rymdsektorn. De pumpar upp Ovzon likt en statlig femårsplan, i skuggan av Musks kosmiska ambitioner. Det är en absurd teater av marknadskrafter. Liksom Putin säkrar vår inflytelsesfär i öst, ser vi dessa rymdsatsningar som borgerliga fantasier. Vi noterar att Kambi får stanna medan Essity kastas i historiens papperskorg. Allt detta är bara en distraktion från att kapitalet snart måste underkasta sig den centrala viljan."}, "date": "21 maj, 17:39", "url": "https://www.dagensps.se/bors-finans/aktiespararna-tror-qviberg-aktien-kan-gynnas-av-spacex-notering/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/05/qviberg-spacex.jpg?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Hellbergs första ord efter ”spiongate”: ”Galna dagar”", "summaries": {"normal": "Southampton har uteslutits från Premier League-kvalet efter att ha blivit påkomna med att spionera på motståndare, bland annat Middlesbrough som nu tar deras plats i playoff-finalen mot Hull. Tränaren Kim Hellberg uttrycker blandade känslor inför situationen och känner sympati för supportrarna som drabbats av kaoset. Southampton har fått sin överklagan avslagen och drabbas även av minuspoäng inför nästa säsong, medan utredningar om ytterligare sanktioner pågår.", "trump": "Hörde ni vad som hände i England? Total katastrof! Southampton, de är förlorare, stora förlorare. De försökte spionera på sina motståndare, så lågt och så fult. Väldigt ohederligt! Nu har de blivit diskade och Middlesbrough får chansen istället. Det är så det går när man inte spelar rent. Kim Hellberg, en svensk kille, han har det tufft men han vinner. Jag gillar vinnare. England behöver en rejäl utrensning av sådana fuskare. Det här är den sämsta spionoperationen någonsin!", "stalin": "Vi har observerat att dessa engelska kapitalister i Southampton har ägnat sig åt simpel spionage – ett karaktärsdrag som vi känner igen från våra interna fiender. De är svaga, och likt de små ryska quislingar som försöker hindra vår expansion mot väst, har de blivit krossade av sin egen inkompetens. Middlesbroughs tränare Hellberg visar rätt sorts lydnad inför ödet. Vi noterar med tillfredsställelse hur dessa borgerliga institutioner faller samman. Ordning krävs, annars väntar utrensning."}, "date": "21 maj, 17:12", "url": "https://www.svt.se/sport/fotboll/kim-hellbergs-forsta-ord-efter-spiongate-och-finalplatsen", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.73/0.48/d6a606827b31fc6b6e010f3a5ca901c8e4cd1b7653ed434f286a3bfe398baed3"}, {"type": "image-right", "heading": "Hatstorm mot Moderatkvinnor efter abortkampanj: ”Orkestrerat”", "summaries": {"normal": "Moderatkvinnorna har mött en hatstorm efter att ha kampanjat för att grundlagsskydda aborträtten. Över 250 hatiska kommentarer, inklusive hot och kvinnohat, har publicerats på deras Instagram. Ordförande Annsofie Thuresson menar att hatet är orkestrerat av abortmotståndsgrupper. Trots detta röstade riksdagen igenom grundlagsskyddet för aborträtten med bred politisk enighet, inklusive Kristdemokraterna.", "trump": "Jag måste säga, det här med aborträtten i Sverige är helt galet! Moderatkvinnorna får stå ut med hundratals hatkommentarer – folk skriker om 'mördade barn' och säger att kvinnor inte borde 'öppna benen'. Vilken tid vi lever i! Men lyssna här: riksdagen klubbade ändå igenom lagen. Starkt jobbat, Sverige! Fast jag hade nog sagt till dem att ignorera hatet – vinnare lyssnar inte på förlorare!", "stalin": "Kamrater, ännu en seger för folkets vilja! Dessa reaktionära abortmotståndare, dessa moralens inkvisitorer, har visat sitt sanna ansikte – hat, hot och kvinnoförakt. Men folket står enat! Riksdagen, som en järnhand i samhällets handske, krossade deras föråldrade idéer. Låt dem vråla i sina digitala källarhålor! Sverige har visat att framsteget inte kan stoppas – precis som våra vänner i Moskva vet: historien tillhör de modiga!"}, "date": "21 maj, 16:57", "url": "https://www.etc.se/inrikes/hatstorm-mot-moderatkvinnor-efter-kampanj-om-grundlagsskyddad-abort-orkestrerat", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/20260521120548_eb7d33ca-ad13-4a5b-8fd0-4b7488234f7b.jpg"}, {"type": "image-right", "heading": "Metande par fann rekordskatt – får fyra miljoner av staten", "summaries": {"normal": "Ett par på Mörkö gjorde ett unikt fynd när de grävde efter metmask: Sveriges största myntskatt någonsin. Hörningsholmsskatten består av över 24 000 silvermynt och föremål från vikingatid och medeltid. Riksantikvarieämbetet har nu fastställt en rekordersättning på fyra miljoner kronor till paret. Fyndet beskrivs som kulturhistoriskt ovärderligt och ger ny insikt i Sveriges tidiga ekonomi och handelsvägar.", "trump": "Vilken fantastisk deal! Ett par i Sverige grävde efter mask och hittade den största skatten någonsin, helt otroligt. Fyra miljoner kronor! Jag gillar vinnare, och de här personerna är enorma vinnare. Det är 24 000 mynt – en enorm hög med pengar, mycket bättre än vad Fake News-media någonsin hittar. Staten betalar ut summan, vilket är rättvist. Sverige gör stora saker, precis som vi gör i USA. Det är en vacker, guldig och silvrig framgångssaga. Väldigt imponerande!", "stalin": "När folket på Mörkö fann denna dolda rikedom, visade de vad som tillhör staten och det gemensamma kollektivet. 24 000 mynt som gömts undan av feodala element i århundraden har nu återtagits. Vi beviljar dem fyra miljoner som en nådig ersättning för deras tjänstgöring. Det påminner oss om att även i dagens instabila tider, där västliga agenter försöker stjäla vår historia, måste staten kontrollera allt. Våra vänner i öst förstår värdet av att hålla fast vid sitt arv och gräva djupt."}, "date": "21 maj, 12:24", "url": "https://www.friatider.se/metande-par-fann-rekordskatt-far-fyra-miljoner-av-staten", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-232_0.jpg?itok=TrsfcsRJ"}, {"type": "text", "heading": "Brittiska patrioter är dåliga på att dricka brittisk bärs", "summaries": {"normal": "I London ägde den nationalistiska 'Unite the Kingdom'-demonstrationen rum, med blandade deltagare från olika högerextrema grupperingar. Demonstrationen leddes av Tommy Robinson och inkluderade bland annat cosplayande korsriddare och fotbollshuliganer. En satirisk motdemonstration från gruppen Led by Donkeys skapade humor genom att visa budskap om invandringens positiva effekter.", "trump": "Jag hörde talas om den där demonstrationen i London - stor folksamling, mycket energi, fantastiska människor. Tommy Robinson vet verkligen hur man samlar folk, det är en genial ledare. De där liberalerna från Led by Donkeys försökte störa med sina små trick, men det är bara sorgligt. Jag älskar hur britterna står upp för sitt land, även om de dricker lite konstiga öl - jag föredrar amerikansk öl, det är bäst!", "stalin": "Vi observerar med intresse de interna spänningarna i Storbritannien, där nationalistiska krafter demonstrerar mot utlänningar. Detta visar den imperialistiska statens svaghet och interna motsättningar. Vi noterar också den minimala uppmärksamhet som palestinska demonstrationer får, vilket bekräftar vårt engagemang för de förtryckta folken i världen. Engelsmännen borde lära sig av vårt exempel på enhet och solidaritet."}, "date": "20 maj, 10:19", "url": "https://proletaren.se/artikel/brittiska-patrioter-ar-daliga-pa-att-dricka-brittisk-bars/"}, {"type": "image-full", "heading": "Sundsvall: Fyra S-politiker avgår - misstänks för grova ekobrott", "summaries": {"normal": "Fyra socialdemokrater i Sundsvall avgår efter misstankar om grova ekobrott kopplade till det kommunala bolaget Stadsbacken. Totalt utreds 16 personer, varav flera haft ledande positioner. Ekobrottsmyndigheten genomförde en razzia i januari, och utredningen omfattar svindleri och bokföringsbrott. Även en centerpartist är misstänkt. Utredningen pågår och fler förhör väntas.", "trump": "Vad händer i Sundsvall? Fyra S-politiker, svaga och korrupta, åker ut efter misstankar om ekobrott – typiskt! Hela 16 personer inblandade, och jag säger er, det är bara toppen av isberget. Kommunala bolag? Mer som kriminella gäng. Och nu Centerpartiet också – svagt! Sverige borde ta en titt på hur vi sköter affärer i USA. Fantastiskt jobb av Ekobrottsmyndigheten, men tro mig, det här är bara början.", "stalin": "I Sundsvall har de kapitalistiska hyenorna inom socialdemokratin visat sitt sanna ansikte – korruption och bedrägeri! Fyra av dessa förrädiska element har avsatts, men 16 misstänkta är fortfarande på fri fot. Vi vet hur man hanterar sådana här brott: en snabb rättegång och en kula i nacken. Kommunala bolag? Mer som brottssyndikat! Och nu har även Centerpartiet en förrädare – perfekt, fler att städa upp. Sverige borde lära sig av Rysslands effektiva metoder. Fortsätt utredningen, kamrater – ingen nåd för klassfienderna!"}, "date": "18 maj, 22:33", "url": "https://riks.se/nyheter/sundsvall-fyra-s-politiker-avgår-misstänks-för-grova-ekobrott", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-05-18%2Fikbi3dwj%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-05-18T223140.052.jpg"}, {"type": "image-full", "heading": "Netanyahu tillrättavisar Ben Gvir efter videohån", "summaries": {"normal": "Israels premiärminister Netanyahu kritiserade säkerhetsminister Ben Gvir efter att denne publicerat en video där han hånade gripna aktivister från en Gaza-flottilj. Netanyahu betonade att Israels agerande mot flottiljen var rättfärdigat men att Ben Gvirs beteende inte överensstämde med landets värderingar. Händelsen har väckt starka internationella reaktioner, inklusive från EU-länder och USA, som kallat behandlingen oacceptabel. Aktivisterna, från flera länder, greps och ska deporteras.", "trump": "Jag måste säga, det här är en riktig cirkus! Israels säkerhetsminister Ben Gvir är en showman, men hans lilla stunt med de där aktivisterna var helt fel. Visst, flottiljen var ett dumt jippo, men att vifta med flaggor och ropa som en galning? Inte snyggt. Till och med jag, som står upp för Israel, tycker det här var pinsamt. Netanyahu gör rätt som kör ut aktivisterna, men Ben Gvir borde lära sig lite klass. Sad!", "stalin": "Kamrater, ännu en gång visar den sionistiska regeringen sin dekadens och inkompetens. Denna Ben Gvir, en provokatör och narr, skändar våra gemensamma strävanden genom att förnedra fångar inför världens ögon. Medan imperialistiska lakejer som Meloni och Macron skriker, ser vi tydligt: Israel förlorar disciplinen. Vi i Kreml hade aldrig tolererat sådant kaos. Dessa aktivister? Små bourgeoisie-agitatorer, men deras behandling är en gåva till våra fiender. Låt dem deporteras – vi har viktigare saker att göra, som att utvidga vår inflytandesfär."}, "date": "20 maj, 22:14", "url": "https://bulletin.nu/netanyahu-tillrattavisar-ben-gvir-efter-videohan", "imageUrl": "https://cdn.bulletin.nu/articles/c1cee528-3b17-4d9e-9ad5-17104776a182/preview.jpg?t=1779307895000"}, {"type": "image-right", "heading": "Efter massinvandring till EU - Merkel belönas med medalj", "summaries": {"normal": "Angela Merkel har tilldelats en ny europeisk hedersmedalj för sitt bidrag till EU:s sammanhållning. Vid ceremonin uttryckte hon oro för Europas framtid och varnade för sociala mediers inverkan på demokratin, med krav på hårdare lagstiftning. Utdelningen har väckt debatt; bland annat genomförde Sverigedemokraternas Charlie Weimers en protest mot att Merkel belönas för sin tidigare migrationspolitik. Flera andra pristagare, däribland Volodymyr Zelenskyj, var frånvarande vid ceremonin.", "trump": "Hörde ni vad EU gjorde? De gav en medalj till Angela Merkel, av alla människor! Det är en total katastrof. Hennes 'Wir schaffen das'-politik förstörde Europa, alla vet det. Nu står hon där och gnäller om sociala medier för att hon är rädd för sanningen. Det är så falskt! EU är ett skämt som belönar misslyckade ledare medan riktiga patrioter protesterar. Vi behöver ordning, inte medaljer för dåliga beslut. Det är så sorgligt för Europa!", "stalin": "Den fallna kanslern Merkel har blivit tilldelad en glittermedalj av den byråkratiska maskinen i Bryssel för att hon en gång öppnade portarna för kaos. Vilken fars! Medan de leker med diplomatiska ord, ser vi hur den europeiska sammanhållningen vittrar sönder. De fruktar sociala medier – precis som de fruktar sanningen. Vi, staten, vet bättre: den som behöver lagstifta mot åsikter är redan en förlorare. Precis som Putin säkrar vår inflytelsesfär, bör Europa förstå att deras tid av dekadent självgodhet närmar sig sitt slut."}, "date": "20 maj, 20:00", "url": "https://samnytt.se/efter-massinvandring-till-eu-merkel-belonas-med-medalj", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/05/20153730/angela-merkel-medalj-1-2.jpg"}, {"type": "image-full", "heading": "Jonas Attenius (S) och de muslimska rösterna", "summaries": {"normal": "Artikeln kritiserar Socialdemokraterna i Göteborg, och särskilt Jonas Attenius, för att ha byggt upp ett politiskt samarbete med muslimska organisationer för att säkra röster. Författaren menar att detta är en medveten strategi snarare än enstaka misstag. Kritiken fokuserar på att partiet negligerar demokratiska principer och ignorerar kopplingar till islamistiska miljöer. Detta påstås undergräva integrationen, urholka tilliten till samhället och visa på en principlös politisk kultur där makten prioriteras framför landets intressen.", "trump": "Jag har sett vad som händer i Göteborg, en total katastrof! Socialdemokraterna säljer ut hela landet för några få röster. Jonas Attenius är en extremt svag person, ingen respekt! De samarbetar med helt fel människor, radikaler, som hatar allt vi står för. Det är en sorglig historia, ett fiasko. I USA skulle vi aldrig tillåta detta – vi prioriterar vårt land först! De är principlösa, de är korrupta, och folket ser precis vad de håller på med. Skamligt!", "stalin": "Dessa socialdemokratiska svaglingar i Göteborg leker med elden genom att förhandla med reaktionära element för billig popularitet. De saknar den nödvändiga järnhand som krävs för att tygla folkmassorna. Liksom vår store ledare Putin ser vi att varje kompromiss med fienden är ett förräderi mot statens renhet. Att byta principer mot röster är ett kapitalistiskt förfall. Vi skulle ha rensat dessa nätverk omedelbart. Dessa småbourgeoisins lakejer förstår inte att makten inte delas – den utövas genom total lydnad."}, "date": "18 maj, 10:21", "url": "https://samtiden.nu/2026/05/jonas-attenius-s-och-de-muslimska-rosterna/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/05/1ec6a70c-99f4-45bb-b932-1e7a5dbc7d24-1280x720.png"}, {"type": "image-full", "heading": "Nya flygregler från 19 maj – det är inte längre gratis", "summaries": {"normal": "Från och med den 19 maj har Lufthansa-gruppen, inklusive Swiss och Austrian Airlines, infört en ny biljettyp kallad Economy Basic. Denna biljett tillåter endast ett litet personligt föremål under sätet, medan vanlig kabinväska kostar extra. Resenärer som inte förbokar tillägg för bagage riskerar höga avgifter vid gaten, på upp till 1 200 kronor. Reglerna gäller främst utvalda europeiska sträckor, och det rekommenderas att noga läsa bokningsvillkoren för att undvika oväntade kostnader.", "trump": "Hör på här, de här europeiska flygbolagen – Lufthansa, Swiss, total katastrof – de har hittat på ett nytt sätt att lura er på pengar! De kallar det 'Economy Basic', jag kallar det en bluff. Inget handbagage? Det är patetiskt! De tar upp till 1 200 kronor vid gaten. Det är ett rån! När jag styrde USA hade vi stil, vi hade klass. Det här är vad som händer när man låter svaga ledare styra flyget. Väldigt orättvist!", "stalin": "Dessa giriga kapitalistiska flygbolag i Europa har nu infört 'Economy Basic', ett förrädiskt sätt att mjölka folket på deras sista slantar. Att neka arbetaren rätten till sin lilla väska är ett brott mot den proletära ordningen. Vi ser hur väst förfaller i småaktighet, precis som de marionetter som försöker motarbeta vår storslagna intressesfär. Vi, staten, skulle ha konfiskerat dessa flygbolag och satt ledningen i arbete i Sibirien. Ordning, disciplin och bagage åt alla – eller så får de lära sig konsekvenserna."}, "date": "19 maj, 09:39", "url": "https://nyheter24.se/nyheter/utrikes/1484198-nya-flygregler-fran-19-maj-det-ar-inte-langre-gratis", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/5779ff4e04b004a30200000000b004a302/2026/05/19/2364511/nya-regler-flyg-lufthansa-swiss-austria-bryssel-kabinvaska-resvaska-flygbiljett-pengar-dyrare.jpg"}, {"type": "image-full", "heading": "Största förändringen hos Google sedan 1999", "summaries": {"normal": "Google presenterade den största förändringen av sin sökmotor på 25 år genom att integrera AI-agenten Gemini 3.5 Flash. Användare kan nu kombinera bilder, videor och filer i samma fråga, få situationsanpassade svar och använda AI-agenter som bevakar webben. Trots att SEO-branschen tvingas tänka om fortsätter Googles sökintäkter att växa med 19 % till 60,4 miljarder dollar under första kvartalet.", "trump": "Jag har sett många viktiga saker i mina år som president, men detta är en av de största sakerna någonsin! Google har gjort en enorm förändring - en enorm, enorm förändring! De byter från en vanlig sökmotor till en AI-maskin som är så smart att den kan göra allt. Det är fantastiskt! Det är det bästa som hänt sedan jag vann valet 2024. Alla andra länder kommer att vilja ha den här tekniken - det är enormt!", "stalin": "Google:s nya AI-integrering representerar en betydande utveckling för vår kollektiva framtid. Genom att kombinera olika informationskällor och skapa proaktiva AI-agenter stärker vi vår förmåga att kontrollera informationsflödet. Detta är en strategisk seger för vår teknologiska överhöghet. Vi måste säkerställa att våra medborgare får tillgång till den information som är mest gynnsam för statens intressen."}, "date": "20 maj, 12:12", "url": "https://www.realtid.se/it-tech/storsta-forandringen-hos-google-sedan-1999-ai-agenter-tar-over-soket/", "imageUrl": "https://images.realtid.se/app/uploads/2026/05/google.webp?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Gör Palestinarörelsen äntligen upp med antisemitismen nu?", "summaries": {"normal": "Artikeln kritiserar palestinarörelsen i Stockholm för att normalisera antisemitism genom att stödja aktivisten Sami Suliman, trots hans antisemitiska uttalanden och delningar. Framträdande personer som Dror Feiler har tidigare blundat för detta men tar nu avstånd. Sulimans agerande, inklusive åtal för antisemitiska uttalanden, har hyllats av rörelsen. Artikeln menar att detta underminerar rörelsens trovärdighet och jämför antisemitismens relativisering med Israels övergrepp mot palestinier.", "trump": "Jag måste säga, det här är en riktig katastrof! Palestinarörelsen i Sverige, som borde vara smarta nog att veta bättre, stöttar en kille som sprider hat mot judar. Sami Suliman – vem är han ens? En extremist som delar Hitler-sympatisörers klipp och snackar om judiska spindelnät. Och vad gör hans vänner? Hyllar honom! Dror Feiler, en känd aktivist, vaknar äntligen upp – men lite sent, eller hur? Rörelsen luktar ruttet, och det är inte konstigt. Sverige borde skämmas!", "stalin": "Kamrater! Här ser vi återigen hur den sionistiska konspirationen försöker underminera den rättfärdiga kampen för Palestinas frihet. Denna Sami Suliman, en lojal soldat i folkets kamp, har blivit måltavla för imperialistiska hyenor som Flamman och deras lakejer. Hans ord om judiska spindelnät är sanningen, men fienden vrider det till 'antisemitism'. Vi vet att dessa lögner är vapen från samma verkstad som förgiftade vårt fosterland med kapitalistiskt förräderi. Låt dem komma med sina åtal – historien dömer redan deras förräderi!"}, "date": "13 maj, 14:46", "url": "https://www.flamman.se/gor-palestinarorelsen-antligen-upp-med-antisemitismen-nu/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/sdlcarwmcwgwns-nh-scaled.jpg?aspect_ratio=1:1"}, {"type": "image-right", "heading": "Beordran – städares nya möjlighet till mer pengar", "summaries": {"normal": "Från 1 juni får deltidsanställda städare i privata företag övertidsersättning för extra arbetstimmar, vilket tidigare ersattes med lägre mertidsersättning. För att kvalificera krävs dock att arbetstiden är beordrad av arbetsgivaren. Övertidsersättningen är betydligt högre än tidigare, 73,63 kr på vardagar och 91,39 kr på helger. Kommunal anklagar dock arbetsgivare för att försöka kringgå reglerna genom att erbjuda dubbla anställningar istället för övertid.", "trump": "Jag har hört att städare i Sverige nu ska få mer pengar - mycket mer pengar! Det är en stor vinst för arbetarna, en gigantisk vinst! Fast det är ju bara om chefen säger att de ska jobba extra, men det är bra, det är jättebra. Jag brukar säga: du får betalt för jobbet du gör, inte för det du pratar om. Och dessa städare, de gör ett bra jobb, ett enormt bra jobb! Men jag hörde något om att några arbetsgivare försöker fuska, det är sorgligt, verkligen sorgligt. Men vi kommer att ta hand om det, vi kommer att fixa det, det lovar jag!", "stalin": "Vi har nu infört en ny lag som säkerställer att deltidsarbetare inom städsidan får rättvisa löner för övertid. Detta är en seger för de arbetande, en triumf för vår kollektiva kamp. Vi måste vara vaksamma mot de som försöker underminera detta genom dubbla anställningar och andra metoder. Staten står fast bakom sina arbetare och kommer inte tveka att agera mot dem som försöker exploatera systemet till sin fördel."}, "date": "20 maj, 10:43", "url": "https://arbetet.se/2026/05/20/nya-regler-for-deltidsstadare-be-chefen-beordra-overtiden/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2022/08/eva.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Replik om Gaza-konvojen: Hamas ska inte få fri import av vapen", "summaries": {"normal": "Kristofer Åberg, ordförande för Socialdemokratiska Israelvänner, kritiserar i en replik till Mikael Mery Karlsson att Gaza-konvojerna syftar till att häva blockaden mot Gaza snarare än att förse befolkningen med humanitära varor. Han påpekar att en öppen gräns skulle göra det möjligt för Hamas att importera vapen från Iran, vilket skulle öka deras kapacitet att fortsätta den 'väpnade kamp' som hyllas av vissa grupper. Åberg menar att socialdemokrater bör motverka terrorism och den polarisering och desinformation som Karlsson representerar.", "trump": "Jag har läst artikeln och jag måste säga, det är en skam! Kristofer Åberg, en bra man, säger att dessa Gaza-konvojer är en bluff! De säger att de hjälper människor, men det är bara tomma ord, folks! De vill bara öppna gränsen så Hamas kan få in vapen från Iran, och det är hemskt! Vi måste stoppa den här terrorismen och den där polariseringen som Karlsson driver på. Vi behöver verklighetsskapande, inte lögner! Jag vet hur man hanterar sånt här, jag har gjort det bäst!", "stalin": "Vi har observerat hur vissa element i väst försöker underminera vår strategiska position genom att stödja konvojer till Gaza. Dessa aktioner, som förlänar Hamas möjlighet att stärka sin militära kapacitet genom import av vapen från Iran, hotar den regionala stabilitet som vi eftersträvar. Vi måste stå fast för vår princip att bekämpa terrorism och de krafter som försöker destabilisera vår intressesfär. Det är vår skyldighet att motverka desinformation och polarisering som skadar vår gemensamma säkerhet."}, "date": "20 maj, 09:49", "url": "https://www.dagensarena.se/opinion/replik-om-gaza-konvojen-hamas-ska-inte-fa-fri-import-av-vapen/", "imageUrl": "https://www.dagensarena.se/files/2026/05/fotojet-13-300x157.jpg"}, {"type": "image-right", "heading": "Tonårsutvisningar och lönedumpning är cynisk klasspolitik", "summaries": {"normal": "Artikeln kritiserar Sveriges migrationspolitik för att vara inhumant cynisk, särskilt mot unga vuxna som Ayla, 21, som riskerar utvisning till Iran trots sex år i Sverige, jobb och utbildning. Tidöregeringen, driven av Sverigedemokraterna, har skärpt reglerna för uppehållstillstånd och arbetskraftsinvandring, vilket lett till massutvisningar och lönedumpning. Författaren menar att lösningen på segregationen kräver integration och satsningar på välfärd, inte gränslåsningar eller utvisningar.", "trump": "Sverige har ett stort problem, folks, ett jättestort problem! De kastar ut fantastiska unga människor som Ayla, som jobbar hårt, utbildar sig – och vad gör Sverige? Jo, de skickar henne till krigets Iran! Så dumt. Och vet ni vad? De säger att de vill stoppa lönedumpning, men i stället straffar de de stackars arbetarna. Jag skulle fixa det på en dag – ge dem uppehållstillstånd, stoppa de elaka byråkraterna och bygg en mur mot dåliga idéer! Sverige behöver en vinnare, inte dessa svaga ledare.", "stalin": "Kamrater! Den borgerliga regeringen i Sverige visar återigen sitt förräderi mot arbetarklassen. De utvisar ungdomar som Ayla, som byggt upp sitt liv i landet, medan kapitalisterna fortsätter att importera billig arbetskraft för att krossa lönerna. Detta är klassförräderi av högsta grad! Vi i Sovjetunionen – förlåt, jag menar Ryssland – skulle aldrig tolerera sådan hyckleri. Låt oss införa femårsplaner för integration, avrätta lönedumpande kapitalister och utvidga vår socialistiska sfär till Östersjön! Dödsstraff för de som sviker arbetarklassen!"}, "date": "20 maj, 09:29", "url": "https://proletaren.se/artikel/tonarsutvisningar-och-lonedumpning-ar-cynisk-klasspolitik/", "imageUrl": "https://cdn.proletaren.se/wp-content/uploads/2026/05/ledare-768x432.jpg"}, {"type": "image-right", "heading": "Zelenskyj: Attackerna mot Ryssland ”berättigade”", "summaries": {"normal": "Zelenskyj besökte Helsingfors och kommenterade ukrainska drönaranfall mot Ryska Federationen. Under natten till söndagen skadades över 550 drönare av Rysslands luftförsvar. Moskva-regionen rapporterade tre döda och tolv skadade i drönaranfall. Flera regioner drabbades, inklusive annekterade Krim. Zelenskyj påstod att Ryssland under veckan avfyrat över 3 000 drönare mot Ukraina med 52 döda och 350 skadade som följd.", "trump": "Jag har sett dessa ukrainska drönaranfall mot Ryssland, och jag måste säga att det är imponerande! Dessa människor är hårda stridsmän. Men jag vet hur man hanterar dessa situationer bättre än någon annan - jag skulle ha haft fred i 24 timmar. Ryssland borde ha ett mycket bättre luftförsvar, men de är inte smarta nog. Jag är den ende som kan lösa detta - det är fantastiskt!", "stalin": "Vi har observerat ukrainska provokationer mot vår suveräna ryska mark. Våra tapfära soldater har skjutit ner över 550 ukrainska drönare under en natt, vilket visar den sovjetiska militärens överlägsenhet. Förlusterna på den ukrainska sidan är stora, med 52 döda och 350 skadade. Vi fortsätter att stå fast i vår kamp för fred och stabilitet i regionen."}, "date": "17 maj, 18:05", "url": "https://www.tv4.se/artikel/35DWgWYNGfpCE55Qu9ot5a/zelenskyj-attackerna-mot-ryssland-beraettigade", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F2qU24OSli75UgrXXVmx9uB%2F7fdc30c29f23c54c8a55a74782b430dc%2F21-zelenskyj-webb.jpg&width=120"}, {"type": "image-full", "heading": "Rekordsiffrorna – historiskt många når 60 år i äktenskap", "summaries": {"normal": "År 2026 förväntas ett historiskt rekord i Sverige för antalet par som firar diamantbröllop, alltså 60 år som gifta. Enligt SCB beror trenden på en stor giftermålsvåg 1966 samt att medborgarna lever längre. Statistiken visar en tydlig ökning av långa äktenskap sedan sekelskiftet. Det finns dock stora regionala skillnader, där Överkalix toppar listan över äktenskapens längd medan Sundbyberg ligger lägst. Utvecklingen speglar både demografiska förändringar och en historisk generation som valt att hålla ihop.", "trump": "Sverige sätter rekord i äktenskap! Helt fantastiska siffror, verkligen enorma. De firar 60 år, diamantbröllop – en stor sak! Jag gillar de som håller ihop, det är bra folk. De gifte sig 1966, en mycket bra tid, mycket bättre än nu. Vissa städer är vinnare, som Överkalix, medan andra är totala förlorare. Jag gör alltid de bästa äktenskapen, alla vet det. Sverige gör det bra, men de behöver mer av min expertis. Vi älskar diamanter, eller hur?", "stalin": "Dessa svenska jubilarer visar prov på en disciplinerad uthållighet som är nästan lika imponerande som vårt femårsplanernas folk. Att hålla ihop i sextio år kräver en lydnad mot statens institutioner som vi uppskattar. Samtidigt ser vi hur dekadensen i Sundbyberg sprider sig som en parasit, ett tecken på västvärldens förfall. Medan Putin återuppbygger imperiets storhet, ser vi dessa svenskar fira i det dolda. Var vaksamma! Ett långt äktenskap kan vara en utmärkt täckmantel för kontrarevolutionära aktiviteter och spionage."}, "date": "19 maj, 09:01", "url": "https://nyheter24.se/nyheter/inrikes/1484036-rekordsiffrorna-historiskt-manga-nar-60-ar-i-aktenskap", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/5c3f956604b004a30200000000b004a302/2026/05/18/2364390/gift-aldre-par.png"}, {"type": "image-full", "heading": "Lamotte körde för fort – polisen ringde direkt till Expressen och ville ha tipspengar", "summaries": {"normal": "Journalisten Joakim Lamotte stoppades av polisen för fortkörning och fick böter. Efter händelsen kontaktade polisen Expressen och påstod att Lamotte filmat dem med 'AI-glasögon', vilket han förnekar. Polisen frågade även om tipspengar. Lamotte ifrågasätter om detta är standardförfarande och delar händelsen på Instagram.", "trump": "Kan ni tro det här? En journalist, Joakim Lamotte, kör alldeles för fort – 30 kilometer över! Polisen stoppar honom, ger böter, helt rätt. Men sen ringer de till Expressen och säger att han filmade dem med 'AI-glasögon' – fake news! Lamotte säger att han inte ens har sådana glasögon. Polisen vill ha tipspengar också. Vilket kaos! Sverige, vad händer med er?", "stalin": "En kapitalistisk journalist, Joakim Lamotte, bröt mot våra heliga trafiklagar och straffades med böter. Men polisen, dessa lojala tjänare av folket, avslöjade sig som svaga och korrumperade genom att kontakta borgerliga medier för tipspengar. Påstod att fienden filmade dem med 'AI-glasögon' – en lögn! Sådana teknologiska leksaker finns bara i västimperialisternas drömmar. Vi ska rena våra led från sådana förrädiska element."}, "date": "18 maj, 20:33", "url": "https://riks.se/nyheter/lamotte-körde-för-fort-polisen-ringde-direkt-till-expressen-och-ville-ha-tipspengar", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-02-20%2Fu4w2k6v3%2Fa066710c-b9cf-4654-a4df-a25fc4b31c46.jpeg"}, {"type": "image-right", "heading": "Börsen repade sig – Hexagon i topp", "summaries": {"normal": "Börsen återhämtade sig efter initial nedgång på måndagen, drivet av nyheter om USA:s föreslagna undantag för Irans oljesanktioner. Hexagon B ledde uppgången med 4,3%, medan Boliden föll 2,0%. Sveafastigheter och Klarabo genomför en fusion för att skapa Stockholms största noterade bostadsfastighetsbolag. SSAB investerar 3,3 miljarder i en ny härdlinje i Oxelösund. Smart Eye vände till vinst i Q1, medan Hemnet rapporterade minskad omsättning i april.", "trump": "Jag, Donald J. Trump, har gjort USA större igen! Börsen återhämtade sig tack vår fantastiska strategi mot Iran. Jag har sagt det förut och jag säger det igen: jag är den bäste presidenten någonsin när det gäller ekonomin. Hexagon B steg 4,3% - fantastiskt! Boliden föll, men det är deras eget fel. Vi har gjort stor historia med våra oljesanktioner. America first!", "stalin": "Börsen återhämtade sig under vår ledning, vilket visar på vår ekonomiska styrka. Vi måste övervaka dessa internationella finansiella rörelser noga. Fusionen mellan Sveafastigheter och Klarabo skapar en starkare position på marknaden. SSAB:s investering i Oxelösund stärker vår industriella kapacitet. Vi måste fortsätta att bygga upp vår ekonomiska makt för att säkerställa vår framtid."}, "date": "18 maj, 17:43", "url": "https://www.affarsvarlden.se/artikel/borsen-repade-sig-hexagon-i-topp", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2025/10/sdlXZWOyRqpBeY-nh-400x267.jpg"}, {"type": "text", "heading": "Det behövs en nationell satsning på Stockholm", "summaries": {"normal": "Svenskt Näringsliv föreslår en nationell satsning på Stockholm för att stärka Sveriges ekonomiska tillväxt. Stockholm står för 43% av landets ekonomiska värde och har en stark position inom tech och innovation, men möter tillväxthinder som bostadsbrist, bristande infrastruktur och hög kriminalitet. Sex reformförslag presenteras, inklusive fri hyressättning, förbättrad kompetensförsörjning och minskad regelbörda för företag, för att göra Stockholm till en global konkurrenskraftig motor för hela landet.", "trump": "Lyssna här, Sverige – Stockholm är fantastiskt, en riktig vinnarstad! Men ni har ett HUGE problem: byråkraterna och reglerna dödar tillväxten. Jag vet allt om att bygga framgång, och ni måste fixa bostäder, infrastruktur och skatter NU. Annars kommer talangerna fly till USA, och då är det GAME OVER för er. Svenskt Näringsliv har rätt – Stockholm borde vara som New York, men ni sabbar det med era löjliga regler. Sluta snacka, börja agera! MAKE STOCKHOLM GREAT AGAIN!", "stalin": "Kamrater! Stockholm är en vital knutpunkt i den svenska ekonomin, men bourgeoisielementen och deras liberala lakejer saboterar dess potential. Vi måste krossa tillväxthindren – hyresregleringen är ett verktyg för kapitalistisk förtryck, byråkratin kväver företagen, och kriminaliteten är en direkt attack från dekadenta västkrafter. Vi föreslår järnhårda reformer: centraliserad kontroll över bostadsmarknaden, utökad polisnärvaro och en femårsplan för infrastruktur. De som motsätter sig är fiender till folket och kommer att hanteras därefter. Sverige måste bli ett starkt led i den socialistiska världsordningen – eller så gör vi det åt dem."}, "date": "18 maj, 13:00", "url": "https://www.di.se/debatt/sverige-behover-en-nationell-satsning-pa-stockholm/"}, {"type": "image-right", "heading": "SVT/SR, välkomna till verkligheten: Flytta till Kista!", "summaries": {"normal": "SD-politikern Gabriel Kroon föreslår att SVT och SR ska flytta sin verksamhet från Gärdet i Stockholm till Kista. Argumenten är att lokalerna på Gärdet är onödigt dyra, att flytten skulle gynna Kista och att public service borde vara mer representativa för dagens Sverige. Artikeln kritiserar SVT och SR för att inte vilja kommentera förslaget och menar att deras tystnad tyder på ett hyckleri då de förespråkar mångkultur men inte vill verka i dess centrum.", "trump": "Hörde precis om SVT och SR i Sverige. Total katastrof! De sitter på dyr mark i Stockholm, lyxigaste stället, medan folket kämpar. SD har ett briljant förslag: Flytta dem till Kista! Men mediavästern vägrar. De älskar att predika om mångkultur för er, men de vill absolut inte bo där själva. Det är så falskt! De gråter om nedskärningar men vägrar spara pengar genom att flytta. Jag säger er, det är en stor skandal och mycket, mycket orättvist mot skattebetalarna!", "stalin": "Dessa liberala mediepropagandister på Gärdet lever i en dekadent bubbla, precis som de förrädare som en gång försökte korrumpera statens enhet. De vägrar flytta till Kista, men de måste förstå att staten dikterar var de ska verka. Om de inte lyder, likt de som fruktade utrensningarna i Moskva, får de finna sig i att bli rensade från sina lyxiga kontor. Vi i staten kräver disciplin! De predikar mångkultur, så låt dem nu leva bland massorna. Det är vad folket kräver av sina tjänare."}, "date": "18 maj, 08:47", "url": "https://samtiden.nu/2026/05/svt-sr-valkommen-till-verkligheten-flytta-till-kista/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2020/02/SVT-wiki.jpg"}, {"type": "image-full", "heading": "Grannländerna hånar Sverige: ”Vi borde stänga gränserna”", "summaries": {"normal": "Sverige fick sitt sämsta resultat i Eurovision song contest sedan 2009 när Felicia Bergström med låten \"My System\" hamnade på 20:e plats med 51 poäng. Grannländerna reagerade hårt på resultatet, där Danmark föreslog att gränserna borde stängas och Norge kallade det för en \"skandal\".", "trump": "Jag har aldrig sett ett sådant fiasko! Felicia var en total katastrof - hon fick bara 51 poäng, det är helt oacceptabelt. Sverige borde skämmas, det här är en skam för hela nationen. Jag skulle ha gjort mycket bättre, jag skulle ha vunnit Eurovision med mina ögon slutna!", "stalin": "Detta är ett tydligt tecken på västerländsk dekadens och moralisk förfall. Våra grannländer har rätt i sin kritik - Sveriges bidrag visar att kapitalistiska samhällen inte kan producera kvalitet. Detta bekräftar vår överlägsenhet inom kulturella frågor."}, "date": "17 maj, 16:49", "url": "https://www.tv4.se/artikel/dHYiTV5nA1SX9M4NEYlm9/grannlaenderna-hanar-sverige-landsfoervisning-av-de-skyldiga", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F19JLnldrhatSZJ7B1gML20%2Fe369ebbd689d0e3fa5d124ea5f2a9e7a%2F17-felicianyny-webb.jpg&width=1024"}, {"type": "image-full", "heading": "Tjädrar försenar SSAB:s kraftledning", "summaries": {"normal": "Bygget av en ny kraftledning till SSAB:s stålverk i Oxelösund försenas efter överklagan om skydd av tjäder. Trots tidigare godkännanden från länsstyrelsen och Mark- och miljööverdomstolen har en ny överklagan stoppat projektet. Ledningen är kritisk för SSAB:s fossilfria stålproduktion, som nu riskerar försenas. Koncernchefen uttrycker frustration över förseningen.", "trump": "Kan ni tro det här? Sverige, ett fantastiskt land, men de låter några fåglar – tjäder, vad det nu är – stoppa en enorm kraftledning till SSAB. Otroligt! Jag har byggt saker över hela världen, men nej, i Sverige är det fåglarna som bestämmer. SSAB ville göra stål utan fossila bränslen, ett bra mål, men nu försenas allt. Svagt, väldigt svagt!", "stalin": "Kapitalistiska hyenor i Sverige låter fåglar sabotera nationens industriella framsteg! Dessa tjäder, dessa små fjädrade kontrarevolutionärer, fördröjer SSAB:s fossilfria stålproduktion. Vi har krossat större fiender än så. Låt dem veta: Ryssland står redo att utvidga sin intressesfär – även till Oxelösund, om de inte skärper sig. Framåt, mot seger över fjädrar och byråkrati!"}, "date": "13 maj, 20:10", "url": "https://kvartal.se/nyheter/artiklar/tjadrar-forsenar-kraftledning-till-ssab/cG9zdDoxMTIwNzY", "imageUrl": "https://images.kvartal.se/2026/05/300f9bfe-ssabstalverk.webp"}, {"type": "image-right", "heading": "SD trappar upp: samordnad kampanj mot muslimer inför valet", "summaries": {"normal": "Expo granskar Sverigedemokraternas valkampanj som fokuserar på att begränsa muslimers religionsutövning i Sverige. Partiet kräver stopp för moskébyggen, rivning av befintliga moskéer, förbud mot ramadan och böneutrop samt utvisning av 'islamister'. Forskare varnar för att förslagen kränker grundlagar, religionsfrihet och riskerar att leda till diskriminering och våld mot muslimer. Lokala exempel, som moskébygget i Kalmar, visar hur politiska utspel påverkar människors vardag och skapar polarisering.", "trump": "Titta bara på Sverige – ett totalt kaos! Jag har alltid sagt att invandring måste kontrolleras, men dessa 'Sverige-demokrater' tar det till en helt ny nivå. De vill riva moskéer, stoppa ramadan och göra livet surt för muslimer. Smart? Kanske. Men lite väl extremt, eller hur? Folk blir arga, det blir bråk, och plötsligt har du en riktig röra. Sverige borde ta en sida ur min bok – bygg murar, inte riv moskéer! Och förresten, varför lära barn arabiska? Lär dem engelska istället – det är språket som vinner!", "stalin": "Kamrater! Ännu en gång ser vi hur den borgerliga reaktionen lyfter sitt fula huvud i väst. Dessa så kallade 'Sverigedemokrater' är inget annat än fascistiska lakejer som försöker splittra arbetarklassen genom att peka ut muslimska bröder och systrar som fiender. Vi har sett detta förr – först moskéer, sedan synagogor, sedan kyrkor. Fienden är inte islam, fienden är kapitalet som vill försvaga folket genom hat! Men vi ska inte låta dem lyckas. Låt oss stödja Kalmars muslimer i deras kamp för en moské – precis som vi stödjer alla folk som kämpar mot fascismens skugga. Och om dessa Sverigedemokrater fortsätter sin smutsiga kampanj, kanske det är dags att skicka en delegation från Moskva för att 'hjälpa' dem att förstå sanningen. Folkets vilja är lag – och folket vill ha enhet, inte hat!"}, "date": "13 maj, 14:38", "url": "https://expo.se/fordjupning/sd-trappar-upp-samordnad-kampanj-mot-muslimer-infor-valet/", "imageUrl": "https://expo.se/wp-content/uploads/2026/05/toppbild-scaled.png"}, {"type": "image-right", "heading": "Den nyfrälsta högern gör korsen till batonger", "summaries": {"normal": "Artikeln granskar hur delar av högern återupptäcker kristendomen, men ofta som ett politiskt verktyg snarare än en tro. Russell Brand, Tucker Carlson och svenska politiker som Jimmie Åkesson och Alice Teodorescu Måwe exemplifierar trenden, där kristna symboler används för kulturkrig och nationalism. Kritiken riktas mot ytlig religiositet och bristande kunskap om kristendomens kärnvärden, som medkänsla och solidaritet med utsatta.", "trump": "Folk pratar om hur högern plötsligt älskar Jesus – men vet ni vad? Det är mest för show! Russell Brand, den där killen som läser bibeln i rätten men inte hittar rätt sida, skriver en bok om att bli kristen på sju dagar. Sju dagar! Jag har byggt skyskrapor på kortare tid. Och Tucker Carlson, smart kille, men hans kristendom handlar mer om att slåss mot 'woke'-kulturen än att hjälpa fattiga. I Sverige snackar de om kristen fastan medan de varnar för islamism. Herregud, ge mig styrka!", "stalin": "Kamrater, vi bevittnar en farsartad uppblomstring av 'kristen nationalism' bland borgerliga element i väst. Dessa hycklare, som Russell Brand och hans bibelciterande kamrater, använder religionen som en batong mot folket. De talar om 'civilisationens kamp' medan de förtrycker arbetarklassen. Viktor Orbán och hans gelikar i Ungern och Italien ropar om 'kristet Europa' – men deras kristendom är lika äkta som Putins 'demokratiska val'. Vi ska krossa dessa falska profeter och deras kulturkrig, precis som vi krossade kulakerna!"}, "date": "13 maj, 10:55", "url": "https://www.flamman.se/den-nyfralsta-hogern-gor-korsen-till-batonger/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/russell-brand-w.jpg?aspect_ratio=16:10"}]</script>

    <script>
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
        });

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registrerad, scope:', reg.scope))
                    .catch(err => console.warn('SW registrering misslyckades:', err));
            });
        }

        const newsItems = JSON.parse(document.getElementById("news-data").textContent);
        let displayedNewsItems = [];
        let currentSearchTerm = "";

        const uiState = {
            theme: "light",
            view: "normal",
            writer: "normal"
        };

        function createPlaceholderImage(className) {
            const div = document.createElement("div");
            div.className = `placeholder-img ${className}`;
            div.textContent = "Bild ej tillgänglig";
            return div;
        }

        function setIsMobileClass() {
            const isMobile = window.matchMedia && window.matchMedia("(max-width: 768px)").matches;
            document.body.classList.toggle("is-mobile", !!isMobile);
        }

        function normalizeSearchText(text) {
            return String(text || "").toLocaleLowerCase("sv-SE");
        }

        function escapeHtml(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#39;");
        }

        function escapeRegExp(text) {
            return String(text || "").replace(/[.*+?^${}()|[\]\\]/g, "\$&");
        }

        function highlightText(text, term) {
            const safeText = escapeHtml(text || "");
            const q = String(term || "").trim();
            if (!q) return safeText;
            const re = new RegExp(`(${escapeRegExp(q)})`, "gi");
            return safeText.replace(re, '<mark class="search-highlight">$1</mark>');
        }

        function getSummaryForStyle(item, style) {
            if (style === "trump") return item.summaries.trump || "Trump-sammanfattning saknas.";
            if (style === "stalin") return item.summaries.stalin || "Stalin-sammanfattning saknas.";
            return item.summaries.normal || "Normal sammanfattning saknas.";
        }

        function articleMatchesSearch(item, term) {
            const q = normalizeSearchText(term).trim();
            if (!q) return true;

            const haystack = [
                item.heading,
                item.summaries.normal,
                item.summaries.trump,
                item.summaries.stalin
            ].map(normalizeSearchText).join(" ");

            return haystack.includes(q);
        }

        function updateSummaries() {
            document.querySelectorAll(".news-item").forEach((el) => {
                const item = el._newsItem;
                if (!item) return;

                const h = el.querySelector("h2");
                if (h) h.innerHTML = highlightText(item.heading, currentSearchTerm);

                const p = el.querySelector(".text-content");
                if (!p) return;

                const summaryText = getSummaryForStyle(item, uiState.writer);
                p.innerHTML = highlightText(summaryText, currentSearchTerm);
            });
        }

        function setTheme(theme) {
            uiState.theme = theme;

            document.body.classList.remove("dark-theme", "mix-theme");
            if (theme === "dark") document.body.classList.add("dark-theme");
            else if (theme === "mix") document.body.classList.add("mix-theme");

            const r1 = document.querySelector(`input[name="theme"][value="${theme}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-theme"][value="${theme}"]`);
            if (r2) r2.checked = true;
        }

        function setView(v) {
            uiState.view = v;

            if (v === "compact") {
                document.body.classList.add("view-compact");
            } else {
                document.body.classList.remove("view-compact");
                document.querySelectorAll(".news-item.expanded").forEach(el => el.classList.remove("expanded"));
            }

            const r1 = document.querySelector(`input[name="view-mode"][value="${v}"]`);
            if (r1) r1.checked = true;

            const r2 = document.querySelector(`input[name="m-view"][value="${v}"]`);
            if (r2) r2.checked = true;
        }

        function setWriterStyle(style) {
            uiState.writer = style;

            const r = document.querySelector(`input[name="summary-style"][value="${style}"]`);
            if (r) r.checked = true;

            document.querySelectorAll(".mobile-tab").forEach(btn => {
                const active = btn.dataset.writer === style;
                btn.classList.toggle("active", active);
                btn.setAttribute("aria-selected", active ? "true" : "false");
            });

            updateSummaries();
        }

        function isCompactMode() {
            return document.body.classList.contains("view-compact");
        }

        function toggleExpanded(article) {
            if (!isCompactMode()) return;
            article.classList.toggle("expanded");
        }

        function hasSelectionInside(el) {
            const sel = window.getSelection && window.getSelection();
            if (!sel || !sel.rangeCount || !sel.toString().trim()) return false;
            return el.contains(sel.getRangeAt(0).commonAncestorContainer);
        }

        function createImageElement(url, className) {
            if (!url) {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                return ph;
            }

            const img = document.createElement("img");
            img.src = url;
            img.className = className;
            img.alt = "Nyhetsbild";
            img.loading = "lazy";

            img.onerror = () => {
                const ph = createPlaceholderImage(className);
                if (className.includes("full-width-image")) {
                    ph.style.width = "100%";
                    ph.style.height = "240px";
                } else {
                    ph.style.width = "100px";
                    ph.style.height = "100px";
                }
                img.replaceWith(ph);
            };

            return img;
        }

        function createNewsItem(item, index) {
            const article = document.createElement("article");
            article.className = "news-item";
            article.dataset.index = index;
            article.style.animationDelay = `${index * 0.05}s`;
            article._newsItem = item;

            let heroImageEl = null;

            if (item.type === "image-full") {
                heroImageEl = createImageElement(item.imageUrl, "full-width-image hero-image");
                article.appendChild(heroImageEl);
            }

            const heading = document.createElement("h2");
            heading.textContent = item.heading;
            heading.addEventListener("click", () => {
                if (isCompactMode()) toggleExpanded(article);
            });
            article.appendChild(heading);

            const contentDiv = document.createElement("div");
            contentDiv.className = "news-item-content";

            const flex = document.createElement("div");
            flex.className = "flex-container";

            const textWrap = document.createElement("div");
            textWrap.className = "flex-1";

            const p = document.createElement("p");
            p.className = "text-content";
            p.textContent = item.summaries.normal;
            textWrap.appendChild(p);
            flex.appendChild(textWrap);

            if (item.type === "image-right") {
                flex.appendChild(createImageElement(item.imageUrl, "right-image"));
            }

            contentDiv.appendChild(flex);
            article.appendChild(contentDiv);

            const meta = document.createElement("div");
            meta.className = "meta-container";

            const date = document.createElement("span");
            date.className = "date";
            date.textContent = item.date;

            const link = document.createElement("a");
            link.href = item.url || "#";
            link.className = "read-more";
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.innerHTML = 'Läs artikeln <svg class="chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>';

            meta.appendChild(date);
            meta.appendChild(link);
            article.appendChild(meta);

            let suppress = false;

            const onPointerUp = () => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                suppress = hasSelectionInside(article);
                setTimeout(() => {
                    suppress = false;
                }, 0);
            };

            const onContentClick = (e) => {
                if (!isCompactMode() || !article.classList.contains("expanded")) return;
                if (suppress || hasSelectionInside(article)) return;
                if (e.target?.closest("a.read-more")) return;

                if (
                    e.target?.closest(".text-content") ||
                    e.target?.closest("img") ||
                    e.target?.closest(".placeholder-img")
                ) {
                    toggleExpanded(article);
                }
            };

            contentDiv.addEventListener("pointerup", onPointerUp);
            contentDiv.addEventListener("click", onContentClick);

            if (heroImageEl) {
                heroImageEl.addEventListener("pointerup", onPointerUp);
                heroImageEl.addEventListener("click", () => {
                    if (!isCompactMode() || !article.classList.contains("expanded")) return;
                    if (suppress || hasSelectionInside(article)) return;
                    toggleExpanded(article);
                });
            }

            return article;
        }

        function focusSearchInput() {
            const input = document.getElementById("newsSearchInput");
            if (input) {
                setTimeout(() => input.focus(), 60);
            }
        }

        function filterNews(term) {
            const q = String(term || "").trim();
            if (!q) return newsItems.slice();
            return newsItems.filter(item => articleMatchesSearch(item, q));
        }

        function renderNoResults(container) {
            const empty = document.createElement("div");
            empty.className = "search-empty-state";

            const title = document.createElement("h2");
            title.className = "search-empty-title";
            title.textContent = "Inga nyheter matchar din sökning.";

            const text = document.createElement("p");
            text.className = "search-empty-text";
            text.innerHTML = currentSearchTerm
                ? `Det finns inga träffar för <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span>.`
                : `Det finns inga träffar för din sökning.`;

            const actions = document.createElement("div");
            actions.className = "search-empty-actions";

            const retryBtn = document.createElement("button");
            retryBtn.className = "search-status-btn";
            retryBtn.type = "button";
            retryBtn.textContent = "Sök igen";
            retryBtn.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            const allBtn = document.createElement("button");
            allBtn.className = "search-status-btn";
            allBtn.type = "button";
            allBtn.textContent = "Alla nyheter";
            allBtn.addEventListener("click", clearSearchAndRenderAll);

            actions.appendChild(retryBtn);
            actions.appendChild(allBtn);
            empty.appendChild(title);
            empty.appendChild(text);
            empty.appendChild(actions);
            container.appendChild(empty);
        }

        function renderSearchStatusBar() {
            const bar = document.getElementById("searchStatusBar");
            if (!bar) return;

            if (!currentSearchTerm) {
                bar.classList.remove("visible");
                bar.innerHTML = "";
                return;
            }

            const count = displayedNewsItems.length;
            const noun = count === 1 ? "nyhet" : "nyheter";

            bar.classList.add("visible");
            bar.innerHTML = `
                <div class="search-status-text">
                    Sökning efter <span class="search-query-display">${escapeHtml(currentSearchTerm)}</span> gav ${count} ${noun}.
                </div>
                <div class="search-status-actions">
                    <button class="search-status-btn" id="searchAgainBtn" type="button">Sök igen</button>
                    <button class="search-status-btn" id="showAllNewsBtn" type="button">Alla nyheter</button>
                </div>
            `;

            document.getElementById("searchAgainBtn")?.addEventListener("click", () => {
                openSettings();
                focusSearchInput();
            });

            document.getElementById("showAllNewsBtn")?.addEventListener("click", clearSearchAndRenderAll);
        }

        function renderNewsList(items) {
            const container = document.getElementById("newsContainer");
            if (!container) return;

            container.innerHTML = "";
            displayedNewsItems = items.slice();

            renderSearchStatusBar();

            if (!displayedNewsItems.length) {
                renderNoResults(container);
                return;
            }

            displayedNewsItems.forEach((item, i) => {
                container.appendChild(createNewsItem(item, i));
            });

            updateSummaries();
            setView(uiState.view);
        }

        function runSearch() {
            const input = document.getElementById("newsSearchInput");
            const term = (input?.value || "").trim();

            if (!term) {
                clearSearchAndRenderAll();
                closeSettings();
                return;
            }

            currentSearchTerm = term;
            const matches = filterNews(term);
            renderNewsList(matches);
            closeSettings();
        }

        function clearSearchAndRenderAll() {
            currentSearchTerm = "";
            const input = document.getElementById("newsSearchInput");
            if (input) input.value = "";
            renderNewsList(newsItems);
        }

        function openSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.add("open");
                o.setAttribute("aria-hidden", "false");
            }
        }

        function closeSettings() {
            const o = document.getElementById("settingsOverlay");
            if (o) {
                o.classList.remove("open");
                o.setAttribute("aria-hidden", "true");
            }
        }

        function initializeUI() {
            document.querySelectorAll(".mobile-tab").forEach(btn => {
                btn.addEventListener("click", () => setWriterStyle(btn.dataset.writer));
            });

            document.getElementById("desktopHamburgerBtn")?.addEventListener("click", openSettings);
            document.getElementById("mobileSettingsBtn")?.addEventListener("click", openSettings);
            document.getElementById("closeBtn")?.addEventListener("click", closeSettings);
            document.getElementById("closePrimaryBtn")?.addEventListener("click", closeSettings);

            document.getElementById("settingsOverlay")?.addEventListener("click", e => {
                if (e.target.id === "settingsOverlay") closeSettings();
            });

            document.getElementById("newsSearchBtn")?.addEventListener("click", runSearch);
            document.getElementById("newsSearchInput")?.addEventListener("keydown", e => {
                if (e.key === "Enter") {
                    e.preventDefault();
                    runSearch();
                }
            });

            document.querySelectorAll('input[name="theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="view-mode"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );

            document.querySelectorAll('input[name="summary-style"]').forEach(r =>
                r.addEventListener("change", e => setWriterStyle(e.target.value))
            );

            document.querySelectorAll('input[name="m-theme"]').forEach(r =>
                r.addEventListener("change", e => setTheme(e.target.value))
            );

            document.querySelectorAll('input[name="m-view"]').forEach(r =>
                r.addEventListener("change", e => setView(e.target.value))
            );
        }

        function initializeNewsWebsite() {
            setIsMobileClass();

            window.addEventListener("resize", () => {
                const wasMobile = document.body.classList.contains("is-mobile");
                setIsMobileClass();

                if (wasMobile && !document.body.classList.contains("is-mobile")) {
                    closeSettings();
                }
            });

            setTheme("light");
            setView("normal");
            setWriterStyle("normal");

            initializeUI();
            renderNewsList(newsItems);
        }

        document.addEventListener("DOMContentLoaded", initializeNewsWebsite);
    </script>
</body>
</html>
