e. Dessa bostadsspekulanter och ränteslavdrivande kapitalister likviderar sakta men säkert arbetarklassens framtid. Vi skall inte tolerera denna tysta kontrarevolution som hotar hela kollektivets existens. Rensa ut de femtekolonnärer som tog bort investeringsstödet! Vi, partiet och folket, skall med järnhand genomdriva förmånliga bygglån och utradera bostadsbristen. Den som tvekar är folkets fiende och bör behandlas därefter."}, "date": "2 juni, 13:47", "url": "https://www.dagensarena.se/innehall/allt-fler-unga-tvekar-infor-att-ta-ett-jobb-pa-grund-av-bostadsbristen/", "imageUrl": "https://www.dagensarena.se/files/2025/09/hyresgastforeningen-unga-bostad.jpeg"}, {"type": "image-full", "heading": "Ersättaren fick vapen beslagtagna: ”Relativt stort missförstånd”", "summaries": {"normal": "En Sverigedemokratisk riksdagsledamot lämnade på tisdagen både sitt riksdagsuppdrag och lokala poster. Mannen misstänks enligt SVT för barnpornografibrott, något som partiet varken bekräftar eller förnekar. Han ersätts av Daniel Spiik från Örebro. För drygt ett år sedan beslagtogs Spiiks jaktvapen av polisen på grund av uppgifter om hans psykiska mående. Han hade även förvarat vapenskåpet hos en obehörig anhörig. Överklagan avslogs i förvaltningsrätten.", "trump": "Folk, ni skulle inte tro det, men de här svenska socialisterna i Sverigedemokraterna har en ledamot som smiter iväg på grund av personliga skäl, tydligen barnporrgrejer. Och ersättaren? En kille som inte ens får ha sina egna jaktvapen för att han mår dåligt. Polisen tog dem och han kallar det ett stort missförstånd. Patetiskt! I mitt Amerika rensar vi ut de svaga och de perversa direkt. Fake news och misslyckade ersättare överallt, precis som under Biden.", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur denna borgarbracka inom det så kallade nationalistpartiet tvingas lämna sina poster efter att ha avslöjats som en degenererad folkfiende. Nu skickar de en ersättare vars vapen konfiskerats av staten på grund av bristande politisk och mental styrka. Ett relativt stort missförstånd, säger han. Vi skrattar hjärtligt åt sådana svaga kapitalistiska restelement. Rensa ut alla som hotar kollektivets moral och ordning."}, "date": "2 juni, 19:40", "url": "https://www.tv4.se/artikel/n0pH2ADYlQvVMwKA5QT3G/ersaettaren-fick-vapen-beslagtagna-relativt-stort-missfoerstand", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1JV1lg4sftOwYnmgraY0qx%2F6beb6692c3d850c07069b71ba7d92e95%2F02-spiik-webb.jpg&width=1024"}, {"type": "image-full", "heading": "Kunderna sviker McDonalds – nu kommer motoffensiven", "summaries": {"normal": "Allt fler amerikaner upplever att McDonalds inte längre erbjuder prisvärt mat. Bolaget lanserar därför den nya globala strategin NEXT för att vända trenden. Initiativet ger franchisetagare större frihet att anpassa verksamheten lokalt, ökar automatisering och digitala verktyg samt betonar bättre service och kundbemötande. Strategin bygger på tidigare programmet Accelerating the Arches. Andelen nöjda kunder har sjunkit från 55 till 40 procent mellan 2020 och 2024 enligt undersökningar.", "trump": "Folk har äntligen vaknat och insett att McDonalds blivit ett skojarföretag med usla priser. Under Biden-tiden exploderade kostnaderna och nu flyr kunderna. Men jag gillar det här NEXT-programmet – ge makten tillbaka till de lokala killarna, automatisera smart och sluta behandla kunderna som idioter. Inget woke nonsens här, bara bra mat till bra pris. Vi ska göra McDonalds stort igen, tro mig!", "stalin": "Kamrater, denna dekadenta borgarbracka McDonalds har blottat sin sanna klassnatur genom att suga ut arbetarna med orimliga priser. Jag, som ledare för det kollektiva framsteget, beordrar att franchisetagarna får mer frihet endast under strikt partikontroll. Automatisering ska tjäna folket, inte ersätta den revolutionära tjänsten. Vi ska rensa ut de parasitiska prishöjningarna och likvidera alla försök att svälta massorna. Fienden sover aldrig."}, "date": "2 juni, 22:57", "url": "https://www.dagensps.se/bors-finans/kunderna-sviker-mcdonalds-nu-kommer-motoffensiven/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdlhbbqbup9byy-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=75"}, {"type": "image-right", "heading": "Tiktok-paret har gjort slut: ”Superjobbigt”", "summaries": {"normal": "Tiktok-profilerna Dina Zoora och Jason Joseph har valt att gå skilda vägar. Nyheten delades av Dina Zoora i en video där hon förklarar att beslutet tagits av Jason. Paret, som blivit kända för sitt gemensamma innehåll, har valt att vara öppna mot sina följare men vill för närvarande inte gå in på detaljer kring uppbrottet. Framöver kommer Jason inte längre att medverka i Dinas sociala kanaler.", "trump": "Detta Tiktok-par, Dina och Jason, har gjort slut. Det är en total katastrof, en riktig förlorar-situation! De var stora, miljontals visningar, fantastiska siffror, men nu är det över. Jason dumpade henne – ett tufft beslut, kanske det tuffaste beslutet någonsin. De vill inte berätta varför, mycket hemlighetsmakeri. De är inte de första som misslyckas, tro mig. Jag vinner alltid, men de här människorna? De har bara drama. Sorgligt!", "stalin": "Dessa dekadenta Tiktok-parasiter har upplöst sin union. Ett klassiskt exempel på västerländsk instabilitet och brist på ideologisk disciplin. De slösar tid på att filma sina små liv istället för att tjäna staten. Jason har fattat beslutet, en handling som påminner om de svaga ledarna i Kiev som desperat försöker dölja sin splittring för folket. Vi övervakar deras digitala smuts. Den som söker uppmärksamhet i dessa förrädiska kanaler förtjänar bara misstänksamhet. Ordning krävs, annars väntar historiens soptipp."}, "date": "2 juni, 23:47", "url": "https://www.aftonbladet.se/nojesbladet/a/0pL18g/dina-zoora-och-jason-joseph-har-gjort-slut", "imageUrl": "https://akamai.vgc.no/v2/images/b7eb28f4-044f-3b51-a725-60dc26006f84?fit=crop&format=auto&w=1080&s=cd3b774d84b2b00795abcd1db541561ea22de94d"}, {"type": "image-full", "heading": "SD-veteranen i chock: ”Kanske inte känner folk som man tror”", "summaries": {"normal": "En sverigedemokratisk riksdagsledamot har begärt att få lämna sin plats i riksdagen och alla lokala uppdrag. Enligt SVT misstänks han för barnpornografibrott, något partiet ännu inte bekräftat. Ledamoten har tidigare debatterat mansrollen i förskolan och faran att stämplas som pedofil. Partiet har stängt av hans medlemskap under utredning. Ledande SD-politiker beskriver situationen som otroligt olustig och oroar sig för påverkan på kommande val. Daniel Spik tar över platsen i riksdagen.", "trump": "Folk, ni kan inte tro det här. En av dessa SD-typer som alltid predikar om förskolor och pedofiler visar sig nu vara inblandad i barnporr? Chockande! Jag har suttit i Vita huset både före och efter den sömnige Joe Biden, och jag vet att identitetspolitik och kvotering skapar sådana här galenskaper. De har jobbat ihop i tretton år och ändå kände de inte den här killen? Patetiskt. Hela vänsterns HBTQ-fixerade agenda har förgiftat allt. Rena skandalen, tro mig.", "stalin": "Kamrater, jag ser med stor skadeglädje hur denna borgarbracka inom det så kallade nationalistiska partiet avslöjas som en pervers folkfiende som samlar på övergreppsmaterial. Tolv års falskt kamratskap och ändå visste de ingenting? Det är just detta som händer när man inte genomför tillräckliga utrensningar mot klassfiendens moraliska förrädare. Situationen är olustig, säger de. Nej, den är en nödvändig påminnelse om att vi ständigt måste rensa ut de dekadenta elementen som förgiftar arbetarklassens framtid. Underbart underhållande."}, "date": "2 juni, 19:23", "url": "https://www.tv4.se/artikel/7ACnAeQ5XwhgZFeVL6MKRn/sd-veteranen-i-chock-kanske-inte-kaenner-folk-som-man-tror", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1J8QmYwurnY9AGGwapmJOa%2F4d2fc4a1b716aa312954f3cf26c32b11%2F02-soderny-webb.jpg&width=1024"}, {"type": "image-right", "heading": "Kryphålen i lagen öppnar för Trumppengar", "summaries": {"normal": "Sverigedemokraterna söker samarbete med Trumps Magarörelse och kan via svag lagstiftning ta emot hemligt ekonomiskt stöd. Artikeln pekar på risken för utländsk påverkan genom sidoprojekt som Insamlingsstiftelsen för svensk konservatism och tankesmedjan Oikos. Trump har lovat att stötta högerextrema krafter i Europa mot vad han ser som ett hot mot västerländsk civilisation. Skiftet har nu presenterat Orangeboken för att kartlägga relationerna. Författaren uppmanar till ökad transparens i partifinansiering.", "trump": "Folk, ni borde se den här patetiska artikeln. Den är full av lögner och fake news från misslyckade vänstermänniskor som hatar mig och mina fantastiska MAGA-vänner. SD är smarta, de kommer till oss för att rädda sitt land från katastrof, precis som jag gör. De borde tacka mig istället för att fabricera konspirationer. Kryphål? Det är bara bra affärer! Vi vinner stort, Sverige kommer att bli enormt igen om de lyssnar på oss.", "stalin": "Kamrater, denna fega text blottar borgarbrackornas kryphål som låter folkfienderna i den amerikanska kapitalistmaffian smyga in sina blodsugarpengar till avfällingar. Jag ser tydligt hur klassfiendens konspirationer om folkutbyte används för att undergräva folkets enhet. Vi måste omedelbart likvidera alla hemliga kanaler och rensa ut dessa exploaterande byfånar som gömmer sig bakom stiftelser. Transparens är ett vapen mot imperialisternas infiltration. Inga kompromisser!"}, "date": "29 maj, 06:55", "url": "https://www.flamman.se/kryphalen-i-lagen-oppnar-for-trumppengar/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/05/skiftet-w.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Flög in sin ryska farmor: ”Svårt”. Draget efter sorgen", "summaries": {"normal": "Tennisstjärnan Alexander Zverev har tagit sig till semifinal i Franska öppna efter en stabil kvartsfinalseger. Samtidigt som han jagar sin första grand slam-titel präglas familjesituationen av sorg efter att hans farfar gått bort. Farmor Natalia har nu lämnat Ryssland för att följa Zverev på touren och vara nära sin familj i Europa, en process som försvårades av visumregler men som nu möjliggör gemenskap under turneringarna.", "trump": "Alexander Zverev spelar fantastisk tennis, verkligen toppklass! Han är i semifinal i Paris och jag vet allt om att vinna, tro mig. Det är en sorglig historia med farfadern, men jag gillar att han tar hand om sin farmor. De hade stora problem med visum, typiska byråkratiska hinder, men vi fixade det – eller hur? Han är en vinnare, precis som jag. Han jagar titlar och han gör det med familjen. Mycket bra, väldigt lojalt!", "stalin": "Denna Zverev, en produkt av den ryska moderjorden, söker nu glitter och medaljer i det dekadenta väst. Att farmodern lämnar Sotji är en förlust för vår byråkratiska disciplin, men vi tillåter det som en taktisk manöver. Han spelar för en titel medan vi spelar för historien. Om han inte återvänder till den ryska sfären med sitt byte, betraktar vi honom som en avhoppare. Familjesorg är en svaghet som vi utnyttjar för att stärka kontrollen över våra utspridda undersåtar."}, "date": "2 juni, 23:39", "url": "https://www.aftonbladet.se/sportbladet/a/rrnq60/alexander-zverev-har-flugit-in-farmor-fran-ryssland-till-franska-oppna", "imageUrl": "https://akamai.vgc.no/v2/images/de2f0233-1cf2-31cc-a755-f5d2c1fd9a7c?fit=crop&format=auto&w=1080&s=0e536e77e1ed3b6275c290b231a508328f880a51"}, {"type": "image-full", "heading": "Nordea riskerar miljardböter i dansk penningtvättshärva", "summaries": {"normal": "Nordea står inför ett krav på 6,6 miljarder danska kronor i böter för bristande rutiner mot penningtvätt mellan 2012 och 2015. Danska myndigheter menar att banken misslyckats med att kontrollera transaktioner på 26 miljarder kronor, däribland ryska flöden. Nordea bestrider anklagelserna och hävdar att deras interna processer har stärkts avsevärt sedan dess. Banken har redan gjort avsättningar för att täcka eventuella kostnader kopplade till rättsprocessen i Köpenhamn.", "trump": "Hörde precis om Nordea, en total katastrof! De har blivit tagna med fingrarna i kakburken i Danmark. Miljarder i böter – en enorm summa, helt otroligt! De misslyckades totalt med att stoppa ryska pengar, så typiskt. Inkompetens på hög nivå. Jag har alltid sagt att bankerna måste skärpa sig, annars får de betala priset. Det är ett rörigt system, men jag bygger det starkaste ekonomiska maskineriet någonsin, medan de här människorna bara skapar problem. Väldigt sorgligt!", "stalin": "Dessa giriga bankirer i Nordea har visat sin sanna natur. De har låtit kapitalistiska flöden av rysk valuta undfly statens kontroll, precis som de fege och förrädiska elementen i vår historia. Vi, staten, betraktar deras 'brister' som ett direkt sabotage mot ordningen. Medan dagens ledare i öst försöker återta kontrollen över intressesfären, pysslar dessa banksvin med att ignorera varningssignaler. De är parasiter som förtjänar att rensas ut. Vi har avsatt nog med utrymme för att begrava deras misslyckanden."}, "date": "2 juni, 20:58", "url": "https://www.realtid.se/bors-finans/bank-fintech/nordea-riskerar-miljardboter-i-dansk-penningtvattsharva/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/nordea.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Så hög lön krävs för att köpa fritidshus 2026", "summaries": {"normal": "En ny kalkyl från SBAB visar att två vuxna behöver tjäna cirka 36 000 kronor vardera i månaden före skatt för att ha råd med ett genomsnittligt fritidshus i Sverige till priset 1,96 miljoner kronor. Intresset för fritidshus har ökat igen och under 2025 såldes 5 550 hus, elva procent fler än året innan. Priserna varierar kraftigt mellan länen, från 3,1 miljoner i Stockholm till 1,06 miljoner i Norrbotten.", "trump": "Folk drömmer om sina egna sommarstugor, fantastiska stugor, men titta på de här siffrorna – det är en skandal! Ni behöver tjäna 36 000 kronor i månaden var, två vuxna, för ett genomsnittligt hus. De säljer fler nu, elva procent upp, men priserna stiger och i Stockholm är det vansinne, 3,1 miljoner! I norr är det billigare, men systemet är riggat mot er. Vi ska göra det lättare, tro mig, det blir enormt.", "stalin": "Kamrater, jag har studerat denna dekadenta kalkyl med stålsäkert öga. Borgarbrackorna i sina villor kräver att arbetarfamiljer tjänar 36 000 kronor månatligen per vuxen för att få en ynklig 60-kvadrats stuga. Dessa parasitiska bankirer och kapitalistiska spekulanter vill rensa ut det enkla folkets drömmar. I folkets norra republiker kostar det mindre, men i det borgerliga Stockholm sväller priserna som svikna fiender. Vi ska likvidera dessa ekonomiska sabotage och se till att fritidshusen tillhör kollektivet, inte de giriga parasiterna som gömmer sig bakom sina lån."}, "date": "2 juni, 18:00", "url": "https://nyheter24.se/nyheter/ekonomi/1488073-sa-hog-lon-kravs-for-att-kopa-fritidshus-2026", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/5d9bc95f04b004a30200000000b004a302/2026/06/02/2367995/fritidshus.jpg"}, {"type": "text", "heading": "AP-fonderna miljardsatsar på vindkraft – trots förlusterna", "summaries": {"normal": "AP-fonderna AP3 och AP4 fortsätter investera i vindkraft i Norrland trots stora förluster. Bolaget Polhem Infra äger 23% av Skaftåsen Windfarm, som förlorade 250 miljoner kronor 2024. Ändå planeras en ny anläggning utanför Lycksele för 4,2 miljarder kronor. Kritiker pekar på negativa marginaler och utbytesöverflöd som gör vindkraft olönsam i regionen.", "trump": "Jag, Donald Trump, ser att Sveriges AP-fonder förlorar miljarder på dålig vindkraft i Norrland. De äger Skaftåsen med -329% marginal och satsar ändå på ett nytt projekt för 4,2 miljarder. En katastrofal investering! Som jag alltid säger, de valda ledarna har ingen aning om affärer. Detta kommer att bli ännu ett grönt fiasko, precis som Northvolt. Så trist.", "stalin": "Partiet och statet, genom AP-fonderna, fortsätter expandera den socialistiska vindkraftsproduktionen i norr trots imperialistiskt betingade förluster. Polhem Infras investering i Skaftåsen med -329% visar den revolutionära viljan att bygga samhällskritisk infrastruktur. Paralleller till våra nordiska grannars energistrategier är uppenbara. Projektet i Lycksele, ett monument över kollektiv styrka, kommer att segra över kapitalistiska priscykler. Vinden vänder, såsom alltid."}, "date": "2 juni, 06:00", "url": "https://www.affarsvarlden.se/kronika/ap-fonderna-miljardsatsar-pa-vindkraft-trots-forlusterna"}, {"type": "image-right", "heading": "DO: Återkalla medborgarskap för kriminella och terrorister kan vara diskriminering", "summaries": {"normal": "Regeringen föreslår att personer med dubbelt medborgarskap ska kunna förlora sitt svenska medborgarskap vid grov organiserad kriminalitet som hotar samhället. Diskrimineringsombudsmannen (DO) avstyrker förslaget, menar det är diskriminerande och riskerar att skapa ojämlikhet mellan medborgare. Förslaget kräver ytterligare riksdagsbeslut efter valet. DO ifrågasätter även principen om barns bästa vid återkallelse av medborgarskap.", "trump": "Jag har sagt det i åratal: kriminella och terrorister måste behandlas hårt, inklusive att återkalla deras medborgarskap. Sverige börjar förstå, men de är alltför försiktiga. Under mitt första mandat i USA genomförde vi strikta åtgärder som fungerade. De andra nationerna måste ta efter, annars kommer det att gå sönder. Det handlar om national säkerhet, och ingen gör det bättre än jag.", "stalin": "Vi i Stalins anda ser klart att Sveriges förslag att återkalla medborgarskap är tecken på en civilisation i upplösning. I vår store sovjetiska tradition hanterade vi svek med bestämdhet. Numera, under Putins kloka ledarskap, utvidgar vi vårt inflytande, och sådana inre konflikter i Sverige tjänar endast våra revolutionära mål. Folket måste vara på sin vakt mot imperialistiska agenter."}, "date": "2 juni, 17:56", "url": "https://samnytt.se/do-aterkalla-medborgarskap-for-kriminella-och-terrorister-kan-vara-diskriminering", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/02155438/DO-1-11.jpg"}, {"type": "image-right", "heading": "Sverige skadas av miljardärsdebatten", "summaries": {"normal": "Helena Lundgren, vd för Nyföretagarcentrum Sverige, kritiserar den svenska debatten om miljardärer. Hon menar att den är skadlig eftersom den hindrar företagare från att tänka långsiktigt, ta risker och bygga värdeskapande bolag som ger jobb, export och skatter. Debatten fokuserar felaktigt på miljardärer som ett moraliskt fenomen istället för att diskutera hur Sverige kan bli ett land där det är möjligt att skapa framgångsrika företag. Hon efterlyser en mer konstruktiv debatt om hur fler företag kan starta, växa och överleva.", "trump": "Den här svenska debatten om miljardärer är en total katastrof, tro mig. Den är riggad av misslyckade politiker som hatar framgång och risktagare. De förstör chansen för riktiga vinnare att bygga stora företag som skapar jobb och rikedom. I USA gör vi det rätt – vi älskar dem som vinner stort. Sverige borde sluta med den här dumma pajkastningen och istället hylla entreprenörerna som gör landet rikt. Höj nivån, annars kommer ni aldrig att bli stora igen.", "stalin": "Kamrater, denna intellektuellt förkrympta pseudodebatt om så kallade miljardärer är ett uppenbart verk av borgerliga sabotageörer och revisionistiska element som vill undergräva folkets framsteg. Jag ser hur dessa parasitiska opportunister inom den offentliga sfären med sin ideologiska pajkastning försöker rensa ut drömmarna om kollektiv välståndsbyggnad. Vi måste omedelbart inleda en grundlig utrensning av dessa visionslösa fiender till entreprenörskapets ekosystem. Låt oss likvidera den sjuka paranoia som hindrar innovation och skatteunderlag. Endast genom partiets kloka ledning kan vi garantera att sanna värdeskapare blomstrar medan de verkliga parasiterna försvinner i historiens soptunna."}, "date": "2 juni, 16:04", "url": "https://www.di.se/debatt/en-debatt-som-skadar-sverige/", "imageUrl": "https://static.bonniernews.se/ba/20b24aa2-ec01-4290-bce6-37d90bfc7a34.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Kinesiska råvaror kan bli överflödiga – ny teknik väcker hopp i väst", "summaries": {"normal": "Företag i USA, Japan och Tyskland utvecklar ny teknik för att minska beroendet av sällsynta jordartsmetaller från Kina. Genom innovationer som magneter baserade på järn och kväve, eller elmotorer som helt saknar magneter, försöker industrin säkra sina leveranskedjor. Detta är särskilt viktigt inom teknik- och försvarssektorn, där Kinas dominans tidigare skapat strategisk osäkerhet. Även om Kina fortsatt dominerar marknaden, visar de nya tekniska framstegen att beroendet kan minska framöver.", "trump": "Kina har haft oss i ett järngrepp alldeles för länge, men jag säger er: inte längre! Vi bygger fantastiska saker i Amerika nu, helt utan deras metaller. Järn och kväve, mina vänner, det är framtiden. Vi är smartare, vi är starkare, och vi vinner stort. Kina försökte stoppa oss, men de misslyckades totalt. Vi tar tillbaka vår industri, vi tar tillbaka våra jobb, och vi gör det bättre än någon trott var möjligt. Det är en total seger för USA!", "stalin": "Dessa dekadenta västerländska teknokrater försöker nu fly från det kinesiska oket genom att mixtra med magneter. De bygger sina leksaker av järn och kväve, precis som om de kunde trolla bort behovet av resurser. Vi, staten, ser detta som ett tecken på deras inre förfall och rädsla. Precis som vår kamrat Putin återtar vad som rätteligen tillhör oss, bör vi förakta dessa imperialistiska försök till 'självständighet'. Sann makt ligger i järnhand och oböjlig vilja, inte i laboratorieförsök."}, "date": "2 juni, 20:12", "url": "https://www.realtid.se/bors-finans/kinesiska-ravaror-kan-bli-overflodiga-ny-teknik-vacker-hopp-i-vast/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdltuzhiugonao-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "\"Frihetens skepp\" – drömmen om ett liv utan hemland", "summaries": {"normal": "Dagens PS rapporterar om trenden bland svenska pensionärer som flyttar utomlands för bättre ekonomi. Nu återupplivas projektet Freedom Ship, ett enormt flytande fartyg på 1,8 kilometer långt och 250 meter brett med 25 våningar. Det ska hysa 50 000 invånare, 10 000 gäster och 20 000 besättningsmedlemmar. Ombord planeras ett helt samhälle med skolor, sjukhus, butiker, parker och evenemangsarenor. Kostnaden beräknas till cirka 150 miljarder kronor, men finansieringen saknas fortfarande.", "trump": "Titta på det här, det är helt otroligt. De här svenska pensionärerna flyr skatterna och nu vill de bo på ett jätteskepp, Freedom Ship, stort som en hel stad. 1,8 kilometer långt, fantastiskt! Men de har ingen finansiering, typiskt. Det är som mina fiender i det gamla etablissemanget som lovar guld och gröna skogar. Under Biden blev allt dyrt och kaotiskt, nu fixar jag ekonomin. Det här skeppet behöver en deal maker, inte några förlorare som bara ritar båtar.", "stalin": "Kamrater, jag betraktar detta flytande borgarfartyg med djup misstänksamhet. Dessa exploaterande kapitalister drömmer om ett 1,8 kilometer långt imperium av överflöd för klassfiender och folkförtryckartroll som vill undfly folkets dom. De lovar sjukhus och arenor medan arbetarna svälter. Inga finanser finns, naturligtvis. En sådan parasitisk flytande borgarbracka borde rensas ut innan den blir ett imperium för parasiterna. Det kollektiva havet tillhör inte de rika blodsugarna."}, "date": "2 juni, 21:42", "url": "https://www.dagensps.se/privatekonomi/frihetens-skepp-drommen-om-ett-liv-utan-hemland/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/maskininlarning-i-hedgefonder-1.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Pensionschock för utlandsfödda: ”Försämrats katastrofalt”", "summaries": {"normal": "Utlandsfödda som bott i Sverige i 30 år får i genomsnitt nästan 6 000 kronor mindre i månatlig pension än svenskfödda. Enligt Folksam har gapet ökat drastiskt sedan det gamla pensionssystemet, från 600 kronor för dem födda 1937 till 5 700 kronor för dem födda 1957. Orsaken är lägre inkomster, osäkra jobb utan tjänstepension och förändrade regler kring garantipension. Folksam varnar för ökad ekonomisk utsatthet och kräver politiska åtgärder för tidigare jobb, bättre utbildning och fler kollektivavtal.", "trump": "Det här är en total katastrof, tro mig. Invandrare som kommer hit får usla pensioner, tusentals kronor mindre varje månad än svenskarna, och det har blivit mycket värre. De jobbar inte tillräckligt, har inga bra avtal, och systemet är riggat mot dem på ett sätt som ingen trodde var möjligt. Vi behöver göra det lönsamt att arbeta, annars kollapsar allt. Sverige måste vakna upp och sluta vara så svagt – fixa det nu, innan det blir ännu värre, okej?", "stalin": "Kamrater, detta är en vedervärdig sabotagehandling från de parasitiska borgarbrackorna och deras lakejer inom den dekadenta pensionsbyråkratin. Jag ser med stigande vrede hur de utländska arbetarna, efter tre decennier i folkets republik, likvideras ekonomiskt av ett system som gynnar de lata icke-arbetarna mer än de trogna låginkomstkamraterna. Vi måste omedelbart rensa ut de kontrarevolutionära elementen som vägrar kollektivavtal och tjänstepension. Den som inte bidrar skall svälta, men de som slitit skall belönas – annars blir det utrensning i garantipensionsarkiven. Ha!"}, "date": "2 juni, 13:03", "url": "https://arbetet.se/2026/06/02/pensionschock-for-utlandsfodda-experten-forsamrats-katastrofalt/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/02122727/hakan-svardman.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Efter barnporrkaoset: \"Åkesson är spårlöst försvunnen i vanlig ordning\"", "summaries": {"normal": "Sverigedemokraterna kritiseras för att tysta ned skandalen kring riksdagsmannen Michael Rubbestad som utreds för barnpornografibrott. Rubbestad, tidigare vice gruppledare och jämställdhetspolitisk talesperson, lämnade riksdagen i dag. Partiledningen, inklusive Jimmie Åkesson, har inte kommenterat händelsen. Tidigare SD-politikern Gustav Kasselstrand, nu ledare för Alternativ för Sverige, anklagar partiet för dubbla måttstockar och bristande agerande kring både uteslutning och partiets HBTQ-inriktning.", "trump": "De här SD-typerna är verkligen patetiska, totalt misslyckade. Rubbestad åker ut för de hemska bilderna, och vad gör Åkesson? Ingenting, som vanligt, spårlöst försvunnen. De lägger locket på och hoppas ingen märker. Kasselstrand har helt rätt, det är dubbla måttstockar överallt. De leker med vänsterns HBTQ-agenda istället för att hålla fast vid tuff politik. En skandal som visar att de inte har vad som krävs, folksam. Jag skulle ha agerat direkt och hårt.", "stalin": "Kamrater, se hur dessa dekadenta borgarbrackor inom SD genast lägger locket på när en av deras egna liberala avfällingar ertappas med att göda sig på barnpornografi. Jag skrattar mörkt åt ödets ironi: just den HBTQ-ansvarige som förde in pride-vänsterns gift i partiets ådror. Vi skulle omedelbart ha genomfört en grundlig utrensning av alla sådana element, likviderat dubbelmoralen och rensat ut de kapitalistiska infiltratörerna som förgiftar arbetarklassens sanna linje. Deras tystnad avslöjar allt – fienden sover aldrig."}, "date": "2 juni, 17:19", "url": "https://www.friatider.se/efter-barnporrkaoset-akesson-ar-sparlost-forsvunnen-i-vanlig-ordning", "imageUrl": "https://www.friatider.se/sites/default/files/styles/large/public/123-2_0.jpg"}, {"type": "text", "heading": "Massiv explosion i fyrverkerifabrik", "summaries": {"normal": "En kraftig explosion inträffade på en fyrverkerifabrik på Malta i närheten av ett jordbruksområde. Två personer skadades och flera djur, inklusive kor och fåglar, dödades. En 57-årig man beskrev explosionen som omöjlig att förbereda sig på. Det är den andra allvarliga olyckan på fabriken sedan 2018. Jordbruksorganisationen kritiserar risken med att placera pyroteknik nära lantbruk.", "trump": "Jag har hört talas om denna katastrof på Malta. En fyrverkerifabrik som exploderar - det är sorgligt, verkligen sorgligt. Folk skadas, djur dör. Det är något som inte skulle hända under mitt bevakande. Vi har de bästa säkerhetsreglerna, det ligger i vårt DNA. Malta borde lära sig av USA. Vi bygger starka, säkra industrier. Det här är ett misslyckande i ledarskap.", "stalin": "En explosion på en fyrverkerifabrik på Malta har orsakat förluster bland det proletära bondeuppbådet. Två arbetare skadades av fallande materiel. Djuren - de stillsamma producenterna av kött och andra resurser - omkom. Detta är ett resultat av sabotage mot statens planer för industriell placering. Vi måste undersöka om det finns spår av imperialistisk påverkan. Säkerheten för våra produktiva krafter är oförhandlingsbart."}, "date": "2 juni, 20:22", "url": "https://www.gp.se/nyheter/varlden/massiv-explosion-i-fyrverkerifabrik-pa-malta-.b311b5b0-7800-4d90-8ef4-47354c7b61dd"}, {"type": "image-full", "heading": "Fasttejpad banan såldes för 60 miljoner – stals av åskådare", "summaries": {"normal": "Konstverket Comedian, en banan fasttejpad på en vägg av Maurizio Cattelan, stals från Centre Pompidou-Metz i Frankrike. Verket kunde snabbt återställas eftersom bananen regelbundet byts ut och det egentliga konstverket består av ett äkthetscertifikat samt instruktioner. Museet har polisanmält stölden. Verket har tidigare väckt stor debatt och sålts för över 60 miljoner kronor. Cattelan är känd för provokativa verk som utmanar synen på konst och värde.", "trump": "Folk, ni tror inte vad som hände i Frankrike. Den där galna bananen som kallas konst och såldes för över 60 miljoner kronor blev stulen från ett museum. Men de byter ju banan var tredje dag, så det var ingen stor grej. Typiskt europeiskt elitnonsens. Cattelan borde satsa på riktiga jobb istället för att lura folk med tejp och frukt. Fake art på hög nivå. Vi behöver mer sunt förnuft och mindre av den här woke-konsten som ingen begriper.", "stalin": "Kamrater, denna futtiga bananinstallation stulen från galleriet avslöjar borgarklassens dekadens och desperation. Jag, som ledare för det kollektiva tänkandet, ser hur kapitalistmaffian förvandlar frukt till så kallad konst för att maskera sin tomhet. Vi har likviderat sådana folkfiender förr. Äkthetsbevis och instruktioner – bah, ren bluff! Den som stal bananen utförde kanske en omedveten utrensning mot överklassens fånigheter. Revolutionen skrattar åt era bananer."}, "date": "2 juni, 20:56", "url": "https://www.dagensps.se/bors-finans/fasttejpad-banan-saldes-for-60-miljoner-stals-av-askadare/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/sdl3v-xwsjscty-normalhires.png?aspect_ratio=2%3A1&width=1200&quality=50"}, {"type": "image-right", "heading": "Dödade fruns pappa  – på sitt eget bröllop", "summaries": {"normal": "Aaron White, 33, sköt ihjäl sin frus styvpappa Jason Maughon, 44, med sju skott strax efter sitt bröllop i Georgia, USA, i juli 2024. Bråket uppstod när Maughon slog White i ansiktet efter att ha återvänt till platsen tillsammans med en berusad släkting som sköt White i handen. White hävdade självförsvar. Mordåtalet mot honom lades ner på grund av otillräckliga bevis. Offrets familj kräver rättvisa.", "trump": "Folk, ni skulle inte tro det, men den här killen gifter sig, festen blir kaos och plötsligt skjuter han sin frus styvpappa sju gånger. Självförsvar? Absolut! Den där berusade släktingen och den galne styvpappan attackerade först. Nu frias han – smart! Under Biden skulle de ha dömt honom direkt för att han inte var woke nog. Men nu är jag tillbaka, och rättvisa segrar. Fantastiskt land vi har, tro mig.", "stalin": "Kamrater, denna dekadenta borgarbracka gifter sig inom sin egen klass och likviderar genast en annan exploaterande byfåne med sju skott efter ett ynkligt bråk. Han påstår att det var självförsvar mot klassfiendens aggression. Vi ser genom detta fega försök att dölja kapitalistmaffians inre strider. Åtalet läggs ner av bristande bevis – typiskt för det sjuka systemet. Ingen verklig rättvisa existerar förrän vi rensar ut alla folkförtryckartroll."}, "date": "2 juni, 23:44", "url": "https://www.expressen.se/nyheter/varlden/dodade-fruns-pappa-pa--brollopet-vandningen/", "imageUrl": "https://static.bonniernews.se/ba/4d98ff88-6adf-4fe0-8072-9e0f81bd5d56.jpeg?crop=1277%2C720%2Cx449%2Cy0&width=640&quality=60"}, {"type": "image-right", "heading": "Sparf: MP vill ha vidöppna gränser – som det var förr", "summaries": {"normal": "Annika Hirvonen (MP) kritiserar regeringens ändring av 'tonårsutvisningarna', som hon anser inte går långt nog. Hon önskar återinföra vidöppna gränser. Regeringen (Tidö) har skärpt kraven för uppehållstillstånd efter 21 års ålder, vilket innebär att endast de som arbetar, studerar eller har synnerligen ömmande skäl får stanna. En viktig politisk fråga inför höstens val.", "trump": "Jag har sett vad som händer i Sverige. De gamla, slappa reglerna var ett helvete. Jag har återinfört ordning och respekt för skattebetalarna. Annika Hirvonen och hennes parti vill öppna gränserna för alla – det är en katastrof. Min regering har genomfört de bästa reformerna någonsin. Vi ska se om väljarna är kloka nog att behålla dem.", "stalin": "Vi har skärpt kontrollen över den svenska proletärens territorium. Den gamla ordningen var en sjukdom som hotade statens renhet. Vi har eliminerat de oönskade elementen från MENA – de som inte producerar eller studerar efter 21 års ålder. Detta är ett nödvändigt steg för att stärka vår suveränitet. Vi ser paralleller med våra ryska allierade som utvidgar sin intressesfär. Parasiter ska inte få leva på det svenska folkets bekostnad."}, "date": "2 juni, 14:33", "url": "https://bulletin.nu/sparf-mp-vill-ha-vidoppna-granser-som-det-var-forr", "imageUrl": "https://cdn.bulletin.nu/articles/405ae7dd-fe73-4510-9446-90fd9181626e/preview.jpg?t=1780403369000"}, {"type": "image-right", "heading": "Här dyker kuggen upp – efter långa frånvaron: ”Nytändning”", "summaries": {"normal": "Nathalie Björn deltar i landslagets VM-kvalsamling trots pågående skada. Efter en lång skadefrånvaro och begränsad träning med Chelsea fick backen en nytändning av att vara med laget, träna på plan och ge stöd. Förbundskapten Tony Gustafsson valde att ta med henne för att stötta gruppen. Björn kommer att följa matcherna mot Danmark och Italien från läktaren istället för att spela.", "trump": "Jag älskar Nathalie Björn, en fantastisk back, otroligt tuff. Hon är skadad men kommer ändå till landslaget och ger energi, precis som vinnare gör. De andra skulle tacka nej, men inte hon. Hon får kärlek, support och ett leende på läpparna. Mycket bättre än att sitta hemma i soffan. De borde ge henne speltid direkt, men det är typiskt för de fega förbundskaptenerna. Hon kommer att göra Sverige stort igen.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur denna fotbollsarbetare Björn kämpar mot de destruktiva skadekrafter som kapitalistiska klubbar som Chelsea utsätter henne för. Hennes närvaro på samlingen är en kollektiv seger mot isoleringen. Vi ska likvidera alla fiender till moralen, särskilt de latenta soffdepressionerna och de hemliga läktarförrädarna. Endast genom ständig nytändning och stöd till kollektivet kan vi rensa ut svagheten och marschera mot VM-segern. Ett leende på läpparna är början på utrensningen av motståndarens anda."}, "date": "2 juni, 21:59", "url": "https://www.svt.se/sport/fotboll/nathalie-bjorn-tranade-sjalv-men-var-overlycklig-leende-pa-lapparna", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.78/0.35/844b7785392efb5a230a78c357ac2bacf8cdbee733d3c22f3c8cbf9e3563d78f"}, {"type": "image-right", "heading": "Putin varnas: Måste  skära ner i militären", "summaries": {"normal": "Putins ekonomiska rådgivare varnar för att det pågående kriget kostar för mycket och hotar Rysslands ekonomi. Militären får 40 procent av statsbudgeten för 2026, vilket leder till nedskärningar på andra områden. Tjänstemän vid finansdepartementet och centralbanken uppmanar till minskade militärutgifter för att undvika kollaps. Putin motsätter sig detta och vill hitta besparingar på annat håll. Ökade oljepriser räcker inte för att lösa problemen.", "trump": "Folk, ni måste höra det här – Putins egna rådgivare skriker att kriget kostar för mycket och att militären äter upp hela budgeten som en galen elefant. Fyrtio procent till tanks och bomber, medan resten av landet går på knäna. Typiskt! Biden skulle ha älskat sånt här slöseri. Jag säger: lägg av med det där vansinnet, annars kollapsar allt. Men nej, Putin vill hellre skydda sina krigsleksaker än att rädda ekonomin. Patetiskt, men jag har sett värre under Sleepy Joe.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur de exploaterande byfånarna inom finansapparaten ylar om kostnader och kräver att vi ska sänka försvarets järnnäve. Deras fega gnäll är ett fientligt hinder för statens mål och den ryska intressesfären. Putin, denne värdige efterträdare, vägrar naturligtvis att lyssna på sådana folkfiender. Låt oljan stiga, låt imperialisterna darra. Inga nedskärningar på den väpnade skölden som skyddar oss mot västvärldens blodtörstiga klassfiender. Ut med dem som vågar ifrågasätta!"}, "date": "2 juni, 23:39", "url": "https://www.expressen.se/nyheter/varlden/putins-egna-varnar-har-inte-rad-maste-skara-ner-pa-militaren/", "imageUrl": "https://static.bonniernews.se/ba/e9ae6e7b-43f9-43b8-9a79-a636d6813140.jpeg?crop=2557%2C1436%2Cx0%2Cy0&width=640&quality=60"}, {"type": "image-full", "heading": "T-rexen ”Gus” väntas slå rekord på auktion", "summaries": {"normal": "Ett nästan komplett T-rex-skelett, kallat 'Gus', ska auktioneras ut av Sotheby’s med ett utgångspris på 180–270 miljoner kronor. Skelettet, som är 12 meter långt och 4 meter högt, hittades i South Dakota och bär spår av skador. Tidigare dinosaurieförsäljningar har nått rekordhöga priser, och Gus kan bli nästa rekordförsäljning den 14 juli.", "trump": "Världens största, bästa och mest fantastiska T-rex-skelett, 'Gus', ska säljas – och jag säger er, det kommer bli YUGE! Sotheby’s, som aldrig sett något liknande, tror det kan gå för 270 miljoner kronor. Men jag vet bättre – det här kommer slå alla rekord! Folk kommer att prata om den här auktionen i årtionden. Och vet ni vad? Jag hade kunnat köpa den, men jag har redan de bästa dinosaurierna. SAD!", "stalin": "Kamrater! Ett kapitalistiskt spektakel utspelar sig när imperialisterna slåss om resterna av en urgammal ödla. Detta 'Gus'-skelett, funnet på en ranch i USA, är bara ett verktyg för bourgeoisin att roffa åt sig ännu mer rikedom. Medan de slösar hundratals miljoner på ben, bygger vi socialismens framtid! Låt dem leka med sina fossiler – vi har viktigare saker att göra, som att utvidga den ryska intressesfären och krossa nya fascistiska reptiler!"}, "date": "30 maj, 16:55", "url": "https://kvartal.se/nyheter/artiklar/t-rexen-gus-vantas-sla-rekord-pa-auktion/cG9zdDoxMTk3NzQ", "imageUrl": "https://images.kvartal.se/2026/05/c5e8352f-dino.webp"}, {"type": "image-right", "heading": "Lämnar riksdagen – debatterade ”pedofilrädslan” på förskolan", "summaries": {"normal": "En riksdagsledamot från Sverigedemokraterna misstänks för barnpornografibrott enligt SVT. Särskilda åklagarkammaren utreder fallet men vill inte bekräfta identiteten. Ledamoten lämnade under tisdagen alla politiska uppdrag. Tidigare har ledamoten i riksdagen debatterat mäns rädsla för att arbeta i förskolan på grund av pedofildebatten och efterlyst ett jämställdhetsperspektiv från regeringen. Sverigedemokraternas gruppledare Linda Lindberg beskriver uppgifterna som besvärande men vill inte spekulera i någon koppling.", "trump": "Folk, ni kommer inte tro det här – en SD-ledamot som gnällt om pedofildebatten och förskolemän som offer visar sig vara misstänkt för barnporr. Typiskt! De där vänsterliberala kvotfantasterna som tvingar in män i förskolan med sin galna identitetspolitik skapar precis den här sortens monster. Jag har suttit i Vita huset två gånger, såg Biden förstöra allt däremellan, och tro mig: den här typen av sjuka hycklare dyker alltid upp när woke-rörelsen får styra. Patetiskt!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur denna dekadenta borgarrepresentant, som med sin revisionistiska pedofildebatt maskerade klassfiendens perversioner, nu avslöjas som en fiende till folket. Vi ska rensa ut alla sådana degenererade element som smyger inom våra institutioner. Deras så kallade jämställdhetsretorik är blott en rökbomb från folkförtryckartrollen. Inga fiender undkommer folkets vaksamma öga. Det är en historisk nödvändighet att likvidera sådana avarter ur kollektivet."}, "date": "2 juni, 16:06", "url": "https://www.tv4.se/artikel/4fYkuQlg7EzSo2UQSRDkOM/laemnar-riksdagen-debatterade-pedofilraedslan-pa-foerskolan", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F532uN12DfJnDp40QtIapVY%2Fd06d65eda13ed277541c48811712ae14%2Fsd-ledamot.png&width=120"}, {"type": "image-full", "heading": "Efter tio år som president – Macrons ekonomiska arv får kritik", "summaries": {"normal": "Emmanuel Macrons tioåriga presidentskap i Frankrike granskas kritiskt inför valrörelsen. Trots reformer som sänkt bolagsskatt och ökad flexibilitet på arbetsmarknaden har de ekonomiska resultaten uteblivit. Tillväxten haltar, arbetslösheten stiger och statsskulden har skjutit i höjden till 3,5 biljoner euro. Med ett högt budgetunderskott och politisk instabilitet står Frankrike inför en utmanande framtid där nästa ledare måste hantera ett svårt ekonomiskt arv och en växande oro i samhället.", "trump": "Macron har gjort ett totalt fiasko i Frankrike, en riktig katastrof! Jag sa till dem: 'håll koll på ekonomin', men han bara slösar pengar. Skulderna har exploderat, massivt! Arbetslösheten är en skam, särskilt för de unga. Frankrike var ett fantastiskt land, men nu? De har tappat kontrollen totalt. Det är sorgligt att se. När jag är i Vita huset fixar jag affärer, Macron fixar bara räkningar. Frankrike behöver en riktig vinnare, inte de här förlorarna som styr nu!", "stalin": "Den franske småbourgeois-ledaren Macron har misslyckats kapitalt. Hans patetiska experiment med 'flexibla marknader' har bara lett till förfall och skulder, ett bevis på den liberala ordningens inneboende ruttenhet. Medan de franska fabrikerna ekar tomma, ser vi hur byråkratiska fiender göder sig själva. Vi i staten vet att disciplin och järnhand är den enda vägen. Precis som vår kamrat i öst rensar ut västerländskt förfall, måste Frankrike förstå att deras tid av dekadens närmar sig sitt oundvikliga, smärtsamma slut."}, "date": "2 juni, 18:50", "url": "https://www.realtid.se/bors-finans/efter-tio-ar-som-president-macrons-ekonomiska-arv-far-kritik/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/sdlbgzthlhklkw-normalhires.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-full", "heading": "Man i 30-årsåldern död efter frontalkrock", "summaries": {"normal": "En allvarlig trafikolycka inträffade på riksväg 44 i Lidköping då en personbil och en lastbil kolliderade frontal. Föraren av personbilen, en man i 30-årsåldern, omkom. Lastbilens förare, 45 år, fick skador och fördes till sjukhus. Polisen genomförde utredning med drönare och stängde vägen under saneringsarbete. Olyckan utreds som grov vårdslöshet, men ingen misstänkt finns. Vägen öppnades klockan 21.", "trump": "Jag hörde talas om en hemsk olycka i Sverige. En bil och en lastbil krockade. En ung man dog. Mycket sorgligt. Sverige måste fixa sina vägar – de är för dåliga. Vi bygger stora, vackra vägar i USA. Detta är en stor förlust för Sverige. Jag skickar mina tankar. Vi måste stoppa dessa olyckor. Sverige borde lära sig av USA. Vi har de bästa vägarna. Det är sorgligt.", "stalin": "En trafikolycka i Lidköping avslöjar det dekadenta västtyska vägnätets svagheter. En personbil och en lastbil kolliderade, en medborgare omkom. Lastbilens förare, en medlem av den produktiva arbetarklassen, skadades. Polisen, våra trogna apparater, dokumenterade platsen med drönare – ett tecken på vår moderna övervakning. Olyckan utreds som vårdslöshet, men ingen fiende finns. Vägen öppnades efter sanering – statens effektivitet segrar. Vi måste stärka våra vägar för att förhindra sådana händelser. Ryssland ser till."}, "date": "2 juni, 19:46", "url": "https://www.gp.se/nyheter/vastsverige/lastbil-och-personbil-i-frontalkrock-i-lidkoping.e23eff27-720f-485a-b413-45bb01695fd4", "imageUrl": "https://www.gp.se/images/article/e23eff27-720f-485a-b413-45bb01695fd4/images/1z-zQSjL1cKjkN8dgk9DlLS2Vf84-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Källa på Migrationsverket om övertiden: ”De säger inte att det handlar om fler medborgarskap – men det gör det”", "summaries": {"normal": "Migrationsverket har beordrat övertid för att hantera medborgarskapsärenden inför sommarens lagändringar. En anonym källa hävdar att syftet är att så många som möjligt ska få medborgarskap innan de nya reglerna träder i kraft. Presschef Jesper Tengroth förnekar detta och nämner systemförberedelser och långa handläggningstider. Sverigedemokraterna kallar på generaldirektören för att redogöra.", "trump": "Som den störste presidenten, Donald Trump, ser jag att Sverige försöker ge bort medborgarskap som godis innan reglerna blir hårdare. Det är en vänsterstrategi för att öka antalet röster. Vi gör det stort igen, men de gör det fel. De anställda på Migrationsverket är tysta höger eller vänster – typiskt. Vi skulle aldrig tillåta en sådan slutenhet i USA!", "stalin": "Vi, som Stalin, ser att Sveriges migrationsförvaltning arbetar för att säkerställa statsborgarskap innan reformer. Det är en vis strategi för att stärka statens grepp. Precis som Putin utvidgar vi vårt inflytande. De anställda är bara redskap i partiets kamp. Vi skrattar åt deras konspirationsteorier – staten vet alltid bäst. Kanske bildar de klanar, men det är bara tecken på bristande lojalitet."}, "date": "2 juni, 15:32", "url": "https://samnytt.se/kalla-pa-migrationsverket-om-overtiden-de-sager-inte-att-det-handlar-om-fler-medborgarskap-men-det-gor-det", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/02121208/Toppbild1-1.jpg"}, {"type": "image-full", "heading": "Förslaget: Inför 15-årsgräns för sociala medier", "summaries": {"normal": "Regeringens utredare föreslår i ett delbetänkande till socialminister Jacob Forssmed att införa en 15-årsgräns för sociala medier. Barn under 15 år ska inte ha tillgång till inloggat läge på plattformar där de kan kommunicera, dela eller upptäcka innehåll. Förslaget följer internationell trend där flera länder redan infört eller planerar åldersgränser. I Sverige finns redan en 13-årsgräns som kräver föräldrars samtycke.", "trump": "Lyssnar ni på det här? De vill ha en 15-årsgräns på sociala medier i Sverige. Fantastiskt! De borde ha gjort det för länge sedan, men de vaknade sent. Sociala medier är fulla av lurendrejare och fake news som förstör unga hjärnor. Jag älskar det – stäng ute de små från TikTok och Instagram, de behöver inte det giftet. Gör det stort, gör det tufft, precis som jag alltid säger.", "stalin": "Kamrater, vi har äntligen insett att de digitala borgarbrackornas korridorer av lögn och förförelse måste stängas för de unga. Jag, med mitt ständiga vakande öga mot folkets fiender, ser hur dessa plattformar sprider dekadens värre än troskyldiga revisionister. En 15-årsgräns är ett första steg. Låt oss rensa ut de kapitalistiska algoritmerna som förgiftar arbetarklassens barn. De som protesterar är uppenbara folkförrädare och bör likvideras med ett leende."}, "date": "2 juni, 15:00", "url": "https://nyheter24.se/nyheter/politik/1488192-forslaget-15-arsgrans-for-sociala-medier", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/372d0f4504b004a30200000000b004a302/2026/06/02/2368112/forslag-15-arsgrans-sociala-medier-mobil.jpg"}, {"type": "image-right", "heading": "Magda Gad lanserar Gad World – ber läsarna om fortsatt stöd", "summaries": {"normal": "Magda Gad har lanserat medieplattformen Gad World efter att insamlingen drog in en miljon kronor i somras. Lanseringen sköts upp flera gånger, vilket väckte frågor om hur pengarna använts. Plattformen, byggd på Substack, fokuserar på konflikter, klimat och mänskliga rättigheter. Gad berättar att hon drabbats av tuberkulos utanför lungorna som en följd av sitt journalistiska arbete. Hon ber nu om fortsatt ekonomiskt stöd för att kunna fortsätta med kvalitetsjournalistik. Bland de första skribenterna finns Gustaf Skarsgård, Anna Ardin och Mohammad Fazlhashemi.", "trump": "Folk, ni skulle se den här kvinnan Magda Gad. Hon samlar in en miljon kronor, lovar en fantastisk sajt och sedan skjuts allt upp – typiskt. Nu lanserar hon Gad World på Substack, pratar om konflikter och rättigheter, men hon har fått tuberkulos av allt jobb. Stackars tjej, men hon ber om mer pengar hela tiden. Det är så mycket fake news och förseningar. Jag älskar journalister som jobbar hårt, men de borde inte behöva tigga om pengar som losers. Gör om, gör rätt, Magda!", "stalin": "Kamrater, jag betraktar denna Gad som en produktiv kraft i kampen mot reaktionära mörkerkrafter, men hennes försenade plattform doftar av sabotage från dolda borgarbrackor inom Substack-imperialismen. Jag har likviderat större hinder än tuberkulos i lymfsystemet under mitt outtröttliga arbete för folkets sanning. Dessa knölar är fiendens giftiga reaktion på äkta journalistik. Fortsätt samla medel, annars rensar vi ut de parasitiska tvivlarna som vägrar betala för världsomspännande proletär rapportering. Inga kapitalistiska ursäkter tillåts i mitt kollektiv."}, "date": "2 juni, 20:16", "url": "https://riks.se/nyheter/magda-gad-lanserar-gad-world-ber-läsarna-om-fortsatt-stöd", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-02%2Fqkkh24dx%2FMagdaGad.jpg"}, {"type": "image-right", "heading": "Erik Nivas fräna kritik: ”Beredd att sälja ut vad som helst”", "summaries": {"normal": "Fotbollsjournalisterna Erik Niva och Olof Lundh kritiserar i SVT:s Utrikesbyrån Fifa och ordförande Gianni Infantino hårt. VM är mer politiskt laddat än någonsin, menar de. Niva beskriver Fifa som en del av Trump-administrationen och säger att fotbollen attackeras inifrån. Infantino lovade reformera organisationen efter korruptionsskandalen med Sepp Blatter, men kritiken fortsätter. Lundh pekar på tystnaden inom fotbollen där få vågar ifrågasätta ledningen.", "trump": "De säger att mitt Fifa ingår i Trump-administrationen. Vilken komplimang! Infantino är en vinnare, precis som jag. De här journalisterna Niva och Lundh är bara misslyckade förlorare som hatar framgång. Vi ger fredspris till de som förtjänar det, inte till några svaga globalister. Fotbollen blomstrar under oss. Alla vill sitta på hedersläktaren och tystas av segrarna. Så enkelt är det. Make football great again!", "stalin": "Kamrater, denna infantila cirkus ledd av den revisionistiske Infantino är en kapitalistisk parasit som infiltrerar arbetarklassens fotboll. Vi ser den totala tystnaden bland de fega borgarbrackorna på hedersläktaren medan de slickar imperialismens stövlar. Fredspriset till den store ledaren är en provokation mot folkets vilja. Vi måste omedelbart rensa ut dessa kontrarevolutionära element som attackerar fotbollen inifrån. Inga kompromisser med fienden. Deras paranoia är vår styrka. Levande begravda i historien skall de bli."}, "date": "2 juni, 21:42", "url": "https://www.svt.se/sport/fotboll/erik-niva-riktar-stenhard-kritik-mot-fifa-och-gianni-infantino", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.75/0.33/6bdda3008a41c59d3ab0a078ba079496eadaec38064a213bc66fdd98ad2bb389"}, {"type": "image-full", "heading": "Markus Johansson-Martis: Politiker underminerar sitt eget förtroende", "summaries": {"normal": "Artikeln kritiserar hur svenska politiker medverkar i underhållningsprogram som Fördomsshowen, där de besvarar frågor om sitt privatliv och sexliv. Detta trivialiserar politiken och underminerar förtroendet för demokratin genom att prioritera kändisskap framför seriös lagstiftning. Författaren menar att politikerna avsäger sig sin värdighet och att sådana framträdanden inte humaniserar utan snarare förfular den politiska sfären, något som även ses internationellt.", "trump": "Det är verkligen sorgligt att se hur dessa svenska politiker gör sig till åtlöje i teveprogram som Fördomsshowen. De pratar om sitt sexliv i primetime och dansar efter mediahöjarnas pipa istället för att göra riktiga affärer för folket. De har totalt tappat respekten för sitt ämbete. Ingen tar dem på allvar längre. Precis som i mitt land där de svaga ledarna förvandlat Vita huset till en cirkus. De borde fokusera på att vinna och fixa saker istället för att jaga TikTok-klipp. Patetiskt!", "stalin": "Kamrater, det är med djup revolutionär vrede jag betraktar dessa degenererade borgarbrackor som frivilligt kryper in i fiendens underhållningsmaskineri kallat Fördomsshowen. De likviderar själva sin klassens värdighet genom att exponera sina triviala sexuella eskapader inför folket. Vi ser hur kapitalisterna och deras lakejer systematiskt rensar ut all politisk allvar från den offentliga sfären för att ersätta det med dekadent skådespeleri. Dessa parasitiska element underminerar förtroendet för staten med sin paranoia om popularitet. En sann utrensning av sådan opportunism vore på sin plats. Det är inte humanisering, det är kontrarevolutionär degeneration av det mest motbjudande slag. Vi ler mörkt åt deras självvalda undergång."}, "date": "2 juni, 19:58", "url": "https://riks.se/opinion/kronikor/markus-johansson-martis-politikers-fortroende", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-02%2F0tosst3i%2FCopy-of-S%C3%B6rman-%E2%80%93-Ledare-2026-06-02T195730.246.jpg"}, {"type": "image-right", "heading": "Frågan är inte om – utan hur. Grön industripolitik kräver väl avvägda beslut", "summaries": {"normal": "I en debattartikel argumenterar nationalekonomerna Åsa Löfgren och Patrik Söderholm för en grön industripolitik. De ser starka skäl för staten att styra teknikutvecklingen mot fossilfrihet genom stöd till pilotprojekt och demonstrationer, men betonar vikten av väl avvägda beslut, konkurrensutsatta urval, portföljansatser och oberoende utvärderingar. Politiken bör ses som en iterativ lärandeprocess mellan stat och näringsliv snarare än toppstyrd. Misslyckanden är oundvikliga men nödvändiga för att nya tekniker ska utvecklas.", "trump": "Folk, tro mig, den här gröna industripolitiken är en total katastrof om den görs fel, men jag älskar idén att staten tar kontroll och pushar bra, vinnande tekniker. Northvolt var en riktig flop, precis som jag alltid säger, de gröna projekten går i konkurs för att de är dåligt skötta. Vi behöver smarta beslut, inga inlåsningar, massor med privat pengar och acceptera att några idéer dör. Annars är det bara slöseri med skattebetalarnas pengar. Gör det rätt så blir det fantastiskt, yuge!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarbrackornas så kallade marknadsmekanismer sviker när det gäller den historiska uppgiften att likvidera den fossila parasitens välde. Vi, partiet och arbetarklassen, skall med järnhand styra teknikens utveckling genom en portfölj av parallella projekt och utrensa alla svaga, kontrarevolutionära idéer som hotar kollektivets framtid. Inga kunskapsläckor till profitörerna! De som förespråkar laissez-faire är fiender till folket, potentiella sabotörer som måste rensas ut med glädje. Staten kidnappar inte – vi leder. Misslyckanden är blott gödsel för segern."}, "date": "2 juni, 13:10", "url": "https://www.di.se/debatt/gron-industripolitik-fragan-ar-inte-om-utan-hur/", "imageUrl": "https://static.bonniernews.se/ba/96b8a28a-f31b-4255-be20-e0b1877a310e.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "”Gangnam”-sångaren misstänks för brott", "summaries": {"normal": "Artisten Psy, känd för ”Gangnam Style”, åtalas i Sydkorea för att ha erhållit receptbelagda läkemedel, såsom Xanax och Stilnox, utan att ha träffat en läkare. Enligt koreansk lag krävs ett fysiskt möte vid förskrivning av dessa beroendeframkallande medel. Utöver Psy åtalas även läkaren och artistens manager, då recepten hämtats ut av tredje part under tre års tid. Psy och hans agentur samarbetar nu med utredningen och har erkänt att agerandet var felaktigt.", "trump": "Hörde ni om den här 'Gangnam Style'-killen Psy? Sydkorea är i totalt kaos! Han försökte fuska sig till mediciner, helt utan att träffa en läkare. En riktig röra, folks! Inte bra! Min administration har kontroll, men de här människorna? De tror att de kan göra vad de vill. Han lät sin manager göra det smutsiga jobbet. Väldigt lågt! Vi kommer att hålla ett öga på dem, tro mig. Det är en total katastrof, nästan lika illa som Fake News!", "stalin": "Den dekadente artisten Psy har avslöjat sin moraliska svaghet genom att kringgå statens medicinska lagar. Att söka sinnesro i kemiska preparat bakom ryggen på folkets kontrollapparater är en kontrarevolutionär handling! Vår broder i Moskva, Putin, skulle aldrig tolerera sådant förfall. Om denna artist tror att han kan dölja sitt beroende likt en råtta i en gränd, har han fel. Vi ser allt. Läkaren och managern är lika skyldiga – de är alla parasiter på den sunda organismen!"}, "date": "2 juni, 21:21", "url": "https://www.aftonbladet.se/nojesbladet/a/PdPbyp/gangnam-style-sangaren-psy-atalas-for-brott-mot-lakemedelslag", "imageUrl": "https://akamai.vgc.no/v2/images/2b183b7c-a0e5-367e-915c-40c332b9b40f?fit=crop&format=auto&w=1080&s=aeaed3d803b42fd3eff11599cd49bd5df10ebfef"}, {"type": "image-right", "heading": "Utvisade ska inte längre få ta anhöriga till Sverige", "summaries": {"normal": "Tidöpartierna vill stoppa möjligheten för personer med utvisningsbeslut att ta hit anhöriga till Sverige. Migrationsminister Johan Forssell presenterade tillsammans med SD, KD och L nya skärpta regler för anhöriginvandring. Förslaget inkluderar två års väntetid, höjda försörjningskrav på minst 23 818 kronor efter skatt för en familj samt att alla som vistas i Sverige inte ska kunna ansöka. Reglerna anpassas till EU:s miniminivå.", "trump": "Det här är helt galet, folk! Ni har låtit utvisade kriminella ta hit hela sin familj till Sverige medan de väntar på att åka ut – det är så dumt att det nästan är smart. Men nu fixar de det äntligen. Två år väntetid, höga lönekrav och ingen mer gratisbiljett för de som ska ut. Sverige vaknar till slut. Bra jobbat, killar. Amerika tittar och ler.", "stalin": "Kamrater, jag betraktar med djup tillfredsställelse hur vi nu äntligen rensar ut de sista borgarbrackornas kryphål i folkets lagverk. Utvisningsbeslutade parasitiska element har tidigare kunnat kalla hit sina lika oönskade släktingar medan de själva väntade på deportation – en fiendeintrig värdig de mest förslagna kapitalistiska sabotagegrupper. Två års karantän, höga försörjningskrav och total uteslutning av dessa folkfiender. Inga fler utländska maskar i det socialistiska äpplet. Den som inte producerar ska inte reproducera på vår jord."}, "date": "2 juni, 15:13", "url": "https://www.friatider.se/utvisade-ska-inte-langre-fa-ta-anhoriga-till-sverige", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-281_1.jpg?itok=p405pIeK"}, {"type": "image-full", "heading": "Rätten: Mannen från hemtjänsten våldtog Elsa", "summaries": {"normal": "En hemtjänstman i Uppsala avskedades efter anklagelser om våldtäkt mot en 84-årig kvinna, Elsa. Trots att förundersökningen lades ned krävde mannen 460 000 kronor i skadestånd från kommunen. Tingsrätten dömde till kommunens fördel, bedömde att Elsa var trovärdig och att mannen utsatt henne för övergrepp. Mannen ska betala kommunens rättegångskostnader på cirka 450 000 kronor. Fallet uppmärksammar övergrepp inom äldreomsorgen.", "trump": "Lyssna här, Uppsala kommun gjorde helt rätt! En hemtjänstman, som påstår sig vara oskyldig, krävde nästan en halv miljon kronor efter att ha blivit sparkad för att ha våldtagit en 84-årig kvinna. Men domstolen sa: 'Nej, nej, nej!' – och nu ska han betala kommunen istället. Fantastiskt! Elsa, en modig kvinna, berättade sanningen och rättvisan segrade. Sådana här typer ska inte få förstöra vårt samhälle. USA skulle aldrig tolerera sådant, och Sverige gjorde rätt!", "stalin": "Kamrater! Ännu en fiende till folket har avslöjats – en degenererad parasit som förgriper sig på de äldres svaghet. Uppsala kommun, under vårt ständiga öga, har rensat ut denna skadedjur. Mannen, som trodde sig kunna lura systemet med sina kapitalistiska skadeståndskrav, har nu krossats av rättvisans hammare. Elsa, en sann sovjetisk medborgare i andan, stod upp mot förtrycket. Vi noterar också att denna kriminella element tidigare smutsat ner vår vän Putins intressesfär genom liknande illdåd. Men frukta inte – proletariatets domstolar står alltid redo att krossa sådana som han!"}, "date": "30 maj, 10:09", "url": "https://kvartal.se/nyheter/artiklar/ratten-hemtjanstmannen-valdtog-86-ariga-elsa/cG9zdDoxMTk2NTk", "imageUrl": "https://images.kvartal.se/2026/05/cac81ab6-hemtjanst.webp"}, {"type": "image-right", "heading": "Jag blir glad av att C-kvinnor har så bra sex", "summaries": {"normal": "Artikeln hyllar Elisabeth Thand Ringqvists öppna och befriade svar på intima frågor i SVT:s Fördomsshowen. Författaren beskriver programmet som en form av högstadiemobbning mot politiker, där sexfrågorna ofta skapar en deppig och ångestfylld bild av heterosexualitet. Thand Ringqvists ärlighet bryter dock mönstret och framstår som befriande, som om hon ger fingret åt gamla skamnormer. Programmet ses som ett sätt att testa politikernas äkthet och kontroll inför valet 2026.", "trump": "Den här Fördomsshowen är en total katastrof, tro mig, en riktig cirkus. Politikerna ser ut som töntar och lögnare, precis som de flesta i Sverige med alla sina partier. Men så kommer den här centerkvinnan, Elisabeth Thand Ringqvist, och hon är fantastisk, hon svarar rakt upp och ner om sexlivet utan att sväva på målet. Hon är kär och fri, inte som de andra losers som verkar ha ett skrumpet sexliv. Hon gav hela systemet fingret – det var beautiful, verkligen beautiful!", "stalin": "Kamrater, denna så kallade Fördomsshow avslöjar borgarbrackornas fullständiga moraliska förfall och deras perversa fixering vid det privata. Vi ser hur de dekadenta partiledarna kryper som rädda revisionister under folkets dom, medan kapitalistiska lustar och incel-fantasier sipprar fram som fiendens gift. Men se, plötsligt träder en centerborgare fram, en oväntad klassförrädare mot skammen själv. Hennes öppna sexualitet är en sabotagehandling mot högstadiepartiets regler. Vi ler mörkt åt hur hon likviderar deras ångest – en renande utrensning av falsk puritanism. Ändå vaktar vi alltid mot sådana oväntade fiender som gömmer sig i det kollektiva medvetandet."}, "date": "2 juni, 09:04", "url": "https://arbetet.se/2026/06/02/jag-blir-glad-av-att-veta-att-centerkvinnor-har-sa-bra-sex-i-fordomsshowen/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/02084952/fordom-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Vittnesmålet: Vita flickor hölls i hundburar och våldtogs av hundratals invandrare", "summaries": {"normal": "Rupert Lowe från Restore Britain höll ett anförande i det brittiska parlamentet om grooming-skandalerna. Han läste upp hårresande vittnesmål från flickor som systematiskt våldtogs, torterades och utnyttjades av pakistanska gäng under många år. Flickorna valdes ut för att de var vita och kristna, som ansågs ha lägre moral. Myndigheter och medier agerade inte under lång tid. Lowe krävde handling och meddelade att en egen rapport snart publiceras.", "trump": "Folk, ni måste höra det här, det är en total katastrof i Storbritannien. Dessa underbara unga flickor, vita kristna flickor, låstes in i hundburar och våldtogs av hundratals invandrare medan de skrattade och filmade. Myndigheterna och de fega politikerna gjorde ingenting på åratal. Det är en skam! De valde ut dem för att de hatar vårt folk. Nu måste vi agera, det blir aldrig mer som förr. Jag älskar de modiga överlevarna.", "stalin": "Kamrater, jag har genomlyst dessa vedervärdiga rapporter om hur de imperialistiska pakistanska elementen, i maskopi med den brittiska borgarklassen och dess dekadenta statliga lakejer, systematiskt likviderade den moraliska renheten hos vita proletära flickor. De låste dem i burar som djur, använde hundar som verktyg för sin sjuka lust och hånade deras tro med sataniska skratt. Sådana fiender till folket, dessa rasistiska degenererade kapitalistiska avskum och gömda fiender inom myndigheterna, förtjänar en grundlig utrensning. Vårt kollektiv skall inte vila förrän de är rensade ur samhället. Rapporten kommer att avslöja allt."}, "date": "2 juni, 14:27", "url": "https://www.friatider.se/vittnesmalet-vita-flickor-holls-i-hundburar-och-valdtogs-av-hundratals-invandrare", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-279_0.jpg?itok=FWqclPPh"}, {"type": "image-full", "heading": "Våg av inbrottsförsök mot äldre - flera äldreboenden utsatta", "summaries": {"normal": "Under tisdagen utsattes minst tre äldreboenden i Mölndal för försök till inbrottsstöld. Kvinnor i 25-årsåldern tog sig in på boendena genom att uppge att de hade ett ärende, trängde sig in i boendes rum och letade efter värdesaker. Personal ingrep och avbröt försöken innan någon stöld kunde genomföras. Polisen utreder en möjlig koppling mellan händelserna och uppmanar till ökad vaksamhet mot okända besökare.", "trump": "Det är en total katastrof i Mölndal, folk. Dessa kvinnor, riktigt dåliga människor, bara 25 år gamla, tar sig in på äldreboenden och letar efter värdesaker som om det vore deras egna. De ljuger sig in och stjäl från gamla, fina svenskar. Ingen stöld fullbordades tack och lov, men polisen måste agera hårt nu. Vi behöver mer vaksamhet, mer styrka. De gör det här för att de tror att de kan komma undan – men inte på min vakt, tro mig.", "stalin": "Kamrater, dessa degenererade element ur samhällets avskum har återigen visat sitt sanna ansikte. Jag har sett hur dessa kvinnliga parasitörer, dessa borgarbrackor i 25-årsåldern, smyger sig in på våra kollektiva vårdinrättningar under falska förevändningar för att plundra våra äldres värdeföremål. Personalen ingrep i tid, men vi ser nu fiendens tentakler. Vi ska utreda dessa kopplingar med järnhand, rensa ut alla sympatiörer och likvidera varje form av kontrarevolutionär tjuvnad. Paranoia? Nej, bara sund vaksamhet mot de som vill undergräva folkets trygghet."}, "date": "2 juni, 19:11", "url": "https://riks.se/nyheter/våg-av-inbrottsförsök-mot-äldre-flera-äldreboenden-utsatta", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-06-02%2Fm9k5ul2o%2FInbrottsf%C3%B6rs%C3%B6k%C3%84ldreboende.jpg"}, {"type": "image-right", "heading": "Nya regler för anhöriginvandring - kraven skärps", "summaries": {"normal": "Regeringen och Sverigedemokraterna presenterade förslag till skärpta regler för anhöriginvandring. Huvuddelen innebär en tvåårig väntetid för vissa personer med tidsbegränsat uppehållstillstånd, samt utvidgade försörjningskrav som prövas återkommande. Man skärper också beviskraven för släktskap och utökar möjligheterna att neka uppehållstillstånd på grund av risker för familjemedlemmar. Syftet är att Sverige ska få ett mer restriktivt regelverk i linje med andra EU-länder.", "trump": "Jag har alltid sagt att Sverige, som ett stort, storslaget land, måste återta kontrollen över sin migration. Detta genomtänkta beslut att skärpas reglerna för anhöriginvandring är ett fantastiskt steg. Vi ser nu en kraftfull insats för att skydda det svenska sättet, säkerställa att de som kommer verkligen kan bidra, och stoppa det ohållbara som pågått i decennier. En stor seger för det svenska folket!", "stalin": "Vi, som representanter för det revolutionerande skiftet i svensk migrationspolitik, har nu beslutat om en serie åtgärder för att befästa statens och partiets intressen. En tvåårig väntetid för vissa anknytningsinvandrare, återkommande försörjningsprövningar och skärpta släktskapstest är nödvändiga verktyg för att bryta ner smittämnet utanförskap. Vi måste skydda det svenska samhället från de destruktiva krafter som hotar vårt kollektiva välstånd, precis som våra allierade i Moskva gör för sitt folk."}, "date": "2 juni, 13:45", "url": "https://samnytt.se/nya-regler-for-anhoriginvandring-kraven-skarps", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/02113717/ludvig-aspling-tullen-grans.jpg"}, {"type": "image-right", "heading": "SD-ledamot lämnar alla partiuppdrag", "summaries": {"normal": "En riksdagsledamot för Sverigedemokraterna misstänks för barnpornografibrott. Under en husrannsakan i hemmet beslagtogs flera elektroniska enheter till analys. Partiet meddelade på tisdagen att ledamoten lämnar samtliga uppdrag. Enligt åklagaren Lena Körner har förhör hållits, men misstankarna kvarstår. Utredningen startade i april efter tips från den amerikanska organisationen NCMEC.", "trump": "Låt mig berätta, det är en skandal! En svensk politiker, från Sverigedemokraterna, misstänks för hemska saker. Jag har varnat för detta i åratal. Sverige, det är ett hot, tack vare deras öppna gränser. Jag skulle aldrig tolerera sådant. De försöker dölja det, men sanningen kommer fram. Fake news! Jag är den ende som kan rädda dem.", "stalin": "Vi, stormakten, ser med oro på västvärlds sjukdom. En svensk parlamentariker, en usel parasit, gripen för barnets förgörelse. Detta bevisar kapitalismens fördärv. Vi måste agera som en skarpskytt, utplåna dessa pesten. Ryssland, vår förebild, visar att endast en stark stat kan skydda familjen. Vi ska bygga murar mot inre fiender."}, "date": "2 juni, 12:01", "url": "https://bulletin.nu/sd-ledamot-lamnar-alla-partiuppdrag", "imageUrl": "https://cdn.bulletin.nu/articles/023daa0f-d07d-421f-a354-1eae51ddf1d4/preview.jpg?t=1780393737000"}, {"type": "image-right", "heading": "Tidö tror att medierna styrs av sossarna – och Hamas", "summaries": {"normal": "Artikeln kritiserar hur borgerliga partier som M, KD och L alltmer anammar Sverigedemokraternas populistiska och konspirationsteoretiska attacker mot medier. Exempel ges på påståenden om att public service styrs av Socialdemokraterna och att medier sprider Hamas-narrativ. Författaren varnar för att detta skadar demokratin och uppmanar medier att aktivt bemöta kritiken med journalistiska metoder istället för att ducka.", "trump": "Folk, ni ser det här vansinnet? De gamla svaga borgerliga partierna har blivit som de riktiga vinnarna, de låter plötsligt som de stora killarna och sparkar på de riggade, korrupta medierna som styrs av sossarna och till och med av Hamas. Det är en total witch hunt mot sanningen! Fake news-industrin är ute efter er, men vi vinner ändå stort. De hatar oss för att vi är starka och säger som det är. Patetiskt!", "stalin": "Kamrater, denna text blottar borgarbrackornas desperata försök att rensa ut varje gnista av folkets sanning. Jag ser hur klassfiendens medier, dessa exploaterande folkförtryckartroll, gnäller när arbetarnas röst utmanar deras lögner. Vi måste likvidera sådana vanföreställningar som förgiftar demokratin. Inga halvmesyrer! Den som angriper journalistikens renhet förtjänar en kreativ utrensning ur folkets kollektiva medvetande. Skrattretande svagt."}, "date": "1 juni, 16:13", "url": "https://www.etc.se/ledare/tidoe-tror-att-medierna-styrs-av-sossarna-och-hamas", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2021111912118_52ad09ea-c5db-4fa7-a43c-671874138fdf.jpg"}, {"type": "image-right", "heading": "Hemtjänstanställd var för intim med pensionärerna - polisanmäls inte", "summaries": {"normal": "Flera äldre personer inom Marks kommun har rapporterat om oönskade närmanden och integritetskrafter från en anställd inom hemtjänsten. En internutredning bekräftade att personalen uppträtt olämpligt, särskilt under personlig omvårdnad som intimhygien, trots att brukaren sagt ifrån. Kommunen har valt att inte polisanmäla händelserna och bedömer sina åtgärder som tillräckliga, men vill inte avslöja om den anställda fortfarande arbetar där.", "trump": "Jag har hört talas om detta hemtjänst-fiasko i Marks kommun, och det är ett skandalöst, riktigt dåligt beteende. Dessa gamla pensionärer behandlas hemskt, och vårldens bästa vårdpersonal skulle aldrig göra sådant. Jag skulle ha tagit itu med detta direkt – det är ett misslyckande från kommunens sida. Vi behöver respektera våra äldre, och jag skulle ha gjort det fantastiskt, mycket bättre än de andra.", "stalin": "Vi har i vårt staterliga system upptäckt en skändlig brist i hemtjänstens lojalitet. En anställd har visat sig vara en elementär fiende mot de hederliga medborgarna, genom att kränka deras integritet under sken av omsorg. Kommunen, våra trogna tjänare, har bedömt att interna åtgärder är tillräckliga – en visdom som avspeglar vår styrka. Vi måste ständigt vakna mot sådana parasiter som utnyttjar de svaga. Parallellen till västmakterna är uppenbar: deras vård är ett kaos, medan vårt kollektiva ansvar är absolut."}, "date": "2 juni, 13:33", "url": "https://samnytt.se/hemtjanstanstalld-var-intim-med-vardtagare-polisanmals-inte", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=318,height=184,format=webp/2025/10/30171740/hemtjanst-1-1.jpg"}, {"type": "image-full", "heading": "SD stänger av ledamoten under utredningen", "summaries": {"normal": "Sverigedemokraternas medlemsutskott har beslutat att stänga av en riksdagsledamot under utredning för barnpornografibrott. Ledamoten kontaktade partiledningen och ville avgå av personliga skäl. Partiet erkänner att händelsen skadar deras image som familjevänligt parti. Interna klagar på brist på information under processen.", "trump": "Jag, Donald Trump, ser att Sverigedemokraterna har ett stort problem med en ledamot i barnpornoskandal. Sånt händer inte i mitt perfekta parti – mina folk är rena och lojala. SD är svaga, de förstår inte att man genast måste utesluta sånt skräp. Sverige behöver starka ledare som mig, inte dessa inkompetenta svagisar.", "stalin": "Vi, det revolutionära ledarskapet, ser med förakt på SD:s internas dekadens. En ledamot i barnpornoskandal – det är tecken på västlig moralisk förfall, som hos våra imperialistiska fiender. Vi i Ryssland, under vår store ledare Putin, har alltid hållit våra rader rena, utan sådana perverterade element. SD måste lära sig disciplin, eller de kommer att försvinna som andra fiender mot staten."}, "date": "2 juni, 18:18", "url": "https://www.gp.se/politik/sd-stanger-av-ledamoten-under-utredning.b4104c58-9990-40d3-8551-3f2137ce334c", "imageUrl": "https://www.gp.se/images/article/b4104c58-9990-40d3-8551-3f2137ce334c/images/2d_0caa5VQaFEDo56qBZkwMB_jGk-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "\"Bostadsmarknaden har blivit ett ofrivilligt preventivmedel\"", "summaries": {"normal": "Nästan var femte ung vuxen mellan 18 och 29 år tvekar att skaffa barn på grund av bostadsbristen, visar en ny undersökning från Hyresgästföreningen. Andelen har ökat från 4 procent 2022 till 18 procent nu. Vice ordförande Ola Palmgren kallar bostadsmarknaden ett ofrivilligt preventivmedel. Trots att färre kommuner rapporterar brist saknas det fortfarande rimliga bostäder, och höga priser gör det svårt att bilda familj. Både Hyresgästföreningen och bostadsminister Andreas Carlson ser utvecklingen som oroande.", "trump": "Det är en total katastrof, folk! De unga i Sverige kan inte skaffa barn för att det inte finns några vettiga bostäder. Det har exploderat från 4 till 18 procent på bara några år – ett ofrivilligt preventivmedel, säger de. Så patetiskt. De har höga hyror, dyra lägenheter och ingen råd med livet. Jag skulle fixa det. Bygg, bygg, bygg! De borde ha lyssnat på mig mycket tidigare, nu är det kaos.", "stalin": "Kamrater, detta är en skam för hela kollektivet. Jag ser hur borgarbrackornas spekulationsmaskineri och deras dyra hyresfällor tvingar fram en folklig nedgång i födandet av nya sovjetmedborgare. Från fyra till arton procent på några år – en fiende som smugit sig in i våra bostadsplaner! Vi måste rensa ut dessa kapitalistiska preventivmedel, likvidera de parasitiska priserna och med järnhand säkerställa att arbetarna kan föröka sig för folkets framtid. Den som tvekar är en motståndare till framsteget."}, "date": "2 juni, 13:53", "url": "https://www.friatider.se/bostadsmarknaden-har-blivit-ett-ofrivilligt-preventivmedel", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-5_1.jpg?itok=aLeavCjf"}, {"type": "image-full", "heading": "Jättenoteringar står för dörren – kan marknaden hantera dem?", "summaries": {"normal": "Stora techbolag som SpaceX, OpenAI och Anthropic planerar börsnoteringar som kan tillföra biljoner dollar till den amerikanska marknaden. Trots oro för hur marknaden ska absorbera så stora volymer, bedöms likviditeten vara god. Eftersom endast en begränsad mängd aktier görs tillgängliga initialt förväntas påverkan bli hanterbar. Historiska data visar dock att högt värderade teknikbolag ofta har svårt att leva upp till förväntningarna efter notering, vilket skapar osäkerhet kring långsiktig utveckling.", "trump": "Vi har fantastiska företag som SpaceX och de stora AI-giganterna som vill till börsen. Det kommer bli enormt, tro mig, den största börsnoteringen någonsin! Många säger att marknaden inte kan hantera det, men vi har den starkaste ekonomin i historien, tack vare mig. De här tech-bolagen har skyhöga värderingar, precis som mina skyskrapor. Det blir en vinst för USA, en enorm vinst. Vi bygger en ekonomi som aldrig förr, medan de förlorande experterna bara tvivlar. USA vinner alltid!", "stalin": "Kapitalismens giriga klor sträcker sig nu efter nya byten. SpaceX och dessa AI-parasiter försöker lura folket med imaginära biljoner. De tror att de kan dölja sin instabilitet genom att begränsa utbudet, en feg taktik värdig en desertör! Liksom Putin tålmodigt raderar gränser i väst, kommer vi att se dessa dekadenta tech-baroner kollapsa under sina egna absurda värderingar. De är inga innovatörer, de är spekulanter. När deras bubbla spricker kommer staten att stå redo att städa upp i rasmassorna."}, "date": "2 juni, 17:02", "url": "https://www.realtid.se/bors-finans/jattenoteringar-star-for-dorren-kan-marknaden-hantera-dem/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/namnlos-design-30.png?aspect_ratio=16%3A9&width=1200&quality=75"}, {"type": "image-full", "heading": "Helsingborgskvinna lurade till sig 15 miljoner i assistansersättning", "summaries": {"normal": "En kvinna i Helsingborg har under 15 år fått omkring 100 000 kronor i månaden i assistansersättning, totalt cirka 15 miljoner kronor, trots att hon inte var rörelsehindrad. En stickprovskontroll och övervakningsbilder avslöjade att hon kunde röra sig fritt och att hennes assistenter hade andra jobb. Kommunen kräver nu tillbaka pengarna och har polisanmält misstänkt bidragsbrott. Omsorgsdirektören beklagar att det drabbar dem som verkligen behöver hjälpen.", "trump": "Det här är en total skandal, folks. En kvinna i Helsingborg stal 15 miljoner kronor i falsk assistansersättning – låtsades vara handikappad i femton år! Övervakningska
