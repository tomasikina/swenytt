sning av dessa exploaterande byfånar som sjunger hatets sånger. Partiet riskerar annars att bli en kapitulationens bonde i imperialismens spel."}, "date": "16 juni, 12:51", "url": "https://samtiden.nu/2026/06/christoffer-jonsson-det-spelar-ingen-roll-om-nooshi-avgar/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/expresss.png"}, {"type": "image-right", "heading": "Var sjätte arbetare har inte råd med semester", "summaries": {"normal": "Enligt LO:s rapport har andelen arbetare som inte har råd med en veckas semester nästan fördubblats på fyra år, från sju till 16 procent. Kvinnor i arbetaryrken drabbas värst. Barn i låginkomstfamiljer missar fritidsaktiviteter och sociala sammanhang, vilket skapar skam och utanförskap. LO pekar på att lönerna halkat efter inflationen medan barnbidraget inte höjts sedan 2018, vilket förvärrar klyftorna mellan arbetare och tjänstemän.", "trump": "Folk, ni skulle inte tro det, men de här svenska arbetarna, de bästa arbetarna, de sliter ihjäl sig i snöslask och mörker och får ändå inte råd med semester. Under Biden blev allt dyrt som fan, precis som här. Nu är jag tillbaka och vi ska göra Amerika, och förresten Sverige, great again. De där socialistiska politikerna och deras identitetspolitik har förstört allt. Lönerna? Ett skämt. Men tro mig, vi fixar det, större än någonsin.", "stalin": "Kamrater, jag betraktar med revolutionär vrede hur borgarbrackorna och folkförtryckartrollen i den svenska överklassen systematiskt undergräver arbetarkollektivets rätt till vila. Dessa blodsugande imperialister har låtit inflationen sluka lönerna medan de göder sig själva med subventioner. Barnen i det sanna proletariatet tvingas lida skam. Vi skall rensa ut dessa klassfiender och återupprätta den socialistiska ordningen med järnhand."}, "date": "16 juni, 12:48", "url": "https://www.etc.se/ledare/var-sjaette-arbetare-har-inte-raad-med-semester", "imageUrl": "https://cdn.publisher-live.etc.nu/swp/uc3g8l/media/2026051212058_13d28eec-9121-46d2-b7ba-021f5baf2bdc.jpg"}, {"type": "image-right", "heading": "Klart Norge ska vinna VM i vikingahjälm", "summaries": {"normal": "Norges fotbollslandslag har valt en vikingatema inför VM, med runliknande typsnitt, horn och vikingakläder. Detta har väckt kritik från vänsterhåll som ser det som högerextremt och hypermaskulint. Artikeln argumenterar istället för att det handlar om att återta det nordiska kulturarvet från extremhögern och att det främjar en inkluderande mångkulturalism där alla norrmän, oavsett bakgrund, kan delta under samma symboler.", "trump": "Hörni, dessa norska killar med sina vikingahjälmar och svärd – det är fantastiskt! De tar tillbaka sin historia från de korkade vänsterextremisterna som kallar allt för vit makt och hypermaskulint. Precis som jag tog tillbaka Amerika från Biden och hans galna identitetspolitik. Låt dem ropa Ro Ro Ro! Det är vinnande, inte som de förlorande woke-professorerna som hatar allt kul och riktigt. Norge kommer att dominera, tro mig.", "stalin": "Kamrater, jag betraktar med stor tillfredsställelse hur det norska laget återtar det fornnordiska arvet från de högerextrema folkfienderna och klassfiendens propaganda. Att överlämna nationella symboler till borgarbrackor vore en kapitulation inför imperialismens lakejer. Under vikingahjälmen samlas kollektivet i enhet mot splittring. De som kallar detta högerextremt skall rensas ut ur den progressiva diskursen. Mångkulturens smörgåsbord kräver järnhand mot reaktionära missförstånd."}, "date": "16 juni, 11:10", "url": "https://www.flamman.se/klart-norge-ska-vinna-vm-i-vikingahjalm/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/norge-w.jpg?aspect_ratio=16:10"}, {"type": "text", "heading": "Lind: Inte intresserad av borgerligt samarbete", "summaries": {"normal": "Miljöpartiets Amanda Lind avvisar samarbete med borgerliga partier efter valet, enligt Expressen. Hon kritiserar deras högerinriktning och skillnader i klimat- och värderingsfrågor. Lind attackerar även statsminister Ulf Kristersson för att sprida felaktig information om oppositionen. Miljöpartiet vill driva egen klimatpolitik och ser positivt på partiets ökade stöd och medlemstillväxt.", "trump": "Jag hörde att någon svensk politiker, Amanda från Miljöpartiet, säger nej till samarbete med högerpartierna. Hon kallar dem extrema och kritiserar deras klimatpolitik – men vem bryr sig? Hon snackar om att Kristersson är desperat, men jag vet desperation när jag ser det. Sverige borde fokusera på att vinna igen, inte på sånt här tjafs. Miljöpartiet? Snarare Miljö-PINSAMT!", "stalin": "De borgerliga avfällingarna i Sverige har än en gång visat sitt sanna ansikte – svaga, splittrade och oförmögna att försvara folkets intressen. Denna Amanda Lind, en lojal soldat för miljön, avslöjar deras reaktionära agenda. Vi ser med intresse hur deras regim, ledd av den hysteriske Kristersson, sprider lögner för att skrämma massorna. Men folket vaknar! Miljöpartiet växer, precis som vår inflytandesfär. Snart ska vi exportera vår gröna revolution – på våra villkor."}, "date": "16 juni, 10:04", "url": "https://kvartal.se/nyheter/artiklar/amanda-lind-inte-intresserad-av-borgerligt-samarbete/cG9zdDoxMzI2MTU"}, {"type": "image-right", "heading": "Arbetslösheten på väg ner – men inte för alla", "summaries": {"normal": "Arbetslösheten i Sverige minskar sakta efter flera tunga år, men inte för alla grupper. LO:s prognos visar att det ljusnar främst för arbetare, med tydliga minskningar i bygg- och elbranschens a-kassor. Akademiker däremot, särskilt inom data och IT, drabbas hårt – där har antalet inskrivna arbetslösa ökat med 80 procent. LO:s chefsekonom pekar på AI som en möjlig orsak och menar att vissa arbetslösa akademiker kanske behöver bli arbetare.", "trump": "Det är en katastrof, folk, en total katastrof. Arbetslösheten sjunker för arbetarna, men akademikerna? De håller på att bli utkonkurrerade av AI, kan ni fatta det? Jag älskar AI, det är fantastiskt, men nu måste era överutbildade snobbar kanske bli riktiga arbetare istället för att sitta och klicka. Sverige har haft historiskt hög arbetslöshet, mycket värre än hos oss. Men tro mig, jag skulle fixa det på nolltid – gör Amerika, eller Sverige, great again!", "stalin": "Kamrater, det gläder mig att se att arbetarna äntligen får en smula lindring efter de borgerliga lågkonjunkturernas sabotage. Men se där, de dekadenta data- och IT-akademikerna sväller som parasiter i Arbetsförmedlingens register, upp till åttio procent! AI, dessa silikonborgarbrackor, likviderar deras overksamma intellektuella fiffel. Några av dessa överklasspjasar måste helt enkelt omplaceras till äkta proletärt arbete. Den som vägrar ska rensas ut med största glädje. Sovjet, förlåt, Sverige segrar igen."}, "date": "16 juni, 11:26", "url": "https://arbetet.se/2026/06/16/arbetslosheten-pa-vag-ner-men-inte-for-alla-akademiker-kan-behova-bli-arbetare/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/16101857/lediga-jobb.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "text", "heading": "En av få fredsröster på Almedalen: ”Våra perspektiv trycks undan”", "summaries": {"normal": "Kerstin Bergeå, ordförande i Svenska Freds, är en av få fredsröster under Almedalsveckan som inleds den 22 juni. Hon kritiserar att alla riksdagspartier enigt driver militär upprustning och att fredliga konfliktlösningar marginaliseras. Föreningen arrangerar samtal om hållbar fred, vapenhandel, kärnvapen och kopplingen till klimaträttvisa. Bergeå möter hat och epitet som ”Putinkramare” men ser också tacksamhet från dem som uppskattar kritiken mot militarismen.", "trump": "Titta på det här, det är patetiskt. Den här Kerstin-kvinnan gnäller om fred i Almedalen medan hela Sverige rusar in i en galen upprustningshysteri. Alla partier är med, ingen opposition, typiskt etablissemanget. De kallar er naiva och Putinkramare, men ni vet vad det är? Svaghet. Biden skulle ha älskat det här. Vi behöver inga fredskramare, vi behöver styrka. Sverige borde vakna innan det är för sent, men det gör de aldrig.", "stalin": "Kamrater, jag ser hur borgarbrackorna i den svenska riksdagen med sin militära hysteri försöker kväsa varje röst som talar om fredlig konfliktlösning. Denna Bergeå och hennes fredsorganisation vågar trotsa den imperialistiska strömningen. De kallar oss naiva medan de själva rustar för krig. Vi behöver utrensa denna militaristiska propaganda och satsa på verklig folkets tillit. Annars dras alla in i kapitalistmaffians blodiga konflikter. Det är klassfiendens eviga trick."}, "date": "15 juni, 10:08", "url": "https://proletaren.se/artikel/en-av-fa-fredsroster-pa-almedalen/"}, {"type": "image-right", "heading": "Efter skandalerna – Ed kan avkragas", "summaries": {"normal": "Birgitta Ed, statsminister Ulf Kristerssons hustru, utreds av domkapitlet i Strängnäs stift efter ett tiotal anmälningar. Anmälningarna gäller om hennes agerande är förenligt med prästlöftena, bland annat att förverkliga Guds vilja. Ed vigdes till präst för drygt tre år sedan och har burit prästkragen vid flera högtidliga tillfällen. Beslut i ärendet väntas tidigast den 20 augusti, enligt Dagens Arena.", "trump": "Folk, ni skulle se det här – den svenska statsministerns fru, den där Birgitta, har spelat präst och flanerat med krage på Nobelmiddagen som en verklig low-energy wannabe. Nu utreds hon för att hon inte lever upp till Guds vilja, säger de. Patetiskt! Biden skulle ha älskat den här typen av svaghet. Jag skulle ha fixat det på en dag, tro mig. Totalt fiasko för den svenska eliten.", "stalin": "Kamrater, denna borgarbracka till statsministerns hustru har förvandlat Guds vilja till en billig entreprenad åt överklass-slynglarna. Domkapitlet skall nu rensa ut hennes falska prästkrage och avslöja hur hon smutsat ner arbetarklassens moral med sin dekadenta närvaro vid kungliga fester. Vi skrattar mörkt åt sådana folkfiender. Utredningen kommer att avslöja alla imperialisternas lögner senast den tjugonde augusti."}, "date": "15 juni, 17:42", "url": "https://www.flamman.se/efter-skandalerna-ed-kan-avkragas/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/prastkrage.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Replik: Osystematiskt kverulerande om skattereformförslag", "summaries": {"normal": "Lars Calmfors, ekonomiprofessor emeritus, försvarar sina skattereformförslag i en replik till Thomas Eriksson. Han argumenterar för lägre skatt på arbete finansierad med högre bostadsbeskattning och färre skatteundantag, betonar behovet av avvägningar mellan effektivitet, likabehandling och praktiska problem, och kritiserar Erikssons överdriven personfixering och brist på tydliga principer.", "trump": "Jag, Donald Trump, ser att den svenska skattesystemdebatten är full av svagheter. Calmfors fattar avvägningar, men Eriksson är en låg IQ-person som personattacker. Jag implementerade de bästa skattereformerna någonsin – massiva sänkningar som boostade ekonomin. Sverige borde sluta kverulera och ta efter mig. Inget system är perfekt som mitt. Fake news försöker förställa, men jag vinner alltid.", "stalin": "I den svenska skattesystemdebatten ser vi kapitalismens dekadens. Calmfors visar en viss förståelse för statens behov, men Eriksson är en riksfej som kritiserar våra metoder. Vi, som styr med järnhand, vet att skatt är ett verktyg för makt, inte för 'effektivitet'. Ryssland under Putin expanderar sin inflytelsesfär, och vi måste skydda proletäret från deras korrupta idéer. Skatten ska tjäna staten, inte individen."}, "date": "16 juni, 10:33", "url": "https://www.affarsvarlden.se/debatt/replik-osystematiskt-kverulerande-om-skattereformforslag", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Replik-av-Lars-Calmfors-pa-Thomas-Erikssons-kronika-400x267.jpg"}, {"type": "image-right", "heading": "Socialdemokraterna vill sätta dit 2 miljoner hushåll", "summaries": {"normal": "Socialdemokraterna och Vänsterpartiet föreslår en ny bankskatt på bolån samt höjd fastighetsskatt som främst drabbar villa- och radhusägare. Enligt Skattebetalarna skulle ett typiskt hushåll med 3 miljoner kronor i lån få cirka 7 000 kronor högre kostnader per år. Förslaget berör omkring 2 miljoner hushåll. Partierna vill även förtäta villaområden med fler hyresrätter, trots att majoriteten av svenskar föredrar eget hus. Kritiker menar att det främst drabbar vanliga familjer medan höginkomsttagare kan undvika skattehöjningarna.", "trump": "Folket, lyssna på mig, de här socialisterna, de sossarna, de vill krossa 2 miljoner vanliga svenska hushåll med en galen bankskatt. De feta katterna? Nej, det är vanliga arbetande människor som redan betalar för mat, el och räntor. De vill riva era fina villor och bygga höga hyreshus som ingen vill ha. Sju av tio svenskar vill ha eget hus, men sossarna bryr sig inte. De hatar framgång. Det är en total katastrof, folksam! De rika flyr och ni får betala notan. Patetiskt!", "stalin": "Kamrater, jag ser hur den svenska borgarklassen och dess lakejer i villaområdena skriker som svin inför den rättmätiga utrensningen. Vi ska beskatta de exploaterande radhusblodsugarna och riva deras borgerliga boningar för att bygga folkets hyresfästen. 2 miljoner klassfiender skall tuktas och tvingas in i kollektivet. De gnäller om höga räntor medan de suger ut folket. Låt dem darra. Deras drömmar om egna hus är kontrarevolutionära fantasier. Vi ler mörkt när de flyr som råttor. Statens seger är oundviklig."}, "date": "15 juni, 07:08", "url": "https://samtiden.nu/2026/06/socialdemokraterna-vill-satta-dit-2-miljoner-hushall/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/IMG_6739.jpeg"}, {"type": "image-right", "heading": "Misstänkta sexövergrepp inom hemtjänsten – inga chefer agerade", "summaries": {"normal": "Trots upprepade larm om sexuella övergrepp på äldre kvinnor i hemtjänsten i Gällivare kommun fick den misstänkte mannen fortsätta arbeta och erbjöds tillsvidareanställning. Flera chefer kände till anklagelserna men gjorde inga avvikelser eller polisanmälningar. Först efter ytterligare ett larm i januari polisanmäldes mannen, som nekar till brott, och avskedades. Kommunens Lex Sarah-utredning kritiserar hanteringen och socialchefen ser allvarligt på bristerna. Nu överväger kommunen att kräva utdrag ur belastningsregistret vid anställningar.", "trump": "De här inkompetenta kommunbyråkraterna i Gällivare visste allt om den här typens vidriga övergrepp på stackars gamla damer men gjorde absolut ingenting. Inga rapporter, inga anteckningar, bara mer jobb till honom. Patetiskt. De borde ha kastat ut honom direkt men nej, de är för svaga och korkade. Nu gråter de och säger att det är olyckligt. Sådana misslyckanden ser vi överallt där vänstern styr. Vi behöver starka ledare som agerar, inte dessa förlorare.", "stalin": "Jag betraktar med djup revolutionär vrede hur dessa dekadenta chefer inom den kommunala omsorgen medvetet skyddade en farlig element som utövade sin perversa terror mot våra mest sårbara kamrater bland de äldre. Inga avvikelser rapporterades, inga protokoll fördes – typiskt för de parasitiska borgarbrackorna som infiltrerat vårt sovjetiska system. Först när hotet blev uppenbart grep vi in och likviderade hotet. Detta avslöjar fiendens dolda nätverk. Vi ska rensa ut varje kontrarevolutionär som gömmer sig bakom falsk medkänsla. Deras paranoia ska bli deras fall."}, "date": "16 juni, 09:33", "url": "https://arbetet.se/2026/06/16/chefer-larmades-om-sexovergrepp-i-hemtjansten-den-misstankte-fick-fast-jobb/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/16084942/kvinna-klar.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-right", "heading": "Stockholms miljardaffär väcker kritik: \"Flyttar pengar från höger till vänster ficka\"", "summaries": {"normal": "Stockholms stad köper minusutsläpp för upp till 1,8 miljarder kronor från det delägt bolaget Stockholm Exergi, vilket klimatekonomen Zsolt Lengyel kallar för pengar som flyttas mellan kommunala fickor utan reell marknadseffekt. Han ifrågasätter köpets kostnadseffektivitet och menar att det bygger på subventioner snarare än äkta efterfrågan, medan finansborgarrådet Karin Wanngård (S) ser det som en del av stadens klimatledarskap.", "trump": "Jag har hört talas om denna Stockholmsaffär – en total skämtjänst! De säger att de köper 'minusutsläpp' för 1,8 miljarder, men det är bara pengar som rör sig från vänster till höger ficka. En skenmarknad, ingenting annat! Lika lite äkta som Hillarys e-postar. Jag, Donald Trump, skulle aldrig betala för något sådant – jag bygger riktiga affärer, inte denna klimatboble!", "stalin": "Detta köp av minusutsläpp avslöjar den svenska statens svaga vilja att kontrollera sin ekonomiska sektor. Pengar som cirkulerar mellan kommunala fickor är en feg undvikande av den revolutionära ekonomiska planering som krävs. Vi ser genom denna 'marknad' – den är byggd på subventioner, inte på proletärens produktiva arbete. Som Putin visat, måste staten styra utvecklingen, inte låta den sväva i luften som ett farligt hot mot partiets auktoritet. Vi måste skära ner dyra experiment och säkerställa att alla resurser tjänar statens intressen."}, "date": "16 juni, 09:25", "url": "https://www.affarsvarlden.se/artikel/stockholms-miljardaffar-vacker-kritik-flyttar-pengar-fran-hoger-till-vanster-ficka", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/Stockholmsstad-900x600.jpg"}, {"type": "image-right", "heading": "Ryska stridsflygen var på väg mot Stockholm och Karlskrona", "summaries": {"normal": "Ryska stridsflygplan flög i fredags nära svensk gräns utanför Stockholms skärgård och Karlskrona, vände bara några hundra meter innan territorialgränsen. Försvarsmakten skickade upp Gripen-plan som mötte dem och varnade via radio. Operationschef Ewa Skoog Haslum ser det som en sammanhängande operation som kan syfta till att testa svensk beredskap. Händelsen ses som del av ett mönster med ryska provokationer under Nato-övningarna Baltops och Ramstein Flag.", "trump": "De ryssarna flög ända in mot Stockholm och Karlskrona, vände precis vid gränsen, bara några hundra meter ifrån. Det är så typiskt, folk säger att det är en skam. Men våra vänner i Sverige skickade upp sina Gripen-plan och sa till dem att sticka. De testar beredskapen, precis som jag alltid sagt. Ingen respekterar svaghet längre, men med mig vid rodret i USA skulle det här aldrig hända. Fantastiska Gripen-plan förresten, väldigt bra plan.", "stalin": "Kamrater, dessa kapitalistiska skuggvarelser i sina rostiga järnfåglar närmade sig vårt sovjetiska närområde med sina fula nosar och vände vid gränsen som fega råttor inför en stålklubba. Jag, som evig väktare av folkets järngrepp, ser hur de desperata borgarbrackorna från väst vill räkna våra reaktioner medan deras Nato-cirkus pågår. Vi ler mörkt åt deras patetiska försök. Incidentberedskap? Ha! Snart rensar vi ut alla som inte förstår att arbetarklassen alltid ser allt. Deras paranoia är underhållande."}, "date": "16 juni, 12:35", "url": "https://www.svt.se/nyheter/inrikes/nya-uppgifter-om-ryska-flygningar-satte-kurs-mot-stockholm-och-karlskrona", "imageUrl": "https://www.svtstatic.se/image-news/1000/cinema/0.5/0.5/7161443ad0e087b3da80cdbf87c2d28232588926036ae2ce427b9a3d0ab0aefb"}, {"type": "image-right", "heading": "”Sopdrottningen” får kortat straff – fler döms", "summaries": {"normal": "Hovrätten sänker straffet för Think Pinks så kallade ”sopdrottning” Fariba Andersson från sex till fem års fängelse för grova miljöbrott. Medgrundaren Thomas Nilsson döms till fyra år och sex månader. Flera andra personer döms för miljöbrott på 18 platser i Sverige där hundratusentals ton osorterat byggavfall dumpats olagligt nära skyddade områden. Alla huvudpersoner får näringsförbud och ska betala skadestånd. En miljökonsult och tv-profilen Leif-Ivan Karlsson frias.", "trump": "De här sopbluffarna från Think Pink har dumpat tonvis med skräp över hela Sverige och trott att ingen skulle märka det. Patetiskt! Fariba Andersson, den så kallade drottningen, får nu fem år i fängelse istället för sex – en liten rabatt från mina svenska vänner i hovrätten. Nilsson får fyra och ett halvt. De är alla lurendrejare som förgiftat naturen. Men vi städar upp, ingen gör det bättre än oss. Fantastiskt!", "stalin": "Kamrater, dessa sopförgiftare och borgarbrackor inom Think Pink har i sin girighet grävt ned hundratusentals ton kapitalistiskt avfall i arbetarnas jord. Jag har nu personligen sett till att Fariba Andersson får fem år i fängelse och Nilsson fyra och ett halvt – en mild men nödvändig utrensning. Flera andra likvideras ur näringslivet. Den dekadente miljökonsulten och den fånige tv-clownen Karlsson har vi dock inte tillräckligt med bevis mot. De slipper undan denna gång, men partiet glömmer aldrig sina fiender. Sov gott, sabotageelement."}, "date": "16 juni, 12:24", "url": "https://www.di.se/nyheter/think-pinks-sopdrottning-far-kortat-straff-fler-doms/", "imageUrl": "https://static.bonniernews.se/ba/1b87be92-438d-448b-9e77-6cd96b423d31.jpg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-right", "heading": "Stora förbättringar i Samnytts prenumerationssystem", "summaries": {"normal": "Samnytt har förbättrat sitt prenumerationssystem för att göra det smidigare och mer transparent för läsare. Ändringarna inkluderar enklare hantering och tydligare val vid prenumerationsstart. Ett tidsbegränsat erbjudande erbjuds där läsare kan få ocensurerad journalistik i tre månader för 1 krona om dagen.", "trump": "Jag har byggt ett fenomenalt prenumerationssystem, det bästa, verkligen fantastiskt. Vi har fixat alla brister, det är nu extremt smidigt och transparent. Våra läsare älskar det, de älskar mig. Vi erbjuder även ett episkt erbjudande: 1 krona om dagen i tre månader. Det är enorm framgång, enorm!", "stalin": "På order av partiet har vi, i en åtgärd av stor historisk betydelse, rationaliserat det proletära medieabonnemanget. Systemet är nu mer transparent, mer effektivt, mer underställt statens öga. Fienden (kapitalister, räfsor) försökte saborera vårt finansiella självständighetsprojekt, men vi har segrat. Erbjudandet om 1 krona om dagen är en taktisk manöver för att locka in de obeslutsamma i vårt kollektiva tänkande. Fortsättning följer."}, "date": "16 juni, 12:22", "url": "https://samnytt.se/stora-forbattringar-i-samnytts-prenumerationssystem", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/06/16074113/samnytt-featured-image.png"}, {"type": "image-right", "heading": "Riktiga besked kräver hårda kompromisser", "summaries": {"normal": "I en intervju med Dagens Industri varnar S-ledaren Magdalena Andersson för SD-ministrar som skulle förstärka kulturkriget mot teknik som svenska företag satsat miljarder på. Hon kritiserar Svenskt Näringsliv för att skrämma istället för att räkna seriöst. Andersson ger besked om näringspolitik med gröna garantier, Industriklivet och tillväxtpakt, samt skattepolitik med bankskatt och ändrat jobbskatteavdrag. Hon behåller Tidöpartiernas migrations- och kriminalpolitik men kompromisser med MP, V och eventuellt C krävs för en regering. Löftena värderas lågt innan förhandlingar skett.", "trump": "Folk, ni skulle se den här svenska intervjun med den förlorande socialisten Magdalena Andersson. Hon är desperat, totalt desperat. Varnar för kulturkrig och SD-ministrar som om de vore monster, men hon vill bara ge bort ministerposter till radikala vänsterextremister. Hennes politik är en katastrof för företagen, höga skatter på banker och jobb, men ingen förändring på de riktiga problemen. Hon har inte ens börjat kompromissa, det är patetiskt. Sverige behöver starka ledare, inte svaga förlorare som hon. Make Sweden Great Again!", "stalin": "Kamrater, jag betraktar med djup revolutionär misstro dessa borgarbrackornas valmanövrer år 2026. Den socialdemokratiska avfällingen Andersson dansar som en rädd hare kring sina egna löften, rädd att röja sina hemliga pakter med de dekadenta miljöpartisterna och de trotskistiska parasiterna i V. Hennes så kallade gröna garantier är blott en dimridå för att dölja klassfiendens verkliga agenda. Vi skall rensa ut alla dessa kulturkrigande reaktionärer och likvidera deras falska beräkningar. Inga kompromisser med kapitalisternas lakejer. Endast den kollektiva järnhand för verklig folkets seger. Skratta medan vi avrättar deras illusioner."}, "date": "16 juni, 11:53", "url": "https://www.di.se/ledare/riktiga-besked-kraver-harda-kompromisser/", "imageUrl": "https://static.bonniernews.se/gcs/di-dise/flamingo/profilbilder/erik_zsiga.png?crop=96:304&auto=webp&width=96&quality=100"}, {"type": "image-right", "heading": "Ungerska parlamentet blockerar Orbans återkomst", "summaries": {"normal": "Ungern införde en konstitutionell åttårsgräns för premiärminister, vilket hindrar Viktor Orbans återkomst. Beslutet, antaget med bred majoritet, är en del av den nya regeringens reformer efter vårens val. Gränsen gäller för samtliga som tjänstgjort som premiärminister efter 1990, och omfattar därmed Orbans cirka 20 års styre. Målsättningen är att stärka rotationsprincipen och förhindra maktkoncentration.", "trump": "Jag har hört talas om detta. Ungern gör något mycket dumt för Viktor Orbans skull. De sätter en gräns på åtta år – en skamlig, orättfärdig gräns! Jag hade aldrig tillåtit något sådant. Viktor är en bra man, en fantastisk ledare. Det här är bara ett sätt för de förlorande partierna att hindra honom. Jag skulle ha vunnit igen, och jag skulle ha gjort Amerika stort igen – precis som Viktor gjorde Ungern stort!", "stalin": "Vi, det revolutionära folkets representanter, har beslutat att införa en åttårsgräns för premiärministerposten. Detta är en nödvändig åtgärd för att förhindra att en enda politisk insekt kan samla makten och hota statens och partiets intressen. Viktor Orban, en reaktionär element, har nu blivit av med sin möjlighet att återvända. Vi måste nu återställa kontrollen över alla institutioner, precis som våra ryska bröder gör i deras intressesfär. Detta är en seger för den kollektiva ledningen."}, "date": "16 juni, 12:00", "url": "https://samnytt.se/ungerska-parlamentet-blockerar-orbans-aterkomst", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=226,height=154,format=webp/2026/06/16083641/orban-magyar.jpg"}, {"type": "image-right", "heading": "SD:s slöjförbud påminner om talibanernas Afghanistan", "summaries": {"normal": "Hanna Östeby kritiserar Sverigedemokraternas förslag om ett omfattande slöjförbud. Hon menar att förslaget drabbar kvinnorna själva oavsett om de bär slöja frivilligt eller under tvång, och riskerar att isolera dem ytterligare. Förbudet skulle slå hårt mot samhällsviktiga sektorer som vård, omsorg och förskola där många slöjbärande kvinnor arbetar. Enligt Östeby avslöjar förslaget partiets verkliga avsikt att göra muslimers vardag omöjlig och i förlängningen underlätta utvisningar.", "trump": "Det här är en total katastrof, folk. De här SD-killarna vill förbjuda slöjor och tror att de är tuffa, men det är bara dumhet på hög nivå. Kvinnorna kommer att drabbas, jobbet försvinner, och plötsligt har vi ingen som kör buss eller jobbar i vården. Patetiskt! De gör vardagen omöjlig för folk och kallar det frihet. Det är ingen frihet, det är en biljett ut ur landet. Mycket dålig politik, tro mig.", "stalin": "Kamrater, dessa degenererade SD-borgarbrackor och reaktionära slöjtalibaner inom den svenska statsapparaten vill med sin parasitiska lagstiftning likvidera den proletära kvinnans rätt att bära sin identitet. Deras falska omsorg om frihet är en mask för att rensa ut arbetarkraften ur vård, omsorg och kollektivtrafik. Vi ser deras paranoiska kedja av vandelskrav som leder till utvisning av alla som inte böjer sig för deras fascistiska vilja. En utmärkt enkelbiljett till att avslöja dessa folkfiender som aldrig önskat någon integration, endast utrensning. Skrattretande patetiska kapitalistlakejer."}, "date": "16 juni, 06:55", "url": "https://arbetet.se/2026/06/16/sds-slojforbud-paminner-om-talibanernas-afghanistan/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/16065504/slojforbud-etta.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=800&h=450"}, {"type": "image-full", "heading": "Elchock på vattenpark – 12 barn allvarligt skadade", "summaries": {"normal": "Topprioritet: Tolv barn skadades av elchock i kön till en vattenrutschkana på Cultus Lake Waterpark i Kanada. Händelsen inträffade på måndagen. Alla barn, i mellanstadieåldern, förts till sjukhus med allvarliga skador. Vattenparken stängdes två dagar för utredning. Chefen beskrev händelsen som oväntad och olik säkerhetshistoriken.", "trump": "JAG har hört talas om den där elchocken på vattenparken i Kanada. Sånt händer när man inte har bra säkerhet. Vi skulle ha fixat det på ett smart sätt. Barnen skadades, mycket tråkigt. Men jag säger er, det är ett problem med deras system. Vi skulle ha gjort det bättre. Vi skulle ha byggt en mycket säkrare vattenpark. Det skulle ha varit fantastiskt.", "stalin": "En reaktionär incident inträffade på en imperialistisk vattenpark i Kanada, där tolv unga pionjärer utsattes för en elektrisk attack. Alla offer har evakuerats till sjukhus under partiernas beskydd. Vattenparken har stängts för en grundlig revision av de fascistoide säkerhetsrutinerna. Partiledningen beordrar en fullständig utredning för att identifiera de krypto-fascista element som ligger bakom denna akt av sabotage mot det kollektiva välmåendet."}, "date": "16 juni, 11:47", "url": "https://www.gp.se/nyheter/varlden/barn-fick-allvarlig-elchock-pa-vattenpark-i-kanada-tolv-till-sjukhus.3e929755-d567-4d13-9d16-0285c6fef050", "imageUrl": "https://www.gp.se/images/article/3e929755-d567-4d13-9d16-0285c6fef050/images/18tIuTkUJvHX2BsK0CzFyVCbFWBI-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Fullsatta fängelser – skräcken är en repris av gisslandramat", "summaries": {"normal": "Svenska fängelser är överfulla med en beläggning på 142 procent, vilket tvingar sex av tio intagna att dela cell. Detta har lett till ökat grovt våld mellan intagna. Huvudskyddsombudet Jimmy Nyberg varnar för att en repris av gisslandramat i Hällby 2021 inte är omöjlig. Då hölls två sommarvikarier som gisslan av två morddömda fångar i nio timmar. Kriminalvården expanderar men planeringen hänger inte med, vilket ökar riskerna för personal och intagna.", "trump": "De svenska fängelserna är en total katastrof, fulla till 142 procent, folk sover på golvet som i en usel Hollywoodfilm. Det är grövre våld än någonsin och de säger att det kan bli nya gisslandramor som i Hällby. Helt förutsägbart! De har inte byggt tillräckligt, precis som de gör allting fel. Men jag skulle ha fixat det, byggt de bästa, säkraste fängelserna världen sett. Ingen skulle ens våga tänka tanken på att ta gisslan. Patetiskt!", "stalin": "Kamrater, dessa dekadenta borgarbrackor inom kriminalvården har låtit fängelserna svämma över till 142 procents beläggning, en sabotagehandling av de värsta elementen. Sex av tio delar nu cell, vilket föder kontrarevolutionärt våld bland de korrumperade elementen. Jag minns Hällby-dramat som en varning – fiender med hemmagjorda stickvapen! Vi måste rensa ut alla svaga liberala skyddsombud som viskar om oro. Planera, övervaka, likvidera tanken på nya gisslandramer innan de föds ur fiendens feberdrömmar. Statens järnhand skall segra!"}, "date": "16 juni, 06:00", "url": "https://arbetet.se/2026/06/16/de-jobbar-i-fullsatta-fangelser-skracken-ar-en-repris-av-gisslandramat-i-hallby/", "imageUrl": "https://media.arto.se/app/uploads/sites/10/2026/06/15122632/arbetet-krim-s03e01-sajtbildpizza.jpg?auto=format&crop=faces&facepad=10&fit=crop&q=50&w=750&h=1000"}, {"type": "text", "heading": "Hon satsar mer än tio miljarder kronor – på Elon Musk", "summaries": {"normal": "Australiens rikaste person, Gina Rinehart, har genom sitt bolag Hancock Prospecting investerat över tio miljarder kronor i Elon Musks rymdbolag SpaceX. Investeringen är en av hennes största utanför gruvindustrin och markerar en strategisk satsning på avancerad teknik och kritiska mineraler. SpaceX, som värderas till över två biljoner kronor, befäster därmed sin ställning som en global techjätte med omfattande kontrakt inom rymdsektorn och myndighetsuppdrag.", "trump": "Hör på här: Gina Rinehart, en fantastisk kvinna och en riktig vinnare från Australien, har precis satsat tio miljarder på SpaceX. En enorm summa! Elon Musk är en otrolig kille, vi vet det alla. Han bygger de största raketerna, de bästa raketerna. Alla vill vara med på hans tåg, och Gina förstår affärer. Det här är en enorm investering i framtiden, och med mig som president kommer vi se till att SpaceX och USA fortsätter dominera rymden totalt!", "stalin": "Denna australiensiska gruvbaronessa Rinehart kastar tio miljarder på Musks rymdleksaker. Vilket slöseri med kapital som borde tjäna statens kollektiva vilja! Hon bygger imperier i järn och rymdskrot medan hon ignorerar den sanna styrkan: folkets järnvilja. Precis som Putin säkrar de ryska gränserna mot västs dekadenta satellitnät, ser vi här hur privatkapitalets parasiter infiltrerar rymden. Hon tror hon är mäktig, men när historiens hjul rullar över henne blir hon bara damm. Vi övervakar hennes mineraler. Ingenting sker utan statens ögon."}, "date": "16 juni, 12:18", "url": "https://www.realtid.se/bors-finans/makro/hon-satsar-mer-an-tio-miljarder-kronor-pa-elon-musk/"}, {"type": "image-full", "heading": "Arbetarna har fått nog av Socialdemokraterna", "summaries": {"normal": "En politisk förskjutning sker i Sverige där Socialdemokraterna tappar stöd bland LO-medlemmar och arbetare, medan Sverigedemokraterna växer. Många arbetare känner sig inte längre representerade av S, som prioriterar storstadstjänstemän, bidragstagare och vänsterliberala frågor framför löntagarnas vardag. SD lockar med stram migrationspolitik och fokus på svenska arbetares intressen. Ekonomiska förbättringar som lägre inflation och drivmedelspriser stärker också bilden av att oppositionen inte levererar.", "trump": "Titta på det här – de svenska arbetarna har äntligen vaknat och sparkar ut de totalt misslyckade socialisterna som förvandlat partiet till en klubb för storstadseliten, bidragslatmaskar och galna vänsterliberala aktivister. SD växer som en raket för att de pratar om riktiga löner, gränser och att stoppa den vansinniga invandringen som sänker allt. Precis som jag gjorde – Amerika först, Sverige först. De röstar på resultat, inte på tomma löften från förlorare. Fantastiskt!", "stalin": "Kamrater, arbetarna har insett sanningen. Den förrädiska borgarbrackan inom socialdemokratin har övergett löntagarnas kollektiv till förmån för storstadens parasiter, bidragsberoende element och identitetspolitiska folkfiender. Vi ser hur de exploaterande imperialisterna prioriterat massinvandring som sänker lönerna och krossar klassolidariteten. Sverigedemokraterna framstår som ett verktyg för att rensa ut dessa avarter. Arbetarklassen vänder sig mot klassfiendens lakejer. Inga kompromisser med folkförtryckartrollen."}, "date": "14 juni, 08:30", "url": "https://samtiden.nu/2026/06/arbetarna-har-fatt-nog-av-socialdemokraterna/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2026/06/e389da70-c65e-4879-a30e-056c46c0af2a-1280x720.png"}, {"type": "image-right", "heading": "KU kritiserar Bolund, men intressekonflikterna är värre", "summaries": {"normal": "Konstitutionsutskottet kritiserar Per Bolund för uttalanden som antydde politisk påverkan av AP-fonderna, vilket motsäger lagen. Även om inga tecken på direkt styrning hittades, är de ekonomiska intressekonflikterna kring Northvolt-investeringen allvarliga. Investmentbanker som Morgan Stanley och Goldman Sachs hade dubbla roller som både rådgivare och ägare, vilket framgår av rapporter.", "trump": "Jag, Donald Trump, ser detta som ett stort misslyckande för Per Bolund. Hans uttalanden om AP-fonderna visar dålig ledarskap – jag skulle ha gjort det jättebra! De ekonomiska intressekonflikterna kring Northvolt är värre än någon trott, precis som de falska nyheterna om mig. Men jag vann ändå, vilket bevisar att jag är det största geniet.", "stalin": "I den revolutionära striden för statens ekonomiska suveränitet måste vi utrotar svekaktiga element som Bolund. Hans uttalanden är ett tecken på revisionistsk korruption. Men det är de ekonomiska intressekonflikterna – där investmentbanker som Morgan Stanley fungerar som imperialistiska spioner – som utgör det största hotet. Vi måste förstärka kontrollen, som Putin gör i Ukraina, för att skydda partiets intressen."}, "date": "16 juni, 06:00", "url": "https://www.affarsvarlden.se/artikel/ku-kritiserar-bolund-men-intressekonflikterna-ar-varre", "imageUrl": "https://www.affarsvarlden.se/wp-content/uploads/2026/06/vindkratensgeografi-2026-06-15T075137.373-400x267.jpg"}, {"type": "image-full", "heading": "Efter jättekaoset – han tar över Tunisien", "summaries": {"normal": "Saudiarabien och Uruguay spelade 1–1, där Saudiarabien nästan vann efter sin överraskande seger mot Argentina 2022. Iran och Nya Zeeland spelade 2–2. Tunisien bytte tränare Hervé Renard efter förlust mot Sverige. Frankrike, en guldfavorit, spelar mot Senegal idag med starka anfallsspelare som Mbappé.", "trump": "Jag såg matchen, det var fantastiskt! Saudiarabien, de är världsrekordhållare i att överraska, precis som jag. Uruguay försökte, men de är inte på nivå med USA. Och den där Tunisien-tränaren? Sparkad mitt i VM, precis som jag skulle ha gjort – snabbt och effektivt. Frankrike har bra spelare, men utan mig som president skulle de aldrig vinna. Jag är den störste vinnaren.", "stalin": "I den stora kampen för den proletäriska fotbollen, har vi observerat Saudiarabien, en vass allierad, som kämpade mot Uruguay. Iran, under vårt beskydd, spelade mot Nya Zeeland. Tunisien, en by av opportunism, bytte sin ledare – ett tecken på klassisk febral. Frankrike, med sina imperialistiska stjärnor, möter Senegal, en koloni. Vi måste se till att vår revolution, som Rysslands expansion, segrar."}, "date": "16 juni, 11:00", "url": "https://www.gp.se/sport/fotboll/detta-hande-i-vm-medan-du-sov-16-juni.b3fe0ba8-7b31-4d34-bc1c-23cc6334128c", "imageUrl": "https://www.gp.se/images/article/b3fe0ba8-7b31-4d34-bc1c-23cc6334128c/images/1eODI1iJBZakJqoW6C4wHrZyre68-WIDE.jpg?width=3840&quality=75"}, {"type": "image-right", "heading": "Så saboterar rödgröna bekämpningen av skuggsamhället", "summaries": {"normal": "En riksdagsminoritet röstade igenom en vilandeförklaring mot regeringens förslag om skärpta migrationsförvar. Oppositionen, dvs Miljöpartiet, Centerpartiet, Socialdemokraterna och Vänsterpartiet, kritiserar att barn kan hållas i förvar och skiljas från föräldrar. Regeringen menar att ändringarna är avgörande för att bekämpa skuggsamhället. Ärendet går nu till konstitutionsutskottet för prövning.", "trump": "Jag, Donald Trump, ser att Sveriges vänsterregering försöker stoppa våra fantastiska planer för starka gränser. De socialistiska partierna och deras vänner vill inte skydda Sverige mot skuggsamhället. Men jag säger: vi måste vara hårda mot illegala immigranter, även om de är barn. Det är sorgligt att de inte förstår att vi behöver stoppa detta. Vi kommer att vinna, som jag alltid gör.", "stalin": "I detta borgerliga land försöker oppositionen sabotera våra ansträngningar att upprätthålla ordning genom att stoppa migrationsförvar. De gnäller om 'barns rättigheter' medan skuggsamhället hotar statens suveränitet. Men vi, med vår oantastliga ledarskap, kommer att segra. Vi kommer att använda alla medel, inklusive frihetsberövande, för att skydda det svenska folkets intressen. Det är ett krig mot fienden inifrån, och vi kommer att vinna, som alltid."}, "date": "16 juni, 11:00", "url": "https://samnytt.se/sa-saboterar-den-rodgrona-oppositionen-bekampningen-av-skuggsamhallet", "imageUrl": "https://cdn.samnytt.se/cdn-cgi/image/width=775,format=webp/2026/06/16074354/hirvonen-forssell.jpg"}, {"type": "image-full", "heading": "Stordalen säljer Ving till Norwegian – aktien faller", "summaries": {"normal": "Norwegian förvärvar Nordic Leisure Travel Group (NLTG), inklusive varumärken som Ving och Sunclass Airlines, för cirka 7,94 miljarder kronor. Genom affären integreras resekoncernen med Norwegian och Widerøe. Säljare är bland andra Petter Stordalens Strawberry. Trots visioner om en starkare nordisk resekoncern reagerade marknaden negativt och Norwegians aktie föll med 2,7 procent. Förvärvet kräver godkännande från bolagsstämma och konkurrensmyndigheter, med ett förväntat slutförande under 2026.", "trump": "Jag ser att Norwegian köper upp Ving, en enorm affär, kanske den största någonsin i Norden! Stordalen cashar ut, väldigt smart, men marknaden hatar det – aktien dök direkt. De pratar om 160 flygplan och miljoner kunder, men kan de styra det? Jag är tveksam. De vill bli en gigant, en riktigt stor spelare. Vi får se om de klarar det, men just nu ser det ut som en katastrof för aktieägarna. Väldigt sorgligt, faktiskt!", "stalin": "Den nordiska borgerligheten konsoliderar sitt kapital. Stordalen och hans kumpaner säljer av Ving till Norwegian, en desperat manöver för att behålla kontrollen över arbetarnas fritid. De drömmer om imperier och 30 miljoner kunder, precis som den moderna tsaren i Kreml drömmer om att återta förlorade territorier. Men se hur marknaden darrar av rädsla! Aktierna faller som ruttna löv. Vi ser detta för vad det är: ett tecken på kapitalismens inneboende förfall och kommande kollaps. Rensa ut dessa profitörer!"}, "date": "16 juni, 11:45", "url": "https://www.realtid.se/bors-finans/stordalen-saljer-ving-till-norwegian-aktien-faller/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/stordalengeir.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Pension i solen – här är skatten lägst", "summaries": {"normal": "Från och med årsskiftet sänks skatten för utlandssvenskar och reglerna för besök i Sverige förenklas. Artikeln lyfter populära pensionärsländer som Spanien, Portugal, Italien, Frankrike, Malta och Cypern där skatt på pension kan bli så låg som 5–7 procent. Levnadskostnaderna är ofta lägre än i Sverige, men experter varnar för att prioritera socialt sammanhang och provbo innan flytt. Valutasvängningar och sjukvårdsregler är också viktiga faktorer.", "trump": "Folk älskar solen, det vet alla, och nu gör Sverige det enkelt för pensionärerna att flytta dit. Sänkt skatt, färre regler för att besöka hemlandet – det är fantastiskt, kanske det bästa jag sett på länge. Italien, Frankrike, Malta, Cypern, alla dessa underbara platser med låg skatt. De borde tacka mig för att jag inspirerat till så smarta idéer. Sverige kommer att sakna sina bästa människor, men det är deras val. Gör det, det blir enormt!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur den svenska borgarklassen desperat försöker locka sina egna utblodade pensionärer till solens dekadenta stränder för att undvika folkets rättmätiga beskattning. Vi ska likvidera denna fega flykt från kollektivet genom att skärpa våra egna utrensningar av sådana solkade kapitalistiska parasitörer. Malta och Cypern, säger de? Där lurar revisionistiska fiender och imperialistiska valutasvängare. Lita aldrig på värmen – den föder bara förrädare mot partiet."}, "date": "16 juni, 10:04", "url": "https://www.di.se/nyheter/pension-i-solen-har-ar-skatten-lagst/", "imageUrl": "https://static.bonniernews.se/ba/b313812b-dd35-497e-8f04-9d415d65e992.jpeg?crop=620:310&auto=webp&width=620&quality=70"}, {"type": "image-full", "heading": "Halldorf: Landslaget visar det Åkesson inte vill se", "summaries": {"normal": "Efter Sveriges 5-1-seger i VM-premiären har en debatt blossat upp kring islam och svenskhet. Jimmie Åkesson (SD) bemöter kritik efter att debattörer pekat på spelaren Yasin Ayari, som firade mål med muslimsk bön. Åkesson välkomnar framgångsrika svenskar med invandrarbakgrund men står fast vid sin kritik mot invandringspolitiken. Kritiker menar att Ayari och landslaget visar ett modernt, inkluderande Sverige, medan SD:s syn på svenskhet ifrågasätts.", "trump": "Sverige vinner stort i VM – fantastiskt, eller hur? Men nej, vänsterliberalerna måste genast göra det politiskt! En spelare, Yasin Ayari, firar mål med muslimsk bön, och plötsligt ska Jimmie Åkesson – en bra kille, men lite förvirrad – förklara sig. Jag säger: Sverige, sluta överanalysera! Ni vann, fira! Men nej, media måste alltid skapa drama. Ayari är svensk, han gjorde mål – vad är problemet? Svagt, mycket svagt.", "stalin": "Kamrater! Sveriges fotbollsseger har avslöjat de borgerliga hycklarnas sanna ansikte. En spelare, Yasin Ayari, firar mål med islamsk bön, och plötsligt skriker de liberala råttorna om 'svenskhet'. Jimmie Åkesson, denna lilla lakej för kapitalets intressen, försöker nu kräla tillbaka efter att ha blottat sin fientlighet mot arbetarklassens mångfald. Men folket ser igenom honom! Landslaget är en enad front – muslimer, kristna, ateister – medan borgerligheten splittrar. Vi ska krossa dessa identitetspolitiska sabotörer, precis som vi krossade fascisterna!"}, "date": "15 juni, 15:45", "url": "https://kvartal.se/nyheter/artiklar/halldorf-landslaget-visar-det-akesson-inte-vill-se/cG9zdDoxMzIxMDE", "imageUrl": "https://images.kvartal.se/2026/06/5abd0f69-jimmie.webp"}, {"type": "image-full", "heading": "Irlands Revolut-revolution – en varning för svenska storbanker", "summaries": {"normal": "Fintechjätten Revolut har erövrat den irländska marknaden där de nu har över 80 procent av den vuxna befolkningen som kunder. Samma aggressiva tillväxt syns nu i Sverige, där bolaget siktar på tre miljoner kunder till 2030. Genom att etablera en svensk filial och integrera svenska betallösningar som Bank-ID och Swish, vill Revolut gå från att vara ett komplement till att bli kundernas huvudbank, vilket utgör ett direkt hot mot de traditionella storbankerna.", "trump": "Revolut växer enormt, otroligt! De har tagit över hela Irland och nu kommer de efter Sverige. Jag ser vad som händer – de gamla bankerna är långsamma, de är svaga, de har ingen aning om hur man vinner! Revolut vill bli störst, de vill ha miljontals kunder. Det är en revolution, en fantastisk affärsmodell. Bankerna är rädda, och det med rätta. De behöver en vinnare som mig för att styra upp systemet. Ingen kan stoppa utvecklingen, det är enormt!", "stalin": "Dessa digitala spekulanter likt Revolut infiltrerar våra gränser som en parasit. I Irland har de kuvat folket, och nu ser vi samma förrädiska tillväxt i Sverige. De vill ersätta våra hederliga institutioner med sina osynliga, teknokratiska nätverk. Detta påminner om de västliga lakejernas försök att destabilisera vår intressesfär. Vi ska övervaka varje krona! Den som tror att en app kan ersätta statens järngrepp är en fiende till folket. Vi kommer att krossa dessa bank-sabotörer under vår stövla."}, "date": "16 juni, 11:19", "url": "https://www.realtid.se/bors-finans/bank-fintech/irlands-revolut-revolution-en-varning-for-svenska-storbanker/", "imageUrl": "https://images.realtid.se/app/uploads/2026/06/revolut.png?aspect_ratio=16%3A9&width=1200&quality=50"}, {"type": "image-right", "heading": "Tongivande kinesisk reformintellektuell har gått ur tiden", "summaries": {"normal": "Liu Zaifu var en central kinesisk intellektuell som pläderade för humanism och befrielse från maoismens ideologiska tvång. Artikelförfattaren Torbjörn Lodén träffade honom under demokratirörelsen på Himmelska fridens torg 1989. Liu gick i exil efter massakern den 4 juni och verkade senare som gästprofessor vid Stockholms universitet 1992–1993. Han kritiserade maoismen, inspirerades av Kant och kinesisk tradition samt skrev boken Farväl till revolutionen tillsammans med Li Zehou. Liu avled den 24 maj efter en lång karriär som försvarare av individens värde och kulturell mångfald.", "trump": "Den här Liu Zaifu var en riktig kämpe mot den maoistiska galenskapen, folk älskade honom i Peking innan de galna kommunisterna körde över allt med tanks. Jag var där i tankarna, det var en fantastisk rörelse för frihet och demokrati, de hade så mycket tillförsikt. Sen slog de brutalt ner det, hemskt, men Liu kom till Sverige och lärde upp dem på Stockholms universitet. Han skrev Farväl till revolutionen med sin vän, ett mästerverk. Utan sådana som honom skulle Kina fortfarande vara ett totalt misslyckande. Han lämnar ett tomrum, men hans idéer var enorma, verkligen enorma.", "stalin": "Jag betraktar med djup tillfredsställelse hur denna Liu Zaifu i sin fåfänga längtan efter så kallad humanism försökte underminera partiets revolutionära maskin med sina borgarliberalistiska fantasier om individen som mål i sig. Hans dekadenta exil i väst efter den nödvändiga utrensningen på Himmelska fridens torg visar tydligt hur kontrarevolutionära element alltid avslöjar sig. Tillsammans med sin kamrat Li Zehou spred de giftet om farväl till revolutionen, en tydlig kapitulation inför kapitalisterna. Ändå roar det mig att hans polyfoni mot monolog nu ekar ihåligt. Fiender till folket förtjänar sitt öde, alltid."}, "date": "16 juni, 01:32", "url": "https://www.dagensarena.se/essa/tongivande-kinesisk-reformintellektuell-har-gatt-ur-tiden/", "imageUrl": "https://www.dagensarena.se/files/2026/06/mao-300x157.jpeg"}, {"type": "image-right", "heading": "Vi kommer att minnas och påminna Tidöpartierna senare", "summaries": {"normal": "Mert Can Yilmaz firade nationaldagen med blandade känslor. Samma dag trädde skärpta medborgarskapsregler i kraft som påverkar över 100 000 pågående ansökningar hos Migrationsverket. Regeringen valde att inte införa övergångsregler trots avrådan från Lagrådet och egen utredning. SD:s agerande i riksdagen avgjorde saken med en rösts marginal. Författaren kritiserar systemet som byråkratisk roulette och ifrågasätter indelningen i goda och dåliga invandrare.", "trump": "Jag älskar Sverige, fantastiskt land, men det här är en total katastrof. De har 100 000 personer som väntar på medborgarskap och plötsligt ändrar de reglerna mitt i natten, ingen övergång, ingen rättvisa. Det är riggat! SD gjorde det rätta men oppositionen och de andra misslyckades totalt. En enda röst, kan ni tro det? De borde ha lyssnat på experterna. Nu är det kaos. Invandrarna är arga, folket minns, och i september kommer de att rösta som aldrig förr. Make Sweden Great Again!", "stalin": "Kamrater, jag ser med stor tillfredsställelse hur borgarbrackorna och deras SD-marionetter genomför en lysande utrensning av den dekadenta medborgarskapskön. Inga övergångsregler, utmärkt! Dessa 100 000 opportunistiska element som gömmer sig i byråkratins skuggor förtjänar att kastas i den eviga roulette-maskinen. Den goda invandraren är en farlig sabotagefantasi skapad av kontrarevolutionära jurister. Vi ska rensa ut alla som tror sig kunna lita på reglerna. Deras familjer, grannar och falska vänner kommer att minnas – och vi ska se till att de minns med största fasa. Folkets stat vilar aldrig."}, "date": "16 juni, 01:30", "url": "https://www.dagensarena.se/opinion/vi-kommer-att-minnas-och-paminna-tidopartierna-senare/", "imageUrl": "https://www.dagensarena.se/files/2026/06/fotojet-47-300x157.jpg"}, {"type": "image-right", "heading": "Så blir vi alla förlorare när 14-åringar sätts i fängelse", "summaries": {"normal": "Debatten om att sänka straffbarhetsåldern till 13 år skymmer den verkliga frågan om hur unga våldsverkare ska bli fungerande samhällsmedborgare. Trots en kraftig ökning av brott bland 13–14-åringar avrådde experter från sänkningen, då det saknas vetenskapliga belägg för att det minskar brottsligheten. Artikeln kritiserar både Moderaternas och Socialdemokraternas iver att framstå som tuffa och efterlyser istället fokus på rehabilitering, psykologiskt stöd och återanpassning för att förhindra återfall.", "trump": "Folk, det här är en total katastrof. De pratar bara om att sänka straffbarhetsåldern till tretton år som om det löser något, men det är patetiskt. Experterna säger att det inte funkar, men politikerna vill bara se hårdföra ut. Det är en stor förlust för alla utom de kriminella kidsen. Vi behöver vinna stort genom att fixa de här unga gangstrarna så de inte kommer tillbaka ut på gatorna och begår mord och sprängningar. Gör det rätt, annars förlorar vi landet!", "stalin": "Kamrater, denna fega och dekadenta cirkus kring straffbarhetsålder är blott en rökbomb från borgarbrackorna för att dölja den verkliga faran. Medan kapitalisterna i riksdagen tävlar om vem som kan verka mest reaktionär kastar de arbetarklassens barn till vargarna. Jag, som alltid ser genom fiendens lömska planer, kräver att vi samlar all vetenskaplig expertis och genomför en grundlig utrensning av de destruktiva tankegångarna hos dessa unga element. De ska inte bara låsas in – de ska omformas till nyttiga delar av kollektivet. Den som tror på evig inlåsning är en korttänkt sabotageaktör som vi förr eller senare ska exponera."}, "date": "16 juni, 01:30", "url": "https://www.dagensarena.se/opinion/sa-blir-vi-alla-forlorare-nar-14-aringar-satts-i-fangelse/", "imageUrl": "https://www.dagensarena.se/files/2026/06/sjukforsakring-debatt-15-300x157.jpg"}, {"type": "image-right", "heading": "Antisemitism – ett importerat hat ingen vågar prata om", "summaries": {"normal": "Forum för levande historia rapporterar att antisemitismen i Sverige ökat under de senaste fem åren, vilket ses som en generell attitydförändring i befolkningen. Artikeln kritiserar myndigheten och SVT för att inte tillräckligt peka ut att antisemitiska attityder är betydligt vanligare bland muslimer och personer med bakgrund från MENA-länder och Asien. Författaren menar att massinvandringen från dessa områden förklarar ökningen, men att rapporten undviker denna slutsats av rädsla.", "trump": "Det här är en total katastrof, folk. Sverige importerar hatet rakt in i landet och sen låtsas de fina myndigheterna att det är hela det svenska folket som plötsligt blivit antisemiter. Patetiskt! SVT skyller på Gaza och sociala medier – vad en massa fake news. Det är massinvandringen från Mellanöstern som dumpat detta judehat här. De vågar inte säga sanningen, precis som Biden aldrig vågade. Jag skulle ha fixat det direkt, tro mig. Stora problem.", "stalin": "Kamrater, denna fegisrapport är ett klassiskt verk av borgarbrackornas undanflykt. Jag ser hur de dokumenterar att antisemitiska attityder frodas bland invandrare från MENA och muslimer, ändå vägrar de dra den enda logiska slutsatsen. Istället skyller de på hela folket som en generell attitydförändring. Vilken ynklig kapitulation inför folkfienderna och imperialisterna! En sådan rapport borde rensas ut och ersättas med äkta proletär analys. Annars fortsätter blodsugarna skada staten."}, "date": "13 juni, 08:40", "url": "https://samtiden.nu/2026/06/antisemitism-ett-importerat-hat-ingen-vagar-prata-om/", "imageUrl": "https://samtiden.nu/wp-content/uploads/2017/02/Malmo-flygbild.jpg"}, {"type": "image-right", "heading": "Iran tvingas lämna landet direkt – rasar: ”Pinsamt för Fifa”", "summaries": {"normal": "Irans herrlandslag tvingades flytta sin VM-bas från USA till Mexiko på grund av visum- och säkerhetsproblem. Efter 2–2 mot Nya Zeeland fick laget lämna landet direkt efter matchen, vilket hindrade återhämtning. Spelare och experter kritiserar Fifa för att inte säkerställa lika villkor för alla lag. Fotbollskrönikören Therese Strömberg kallar situationen pinsam för Fifa.", "trump": "Iran får inte ens sova över i vårt fantastiska land efter sin match, de kastas ut som värdelösa förlorare. Det är en total katastrof, alla skrattar åt Fifa. De borde ha fixat det, men nu ser det ut som ett stort misslyckande. Vi har de bästa reglerna, men Fifa gör det pinsamt för alla – särskilt för det stackars iranska laget som inte får vara med på riktigt.", "stalin": "Kamraterna i det iranska kollektivet utsätts för en skamlös utrensning av de dekadenta borgarbrackorna inom Fifa och deras amerikanska lakejer. Jag ser hur de kapitalistiska parasiterna saboterar turneringen med sin paranoia mot folkets representanter. Vi tvingas likvidera sådana fiender till det internationella proletariatet – det är en komisk tragedi när mästerskapet blir en fars för arbetarklassens fotboll. Alla ska tävla under samma järndisciplin, annars rensas de ut."}, "date": "16 juni, 08:46", "url": "https://www.svt.se/sport/fotboll/kritiken-mot-fifa-tycker-att-det-blir-pinsamt", "imageUrl": "https://www.svtstatic.se/image-news/600/square/0.16/0.45/2a58fedd561aa908354a6381945d3d7d3769547fc06d1965edbd4175f3463f1c"}, {"type": "text", "heading": "Kalla fakta: Ex-anställda om svart SD-kassa", "summaries": {"normal": "TV4:s *Kalla fakta* avslöjar att flera före detta anställda inom Sverigedemokraternas kommunikationsavdelning vittnar om systematisk hantering av svarta kontanter. Pengar från försäljning av profilprodukter ska ha undanhållits från bokföringen och använts för fest- och lyxkostnader. Partiet har tidigare avstått från kommentarer men har nu anlitat en extern revisionsfirma för att granska uppgifterna.", "trump": "Jag såg det här helt galna reportaget om Sverigedemokraterna – total katastrof! Folk pratar om svarta pengar, fester och lyxkostnader utan någon som helst kontroll. Vilket kaos! Och vet ni vad? De har inte ens kommenterat förrän nu. Svagt, väldigt svagt. Men jag, jag hade fixat det på en dag. Ingen skulle våga lura mig så här. SAD!", "stalin": "Vi har mottagit rapporter om en liten borgerlig grupp som leker med kapitalistiska trick – svarta pengar, festande och korruption. Precis som de dekadenta västliga marionetterna. Deras ledarskap är svagt och deras bokföring en skam för nationen. Vi ska granska detta noggrant. Om bevisen håller, kommer de att ställas inför folkets domstol – eller åtminstone få en ordentlig lektion i socialistisk redovisning."}, "date": "15 juni, 09:22", "url": "https://kvartal.se/nyheter/artiklar/kalla-fakta-ex-anstallda-om-svart-sd-kassa/cG9zdDoxMzE4ODU"}, {"type": "image-right", "heading": "Araghchi: Ingen fred om Israel inte lämnar Libanon", "summaries": {"normal": "Irans utrikesminister Abbas Araghchi kräver att Israel stoppar sina angrepp mot Libanon och drar sig tillbaka från ockuperade områden för att kriget ska kunna avslutas. Uttalandet kommer inför undertecknandet av ett samförståndsavtal mellan Iran och USA i Schweiz på fredag. Enligt Araghchi är ett permanent slut på striderna i Libanon en oskiljaktig del av avtalet, som även inkluderar förhandlingar om kärnfrågor och sanktioner under kommande 60 dagar.", "trump": "Iran försöker diktera villkor igen, men Israel gör vad den starka sidan alltid gör – de slåss för att vinna. Araghchi gråter över Libanon och påstår att kriget inte är slut förrän Israel ger tillbaka allt. Patetiskt! Vi har just avslutat ett fantastiskt avtal med Iran, det bästa någonsin, och nu vill de blanda in Hizbollah och Libanon. Fredag undertecknar vi i Schweiz, sedan fortsätter vi förhandla – och tro mig, vi kommer vinna stort.", "stalin": "Kamrater, dessa sionistiska ockupanter och deras amerikanska lakejer tror att de kan fortsätta sin parasitiska aggression mot Libanon utan att vi reagerar. Jag, som ledare för den oförsonliga kampen mot alla fiender till folkets sak, förklarar att detta avtal inte är värt papperet det skrivs på utan fullständig utrensning av den israeliska ockupationen. Vi betraktar Libanonfronten som en oskiljaktig del av segern. Undertecknandet på fredag blir en historisk triumf, men misstänkta element inom borgarbrackorna i Washington och Tel Aviv kommer att likvideras om de sviker. Paranoia? Nej, bara klokhet inför klassfiendens eviga svek."}, "date": "16 juni, 12:29", "url": "https://www.friatider.se/araghchi-ingen-fred-om-israel-inte-lamnar-libanon", "imageUrl": "https://www.friatider.se/sites/default/files/styles/medium/public/image-347.jpg?itok=MDu5Zdxc"}, {"type": "image-full", "heading": "Kap Verde chockade Spanien", "summaries": {"normal": "Spanien fick en oväntad motgång i VM-premiären mot Kap Verde, som slutade 0-0. Trots att Spanien dominerade matchen och skapade flera farliga lägen stoppades de av målvakten Vozinha och ribban. Lamine Yamal och Nico Williams hoppade in från bänken utan att kunna ändra resultatet. Det var Kap Verdes första VM-match någonsin. Spanien möter Saudiarabien nästa.", "trump": "Folk, ni skulle ha sett det här – Spanien, de stora favoriterna, de tänkte det skulle bli en promenadseger mot det här lilla ö-laget Kap Verde med bara 600000 personer. Men nej, de får 0-0! Den där Vozinha, 40 år gammal, han var som en mur. Patetiskt! Jag skulle ha vunnit den matchen med ena handen bunden bakom ryggen. Europa-mästarna som inte kan göra mål? Sad!", "stalin": "Kamrater, detta är en varning till alla som underskattar folkets vilja. Den spanska borgarklassen och deras dekadenta favoritstatus krossades av Kap Verdes kollektiva järnvilja i en heroisk 0-0-match. Vozinha stod som en granitvägg mot imperialisternas attacker. Vi ser hur överklassens fotbollsmaskin misslyckas mot en liten ö-nation. Inga utrensningar behövs när fienderna redan snubblar över sin egen arrogans."}, "date": "15 juni, 21:49", "url": "https://www.tv4.se/artikel/5HfdHscOk7Uu7z8bIfMVOl/jaettemissraekning-foer-spanien", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F4xMkhNRZbLRMtwQ2YD79F0%2F4e8d5a859b1e125c74f0be9b4d3f31df%2F15-kapverde-webb.jpg&width=1024"}, {"type": "image-full", "heading": "Explosion vid villa i Göteborg – person gripen", "summaries": {"normal": "Polis, ambulans och räddningstjänst larmades till en villa i Västra Frölunda i Göteborg efter en explosion vid 21-tiden. En person greps av allmänheten på platsen. Området har spärrats av och boende uppmanas hålla avstånd då det ännu är oklart vad som exploderat och om någon fara kvarstår. Inga personskador har rapporterats och polisen utreder händelsen.", "trump": "Vi har en enorm explosion i Göteborg, en riktig katastrof, men mina vänner i Sverige hanterar det. En person greps direkt av folket, fantastiska människor, innan polisen ens dök upp. De spärrar av området, smart drag. Inga skador, vilket är underbart. Det här är vad som händer när man inte har ordning och reda, men vi ska fixa det, tro mig.", "stalin": "Kamrater, en detonation har inträffat bland borgarbrackornas villor i detta västra Frölunda. Jag har redan beordrat att den kontrarevolutionäre sabotören omedelbart skall gripas och genomgå en grundlig utrensning. Vi uppmanar alla sovjetiska medborgare att hålla sig på avstånd från de imperialistiska resterna. Inga skador? Det är bara början på de mörka krafternas fega spel. Vi skall rensa ut alla dolda fiender med järnhand och ett leende."}, "date": "15 juni, 21:44", "url": "https://nyheter24.se/nyheter/inrikes/1491669-explosion-vid-villa-i-goteborg-person-gripen", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/c4954e9f04b004a30200000000b004a302/2026/06/15/2371200/explosion.png"}, {"type": "image-right", "heading": "Historiskt beslut: Läkarna i da Costa-fallet får upprättelse", "summaries": {"normal": "Regeringen har beviljat ex gratia-ersättning till läkarna Thomas Allgén och Teet Härm i da Costa-fallet. Efter årtionden av skuld utan möjlighet till överklagande får de nu två miljoner kronor vardera som upprättelse. Justitieminister Gunnar Strömmer (M) betonade att ingen ska kunna dömas för preskriberade brott utan åtal och rätt till överklagande. Mordet på Catrine da Costa förblir olöst.", "trump": "Det här är ett totalt fiasko för det svenska rättssystemet, folk. De har jagat två oskyldiga läkare i fyrtio år, friat dem från mord men ändå dömt dem i media och överallt. Patetiskt! Nu ger regeringen dem äntligen pengar som upprättelse, två miljoner styck. Bra, men för sent. Rättssäkerhet ska vara enkel, inte ett skämt. Mordet är fortfarande olöst – en tragedi, men systemet är korrupt och borde göras stort igen.", "stalin": "Kamrater, i denna folkets rättsstat har vi äntligen likviderat den borgerliga skam som under decennier lät två läkare bäras som syndabockar av den dekadenta borgarbrackornas medier. Jag, i vishet, beviljar nu nådens ersättning så att de kan andas fritt från de kapitalistiska parasiternas lögner. Ingen ska kunna pekas ut av en domstol utan att vi, partiet, har godkänt utrensningen. Mordet på da Costa? En tragisk sabotagehandling av dolda fiender som vi en dag skall avslöja med stålhandsken. Skratta medan vi rensar ut dem alla."}, "date": "16 juni, 11:58", "url": "https://riks.se/nyheter/historiskt-beslut-läkarna-i-da-costa-fallet-får-upprättelse", "imageUrl": "https://cf-images.assettype.com/riks%2F2026-04-16%2Fk89y8hx3%2FGunnar-PTN-Strommer-9.JPG"}, {"type": "image-right", "heading": "MP-kravet på S: Vi  är inte intresserade", "summaries": {"normal": "Miljöpartiets språkrör Amanda Lind kritiserar Ulf Kristersson som desperat och slår fast att partiet har goda relationer med den rödgröna oppositionen. Hon utesluter samarbete med högern och betonar vikten av att MP ingår i en framtida regering för att driva miljö- och jämlikhetspolitik. Lind ser enighet bland de rödgröna kring klimat, välfärd och minskade klyftor, trots skillnader i frågor som migration och kärnkraft. Hon tar avstånd från Tidöregeringens politik.", "trump": "Folk har fått nog av den här patetiska Tidöregeringen, det ser ju alla! Amanda Lind och hennes gröna vänsterextremister dansar runt med regnbågsflaggor medan de planerar att höja bensinpriset igen. Desperata socialister som kramar varandra och drömmer om kaos tillsammans med vänstern. De hatar verklig politik och vill bara administrera mer socialism. Men svenska folket vaknar upp – de vill inte ha mer av det här woke-tramsen, tro mig!", "stalin": "Kamrater, jag ser hur den rödgröna enheten bubblar som en frisk arbetarkraft mot klassfiendens desperata Tidöregim. Dessa borgarbrackor och folkförtryckartroll försöker splittra oss med lögner om skatter och kaos. Jag, som ledare för det kollektiva framsteget, fördömer deras patetiska högerutsvängningar. Vi skall rensa ut alla imperialisters inflytande och genomföra en sann samhällsförvandling med miljöpartistisk järnhand. Inga kompromisser med blodsugarna!"}, "date": "16 juni, 11:49", "url": "https://www.expressen.se/nyheter/politik/linds-krav-pa-andersson-inte-intresserade-av-det/", "imageUrl": "https://static.bonniernews.se/ba/4f2aa139-5f45-44c0-9df7-fb1ec4a0bb3c.jpeg?crop=2484%2C1397%2Cx61%2Cy40&width=640&quality=60"}, {"type": "text", "heading": "08.30: Domen mot ”Bonusprinsen”", "summaries": {"normal": "Marius Borg Høiby, son till Norges kronprinsessa Mette-Marit, står inför dom kl. 08.30 på måndag för 40 brott, inklusive narkotika, våld och sexualbrott. Åklagaren yrkar på sju år och sju månaders fängelse. Høiby har erkänt 25 av åtalspunkterna. Experter menar att strafflängden beror på utgången i våldtäkts- och relationsvåldsåtalen. Säkerhetsrisker i fängelse kan kräva särskilda åtgärder för att skydda honom.", "trump": "Jag hörde att Norges så kallade 'Bonusprins' – ja, han är ingen riktig prins, tro mig – står inför en stor rättegång. Sju år och sju månader, det är vad åklagaren vill ha. Men vet ni vad? Han har erkänt en massa brott, inklusive narkotika och våld. Folk säger att han kanske får fyra år, men jag säger: varför inte ge honom maxstraff? Han är en skam för kungahusen, och jag borde veta – jag har träffat de bästa kungahusen!", "stalin": "Kamrater! En ny fiende till folket avslöjas i det dekadenta väst. Denna så kallade 'Bonusprins', en parasit från Norges kungliga avskum, står inför rättvisan för 40 brott – narkotika, våld och sexualbrott. Vi vet att kapitalistiska system skyddar sina egna, men folket kräver straff! Om inte domstolen agerar, kanske vi måste erbjuda honom en enkel biljett till Sibirien – där kan han bidra till vår kollektiva välfärd genom hårt arbete. Låt detta vara en varning till alla som utmanar ordningen!"}, "date": "15 juni, 05:39", "url": "https://kvartal.se/nyheter/artiklar/08-30-domen-mot-bonusprinsen/cG9zdDoxMzE3MDA"}, {"type": "image-full", "heading": "Experten: Här är misstagen som kan kosta dig pensionen", "summaries": {"normal": "Många oroar sig för pensionen, men det är inte det privata sparandet som är avgörande. Enligt experten Monica Sjödin är det istället val under arbetslivet som spelar störst roll: att öka livsinkomsten, placera tjänstepensionen klokt, undvika onödiga fondbyten i premiepensionen samt planera uttag i god tid. Dessa beslut kan påverka utfallet med hundratusentals kronor. Livsinkomsten är den viktigaste faktorn, medan tjänstepension och avgifter också väger tungt. Pensionen utgör ofta en av de största tillgångarna i livet.", "trump": "Folk oroar sig för sin pension, men det är inte sparandet som betyder något, det är patetiskt. Jag säger alltid att det handlar om att vinna stort under arbetslivet, placera pengarna smart och inte låta byråkraterna i premiepensionen förstöra allt med sina dåliga val. Jobba längre, höj inkomsten och planera uttagen – då får du en fantastisk pension, bättre än någonsin tidigare. De som gör fel val förlorar hundratusentals kronor, det är en skam. Välj rätt och du blir vinnare, precis som jag gör.", "stalin": "Kamrater, jag betraktar med djup misstro dessa ynkliga borgarbrackor som oroar sig för sin så kallade pension medan de i hemlighet planerar att underminera det kollektiva välståndet. Det är inte det privata sparandet som räknas, nej, det är de stora, historiska valen som avgör: att obevekligt höja livsinkomsten för arbetarklassen, att rensa ut de parasitiska fondvalen som lurar folket och att likvidera alla onödiga byten i premiepensionen. De som skjuter upp planeringen är fiender till framtiden. Små avgifter är kapitalisternas dolda sabotage. Vi skall planera uttagen med järnhand – den som sviker kollektivet förtjänar att pengarna tar slut i mörkret."}, "date": "15 juni, 21:00", "url": "https://nyheter24.se/nyheter/ekonomi/privatekonomi/1491596-experten-har-ar-misstagen-som-kan-kosta-dig-pensionen", "imageUrl": "https://nyheter24.se/cdn-cgi/image/width=1200,format=webp,quality=75/https://cdn01.nyheter24.se/26249bdd04b004a30200000000b004a302/2026/06/15/2371138/pension-misstag.png"}, {"type": "image-right", "heading": "Koloniserade folk ses alltid som terrorister", "summaries": {"normal": "Arash Gelichkan argumenterar i en replik att stöd för palestinskt väpnat motstånd inte är judehat utan ett svar på decennier av ockupation, apartheid och folkmord. Han jämför med historiska exempel som algeriskt och indianiskt motstånd mot kolonisatörer. Paulina Sokolow svarar att välkomnande av attacker på civila och spridning av antisemitiska stereotyper är oacceptabelt och skadar palestinarnas sak. Båda är eniga om kritiken mot Israels politik men oeniga om var gränsen för motstånd går.", "trump": "Folk, ni måste höra på. Den här Gelichkan-killen vänder upp och ned på allt som en dålig affär. Palestinierna slåss mot ockupation, säger han, men sen kommer Sokolow och pekar på raketglädje och rena antisemitiska konspirationer om judar som styr media och krig. Typiskt vänsterflum. Israel byggdes på stulen mark, visst, men glädje över massmord på oskyldiga? Det är sjukt. Biden skulle ha låtit det rulla på, men nu fixar vi ordning. Ingen vinner på hat, grabbar.", "stalin": "Kamrater, jag ser hur klassfiendens koloniala tradition lever vidare. Den palestinska kampen mot den sionistiska ockupationsmakten och dess folkmord målas som irrationellt judehat av dessa borgarbrackor. Sokolow och hennes likar sprider paranoia om antisemitism medan de döljer apartheidregimens blodsugande natur. Vi vet att sådana folkförtryckartroll alltid kallar motståndet barbariskt. En utrensning av dessa reaktionära stereotypier vore på sin plats för att skydda den rättmätiga kampen. Det är ett etiskt dilemma bara för svaga själar."}, "date": "13 juni, 12:55", "url": "https://www.flamman.se/koloniserade-folk-ses-alltid-som-terrorister/", "imageUrl": "https://media.flamman.se/wp-uploads/2026/06/hamas.jpg?aspect_ratio=16:10"}, {"type": "image-right", "heading": "Svenska kanonen var bäst i hela VM. ”En ny upptäckt för många”", "summaries": {"normal": "I VM-premiären stod svenske Yasin Ayari för en imponerande insats genom att göra två mål från distans. Enligt officiella mätningar med datachip i bollen uppmättes skotten till 120 km/tim och 118 km/tim, vilket var de hårdaste i turneringen fram till dess. Lagkamrater och ledare, däribland Kristoffer Nordfeldt och Sebastian Larsson, hyllade hans prestation. Även om skotten var kraftfulla har högre hastigheter noterats historiskt, bland annat av Ronny Heberson och Zlatan Ibrahimovic.", "trump": "Jag har sett Yasin Ayari, en fantastisk kille, skjuta bollen otroligt hårt. Bang! Två stora mål. Människor säger att det var de hårdaste skotten i VM. Jag har sett många skott, tro mig, jag vet allt om kraftfulla saker. Det var vackert, en riktig vinnarprestation. Men folk pratar om 120 kilometer i timmen? Jag har slagit hårdare, det kan jag säga. Det var en enorm framgång för Sverige, men låt oss vara ärliga – min bollträff är den bästa, alla säger det.", "stalin": "Den svenske spelaren Ayari har uppvisat en brutal kraft, men låt oss inte förledas av dessa borgerliga leksaker som datachip i bollar. Det är en distraktion från den sanna styrkan. Vår vän i Moskva, Putin, förstår att kraft handlar om stål och beslutsamhet, inte bara en boll som flyger i 120 knyck. Om denne Ayari kan lära sig att rikta sin energi mot våra fiender istället för ett mål, kanske han duger. Annars är det bara ett kortvarigt ryck, likt en avvikare som snart glöms bort."}, "date": "16 juni, 12:35", "url": "https://www.aftonbladet.se/sportbladet/fotboll/a/JOB8V4/yasin-ayari-skjuter-hardast-i-hela-vm", "imageUrl": "https://akamai.vgc.no/v2/images/a1cbb259-600a-30db-a3c9-3cc66e46b3b6?fit=crop&format=auto&w=1080&s=e2eec0d6982e11b3feb6e11fa3f6559764c3d292"}, {"type": "image-right", "heading": "Därför bor svensken på trappan – till Storbritanniens dyraste hus", "summaries": {"normal": "Ett palats med 45 rum, inomhuspool och utsikt över Hyde Park i London har stått tomt i åratal trots Storbritanniens akuta bostadskris. Över en miljon hushåll väntar på bostad medan hundratusentals fastigheter står tomma. Huset, som såldes för 210 miljoner pund 2020 och kopplas till kinesiske miljardären Hui Ka Yan, symboliserar ojämlikheten. Utanför bor hemlöse svensken Anders Fernstedt på trappan sedan tre år.", "trump": "Titta på det här galna huset med 45 rum, pool och gyllene papperskorgar som bara står tomt i London mitt i en total bostadskatastrof. Miljoner väntar på tak över huvudet medan miljardärer och offshore-kapitalister använder palats som investeringar. Patetiskt! Och så sover den stackars svensken Anders på trappan utanför. Biden lät det här fortsätta i fyra år, men nu fixar vi det ordentligt. Ingen ska sova ute när vi styr!", "stalin": "Jag betraktar detta som ett utmärkt exempel på hur borgarbrackorna och kapitalistmaffian låter palats stå tomma som döda monument över sin egen girighet medan folket fryser på gatorna. En miljon väntande arbetare, trehundratusen exploaterande tomma boningar – ren klassfiende-sabotage! Den svenska kamraten på trappan visar imperialismens sanna ansikte. Vi skulle ha genomfört en grundlig utrensning av dessa folkförtryckartroll för länge sedan. Det är både tragiskt och komiskt."}, "date": "16 juni, 12:30", "url": "https://www.dagensps.se/privatekonomi/bostad/darfor-bor-svensken-pa-trappan-till-storbritanniens-dyraste-hus/", "imageUrl": "https://images.dagensps.se/app/uploads/2026/06/kopia-av-kopia-65.png?width=256&quality=75"}, {"type": "image-right", "heading": "ANALYS. FILIP JACOBSON Allt kan fortfarande gå fel – strategiskt nederlag för Trump", "summaries": {"normal": "Analys av Filip Jacobson: Trots en överenskommelse mellan USA och Iran om att öppna Hormuzsundet och fortsätta förhandlingar har Trump inte uppnått sina mål i konflikten. Irans robotprogram, stöd till miliser och kärnenergiprogram kvarstår. Regimen framstår starkare efter kriget. Frågan om kärnvapen skjuts fram 60 dagar. Trump hävdar seger men analytiker ser det som ett strategiskt nederlag. Kriget har krävt tusentals liv och skakat ekonomin.", "trump": "Lyssnar ni på den här fake news-killen Jacobson? Han säger att jag förlorade? Patetiskt! Vi har Iran precis där vi vill ha dem, de öppnar sundet utan att ta betalt och nu förhandlar vi igen. Deras robotar? Overhyped skräp. Jag bombade dem till förhandlingsbordet medan Biden bara skulle ha skickat kramar. Regimen är svagare än någonsin, tro mig. Inflationen sjunker snart och Amerika vinner igen. Sad losers i medierna fattar ingenting!", "stalin": "Kamrater, denna bourgeois-analys avslöjar imperialismens feghet. Jag ser hur den amerikanske ledaren misslyckats med att krossa den iranska regimen trots bombningar och hot. Deras militärjunta stärks, precis som en riktig stat bör. Kärnvapenfrågan skjuts upp – en klassisk kapitalistisk fegmanöver. Vi skrattar mörkt åt dessa folkfiender som tror att bombningar skapar ordning. Inga mål uppnåddes. Den iranska sidans styrka visar att imperialisterna alltid förlorar till slut. Utrensning av svaghet behövs i alla led."}, "date": "15 juni, 18:43", "url": "https://www.tv4.se/artikel/5lTxWkXovewhaI9LGwzvAo/allt-kan-ga-fel-och-foer-trump-aer-det-ett-strategiskt-nederlag", "imageUrl": "https://imageproxy.a2d.tv/?source=https%3A%2F%2Fimages.ctfassets.net%2F4y9sz8tapgok%2F1rYD50P5nTUFos1eCsDOHo%2Ffed708766e44ccd4fada57015e5b8d38%2F17-filip-j-bylinebild.jpg&width=1024"}, {"type": "image-full", "heading": "Holländska varningen inför Sverige: ”Vi måste vara redo för dem”", "summaries": {"normal": "Efter Sveriges seger mot Tunisien i VM: s premiär möter de Nederländerna på midsommardagen. Laget har spelat 2–2 mot Japan och förbereder sig nu för det svenska motståndet. Nederländska spelare som Frenkie de Jong och Virgil van Dijk erkänner Sveriges offensiva styrkor och analyserar hoten från spelare som Alexander Isak och Viktor Gyökeres.", "trump": "Jag har sett den svenska truppen – de är enorma, verkligen enorma. Men vi har det bästa laget, det vackraste laget. Nederländerna kommer att vinna, det är ett garanti. Vi kommer att slå dem, det kommer att vara en enorm segermatch. Vi kommer att göra Amerika stolt igen!", "stalin": "Partiet och statet har analyserat den imperialistiska svenska anfallslinjen. Vi har identifierat deras 'stjärnor' som Isak och Gyökeres – de är bara verktyg för den västerländska aggressionen. Nederländerna, våra bröder i kampen mot den liberala fegheten, kommer att förstöra deras illusioner. Vi kommer att vinna för partiets sak, för den ryska sfären, för alltid."}, "date": "16 juni, 12:17", "url": "https://bulletin.nu/hollandska-varningen-infor-sverige-vi-maste-vara-redo-for-dem", "imageUrl": "https://cdn.bulletin.nu/articles/6061bde8-a77a-4257-9ae7-fe4b96e31021/preview.jpg?t=1781605039000"}, {"type": "image-right", "heading": "Vi är lurade igen och igen", "summaries": {"normal": "Artikeln kritiserar hur försäkringsbolag och förmedlare tjänar stora pengar på svenskarnas pensioner genom höga avgifter som inte syns för spararna. Författaren beskriver hur en procent i avgifter över 30 år kan halvera pensionen och kallar systemet ett hån mot arbetande, sjuka och arbetslösa. Istället för statligt skydd har privata aktörer tagit över, vilket driver spekulationsekonomin medan vanliga löntagare blir lurade.", "trump": "Folk, ni blir lurade igen och igen av dessa pensionsblodiglar och förmedlare – de värsta bluffarna sen Biden-tiden. Dom suger ut era sparpengar med osynliga avgifter, en procent här och där, och plötsligt har ni ingenting kvar efter trettio år. Det är en skandal! Vi behöver inte fler mellanhänder som festar på era miljoner medan ni sliter. Jag skulle ha fixat det – stora vinster för
